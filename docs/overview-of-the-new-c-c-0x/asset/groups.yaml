- md: "\n# Variadic Function Templates\n\nExample: type-safe printing of arbitrary\
    \ objects:\n\n```\nvoid print() { std::cout << '\\n'; }; // print 0 objects\n\
    template<typename T,\n    typename... TRest> // type of 1st object\nvoid print(const\
    \ T& obj,   // types of the rest\n           const TRest&... rest) // print 1st\
    \ object\n{\n    std::cout << obj << \" \"; // print the rest\n    print(rest..);\n\
    } // print the rest\n\ndouble p = 3.14;\nstd::string s(\"Vari\");\nprint(-22,\
    \ p, &p, s, \"adic\"); // -22 3.14 0x22ff40 Vari adic\n```\n\n- Gregor's Järvi's\
    \ article shows a compile-time-checked printf.\n- Ensures format string consistent\
    \ with passed arguments.\n\nThis example passes everything by const T&, but perfect\
    \ forwarding would probably be a better approach.\n\n# Unpacking Patterns\n\n\
    Unpacking uses the pattern of the expression being unpacked:\n\n```cpp\ntemplate<class\
    \ T, class... Args>\nshared_ptr<T> // add \"&&\" to each\n    make_shared(Args&&...\
    \ params);    // unpacked elem.\ntemplate<typename T, typename... TRest> // add\
    \ \"const\" and\n    void print(const T& obj, const TRest&... rest) // add \"\
    &&\" to each\n{\n    std::cout << obj << \" \";\n    print(rest...);\n}\n// add\
    \ nothing to\neach elem's name\n```\n\nCall to print expands to:\nprint(rest1,\
    \ rest2, ..., restn);\n\nThe ellipsis is always at the end of the pattern.\n\n\
    # Unpacking Patterns\n\n```cpp\ntemplate<typename T> // return a normalized\n\
    T normalize(T& obj); // copy of obj\ntemplate<typename F, typename... PTypes>\n\
    void normalizedCall(F func,\n    PTypes&... params) // as before\n{\n    func(normalize(params...));\
    \   // call normalize on\n} // each unpacked elem\n```\n\nCall to func expands\
    \ to:\n\n```\nfunc(normalize(params₁), normalize(params₂), ..., normalize(paramsₙ));\n\
    ```\n\n# Variadic Class Templates\n\nFoundational for TMP (template metaprogramming).\
    \ Examples:\n\n- - Type computations:\n- <type_traits> has template <class...\
    \ T> struct common_type;\n\n- - Object structure generation:\n- std::tuple<T1,\
