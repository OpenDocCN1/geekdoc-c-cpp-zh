- md: "\n# Initialization in C++98\n\nContainers require another container:\n\n```cpp\n\
    int vals[] = { 10, 20, 30 };\nconst std::vector<int> cv(vals, vals+3); // init\
    \ from another container\n```\n\nMember and heap arrays are impossible:\n\n```cpp\n\
    class Widget {\npublic:\n    Widget(): data(???) {}\nprivate:\n    const int data[5];\
    \ // not initializable\nconst float * pData = new const float[4]; // not initializable\n\
    ```\n\n# Uniform Initialization Syntax\n\nBrace initialization syntax now allowed\
    \ everywhere:\n\n```cpp\nconst int val1 {5};\nconst int val2 {5};\nint a[] { 1,\
    \ 2, val1, val1+val2 };\nstruct Point1 { ... }; // as before\nconst Point1 p1\
    \ {10, 20};\nclass Point2 { ... }; // as before\nconst Point2 p2 {10, 20}; //\
    \ calls Point2 ctor\nconst std::vector<int> cv {a[0], 20, val2};\nclass Widget\
    \ {\npublic:\n  Widget(): data {1, 2, a[3], 4, 5}\nprivate:\n  const int data[5];\n\
    };\nconst float * pData = new float[4] { 1.5, val1-val2, 3.5, 4.5 };\n```\n\n\
    When initializing a data member brace initializer, the brace initializer may be\
    \ enclosed in parentheses, e.g., the Widget constructor above could be written\
    \ like this:\nWidget(): data{1, 2, a[3], 4, 5} {}\n\n# Uniform Initialization\
    \ Syntax\n\nReally, everywhere:\n\n```cpp\nPoint2 makePoint() { return { 0, 0\
    \ }; } // return expression;\nvoid f(const std::vector<int>& v); // calls Point2\
    \ ctor\nf({ val1, val2, 10, 20, 30 }); // func. declaration\n                \
    \                // function argument\n```\n\n# Uniform Initialization Syntax\n\
    \nSemantics differ for aggregates and non-aggregates:\n\n- Aggregates (e.g., arrays\
    \ and structs):\n  Initialize members/elements beginning-to-end.\n- Non-aggregates:\n\
    \  Invoke a constructor.\n\nThe technical definition of an aggregate is slightly\
    \ more flexible than what’s above. From [dcl.init.aggr] (8.5.1/1 in N3290): “An\
    \ aggregate is an array or a class with no user-provided constructors, no [default]\
    \ initializers for non-static data members, private or protected-static data members,\
    \ no base classes, and no virtual functions.”\n\nUniform initialization syntax\
    \ can be used with unions, but only the first member of the union may be initialized:\n\
    \n```cpp\nunion u { int a; char* b };\nu = { 1 }; // okay\nu = { 0, \"asdf\" };\
    \ // error\nu = {\"asdf\" }; // error (can't initialize an int with a char array)\n\
    ```\n\nPer [dcl.init.list] (8.5.4/4 in N3290), elements in an initialization list\
    \ are evaluated left to right.\n\n# Brace-Initializing Aggregates\n\nInitialize\
    \ members/elements beginning-to-end.\n\n- Too many initializers -> error.\n- Too\
    \ few initializers -> remaining objects are value-initialized:\n  - Built-in types\
    \ initialized to 0.\n  - UDTs with constructors are default-constructed.\n  -\
    \ UDTs without constructors are value-initialized.\n\n```cpp\nstruct Point1 {\
    \ int x, y, z; }; // as before\nconst Point1 p1 = { 10 }; // same as { 10, 0 }\n\
    const Point1 p2 = { 1, 2, 3 }; // error! too many\n// initializers\n```\n\nstd::array\
    \ is also an aggregate:\n\n```cpp\nstd::array<long, 3> arr = { 1, 2, f(), 4, 5\
    \ }; // error! too many\n// initializers\n```\n\n\"UDT\" = \"User Defined Type\"\
    .\n\nC++0x does not support C99's designated initializers:\n\n```cpp\nstruct Point\
    \ { int x, y, z; };\nPoint p { .x = 5, .z = 8 }; // error!\n```\n\n# Brace-Initializing\
    \ Non-Aggregates\n\nInvoke a constructor.\n\n```cpp\nclass Point2 {\npublic:\n\
    \    Point2(int x, int y);\n};\nshort a, b;\n\nconst Point2 p1 {a, b}; // same\
    \ as Point2(a, b)\nconst Point2 p2 {10}; // error! too few args\nconst Point2\
    \ p3 {5, 10, 20}; // error! too many ctor args\n```\n\n- True for containers (details):\n\
    \  - std::vector<int> v { a, b, 3 }; // calls vector ctor\n  - std::unordered_set<float>\
    \ s { 0, 1.5 }; // calls unordered_set ctor\n\n# Uniform Initialization Syntax\n\
    \nUse of \"=\" with brace initialization typically allowed:\n\n```cpp\nconst int\
    \ val1 = {5};\nconst int val2 = {5};\n\nint a[] = {1, 2, val1, val1+val2};\nstruct\
    \ Point1 { ... };\nconst Point1 p1 = {10, 20};\n\nclass Point2 { ... };\nconst\
    \ Point2 p2 = {10, 20};\n\nconst std::vector<int> cv = {a[0], 20, val2};\n```\n\
    \n# Uniform Initialization Syntax\n\nBut not always:\n\n```cpp\nclass Widget {\n\
    public:\n    Widget(): data {1, 2, a[3], 4, 5} {} // error!\nprivate:\n    const\
    \ int data[5];\n};\nconst float * pData = new const float[4] = {1.5, val1-val2,\
    \ 3.5, 4.5 }; // error!\nPoint2 makePoint() { return { 0, 0 }; // error!\n```\n\
    \n```cpp\nvoid f(const std::vector<int>& v); // as before\nf({ val1, val2, 10,\
    \ 30 }); // error!\n```\n\n# Uniform Initialization Syntax\n\nAnd \"T var = expr\"\
    \ can't call explicit constructors:\n\n```cpp\nclass Widget {\npublic:\n    explicit\
    \ Widget(int);\n    ...\n};\nWidget w1(10); // okay, direct init\nWidget w2{10};\
    \ // ditto\nWidget w3 = 10; // error! explicit ctor not callable\nWidget w4 =\
    \ {10}; // ditto\n```\n\nDevelop the habit of using brace initialization without\
    \ \"=\".\n\n# Uniform Initialization Syntax\n\nUniform initialization syntax feature\
    \ addition, not replacement.\n\n- Almost all initialization code in C++98 remains\
    \ valid.\n- Rarely a need to modify existing code.\n\n# Brace Initialization and\
    \ Implicit Narrowing\n\nSole exception: implicit narrowing.\n\n- C++98 allows\
    \ it via brace initialization, C++0x doesn’t:\n\n```cpp\nstruct Point { int x,\
    \ y; };\nPoint p1 {1, 2.5 }; // fine in C++98: implicit double -> int\n// error\
    \ in C++0x\nPoint p2 {static_cast<int>(2.5)}; // fine in both C++98 and C++0x\n\
    ```\n\nNarrowing conversions are defined in [decl.init.list] (8.5.4/7 in N3290).\
    \ Basically, a conversion is narrowing if (1) the target type can’t represent\
    \ all values of the source type and (2) the compiler can’t guarantee that the\
    \ source value will be within the range of the target type, e.g.\n\n```cpp\nint\
    \ x { 2.5 }; // error: all conversions from floating point to integer type are\
    \ narrowing\ndouble d { x }; // error: double can’t represent all ints\nunsigned\
    \ u { x }; // error: unsigned can’t represent all ints\ndouble d { x };\nunsigned\
    \ u { 25 }; // okay: compiler knows that unsigned can represent 25\n```\n\n# Brace\
    \ Initialization and Implicit Narrowing\n\nDirect constructor calls and brace\
    \ initialization thus differ:\n\n```cpp\nclass Widget {\npublic:\n    Widget(unsigned\
    \ u);\n  ...\n  int i;\n  ...\nWidget w1(i); // okay, implicit int -> unsigned\n\
    Widget w2 (i); // error! int narrows\nunsigned u;\nWidget w3(u); // fine\nWidget\
    \ w4{u}; // also fine, same as w3's init.\n```\n\n# Initializer Lists\n\nA mechanism\
    \ to generalize aggregate initialization:\n\n- Available to all UDTs.\n- int x,\
    \ y;\n- int a[] { x, y, 22, -12, 33, 44 }; // array initialization\n- std::vector<int>\
    \ v { 99, -8, x-y, x*x }; // std. library type\n- Widget w { a[0]+a[1], x, 25,\
    \ 16 }; // arbitrary UDT\n- Available for more than just initialization, e.g.\n\
    - std::vector<int> v {}; // initialization\n- v.insert(v.end(), { 99, 88, -1,\
    \ 15 }); // multi-element insertion\n- v = { 0, 1, x, y }; // replace v’s value\n\
    - Any function can use an “initializer” list.\n\n\"UDT\" = “User Defined Type\"\
    .\n\nThe statement\n\n```cpp\nv = { 0, 1, x, y };\n```\n\ncreates no temporary\
    \ vector for the assignment, because there’s a vector::operator= taking a parameter\
    \ of type std::initializer_list.\n\n# Initializer Lists\n\nApproach startlingly\
    \ simple:\n\n- Brace initializer lists convertible to std::initializer_list objects\n\
    - Functions can declare parameters of this type.\n- std::initializer_list stores\
    \ initializer values in an array and offers these member functions:\n\n```cpp\n\
    size // # of elements in the array\nbegin // ptr to first array element\nend //\
    \ ptr to one-beyond-last array element\n```\n\nThere are no cbegin/cend member\
    \ functions for initializer_list, presumably because initializer_list<T>::begin\
    \ and initializer_list<T>::end both return const T*. There are no rbegin/rend\
    \ member functions, either, presumably because initialization lists are supposed\
    \ to be processed front-to-back.\n\nIn the standard library, std::initializer_list\
    \ objects are always passed by value. On gcc 4.5 and MSVC 10, sizeof(std::initializer_list<T>)\
    \ is 8.\n\n# Initializer Lists\n\n```cpp\n#include <initializer_list> // necessary\
