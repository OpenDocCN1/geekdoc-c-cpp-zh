  - '[PAGE 110]


    # # Futures


    Result retrieval via get:


    +   - Blocks until a return is available, then grabs it.

    - For future<T>, “grabs” = “moves (if possible) or copies.”

    - For shared_future<T> or anyKindOfFuture<T&>, “grabs” = “gets reference to.”

    - “Return” may be an exception (which is then propagated).


    Invoking get more than once on a std::future yields undefined behavior. Invoking
    get more than once on a std::shared_future yields the same result (return value
    or exception) each time. There is no need to copy such results or exceptions,
    because (1) non-exceptions are accessed by reference and (2) a copy of an exception
    is made only if the catch catch clause catching it catches by value.'
  - "[PAGE 111]\n\n# Futures\n\nAn alternative is wait:\n\n+   - Blocks until a return\
    \ is available.\n\n```\nstd::future<double> f = std::async({ return bestValue(10,\
    \ 20); });\nf.wait(); // block until lambda is done\n```\n\n+   - A timeout may\
    \ be specified.\n- Most useful when std::launch::async specified.\n\n```\nstd::future<double>\
    \ f =\nstd::async(async,(){ return bestValue(10, 20); });\n\nwhile (f.wait_for(std::chrono::seconds(0))\
    \ != // if result of lambda\n    std::future_status::ready) { // isn't ready,\n\
    \    // do more work\n}\n\ndouble val = f.get(); // grab result\n```\n\nFor unshared\
    \ futures, wait_for is most useful when the task is running asynchronously, because\
    \ if it's a deferred task (i.e., slated to run synchronously), calling wait_for\
    \ will never timeout. (It will invoke the deferred task synchronously, and you'll\
