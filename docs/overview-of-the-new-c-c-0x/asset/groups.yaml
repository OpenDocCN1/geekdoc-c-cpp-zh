  - '[PAGE 56]


    # # Initializer Lists


    A mechanism to generalize array aggregate initialization:


    +   - Available to all UDTs.

    - int x, y;

    - int a[] { x, y, 22, -12, 33, 44 }; // array initialization

    - std::vector<int> v { 99, -8, x-y, x*x }; // std. library type

    - Widget w { a[0]+a[1], x, 25, 16 }; // arbitrary UDT

    - Available for more than just initialization, e.g.

    - std::vector<int> v {}; // initialization

    - v.insert(v.end(), { 99, 88, -1, 15 }); // multi-element insertion

    - v = { 0, 1, x, y }; // replace v’s value

    - Any function can use an “initializer” list.


    "UDT" = “User Defined Type".


    The statement


    ```

    v = { 0, 1, x, y };

    ```


    creates no temporary vector for the assignment, because there’s a vector::operator=
    taking a parameter of type std::initializer_list.'
  - '[PAGE 57]


    # Initializer Lists


    Approach startlingly simple:


    +   - Brace initializer lists convertible to std::initializer_list objects

    - Functions can declare parameters of this type.

    - std::initializer_list stores initializer values in an array and offers these
    member functions:


    ```

    size // # of elements in the array

    begin // ptr to first array element

    end // ptr to one-beyond-last array element

    ```


    There are no cbegin/cend member functions for initializer_list, presumably because
    initializer_list<T>::begin and initializer_list<T>::end both return const T*.
    There are no rbegin/rend member functions, either, presumably because initialization
    lists are supposed to be processed front-to-back.


    In the standard library, std::initializer_list objects are always passed by value.
    On gcc 4.5 and MSVC 10, sizeof(std::initializer_list<T>) is 8.'
