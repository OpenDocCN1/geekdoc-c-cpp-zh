    - std::mutex m; // 互斥锁对象\n- std::lock_guard<std::mutex> L(m); // 锁定 m\n- ... //\
    \ 临区域\n- } // 解锁 m\n- 无操作。\n- 不可拷贝/移动，无赋值，无手动解锁。\n\nRAII = “资源获取即初始化”。\n通常，“lock（锁）”这一术语指的是用于管理互斥锁锁定/解锁的\
    \ RAII 或类 RAII 类。\nstd::lock_guard 既不可拷贝也不可移动。同样，拷贝没有意义。禁止移动是因为正如 Daniel Krüger\
    \ 在 2010 年 4 月 4 日 comp.std.c++ 帖子中所说，lock_guard 旨在以最小开销提供最基本的功能。如果你需要可移动的锁，应该使用\
    \ unique_lock。\n\n- std::unique_lock:灵活得多。\n- 可以在构造后锁定互斥锁，在析构前解锁。\n- 可移动但不可拷贝。\n\
    - 支持超时互斥锁操作：\n  - 通常是超时互斥锁的最佳选择。\n\n```\nusing RCM = std::recursive_timed_mutex;\
    \ // typedef\nRCM m; // 互斥锁对象\n{\n    std::unique_lock<RCM> L(m); // 锁定 m\n  \
    \  ... // 临区域\n    L.unlock(); // 解锁 m\n    ... // 什么都没有发生\n}\n```\n\nunique_lock\
    \ 的命名类比 unique_ptr。最初提过一种 \"shared_lock\" 类型（作为读写锁），但它未被采用 C++0x。\n\n# 额外的 unique_lock\
    \ 功能\n\n```\nusing TM = std::timed_mutex; // typedef\nTM m; // 互斥锁对象\n{\n    std::unique_lock<TM>\
    \ L(m, std::defer_lock); // 与 m 关联\n    // 但不锁定它\n    \n    if (L.try_lock_for(std::chrono::microseconds(10)))\
    \ {\n        // 临区域\n        ...\n    } else {\n        // 超时且未\n        // 锁定\
    \ m\n        ...\n    }\n    if (L) {\n        // 转换为 bool\n        // 临区域\n \
    \       ...\n    } else {\n        // m 未被锁定\n        ...\n    }\n}\n// 如果 m 已锁定，则解锁\n\
    \n```\n\n# 多重互斥锁获取\n\n以不同的顺序获取互斥锁会导致死锁：\n\n```\nint weight, value;\nstd::mutex\
    \ wt_mutex, val_mutex;\n\n{\n    std::lock_guard<std::mutex> wt_lock(wt_mutex);\
    \ // 线程 1 // 先锁 wt\n    std::lock_guard<std::mutex> val_lock(val_mutex); // 后锁\
    \ val\n    work with weight and value // 临区域\n}\n\n{\n    std::lock_guard<std::mutex>\
    \ val_lock(val_mutex); // 线程 2 // 先锁 val\n    std::lock_guard<std::mutex> wt_lock(wt_mutex);\
    \ // 后锁 wt\n    work with weight and value // 临区域\n}\n```\n\nstd::lock 解决了这个问题：\n\
    \n```\n{ // 线程 1\n  std::unique_lock<std::mutex> wt_lock(wt_mutex, std::defer_lock);\n\
    \  std::unique_lock<std::mutex> val_lock(val_mutex, std::defer_lock);\n  std::lock(wt_lock,\
    \ val_lock); // 获取互斥锁以避免\n                                // 死锁\n  work with weight\
    \ and value // 临区域\n}\n // 线程 2\n  std::unique_lock<std::mutex> val_lock(val_mutex,\
    \ std::defer_lock);\n  std::unique_lock<std::mutex> wt_lock(wt_mutex, std::defer_lock);\n\
    \  std::lock(val_lock, wt_lock); // 获取互斥锁以避免\n                               \
    \ // 死锁\n  work with weight and value // 临区域\n}\n```\n\nstd::lock 避免死锁的方式未指定。它可能是常规地对锁进行排序、使用退避算法等。\n\
    \n如果调用 std::lock 时传入一个已经锁定的锁对象，则会抛出异常。如果调用 std::lock 时传入互斥锁对象且其中一个互斥锁已锁定，则行为可能是未定义的。（取决于互斥锁类型的细节。）\n\
    \n# 条件变量 (Condition Variables)\n\n允许线程之间关于共享数据的更改进行通信。\n\n- 消费者等待直到生产者通知状态已更改。\n\
    \n规则：\n\n- 在持有已锁互斥锁时调用 wait。\n- wait 会解锁互斥锁，阻塞线程，并将其加入队列等待通知。\n\n条件变量类型：\n\n-\
    \ condition_variable: 在 std::unique_lock<mutex> 上等待。最高效，适用于大多数情况。\n- condition_variable_any:\
    \ 在任何锁类型上等待。\n\n# 条件变量\n\n等待参数：\n\n- 用于共享数据的互斥锁（必须）。\n- 超时（可选）。\n- 线程继续执行必须为真的谓词（可选）。\n\
    \n通知选项：\n\n- notify_one: 通知一个线程。\n- notify_all: 通知所有线程。\n\n# 等待示例\n\n```\nstd::atomic<bool>\
    \ readyFlag(false);\nstd::mutex m;\nstd::condition_variable cv;\n{\n    std::unique_lock<std::mutex>\
    \ lock(m); // 防止虚假唤醒\n    while (!readyFlag) // 等待通知\n        cv.wait(lock, []{\
    \ return readyFlag; });\n    if (cv.wait_for(lock, std::chrono::seconds(1), //\
    \ 谓词为\n            []{ return readyFlag; })) { // 真。\n            // 临区域\n   \
    \     }\n    else {\n        // 超时\n        // 临区域\n    }\n}\n```\n\natomic 类型的拷贝构造函数已删除，因此必须使用直接初始化或列表初始化语法；拷贝初始化无法编译。\n\
    \n原子类型定义在 <atomic> 中。\n\n等待函数有 wait、wait_for 和 wait_until。wait_for 和 wait_until\
    \ 之间的区别在于前者接受一个持续时间（等待多久），而后者接受一个绝对时间（等待到什么时候）。等待时间是绝对的（例如，无论发生多少虚假唤醒，上面的示例将总等待\
    \ 1 秒）。\n\n本页示例假设 readyFlag、m 和 cv 是局部变量，例如位于全局或命名空间作用域。这就是为什么 lambda 可以在不捕获的情况下引用\
    \ readyFlag。\n\n# 通知示例\n\n```\nstd::atomic<bool> readyFlag(false); // 同前\nstd::condition_variable\
    \ cv;\n{\n    readyFlag = true; // 标记为就绪\n    cv.notify_one(); // 唤醒 ~1 个线程\n\
    \    // 阻塞在 cv\n}\n{\n    readyFlag = true; // 标记为就绪\n    cv.notify_all(); //\
    \ 唤醒所有线程\n    // 阻塞在 cv（除 1 个外，其余将在 m 上阻塞）\n}\n```\n\nnotify_all 将所有阻塞线程从条件变量队列移动到相应的互斥锁队列。\n\
    \n示例未提及互斥锁，因为通知者在信号条件时不需要持有互斥锁。\n\n"
