    \n```cpp\nstd::string name(\"Buffy\");\n\nWidget w { name, 0.5, // same as\n \
    \   {5, 10, 15 }; // Widget w(name, 0.5,\n    // std::initializer_list({5,10,15}));\n\
    ```\n\n- Note the nested brace sets.\n\n# Initializer Lists\n\nThey may be templatized:\n\
    \n```cpp\nclass Widget {\npublic:\n    template<typename T> Widget(std::initializer_list<T>\
    \ il);\n};\n```\n\n```cpp\nWidget w1 { -55, 25, 16 }; // fine, T = int\n```\n\n\
    Only homogeneous initializer lists allow type deduction to succeed.\n\n```cpp\n\
    Widget w2 { -55, 2.5, 16 }; // error, T can't be deduced\n```\n\n# Initializer\
    \ Lists and Overload Resolution\n\nWhen resolving constructor calls, std::initializer_list\
    \ parameters are preferred for brace-delimited arguments:\n\n```cpp\nclass Widget\
    \ {\npublic:\n    Widget(double value, double uncertainty); // #1\n    Widget(std::initializer_list<double>\
    \ values); // #2\n    ...\n    double d1, d2;\n    ...\n    Widget w1 {d1, d2};\
    \ // calls #2\n```\n\nFor brace-delimited arguments:\n\n```cpp\nWidget w2(d1,\
    \ d2); // calls #1\n```\n\n# Initializer Lists and Overload Resolution\n\nstd::initializer_list\
    \ parameters are *always* preferred over other types:\n\n```cpp\nclass Widget\
    \ {\npublic:\n    Widget(double value, double uncertainty); // #1\n    Widget(std::initializer_list<std::string>\
    \ values); // #2\n\n    double d1, d2;\n\n    Widget w1 {d1, d2}; // tries to\
    \ call #2; fails because\n    no double ⇒ string conversion\n```\n\nBraced initializers\
    \ are viewed as std::initializer_lists if at all possible.\n\nTrue only for braced\
    \ initializers:\n\n```cpp\nWidget w2(d1, d2); // still calls #1\n```\n\nThe relevant\
    \ parts of draft C++0x wrt this topic are [over.match.list] (13.3.1.7 in N3290),\
    \ [dcl.init.list] (8.5.4/2-3 in N3290), and [temp.deduct.call] (14.8.2/1 in N3290).\n\
    \n# Initializer Lists and Overload Resolution\n\nGiven multiple std::initialization_list\
    \ candidates, best match is determined by worst element conversion:\n\n```cpp\n\
    class Widget {\npublic:\n    Widget(std::initializer_list<int>); // #1\n    Widget(std::initializer_list<double>);\
    \ // #2\n    Widget(std::initializer_list<std::string>); // #3\n\n    Widget(int,\
    \ int, int); // due to above ctors, this ctor not\n    // considered for \"{...}\"\
    \ args\n\n    Widget w1 { 1, 2, 0, 3 }; // int -> double same rank as\n    //\
    \ double -> int, so ambiguous\n\n    Widget w2 { 1.0f, 2.0, 3.0 }; // float ->\
    \ double better than\n    // float -> int, so calls #2\n\n    std::string s;\n\
    \    Widget w3 { s, \"Init\", \"Lists\" }; // calls #3\n```\n\n# Initializer Lists\
    \ and Overload Resolution\n\nIf best match involves a narrowing conversion, call\
    \ is invalid:\n\n```cpp\nclass Widget {\npublic:\n    Widget(std::initializer_list<int>);\n\
    \    Widget(int, int, int); // due to above ctor, not\n    // considered for \"\
    {...}\" args\n};\nWidget w = { 1, 2.0, 3 }; // error! double -> int narrows\n\
    ```\n\n# Uniform Initialization Summary\n\n- Brace initialization syntax now available\
    \ everywhere.\n- ➡ Aggregates initialized top-to-bottom/front-to-back.\n- ➡ Non-aggregates\
    \ initialized via constructor.\n- Implicit narrowing not allowed.\n- std::initializer_list\
    \ parameters allow “initialization” lists to be passed to functions.\n- ➡ Not\
    \ actually limited to initialization (e.g., std::vector::insert).\n\n# Lambda\
    \ Expressions\n\nA quick way to create function objects at their point of use.\n\
    \n```cpp\nstd::vector<int> v;\n...\nauto it = std::find_if(v.cbegin(), v.cend(),\n\
    [](int i) { return i > 0 && i < 10; });\n```\n\nEssentially generates:\n\n```cpp\n\
    class MagicType1 {\npublic:\n    bool operator()(int i) const { return i > 0 &&\
    \ i < 10; }\n}\nauto it = std::find_if(v.cbegin(), v.cend(), MagicType1());\n\
    ```\n\nThe generated MagicType above is not technically accurate, because closure\
    \ types aren't default-constructible, but that detail isn't important for understanding\
    \ the essence of what lambdas do.\n\nI ignore mutable lambdas in this course because\
    \ use cases for them are uncommon, and this course is an overview, not exhaustive\
    \ treatment. I also ignore how capture-by-value retains the cv qualifiers of captured\
    \ variables.\n\n# Lambda Expressions\n\nAnother example:\n\n```cpp\ntypedef std::deque<Widget>\
    \ d;\n...\nstd::sort(d.begin(), d.end(),\n    [](const Widget& sp1, const Widget&\
    \ sp2)\n    { return sp1 < sp2; });\n```\n\nEssentially generates:\n\n```cpp\n\
    class MagicType2{\npublic:\n    bool operator()(const Widget& p1, const Widget&\
    \ p2) const\n    { return p1 < p2; };\n}\nstd::sort(d.begin(), d.end(), MagicType2());\n\
    ```\n\nFunction objects created through lambda expressions are closures. Again,\
    \ the generated MagicType above is not accurate because closure aren't default-constructible.\
    \ In this example, it would be possible to pass parameters by value without changing\
    \ the correctness of the code, which would cause reference count to be modified,\
    \ which could have performance impact in multi-threaded code (or even in single-threaded\
    \ code where shared_ptr increments/decrements). Per [expr.prim.lambda] (5.1.2\
    \ in N3290), closures are rvalues or prvalues, to be precise.\n\n# Variable References\
    \ in Lambdas\n\nClosures may outlive their creating function:\n\n```cpp\nstd::function<bool(int)>\
    \ returnLambda(int a)\n{\n    int b, c;\n    return [int x]{ return a*x + b*x\
    \ + c == 0; }; // won't compile, but assume it would\n}\nauto f = returnLambda(10);\
    \ // f is essentially a copy of λ's closure\n```\n\n“Invoke the lambda” is in\
    \ quotes because we’re really invoking the copy of the lambda’s closure that’s\
    \ stored inside the std::function object.\n\n# Variable References in Lambdas\n\
    \nThis version has no problem:\n\n```cpp\nint a; // now global or namespace scope\n\
    std::function<bool(int)> returnLambda() // now static\n{\n    static int b, c;\n\
    \    return [](int x) // now compiles\n    { return a*x + b*x + c == 0; };\n}\n\
    auto f = returnLambda();\n```\n\na, b, c outlive returnLambda's invocation.\n\n\
    # Variable References in Lambdas\n\nRules for variables lambdas may refer to:\n\
    \n- Locals in the calling context referencable only if \"captured.\"\n```cpp\n\
    std::function<bool(int)> returnLambda(int a)\n{\n    int b, c;\n    ...\n    return\
    \ [int x]{ return a*x + b*x + c == 0; }; // to compile, must capture a, b, c;\
    \ this example won't compile\n```\n\n- Non-locals always referencable.\n```cpp\n\
    int a;\nstd::function<bool(int)> returnLambda()\n{\n    static int b, c;\n   \
    \ ...\n    return [](int x]{ return a*x + b*x + c == 0; }; // no need to capture\
    \ a, b, c\n```\n\n# Capturing Local Variables\n\nCapturing locals puts copies\
    \ in closures:\n\n```cpp\n{\n  int minVal;\n  double maxVal;\n  ...\n  auto it\
    \ = std::find_if(v.begin(), v.end(),\n    [minVal, maxVal](int i)\n    { return\
    \ i > minVal && i < maxVal; });\n}\n```\n\nCorresponds to:\n\n```cpp\nclass MagicType{\n\
    public:\n  MagicType(int v1, double v2): _minVal(v1), _maxVal(v2) {}\n  bool operator()(int\
    \ i) const { return i > _minVal && i < _maxVal; }\nprivate:\n  int _minVal;\n\
    \  double _maxVal;\n};\nauto it = std::find_if(v.begin(), v.end(), MagicType(minVal,\
    \ maxVal));\n```\n\nThere is no way to capture a move-only type. A workaround\
    \ is to store the move-only type in a std::shared_ptr (e.g., std::shared_ptr<std::thread>),\
    \ but that requires the creator of the lambda to create a std::shared_ptr that\
    \ can then be copied into the closure. Another workaround is to eschew use of\
    \ a lambda and manually create a custom functor class.\n\n# Capturing Local Variables\n\
    \nCaptures may also be by reference:\n\n```cpp\n{\n  int minVal;\n  double maxVal;\n\
    \n  auto it = std::find_if(v.begin(), v.end(),\n    [&minVal, &maxVal](int i)\n\
    \      return i > minVal && i < maxVal);\n}\n```\n\nCorresponds to:\n\n```cpp\n\
    class MagicType{\npublic:\n  MagicType(int& v1, double &v2): _minVal(v1), _maxVal(v2)\
    \ {}\n  bool operator()(int i) const { return i > _minVal && i < _maxVal; }\n\
    private:\n  int&_minVal;\n  double&_maxVal;\n}\n```\n\n```cpp\nauto it = std::find_if(v.begin(),\
    \ v.end(), MagicType(minVal, maxVal)); // same as before\n```\n"
  mdcn: "\n\n# 列表列表 (Initializer Lists)\n\nstd::initializer_list 参数可以与其他参数一起使用：\n\n\
    ```cpp\nclass Widget {\npublic:\n    Widget(const std::string& name, double epsilon,\n\
    \    std::initializer_list<int> il);\n    ...\n};\n```\n\n```cpp\nstd::string\
    \ name(\"Buffy\");\n\nWidget w { name, 0.5, // 等同于\n    {5, 10, 15 }; // Widget\
    \ w(name, 0.5,\n    // std::initializer_list({5,10,15}));\n```\n\n- 注意嵌套的大括号集合。\n\
    \n# 初始化列表\n\n它们可以被模板化：\n\n```cpp\nclass Widget {\npublic:\n    template<typename\
    \ T> Widget(std::initializer_list<T> il);\n};\n```\n\n```cpp\nWidget w1 { -55,\
    \ 25, 16 }; // 合法，T = int\n```\n\n只有同质初始化列表允许类型推导成功。\n\n```cpp\nWidget w2 { -55,\
    \ 2.5, 16 }; // 错误，T 无法推导\n```\n\n# 初始化列表与重载解析\n\n在解析构造函数调用时，对于大括号分隔的参数，std::initializer_list\
    \ 参数会被优先考虑：\n\n```cpp\nclass Widget {\npublic:\n    Widget(double value, double\
    \ uncertainty); // #1\n    Widget(std::initializer_list<double> values); // #2\n\
    \    ...\n    double d1, d2;\n    ...\n    Widget w1 {d1, d2}; // 调用 #2\n```\n\
    \n对于普通大括号分隔的参数：\n\n```cpp\nWidget w2(d1, d2); // 调用 #1\n```\n\n# 初始化列表与重载解析\n\n\
    std::initializer_list 参数*始终* 优于其他类型：\n\n```cpp\nclass Widget {\npublic:\n    Widget(double\
    \ value, double uncertainty); // #1\n    Widget(std::initializer_list<std::string>\
    \ values); // #2\n\n    double d1, d2;\n\n    Widget w1 {d1, d2}; // 尝试调用 #2；失败原因是\n\
    \    没有 double ⇒ string 转换\n```\n\n只要可能，大括号初始化器就会被视为 std::initializer_lists。\n\
    \n仅对大括号初始化器有效：\n\n```cpp\nWidget w2(d1, d2); // 仍然调用 #1\n```\n\nC++0x 草案中关于此主题的相关部分为\
    \ [over.match.list] (N3290 中的 13.3.1.7), [dcl.init.list] (N3290 中的 8.5.4/2-3)\
    \ 以及 [temp.deduct.call] (N3290 中的 14.8.2/1)。\n\n# 初始化列表与重载解析\n\n给定多个 std::initializer_list\
    \ 候选者，最佳匹配由最元素转换决定：\n\n```cpp\nclass Widget {\npublic:\n    Widget(std::initializer_list<int>);\
    \ // #1\n    Widget(std::initializer_list<double>); // #2\n    Widget(std::initializer_list<std::string>);\
    \ // #3\n\n    Widget(int, int, int); // 由于上述构造函数，此构造函数不\n    // 被考虑 \"{...}\"\
    \ 参数\n\n    Widget w1 { 1, 2, 0, 3 }; // int -> double 级别同于\n    // double ->\
    \ int，因此存在歧义\n\n    Widget w2 { 1.0f, 2.0, 3.0 }; // float -> double 优于\n    //\
    \ float -> int，因此调用 #2\n\n    std::string s;\n    Widget w3 { s, \"Init\", \"\
    Lists\" }; // 调用 #3\n```\n\n# 初始化列表与重载解析\n\n如果最佳匹配涉及收缩转换，则调用是无效的：\n\n```cpp\n\
    class Widget {\npublic:\n    Widget(std::initializer_list<int>);\n    Widget(int,\
    \ int, int); // 由于上述构造函数，不\n    // 被考虑 \"{...}\" 参数\n};\nWidget w = { 1, 2.0,\
    \ 3 }; // 错误！double -> int 收缩\n```\n\n# 一致初始化总结\n\n- 大括号初始化语法现在随处可用。\n- ➡ 聚合体（Aggregates）从上到下/从左到右进行初始化。\n\
    - ➡ 非聚合体通过构造函数进行初始化。\n- 不允许隐式收缩。\n- std::initializer_list 参数允许将“初始化”列表传递给函数。\n\
    - ➡ 实际上并不限于初始化（例如 std::vector::insert）。\n\n# Lambda 表达式\n\n一种在用点处创建函数对象的快速方法。\n\
    \n```cpp\nstd::vector<int> v;\n...\nauto it = std::find_if(v.cbegin(), v.cend(),\n\
    [](int i) { return i > 0 && i < 10; });\n```\n\n本质上生成了：\n\n```cpp\nclass MagicType1\
    \ {\npublic:\n    bool operator()(int i) const { return i > 0 && i < 10; }\n}\n\
    auto it = std::find_if(v.cbegin(), v.cend(), MagicType1());\n```\n\n上述生成的 MagicType\
    \ 在技术上并不完全准确，因为闭包类型不是默认可构造的，但该细节对于理解 lambda 作用的本质并不重要。\n\n我在本课程中忽略了 `mutable`\
    \ lambda 表达式，因为它们的用例并不常见，且本课程是概述，而非详尽处理。我同样忽略了按值捕获如何保留捕获变量的 cv 限定符。\n\n# 捕获变量\n\
    \n捕获局部变量会产生副本：\n\n```cpp\n{\n  int minVal = 0, maxVal = 10;\n  // 捕获捕Val 的副本\n\
    \  auto f = [minVal, maxVal](int i) { return i > minVal && i < maxVal; };\n}\n\
    ```\n\n按引用捕获可以使用原始变量：\n\n```cpp\n{\n  int minVal = 0, maxVal = 10;\n  // 引用获引用Val\
    \ max引用\n  auto f = [&minVal, &maxVal](int i) { return i > minVal && i < maxVal;\
    \ };\n}\n```\n\n"
