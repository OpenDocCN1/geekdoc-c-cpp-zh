    Download from Wow! eBook: www.wowebook.com/'
  - '[PAGE 242]


    # Moving and Rvalues


    Value movement is safe when the source is an rvalue.


    +   - Temporaries go away at statement''s end.

    - No way to tell if their value has been modified.


    ```

    TVec vt1;

    v1 = createTVec(); // rvalue source: move okay

    auto vt2 { createTVec() }; // rvalue source: move okay

    v1 = vt2; // lvalue source: copy needed

    auto vt3(vt2); // lvalue source: copy needed

    ```


    ```

    std::size_t f(std::string str); // as before

    f("Hello"); // rvalue (temp) source: move okay

    std::string s("C++0x");

    f(s); // lvalue source: copy needed

    ```


    In the example declaring/defining vt2, the move could be optimized away (as could
    the copy in C++98), but that doesn''t change the fact that the source is an rvalue
    and hence a move could be used instead of a copy.'
  - "[PAGE 243]\n\n# Rvalue References\n\nC++01x introduces rvalue references.\n\n\
    +   - Syntax: T& \n- “Normal” references now known as lvalue references.\n\nRvalue\
    \ references behave similarly to lvalue references.\n\n+   - Must be initialized,\
    \ can’t be rebound.\n\n# Rvalue references identify objects that may be moved\
    \ from."
- md: "\n## Reference Binding Rules\n\nImportant for overloading resolution.\n\nAs\
    \ follows:\n\n- Lvalues may bind to lvalue references.\n- Rvalues may bind to\
    \ lvalue references to const.\n\nIn addition:\n\n- Rvalues may bind to rvalue\
    \ references to non-const.\n- Lvalues may not bind to rvalue references.\n- Otherwise\
    \ lvalues could be accidentally modified.\n\nGeneral rules governing reference\
    \ binding are in [dcl.init.ref] (8.5.3 in N3290), and rules governing the interaction\
    \ of reference binding and overloading resolution in [over.ics.ref] (13.3.1.4\
    \ in N3290) and [over.ics.rank] (13.3.2 in N3290), especially 13.3.3.2 which states\
    \ that there is a tie of binding between an lvalue or an rvalue reference, rvalues\
    \ preferably take a parameter of const T& and the other type of const T&&, because\
    \ rvalues can't bind to all non-const T parameters, and a non-const rvalue would\
    \ prefer to bind to a T& parameter over a const T parameter, because the former\
    \ would require the addition of const.\n\nThere was a time in C++00 when lvalues\
    \ were permitted to bind to rvalue references, and some compilers (e.g., gcc 4.3\
    \ and 4.4 (but not 4.5), VC10 beta (but not beta 2 or subsequent releases)) implemented\
    \ this behavior. This is sometimes known as \"version 1 of rvalue references.\"\
    \ Motivated by N2818, the rules were changed such that lvalues may not bind to\
    \ rvalue references, sometimes called \"version 2 of rvalue references.\" Developers\
    \ need to be aware that some older compilers supporting rvalue references may\
    \ implement the \"version 1\" instead of the version 2 rules.\n\n## Rvalue References\n\
    \nExamples:\n\n```cpp\nvoid f1(const TVec&); // takes const lvalue ref\nTVec vt;\n\
    f1(vt);                 // fine (as always)\nf1(createTVec());     // fine (as\
    \ always)\n```\n\n```cpp\nvoid f2(const TVec&); // #1: takes const lvalue ref\n\
    void f2(TVec&&);      // #2: takes non-const rvalue ref\nf2(vt);             \
    \  // lvalue => #1\nf2(createTVec());   // both viable, non-const rvalue => #2\n\
    ```\n\n```cpp\nvoid f3(const TVec&); // #1: takes const rvalue ref\nvoid f3(TVec&&);\
    \      // #2: takes non-const rvalue ref\nf3(vt);               // error! lvalue\n\
    f3(createTVec());   // both viable, non-const rvalue => #2\n```\n\n## Rvalue References\
    \ and const\n\nC++ remains const-correct:\n\n- const lvalues/rvalues bind only\
    \ to references-to-const.\n\nBut rvalue-references-to-const are essentially useless.\n\
    \n- Rvalue references designed for two specific problems:\n  - Move semantics\n\
    \  - Perfect forwarding\n\n- C++0x language rules carefully crafted for these\
    \ needs.\n- rvalue-refs-to-const not considered in these rules.\n\n- T&&s are\
    \ legal, but not designed to be useful.\n- Uses already emerging ::\n\nThe crux\
    \ of why rvalue-references-to-const is not useful is the special handling accorded\
    \ T&&s parameters in [temp.duct.call] (14.8.2.1/3 in N3290): “If P is an rvalue\
    \ reference to a c-unqualified template parameter [i.e. T&] and the argument is\
    \ an lvalue, the type ‘lvalue reference to A' [i.e., T&] is used in place of A\
    \ for type deduction.” This hack applies only to T& parameters, not const T& parameters.\n\
    \nThe emerging use for const T& template parameters is to allow binding lvalues\
    \ while prohibiting references, e.g., from [function.objects] (20.8/2 in N3290):\n\
    \n```cpp\ntemplate <class T> reference_wrapper<T> ref(T&) noexcept;\ntemplate\
    \ <class T> reference_wrapper<const T> cref(const T&) noexcept;\ntemplate <class\
    \ T> void ref(const T&&) = delete;\ntemplate <class T> void cref(const T&&) =\
    \ delete;\n```\n\n## Rvalue References and const\n\nImplications:\n\n- Don't declare\
    \ const T&& parameters.\n- You wouldn't be able to move from them, anyway.\n-\
    \ Hence this (from a prior slide) rarely makes sense:\n  void f3(const T&&); \
    \   // legal, rarely reasonable\n- Avoid creating const rvalues.\n- They can't\
    \ bind to T&& parameters.\n- E.g., avoid const function return types:\n  - This\
    \ is a change from C++98.\n  class Rational { ... };\n  const Rational operator+(const\
    \ Rational&, // legal, but\n  const Rational&);    // poor design\n  Rational\
    \ operator+(const Rational&, // better design\n  const Rational&);\n\n## Distinguishing\
    \ Copying from Moving\n\nOverloading exposes move-instead-of-copy opportunities:\n\
    \n```cpp\nclass Widget {\npublic:\n    Widget(const Widget&); // copy constructor\n\
    \    Widget(Widget&&); // move constructor\n\n    Widget& operator=(const Widget&);\
    \ // copy assignment\n    Widget& operator=(Widget&&); // move assignment\n};\n\
    \nWidget w;\nWidget w1 = w;           // copy\nWidget w2 = std::move(w); // move\n\
    ```\n\n## Implementing Semantics\n\nMove operations take source value, leave source\
    \ in valid state:\n\n```cpp\nclass Widget {\nprivate:\n    std::string pds;\n\
    public:\n    Widget() = default;\n    Widget(const Widget& rhs) : pds(rhs.pds)\
    \ {} // copy\n    Widget(Widget&& rhs) : pds(std::move(rhs.pds)) {} // move\n\n\
    \    Widget& operator=(const Widget& rhs) {\n        pds = rhs.pds;\n        return\
    \ *this;\n    }\n    Widget& operator=(Widget&& rhs) {\n        if (this != &rhs)\
    \ {\n            pds = std::move(rhs.pds);\n        }\n        return *this;\n\
    \    }\n};\n```\n"
  mdcn: "\n\n## 引用绑定规则\n\n这对重载解析至关重要。\n\n如下：\n\n- 左值（Lvalues）可以绑定到左值引用。\n- 右值（Rvalues）可以绑定到常量左值引用。\n\
    \n此外：\n\n- 右值可以绑定到非常量的右值引用。\n- 左值不能绑定到右值引用。\n- 否则，左值可能会被意外修改。\n\n控制引用绑定的通用规则可见\
    \ [dcl.init.ref] (N3290 中的 8.5.3)，而规定引用绑定与重载解析之间相互作用的规则可见 [over.ics.ref] (N3290\
    \ 中的 13.3.1.4) 和 [over.ics.rank] (N3290 中的 13.3.2)，特别是 13.3.3.2，该规则规定：在左值引用或右值引用之间存在绑定竞争时，右值优先选择\
    \ `const T&` 参数，而另一种类型是 `const T&&`，因为右值无法绑定到所有非常量的 `T` 参数，且非常量右值相较于 `const T`\
    \ 参数，更倾向于绑定到 `T&` 参数，因为后者需要添加 `const`。\n\n在 C++00 曾有一段时期允许左值绑定到右值引用，某些编译器（例如 gcc\
    \ 4.3 和 4.4（但不是 4.5），VC10 beta（但不是 beta 2 或后续版本））实现了这种行为。这有时被称为“右值引用版本 1”。受 N2818\
    \ 驱动，规则发生了变化，使得左值不能绑定到右值引用，这有时被称为“右值引用版本 2”。开发者需要注意，某些支持右值引用的旧编译器可能实现“版本 1”而不是版本\
    \ 2 规则。\n\n## 右值引用\n\n示例：\n\n```cpp\nvoid f1(const TVec&); // 接收常量左值引用\nTVec vt;\n\
    f1(vt);                 // 正常（如既往）\nf1(createTVec());     // 正常（如既往）\n```\n\n\
    ```cpp\nvoid f2(const TVec&); // #1: 接收常量左值引用\nvoid f2(TVec&&);      // #2: 接收非常量右值引用\n\
    f2(vt);               // 左值 => #1\nf2(createTVec());   // 均可行，非常量右值 => #2\n```\n\
    \n```cpp\nvoid f3(const TVec&); // #1: 接收常量右值引用\nvoid f3(TVec&&);      // #2:\
    \ 接收非常量右值引用\nf3(vt);               // 错误！左值\nf3(createTVec());   // 均可行，非常量右值\
    \ => #2\n```\n\n## 右值引用与 const\n\nC++ 保持了常量正确性（const-correct）：\n\n- 常量左值/右值只绑定到常量引用。\n\
    \n但常量的右值引用本质上是无用的。\n\n- 右值引用为两个特定问题设计：\n  - 移动语义\n  - 完美转发\n\n- C++0x 语言规则是针对这些需求精心设计的。\n\
    - 这些规则中没有考虑常量的右值引用。\n\n- `T&&` 是合法的，但并非设计为有用。\n- 使用了已经新兴的 `::`\n\nconst 右值引用无用的核心原因在于\
    \ [temp.duct.call] (N3290 中的 14.8.2.1/3) 对 `T&&` 参数赋予的特殊处理：“如果 P 是指向未限定 const\
    \ 模板参数的右值引用 [即 T&] 且实参为左值，则在类型推导中使用‘A 的左值引用’ [即 T&] 代替 A。” 这种特殊变通方法仅适用于 `T&` 参数，不适用于\
    \ `const T&` 参数。\n\n`const T&` 模板参数的新用途是允许绑定左值同时禁止引用，例如来自 [function.objects] (N3290\
    \ 中的 20.8/2)：\n\n```cpp\ntemplate <class T> reference_wrapper<T> ref(T&) noexcept;\n\
    template <class T> reference_wrapper<const T> cref(const T&) noexcept;\ntemplate\
    \ <class T> void ref(const T&&) = delete;\ntemplate <class T> void cref(const\
    \ T&&) = delete;\n```\n\n## 右值引用与 const\n\n影响：\n\n- 不要声明 `const T&&` 参数。\n- 反无论如何你都无法从中移动。\n\
    - 因此此写法（来自之前的幻灯片）很少有意义：\n  void f3(const T&&);    // 合法，但很少合理\n- 避免创建常量右值。\n-\
    \ 它们无法绑定到 `T&&` 参数。\n- 例如，避免使用常量函数返回值：\n  - 这是相对于 C++98 的改变。\n  class Rational\
    \ { ... };\n  const Rational operator+(const Rational&, // 合法，但\n  const Rational&);\
    \    // 设计不佳\n  Rational operator+(const Rational&, // 更好的设计\n  const Rational&);\n\
    \n## 区分拷贝与移动\n\n重载暴露了“用移动代替拷贝”的机会：\n\n```cpp\nclass Widget {\npublic:\n    Widget(const\
    \ Widget&); // 拷贝构造函数\n    Widget(Widget&&); // 移动构造函数\n\n    Widget& operator=(const\
    \ Widget&); // 拷贝赋值\n    Widget& operator=(Widget&&); // 移动赋值\n};\n\nWidget w;\n\
    Widget w1 = w;           // 拷贝\nWidget w2 = std::move(w); // 移动\n```\n\n## 实现语义\n\
    \n移动操作获取源值，并将源对象留在有效状态：\n\n```cpp\nclass Widget {\nprivate:\n    std::string pds;\n\
    public:\n    Widget() = default;\n    Widget(const Widget& rhs) : pds(rhs.pds)\
    \ {} // 拷贝\n    Widget(Widget&& rhs) : pds(std::move(rhs.pds)) {} // 移动\n\n  \
    \  Widget& operator=(const Widget& rhs) {\n        pds = rhs.pds;\n        return\
    \ *this;\n    }\n    Widget& operator=(Widget&& rhs) {\n        if (this != &rhs)\
    \ {\n            pds = std::move(rhs.pds);\n        }\n        return *this;\n\
    \    }\n};\n```\n\n"
