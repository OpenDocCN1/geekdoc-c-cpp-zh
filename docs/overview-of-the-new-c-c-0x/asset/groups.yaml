  - '[PAGE 237]


    # # Move Support


    Moving most important when:


    +   - Object has data in separate memory (e.g., heap).

    - Copying is deep.


    Moving copies only object memory.


    +   - Copying copies object memory + separate memory.


    Consider copying/moving A to B:


    ![](img/68a90f505054116271758fb914871a74_237_0.png)


    Moving never slower than copying, and often faster.


    The diagrams on this slide make up a PowerPoint animation. The upper line depicts
    copying objects with and without separate memory, the lower line depicts moving
    such objects.'
