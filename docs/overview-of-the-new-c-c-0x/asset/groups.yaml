- md: "\n## delete Functions\n\ndeleted functions are declared, but can't be used.\n\
    \n- Most common application: prevent object copying:\n```cpp\nclass Widget {\n\
    \    Widget(const Widget&) = delete; // declare and delete\n    Widget&operator=(const\
    \ Widget&) = delete; // make uncallable\n...\n};\n```\nNote that Widget isn't\
    \ movable, either.\n* Declaring copy operations suppresses implicit move operations!\n\
    * It works both ways:\n```cpp\nclass Gadget {\n    Gadget(Gadget&) = delete; //\
