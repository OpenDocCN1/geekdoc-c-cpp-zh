    \ x, {1, 2, 3})]); // \"run\" closure\nasynch.\n```\n\nBehavior with multiple\
    \ threads is largely the same as classic single-threaded C/C++ behavior, with\
    \ generalizations as needed. Objects of static storage continue to have only one\
    \ representation in a program, and although they are guaranteed de-free, unsynchronized\
    \ access may cause races. If an exception is not caught by a thread (any thread),\
    \ std::terminate is called.\n\nIf main exits and other threads are still running,\
    \ they are, in Anthony Williams' words, \"terminated abruptly,\" which essentially\
    \ means you get undefined behavior.\n\nThreads cannot be started in a suspended\
    \ state, but the underlying platform-specific thread handle should be available\
    \ via std::thread::native_handle.\n\nThreads cannot be forcibly killed, std::thread_handle\
    \ may provide a platform-specific way. (Posix has no such functionality; pthread_cancel\
    \ is cooperative.)."
