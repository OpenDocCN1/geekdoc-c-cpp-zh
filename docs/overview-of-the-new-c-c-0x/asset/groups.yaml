- md: "\n## array vs. vector\n\n- array is fixed-size, vector is dynamically sized.\n\
    - array uses no dynamic memory, vector does.\n- array::swap is linear-time and\
    \ may throw, vector::swap is constant-time and can’t throw.\n- array can be treated\
    \ like a tuple, vector can’t.\n\n## array vs. C Arrays\n\n- array objects know\
