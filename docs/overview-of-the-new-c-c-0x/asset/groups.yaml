    +   - T& -> T& // from C++98

    - T&& -> T& // new for C++0x

    - T& -> T&& // new for C++0x

    - T&& -> T&& // new for C++0x


    Summary:


    +   - Reference collapsing involving a & is always T&.

    - Reference collapsing involving only && is T&.


    These rules are defined by [dcl.ref] (8.3.2/6 in N3290).'
