- md: "\n## Move is Optimization of Copy\n\nImplications:\n\n- Giving classes move\
    \ support can improve performance even for move-unaware code.\n- Copy requests\
    \ for rvalues may silently become copies.\n\n- Move requests safe for types w/o\
    \ explicit move support.\n- Such types perform copies instead.\n- E.g., all built-in\
    \ types.\n\nIn short:\n\n- Give classes move support.\n- Use std::move for lvalues\
    \ that may safely be moved from.\n\n![](img/68a90f505054116271758fb914871a74_270_0.png)\n\
    \nBoth move and copy operations may throw, and the issues associated with exceptions\
    \ in move functions are essentially the same as those associated with copy functions.\
    \ E.g., both must implement at least the basic guarantee, but should document\
    \ the guarantee they offer; clients must take into account how such functions\
    \ may throw, etc.\n\nN2983 recommends that generic (i.e., template-based) coding\
    \ wishing to offer the strong guarantee that uses a move operation on an unknown\
    \ type T offer a conditional guarantee: the generic offers the strong guarantee\
    \ only if T's version of the move operation offers the strong (or notthrow) approach\
    \ is viable for generic code using any unknown operation, however; there is nothing-specific\
    \ about it.\n\nN2983 also explains how std::move_noexcept can be used in the tiny\
    \ corner case of (1) legacy code offering the strong guarantee (2) that is being\
    \ revised to replace copy operations with move operations not known to offer that\
    \ guarantee. std::move_noexcept on an object of type T is like std::move on object,\
    \ except it performs a copy instead of a move unless the relevant T operation\
    \ is known to throw.\n\n## Implicitly-Generated Move Operations\n\nMove constructor\
    \ and move operator= are “special:”\n\n- Generated by compilers under appropriate\
    \ conditions.\n\nConditions:\n\n- All data members and base classes are movable.\n\
    - Implicit move operations move everything.\n- Most types qualify:\n    - All\
    \ built-in types (move = copy).\n    - Most standard library types (e.g., all\
    \ containers).\n\n- Generated operations to maintain class invariants.\n- No user-declared\
    \ copy or move operations.\n- Custom semantics for -> default semantics inappropriate.\n\
    - Move is an optimization of copy.\n- No user-declared destructor.\n- Often indicates\
    \ presence of implicit class invariant.\n\nLibrary types that aren't movable to\
    \ be infrastructure-related, e.g., (to quote from a Daniel Krüler post in the\
    \ comp.std.c++ thread at http://tinyurl.com/3afblwik “type_info, error_category,\
    \ all exception classes, reference_wrapper, all specializations from the primary\
    \ allocator template, weak_ptr, enable_shared_from_this, duration, time_point,\
    \ all iterators / iterator adaptors I am aware of, local::facet, locale::id, random_device,\
    \ seed_seq, ios_base, basic_istream<charT,traits::>::sentry, all atomic types,\
    \ once_flag, all mutex types, lock_guard, all condition variable types.\n\n##\
    \ Destructors and Implicit Class Invariants\n\n```cpp\nclass Widget {\nprivate:\n\
    \  std::vector<int> v;\n  std::set<double> s;\n  std::size_t sizeSum;\npublic:\n\
    \  ~Widget() { assert(sizeSum == v.size()+s.size()); };\n  ...\n};\n```\n\nIf\
    \ Widget had implicitly-generated move operations:\n\n```cpp\n{\n  std::vector<Widget>\
    \ vw;\n  Widget w;\n  vw.push_back(std::move(w)); // put stuff in w's containers\n\
    \                             // move w into vw\n                            \
    \ // no use of w\n  ...\n  // assert fires!\n}\n```\n\nUser-declared dtor => no\
    \ compiler-generated move ops for Widget.\n\nThe assertion would fire, because\
    \ the moved-from w would have empty containers (presumably), but sizeSum would\
    \ continue to have a value corresponding to the containers' pre-move sizes.\n\n\
    ## Implicitly-Generated Move Operations\n\nExamples:\n\n```cpp\nclass Widget1\
    \ { // copyable & movable type\nprivate:\n    std::u16string name; // copyable/movable\
    \ type\n    long long value; // copyable/movable type\npublic:\n    explicit Widget1(std::u16string\
    \ name); // implicit copy/move ctor\n}; // implicit copy/move operator=\n```\n\
    \n```cpp\nclass Widget2 {\nprivate:\n    std::u16string name; // copyable type;\
    \ not movable\n    long long value;\npublic:\n    explicit Widget2(std::u16string\
    \ name); // user-declared copy ctor\n    Widget2(const Widget2& rhs); // => no\
    \ implicit move ops;\n}; // implicit copy operator=\n```\n\n## Custom Moving ⇒\
    \ Custom Copying\n\nDeclaring a move operation prevents generation of copy operations.\n\
    \n- Custom move semantics -> custom copy semantics.\n- Move is an optimization\
    \ of copy.\n\n```cpp\nclass Widget3 { // movable type; not copyable\nprivate:\n\
    \    std::u16string name;\n    long long value;\npublic:\n    explicit Widget3(std::u16string\
    \ n); // user-declared move ctor\n    Widget3(Widget3&& rhs); // no implicit copy\
