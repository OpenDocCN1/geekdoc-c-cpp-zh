  - "[PAGE 194]\n\n# Example: regex_search\n\nCollect all (non-overlapping) substrings\
    \ that look like SSNs:\n\n```\nvoid possibleSSNs1(const std::string& text, std::list<std::string>&\
    \ results) {\n  auto b(text.cbegin()), e(text.end());\n  std::smatch match;\n\
