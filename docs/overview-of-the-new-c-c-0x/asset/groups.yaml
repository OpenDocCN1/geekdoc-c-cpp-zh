  mdcn: "\n\n## 概述\n\n- 介绍\n- 适合所有人的特性\n- 库的增强\n- 类作者的特性\n- 库作者的特性\n- 更多特性\n- 更多信息\n\
    \n## 更多 C++0x 特性\n\n- 枚举增强：\n- 前向声明\n- 指定底层类型\n- 枚举成员作用域限定于枚举内\n- 不允许隐式转换为 int\n\
    - 无限制的联合体（成员可以是任何非引用类型）。\n- 时间库支持：时钟、持续时间、时间点。\n- 允许将局部类型作为模板参数。\n- 与 C99 兼容性，例如\
    \ `long long`、`__func__` 等。\n- 内联命名空间方便了库的版本版本管理。\n- 作用域分配器允许容器及其元素使用不同的分配器，例如\
    \ `vector<string>`。\n\n时间库的主要动力是能够为并发 API 指定超时（例如睡眠持续时间、获取锁的超时等）。\n\n## 更多的 C++0x\
    \ 特性\n\n- 通用常数表达式 (constexpr)。\n- 用户自定义字面量（例如 `10_km`、`30_sec`）。\n- 放宽的 POD 类型定义；新的标准布局类型。\n\
    - 用于控制隐式模板实例化的 `extern` 外部模板。\n- `sizeof` 仅适用于类数据成员（例如 `sizeof(C::m)`）。\n- `&`\
    \ 和 `&&` 成员函数。\n- 放宽类内初始化静态数据数据的规则。\n- 用于对齐控制和限制虚函数重载的上下文关键字。\n- 属性（Attributes）表示特殊的优化机会，并为特定平台的扩展提供了标准语法。\n\
    \n## 已移除和废用的特性\n\n- `auto` 作为存储类说明已被移除。\n- `export` 作为语言特性已被移除。\n- `export` 仍然是一个关键字（但无语义）。\n\
    - `register` 作为存储类说明已废用。\n- 异常规范（Exception specifications）已废用。\n- `noexcept` 在概念上替换了\
    \ `\"throw()\"` 指定。\n- `auto_ptr` 已废用（请改用 `unique_ptr`）。\n- `bind1st/bind2nd`\
    \ 已废用（请改用 `bind` 或 lambda 表达式）。\n\n如果异常尝试传播到 `noexcept(true)` 函数之外，将调用 `terminate`。这与\
    \ C++03 中违反 `\"throw()\"` 指定时发生的情况不同。在那种情况下，在栈解绑后会调用 `unexpected`。\n\n来自 Herb\
    \ Sutter 2010 年 12 月 8 日的博客文章：“行程报告：2010 年 11 月 C++ 标准会议；‘析构函数和 delete 运算符默认为\
    \ noexcept’……简而言之，除非成员或基类析构函数为 `noexcept(false)`，否则每个析构函数默认都是 `noexcept`；你当然仍然可以显式覆盖默认并在任何析构函数中使用\
    \ `noexcept(false)`。”\n\nHerb Sutter 认为 `noexcept` 相比 `throw()` 的主要优势是它为编译器提供了额外的优化机会。根据\
    \ 2010 年 3 月 30 日的 comp.std.cpp 帖子：“`noexcept` 不仅允许调用者进行优化，也允许调用者进行优化，因此优化器可以假设在\
    \ `noexcept` 函数中调用且未被 `try/catch` 包的函数本身也是 `noexcept` 的（例如，C 标准库函数并未此类标注）。”\n\n\
