  - "[PAGE 195]\n\n# Example: regex_iterator\n\nA better approach:\n\n```\nvoid possibleSSNs2(const\
    \ std::string& text, std::list<std::string>& results)\n{\n  std::regex_iterator\
    \ b(text.begin(), text.end(), SSNRegex);\n  std::regex_iterator e;\n  for (auto\
    \ it = b; it != e; ++it) {\n    results.push_back(it->str());\n  }\n}\n```\n\n\
    regex_iterator (and regex_token_iterator) handle tricky cases.\n\n+   - Use them\
    \ instead of loops over regex_search calls."
