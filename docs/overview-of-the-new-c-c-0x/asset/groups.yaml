  - '[PAGE 225]


    # bind Summary


    +   * Generalizes bind1st and bind2nd (which are now deprecated).

    * No need for ptr_fun, mem_fun, mem_fun_ref, or std::mem_fn.

    * Results often stored in function objects.

    * Lambdas typically preferable.'
  - '[PAGE 226]


    # New Algorithms for C++0x


    R is a range, e is an element, p is a predicate:


    +   - all_of is p true for all e in R?

    - any_of is p true for any e in R?

    - none_of is p true for no e in R?

    - find_if_not finds first e in R where p is false

    - copy_if copy all e in R where p is true

    - copy_n copy first n elements of R

    - iota assign all e in R increasing values starting with v

    - minmax return pair(minVal, maxVal) for given inputs

    - minmax_element return pair(min_element, max_element) for R

    - min/max/minmax return values.

    - min_element/max_element/minmax_element return iterators.


    The descriptions for minmax and minmax_element are different, because minmax is
    overloaded to take individual objects or an initializer_list, but not a range.

    max_element accepts only ranges.'
  - '[PAGE 227]


    # New Algorithms for C++0x


    R is a range, e is an element, p is a predicate, v is a value:


    +   - partition_copy copy all e in R to 1 of 2 destinations per p(e)

    - is_partitioned is R partitioned per p?

    - partition_point find first e in R where p(e) is false

    - is_sorted is R sorted?

    - is_sorted_until find first out-of-order e in R

    - is_heap do elements in R form a heap?

    - is_heap_until find first out-of-heap-order e in R


    +   move like copy, but each e in R is moved

    move_backward like copy_backward, but each e in R is moved


    +   - std::move_iterator turns copying algorithms into moves, e.g.:

    - std::copy_if(std::move_iterator<Lt>(b), // == std::copy_if(b, e, p),

    std::move_iterator<Lt>(e), // but moves instead of

    p);


    There is no actual need for std::move and std::move_backward, because their effects
    can be achieved with copy, copy_backward, and move_iterators, but per a comp.std.c++
    posting by Howard Hinnant, the committee felt that these two algorithms might
    be used often, move versions of them should be provided simply for notational
    convenience.'
- md: "\n## Extended C++98 Algorithms in C++0x\n\n- swap: New overload taking arrays\n\
    - min: New overloads taking initializer lists\n- max: New overloads taking initializer\
    \ lists\n\n## Summary of Library Enhancements\n\n- Initializer lists, emplacement,\
    \ and move semantics added to C++98 containers.\n- TR1 functionality except mathematical\
    \ functions adopted.\n- forward_list is a singly-linked list.\n- unique_ptr replaces\
    \ auto_ptr.\n- 18 new algorithms.\n\nThere are more subtle library changes in\
    \ moving from C++03 to C++0x, e.g., function objects used with STL algorithms\
    \ in C++03 are generally prohibited from having side effects, while in C++0x,\
    \ some effects are allowed. For example, in C++03, the specification for *accumulate*\
    \ says that “binary_op shall not cause side effects,” but in [accumulate](26.7.2/2\
    \ of N3290), the corresponding wording is “In the range [first,last], binary_op\
    \ shall neither modify elements nor invalidate iterators or subranges.\n\n## Overview\n\
    \n- Introduction\n- Features for Everybody\n- Library Enhancements\n- Features\
    \ for Class Authors\n- Features for Library Authors\n- Yet More Features\n- Further\
    \ Information\n\n## Move Support\n\nC++ sometimes performs unnecessary copying:\n\
    ```cpp\ntypedef std::vector<T> TVec;\nTVec createTVec(); // factory function\n\
    TVec vt;\n...\nvt = createTVec(); // copy return value object to vt,\n// then\
    \ destroy return value\n```\n\n![](img/68a90f505054116271758fb914871a74_231_0.png)\n\
    \nThe diagrams on this slide make up a PowerPoint animation.\n\nThroughout this\
    \ discussion, I use a container of T, rather than specifying a particular type,\
    \ e.g., container of string or container of int. The motivation for move semantics\
    \ is largely independent of the types involved, although the larger and more expensive\
    \ the types are to copy, the stronger the case for moving over copying.\n\n##\
    \ Move Support\n\nMoving values would be cheaper:\n\n```cpp\nTVec vt;\n...\nvt\
    \ = createTVec();\n// move data in return value object\n// to vt, then destroy\
    \ return value\n// object\n```\n\n![](img/68a90f505054116271758fb914871a74_232_0.png)\n\
    \nThe diagrams on this slide make up a PowerPoint animation.\n\n## Move Support\n\
    \nAppending to a full vector causes much copying before the append:\n```cpp\n\
    std::vector<T> vt;\n...\nt.push_back(T object); // assume vt lacks\n// unused\
    \ capacity\n```\n\n![](img/68a90f505054116271758fb914871a74_233_0.png)\n\nThe\
    \ diagrams on this slide make up a PowerPoint animation.\n\nThe new element has\
    \ to be added to the new storage for the vector before the old elements are destroyed,\
    \ because it's possible that the new element is a copy of an existing element,\
