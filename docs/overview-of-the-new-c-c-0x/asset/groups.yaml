  - "[PAGE 109]\n\n# Futures\n\nTwo kinds:\n\n+   - **std::future<T>**: result may\
    \ be accessed only once.\n  - Suitable for most use cases.\n  - Moveable, not\
    \ copyable.\n  - Exactly one future has right to access result.\n\n+   - **std::shared_future<T>**:\
    \ result may be accessed multiple times.\n  - Appropriate when threads access\
    \ a single result.\n  - Both copyable and moveable.\n  - Multiple **std::shared_futures**\
    \ for the same result may exist.\n  - Creatable from **std::future**.\n  - Such\
