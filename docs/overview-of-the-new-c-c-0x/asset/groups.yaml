  mdcn: "\n## 移动是拷贝的优化\n\n影响：\n\n- 为类提供移动支持即使对于感知移动的代码也能提高性能。\n- 针对右值（rvalues）的拷贝请求可能会静默地变为拷贝。\n\
    \n- 对于没有显式移动支持的类型，移动请求是安全的。\n- 这些类型将转执行拷贝。\n- 例如，所有内置类型。\n\n简而言之：\n\n- 为类提供移动支持。\n\
    - 对于可以安全移动的左值（lvalues），使用 `std::move`。\n\n![](img/68a90f505054116271758fb914871a74_270_0.png)\n\
    \n移动和拷贝操作都可能抛出异常，移动函数中的异常问题与拷贝函数的问题本质上是相同的。例如，两者都必须至少实现基本保证，但应该记录它们提供的保证；客户端必须考虑此类函数如何抛出异常等。\n\
    \nN2983 建议，泛型（即基于模板的）编码如果希望提供对未知类型 `T` 使用移动操作的强保证，应提供一种条件保证：只有当 `T` 版本的移动操作提供的强（或不抛出）方法对于使用任何未知操作的泛型代码可行时，泛型才提供强保证；然而，这并没有特殊之处。\n\
    \nN2983 还解释了 `std::move_noexcept` 如何在极少数的特殊情况下使用：(1) 提供强保证的遗留代码 (2) 正在被修改以用未知提供保证的移动操作替换拷贝操作。在类型\
    \ `T` 的对象上使用 `std::move_noexcept` 就像在对象上使用 `std::move`，除非相关的 `T` 操作已知会抛出异常，否则执行执行拷贝而不是移动。\n\
    \n## 隐式生成的移动操作\n\n移动构造函数和移动赋值运算符是特殊的：\n\n- 由编译器在适当条件下生成。\n\n条件：\n\n- 所有数据成员和基类都是可移动的。\n\
    - 隐式移动操作移动所有内容。\n- 大多数类型符合条件：\n    - 所有内置类型（移动 = 拷贝）。\n    - 大多数标准库类型（例如，所有容器）。\n\
    \n- 为了维护类不变性的生成的操作。\n- 无用户声明的拷贝或移动操作。\n- 自定义语义使得默认语义不适用。\n- 移动是拷贝的优化。\n- 无用户声明的析构函数。\n\
    - 通常表示存在隐式类不变性。\n\n不可移动的库类型是基础设施相关的，例如（引用 Daniel Krüler 在 comp.std.c++ 线程 http://tinyurl.com/3afblwik\
    \ 中的帖子）“type_info, error_category, 所有异常类, reference_wrapper, 所有来自主分配器模板的特化版本,\
    \ weak_ptr, enable_shared_from_this, duration, time_point, 我知道的所有迭代器/迭代器适配器，local::facet,\
    \ locale::id, random_device, seed_seq, ios_base, basic_istream<charT,traits::>::sentry,\
    \ 所有原子类型, once_flag, 所有互锁类型, lock_guard, 所有条件变量类型。”\n\n## 析构函数与隐式类不变性\n\n```cpp\n\
    class Widget {\nprivate:\n  std::vector<int> v;\n  std::set<double> s;\n  std::size_t\
    \ sizeSum;\npublic:\n  ~Widget() { assert(sizeSum == v.size()+s.size()); };\n\
    \  ...\n};\n```\n\n如果 Widget 有隐式生成的移动操作：\n\n```cpp\n{\n  std::vector<Widget> vw;\n\
    \  Widget w;\n  vw.push_back(std::move(w)); // 将内容放入 w 的容器中\n                \
    \             // 将 w 移动到 vw\n                             // 不再使用 w\n  ...\n \
    \ // 断言触发！\n}\n```\n\n用户声明的析构函数 => Widget 没有编译器生成的移动操作。\n\n断言将会触发，因为被移动后的 `w`\
    \ 将拥有空容器（推测），但 `sizeSum` 将继续保持对应容器移动前大小的值。\n\n## 隐式生成的移动操作\n\n示例：\n\n```cpp\n\
    class Widget1 { // 可拷贝且可移动类型\nprivate:\n    std::u16string name; // 可拷贝/可移动类型\n\
    \    long long value; // 可拷贝/可移动类型\npublic:\n    explicit Widget1(std::u16string\
    \ name); // 隐式拷贝/移动构造函数\n}; // 隐式拷贝/移动赋值运算符\n```\n\n```cpp\nclass Widget2 {\n\
    private:\n    std::u16string name; // 可拷贝类型；不可移动\n    long long value;\npublic:\n\
    \    explicit Widget2(std::u16string name); // 用户声明的拷贝构造函数\n    Widget2(const\
    \ Widget2& rhs); // => 无隐式移动操作\n}; // 隐式拷贝赋值运算符\n```\n\n## 自定义移动 ⇒ 自定义拷贝\n\n声明移动操作会防止拷贝操作的生成。\n\
    \n- 自定义移动语义 -> 自定义拷贝语义。\n- 移动是拷贝的优化。\n\n```cpp\nclass Widget3 { // 可移动类型；不可拷贝\n\
    private:\n    std::u16string name;\n    long long value;\npublic:\n    explicit\
    \ Widget3(std::u16string n); // 用户声明的移动构造函数\n    Widget3(Widget3&& rhs); // 无隐式拷贝操作\n\
    \    Widget3& operator=(Widget3&& rhs); // 用户声明的移动赋值运算符\n// 无隐式拷贝操作\n};\n```\n\
    \n## 隐式生成的移动操作（等等，OCR 文本重复了此标题，我将遵循该结构）\n\n*实际上，查看 OCR，标题“Implicitly-Generated\
    \ Move Operations”出现在第 271 页和第 273 页。我将它们视为章节。*\n\n## 隐式生成的移动操作（继续）\n\n*等等，OCR\
