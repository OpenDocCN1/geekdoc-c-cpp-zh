  - "[PAGE 97]\n\n# Data Lifetime Considerations\n\nConclusions:\n\n+   - Data lifetime\
    \ issues is critical in multi-threading (MT) design.\n  - A special aspect of\
    \ synchronization/race issues.\n    - Even shared immutable data subject to lifetime\
    \ issues.\n- By-reference/by-by-pointer parameters in asynch calls always risky.\n\
    \  - Prefer pass-by-value.\n    - Including via lambdas!\n\n```\nvoid f(int xParam);\
    \ // function to call asynchronously\n\n{\n  int x;\n  std::thread t1[&{f(x)}];\
    \ // risky! closure holds a ref to x\n  std::thread t2[=f(x)}]; // okay, closure\
    \ holds a copy of x\n} // x destroyed\n```\n\nIn case of t1, the lambda's closure\
    \ object is created before the calling thread can continue, but the calling thread\
    \ may continue before f starts executing. By the time f xParam is initialized,\
    \ the closure may hold a dangling reference to x, because x has already been destroyed."
  - '[PAGE 98]


    # # Avoiding Lifetime Problems


    Two basic strategies:


    +   - Copy data for use by the asynchronous call.

    - Ensure referenced objects live long enough.'
  - '[PAGE 99]


    # Copying Arguments for Asynchronous Calls


    std::thread’s variadic constructor (conceptually) copies everything:

    void f(int xVal, const Widget& wVal);

    int x;

    Widget w;

    std::thread t(f, x, w);      // invoke copy of f on copies of x, w


    +   - Copies of f, x, w, guaranteed to exist until async call returns.

    - Inside f, wVal refers to a copy of w, not itself.

    - Details when we do move semantics.


    Copying optimized to moving whenever possible.


    In this example, "copying" really means copying a pointer to it, and "optimizing"
    this copy to a move makes no sense, because copying a pointer is cheap. The general
    rule, is that the thread constructor copies/moves its first parameter, i.e., the
    function to be executed asynchronously.'
  - "[PAGE 100]\n\n# Copying Arguments\n\nUsing by-value captures in closures works,\
    \ too:\n\n```\nvoid f(int xVal, const Widget& wVal);\nint x;\nWidget w;\n...\n\
    std::thread t([&]{ f(x, w); }); // invoke copy of f on copies of x, w\n```\n\n\
    +   - Closure contains copies of x and w.\n- Closure copied by thread ctor; copy\
    \ exists until f returns.\n  - Copying optimized to moving whenever possible.\n\
    - Inside f, wVal refers to a copy of w, not w itself."
