- md: "\n## Binding Non-Static Member Functions\n\nFor non-static member functions,\
    \ this comes from the first argument:\n\n- Just like for bind1st and bind2nd.\n\
    \n```cpp\nclass ButtonHandler {\n    // from the std::function example\n    ...\n\
    \    int clicked(short upOrDown) const;\n\n    Button b;\n    ButtonHandler bh;\n\
    \    ...\n    b.setCallback(std::bind(&ButtonHandler::clicked, bh, _1));\n}\n\
    ```![](img/68a90f505054116271758fb914871a74_216_0.png)\n\n_1 is actually in namespace\
    \ std::placeholders, so the call to bind on this page won't compile as shown unless\
    \ std::placeholders::_1 has been made visible (e.g., via a using declaration).\
    \ In practice, this is virtually always done in code that uses bind.\n\nstd::bind\
    \ copies the arguments it binds, hence the use of the name copyOfbh inside the\
    \ function object returned by bind.\n\n## Binding Non-Static Member Functions\n\
    \nbind supports this specified via:\n\n- **Object:**\n  `EventHandler bh; b.setCallback(std::bind(&EventHandler::clicked,\
    \ bh, _1));`\n- **Pointer:**\n  `ButtonHandler *pbh; b.setCallback(std::bind(&ButtonHandler::clicked,\
    \ pbh, _1));`\n- **Smart Pointer:**\n  `std::unique_ptr<ButtonHandler> sp;\n \
    \ b.setCallback(std::bind(&ButtonHandler::clicked, sp, _1));`\n  `std::unique_ptr<ButtonHandler>\
    \ up;\n  b.setCallback(std::bind(&ButtonHandler::clicked, std::ref(up), _1));`\n\
    \  `MyCustomSmartPtr<ButtonHandler> mcsp;\n  b.setCallback(std::bind(&ButtonHandler::clicked,\
    \ mcsp, _1));`\n\nstd::unique_ptr must be wrapped by std::ref when bound, because\
    \ std::unique_ptr isn't copyable. (It's only movable.)\n\nAny smart pointer will\
    \ work with bind as long as it defines `operator*` in the conventional manner,\
    \ i.e., to return a reference to the pointed-to object. (This implies that std::weak_ptr\
    \ won't work with bind.)\n\n## Binding Beyond the 2nd Argument\n\nBinding beyond\
    \ the 2nd argument is easy:\n\n```cpp\nclass Point {\npublic:\n  ...\n  void translate(int\
    \ deltaX, int deltaY);\n};\nstd::vector<Point> vp;\n...\nstd::for_each( // translate\
    \ points\n  vp.begin(), vp.end(), // in vp by (10, 20)\n  std::bind(&Point::translate,\
    \ _1, 10, 20) // note that deltaY\n  ); // is 3rd arg\n```\n\n- bind's placeholder\
    \ arguments passed by reference, so this loop modifies Points in vp, not copies\
    \ of them.\n\nArguments corresponding to bind placeholders are passed using perfect\
    \ forwarding.\n_1 is actually in namespace std::placeholders, the call to bind\
    \ on this page won't compile as shown unless std::placeholders::_1 has been made\
    \ visible (e.g., via a using declaration). In practice, this is virtually always\
    \ done in code that uses bind.\n\n## bind and Adapters\n\nUnlike bind1st and bind2nd,\
    \ bind needs no adapters:\n\n```cpp\nclass Point {\npublic:\n  ...\n  void setColor(Color\
    \ c);\n};\nstd::forward_list<Point> flp;\n...\n// without bind\nstd::for_each(\n\
    \  flp.begin(), flp.end(),\n  std::bind2nd(std::mem_fun_ref(&Point::setColor),\
    \ _1, green);\n);\n// with bind\nstd::for_each(flp.begin(), flp.end(),\n  std::bind(&Point::setColor,\
    \ _1, green));\n```\n\n_1 is actually in namespace std::placeholders, so the call\
    \ to bind on this page won't compile as shown unless std::placeholders::_1 has\
    \ been made visible (e.g., via a using declaration). In practice, this is virtually\
    \ always done in code that uses bind.\n\n## bind and function\n\nbind’s result\
    \ often stored in a function object:\n\n```cpp\nclass Button : public SomeGUIFrameworkBase\
    \ { // from\npublic:\n    typedef std::function<void(short)> CallbackType; //\
    \ discussion\n    void setCallback(const CallbackType& cb) {\n    { clickHandler\
    \ = cb; }\n    ...\nprivate:\n    CallbackType clickHandler;\n};\nclass ButtonHandler\
    \ { // from\npublic:\n    int clicked(short upOrDown) const; // earlier\n};\n\
    Button b;\nButtonHandler bh;\n...\nb.setCallback(std::bind(&ButtonHandler::clicked,\
    \ bh, _1));\n```\n\n_1 is actually in namespace std::placeholders, so the call\
    \ to bind on this page won’t\ncompile as shown unless std::placeholders::_1 has\
    \ been made visible (e.g., via a using\ndeclaration). In practice, this is virtually\
    \ always done in code that uses bind.\n\nOverview of the New C++ (C++11x)\n\n\
    ## Fun With bind\n\nbind allows reordering and duplicating arguments:\n\n```cpp\n\
    void f(int a, int b, int c);\nint x, y, z;\n...\nstd::function<void(int, int)>\
    \ f1 = std::bind(f, _1, _1, _2);\nf1(x, y);\n```![](img/68a90f505054116271758fb914871a74_221_0.png)\n\
    \n```cpp\nstd::function<void(int, int, int)> f2 = std::bind(f, _3, _2, _1);\n\
    f2(x, y, z);\n```![](img/68a90f505054116271758fb914871a74_221_1.png)\n\nThese\
    \ diagrams are little misleading, because they don't show the std::function objects\
    \ that wrap the objects by bind. _1, _2, and _3 are actually in namespace std::placeholders,\
    \ so the calls to bind on this page won't compile unless std::placeholders::_1\
    \ (and similarly for _2 and _3) have been visible (e.g., via a using declaration).\
    \ In practice, this is virtually always done in code that uses bind.\n\n## Lambdas\
    \ vs. bind\n\nBoth lambdas and bind create function objects:\n```cpp\nstd::for_each(vp.begin(),\
    \ vp.end(),\n  std::bind(&Point::translate, _1, 10, 20));\nstd::for_each(vp.begin(),\
    \ vp.end(),\n  [](Point& p) { p.translate(10, 20); });\n```\n```cpp\nb.setCallback(std::bind(&ButtonHandler::clicked,\
    \ _1));\nb.setCallback([=](short upOrDown) { bh.clicked(upOrDown); });\n```\n\
    ```cpp\nstd::function<void(int, int, int)> f2 = std::bind(f, _3, _2, _1);\nstd::function<void(int,\
    \ int, int)> f2 = [](int a, int b, int c) { f(c, b, a); };\n```\nMany people find\
    \ lambdas clearer.\n\n- No _1, _2, etc. All the examples on this page are taken\
    \ from.\n\n## Lambdas vs. bind\n\nLambdas always clearer when more than simple\
    \ binding needed:\n```cpp\nclass Person {\n  public:\n    std::size_t age() const;\n\
    \    ...\n};\nstd::vector<Person> vp;\n...\nstd::partition(vp.begin(), vp.end(),\n\
    \  [](const Person& p) { return p.age() < 10 || p.age() > 20; }\n);\nstd::partition(vp.begin(),\
    \ vp.end(),\n  std::bind(std::less<std::size_t>(), 10), // ???\n  std::bind(std::greater<std::size_t>(),\
    \ 20) // ???\n);\n```\nAs far as I know, there is no way to use bind with the\
    \ call to partition, because there is no way to specify that _1 for the outer\
    \ call to bind maps to _1 for the other two calls bind.\n\n## Lambdas vs. bind\n\
    \nLambdas typically generate better code.\n\n- Calls through bind involve function\
    \ pointers ⇒ no inlining.\n- Calls through closures allow full inlining.\n\n##\
    \ bind Summary\n\n- Generalizes bind1st and bind2nd (which are now deprecated).\n\
    - No need for ptr_fun, mem_fun, mem_fun_ref, or std::mem_fn.\n- Results often\
    \ stored in function objects.\n- Lambdas typically preferable.\n\n## New Algorithms\
    \ for C++0x\n\nR is a range, e is an element, p is a predicate:\n\n- all_of is\
    \ p true for all e in R?\n- any_of is p true for any e in R?\n- none_of is p true\
    \ for no e in R?\n- find_if_not finds first e in R where p is false\n- copy_if\
    \ copy all e in R where p is true\n- copy_n copy first n elements of R\n- iota\
    \ assign all e in R increasing values starting with v\n- minmax return pair(minVal,\
    \ maxVal) for given inputs\n- minmax_element return pair(min_element, max_element)\
    \ for R\n- min/max/minmax return values.\n- min_element/max_element/minmax_element\
    \ return iterators.\n\nThe descriptions for minmax and minmax_element are different,\
    \ because minmax is overloaded to take individual objects or an initializer_list,\
    \ but not a range.\nmax_element accepts only ranges.\n\n## New Algorithms for\
    \ C++0x\n\nR is a range, e is an element, p is a predicate, v is a value:\n\n\
    - partition_copy copy all e in R to 1 of 2 destinations per p(e)\n- is_partitioned\
    \ is R partitioned per p?\n- partition_point find first e in R where p(e) is false\n\
    - is_sorted is R sorted?\n- is_sorted_until find first out-of-order e in R\n-\
    \ is_heap do elements in R form a heap?\n- is_heap_until find first out-of-heap-order\
    \ e in R\n\n- move like copy, but each e in R is moved\nmove_backward like copy_backward,\
    \ but each e in R is moved\n\n- std::move_iterator turns copying algorithms into\
    \ moves, e.g.:\n- std::copy_if(std::move_iterator<Lt>(b), // == std::copy_if(b,\
    \ e, p),\n  std::move_iterator<Lt>(e), // but moves instead of\np);\n\nThere is\
    \ no actual need for std::move and std::move_backward, because their effects can\
    \ be achieved with copy, copy_backward, and move_iterators, but per a comp.std.c++\
    \ posting by Howard Hinnant, the committee felt that these two algorithms might\
    \ be used often, move versions of them should be provided simply for notational\
    \ convenience.\n"
  mdcn: "\n\n## 绑定非静态成员函数\n\n对于非静态成员函数，这种绑定来自于第一个参数：\n\n-   就像 bind1st 和 bind2nd 一样。\n\
    \n```cpp\nclass ButtonHandler {\n    // 来自 std::function 示例\n    ...\n    int\
    \ clicked(short upOrDown) const;\n\n    Button b;\n    ButtonHandler bh;\n   \
    \ ...\n    b.setCallback(std::bind(&ButtonHandler::clicked, bh, _1));\n}\n```![](img/68a90f505054116271758fb914871a74_216_0.png)\n\
    \n_1 实际上位于 std::placeholders 命名空间中，因此除非使 std::placeholders::_1 可见（例如，通过 using\
    \ 声明），否则本页上的 bind 调用将无法如所示通过编译。在实践中，这几乎总是在使用 bind 的代码中完成的。\n\nstd::bind 会拷贝它所绑定的参数，因此在\
    \ bind 返回的函数对象内部使用了 `copyOfbh` 这个名称。\n\n## 绑定非静态成员函数\n\nbind 通过以下方式支持此操作：\n\n\
    -   **对象：**\n  `EventHandler bh; b.setCallback(std::bind(&EventHandler::clicked,\
    \ bh, _1));`\n-   **指针：**\n  `ButtonHandler *pbh; b.setCallback(std::bind(&ButtonHandler::clicked,\
    \ pbh, _1));`\n-   **智能指针：**\n  `std::unique_ptr<ButtonHandler> sp;\n  b.setCallback(std::bind(&ButtonHandler::clicked,\
    \ sp, _1));`\n  std::unique_ptr<ButtonHandler> up;\n  b.setCallback(std::bind(&ButtonHandler::clicked,\
    \ std::ref(up), _1));`\n  MyCustomSmartPtr<ButtonHandler> mcsp;\n  b.setCallback(std::bind(&ButtonHandler::clicked,\
    \ mcsp, _1));`\n\nstd::unique_ptr 在绑定时必须由 std::ref 封装，因为 std::unique_ptr 是不可拷贝的（它只是可移动的）。\n\
    \n只要智能指针按照常规方式定义了 `operator*`（即返回指向所指对象的引用），就可以与 bind 使用。（这意味着 std::weak_ptr 无法与\
    \ bind 使用。）\n\n## 绑定第 2 个之后的参数\n\n绑定第 2 个之后的参数很容易：\n\n```cpp\nclass Point {\n\
    public:\n  ...\n  void translate(int deltaX, int deltaY);\n};\nstd::vector<Point>\
    \ vp;\n...\nstd::for_each( // 移动点\n  vp.begin(), vp.end(), // 在 vp 中移动 (10, 20)\n\
    \  std::bind(&Point::translate, _1, 10, 20) // 注意 deltaY\n  ); // 是第 3 个参数\n```\n\
    \n-   bind 的占位符参数通过引用传递，因此此循环修改的是 vp 中的 Points，而不是它们的拷贝。\n\n对应于 bind 占位符的参数使用完美转发传递传递。\n\
    _1 实际上位于 std::placeholders 命名空间中，除非使 std::placeholders::_1 可见（例如，通过 using 声明），否则本页上的\
    \ bind 调用将无法如所示通过编译。在实践中，这几乎总是在使用 bind 的代码中完成的。\n\n## bind 与适配器\n\n与 bind1st 和\
    \ bind2nd 不同，bind 不需要适配器：\n\n```cpp\nclass Point {\npublic:\n  ...\n  void setColor(Color\
    \ c);\n};\nstd::forward_list<Point> flp;\n...\n// 不使用 bind\nstd::for_each(\n \
    \ flp.begin(), flp.end(),\n  std::bind2nd(std::mem_fun_ref(&Point::setColor),\
    \ _1, green);\n);\n// 使用 bind\nstd::for_each(flp.begin(), flp.end(),\n  std::bind(&Point::setColor,\
    \ _1, green));\n```\n\n_1 实际上位于 std::placeholders 命名空间中，除非使 std::placeholders::_1\
    \ 可见（例如，通过 using 声明），否则本页上的 bind 调用将无法如所示通过编译。在实践中，这几乎总是在使用 bind 的代码中完成的。\n\n\
    ## bind 与函数对象\n\nbind 的结果通常存储在函数对象中：\n\n```cpp\nclass Button : public SomeGUIFrameworkBase\
    \ { // 来自\npublic:\n    typedef std::function<void(short)> CallbackType; // 讨论\n\
    \    void setCallback(const CallbackType& cb) {\n    { clickHandler = cb; }\n\
    \    ...\nprivate:\n    CallbackType clickHandler;\n};\nclass ButtonHandler {\
    \ // 来自\npublic:\n    int clicked(short upOrDown) const; // 较早\n};\nButton b;\n\
    ButtonHandler bh;\n...\nb.setCallback(std::bind(&ButtonHandler::clicked, bh, _1));\n\
    ```\n\n_1 实际上位于 std::placeholders 命名空间中，除非使 std::placeholders::_1 可见（例如，通过 using\
    \ 声明），本页上的 bind 调用将无法如所示通过编译。在实践中，这几乎总是在使用 bind 的代码中完成的。\n\n新 C++ (C++11x) 概述\n\
    \n## bind 的趣味\n\nbind 允许对重排列和重复参数：\n\n```cpp\nvoid f(int a, int b, int c);\nint\
    \ x, y, z;\n...\nstd::function<void(int, int)> f1 = std::bind(f, _1, _1, _2);\n\
    f1(x, y);\n```![](img/68a90f505054116271758fb914871a74_216_0.png)\n\n```cpp\n\
    std::function<void(int, int)> f2 = std::bind(f, _3, _2, _1);\nf2(x, y);\n```![](img/68a90f505054116271758fb914871a74_221.png)\n\
    \n这些图具有误导性，因为它们没有显示由 bind 封装的 std::function 对象。_1、_2 和 _3 实际上位于 std::placeholders\
    \ 命名空间，除非 std::placeholders::_1（同样对于 _2 和 _3）可见（例如，通过 using 声明）。在实践中，这几乎总是使用 bind\
    \ 的代码完成的。\n\n## Lambda vs bind\n\nLambda 和 bind 都会创建函数对象：\n```cpp\nstd::for_each(vp.begin(),\
    \ vp.end(),\n  std::bind(&Point::translate, _1, 10, 20));\nstd::for_each(vp.begin(),\
    \ vp.end(),\n  [](Point& p) { p.translate(10, 20); });\n```\n```cpp\nb.setCallback(std::bind(&ButtonHandler::clicked,\
    \ _1));\nb.setCallback([=](short upOrDown) { bh.clicked(upOrDown); });\n```\n\
    ```cpp\nstd::function<void(int, int, int)> f2 = std::bind(f, _3, _2, _1);\nstd::function<void(int,\
    \ int, int)> f2 = [](int a, int b, int c) { f(c, b, a); };\n```\n很多人发现 Lambda\
    \ 更清晰。\n\n- 没有 _1、_2 等。本页上的所有示例均来自。\n\n## Lambda vs bind\n\n当需要比简单的绑定时，Lambda\
    \ 更加清晰：\n```cpp\nclass Person {\n  public:\n    std::size_t age() const;\n   \
    \ ...\n};\nstd::vector<Person> vp;\n...\nstd::partition(vp.begin(), vp.end(),\n\
    \  [](const Person& p) { return p.age() < 10; }\n);\nstd::partition(vp.begin(),\
    \ vp.end(),\n  std::bind(std::less<std::size_t>(), 10), // ???\n  std::bind(std::greater<std::size_t>(),\
    \ 20) // ???\n);\n```\n据我所知，没有方法在 partition 调用中使用 bind，因为没有方法将外部调用的 _1 映射到另外两个调用。\n\
    \n## Lambda vs bind\n\nLambda 通常生成更好的代码。\n\n- 通过 bind 调用会涉及函数指针 ⇒ 无法内联。\n- 通过闭包调用允许完全内联。\n\
    \n## bind 总结\n\n- 泛化了 bind1st 和 bind2nd（现已废用）。\n- 不需要 ptr_fun、mem_fun、mem_fun_ref\
    \ 或 std::mem_fn。\n- 结果通常存储在函数对象中。\n- 通常通常优于 Lambda。\n\n## C++0x 新算法\n\nR 是一个范围，e\
    \ 是一个元素，p 是谓词：\n\n- all_of：R 中的所有元素是否满足 p 为真？\n- any_of：R 中的任意元素是否满足 p 为真？\n-\
    \ none_of：R 中没有元素是否满足 p 为真？\n- find_if_not：在 R 中查找第一个 p 为假的元素。\n- copy_if：拷贝 R\
    \ 中所有 p 为真的元素。\n- copy_n：拷贝 R 的前 n 个元素。\n- iota：为 R 中的所有元素赋值从 v 开始的值。\n- minmax：对于给定输入返回\
    \ (minVal, maxVal)。\n- minmax_element：对于 R 返回 (min_element, max_element)。\n- min/max/minmax\
    \ 返回值。\n- min_element/max_element/minmax_element 返回迭代器。\n\nminmax 和 minmax_element\
    \ 的描述不同，因为 minmax 重载了以接受单个对象或初始化列表，但不接受范围。\nmax_element 仅接受范围。\n\n## C++0x 新算法\n\
    \nR 是一个范围，e 是一个元素，p 是谓词，v 是一个值：\n\n- partition_copy：根据 p(e) 将 R 中的所有 e 拷贝到两个目标地之一。\n\
    - is_partitioned：R 是否按照 p 划分？\n- partition_point：在 R 中查找第一个 p(e) 为假的元素。\n- is_sorted：R\
    \ 是否排序？\n- is_sorted_until：在 R 中查找第一个无序的 e。\n- is_heap：R 中的元素是否形成一个堆？\n- is_heap_until：在\
    \ R 中查找第一个不在堆顺序的 e。\n\n- move：像 copy，但 R 中的每个 e 都会被移动。\n- move_backward：像 copy_backward，但\
    \ R 中的每个 e 都会被移动。\n\n- std::move_iterator 将拷贝算法转换为移动，例如：\n- std::copy_if(std::move_iterator<Lt>(b),\
    \ // == std::copy_if(b, e, p),\n  std::move_iterator<Lt>(e), // 但是移动而不是\n  p);\n\
    \n实际上不需要 std::move 和 std::move_backward，因为它们的效果可以通过 copy、copy_backward 和 move_iterators\
    \ 实现，但根据 Howard Hinnant 在 comp.std.c++ 上的帖子，委员会认为这两个算法可能会被频繁使用，为了符号表示上的方便，提供了它们的移动版本。\n\
    \n"
