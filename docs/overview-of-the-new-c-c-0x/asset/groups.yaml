  - "[PAGE 123]\n\n# Thread-Local Data\n\nVariables eligible for static storage duration\
    \ may be thread_local.\n\n+   - I.e., global/file/namespace-scoped vars; class-statics,\
    \ file.\n- thread_local std::string threadName; // e.g., at global or\n // namespace\
    \ scope\n static thread_local\n std::chrono::microseconds timeUsed(0); // e.g.,\
    \ at file scope\n\n```\nvoid f(int x)\n{\n  static thread_local unsigned timesCalled;\n\
    \  ...\n}\nclass Widget {\nprivate:\n  thread_local static std::unordered_map<u::string,\
    \ int> cache;\n  ...\n};\n```\n\nThe threadName variable, for example, could be\
    \ set by the function that the thread is started running in (i.e., that's passed\
    \ to the std::thread constructor).\n\nThe standard does not require that unused\
    \ thread-locals be constructed, so under good implementations, threads should\
    \ provide for construction/destruction of only those thread-locals they use. This\
    \ is a difference from global objects, which must be constructed/destructed unless\
    \ the implementation can establish that they have no side effects."
  - '[PAGE 124]


    # # Thread-Local Data


    Some details:


    +   - thread_locals may be dynamically initialized.

    - Their constructors may be arbitrarily complex.

    - thread_local may be combined with extern.'
  - '[PAGE 125]


    # Other Concurrency Features


    +   - Thread-safe initialization of objects of static storage duration.

    - Thread-safe one-time function invocation via std::call_once and std::once_flag.

    - Thread detachment when no join is needed.

    - Separation of task setup and invocation via std::packaged_task.

    - Support for mutex and lock UDTs via standard interfaces.

    - Atomic types (e.g., std::atomic<int>) with memory ordering operations.

    - Operations on current, e.g., yield and sleep.

    - Query number of hardware-supported threads.

    - Library thread safety guarantees (e.g., for std::cin/std::cout, STL containers,
    std::shared_ptr, etc.)

    - Many other features for threads, locks, condition variables, etc.

    - This is an overview.


    There is also a standard API for getting at the platform-specific handles behind
    threads


    "UDT" = "User Defined Type".


    The best way to find C++''s library thread safety guarantees is to search draft
    standard chapters 17pp for "data race". Relevant sections of N3290 are 17.6.5/9
    (general rules), 18.6.1/4 (memory allocators), 23.2.2 and 21.4/3 (STL containers
    and string), and 27.4.1/4 (stacks). Sometimes have to read between the lines,
    e.g., 17.6.5/7 of N3290 is, I believe, the standard''s way of stating reference
    count operations (e.g., in shared_ptr, promise, shared_future, etc.) must be threadsafe.'
  - '[PAGE 126]


    # Concurrency Support Summary


    +   - Threads run callable objects, support joining and detaching.

    - Callers must avoid argument lifetime problems.

    - std::async and futures support asynchronous calls.

    - Mutexes may de timeouts or recursion; typical use is via locks.

    - std::lock_guard often suffices, std::unique_lock is more flexible.

    - std::lock locks multiple mutexes w/o deadlock.

    - Condition variables do timeouts, predicates, custom mutex types.

    - Data eligible for static storage duration may may be thread-local.

    - Many concurrency support details aren''t treated in this talk.'
  - '[PAGE 127]


    # Summary of Features for Everybody


    +   - ">>" at close of nested templates eliminates a syntactic pothole.

    - auto variables have the type of their initializing expression.

    - Range-based for loops ease iteration over containers, arrays, etc.

    - nullptr avoids int/pointer confusion and aids perfect forwarding.

    - Unicode string encodings support UTF-8, UCS-16, and UTF-32.

    - Uniform initialization syntax and std::initializer_list makes brace initialization
    lists valid everywhere.

    - Lambda expressions create function objects at their point of use.

    - Template aliases allow “typedefs" to be created.

    - Concurrency support includes mutexes, locks, condition variables, thread-local
    data, asynchronous calls, and more.'
  - '[PAGE 128]


    # Overview


    +   - Introduction

    - Features for Everybody

    - Library Enhancements

    - Features for Class Authors

    - Features for Library Authors

    - Yet More Features

    - Further Information


    In general, the material on library enhancements is terser than the rest of the
    material, because I assume many attendees will be familiar with the STL and possibly
