    # C++0xx Standard Library Influences


    ![](img/68a90f505054116271758fb914871a74_129_0.png)


    Although the C++98 box is smallest, it had the strongest influence on the C++0xx
    standard library.'
  - "[PAGE 130]\n\n# New Features for Standard Containers\n\nGeneral:\n\n+   - Initializer\
    \ list support.\n- Move semantics support to avoid unnecessary copying.\n- Improved\
    \ const_iterator support\n  - cbegin/cend/crbe/ generate const_iterators/const_reverse_iterators\n\
    - const_iterators instead of iterators to specify locations.\n- emplace/emplace_hint\
    \ for copy/move-free in-place construction.\n\n```\nstd::vector<Widget> vw;\n\n\
    vw.push_back(Widget(10, 20)); // create temp Widget, copy\n// (or move) it into\
    \ vw,\n// destroy temp\n\nvw.emplace_back(10, 20); // create Widget in vw\n//\
    \ using ctor args\n\n```\n\nEmplacement operations can't be called with brace\
    \ initialization lists, because brace initialization lists can't be perfect-forwarded."
  - "[PAGE 131]\n\n# New Features for Standard Containers\n\nSpecific containers:\n\
    \n+   - vector::shrink_to_fit, deque::shrink_to_fit, string::shrink_to_fit\n-\
    \ All request removal of unused capacity.\n- vector::data member function (akin\
    \ to string's).\n- map::at member function that throws if key present.\n- set\
    \ and multiset elements now officially immutable.\n- Originally agreed on in 2001...\n\
    - Loopholes: mutable members, const_cast.\n  - Mutations affect sort order ⇒ undefined\
    \ behavior.\n\nRegarding vector::shrink_to_fit, N3290 says that \"shrink_to_fit\
    \ is a non-binding request to reduce capacity() to size.\" The description for\
    \ string::shrink_to_fit is similar. Presumably one can make no assumptions about\
    \ memory allocation, copying or moving of elements, exceptions, etc.\n\nThe motivation\
    \ for deque::shrink_to_fit is that array of block pointers can be arbitrarily\
    \ large, depending on the maximum size of the deque over its lifetime. Details\
    \ at http://www.open-std.org/jtc1/sc22/wg21/docs/papers/n2795.html#850."
  - "[PAGE 132]\n\n# TR1\n\n+   - Standard C++ Committee Library “Technical Report\
    \ 1.”\n- Basis for most new library functionality in C++0x.\n- Largely derived\
    \ from Boost libraries.\n- TR1 functionality in namespace std::tr1.\n- C++0x TR1-derived\
    \ functionality in std.\n  - Not identical to that in TR1.\n    * Uses new C++0x\
    \ features.\n    * Tweaks some APIs based on experience.\n  - APIs mostly backwards-compatible"
  - '[PAGE 133]


    # From TR1 to C++01x


    Common C++01x enhancements:


    +   * Variadic templates eliminate number-of-parameter restrictions.

    * New container conventions adopted.'
  - '[PAGE 134]


    # TR1 Functionality


    | New Functionality | Summary |

    | --- | --- |

    | Reference Wrapper | Objects that act like references |

    | Smart Pointers | Reference-counting smart pointers |

    | Return Type Determination | Useful for template programming |

    | Enhanced Member Pointer Adapter | 2nd-generation mem_fun/mem_fun_ref |

    | Enhanced Binder | 2nd-generation bind1st/bind2nd |

    | Generalized Functors | Generalization of function pointers |

    | Type Traits | Compile-time type reflection |

    | Random Numbers | Supports customizable distributions |

    | Mathematical Special Functions | Laguerre polynomials, beta function, etc. |

    | Tuples | Generalization of pair |

    | Fixed Size Array | Like vector, but no dynamic allocation |

    | Hash Tables | Hash table-based/multiset/map/multimap |

    | Regular Expressions | Generalized regex searches/replacements |

    | C99 Compatibility | 64-bit ints, <cintdef>, new format specs, etc. |


    Libraries in blue are also in C++0x. Libraries in bold are covered in this course
    (to least some degree).


    Regarding random numbers, C supports only *rand*, which is expected to produce
    a uniform distribution. C++0x supports both *engines* and *distributions*. An
    engine produces a uniform distribution, while a distribution takes the result
    of an engine and produces an arbitrary distribution from it. C++0x specifies default
    versions for the engine and distributions, but it also allows for customized versions
    of both.'
- md: "\n# From TR1 to C++0x\n\n| TR1 Functionality | C++0x Functionality Changes\
    \ |\n|---|--|\n| Reference Wrapper | None. |\n| Smart Pointers | Support for allocators\
    \ and unique_ptr. Minor new functionality (details shortly). |\n| Return Type\
    \ Determination | Inherent C++98 restrictions lifted. |\n| Enhanced Member Pointer\
    \ Adapter | None. |\n| Enhanced Binder | Inherent C++98 restrictions lifted. |\n\
    | Generalized Functors | Support for allocators. Added assign. |\n| Type Traits\
    \ | Inherent C++98 restrictions lifted. Some additions/renamings. |\n| Random\
    \ Numbers | Revised engines/distributions. Removal of variate_generator. |\n|\
    \ Mathematical Special Functions | Not in C++0x. (To be a separate standard.)\
    \ |\n| Tuples | Added tuple_cat. |\n| Fixed Size Array | Renamed assign -> fill.\
    \ |\n| Hash Tables | Support for operators == and !=. |\n| Regular Expressions\
    \ | String literals often (not just std::strings). |\n| C99 Compatibility | fabs(complex<T>)\
    \ -> abs(complex<T>). |\n\nOf the 23 proposed mathematical functions in TR1, 21\
    \ are preserved in the separate draft standard, \"Extensions to the C++ Library\
    \ to Support Mathematical Special Functions.\" The two missing functions are confluent\
    \ hypergeometric functions and hypergeometric functions.\n\n\"Inherent C++98 restrictions\
    \ lifted\" means that restrictions inherent in library functionality based on\
    \ C++98 were removed from the C++0x specification. From Stephen T. Lavave: \"\
    In C++0x, result_of is powered by decltype and thus always gets the right answer\
    \ without TR1's cumbersome and incomplete library machinery. Similarly, bind is\
    \ powered by rvalue references, lifting its restriction on rvalues. Type traits\
    \ are guaranteed to use compiler hooks and always gets the right answers.\" Practically\
    \ speaking, that many TR1 edge cases are no longer edge cases.\n\n# From TR1:\
    \ shared_ptr and weak_ptr\n\nMotivation:\n\n- Smart pointers simplify resource\
    \ management.\n- E.g., prevention of leaks when exceptions are thrown.\n\nThe\
    \ \"From TR1\" in the title indicates that this is a C++00x feature based on TR1\
    \ functionality.\n\n# shared_ptr\n\n- Declared in <memory>.\n- A reference-counting\
    \ smart pointer.\n- Pointed-to resources are released when the ref.count (RC)\
    \ -> 0.\n\n```cpp\n{\n  std::shared_ptr<Widget> p1(new Widget);\n\n  std::shared_ptr<Widget>\
    \ p2(p1);\n\n  p1->doThis();\n  if (p2) p2->doThat();\n  ...\n  p2 = nullptr;\n\
    \  ...\n\n  // RC = 0; Widget\n  // deleted\n}\n```\n\np2 = nullptr; is essentially\
    \ the same as p2.reset();\n\n\"RC\" = \"Reference Count\".\n\n# shared_ptr Constructors\n\
    \n- Default, copy, from raw pointer.\nstd::shared_ptr<Widget> pw1;\nstd::shared_ptr<Widget>\
    \ pw2(pw1);\nstd::shared_ptr<Widget> pw3(new Widget); // typical case\n- Latter\
    \ is explicit:\n\n- std::shared_ptr<Widget> pw4 = new Widget; // error!\n- Compatible\
    \ unique_ptr, auto_ptr, shared_ptr, or weak_ptr.\nstd::unique_ptr<Widget> makeUP();\
    \ // factory funcs\nstd::auto_ptr<Widget> makeAP();\nstd::shared_ptr<Widget> pw5(makeUP());\
    \ // from unique_ptr\nstd::shared_ptr<Widget> pw6(makeAP()); // from auto_ptr\n\
    std::shared_ptr<const Widget> pw7(pw3); // add const\n\n[std::unique_ptr has not\
    \ been introduced.]\n\n“Compatible” pointer types take into account derived-to-base\
    \ conversions (e.g., shared_ptr<base> from shared_ptr<derived>).\n\nConversion\
    \ from unique_ptr and auto_ptrs is supported only for sources that are non-const\
    \ values (as shown in the examples). Initializing a shared_ptr with an lvalue\
    \ or unique_ptr requires use of std::move.\n\n# shared_ptr Constructors\n\n- From\
    \ this:\n\n-> It's a raw pointer, but other shared_ptrs might already exist!\n\
    \n```cpp\nstd::shared_ptr<ISomething>\nWidget::getSomething()\n{\n    return std::shared_ptr<ISomething>(this);\
    \ // dangerous!\n} // could create a new ref count!\n```\n\n```cpp\nstd::shared_ptr<ISomething>\n\
    Widget::getSomething()\n{\n    return shared_from_this();\n} // okay, no chance\n\
    of a new RC\n```\n\n-> Inheritance from enable_shared_from_this is required:\n\
    \n```cpp\nclass Widget : public ISomething,\n    public std::enable_shared_from_this<Widget>\
    \ {\n    ...\n};\n```\n\n\"RC\" = \"Reference Count\".\n\nshared_from_this can't\
    \ be used to create the first shared_ptr to an object.\n\nUsing shared_from_this\
    \ in constructors, e.g., to register an object during its construction, is not\
    \ reliable. A brief discussion of the problem can be found at http://www.boost.org/libs/smart_ptr/sp_techniques.html#in_constructor.\n\
