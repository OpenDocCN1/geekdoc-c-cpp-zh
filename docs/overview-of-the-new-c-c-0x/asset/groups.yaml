- md: "\n# Overview\n\n- Introduction\n- Features for Everybody\n- Library Enhancements\n\
    - Features for Class Authors\n- Features for Library Authors\n- Yet More Features\n\
    - Further Information\n\n# \">>\" as Nested Template Closer\n\n\">\" now closes\
    \ a nested template when possible:\n\n- std::vector<std::list<int>> vi1; // fine\
    \ in C++0x, error in C++98\n\nThe C++98 \"extra space\" approach valid:\n\n- std::vector<std::list<int>>\
    \ >> vi2; // fine in C++0x and C++98\n\nFor a shift operation, use parentheses:\n\
    \n- I.e., \">\" now treated like \">\" during template parsing:\nconst int n =\
    \ ...; // n, m are compile-\nconst int m = ...; // time constants\nstd::array<int,\
    \ n>m?n:m> > a1; // error (as in C++98)\nstd::array<int, (n>m?n:m) > a2; // fine\
    \ (as in C++98)\nstd::list<std::array<int, n>>2 >> L1; // error in '98: 2 shifts;\n\
    // error in '0x: 1st '>>\"\n// closes both templates\n\n- std::list<std::array<int,\
    \ (n>>2)> >> L2; // fine in C++0x,\n// error in '98 (2 shifts))\n\n[std::array\
    \ has not yet been introduced.]\n\n# auto for Type Declarations\n\nauto variables\
    \ have the type of their initializing expression:\n\n```\nauto x1 = 10; // x1:\
    \ int\nstd::map<int, std::string> m;\nauto i1 = m.begin(); // i1: std::map<int,\
    \ std::string>::iterator\n```\n\nconst/volatile and reference/pointer adornments\
    \ may be added:\n\n```\nconst auto *x2 = &x1; // x2: const int*\nconst auto &i2\
    \ = m; // i2: const std::map<int, std::string>&\n```\n\nTo get a const_iterator,\
    \ use the new cbegin container function:\n\n```\nauto ci = m.cbegin(); // ci:\
    \ std::map<int, std::string>::const_iterator\n```\n\n- cend, crbegin, and crend\
    \ exist, too.\n\nOverview of the New C++ (C++0x)\n\n# auto for Type Declarations\n\
    \nType deduction for auto is akin to that for template parameters:\n\n```\ntemplate<typename\
    \ T> void f(T t);\n...\nf(expr);               // deduce t's type from expr\n\
    auto v = expr;         // do essentially the same thing for v's type\n```\n\n\
    ![](img/68a90f505054116271758fb914871a74_24_0.png)\n\nScott Meyers, Software Development\
    \ Consultant\nhttp://www.aristeia.com/\n\n© 2011 Scott Meyers, all rights reserved.\n\
    Slide 23\n\nRules governing auto are in [dcl.spec.auto](7.1.6.4) in N3290).\n\
    Rules governing auto are in [dcl....\n\nAs far as I know, the only way auto type\
    \ deduction is not the same as template type deduction is when deducing a type\
    \ from brace initialization lists. Auto uses `{x, y, z}` to be of type `std::initializer_list<T>`\
    \ (where T is the type of x, y, and z), but template parameter deduction does\
    \ not apply to brace initialization lists. (It's a \"non-deduced context.\")\n\
    \nAs noted in the discussion on rvalue references, the fact that auto uses the\
    \ type deduction rules as templates means that variables of type auto&& may, after\
    \ after reference collapsing, turn out to be lvalue:\n\n```\nint x;\nauto&&& a1\
    \ = x;         // x is lvalue, so type of a1 is int&\nauto&&& a2 = std::move(x);\
    \ // std::move(x) is rvalue, so type of a2 is int&&\n```\n\nScott Meyers, Software\
    \ Development Consultant\nhttp://www.aristeia.com/\n\n© 2011 Scott Meyers, all\
    \ rights reserved.\nDownload from Wow! eBook <www.wovebook.com\n\n# auto for Type\
    \ Declarations\n\nFor variables not explicitly declared to be a reference:\n\n\
    - Top-level/volatile in initializing type are ignored.\n- Array and function names\
    \ decay to pointers.\n\n```\nconst std::list<int> li;\nauto v1 = li;         \
    \      // v1: std::list<int>\nauto &v2 = li;              // v2: std::list<int>&\n\
    float data[ArraySize];\nauto v3 = data;            // v3: float*\n```\n\nExamples\
    \ from earlier:\n\n```\nauto x1 = 10;                    // x1: int\nstd::map<int,\
    \ std::string> m;   i1: std::map<int, std::string>::iterator\nauto i1 = m.begin();\
    \               // x2: const int (const is top-level)\nconst auto *x2 = &x1; \
    \              // i2: const::map<int, std::string>&\nconst auto &i2 = m;     \
    \           // ci: std::map<int, std::string>::const_iterator\nauto ci = m.begin();\n\
    ```\n\n#auto can be used to declare multiple variables:\n\n```\nvoid f(std::string&\
    \ s)\n  auto temp = s, *pOrig = &s; // temp: std::string, pOrig: std::string*\n\
    ```\n\nEach initialization must yield same deduced type.\n\n```\nauto i = 10,\
    \ d = 5; // error!\n```\n\n# auto for Type Declarations\n\nBoth direct and copy\
    \ initialization syntaxes are permitted.\n\n```\nauto v1(expr); // direct initialization\n\
    auto v2 = expr; // copy initialization\n```\n\nFor auto, both syntaxes have the\
    \ same meaning.\n\nThe fact that in ordinary initializations, direct initialization\
    \ syntax can call explicit constructors and copy initialization syntax cannot\
    \ is irrelevant, because the type of the initializing expression will determine\
    \ what auto deduces. From Daniel Klaus:\n\n```\nstruct Explicit {\nExplicit(){}\n\
    explicit(const Explicit&)\n} ex;\nauto ex2 = ex; // Error\nauto ex3(ex); // OK\n\
    ```\n\n# Range-Based for Loops\n\nLooping over a container can take this streamlined\
    \ form:\n\n```\nstd::vector<int> v;\n...\nfor (int i : v) std::cout << i; // iteratively\
    \ set i to every element in v\n```\n\nThe iterating variable may also be a reference:\n\
    \n```\nfor (int& i : v) std::cout << ++i; // increment and everything in v\n```\n\
    \nauto, const, and volatile are allowed:\n\n```\nfor (auto i : v) std::cout <<\
    \ i; // same as above\nfor (auto& i : v) std::cout << ++i; // ditto\nfor (volatile\
    \ int i : v) someOtherFunc(i); // or \"volatile auto i\"\n```\n\n# Range-Based\
    \ for Loops\n\nValid for any type supporting the notion of a range.\n\n- Given\
    \ obj of type T, begin(obj) and end(obj) are valid.\n- All C++0x library containers.\n\
    - Arrays and arrays.\n- Initializer lists.\n- Regular expression matches.\n- Any\
    \ UDT T where begin(T) and end(T) yield suitable iterators.\n\nIncludes:\n\n[Initializer\
    \ lists, regular expressions, and tuples have not yet been introduced.]\n\n![](img/68a90f505054116271758fb914871a74_29_0.png)\n\
    \nIteration over regular expression matches is supported, because std::match_results\
    \ offers begin and end member functions for iterating over submatches within the\
    \ match.\n\n“UDT” = “User Defined Type”.\n\n# Range-Based for Loops\n\nExamples:\n\
    \n```\nstd::unordered_multiset<std::shared_ptr<Widget>> msspw;\n...\n```\n\n```\n\
    for (const auto& p : msspw) {\n    std::cout << p << '\\n';\n    // print pointer\
    \ value\n}\n```\n\n```\nshort vals[ArraySize];\n...\n```\n\n```\nfor (auto& v\
    \ : vals) { v = -v; }\n```\n\n[unordered_multiset and shared_ptr have not yet\
    \ been introduced.]\n\nThe loop variable p is declared a reference, because copying\
    \ the shared_ptrs in msspw would cause otherwise unnecessary reference count manipulations,\
    \ which could have a performance impact in multi-threaded code (or even in single-threaded\
    \ code where shared_ptr uses thread-safe reference count increments/decrements).\n\
    \n# Range-Based for Loop Specification\n\nfor ( iterVarDeclaration : expression\
    \ ) statementToExecute\nis essentially equivalent to\n\n```\n{\n  auto&& range\
    \ = expression;\n  for (auto b = begin(range), e = end(range);\n       b != e;\n\
    \       ++b) {\n    iterVarDeclaration = *b;\n    statementToExecute\n  }\n}\n\
    ```\n\nStandardese somewhat more complex.\n\nThis slide is for reference only\
    \ and is not expected to be self-explanatory. Among the\ndetails not mentioned\
    \ are that (1) arrays get special handling rather than calling/end,\n(2) when\
    \ using ADL to find/end, the versions in the standard namespace are always\navailable,\
    \ and (3) expression may be a braced initializer list.\n\n# Range-Based for Loops\n\
    \nRange form valid only for for-loops.\n\n- Not do-loops, not while-loops.\n\n\
    # nullptr\n\nA new keyword. Indicates a null pointer.\n\n- Convertible to any\
    \ pointer type and to bool, but nothing else.\n- Can't be used as an integral\
    \ value.\n\n```\nconst char *p = nullptr; // p is null\nif (p) ... // code compiles,\
    \ test fails\nint i = nullptr; // error!\n```\n\nTraditional uses of 0 and NULL\
    \ remain valid:\n\n```\nint *p1 = nullptr; // p1 is null\nint *p2 = 0; // p2 is\
    \ null\nint *p3 = NULL; // p3 is null\nif (p1 == p2 && p1 == p3) // code compiles,\
    \ test succeeds\n```\n\nThe term “keyword” is stronger than “reserved word.” Keywords\
    \ are unconditionally reserved (except as attribute names, sigh), while, e.g.,\
    \ “main” is reserved only when used as the name of a function at global scope.\n\
    \nThe type of nullptr is std::null_t. Other pointer types may be cast to this\
    \ type via static_cast (or C-style cast). The result is always a null pointer.\n"
