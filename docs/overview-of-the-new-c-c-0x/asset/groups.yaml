    \n```cpp\nint x, *ptr;\ndecltype(x) i1;               // i1 的类型是 int\ndecltype(ptr)\
    \ p1;             // p1 的类型是 int*\nstd::size_t sz = sizeof(decltype(ptr[44]));\
    \ // sz = sizeof(\n```\n\n"
