  - '[PAGE 246]


    # Rvalue References and const


    C++ remains const-correct:


    +   - const lvalues/rvalues bind only to references-to-const.


    But rvalue-references-to-const are essentially useless.


    +   - Rvalue references designed for two specific problems:

    - Move semantics

    - Perfect forwarding


    +   - C++0x language rules carefully crafted for these needs.

    - rvalue-refs-to-const not considered in these rules.


    +   - T&&s are legal, but not designed to be useful.

    - Uses already emerging ::-


    The crux of why rvalue-references-to-const is not useful is the special handling
    accorded T&&s parameters in [temp.duct.call] (14.8.2.1/3 in N3290): “If P is an
    rvalue reference to a c-unqualified template parameter [i.e. T&] and the argument
    is an lvalue, the type ‘lvalue reference to A’ [i.e., T&] is used in place of
    A for type deduction.” This hack applies only to T& parameters, not const T& parameters.


    The emerging use for const T& template parameters is to allow binding lvalues
    while prohibiting references, e.g., from [function.objects] (20.8/2 in N3290):


    ```

    template <class T> reference_wrapper<T> ref(T&) noexcept;

    template <class T> reference_wrapper<const T> cref(const T&) noexcept;

    template <class T> void ref(const T&&) = delete;

    template <class T> void cref(const T&&) = delete;

    ```'
