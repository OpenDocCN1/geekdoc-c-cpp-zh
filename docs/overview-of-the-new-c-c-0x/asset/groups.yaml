    \ Tn> 继承自 std::tuple<T2, T3, ..., Tn>\n\n给定一个类型列表，std::common_type 返回列表中的类型，列表中的所有类型都可以转换为该类型。如果没有这样的类型，或者存在多个这样的类型，代码将无法编译。对于内建类型，按照其通常顺序应用标准的提升和转换规则，例如\
    \ `std::common_type<int, double>::type` 是 `double`，因为 int->double 优于 double->int，尽管二者都是可能的。\n\
    \n# std::tuple 的草图\n\n```cpp\ntemplate <class... Types> // 声明主模板\nclass tuple:\n\
    template<> class tuple<>; // 用于空元组\ntemplate<typename T, typename... TRest> //\
    \ 带有数据成员的类\nclass tuple<T, TRest...> { // 用于包中的第一个 T // 继承自 // 包的剩余部分\nprivate:\n\
    \    tuple<TRest... > { // 类型为 T 的数据成员\n    T data;\npublic:\n    tuple() : data()\
    \ {}; // 默认构造函数；所有类型必须是可以默认构造的 // 非默认构造函数。\n...\n};\n```\n\n在成员初始化行上执行“data()`可以确保内建类型初始化为零（指针为空）。\n\
