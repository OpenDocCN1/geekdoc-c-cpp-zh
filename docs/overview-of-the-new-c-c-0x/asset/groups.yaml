    \ aren't treated in this talk.\n\n## Summary of Features for Everybody\n\n- \"\
    >>\" at close of nested templates eliminates a syntactic pothole.\n- auto variables\
    \ have the type of their initializing expression.\n- Range-based for loops ease\
