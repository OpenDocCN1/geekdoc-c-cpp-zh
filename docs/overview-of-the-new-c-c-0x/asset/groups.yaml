  - "[PAGE 318]\n\n# Variadic Function Templates\n\nExample: type-safe printing of\
    \ arbitrary objects:\n\n```\nvoid print() { std::cout << '\\n'; }; // print 0\
    \ objects\ntemplate<typename T,\n    typename... TRest> // type of 1st object\n\
    void print(const T& obj,   // types of the rest\n           const TRest&... rest)\
    \ // print 1st object\n{\n    std::cout << obj << \" \"; // print the rest\n \
    \   print(rest..);\n} // print the rest\n\ndouble p = 3.14;\nstd::string s(\"\
    Vari\");\nprint(-22, p, &p, s, \"adic\"); // -22 3.14 0x22ff40 Vari adic\n```\n\
    \n+   - Gregor's Järvi's article shows a compile-time-checked printf.\n- Ensures\
    \ format string consistent with passed arguments.\n\nThis example passes everything\
    \ by const T&, but perfect forwarding would probably be a better approach."
  - "[PAGE 319]\n\n# Unpacking Patterns\n\nUnpacking uses the pattern of the expression\
    \ being unpacked:\n\n```\ntemplate<class T, class... Args>\nshared_ptr<T> // add\
    \ \"&&\" to each\n    make_shared(Args&&... params);    // unpacked elem.\ntemplate<typename\
    \ T, typename... TRest> // add \"const\" and\n    void print(const T& obj, const\
    \ TRest&... rest) // add \"&&\" to each\n{\n    std::cout << obj << \" \"\",\n\
    \    print(rest...);\n}\n// add nothing to\neach elem's name\n```\n\nCall to print\
    \ expands to:\nprint(rest1, rest2, ..., restn);\n\nThe ellipsis is always at the\
    \ end of the pattern."
  - "[PAGE 320]\n\n# Unpacking Patterns\n\n```\ntemplate<typename T> // return a normalized\n\
    T normalize(T& obj); // copy of obj\ntemplate<typename F, typename... PTypes>\n\
    void normalizedCall(F func,\n    PTypes&... params) // as before\n{\n    func(normalize(params...);\
    \   // call normalize on\n} // each unpacked elem\n```\n\nCall to func expands\
    \ to:\n\n```\nfunc(normalize(params₁), normalize(params₂), ..., normalize(paramsₙ));\n\
    ```"
  - '[PAGE 321]


    # Variadic Class Templates


    Foundational for TMP (template metaprogramming). Examples:


    +   - Type computations:

    - <type_traits> has template <class... T> struct common_type;


    +   - Object structure generation:

    - std::tuple<T1, T2, ..., Tn> needs n fields, each of correct type.

    - std::tuple<T1, T2, ..., Tn> inherits from std::tuple<T2, T3, ..., Tn>


    Given a list of types, std::common_type returns the type in the list to which
    all types in the list can be converted. If there is no such type, or if there
    is more than one such type, the code won''t compile. For built-in types, the usual
    promotion and conversion rules apply in their usual order, e.g., std::common_type<int,
    double>::type is double, because int->double is preferable to double->int, although
    both are possible.'
  - "[PAGE 322]\n\n# # Sketch of std::tuple\n\n```\ntemplate <class... Types> // declare\
    \ primary template\nclass tuple:\ntemplate<> class tuple<>; // for empty tuples\n\
    template<typename T, typename... TRest> // class with data member\nclass tuple<T,\
    \ TRest...> { // for 1st T in pack // inherits from class // rest of pack\nprivate:\n\
    \    tuple<TRest... > > { // data member of type T\n    T data;\npublic:\n   \
    \ tuple() : data() {}; // default ctor; all types must be default-constructible\
    \ // non-default ctors.\n...\n};\n```\n\nDoing “data()” on the member initialization\
    \ line ensure that built-in types are initialized to zero (and pointers to null).\n\
    \nThe implementation published by Douglas Gregor and Jaakko Järvi (see Further\
    \ Information section) declares data protected, but no justification is given,\
    \ and real implementations (e.g., in VC 10, gcc 4.5) declare private. Hence my\
    \ use of private."
  - '[PAGE 323]


    # Generated Hierarchy


    std::tuple<int, char, std::string> t;


    ![](img/68a90f505054116271758fb914871a74_323_0.png)


    The fact that data is private raises the question of how std::get is implemented.
    Among tuple member functions not listed in this example is public one returning
    a reference to data. Among Gregor and Järvi’s implementation, this function is
    called head. std::get<n> on a tuple<T, TRest...> recursively walks up TRest, decreasing
    n at leach level until it’s 0. It then returns the result of head for that class.'
  - "[PAGE 324]\n\n# decltype\n\nYields the type of an expression without evaluating\
    \ it.\n\n```\nint x, *ptr;\ndecltype(x) i1;               // i1's type is int\n\
    decltype(ptr) p1;             // p1's type is int*\nstd::size_t sz = sizeof(decltype(ptr[44]));\
    \ // sz = sizeof(int);\n                             // ptr[44] not evaluated\n\
    ```\n\nFairly intuitive, but some quirks, e.g., parentheses can matter:\n\n```\n\
    struct S { double d; };nconst S* p;\n...\ndecltype(p->d) x1;         // double\n\
    decltype((p->d)) x2;        // const double&\n```\n\n+   - Quirks rarely relevant\
    \ (and can be looked up when necessary)."
  - "[PAGE 325]\n\n# decltype\n\nPrimary use: template return types that depend on\
    \ parameter types.\n\n+   - Common for forwarding templates:\n  template<typename\
    \ F, typename... Ts> // logAndInvoke\n  auto logAndInvoke(std::ostream& os, //\
    \ returns what\n  F& func, Ts&... args) -> // func(args...) does.\n  decltype(func(args...))\
    \ // not quite right\n  os << std::chrono::system_clock::now(); // from new time\
    \ lib\n  return func(args...); // not quite right\n\n+   - Also in math-related\
    \ libraries:\n  template<typename T1, typename T2> // mult's return type\n  auto\
    \ mult(T1& a, T2&& b) -> // is same as a*b's.\n  decltype(a * b) // not quite\
    \ right\n  return a * b;\n\n\nFor the code on this page to be correct, we need\
    \ to add uses of std::forward in various places. Hence the comments that say \"\
    not quite right\". The code is shown shortly.\n\n\nThere is no operator<< for\
    \ std::chrono::time_point objects (the return type from std::chrono::system_clock::now)\
    \ in the standard library, so the statement involving std::chrono::system_clock::now\
    \ will not compile unless such an operator<< has been explicitly declared."
  - "[PAGE 326]\n\n# The Forwarding Problem\n\n```\ntemplate<typename F, typename...\
    \ Ts> // as before\nauto logAndInvoke(std::ostream& os, F&& func, Ts&&... args)\
    \ -> // not quite right\n    decltype(func(args...))\n{\n    os << std::chrono::system_clock::now();\
    \             // not quite right\n    return func(args...);\n}\n```\n\nargs...\
    \ are lvalues, but logAndInvoke's caller may have passed rvalues:\n\n+   - Templates\
    \ can distinguish rvalues from lvalues.\n- logAndInvoke might call the wrong overload\
    \ of func."
  - "[PAGE 327]\n\n# The Forwarding Problem\n\nExample:\n\n```\nclass FontProcessor\
    \ {\npublic:\n    void operator()(const Font&); // takes lvalue\n    void operator()(Font&&);\
    \ // takes rvalue\n};\n```\n\n```\nFont getFont(); // function returning rvalue\n\
    logAndInvoke(std::cout, // caller passes rvalue, but\n    FontProcessor(), //\
    \ logAndInvoke calls\n    getFont()); // FontProcessor::operator()\n```"
  - "[PAGE 328]\n\n# Perfect Forwarding Redux\n\nSolution is perfect forwarding:\n\
    \n```\ntemplate<typename F, typename... Ts> // return type is\nauto logAndInvoke(std::ostream&\
    \ os, F&& func, Ts&&... args) -> // same as func's\ndecltype(func(std::forward<Ts>(args...))\n\
    {\n    os << std::chrono::system_clock::now();\n    return func(std::forward<Ts>(args...));\n\
    }\n```\n\nIn an expression \"std::forward<Ts>(args)...\", the pattern is being\
    \ unpacked is\n\"std::forward<Ts>(args)\", so \"std::forward<Ts>(args)...\" is\
    \ equivalent to\n\"std::forward<Ts1>(args1), std::forward<Ts2>(args2), ..., std::forward<Tn>(args)\"\
    . This is a pack pack pattern that involves the simultaneous unpacking of two\
    \ parameter\npacks: one from the template parameter list (Ts) and one from the\
    \ function parameter list\n(args)."
  - "[PAGE 329]\n\n# Perfect Forwarding Redux\n\nA correct version of mult:\n\n```\n\
    template<typename T1, typename T2>\nauto mult(T1&& a, T2&& b) ->\n    decltype(std::forward<T1>(a)\
    \ * std::forward<T2>(b))\n{\n    return std::forward<T1>(a) * std::forward<T2>(b);\n\
    }\n```\n\n![](img/68a90f505054116271758fb914871a74_329_0.png)"
  - '[PAGE 330]


    # decltype vs. auto


    To declare objects, decltype can replace auto, but more verbosity:


    ```

    std::vector<std::string> vs;

    ...

    ```


    ```

    auto i = vs.begin();

    decltype(vs.begin()) i = vs.begin();

    ```


    Only decltype solves the template-function-return-type problem.


    auto is for everybody. decltype is primarily for template authors.'
  - '[PAGE 331]


    # Summary of Features for Library Authors


    +   * static_assert checks its condition during compilation.

    * explicit conversion functions restrict their implicit application.

    * Variadic templates accept an unlimited number of arguments.

    * decltype helps declare template functions whose return type depends on parameter
    types.'
- md: "\n## Overview\n\n- Introduction\n- Features for Everybody\n- Library Enhancements\n\
    - Features for Class Authors\n- Features for Library Authors\n- Yet More Features\n\
    - Further Information\n\n## More C++0x Features\n\n- Enum enhancements:\n- Forward\
    \ declaration\n- Specification of underlying type\n- Enumerant scoped to the enum\n\
    - No implicit conversion to int\n- Unrestricted unions (members may be any non-reference\
    \ type).\n- Time library support: clocks, durations, points in time.\n- Local\
    \ types allowed as template arguments.\n- C99 compatibility, e.g., long long,\
    \ __func__, etc.\n- Inline namespaces facilitate library versioning.\n- Scoped\
    \ allocators allow containers and their elements to use different allocators,\
    \ e.g., vector<string>.\n\nThe primary motivation for the time library was to\
    \ be able to specify timeouts for the concurrency API (e.g., sleep durations,\
    \ timeouts for lock acquisition, etc.).\n\n## Still More C++0x Features\n\n- Generalized\
    \ constant expressions (constexpr).\n- User-defined literals (e.g., 10_km, 30_sec).\n\
    - Relaxed POD type definition; new standard layout types.\n- extern templates\
    \ for control of implicit template instantiation.\n- sizeof applicable to class\
    \ data members alone (e.g., sizeof(C::m)).\n- & and && member functions.\n- Relaxed\
    \ rules for in-class initialization of static data members.\n- Contextual keywords\
    \ for alignment control and constraining virtual function overloads.\n- Attributes\
    \ express special optimization opportunities and provide a standard syntax for\
    \ platform-specific extensions.\n\n## Removed and Deprecated Features\n\n- auto\
    \ as a storage class has been removed.\n- export as a language feature has been\
    \ removed.\n- export remains a keyword (with no semantics).\n- register as a storage\
    \ class has been deprecated.\n- Exception specifications have been deprecated.\n\
    - noexcept conceptually replaces the \"throw()\" specification.\n- auto_ptr is\
    \ deprecated. (Use unique_ptr instead.)\n- bind1st/bind2nd are deprecated. (Use\
    \ bind or lambdas instead.)\n\nIf an exception attempts to propagate beyond a\
    \ noexcept(true) function, terminate is called. This is different from what happens\
    \ in C++03 if a \"throw()\" specifier is violated. In that case, unexpected is\
    \ invoked after the stack has been unbound.\n\nFrom Herb Sutter's 8 December 2010\
    \ blog post, \"Trip Report: November 2010 C++ Standards Meeting; 'Destructor and\
    \ delete operators [are] noexcept by default ... Briefly, every destructor will\
    \ be noexcept by default unless member or base destructor is noexcept(false);\
    \ you of course still explicitly override the default and noexcept(false) on any\
    \ destructor.\"\n\nHerb Sutter argues that the primary advantage of noexcept over\
    \ throw() is that noexcept offers compilers additional optimization opportunities.\
    \ From a 30 March 2010 comp.std.cpp posting: \"noexcept enables optimizations\
    \ not only in the caller but also in the callees, so that the optimizer can assume\
    \ functions called in a noexcept function and not wrapped in a try/catch are themselves\
