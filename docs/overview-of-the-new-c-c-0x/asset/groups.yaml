    # unique_ptr


    Successor to auto_ptr (which C++0x deprecates).


    +   - Declared in <memory>.

    - Like auto_ptr, supports moving values instead of copying.

    - But avoids "copy syntax that really moves."

    - More general than auto_ptr:

