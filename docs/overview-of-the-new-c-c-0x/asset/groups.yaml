    \n# 移动是拷贝的优化\n\n支持移动的可拷贝类型，移动请求会产生拷贝：\n\n```cpp\nclass Widget { // 不支持移动的类\npublic:\n\
    \    Widget(const Widget&); // 拷贝构造\n};\nclass Gadget { // 支持移动的类\npublic:\n \
