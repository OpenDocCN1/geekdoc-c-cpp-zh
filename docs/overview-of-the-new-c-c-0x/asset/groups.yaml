    \ VC 10, gcc 4.5）将其声明为 `private`。因此我使用了 `private`。\n\n# 生成的层次结构\n\nstd::tuple<int,\
    \ char, std::string> t;\n\n![](img/68a90f505054116271758fb914871a74_323_0.png)\n\
    \ndata 是 `private` 的这一事实引发了关于 std::get 如何实现的问题。在示例未列出的 tuple 成员函数中，有一个返回 data\
    \ 引用的公共函数。在 Gregor 和 Järvi 的实现中，该函数被称为 `head`。对 `tuple<T, TRest...>` 使用 `std::get<n>`\
