    \ Properties,” Danny Kalev, DevX.com, 14 May 2009.\n- “Overriding Virtual Functions?\
    \ Use C++0x Attributes to Avoid Bugs,” Danny Kalev, DevX.com, 12 November 2009.\n\
    \n# Acknowledgements\n\nMany, *many*, thanks to my pre-release materials' reviewers:\n\
    \n- Stephan T. Lavavej\n- Bernhard Merkle\n- Stanley Friesen\n- Leor Zolman\n\
    - Hendrik Schober\n\nAnthony Williams contributed C++0x expertise and his std::thread\
