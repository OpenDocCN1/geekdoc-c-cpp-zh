    \         // 而不是指针\nstd::set<int*, decltype(cmpFnc)> s(cmpFnc); // 按此方式对 s 排序\n\
    ```\n\n[`decltype] 尚未引入。]\n\n闭包类型不是默认构造的，因此这会导致失败：\n\n```cpp\nstd::set<int*, decltype(cmpFnc)>\
    \ s;     // 错误！比较对象无法\n                                            // \n```\n\n\
    ## Lambda/闭包总结\n\n-   Lambda 表达式生成闭包。\n-   调用状态可以按值或按引用进行捕获。\n-   返回类型在指定时，使用尾随返回类型语法。\n\
    -   闭包可以使用 `auto` 或 `std::function` 存储。\n-   注意存储在闭包中的悬空引用/指针。\n-   短、清晰且源于上下文的\
    \ Lambda 是最好的。\n\n## 模板别名 (Template Aliases)\n\nusing 声明现在可以用于“部分绑定”模板：\n\n```cpp\n\
    template<typename T>\nusing MyAllocVec = std::vector<T, MyAllocator>;\nMyAllocVec<int>\
    \ v; // std::vector<int, MyAllocator>\n\ntemplate<std::size_t N>\nusing StringArray\
    \ = std::array<std::string, N>;\nStringArray<15> sa; // std::array<std::string,\
    \ 15>\n\ntemplate<typename K, typename V>\nusing MapGT = std::map<K, V, std::greater<K>>;\n\
    MapGT<long long, std::shared_ptr<std::string>> myMap; // std::map<long long, std::shared_ptr<std::string>,\
    \ std::greater<long long>>\n```\n\n## 模板别名\n\n模板别名不能被特化：\n\n```cpp\ntemplate<typename\
    \ T> // 之前的\nusing MyAllocVec = std::vector<T, Allocator>; // 页面\ntemplate<typename\
    \ T>\nusing MyAllocVec = std::vector<T*, MyPtrAllocator>; // 错误！\n```\n\n要实现这种效果，请使用特征类（traits\
    \ class）：\n\n```cpp\ntemplate<typename T> // 主\nstruct VecAllocator {\n  typedef\
    \ MyAllocator type;\n};\n```\n\n```cpp\ntemplate<typename T> // 特化\nstruct VecAllocator<T*>\
    \ // 模板\n  typedef MyPtrAllocator type;\n};\n```\n\n```cpp\ntemplate<typename\
    \ T>\nusing MyAllocVec = std::vector<T, typename VecAllocator<T>>::type;\n```\n\
    \n## using 作为 typedef\n\n在没有模板化的情况下，using 可以等同于 typedef：\n\n```cpp\ntypedef std::unordered_set<int>\
    \ IntHash; // 这两行有效\nusing IntHash = std::unordered_set<int>; // 相同\n```\n\nusing\
    \ 声明更具可读性：\n\n```cpp\ntypedef void (*CallbackPtr)(int); // 函数指针 typedef\nusing\
    \ CallbackPtr = void (*)(int); // 等同的 using 声明.\n```\n\n本课程关于 C++0x 标准，而不是并发，因此我假设与会者熟悉线程的基本问题，包括何时应该使用和不应该使用线程、竞态条件、同步、死锁、测试等。此页上的功能列表并不详尽，在并发讨论的末尾有一个“其他功能”的列表。\n\
    \n## 线程 (Threads)\n\nstd::thread 接受任何“可调用对象”并异步运行它：\n\n```cpp\nvoid doThis();\n\
    class Widget {\n  public:\n    void operator()() const;\n    void normalize(long\
    \ double, int, std::vector<float>);\n};\n\nstd::thread t1(doThis); // 异步运行函数\n\
    Widget w;\nstd::thread t2(w); // 异步“运行”函数对象\n```\n\n要传递参数，可以使用 lambda：\n\n```cpp\n\
    long double id;\nint x;\nstd::thread t3([&]{w.normalize(id, x, {1, 2, 3});});\
    \ // 异步运行\n```\n\n多线程的行为与经典单线程行为相似，尽管未同步的访问可能会导致竞态。如果主函数退出而其他线程仍在运行，这意味着“意外终止”，将导致未定义行为。线程不能挂起状态启动，但\
    \ `std::thread::native_handle` 应该是可用的。通过 `pthread_cancel` 线程被强制杀死。\n\n## 数据生命周期\
    \ (Data Lifetime)\n\n在 ST 中调用的函数知道数据是“冻结”的：\n-   它们在调用期间不会被销毁。\n-   只有调用的函数可以改变它们的值。\n\
    \n```cpp\nint x, y, z;\nWidget *pw;\n...\nf(x, y); // ST 中的调用\n```\n\n在 f 的执行期间：\n\
    -   x, y, z 和 pw 将继续存在。\n-   除非 f 导致 pw 被删除。\n\n取决于 f 如何声明其参数：\n\n```cpp\nvoid\
    \ f(int xParam, int yParam);      // 按值传递：\nvoid f(int&xParam, int&yParam);  \
    \           // 按引用传递：\nvoid f(const int&xParam, const int&yParam); \n```\n\n异步调用中的数据是冻结的：\n\
    -   闭包包含 x 和 w 的拷贝。\n-   闭包被线程构造函数拷贝；直到 f 返回才存在。\n-   x, y, z 和 pw 可能会改变。\n\n\
    结论：数据生命周期问题在多线程 (MT) 设计中至关重要。即使是共享数据也受生命周期问题影响。异步调用中的按引用/按指针参数是有风险的。同步/竞态问题。优先按值传递。通过\
    \ Lambda！\n\n```cpp\nvoid f(int xParam); // 异步调用函数\n\n{\n  int x;\n  std::thread\
    \ t1([&]{f(x)}); // 有风险！闭包持有 x 的引用\n  std::thread t2([=]{f(x)}); // 可以，闭包持有 x\
    \ 的拷贝\n} // x 被销毁\n```\n\n在 t1 的情况下，lambda 的闭包对象在调用线程继续之前创建，但调用线程可能在 f 开始执行之前继续。等到\
    \ xParam 初始化，闭包可能持有悬空引用，因为 x 已经被销毁。\n\n## 避免生命周期问题\n\n基本策略：\n\n-   为异步调用拷贝数据。\n\
    -   确保引用的对象足够持久。\n\n## 为异步调用拷贝参数\n\nstd::thread 的变长构造函数（概念上）拷贝所有内容：\n\n```cpp\n\
    void f(int xVal, const Widget& wVal);\nint x;\nWidget w;\nstd::thread t(f, x,\
    \ w);      // 在 x, w 的拷贝上调用 f\n```\n\n-   f, x, w 的拷贝保证持续到异步调用返回。\n-   在 f 内部，wVal\
    \ 指向 w 的拷贝，而不是本身。\n-   我们移动语义时的细节。\n\n尽可能将拷贝优化为移动。\n\n在这个示例中，“拷贝”意味着拷贝指向它的指针，将此拷贝优化为移动没有意义，因为拷贝指针是廉价的。通用规则是线程构造函数拷贝/移动它的第一个参数，即要异步执行的函数。\n\
    \n## 拷贝参数\n\n在闭包中使用按值捕获也有效：\n\n```cpp\nvoid f(int xVal, const Widget& wVal);\n\
    int x;\nWidget w;\n...\nstd::thread t([&]{ f(x, w); }); // 在 x, w 的拷贝上调用 f\n```\n\
    \n-   闭包包含 x 和 w 的拷贝。\n-   闭包被线程构造函数拷贝；直到 f 返回才存在。\n-   尽可能将拷贝优化为移动。\n-   在 f\
    \ 内部，wVal 指向 w 的拷贝，而不是本身。\n\n## 拷贝参数\n\n另一种方法基于 std::bind：\n\n```cpp\nvoid f(int\
    \ xVal, const Widget& wVal);\nint x;\nWidget w;\n...\nstd::thread t(std::bind(f,\
    \ x, w)); // 在 x, w 的拷贝上调用 f\n```\n\n-   bind 返回的对象包含 x 和 w 的拷贝。\n-   该对象被线程构造函数拷贝；直到\
    \ f 返回才存在。\n-   在 f 内部，wVal 指向 w 的拷贝，而不是本身。\n\n我们稍后会检查 std::bind。\n\n-   Lambda\
    \ 通常比 bind 是更好的选择。\n-   读者更易理解。\n-   更高效。\n\n"
