    \n“Artima”术语和 Artima 标志是 Artima, Inc. 的商标或注册商标。所有其他公司和/或产品名称可能是所有者的商标或注册商标。\n\n\
    # 新 C++ (C++0x) 概述\n\nScott Meyers, 博士\n软件开发顾问\n\nsmeyers@aristeia.com\nhttp://www.aristeia.com/\n\
    电话: 503/638-6028\n传真: 503/974-1888\n\n这些是 Scott Meyers 培训课程“新 C++ (C++0x) 概述”的官方笔记。课程说明见\
    \ http://www.aristica.com/C++0x.html。许可信息见 http://aristeia.com/Licensing/licensing.html。\n\
    \n请将错误报告和改进建议发送至 smeyers@aristeia.com。\n\n在这些笔记中，以 N 前缀的编号文档（例如 N3290）指的是 C++\
    \ 标准化文档。所有此类文档可通过 http://www.open-std.org/jtc/1sc22/wg21/docs/papers 访问。\n\n对\
    \ C++0x 草稿章节的引用格式为 [章节.节]。这些符号名称在不同草稿之间不会改变。引用给出了章节号和（斜杠后的）特定草稿的段落；这些数字在不同草稿中可能会变化。因此，[basic.fundamental](N3290\
    \ 中的 3.9.1) 指的是具有（永久）符号名称 [basic.fundamental] 的章节——特别是 N3290 中的 3.9.1 第 5 段。\n\
    \n注释（如本）是供授课的讲师使用的。所有注释对讲师和独立阅读笔记的人都应该有用。\n\n第一天通常结束在讨论 C++0x 并发 API 的部分。第二天通常会到库材料的末尾。\n\
    \n## 概述\n\n- 引言\n  - 历史、词汇、C++98/C++0x 快速比较\n- 适合所有人的特性\n  - auto、基于范围的 for、lambdas、线程等。\n\
    - 库增强\n  - 更多适合所有人的特性\n  - TRI-base、完美转发、forward_list、unique_ptr 等。\n- 适合类作者的特性\n\
    \  - 移动语义、完美转发、委托/继承构造函数等。\n- 适合库作者的特性\n  - 变长模板、decltype 等。\n  - 更多更多特性\n  -\
    \ 已移除和废弃特性\n  - 更多信息\n\n本课程是一个概述，因此没有时间介绍特性的细节。通常情况下，课程前面的特性（适用于更多程序员）比课程后面的特性有更深入的处理。右值引用未列出，因为它是移动语义的一部分。\n\
    \n# 历史与词汇\n\n1998：ISO C++ 标准正式采用（“C++98”）。\n- 776 页\n\n2003：发布 TC1（技术报告 1）（“C++03”）。\n\
    - C++98 的错误修复。\n- 786 页\n\n2005：发布 TR1（技术报告 1）。\n- 149 个标准库组件。\n\n2008：新 C++ 草稿（“C++0x”）达到\
    \ CD 状态。\n- TR1 派生组件以及更多。\n- 1265 页\n\n2009：（有限的）C++ 特性可用变得常见。\n\n2011：预期通过新标准。\n\
    - 最终草稿（FDIS）在3月批准。\n- 1353 页。\n- “C++11”现在是代码名。\n\n2012：TR2\n各种编译器对 C++0x 特性的支持见\
    \ http://www.aristeia.com/C++0x/Availability.htm。Boost 是唯一合并的部分。\n\n# 注意\n\n课程中的部分代码未经过测试。我相信代码是正确的，但不保证。\n\
    \n© 2011 Scott Meyers，版权所有。从 ebook.com 下载\n\n# 拷贝与移动\n\n临时对象是移动的理想候选者：\n```cpp\n\
    std::vector<T> v;\n...\nv = create(); // C++98 中，工厂函数返回值到 v，然后销毁返回值\n```\n![](img/68a90f505054116271758fb914871a74_8_0.png)\n\
    \n幻灯片上的图表构成了一个动画。在讨论中，我使用 T 容器而不是指定特定类型（例如 string 或 int）。移动语义的动机在很大程度上与类型无关，尽管类型越大、拷贝越贵，移动就越充分。\n\
    \n# 拷贝与移动\n\nC++x 将此类拷贝操作转换为移动请求：\n\n```cpp\nstd::vector<T> v;\n...\nv = create();\
    \ // C++0x 中的隐式移动请求\n```\n![](img/68a90f505054116271758fb914871a74_9_0.png)\n\n\
    幻灯片上的图表构成了一个动画。\n\n# 拷贝与移动\n\n移动语义将在以后讨论，但：\n\n- 移动是一个关键的想法。\n  - 通常是拷贝的优化。\n\
    \  - C++0x 中的大多数标准类型都支持移动。\n  - 它们支持移动请求。\n  - 例如 STL 容器。\n- 某些类型是仅移动的：\n  - 禁止拷贝，但允许移动。\n\
    \  - 例如流对象、std::thread 对象、std::unique_ptr 等。\n\n# C++98 vs. C++0x 程序\n\n在一组文本文件中列出\
    \ 20 个常见的词。\n\n```\nAlice_in_Wonderland.txt War_and_Peace.txt\nDracula.txt The_Kama_Sutra.txt\
    \ The_Iliad.txt\n找到 70544 个单词。最常见：\nthe 58272\nand 34111\nof 27066\nto 26992\n\
    a 16937\nin 14711\nhis 12615\nhe 11261\nthat 11059\nwas 9861\nwith 9780\nI 8663\n\
    had 6737\nas 6714\nnot 6608\nher 6446\nis 6277\nat 6202\nnon 5981\nfor 5801\n\
    ```\n\n显示的数据来自从 Project Gutenberg (http://www.gutenberg.org/) 下载的列书籍的纯文本版本。\n\n\
    # 跨文件计数：C++98\n\n```cpp\n#include <stdio>                       // 格式化输出比 iostream\
    \ \n#include <iostream>\n#include <iterator>\n#include <string>\n#include <fstream>\n\
    #include <algorithm>\n#include <vector>\n#include <map>\n\ntypedef std::map<std::string,\
    \ size_t> WordCountMapType;\n\nWordCountMap wordsInFile(const char * const fileName)\
    \ // 对于每个单词\n{\n    std::ifstream file;                                // 在文件中，返回\n\
    \    WordCountMapType wordCounts;                            // 的\n    for (std::string\
    \ word; file >> word; ) {           // 出现\n        ++wordCounts[word];\n    }\n\
    \    return wordCounts;\n}\n```\n\n更好的软件工程是让 `wordsInFile` 检查文件名的有效性，然后调用另一个函数（例如\
    \ \"wordsInStream\"）来执行实际计数，但结果代码在串行情况（C++98）中会有些重复，在并发情况（C++0x）中会变得更加复杂，为了保持示例程序简单并专注于\
    \ C++0x 特性，我们假设每个通过的文件名都是合法的，即：我们接受“可能不会发生任何问题”的假设。\n\n"
