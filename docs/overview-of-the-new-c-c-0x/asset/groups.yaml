  - '[PAGE 40]


    # # Conversions Among Encodings


    C++98 supports only IO-based conversions.


    +   - Designed for multibyte external strings ≃ wide internal strings

    - Requires changing locale associated with stream.


    New in C++0x:


    +   - std::wbuffer does IO-based encoding conversions w/o changing stream locale.

    - std::wstring_convert does in-memory encoding conversions.

    - E.g., std::u16string/std::u32string ➜ std::string.


    Usage details esoteric, hence omitted in this overview.


    Changing the locale associated with a stream is accomplished via the imbue member
    function, which is a part of several standard iostream classes, e.g., ios_base.


    Among the esoteric details is that the existence of destructors mean that none
    of the standard code_cvt facets work with std::buffer_convert and std::wstring_convert.
    Instead, users must derive classes from the standard facets and add public destructors.
    More information on this issue (and others) is in the comp.std.c++ thread at http://tinyurl.com/ykup5qe.'
