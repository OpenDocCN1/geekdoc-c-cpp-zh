  - '[PAGE 81]


    # Lambda Expression Complexity


    Lambdas may be arbitrarily complex:


    +   - Multiple statements, multiple returns.

    - Throw/catch exceptions.

    - Essentially anything allowed in a “normal” function.


    Maintainability considerations suggest:


    +   - Short, clear, context-derived lambdas are best.


    Not absolutely everything allowed in a normal function is allowed in a lambda
    expression, e.g., there is no way to refer to this pointer of the operator() function
    generated from the lambda.'
  - '[PAGE 82]


    # # Storing Closures


    Closure types not specified, but two easy ways to store closures:


    +   - auto

    - auto multipleOf5 = [](long x) { return x % 5 == 0; }

    - std::vector<long> vl;

    - ...

    - vl.erase(std::remove_if(vl.begin(), vl.end(), multipleOf5), vl.end());

    - std::function

    - std::function<bool(long)> multipleOf5 = // see next page for syntax

    [(long x) { return x % 5 == 0; }

    - ...

    - vl.erase(std::remove_if(vl.begin(), vl.end(), multipleOf5), vl.end());


    Every lambda expression yields a unique closure type. VC10 names these types

    anonymous-namespace:<lambda0>, anonymous-namespace:<lambda1>, etc. gcc 4.5

    is naming less obvious (e.g., UlvE_, UlvE0_, UlvE1_, etc.).


    The closure types are created in the smallest block scope, class scope, or namespace
    scope that contains the lambda.


    Lambdas can''t be directly recursive, but that can be achieved by having a closure

    invoke std::function object that has been initialized with the closure. For example:


    ```

    std::function<int(int)> factorial = [&](int x) { return (x==1) ? 1 : (x * factorial(x-1));
    };

    ```'
  - '[PAGE 83]


    #  Specifying Function Types


    A function''s type is its declaration w/o any names:


    ```

    void f1(int x);              // type is void(int)

    double f2(int x, std::string& s);  // type is double(int, std::string&)

    ```


    C++ uses function types for e.g., std::function:


    ```

    std::function<bool(long)> multipleOf5 = [(long x) { return x % 5 == 0; }; // from
    prior slide

    ```


    Trailing return type syntax is equivalent:


    ```

    std::function<auto (long)->bool> multipleOf5 = // equivalent to

    [(long x) { return x % 5 == 0; }; // above

    ```


    VC10, despite support for trailing return type syntax in general, does not compile
    the second declaration of multipleOf5 on this page. gcc 4.5 accepts it.'
