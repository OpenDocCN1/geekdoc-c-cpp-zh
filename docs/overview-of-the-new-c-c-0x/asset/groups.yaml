    - Move-based speedup for std::vector with gcc 4.0.1.\n  - Reader comments data\
    \ for newer compilers.\n\n# Further Information\n\n### Rvalue References and Move\
    \ Semantics:\n\n- “Making Your Next Move,” Dave, C++Next, 17 September 2009.\n\
    - “Your Next Assignment...” Dave Abrahams, C++Next, 28 September 2009.\n- Correctness\
    \ and performance issues for operator=.\n- “Exceptionally Moving!” Dave Abrahams,\
    \ C++Next, 5 Oct 2009.\n  - Exception safety for move operations.\n- “To move\
    \ or not move,” Bjarne Stroustrup, N3174 to the C++ Standardization Committee,\
    \ 17 October 2010.\n  - Describes rules governing implicit move.\n- “Class invariants\
    \ and implicit move constructors (C++x),” comp.lang++ discussion initiated 14\
    \ August.\n\n# Further Information\n\n### Perfect Forwarding:\n\n- “Onward, Forwarding!”\
    \ Dave, C++Next, 7 Dec. 2009.\n- “Perfect Forwarding Cases,” comp.std++ discussion\
    \ initiated 16 January 2010.\n- Discusses argument types that can be forwarded.\n\
    \n# Further Information\n\n### Explicit conversion functions:\n\n- “Use Explicit\
    \ Functions to Avert Reckless Conversions,” Danny Kalev, DevX.com, 9 October 2008.\n\
    \n### Variadic Templates:\n\n- “Variadic Templates for C++x,” Douglas Gregor and\
    \ Jaakko Järvi, Journal of Object Technology, February 2008.\n- “An Introduction\
    \ to Variadic Templates in C++x,” Anthony Williams, DevX.com, 24 April 2009.\n\
    - “Variadic Templates,” BoostCon Wiki, http://tinyurl.com/mt66.\n\n# Further Information\n\
    \n### decltype:\n\n- “decltype: C++0x Features in VC10, Part 3,” Stephan T. Lavavej,\
    \ Visual C++ Team Blog, 22 April 2009.\n- “Clean up Function Syntax with decltype,”\
    \ Danny Kalev, DevX.com, 8 May 2008.\n\n# Further Information\n\n### Other Features:\n\
    \n- “C++0x Forward Enum Declarations Cut Down Time and Dependencies,” Danny Kalev,\
