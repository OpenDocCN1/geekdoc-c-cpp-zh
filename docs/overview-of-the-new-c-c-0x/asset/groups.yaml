    Overview of the New C++ (C++0x)


    # auto for Type Declarations


    Type deduction for auto is akin to that for template parameters:


    ```

    template<typename T> void f(T t);

    ...

    f(expr);               // deduce t''s type from expr

    auto v = expr;         // do essentially the same thing for v''s type

    ```


    ![](img/68a90f505054116271758fb914871a74_24_0.png)


    Scott Meyers, Software Development Consultant

    http://www.aristeia.com/


    © 2011 Scott Meyers, all rights reserved.

    Slide 23


    Rules governing auto are in [dcl.spec.auto](7.1.6.4) in N3290).

    Rules governing auto are in [dcl....


    As far as I know, the only way auto type deduction is not the same as template
    type deduction is when deducing a type from brace initialization lists. Auto uses
    `{x, y, z}` to be of type `std::initializer_list<T>` (where T is the type of x,
    y, and z), but template parameter deduction does not apply to brace initialization
    lists. (It''s a "non-deduced context.")


    As noted in the discussion on rvalue references, the fact that auto uses the type
    deduction rules as templates means that variables of type auto&& may, after after
    reference collapsing, turn out to be lvalue:


    ```

    int x;

    auto&&& a1 = x;         // x is lvalue, so type of a1 is int&

    auto&&& a2 = std::move(x); // std::move(x) is rvalue, so type of a2 is int&&

    ```


