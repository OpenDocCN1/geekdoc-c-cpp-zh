    \ ptr_fun, mem_fun, and mem_fun_ref.\n\nbind1st and bind2nd are deprecated in\
    \ C++0x.\n\n## bind\n\n- Declared in <functional>.\n- Produces a function object\
    \ from:\n  - A callable entity.\n  - A specification of which arguments are to\
    \ be bound.\n    `functionObject std::bind(callableEntity, 1stArgBinding, 2ndArgBinding,\
    \ ... nthArgBinding);`\n- Placeholders allow mapping from arguments for bind's\
    \ return value to callable object.\n  - _n specifies the nth argument passed to\
    \ the function object by bind.\n\n## bind Basics\n\n```cpp\nint f(int x, int y);\n\
