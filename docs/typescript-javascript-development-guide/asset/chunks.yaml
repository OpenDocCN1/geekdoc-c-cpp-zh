    My Report: \" + this.name);\n\n   }\n\n}\n\nclass CashReport extends Report {\n\
    \n   constructor (name: string) {\n\n       super(name);\n\n   }\n\n   print()\
    \ {\n\n       alert(\"Cash Report: \" + this.name);\n\n   }\n\n   getLineItems()\
    \ {\n\n       alert(\"5 line items\");\n\n   }\n\n}\n\nvar myreport = new CashReport(\"\
    Month's Sales\");\n\nmyreport.print();\n\nmyreport.getLineItems();\n\nIn the above\
    \ example, we have created a base class with the name “MyReport,” and it has a\
    \ single variable “name,” a constructor for accepting the variable name as a string,\
    \ and a function with the name “print().” The class “CashReport” uses the “extends”\
    \ keyword so as to inherit from the class “MyReport.” This means that the child\
    \ class will have a direct access to the “print()” function which has been defined\
    \ in the base class. The class “CashReport” will override the “print()” method\
    \ found in the base class and then create its own. The class “CashReport” will\
    \ also forward the name value which it receives in the constructor to its base\
    \ class by use of the “super()” call.\n\nStatics\n\nStatic properties are supported\
    \ in TypeScript, and these are shared by all of the instances of the class. The\
    \ best place to put these is in a class itself, and that is exactly what happens\
    \ in TypeScript. Consider the code given below, which shows how this happens:\n\
    \nclass MyClass {\n\n   static instances = 0;\n\n   constructor() {\n\n      MyClass.instances++;\n\
    \n   }\n\n}\n\nvar s1 = new MyClass ();\n\nvar s2 = new MyClass ();\n\nconsole.log(MyClass.instances);\
    \ // 2\n\nIt is possible for one to have both static members and static functions.\n\
    \nAccess Modifiers"
