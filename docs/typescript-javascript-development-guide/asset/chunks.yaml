    \ a specific enum can be automatically changed  by specifically assigning to it.\
    \ The example given below shows how this can be done, we begin at 3, and then\
    \ increment from there as shown below:\n\nenum Color {\n\n   LightRed = 3,  //\
    \ 3\n\n   DarkGreen,    // 4\n\n   LightBlue      // 5\n\n}\n\nYou also have to\
    \ know that enums are open ended. Consider the JavaScript code given below, which\
