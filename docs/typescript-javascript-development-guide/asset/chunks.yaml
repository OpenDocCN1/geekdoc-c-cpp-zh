    \n}\n\nfunction area(shape : Shape) {\n\n    var area = shape.width * shape.height;\n\
    \n    return \"The shape is \" + shape.name + \" having an area of \" + area +\
    \ \" cm squared\";\n\n}\n\nconsole.log( area( {name: \"rectangle\", width: 20,\
    \ height: 15} ) );\n\nconsole.log( area( {name: \"square\", width: 20, height:\
    \ 25, color: \"blue\"} ) );\n\nInterfaces are the names which are given to object\
    \ types. It is possible for us to declare interfaces, and at the same time use\
    \ it in our type annotation.\n\nOnce you compile the file “interface.js,” you\
    \ will get no errors. For us to make it give us an error, let us add a new line\
    \ of code to the file “interface.js” having a shape with no name property and\
    \ then observe the result in the console of our browser. Append the line of code\
    \ given below to the file “interface.js”:\n\nconsole.log( area( {width: 20, height:\
    \ 15} ) );\n\nYou can then run the command “tsc interface.js” so as to compile\
    \ the code in the file. An error will be the output, but do not be worried by\
    \ that for now. Refresh your browser, and then observe what the console gives\
    \ you. The text and the area of the rectangle will form the output on the console.\
    \ The arrow should be as follows:\n\ninterface.ts(26,13): Supplied parameters\
    \ do not match any signature of call target:\n\nCould not apply type 'Shape' to\
    \ argument 1, which is of type '{ width: number; height: number; }'\n\nThe error\
    \ shown above is  a result of the fact that the object which has been passed to\
    \ the function “area()” will not conform to the interface named “shape,” and a\
    \ name property is needed so as to do so.\n\nConsider the code given below, which\
    \ shows how an interface can be used in TypeScript:\n\ninterface Person {\n\n\
       fName: string;\n\n   lName: string;\n\n}\n\nfunction welcome(person: Person)\
    \ {\n\n   return \"Hello, \" + person.fName + \" \" + person.lName;\n\n}\n\nvar\
    \ user = { fName: \"Jane\", lName: \"User\" };\n\ndocument.body.innerHTML = welcome(user);\n\
    \nIn the above example, we have implemented an interface which is to be used for\
    \ describing a person by use of the first and last name. For two types to be compatible\
    \ in JavaScript, you have to ensure that their internal is also compatible. With\
    \ this, we will be able to implement an interface just by use of the shape which\
    \ is needed by the interface, and we will not need to use an explicit “implements”\
    \ clause.\n\n# \n\nChapter 5- Arrow Function Expressions\n\nFor one to understand\
    \ the scope of the keyword “this,” it is a challenging practice. TypeScript supports\
    \ the use of arrow functions and expressions so as to make this a bit easier for\
    \ you. This is just a new feature which has been introduced in ES6 for the first\
    \ time. In arrow functions, the value for keyword “this” is preserved, and this\
    \ becomes easy for us to write and use callbacks. Consider the sample code given\
    \ below:\n\nvar objectShape = {\n\n    name: \"rectangle\",\n\n    popup: function()\
    \ {\n\n        console.log('The inside popup(): ' + this.name);\n\n        setTimeout(function()\
    \ {\n\n            console.log('The inside setTimeout(): ' + this.name);\n\n            console.log(\"\
    The shape is a \" + this.name + \"!\");\n\n        }, 3000);\n\n    }\n\n};\n\n\
    objectShape.popup();\n\nThe object “this.name” will be empty, and this will be\
    \ depicted clearly on the browser console.\n\nThe TypeScript arrow function can\
    \ be used for the purpose of fixing this problem. You have to replace “function()”\
    \ with “() =>.” This is shown in the code given below:\n\nvar objectShape = {\n\
    \n    name: \"rectangle\",\n\n    popup: function() {\n\n        console.log('The\
    \ inside popup(): ' + this.name);\n\n        setTimeout( () => {\n\n            console.log('The\
    \ inside setTimeout(): ' + this.name);\n\n            console.log(\"The shape\
    \ is a \" + this.name + \"!\");\n\n        }, 3000);\n\n    }\n\n};\n\nobjectShape.popup();\n\
    \nYou can then look at the JavaScript file which is generated. You will observe\
    \ that the compiler has injected a new variable, which is “var _this = this;,”\
    \ and this will be used in the callback “setTimeout(),” and the “name” property\
    \ will be referenced.\n\nConsider the pure JavaScript class given below:\n\nfunction\
    \ Person(age) {\n\n   this.age = age\n\n   this.becomeOld = function() {\n\n       this.age++;\n\
    \n   }\n\n}\n\nvar person = new Person(1);\n\nsetTimeout(person.becomeOld,1000);\n\
    \nsetTimeout(function() { console.log(person.age); },2000); // the 1 should have\
    \ been set to 2\n\nOnce the above code has been executed in the browser, the object\
    \ “this” will point to “window” since it will be the one used for executing the\
    \ “becomeOld” function. This can only be solved by executing the arrow function\
    \ as shown below:\n\nfunction Person(age) {\n\n   this.age = age\n\n   this.becomeOld\
    \ = () => {\n\n       this.age++;\n\n   }\n\n}\n\nvar person = new Person(1);\n\
    \nsetTimeout(person.becomeOld,1000);\n\nsetTimeout(function() { console.log(person.age);\
    \ },2000); // 2\n\nThe reason behind the above code functioning is that referencing\
    \ to the object “this” will be captured from outside our function body. The above\
    \ code is similar to the JavaScript code given below:\n\nfunction Person(age)\
    \ {\n\n   this.age = age\n\n   var _this = this;  // capture the this"
