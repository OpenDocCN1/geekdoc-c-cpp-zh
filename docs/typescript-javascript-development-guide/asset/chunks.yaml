  trans: "\n然而，如果变量名已经被周围的作用域占用，则会生成一个新的变量名，如下方的代码所示：\n\n```javascript\nvar myVar\
    \ = '123';\n\nif (true) {\n    let myVar = 123;\n}\n\n// will become //\n\nvar\
    \ myVar = '123';\n\nif (true) {\n    var _myVar = 123; // 它已经被重命名了\n}\n```\n\n\
    `let in closures`\n\n考虑下面这段简单的 JavaScript 代码：\n\n```javascript\nvar functions\
    \ = [];\n\n// 创建一组函数\nfor (var j = 0; j < 3; j++) {\n    functions.push(function()\
    \ {\n        console.log(j);\n    })\n}\n\n// 调用它们\nfor (var k = 0; k < 3; k++)\
    \ {\n    functions[k]();\n}\n```\n\n在大多数面试题中，你会被问到上述 JavaScript 文件中的日志输出。尽管大多数人期望答案是\
    \ `0, 2, 3`，但真正的答案是 `3`。原因是这三个函数都使用了我们外部作用域中的变量 `j`，而当我们执行它们时，变量 `j` 的值将是 `3`。这构成了我们第一个循环的终止条件。\n\
    \n解决这个问题的方法是为每个变量创建一个变量，并且应该专门用于该循环中的迭代。如你所知，可以通过创建一个新函数并立即执行它来为变量创建一个新的作用域。下面的代码所示：\n\
    \n```javascript\nvar functions = [];\n\n// 创建一组函数\nfor (var j = 0; j < 3; j++)\
    \ {\n    (function() {\n        var local = j;\n        functions.push(function()\
    \ {\n            console.log(local);\n        })\n    })();\n}\n\n// 调用它们\nfor\
    \ (var k = 0; k < 3; k++) {\n    funcs[k]();\n}\n```\n\n一旦你使用 `let` 关键字而不是 `var`\
    \ 关键字，就会为每次循环迭代创建一个唯一的变量。\n\n# 结论\n\n我们已经得出了本指南的结论。`TypeScript` 是一种始终编译为 JavaScript\
    \ 的编程语言。该语言是开源的，由微软开发和维护。它非常适合支持静态类型和面向对象编程等特性的型应用开发。这两个特性是使其适用于开发大型应用程序的主要特征。\n\
    \n该语言支持类型注解，这对于维护程序中的缩进非常有帮助。缩进通常能确保程序具有良好的可读性。你需要记住，`TypeScript` 是 `JavaScript`\
    \ 的超集，这意味着任何 `JavaScript` 代码也是 `TypeScript` 代码。这就是为什么 `TypeScript` 始终编译为 `JavaScript`\
    \ 的原因。要开始使用 `TypeScript` 编程，你必须先准备好环境。对于 Windows 用户，你只需要安装 Visual Studio，然后下载并安装必要的插件就可以开始编程了。\n\
    \n如果你在使用任何其他平台，则你需要依赖名为 `npm` 的 Node 包。确保你已经有一个文本编辑器和浏览器。一旦你安装了 `TypeScript` 的\
    \ `npm` 包，就可以开始编写你的 `TypeScript` 程序了。\n"
