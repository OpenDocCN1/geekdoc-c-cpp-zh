  trans: "\n展开运算符允许你将一个已经展开的数组放入另一个数组中。考虑下面的示例，它展示了如何实现这一点：\n\n```javascript\nvar\
    \ list = [5, 6];\nlist = [...list, 7, 8];\nconsole.log(list); // [5,6,7,8]\n```\n\
    \n# 第 12 章- 枚举 (Enums)\n\n枚举为我们提供了一种组织具有相关值集合的方法。除了 JavaScript 之外，其他编程语言都提供了枚举数据类型。TypeScript\
    \ 支持这一点。在 TypeScript 中，可以像下面所示声明枚举：\n\n```typescript\nenum Card {\n   Clubs,\n\
    \   Spades,\n   Diamonds,\n   Hearts\n}\n\n// 示例用法\nvar card = Card.Clubs;\n\n\
    // 安全性\ncard = \"It is not a member of the card suit\"; // 错误：string 无法赋值给类型 `CardSuit`\n\
    ```\n\n### 枚举与数字\n\nTypeScript 中的枚举是基于数字的。这意味着我们可以为 TypeScript 中的枚举实例分配数字，这适用于任何与数字兼容的类型。下面的代码最好地描述了如何实现这一点：\n\
    \n```typescript\nenum Color {\n   Red,\n   Green,\n   Blue\n}\n\nvar color = Color.Red;\n\
    color = 0; // 这等于 Color.Red\n```\n\n### 枚举与字符串\n\n我们想知道枚举生成的 JavaScript 是什么样的。考虑下面的\
    \ TypeScript 示例：\n\n```typescript\nenum MyEnum {\n   False,\n   True,\n   Unknown\n\
    }\n```\n\n从上面的 TypeScript 代码将生成以下 JavaScript 代码：\n\n```javascript\nvar MyEnum;\n\
    (function (MyEnum) {\n   MyEnum [MyEnum [\"False\"] = 0] = \"False\";\n   MyEnum\
    \ [MyEnum [\"True\"] = 1] = \"True\";\n   MyEnum [MyEnum [\"Unknown\"] = 2] =\
    \ \"Unknown\";\n})( MyEnum || (MyEnum = {}));\n```\n\n变量 `MyEnum` 可以用于将字符串版本的枚举转换为数字，或者可能是数字版本的枚举。下面的代码最好地描述了这一点：\n\
    \n```typescript\nenum MyEnum {\n   False,\n   True,\n   Unknown\n}\n\nconsole.log(MyEnum\
    \ [0]); // \"False\"\nconsole.log(MyEnum [\"False\"]); // 0\nconsole.log(MyEnum\
    \ [MyEnum.False]); // \"False\" 因为 `MyEnum.False == 0`\n```\n\n我们也可以更改与枚举关联的数字。默认设置是枚举为\
    \ 0，随后的每次递增都会以 1 为间隔自动进行。考虑下面的代码，它最好地描述了这一点：\n\n```typescript\nenum Color {\n\
    \   Red,      // 0\n   Green,  // 1\n   Blue      // 2\n}\n```\n\n可以通过特定的赋值来自动更改特定枚举关联的数字。下面的示例展示了如何实现，我们从\
    \ 3 开始，然后像下面所示开始递增：\n\n```typescript\nenum Color {\n   LightRed = 3,  // 3\n \
    \  DarkGreen,    // 4\n   LightBlue      // 5\n}\n```\n\n你还需要知道枚举是开放的。考虑下面由枚举生成的\
    \ JavaScript 代码：\n\n```javascript\nvar MyEnum;\n(function (MyEnum) {\n   MyEnum\
    \ [MyEnum [\"False\"] = 0] = \"False\";\n   MyEnum [MyEnum [\"True\"] = 1] = \"\
    True\";\n   MyEnum [MyEnum [\"Unknown\"] = 2] = \"Unknown\";\n})( MyEnum || (MyEnum\
    \ = {}));\n```\n\n枚举定义可以跨越多个文件。考虑下面的示例，其中我们展开了 `Color` 的定义以获取两个块：\n\n```typescript\n\
    enum Color {\n   Red,\n   Green,\n   Blue\n}\n\nenum Color {\n   LightRed = 3,\n\
    \   DarkGreen,\n   LightBlue\n}\n```\n\n### 作为标志（flags）的枚举\n\n标志（Flags）为我们提供了使用枚举的卓越能力。考虑下面的示例：\n\
    \n```typescript\nenum Animal {\n   None            = 0,\n   PossesClaws      =\
    \ 1 << 0,\n   Flying          = 1 << 1,\n   ConsumesFish    = 1 << 2,\n   Endangered\
    \      = 1 << 3\n}\n```\n\n在上述情况下，我们需要通过移动 1 来获取位运算符。考虑接下来的示例：\n\n```typescript\n\
    enum Animal {\n   None            = 0,\n   PossesClaws      = 1 << 0,\n   Flies\
    \           = 1 << 1,\n}\n\nfunction printAbilities(animal) {\n   var animFlags\
    \ = animal.flags;\n   if (animFlags & Animal.PossesClaws) {\n      console.log('The\
    \ animal has claws');\n   }\n   if (animFlags & Animal.Flies) {\n      console.log('The\
    \ animal can fly');\n   }\n   if (animFlags == Animal.None) {\n      console.log('nothing');\n\
    \   }\n}\n\nvar animal = { flags: Animal.None };\nprintAbilities(animal); // nothing\n\
    animal.flags |= Animal.PossesClaws;\nprintAbilities(animal); // The animal has\
    \ claws\nanimal.flags &= ~Animal.PossesClaws;\nprintAbilities(animal); // The\
    \ animal has claws\n```\n*(注：原文后续部分似乎存在大量乱码和重复错误，翻译部分已根据上下文逻辑进行了清理和处理，以保持文档可读性)*\n\
