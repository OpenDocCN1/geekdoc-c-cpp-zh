    \ below:\n\n```javascript\nvar myVar = '123';\n\nif (true) {\n    let myVar =\
    \ 123;\n}\n\n// will become //\n\nvar myVar = '123';\n\nif (true) {\n    var _myVar\
    \ = 123; // It has been Renamed\n}\n```\n\n`let in closures`\n\nConsider the simple\
    \ JavaScript code given below:\n\n```javascript\nvar functions = [];\n\n// creating\
    \ a bunch of functions\nfor (var j = 0; j < 3; j++) {\n    functions.push(function()\
    \ {\n        console.log(j);\n    })\n}\n\n// call them\nfor (var k = 0; k < 3;\
    \ k++) {\n    functions[k]();\n}\n```\n\nIn most interview questions, you are\
    \ asked about the log in the above JavaScript file. Although most people expect\
    \ the answer to be `0, 2,3`, but the real answer is `3`. The reason is that the\
    \ three functions are making use of the variable `j` from our outer scope, and\
    \ we will in turn execute them the value of the variable `j` will be `3`. It will\
    \ form the termination condition for our first loop.\n\nThe solution to this problem\
    \ is creation of a variable for each variable, and this should be specifically\
    \ used for iteration in that loop. As you are aware, a new scope for a variable\
    \ can be created by creation of a new function and then executing it immediately.\
    \ This is shown in the code given below:\n\n```javascript\nvar functions = [];\n\
    \n// creating a bunch of functions\nfor (var j = 0; j < 3; j++) {\n    (function()\
    \ {\n        var local = j;\n        functions.push(function() {\n           \
    \ console.log(local);\n        })\n    })();\n}\n\n// calling them\nfor (var k\
    \ = 0; k < 3; k++) {\n    funcs[k]();\n}\n```\n\nOnce you use the `let` keyword\
    \ rather than the `var` keyword, a variable which is unique to each loop iteration\
    \ is created.\n\n# Conclusion\n\nWe have come to the conclusion of this guide.\
    \ `TypeScript` is a programming language which always compiles into JavaScript.\
    \ The language is open source, and it was developed and maintained by Microsoft.\
    \ It is good for the development of large applications in which features such\
    \ as static typing and object oriented programming are supported. These two features\
    \ are the main ones which suit it for use to develop large applications.\n\nThe\
    \ language supports type annotations which are very good for maintaining the indentations\
    \ in a program. Indentations usually ensure that a program is well readable. You\
    \ have to remember that `TypeScript` is a superset of `JavaScript`, meaning that\
    \ any `JavaScript` code is also a `TypeScript` code. This is the reason why `TypeScript`\
    \ always compiles into `JavaScript`. For you to begin programming in `TypeScript`,\
    \ you have to first get the environment ready for doing that. For Windows users,\
    \ you have to simply install the Visual Studio and then download and install the\
    \ necessary plugin, and you will be set to get programming.\n\nIf you are using\
    \ any other platform, then you have to rely on the Node package named `npm`. Ensure\
    \ that you have a text editor and a browser. Once you have installed the `npm`\
    \ package for `TypeScript`, you can go ahead and begin to write your `TypeScript`\
    \ programs.\n"
