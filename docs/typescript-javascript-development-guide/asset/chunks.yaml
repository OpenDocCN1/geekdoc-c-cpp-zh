    Alien\", {a: 0, b: 0});\n\nAs you must have noticed, the constructor has used\
    \ the keyword “public” before each variable name. This is an indication that we\
    \ need to make the parameter to be a public property on our object.\n\nInheritance\n\
    \nIn TypeScript, the “extends” keyword is used for the purpose of supporting a\
    \ single inheritance. The code given below demonstrates how this can be done:\n\
    \nclass Point3 extends Point {\n\n   z: number;\n\n   constructor(x: number, y:\
    \ number, z: number) {\n\n       super(x, y);\n\n       this.z = z;\n\n   }\n\n\
       add(point: Point3) {\n\n       var point2 = super.add(point);\n\n       return\
    \ new Point3(point2.x, point2D.y, this.z + point.z);\n\n   }\n\n}\n\nIn case there\
    \ is a constructor in your class, you will be forced to call the parent constructor\
    \ from the constructor. This will ensure that the stuff which is needed for setting\
    \ this will be set. Followed by the call to “super,” one can add any additional\
    \ stuff needed for doing the constructor.\n\nConsider the second example given\
    \ below, which shows one can use the “extends” keyword to create an inheritance\
    \ in TypeScript:\n\nclass MyReport {\n\n   name: string;\n\n   constructor (name:\
