    \n   Spades,\n\n   Diamonds,\n\n   Hearts\n\n}\n\n// A sample usage\n\nvar card\
    \ = Card.Clubs;\n\n// Safety\n\ncard = \"It is not a member of the card suit\"\
    ; // Error : string is not assignable to type `CardSuit`\n\nEnums and Numbers\n\
    \nEnums in TypeScfript are number-based. This is an indication that we can assign\
    \ numbers to an instance of an enum in TypeScript, and the same applies to any\
    \ type which is compatible to numbers. The code given below best describes how\
    \ this can be done:\n\nenum Color {\n\n   Red,\n\n   Green,\n\n   Blue\n\n}\n\n\
    var color = Color.Red;\n\ncolor = 0; // This is the same as Color.Red\n\nEnums\
    \ and Strings\n\nWe want to know the kind of JavaScript which is produced by enums.\
    \ Consider the sample TypeScript given below:\n\nenum MyEnum {\n\n   False,\n\n\
       True,\n\n   Unknown\n\n}\n\nThe following JavaScript code will be generated\
    \ from the above TypeScript code:\n\nvar MyEnum;\n\n(function (MyEnum) {\n\n   MyEnum\
    \ [MyEnum [\"False\"] = 0] = \"False\";\n\n   MyEnum [MyEnum [\"True\"] = 1] =\
    \ \"True\";\n\n   MyEnum [MyEnum [\"Unknown\"] = 2] = \"Unknown\";\n\n})( MyEnum\
    \ || (MyEnum = {}));\n\nThe variable “MyEnum” can be used for the purpose of converting\
    \ an enum of string version into a number or maybe a number version of the enum.\
    \ The code given below best describes this:\n\nenum MyEnum {\n\n   False,\n\n\
       True,\n\n   Unknown\n\n}\n\nconsole.log(MyEnum [0]); // \"False\"\n\nconsole.log(MyEnum\
    \ [\"False\"]); // 0\n\nconsole.log(MyEnum [MyEnum.False]); // \"False\" because\
    \ ` MyEnum.False == 0`\n\nIt is also possible for us to change the number which\
    \ is associated with the enum. The default setting is that enums are 0 and each\
    \ subsequent increment is automatically made in intervals of 1\\. Consider the\
    \ code given below which best describes this:\n\nenum Color {\n\n   Red,     //\
