- fmt: "\nIn TypeScript, access modifiers are supported and these govern how variables\
    \ can be accessed. A variable can be outside a class directly by its instances,\
    \ or it may be accessible in the child classes. The following are the three types\
    \ of access modifiers:\n\n1. `public`: available on the instances everywhere.\n\
    2. `private`: not available for access outside class.\n3. `protected`: available\
    \ on the child classes, but not on the instances directly.\n\nYou should be aware\
    \ that it will have no great impact on your programs, but if you try to access\
    \ them during runtime, they will give you some errors. Consider the example given\
    \ below, which shows how this can be done:\n\n```typescript\nclass ClassBase {\n\
    \   public a: number;\n   private b: number;\n   protected c: number;\n}\n\n//\
    \ EFFECT ON the INSTANCES\nvar myVar = new ClassBase();\n\nfoo.a; // okay\nfoo.b;\
    \ // ERROR : private\nfoo.c; // ERROR : protected\n\n// EFFECT ON THE CHILD CLASSES\n\
    class ClassChild extends ClassBase {\n   constructor() {\n      super();\n   \
    \   this.a; // okay\n      this.b; // ERROR: private\n      this.c; // okay\n\
    \   }\n}\n```\n\nAs you are aware, the above modifiers will work for both member\
    \ properties and the member functions.\n\n### Define using constructor\n\nA member\
    \ in a class can be initialized as shown below:\n\n```typescript\nclass MyClass\
    \ {\n   x: number;\n   constructor(x:number) {\n      this.x = x;\n   }\n}\n```\n\
    \nThis is a very common scenario in TypeScript, and one can simply prefix the\
    \ member using an access modifier and this will be declared automatically in the\
    \ class and then copied from your constructor. With this, our previous example\
    \ can be written as shown below:\n\n```typescript\nclass MyClass {\n   constructor(public\
    \ x:number) {\n   }\n}\n```\n\n### Property initializer\n\nThis is a very important\
    \ feature which is supported in TypeScript. It is possible for you to initialize\
    \ any member of the class outside the constructor, and it is good for providing\
    \ a default value. Consider the example given below:\n\n```typescript\nclass MyClass\
    \ {\n   members = [];  // Initializing directly\n   add(x) {\n      this.members.push(x);\n\
    \   }\n}\n```\n\n### Rest Parameters\n\nThis feature allows one to accept multiple\
    \ parameters in a function, and then get these as an array. This can be denoted\
    \ as shown in the example given below:\n\n```typescript\nFunction allFunction(first,\
    \ second, ...rest) {\n   console.log(rest);\n}\n\nallFunction ('sample', 'bar');\
    \ // []\nallFunction ('sample', 'bar', 'bas', 'qux'); // ['bas','qux']\n```\n\n\
    # Chapter 7- Destructuring\n\nDestructuring means breaking up the structure. The\
    \ following types of destructuring are supported in TypeScript:\n\n1. Object Destructuring\n\
    2. Array Destructuring\n\nTo make it easy, see destructuring as the inverse of\
    \ structuring. The example given below shows how structuring can be done in JavaScript:\n\
    \n```javascript\nvar myVar = {\n   bar: {\n      bas: 789\n   }\n};\n```\n\nWith\
    \ the support for structuring in JavaScript, the process of creating new objects\
    \ would be a bit tough. With destructuring, we get the same level of convenience\
    \ to obtaining data of a particular source.\n\n### Object Destructuring\n\nWith\
    \ destructuring, one can do much work which could have taken lines in just a single\
    \ line. Consider the example given below:\n\n```javascript\nvar rectangle = {\
    \ a: 0, b: 10, height: 20 };\nvar {a, b, height} = rectangle;\nconsole.log(a,\
    \ b, height);\n```\n\nIf we were not to use destructing, `a`, `b`, and `height`\
    \ would have been picked separately. Deep data can also be obtained from structure\
    \ by use of destruction. The following code best illustrates how this can be done:\n\
    \n```javascript\nvar foo = { bas: 123 };\nvar {bas} = foo; // Effectively bas\
    \ = foo.bas\n```\n\n### Array Destructuring\n\n`const` is a new addition offered\
    \ in TypeScript and ES6. With it, one can be immutable with variables. This serves\
    \ a good purpose in runtime and for documentation. For you to use it, you just\
    \ have to replace the keyword `var` with `const`. Consider the code given below:\n\
    \n```typescript\nconst maximumRows = 10;\nif (a > maximumRows) {\n// Low readability\n\
    ```\n\nIn TypeScript, use of `const` is easy compared to what happens in other\
    \ languages. It helps us to avoid magic literals, and it is good practice for\
    \ improving readability.\n\n### Initialization of `const`\n\n`const` declarations\
    \ has to be done. Also, after creation of constants, they become immutable, so\
    \ if you try to assign them to a new value, you will get compile error. Consider\
    \ the code given below:\n\n```typescript\nconst myConst = 123;\nmyConst = 540;\
    \ // ERROR: Left-hand side of an assignment cannot be a constant\n```\n\nAs shown\
    \ above, trying to do that results in compile errors which have been commented.\n\
    \n### Block Scoped\n\n`const` is just a block which has been scoped like `let`.\
    \ The code given below best describes this:\n\n```typescript\nconst myConst =\
    \ 123;\nif (true) {\n   const myConst = 500; // Allowed as its new variable limited\
    \ to this if block\n}\n```\n\n### Deep immutability\n\nIt is possible for us to\
    \ use `const` with object literals, as far as you are concerned protecting the\
    \ reference to the variable. However, it is possible for you to mutate the sub\
    \ properties of objects. This is shown in the code given below:\n\n```typescript\n\
    const myConst = { bar: 123 };\nmyConst.bar = 500; // This one is Allowed!\nconsole.log(myConst);\
    \ // { bar: 500 }\n```\n\nThis is why it is recommended that you use `const` with\
    \ immutable data structures and literals. Constants are very good when you need\
    \ to maintain the value of a variable without changing it.\n\n# Chapter 8- for...of\n\
    \nThe `for...of` does not iterate over the elements of an array, and this is a\
    \ common problem experienced by JavaScript beginners. One iterates over the keys\
    \ of the objects which are passed in. Consider the example given below, which\
    \ best describes this:\n\n```javascript\nvar myArray = [7, 2, 5];\nfor (var item\
    \ in myArray) {\n   console.log(item); // 0,1,2\n}\n```\n\nIn the above example,\
    \ although we expect to get 7, 2, 5, we will get the indexes which are 0, 1, 2.\
    \ This is why the `for...of` was introduced in TypeScript. Consider the example\
    \ given below, which will iterate over the elements of the array and output the\
    \ result which is expected:\n\n```javascript\nvar myArray = [7, 2, 5];\nfor (var\
    \ item of myArray) {\n   console.log(item); // 7,2,5\n}\n```\n\nThe above example\
    \ will output the result which you expect rather than the indexes. Similarly,\
    \ in TypeScript, it is no trouble for one to go through a string character by\
    \ character by use of `for...of`. This is demonstrated in the code given below:\n\
    \n```javascript\nvar hi = \"are you the one looking for me?\";\nfor (var char\
    \ of hi) {\n   console.log(char); // are you the one looking for me?\n}\n```\n\
    \n### JS Generation\n\nTypeScript will always generate a standard `for (var i\
    \ = 0; i < list.length; i++)` for pre ES6 targets. Our previous example will generate\
    \ the following:\n\n```javascript\nvar myArray = [7, 2, 5];\nfor (var item of\
    \ myArray) {\n   console.log(item);\n}\n// it will become\nfor (var _j = 0; _j\
    \ < myArray.length; _j++) {\n   var item = myArray[_j];\n   console.log(item);\n\
    }\n```\n\nAs shown in the above example, use of `for...of` will make the intent\
    \ clearer and the amount of code you are expected to write will also be reduced,\
    \ as well as the number of variables you are expected to create.\n\n### Limitations\n\
    \nFor those who are not targeting ES6 or above, the code which is generated will\
    \ assume that the property `length` exists on our object and it can be indexed\
    \ via numbers. This means that it is only supported in arrays and string for the\
    \ legacy JS engines.\n"
  raw: "In TypeScript, access modifiers are supported and these govern how variables\
    \ can be accessed. A variable can be outside a class directly by its instances,\
    \ or it may be accessible in the child classes. The following are the three types\
    \ of access modifiers:\n\n1.  public: available on the instances everywhere.\n\
    \n2.  private: not available for access outside class.\n\n3.  protected: available\
    \ on the child classes, but not on the instances directly.\n\nYou should be aware\
    \ that it will have no great impact on your programs, but if you try to access\
    \ them during runtime, they will give you some errors. Consider the example given\
    \ below, which shows how this can be done:\n\nclass ClassBase {\n\n   public a:\
    \ number;\n\n   private b: number;\n\n   protected c: number;\n\n}\n\n// EFFECT\
    \ ON the INSTANCES\n\nvar myVar = new ClassBase();\n\nfoo.a; // okay\n\nfoo.b;\
    \ // ERROR : private\n\nfoo.c; // ERROR : protected\n\n// EFFECT ON THE CHILD\
    \ CLASSES\n\nclass ClassChild extends ClassBase {\n\n   constructor() {\n\n     super();\n\
    \n       this.a; // okay\n\n       this.b; // ERROR: private\n\n       this.c;\
    \ // okay\n\n   }\n\n}\n\nAs you are aware, the above modifiers will work for\
    \ both member properties and the member functions.\n\nDefine using constructor\n\
    \nA member in a class can be initialized as shown below:\n\nclass MyClass {\n\n\
       x: number;\n\n   constructor(x:number) {\n\n       this.x = x;\n\n   }\n\n\
    }\n\nThis is a very common scenario in TypeScript, and one can simply prefix the\
    \ member using an access modifier and this will be declared automatically in the\
    \ class and then copied from your constructor. With this, our previous example\
    \ can be written as shown below:\n\nclass MyClass {\n\n   constructor(public x:number)\
    \ {\n\n   }\n\n}\n\nProperty initializer\n\nThis is a very important feature which\
    \ is supported in TypeScript. It is possible for you to initialize any member\
    \ of the class outside the constructor, and it is good for providing a default\
    \ value. Consider the example given below:\n\nclass MyClass {\n\n   members =\
    \ [];  // Initializing directly\n\n   add(x) {\n\n       this.members.push(x);\n\
    \n   }\n\n}\n\nRest Parameters\n\nThis feature allows one to accept multiple parameters\
    \ in a function, and then get these as an array. This can be denoted as shown\
    \ in the example given below:\n\nFunction allFunction(first, second, ...rest)\
    \ {\n\n   console.log(rest);\n\n}\n\nallFunction ('sample', 'bar'); // []\n\n\
    allFunction ('sample', 'bar', 'bas', 'qux'); // ['bas','qux']\n\n# \n\nChapter\
    \ 7- Destructuring\n\nDestructuring means breaking up the structure. The following\
    \ types of destructuring are supported in TypeScript:\n\n1.  Object Destructuring\n\
    \n2.  Array Destructuring\n\nTo make it easy, see destructuring as the inverse\
    \ of structuring. The example given below shows how structuring can be done in\
    \ JavaScript:\n\nvar myVar = {\n\n   bar: {\n\n       bas: 789\n\n   }\n\n};\n\
    \nWith the support for structuring in JavaScript, the process of creating new\
    \ objects would have been a bit tough. With destructuring, we get the same level\
    \ of convenience to obtaining data out of a particular source.\n\nObject Destructuring\n\
    \nWith destructuring, one can do much work which could have taken lines in just\
    \ a single line. Consider the example given below:\n\nvar rectangle = { a: 0,\
    \ b: 10, width: 20, height: 30 };\n\n// Destructuring the assignment\n\nvar {a,\
    \ b, width, height} = rectangle;\n\nconsole.log(a, b, width, height);\n\nIf we\
    \ were not to use destructing, the a, b, width, and height would have been picked\
    \ separately from the rectangle. Deep data can also be obtained from a structure\
    \ by use of destruction. The following code best illustrates how this can be done:\n\
    \nvar foo = { bar: { bas: 123 } };\n\nvar {bar: {bas}} = foo; // Effectively `var\
    \ bas = foo.bar.bas;`\n\nArray Destructuring\n\n“const” is a new addition which\
    \ is now offered in TypeScript and ES6\\. With it, one can be immutable with variables.\
    \ This serves a good purpose in runtime and for documentation. For you to use\
    \ it, you just have to replace the keyword “var” with “const.” This is best demonstrated\
    \ below:\n\nconst myConst = 123;\n\nIn TypeScript, use of const is easy compared\
    \ to what happens in other programming languages. It helps us to avoid magic literals,\
    \ and it is a good practice for improving readability and maintainability. Consider\
    \ the code given below:\n\n// Low readability\n\nif (a > 10) {\n\n}\n\n// This\
    \ one is Better!\n\nconst maximumRows = 10;\n\nif (a > maximumRows) {\n\n}\n\n\
    Initialization of “const” declarations has to be done. Consider the compile error\
    \ given below:\n\nconst myConst // ERROR: const declarations must be initialized\n\
    \nAlso, it is impossible for a left hand assignment to be a constant. This is\
    \ because after creation of constants, they become immutable, so if you try to\
    \ assign them to a new value, you will get a compile error. This is shown in the\
    \ code given below:\n\nconst myConst = 123;\n\nmyConst = 540; // ERROR: Left-hand\
    \ side of an assignment expression cannot be a constant\n\nAs shown above, trying\
    \ to do that results in the compile errors which have been commented.\n\nBlock\
    \ Scoped\n\nA “const” is just a block which has been scoped like we did using\
    \ “let.” The code given below best describes this:\n\nconst myConst = 123;\n\n\
    if (true) {\n\n   const myConst = 500; // Allowed as its a new variable limited\
    \ to this `if` block\n\n}\n\nDeep immutability\n\nIt is possible for us to use\
    \ “const” with object literals, as far as you are concerned with protecting the\
    \ “reference” to the variable. This is shown below:\n\nconst myConst = { bar:\
    \ 123 };\n\nmyConst = { bar: 500 }; // ERROR : Left hand side of an assignment\
    \ expression cannot be a constant\n\nHowever, it is possible for you to mute the\
    \ sub properties of objects. This is shown in the code given below:\n\nconst myConst\
    \ = { bar: 123 };\n\nmyConst.bar = 500; // This one is Allowed!\n\nconsole.log(myConst);\
    \ // { bar: 500 }\n\nThis is why it is recommended that you use the const with\
    \ immutable data structures and with literals. Constants are very good when you\
    \ need to maintain the value of a variable without changing it.\n\n# \n\nChapter\
    \ 8- for...of\n\nThe “for…of” does not iterate over the elements of an array,\
    \ and this is a common problem experienced by JavaScript beginners. This one iterates\
    \ over the keys of the objects which are passed in. Consider the example given\
    \ below, which best describes this:\n\nvar myArray = [7, 2, 5];\n\nfor (var item\
    \ in myArray) {\n\n   console.log(item); // 0,1,2\n\n}\n\nIn the above example,\
    \ although we expect to get 7, 2, 5, we will get the indexes which are 0, 1, 2\\\
    . Tihs is why the “for…of” was introduced in TypeScript. Consider the example\
    \ given below, which will iterate over the elements of the array and output the\
    \ result which is expected:\n\nvar myArray = [7, 2, 5];\n\nfor (var item of myArray)\
    \ {\n\n   console.log(item); // 7,2,5\n\n}\n\nThe above example will output the\
    \ result which you expect rather than the indexes.\n\nSimilarly, in TypeScript,\
    \ it is no trouble for one to go through a string character by character by use\
    \ of “for…of.” This is demonstrated in the code given below:\n\nvar hi = \"are\
    \ you the one looking for me?\";\n\nfor (var char of hi) {\n\n   console.log(char);\
    \ // are you the one looking for me?\n\n}\n\nJS Generation\n\nTypeScript will\
    \ always generate a standard “for (var i = 0; i < list.length; i++)” for pre ES6\
    \ targets. Our previous example will generate the following:\n\nvar myArray =\
    \ [7, 2, 5];\n\nfor (var item of myArray) {\n\n   console.log(item);\n\n}\n\n\
    // it will become //\n\nfor (var _j = 0; _j < myArray.length; _j++) {\n\n   var\
    \ item = myArray[_j];\n\n   console.log(item);\n\n}\n\nAs shown in the above example,\
    \ use of “for...of” will make the “intent” clearer and the amount of code you\
    \ are expected to write will also be reduced, as well as the number of variables\
    \ you are expected to create.\n\nLimitations\n\nFor those who are not targeting\
    \ ES6 or above, the code which is generated will assume that the property “length”\
    \ exists on our object and it can be indexed via numbers. This means that it is\
    \ only supported in arrays and string for the legacy JS engines."
