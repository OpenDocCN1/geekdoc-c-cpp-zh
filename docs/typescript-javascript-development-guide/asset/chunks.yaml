    \ // The animal has claws and the animal it flies\n\nFlags can be combined for\
    \ the purpose of creating convenient shortcuts in the definition of the enum.\
    \ This is shown in the code given below:\n\nenum Animal {\n\n   None           =\
    \ 0,\n\n   PossesClaws       = 1 << 0,\n\n   Flies         = 1 << 1,\n\n   EatsFish\
    \       = 1 << 2,\n\n   Endangered     = 1 << 3,\n\n   EndangeredFliesClawedEatFish\
