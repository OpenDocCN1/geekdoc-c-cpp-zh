  trans: "\n消息将与矩形的面积一起显示。正如你可能已经注意到的，类型注解被传递给函数的参数，它们用于指示函数支持的参数类型。在上面的示例中，参数 `shape`\
    \ 是一个字符串，而参数 `length` 和 `width` 是数字。\n\n你必须知道，类型注解（Type annotations）和其他 TypeScript\
    \ 特性在编译期间都是强制执行的。如果向这些参数传递了其他类型的值，编译器将显示编译时错误。在处理大型应用程序时，这是一个非常好的主意。\n\n我们需要演示在我们的情况下是如何检测到错误的。考虑下面的代码：\n\
    \n```typescript\nfunction area(shape: string, width: number, height: number) {\n\
    \    var area = width * height;\n    return \"The shape is \" + shape + \" having\
    \ an area of \" + area + \" cm squared.\";\n}\n\ndocument.body.innerHTML = area(\"\
    rectangle\", \"width\", 15); // width 类型错误\n```\n\n在上面的示例中，`width` 被作为字符串传递，这是错误的。编译器期望\
    \ `width` 应该是一个数字。编译上面的程序后，你将得到以下错误：\n\n```bash\n$ tsc type.ts\ntype.ts(6,26):\
    \ Supplied parameters do not match any signature of call target\n```\n\n这就是你得到的错误类型。\n\
    \n然而，你可能注意到，尽管由于类型不匹配产生了警告，但这并没有阻止 TypeScript 文件的编译并生成 JavaScript 文件。\n\n如上面的示例所示，很清楚注解被用于记录函数或变量意图执行的操作。假设你有一个函数，它期望只传递一个参数，且该参数应该是字符串类型。一旦向它传递一个数组，会发生什么？考虑下面的示例：\n\
    \n```typescript\nfunction welcome(name: string) {\n    return \"Hello, \" + name;\n\
    }\n\nvar user = [0, 1, 2];\n\ndocument.body.innerHTML = wlecome(user);\n```\n\n\
    一旦你重新编译上述代码，你将得到以下错误：\n\n```text\nwelcome.ts(7,26): Supplied parameters do not\
    \ match any signature of call target\n```\n\n同样，你可以尝试从 `welcome` 调用中移除所有参数。TypeScript\
    \ 编译器将警告你传递了意料数量的参数。\n\n# 第 4 章 - 接口 (Interfaces)\n\n我们需要通过扩展之前的示例来实现一个接口，该接口将形状描述为一个具有可选\
    \ `color` 属性的对象。\n\n创建一个新文件，并命名为 `interface.ts`。打开 `index.html` 文件，然后修改使其脚本源为\
    \ `interface.js`。将以下代码添加到 `interface.ts` 文件：\n\n```typescript\ninterface Shape\
    \ {\n    name: string;\n    width: number;\n    height: number;\n    color?: string;\n\
    }\n\nfunction area(shape : Shape) {\n    var area = shape.width * shape.height;\n\
    \    return \"The shape is \" + shape.name + \" having an area of \" + area +\
    \ \" cm squared\";\n}\n\nconsole.log( area( {name: \"rectangle\", width: 20, height:\
    \ 15} ) );\nconsole.log( area( {name: \"square\", width: 20, height: 25, color:\
    \ \"blue\"} ) );\n```\n\n接口是赋予对象类型的名称。我们可以声明接口，并同时在类型注解中使用它。\n\n一旦你编译 `interface.js`\
    \ 文件，你将不会得到任何错误。为了让它产生错误，我们在 `interface.js` 文件中添加一行新代码，包含一个没有 `name` 属性的形状，然后在浏览器的控制台中观察结果。将下面的代码添加到\
    \ `interface.js` 文件中：\n\n```typescript\nconsole.log( area( {width: 20, height:\
    \ 15} ) );\n```\n\n然后你可以运行 `tsc interface.js` 命令来编译文件中的代码。将输出一个错误，但目前不要担心它。刷新你的浏览器，然后观察控制台给你的结果。文本和矩形的面积将形成控制台上的输出。箭头应该如下所示：\n\
    \n```text\ninterface.ts(26,13): Supplied parameters do not match any signature\
    \ of call target:\nCould not apply type 'Shape' to argument 1, which is of type\
    \ '{ width: number; height: number; }'\n```\n\n上述错误的结果是因为传递给函数 `area()` 的对象不符合名为\
    \ `shape` 的接口，因为它需要一个 `name` 属性。\n\n考虑下面的代码，它展示了如何在 TypeScript 中使用接口：\n\n```typescript\n\
    interface Person {\n    fName: string;\n    lName: string;\n}\n\nfunction welcome(person:\
    \ Person) {\n    return \"Hello, \" + person.fName + \" \" + person.lName;\n}\n\
    \nvar user = { fName: \"Jane\", lName: \"User\" };\n\ndocument.body.innerHTML\
    \ = welcome(user);\n```\n\n# 第 5 章 - 函数表达式 (Function Expressions)\n\n理解 `this`\
    \ 的作用域是挑战性的。TypeScript 支持使用箭头函数，这使其变得更简单。注意下面的示例：\n\n```typescript\nvar shape\
    \ = {\n    name: \"rectangle\",\n    width: 20,\n    height: 15\n};\n\nfunction\
    \ area(shape) {\n    var area = shape.width * shape.height;\n    return \"The\
    \ shape is \" + shape.name + \" having an area of \" + area + \" cm squared\"\
    ;\n}\n\nconsole.log(area(shape));\n\nvar shape = {\n    name: \"square\",\n  \
    \  width: 20,\n    height: 25,\n    color: \"blue\"\n};\n\nfunction area(shape)\
    \ {\n    var area = shape.width * shape.height;\n    return \"The shape is \"\
    \ + shape.name + \" having an area of \" + area + \" cm squared\";\n}\n\nconsole.log(area(shape));\n\
    ```\n"
- fmt: "\n```javascript\nthis.becomeOld = function() {\n    _this.age++;  // using\
    \ the already captured this\n}\n}\n\nvar person = new Person(1);\n\nsetTimeout(person.becomeOld,\
    \ 1000);\n\nsetTimeout(function() { console.log(person.age); }, 2000); // 2\n\
    ```\n\nSince we are using TypeScript, it is possible for us to use a sweeter syntax\
    \ by combining classes and arrows. This is shown in the example code given below:\n\
    \n```typescript\nclass Person {\n    constructor(public age:number) {}\n\n   \
    \ becomeOld = () => {\n        this.age++;\n    }\n}\n\nvar person = new Person(1);\n\
    \nsetTimeout(person.becomeOld, 1000);\n\nsetTimeout(function() { console.log(person.age);\
    \ }, 2000); // 2\n```\n\nHowever, you should know that the fat arrow should only\
    \ be used if you are to give the function to another individual so as to make\
    \ the calling. This one shown below:\n\n```javascript\nvar becomeOld = person.becomeOld;\n\
    \n// This will be called by someone else later:\n\nbecomeOld();\n```\n\nIf you\
    \ are to call it yourself, you should do it as shown below:\n\n```javascript\n\
    person.becomeOld();\n```\n\nAnd then the `this` object will become the correct\
    \ calling context.\n\nIn most cases, libraries will use the object `this` so as\
    \ to pass the object which is currently being iterated on. If you are in need\
    \ of accessing the library passed `this`, even your surrounding variable, you\
    \ can make use of a temp variable like you would do in the absence of arrow functions.\
    \ This is shown in the code given below:\n\n```javascript\nlet _self = this;\n\
    \nthing.each(function() {\n    console.log(_self); // this is your lexically scoped\
    \ value\n    console.log(this); // this is a library passed value\n});\n```\n\n\
    # Chapter 6- Classes\n\nIn TypeScript, there are classes which have a public or\
    \ private accessibility. In TypeScript, classes are used in the same way as in\
    \ ES6. Create a new file, and give it the name `class.ts`. Add the following code\
    \ to the class:\n\n```typescript\nclass Shape {\n    area: number;\n    color:\
    \ string;\n    constructor ( name: string, width: number, height: number ) {\n\
    \        this.area = width * height;\n        this.color = \"red\";\n    };\n\
    \    shoutit() {\n        return \"The object is\" + this.color + \" \" + this.name\
    \ + \" having an area of \" + this.area + \" cm squared.\";\n    }\n}\n\nvar square\
    \ = new Shape(\"square\", 20, 20);\n\nconsole.log( square.shoutit() );\nconsole.log(\
    \ 'Area of Object: ' + square.area );\nconsole.log( 'Name of Object: ' + square.name\
    \ );\nconsole.log( 'Color of Object: ' + square.color );\nconsole.log( 'Width\
    \ of Object: ' + square.width );\nconsole.log( 'Height of Object: ' + square.height\
    \ );\n```\n\nOur object in the above example has two properties, namely `area`\
    \ and `color`. We have also implemented a constructor and the method `shoutit()`.\
    \ Our constructor arguments have a scope which is local to the constructor. Due\
    \ to this, errors will be observed both in the browser and the compiler, as shown\
    \ below:\n\n```text\nclass.ts(12,42): The 'name' property does not exist on the\
    \ value of type 'Shape'\nclass.ts(20,40): The 'name' property does not exist on\
    \ the value of type 'Shape'\nclass.ts(22,41): The 'width' property does not exist\
    \ on the value of type 'Shape'\nclass.ts(23,42): The 'height' property does not\
    \ exist on the value of type 'Shape'\n```\n\nTypeScript supports both `public`\
    \ and `private` access modifiers. With public members, we are able to access them\
    \ from everywhere, while with the private members, we can only access them from\
    \ within the In. In JavaScript, there is no feature which can be used for the\
    \ purpose of enforcing privacy, and this is why it is enforced during compile-time,\
    \ and it serves to warn the developer about their intention to make it private.\n\
    \nWe are in need of adding the public accessibility modifier to the constructor\
    \ argument `name` and then a private accessibility modifier to a member, that\
    \ is, `color`. Once an accessibility modifier has been added to an argument of\
    \ a constructor, this will automatically become a member of class with that accessibility\
    \ modifier. Consider the example given below:\n\n```typescript\n...\nprivate color:\
    \ string;\n...\nconstructor ( public name: string, width: number, height: number\
    \ ) {\n...\n```\n\nConsider the ES 6 class given below:\n\n```javascript\nclass\
    \ Monster {\n    constructor(name, initPosition) {\n        this.name = name;\n\
    \        this.initPosition = initPosition;\n    }\n}\n```\n\nIn TypeScript, there\
    \ are classes which have a public or private accessibility. In TypeScript, classes\
    \ are used in the same way as in ES6. Create a new file, and give it the name\
    \ `class.ts`. Add the following code to the class:\n\n```typescript\nclass Shape\
    \ {\n    area: number;\n    color: string;\n    constructor ( name: string, width:\
    \ number, height: number ) {\n        this.area = width * height;\n        this.color\
    \ = \"red\";\n    };\n    shoutit() {\n        return \"The object is\" + this.color\
    \ + \" \" + this.name + \" having an area of \" + this.area + \" cm squared.\"\
    ;\n    }\n}\n\nvar square = new Shape(\"square\", 20, 20);\n\nconsole.log( square.shoutit()\
    \ );\nconsole.log( 'Area of Object: ' + square.area );\nconsole.log( 'Name of\
    \ Object: ' + square.name );\nconsole.log( 'Color of Object: ' + square.color\
    \ );\nconsole.log( 'Width of Object: ' + square.width );\nconsole.log( 'Height\
    \ of Object: ' + square.height );\n```\n\nOur object in the above example has\
    \ two properties, namely `area` and `color`. We have also implemented a constructor\
    \ and the method `shoutit()`. Our constructor arguments have a scope which is\
    \ local to the constructor. Due to this, errors will be observed both in the browser\
    \ and the compiler, as shown below:\n\n```text\nclass.ts(12,42): The 'name' property\
    \ does not exist on the value of type 'Shape'\nclass.ts(20,40): The 'name' property\
    \ does not exist on the value of type 'Shape'\nclass.ts(22,41): The 'width' property\
    \ does not exist on the value of type 'Shape'\nclass.ts(23,42): The 'height' property\
    \ does not exist on the value of type 'Shape'\n```\n\nTypeScript supports both\
