    \n## Table of Contents\n- [Introduction](#\n- [Chapter 1- A Brief Overview of\
    \ TypeScript](#\n- [Chapter 2- Installing TypeScript](#\n- [Chapter 3- Type Annotations](#\n\
    - [Chapter 4- Interfaces](#\n- [Chapter 5- Arrow Function Expressions](#\n- [Chapter\
    \ 6- Classes](#\n- [Chapter 7- Destructuring](#\n- [Chapter 8- for...of](#\n-\
    \ [Chapter 9- Iterators](#\n- [Chapter 10- Template Strings](#\n- [Chapter 11-\
    \ Spread Operator](#\n- [Chapter 12- Enums](#\n- [Chapter 13- let](#\n- [Conclusion](#\n\
    \n## Introduction\nThere is a greater need for large software applications, and\
    \ especially the web applications. The reason behind this is the increase in the\
    \ functionalities which are needed to be implemented in software applications.\
    \ This calls for us to learn how to develop large applications. This can only\
    \ be done in programming languages which are capable of supporting that. TypeScript\
    \ is one of such programming languages. It supports the creation of large applications.\
    \ This book is an excellent waay for you to learn how to program in TypeScript.\
    \ Enjoy reading!\n\n## Chapter 1- A Brief Overview of TypeScript\nTypeScript is\
    \ a programming language which was developed and is maintained by Microsoft. It\
    \ is an open source programming language. The language is a superset of `JavaScript`\
    \ since it has added some extra features to it, such as support for object oriented\
    \ programming and optional static typing. The language was developed for the purpose\
    \ of creating large applications, and it always compiles into `JavaScript`. One\
    \ can use TypeScript to develop JavaScript applications for both the client side\
    \ and server side. Since we have said that TypeScript is a superset of `javaScript`,\
    \ any program written in `JavaScript` is also viable to be considered a TypeScript\
    \ program. The TypeScript compiler was also written in TypeScript.\n\nThe aim\
    \ of TypeScript is to provide developers with an easy mechanism by which to develop\
    \ large applications. It comes with concepts such as classes, inheritance, interfaces,\
    \ modules, and others, and these make it easy for developers to create large applications\
    \ with much ease.\n\n## Chapter 2- Installing TypeScript\nThere are two ways that\
    \ we can install TypeScript into our system. These include the following:\n\n\
    1. By use of the `npm` (Node Package Manager) tool.\n2. By installation of Visual\
    \ studio plugins for TypeScript.\n\nFor Windows users, you can use the second\
    \ option if it will be more convenient for you. Just install the Visual Studio,\
    \ and then download and install the necessary plugin for programming in TypeScript.\
    \ This option has been found to be a bit superior compared to the use of other\
    \ code editors.\n\nFor those using platforms other than Windows, just ensure that\
    \ you have a text editor, a browser, and the `npm` package for TypeScript so as\
    \ to be able to program in TypeScript. The following steps can be followed for\
    \ this to be done:\n\n1. Begin by installing the Node Package Manager (`npm`).\n\
    \nJust open the terminal, and execute the commands given below:\n\n```\n$ curl\
    \ http://npmjs.org/install.sh | sh\n$ npm --version\n1.1.70\n```\n\n2. In the\
    \ next step, install the TypeScript `npm` package, and this should be done globally\
    \ on the command line. The following commands can be used for doing this:\n\n\
    ```bash\n$ npm install -g typescript\n$ npm view typescript version\nnpm http\
    \ GET https://registry.npmjs.org/typescript\nnpm http 304 https://registry.npmjs.org/typescript\n\
    0.8.1-1\n```\n\nMake sure that you use the latest version of your browser, such\
    \ as `Chrome`. Any text editor is appropriate, and an example of this is the Sublime\
    \ text editor.\n\n### Hello World Example\nNow that we have set up the environment\
    \ ready for programming, we can begin to program. We will begin by creating the\
    \ Hello world example. Remember that TypeScript is a superset of `ES5`, and it\
    \ has more features for `ES6`. TypeScript is also compiled into `JavaScript`.\n\
    \nWe want to create our `index.html` file and then reference it to an external\
    \ file. Here is the code for the file `index.html`:\n\n```html\n<!doctype html>\n\
    <html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>This is TypeScript</title>\n\
    </head>\n<body>\n  <script src=\"hello.ts\"></script>\n</body>\n</html>\n```\n\
    \nAs shown in the above code, we have referenced the code in the file to the file\
    \ `hello.ts`. This has been done in the line `<script src=\"hello.ts\"></script>`.\
    \ The extension `.ts` in the file means that it is a TypeScript file.\n\nNow,\
    \ create a new file and give it the name `hello.ts`. The following line of code\
    \ should then be added to the file:\n\n```javascript\nalert('hello world, this\
    \ is TypeScript!');\n```\n\nAfter that, just launch the command line, and then\
    \ navigate to the folder with the file `hello.ts`. Compile the file by executing\
    \ the following command:\n\n```bash\ntsc hello.ts\n```\n\nThe `tsc` command in\
    \ TypeScript represents the TypeScript compiler, and it will generate a new file\
    \ with the name `hello.js`. From the extension in the file, we will have transformed\
    \ the TypeScript to a JavaScript file, which is what normally happens in TypeScript.\n\
    \n## Chapter 3- Type Annotations\nThis feature is optional in TypeScript, and\
    \ it allows us to express and implement indentation in our TypeScript programs.\
    \ We need to demonstrate this by creating a program which will calculate the area\
    \ of a rectangle. Just open your text editor and create a new file with the name\
    \ `area.ts`. Add the following code to the file:\n\n```typescript\nfunction area(shape:\
    \ string, width: number, height: number) {\n  var area = width * height;\n  return\
    \ \"The shape is \" + shape + \" having an area of \" + area + \" cm squared.\"\
    ;\n}\n\ndocument.body.innerHTML = area(\"rectangle\", 20, 15);\n```\n\nNext, open\
    \ the file `index.html` and change the script source from `type.ts` to `area.ts`.\
    \ Open your terminal, and then execute the following command so as to compile\
    \ the whole thing:\n\n```bash\ntsc area.ts\n```\n"
