  raw: "The message together with the area of the rectangle will be displayed. As\
    \ you must have noticed, the type annotations are passed to the parameters of\
    \ the function, and they are used for indicating the kind of parameters which\
    \ are supported by the function. In the above example, the parameter “shape” is\
    \ a string, while the parameters length and width are numbers.\n\nYou have to\
    \ know that both Type annotations and other TypeScript features are enforced during\
    \ compile time. In case one passes other types of values to these parameters,\
    \ a compile-time error will be displayed by the compiler. This is a very good\
    \ idea when it comes to working with large applications.\n\nWe need to demonstrate\
    \ how errors will be detected in our case. Consider the code given below:\n\n\
    function area(shape: string, width: number, height: number) {\n\n    var area\
    \ = width * height;\n\n    return \"The shape is \" + shape + \" having an area\
    \ of \" + area + \" cm squared.\";\n\n}\n\ndocument.body.innerHTML = area(\"rectangle\"\
    , \"width\", 15); // wrong type of width\n\nIn the above example, the width has\
    \ been passed in as a string, which is wrong. The compiler expects that the width\
    \ should be a number. After compiling the program given above, you will get the\
    \ following as the error:\n\n$ tsc type.ts\n\ntype.ts(6,26): Supplied parameters\
    \ do not match any signature of call target\n\nThat is the kind of error you get.\n\
    \nHowever, you must have noticed that although there was a warning due to type\
    \ mismatch, this did not stop  the TypeScript file from compiling and creating\
    \ a JavaScript file.\n\nAs shown in the above examples, it is very clear that\
    \ annotations are used for the purpose of recording the function which a function\
    \ or a variable is intended to perform. Suppose that you have a function which\
    \ expects that only a single parameter should be passed to it, and the parameter\
    \ should be of the string type. What should happen once we pass an array to it?\
    \ Consider the example given below:\n\nfunction welcome(name: string) {\n\n   return\
    \ \"Hello, \" + name;\n\n}\n\nvar user = [0, 1, 2];\n\ndocument.body.innerHTML\
    \ = wlecome(user);\n\nOnce you recompile the above code, you will get the following\
    \ error:\n\nwelcome.ts(7,26): Supplied parameters do not match any signature of\
    \ call target\n\nSimilarly, you can try to remove all the parameters from the\
    \ welcome call function. You will be warned by the TypeScript compiler that you\
    \ have passed in an unexpected number of parameters.\n\n# \n\nChapter 4- Interfaces\n\
    \nWe need to use our previous example by expanding it so as to implement an interface\
    \ which will describe the shape as an object having an optional color property.\n\
    \nCreate a new file, and give it the name “interface.ts.” Open the file “index.html”\
    \ and then modify it so as to have the script source as “interface.js.” Add the\
    \ following code to the file “interface.ts”:\n\ninterface Shape {\n\n    name:\
