    \n解决方案是配置你的开发环境，在用户加载页面之前处理 JSX 到 JS 的转换（参见图 15-2）。\n\n![Image](img/image00302.jpeg)\n\
    \n图 15-2 作为应用构建过程一部分的 JSX 到 JavaScript 转换。\n\n有了这个解决方案，你的浏览器加载应用并处理的是一个已经转换（并可能经过优化）的\
    \ JavaScript 文件。很棒对吧？现在，我们之所以直到才谈论这一切，唯一的原因就是`简单性`。学习 React 已经足够困难了。在学习 React\
    \ 的过程中增加构建工具和环境配置的复杂性，这并不酷。现在你已经牢牢地掌握了 React 的所有功能，是时候通过这一章来改变这一点了。\n\n在接下来的章节中，我们将介绍一种结合\
    \ Node、Babel 和 webpack 来配置开发环境的方法。如果这一切听起来对你来说很奇怪，不要担心。到结束时，你将和所有工具变得如老胶一样。\n\n\
    ***\n\n注意：内容可能会变化\n\n构建工具及其依赖项一直在变化。这对我们来说是个好消息，但它让发布相关信息变成了一项挑战！本章包含了基于当前（即编写本文时！）最佳实践的最新信息，但这些信息可能会发生变化。如果你发现某些工具和指令的工作方式与描述不符，请通过以下位置查看本文的（更新频率更高的）在线版本：[`www.kirupa.com/react/setting_up_react_environment.htm`](https://www.kirupa.com/react/setting_up_react_environment.htm)\n\
    \n***\n\n### 认识工具\n\n好了，是时候进一步远离泛泛的论述（以及那些精美的图表）了。是时候严肃对待了——呃。是时候认识我们将依靠来妥善配置开发环境的工具了。\n\
    \n#### Node.js\n\n在很长一段时间里，JavaScript 是你写来主要让事物在浏览器中发生的代码。Node.js 改变了这一切。Node.js\
    \ 允许你使用 JavaScript 创建运行在服务器上的应用程序，并访问浏览器梦都无法想象的 API 和系统资源。它基本上是一个功能完整的应用程序开发运行时，其应用（而不是用\
    \ Java、C#、C++ 等编写）完全在 JavaScript 上构建和运行。\n\n为了实现我们的目的，我们将依赖 Node.js（准确说是 Node\
    \ 的包管理器，即 `NPM`）来管理依赖项，并将从 JSX 到 JavaScript 所需的步骤结合起来。把 Node.js 想成让我们的开发环境运行的胶水即可。\n\
    \n#### Babel\n\n这个我们应该很熟悉！简单来说，Babel 是一个 JavaScript 转译器。它将你的 JavaScript 转换为……嗯……JavaScript。这听起来非常奇怪，让我澄清一下。如果你正在使用最新的\
    \ JavaScript 特性，旧版浏览器在遇到新函数或属性时可能不知道该怎么办。如果你在写 JSX，那么……没有任何浏览器知道该如何处理它！\n\nBabel\
    \ 所做是将你新颖的 JS 或 JSX 转换为大多数浏览器都能理解的 JS 形式。一直以来一直使用它的浏览器内版本将 JSX 转换为 JavaScript。稍后，你将看到我们如何将\
    \ Babel 作为构建过程的一部分，从我们的 JSX 生成一个真正的浏览器可读的 JS 文件。\n\n#### webpack\n\n我们将依赖的最后一个工具是\
    \ webpack。它被称为模块打包器。抛开这个华丽的称号不谈，你的应用包含的许多框架和库都有许多依赖项，你所依赖的功能部分可能只是较大组件的子集。\n\n\
    你可能不需要所有这些必要的代码，而像 webpack 这样的工具起着至关的作用，让你能够只包含运行应用所需的相关的代码。它们通常会将所有相关代码（即使它们来自不同的来源）打包成单个文件（参见图\
    \ 15-3）。\n\n![Image](img/image00303.jpeg)\n\n图 15-3 打包进单个文件的文件。\n\n#### 你的代码编辑器\n\
    \n关于开发环境的对话离不开谈论这一切中最重要的工具——你的代码编辑器（参见图 15-4）。\n\n![Image](img/image00304.jpeg)\n\
    \n图 15-4 你的代码编辑器。\n\n无论你使用 Sublime、Atom、VisualStudio Code、TextMate、Coda 还是任何其他工具都没关系。你都会在代码编辑器中花费大量时间，这不仅是为了构建你的\
    \ React 应用，还为了配置 Node、Babel 和 WebPack 需要的各种文件。\n\n#### 是时候配置环境了！\n\n到目前，你应该对我们正在尝试要做有一个模糊的想法……我们正努力实现的梦想！我们甚至查看了将使这个梦想成为现实的各种工具。现在，是时候付诸实，来实际制作一切了。\n\
    \n#### 设置我们的初始项目结构\n\n我们要做的第一件事是设置项目。去你的桌面创建一个名为 **TotallyAwesomeApp** 的新文件夹。在这个文件夹内部，创建两个名为\
    \ **dev** 和 **output** 的文件夹。你的文件夹结构看起来像图 15-5。\n\n![Image](img/image00305.jpeg)\n\
    \n图 15-5 我们现在的文件夹结构。\n\n我们这样做非常简单。在我们的 **dev** 文件夹中，我们将放置所有未优化和未转换的 JSX、JavaScript\
    \ 以及其他脚本内容。换句话说，这就是你编写和活跃工作的代码所在的地方。在我们的 **output** 文件夹中，我们将放置运行各种构建工具处理 **dev**\
    \ 文件夹内脚本文件的结果。这是 Babel 将我们所有的 JSX 文件转换为 JS 的地方。这也是 webpack 解析我们的脚本文件之间的依赖关系，并将所有重要的脚本内容放入单个\
    \ JavaScript 文件的地方。\n\n接下来我们要的是创建一个让浏览器指向的 HTML 文件。在 **TotallyAwesomeApp** 文件夹中，使用你的代码编辑器创建一个名为\
    \ **index.html** 的新 HTML 文件，内容如下：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>React! React! React!</title>\n</head>\n</html>\n```\n"
