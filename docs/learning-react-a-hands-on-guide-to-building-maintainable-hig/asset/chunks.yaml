    \ + 100\n    });\n  },\n  componentDidMount: function() {\n    setInterval(this.timerTick,\
    \ 1000);\n  },\n  render: function() {\n    return (\n      <h1>{this.state.strikes}</h1>\n\
    \    );\n  }\n});\n```\n"
