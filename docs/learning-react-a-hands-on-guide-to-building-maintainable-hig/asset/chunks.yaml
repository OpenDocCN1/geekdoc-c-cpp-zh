  raw: 'The last major React-related topic we look at is less about React and more
    about setting up your development environment to build a React app. Up until now,
    we’ve been building our React apps by including a few script files:


    [Click here to view code image](#part0041.xhtml_p179pro01)


    <script src="https://npmcdn.com/react@15.3.0/dist/react.js"></script>


    <script src="https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js"></script>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


    These script files not only loaded the React libraries, but they also loaded Babel
    to help our browser do what needs to be done when it encountered bizarre things
    like JSX (see [Figure 15-1](#part0022.xhtml_ch15fig01)).


    ![Image](Images/image00301.jpeg)


    Figure 15-1 Our React approach.


    To review what we mentioned earlier when talking about this approach, the downside
    is performance. As part of your browser doing all of the page-loading related
    things it normally does, it is also responsible for turning your JSX into actual
    JavaScript. That JSX to JavaScript conversion is a time-consuming process that
    is fine during development. It isn’t fine if every user of your app has to pay
    that performance penalty.


    The solution is to set up your development environment where your JSX to JS conversion
    is handled prior to the user loading the page (see [Figure 15-2](#part0022.xhtml_ch15fig02)).


    ![Image](Images/image00302.jpeg)


    Figure 15-2 JSX to JavaScript conversion as part of your app building process.


    With this solution, your browser is loading your app and dealing with an already
    converted (and potentially optimized) JavaScript file. Good stuff, right? Now,
    the only reason why we delayed talking about all of this until now is for *simplicity*.
    Learning React is difficult enough. Adding the complexity of build tools and setting
    up your environment as part of learning React is just not cool. Now that you have
    a solid grasp of everything React does, it’s time to change that with this chapter.


    In the following sections, we look at one way to set up your development environment
    using a combination of Node, Babel, and webpack. If all of this sounds bizarre
    to you, don’t worry. You’ll be on a first name basis with all of these tools by
    the end of it.


    * * *


    Note: Things May Change


    Build tools and their dependencies change all the time. That is great news for
    us, but it makes publishing information about it a challenge! This chapter contains
    the latest information based on current (aka when this was written!) best-practices,
    but this information may change. If you find that some tools and instructions
    aren’t working they way they are described, please check out the (more frequently
    updated) online version of this article at the following location: [https://www.kirupa.com/react/setting_up_react_environment.htm](https://www.kirupa.com/react/setting_up_react_environment.htm)


    * * *


    ### Meet the Tools


    Ok, it is time to move further away from generalities (and sweet diagrams). It
    is time to get serious—er. It is time to meet the tools that we are going to be
    relying on to properly set up our development environment.


    #### Node.js


    For the longest time, JavaScript was something you wrote to primarily have things
    happen in your browser. Node.js changes all of this. Node.js allows you to use
    JavaScript to create applications that run on the server and have access to APIs
    and system resources that your browser couldn’t even dream of. It is basically
    a full-fledged application development runtime whose apps (instead of being written
    in Java, C#, C++, etc.) are built and run entirely on JavaScript.


    For our purposes, we are going to be relying on Node.js (well, the Node Package
    Manager, aka NPM) to manage dependencies and tie together the steps needed to
    go from JSX to JavaScript. Think of Node.js as the glue that makes our development
    environment work.


    #### Babel


    This one should be familiar to us! Simply put, Babel is a JavaScript transpiler.
    It turns your JavaScript into...um...JavaScript. That sounds really bizarre, so
    let me clarify. If you are using the latest JavaScript features, older browsers
    might not know what to do when they encounter a new function or property. If you
    are writing JSX, well...no browser will know what to do with that!


    What Babel does is take your new-fangled JS or JSX and turn into a form of JS
    that most browsers can understand. We’ve been using its in-browser version to
    transform our JSX into JavaScript all this time. In a few moments, you’ll see
    how we can integrate Babel as part of our build process to generate an actual
    browser-readable JS file from our JSX.


    #### webpack


    The last tool we will be relying on is webpack. It is known as a module bundler.
    Putting the fancy title aside, a lot of the frameworks and libraries your app
    includes have a lot of dependencies where different parts of the functionality
    you rely on might only be a subset of larger components.


    You probably don’t want all of that unnecessary code, and tools like webpack play
    an important role to enable you to only include the relevant code needed to have
    your app work. They often bundle all of the relevant code (even if it comes from
    various sources) into a single file (see [Figure 15-3](#part0022.xhtml_ch15fig03)).


    ![Image](Images/image00303.jpeg)


    Figure 15-3 Files packed into a single file.


    We’ll be relying on webpack to bundle up the relevant parts of the React library,
    our JSX files, and any additional JavaScript into a single file. This also extends
    to CSS (LESS/SASS) files and other types of assets your app uses, but we’ll focus
    on just the JavaScript side here.


    #### Your Code Editor


    No conversation about your development environment can happen without talking
    about the most important tool in all of this, your code editor (see [Figure 15-4](#part0022.xhtml_ch15fig04)).


    ![Image](Images/image00304.jpeg)


    Figure 15-4 Your code editor.


    It doesn’t matter whether you use Sublime, Atom, VisualStudio Code, TextMate,
    Coda, or any other tool. You will spend some non-trivial amount of time in your
    code editor not just to build your React app but to also configure the various
    configuration files that Node, Babel, and WebPack need.


    ### It Is Environment Setup Time!


    At this point, you should have a vague idea of what we are trying to do...the
    dream we are trying to achieve! We even looked at the various tools that will
    play a role in making this dream a reality. Now, it is time for the hard work
    to actually make everything happen.


    #### Setting up our Initial Project Structure


    The first thing we are going to do is set up our project. Go to your Desktop and
    create a new folder called **MyTotallyAwesomeApp**. Inside this folder, create
    two more folders called **dev** and **output**. Your folder arrangement will look
    a little bit like [Figure 15-5](#part0022.xhtml_ch15fig05).


    ![Image](Images/image00305.jpeg)


    Figure 15-5 Our current folder arrangement.


    What we are doing here is pretty simple. Inside our **dev** folder, we will place
    all of our unoptimized and unconverted JSX, JavaScript, and other script-related
    content. In other words, this is where the code you are writing and actively working
    on will live. Inside our **output** folder, we will place the result of running
    our various build tools on the script files found inside the **dev** folder. This
    is where Babel will convert all of our JSX files into JS. This is also where webpack
    will resolve any dependencies between our script files, and place all of the important
    script content into a single JavaScript file.


    The next thing we are going to do is create the HTML file that we will point our
    browser to. Inside the **MyTotallyAwesomeApp** folder, use your code editor to
    create a new HTML file called **index.html** with the following contents:


    [Click here to view code image](#part0041.xhtml_p185pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React! React! React!</title>


    </head>'
