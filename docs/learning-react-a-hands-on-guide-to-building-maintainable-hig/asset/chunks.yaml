    ### Creating the Functionality


    The actual implementation of our Todo List app functionality is not as crazy as
    you might think. Let’s take a high-level view of how it works. The most important
    piece of data is the text you enter into the text field. Each time you enter some
    text and submit the form, that text gets visually displayed in a list below any
    previous pieces of text you submitted. So far, this makes sense, right?


    All of this is done by simply taking advantage of React’s state functionality.
    Inside our `state` object, we have an array that is responsible for storing everything
    you enter (see [Figure 14-5](#part0021.xhtml_ch14fig05)).


