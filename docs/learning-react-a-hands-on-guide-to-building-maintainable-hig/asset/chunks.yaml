  trans: "\n\n![Image](img/image00226.jpeg) **让你的浏览器依赖 JavaScript 库来自动将 JSX 转换为它能理解的内容。**\
    \ 你可以像编写任何旧的 JavaScript 一样直接指定 JSX，而你的浏览器会处理剩下的工作。\n\n这两种解决方案在我们的世界中都有其用武之地，但让我们来谈谈各自的影响。\n\
    \n第一种方案起初看起来有点复杂且耗时，但它是当今现代 Web 开发的方式。除了将你的 JSX 编译（更准确地说说是转译）为 `JS` 之外，这种方法还允许你利用模块、更强大的构建工具以及许多让构建复杂的\
    \ Web 应用程序变得易于维护的特性。\n\n第二种方案提供了一个快速且直接的路径，你最初花更多时间在编写代码上，花更少的时间在折腾开发环境上。要使用这种方案，你只需要引用一个脚本文件。该脚本文件会在页面加载时处理将\
    \ JSX 转换为 `JS`，你的 React 应用无需你对开发环境进行任何特殊处理即可运行。\n\n在我们对 React 的入门介绍中，我们将使用第二种方案。你可能会好奇为什么我们不一直使用第二种方案。原因是你的浏览器每次花时间将\
    \ JSX 翻译成 `JS` 时都会受到性能影响。在学习如何使用 React 时这是完全可以的，但在将应用部署到真实场景时，这是完全不可接受的。正由于这种不可接受性，在你舒适地上手\
    \ React 之后，我们将重新回顾这一切，并查看第一种方案以及如何设置你的开发环境。\n\n### 让你的 React 动起来\n\n在上一节中，我们查看了确保你的\
    \ React 应用最终成为浏览器可以理解内容的两种方法。在本节中，我们将把所有这些话付诸实践。首先，我们需要一个空白的 HTML 页面作为我们的起点。\n\
    \n如果你手头没有空白的 HTML 页面，尽管使用以下内容：\n\n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>React! React! React!</title>\n</head>\n<body>\n  <script>\n \
    \ </script>\n</body>\n</html>\n```\n\n这个页面没有任何无趣或兴奋的内容，但让我们通过添加 React 库的引用来修复这一点。在\
    \ `title` 正下方，添加这两行：\n\n点击此处查看代码图像\n\n```html\n<script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"\
    ></script>\n<script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
    ></script>\n```\n\n这两行代码引入了 React 核心库以及 React 与 DOM 交互所需的各种东西。没有它们，你根本就不在构建 React\
    \ 应用。现在，我们还没结束。我们还需要引用另一个库。在这两个 `script` 标签正下方，添加下面这行代码：\n\n点击此处查看代码图像\n\n```html\n\
    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n```\n\n我们在这里做的是添加对 Babel JavaScript 编译器 ([http://babeljs.io/]) 的引用。Babel\
    \ 做了很多酷炫，但我们关心的是它将 JSX 转换为 JavaScript 的能力。\n\n此时，我们的 HTML 页面应该看起来如下所示：\n\n点击此处查看代码图像\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>React! React! React!</title>\n\
    \  <script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script\
    \ src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"></script>\n  <script\
    \ src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n</head>\n<body>\n  <script>\n  </script>\n</body>\n</html>\n```\n\n\
    如果你现在预览你的页面，你会发现这个页面仍然是空白的，没有任何可见的内容。这没关系。我们接下来要修复它。\n\n### 显示你的名字\n\n我们要做的第一件事是使用\
    \ React 在屏幕上显示我们的名字。我们的方法是使用一个名为 `render` 的方法。在你的 `script` 标签内部，添加以下内容：\n\n点击此处查看代码图像\n\
    \n```javascript\nReactDOM.render(\n  <h1>Sherlock Holmes</h1>,\n  document.body\n\
    );\n```\n\n如果现在你觉得这些内容没有任何意义，不要担心。我们的目标是先在屏幕上显示点东西，稍后我们就会明白我们做了什么。现在，在我们页面中预览它以观察发生什么之前，我们需要将这个\
    \ `script` 块指定为 Babel 可以施展魔法的对象。我们这样做的方法是将 `script` 标签的 `type` 属性设置为值 `text/babel`：\n\
    \n```html\n<script type=\"text/babel\">\nReactDOM.render(\n  <h1>Sherlock Holmes</h1>,\n\
    \  document.body\n);\n</script>\n```\n\n如果你现在预览你的页面，你会发现这个页面仍然是空白的，没有任何可见的内容。这没关系。我们接下来要修复它。\n\
    \n一旦你做了更改，现在你会看到 **Sherlock Holmes** 打印了出来。恭喜你！你用 React 构建了一个应用。\n\n从应用来看，这没什么特别的。虽然我们使用了\
    \ React，但你只是在使用 `render` 方法。\n\nrender 方法接收两个参数：\n\n![Image](img/image00226.jpeg)\
    \ 第一个参数是渲染的 JSX 元素\n\n![Image](img/image00226.jpeg) 第二个参数是 `document.body`\n\n\
    这是我们的 render 方法看起来的样子：\n\n```javascript\nReactDOM.render(\n  <h1>Sherlock Holmes</h1>,\n\
    \  document.body\n);\n```\n\n虽然由于 JSX，JavaScript 看起来很新颖，但浏览器看到的最终结果是干净的 HTML、CSS\
    \ 和 JavaScript。为了让你亲自看到这一点，让我们对应用的行为和外观进行一些修改。\n\n#### 更改目的地\n\n我们要做的第一件事是更改 JSX\
    \ 的输出位置。使用 JavaScript 将元素直接放在 `body` 元素中永远不是好主意。可能会出现很多问题——特别是当你要把 React 与其他 JS\
    \ 库和框架混合时。推荐的做法是创建一个单独的元素将其视为新的根元素。该元素将作为我们 `render` 方法的目的地。为了实现这一点，回到 HTML 添加一个\
    \ `id` 值为 `container` 的 `div` 元素。\n\n与其向你展示这一微小更改的完整 HTML，这里是仅仅我们的 `body` 元素看起来的样子：\n\
    \n```html\n<body>\n  <div id=\"container\"></div>\n</body>\n```\n\n"
- fmt: "\n```html\n<div id=\"container\"></div>\n\n<script type=\"text/babel\">\n\
    \  ReactDOM.render(\n    <h1>Batman</h1>\n    document.body\n  );\n</script>\n\
    </body>\n```\n\nWith our `container` `div` element safely defined, let’s modify\
    \ the `render` method to use it instead of `document.body`. Here is one way of\
    \ doing this:\n\n```javascript\nReactDOM.render(\n  <h1>Batman</h1>\n  document.querySelector(\"\
    #container\")\n);\n```\n\nAnother way of doing this is by doing some things outside\
    \ of the `render` method itself:\n\n[Click here to view code image](#part0028.xhtml_p018pro02)\n\
    \n```javascript\nvar destination = document.querySelector(\"#container\");\n\n\
    ReactDOM.render(\n  <h1>Batman</h1>\n  destination\n);\n```\n\nNotice that the\
    \ `destination` variable stores the reference to our container DOM element. Inside\
    \ the `render` method, we simply reference the same `destination` variable instead\
    \ of writing the full element-finding syntax as part of the argument itself. The\
    \ reason I want to do this is simple. I want to show you that you are still writing\
    \ JavaScript and `render` is just another boring old method that happens to take\
    \ two arguments.\n\n## Styling It Up!\n\nTime for our last change before we call\
    \ it a day. Right now, our names show up in whatever default `h1` styling our\
    \ browser provides. That is just terrible, so let’s fix it by adding some CSS.\
    \ Inside your `head` tag, add a `style` block with the following CSS:\n\n```css\n\
    #container {\n  padding: 50px;\n  background-color: #EEE;\n}\n\n#container h1\
    \ {\n  font-size: 48px;\n  font-family: sans-serif;\n  color: #0080A8;\n}\n```\n\
    \nAfter you have added all of this, preview your page. Notice that our text appears\
    \ with a little more purpose than it did earlier when it relied entirely on the\
    \ browser’s default styling (see [Figure 2-1](#part0009.xhtml_ch02fig01)).\n\n\
    ![Image](Images/image00238.jpeg)\n\nFigure 2-1 The result of adding the CSS.\n\
    \nThe reason this works is that our DOM’s `body`, after running all of the React\
    \ code, contains our `container` element with an `h1` tag inside it. It doesn’t\
    \ matter that the `h1` tag was defined entirely inside JavaScript in this JSX\
    \ syntax or that your CSS was defined well outside of the `render` method. The\
    \ end result is that your React app is still going to be made up of some 100%\
    \ organic (and cage-free!) HTML, CSS, and JavaScript:\n\n[Click here to view code\
    \ image](#part0028.xhtml_p020pro01)\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>React! React! React!</title>\n  <script src=\"https://fb.me/react-15.1.0.js\"\
    ></script>\n  <script src=\"https://fb.me/react-dom-15.1.0.js\"></script>\n  <script\
    \ src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #EEE;\n    }\n    #container h1 {\n      font-size: 144px;\n      font-family:\
    \ sans-serif;\n      color: #0080a8;\n    }\n  </style>\n</head>\n<body>\n  <div\
    \ id=\"container\"></div>\n  <script type=\"text/babel\">\n    var destination\
    \ = document.querySelector(\"#container\");\n    ReactDOM.render(React.createElement(\n\
    \      \"h1\",\n      null,\n      \"Batman\"\n    ), destination);\n  </script>\n\
    </body>\n</html>\n```\n\nNotice that there is nary a trace of React-like code\
    \ in sight. Also, we should use the word *nary* more often in everyday conversation!\n\
    \n## Conclusion\n\nIf this is your first time building a React app, we covered\
    \ a lot of ground here. One of the biggest takeaways is that React is different\
    \ than other libraries because it uses a whole new language called `JSX` to define\
    \ what the visuals will look like. We got a very small glimpse of that. The reason\
    \ I want to do this is simple. I want to show you that you are still writing JavaScript\
    \ and `render` is just another boring old method that happens to take two arguments.\n\
    \n## 3. Components in React\n\nIf this is your first time building a React app,\
    \ we covered a lot of ground here. One of the biggest takeaways is that React\
    \ is different than other libraries because it uses a whole new language called\
    \ `JSX` to define what the visuals will look like. We got a very small glimpse\
    \ of that. The reason I want to do this is simple. I want to show you that you\
    \ are still writing JavaScript and `render` is just another boring old method\
    \ that happens to take two arguments.\n\n### A Quick Review of Functions\n\nIn\
    \ JavaScript, you have these known as `functions`. They enable you to make your\
    \ code a bit cleaner.\n"
