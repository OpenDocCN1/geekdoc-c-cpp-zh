    \ React 返回一个包含我们 `strikes` 属性（初始化为 0）的对象。你可能在想，我们将这个对象返回给谁或什么？这一切都是在后台发生的魔法。*被返回的对象将被设置为我们组件\
    \ `state` 对象的初始值*。\n\n如果我们在此代码运行后检查 `state` 对象的值，它看起来会像这样：\n\n```javascriptvar\
