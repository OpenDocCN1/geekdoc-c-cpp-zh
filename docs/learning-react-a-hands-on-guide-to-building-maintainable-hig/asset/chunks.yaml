    \n### 结论\n\n我们刚刚对创建有状态组件所能做的事情做了初步尝试。虽然使用 `timer` 来更新我们 `state` 对象中的内容很酷，但真正的动作发生在我们开始将用户交互与状态结合时。到目前为止，我们避开了你的组件将接触的大量鼠标、触摸、键盘和其他相关内容。在接下来的章节中，我们将解决这个问题。在此过程中，你将看到我们将对状态的认知提升到一个全新的高度！如果这不能让你感到兴奋，那我不知道什么能了\
    \ :P\n\n## 9. 从数据到 UI\n\n当你正在构建应用程序时，以 `props`、`state`、`components`、`JSX` 标签、`render`\
    \ 方法以及其他 React 特有概念来思考可能是你脑海中最后考虑的事情。大多数时候，你处理的是 `JSON` 对象、数组和其他数据结构形式的数据，这些数据对\
    \ React 或任何事情一无所知（或感兴趣）。在你的数据与你所看到的内容之间建立鸿沟可能会令人沮丧！别担心，本章将通过运行你将遇到的一些场景来帮助减少这些令人沮丧的时刻！\n\
    \n### 示例\n\n为了理解你即将看到的所有内容，我们需要一个示例。它并不复杂，所以尽管创建一个新的 HTML 文档并将以下内容放入其中：\n\n```html\n\
    <!DOCTYPE html>\n<html\n<head>\n  <title>React! React!</title>\n  <script src=\"\
    https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.2/browser.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n\
    \  <script type=\"text/babel\">\n    var Circle = React.createClass({\n      render:\
    \ function() {\n        var circleStyle = {\n          padding: 10,\n        \
    \  margin: 20,\n          display: \"inline-block\",\n          backgroundColor:\
    \ this.props.bgColor,\n          borderRadius: \"50%\",\n          width: 100,\n\
    \          height: 100,\n        };\n        return (\n          <div style={circleStyle}></div>\n\
    \        );\n      }\n    });\n    var destination = document.querySelector(\"\
    #container\");\n    ReactDOM.render(\n      <div>\n        <Circle bgColor=\"\
    #F9C240\"/>\n      </div>,\n      destination\n    );\n  </script>\n</body>\n\
    </html>\n```\n\n一旦你设置好了文档，请在浏览器中预览你的成果。如果一切顺利，你将会看到一个一个开心的黄色圆圈（见图 9-1）。\n\n![Image](img/image00271.jpeg)\n\
    \n图 9-1 如果一切顺利，你将得到这个黄色圆圈。\n\n如果你看到的和我一样，太好了！现在，让我们花时间理解一下示例在做什么。你看到的大部分来自于 `Circle`\
    \ 组件：\n\n```javascript\nvar Circle = React.createClass({\n  render: function()\
    \ {\n    var circleStyle = {\n      padding: 10,\n      margin: 20,\n      display:\
    \ \"inline-block\",\n      backgroundColor: this.props.bgColor,\n      borderRadius:\
    \ \"50%\",\n      width: 100,\n      height: 100,\n    };\n    return (\n    \
    \  <div style={circleStyle}></div>\n    );\n  }\n});\n```\n\n`circleStyle` 对象包含了将\
    \ `div` 变成圆圈的属性，除了 `backgroundColor` 属性外，所有的值都是硬编码的。它从 `props` 获取值。除了我们的组件，我们最终显示圆圈的方式是通过常用的\
    \ `ReactDOM.render` 方法：\n\n```javascript\nReactDOM.render(\n  <div>\n    <Circle\
    \ bgColor=\"#F9C240\"/>\n  </div>,\n  destination\n);\n```\n\n我们有一个 `Circle` 组件的实例，并将其\
    \ `bgColor` 属性设置为我们希望圆圈显示的颜色。现在，如果我们要处理影响它的数据，在 `render` 方法内部这样定义 `Circle` 组件很有处。\n\
    \n### 你的 JSX 无处不在——第二部分\n\n在“再次遇见 JSX”（第 7 章）中，我们了解到 `JSX` 实际上可以存在于函数之外，并可以作为值赋值给变量或属性。例如，我们可以大胆地这样做：\n\
    \n```javascript\nvar theCircle = <Circle bgColor=\"#F9C240\"/>\nReactDOM.render(\n\
    \  <div>\n    {theCircle}\n  </div>,\n  destination\n);\n```\n\n`theCircle` 变量存储了实例化\
    \ `Circle` 组件的 `JSX`。在 `ReactDOM.render` 函数中计算该变量会导致圆圈显示。最终结果与我们之前的没有区别，但将我们的\
    \ `Circle` 组件实例化从 `render` 方法的束缚中释放出来，为我们提供了更多酷的选择。\n\n例如，你可以进一步创建一个返回 `Circle`\
    \ 组件的函数：\n\n```javascript\nfunction showCircle() {\n  var colors = [\"#393E41\"\
    , \"#E94F37\", \"#1C89BF\", \"#A1D363\"];\n  var ran = Math.floor(Math.random()\
    \ * colors.length);\n  // 返回一个随机颜色的 Circle\n  return <Circle bgColor={colors[ran]}/>\n\
    }\n```\n\n在这种情况下，`showCircle` 函数返回一个 `Circle` 组件（无聊！），其 `bgColor` 属性的值设置为随机颜色值（太棒了！）。为了让我们的示例使用\
    \ `showCircle` 函数，你只需要在 `ReactDOM.render` 内部对其求即可：\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    {showCircle()}\n  </div>,\n  destination\n);\n```\n\n"
- fmt: "\nAs long as the expression you are evaluating returns JSX, you can put pretty\
    \ much anything you want inside the `{` and `}` curly brackets. That flexibility\
    \ is really nice, because there are a lot of things you can do when your JavaScript\
    \ lives outside of the `render` function. A LOT OF THINGS!\n\n### Dealing with\
    \ Arrays in the Context of JSX\n\nNow we are going to get to some fun stuff! When\
    \ you are displaying multiple components, you won’t always be able to manually\
    \ specify them:\n\n```javascript\nReactDOM.render(\n  <div>\n    {showCircle()}\n\
    \    {showCircle()}\n    {showCircle()}\n  </div>,\n  destination\n);\n```\n\n\
    In many real-world scenarios, the number of components you display will be related\
    \ to the number of items in an array or array-like (aka iterator) object you are\
    \ working with. That brings along a few simple complications. For example, let’s\
    \ say that we have an array called `colors` that looks as follows:\n\n[Click here\
    \ to view code image](#part0035.xhtml_p103pro01)\n\n```javascript\nvar colors\
    \ = [\"#393E41\", \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n               \"#85FFC7\"\
    , \"#297373\", \"#FF8552\", \"#A40E4C\"];\n```\n\nWhat we want to do is create\
    \ a `Circle` component for each item in this array (and set the `bgColor` prop\
    \ to the value of each array item). The way we are going to do this is by creating\
    \ an array of `Circle` components:\n\n[Click here to view code image](#part0035.xhtml_p103pro02)\n\
    \n```javascript\nvar colors = [\"#393E41\", \"#E94F37\", \"#1C89BF\", \"#A1D363\"\
    ,\n               \"#85FFC7\", \"#297373\", \"#FF8552\", \"#A40E4C\"];\n\nvar\
    \ renderData = [];\n\nfor (var i = 0; i < colors.length; i++) {\n  renderData.push(<Circle\
    \ bgColor={colors[i]}/>);\n}\n```\n\nIn this snippet, we populate our `renderData`\
    \ array with `Circle` components just like we originally set out to do. So far\
    \ so good. To display all of these components, React makes it very simple. Take\
    \ a look at the highlighted line for all you have to do:\n\n[Click here to view\
    \ code image](#part0035.xhtml_p104pro01)\n\n```javascript\nvar colors = [\"#393E41\"\
    , \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n               \"#85FFC7\", \"#297373\"\
    , \"#FF8552\", \"#A40E4C\"];\n\nvar renderData = [];\n\nfor (var i = 0; i < colors.length;\
    \ i++) {\n  renderData.push(<Circle bgColor={colors[i]}/>);\n}\n\nReactDOM.render(\n\
    \  <div>\n    {renderData}\n  </div>,\n  destination\n);\n```\n\nIn our `render`\
    \ method, all we do is specify our `renderData` array as an expression that we\
    \ need to evaluate. We don’t need to take any other step to go from an array of\
    \ components to seeing something that looks like [Figure 9-2](#part0016.xhtml_ch09fig02)\
    \ when you preview in your browser.\n\n![Image](Images/image0027.jpeg)\n\nFigure\
    \ 9-2 What you should see in your browser.\n\nOk, while our example seems to work,\
    \ we aren’t done yet! There is actually one more thing we need to do, and this\
    \ is a subtle one. The way React makes UI updates really fast is by having a good\
    \ idea of what exactly is going on in your DOM. It does this in several ways,\
    \ but one really noticeable way is by internally marking each element with some\
    \ sort of an identifier. This “marking” happens automatically when you explicitly\
    \ specify elements in your JSX.\n\nWhen you create elements dynamically (such\
    \ as what we are doing with our array of `Circle` components), these identifiers\
    \ are not automatically set. We need to do some extra work. That extra work takes\
    \ the form of a `key` prop whose value React uses to uniquely identify each particular\
    \ component.\n\nFor our example, we can do something like this:\n\n[Click here\
    \ to view code image](#part0035.xhtml_p105pro01)\n\n```javascript\nfor (var i\
    \ = 0; i < colors.length; i++) {\n  var color = colors[i];\n  renderData.push(<Circle\
    \ key={i + color} bgColor={color}/>);\n}\n```\n\nOn each component, we specify\
    \ our `key` prop and set its value to a combination of color and index position\
    \ inside the `colors` array. This ensures that each component we dynamically create\
    \ ends up getting a unique identifier that React can then use.\n"
  raw: 'As long as the expression you are evaluating returns JSX, you can put pretty
    much anything you want inside the { and } curly brackets. That flexibility is
    really nice, because there are a lot of things you can do when your JavaScript
    lives outside of the `render` function. A LOT OF THINGS!


    ### Dealing with Arrays in the Context of JSX


    Now we are going to get to some fun stuff! When you are displaying multiple components,
    you won’t always be able to manually specify them:


    ReactDOM.render(


      <div>


        {showCircle()}


        {showCircle()}


        {showCircle()}


      </div>,


      destination


    );


    In many real-world scenarios, the number of components you display will be related
    to the number of items in an array or array-like (aka iterator) object you are
    working with. That brings along a few simple complications. For example, let’s
    say that we have an array called `colors` that looks as follows:


    [Click here to view code image](#part0035.xhtml_p103pro01)


    var colors = ["#393E41", "#E94F37", "#1C89BF", "#A1D363",


                  "#85FFC7", "#297373", "#FF8552", "#A40E4C"];


    What we want to do is create a `Circle` component for each item in this array
    (and set the `bgColor` prop to the value of each array item). The way we are going
    to do this is by creating an array of `Circle` components:


    [Click here to view code image](#part0035.xhtml_p103pro02)


    var colors = ["#393E41", "#E94F37", "#1C89BF", "#A1D363",


                  "#85FFC7", "#297373", "#FF8552", "#A40E4C"];


    var renderData = [];                              


    for (var i = 0; i < colors.length; i++) {         


      renderData.push(<Circle bgColor={colors[i]}/>); 


    }                                                 


    In this snippet, we populate our `renderData` array with `Circle` components just
    like we originally set out to do. So far so good. To display all of these components,
    React makes it very simple. Take a look at the highlighted line for all you have
    to do:


    [Click here to view code image](#part0035.xhtml_p104pro01)


    var colors = ["#393E41", "#E94F37", "#1C89BF", "#A1D363",


                  "#85FFC7", "#297373", "#FF8552", "#A40E4C"];


    var renderData = [];


    for (var i = 0; i < colors.length; i++) {


      renderData.push(<Circle bgColor={colors[i]}/>);


    }


    ReactDOM.render(


      <div>


        {renderData} 


      </div>,


      destination


    );


    In our `render` method, all we do is specify our `renderData` array as an expression
    that we need to evaluate. We don’t need to take any other step to go from an array
    of components to seeing something that looks like [Figure 9-2](#part0016.xhtml_ch09fig02)
    when you preview in your browser.


    ![Image](Images/image00272.jpeg)


    Figure 9-2 What you should see in your browser.


    Ok, while our example seems to work, we aren’t done yet! There is actually one
    more thing we need to do, and this is a subtle one. The way React makes UI updates
    really fast is by having a good idea of what exactly is going on in your DOM.
    It does this in several ways, but one really noticeable way is by internally marking
    each element with some sort of an identifier. This “marking” happens automatically
    when you explicitly specify elements in your JSX.


    When you create elements dynamically (such as what we are doing with our array
    of `Circle` components), these identifiers are not automatically set. We need
    to do some extra work. That extra work takes the form of a `key` prop whose value
    React uses to uniquely identify each particular component.


    For our example, we can do something like this:


    [Click here to view code image](#part0035.xhtml_p105pro01)


    for (var i = 0; i < colors.length; i++) {


      var color = colors[i];                                      


      renderData.push(<Circle key={i + color} bgColor={color}/>); 


    }


    On each component, we specify our `key` prop and set its value to a combination
    of color and index position inside the `colors` array. This ensures that each
    component we dynamically create ends up getting a unique identifier that React
    can then use to optimize any future UI updates. Now, we could just use the index
    position as the identifier, but if you have multiple blocks of code where you
    are dynamically generating elements, you may get multiple elements with duplicate
    index values.


    * * *


    Check Your Console Yo!


    React is really good at telling you when you might be doing something wrong. For
    example, if you dynamically create elements or components and don’t specify a
    `key` prop on them, you will be greeted with the following warning in your console:


    ***Warning: Each child in an array or iterator should have a unique “key” prop.
    Check the top-level render call using <div>.***


    When you are working with React, it is a good idea to periodically check your
    console for any messages it may have. Even if things seem to be working just fine,
    you’ll never know what you might find :P


    * * *


    ### Conclusion


    All the tips and tricks you’ve seen in this article are made possibly because
    of one thing: *JSX is JavaScript*. This is what enables you to have your JSX live
    wherever JavaScript thrives. To us, it looks like we are doing something absolutely
    bizarre when we specify something like this:


    [Click here to view code image](#part0035.xhtml_p105pro02)


    for (var i = 0; i < colors.length; i++) {


      var color = colors[i];


      renderData.push(<Circle key={i + color} bgColor={color}/>);


    }


    Even though we are pushing pieces of JSX to an array, just like magic, everything
    works in the end when `renderData` is evaluated inside our `render` method. I
    hate to sound like a broken record, but this is because what our browser ultimately
    sees looks like this:


    [Click here to view code image](#part0035.xhtml_p106pro01)


    for (var i = 0; i < colors.length; i++) {


      var color = colors[i];


      renderData.push(React.createElement(Circle,


        {


          key: i + color,


          bgColor: color


        }));


    }


    When our JSX gets converted into pure JS, everything makes sense again. This is
    what allows us to get away with putting our JSX in all sorts of uncomfortable
    (yet photogenic!) situations with our data and still get the end result we want!
    Because, in the end, it’s all just JavaScript.


    ## 10. Working with Events


    So far, most of our examples only did their work on page load. As you probably
    guessed, that isn’t normal. In most apps, especially the kind of UI-heavy ones
    we will be building, there is going to be a ton of things the app does only as
    a reaction to something. That *something* could be triggered by a mouse click,
    a key press, window resize, or a whole bunch of other gestures and interactions.
    The glue that makes all of this possible is something known as **events**.


    Now, you probably know all about events from your experience using them in the
    DOM world. (If you don’t, then I suggest getting a quick refresher first: [https://www.kirupa.com/html5/javascript_events.htm](https://www.kirupa.com/html5/javascript_events.htm).)
    The way React deals with events is a bit different, and these differences can
    surprise you in various ways if you aren’t paying close attention. Don’t worry.
    That’s why you have this book! We start off with a few simple examples and then
    gradually look at increasingly more bizarre, complex, and (yes!) boring things.


    ### Listening and Reacting to Events


    The easiest way to learn about events in React is to actually use them, and that’s
    exactly what we are going to do! To help with this, we have a simple example made
    up of a counter that increments each time you click on a button. Initially, our
    example will look like [Figure 10-1](#part0017.xhtml_ch10fig01).


    ![Image](Images/image00273.jpeg)


    Figure 10-1 Our example.


    Each time you click on the plus button, the counter value will increase by 1\.
    After clicking the plus button a bunch of times, it will look sorta like [Figure
    10-2](#part0017.xhtml_ch10fig02).


    ![Image](Images/image00274.jpeg)


    Figure 10-2 After clicking the plus button a bunch of times (23?).'
