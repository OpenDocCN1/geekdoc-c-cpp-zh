    \ `webpack` 和 `Babel` 都是以 Node 包的形式存在，我们需要像安装 React 相关的包一样安装它们。\n\n要安装 `webpack`，请在终端（Terminal）或命令提示符（Command\
    \ Prompt）中输入内容：\n\n```bash\nnpm install webpack --save\n```\n\n需要几秒钟的时间，`webpack`\
    \ 包（及其大量的依赖项）将被下载并放置到我们的 `node_modules` 文件夹中。完成后，我们需要添加一个配置文件来指定 `webpack` 如何与我们当前的项目协作。使用你的代码编辑器，在\
    \ `MyTotallyAwesomeApp` 文件夹内部创建一个名为 `webpack.config.js` 的文件（参见图 15-13）。\n\n![Image](img/image0031.jpeg)\n\
    \n图 15-13 添加 webpack.config.js。\n\n在该文件中，我们将指定一系列 JavaScript 属性来定义我们的原始未修改源文件的存放位置，以及最终源文件的输出位置。请将以下\
    \ JavaScript 代码添加到 `webpack.config.js`：\n\n```javascript\nvar webpack = require(\"\
