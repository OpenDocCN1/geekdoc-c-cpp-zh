    When programmatically setting styles, it’s a pain to deal with numbers that need
    a pixel value suffix. In order to generate these values, you need to do some string
    concatenation on your number to add a *px*. To convert from a pixel value back
    to a number, you need to parse out the *px*. All of this isn’t extremely complicated
    or time consuming, but it is a distraction.


    To help with this, React allows you to omit the *px* suffix for a bunch of CSS
    properties. If you recall, our `letterStyle` object looks as follows:


    [Click here to view code image](#part0030.xhtml_p045pro01)


     1  var letterStyle = {


     2    padding: 10,


     3    margin: 10,


     4    backgroundColor: "#ffde00",


     5    color: "#333",


     6    display: "inline-block",


     7    fontFamily: "monospace",


     8    fontSize: "32",


     9    textAlign: "center"


    10  };=


    Notice that for some of the properties with a numerical value such as `padding`,
    `margin`, and `fontSize`, we didn’t specify the *px* suffix at all. That is because,
    at runtime, React will add the *px* suffix automatically.


    The only number-related properties React won’t add a pixel suffix to automatically
    are the following properties: `animationIterationCount`, `boxFlex`, `boxFlexGroup`,
    `boxOrdinalGroup`, `columnCount`, `fillOpacity`, `flex`, `flexGrow`, `flexPositive`,
    `flexShrink`, `flexNegative`, `flexOrder`, `fontWeight`, `lineClamp`, `lineHeight`,
    `opacity`, `order`, `orphans`, `stopOpacity`, `strokeDashoffset`, `strokeOpacity`,
    `strokeWidth`, `tabSize`, `widows`, `zIndex`, and `zoom`. While I wish I could
    tell you that I walk around with this information memorized, I actually just referred
    to this article: [https://facebook.github.io/react/tips/style-props-value-px.html](https://facebook.github.io/react/tips/style-props-value-px.html)
    Please hold your applause :P


    While pixel values are great for many things, you may want to use percentages,
    ems, vh, etc. to represent your values. For these non-pixel values, you still
    have to manually ensure the suffix is dealt with. React won’t help you out there,
    so if you aren’t a fan of pixel values, this nicety doesn’t gain you much.


    #### Making the Background Color Customizable


    The last thing we are going to do before we wrap things up is take advantage of
    how React works with styles. By having our styles defined in the same vicinity
    as the JSX, we can make the various style values easily customizable by the parent
    (aka the consumer of the component). Let’s see this in action.


    Right now, all of our vowels have a yellow background. Wouldn’t it be cool if
    we could specify the background color as part of each `Letter` declaration? To
    do this, in our `ReactDOM.render` method, first add a `bgcolor` attribute and
    specify some colors as shown in the following highlighted lines:


    [Click here to view code image](#part0030.xhtml_p046pro01)


    ReactDOM.render(


      <div>


        <Letter bgcolor="#58B3FF">A</Letter> 


        <Letter bgcolor="#FF605F">E</Letter> 


        <Letter bgcolor="#FFD52E">I</Letter> 


        <Letter bgcolor="#49DD8E">O</Letter> 


        <Letter bgcolor="#AE99FF">U</Letter> 


      </div>,


      destination


    );


    Next, we need to use this property. In our `letterStyle` object, set the value
    of `backgroundColor` to `this.props.bgColor`:


    [Click here to view code image](#part0030.xhtml_p046pro02)


     1  var letterStyle = {


     2    padding: 10,


     3    margin: 10,


     4    backgroundColor: this.props.bgcolor, 


     5    color: "#333",


     6    display: "inline-block",


     7    fontFamily: "monospace",


     8    fontSize: "32",


     9    textAlign: "center"


    10  };


    This will ensure that the `backgroundColor` value is inferred from what we set
    via the `bgColor` attribute as part of the `Letter` declaration. If you preview
    this in your browser, you will now see our same vowels sporting some totally sweet
    background colors as shown in [Figure 4-5](#part0011.xhtml_ch04fig05).


    ![Image](Images/image00248.jpeg)


    Figure 4-5 Our vowels with background colors!


    What we’ve just done is something that is going to be very hard to replicate using
    plain CSS. Now, as we start to look at components whose contents change based
    on state or user interaction, you’ll see more such examples where the React way
    of styling things has a lot of good merit.


    ### Conclusion


    As we dive in further and learn more about React, you’ll see several more cases
    where React does things quite differently than what we’ve been told is the correct
    way of doing things on the web. In this tutorial, we saw React promoting inline
    styles in JavaScript as a way to style content as opposed to using CSS style rules.
    Earlier, we looked at JSX and how the entirety of your UI can be declared in JavaScript
    using an XML-like syntax that sorta kinda looks like HTML.


    In all of these cases, if you look deeper beneath the surface, the reasons for
    why React diverges from conventional wisdom makes a lot of sense. Building apps
    with their very complex UI requirements requires a new way of solving the challenges
    associated with complex UIs. HTML, CSS, and JavaScript techniques that probably
    made a lot of sense when dealing with web pages and documents may not be applicable
    in the web app world where components are re-used inside other components.


    With that said, you should pick and choose the techniques that make the most sense
    for your situation. While I am biased towards React’s way of solving our UI development
    problems, I’ll do my best to highlight alternate or conventional methods as well.
    Tying that back to what we saw here, using CSS style rules with your React content
    is totally OK as long as you make the decision knowing the things you gain as
    well as lose by doing so.


    ## 5. Creating Complex Components


    In [Chapter 3](#part0010.xhtml_ch03), you learned about components and all the
    awesome things that they do. You learned that components are the primary ways
    through which React enables our visual elements to behave like little reusable
    bricks that contain all of the HTML, JavaScript, and styling needed to run themselves.
    Beyond reusability, there is another major advantage components bring to the table.
    They make possible **composability**. You can combine components to create more
    complex components.


    In this chapter, we look at what all of this means. More specifically, we look
    at two things:


    ![Image](Images/image00226.jpeg) The boring technical stuff that you need to know.


    ![Image](Images/image00226.jpeg) The boring stuff you need to know about how to
    identify components when you look at a bunch of visual elements.


    OK, what you are going to learn isn’t actually *that* boring. I am just setting
    your expectations really low :P


    ### From Visuals to Components


    The various examples we’ve looked at so far have been pretty basic. They were
    great for highlighting technical concepts (see [Figure 5-1](#part0012.xhtml_ch05fig01)),
    but they weren’t great for preparing you for the real world.


    ![Image](Images/image00249.jpeg)


    Figure 5-1 Great for highlighting technical concepts, but...'
