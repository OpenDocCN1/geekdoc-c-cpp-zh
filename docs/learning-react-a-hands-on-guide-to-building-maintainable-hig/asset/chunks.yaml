    be modular, compact, and self-contained. React extends that well-established idea
    to how we should think about user interfaces as well. Many of React’s core APIs
    make it easier to create smaller visual components that can later be combined
    with other visual components to make larger and more complex visual components—kind
    of like Russian Matryoshka dolls (see [Figure 1-9](#part0008.xhtml_ch01fig09)).


    ![Image](Images/image00235.jpeg)


    Figure 1-9 Russian Matryoshka dolls by Gnomz007.


    Source: *[https://commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg](https://commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg)*


    This is one of the major ways React simplifies (and changes) how we think about
    building the visuals for our web apps.


    #### Visuals Defined Entirely in JavaScript


    While this sounds ridiculously crazy and outrageous, hear me out. Besides using
    a really weird syntax, HTML templates traditionally suffered from another major
    problem. The variety of things you can do inside them other than simply displaying
    data is limited. If you wanted to choose which piece of UI to display based on
    a particular condition, for example, you had to write JavaScript somewhere else
    in your app or use some weird framework-specific templating command to make it
    work.


    For example, here is what a conditional statement inside an EmberJS template looks
    like:


    [Click here to view code image](#part0027.xhtml_p010pro01)


    {{#if person}}


      Welcome back, <b>{{person.firstName}} {{person.lastName}}</b>!


    {{else}}


      Please log in.


    {{/if}}


    What React does is pretty neat. By having your UI defined entirely in JavaScript,
    you get to use all of the rich functionality JavaScript provides for doing all
    sorts of things inside your templates (as you will see in a few chapters). You
    are limited only by what JavaScript supports as opposed to any limitations imposed
    by your templating framework.


    Now, when you think of visuals defined entirely in JavaScript, you are probably
    thinking something horrible involving quotation marks, escape characters, and
    a whole lot of `createElement` calls. Don’t worry. React gives you the option
    to specify your visuals using an HTML-like syntax known as **JSX** that lives
    fully alongside your JavaScript. Instead of writing code to define your UI, you
    are basically specifying markup:


    ReactDOM.render(


      <div>                   


        <h1>Batman</h1>       


        <h1>Iron Man</h1>     


        <h1>Nicolas Cage</h1> 


        <h1>Mega Man</h1>     


      </div>,                 


      destination


    );


    This same code defined in JavaScript would look like this:


    [Click here to view code image](#part0027.xhtml_p010pro02)


    ReactDOM.render(React.createElement(


      "div",


      null,


      React.createElement(


        "h1",


        null,


        "Batman"


      ),


      React.createElement(


        "h1",


        null,


        "Iron Man"


      ),


      React.createElement(


        "h1",


        null,


        "Nicolas Cage"


      ),


      React.createElement(


        "h1",


        null,


        "Mega Man"


      )


    ), destination);


    Yikes! By using JSX, you are able to define your visuals very easily using a syntax
    that is very familiar, while still getting all the power and flexibility that
    JavaScript provides. Best of all, in React, your visuals and JavaScript often
    live in the same location. You no longer have to jump between multiple files to
    define the look and behavior of one visual component. This is templating done
    right.


    #### Just the V in an MVC Architecture


    We are almost done here! React is not a full-fledged framework that has an opinion
    on how everything in your app should behave. Instead, React works primarily in
    the View layer where all of its worries and concerns revolve around your visual
    elements and keeping them up to date. This means you are free to use whatever
    you want for the M and C part of your MVC architecture. This flexibility enables
    you to pick and choose what technologies you are familiar with, and this makes
    React useful not only for new web apps you create but also for existing apps you’d
    like to enhance without removing and refactoring a whole bunch of code.


    ### Conclusion


    As new web frameworks and libraries go, React is quite the runaway success. It
    not only deals with the most common problems developers faced when building single-page
    apps, it throws in a few additional tricks that make building the visuals for
    your single-page apps much MUCH easier. Since it came out in 2013, React has steadily
    found its way into popular web sites and apps that you probably use. Besides Facebook
    and Instagram, some of the notable ones include the BBC, Khan Academy, PayPal,
    Reddit, The New York Times, Yahoo, and many more: [https://github.com/facebook/react/wiki/Sites-Using-React](https://github.com/facebook/react/wiki/Sites-Using-React)


    The intent of this chapter is to provide you with an introduction to what React
    does and why it does it. In tutorials in subsequent chapters we’ll dive deeper
    into everything you’ve seen here and cover the technical details that will help
    you successfully use React in your own projects. Stick around.


    ## 2. Building Your First React App


    By now, thanks to the previous chapter, you probably know all about the backstory
    of React and how it helps even your most complex user interfaces sing performantly.
    For all the awesomeness that React brings to the table, getting started with it
    (kinda like this sentence) is not the most straightforward thing. It has a steep
    learning curve filled with many small and big hurdles:


    ![Image](Images/image00236.jpeg)


    In this chapter, we start at the very beginning and get our hands dirty by building
    a simple React app. We encounter some of these hurdles head-on, and some of these
    hurdles we skip over—for now. By the end of this chapter, not only will we have
    built something you can proudly show off to your friends and family, we’ll have
    set ourselves up nicely for diving deeper into all that React offers in future
    chapters.


    ### Dealing with JSX


    Before we start building our app, there is an important thing we should cover
    first. React isn’t like many JavaScript libraries you may have used. It isn’t
    very happy when you simply refer to code you’ve written for it using a script
    tag. React is annoyingly special that way, and it has to do with how React apps
    are built.


    As you know, your web apps (and everything else your browser displays) are made
    up of HTML, CSS, and JavaScript:


    ![Image](Images/image00237.jpeg)


    It doesn’t matter if your web app was written using React or some other library
    like Angular, Knockout, or jQuery. *The end result* has to be some combination
    of HTML, CSS, and JavaScript. Otherwise, your browser really won’t know what to
    do.


    Now, here is where the special nature of React comes in. *Besides normal HTML,
    CSS, and JavaScript, the bulk of your React code will be written in something
    known as JSX*. JSX, as I mentioned in [Chapter 1](#part0008.xhtml_ch01), is a
    language that allows you to easily mix JavaScript and HTML-like tags to define
    user interface (UI) elements and their functionality. That sounds cool and all
    (and we will see JSX in action in just a few moments), but there is a slight problem.
    Your browser has no idea what to do with JSX.


    To build a web app using React, we need a way to take our JSX and convert it into
    plain old JavaScript that your browser can understand.


    If we didn’t do this, our React app simply wouldn’t work. That’s not cool. Fortunately,
    there are two solutions to this:


    ![Image](Images/image00226.jpeg) **Set up a development environment around Node
    and a handful of build-tools.** In this environment, every time you perform a
    build, all of your JSX is automatically converted into JS and placed on disk for
    you to reference like any plain JavaScript file.'
