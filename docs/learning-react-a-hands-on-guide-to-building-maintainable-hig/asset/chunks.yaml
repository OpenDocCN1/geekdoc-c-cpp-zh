    \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>React! React!\
    \ React!</title>\n  <script src=\"https://fb.me/react-15.1.0.js\"></script>\n\
    \  <script src=\"https://fb.me/react-dom-15.1.0.js\"></script>\n  <script src=\"\
    https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"></script>\n\
    \  <style>\n    #container {\n      padding: 50px;\n      background-color: #EEE;\n\
    \    }\n    #container h1 {\n      font-size: 144px;\n      font-family: sans-serif;\n\
    \      color: #0080a8;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"\
