    \n### 安装和初始化 Node.js\n\n我们的下一步是安装 Node.js。访问 Node.js 网站 ([`nodejs.org/`](https://nodejs.org/))\
    \ 来安装适用于你操作系统的版本（参见图 15-7）。\n\n![Image](img/image00307.jpeg)\n\n图 15-7 Node.js\
    \ 网站上的下载按钮。\n\n我倾向于总是安装最新版本，所以你也应该这样做。下载和安装过程并不特别有趣。一旦安装了 Node.js，启动终端（Mac）、命令提示符（Windows）或选择的相应工具，输入以下内容并按回车以测试它是否真的已安装：\n\
    \n```bash\nnode -v\n```\n\n如果一切运行正常，你将看到一个版本号，它通常对应于你刚刚安装的 Node.js 版本。由于由于原因遇到错误，请遵循此处列出的故障排除步骤\
    \ ([`github.com/npm/npm/wiki/Troubleshooting`](https://github.com/npm/npm/wiki/Troubleshooting))。\n\
    \n接下来，我们将在 `MyTotallyAwesomeApp` 文件夹上初始化 Node.js。要做到这一点，首先使用终端或命令提示符导航到 `MyTotallyAwesomeApp`\
    \ 文件夹。在 OS X 上，它看起来像图 15-8 。\n\n![Image](img/image00308.jpeg)\n\n图 15-8 导航到 MyTotallyAwesomeApp\
    \ 文件夹。\n\n现在，输入以下内容来初始化 Node.js：\n\n```bash\nnpm init\n```\n\n这将启动一系列问题，帮助在我们的项目中设置\
    \ Node.js。第一个问题将要求你指定项目名称。按回车键将允许你指定已经为你选好的默认值。这很好，但默认名称是我们的项目文件夹，即 `MyTotallyAwesomeApp`。如果你按了回车，因为它包含大写字母，它将抛出错误（参见图\
    \ 15-9）。\n\n![Image](img/image00309.jpeg)\n\n图 15-9 我们的项目文件夹名称包含大写字母，触发了错误。\n\n\
    继续输入名称的小写版本 `mytotallyawesomeapp`。完成后，按回车。对于剩下的问题，只需按回车接受所有默认值。这一切的最终是一个名为 `package.json`\
    \ 的新文件，它将在你的 `MyTotallyAwesomeApp` 文件夹中创建（参见图 15-10）。\n\n![Image](img/image00310.jpeg)\n\
    \n图 15-10 package.json 文件出现在了你的文件夹中。\n\n如果你在代码编辑器中打开 `package.json` 的内容，你将看到类似下面的的内容：\n\
    \n点击此处查看代码图像\n\n```json\n{\n  \"name\": \"mytotallyawesomeapp\",\n  \"version\"\
    : \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\"\
    : {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n\
    \  \"author\": \"\",\n  \"license\": \"ISC\"\n}\n```\n\n不要太担心这个文件的内容，只需知道调用 `npm\
    \ init` 的结果之一是创建了一个 `package.json` 文件，其中包含一些特殊的属性和值，Node.js 完全知道如何处理它们。\n\n###\
    \ 安装 React 依赖\n\n我们接下来要做的是安装 React 依赖，这样我们就可以在代码中使用 React 和 React DOM 库。如果你来自纯\
    \ Web 开发背景，这听起来会很奇怪。请在这里听我说。\n\n在你的终端或命令提示符中，输入以下内容安装我们的 React 依赖：\n\n点击此处查看代码图像\n\
    \n```bash\nnpm install react react-dom --save\n```\n\n一旦你按下回车，屏幕上会显示很多奇怪的东西。你可能还会看到许多警告，但它们应该是可以忽略的。正在发生的是\
    \ React 和 React-DOM 库（以及它们依赖的内容）正在从这里巨大的 Node.js 软件包仓库中下载：[`www.npmjs.com/`](https://www.npmjs.com/)\n\
    \n如果你查看你的 `MyTotallyAwesomeApp` 文件夹，你会看到一个名为 `node_modules` 的文件夹。在该文件夹内部，你会看到许多各种模块（即\
    \ Node.js 所说的，而我们凡人称为库）。让我们更新对当前文件/文件夹结构的可视化，使其看起来像图 15-11 。\n\n![Image](img/image00311.jpeg)\n\
    \n图 15-11 更新后的结构。\n\n你看到的 `node_modules` 文件夹只是开始。\n\n### 添加 JSX 文件\n\n事情变得变得有趣了。现在我们已经告诉\
    \ Node.js 我们对 React 的兴趣，我们离构建应用又近了一步。我们将进入第 3 章 中的示例。\n\n在我们的 `dev` 文件夹中，使用代码编辑器创建一个名为\
    \ `index.jsx` 的文件，内容如下：\n\n点击此处查看代码图像\n\n```javascript\nimport React from \"react\"\
    ;\nimport ReactDOM from \"react-dom\";\n\nvar HelloWorld = React.createClass({\n\
    \  render: function() {\n    return (\n      <p>Hello, {this.props.greetTarget}!</p>\n\
    \    );\n  }\n});\n\nReactDOM.render(\n  <div\n    <HelloWorld greetTarget=\"\
    Batman\"/>\n    <HelloWorld greetTarget=\"Iron Man\"/>\n    <HelloWorld greetTarget=\"\
    Nicolas Cage\"/>\n    <HelloWorld greetTarget=\"Mega Man\"/>\n    <HelloWorld\
    \ greetTarget=\"Bono\"/>\n    <HelloWorld greetTarget=\"Catwoman\"/>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\n注意，我们添加的 JSX 大部分与之前没有区别。唯一的区别是，以前将\
    \ React 和 React DOM 库引入我们应用的脚本引用现在被替换为指向我们刚刚添加的 `react` 和 `react-dom` Node.js\
    \ 软件包的 `import` 语句：\n\n```javascript\nimport React from \"react\";\nimport ReactDOM\
    \ from \"react-dom\";\n```\n\n现在，你可能急切好奇什么时候可以构建应用并在浏览器中运行它。嗯，还有最后几个步骤要完成。图 15-12\
    \ 显示了我们项目当前的可视化状态。\n\n![Image](img/image00312.jpeg)\n\n图 15-12 当前项目。\n\n我们的 `index.html`\
    \ 文件正在寻找 `myCode.js` 文件的代码，而该文件仍然不存在。我们添加了 JSX 文件，但我们知道浏览器并如何处理 JSX。我们需要从 `dev`\
    \ 文件夹中的 `index.jsx` 转换为 `output` 文件夹中的 `myCode.js`。\n\n"
- fmt: "\n# Going from JSX to JavaScript\n\nThe missing step right now is turning\
    \ our JSX into JavaScript that our browser can understand. This involves both\
    \ `webpack` and `Babel`, and we are going to configure both of them to make this\
    \ all work.\n\n## Setting up webpack\n\nSince we are in Node.js territory and\
    \ both `webpack` and `Babel` exist as Node packages, we need to install them both\
    \ just like we installed the React-related packages.\n\nTo install `webpack`,\
    \ enter the following in your Terminal / Command Prompt:\n\n```bash\nnpm install\
    \ webpack --save\n```\n\nThis will take a few moments while the `webpack` package\
    \ (and its large list of dependencies) gets downloaded and placed into our `node_modules`\
    \ folder. After you’ve done this, we need to add a configuration file to specify\
    \ how `webpack` will work with our current project. Using your code editor, add\
    \ a file called `webpack.config.js` inside our `MyTotallyAwesomeApp` folder (see\
    \ [Figure 15-13](#part0022.xhtml_ch15fig13)).\n\n![Image](Images/image0031.jpeg)\n\
    \nFigure 15-13 Adding webpack.config.js.\n\nInside this file, we will specify\
    \ a bunch of JavaScript properties to define where our original, unmodified source\
    \ files live and where to output the final source files. Go ahead and add the\
    \ following JavaScript into `webpack.config.js`:\n\n```javascript\nvar webpack\
    \ = require(\"webpack\");\nvar path = require(\"path\");\nvar DEV = path.resolve(__dirname,\
    \ \"dev\");\nvar OUTPUT = path.resolve(__dirname, \"output\");\nvar config = {\n\
    \  entry: DEV + \"/index.jsx\",\n  output: {\n    path: OUTPUT,\n    filename:\
    \ \"myCode.js\"\n  }\n};\n\nmodule.exports = config;\n```\n\nTake a few moments\
    \ to see what this code is doing. We defined two variables called `DEV` and `OUTPUT`\
    \ that refer to folders of the same name in our project. Inside the `config` object,\
    \ we have two properties called `entry` and `output` that use our `DEV` and `OUTPUT`\
    \ variables to help map our `index.jsx` file to become `myCode.js`.\n\n## Setting\
    \ up Babel\n\nThe last piece in our current setup is to transform our `index.jsx`\
    \ file to become regular JavaScript in the form of `myCode.js`. This is where\
    \ Babel comes in. To install Babel, let’s go back to our trusty Terminal / Command\
    \ Prompt and enter the following Node.js command:\n\n```bash\nnpm install babel-loader\
    \ babel-preset-es2015 babel-preset-react --save\n```\n\nWith this command, we\
    \ install the `babel-loader`, `babel-preset-es2015`, and `babel-preset-react`\
    \ packages. Now we need to configure Babel to work with our project. This is a\
    \ two-step process.\n\nThe first step is to specify which Babel presets we want\
    \ to use. There are several ways of doing this, but my preferred way is to modify\
    \ `package.json` and add the following highlighted content:\n\n```json\n{\n  \"\
    name\": \"mytotallyawesomeapp\",\n  \"version\": \"1.0.0\",\n  \"description\"\
    : \"\",\n  \"main\": \"index.js\",\n  \"scripts\": {\n    \"test\": \"echo \\\"\
    Error: no test specified\\\" && exit 1\"\n  },\n  \"author\": \"\",\n  \"license\"\
    : \"ISC\",\n  \"dependencies\": {\n    \"babel-loader\": \"^6.2.4\",\n    \"babel-preset-es2015\"\
    : \"^6.9.0\",\n    \"babel-preset-react\": \"^6.5.0\",\n    \"react\": \"^15.1.0\"\
    ,\n    \"react-dom\": \"^15.1.0\",\n    \"webpack\": \"^1.13.1\"\n  },\n  \"babel\"\
    : {\n    \"presets\": [\n      \"es2015\",\n      \"react\"\n    ]\n  }\n}\n```\n\
    \nIn the highlighted lines, we specify our `babel` object and specify the `es2015`\
    \ and `react` preset values.\n\nThe second step is to tell webpack about Babel.\
    \ In our `webpack.config.js` file, go ahead and add the following highlighted\
    \ lines:\n\n```javascript\nvar webpack = require(\"webpack\");\nvar path = require(\"\
    path\");\nvar DEV = path.resolve(__dirname, \"Dev\");\nvar OUTPUT = path.resolve(__dirname,\
    \ \"output\");\nvar config = {\n  entry: DEV + \"/index.jsx\",\n  output: {\n\
    \    path: OUTPUT,\n    filename: \"myCode.js\"\n  },\n  module: {\n    loaders:\
    \ [{\n      include: DEV,\n      loader: \"babel\",\n    }]\n  }\n};\n\nmodule.exports\
    \ = config;\n```\n\n### Building and Testing Our\n\nThe last piece in our current\
    \ setup is to transform our `index.jsx` file to become regular JavaScript in the\
    \ form of `myCode.js`. This is where Babel comes in. To install Babel, let’s go\
    \ back to our trusty Terminal / Command Prompt and enter the following Node.js\
    \ command:\n\n```bash\nnpm install babel-loader babel-preset-es2015 babel-preset-react\
    \ --save\n```\n\nWith this command, we install the `babel-loader`, `babel-preset-es2015`,\
    \ and `babel-preset-react` packages. Now we need to configure Babel to work with\
    \ our project. This is a two-step process.\n\nThe first step is to specify which\
    \ Babel presets we want to use. There are several ways of doing this, but my preferred\
    \ way is to modify `package.json` and add the following highlighted content:\n\
    \nIn the highlighted lines, we specify our `babel` object and specify the `es2015`\
    \ and `react` preset values.\n\nThe second step is to tell webpack about Babel.\
    \ In our `webpack.config.js` file, go ahead and add the following highlighted\
    \ lines:\n\n### Conclusion\n\nWell...that just happened! In the preceding many\
    \ sections, we’ve followed a bunch of bizarre and incomprehensible steps to get\
    \ our build environment setup. What we’ve seen is just a very small part of everything\
    \ you can do when you put Node, Babel, and webpack together. The unfortunate thing\
    \ is that covering all of that goes well beyond the scope of learning React, but\
    \ if you are interested, we defined two variables called `DEV` and `OUTPUT` that\
    \ refer to folders of the same name in our project. Inside the `config` object,\
    \ we have two properties called `entry` and `output` that use our `DEV` and `OUTPUT`\
    \ variables to help map our `index.jsx` file to become `myCode.js`.\n\n## 16.\
    \ The End\n\nSo...here we are. After 15 chapters, we’ve covered a lot of ground\
    \ when it comes to learning how to use React to build cool things. A while ago,\
