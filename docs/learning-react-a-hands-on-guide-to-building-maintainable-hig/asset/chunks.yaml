    \ again, you will see our lightning counter example in all its cyan-colored glory.\
    \ While you are at it, take a moment to look through the code to ensure you don’t\
    \ see too many surprises.\n\n### Conclusion\n\nWe just scratched the surface on\
    \ what we can do to create stateful components. While using a `timer` to update\
    \ something in our `state` object is cool, the real action happens when we start\
    \ combining user interaction with state. So far, we’ve shied away from the large\
    \ amount of mouse, touch, keyboard, and other related things that your components\
    \ will come into contact with. In an upcoming chapter, we are going to fix that.\
    \ Along the way, you’ll see us taking what we’ve seen about states to a whole\
    \ new level! If that doesn’t excite you, then I don’t know what will :P\n\n##\
    \ 9. Going from Data to UI\n\nWhen you are building your apps, thinking in terms\
    \ of `props`, `state`, `components`, `JSX` tags, `render` methods, and other React-isms\
    \ may be the last thing on your mind. Most of the time, you are dealing with data\
    \ in the form of `JSON` objects, arrays, and other data structures that have no\
    \ knowledge (or interest) in React or anything. Bridging the gulf between your\
    \ data and what you see can be frustrating! Not worry, though. This chapter helps\
    \ reduce some those frustrating moments by running through some scenarios you’ll\
    \ encounter!\n\n### Example\n\nTo make sense of everything you are about to see,\
    \ we are going to need an example. It’s nothing too complicated, so go ahead and\
    \ create a new HTML document and throw the following into it:\n\n```html\n<!DOCTYPE\
