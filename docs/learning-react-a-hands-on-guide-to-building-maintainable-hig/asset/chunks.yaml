    `Square` and `Label` components. That is an odd thing to do—which may or may not
    have been done deliberately for dramatic effect, but fixing it is straightforward.
    It just involves us specifying a property name and accessing it via `this.props`.
    We’ve seen all this before. What is different is the number of times we will have
    to do this.


    There is no way to ***properly*** specify a property on a parent component and
    have all descendants automatically gain access to that property. There are many
    ***improper*** ways to deal with this such as defining global objects, setting
    the value on a component property directly, and so on. We won’t concern ourselves
    with such improper solutions right now. We aren’t animals!


    Anyway, the proper way to pass a property value to a child component is to have
    each intermediate parent component pass on the property as well. To see this in
    action, take a look at the highlighted changes to our current code where we move
    away from a hard-coded color and define our card’s color using a `color` property
    instead:


    [Click here to view code image](#part0031.xhtml_p063pro01)


