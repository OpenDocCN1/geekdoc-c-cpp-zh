- fmt: "\nIt just pushes the `LightningCounterDisplay` component into our container\
    \ `div` element in our DOM. That’s pretty much it. The end result is that you\
    \ see the combination of markup from our `ReactDOM.render` method and the `LightningCounterDisplay`\
    \ and `LightningCounter` components.\n\n## Getting Our Counter On\n\nNow that\
    \ we have an idea of what we are starting with, it’s time to make plans for our\
    \ next steps. The way our counter works is pretty simple. We are going to be using\
    \ a `setInterval` function that calls some code every 1000 milliseconds (aka 1\
    \ second). That “some code” is going to increment a value by 100 each time it\
    \ is called. Seems pretty straightforward, right?\n\nTo make this all work, we\
    \ are going to be relying on three APIs that our React Component exposes:\n\n\
    ![Image](Images/image00226.jpeg) `getInitialState`—This method runs just before\
    \ your component gets mounted, and it allows you to modify a component’s `state`\
    \ object.\n\n![Image](Images/image00226.jpeg) `componentDidMount`—This method\
    \ gets called just after our component gets rendered (or mounted as React calls\
    \ it).\n\n![Image](Images/image00226.jpeg) `setState`—This method allows you to\
    \ update the value of the `state` object.\n\nWe’ll see these APIs in use shortly,\
    \ but I wanted to give you a preview of them so that you can spot them easily\
    \ in a lineup!\n\n### Setting the Initial State Value\n\nWe need a variable to\
    \ act as our counter, and let’s call this variable `strikes`. There are a bunch\
    \ of ways to create this variable. The most obvious one is the following:\n\n\
    ```javascriptvar strikes = 0 // :P\n```\n\nWe don’t want to do that, though. For\
    \ our example, the `strikes` variable is part of our component’s state, and its\
    \ value is what we display on screen. What we are going to do is use the `getInitialState`\
    \ method that we briefly saw a few moments ago and take care of initializing our\
    \ variable inside it. You’ll see in a few moments what result that has on our\
    \ component’s state.\n\nInside your `LightningCounter` component, add the following\
