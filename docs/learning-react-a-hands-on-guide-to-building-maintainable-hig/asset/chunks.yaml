    \n点击此处查看代码图片\n\n```javascript\nvar TodoItems = React.createClass({\n  render:\
    \ function() {\n\n  }\n});\n```\n\n现在看起来什么都没有发生，但这没关系。\n\n接下来，我们要做的是在 `TodoList`\
    \ 组件的 `render` 方法内部调用这个组件。不仅如此，我们还要指定一个 prop（属性），并把我们 `TodoList` 组件的 state（状态）对象传递进去，该对象包含了我们的\
    \ `items` 数组。完成所有这些操作非常简单，所以请在你的 `TodoList` 组件的 `render` 方法中添加以下高亮的的行：\n\n点击此处查看代码图片\n\
    \n```javascript\nrender: function() {\n  return (\n    <div className=\"todoListMain\"\
    >\n      <div className=\"header\">\n        <form onSubmit={this.addItem}>\n\
    \          <input ref={(a) => this._inputElement = a}\n                 placeholder=\"\
    enter task\">\n          </input>\n          <button type=\"submit\">add</button>\n\
    \        </form>\n      </div>\n      <TodoItems entries={this.state.items}/>\
    \ \n    </div>\n  );\n}\n```\n\n我们在这里所做的只是实例化我们的 `TodoItems` 组件，并将我们的 `items`\
    \ state 属性传递给一个名为 `entries` 的 prop。到目前为止，如果你在浏览器中运行我们的应用，不会发生任何可见的交互。我们的 `TodoItems`\
    \ 组件已经准备好进行渲染，并且它可以访问所有已提交的任务。唯一的问题是它并没有对所有这些内容做任何处理，但我们将在下一文中修复这个问题。\n\n回到我们的\
    \ `TodoItems` 组件，我们要做的第一件事是创建一个新变量来存储传递进来的任务数组。为了做到，请添加以下高亮的行：\n\n点击此处查看代码图片\n\
    \n```javascript\nvar TodoItems = React.createClass({\n  render: function() {\n\
    \    var todoEntries = this.props.entries; \n  }\n});\n```\n\n我们刚刚添加了一个名为 `todoEntries`\
    \ 的变量，它存储了基于 `TodoList` 组件的 `this.state.items` 传递的 `entries` prop 的值。太了！现在，我们的\
    \ `todoEntries` 变量存储了一个包含许多对象的数组，每个对象存储一个任务和一个键（key）。剩下的就是创建用于显示我们数据的 HTML 元素。\n\
    \n在实现这一目标的第一步，添加以下高亮的代码行来创建 `li` 元素：\n\n点击此处查看代码图片\n\n```javascript\nvar TodoItems\
    \ = React.createClass({\n  render: function() {\n    var todoEntries = this.props.entries;\n\
    \    var listItems = todoEntries.map(createTasks); \n  }\n});\n```\n\n我们正在使用 `map`\
    \ 函数来遍历 `todoEntries` 中的每一个项，并调用 `createTasks` 函数为每个条目创建一个列表元素：\n\n点击此处查看代码图片\n\
    \n```javascript\nfunction createTasks(item) {\n  return <li key={item.key}>{item.text}</li>\n\
    }\n```\n\n为了重申我们之前的一个观点，由于这些列表元素是动态创建的，我们需要通过指定 `key` 属性并给每个元素一个唯一的值来帮助 React\
    \ 跟踪它们。在存储任务时我们已经解决了这个问题部分，正如你记得的那样：\n\n点击此处查看代码图片\n\n```javascript\nitemArray.push({\n\
    \  text: this._inputElement.value,\n  key: Date.now()\n});\n```\n\n由于我们之前的规划，我们现在通过为\
    \ `key` 属性赋值 `todoEntries` 数组中每个项已包含的 `item.key` 值，从而享受了省便的待遇。我们列表元素的可见内容仅仅是由\
    \ `item.text` 存储的文本值。对于我们如何使用该值，不需要额外的操作。感觉非常清爽，不是吗？\n\n将这一切整合在一起，，这个列表元素集合被我们的\
    \ `listItems` 变量完全处理并存储。到目前为止，剩下的就是将数组内部列表元素转换为渲染在屏幕上的列表元素。为了实现这一点，请添加以下高亮的行：\n\
    \n点击此处查看代码图片\n\n```javascript\nvar TodoItems = React.createClass({\n  render:\
    \ function() {\n    var todoEntries = this.props.entries;\n    function createTasks(item)\
    \ {\n      return <li key={item.key}>{item.text}</li>\n    }\n    var listItems\
    \ = todoEntries.map(createTasks);\n    return (\n      <ul className=\"theList\"\
    >\n        {listItems}\n      </ul>\n    );\n  }\n});\n```\n\n我们正在返回一个 `ul` 元素，其内容是\
    \ `listItems` 存储的列表元素。在你添加此内容之后，保存你的文档并预览你的应用。你会看到类似于图 14-7 的内容，在输入任务后。\n\n我们正在做的是返回一个\
    \ `ul` 元素，其内容是 `listItems` 存储的列表元素。在你添加此内容之后，保存你的文档并预览你的应用。你会看到类似于图 14-7 的内容，在输入任务后。\n\
    \n我们的应用工作了！你提交的任务都显示在自己的列表项中。\n\n### 添加收尾\n\n我们几乎要完成了！首先，我们现在的样子和开始时并不一样。我们的任务列表看起来有点单调，但可以通过\
    \ CSS 来修复。在你的 `style` 块中，在你现有样式所在的地方添加以下样式规则：\n\n点击此处查看代码图片\n\n```css\n.todoList\
    \ .theList {\n  list-style: none;\n  padding-left: 0;\n  width: 255px;\n}\n\n\
    .todoList .theList li {\n  color: #333;\n  background-color: rgba(255,255,255,.5);\n\
    \  padding: 15px;\n  margin-bottom: 15px;\n  border-radius: 5px;\n}\n```\n\n如果你现在预览应用，你会看到输入的任务正如你预期的那样：\n\
    \n![图片](img/image030.jpeg)\n\n接下来，你有没有注意到在提交表单后，你在输入框输入的内容消失？你必须在每次提交任务后手动清除字段……像动物一样！这很烦人，但修复它的方法非常简单。在我们的\
    \ `TodoList` 组件的 `addItem` 方法中，添加以下行：\n\n点击此处查看代码图片\n\n```javascript\naddItem:\
    \ function(e) {\n  var itemArray = this.state.items;\n  itemArray.push({\n   \
    \ text: this._inputElement.value,\n    key: Date.now()\n  });\n  this.setState({\n\
    \    items: itemArray\n  });\n  this._inputElement.value = \"\";\n  e.preventDefault();\n\
    }\n```\n\n我们在这里所做的是在提交表单并调用 `addItem` 方法时，清空 `input` 元素的 `value` 属性。\n\n### 总结\n\
    \n我们的 Todo 应用功能非常简单，但通过从零构建，我们涵盖了 React 提供的几乎每一个小细节。更重要的是，我们创建了一个示例，展示了单独学习的各种概念是如何协同工作的。这实际上才是重要的细节。现在，这里有一个留给你的问题：我们在本章中所做的这一切你都理解吗？\n\
    \n如果我们在本章中所做的这一切你都理解，那么你就可以向你的朋友家人宣布你已经即将掌握 React 了！如果你对某些领域感到困惑，我建议你回去阅读解决你困惑的章节。\n\
    \n"
