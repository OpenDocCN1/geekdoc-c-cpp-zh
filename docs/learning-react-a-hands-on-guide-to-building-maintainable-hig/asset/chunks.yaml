  trans: "\n\n就像编程中的其他一切一样，保持内容的模块化、紧凑和自包含是一个极好的主意。React 将这一成熟的理念扩展到了我们思考用户界面的方式上。React\
    \ 的许多核心 API 使得创建较小的视觉组件变得更加容易，这些组件随后可以与其他视觉组件组合，形成更大、更复杂的视觉组件——就像俄罗斯套娃一样（请参见图\
    \ 1-9）。\n\n![Image](img/image0235.jpeg)\n\n图 1-9 由 Gnomz007 绘制的俄罗斯套娃。\n\n来源：*[`commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg`](https://commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg)*\n\
    \n这是 React 简化（并改变）我们构建 Web 应用视觉效果方式的主要方法之一。\n\n## 完全由 JavaScript 定义视觉效果\n\n虽然这听起来非常荒谬且离谱，但请听我解释。除了使用一种非常奇怪的语法外，HTML\
    \ 模板传统上还存在另一个主要问题：除了简单显示数据外，在它们内部可以执行的操作非常有限。如果你想根据特定条件来选择显示哪个 UI 组件（例如），你必须在应用的其他地方编写\
    \ JavaScript，或者使用某些奇怪的特定框架模板命令来使其工作。\n\n例如，这里是 EmberJS 模板内部的条件语句样式：\n\n点击此处查看代码图像\n\
    \n```html\n{{#if person}}\n\n  Welcome back, <b>{{person.firstName}} {{person.lastName}}</b>!\n\
    \n{{else}}\n\n  Please log in.\n\n{{/if}}\n```\n\nReact 的做法非常精妙。通过将你的 UI 完全定义在\
    \ JavaScript 中，你可以利用 JavaScript 提供的所有丰富功能，在模板内部执行各种操作（你将在接下来的几个章节中看到这些）。你所受的限制仅限于\
    \ `JavaScript` 支持的内容，而不是受到你的模板框架所施加的任何限制。\n\n现在，当你考虑到完全由 JavaScript 定义的视觉效果时，你可能会想到某些涉及引号、转义字符和大量\
    \ `createElement` 调用的糟糕代码。别担心。React 为你提供了使用名为 `JSX` 的类 HTML 语法来指定视觉效果的选项，这种语法完全与你的\
    \ JavaScript 并存。你与其编写代码来定义你的 UI，你基本上是在指定标记：\n\n```javascript\nReactDOM.render(\n\
    \n  <div>                        \n\n     <h1>Batman</h1>        \n\n     <h1>Iron\
    \ Man</h1>      \n\n     <h1>Nicolas Cage</h1> \n\n     <h1>Mega Man</h1>    \
    \  \n\n  </div>,             \n\n  destination\n);\n```\n\n在 JavaScript 中定义的相同代码看起来是这样：\n\
    \n点击此处查看代码图像\n\n```javascript\nReactDOM.render(React.createElement(\n  \"div\"\
    ,\n  null,\n  React.createElement(\n    \"h1\",\n    null,\n    \"Batman\"\n \
    \ ),\n  React.createElement(\n    \"h1\",\n    null,\n    \"Iron Man\"\n  ),\n\
    \  React.createElement(\n    \"h1\",\n    null,\n    \"Nicolas Cage\"\n  ),\n\
    \  React.createElement(\n    \"h1\",\n    null,\n    \"Mega Man\"\n  )\n), destination);\n\
    ```\n\n哎呀！通过使用 `JSX`，你能够使用非常熟悉的语法非常轻松地定义视觉效果，同时仍然获得 `JavaScript` 提供的所有力和灵活性。最棒的是，在\
    \ React 中，你的视觉效果和 JavaScript 往往位于同一个位置。你不再需要在多个文件之间跳跃来定义一个视觉组件的外观和行为。这才是正确的模板化。\n\
    \n## MVC 架构中的 V\n\n我们快要完成了！React 并不是一个对应用中所有内容应该如何行为都有意见的完整框架。相反，React 主要在 `View`（视图）层工作，它的所有关注点和考虑都围绕着你的视觉元素并保持它们更新。这意味着你可以自由使用任何想要的东西来实现\
    \ `MVC` 架构中的 `M`（模型）和 `C`（控制器）部分。这种灵活性让你能够选择你熟悉的技术，这使得 React 不仅对你创建的新 Web 应用有用，对现有的应用同样有用。\n\
    \n## 2. 构建你的第一个应用\n\n到目前，多亏于上一章，你可能已经了解了 `React` 以及它是如何提供帮助的。在本章中，我们将从头开始，通过构建一个简单的应用来亲手实践。我们将正面对这些障碍中的一些，并跳过其中的一些。到本章结束时，我们不仅构建了一个你可以向朋友展示的东西，我们还为深入探索\
    \ `React` 提供的所有功能做了良好的准备。\n\n### 处理 JSX\n\n在我们开始构建应用之前，有一件重要的事情我们应该首先涵盖。`React`\
    \ 与你使用过的许多 JavaScript 库不同。当你仅仅使用 `<script>` 标签引用为它编写的代码时，它并不高兴。`React` 在这方面烦人地特殊，这与\
    \ `React` 应用如何构建有关。\n\n如你所知，你的 Web 应用（以及浏览器显示的所有内容）是由 `HTML`、`CSS` 和 `JavaScript`\
    \ 组成的：\n\n![Image](img/image0236.jpeg)\n\n无论你的 Web 应用是用 `React` 还是其他库（如 `Angular`、`Knockout`\
    \ 或 `jQuery`）编写的，结果必须是 `HTML`、`CSS` 和 `JavaScript` 的组合。否则，你的浏览器真的不知道该怎么办。\n\n\
    现在，这就是 `React` 的特殊性所在之处。除了普通的 `HTML`、`CSS` 和 `JavaScript` 之外，你的大部分 `React` 代码将使用被称为\
    \ `JSX` 的语言编写。\n\n为了构建使用 `React` 的 Web 应用，我们需要一种方法将 `JSX` 转换为浏览器可以理解的纯 `JavaScript`。\n\
    \n如果不这样做，我们的 `React` 应用将无法工作。这不妙。幸运的是，这个问题有两个解决方案：\n\n**围绕 Node 和一些构建工具设置开发环境。**\
    \ 在这种环境中，每当你执行一次构建时，所有的 `JSX` 都会自动转换为 `JS` 并放在磁盘上，供你像引用纯 JavaScript 文件一样引用。\n\n"
- fmt: "\n![Image](Images/image00226.jpeg) **Let your browser rely on a JavaScript\
    \ library to automatically convert JSX to something it understands.** You specify\
    \ your JSX directly just like you would any old piece of JavaScript, and your\
    \ browser takes care of the rest.\n\nBoth of these solutions have a place in our\
    \ world, but let’s talk about the impact of each.\n\nThe first solution, while\
    \ a bit complicated and time-consuming at first, is the way modern web development\
    \ is done these days. Besides compiling (transpiling to be more accurate) your\
    \ JSX to `JS`, this approach enables you to take advantage of modules, better\
    \ build tools, and a bunch of other features that make building complex web apps\
    \ somewhat manageable.\n\nThe second solution provides a quick and direct path\
    \ where you initially spend more time writing code and less time fiddling with\
    \ your development environment. To use this solution, all you do is reference\
    \ a script file. This script file takes care of turning the JSX into `JS` on page\
    \ load, and your React app comes to life without you having to do anything special\
    \ to your development environment.\n\nFor our introductory look at React, we are\
    \ going to use the second solution. You may be wondering why we don’t use the\
    \ second solution always. The reason is that your browser takes a performance\
    \ hit each time it spends time translating JSX into `JS`. That is totally acceptable\
    \ when learning how to use React, but that is totally not acceptable when deploying\
    \ your app for real-life use. Because of that un-acceptableness, we will revisit\
    \ all of this and look at the first solution and how to set up your development\
    \ environment later, once you’ve gotten your feet comfortably wet in React.\n\n\
    ### Getting Your React On\n\nIn the previous section, we looked at the two ways\
    \ you have for ensuring your React app ends up as something your browser understands.\
    \ In this section, we are going to put all of those words into practice. First,\
    \ we will need a blank HTML page that will act as our starting point.\n\nIf you\
    \ don’t have a blank HTML page handy, feel free to use the following:\n\n[Click\
    \ here to view code image](#part0028.xhtml_p015pro01)\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>React! React! React!</title>\n</head>\n<body>\n  <script>\n\
    \  </script>\n</body>\n</html>\n```\n\nThis page has nothing interesting or exciting\
    \ going for it, but let’s fix that by adding a reference to the React library.\
    \ Just below the `title`, add these two lines:\n\n[Click here to view code image](#part0028.xhtml_p015pro02)\n\
    \n```html\n<script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n\
    <script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"></script>\n\
    ```\n\nThese two lines bring in both the core React library as well as the various\
    \ things React needs to work with the DOM. Without them, you aren’t building a\
    \ React app at all. Now, we aren’t done yet. There is one more library we need\
    \ to reference. Just below these two `script` tags, add the following line:\n\n\
    [Click here to view code image](#part0028.xhtml_p016pro01)\n\n```html\n<script\
    \ src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n```\n\nWhat we are doing here is adding a reference to the Babel JavaScript\
    \ compiler ([http://babeljs.io/]). Babel does many cool things, but the one we\
    \ care about is its capability to turn JSX into JavaScript.\n\nAt this point,\
    \ our HTML page should look as follows:\n\n[Click here to view code image](#part0028.xhtml_p016pro02)\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>React! React! React!</title>\n\
    \  <script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script\
    \ src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"></script>\n  <script\
    \ src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n</head>\n<body>\n  <script>\n  </script>\n</body>\n</html>\n```\n\n\
    If you preview your page right now, you’ll notice that this page is still blank\
    \ with nothing visible going on. That’s OK. We are going to fix that next.\n\n\
    ### Displaying Your Name\n\nThe first thing we are going to do is use React to\
    \ display our name on screen. The way we do that is by using a method called `render`.\
    \ Inside your `script` tag, add the following:\n\n[Click here to view code image](#part0028.xhtml_p018pro01)\n\
    \n```javascript\nReactDOM.render(\n  <h1>Sherlock Holmes</h1>,\n  document.body\n\
    );\n```\n\nDon’t worry if none of this makes sense at this point. Our goal is\
    \ to get something to display on screen first, and we’ll make sense of what we\
    \ did shortly afterwards. Now, before we preview this in our page to see what\
    \ happens, we need to designate this `script` block as something that Babel can\
    \ do its magic on. The way we do that is by setting the `type` attribute on the\
    \ `script` tag to a value of `text/babel`:\n\n```html\n<script type=\"text/babel\"\
    >\n  ReactDOM.render(\n    <h1>Sherlock Holmes</h1>,\n    document.body\n  );\n\
    </script>\n```\n\nOnce you’ve made that change, now preview what you have in your\
    \ browser. What you’ll see are the words **Sherlock Holmes** printed in giant\
    \ letters. Congratulations! You just built an app using React.\n\nAs apps go,\
    \ this isn’t all that exciting. Chances are your name isn’t even Sherlock Holmes.\
    \ While this app doesn’t have much going for it, it does introduce you to one\
    \ of the most frequently used methods you’ll use in the React universe—the `ReactDOM.render`\
    \ method.\n\nThe `render` method takes two arguments:\n\n![Image](Images/image00226.jpeg)\
    \ The HTML-like elements (aka JSX) you wish to output\n\n![Image](Images/image00226.jpeg)\
    \ The location in the DOM that React will render the JSX into\n\nHere is what\
    \ our render method looks like:\n\n```javascript\nReactDOM.render(\n  <h1>Sherlock\
    \ Holmes</h1>,\n  document.body\n);\n```\n\nOur first argument is the text **Sherlock\
    \ Holmes** wrapped inside some `h1` tags. This HTML-like syntax inside your JavaScript\
    \ is what JSX is all about. While we will spend a lot more time drilling into\
    \ JSX a bit later, I should mention this up front—***It is every bit as crazy\
    \ as it looks*** Whenever I see brackets and slashes in JavaScript, a part of\
    \ me dies on the inside because of all the string escaping and quotation mark\
    \ gibberish I will need to do. With JSX, you do none of that. You just place your\
    \ HTML-like content as-is just like what we’ve done here. Magically (like the\
    \ super-awesome kind involving dragons and laser beams), it all works.\n\nThe\
    \ second argument is `document.body`. There is nothing crazy or bizarre about\
    \ this argument. It simply specifies where the converted markup from the JSX will\
    \ end up living in our DOM. In our example, when the `render` method runs, the\
    \ `h1` tag (and everything inside it) is placed in our document’s `body` element.\n\
    \nNow, the goal of this exercise wasn’t to display *a* name on the screen. It\
    \ was to display *your* name. Go ahead and modify your code to do that. In my\
    \ case, the `render` method will look as follows:\n\n```javascript\nReactDOM.render(\n\
    \  <h1>Batman</h1>,\n  document.body\n);\n```\n\nWell—it would look like that\
    \ if my name was Batman! Anyway, if you preview your page now, you will see your\
    \ name displayed instead of Sherlock Holmes.\n\n### It’s All Still Familiar\n\n\
    While the JavaScript looks new and shiny thanks to JSX, the end result your browser\
    \ sees is nice, clean HTML, CSS, and JavaScript. To see this for yourself, let’s\
    \ make a few alterations to how our app behaves and looks.\n\n#### Changing the\
    \ Destination\n\nThe first thing we’ll do is change where our JSX gets output.\
    \ Using JavaScript to place things directly in your `body` element is never a\
    \ good idea. A lot can go wrong—especially if you are going to be mixing React\
    \ with other JS libraries and frameworks. The recommended path is to create a\
    \ separate element that you will treat as a new root element. This element will\
    \ serve as the destination our `render` method will use. To make this happen,\
    \ go back to the HTML and add a `div` element with an `id` value of `container`.\n\
    \nInstead of showing you the full HTML for this one minor change, here is what\
    \ just our `body` element looks like:\n\n```html\n<body>\n  <div id=\"container\"\
    ></div>\n</body>\n```\n"
  raw: '![Image](Images/image00226.jpeg) **Let your browser rely on a JavaScript library
    to automatically convert JSX to something it understands.** You specify your JSX
    directly just like you would any old piece of JavaScript, and your browser takes
    care of the rest.


    Both of these solutions have a place in our world, but let’s talk about the impact
    of each.


    The first solution, while a bit complicated and time-consuming at first, is *the
    way* modern web development is done these days. Besides compiling (transpiling
    to be more accurate) your JSX to JS, this approach enables you to take advantage
    of modules, better build tools, and a bunch of other features that make building
    complex web apps somewhat manageable.


    The second solution provides a quick and direct path where you initially spend
    more time writing code and less time fiddling with your development environment.
    To use this solution, all you do is reference a script file. This script file
    takes care of turning the JSX into JS on page load, and your React app comes to
    life without you having to do anything special to your development environment.


    For our introductory look at React, we are going to use the second solution. You
    may be wondering why we don’t use the second solution always. The reason is that
    your browser takes a performance hit each time it spends time translating JSX
    into JS. That is totally acceptable when learning how to use React, but that is
    totally not acceptable when deploying your app for real-life use. Because of that
    un-acceptableness, we will revisit all of this and look at the first solution
    and how to set up your development environment later, once you’ve gotten your
    feet comfortably wet in React.


    ### Getting Your React On


    In the previous section, we looked at the two ways you have for ensuring your
    React app ends up as something your browser understands. In this section, we are
    going to put all of those words into practice. First, we will need a blank HTML
    page that will act as our starting point.


    If you don’t have a blank HTML page handy, feel free to use the following:


    [Click here to view code image](#part0028.xhtml_p015pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React! React! React!</title>


    </head>


    <body>


      <script>


      </script>


    </body>


    </html>


    This page has nothing interesting or exciting going for it, but let’s fix that
    by adding a reference to the React library. Just below the `title`, add these
    two lines:


    [Click here to view code image](#part0028.xhtml_p015pro02)


    <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


    <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


    These two lines bring in both the core React library as well as the various things
    React needs to work with the DOM. Without them, you aren’t building a React app
    at all. Now, we aren’t done yet. There is one more library we need to reference.
    Just below these two `script` tags, add the following line:


    [Click here to view code image](#part0028.xhtml_p016pro01)


    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


    What we are doing here is adding a reference to the Babel JavaScript compiler
    ([http://babeljs.io/](http://babeljs.io/)). Babel does many cool things, but the
    one we care about is its capability to turn JSX into JavaScript.


    At this point, our HTML page should look as follows:


    [Click here to view code image](#part0028.xhtml_p016pro02)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React! React! React!</title>


      <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


      <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


    </head>


    <body>


      <script>


      </script>


    </body>


    </html>


    If you preview your page right now, you’ll notice that this page is still blank
    with nothing visible going on. That’s OK. We are going to fix that next.


    ### Displaying Your Name


    The first thing we are going to do is use React to display our name on screen.
    The way we do that is by using a method called `render`. Inside your `script`
    tag, add the following:


    [Click here to view code image](#part0028.xhtml_p018pro01)


    ReactDOM.render(


      <h1>Sherlock Holmes</h1>,


      document.body


    );


    Don’t worry if none of this makes sense at this point. Our goal is to get something
    to display on screen first, and we’ll make sense of what we did shortly afterwards.
    Now, before we preview this in our page to see what happens, we need to designate
    this `script` block as something that Babel can do its magic on. The way we do
    that is by setting the `type` attribute on the `script` tag to a value of `text/babel`:


    <script type="text/babel">


      ReactDOM.render(


        <h1>Sherlock Holmes</h1>,


        document.body


      );


    </script>


    Once you’ve made that change, now preview what you have in your browser. What
    you’ll see are the words **Sherlock Holmes** printed in giant letters. Congratulations!
    You just built an app using React.


    As apps go, this isn’t all that exciting. Chances are your name isn’t even Sherlock
    Holmes. While this app doesn’t have much going for it, it does introduce you to
    one of the most frequently used methods you’ll use in the React universe—the `ReactDOM.render`
    method.


    The `render` method takes two arguments:


    ![Image](Images/image00226.jpeg) The HTML-like elements (aka JSX) you wish to
    output


    ![Image](Images/image00226.jpeg) The location in the DOM that React will render
    the JSX into


    Here is what our render method looks like:


    ReactDOM.render(


      <h1>Sherlock Holmes</h1>,


      document.body


    );


    Our first argument is the text **Sherlock Holmes** wrapped inside some `h1` tags.
    This HTML-like syntax inside your JavaScript is what JSX is all about. While we
    will spend a lot more time drilling into JSX a bit later, I should mention this
    up front—***It is every bit as crazy as it looks***. Whenever I see brackets and
    slashes in JavaScript, a part of me dies on the inside because of all the string
    escaping and quotation mark gibberish I will need to do. With JSX, you do none
    of that. You just place your HTML-like content as-is just like what we’ve done
    here. Magically (like the super-awesome kind involving dragons and laser beams),
    it all works.


    The second argument is `document.body`. There is nothing crazy or bizarre about
    this argument. It simply specifies where the converted markup from the JSX will
    end up living in our DOM. In our example, when the `render` method runs, the `h1`
    tag (and everything inside it) is placed in our document’s `body` element.


    Now, the goal of this exercise wasn’t to display *a* name on the screen. It was
    to display *your* name. Go ahead and modify your code to do that. In my case,
    the `render` method will look as follows:


    ReactDOM.render(


      <h1>Batman</h1>,


      document.body


    );


    Well—it would look like that if my name was Batman! Anyway, if you preview your
    page now, you will see your name displayed instead of Sherlock Holmes.


    ### It’s All Still Familiar


    While the JavaScript looks new and shiny thanks to JSX, the end result your browser
    sees is nice, clean HTML, CSS, and JavaScript. To see this for yourself, let’s
    make a few alterations to how our app behaves and looks.


    #### Changing the Destination


    The first thing we’ll do is change where our JSX gets output. Using JavaScript
    to place things directly in your `body` element is never a good idea. A lot can
    go wrong—especially if you are going to be mixing React with other JS libraries
    and frameworks. The recommended path is to create a separate element that you
    will treat as a new root element. This element will serve as the destination our
    `render` method will use. To make this happen, go back to the HTML and add a `div`
    element with an `id` value of `container`.


    Instead of showing you the full HTML for this one minor change, here is what just
    our `body` element looks like:


    <body>'
