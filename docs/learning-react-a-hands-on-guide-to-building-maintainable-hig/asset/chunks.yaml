  trans: "\n\n此方法在你的组件渲染并放置到 DOM 之后立即调用。此时，你可以安全地执行任何 DOM 查询操作，而无需担心你的组件是否已经加载。如果你有任何依赖于组件已就绪的代码，你也可以在这里指定所有这些代码。\n\
    \n除了 `render` 方法外，所有这些生命周期方法**都只能触发一次**。这与我们接下来要看到的方法非常不同。\n\n## 更新阶段 (The Updating\
    \ Phase)\n\n当组件添加到 DOM 之后，当属性（prop）或状态（state）发生变化时，它们可能会更新并重新渲染。在此期间，会被一组不同的生命周期方法。哈欠。抱歉……\n\
    \n### 处理状态变化\n\n首先，让我们来看看状态变化！当发生状态变化时，我们之前提到过你的组件会再次调用其 `render` 方法。任何依赖此组件输出的组件也会被调用\
    \ `render` 方法。这样做是为了确保我们的组件始终显示其最新版本。这些都是正确的，但这只是所发生情况的部分表示。\n\n当状态变化发生时，图 11-5\
    \ 中的所有生命周期方法都会被调用。\n\n![Image](img/image00281.jpeg)\n\n图 11-5 状态变化发生时调用的生命周期方法。\n\
    \n这些生命周期方法的作用将在后续章节概述。\n\n#### `shouldComponentUpdate`\n\n有时，你不希望组件在发生状态变化时进行更新。此方法允许你控制这种更新行为。如果你使用此方法并返回一个\
    \ `true` 值，组件将更新。如果此方法返回一个 `false` 值，此组件将跳过更新。\n\n这听起来可能有点困惑，这里有一个简单的代码片段：\n\n\
    点击此处查看代码图像\n\n```javascript\nshouldComponentUpdate: function(newProps, newState)\
    \ {\n  if (newState.id <= 2) {\n    console.log(\"Component should update!\");\n\
    \    return true;\n  } else {\n    console.log(\"Component should not update!\"\
    );\n    return false;\n  }\n}\n```\n\n此方法带有两个参数被调用，我们将它们命名为 `newProps` 和 `newState`。我们在这段代码片段中是在检查\
    \ `id` 状态属性的新值是否小于或等于 2。如果该值小于或等于 2，我们返回 `true`，表示此组件应该更新。如果该值不小于等于 2，我们返回 `false`，表示此组件不应该更新。\n\
    \n#### `componentWillUpdate`\n\n此方法在你的组件准备更新之前被调用。这里没有什么特别兴奋的。需要注意的是，你不能通过在此方法中调用\
    \ `this.setState` 来改变你的状态。\n\n#### `render`\n\n如果你没有通过 `shouldComponentUpdate`（通过返回\
    \ `false`）覆盖更新，则 `render` 内部的代码将再次被调用，以确保你的组件能够正确显示。\n\n#### `componentDidUpdate`\n\
    \n此方法在你的组件更新且 `render` 方法被调用之后调用。如果你需要在更新发生后执行任何代码，这就是存放这些代码的地方。\n\n### 处理属性变化\n\
    \n你的组件更新的另一个时间是它在渲染到 DOM 之后其属性值发生了变化。在这种情况下，图 11-6 中的生命周期方法会被调用。\n\n![Image](img/image00282.jpeg)\n\
    \n图 11-6 组件属性值变化时的生命周期方法。\n\n这里唯一的新方法是 `componentWillReceiveProps`。此方法返回一个参数，该参数是一个包含即将赋值给它的新属性值的对象。\n\
    \n我们之前在查看状态变化时已经看过了其余生命周期方法，所以我们就不再重复它们了。在处理属性变化时，它们的行为是相同的。\n\n## 卸载阶段 (The Unmounting\
    \ Phase)\n\n我们将查看的最后一个阶段是你的组件准备被销毁并从 DOM 中移除（参见图 11-7）。\n\n![Image](img/image00283.jpeg)\n\
    \n图 11-7 当你的组件准备被销毁并从 DOM 中移除时，只有一个生命周期方法处于活跃状态。\n\n这里只有一个活跃的生命周期方法，即 `componentWillUnmount`。你可以在这里执行任何清理相关的任务，例如移除事件监听器、停止定时器等。在此方法被后后，你的组件将从\
    \ DOM 中移除，你可以说说****\n\n## 结论\n\n我们的组件是迷人的小东西。在表面上，它们似乎并没有发生什么。就像一部关于海洋的优秀纪录片，当我们看得更深、更近时，它就像是看到了另一个世界。事实证明，React\
    \ 在每当发生有趣的事情时都会不断监控并通知你的组件。这一切都是通过我们在整个教程中一直在观察（极其无聊的）生命周期方法完成的。现在，我想向你保证，知道每个生命周期方法的作用以及它们何时被调用将有一天大有用场。你所学到的一切并非不足道。\n\
    \n## 12. 访问 DOM 元素\n\n有时你可能想要访问 HTML 元素上的属性和方法。在我们这个 JSX 代表一切的 React 世界里，你为什么要想直接处理\
    \ HTML 呢？为了突出这样的情况，请看图 12-1](#part0019.xhtml_ch12fig01) 中的 **Colorizer** 示例。\n\
    \n![Image](img/image00284.jpeg)\n\n图 12-1 Colorizer 示例。\n\n如果你可以访问浏览器，可以在以下位置查看：`https://www.kirupa.com/react/examples/colorizer.htm`\n\
    \n### 12.1. Colorizer 示例\n\n**Colorizer** 根据你提供的任何颜色为（当前的）白色正方形上色。为了看到它的效果，在文本框内输入一个颜色值并点击按钮。如果你不知道输入什么颜色，**yellow**\
    \ 是一个很好的选择！一旦你提供了颜色并提交了它，白色正方形将变成你提供的颜色（参见图 12-2](#part0019.xhtml_ch12fig02)）。\n\
    \n![Image](img/image00285.jpeg)\n\n图 12-2 白色正方形变成了黄色。\n\n提交任何有效的颜色值时正方形都会改变颜色，这很棒，但并不是我想让你关注的。相反，请在提交值后注意文本框和按钮。注意按钮获得了焦点，而你刚刚提交的颜色值仍然显示在表单中。如果你想输入另一个颜色值，你需要显式地将焦点返回文本框并清除当前存在的任何值。呃！这似乎没有必要，而且从可用性的角度来看，我们可以做得更好！\n\
    \n现在，如果我们可以在提交颜色后立即清除现有的颜色值并将焦点返回文本框，那不是太好了吗？这意味着如果我们提交了 **purple** 的颜色值，我们之后看到的将看起来像图\
    \ 12-3](#part0019.xhtml_ch12fig03)。\n\n![Image](img/image00286.jpeg)\n\n图 12-3\
    \ 我们得到了紫色，并且文本框准备好输入下一种颜色。\n\n"
- fmt: "\nThe entered value of `purple` is cleared, and the focus is returned to the\
    \ text field. This allows us to enter additional color values and submit them\
    \ easily without having to manually keep jumping focus back and forth between\
    \ the text field and the button. Isn’t that much nicer?\n\nGetting this behavior\
    \ right using JSX and traditional React techniques is hard. We aren’t even going\
    \ to bother with explaining how to go about that. Getting this behavior right\
    \ by dealing with the JavaScript DOM API on various HTML elements directly is\
    \ pretty easy. Guess what we are going to do? In the following sections, we use\
    \ something known as `refs` that React provides to help us access the DOM API\
    \ on HTML elements. This chapter sounds really REALLY boring, but it is going\
    \ to be a fun one—I’m mostly sure of it.\n\n### Meet Refs\n\nAs you know very\
    \ well by now, inside our various `render` methods, we’ve been writing HTML-like\
    \ things known as JSX. Our JSX is simply a description of what the DOM should\
    \ look like. It doesn’t represent actual HTML—despite looking a whole lot like\
    \ it. Anyway, to provide a bridge between JSX and the final HTML elements in the\
    \ DOM, React provides us with something funnily known as `refs` (short for *references*).\n\
    \nThe way refs work is a little odd. The easiest way to make sense of it is to\
    \ look at an example. Let’s say we have a `render` method from our `Colorizer`\
    \ example that looks as follows:\n\n[Click here to view code image](#part0038.xhtml_p138pro01)\n\
    \n```javascript\nrender: function() {\n  var squareStyle = {\n    backgroundColor:\
    \ this.state.bgColor\n  };\n  return (\n    <div className=\"colorArea\">\n  \
