    \ (aka what Node.js calls what we mere mortals just call libraries). Let’s update\
    \ our visualization of our current file/folder structure to look like [Figure\
    \ 15-11](#part0022.xhtml_ch15fig11).\n\n![Image](Images/image00311.jpeg)\n\nFigure\
    \ 15-11 The updated structure.\n\nThe `node_modules` folder you see right now\
    \ is just the beginning.\n\n### Adding our JSX File\n\nThings are about to get\
    \ interesting. Now that we’ve told Node.js all about our interest in React, we\
