    \ 0px #666)\",\n      filter: \"drop-shadow(0px 0px #666)\"\n    };\n    return\
    \ (\n      <div style={cardStyle}>\n      </div>\n    );\n  }\n});\n```\n\n虽然这看起来有很多变化，但大部分代码都是通过\
    \ `cardStyle` 对象为我们的 `Card` 组件的输出进行样式设置。在对象内部，请注意我们指定了带有厂商前缀的 `filter` 属性版本 `WebkitFilter`。那并不是有趣的细节。有趣的细节在于大小写。首字母不是驼驼峰命名为\
    \ `webkitFilter`，而是 `W` 实际上是大大写的。这并不是普通 CSS 属性的表示方式，如果你以后需要指定厂商前缀的属性，请记住这一点。\n\
    \n其余的更改是格式化的。我们返回了一个 `div` 元素，该元素的 `style` 属性被设置为我们的 `cardStyle` 对象。现在，为了看到我们的\
    \ `Card` 组件运行，我们需要在 `ReactDOM.render` 函数中将其显示在 DOM 中。为了实现这一点，请继续进行以下高亮更改：\n\n\
    点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <div>\n    <Card/>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\n我们所做的只是告诉 `ReactDOM.render`\
    \ 函数通过调用它来渲染我们 `Card` 组件的输出。如果一切运行正常，当你测试你的应用程序时，你将看到与图 5-9 相同的内容。\n\n![Image](img/image00257.jpeg)\n\
    \n图 5-9 你的测试结果——调色板卡的轮廓。\n\n是的，它只是我们调色板卡的轮廓，但这绝对比我们几分钟前的初始状态要多得多！\n\n### Square\
    \ 组件\n\n是时候在组件层次结构向下移动一级，查看我们的 `Square` 组件了。这是一个非常直接的组件，所以请进行以下高亮更改：\n\n点击此处查看代码图片\n\
    \n```javascript\nvar Square = React.createClass({\n  render: function() {\n  \
    \  var squareStyle = {\n      height: 150,\n      backgroundColor: \"#FF663\"\n\
    \    };\n    return(\n      <div style={squareStyle}>\n      </div>\n    );\n\
    \  }\n});\n```\n\n就像我们的 `Card` 组件一样，我们返回了一个 `div` 元素，其 `style` 属性被设置为定义该组件外观的\
    \ `style` 对象。为了看到我们的 `Square` 组件运行，我们需要像处理 `Card` 组件那样将它放入 DOM 中。这次的不同之处在于，我们不会通过\
    \ `ReactDOM.render` 函数调用 `Square` 组件。相反，我们将在 `Card` 组件内部调用 `Square` 组件。为了理解我的意思，回到我们\
    \ `Card` 组件的 `render` 函数，并进行以下更改：\n\n点击此处查看代码图片\n\n```javascript\nvar Card = React.createClass({\n\
    \  render: function() {\n    var cardStyle = {\n      height: 200,\n      width:\
    \ 150,\n      padding: 0,\n      backgroundColor: \"#FFF\",\n      WebkitFilter:\
    \ \"drop-shadow(0px 0px #666)\",\n      filter: \"drop-shadow(0px 0px #666)\"\n\
    \    };\n    return (\n      <div style={cardStyle}>\n        <Square/>\n    \
    \  </div>\n    );\n  }\n});\n```\n\n此时，如果你预览我们的应用程序，你将看到一个彩色正方形的出现（请参见图 5-10）。\n\
    \n![Image](img/image00258.jpeg)\n\n图 5-10 红色部分出现了。\n\n值得注意的酷点是，我们在 `Card` 组件内部调用了\
    \ `Square` 组件！这是**组合性**的例子，一个组件依赖于另一个组件的输出。你看到的最终结果是这两个组件协作的结果。协作不是很美吗——至少在在这种语境下是如此？\n\
    \n### Label 组件\n\n最后一个剩下的组件是我们的 `Label`。请继续进行以下高亮更改：\n\n点击此处查看代码图片\n\n```javascript\n\
    var Label = React.createClass({\n  render: function() {\n    var labelStyle =\
    \ {\n      fontFamily: \"sans-serif\",\n      fontWeight: \"bold\",\n      padding:\
    \ 13,\n      margin: 0\n    };\n    return (\n      <p style={labelStyle}>#663</p>\n\
    \    );\n  }\n});\n```\n\n我们现在所操作的模式对你来说应该很常见了。我们有一个 `style` 对象并将其赋值给返回值。我们返回一个\
    \ `p` 元素，其内容为字符串 `#663`。为了最终让它进入我们的 DOM，我们需要通过 `Card` 组件调用 `Label` 组件。请继续进行以下更改：\n\
    \n点击此处查看代码图片\n\n```javascript\nvar Card = React.createClass({\n  render: function()\
    \ {\n    var cardStyle = {\n      height: 200,\n      width: 150,\n      padding:\
    \ 0,\n      backgroundColor: \"#FFF\",\n      WebkitFilter: \"drop-shadow(0px\
    \ 0px #666)\",\n      filter: \"drop-shadow(0px 0px #666)\"\n    };\n    return\
    \ (\n      <div style={cardStyle}>\n        <Square/>\n        <Label/>\n    \
    \  </div>\n    );\n  }\n});\n```\n\n"
- fmt: "\nIn our current example, we hard-coded the color value that is used by our\
    \ `Square` and `Label` components. That is an odd thing to do—which may or may\
    \ not have been done deliberately for dramatic effect, but fixing it is straightforward.\
    \ It just involves us specifying a property name and accessing it via `this.props`.\
    \ We’ve seen all this before. What is different is the number of times we will\
    \ have to do this.\n\nThere is no way to `properly` specify a property on a parent\
    \ component and have all descendants automatically gain access to that property.\
    \ There are many `improper` ways to deal with this such as defining global objects,\
    \ setting the value on a component property directly, and so on. We won’t concern\
    \ ourselves with such improper solutions right now. We aren’t animals!\n\nAnyway,\
    \ the proper way to pass a property value to a child component is to have each\
    \ intermediate parent component pass on the property as well. To see this in action,\
    \ take a look at the highlighted changes to our current code where we move away\
    \ from a hard-coded color and define our card’s color using a `color` property\
    \ instead:\n\n[Click here to view code image](#part0031.xhtml_p063pro01)\n\n```javascript\n\
    var Square = React.createClass({\n  render: function() {\n    var squareStyle\
    \ = {\n      height: 150,\n      backgroundColor: this.props.color \n    };\n\
    \    return(\n      <div style={squareStyle}>\n\n      </div>\n    );\n  }\n});\n\
    \nvar Label = React.createClass({\n  render: function() {\n    var labelStyle\
    \ = {\n      fontFamily: \"sans-serif\",\n      fontWeight: \"bold\",\n      padding:\
    \ 13,\n      margin: 0\n    };\n\n    return (\n      <p style={labelStyle}>{this.props.color}</p>\
    \ \n    );\n  }\n});\n\nvar Card = React.createClass({\n  render: function() {\n\
    \    var cardStyle = {\n      height: 200,\n      width: 150,\n      padding:\
    \ 0,\n      backgroundColor: \"#FFF\",\n      WebkitFilter: \"drop-shadow(0px\
    \ 0px 5px #666)\",\n      filter: \"drop-shadow(0px 0px 5px #666)\"\n    };\n\n\
    \    return (\n      <div style={cardStyle}>\n        <Square color={this.props.color}/>\
    \ \n        <Label color={this.props.color}/>  \n      </div>\n    );\n  }\n});\n\
    \nReactDOM.render(\n  <div>\n    <Card color=\"#FF6663\"/> \n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\nOnce you have made this change, you can specify any\
    \ hex color you want as part of calling the `Card` component:\n\n[Click here to\
    \ view code image](#part0031.xhtml_p064pro01)\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    <Card color=\"#FFA737\"/> \n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\nThe resulting color palette will feature the color you\
    \ specified (see [Figure 5-12](#part0012.xhtml_ch05fig12)).\n\n![Image](Images/image00260.jpeg)\n\
    \nFigure 5-12 The color for hex #FFA737.\n\nNow, let’s go back to the changes\
    \ we made. Even though the `color` property is only consumed by the `Square` and\
    \ `Label` components, the parent `Card` component is responsible for passing the\
    \ property on to them. For even more nested situations, you’ll have more intermediate\
    \ components that will be responsible for transferring properties. It gets worse.\
    \ When you have multiple properties that you would like to pass around multiple\
    \ levels of components, the amount of typing (or copying/pasting) you do increases\
    \ a lot as well. There are ways to mitigate this, and we’ll look at those mitigation\
    \ strategies in greater detail in a future chapter.\n\n### Why Component Composability\n\
    \nWhen we are heads-down in React, we often tend to forgot what we are ultimately\
    \ creating is just plain and boring HTML, CSS, and JavaScript. The generated HTML\
    \ for our color card looks as follows:\n\n[Click here to view code image](#part0031.xhtml_p066pro01)\n\
    \n```html\n<div id=\"container\">\n  <div data-react=\"0\">\n    <div style=\"\
    height:200px; width:150px; padding:0; background-color:#FFF; -webkit-filter:drop-shadow(0px\
    \ 0px 5px #666); filter:drop-shadow(0px 0px 5px #666);\">\n      <div style=\"\
    height:150px; background-color:#FF6663;\"></div>\n      <p style=\"font-family:sans-serif;\
    \ font-weight:bold; padding:13px; margin:0;\">#FF6663</p>\n    </div>\n  </div>\n\
    </div>\n```\n\nThis markup has no idea of how it got there. It doesn’t know which\
