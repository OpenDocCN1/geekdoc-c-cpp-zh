  trans: "\n生命周期方法并不复杂。我们可以将它们看作是增强版的事件处理器，它们会在组件生命周期的各个点被调用。就像事件处理器一样，你可以编写一些代码在这些不同的时间点执行某些操作。在我们继续之前，是你时候快速认识一下我们的生命周期方法了。它们是：\n\
    \n![Image](img/image00226.jpeg) `componentWillMount`\n\n![Image](img/image00226.jpeg)\
    \ `componentDidMount`\n\n![Image](img/image00226.jpeg) `componentWillUnmount`\n\
    \n![Image](img/image00226.jpeg) `componentWillUpdate`\n\n![Image](img/image00226.jpeg)\
    \ `componentDidUpdate`\n\n![Image](img/image00226.jpeg) `shouldComponentUpdate`\n\
    \n![Image](img/image00226.jpeg) `componentWillReceiveProps`\n\n我们还没结束。还有三个方法会被我们加入其中，尽管它们从严格意义来说并不是生命周期方法，它们是：\n\
    \n![Image](img/image00226.jpeg) `getInitialState`\n\n![Image](img/image00226.jpeg)\
    \ `getDefaultProps`\n\n![Image](img/image00226.jpeg) `render`\n\n这些名字中有些你可能听起来很熟悉，有些你可能是第一次见到。别担心。等我们学完这些，你和它们都会变得老如老汤！我们要做的的是从不同的角度来看这些生命周期方法——先从代码开始！\n\
    \n### 观察生命周期方法的运行\n\n学习这些生命周期方法的趣味程度，就像背诵你计划访问的外国地方（或遥远的星系！）的名字没什么两样。为了让这一切变得更容易接受，在我们进入学术化的阶段并阅读它们之前，我将先让你通过一个简单的示例来玩玩它们。\n\
    \n要玩这个示例，请访问以下 URL：[`www.kirupa.com/react/lifecycle_example.htm`](https://www.kirupa.com/react/lifecycle_example.htm)。一旦页面加载完成，你将看到之前见过的计数器示例的变体（参见图\
    \ 11-1）。\n\n![Image](img/image00277.jpeg)\n\n图 11-1 计数器示例的变体。\n\n先不要点击按钮或其他任何。如果你已经点击了按钮，只需刷新页面以从头开始示例。我这么说是有原因的，并不是因为我的强迫症发作了\
    \ :P 我们希望在交互之前看到页面的原始状态！\n\n现在，打开浏览器的开发者工具并查看 `Console`（控制台）标签。在 Chrome 中，你会看到类似于图\
    \ 11-2 的内容。\n\n![Image](img/image00278.jpeg)\n\n图 11-2 Chrome 中的控制台视图。\n\n注意你看到的内容。你会看到一些消息，这些消息以类似于生命周期方法的名字开头。如果你点击一次加号按钮，注意你的\
    \ `Console` 将显示更多的生命周期方法被调用（参见图 11-3）。\n\n![Image](img/image00279.jpeg)\n\n图 11-3\
    \ 被调用的更多生命周期方法。\n\n稍微玩玩这个示例。这个示例的作用是让你在我们之前见过的组件上下文中放置所有这些生命周期方法。随着你不断点击加号按钮，会出现更多的生命周期方法条目。最终，一旦你的计数器接近数值\
    \ 5，你的示例将消失，并在控制台中显示以下条目：`componentWillUnmount: Component is about to be removed\
    \ from the DOM!`。此时，你已经到达了这个示例的末尾。当然，要重新开始，只需刷新页面即可！\n\n现在你已经看了示例，让我们快速看一眼负责这一切的组件：\n\
    \n点击此处查看代码图片\n\n```javascript\nvar CounterParent = React.createClass({\n  getDefaultProps:\
    \ function(){\n    console.log(\"getDefaultProps: Default prop time!\");\n   \
    \ return {};\n  },\n  getInitialState: function() {\n    console.log(\"getInitialState:\
    \ Default state time!\");\n    return {\n      count: 0\n    };\n  },\n  increase:\
    \ function() {\n    this.setState({\n      count: this.state.count + 1\n    });\n\
    \  },\n  componentWillUpdate: function(newProps, newState) {\n    console.log(\"\
    componentWillUpdate: Component is about to update!\");\n  },\n  componentDidUpdate:\
    \ function(currentProps, currentState) {\n    console.log(\"componentDidUpdate:\
    \ Component updated!\");\n  },\n  componentWillMount: function() {\n    console.log(\"\
    componentWillMount: Component is about to mount!\");\n  },\n  componentDidMount:\
    \ function() {\n    console.log(\"componentDidMount: Component mounted!\");\n\
    \  },\n  componentWillUnmount: function() {\n    console.log(\"componentWillUnmount:\
    \ Component is about to be removed from the DOM!\");\n  },\n  shouldComponentUpdate:\
    \ function(newProps, newState) {\n    console.log(\"shouldComponentUpdate: Component\
    \ update?\");\n    if (newState.count < 5) {\n      console.log(\"shouldComponentUpdate:\
    \ Component should update!\");\n      return true;\n    } else {\n      ReactDOM.unmountComponentNode(destination);\n\
    \      console.log(\"shouldComponentUpdate: Component should not update!\");\n\
    \      return false;\n    }\n  },\n  componentWillReceiveProps: function(newProps){\n\
    \    console.log(\"componentWillReceiveProps: Component will get new props!\"\
    );\n  },\n  render: function() {\n    var backgroundStyle = {\n      padding:\
    \ 50,\n      border: \"#333 2px dotted\",\n      width: 250,\n      height: 100,\n\
    \      borderRadius: 10,\n      textAlign: \"center\"\n    };\n    return (\n\
    \      <div style={backgroundStyle}>\n        <Counter display={this.state.count}/>\n\
    \        <button onClick={this.increase}>\n          +\n        </button>\n  \
    \    </div>\n    );\n  }\n});\n```\n\n花点时间看看这段代码的作用。它看起来很长，但大部分只是为每个生命周期方法定义的\
    \ `console.log` 语句。看完这些代码后，再玩一遍示例。相信我，你在示例中花费的时间越多，搞清楚其中的原理就越有乐趣。接下来在渲染、更新和卸载阶段查看每个生命周期方法的部分将会非常无聊。别说我没警告过你。\n\
    \n### 初始渲染阶段\n\n当你的组件开始生命并进入 DOM 时，以下生命周期方法会被调用（参见图 11-4）。\n\n![Image](img/image280.jpeg)\n\
    \n图 11-4 初始调用的生命周期方法。\n\n你在示例加载时在控制台中看到的内容是这里内容的低彩色版本。现在，我们将进一步深入，了解每个生命周期方法的作用。\n\
    \n#### `getDefaultProps`\n\n该方法允许你指定 `this.props` 的默认值。它在组件创建或从父组件传递 props 之前被调用。\n\
    \n#### `getInitialState`\n\n该方法允许你在组件创建之前指定 `this.state` 的默认值。与 `getDefaultProps`\
    \ 一样，它也是在组件创建之前调用的。\n\n#### `componentWillMount`\n\n这是渲染到 DOM 之前最后一个被调用的方法。这里有一点需要注意：如果你在这个方法中调用\
    \ `setState`，你的组件将不会重新渲染（即不会调用 `render` 方法并更新屏幕上显示的内容）。\n\n#### `render`\n\n你现在应该对这个非常熟悉了。每个组件都必须定义这个方法，它负责返回一个根节点（该节点内部可以包含许多子节点）。如果你不想渲染任何内容（为了你可能进行的某种高级优化），只需返回\
    \ `null` 或 `false` 即可。\n"
- fmt: "\nThis method gets called immediately after your component renders and gets\
    \ placed on the DOM. At this point, you can safely perform any DOM querying operations\
    \ without worrying about whether your component has made it or not. If you have\
    \ any code that depends on your component being ready, you can specify all of\
    \ that code here as well.\n\nWith the exception of the `render` method, all of\
    \ these lifecycle methods **can fire only once**. That’s quite different from\
    \ the methods we are about to see next.\n\n## The Updating Phase\n\nAfter your\
    \ components get added to the DOM, they can potentially update and re-render when\
    \ a prop or state change occurs. During this time, a different collection of lifecycle\
    \ methods will get called. Yawn. Sorry...\n\n### Dealing with State Changes\n\n\
    First, let’s look at a state change! When a state change occurs, we mentioned\
    \ earlier that your component will call its `render` method again. Any components\
    \ that rely on the output of this component will also get their `render` methods\
    \ called as well. This is done to ensure that our component is always displaying\
    \ the latest version of itself. All of that is true, but that is only a partial\
    \ representation of what happens.\n\nWhen a state change happens, all the lifecycle\
    \ methods in [Figure 11-5](#part0018.xhtml_ch11fig05) get called.\n\n![Image](Images/image00281.jpeg)\n\
    \nFigure 11-5 Lifecycle methods called when a state change happens.\n\nWhat these\
    \ lifecycle methods do is outlined in the following sections.\n\n#### `shouldComponentUpdate`\n\
    \nSometimes, you don’t want your component to update when a state change occurs.\
    \ This method allows you to control this updating behavior. If you use this method\
    \ and return a `true` value, the component will update. If this method returns\
    \ a `false` value, this component will skip updating.\n\nThat probably sounds\
    \ a little bit confusing, so here is a simple snippet:\n\n[Click here to view\
    \ code image](#part0037.xhtml_p130pro01)\n\n```javascript\nshouldComponentUpdate:\
    \ function(newProps, newState) {\n  if (newState.id <= 2) {\n    console.log(\"\
    Component should update!\");\n    return true;\n  } else {\n    console.log(\"\
    Component should not update!\");\n    return false;\n  }\n}\n```\n\nThis method\
    \ gets called with two arguments which we name `newProps` and `newState`. What\
    \ we are doing in this snippet of code is checking whether the new value of our\
    \ `id` state property is less than or equal to 2. If the value is less than or\
    \ equal to 2, we return `true` to indicate that this component should update.\
    \ If the value is not less than or equal to 2, we return `false` to indicate that\
    \ this component should not update.\n\n#### `componentWillUpdate`\n\nThis method\
    \ gets called just before your component is about to update. Nothing too exciting\
    \ here. One thing to note is that you can’t change your state by calling `this.setState`\
    \ from this method.\n\n#### `render`\n\nIf you didn’t override the update via\
    \ `shouldComponentUpdate` (by returning `false`), the code inside `render` will\
    \ get called again to ensure your component displays itself properly.\n\n####\
    \ `componentDidUpdate`\n\nThis method gets called after your component updates\
    \ and the `render` method has been called. If you need to execute any code after\
    \ the update takes place, this is the place to stash it.\n\n### Dealing with Prop\
    \ Changes\n\nThe other time your component updates is when its prop value changes\
    \ after it has been rendered into the DOM. In this scenario, the lifecycle methods\
    \ in [Figure 11-6](#part0018.xhtml_ch11fig06) get called.\n\n![Image](Images/image00282.jpeg)\n\
    \nFigure 11-6 Lifecycle methods when the component’s prop value changes.\n\nThe\
    \ only method that is new here is `componentWillReceiveProps`. This method returns\
    \ one argument, and this argument is an object that contains the new prop values\
    \ that are about to be assigned to it.\n\nWe saw the rest of the lifecycle methods\
    \ earlier when looking at state changes, so let’s not revisit them again. Their\
    \ behavior is identical when dealing with a prop change.\n\n## The Unmounting\
    \ Phase\n\nThe last phase we are going to look at is when your component is about\
    \ to be destroyed and removed from the DOM (see [Figure 11-7](#part0018.xhtml_ch11fig07)).\n\
    \n![Image](Images/image00283.jpeg)\n\nFigure 11-7 Only one lifecycle method is\
    \ active when your component is about to be destroyed and removed from the DOM.\n\
    \nThere is only one lifecycle method that is active here, and that is `componentWillUnmount`.\
    \ You’ll perform any cleanup-related tasks here such as removing event listeners,\
    \ stopping timers, etc. After this method gets called, your component is removed\
    \ from the DOM and you can say *Bye!* to it.\n\n## Conclusion\n\nOur components\
    \ are fascinating little things. On the surface they seem like they don’t have\
    \ much going on. Like a good documentary about the oceans, when we look a little\
    \ deeper and closer, it’s almost like seeing a whole other world. As it turns\
    \ out, React is constantly watching and notifying your component every time something\
    \ interesting happens. All of this is done via the (extremely boring) lifecycle\
    \ methods that we spent this entire tutorial looking at. Now, I want to reassure\
    \ you that knowing what each lifecycle method does and when it gets called will\
    \ come in handy one day. Everything you’ve learned isn’t just trivial.\n\n## 12.\
    \ Accessing DOM Elements\n\nThere will be times when you want to access properties\
    \ and methods on an HTML element. In our React-colored world where JSX represents\
    \ everything, why would you ever want to deal directly with HTML? To highlight\
    \ one such situation, take a look at the **Colorizer** example in [Figure 12-1](#part0019.xhtml_ch12fig01).\n\
    \n![Image](Images/image00284.jpeg)\n\nFigure 12-1 Colorizer example.\n\nIf you\
    \ have access to a browser, you can view it live at the following location: `https://www.kirupa.com/react/examples/colorizer.htm`\n\
    \n### 12.1. The Colorizer Example\n\nThe **Colorizer** colorizes the (currently)\
    \ white square with whatever color you provide it. To see it in action, enter\
    \ a color value inside the text field and click/tap on the button. If you don’t\
    \ have any idea of what color to enter, **yellow** is a good one! Once you have\
    \ provided a color and submitted it, the white square will turn whatever color\
    \ you provided (see [Figure 12-2](#part0019.xhtml_ch12fig02)).\n\n![Image](Images/image00285.jpeg)\n\
    \nFigure 12-2 The white square turns yellow.\n\nThat the square changes color\
    \ for any valid color value you submit is pretty awesome, but it isn’t what I\
    \ want you to focus on. Instead, pay attention to the text field and the button\
    \ after you submit a value. Notice that the button gets focus, and the color value\
    \ you just submitted is still displayed inside the form. If you want to enter\
    \ another color value, you need to explicitly return focus to the text field and\
    \ clear out whatever current value is present. Eww! That seems unnecessary, and\
    \ we can do better than that from a usability point of view!\n\nNow, wouldn’t\
    \ it be great if we could clear both the existing color value and return focus\
    \ to the text field immediately after you submit a color? That would mean that\
    \ if we submitted a color value of **purple**, what we would see afterwards would\
    \ look like [Figure 12-3](#part0019.xhtml_ch12fig03).\n\n![Image](Images/image00286.jpeg)\n\
    \nFigure 12-3 We get purple and the text field is ready for the next color.\n"
  raw: 'This method gets called immediately after your component renders and gets
    placed on the DOM. At this point, you can safely perform any DOM querying operations
    without worrying about whether your component has made it or not. If you have
    any code that depends on your component being ready, you can specify all of that
    code here as well.


    With the exception of the `render` method, all of these lifecycle methods **can
    fire only once**. That’s quite different from the methods we are about to see
    next.


    #### The Updating Phase


    After your components get added to the DOM, they can potentially update and re-render
    when a prop or state change occurs. During this time, a different collection of
    lifecycle methods will get called. Yawn. Sorry...


    ##### Dealing with State Changes


    First, let’s look at a state change! When a state change occurs, we mentioned
    earlier that your component will call its `render` method again. Any components
    that rely on the output of this component will also get their `render` methods
    called as well. This is done to ensure that our component is always displaying
    the latest version of itself. All of that is true, but that is only a partial
    representation of what happens.


    When a state change happens, all the lifecycle methods in [Figure 11-5](#part0018.xhtml_ch11fig05)
    get called.


    ![Image](Images/image00281.jpeg)


    Figure 11-5 Lifecycle methods called when a state change happens.


    What these lifecycle methods do is outlined in the following sections.


    ###### `shouldComponentUpdate`


    Sometimes, you don’t want your component to update when a state change occurs.
    This method allows you to control this updating behavior. If you use this method
    and return a **true** value, the component will update. If this method returns
    a **false** value, this component will skip updating.


    That probably sounds a little bit confusing, so here is a simple snippet:


    [Click here to view code image](#part0037.xhtml_p130pro01)


    shouldComponentUpdate: function(newProps, newState) {


      if (newState.id <= 2) {


        console.log("Component should update!");


        return true;


      } else {


        console.log("Component should not update!");


        return false;


      }


    }


    This method gets called with two arguments which we name `newProps` and `newState`.
    What we are doing in this snippet of code is checking whether the new value of
    our `id` state property is less than or equal to 2\. If the value is less than
    or equal to 2, we return **true** to indicate that this component should update.
    If the value is not less than or equal to 2, we return **false** to indicate that
    this component should not update.


    ###### `componentWillUpdate`


    This method gets called just before your component is about to update. Nothing
    too exciting here. One thing to note is that you can’t change your state by calling
    `this.setState` from this method.


    ###### `render`


    If you didn’t override the update via `shouldComponentUpdate` (by returning **false**),
    the code inside `render` will get called again to ensure your component displays
    itself properly.


    ###### `componentDidUpdate`


    This method gets called after your component updates and the `render` method has
    been called. If you need to execute any code after the update takes place, this
    is the place to stash it.


    ##### Dealing with Prop Changes


    The other time your component updates is when its prop value changes after it
    has been rendered into the DOM. In this scenario, the lifecycle methods in [Figure
    11-6](#part0018.xhtml_ch11fig06) get called.


    ![Image](Images/image00282.jpeg)


    Figure 11-6 Lifecycle methods when the component’s prop value changes.


    The only method that is new here is `componentWillReceiveProps`. This method returns
    one argument, and this argument is an object that contains the new prop values
    that are about to be assigned to it.


    We saw the rest of the lifecycle methods earlier when looking at state changes,
    so let’s not revisit them again. Their behavior is identical when dealing with
    a prop change.


    #### The Unmounting Phase


    The last phase we are going to look at is when your component is about to be destroyed
    and removed from the DOM (see [Figure 11-7](#part0018.xhtml_ch11fig07)).


    ![Image](Images/image00283.jpeg)


    Figure 11-7 Only one lifecycle method is active when your component is about to
    be destroyed and removed from the DOM.


    There is only one lifecycle method that is active here, and that is `componentWillUnmount`.
    You’ll perform any cleanup-related tasks here such as removing event listeners,
    stopping timers, etc. After this method gets called, your component is removed
    from the DOM and you can say *Bye!* to it.


    ### Conclusion


    Our components are fascinating little things. On the surface they seem like they
    don’t have much going on. Like a good documentary about the oceans, when we look
    a little deeper and closer, it’s almost like seeing a whole other world. As it
    turns out, React is constantly watching and notifying your component every time
    something interesting happens. All of this is done via the (extremely boring)
    lifecycle methods that we spent this entire tutorial looking at. Now, I want to
    reassure you that knowing what each lifecycle method does and when it gets called
    will come in handy one day. Everything you’ve learned isn’t just trivial knowledge,
    though your friends will be impressed if you can describe all of the lifecycle
    methods from memory. Go ahead and try it the next time you see them.


    ## 12. Accessing DOM Elements


    There will be times when you want to access properties and methods on an HTML
    element directly. In our React-colored world where JSX represents everything that
    is good and pure about markup, why would you ever want to deal directly with the
    horribleness that is HTML? As you will find out (if you haven’t already), there
    are many cases where dealing with HTML elements through the JavaScript DOM API
    directly is easier than fiddling with “the React way” of doing things.


    To highlight one such situation, take a look at the **Colorizer** example in [Figure
    12-1](#part0019.xhtml_ch12fig01).


    ![Image](Images/image00284.jpeg)


    Figure 12-1 Colorizer example.


    If you have access to a browser, you can view it live at the following location:
    [https://www.kirupa.com/react/examples/colorizer.htm](https://www.kirupa.com/react/examples/colorizer.htm)


    The **Colorizer** colorizes the (currently) white square with whatever color you
    provide it. To see it in action, enter a color value inside the text field and
    click/tap on the *go* button. If you don’t have any idea of what color to enter,
    **yellow** is a good one! Once you have provided a color and submitted it, the
    white square will turn whatever color value you provided (see [Figure 12-2](#part0019.xhtml_ch12fig02)).


    ![Image](Images/image00285.jpeg)


    Figure 12-2 The white square turns yellow.


    That the square changes color for any valid color value you submit is pretty awesome,
    but it isn’t what I want you to focus on. Instead, pay attention to the text field
    and the button after you submit a value. Notice that the button gets focus, and
    the color value you just submitted is still displayed inside the form. If you
    want to enter another color value, you need to explicitly return focus to the
    text field and clear out whatever current value is present. Eww! That seems unnecessary,
    and we can do better than that from a usability point of view!


    Now, wouldn’t it be great if we could clear both the existing color value and
    return focus to the text field immediately after you submit a color? That would
    mean that if we submitted a color value of **purple**, what we would see afterwards
    would look like [Figure 12-3](#part0019.xhtml_ch12fig03).


    ![Image](Images/image00286.jpeg)


    Figure 12-3 We get purple and the text field is ready for the next color.'
