    \  },\n  componentDidMount: function() {             \n    window.addEventListener(\"\
    someEvent\", this.handleMyEvent); \n  },                               \n  componentWillUnmount:\
    \ function() {\n    window.removeEventListener(\"someEvent\", this.handleMyEvent);\n\
    \  },\n  render: function() {\n      return (\n        <div>Hello!</div>\n   \
    \   );\n    }\n});\n```\n\n这应该非常直观。你唯一需要记住的另一件事是在组件即将被销毁时移除事件监听器。为了做到这一点，你可以使用\
    \ `componentDidMount` 方法的反向方法 `componentWillUnmount` 方法。在该方法内部，放置你的 `removeEventListener`\
    \ 调用，以确保在组件消失后不会留下任何事件监听的痕迹。\n\n### 事件处理器内部 `this` 的含义\n\n在 React 中处理事件时，事件处理器内部的\
    \ `this` 取值与你通常在非 React 的 DOM 世界中看到的不同。在非 React 世界中，事件处理器内部的 `this` 值指向事件所监听的那个元素：\n\
    \n点击此处查看代码图片\n\n```javascript\nfunction doSomething(e) {\n  console.log(this);\
    \ //button element\n}\n\nvar foo = document.querySelector(\"button\");\nfoo.addEventListener(\"\
    click\", doSomething, false);\n```\n\n在 React 世界中（当你的组件使用 `React.createClass`\
    \ 创建时），事件处理器内部的 `this` 值始终指向`该事件处理器所在的组件`：\n\n点击此处查看代码图片\n\n```javascript\nvar\
    \ CounterParent = React.createClass({\n  getInitialState: function() {\n    return\
    \ {\n      count: 0\n    };\n  },\n  increase: function(e) {\n    console.log(this);\
    \ // CounterParent component\n    this.setState({\n      count: this.state.count\
    \ + 1\n    });\n  },\n  render: function() {\n      return (\n        <div>\n\
    \          <Counter display={this.state.count}/>\n          <button onClick={this.increase}>+</button>\n\
    \        </div>\n      );\n    }\n});\n```\n\n"
