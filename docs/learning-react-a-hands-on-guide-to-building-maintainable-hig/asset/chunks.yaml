    ## Acknowledgments


    First, none of this would be possible without the support and encouragement of
    my awesome wife, **Meena**. If she didn’t put her goals on hold to allow me to
    spend six months designing, writing, and re-writing everything you see here, me
    writing this book would have been a distant dream.


    Next, I’d like to thank **my parents** for always encouraging me to aimlessly
    wander and enjoy free time to do what I liked—such as teaching complete strangers
    over the internet in the late 1990s how to do cool things with programming. I
    wouldn’t be half the rugged indoorsman/scholar/warrior I am today without them
    both :P


    On the publishing side, writing the words you see here is the easy part. Getting
    the book into your hands is an amazingly complex process. The more I learn about
    all the moving pieces involved, the more impressed I am at all the individuals
    who work tirelessly behind the scenes to keep this amazing machinery running.
    **To everyone at Pearson** who made this possible, thank you! There are a few
    people I’d like to explicitly call out, though. First, I’d like to thank **Mark
    Taber** for continuing to give me opportunities to work together, **Chris Zahn**
    for patiently addressing my numerous questions/concerns, **Abby Manheim** for
    turning my version of English into something human-understandable, and **Loretta
    Yates** for helping make the connections a long time ago that made all of this
    happen. The technical content of this book has been reviewed in great detail by
    my long-time friends and online collaborators, **Kyle Murray (aka Krilnon)** and
    **Trevor McCauley (aka senocular)**. I can’t thank them enough for their thorough
    (and frequently, humorous!) feedback.


    ## About the Author


    **Kirupa Chinnathambi** has spent most of his life trying to teach others to love
    web development as much as he does.


    In 1999, before blogging was even a word, he started posting tutorials on [kirupa.com](http://kirupa.com).
    In the years since then, he has written hundreds of articles, written a few books
    (none as good as this one, of course!), and recorded a bunch of videos you can
    find on YouTube. When he isn’t writing or talking about web development, he spends
    his waking hours helping make the Web more awesome as a Program Manager in Microsoft.
    In his non-waking hours, he is probably sleeping...or writing about himself in
    the third person.


    You can find him on Twitter ([twitter.com/kirupa](http://twitter.com/kirupa)),
    Facebook ([facebook.com/kirupa](http://facebook.com/kirupa)), or e-mail ([kirupa@kirupa.com](mailto:kirupa@kirupa.com)).
    Feel free to contact him anytime.


    ## 1. Introducing React


    Ignoring for a moment that web apps today both *look* and *feel* nicer than they
    did back in the day, there is something even more fundamental that has changed.
    The way we architect and build web apps is very different now. To highlight this,
    let’s take a look at the app shown in [Figure 1-1](#part0008.xhtml_ch01fig01).


    ![Image](Images/image00227.jpeg)


    Figure 1-1 An app.'
