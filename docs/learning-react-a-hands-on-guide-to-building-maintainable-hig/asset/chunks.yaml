    what you see with the newly submitted text. The rest of the work is just around
    setting up events and event handlers to ensure we can submit the form and know
    exactly what text to add to our array of items. In the following sections, we
    are going to turn all of this English we’ve seen here into React-flavored JavaScript
    and JSX!


