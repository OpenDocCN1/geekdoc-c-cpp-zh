    #### Installing the React Dependencies


    What we are going to do next is install our React dependencies so that we can
    use the React and React DOM libraries in our code. If you are coming from a pure
    web development background, this is going to sound strange. Just bear with me
    on this.


    In your Terminal or Command Prompt, enter the following to install our React dependencies:


    [Click here to view code image](#part0041.xhtml_p190pro01)


    npm install react react-dom --save


    Once you Enter this, a lot of weird stuff will show up on your screen. You may
    even see a bunch of warnings, but they should be safe to ignore. What is happening
    is that the React and React-DOM libraries (and stuff that they depend on) is getting
    downloaded from a giant repository of Node.js packages found here: [https://www.npmjs.com/](https://www.npmjs.com/)


    If you take a look at your **MyTotallyAwesomeApp** folder, you’ll see a folder
    called **node_modules**. Inside that folder, you’ll see a bunch of various modules
    (aka what Node.js calls what we mere mortals just call libraries). Let’s update
    our visualization of our current file/folder structure to look like [Figure 15-11](#part0022.xhtml_ch15fig11).


    ![Image](Images/image00311.jpeg)


    Figure 15-11 The updated folder structure.


    The list of modules you see right now is just the beginning. We’ll be adding a
    few more by the time you reach the end of this, so don’t get too attached the
    number of items you see inside our **node_modules** folder :P


    #### Adding our JSX File


    Things are about to get (more!) interesting. Now that we’ve told Node.js all about
    our interest in React, we are one step closer towards building a React app. We
    are going to further enter these waters by adding a JSX file that is a modified
    version of the example we saw in [Chapter 3](#part0010.xhtml_ch03) when looking
    at Components.


    Inside our **dev** folder, using the code editor, create a file called **index.jsx**
    with the following code as its contents:


    [Click here to view code image](#part0041.xhtml_p191pro01)


    import React from "react";


    import ReactDOM from "react-dom";


    var HelloWorld = React.createClass({


      render: function() {


        return (


          <p>Hello, {this.props.greetTarget}!</p>


        );


      }


    });


    ReactDOM.render(


      <div>


        <HelloWorld greetTarget="Batman"/>


        <HelloWorld greetTarget="Iron Man"/>


        <HelloWorld greetTarget="Nicolas Cage"/>


        <HelloWorld greetTarget="Mega Man"/>


        <HelloWorld greetTarget="Bono"/>


        <HelloWorld greetTarget="Catwoman"/>


      </div>,


      document.querySelector("#container")


    );


    Notice that the bulk of the JSX we added is pretty much unmodified from what we
    had earlier. The only difference is that what used to be `script` references for
    getting the React and React DOM libraries into our app has now been replaced with
    `import` statements pointing to our **react** and **react-dom** Node.js packages
    we added a few moments ago:


    [Click here to view code image](#part0041.xhtml_p191pro02)


    import React from "react";


    import ReactDOM from "react-dom";


    Now, you are probably eagerly wondering when we can build our app and get it all
    working in our browser. Well, there are still a few more steps left. [Figure 15-12](#part0022.xhtml_ch15fig12)
    shows what the current visualization of our project looks like.


    ![Image](Images/image00312.jpeg)


    Figure 15-12 The current project.


    Our **index.html** file is looking for code from the **myCode.js** file which
    still doesn’t exist. We added our JSX file, but we know that our browser doesn’t
    know what to do with JSX. We need to go from **index.jsx** in our **dev** folder
    to **myCode.js** in the **output** folder. Guess what we are going to do next?'
