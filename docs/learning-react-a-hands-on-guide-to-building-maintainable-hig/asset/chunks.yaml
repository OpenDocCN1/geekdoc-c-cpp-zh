    ReactDOM.render(\n  <div>\n    <MyCustomComponent/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n如果你大小写错误，React 将无法正常渲染你的内容。组件将无法被找到。当程序运行异常时，识别大小写问题可能是你最后才会想到的事情，所以请记住这个小贴士。\n\
    \n### 你的 JSX 可以出现在任何地方\n\n在很多情况下，你的 JSX 并不会像我们目前为止看到的示例那样整齐地排列在 `render` 或 `return`\
    \ 函数内部。看看以下示例：\n\n点击此处查看代码图片\n\n```javascript\nvar swatchComponent = <Swatch color=\"\
    #2F004F\"></Swatch>;\n\nReactDOM.render(\n  <div>\n    {swatchComponent}\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\n我们有一个变量 `swatchComponent`，它被初始化为一行\
    \ JSX。当我们的 `swatchComponent` 变量被放在渲染函数内部时，我们的 `Swatch` 组件就会被初始化。这一切都是完全有效的，将来在我们学习如何使用\
    \ JavaScript 生成和操作 JSX 时，我们还会进行更多此类操作。\n\n### 总结\n\n通过这一章，我们终于在一个地方将之前章节介绍的各种\
    \ JSX 信息汇编了一起。最需要记住的一点是：`JSX 不是 HTML`。它在许多常见场景下看起来像 HTML，行为也也像 HTML，但它最终被设计为翻译成\
    \ JavaScript。这意味着你可以做一些仅使用纯 HTML 永远无法实现的事情。能够评估表达式或通过程序手段操作整个 JSX 块仅仅是一个开始。在接下来的章节中，我们将进一步探索\
    \ JavaScript 和 JSX 的交汇点。\n\n## 8. 处理状态 (State)\n\n到目前为止，我们创建的组件都是无状态的。它们拥有从父元素传递而来的属性（即\
    \ props），但一旦组件激活，它们内部（通常）不会发生任何变化。一旦属性被设置，它们就被认为是不可更改的。对于许多交互场景，你并不希望这样。你希望能够根据某些用户交互（或从服务器或其他数百万种情况返回的数据）改变组件的某些方面。\n\
    \n我们需要另一种在组件上存储数据的方法，不仅仅是属性。我们需要一种存储可以更改的数据的方法。我们需要被称为 `state`（状态）的东西！在本章中，你将学习关于它的所有知识，以及如何使用它来创建有状态组件。\n\
    \n### 使用状态\n\n如果你知道如何处理属性，你就完全知道如何处理状态了……某种程度上。它们之间有一些差异，但目前太细微了，没必要让你无聊。相反，让我们直接开始，通过在一个小型示例中使用状态来观察它的运行。\n\
    \n我们将创建一个如图 8-1\n\n图 8-1 你将构建的应用程序。\n\n这个示例做的并不疯狂。闪电每秒大约击中地球表面 100 次（[`environment.nationalgeographic.com/environment/natural-disasters/lightning-profile/`](http://environment.nationalgeographic.com/environment/natural-disasters/lightning-profile/)）。我们有一个计数器，它只需根据该频率增加你看到的数字。让我们创建它。\n\
    \n#### 我们的起点\n\n这个示例的初重点是观察我们可以处理状态。我们没有必要花费大量时间从头创建这个示例并重溯我们走过的很多次路径。这对任何人的时间都不是最好的利用。\n\
    \n与其从头开始，不如修改现有的 HTML 文档或创建一个包含以下内容的新文档：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>More State!</title>\n  <script src=\"https://unpkg.com/react@15.3.0/dist/react.js\"\
    ></script>\n  <script src=\"https://unpkg.com/react-dom@15.3.0/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n</head>\n<body>\n  <div id=\"container\"></div>\n  <script type=\"\
    text/babel\">\n    var LightningCounter = React.createClass({\n      render: function()\
    \ {\n        return (\n          <h1>Hello!</h1>\n        );\n      }\n    });\n\
    \    var LightningCounterDisplay = React.createClass({\n      render: function()\
    \ {\n        var divStyle = {\n          width: 250,\n          textAlign: \"\
    center\",\n          backgroundColor: \"black\",\n          padding: 40,\n   \
    \       fontFamily: \"sans-serif\",\n          color: \"#999\",\n          borderRadius:\
    \ 10\n        };\n        return(\n          <div style={divStyle}>\n        \
    \    <LightningCounter/>\n          </div>\n        );\n      }\n    });\n   \
    \ ReactDOM.render(\n      <LightningCounterDisplay/>,\n      document.querySelector(\"\
    #container\")\n    );\n  </script>\n</body>\n</html>\n```\n\n在此处，花点时间观察我们现有的代码。首先，我们有一个名为\
    \ `LightningCounterDisplay` 的组件：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounterDisplay\
    \ = React.createClass({\n  render: function() {\n    var divStyle = {\n      width:\
    \ 250,\n      textAlign: \"center\",\n      backgroundColor: \"black\",\n    \
    \  padding: 40,\n      fontFamily: \"sans-serif\",\n      color: \"#999\",\n \
    \     borderRadius: 10\n    };\n    return(\n      <div style={divStyle}>\n  \
    \      <LightningCounter/>\n      </div>\n    );\n  }\n});\n```\n\n这个组件的大部分是 `divStyle`\
    \ 对象，它包含了负责酷炫背景的样式信息。`render` 函数返回一个包裹了 `LightningCounter` 组件的 `div` 元素。\n\n`LightningCounter`\
    \ 组件是所有动作发生的地方：\n\n点击此处查看代码图片\n\n```javascript\nvar LightningCounter = React.createClass({\n\
    \  render: function() {\n    return (\n      <h1>Hello!</h1>\n    );\n  }\n});\n\
    ```\n\n这个组件目前没有任何有趣的地方。它只是返回了 **Hello!**。没关系——我们稍后会修复这个组件。\n\n最后我们要看的是我们的 `ReactDOM.render`\
    \ 方法：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <LightningCounterDisplay/>,\n\
