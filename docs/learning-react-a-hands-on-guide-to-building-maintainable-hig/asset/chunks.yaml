        var cardStyle = {


          height: 200,


          width: 150,


          padding: 0,


          backgroundColor: "#FFF",


          WebkitFilter: "drop-shadow(0px 0px 5px #666)",


          filter: "drop-shadow(0px 0px 5px #666)"


        };


        return React.createElement(


          "div",


          { style: cardStyle },


          React.createElement(Square, { color: this.props.color }),


          React.createElement(Label, { color: this.props.color })


        );


      }


    });


    Notice that there is no trace of JSX anywhere! All of these changes between what
    you wrote and what our browser sees are part of the transpiling step we’ve talked
    about in the first chapter. That transpilation is something that happens entirely
    behind-the-scenes thanks to Babel, which we’ve been to perform this JSX→JS transformation
    entirely in the browser. We’ll eventually look at using Babel as part of a more-involved
    build environment where we will just generate a transformed JS file, but more
    on that when we get there in the future.


    But yeah, there you have it. An answer to what exactly happens to all of our JSX.
    It gets turned into sweet SWEET JavaScript.


    ### JSX Quirks to Remember


    As we’ve been working with JSX, you probably noticed that we ran into some arbitrary
    rules and exceptions to what you can and can’t do. In this section, let’s put
    all of those quirks together in one area and maybe even run into some brand new
    ones!


    #### You Can Only Return A Single Root Node


    This is probably the first quirk we ran into. In JSX, what you return or render
    can’t be made up of multiple root elements:


    [Click here to view code image](#part0033.xhtml_p083pro01)


    ReactDOM.render(


      <Letter>B</Letter>


      <Letter>E</Letter>


      <Letter>I</Letter>


      <Letter>O</Letter>


      <Letter>U</Letter>,


      document.querySelector("#container")


    );


    If you want to do something like this, you need to wrap all of your elements into
    a single parent element first:


    [Click here to view code image](#part0033.xhtml_p083pro02)


    ReactDOM.render(


      <div>


        <Letter>A</Letter>


        <Letter>E</Letter>


        <Letter>I</Letter>


        <Letter>O</Letter>


        <Letter>U</Letter>


      </div>,


      document.querySelector("#container")


    );


    This seemed like a bizarre requirement when we looked at it before, but you can
    blame `createElement` for why we do this. With the `render` and `return` functions,
    what you are ultimately returning is a single `createElement` call (which in turn
    might have many nested `createElement` calls). Here is what our earlier JSX looks
    like when turned into JavaScript:


    [Click here to view code image](#part0033.xhtml_p084pro01)


    ReactDOM.render(React.createElement(


      "div",


      null,


      React.createElement(


        Letter,


        null,


        "A"


      ),


      React.createElement(


        Letter,


        null,


        "E"


      ),


      React.createElement(


        Letter,


        null,


        "I"


      ),


      React.createElement(


        Letter,


        null,


        "O"


      ),


      React.createElement(


        Letter,


        null,


        "U"


      )


    ), document.querySelector("#container"));


    Having multiple root elements would break how functions return values and how
    `createElement` works, so that is why you can specify only one return (root) element!
    You can now sleep better knowing this.


    #### You Can’t Specify CSS Inline


    As we saw in [Chapter 4](#part0011.xhtml_ch04), the `style` attribute in your
    JSX behaves differently from the `style` attribute in HTML. In HTML, you can specify
    CSS properties directly as values on your `style` attribute:


    [Click here to view code image](#part0033.xhtml_p084pro02)


    <div style="font-family:Arial;font-size:24px">


        <p>Blah!</p>


    </div>


    In JSX, the `style` attribute can’t contain CSS inside it. Instead, it needs to
    refer to an object that contains styling information instead:


    [Click here to view code image](#part0033.xhtml_p085pro01)


    var Letter = React.createClass({


      render: function() {


          var letterStyle = {


            padding: 10,


            margin: 10,


            backgroundColor: this.props.bgcolor,


            color: "#333",


            display: "inline-block",


            fontFamily: "monospace",


            fontSize: "32",


            textAlign: "center"


          };


          return (


            <div style={letterStyle}>


              {this.props.children}


            </div>


          );


        }


    });


    Notice that we have an object called `letterStyle` that that contains all of the
    CSS properties (in camelcase JavaScript form) and their values. That object is
    what we then specify to the `style` attribute.


    #### Reserved Keywords and `className`


    JavaScript has a bunch of keywords and values that you can’t use as identifiers.
    Those keywords currently (as of ES2016) are:


    ![Image](Images/image00268.jpeg)


    When you are writing JSX, you should be careful to not use these keywords as part
    of any identifiers that you create as well. That can be difficult when certain
    really popular keywords like `class` are commonly used in HTML despite also being
    in JavaScript’s reserved keywords list.


    Take a look at the following:


    [Click here to view code image](#part0033.xhtml_p086pro01)


    ReactDOM.render(


      <div class="slideIn">


        <p class="emphasis">Gabagool!</p>


        <Label/>


      </div>,


      document.querySelector("#container")


    );


    Ignoring JavaScript’s reservations about `class` (like what we’ve done here) won’t
    work. What you need to do is use the DOM API version of the `class` attribute
    called `className` instead:


    [Click here to view code image](#part0033.xhtml_p086pro02)


    ReactDOM.render(


      <div className="slideIn">


        <p className="emphasis">Gabagool!</p>


        <Label/>


      </div>,


      document.querySelector("#container")


    );


    You can see the full list of supported tags and attributes at the following Facebook
    article ([https://facebook.github.io/react/docs/tags-and-attributes.html](https://facebook.github.io/react/docs/tags-and-attributes.html)),
    and *notice that all of the attributes are camelcase*. That detail is important,
    for using the lowercase version of an attribute won’t work. If you are ever pasting
    a large chunk of HTML that you want JSX to deal with, be sure to go back to your
    pasted HTML and make these minor adjustments to turn it into valid JSX.


    This brings up another point. Because of these minor deviations from HTML behavior,
    we tend to say that JSX supports an *HTML-like syntax* as opposed to just saying
    that JSX supports HTML. This is a deliberate React-ism. The clearest answer to
    the relationship between JSX and HTML comes from React team member, Ben Alpert,
    who stated the following ([http://qr.ae/RUKaON](http://qr.ae/RUKaON)) as part
    of a Quora answer:


    ...our thinking is that JSX’s primary advantage is the symmetry of matching closing
    tags which makes [sic] code easier to read, not the direct resemblance to HTML
    or XML. It’s convenient to copy/paste HTML directly, but other minor differences
    (in self-closing tags, for example) make this a losing battle and we have a HTML
    to JSX converter to help you anyway. Finally, to translate HTML to idiomatic React
    code, a fair amount of work is usually involved in breaking up the markup into
    components that make sense, so changing `class` to `className` is only a small
    part of that anyway.


    #### Comments


    Just like it is a good idea to comment your HTML, CSS, and JavaScript, it is a
    good idea to provide comments inside your JSX as well. Specifying comments in
    JSX is very similar to how you would comment in JavaScript ([https://www.kirupa.com/html5/comments.htm](https://www.kirupa.com/html5/comments.htm))
    ...except for one exception. If you are specifying a comment as a child of a tag,
    you need to wrap your comment by the `{` and `}` curly brackets to ensure it is
    parsed as an expression:


    [Click here to view code image](#part0033.xhtml_p087pro01)


    ReactDOM.render(


      <div class="slideIn">


        <p class="emphasis">Gabagool!</p>


        {/* I am a child comment */} 


        <Label/>


      </div>,


      document.querySelector("#container")


    );'
