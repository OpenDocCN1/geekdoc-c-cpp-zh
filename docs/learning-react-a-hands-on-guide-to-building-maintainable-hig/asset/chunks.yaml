    ## 致谢


    首先，如果没有我出色的妻子 `Meena` 的支持和鼓励，这一切将是不可能的。如果她没有搁置自己的目标，以便让我花六个月时间来设计、编写和重写你在这里看到的所有内容，那么我写完这本书将是一个遥不可及的梦想。


    接下来，我要感谢我的父母，他们总是鼓励我漫无目的地流浪，享受空闲时间去做我喜欢的事——例如在 20 世纪 90 年代后期，在互联网上教陌生人如何用编程做酷的事情。如果没有他们，我不会成为今天这个如此坚毅的室内派/学者/战士：:P


    在出版方面，写下你看到的这些文字很容易。但将书交到你手中是一个极其复杂的过程。我了解的涉及的环节越得越多，我就越对所有在幕后辛勤工作以保持这台奇妙机器运行的个人感到印象深刻。感谢所有让这一切成为可能的
    Pearson 同仁！不过，有几个人我想特别点名。首先，我要感谢 `Mark Taber` 继续给我提供合作的机会，感谢 `Chris Zahn` 耐心回答我的无数问题/疑虑，感谢
    `Abby Manheim` 将我的版本英语转换成人类可以理解的内容，以及感谢 `Loretta Yates` 在很久以前就帮助促成了这一切的发生。本书的技术内容已由我的长期朋友和在线合作者
    `Kyle Murray (aka Krilnon)` 和 `Trevor McCauley (aka senocular)` 进行了详细审查。对于他们详尽（而且经常很幽默！）的反馈，我感激不。


    ## 关于作者


    `Kirupa Chinnathambi` 一生的大部分时间都在试图教其他人像他一样热爱 Web 开发。


    1999 年，在“博客”还未成为一个词之前，他就在 kirupa.com 上发布教程了。在随后的几年里，他写了数百篇文章，写了几本书（当然，没有哪本像这本书好！），并录制了可以在
    YouTube 上找到的视频。当他没有编写或谈论 Web 开发时，他作为微软的项目经理，正在帮助 Web 变得更酷。在他不清醒的时候，他可能在睡觉……或者用第三人称写关于自己的事。


    你可以在 Twitter (twitter.com/kirupa)、Facebook (facebook.com/kirupa) 或电子邮件 (kirupa@kirupa.com)
    找到他。欢迎随时联系他。


    ## 1. 介绍 React


    暂且忽略现在的 Web 应用在*视觉*和*感受*上比以前更好，还有一些更基础性的变化发生了。我们现在架构和构建 Web 应用的方式已经非常不同了。为了突出这一点，让我们看看图
    1-1 所示的应用（part0008.xhtml_ch01fig01）。


    ![Image](img/image00227.jpeg)


    图 1-1 一个应用。


