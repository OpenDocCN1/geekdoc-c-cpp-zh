  raw: 'Best of all, after you make changes to how your functions work, you don’t
    have to do anything extra to see the results of those changes. If the function
    signature did not change, any existing calls to that function will just magically
    work and automatically pick up any new changes you made to the function itself.
    For example, our existing `getDistance` calls will see the result of the `formatDistance`
    function even if the `formatDistance` function didn’t exist when the calls were
    first defined. That’s pretty awesome.


    In a nutshell, functions are awesome. I know that. You know that. That’s why all
    of the code we write has them all over the place.


    ### Changing How We Deal with the UI


    I don’t think anybody will disagree with the good things functions bring to the
    table. They really make it possible to structure the code for your apps in a sane
    way. That same level of care we use in writing our code isn’t always possible
    when it comes to writing our UIs. For various technical and non-technical reasons,
    we’ve always tolerated a certain level of sloppiness with how we typically work
    with our UI elements.


    I realize that is a pretty controversial statement, so let me highlight what I
    mean by looking at some examples. We are going to go back and look at the `render`
    method we used in the previous chapter:


    [Click here to view code image](#part0029.xhtml_p026pro01)


    var destination = document.querySelector("#container");


    ReactDOM.render(


      <h1>Batman</h1>,


      destination


    );


    What you see on the screen is the word **Batman** printed in giant letters—thanks
    to the `h1` element. Let’s change things up a bit and say that we want to print
    the names of several other superheroes. To do this, let’s modify our `render`
    method to now look as follows:


    [Click here to view code image](#part0029.xhtml_p026pro02)


    var destination = document.querySelector("#container");


    ReactDOM.render(


      <div>


        <h1>Batman</h1>


        <h1>Iron Man</h1>


        <h1>Nicolas Cage</h1>


        <h1>Mega Man</h1>


      </div>,


      destination


    );


    Notice what you see here. We emit a `div` that contains the four `h1` elements
    with our superhero names.


    * * *


    JSX Gotcha: Outputting Multiple Elements


    There is an important JSX detail to call out here. The `div` that wraps our `h1`
    elements isn’t there because it looks like a good idea. It is there because it
    *has to be there*. In React, you can’t output multiple adjacent elements as shown
    in the following:


    [Click here to view code image](#part0029.xhtml_p027pro01)


    var destination = document.querySelector("#container");


    ReactDOM.render(


      <h1>Batman</h1>


      <h1>Iron Man</h1>


      <h1>Nicolas Cage</h1>


      <h1>Mega Man</h1>,


      destination


    );


    Even though this is valid HTML, it isn’t valid in the eyes of the unholy alliance
    between JSX and JavaScript. That may sound like a terrible limitation, but the
    workaround is really easy. While you can only output *one element*, this *one
    element can have as many children as needed*. That is why we wrap our `h1` elements
    inside the `div`. We do this because of how JSX gets turned into JavaScript. The
    details of that are something we will look at later, but it isn’t important enough
    right this moment to distract us from learning about components.


    * * *


    Ok, so what we have now are four `h1` elements that each contain the name of a
    superhero. What if we want to change our `h1` element to something like an `h3`
    instead? We can manually update all of these elements as follows:


    [Click here to view code image](#part0029.xhtml_p027pro02)


    var destination = document.querySelector("#container");


    ReactDOM.render(


      <div>


        <h3>Batman</h3>


        <h3>Iron Man</h3>


        <h3>Nicolas Cage</h3>


        <h3>Mega Man</h3>


      </div>,


      destination


    );


    If you preview what we have, you’ll see something that looks a bit unstyled and
    plain (see [Figure 3-3](#part0010.xhtml_ch03fig03)).


    ![Image](Images/image00241.jpeg)


    Figure 3-3 Plain vanilla super hero names.


    We don’t want to go crazy with the styling here. All we want to do is just italicize
    all of these names by using the <`i>` tag, so let’s manually update what we render
    by making this change:


    [Click here to view code image](#part0029.xhtml_p028pro01)


    var destination = document.querySelector("#container");


    ReactDOM.render(


      <div>


        <h3><i>Batman</i></h3>


        <h3><i>Iron Man</i></h3>


        <h3><i>Nicolas Cage</i></h3>


        <h3><i>Mega Man</i></h3>


      </div>,


      destination


    );


    We went through each `h3` element and wrapped the content inside some `i` tags.
    Can you start to see the problem here? What we are doing with our UI is no different
    than having code that looks as follows:


    var speed = 10;


    var time = 5;


    alert(speed * time);


    var speed1 = 85;


    var time1 = 1.5;


    alert(speed1 * time1);


    var speed2 = 12;


    var time2 = 9;


    alert(speed2 * time2);


    var speed3 = 42;


    var time3 = 21;


    alert(speed3 * time3);


    Every change we want to make to our `h1` or `h3` elements needs to be duplicated
    for every instance of it. What if we want to do something even more complex than
    just modifying the appearance of our elements? What if we want to represent something
    more complex than the simple examples we are using so far? What we are doing right
    now won’t scale because manually updating every copy of what we want to modify
    is time consuming. It is also boring.


    Now, here is a crazy thought: What if everything awesome we looked at about functions
    can somehow be applied to how we define our app’s visuals? Wouldn’t that solve
    all of the inefficiencies we’ve highlighted in this section? Well, as it turns
    out, the answer to that “What if” forms the core of what React is all about. It
    is time for you to meet the component.


    ### Meet the React Component


    The solution to all of our problems (even the existential ones we grapple with!)
    can be found in React components. *React components are reusable chunks of JavaScript
    that output (via JSX) HTML elements*. That sounds really pedestrian for something
    capable of solving great problems and doing great things, but as we start to build
    components and gradually turn up the complexity, you’ll see that components are
    really powerful and every bit as awesome as I’ve portrayed them to you.


    Let’s start by building a couple of components together. To follow along, start
    with a blank React document:


    [Click here to view code image](#part0029.xhtml_p029pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>React Components</title>


      <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


      <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


    </head>


    <body>


      <div id="container"></div>


      <script type="text/babel">


      </script>


    </body>


    </html>


    There is nothing exciting going on this page. Nearly identical to what we had
    in our earlier chapter, this page is pretty barebones, with just a reference to
    the React and Babel libraries and a `div` element who proudly sports an `id` value
    of **container**.


    #### Creating a Hello, World! Component


    We are going to start really simple. What we want to do is use a component to
    help us print the famous “**Hello, world!**” text to the screen. As we already
    know, by using just the `render` method of `ReactDOM`, the code would look as
    follows:


    [Click here to view code image](#part0029.xhtml_p030pro01)


    1   ReactDOM.render(


    2     <div>


    3       <p>Hello, world!</p>


    4     </div>,


    5     document.querySelector("#container")


    6   );


    Let’s recreate all of this by using a component. You have several ways of creating
    components in React, but the way we are going to create them initially is by using
    `React.createClass`. Go ahead and add the following highlighted code just above
    our existing render method:


    [Click here to view code image](#part0029.xhtml_p030pro02)


    var HelloWorld = React.createClass({ 


    });                                  


    ReactDOM.render(


      <div>'
