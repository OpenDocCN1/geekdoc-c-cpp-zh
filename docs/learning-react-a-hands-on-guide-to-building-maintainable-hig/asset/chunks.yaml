    ### 大写字母、HTML 元素与组件\n\n大小写非常重要。为了表示 HTML 元素，请确保 HTML 标签为小写：\n\n点击此处查看代码图片\n\n\
    ```javascript\nReactDOM.render(\n  <div>\n    <section>\n      <p>Something goes\
