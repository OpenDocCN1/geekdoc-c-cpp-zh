  trans: "\n\n只要你评估的表达式返回的是 JSX，你就可以在 `{` 和 `}` 大括号内放入任何你想要的内容。这种灵活性非常棒，因为当你的 JavaScript\
    \ 编写在 `render` 函数之外时，你可以做很多事情。**非常多**！\n\n### 在 JSX 上下文中处理数组\n\n现在我们要开始进入一些有趣的内容了！当你显示多个组件时，你并不总是能够手动指定它们：\n\
    \n```javascript\nReactDOM.render(\n  <div>\n    {showCircle()}\n    {showCircle()}\n\
    \    {showCircle()}\n  </div>,\n  destination\n);\n```\n\n在许多现实场景中，你显示的组件数量将与你正在处理的数组或类数组（即迭代器）对象中的项目数量相关。这带来了一些简单的复杂性。例如，假设我们有一个名为\
    \ `colors` 的数组，如下所示：\n\n点击此处查看代码图片\n\n```javascript\nvar colors = [\"#393E41\"\
    , \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n               \"#85FFC7\", \"#297373\"\
    , \"#FF8552\", \"#A40E4C\"];\n```\n\n我们想要的是为此数组中的每个项目创建一个 `Circle` 组件（并将 `bgColor`\
    \ 属性设置为每个数组项的值）。我们将采用的方法是创建一个由 `Circle` 组件组成的数组：\n\n点击此处查看代码图片\n\n```javascript\n\
    var colors = [\"#393E41\", \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n          \
    \     \"#85FFC7\", \"#297373\", \"#FF8552\", \"#A40E4C\"];\n\nvar renderData =\
    \ [];\n\nfor (var i = 0; i < colors.length; i++) {\n  renderData.push(<Circle\
    \ bgColor={colors[i]}/>);\n}\n```\n\n在这个代码段中，我们按照最初计划的那样用 `Circle` 组件填充了 `renderData`\
    \ 数组。到目前为止顺利。要显示所有这些组件，React 让它变得非常简单。只需查看高亮的行，你只需要做这些：\n\n点击此处查看代码图片\n\n```javascript\n\
    var colors = [\"#393E41\", \"#E94F37\", \"#1C89BF\", \"#A1D363\",\n          \
    \     \"#85FFC7\", \"#297373\", \"#FF8552\", \"#A40E4C\"];\n\nvar renderData =\
    \ [];\n\nfor (var i = 0; i < colors.length; i++) {\n  renderData.push(<Circle\
    \ bgColor={colors[i]}/>);\n}\n\nReactDOM.render(\n  <div>\n    {renderData}\n\
    \  </div>,\n  destination\n);\n```\n\n在我们的 `render` 方法中，我们做的只是将 `renderData` 数组指定为我们需要评估的表达式。我们不需要采取任何步骤，就可以从组件数组转换为在浏览器中预览时看到的类似于图\
    \ 9-2 的内容。\n\n![Image](img/image0027.jpeg)\n\n图 9-2 你在浏览器中应该看到的内容。\n\n好了，虽然我们的示例看起来可以工作，但我们还没有结束！实际上还有一件事我们需要做，这是一个非常微妙的操作。React\
    \ 使 UI 更新非常快的方法是对你的 DOM 中究竟发生了什么有良好的了解。它通过几种方式实现这一点，但一种非常明显的方式是在其内部为每个元素标记了某种标识符。这种“标记”会在你在\
    \ JSX 中显式指定元素时自动发生。\n\n当你动态创建元素时（例如我们处理 `Circle` 组件数组时所做的），这些标识符不会自动设置。我们需要做一些额外工作。这些额外工作的形式是\
    \ `key` 属性，React 使用它的值来唯一标识每个特定的组件。\n\n对于我们的示例，我们可以像这样：\n\n点击此处查看代码图片\n\n```javascript\n\
    for (var i = 0; i < colors.length; i++) {\n  var color = colors[i];\n  renderData.push(<Circle\
    \ key={i + color} bgColor={color}/>);\n}\n```\n\n在每个组件上，我们指定了 `key` 属性，并将其值设置为\
    \ `colors` 数组内部颜色和索引位置的组合。这确保了动态创建的每个组件最终都会获得一个 React 随后可以使用唯一标识符。\n\n"
- fmt: "\nUnder the covers, the way this example works is pretty simple. Each time\
    \ you click on the button, an event gets fired. We listen for this event and do\
    \ all sorts of React-ey things to get the counter to update when this event gets\
    \ overheard.\n\n### Starting Point\n\nTo save all of us some time, we aren’t going\
    \ to be creating everything in our example from scratch. By now, you probably\
    \ have a good idea of how to work with components, styles, state, and so on. Instead,\
    \ we are going to start off with a partially implemented example that contains\
    \ everything except the event-related functionality that we are here to learn.\n\
    \nFirst, create a new HTML document and ensure your starting point looks as follows:\n\
    \n[Click here to view code image](#part0036.xhtml_p108pro01)\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>React! React! React!</title>\n  <script src=\"\
    https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n\
    \  <script type=\"text/babel\">\n  </script>\n</body>\n</html>\n```\n\nOnce your\
    \ new HTML document looks like what you see above, it’s time to add our partially\
    \ implemented counter example. Inside our `script` tag below the `container` `div`,\
    \ add the following:\n\n[Click here to view code image](#part0036.xhtml_p109pro01)\n\
    \n```javascript\nvar destination = document.querySelector(\"#container\");\n\n\
    var Counter = React.createClass({\n  render: function() {\n    var textStyle =\
    \ {\n      fontSize: 72,\n      fontFamily: \"sans-serif\",\n      color: \"#333\"\
    ,\n      fontWeight: \"bold\"\n    };\n    return (\n      <div style={textStyle}>\n\
    \        {this.props.display}\n      </div>\n    );\n  }\n});\n\nvar CounterParent\
    \ = React.createClass({\n  getInitialState: function() {\n    return {\n     \
    \ count: 0\n    };\n  },\n  render: function() {\n    var backgroundStyle = {\n\
    \      padding: 50,\n      backgroundColor: \"#FFC3A\",\n      width: 250,\n \
    \     height: 100,\n      borderRadius: 10,\n      textAlign: \"center\"\n   \
    \ };\n    var buttonStyle = {\n      fontSize: \"em\",\n      width: 30,\n   \
    \   height: 30,\n      fontFamily: \"sans-serif\",\n      color: \"#333\",\n \
    \     fontWeight: \"bold\",\n      lineHeight: \"px\"\n    };\n    return (\n\
    \      <div style={backgroundStyle}>\n        <Counter display={this.state.count}/>\n\
    \        <button style={buttonStyle}>+</button>\n      </div>\n    );\n  }\n});\n\
    \nReactDOM.render(\n  <div>\n    <CounterParent/>\n  </div>,\n  destination\n\
    );\n```\n\nOnce you have added all of this, preview everything in your browser\
    \ to make things get displayed. You should see the beginning of our counter. Take\
    \ a few moments to look at what all of this does. There shouldn’t be anything\
    \ that looks strange. The only odd thing will be that clicking the plus button\
    \ won’t do anything. We’ll fix that right up in the next section.\n\n### Making\
    \ the Button Do Something\n\nEach time we click on the plus button, we want the\
    \ value of our counter to increase by one. What we need to do is going to look\
    \ roughly like this:\n\n1. Listen for the click event on the button and specify\
    \ an event handler.\n2. Implement the event handler where we increase the value\
    \ of our `this.state.count` property that our counter relies on.\n\nWe’ll just\
    \ go straight down the list—starting with listening for the click event. In React,\
    \ you listen to an event by specifying everything inline in your JSX itself. More\
    \ specifically, you specify both the event you are listening for and the event\
    \ handler that will get called, all inside your markup. To do this, find the `return`\
    \ function inside our `CounterParent` component, and make the following highlighted\
    \ change:\n\n[Click here to view code image](#part0036.xhtml_p111pro01)\n\n```javascript\n\
    return (\n  <div style={backgroundStyle}>\n    <Counter display={this.state.count}/>\n\
    \    <button onClick={this.increase} style={buttonStyle}>+</button> \n  </div>\n\
    );\n```\n\nWhat we’ve done is told React to call the `increase` function when\
    \ the `onClick` event is overheard. Next, let’s go ahead and implement the `increase`\
    \ function—aka our event handler. Inside our `CounterParent` component, add the\
    \ following highlighted lines:\n\n[Click here to view code image](#part0036.xhtml_p111pro02)\n\
    \n```javascript\nvar CounterParent = React.createClass({\n  getInitialState: function()\
    \ {\n    return {\n      count: 0\n    };\n  },\n  increase: function(e) {   \
    \       \n    this.setState({                \n      count: this.state.count +\
    \ 1 \n    });\n  },\n  render: function() {\n    var backgroundStyle = {\n   \
    \   padding: 50,\n      backgroundColor: \"#FFC3A\",\n      width: 250,\n    \
    \  height: 100,\n      borderRadius: 10,\n      textAlign: \"center\"\n    };\n\
    \    var buttonStyle = {\n      fontSize: \"em\",\n      width: 30,\n      height:\
    \ 30,\n      fontFamily: \"sans-serif\",\n      color: \"#333\",\n      fontWeight:\
    \ \"bold\",\n      lineHeight: \"px\"\n    };\n    return (\n      <div style={backgroundStyle}>\n\
    \        <Counter display={this.state.count}/>\n        <button style={buttonStyle}>+</button>\n\
    \      </div>\n    );\n  }\n});\n```\n\n### Event Properties\n\nAs you know, our\
    \ events pass what is known as an event argument to our event handler. This event\
    \ argument contains a bunch of properties that are specific to the type of event\
    \ you are dealing with. In the regular DOM world, each event has its own type.\
    \ For example, if you are dealing with a mouse event, your event and its event\
    \ argument object will be of type `MouseEvent`. This `MouseEvent` object will\
    \ allow you to access mouse-specific information, like which button was pressed\
    \ or the screen position of the mouse click. Event arguments for a keyboard-related\
    \ event are of type `KeyboardEvent`. Your `KeyboardEvent` object contains properties\
    \ which (among many other things) allow you to out which key was actually pressed.\
    \ I could go on forever for every other `Event` type, but you get the point. Each\
    \ `Event` type contains its own set of properties that you can access via the\
    \ event handler for that event.\n\nWhy am I boring you with things you already\
    \ know? Well...\n\n#### Synthetic Events\n\nIn React, when you specify an event\
    \ in JSX like we did with `onClick`, you are not directly dealing with regular\
    \ DOM events. Instead, you are dealing with a React-specific event type known\
    \ as a `SyntheticEvent`. Your event handlers don’t get native event arguments\
    \ of type `MouseEvent`, `KeyboardEvent`, etc. They always get event arguments\
    \ of type `SyntheticEvent` that wrap your browser’s native event instead. What\
    \ is the fallout of this in our code? Surprisingly not a whole lot.\n\nEach `SyntheticEvent`\
    \ contains the following properties:\n\n![Image](Images/image00275.jpeg)\n"
