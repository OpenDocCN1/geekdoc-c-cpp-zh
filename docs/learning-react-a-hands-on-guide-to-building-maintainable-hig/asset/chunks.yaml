    ## 8. Dealing with State


    Up until this point, the components we’ve created have been stateless. They have
    properties (aka props) that are passed in from their parent, but nothing (usually)
    changes about them once the components come alive. Your properties are considered
    immutable once they have been set. For many interactive scenarios, you don’t want
    that. You want to be able to change aspects of your components as a result of
    some user interaction (or some data getting returned from a server or a billion
    other things!)


    What we need is another way to store data on a component that goes beyond properties.
    We need a way to store data that can be changed. What we need is something known
    as **state**! In this chapter you learn all about it and how you can use it to
    create stateful components.


    ### Using State


    If you know how to work with properties, you totally know how to work with states...
    sort of. There are some differences, but they are too subtle to bore you with
    right now. Instead, let’s just jump right in and see states in action by using
    them in a small example.


    What we are going to is create a simple lightning counter example as shown in
    [Figure 8-1](#part0015.xhtml_ch08fig01).


    ![Image](Images/image00269.jpeg)


    Figure 8-1 The app you will be building.


