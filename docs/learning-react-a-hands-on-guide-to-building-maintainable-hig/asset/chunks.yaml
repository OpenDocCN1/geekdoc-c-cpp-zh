    \ world!` 文本的 JSX。剩下的就是实际使用这个组件。一旦你定义了组件，使用该组件的方法就是调用它，我们将从我们的老朋友 `ReactDOM.render`\
    \ 方法中调用它：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <HelloWorld/>, \n\
