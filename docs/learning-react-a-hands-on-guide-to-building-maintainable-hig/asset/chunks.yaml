    \ React 有了整体的了解！\n\n继续吧！\n\n# 老派多页设计\n\n如果你在几年前要构建这个应用，你可能会采用一种涉及多个独立页面的方法。其流程看起来就像图\
    \ 1-2 所示。\n\n![Image](img/image00228.jpeg)\n\n图 1-2 多页设计。\n\n对于几乎每一个会改变浏览器显示内容的动作，Web\
    \ 应用程序都会将你导航到一个完全不同的页面。除了用户在页面被销毁和重绘时所看到的的糟糕体验之外，这还是大问题。这对你如何维护应用状态有巨大影响。除了通过\
    \ cookie 和某些服务器端机制存储一些用户数据外，你根本不需要担心。生活很美。\n\n# 现代派单页应用\n\n如今，采用需要在单个页面之间进行导航的\
    \ Web 应用模型似乎已经过时了……就像，非常过时了，就像图 1-3 所示。\n\n![Image](img/image00229.jpeg)\n\n图\
    \ 1-3 独立页面模型有点过时了——就像这台蒸汽机。\n\n来源：*New Catechism of the Steam Engine*, 1904\n\n\
    相反，现代应用倾向于遵循所谓的单页应用（SPA）模型。在这样一个世界里，你永远不会导航到不同的页面，甚至不会重新加载页面。相反，应用的不同视图被加载和卸载到页面本身中。\n\
    \n对于我们的应用，这看起来可能像图 1-4。\n\n![Image](img/image00230.jpeg)\n\n图 1-4 单页应用。\n\n当用户与我们的应用交互时，我们用与用户正在尝试的操作相匹配的数据和\
    \ HTML 替换红色虚线区域的内容。最终结果是更加流畅的体验。你甚至可以使用许多视觉技术，让你的新内容很好地过渡，就像你在移动设备或桌面上的酷应用中看到的那样。在导航到不同页面时，这种操作完全是不可能的。\n\
    \n如果你从未听过单页应用，这一切听起来可能有点疯狂，但你很有可能在现实中遇到过其中的一些。如果你曾经用过 Gmail、Facebook、Instagram\
    \ 或 Twitter 等流行的 Web 应用，那么你就在使用单页应用。在所有这些应用中，内容都是动态显示的，不需要你刷新或导航到不同的页面。\n\n现在，我让这些单页应用看起来变得非常复杂。事实并非完全如此。得益于\
    \ JavaScript 以及各种第三方框架和库的大量改进，构建单页应用比以前任何时候都要容易。不过，并不意味着没有改进空间。\n\n在构建单页应用时，你会遇到三个主要问题：\n\
    \n![Image](img/image00226.jpeg) 在单页应用中，你的大部分时间将花在保持数据与 UI 同步上。例如，如果用户加载了新内容，我们是否显式地清除搜索字段？我们是否保持导航元素上的活动标签仍然可见？我们在页面上保留哪些元素，又销毁哪些元素？\n\
    \n这些都是单页应用特有的问题。在旧模型中切换页面切换时，我们只假设 UI 中的所有内容都会被销毁并重新构建。这从不是一个问题。\n\n![Image](img/image00226.jpeg)\
    \ 操作 DOM 真的非常、非常慢。手动查询元素、添加子节点（见下方的图 1-5）、删除子树和执行其他 DOM 操作是浏览器中可以执行的最慢的操作之一。不幸的是，在单页应用中，你会做很多这类。操作\
    \ DOM 是你响应用户操作并显示新内容的主要方法。\n\n![Image](img/image00231.jpeg)\n\n图 1-5 添加子节点。\n\n\
    ![Image](img/image00226.jpeg) 使用 HTML 模板可能会很痛苦。单页应用中的导航无非只是你处理 HTML 片段，以表示你想要显示的任何内容。这些\
    \ HTML 片段通常被称为模板，使用 JavaScript 来操作它们并用数据填充它们会很快变得非常复杂。\n\n更糟糕的是，取决于你使用的框架，你的模板外观以及与数据交互的方式可能会有巨大差异。例如，在\
    \ Mustache 中使用模板看起来是这样：\n\n点击此处查看代码图片\n\n```javascript\nvar view = {\n  title:\
    \ \"Joe\",\n  calc: function () {\n    return 2 + 4;\n  }\n};\n\nvar output =\
    \ Mustache.render(\"{{title}} spends {{calc}}\", view);\n```\n\n有时，你的模板可能看起来像是一些你可以自豪地展示的整洁\
    \ HTML。尽管有这些缺点，单页应用并不会去哪里。它们是现在的一部分，并将完全构成未来。为了 React\n\nFacebook（以及 Instagram）认为已经够了。凭借对单页应用的丰富经验，他们发布了一个名为\
    \ React 的库（React 图标如图 1-6 所示），不仅解决了这些缺点，还改变了我们构建单页应用的方式。\n\n![Image](img/image0232.jpeg)\n\
    \n图 1-6 React 图标。\n\n在接下来的章节中，让我们来看看 React 带来的大。\n\n## 自动 UI 状态管理\n\n在单页应用中，跟踪\
    \ UI 并维护状态是困难且耗时的。在 React 中，你只需要担心一件事：你的 UI 的最终状态。你的 UI 初始状态并不重要。用户为了更改 UI 可能采取了什么步骤也不重要。重要的是你的\
    \ UI 到了哪里（见图 1-7）。\n\n![Image](img/image0233.jpeg)\n\n图 1-7 在 React 中，UI 的最终或结束状态才是重要的。\n\
    \nReact 处理所有其他事情。它找出需要做什么来确保你的 UI 被正确表示，因此所有状态管理的问题不再是你的负担。\n\n### 极速 DOM 操作\n\
    \n由于 DOM 修改非常慢，所以你永远在使用 React 直接修改 DOM。相反，你操作的是内存中的虚拟 DOM。图 1-8 象征着那个内存中的虚拟 DOM。\n\
    \n![Image](img/image0234.jpeg)\n\n图 1-8 想象一个内存中的虚拟 DOM。\n\n操作这个虚拟 DOM 极快，React\
    \ 在合适的时候更新真实的 DOM。它通过比较你的虚拟 DOM 和真实 DOM 之间的变化，找出哪些变化真正重要，并进行最少的 DOM 更改以保持一切同步更新，这一过程被称为“协调”（reconciliation）。\n\
    \n### 创建真正可组合 UI 的 API\n\nReact 不是将应用中的视觉元素视为一个单一的整体块，而是鼓励你将视觉元素拆分为更小的组件。\n"
- fmt: "\nJust like everything else in programming, it is a good idea to have things\
    \ be modular, compact, and self-contained. React extends that well-established\
    \ idea to how we should think about user interfaces as well. Many of React’s core\
    \ APIs make it easier to create smaller visual components that can later be combined\
    \ with other visual components to make larger and more complex visual components—kind\
    \ of like Russian Matryoshka dolls (see [Figure 1-9](#part0008.xhtml_ch01fig09)).\n\
    \n![Image](Images/image0235.jpeg)\n\nFigure 1-9 Russian Matryoshka dolls by Gnomz007.\n\
    \nSource: *[https://commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg](https://commons.wikimedia.org/wiki/File:Russian-Matroshka_no_bg.jpg)*\n\
    \nThis is one of the major ways React simplifies (and changes) how we think about\
    \ building the visuals for our web apps.\n\n## Visuals Defined Entirely in JavaScript\n\
    \nWhile this sounds ridiculously crazy and outrageous, hear me out. Besides using\
    \ a really weird syntax, HTML templates traditionally suffered from another major\
    \ problem. The variety of things you can do inside them other than simply displaying\
    \ data is limited. If you wanted to choose which piece of UI to display based\
    \ on a particular condition, for example, you had to write JavaScript somewhere\
    \ else in your app or use some weird framework-specific templating command to\
    \ make it work.\n\nFor example, here is what a conditional statement inside an\
    \ EmberJS template looks like:\n\n[Click here to view code image](#part0027.xhtml_p010pro01)\n\
    \n```html\n{{#if person}}\n\n  Welcome back, <b>{{person.firstName}} {{person.lastName}}</b>!\n\
    \n{{else}}\n\n  Please log in.\n\n{{/if}}\n```\n\nWhat React does is pretty neat.\
    \ By having your UI defined entirely in JavaScript, you get to use all of the\
    \ rich functionality JavaScript provides for doing all sorts of things inside\
    \ your templates (as you will see in a few chapters). You are limited only by\
    \ what `JavaScript` supports as opposed to any limitations imposed by your templating\
    \ framework.\n\nNow, when you think of visuals defined entirely in JavaScript,\
    \ you are probably thinking something horrible involving quotation marks, escape\
    \ characters, and a whole lot of `createElement` calls. Don’t worry. React gives\
    \ you the option to specify your visuals using an HTML-like syntax known as `JSX`\
    \ that lives fully alongside your JavaScript. Instead of writing code to define\
    \ your UI, you are basically specifying markup:\n\n```javascript\nReactDOM.render(\n\
    \n  <div>                        \n\n     <h1>Batman</h1>        \n\n     <h1>Iron\
    \ Man</h1>      \n\n     <h1>Nicolas Cage</h1> \n\n     <h1>Mega Man</h1>    \
    \  \n\n  </div>,             \n\n  destination\n\n);\n```\n\nThis same code defined\
    \ in JavaScript would look like this:\n\n[Click here to view code image](#part0027.xhtml_p010pro02)\n\
    \n```javascript\nReactDOM.render(React.createElement(\n  \"div\",\n  null,\n \
    \ React.createElement(\n    \"h1\",\n    null,\n    \"Batman\"\n  ),\n  React.createElement(\n\
    \    \"h1\",\n    null,\n    \"Iron Man\"\n  ),\n  React.createElement(\n    \"\
    h1\",\n    null,\n    \"Nicolas Cage\"\n  ),\n  React.createElement(\n    \"h1\"\
    ,\n    null,\n    \"Mega Man\"\n  )\n), destination);\n```\n\nYikes! By using\
    \ `JSX`, you are able to define your visuals very easily using a syntax that is\
    \ very familiar, while still getting all the power and flexibility that `JavaScript`\
    \ provides. Best of all, in React, your visuals and JavaScript often live in the\
    \ same location. You no longer have to jump between multiple files to define the\
    \ look and behavior of one visual component. This is templating done right.\n\n\
    ## Just the V in an MVC Architecture\n\nWe are almost done here! React is not\
    \ a full-fledged framework that has an opinion on how everything in your app should\
    \ behave. Instead, React works primarily in the `View` layer where all of its\
    \ worries and concerns revolve around your visual elements and keeping them up\
    \ to date. This means you are free to use whatever you want for the `M` and `C`\
    \ part of your `MVC` architecture. This flexibility enables you to pick and choose\
    \ what technologies you are familiar with, and this makes React useful not only\
    \ for new web apps you create but also for existing apps.\n\n## 2. Building Your\
    \ First App\n\nBy now, thanks to the previous chapter, you probably know all about\
    \ `React` and how it helps. In this chapter, we start at the very beginning and\
    \ get our hands dirty by building a simple app. We encounter some of these hurdles\
    \ head-on, and some of these we skip over. By the end of this chapter, not only\
    \ will we have built something you can show off to your friends, we’ll have set\
    \ ourselves nicely for dipping into all that `React` offers.\n\n### Dealing with\
    \ JSX\n\nBefore we start building our app, there is an important thing we should\
    \ cover first. `React` isn’t like many JavaScript libraries you have used. It\
    \ isn’t very happy when you simply refer to code you’ve written for it using a\
    \ script tag. `React` is annoyingly special that way, and it has to do with how\
    \ `React` apps are built.\n\nAs you know, your web apps (and everything your browser\
    \ displays) are made up of `HTML`, `CSS`, and `JavaScript`:\n\n![Image](Images/image0236.jpeg)\n\
    \nIt doesn’t matter if your web app was written using `React` or some other library\
    \ like `Angular`, `Knockout`, or `jQuery`. The end result has to be some combination\
    \ of `HTML`, `CSS`, and `JavaScript`. Otherwise, your browser really won’t know\
    \ what to do.\n\nNow, here is where the special nature of `React` comes in. Besides\
    \ normal `HTML`, `CSS`, and `JavaScript`, the bulk of your `React` code will be\
    \ written in something known as `JSX`.\n\nTo build a web app using `React`, we\
    \ need a way to take our `JSX` and convert it into plain old `JavaScript` that\
    \ your browser can understand.\n\nIf we didn’t do this, our `React` app simply\
    \ wouldn’t work. That’s not cool. Fortunately, there are two solutions to this:\n\
    \n**Set up a development environment around Node and a handful of build-tools.**\
    \ In this environment, every time you perform a build, all of your `JSX` is automatically\
    \ converted into `JS` and placed on disk for you to reference like any plain JavaScript\
    \ file.\n"
