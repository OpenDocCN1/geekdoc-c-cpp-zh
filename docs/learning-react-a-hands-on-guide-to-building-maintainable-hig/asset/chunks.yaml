    #### Installing and Initializing Node.js


    Our next step is to install Node.js. Visit the Node.js site ([https://nodejs.org/](https://nodejs.org/))
    to install the version that is appropriate for your operating system (see [Figure
    15-7](#part0022.xhtml_ch15fig07)).


    ![Image](Images/image00307.jpeg)


    Figure 15-7 The download buttons on the Node.js site.


    I tend to always install the latest version, so you should go with that as well.
    The download and installation procedure isn’t particularly exciting. Once you
    have Node.js installed, test to make sure it is truly installed by launching the
    Terminal (on Mac), Command Prompt (on Windows), or equivalent tool of choice and
    typing in the following and pressing Enter:


    node -v


    If everything worked out properly, you will see a version number displayed that
    typically corresponds to the version of Node.js you just installed. If you are
    getting an error for whatever reason, follow the troubleshooting steps listed
    here ([https://github.com/npm/npm/wiki/Troubleshooting](https://github.com/npm/npm/wiki/Troubleshooting)).


    Next, we are going to initialize Node.js on our **MyTotallyAwesomeApp** folder.
    To do this, first navigate to the **MyTotallyAwesomeApp** folder using your Terminal
    or Command Prompt. On OS X, this will look like [Figure 15-8](#part0022.xhtml_ch15fig08).


    ![Image](Images/image00308.jpeg)


    Figure 15-8 Navigate to the MyTotallyAwesomeApp folder.


    Now, go ahead and initialize Node.js by entering the following:


    npm init


    This will kick off a series of questions that will help set up Node.js on our
    project. The first question will ask you to specify your project name. Hitting
    Enter will allow you to specify the default value that has already been selected
    for you. That is all great, but the default name is our project folder, which
    is **MyTotallyAwesomeApp**. If you hit Enter, because it contains capital letters,
    it will throw an error (see [Figure 15-9](#part0022.xhtml_ch15fig09)).


    ![Image](Images/image00309.jpeg)


    Figure 15-9 Our project folder name includes capital letters, triggering an error.


    Go ahead and enter the lowercase version of the name, **mytotallyawesomeapp**.
    Once you’ve done that, press Enter. For the remaining questions, just hit Enter
    to accept all the default values. The end result of all of this is a new file
    called **package.json** that will be created in your **MyTotallyAwesomeApp** folder
    (see [Figure 15-10](#part0022.xhtml_ch15fig10)).


    ![Image](Images/image00310.jpeg)


    Figure 15-10 The package.json file shows up in your folder.


