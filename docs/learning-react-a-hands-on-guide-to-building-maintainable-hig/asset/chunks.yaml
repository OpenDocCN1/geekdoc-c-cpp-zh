    \n不过，就是这样。这就是对我们所有的 JSX 到底发生了什么的答案。它们被变成了美妙、极好的 JavaScript。\n\n## 需要记住的 JSX 特性\n\
    \n在我们处理 JSX 的过程中，你可能注意到我们遇到了一些关于你可以做什么和不能做什么的事的任意规则和例外。在本节中，让我们把所有这些特性汇总在一起，也许我们还会遇到一些全新的特性！\n\
    \n### 你只能返回单个根节点\n\n这可能是我们遇到的第一个特性。在 JSX 中，你所返回或渲染的内容不能由多个根元素组成：\n\n点击查看代码图片\n\
    \n```javascript\nReactDOM.render(\n  <Letter>B</Letter>\n  <Letter>E</Letter>\n\
    \  <Letter>I</Letter>\n  <Letter>O</Letter>\n  <Letter>U</Letter>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n如果你想做类似这样的操作，你需要先将所有元素封装在一个父元素中：\n\n点击查看代码图片\n\n```javascript\n\
    ReactDOM.render(\n  <div>\n    <Letter>A</Letter>\n    <Letter>E</Letter>\n  \
    \  <Letter>I</Letter>\n    <Letter>O</Letter>\n    <Letter>U</Letter>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\n当在在我们之前看到它时，这似乎是一个奇怪的要求，但你可以归咎于\
    \ `createElement`。在 `render` 和 `return` 函数中，你最终返回的是一个 `createElement` 调用（其内部可能有许多嵌套的\
    \ `createElement` 调用）。这是我们之前的 JSX 转换为 JavaScript 的样子：\n\n点击查看代码图片\n\n```javascript\n\
    ReactDOM.render(React.createElement(\n  \"div\",\n  null,\n  React.createElement(\n\
    \    Letter,\n    null,\n    \"A\"\n  ),\n  React.createElement(\n    Letter,\n\
    \    null,\n    \"E\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n\
    \    \"I\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n    \"O\"\n\
    \  ),\n  React.createElement(\n    Letter,\n    null,\n    \"U\"\n  )\n), document.querySelector(\"\
    #container\"));\n```\n\n拥有多个根元素会破坏函数的返回值以及 `createElement` 的工作原理，这就是为什么你只能指定一个（根）元素！知道这一点后你可以睡得更好。\n\
    \n### 你不能内联指定 CSS\n\n正如我们在第 4 章 中看到的，JSX 中的 `style` 属性与 HTML 中的 `style` 属性不同。在\
    \ HTML 中，你可以在 `style` 属性上指定 CSS 属性：\n\n点击查看代码图片\n\n```html\n<div style=\"font-family:Arial;font-size:24px\"\
    >\n  <p>Blah!</p>\n</div>\n```\n\n在 JSX 中，`style` 属性不能包含 CSS。相反，它需要引用一个包含样式的对象：\n\
    \n点击查看代码图片\n\n```javascript\nvar Letter = React.createClass({\n  render: function()\
    \ {\n    var letterStyle = {\n      padding: 10,\n      margin: 10,\n      backgroundColor:\
    \ this.props.bgcolor,\n      color: \"#333\",\n      display: \"inline-block\"\
    ,\n      fontFamily: \"monospace\",\n      fontSize: \"32\",\n      textAlign:\
    \ \"center\"\n    };\n    return (\n      <div style={letterStyle}>\n        {this.props.children}\n\
    \      </div>\n    );\n  }\n});\n```\n\n注意我们有一个名为 `letterStyle` 的对象，包含了所有的 CSS\
    \ 属性（驼峰形式的 JavaScript）及其值。这就是我们指定 `style` 属性的对象。\n\n### 保留关键字与 `className`\n\n\
    JavaScript 有许多你不能作为标识符使用的关键字和值。截至 2016 年的这些关键字为：\n\n![图像](img/image0268.jpeg)\n\
    \n编写 JSX 时，你应该注意不要将这些关键字作为你创建的任何标识符。当某些像 `class` 这样非常流行的关键字在 HTML 中被常用，尽管它们也在\
    \ JavaScript 的保留列表中时，这可能会很困难。\n\n看看以下内容：\n\n点击查看代码图片\n\n```javascript\nReactDOM.render(\n\
    \  <div class=\"slideIn\">\n    <p class=\"emphasis\">Gabagool!</p>\n    <Label/>\n\
    \  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n忽略 JavaScript\
    \ 对 `class` 的保留（如我们在这里所做的）是不可通的。你需要做的是使用 `class` 属性的 DOM API 版本，即 `className`：\n\
    \n点击查看代码图片\n\n```javascript\nReactDOM.render(\n  <div className=\"slideIn\">\n\
    \    <p className=\"emphasis\">Gabagool!</p>\n    <Label/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n你可以在下面的 Facebook 文章中看到支持的标签和属性的完整列表（[`facebook.github.io/react/docs/tags-and-attributes.html`](https://facebook.github.io/react/docs/tags-and-attributes.html)），并注意到所有属性都是驼峰命法。这个细节很重要，因为使用属性的小写版本将不起作用。如果你以后粘贴了一大段你想让\
