    \n### 渲染状态\n\n如果你现在预览应用程序，你会看到我们的 `strikes` 值开始增加（见图 8-2）。\n\n保持数据和 UI 同步是 UI\
    \ 开发中最困难的问题之一，所以让 React 来处理这些很棒。\n\n### 可选：完整代码\n\n我们现在拥有的一个每秒增加 100 的计数器。它看起来完全不像*闪电计数器*，但它涵盖了现在我想让你学习的所有状态知识。如果你想额外充实你的示例使其像我们在开始看到的我的版本，下面是放入我们\
    \ `script` 标签中的完整代码：\n\n```javascript\nvar LightningCounter = React.createClass({\n\
