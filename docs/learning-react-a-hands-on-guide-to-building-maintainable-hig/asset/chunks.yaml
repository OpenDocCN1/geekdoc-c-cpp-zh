    \ methods get called (see [Figure 11-4](#part0018.xhtml_ch11fig04)).\n\n![Image](Images/image0280.jpeg)\n\
    \nFigure 11-4 The lifecycle methods called initially.\n\nWhat you saw in your\
    \ console when the example was loaded was a less colorful version of what you\
    \ saw here. Now, we are going to go a bit further and learn more about what each\
    \ of these lifecycle methods do.\n\n#### `getDefaultProps`\n\nThis method allows\
    \ you to specify the default value of `this.props`. It gets called before your\
    \ component is even created or any props from parents are passed in.\n\n#### `getInitialState`\n\
    \nThis method allows you to specify the default value of `this.state` before your\
