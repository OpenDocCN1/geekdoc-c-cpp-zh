    \ HTML 到 JSX 转换器来帮助你。最后，将 HTML 转换为地道的 React 代码通常需要大量工作来将标记拆分为合理的组件，因此将 `class`\
    \ 改为 `className` 只是其中的一小部分。\n\n### 注释\n\n正如为 HTML、CSS 和 JavaScript 注释是个主意一样，在\
    \ JSX 中提供注释也是个主意。在 JSX 中指定注释与你在 JavaScript 中注释非常相似（[https://www.kirupa.com/html5/comments.htm](https://www.kirupa.com/html5/comments.htm)）……唯一的例外是如果你将注释作为标签的子，你需要用\
    \ `{` 和 `}` 大括号包裹你的注释，以确保它被解析为表达式：\n\n点击查看代码图片\n\n```javascript\nReactDOM.render(\n\
    \  <div class=\"slideIn\">\n    <p class=\"emphasis\">Gabagool!</p>\n    {/* 我是一个子注释\
    \ */}\n    <Label/>\n  </div>,\n  document.querySelector(\"#container\")\n);\n\
    ```\n\n"
