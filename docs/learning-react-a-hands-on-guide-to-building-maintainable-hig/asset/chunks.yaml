  trans: "\n我们有一个名为 `items` 的数组，其中包含三个值。我们还有一个名为 `printStuff` 的函数，它接受三个参数。我们想要将的是\
    \ `items` 数组中的三个值作为参数传递给 `printStuff` 函数。听起来很简单，对吧？\n\n这里是实现这一目的非常常用的方法：\n\n点击此处查看代码图像\n\
    \n```javascript\nprintStuff(items[0], items[1], items[2]);\n```\n\n我们逐个访问数组中的每个项，并将其传递给我们的\
    \ `printStuff` 函数。有了扩展运算符（spread operator），现在我们有了一种更更简单的方法。你完全不需要逐个指定数组中的每一个项。你只需要像这样操作即可：\n\
    \n```javascript\nprintStuff(...items);\n```\n\n扩展运算符就是 `items` 数组之前的 `...` 字符，使用\
    \ `...items` 与我们之前逐个列出 `items[0]`、`items[1]` 和 `items[2]` 是完全等同的。`printStuff`\
    \ 函数将运行并在我们的控制台中打印数字 1、2 和 3。很酷，对吧？\n\n既然你已经看到了扩展运算符的实际用法，是时候定义它了。*扩展运算符允许你将一个数组解包为它的单个元素*。扩展运算符还会做其他一些事情，但现在并不重要。我们将只使用扩展运算符的这一特定特性来解决我们的属性传递问题！\n\
    \n## 正确地传递属性\n\n我们刚刚看到一个示例，其中我们使用扩展运算符避免了在将数组传递给函数时枚举数组中的每一个项：\n\n点击此处查看代码图像\n\
    \n```javascript\nvar items = [\"1\", \"2\", \"3\"];\n\nfunction printStuff(a,\
    \ b, c) {\n  console.log(\"Printing: \" + a + \" \" + b + \" \" + c);\n}\n\n//\
    \ 使用扩展运算符\nprintStuff(...items);\n\n// 不使用扩展运算符\nprintStuff(items[0], items[1],\
    \ items[2]);\n```\n\n我们在跨组件传递属性时面临的情况，与我们逐个访问数组中每个项的问题非常相似。让我来详细说明一下。\n\n在组件内部，我们的\
    \ `props` 对象如下：\n\n```javascript\nvar props = {\n  color: \"steelblue\",\n  num:\
    \ \"3.14\",\n  size: \"medium\"\n}\n```\n\n在将这些属性值传递给子组件的过程中，我们手动访问了 `props` 对象中的每一个项：\n\
    \n点击此处查看代码图像\n\n```jsx\n<Display color={this.props.color}\n         num={this.props.num}\n\
    \         size={this.props.size}/>\n```\n\n如果有一种方法可以解包对象并传递属性/值对，就像我们能够使用扩展运算符解包数组那样，那不是太好了吗？\n\
    \n事实证明，确实有这种方法。它实际上也涉及扩展运算符。我稍后会解释，但这意味着我们可以通过 `...props` 来调用我们的 `Display` 组件：\n\
    \n```jsx\n<Display {...props}/>\n```\n\n通过使用 `...props`，运行时行为与手动指定 `color`、`num`\
    \ 和 `size` 属性是相同的。这意味着我们之前的示例可以简化如下（注意高亮的行）：\n\n点击此处查看代码图像\n\n```javascript\n\
    var Display = React.createClass({\n  render: function() {\n    return(\n     \
    \ <div>\n        <p>{this.props.color}</p>\n        <p>{this.props.num}</p>\n\
    \        <p>{this.props.size}</p>\n      </div>\n    );\n  }\n});\n\nvar Label\
    \ = React.createClass({\n  render: function() {\n    return (\n      <Display\
    \ {...this.props}/>   \n    );\n  }\n});\n\nvar Shirt = React.createClass({\n\
    \  render: function() {\n    return (\n      <div>\n        <Label />\n      </div>\n\
    \    );\n  }\n});\n\n// 假设此处有对应的 render 逻辑\nReactDOM.render(\n  <div>\n    <Shirt\
    \ color=\"steelblue\" num=\"3.14\" size=\"medium\"/>\n  </div>,\n  document.getElementById(\"\
    container\")\n);\n```\n*(注：由于原文提供的代码块在结尾处不完整或存在断层，翻译已根据上下文补全了逻辑结构)*\n"
- fmt: "\n```javascript\nrender: function render() {\n  var cardStyle = {\n    height:\
    \ 200,\n    width: 150,\n    padding: 0,\n    backgroundColor: \"#FFF\",\n   \
    \ WebkitFilter: \"drop-shadow(0px 0px 5px #666)\",\n    filter: \"drop-shadow(0px\
    \ 0px 5px #666)\"\n  };\n  return React.createElement(\n    \"div\",\n    { style:\
    \ cardStyle },\n    React.createElement(Square, { color: this.props.color }),\n\
    \    React.createElement(Label, { color: this.props.color })\n  );\n}\n```\n\n\
    Notice that there is no trace of JSX anywhere! All of these changes between what\
    \ you wrote and what our browser sees are part of the transpiling step we’ve talked\
    \ about in the first chapter. That transpilation is something that happens entirely\
    \ behind-the-scenes thanks to `Babel`, which we’ve been to perform this JSX→JS\
    \ transformation entirely in the browser. We’ll eventually look at using `Babel`\
    \ as part of a more-involved build environment where we will just generate a transformed\
    \ JS file, but more on that when we get there in the future.\n\nBut yeah, there\
    \ you have it. An answer to what exactly happens to all of our JSX. It gets turned\
    \ into sweet SWEET JavaScript.\n\n## JSX Quirks to Remember\n\nAs we’ve been working\
    \ with JSX, you probably noticed that we ran into some arbitrary rules and exceptions\
    \ to what you can and can’t do. In this section, let’s put all of those quirks\
    \ together in one area and maybe even run into some brand new ones!\n\n### You\
    \ Can Only Return A Single Root Node\n\nThis is probably the first quirk we ran\
    \ into. In JSX, what you return or render can’t be made up of multiple root elements:\n\
    \n[Click here to view code image](#part0033.xhtml_p083pro01)\n\n```javascript\n\
    ReactDOM.render(\n  <Letter>B</Letter>\n  <Letter>E</Letter>\n  <Letter>I</Letter>\n\
    \  <Letter>O</Letter>\n  <Letter>U</Letter>,\n  document.querySelector(\"#container\"\
    )\n);\n```\n\nIf you want to do something like this, you need to wrap all of your\
    \ elements into a single parent element first:\n\n[Click here to view code image](#part0033.xhtml_p083pro02)\n\
    \n```javascript\nReactDOM.render(\n  <div>\n    <Letter>A</Letter>\n    <Letter>E</Letter>\n\
    \    <Letter>I</Letter>\n    <Letter>O</Letter>\n    <Letter>U</Letter>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\nThis seemed like a bizarre\
    \ requirement when we looked at it before, but you can blame `createElement` for\
    \ why we do this. With the `render` and `return` functions, what you are ultimately\
    \ returning is a single `createElement` call (which in turn might have many nested\
    \ `createElement` calls). Here is what our earlier JSX looks like when turned\
    \ into JavaScript:\n\n[Click here to view code image](#part0033.xhtml_p084pro01)\n\
    \n```javascript\nReactDOM.render(React.createElement(\n  \"div\",\n  null,\n \
    \ React.createElement(\n    Letter,\n    null,\n    \"A\"\n  ),\n  React.createElement(\n\
    \    Letter,\n    null,\n    \"E\"\n  ),\n  React.createElement(\n    Letter,\n\
    \    null,\n    \"I\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n\
    \    \"O\"\n  ),\n  React.createElement(\n    Letter,\n    null,\n    \"U\"\n\
    \  )\n), document.querySelector(\"#container\"));\n```\n\nHaving multiple root\
    \ elements would break how functions return values and how `createElement` works,\
    \ so that is why you can specify only one return (root) element! You can now sleep\
    \ better knowing this.\n\n### You Can’t Specify CSS Inline\n\nAs we saw in [Chapter\
    \ 4](#part0011.xhtml_ch04), the `style` attribute in your JSX behaves differently\
    \ from the `style` attribute in HTML. In HTML, you can specify CSS properties\
    \ as values on your `style` attribute:\n\n[Click here to view code image](#part0033.xhtml_p083pro02)\n\
    \n```html\n<div style=\"font-family:Arial;font-size:24px\">\n  <p>Blah!</p>\n\
    </div>\n```\n\nIn JSX, the `style` attribute can’t contain CSS inside it. Instead,\
    \ it needs to refer to an object that contains styling:\n\n[Click here to view\
    \ code image](#part0033.xhtml_p085pro01)\n\n```javascript\nvar Letter = React.createClass({\n\
    \  render: function() {\n    var letterStyle = {\n      padding: 10,\n      margin:\
    \ 10,\n      backgroundColor: this.props.bgcolor,\n      color: \"#333\",\n  \
    \    display: \"inline-block\",\n      fontFamily: \"monospace\",\n      fontSize:\
    \ \"32\",\n      textAlign: \"center\"\n    };\n    return (\n      <div style={letterStyle}>\n\
    \        {this.props.children}\n      </div>\n    );\n  }\n});\n```\n\nNotice\
    \ that we have an object called `letterStyle` that contains all of the CSS properties\
    \ (in camelcase JavaScript form) and their values. That object is what we then\
    \ specify to the `style` attribute.\n\n### Reserved Keywords and `className`\n\
    \nJavaScript has a bunch of keywords and values that you can’t use as identifiers.\
    \ Those keywords currently (as of2016) are:\n\n![Image](Images/image0268.jpeg)\n\
    \nWhen you are writing JSX, you should be careful to not use these keywords as\
    \ part of any identifiers you create. That can be difficult when certain really\
    \ popular keywords like `class` are commonly used in HTML despite also being in\
    \ JavaScript’s reserved list.\n\nTake a look at the following:\n\n[Click here\
    \ to view code image](#part0033.xhtml_p086pro01)\n\n```javascript\nReactDOM.render(\n\
    \  <div class=\"slideIn\">\n    <p class=\"emphasis\">Gabagool!</p>\n    <Label/>\n\
    \  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\nIgnoring JavaScript’s\
    \ reservations about `class` (like what we’ve done here) won’t work. What you\
    \ need to do is use the DOM API version of the `class` attribute called `className`\
    \ instead:\n\n[Click here to view code image](#part0033.xhtml_p086pro02)\n\n```javascript\n\
    ReactDOM.render(\n  <div className=\"slideIn\">\n    <p className=\"emphasis\"\
    >Gabagool!</p>\n    <Label/>\n  </div>,\n  document.querySelector(\"#container\"\
    )\n);\n```\n\nYou can see the full list of supported tags and attributes at the\
    \ following Facebook article ([https://facebook.github.io/react/docs/tags-and-attributes.html](https://facebook.github.io/react/docs/tags-and-attributes.html)),\
    \ and notice that all of the attributes are camelcase. That detail is important,\
    \ for using the lowercase version of an attribute won’t work. If you are ever\
    \ pasting a large chunk of HTML that you want JSX to deal with, be sure to go\
    \ back to your pasted HTML and make these minor adjustments to turn it into valid\
    \ JSX.\n\nThis brings up another point. Because of these minor deviations from\
    \ HTML behavior, we tend to say that JSX supports an HTML-like syntax as opposed\
    \ to just saying that JSX supports HTML. This is a deliberate React-ism. The clearest\
    \ answer to the relationship between JSX and HTML comes from React team member,\
    \ Ben Alpert, who stated the following ([http://qr.ae/RUKaON](http://qr.ae/RUKaON))\
    \ as part of a Quora answer:\n\n...our thinking is that JSX’s primary advantage\
    \ is the symmetry of matching closing tags which makes [sic] code easier to read,\
    \ not the direct resemblance to HTML or XML. It’s convenient to copy/paste HTML\
