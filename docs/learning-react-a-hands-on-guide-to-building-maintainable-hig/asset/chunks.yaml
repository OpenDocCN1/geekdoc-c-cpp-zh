    \n### 起始点\n\n为了节省大家的时间，我们不会从零开始创建示例中的所有内容。到目前为止，你可能已经对如何处理组件、样式、状态等有了了良好的了解。相反，我们将从一个部分实现的示例开始，它包含了除了我们在这里要学习的事件相关功能之外的所有内容。\n\
    \n首先，创建一个新的 HTML 文档，并确保你的起点看起来如下：\n\n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n\
