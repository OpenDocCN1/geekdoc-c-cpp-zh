    \ Babel 发挥作用的地方。要安装 Babel，让我们回到我们信赖的终端或命令提示符，输入以下 Node.js 命令：\n\n```bash\nnpm\
    \ install babel-loader babel-preset-es2015 babel-preset-react --save\n```\n\n\
    通过这条命令，我们安装了 `babel-loader`、`babel-preset-es2015` 和 `babel-preset-react` 包。现在我们需要配置\
    \ Babel 以与我们的项目协作。这是一个两步骤的过程。\n\n第一步是指定我们想要使用的 Babel 预设。有几种方法可以实现，但我常用的方法是修改 `package.json`\
    \ 并添加以下高亮内容：\n\n```json\n{\n  \"name\": \"mytotallyawesomeapp\",\n  \"version\"\
    : \"1.0.0\",\n  \"description\": \"\",\n  \"main\": \"index.js\",\n  \"scripts\"\
    : {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n\
    \  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"dependencies\": {\n    \"babel-loader\"\
    : \"⁶.2.4\",\n    \"babel-preset-es2015\": \"⁶.9.0\",\n    \"babel-preset-react\"\
    : \"⁶.5.0\",\n    \"react\": \"¹⁵.1.0\",\n    \"react-dom\": \"¹⁵.1.0\",\n   \
    \ \"webpack\": \"¹.13.1\"\n  },\n  \"babel\": {\n    \"presets\": [\n      \"\
    es2015\",\n      \"react\"\n    ]\n  }\n}\n```\n\n在高亮行中，我们指定了 `babel` 对象并指定了 `es2015`\
    \ 和 `react` 预设值。\n\n第二步是告诉 webpack 关于 Babel。在我们的 `webpack.config.js` 文件中，添加以下高亮行：\n\
    \n```javascript\nvar webpack = require(\"webpack\");\nvar path = require(\"path\"\
    );\nvar DEV = path.resolve(__dirname, \"Dev\");\nvar OUTPUT = path.resolve(__dirname,\
    \ \"output\");\nvar config = {\n  entry: DEV + \"/index.jsx\",\n  output: {\n\
    \    path: OUTPUT,\n    filename: \"myCode.js\"\n  },\n  module: {\n    loaders:\
    \ [{\n      include: DEV,\n      loader: \"babel\",\n    }]\n  }\n};\n\nmodule.exports\
    \ = config;\n```\n\n### 构建并测试我们的项目\n\n我们当前配置的最后一部分是将我们的 `index.jsx` 文件转换为 `myCode.js`\
    \ 形式的普通 JavaScript。这就是 Babel 发挥作用的地方。要安装 Babel，让我们回到我们信赖的终端或命令提示符，输入以下 Node.js\
    \ 命令：\n\n```bash\nnpm install babel-loader babel-preset-es2015 babel-preset-react\
    \ --save\n```\n\n通过这条命令，我们安装了 `babel-loader`、`babel-preset-es2015` 和 `babel-preset-react`\
    \ 包。现在我们需要配置 Babel 以与我们的项目协作。这是一个两步骤的过程。\n\n第一步是指定我们想要使用的 Babel 预设。有几种方法可以实现，但我常用的方法是修改\
    \ `package.json` 并添加以下高亮内容：\n\n在高亮行中，我们指定了 `babel` 对象并指定了 `es2015` 和 `react` 预设值。\n\
    \n第二步是告诉 webpack 关于 Babel。在我们的 `webpack.config.js` 文件中，添加以下高亮行：\n\n### 总结\n\n\
    好吧……这一切就发生了！在之前的许多章节中，我们遵循了一系列奇异且难以理解的步骤来搭建我们的构建环境。我们看到的只是将 Node、Babel 和 webpack\
    \ 结合时可以实现的功能的一小部分。遗憾的是，涵盖所有这些远超学习 React 的范围，但如果你感兴趣，我们定义了两个名为 `DEV` 和 `OUTPUT`\
    \ 的变量，它们指向项目中同名的文件夹。在 `config` 对象中，我们有两个名为 `entry` 和 `output` 的属性，它们使用 `DEV` 和\
    \ `OUTPUT` 变量来帮助将我们的 `index.jsx` 文件映射为 `myCode.js`。\n\n## 16. 结语\n\n所以……我们走到这里了。经过\
    \ 15 个章节，我们在学习如何使用 React 构建酷东西方面涵盖了大量领域。不久前，我们从讨论构建复杂 UI 的相关问题开始，以及 React 将如何让这一切轻而易举。希望在随后的章节中，你已经对如何使用\
    \ React 来实现这一点有了很好的理解。\n\n"
