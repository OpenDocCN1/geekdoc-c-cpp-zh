  trans: "\n\n在现实世界中，你被要求在 React 中实现的内容永远不会像姓名列表或彩色元音块那么简单。相反，你将得到某个复杂用户界面的视觉呈现。这种视觉呈现可以采取许多形式——涂鸦、图表、截图、视频、标注稿、设计稿等。让所有这些静态像素活起来取决于你，而我们将通过通过一些动手实践来完成这一任务。\n\
    \n我们要做的是构建一个简单的调色板卡片（参见图 5-2）。\n\n![Image](img/image00250.jpeg)\n\n图 5-2 一个简单的调色板卡片。\n\
    \n如果你不确定这些是什么，这些小矩形卡片有助于你将颜色与特定类型的油漆相匹配。你经常会在家居用品商店或任何销售油漆的地方看到它们。你的设计师朋友可能可能在家里有一个巨大的衣柜专门存放这些东西。无论如何，我们的任务是使用\
    \ React 重现这些卡片之一。\n\n实现这一目标有多种方法，但我将向你展示一种非常系统化的方法，它将帮助你简化并理解即使是最复杂的用户界面。这种方法涉及两个步骤：\n\
    \n1. 识别主要的视觉元素\n2. 确定组件将是什么\n\n这两个步骤听起来都非常复杂，但随着我们的不断进行，你会发现这没什么好担心的。\n\n### 识别主要的视觉元素\n\
    \n第一步是识别我们正在处理的所有视觉元素。没有任何视觉元素是微小到可以忽略的——至少起初不是。开始识别相关部分最简单的方法是从明显的视觉元素开始，然后深入研究不那么明显的元素。\n\
    \n我们在示例中首先看到的第一个元素是卡片本身（参见图 5.3）。\n\n![Image](img/image00251.jpeg)\n\n图 5-3 卡片。\n\
    \n在卡片内部，你会发现有两个不同的区域。顶部区域是一个显示特定颜色的矩形区域。底部是一个显示十六进制值（hex value）的白色区域。\n\n让我们标出这两个视觉元素，并将它们排列成树状结构，如图\
    \ 5-4 所示。\n\n![Image](img/image00252.jpeg)\n\n图 5-4 树状结构。\n\n将视觉效果排列成这种树状结构（又称为**视觉层次结构**）是更好地感受你的视觉元素如何分组的好方法。此练习的目标是识别重要的视觉元素，并将它们分解为父/子结构，直到你无法进一步划分它们。\n\
    \n***\n\n**尝试忽略实现细节**\n\n虽然这很难，但现在先不要考虑实现细节。不要专注于根据所需的 HTML 和 CSS 组合来划分你的视觉元素。以后有的是时间做这些！\n\
    \n***\n\n继续下去，我们可以看到我们的彩色矩形不是我们我们可以进一步划分的东西。但这并不意味着我们已经结束了。我们可以将标签与环绕它的白色区域进一步分开。现在，我们的视觉层次结构看起来如图\
    \ 5-5 所示，我们的标签和白色区域在树结构中占据了独立的位置。\n\n![Image](img/image00253.jpeg)\n\n图 5-5 将内容进一步细分为标签及其周围的白色区域。\n\
    \n到此，我们已经没有其他可以进一步划分的内容了。我们完成了识别和划分视觉元素的工作，所以下一步是利用我们在这里发现的内容帮助我们识别组件。\n\n###\
    \ 识别组件\n\n这里事情变得有点有趣了。我们需要确定已识别的视觉元素中，哪些将转换为组件，哪些不会。并不是每个视觉元素都需要转换为组件，我们也绝对不想创建极少数极其复杂的组件。这其中需要一种平衡（参见图\
    \ 5-6）。\n\n![Image](img/image00254.jpeg)\n\n图 5-6 组件既不多少也不过多。\n\n确定哪些视觉元素成为组件的一部分，哪些不是，是一门艺术。通用的规则是，我们的组件应该只做一件事。如果你发现你的潜在组件最终会做太多事情，那么你可能可能想将该组件拆分为多个组件。反之，如果你的潜在组件做的事情太少，你可能想完全跳过将该视觉元素创建为组件步骤。\n\
    \n让我们尝试确定示例中哪些元素可以作为很好的组件。从我们的视觉层次结构来看，一眼就能看出，卡片和彩色矩形似乎都符合制作优秀组件的标准。卡片充当外部容器，而彩色矩形仅显示颜色。\n\
    \n但这只是给我们的标签和环绕它的白色区域打了一个问号（参见图 5-7）。\n\n![Image](img/image00255.jpeg)\n\n图 5-7\
    \ 标签及其周围白色空间上的问号。\n\n这里的重点是标签本身。没有了它，我们就看不到十六进制值。这只剩下白色区域。它所起的作用仅仅是空白。白色区域将不会转换为组件。\n\
    \n到目前，我们已经识别了三个组件，层次结构如图 5-8 所示。\n\n### 创建组件\n\n这部分是简单的——某种意义上的。是时候开始编写代码了。我们需要一个大部分空的页面：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>更多!</title>\n  <script src=\"\
    https://unpkg.com/react@5.3.2/dist/react.js\"></script>\n  <script src=\"https://unpkg.com/react-dom@5.3.2/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/babel.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n\
    \  <script type=\"text/babel\">\n    ReactDOM.render(\n      <div></div>,\n  \
    \    document.querySelector(\"#container\")\n    );\n  </script>\n</body>\n</html>\n\
    ```\n\n花点时间看看这个页面的情况。并没有什么——只需要让 React 在我们的 `container` 元素中渲染一个 `div`。\n\n完成这些后，是时候定义我们的组件了。我们将组件命名为\
    \ `Card`、`Label` 和 `Square`。请在 `ReactDOM.render` 函数的正上方添加以下代码：\n\n```javascript\n\
    var Square = React.createClass({\n  render: function() {\n    return(\n      <p>Nothing</p>\n\
    \    );\n  }\n});\n```\n\n"
- fmt: "\n```javascript\nvar Label = React.createClass({\n  render: function() {\n\
    \    return (\n      <p>Nothing</p>\n    );\n  }\n});\n\nvar Card = React.createClass({\n\
    \  render: function() {\n    return (\n\n    );\n  }\n});\n\nReactDOM.render(\n\
    \  <div>\n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\nWithin\
    \ our three components, we also threw in the `render` function that each component\
    \ absolutely needs to function. Other than that, our components are empty. In\
    \ the following sections, we will fix that by filling them in.\n\n### The Card\
    \ Component\n\nWe are going to start at the top of our component hierarchy and\
    \ focus on our `Card` component first. This component will act as the the container\
    \ that our `Square` and `Label` components will live in.\n\nTo implement it, go\
    \ ahead and make the following highlighted modifications:\n\n[Click here to view\
    \ code image](#part0031.xhtml_p058pro01)\n\n```javascript\nvar Card = React.createClass({\n\
    \  render: function() {\n    var cardStyle = {\n      height: 200,\n      width:\
    \ 150,\n      padding: 0,\n      backgroundColor: \"#FFF\",\n      WebkitFilter:\
    \ \"drop-shadow(0px 0px #666)\",\n      filter: \"drop-shadow(0px 0px #666)\"\n\
    \    };\n    return (\n      <div style={cardStyle}>\n      </div>\n    );\n \
    \ }\n});\n```\n\nWhile this seems like a lot of changes, the bulk of the lines\
    \ are going into styling the output of our `Card` component via the `cardStyle`\
    \ object. Inside the object, notice that we specify a vendor-prefixed version\
    \ of the `filter` property with `WebkitFilter`. That’s not the interesting detail.\
    \ The interesting detail is the capitalization. Instead of the first letter being\
    \ camelcased as `webkitFilter`, the `W` is actually capitalized. That isn’t how\
    \ normal CSS properties are represented, so keep that in mind if you ever need\
    \ to specify a vendor-prefixed property.\n\nThe rest of the changes are prettypressive.\
    \ We return a `div` element, and that element’s `style` attribute is set to our\
    \ `cardStyle` object. Now, to see our `Card` component in action, we need to display\
    \ it in our DOM as part of the `ReactDOM.render` function. To make that happen,\
    \ go ahead and make the following highlighted change:\n\n[Click here to view code\
    \ image](#part0031.xhtml_p059pro01)\n\n```javascript\nReactDOM.render(\n  <div>\n\
    \    <Card/>\n  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n\
    All we are doing is telling the `ReactDOM.render` function to render the output\
    \ of our `Card` component by invoking it. If everything worked out properly, you’ll\
    \ see the same thing as in [Figure 5-9](#part0012.xhtml_ch05fig09) if you test\
    \ your app.\n\n![Image](Images/image00257.jpeg)\n\nFigure 5-9 The result of your\
    \ test—the outline of the color palette card.\n\nYes, it is just the outline of\
    \ our color palette card, but that is definitely more than what we started out\
    \ with just a few moments ago!\n\n### The Square Component\n\nIt’s time to go\
    \ one level down in our component hierarchy and look at our `Square` component.\
    \ This is a pretty straightforward one, so make the following highlighted changes:\n\
    \n[Click here to view code image](#part0031.xhtml_p060pro01)\n\n```javascript\n\
    var Square = React.createClass({\n  render: function() {\n    var squareStyle\
    \ = {\n      height: 150,\n      backgroundColor: \"#FF663\"\n    };\n    return(\n\
    \      <div style={squareStyle}>\n      </div>\n    );\n  }\n});\n```\n\nJust\
    \ like our `Card` component, we are returning a `div` element whose `style` attribute\
    \ is set to a `style` object that defines this component looks. To see our `Square`\
    \ component in action, we need to get it onto our DOM like we did with the `Card`\
    \ component. The difference this around is that we won’ be calling the `Square`\
    \ component via our `ReactDOM.render` function. Instead, we’ll call the `Square`\
    \ component from inside the `Card` component. To see what I mean, go back to our\
    \ `Card` component’s render function, and make the following change:\n\n[Click\
    \ here to view code image](#part0031.xhtml_p060pro02)\n\n```javascript\nvar Card\
    \ = React.createClass({\n  render: function() {\n    var cardStyle = {\n     \
    \ height: 200,\n      width: 150,\n      padding: 0,\n      backgroundColor: \"\
    #FFF\",\n      WebkitFilter: \"drop-shadow(0px 0px #666)\",\n      filter: \"\
    drop-shadow(0px 0px #666)\"\n    };\n    return (\n      <div style={cardStyle}>\n\
    \        <Square/>\n      </div>\n    );\n  }\n});\n```\n\nAt point, if you preview\
    \ our app, you’ll see a colorful square making an appearance (see [Figure 5-10](#part0012.xhtml_ch05fig10)).\n\
    \n![Image](Images/image00258.jpeg)\n\nFigure 5-10 The red portion appears.\n\n\
    The cool thing to call out is that we called our `Square` component from inside\
    \ the `Card` component! This is an example of **composability** where one component\
    \ relies on the output of another component. The final thing you see is the result\
    \ of these two components colluding with each other. Isn’t collusion just beautiful—at\
    \ least in this context?\n\n### The Label Component\n\nThe last component that\
