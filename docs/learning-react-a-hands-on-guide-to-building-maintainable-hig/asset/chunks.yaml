    #container\")\n\n);\n```\n\n我们所做的是创建一个名为 `HelloWorld` 的新组件。这个 `HelloWorld` 组件目前什么都不做。事实上，在目前它基本上是一个空的\
    \ JavaScript 对象。在这个对象内部，你可以放置各种属性来进一步定义 `HelloWorld` 的功能。你定义的一些属性是特殊的，被 React\
    \ 用来帮助你的组件施展“魔术”。其中一个强制性属性就是 `render`。\n\n请继续通过添加如下文所示的 `render` 属性来修改我们的 `HelloWorld`\
