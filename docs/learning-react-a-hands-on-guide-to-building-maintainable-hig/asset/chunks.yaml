    #### Capitalization, HTML Elements, and Components


    Capitalization is important. To represent HTML elements, ensure the HTML tag is
    lower-case:


    [Click here to view code image](#part0033.xhtml_p087pro03)


    ReactDOM.render(


      <div>


        <section>


          <p>Something goes here!</p>


        </section>


      </div>,


      document.querySelector("#container")


    );


    When wishing to represent components, the component name must be capitalized,
    both in JSX as well as when you define them:


    [Click here to view code image](#part0033.xhtml_p087pro04)


    ReactDOM.render(


      <div>


        <MyCustomComponent/>


      </div>,


      document.querySelector("#container")


    );


    If you get the capitalization wrong, React will not render your content properly.
    The component will not be found. Trying to identify capitalization issues is probably
    the last thing you’ll think about when things aren’t working, so keep this little
    tip in mind.


    #### Your JSX Can Be Anywhere


    In many situations, your JSX will not be neatly arranged inside a `render` or
    `return` function like in the examples we’ve seen so far. Take a look at the following
    example:


    [Click here to view code image](#part0033.xhtml_p088pro01)


