  raw: 'Anyway, the first thing we are going to do is define our `TodoItems` component.
    In your code, just above where you have the `TodoList` component defined, go ahead
    and add the following in:


    [Click here to view code image](#part0040.xhtml_p173pro01)


    var TodoItems = React.createClass({


      render: function() {


      }


    });


    There is nothing going on right now, but that’s OK.


    Next, what we are going to do is call this component from inside the `TodoList`
    component’s `render` method. Not only that, we are going to specify a prop and
    pass in our `TodoList` component’s state object that contains our `items` array.
    Doing all of this is really simple, so go ahead and add the following highlighted
    line to your `TodoList` component’s `render` method:


    [Click here to view code image](#part0040.xhtml_p173pro02)


    render: function() {


      return (


        <div className="todoListMain">


          <div className="header">


            <form onSubmit={this.addItem}>


              <input ref={(a) => this._inputElement = a}


                     placeholder="enter task">


              </input>


              <button type="submit">add</button>


            </form>


          </div>


          <TodoItems entries={this.state.items}/> 


        </div>


      );


    }


    All we did here is instantiate our `TodoItems` component and pass in our `items`
    state property to a prop called **entries**. At this point, if you run our app
    in the browser, nothing visible will happen. Our `TodoItems` component is ready
    to render, and it has access to all of the tasks that were submitted. The only
    problem is that it doesn’t really do anything with all of that, but we are going
    to fix that up next.


    Getting back to our `TodoItems` component, the first thing we are going to do
    is create a new variable to store our passed in array of tasks. To do that, add
    the following highlighted line:


    [Click here to view code image](#part0040.xhtml_p174pro01)


    var TodoItems = React.createClass({


      render: function() {


        var todoEntries = this.props.entries; 


      }


    });


    We just added a variable called `todoEntries`, and it stores the value from the
    `entries` prop that we passed in based on the `TodoList` component’s `this.state.items`
    value. Sweet! Now, our `todoEntries` variable stores an array containing a bunch
    of objects that each store a task and a key. All that remains is to create the
    HTML elements that will be used to display our data.


    In the first step towards accomplishing that, add the following highlighted lines
    of code to create the `li` elements:


    [Click here to view code image](#part0040.xhtml_p174pro02)


    var TodoItems = React.createClass({


      render: function() {


        var todoEntries = this.props.entries;         


        function createTasks(item) {                  


          return <li key={item.key}>{item.text}</li>  


        }                                             


        var listItems = todoEntries.map(createTasks); 


      }


    });


    We are using the `map` function to iterate every item inside `todoEntries` and
    call the `createTasks` function to create a list element for each entry:


    [Click here to view code image](#part0040.xhtml_p175pro01)


    function createTasks(item) {


      return <li key={item.key}>{item.text}</li>


    }


    To reiterate a point we made earlier, since these list elements are dynamically
    created, we need to help React keep track of them by specifying the `key` attribute
    and giving each a unique value. We already solved this part of the problem when
    we stored our tasks initially, as you recall:


    [Click here to view code image](#part0040.xhtml_p175pro02)


    itemArray.push(


      {


        text: this._inputElement.value,


        key: Date.now()


      }


    );


    Because of our earlier planning, we take the easy street right now by assigning
    our `key` attribute the `item.key` value that each item in our `todoEntries` array
    already contains. Our list element’s visible content is simply the text value
    stored by `item.text`. There is no extra explanation needed for how we use that
    one. Quite refreshing, isn’t it?


    Putting all of this together, this collection of list elements is fully processed
    and stored by our `listItems` variable. All that remains at this point is to go
    from list elements inside an array to list elements rendered on the screen. To
    accomplish that, go ahead and add the following highlighted lines:


    [Click here to view code image](#part0040.xhtml_p175pro03)


    var TodoItems = React.createClass({


      render: function() {


        var todoEntries = this.props.entries;


        function createTasks(item) {


          return <li key={item.key}>{item.text}</li>


        }


        var listItems = todoEntries.map(createTasks);


        return (                   


          <ul className="theList"> 


            {listItems}            


          </ul>                    


        );                         


      }


    });


    What we are doing is returning an `ul` element whose contents are the list elements
    stored by `listItems`. After you’ve added this, save your document and preview
    your app. You’ll see something that looks like [Figure 14-7](#part0021.xhtml_ch14fig07)
    after entering a few tasks.


    ![Image](Images/image00299.jpeg)


    Figure 14-7 List element for the list items.


    Our app works! Every task you submit shows up in its own list item. Take a few
    deep breaths and relax for a few moments. This is awesome progress, and all we
    have left are a few little things here and there that need to be wrapped up.


    #### Adding the Finishing Touches


    We are almost done here! First, what we have right now doesn’t look exactly like
    the example we started out with. Our list of tasks looks a bit plain, but that
    can be fixed with some CSS magic. Inside your `style` block, add the following
    style rules just below where your existing style rules live:


    [Click here to view code image](#part0040.xhtml_p176pro01)


    .todoListMain .theList {


      list-style: none;


      padding-left: 0;


      width: 255px;


    }


    .todoListMain .theList li {


      color: #333;


      background-color: rgba(255,255,255,.5);


      padding: 15px;


      margin-bottom: 15px;


      border-radius: 5px;


    }


    If you preview your app now, you’ll see that the entered tasks look exactly as
    you expected them to:


    ![Image](Images/image00300.jpeg)


    Next, have you noticed that whatever you enter into the input field doesn’t go
    away after you submit the form? You have to manually clear out the field each
    time after submitting a task...like an animal! That is annoying, but the fix for
    it is quite simple. Inside our `TodoList` component’s `addItem` method, add the
    following highlighted line:


    [Click here to view code image](#part0040.xhtml_p177pro01)


    addItem: function(e) {


      var itemArray = this.state.items;


      itemArray.push(


        {


          text: this._inputElement.value,


          key: Date.now()


        }


      );


      this.setState({


        items: itemArray


      });


      this._inputElement.value = ""; 


      e.preventDefault();


    }


    All we are doing here is clearing our `input` element’s `value` property when
    the form is submitted and the `addItem` method gets called. This ensures that
    we no longer have to manually clear out our input field between each task we would
    like to submit. Simple bimple!


    ### Conclusion


    Our Todo app is pretty simple in what it does, but by building it from scratch,
    we covered almost every little interesting detail React brings to the table. More
    importantly, we created an example that shows how the various concepts we learned
    individually play together. That is actually the important detail. Now, here is
    a quick question for you: does everything we’ve done in this chapter make sense?


    If everything we’ve done in this chapter makes sense then you are in good shape
    to tell your friends and family that you are close to mastering React! If there
    are areas that you find confusing, I suggest you go back and re-read the chapters
    which address your confusion.


