- fmt: "This app is a simple catalog browser for something. Like any app of this sort,\
    \ you have your usual set of pages revolving around a home page, a search results\
    \ page, a details page, and so on. In the following sections, let’s look at the\
    \ two approaches we have for building this app. Yes, in some mysterious fashion,\
    \ this leads to us getting an overview of React as well!\n\nOnwards!\n\n# Old\
    \ School Multi-Page Design\n\nIf you had to build this app a few years ago, you\
    \ may have taken an approach that involved multiple, individual pages. The flow\
    \ would have looked something like what is shown in [Figure 1-2](#part0008.xhtml_ch01fig02).\n\
    \n![Image](Images/image00228.jpeg)\n\nFigure 1-2 Multi-page design.\n\nFor almost\
    \ every action that changes what the browser displays, the web app will navigate\
    \ you to a whole different page. This is a big deal beyond the less-than-stellar\
    \ user experience that users will see as pages get torn down and redrawn. This\
    \ has a big impact on how you maintain your app state. Outside of storing some\
    \ user data via cookies and some server-side mechanism, you simply don’t need\
    \ to care. Life is good.\n\n# New School Single-Page Apps\n\nToday, going with\
    \ a web app model that requires navigating between individual pages seems dated...like,\
    \ really dated, like what is shown in [Figure 1-3](#part0008.xhtml_ch01fig03).\n\
    \n![Image](Images/image00229.jpeg)\n\nFigure 1-3 The individual page model is\
    \ a bit dated—like this steam engine.\n\nSource: *New Catechism of the Steam Engine*,\
    \ 1904\n\nInstead, modern apps tend to adhere to what is known as a Single-page\
    \ app (SPA) model. This is a world where you never navigate to different pages\
    \ or ever even reload a page. Instead, the different views of your app are loaded\
    \ and unloaded into the same page itself.\n\nFor our app, this may look something\
    \ like [Figure 1-4](#part0008.xhtml_ch01fig04).\n\n![Image](Images/image00230.jpeg)\n\
    \nFigure 1-4 Single-page app.\n\nAs users interact with our app, we replace the\
    \ contents of the dotted red region with the data and HTML that matches what the\
    \ user is trying to do. The end result is a much more fluid experience. You can\
    \ even use a lot of visual techniques to have your new content transition in nicely\
    \ just like you might see in cool apps on your mobile device or desktop. This\
    \ sort of stuff is simply not possible when navigating to different pages.\n\n\
    All of this may sound a bit crazy if you’ve never heard of single-page apps before,\
    \ but there is a very good chance you’ve run into some of them in the wild. If\
    \ you’ve ever used popular web apps like Gmail, Facebook, Instagram, or Twitter,\
    \ you were using a single-page app. In all those apps, the content gets dynamically\
    \ displayed without requiring you to refresh or navigate to a different page.\n\
    \nNow, I am making these single-page apps seem really complicated. That’s not\
    \ entirely the case. Thanks to a lot of great improvements in both JavaScript\
    \ and a variety of third party frameworks and libraries, building single-page\
    \ apps has never been easier. That doesn’t mean there is no room for improvement,\
    \ though.\n\nWhen building single-page apps, there are three major issues that\
    \ you’ll encounter:\n\n![Image](Images/image00226.jpeg) In a single-page application,\
    \ the bulk of your time will be spent keeping your data in sync with your UI.\
    \ For example, if a user loads new content, do we explicitly clear out the search\
    \ field? Do we keep the active tab on a navigation element still visible? Which\
    \ elements do we keep on the page, and which do we destroy?\n\nThese are all problems\
    \ unique to single-page apps. When navigating between pages in the old model,\
    \ we just assumed everything in our UI would be destroyed and just built back\
    \ up again. This was never a problem.\n\n![Image](Images/image00226.jpeg) Manipulating\
    \ the DOM is really REALLY slow. Manually querying elements, adding children (see\
    \ [Figure 1-5](#part0008.xhtml_ch01fig05) below), removing subtrees, and performing\
    \ other DOM operations are some of the slowest things you can do in your browser.\
    \ Unfortunately, in a single-page app, you’ll be doing a lot of this. Manipulating\
    \ the DOM is the primary way you are able to respond to user actions and display\
    \ new content.\n\n![Image](Images/image00231.jpeg)\n\nFigure 1-5 Adding children.\n\
    \n![Image](Images/image00226.jpeg) Working with HTML templates can be a pain.\
    \ Navigation in a single-page app is nothing more than you dealing with fragments\
    \ of HTML to represent whatever it is you wish to display. These fragments of\
    \ HTML are often known as templates, and using JavaScript to manipulate them and\
    \ fill them out with data gets really complicated really quickly.\n\nTo make things\
    \ worse, depending on the framework you are using, the way your templates look\
    \ and interact with data can vary wildly. For example, this is what using a template\
    \ in Mustache looks like:\n\n[Click here to view code image](#part0027.xhtml_p006pro01)\n\
    \n```javascript\nvar view = {\n  title: \"Joe\",\n  calc: function () {\n    return\
    \ 2 + 4;\n  }\n};\n\nvar output = Mustache.render(\"{{title}} spends {{calc}}\"\
    , view);\n```\n\nSometimes, your templates may look like some clean HTML you can\
    \ proudly show off in front. Despite these shortcomings, single-page apps aren’t\
    \ going anywhere. They are a part of the present, and they will fully form the\
    \ future. To Meet React\n\nFacebook (and Instagram) decided that enough is enough.\
    \ Given their abundance of experience with single-page apps, they released a library\
    \ called React (the React logo is shown in [Figure 1-6](#part0008.xhtml_ch01fig06))\
    \ to not only address these shortcomings, but to also change how we think about\
    \ building single-page apps.\n\n![Image](Images/image00232.jpeg)\n\nFigure 1-6\
    \ The React logo.\n\nIn the following sections, let’s look at the big things React\
    \ brings to the table.\n\n## Automatic UI State Management\n\nWith single-page\
    \ apps, keeping track of your UI and maintaining state is hard—and very time-consuming.\
    \ With React, you need to worry only one thing: the final state your UI is in.\
    \ It doesn’t matter what state your UI started out in. It doesn’t matter what\
    \ series of steps your users may have taken to change the UI. All that matters\
    \ is where your UI ended up (see [Figure 1-7](#part0008.xhtml_ch01fig07)).\n\n\
    ![Image](Images/image00233.jpeg)\n\nFigure 1-7 The final or end state of your\
    \ UI is what matters in React.\n\nReact takes care of everything else. It figures\
    \ out what needs to happen to ensure your UI is represented properly, so all of\
    \ that state management stuff is no longer your concern.\n\n### Lightning-fast\
    \ DOM Manipulation\n\nBecause DOM modifications are really slow, you never modify\
    \ the DOM directly using React. Instead, you modify an in-memory virtual DOM instead.\
    \ [Figure 1-8](#part0008.xhtml_ch01fig08) symbolizes that in-memory virtual DOM.\n\
    \n![Image](Images/image00234.jpeg)\n\nFigure 1-8 Imagine an in-memory virtual\
    \ DOM.\n\nManipulating this virtual DOM is extremely fast, and React takes care\
    \ of updating the real DOM when the time is right. It does so by comparing the\
    \ changes between your virtual DOM and the real DOM, figuring out which changes\
    \ actually matter, and making the least amount of DOM changes needed to keep everything\
    \ up-to-date in a process called reconciliation.\n\n### APIs to Create Truly Composable\
    \ UIs\n\nInstead of treating the visual elements in your app as one monolithic\
    \ chunk, React encourages you to break your visual elements into smaller and smaller\
    \ components.\n"
