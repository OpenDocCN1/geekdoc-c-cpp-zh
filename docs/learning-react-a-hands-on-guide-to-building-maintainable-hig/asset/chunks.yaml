    32        var cardStyle = {


    33          height: 200,


    34          width: 150,


    35          padding: 0,


    36          backgroundColor: "#FFF",


    37          WebkitFilter: "drop-shadow(0px 0px 5px #666)",


    38          filter: "drop-shadow(0px 0px 5px #666)"


    39        };


    40


    41        return (


    42          <div style={cardStyle}>


    43            <Square color={this.props.color}/> 


