    \n## 让我们的计数器运行起来\n\n现在我们已经了解了起点，是时候为接下来的步骤制定计划了。我们的计数器原理非常简单。我们将使用 `setInterval`\
    \ 函数，每隔 1000 毫秒（即 1 秒）调用某些代码。这段“某些代码”每次被调用时都会将一个值增加 100。看起来很直观，对吧？\n\n为了让这一切运行，我们将依靠\
