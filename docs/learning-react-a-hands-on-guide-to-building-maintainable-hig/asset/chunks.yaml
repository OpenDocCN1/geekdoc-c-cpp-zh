    about 100 times a second ([http://environment.nationalgeographic.com/environment/natural-disasters/lightning-profile/](http://environment.nationalgeographic.com/environment/natural-disasters/lightning-profile/)).
    We have a counter that simply increments a number you see by that same amount.
    Let’s create it.


    #### Our Starting Point


    The primary focus of this example is to see how we can work with state. There
    is no point in us spending a bunch of time creating the example from scratch and
    retracing paths that we’ve walked many times already. That’s not the best use
    of anybody’s time.


