      },


      render: function() {


        return (


          <div>


            <Counter display={this.state.count}/>


            <PlusButton onClick={this.increase}/> 


          </div>


        );


      }


    });


    On the surface, this line of JSX looks totally valid. When somebody clicks on
    our `PlusButton` component, the `increase` function will get called. In case you
    are curious, this is what our `PlusButton` component looks like:


    [Click here to view code image](#part0036.xhtml_p116pro02)


    var PlusButton = React.createClass({


      render: function() {


          return (


            <button>


              +


            </button>


          );


        }


    });


    Our `PlusButton` component doesn’t do anything crazy. It only returns a single
    HTML element!


    No matter how you slice and dice this, none of this matters. It doesn’t matter
    how simple or obvious the HTML we are returning via a component looks like. *You
    simply can’t listen for events on them directly*. The reason is because components
    are wrappers for DOM elements. What does it even mean to listen for an event on
    a component? Once your component gets unwrapped into DOM elements, does the outer
    HTML element act as the thing you are listening for the event on? Is it some other
    element? How do you distinguish between listening for an event and declaring a
    prop with a value?


    There is no clear answer to any of those questions. It’s too harsh to say that
    the solution is to simply not listen to events on components, either. Fortunately,
    there is a workaround where we treat the event handler as a prop and pass it on
    to the component. Inside the component, we can then assign the event to a DOM
    element and set the event handler to the the value of the prop we just passed
    in. I realize that probably makes no sense, so let’s walk through an example.


    Take a look at the following highlighted line:


    [Click here to view code image](#part0036.xhtml_p117pro01)


    var CounterParent = React.createClass({


        .


        .


        .


      render: function() {


        return (


          <div>


            <Counter display={this.state.count}/>


            <PlusButton clickHandler={this.increase}/> 


          </div>


        );


      }


    });


    In this example, we create a property called `clickHandler` whose value is the
    `increase` event handler. Inside our `PlusButton` component, we can then do something
    like this:


    [Click here to view code image](#part0036.xhtml_p117pro02)


    var PlusButton = React.createClass({


      render: function() {


          return (


            <button onClick={this.props.clickHandler}> 


              +


            </button>


          );


        }


    });


    On our `button` element, we specify the `onClick` event and set its value to the
    `clickHandler` prop. At runtime, this prop gets evaluated as our `increase` function,
    and clicking the plus button ensures the `increase` function gets called. This
    solves our problem while still allowing our component to participate in all this
    eventing goodness!


    #### Listening to Regular DOM Events'
