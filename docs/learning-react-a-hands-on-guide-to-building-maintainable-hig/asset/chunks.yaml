    \n[Click here to view code image](#part0031.xhtml_p061pro01)\n\n```javascript\n\
    var Label = React.createClass({\n  render: function() {\n    var labelStyle =\
    \ {\n      fontFamily: \"sans-serif\",\n      fontWeight: \"bold\",\n      padding:\
    \ 13,\n      margin: 0\n    };\n    return (\n      <p style={labelStyle}>#663</p>\n\
    \    );\n  }\n});\n```\n\nThe pattern of what we are doing should be routine to\
    \ you by now. We have a `style` object that we assign to what return. What we\
