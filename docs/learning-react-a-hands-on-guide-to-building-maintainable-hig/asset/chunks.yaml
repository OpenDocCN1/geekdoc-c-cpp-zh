    \ componentized world!`，所以请添加以下高亮行：\n\n点击此处查看代码图片\n\n```javascript\nvar HelloWorld\
    \ = React.createClass({\n  render: function() {\n    return (                \
    \          \n      <p>Hello, componentized world!</p> \n    );               \
