    The last thing we are going to tackle is something that greatly increases the
    usability of our app. Depending on which page you are currently displaying, we
    are going to highlight that link with a blue background. For example, [Figure
    13-6](#part0020.xhtml_ch13fig06) is what our app will look like when the Stuff
    content is being displayed.


    ![Image](Images/image00292.jpeg)


    Figure 13-6 The Stuff content.


    The way you accomplish this in React Router is by setting a prop called `activeClassName`
    on your `Link` instances with the name of the CSS class that will get set when
    that link is currently active. To make this happen, go back to your `App` component
    and make the highlighted changes:


    [Click here to view code image](#part0039.xhtml_p159pro01)


    var App = React.createClass({


      render: function() {


        return (


          <div>


            <h1>Simple SPA</h1>


            <ul className="header">


              <li><Link to="/" activeClassName="active">Home</Link></li>           


              <li><Link to="/stuff" activeClassName="active">Stuff</Link></li>     


              <li><Link to="/contact" activeClassName="active">Contact</Link></li> 


            </ul>


            <div className="content">


              {this.props.children}


            </div>


          </div>


        )


      }


    });


    We specify the `activeClassName` prop and set it to a value of **active**. This
    ensures that whenever a link is clicked (and its path becomes active), the link
    element’s `class` attribute at runtime gets set to a value of **active**. To ensure
    our active links are styled differently, go ahead and add the following CSS:


    .active {


      background-color: #0099FF;


    }


    If you preview your app now, click on any of the links. Notice that the active
    link (and the Home link) displays with a blue background. We aren’t done just
    yet, though. Our Home link is always highlighted. It should only be highlighted
    when we load our Home page for the first time or explicitly navigate to the Home
    link itself. To fix this, we need to change how we link to our Home content. Instead
    of specifying our Home content with a `Link` element, we are going to replace
    it with an `IndexLink` element instead.


