    \ world!` 文本。如果你刚才由于紧张而屏住了呼吸，现在可以放松了。\n\n如果你在看到我们调用 `HelloWorld` 的语法后仍难以放松，请盯着下面的圆观察几会儿：\n\
    \n![Image](img/image00242.jpeg)\n\n好了，回到现实。我们到目前为止所做的事情可能很疯狂，但只需将你的 `<HelloWorld/>`\
    \ 组件想象成一个酷且新的 HTML 标签，你对其功能拥有完全控制权。这意味着你可以对它进行各种 HTML 风格的操作。\n\n例如，请继续修改我们的 `ReactDOM.render`\
    \ 方法使其如下所示：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <div>\n    <HelloWorld/>\n\
    \  </div>,\n  document.querySelector(\"#container\")\n);\n```\n\n我们将对 `HelloWorld`\
    \ 组件的调用封装在了一个 `div` 元素内部，如果你在浏览器中预览此内容，一切仍然运行正常。让我们再更进一步吧！与其只调用一次 `HelloWorld`，不如让它调用多次。现在修改我们的\
    \ `ReactDOM.render` 方法使其如下所示：\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    <HelloWorld/>\n    <HelloWorld/>\n    <HelloWorld/>\n    <HelloWorld/>\n\
    \    <HelloWorld/>\n    <HelloWorld/>\n  </div>,\n  document.querySelector(\"\
    #container\")\n);\n```\n\n你现在将看到一堆 `Hello, componentized world!` 文本实例出现。在转向更亮眼的内容之前，让我们再做一件事。回到我们的\
    \ `HelloWorld` 组件声明处，将我们返回的文本改为更传统的 `Hello, world!` 值：\n\n点击此处查看代码图片\n\n```javascript\n\
    var HelloWorld = React.createClass({\n  render: function() {\n    return (\n \
    \     <p>Hello, world!</p> \n    );\n  }\n});\n```\n\n我们所做的是告诉我们的 `render` 方法返回代表我们\
    \ `Hello, componentized world!` 文本的 JSX。剩下的就是实际使用这个组件。一旦你定义了组件，使用该组件的方法就是调用它，我们将从我们的老朋友\
    \ `ReactDOM.render` 方法中调用它：\n\n### 指定属性\n\n要给组件添加属性，你需要遵循两个部分。\n\n#### 第一部分：更新组件定义\n\
    \n现在，我们的 `HelloWorld` 组件被硬编码为始终输出 `Hello, world!`。为了给组件添加属性，我们需要更改 `render` 函数以使用\
    \ `props`。对于我们的示例，修改后的代码如下：\n\n点击此处查看代码图片\n\n```javascript\nvar HelloWorld = React.createClass({\n\
    \  render: function() {\n    return (\n      <p>Hello, {this.props.greetTarget}!</p>\
    \ \n    );\n  }\n});\n```\n\n访问属性的方法是通过每个组件都拥有的 `props` 属性进行调用。注意我们是如何将其放在大括号\
    \ `{` 和 `}` 中的。*在 JSX 中，如果你想让某些内容被求值，你需要将其包裹在大括号中*。如果不这样做，你会看到原始文本 `this.props.greetTarget`。\n\
    \n#### 第二部分：修改组件调用\n\n一旦更新了组件定义，剩下的就是在组件调用时传递属性值。这是通过添加一个与我们的属性同名的属性，后跟你想传递的值来实现。在我们的示例中，这将涉及带有\
    \ `greetTarget` 属性的 `HelloWorld` 调用。\n\n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    <HelloWorld greetTarget=\"Batman\"/>\n    <HelloWorld greetTarget=\"\
    Iron Man\"/>\n    <HelloWorld greetTarget=\"Nicolas Cage\"/>\n    <HelloWorld\
    \ greetTarget=\"Mega Man\"/>\n    <HelloWorld greetTarget=\"Bono\"/>\n    <HelloWorld\
    \ greetTarget=\"Catwoman\"/>\n  </div>,\n  document.querySelector(\"#container\"\
    )\n);\n```\n\n我们的每个 `HelloWorld` 调用现在都带有 `greetTarget` 属性以及我们想要问候的英雄（或类似的神话！）的名字。如果你在浏览器中预览此示例，你将看到问候语愉快地打印在屏幕上。\n\
    \n在继续之前，最后要说明一点。你不局限于组件上只有一个属性。你可以拥有任意数量的属性，你的 `props` 属性将轻松应对你的任何属性请求而不会产生任何麻烦。\n\
    \n"
- fmt: "\nA few sections ago, I mentioned that our components (in JSX) are very similar\
    \ to regular HTML elements. We saw that for ourselves when we wrapped a component\
    \ inside a `div` element or specified an attribute and value as part of specifying\
    \ properties. There is one more thing you can do with components just like you\
    \ can with many HTML elements. `Your components can have children`.\n\nWhat this\
    \ means is that you can do something like this:\n\n```jsx\n<CleverComponent foo=\"\
    bar\">\n  <p>Something!</p>\n</CleverComponent>\n```\n\nYou have a component very\
    \ cleverly called `CleverComponent`, and it has a `p` element as a child. From\
    \ within `CleverComponent`, you have the capability to access the `p` child element\
    \ (and any children it may have) via the `children` property accessed by `this.props.children`.\n\
    \nTo make sense of all this, let’s fiddle with another really simple example.\
    \ This time around, we have a component called `Buttonify` that wraps its children\
    \ inside a button. The component looks like this:\n\n[Click here to view code\
    \ image](#part0029.xhtml_p035pro01)\n\n```javascript\nvar Buttonify = React.createClass({\n\
    \  render: function() {\n    return (\n      <div>\n        <button type={this.props.behavior}>{this.props.children}</button>\n\
    \      </div>\n    );\n  }\n});\n```\n\nThe way you can use this component is\
    \ by just calling it via the `ReactDOM.render` method as shown here:\n\n[Click\
    \ here to view code image](#part0029.xhtml_p035pro02)\n\n```javascript\nReactDOM.render(\n\
    \  <div>\n    <Buttonify behavior=\"Submit\">SEND DATA</Buttonify>\n  </div>,\n\
    \  document.querySelector(\"#container\")\n);\n```\n\nWhen this code runs, given\
    \ what the JSX in the `Buttonify` component’s render method looked like, what\
    \ you will see are the words `SEND DATA` wrapped inside a button element. With\
    \ the appropriate styling, the result could look comically large like in [Figure\
    \ 3-4](#part0010.xhtml_ch03fig04).\n\n![Image](Images/image00243.jpeg)\n\nFigure\
    \ 3-4 A large send data button.\n\nAnyway, getting back to the JSX, notice that\
    \ we specify a custom property called `behavior`. This property enables us to\
    \ specify the `button` element’s `type` attribute, and you can see us accessing\
    \ it via `this.props.behavior` in the component definition’s `render` method.\n\
    \nThere is more to accessing a component’s children than what we’ve seen here.\
    \ For example, if your child element is the root of a deeply nested structure,\
    \ the `this.props.children` property will return an array. If your child element\
    \ is just a single element (like in our example), the `this.props.children` property\
    \ returns a single component NOT wrapped inside an array. There are a few more\
    \ things to call out, but instead of enumerating all the various cases and boring\
    \ you, we’ll naturally touch upon those cases as part of looking at more elaborate\
    \ examples later on.\n\n### Conclusion\n\nIf you want to build an app using React,\
    \ you can’t wander too far without having to use a component. Trying to build\
    \ a React app without using a component is kinda like building a JavaScript-based\
    \ app without using functions. I am not saying that it can’t be done. It is just\
    \ one of those things you don’t do...kinda like the `Bad Idea` part of the popular\
    \ Animaniacs Good Idea / Bad Idea sketches you can find here: [https://www.youtube.com/watch?v=2dJOIf4mdus](https://www.youtube.com/watch?v=2dJOIf4mdus):\n\
    \nIf this witty video doesn’t convince you why you should learn to embrace components,\
    \ I don’t know what will...except for maybe a future chapter on creating complex\
    \ components! :P\n\n# 4. Styling in React\n\nFor generations, mankind (and probably\
    \ really smart dolphins) have styled their HTML content using CSS (aka Cascading\
    \ Style Sheets). Things were good. With CSS, you had a good separation between\
    \ the content and the presentation. The selector syntax gave you a lot of flexibility\
    \ in choosing which elements to style and which ones to skip. You couldn’t even\
    \ find too many issues to hate about the `whole cascading thing` that CSS is all\
    \ about.\n\nWell, don’t tell React that. While React doesn’t actively hate CSS,\
    \ it has a different view when it comes to styling content. As we’ve seen so far,\
    \ one of React’s core ideas is to have our app’s visual pieces be self-contained\
    \ and reusable. That is why the HTML elements and the JavaScript that impacts\
    \ them are in the same bucket we call a component. We got a taste of that in the\
    \ previous chapter.\n\nWhat about how the HTML elements look (aka their styling)?\
    \ Where should that go? You can probably guess where I am going with this. You\
    \ can’t have a self-contained piece of UI when the styling for it is defined somewhere\
    \ else. That’s why React encourages you to specify how your elements look right\
    \ along side the HTML and the JavaScript. In this tutorial, you learn all about\
    \ this mysterious (and possibly scandalous!) approach to styling your content.\
    \ Of course, we also look at how to use CSS as well.\n\n### Styling React Content\
    \ Using CSS\n\nUsing CSS to style our React content is actually as straightforward\
    \ as you can imagine it to be. Because React ends up spitting out regular HTML\
    \ tags, all of the various CSS tricks you’ve learned over the years to style HTML\
    \ still apply. There are just a few minor things to keep in mind.\n\n#### Understand\
    \ the Generated HTML\nFrom what we learned about components, nothing here should\
    \ be a mystery. We create a component called `Letter` that is responsible for\
    \ wrapping our vowels inside a `div`. All of this is anchored in our HTML via\
    \ a `script` tag whose type designates it as something Babel will know what to\
    \ do with.\n\n### Displaying Some Vowels\n\nTo learn how to style our content,\
    \ let’s work together on a simple example. First, you’ll need a blank HTML page.\
    \ If you don’t have one, feel free to use the following:\n\n[Click here to view\
    \ code image](#part0030.xhtml_p37pro0)\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>Styling in React</title>\n  <script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"\
    ></script>\n  <script src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"\
    ></script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.0.3/babel.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n\n\
    \  <script type=\"text/babel\">\n    var Letter = React.createClass({\n      render:\
    \ function() {\n        return (\n          <div>\n            {this.children}\n\
    \          </div>\n        );\n      }\n    });\n\n    var destination = document.querySelector(\"\
    #container\");\n\n    ReactDOM.render(\n      <div>\n        <Letter>A</Letter>\n\
    \        <Letter>E</Letter>\n        <Letter>I</Letter>\n        <Letter>O</Letter>\n\
    \        <Letter>U</Letter>\n      </div>,\n      destination\n    );\n  </script>\n\
    </body>\n</html>\n```\n\nAll this markup does is load React and Babel and specify\
    \ a `div` with an `id` of `container`. If you preview your page, you’ll see something\
    \ boring that looks like [Figure 4-1](#part0011.xhtml_ch04fig01).\n\n![Image](Images/image00244.jpeg)\n\
    \nFigure 4-1 A boring output of what you see.\n\nDon’t worry, we’ll make it a\
    \ little less boring in a few moments. After we’ve had a run at these letters,\
    \ you will see something that more like [Figure 4-2](#part0011.xhtml_ch04fig02).\n\
    \n![Image](Images/image0245.jpeg)\n\nFigure 4-2 The letters arranged horizontally\
    \ and with a yellow background.\n\nOur vowels will be wrapped in a yellow background,\
    \ aligned horizontally, and sport a fancy monospace font. Let’s look at how to\
    \ do all of this in both CSS as well as React’s new-fangled approach.\n"
  raw: 'A few sections ago, I mentioned that our components (in JSX) are very similar
    to regular HTML elements. We saw that for ourselves when we wrapped a component
    inside a `div` element or specified an attribute and value as part of specifying
    properties. There is one more thing you can do with components just like you can
    with many HTML elements. *Your components can have children*.


    What this means is that you can do something like this:


    <CleverComponent foo="bar">


      <p>Something!</p>


    </CleverComponent>


    You have a component very cleverly called `CleverComponent`, and it has a `p`
    element as a child. From within `CleverComponent`, you have the capability to
    access the `p` child element (and any children it may have) via the `children`
    property accessed by `this.props.children`.


    To make sense of all this, let’s fiddle with another really simple example. This
    time around, we have a component called `Buttonify` that wraps its children inside
    a button. The component looks like this:


    [Click here to view code image](#part0029.xhtml_p035pro01)


    var Buttonify = React.createClass({


      render: function() {


        return (


          <div>


            <button type={this.props.behavior}>{this.props.children}</button>


          </div>


        );


      }


    });


    The way you can use this component is by just calling it via the `ReactDOM.render`
    method as shown here:


    [Click here to view code image](#part0029.xhtml_p035pro02)


    ReactDOM.render(


      <div>


        <Buttonify behavior="Submit">SEND DATA</Buttonify>


      </div>,


      document.querySelector("#container")


    );


    When this code runs, given what the JSX in the `Buttonify` component’s render
    method looked like, what you will see are the words “**SEND DATA**” wrapped inside
    a button element. With the appropriate styling, the result could look comically
    large like in [Figure 3-4](#part0010.xhtml_ch03fig04).


    ![Image](Images/image00243.jpeg)


    Figure 3-4 A large send data button.


    Anyway, getting back to the JSX, notice that we specify a custom property called
    `behavior`. This property enables us to specify the `button` element’s `type`
    attribute, and you can see us accessing it via `this.props.behavior` in the component
    definition’s `render` method.


    There is more to accessing a component’s children than what we’ve seen here. For
    example, if your child element is the root of a deeply nested structure, the `this.props.children`
    property will return an array. If your child element is just a single element
    (like in our example), the `this.props.children` property returns a single component
    NOT wrapped inside an array. There are a few more things to call out, but instead
    of enumerating all the various cases and boring you, we’ll naturally touch upon
    those cases as part of looking at more elaborate examples later on.


    ### Conclusion


    If you want to build an app using React, you can’t wander too far without having
    to use a component. Trying to build a React app without using a component is kinda
    like building a JavaScript-based app without using functions. I am not saying
    that it can’t be done. It is just one of those things you don’t do...kinda like
    the *Bad Idea* part of the popular Animaniacs Good Idea / Bad Idea sketches you
    can find here: [https://www.youtube.com/watch?v=2dJOIf4mdus](https://www.youtube.com/watch?v=2dJOIf4mdus):


    If this witty video doesn’t convince you why you should learn to embrace components,
    I don’t know what will...except for maybe a future chapter on creating complex
    components! :P


    ## 4. Styling in React


    For generations, mankind (and probably really smart dolphins) have styled their
    HTML content using CSS (aka Cascading Style Sheets). Things were good. With CSS,
    you had a good separation between the content and the presentation. The selector
    syntax gave you a lot of flexibility in choosing which elements to style and which
    ones to skip. You couldn’t even find too many issues to hate about the *whole
    cascading thing* that CSS is all about.


    Well, don’t tell React that. While React doesn’t actively hate CSS, it has a different
    view when it comes to styling content. As we’ve seen so far, one of React’s core
    ideas is to have our app’s visual pieces be self-contained and reusable. That
    is why the HTML elements and the JavaScript that impacts them are in the same
    bucket we call a component. We got a taste of that in the previous chapter.


    What about how the HTML elements look (aka their styling)? Where should that go?
    You can probably guess where I am going with this. You can’t have a self-contained
    piece of UI when the styling for it is defined somewhere else. That’s why React
    encourages you to specify how your elements look right along side the HTML and
    the JavaScript. In this tutorial, you learn all about this mysterious (and possibly
    scandalous!) approach to styling your content. Of course, we also look at how
    to use CSS as well. There is room for both approaches—even if React may sorta
    kinda not think so :P


    Onwards!


    ### Displaying Some Vowels


    To learn how to style our React content, let’s work together on a (totally sweet
    and exciting!) example that simply displays vowels on a page. First, you’ll need
    a blank HTML page that will host our React content. If you don’t have one, feel
    free to use the following markup:


    [Click here to view code image](#part0030.xhtml_p037pro01)


    <!DOCTYPE html>


    <html>


    <head>


      <title>Styling in React</title>


      <script src="https://unpkg.com/react@15.3.2/dist/react.js"></script>


      <script src="https://unpkg.com/react-dom@15.3.2/dist/react-dom.js"></script>


      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.


    js"></script>


      <style>


        #container {


          padding: 50px;


          background-color: #FFF;


        }


      </style>


    </head>


    <body>


      <div id="container"></div>


    </body>


    </html>


    All this markup does is load in our React and Babel libraries and specify a `div`
    with an `id` value of **container**. To display the vowels, we’re going to add
    some React-specific code.


    Just below the **container** `div` element, add the following:


    [Click here to view code image](#part0030.xhtml_p038pro01)


    <script type="text/babel">


      var Letter = React.createClass({


        render: function() {


            return (


              <div>


                {this.props.children}


              </div>


            );


          }


      });


      var destination = document.querySelector("#container");


      ReactDOM.render(


        <div>


          <Letter>A</Letter>


          <Letter>E</Letter>


          <Letter>I</Letter>


          <Letter>O</Letter>


          <Letter>U</Letter>


        </div>,


        destination


      );


    </script>


    From what we learned about components, nothing here should be a mystery. We create
    a component called `Letter` that is responsible for wrapping our vowels inside
    a `div` element. All of this is anchored in our HTML via a `script` tag whose
    type designates it as something Babel will know what to do with.


    If you preview your page, you’ll see something boring that looks like [Figure
    4-1](#part0011.xhtml_ch04fig01).


    ![Image](Images/image00244.jpeg)


    Figure 4-1 A boring output of what you see.


    Don’t worry, we’ll make it look a little less boring in a few moments. After we’ve
    had a run at these letters, you will see something that looks more like [Figure
    4-2](#part0011.xhtml_ch04fig02).


    ![Image](Images/image00245.jpeg)


    Figure 4-2 The letters arranged horizontally and with a yellow background.


    Our vowels will be wrapped in a yellow background, aligned horizontally, and sport
    a fancy monospace font. Let’s look at how to do all of this in both CSS as well
    as React’s new-fangled approach.


    ### Styling React Content Using CSS


    Using CSS to style our React content is actually as straightforward as you can
    imagine it to be. Because React ends up spitting out regular HTML tags, all of
    the various CSS tricks you’ve learned over the years to style HTML still apply.
    There are just a few minor things to keep in mind.


    #### Understand the Generated HTML'
  toc: []
  trans: "\n\n几个章节之前，我提到过我们的组件（在 JSX 中）与普通的 HTML 元素非常相似。当我们把组件封装在 `div` 元素内部，或者在指定属性时指定属性和值时，我们亲眼看到了这一点。还有一件事你可以对组件做，就像你可以对许多\
    \ HTML 元素做的那样：`你的组件可以拥有子元素`。\n\n这意味着你可以像这样操作：\n\n```jsx\n<CleverComponent foo=\"\
    bar\">\n  <p>Something!</p>\n</CleverComponent>\n```\n\n你有一个命名非常巧妙的组件 `CleverComponent`，它有一个\
    \ `p` 元素作为子元素。在 `CleverComponent` 内部，你可以通过 `this.props.children` 访问 `children`\
    \ 属性来获取 `p` 子元素（以及它可能有的任何子元素）。\n\n为了理解这一切，让我们来尝试另一个非常简单的例子。这次，我们有一个名为 `Buttonify`\
    \ 的组件，它将其子元素封装在一个按钮（button）内部。该组件看起来如下：\n\n点击此处查看代码图片\n\n```javascript\nvar Buttonify\
    \ = React.createClass({\n  render: function() {\n    return (\n      <div>\n \
    \       <button type={this.props.behavior}>{this.props.children}</button>\n  \
    \    </div>\n    );\n  }\n});\n```\n\n使用此组件的方法是像这里所示通过 `ReactDOM.render` 方法调用它：\n\
    \n点击此处查看代码图片\n\n```javascript\nReactDOM.render(\n  <div>\n    <Buttonify behavior=\"\
    Submit\">SEND DATA</Buttonify>\n  </div>,\n  document.querySelector(\"#container\"\
    )\n);\n```\n\n当这段代码运行时，考虑到 `Buttonify` 组件的 `render` 方法中的 JSX 样子，你将看到 `SEND DATA`\
    \ 这几个单词被封装在一个按钮元素中。带有适当的样式，结果可能会看起来非常滑稽地巨大，就像图 3-4\n\n图 3-4 一个巨大的发送数据按钮。\n\n无论如何，回到\
    \ JSX，注意我们指定了一个名为 `behavior` 的自定义属性。该属性允许我们指定 `button` 元素的 `type` 属性，你可以看到我们在组件定义的\
    \ `render` 方法中通过 `this.props.behavior` 访问它。\n\n访问组件子元素的操作比我们在这里看到的要多。例如，如果你的子元素是一个深度嵌套结构的根节点，`this.props.children`\
    \ 属性将返回一个数组。如果你的子元素只是单个元素（如我们的示例所示），`this.props.children` 属性返回的是单个组件，且**没有**封装在数组中。还有几点需要特别说明，但我们不会列举所有各种情况以免让你感到无聊，我们将在稍后查看更复杂的示例时，自然会触及这些情况。\n\
    \n### 结论\n\n如果你想使用 React 构建应用，那么在不使用组件的情况下，你无法走太远。尝试在不使用组件的情况下构建 React 应用有点就像在不使用函数的情况下构建基于\
    \ JavaScript 的应用。我不是说这做不到。这只是那种你不该做的事情之一……就像在这里找到的热门动画《动画狗》（Animaniacs）“好主意/坏主意”短剧中的“坏主意”部分一样：[`www.youtube.com/watch?v=2dJOIf4mdus`](https://www.youtube.com/watch?v=2dJOIf4mdus)：\n\
    \n如果这个幽默的视频不能说服你为什么要学会使用组件，我不知道还有什么能……除非未来有一个关于创建复杂组件的章节！:P\n\n# 4. React 中的样式样式\n\
    \n长期以来，人类（可能还有很聪的海豚）一直使用 CSS（即级联样式表）对他们的 HTML 内容进行样式。过去很好。通过 CSS，内容和表现之间有了良好的分离。选择器语法为你选择对哪些元素进行样式处理提供了很大的灵活性。你甚至找不到太多理由去讨厌\
    \ CSS 的“整个级联机制”。\n\n嗯，别告诉 React。虽然 React 并不积极讨厌 CSS，但在处理内容样式方面它有不同的观点。正如我们目前看到的，React\
    \ 的核心思想之一是让我们应用的视觉部分是自包含且可复用的。这就是为什么 HTML 元素和影响它们的 JavaScript 位于同一个被称为“组件”的箱子中。我们在上一章节中已经领略到了这一点。\n\
    \n那么 HTML 元素看起来什么样（即它们的样式）呢？那应该放在哪里？你可能已经猜到我想表达什么了。当样式定义在其他地方时，你就无法拥有一个自包含的 UI\
    \ 部分。这就是为什么 React 鼓励你紧邻 HTML 和 JavaScript 指定你元素的外观。在在本教程中，你将学习关于这种神秘（且可能令人丑闻！）的内容样式方法的所有知识。当然，我们也会查看如何使用\
    \ CSS。\n\n### 使用 CSS 为 React 内容设置\n\n使用 CSS 为我们的 React 内容设置样式实际上比你想象的要简单。因为 React\
    \ 最后输出的是普通的 HTML 标签，所以你多年来学的所有为 HTML 设置样式的各种 CSS 技巧仍然适用。只是有几个小细节需要注意。\n\n####\
    \ 理解生成的 HTML\n从我们所学的组件来看，这里没有任何秘密。我们创建了一个名为 `Letter` 的组件，它负责将子元素封装在 `div` 中。\n\
    \n### 显示元元\n\n为了学习如何为内容设置样式，让我们一起尝试一个简单的例子。首先，你需要一个空白的 HTML 页面。如果没有，可以使用以下代码：\n\
    \n点击此处查看代码图片\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>React 中的样式</title>\n\
    \  <script src=\"https://unpkg.com/react@15.3.2/dist/react.js\"></script>\n  <script\
    \ src=\"https://unpkg.com/react-dom@15.3.2/dist/react-dom.js\"></script>\n  <script\
    \ src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.0.3/babel.min.js\"\
    ></script>\n  <style>\n    #container {\n      padding: 50px;\n      background-color:\
    \ #FFF;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n\n\
    \  <script type=\"text/babel\">\n    var Letter = React.createClass({\n      render:\
    \ function() {\n        return (\n          <div>\n            {this.children}\n\
    \          </div>\n        );\n      }\n    });\n\n    var destination = document.querySelector(\"\
    #container\");\n\n    ReactDOM.render(\n      <div>\n        <Letter>A</Letter>\n\
    \        <Letter>E</Letter>\n        <Letter>I</Letter>\n        <Letter>O</Letter>\n\
    \        <Letter>U</Letter>\n      </div>,\n      destination\n    );\n  </script>\n\
    </body>\n</html>\n```\n\n所有的标记只是加载了 React 和 Babel，并指定了一个 `id` 为 `container` 的\
    \ `div`。如果你预览你的页面，你将看到类似于图 4-1 那样的无聊输出。\n\n![Image](img/image0244.jpeg)\n\n图 4-1\
    \ 你看到的无聊输出。\n\n别担心，稍后我们会让它变得不那么无聊。在我们处理这些字母之后，你会看到更像图 4-2 的东西。\n\n![Image](img/image0245.jpeg)\n\
    \n图 4-2 字母水平排列并带有黄色背景。\n\n我们的元音将被封装在黄色背景中，水平对齐，并采用一种时尚的等宽字体。\n"
- fmt: "\nBefore you can use CSS, you need to first get a feel for what the HTML that\
    \ React spits out is going to look like. You can easily figure that out by looking\
    \ at the JSX defined inside the `render` methods. The parent `render` method is\
    \ our `ReactDOM` based one, and it looks as follows:\n\n```html\n<div>\n  <Letter>A</Letter>\n\
    \  <Letter>E</Letter>\n  <Letter>I</Letter>\n  <Letter>O</Letter>\n  <Letter>U</Letter>\n\
    </div>\n```\n\nWe have our various `Letter` components wrapped inside a `div`.\
    \ Nothing too exciting here. The `render` method inside our `Letter` component\
    \ isn’t that much different either:\n\n```html\n<div>\n  {this.props.children}\n\
    </div>\n```\n\nAs you can see, each individual vowel is wrapped inside its own\
    \ set of `div` tags. If you had to play this all out (such as, previewing our\
    \ example in a browser), the final DOM structure for our vowels looks like [Figure\
    \ 4-3](#part0011.xhtml_ch04fig03).\n\n![Image](Images/image0024.jpeg)\n\nFigure\
    \ 4-3 The preview from inside the browser.\n\nIgnore the `data-reacroot` attribute\
    \ (that you may not even see depending on your version of React!) on the container\
    \ `div`, but pay attention to the rest of the things you see. What we have is\
    \ simply an HTML-ized expansion of the various JSX fragments we saw in the `render`\
    \ method a few moments ago with our vowels nested inside a bunch of `div` elements.\n\
    \n## Just Style It Already!\n\nOnce you understand the HTML arrangement of the\
    \ things you want to style, the hard part is done. Now comes the fun and familiar\
    \ part of defining style selectors and specifying the properties you want to set.\
    \ To affect our inner `div` elements, add the following inside our `style` tag:\n\
    \n```css\ndiv div div {\n  padding: 10px;\n  margin: 10px;\n  background-color:\
    \ #ffde00;\n  color: #333;\n  display: inline-block;\n  font-family: monospace;\n\
    \  font-size: 32px;\n  text-align: center;\n}\n```\n\nThe `div div div` selector\
    \ will ensure we style the right things. The end result will be our vowels styled\
    \ to look exactly like we saw earlier. With that said, a style selector of `div\
    \ div div` looks a bit odd, doesn’t it? It is too generic. In apps with more than\
    \ three nested `div` elements (which will be very common), you may end up styling\
    \ the wrong things. It is at times like this where you will want to change the\
    \ HTML that React generates to make our content more easily style-able.\n\nThe\
    \ way we are going to address this is by giving our inner `div` elements a `class`\
    \ value of `letter`. Here is where JSX differs from HTML. Make the following highlighted\
    \ change: [Click here to view code image](#part0030.xhtml_p041pro01)\n\n```javascript\n\
    var Letter = React.createClass({\n  render: function() {\n    return (\n     \
    \ <div className=\"letter\"> \n        {this.props.children}\n      </div>\n \
    \   );\n  }\n});\n```\n\nNotice that we designate the class value by using the\
    \ `className` attribute instead of the `class` attribute. The reason has to do\
    \ with the word `class` being a special keyword in JavaScript. If that doesn’t\
    \ make any sense why it is important, don’t worry about it for now. We’ll cover\
    \ that later.\n\nAnyway, once you’ve given your `div` a `className` attribute\
    \ value of `letter`, there is just one more thing to do. Modify the CSS selector\
    \ to target our `div` elements more cleanly:\n\n```css\n.letter {\n  padding:\
    \ 10px;\n  margin: 10px;\n  background-color: #ffde00;\n  color: #333;\n  display:\
    \ inline-block;\n  font-family: monospace;\n  font-size: 32px;\n  text-align:\
    \ center;\n}\n```\n\nAs you can see, using CSS is a perfectly viable way to style\
    \ the content in your React-based apps. In the next section, we’ll look at how\
    \ to style our content using the approach preferred by React.\n\n## Styling Content\
    \ the React Way\n\nReact favors an inline approach for styling content that doesn’t\
    \ use CSS. While that seems a bit strange at first, it is designed to help make\
    \ your visuals more reusable. The goal is to have your components be little black\
    \ boxes where everything related to how your UI looks and works gets stashed there.\
    \ Let’s see this for ourselves.\n\nContinuing our example from earlier, remove\
    \ the `.letter` style rule. Once you have done this, your vowels will return to\
    \ their unstyled state when you preview your app in the browser. For completeness,\
    \ you should remove the `className` declaration from our `Letter` component’s\
    \ `render` function as well. There is no point having our markup contain things\
    \ we’t be using. Right now, `Letter` is back to its original state: [Click here\
    \ to view code image](#part0030.xhtml_p02pro01)\n\n```javascript\nvar Letter =\
    \ React.createClass({\n  render: function() {\n    return (\n      <div>\n   \
    \     {this.props.children}\n      </div>\n    );\n  }\n});\n```\n\nThe way you\
    \ specify styles inside your component is by defining an object whose content\
    \ is the CSS properties and their values. Once you have that object, you assign\
    \ that object to the JSX elements you wish to style using the `style` attribute.\
    \ This will make more sense once we perform these two steps, so let’s apply all\
    \ of this to the output of our `Letter` component.\n\n### Creating a Style Object\n\
    \nLet’s get right to it by defining our object that contains the styles we wish\
    \ to apply: [Click here to view code image](#part0030.xhtml_p03pro01)\n\n```javascript\n\
    var Letter = React.createClass({\n  render: function() {\n    var letterStyle\
    \ = {\n      padding: 10,\n      margin: 10,\n      backgroundColor: \"#ffde00\"\
    ,\n      color: \"#333\",\n      display: \"inline-block\",\n      fontFamily:\
    \ \"monospace\",\n      fontSize: 32,\n      textAlign: \"center\"\n    };\n \
    \   return (\n      <div>\n        {this.props.children}\n      </div>\n    );\n\
    \  }\n});\n```\n\nWe have an object called `letterStyle`, and the properties inside\
    \ it are just CSS property names and their value. If you’ve never defined CSS\
    \ properties in JavaScript before (i.e., by setting `object.style`), the formula\
    \ for converting them into something JavaScript-friendly is pretty simple:\n\n\
    ![Image](Images/image0026.jpeg) Single word CSS properties (like `padding`, `margin`,\
    \ `color`) remain unchanged.\n\n![Image](Images/image0026.jpeg) Multi-word CSS\
    \ properties with a dash in them (like `background-color`, `font-family`, `border-radius`)\
    \ are turned into one camelcase word with the dash removed and the words following\
    \ the dash capitalized. For example, using our example properties, `background-color`\
    \ would become `backgroundColor`, `font-family` would become `fontFamily`, and\
    \ `border-radius` would become `borderRadius`.\n\nOur `letterStyle` object and\
    \ its properties are pretty much a direct JavaScript translation of the `.letter`\
    \ style rule we looked at a few moments ago. All that remains now is to assign\
    \ this object to the element we wish to style.\n\n### Actually Styling Our Content\n\
    \nNow that we have our object containing the styles we wish to apply, the rest\
    \ is very easy. Find the element we wish to apply the style to and set the `style`\
    \ attribute to refer to that object. In our case, that will be the `div` element\
    \ returned by our `Letter` component’s `render` function.\n\nTake a look at the\
    \ highlighted line to see how this is done for our example: [Click here to view\
    \ code image](#part0030.xhtml_p044pro01)\n\n```javascript\nvar Letter = React.createClass({\n\
    \  render: function() {\n    var letterStyle = {\n      padding: 10,\n      margin:\
    \ 10,\n      backgroundColor: \"#ffde00\",\n      color: \"#333\",\n      display:\
    \ \"inline-block\",\n      fontFamily: \"monospace\",\n      fontSize: 32,\n \
    \     textAlign: \"center\"\n    };\n    return (\n      <div style={letterStyle}>\
    \ \n        {this.props.children}\n      </div>\n    );\n  }\n});\n```\n"
  raw: 'Before you can use CSS, you need to first get a feel for what the HTML that
    React spits out is going to look like. You can easily figure that out by looking
    at the JSX defined inside the `render` methods. The parent `render` method is
    our `ReactDOM` based one, and it looks as follows:


    <div>


      <Letter>A</Letter>


      <Letter>E</Letter>


      <Letter>I</Letter>


      <Letter>O</Letter>


      <Letter>U</Letter>


    </div>


    We have our various `Letter` components wrapped inside a `div`. Nothing too exciting
    here. The `render` method inside our `Letter` component isn’t that much different
    either:


    <div>


      {this.props.children}


    </div>


    As you can see, each individual vowel is wrapped inside its own set of `div` tags.
    If you had to play this all out (such as, previewing our example in a browser),
    the final DOM structure for our vowels looks like [Figure 4-3](#part0011.xhtml_ch04fig03).


    ![Image](Images/image00246.jpeg)


    Figure 4-3 The preview from inside the browser.


    Ignore the `data-reacroot` attribute (that you may not even see depending on your
    version of React!) on the **container** `div`, but pay attention to the rest of
    the things you see. What we have is simply an HTML-ized expansion of the various
    JSX fragments we saw in the `render` method a few moments ago with our vowels
    nested inside a bunch of `div` elements.


    #### Just Style It Already!


    Once you understand the HTML arrangement of the things you want to style, the
    hard part is done. Now comes the fun and familiar part of defining style selectors
    and specifying the properties you want to set. To affect our inner `div` elements,
    add the following inside our `style` tag:


    div div div {


      padding: 10px;


      margin: 10px;


      background-color: #ffde00;


      color: #333;


      display: inline-block;


      font-family: monospace;


      font-size: 32px;


      text-align: center;


    }


    The `div div div` selector will ensure we style the right things. The end result
    will be our vowels styled to look exactly like we saw earlier. With that said,
    a style selector of `div div div` looks a bit odd, doesn’t it? It is too generic.
    In apps with more than three nested `div` elements (which will be very common),
    you may end up styling the wrong things. It is at times like this where you will
    want to change the HTML that React generates to make our content more easily style-able.


    The way we are going to address this is by giving our inner `div` elements a `class`
    value of **letter**. Here is where JSX differs from HTML. Make the following highlighted
    change:


    [Click here to view code image](#part0030.xhtml_p041pro01)


    var Letter = React.createClass({


      render: function() {


          return (


            <div className="letter"> 


              {this.props.children}


            </div>


          );


        }


    });


    Notice that we designate the class value by using the `className` attribute instead
    of the `class` attribute. The reason has to do with the word *class* being a special
    keyword in JavaScript. If that doesn’t make any sense why it is important, don’t
    worry about it for now. We’ll cover that later.


    Anyway, once you’ve given your `div` a `className` attribute value of **letter**,
    there is just one more thing to do. Modify the CSS selector to target our `div`
    elements more cleanly:


    .letter {


      padding: 10px;


      margin: 10px;


      background-color: #ffde00;


      color: #333;


      display: inline-block;


      font-family: monospace;


      font-size: 32px;


      text-align: center;


    }


    As you can see, using CSS is a perfectly viable way to style the content in your
    React-based apps. In the next section, we’ll look at how to style our content
    using the approach preferred by React.


    ### Styling Content the React Way


    React favors an inline approach for styling content that doesn’t use CSS. While
    that seems a bit strange at first, it is designed to help make your visuals more
    reusable. The goal is to have your components be little black boxes where everything
    related to how your UI looks and works gets stashed there. Let’s see this for
    ourselves.


    Continuing our example from earlier, remove the `.letter` style rule. Once you
    have done this, your vowels will return to their unstyled state when you preview
    your app in the browser. For completeness, you should remove the `className` declaration
    from our `Letter` component’s `render` function as well. There is no point having
    our markup contain things we won’t be using.


    Right now, our `Letter` component is back to its original state:


    [Click here to view code image](#part0030.xhtml_p042pro01)


    var Letter = React.createClass({


      render: function() {


          return (


            <div>


              {this.props.children}


            </div>


          );


        }


    });


    The way you specify styles inside your component is by defining an object whose
    content is the CSS properties and their values. Once you have that object, you
    assign that object to the JSX elements you wish to style by using the `style`
    attribute. This will make more sense once we perform these two steps ourselves,
    so let’s apply all of this to style the output of our `Letter` component.


    #### Creating a Style Object


    Let’s get right to it by defining our object that contains the styles we wish
    to apply:


    [Click here to view code image](#part0030.xhtml_p043pro01)


    var Letter = React.createClass({


      render: function() {


          var letterStyle = {           


            padding: 10,                


            margin: 10,                 


            backgroundColor: "#ffde00", 


            color: "#333",              


            display: "inline-block",    


            fontFamily: "monospace",    


            fontSize: 32,               


            textAlign: "center"         


          };                            


          return (


            <div>


              {this.props.children}


            </div>


          );


        }


    });


    We have an object called `letterStyle`, and the properties inside it are just
    CSS property names and their value. If you’ve never defined CSS properties in
    JavaScript before (i.e., by setting `object.style`), the formula for converting
    them into something JavaScript-friendly is pretty simple:


    ![Image](Images/image00226.jpeg) Single word CSS properties (like `padding`, `margin`,
    `color`) remain unchanged.


    ![Image](Images/image00226.jpeg) Multi-word CSS properties with a dash in them
    (like `background-color`, `font-family`, `border-radius`) are turned into one
    camelcase word with the dash removed and the words following the dash capitalized.
    For example, using our example properties, `background-color` would become `backgroundColor`,
    font-family would become `fontFamily`, and `border-radius` would become `borderRadius`.


    Our `letterStyle` object and its properties are pretty much a direct JavaScript
    translation of the `.letter` style rule we looked at a few moments ago. All that
    remains now is to assign this object to the element we wish to style.


    #### Actually Styling Our Content


    Now that we have our object containing the styles we wish to apply, the rest is
    very easy. Find the element we wish to apply the style to and set the `style`
    attribute to refer to that object. In our case, that will be the `div` element
    returned by our `Letter` component’s `render` function.


    Take a look at the highlighted line to see how this is done for our example:


    [Click here to view code image](#part0030.xhtml_p044pro01)


    var Letter = React.createClass({


      render: function() {


          var letterStyle = {


            padding: 10,


            margin: 10,


            backgroundColor: "#ffde00",


            color: "#333",


            display: "inline-block",


            fontFamily: "monospace",


            fontSize: "32",


            textAlign: "center"


          };


          return (


            <div style={letterStyle}> 


              {this.props.children}


            </div>


          );


        }


    });'
