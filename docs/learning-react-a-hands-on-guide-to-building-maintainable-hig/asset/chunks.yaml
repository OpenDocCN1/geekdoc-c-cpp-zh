    \n```bash\nnpm install react react-dom --save\n```\n\nOnce you Enter this, a lot\
    \ of weird stuff will show up on your screen. You may even see a bunch of warnings,\
    \ but they should be safe to ignore. What is happening is that the React and React-DOM\
    \ libraries (and stuff that they depend on) is getting downloaded from a giant\
    \ repository of Node.js packages found here: [https://www.npmjs.com/](https://www.npmjs.com/)\n\
    \nIf you take a look at your `MyTotallyAwesomeApp` folder, you’ll see a folder\
