    \ of larger components.\n\nYou probably don’t want all of that unnecessary code,\
    \ and tools like webpack play an important role to enable you to only include\
    \ the relevant code needed to have your app work. They often bundle all of the\
    \ relevant code (even if it comes from various sources) into a single file (see\
    \ [Figure 15-3](#part0022.xhtml_ch15fig03)).\n\n![Image](Images/image00303.jpeg)\n\
    \nFigure 15-3 Files packed into a single file.\n\n#### Your Code Editor\n\nNo\
    \ conversation about your development environment can happen without talking about\
    \ the most important tool in all of this, your code editor (see [Figure 15-4](#part0022.xhtml_ch15fig04)).\n\
    \n![Image](Images/image00304.jpeg)\n\nFigure 15-4 Your code editor.\n\nIt doesn’t\
    \ matter whether you use Sublime, Atom, VisualStudio Code, TextMate, Coda, or\
