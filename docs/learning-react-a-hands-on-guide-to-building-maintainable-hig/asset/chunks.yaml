    enter task\"></input>\n    <button type=\"submit\">add</button>\n  </form>\n</div>\n\
    </div>\n);\n  }\n});\n```\n\n我们在这里做的是指定 `getInitialState` 方法，该方法会在组件渲染之前被调用。在该方法内部，我们创建了一个名为\
    \ `items` 的空数组，之后我们可以在组件的任何地方通过 `this.state.items` 访问它。\n\n### 处理表单提交\n\n当你通过点击“Add”按钮或按下键盘上的\
    \ Enter/Return 键提交表单时，我们会向待办列表添加新项目。这种行为大部分是 HTML 内置的，我们的浏览器完全知道如何处理这种情况。我们不需要编写任何特殊代码来处理\
    \ Enter/Return 键或监听“Add”按钮的点击。我们唯一需要担心的是表单实际提交时发生什么。\n\n为了做到这一点，我们在 `form` 元素上监听\
    \ `onSubmit` 事件。每当表单提交时，该事件就会触发，这包括按下 Enter/Return 键或操作任何 `type` 属性为 `submit`\
    \ 的元素。当表单提交并捕获到该事件时，我们需要调用一个事件处理器。我们将该事件处理器命名为 `addItem`。\n\n将这一切整合在一起，在你的 `TodoList`\
    \ 组件的 `render` 函数内部，进行以下高亮更改：\n\n点击此处查看代码图片\n\n```jsx\nrender: function() {\n\
    \  return (\n    <div className=\"todoListMain\">\n      <div className=\"header\"\
    >\n        <form onSubmit={this.addItem}> \n          <input placeholder=\"enter\
    \ task\"></input>\n          <button type=\"submit\">add</button>\n        </form>\n\
    \      </div>\n    </div>\n  );\n}\n```\n\n正如我们所希望做的那样，我们刚刚将 `form` 元素的 `onSubmit`\
    \ 事件链接到了 `addItem` 事件处理器。这个事件处理器并不存在，但我们将通过添加以下高亮行来修复这个问题：\n\n点击此处查看代码图片\n\n```jsx\n\
    var TodoList = React.createClass({\n  getInitialState: function() {\n    return\
    \ {\n      items: []\n    };\n  },\n  addItem: function(e) { \n  },          \
    \               \n  render: function() {\n    return (\n      <div className=\"\
    todoListMain\">\n        <div className=\"header\">\n          <form onSubmit={this.addItem}>\n\
    \            <input placeholder=\"enter task\"></input>\n            <button type=\"\
    submit\">add</button>\n          </form>\n        </div>\n      </div>\n    );\n\
    \  }\n});\n```\n\n正如我们所希望的那样，我们刚刚将 `form` 元素的 `onSubmit` 事件链接到了 `addItem` 事件处理器。这个事件处理器并不存在，但我们将通过添加以下高亮行来修复这个问题：\n\
    \n这个事件处理器目前还没做什么，但我们将通过添加以下高亮行来修复它（注：此处原文逻辑重复，译文已按逻辑对齐）。\n\n### 填充状态 (Populating\
    \ State)\n\n现在，`TodoList` 组件的 `state` 对象包含了 `items` 数组。我们要做的是使用输入框中的文本来填充这个数组。正如我们在第\
    \ 2 章中所看到的那样，通过对 `input` 元素设置 `ref` 属性来实现这一点。在 `TodoList` 组件的 `render` 方法中，添加以下高亮行：\n\
    \n点击此处查看代码图片\n\n```jsx\nrender: function() {\n  return (\n    <div className=\"\
    todoListMain\">\n      <div className=\"header\">\n        <form onSubmit={this.addItem}>\n\
    \          <input placeholder=\"enter task\" ref={(a) => this._inputElement =\
    \ a}></input>\n          <button type=\"submit\">add</button>\n        </form>\n\
    \      </div>\n    </div>\n  );\n}\n```\n\n当这段代码执行时（即组件挂载后），`_inputElement` 属性将存储\
    \ `input` 元素的引用。一旦我们完成了这一步，就可以像在非 React 世界中使用 `querySelector` 一样处理这个元素了。接下来我们要填充\
    \ `items` 数组！\n\n通过添加以下高亮代码来修改 `addItem` 方法：\n\n点击此处查看代码图片\n\n```jsx\naddItem:\
    \ function(e) {\n  var itemArray = this.state.items;\n  itemArray.push({\n   \
    \ text: this._inputElement.value,\n    key: Date.now()\n  });\n  this.setState({\n\
    \    items: itemArray\n  });\n  e.preventDefault();\n}\n```\n\n这看起来写了很多代码，但我们在这里做的是将输入框中的文本填充到\
    \ `items` 数组中。让我们过一遍：\n\n我们做的第一件事是创建一个名为 `itemArray` 的数组，它引用了 `state` 对象的 `items`\
    \ 属性：点击此处查看代码图片\n\n```jsx\nvar itemArray = this.state.items;\n```\n\n一旦完成了这一步，就可以向其添加最近提交的\
    \ `input` 元素文本：点击此处查看代码图片\n\n```jsx\nitemArray.push({\n  text: this._inputElement.value,\n\
    \  key: Date.now()\n});\n```\n\n注意，我们不仅仅是添加了 `input` 元素。`key` 属性存储了当前时间。这听起来很奇怪，但正如你从第\
    \ 9 章回想起的那样，目标是让每个提交的 `key` 值都是唯一的。这很重要，因为（剧透警告！）我们将使用这个数组中的数据来生成元素。\n\n总之，回到正题，处理完\
    \ `itemArray` 后，剩下的工作是将 `state` 对象的 `items` 属性设置为它：\n\n```jsx\nthis.setState({\n\
    \  items: itemArray\n});\n```\n\n### 显示任务 (Displaying the Tasks)\n\n我们快要完成了！我们最后要做的事情之一是将当前存储在\
    \ `state` 对象 `items` 数组中的任务视觉化。这将涉及到创建一个全新的组件 `TodoItems`、传递一些 props、使用 `map`\
    \ 函数以及进行其他令人兴奋且肾上腺素飙升的操作（图 14-6）。\n\n"
- fmt: "\nAnyway, the first thing we are going to do is define our `TodoItems` component.\
    \ In your code, just above where you have the `TodoList` component defined, go\
    \ ahead and add the following in:\n\n[Click here to view code image](#part0040.xhtml_p173pro01)\n\
    \n```javascript\nvar TodoItems = React.createClass({\n  render: function() {\n\
    \n  }\n});\n```\n\nThere is nothing going on right now, but that’s OK.\n\nNext,\
    \ what we are going to do is call this component from inside the `TodoList` component’s\
    \ `render` method. Not only that, we are going to specify a prop and pass in our\
    \ `TodoList` component’s state object that contains our `items` array. Doing all\
    \ of this is really simple, so go ahead and add the following highlighted line\
    \ to your `TodoList` component’s `render` method:\n\n[Click here to view code\
    \ image](#part0040.xhtml_p173pro02)\n\n```javascript\nrender: function() {\n \
    \ return (\n    <div className=\"todoListMain\">\n      <div className=\"header\"\
    >\n        <form onSubmit={this.addItem}>\n          <input ref={(a) => this._inputElement\
    \ = a}\n                 placeholder=\"enter task\">\n          </input>\n   \
    \       <button type=\"submit\">add</button>\n        </form>\n      </div>\n\
    \      <TodoItems entries={this.state.items}/> \n    </div>\n  );\n}\n```\n\n\
    All we did here is instantiate our `TodoItems` component and pass in our `items`\
    \ state property to a prop called `entries`. At this point, if you run our app\
    \ in the browser, nothing visible will happen. Our `TodoItems` component is ready\
    \ to render, and it has access to all of the tasks that were submitted. The only\
    \ problem is that it doesn’t really do anything with all of that, but we are going\
    \ to fix that up next.\n\nGetting back to our `TodoItems` component, the first\
    \ thing we are going to do is create a new variable to store our passed in array\
    \ of tasks. To do that, add the following highlighted line:\n\n[Click here to\
    \ view code image](#part0040.xhtml_p174pro01)\n\n```javascript\nvar TodoItems\
    \ = React.createClass({\n  render: function() {\n    var todoEntries = this.props.entries;\
    \ \n  }\n});\n```\n\nWe just added a variable called `todoEntries`, and it stores\
    \ the value from the `entries` prop that we passed in based on the `TodoList`\
    \ component’s `this.state.items`. Sweet! Now, our `todoEntries` variable stores\
    \ an array containing a bunch of objects each store a task and a key. All that\
    \ remains is to create the HTML elements that will be used to display our data.\n\
    \nIn the first step towards accomplishing that, add the following highlighted\
    \ lines of code to create the `li` elements:\n\n[Click here to view code image](#part0040.xhtml_p74pro02)\n\
    \n```javascript\nvar TodoItems = React.createClass({\n  render: function() {\n\
    \    var todoEntries = this.props.entries;\n    var listItems = todoEntries.map(createTasks);\
    \ \n  }\n});\n```\n\nWe are using the `map` function to iterate every item inside\
    \ `todoEntries` and call the `createTasks` function to create a list element for\
    \ each entry:\n\n[Click here to view code image](#part0040.xhtml_p175pro01)\n\n\
    ```javascript\nfunction createTasks(item) {\n  return <li key={item.key}>{item.text}</li>\n\
    }\n```\n\nTo reiterate a point we made earlier, since these list elements are\
    \ dynamically created, we need to help React keep track of them by specifying\
    \ the `key` attribute and giving each a unique value. We already solved this part\
    \ of the problem when we stored our tasks, as you recall:\n\n[Click here to view\
    \ code image](#part0040.xhtml_p175pro02)\n\n```javascript\nitemArray.push({\n\
    \  text: this._inputElement.value,\n  key: Date.now()\n});\n```\n\nBecause of\
    \ our earlier planning, we take the easy street right now by assigning our `key`\
    \ attribute the `item.key` value that each item in our `todoEntries` array already\
    \ contains. Our list element’s visible content is simply the text value stored\
    \ by `item.text`. There is no extra needed for how we use that one. Quite refreshing,\
    \ isn’t it?\n\nPutting all of this together, this collection of list elements\
    \ is fully processed and stored by our `listItems` variable. All that remains\
    \ at this point is to go from list elements inside an array to list elements rendered\
    \ on the screen. To accomplish that, go ahead and add the following highlighted\
    \ lines:\n\n[Click here to view code image](#part0040.xhtml_p175pro03)\n\n```javascript\n\
    var TodoItems = React.createClass({\n  render: function() {\n    var todoEntries\
    \ = this.props.entries;\n    function createTasks(item) {\n      return <li key={item.key}>{item.text}</li>\n\
    \    }\n    var listItems = todoEntries.map(createTasks);\n    return (\n    \
    \  <ul className=\"theList\">\n        {listItems}\n      </ul>\n    );\n  }\n\
    });\n```\n\nWhat we are doing is returning an `ul` element whose contents are\
    \ the list elements stored by `listItems`. After you’ve added this, save your\
    \ document and preview your app. You’ll see something that looks like [Figure\
    \ 14-7](#part0021.xhtml_ch14fig07) after entering a few tasks.\n\n![Image](Images/image0029.jpeg)\n\
    \nFigure 14-7 List element for the list items.\n\nOur app works! Every task you\
    \ submit shows up in its own list item. Take a few deep breaths and relax for\
    \ a few moments. This is awesome.\n\n### Adding the Finishing Tou\n\nWe are almost\
    \ done here! First, what we have right now doesn’t look exactly like the example\
    \ we started with. Our list of tasks looks a bit plain, but that can be fixed\
    \ with some CSS. Inside your `style` block, add the following style rules just\
    \ where your existing style live:\n\n[Click here to view code image](#part0040.xhtml_p176pro01)\n\
    \n```css\n.todoList .theList {\n  list-style: none;\n  padding-left: 0;\n  width:\
    \ 255px;\n}\n\n.todoList .theList li {\n  color: #333;\n  background-color: rgba(255,255,255,.5);\n\
    \  padding: 15px;\n  margin-bottom: 15px;\n  border-radius: 5px;\n}\n```\n\nIf\
    \ you preview your app now, you’ll see the entered tasks look exactly as you expected:\n\
    \n![Image](Images/image0030.jpeg)\n\nNext, have you noticed that whatever you\
    \ enter into the input field doesn’t go away after you submit the form? You have\
    \ to manually clear out the field each time after submitting a task...like an\
    \ animal! That is annoying, but the fix for it is quite simple. Inside our `TodoList`\
    \ component’s `addItem` method, add the following line:\n\n[Click here to view\
    \ code image](#part0040.xhtml_p177pro01)\n\n```javascript\naddItem: function(e)\
    \ {\n  var itemArray = this.state.items;\n  itemArray.push({\n    text: this._inputElement.value,\n\
    \    key: Date.now()\n  });\n  this.setState({\n    items: itemArray\n  });\n\
    \  this._inputElement.value = \"\";\n  e.preventDefault();\n}\n```\n\nAll we are\
    \ doing here is clearing our `input` element’s `value` property when the form\
    \ is submitted and the `addItem` method gets called. This ensures that we no longer\
    \ have to manually clear out our input field between each task we would like to\
    \ submit. Simple bimple!\n\n### Conclusion\n\nOur Todo app is pretty simple in\
    \ what it does, but by building it from scratch, we covered almost every little\
    \ detail React brings to the table. More importantly, we created an example that\
    \ shows how the various concepts we learned individually play together. That is\
