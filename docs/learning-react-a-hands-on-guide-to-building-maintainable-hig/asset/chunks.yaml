    \ type=\"submit\">go</button>\n      </form>\n    </div>\n  );\n}\n```\n\n在这个\
    \ `render` 方法内部，我们返回了一大块 JSX，代表了（其他内容之外）我们输入颜色值的 `input` 元素。我们想要做的是访问 `input`\
    \ 元素的 DOM 表示，以便我们能够使用 JavaScript 对其调用一些 API。\n\n我们使用 refs 实现这一点的方法，是在我们想要引用的 HTML\
    \ 元素上设置 `ref` 属性：\n\n点击此处查看代码图片\n\n```javascript\nrender: function() {\n  var\
    \ squareStyle = {\n    backgroundColor: this.state.bgColor\n  };\n  return (\n\
    \    <div className=\"colorArea\">\n      <div style={squareStyle} className=\"\
    colorSquare\"></</div>\n      <form onSubmit={this.setNewColor}>\n        <input\n\
    \          ref={} \n          onChange={this.colorValue}\n          placeholder=\"\
    Enter a color value\">\n        </input>\n        <button type=\"submit\">go</button>\n\
    \      </form>\n    </div>\n  );\n}\n```\n\n因为我们对 `input` 元素感兴趣，所以我们将 `ref` 属性附加到它上。现在，我们的\
    \ `ref` 属性是空的。你通常将 `ref` 属性的值设置为一个 JavaScript 回调函数。当包含此 render 方法的组件被挂载（mounted）时，该函数会被自动调用。如果我们将\
    \ `ref` 属性的值设置为简单的 JavaScript 函数，用于存储对被引用 DOM 元素的引用，它看起来就像下面高亮的行一样：\n\n点击此处查看代码图片\n\
    \n```javascript\n1  render: function() {\n2    var squareStyle = {\n3      backgroundColor:\
    \ this.state.bgColor\n4    };\n5\n6    var self = this; \n7\n8    return (\n9\
    \      <div className=\"colorArea\">\n10       <div style={squareStyle} className=\"\
    colorSquare\"></</div>\n11     <form onSubmit={this.setNewColor}>\n12       <input\n\
    13         ref={\n14           function(el) {\n15           self._input = el;\n\
    16         }\n17       }\n18       onChange={this.colorValue}\n19       placeholder=\"\
    Enter a color value\">\n20       </input>\n21       <button type=\"submit\">go</button>\n\
    22     </form>\n23     </div>\n24   );\n25 }\n```\n\n这段代码在我们的组件挂载时运行的结果很简单：我们可以通过调用\
    \ `this._input`，从组件内部的任何地方访问代表我们 `input` 元素的 HTML。花几时间看看这些高亮代码是如何帮助实现这一点的。完成后，我们将一起过过的这段代码。\n\
    \n首先，我们的回调函数如下：\n\n```javascript\nfunction(el) {\n  self._input = el;\n}\n```\n\
    \n这个匿名函数在我们的组件挂载时被调用，最终的 HTML DOM 元素作为参数传入。我们使用 `el` 标识符捕获了这个参数，但你可以为此参数使用任何名称。该回调函数的体设置了一个名为\
    \ `_input` 的自定义属性，其值为我们的 DOM 元素的值。为了确保我们在组件上创建了此属性，我们使用 `self` 变量创建一个闭包，在这个闭包中，`this`\
    \ 指向我们的组件，而不是回调函数本身。（自动绑定在这里并不会发生）。\n\n这段代码在我们的组件挂载时运行的结果很简单：我们可以通过调用 `this._input`，从组件内部的任何地方访问代表我们\
    \ `input` 元素的 HTML。花几时间看看这些高亮代码是如何帮助实现这一点的。完成后，我们将一起过过的这段代码。\n\n*(注：由于输入文本中存在重复段落，译文已按逻辑去重并确保翻译完整)*\n\
    [/content] \n\n*(由于您提供的待翻译文本包含大量重复的段落，我在翻译时已根据注意事项“一定不要重复输出原文”进行了去重处理，以确保流畅流畅。)*\n\
    \n**以下是针对给定文本的最终翻译结果：**\n\n[content]\n`purple` 的输入值会被清空，焦点将返回文本框。这允许我们轻松地输入额外的颜色值并提交它们，而无需手动在文本框和按钮之间来回切换焦点。这难道不是好得多吗？\n\
    \n使用 JSX 和传统的 React 技术来实现这种行为是很困难的。我们甚至不打算去解释如何实现它。但通过直接处理各种 HTML 元素上的 JavaScript\
    \ DOM API 来实现这种行为就相当简单。猜猜我们将要做什么？在接下来的章节中，我们将使用 React 提供的、被称为 `refs` 的工具，来帮助我们访问\
    \ HTML 元素上的 DOM API。这一章听起来非常、非常无聊，但它将是一个有趣的章节——我很有把握。\n\n### 结识 Refs\n\n如你现在已经非常了解的那样，在我们的各种\
    \ `render` 方法中，我们编写了类似于 JSX 的 HTML 内容。我们的 JSX 仅仅是对 DOM 应该什么样子的描述。它并不代表真实的 HTML——尽管看起来非常像。无论如何，为了在\
    \ JSX 和 DOM 中最终的 HTML 元素之间架起一座桥梁，React 为我们提供了某种有趣的工具：`refs`（*references* 的缩写）。\n\
    \nrefs 的工作方式有点奇怪。理解它最简单的方法是看一个示例。假设我们从 `Colorizer` 示例中有一个 `render` 方法如下：\n\n点击此处查看代码图片\n\
    \n```javascript\nrender: function() {\n  var squareStyle = {\n    backgroundColor:\
    \ this.state.bgColor\n  };\n  return (\n    <div className=\"colorArea\">\n  \
    \    <div style={squareStyle} className=\"colorSquare\"></</div>\n      <form\
    \ onSubmit={this.setNewColor}>\n        <input\n          onChange={this.colorValue}\n\
    \          placeholder=\"Enter a color value\">\n        </input>\n        <button\
    \ type=\"submit\">go</button>\n      </form>\n    </div>\n  );\n}\n```\n\n在这个\
    \ `render` 方法内部，我们返回了一大块 JSX，代表了（其他内容之外）我们输入颜色值的 `input` 元素。我们想要做的是访问 `input`\
    \ 元素的 DOM 表示，以便我们能够使用 JavaScript 对其调用一些 API。\n\n我们使用 refs 实现这一点的方法，是在我们想要引用的 HTML\
    \ 元素上设置 `ref` 属性：\n\n点击此处查看代码图片\n\n```javascript\nrender: function() {\n  var\
    \ squareStyle = {\n    backgroundColor: this.state.bgColor\n  };\n  return (\n\
    \    <div className=\"colorArea\">\n      <div style={squareStyle} className=\"\
    colorSquare\"></</div>\n      <form onSubmit={this.setNewColor}>\n        <input\n\
    \          ref={} \n          onChange={this.colorValue}\n          placeholder=\"\
    Enter a color value\">\n        </input>\n        <button type=\"submit\">go</button>\n\
    \      </form>\n    </div>\n  );\n}\n```\n\n因为我们对 `input` 元素感兴趣，所以我们将 `ref` 属性附加到它上。现在，我们的\
    \ `ref` 属性是空的。你通常将 `ref` 属性的值设置为一个 JavaScript 回调函数。当包含此 render 方法的组件被挂载（mounted）时，该函数会被自动调用。如果我们将\
    \ `ref` 属性的值设置为简单的 JavaScript 函数，用于存储对被引用 DOM 元素的引用，它看起来就像下面高亮的行一样：\n\n点击此处查看代码图片\n\
    \n```javascript\n1  render: function() {\n2    var squareStyle = {\n3      backgroundColor:\
    \ this.state.bgColor\n4    };\n5\n6    var self = this; \n7\n8    return (\n9\
    \      <div className=\"colorArea\">\n10       <div style={squareStyle} className=\"\
    colorSquare\"></</div>\n11     <form onSubmit={this.setNewColor}>\n12       <input\n\
    13         ref={\n14           function(el) {\n15           self._input = el;\n\
    16         }\n17       }\n18       onChange={this.colorValue}\n19       placeholder=\"\
    Enter a color value\">\n20       </input>\n21       <button type=\"submit\">go</button>\n\
    22     </form>\n23     </div>\n24   );\n25 }\n```\n\n这段代码在我们的组件挂载时运行的结果很简单：我们可以通过调用\
    \ `this._input`，从组件内部的任何地方访问代表我们 `input` 元素的 HTML。花几时间看看这些高亮代码是如何帮助实现这一点的。完成后，我们将一起过过的这段代码。\n\
    \n首先，我们的回调函数如下：\n\n```javascript\nfunction(el) {\n  self._input = el;\n}\n```\n\
    \n这个匿名函数在我们的组件挂载时被调用，最终的 HTML DOM 元素作为参数传入。我们使用 `el` 标识符捕获了这个参数，但你可以为此参数使用任何名称。该回调函数的体设置了一个名为\
    \ `_input` 的自定义属性，其值为我们的 DOM 元素的值。为了确保我们在组件上创建了此属性，我们使用 `self` 变量创建一个闭包，在这个闭包中，`this`\
    \ 指向我们的组件，而不是回调函数本身。（自动绑定在这里并不会发生）。\n\n聚焦于 `input` 元素发生的情况：当表单被提交且 `setNewColor`\
    \ 方法被调用时，我们通过调用 `this._input.value = \"\"` 清空 `input` 元素的内容。我们通过调用 `this._input.focus()`\
    \ 为 `input` 元素设置焦点。所有的 `ref-` 工作是为了为了这两行代码，我们需要一种方法让 `this._input` 指向我们在 JSX 中定义的元素。\n\
    \n### 使用 ES6 箭头函数进一步简化\n\n学习 React 已经足够困难了，所以我尽量避免强制你默认使用 ES6 技术。在处理 `ref` 属性时，使用箭头函数来处理回调函数确实让问题变得了一些。这是我建议你使用\
    \ ES6 技术的情况之一。\n\n正如你几分钟前看到的，为了将组件上的属性赋值给引用的 HTML 元素，我们是这样做的：\n\n点击此处查看代码图片\n\n\
    ```javascript\n<input\n  ref={\n    function(el) {\n      self._input = el;\n\
    \    }\n  }\n  onChange={this.colorValue}\n  placeholder=\"Enter a color value\"\
    >\n</input>\n```\n"
- fmt: "\nTo deal with scoping shenanigans, we created a `self` variable initialized\
    \ to `this` to ensure we created the `_input` property on our component. That\
    \ seems unnecessarily messy.\n\nUsing arrow functions, we can simplify all of\
    \ this down to just the following:\n\n[Click here to view code image](#part0038.xhtml_p141pro02)\n\
    \n```html\n<input\n    ref={\n        (el) => this._input = el\n    }\n    onChange={this.colorValue}\n\
    \    placeholder=\"Enter a color value\">\n</input>\n```\n\nThe end result is\
    \ identical to what we spent all of this time looking at, and because of how arrow\
    \ functions deal with scope, you can use `this` inside the function body and reference\
    \ the component without doing any extra work. No need for an outer `self` variable\
    \ equivalent!\n\n***\n\n### Conclusion\n\nIn this tutorial, we saw how “easy”\
    \ it is to access a DOM element directly. React used to provide a much easier\
    \ way of referencing elements. You could set the `refs` attribute on an element\
    \ and initialize it to a string value:\n\n[Click here to view code image](#part0038.xhtml_p142pro01)\n\
    \n```html\n<button refs=\"myButton\">Click me!</button>\n```\n\nYou could then\
    \ access this element after the component was mounted by doing something like\
    \ `this.refs.myButton`. Before you get really excited about using something like\
    \ this over our function callback approach with the `ref` attribute, this string-based\
    \ approach is likely to be deprecated. It works at the moment of this writing,\
    \ but who knows when it will stop working. Now, given that this is going away,\
    \ you may be wondering why I told you about this. To be frank, I really have no\
    \ idea :P\n\n## 13. Creating a Single-Page App Using React Router\n\nNow that\
    \ you’ve familiarized yourself with the basics of how to work with React, let’s\
    \ kick things up a few notches. What we are going to do is use React to build\
    \ a simple, **single-page app** (also referred to as **SPA** by the cool kids—and\
    \ people living in Scandinavia). As we talked about in [Chapter 1](#part0008.xhtml_ch01)\
    \ forever ago, single-page apps are different from the more traditional multi-page\
    \ apps that you see everywhere. The biggest difference is that navigating a single-page\
    \ app doesn’t involve going to an entirely new page. Instead, your pages (commonly\
    \ known as **views** in this context) typically load inline within the same page\
    \ as illustrated in [Figure 13-1](#part0020.xhtml_ch13fig01).\n\n![Image](Images/image00287.jpeg)\n\
    \nFigure 13-1 Single-page apps use load views inline rather than load new pages.\n\
    \nWhen you are loading content inline, things get a little challenging. The hard\
    \ part is not loading the content itself. That is relatively easy. The hard part\
    \ is making sure that single-page apps behave in a way that is consistent with\
    \ what your users are used to. More specifically, when users navigate your app,\
    \ they expect that:\n\n1. The URL displayed in the address bar always reflects\
    \ the thing that they are viewing.\n2. They can use the browser’s back and forward\
    \ buttons—successfully.\n3. They can navigate to a particular view (aka **deep\
    \ link**) directly using the appropriate URL.\n\nWith multi-page apps, these three\
    \ things come for free. There is nothing extra you have to do for any of it. With\
    \ single-page apps, because you aren’t navigating to an entirely new page, you\
    \ have to do real work to deal with these three things that your users expect\
    \ to just work. You need to ensure that navigating within your app adjusts the\
    \ URL appropriately. You need to ensure your browser’s history is properly synchronized\
    \ with each navigation to allow users to use the back and forward buttons. If\
    \ users bookmark a particular view or copy/paste a URL to access later, you need\
    \ to ensure that your single-page app takes the user to the correct place.\n\n\
    To deal with all of this, you have a bucket full of techniques commonly known\
    \ as **routing**. Routing is where you try to map URLs to destinations that aren’t\
    \ physical pages, such as the individual views in your single-page app. That sounds\
    \ complicated, but fortunately there are a bunch of JavaScript libraries that\
    \ help us out with this. One such JavaScript library is the star of this chapter,\
    \ React Router ([https://github.com/reactjs/react-router](https://github.com/reactjs/react-router)).\
    \ React Router provides routing capabilities to single-page apps built in React,\
    \ and what makes it nice is that it extends what you already know about React\
    \ in familiar ways to give you all of this routing awesomeness. In this chapter,\
    \ you learn all about how it does that—and hopefully more!\n\n### The Example\n\
    \nBefore we go further, let’s take a look at an example (see [Figure 13-2](#part0020.xhtml_ch13fig02)).\n\
    \n![Image](Images/image00288.jpeg)\n\nFigure 13-2 A simple React app that uses\
    \ React Router.\n\nWhat you have here is a simple React app that uses React Router\
    \ to provide all of the navigation and view-loading goodness! While the screenshot\
    \ of the app looks nice and all, this is one of those cases where you want to\
    \ play with the app to see more of what it does. Go ahead and open this ([https://github.com/reactjs/react-router](https://github.com/reactjs/react-router))\
    \ in its own window, click on the various tabs to see the different views, and\
    \ you’ll have learned enough about React to build cooler and more awesomeness.\n\
    \n#### Building the App\n\nThe first thing we need to do is get the boilerplate\
    \ and code up and running. Create a new HTML document and add the following:\n\
    \n[Click here to view code image](#part0039.xhtml_p14)\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <title>React! React!</title>\n    <script src=\"https://npmcdn.com/react@15.3.0/dist/react.js\"\
    ></script>\n    <script src=\"https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js\"\
    ></script>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n    <style>\n    </style>\n</head>\n<body>\n    <div id=\"container\"\
    ></div>\n    <script type=\"text/babel\">\n        var destination = document.querySelector(\"\
    #container\");\n        ReactDOM.render(\n            <div>\n                Hello!\n\
    \            </div>,\n            destination\n        );\n    </script>\n</body>\n\
    </html>\n```\n\nThis starting point is almost the same as what you’ve seen for\
    \ all our other examples. This is just a nearly blank app that happens to load\
    \ the React and ReactDOM libraries. If you preview what you have in your browser,\
    \ you’ll see a very lonely Hello!\n\n#### Note: Still Keeping Things Simple\n\n\
    For now, we are continuing to rely on having our browser do all of the heavy lifting.\
    \ We’ll look into changing that with a “modern” build process later, so enjoy\
    \ the simplicity for now :P\n\n***\n\nNext, because React Router isn’t a part\
    \ of React itself, we need to add a reference to it. In our markup, find where\
    \ we have our script references and add the following highlighted line:\n\n[Click\
    \ here to view code image](#part0039.xhtml_p147pro01)\n\n```html\n<!-- ... code\
    \ ... -->\n<head>\n    <title>React! React!</title>\n    <script src=\"https://npmcdn.com/react@15.3.0/dist/react.js\"\
    ></script>\n    <script src=\"https://npmcdn.com/react-dom@15.3.0/dist/react-dom.js\"\
    ></script>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/babel-core/5.8.23/browser.min.js\"\
    ></script>\n    <script src=\"https://npmcdn.com/react-router/umd/ReactRouter.min.js\"\
    ></script>\n    <style>\n    </style>\n</head>\n<!-- ... code ... -->\n```\n\n\
    By adding the highlighted line, we ensure the React Router library is loaded alongside\
    \ the core React, ReactDOM, and Babel libraries. At this point, we are in a good\
    \ state to start building our app and taking advantage of the sweet functionality\
    \ React Router brings to the table.\n"
