  trans: "\n最棒的是，当你更改了函数的工作方式后，不需要进行任何额外操作就能看到这些更改的结果。如果函数签名没有变化，任何对该函数的现有调用都会像魔法般正常工作，并自动采用你对函数本身做的任何新更改。例如，我们现有的\
    \ `getDistance` 调用将看到 `formatDistance` 函数的输出，即使在最初定义调用时 `formatDistance` 函数还并不存在。这简直太棒了。\n\
    \n简而言之，函数是极佳的。我知道，你也知道。这就是为什么我们编写的所有代码中到处都是函数。\n\n### 改变我们处理 UI 的方式\n\n我不认为有人会反对函数带来的良好好处。它们确实让以一种合理的方式构建应用程序代码结构成为可能。我们在编写代码时使用的的那种程度的细心，在编写\
    \ UI 时并不总是能做到的。由于各种技术和非技术原因，我们一直容忍处理 UI 元素时的某种程度的粗率。\n\n我意识到这是一个非常有争议的陈述，所以让我通过查看一些例子来强调我的意思。我们将回顾一下在上一章中使用的\
    \ `render` 方法：\n\n点击此处查看代码图像\n\n```javascript\nvar destination = document.querySelector(\"\
    #container\");\n\nReactDOM.render(\n  <h1>Batman</h1>,\n  destination\n);\n```\n\
    \n你在屏幕上看到的是用大字体打印的单词 **`Batman`** ——这归功于 `h1` 元素。让我们稍微改变一下，假设我们要打印几个其他超级英雄的名字。为了做到这一点，让我们修改\
    \ `render` 方法，使其如下所示：\n\n点击此处查看代码图像\n\n```javascript\nvar destination = document.querySelector(\"\
    #container\");\n\nReactDOM.render(\n  <div>\n    <h1>Batman</h1>\n    <h1>Iron\
    \ Man</h1>\n    <h1>Nicolas Cage</h1>\n    <h1>Mega Man</h1>\n  </div>,\n  destination\n\
    );\n```\n\n注意你在这里看到的。我们输出了一个 `div`，它包含了四个带有超级英雄名字的 `h1` 元素。\n\n***\n\n### JSX\
    \ 阱：输出多个元素\n\n这里有一个重要的 JSX 细节需要指出。包裹我们的 `h1` 元素的 `div` 存在并不是因为它看起来是个好主意。它的存在是因为*必须在那里*。在\
    \ React 中，你不能像下面所示输出多个相邻元素：\n\n点击此处查看代码图像\n\n```javascript\nvar destination =\
    \ document.querySelector(\"#container\");\n\nReactDOM.render(\n  <h1>Batman</h1>\n\
    \  <h1>Iron Man</h1>\n  <h1>Nicolas Cage</h1>\n  <h1>Mega Man</h1>\n  destination\n\
    );\n```\n\n尽管这是有效的 HTML，但在 JSX 和 JavaScript 这种“不神圣的联盟”眼中它是无效的。这听起来可能是一个非常糟糕的限制，但解决方法非常简单。虽然你只能输出*一个元素*，但这个*元素可以拥有任意数量的子元素*。这就是为什么我们将\
