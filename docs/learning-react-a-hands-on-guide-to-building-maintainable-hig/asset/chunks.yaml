    >\n  ReactDOM.render(\n    <h1>Batman</h1>\n    document.body\n  );\n</script>\n\
    </body>\n```\n\n既然已经安全地定义了 `container` `div` 元素，让我们修改 `render` 方法，使用它来代替 `document.body`。这里有一种实现方法：\n\
    \n```javascript\nReactDOM.render(\n  <h1>Batman</h1>\n  document.querySelector(\"\
    #container\")\n);\n```\n\n另一种方法是在 `render` 方法之外进行一些操作：\n\n点击此处查看代码图像\n\n```javascript\n\
    var destination = document.querySelector(\"#container\");\n\nReactDOM.render(\n\
    \  <h1>Batman</h1>\n  destination\n);\n```\n\n注意，`destination` 变量存储了我们容器 DOM 元素的引用。在\
    \ `render` 方法内部，我们只需要引用同一个 `destination` 变量，而不是将完整的元素查找语法作为参数本身写进去。我想这么做的原因很简单：我想向你展示，你仍然在编写\
    \ JavaScript，而 `render` 只是另一个恰好接受两个参数的无聊旧方法。\n\n## 样式化！\n\n在我们结束工作之前，这是最后一次修改。现在，我们的名字显示的是浏览器提供的任何默认\
