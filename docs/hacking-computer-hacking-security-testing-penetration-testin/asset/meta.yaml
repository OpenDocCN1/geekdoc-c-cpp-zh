  - 第 12 章：为什么黑客行为是绝对必要的
- - '###'
  - '理由 #1：恶意黑客永远不会放弃破解尝试。'
- - '###'
  - '理由 #2：法律合规和清单式审计是不够的。'
- - '###'
  - '理由 #3：道德黑客可以与高级安全审计协同工作。'
- - '###'
  - '理由 #4：合作伙伴和客户现在更加关注与其业务来组织的安全性。'
- - '###'
  - '理由 #5：随着信息系统每天变得复杂，恶意黑客占据上风将指日可待。'
- - '###'
  - '理由 #6：道德黑客能以实用的方式展示潜在威胁。'
- - '###'
  - '理由 #7：道德黑客可以在发生安全漏洞时提供备用计划。'
- - '###'
  - '理由 #8：道德黑客攻击结合了漏洞评估和渗透测试。'
- - '###'
  - '理由 #9：道德黑客能够揭示可能被忽视已久的深层漏洞。'
