    # Introduction


    Most people don’t really understand what hacking is about, much less how to go
    about it. It’s something that we just watch in movies or hear about on the news.
    This book, *Hacking, Computer Hacking, Security Testing, Penetration Testing And
    Basic Security*, is meant to help you understand hacking techniques in a broader
    and deeper way.


    Hacking is commonly viewed as an illegal activity that is designed to steal data
    or money. Though it is true that some hackers out there use their skill for criminal
    activities, this is not what hacking is really about. Hacking is simply a way
    of discovering ignored or unintended uses of a product or situation and then coming
    up with new ways of solving a problem.


    In this book, you will learn how you can protect yourself from some of the most
    prevalent hacking schemes to date. How? By learning how to hack! That’s right.
    It would be inconceivable to expect to protect yourself and property from hackers
    without first understanding how hacking actually works.


    If you want to stay ahead of hackers and perform your own counter-hack, you are
    in luck. You grabbed the right book. In here you will learn about the modern tools
    and advanced techniques that ethical and criminal hackers use. Not only will you
    learn how to search for weaknesses in a security system, you will also get to
    know how to identify a system that is under attack.


    There are strategies that have been outlined here that will help you test the
    vulnerability of any system and prevent you from falling into black hat traps.
    This book is aimed at helping you improve information security for personal use
    as well as professionally. It is therefore very important that understand how
    electronic devices can be compromised without you even being aware of it.


    The book uses simple language that beginners can understand. Experienced hackers
    who need to learn certain aspects of hacking in an in-depth manner can also use
    the book. This book provides great tips on how to become an ethical hacker for
    an organization that needs to fix any vulnerabilities in its systems.


    The book is split into three parts, each discussing a different theme. Part I
    sets us off into the world of hacking, its history, and where we are now. Part
    II talks about the functional art of hacking various systems, networks, and applications.
    Finally, part III relates to what to do and what not to do regarding ethical hacking,
    and what the future holds for hacking. You can start with any part that interests
    you and maneuver as you see fit.


    We hope that by the time you finish reading this book, you will have learned enough
    to better protect yourself and also perform some ethical hacking of your own.


    # PART I: INTO THE WORLD OF HACKING


    ## Chapter 1: What is Hacking?


    When the word hacking is mentioned, what kind of images come to mind? Do you think
    of criminals and vandals trying to steal data or spy on others? Do you think of
    someone sitting in front of an array of computers, sending out encrypted programs
    to people in order to gain unauthorized access to their computers remotely?


    The truth is that the majority of people view hacking as an illegal activity.
    While it is true that criminal hackers do exist, they are actually just a small
    minority. Hacking is simply finding an alternative or unintended use of computer
    hardware or software, so as to enhance their applications and solve problems.


    This is the technical definition of hacking. Hacking is using the technology available
    in new and counterintuitive ways in order to solve problems that conventional
    techniques cannot. It is only in our current digital age that hacking has become
    synonymous with bypassing security, illegally accessing another person’s computer,
    and wrecking havoc.


    ### The History of Hacking


    Back in the late 1870’s, Bell Telephone Company hired several teenage boys to
    work as switchboard operators. These boys decided to engage in some technological
    mischief by intentionally misdirecting and disconnecting phone calls, listening
    in on conversations, and other kinds of pranks. Though this was not called “hacking”
    back then, it was the earliest recognized incident of misusing technology. It
    is even believed that this was one of the reasons that the company decided to
    only hire female workers as operators.


    Fast forward about 100 years later, in the 1950’s. The word `hack` was used to
    refer to a shortcut or technique used to bypass the original operation of a system.
    The term was coined by MIT model train enthusiasts who received a donation of
    old telephone equipment, which they then used to create a complicated system for
    controlling their model trains. They were able to engineer a way to allow multiple
    operators to manipulate the track by dialing the telephone. These are considered
    to be the original hackers because they were able to take the equipment that they
    had and discover a new inventive use for it.


    A number of these model train hackers then became curious about the new computer
    systems that were being introduced on their campus. They were programming geeks
    that wanted to change the existing computer programs to make them better, customize
    them for special applications, and mostly just to have fun. The end result was
    that they produced modified and more elegant versions of the original programs.
    They weren’t just content to write programs that solved problems; they wanted
    their programs to solve problems in the best ways possible.


    In the 1970’s, there arose a different type of hacker whose focus was on exploiting
    the telephone system. These were referred to as “phreakers,” and their aim was
    to figure out how the electronic switching system worked so that they could make
    free long-distance phone calls. This is an example of one of the first anti-establishment
    movements that would later give birth to personal computer hackers.

