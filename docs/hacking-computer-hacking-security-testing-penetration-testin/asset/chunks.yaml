- fmt: '

    Protecting a website against directory traversal attacks by malicious hackers
    involves employing three major countermeasures:


    Avoid storage of old, confidential, and private files or records on the server.
    Make sure that only your `DocumentRoot` or `/htdocs` folder only contains the
    files that are critical to the smooth functioning of the website. Such files must
    never have any sensitive information that you wouldn’t want the public to see.


    Prevent Google and other search engines from crawling your site and storing sensitive
    data in their cache by configuring your `robots.txt` file.


    Make sure that the web server you are using is configured to allow only the necessary
    directories to be accessible by the public. Set up minimum privileges in order
    to control public access, and only allow access to the directories that enable
    the site to run properly. If you aren’t sure how to do this, read your web server
    documentation. If you are using Internet Information Services, check in your IIS
    Manager. In case your server is using Apache, check in the `.htaccess` or `httpd.conf`
    files.


    One other option that can be effective against malicious hackers is Google Hack
    Honeypot. This search engine honeypot attracts malicious hackers and enables you
    to see how they are hacking your site. You will then be able to take the relevant
    countermeasures.


    ## Default Script Attacks


    Most web developers or webmasters usually use scripts on their websites without
    really understanding how the script works and in most cases without testing them.
    They tend to put convenience over web security. A lazy web developer would rather
    use a publicly accessible script for their website yet such default scripts are
    very insecure. A malicious hacker can easily gain unauthorized access to the files
    stored on a web server and manipulate whatever they want.


    What makes default script attacks widespread is the fact that most programs, such
    as `Active Server Pages` and `Hypertext Preprocessor`, have scripts that are poorly
    written. There is a lot of poorly written code being used in websites. These errors
    can be seen in the content management systems that website developers and administrators
    use to maintain their content. All a hacker has to do is use sample scripts and
    install them on the target website.


    To deploy a default script attack, you first need to test for the presence of
    any script vulnerabilities. You can read through scripts manually or employ a
    text search tool to look for user ID’s, passwords, or other types of sensitive
    information. Examples of keywords to search for include `user`, `password`, `pwd`,
    `pass`, `root`, `admin`, or `logon`.


    ## Website Password Hacking


    Whenever a person fills in their username and password into a web application
    and clicks `ENTER`, that information is sent for authentication. However, a hacker
    can easily capture that information, store it, and analyze it at a later time.
    This becomes even easier if the hacker is doing it from a Local Area Network (LAN).


    The hack described below works best for LAN, so if you want to do it over the
    Internet, you will have to be on a central HUB or Gateway router. Make sure that
    the network you are on allows broadcast traffic and your LAN card is in promiscuous
    mode. Try the steps below using `VMWare` first.


    ### Instructions:


    1. Download and install `Wireshark` if you don’t already have it.


    2. Run `Wireshark` in `kali Linux`. Go to `Application > Kali Linux > Top 10 Security
    Tools > Wireshark`. Once `Wireshark` is open, click on `Capture`, and then `Interface`.
    In the device column, select the interface that you want to use. Press the start
    button for `Wireshark` to begin capturing traffic.


    3. Since `Wireshark` will capture a lot of traffic and data on the network, you
    will have to filter it out. Remember, we are only interested in the `POST` data
    because every login made by a user generates a `POST` method. This simply means
    that the user has sent data to a remote server. Go to the filter text box and
    type:


    ```

    http.request.method = = “POST”

    ```


    This will bring up a result showing all POST events.


    4. Analyze the data to obtain the username and password. Every user login will
    have its own line of information. Right-click on the line you want to hack information
    from. A list of options will open, and at the bottom click on `Follow TCP Stream`.
    A new window will open up, with the password and username being shown in the `password`
    and `scifuser` fields respectively. In some cases, the password may appear in
    hashed form, so you will have to identify the hash value.


    5. You can identify the hash type by using `Hash ID`. Run the program and type
    the words `hash-identifier` in the `root@kali` command line. Copy and paste the
    hash value in the `HASH` command line. The program will tell you the possible
    hash type.


    6. Use one of the many hashed password cracking tools available, such as `hashcat`,
    `cudahashcat`, or other software. This will reveal to you the actual plaintext
    password.


    ## Countermeasures against website hacking


    Maintaining the security of a website or web application requires constant vigilance.
    Web administrators and developers must keep up with what is going on in the hacking
    world, the tools being developed, and the techniques that malicious hackers are
    adopting. The following measures can help keep a website secure:


    - It is true that not every website can afford to implement `SSL` encryption for
    password security. However, administrators of public websites must ensure that
    passwords are at least hashed in order to provide one more layer of security against
    malicious hackers. There is no need making life easy for a hacker who might simply
    be trying their luck to hack your site.

    - A different machine should run every server in order to provide better protection
    for databases and web applications. Each machine should be thoroughly tested to
    make sure that its operating system is secure.

    - Utilize the in-built security features in the web server to control access and
    isolate different applications. In the event that one application is hacked, the
    other ones won’t be vulnerable.

    - Obscure the server’s identity using an anonymizer tool like `Port 80 Software
    ServerMask`.

    - Set up a network-based firewall to detect and prevent hackers from accessing
    your network.

    - Use programs like `ServerDefender` and `SecureIIS` to detect real-time attacks
    and stop them before they cause any damage.


    Keeping a website or web application secure requires every web developer to understand
    that they are the first line of defense. This can make a huge impact on the overall
    security of information.


    # Chapter 11: Hacking Wireless Networks


    There are many advantages to using wireless networking. However, this kind of
    technology comes with a host of threats and vulnerabilities that hackers can take
    advantage of. Since information is sent over the air via radio frequencies, it
    is easier for hackers to intercept it compared to wired connections. This is more
    so when the information being sent isn’t encrypted, or the encryption algorithm
    is pretty weak.


    Wireless networks consists of 4 basic elements:


    - A wireless access point that connects to the network

    - Data being transmitted via radio frequencies

    - The Client device used, such as a laptop, tablet, etc.

    - The users


    Every one of these elements can be targeted by a hacker to compromise at least
    one of the three major objectives of a secure network: availability, integrity,
    and confidentiality.


    ## Wireless Network attacks


    ### Accidental association


    It is possible for a wireless network to be hacked accidentally. In some cases,
    one wireless network overlaps with another, thus enabling any user to jump into
    another unintended network accidentally. This may seem benign but a malicious
    hacker can take advantage of this and gain access to information that should not
    have been exposed in such a manner. If the overlapping networks belong to organizations,
    then the link can be used to steal proprietary data.

