    这是一种黑客在目标人物最容易接触的地方进行攻击的技巧。例如，你可能在特定的日期或时间光顾某家特定的咖啡馆，并通常使用提供的 `Wi-Fi` 访问点。黑客可能会监控你的行程，在咖啡馆里创建一个虚假的
    `Wi-Fi` 访问点，并修改你喜爱的网站以获取你的个人信息。当你连接到虚假访问点时，黑客就能获取你的所有数据。


    ## 窃听与身份冒充


    这是一种被动攻击形式，黑客通过监控系统来获取密码和用户账户等信息。随后，黑客窃取用户的身份，并向受害者邮件联系人列表中的人员发送信息。受害者的联系人并不知道与他们分享敏感信息的人并非本人。黑客甚至可以向他们发送一个
    `Trojan` 程序并要求他们在自己的计算机上运行，从而让黑客获得访问更多密码和用户名的权限。


    ## 钓鱼劫持 (Pharming)


    这是一种钓鱼攻击形式，黑客将旨在访问某个特定真实网站的流量重定向到另一个虚假网站。钓鱼劫持（读音为“farming”）可以通过两种方式实现：修改用户计算机上主机站点的文件，或者利用该网站的
    `DNS` 服务器软件中的漏洞。`DNS` 服务器本应充当引导路标，将在线用户引导到正确的网站。如果 `DNS` 服务器被破解，用户将简单地带到黑客想让他们去的任何地方。这种形式的黑客通常针对在线银行和电子商务网站。


    ## 点击劫持


    这种技术也被用户界面欺骗。黑客在网站上一个看似真实的按钮或链接下方隐藏一段恶意代码。当毫无防备的用户点击该按钮或链接时，代码就会被激活。换句话说，你点击的是物理上看到的东西，但却产生了一个虚拟且非违心的的结果。


    例如，用户可以进入一个网站，完成后决定点击右上角的“X”按钮关闭窗口。然而，他们不知道黑客在该按钮下方隐形地放置了一个按钮，该按钮会触发 `Trojan`
    木马的下载、开启计算机的摄像头或删除防火墙规则。网站本身可能是合法的，但它已经被黑入并操纵了。或者，黑客可能会复制一个知名网站并在网上发布链接，或向人们发送带有链接的邮件。


    ## Cookie 窃取


    Cookie 窃取发生在黑客窃取网站赋予用户的 Cookie 时。随后，黑客使用同一个 Cookie 在用户登录的特定会话中冒充用户。这就是为什么 Cookie
    窃取被认为是会话劫持的一种形式。例如，用户每次登录 `Facebook` 时，网站都会向他们发放一个 Cookie 来证明他们在该会话期间的身份。如果用户在公共场所使用免费且未加密的
    `Wi-Fi` 浏览，黑客可以使用软件读取、复制并使用该 Cookie。黑客将能够发布信息、更改用户资料等。


    其他类型的会话劫持包括嗅探和 `Evil Twin`（邪恶入侵）攻击。嗅探是指恶意黑客使用某种软件拦截特定设备发送或接收的信息。`Evil Twin` 攻击涉及创建一个看似真实但并非真实的
    `Wi-Fi` 网络。用户无意中加入该网络，从而允许黑客发起中间人攻击。


    ## 中间人攻击


    这种攻击也简称为 `MiM` 或 `MitM` 攻击。这是一种涉及恶意黑客拦截双方之间的信息、冒充双方并以此收集正在传输信息的攻击。双方都不会意识到与他们通信的人是外部人员。这是一种实时窃听的形式，允许入侵者通过在在线会话中注入虚假信息来操纵他人。黑客将要求双方提交敏感信息，如银行账户号码和密码。对话可能发生在两个人之间，也可能是客户端与服务器之间。金融网站是
    `MitM` 攻击最常见的目标。


    ## 间谍软件


    这是黑客安装在受害者计算机上的计算机软件，以便在用户不知情的情况下收集敏感信息。该软件可以在黑客无需物理接触受害者计算机的情况下远程安装。与蠕虫和病毒不同，间谍软件并不是为了自己传输到其他设备。


    黑客知道用户永远不会主动下载间谍软件，因此他们通常将其寄生在合法软件中，例如流行的网络实用工具，甚至是反间谍程序。用户只是简单地从互联网下载并运行软件，而不知道自己正被监视。某些间谍软件甚至被固化在音乐光盘或共享软件中。用户还可能被骗点击一个按钮或链接，该按钮在表面上似乎可以保护他们免受意外下载的影响。例如，可能会弹出一个关于免费优化计算机系统的广告对话框。用户被要求点击
    `Yes` 或 `No` 按钮，但无论点击哪一个按钮，间谍软件都会被下载。


    # 第 3 章：伦理黑客计划


    在没有先进行安全测试的情况下，你无法开始伦理黑客过程。需要对涉及的战术和策略问题达成共识。为了确保你的努力成功，请花需要的时间进行计划，无论是简单的操作系统密码破解测试，还是对网络环境漏洞的全面评估。


    ## 寻找你的目标


    信不信，寻找完美的黑客受害者需要大量的研究。黑客不会仅仅跳向他们遇到的目标。必须对潜在目标进行一些策略性研究，分析其习惯，并最终选择最佳技术。


