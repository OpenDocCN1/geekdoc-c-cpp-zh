- fmt: '

    Most people think of hacking as disruptive and damaging, but the truth is that
    hackers are a necessary component of cyber and information security. Launching
    an ethical hack is important if individuals and organizations are going to be
    able to effectively tighten up security vulnerabilities.


    So why is hacking the best way to test a network or system?


    ### Reason #1: Malicious hackers are never going to quit their attempts to crack
    systems.

    They are always developing new and advanced tools and methods to bypass existing
    security protocols. If ethical hackers do not keep up with them, then systems
    and networks will be compromised daily like never before. The best way to beat
    your opponent is to learn how they think, know everything that they know (and
    then some), and beat them at their own game.


    ### Reason #2: Legal compliance and checklist audits just won’t cut it.

    There are certain laws and regulations that necessitate proper security measures
    be put in place by organizations. However, complying with these regulations does
    not mean that you are automatically secure from malicious hackers. Checklist audits
    are great, but they won’t provide the protection required. Ethical hacking tools
    and methods are the best way to find those real vulnerabilities that an audit
    cannot detect.


    ### Reason #3: Ethical hacking can work together with high-level security audits.

    There is no reason to put all your eggs in one basket. Having compliance checks
    and internal audits as part of your security initiative is great, but incorporating
    ethical hacking as part of the process is much more effective.


    ### Reason #4: Partners and clients are now more keen on the security of organizations
    they do business with.

    There are a lot of businesses who won’t work with a partner who cannot assure
    them of the security of their network. Clients and partners now demand in-depth
    security assessments of companies they work with. An ethical hacking report can
    provide this assurance.


    ### Reason #5: With information systems getting more complex every day, it won’t
    be long before malicious hackers gain the upper hand.

    People need to be aware that a malicious hacker needs to find just one flaw in
    a system to launch an attack. The guys at the IT department need to find all vulnerabilities.
    Who has the higher chance of success? In order to protect systems and networks,
    you need to think like a malicious hacker.


    ### Reason #6: Ethical hacking shows potential threats in a practical way.

    In most cases, people in management don’t really grasp the impact that a criminal
    hacker can have on their systems. It’s one thing to know that passwords are weak,
    but seeing the outcome of an exploit resulting from weak passwords is a totally
    different case. Ethical hacking helps to improve people’s understanding of security
    vulnerabilities and motivate countermeasures to be put in place.


    ### Reason #7: Ethical hacking can provide a fall back plan in case of a security
    breach.

    If a malicious hacker gets into a system and the business is slapped with a lawsuit,
    the management can use previous hacking tests to show that it was engaging in
    periodic security checks. It can be very costly if it is proven that a business
    was not doing enough to secure the information that was entrusted to it.


    ### Reason #8: Ethical hacking incorporates both vulnerability evaluations and
    penetration testing.

    On its own, a vulnerability evaluation is simply not adequate enough to detect
    every flaw in the system. The same is true for a penetration test. However, combining
    the two through ethical hacking provides the best of both worlds.


    ### Reason #9: Ethical hacking is able to reveal deep vulnerabilities that may
    have been ignored for a long time.

    An ethical hacker usually uncovers technical, human, and physical vulnerabilities.
    However, hacking is also able to reveal flaws with the way IT and security personnel
    operate, for example, poor awareness, failure in change management, etc.


    # Chapter 13: The Do’s and Don’ts of Hacking


    As a hacker, you must always make sure that every move you make is the right one.
    It may feel like fun when you start hacking, but there are some potential pitfalls
    that rookie hackers must watch out for. These mistakes may mean the difference
    between deploying a successful hack and getting hacked yourself, or getting busted.


    For those who are serious about hacking the right way and not getting caught,
    there are specific methods that you have to use to avoid detection. The methods
    explained below are used by expert hackers to stay ahead of those who want to
    bring them down.


    ## Avoiding Detection When Hacking


    Ensure that your hard drive is encrypted. Use `VeraCrypt`, an open source disk
    encryption that provides very strong security. Learn more about `VeraCrypt` from
    `www.sourceforge.net/projects/veracrypt/`.


    Install a desktop OS that is able to run like a virtual machine with traffic being
    routed via `Tor`. It is recommended that you install `Whonix` in the encrypted
    hard drive described above. `Whonix` is made up of two sections: `Whonix-Gateway`
    and `Whonix-Workstation`. `Whonix-Gateway` runs `Tor` only and controls all access
    to the internet. In other words, you can only connect online through `Tor` - nothing
    else works. `Whonix-Workstation` operates on a totally isolated network. `Whonix`
    allows you to stay anonymous online, with servers and applications running undetected.
    Even malware that has root privileges cannot reveal your actual IP address. Find
    out more from `www.whonix.org`.


    Do not use `Whonix` for personal stuff - normal, everyday computer activities.
    You do not want to risk your personal information being used to identify you.


    Avoid using `Tor` exit nodes for direct hacks, since they are slow, have been
    blacklisted, and are unable to receive connect-backs necessary for reverse shells.
    `Tor` is able to offer anonymous connections to the infrastructure that you will
    use to perform your hacks (this infrastructure includes compromised servers to
    be used as decoys, stable servers for receiving reverse shells, and clean domain
    names). The connection between you and your infrastructure will be low bandwidth
    text interface (`SSH`), and this will enable enable high bandwidth connection
    to whatever system or network you are targeting.


    Use `bitcoins` when buying your hacking tools, for example, domain registration
    servers, anonymous `VPN`, and virtual private servers. There’s nothing as dumb
    as paying for such things using your personal credit card. Always make sure that
    you separate your personal identity with any hacking activities you engage in.


    `Tor` may be a great solution for keeping your traffic anonymous, but it is still
    advisable to use a connection that will not be linked to your name or address.
    You can even borrow someone else’s internet connection by using a device known
    as a “cantenna.” `Tor` has been attacked in the past, so you should always look
    at adding extra layers of security.


    Consider the following points to be the don’ts of hacking, especially for beginners.


    Do not fall for any websites that offer hacking software or offer email IDs in
    exchange for money. These are scam websites targeting fresh and wannabe hackers.
    They will take your money and whatever they give you in return will not work.


    Do not download `Trojans` and `keyloggers` as freeware over the Internet. These
    kinds of software are not free and you may end up allowing another hacker entry
    into your system.


    Do not limit your hacking abilities by relying solely on hacking software and
    tools. Learn how to write your own programs, codes, and scripts. These are the
    essential weapons of every great hacker.

