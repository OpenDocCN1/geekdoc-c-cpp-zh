    不要满足于仅拥有一项技能，例如 Web 开发或编程。成为一名伟大的黑客需要你成为一名出色的程序员、开发者、安全专家和脚本编写人员。


    # 第 14 章：预测黑客的未来


    在当今世界中，成为一名 IT 专业人士非常艰辛。技术进步的速度让现有的边界安全解决方案看起来像筛子一样。跟上不断增加的新型威胁似乎是最好的方法，但实际上，放慢速度可能是一个更佳的主意。


    大多数人假设，网络安全面临的最大威胁将来自新的或未知的漏洞。然而，专家们一致认为，事实上，这些威胁将源于为人知的弱点。这些漏洞与一些在世界范围内获得更多认可、流行和使用的当前技术有关。


    这些构成黑客未来的一些当前技术趋势包括：


    ## 云计算


    随着越来越多的组织和企业转向云端，黑客也也将注意力转向攻击云计算平台。市场对渗透测试等方法的需求日益增长，以便在云计算威胁发生之前对其进行识别。企业也在寻求开发应对措施以防止此类攻击。


    黑客安全团队在面对云应用面临的挑战是其可见性有限且控制选项较少。众周知，未来的网络攻击将发生在所谓的“影子数据/IT”（Shadow Data/IT）中。这是在云上进行未经监控、控制或保护的数据或
    IT 活动。影子数据/IT 导致了新威胁向量的产生，包括数据的滥用和最终泄露，并允许恶意黑客轻松访问系统或网络。


    为了让组织和企业处理影子数据/IT，他们必须制定企业策略，要求员工改变他们在云上使用数据的方式。文化转变需要从检测和惩罚转向接受和保护。


    组织要监管员工的云活动非常困难，但他们可能不必这样做极端。至少应该有监控不同云服务上影子数据/IT 的技术，以便通过可见性降低风险。


    ## 移动设备与平台


    今天，几乎每个系统或应用程序都可以通过任何移动设备、平台或浏览器访问。这导致黑客客转向这些新目标。近年来，移动黑客工具的性激增。


    ## 新漏洞


    恶意黑客在寻找新漏洞以利用并破解网络方面永不疲倦。新漏洞的示例包括：


    - `Heartbleed CVE-2014-0160`

    - `Shellshock CVE-2014-6271`

    - `Poodle CVE-2014-3566`


    ## 黑客的职业机会


    随着当今飞速发展的数字世界威胁不断增加，人们担心恶意黑客可以随心所欲随时随地攻击。这意味着最佳解决方案是雇佣道德黑客不断寻找薄弱环节并开发适当的应对措施。这就是道德黑客的工作。


    对道德黑客专业人员的需求每天都在增长，无论是来自政府还是商业企业。任何渴望成为道德黑客的人都需要考虑获得认证并成为专业人士——认证的道德黑客（CEH）。薪水非常优厚，每项任务平均收入
    15,000 到 45,000 美元。客户环境对薪酬也有影响。道德黑客认证的最新版本是 `CEH v9`。


    一些要求包括 IT 经验、`Linux/UNIX` 基础以及对 `TCP/IP` 的良好理解。如果你想把黑客作为职业，这绝对是考虑的。


    # 结论


    显而易见，黑客是一个大多数人并不真正理解的话题。原因之一是媒体及其倾向于戏剧化黑客的方式，从而导致了更多的错误信息和误解。任何打算接触黑客技术的人必须首先改变心态。


    尽管黑客被描绘成犯罪活动，但它包含了大量的知识和有益使用的巨大潜力。事实是，今天使用的许多甚至所有软件和网络都有可以被利用的漏洞。技术正以非常快的速度移动，随着行业利润的增加，少数坏元素试图破坏系统来获利。


    这就是为什么道德黑客很重要。他们仍然是黑客，但他们这样做是为了帮助系统和网络在受到攻击时更加安全。遗憾的是，法律是使黑客变得困难的因素之一。它不分地将黑客行为犯罪化，而没有意识到未来会有无数漏洞被利用。那些旨在防止人们研究他们日常生活中使用的系统的法律是严酷且毫无帮助的。


    我们希望这本书能开你的眼界，让你看到黑客技术的巨大潜力、技巧以及学习它的重要性。随着技术的进步，你也必须提高自己的技能。我们与你分享的知识只是这段漫漫之旅的起点。你必须决定继续学习、努力并跳出思维框架。应用书中的知识，永不回头。


    感谢阅读本书。祝你好运！


