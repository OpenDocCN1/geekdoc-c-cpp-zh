  trans: "\n防止恶意黑客对网站发起的目录遍历攻击主要涉及采用三种主要的防御措施：\n\n避免在服务器上存储旧的、机密的和私有的文件或记录。确保您的 `DocumentRoot`\
    \ 或 `/htdocs` 文件夹仅包含对网站顺利运行至关的文件。此类文件绝不能包含任何你不希望公众看到的敏感信息。\n\n- 通过配置您的 `robots.txt`\
    \ 文件，防止 Google 和其他搜索引擎爬取您的网站并将敏感数据存储在它们的缓存中。\n\n 确保您正在使用的 Web 服务器已配置为仅允许公众访问必要的目录。设置最小权限以控制公共访问，并仅允许访问使网站正常运行的目录。如果您不确定如何操作，请阅读您的\
    \ Web 服务器文档。如果您正在使用 Internet 信息服务（IIS），请在 IIS 管理器中检查。如果您的服务器使用的是 Apache，请检查 `.htaccess`\
    \ 或 `httpd.conf` 文件。\n\n另一种可以有效对抗恶意黑客的方案是使用 Google Hack Honeypot（Google 黑客攻击蜜罐）。这种搜索引擎蜜罐会吸引恶意黑客，并让你看到他们是如何攻击您的网站的。随后您就可以采取相应的防御措施。\n\
    \n## 默认脚本攻击\n\n大多数 Web 开发人员或网站管理员通常在网站上使用脚本，但并不真正理解脚本的工作原理，而且在大多数情况下没有经过测试。他们倾向于将便利性置于网络安全之上。懒惰的\
