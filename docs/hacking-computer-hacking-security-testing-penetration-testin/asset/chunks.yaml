    For a crypt()-style password that uses only 8 characters, a hacker would have
    to contend with 958 possible input characters. In other words, you would have
    to guess the correct password from a possible 7 quadrillion combinations. The
    more characters that a user adds to their password, the greater the number of
    possible passwords a hacker has to deal with. The growth is exponential.


    If you use a computer that makes 10, 000 cracks every second, it would take you
    22,875 years. Even if you were to get about 1000 computers to help you out, it
    would still take you an average of 22 years to crack the password.


    On the other hand, if the possible passwords grow exponentially with every character
    that is added, then the opposite is also true. Reducing the number of characters
    from a password slashes the possible passwords exponentially. For example, if
    you want to brute force a password with four characters only, and assuming you
    have a machine that performs 10,000 cracks per second, it would take you about
    two hours to do so. The password does not even have to comprise dictionary words,
    for example, `g5T&`. It will still be cracked very quickly.


    One advantage of the brute force attack technique is that it ultimately will crack
    the password, regardless of how complex it is. The problem as said before, is
    that nobody can predict how long this will take.


    Examples of cracking programs that apply the brute force method include `Oracle`,
    `Rarcrack`, and `John the Ripper`.


    ## Rainbow Tables


    This mode of attack is pre-computed, unlike dictionary and brute force methods
    where a hacker has to enter a password into the user’s system and then compare
    it to the original password. When using rainbow tables, hashes are first computed
    for every word in a dictionary and are then stored in a hash table. The rainbow
    tables then retrieve the user’s hashed password from the system and compare it
    to the list of passwords in the hash table.


    There are some assumptions that have to be made, namely that the hacker can retrieve
    the user’s hashed password, and that the algorithm used to hash the password is
    the same as the one used in the rainbow table. However, most low-security hashes
    tend to use `SHA-1` and `MD5`, so use these algorithms for your rainbow tables.


    The downside with this method is that the tables require a huge storage space
    on your hard drive. It is clear that different plaintext passwords will result
    in different hashed passwords containing different salts. This means that every
    salt would need its own table. If a `DES crypt()` function is being used, the
    number of salt values would be 4,096, thus making rainbow tables not feasible
    even with a 4-character password. This is no longer a big problem since memory
    is much cheaper nowadays, but the need for large storage space tends to discourage
    this method of cracking.


    Examples of some programs that apply rainbow tables include `RainbowCrack` and
    `OphCrack`.


    ## Password Probability Matrix


    In technological circles, it is accepted that there will always be a trade-off
    between storage space and computational power. For example, `mp3` files require
    very little storage space for the high-quality music file, but that simply increases
    the need for greater computational power. Your regular calculator, on the other
    hand, requires very little computational power because it contains a pre-computed
    lookup table that stores functions.


    A password probability matrix works by trying to find the perfect balance between
    power and space, in order to reduce the time that a brute force attack would take
    to crack a password. In other words, the time and the storage space required must
    be reasonable. Unfortunately, you will still have to deal with salts. However,
    this problem can be mitigated by minimizing the amount of storage space required
    without compromising the space needed for the 4,096 possible salts in `crypt()`
    password hashes.


    This method involves building a 3-D binary matrix that links portions of the plaintext
    values with portions of the hash values.


    The downside to using a probability matrix is that it takes a very long time to
    create the matrix itself. In fact, this would take as much time as running a brute
    force attack. The salts would also still pose a problem for a hacker.


    ## How to use John the Ripper and pwdump3 to crack a password


    `John the Ripper` is used when cracking hashed Windows and LINUX passwords, while
    `pwdump3` is used to extract hashed passwords from a Security Accounts Manager
    database. It should be noted that you will require administrative access to make
    this work.


    For windows passwords, follow the easy steps described below.


    1. From your Windows `C:` drive, create a directory and name it `passwords`.

    2. If you do not have a decompression tool, you need to download and install one
    on your computer. You can use `7-zip` or `WinZip`.

    3. Download `John the Ripper` and `pwdump3`, extract, and install them in your
    system. Make sure you extract them into the same `passwords` directory created
    in step 1.

    4. Type in the command below to run `pwdump3`:

    ```

    c :passwdump3 > cracked.txt

    ```

    This will redirect the output into the file `cracked.txt`, which will capture
    the Windows SAM password hashes that `John the Ripper` cracks.

    5. Type the command:

    ```

    c :passwordsjohn cracked.txt

    ```

    This command will run `John the Ripper` against the Windows password hashes. The
    result should be the cracked passwords of the Windows user(s), though it is difficult
    to estimate how long the process will take. It all depends on the number of users
    and the level of complexity of their passwords.


    For LINUX/UNIX systems, follow the steps described below:


    1. Download LINUX source files.

    2. Type the command below to extract the program:

    ```bash

    [root@localhost yourcurrentfilename ] #tar - zxf john -1.7.9.tar.gz

    ```

    3. Go to the `/src` directory created after the program was extracted in step
    2. Type the command: `generic`

    4. Go to the `/run` directory. Type the command:

    ```bash

    .unshadow /etc/passwd /etc/shadow > cracked.txt

    ```

    This command will utilize the `unshadow` program to merge the shadow files and
    password and copy them into the `cracked.txt` file.

    5. Launch the cracking process by entering the command:

    ```bash

    . john cracked.txt

    ```

    This process may take a while to complete, but once `John the Ripper` has finished,
    you will get an output similar to what you had in the Windows.


    ## Password Storage Locations


    Different operating systems usually store the passwords in their own unique locations.
    For example, Windows stores its passwords in:


    - Security Accounts Manager (SAM) database: `c:winntsystem32config` or `c:windowssystem32config`.

    - Active Directory database: This is stored locally or across different domain
    controllers.


    For LINUX and other associated operating systems, passwords are stored in:


    - `/etc/passwd`

    - `/.secure/etc/passwd`

    - `/etc/security/passwd`

    - `/etc/shadow`


    If you had to choose between setting up a weak password that you could remember,
    and creating a very strong one that was too complex and had to be written down,
    which option would you go for? The better option would be to write the complex
    password down and store it in a secure place. A secure place does not include
    a password-protected computer file. The most secure storage options you have include:


    - Password managers: These are tools that can store multiple passwords for different
    accounts. For example `Password Safe`, `LastPass`, or `Dashlane`.

    - Fully encrypting your hard drive to lock out malicious hackers who intend to
    access the operating system.

    - A locked safe or file cabinet.

