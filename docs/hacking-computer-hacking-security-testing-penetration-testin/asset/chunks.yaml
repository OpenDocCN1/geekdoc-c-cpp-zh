    This occurs when malicious hackers gain access to a private network using their
    own device rather than through the legitimate access point (AP). A hacker can
    create a “soft AP,” which can be a laptop with software that makes its wireless
    network card appear to be a genuine access point. This allows the hacker to steal
    passwords, attack computers, or send users Trojan horse programs. A hacker can
    effectively have full control of every computer that joins the fake network.


    ## Ad-hoc Networks


    These are networks between two wireless computers with no access point separating
    them. Such networks can be attacked quite easily since they rarely have adequate
    protection.


    ## Non-traditional networks


    These include Bluetooth devices, wireless printers, handheld PDAs, and barcode
    readers. These kinds of networks are rarely secured by IT personnel since all
    the focus is usually on laptops or access points. This makes them fair game for
    malicious hackers.


    ## MAC Spoofing


    This is a form of identity theft where a hacker monitors network traffic in order
    to identify which computer has network privileges. The aim is to steal the `MAC`
    (Media Access Control) address of that particular computer within the network.
    The majority of wireless systems have a `MAC` filter that allows only specific
    computers with specific `MAC` addresses to access and use the network. A hacker
    may get software that is able to “sniff” the network to find these authorized
    computers and their IDs, and then employ other software that allow the hacker’s
    computer to use these stolen `MAC` addresses.


    ## Man-in-the-middle Attacks


    This occurs when a malicious hacker sets up their laptop as a soft access point
    and then lures other users to use it. The hacker then connects the soft access
    point to a genuine access point using a different wireless card, thus forcing
    users to go through the fake AP to reach the real one. This enables the hacker
    to sniff out whatever information they want from the traffic. This type of attack
    has been made easier by software such as `AirJack` and `LANjack`. Wireless Hotspots
    are a great place to launch this kind of attacks since there is hardly any meaningful
    security on such networks.


    ## Denial of Service Attacks


    This is where a hacker continuously sends numerous requests, commands, and messages
    to a specific access point until the network crashes, or just to prevent genuine
    users from getting onto the network.


    ## Network Injection Attack


    A malicious hacker injects counterfeit networking re-configuration commands into
    an access point that doesn’t filter traffic. These fake commands bring down the
    entire network or switches, routers, and hubs, forcing a reboot or reprogramming
    of every networking device.


    ## Wireless Network Authentication


    Wireless networks are designed to be accessible to anyone who has a wireless-enabled
    device. For this reason, most networks are protected using passwords. There are
    two common authentication techniques used: `WEP` and `WPA`.


    ### WEP


    This stands for Wired Equivalent Privacy and was developed to provide users with
    the same level of privacy as wired networks. It adheres to `IEEE 802.11` WLAN
    standards. `WEP` encrypts data that is being sent over a network to prevent eavesdropping.


    ### WEP vulnerabilities


    There are significant flaws in the design of this type of authentication technique:


    - It uses `Cyclic Redundancy Check 32` to verify the integrity of packets. The
    problem with `CRC32` is that a hacker only needs to capture two packets to crack
    into the network. They can also modify the checksum and encrypted stream to force
    the system to accept the packet.

    - It uses an `RC4` encryption algorithm to make stream ciphers composed of a secret
    key and an Initial Value (`IV`). The `IV` length is fixed at 24 bits but the secret
    key can be 40 to 104 bits in length. If a secret key of lower length is used,
    the network becomes easier to hack.

    - Since it is a password-based authentication technique, a hacker can successfully
    deploy a dictionary attack.

    - It does not have a central key management system, thus making it very difficult
    to change keys in big networks.

    - Due to the numerous security flaws, `WEP` has fallen out of favor and replaced
    by `WPA`.


    ### How to crack WEP networks


    Exploiting the numerous security vulnerabilities on a `WEP` network is possible
    either through passive attacks or active cracking. If a passive attack is launched,
    the network traffic is not affected until `WEP` authentication has been successfully
    cracked. This makes it harder to detect. Active cracking tends to increase the
    load on the network, thus making it easier to detect, though it is also more effective.


    The tools that can be used for cracking `WEP` include:


    - `Aircrack` - This is also a network sniffer, and can be downloaded from `www.aircrack-ng.org/`

    - `Kismet` - This multi-purpose tool can sniff network packets, detect invisible
    and visible networks, and even identify intrusions. It can be downloaded from
    `www.kismetwireless.net/`

    - `WEPCrack` - This open-source tool can crack secret keys, and can be downloaded
    at `www.wepcrack.sourceforge.net/`

    - `WebDecrypt` - It cracks `WEP` keys using dictionary attack and generates its
    own keys. Get it at `www.wepdecrypt.sourceforge.net/`


    ### WPA


    This stands for Wi-Fi Protected Access and was developed to cover the vulnerabilities
    that were discovered in `WEP`. `WPA` uses greater `IV` than `WEP` - 48 bits to
    be precise. Packets are encrypted using temporal keys.


    ### WPA vulnerabilities


    - Hackers can easily overcome it using denial of service attacks.

    - Its keys rely on passphrases, and if weak passphrases are used, a dictionary
    attack can be successfully launched.


    ### How to crack WPA networks


    Since `WPA` uses passphrases to authenticate user logins, a well-coordinated dictionary
    attack makes it vulnerable, especially if short passphrases are used. The tools
    for cracking `WPA` include:


    - `Cain and Abel` - It is used to decode files that have been sniffed by other
    programs like `Wireshark`.

    - `CowPatty` - This is a brute force attack tool that cracks pre-shared keys.
    Download from `wirlessdefenc.org/Contents/coWPAMain.htm`


    ### How to crack WPA and WEP keys


    You are going to need the right software, hardware, and patience in order to crack
    the keys to a wireless network. However, successfully doing so is dependent on
    the activity levels of users within the network.


    `Backtrack` is a great security operating system that is based on Linux. It contains
    many well-known tools that are very effective for collecting data, evaluating
    weaknesses, and exploiting networks. Some of these tools include `Metasploit`,
    `Ophcrack`, `Wireshark`, `NMap`, and `Aircrack-ng`.


    Cracking network authentication requires the following:


    - Wireless network adapter able to inject packets.

    - `Backtrack` OS, downloadable from `backtrack-linux.org/downloads/`

    - Proximity to the network radius.

    - Adequate know-how of Linux OS and how to use the scripts in `Aircrack`.

    - Patience, as there are factors that you may not be able to control. Remember,
    the greater the number of people actively accessing the network, the faster this
    will work.


    ### How to perform MAC spoofing


    In order to carry out MAC spoofing, you will have to bypass the MAC filtering
    that the target network is using. MAC filtering is commonly used to lock out MAC
    addresses that have not been authorized to connect to a wireless network. This
    is usually an effective way to prevent people who may somehow acquire the password
    from connecting to the network. However, MAC filtering is not an effective security
    measure when it comes to locking out hackers.


    The steps below will show you exactly how to go about spoofing the MAC address
    of a client who is authorized to connect to the network. The Wi-Fi adapter should
    be in monitoring mode. `Airodump-ng` on `kali Linux` will be used to recover the
    MAC address. After this, `Macchanger` program will be used to do the spoofing,
    bypass the filter, and connect to the network.

