    be doc. Zip, pdf, rar,db, and so on. Some of these file types may contain regular
    web information, but you never know what valuable information you might find,
    so check them anyway. A practical example would be:


    filetype: pdf site:www.madhatter.com


    There are other types of advanced Google operators that you can use, such as:


    inurl - This operator looks for the keywords you want within a web page’s URL.


    allintitle - This operator looks for keywords within the title of all web pages.


    link - This operator reveals all other websites that are linked to a specific
    web page.


    related - This operator looks for web pages that are similar to the one you have.


    ### Directory traversal countermeasures'
