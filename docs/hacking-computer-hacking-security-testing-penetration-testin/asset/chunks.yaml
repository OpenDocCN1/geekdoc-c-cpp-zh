  trans: '


    大多数人认为黑客攻击是破坏性和具有危害的，但事实是，黑客是网络和信息安全不可或缺的组成部分。如果个人和组织想要有效地收紧安全漏洞，发起道德黑客（ethical
    hack）至关重要。


    那么，为什么黑客攻击是测试网络或系统的最佳方法？


    ### 理由 #1：恶意黑客永远不会放弃破解尝试。

    他们一直在开发新的先进工具和方法来绕过现有的安全协议。如果道德黑客不跟上他们的脚步，系统和网络每天将受到以前所未有的频率的侵害。击败对手最好的方法是学习他们的思维方式，了解他们知道的一切（甚至更多），并在他们擅长的领域上击败他们。


    ### 理由 #2：法律合规和清单式审计是不够的。

    某些法律和法规要求组织必须采取适当的安全措施。然而，合规这些规定并不意味着你自动免受恶意黑客的攻击。清单式审计固然很好，但无法提供所需的保护。道德黑客工具和方法是发现那些审计无法检测的真实漏洞的最佳途径。


    ### 理由 #3：道德黑客可以与高级安全审计协同工作。

    没有理由将所有的鸡蛋放在一个篮子里。将合规检查和内部审计作为安全倡议的一部分是极好的，但将道德黑客攻击纳入流程中会有效得多。


    ### 理由 #4：合作伙伴和客户现在更加关注与其业务来组织的安全性。

    许多企业不会与无法保证其网络安全的合作伙伴合作。客户和合作伙伴现在要求对与其合作的公司进行深度的安全评估。一份道德黑客报告可以提供这种保证。


    ### 理由 #5：随着信息系统每天变得复杂，恶意黑客占据上风将指日可待。

    人们需要意识到，恶意黑客只需要找到系统中的一个缺陷即可发动攻击。而 IT 部门的人员需要找到所有的漏洞。谁获胜的概率更高？为了保护系统和网络，你需要像恶意黑客一样思考。


    ### 理由 #6：道德黑客能以实用的方式展示潜在威胁。

    在大多数情况下，管理层人员并不真正理解犯罪黑客对系统可能产生的影响。知道密码很弱是一回事，但看到由于密码弱弱导致的漏洞利用结果完全是另一回事。道德黑客有助于提高人们对安全漏洞的理解，并促使采取应对措施。


    ### 理由 #7：道德黑客可以在发生安全漏洞时提供备用计划。

    如果恶意黑客进入系统并导致企业面临诉讼，管理层可以使用之前的黑客测试来证明他们一直在进行定期的安全检查。如果证明企业没有投入足够的努力来保护受托信息，其代价将是非常昂贵的。


    ### 理由 #8：道德黑客攻击结合了漏洞评估和渗透测试。

    单凭漏洞评估本身不足以检测到系统中的每一个缺陷。渗透测试也是如此。然而，通过道德黑客攻击将两者结合，可以兼得其长。


    ### 理由 #9：道德黑客能够揭示可能被忽视已久的深层漏洞。

    道德黑客通常会发现技术、人为和物理漏洞。然而，黑客攻击还能揭示 IT 和安全人员操作方式中的缺陷，例如：意识薄弱、变更管理失败等。


    # 第 13 章：黑客行为准则与忌


    作为一名黑客，你必须始终确保每一步行动都是正确的。开始黑客时可能觉得很有趣，但新手黑客必须警惕一些潜在的陷阱。这些错误可能决定你是成功执行了一次攻击，还是被反黑，甚至是被捕。


    对于那些认真想要以正确方式进行黑客活动且不被发现的人，必须使用某些特定方法来避免检测。下文的方法被专家黑客使用，以领先于那些想要击败他们的人。


    ## 黑客攻击时避免检测


    确保你的硬盘已加密。。使用 `VeraCrypt`，这是一种开源磁盘加密软件，提供了极强的安全性。从 `www.sourceforge.net/projects/veracrypt/`
    了解更多关于 `VeraCrypt` 的信息。


    安装一个能够像虚拟机一样运行且通过 `Tor` 路由流量的桌面操作系统。建议在上述加密硬盘上安装 `Whonix`。`Whonix` 由两个部分组成：`Whonix-Gateway`
    和 `Whonix-Workstation`。`Whonix-Gateway` 仅运行 `Tor` 并控制所有访问的访问。换句话说，你只能通过 `Tor`
    连接在线——其他方式都无法工作。`Whonix-Workstation` 在完全隔离的网络上运行。`Whonix` 允许你在网上保持匿名，服务器和应用程序在不被检测的情况下运行。即使是具有
    root 权限的恶意软件也无法暴露真实的 IP 地址。从 `www.whonix.org` 了解更多信息。


    不要将 `Whonix` 用于个人事务——即正常的、日常的计算机活动。你不想承担个人信息被用来识别你自己的风险。


    避免使用 `Tor` 出口节点进行直接攻击，因为它们很慢、被列入名单，并且无法接收反向 shell（reverse shells）所需的连接回。`Tor`
    能够为你用于执行攻击的基础设施提供匿名连接（这些基础设施包括用作诱饵的被破服务器、用于接收反向 shell 的稳定服务器以及干净域名）。你与基础设施之间的连接将是低带宽文本接口
    (`SSH`)，这将使你对任何目标系统或网络开启高带宽连接。


    在购买黑客工具时使用 `bitcoins`，例如域名注册服务器、匿名 `VPN` 和虚拟专用服务器。使用个人信用卡支付此类费用是非常愚蠢的。务必确保将你的个人身份与你从事的任何黑客活动离开来。


    `Tor` 可能是保持流量匿名的很好的解决方案，但仍建议使用与你的姓名或地址无关的连接。你甚至可以使用被称为“cantenna”的设备借用别人的互联网连接。`Tor`
    过去曾受到攻击，因此你应该考虑增加额外的安全层。


    将以下几点视为黑客行为的忌，特别是对于初学者。


    不要落入任何提供黑客软件或以货币换取邮箱 ID 的网站。这些是针对新手和想当黑客者的诈骗网站。他们会拿走你的钱，给你的任何东西都是不起作用。


    不要在互联网上作为免费软件下载 `Trojans` 和 `keyloggers`。这类软件并不是免费的，你可能最终允许另一个黑客进入你的系统。


