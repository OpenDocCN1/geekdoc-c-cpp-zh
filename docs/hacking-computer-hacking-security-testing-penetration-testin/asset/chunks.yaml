    \n默认脚本攻击之所以流行，是因为大多数程序（如 `Active Server Pages`（ASP）和 `Hypertext Preprocessor`（PHP））拥有的脚本编写得很糟糕。网站中使用了大量编写不当的代码。这些错误在网站开发者和管理员用于维护内容的内容管理系统中随处可见。黑客只需要使用示例脚本并将其安装到目标网站即可。\n\
    \n要实施默认脚本攻击，您首先需要测试是否存在任何脚本漏洞。您可以手动阅读脚本，或使用文本搜索工具来查找用户 ID、密码或其他类型的敏感信息。要搜索的关键词示例包括\
    \ `user`、`password`、`pwd`、`pass`、`root`、`admin` 或 `logon`。\n\n## 网站密码破解\n\n每当人在\
    \ Web 应用程序中输入用户名和密码并点击 `ENTER` 时，该信息会被发送进行身份验证。然而，黑客可以轻松捕获这些信息、存储并在稍后进行分析。如果黑客是从局域网（LAN）进行的，这会变得更容易。\n\
    \n下文描述的破解方法最适用于局域网，因此如果您想通过互联网进行，您必须处于集中的 HUB 或网关路由器上。确保您所处的网络允许广播流量，且您的网卡处于混杂模式。请先使用\
    \ `VMWare` 尝试以下步骤。\n\n### 操作说明：\n\n1. 如果您还没有 `Wireshark`，请下载并安装。\n\n2. 在 `kali\
    \ Linux` 中运行 `Wireshark`。进入 `Application > Kali Linux > Top 10 Security Tools\
    \ > Wireshark`。打开 `Wireshark` 后，点击 `Capture（捕获），然后点击 `Interface（接口）。在设备列中，选择要使用的接口。按下\
    \ `Wireshark` 的启动按钮开始捕捉流量。\n\n3. 由于 `Wireshark` 会捕捉网络上大量的流量和数据，您需要对其进行过滤。记住，我们只对\
    \ `POST` 数据感兴趣，因为用户的每次登录都会生成一个 `POST` 方法。这这意味着用户已向远程服务器发送了数据。进入过滤器框并输入：\n\n```\n\
    http.request.method = = “POST”\n```\n\n这将显示显示所有 POST 事件的结果。\n\n4. 分析数据以获取用户名和密码。每个用户登录都有其单独的一行信息。右键点击您想要破解信息的所在行。将弹出一个选项列表，在底部点击\
    \ `Follow TCP Stream（跟踪 TCP 流）`将打开一个新窗口，密码和用户名分别显示在 `password` 和 `scifuser` 字段中。在某些情况下，密码可能以哈希形式出现，因此您必须识别哈希值。\n\
    \n5. 您可以使用 `Hash ID` 来识别哈希类型。运行程序并在 `root@kali` 命令行中输入 `hash-identifier`。将哈希值复制并粘贴到\
    \ `HASH` 命令行中。程序将告诉您可能的哈希类型。\n\n6. 使用许多许多哈希密码破解工具之一，例如 `hashcat`、`cudahashcat`或其他软件。这将向您展示真实的明文密码。\n\
    \n## 针对网站破解的防御措施\n\n维护网站或 Web 应用程序的安全需要时刻警惕。网站管理员和开发人员必须跟上黑客世界的动态、正在开发的工具以及恶意黑客正在采用的技术。以下措施可以帮助保持网站安全：\n\
    \n- 事实并非每个网站都能负担得起为密码安全实施 `SSL` 加密。然而，公共网站的管理员必须确保密码至少经过哈希处理，以提供针对恶意黑客的额外安全层。没有必要为可能只是在碰运气破解您网站的黑客提供便利。\n\
    - 每个服务器应运行在不同的机器上，以便为数据库和 Web 应用程序提供更好的保护。每台机器都应经过彻底测试，以确保其操作系统安全。\n- 利用 Web 服务器内置的安全功能来控制访问并隔离不同的应用程序。如果某个应用程序被破解，其他应用程序将不会受到威胁。\n\
    \ 使用 使用 `Port 80 Software ServerMask` 等匿名工具隐藏服务器的身份。\n- 设置网络防火墙以检测并防止黑客访问您的网络。\n\
    - 使用 `ServerDefender` 和 `SecureIIS` 等程序检测攻击并在造成损害之前阻止它们。\n\n维护网站或 Web 应用程序的安全需要每个\
    \ Web 开发者意识到他们是第一道防线。这会对信息的整体安全产生巨大影响。\n\n# 第 11 章：破解无线网络\n\n使用无线网络有很多优点。然而，这种技术也伴随着黑客可以利用的威胁和漏洞。由于信息是通过无线频率空中传输的，与有线连接相比，黑客更容易截获它。\n\
    \n无线网络由 4 个基本元素组成：\n\n- 连接到无线接入点\n- 通过无线频率传输的数据\n- 使用的客户端设备，如笔记本电脑、平板电脑等\n- 用户\n\
    \n## 无线网络攻击\n\n### 意外关联\n\n无线网络可能会意外破解。在某些情况下，一个无线网络与另一个网络重叠，导致任何用户都会意外进入另一个非目标的网络。这看起来可能无害，但恶意黑客可以利用这一点获取本不应以这种方式暴露的信息。如果重叠的网络属于机构，那么该链接可以被用于窃取专有数据。\n"
