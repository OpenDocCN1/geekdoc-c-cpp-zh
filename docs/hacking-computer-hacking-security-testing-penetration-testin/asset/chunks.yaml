- fmt: '

    Learning how to hack other’s passwords is great, but it is even better to also
    know how to stop other hackers from cracking your passwords. There are quite a
    number of general countermeasures that you can take to avoid your passwords from
    being cracked. The most basic one is to make sure that every system, account,
    or website has its own unique password. Avoid the temptation to create one password
    for all your user accounts.


    Of course, this means that you will either have to memorize them all or write
    them down. These options are cumbersome and downright risky respectively.


    ## Password Policies


    Ethical hackers who are hired to strengthen an organization’s information security
    must emphasize the importance of establishing stringent password policies. This
    can be achieved by showing users methods of generating secure passwords. People
    tend to make passwords using single words, for example, monkey. However, a more
    secure strategy would be to use phrases, for example, `bigredmonkey`.


    Another way is to show users the effects of sharing passwords with others or creating
    weak passwords. If people can literally see and understand what can happen after
    a hacker cracks their password, they will take the issue of password security
    more seriously. Finally, users must be made aware of social engineering attacks
    and how they take place.


    These three tips can be enlarged to create an organizational password policy that
    will provide adequate information security. During this process, there are certain
    criteria that must be enforced:


    - Use a combination of lower- and uppercase letters, numbers, symbols, and other
    special characters. It is never a wise decision to use only letters or numbers
    alone. This makes it very easy for a malicious hacker.

    - Use misspelled words or acronyms.

    - Use punctuation marks to split words.

    - Keep changing passwords every six to 12 months. In case of a security breach,
    all passwords must be changed immediately.

    - Make sure that every account you have has its own unique password, especially
    for servers, routers, and firewalls. Using similar passwords isn’t wrong. What
    you have to do is slightly tweak one password for the different systems that you
    use. For example, use `WindinTheWillows-76` for one account or system, and `Yahoo89+WindInTheWillows`.

    - Vary your password lengths. Using passwords of variable length will make life
    difficult for hackers because they will be forced to attempt all password length
    combinations.

    - Avoid the use of colloquial or slang, as well as any dictionary words.

    - When you change your passwords, do not reuse the same old passwords you used
    in any of the previous five changes.

    - Avoid sharing passwords with other people. Most people tend to give out passwords
    to colleagues or friends who ask to use their computer. Do not reveal the password
    at any cost.

    - Apply a password to screensavers. An encrypted hard drive with an unlocked screen
    is a vulnerability that hackers can take advantage of.

    - Do not store passwords in an MS Office file that is unprotected. Always use
    a password manager program.


    There are also some more advanced ways to prevent passwords from being cracked:


    - Set up security auditing for monitoring password attacks.

    - Use advanced software like `WinHex` to check whether your system is saving passwords
    permanently in its memory.

    - Ensure that the systems being used are patched.

    - As an administrator, you should enable the account lockout feature that locks
    users out of the system if a password is entered incorrectly for a specific number
    of tries. If it is a genuine user who forgot their password, then they will have
    to inform the security administrator.

    - Establish stronger authentication measures like biometric, smart cards, or digital
    certificates.

    - Use a password to lock the system BIOS.


    # Chapter 10: Hacking Websites and Web Applications


    The following are some of the main vulnerabilities that websites and web applications
    have:


    ## Directory Traversal Attack


    A directory can be described as a folder that a web designer uses to store the
    website’s files. A directory traversal attack is where a hacker is able to gain
    access to and navigate between web directories and the files that have been stored
    in the directories. These are some of the most sensitive files for a website,
    for example, `root`, `htaccess`, and `confi` files.


    Another name for a directory traversal attack is the `../` (dot dot slash) attack.
    It is important to first understand what this means. Whenever a `..` is typed
    as a command, an instruction is issued to the system to move one folder up. Let’s
    assume that you are currently at the location `C: Users/John/Downloads/Education`.
    If you type `..`, you would move one folder up to `C: Users/John/Downloads`. If
    the command is entered again, you would end up in `C: Users/John`.


    Now, if you want to gain access to a text file called `abcdefg.txt` that is located
    in the folder “John,” you would have to type the command `....abcdefg` to move
    to where the text file is stored. Notice that there are four dots that have been
    typed in order to move two folders up.


    A directory traversal attack is an HTTP exploit aimed at accessing restricted
    files or viewing random files on a web server, for example, password files and
    SSL private keys. Most hackers are usually keen on getting into the `root` directory
    of a server, and this is possible using the dot dot slash technique described
    above. Exploiting this vulnerability can provide you access to files containing
    passwords or confidential information.


    A hacker can also perform searches to determine the types of files in a website
    directory that are publicly accessible. You can use a spider program like `HTTrack`
    website `Copier` to find every file that is accessible publicly. This free tool
    is easy to use. Just load it, name the project, and instruct the software which
    websites it should mirror. In a few minutes or maybe hours, `HTTrack` will show
    you all the files and records that the website contains and store them in your
    drive `C: My Websites`.


    Most sites often contain sensitive information that should not be viewed publicly,
    for example, source codes and application scripts. Watch out for any `.zip` or
    `.rar` files in the website’s server. Even `.html` or `PDf` files may contain
    valuable information.


    Another way to search for public files is through Google. You can use Google’s
    advanced queries to expose sensitive information, credit card numbers, critical
    website directories, and webcams. When Google searches a website, it usually stores
    all its available records or files in its cache. This makes it even easier to
    access information because you won’t have to mirror the website and search through
    all those files manually. Here are some advanced Google queries that any hacker
    can use. All you have to do is type into the Google search box:


    `site:hostname keywords` - When you use this type of query, Google searches for
    the keyword that you have indicated. A practical example would be:


    `site:www.madhatter.com confidential`


    or


    `site:www.bigmoneyspeaker.com credit card`


    `filetype: file-extension site:hostname` - When you use this type of query, Google
    searches for a specific file type on the website you are targeting. These could
    be `doc`. `Zip`, `pdf`, `rar`, `db`, and so on. Some of these file types may contain
    regular web information, but you never know what valuable information you might
    find, so check them anyway. A practical example would be:


    `filetype: pdf site:www.madhatter.com`


    There are other types of advanced Google operators that you can use, such as:


    - `inurl` - This operator looks for the keywords you want within a web page’s
    URL.

    - `allintitle` - This operator looks for keywords within the title of all web
    pages.

    - `link` - This operator reveals all other websites that are linked to a specific
    web page.

    - `related` - This operator looks for web pages that are similar to the one you
    have.


    ## Directory traversal countermeasures

