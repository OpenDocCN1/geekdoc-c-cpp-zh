    黑客可以针对组织中的个人、特定部门或整个公司。一旦你确定了特定目标，就可以使用任何可用的搜索引擎来浏览有关该目标的信息。其目的是是尽可能地了解他们。


    你可以使用许多技术，可以用来收集信息：


    ### 网络搜索


    你可以访问目标自己的网站并进行浏览，尝试收集尽可能多的有用信息。使用 `Google` 查找诸此类信息：


    - 员工姓名及其联系方式。你可以在 `Facebook` 或 `LinkedIn` 上继续寻找这些人。

    - 与公司相关的日期和技术性职位空缺。大多数组织通常会指定潜在招聘者需要熟悉的技术。这能让你对公司使用的软件和硬件心中有所数。

    - 如果是上市实体，可以查看 `SEC` 备案。

    - 如果是私有实体，可以查看注册文件。

    - 专利和商标。

    - 讨论新产品或组织变更的新闻稿。

    - 网络研讨会、文章或演示。

    - 合并与收购。


    如果你使用 `Google`，可以使用关键词来获取最相关的信息。如果你知道使用正确的关键词，在 `Google` 上能找到的详细信息（电话号码、地址等）简直令人难以置信。


    你还可以使用 `Google` 的高级搜索功能执行高级网络搜索。这将揭示包含指向目标网站反链的网站。你可能会发现与你的目标相关的供应商、供应商和客户。


    你还可以使用切换符（switches）深入挖掘，并访问与公司链接的文件。例如，如果你想发现公司 `XYZ` 网站上的特定文件或单词，请在 `Google`
    中输入以下行：


    ```

    site: www.xyz.com keyword

    site:www.xyz.com filename

    ```


    可以下载 Flash `.swf` 文件，这些文件可以被反编译以发现属于公司 `XYZ` 的机密。你还可以获取敏感数据的 `PDF` 文件。只需在 `Google`
    中输入以下行：


    ```

    Filetype: swf XYZ

    Filetype:pdf XYZ confidential

    ```


    ### 网络爬虫


    某些网络爬虫工具能够镜像网站并下载目标网站上所有公开访问的文件。这使你能够对副本进行离线扫描。你可能会发现有关网站配置和布局、文件和目录的信息、网页的源代码、IT
    员工的姓名和电子邮件地址，以及关于代码运行机制的注释。


    ### 网站


    某些网站包含有关不同组织及其员工的信息。只要知道要使用哪些网站，你甚至可以进行人员搜索。例如：


    - `www.finance.yahoo.com`

    - `www.sec.gov/edgar.shtml`

    - `www.uspto.gov`

    - `www.zabasearch.com`

    - `www.choicepoint.com`


    此时的目标不是渗透目标系统，而是本质上要清楚你正在处理的是什么以及对方是谁。


    ### 网络映射


    这是一个搜索公共数据库以发现有关特定网络可用信息的过程。最好的起点是使用在线任何可用的 `Whois` 工具。作为一名伦理黑客，`Whois` 能够让你获得有助于你扫描网络或准备社会工程攻击的信息。你将能够获取与特定互联网域名注册关联的名称、电话号码和地址。`Whois`
    还提供目标域的 `DNS` 服务器。


    你会发现 `Google Groups` 上公开的私有信息类型之多而感到惊讶。你可以找到域名、用户名和 `IP` 地址。人们倾向于在 `Google Groups`
    上分享大量信息，其中一些与系统安全有关。你可以通过访问他们的支持页面请求 `Google` 移除在该网站上发布的此类敏感材料。


    ### 系统扫描


    一旦你开始主动收集有关测试网络的信息，你将开始从恶意黑客的视角来看待系统。从外部来源收集的信息将为你提供整个网络的地图，揭示系统是如何相互连接的。你应该能够看到主机名、`IP`
    地址、开放端口、运行的协议和应用程序。


    在某些情况下，内部主机也包含在测试范围内。内部主机通常对外部人员隐藏，但测试它们是非常重要的，以防心不满的员工决定通过尝试访问机密信息来对公司报复。记住，如果你决定测试自己的内部主机系统，请先在如
    `VirtualBox` 或 `VMware Workstation` 等虚拟环境中进行。


    ### 主机


    扫描并记录那些可以通过互联网从外部访问以及通过内部人员人员访问的主机。从 ping `IP` 地址或主机名开始。你可以使用 `OS` 附带的标准 `ping`
    工具，也可以使用可以一次性 ping 多个 `IP` 地址的第三方工具，例如 `NetScan Tools Pro`、`SuperScan` 或 `fping`。


    ### 开放端口


    有很多网络工具可以用于扫描开放端口。这些包括 `OmniPeek`、`Wireshark`、`SuperScan` 等。


    在内部进行扫描比在外部更容易。要进行内部扫描，将你的计算机连接到本地网络，运行软件即可开始。要进行外部扫描，只需为你正在使用的计算机分配一个公共 `IP`
    地址并将其连接到不在防火墙内的集线器上。


    ## 评估系统漏洞


    一旦你发现了安全方面的潜在漏洞，就是开始测试的时候。然而，在此之前，建议你确认这些差距是否是真实的漏洞。有几个网站和黑客论坛你可以手动搜索，以确定你发现的内容是否存在列表中。sans.org/top20`、`nvd.nist.gov`
    和 `cve.mitre.org` 等网站记录了常见的漏洞。


    如果你不想花时间手动研究潜在漏洞，可以开始测试。你可以进行手动评估或自动评估。在手动评估中，通过关联恶意黑客可以利用的端口对潜在漏洞进行评估。


    自动评估涉及使用测试平台或网络弱点的工具。虽然这些工具让工作变得更容易、更快，但它们大多数只有测试特定系统漏洞的能力。坦地说，漏洞管理系统的进步正在产生能够跨整个网络关联漏洞的工具。


    一个非常棒的工具是 `QualysGuard`。它是一个基于云的工具，具有端口扫描和漏洞评估功能。它不是免费的，但如果你想建立业务信誉，它是值得的。如果你正在寻找免费的漏洞扫描器，可以使用
    `Rapid7 的 Nexpose`。它可以最多扫描 32 个主机。


    ## 渗透测试


    一旦你发现了主要的安全漏洞，下一步就是渗透系统。你应该能够使用可用的在线工具来利用系统，例如 `Metasploit` (`www.metasploit.com/framework`)。更好，你应该考虑开发你自己的工具。当然，这需要创造力和极度的奉献。


    渗透系统后，你能够执行的操作包括：


    - 从主机系统获取更多信息。

    - 访问网络中相互连接的其他系统。

    - 启动和停止特定的服务。

    - 获取远程命令行提示符。

    - 发起拒绝服务攻击。


