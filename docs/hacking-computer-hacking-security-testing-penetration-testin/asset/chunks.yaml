- fmt: '

    Phishing is a technique that takes advantage of people’s inattentiveness when
    opening emails. A hacker sends an email that looks like it’s from a legitimate
    source (bank or charity organization), asking the user to click on a link that
    will supposedly send them to an authentic website. The link may have the same
    name as a website that the user frequently visits, but in reality, it leads to
    another website that will install a `Trojan` into the user’s system. In some instances,
    a hacker may send an email claiming to be from a financial institution, asking
    the user to provide confidential information such as bank account numbers and
    passwords; otherwise, their account will be revoked.


    ## Waterhole Attacks


    This is a technique where a hacker targets someone at the place where they are
    most accessible. For example, you may tend to frequent a specific coffee shop
    on specific dates or times and normally use the available `Wi-Fi` access point.
    A hacker may monitor your schedule, create a fake `Wi-Fi` access point in the
    coffee shop, and modify your favorite websites in order to obtain your personal
    information. When you connect to the fake access point, the hacker will be able
    to grab all your data.


    ## Eavesdropping and Impersonation


    This is a passive form of attacking where a hacker monitors a system in order
    to obtain information such as passwords and user accounts. The hacker then steals
    the user’s identity and sends messages to people on the victim’s email contact
    list. The victim’s contacts are unaware that the person they are sharing confidential
    information with is not the actual user. The hacker can even send them a `Trojan`
    program and request that they execute it on their computer, thus giving the hacker
    further access to more passwords and usernames.


    ## Pharming


    This is a form of phishing attack where a hacker redirects traffic intended for
    a particular genuine website to another, fake website. Pharming (pronounced as
    “farming”), can be done in two ways: altering the file of the host site on a user’s
    computer, or exploiting a vulnerability in the software of the site’s `DNS` server.
    `DNS` servers are supposed to act as the guideposts that direct online users to
    the right website. If a `DNS` server is compromised, users will simply be lead
    wherever a hacker wants. This form of hacking is usually targeted at online banking
    and e-commerce sites.


    ## Clickjacking


    This technique is also known as user-interface redressing. A hacker hides a piece
    of malicious coding underneath an apparently genuine button or link on a website.
    When an unsuspecting user clicks on the button or link, the code is activated.
    In other words, you click on something that you physically see, but there is a
    virtual and unintended result that occurs.


    For example, a user can go to a website and once they are done, decide to click
    the “X” button on the top right corner to close the window. However, what they
    don’t know is that a hacker has invisibly placed a button underneath that will
    trigger the download of a `Trojan` horse, turn on the computer’s webcam, or delete
    the firewall rules. The website itself may be legitimate but it has been hacked
    and manipulated. Alternatively, a hacker may replicate a well known website and
    post links online or send people emails with the links.


    ## Cookie Theft


    Cookie theft occurs when a hacker steals a cookie that a user has been given by
    a website. The hacker then uses the same cookie to impersonate the user for that
    particular session that they are logged on. That is why cookie theft is considered
    a form of session hijacking. For example, every time a user logs into `Facebook`,
    the website issues them a cookie that proves their identity during that session.
    If the user is browsing the Internet in a public place with free, unencrypted
    `Wi-Fi`, a hacker can use software to read, copy, and use the cookie. The hacker
    will be able to post messages, change the user’s profile, and so on.


    Other types of session hijacking include sniffing and `Evil Twin` attacks. Sniffing
    is where a malicious hacker uses some kind of software to intercept information
    that is being sent or received by a particular device. An `Evil Twin` attack involves
    creating a `Wi-Fi` network that seems real but is not. Users unwittingly join
    the network, thus allowing the hacker to launch a man-in-the-middle attack.


    ## Man-in-the-middle Attack


    This is also abbreviated as `MiM` or `MitM` attack. It is an attack that involves
    a malicious hacker intercepting messages between two parties, impersonating both
    of them, and thus collecting the information that was being sent. The two parties
    will not be aware that the person who is communicating with them is an outside
    party. It is a form of real-time eavesdropping that allows an intruder to manipulate
    others by injecting false information into an online conversation. The hacker
    will be able to request the parties to submit confidential information, such as
    bank account numbers and passwords. The conversation may be between two people
    or a client and a server. Financial websites are the most common targets of `MitM`
    attacks.


    ## Spyware


    This is a computer software that a hacker installs on a victim’s computer in order
    to collect sensitive information without their knowledge. The software can be
    installed remotely without the hacker gaining physical contact to the victim’s
    computer. Unlike worms and viruses, spyware is not meant to transmit itself to
    other devices.


    Hackers know that a user will never download spyware willingly, so they usually
    piggyback it onto legitimate software such as popular web utility tools or even
    anti-spyware programs. A user will simply download and run software from the Internet
    unaware that they are being spied on. Some spyware is even bundled with music
    CDs or shareware. A user can also be tricked into clicking a button or link that,
    on the surface, appears to protect them from unwanted downloads. For example,
    a dialog box may pop up with an ad about free optimization of a computer system.
    The user is requested to click on the `Yes` or `No` button, but regardless of
    the button clicked, spyware is still downloaded.


    # Chapter 3: The Ethical Hacking Plan


    There’s no way that you can start an ethical hacking process without first planning
    your security testing. There needs to be a clear agreement on the tactical and
    strategic issues involved in the hacking process. In order to ensure that your
    efforts are successful, take the necessary time to plan for your test, whether
    it is a simple operating system password-cracking test or an extensive evaluation
    of the vulnerability of a web environment.


    ## Finding your target


    Believe it or not, but there is a lot of research that goes into finding the perfect
    hacking victim. Hackers don’t just jump on the first target they come across.
    There must be some strategic research of the potential target, analysis of their
    habits, and finally choosing the best techniques for the attack.


    A hacker can choose to go after one person or even a number of targets at the
    same time. However, the best way to pick a target is to focus on a specific niche.
    There are hackers who tend to primarily target financial institutions in order
    to gain access to deposits, while others usually go after personal information
    stored on servers.


    There are also hackers who are intent on causing damage to websites by defacing
    landing pages or showing off their ability to beat a site’s security. A hacker
    may decide to hack an account so that they can gain free access to a service that
    other members are paying money to use.

