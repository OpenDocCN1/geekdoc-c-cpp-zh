- fmt: '

    Hackers are able to target individuals in an organization, specific departments,
    or the entire company. Once you have settled on a specific target, you can browse
    for information about your target by using any search engine available. The aim
    is to learn as much as possible about them.


    There are a number of techniques that you can use to gather information:


    ### Web searches


    You can go to the target’ own website and browse around as you try to collect
    as much useful information as possible. Use `Google` to look for information such
    as:


    - Names of employees and their contact information. You can proceed to find these
    people on `Facebook` or `LinkedIn`.

    - Relevant company dates and technical job openings. Most organizations usually
    specify the technology that potential recruits need to be familiar with. This
    will give you a heads up of the software and hardware the company is using.

    - `SEC` filings in case it is a public entity.

    - Incorporation filings in case it is a private entity.

    - Patents and trademarks.

    - Press releases discussing new products or changes in the organization.

    - Webinars, articles, or presentations.

    - Mergers and acquisitions.


    If you are using `Google`, you can use keywords to get the most relevant information.
    It is unbelievable the kind of detailed information (phone numbers, addresses,
    etc.) that you can find on `Google` if you just know the right keywords to use.


    You can also perform an advanced web search using `Google`’s advanced search feature.
    This will reveal websites that contain back-links into your target’s website.
    You are likely to find vendors, suppliers, and clients that are affiliated with
    your target.


    You can also use switches to dive deeper and gain access to the files linked to
    a company. For example, if you want to discover a specific file or word on the
    website of company `XYZ`, type the lines below into `Google`:


    ```

    site: www.xyz.com keyword

    site:www.xyz.com filename

    ```


    It is possible to download Flash `.swf` files that can be decompiled to uncover
    confidential data belonging to company `XYZ`. You can also obtain `PDF` files
    with sensitive data. Simply type the lines below into `Google`:


    ```

    Filetype: swf XYZ

    Filetype:pdf XYZ confidential

    ```


    ### Web crawling


    There are certain web crawling tools that are able to mirror a website and download
    all the publicly accessible files from the target website. This then allows you
    to scan the copy offline. You are likely to unearth information regarding the
    configuration and layout of the website, files, and directories, the source code
    for the web pages, names and email addresses of the IT employees, and comments
    about the workings of the code.


    ### Websites


    There are certain websites that contain information about different organizations
    and their employees. You can even do a people search if you just know which websites
    to use. For example:


    - `www.finance.yahoo.com`

    - `www.sec.gov/edgar.shtml`

    - `www.uspto.gov`

    - `www.zabasearch.com`

    - `www.choicepoint.com`


    The objective at this point isn’t to penetrate into the target’s system, but essentially
    to know what and who you are dealing with.


    ### Network mapping


    This is the process of searching public databases to discover the information
    available about a particular network. The best place to start is to use any `Whois`
    tool available online. As an ethical hacker, `Whois` enables you to obtain information
    that will help you scan a network or prepare a social engineering attack. You
    will be able to get the names, phone numbers, and addresses linked to a specific
    Internet domain registration. `Whois` also provides the `DNS` servers of the target
    domain.


    You would be surprised to discover the type of private information that is publicly
    available on `Google Groups`. You can find domain names, usernames and `IP` addresses.
    People tend to share a lot of information on `Google Groups`, some of it related
    to the system security. It is possible to request `Google` to remove such sensitive
    material posted on the site by going to their support page.


    ### System scanning


    Once you have begun actively collecting information about the network being tested,
    you will start to see the system through the eyes of a malicious hacker. The information
    gathered from external sources will be able to provide you with a map of the entire
    network, revealing how the systems are interconnected. You should be able to see
    the hostnames, `IP` addresses, open ports, running protocols and applications.


    In some cases, the internal hosts are also included in the scope of your testing.
    Internal hosts are typically hidden from outsiders, but it is important to test
    them just in case a disgruntled employee decides to revenge against the company
    by trying to access confidential information. Remember, if you decide to test
    your own internal host system, first do so in a virtual environment such as `VirtualBox`
    or `VMware Workstation`.


    ### Hosts


    Scan and record those hosts that can be accessed externally via the Internet and
    internally by an insider. Begin by pinging the `IP` addresses or the hostnames.
    You can use either the standard `ping` tool that comes with your `OS`, or you
    can use a 3rd party tool that is able to ping several `IP` addresses at once,
    for example, `NetScan Tools Pro`, `SuperScan`, or `fping`.


    ### Open ports


    There are a number of networking tools that can be used to scan for open ports.
    These include `OmniPeek`, `Wireshark`, `SuperScan`, among others.


    It is easier to perform a scan internally than externally. To scan internally,
    connect your computer to the local network, run the software, and off you go.
    To scan externally, just assign the computer you are using a public `IP` address
    and connect it to a hub that is not within the firewall.


    ## Evaluating System Vulnerabilities


    Once you have discovered potential gaps in security, it is time to start testing.
    However, before doing so, it is recommended that you confirm if these gaps are
    actual vulnerabilities in the system. There are several websites and hacker message
    boards that you can manually search to determine whether what you have discovered
    is on the list of classified vulnerabilities. Websites like `sans.org/top20`,
    `nvd.nist.gov`, and `cve.mitre.org` document commonly exploited vulnerabilities.


    In case you do not want to spend time manually researching potential vulnerabilities,
    you can start testing away. You can either perform a manual evaluation or an automated
    one. In a manual evaluation, the potential vulnerabilities are assessed by linking
    to the ports that can be exploited by malicious hackers, and then poking around
    them.


    Automated evaluations involve the use of tools that test for weaknesses on a platform
    or network. Though these tools make work easier and much faster, most of them
    only have the capability to test for specific and individual system vulnerabilities.
    Frankly, new advances in vulnerability management systems are birthing tools that
    can correlate vulnerabilities across a whole network.


    One really great tool is `QualysGuard`. It is a cloud-based tool that has port
    scanning and vulnerability assessment capabilities. It is not free, but it is
    worth the money if you want to build credibility for your business. If you are
    looking for a free vulnerability scanner, go for `Rapid7’s Nexpose`. It is capable
    of scanning a maximum of 32 hosts.


    ## Penetration Testing


    Once you have discovered the major security vulnerabilities, the next step is
    to penetrate the system. You should be able to use the available online tools
    to exploit the system, for example, `Metasploit` (`www.metasploit.com/framework`).
    Better yet, you should consider developing your very own tool. Of course, this
    will require creativity and utmost dedication.


    Some of the things you will be able to do after penetrating the system include:


    - Gathering more information from the host system.

    - Accessing other interconnected systems in the network.

    - Starting and stopping specific services.

    - Getting a remote command prompt.

    - Launching a denial of service attack.

