    Different hackers have different motives for doing what they do, but the common
    thread is that a hacker will only attack if they know that the system is vulnerable
    and there is something to be gained from the action. This is why it is very important
    to avoid sharing personal sensitive information publicly online. If you have to
    do so, always make sure that you are dealing with a legitimate user who is going
    to protect their data and yours.


    ## Formulating a hacking plan


    It is important to first get the required approval for security testing. Ensure
    that the people responsible for giving authorization know what you are doing and
    keep them in the loop. Once your project has obtained sponsorship, you will have
    to sit down and define your testing objectives. Sponsorship simply refers to finding
    someone to back you up and sign off on the plan, for example, a client or maybe
    even yourself in case you are testing your own system.


    This step is important because there have been cases where a hacker is given the
    task of testing a system only for it to be canceled unexpectedly. Even a third
    party, such as a cloud or web hosting service, can claim it never gave authorization
    for such testing to take place. The end result could be the loss of a job or filing
    of criminal charges. Written authorization can include an internal memo from your
    boss if you are performing the tests on your company. If it’s for a client, get
    a contract signed by the client.


    It is possible that the system could crash during testing, so a detailed plan
    is necessary. It doesn’t have to be very complicated, but it must have a scope
    that is clearly defined. The following information should be part of your plan:


    - Determine the most critical and vulnerable systems that will need to be tested
    first. These can include server passwords or email phishing. Once the core areas
    have been tested, you can then cascade down to all the other systems.

    - Assess the risks involved. It is important to always have a contingency plan
    in case the hacking process goes wrong. Determine how people and systems will
    be affected beforehand.

    - Determine your testing schedule. It could be during normal business hours, early
    mornings, or maybe late at night. The key thing is to make sure the people affected
    are on board. One factor you will also have to consider is the fact that black
    hat hackers don’t restrict themselves to specific times of attack. This means
    that the best way to test the system would be to launch any type of test at any
    time of day. The only exceptions would normally be full DoS attacks, physical
    security, and social engineering tests.

    - Have a basic understanding of the system being tested. If you are hacking your
    own system, then this will be straightforward. However, you may need to get more
    details in case you are testing a client’s systems.

    - Define the actions to be taken in case major vulnerabilities are found. There’s
    always a weakness somewhere, so the excuse that you can’t find any simply won’t
    cut it. If you discover a couple of security weaknesses, let the key players know
    about is ASAP so that they can be plugged immediately. Keep testing the system
    until you find it impenetrable.

    - Determine what the deliverables are. These include detailed scanning reports
    containing information about vulnerabilities and recommendations on how to fix
    them.

    - Determine the specific set of tools that you will need for your task. Always
    ensure that you are using the appropriate tool for the right task. If you don’t
    have much experience with some tools, don’t be afraid to ask colleagues for advice.


    ## Establishing your objectives


    Now that you have created a testing plan, you need to establish some solid goals.
    Ethical hacking is meant to discover all vulnerabilities in a system in order
    to prevent criminal hackers from penetrating it. This means that you will have
    to adopt the mindset of a black hat hacker.


    So what are the objectives that you will need for your hacking plan?


    - **Define and align your goals** - Set specific goals that are aligned with those
    of your client. Ensure that you have in mind the exact results that you and the
    client want to achieve. Make sure that you also establish the performance criteria
    that will b used to judge the testing.

    - **Set a definite test schedule** - Your overall hacking plan must include the
    dates and times of launching your tests.


    There are also specific questions that can help you come up with goals for your
    hacking plan:


    - Will your tests align with the mission of your client’s business?

    - What are the business goals that ethical hacking will meet? For example, attaining
    international security standards, meeting federal regulations, or boosting the
    company’s image.

    - In what ways will these tests enhance IT and security?

    - What kind of data is being protected? For example, intellectual property, personal
    employee information, or personal client data.

    - How much money, energy, and time are you and the client ready to spend on assessing
    the system’s security?

    - What are the deliverables of the testing? These could be test results, technical
    reports, or even the passwords that you uncovered.

    - What outcomes are required? The client may want to justify an increase in the
    security budget or outsourcing the security personnel.


    Once the goals of the hacking plan have been defined, it is important to note
    down the steps that you will take to achieve them. Establishing the objectives
    of your hacking plan may seem cumbersome and time-consuming, but it is definitely
    worth it. These goals are supposed to guide your every move during the process,
    so keep going back to them to ensure that you are on track.


    ## The 10 Commandments of Ethical Hacking


    There are certain commandments that an ethical hacker lives by. Here are 10 of
    the main ones:


    ### 1. You must set goals


    If you have planned to evaluate the security of an online system or network, you
    must first try to answer three questions:


    - What information does a criminal hacker see when they look at the target network?

    - Can the criminal hacker misuse that information?

    - Is the target aware of any attempts to penetrate their system?


    Part of the planning process of a hack involves goal setting. The goal does not
    have to be overly complicated. It could be as simple as getting information from
    a system, or maybe searching a wireless network for unauthorized access.


    ### 2. You must plan ahead - always


    Every hacker is bound by certain constraints. These could be time, money, or manpower.
    For this reason, you must learn how to plan your work in order to avoid veering
    off course. Your hacking plan should include:


    - Identifying the networks that you will test.

    - Determining the intervals of your tests.

    - Clearly defining the testing procedure.

    - Creating a plan that you can share with stakeholders.

    - Getting the plan approved.


    ### 3. You must get authorization


    As an ethical hacker, you must obtain the necessary authorization before you attempt
    to hack an organization’s system. If you do not, be prepared to do some serious
    prison time! Make sure that the person whose system you are hacking gives you
    written permission. The document should show that you have been given the approval
    to test the system according to a pre-approved plan and that the organization
    will support you in case of any legal charges.


    ### 4. You must be ethical

