    请注意，本文档包含的信息仅供教育和娱乐之用。我们已尽力提供准确、最新、可靠且完整的信息。不提供任何形式的明示或暗示保证。读者承认，作者并未提供法律、财务、医疗或专业建议。本书的内容源自多种渠道。在尝试书中概述的任何技术之前，请咨询获得许可的专业人士。


    通过阅读本文档，读者同意：在任何情况下，作者对因使用本文档包含的信息而导致的任何直接或间接损失不负责，包括但不限于——错误、遗漏或不准确。


    # 引言


    大多数人并不真正理解什么是黑客行为，更不用说如何操作了。这只是我们在电影中看到或在新闻中听到的东西。这本书*黑客、计算机破解、安全测试、渗透测试与基础安全*旨在帮助你从更广泛、更深入的角度理解黑客技术。


    黑客行为通常被视为一种旨在窃取数据或钱的非法活动。虽然确实有一些黑客利用技能进行犯罪活动，但这并不是黑客行为的本质。黑客简单地发现产品或环境中被忽视或无意的用途，并提出解决问题的新方法。


    在书中，你将学习如何保护自己免受目前最常见的黑客攻击。如何做？通过学习如何黑客！没错。在不先了解黑客实际运作方式的情况下，指望保护自己和财产免受黑客侵害是不可想象的。


    如果你想领先于黑客并进行自己的反击，那么你走运了。你选对了书。在这里，你将学习伦理黑客和犯罪黑客所使用的现代工具和高级技术。你不仅将学习如何寻找系统的漏洞，还将了解如何识别正受到攻击的系统。


    书中概述了一些策略，将帮助你测试任何系统的漏洞，并防止你掉入黑帽的陷阱。本书旨在帮助你提高个人及专业领域的信息安全。因此，了解电子设备如何在你毫无察觉的情况下被攻破是非常重要的。


    本书使用了初学者也能理解的简单语言。需要深入学习黑客某些方面的资深黑客也可以使用此书。本书对于如何成为一个需要修复其系统任何漏洞的组织的伦理黑客提供了极佳的建议。


    全书分为三个部分，每部分讨论一个不同的主题。第一部分带我们进入黑客世界、其历史以及现状。第二部分讨论了破解各种系统、网络和应用程序的功能性艺术。最后，第三部分涉及关于伦理黑客应该做什么和不该做什么，以及黑客行为的未来趋势。你可以从感兴趣的任何部分开始，并根据自己的需要进行调整。


    我们希望，当你读完这本书时，你已经学习了足够的知识来更好地保护自己，并能够进行自己的伦理黑客操作。


    # 第一部分：进入黑客世界


    ## 第一章：什么是黑客？


    当提到“黑客”这个词时，脑海中会浮什么样的画面？你会想到试图窃取数据或监视他人的罪犯破坏分子吗？你会想到某人坐在电脑前，向他人发送加密程序，以便远程访问他们的计算机吗？


    事实是，大多数人将黑客行为视为一种非法活动。虽然犯罪黑客确实存在，但他们实际上只是少数。黑客简单地寻找计算机硬件或软件的替代或无意用途，以增强其应用并解决问题。


    这是黑客行为的技术定义。黑客是以新颖和反直觉的方式利用可用技术来解决传统技术无法解决的问题。只有在当今数字时代，黑客行为才成为绕过安全、非法访问他人计算机和制造混乱的同义词。


    ### 黑客的历史


    19 世纪 70 年末，贝尔电话公司雇用了几名青少年担任交换机操作员。这些男孩决定进行一些技术上的恶作剧，例如故意误导和切断电话、、听对话以及其他各种恶作剧。虽然在当时这被称为“黑客”，但它是最早被认可的误用技术的事件。甚至有人认为，这是公司决定只雇佣女性作为操作员的原因之一。


    快进到大约 100 年后的 20 世纪 50 年代。`hack` 一词被用来绕过系统原始运行的捷径或技术。该术语由麻理工学院（MIT）的模型火车爱好者创造，他们收到了一批旧电话设备捐，然后利用这些设备创建了一个控制模型火车的复杂系统。他们设计出一种方法，通过拨打电话让多个操作员操纵轨道。这些人被认为是原始的黑客，因为他们能够利用现有的设备并发现新的发明用途。


    许多这些模型火车黑客随后对校园内引入的新计算机系统产生了好奇。他们是一群编程极客，想要更改现有的计算机程序使其变得更好、针对特殊应用进行定制，而且主要是为了好玩。最终结果是，他们制作了原始程序的修改版和更优雅的版本。他们不仅满足于编写解决问题的程序；他们希望程序能以最好的方式解决问题。


    20 世纪 70 年代，出现了一种不同的黑客类型，其重点是利用电话系统。这些人被称为“电话摇者”（phreakers），他们的目标是弄电子交换系统是如何工作的，以便拨打免费的长途电话。这是早期反建制运动之一的例子，这种运动后来催生了个人计算机黑客。


    '
- fmt: '

    As personal computers became more common in the 1980’s, hackers were able to acquire
    their own devices and use the new technology to expand their reach. They quickly
    learned how to use modems to dial into and gain access to other people’s personal
    computers. It was at this time that Stephen Levy published *Hackers: Heroes of
    the Computer Revolution*, where he stated that there should be unlimited and total
    access to computers in order to understand how the world works. The desire to
    dissect, understand, and better appreciate computer programming in order to gain
    more knowledge would later be regarded as the Hacker Ethic.


    In the late 1980’s, there emerged a group of hackers who felt that exploring systems
    for benign reasons such as learning wasn’t enough anymore. This younger generation
    decided to start hacking for personal profit by engaging in criminal activities.
    This included selling pirated video games, software, and even distributing worms
    and viruses to take down entire systems. They formed cyber-gangs that went after
    sensitive data in large institutions and governments. Law enforcement stepped
    in and anti-hacking legislation was soon passed. Many of these cyber-gang members
    were arrested and prosecuted.


    The latest frontier in hacking is known as “whacking.” This involves finding unsecured
    Wireless Access Points (WAPs) and connecting to them. This has become more prevalent
    due to increased use of Wi-Fi.


    ## Types of Hackers


    How is it possible to differentiate between good hackers who want to share the
    benefits of technological advances and those who want to steal from people? Initially,
    the term `cracker` was used to describe hackers who tampered with a system and
    broke the law for profit. Those who followed the principles of the Hacker Ethic
    were the good guys and were simply referred to as hackers. The good hackers were
    offended that the media was associating hacking with criminal activities carried
    out by a few individuals and decided to coin the term `cracker`.


    However, times have changed and the word `cracker` is rarely used anymore. Today,
    hackers are generally divided into:


    ### Black hat hackers

    These are criminals who intentionally break into systems and steal information
    or money. They are also known as malicious hackers or `crackers` and they usually
    hack devices for selfish purposes.


    ### White hat hackers

    These are also known as ethical hackers. They only hack devices and systems in
    order to find potential vulnerabilities and then figure out ways of preventing
    those weaknesses being exploited. White hat hackers ensure that they release updates
    to the public to patch up system vulnerabilities. They are constantly searching
    for new vulnerabilities in systems and devices in order to make them more efficient
    and secure. This is not an easy task, and that is why ethical hackers form communities
    to share their knowledge.


    ### Grey hat hackers

    These are hackers who are motivated by profit as well as ethical reasons. They
    tend to use both legal and illegal means to exploit a system. They gain access
    to a person’s system, inform them of the vulnerability they have found, and then
    provide suggestions on how to improve their security.


    ## The Motivations for Hacking


    Though hacking is considered something that is reserved for programmers, anyone
    can learn how to hack. There are generally four major reasons why people engage
    in hacking:


    1. To gain legal and authorized access to a system in order to test its security,
    expose any vulnerability that may exist, and fix them.

    2. To gain illegal access into a system out of pure curiosity or pride. This is
    usually what motivates most amateur hackers who simply download ready-to-use tools
    off the Internet. Such hackers are commonly referred to as “script-kiddies,” and
    they often target random organizations and systems just to be disruptive. Most
    of the hacking events that the media highlights are usually script-kiddies who
    are looking for an opportunity to be a nuisance.

    3. To gain unauthorized access in order to maliciously destroy information or
    tamper with it.

    4. To gain access to a computer system so as to steal data and sell it to other
    parties. Corporations or governments usually hire these.


    Regardless of what your motivations are, always remember that there are many different
    ways to learn how to hack. As technology advances and knowledge evolves, new and
    more effective ways of attacking or protecting systems are being created.


    Anyone who owns a Smartphone or computer needs to learn how to hack. You need
    to be motivated to learn how your own devices and systems work so that you can
    adjust and make them better. You probably receive tens of downloads, messages
    and emails on your portable electronic devices on a daily basis, yet do you really
    pay attention to what you allow into your system?


    If you want to protect yourself from black hat hackers, you will need to start
    thinking like one. This means that you have to gain the relevant knowledge, understand
    the motivations of an attack, and the tools that can be used against you. This
    will be the first step in understanding how to defend yourself and even launch
    your own counterattack.


    ### What You Need


    Hacking may seem daunting at first, especially if you have never practiced it
    before. However, all you really need is knowledge of computer use and an ability
    to follow written instructions. You may not know how to write computer code yet,
    but that is OK. This book contains some instructions on the coding software and
    operating system you need. On the other hand, if you truly want to become an expert
    hacker, then you will have to learn how to code.


    There are specific skills and requirements that you must have to become a hacker,
    such as:


    - **Mid-level computer skills**: Your computer skills need to involve more than
    just typing and browsing the Internet. You must be able to use `Windows` command
    module effectively or create a network.

    - **Networking skills**: Hacking is predominantly an online activity, so you need
    to understand the terms and concepts related to online networks, such as routers,
    packets, ports, public and private IPs, `WEP` and `WPS` passwords, `DNS`, `TCP/IP`,
    `subnetting` and many others.

    - **Database skills**: It is important that you learn and master database management
    systems (e.g. `MySQL` and `Oracle`) in order to understand the techniques that
    hackers use to penetrate your databases.

    - **Use of Linux OS**: The vast majority of hackers use the `Linux` operating
    system because unlike `Mac` and `Windows`, it allows you to tweak programs as
    you want. Nearly all the hacking tools you will come across are developed for
    `Linux`.

    - **Scripting skills**: Sooner or later you will have to learn how to create your
    own hacking tools, and you cannot do this without developing the necessary scripting
    skills. By creating and editing your own scripts, you will no longer have to rely
    on tools provided by other hackers, thus enhancing your ability to defend your
    system. Black hat hackers are good at creating hacking tools, so you must match
    them for knowledge if you want to stay secure. You should consider learning a
    scripting language like `Python` or `Ruby Rails`.

    - **Use of virtualization software packages**: Before you try out a hack on a
    real life system, you should first run it through virtualization software that
    will provide a safe setting for your test. You need to know how to use a virtual
    workstation, for example, `VMWare Workstation`, so that you avoid damaging your
    own computer or mobile device.

    - **Understand security concepts and technologies**: There are a lot of elaborate
    security concepts and technologies in the field of information technology. As
    a hacker, you must know the ones that are most important for your use, for example,
    `firewalls`, `Public Key Infrastructure (PKI)`, `Secure Sockets Layer (SSL)`,
    among others.

    - **Reverse engineering skills**

