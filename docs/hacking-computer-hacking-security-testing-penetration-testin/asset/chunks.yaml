    学习如何破解他人的密码固然很好，但如果知道如何防止其他黑客破解你的密码，会更好。你可以采取许多通用的防御措施来避免密码被破解。最基本的方法是确保每个系统、账户或网站都有其唯一的密码。避免为你的所有用户账户创建同一个密码的诱惑。


    当然，这意味着你要么得记住所有的密码，要么得把它们全部写下来。这两种选择分别是繁琐且具有极高风险的。


    ## 密码策略


    受雇于加强组织信息安全的伦理黑客必须强调建立严格密码策略重要性。这可以通过向用户展示生成安全密码的方法来实现。人们倾向于使用单个单词来创建密码，例如 `monkey`。然而，更安全的策略是使用短语，例如
    `bigredmonkey`。


    另一种方法是向用户展示与他人共享密码或创建弱密码的后果。如果人们能够直观地看到并理解在黑客破解了他们的密码后会发生什么，他们就会更认真地对待密码安全问题。最后，必须让用户意识到社会工程攻击以及它们是如何发生的。


    这三条建议可以扩展为制定一项能够提供足够信息安全的组织密码策略。在此过程中，必须执行某些特定标准：


    - 使用大小写字母、数字、符号和其他特殊字符的组合。仅使用字母或数字绝不是一个明智的决定。这对于恶意黑客来说非常容易。

    - 使用拼写错误的单词或缩写词。

    - 使用标点符号分隔单词。

    - 每隔 6 到 12 个月更改一次密码。一旦发生安全泄露，必须立即更改密码。

    - 确保你拥有的每个账户都有其唯一的密码，特别是对于服务器、路由器和防火墙。使用相似的密码并没有错。你需要对你使用的不同系统稍微微调一个密码。例如，对一个账户或系统使用
    `WindinTheWillows-76`，对另一个使用 `Yahoo89+WindInTheWillows`。

    - 改变密码长度。使用可变化的长度会让黑客的生活变得困难，因为他们将被尝试所有的密码长度组合。

    - 避免使用口语或俚语，以及任何字典单词。

    - 当你更改密码时，不要重复使用过去五次更改中任何旧密码。

    - 避免与他人共享密码。大多数人倾向于向要求使用他们电脑的同事或朋友提供密码。无论任何代价都不要透露密码。

    - 为屏幕保护程序设置密码。加密硬盘配上未解锁的屏幕是黑客可以利用的漏洞。

    - 不要存在不受保护的 MS Office 文件中存储密码。始终使用密码管理器程序。


    还有一些更高级的防止密码被破解的方法：


    - 设置安全审计以监控密码攻击。

    - 使用 `WinHex` 等高级软件检查你的系统是否在内存中永久保存密码。

    - 确保正在使用的系统已打补丁。

    - 作为管理员，你应该启用账户锁定功能，如果某个特定次数的尝试中输入错误密码，将用户锁定在系统之外。如果是用户忘记了密码，他们必须通知安全管理员。

    - 建立更强大的身份验证措施，如生物识别、智能卡或数字证书。

    - 使用密码锁定系统 BIOS。


    # 第 10 章：破解网站和 Web 应用


    以下是网站和 Web 应用的一些主要漏洞：


    ## 目录遍历攻击


    目录可以描述为网页设计人员用于存储网站文件的文件夹。目录遍历攻击是指黑客能够访问并在网络目录与存储在目录中的文件之间导航。这些是网站最敏感的文件之一，例如
    `root`、`htaccess` 和 `confi` 文件。


    目录遍历攻击的另一个名称是 `../`（点点斜）攻击。首先理解它的含义很重要。每当输入 `..` 作为命令时，系统就会收到一个指令，向上移动一个文件夹。假设你目前位于位置
    `C: Users/John/Downloads/Education`。如果你输入 `..`，你将向上移动一个文件夹到 `C: Users/John/Downloads`。再次输入该命令，你将到达
    `C: Users/John`。


    现在，如果你想访问位于“John”文件夹中名为 `abcdefg.txt` 的文本文件，你必须输入命令 `....abcdefg` 来移动到存储文本文件的地方。注意，为了向上移动两个文件夹，你输入了四个点。


    目录遍历攻击是一种 HTTP 漏洞，旨在访问受限文件或查看 Web 服务器上的随机文件，例如密码文件和 SSL 私钥。大多数黑客通常热衷于进入服务器的 `root`
    目录，而使用上述“点点斜”技术是可以实现的。利用这一漏洞可以让你访问包含密码或机密信息的文件。


    黑客还可以进行搜索，以确定网站目录中公开访问的文件类型。你可以使用像 `HTTrack` website `Copier` 这样的爬虫程序来找到每个公开的文件。这个免费工具易于使用。只需加载它，命名项目，并指示软件它应该镜像哪些网站。几分钟或可能几小时后，`HTTrack`
    将向你显示网站包含的所有文件和记录，并将它们存储在你的驱动器 `C: My Websites` 中。


    大多数网站通常包含不应公开查看的敏感信息，例如源代码和脚本。注意服务器中的 `.zip` 或 `.rar` 文件。即使是 `.html` 或 `pdf` 文件也可能包含有用信息。


    目录遍历防御措施


