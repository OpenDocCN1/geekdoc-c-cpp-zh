- fmt: '

    An ethical hacker is bound by the code of professionalism, confidentiality, and
    conscience. Make sure that you always stick to the plan that was previously approved
    and avoid adding any new details to it down the road. You are not to release or
    share the results of your security test with unauthorized persons both within
    and outside the organization. Any information you discover should be treated as
    sensitive and not disclosed to those who don’t need to know. It is also important
    to be aware of any local laws or governance regulations within the organization
    that relate to hacking. If the laws or regulations are against hacking, do not
    perform an ethical hack.


    ### You must maintain good records


    Every ethical hacker worthy of that name must embody the attributes of diligence
    and patience. Hacking is a long and arduous task that involves plugging away over
    a keyboard for hours on end, not giving up until you reach your goal. Another
    professional aspect of ethical hacking is the maintenance of records, electronic
    or paper, to back up your discoveries. There are some basic rules that should
    b followed when it comes to record keeping:


    - Note down every task performed.

    - Log every piece of information directly.

    - Always have a backup copy of the log.

    - Note down every test performed, including the dates.

    - Though some tests or tasks may not go as planned, ensure that you still keep
    accurate records.


    ### You must protect confidential information


    You are likely to come across a lot of personal and private information during
    your testing. It is important that you respect people’s privacy and treat every
    piece of information with confidentiality. Passwords, encryption keys, and other
    sensitive information must not be abused. Always treat other people’s personal
    or confidential information with the same respect you would want others to treat
    your own.


    ### You must not cause harm


    Hacking actions often cause some kind of unforeseen damage. There are times when
    you may get excited about the job and the positive test results you are receiving,
    so you keep plugging away. However, you may accidentally cause some kind of outage
    or even interfere with another’s rights. This is why you should always have a
    plan and then commit to sticking to it. Be knowledgeable about the tools you are
    using, especially their implications. Choose your tools wisely and always read
    the documentation.


    ### Your process must always be empirical


    If you want your test results to be accepted, you need to use a scientific process
    that is characterized by these features:


    - **Quantifiable goals** - Set a goal that you will be able to quantify. You can
    set task goals or time-related goals.

    - **Consistency and repeatability** - Every test that you perform must produce
    the same results. If they do not, then your results are inconsistent and probably
    invalid. If you repeat a test over and over, you should get the same results every
    time. Consistency and repeatability of tests are critical features of an empirical
    process.

    - **Permanence of results** - The client that you work for will look forward to
    your test results if you focus on fixing persistent problems for good, instead
    of solving temporary ones that may recur later on.


    ### You must not use any random tool


    There are a lot of hacking tools in the market today. It is easy to be tempted
    to try them all out, probably since most of them are free. However, it is advisable
    to just focus on a few tools that you know are effective and you are familiar
    with.


    ### You must report all your findings


    If you are hired to ethically hack a system, and the process takes longer than
    a week, you need to give your clients weekly status updates. It can be very unnerving
    to hire someone to test your system only for him or her to spend weeks without
    any kind of feedback. If you discover any high-risk weaknesses and vulnerabilities
    in the system during your tests, you need to report them to those concerned. The
    reports that you issue are what the client will use to determine how thorough
    and sincere you are in your work. A report will also help during analysis and
    critique of your results.


    The 10 commandments explained above are very important for ethical hacking. There
    are times when your work may be criticized unfairly, but if you followed these
    commandments, you will easily be able to defend yourself. Finally, make sure that
    you do not leave out any results no matter how insignificant they may seem. You
    may not need to highlight them all in the summary of your report, but always ensure
    that they are explained in the detailed narrative. You do not want to sully your
    reputation as an ethical hacker by being accused of ineptitude and manipulation
    of results.


    # Chapter 4: The Hacker’s Methodology


    A hacking methodology is an essential step-by-step procedure that a hacker follows
    as they prepare for a penetration test. This methodology is critical to a hacker
    because it helps guide you from where you are now to where you want to go. Ethical
    hacking involves more than just penetrating and patching a system. A hacking methodology
    is what separates them real hacker from the kiddies, and saves you a lot of time
    and energy.


    ## Prepping for the Test


    There are particular scanners that you can use to automatically discover vulnerabilities
    in a system. Some of these tools can even be used to fix the vulnerabilities.
    The good thing about these tools is that they help you focus on the testing aspect
    without spending too much time on the steps involved. However, it is always advisable
    for every hacker to know the steps so that they can understand the hidden details,
    which will help in focusing on the stuff that actually matters.


    Both an ethical and criminal hacker use the same process when testing a system.
    The only difference is the end goal and how it will be achieved. As an ethical
    hacker, you must test every potential entry point into the network. These may
    include customer networks, wireless networks, or mobile devices. Malicious hackers
    are able to use people, physical components, or computer systems to launch an
    attack, so you have to test everything.


    Your primary job is to discover vulnerabilities and then figure out how a malicious
    hacker would go about exploiting the system. You can decide to simulate a restricted
    attack on a single computer or comprehensively attack the whole system.


    You have to think like a criminal hacker as you prepare to test the network. Search
    for weaknesses, evaluate both internal and external processes, assess how the
    various systems are linked together, and check the level of protection of private
    systems. The techniques you use to accomplish all this are essentially the same
    for social engineering and physical security evaluation.


    There are generally two ways that you can assess a system - a blind (covert) assessment
    and an overt assessment. An overt assessment is where you have some inside knowledge
    of the system you intend to test. With a blind assessment, the client doesn’t
    give you much information apart from the name of the company. You have to search
    for information on your own, the same way a criminal hacker would have to. The
    benefit is that you get to see exactly what a malicious hacker would see when
    they try to gain access publicly. The downside is that testing takes more time,
    and there is a higher chance of overlooking certain vulnerabilities.


    ### Reconnaissance


    This is the process of collecting information about the person or organization
    that you want to target. It is a passive approach that mainly involves using publicly
    available resources to find information about something. There is a lot of information
    on the Internet, so you will have to be patient as well as diligent.

