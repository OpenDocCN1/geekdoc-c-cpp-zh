    tend to use SHA-1 and MD5, so use these algorithms for your rainbow tables.


    The downside with this method is that the tables require a huge storage space
    on your hard drive. It is clear that different plaintext passwords will result
    in different hashed passwords containing different salts. This means that every
    salt would need its own table. If a DES crypt ( ) function is being used, the
    number of salt values would be 4,096, thus making rainbow tables not feasible
    even with a 4-character password. This is no longer a big problem since memory
    is much cheaper nowadays, but the need for large storage space tends to discourage
    this method of cracking.


    Examples of some programs that apply rainbow tables include RainbowCrack and OphCrack.


    Password Probability Matrix


    In technological circles, it is accepted that there will always be a trade-off
    between storage space and computational power. For example, mp3 files require
    very little storage space for the high-quality music file, but that simply increases
    the need for greater computational power. Your regular calculator, on the other
    hand, requires very little computational power because it contains a pre-computed
    lookup table that stores functions.


    A password probability matrix works by trying to find the perfect balance between
    power and space, in order to reduce the time that a brute force attack would take
    to crack a password. In other words, the time and the storage space required must
    be reasonable. Unfortunately, you will still have to deal with salts. However,
    this problem can be mitigated by minimizing the amount of storage space required
    without compromising the space needed for the 4,096 possible salts in crypt (
    ) password hashes.


    This method involves building a 3-D binary matrix that links portions of the plaintext
    values with portions of the hash values.


    The downside to using a probability matrix is that it takes a very long time to
    create the matrix itself. In fact, this would take as much time as running a brute
    force attack. The salts would also still pose a problem for a hacker.


    ## How to use John the Ripper and pwdump3 to crack a password


    John the Ripper is used when cracking hashed Windows and LINUX passwords, while
    pwdump3 is used to extract hashed passwords from a Security Accounts Manager database.
    It should be noted that you will require administrative access to make this work.


    For windows passwords, follow the easy steps described below.


    From your Windows C: drive, create a directory and name it “passwords.”


    If you do not have a decompression tool, you need to download and install one
    on your computer. You can use 7-zip or WinZip.


    Download John the Ripper and pwdump3, extract, and install them in your system.
    Make sure you extract them into the same passwords directory created in step 1.


    Type in the command below to run pwdump3


    c :passwordspwdump3 > cracked.txt


    This will redirect the output into the file cracked.txt, which will capture the
    Windows SAM password hashes that John the Ripper cracks.


    Type the command


    c : passwordsjohn cracked.txt


    This command will run John the Ripper against the Windows password hashes. The
    result should be the cracked passwords of the Windows user(s), though it is difficult
    to estimate how long the process will take. It all depends on the number of users
    and the level of complexity of their passwords.


    For LINUX/UNIX systems, follow the steps described below:


    Download LINUX source files.


    Type the command below to extract the program:


    [root@local host yourcurrentfilename ] #tar - zxf john - 1.7.9.tar.gz


    Go to the /src directory created after the program was extracted in step 2\. Type
    the command:


    Make generic


    Go to the /run directory. Type the command:


    . /unshadow /etc/passwd /etc/shadow > cracked.txt


    This command will utilize the unshadow program to merge the shadow files and password
    and copy them into the crackd.txt file.


    Launch the cracking process by entering the command:


    . / john cracked.txt


    This process may take a while to complete, but once John the Ripper has finished,
    you will get an output similar to what you had in the Windows process.


    ## Password Storage Locations


    Different operating systems usually store the passwords in their own unique locations.
    For example, Windows stores its passwords in:


    Security Accounts Manager (SAM) database - c:winntsystem32config or c:windowssystem32config.
    Sometimes Windows stores its passwords in c:windowsrepair or c:winntrepair directories.


    Active Directory database - This is stored locally or across different domain
    controllers.


    For LINUX and other associated operating systems, passwords are stored in:


    /etc/passwd


    /.secure/etc/passwd


    /etc/security/passwd


    /etc/shadow


    If you had to choose between setting up a weak password that you could remember,
    and creating a very strong one that was too complex and had to be written down,
    which option would you go for? The better option would be to write the complex
    password down and store it in a secure place. A secure place does not include
    a password-protected computer file. The most secure storage options you have include:


    Password managers - These are tools that can store multiple passwords for different
    accounts. For example Password Safe, LastPass, or Dashlane.


    Fully encrypting your hard drive to lock out malicious hackers who intend to access
    the operating system.


    A locked safe or file cabinet.


    ## Countermeasures to Password-Cracking'
