  raw: 'Salting is the process of adding pieces of information (the “salt”) to a password
    prior to hashing it. This makes the password harder to guess using a basic cracking
    algorithm since the password is no longer in form of plain simple words. For example,
    a user may create a password out of the hundreds of thousands of English words
    in a dictionary. After encryption, a random 32-bit salt is added to the original
    password. This makes a hacker’s pre-calculated hashes totally useless. A hacker
    will now have to calculate the hash for every word and also calculate the correct
    salt from 4,294,967,296 possibilities. A hacker will now have to contend with
    possible inputs of about 800 trillion hashes! Yes, the password that the user
    created may be simple, but the addition of salt can make hacking it way more difficult.
    It must still be noted that salting only hinders cracking utilities that rely
    on hashes. If a cracking program relies on rapid input, such as brute-force or
    a dictionary attack, salting won’t be as effective.


    ## Cracking Passwords


    When it comes to cracking passwords using software, one of the first things you
    have to note is that passwords are never stored as plain text. This would be too
    easy a target and wouldn’t provide the necessary security. For this reason, a
    one-way hash function is applied. The most popular one-way function is based on
    DES and is known as crypt ( ).


    A salt value is normally added to the hash value in order to make the algorithm
    more complex, and thus more secure from hackers. Every hash value, including its
    salt value, is stored in a password file under the assumption that even if a hacker
    were to steal the file, they wouldn’t be able to understand the hashes.


    When a genuine user wants to log into their account, they have to fill in their
    password. In order for their password to be authenticated, their password hash
    and the hash value previously stored on file must be matched. During this authentication
    process, the original salt value is extracted from the file, appended to whatever
    the user has typed in, and the whole string is sent through the one-way hash function.
    If the user inputs the correct password, the hashing function will generate an
    output that matches what was stored in the password file. This entire process
    is done without having to store a password in plain text.


    ### Methods of cracking passwords


    There are a number of ways to crack passwords. Some of them are old-fashioned
    yet surprisingly still effective. Then there are more advanced techniques that
    involve the use of computer programs.


    Guessing


    This may seem a bit old-school and ineffective, but you would be surprised at
    just how effective it may be. There may be hundreds of advanced techniques, algorithms,
    and programs that can crack a password, but there are times when the simplest
    solution is all you need. Guessing involves using logic and attempting to use
    commonly used passwords to hack a system.


    The majority of users tend to view passwords as annoying and cumbersome. It is
    very difficult to remember different passwords for all your accounts/websites,
    so most simply opt for the low-hanging fruit. They choose passwords that are easy
    to remember and, therefore, easy to guess. Some of the most common passwords include:


    The word “password” itself.


    The user’s real name.


    The person’s username/ID.


    The name of a family member.


    Favorite food, color, holiday location.


    The name of pets.


    Birth dates.


    The guessing method can sometimes be faster and more effective if the hacker knows
    the victim very well, or can get access to a lot of their personal information.
    Another thing to remember when hacking a password is that most people use one
    password for multiple accounts. Therefore, if you can correctly guess one password
    you will have a great chance of using it to access other accounts.


    Social Engineering


    One of the most obvious ways to get a password is to simply ask for it. People
    can be very trusting at times depending on the situation that is presented to
    them. A hacker can call a user, pretend to be from the IT department, and inform
    them that they have a problem with their email system. The hacker then requests
