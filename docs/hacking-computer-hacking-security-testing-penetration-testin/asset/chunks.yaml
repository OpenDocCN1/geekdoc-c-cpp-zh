    # Chapter 9: How to Hack Passwords


    Most people think that having a password and user ID is enough security for their
    valuable information. The reality is that passwords can only do so much from a
    security standpoint. Malicious hackers are always finding new ways to crack passwords
    and gain access to systems and networks.


    A user may assume that the password they are using is known only to them, but
    one can never be sure. Sometimes it is necessary to have another person having
    a password just for security reasons. However, most often a secondary party may
    be privy to a password without the owner being aware.


    Passwords give people a false sense of security, and knowing a password never
    means that you are authorized to use it. Password vulnerabilities come in two
    classes: Organizational/User vulnerabilities and Technical vulnerabilities.


    ## Organizational/User Vulnerabilities


    This class of vulnerabilities includes lack of any password policies or poor enforcement
    of existing policies. People tend to desire a convenient lifestyle where they
    do not have to cram or remember numerous different passwords. If the passwords
    become too many or are too complex, people tend to make some elementary mistakes,
    which give malicious hackers an easy time.


    If you take into consideration the numbers `0` to `9` and the `26` letters of
    the alphabet, it is possible to create around three trillion password combinations,
    each with eight characters. Yet the majority of people tend to make passwords
    that are weak, just because they are easy to remember. Some of the passwords that
    most people choose to protect their data are downright silly. For example, `password`,
    `12345678`, `abcdefgh`, or even no password whatsoever!


    As a hacker, some of the things that make it easy to hack a person’s password
    include:


    - A password that is easy to guess.

    - A password that is rarely changed.

    - Use of the same passwords over and over again for different accounts and across
    multiple systems.

    - A password that is written down and stored in an unsecured place. This is especially
    true for passwords that are complex and hard to remember.


    ## Technical Password Vulnerabilities


    Once a hacker has been able to exploit the organizational vulnerabilities, they
    will then move on to taking advantage of the technical ones. For example:


    - Weak encryption schemes - Most software developers and vendors tend to put too
    much confidence in their products. They assume that passwords remain secure if
    the source codes of their encryption algorithms are a secret. This is simply not
    true. Any hacker who has patience and tenacity can quickly hack a password. Once
    the source code has been cracked, hackers tend to share it online, thus making
    it available to the public. There are also tools that can crack any weak encryptions,
    as long as your computer has adequate computing power.

    - Unsecured programs and databases that are used to store a cache of passwords.

    - Databases that are unencrypted and give access to a large group of people, some
    of whom don’t have the right to such information.

    - Applications that do not hide a password as the user is typing it on screen.


    There are thousands of password vulnerabilities that a hacker can take advantage
    of. Go to the National Vulnerability Database to discover more vulnerabilities
    that can be exploited.


    ## Technical Tools for Cracking Passwords


    When it comes to cracking passwords, there is the traditional way and then there
    is the high-tech way. There are several very effective tools that hackers love
    to use to crack passwords. They include:


    - `Brutus` - For cracking logins for `FTP`, `HTTP`, and so on.

    - `Cain and Abel` - For cracking hashes, `Windows` and `VNC` passwords, and much
    more.

    - `Elcomsoft System Recovery` - For cracking or resetting `Windows` administrative
    rights and user passwords using a bootable CD.

    - `Elcomsoft Distributed Password Recovery` - For cracking `Adobe`, `MS Office`,
    `Windows`, `iTunes`, and other types of passwords using thousands of networked
    computers at the same time. It enables faster cracking by using GPU video acceleration
    tool.

    - `Ophcrack` - For cracking `Windows` passwords using rainbow tables.

    - `John the Ripper` - For cracking hashed `Windows`, and `LINUX/UNIX` passwords.
    This cracking program first adopts a dictionary style of attack, followed by an
    exhaustive brute force attack. It is one of the most popular password-cracking
    programs available.

    - `Proactive Password Auditor` - For running rainbow, dictionary, and brute force
    cracks against `NTLM` and `LM` password hashes.


    These are just a few examples of some of the tools that hackers can use to crack
    passwords of all types and in different systems. It is important to understand
    how such password cracking programs work, and that would be very difficult unless
    you also understood how password encryption takes place.


    Password encryption takes place when a password is stored in a system using a
    one-way hash or encryption algorithm. The hashed password then appears as a fixed-length
    encrypted string. In theory, all hashed passwords are supposed to be irreversible
    and thus uncrackable. Moreover, particular passwords like those used in `LINUX`
    are assigned a random value known as a `salt` to generate some measure of randomness.
    This is what prevents two different people who use the same password from having
    the same hashing value for their passwords.


    What a password-cracking tool does is it takes a group of passwords that are well
    known, runs them through a hashing algorithm, and generates encrypted hashes.
    These encrypted hashes are then compared to the original password hashes that
    are extracted from the database of the system being hacked. This comparison takes
    place at a super-fast speed, and when the newly generated hash matches the original
    hash from the database, its game over. The password is considered cracked.


    You may come across some passwords that are very strong, but sooner or later,
    the password-cracking utilities will crack it. The only way to keep out malicious
    hackers from a system is to know how to use the same tools they do to find weaknesses
    and fix them.


