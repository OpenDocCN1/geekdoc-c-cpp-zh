    This involves taking a piece of software or hardware apart in order to understand
    how it works, and then convert it into a tool that is technically more advanced.
    One of the things you will realize is that most hackers are able to make better
    hacking tools by reverse engineering the malware of other hackers. With such skills,
    you will be able to be a more effective hacker.


    # Chapter 2: Hacking and Basic Security


    The majority of people are generally aware that hackers and malicious users can
    attack their systems. However, most people don’t really understand the specific
    attacks that they are vulnerable to, much less the key signs that a hacker has
    infiltrated their system.


    ## Detecting Hacker Attacks


    A malicious hacker can exploit your system vulnerabilities in a number of ways.
    An attack may come through one specific exploit, several different exploits at
    once, a misconfiguration in one of your system components, or probably a backdoor
    that was created during a past attack.


    This is why it is often difficult to determine whether you have been hacked or
    not, especially if you are not an experienced user. If you want to learn how to
    be an ethical hacker, it is important that you also be able to detect if someone
    else has hacked your system. The information below consists of guidelines that
    you can use to help you detect possible hacker attacks.


    Remember that it is impossible to be fully certain that your system has been compromised
    just because your machine displays the behaviors indicated. However, if your system
    does show a number of these signs, then it is likely that you have been hacked.


    The guidelines below relate to machines that run either Windows operating system
    or UNIX.


    ### For Windows OS


    - An unusually high level of outgoing network traffic. In case you are using `ADSL`
    or a dial-up account and you detect a suspiciously large volume of outgoing traffic,
    yet you aren’t actively uploading anything, your system could be under attack.
    A malicious hacker could be using your computer to send out spam, or a network
    worm could be using your system to replicate and distribute itself. However, if
    you are using a network cable to browse the web, then it gets a bit tricky because
    your outgoing and incoming traffic are usually almost the same.

    - Elevated levels of disk activity and unknown files in your root directory. Most
    malicious hackers tend to run massive scans on the computers of their targets,
    looking for any documents or files of value. The scans tend to increase disk activity
    even when the computer is in an idle state. These scans are meant to unearth passwords
    for websites, online payment accounts or bank login information. There are also
    some worms that infect your system and then search for documents containing email
    addresses. These can then be used to spread the worm to other network users. If
    you detect an increase in disk activity together with folders with suspicious
    names, then you may have been hacked or infected with malware.

    - Your personal firewall stopping a huge number of packets from one source address.
    Malicious hackers normally use automated probing tools to find multiple ways of
    penetrating a system. If you discover that your firewall is stopping a suspiciously
    large number of packets originating from one address, then you could be under
    attack. The fact that your firewall is able to stop these attacks is great, but
    there is a possibility that the hacker will target a specific `FTP` service in
    your system that you may have exposed when online. The best action to take is
    to temporarily block the hacker’s IP address until they stop trying to connect
    to your system.

    - Sudden reports of Trojans and backdoors being detected by your antivirus. The
    common misconception is that malicious hackers always launch attacks in complex
    ways, yet the truth is that they will always take the easier route if it is available.
    If your system has been previously compromised, a malicious hacker will simply
    use a backdoor or Trojan to fully access it. In case your antivirus is giving
    reports of such malware yet you haven’t made any recent changes to the system,
    somebody could be accessing your system remotely.


    ### For UNIX machines


    - Any files with suspicious names in your `/tmp` folder. Most malicious hackers
    tend to create temporary files and hide them in the `/tmp` folder. These files
    are not usually deleted, thus making it possible to detect whether hackers have
    penetrated a system. There are also certain worms that target UNIX systems. They
    make themselves at home in the `/tmp` folder and use it to recompile themselves.
    You need to look out for these signs.

    - The addition of suspicious services to your `/etc/services` file. Malicious
    hackers often add a few extra text lines in order to open a backdoor into a UNIX
    system. A hacker will target two files - `/etc/services` and `/etc/ined.conf`.
    These are the files that you need to keep an eye on in order to monitor any backdoors
    that a hacker may have opened in your system.

    - Modification of system files contained in the `/etc/` folder. A malicious hacker
    will usually create a new user profile that they will use to log into the system
    later. Such modifications take place in the `/etc/shadow` and `/etc/passwd` files.
    If you are using a multi-user system, you should always watch out for any suspicious
    usernames or additions within the password file.


    ## Types of Attacks


    There are different ways that a hacker can launch an attack on a system. Systems
    have become even more vulnerable in recent times due to social media, cloud computing
    and virtualization. The more advances we make technologically, the more complex
    the IT environment becomes, thus causing greater insecurity. There are generally
    three broad forms of attacks that hackers can launch against a system. These are
    Physical, Syntactic, and Semantic.


    - A physical attack is where hackers use traditional weapons like fire or bombs
    to destroy data. It may also involve breaking into buildings and stealing equipment,
    or even rummaging through garbage cans to find valuable information (passwords,
    intellectual property, network diagrams, etc.)

    - A syntactic attack is where a virus, worm, Trojan horse, or malware is used
    to penetrate and disrupt a system. One of the most common ways that this form
    of attack is carried out is via email.

    - A semantic attack is where a hacker subtly approaches a target, gains their
    confidence, and then causes the system to generate errors or erratic results.
    The hacker is able to modify information and pass it off as genuine or disseminates
    inaccurate information.


    These three broad classes can be broken down into specific hacking tricks. Some
    of them are advanced and sophisticated techniques while others are the conventional
    types that have been around for a long time.


    ### Keylogging


    A malicious hacker may use simple software, known as a `keylogger`, to record
    every keystroke that is typed on a computer keyboard. The software then stores
    the information in a log file in your computer, allowing for later retrieval by
    the hacker. The log file may contain passwords to various accounts as well as
    personal email IDs.


    ### Denial of Service (DoS)


    This is a form of attack where a hacker floods a server or website with tons of
    traffic requests in an attempt to bring down the server. The target server or
    site will be unable to handle the large volume of requests in real time, resulting
    in a crash. Hackers are able to perform this kind of attack by deploying zombie
    computers or botnets whose sole job is to send incessant request packets to the
    targeted system.


    A hacker may also launch a `DoS` attack on an individual instant messenger user.
    The user’s system will be flooded with messages from multiple user accounts all
    created by the hacker, thus causing the system to become unstable and hang.


    ### Phishing Attacks

