    Make sure your Wi-Fi adapter is in monitoring mode. To find the wireless network
    that is being targeted as well as any clients connected to it, enter this command:


    ```

    Arodump-ng-c [channel]-bssid [target router MAC Addres]-I wlan0mon

    ```


    A window will open up displaying a list of clients who are connected to the network.
    Their whitelisted MAC addresses will also be shown. These are the addresses you
    need to spoof in order to enter the network.


    Pick one of the whitelisted MAC addresses from the list to use to spoof your own
    address. Before you are able to perform the spoofing, you must take down the monitoring
    interface. Enter the command:


    ```

    Airmon-ng stop wlan0mon

    ```


    The next step is to take down the wireless interface of the MAC address you intend
    to spoof. Enter the command:


    ```

    Ifconfig wlan0 down

    ```


    Then you use the `Mcchanger` software to change the address. Enter the command:


    ```

    Macchanger -m [New MAC Address] wlan0

    ```


    Remember, you had taken down the wireless interface in step 3. Now it is time
    to bring it back up. Use the command:


    ```

    Ifconfig wlan0 up

    ```


    Now that the MAC address of your wireless adapter has been changed to that of
    an authorized user, test and see if the network will authenticate your login.
    You should be able to connect to the wireless network.


    ## Securing Wireless Transmissions


    Hacking of wireless networks poses three main threats: Disruption, Alteration,
    and Interception. In order to prevent malicious hackers from eavesdropping on
    a wireless transmission, you can use:


    - **Signal-hiding methods**: Before a malicious hacker is able to intercept wireless
    transmissions, they first have to locate the wireless access point. An organization
    can make this more difficult by switching off the SSID (service set identifier)
    being broadcast by the access point, assigning a cryptic name to the SSID, lowering
    signal strength to provide just enough requisite coverage, or stationing access
    points away from exterior walls and windows. There are also more effective but
    expensive techniques, such as employing directional antennas to restrict the signal
    within a specific area or using `TEMPEST` (a technique to block emission of wireless
    signals).

    - **Stronger encryption of all wireless traffic**: This is very important especially
    for organizations that must protect the confidentiality of their information being
    broadcast wirelessly. This measure reduces the risks of a man-in-the-middle attack.

    - **Stronger authentication procedures**: This should apply to users as well as
    their devices. This minimizes man-in-the-middle attacks.


    ## Countermeasures against Denial of Service Attacks


    Malicious hackers may at times attempt to bring down the servers of a particular
    organization, but in some cases, a `DoS` attack may be unintentional. There are
    certain steps that can be taken to minimize the risks of this form of attack:


    - Performing site surveys carefully to determine the location of signals emanating
    from other devices. This should be used as a guide in deciding where the access
    points should be located.

    - Conducting regular audits of network performance and activity to determine areas
    with problems. If there are any offending devices, they should be removed. Measures
    should also be taken to enhance signal coverage and strength in problem areas.


    ## Securing Wireless Access Points


    Wireless access points that are poorly configured are a major vulnerability and
    may allow malicious hackers unauthorized access to confidential information. To
    secure wireless access points, the following countermeasures must be taken:


    - **Eliminate all rogue access points**: The best way to do this is to use `802.1x`
    to prevent any rogue devices from plugging into and connecting to the wireless
    network.

    - **Ensure all authentic access points are properly configured**: Make sure that
    all default settings are changed since they are publicly available and hackers
    can easily exploit them.

    - **Authenticate every device using 802.1x protocol**: a strong authentication
    system will prevent unauthorized devices from setting up backdoors. This protocol
    ensures stringent authentication before assigning any device an IPIP address.


    ## Securing Wireless Devices


    There are two perspectives when it comes to assessing the security threats against
    wireless devices: Theft/Loss and Compromise. Laptops and PDAs usually contain
    a lot of confidential and sensitive information, and therefore must be protected
    from theft or loss. Wireless client devices can also be compromised when a malicious
    hacker gains access to stored data in the device. Hackers can also use the device
    to launch attacks on other systems and networks.


    ## Securing Wireless Networks


    - **Encryption**: This is the best way to secure a wireless network. Most base
    stations, access points, and wireless routers come with inbuilt encryption mechanisms
    that enable scrambling of network communications. Always make sure that the router
    you buy comes with an encryption feature. Most manufacturers turn this feature
    off, so ensure that you manually turn it on before you start using your router.

    - **Anti-spyware, anti-virus, and firewalls**: Make sure that your wireless network
    is protected in the same way as a wired connection. Keep all your software updated
    and always check whether your firewall is switched on.

    - **Switch off your router’s identifier broadcasting**: This is the mechanism
    that a wireless router uses to broadcast its presence in an area. However, there
    is no need to announce the presence of a network if the users know that it is
    already there. Malicious hackers tend to search for the identifier broadcast to
    zero in on potential targets. If your router allows disabling of the identifier
    broadcasting, do it.

    - **Change default identifier**: Every router has a default ID given to it by
    its manufacturer. You may have switched off the identifier broadcaster, but hackers
    can still attack the network if they find out the default ID, which is publicly
    accessible. Change the identifier and don’t forget to configure the new ID into
    your computer.

    - **Change the default password**: Every router is assigned a default password
    by the manufacturer to allow a user to initially set up the device. These default
    passwords are easy to find, so make sure that you change your router password
    to something that will be very difficult to crack. Also, try to make your password
    as long as possible.

    - **Specify the devices authorized to connect to the network**: Configure your
    router to only allow specific `Mac` addresses to connect to the network. However,
    don’t rely on this technique alone as `Mac` spoofing is still possible.

    - **Shut the network down when unused**: Whenever a wireless network is not being
    used, make sure that it is switched off. This will limit the window of opportunity
    that hackers can use to penetrate the network.

    - **Be vigilant in W-Fi hotspots**: Most people love to use the free Wi-Fi at
    airports, cafes, hotels, and other public places. These wireless networks are
    rarely secured, so do not assume that they are.


    ## Securing the Users


    There is no greater way to secure a wireless network than educating and training
    all users. Users are not just people who connect to the network but IT personnel
    and administrators as well. It is very important to teach people how to behave
    in a way that will maintain the security of the wireless network. This user training
    and education must be a periodic endeavor.


    Let’s face it. It is not possible to completely eliminate every risk that a wireless
    network comes with. Sooner or later, a hacker will get through. However, there
    are actions that can be taken to maintain a reasonable level of general security.
    This is possible through the use of systematic risk evaluation and management
    techniques.


