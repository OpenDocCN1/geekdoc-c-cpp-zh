- fmt: '

    Do not become complacent with having one skill, for example, web development or
    programming. Becoming a great hacker will require you to be a good programmer,
    developer, security expert, and scriptwriter.


    # Chapter 14: Predicting the Future of Hacking


    It is very tough being an IT professional in today’s world. The pace at which
    technology is advancing makes current perimeter security solutions look like sieves.
    Keeping up with the ever increasing number of new threats may seem like the best
    approach, but it might actually be a better idea to just slow down instead.


    Most people assume that the biggest threats to cyber security will be posed by
    new or unknown vulnerabilities. However, experts agree that, in fact, these threats
    will emanate from well-known weaknesses. These vulnerabilities are linked to some
    of the current technologies that are gaining more acceptance, popularity, and
    use all over the world.


    Some of these current technological trends that form the future of hacking include:


    ## Cloud Computing


    As more organizations and businesses take to the cloud, hackers too are shifting
    their attention to attacking cloud computing platforms. There is an increase in
    demand for methods like penetration testing to be used to identify cloud computing
    threats before they happen. Businesses are also seeking development of countermeasures
    to prevent such attacks.


    The challenge that hacking security teams face with cloud apps is their limited
    visibility and few control options. It is understood that the cyber attacks of
    the future will occur within what is known as “Shadow Data/IT.” This is data or
    IT activities that take place on a cloud without being monitored, controlled,
    or secured. Shadow Data/IT results in the creation of new threat vectors, including
    misuse and ultimate leakage of data, and allowing malicious hackers easy access
    to a system or network.


    In order for organizations and businesses to deal with Shadow Data/IT, they will
    have to formulate corporate strategies that require employees to change the way
    they use data on a cloud. There will have to be some kind of shift in culture,
    from detection and punishment to acceptance and protection.


    It is going to be difficult for organizations to regulate employees’ cloud activities,
    but they may not have to go to such extremes. There should at least be technology
    for monitoring Shadow Data/IT on different cloud services so that visibility allows
    for reduction of risks.


    ## Mobile Devices and Platforms


    Today, almost every system or application can be accessed via any mobile device,
    platform, or browser. This has resulted in hackers shifting their attention to
    these new targets. There has been a surge in the popularity of mobile hacking
    tools in recent years.


    ## New Vulnerabilities


    Malicious hackers never tire looking for new vulnerabilities to exploit and crack
    into networks. Examples of new vulnerabilities include:


    - `Heartbleed CVE-2014-0160`

    - `Shellshock CVE-2014-6271`

    - `Poodle CVE-2014-3566`


    ## Career Opportunities for Hackers


    With all the threats rising up in today’s advancing digital world, there is concern
    that malicious hackers can attack whenever and wherever they please. This means
    that the best solution is to employ ethical hackers to constantly scout for weak
    links and develop appropriate countermeasures. This is the work of an ethical
    hacker.


    Demand is growing daily for ethical hacking professionals, whether it’s from governments
    or commercial enterprises. Anyone aspiring to be an ethical hacker needs to consider
    getting certified and becoming a professional - a Certified Ethical Hacker (CEH).
    The pay is good, averaging $15,000 to $45,000 for every assignment. The client
    environment also plays a role in remuneration. The latest edition of the ethical
    hacking certification is `CEH v9`.


    Some of the requirements include IT experience, basic knowledge of `Linux/UNIX`,
    and a good understanding of `TCP/IP`. This is definitely something to consider
    if you want to make a career out of hacking.


    # Conclusion


    It is clear to see that hacking is a topic that most people don’t really understand.
    One of the reasons for this is the media and the way it tends to dramatize hacking,
    thus causing greater misinformation and misunderstanding. Anyone who intends to
    embrace hacking must first change their mindset.


    Though hacking is portrayed as a criminal enterprise, it carries a lot of knowledge
    and great potential for beneficial use. The truth is that many, if not all, of
    the software and networks in use today have vulnerabilities that can be exploited.
    Technology is moving at a very rapid pace, and with increased profitability in
    the industry, it is inevitable that a few bad elements will try to compromise
    the systems to make some money.


    This is why ethical hackers are important. They are still hackers but they do
    it to help make the systems and networks more secure against attack. Unfortunately,
    the law is one factor that makes hacking difficult. It criminalizes hacking indiscriminately
    without realizing that there are innumerable vulnerabilities that will be exploited
    in the near future. Laws that are designed to prevent people from studying the
    systems they use in everyday life are draconian and unhelpful.


    We hope that this book has opened up your eyes to the massive potential of hacking,
    its techniques, and why it is important to learn it. As technology advances, you
    too will have to improve your skills. The knowledge that we have shared with you
    is just the starting point of a long journey. You must make the decision to continue
    learning and striving to think outside the box. Apply the knowledge in this book
    and never look back.


    Thank you for reading this book. Good luck!

    '
