    \n# 第 14 章：模板与标准模板库 (STL)\n\n模板和标准模板库 (STL) 是 C++ 的强大特性，增强了代码的可用性并提供了泛型编程。\n\n\
    ## 模板\n\nC++ 中的模板允许泛型编程，我们可以编写适用于多种类型的代码。在本章中，我们将探索模板和 STL 并学习如何利用它们。\n\n### 函数模板\n\
    \n函数模板允许我们创建处理不同类型的泛型函数。函数模板的语法包括 `template` 关键字，后面跟着尖括号 (`<>`) 中的模板参数。这里是一个示例：\n\
    \n```cpp\ntemplate <typename T>\nT add(T a, T b) {\n    return a + b;\n}\n```\n\
    \n在此示例中，我们定义了一个函数模板 `add()`，它接受两个参数并返回它们的和。`T` 是在调用函数时将要使用的类型占位符。我们可以用不同的类型调用\
    \ `add()` 函数模板，编译器会为每个类型生成相应的代码：\n\n```cpp\nint result1 = add(3, 4); // 使用 int\
    \ 类型\ndouble result2 = add(2.5, 1.5); // 使用 double 类型\n```\n\n### 类模板\n\n类模板允许我们创建处理不同类型的泛型类。类模板的语法与普通类相似，模板参数指定在尖括号\
    \ (`<>`) 中。这里是一个示例：\n\n```cpp\ntemplate <typename T>\nclass Stack {\nprivate:\n\
    \    std::vector<T> elements;\npublic:\n    void push(const T& value) {\n    \
    \    elements.push_back(value);\n    }\n    void pop() {\n        elements.pop_back();\n\
    \    }\n    T top() const {\n        return elements.back();\n    }\n    bool\
    \ empty() const {\n        return elements.empty();\n    }\n};\n```\n\n在此示例中，我们定义了一个表示栈结构的类模板\
    \ `Stack`。栈的元素存储在 `std::vector` 容器中，它是 STL 的一部分。我们可以为不同类型创建 `Stack` 类模板实例：\n\n\
    ```cpp\nStack<int> intStack;\nintStack.push(42);\n\nStack<double> doubleStack;\n\
    doubleStack.push(3.14);\n```\n\n### 模板特化\n\n模板特化允许我们为特定类型提供特化的实现。它使能够针对特定情况自定义模板的行为。这里是\
    \ `add()` 函数模板模板特化的示例：\n\n```cpp\ntemplate <>\nstd::string add(std::string a,\
    \ std::string b) {\n    return a + \" \" + b;\n}\n```\n\n在此示例中，我们为 `std::string`\
    \ 类型对 `add()` 函数模板进行了特化。特化版本在两个字符串之间插入空格并连接。\n\n## 标准模板库 (STL)\n\n标准模板库 (STL)\
    \ 是 C++ 提供的泛型数据结构和算法库。它提供了一系列容器、迭代器、算法和函数对象，使得编写高效且可重用的代码变得 way。\n\n### 容器\n\n"
- fmt: "\nThe STL provides various container classes that store collections of elements.\
    \ Some commonly used containers include:\n\n- `std::vector`: A dynamic array that\
    \ grows automatically as elements are added.\n- `std::list`: A doubly-linked list.\n\
    - `std::deque`: A double-ended queue.\n- `std::set`: A container that stores unique\
    \ elements in a sorted order.\n- `std::map`: An associative container that stores\
    \ key-value pairs.\n\n### Iterators\n\nIterators provide a way to traverse the\
    \ elements of a container. They act as generalized pointers and allow us to access\
    \ the elements sequentially. STL offers different types of iterators, including:\n\
    \n- `std::begin()` and `std::end()`: Returns iterators pointing to the beginning\
    \ and past-the-end positions of a container.\n- `std::advance()`: Moves an iterator\
    \ a specified number of positions.\n- `std::next()`: Returns the iterator that\
    \ follows a given iterator.\n- `std::prev()`: Returns the iterator that precedes\
    \ an iterator.\n\n### Algorithms\n\nSTL provides a wide range of algorithms that\
    \ operate on containers. These algorithms perform various operations, such as\
    \ searching, sorting, modifying, and manipulating elements. Some commonly used\
    \ algorithms include:\n\n- `std::sort()`: Sorts the elements of a container.\n\
    - `std::find()`: Searches for a value in a container.\n- `std::count()`: Counts\
    \ the occurrences of a value in a container.\n- `std::transform()`: Applies a\
    \ function to each element of a container.\n- `std::accumulate()`: Calculates\
    \ the sum of the elements in a container.\n\n### Function Objects\n\nFunction\
    \ objects (also known as functors) are objects that behave like functions. They\
    \ are often used as arguments to algorithms to define custom operations on elements.\
    \ Function objects can be defined as classes or by using lambda expressions.\n\
    \n```cpp\nstruct Square {\n    int operator()(int x) const {\n        return x\
    \ * x;\n    }\n};\n\nstd::vector<int> numbers = {1, 2, 3, 4, 5};\n\n// Using a\
    \ function object\nstd::transform(numbers.begin(), numbers.end(), numbers.begin(),\
    \ Square());\n\n// Using a lambda expression\nstd::transform(numbers.begin(),\
    \ numbers.end(), numbers.begin(), [](int x) { return x * x; });\n```\n\nIn this\
    \ example, we define a function object `Square` that squares an integer. We then\
    \ use the `std::transform()` algorithm to apply the `Square` function object to\
    \ each element of the `numbers` vector. Alternatively, we can use a lambda expression\
    \ to achieve the same result.\n\n## Conclusion\n\nTemplates and the Standard Template\
    \ Library (STL) are powerful features of C++ that promote code reusability, generic\
    \ programming, and efficient algorithms. Templates allow us to create generic\
    \ functions and classes that can operate on multiple types. The STL provides a\
    \ collection of containers, iterators, algorithms, and function objects, making\
    \ it easier to write efficient and reusable code.\n\nIn this chapter, we explored\
    \ function templates, class templates, template specialization, and the key components\
    \ of the STL. We also touched upon containers, iterators, algorithms, and function\
    \ objects provided by the STL.\n\nBy leveraging templates and the STL, we can\
    \ write generic, efficient, and reusable code in C++. They are essential tools\
    \ for modern C++ development.\n\n# Chapter 15: Advanced Topics in C++ Programming\n\
    \nIn this final chapter, we will explore some advanced topics in C++ programming\
    \ that can further enhance our skills and allow us to write more efficient and\
    \ sophisticated code. We will delve into topics such as smart pointers, multithreading,\
    \ lambda expressions, and move semantics.\n\n## Smart Pointers\n\nSmart pointers\
    \ are a powerful feature of C++ that provide automatic memory management, reducing\
    \ the risk of memory leaks and dangling pointers. They are objects that act like\
    \ pointers but have additional capabilities, such as automatic deallocation of\
    \ memory when it is no longer needed.\n\nC++ provides three types of smart pointers:\n\
    \n- `std::unique_ptr`: Represents exclusive ownership of a dynamically allocated\
    \ object. It ensures that only one `std::unique_ptr` can own the object, and when\
    \ the owner is destroyed, the object is automatically deleted.\n- `std::shared_ptr`:\
    \ Represents shared ownership of a dynamically allocated object. It allows multiple\
    \ `std::shared_ptr` objects to point to the same object, and the object is deleted\
    \ only when the last `std::shared_ptr` owning it is destroyed.\n- `std::weak_ptr`:\
    \ Represents a non-owning reference to an object managed by a `std::shared_ptr`.\
    \ It allows accessing the object without affecting its reference count.\n\nHere's\
    \ an example that demonstrates the usage of `std::unique_ptr`:\n\n```cpp\n#include\
    \ <memory>\nclass MyClass {\npublic:\n    void someFunction() {\n        // Function\
    \ body\n    }\n};\n\nint main() {\n    std::unique_ptr<MyClass> ptr(new MyClass());\n\
    \    ptr->someFunction();\n    return 0;\n}\n```\n\nIn this example, we create\
    \ a `std::unique_ptr` named `ptr` that owns a dynamically allocated `MyClass`\
    \ object. We can access the object's member function using the arrow (`->`) operator.\n\
    \n## Multithreading\n\nMultithreading is the ability of a program to execute multiple\
    \ threads concurrently. It allows tasks to run in parallel and can greatly improve\
    \ performance and responsiveness in certain scenarios. C++ provides a multithreading\
    \ library that supports concurrent execution of threads.\n\nHere's an example\
    \ that demonstrates the usage of threads in C++:\n\n```cpp\n#include <iostream>\n\
    #include <thread>\nvoid threadFunction() {\n    // Function body\n    std::cout\
    \ << \"Hello from thread!\" << std::endl;\n}\n\nint main() {\n    std::thread\
    \ t(threadFunction);\n    // Main thread continues\n    t.join(); // Wait for\
    \ the thread\n    return 0;\n}\n```\n\nIn this example, we define a function `threadFunction()`\
    \ that represents the code to be executed in a separate thread. We create a `std::thread`\
    \ object `t` that executes `threadFunction()`. The main thread continues execution.\
    \ We use `t.join()` to wait for the thread to finish.\n\n## Lambda Expressions\n\
    \nLambda expressions are a concise way to define anonymous functions in C++. They\
    \ allow us to create functions on the fly without explicitly defining a named\
    \ function. Lambda expressions are particularly useful when working with algorithms\
    \ or in situations where a function needs to be passed as an argument.\n\nHere's\
    \ an example that demonstrates the usage of lambda expressions:\n\n```cpp\n#include\
    \ <iostream>\n#include <vector>\n#include <algorithm>\nint main() {\n    std::vector<int>\
    \ numbers = {1, 2, 3, 4, 5};\n    int count = std::count_if(numbers.begin(), numbers.end(),\
    \ [](int x) {\n        return x % 2 == 0;\n    });\n    std::cout << \"Count:\
    \ \" << count << std::endl;\n    return 0;\n}\n```\n\nIn this example, we use\
    \ a lambda expression as the third argument to the `std::count_if()` algorithm.\
    \ The lambda expression checks if a number is even (`x % 2 == 0`) and returns\
    \ `true` or `false` accordingly. The `std::count_if()` algorithm counts the number\
    \ of elements that satisfy the condition.\n\n## Move Semantics\n\nMove semantics\
    \ is a feature introduced in C++11 that allows for the efficient transfer of resources\
    \ (such as memory) from one object to another without unnecessary copying. Move\
    \ semantics are particularly useful when working with large objects or when performance\
    \ optimization is crucial.\n\nMove semantics are enabled by the use of move constructors\
    \ and move assignment operators. A move constructor is a special constructor that\
    \ takes an rvalue reference (`T&&`) and efficiently transfers the resources from\
    \ the source object to the new object. A move assignment operator is a special\
    \ assignment operator that performs a similar resource transfer.\n"
  raw: 'The STL provides various container classes that store collections of elements.
    Some commonly used containers include:


    - `std::vector`: A dynamic array that grows automatically as elements are added.


    - `std::list`: A doubly-linked list.


    - `std::deque`: A double-ended queue.


    - `std::set`: A container that stores unique elements in a sorted order.


    - `std::map`: An associative container that stores key-value pairs.


    ### Iterators


    Iterators provide a way to traverse the elements of a container. They act as generalized
    pointers and allow us to access the elements sequentially. STL offers different
    types of iterators, including:


    - `std::begin()` and `std::end()`: Returns iterators pointing to the beginning
    and past-the-end positions of a container.


    - `std::advance()`: Moves an iterator a specified number of positions.


    - `std::next()`: Returns the iterator that follows a given iterator.


    - `std::prev()`: Returns the iterator that precedes a given iterator.


    ### Algorithms


    STL provides a wide range of algorithms that operate on containers. These algorithms
    perform various operations, such as searching, sorting, modifying, and manipulating
    elements. Some commonly used algorithms include:


    - `std::sort()`: Sorts the elements of a container.


    - `std::find()`: Searches for a value in a container.


    - `std::count()`: Counts the occurrences of a value in a container.


    - `std::transform()`: Applies a function to each element of a container.


    - `std::accumulate()`: Calculates the sum of the elements in a container.


    ### Function Objects


    Function objects (also known as functors) are objects that behave like functions.
    They are often used as arguments to algorithms to define custom operations on
    elements. Function objects can be defined as classes or by using lambda expressions.


    ```cpp


    struct Square {


    int operator()(int x) const {


    return x * x;


    }


    };


    std::vector<int> numbers = {1, 2, 3, 4, 5};


    // Using a function object


    std::transform(numbers.begin(), numbers.end(), numbers.begin(), Square());


    // Using a lambda expression


    std::transform(numbers.begin(), numbers.end(), numbers.begin(), [](int x) { return
    x * x; });


    ```


    In this example, we define a function object `Square` that squares an integer.
    We then use the `std::transform()` algorithm to apply the `Square` function object
    to each element of the `numbers` vector. Alternatively, we can use a lambda expression
    to achieve the same result.


    ## Conclusion


    Templates and the Standard Template Library (STL) are powerful features of C++
    that promote code reusability, generic programming, and efficient algorithms.
    Templates allow us to create generic functions and classes that can operate on
    multiple types. The STL provides a collection of containers, iterators, algorithms,
    and function objects, making it easier to write efficient and reusable code.


    In this chapter, we explored function templates, class templates, template specialization,
    and the key components of the STL. We also touched upon containers, iterators,
    algorithms, and function objects provided by the STL.


    By leveraging templates and the STL, we can write generic, efficient, and reusable
    code in C++. They are essential tools for modern C++ development.


    # Chapter 15: Advanced Topics in C++ Programming


    In this final chapter, we will explore some advanced topics in C++ programming
    that can further enhance our skills and allow us to write more efficient and sophisticated
    code. We will delve into topics such as smart pointers, multithreading, lambda
    expressions, and move semantics.


    ## Smart Pointers


    Smart pointers are a powerful feature of C++ that provide automatic memory management,
    reducing the risk of memory leaks and dangling pointers. They are objects that
    act like pointers but have additional capabilities, such as automatic deallocation
    of memory when it is no longer needed.


    C++ provides three types of smart pointers:


    - `std::unique_ptr`: Represents exclusive ownership of a dynamically allocated
    object. It ensures that only one `std::unique_ptr` can own the object, and when
    the owner is destroyed, the object is automatically deleted.


    - `std::shared_ptr`: Represents shared ownership of a dynamically allocated object.
    It allows multiple `std::shared_ptr` objects to point to the same object, and
    the object is deleted only when the last `std::shared_ptr` owning it is destroyed.


    - `std::weak_ptr`: Represents a non-owning reference to an object managed by a
    `std::shared_ptr`. It allows accessing the object without affecting its reference
    count.


    Here''s an example that demonstrates the usage of `std::unique_ptr`:


    ```cpp


    #include <memory>


    class MyClass {


    public:


    void someFunction() {


    // Function body


    }


    };


    int main() {


    std::unique_ptr<MyClass> ptr(new MyClass());


    ptr->someFunction();


    return 0;


    }


    ```


    In this example, we create a `std::unique_ptr` named `ptr` that owns a dynamically
    allocated `MyClass` object. We can access the object''s member function using
    the arrow (`->`) operator.


    ## Multithreading


    Multithreading is the ability of a program to execute multiple threads concurrently.
    It allows tasks to run in parallel and can greatly improve performance and responsiveness
    in certain scenarios. C++ provides a multithreading library that supports concurrent
    execution of threads.


    Here''s an example that demonstrates the usage of threads in C++:


    ```cpp


    #include <iostream>


    #include <thread>


    void threadFunction() {


    // Function body


    std::cout << "Hello from thread!" << std::endl;


    }


    int main() {


    std::thread t(threadFunction);


    // Main thread continues execution


    t.join(); // Wait for the thread to finish


    return 0;


    }


    ```


    In this example, we define a function `threadFunction()` that represents the code
    to be executed in a separate thread. We create a `std::thread` object `t` that
    executes the `threadFunction()`. The main thread continues its execution while
    the new thread runs concurrently. We use `t.join()` to wait for the thread to
    finish before exiting the program.


    ## Lambda Expressions


    Lambda expressions are a concise way to define anonymous functions in C++. They
    allow us to create functions on the fly without explicitly defining a named function.
    Lambda expressions are particularly useful when working with algorithms or in
    situations where a function needs to be passed as an argument.


    Here''s an example that demonstrates the usage of lambda expressions:


    ```cpp


    #include <iostream>


    #include <vector>


    #include <algorithm>


    int main() {


    std::vector<int> numbers = {1, 2, 3, 4, 5};


    int count = std::count_if(numbers.begin(), numbers.end(), [](int x) {


    return x % 2 == 0;


    });


    std::cout << "Count: " << count << std::endl;


    return 0;


    }


    ```


    In this example, we use a lambda expression as the third argument to the `std::count_if()`
    algorithm. The lambda expression checks if a number is even (`x % 2 == 0`) and
    returns `true` or `false` accordingly. The `std::count_if()` algorithm counts
    the number of elements that satisfy the condition.


    ## Move Semantics


    Move semantics is a feature introduced in C++11 that allows for the efficient
    transfer of resources (such as memory) from one object to another without unnecessary
    copying. Move semantics are particularly useful when working with large objects
    or when performance optimization is crucial.


    Move semantics are enabled by the use of move constructors and move assignment
    operators. A move constructor is a special constructor that takes an rvalue reference
    (`T&&`) and efficiently transfers the resources from the source object to the
    new object. A move assignment operator is a special assignment operator that performs
    a similar resource transfer.


