    \ int h) : Shape(w, h) {\n        // 构造函数体\n    }\n};\n```\n\n在此示例中，我们有一个基类 `Shape`，它具有\
    \ `width` 和 `height` 属性以及 `calculateArea()` 方法。派生类 `Rectangle` 使用 `public` 访问限定符自\
    \ `Shape`。`Rectangle` 的构造函数通过初始化列表调用了 `Shape` 的构造函数。\n\n### 继承中的访问限定符\n\n继承引入了三个访问限定符：`public`、`protected`\
    \ 和 `private`。这些限定符决定了被继承成员在派生类中的可见性：\n\n- `public`：被继承的成员在派生类中作为公共成员访问。\n- `protected`：被继承的成员在派生类中作为保护成员访问。\n\
    - `private`：被继承的成员在派生类中不可访问。\n\n访问限定符的选择取决于所需的封装和数据隐藏深度。\n\n## 多态\n\n多态是不同类的对象可以被视为同一公共基类对象的能力。它允许我们编写无需知道对象具体类型即可处理不同类型对象的代码。\n\
    \n### 指向基类的指针和引用\n\n多态通常通过指向基类的指针或引用实现。这是一个示例：\n\n```cpp\nShape* shapePtr;\nShape&\
    \ shapeRef;\nRectangle rect(5, 3);\nCircle circle(4);\nshapePtr = &rect;\nshapeRef\
    \ = circle;\nint area = shapePtr->calculateArea();\n```\n\n在此示例中，我们声明了类型为 `Shape`\
    \ 的指针 `shapePtr` 和引用 `shapeRef`。我们创建了 `rect` 和 `circle` 对象。将 `rect` 的地址赋给 `shapePtr`，将\
    \ `circle` 赋给 `shapeRef`。通过 `shapePtr` 调用 `calculateArea()`。\n\n### 虚函数\n\n为了实现多态，我们在基类中使用虚函数。虚函数在基类中使用\
    \ `virtual` 关键字声明，并可以在派生类中重写。这是一个示例：\n\n```cpp\nclass Shape {\npublic:\n    virtual\
    \ int calculateArea() {\n        return 0;\n    }\n};\n\nclass Rectangle : public\
    \ Shape {\npublic:\n    int calculateArea() override {\n        return width *\
    \ height;\n    }\n};\n\nclass Circle : public Shape {\npublic:\n    int calculateArea()\
    \ override {\n        return 3.14 * radius * radius;\n    }\n};\n```\n\n在此示例中，`Shape`\
    \ 类声明了一个虚函数 `calculateArea()`。派生类 `Rectangle` 和 `Circle` 重写了该方法。通过基类的指针或引用调用方法时，将调用相应的派生类实现。\n\
    \n### 纯虚函数\n\n纯虚函数是指在基类中没有实现的虚函数。它使用 `virtual` 关键字后跟 `= 0` 来声明。纯虚函数使基类变成抽象类，派生类必须重写它们。\n\
    \n```cpp\nclass Shape {\npublic:\n    virtual int calculateArea() = 0;\n};\n```\n\
    \n在此示例中，`Shape` 类声明了一个纯虚函数 `calculateArea()`。由于它没有实现，我们无法创建 `Shape`类的对象。但我们可以创建派生类的对象并使用它们的特定实现。\n\
    \n## 结论\n\n继承和多态是面向对象编程的强大特性。继承允许我们基于现有类创建新类，促进了代码重用和扩展。多态允许不同类型的对象被被视为公共基类对象，提供了灵活性和抽象性。\n\
    \n"
