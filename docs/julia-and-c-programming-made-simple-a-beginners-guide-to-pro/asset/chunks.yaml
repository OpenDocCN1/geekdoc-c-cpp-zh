    # 第 11 章：Julia 中的面向对象编程


    在本章中，我们将探索 Julia 中的面向对象编程 (OOP)。OOP 是一种强大的编程范式，允许我们围绕对象及其相互作用来组织代码。我们将涵盖 Julia
    中 OOP 的核心概念，包括类、对象、继承和多态。通过实际示例，你将深入理解如何在 Julia 中实现 OOP 原则。


    ## 11.1 类和对象


    在 Julia 中，类充当创建对象的蓝图。类定义了该类对象可以展示的属性和行为。这里是一个简单的类定义示例：


    ```julia

    abstract type Shape end


    struct Circle <: Shape

    radius::Float64

    end


    struct Rectangle <: Shape

    width::Float64

    height::Float64

    end

    ```


    在这个示例中，我们定义了一个抽象类型 `Shape` 以及两个继承自 `Shape` 的具体类型 `Circle` 和 `Rectangle`。`Circle`
    结构体有一个属性 `radius`，而 `Rectangle` 结构体有 `width` 和 `height` 属性。


    要创建这些类的对象，我们可以使用 `new` 函数：


    ```julia

    circle = Circle(5.0)

    rectangle = Rectangle(10.0, 8.0)

    ```


    在这里，我们创建了一个半径为 `5.0` 的 `Circle` 对象和一个宽度为 `10.0`、高度为 `8.0` 的 `Rectangle` 对象。


    ## 11.2 方法和函数


    Julia 中的方法是与特定类型或类关联的函数。它们定义了该类型对象可以执行的行为或操作。这里有一个示例：


    ```julia

    function area(shape::Shape)

    if shape isa Circle

    return π * shape.radius²

    elseif shape isa Rectangle

    return shape.width * shape.height

    end

    end

    ```


    在这个示例中，我们定义了一个 `area` 函数，它接受一个 `Shape` 对象作为参数。根据对象的类型（`Circle` 或 `Rectangle`），相应地计算并返回面积。


    ## 11.3 继承


    继承是 OOP 中的基本概念，允许类从其他类继承属性和行为。在 Julia 中，我们可以使用 `<:` 运算符来实现继承。这里有一个示例：


    ```julia

    abstract type Animal end


    struct Dog <: Animal

    name::String

    end


    struct Cat <: Animal

    name::String

    end


    function speak(animal::Animal)

    if animal isa Dog

    println("The dog named $(animal.name) says woof!")

    elseif animal isa Cat

    println("The cat named $(animal.name) says meow!")

    end

    end

    ```


    在这个示例中，我们定义了一个抽象类型 `Animal` 以及两个继承自 `Animal` 的具体类型 `Dog` 和 `Cat`。我们还定义了一个 `speak`
    函数，它接受一个 `Animal` 对象作为参数，并根据对象的类型打印消息。


    ## 11.4 多态


    多态允许不同类型的对象以相同的方式做出响应。在 Julia 中，我们可以通过方法分发来实现这一点。这里有一个示例：


    ```julia

    function area(shape::Shape)

    if shape isa Circle

    return π * shape.radius²

    elseif shape isa Rectangle

    return shape.width * shape.height

    end

    end

    ```

