    # Chapter 5: Control Flow and Decision Making


    In Chapter 4, we explored operators and expressions in C++. In this chapter, we
    will delve into control flow and decision-making structures. Control flow allows
    us to determine the order in which statements are executed, while decision-making
    structures enable us to make choices and execute different blocks of code based
    on certain conditions.


    ## Conditional Statements: If-Else


    Conditional statements in C++ allow us to execute specific blocks of code based
    on certain conditions. The most commonly used conditional statement is the "if-else"
    statement. Here''s the basic syntax:


    ```cpp


    if (condition) {


    // Code to be executed if the condition is true


    } else {


    // Code to be executed if the condition is false


    }


    ```


    Let''s see an example:


    ```cpp


    #include <iostream>


    int main() {


    int age;


    std::cout << "Enter your age: ";


    std::cin >> age;


    if (age >= 18) {


    std::cout << "You are eligible to vote." << std::endl;


    } else {


    std::cout << "You are not eligible to vote." << std::endl;


    }


    return 0;


    }


    ```


    In the above code, the user''s age is stored in the `age` variable. The `if-else`
    statement checks if the age is greater than or equal to 18\. If the condition
    is true, the message "You are eligible to vote" is displayed. Otherwise, the message
    "You are not eligible to vote" is displayed.


    Conditional statements can also be nested, allowing for more complex decision-making.
    Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    int score;


    std::cout << "Enter your score: ";


    std::cin >> score;


    if (score >= 90) {


    std::cout << "Excellent!" << std::endl;


    } else if (score >= 70) {


    std::cout << "Good job!" << std::endl;


    } else if (score >= 50) {


    std::cout << "You passed." << std::endl;


    } else {


    std::cout << "You failed." << std::endl;


    }


    return 0;


    }


    ```


    In this example, the program asks the user for their score. Based on the score,
    different messages are displayed. If the score is 90 or above, the message "Excellent!"
    is displayed. If the score is between 70 and 89, the message "Good job!" is displayed.
    If the score is between 50 and 69, the message "You passed." is displayed. Otherwise,
    if the score is below 50, the message "You failed." is displayed.


    ## Loops: While and For


    Loops in C++ allow us to repeat a block of code multiple times. There are two
    commonly used loop structures: `while` and `for`.


    ### While Loop


    The `while` loop repeatedly executes a block of code as long as a specified condition
    is true. Here''s the basic syntax:


    ```cpp


    while (condition) {


    // Code to be executed


    }


    ```


    Let''s see an example:


    ```cpp


    #include <iostream>


    int main() {


    int count = 0;


    while (count < 5) {


    std::cout << "Count: " << count << std::endl;


    count++;


    }


    return 0;


    }


    ```


    In this example, the `while` loop executes the code inside the block as long as
    the `count` variable is less than 5\. The value of `count` is displayed, and then
    it is incremented by 1\. This process repeats until the condition becomes false.


    ### For Loop


    The `for` loop is another type of loop that allows us to iterate over a range
    of values or perform a specific number of iterations. Here''s the basic syntax:


    ```cpp


    for (initialization; condition; increment/decrement) {


    // Code to be executed


    }


    ```


    Let''s see an example:


    ```cpp


    #include <iostream>


    int main() {


    for (int i = 0; i < 5; i++) {


    std::cout << "Count: " << i << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `for` loop initializes the `i` variable to 0\. It then checks
    if `i` is less than 5\. If the condition is true, the code inside the block is
    executed, and then `i` is incremented by 1\. This process repeats until the condition
    becomes false.


    ## Control Flow Statements: Break and Continue


    In addition to conditional statements and loops, control flow statements such
    as `break` and `continue` provide additional control over the flow of execution
    within loops.


    The `break` statement is used to terminate the current loop and continue with
    the next statement outside the loop. It can be useful for prematurely exiting
    a loop under certain conditions. Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    for (int i = 0; i < 5; i++) {


    if (i == 3) {


    break;


    }


    std::cout << "Count: " << i << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `for` loop iterates over the values of `i` from 0 to 4\.
    However, when `i` becomes 3, the `break` statement is encountered, terminating
    the loop. As a result, only the counts 0, 1, and 2 are displayed.


    The `continue` statement is used to skip the rest of the current iteration and
    continue with the next iteration of the loop. It is useful when we want to skip
    certain iterations based on specific conditions. Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    for (int i = 0; i < 5; i++) {


    if (i == 2) {


    continue;


    }


    std::cout << "Count: " << i << std::endl;


    }


    return 0;


    }


    ```


    In this example, when `i` becomes 2, the `continue` statement is encountered,
    skipping the code below it for that iteration. As a result, the count 2 is skipped,
    and the remaining counts 0, 1, 3, and 4 are displayed.


    ## Conclusion


    In this chapter, we explored control flow and decision-making structures in C++.
    We learned about conditional statements such as the `if-else` statement, which
    allows us to execute different blocks of code based on certain conditions. We
    also explored loops, including the `while` loop for repeating a block of code
    as long as a condition is true, and the `for` loop for iterating over a range
    of values or performing a specific number of iterations.


    Additionally, we covered control flow statements such


    as `break` and `continue`, which provide additional control over the flow of execution
    within loops. These statements allow us to terminate a loop prematurely or skip
    certain iterations based on specific conditions.


    By understanding and utilizing control flow and decision-making structures, you
    can create more dynamic and interactive programs in C++. You can control the flow
    of execution, make decisions based on user input or other conditions, and repeat
    code as needed.


    # Chapter 6: Arrays and Strings


    In Chapter 5, we explored control flow and decision-making structures in C++.
    In this chapter, we will delve into arrays and strings, two fundamental concepts
    that allow us to work with collections of elements efficiently.


    ## Arrays


    An array is a data structure that allows us to store multiple elements of the
    same data type in a contiguous memory block. Each element in an array is accessed
    using an index, which represents its position within the array. Arrays provide
    a convenient way to work with a collection of related data.


    ### Declaring and Accessing Arrays


    To declare an array in C++, we specify the data type of the elements followed
    by the array name and the size of the array in square brackets. Here''s an example:


    ```cpp


    int numbers[5];     // Declaration of an integer array named ''numbers'' with
    a size of 5


    ```'
