    It can span multiple lines.


    """


    ```


    In these examples, we create strings `name`, `message`, and `multiline_string`
    using different ways of string delimiters.


    ## 8.2 String Concatenation


    String concatenation is the process of combining multiple strings into a single
    string. In Julia, you can use the `*` operator or the `string` function for concatenation.
    Here are some examples:


    ```julia


    first_name = "John"


    last_name = "Doe"


    full_name = first_name * " " * last_name  # "John Doe"


    full_name_string = string(first_name, " ", last_name)  # "John Doe"


    ```


    In these examples, we concatenate the `first_name` and `last_name` strings using
    both the `*` operator and the `string` function.


