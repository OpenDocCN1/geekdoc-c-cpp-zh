    to the appropriate `catch` block based on the type of the thrown exception.


    ## Handling Standard Exceptions


    C++ provides a set of standard exception classes that represent common types of
    exceptions. These classes are defined in the `<stdexcept>` header. Here are some
    commonly used standard exception classes:


    - `std::exception`: The base class for all standard exceptions. It provides a
    `what()` method that returns a descriptive error message.


    - `std::runtime_error`: Represents errors that occur during runtime, such as logical
    errors or resource failures.


    - `std::logic_error`: Represents errors that occur due to logical mistakes in
    the code, such as invalid arguments or incorrect use of functions.


    - `std::out_of_range`: Represents errors that occur when accessing elements beyond
    the valid range, such as an index out of bounds.


    Here''s an example that demonstrates exception handling using a standard exception:


    ```cpp


    #include <iostream>


    #include <stdexcept>


    int divide(int a, int b) {


    if (b == 0) {


    throw std::runtime_error("Division by zero!");


    }


    return a / b;


    }


    int main() {


    try {


    int result = divide(10, 0);


    std::cout << "Result: " << result << std::endl;


    } catch (const std::exception& ex) {


    std::cout << "Exception caught: " << ex.what() << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `divide()` function divides two numbers. If the divisor (`b`)
    is zero, a `std::runtime_error` exception is thrown. In the `main()` function,
    we use a `try` block to catch any exceptions of type `std::exception` or its derived
    classes. The caught exception is then handled in the `catch` block, where we print
    the error message using the `what()` method.


    ## Creating Custom Exceptions


    Apart from using standard exceptions, we can also create our own custom exception
    classes by deriving them from `std::exception` or its derived classes. Custom
    exceptions allow us to represent application-specific errors and provide additional
    information about the exceptional condition.


    Here''s an example that demonstrates the creation and usage of a custom exception:


    ```cpp


    #include <iostream>


    #include <stdexcept>


    class MyException : public std::exception {


    public:


    const char* what() const noexcept override {


    return "Custom Exception: Something went wrong!";


    }


    };


    void process() {


    throw MyException();


    }


    int main() {


    try {


    process();


    } catch (const std::exception& ex) {


    std::cout << "Exception caught: " << ex.what() << std::endl;


    }


    return 0;


    }


    ```


    In this example, we define a custom exception class `MyException` derived from
    `std::exception`. We override the `what()` method to provide a custom error message.
    The `process()` function throws an instance of `MyException`. In the `main()`
    function, we catch any exceptions of type `std::exception` or its derived classes
    and handle them accordingly.


    ## Exception Handling Best Practices


    Here are some best practices to keep in mind when working with exception handling
    in C++:


    - Catch specific exceptions: Catch specific types of exceptions to handle them
    appropriately. This allows for targeted error handling and better control over
    the program flow.


    - Catch exceptions by reference: Catch exceptions by reference (`const std::exception&`)
    to ensure proper object destruction and avoid object slicing.


    - Handle exceptions at an appropriate level: Handle exceptions at a level where
    the program can effectively recover from errors or take necessary actions. Avoid
    catching exceptions too early or too late in the program.


    - Use exception specifications sparingly: Exception specifications (`throw()`
    or `noexcept`) restrict the types of exceptions that a function can throw. However,
    they are generally discouraged in modern C++ as they can interfere with flexibility
    and error reporting.


    - Cleanup resources: When exceptions occur, make sure to clean up any acquired
    resources (e.g., memory, file handles) to avoid resource leaks.


    ## Conclusion


    Exception handling is a powerful mechanism in C++ that allows us to handle and
    recover from unexpected situations or errors during program execution. By using
    `try`, `catch`, and `throw` statements, we can create robust and fault-tolerant
    programs.


    In this chapter, we explored the basics of exception handling, including throwing
    exceptions, catching exceptions, and handling standard exceptions. We also learned
    how to create custom exceptions to represent application-specific errors. By following
    best practices, we can effectively handle exceptions and build more reliable software.


    # Chapter 14: Templates and Standard Template Library (STL)


    Templates and the Standard Template Library (STL) are powerful features of C++
    that enhance code reusability and provide a collection of useful data structures
    and algorithms. In this chapter, we will explore templates and the STL and learn
    how to leverage them in our programs.


    ## Templates


    Templates in C++ allow for generic programming, where we can write code that works
    with different data types without duplicating the code for each type. Templates
    provide a way to define classes or functions that can operate on multiple types,
    known as template parameters.


    ### Function Templates


    Function templates allow us to create generic functions that can operate on different
    types. The syntax for a function template includes the `template` keyword followed
    by the template parameter(s) in angle brackets (`<>`). Here''s an example:


    ```cpp


    template <typename T>


    T add(T a, T b) {


    return a + b;


    }


    ```


    In this example, we define a function template `add()` that takes two arguments
    of type `T` and returns their sum. The `T` is a placeholder for the actual type
    that will be used when the function is called.


    We can call the `add()` function template with different types, and the compiler
    generates the appropriate code for each type:


    ```cpp


    int result1 = add(3, 4);        // Calling add() with int arguments


    double result2 = add(2.5, 1.5); // Calling add() with double arguments


    ```


    ### Class Templates


    Class templates allow us to create generic classes that can work with different
    types. The syntax for a class template is similar to that of a regular class,
    with the template parameter(s) specified in angle brackets (`<>`). Here''s an
    example:


    ```cpp


    template <typename T>


    class Stack {


    private:


    std::vector<T> elements;


    public:


    void push(const T& value) {


    elements.push_back(value);


    }


    void pop() {


    elements.pop_back();


    }


    T top() const {


    return elements.back();


    }


    bool empty() const {


    return elements.empty();


    }


    };


    ```


    In this example, we define a class template `Stack` that represents a stack data
    structure. The elements of the stack are stored in a `std::vector` container,
    which is a part of the STL.


    We can create instances of the `Stack` class template for different types:


    ```cpp


    Stack<int> intStack;       // Stack of integers


    Stack<double> doubleStack; // Stack of doubles


    intStack.push(42);


    doubleStack.push(3.14);


    ```


    ### Template Specialization


    Template specialization allows us to provide a specialized implementation for
    specific types. It enables us to customize the behavior of a template for specific
    cases. Here''s an example of template specialization for the `add()` function
    template:


    ```cpp


    template <>


    std::string add(std::string a, std::string b) {


    return a + " " + b;


    }


    ```


    In this example, we specialize the `add()` function template for the `std::string`
    type. The specialized version concatenates two strings with a space in between.


    ## Standard Template Library (STL)


    The Standard Template Library (STL) is a library of generic data structures and
    algorithms provided by C++. It offers a collection of containers, iterators, algorithms,
    and function objects, making it easier to write efficient and reusable code.


