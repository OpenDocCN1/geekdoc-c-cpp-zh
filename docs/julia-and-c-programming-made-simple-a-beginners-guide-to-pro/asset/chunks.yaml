    \ 算法统计满足元素的数量。\n\n## 移动语义\n\n移动语义是 C++11 引入的一项特性，允许从一个对象到另一个高效传输资源（如内存），而不需要额外的复制。移动语义在处理大型对象或性能优化至关重要时特别有用。\n\
