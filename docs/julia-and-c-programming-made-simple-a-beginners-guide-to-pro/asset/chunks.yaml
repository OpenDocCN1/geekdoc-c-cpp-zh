    # Chapter 10: Classes and Objects


    In Chapter 9, we delved into object-oriented programming (OOP) concepts in C++.
    In this chapter, we will explore classes and objects in more detail. Classes are
    the fundamental building blocks of OOP, while objects are instances of classes.
    Understanding classes and objects is crucial for creating robust and organized
    code.


    ## Classes


    A class is a blueprint or template that defines the properties (attributes) and
    behaviors (methods) of objects. It encapsulates data and related functionality
    into a single unit. Classes provide a way to represent real-world entities or
    abstract concepts in our programs.


    ### Class Declaration and Definition


    To declare a class in C++, we use the `class` keyword followed by the class name.
    Here''s an example:


    ```cpp


    class Rectangle {


    // Class members


    };


    ```


    To define a class, we provide the implementation of its members within the class
    declaration. Members can include attributes (data members) and methods (member
    functions). Here''s an example:


    ```cpp


    class Rectangle {


    public:


    // Attributes


    double length;


    double width;


    // Methods


    double calculateArea() {


    return length * width;


    }


    };


    ```


    In this example, we define a class named `Rectangle`. It has two attributes, `length`
    and `width`, and a method called `calculateArea()` that calculates the area of
    the rectangle.


    ### Objects


    An object is an instance of a class. It represents a specific entity or concept
    defined by the class. Objects have their own state (attribute values) and behavior
    (method executions). We create objects based on the class blueprint to work with
    specific instances of the class.


    ### Creating Objects


    To create objects of a class, we use the class name followed by the object name
    and optional parentheses. Here''s an example:


    ```cpp


    Rectangle rect1;    // Creating an object of the Rectangle class


    ```


    In this example, we create an object named `rect1` of the `Rectangle` class.


    ### Accessing Class Members


    To access the members (attributes and methods) of an object, we use the dot (.)
    operator. Here''s an example:


    ```cpp


    Rectangle rect1;


    rect1.length = 5.0;    // Accessing and assigning a value to the ''length'' attribute


    rect1.width = 3.0;     // Accessing and assigning a value to the ''width'' attribute


    double area = rect1.calculateArea();    // Accessing and calling the ''calculateArea''
    method


    std::cout << "Area: " << area << std::endl;


    ```


    In this example, we access the attributes of the `rect1` object using the dot
    operator and assign values to them. We also call the `calculateArea()` method
    to calculate the area of the rectangle.


    ### Constructors and Destructors


    Constructors and destructors are special member functions of a class that are
    automatically called when objects are created and destroyed, respectively.


    A constructor is used to initialize the object''s attributes and perform any necessary
    setup. It has the same name as the class and is declared without a return type.
    Here''s an example:


    ```cpp


    class Rectangle {


    public:


    double length;


    double width;


    // Constructor


    Rectangle(double len, double wid) {


    length = len;


    width = wid;


    }


    };


    ```


    In this example, we define a constructor for the `Rectangle` class that takes
    two parameters, `len` and `wid`, to initialize the `length` and `width` attributes.


    A destructor is used to clean up resources and perform any necessary finalization
    before an object is destroyed. It has the same name as the class preceded by a
    tilde (~) and is declared without parameters. Here''s an example:


    ```cpp


    class Rectangle {


    public:


    double length;


    double width;


    // Constructor


    Rectangle(double len, double wid) {


    length = len;


    width = wid;


    }


    // Destructor


    ~Rectangle() {


    // Cleanup code here


    }


    };


    ```


    In this example, we add a destructor to the `Rectangle` class. The destructor
    can be used to release any dynamically allocated memory or perform any other cleanup
    tasks.


    ### Encapsulation and Data Hiding


    Encapsulation is a key principle of OOP that involves bundling data and related
    functionality into a single unit (a class). It allows for data hiding, where the
    internal details of a class are kept hidden from external access. Access to the
    data is controlled through methods, such as getters and setters.


    Here''s an example that demonstrates encapsulation and data hiding:


    ```cpp


    class BankAccount {


    private:


    std::string accountNumber;


    double balance;


    public:


    // Getter for accountNumber


    std::string getAccountNumber() {


    return accountNumber;


    }


    // Setter for balance


    void setBalance(double amount) {


    if (amount >= 0) {


    balance = amount;


    }


    }


    };


    ```'
