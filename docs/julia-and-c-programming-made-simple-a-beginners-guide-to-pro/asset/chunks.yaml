    \ {\npublic:\n    double length;\n    double width;\n    // 构造函数\n    Rectangle(double\
    \ len, double wid) {\n        length = len;\n        width = wid;\n    }\n};\n\
    ```\n\n在这个示例中，我们为 `Rectangle` 类定义了一个构造函数，它接受两个参数 `len` 和 `wid`，以初始化 `length` 和\
    \ `width` 属性。\n\n析构函数用于在对象销毁之前清理资源并执行任何必要的最终工作。它与类名相同，但前面有一个波浪号（`~`），且声明时不带参数。这是一个示例：\n\
    \n```cpp\nclass Rectangle {\npublic:\n    double length;\n    double width;\n\
    \    // 构造函数\n    Rectangle(double len, double wid) {\n        length = len;\n\
    \        width = wid;\n    }\n    // 析构函数\n    ~Rectangle() {\n        // 在此处清理代码\n\
    \    }\n};\n```\n\n在这个示例中，我们为 `Rectangle` 类添加了一个析构函数。析构函数可以释放任何动态分配的内存或执行其他清理任务。\n\
    \n### 封装与数据隐藏\n\n封装是 OOP 的核心原则，涉及将数据和相关功能封装在一个单一单元（类）中。它允许数据隐藏，即类的内部细节对外部访问隐藏。对数据的访问通过方法（如\
    \ getter 和 setter）进行控制。\n\n这是一个演示封装和数据隐藏的示例：\n\n```cpp\nclass BankAccount {\n\
    private:\n    std::string accountNumber;\n    double balance;\npublic:\n    //\
    \ accountNumber 的 getter\n    std::string getAccountNumber() {\n        return\
    \ accountNumber;\n    }\n    // balance 的 setter\n    void setBalance(double amount)\
    \ {\n        if (amount >= 0) {\n            balance = amount;\n        }\n  \
    \  }\n};\n```\n\n## 继承\n\n继承是一种允许类继承另一个类的属性和行为的机制。被继承的类称为基类或父类，而继承它的类称为派生类或子类。继承促进了代码复用并允许创建类层次结构。\n\
    \n这是一个继承的示例：\n\n```cpp\nclass Shape {\npublic:\n    virtual double calculateArea()\
    \ = 0;\n};\n\nclass Rectangle : public Shape {\npublic:\n    double length;\n\
    \    double width;\n    double calculateArea() override {\n        return length\
    \ * width;\n    }\n};\n```\n\n在这个示例中，我们有一个名为 `Shape` 的基类，它定义了一个纯虚方法 `calculateArea()`。`Rectangle`\
    \ 类派自 `Shape` 类，使用 `public` 访问符重写了 `calculateArea()` 方法以计算面积。\n\n### 多态\n\n多态是将不同类的对象被视为公共基类对象的能力。多态允许使用单一接口来表示多个类。它允许编写能够处理不同对象类型的代码。\n\
    \n这是一个演示多态的示例：\n\n```cpp\nclass Shape {\npublic:\n    virtual double calculateArea()\
    \ = 0;\n};\n\nclass Rectangle : public Shape {\npublic:\n    double length;\n\
    \    double width;\n    double calculateArea() override {\n        return length\
    \ * width;\n    }\n};\n\nclass Circle : public Shape {\npublic:\n    double radius;\n\
    \    double calculateArea() override {\n        return 3.14 * radius * radius;\n\
    \    }\n};\n\nvoid printArea(Shape* shape) {\n    std::cout << \"Area: \" << shape->calculateArea()\
    \ << std::endl;\n}\n\nint main() {\n    Rectangle rect;\n    rect.length = 5.0;\n\
    \    rect.width = 3.0;\n    Circle circle;\n    circle.radius = 4.0;\n    printArea(&rect);\n\
    \    printArea(&circle);\n    return 0;\n}\n```\n\n在这个示例中，我们有一个带有纯虚方法 `calculateArea()`\
    \ 的基类 `Shape`。`Rectangle` 和 `Circle` 类派自 `Shape` 类，并提供了各自的 `calculateArea()` 方法实现。`printArea`\
    \ 函数接收 `Shape` 对象的指针并调用其 `calculateArea()` 方法，展示了多态行为。\n\n## 总结\n\n在本章中，我们探索了\
    \ C++ 中的面向对象编程（OOP）概念。我们学习了类和对象，它们允许围绕具有自身状态和行为的实体组织代码。我们讨论了类的声明与定义、对象的创建、访问类成员以及构造函数和析构函数的概念。我们还探索了封装与数据隐藏、继承和多态。\n\
    \nOOP 促进了代码复用、模块化和扩展性，允许通过将程序分解为可管理的、复用的组件来创建复杂的程序。通过理解并应用 OOP 概念，你可以设计并实现结构良好、可扩展且易于维护的代码。\n\
    \n"
