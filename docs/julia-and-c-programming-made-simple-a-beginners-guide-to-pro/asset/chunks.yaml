    \n理解运算符和表达式对于在 C++ 中编写高效且有意义的代码至关重要。通过利用适当的运算符并理解它们的优先级和结合性，我们可以在程序中执行复杂的计算并做出决策。\n\
    \n在你继续 C++ 编程之旅时，请记住可使用的不同类型的运算符及其各自的用途。精通运算符和表达式将极大增强你解决问题和创建健壮应用程序的能力。\n\n#\
    \ 第 5 章：控制流与决策\n\n在第 4 章中，我们探索了 C++ 中的运算符和表达式。在本章中，我们将深入研究控制流和决策结构。控制流允许我们确定语句执行的顺序，而决策结构则使我们能够根据某些条件做出选择并执行不同的代码块。\n\
    \n## 条件语句：If-Else\n\nC++ 中的条件语句允许我们根据某些条件执行特定的代码块。最常用的条件语句是“if-else”语句。这是它的基本语法：\n\
    \n```cpp\nif (condition) {\n    // 如果条件为真，则执行的代码\n} else {\n    // 如果条件为假，则执行的代码\n\
    }\n```\n\n让我们来看一个示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n    int age;\n\
    \    std::cout << \"Enter your age: \";\n    std::cin >> age;\n    if (age >=\
    \ 18) {\n        std::cout << \"You are eligible to vote.\" << std::endl;\n  \
    \  } else {\n        std::cout << \"You are not eligible to vote.\" << std::endl;\n\
    \    }\n    return 0;\n}\n```\n\n在上述代码中，用户的年龄存储在 `age` 变量中。`if-else`语句检查年龄是否大于等于\
    \ 18。如果条件为真，则显示消息“You are eligible to vote（你有投票权）”。否则，显示消息“You are not eligible\
    \ to vote（你没有投票权）”。\n\n条件语句还可以嵌套，允许进行更复杂的决策。这里有一个示例：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int score;\n    std::cout << \"Enter your score: \";\n   \
    \ std::cin >> score;\n    if (score >= 90) {\n        std::cout << \"Excellent!\"\
    \ << std::endl;\n    } else if (score >= 70) {\n        std::cout << \"Good job!\"\
    \ << std::endl;\n    } else if (score >= 50) {\n        std::cout << \"You passed.\"\
    \ << std::endl;\n    } else {\n        std::cout << \"You failed.\" << std::endl;\n\
    \    }\n    return 0;\n}\n```\n\n在这个示例中，程序询问用户分数。根据分数，显示不同的消息。如果分数在 90 或以上，显示消息“Excellent!”。如果分数在\
    \ 70 到 89 之间，显示消息“Good job!”。如果分数在 50 到 69 之间，显示消息“You passed（你通过了）”。否则，如果分数低于\
    \ 50，则显示消息“You failed（你没通过了）”。\n\n## 循环：While 和 For\n\nC++ 中的循环允许我们多次执行一个代码块。有两种常用的循环结构：`while`\
    \ 和 `for`。\n\n### While 循环\n\n`while` 循环在指定条件为真的情况下会重复执行一个代码块。这是它的基本语法：\n\n```cpp\n\
