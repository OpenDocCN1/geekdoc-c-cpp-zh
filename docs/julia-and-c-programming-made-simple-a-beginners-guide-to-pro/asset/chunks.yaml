    \ `delete` 或 `delete[]` 运算符释放内存。我们还强调了妥善释放动态分配内存以防止内存泄漏的重要性。\n\n通过理解指针和动态内存分配，你可以有效地管理程序中的内存，动态创建数据结构，并优化内存使用。\n\
    \n# 第 9 章：面向对象编程的概念\n\n在第 8 章中，我们探索了 C++ 中的指针和动态内存分配。在本章中，我们将深入探讨面向对象编程（OOP）概念。OOP\
    \ 是一种以对象（类的实例）为中心来组织代码的编程范式。OOP 促进了代码的可重用、模块化和扩展性。\n\n## 类与对象\n\n类是一个蓝图或模板，定义了对象的属性（成员）和行为（方法）。对象是类的实例，代表具有特定状态和行为的特定实体。类提供了一种将数据和相关功能封装到单元单元的方法。\n\
    \n### 类声明与定义\n\n在 C++ 中声明一个类，我们使用 `class` 关键字后跟类名。这里有一个示例：\n\n```cpp\nclass Rectangle\
    \ {\n// 类成员\n};\n```\n\n要定义一个类，我们在类声明内部提供其成员的实现。成员可以包括属性（数据成员）和方法（成员函数）。这里有一个示例：\n\
    \n```cpp\nclass Rectangle {\npublic:\n    // 属性\n    double length;\n    double\
    \ width;\n    // 方法\n    double calculateArea() {\n        return length * width;\n\
    \    }\n};\n```\n\n在此例中，我们定义了一个名为 `Rectangle` 的类。它有两个属性 `length` 和 `width`，以及一个名为\
    \ `calculateArea()` 的用于计算矩形面积的方法。\n\n### 创建对象\n\n要创建一个类的对象，我们使用类名后跟对象名以及可选的括号。这里有一个示例：\n\
    \n```cpp\nRectangle rect1;    // 创建 Rectangle 类的对象\n```\n\n在此例中，我们创建了一个名为 `rect1`\
    \ 的 `Rectangle` 类对象。\n\n### 访问类成员\n\n要访问对象的成员（属性和方法），我们使用点 (.) 运算符。这里有一个示例：\n\n\
    ```cpp\nRectangle rect1;\nrect1.length = 5.0;    // 访问并给 'length' 属性赋值\nrect1.width\
    \ = 3.0;     // 访问并给 'width' 属性赋值\ndouble area = rect1.calculateArea();    //\
    \ 访问并调用 'calculateArea' 方法\nstd::cout << \"Area: \" << area << std::endl;\n```\n\
    \n在此例中，我们使用点运算符访问 `rect1` 对象的属性并为其赋值。我们还调用了 `calculateArea()` 方法来计算矩形的面积。\n\n\
    ### 构造函数与析构函数\n\n构造函数和析构函数是类的特殊成员函数，分别在对象创建和销毁时自动调用。\n\n构造函数用于初始化对象的属性并执行任何必要的设置。它的名称与类名相同，且没有返回类型。这里有一个示例：\n\
    \n```cpp\nclass Rectangle {\npublic:\n    double length;\n    double width;\n\
    \    // 构造函数\n    Rectangle(double len, double wid) {\n        length = len;\n\
    \        width = wid;\n    }\n};\n```\n\n在此例中，我们为 `Rectangle` 类定义了一个构造函数，它接受两个参数\
    \ `len` 和 `wid` 来初始化 `length` 和 `width` 属性。\n\n析构函数用于在对象销毁之前清理资源并执行任何必要的收尾工作。它的名称与类名相同但前面有一个波浪号\
    \ (`~`)，且没有参数。\n\n```cpp\nclass Rectangle {\npublic:\n    double length;\n   \
    \ double width;\n    // 构造函数\n    Rectangle(double len, double wid) {\n      \
    \  length = len;\n        width = wid;\n    }\n    // 析构函数\n    ~Rectangle() {\n\
    \        // 此处清理代码\n    }\n};\n```\n\n在此例中，我们为 `Rectangle` 类添加了析构函数。析构函数可以释放任何动态分配的内存或执行其他清理任务。\n\
    \n### 封装与数据隐藏\n\nOOP 的核心原则之一是封装，它将数据和相关功能封装在一个单元（类）中。封装允许隐藏或保护数据不受外部直接访问和操作。数据的访问通过方法（如\
    \ getter 和 setter）进行控制。\n\n这里有一个演示封装和数据隐藏的示例：\n\n```cpp\nclass BankAccount {\n\
    private:\n    std::string accountNumber;\n    double balance;\n\npublic:\n   \
    \ // accountNumber 的 getter\n    std::string getAccountNumber() {\n        return\
    \ accountNumber;\n    }\n    // balance 的 setter\n    void setBalance(double amount)\
    \ {\n        if (amount >= 0) {\n            balance = amount;\n        }\n  \
    \  }\n};\n```\n\n在此例中，`accountNumber` 属性被标记为 `private`（私有），防止类外部直接访问它。提供了 `getAccountNumber()`\
    \ 方法作为公共 getter 来访问账号。同样，`balance` 属性被标记为私有，并提供了 `setBalance()` 方法作为公共 setter\
    \ 来控制对余额属性的访问和验证。\n\n"
- fmt: "\n# Chapter 10: Classes and Objects\n\nIn Chapter 9, we delved into object-oriented\
    \ programming (OOP) concepts in C++. In this chapter, we will explore classes\
    \ and objects in more detail. Classes are the fundamental building blocks of OOP,\
    \ while objects are instances of classes. Understanding classes and objects is\
    \ crucial for creating robust and organized code.\n\n## Classes\n\nA class is\
    \ a blueprint or template that defines the properties (attributes) and behaviors\
    \ (methods) of objects. It encapsulates data and related functionality into a\
    \ single unit. Classes provide a way to represent real-world entities or abstract\
    \ concepts in our programs.\n\n### Class Declaration and Definition\n\nTo declare\
    \ a class in C++, we use the `class` keyword followed by the class name. Here's\
    \ an example:\n\n```cpp\nclass Rectangle {\n    // Class members\n};\n```\n\n\
    To define a class, we provide the implementation of its members within the class\
    \ declaration. Members can include attributes (data members) and methods (member\
    \ functions). Here's an example:\n\n```cpp\nclass Rectangle {\npublic:\n    //\
    \ Attributes\n    double length;\n    double width;\n    // Methods\n    double\
    \ calculateArea() {\n        return length * width;\n    }\n};\n```\n\nIn this\
    \ example, we define a class named `Rectangle`. It has two attributes, `length`\
    \ and `width`, and a method called `calculateArea()` that calculates the area\
    \ of the rectangle.\n\n### Objects\n\nAn object is an instance of a class. It\
    \ represents a specific entity or concept defined by the class. Objects have their\
    \ own state (attribute values) and behavior (method executions). We create objects\
    \ based on the class blueprint to work with specific instances of the class.\n\
    \n### Creating Objects\n\nTo create objects of a class, we use the class name\
    \ followed by the object name and optional parentheses. Here's an example:\n\n\
    ```cpp\nRectangle rect1; // Creating an object of the Rectangle class\n```\n\n\
    In this example, we create an object named `rect1` of the `Rectangle` class.\n\
    \n### Accessing Class Members\n\nTo access the members (attributes and methods)\
    \ of an object, we use the dot (`.` operator. Here's an example:\n\n```cpp\nRectangle\
    \ rect1;\nrect1.length = 5.0;    // Accessing and assigning a value to the 'length'\
    \ attribute\nrect1.width = 3.0;     // Accessing and assigning a value to the\
    \ 'width' attribute\ndouble area = rect1.calculateArea();    // Accessing and\
    \ calling the 'calculateArea' method\nstd::cout << \"Area: \" << area << std::endl;\n\
    ```\n\nIn this example, we access the attributes of `rect1` object using the dot\
    \ operator and assign values to them. We also call the `calculateArea()` method\
    \ to calculate the area of the rectangle.\n\n### Constructors and Destructors\n\
    \nConstructors and destructors are special member functions of a class that are\
    \ automatically called when objects are created and destroyed, respectively.\n\
    \nA constructor is used to initialize the object's attributes and perform any\
    \ necessary setup. It has the same name as the class and is declared without a\
    \ return type. Here's an example:\n\n```cpp\nclass Rectangle {\npublic:\n    double\
    \ length;\n    double width;\n    // Constructor\n    Rectangle(double len, double\
    \ wid) {\n        length = len;\n        width = wid;\n    }\n};\n```\n\nIn this\
    \ example, we define a constructor for the `Rectangle` class that takes two parameters,\
    \ `len` and `wid`, to initialize the `length` and `width` attributes.\n\nA destructor\
    \ is used to clean up resources and perform any necessary finalization before\
    \ an object is destroyed. It has the same name as the class preceded by a tilde\
    \ (`~`) and is declared without parameters. Here's an example:\n\n```cpp\nclass\
    \ Rectangle {\npublic:\n    double length;\n    double width;\n    // Constructor\n\
    \    Rectangle(double len, double wid) {\n        length = len;\n        width\
    \ = wid;\n    }\n    // Destructor\n    ~Rectangle() {\n        // Cleanup code\
    \ here\n    }\n};\n```\n\nIn this example, we add a destructor to the `Rectangle`\
    \ class. The destructor can be used to release any dynamically allocated memory\
    \ or perform any other cleanup tasks.\n\n### Encapsulation and Data Hiding\n\n\
    Encapsulation is a key principle of OOP that involves bundling data and related\
    \ functionality into a single unit (a class). It allows for data hiding, where\
    \ the internal details of a class are kept hidden from external access. Access\
    \ to the data is controlled through methods, such as getters and setters.\n\n\
    Here's an example that demonstrates encapsulation and data hiding:\n\n```cpp\n\
    class BankAccount {\nprivate:\n    std::string accountNumber;\n    double balance;\n\
    public:\n    // Getter for accountNumber\n    std::string getAccountNumber() {\n\
    \        return accountNumber;\n    }\n    // Setter for balance\n    void setBalance(double\
    \ amount) {\n        if (amount >= 0) {\n            balance = amount;\n     \
    \   }\n    }\n};\n```\n\n## Inheritance\n\nInheritance is a mechanism that allows\
    \ a class to inherit the properties and behaviors of another class. The class\
    \ being inherited from is called the base class or parent class, while the class\
    \ inheriting from it is called the derived class or child class. Inheritance promotes\
    \ code reuse and allows for the creation of class hierarchies.\n\nHere's an example\
    \ of inheritance:\n\n```cpp\nclass Shape {\npublic:\n    virtual double calculateArea()\
    \ = 0;\n};\n\nclass Rectangle : public Shape {\npublic:\n    double length;\n\
    \    double width;\n    double calculateArea() override {\n        return length\
    \ * width;\n    }\n};\n```\n\nIn this example, we have a base class named `Shape`\
    \ that defines a pure virtual method `calculateArea()`. The `Rectangle` class\
    \ is derived from the `Shape` class using the `public` access specifier. It overrides\
    \ the `calculateArea()` method to provide the specific implementation for calculating\
    \ the area of a rectangle.\n\n### Polymorphism\n\nPolymorphism is the ability\
    \ of objects of different classes to be treated as objects of a common base class.\
    \ Polymorphism allows for the use of a single interface to represent multiple\
    \ classes. It enables code to be written that can work with objects of different\
    \ types without needing to know their specific types.\n\nHere's an example that\
    \ demonstrates polymorphism:\n\n```cpp\nclass Shape {\npublic:\n    virtual double\
    \ calculateArea() = 0;\n};\n\nclass Rectangle : public Shape {\npublic:\n    double\
    \ length;\n    double width;\n    double calculateArea() override {\n        return\
    \ length * width;\n    }\n};\n\nclass Circle : public Shape {\npublic:\n    double\
    \ radius;\n    double calculateArea() override {\n        return 3.14 * radius\
    \ * radius;\n    }\n};\n\nvoid printArea(Shape* shape) {\n    std::cout << \"\
    Area: \" << shape->calculateArea() << std::endl;\n}\n\nint main() {\n    Rectangle\
    \ rect;\n    rect.length = 5.0;\n    rect.width = 3.0;\n    Circle circle;\n \
    \   circle.radius = 4.0;\n    printArea(&rect);\n    printArea(&circle);\n   \
    \ return 0;\n}\n```\n\nIn this example, we have a base class `Shape` with a pure\
    \ virtual method `calculateArea()`. The `Rectangle` and `Circle` classes are derived\
    \ from the `Shape` class and provide their own implementations of the `calculateArea()`\
    \ method. The `printArea()` function takes a pointer to a `Shape` object and calls\
    \ its `calculateArea()` method, demonstrating polymorphic behavior.\n\n## Conclusion\n\
    \nIn this chapter, we explored object-oriented programming (OOP) concepts in C++.\
    \ We learned about classes and objects, which allow us to organize code around\
    \ entities with their own state and behavior. We discussed class declaration and\
    \ definition, creating objects, accessing class members, and the concepts of constructors\
    \ and destructors. We also explored encapsulation and data hiding, inheritance,\
    \ and polymorphism.\n\nOOP promotes code reusability, modularity, and extensibility,\
    \ allowing for the creation of complex programs by breaking them down into manageable,\
    \ reusable components. By understanding and applying OOP concepts, you can design\
    \ and implement well-structured, scalable, and maintainable code.\n"
