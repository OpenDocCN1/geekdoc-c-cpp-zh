  trans: "\n\n在第 3 章中，我们探索了 C++中的变量和数据类型。在本章中，我们将深入学习运算符和表达式。运算符允许我们对变量和值执行各种操作，而表达式则将变量、值和运算符结合形成有意义的计算。\n\
    \n## 算术运算符\n\n算术运算符用于执行基本的数学计算。C++提供了以下算术运算符：\n\n- 加法 (`+`)：将两个值相加。\n- 减法 (`-`)：从一个值减去另一个值。\n\
    - 乘法 (`*`)：两个值相乘。\n- 除法 (`/`)：一个值除以另一个值。\n- 取模 (`%`)：返回除法运算的余数。\n\n通过示例来探索这些运算符：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int a = 10;\n    int b = 3;\n\
    \    int sum = a + b;           // 加法\n    int difference = a - b;  // 减法\n  \
    \  int product = a * b;      // 乘法\n    int quotient = a / b;      // 除法\n   \
    \ int remainder = a % b;     // 取模\n    std::cout << \"Sum: \" << sum << std::endl;\n\
    \    std::cout << \"Difference: \" << difference << std::endl;\n    std::cout\
    \ << \"Product: \" << product << std::endl;\n    std::cout << \"Quotient: \" <<\
    \ quotient << std::endl;\n    std::cout << \"Remainder: \" << remainder << std::endl;\n\
    \    return 0;\n}\n```\n\n在上面的代码中，变量 `a` 和 `b` 分别持有值 10 和 3。使用算术运算符执行加法、减法、乘法、除法和取模操作。然后使用\
    \ `std::cout` 显示结果。\n\n## 关系运算符\n\n关系运算符用于比较值并确定它们之间的关系。C++提供了以下关系运算符：\n\n- 等于\
    \ (`==`)：检查两个值是否相等。\n- 不等于 (`!=`)：检查两个值是否不等。\n- 大于 (`>`)：检查一个值是否大于另一个值。\n- 小于\
    \ (`<`)：检查一个值是否小于另一个值。\n- 大于等于 (`>=`)：检查一个值是否大于或等于另一个值。\n- 小于等于 (`<=`)：检查一个值是否小于或等于另一个值。\n\
    \n这里是一个演示关系运算符的示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n    int a =\
    \ 5;\n    int b = 10;\n    bool isEqual = (a == b);           // 等于\n    bool\
    \ isNotEqual = (a != b);      // 不等于\n    bool isGreaterThan = (a > b);     //\
    \ 大于\n    bool isLessThan = (a < b);       // 小于\n    bool isGreaterThanOrEqual\
    \ = (a >= b); // 大于等于\n    bool isLessThanOrEqual = (a <= b);  // 小于等于\n    std::cout\
    \ << \"Is equal: \" << isEqual << std::endl;\n    std::cout << \"Is not equal:\
    \ \" << isNotEqual << std::endl;\n    std::cout << \"Is greater than: \" << isGreaterThan\
    \ << std::endl;\n    std::cout << \"Is less than: \" << isLessThan << std::endl;\n\
    \    std::cout << \"Is greater than or equal to: \" << isGreaterThanOrEqual <<\
    \ std::endl;\n    std::cout << \"Is less than or equal to: \" << isLessThanOrEqual\
    \ << std::endl;\n    return 0;\n}\n```\n\n在上面的代码中，变量 `a` 和 `b` 分别持有值 5 和 10。使用关系运算符比较这些值并将结果赋值给布尔变量。然后使用\
    \ `std::cout` 显示布尔值。\n\n## 逻辑运算符\n\n逻辑运算符用于组合多个条件并执行逻辑操作。C++提供了以下逻辑运算符：\n\n- 逻辑与\
    \ (`&&`)：如果两个条件都为真，则返回 `true`。\n- 逻辑或 (`||`)：如果至少有一个条件为真，则返回 `true`。\n- 逻辑非 (`!`)：反转条件的结果。\n\
    \n让我们来看演示逻辑运算符的示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n    int age\
    \ = 25;\n    bool hasLicense = true;\n    bool isEligible = (age >= 18) && hasLicense;\
    \     // 逻辑与\n    bool canDrive = (age >= 18) || hasLicense;     // 逻辑或\n    bool\
    \ cannotDrive = !canDrive;                   // 逻辑非\n    std::cout << \"Is eligible:\
    \ \" << isEligible << std::endl;\n    std::cout << \"Can drive: \" << canDrive\
    \ << std::endl;\n    std::cout << \"Cannot drive: \" << cannotDrive << std::endl;\n\
    \    return 0;\n}\n```\n\n在上面的代码中，变量 `age` 和 `hasLicense` 代表个人的年龄以及他们是否拥有有效执照。使用逻辑运算符组合这些条件并将结果赋值给布尔变量。然后使用\
    \ `std::cout` 显示布尔值。\n\n## 赋值运算符\n\n赋值运算符用于给变量赋值。C++提供了各种赋值运算符，包括基础赋值运算符 (`=`)\
    \ 和复合赋值运算符 (`+=`, `-=`, `*=`, `/=`, 和 `%=`)）。\n\n这里是一个演示赋值运算符的示例：\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n    int a = 5;\n    a += 3;      // 等同于:\
    \ a = a + 3;\n    a -= 2;      // 等同于: a = a - 2;\n    a *= 4;      // 等同于: a\
    \ = a * 4;\n    a /= 2;      // 等同于: a = a / 2;\n    a %= 3;      // 等同于: a =\
    \ a % 3;\n    std::cout << \"Updated value of 'a': \" << a << std::endl;\n   \
    \ return 0;\n}\n```\n\n在上面的代码中，变量 `a` 初始持有值 5。使用复合赋值运算符通过执行算术运算并将结果赋回 `a` 来修改\
    \ `a` 的值。然后使用 `std::cout` 显示更新后的 `a`。\n\n## 运算符的优先级与结合性\n\nC++运算符具有不同的优先级和结合性，这决定了当存在多个运算符时的计算顺序。理解运算符优先级对于编写产生所需结果的表达式至关重要。以下是\
    \ C++常用运算符优先级和结合性的表格，从高到低排序：\n\n| 运算符 | 描述 | 结合性 |\n| :--- | :--- | :--- |\n|\
    \ `()` | 括号 | 从左到右 |\n| `++`, `--` | 后置递增/递减 | 从左到右 |\n| `++`, `--` | 前置递增/递减\
    \ | 从右到左 |\n| `+`, `-` | 一元加/负 | 从右到左 |\n| `!`, `~` | 逻辑非和按位取反 | 从右到左 |\n| `*`,\
    \ `/`, `%` | 乘法、除法、取模 | 从左到右 |\n| `+`, `-` | 加法、减法 | 从左到右 |\n| `<<`, `>>` | 按位左移、右移\
    \ | 从左到右 |\n| `<`, `<=`, `>=`,>` | 关系运算符 | 从左到右 |\n| `==`, `!=` | 等于运算符 | 从左到右\
    \ |\n| `&` | 按位与 | 从左到右 |\n| `^` | 按位异或 | 从左到右 |\n| `\\|` | 按位或 | 从左到右 |\n| `&&`\
    \ | 逻辑与 | 从左到右 |\n| `\\|\\|` | 逻辑或 | 从左到右 |\n| `=` | 赋值 | 从右到左 |\n| `+=`, `-=`,\
    \ `*=`, `/=`, `%=` | 复合赋值 | 从右到左 |\n\n"
- fmt: "\nTo override the default precedence and ensure a specific order of evaluation,\
    \ parentheses can be used to group expressions.\n\n## Conclusion\n\nIn this chapter,\
    \ we explored operators and expressions in C++. We learned about arithmetic operators\
    \ for performing basic mathematical calculations, relational operators for comparing\
    \ values, logical operators for combining conditions, and assignment operators\
    \ for assigning values to variables.\n\nUnderstanding operators and expressions\
    \ is crucial for writing effective and meaningful code in C++. By utilizing the\
    \ appropriate operators and understanding their precedence and associativity,\
    \ we can perform complex computations and make decisions within our programs.\n\
    \nAs you continue your journey in C++ programming, keep in mind the different\
    \ types of operators available to you and their respective uses. The mastery of\
    \ operators and expressions will greatly enhance your ability to solve problems\
    \ and create robust applications.\n\n# Chapter 5: Control Flow and Decision Making\n\
    \nIn Chapter 4, we explored operators and expressions in C++. In this chapter,\
    \ we will delve into control flow and decision-making structures. Control flow\
    \ allows us to determine the order in which statements are executed, while decision-making\
    \ structures enable us to make choices and execute different blocks of code based\
    \ on certain conditions.\n\n## Conditional Statements: If-Else\n\nConditional\
    \ statements in C++ allow us to execute specific blocks of code based on certain\
    \ conditions. The most commonly used conditional statement is the \"if-else\"\
    \ statement. Here's the basic syntax:\n\n```cpp\nif (condition) {\n    // Code\
    \ to be executed if the condition is true\n} else {\n    // Code to be executed\
    \ if the condition is false\n}\n```\n\nLet's see an example:\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    int age;\n    std::cout << \"Enter your age:\
    \ \";\n    std::cin >> age;\n    if (age >= 18) {\n        std::cout << \"You\
    \ are eligible to vote.\" << std::endl;\n    } else {\n        std::cout << \"\
    You are not eligible to vote.\" << std::endl;\n    }\n    return 0;\n}\n```\n\n\
    In the above code, the user's age is stored in the `age` variable. The `if-else`\
    \ statement checks if the age is greater than or equal to 18. If the condition\
    \ is true, the message \"You are eligible to vote\" is displayed. Otherwise, the\
    \ message \"You are not eligible to vote\" is displayed.\n\nConditional statements\
    \ can also be nested, allowing for more complex decision-making. Here's an example:\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int score;\n    std::cout <<\
    \ \"Enter your score: \";\n    std::cin >> score;\n    if (score >= 90) {\n  \
    \      std::cout << \"Excellent!\" << std::endl;\n    } else if (score >= 70)\
    \ {\n        std::cout << \"Good job!\" << std::endl;\n    } else if (score >=\
    \ 50) {\n        std::cout << \"You passed.\" << std::endl;\n    } else {\n  \
    \      std::cout << \"You failed.\" << std::endl;\n    }\n    return 0;\n}\n```\n\
    \nIn this example, the program asks the user for their score. Based on the score,\
    \ different messages are displayed. If the score is 90 or above, the message \"\
    Excellent!\" is displayed. If the score is between 70 and 89, the message \"Good\
    \ job!\" is displayed. If the score is between 50 and 69, the message \"You passed.\"\
    \ is displayed. Otherwise, if the score is below 50, the message \"You failed.\"\
    \ is displayed.\n\n## Loops: While and For\n\nLoops in C++ allow us to repeat\
    \ a block of code multiple times. There are two commonly used loop structures:\
    \ `while` and `for`.\n\n### While Loop\n\nThe `while` loop repeatedly executes\
    \ a block of code as long as a specified condition is true. Here's the basic syntax:\n\
    \n```cpp\nwhile (condition) {\n    // Code to be executed\n}\n```\n\nLet's see\
    \ an example:\n\n```cpp\n#include <iostream>\n\nint main() {\n    int count =\
    \ 0;\n    while (count < 5) {\n        std::cout << \"Count: \" << count << std::endl;\n\
    \        count++;\n    }\n    return 0;\n}\n```\n\nIn this example, the `while`\
    \ loop executes the code inside the block as long as the `count` variable is less\
    \ than 5. The value of `count` is displayed, and then it is incremented by 1.\
    \ This process repeats until the condition becomes false.\n\n### For Loop\n\n\
    The `for` loop is another type of loop that allows us to iterate over a range\
    \ of values or perform a specific number of iterations. Here's the basic syntax:\n\
    \n```cpp\nfor (initialization; condition; increment/decrement) {\n    // Code\
    \ to be executed\n}\n```\n\nLet's see an example:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    for (int i = 0; i < 5; i++) {\n        std::cout << \"Count:\
    \ \" << i << std::endl;\n    }\n    return 0;\n}\n```\n\nIn this example, the\
    \ `for` loop initializes the `i` variable to 0. It then checks if `i` is less\
    \ than 5. If the condition is true, the code inside the block is executed, and\
    \ then `i` is incremented by 1. This process repeats until the condition becomes\
    \ false.\n\n## Control Flow Statements: Break and Continue\n\nIn addition to conditional\
    \ statements and loops, control flow statements such as `break` and `continue`\
    \ provide additional control over the flow of execution within loops.\n\nThe `break`\
    \ statement is used to terminate the current loop and continue with the next statement\
    \ outside the loop. It can be useful for prematurely exiting a loop under certain\
