- pgno: 29
  md: '# CODE!


    ![](img/a1849c7d7e98817476d64684d9c96952_29_0.png)


    # CREATE VARIABLES


    Click on the Variables menu and then select “Make a Variable”.


    The following message will appear at the top of the screen:


    ![](img/a1849c7d7e98817476d64684d9c96952_29_1.png)


    Type “set to ” and click OK. “set to ” is the name of the variable and it will
    appear in the Variables menu, like this:


    ![](img/a1849c7d7e98817476d64684d9c96952_29_2.png)


    Add two more variables: one named x and the other named y.


    # USE VARIABLES


    Drag and drop the block from the Variables menu under the shape block. Click on
    the drop-down menu and choose x.


    Then go to the Numbers menu. Select and drag the first block into your program
    and type in 150.


    Add another two blocks from the Turtle menu to your program:


    ![](img/a1849c7d7e98817476d64684d9c96952_29_3.png)


    This variable will make the triangle move along the screen horizontally.


    ![](img/a1849c7d7e98817476d64684d9c96952_29_4.png)


    ![](img/a1849c7d7e98817476d64684d9c96952_29_5.png)


    Coordinates in programming are the number of pixels (each small block of color
    which forms a picture) across the screen (horizontally) and the number of pixels
    down (vertically).'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Did you know?


    A caterpillar has up to 4,000 muscles in its body.


    ![](img/a1849c7d7e98817476d64684d9c96952_30_0.png)


    # 5. CREATE A LIST USING LOOPS


    Click on the Loops menu and drag this block onto the white canvas.


    ![](img/a1849c7d7e98817476d64684d9c96952_30_1.png)


    Now go to the Lists menu and select the `create list with` block. Your program
    should look like this.


    ![](img/a1849c7d7e98817476d64684d9c96952_30_2.png)


    # 6. ADD ITEMS TO THE LIST


    A caterpillar’s body is made of several parts. The list you created in the previous
    step will help you add parts of the body to your drawing. Click on the list icon
    in the `create list with` block to add items.


    ```

    `create list with`

    ```


    You have to drag the `item` block and drop it inside the list block in the pop-out
    list. Add `item` until you have six inside the list block. The items will appear
    as six jigsaw slots in the `create list with` block.


    ```

    `create list with`

    ```


    ![](img/a1849c7d7e98817476d64684d9c96952_30_3.png)


    # Did you know?


    Most caterpillars are shades of green or brown and are relatively hairless, but
    some caterpillars are very hairy and brightly colored.


    ![](img/a1849c7d7e98817476d64684d9c96952_30_4.png)'
  merge: -1
  img_proc: true
