- pgno: 32
  md: "# DRAW THE CATERPILLAR'S HEAD\n\nAdd the following blocks to your program:\n\
    \n```\n```scratch\nwhen green flag clicked\nset size to 50%\ngo to x: 0 y: 25\n\
    set pen size to 10\nset color to [selected color]\npen down\nrepeat 25\n  move\
    \ 10 steps\n  turn right 15 degrees\n  move 10 steps\n  turn left 15 degrees\n\
    pen up\n```\n```\n\nThis block will position the caterpillar's head.\n\nChoose\
    \ any suitable color for your caterpillar's head.\n\nPress ▶ Run to test your\
    \ program.\n\n![](img/a1849c7d7e98817476d64684d9c96952_32_0.png)\n\n> **Did you\
    \ know?**\n> \n> Caterpillars are eating machines! They love eating nettles, wild\
    \ grasses, and flowers. During the first stage of their lives—the larval stage—caterpillars\
    \ can eat 27,000 times their own weight!\n\n![](img/a1849c7d7e98817476d64684d9c96952_32_1.png)\n\
    \n# TROUBLESHOOTING\n\nIf the circles that make the body of the caterpillar are\
    \ a bit separated, you can solve this by reducing the number in the variable.\n\
    \n```\n```scratch\nrepeat [triangle]\n  move 10 steps\nset [x] to [45]\n```\n\
    ```\n\n# CHALLENGE\n\nUse your knowledge of drawing circles to draw an orange\
    \ or an apple next to the caterpillar. Remember, they are always hungry!"
  merge: -1
  img_proc: true
- pgno: 33
  md: '# GLOSSARY


    **Canvas**

    An area of the screen for drawing on


    **Pixel**

    A point on the screen. It is the smallest dot a computer is capable of drawing.


    **Coordinates**

    The position of a pixel on the screen. It is the number of pixels across the screen
    (x-axis/horizontally) and the number of pixels down (y-axis/vertically).


    **Turtle**

    An image that shows the position of the program on the white canvas


    **Function**

    A set of instructions that can be used to do an action


    **Variable**

    A place to store data in a computer program. It has a name and a value.


    **Loop**

    An instruction or set of instructions that keep repeating


    ![](img/a1849c7d7e98817476d64684d9c96952_33_0.png)


    ![](img/a1849c7d7e98817476d64684d9c96952_33_1.png)


    ![](img/a1849c7d7e98817476d64684d9c96952_33_2.png)'
  merge: -1
