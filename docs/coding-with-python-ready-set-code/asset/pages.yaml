- pgno: 17
  md: "# CODE!\n\nNow you need to create colored rectangles to form your flag.\n\n\
    ![](img/a1849c7d7e98817476d64684d9c96952_17_0.png)\n\n# 3. DRAW A RECTANGLE USING\
    \ LOOPS\n\nAdd the following blocks to your program using the Loops and Turtle\
    \ menus:\n\n```\n```text\nrepeat 2 times\ndo\n  turn right by 90\n  move forward\
    \ by 50\n  turn right by 90\n  move forward by 150\n```\n```\n\nPress ▶ Run to\
    \ test your program. You should see a rectangle on the right side of your screen.\n\
    \n# 4. COLOR THE RECTANGLE\n\nAdd the following three blocks to the beginning\
    \ and end of your program using the Turtle menu:\n\nThis block will set the color\
    \ of the program.\n\n```\n```text\nset color to blue\nrepeat 2 times\ndo\n  turn\
    \ right by 90\n  move forward by 50\n  turn right by 90\n  move forward by 150\n\
    ```\n```\n\nThis block will color the rectangle.\n\nPress ▶ Run to test your program.\
    \ You should see a blue rectangle on the right side of your screen.\n\n![](img/a1849c7d7e98817476d64684d9c96952_17_1.png)\n\
    \nFunctions are like recipes. For example, to cook rice you have to follow a set\
    \ of instructions: boil water, add salt, pour in the rice, simmer for 20 minutes,\
    \ drain any remaining water, and fluff the rice with a fork. Functions allow programmers\
    \ to put all those instructions under one block and give it a name, such as “Rice.”\
    \ Every time you need to make rice, you could use the function “Rice.”"
  merge: -1
  img_proc: true
