- pgno: 27
  md: "# # THE CATERPILLAR\n\n# ## GET READY FOR CREEPY CRAWLY FUN!\n\n# ## READY\n\
    \nYou’re going to create a program using variables and loops to draw a caterpillar.\n\
    \n> > **Did you know?**\n> >\n> > A caterpillar is the larva of a moth or butterfly.\
    \ Caterpillars eat a lot of food before producing a hard, outer shell called a\
    \ chrysalis. Inside the chrysalis, the caterpillar develops into a butterfly.\n\
    \n![](img/a1849c7d7e98817476d64684d9c96952_27_0.png)\n\n+   1. **GETTING STARTED**\n\
    +      Go to Trinket: https://trinket.io/ and log in.\n+   \n+      Type in your\
    \ username and password.\n\n# ## The life cycle of a butterfly\n\n+   1. **Egg**\n\
    +      The female lays lots of little round eggs and attaches them to leaves or\
    \ stems.\n+   2. **Caterpillar (or larva)**\n+      The eggs develop into caterpillars.\n\
    +   3. **Chrysalis (often called the pupa)**\n+      This is a rest stage in which\
    \ the caterpillar develops a hard, outer case. Inside the chrysalis, the caterpillar\
    \ changes and becomes a butterfly.\n+   4. **Butterfly**\n+      Once the butterfly\
    \ is ready to emerge, the case around the chrysalis splits open.\n\n![](img/a1849c7d7e98817476d64684d9c96952_27_1.png)"
  merge: -1
  img_proc: true
