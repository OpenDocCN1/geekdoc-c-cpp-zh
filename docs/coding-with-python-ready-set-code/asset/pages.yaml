  md: "# ## USE LOOPS\n\nA poppy has four petals. Programmers can use loops to repeat\
    \ the same instruction many times. Add the following code to your program using\
    \ the Functions, Loops, and Turtle menus:\n\nPress ▶ Run to test your program.\n\
    \nYou should see a red flower on the right of your screen.\n\n```\n```\nrepeat\
    \ 4 times\n    do Petal\n    turn right by 90\n```\n```\n\nFunction\n\n```\n```\n\
    to Petal\n    shape circle\n    begin fill\n    set color to red\n    circle 25\n\
    \    end fill\n```\n```\n\nProgram\n\n```\n```\nrepeat 4 times\n    do Petal\n\
    \    turn right by 90\n```\n```\n\n![](img/a1849c7d7e98817476d64684d9c96952_24_0.png)\n\
    \n# ## CREATE THE CENTER\n\nYou will have to add another circle to make the center\
    \ of the flower. This time the circle will be black. Add the following blocks\
    \ to your program:\n\nPress ▶ Run to test your program.\n\nThis position block\
    \ will place the black circle right on the center of the flower.\n\n```\n```\n\
    repeat 4 times\n    do Petal\n    turn right by 90\ngoto 0 -15\nset color to brown\n\
    begin fill\ncircle 15\nend fill\n```\n```"
  merge: -1
  img_proc: true
