  mdcn: "\n\n### 你知道吗？\n\n毛毛虫的身体里有多达4000块肌肉。\n\n![](img/a1849c7d7e98817476d64684d9c96952_30_0.png)\n\
    \n## 5. 使用循环创建列表\n\n点击“循环”菜单，将这个积木拖到白色画布上。\n\n![](img/a1849c7d7e98817476d64684d9c96952_30_1.png)\n\
    \n现在转到“列表”菜单，选择`create list with`积木。你的程序应该像这样。\n\n![](img/a1849c7d7e98817476d64684d9c96952_30_2.png)\n\
    \n## 6. 向列表中添加项目\n\n毛毛虫的身体由几个部分组成。你在上一步中创建的列表将帮助你把这些身体部分添加到绘图中。点击`create list\
    \ with`积木中的列表图标来添加项目。\n\n```\ncreate list with\n```\n\n你需要拖动`item`积木，并将其放入弹出的列表中的列表积木内。添加`item`，直到列表积木中有六个。这些项目将作为六个拼图插槽出现在`create\
    \ list with`积木中。\n\n```\ncreate list with\n```\n\n![](img/a1849c7d7e98817476d64684d9c96952_30_3.png)\n\
    \n### 你知道吗？\n\n大多数毛毛虫呈绿色或棕色，体表相对无毛，但有些毛毛虫毛很多且颜色鲜艳。\n\n![](img/a1849c7d7e98817476d64684d9c96952_30_4.png)\n\
    \n## 绘制毛毛虫的头部\n\n将以下积木添加到你的程序中：\n\n```scratch\nwhen green flag clicked\nset size\
    \ to 50%\ngo to x: 0 y: 25\nset pen size to 10\nset color to [selected color]\n\
    pen down\nrepeat 25\n  move 10 steps\n  turn right 15 degrees\n  move 10 steps\n\
    \  turn left 15 degrees\npen up\n```\n\n这个积木将定位毛毛虫的头部。\n\n为你的毛毛虫的头部选择任何合适的颜色。\n\
    \n按下 ▶ 运行来测试你的程序。\n\n![](img/a1849c7d7e98817476d64684d9c96952_32_0.png)\n\n> **你知道吗？**\n\
    >\n> 毛毛虫是吃货机器！它们喜欢吃荨麻、野草和花朵。在它们生命的第一阶段——幼虫阶段——毛毛虫能吃下相当于自身体重27,000倍的食物！\n\n![](img/a1849c7d7e98817476d64684d9c96952_32_1.png)\n\
    \n### 故障排除\n\n如果组成毛毛虫身体的圆圈有些分离，你可以通过减小变量中的数值来解决这个问题。\n\n```scratch\nrepeat [triangle]\n\
    \  move 10 steps\nset [x] to [45]\n```\n\n### 挑战\n\n运用你绘制圆形的知识，在毛毛虫旁边画一个橙子或苹果。记住，它们总是很饿！\n\
    \n### 词汇表\n\n- **画布**：屏幕上用于绘制的区域\n- **像素**：屏幕上的一个点，是计算机能绘制的最小点。\n- **坐标**：像素在屏幕上的位置。它是横跨屏幕的像素数（x轴/水平方向）和纵向的像素数（y轴/垂直方向）。\n\
    - **海龟**：显示程序在白色画布上位置的图像\n- **函数**：一组可用于执行某项操作的指令\n- **变量**：计算机程序中存储数据的位置，它有名称和值。\n\
    - **循环**：不断重复的一条或一组指令\n\n![](img/a1849c7d7e98817476d64684d9c96952_33_0.png)\n\n\
    ![](img/a1849c7d7e98817476d64684d9c96952_33_1.png)\n\n![](img/a1849c7d7e98817476d64684d9c96952_33_2.png)\n\
