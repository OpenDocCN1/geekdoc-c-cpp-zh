  - '[PAGE 7]


    # # What Is Python?


    A programming language is a particular way to talk to a computer. It is a set
    of instructions that you give the computer to use. Python is a typed programming
    language that allows you to create animations, graphics, and games. One of the
    advantages of Python is that you can get things done with less code than many
    other programming languages.


    Many famous organizations such as Google, YouTube, NASA, and Yahoo use Python.
    It has been used to produce the special effects for the *Harry Potter* and *Pirates
    of the Caribbean* films.


    # ## Trinket


    All the projects in this book will be done using Trinket Blocks to create and
    run Python projects. This means you will not need to type the code; you can just
    drag, drop, and snap the coding blocks together!


    ![](img/a1849c7d7e98817476d64684d9c96952_7_0.png)


    ![](img/a1849c7d7e98817476d64684d9c96952_7_1.png)


    # ## Note to parents


    To use Trinket, go to: https://trinket.io/.


    Trinket allows your child to create and run Python projects in a web browser,
    on your desktop, or on an iPad. In this book, the instructions assume the user
    is creating on a desktop. There is no software to install. Children will be able
    to see their Python code and its output side-by-side. Children can also save their
    code online or share it with others with a link. Trinket Blocks is a free Trinket
    feature.'
  - '[PAGE 8]


    # Creating Trinket accounts


    Parental permission is required to create accounts for children under 13. It is
    recommended that a Trinket account be created by a parent or responsible adult.


    Trinket can be used without downloading plug-ins or installing software. For your
    child to be able to save and share his or her projects, you will have to sign
    up and create a username and a password.


    # Trinket


    These are the main features you will find when you open a new Trinket Blocks project:


    ![](img/a1849c7d7e98817476d64684d9c96952_8_0.png)


    Menu


    Project title


    Click here to run your program.


    Save your work here.


    Click here to view your Python program as text.


    Coding block menus


    You will drop the blocks for your program onto this white canvas.


    Drag blocks here to delete them.


    Your program will run here.


    # Be share aware


    Usernames and passwords are personal information and, just like your toothbrush,
    YOU DO NOT SHARE THEM WITH ANYBODY!


    ![](img/a1849c7d7e98817476d64684d9c96952_8_1.png)'
