    # SET


    Now you''ve opened Trinket, it''s time to begin a new program.


    # 2 OPEN A NEW TRINKET


    Click on Trinket and you will see the following drop-down menu. Click on Blocks.


    You will see the following window. Click on Turtle.


    You will drop the blocks for your program in this white canvas.


    ![](img/a1849c7d7e98817476d64684d9c96952_10_0.png)


    ![](img/a1849c7d7e98817476d64684d9c96952_10_1.png)


    The following menu will open up on the right when you click on Turtle. Drag the
    `shape turtle` block to the white canvas. You are now ready to code.


    ![](img/a1849c7d7e98817476d64684d9c96952_10_2.png)


    # Did you know?


    Both tortoises and turtles are reptiles. Both lay eggs and have hard, bony shells.
    Tortoises have flatter backs than turtles and they live on land in deserts, grasslands,
    and forests. Turtles have webbed feet for swimming and live in rivers, lakes,
    or oceans.


    ![](img/a1849c7d7e98817476d64684d9c96952_10_3.png)'
  - '[PAGE 11]


    # Did you know?


    Turtles have a hard shell that protects them like a shield. This upper shell is
    called a carapace. Turtles also have a lower shell called a plastron. Many turtle
    species can hide their heads inside their shells when attacked by predators.


    ![](img/a1849c7d7e98817476d64684d9c96952_11_0.png)


    # CODE!


    Now you''re ready to start programming your turtles.


    If you select the wrong block, you can delete it by returning it to the blocks
    section on the left or dragging and dropping it in the bin in the bottom right-hand
    corner.


    ![](img/a1849c7d7e98817476d64684d9c96952_11_1.png)


    ![](img/a1849c7d7e98817476d64684d9c96952_11_2.png)


    # 3 WRITE IN PYTHON


    Add the following block from the Turtle menu and type: "Hello! What are you doing?"
    inside the quotes. Your program should look like this:


    ```

    when turtle

    write "Hello! What are you doing?" font size 14

    ```


    Press ▶ Run to test your program. You should see your message disappearing off
    the right side of the screen, with a turtle overlapping the first word.'
