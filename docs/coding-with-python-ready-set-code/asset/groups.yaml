    ## What Is Python?


    A programming language is a particular way to talk to a computer. It is a set
    of instructions that you give the computer to use. Python is a typed programming
    language that allows you to create animations, graphics, and games. One of the
    advantages of Python is that you can get things done with less code than many
    other programming languages.


    Many famous organizations such as Google, YouTube, NASA, and Yahoo use Python.
    It has been used to produce the special effects for the *Harry Potter* and *Pirates
    of the Caribbean* films.


    ### Trinket


    All the projects in this book will be done using Trinket Blocks to create and
    run Python projects. This means you will not need to type the code; you can just
    drag, drop, and snap the coding blocks together!


    ![](img/a1849c7d7e98817476d64684d9c96952_7_0.png)


    ![](img/a1849c7d7e98817476d64684d9c96952_7_1.png)


    ### Note to parents


    To use Trinket, go to: https://trinket.io/.


    Trinket allows your child to create and run Python projects in a web browser,
    on your desktop, or on an iPad. In this book, the instructions assume the user
    is creating on a desktop. There is no software to install. Children will be able
    to see their Python code and its output side-by-side. Children can also save their
    code online or share it with others with a link. Trinket Blocks is a free Trinket
    feature.


    ### Creating Trinket accounts


    Parental permission is required to create accounts for children under 13. It is
    recommended that a Trinket account be created by a parent or responsible adult.


    Trinket can be used without downloading plug-ins or installing software. For your
    child to be able to save and share his or her projects, you will have to sign
    up and create a username and a password.


    ### Trinket


    These are the main features you will find when you open a new Trinket Blocks project:


    ![](img/a1849c7d7e98817476d64684d9c96952_8_0.png)


    - Menu

    - Project title

    - Click here to run your program.

    - Save your work here.

    - Click here to view your Python program as text.

    - Coding block menus

    - You will drop the blocks for your program onto this white canvas.

    - Drag blocks here to delete them.

    - Your program will run here.


    ### Be share aware


    Usernames and passwords are personal information and, just like your toothbrush,
    YOU DO NOT SHARE THEM WITH ANYBODY!


    ![](img/a1849c7d7e98817476d64684d9c96952_8_1.png)


    ## TURTLE TALK


    ### GET YOUR TURTLES CHATTING!


    ### READY


    In this project, you will use Python to create an animation of two turtles talking.
    Turtles are used in Python to show you the position of your program on the canvas.


    > **Did you know?**

    >

    > Turtles have been on Earth since the time of the dinosaurs—over 200 million
    years ago!


    ![](img/a1849c7d7e98817476d64684d9c96952_9_0.png)


    ### 1. GETTING STARTED


    Go to Trinket: https://trinket.io/ and log in.


    ![](img/a1849c7d7e98817476d64684d9c96952_9_1.png)


    Type in your username and password.


    ### SET


    Now you''ve opened Trinket, it''s time to begin a new program.


    ### 2 OPEN A NEW TRINKET


    Click on Trinket and you will see the following drop-down menu. Click on Blocks.


    You will see the following window. Click on Turtle.


    You will drop the blocks for your program in this white canvas.


    ![](img/a1849c7d7e98817476d64684d9c96952_10_0.png)


    ![](img/a1849c7d7e98817476d64684d9c96952_10_1.png)


    The following menu will open up on the right when you click on Turtle. Drag the
    `shape turtle` block to the white canvas. You are now ready to code.


    ![](img/a1849c7d7e98817476d64684d9c96952_10_2.png)


    > **Did you know?**

    >

    > Both tortoises and turtles are reptiles. Both lay eggs and have hard, bony shells.
    Tortoises have flatter backs than turtles and they live on land in deserts, grasslands,
    and forests. Turtles have webbed feet for swimming and live in rivers, lakes,
    or oceans.


    ![](img/a1849c7d7e98817476d64684d9c96952_10_3.png)


    > **Did you know?**

    >

    > Turtles have a hard shell that protects them like a shield. This upper shell
    is called a carapace. Turtles also have a lower shell called a plastron. Many
    turtle species can hide their heads inside their shells when attacked by predators.


    ![](img/a1849c7d7e98817476d64684d9c96952_11_0.png)


    ### CODE!


    Now you''re ready to start programming your turtles.


    If you select the wrong block, you can delete it by returning it to the blocks
    section on the left or dragging and dropping it in the bin in the bottom right-hand
    corner.


    ![](img/a1849c7d7e98817476d64684d9c96952_11_1.png)


    ![](img/a1849c7d7e98817476d64684d9c96952_11_2.png)


    ### 3 WRITE IN PYTHON


    Add the following block from the Turtle menu and type: "Hello! What are you doing?"
    inside the quotes. Your program should look like this:


    ```

    when turtle

    write "Hello! What are you doing?" font size 14

    ```


    Press ▶ Run to test your program. You should see your message disappearing off
    the right side of the screen, with a turtle overlapping the first word.


    ### 4 POSITION THE TEXT


    Let’s position the text toward the left of the screen. Add the **go to** block
    from the Turtle menu to your program by clicking and dragging each block into
    the positions below. Change the numbers in the two purple blocks to: **-50, 40**.


    ![](img/a1849c7d7e98817476d64684d9c96952_12_0.png)


    Press ▶ **Run** to test your program. You should see the text on the right of
    the screen.


    ![](img/a1849c7d7e98817476d64684d9c96952_12_1.png)


    > **Did you know?**

    >

    > The common box turtle has a distinctive hinged lowered shell (the box) that
    allows it to completely enclose itself. It lives in woodlands, marshy meadows,
    floodplains, scrub forests, and grasslands in much of the eastern United States.


    ### 5 USE THE PEN UP BLOCK


    The turtle draws a line when it moves. To make the turtle move without drawing
    a line you need to use the **pen up** block from the Turtle menu. Your program
    should look like this:


    ![](img/a1849c7d7e98817476d64684d9c96952_12_2.png)


    Press ▶ **Run** to test your program.


    ### 6 SET THE SPEED


    Add a **speed 10** block to the program to make the turtle go faster.


    ![](img/a1849c7d7e98817476d64684d9c96952_12_3.png)


    The number inside this block will set the turtle’s speed. The higher the number,
    the faster the turtle will move.


    Press ▶ **Run** to test your program.


    ![](img/a1849c7d7e98817476d64684d9c96952_12_4.png)

