    \n### 网络安全\n\n互联网是一个很棒的资源，它帮助你连接、交流和发挥创造力。\n\n然而，你需要确保上网安全。始终记住：\n\n1. 如果你在网上看到任何让你感到不舒服或不开心的事情，立刻告诉一位成年人。\n\
    2. 绝不要在网上与任何人分享你的个人信息，例如你的全名、地址或出生日期。\n3. 记住，网上的人可能并不总是他们所说的那个人。除非你确定自己知道他们是谁，否则绝不要与网上的人分享任何东西。\n\
