    \ topics in order to review and learn new material simultaneously. This helps\
    \ you maximize learning a new language. There is much to learn and practice makes\
    \ perfect. So let us begin.\n\n## Thank You\n\n### HelloWorld.c\n\n```c\n#include\
    \ <stdio.h> //a header file, this includes input and output\n//so we can use the\
