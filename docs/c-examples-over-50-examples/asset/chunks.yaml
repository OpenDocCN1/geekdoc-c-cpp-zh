    \n# Pointer.c\n\n```c\n#include <stdio.h>\n\n/*\n[作者] | [邮箱] | [日期]\n\n指针: 指针是一个特殊的变量，用于存储数据类型的内存地址。指针指向变量数据存储的内存地址。当你在\
    \ C 中声明变量时，会分配内存空间来存储该变量。因此，指针可以获取存储在内存地址的数据。当你访问内存地址处的值时，这被称为解引用指针。你可以拥有一个指向指针的指针。\n\
    */\nint main(){\n  int number = 1;\n  int two;\n\n  //要访问内存地址使用 & 符号\n  // 位于变量名旁边\n\
    \  printf(\"Address of number: %p\\n\", &number);\n  printf(\"Address of two:\
    \ %p\\n\", &two);//指针的占位符是 %p\n\n  //这两个地址在内存中将相隔 4 字节，或 32 位\n  // 在内存中，由于它们是连续声明的，\n\
    \  // 它们以“线性”方式存储\n  //声明指针使用相同的数据类型\n  // 在此例中使用 int，然后在名称旁边加一个 *\n  int *pointerToInt\
    \ = &number; //声明一个指针变量\n                                // 该指针指向 number 的地址\n\
    \n  // 仅引用指针将返回一个地址\n  printf(\"Address of where int is stored: %p\\n\", pointerToInt);\n\
    \n  //要访问指针指向的内容，在指针上使用 *\n  // 这被称为引用一个指针\n  printf(\"What is stored in number\
    \ address: %d\\n\", *pointerToInt);\n\n  return 0;\n}\n```\n\n**输出:**\n```\nAddress\
    \ of number: 0x7fff5f315be8\nAddress of two: 0x7fff5f315be4\nAddress of where\
    \ int is stored: 0x7fff5f315be8\nWhat is stored in number address: 1\n```\n\n\
