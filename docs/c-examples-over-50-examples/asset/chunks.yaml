    两个空指针总是相等的。\n指向空的指针不指向任何内容。\n空指针中存储的地址是一个无效的内存地址。\n它们对于执行检查非常有用。\n*/\nint main(){\n\
    \  int *p;\n  p = NULL;\n  int *cp = NULL;\n  printf(\"p: %p\\n\",p);//%p 是指针的占位符\n\
    \  printf(\"p==cp: %d\\n\",p==cp);//1 为真，0 为假\n\n  // 可以在 if 语句中使用空指针\n  if(p){可以使用\
    \ p!=NULL\n    printf(\"p is not null\\n\");\n  }else {\n    printf(\"p is null\\\
    n\");\n  }\n\n  // NULL 是空，空指针在数据结构中很有用\n  // 用于标记\n  // 数据结构的末尾，例如链表\n  return\
    \ 0;\n}\n```\n\n**输出:**\n```\np: 0x0\np==cp: 1\np is null\n```\n\n# PointerToVoid.c\n\
    \n```c\n#include <stdio.h>\n\n/*\n[作者] | [邮箱] | [日期]\n\n空指针: 指向 void 的指针在 c 中是合法的。空指针可以用来持有指向任何数据类型的指针。空指针展示了多态的特性。\n\
    */\nint main(){\n  //空指针可以持有任何数据类型\n  int a = 100;\n  int *p = &a;\n  printf(\"\
    Address of p: %p\\n\",p);\n  printf(\"sizeof(p): %lu\\n\", sizeof(p));\n  printf(\"\
    Dereferencing of p: %d\\n\",*p);\n  void *vp;\n  vp = p;//这个指针可以持有任何数据类型，\n  \
    \       // 对函数参数很有用\n  /*\n    - 空指针将与 char 有相同的表示形式和内存对齐\n    - 空指针永远不会等于另一个指针，但赋值为\
    \ NULL 的空指针会相等\n  */\n  printf(\"Address of vp: %p\\n\",vp);\n  printf(\"sizeof(vp):\
    \ %lu\\n\", sizeof(vp));\n  return 0;\n}\n```\n\n**输出:**\n```\nAddress of p: 0x7fff5c39ba8\n\
