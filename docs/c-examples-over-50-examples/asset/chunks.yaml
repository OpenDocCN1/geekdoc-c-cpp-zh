    \ [1,2] 的范围\n  if( r == 1)\n    printf(\"Heads\\n\");\n  else\n    printf(\"Tails\"\
    );\n  return 0;\n}\n```\n\n**Output1:**\n```\nHeads\n```\n**Output2:**\n```\n\
