    \ is ran you run a c program\nprintf(\"Hello World!\\n\");//'\\n’ is newline character,\
    \ it puts onto a new line\nreturn 0;//return for main\n}\n```\nOutput:\n```\n\
    Hello World!\n```\n\n### DataTypes.c\n\n```c\n#include <stdio.h>\n/*\n[author]\
    \ | [email] | [date]\nTypes: The types of data available to use within C.\nNotice\
    \ the sizeof() function, it returns the size (in bytes) of the data type. %lu\
    \ is a type of placeholder that holds unsigned long. There are many data types\
    \ not listed here, these are just basic types. Data types include: char, int,\
    \ and double.\n*/\nint main(){\n  /*\n  int and long: are whole numbers\n  float\
    \ and double: are floating point values (decimal numbers)\n  char: is a single\
    \ character\n  %f -> a placeholder for floats/doubles\n  %.2f -> formats a float/double\
    \ output to two decimal places\n  %d -> a place holder for ints\n  %c -> a place\
    \ holder for chars\n  */\n  printf(\"Storage size for char : %lu byte \\n\", sizeof(char));\n\
    \  printf(\"Storage size for int : %lu bytes \\n\", sizeof(int));\n  printf(\"\
    Storage size for float : %lu bytes \\n\", sizeof(float));\n  printf(\"Storage\
    \ size for double : %lu bytes \\n\", sizeof(double));\n  return 0;\n}\n```\nOutput:\n\
    ```\nStorage size for char: 1 byte\nStorage size for int: 4 byte\nStorage size\
    \ for float: 4 byte\nStorage size for long: 8 byte\n```\n\n### Variables.c\n\n\
    ```c\n#include <stdio.h>\n/*\n[author] | [email] | [date]\nVariable: Shows how\
    \ declare and initialize a variable. Multiple declarations are legal, initialize\
    \ on separate lines. You can perform operations on similar data types. Initialize\
    \ means to set the variable to a value.\n*/\nint main(){\n  char letter; //declaration\
    \ of a variable\n  letter = 't'; //initializing the variable notice char is init\
    \ with\n  printf(\"letter: %c \\n\", letter);//c placeholder for char\n  int x,\
    \ y, z; //notice multiple variable declarations the same line\n  x = 3;\n  y =\
    \ 2;\n  z = x+y;\n  printf(\"z: %d \\n\",z);\n  return 0;\n}\n```\nOutput:\n```\n\
    letter: t\nz: 5\n```\n\n### Operators.c\n\n```c\n#include <stdio.h>\n/*\n[author]\
    \ | [email] | [date]\nOperators: Basic operators in C, when you perform operations\
    \ with operators, the operations must be on the same data type. include: arithmetic\
    \ operators, relational/comparison operators, and assignment operators. There\
    \ are more but this is all we need for now.\n*/\nint main(){\n  int x, y;\n  x\
    \ = 2;\n  y = 2;\n  /*Arithmetic Operators*/\n  printf(\"2 + 2 : %d \\n\", x+y);\n\
    \  printf(\"2 - 2 : %d \\n\", x-y);\n  printf(\"2 * 2 : %d \\n\", x*y);\n  printf(\"\
    2 / 2 : %d \\n\", x/y);\n  x++; //same as x = x + 1\n  printf(\"2++ : %d \\n\"\
    , x);\n  y--; //same as y = y+1\n  printf(\"2-- : %d \\n\", y);\n  int m = 3%2;\
    \ //returns the remainder of a quotient\n  printf(\"modulus : %d \\n\", m);\n\
    /*Relational Operators*/\n//returns 0(representing false) or 1(representing true)\n\
    \  printf(\"2 == 2 : %d \\n\", x==y);//not an assignment, a comparison\n  printf(\"\
    2 != 2 : %d \\n\", x!=y);//bang operator,\n  printf(\"2 > 2 : %d \\n\", x>y);\
    \ //will return 0\n  printf(\"2 >= 2 : %d \\n\", x>=y);\n  printf(\"2 < 2 : %d\
    \ \\n\", x<y);\n  printf(\"2 <= 2 : %d \\n\", x<=y);\n/*Assignment Operators*/\n\
    \  printf(\"x += y : %d \\n\", x+=y);//x = x+y\n  printf(\"x: %d \\n\",x);\n \
    \ printf(\"x -= y : %d \\n\", x-=y);//x = x-y x:4 y:2\n  printf(\"x: %d \\n\"\
    ,x);\n  printf(\"x *= y : %d \\n\", x*=y);//x = x*y\n  printf(\"x /= y %d \\n\"\
    , x/=y);//x = x/y\n  printf(\"x: %d \\n\",x);\n  printf(\"x %%= y : %d \\n\",\
    \ x%=y);//x = x%y//two % signs needed to print out a % sign\n  return 0;\n}\n\
    ```\nOutput:\n```\n2 + 2 : 4\n2 - 2 : 0\n2 * 2 : 4\n2 / 2 : 1\n2++ : 3\n2-- :\
    \ 1\nmodulus : 1\n2 == 2 : 1\n2 != 2 : 0\n2 > 2 : 0\n2 >= 2 : 1\n2 < 2 : 0\n2\
    \ <= 2 : 1\nx += y : 5\nx: 5\nx -= y : 3\nx: 3\nx *= y : 6\nx: 6\nx /= y : 1\n\
    x: 1\nx %= y : 1\nx: 1\n```\n\n### IfStatement.c\n\n```c\n#include <stdio.h>\n\
    ```\n"
