    emacs SourceFile.c\n```\n\nThen to compile use the following command:\n\n```bash\n\
    gcc -o SourceFile.c SourceFile\n```\n\nThen to run your file, use:\n\n```bash\n\
    ./SourceFile\n```\n\nNew topics are presented in this book in an easy to understand\
