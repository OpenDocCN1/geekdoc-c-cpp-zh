  */\nint main(){\n  int number = 1;\n  int two;\n\n  //要访问内存地址使用 & 符号\n  // 位于变量名旁边\n\
  \  printf(\"Address of number: %p\\n\", &number);\n  printf(\"Address of two: %p\\\
  n\", &two);//指针的占位符是 %p\n\n  //这两个地址在内存中将相隔 4 字节，或 32 位\n  // 在内存中，由于它们是连续声明的，\n\
  \  // 它们以“线性”方式存储\n  //声明指针使用相同的数据类型\n  // 在此例中使用 int，然后在名称旁边加一个 *\n  int *pointerToInt\
  \ = &number; //声明一个指针变量\n                                // 该指针指向 number 的地址\n\n\
  \  // 仅引用指针将返回一个地址\n  printf(\"Address of where int is stored: %p\\n\", pointerToInt);\n\
  \n  //要访问指针指向的内容，在指针上使用 *\n  // 这被称为引用一个指针\n  printf(\"What is stored in number\
