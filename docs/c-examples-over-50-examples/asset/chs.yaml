  \n/*\n作者 | [邮箱] | [日期]\nArrayAnalysis: 计算随机生成数组的平均值、最大值和最小值。\n我们将讨论如何从函数返回数组，以及如何将数组作为参数传递\n\
  */\nint* initArray(int size, int range);\ndouble average(int* numbers, int size);\n\
  int biggest(int* numbers, int size);\nint smallest(int* numbers, int size);\n\n\
  int main(){\n  int* pi = initArray(10, 100);\n  double ave = average(pi, 10);\n\
  \  int big = biggest(pi, 10);\n  int small = smallest(pi, 10);\n  printf(\"Analyzing\
  \ Array:\\n\");\n  printf(\"\\tAverage %.2f\\n\",ave);\n  printf(\"\\tBiggest %d\\\
  n\",big);\n  printf(\"\\tSmallest %d\\n\", small);\n  return 0;\n}\n\n/*\n创建一个长度为\
  \ size 的数组，包含在 [0, range] 之间的随机数。\n当你返回一个数组时，必须返回一个指向数组的指针，你之后可以对其迭代。\n*/\nint*\
  \ initArray(int size, int range){\n  srand(time(0));\n  int* num = (int*)malloc(sizeof(int));\n\
  \  for(int i = 0; i < size; i++){\n    num = realloc(num, sizeof(int)*(i+1));\n\
  \    *(num+i) = rand()%range;\n  }\n  // 这返回指向数字第一个元素的\n  // 地址\n  return num;\n\
  }\n```\n\n\n\n\n```c\n/*\n  average: 计算我们数组的平均值。\n  我们正在将一个数组传递到函数中。\n  具体来说，我们是将一个指针传递到函数中，\n\
  \  然后我们可以对该指针进行算术运算\n  以解引用它的成员。当你这样做时，\n  同时传递大小是一个良好的习惯。\n*/\ndouble average(int*\
  \ numbers, int size){\n  double total = 0;\n  for(int i = 0; i < size; i++)\n  \
  \  total += *(numbers+i);\n  return total/(double)size;\n}\n```\n\n```c\n/*\n  biggest:\
  \ 找到数组中最大的数字。\n  我们将使用与上面相同的技术。\n*/\nint biggest(int* numbers, int size){\n  int\
  \ biggest = *numbers;\n  //将 biggest 初始化为第一个元素\n  for(int i = 1; i < size; i++){\n\
  \    if(*(numbers+i) > biggest)\n      biggest = *(numbers+i);\n  }\n  return biggest;\n\
  }\n```\n\n```c\n/*\n  smallest: 找到数组中最小的数字。\n  我们将使用与上面相同的技术。\n*/\nint smallest(int*\
  \ numbers, int size){\n  int smallest = *numbers;\n  //将 smallest 初始化为第一个元素\n  for(int\
  \ i = 1; i < size; i++){\n    if(*(numbers+i) <smallest)\n      smallest = *(numbers+i);\n\
  \  }\n  return smallest;\n}\n```\n\n### 输出:\n分析数组：\n平均值 60.30\n最大 90\n最小 0\n\n###\
