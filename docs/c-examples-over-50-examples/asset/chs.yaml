  \n```c\n#include <stdio.h>\n\n/*\n[作者] | [邮箱] | [日期]\n\n空指针: C 语言中的 Null 表示无，它在字面上没有值，并用于表示未知的数据。\n\
  指向空指针在 C 中是合法的。当指针被赋值为空时，该指针不指向任何内容。\n两个空指针总是相等的。\n指向空的指针不指向任何内容。\n空指针中存储的地址是一个无效的内存地址。\n\
  它们对于执行检查非常有用。\n*/\nint main(){\n  int *p;\n  p = NULL;\n  int *cp = NULL;\n  printf(\"\
  p: %p\\n\",p);//%p 是指针的占位符\n  printf(\"p==cp: %d\\n\",p==cp);//1 为真，0 为假\n\n  //\
  \ 可以在 if 语句中使用空指针\n  if(p){可以使用 p!=NULL\n    printf(\"p is not null\\n\");\n  }else\
  \ {\n    printf(\"p is null\\n\");\n  }\n\n  // NULL 是空，空指针在数据结构中很有用\n  // 用于标记\n\
  \  // 数据结构的末尾，例如链表\n  return 0;\n}\n```\n\n**输出:**\n```\np: 0x0\np==cp: 1\np is\
  \ null\n```\n\n# PointerToVoid.c\n\n```c\n#include <stdio.h>\n\n/*\n[作者] | [邮箱]\
