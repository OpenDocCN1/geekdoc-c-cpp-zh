  \ Daniel Smith、Idan Lupinsky、G. Wade Johnson、Clovis Tondo、Joshua Lehrer、T. David\
  \ Hudson、Phillip Hellewell、Thomas Schell、Eldar Ronen、Ken Kobayashi、Cameron Mac Minn、John\
  \ Hershberger、Alex Dumov、Vincent Stojanov、Andrew Henrick、陈炯雄、Balbir Singh、Fraser\
  \ Ross、Niels Dekker、Harsh Gaurav Vangani、Vasily Poshehonov、藤村俊义、Alex Howlett、纪志煌的建议。此外，Mike\
  \ Rizzi、Balog Pal、David Solomon、Tony Oliver、Martin Rottinger、妙华、Brian Johnson、Joe\
  \ Suzow、Effeer Chen、Nate Kohl、Zachary Cohen、Owen Chu、Molly Sharp、Florian Weimer\
  \ 和 Richard Kinder 也提供了建议。\n\nJohn Wait 是本书前两个版本的编辑，他愚蠢地再次报名担任这一职责。他的助手 Denise Mickelsen\
  \ 总是带着愉快的微笑，技巧纯练地处理了我频繁的骚扰。（至少我认为她一直在微笑。我从未真正见过她。）Julie Nahil 抽中了最差的那张签，因此成为了我的制作经理。她以非凡的冷静处理了生产计划中意外丢失的六周工期。John\
  \ Fuller（她的老板）和 Marty Rabinowitz（他的老板）也帮助解决了许多生产问题。Vanessa Moore 的正式工作是帮助处理 FrameMaker\
  \ 问题和 PDF 准备，但她还将条目添加到了 附录 B 并对其进行了内封面打印格式化处理。Solveig Haugland 帮助了索引的格式化。Sandra\
  \ Schroeder 和 Chuti Prasertsith 负责封面设计，尽管似乎每当我说“但这张带有*那种*颜色条纹的*照片*怎么样？”时，都是 Chuti\
  \ 那个必须重新制作封面的人。Chanda Leary-Coutu 被派去负责营销工作的重体力活。\n\n在我编写手稿的几个月里，电视剧《[吸血鬼猎人](http://www.amazon.com/gp/product/B000AQ68RI?ie=UTF8&tag=ecpp3e-ebook-20&linkCode=as2&camp=1789&creative=9325&creativeASIN=B000AQ68RI)》经常在每天一天结束时帮助我“减压”。我费了巨大的克制，才没有把“巴菲语”写进书中。\n\
  \nKathy Reed 在 1971 年教我编程，我很欣慰的是，直到今天我们仍然保持着朋友关系。Donald French 在 1989 年雇佣我和 Moises\
  \ Lejter 创建 C++ 培训材料（这一举措让我*真正*了解了 C++），并在 1991 年聘请我在 Stratus 公司演示这些材料。那个班的学生鼓励我写下内容，这些内容最终构成了书的第一版。Don\
  \ 还向我介绍了 John Wait，他同意了出版。\n\n我的妻子 Nancy L. Urbano 即使在完成了七个书籍项目、一张 CD 适配版和一篇论文后，继续鼓励我的写作。她有着不可置信的宽容。没有她，我无法完成我的工作。\n\
  \n从开始到结束，我们的狗 Persephone 一直是无可伦比的伙伴。遗憾的是，在这个项目的大部分时间里，她的陪伴是以办公室里一个骨灰的形式存在的。我们非常想念她。\n\
  \n# 引言\n\n学习编程语言的基础是一回事；学习如何用该语言设计并实现*有效*的程序是另一回事。对于 C++ 来说尤其是如此，这门语言拥有非凡的特性。在使用得当时，C++\
  \ 是一门令人愉悦的语言。如果不加注意，C++ 可能会导致代码变得难以理解、难以维护、不可扩展且效率低下。\n\n本书的目的是教你如何使用 C++，而不是学习如何设计并实现*有效的*程序。在在使用得当时，C++\
  \ 能够让编程变得易于编写、直观、高效且几乎没有错误。本书旨在向你展示如何有效地使用 C++。我假设你已经有了使用 C++ 的经验。我提供的建议分为两个大类：通用设计策略以及特定语言特性的细节。设计讨论集中在如何在这\
  \ C++ 中选择不同的方法。如何在继承和模板之间选择？如何在公继承和私有继承之间选择？如何在成员函数和非成员函数之间选择？如何在值传递和引用传递之间选择？在最初做出这些决定至关重要，因为糟糕的选择可能在开发后期才会显现，那时修正往往是困难、耗时且昂贵的。\n\
  \n即使你确切知道做什么，处理好也是很复杂的。运算符的正确返回类型是什么？什么时候应该是虚函数？`new` 在找不到内存时应该如何表现？这些细节至关重要，本书将帮助你避免这些问题。\n\
  \n这不是 C++ 的全面参考书。相反，它是 55 条具体的建议（我称之为*条目*），关于你如何改进你的程序和设计。每个条目在某种程度上都是独立的，但大多数也包含对其他条目的引用。因此，阅读本书的一种方法是从感兴趣的条目开始，然后顺着引用看看它们通向何。\n\
  \n本书也不是 C++ 的介绍。例如，在第二章中，我渴望向你介绍有关构造函数、析构函数和赋值运算符的正确实现，但我假设你已经知道这些功能的功能以及如何声明，或者可以去其他地方查找。许多\
  \ C++ 书籍包含此类信息。\n\n*本书*的目的是突出 C++ 编程中被忽视的方面。其他书籍描述了语言的不同部分。本书告诉你如何结合这些部分以获得有效的程序。其他书籍告诉你如何让程序通过编译。本书告诉你如何避免编译器不会告诉你的问题。\n\
  \n同时，本书限制在*标准* C++ 上。这里只使用了官方语言标准中的特性。移植性是本书的一个关注重点，所以如果你在寻找依赖平台的黑科技和权宜之计，这里不是寻找它们的地方。\n\
  \n\n\n如果你能始终遵循所有的指南，你就不太可能掉入围绕 C++ 最常见的陷阱，但从本质上来说，指南是有例外的。这就是为什么每个 `Item`（条款）都有一个解释。这些解释是书中最重要的部分。只有理解了每个\
  \ `Item` 背后的原理，你才能判断它是否适用于你正在开发的软件以及你所劳作的独特约束条件。\n\n这本书的最佳用方法是洞察 C++ 是如何行为的、为什么会那样行为，以及如何利用这些行为来为你所服务。盲目应用书中的\
  \ `Item` 显然是不恰当的，但同时，在没有充分理由的情况下，你不应该违反任何指南。\n\n## 术语\n\n每个程序员都应该理解一小部分 C++ 词汇。以下术语足够重要，值得我们确保我们对它们的含义达成共识。\n\
  \n`declaration`（声明）告诉编译器关于某物的名称和类型，但省略了某些细节。这些是声明：\n\n```cpp\nextern int x;    \
  \                           // 对象的声明\nstd::size_t numDigits(int number);       \
  \  // 函数声明\nclass Widget;                              // 类声明\ntemplate<typename\
  \ T>                       // 模板声明\nclass GraphNode;                           //\
  \ 参见 Item 42 关于\n                                           // \"typename\" 使用的信息\n\
  ```\n\n请注意，我将整数 `x` 称为“对象”，尽管它是内置类型。有些人专门将“对象”一词留给用户定义类型的变量，但我并不不是其中之一。还要注意，函数 `numDigits`\
  \ 的返回类型是 `std::size_t`，即 `std` 命名空间中的 `size_t` 类型。该命名空间是 C++ 标准库中几乎所有内容所在的地方。然而，由于\
  \ C 的标准库（准确地说是 C89 的版本）也可以用于 C++，因此继承自 C 的符号（如 `size_t`）可能存在于全局作用域、`std` 内部，或两者兼有，这取决于\
  \ `#included` 了哪些头文件。在书中，我假设已经 `#included` 了 C++ 头文件，这就是为什么我引用的是 `std::size_t` 而不仅仅是\
  \ `size_t`。在正文中提到标准库的组件时，我通常会省略对 `std` 的引用，依靠你识别出 `size_t`、`vector` 和 `cout` 等内容位于\
  \ `std` 中。在示例代码中，我总是包含 `std`，因为真实的代码没有它将无法编译。\n\n顺便说，`size_t` 只是 C++ 在计数时使用的某些无符号类型的类型定义（例如，基于\
  \ `char*` 的字符串中的字符数、STL 容器中的元素个数等）。它也是 `vector`、`deque` 和 `string` 中 `operator[]`\
  \ 函数所采用的类型，当我们在 Item 3 中定义自己的 `operator[]` 函数时，我们将遵循这一惯例。\n\n每个函数的声明都揭示了它的 `signature`（签名），即它的参数和返回类型。函数的签名等同于它的类型。在\
  \ `numDigits` 的情况下，签名是 `std::size_t (int)`，即“接收一个 `int` 并返回一个 `std::size_t` 的函数”。C++\
  \ 对“签名”的正式排除了函数的返回类型，但在书中，将返回类型视为签名的一部分更有用。\n\n`definition`（定义）为编译器提供了声明中省略的细节。对于一个对象，定义是编译器为该对象分配内存的地方。对于函数或函数模板，定义提供了代码体。对于类或类模板，定义列出了类或模板的成员：\n\
  \n```cpp\nclass GraphNode {\n    int x;                          // 对象的定义\n    std::size_t\
  \ numDigits(int number) // 函数定义。\n    {\n        std::size_t digitsFar = 1;   //\
  \ 此函数返回\n                                    // 其参数中的\n                        \
  \            // 数字位数。\n        while ((number /= 10) != 0) ++digitsFar;\n      \
  \  return digitsFar;\n    }\n};\nclass Widget {                      // 类定义\npublic:\n\
  \    Widget();\n    ~Widget();\n    ...\n};\ntemplate<typename T>              \
  \ // 模板定义\npublic:\n    GraphNode();\n    ~GraphNode();\n    ...\n};\n```\n\n`Initialization`（初始化）是赋予对象第一个值的过程。对于用户定义类型的对象，初始化是由构造函数完成的。`default\
  \ constructor`（默认构造函数）是可以在没有任何参数的情况下调用的构造函数。这种构造函数要么没有参数，要么为每个参数有一个默认值：\n\n```cpp\n\
  class A {\npublic:\n    A(); // 默认构造函数\n};\nclass B {\npublic:\n    explicit B(int\
  \ x = 0, bool b = true); // 默认构造函数；参见下文\n                                      \
  \   // 关于 \"explicit\" 的信息\n};\nclass C {\npublic:\n    explicit C(int x); // 不是默认构造函数\n\
  };\n```\n\n类 `B` 和 `C` 的构造函数在这里声明为 `explicit`。这防止了它们被用于执行隐式类型转换，尽管它们仍然可以用于显式类型转换：\n\
  \n```cpp\nvoid doSomething(B bObject); // 一个接收类型 B 对象的函数\nB bObj1;             \
  \      // 一个类型 B 的对象\ndoSomething(bObj1);         // 好的，将一个 B 传递给 doSomething\n\
  B bObj2(28);               // 好的，从 28 创建 B（bool 默认为 true）\ndoSomething(28);    \
  \        // 错误！doSomething 需要 B 而不是 int，且没有 int 到 B 的隐式转换\ndoSomething(B(28)); \
  \        // 好的，使用 B 构造函数显式转换（即强制转换）int 为 B 以供调用。参见 Item 27 关于转换的信息。\n```\n\n声明为\
  \ `explicit` 的构造函数通常比非 `explicit` 构造函数更好，因为它们防止了编译器执行意外的（通常是非预期的）类型转换。除非我有充分理由允许构造函数用于隐式类型转换，否则我会将其声明为\
  \ `explicit`。我鼓励你遵循相同的策略。\n\n请注意我在示例中是如何高亮转换的。在书中，我使用这种高亮来引起你对特别值得内容的注意。（我也高亮了章节编号，那仅仅是因为我觉得看起来好看。）\n\
  \n`copy constructor`（拷贝构造函数）用于用相同类型的不同对象初始化对象，而 `copy assignment operator`（拷贝赋值运算符）用于将值从一个对象拷贝到相同类型的对象：\n\
  \n```cpp\nclass Widget {\npublic:\n    Widget();                   // 默认构造函数\n \
  \   Widget(const Widget& rhs);  // 拷贝构造函数\n    Widget& operator=(const Widget& rhs);\
  \ // 拷贝赋值运算符\n    ...\n};\nWidget w1;                  // 调用默认构造函数\nWidget w2(w1);\
  \              // 调用拷贝构造函数\nw1 = w2;                    // 调用拷贝赋值运算符\n```\n\n当你看到看起来像赋值的内容时，请仔细阅读，因为\
  \ `=` 语法也可以用于调用拷贝构造函数：\n\n```cpp\nWidget w3 = w2;             // 调用拷贝构造函数！\n```\n\
  \n\n\n\n\n幸运的是，拷贝构造很容易与拷贝赋值区分来。如果正在定义一个新对象（如上述语句中的 `w3`），则必须调用构造函数；它不可能是赋值。如果没有定义新对象（如上述的\
  \ `w1 = w2` 语句），则不涉及任何构造函数，因此它是一个赋值。\n\n拷贝构造函数是一个特别重要的函数，因为它定义了对象如何通过值传递。例如，考虑以下情况：\n\
  \n```cpp\nbool hasAcceptableQuality(Widget w);\n```\n\n...\n\n```cpp\nWidget aWidget;\n\
  \nif (hasAcceptableQuality(aWidget)) ...\n```\n\n参数 `w`是通过值传递给 `hasAcceptableQuality`\
  \ 的，因此在上述调用中，`aWidget` 被拷贝到 `w` 中。这种拷贝是由 `Widget` 的拷贝构造函数完成的。按值传递意味着“调用拷贝构造函数”。然而，按值传递用户自定义类型通常是个坏主意。通过\
  \ `const` 引用传递通常是更好的选择。更多细节，请参阅第 20 条）。\n\n`STL` 是标准模板库，是 C++ 标准库中专门用于容器（例如 `vector`、`list`、`set`、`map`\
  \ 等）、迭代器（例如 `vector<int>::iterator`、`set<string>::iterator` 等）、算法（例如 `for_each`、`find`、`sort`\
  \ 等）以及相关功能的部分。这些相关功能大部分与函数对象有关：即行为像函数的对象。此类对象来自重载了 `operator()`（函数调用运算符）的类。如果你不熟悉\
  \ `STL`，那么在阅读这本书时，你可能需要一份良好的参考资料，因为 `STL` 太实用了，我不可能利用它。一旦你用过它，你会有同样的感觉。\n\n从 Java\
  \ 或 C# 等语言转向 C++ 的程序员可能会对“未定义行为”这一概念感到惊讶。由于各种原因，C++ 中某些构造结构的行为在字面上根本没有定义：你无法可靠地预测运行时会发生什么。以下是两个具有未定义行为的代码示例：\n\
  \n```cpp\nint *p = 0;                         // p 是空指针\nstd::cout << *p;      \
  \              // 解引用空指针\n                                // 产生未定义行为\nchar name[]\
  \ = \"Darla\";             // name 是大小为 6 的数组（别忘记结尾的空字符！）\nchar c = name[10];  \
  \                // 引用无效的数组索引\n                                // 产生未定义行为\n```\n\
  \n为了强调未定义行为的结果不可预测的且可能非常不愉快，丰富的 C++ 程序员经常说，具有未定义行为的程序可能会擦除你的硬盘。这是真的：一个具有未定义行为的程序确实擦除你的硬盘。但并不可能。更有可能的是程序会表现异常，有时运行正常，有时崩溃，有时又产生错误的结果。有效的\
  \ C++ 程序员会尽力避开未定义行为。在书中，我指出了许多需要留意它的地方。\n\n另一个让从其他语言来到 C++ 的程序员困惑的术语是 `interface`（接口）。Java\
  \ 和 .NET 语言将 `Interfaces` 作为一种语言元素，但 C++ 中没有这种东西，尽管第 31 条讨论了如何模拟它们。当我使用“接口”一词时，我通常指的是函数的签名、类的可访问元素（例如类的“公共接口”、“受保护接口”或“私有接口”），或者使其必须有效的表达式。\n\
  \n### 命名规范\n\n我经常遵循以下规则为指针命名：指向类型 `T` 对象的指针称为 `pt`，即“pointer to T”。以下是一些例子：\n\n\
  ```cpp\nWidget *pw; // pw = 指 Widget 的指针\nAirplane *pa; // pa = 指 Airplane 的指针\n\
  GameCharacter *pgc; // pgc = 指 GameCharacter 的指针\n```\n\n我对引用使用类似的约定：`rw` 可能是对 `Widget`\
  \ 的引用，`ra` 可能是对 `Airplane` 的引用。\n\n在谈论成员函数时，我偶尔使用名称 `mf`。\n\n### 线程考量\n\n作为一种语言，C++\
  \ 没有线程的概念——事实上，没有任何种类的并发的概念。C++ 的标准库也是如此。对于 C++ 而言，多线程程序并不存在。\n\n\n\n\n但它们确实如此。我在书中的重点是标准的、可移植的\
  \ C++，但我无法忽视线程安全是许多程序员面临的问题这一事实。我处理标准 C++ 与现实之间这种鸿沟的方法，是指出我所研究的 C++ 构造在线程环境中可能导致问题的地方。这并不意味着这本书是一本关于使用\
  \ C++ 进行多线程编程的书。恰恰并非如此。相反，它是一本关于 C++ 编程的书，虽然它很大程度上局限于单线程考虑，但它承认了多线程的存在，并试图指出具有线程意识的程序员在评估我提供的建议时，需要特别注意的地方。\n\
  \n如果你对多线程不熟悉，或者没有需要担心它，可以忽略我与线程相关的言论。然而，如果你正在编写多线程应用程序或库，请记住，我的注释仅仅是你在使用 C++ 时需要解决的问题的起点。\n\
  \n## TR1 和 Boost\n\n你将在书中到处找到对 TR1 和 Boost 的引用。每一者都有一个 `Item`（项目）对它们进行了详细的描述（TR1\
  \ 参见 Item 54，Boost 参见 Item 55），但遗憾的是，这些 `Items` 位于书的末尾。（放在那里是因为效果更好。真的。我在许多其他地方尝试过它们。）如果你愿意，可以现在就翻到那些\
  \ `Items` 阅读它们，但如果你更倾向于从开头而不是结尾开始这本书，那么下面的执行摘要可以让你应付过去：\n\n- TR1（“技术报告 1”）是为 C++\
  \ 标准库添加新功能的规范。这些功能以新类模板和函数模板的形式存在，用于哈希表、引用计数智能指针、正则表达式等。所有 TR1 组件都位于 `tr1` 命名空间，该命名空间嵌套在\
  \ `std` 命名空间内部。\n\n- Boost 是一个组织也是一个网站（[`boost.org`](http://boost.org)），提供可移植的、经过同行评审的开源\
  \ C++ 库。大多数 TR1 功能都基于在 Boost 中完成的工作，在编译器厂商将 TR1 包含在他们的 C++ 库发行版之前，Boost 网站可能是寻找\
  \ TR1 实现的开发者的首选。然而，Boost 提供的功能多于 TR1 提供的，因此无论如何，了解它都是值得的。\n\n# 1. 适应 C++\n\n无论你的编程背景如何，\
  \ C++ 可能都需要一点时间来适应。它是一种强大的语言，拥有极其广泛的特征，但在你利用这种力量并有效使用这些特征之前，你必须习惯 C++ 的处理方式。整本书都在关于这是如何做到的，但某些事情比其他事情更基础，而这一章是关于所有事情中最基础的那些。\n\
  \n### Item 1：将 C++ 视为语言的联邦\n\n起初，C++ 只是加上了一些面向对象特征的 C。即使是 C++ 最初的名称“带类的 C（C with\
  \ Classes）”也反映了这种简单的传承。\n\n随着语言的成熟，它变得更加大胆和更具冒险性，采纳了与“带类的 C”不同的思想、特征和编程策略。异常处理需要不同的函数结构化方法（参见\
  \ Item 29）。模板催生了设计的新思考方式（参见 Item 41），而 STL 定义了一种与大多数人从未见过的扩展性方法。\n\n如今的 C++ 是一种*多范式编程语言*，支持过程、面向对象、函数、泛型和元编程特征的结合。这种力量和灵活性使\
  \ C++ 成为一个无与伦比的工具，但也可能导致一些困惑。所有的“正确用法”规则似乎都有例外。我们该如何理解这样的语言呢？\n\n最好的方法是将 C++ 不要看作一种单一语言，而是是一一组相关语言的联邦。在一个特定的子语言中，规则往往是简单、直观且于于的。然而，当你从一个子语言移动到另一个子语言时，规则可能会发生。要理解\
  \ C++，你必须识别它的主要子语言。幸运的是，只有四个：\n\n- **C。** 在非常深层，C++ 仍然基于 C。块、语句、预处理器、内置数据类型、数组、指针等，都源自\
  \ C。在许多情况下，C++ 为问题提供的方法优于它们对应的 C 语言方法（例如，参见 Items 2（预处理器的替代方案）和 13（使用对象管理资源）），但当你发现自己在处理\
  \ C++ 的 C 部分时，有效编程的规则反映了 C 更有限的范围：没有模板、没有异常、没有重载等。\n\n- **面向对象的 C++。** C++ 的这部分是“带类的\
  \ C”的核心内容：类（包括构造函数和析构函数）、封装、继承、多态、虚函数（动态绑定）等。这是 C++ 中最直接适用于经典面向对象设计规则规则部分。\n\n-\
  \ **模板 C++。** 这是 C++ 的泛型编程部分，也是大多数程序员经验最少的部分。模板考量贯穿于 C++，良好的编程规则包含特殊的仅限模板的子句并不罕见（例如，参见\
  \ Item 46 关于促进函数调用中的类型转换）。事实上，模板如此强大，以至于产生了一种全新的编程范式，*模板元编程*（TMP）。Item 48 提供了 TMP\
  \ 的概述，但除非你是一个硬核模板迷，否则你不需要担心它。\n\n- **STL。** STL 当然是一个模板库，但它是一个非常特殊的模板库。它关于容器、迭代器、算法和对象的约定完美契合，但模板也可以围绕其他思想构建。STL\
  \ 有其特定的处理方式，当你使用 STL 时，需要确保遵循它的约定。\n\n记住这四个子语言，当你发现从一个子语言切换到另一个子语言时，有效编程需要改变策略时，不要感到意外。例如，对于内置（即\
  \ C 类的）类型，按值传递通常比按引用传递更高效，但当你从 C++ 的 C 部分移动到面向对象的 C++ 时，用户定义构造函数和析构函数的存在意味着按引用传递通常更好。这在模板\
  \ C++ 中工作时尤其如此，因为在那里你甚至不知道正在处理的对象类型。然而，当你跨入 STL 时，你知道迭代器和函数对象是基于 C 指针建模的，因此对于 STL\
  \ 中的迭代器和函数对象，传统的 C 按值规则再次适用。（关于选择参数传递选项的所有细节，请参见 Item 20。）\n\n那么，C++ 并不是具有单一一套规则的统一语言；它是四个子语言的联邦，每种语言都有自己的约定。记住这些子语言，你会发现\
  \ C++ 容易理解得多。\n\n要记住的事\n\n- 取决于你使用的 C++ 部分，有效 C++ 编程的规则各异。\n\n### Item 2：用 `const`、`enum`\
  \ 和 `inline` 使用 `#define`\n\n这个项目可能被称为“使用编译器代替预处理器”，因为 `#define` 可能被视为不是语言本身的一部分。这是它的问题之一。当你执行这样的操作时，\n\
  \n```cpp\n#define ASPECT_RATIO 1.653\n```\n\n\n\n\n符号名 `ASPECT_RATIO` 可能永远不会被编译器看到；它可能在源代码到达编译器之前就被预处理器处理掉了。因此，`ASPECT_RATIO`\
  \ 这个名称可能不会被存入符号表。如果在编译过程中遇到涉及该常量的错误，这可能会让你困惑，因为错误信息可能指的是 `1.653` 而不是 `ASPECT_RATIO`。如果\
  \ `ASPECT_RATIO` 定义在一个你没有编写的头文件中，你将不知道那个 `1.653` 是从哪里来的，并浪费时间去追踪它。这个问题也可能在符号调试器中出现，因为同样，你程序程序中使用的名称可能不在符号表中。\n\
  \n解决方案是将宏替换为常量：\n\n```cpp\nconst double AspectRatio = 1.653; // 大写名称通常用于\n     \
  \                            // 宏，因此更改了名称\n```\n\n作为语言常量，`AspectRatio`一定会被编译器看到，并且一定会被放入它们的符号表。此外，对于浮点常量（例如在本例中），使用常量可能比使用\
  \ `#define` 产生更小的代码。这是因为预处理器盲目地将宏名 `ASPECT_RATIO` 替换为 `1.653` 可能会导致目标代码中出现多个 `1.653`\
  \ 副本，而使用常量 `AspectRatio` 则绝不会产生多个副本。\n\n在将 `#define` 替换为常量时，有两个特殊情况值得注意。第一个是定义常量指针。由于常量定义通常放在头文件中（许多不同的源文件会包含它们），因此将*指针*本身声明为\
  \ `const` 是很重要的，通常除了指针所指向的类型之外还要这样声明。例如，为了在头文件中定义一个基于 `char*` 的常量字符串，你必须写两次 `const`：\n\
  \n```cpp\nconst char * const authorName = \"Scott Meyers\";\n```\n\n关于 `const` 的含义和用法的完整讨论，特别是结合指针时，请参见\
  \ Item 3。然而，这里仍值得提醒你，`string` 对象通常比其基于 `char*` 的祖先更好，因此 `authorName` 通常用这种方式定义更好：\n\
  \n```cpp\nconst std::string authorName(\"Scott Meyers\");\n```\n\n第二个特殊情况涉及类特定的常量。要将常量的范围限制在一个类中，你必须使其成为成员；为了确保常量最多有一个副本，你必须使其成为*静态*成员：\n\
  \n```cpp\nclass GamePlayer {\nprivate:\n  static const int NumTurns = 5; // 常量声明\n\
  \  int scores[NumTurns];           // 常量的使用\n  ...\n};\n```\n\n你上面看到的是 `NumTurns`\
  \ 的*声明*，而不是定义。通常情况下，C++ 要求你对所使用的任何内容提供定义，但静态且为整数类型（例如整数、`char`、`bool`）的类特定常量是一个例外。只要你不获取它们的地址，你就可以声明并使用它们，而无需提供定义。如果你确实获取了类常量的地址，或者你的编译器即使在你不获取地址的情况下也错误地坚持要求定义，则需要像这样提供一个单独的定义：\n\
  \n```cpp\nconst int GamePlayer::NumTurns; // NumTurns 的定义；请参见\n                \
  \                 // 下文了解为什么没有赋值\n```\n\n你将此放在实现文件中，而不是头文件中。因为类常量的初始值是在常量声明的地方提供的（例如，`NumTurns`\
  \ 在声明时被初始化为 5），所以在定义点不允许有初始值。\n\n顺便提一下，无法使用 `#define` 创建类特定常量，因为 `#define` 不尊重作用域。一旦宏被定义，它在整个编译过程中都有效（除非在中间某处被\
  \ `#undef` 了）。这意味着 `#define` 不仅不能用于类特定常量，而且不能用于提供任何形式的封装，即不存在所谓的“私有”`#define`。当然，`const`\
  \ 数据成员是可以被封装的；`NumTurns` 就是如此。\n\n旧版本的编译器可能不接受上面的语法，因为以前在声明点为静态类成员提供初始值是不合法的。此外，类内初始化仅允许用于整数类型，且仅仅用于常量。在无法使用上述语法的情况下，你将初始值放在定义点：\n\
  \n```cpp\nclass CostEstimate {\nprivate:\n  static const double FudgeFactor; //\
  \ 静态类常量声明\n  ...                              // 常量；放在头文件\n};\n\nconst double CostEstimate::FudgeFactor\
  \ = 1.35; // 常量；放在实现文件\n```\n\n在几乎所有情况下，这些就足够了。唯一的例外是你在编译期间需要类常量的值。\n\n### \"枚举黑科技\
  \ (the enum hack)\"\n\n枚举黑科技是一种用于补偿那些坚持要求为静态整数常量提供定义的编译器的技术。例如，为了知道数组的大小，`GamePlayer`\
  \ 可以这样定义：\n\n```cpp\nclass GamePlayer {\nprivate:\n  enum { NumTurns = 5 }; // 枚举黑科技\n\
  \  int scores[NumTurns];   // 没问题\n  ...\n};\n```\n\n了解枚举黑科技有几个值得考虑的原因。首先，枚举黑科技在某些方面的行为更像\
  \ `#define` 而不是 `const`，有时这正是你需要的。例如，获取 `const` 的地址是合法的，但获取枚举的地址是不合法的。如果你不想让人们获取常量的指针或引用，枚举是一个很好的约束方法。（有关通过编码决策实施设计约束，请参阅\
  \ Item 18).此外，尽管良好的编译器不会为 `const` 对象分配存储（除非创建对象的指针或引用），但糟糕的编译器可能会，而 `#define` 一样枚举不会导致这种不必要的分配。\n\
  \n了解枚举黑科技的第二个原因纯粹出于实用。大量的代码使用了它，所以当你看到它时需要识别它。事实上，枚举黑科技是模板元编程的一种基础技术（参见 Item 48).\n\
  \n### 宏\n\n回到预处理器，`#define` 指令的另一种常见（误）用是用它实现看起来像函数但不会产生函数调用开销的宏。这里有一个根据宏参数的较大值调用某个函数\
  \ `f`：\n\n```cpp\n// 使用 a 和 b 的最大值调用 f\n#define CALL_WITH_MAX(a, b) f((a) > (b)\
  \ ? (a) : (b))\n```\n\n这样的宏有太多缺点，仅仅是它们就让人痛苦。\n\n每当你编写这种宏时，都必须记住对宏体中的所有参数加括号。否则，当有人调用宏并传入表达式时，就会遇到麻烦。但即使你处理好了这一点，看看可能发生的怪事：\n\
  \n```cpp\nint a = 5, b = 0;\nCALL_WITH_MAX(++a, b);    // a 增加了两次\nCALL_WITH_MAX(++a,\
  \ b+10); // a 增加了一次\n```\n\n在这里，`a` 在调用 `f` 之前增加的次数取决于它与什么进行比较！\n\n\n\n\n幸运的是，你不需要忍受这些胡话。通过为内联函数使用模板，你可以获得宏的所有高效性，同时获得普通函数的可预测行为和类型安全（参见\
  \ Item 30）：\n\n```cpp\ntemplate<typename T>             // 因为我们不知道\ninline void\
  \ callWithMax(const T& a, const T& b) // 知道 T 是什么，我们\n{                        \
  \        // 按常量引用传递-\n    f(a > b ? a : b);             // reference-to-const —\
  \ 参见 Item 20\n}\n```\n\n这个模板生成了一整系列函数，每个函数都接受两个相同类型的对象，并用这两个对象中较大的一个调用 `f`。在函数体内部不需要对参数加括号，不需要担心参数被多次求值等。此外，由于\
  \ `callWithMax` 是一个真正的函数，它遵循作用域和访问规则。例如，讨论一个类私有的内联函数是完全合理的。通常情况下，使用宏无法做到这一点。\n\n\
  考虑到 `const`、`enum` 和 `inline` 的可用，你对预处理器（尤其是 `#define`）的需求减少了，但并未被消除。`#include`\
  \ 仍然至关重要，`#ifdef`/`#ifndef` 继续在控制编译中发挥重要作用。现在还没到退休预处理器的时候，但你应该给它放长而频繁的假。\n\n###\
  \ 需要记住的事项\n\n- 对于简单的常量，优先使用 `const` 对象或 `enums` 而不是 `#define`。\n- 对于类函数的宏，优先使用 `inline`\
  \ 函数而不是 `#define`。\n\n### Item 3: 尽可能地使用 `const`\n\n`const` 的奇妙之处在于，它允许你指定一种语义约束——某个特定对象不应被修改——而编译器会强制该约束。它允许你向编译器和其他程序员传达一个值应该保持不变的信息。只要这种情况下属实，你就应该确保明确说明这一点，因为这样你就征得了编译器的帮助，以确保该约束不被违反。\n\
  \n`const` 关键字非常多能。在类之外，你可以将它用于全局或命名空间作用范围内的常量（参见 Item 2），还可以用于在文件、函数或块作用域内声明为 `static`\
  \ 的对象。在类内部，你可以将其同时用于静态和非静态数据成员。对于指针，你可以指定指针本身是 `const`、它所指向的数据是 `const`、两者都是，或者两者都不是：\n\
  \n```cpp\nchar greeting[] = \"Hello\";\n\nchar *p = greeting;               // 非\
  \ const 指针\n                                // 非 const 数据\nconst char *p = greeting;\
  \         // 非 const 指针\n                                // const 数据\nchar * const\
  \ p = greeting;        // const 指针，\n                                // 非 const\
  \ 数据\nconst char * const p = greeting;  // const 指针，\n                         \
  \       // const 数据\n```\n\n这种语法并没有看起来那样随心所欲。如果 `const` 单词出现在星号左侧，则所指向的内容是常量；如果\
  \ `const` 单词出现在星号右侧，则指针本身是常量；如果 `const` 出现在两侧，则两者都是常量。当所指向的内容是常量时，有些程序员在类型之前列出 `const`。另一些人将其列在类型之后、星号之前。这在意义上没有区别，因此以下函数接收相同的类型：\n\
  \n```cpp\nvoid f1(const Widget *pw); // f1 接收一个指向常量对象的指针\nvoid f2(Widget const *pw);\
  \ // f2 也是如此\n```\n\n由于两种形式都存在于代码中，你应该习惯这两种。STL 迭代器是基于指针的，因此 `iterator` 的行为非常像 `T*`\
  \ 指针。声明一个 `iterator const` 就像声明 `pointer const`（即声明 `T* const`）：迭代器不允许允许指向不同的内容，但它所指向的内容可以被修改。如果你想要一个指向不可修改内容的迭代器（即\
  \ STL 中类似于 `const T*` 指针的对应物），你需要一个 `const_iterator`：\n\n```cpp\nstd::vector<int>\
  \ vec;\n\nconst std::vector<int>::iterator iter = vec.begin(); // iter 的行为像 T* const\n\
  *iter = 10;                                        // OK，改变 iter 指向的内容\n++iter;\
  \                                            // 错误！iter 是 const\n\nstd::vector<int>::const_iterator\
  \ cIter = vec.begin(); // cIter 的行为像 const T*\n*cIter = 10;                    \
  \                   // 错误！*cIter 是 const\n++cIter;                             \
  \              // 好的，改变 cIter\n\n\n```\n\n`const` 最强大的用途源于它在函数声明中的应用。在函数声明中，`const`\
  \ 可以引用函数的返回值、单个参数，并且对于成员函数，可以引用整个函数。\n\n让函数返回一个常量值通常是不恰当的，但有时这样做可以在不放弃安全或效率的情况下减少客户端错误的发生率。例如，考虑在\
  \ Item 24 中探讨的有理数的 `operator*` 函数声明。\n\n```cpp\nclass Rational { ... };\nconst Rational\
  \ operator*(const Rational& lhs, const Rational& rhs);\n```\n\n许多程序员在第一次看到这个时会眯起眼睛。为什么\
  \ `operator*` 的结果应该是一个 `const` 对象？因为如果不是，客户端就能执行诸如下的行：\n\n```cpp\nRational a, b,\
  \ c;\n...\n(a * b) = c; // 对 a*b 调用 operator=\n```\n\n我不知道为什么会有程序员想要给两个数字的乘积赋值，但我知道许多程序员确实尝试过这样做。如果\
  \ `a` 和 `b` 是内置类型，这种代码将完全是非法的。这只需要一个简单的拼写错误（以及可以转换为 `bool` 的类型）：\n\n```cpp\nif (a\
  \ * b = c) // 噢，想做比较！\n```\n\n良好的自定义类型标志之一是避免与内置类型产生偶然的不兼容（另见 Item 18），而将 `operator*`\
  \ 的返回值声明为 `const` 正防止了这种情况，这就是为什么在这种情况下它是正确的做法。\n\n对于 `const` 参数并没有什么特别新奇——它们的作用就像局部\
  \ `const` 对象一样，你应该尽可能在都使用它们。除非你需要能够修改参数或本地对象，否则请确保将其声明为 `const`。这只需要花费输入六个字符的精力，但它可以防止你遇到我们刚刚看到的这种“我想打\
  \ '==' 却不小心打了 '='”的错误。\n\n### const 成员函数\n\n成员函数上 `const` 的目的是标识哪些成员函数可以被 `const`\
  \ 对象调用。这些成员函数出于两个原因非常重要。首先，它们让类的接口更容易理解。了解哪些函数可以修改对象而哪些不可以是非常关重要的。其次，它们使得与 `const`\
  \ 对象工作成为可能。这是编写高效代码的关键方面，因为正如 Item 20 所解释的，提高 C++ 程序性能的根本方法之一是通过常量引用传递对象。只有当存在 `const`\
  \ 成员函数来操作生成的 `const` 限定对象时，这种技术才是可行的。\n\n许多人忽略了成员函数仅在常量性不同时就可以重载的事实，但是 C++ 的一个重要特性。考虑一个表示文本块的类：\n\
  \n```cpp\nclass TextBlock {\n\npublic:\n```\n\n\n\n\n```cpp\nconst char& operator[](std::size_t\
  \ position) const   // 用于 const 对象的 operator[]\n{ return text[position]; }     \
  \                    // \n\nchar& operator[](std::size_t position)             \
  \  // 用于非 const 对象的 operator[]\n{ return text[position]; }                     \
  \    // \n\nprivate:\n    std::string text;\n};\n```\n\n`TextBlock` 的 `operator[]`\
  \ 们可以这样使用：\n\n```cpp\nTextBlock tb(\"Hello\");\nstd::cout << tb[0];            \
  \      // 调用非 const 的\n                                     // TextBlock::operator[]\n\
  const TextBlock ctb(\"World\");\nstd::cout << ctb[0];                  // 调用 const\
  \ TextBlock::operator[]\n```\n\n顺便说，`const` 对象在程序中通常是因为通过指针或 `const` 引用传递的。上面的 `ctb`\
  \ 例子是人为的。下面更真实：\n\n```cpp\nvoid print(const TextBlock& ctb)    // 在此函数中，ctb 是 const\n\
  {\n  cout << ctb[0];              // 调用 const TextBlock::operator[]\n  ...\n}\n\
  ```\n\n通过重载 `operator[]` 并赋予不同版本不同的返回类型，你可以对 `const` 和非 `const` `TextBlock` 进行区别处理：\n\
  \n```cpp\ncout << tb[0];                  // 正常 — 读取\n                         \
  \            // 非 const TextBlock\ntb[0] = 'x';                        // 正常 — \n\
  \                                     // 非 const TextBlock\ncout << ctb[0];    \
  \             // 正常 — 读取\n                                     // const TextBlock\n\
  ctb[0] = 'x';                       // 错误！— \n                                 \
  \    // const TextBlock\n```\n\n注意这里的错误仅与调用的 `operator[]` 的**返回类型**有关；`operator[]`\
  \ 的调用本身都是正常的。错误由于尝试对 `const&` 进行赋值，因为那是 `const` 版本 `operator[]` 的返回类型。另外注意，非 const\
  \ `operator[]` 的返回类型是 `char` 的**引用** —— `char` 本身是不行的。如果 `operator[]` 返回简单的 `char`，那么\
  \ `tb[0] = 'x'` 这样的语句将无法编译，因为 C++ 按值返回对象（见第 20 章），这意味着修改的是 `text[0]` 的*拷贝*而不是 `text[0]`\
  \ 本身，这并不是你想要的行为。\n\n### 位常量 vs 逻辑常量\n\n让我们花一点时间讨论一下哲学问题。成员函数是 `const` 意味着什么？有两个概念：**位常量**（bitwise\
  \ constness，也称为物理常量）和**逻辑常量**（logical constness）。\n\n位常量认为，当且仅当成员函数没有修改对象的任何成员变量（静态变量除外）时，它就是常量，即它没有修改对象内部的任何位。位常量的优点是它易于检测：编译器只需查找对成员变量的赋值。事实上，位常量是\
  \ C++ 常量的定义，`const` 成员函数不允许修改其调用对象的任何非静态成员变量。\n\n遗憾的是，许多并非 `const` 的成员函数通过了位常量测试。特别是，修改指针所指向内容的成员函数并不是常量。但如果对象中只有**指针**，函数就是位常量，编译器不会报错。这会导致违背直觉的行为。例如，假设我们有一个类似于\
  \ `TextBlock` 的类，它将数据存储为 `char*` 而不是 `string`，因为它需要通过一个无法理解 `string` 对象的 C API 进行通信。\n\
  \n```cpp\nclass CTextBlock {\npublic:\n  ...\n  char& operator[](std::size_t position)\
  \ const // 不恰当（但符合位常量）声明\n  { return pText[position]; }                   // operator[]\n\
  private:\n  char *pText;\n};\n```\n\n这个类将 `operator[]` 声明为 `const` 成员函数，尽管该函数返回对象内部数据的引用（该主题在第\
  \ 28 章深入讨论）。忽略这一点，注意 `operator[]` 的实现并没有以任何方式修改 `pText`。结果是，编译器会乐意为 `operator[]`\
  \ 生成代码；毕竟它是位常量的，而编译器只检查这一点。但看它允许发生什么：\n\n```cpp\nconst CTextBlock ctb(\"Hello\"\
  );      // 声明常量对象\nchar *pc = &ctb[0];                  // 调用 const operator[] 获取\
  \ ctb 数据的指针\n*pc = 'J';                          // ctb 现在变成了 \"Jello\"\n```\n\n\
  当你创建一个特定值的常量对象并仅对其调用 `const` 成员函数时，却仍然改变了它的值，这显然有问题！\n\n这引出了逻辑常量的概念。这一哲学的追随者认为，`const`\
  \ 成员函数可能会修改其调用对象的某些位，但仅以客户端无法检测的方式进行。例如，你的 `CTextBlock` 类可能想在每次请求文本块时缓存其长度：\n\n\
  ```cpp\nclass CTextBlock {\npublic:\n  ...\n  std::size_t length() const;\nprivate:\n\
  \  char *pText;\n  std::size_t textLength;             // 文本块长度\n  bool lengthIsValid;\
  \                 // 长度是否有效\n};\n\nstd::size_t CTextBlock::length() const\n{\n \
  \ if (!lengthIsValid) {\n    textLength = std::strlen(pText);\n    lengthIsValid\
  \ = true;\n  }\n  return textLength;\n}\n```\n\n`mutable` 是解决“我想要的不是位常量”问题的一个很好的方案，但它不能解决所有与\
  \ `const` 相关的困难。例如，假设 `TextBlock` 中的 `operator[]` 不仅返回相应字符的引用，还执行边界检查，可能还进行了数据验证。将所有这些都放入\
  \ `const` 和非 `const` 版本的 `operator[]` 函数中（而不担心我们现在有了隐式内联函数——见第 30 章），会产生这种畸形：\n\n\
  ```cpp\nclass TextBlock {\npublic:\n  ...\n  const char& operator[](std::size_t\
  \ position) const\n  {\n    ...                             // 执行边界检查\n    ... \
  \                            // 记录访问数据\n    ...                             // 验证数据完整性\n\
  \    return text[position];\n  }\n};\n```\n\n\n\n\n\n```cpp\n    ... // 进行边界检查\n\
  \    ... // 记录访问数据\n    ... // 验证数据完整性\n    return text[position];\n\n}\n\nprivate:\n\
  \    std::string text;\n};\n```\n\n哎呀！你能考虑到代码重复，以及随之而来的编译时间、维护和代码膨胀带来的头疼问题吗？当然，将边界检查等所有代码移动到一个独立的成员函数（自然然是私有的）中并让两个版本的\
  \ `operator[]` 都调用它，是可行的，但你仍然会有对该函数的重复调用，而且仍然有重复的 `return` 语句代码。\n\n你真正想要做的是只实现一次\
  \ `operator[]` 功能并使用两次。也就是说，你希望让其中一个版本的 `operator[]` 调用另一个版本。这这就引出了我们要说的：去掉 `const`\
  \ 属性（casting away constness）。\n\n从一般规则来说，类型转换是一个非常糟糕的主意，我甚至专门用了一整个章节（Item）来告诉你不要这样做（Item\
  \ 27），但代码重复也绝不是好事事。在这种情况下，`operator[]` 的 `const` 版本所做的与非 `const` 版本完全相同，它只是具有带有\
  \ `const` 修饰符的返回类型。在这种情况下，去掉返回值上的 `const` 属性是安全的，因为任何调用非 `const operator[]` 的调用者本来就已经拥有一个非\
  \ `const` 对象。否则，他们根本无法调用非 `const` 函数。因此，让非 `const` 的 `operator[]` 调用 `const` 版本是避免代码重复的一种安全方法，尽管这需要进行类型转换。代码如下，但在你读完后续的解释后，它可能会更清晰：\n\
  \n```cpp\nclass TextBlock {\npublic:\n    ...\n\n    const char& operator[](std::size_t\
  \ position) const // 与之前相同\n    {\n        ...\n        ...\n        ...\n     \
  \   return text[position];\n    }\n\n    char& operator[](std::size_t position)\
  \ // 现在只是调用 const op[]\n    {\n        return\n            const_cast<char&>( //\
  \ 去掉 op[] \n                               // 返回类型上的 const;\n                  \
  \             static_cast<const TextBlock&>(*this) // 为 *this 的类型添加 const;\n   \
  \         [position] // 调用 const 版本的 op[]\n            );\n    }\n...\n};\n```\n\
  \n你可以看到，代码中有两次转换，而不是一个。我们希望非 `const` 的 `operator[]` 调用 `const` 版本，但如果我们在非 `const`\
  \ 的 `operator[]` 内部直接调用 `operator[]`，就会递归地调用自己。这只在前百万次左右可能挺好玩的。为了避免无限递归，我们必须指定想要调用\
  \ `const operator[]`，但没有直接的方法可以做到这一点。相反，我们将 `*this` 从它的原始类型 `TextBlock&` 转换为 `const\
  \ TextBlock&`。是的，我们使用类型转换来添加 `const`！所以我们有两个转换：一个是为了给 `*this` 添加 `const`（这样我们对 `operator[]`\
  \ 的调用就会调用 `const` 版本），第二个是为了移除 `const operator[]` 返回值上的 `const`。\n\n添加 `const` 的转换仅仅是强制进行一种安全的转换（从非\
  \ `const` 对象到 `const` 对象），因此我们对它使用 `static_cast`。而移除 `const` 的转换只能通过 `const_cast`\
  \ 完成，所以我们并没有真正的选择。（技术上，我们有。使用 C 风格的转换也可以，但正如我在 Item 27 中解释的那样，这种转换很少是正确的选择。）\n\n\
  除此之外，我们在这个示例中调用了一个运算符，所以语法有点奇怪。这个结果可能赢得不了任何审美比赛，但它确实达到了预期的效果：通过基于 `const` 版本实现非\
  \ `const` 版本的 `operator[]` 来避免代码重复。实现该目标是否值得付出这种代价由你决定，但这种通过其 `const` 孪生版本来实现非 `const`\
  \ 成员函数的技巧绝对值得了解。\n\n更值得了解的是，尝试反过来做——通过让 `const` 版本调用非 `const` 版本来避免重复——这并不是你想做的事。记住，`const`\
  \ 成员函数承诺永远不会改变对象的逻辑状态，但非 `const` 函数没有做这样的承诺。如果你从 `const` 函数中调用非 `const` 函数，你就会面临你承诺过不修改的对象可能被修改的风险。这就是为什么让\
  \ `const` 成员函数调用非 `const` 函数是错误的：事实上，为了让代码编译，你必须使用 `const_cast` 来去掉 `*this` 上的 `const`，这是一个明显的麻烦信号。反向调用——我们使用的这种方法——是安全的：非\
  \ `const` 成员函数可以对对象做任何事情，因此调用 `const` 成员函数不会产生风险。这就是为什么在这种情况下 `static_cast` 在 `*this`\
  \ 上是有效的：没有与 `const` 相关的危险。\n\n正如我在这个 Item 开头提到的，`const` 是一个很好的东西。在指针和迭代器上；在指针、迭代器和引用引用的对象上；在函数参数和返回类型上；在局部变量上；以及成员函数上，`const`\
  \ 是一个强大的盟。尽可能使用它。\n\n**需要记住的**\n\n- 对某些声明 `const` 有助于编译器检测错误。`const` 可以应用于任何作用域的对象、函数参数和返回类型以及成员函数。\n\
  - 编译器强制位常量（bitwise constness），但我们应该使用逻辑常量（conceptual constness）。\n- 当 `const` 和非\
  \ `const` 成员函数的实现基本相同时，可以通过让非 `const` 版本调用 `const` 版本来避免代码重复。\n\n### Item 4：确保对象在使用之前已初始化\n\
  \nC++ 在初始化对象值方面似乎相当反复无常。例如，如果你说：\n\n```cpp\nint x;\n```\n\n在某些情况下，`x` 保证会被初始化（为\
  \ 0），但在其他地方不是。如果你这样说：\n\n```cpp\nclass Point {\n    int x, y;\n};\n\nPoint p;\n\
  ```\n\n`p` 的数据成员有时会被初始化（为 0），但有时不会。如果你是从一种不存在未初始化对象的语言过来的，请注意，因为这是重要的。\n\n读取未初始值会产生未定义行为。在某些平台上，读取未初始化值本身就会导致程序停止。更常见的情况下，读取结果将是半随机位，这些位会污染你读取入的对象，最终导致难以理解的程序行为。\n\
  \n\n\n\n\n对于其他几乎所有情况，初始化的责任在于构造函数。那里的规则很简单：确保所有构造函数都初始化了对象中的所有内容。\n\n这条规则很容易遵循，但重要的是不要将“赋值”与“初始化”混淆。考虑一个表示地址簿录条目的类构造函数：\n\
  \n```cpp\nclass PhoneNumber { ... };\n```\n\n```cpp\nclass ABEntry { // ABEntry\
  \ = \"地址簿录条目\" \n\npublic:\n  ABEntry(const std::string& name, const std::string&\
  \ address,\n          const std::list<PhoneNumber>& phones);\nprivate:\n  std::string\
  \ theName;\n  std::string theAddress;\n  std::list<PhoneNumber> thePhones;\n  int\
  \ numTimesConsulted;\n};\n\nABEntry::ABEntry(const std::string& name, const std::string&\
  \ address,\n                 const std::list<PhoneNumber>& phones)\n{\n  theName\
  \ = name;               // 这些都是赋值，\n  theAddress = address;        // 而不是初始化\n \
  \ thePhones = phones;\n  numTimesConsulted = 0;\n}\n```\n\n这将产生具有你预期值的 `ABEntry`\
  \ 对象，但仍然不是最好的方法。C++ 的规则规定对象的数据成员在进入构造函数体*之前*就已经初始化了。在 `ABEntry` 构造函数内部，`theName`、`theAddress`\
  \ 和 `thePhones` 并没有被初始化，它们是在被*赋值*。初始化发生在更早——在进入 `ABEntry` 构造函数体之前，自动调用了它们的默认构造函数。对于\
  \ `numTimesConsulted` 来说情况并不如此，因为它是一个内置类型。对于它，无法保证在赋值之前是否已经进行过初始化。\n\n编写 `ABEntry`\
  \ 构造函数的另一种更好方法是使用成员初始化列表而不是赋值：\n\n```cpp\nABEntry::ABEntry(const std::string& name,\
  \ const std::string& address,\n                 const std::list<PhoneNumber>& phones)\n\
  : theName(name),\n  theAddress(address),         // 现在这些都是初始化\n  thePhones(phones),\n\
  \  numTimesConsulted(0)\n{} // 构造函数体现在是空的\n```\n\n这个构造函数产生了与上一个相同的最终结果，但通常会更高效。基于赋值的版本首先调用默认构造函数来初始化\
  \ `theName`、`theAddress` 和 `thePhones`，然后立即在默认构造的基础上的基础上赋了新值。因此，在那些默认构造中执行的所有工作都被浪费了。成员初始化列表方法避免了这个问题，因为初始化列表中的参数被用作各种数据成员的构造函数参数。在这种情况下，`theName`\
  \ 是从 `name` 拷贝构造的，`theAddress` 从 `address` 拷贝构造的，`thePhones` 从 `phones` 拷贝构造的。对于大多数类型，调用一次拷贝构造函数比调用一次默认构造函数再调用一次拷贝赋值运算符要高效得多——有时是*高得多*。\n\
  \n对于像 `numTimesConsulted` 这样的内置类型对象，初始化和赋值的成本没有区别，但为了一致性，通常最好通过成员初始化来初始化所有内容。同样，即使你想对一个数据成员进行默认构造，你也可以使用成员初始化列表；只需将初始化参数留为空即可。例如，如果\
  \ `ABEntry` 有一个不带参数的构造函数，可以这样实现：\n\n```cpp\nABEntry::ABEntry()\n: theName(),   \
  \              // 调用 theName 的默认构造函数；\n  theAddress(),              //对 theAddress\
  \ 执行同样的操作；\n  thePhones(),\n  numTimesConsulted(0)\n{}\n```\n\n\n\n\n那么，我们关注的问题涉及至少两个单独编译的源文件，每个文件至少包含一个非局部静态对象（即全局对象、命名空间作用范围内的对象，或在类中为\
  \ `static` 或在文件范围内的对象）。而实际的问题在于：如果一个翻译单元中非局部静态对象的初始化使用了另一个翻译单元中的非局部静态对象，那么它所使用的该对象可能尚未被初始化，因为*定义在不同翻译单元中的非局部静态对象之间的初始化相对顺序是未定义的*。\n\
  \n举个例子会有帮助。假设你有一个 `FileSystem` 类，它能让互联网上的文件看起来像本地文件一样。由于你的类让世界看起来像一个单一的文件系统，你可能会在全局或命名空间范围内创建一个特殊对象来表示这个单一文件系统：\n\
  \n```cpp\nclass FileSystem {                  // 来自你的库\n\npublic:\n\n  ...\n\n \
  \ std::size_t numDisks() const;      // 许多成员函数之一\n\n  ...\n};\n\nextern FileSystem\
  \ tfs;              // 客户端使用的对象；\n                                   // \"tfs\"\
  \ = \"the 文件系统\"\n```\n\n`FileSystem` 对象显然是非平凡的，因此在它构造之前使用 `theFileSystem` 对象将是灾难性的。\n\
  \n现在，假设某个客户端为文件系统中的目录创建了一个类。自然地，他们的类使用了 `theFileSystem` 对象：\n\n```cpp\nclass Directory\
  \ {                  // 由库客户端创建\n\npublic:\n\n  Directory( params );\n\n  ...\n\
  };\n\nDirectory::Directory( params )\n{\n\n  ...\n  std::size_t disks = tfs.numDisks();\
  \   // 使用 tfs 对象\n\n  ...\n}\n```\n\n进一步假设该客户端决定为临时文件创建一个单一的 `Directory` 对象：\n\n\
  ```cpp\nDirectory tempDir( params );        // 用于临时文件的目录\n```\n\n现在，初始化顺序的重要性变得显而易见了：除非\
  \ `tfs` 在 `tempDir` 之前初始化，否则 `tempDir` 的构造函数将尝试在 `tfs` 初始化之前使用它。但 `tfs` 和 `tempDir`\
  \ 是由不同的人在不同的时间在不同的源文件中创建的——它们是定义在不同翻译单元中的非局部静态对象。你如何能确定 `tfs` 会在 `tempDir` 之前初始化呢？\n\
  \n你无法确定。同样，*定义在不同翻译单元中的非局部静态对象之间的初始化相对顺序是未定义的*。这是有原因的。确定初始化非局部静态对象的“正确”顺序是非常困难的。非常困难，到了无法解决的程度。在最通用的形式下——涉及多个翻译单元以及通过隐式模板实例化生成的非局部静态对象（这些对象本身也可能通过隐式模板实例化产生）——不仅无法确定正确的初始化顺序，而且通常甚至不值得去寻找那些*可以*确定正确顺序的特例。\n\
  \n幸运的是，一个微小的设计改变就完全消除了这个问题。要做的只是将每个非局部静态对象移动到自己的函数中，并在其中将其声明为 `static`。这些函数返回指向它们包含的对象的引用。客户端随后调用函数而不是引用对象。换句话说，非局部静态对象被*局部*静态对象取代了。（设计模式的追随者会识别出这是单例模式的一种常见实现。）\n\
  \n这种方法基于 C++ 的保证，即局部静态对象在调用该函数并首次遇到该对象的定义时会进行初始化。因此，如果你将对非局部静态对象的直接访问替换为返回局部静态对象引用的函数调用，你就能保证获取到的引用将指向已初始化的对象。作为一个额外好处，如果你从未调用过模拟非局部静态对象的函数，就永远产生构造和析构对象的代价，而对于真正的非局部静态对象是无法做到的。\n\
  \n以下是将该技术同时应用于 `tfs` 和 `tempDir` 的示例：\n\n```cpp\nclass FileSystem { ... };     \
  \ // 如前\n\nFileSystem& tfs()              // 这替换了 tfs 对象；它可能\n{\n  static FileSystem\
  \ tfs;\n  return tfs;\n}\n\nDirectory& tempDir( params )\n{\n  static Directory\
  \ tempDir(params );\n  return tempDir;\n}\n```\n\n\n\n\n你编写几乎每一个类都会包含一个或多个构造函数、一个析构函数和一个拷贝赋值运算符。这并不奇怪。这些是你的基础函数，它们负责控制基本操作：创建一个新对象并确保其初始化、销毁对象并确保其被妥善清理，以及给对象赋予一个新值。在这些函数中出错会导致你的整个类中产生深远且令人不快的后果，因此，确保正确编写这些函数至关重要。在本章中，我将指导你如何组合成构成良好类骨架的函数。\n\
  \n# 5: 了解 C++ 隐式编写和调用的函数\n\n什么时候一个空类不再是空类？当 C++ 处理完它之后。如果你不自己声明它们，编译器会为你声明它们自己的版本的拷贝构造函数、拷贝赋值运算符和析构函数。此外，如果你完全没有声明任何构造函数，编译器还会为你声明一个默认构造函数。所有这些函数都是\
  \ `public` 且 `inline` 的（参见 Item 30）。因此，如果你写了：\n\n```cpp\nclass Empty{};\n```\n\n\
  它本质上等同于你写了以下代码：\n\n```cpp\nclass Empty {\npublic:\n  Empty() { ... }           \
  \        // 默认构造函数\n  Empty(const Empty& rhs) { ... }   // 拷贝构造函数\n  ~Empty() {\
  \ ... }                  // 析构函数 —— 是否为虚函数参见下文\n  Empty& operator=(const Empty&\
  \ rhs) { ... } // 拷贝赋值运算符\n};\n```\n\n这些函数只有在需要时才会生成，但需要它们并不难。以下代码会导致每个函数的生成：\n\n\
  ```cpp\nEmpty e1;     // 默认构造函数；\n              // 析构函数\nEmpty e2(e1); // 拷贝构造函数\n\
  e2 = e1;      // 拷贝赋值运算符\n```\n\n既然编译器在为你编写函数，这些函数是做什么的呢？嗯，默认构造函数和析构函数主要为编译器提供放置“后台”代码的地方，例如调用基类和非静态数据成员的构造函数和析构函数。注意，生成的析构函数是非虚的（参见\
  \ Item 7），除非它继承自一个本身声明了虚析构函数的基类（在这种情况下，该函数的虚性来自于基类）。\n\n至于拷贝构造函数和拷贝赋值运算符，编译器生成的版本仅仅是将源对象的每个非静态数据成员拷贝到目标对象。例如，考虑一个\
  \ `NamedObject` 模板，它允许你将名称与类型为 `T`的对象关联：\n\n```cpp\ntemplate<typename T>\nclass\
  \ NamedObject {\npublic:\n  NamedObject(const char *name, const T& value);\n  NamedObject(const\
  \ std::string& name, const T& value);\n  ...\nprivate:\n  std::string nameValue;\n\
  \  T objectValue;\n};\n```\n\n由于 `NamedObject` 中声明了构造函数，编译器将不会生成默认构造函数。这很重要。这意味着，如果你精心设计了一个需要构造函数参数的类，你就不必担心编译器通过漫不经心地添加一个不带参数的构造函数来覆盖你的决定。\n\
  \n`NamedObject` 既没有声明拷贝构造函数也没有声明拷贝赋值运算符，因此编译器将生成这些函数（如果需要的话）。现在看这个拷贝构造函数的用法：\n\n\
  ```cpp\nNamedObject<int> no1(\"Smallest Number\", 2);\nNamedObject<int> no2(no1);\
  \ // 拷贝构造函数\n```\n\n编译器生成的拷贝构造函数必须使用 `no1.nameValue` 和 `no1.objectValue` 来初始化 `no2.nameValue`\
  \ 和 `no2.objectValue`。`nameValue` 的类型是 `string`，而标准 `string` 类型有一个拷贝构造函数，因此 `no2.nameValue`\
  \ 将通过调用 `string` 拷贝构造函数并将 `no1.nameValue` 作为参数来初始化。另一方面，`NamedObject<int>::objectValue`\
  \ 的类型是 `int`（对于这次实例化 `T` 是 `int`），而 `int` 是内置类型，因此 `no2.objectValue` 将通过拷贝 `no1.objectValue`\
  \ 中的位来初始化。`NamedObject<int>` 生成的拷贝赋值运算符的行为本质上相同，但通常，编译器生成的拷贝赋值运算符只有在结果代码合法且可能有合理的意义时才会生效。如果其中任一失败，编译器将拒绝为你的类生成\
  \ `operator=`。例如，假设 `NamedObject` 的定义如下，其中 `nameValue` 是字符串的引用，而 `objectValue` 是\
  \ `const` `T`：\n\n```cpp\ntemplate<class T>\nclass NamedObject {\npublic:\n  //\
  \ 此构造函数不再接受 const name，因为 nameValue 现在是到到非 const 字符串的引用。构造函数消失了，因为我们必须有一个字符串可以引用。\n\
  \  NamedObject(std::string& name, const T& value);\n  ...\nprivate:\n  std::string&\
  \ nameValue; // 现在是一个引用\n  const T objectValue;    // 现在是 const 的\n};\n```\n\n现在考虑这里应该会发生什么：\n\
  \n```cpp\nstd::string newDog(\"Persephone\");\nstd::string oldDog(\"Satch\");\n\
  NamedObject<int> p(newDog, 2); // 当我最初写这一行时，我们的狗 Persephone 正要过她的第二个生日\nNamedObject<int>\
  \ s(oldDog, 36); // 如果我童年的狗 Satch 还活着，她应该是 36 岁了\np = s; // 对 p 的数据成员会发生什么？\n```\n\
  \n在赋值之前，`p.nameValue` 和 `s.nameValue` 分别引用 `string` 对象，尽管不是同一个。赋值应该如何影响 `p.nameValue`？赋值后，`p.nameValue`\
  \ 应该引用 `s.nameValue` 所引用的 `string` 吗，即应该修改引用本身？如果是这样，那就开辟了天地，因为 C++ 没有提供让引用指向另一个对象的方法。或者，应该修改\
  \ `p.nameValue` 所引用的 `string` 对象，从而影响其他持有该 `string` 指针或引用的对象，即未直接参与赋值的对象？这就是编译器生成的赋值运算符应该做的吗？\n\
  \n面对这个困境，C++ 拒绝编译这段代码。如果你想在包含引用成员的类中支持赋值，你必须自己定义拷贝赋值运算符。对于包含 `const` 成员的类（例如上述修改类中的\
  \ `objectValue`）的行为也类似。修改 `const` 成员是不合法的，因此编译器不知道如何在隐式生成的赋值函数中处理它们。最后，对于继承自将拷贝赋值运算符为\
  \ `private` 的基类的派生类，编译器拒绝隐式拷贝赋值运算符。毕竟，派生类的编译器生成的拷贝赋值运算符应该处理基类部分（参见 Item 12），但在在此，它们绝不能调用派生类无权调用的成员函数。\n\
  \n### 注意事项\n\n• 编译器可能会隐式生成类的默认构造函数、拷贝构造函数、拷贝赋值运算符和析构函数。\n\n\n\n\n房地产中人负责卖房屋，而一个支持这些中人的软件系统自然会有一个代表待售房屋的类：\n\
  \n```cpp\nclass HomeForSale { ... };\n```\n\n正如每一位房地产中人都会很快指出的，每处房产都是独一无二的 —— 没有两个房产是完全相同的。如此，创建一个\
  \ `HomeForSale` 对象的 `copy` 几乎毫无意义。你如何拷贝一个本质上是唯一的物体？因此，你希望尝试拷贝 `HomeForSale` 对象的操作无法通过编译：\n\
  \n```cpp\nHomeForSale h1;\nHomeForSale h2;\nHomeForSale h3(h1);             // 尝试拷贝\
  \ h1 —— 不应该\n                                // 通过！\n\nh1 = h2;                \
  \         // 尝试拷贝 h2 —— 不应该\n                                // 通过！\n```\n\n遗憾，防止这种编译并不是完全简单的。通常，如果你不希望一个类支持某种特定的功能，只需不声明提供该功能的函数即可。这种策略对于拷贝构造函数和拷贝赋值运算符不起作用，因为正如\
  \ Item 5 所指出的，如果你不声明它们，而有人尝试调用它们，编译器就会为你声明它们。\n\n这让你陷入了困境。如果你不声明拷贝构造函数或拷贝赋值运算符，编译器可能会为你生成它们。因此，你的类就支持拷贝。另一方面，如果你确实声明了这些函数，你的类仍然支持拷贝。但这里的目标是\
  \ `prevent` 拷贝！\n\n解决方案的关键在于，所有编译器生成的函数都是公共的。为了防止生成这些函数，你必须自己声明它们，但并没有要求*你*将它们声明为公共。相反，将拷贝构造函数和拷贝赋值运算符声明为\
  \ `private`。通过显式声明成员函数，你防止了编译器生成自己的版本，而通过将函数变为 `private`，你阻止了人们调用它。\n\n大部分如此。这种方案并非无懈可击，因为成员函数和友函数仍然可以调用你的私有函数。*除非*你足够聪明不去\
  \ `define` 它们。这样，如果有人不小心调用了其中一个，将在链接时获得错误。这种技巧 —— 将成员函数声明为 `private` 并故意不实现它们 ——\
  \ 是非常成熟的，被用于防止 C++ iostreams 库中几个类的拷贝。例如，查看你标准库实现中 `ios_base`、`basic_ios` 和 `sentry`\
  \ 的定义。你会发现，在每情况下，拷贝构造函数和拷贝赋值运算符都被声明为 `private` 且没有定义。\n\n将此技巧应用于 `HomeForSale` 很容易：\n\
  \n```cpp\nclass HomeForSale {\npublic:\n  ...\nprivate:\n  ...\n  HomeForSale(const\
  \ HomeForSale&);             // 仅声明\n  HomeForSale& operator=(const HomeForSale&);\n\
  };\n```\n\n你会注意到我省略了函数参数的名字。这不是强制要求的，只是一种常见的惯例。毕竟这些函数永远不会被实现，更不用说使用，所以指定参数名称有什么意义呢？\n\
  \n使用上述类定义，编译器将阻止客户端拷贝 `HomeForSale` 对象的尝试，如果你在成员函数或友函数中不小心尝试这样做，链接器将会报错。\n\n通过将链接时错误提前到编译时（这总是件好事\
  \ —— 尽早检测错误优于以后检测），可以将拷贝构造函数和拷贝赋值运算符声明为 `private`，但不在 `HomeForSale` 本身中，而是在专门为防止拷贝而设计的基类中。该基类本身非常简单：\n\
  \n```cpp\nclass Uncopyable {\nprotected:                                  // 允许构造\n\
  \  Uncopyable() {}                            // 以及析构\n  ~Uncopyable() {}      \
  \                     // 生对象\nprivate:\n  Uncopyable(const Uncopyable&);       \
  \      // ...防止拷贝\n  Uncopyable& operator=(const Uncopyable&);\n};\n```\n\n为了防止\
  \ `HomeForSale` 对象被拷贝，我们现在需要做的就是继承 `Uncopyable`：\n\n```cpp\nclass HomeForSale: private\
  \ Uncopyable {      // 类不再声明\n  ...                                        // 构造函数或\n\
  };                                            // 拷贝赋值运算符\n```\n\n这是有效的，因为如果任何人（即使是成员函数或友函数）尝试拷贝\
  \ `HomeForSale` 对象，编译器都会尝试生成拷贝构造函数和拷贝赋值运算符。正如 Item 12 所解释，编译器生成的函数版本将尝试调用其基类的对应版本，而这些调用将被拒绝，因为拷贝操作在基类中是私有的。\n\
  \n`Uncopyable` 的实现和使用包含一些微妙之处，例如继承 `Uncopyable` 不一定是非公有的（参见 Item 32 和 39），并且 `Uncopyable`\
  \ 的析构函数不需要是虚的（参见 Item 7）。因为 `Uncopyable` 不包含数据，它符合 Item 39 中描述的空基优化，但因为它是基类，使用这种技术可能会导致多重继承（参见\
  \ Item 40）。多重继承反过来可能会禁用空类优化（再次参见 Item 39）。通常情况下，你可以忽略这些细节并如所示所示使用 `Uncopyable`，因为它确实有效。你也可以使用\
  \ Boost 中提供的版本（参见 Item 55）。那个类名为 `noncopyable`。它是一个很好的类，我只是觉得这个名字有点不自然。\n\n## 需要记住的事\n\
  \n- 要禁止编译器自动提供的功能，将相应的成员函数声明为 `private` 并不给出实现。使用像 `Uncopyable` 这样的基类是这种方法。\n\n\
  Item 7：在多态基类中声明虚析构函数\n\n有很多方法记录时间，因此创建一个 `TimeKeeper` 基类以及不同计时方法的派生类是合理的：\n\n```cpp\n\
  class TimeKeeper {\npublic:\n  TimeKeeper();\n  ~TimeKeeper();\n  ...\n};\n\nclass\
  \ AtomicClock: public TimeKeeper { ... };\nclass WaterClock: public TimeKeeper {\
  \ ... };\nclass WristWatch: public TimeKeeper { ... };\n```\n\n许多客户端希望访问时间而不关心它是如何计算的，因此*工厂函数*\
  \ —— 返回新创建的派生类对象的基类指针的函数可以返回计时对象的指针：\n\n```cpp\nTimeKeeper* getTimeKeeper();   \
  \   // 返回指向动态\n                             分配对象的\n                            \
  \ 派自 TimeKeeper 类\n```\n\n按照工厂函数的惯例，`getTimeKeeper` 返回的对象在堆上，因此为了避免内存和其他资源的泄漏，确保每个返回的对象都被正确地\
  \ `delete` 是重要的：\n\n```cpp\nTimeKeeper *ptk = getTimeKeeper();  // 获取来自\n      \
  \                          TimeKeeper 类的类的对象\n\n...                            \
  \ // 使用它\n\ndelete ptk;                     // 释放以避免资源泄漏\n```\n\nItem 13 解释了依赖客户端删除是有风险的，而\
  \ Item 18 解释了如何修改工厂函数的接口以防止常见的客户端错误，但这些在这里是次要的，因为在这个 Item 中我们处理了上述代码一个更根本的缺陷：即使客户端所做的一切都是正确的，也不知道程序将如何运行。\n\
  \n\n\n问题在于 `getTimeKeeper` 返回一个指向派生类对象的指针（例如 `AtomicClock`），而该对象是通过基类指针（即 `TimeKeeper*`\
  \ 指针）被删除的，且该基类（`TimeKeeper`）有一个**非虚析析构函数**。这是一个灾难性的根源，因为 C++ 规定，当通过具有非虚析析构函数的基类指针删除派生类对象时，结果是未定义的。运行时通常发生的情况是对象的派生部分永远不会被销毁。如果\
  \ `getTimeKeeper` 调用恰好返回一个指向 `AtomicClock` 对象的指针，那么对象的 `AtomicClock` 部分（即在 `AtomicClock`\
  \ 类中声明的成员变量）可能不会被销毁，`AtomicClock` 的析构也不会执行。然而，基类部分（即 `TimeKeeper` 部分）通常会被销毁，从而导致一个奇特的“部分销毁”的对象。这是导致资源泄漏、损坏数据结构以及在调试器上浪费大量时间的绝佳方法。\n\
  \n要消除这个问题很简单：给基类提供一个虚析析构函数。这样，删除派生类对象将完全按照你的预期运行。它将销毁整个对象，包括所有的派生类部分：\n\n```cpp\n\
  class TimeKeeper {\npublic:\n  TimeKeeper();\n  virtual ~TimeKeeper();\n  ...\n\
  };\n\nTimeKeeper *ptk = getTimeKeeper();\n\n...\n\ndelete ptk;                 \
  \    // 现在行为正确\n```\n\n像 `TimeKeeper` 这样的基类通常包含析构函数以外的虚函数，因为虚函数的目的是允许对派生类的实现进行自定义（参见第\
  \ 34 条）。例如，`TimeKeeper` 可能有一个虚函数 `getCurrentTime`，它在不同的派生类中会有不同的实现。任何带有虚函数的类几乎都应该有一个虚析析构函数。\n\
  \n如果一个类*不包含*虚函数，这通常意味着它不打算被用作基类。当一个类不打算作为基类时，将析构函数设为虚通常是一个坏主意。考虑一个表示二维空间中点的类：\n\n\
  ```cpp\nclass Point {                   // 一个 2D 点\npublic:\n  Point(int xCoord,\
  \ int yCoord);\n  ~Point();\nprivate:\n  int x, y;\n};\n```\n\n如果一个 `int` 占用 32\
  \ 位，一个 `Point` 对象通常可以放入一个 64 位寄存器中。此外，这样的 `Point` 对象可以作为一个 64 位数值传递给用其他语言（如 C 或\
  \ FORTRAN）编写的函数。然而，如果将 `Point` 的析构函数设为虚函数，情况就会发生。\n\n虚函数的实现要求对象携带信息，这些信息可以在运行时用于确定在对象上调用哪些虚函数。这些信息通常以名为\
  \ `vptr`（虚函数表指针）的指针的形式存在。`vptr` 指向一个名为 `vtbl`（虚函数表）的函数指针数组；每个带有虚函数的类都有一个关联的 `vtbl`。当在对象上调用虚函数时，实际调用的函数是通过跟踪对象的\
  \ `vptr` 找到 `vtbl`，然后在 `vtbl` 中查找相应的函数指针来确定的。\n\n虚函数如何实现的细节并不重要。*重要*的是，如果 `Point`\
  \ 类包含虚函数，该类型对象的大小将会增加。在 32 位架构上，它们将从 64 位（两个 `int`）变为 96 位（`int`s 加上 `vptr`）；在 64\
  \ 位架构上，它们可能从 64 位增加到 128 位，因为此类架构上的指针大小为 64 位。因此，在 `Point` 中添加 `vptr` 将使其大小增加 50–100%！`Point`\
  \ 对象再也无法放入 64 位寄存器中。此外，C++ 中的 `Point` 对象不再看起来像在 C 等其他语言中声明的相同结构，因为它们的跨语言对应项缺少 `vptr`。结果是，无法在用其他语言编写的函数之间传递\
  \ `Point`，除非你显式地补偿 `vptr`，而这本身是一个实现细节，因此是不可移植的。\n\n结论是，无故将所有析析构函数声明为虚函数与从不声明为虚函数一样错误。事实上，许多人这样总结这种情况：当仅当一个类包含至少一个虚函数时，才在该类中声明虚析析构函数。\n\
  \n即使在完全没有虚函数的情况下，也可能被非虚析构函数问题所困扰。例如，标准的 `string` 类型不包含虚函数，但误入歧途的程序员有时仍将其作为基类：\n\n\
  ```cpp\nclass SpecialString: public std::string {   // 坏主意！std::string 有\n  ...\
  \                                     // 非虚析构函数\n};\n```\n\n乍一看，这可能看起来无害，但如果在应用程序的任何地方你设地将指向\
  \ `SpecialString` 的指针转换为指向 `string` 的指针，然后对该 `string` 指针使用 `delete`，你就立即进入了未行为领域：\n\
  \n```cpp\nSpecialString *pss = new SpecialString(\"Impending Doom\");\nstd::string\
  \ *ps;\n...\nps = pss; // SpecialString*⇒string*\n...\ndelete ps; // 未定义！在实践中，\n\
  \             // ps 的 SpecialString 资源\n             // 将泄漏，因为\n             //\
  \ SpecialString 析构\n             // 不会被调用\n```\n\n同样的分析适用于任何缺乏虚析构函数的类，包括所有的 STL\
  \ 容器类型（例如 `vector`、`list`、`set`、`unordered_map`（参见第 54 条 ）。如果你产生继承标准容器或任何具有非虚析构类的冲动，请克制！（不幸的是，C++\
  \ 没有提供类似于 Java 的 `final` 类或 C# 的 `sealed` 类的派阻止机制。）\n\n有时给类提供纯虚析构函数是方便的。记得纯虚函数会导致*抽象*类——即无法实例化的类（即你无法创建该类型的对象）。然而，有时你有一个想要抽象的类，但你没有任何纯虚函数。怎么办？嗯，因为抽象类旨在被用作基类，因为基类应该具有虚析构函数，而因为纯虚函数产生抽象类，解决方案很简单：在你想要抽象的类中声明一个纯虚析构函数。这是一个例子：\n\
  \n```cpp\nclass AWOV {                                // AWOV = \"无虚函数的抽象类\"\npublic:\n\
  \  virtual ~AWOV() = 0;                    // 声明纯虚析构\n};\n```\n\n析构工作的方式是首先调用最派生类的析构函数，然后调用每个基类的析构函数。编译器会从派生类的析构函数中生成对\
  \ `~AWOV` 的调用，因此你必须确保为该函数提供函数体。如果不提供，链接器将报错。\n\n```cpp\nAWOV::~AWOV() {}       \
  \                    // 纯虚析构的定义\n```\n\n\n\n\n并不是所有的基类都是设计为多态使用的。例如，标准的 `string`\
  \ 类型以及 STL 容器类型根本没有被设计为基类，更不用说多态基类了。有些类被设计用作基类使用，但并非设计为多态使用。这类类——例如来自条目 6 的 `Uncopyable`\
  \ 和标准库中的 `input_iterator_tag`（参见条目 47）——并没有设计为允许通过基类接口操作派生类对象。因此，它们不需要虚析析构函数。\n\n\
  ### 注意事项\n\n- 多态基类应该声明虚析析构函数。如果一个类有任何虚函数，它就应该有一个虚析析构函数。\n- 未被设计为基类或未设计为多态的类不应该声明虚析析构函数。\n\
  \n### 条目 8：防止异常离开析构函数\n\nC++ 并不禁止析构函数抛出异常，但它确实不建议这样做。这样做是有理由的。考虑以下代码：\n\n```cpp\n\
  class Widget {\npublic:\n  ...\n  ~Widget() { ... }         // 假设这可能会抛出异常\n};\n\n\
  void doSomething()\n{\n  std::vector<Widget> v;\n  ...\n} // v 在这里自动销毁\n```\n\n\
  当 `vector v` 被销毁时，它负责销毁包含的所有 `Widget`。假设 `v` 中有十个 `Widget`，在销毁第一个时，抛出了异常。其他九个 `Widget`\
  \ 仍然必须销毁（否则它们持有的任何资源将泄漏），因此 `v` 应该调用它们的析构函数。但假设在这些调用期间，第二个 `Widget` 析构函数又抛出了异常。现在有两个同时活跃的异常，这对于\
  \ C++ 来说实在太多了。取决于产生此类同时活跃的异常对的精确条件，程序执行要么终止，要么产生未定义行为。在示例中，它产生的是未定义行为。使用任何其他标准库容器（例如\
  \ `list`、`set`）、TR1 中的任何容器（参见条目 54）甚至数组，都会产生同样的未定义行为。并不是说必须使用容器或数组才会遇到。即使不使用容器和数组，析构函数抛出异常也可能导致程序过早终止或未定义行为。C++\
  \ *不喜欢*抛出异常的析构函数！\n\n这很容易理解，但如果你的析构函数需要执行一个可能因抛出异常而失败的操作，你该怎么办呢？例如，假设你正在处理一个数据库连接的类：\n\
  \n```cpp\nclass DBConnection {\npublic:\n  ...\n  static DBConnection create();\
  \     // 返回 DBConnection 对象的函数\n                                 // 为了简单省略了参数\n\
  \  void close();                    // 关闭连接；如果关闭失败则抛出异常\n};\n```\n\n为了确保客户端忘记对 `DBConnection`\
  \ 对象调用 `close`，一个合理的想法是为 `DBConnection` 创建一个资源管理类，在它的析构函数调用 `close`。这类资源管理类在第 3\
  \ 章中进行了详细讨论，但在这里，只需考虑此类类的析构函数是什么样的即可：\n\n```cpp\nclass DBConn {                \
  \   // 管理 DBConnection 的类\npublic:\n  ...\n  ~DBConn()                        //\
  \ 确保数据库连接始终被关闭\n  {\n    db.close();\n  }\nprivate:\n  DBConnection db;\n};\n```\n\
  \n这允许客户端像这样编写程序：\n\n```cpp\n{                                // 打开一个块\n  DBConn\
  \ dbc(DBConnection::create()); // 创建 DBConnection 对象\n                         \
  \            // 将其交给 DBConn 对象管理\n  ...                            // 通过 DBConn\
  \ 接口使用 DBConnection 对象\n} // 在块结束时，DBConn 对象被销毁，从而自动关闭 DBConnection 对象\n```\n\n\
  只要 `close` 的调用成功，这种做法就是没问题的，但如果调用产生异常，`DBConn` 的析构函数将传播该异常，即允许它离开析构函数。这是一个问题，因为抛出异常的析构函数意味着麻烦。\n\
  \n规避这种麻烦主要有两种方法。`DBConn` 的析构函数可以：\n\n- **如果 `close` 抛出异常，则**终止程序**，通常通过调用 `abort`\
  \ 实现：\n\n```cpp\nDBConn::~DBConn()\n{\n  try { db.close(); }\n  catch (...) {\n\
  \    记录一条调用 close 失败的日志；\n    std::abort();\n  }\n}\n```\n\n如果在销毁期间遇到错误后程序无法运行，这是一个合理的选项。它的优点是，如果允许异常从析构函数传播会导致未定义行为，这种方法可以防止这种情况发生。也就是说，调用\
  \ `abort` 可能会防止未定义行为。\n\n- **吞掉**来自 `close` 用的异常：\n\n```cpp\nDBConn::~DBConn()\n\
  {\n  try { db.close(); }\n  catch (...) {\n    记录一条调用 close 失败的日志；\n  }\n}\n```\n\
  \n通常情况下，吞掉异常是一个坏主意。有时，吞掉异常比未定义行为的风险要好。要使这成为可行方案，程序必须在忽略错误后能够继续运行。这两种方法都不特别吸引人。它们的共同问题是程序没有办法做出反应。更好的策略是设计\
  \ `DBConn` 的接口，让客户端有机会对出现的问题做出反应。例如，`DBConn` 可以可以自己提供一个 `close` 函数，从而给客户端处理可能出现的异常的机会。它还可以跟踪\
  \ `DBConnection` 是否在析构函数中被关闭。如果 `close` 的调用在 `DBConnection` 析构函数中失败，我们将又回到终止程序的模式：\n\
  \n```cpp\nclass DBConn {\npublic:\n  ...\n  void close()                     //\
  \ 为客户端的新函数\n  {\n    db.close();\n    closed = true;\n  }\n  ~DBConn()\n  {\n  \
  \  if (!closed) {\n      try {\n        db.close();       // 如果客户端没有关闭，则关闭\n   \
  \   }\n      catch (...) {        // 如果关闭失败，\n        记录一条调用 close 失败的日志； // 记录并终止或吞掉\n\
  \      }\n    }\n  }\n\nprivate:\n  DBConnection db;\n  bool closed;\n};\n```\n\n\
  \n\n\n将调用 `close` 的责任从 `DBConn` 的析构函数转移到 `DBConn` 的客户端（同时 `DBConn` 的析构函数包含一个“备份”调用），可能会让你觉得这是一种不负责任的推卸。你甚至可能认为这违反了项目\
  \ 18 中易于正确使用的建议。事实上，两者皆非。如果一个操作可能通过抛出异常而失败，并且可能需要处理该异常，那么异常*必须来自某些非析构函数*。这是因为发射异常的析构函数是危险的，始终面临着程序提前终止或未定义行为的风险。在这个示例中，让客户端自己调用\
  \ `close` 并没有给他们增加负担；而是给了他们处理原本没有机会响应的错误的机会。如果他们认为这个机会没用（可能因为他们认为不会真的发生错误），他们可以忽略它，依靠\
  \ `DBConn` 的析构函数为他们调用 `close`。如果在该点发生了错误——如果 `close` *确实*抛出了异常——那么如果 `DBConn` 吞掉了异常或终止了程序，他们没有理由抱怨。毕竟，他们首先获得了处理该问题的机会，而他们选择了不使用。\n\
  \n## 需要记住的\n\n- 析构函数永远不应该发射异常。如果在析构函数中调用的函数可能会抛出异常，析构函数应该捕获任何异常，然后将其吞掉或终止程序。\n-\
  \ 如果类的客户端需要能够响应操作期间抛出的异常，该类应该提供一个常规（即非析构函数）函数来执行该操作。\n\n### 项目 9：永远不要在构造或析构期间调用虚函数\n\
  \n我将从回顾开始：你不应该在构造或析构期间调用虚函数，因为这些调用不会产生你所期待的那种效果，即使生效了，你仍然是不满。如果你是一个正在恢复的 Java 或\
  \ C# 程序员，请密切关注这个项目，因为这些语言在此处是左转的，而 C++ 是右转的。\n\n假设你有一个用于建模股票交易的类层次结构，例如买入单、卖出单等。这些交易是可审计的非常重要，因此每当创建一个交易对象时，都需要在审计日志创建一个适当的条目。这似乎是解决问题的合理方法：\n\
  \n```cpp\nclass Transaction {                     // 所有交易的基类\npublic:          \
  \                       \n  Transaction();\n  virtual void logTransaction() const\
  \ = 0; // 使其成为依赖于类型的\n                                          // 日志条目\n  ...\n\
  };\n\nTransaction::Transaction()               // 基类构造函数的\n{                   \
  \                    // 实现\n  ...\n  logTransaction();                     // 作为最后的动作，记录此\n\
  \                                       // 交易\n}\n\nclass BuyTransaction: public\
  \ Transaction { // 派生类\npublic:\n  virtual void logTransaction() const;  // 如何记录此类型\n\
  \                                          // 的操作\n                            \
  \              // ...\n};\n\nclass SellTransaction: public Transaction { // 派生类\n\
  public:\n  virtual void logTransaction() const;    // 此类型的操作\n                 \
  \                         // 基类部分是...\n};\n```\n\n考虑当这段代码执行时会发生什么：\n\n```cpp\nBuyTransaction\
  \ b;\n```\n\n显然会调用 `BuyTransaction` 构造函数，但首先必须调用 `Transaction` 构造函数；基类部分在派生类部分之前构造。`Transaction`\
  \ 构造函数的最后一行调用了虚函数 `logTransaction`，但惊喜就在这里。被调用的 `logTransaction` 版本是 `Transaction`\
  \ 中的那，*而不是* `BuyTransaction` 中的——尽管正在创建的对象类型是 `BuyTransaction`。在基类构造期间，虚函数永远不会进入派生类。相反，对象的行为就像它是一个基类类型一样。非正式地说，在基类构造期间，虚函数是不“虚”的。\n\
  \n这种反直觉的行为有充分的理由。因为基类构造函数在派生类构造函数之前执行，派生类的数据成员还没有完成初始化。如果在基类构造期间调用的虚函数进入了派生类，那么派生类函数几乎会引用本地成员，但那些数据成员尚未初始化。那将是通往未定义行为和深夜调试环节的单程票。调用尚未初始化的对象部分本质上是危险的，因此\
  \ C++ 没有给你提供执行这种操作的方法。\n\n实际上，这比这更根本。在派生类对象的基类构造期间，对象的类型*就是*基类的类型。不仅虚函数会解析为基类，语言中使用运行时信息的部分（例如\
  \ `dynamic_cast`（参见项目 27）和 `typeid`）也将对象视为基类类型。在我们的示例中，当 `Transaction` 构造函数运行以初始化\
  \ `BuyTransaction` 对象的基类部分时，对象的类型是 `Transaction`。这就是 C++ 的每个部分处理它的方式，而且这种处理是有意义的：对象的\
  \ `BuyTransaction` 特有部分尚未初始化，因此最安全的方法是将它们视为视为。。在派生类构造函数开始执行之前，对象不会变成一个派生类对象。\n\n\
  同样的推理适用于析构期间。一旦派生类析构函数运行完毕，对象的派生类数据成员就会变成未定义值，因此 C++ 将它们视为不再存在。进入基类析构函数时，对象变成一个基类对象，C++\
  \ 的所有部分——虚函数、`dynamic_cast` 等——都这样处理它。\n\n在上面的示例代码中，`Transaction` 构造函数直接调用了虚函数，这是对本项目指导的清晰而易见的违反。由于这种违反如此容易发现，某些编译器会对此发出警告。（其他则不会。请参见项目\
  \ 53 关于警告的讨论。）即使没有这样的警告，问题几乎会在运行时之前显现，因为 `logTransaction` 函数在 `Transaction` 中是纯虚的。除非它已经定义（不太可能但可能——参见项目\
  \ 34），否则程序无法链接：链接器将无法找到必要的 `Transaction::logTransaction` 实现。\n\n构造或析构期间对虚函数的调用并不容易。如果\
  \ `Transaction` 有多个构造函数，每个构造函数都必须执行相同的工作，那么良好的软件工程是避免代码重复，将公共初始化代码（包括对 `logTransaction`\
  \ 的调用）放入一个私有的非虚初始化函数中，例如 `init`：\n\n```cpp\nclass Transaction {\npublic:\n  Transaction()\n\
  \  { init(); }                           // 调用非虚...\n  virtual void logTransaction()\
  \ const = 0;\n  ...\nprivate:\n  void init()\n  {\n    ...\n    logTransaction();\
  \                   // ...却调用了虚函数！\n  }\n};\n```\n\n\n\n\n这段代码在概念上与之前的版本相同，但它更具阴险性，因为它通常会在没有任何报错的情况下通过编译和链接。在这种情况下，由于\
  \ `logTransaction` 在 `Transaction` 中是纯虚函数，大多数运行时系统会在调用该纯虚函数时终止程序（通常会发出相应的提示信息）。然而，如果\
  \ `logTransaction` 是一个“正常”的虚函数（即不是纯虚函数）并且在 `Transaction` 中有实现，那么该版本会被调用，程序会愉快地运行下去，留给你去苦思恼为什么在创建派生类对象时调用了错误的\
  \ `logTransaction` 版本。避免此问题的唯一方法是确保你的任何构造函数或析构函数都没有在正在创建或销毁的对象上调用虚函数，并确保它们调用的所有函数都遵循相同的约束。\n\
  \n但你*如何*确保在每次创建 `Transaction` 层次结构中的对象时，都调用了正确的 `logTransaction` 版本呢？显然，从 `Transaction`\
  \ 构造函数中对对象调用虚函数是错误的做法。\n\n解决这个问题有不同的方法。一种方法是将 `logTransaction` 变成 `Transaction`\
  \ 中的非虚函数，然后要求派生类构造函数将必要的日志信息传递给 `Transaction` 构造函数。该函数随后就可以安全地调用非虚的 `logTransaction`。如下：\n\
  \n```cpp\nclass Transaction {\npublic:\n  explicit Transaction(const std::string&\
  \ logInfo);\n  void logTransaction(const std::string& logInfo) const;   // 现在是非虚函数\n\
  \  ...\n};\n\nTransaction::Transaction(const std::string& logInfo)\n{\n  ...\n \
  \ logTransaction(logInfo);                             // 现在是非虚调用\n}\n\nclass BuyTransaction:\
  \ public Transaction {\npublic:\n  BuyTransaction( parameters )\n  : Transaction(createLogString(\
  \ parameters ))         // 传递日志信息\n  { ... }                                   \
  \           // 传递基类\n  ...                                                  // 构造函数\n\
  private:\n  static std::string createLogString( parameters );\n};\n```\n\n换句话说，既然你不能在构造期间使用虚函数从基类向下调用，你就可以通过让派生类将必要的构造信息传递给基类构造函数来补偿。\n\
  \n在这个示例中，注意 `BuyTransaction` 中对（私有的）静态函数 `createLogString` 的使用。使用辅助函数创建一个值并传递给基类构造函数，通常比通过成员初始化列表进行复杂的转换来给基类提供它需要的内容更方便（也更具读性）。通过将该函数设为静态，就没有了意外引用到尚未初始化的\
  \ `BuyTransaction` 对象的数据成员的危险。这很重要，因为这些数据成员将处于未定义状态，这正是为什么在基类构造和析构期间调用虚函数根本不会进入派生类的原因。\n\
  \n### 注意事项\n- 不要在构造或析构期间调用虚函数，因为此类调用永远不会去到比当前正在执行的构造函数或析构函数更具体的派生类。\n\n### 第 10\
  \ 条：让赋值运算符返回指向 `*this` 的引用\n\n赋值的有趣之处之一是你可以将它们链起来：\n```cpp\nint x, y, z;\nx = y\
  \ = 5; // 赋值链\n```\n同样有趣的是赋值是右结合的，所以上面的链按解析方式如下：\n```cpp\nx = (y = (5));\n```\n\
  在这里，`5` 被赋值给 `y`，然后该赋值的结果（更新后的 `y`）被赋值给 `x`。（注：原文示例中此处为 z 是笔误，逻辑应为 y）。\n\n这种实现方式是赋值返回其左侧参数的引用，这是你在为类实现赋值运算符时应该遵循的约定：\n\
  ```cpp\nclass Widget {\npublic:\n  ...\n  Widget& operator=(const Widget& rhs) //\
  \ 返回类型是当前类对象的引用\n  {\n    ...\n    return *this; // 返回左侧对象\n  }\n  ...\n};\n```\n\
  此约定适用于所有的赋值运算符，而不是上面所示的形式。因此：\n```cpp\nclass Widget {\npublic:\n  ...\n  Widget&\
  \ operator+=(const Widget& rhs) // 适用于 +=, -=, *= 等\n  {\n    ...\n    return *this;\n\
  \  }\n  Widget& operator=(int rhs) // 即使运算符的参数类型不常规也适用\n  {\n    ...\n    return\
  \ *this;\n  }\n  ...\n};\n```\n这仅仅是一个约定；不遵循它的代码也可以编译。然而，所有内置类型以及标准库中（已有的或即将包含的）类型（例如\
  \ `string`、`vector`、`complex`、`tr1::shared_ptr` 等）都遵循这一约定。除非你有充分的理由这样做，否则不要这么做。\n\
  \n### 注意事项\n- 让赋值运算符返回指向 `*this` 的引用。\n\n### 第 11 条：在 `operator=` 中处理自赋值\n\n自赋值发生当对象被赋值给自身时：\n\
  ```cpp\nclass Widget { ... };\nWidget w;\n...\nw = w; // 自赋值\n```\n这看起来很愚蠢，但它是合法的，所以请放心客户会这样做。此外，赋值并不总是那么容易识别。例如，\n\
  ```cpp\na[i] = a[j]; // 潜在的自赋值\n```\n如果 `i` 和 `j` 具有相同的值，这就是自赋值，并且\n```cpp\n*px\
  \ = *py; // 潜在的自赋值\n```\n如果 `px` 和 `py` 刚好指向同一个东西，这就是自赋值。这些不那么明显的自赋值被称为*别名*（aliasing）：即通过多种方式引用同一个对象。通常，操作相同类型引用或指针的代码需要考虑对象可能是同一个。事实上，如果两个对象来自同一个层次结构，它们甚至不需要声明为相同类型，因为基类引用或指针可以指向派生类对象：\n\
  ```cpp\nclass Base { ... };\nclass Derived: public Base { ... };\nvoid doSomething(const\
  \ Base& rb, Derived* pd); // rb 和 pd 可能是同一个\n```\n如果你遵循第 13 和第 14 条的建议，你将始终使用对象来管理资源，你将确保资源管理对象在复制时表现良好。在这种情况下，你的赋值运算符可能是自赋值安全的，而无需你去考虑。然而，如果你尝试自己管理资源（如果你在编写资源管理类时确实必须这样做），你可能会掉入在运行资源之前意外释放它的陷阱。例如，假设你创建了一个持有一个动态分配的位图原始指针的类：\n\
  ```cpp\nclass Bitmap { ... };\nclass Widget {\n  ...\nprivate:\n  Bitmap *pb; //\
  \ 指向堆对象的指针\n};\n```\n这是一个 `operator=` 的实现，表面看起来合理，但在自赋值的情况下是不安全的。（它也不异常安全，但我们稍后讨论。）\n\
  \n```cpp\nWidget&\nWidget::operator=(const Widget& rhs) // 不安全的 operator= 实现\n{\n\
  \  delete pb; // 停止使用当前位图\n}\n```\n\n\n\n\n\n```cpp\npb = new Bitmap(*rhs.pb); //\
  \ start using a copy of rhs's bitmap\n\nreturn *this; // see Item 10\n}\n```\n\n\
  这里的自赋值问题在于，在 `operator=` 内部，`*this`（赋值的目标）和 `rhs` 可能是同一个对象。当它们是同一个对象时，`delete` 不仅销毁当前对象的位，还会销毁\
  \ `rhs` 的位。在函数结束时，`Widget` —— 这个本不应该被自赋值改变的对象 —— 却发现自己持有的一个指向已删除对象的指针！\n\n防止这种错误的传统方法是在\
  \ `operator=` 顶部通过*恒等测试*（identity test）检查是否自赋值：\n\n```cpp\nWidget& Widget::operator=(const\
  \ Widget& rhs)\n{\n  if (this == &rhs) return *this; // 恒等测试：如果是自赋值，\n         \
  \                         // 什么都不做\n  delete pb;\n  pb = new Bitmap(*rhs.pb);\n\
  \  return *this;\n}\n```\n\n这种方法有效，但我上面提到过，之前的版本的 `operator=` 不仅对自赋值是不安全的，对异常也是安全的，而这个版本仍然存在异常问题。特别是，如果\
  \ \"`new Bitmap`”表达式抛出异常（可能是因为分配内存不足，也可能因为 `Bitmap` 的拷贝构造函数抛出了异常），`Widget` 最终将持有一个指向已删除的\
  \ `Bitmap` 的指针。这种指针是有毒的。你无法安全地删除它们，甚至无法安全地读取它们。对于这些指针，你能做的唯一安全的事就是花费大量的调试精力弄清楚它们从哪里来。\n\
  \n幸运的是，让 `operator=` 异常安全通常也能让它对自赋值安全。因此，通过忽略自赋值问题而转而关注实现异常安全性变得越来越常见。Item 29 深入探讨了异常安全性，但在本项中，只需观察到在许多情况下，仔细安排语句的顺序就可以产生异常安全（且自赋值安全）的代码。例如，在这里我们只需要小心在拷贝\
  \ `pb` 所指向的内容之后再删除 `pb` 即可：\n\n```cpp\nWidget& Widget::operator=(const Widget& rhs)\n\
  {\n  Bitmap *pOrig = pb;       // 记住原始 pb\n  pb = new Bitmap(*rhs.pb); // 将 pb 指向\
  \ rhs 位的拷贝\n  delete pOrig;             // 删除原始的 pb\n  return *this;\n}\n```\n\n\
  现在，如果 \"`new Bitmap`”抛出异常，`pb`（以及它所属的 `Widget`）将保持不变。即使没有恒等测试，这段代码也能处理自赋值，因为我们创建了原始位的拷贝，指向我们创建的拷贝，然后删除原始位。这可能不是处理自赋值最高效的方法，但它确实有效。\n\
  \n如果你担心效率，可以将恒等测试重新放回函数顶部。但在在此那之前，请问问自己预估自赋值发生的频率有多高，因为这种测试不是免费的。它会使代码（源码和目标文件）稍微变大一点，并在控制流中引入一个分支，这两者都可能降低运行速度。例如，指令预取、缓存和流水线的有效性可能会降低。\n\
  \n在 `operator=` 中手动安排语句顺序以确保实现既异常安全又对自赋值安全的替代方案，是使用名为“拷贝并交换”（copy and swap）的技术。这种技术与异常安全性密切相关，因此在\
  \ Item 29 中进行了描述。然而，它是编写 `operator=` 的一种常用方法，值得看看这种实现通常是什么样的：\n\n```cpp\nclass Widget\
  \ {\n  ...\n  void swap(Widget& rhs); // 交换 *this 和 rhs 的数据\n  ...             \
  \        // see Item 29\n};\n\nWidget& Widget::operator=(const Widget& rhs)\n{\n\
  \  Widget temp(rhs); // 创建 rhs 数据的拷贝\n  swap(temp);      // 交换 *this 的数据与拷贝的数据\n\
  \  return *this;\n}\n```\n\n这种主题的一个变体利用了以下两个事实：(1) 类的拷贝赋值运算符可以声明为按值传递参数，以及 (2) 按值传递内容会创建它的拷贝（参见\
  \ Item 20）：\n\n```cpp\nWidget& Widget::operator=(Widget rhs) // rhs 是对象的拷贝 —— 按值传递\n\
  {\n  swap(rhs); // 交换 *this 的数据与拷贝的数据\n  return *this;\n}\n```\n\n个人而言，我担心这种方法为了“技巧性”而牺牲了清晰度，但通过将拷贝操作从函数体移动到参数的构造中，事实证明了编译器有时可以生成高效的代码。\n\
  \n### 注意事项\n\n- 确保当对象被赋值给自己时，`operator=` 行为正常。技术包括比较源和目标对象的地址、仔细安排语句顺序以及拷贝并交换。\n\
  - 确保任何操作一个或多个对象的函数在当两个或多个对象相同时，其行为是正确的。\n\n### Item 12: 拷贝对象的所有部分\n\n在设计良好的、封装了对象内部部分的面向对象系统中，只有两个函数负责拷贝对象：恰如其名的拷贝构造函数和拷贝赋值运算符。我们将这些统称为*拷贝函数*（copying\
  \ functions）。Item 5 观察到编译器会在需要时生成拷贝函数，并解释说生成的版本完全符合预期：它们拷贝了被拷贝对象的数据。\n\n当你声明自己的拷贝函数时，你是在向编译器表示你对默认实现某些某些不满意。编译器似乎对此感到冒犯，并以一种奇特的方式反击：它们并不会告诉你你的实现几乎是错误的。\n\
  \n考虑一个表示客户的类，其拷贝函数经过手动编写，以便记录对它们的调用：\n\n```cpp\nvoid logCall(const std::string&\
  \ funcName); // 创建日志条目\n\nclass Customer {\npublic:\n  ...\n  Customer(const Customer&\
  \ rhs);\n  Customer& operator=(const Customer& rhs);\n  ...\nprivate:\n  std::string\
  \ name;\n};\n\nCustomer::Customer(const Customer& rhs)\n: name(rhs.name) // 拷贝 rhs\
  \ 数据\n{\n  logCall(\"Customer copy constructor\");\n}\n\nCustomer& Customer::operator=(const\
  \ Customer& rhs)\n{\n  logCall(\"Customer copy assignment operator\");\n  name =\
  \ rhs.name; // 拷贝 rhs 数据\n  return *this; // see Item 10\n}\n```\n\n这里看起来一切正常，实际上也一切正常\
  \ 直到向 `Customer` 添加了另一个数据成员：\n\n```cpp\nclass Date { ... }; // 用于时间\n\nclass Customer\
  \ {\n  ... // 如前\n\nprivate:\n  std::string name;\n  Date lastTransaction;\n};\n\
  ```\n\n\n\n\n在此时，现有的拷贝函数正在执行`部分拷贝`：它们复制了客户的 `name`，但没有拷贝其 `lastTransaction`。然而，大多数编译器对此一言不发，即使在最高警告级别下也是如此（另请参见\
  \ 条目 53）。这是它们对你亲自编写拷贝函数的报复。你拒绝了它们会编写的拷贝函数，所以它们就不会告诉你你的代码是否完整。结论是显而易见的：如果你向类中添加了数据成员，你就需要确保也更新了拷贝函数。（你还需要更新所有的构造函数（参见\
  \ 条目 4 和 45）以及该类中任何非标准形式的 `operator=` （条目 10 给出了示例）。如果你忘记了，编译器不太可能提醒你。）\n\n这种问题出现的最隐蔽的方式之一是通过继承。考虑如下：\n\
  \n```cpp\nclass PriorityCustomer: public Customer {               // 一个派生类\n\npublic:\n\
  \n   ...\n\n   PriorityCustomer(const PriorityCustomer& rhs);\n\n   PriorityCustomer&\
  \ operator=(const PriorityCustomer& rhs);\n\n   ...\n\nprivate:\n\n   int priority;\n\
  };\n\nPriorityCustomer::PriorityCustomer(const PriorityCustomer& rhs)\n: priority(rhs.priority)\n\
  {\n  logCall(\"PriorityCustomer copy constructor\");\n}\n\nPriorityCustomer&\nPriorityCustomer::operator=(const\
  \ PriorityCustomer& rhs)\n{\n  logCall(\"PriorityCustomer copy assignment operator\"\
  );\n  priority = rhs.priority;\n  return *this;\n}\n```\n\n`PriorityCustomer` 的拷贝函数看起来正在拷贝\
  \ `PriorityCustomer` 中的所有内容，但再看一遍。是的，它们拷贝了 `PriorityCustomer` 声明的数据成员，但每个 `PriorityCustomer`\
  \ 也包含了它从 `Customer` 继承的数据成员的拷贝，而这些数据成员完全没有被拷贝！`PriorityCustomer` 的拷贝构造函数没有指定传递给其基类构造函数的参数（即：它在成员初始化列表中没有提到\
  \ `Customer`），因此 `PriorityCustomer` 对象的 `Customer` 部分将由不带参数的 `Customer` 构造函数初始化——即默认构造函数。（假设它有一个。如果没有，代码将无法编译。）该构造函数将对\
  \ `name` 和 `lastTransaction` 执行`default` 初始化。\n\n对于 `PriorityCustomer` 的拷贝赋值运算符，情况略有不同。它没有尝试以任何方式修改其基类数据成员，因此它们将保持不变。\n\
  \n每当你亲手为派生类编写拷贝函数时，你必须小心也拷贝基类的部分。当然，这些部分通常是私有的（参见 条目 22），所以你无法直接访问它们。相反，派生类的拷贝函数必须调用它们对应的基类函数：\n\
  \n```cpp\nPriorityCustomer::PriorityCustomer(const PriorityCustomer& rhs)\n:   \
  \  Customer(rhs),                         // 调用基类拷贝构造函数\n  priority(rhs.priority)\n\
  {\n  logCall(\"PriorityCustomer copy constructor\");\n}\n\nPriorityCustomer&\nPriorityCustomer::operator=(const\
  \ PriorityCustomer& rhs)\n{\n  logCall(\"PriorityCustomer copy assignment operator\"\
  );\n  Customer::operator=(rhs);               // 赋值基类部分\n  priority = rhs.priority;\n\
  \  return *this;\n}\n```\n\n本条目标题中“拷贝所有部分”的含义现在应该很清楚了。当你编写拷贝函数时，务必确保 (1) 拷贝所有本地数据成员，并且\
  \ (2) 也调用所有基类中适当的拷贝函数。\n\n在实践中，这两个拷贝函数体通常非常相似，这可能会诱导你尝试通过让一个函数调用另一个来避免代码重复。你避免代码重复的愿望值得赞赏，但让一个拷贝函数调用另一个是实现这一点的错误方法。\n\
  \n让拷贝赋值运算符调用拷贝构造函数是没有意义的，因为你试图构造一个已经存在的对象。由于是如此荒谬，以至于甚至没有语法可以实现。有些语法*看起来像*你正在这样做，但实际上你并没有；而有些语法*确实*能以一种反向的方式做到了这一点，但它们在某些条件下会损坏你的对象。所以，我不会向你展示任何这些语法。只需接受让拷贝赋值运算符调用拷贝构造函数是你不想做的事情。\n\
  \n尝试反过来操作——让拷贝构造函数调用拷贝赋值运算符——同样是荒谬的。构造函数初始化新对象，而赋值运算符只适用于已经初始化的对象。对正在构造的对象执行赋值意味着对一个未初始化的对象进行操作。相反，如果你发现你的拷贝构造函数和赋值运算符体相似，请创建一个第三个函数来消除重复。这样的函数通常是私有的，并且通常命名为\
  \ `init`。\n\n### 注意事项\n\n- 拷贝函数应确保拷贝所有的数据成员和所有的基类部分。\n- 不要尝试用其中一个来实现另一个。\n\n# 资源管理\n\
  \n资源是你在你使用完毕后需要归给系统的东西。如果你不这样做，就会发生糟糕的事情。在 C++ 程序中，常见的资源是动态分配的内存（如果你分配了内存但从不释放，就会导致内存泄漏），但内存只是你管理的许多资源之一。其他常见资源包括文件描述符、互斥锁、图形界面\
  \ (GUI) 中的字体、数据库连接和网络套字。无论是什么种资源，在使用后将其释放都是非常重要的。\n\n在任何情况下，手动确保这一点都是困难的，但考虑到异常、多路径函数以及在不理解影响的情况下修改软件，显然临时的资源管理方法是不够的。\n\
  \n本章从基于 C++ 对构造函数、析构函数和拷贝操作支持的简单对象资源管理方法开始。经验表明，严谨遵循这种方法可以解决所有资源管理问题。本章随后进入专门针对内存的条目。后者的条目补充了前面的更通用的条目，因为管理内存的对象知道如何正确操作。\n\
  \n### 条目 13：使用对象管理资源。\n\n假设我们正在使用一个用于建模投资（例如股票、债券等）的库，其中各种投资类型继承自一个根类 `Investment`：\n\
  \n```cpp\nclass Investment { ... }; // Investment 层次结构的根类\n```\n\n（参见 条目 7; // 返回指向\
  \ Investment 层次结构中\n                                // 动态分配对象的指针；\n            \
  \                    // 调用者必须删除它\n                                （为了简化省略了参数）\n\
  ```\n\n正如注释所示，`createInvestment` 的调用者负责在使用完该函数返回的对象后将其删除。那么，考虑为了履行这一义务而编写的函数 `f`：\n\
  \n\n\n\n\n```cpp\nvoid f()\n{\n  Investment *pInv = createInvestment(); // call\
  \ factory function\n  ... // use pInv\n  delete pInv; // release object\n}\n```\n\
  \n这看起来没问题，但有多种方法可能导致 `f` 无法删除它从 `createInvestment` 获取的投资对象。在函数的“...”部分，可能某处有一个早早的\
  \ `return` 语句。如果执行了这样的 `return`，控制将永远无法到达 `delete` 语句。如果 `createInvestment` 和 `delete`\
  \ 的使用在一个循环中，且循环被 `continue` 或 `goto` 语句提前退出，也会出现类似的情况。最后，“...”部分内部某些语句可能会抛出异常。如果是这样的话，控制将再次无法到达\
  \ `delete`。无论 `delete` 是如何被跳过的，我们都会导致内存泄漏，不仅是包含投资对象的内存，还包括该对象持有的任何资源。\n\n当然，严谨的编程可以防止这类错误，但请考虑一下代码随时间推移可能会发生什么变化。随着软件的维护，有人可能会添加一个\
  \ `return` 或 `continue` 语句，而没有完全理解其对函数其余资源管理策略的影响。更糟糕的是，`f` 的...”部分可能会调用一个以前从不抛出异常、但在“改进”之后突然开始抛出异常的函数。依赖\
  \ `f` 总是能到达其 `delete` 语句是不可行的。\n\n为了确保 `createInvestment` 返回的资源始终被释放，我们需要将该资源放入一个对象中，该对象的析构函数会在控制离开\
  \ `f` 时自动释放该资源。事实上，这就是本节（Item）理念的一半：通过将资源放入对象中，我们可以依靠 C++ 自动调用析构函数来确保资源被释放（我们稍后会讨论该理念的另一半）。\n\
  \n许多资源是在堆上动态分配的，仅在单个代码块或函数内部使用，并应该在控制离开该块或函数时释放。标准库的 `auto_ptr` 正是为这种情况量身定制的。`auto_ptr`\
  \ 是一个类似于指针的对象（智能指针），它的析构函数会自动对其所指向的内容调用 `delete`。以下是使用 `auto_ptr` 防止 `f` 发生潜在资源泄漏的方法：\n\
  \n```cpp\nvoid f()\n{\n  std::auto_ptr<Investment> pInv(createInvestment()); //\
  \ call factory\n  ... // use pInv as\n} // before automatically\n// delete pInv\
  \ via\n// auto_ptr's dtor\n```\n\n这个简单的示例演示了使用对象进行管理两个两个关键方面：\n\n*   **资源被获取并立即移交给资源管理对象。**\
  \ 在上面，`createInvestment` 返回的资源被用于初始化管理它的 `auto_ptr`。事实上，使用对象管理资源的理念通常被称为**资源获取即初始化（RAII）**，因为在同一条语句中获取资源并初始化资源管理对象是如此之常见。有时获取的资源会被赋值给资源管理对象而不是初始化它们，但无论何种方式，每种资源在获取的时刻刻都立即被移交给一个资源管理对象。\n\
  *   **资源管理对象使用其析构函数来确保资源被释放。** 因为析构函数在对象销毁时（例如当对象超出作用域时）会被自动调用，因此无论控制如何离开代码块，资源都能被正确释放。当释放资源的行为可能导致抛出异常时，情况可能会变得复杂，那是\
  \ Item 8 要解决的问题，所以我们不必担心它。\n\n由于 `auto_ptr` 在销毁时会自动删除它所指向的内容，因此确保永远不会有多个 `auto_ptr`\
  \ 指向同一个对象是非常重要的。如果有，该对象将被删除多次，导致你的程序进入未定义行为的快车道。为了防止此类问题，`auto_ptr` 具有一个不寻特性：拷贝它们（通过拷贝构造函数或拷贝赋值运算符）会将它们置为空，且拷贝指针将假设资源的唯一所有权！\n\
  \n```cpp\nstd::auto_ptr<Investment> pInv1(createInvestment()); // pInv1 points to\
  \ the // object returned from createInvestment\nstd::auto_ptr<Investment> pInv2(pInv1);\
  \ // pInv2 now points to the // object; pInv1 is now null\npInv1 = pInv2; // now\
  \ pInv1 points to the // object, and pInv2 is null\n```\n\n这种奇特的拷贝行为，加上 `auto_ptr`\
  \ 管理的资源绝不能有多个 `auto_ptr` 指向它们的底层要求，意味着 `auto_ptr` 并不是管理所有动态分配资源的最佳方式。例如，STL 容器要求其内容表现出“正常”的拷贝行为，因此不允许包含\
  \ `auto_ptr` 的容器。\n\n`auto_ptr` 的替代方案是引用计数智能指针（RCSP）。RCSP 是一种智能指针，它跟踪有多少个对象指向特定的资源，并在不再有对象指向它时自动删除该资源。因此，RCSP\
  \ 提供了类似于垃圾回收的行为。然而，与垃圾回收不同，RCSP 无法打破引用循环（例如，两个互指向的否则未使用的对象）。\n\nTR1 的 `tr1::shared_ptr`（见\
  \ Item 54）就是一个 RCSP，所以你可以这样写 `f`：\n\n```cpp\nvoid f()\n{\n  ...\n  std::tr1::shared_ptr<Investment>\
  \ pInv(createInvestment()); // call function\n  ... // use pInv before\n} // before\
  \ automatically\n// delete pInv via\n// shared_ptr's dtor\n```\n\n这段代码看起来与 `auto_ptr`\
  \ 相似，但 `shared_ptr` 的行为要自然得多：\n\n```cpp\nvoid f()\n{\n  ...\n  std::tr1::shared_ptr<Investment>\
  \ pInv1(createInvestment()); // pInv1 points to the // object returned from createInvestment\n\
  \  std::tr1::shared_ptr<Investment> pInv2(pInv1); // pInv2 now points to the //\
  \ both pInv1 and pInv2 now point to the object\n  pInv1 = pInv2; // ditto — nothing\
  \ has // changed //2 is null\n  ...\n} // pInv1 and pInv2 are // destroyed, and\
  \ the // object they point to is automatically deleted\n```\n\n由于拷贝 `tr1::shared_ptr`\
  \ 符合“预期”，它们可以在 STL 容器和其他在 `auto_ptr` 的不寻常拷贝行为不适用的语境中使用。\n\n但不要被误导。这个 Item 并不是关于\
  \ `auto_ptr`、`tr1::shared_ptr` 或任何其他智能指针。它是关于使用对象管理资源的重要性。`auto_ptr` 和 `tr1::shared_ptr`\
  \ 只是实现此点的示例。（有关 `tr1::shared_ptr` 的更多信息，请参阅 Item 14、18 和 54。）\n\n\n\n\n\n`auto_ptr`\
  \ 和 `tr1::shared_ptr` 在它们的析构函数中使用的 `delete` 而不是 `delete []`。（Item 16 描述了这种差异。）这意味着，使用\
  \ `auto_ptr` 或 `tr1::shared_ptr` 来处理动态分配的数组是一个坏主意，尽管遗憾的是，这种写法是可以编译的：\n\n```cpp\n\
  std::auto_ptr<std::string> aps(new std::string[10]); // Bad 主意！使用了错误的 delete 形式\n\
  std::tr1::shared_ptr<int> spi(new int[1024]);        // 同样的问题\n```\n\n你可能会惊讶地发现，在\
  \ C++ 中并没有针对动态分配数组的类似于 `auto_ptr` 或 `tr1::shared_ptr` 的类，即使在 TR1 中也没有。这是因为 `vector`\
  \ 和 `string` 几乎总是可以替代动态分配的数组。如果你仍然认为为数组提供类似 `auto_ptr` 和 `tr1::shared_ptr` 的类会很好，请查看\
  \ Boost（参见 Item 55）。在那里，你会高兴地发现 `boost::scoped_array` 和 `boost::shared_array` 类，它们提供了你所寻找的行为。\n\
  \n本节关于使用对象来管理资源的指导建议表明，如果你手动释放资源（例如，在资源管理类以外的地方使用 `delete`），那么你所做的事情是错误的。像 `auto_ptr`\
  \ 和 `tr1::shared_ptr` 这样预先定义好的资源管理类通常让遵循本节建议变得容易，但有时你使用的资源，这些预制类无法按你的需求完成工作。在那种情况下，你将需要编写自己的资源管理类。这并不非常困难，但确实涉及一些你需要考虑的细微之处。这些考虑因素是\
  \ Item 14 和 15 的议题。\n\n作为最后的说明，我必须指出，`createInvestment` 的原始指针返回类型是一个资源泄漏的“邀请函”，因为调用者非常容易忘记对返回的指针调用\
  \ `delete`。（即使他们使用 `auto_ptr` 或 `tr1::shared_ptr` 来执行 `delete`，他们仍然必须记得将 `createInvestment`\
  \ 的返回值存储在智能指针对象中。）解决这个问题需要对 `createInvestment` 接口进行修改，这个主题我在 Item 18 中介绍。\n\n###\
  \ 注意事项\n\n- 为了防止资源泄漏，请使用 RAII 对象，在构造函数中获取资源并在析构函数中释放它们。\n- 两个常用的 RAII 类是 `tr1::shared_ptr`\
  \ 和 `auto_ptr`。`tr1::shared_ptr` 通常是更好的选择，因为它在拷贝时的行为是直观的。拷贝 `auto_ptr` 会将其设置为空。\n\
  \n### Item 14：仔细考虑资源管理类中的拷贝行为。\n\nItem 13 引入了将*资源获取即初始化*（RAII）的概念，作为资源管理类的骨干，并描述了\
  \ `auto_ptr` 和 `tr1::shared_ptr` 如何作为这一理念在堆资源上的体现。然而，并非所有资源都是堆的，对于此类资源，像 `auto_ptr`\
  \ 和 `tr1::shared_ptr` 这样的智能指针作为资源处理器通常是不合适的。尽管如此，你可能会发现自己有时需要自己的资源管理类。\n\n例如，假设你正在使用\
  \ C API 来操作类型为 `Mutex` 的互斥对象，该对象提供了 `lock` 和 `unlock` 函数：\n\n```cpp\nvoid lock(Mutex\
  \ *pm);   // 锁 pm 指向的互斥锁\nvoid unlock(Mutex *pm); // 解锁\n```\n\n为了确保你永远不会忘记解锁已锁的\
  \ `Mutex`，你想创建一个类来管理锁。这种类的基本结构由 RAII 原则决定：资源在构造期间获取，在析构期间释放：\n\n```cpp\nclass Lock\
  \ {\npublic:\n  explicit Lock(Mutex *pm)\n  : mutexPtr(pm)\n  { lock(mutexPtr);\
  \ }           // 获取资源\n  ~Lock() { unlock(mutexPtr); } // 释放资源\nprivate:\n  Mutex\
  \ *mutexPtr;\n};\n```\n\n客户端按照传统的 RAII 方式使用 `Lock`：\n\n```cpp\nMutex m; // 定义你需要的互斥锁\n\
  ...\n{ // 定义临界区的块\n  Lock ml(&m); // 锁互斥锁\n  ... // 执行关键操作\n} // 在块结束时自动解锁互斥锁\n\
  ```\n\n这是完全可以的，但如果 `Lock` 对象被拷贝了会发生什么？\n\n```cpp\nLock ml1(&m);  // 锁 m\nLock ml2(ml1);\
  \ // 将 ml1 拷贝到 ml2——这里应该发生什么？\n```\n\n这是一个更通用的问题的特定示例，也是每个 RAII 作者都必须面对的问题：当 RAII\
  \ 对象被拷贝时应该发生什么？在大多数情况下，你可能希望选择以下之一：\n\n- **禁止拷贝。** 在很多情况下，允许 RAII 对象被拷贝是没有意义的。对于像\
  \ `Lock` 这样的类这可能是事实，因为拥有同步原语的“拷贝”很少有意义。当拷贝对一个 RAII 类没有意义时，你应该禁止它。Item 6 解释了如何这样做：将拷贝操作声明为私有。对于\
  \ `Lock`，看起来可能像这样：\n\n```cpp\nclass Lock: private Uncopyable { // 禁止拷贝 —— 参见 Item\
  \ 6 (#ch02.html_ch02lev1sec2)\npublic:\n  ... // 与之前相同\n};\n```\n\n- **对底层资源进行引用计数。**\
  \ 有时，希望保持资源直到使用它的最后一个对象被销毁。在这种情况下，拷贝 RAII 对象应该增加引用该资源的对象的计数。这就是 `tr1::shared_ptr`\
  \ 所所使用的“拷贝”一词的含义。\n\n通常情况下，RAII 类可以通过包含一个 `tr1::shared_ptr` 数据成员来实现引用计数的拷贝行为。例如，如果\
  \ `Lock` 想要采用引用计数，它可以将 `mutexPtr` 的类型从 `Mutex*` 改为 `tr1::shared_ptr<Mutex>`。不幸的是，`tr1::shared_ptr`\
  \ 的默认行为是在引用计数归零时删除它指向的内容，而这不是我们想要的。当我们完成对 `Mutex` 的操作时，我们需要解锁它而不是删除它。\n\n幸运的是，`tr1::shared_ptr`\
  \ 允许指定一个“删除器”（deleter）——一个在引用计数归零时调用的函数或函数对象。（这种功能 `auto_ptr` 不具备，它*总是*删除其指针。）删除器是\
  \ `tr1::shared_ptr` 构造函数的一个可选参数，因此代码看起来如下：\n\n```cpp\nclass Lock {\npublic:\n  explicit\
  \ Lock(Mutex *pm)\n  : mutexPtr(pm, unlock) // 用 Mutex 和解锁函数初始化 shared_ptr\n  {\n\
  \    lock(mutexPtr.get()); // 关于 \"get\" 的信息参见 Item 15 (#ch03.html_ch03lev1sec3)\n\
  \  }\n\nprivate:\n  std::tr1::shared_ptr<Mutex> mutexPtr; // 使用 shared_ptr 代替原始指针\n\
  };\n```\n\n在这个示例中，注意 `Lock` 类不再声明析构函数。这是因为没有必要。Item 5 解释了类的析构函数（无论是编译器生成的还是用户定义的）会自动调用该类非静态数据成员的析构函数。在这个示例中，那就是\
  \ `mutexPtr`。但 `mutexPtr` 的析构函数会自动调用 `tr1::shared_ptr` 的删除器——在本例中是 `unlock`，当互斥锁的引用计数归零时。（查看类源码的人可能会感谢一个注释，说明你并没有忘记析构，只是依赖于默认的编译器生成行为。）\n\
  \n\n\n\n\n- **复制底层资源。** 有时，你可以对一个资源拥有任意数量的副本，而你需要资源管理类的唯一理由就是确保在使用完每个副本后，每个副本都能被释放。在这种情况下，复制资源管理对象也应该复制它所封装的资源。也就是说，复制资源管理对象执行的是“深拷贝”。\n\
  \n标准 `string` 类型的某些实现包含指向堆内存的指针，构成字符串的字符存储在这些堆内存中。此类 `string` 对象的对象包含一个指向该堆内存的指针。当一个\
  \ `string` 对象被复制时，指针和它所指向的内存都会被复制一份。此类 `string` 表现出深拷贝特性。\n\n- **转移底层资源的所有权。** 在少数情况下，你可能希望确保只有一个\
  \ RAII 对象引用原始资源，并且当该 RAII 对象被复制时，资源的所有权从被拷贝对象转移到拷贝对象。正如第 13 节所解释的，这就是 `auto_ptr`\
  \ 中所使用的“拷贝”一词的含义。\n\n拷贝函数（拷贝构造函数和拷贝赋值运算符）可能会由编译器生成，因此除非编译器生成的版本能满足你的需求（第 5 节 解释了默认行为），否则你需要自己编写它们。在某些情况下，你还希望支持这些函数的泛化版本。此类版本在第\
  \ 45 节中有所描述。\n\n### 注意事项\n\n- 拷贝一个 RAII 对象意味着拷贝它所管理的资源，因此资源的拷贝行为决定了 RAII 对象的拷贝行为。\n\
  - 常见的 RAII 类拷贝行为是不允许拷贝和执行引用计数，但也可以有其他行为。\n\n### 第 15 节：在资源管理类中提供对原始资源的访问。\n\n资源管理类是极佳的。它们是你防止资源泄露的堡垒，而没有此类泄露是设计良好的系统的基本特征。在一个完美的世界里，你应该依赖此类类来与资源进行的所有交互，永远不要通过直接访问原始资源来弄脏手。但世界并非完美。许多\
  \ API 直接引用资源，除非你计划放弃使用此类 API（这在实践中很少可行），否则你将经常跳过资源管理对象并处理原始资源。\n\n例如，第 13 节引入了使用智能指针（如\
  \ `auto_ptr` 或 `tr1::shared_ptr`）来持有对 `createInvestment` 等工厂函数调用结果的想法：\n\n```cpp\n\
  std::tr1::shared_ptr<Investment> pInv(createInvestment());  // 来自第 13 节\n```\n\n\
  假设一个你在处理 `Investment` 对象时想要使用的函数如下所示：\n\n```cpp\nint daysHeld(const Investment *pi);\
  \      // 返回持有\n                                        // 投资的天数\n```\n\n你想像这样调用它：\n\
  \n```cpp\nint days = daysHeld(pInv);              // 错误！\n```\n\n但代码无法编译：`daysHeld`\
  \ 需要一个原始的 `Investment*` 指针，但你传递的是一个类型为 `tr1::shared_ptr<Investment>` 的对象。\n\n你需要方法将\
  \ RAII 类对象（在此例中为 `tr1::shared_ptr`）转换为它包含的原始资源（例如底层的 `Investment*`）。通常有两种通用方法：显式转换和隐式转换。\n\
  \n`tr1::shared_ptr` 和 `auto_ptr` 都提供了 `get` 成员函数来执行显式转换，即返回（指针的副本）。`tr1::shared_ptr`\
  \ 和 `auto_ptr` 都提供了 `get` 成员函数来执行显式转换，即返回（指针的副本）。`tr1::shared_ptr` 和 `auto_ptr`\
