- "# Effective C++：改进程序与设计的 55 种特效，第三版 (Gal Zentner 图书系列)\n\n\n\n![](img/0132702061.jpg)\n\
  \n![cover-image](img/0132702061.jpg)\n\n## 对《Effective C++（第三版）的赞誉\n\n“Scott Meyers\
  \ 的书《Effective C++, Third Edition》是编程经验的结晶——这些经验是你本需要通过痛苦的学习才能学会的。这是一本极好的资源，我推荐给每一位专业编写\
  \ C++ 的人员。”\n— *Peter Dulimov，工程师，澳大利亚海军系统司令部 NAVSYSCOM 范围与评估小组*\n\n“第三版仍然关于如何以高效、内聚的方式将\
  \ C++ 的所有部分整合在一起的最佳书籍。如果你自称自己是一名 C++ 程序员，那么你必须读读这本书。”\n— *Eric Nagler，顾问、讲师以及《Learning\
  \ C++》的作者*\n\n“这本书的第一版属于极少数（非常少数）书籍，我归功于它显著提升了我作为一名‘专业’软件开发人员的技能。和其他书籍一样，它既实用又易于阅读，而且充满了重要的建议。《Effective\
  \ C++, Third Edition》延续了这一传统。C++ 是一门非常强大的编程语言。如果说 C 语言给了你足够的绳子让你自己，那么 C++ 就是一家五金店，有很多乐于帮助的人准备为你打结。掌握书中讨论的要点将无疑增加你有效使用\
  \ C++ 的能力，并减轻你的压力水平。”\n— *Jack W. Reeves，Bleading Edge Software Technologies 首席执行官*\n\
  \n“每一位加入我团队的新开发者都有一项任务——读读这本书。”\n— *Michael Lanzetta，高级软件工程师*\n\n“我大约在九年前读了《Effective\
  \ C++》的第一版，它立刻成为了我最喜欢的 C++ 书籍。在我看来，《Effective C++, Third Edition》对于任何想要在 C++ 中进行高效编程的人来说，今天仍然是必读之作。如果\
  \ C++ 程序员在编写第一行专业的 C++ 代码之前都读读这本书，我们的世界将会变得更好。”\n— *Danny Rabbani，软件开发工程师*\n\n“当我还是一个在战线中挣扎、试图提高业务水平的程序员时，遇到了\
  \ Scott Meyers 的《Effective C++》第一版。这简直是救命稻草！我发现 Meyers 的建议是实用、有用且有效的，百分之百地履行了书名的承诺。第三版将严谨开发项目中使用\
  \ C++ 的实际情况更新到了最新，并增加了关于语言最新问题和特性的章节。我很高兴地发现，从一本我认为已经很熟悉的书的最新版本中仍然学到了有趣的新知识。”\n\
  — *Michael Topic，技术项目经理*\n\n“这来自 C++ 大师 Scott Meyers 之手，是任何想要安全、有效地使用 C++，或正从任何其他面向对象（OO）语言过渡到\
  \ C++ 的人来说的终极指南。这本书以清晰、简洁、有趣且富有见解的方式呈现了极具价值的信息。”\n— *Siddhartha Karan Singh，软件开发者*\n\
  \n“这应该是任何开发者在读完通用的介绍性文本后应该读的第二本 C++ 书籍。它超越了 C++ 的‘如何’和‘什么’，探讨了‘为什么’和‘何’。它帮助我从了解语法转向理解\
  \ C++ 编程的哲学。”\n— *Timothy Knox，软件开发者*\n\n“这是对经典 C++ 教材的一次非常出更新。Meyers 在这一卷中涵盖了许多新领域，每一位严肃的\
  \ C++ 程序员都应该拥有一本新版副本。”\n— *Jeffrey Somers，游戏程序员*\n\n“《Effective C++, Third Edition》涵盖了你在编写代码时应该做的事情，并非常出色地解释了为什么这些事情如此重要。把它看作编写\
  \ C++ 的最佳实践吧。”\n— *Jeff Scherpelz，软件开发工程师*\n\n“随着 C++ 拥抱变化，Scott Meyers 的《Effective\
  \ C++, Third Edition》突飞猛进，与语言保持着完美的同步。市上有许多优秀的 C++ 入门书籍，但恰恰只有一本‘第二本’书脱颖而出，而你手里正拿着它。在\
  \ Scott 的指引下，准备好开启你自己的飞跃旅程吧！”\n— *Leor Zolman，C++ 培训师和专家，BD Software*\n\n“这本书对于\
  \ C++ 老手和新手来说都是必不可得的。在你读完它之后，它不会在你的书架上落灰——你会经常查阅它。”\n— *Sam Lee，软件开发者*\n\n“这本书通过\
  \ 55 个易于阅读的项目（每个项目描述了一种技术或技巧），一步一步地将普通的 C++ 程序员转化为专家级 C++ 程序员。”\n— *Jeffrey D. Oldham，博士，Google\
  \ 软件工程师*\n\n“Scott Meyers 的《Effective C++》系列书籍长期以来一直是新手和资深 C++ 程序员的必读物。这个新版本整合了近十年的\
  \ C++ 语言发展，是他内容最丰富的一本书。他不仅仅是描述了语言固有的问题，而是提供了明确且易于遵循的建议，教你如何避开陷阱并编写‘有效的 C++’。我希望每一位\
  \ C++ 程序员都读过它。”\n— *Philipp K. Janert，博士，软件开发经理*\n\n“《Effective C++》的每一个旧版本都是使用\
  \ C++ 几个月或几年的开发者的必读之书，这段时间足以让他们掉进这门丰富语言中潜藏的陷阱。在第三版中，Scott Meyers 针对现代新语言和库特性，以及为了使用这些特性而演变的编程风格，大量地刷新了他的实用建议。Scott\
  \ 引人入胜的写作风格使人们在成为有效 C++ 开发者的道路上轻松吸收他的指南。”\n— *David Smallberg，UCLA 计算机教师*\n\n“《Effective\
  \ C++》的每一个之前的版本对于使用 C++ 几个月或几年的开发者来说都是必读之书，这段时间足以让他们掉进这门丰富语言中潜藏的陷阱。在第三版中，Scott Meyers\
  \ 针对现代新语言和库特性，以及为了使用这些特性而演变的编程风格，大量地刷新了他的实用建议。Scott 引人入胜的写作风格使人们在成为有效 C++ 开发者的道路上轻松吸收他的指南。”\n\
  \n“《Effective C++》已经完全更新，是所有 C++ 实践者的第一第二本书。”\n— *Matthew Wilson，博士，《Imperfect C++》作者*\n\
