  \ 前言\n\n我在 1991 年编写了 *Effective C++* 的初版。当 1997 年编写第二版时，我以重要的方式对材料进行了更新，但由于我不想让熟悉第一版的读者感到困惑，我尽力保留了现有的结构：原始\
  \ 50 个条款标题中有 48 个基本上保持不变。如果这本书比一间房子，那么第二版等同于通过更换地毯、油漆和灯具来翻新一下装修。\n\n对于第三版，我把房子拆到了只剩框架（有时我希望自己能直接挖到地基）。自\
  \ 1991 年以来，C++ 的世界发生了巨大的变化，而这本书的目标——用一个小巧、易读的方案提供最重要的 C++ 编程指南——不再通过我近 15 年前确立的那些条款来实现。在\
  \ 1991 年，假设 C++ 程序员来自 C 背景是合理的。现在，转到 C++ 的程序员同样可能来自 Java 或 C#。在 1991 年，继承和面向对象编程对大多数程序员来说是新概念。现在它们已是成熟的概念，而异常、模板和泛型编程是人们需要更多指导的领域。在\
  \ 1991 年，没有人听说过设计模式。现在，如果不提到它们，就很难讨论软件系统。在 1991 年，C++ 的正式标准刚刚开始制定。现在该标准已经有了八年的历史，而下一个版本的工作已经开始了。\n\
  \n为了应对这些变化，我尽可能彻底推倒重来，并问自己：“对于 2005 年的 C++ 程序员来说，最重要的建议是什么？”结果就是这个新版中的条款。书中新增了关于资源管理和使用模板编程的章节。事实上，模板方面的问题贯穿于全文，因为它们影响了\
  \ C++ 的几乎每一个地方。书中还包含了关于在存在异常的情况下进行编程、应用设计模式以及使用新的 TR1 库设施的新材料。（TR1 在 `Item 54` 中有所描述）。它承认，在单线程系统中运行良好的技术和方法，在多线程系统中可能并不适用。书中超过一半的内容是新的。然而，第二版中的大多数基础信息仍然重要，因此我找到了一种以某种形式保留它们的方法。（你可以在\
  \ `附录 B` 中找到第二版和第三版条款之间的映射。）\n\n我努力让这本书尽可能完美，但我并没有幻觉它是完美的。如果你觉得书中的某些条款作为通用建议是不恰当的；对于书中讨论的任务有更好的实现；或者认为某一个或多个技术讨论不清楚、不完整或具有误导性，请告诉我。如果你发现任何类型的错误——技术上的、语法上的、拼写上的，*无论什么*——也请告诉我。我乐意在随后的印本的致谢中，加上第一个向我指出每个问题的人的名字。\n\
  \n即使条款数量已扩展到 55 条，书中的指南也远非详尽。但制定良好的规则——那些在任何时候都有效的规则——比看起来要困难得多。如果你对额外的指南有建议，我非常乐意听取。\n\
  \n我维护着一份自首次印发以来该书的更改列表，包括错误修复、说明和技术更新。该列表可以在 *Effective C++ Errata* 页面找到：`http://aristeia.com/BookErrata/ec++3e-errata.html`\
  \ (`http://aristeia.com/BookErrata/ec++3e-errata.html`)。如果你想在我更新列表时收到通知，我鼓励你加入我的邮件列表。我用它发布可能对关注我专业工作的人感兴趣的公告。详情请参阅\
  \ `http://aristeia.com/MailingList/` (`http://aristeia.com/MailingList/`)。\n\nSCOTT\
  \ DOUGLAS MEYERS\n俄勒冈州，斯坦福德\n2005 年 4 月\n\n## 致谢\n\n*Effective C++* 已经存在十五年了，我在写这本书大约五年前开始学习\
  \ C++。因此，“*Effective C++ 项目*”已经开发了二十年。在此期间，我受益于数百（几千？）人的见解、建议、纠正，以及偶尔的目瞪口呆。每个人都帮助改进了\
  \ *Effective C++*。我感激他们所有人。\n\n我已经放弃了追踪我在哪里学了什么，但从我记忆起，有一个通用的信息来源一直帮助我：Usenet C++\
  \ 新闻组，特别是 `comp.lang.c++.moderated` 和 `comp.std.c++`。书中的许多条款——也许是大多数——都受益于这些新闻组参与者对技术想法的审查，而这正是他们所擅长的。\n\
  \n\n\n\n\n关于第三版中的新内容，Steve Dewhurst 与我一起制定了第一批候选条目。在 Item 11 中，通过拷贝-交换（copy-swap）实现\
  \ `operator=` 的想法源于 Herb Sutter 关于该主题的著作，例如他的 [Exceptional C++](https://www.amazon.com/gp/product/0201615622?ie=UTF8&tag=ecpp3e-ebook-20&linkCode=as2&camp=1789&creative=9325&creativeASIN=0201615622)\
  \ 中的第 13 条（Addison-Wesley, 2000）。RAII（参见 Item 13）源于 Bjarne Stroustrup 的 [The C++\
  \ Programming Language](https://www.amazon.com/gp/product/0201889544?ie=UTF8&tag=ecpp3e-ebook-20&linkCode=as2&camp=1789&creative=9325&creativeASIN=0201889544)（Addison-Wesley,\
  \ 2000）。Item 17 背后的想法源于 Boost `shared_ptr` 网页的“最佳实践”部分，[`boost.org/libs/smart_ptr/shared_ptr.htm#BestPractices`](http://boost.org/libs/smart_ptr/shared_ptr.htm#BestPractices)，并由\
  \ Herb Sutter [More Exceptional C++](https://www.amazon.com/gp/product/020170434X?ie=UTF8&tag=ecpp3e-ebook-20&linkCode=as2&camp=1789&creative=9325&creativeASIN=020170434X)（Addison-Wesley,\
  \ 2002）中的第 21 条进行了完善。Item 29 深受 Herb Sutter 关于该主题的广泛著作的影响，例如 [Exceptional C++](https://www.amazon.com/gp/product/0201615622?ie=UTF8&tag=ecpp3e-ebook-20&linkCode=as2&camp=1789&creative=9325&creativeASIN=0201615622)\
  \ 中的第 8-19 条，[More Exceptional C++](https://www.amazon.com/gp/product/020170434X?ie=UTF8&tag=ecpp3e-ebook-20&linkCode=as2&camp=1789&creative=9325&creativeASIN=020170434X)\
  \ 中的第 17–23 条，以及 [Exceptional C++ Style](https://www.amazon.com/gp/product/0201760428?ie=UTF8&tag=ecpp3e-ebook-20&linkCode=as2&camp=1789&creative=9325&creativeASIN=0201760428)（Addison-Wesley,\
  \ 2005）中的第 11–13 条；David Abrahams 帮助我更好地理解了三个异常安全保证。\n\nItem 35 中的 NVI 惯用法源于 Herb\
  \ Sutter 在 2001 年 9 月《C/C++ Users Journal》上的“Virtuality”专栏。在同一条目中，模板方法和策略设计模式来自\
  \ Erich Gamma、Richard Helm、Ralph Johnson 和 John Vlissides 编写的 [Design Patterns](https://www.amazon.com/gp/product/0201633612?ie=UTF8&tag=ecpp3e-ebook-20&linkCode=as2&camp=1789&creative=9325&creativeASIN=0201633612)（Addison-Wesley,\
  \ 1995）。在 Item 37 中使用 NVI 惯用法的想法来自 Hendrik Schober。David Smallberg 为在 Item 38 中编写自定义\
  \ `set` 实现提供了写作动机。Item 39 关于 EBO 通常在多重继承下不可用的观察，源于 David Vandevoorde 和 Nicolai M.\
  \ Josuttis 的 [C++ Templates](https://www.amazon.com/gp/product/0201734842?ie=UTF8&tag=ecpp3e-ebook-20&linkCode=as2&camp=1789&creative=9325&creativeASIN=0201734842)（Addison-Wesley,\
  \ 2003）。\n\n在 Item 42 中，我对 `typename` 的最初理解源于 Greg Comeau 的 C++ 和 FAQ ([`www.comeaucomputing.com/`](http://www.comeaucomputing.com/))。在\
  \ Item 46 中，关于 `typename` 的最初理解来自 Greg Comeau 的 C++ 和 FAQ。在 Item 52 中，关于 `operator\
  \ new` 的想法源于 Herb Sutter。\n\n\n\n\nLeor Zolman 在准备全面评审之前，针对多个编译器检查了所有的代码示例，在我修改手稿后，他又重新检查了一遍。如果仍然存在任何错误，将由我负责，而不是\
  \ Leor。\n\nKarl Wiegers 尤其是 Tim Johnson，对封底文案提供了快速且有帮助的反馈。\n\n自第一版出版以来，我采纳了 Jason\
