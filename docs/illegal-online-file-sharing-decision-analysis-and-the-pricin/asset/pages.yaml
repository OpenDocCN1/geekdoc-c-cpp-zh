    Proof: These conditions are related to the nature of networks and are all unfeasible
    and are as follows (the proof of the unfeasibility of each condition is straightforward):


    **Condition 7(i):** In Stckelberg analysis, N (total number of ISPs in the market/region)
    and s (number of ISPs in the coalition) are constant for all time periods t and
    for any region r. This condition is not feasible because ISPs will enter and exit
    the coalition over time.


    **Condition 7(ii):** The marginal contribution of any coalition member (ISP1)
    is equally likely to occur as the marginal contribution of any other coalition
    member during any interval t. This condition is not feasible because ISPs have
    different resources, network architectures, and commitment to the coalition.


    **Condition 7(iii):** The terms of the coalition agreement (resource allocation
    formula) remains constant for any time interval t.


    **Condition 7(iv):** In any coalition S, and for any time interval t, utilities
    are always transferable among any two pairs of ISPs. This condition is not feasible
    because ISPs have different resources, network architectures, and commitment to
    the coalition. Furthermore, the physical layout is in the form of transmission
    and brand equity.


    **Condition 7(v):** For any time interval t, and for any number of ISPs in a market
    denoted by n, and for any distance d in the coalition members'' network, in the
    Shapley value formula for calculating payoffs, s →0 (as the number of coalition
    members approaches zero), the absolute effect/contribution of each coalition-member
    ISP remains at least constant and is proportional to the ISP''s network size.


    **Condition 7(vi):** For any time interval t, and for any distance d in the coalition
    members'' network, in the Shapley value formula for calculating payoffs, s → n
    (as the number of members approaches the total number of ISPs in the market),
    the effect/contribution of each coalition-member ISP remains at least constant
    and is proportional to the ISP''s network size.


    **Condition 7(vii):** The governance structure of the coalition does not matter
    and does not affect the contributions and payoff of coalition members. This condition
    is not feasible. The peering/interconnection agreement may determine the nature
    of the governance of the coalition or coalitions within the coalition. The coalition
    can be in the form of (1) separate agreements among ISPs at various times, (2)
    coordinated and separate strategic alliances among ISPs, (3) coordinated strategic
    alliances among ISPs that anticipate entry/exit of alliance members, (4) coordinated
    joint ventures among ISPs, (5) coordinated joint ventures among ISPs that anticipate
    entry/exit of alliance members, and (6) government-mandated interconnection. The
    agreement includes (1) determination of costs and revenues, (2) collection and
    sharing of revenues, and (3) dispute resolution methods.


    **Condition 7(viii):** All interconnection agreements (peering agreements and
    transferring agreements) are the same.


    **Condition 7(ix):** Illegal online file sharing does not affect ISP''s profitability
    and cost structure. This condition is not feasible because illegal online file
    sharing affects the profitability and QoS of ISPs. Most of the existing literature
    on network pricing explicitlyits any analysis of the effects of illegal online
    file sharing.


    **Condition 7(x):** QoS concerns do not affect the probability of formation of
    coalitions. This condition is not feasible in most instances, because ISPs are
    more concerned about QoS and are using QoS as a basis to segment their services
    (to offer different types of Internet access).


    **Condition 7(xi):** On the contrary, antitrust laws preclude the types of coalitions
    that are envisioned or implied by Shapley value analysis and Stckelberg games.


