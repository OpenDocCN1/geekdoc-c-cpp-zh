  md: '# Chapter 9


    # Consumer Surplus, Producer Surplus, Equilibrium Prices, and the Enterprise Value
    of Digital Content


    # 9.1 Introduction


    It is not clear whether Nash Equilibrium, Bayesian Nash Equilibrium, or similar
    equilibria are suitable for analysis of prices of digital content because of the
    following reasons:


    +   1. Consumers’ switching costs are or can be very low; there are several alternatives
    to traditional digital content (CDs, live-education, home study, other forms of
    entertainment, etc.), and the illegal file sharer can easily and *profitably*
    deviate from any perceived Nash Equilibrium at low costs (*profit* refers to both
    monetary and nonmonetary gains such as cost saving, excitement, reduced search
    cost, and group activities).


    +   2. Given that time is a major search cost, the transaction costs and opportunity
    costs inherent in maintaining any Nash Equilibrium, Bayesian Nash Equilibrium,
    or similar equilibria can be prohibitive.


    +   3. The amount and duration of information asymmetry inherent in the price
    discovery process and in maintaining any Nash Equilibrium, Bayesian Nash Equilibrium,
    or similar equilibria can be prohibitive and precludes any equilibrium.


    +   4. The operations of information producers often differ substantially and
    they may have different cost structures and very different production costs, and
    consumers’ tastes/preferences and the temporal manifestations of these preferences
    differ substantially, all of which affect the probability of existence of equilibria.


    +   5. Nash Equilibrium does not implicitly or explicitly consider regulations
    (unlike *competitive regulatory equilibria*); but regulation affects or affect
    consumers’ preferences and information producers’ pricing and distribution channels.'
