    # Theorem 12.5


    For any time interval t, and any distance d in the coalition members'' networks,
    the marginal utility of substituting an ISP in the transmission path (the increase
    in utility gained from substituting an ISP in the transmission path) does not
    remain constant, and Stackelberg analysis is not applicable to network pricing.


    Proof: Clearly, both the O-ISP and the consumer''s marginal utility of substituting
    any ISP in the transmission path (between sender and receiver) changes instantaneously
    due to (1) changes in traffic and volume, (2) the absolute efficiency and relative
    efficiency of each ISP''s network, (4), (5) transmission fees and terms of payment
    of such fees (nature of the contracts), and (6) physical barriers (for wireless
    networks), etc. As explained before, the physical network may be different from
    transmission paths within it. Thus, Stackelberg analysis is not applicable to
    access pricing or cost allocation in networks.


    # Theorem 12.6


    The Stackelberg analysis is inapplicable because for each packet, and for any
    time interval t, and for any distance d in the coalition members'' networks, the
    end-to-end interconnection fee is a small or insignificant component of the per-packet
    TTC, and the Stackelberg allocations of cost and revenues to coalition members
    will be unfeasible when costs and revenues exceed or fall below thresholds.


    Proof: In instances, the interconnection fees are not a main component of the
    TTC incurred by the ISP. For any time t and for distance d in the coalition''s
    network, the ISP''s end-to-end TTC (Rc) or marginal end-to-end TTC (Rm) is below
    a certain dollar threshold (Y), the ISP may not care much about interconnection
    fees and will not have incentives to remain in any coalition of ISPs. Also, if
    Ri and Rm are above a certain dollar threshold (X), the ISP will have sufficient
    incentive to remain in any coalition—the ISP will probably shift its focus and
    resources to reducing its costs and will probably attempt to create other coalitions
    with three parties. In general, participation in these coalitions is not mandatory
    and ISPs can negotiate with various coalitions for membership or exit, subject
    to terms of peering agreements. Here are three possible states, which as: (1)
    X > Y, (2) Y > X, and (3) X = Y. However, if X > Y and Rm ∈ X, the average coalition
    member will have incentives to remain in the coalition, such member can improve
    its position by negotiating with other members for peering agreements or by expanding
    their own physical infrastructure or by joining third-party coalitions. Even membership
    in a coalition is mandatory for all or part of the period time, coalition-member
    ISPs can still improve their payoffs by expanding their own physical networks.


    Similarly, for any time t and for distance d in the coalition''s network, the
    average per-unit interconnection fee (Pe) or marginal per-unit interconnection
    fee (Pm) (for transporting a unit of bandwidth or packet) is below a certain dollar
    threshold (Y), the ISP may not care much about interconnection fees and have inadequate
    incentives to remain in any coalition of ISPs. Also, if Pe and Pm are above a
    certain dollar threshold (X), the ISP will have strong incentives to leave and
