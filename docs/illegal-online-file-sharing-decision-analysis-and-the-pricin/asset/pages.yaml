    # 5.5 Conclusion


    Most existing anti-file sharing systems and content-control systems remain deficient,
    and sometimes, do not comply with case law and statutes. The existing legal framework
    in most jurisdictions is not completely adequate to regulate the new and evolving
    models/systems of online file sharing. Illegal file sharing and content-control
    problems can be solved by (1) relating economic issues and legal requirements
    to technological solutions and capabilities and (2) developing appropriate business
    models that create value and minimize economic losses for content distributors.


