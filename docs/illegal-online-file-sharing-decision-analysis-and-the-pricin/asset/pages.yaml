    the free rider has exceeded a certain number of downloads per period (in a net
    version), only when the free rider exceeds a certain excess of downloads over
    uploads), (2) imposed as to the members of the highest/upper quarter of free riders
    when this group has exceeded a certain number of downloads per period (in a net
    version), only when this group of free riders exceeds a specific number of net
    downloads [i.e., excess of downloads over uploads], and (3) the bandwidth premium
    that is necessarily dynamic and is adjusted to reflect existing and recent download/upload
    patterns.


    $B_d$ be the average amount of bandwidth by a peer to download one unit of content
