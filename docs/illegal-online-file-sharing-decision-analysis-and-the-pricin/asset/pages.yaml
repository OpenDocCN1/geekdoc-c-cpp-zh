    \ Incentive Systems (Which Is More Efficient Than Shapley and Stackberg Allocations)\n\
    \nThis section summarizes the problems inherent in P2P incentive systems and especially\
    \ for RTAMNO P2P games and introduces a new allocation mechanism that allocates\
    \ the benefits of cooperative-open P2P networks among network members and reduces\
    \ the pressures of digital content.\n\nMost proposed solutions to the cooperative-P2P\
    \ incentive programs focus on developing incentives to reward cooperative peers\
    \ (by a system of fees and compensation), there are several problems inherent\
    \ in such systems. First, in such systems, the resulting system is not balanced.\
    \ Second, most of them erroneously assume that the network is uniformly dispersed.\
    \ Third, the models erroneously assume that each peer/node has the same value\
    \ for each unit of digital content and also has the same utility for uploading\
    \ and downloading digital content. Fourth, the models erroneously for illegal\
    \ P2P file sharing—the models assume each node can download and upload files.\
    \ Finally, the full potential of such systems is not fully utilized.\n\nThe price\
    \ per unit of content distributed in a client-server model ($P$) differs from\
    \ the price per unit in the P2P model in the following ways. The distributor/owner's\
    \ cost of distributing content is likely to be lower in a P2P system. $\\Pi_{mp}$\
    \ is the consumer's marginal cost of product substitution for one unit of digital\
    \ content (this includes the effects of price discounts, promotions, coupons,\
    \ and free products). $\\Pi_{w}$ is the consumer's marginal costs of searching\
    \ for one unit of digital content, which are likely to be slightly lower in a\
    \ P2P system due to lower bandwidth costs. $\\Pi_{t}$ is the consumer's marginal\
    \ cost of time-substitution, which is likely to remain the same in client-server\
    \ or P2P systems.\n\nEach P2P network member gains certain benefits from the use\
    \ of the P2P model, some of which are as:\n\n+   $\beta_u$ are cash benefits from\
    \ reduced network congestion, if any, and from savings in bandwidth.\n$\beta_w$\
    \ are cash benefits from savings in bandwidth.\n$\beta_t$ are cash benefits of\
    \ faster download times—lower search time and lower congestion.\n$\beta_p$ are\
    \ cash benefits of increased probability of completing a purchase. Only digital\
    \ content that is provided by the distributor can be shared in the P2P system—the\
    \ website may not be functioning at certain times, and there can be packet losses\
    \ and bottlenecks.\n$\beta_{\\psi}$ are psychological benefits of being a member\
    \ of an online community (a function of mental processes, aspirations, biological\
    \ conditions, affinity for online search, altruism, greed, etc.).\n$\beta$ are\
    \ total cash value of these benefits. $\beta = \beta_u + \beta_w + \beta_t + \b\
    eta_p + \beta_{\\psi}$.\n$\beta_u$ is the total nonunitary value of these benefits.\
    \ $\beta_u = \beta_u + \beta_w + \beta_t + \beta_p + \beta_{\\psi}$.\n$\beta_$\
    \ is the total compensation fee paid by the distributor to one or more P2P network\
    \ members (each unit of content can be downloaded from one or more members), each\
    \ time that a secondary-member-purchaser downloads a unit of content from one\
    \ or more primary member's hard drive.\n\n![](img/6ed183cc039e14cbcc61046fc2804076_175_0.png)"
