  md: '# 162 Illegal Online File Sharing, Decision-Analysis, and the Pricing of Digital
    Goods


    The sum of the cash and utility values of these benefits are β_c and β_u, respectively.
    In typical P2P content pricing models, the distributor pays each member a compensation
    fee for transferring the content to other members. However, this, compensation
    fee is erroneously calculated and modeled as if each member''s computer is always
    on. Hence, the P2P benefits (β_c, β_u) are limited by (1) the number of consumers''
    computers that are functioning and connected to the network (η_c) (thus, η_c/η_total
    > 0); (2) the number of P2P network members that have have already downloaded
    the content (η_d) (thus, η_d/η_total > 0); and (3) the geographical dispersion
    of the network members that have already downloaded the content (S) (hence, η_d/S
    < 0).


    The P2P network member''s possible reason to incentives to share in P2P networks
    is limited, the structure of the network because sharing in P2P systems is not
    optional and the network member must participate in the network once he she signs
    on—the only two variables that are following:


    +   1. The network member can choose to leave his or her computer on and connected—but
    even then, the member may not have downloaded desirable content that others seek;
    and the cost of leaving the computer is relatively minimal.

    2. The network member should download as much desirable digital content as possible
    but at market price. Hence, any incentive payment to the network member has limited
    value, because the downloaded content may not be desired by other members. Even
    if the distributor assigns compensation fee to specific content on each unit-type''s
    popularity and utility-value, then the compensation fee will be reduced or become
    less meaningful as many network members choose to download only the most popular
    types of digital content.


    In the P2P model, the distributor''s marginal cost of distribution/selling is
    a function of (1) the number of consumers'' computers that are functioning and
    connected to the network (η_c) (thus η_c/η < 1); (2) the number of P2P network
    members that have already downloaded the content (η_d) (thus, η_d/η_total < 0);
    (3) the geographical dispersion of the nodes (network members) that have already
    downloaded the content (S) (and thus, in instances, η_d/S < 0); (4) administrative
    costs; the cost of the digital content; (6) the distributor''s per-unit cost of
    monitoring the P2P network (C_m) (this cost does not exist in the client-server
    model, and, generally, η_c/C_m ≥ 0).


    In most instances, the member''s cost of distributing the digital content (secondary
    purchases) typically consists of bandwidth costs, marketing costs (online and
    offline marketing), and amortized hardware costs. Note that each network member
    in each generation (first, second, etc.) is assumed to pay the same price for
    each unit of digital content regardless of the source (the distributor''s servers
    or other members'' servers). The distributor is the primary source. After the
    primary purchase, purchasing member becomes a secondary source.


    # Definition 10.1: Incentive Stability


    Incentive stability refers to a state where the existence of a set of conditions
    and/or incentives is required to provide sufficient inducement for an incentive-based
    coalition in time t to remain active and valid (without any member deviation).'
