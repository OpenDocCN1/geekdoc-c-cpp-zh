    # 6.3 Some Nontechnical Pricing-Only Solutions to the Free Rider Problem


    The foregoing issues about free riding, some nontechnical pricing-only solutions
    to the free rider problem are described as follows.


    # 6.3.1 Solutions for Pay-per-Download Pricing Systems in P2P Networks


    The following recommendations should be read in the text of the aforementioned
    conjecture that free riding can be beneficial in some circumstances. In legal
    P2P networks that use pay-per-download pricing, the sponsor/distributor can completely
    eliminate or reduce free riding using the following pricing methods:


    +   1. Charge free riders higher prices (*bandwidth premium*) for each download—personalize
    prices based on the system-wide costs of free riding to the system during time.

    2. Identify and exclude (full or partial exclusion) members/nodes who are known
    as free riders.

    3. Pay cash and recommend incentives to members who upload more than average volumes
    of digital content and those whose content get downloaded more than the average.

    4. Cap the number of downloads per period for known/classified free riders.

    5. Charge free riders higher prices (*bandwidth premium*) for each download that
    occurs after a threshold number of downloads in each billing period.

    6. Implement built-during wherein pricing are based on blocks of downloaded content
    and the per-unit price increases as download volume increases—that is, a block
    of 5 units costs $10, and blocks of 10, 20, and 50 units cost $13, $54, and $140,
    respectively.

    7. Increase the per-unit prices for the most popular (top 20th percentile) units
    of content.

    8. Charge the free rider a bandwidth premium when it downloads content that is
    not a member of a *Designated–Pair*. Designated–Pairs are any two different units
    of content that are not popular (are not sought or downloaded by at least a specific
    percentage of nodes) and/ require lower bandwidth (and are usually downloaded
    the same time or may be complementary).

    9. Charge the free rider a bandwidth premium only when its upload/download volume
    is negative (when its downloads exceed its uploads to the same units of content
    during a specified time period).

    10. Implement a prioritization scheme wherein the free rider exceeds a threshold
    number of downloads per period, known free rider requests are treated as second-priority
    or third-priority traffic and are deferred to periods of low traffic and are fulfilled
    by part or only nodes that have excess capacity/or low value for bandwidth.

    11. Implement a prioritization scheme wherein free rider nodes are given incentives
    (e.g., reduced prices) to defer their downloads to low-traffic periods, and such
    requests will be fulfilled first by free rider nodes and then nodes that have
    low value for bandwidth (i.e., high bandwidth capacity).

    12. Identify valuable free riders and allow them to continue participating in
    the network (based on their nonetary contributions, *centrality*, and other considerations)
    and create conditions that foster favorable conditions for more valuable free
    riders.

    13. Provide incentives for free riders to help improve the efficiency of networks.'
