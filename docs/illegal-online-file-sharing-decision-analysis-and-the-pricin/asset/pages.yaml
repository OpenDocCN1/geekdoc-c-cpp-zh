    but will not be adequate for printing the screen or for photographing the image.
    In the case of sound, external copying can be eliminated by embedding high-pitched
    sounds in the file or stream (which contains the content) during the process of
    encrypting the media files. The human ear cannot hear these high-pitched sounds
    when the content is streamed/played. However, when the waves of these high-pitched
    sounds come into contact with external recording devices, (a) the friction produced,
    (b) the resulting distortion of the surrounding sound, and (c) the reflection
