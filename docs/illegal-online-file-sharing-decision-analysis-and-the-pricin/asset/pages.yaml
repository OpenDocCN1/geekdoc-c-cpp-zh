    # 1.2.1.2 Relevant U.S. and Australian Cases


    1.2.1.2.1 Problems with MGM v. Grokster (U.S. Supreme Court Case)


    The main problems that arose from the U.S. Supreme Court''s decision in MGM v.
    Grokster, 545 US 913 (2005) are as follows.


    The standards for establishing intent to promote infringing by the device-maker
    are unsettled and vague. The Court did not set clear standards for establishing
    intent of the devicemaker encourage perpetrators to share files illegally, but
    it acts as marketing, advertising, customer services, and direct instructions
    provided to perpetrators as evidence of the device-maker/distributor''s intent
    to infringe. However, if an individual/entity develops a file sharing system and
    places it on the Internet, a website where software is downloaded for free, without
    any comment or advertising or instructions, people can still use the system for
    illegal file sharing and cause the same or more economic damage. The Court stated
    that the commercial benefit of the device-maker''s enterprise on high-volume use
    that was infringing was not, by itself, justify an infringement of unlawful intent—this
    holding is grossly insufficient as a basis/standard for determining legality,
    it effectively weakens copyright protection, and it is a direct contradiction
    to the Court''s other holdings in case.


    The required elements of liability under the inducement theory are (1) intent,
    (2) distribution of, and (3) evidence of actual infringement by recipients of
    the device. However, the creator of the illegal file sharing need not distribute
    the device—he could simply post the device on websites where it can be downloaded
    for free.


    P2P systems also have legal use in many contexts. The Court did not state conditions
    under which legal uses of file sharing systems will be permitted. Under the Court''s
    ruling, ISPs, CD makers, and any maker of any device that can be used to store
    and/transmit digital content can potentially be liable for illegal file sharing.


    The Court''s overall ruling focused only on instances where MGM. Grokster circumstances
    exist. The case was an opportunity to address the many social and legal issues
    that arise in different file sharing. The Court focused excessively on inducement.
    P2P systems can cause substantial economic damage (from copyright infringement)
    without any inducement and without any knowledge of infringement (by the creator/distributor
    of the P2P systems) as defined by the Court.


    The Court did not sufficiently distinguish Sony from MGM. Grokster. The Sony/Betamax
    doctrine that states makers/distributors of devices used for copying content cannot
    be held liable for copyright infringement. The Sony/Betamax doctrine (Miles, 2004)
    is not really applicable to P2P networks and file sharing because of the following
    factors:


    +   - Betamax matches the devastating economic loss within minutes or seconds,
    unlike P2P networks that can copy a file to thousands/millions of people all the
    world within—hence there is an exponential multiplier in Internet transactions.


    +   - Betamax involves much more transaction costs that reduce the perpetrator''s
    propensity and capacity to copy content.


    +   - The potential economic loss and its impact on creativity and incentives
    to produce content are key considerations.


    +   - If the Betamax doctrine is applied to P2P systems, then the resulting enforcement
    costs will prevent effective protection of copyrights—content owners will be forced
    to identify, investigate, prosecute individuals.'
