    # Observation 12.1


    For any time interval t, and for any distance d in the coalition''s networks,
    the marginal contribution of each coalition-member ISP is not always directly
    proportional to (1) distance or (2) bandwidth consumed.


    Stackelberg analysis erroneously implies that for any time interval t, and for
    any distance d in the coalition''s networks, the marginal contribution of each
    coalition-member ISP is directly proportional to (1) distance and (2) bandwidth
    consumed. This is not always true. For example, with regard to distance, the marginal
    contribution of a coalition-member ISP that transports a packet for 100 meters
    in an extremely high-density city Internet congestion is or can be greater than
    the marginal contribution of an ISP that transports a similar packet to 1000 m
    in a low-density rural area with no Internet congestion.


    # Theorem 12.4


    For any time interval t and for any distance d in the coalition''s networks, the
    number of coalition members is not always nonnegative.


    Proof: An ISP can be deemed a negative member of a coalition when any of the following
    conditions exist:


    +   1. X% of the ISP''s network is physically proximate to the networks of coalition
    members even though the ISP is not a coalition member, and such proximity can
    reduce the coalition''s transportation burden by Q.

    2. The ISP has no physical networks or wireless networks that enters into interconnection
    agreements with coalition members (or the ISP has minimal networks—about 5% of
    the average network size).


    Stackelberg analysis erroneously implies that for any time interval t and for
    any distance d in the Coalition''s networks, the number of coalition members is
    not always nonnegative, and hence, Stackelberg analysis is not applicable to access
    pricing or to cost allocation in networks.


    # Observation 12.2


    For any time interval t and for any distance d in the coalition members'' networks,
    the marginal rate of transmission of packets (R) (the packet travels for each
    additional unit of bandwidth consumed) does not remain constant, and thus, Stackelberg
    analysis is not applicable to access pricing or cost allocation in networks.


    The marginal rate of transmission of packets varies or vary constantly in various
    reasons including traffic/congestion, size/diameter of the network, physical obstructions
    in networks, type of protocol, and type of digital content. With such varying
    R, each coalition member''s contribution cannot be measured by any standard unit,
    and hence given the Stackelberg theory and formula, any allocation will not be
    fair or stable. Thus, Stackelberg analysis is inapplicable to access pricing.'
