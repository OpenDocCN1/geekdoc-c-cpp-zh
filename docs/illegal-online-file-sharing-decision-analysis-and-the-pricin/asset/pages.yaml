    # 7.5 The Open-Access Controversy


    There is an inherent trade-off between open access to digital content on the web,
    and the regime (associated incentives) by IP laws. The trade-off between the benefits
    of open access on the Internet and the efficiency of IP laws depends on the following
    factors:


    +   * The strategy a firm employs to obtain IP rights—the costs of obtaining IP
    rights and the terms of such rights will substantially affect benefits of open
    access versus regulation.

    * The type, amount, and efficiency of protection by laws, and the associated costs
    of monitoring and enforcement, will affect the benefits of open access compared
    to regulation.

    * Competitors'' actions will affect consumer''s perceptions of products and their
    reactions to prices. If competitors choose a different strategy, the content owner
    may lose substantial market share and revenues.

    * Consumer''s economic utilities.

    * Available technology.

    * To encourage creativity and resourcefulness, content owners must be rewarded
    in some manner. Thus, pure-access schemes are inefficient. Open-access initiatives
    incorporate some form of private taxation (similar to the system for radio broadcasts)
    to provide incentives for commerce.


    While IP laws provide substantial incentives for private individual/group initiative,
    the key is modern pricing of products to increase accessibility. The incentives
    of IP laws are not limited to the realm of intangible property but affect tangible
    property, lifestyles, family dynamics, regional economies (i.e., Microsoft in
    Seattle, WA; EDS in Texas, United States; Disney in Florida and California, United
    States; etc.), firm structure, nature of competition, etc.


    Deterrence of crime cannot justify open access to digital content. The objective
    of IP laws should be provide profits for creators and to provide an orderly regime
    for the advancement of innovation. These objectives can be achieved through an
    open-access regime.


