    # 2.3.4 Hypothesis-3: The Deprivation and Exclusion Effect


    IOF deemed to be a group reaction to various forms of exclusion in physical space
    and online. Such exclusion could be based on age, sex, marital status, income/wealth,
    personality, identity. Illegal file sharing is typically free, does not discriminate
    on age/location/sex, provides access to communities that have some permanence,
    reduces class distinctions, and instantaneously broaden the perpetrator''s social
    networks. These benefits can be achieved at relatively low costs, with very low
    social friction (compared to physical space) and with convenience.


    The Internet provides substantial choice and variety. This choice is exponentially
    greater than choice in physical space and is substantially enhanced by the immediacy
    and instant gratification of the Internet. However, such choice can also create
    feelings of deprivation: (1) IOF is sometimes a reaction that occurs when people
    are not able to find specific content on the web or in physical space; (2) IOF
    is sometimes a reaction to deprivation from activities/events in physical space
    in various aspects of life—relationships, activities, associations, etc.; and
    (3) IOF becomes a reaction to deprivation among those arising from parental control
    and institutional restrictions (schools, universities, etc.).


    # 2.3.5 Hypothesis-4: Reflection/Reassurance Effect


    IOF serves as a form of psychological reassurance to perpetrators that there are
    others who share convergent and divergent beliefs and tastes. This reassurance
    is increasingly necessary given the rapid growth in the variety of Internet-based
    products, systems, games and indeed, increasing globalization, changes in the
    family structure, and more changes in modern society. For someone to participate
    in illegal file sharing (knowing the risks), the person must believe that (1)
    the other parties in these transactions have the same or worse moral values, (2)'
