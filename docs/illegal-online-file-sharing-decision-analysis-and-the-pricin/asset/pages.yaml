    4. The perpetrator''s employer can be subjected to fines and penalties for illegal
    file sharing activities on its computers.

    5. The perpetrator–employee may be fired by his/her employer for illegal online
    file sharing.

    6. The perpetrator may be blacklisted and denied service by ISPs for illegal file
    sharing.

    7. The perpetrator may be suspended from college and university housing.


    # 4.1 Existing Literature on Perceptions of Risk in Illegal Online File Sharing


    There is no direct literature on perceptions of risk in illegal file sharing (IOF).
    There have been some industry surveys. Sax et al. (2015), Cox et al. (2010), Argan
    et al. (2013), Grüsser et al. (2007), Jakob and Smetana (2012), Borja et al. (2015),
    Coyle et al. (2009), Jacobs et al. (2012), Steinmetz and Tunnell (2013), and the
    authors of articles¹ analyzed elements of human behavior in the context of illegal
    file sharing.


    Agotnes and Wooldridge (2010), Sterman (2008), and Åtnes et al. (2010) studied
    compliance and optimal social laws. Boll et al. (2013), Christodoulou et al. (2012),
    Anselevich and Caskurk (2001), Gabrarro et al. (2011), Hegde et al. (2015), Emek
    and Feldman (2012), and Fiat and Saif (2007) studied network games and network-formation
    theories. Clark (2007) analyzed legal liability for illegal online downloads.
    Van Otterloo et al. (2006) analyzed knowledge conditions. Grant et al. (2014)
    analyzed the transformation of games by information sharing, Bachrach et al. (2013)
    analyzed transformation games, which are a form of traditional games. Wooldridge
    et al. (2013) studied incentives in Boolean games.


    # 4.1.1 Illegal File Sharing Networks as Chaotic Systems


    Illegal P2P file sharing is a team effort, and of the dynamical systems’ business
    team principles in Losada and Heapy (2004), Arthur (1999), and Sterman (1988)
    are relevant. Tully (2005) analyzed the music distribution system within the context
    of games and complexity and concluded that several proposed models for regulating
    the music system fail to allow reasonable time to adapt without legislative intervention.
    Ruhl and Ruhl (1997) explained various types of attackers. Kuhlman and Morveit
    (2014) and Melnik et al. (2013) analyzed chaos and contagion in networks.'
