    produces P2P software) and its agents. Most of the theories in the existing literature
    were developed for situations where (1) there is only one occurrence of the tort,
    (2) there is only tortfeaser and one victim or there are joint tortfeasers and
    only one victim, and (3) there are differences in knowledge between any two joint
    tortfeasers. On the contrary, (1) there are many joint tortfeasers, and (2) the
    tort occurs many times, and (3) with the exception of the P2P software company,
    all other joint tortfeasers are essentially nodes and have the same knowledge
    that is distinct from the files being shared.


    The traditional basis of liability for illegal file sharing has included negligence,
    strict liability, and vicarious liability. Bonadio (2008), Pegura (2008), Sugden
    (2008), and Vincents (2007, 2008) analyzed European laws of these issues. Leung
    and Saw (2007) studied copyright infringement. The U.S. Supreme Court and many
    courts courts in other countries have established liability of ISPs for IOF, and
    some courts have affirmative defenses on ISPs to prevent and stop IOF. However,
    the liability of infringers and companies that produce P2P software can still
    be established on


    +   1. Negligence—companies that make P2P software face absolute negligence or
    contributory negligence: (a) strict liability—where the P2P software company and
    each P2P member functions as a node liable, and (b) vicarious liability—where
    each P2P member is deemed as agent of the P2P software company and agent of other
    P2P members.

    2. Collusion—between the P2P software company and network members; and collusion
    among network members.

    3. Common law fraud.

    4. Common law conversion.

    5. Statutory criminal misconduct or civil misconduct—with vicarious liability,
    personal liability, or strict liability.


