  md: '# Economic Psychology Issues Inherent in Illegal Online Sharing — 27


    # 2.3.3 Hypothesis-2: The Browsing Effect


    The browsing effect—the increased accessibility of the Internet has made more
    people to become more likely to browse the Internet as opposed to going to specific
    websites. Thus, IOF is a by-product of the increased propensity to browse the
    Internet, which arises from increased access to the Internet, increased need for
    instant gratification, and increased awareness of time management. This theory
    is supported by the available data—among illegal file sharers, most of the activity
    is initiated and supported by less than 5% of file sharers.


    Some of the consequences of the browsing effect and human—computer interaction
    are dependent; static modes of interaction with others; propensity to comply with
    rules/regulations; disregard for claims and fine print; desire for online groups
    and group-based activities; increased propensity to seek and try the newest web-based
    contraction; exponentially greater choice of products/services; lower transaction
    costs; and growth of anonymous web-based systems.


    The sheer variety and amount of information available to surfers create various
    sensitivities in consumers and also numb web surfers and reduce their ability
    to distinguish good from bad. Most people who participate in illegal file sharing
    spend considerable amounts of time surfing the web day. Unlike the physical world,
    police presence is minimal in the Internet. Furthermore, the significant effort
    that is required to process information gleaned for many URLs in Internet session
    and remember such information, and the ease with which individual frames reduce
    the mind''s ability to determine what is right or wrong, to assess risk, and to
    appreciate the value of digital content.


    The browsing effect is evident in (1) the change in the average duration of consumers’
    Internet searches during the last 10 years; (2) the changes in the average time
    spent per session in illegal file sharing networks during the last 5 years; (3)
    a comparison of the average time spent per person for the Internet that use PCs,
    mobile phones, and handheld devices; (4) a comparison of the average time spent
    per website/URL for individuals that use PCs, mobile phones, and handheld devices;
    (5) the relationship between the type of Internet access (wireless, narrowband,
    and broadband), and the number of websites/websites visited per Internet session,
    and (6) the historical weekly changes in the changes of consumers’ leisure time
    that is spent on the Internet, Internet searches, and on Internet-based entertainment;
    (7) the relationship between the changes in the average amount of time spent by
    the consumer in an Internet session and the changes in the number of members in
    IOF networks; (8) the percentage of IOF networks spend various amounts of time
    per Internet session (e.g., an average of v, w, x, y, and minutes per Internet
    session) who view IOF as illegal or justified and are not one of an appropriate
    classification.


    A closely related effect is the digital games effect. People are more likely to
    participate in IOF because the popularity and availability of computer games has
