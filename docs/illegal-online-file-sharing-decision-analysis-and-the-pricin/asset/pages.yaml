    of capital for R&D, administrative costs, and marketing; (5) uncertainty with
    possible changes in regulation and the impact of political lobbyists who influence
    government legislators; (6) limitations imposed by current industry and Internet
    standards; and (7) lack of creativity.


    Furthermore, the nature of the contracts between ISPs (Internet access providers)
    and Internet users does not shift liability to users for their activities. This
    has been the case in many countries as explained by McKay (2005); Vaccaro and
    Cohn (2004); and Engel (1999). Some of these contracts expressly place restrictions
    on transmission of pornographic and copyrighted materials. The recent rulings
    by the U.S. Supreme Court and Australian courts effectively


    ![](img/6ed183cc039e14cbcc61046fc2804076_250_0.png)'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'create a duty for ISPs (and hence a shift of liability to ISPs) to go beyond
    warnings, disclaimers, and agreements—which is what is required to prevent copyright
    infringement. Many of such agreements have been rendered partially void as a matter
    of law.


    # 14.3 Increase in Transaction Costs


    The existing copyright laws increase transaction costs in the management of digital
    rights. These costs arise from the following:


    +   1. Investigating suspicious activity: (a) The standards of proof required
    for obtaining search warrants, subpoenas, and evidence are relatively high, and
    (b) the time delays in litigating these cases are relatively substantial, increasing
    costs—many of these copyright laws do not contain any expedited or special procedures
    that can be used to reduce the time and expense required for investigation.

    2. Deterrence costs: The cost of prosecution by government officers.


    # 14.4 Deterrence Effect of Copyright Laws


    The deterrence effect of these copyright and IP laws have been weak, as exemplified
    in the United States, where despite prosecution and criminal sanctions and substantial
    publicity, many people still participate in illegal file sharing.


    # 14.5 Information Leaks


    Many of the existing copyright laws do not have any provisions for limiting or
    expanding the flow of information about investigations into copyright violations,
    related judicial proceedings, details of specific acts and perpetrators, and the
    role of various parties involved. This inherent lack of control over the flow
    of information increases information costs, investigation costs, and prosecution
    costs, and can reduce the deterrence effect.


    # Note


    +   See TCN Channel Nine Ltd Pty Ltd vs. Network Ten Ltd., FCAFC 146, 2002 (Australian
    Federal Court).'
