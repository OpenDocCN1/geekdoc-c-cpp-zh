  md: '# Chapter 11


    # Shapley Value Cannot Be Used in Network Access Pricing, Network Cost Allocation,
    the Pricing of Digital Content, or Analysis of Electricity Distribution Networks


    Although game theory principles have been used extensively in developing analytical
    models for access pricing in Internet networks, transmission pricing in electric
    power networks, and access pricing in telephone/cable networks, most of the existing
    literature omits the effects of illegal online file sharing. This chapter explains
    why Shapley value analysis is generally inaccurate for most situations and why
    Shapley value analysis cannot be used for network access pricing, network cost
    allocation, the pricing of digital content, and analysis of electricity distribution
    networks.


    # 11.1 Existing Literature


    Borkotoky and Sarangi (2011) critiqued the Myerson value, the position value (for
    communication games only), and Jackson''s flexible network values and stated that
    these rules do not take into account simultaneous multilateral interactions and
    do not consider the notion of simultaneous multilateral interaction in a network.


    Some authors/researchers have attempted to apply the Shapley value (and related
    theories) to access pricing and to allocation of revenues/costs in networks—articles
    such as Ma et al. (2010), Cao et al. (2002), Kattuman et al. (2004), Jia and Yokoyama
    (2003), Bakos and Nault (1997), Morais and Lima (2007), Angel et al. (2006), and
    Altman and Wynter (2004).'
