    # # Illegal File Sharing and / Network-Access Pricing


    Internet network-access pricing remains a controversial issue that is of concern
    to government regulators, consumers, and ISPs, given the growing prevalence of
    the Internet in daily transactions around the world. This chapter (1) develops
    model of network-access pricing, which reduces or reduce the information producers''
    losses from copyright infringement and improves social welfare and the efficiency
    of computer networks; (2) develops optimal conditions for such pricing scheme,
    which will incorporate the effects of congestion, social welfare, copyright infringements,
    evolution of networks, and variations in usage; and (3) analyzes some of the main
    pricing issues and illustrates how the present mispricing of Internet access contributes
    to network congestion and illegal file sharing (IOF). The models developed in
    this chapter are also applicable to providers of virtual private networks in various
    industries such as consumer health care, financial services, education, entertainment,
    etc.


    IOF affects the economics, profitability, and business models of companies in
    many industries such as entertainment, education, travel, investments/finance,
    and any business knowledge has value. The pricing of Internet network access is
    a form of dynamic game because (1) the setting of optimal prices is a series of
    repeated games among the ISPs and regulators and network members; (2) the optimal
    access prices are not constant, but change over time, and also depend on the location/topology
    of network nodes; (3) there are various elements that change constantly (i.e.,
    time, network topology, wealth of ISPs, network congestion, illegal file sharing,
    magnitude of enforcement, consumers'' preferences, consumers'' wealth, etc.).


