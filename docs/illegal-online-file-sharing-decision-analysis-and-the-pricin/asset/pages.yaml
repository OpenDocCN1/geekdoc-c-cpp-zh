    # 4.1.8 Psychological Theories of Enforcement


    Henrich and Boyd (2001) proposed a cultural evolutionary model in humans for cooperation
    and punishment are acquired through (1) payoff-biased transmission, a tendency
    to copy the most successful individual, and (2) conformist transmission, a tendency
    to copy the most frequent behavior in the population. Henrich and Boyd (2001)
    noted that if a finite number of punishment stages are permitted, then an arbitrarily
    small amount of conformist transmission will stabilize cooperative behavior by
    stabilizing punishment at nth stage; and once cooperation is stabilized in one
    group, it may spread through a multipopulation group via cultural selection. Henrich
    and Boyd (2001) concluded that once cooperation is prevalent, prosocial gains
    favoring cooperation and punishment may invade the wake of cultural selection.


    Pierce (2009), Tetlock (2002), Deu et al. (2006), and Bodenhausen et al. (2003)
    analyzed and introduced psychological theories pertaining to enforcement of statutes
    and/or implementation of accounting regulations.'
