  md: 'Illegal Online File Sharing, Decision-Analysis, and the Pricing of Digital
    Goods


    # 2.1 Illegal Online File Sharing as a Moneeless Market


    IOF is essentially a moneeless market but is not a pure barter market. The IOF
    market is characterized by the following:


    +   - Relatively low transaction costs.

    - Continuous time—trading is done 24 hours per day, each day.

    - Money is not exchanged.

    - The property traded are (a) personal access rights—in exchange for the right
    to make his/her content available to others, the member obtains the right to access
    other members'' content on their computers, and (b) property rights—the right
    to enjoy digital content.

    - Exchanges are not based on monetary value.

    - Consumer utility has a major impact on the type, frequency, and volume of transactions.

    - There are no prices or even shadow prices.

    - The market is relatively transparent. There are readily available data about
    inventory of digital content.

    - There are substantial knowledge gaps and information gaps among market participants.

    - Market participants have relatively low influence on tastes and consumer choice
    in the market.

    - The aggregate value of transactions in the market is not a linear function of
    the size of the market.

    - The market has undefined and continuously evolving geographical boundaries;
    the boundary is a function of Internet penetration, leisure time (by geography),
    and consumer willingness-to-participate (willingness to possess digital content
    for third-party access).

    - The market is illegal, and there are substantial sanctions for participation.
    Hence, there is a balancing process in which consumers weigh the benefits of participation
    and the probability of prosecution and sanctions.

    - Activities in this market have a multiplier effect on other parts of the economy—time
    spent trading, time spent accessing content, psychological effect of content,
    opportunity costs (lost creativity and productivity), disutility from not finding
    specific digital content, content-producers'' loss of revenues (and resultant
    layoffs of staff), etc.


    # 2.2 Illegal Online File Sharing Contravenes Most Principles of Search Theory


    Research in search theory has attempted to explain the factors that cause or prevent
    matching in markets.

    Modern search theory can be categorized into at least five branches of research,
    which are follows, and some of which have been influential:


    +   - The Diamond–Mortensen–Pissrades models. These include Mortensen and Pissides
    (1994, 1999), Mortensen and Wright (2002), Mortensen (1982), Pissides (1979),
    and other articles.² *The Diamond–Mortensen–Pissrades* obviously did not consider
    the nature of search in digital media/contexts such as Internet networks, and
    the effect of, and search within offline Social Networks.

    - The Koopman (1946) and Stone (1989, 1992) line of research.

    - Various studies in human–computer interaction that were conducted during the
    last 15 years—these include but are not limited to the following: Wilson and Schraeafel
    (2010),'
