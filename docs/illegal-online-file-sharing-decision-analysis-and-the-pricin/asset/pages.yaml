    by limiting the unauthorized use of the works. The effect of copyright protection
    is a function of the utility/disutility consumer gains from consumption of the
    works (i.e., the music may be demotivating or irritating), the associated opportunity
    costs (the works may be outdated, and using them probably preclude the search
    for more recent and more valuable information), and the associated costs (the
