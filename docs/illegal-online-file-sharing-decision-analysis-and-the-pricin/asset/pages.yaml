    Several/researchers have explained the inaccuracies inherent in the Shapley value
    and related theories. Tick et al. (1999) stated that the Shapley value does not
    relate to the constraint point, but rather are based only on the coalition payoffs;
    thus, Shapley type analysis can provide an allocation for an inconsistent problem
    without any agreement point. Fatima et al. (2008) stated that (1) the problem
