    The gaps and omissions in the existing literature are as follows:


    +   1. The studies are not based on any coherent theories of human behavior. Almost
    all the studies address tangential issues.


    +   2. The empirical studies suffer from the statistical/data-analysis and data-selection
    problems and issues in Dellnitz and Junge (1999), Trafimov (2003), and other articles.


    +   3. The existing literature on IOF does not analyze moneeless markets.


    +   4. There has not been any analysis of the perceptions of time with respect
    to value of time and distance–relationships.


    +   5. The existing literature erroneously assumes that:


    +   a. All participants in IOF networks have the same amount of knowledge.


    +   b. All participants do not experience regret and experience minimal guilt.


    +   c. All units of digital content are substitutable–that is, the average human
    participant’s marginal propensity to substitute one unit of digital content for
    a different unit is usually substantial (compared to other assets/services).


    The rest of this section introduces hypotheses and theories of why people participate
    in illegal file sharing—some of these theories have not been identified or analyzed
    in the existing file sharing psychology, Internet psychology, and Internet-crime
    literature.


    Most of the biases, behaviors, and effects introduced here are in the nature of
    higher-order risk preferences and biases–which are derivative in nature, where
    one bias/behavior arises partly from or is ancillary to another behavior/behavior.
    Bernard (1926a) distinguished primary groups from derivative groups and gave specific
    examples of derivative groups in order of derivativeness. Bernard (1926b) analyzed
    conflicts between primary group attitudes and derivative group ideals. Hull (1936)
    in psychology also distinguishes between direct and derivative human (individual
    and group) behaviors. Deck and Schlesinger (2014), Noussair et al. (2013), and
    other articles have analyzed few higher-order risk preferences.


    # 2.3.2 Hypothesis-1: The Declining Consumer Loyalty Effect


    IOF is an order of, and a consequence of growing lack of consumer loyalty (which
    is caused in part by free products and free search), particularly in developed
    countries, where consumers are bombarded with advertisements in trains, buses,
    elevators, and from radios, TVs, videos, and in almost every aspect of life. The
    overall impact of this advertising is to reduce consumer loyalty, which translates
    into a need to access various types of digital entertainment and an increased
    propensity to participate in illegal file sharing networks.


    This declining loyalty effect is or be evident in (1) the changes in the percentage
    of members of IOF networks and (2) the percentage of members of IOF networks who
    have used the same product or service for different times (weeks, quarters, months,
    etc.); (3) the changes in the percentage of members of IOF networks that are willing
    to switch if given incentives and/or price discounts; and (4) the changes in the
    composition of digital content downloaded by members of IOF networks.'
