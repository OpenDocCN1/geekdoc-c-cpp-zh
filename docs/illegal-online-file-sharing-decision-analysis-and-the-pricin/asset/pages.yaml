    algorithm is if they use all the commercially available routing algorithm—which
    is highly unlikely. The second-best alternative is to provide a system of cash
    incentives to convince each ISP to allow other ISPs to influence their routing
    algorithms. The properties of any such incentive (Q) are as follows:


    +   1. Consistency and time invariance: The ISP cannot deviate from the incentive
    mechanism Q.

    2. Scope limitation: Q is limited only to participating ISPs. This presents a
    huge problem because coalition members cannot control the growth of nonmember
    ISPs. In some markets, coalition members must connect with nonmembers of the coalition,
    in order to complete transmissions.

    3. Equivalence: $\int_0 Q_i dt > \int_0 O_i dt$, where Oi is the value of the
    ISP''s opportunity costs of complying with the incentive mechanism in every transmission.
    Qi is the value of the incentive mechanism for the ISP for transmission i.

    4. Additivity: For any ISP cannot choose an optimal path over $d_i$,


    Because any ISP cannot choose an optimal path in the network, Stackelberg analysis
    is not applicable to network access-pricing or revenue allocation or cost allocation
    in networks.


    # Theorem 12.3


    For any network transmission over any distance (d), the ISP''s share of revenues
    (or share of transmission costs) generated by the coalition is always nonnegative
    (can be negative).


    Proof: The Stackelberg analysis function erroneously assumes that the ISP''s share
    of revenues generated by the coalition is always nonnegative and the ISP''s share
    of costs generated by the coalition is always nonnegative. On the contrary, there
    are instances where the ISP''s share of total transmission revenues generated
    by the coalition is negative (less than zero) or should be negative, and these
    include the following:


    +   1. When the ISP''s transmission results in excessive packet loss such that
    the entire information unit has to be transmitted.

    2. When the ISP earns noncoition third-party benefits for carrying the packet,
    but is effectively subsidized by coalition members.

    3. Where specific transmission algorithms (and congestion control algorithms)
    that are implemented by coalition-member ISPs, AS of a packet increases the probability
    that certain types of packets will be sent by both coalition member and nonmembers
    and transmitted through ISP-As.

    4. When transmitting a certain packet through the ISP''s network exponentially
    increases each subsequent coalition member''s costs of carrying the same packet
    to destination.

    5. Where transmission by an ISP results in addition of data to the packet that
    increases the required minimum bandwidth and for further transmission by all other
    coalition members.


    Given the foregoing, Stackelberg analysis is not applicable to network access
    pricing or cost allocation (or revenue allocation) in networks.'
