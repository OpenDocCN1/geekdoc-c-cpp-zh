    For the same and similar reasons stated in this chapter and in Roth and Verrecchia
    (1979), and contrary to Lima et al. (2008), Chun et al. (2016), Rhymend and Uthararaj
    (2016), Kim (2016), Calvo and Guitiérrez (2013), Jia and Yokoyama (2003), and
    Kattuman et al. (2004), the Shapley value function (similar approaches such as
    the Owen value) cannot be used for allocating electricity transmission costs.


