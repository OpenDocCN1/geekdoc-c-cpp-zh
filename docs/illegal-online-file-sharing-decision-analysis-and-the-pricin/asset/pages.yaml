    # 11.4 The Shapley Value Is Inaccurate and Cannot Be Used in the Analysis of Access
    Pricing or for the Allocation of Revenues/Costs in Networks


    Within the context of interconnection agreements, the Shapley value can be accurate
    and relevant if and only certain conditions exist—the following are the conditions
    required for Shapley value analysis to be valid and why these conditions are false
    and do not exist.


    # Condition 11.1


    The physical structure of the Internet is never constant.


    In reality, although the physical connections of ISP’s networks may remain fixed
    in time and space, the true structure of the network (the actual transmission
    pathways, and hence the network) is not constant and changes instantaneously,
    depending on the locations of the receiver-receiver pairs. In all instances, each
    packet has more than one feasible path. Furthermore, in land-based networks, the
    cable used in transporting packets typically has more than one set of wires so
    for each distance d in any cable, there is more than one feasible transmission
    pathway. Similarly, for any wireless network, for any two points in distance d,
    there are many possible transmission paths.


    # Theorem 11.1


    For any mission, even if the originating ISP knows the cost structure and payoff
    of every ISP that is required to transport any packet, optimal allocation of costs
    or revenues among cooperating ISPs is never feasible.


    Proof: The Shapley value analysis erroneously assumes that each ISP knows the
    cost structure and payoff patterns of every other ISP that is a member of the
