    # 3.4 Conclusion


    Illegal online/offline file sharing and content-control problems can be solved
    by (1) gaining a better understanding of the socioeconomic and behavioral issues
    inherent in P2P systems and distribution systems; (2) development of business
    models that minimize economic losses; (3) effective allocation of resources for
    monitoring, enforcement of IP laws, and digital rights management; (4) development
    of appropriate technology that considers legal and economic factors; and (5) enactment
    and implementation of IP laws that have significant deterrent effects, reduce
    monitoring and enforcement costs, and provide summaries for processing.


