    # Observation 12.4


    The Stackberg allocation is not feasible for revenue allocation in networks because
    the Stackelberg mechanism (for profit sharing) does not account for differences
    in sources of demand among coalition members (i.e., share of customers).


    The Stackelberg mechanism does not account for differences in sources of demand
    for the coalition''s services and products and erroneously assumes that demand
    is uniform and for all coalition members—the Sharing mechanism does not account
    for the number of customers delivered to each ISP. To be accurate and prevent
    jealousy and defections, the sharing mechanism must reward ISP members for the
    volume of business (completed past transmissions) and the quality of business
    (e.g., long-term vs. short-term customers, high-bandwidth vs. low-bandwidth) that
    they bring to the coalition.


    # Observation 12.5 (and revenue sharing) game is not a cooperative game.


    Network access transmission and revenue allocation is not a cooperative game or
    semicooperative game. The fact that ISPs enter into interconnection agreements
    does not make any revenue allocation system a cooperative game. Network access
    (and any implicit revenue allocation or cost sharing) is a noncooperative game
    of the following:


    +   1. In any given market, most ISPs are fierce competitors, and each ISP spends
    substantial amounts of money on advertising, promotions, and marketing.

    2. Each ISP spends substantial amounts of capital (cash, human capital, intellectual
    capital) on building its own physical network, with the intent of providing as
    much geographical coverage as possible. If ISPs built their networks with the
    objective of minimizing the size of their physical networks (obtaining as much
    coverage as possible through interconnection agreements), then it could be inferred
    that the ISPs seek suboptimal and insufficient geographical coverage of each ISP''s
    network or of the combined networks. Thus, it can be reasonably inferred that
    ISPs enter into interconnection agreements as a matter of convenience and to accommodate
    their customers'' needs (and when the ISP identifies certain traffic patterns).
    Furthermore, of the two types of interconnection agreements, peering agreements
    account for more than 70% of all interconnection agreements, and peering agreements
    do not result in any additional costs for the ISP (ISP agrees to carry the other
    ISP''s traffic for free).

    3. In most markets, most consumers have only one or two ISPs, and one Internet
    access point. Hence the choice of one ISP results in an automatic loss for other
    ISPs in the same market. This economic loss occurs because of the sunk costs (infrastructure,
    advertising, administrative costs) incurred by ISPs.

    4. Each time an ISP1 transits a packet for another coalition member (ISP2), ISP1
    loses brand equity and ISP2 gains brand equity because ISP2 is completing service.
    Interconnection fees often do not compensate ISPs for such loss of brand equity.


    Therefore, Stackelberg analysis is not applicable to network access pricing.'
