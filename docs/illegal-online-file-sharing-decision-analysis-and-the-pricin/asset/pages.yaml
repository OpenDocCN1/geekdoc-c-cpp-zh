  md: '# Chapter 1


    # Introduction*


    This book is intended for university professors, PhD researchers in industry (computer
    science, theoretical economic psychology, and operations research), and PhD-level
    policy analysts in government. Illegal online file sharing (IOF) has resulted
    in millions of dollars of losses for many companies and substantial lawsuits by
    trade groups and entertainment companies. Illegal-down affects the economics,
    profitability, and business models of companies in many industries such as entertainment,
    education, travel, investments/finance, and any business where knowledge has value.
    In the United States, the Napster case illustrates some of the policy, sharing
    continuing, technological, and economic issues inherent in systems for downloading
    content. The volume of file sharing continues to grow despite lawsuits and criminal
    prosecution (by the Recording Industry Association of America and other trade
    groups), introduction of new digital rights management (DRM) systems and legal
    content downloading portals. However, video traffic becomes a larger component
    of Internet traffic.


    IOF has or can have negative economic multiplier effects and across national economies.
    When IOF occurs, (1) content-production companies and people lose substantial
    revenues; (2) as a result, employees of content-production companies are either
    laid-off or their salaries are reduced, which reduces in household spending and
    consumer confidence, and can increase consumer demand; (3) in addition, the content-production
    companies become less financially stable and have their investment in content
    production and R&D, all of which results in bad economic news that also have adverse
    effects; (4) government spending declines because of both actual and lower anticipated
    tax revenues, and the government may have to borrow more money to cover budget
    deficits; (5) consumers become less likely to physically visit retail stores and
    thus retail revenues and transportation revenues (government revenues from such
    activities) are likely to decline; and (6) consumers become more likely to conduct
    online searches and to spend more leisure time (and even some work) on their computers,
    which increases health risks and associated costs and or reduce employee productivity.
    The TERA (2010)² studied that digital piracy would cause the loss of as much as
    1.2 million jobs and €240 billion in retail revenues by 2015 if the trend continued.
    Risen (2013),³ RIAA (2015),⁴ and Scholes (2014),⁵ summarized


    > * This chapter contains excerpts from an article that was written by Michael
    Nwogugu and published as: Nwogugu, M. (2006). Corporate governance and the economics
    of digital content: Some legal issues. Computer & Telecommunications Law Review,
    12(1), 5–13.'
