    # 10.3 Search Costs and IOF, search costs and Optimization


    Within the context of search, search costs can differ dramatically in the following
    ways:


    +   1. Different consumers may place different values on their time that is used
    for search.

    2. The opportunity costs of search can differ among consumers.

    3. The notions and definition of a successful online search can differ dramatically
    across consumers and over time for any one consumer.

    4. The utility gains from a search or a series of online searches can differ dramatically
    among consumers and can differ over time for any consumer.


    Branco et al. (2012, 2015) and Ke et al. (2016) attempted to develop models of
    optimal search, optimal stopping point, and optimal prices but all of which are
    wrong for the following reasons. For the same reasons stated in Taleb (2009),
    stochastic calculus cannot be used in, and is very inappropriate for, the analysis
    of optimal-search, optimal stopping, or optimal prices. The typical product price
    does not following specific known distributions. Consumer tastes changes rapidly.
    In the Internet, search costs are relatively very low.


    As mentioned, the foregoing pricing models for digital content can be solved as
