    # 2.3 Economic, Social, and Psychological Issues That Pertain to Individuals


    # 2.3.1 Existing Literature


    Illegal file sharing seems to provide some perceived advantages, utility, and
    mental stimulus that are not provided by legal purchases from content owners.
    The relevant literature on the economic psychology of IOF emerged during 2006–2016.
    Loss Aversion has been discussed in the existing literature but not in the context
    of file sharing. People participate in IOF works because they are averse to losing.
    In these circumstances, losing is conjectured to be equated to selecting the wrong
    digital content and/or spending too much time to search for digital content, and/or
    having to pay for digital content that has uncertain value. This type of aversion
    is conquered by the fact that most digital contents are not sold with dynamic
    pricing or prices—there are typically no prices for sampling portions of a unit
    of digital content.


    Rehearsal in online systems has also been discussed in the literature. The issue
    of regret and sampling of digital content before purchases has also been discussed
    in the literature. Consumers participate in IOF because it reduces the regret
    inherent in purchasing and content allow only limited product returns, carry relatively
    low variety of content, and require more stress/activity/mental effort to view
    content. On the contrary, illegal file sharing does not have any of these disadvantages
    and the growth of computer hardware and bandwidth has made using the Internet
    and digital content much more accessible, that digital experiences are common
    staples of daily life. The computer and many handheld devices, cassette players,
    and other devices now have many of the functions performed by workers, today''s
    increasingly digitized environment are more likely to participate in IOF, compared
    5–15 years ago. The increased volume of human–computer interaction has created
    consequences that exacerbate/the propensity to participate in IOF.


    Peer motivation has been discussed in the literature and illegal file sharing
    can also be attributed to encouragement and motivation by peers (in social groups)
    to try the activity. In such cases, the propensity to participate is a function
    of social networks, education, family background, morality, stress, and beliefs
    among other factors.


    The authority-deficit effect has also been discussed in the literature. The absence
    of a visible police presence in the Internet and of electronic tags (as in space)
    increase consumers’ propensity to participate in IOF. These users view the Internet
    as a distinct world that is much less policed, and here much less punitive and
    more tolerant of criminal misconduct. This thought process increases the propensity
    to participate in illegal file sharing networks.


    The habit effect has been discussed in the literature and people participate in
    illegal file sharing as a matter of habit. They can get accustomed to illegally
    sharing files at specific times of the day, or at specific locations, in specific
    contexts, and then it becomes part of their social life and routine. The habit
    effect is supported by the rapid penetration of the Internet in the United States—more
    than 60% of all households now have access to broadband and more than 70% of the
    U.S. population aged 18 years or older now have access to broadband at work or
    at home. Many companies and households have not placed any network restrictions
    on illegal file sharing sites—hence, availability/access supports the habit.'
