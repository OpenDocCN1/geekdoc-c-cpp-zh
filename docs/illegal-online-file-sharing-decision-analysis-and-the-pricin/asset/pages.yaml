    # 11.3 Interconnection Fees Can Be Irrelevant in Network Design


    The existing literature on network access unnecessarily focuses on interconnection
    fees (peering fees and transiting fees) as the main element for the improvement
    of networks. The main method of analysis has been game theory, which has shown
    to have major weaknesses.


    Peering carries the other ISP''s traffic and the mutual termination of packets
    originating from each of the peer networks to the domain of the other. However,
    peering results in some costs/fees when traffic is asymmetric. Peering requires
    adjacency of the network that is a significant limitation in the management of
    interconnection agreements for the approximately 35,000 Autonomous Systems or
    internet service providers (ASes) existing.


    Johnson (Variety) February 26, 2015) noted that the US Federal Communications
    Commission (FCC) had approved the regulation of the Internet in the United States
    as a utility. The Economic Times (India) (January 9, 2015) commented on regulator''s
    rate setting for interconnection fees in Mexico. This newspaper (Nigeria 2013)
    29, 2014) noted that the Nigerian Communications Commission was considering the
    choice between symmetric and asymmetric interconnection models for voice services.
    The reality is that in many countries, governments regulate interconnection fees
    for networks. Many have experimented with symmetric and asymmetric pricing models
    and combinations of both (such as in Mexico and Nigeria).


    The general consensus in the literature is that peering is economically feasible
    only if the cost of the traffic exchange between two networks exceeds the sunk
    costs of building the interconnection infrastructure and the operation, and maintenance
    (OPM) costs for maintaining it. This consensus is because it does not consider
    opportunity costs, and it does not consider the reputation of telecom companies—interconnection
    has a symmetric relationship with reputation.


    Walrand (2008), Bucercirosi et al. (2005), Cremer et al. (2000), Baake and Wichmann
    (1999), and Laffont et al. (2003) developed various models to compute the sometimes
    nonneglible connection costs and other transaction costs, that can affect network
    pricing, network design, regulators'' decisions among ISPs, network exchanges,
    and ISPs'' decisions about acceptance of traffic from various types of networks.
    The significant growth of Internet traffic'
