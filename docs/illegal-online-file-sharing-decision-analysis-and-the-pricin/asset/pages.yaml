  md: '# 58 Illegal Online File Sharing, Decision-Analysis, and the Pricing of Digital
    Goods


    Physical complements:

    When you buy a physical CD you get liner notes, photos, and so on. Perhaps you
    could get a poster, a membership in a fan club, a lottery ticket, a free T-shirt,
    as well. These items might not be available to someone who simply downloaded an
    illicit copy of song.


    Service complements:

    One can give away the product (e.g., Red Linux) and support contracts. One can
    give away a cheap, low-powered version of some software and sell a high-powered
    version.


    Subscriptions:

    In this case, consumers purchase the information over a bundle time, with the
    motivation presumably being convenience and perhaps timeliness of the information
    delivery. Even if all backs are (eventually) posted online, the value of timely
    availability of current issues is sufficient to support production costs.


    Personalized version:

    One can sell a personalized version of product so that copies made available to
    others would not be valuable. Imagine, for, a personalized newspaper with the
    items that you would wish to read. With different tastes may not find such a newspaper
    architecture. Selling with digital fingerprints (encoding the identity of the
    purchaser) is an extreme form of


    > (Playback has allegedly put digital fingerprints in online images.)


    Advertise yourself:

    A downloaded song can be an advertisement for a personal appearance. Similarly,
    an online textbook (particularly if it is inconvenient to use online) can be an
    advertisement for a physical copy. There are many examples of materials that are
    freely published on the Internet that are also available in various physical forms
    for a fee, such as US Government publications (e.g., the 9/11 Commission Report,
    or the National Academy of Sciences reports.


    Advertise other things:

    Broadcast TV and radio give away content in order to sell advertisements. Similarly,
    most magazines and newspapers use the per copy price to cover printing and distribution,
    while editorial costs are covered by advertising. Advertising is particularly
    valuable when it is closely tied to information about prospective buyers, so personalization
    can be quite important. In an extreme form, the advertisement can be completely
    integrated into the content via product placement.


    Monitoring:

    ASCAP monitors the music in public places, collects a flat fee, which it divides
    among its members. The shares are determined by a statistical algorithm. The Copyright
    Clearance Center uses a similar system for photocopying—a fee based on an initial
    period of statistical monitoring.


    Site licenses:

    An organization can pay for all of its members to have preferred access to some
    particular kinds of content. University site licenses to JSTOR content, Elsevier
    content, or Microsoft software are examples. This is particularly relevant when
    there are strong network effects from adopting a common standard, such as in the
    Microsoft example.'
