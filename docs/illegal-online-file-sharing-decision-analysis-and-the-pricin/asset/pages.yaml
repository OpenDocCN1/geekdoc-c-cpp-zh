    # 4.1.3 Damages and Sanctions for Illegal Online File Sharing


    The optimal sanction for copyright infringement incorporate not only costs of
    achieving desired levels of protection but also the effect of penalties and processes.
    The literature on punitive damages and sanctions is substantial but somewhat tangential
    to IOF and includes: Barr et al. (2003), Kleinman (1993), Miklasvich and Friehe
    (2008), Adomer and Liang (2014), Jeong and Khouja (2013), Kim and Lee (2015),
    Eivazi (2012), Synodinou (2015), Tang (2010), Banerjee (2003, 2006), Gunn (2015)
    and Ong (2015) studied issues that pertain to sanctions/punishment of IOF, but
    as explained herein and by most of the analysis and models in Arai (2011) are
    wrong.


    Bilo et al. (2013), Christodoulou et al. (2012), Anshelevich and Caskurl (2011),
    Gabarro et al. (2011), Hegde et al. (2015), Emek and Feldman (2012), and Fiat
    and Saia (2007) studied network games and network-formation theories. Clark (2007)
    analyzed legal liability for illegal downloads.


    However, the significant gaps and omissions in the existing literature are as:


    +   1. The analysis of the non monetary values and costs of prosecution

    2. The objective(s) for maximizing social welfare

    3. The analysis of the deterrence effect as distinct from disutility experienced
    by infringers during prosecution

    4. How the proposed sanctions address and curtail the availability and use of
    the currency (time, cash, other property, Internet access rights, etc.) used in
    the illegal activities

    5. Perpetrator''s perceptions/judgments of the economic system and fairness of
    prices and the resulting impact on propensity to perform

    6. The conditions under which perpetrators will continue illegal activities

    7. The content owner''s/information perpetrator''s innate inertia, and its willingness
    to take action to enforce its rights through monitoring and civil/criminal complaints

    8. Sanctions as a direct or indirect function of perpetrator''s risk aversion

    9. Sanctions as a direct or indirect function of the infringer''s marginal cost
    of substitution (substituting digital content for physical content, or substituting
    legal content for illegal content and vice versa)

    10. The perceptions of risk of perpetrators in illegal file sharing networks

    11. How perpetrators'' behaviors differ from what is expected under existing theories

    12. The conditions under which IOF will continue

    13. The effects of incentives in IOF networks on perceptions of risk

    14. The effects of penalties on perceptions of risk in IOF networks

    15. Effect of allocation of liability on perceptions of risk'
