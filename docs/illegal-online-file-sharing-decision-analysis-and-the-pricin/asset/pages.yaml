  md: '# Complexity and Optimal Sanctions for Illegal Online Sharing ■ 63


    The typical P2P sharing networks are complex adaptive systems, which are open,
    dynamic, nonlinear systems, and are characterized by self-organization or emergence.
    Emer arises from unexpected system-wide behavioral patterns that arise from the
    predictable local interactions of the system''s elements (nodes/participants,
    the physical network, digital content, bandwidth, regulation, monitoring, threat
    of prosecution, etc.), facilitating adaptation to the surrounding environment.
    Within P2P networks, these adaptations include anonymity (very difficult to identify
    individual members of the network), BitTorrent streaming, and the dynamic form
    of the network that changes as members join or leave the network but also as members
    add or delete the amount of digital content in their computers'' hard-drives.


    In illegal sharing networks, the attractors include the following: (1) social
    community; (2) economic gain (or absence of economic loss); (3) the magnitude
    and quality/effectiveness of punishment by government agencies; (4) the divergence
    between the perceived risk and the actual risk of participating in illegal file
    sharing networks; and (5) the changes in consumer tastes for digital content.


    Gill (1996), Radnicki and Taheed (2009), Popicki (1997), and Paul and Eisen (2000)
    discussed chaos and complex systems in the context of legal/regulatory systems
    and institutional economics. Coleman et al. (2007) analyzed chaos and dynamical
    systems in psychology research. Kuhlman and Mortevait (2014) and Melnik (2013)
    studied chaos and contagion in networks. Kiel and Elliott (1997), Beesley (2010),
    Williams and Argo (2002), and Young (1997) analyzed the applications of chaos
    theories to crime and organized crime. Coleman et al. (2007) and Pavlov (2005)
    analyzed the elements of institutional conflict inherent in illegal file sharing.
    Huang et al. (2007) surveyed factors that influence movies (both theater tickets
    and DVDs) are adversely affected by illegal file sharing.


    Coleman (2007) and Pavlov (2005) analyzed the elements of institutional conflict
    in illegal file sharing. Huang et al. (2007) surveyed factors that influence people''s
    perception of information security. Knoblich and Sebenz (2008) discussed four
    mechanisms that enable social interactions, with which these mechanisms differ
    in terms of how organisms are able to process and distinguish others'' intentions.
    These mechanisms include (1) entrainment and simultaneous affordance in intentionally
    blind individuals; (2) the interface between perception and action, (3) shared
    perceptions, based partly on the ability to distinguish other people'' intentions;
    and (4) joint formation of intentions with simultaneous differentiation of intentions.
    Bekerker and Clement (2006*) analyzed the reasons why people illegally share file
    files and concluded that pursuing only a legal strategy will not work, and they
    suggested various strategies. Many of these strategies have already been tried
    in the United States and foreign countries and have not been successful in reducing
    IOF, and these strategies are not geared toward increasing the perception of illegal
    file sharing as a high-risk activity.


    # 4.1.2 The Bhattacharjee et al. (2006) Study


    Bhattacharjee et al. (2006) is notable because it is one of the first articles
    that attempted to address the issues of lawsuits and perpetrators'' reactions
    to sanctions for IOF.


    The omissions and problems in Bhattacharjee et al. (2006) are as follows. The
    results of the tests are specific to the time period, type of content, type of
    audience, etc. The distinction between illegal downloading and illegal sharing
    of digital content is unnecessary because both are illegal. The results are not
    applicable to fourth-generation file sharing networks, for example,'
