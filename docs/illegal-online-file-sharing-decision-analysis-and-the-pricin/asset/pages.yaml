    > ...The current strategy increases the costs of participating in P2P networks
    by systematically using users who illegally copied protected material may help
    to reduce the willingness to share. Our results indicate a negative influence
    of costs on sharing behavior. However, there is a segment of heavy sharers that
    internalizes the costs and keeps providing a substantial number of files. The
    fewer users who provide files to the network, the more these heavy sharers become
    important—an argument stated by users to engage in piracy or other projects. The
    results of our study also show negative effects when the music industry only follows
    a legal strategy. The underlying motive of the users is the open source development
    of anarchic p2p networks like Mute that encrypt the communication between the
    peers in a way that the RIAA or MPA will hardly be able to identify. Because Mute
    is an open source project, the development will attract users who want to feel
    secure from legal actions by the music industry.... Therefore, we suggest expanding
    the current strategy of the music industry by using other elements. First, if
    the users receive very little reciprocity for their offer, they will reduce their
    supply. The same can be said for a user who believes that his offering is no important.
    Thus, a strategy that influences this perception is because the music industry
    does not wish to satisfy the demand for free media. Second, the easier a user
    can access files in legal services such as iTunes or Napster 2.0, the less attractive
    are the alternatives besides participating in these networks not only illegal
    risk but also high cost of the file, spyware etc. Therefore, we suggest that the
    music industry should license their content to other parties extensively. Third,
    some of the p2p networks have already installed barriers against free riders (i.e.,
    some OpenNap servers) or use incentive mechanisms to reduce the free riding within
    the network. For instance, KaZaA is providing higher priorities to heavy sharers.
    However, the software KaZaa Lite (which does not originate from the founders of
    KaZaA) allows the usage of the KaZaA network without download restrictions—a paradise
    for free'
