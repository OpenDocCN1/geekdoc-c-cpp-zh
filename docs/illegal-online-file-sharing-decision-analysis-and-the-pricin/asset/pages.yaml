    # 7.4.9 The Marginal Cost of Illegal Diffusion


    MCID is the loss incurred by the owner/distributor when one consumer illegally
    downloads one unit of digital content and shares it with people who are not members
    of the IOF network. MCID affects the rights holders average costs and marginal
    costs of production and distribution (1) MCID is an indicator of network externalities,
    and the consumer''s perceived value of content, and propensity to purchase digital
    content; (2) MCID affects holder''s distribution costs—encryption/DRM, systems
    development costs, etc.; and (3) MCIDID can help in (1) determining how liability
    and punitive sanctions should be apportioned among ISPs, members of P2P networks,
    and persons who share files but are not members of P2P networks, (2) determining
    how much owner/distributor should spend on enforcing IP rights in the physical
    domain, and (3) determining the effects of size of the P2P leakage.


    # 7.4.10 The Marginal Cost of Channel Choice (MCCC)


    MCCC is the per-unit cost (reduced margin) that the content owner incurs, if any,
    by selling one unit of content through an independent record store or share chains
    (CDs, DVD, Flash drives) rather than through the Internet. The MCCC affects the
    rights holders or distributor''s average costs and marginal cost because (1) it
    rights holder distribution costs (encryption, production costs, marketing costs,
    etc.) and the prices it charges for products; (2) it affects the holder''s/distributor''s
    profit margins; (3) it affects content owner''s distribution channel decisions
    and allocation of resources to marketing efforts; (4) MCCC helps in developing
    strategies for digital content that is sold in both the Internet and physical
    domains; and (5) MCCC is an indicator of consumer preferences for various channels
    for different forms of content. Hence, digital content should be priced to reduce
    the propensity to substitute search time for spending to purchase digital content.


    # 7.4.11 Sunk Costs and Valuation of Digital Content


    Contrary to assertions in some articles, under no circumstances can piracy increase
    the value of digital content—see the analysis in Chapters 9 and 10 on valuation
    of digital content. The value of digital content directly depends on the utility
    of people/groups that access it. Because consumers derive substantial utility
    from digital content, differences among content owners/distributors cannot be
    explained entirely by differences in sunk costs (marketing, distribution networks,
    overhead costs, advertising, financing costs, etc.), costs of preparing the prototype,
    etc.'
