    beginning of t2 and so on for subsequent submissions. The packet moves from B
    to C, D and E and F have changed, and a new allocation must be made. The sensitivity
    of the optimality of allocations to the cost/price pairs is very high because
    of the nature and volumes of transmission of packets (the contents of ISPs total
    transmission costs (TTCs) can vary dramatically across different ISPs and are
    explained later). First, because these TTCs and prices are difficult to calculate
    and the micro (per millisecond) cost data required to calculate them are available
    infrequently (best, on a daily or hourly basis), there is sufficient data for
    determining any optimal allocation of costs or revenues among a cooperative network
    of ISPs. Second, because most ISP interconnections are expensive, introducing
    the voluntary or mandatory exchange of cost/price data among ISPs is likely to
    create substantial disagreements over fairness of allocations and will also affect
    (reduce) each ISP''s willingness to invest capital to build physical or wireless
    networks. Each ISP calculates differently. Disclosure-free routing will, in turn,
    limit the growth of the coalition''s overall network and eliminate any efficiency
    of the allocations of costs/revenues among the ISPs.


    # Theorem 12


    For every packet and each time interval t, and for any distance d in the coalition''s
    combined network, each ISP (O-ISP or transmitting ISP) cannot choose an optimal
    path.


    Proof: An ISP cannot control the routing choices of other ISPs. In the reality
    perceived for each packet is determined by prestablished algorithms of each ISP
    and these algorithms do not always adapt to changes in the network physical structure
    or transmission path(s)—which is referred here as coordination-control neutrality.
    Furthermore, because each ISP is not able to obtain accurate information about
    historical or future packet loss, it is impossible for the ISP to plot an optimal
    transmission path. It is highly unlikely that any ISP will permit other ISPs to
    control or influence their routing algorithms in a cooperative network. Antitrust
    laws will almost surely prevent such coordination. Routing algorithms are complex
    and sensitive to network characteristics and the level of human input. The only
    feasible way that ISPs in a cooperative network can safely influence each other''s
    routing'
