    # 10.5 Conclusion


    IOF and content control remain major problems with economic, technological, legal,
    and policy ramifications. These problems can be solved by development and implementation
    of appropriate pricing strategies that minimize losses for owners/distributors,
    reduce illegal copyright infringement, and incorporate the limitations of available
    technologies and Internet protocols.'
