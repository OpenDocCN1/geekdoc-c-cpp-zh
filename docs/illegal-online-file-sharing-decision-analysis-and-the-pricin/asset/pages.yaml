    1.2.1.2.2 The Australian Federal Court Cases


    There are three Australian federal court cases that have produced rulings that
    are quite different from MGM v. Groster and imposed varying levels of liability
    for infringement for various types of entities. Some developments will substantially
    affect determination of liability for copyright infringement in Australia:


    +   - The Australian/U.S. Free Trade Agreement (FTA) became effective on January
    1, 2005; and under the FTA, there are safe harbor provisions that were incorporated
    into the Copyright Act, which provides defenses for ISPs if their infrastructure
    is used for illegal file sharing. The safe harbors cover caching, transmission,
    hosting, and referencing of infringing content. The safe harbors are conditioned
    on certain eligibility standards for application.

    - In Australia, the proposed ISPs code of conduct that is being developed by the
    Internet Association of Australia will provide standards for liability for ISPs
    and web-hosting companies (Buettel, 2010).

    - Industry groups have proposed codes of conduct to be implemented by ISPs (Pearse,
    February 20, 2015).


    1.2.1.2.2.1 Universal Music Australia Pty Ltd vs. Sharman License Holdings Ltd.
    On September 5, 2005, an Australian federal court issued a copyright infringement$^{12}$
    (see Wilcox, 2005), because Kazaa was found liable for copyright infringement,
    though Kazaa had posted warnings on its website (against illegal file sharing).
    Kazaa website did not specifically advise users how to share copyrighted content
    and did not directly refer to users. In an end-user license agreement, Kazaa warned
    users not to violate copyrights. The Court found that Kazaa had encouraged and
    that Kazaa incorporated any filtering devices in their P2P system that would prevent
    or reduce illegal file sharing. The Court raised the issue of imputed knowledge
    of infringement that created a duty to prevent infringement. The Court ordered
    the defendants to include non-optional keyword filtering technology in their P2P
    system—so that users cannot share files except by licensed works or by the system.$^{13}$


    1.2.1.2.2.2 Universal Music Australia vs. Comcen In a second Australian federal
    court case (see Tamberlin, 2005)$^{14}$ the Court found that a website (mp34free.net)
    infringed by providing links to websites that had infringing sounds and that Comcen
    (an ISPA named E-Talk Communications, aka ComInternet Services) was liable for
    copyright infringement by hosting the mp34free.net website. This was the first
    case globally in which a court found an ISP and website liable for copyright violations
    (because the ISP allowed its infrastructure to be used to infringe copyrights).
    The Court also found that the defendant/respondent violated Section 52 of the
    Trade Practices Act by making false claims. In the defendant/ respondent P2P system,
    users could download from a central server, although respondent had disabled the
    central server. The case raises several issues pertaining to privacy of subscribers
