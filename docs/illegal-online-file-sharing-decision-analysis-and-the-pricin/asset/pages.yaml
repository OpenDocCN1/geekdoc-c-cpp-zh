    # 13.3 New Network-Access-Pricing Scheme That Can Reduce IOF


    The following is an Internet access pricing scheme for Internet access that seeks
    to incorporate Internet usage, online copyright infringement, congestion costs,
    and the ISP''s costs of providing service. This pricing scheme assumes the following.
    There will be two tiers of traffic: (1) level one (the IBPs) and (2) level two
    (the ISPs). There will be termination charges per user, only if the user exceeds
    a specified bandwidth threshold per month. The monthly access fee will consist
    of two components: (1) a flat fee for Internet access and use of a certain amount
    of bandwidth per month, and if the user uses more than a certain amount of bandwidth
    in any month, the second level will apply; and (2) the second level is a fee per
    unit of bandwidth over above a specified amount of bandwidth—this fee can be capped
    for each period (monthly or quarterly or semiannually or annually). Consumers''
    choices about access pricing fees are based on household wealth or company assets,
    and the relative price and utility of Internet access compared to other expenses.
    The ISP incurs several types of costs in order to provide services such as general
    and administrative costs, direct transmission costs (interconnection fees, bandwidth,
    labor, depreciation of equipment.), marketing costs, capital expenditures (Internet
    infrastructure, buildings, equipment, etc.), and compliance and regulatory costs.'
