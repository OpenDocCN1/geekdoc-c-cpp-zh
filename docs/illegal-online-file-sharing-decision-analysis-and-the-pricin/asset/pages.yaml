    Michael Nwogugu, CPA (inactive; United States), CMA (inactive; United States),
    is an author, entrepreneur, and consultant. Mr. Nwogugu has held senior management
    and board of director positions in companies in the United States and Nigeria
    in various sectors, including entertainment/

    Internet/media, automotive, business services, and healthcare. He has completed
    mergers, acquisitions, reorganizations, joint ventures, and strategic alliances
    that were collectively worth billions of U.S. dollars. Mr. Nwogugu has advised
    boards of directors and senior management about sensitive issues such as executive
    compensation, exemptions from franchising disclosures, cost reduction, transfer
    pricing, incentive plans, and strategy. He has managed portfolios of commercial
    real estate and conducted due diligence on large portfolios of commercial mortgages,
    business loans, and commercial real estate leases. Mr. Nwogugu has written and
    published articles in international referred journals as Manager Auditing Journal
