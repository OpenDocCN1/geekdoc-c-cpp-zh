    # 13.4 Effects of Internet Protocols


    Internet protocols have a substantial effect on peering and transmissions and
    hence on the file sharing problem. Blundo et al. (2005), Sicker and Štuka (2004),
    Amah et al. (2016), Qadir et al. (2014), López et al. (2010) discussed relevant
    issues. Some companies have developed proprietary protocols for file sharing,
    but most protocols relate to the four most common protocols (SMTP, IP, FTP, HTTP),
    although file sharers use Hotline, IRC, Usenet, and ICQ protocols. The key issues
    are as follows: There is no dominant standard protocol, there are no coordination
    mechanisms among Internet protocols, online payment systems, and downloading processes
    at content owners'' websites and storage systems. The major IP backbones do not
    regulate protocols. The cost of creating and implementing new protocols is relatively
    low. The knowledge for creating new protocols is easily understandable and can
    be acquired by a large number of people.


    As individuals can create protocols, and IP backbones do not regulate the type
    of protocols they carry, illegal file sharing is likely to continue. Possible
    solutions are but not limited to the following:


    +   1. Designing and encoding media files that they can be transported in the
    Internet using only one type of proprietary protocol that will be controlled by
    the content owner/distributor and that the file will be wherever it is in the
    Internet.


    +   2. Having all ISPs and IP back limit the number of permitted protocols and
    develop standard protocols for different purposes (by limiting and standardizing
    protocols, content owners will be better to monitor and control file sharing).


    +   3. Making it mandatory for ISPs to identify and report Internet users who
    consume substantial bandwidth.'
