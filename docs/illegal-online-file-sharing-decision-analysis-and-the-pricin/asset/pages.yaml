  md: '# Illegal Online File Sharing and Information Producers’ Strategies 59


    Media tax:

    This is a tax on physical good that is complementary to the information product
    (i.e., audio tape, video tape, CDs, TVs, hard drives, etc.). The proceeds from
    this tax are used to compensate producers of content. For example, the Audio Home
    Recording Act of 1992 imposes a media tax of 3 percent of the tax rate. (http://www.brouhaha.com/~erik/bad_lads/dat_tax.html)


    Ransom:

    Allow potential readers to bid for content. If the sum of the bids is sufficiently
    high, the information content is provided. Various mechanisms for provision of
    public goods could be used, such as the celebrated Vickrey-Clarke-Grows mechanism.
    This could be used in the conjunction with the subscription model. For example,
    Stephen King offered installments of his book Plant on his web site. At one point
    he indicated he would continue installing if the number of payments received by
    him exceeded 75.6 percent. His experiment did not succeed, perhaps due to the
    poorly chosen incentive scheme. [http://www.writingyourpalm.net/column0010023.]


    Pure public provision:

    Artists and other creators of intellectual property are paid by the state, financed
    out of general revenues. This is not different from public universities where
    research and publication is considered integral to the job.


    Prizes, awards, and commissions:

    Wealthy individuals, businesses or countries could commission works. The patronage
    system achieved some notable results in Europe for several centuries. The National
    Science Foundation or the National Endowment for the Humanities are examples of
    modern day state agencies that fund creative works using prize-like systems.


