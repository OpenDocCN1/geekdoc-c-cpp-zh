    # ## 9.5 Conclusion


    The value a specific unit of digital content can either increase or decrease as
    many people access it; and the direction of change of value is a function of the
    popularity of the content, consumer tastes, consumer wealth, consumer utility/disutility
    created, distribution channels, magnitude of communication among groups that have
    not have access to the digital content, consumers'' disposable incomes, consumer
    affinity for specific types of content, etc. Furthermore, there is a distinction
    between (1) the economic value of digital content and (2) the loss of economic
    value to the digital content owner. Content owners lose economic value when one
    unit of content is copied and accessed by people who have not paid for it. This
    is very different from the economic value of content that depends on individual
    and group utilities/wealth/tastes/preferences and can increase or decrease as
    the audience increases.'
