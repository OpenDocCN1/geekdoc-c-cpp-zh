    # Observation 12.6


    The entry of each ISP into the coalition is non-sequential, and the nature of
    such sequence affects the payoff of coalition members and renders Stackelberg
    analysis inapplicable.


    In reality, the formation of peering agreements is typically random. ISPs typically
    negotiate interconnection agreements only in pairs and at specific points in time.
    There may be negotiations between two or more pairs at the same time, or in any
    number of sequences, depending on the unique circumstances of each pair of ISPs.
    ISPs are not usually required to enter into interconnection agreements and can
    terminate such peering agreements. Furthermore, in certain instances, the sequence
    of entry into the coalition may not affect the payoff of coalition members, because
    (1) the packets are a commodity good and are easily produced, (2) in most markets
    are relatively few ISPs, (3) some ISPs can combine wireless networks and land-based
    networks, and (4) the opportunities created by a new member may be equal or less
    than the opportunity created by an existing member may be easily and quickly replicated
    by the expansion of its member''s network (such that the coalition''s revenues
    and profits are same or better).


    # 12.5 Stackelberg Analysis Cannot Be Used for Allocating Electricity Transmission
    Costs, Allocating Costs in Networks, or Allocating Network Revenues


    For the same and similar reasons stated herein, and contrary to Lima et al. (2008),
    Jia and Yokoyama (2003), Haddadi et al. (2016), Somjit et al. (2016), Roughgarden
    (2012), Bhaskar et al. (2015), Fanelli et al. (2013), Liao et al. (2013), Briest
    et al. (2012), and Kattman et al. (2004), Stackelberg analysis cannot be used
    for allocating electricity transmission costs or for allocating network revenues
    and cannot be used for allocating costs in networks (see comments in Roth and
    Verrecchia, 1979).


    # 12.6 Relaxation of Assumptions Implicit in Stackelberg Analysis and the Effects
    of Regulation, Antitrust Concerns, and the Structure of Peering Agreements Stackelberg
    Analysis Meaningless


    The effects of regulation, antitrust concerns and the structure of peering agreements,
    and thus the optimal number of ISPs in any region can be substantial and can also
    render Stackelberg analysis meaningless. The elimination or relaxation of some
    of the prerequisite constraints in Stackelberg game analysis and related approaches
    will render the results meaningless.


    Thus, most of the theories introduced in Cao et al. (2002), Ma et al. (2010),
    He et al. (2007), Korillis et al. (1997), Elias et al. (2011), Yang et al. (2007),
    Nie (2012), Ferreira and Bode (2013), Bei et al. (2011), Anshelevich et al. (2011),
    Roughgarden (2012), Bhaskar et al. (2015), Fanelli et al. (2013), Briest et al.
    (2012), and Arcaute et al. (2013) are wrong.'
