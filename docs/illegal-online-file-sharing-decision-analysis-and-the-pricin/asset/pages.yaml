    in optimal outcomes in terms of maximization of social welfare.


    In many existing models of pricing of digital content in the literature, equilibrium
    is rarely defined or is rarely defined enough even it is one of the main elements
    of both conceptual and analytic solutions. Govindan and Wilson (2006) analyzed
    the conditions sufficient for equilibrium. Kohlberg and Mertens (1986) stated
    the properties of a good normal form solution concept and the three types of stability
    (KM stability, full stability, and hyperstability) that satisfy some, but not
    all, of properties. Goodman and Porter (1988) addressed competitive regulatory
    equilibrium in general. Although Virag (2011) addresses competitive nonregulatory
