  md: '# Chapter 12


    # # Stackelberg Analysis Cannot Be Used in Network Access Pricing, Network Cost
    Allocation, or Pricing of Digital Content


    Game theory principles have been used extensively in developing analytical models
    for access pricing in Internet networks, transmission pricing in electric power
    networks, and access pricing in telephone/cable networks. This chapter shows that
    (1) Stackelberg analysis is inappropriate for most situations; (2) Stackelberg
    analysis is not applicable to network analysis, partly because of the constant
    evolution of networks; (3) the existing literature on network analysis and pricing
    contains major omissions and gaps; and (4) the effects of illegal online file
    sharing on the pricing of network access has been substantially omitted in most
    literature on network analysis.


    # ## 12.1 Existing Literature


    Fanelli et al. (2015) and Bilò et al. (2010) studied cost-allocation algorithms
    and games within the context of networks. Azar et al. (2005), Bilò and Flamminini
    (2011), Bandopadhyay et al. (2014), Anshelevich and Caskurlu (2011), and Canavoi
    et al. (2014) studied equilibria within networks. Bilò et al. (2015) and Kaporis
    and Spirakis (2009) analyzed Stackelberg games. However, the theories introduced
    in this chapter contradict many of the theories in the fore-going articles.


    +   * Troquard et al. (2011), Åtnes et al. (2009), and Wolter and Wooldridge (2011)
    studied logic and the aggregation of preferences and judgment in games.'
