  md: '# Shapley Value Cannot Be Used in Network Access Pricing 193


    economic mechanisms that are often defined by rules, norms, time, medium, and
    location. The literature on MDT has some major gaps and inaccuracies, some of
    which are explained as follows and in Myerson (1983, 2008), Friedman and Oren
    (1994), and Larson and Sandholm (July 2005).


    MDT does not account for differences in agents'' information-processing capabilities.
    MDT erroneously assumes that each mechanism is monolithic and static in time,
    space, and expense—in reality and on the contrary, some mechanisms are dispersed
    in space (various locations), time (requires participation, revisions of knowledge,
    and various disclosures over times), and expenses (the costs of participation
    in the mechanism vary across time and participants).


    Bergemann and Morris (2005) noted the following about MDT:


    +   1. A common criticism of MDT is that the optimal mechanisms solving the well-defined
    problem seem unnecessarily complicated. As result, researchers have often focused
    on mechanisms that are more robust or less sensitive to the assumed structure
    of the environment.

    2. Mechanism design involves too many implicit common-knowledge assumptions in
    the description of the planner''s problem. The more efficient designing strategy
    is to first make the implicit common-knowledge assumptions and weaken them.

    3. In mechanism design, the smallest type space, where the possible types of each
    agent are assumed to be equal to the set of payoff types and assumed to have common
    prior to this type space. The largest type space that planners/researchers can
    work on is the union of all possible type spaces that have arisen from the payoff
    environment. A universal type space, in the sense of Mertens and Zamir (1995).
    There are many interesting types between the payoff type space and the universal
    type space.

    4. MDT does not consider instances when post implementation is equivalent to interim
    (or Bayesian) implementation for all possible type spaces. The equivalence holds
    in the case of separable environments; examples of separable environments arise
    (1) when the planner is implementing a social choice function (not correspondence)
    and (2) in a quasilinear environment with restrictions on transfers. The equivalence
    fails in general, including in quasilinear environments with budget balance. In
    private value environments, post implementation is equivalent to dominant strategies
    implementation.

    5. Hurwitz (1972, 1973) discussed the need for nonparametric mechanisms (independent
    of parameters of the model).

    6. If a social choice recommendation (SCC) is post implementation, then it is
    interim implementable on every type space, since the payoff type direct mechanism
    can be used to implement the SCC—but the converse is not always true. The gap
    arises because the planner may have the equilibrium agents'' higher-order belief
    types, as well as their realized payoff type. The planner has no intrinsic interest
    in conditioning on nonpay relevant aspects of agents'' types, but he or she is
    able to slack in incentive constraints by doing so.


    Glachant (1998) noted the following about MDT:


    +   1. The normative power of mechanism design is significantly weakened by an
    implicit assumption of zero communication costs.

    2. MDT assumes that administrative costs of public intervention are nil.'
