    # 12.1.1 Most of the Weaknesses of the Shapley Value Function Also Apply to Stackelberg
    Game Analysis


    The critiques and weaknesses of Shapley value function, also apply to Stackelberg
    games, and the inaccuracies and problems summarized (endnotes) Tick et al. (1999),
    Fatima et al. (2008), Roth (1977), Sastre and Tnanoy (2001), Kirman et al. (2007),
    Lima et al. (2008), Roth and Verrecchia (1979), Bakos and Nault (1997), and Biczok
    et al. (2008) also apply to Stackelberg games.


    # 12.1.2 Stackelberg Games and Related Approaches


    Some have unsuccessfully attempted to use Stackelberg bargaining analysis for
    network pricing, and these authors include Korillis et al. (1997) and Shakkot
    and Srikant (2006). For more details on the Conceptual Model for Decomposing Value
    for the Customer, Nicola et al. (2012). For alternative methods for network pricing
    and cost allocations, see Su (2011), Xu (2011), and Fu et al. (2007).


    Borkoley and Sarangi (2011) criticized the Myerson value, the position value (for
    communication games only), and Jackson''s flexible network values and stated that
    these rules do not take into simultaneous multilateral interactions and do not
    consider the cost of simultaneous interaction in a network. Baslam et al. (2012)
    noted that in telecommunications markets, the interactions between market participants
    that have different powers and different valuations of time cannot be analyzed
    by simple games.


    The main difference among the models studied in the literature on network access
    prices (such as Basar et al., 2002; Roth et al., 2005; Briest et al., 2012) is
    the set of assumptions considered. However, the underlying assumptions for all
    forms of Stackelberg games are unrealistic.


    Fanelli et al. (2015) Bilö et al. (2010) studied cost-allocation algorithms and
    games within networks. Azar et al. (2005), Bilö and Flammini (2011), Bandyparadhay
    et al. (2014), Anshelevich and Caskurl (2011), and Cananoi et al. (2014) studied
    equilibria within networks. Bilö et al. (2015), Briest et al. (2012), and Kaporis
    and Spirakis (2009) analyzed Stackelberg games. However, the theories introduced
    in this Chapter contradict many of the theories in the foregoing articles.


    # 12.2 Interconnection Fees Can Be Irrelevant in Network Design


    As mentioned in the preceding chapter on Shapley value analysis, interconnection
    fees (peering fees and transit fees) can be relevant in network design.


    # 12.3 Properties of an Allocation Mechanism That Are Described in Ma et al. (2010)
    Are Not Valid


    As explained in the preceding chapter, the four properties of the allocation mechanism
    (symmetry, dummy, strong monotonicity, and additivity) are described in Ma et
    al. (2010) are not valid.'
