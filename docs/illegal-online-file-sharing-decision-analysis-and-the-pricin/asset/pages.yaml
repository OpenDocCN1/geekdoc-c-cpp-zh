    # 2.3.6 Hypothesis-5: Moneyl-Trading Bias


    The allure of moneyless in the United States and in many developed countries has
    increased during the last 5 years for several reasons: (1) the collapse of the
    emerging-growth-company sector (NASDAQ) stock market in 2000–2002, (2) the shift
    of assets from traditional bank accounts to securities accounts, (3) the broadening
    of the distribution of ages who participate in stock markets, (4) the rapid increase
    in the popularity and volume of investments in securities, and (5) the rapid increase
    in the global popularity and availability of online games. These factors have
    created a trading mentality that is affecting daily life in most developed countries
    (and in some developing countries).


    This trading mentality and costly-trading bias are evident in (1) increases in
    the volume of activity (trading, webpage listings, ads, in baseball courts, collectibles,
    and auction-website activities); (2) the percentage of retailing websites that
    offer products and product promotions; (3) the percentage of time spent on securities
    market transactions, and price comparison websites versus IOF networks; and (4)
    the percentage of time spent on online auctions, and price comparison websites
    versus IOF networks.


    Illegal file sharing represents a form of moneyless trading that is substantially
    less risky than securities markets. Hence, people are more likely to prefer online
    purchase to physical purchase.'
