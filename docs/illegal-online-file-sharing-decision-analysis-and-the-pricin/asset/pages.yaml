    # 9.4 Enterprise Value of Digital Content


    # 9.4.1 The Enterprise Value of Digital Content Is Dynamic


    Enterprise value of digital content refers to the value of one unit of digital
    content (e.g., a movie CD, or a music file, or a vinyl record, or a digital book).
    A unit of such content is the individual unit that is sold to each consumer. Contrary
    to the existing literature on digital content, the enterprise value of digital
    content is not fixed and does not decline as many people/access the mentioned
    digital content (Klein et al. 2002, Krishna et al. 2003). The reasons are as follows.


    Each person who has access to a specific unit of digital content derives some
    positive or negative utility, which has monetary value that can change exponentially
    and is this dynamic value is a function of consumer tastes, economic/social power,
    wealth, affinity for certain subjects, type of digital content, disposable income,
    etc. Similarly, each person who knows about but does not have access to a unit
    of digital content is conjectured to derive some positive or negative utility
    from such knowledge and relative scarcity, which has monetary value that can change
    exponentially.


    The perceived value of downloaded digital content is affected by the magnitude
    of network congestion, which is dynamic, and the size of the available P2P networks
    and ability to locate the digital content within such illegal networks. Hence,
    even as the number of legal downloads increases, if the digital content is not
    available on illegal P2P networks, the digital content''s perceived value may
    increase.


    # 9.4.2 The Enterprise Value of One Unit of Digital Content


    In most existing distribution contexts, digital content is substantially misunderstood,
    because a consumer pays a price P for almost perpetual access to content, regardless
    of how many times he or she accesses the content and to price the digital content
