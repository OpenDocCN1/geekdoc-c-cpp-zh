    # 7.3.1 A New Definition of the Sampling Effect


    As described in the literature, the sampling effect is not accurate and refers
    only to the increase in sales revenues and sales volume that is attributable to
    sampling. A more complete definition of the sampling effect consists of the following:


    +   1. The loss in sales revenues (not sales volume, because sampling is often
    combined with discounts, promotions, and free giveaways) that is solely attributable
    to allowing consumers to sample digital content. Sampling loss occurs when curiosity
    is satisfied by sampling, and the consumer does not purchase digital content,
    he/she would have otherwise purchased.


    +   2. The gain in sales revenues (not sales volume, because sampling is often
    combined with discounts, promotions, and free giveaways) that is solely attributable
    to allowing consumers to sample digital content. Sampling gain occurs when consumer
    curiosity is increased by sampling of digital content, and the consumer purchases
    the unit of digital content because of the sampling.


    +   3. The lack of change in sales revenues (not sales volume, because sampling
    is often combined with discounts, promotions, and free giveaways) that is solely
    attributable to allowing consumers to sample digital content. A sampling-neutral
    consumer is not affected (indifferent) after sampling digital content.


