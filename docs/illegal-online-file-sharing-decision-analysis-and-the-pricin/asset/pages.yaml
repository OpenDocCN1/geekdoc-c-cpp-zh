  md: '# The Free Rider Problem, Inequality in Networks


    # 6.3.2 Solutions for Flat-Fee Subscription Pricing in P2P Networks


    In legal P2P networks that use flat-fee subscription pricing, the sponsor/distributor
    can completely eliminate or remove free riding by the following pricing methods,
    implemented in the context of the aforementioned conjecture that free riding can
    be beneficial in some circumstances.


    +   1. Access prices in order to reduce the negative effects of free riders (i.e.,
    the distributor/sponsor can charge or suspected free riders more for monthly/weekly
    subscriptions).


    +   2. In addition to the periodic subscription fee, charge members an additional
    fee on a pay-download baseline wherein the prices will reflect free riding activities
    (i.e., free riders will pay higher prices for each download above a periodic maximum,
    and such incremental fees will be in the form of bandwidth premiums).


    +   3. Identify and exclude members/nodes who are known free riders.


    +   4. Limit the number of downloads per node/member per subscription period.


    +   5. Pay cash/or notch incentives to members who upload more than average volumes
    of digital content and whose content get downloaded than the average.


    +   6. Increase the periodic subscription fees in towns/cities where free riding
    activity is high.


    +   7. Designate the free rider node as a source node so that a greater-than-average
    number of files will be downloaded or sent from the free rider''s node, which
    will cost the node bandwidth.


    +   8. Implement a prioritization scheme when the free rider exceeds a threshold
    of downloads per period, known free rider download requests are treated as second-priority
    or third-priority traffic and are deferred to low-traffic and are fulfilled in
    whole or part by only nodes that have excess bandwidth capacity and/or low valuation
    for bandwidth.


    +   9. Implement a prioritization scheme where non-free rider nodes are given
    incentives (e.g., reduced prices, bonuses, free content) to defer their downloads
    to low-traffic periods, and such requests will be fulfilled first by free rider
    nodes and then by nodes that have comparatively low valuation for bandwidth (i.e.,
    high bandwidth capacity). Note that various authors have developed reputation-based
    systems.


    # 6.4 Conclusion


    The free rider problem and inequality in networks are central elements of the
    content distributor''s challenge of minimizing illegal file sharing and maximizing
    both profits and equity. Thus, customer experience in legal P2P networks and firm
    profitability can be vastly improved by eliminating free riders, fostering valuable
    free riders, or providing incentives for free riders to help improve the efficiency
    of networks. TFT mechanisms and Lorenz Dominance are grossly inefficient. The
    principles derived in this chapter are also applicable to other types of networks
    such as social networks and electricity distribution networks.'
