  md: '# Complexity and Optimal Sanctions for Illegal Online File Sharing


    # 4.7 Conclusion


    Illegal file sharing (IOF) and online content control remain major problems with
    economic, technological, and policy ramifications. These problems can be solved
    by (1) incorporating economic psychology factors in the design of online systems
    and legal processes, (2) development and implementation of appropriate sanctions
    for the various involved in IOF, (3) development of appropriate business models
    that minimize economic losses. In IOF, the perpetrators'' perceptions of risk
    vary with various factors such as knowledge, cognition, peer pressure, and the
    enforcement/prosecution activities of content producers and distributors. Unfortunately,
    most existing user interfaces and the file sharing software systems are not designed
    to affect the risk perceptions of users by normalizing illegal file sharing, significantly
    simplifying and enhancing the illegal file sharing process, substantially reducing
    the economic and psychological costs that may have served as deterrent to illegal
    file sharing, and reducing the perceived threat of apprehension. It is now clear
    that for copyright statutes to function effectively, the perceived risks inherent
    in illegal file sharing must be exponentially increased. ISPs can help in achieving
    this objective.


    +   1 See and McClung (2012); Podoshin (2008); Golle et al. (2001); Clark and
    Tsiaparas (2002); Cho et al. (2015); Cox and Collins (2014); Aalton and Salmi
    (2013).

