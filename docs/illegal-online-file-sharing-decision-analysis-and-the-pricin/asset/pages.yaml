    context of incentives—the issue of incentives is almost completely omitted. To
    be meaningful and effective, copyright protection must provide adequate psychological
    incentives (comfort, reassurance, trust in the legal system, recognition, etc.),
    financial incentives (money/value for products, safety, recognition, etc.), and
    monetary/wealth incentives (money, wealth, social capital, reputational capital,
