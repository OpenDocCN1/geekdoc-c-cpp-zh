    # 11.2 Mechanism Design Theory Is Inaccurate


    Shapley value and Stackelberg bargaining as applied to interconnection pricing
    are essentially mechanism design theory (MDT). As explained in Nwoglu (2012),
    traditional MDT is generally inaccurate and impractical. MDT is the body of theory
    pertaining to'
