    # 10.4 Pricing Models as Network-Allocation Rules


    The formulas introduced earlier for the prices of digital content represent new
    network-allocation rules (in the same sense as, but different from Shapley value),
    of the following reasons. Each of the foregoing pricing formulas has the general
    form P = Max(P–; A), where P is the cost-based price (including a profit margin)
    and A is the sum of total allocated benefits/disatures arising from membership
    of and/or participation in the network. This approach assumes that prices must
    be zero or greater, but in some situations, prices can be negative—that is, the
    distributor pays when the member searches for and downloads content where, for
    example, (1) the distributor earns revenues (e.g., online advertising and sponsorship
    revenues, when the member joins or actively searches in the network or (2) the
    member has incentives for uploading files into the system/network. The prices
    of unit digital content incorporate the benefits of the network (cost savings,
    more efficient search, etc.) and inherently reallocate benefits to the network
    members/nodes based on their location, proximity to the distributor''s servers,
    etc. Thus, in the formulas, the prices of digital content are partly based on
    network topology—the distance between each node (including the distributor''s
    servers) affects delivery costs, and bandwidth costs can be passed on to members.
    Some of network storage costs and some processing costs are shifted to nodes,
    and this reduces the distributor''s average and marginal costs of providing content.
    Enforcement and prosecution costs can be almost zero because the network is legal.
    Each member''s search costs can be reduced due to ready access to content. The
    distributor''s allocation of network access to each member often reduces the overall
    average and marginal costs for all members. The distributor essentially allocates
    network access and prices in order to increase or maintain stability in the system.
    Stability can be defined in the following ways: (1) members have low incentive
    to deviate (e.g. leave the network); (2) members have low incentive to knowingly
    collide even when there is no anonymity); and (3) the upload/download ratio for
    each network member is similar and valuable free riders are allowed to participate
    in the network and for bandwidth usage and uplods function.

