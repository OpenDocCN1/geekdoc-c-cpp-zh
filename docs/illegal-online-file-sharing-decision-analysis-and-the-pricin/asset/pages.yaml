    The consumer MCICS is the consumer''s marginal cost of searching for a unit of
    digital content. It consists of mostly the consumer''s leisure time (which can
    have a lower value than the consumer''s work time) and the associated opportunity
    costs (price of bandwidth is typically fixed and minimal).


    # 7.4.7 The Consumer''s Marginal Cost of Physical Consumer Search (MCPCS)


    The consumer MCPCS is the consumer''s marginal cost of searching for a unit of
    physical content in the physical domain. It consists of the consumer''s leisure
    time (which can have a lower value than the consumer''s work time) and the associated
    opportunity costs, transportation costs, hardware costs, and software costs (price
    of bandwidth is typically fixed and minimal).


    # 7.4.8 The Consumer''s Marginal Costs of Time Substitution (MCTS)


    The consumer MCTS refers to the value (in monetary amounts) of the time that the
    consumer spends to search and download one unit of digital content within the
    IOF networks. Many consumers who participate in IOF networks do not have adequate
    funds for purchases or not want to pay for digital content, but have significant
    leisure time. At the present time, the average costs (per unit of digital content)
    of computer hardware and bandwidth are relatively low and declining; IOF network
    members are essentially trading in currency that consists of mostly leisure time.
    MCTS affects the rights holder''s average costs and marginal costs of production
    and distribution because (1) MCTS is a major determinant of the consumer''s perceived
    value of content and propensity to purchase digital content, (2) MCTS affects
    right holder''s/distributor''s costs—encryption/DRM, systems development costs,
    etc., (3) MCTS affects content owner''s distribution channel decisions, and (4)
