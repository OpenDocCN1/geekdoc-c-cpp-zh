    # 13.1.2 A Critique of Jammeh et al. (2009): The Myth of Intelligent Congestion
    Control Using Fuzzy Congestion Controllers


    Some researchers have developed and supposedly tested various algorithms for the
    control of congestion in Internet networks—see Jammeh et al. (2009), Rezat et
    al. (2008), and Barrett and Woodall (1997). If feasible and accurate, congestion
    controllers have the potential to drastically change the parameters of network-access
    pricing because network congestion has a significant effect on network efficiency,
    bandwidth costs, and maintenance costs.


    The most popular congestion controllers are the Type 1 and Type 2 fuzzy logic
    controllers (FLCCs), which are described in Jammeh et al. (2009) and in Mendel
    (2007). FLCCs are based on fuzzy logic. However, Barrett and Woodall (1997), Wolkenhauer
    and Edmunds (1997), and Brock et al. (1999) explained the weaknesses and computational
    problems inherent in fuzzy logic. Such Type 2 FLCCs are not feasible or accurate
    because of the following reasons:


    +   1. There may be unforeseen traffic scenarios for the FLCC fuzzy logic was
    not designed. The assumption that the FLCC''s fuzzy logic covers all possible
    known and unknown traffic scenarios/patterns is false. Furthermore, most FLCCs
    are not designed as learning algorithms.


    +   2. The FLCC is only valid within the ISP''s networks, but since there are
    peering agreements, even if the FLCC works, its effectiveness is limited.


    +   3. The IT2 fuzzy supposedly extends the footprint of uncertainty (FOU) of
    the membership function, but there is an underlying and erroneous assumption that
    the variation/variance is constant with the FOU.


    +   4. Since a network path''s available bandwidth is volatile and difficult to
    predict, algorithm-based controllers (and FLCCs) are unsuitable and inaccurate.'
