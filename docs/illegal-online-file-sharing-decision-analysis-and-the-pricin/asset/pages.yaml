    # 2.4.12 Hypothesis-11: The Liability Allocation Problem


    The liability allocation effect is a state wherein the courts and prosecutors
    have substantial difficulty in allocating liability to perpetrators for any of
    the following reasons:


    +   1. The complexity of the misconduct makes it difficult to allocate liability
    accurately.

    2. The technological elements of processes or equipment used in the misconduct
    make it difficult to allocate liability accurately.

    3. The applicable statutes are dormant and/or lag trends of misconduct, and thus,
    that statutes are ineffective—that is, a state where statutes do not keep up with
    advances in P2P and other file sharing technologies, and/or the existing legislative
    processes are too cumbersome to react to both technological changes, and changes
    in human–computer interactions and data storage. When these conditions exist,
    then statutes become dormant and cannot be effective against misconduct such as
    IOF.

    4. The estimated costs of investigation and/or prosecution are substantial or
    are not justified by the expected deterrence effects of prosecution.

    5. The allocation of liability can have collateral damage effects and may have
    adverse effects on overall social welfare.


    Hence, the growth and increasing popularity of IOF can be attributed to the *liability
    allocation effect*.


    # 2.5 Illegal Online File Sharing as Production Systems


    Illegal online file sharing affects the economics, profitability, and business
    models of companies in many industries such as entertainment, education, travel,
    investments/finance, and any business where knowledge has value. Legal or illegal
    file sharing is essentially a production system that uses hardware, software,
    bandwidth, information (digital content), participant’s time, software developers’
    time, and human capital as its inputs. Production in this instance consists of
    production of information, making digital content available to others, and successful
    online searches of content. In the United States, the Napster case illustrate
    some of the policy, technological, and economic issues inherent in systems for
    downloading content.


