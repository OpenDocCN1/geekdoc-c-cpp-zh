    # 8.3 Cumulative Prospect Theory (CPT), Prospect Theory (PT), Third-Generation
    Prospect Theory (PT³), and Networks


    Baucls and Heukamp (2006) analyzed SD and CPT. Several others have tried to apply
    PT and CPT to network analysis—such as Li et al. (2012, 2015), Jou and Chen (2013),
    Wu and Yang (2013), Xia et al. (2012), Zhang and He (2014), and Li Mandanday (2014)
    and other articles.


    Nwogugu (2005a,b,c, 2006a) explained why PT/CPT (and implicitly, third-generation
    prospect theory [PT³]) are wrong. Nwogugu (2006b) introduced new models of regret
    and also introduced willingness to accept losses. Furthermore, the existence of
    P2P networks is one of the largest empirical evidence that CPT, PT, and PT³ are
    wrong and not applicable to any network. This is because the functions/preferences
    implied by CPT/PT/PT³ are not the same as the functions/preferences of P2P nodes/users
    and P2P networks in general as illustrated in the existing literature (i.e., as
    illustrated in the network games described in mathematics, economics, operations
    research, and computer science literatures). Furthermore, CPT/PT/PT³ preferences
    and functions cannot exist in most P2P networks and many social networks. See
    comments in Nwogugu (2005a,b,c, 2006a). Some of the CPT/PT/PT³ preferences include
    reference dependence, the reflection effect, certainty effect, the endowment effect,
    and the isolation effect.


    # 8.4 Conclusion


    Loren dominance and F/SSD/TSD/HSD models are problematic. Nwogugu (2013) illustrated
    weaknesses inherent in the mean-variance framework—many of which can be extended
    to other statistical distributions. Many of the weaknesses in F/SSD/TSD/HSD models
    can be reduced by incorporating measures of human behavior, irrationality, availability
    of resources, substitutability, time, intertemporal choice, and other factors.
    CPT/PT/PT are not generally applicable (or are applicable only in a minute set
    of circumstances) in the analysis of social networks and P2P Internet networks.


