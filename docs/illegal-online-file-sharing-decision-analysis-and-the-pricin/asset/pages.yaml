    # 4.4.1 Critique of Arai (2011)


    Arai (2011) attempted to analyze the choice between criminal and civil prosecution
    for IOF. As explained herein and earlier, most of the analysis and models in Arai
    (2011) are wrong (see Nwwogu (2013), which addressed similar issues). The obvious
    weaknesses and errors in the Arai (2011) analysis are as follows:


    +   1. The major assumption in Arai (2011) that criminal and civil cases are distinguished
    by whether or not the perpetrator pays (sanctions/fines) to copy holders (or to
    the government) is wrong. First, when an IOF perpetrator is sentenced to a long
    prison term (e.g., 5-10 years), the content owner indirectly gain an important
    economic transfer in the form of reduced loss of revenues from lower volumes of
    copyright infringement activity. Second, when an IOF perpetrator finds a large
    amount of money that is a substantial percentage of his/her wealth, the content
    owner can indirectly gain an important economic transfer in the form of reduced
    loss of revenues from the perpetrator’s ability to infringe copyrights. Third,
    to the extent that all or a portion of fines (imposed on perpetrators by a court)
    are used by the government for monitoring and enforcement of copyright laws, the
    content owner gains important economic transfer in the form of increased government
    monitoring/enforcement and the reduction of its own monitoring/enforcement requirements.
    Fourth, in some jurisdictions, in criminal prosecutions for IOF, the perpetrator
    can be ordered to pay statutory and common law restitutions and punitive damages
    to the content owners.

    2. For an individual copyright infringement, the content owner and the government
    can choose to simultaneously execute both civil and criminal prosecution. In criminal
    prosecution initiated by the government in most jurisdictions, the content owner
    is usually a major witness and participant. The content owner can also initiate
    criminal prosecution by filing a criminal complaint at the government prosecutor’s
    offices or in court. Thus, the Arai (2011) social welfare analysis that is erroneously
    based on distinctions between criminal and civil prosecution is entirely wrong.

    3. The optimality of criminal sanctions versus sanctions based on a narrow set
    of parameters as in Arai (2011) and depends on the circumstances of each case.
    What is clear that the current criminal penalty statutes in the United States
    do not provide deterrence effect to reduce IOF and often bear no relationship
    to the perpetrators’ total monetary/nonmonetary wealth and illegal profits.

    4. Arai (2011) makes a wrong assumption that the consumer’s valuation of the digital
    goods are uniformly distributed across an interval. Furthermore, as explained
    in Chapter 2, in many instances, IOF is often not motivated by the consumer’s
    valuation of the digital content but rather by other factors such as psychological
    states, nonmonetary impulses, and external influences.

    5. Contrary to Arai (2011), if a consumer does not use any product, his/her utility
    is not necessarily zero and may be positive or negative depending on his/her utility/disutility
    gained'
