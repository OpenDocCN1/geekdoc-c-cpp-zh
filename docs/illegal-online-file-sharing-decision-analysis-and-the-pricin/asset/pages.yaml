    # 2.3.7 Hypothesis-6: The Time–Price–Value Sensitivity Effect


    Some participate in IO networks in order to greatly reduce search costs, reduce
    associated psychological distress/effects, and reduce the perceived value of wasted
    time. Time is typically the main component of the perpetrator’s search costs.
    People are typically willing to commit more time for reward, high-risk benefits,
    but not spend money to achieve similar benefits. Other search costs include travel
    time and expenses, stress, time spent at locations, and time/money spent sampling
    in physical space. In this context, actualization time is defined as the time
    it takes obtain/purchase a desired good/service. The Internet has greatly reduced
    actualization time, particularly for information goods, and by doing so, has created
    a demand for other Illegal file sharing simply fulfills the need for shorter actualization
    times and instant gratification—perpetrators can find files and do not have to
    go through the inconvenience of online registration, payment, or searching. One
    major result is that perpetrators are more likely to have price sensitivity and
    increased travel sensitivity due to lower search costs, which is caused by habit
    (by achieving low costs for obtaining digital) and expectations. Note that the
    time, travel sensitivity, and price sensitivity are linked in time and occur simultaneously.
    Increased price–distance sensitivity, in turn, causes a higher propensity to participate
