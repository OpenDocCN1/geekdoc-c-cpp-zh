    in Social Networks


    For the same and similar reasons stated in this chapter, and contrary to Narayanam
    and Narahari (2011), Chen and Teng (2016), Flores et al. (2016), and Suri and
    Narahari (2010), the Shapley value function and similar approaches (such as the
    Owen value) cannot be used for discovering influential nodes in social networks.


    # 11.8 Conclusion


    The Shapley value and related theories are clearly not applicable to Internet
    network pricing analysis, cost allocation in networks, or analysis of electricity
    distribution networks. The elimination or relaxation of some of the assumptions
    and prerequisite constraints in Shapley value analysis will render the results
    meaningless. Antitrust laws also preclude applicability of Shapley value solutions
    in some circumstances. Thus, most of the theories introduced in Cao et al. (2002),
    Ma et al. (2010), Zhou et al. (2016), Kim (2016), and Perez-Castrillo and Wettstein
    (2001) are wrong.'
