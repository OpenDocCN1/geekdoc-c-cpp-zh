  md: '# Chapter 5


    # Economics of Digital Content: New Digital Content-Control and Anti-P2P Systems/*


    This chapter introduces new content-control and anti-P2P-file sharing systems
    that are designed to reduce/eliminate illegal file sharing and improve control
    of digital content. Golle et al. (2001) studied-incentives for sharing in peer-to-peer
    (P2P) systems. The earlier chapters in this book provide an analysis of some economic,
    legal, and psychological issues inherent in digital rights management (DRM) systems
    for digital content.


    # 5.1 Constraints


    In analyzing illegal downloads of content, there are several constraints on the
    efficiency of systems:


    +   * Cost and availability of bandwidth

    * ISPs’ willingness to cooperate in enforcement activities

    * Costs of security

    * Network congestion costs

    * Pricing difficulties (determining the exact number of players and the number
    of times each digital content is played)


    > * An earlier version of this chapter was published as an article cited as follows:
    Nwogugu, M. (2008). Economics of digital content: New digital content-control
    and anti-P2P systems/methods. Computer and Telecommunications Law Review, 14(6),
    150–159.'
