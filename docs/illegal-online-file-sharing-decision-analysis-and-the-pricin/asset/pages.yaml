    experience and firm profitability can be vastly improved by piracy-minimizing
    and profit-maximizing pricing of digital goods. Such pricing schemes incorporate
    elements of a prioritization scheme where the priority is defined in terms of
    only customers'' opportunity costs (waiting time, search costs), but also utility
    to comply with intellectual property (IP) laws, prepurchase and postpurchase regret,
    customer'' relative wealth, and customers'' marginal propensity-to-substitute
    digital products. These pricing schemes can minimize the firm''s production/delivery
    costs and also result in lower prices for high-priority customers and uniform
    Quality of Service (QoS) for all customers, all of which are socially optimal
    outcomes when different customers place different values on digital content, time,
    and compliance with IP laws. The interactions among members of peer-to-peer (P2P)
    networks are of network games.


    This chapter (1) introduces three classes of dynamic random network matching games
    (Transferable Utility) TU repeated games in client-server networks and TU cooperative
    repeated games in P2P networks for which it is possible to calculate the payoffs
    of individual members(nodes), (2) introduces two new network-allocation mechanisms
    for sharing the benefits of P2P and client-server networks where the mechanism
    is embedded in the pricing formula that can optimize both consumer welfare and
    distributor/seller wants, (3) developing pricing models that minimize the firm''s
    piracy losses and simultaneously maximize revenue for the information producer
    under different assumptions regarding customer behavior and utility, (4) develops
    models of information-pricing and content-distribution schemes that sell differentiated
    products to customers who have heterogeneous online/offline search costs, and
    (5) develops conditions for optimal search and a stopping point in the file sharing
    network (using stochastic calculus which has been shown to depict).


    The information producer modeled herein is not a traditional profit maximizing
    entity, but rather piracy-averse, has limited control over the P2P network or
    client-server network, short-lived products, and is most interested in long-term
    profits. Customers (network members) are generally self-interested, loss-avers,
    and price-sensitive persons who derive mostly nonresident utility from consumption
    of digital content. The P2P and client-server networks discussed herein are anonymous
    legal networks, and the effects of actual or potential coordination and/or altruism
    among customers are somewhat limited. Within this framework, the marginal cost
    and marginal price of a unit of digital product become relevant, contrary to the
    analysis in the literature.


