  md: '# Chapter 7


    # # Pricing Digital Content: The Marginal Cost and Open-Access Controversies*


    The marginal cost and open-access controversies have had substantial effects on
    the debate about the pricing of digital content. Unfortunately, all existing studies
    of pricing of digital content have not explored the full ramifications of marginal
    costs and open access. Contrary to some open-access theories in the literature,
    copyright law is necessary—incentives, for trade (transfer, pledging, sale, documentation)
    in intellectual property (IP) rights, and to preserve social order (to reduce
    crime, breaches of contracts, and torts). This chapter introduces new elements
    of marginal cost analysis in the pricing of digital content, illustrates how the
    present mispricing of digital content contributes to illegal online file sharing
    (IOF), and illustrates how the various elements of marginal cost can be used to
    allocate resources for enforcement of IP rights.


    # ## 7.1 Existing Literature


    The literature on neutrality and the marginal costs of digital content is significant
    and buoyed during 2002–2010 and includes the following: Bhargava and Choudhary
    (2008), Jin and Kato (2007), and other articles. Krämer et al. (2013), Bauer and
    Obar (2014), and Cerf et al. (2014) discussed neutrality. The omissions in the
    existing literature include the following:


    +   1. An accurate analysis of the economics and cost structure of digital content.

    2. Accurate valuation of digital content within the context of marginal costs
    and the existing legal framework for IP rights.


    > * An earlier version of this chapter was published by the author as an article
    cited: Nwogugu, M. (2008), "Pricing digital content: The marginal cost and open
    access controversies," Computer & Telecommunications Law Review (2008); Issue
    #6).'
