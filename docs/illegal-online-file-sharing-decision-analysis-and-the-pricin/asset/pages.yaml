    # 4.1.4 Enforcement Games


    Leshem and Tabbach (2012) studied the role of commitment when enforcement can
    remedy harm noncompliance. In their game, an enforcement authority (enforcer)
    and an offender may act as a Stackelberg leader, and the enforcer must choose
    whether to commit to an enforcement strategy or let the offender make the first
    move (thereby calibrating the level of enforcement to the actual level of noncompliance).
    Leshem and Tabbach (2012) concluded that the trust of the enforcer depends on
    each player''s responsiveness to a change in the other player''s strategy choice
    and that commitment to an enforcement strategy is not always a good strategy for
    the enforcer. Helbing and Johansson (2010a,b), Helbing et al. (2010a,b), Perc
    et al. (2013), and Yeung et al. (2010) also studied enforcement games.


    Ohtubo (2010) examined whether violations of honesty norms would induce third-party
    punishments in two experiments, where participants in the third-party role ordered
    a protocol of the trust, in which the trustee trusted the trustor to transfer
    his/her endowment by stating that the trustee returns units from the total resource.
    In both experiments, participants were willing to incur some cost to punish honesty-norm
    violators, yet the participants themselves were not an evolforcer by the norm
    violation. They concluded that third-party punishment for norm violators can be
    an evolvable enforce of social norms.


    Although the clear announcement of auditing claim reports is a powerful deterrent,
    Lang and Wambach (2013) attempted to show uncertainty about fraud detection can
    be an effective strategy to detect ambiguity-avers agents from reporting false
    insurance claims. They found that, in addition, insurers'' auditing costs are
    heterogeneous, it might be not optimal to trust auditing. Thus, strategic ambiguity
    can be as an equilibrium outcome in the market, and competition does not force
    players to provide the relevant information. They noted that their findings are
    applicable to other audit protocols and situations such as tax enforcement.


    Mogy and Pruitt (1974) conducted a gaming experiment (prisoner''s dilemma) game
    with 50 undergraduates to determine the effects of a confederate''s threats and
    subjects'' perception of the credibility of these threats on subjects. Perception
    and credibility were measured by questionnaires after each trial. In the experiment,
    it was hypothesized that (a) credibility (the probability of compliance) is inversely
    related to the threatener''s cost of enforcement; (b) threats where enforcement
    would hurt the recipient more than the threatener are more credible (hurt-more
    threats); (c) a threatener who enforces his threats are more hostile (d) a threatener
    who enforces non-hurt threats is more hostile than the one who enforces hurt-more
    threats. Mogy and Pruitt (1974) stated that their results supported hypotheses
    (a) and (c) and partially support and (d).


    Miller and Watson (2013) proposed a new approach to equilibrium selection in repeated
    games with transfers, under the assumption that in each period, the players bargain
    over how to play. Miller and Watson (2013) predicted delections from three axioms
    wherein two allow the players to meaningfully discuss whether to develop their
    plan and the third includes a disagreement—that play under disagreement should
    not vary with the manner in which bargaining broke down. Miller and Watson concluded
    that these axioms exist for all discount factors and all equilibria generate the
    same welfare; and optimal play under agreement generally requires suboptimal play
    under disagreement. They also found that players attain efficiency on both the
    stage game and the bargaining protocol and that their theory is applicable to
    games with imperfect public monitoring and heterogeneous discount factors.'
