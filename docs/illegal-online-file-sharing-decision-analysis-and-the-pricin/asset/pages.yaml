    $\rho_d$ is the probability that the member will be detected in an illegal P2P\
    \ network and fined.\nC$_s$ is the applicable price for participating in IOF.\n\
    $R_1$, is the average ratio of first purchases (distributor to member) to second\
    \ purchases (member to member) in the P2P system (If one unit of digital content\
