  md: '# Stackelberg Analysis Cannot Be Used in Network Analysis ■ 211


    # 12.4 Stackelberg Game Analysis and Related Theories Are Inaccurate and Cannot
    Be Used in the Analysis of Access Pricing or for the Allocation of Revenues/Costs
    in Networks (i.e., Internet Networks, Power/Electricity Networks)


    Many of the conditions mentioned earlier for the feasibility and validity of Shapley
    value analysis (explained in the previous chapter) also apply to Stackelberg analysis,
    and since none of those conditions are feasible, Stackelberg analysis is inaccurate
    and cannot be used in network-access pricing or for the allocation of revenues/costs.


    In reality, although the physical connections of ISP''s networks may remain fixed
    in time and space, the actual transmission pathways, and hence the network is
    not constant, and changes instantaneously, depending on the locations of the sender-receiver
    pairs. In almost all instances in a network, each packet has more than one feasible
    path. Furthermore, in land-based networks, the cable used in transporting packets
    typically has more than one set of wires so for each distance d in any cable,
    there is more than one feasible transmission pathway. Similarly, in any network,
    for two points in d, there are many possible transmission paths. Stackelberg analysis
    erroneously assumes that the physical structure of the Internet is constant.


    # Theorem 12.1


    For any transmission, if the originating-ISP knows the cost structure and payoff
    of every other ISP that is required to transport any given packet, optimal allocation
    of costs or revenues among cooperating ISPs is never feasible.


    Proof: The Stackelberg analysis erroneously assumes that each ISP knows the cost
    structure and payoff patterns of every other ISP that is member of the coalition.
    In reality, statutes prevent public disclosure of cost and pricing information
    of ISPs; and statutes/regulations also prevent ISP from sharing information among
    themselves. Active competition among ISPs will always protect their competitor''s
    cost/price information and can recruit their competitors'' staff in order to give
    them such information. However, network transmission costs are constantly changing
    not because of the variations in the number and quality of feasible transmission
    paths, the differences between full cost and variable cost, and the dynamic nature
    of wireless ports but also because of the following factors: (1) entrance and
    exits of ISPs into markets; (2) inflation; (3) calculation of depreciation ever;
    (4) changes in capital expenditures and (5) changes in marketing costs.


    Assume a best-case scenario where the competitors'' cost/price data are fully
    observable to the originating ISP (O-ISP), and there is a coalition, coalition
    members cannot coordinate/unify their routing systems/protocols. O-ISP can calculate
    a rough estimate of costs from point P1 to point P2, but O-ISP cannot dictate
    to network members about when and how to route the packet and which third-ISP
    to transmit the packet—and thus, each network member will typically be selfish
    despite coalition agreements. This state is referred to as coordination-control
    neutrality and it prevents any optimal allocations. Assume a first-case scenario,
    where all ISPs in the network cooperate to try and determine the most efficient'
