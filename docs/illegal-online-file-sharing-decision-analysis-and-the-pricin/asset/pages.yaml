  md: '# Chapter 4


    # Complexity and Optimal Sanctions for Illegal Online File Sharing under Unconstrained
    Transferable Utility and Varying Compliance*


    Illegal file sharing is an increasingly important determinant of profitability
    and distribution choices of companies in many industries. Illegal file sharing
    is often complicated by Internet congestion and lax enforcement. Thus, customer
    experience and firm-profitability can be vastly improved by piracy-minimizing
    and profit-maximizing sanctions that also reduce enforcement costs and monitoring
    costs. Such optimal sanctions are defined not only in terms of customers'' opportunity
    costs (waiting time, search costs, value of customer''s time, etc.) but also in
    terms of willingness-to-comply with intellectual property (IP) laws, expected
    post-purchase customer monetary utility, customer''s wealth and relative value,
    and customer''s marginal propensity-to-substitute digital products. These optimal
    sanctions can minimize the firm''s monitoring/enforcement costs and delivery costs
    and can also result in lower perceived prices for high-priority customers and
    uniform quality of service for all customers, all of which are socially more optimal
    outcomes when different customers place different values on compliance with IP
    laws.


    > * This chapter contains excerpts from an article written by Michael Nwogugu
    and cited as: Nwogugu (2015). Real options, enforcement of goodwill/intangibles
    rules and associated behavioral issues. Journal of Money Laundering Control, 18(3):
    330–351.'
