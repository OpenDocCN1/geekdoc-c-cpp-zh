  \ left, int top, int right, int bottom, int depth, int topflag);\n其中，left 指定左上角的\
  \ X 坐标，top 指定左上角的 Y 坐标，right 指定右下角的 X 坐标，bottom 指定右下角的 Y 坐标，depth 指定条形以像素为单位的深度，topflag\
  \ 决定是否在条形上放置一个三维顶端（如果为非零则放置，否则不放置） */\n#include <graphics.h>\nint main(){\n  /*\
  \ gm 是图形模式（Graphics mode），这是一种使用像素生成图像的计算机显示模式。DETECT 是在\"graphics.h\" 头文件中定义的宏宏\
  \ */\n  int gd = DETECT, gm;\n  // initgraph 通过从磁盘加载图形驱动程序初始化图形系统\n  initgraph(&gd,\
  \ &gm, \"\");\n  // 侧边位置\n  int left, top, right, bottom;\n  // 条形的深度\n  int depth;\n\
  \  // topflag 表示顶线。\n  int topflag;\n  // left, top, right, bottom, depth, topflag\
  \ 的位置\n  bar3d(left = 150, top = 250, right = 190, bottom = 350, depth = 20, topflag\
  \ = 1);\n  bar3d(left = 220, top = 150, right = 260, bottom = 350, depth = 20, topflag\
  \ = 0);\n  bar3d(left = 290, top = 200, right = 330, bottom = 350, depth = 20, topflag\
  \ = 1);\n  // y 轴线\n  line(100, 50, 100, 350);\n  // x 轴线\n  line(100, 350, 400,\
  \ 350);\n  getch();\n  // closegraph 函数关闭图形模式并释放图形系统分配的所有内存。\n  closegraph();\n\
  \  return 0;\n}\n```\n\n## 2.3\n```c\n#include <stdio.h>\nint main(){\n  for(int\
