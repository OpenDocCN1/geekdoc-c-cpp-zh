    # Form


    The form that you use to capture and maintain your atomic requirements (functional,
    non-functional and constraint) depends on the tools that you have available to
    you. Volere snow cards are often a useful aid to help you in discovering requirements
    but, due to volume and need to be able to make changes, some kind of automated
    form is the best way to manage and maintain your atomic requirements. Common forms
    for atomic requirements are:


    +   * A spreadsheet (a sample is included with the download of this template)

    * A database provided with whatever requirements tool/s you have available.

