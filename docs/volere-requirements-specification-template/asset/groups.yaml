    Use the requirements that you have already specified as input to writing the user
    documentation. For example you you have defined all the terms used in the requirements,
    then take advantage of this and use the same definitions and dictionary in the
    user documentation. Use the product use case (PUC) scenarios as the core of describing
    how a user can do a particular task. If someone else is writing the user documentation,
    show them how they can use a lot of the work that has already been done as the
    basis for user manuals.


    ## 25b. Training Requirements


    ### Content

    A description of the training needed by users of the product. Be careful not to
    waste time defining anything that has already been defined. especially the Product
    Use Cases, Atomic Requirements and definitions of data provide the input for the
    user training.


    ### Motivation

    To set expectations for the training. To identify who is responsible for creating
    and providing that training.


    ### Considerations

    What training will be necessary? Who will design the training? Who will provide
    the training? What are the plans for holding the training sessions?


    Use the requirements that you have already specified as input to designing the
    training. For example you have specified what a product use case (PUC) must do.
    Use that PUC scenario or model as the basis for building training for the users
    who will be carrying out that task. You have defined all the terms used in the
    requirements, so take advantage of this and use the same definitions and dictionary
    in the user training.


    ## 26. Waiting Room


    The waiting room holds requirements that will not, for one reason or another,
    be part of the initial release of the product. If you are competent at gathering
    requirements, your users may be inspired to think of more requirements than you
    can fit within the constraints of the project. While you may not want to include
    all of the requirements in the initial version of the product, neither do you
    want to lose them. If you are doing iterative development then the waiting room
    is your backlog.


    ### Content

    Any type of requirement at any level of detail.


    ### Motivation

    To allow requirements to be captured, even though they will not be part of the
    current development. To ensure that good ideas are not lost. To manage a backlog.


    ### Considerations

    The requirements-discovery process often throws away requirements that are beyond
    the sophistication of, or time allowed for, the current release of the product.
    This section holds these requirements in waiting. The intention is to avoid stifling
    the creativity of your users and clients, by using a repository to retain future
    requirements. You are also managing expectations by making it clear that you take
    these requirements seriously, although they will not be part of the agreed-upon
    product.


    Many people use the waiting room as a way of planning future versions of the product.
    Each requirement in the waiting room is tagged with its intended version number.
    As a requirement gets closer to implementation, you can spend more time on it
    and add details such as the cost and benefit attached to that requirement.


    You might also prioritize the contents of your waiting room. "Low-hanging fruit"—requirements
    that provide a high benefit at a low cost of implementation—are the highest-ranking
    candidates for the next release. You would also give a high waiting room rank
    to requirements for which there is a pent-up demand. You can think of the waiting
    room as a way of managing your backlog.


    The waiting room has a calming effect on everyone because it shows their ideas
    are being taken seriously. Your users and client know the requirements are not
    forgotten, merely parked until it is time to review them and make decisions about
    whether they will be incorporated in the product.


    ## 27. Ideas for Solutions


    Ideas for solutions are obviously not requirements, but it is impossible when
    gathering requirements not to get ideas for how they might be implemented. Rather
    than discarding ideas—or even worse—writing them as if they are requirements,
    a practical idea is to simply set aside a section of your specification for these
    ideas. Record each faithfully in this area, and then hand them over, along with
    the requirements, to your designer.


    ### Content

    Any idea for a solution that you think is worth keeping for future consideration.
    This can take the form of rough notes, sketches, pointers to other documents,
    pointers to people, pointers to existing products, prototypes and so on. The aim
    is to capture, with the least amount of effort, an idea that you can return to
    later.


    ### Motivation

    To make sure that good ideas are not lost. To help you separate requirements from
    solutions.


    ### Considerations

    While you are gathering requirements, you will inevitably have solution ideas;
    this section offers a way to capture them. Bear in mind that this section will
    not necessarily be included in every document that you publish.


    ### Form

    The ideas for solutions are an ideal subject for a blog. This is, after all, the
    place for ideas, and blogs are a great place for creativity and building on one
    another’s ideas.

