    ## 22a. Requirements for Migration to the New Product


    Content


    A list of the conversion activities. Timetable for implementation.


    ### Motivation


    To identify conversion tasks as input to the project planning process.


    ### Considerations


    Will you use a phased implementation to install the new system? If so, describe
    which requirements will be implemented by each of the major phases.


    What kind of data conversion is necessary? Must special programs be written to
    transport data from an existing system to the new one? If so, describe the requirements
    for these programs here.


    What kind of manual backup is needed while the new system is installed?


    When are each of the major components to be put in place? When are the phases
    of the implementation to be released?


    Is there a need to run the new product in parallel with the existing product?
    Will we need additional or different staff?


    Is any special effort needed to decommission the old product?


    This section is the timetable for implementation of the new system.


    ### Form


    A cross-reference between the development tasks, your project phases and the Product
    Use Cases and Atomic Requirements.


    ## 22b. Data That Has to be Modified or Translated for the New System


    Content


    List of data translation tasks.


    ### Motivation


    To discover missing tasks that will affect the size and boundaries of the project.


    ### Considerations


    Every time you make an addition to your dictionary (see section 7), ask this question:
    Where is this data currently held, and will the new system affect that implementation?


    ### Form


    Description of the current technology that holds the data.


    Description of the new technology that will hold the data.


    Description of the data translation tasks.


    Foreseeable problems.


    ## 23. Risks


    All projects involve risk—namely, the risk that something will go wrong. Risk
    is not necessarily a bad thing, as no progress is made without taking some risk.
    Risk is only a bad thing if the risks are ignored and they become problems. Risk
    management entails assessing risks which are most likely to apply to the project,
    deciding a course of action if they become problems, and monitoring projects to
    give early warnings of becoming problems.


    ### Content


    This section of the specification contains a list of the most likely and the most
    serious risks for your project. For each risk, include the probability of it becoming
    a problem and any contingency plans.


    ### Motivation


    To discover and manage the risks.


    ### Considerations


    Risks will undoubtedly change during the lifetime of a project. The better you
    understand the requirements the better you can identify which risks are most serious
    for your project. The project manager determines how to manage the risks but the
    requirements specialists and developers provide input on new risks and which are
    turning into problems.


    Use your knowledge of the requirements as input to discover which risks are most
    relevant to your project. Use the Volere Requirements Knowledge Model (included
    with the download of Version 16 of the template) as a trigger for identifying
    relevant risks.


    It is also useful to input to project management if you include the impact on
    the schedule, and/or the cost, if the risk becomes a problem.


    As an alternative, you may prefer to identify the single largest risk—the showstopper.
    If this risk becomes a problem, then the project will definitely fail. Identifying
    a single risk in this way focuses attention on the single most critical area.
    Project efforts are then concentrated on not letting this risk become a problem.


    This section of the book is not intended to be a thorough treatise on risk management.
    Nor is this section of the requirements specification meant to be a substitute
    for proper risk management. The intention is here to assign risks to requirements
    and show clearly that requirements are not free—they carry a cost that can be
    expressed as an amount of money or time, and as a risk. Later, you can use this
    information if you need to make choices about which requirements should be given
    a higher priority.


    ### Form


    A list or or log. Risk models as defined in: DeMarco, Tom, and Timothy Lister.
    Waltzing with Bears: Managing Risk on Software Projects. Dorset House, 2003.


    For each risk, include the probability of that becoming a problem. Jones''s Assessment
    and Control of Software Risks (Prentice-Hall, Englewood Cliffs, N. J., 1994) gives
    comprehensive lists of risks and their probabilities; you can use these lists
    as a starting point. For example, Jones cites the following risks as being the
    most serious.


    - Inaccurate metrics

    - Inadequate measurement

    - Excessive schedule pressure

    - Management malpractice

    - Inaccurate cost estimating

    - Silver bullet syndrome

    - Creeping user requirements

    - Low quality

    - Low productivity

    - Cancelled projects


    ## 24. Costs


    The other cost of requirements is the amount of money or effort that you have
    to spend building them into a product. Once the requirements specification is
    complete, you can use one of the estimating methods to assess the cost, expressing
    the result as a monetary amount or time to build.


    There is no best method to use when estimating. The important thing is to create
    your estimates using metrics directly related to the requirements. If you have
    specified the requirements in the way we have described, you will have the following
    metrics:


    - Number of input and output flows on the work context

    - Number of business events

    - Number of product use cases

    - Number of functional requirements

    - Number of non-functional requirements

    - Number of requirements constraints

    - Number of function points


    The more detailed the work you do on your requirements, the more accurate your
    estimates will be. Your cost estimate is the amount of resources you estimate
    each of deliverable will take to produce within your environment. You can create
    some very early cost estimates based on the work context. At that stage, your
    knowledge of the work will be general, and you should reflect this vagueness by
    making the cost estimate a range rather than a single figure. You can use these
    metrics as the basis for estimating the time, effort, and cost. For details on
    how to estimate requirements effort, refer to Mastering the Requirements Process,
    Addison Wesley, 2011.


    ### Appendix C Function Counting: A Simplified Introduction


    It is important that your client be told at this stage what the product is likely
    to cost. You usually express this amount as the total cost to complete the product,
    but you may also find advantageous to point out the cost of requirements effort.
    Whatever you do, do not leave the costs in the lap of hysterical optimism. Make
    sure that this section includes meaningful numbers on deliverables.


    ## 25. User Documentation and Training


    This section specifies the user documentation that will be produced as part of
    the product-building effort. This is not the documentation itself, but a description
    of what must be produced. The reason for including this description is to establish
    your client''s expectations, and to give your usability and your users the chance
    to assess whether the proposed documentation will be sufficient.


    ## 25a. User Documentation Requirements


    Content


    List of the user documentation to be supplied as part of the product. Be careful
    not to waste time anything that has already been defined. Bear in mind that the
    requirements, especially the Product Use Cases, Atomic Requirements and definitions
    of data provide the input for the user documentation.


    ### Motivation


    To set expectations for the user manuals and to identify who will be responsible
    for creating it.


    ### Examples


    - Technical specifications to accompany the product.

    - User manuals.

    - Service manuals (if not covered by the technical specification).

    - Emergency procedure manuals (e.g., the card found in airplanes).

    - Installation manuals.


    ### Considerations


    Which documents do you need to deliver, and to whom? Bear in mind that the answer
    to this question depends on your organizational procedures and roles. For each
    document, consider these issues:


    - The purpose of the document

    - The people who will use the document

    - Maintenance of the document


    What level of documentation is expected? Will the users be involved in the production
    of the documentation? Who will be responsible for keeping the documentation up-to-date?
    What form will the documentation take?

    '
