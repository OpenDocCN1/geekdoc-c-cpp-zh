    The numbers on the PUC diagram correspond to the BUC numbers on the Business Event
    List (see section 7).


    You can see that the PUC diagram is an effective summary for a small number (up
    to around 20) PUCs. If you have a larger number of PUCs then a Product Scope Diagram
    together with a PUC Summary Table (see 8b) is a better approach.


    Below is an example of a Product Scope Diagram for the Road De-icing project.
    The content of each one of the interfaces on the product scope diagram is defined
    in the data dictionary and can also be supported by a prototype or simulation
    of some kind. Some projects publish a separate document called the Interface Specification
    Document. The content of that document would be the definitions of the interfaces
    on the Product Scope Diagram often supported by prototypes and models.


