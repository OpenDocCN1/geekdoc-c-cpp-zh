    # 8c. Individual Product Use Cases


    This is where you define the details about the individual product use cases PCs
    listed on your PUC table. You can include a scenario or model, for each product
    use case on your list.


    Form


    - * A text scenario

    - A storyboard

    - A low fi prototype

    - A hi fi prototype

    - A formal use case specification including exceptions and alternatives

    - A sequence diagram, activity diagram, dataflow diagram, or any other type of
    model that is familiar to your project group


    # 9. Functional Requirements


    # 9a. Functional Requirements


    Content


    This is a specification for each atomic functional requirement. As for all types
    of atomic requirements(functional, non-functional, constraint), use the requirements
    shell as a guide for which attributes should be specified. A full explanation
    of the atomic requirement and its attributes is included in this template''s introductory
    material.


    Motivation


    To specify the detailed functional requirements to be carried out by the product.


    # # Examples


    | Requirement #: 75 | Requirement Type: 9 | Event/BUC/PUC #: 7, 9 |

    | --- | --- | --- |

    | Description: *The product shall record all the roads that have been treated*
    | | |

    | Rationale: *To be able to schedule untreated roads and highlight potential danger
    originator: Arnold Snow - Chief Engineer* | | |

    | Fit Criterion: *The recorded treated roads shall agree with the drivers''road
    treatment logs shall be up to date within 30 minutes* | | |

    | Customer Satisfaction: 5 | Customer Dissatisfaction: 5 | |

    | Dependencies: All | Conflicts: 10 | |

    | Supporting Materials: Work context diagram | 5 | |

    | History: Created 2010 | | |


    # # Fit Criterion


    Each requirement should have a fit criterion or a test case. In any event, the
    fit criterion is the benchmark to determine whether the implemented product has
    the requirement.


    # # Considerations


    If you have produced a use case list (see 6c and 8b), then you can use it to help
    with traceability into development groups. Note that if you have not identified
    the product boundary and are not in a position to determine the use cases (PUCs),
    then write the functional and non-functional requirements for the business cases
    (BUCs).


    Even if you are using prototypes, it is important to understand the requirements
    for the appearance. The prototype is used to elicit requirements; it should not
    be thought of as a substitute for the requirements.


    # Form


    The form that you use to capture and maintain your requirements (functional, non-functional)
    depends on the tools that you have. Volere cards are often a useful aid to help
    discovering requirements but, due to volume and need to make changes, some kind
    of automated form is the best way to manage. Common forms for atomic requirements
    are:


    - * A spreadsheet (a sample is included with the download of this template)

    - * A database provided with whatever requirements tool/s you have. There is a
    wide variety of tools on the market, refer to http://www.volere.co.uk/tools for
    a list

    - * An intranet set up by you to maintain and make accessible the atomic requirements
    and their attributes

    - * A custom built database


    Whatever form you built to record and maintain your requirements, it is important
    to be consistent with your numbering and terminology so that you can check for
    completeness and respond to change.


    # Non-functional Requirements


    The following sections 10-17 describe the nonfunctional requirements. The form
    of these requirements is the same as for the functional requirements as described
    above.


    # 10. Look and Feel Requirements


    # 10a. Appearance Requirements


    Content


    The section contains requirements relating to the spirit of the product. Your
    client may have made particular demands for the product, such as corporate branding,
    colours to be used, and so on. This section captures the requirements for the
    appearance. Do not attempt to design it until the appearance requirements are
    known.


    Motivation


    To ensure that the appearance of the product conforms to the organization''s expectations.


    Examples


    - The product shall be attractive to a teenage audience.

    - The product shall comply with corporate branding standards.


    Fit Criterion


    - A sampling of representative teenagers shall, without prompting or enticing,
    start using the product within four minutes of their first encounter with it.


    - The office of branding shall certify that the product complies with the current
    standards.

