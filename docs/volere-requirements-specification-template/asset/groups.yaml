    The above Product Scope diagram summarises the interfaces between the product
    and the actors/users.


    # Form


    A product use case diagram.


    A product scope diagram supported by individual use case specification. Specifications
    and prototypes of the interfaces on the scope diagram.


    # 8b. Product Use Case Table


    The product scope diagram is a useful summary of all the interfaces between the
    product and other automated systems, organizations and users. If there are a manageable
    number of PUCs – say less than twenty – then the PUC diagram is useful as a graphical
    way of summarizing the PUCs’ relevant to the product, But in practice we have
    found that a Product Use Case Table is more useful because it can handle larger
    numbers of PUCs and it precisely identifies the input and output data that defines
    the boundary of each PUC.


