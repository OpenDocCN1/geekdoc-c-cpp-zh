    # 6a. The Current Situation


    Content


    This is an analysis of the existing business processes, including the manual and
    automated processes that might be replaced or changed by the new product. In terms
    of the Volere Brown cow model you refer to this view as the “How Now” view. Business
    analysts might already have done this investigation as part of the business case
    analysis for the project. This is where it might be appropriate to build some
    Business process models. These are models of the processes that the business uses
    to carry out the work of the organization. The models include roles, individuals,
    departments, technology and procedures. They illustrate the workflow and the dependencies
    between the components of the process.


    Motivation


    If your project intends to make changes to an existing manual or automated system,
    you need to understand the effect of proposed changes. The study of the current
    situation provides the basis for understanding the effects of proposed changes
    and choosing the best alternatives. Business process modelling does not always
    lead to building software. Instead, some changes in procedures and the way roles
    are allocated might be the best way of making a necessary improvement.


    Form


    There are many different notations suitable for building business process models,
    for example: activity diagrams, business process diagrams, swimlane diagrams,
    dataflow diagrams.


    # 6b. The Context of the Work


    Content


    The work context diagram identifies the boundaries of the work that we need to
    investigate to be able to build the product. Note that it includes more than the
    intended product. Unless you understand the work that the product will support,
    you have little chance of building a product that will fit cleanly into its environment.


    The adjacent systems on the example context diagram (e.g., Weather Forecasting
    Service) indicate other subject matter (systems, people, and organizations) that
    need to be understood. The interfaces between the adjacent systems and the work
    context indicate why we are interested in the adjacent system. In the case of
    Weather Forecasting Service, we can say that we'
  - '[PAGE 28]


    are interested in the details of when, how, where, who, what, and why it produces
    the District Weather Forecasts information.


    # Motivation


    To clearly define the boundary for the study of the work and hence the requirements
    effort. Without this definition, we have little chance of building a product that
    will fit seamlessly into its environment.


    # Examples


    ![](img/764899fc92faa773697b3dbaa0e7799e_28_0.png)


    This work context model defines the connections between the part of the world
    that is under investigation and other people, organizations, hardware and software
    (referred to as adjacent systems). The inputs and outputs represent the data and
    material that travels between the work and other parts'
  - '[PAGE 29]


    of the world. The work context is the basis for partitioning investigation and
    discovering the requirements.


    # Considerations


    The names used on the context diagram should be consistent with the naming conventions
    (section 4) and should eventually be defined in the data dictionary (section 7).
    Without these definitions, the context model lacks the rigor, and it may be misunderstood.
    Relevant stakeholders must agree to the definitions of the interfaces shown on
    the context model.


    # Form


    A drawing showing the inputs and outputs that flow between the work and the adjacent
    systems.


    or


    A table that identifies all the inputs and outputs that flow between the work
    and the adjacent systems


    The names of the inputs and outputs are eventually defined in the data dictionary
    – see section 7b.


    # 6c. Work Partitioning


    # Content


    A list showing all business events to which the work responds. Business events
    are happenings in the real world that affect the work. Because it is time for
    the work to do something—example, produce weekly reports, remind non-paying customers,
    check the status of a device, and so on. The response to each event is a business
    use case (known as a BUC); it represents a discrete partition of work that contributes
    to the total functionality of the work.


    The event list includes the following elements:


    +   - Event name

    - Input or triggering data flow from adjacent systems (identical with name on
    context diagram)

    - Output/s to adjacent systems (identical with name/s on context diagram)

    - Brief summary of the business use case (This is optional, but we have found
    it a very useful first step in defining the requirements for the business use
    case—you can think of it as a mini-scenario.)'
  - '[PAGE 30]


    +   - Classes of business data relevant to this event (you won’t know this early
    in the study of the event, as you go into detail you will start to understand
    the essential data and you can add it to the event list.)


    # Motivation


    To identify logical chunks of the work that can be used as the basis for discovering
    detailed requirements. These business events also provide the subsystems that
    can be used as the basis for managing detailed analysis and design. Each business
    event has a business use case (BUC) whose details can be studied independently.
    However all BUCs connect to each other through the stored business data (see section
    7).'
