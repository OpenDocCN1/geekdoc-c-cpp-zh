    # 25a. User Documentation Requirements


    Content


    List of the user documentation to be supplied as part of the product. Be careful
    not to waste time anything that has already been defined. Bear in mind that the
    requirements, especially the Product Use Cases, Atomic Requirements and definitions
    of data provide the input for the user documentation.


    Motivation


    To set expectations for the user manuals and to identify who will be responsible
    for creating it.


    Examples


    Technical specifications to accompany the product.


    User manuals.


    Service manuals (if not covered by the technical specification).


    Emergency procedure manuals (e.g., the card found in airplanes).


    Installation manuals.


    Considerations


    Which documents do you need to deliver, and to whom? Bear in mind that the answer
    to this question depends on your organizational procedures and roles. For each
    document, consider these issues:


    +   - The purpose of the document

    - The people who will use the document

    - Maintenance of the document


    What level of documentation is expected? Will the users be involved in the production
    of the documentation? Who will be responsible for keeping the documentation up-to-date?
    What form will the documentation take?'
