- md: '

    ## 1b. Goals of the Project


    ### Content


    This part of the specification describes what we want the product to do and what
    advantage it will bring to the overall goals of the work. Do not be too wordy
    in this section—a brief explanation of the project''s goals is usually more valuable
    than a long, rambling treatise. A short, sharp goal will be clearer to the stakeholders
    and improve the chances of reaching a consensus for the goal.


    ### Motivation


    There is a danger that this purpose may get lost along the way. As the customer
    and developers discover more about what is possible, the system could potentially
    wander away from the original goals as it undergoes construction. This is a bad
    unless there is some deliberate act by the client to change the goals. It may
    be necessary to appoint a person to be custodian of the goals, but it is probably
    sufficient to make the goals public and periodically remind the developers of
    it. It should be mandatory to acknowledge the goals at every review session.


    ### Examples


    - We want to give immediate and complete response to customers who order our goods
    online.

    - To reduce accidents by accurately forecasting and scheduling the de-icing of
    roads.


    ### Measurement


    Any reasonable goal must be measurable. This is necessary if you are ever to test
    whether you have succeeded with the project. The measurement must quantify the
    advantage gained by the business through doing the project. If the project is
    worthwhile, there must be some solid reason for doing it. For example, if the
    goal of your project is:


    - We want to give immediate and complete response to customers who order our goods
    online.


    you have what advantage meeting that goal brings to the organization. If immediate
    response will result in more satisfied customers, then the measurement must quantify
    that satisfaction. For example, you could measure the increase in repeat business
    (on the basis that a happy customer comes back for more), the increase in customer
    approval ratings from surveys, the increase in revenue from returning customers,
    and so on.


    Ask whatever your goal is:


    - Service goal: This is measured by quantifying what it does for the customer

    - Revenue goal: quantify how much revenue or revenue growth over what period of
    time. Alternatively, a revenue goal could be quantified by market share.

    - Legal goal: this is not a quantification, a way of knowing that the product
    conforms to a piece of legislation (this could be the law of the land or might
    be a standard of your industry or organization).


    It is crucial to the rest of the development effort that the goal is firmly established,
    is reasonable, and is measured. It is usually the latter that makes the former
    possible.


    ### Form


    You can use Purpose, Advantage, Measurement (PAM) to structure your goal.

    Purpose: one sentence to explain the organisation''s reason for investing in the
    project.


    Advantage: One sentence describing the benefit that the organization will realize
    if the project is successful.


    Measurement: One sentence or a graph or diagram that quantifies how you will measure
    or not the benefit has been achieved.


    Another form for your goals might be to use some kind of goal model. For example,
    the Extended Enterprise Modelling Language EEML, includes a goal modelling technique.
    If your organization is using enterprise modelling then this provides a connection
    between the enterprise''s strategic goals and the goal of an individual project.


    ## 2. The Stakeholders


    This section describes the stakeholders—the people who have an interest in the
    product. It is worth your to spend enough time to accurately determine and describe
    these people, the penalty for not knowing who they are can be very high.


    ## 2a. The Client


    ### Content


    This item gives the name of the client (sometimes referred to as the sponsor)
    It is permissible to have several names, but having more than three negates the
    point.


    ### Motivation


    The client has the final say on acceptance of the product, and thus must be satisfied
    with the product as delivered. You can think of the client as the person who makes
    the investment in the product. Where the product is being developed for in-house
    consumption, the same person often fills the roles of the client and the customer.
    If you cannot find a name for your client, then perhaps you should not be building
    the product.


    ### Considerations


    Sometimes, when building a package or a product for external users, the client
    is the marketing department. In this case, a person from the marketing department
    must be named as the client.


    ### Form


    - An annotated organization chart showing where the client fits within the organization.

    - A list of the decisions for which the client will be responsible.

    - You can also include a chart showing the review checkpoints and itemizing what
    you will provide for the client as progress indicators for the project.


    ## 2b. The Customer


    ### Content


    The person intended to buy the product. In the case of in-house development, the
    client and the customer are probably the same person. The customer might also
    be the manager who decides whether or not the people for whom he is responsible
    will adopt a new/changed product.


    In the case of development of a mass-market product, this section contains a description
    of the persona developed as the archetypical customer for the product (See section
    2e).


    ### Motivation


    The customer is ultimately responsible for deciding whether to buy or recommend
    the use of the product. The correct requirements can be gathered only if you understand
    the customer and his aspirations when it comes to using your product.


    ### Form


    - A list of the decisions for which the customer will be responsible.

    - You can also include a chart showing the review checkpoints and itemizing what
    you will provide for the customer as progress indicators for the project.

    - This might include a list of possible prototypes or simulations that you will
    provide for the customer during the progress of the project.


    ## 2c. Other Stakeholders


    ### Content


    The roles and (if possible) names of other people and organizations who are affected
    by the product, or whose input is needed to build the product. These stakeholders
    might work for your organization but might be external.


    Examples of stakeholders:


    - Client/Sponsor (refer to 2a)

    - Customer (refer to 2b)

    - Subject Matter Experts

    - Members of the public

    - Users of a current system

    - Marketing experts

    - Legal experts

    - Domain experts

    - Usability experts

    - Representatives of external associations

    - Business analysts

    - Designers and developers

    - Testers

    - Systems engineers

    - Software engineers

    - Technology experts

    - System designers


    For a complete checklist, download the stakeholder analysis template at http://www.volere.co.uk.


    For each type of stakeholder, provide the following information:


    - Stakeholder identification (some combination of role/job title, person name,
    and organization name)

    - Knowledge that the project needs from stakeholder

    - The degree of involvement necessary for that stakeholder/knowledge combination

    - The degree of influence for that stakeholder/knowledge combination

    - Agreement on how to address conflicts between stakeholders who have an interest
    in the same knowledge


    ### Motivation


    Failure to recognize stakeholders results in missing requirements.


    ### Form


    A stakeholder map supported by the name of the representative of each role together
    with the knowledge to be supplied by that role. The following diagram is a generic
    stakeholder map that you can use as a checklist and replace the role maps with
    the specific people/roles/organizations for your project. For more on stakeholder
    maps refer to http://www.volere.com


    ![](img/764899fc92faa773697b3dbaa0e7799e_10_0.png)


    Another form you can use to identify the stakeholders is a Stakeholder Analysis
    Spreadsheet. A sample is downloadable at http://www.volere.com


    An annotated organization chart is also a useful form for defining stakeholders.

