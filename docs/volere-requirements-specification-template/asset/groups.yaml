    # # Fit Criterion


    Each requirement should have a fit criterion or a test case. In any event, the
    fit criterion is the benchmark so that the tester can objectively determine whether
    or not the implemented product has the requirement.


    # # Considerations


    If you have produced an event/use case list (see sections 6c and 8a/b), then you
    can use it to help trigger the functional requirements for each event/use case.
    If you have not produced an event/use case list, give each functional requirement
    a unique number and, and to help with traceability, partition these requirements
    into event/use case-related groups in the development process.


    Note that if you have not identified the product boundary and are not in a position
    to determine the product use cases (PUC''s), then write the functional and non-functional
    requirements for the business use cases (BUC''s). This is an especially good strategy
    if you are writing business requirements and asking suppliers to tell you which
    of your business requirements can be satisfied by their product/s.'
