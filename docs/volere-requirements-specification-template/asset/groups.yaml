    # Considerations


    We make unconscious assumptions. It is necessary to talk to the members of the
    project team to discover any unconscious assumptions that they have made. Ask
    stakeholders (both technical and business-related) questions such as these:


    +   - What software tools are you expecting to be available?

    - Will there be any new software products?

    - Are you expecting to use a current product in the new way?

    - Are there any business changes you are assuming we will be able to deal with?


    It is important to state these assumptions up front. You might consider the probability
    of whether the assumption is correct and, when relevant, a list of alternatives
    if that is assumed does not happen.


    The assumptions are intended to be transient. That, they should all be cleared
    by the time the specification is released–the assumption should become either
    a requirement or a constraint. For example, if the assumption related to the capability
    of a product that is intended to be a partner product to yours, the capability
    should have been proven satisfactory, and it becomes a constraint to use it. Conversely,
