- md: "\n## 2d. The Hands-On Users of the Product\n\n### Content\nA list of a special\
    \ type of stakeholder—the potential users of the product. For each category of\
    \ user, provide the following information:\n\n- User name/category: Most likely\
    \ the name of a user group, such as clerical users, schoolchildren, road engineers,\
    \ or project managers.\n- User role: Summarizes the users' responsibilities.\n\
    - Subject matter experience: Summarizes the users' knowledge of the subject matter/business.\
    \ Rate as novice, journeyman, or master.\n- Technological experience: Describes\
    \ the users' experience with relevant technology. Rate as novice, journeyman,\
    \ or master.\n- Other user characteristics: Describe any characteristics of the\
    \ users that have an effect on the requirements and eventual design of the product.\
    \ For example:\n    - Physical abilities/disabilities\n    - Intellectual abilities/disabilities\n\
    \    - Attitude toward job\n    - Attitude toward technology\n    - Physical location\n\
    \    - Education\n    - Linguistic skills\n    - Age group\n    - Gender\n   \
    \ - Ethnic group/s\n\n### Motivation\nUsers are human beings who interface with\
    \ the product in some way. Use the characteristics of the users to define the\
    \ usability requirements for the product. Users are also known as actors.\n\n\
    ### Examples\nUsers can come from wide variety of (sometimes unexpected) sources.\
    \ Consider the possibility of your users being clerical staff, shop workers, managers,\
    \ highly trained operators, the general public, casual users, passersby, illiterate\
    \ people, tradesmen, students, test engineers, foreigners, children, lawyers,\
    \ remote users, people using the system over the telephone or an Internet connection,\
    \ emergency workers, and so on.\n\n### Form\nA simple list or a spreadsheet containing\
    \ the User Characteristics for each User Role + User Name/Representative\n\n##\
    \ 2e. Personas\n\n### Content\nA story about an invented person that includes:\n\
    \nPersona's name, age, job, family, hobbies, where they live, favourite food,\
    \ favourite music, likes, dislikes, where they go on holiday, attitude to technology,\
    \ money, or any other characteristic that could influence the way that the persona\
    \ thinks of the product. It helps if you include a photograph or drawing of the\
    \ imagined person.\n\n### Motivation\nBy having one or more (limit it to 3) personas\
    \ you can make the requirements specific to the people you are trying to satisfy.\
    \ This is a particularly effective technique if you are specifying the requirements\
    \ for a consumer product or a product that will be used by members of the public.\n\
    \n### Form\nA profile containing the life story of the persona. Include a photograph\
    \ or drawing of the persona. The profile can be in the form of a document that\
    \ you use to introduce project participants to the persona. You can also put the\
    \ persona onto a large format, A3, card that you display at meetings to remind\
    \ participants about whose requirements you are trying to discover. Another idea\
    \ is to build a storyboard of the persona's life. You can also make a website\
    \ for the persona and keep him/her alive by adding more about the persona's everyday\
    \ life. All of these forms of capturing and communicating the persona are intended\
    \ to help people think of the persona as a real user with specific, rather than\
    \ general, real requirements.\n\n## 2f. Priorities Assigned to Users\n\n### Content\n\
    Attach a priority to each category of user. This identifies the importance and\
    \ precedence of the user. Prioritize the users as follows:\n\n- Key users: They\
    \ are critical to the continued success of the product. Give greater importance\
    \ to requirements generated by this category of user.\n- Secondary users: They\
    \ will use the product, but their opinion of it has no effect on its long-term\
    \ success. Where there is a conflict between secondary users' requirements and\
    \ those of key users, the key users take precedence.\n- Unimportant users: This\
    \ category of user is given the lowest priority. It includes frequent, unauthorized,\
    \ and unskilled users, as well as people who misuse the product.\n\nThe percentage\
    \ of the type of user is intended to assess the amount of consideration given\
    \ to each category of user.\n\n### Motivation\nIf some are considered to be more\
    \ important to the product or to the organization, this preference should be stated\
    \ because it should affect the way that you design the product. For instance,\
    \ you need to know if there is a large customer group who has specifically asked\
    \ for the product, and for which, if they do not get what they want, the results\
    \ could be a significant loss of business.\n\nSome users may be listed as having\
    \ no impact on the product. These users will make use of the product, but have\
    \ no vested interest in it. In other words, these users will not complain, nor\
    \ will they contribute. Any special requirements from these users will have a\
    \ lower design priority.\n\n### Form\nInclude the user importance rating on your\
    \ user characteristics spreadsheet, see 2d, for the information of the core project\
    \ team. Depending on the culture of your organization, you might need to treat\
    \ this as sensitive information.\n\n## 2g. User Participation\n\n### Content\n\
    Where appropriate, attach to the category of user a statement of the participation\
    \ that you think will be necessary for those users to provide the requirements.\
    \ Describe the contribution that you expect these users to provide—for example,\
    \ business knowledge, interface prototyping, or usability requirements. If possible,\
    \ assess the minimum amount of time that these users must spend for you to be\
    \ able to determine the complete requirements.\n\n### Motivation\nMany projects\
    \ fail through lack of user participation, sometimes because the required degree\
    \ of participation was not made clear. When people have to make a choice between\
    \ getting their everyday work done and working on a new project, the everyday\
    \ work usually takes priority. This requirement makes it clear, from the outset,\
    \ specified user resources must be allocated to the project.\n\n### Form\nInclude\
    \ the estimated user participation time, together with the type of knowledge you\
    \ expect that user to provide, on your user characteristics spreadsheet, see 2d.\n\
    \n## 2h. Maintenance Users and Service Technicians\n\n### Content\nMaintenance\
    \ users are a special type of hands-on users who have requirements to maintaining\
    \ and changing the product.\n\n### Motivation\nMany of these requirements will\
    \ be discovered in section 4. However, if we define the characteristics of the\
    \ people who maintain the product, it will help to trigger requirements that might\
    \ otherwise be missed.\n\n### Form\nInclude the maintenance users, on your user\
    \ characteristics spreadsheet, see 2d.\n\n## 3. Mandated Constraints\nThis section\
    \ describes constraints on the eventual design of the product. Constraints are\
    \ global—factors that apply to the entire product. The product must be built within\
    \ the constraints. Often you know about the constraints, or they are mandated\
    \ before the project gets under. They are properly determined by management and\
    \ worth considering—restrict what you can do and shape the product. Constraints,\
    \ like other types of requirements have a description, rationale, and fit criterion,\
    \ and generally are written in the same format as functional and non-functional\
    \ requirements.\n\n### 3a. Solution Constraints\n\n### Content\nThis specifies\
    \ constraints on the mandated technology or solution. Include any appropriate\
    \ version numbers. You should also explain the reason for using the technology.\n\
    \n### Motivation\nTo identify constraints that guide the final product. Your client,\
    \ customer, or user may have design preferences, or only certain solutions may\
    \ be acceptable. If these constraints are not met, your solution is not acceptable.\n\
    \n### Examples\nConstraints are written using the same form as other atomic requirements\
    \ (refer to the requirements card/shell for the attributes). It is important for\
    \ each constraint to have a rationale and a fit criterion, as they help expose\
    \ false constraints (solutions masquerading as constraints). Also, you will usually\
    \ find that a constraint affects the entire product rather than one or more product\
    \ use cases.\n\n- Description: The product shall use the current two-way radio\
    \ system to communicate with the drivers in their trucks.\n  Rationale: The client\
    \ will not pay for a new radio system, nor are any other means of communication\
    \ available to the drivers.\n  Fit criterion: All signals generated by the product\
    \ shall be audible and understandable by all drivers via their two-way radio system.\n\
    \n- Description: The product shall operate using Windows XP.\n  Rationale: The\
    \ client uses XP and does not wish to change to a later version.\n  Fit criterion:\
    \ The product shall be approved as XP compliant by the MS testing group.\n\n-\
    \ Description: The product shall be a hand-held device.\n  Rationale: The product\
    \ is to be marketed to hikers and mountain climbers.\n  Fit criterion: The product\
    \ shall weigh no more than 300 grams, no dimension shall be more than 15cm, and\
    \ there shall be no external power source.\n"
  mdcn: "\n\n## 2d. 产品的实际操作用户\n\n### 内容\n一类特殊类型的利益相关者列表——即产品的潜在用户。对于每一类用户，提供以下信息：\n\
    \n- 用户名称/类别：最可能是用户组的名称，例如文职人员、学生、道路工程师或项目经理。\n- 用户角色：总结用户的职责。\n- 领域知识经验：总结用户对相关领域/业务的了解程度。评分为初学者、熟练工或专家。\n\
    - 技术经验：描述用户对相关技术的经验。评分为初学者、熟练工或专家。\n- 其他用户特征：描述任何对需求和产品最终设计产生影响的用户特征。例如：\n   \
    \ - 身体能力/残疾\n    - 智力能力/残疾\n    - 对工作的态度\n    - 对技术的态度\n    - 地理位置\n    - 教育背景\n\
    \    - 语言能力\n    - 年龄段\n    - 性别\n    - 种族/族群\n\n### 动机\n用户是以某种方式与产品交互的人类。利用用户的特征来定义产品的可用性需求。用户也被称为用参与者（Actors）。\n\
    \n### 示例\n用户可能来自各种（有时是意料之外的）来源。考虑你的用户可能是文职人员、店员、经理、经过高度培训的操作员、普通大众、休闲用户、路人、不识字者、技艺人员、学生、测试工程师、外国人、儿童、律师、远程用户、通过电话或互联网连接使用系统的人、应急工作人员等。\n\
    \n### 格式\n一个简单的列表或电子表格，包含每个“用户角色 + 用户名称/代表人物”的用户特征。\n\n## 2e. 用户画像 (Personas)\n\
    \n### 内容\n一个关于虚构人物的故事，包括：\n\n用户画像的名字、年龄、工作、家庭、爱好、居住地、最喜欢的食物、最喜欢的音乐、喜欢的、讨厌的、去哪里度度假、对技术的态度、金钱状况或任何其他可能影响该人物对产品思考方式的特征。如果能包含构想人物的照片或图画将会有所帮助。\n\
    \n### 动机\n通过拥有一个或多个（限制在3个以内）用户画像，你可以让需求更针对你正试图满足的人群。如果你正在为消费类产品或公众成员使用的产品规定需求，这种技术将尤为有效。\n\
    \n### 格式\n包含用户画像生平的简介。包含用户画像的照片或图画。简介可以以文档形式存在，用于向项目参与者介绍用户画像。你也可以将用户画像放在大尺寸的A3卡片上，并在会议上展示，提醒参与者你正在试图发现谁的需求。另一个想法是为用户画像制作故事板。你还可以为用户画像创建一个网站，通过添加更多关于其日常生活的内容来保持他的“活跃”。所有这些捕捉和交流用户画像的形式都是为了帮助人们将用户画像视为具有特定而非通用真实需求的真实用户。\n\
    \n## 2f. 分配给用户的优先级\n\n### 内容\n为每一类用户分配一个优先级。这确定了用户的重要性和优先顺序。按如下方式对用户进行优先级排序：\n\
    \n- 关键用户：他们对产品的持续成功至关重要。赋予这类用户产生的需求更高的权重。\n- 次要用户：他们会使用产品，但他们对产品的看法对其长期成功没有影响。当次要用户的需求与关键用户的需求发生冲突时，以关键用户优先。\n\
    - 不重要的用户：这类用户被最低优先级。这包括频繁的、未经授权的、无技能的用户，以及误用产品的人。\n\n用户类型的百分比旨在评估对每一类用户所考虑的程度。\n\
    \n### 动机\n如果某些用户被认为对产品或组织更重要，这种偏好应该被陈明，因为它会影响你设计产品的方式。例如，你需要知道是否有一个大的客户群专门要求该产品，如果他们没有得到他们想要的，可能会导致重大的业务损失。\n\
    \n某些用户可能被列为对产品没有影响。这些用户会使用产品，但对其没有利益。换句话说，这些用户既不会抱怨，也不会做贡献。这些用户的任何特殊需求将具有较低的设计优先级。\n\
    \n### 格式\n在你的用户特征电子表格中（见 2d）包含用户重要性评级，以供核心项目团队参考信息。根据你所属组织的文化，你可能需要将此视为敏感信息。\n\
    \n## 2g. 用户参与\n\n### 内容\n在适当的情况下，为用户类别附上参与声明，说明你认为这些用户提供需求是必要的参与程度。描述你期望这些用户提供的贡献——例如，业务知识、界面原型设计或可用性需求。如果可能，评估这些用户必须花费的最少时间，以便你确定完整的需求。\n\
    \n### 动机\n许多项目由于缺乏用户参与而失败，有时是因为要求的参与程度没有说清楚。当人们必须在“完成日常工作”和“致力于新项目”之间做出选择时，日常工作通常具有优先权。这项要求从从初就明确了，必须为项目分配指定的用户资源。\n\
    \n### 格式\n在你的用户特征电子表格中（见 2d）包含预估的用户参与时间，以及你期望该用户提供的知识类型。\n\n## 2h. 维护用户与服务技术人员\n\
    \n### 内容\n维护用户是一种特殊的实际操作用户，他们对维护和更改产品有需求。\n\n### 动机\n许多此类需求将在第4节发现。如果我们定义了维护产品的人的特征，将有助于触发可能遗漏的需求。\n\
    \n### 格式\n将维护用户包含在用户特征电子表格中（见 2d）。\n\n## 3. 强制约束\n本节描述了对产品最终设计的约束。约束是全局性的——适用于整个产品的因素。产品必须在约束范围内构建。通常你已经知道这些约束，或者它们在项目开始前就已经确定了。它们限制了你可以做的事情并塑造了产品。约束与其他需求类型一样，具有描述、理由和适用标准，并通常以功能性和非功能需求相同的格式编写。\n\
    \n### 3a. 解决方案约束\n\n### 内容\n规定强制性技术或解决方案。包括任何相关的版本号。你应该解释使用该技术的原因。\n\n### 动机\n\
    确定指导产品的约束。你的客户、顾客或用户可能有设计偏好，或者只有某些解决方案是可以接受的。如果不符合这些约束，你的解决方案就是不可接受的。\n\n### 示例\n\
    约束的写法与其他原子需求相同（参考需求卡片/模板）。对于每个约束，理由和适用标准都是重要的，因为有助于暴露错误的约束（伪装成约束的解决方案）。此外，你通常会发现约束影响整个产品，而不是一个或多个产品用例。\n\
    \n- 描述：产品应使用目前的无线电系统与司机司机进行通信。\n  理由：客户不会为新的无线电系统付费，司机也没有其他通信手段。\n  适用标准：产品产生的所有信号应能让所有司机通过无线电系统听到并理解。\n\
    \n- 描述：产品应在 Windows XP 上运行。\n  理由：客户使用 XP 不想切换到更高版本。\n  适用标准：产品应通过微软测试组的 XP 合规认证。\n\
    \n- 描述：产品应为手持设备。\n  理由：该产品面向徒步者和登山者营销。\n  适用标准：产品重量不超过 300 克，任何尺寸不应超过 15 厘米，且没有外部电源。\n\
    \n"
