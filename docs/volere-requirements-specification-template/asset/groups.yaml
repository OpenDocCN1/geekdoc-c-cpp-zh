    # Motivation


    In many countries it is required that some products made available to the disabled.
    In any event, it is self-defeating to exclude this sizable community of potential
    customers.


    # Examples


    +   - The product shall be usable by partially sighted users.

    - The product shall conform to the Americans with Disabilities Act.


    # Considerations


    Some users have disabilities other than the commonly known. In addition, some
    partial disabilities are fairly common. A simple, and not very consequential,
    example is that approximately 20 percent of males are red-green-blind.


    # 12. Performance Requirements


    # 12a. Speed and Latency Requirements


    # Content


    Specifies the amount of time available to complete specified tasks. These requirements
    often refer to response times. They can also refer to the product''s ability to
    operate at a speed suitable for the intended environment.


    # Motivation


    Some products—usually real-time products—must be able to perform some of their
    functionality within a given time slot. Failure to do so may mean catastrophic
    failure (e.g., a ground-sensing radar in an airplane to detect an upcoming mountain)
    or the product will not cope with the required volume of use (e.g., an automated
    ticket-selling machine).


    # Examples


    +   - Any interface between a user and the automated system shall have a maximum
    response time of 2 seconds.

    - The response shall be fast enough to avoid interrupting the user''s flow of
    thought.

    - The product shall poll the sensor every 10 seconds.

    - The product shall download the new status parameters within 5 minutes of a change.'
  - '[PAGE 51]


    # Fit Criterion


    Fit criteria are needed when the description of the requirement is not quantified.
    However, we find that most performance requirements are stated in quantified terms.
    The exception is the second requirement shown above, for which the suggested fit
    criterion is


    The product shall respond in less than 1 second for 90 percent of the interrogations.
    No response shall take longer than 2.5 seconds.


    # Considerations


    There is a wide variation in the importance of different types of speed requirements.
    If you are working on a missile guidance system, then speed is extremely important.
    By contrast, an inventory control report that is once every six months has very
    little need for a lightning-fast response time.


    Customize this section of the template to give examples of the speed requirements
    that are important within your environment.


    # 12b. Safety-Critical Requirements


    # Content


    Quantification of the perceived risk of damage to people, property, and environment.
    Different countries have different standards, so the fit criteria must specify
    precisely which standards the product must meet.


    # Motivation


    To understand and highlight the damage that could potentially occur when using
    the product within the expected operational environment.


    # Examples


    +   The product shall not emit noxious gases that damage people’s health.


    +   The heat exchanger shall be shielded from human contact.


    # Fit Criterion


    The product shall be certified to comply with the Health Department’s standard
    E110-98. It is to be certified by qualified testing engineers.


    No member of a test panel of [specified size] shall be able to touch the heat
    exchanger. The heat exchanger must also comply with safety standard [specify which
    one].


    # Considerations


    The example requirements given here apply to some, but not all, products. It is
    not possible to give examples of every variation of safety-critical requirement.'
  - '[PAGE 52]


    To make the template work in your environment, you should customize it by adding
    examples that are specific to your products.


    Also, be aware that different countries have different safety standards and laws
    relating to safety. If you plan to sell your product internationally, you must
    be aware of these laws. A colleague has suggested that for electrical products,
    if you follow the German standards, the largest number of countries will be supported.


    If you are building safety-critical systems, the relevant safety-critical standards
    are already well specified. You will likely have experts on your staff. These
    experts are the best source of the relevant safety-critical requirements for your
    type of product. They will almost certainly have copious information that you
    can use.


    Consult your legal department. Members of this department will be aware of the
    kinds of lawsuits that have resulted from product safety failure. This is probably
    the best starting place for generating relevant safety requirements.


    # 12c. Precision or Accuracy Requirements


    Content


    Quantification of the desired accuracy of the results produced by the product.


    Motivation


    To set the client''s and users'' expectations for the precision of the product.


    Examples


    +   - All monetary amounts shall be accurate to two decimal places.

    - Accuracy of road temperature readings shall be within ±2°C.


    Considerations


    If you have done any detailed work on definitions, then some precision requirements
    might be adequately defined by definitions in the dictionary in section 7.


    You might consider which units the product is intended to use. Readers will recall
    the spacecraft that crashed on Mars when coordinates were sent as metric data
    rather than imperial data.


    The product might also need to keep accurate time, be synchronized with a time
    server, or work in UTC.


    Also, be aware that some currencies have no decimal places, such as the Japanese
    yen.'
  - '[PAGE 53]


    # 12d. Reliability and Availability Requirements


    Content


    This section quantifies the necessary reliability of the product. The reliability
    is usually expressed as the allowable time between failures, or the total allowable
    failure rate.


    This section also quantifies the expected availability of the product.


    Motivation


    It is critical for some products not to fail too often. This section allows you
    to explore the possibility of failure and to specify realistic levels of service.
    It also gives you the opportunity to set the client''s and users'' expectations
    about the amount of time that the product will be available for use.


    Examples


    +   - The product shall be available for use 24 hours per day, 365 days per year.


    +   - The product shall be available for use between the hours of 8:00 A.M. and
    5:30 P.M.


    +   - The escalator shall run from 6 A.M. until 10 P.M. or until the last flight
    arrives.


    +   - The product shall achieve 99 percent uptime.


    Considerations


    Consider carefully whether the real requirement for your product is that it is
    available for use or that it does not fail at any time.


    Consider also the cost of reliability and availability, and whether it is justified
    for your product.


    # 12e. Robustness or Fault-Tolerance Requirements


    Content


    Robustness specifies the ability of the product to continue to function under
    abnormal circumstances.


    Motivation


    To ensure that the product is able to provide some or all of its services after
    or during some abnormal happening in its environment.


    Examples


    +   - The product shall continue to operate in local mode whenever it loses its
    link to the central server.'
  - '[PAGE 54]


    The product shall provide 10 minutes of emergency operation should it become disconnected
    from the electricity source.


    # Considerations


    Abnormal happenings can almost be considered normal. Today''s products are so
    large and complex that there is a good chance that at any time, one component
    will not be functioning correctly. Robustness requirements are intended to prevent
    total failure of the product.


    You could also consider disaster recovery in this section. This plan describes
    the ability of the product to re-establish acceptable performance after faults
    or abnormal happenings.


    #  12f. Capacity Requirements


    # Content


    This section specifies the volumes that the product must be able to deal with
    and the amount of data stored by the product.


    # Motivation


    To ensure that the product is capable of processing the expected volumes.


    # Examples


    The product shall cater for 300 simultaneous users within the period from 9:00
    A.M. to 11:00 A.M. Maximum loading at other periods will be 150 simultaneous users.


    During a launch period, the product shall cater for a maximum of 20 people to
    be in the inner chamber.


    # Fit Criterion


    In this case, the requirement description is quantified, and thus can be tested.


    # 12g. Scalability or Extensibility Requirements


    # Content


    This specifies the expected increases in size that the product must be able to
    handle. As a business grows (or is expected to grow), our software products must
    increase their capacities to cope with the new volumes.


    # Motivation


    To ensure that the designers allow capacity for future growth.'
- md: '

    Examples


    The product shall be capable of processing the existing 100,000 customers. This
    number is expected to grow to 500,000 customers within three years.


    The product shall be able to process 50,000 transactions per hour within two years
    of its launch.


    ## 12h. Longevity Requirements


    Content


    This specifies the expected lifetime of the product.


    Motivation


    To ensure that the product is built based on an understanding of expected return
    on investment.


    Examples


    The product shall be expected to operate within the defined maximum maintenance
    budget for a minimum of five years.


    ## 13. Operational and Environmental Requirements


    ### 13a. Expected Physical Environment


    Content


    This section specifies the physical environment in which the product will operate.


    Motivation


    To highlight conditions that might need special requirements, preparations, or
    training. These requirements ensure that the product is fit to be used in its
    intended environment.


    Examples


    The product shall be used by a worker, standing up, outside in cold, rainy conditions.


    The product shall be used in noisy conditions with a lot of dust.


    The product shall be able to fit in a pocket or purse.


    The product shall be usable in dim light.


    The product shall not be louder than the existing noise level in the environment.


    Considerations


    The work environment: Is the product to operate in some unusual environment? Does
    this lead to special requirements? Also see section 11, Usability and Humanity
    Requirements.


    ### 13b. Requirements for Interfacing with Adjacent Systems


    Content


    This section describes the requirements to interface with partner applications
    and/or devices that the product needs in order to successfully operate.


    Motivation


    Requirements for the interfaces to other applications often remain undiscovered
    until implementation time. Avoid a high degree of rework by discovering these
    requirements early.


    Examples


    - The products work on the last four releases of the five most popular browsers.

    - The new version of the spreadsheet must be able to access data from the previous
    two versions.

    - Our product must interface with the applications that run on the remote weather
    stations.


    Fit Criterion


    For each inter-application interface, specify the following elements:


    - The data content

    - The physical material content

    - The medium that carries the interface

    - The frequency

    - The volume

    - The trigger

    - The standards/protocols that apply to the interface


    ### 13c. Productization Requirements


    Content


    Any requirements that are necessary to make the product into a distributable or
    saleable item. It is also appropriate to describe the operations needed to install
    a software product successfully.


    Motivation


    To ensure that if work must be done to get the product out the door, then that
    work becomes part of the requirements. Also, to quantify the client''s and users''
    expectations about the amount of time, money, and resources they will need to
    allocate to install the product.


    Examples


    - The product shall be distributed as a ZIP file.

    - The product shall be able to be installed by an untrained user recourse to separately
    printed instructions.

    - The product shall be of a size such that it can fit on one CD.


    Considerations


    Some products have special needs to turn them into a saleable or usable product.
    You might consider that the product has to be protected that only paid-up customers
    can access it.

    Ask questions of your marketing department to discover unstated assumptions that
    have been made about the specified environment and the customers'' expectations
    of how long installation will take and how much it will cost.

    Most commercial products have needs in this area.


    ### 13d. Release Requirements


    Content


    Specification of the intended release cycle for the product and the form that
    the release shall take.


    Motivation


    To make everyone aware of how often you intend to produce new releases of the
    product.


    Examples


    - The maintenance releases will be offered to end users once a year.

    - Each release shall not cause previous features to fail.


    Fit Criterion


    Description of the type of maintenance plus the amount of effort budgeted for
    it.


    Considerations


    Do you have any existing commitments or maintenance agreements that might be affected
    by the new product?


    ## 14. Maintainability and Support Requirements


    ### 14a. Maintenance Requirements


    Content


    A quantification of the time necessary to make specified changes to the product.


    Motivation


    To make everyone aware of the maintenance needs of the product.


    Examples


    - New MIS reports must be available within one working week of the date when the
    requirements are agreed upon.

    - A new weather station must be able to be added to the system overnight.


    Considerations


    There may be special requirements for maintainability, such as that the product
    must be maintained by its end users or developers who are not the original developers.
    These requirements have an effect on the way that the product is developed. In
    addition, there may be requirements for documentation or training.


    You might also consider writing testability requirements in this section.


    ### 14b. Supportability Requirements


    Content


    This specifies the level of support that the product requires. Support is often
    provided via a help desk. If people provide support for the product, service is
    considered part of the product: Are there any requirements for that support? You
    might build support into the product itself, in which case this section is the
    place to write those requirements.


    Motivation


    To ensure that the support aspect of the product is adequately specified.


    Considerations


    Consider the anticipated level of support, and what forms it might take. For example,
    a constraint might state that there is to be no printed manual. Alternatively,
    the product might need to be entirely self-supporting.


    ### 14c. Adaptability Requirements


    Content


    Description of other platforms or environments to which the product must be ported.


    Motivation


    To publicise the client''s and users'' expectations about the platforms on which
    product will be able to run.


    Examples


    - The product is expected to run under Windows and Linux.

    - The product might eventually be sold in the Japanese market.

    - The product is designed to run in offices.


    Fit Criterion


    Specification of system software on which the product must operate.


    Specification of future environments in which product is expected to operate.


    Time allowed to make the transition.


    Considerations


    Question your marketing department to discover unstated assumptions that have
    been made about the portability of the product.


    ## 15. Security Requirements


    ### 15a. Access Requirements


    Content


    Specification of who is authorized to access the product (both functionality and
    data), under what circumstances access is granted, and to which parts of the product
    access is allowed.


    Motivation


    To understand the expectations for confidentiality aspects of the system.


    Examples


    - Only direct managers can see the personnel records of their staff.

    - Only holders of current security clearance can enter the building.


    Fit Criterion


    System function name or system data name.


    User roles and/or names of people who have clearance to access data.


    User roles and/or names of people who have clearance to add, change, delete data.


    Considerations


    Is there any data that management considers to be sensitive? Is there any data
    that low-level users do not want management have to? Are there any processes that
    might cause damage or might be used for personal gain? Are there any people who
    should not have access to the system?


    Avoiding how you would design a solution to the security requirements. For instance,
    don''t specify a password security. Your aim is to identify the security requirement;
    the design will come from the requirement.


    Consider asking for help. Computer security is a highly specialized field, and
    one where properly qualified people have no business. If your product has need
    of more than average security, we advise you to make use of a security consultant.
    Such consultants are not cheap, but the results of inadequate security can be
    even more expensive.


    ### 15b. Integrity Requirements


    Content


    Specification of the required integrity of databases and other files, and of the
    product itself.


    Motivation


    To understand the expectations for the integrity of the product''s data. To specify
    what the product will do to ensure its integrity in the case of unwanted such
    as attack from the outside or unintentional misuse by an authorized user.


    Examples


    - The product shall prevent incorrect data from being introduced.

    The product shall protect itself from intentional abuse.


    Considerations


    Organizations are relying more and more on their stored data. If this data should
    be corrupt or incorrect—or disappear—then it could be a fatal blow to the organization.
    For example, half of small businesses go bankrupt after a fire destroys their
    computer systems.

