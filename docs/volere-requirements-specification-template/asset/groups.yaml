    # Considerations


    The work environment: Is the product to operate in some unusual environment? Does
    this lead to special requirements? Also see section 11, Usability and Humanity
    Requirements.


    # 13b. Requirements for Interfacing with Adjacent Systems


    Content


    This section describes the requirements to interface with partner applications
    and/or devices that the product needs in order to successfully operate.


    Motivation


    Requirements for the interfaces to other applications often remain undiscovered
    until implementation time. Avoid a high degree of rework by discovering these
    requirements early.


    Examples


    +   * The products work on the last four releases of the five most popular browsers.


    +   * The new version of the spreadsheet must be able to access data from the
    previous two versions.


    +   * Our product must interface with the applications that run on the remote
    weather stations.


    Fit Criterion


    For each inter-application interface, specify the following elements:


    +   * The data content


    +   * The physical material content


    +   * The medium that carries the interface


    +   * The frequency


    +   * The volume


    +   * The trigger


    +   * The standards/protocols that apply to the interface


    # 13c. Productization Requirements


    Content


    Any requirements that are necessary to make the product into a distributable or
    saleable item. It is also appropriate to describe the operations needed to install
    a software product successfully.'
  - '[PAGE 57]


    # Motivation


    To ensure that if work must be done to get the product out the door, then that
    work becomes part of the requirements. Also, to quantify the client''s and users''
    expectations about the amount of time, money, and resources they will need to
    allocate to install the product.


    # Examples


    +   - The product shall be distributed as a ZIP file.

    - The product shall be able to be installed by an untrained user recourse to separately
    printed instructions.

    - The product shall be of a size such that it can fit on one CD.


    # Considerations


    Some products have special needs to turn them into a saleable or usable product.
    You might consider that the product has to be protected that only paid-up customers
    can access it.

    Ask questions of your marketing department to discover unstated assumptions that
    have been made about the specified environment and the customers'' expectations
    of how long installation will take and how much it will cost.

    Most commercial products have needs in this area.


    # 13d. Release Requirements


    # Content


    Specification of the intended release cycle for the product and the form that
    the release shall take.


    # Motivation


    To make everyone aware of how often you intend to produce new releases of the
    product.


    # Examples


    +   - The maintenance releases will be offered to end users once a year.

    - Each release shall not cause previous features to fail.


    # Fit Criterion


    Description of the type of maintenance plus the amount of effort budgeted for
    it.


    # Considerations


    Do you have any existing commitments or maintenance agreements that might be affected
    by the new product?'
