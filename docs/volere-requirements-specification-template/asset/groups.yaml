    # Motivation


    In many countries it is required that some products be made available to the disabled.
    In any event, it is self-defeating to exclude this sizable community of potential
    customers.


    # Examples


    - The product shall be usable by partially sighted users.

    - The product shall conform to the Americans with Disabilities Act.


    # Considerations


    Some users have disabilities other than the commonly known. In addition, some
    partial disabilities are fairly common. A simple, and not very consequential,
    example is that approximately 20 percent of males are red-green-blind.


    ## 12. Performance Requirements


    ### 12a. Speed and Latency Requirements


    ### Content


    Specifies the amount of time available to complete specified tasks. These requirements
    often refer to response times. They can also refer to the product''s ability to
    operate at a speed suitable for the intended environment.


    ### Motivation


    Some products—usually real-time products—must be able to perform some of their
    functionality within a given time slot. Failure to do so may mean catastrophic
    failure (e.g., a ground-sensing radar in an airplane to detect an upcoming mountain)
    or the product will not cope with the required volume of use (e.g., an automated
    ticket-selling machine).


    ### Examples


    - Any interface between a user and the automated system shall have a maximum response
    time of 2 seconds.

    - The response shall be fast enough to avoid interrupting the user''s flow of
    thought.

    - The product shall poll the sensor every 10 seconds.

    - The product shall download the new status parameters within 5 minutes of a change.


    ### Fit Criterion


    Fit criteria are needed when the description of the requirement is not quantified.
    However, we find that most performance requirements are stated in quantified terms.
    The exception is the second requirement shown above, for which the suggested fit
    criterion is:


    The product shall respond in less than 1 second for 90 percent of the interrogations.
    No response shall take longer than 2.5 seconds.


    ### Considerations


    There is a wide variation in the importance of different types of speed requirements.
    If you are working on a missile guidance system, then speed is extremely important.
    By contrast, an inventory control report that is once every six months has very
    little need for a lightning-fast response time.


    Customize this section of the template to give examples of the speed requirements
    that are important within your environment.


    ### 12b. Safety-Critical Requirements


    ### Content


    Quantification of the perceived risk of damage to people, property, and environment.
    Different countries have different standards, so the fit criteria must specify
    precisely which standards the product must meet.


    ### Motivation


    To understand and highlight the damage that could potentially occur when using
    the product within the expected operational environment.


    ### Examples


    - The product shall not emit noxious gases that damage people’s health.

    - The heat exchanger shall be shielded from human contact.


    ### Fit Criterion


    The product shall be certified to comply with the Health Department’s standard
    E110-98. It is to be certified by qualified testing engineers.


    No member of a test panel of [specified size] shall be able to touch the heat
    exchanger. The heat exchanger must also comply with safety standard [specify which
    one].


    ### Considerations


    The example requirements given here apply to some, but not all, products. It is
    not possible to give examples of every variation of safety-critical requirement.


    To make the template work in your environment, you should customize it by adding
    examples that are specific to your products.


    Also, be aware that different countries have different safety standards and laws
    relating to safety. If you plan to sell your product internationally, you must
    be aware of these laws. A colleague has suggested that for electrical products,
    if you follow the German standards, the largest number of countries will be supported.


    If you are building safety-critical systems, the relevant safety-critical standards
    are already well specified. You will likely have experts on your staff. These
    experts are the best source of the relevant safety-critical requirements for your
    type of product. They will almost certainly have copious information that you
    can use.


    Consult your legal department. Members of this department will be aware of the
    kinds of lawsuits that have resulted from product safety failure. This is probably
    the best starting place for generating relevant safety requirements.


    ### 12c. Precision or Accuracy Requirements


    ### Content


    Quantification of the desired accuracy of the results produced by the product.


    ### Motivation


    To set the client''s and users'' expectations for the precision of the product.


    ### Examples


    - All monetary amounts shall be accurate to two decimal places.

    - Accuracy of road temperature readings shall be within ±2°C.


    ### Considerations


    If you have done any detailed work on definitions, then some precision requirements
    might be adequately defined by definitions in the dictionary in section 7.


    You might consider which units the product is intended to use. Readers will recall
    the spacecraft that crashed on Mars when coordinates were sent as metric data
    rather than imperial data.


    The product might also need to keep accurate time, be synchronized with a time
    server, or work in UTC.


    Also, be aware that some currencies have no decimal places, such as the Japanese
    yen.


    ### 12d. Reliability and Availability Requirements


    ### Content


    This section quantifies the necessary reliability of the product. The reliability
    is usually expressed as the allowable time between failures, or the total allowable
    failure rate.


    This section also quantifies the expected availability of the product.


    ### Motivation


    It is critical for some products not to fail too often. This section allows you
    to explore the possibility of failure and to specify realistic levels of service.
    It also gives you the opportunity to set the client''s and users'' expectations
    about the amount of time that the product will be available for use.


    ### Examples


    - The product shall be available for use 24 hours per day, 365 days per year.

    - The product shall be available for use between the hours of 8:00 A.M. and 5:30
    P.M.

    - The escalator shall run from 6 A.M. until 10 P.M.

    - The product shall achieve 99 percent uptime.


    ### Considerations


    Consider carefully whether the real requirement for your product is that it is
    available for use or that it does not fail at any time.


    Consider also the cost of reliability and availability, and whether it is justified
    for your product.


    ### 12e. Robustness or Fault-Tolerance Requirements


    ### Content


    Robustness specifies the ability of the product to continue to function under
    abnormal circumstances.


    ### Motivation


    To ensure that the product is able to provide some or all of its services after
    or during abnormal happening.


    ### Examples


    - The product shall continue to operate in local mode whenever it loses its link
    to the central server.

    - The product shall provide 10 minutes of emergency operation should it become
    disconnected from the electricity source.


    ### Considerations


    Abnormal happenings can almost be considered normal. Today''s products are so
    large and complex that there is a good chance that at any time, one component
    will not be functioning correctly. Robustness requirements are intended to prevent
    total failure of the product.


    You could also consider disaster recovery in this section. This plan describes
    the ability of the product to re-establish acceptable performance after faults
    or abnormal happenings.


    ### 12f. Capacity Requirements


    ### Content


    This section specifies the volumes that the product must be able to deal with
    and the amount of data stored by the product.


    ### Motivation


    To ensure that the product is capable of processing the expected volumes.


    ### Examples


    - The product shall cater for 300 simultaneous users within the period from 9:00
    A.M. to 11:00 A.M. Maximum loading at other periods will be 150 simultaneous users.

    - During a launch period, the product shall cater for a maximum of 20 people to
    be in the inner chamber.


    ### Fit Criterion


    In this case, the requirement description is quantified, and thus can be tested.


    ### 12g. Scalability or Extensibility Requirements


    ### Content


    This specifies the expected increases in size that the product must be able to
    handle. As a business grows (or is expected to grow), our software products must
    increase their capacities to cope with the new volumes.

