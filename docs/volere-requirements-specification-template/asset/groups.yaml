    # 8c. 个体产品用例


    在这里你定义了你的 PUC 表中列出的单个产品用例 PC 的细节。你可以为你列表上的每个产品用例包含一个场景或模型。


    格式


    - *一个文本场景*（a text scenario）

    - *一个故事板*（a storyboard）

    - *低保真原型*（a low fi prototype）

    - *高保真原型*（a hi fi prototype）

    - 包括异常和替代方案的正式用例说明

    - 序列图、活动图、数据流图或任何你的项目组熟悉的其他类型的模型


    # 9. 功能性需求


    # 9a. 功能性需求


    内容


    这是每个原子功能性需求的规格书。对于所有类型的原子需求（功能性的、非功能性的、约束），使用需求外壳（requirements shell）作为指南，确定应该指定哪些属性。原子需求及其属性的完整说明包含在此模板的介绍材料中。


    动机


    规范由产品执行的详细功能性需求。


    # # 示例


    | 需求 #: 75 | 需求类型: 9 | 事件/BUC/PUC #: |

    | --- | --- | --- |

    | 描述: *产品应记录已处理的道路* | | |

    | 理由: *能够调度未处理的道路* | Arnold Snow - 总工程师 | |

    | 验收标准: *在30分钟内更新* | | |

    | 客户满意度: 5 | 客户不满意度: 5 |

    | 依赖关系: 所有 | 冲突: 10 |

    | 支持材料: 工作上下文 | | |

    | 历史记录: 创建于20 | |


    # # 验收标准


    每个需求都应该有一个验收标准或测试用例。在任何情况下，验收标准是判断产品符合需求的基。


    # # 注意事项


    如果你产生了用例列表（见 6c 和 8b），那么它可以帮助追溯到开发。注意，如果你尚未确定产品边界和用例（PUCs），则请编写功能性和非功能性需求。


    即使你使用原型，它也是为了发现需求的；它不应被认为是需求的替代品。


    # 格式


    用于记录和维护需求（功能性的、非功能性的）的格式取决于你拥有的工具。自动化形式是管理需求的最佳方式：


    - * 电子表格（随模板下载提供示例）

    - * 你使用的任何需求工具提供的数据库。市场上有很多工具，请参阅 http://www.volere.co.uk/tools 获取列表

    - * 你建立的内网，用于维护和访问原子需求及其属性

    - * 自定义的数据库


    无论你使用何种格式来记录和维护需求，在编号和术语上保持一致都是重要的，这样你就可以检查完整性并响应变化。


    # 非功能性需求


    下文 10-17 节描述了非功能性需求。这些需求的形式与上述所有功能性需求的形式相同。


    # 10. 外观与感受需求


    # 10a. 外观需求


    内容


    本节包含与产品精神相关的需求。客户可能对产品提出了特殊要求，例如企业品牌、使用的颜色等。本节捕获了外观的需求。在外观需求确定之前不要尝试进行设计。


    动机


    确保产品的外观符合组织的预期。


    示例


    - 产品应对青少年具有吸引力。

    - 产品应符合企业品牌标准。


    验收标准


    - 代表性的青少年样本在首次接触产品后四分钟内，在没有提示或诱导的情况下开始使用该产品。


    - 品牌办公室应证明产品符合当前标准。

