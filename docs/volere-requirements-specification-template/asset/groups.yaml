    ## 22a. 迁移到新产品的需求


    内容


    转换活动列表。实施时间表。


    ### 动机


    识别转换任务，作为项目规划过程的输入。


    ### 考虑因素


    你将使用分阶段实施来安装新系统吗？如果是，请描述每个主要阶段将实现哪些需求。


    需要什么类型的数据转换？是否必须编写特殊程序将数据从现有系统传输到新系统？如果是，请在此处描述这些程序的需求。


    在安装新系统期间，需要何种手动备份？


    每个主要组件何时到位？实施各阶段何时发布？


    是否需要让新产品与现有产品并行运行？我们是否需要额外的或不同的员工？


    废除旧产品需要任何特殊工作吗？


    本节是新系统的实施时间表。


    ### 格式


    开发任务、你的项目阶段与产品用例（Product Use Cases）及原子化需求（Atomic Requirements）之间的交叉引用。


    ## 22b. 新系统必须修改或翻译的数据


    内容


    数据翻译任务列表。


    ### 动机


    发现影响项目规模和边界的缺失任务。


    ### 考虑因素


    每当你向字典中添加内容时（见第7 节），请问这个问题：这些数据目前存储在何，新系统是否会影响该实现？


    ### 格式


    存储数据的当前技术描述。


    将存储数据的新技术描述。


    数据翻译任务的描述。


    可预的问题。


    ## 23. 风险


    所有项目都涉及风险——即可能出现问题的风险。风险并不一定是坏事，因为不承担某些风险就无法取得进展。只有当风险被忽视并变成问题时，它才是坏事。风险管理包括评估最可能适用于项目的风险，在这些风险变成问题时决定行动方案，以及监控项目以对变成问题提供早期预警。


    ### 内容


    规范的此部分包含了你的项目最可能且最严重的风险列表。对于每个风险，请包括其变成问题的概率以及任何应急计划。


    ### 动机


    发现并管理风险。


    ### 考虑因素


    风险在项目生命周期内无疑会发生。你对需求的越了解，就越能识别出哪些风险对你的项目最严重。项目经理决定如何管理风险，但需求专家和开发人员会对新风险以及哪些风险正在变成问题提供建议。


    利用你对需求的知识作为输入，发现哪些风险与你的项目最相关。使用 Volere 需求知识模型（包含在第16版的模板下载包中）作为识别相关风险的触发器。


    如果在风险变成问题时能包含其对进度和/或成本的影响，那么对项目管理也是有益的。


    作为替代方案，你可能倾向于识别出单一最大的风险——致命性风险（showstopper）。如果这个风险变成问题，项目将会失败。以这种方式识别单一风险可以将注意力集中在最关键的领域上。项目工作将集中在不让这种风险变成问题上。


    本书的这一节并不是对风险管理进行详尽论述。需求规范的此部分也不是作为适当风险管理的替代品。这里的目的是是将风险分配给需求，并清楚地表明需求不是免费的——它们带有成本，这种成本可以用金钱或时间表示，也可以用风险表示。以后，如果你需要对哪些需求应该给予更高的优先级做出选择，可以使用这些信息。


    ### 格式


    一个列表或日志。风险模型定义于：DeMarco, Tom, and Timothy Lister. *Waltzing with Bears: Managing
    Risk on Software Projects*. Dorset House, 2003。


    对于每个风险，包括其变成问题的概率。Jones 的 *Assessment and Control of Software Risks* (Prentice-Hall,
    Englewood Cliffs, N. J., 1994) 提供了风险及其概率的综合列表；你可以将这些列表作为起点。例如，Jones 引用了以下风险为最严重的：


    - 不准确的指标

    - 测量不足

    - 过度的进度压力

    - 管理不当

    - 成本估算不准确

    - 银弹综合症

    - 不断增加的用户需求

    - 低质量

    - 低生产率

    - 被取消的项目


    ## 24. 成本


    需求的其他成本是你为将它们构建到产品中而花费的金钱或精力。一旦需求规范完成，你就可以使用估算方法之一来评估成本，并将结果表示为构建所需的金额或时间。


    估算时没有最佳方法。重要的是使用与需求直接相关的指标来创建你的估算值。如果你按照我们描述的方式指定了需求，你将拥有以下指标：


    - 工作上下文（work context）上的输入和输出流数量

    - 业务事件数量

    - 产品用例数量

    - 功能需求数量

    - 非功能需求数量

    - 需求约束数量

    - 功能点数量


    你对需求的工作做得越详细，你的估算就越准确。你的成本估算是你估计每个交付物在你的环境中生产所需的资源量。你可以根据工作上下文创建非常早期的成本估算。在那个阶段，你对工作的知识是通用的，你应该通过将成本估算为一个范围而不是单一数字来反映这种模糊性。你可以使用这些指标作为估计时间、努力成本的基础。有关如何估算需求工作，请参考
    *Mastering the Requirements Process*, Addison Wesley, 2011。


    ### 附录 C 功能计数：简单介绍


    在现阶段告诉客户产品可能需要的成本是非常重要的。你通常将此金额表示为完成产品的总成本，但你可能发现指出需求工作的成本也是有利的。无论你做什么，不要让成本陷入歇斯底里的乐观主义。确保本节包含了关于交付物的有意义的数字。


    ## 25. 用户文档与培训


    本节规定了作为产品构建工作一部分产生的用户文档。这不是文档本身，而是对必须产生的内容描述。包含此描述的原因是建立客户的预期，并给你的可用性设计和用户一个评估建议的文档是否充分的机会。


    ## 25a. 用户文档需求


    内容


    作为产品一部分提供的用户文档列表。不要在已经定义的任何内容上浪费时间。记住，需求，特别是产品用例、原子化需求和数据定义为用户文档提供了输入。


    ### 动机


    为用户手册设定预期，并识别谁将负责创建它。


    ### 示例


    - 伴随产品的技术规范。

    - 用户手册。

    - 服务手册（如果技术规范中未涵盖）。

    - 应急程序手册（例如，飞机上找到卡片）。

    - 安装手册。


    ### 考虑因素


    你需要交付哪些文档，交付给谁？记住，这个问题的答案取决于你的组织流程和角色。对于每份文档，考虑以下问题：


    - 文档的目的

    - 使用该文档的人

    - 文档的维护


    期望什么种程度的文档？用户会参与文档的制作吗？谁负责保持文档的更新？文档将采用什么形式？


    '
