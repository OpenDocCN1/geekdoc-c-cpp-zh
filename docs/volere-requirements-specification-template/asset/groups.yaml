  mdcn: '


    在需求收集阶段是否出现了任何尚未解决的问题？你是否听过在你的上下文图中其他组织或系统可能发生的变化？是否有任何可能影响你系统的法律变更？关于你的硬件或软件供应商是否有任何可能产生影响的传言？


    # 格式


    一个包含以下内容的待解决问题列表：


    - 事项编号

    - 指向受影响需求的交叉引用（业务事件、BUC、PUC、原子化需求、字典定义）

    - 问题摘要

    - 涉及的利益相关者

    - 行动措施

    - 解决方案


    # 19. 现成解决方案


    本节查看了可行的解决方案，并总结了它们对需求的适用性。此讨论并非为了对替代方案进行全面的可行性研究，而是为了告诉客户，你已经考虑了一些替代方案，并确定了它们与产品匹配的程度。


    ## 19a. 成品产品


    ### 内容


    应作为潜在解决方案进行调查的现有产品列表。参考任何对这些产品进行过的调查报告。


    ### 动机


    考虑是否可以购买某种解决方案。


    ### 考虑因素


    你是否可以购买已经存在或即将推出的产品？在此阶段可能无法非常有把握地做出判断，但任何可能的产品都应该列在此处。


    还要考虑某些产品是禁止使用的。


    ## 19b. 可复用组件


    ### 内容


    描述项目可以使用的候选组件，可以是从外部购买的，也可以由贵公司构建。列出可以作为组件来源的库。


    ### 动机


    复用而非重复发明。


    ## 19c. 可以复制的产品


    ### 内容


    你可以合法复制或易于修改的其他相似产品或产品部分列表。


    ### 动机


    复用而非重复发明。


    ### 示例


    另一家电力公司建立了一个客户服务系统。它的硬件与我们的不同，但我们可以购买它的规格书，减少大约 60% 的分析工作量。


    ### 考虑因素


    虽然可能不存在现成的解决方案，但也许某些东西在本质上足够相似，以至于你可以复制并可能对其修改，以获得比从零开始更好的效果。这种方法具有潜在的危险性，因为它取决于基础系统的质量。


    这个问题应该始终被回答。回答这个问题的行为将迫使你查看其他类似问题的现有解决方案。


    ### 格式


    针对 19a、19b 和 19c 的每一项，列出你认为合适的替代方案。如果你的发现是初步的，请说明。添加近似成本、可用性、实施时间以及其他可能影响决策的因素是很有用的。


    # 20. 新问题


    ## 20a. 对当前环境的影响


    ### 内容


    新产品将如何影响当前实施环境的描述。本节还应涵盖新产品不应该做的事情。


    ### 动机


    意图是尽早发现任何在实施之前才可能实现的潜在冲突。


    ### 示例


    调度系统的任何更改都将影响部门工程师的工作和卡车司机员的工作。


    ### 考虑因素


    新系统可能会损坏某些现有系统吗？人们是否会被新系统取代或以其他方式影响？


    ### 格式


    这些问题需要对当前环境进行研究。一个突出变化影响的模型是让这些信息被广泛理解的好方法。


    ## 20b. 对已安装系统的影响


    ### 内容


    新系统与现有系统接口的规范。


    ### 动机


    很少有新开发是打算完全独立运行的。通常，新系统必须与某些旧系统共存。这个问题迫使你仔细查看现有系统，检查其与新开发项目之间潜在的冲突。


    ### 格式


    一个识别新旧系统之间接口的模型，并由接口的数据字典定义提供支持。接口也可能由原型或格式草图支持。


    ## 20c. 潜在的用户问题


    ### 内容


    现有用户可能遭受的任何不利反应的细节。


    ### 动机


    有时，现有用户使用产品的方式可能会导致他们受到新系统或新功能的负面影响。识别任何可能的负面反应，并确定我们是否关心这些反应，以及我们将采取哪些预防措施。


    ## 20d. 预期实施环境中可能抑制新产品的局限性


    ### 内容


    对新的自动化技术或组织结构的新方法任何潜在问题的陈述。


    ### 动机


    意图是尽早发现任何在实施之前才可能实现的潜在冲突。


    ### 示例


    - 计划的新服务器功率不足，无法应付我们预期的增长模式。

    - 新产品的尺寸和重量不符合物理环境。

    - 电源能力无法满足新产品的预期功耗。


    ### 考虑因素


    这需要对预期的实施环境进行研究。


    ## 20e. 后续问题


    ### 内容


    识别我们可能无法应对的情况。


    ### 动机


    防止产品可能失败的情况。


    ### 考虑因素


    我们是否会创造出我们无法服务的业务需求？新系统是否会导致我们违反目前不适用的法律？现有硬件能够应对吗？


    潜在存在成百个负面影响。非常仔细地回答这个问题是有价值的。


    # 21. 任务


    交付产品需要采取哪些步骤？本节强调了构建产品所需的精力、购买解决方案所需的步骤、修改和安装现成解决方案的精力量等。


    ## 21a. 项目计划


    ### 内容


    将用于交付产品的生命周期和方法的细节。


    ### 动机


    指定交付产品将采用的方法，以便所有人有相同的预期。


    ### 考虑因素


    根据你的流程的成熟程度，新产品将使用标准方法开发。然而，某些情况对于特定产品是独特的，将导致生命周期发生变化。如果可能，根据已有的需求为每个任务所需的时间和资源提供估算。不要忘记与数据转换、用户培训和切换相关的问题。这些在设定实施日期时通常会被忽略。


    ### 格式


    一个高层流程图或显示任务及其之间接口的任务列表是传递此类信息的好方法。在这里，你还可以确定你意图最大化敏捷性的策略。


    ## 21b. 开发阶段计划


    ### 内容


    开发每个阶段以及运行环境中组件的规范。


    ### 动机


    识别实施新系统运行环境所需的阶段，以便管理实施。


    ### 考虑因素


    识别新系统每个阶段所需的哪些硬件和其他设备。此列表在需求过程中可能是未知的，因为这些设备可能在设计阶段确定。


    ### 格式


    这通常是图表和文本的混合。对于项目的每个阶段：阶段名称。交付给用户的价值/收益。要求的日期。包含的运行环境组件。包含的功能需求。包含的非功能性需求。


    # 22. 迁移到新产品


    当你安装新产品时，总要进行一些工作才能成功运行。例如，数据库通常需要转换。通常有新的数据需要收集、程序需要转换，以及许多步骤步骤确保成功过渡到新产品。


    通常会有时期并行运行旧产品和新产品，直到新产品证明其运行正常。规范的这一部分是你识别过渡期所需任务的地方。该部分是项目计划过程的输入。


