    To build a system that complies with the appropriate audit rules.


    Considerations


    This section may have legal implications. You are advised to seek the approval
    of your organization''s auditors regarding what you write here.


    You should also consider whether the product should retain information on who
    has used it. The intention is to provide security such that a user may not later
    deny having used the product or participated in some form of transaction using
    the product.


    # 15e. Immunity Requirements


    Content


    The requirements for what the product has to do to protect itself from infection
    by unauthorized or undesirable software programs, such as viruses, worms, spyware
    and any other undesirable interference.


    Motivation


    To build a product that is as secure as possible from malicious interference.


    Considerations


    Each day brings more malevolence from the unknown, outside world. People buying
    software, or any other kind of product, expect that it can protect itself from
    outside interference.


    # 16. Cultural Requirements


    # 16a. Cultural Requirements


    Content


    This section contains requirements that are specific to the sociological factors
    that affect the acceptability of the product. If you are developing a product
    for foreign markets, then these requirements are particularly relevant.'
  - '[PAGE 63]


    # Motivation


    To bring out the open requirements that are difficult to discover because they
    are outside the cultural experience of the developers.


    # Examples


    +   - The product shall not be offensive to religious or ethnic groups.

    - The product shall be able to distinguish between French, Italian, and British
    road-numbering systems.

    - The product shall keep a record of public holidays for all countries in the
    European Union and for all states in the United States.


    # Considerations


    Consider whether the product is intended for a culture other than the one which
    you are familiar. Ask people in other countries or in other types of organizations
    will use the product. Do these people have different habits, holidays, superstitions,
    or cultural norms that do not apply to your own culture? Are there colours, icons,
    measurement units or words that have different meanings in another cultural environment?
    If your reaction to a requirement is – rather odd/unusual/weird then likely you
    have a cultural requirement.


    # 17. Legal Requirements


    # 17a. Compliance Requirements


    # Content


    A statement specifying the legal requirements for this system.


    # Motivation


    To comply with the law so as to avoid later delays, lawsuits, and legal fees.


    # Examples


    +   - Personal information shall be implemented so as to comply with the Data
    Protection Act.


    # Fit Criterion


    Lawyers’ opinion that the product does not break any laws.


    # Considerations


    Consider consulting lawyers to help identify the legal requirements.'
  - '[PAGE 64]


    Are there any copyrights or other intellectual property that must be protected?
    Conversely, do any competitors have copyrights on which you might be in danger
    of infringing?


    Is it a requirement that developers have not seen competitors’ code or even have
    worked for competitors?


    The Sarbanes-Oxley (SOX) Act, the Health Insurance Portability and Accountability
    Act (HIPAA) and the Gramm-Leach-Bliley Act may have implications for you. Check
    with your company lawyer.


    Might any pending legislation affect the development of this system? Are there
    any aspects of criminal law you should consider?


    Have you considered the tax laws that affect your product?


    Are there any labour laws (e.g., working hours) relevant to your product?


    # 17b. Standards Requirements


    # Content


    A statement specifying applicable standards and referencing detailed standards
    descriptions. This does not refer to the law of the land—think of it as an internal
    law imposed by your company or by your industry.


    # Motivation


    To comply with standards so as to avoid later delays.


    # Example


    +   - The product shall comply with MilSpec standards.

    - The product shall comply with insurance industry standards.

    - The product shall be developed according to SSADM development steps.


    # Criterion


    The appropriate standard-keeper certifies that the standard has been adhered to.


    # Considerations


    It is not always apparent that there are applicable standards because their existence
    is often taken for granted. Consider the following:


    +   - Do any industry bodies have applicable standards?

    - Does the industry have a code of practice, watchdog, or ombudsman?

    - Are there any special development steps for this type of product?'
  - '[PAGE 65]


    # Project Issues


    The following sections 18-27 contain issues that must be faced if the requirements
    are to be met and the product to become a reality. These sections also connect
    the requirements with the project activities that discover and progress the requirements.
    If you are using a consistent language for communicating requirements then project
    managers can use the requirements as input to steering the project. The Volere
    Requirements Knowledge Model (included with the download of Version 16 of the
    template) provides the basis for a requirements common language by identifying
    classes of requirements knowledge and the relationships between them. Each of
    the classes of knowledge is cross-referenced to sections in this template.


    # 18. Open Issues


    Issues that have been raised and do not yet have a conclusion.


    Content


    A statement of factors that are uncertain and might make significant difference
    to the product.


    Motivation


    To bring out in the open and provide objective input to risk analysis.


    Examples


    Our investigation into whether the new version of the processor will be suitable
    for our application is not yet complete.


    The government is planning to change the rules about who is responsible for gritting
    the motorways, but we do not know what those changes might be.


    The feasibility study to determine whether to use the Regional Weather Center''s
    online database is not yet complete. This issue affects how we should handle the
    weather data.


    Planned changes to working hours for drivers may affect the way that trucks are
    scheduled and the length of the routes that are permitted to travel. The changes
    are still in the proposal stage; details will be available by the end of the year


    Considerations


    When you are probing the user''s business, questions often come to the surface,
    and for the moment they cannot be answered. Similarly, as you are gathering the
    requirements for a future product, it may well be that your stakeholders are unsure
    of how the work should be done in the future. Are'
- md: '

    there there any issues that have come up from the requirements gathering that
    have not yet been resolved? Have you heard of any changes that might occur in
    the other organizations or systems on your context diagram? Are there any legislative
    changes that might affect your system? Are there any rumours about your hardware
    or software suppliers that might have an impact?


    # Form


    A list of open issues containing:


    - Issue Number

    - Cross reference to affected requirements (Business Events, BUCs, PUCs, Atomic
    Requirements, Dictionary Definitions)

    - Summary of the issue

    - Stakeholders involved

    - Action

    - Resolution


    # 19. Off-the-Shelf Solutions


    This section looks at available solutions and summarizes their applicability to
    the requirements. This discussion is not intended to be a full feasibility study
    of the alternatives, but it tells your client that you have considered some alternatives
    and determined how closely they match the product.


    ## 19a. Ready-Made Products


    ### Content


    List of existing products that should be investigated as potential solutions.
    Reference any surveys that have been done on these products.


    ### Motivation


    To give consideration to whether a solution can be bought.


    ### Considerations


    Could you buy something that already exists or is about to become available? It
    may not be possible at this stage to make this determination with a lot of confidence,
    but any likely products should be listed here.


    Also consider whether some products must not be used.


    ## 19b. Reusable Components


    ### Content


    Description of the candidate components, either bought from outside or built by
    your company, which could be used by this project. List libraries that could be
    a source of components.


    ### Motivation


    Reuse rather than reinvention.


    ## 19c. Products That Can Be Copied


    ### Content


    List of other similar products or parts of products that you can legally copy
    or easily modify.


    ### Motivation


    Reuse rather than reinvention.


    ### Examples


    Another electricity company has built a customer service system. Its hardware
    is different from ours, but we could buy its specification and cut our analysis
    effort by approximately 60 percent.


    ### Considerations


    While a ready-made solution may not exist, perhaps something, in its essence,
    is similar enough that you could copy, and possibly modify, it to better effect
    than starting from scratch. This approach is potentially dangerous because it
    relies on the base system being of good quality.


    This question should always be answered. The act of answering it will force you
    to look at other existing solutions to similar problems.


    ### Form


    For each of 19a, 19b, and 19c, set out the alternatives that you think suitable.
    If your findings are preliminary, then say so. It is useful to add approximate
    costs, availability, time to implement, and other factors that may have a bearing
    on the decision.


    # 20. New Problems


    ## 20a. Effects on the Current Environment


    ### Content


    A description of how the new product will affect the current implementation environment.
    This section should also cover things that the new product should not do.


    ### Motivation


    The intention is to discover early any potential conflicts that might otherwise
    not be realized until implementation time.


    ### Examples


    Any change to the scheduling system will affect the work of the engineers in the
    divisions and the work of the truck drivers.


    ### Considerations


    Is it possible that the new system might damage some existing system? Can people
    be displaced or otherwise affected by the new system?


    ### Form


    These issues require a study of the current environment. A model highlighting
    the effects of the change is a good way to make this information widely understandable.


    ## 20b. Effects on the Installed Systems


    ### Content


    Specification of the interfaces between new and existing systems.


    ### Motivation


    Rare rarely a new development intended to stand completely alone. Usually the
    new system must coexist with some older system. This question forces you to look
    carefully at the existing system, examining it for potential conflicts with the
    new development.


    ### Form


    A model identifying the interfaces between the new and existing systems supported
    by data dictionary definitions of the interfaces. The interfaces might also be
    supported by prototypes or sketches of format.


    ## 20c. Potential User Problems


    ### Content


    Details of any adverse reaction that might be suffered by existing users.


    ### Motivation


    Sometimes existing users are using a product in such a way that they will suffer
    ill effects from the new system or feature. Identify any likely adverse reactions,
    and determine whether we care about those reactions and what precautions we will
    take.


    ## 20d. Limitations in the Anticipated Implementation Environment That May Inhibit
    the New Product


    ### Content


    Statement of any potential problems with the new automated technology or new ways
    of structuring the organization.


    ### Motivation


    The intention is to make early discovery of any potential conflicts that might
    otherwise not be realized until implementation time.


    ### Examples


    - The planned new server is not powerful enough to cope with our projected growth
    pattern.

    - The size and weight of the new product do not fit into the physical environment.

    - The power capabilities will not satisfy the new product''s projected consumption.


    ### Considerations


    This requires a study of the intended implementation environment.


    ## 20e. Follow-Up Problems


    ### Content


    Identification of situations that we might not be able to cope with.


    ### Motivation


    To guard against situations where the product might fail.


    ### Considerations


    Will we create a demand for our product that we are not able to service? Will
    the new system cause us to run afoul of laws that do not currently apply? Will
    the existing hardware cope?


    There are potentially hundreds of unwanted effects. It pays to answer this question
    very carefully.


    # 21. Tasks


    What steps have to be taken to deliver the product? This section highlights the
    effort required to build the product, the steps needed to buy a solution, the
    amount of effort to modify and install a ready-made solution, and so on.


    ## 21a. Project Planning


    ### Content


    Details of the life cycle and approach that will be used to deliver the product.


    ### Motivation


    To specify the approach that will be taken to deliver the product so that everyone
    has the same expectations.


    ### Considerations


    Depending on the maturity level of your process, the new product will be developed
    using your standard approach. However, some circumstances are unique to a particular
    product and will necessitate changes to your life cycle. While these considerations
    are not product requirements, they are needed if the product is to be developed.


    If possible, attach an estimate of the time and resources needed for each task
    based on the requirements that you have. Do not forget issues related to data
    conversion, user training, and cutover. These are usually ignored when projects
    set implementation dates.


    ### Form


    A high-level process diagram or a task list showing the tasks and the interfaces
    between them is a good way to communicate this information. Here you can also
    identify the strategy that you intend to maximise your potential for agility.


    ## 21b. Planning of the Development Phases


    ### Content


    Specification of each phase of development and the components in the operating
    environment.


    ### Motivation


    To identify the phases necessary to implement the operating environment for the
    new system so that the implementation can be managed.


    ### Considerations


    Identify which hardware and other devices are necessary for each phase of the
    new system. This list may not be known at the time of the requirements process,
    as these devices may be decided at design time.


    ### Form


    This is usually a mixture of diagrams and text. For each phase of the project:
    Name of the phase. Value/benefit of delivery to user. Required operational date.
    Operating environment components included. Functional requirements included. Non-functional
    requirements included.


    # 22. Migration to the New Product


    When you install a new product, some things always have to be done before it can
    work successfully. For example, databases often have to be converted. There is
    usually new data to be collected, procedures to be converted, and many other steps
    to ensure the successful transition to the new product.


    Often there are periods where the organization will run both the old product and
    the new product in parallel until the new one has proven that it is functioning
    correctly. This section of the specification is where you identify the tasks necessary
    for the period of transition to the new product. This section is input to the
    project planning process.

