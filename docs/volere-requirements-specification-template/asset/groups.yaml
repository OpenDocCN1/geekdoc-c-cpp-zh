    ## 7. 业务数据模型与数据字典


    ### 7a. 业务数据模型


    ### 内容


    对产品相关的核心主题、业务对象、实体和类的规范。它可能以初步模型、实体关系模型或任何其他类型的数据模型的形式存在。


    ### 动机


    明确系统的主题内容，从而引发对尚未考虑的需求的识别。你可以通过使用“创建、引用、更新、删除（CRUD）”表交叉检查数据模型和事件来发现需求。数据模型是对所有与工作范围相关的业务数据的规范说明。


    ### 示例


    这是一个使用统一建模语言（UML）类模型表示法描述的业务系统业务主题的模型。这些是所研究工作范围内的流程所创建、引用、更新和删除的所有数据。关于工作范围的更多信息，请参阅第
    6 节。


    | 区域 | | 道路 | 1 | 路段 | | 卡车 |

    | --- | --- | --- | --- | --- | --- | --- |

    | | * | * | | | | |

    | | * | | | | * | |

    | | | | | 1 | | 1 |

    | 预测 | | 温度读数 | * | 1 | 天气站 | 仓库 |


    每个矩形代表一类业务数据。该类的属性在数据字典中定义。


    例如：区域 (District) = *由议会定义的地理区域*


    区域名称 + 区域尺寸 + 区域坐标


    同样，每个属性在字典中也有定义，例如：区域名称 (District Name) = *工程师识别区域时使用的名称*

    你可以使用任何类型的数据或类模型来捕获这些知识。问题在于捕获业务主题的含义以及各个部分之间的连接，并证明你在项目内部是一致的。如果你有既定的公司标准符号，请使用它，因为这将帮助你在这不同项目之间复用知识。


    更多关于数据模型的示例，请参阅与此需求模板下载包一同提供的示例规范。


    ## 考虑因素


    是否存在针对相似或重叠系统的数据或对象模型可以作为一个有用的起点？对于该系统处理的主题是否存在领域模型？


    ## 格式


    有许多类型的数据模型可以对业务数据进行建模。你最可能遇到的是：


    - UML 类模型

    - 鸟脚图

    - 实体关系图

    - 显示以下内容的表格：类名、类之间的关系、每个类的属性。


    如果你的组织偏好某种特定模型，你必须使用该模型。重要的是，你构建的数据模型是一个业务数据模型，而不是数据库设计。你的模型关注的是通过对工作语境内的所有数据进行逻辑划分，以及这些业务类之间必要的业务关系，来识别业务类。你的模型被用作设计如何实现数据的输入。每个业务类中属性的定义位于数据字典中（见第
    7b 节）。


    ## 7b. 数据字典


    模板第 4 节早早描述的术语表是建立术语共同理解的起点。当你开始定义调查范围时，要在正式的数据字典中定义数据输入和输出。你在该字典中定义的术语（甚至精确到元素级）与你在定义详细原子化需求时使用的术语是相同的。


    ### 内容


    数据字典规定了以下内容：


    - 数据模型上的类

    - 类的属性

    - 类之间的关系

    - 所有模型上的输入和输出

    - 输入输出输出数据元素


    当做出实现决策时，应将接口的技术规范添加到字典中。


    ### 动机


    工作上下文图提供了对所研究工作范围的准确定义，而产品范围图（见第 8a 和 8b 节）定义了边界。你在字典中定义的术语（精确到元素级）与你在定义详细原子化需求时使用的术语是相同的。


    ### 示例


    以下是针对所研究项目的部分数据字典，注意此版本的字典按字母顺序排序。当做出实现决策时，应将实施的格式添加到字典中。


    | 名称 | 内容 | 类型 |

    |---|---|---|

    | 仓库 (Depot) | 仓库标识 | 类 |

    | 区域 (District) | 区域名称 + 区域尺寸 | 类 |

    | 预测 (Forecast) | 温度预测 + 预测时间 | 类 |

    | 道路 (Road) | 道路名称 + 道路编号 | 类 |

    | 路段 (Road Section) | 路段标识 + 坐标 | 类 |

    | 温度读数 (Temperature Reading) | 读数时间 + 温度测量 | 类 |

    | 卡车 (Truck) | 卡车标识 | 类 |

    | 道路除冰计划 (Road Deicing Schedule) | {路段标识 + 计划执行时间 + 关键开始时间 + 卡车标识} | 数据流 |

    | 区域名称 (District Name) | *由议会定义的地理区域* | 元素 |

    | 区域尺寸 (District Size) | *单位公里* | 元素 |

    | 温度预测 (Forecast Temperature) | *摄氏度* | 元素 |

    | 预测时间 (Forecast Time) | *24小时制* | 元素 |

    | 读数时间 (Reading Time) | *24小时制* | 元素 |

    | 道路名称 (Road Name) | *参见数据库* | 元素 |

    | 道路编号 (Road Number) | *参见数据库* | 元素 |

    | 路段 (Road Section) | *参见数据库* | 元素 |

    | 路段标识 (Road Section Identifier) | *参见数据库* | 元素 |

    | 温度测量 (Temperature Measurement) | *摄氏度* | 元素 |

    | 计划执行时间 (Treatment Scheduled Date) | *年-月-日* | 元素 |

    | 开始开始时间 (Treatment Start Time) | *24小时制* | 元素 |

    | 关键开始时间 (Critical Start Time) | *在此时间之后开始的处理不保证有效* | 元素 |

    | 卡车标识 (Truck Identifier) | *1到1000之间的数字。咨询首席工程师获取列表* | 元素 |


    ## 考虑因素


    字典提供了需求人员/业务分析师与设计/开发/实施人员之间的联系。实施人员为字典中的术语添加实现细节，定义如何实现数据。此外，实施人员还会添加由于所选技术而存在且与业务需求无关的术。


    当你研究工作时，可能会发现放在命名规范和术语（第 4 节）中的项实际上是特定的数据流或属性数据。发生这种情况时，你应该将该项转移到数据字典。


    ## 格式


    数据字典根据你手中的工具以多种形式维护。重要的是尽可能方便将需求、文档和模型中的术语使用与字典中的定义进行交叉引用。维护数据字典的常见形式是表格、数据库和自动化需求工具。


    ## 8. 产品范围


    ### 8a. 产品边界


    用例图识别了用户（角色）与产品之间的边界。你通过检查每个业务用例，并与相关利益相关者共同确定业务用例的哪些部分应该自动化（或由某种产品满足），哪些部分应该由用户或其他产品完成，从而得出产品边界。这项任务必须考虑用户的能力。


