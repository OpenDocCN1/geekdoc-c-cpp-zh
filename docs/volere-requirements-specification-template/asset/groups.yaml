    Content


    This section contains requirements that are specific to the enterprise that is
    making the investment in your project.


    Motivation


    To understand requirements that sometimes appear irrelevant or irrational because
    they are not obviously relevant to the goals of the project.


    Examples


    +   * The product shall be installed using only American-made components.

    * The product shall make all functionality available to the CEO.


    Considerations


    Did you intend to develop the product on a Macintosh, when the office manager
    has laid down an edict that only Windows machines are permitted?'
