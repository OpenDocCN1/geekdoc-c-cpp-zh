    ## 7. Business Data Model and Data Dictionary


    ### 7a. Business Data Model


    ### Content


    A specification of the essential subject matter, business objects, entities, and
    classes that are to the product. It might take the form of a first-cut model,
    an entity-relationship model, or any other kind of data model.


    ### Motivation


    To clarify the system''s subject matter, thereby triggering recognition of requirements
    not yet considered. To discovering requirements you can cross the data model and
    the events using a Create, Reference, Update, Delete (CRUD) table. The data model
    is a specification for all of the business data that is relevant to the scope
    of the work.


    ### Example


    This is a model of the business system''s business subject matter using the Unified
    Modelling Language (UML) class model notation. This is all the data that is Created,
    Referenced, Updated and Deleted by processes within the scope of the work being
    studied. See section 6 for more about the scope of the work.


    | District | | Road | 1 | Road Section | | Truck |

    | --- | --- | --- | --- | --- | --- | --- |

    | | * | * | | | | |

    | | * | | | | * | |

    | | | | | 1 | | 1 |

    | Forecast | | Temperature Reading | * | 1 | Weather Station | Depot |


    Each of the rectangles represents a class of business data. The attributes of
    that class are defined in the data dictionary.


    e.g.: District = *A geographical area defined by the council*


    District Name + District Size + District Co-ordinates


    Similarly, each attribute is also defined in the dictionary e.g. District Name
    = *The name used by the engineers to identify a district*

    You can use any type of data or class model to capture this knowledge. The issue
    is to capture the meaning of the business subject matter and the connections between
    the individual parts, and to show that you are consistent within your project.
    If you have an established company standard notation, use that, as it will help
    you to reuse knowledge between projects.


    For more examples of data models look at the example specifications that are packaged
    with the download of this requirements template.


    ## Considerations


    Are there any data or object models for similar or overlapping systems that might
    be a useful starting point? Is there a domain model for the subject matter dealt
    with this system?


    ## Form


    There are many types of data models that you can use to model the business data.
    The ones you are most likely to come across are:


    - UML class model

    - Crow’s foot diagrams

    - Entity Relationship diagrams

    - A table showing: Class Name, Relationships between classes, Attributes for each
    class.


    If your organization prefers a particular model then you must use that one. The
    important thing is that the data model you build is a business data model, not
    a design for a database. Your model is concerned with identifying business classes
    by making a logical partitioning of all the data within the work context and the
    necessary business relationships between those business classes. Your model is
    used as input to designing how the data will be implemented. The definitions of
    the attributes in each business class is in the data dictionary (see section 7b).


    ## 7b. Data Dictionary


    The glossary described earlier in section 4 of the template is the starting point
    for establishing common understanding of terminology. As you start to define the
    scope of the investigation you define the data inputs and outputs in a formal
    data dictionary. The terms that you define in this dictionary, right down to elemental
    level, are the same terms that you use when defining detailed atomic requirements.


    ### Content


    The data dictionary specifies the content of:


    - Classes on the data model

    - Attributes of the classes

    - Relationships between the classes

    - Inputs and Outputs on all models

    - Elements of data within the Inputs and Outputs


    When implementation decisions are made the technical specifications for the interfaces
    should be added to the dictionary.


    ### Motivation


    The work context diagram provides an accurate definition of the scope of the work
    being studied and the product scope diagram (See Sections 8a & 8b) defines the
    boundary of the product to be built. These definition can be completely accurate
    only if the information flows bordering the scope have their attributes defined.


    ### Examples


    The following is a partial data dictionary for the road de-icing project we have
    been using as an example in this template. Note that this version of the dictionary
    is sorted alphabetically within Type.


    When implementation decisions are essentially made the format of the data is added
    to the dictionary by the designers/implementors.


    | Name | Content | Type |

    |---|---|---|

    | Depot | Depot Identifier | Class |

    | District | District Name + District Size | Class |

    | Forecast | Forecast Temperature + Forecast Time | Class |

    | Road | Road Name + Road Number | Class |

    | Road Section | Road Section Identifier + Road Coordinates | Class |

    | Temperature Reading | Reading Time + Temperature Measurement | Class |

    | Truck | Truck Identifier | Class |

    | Road De-Icing Schedule | {Road Section Identifier + Treatment Scheduled Date
    + Treatment Start Time + Critical Start Time + Truck Identifier} | Dataflow |

    | District Name | *Listed in District Catalogue* | Attribute/Element |

    | District Size | *Measured in Kilometres* | Attribute/Element |

    | Forecast Temperature | *Measured in Celsius* | Attribute/Element |

    | Forecast Time | *HH/MM/SS 24 hour clock* | Attribute/Element |

    | Reading Time | *HH/MM/SS 24 hour clock* | Attribute/Element |

    | Road Name | *See Road Database* | Attribute/Element |

    | Road Number | *See Road Database* | Attribute/Element |

    | Road Section | *See Road Database* | Attribute/Element |

    | Road Section Identifier | *See Road Database* | Attribute/Element |

    | Temperature Measurement | *Measured in Celsius* | Attribute/Element |

    | Treatment Scheduled Date | *YY/MM/DD* | Attribute/Element |

    | Treatment Start Time | *HH/MM/SS 24 hour clock* | Attribute/Element |

    | Truck Identifier | *Number between 1 and 1000. Refer to Chief Engineer for list*
    | Attribute/Element |

    | Critical Start Time | *Treatment started after this time is not guaranteed to
    be effective* | Attribute/Element |

    | Treatment Scheduled Date | *YY/MM/DD* | Attribute/Element |

    | Treatment Start Time | *HH/MM/SS 24 hour clock* | Attribute/Element |


    ## Considerations


    The dictionary provides a link between the requirements/business analysts and
    the designers/developers/implementers. The implementers add implementation details
    to the terms in the dictionary, defining how the data will be implemented. Also,
    implementers add terms that are present because of the chosen technology and are
    independent of the business requirements.


    As you study the work you discover that an entry you put in the Naming Conventions
    and Terminology (section 4) turns out to be a specific flow of data or an attribute
    data. When this happens you should transfer the entry to the data dictionary.


    ## Form


    The data dictionary is maintained in a variety of forms, depending on the tools
    that you have at your disposal. The important issue is that you make it as easy
    as possible to cross reference the use of terms in requirements, documents and
    models with their definitions in the dictionary. Common forms for maintaining
    the data dictionary are spreadsheets, databases and automated requirements tools.


    ## 8. The Scope of the Product


    ### 8a. Product Boundary


    A use case diagram identifies the boundaries between the users (actors) and the
    product. You arrive at the product boundary by inspecting each business use case
    and determining, in conjunction with the appropriate stakeholders, which part
    of the business use case should be automated (or satisfied by some sort of product)
    and what part should be done by the user or some other product. This task must
    take into account the abilities of the users/actors.

