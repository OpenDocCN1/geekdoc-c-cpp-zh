    # # 14. Maintainability and Support Requirements


    # ## 14a. Maintenance Requirements


    Content


    A quantification of the time necessary to make specified changes to the product.


    Motivation


    To make everyone aware of the maintenance needs of the product.


    Examples


    +   - New MIS reports must be available within one working week of the date when
    the requirements are agreed upon.


    +   - A new weather station must be able to be added to the system overnight.


    Considerations


    There may be special requirements for maintainability, such as that the product
    must be be maintained by its end users or developers who are not the original
    developers. These requirements have an effect on the way that the product is developed.
    In addition, there may be requirements for documentation or training.


    You might also consider writing testability requirements in this section.


    # ## 14b. Supportability Requirements


    Content


    This specifies the level of support that the product requires. Support is often
    provided via a help desk. If people provide support for the product, service is
    considered part of the product: Are there any requirements for that support? You
    might build support into the product itself, in which case this section is the
    place to write those requirements.


    Motivation


    To ensure that the support aspect of the product is adequately specified.


    Considerations


    Consider the anticipated level of support, and what forms it might take. For example,
    a constraint might state that there is to be no printed manual. Alternatively,
    the product might need to be entirely self-supporting.'
  - '[PAGE 59]


    # 14c. Adaptability Requirements


    Content


    Description of other platforms or environments to which the product must be ported.


    Motivation


    To publicise the client''s and users'' expectations about the platforms on which
    the product will be able to run.


    Examples


    +   - The product is expected to run under Windows 7 and Linux.

    - The product might eventually be sold in the Japanese market.

    - The product is designed to run in offices, but we intend to have a version running
    in restaurant kitchens.


    Fit Criterion


    Specification of system software on which the product must operate.


    Specification of future environments in which the product is expected to operate.


    Time allowed to make the transition.


    Considerations


    Question your marketing department to discover unstated assumptions that have
    been made about the portability of the product.


    # 15. Security Requirements


    # 15a. Access Requirements


    Content


    Specification of who is authorized to access to the product (both functionality
    and data), under what circumstances that access is granted, and to which parts
    of the product access is allowed.


    Motivation


    To understand the expectations for confidentiality aspects of the system.


    Examples


    +   - Only direct managers can see the personnel records of their staff.

    - Only holders of a current security clearance can enter the building.'
  - '[PAGE 60]


    # Fit Criterion


    System function name or system data name.


    User roles and/or names of people who have clearance to access specified data.


    User roles and/or names of people who have clearance to add, change, delete specified
    data.


    # Considerations


    Is there any data that management considers to be sensitive? Is there any data
    that low-level users do not want management have access to? Are there any processes
    that might cause damage or might be used for personal gain? Are there any people
    who should not have access to the system?


    Avoiding how you would design a solution to the security requirements. For instance,
    don''t specify a password security. Your aim is to identify the security requirement;
    the design will come from the requirement.


    Consider asking for help. Computer security is a highly specialized field, and
    one where properly qualified people have no business. If your product has need
    of more than average security, we advise you to make use of a security consultant.
    Such consultants are not cheap, but the results of inadequate security can be
    even more expensive.


    # 15b. Integrity Requirements


    # Content


    Specification of the required integrity of databases and other files, and of the
    product itself.


    # Motivation


    To understand the expectations for the integrity of the product''s data. To specify
    what the product will do to ensure its integrity in the case of unwanted happening
    such as attack from the outside or unintentional misuse by an authorized user.


    # Examples


    +   - The product shall prevent incorrect data from being introduced.

    The product shall protect itself from intentional abuse.


    # Considerations


    Organizations are relying more and more on their stored data. If this data should
    be corrupt or incorrect—or disappear—then it could be a fatal blow to the organization.
    For example, half of small businesses go bankrupt after a fire destroys their
    computer systems. Integrity requirements'
- md: '

    are aimed at preventing complete loss, as well as corruption, of data and processes.


    ## 15c. Privacy Requirements


    Content


    Specification of what the product has to do to ensure the privacy of individuals
    about whom it stores information. The product must also ensure that all laws related
    to privacy of an individual''s data are observed.


    Motivation


    To ensure that the product complies with the law, and to protect the individual
    privacy of your customers. Few people look kindly on organizations that do not
    observe their privacy.


    Examples


    - The product shall make its users aware of its information practices before collecting
    data from them.

    - The product shall notify customers of changes to its information policy.

    - The product shall reveal private information only in compliance with the organization''s
    information policy.

    - The product shall protect private information in accordance with the relevant
    privacy laws and the organization''s information policy.


    Considerations


    Privacy issues may have well legal implications, and you are advised to consult
    with your organization''s legal department about the requirements to be written
    in this section.


    Consider what notices you must issue to your customers before collecting their
    personal information. Also, do you have to do anything to keep customers that
    you hold their personal information?


    Customers must always be in a position to give or withhold consent when their
    private data is collected or stored. Similarly, customers should be able to view
    any private data and, where appropriate, correct or ask for correction of the
    data.


    Also consider the integrity and security of private data—for example, when you
    are storing credit card information.


    ## 15d. Audit Requirements


    Content


    Specification of what the product has to do (usually retain records) to permit
    the required audit checks.


    Motivation


    To build a system that complies with the appropriate audit rules.


    Considerations


    This section may have legal implications. You are advised to seek the approval
    of your organization''s auditors regarding what you write here.


    You should also consider whether the product should retain information on who
    has used it. The intention is to provide security such that a user may not later
    deny having used the product or participated in some form of transaction using
    the product.


    ## 15e. Immunity Requirements


    Content


    The requirements for what the product has to do to protect itself from infection
    by unauthorized or undesirable software programs, such as viruses, worms, spyware
    and any other undesirable interference.


    Motivation


    To build a product that is as secure as possible from malicious interference.


    Considerations


    Each day brings more malevolence from the unknown, outside world. People buying
    software, or any other kind of product, expect that it can protect itself from
    outside interference.


    ## 16. Cultural Requirements


    ### 16a. Cultural Requirements


    Content


    This section contains requirements that are specific to the sociological factors
    that affect the acceptability of the product. If you are developing a product
    for foreign markets, then these requirements are particularly relevant.


    Motivation


    To bring out the open requirements that are difficult to discover because they
    are outside the cultural experience of the developers.


    Examples


    - The product shall not be offensive to religious or ethnic groups.

    - The product shall be able to distinguish between French, Italian, and British
    road-numbering systems.

    - The product shall keep a record of public holidays for all countries in the
    European Union and for all states in the United States.


    Considerations


    Consider whether the product is intended for a culture other than the one which
    you are familiar. Ask people in other countries or in other types of organizations
    will use the product. Do these people have different habits, holidays, superstitions,
    or cultural norms that do not apply to your own culture? Are there colours, icons,
    measurement units or words that have different meanings in another cultural environment?
    If your reaction to a requirement is – rather odd/unusual/weird then likely you
    have a cultural requirement.


    ## 17. Legal Requirements


    ### 17a. Compliance Requirements


    Content


    A statement specifying the legal requirements for this system.


    Motivation


    To comply with the law so as to avoid later delays, lawsuits, and legal fees.


    Examples


    - Personal information shall be implemented so as to comply with the Data Protection
    Act.


    Fit Criterion


    Lawyers’ opinion that the product does not break any laws.


    Considerations


    Consider consulting lawyers to help identify the legal requirements.


    Are there any copyrights or other intellectual property that must be protected?
    Conversely, do any competitors have copyrights on which you might be in danger
    of infringing?


    Is it a requirement that developers have not seen competitors’ code or even have
    worked for competitors?


    The Sarbanes-Oxley (SOX) Act, the Health Insurance Portability and Accountability
    Act (HIPAA) and the Gramm-Leach-Bliley Act may have implications for you. Check
    with your company lawyer.


    Might any pending legislation affect the development of this system? Are there
    any aspects of criminal law you should consider?


    Have you considered the tax laws that affect your product?


    Are there any labour laws (e.g., working hours) relevant to your product?


    ## 17b. Standards Requirements


    Content


    A statement specifying applicable standards and referencing detailed standards
    descriptions. This does not refer to the law of the land—think of it as an internal
    law imposed by your company or by your industry.


    Motivation


    To comply with standards so as to avoid later delays.


    Example


    - The product shall comply with MilSpec standards.

    - The product shall comply with insurance industry standards.

    - The product shall be developed according to SSADM development steps.


    Criterion


    The appropriate standard-keeper certifies that the standard has been adhered to.


    Considerations


    It is not always apparent that there are applicable standards because their existence
    is often taken for granted. Consider the following:


    - Do any industry bodies have applicable standards?

    - Does the industry have a code of practice, watchdog, or ombudsman?

    - Are there any special development steps for this type of product?


    Project Issues


    The following sections 18-27 contain issues that must be faced if the requirements
    are to be met and the product to become a reality. These sections also connect
    the requirements with the project activities that discover and progress the requirements.
    If you are using a consistent language for communicating then project managers
    can use the requirements as input to steering the project. The Volere Requirements
    Model (included with the download of Version 16 of the template) provides the
    basis for a requirements common language by identifying classes of knowledge and
    the relationships between them. Each of the classes of knowledge is cross-referenced
    to sections in this template.


    ## 18. Open Issues


    Issues that have been raised and do not yet have a conclusion.


    Content


    A statement of factors that are uncertain and might make significant difference
    to the product.


    Motivation


    To bring out in the open and provide objective input to risk analysis.


    Examples


    Our investigation into whether the new version of the processor will be suitable
    for our application is not yet complete.

    - The government is planning to change the rules about who is responsible for
    gritting the motorways, but we do not know what those changes might be.

    - The feasibility study to determine whether to use the Regional Weather Center''s
    online database is not yet complete. This issue affects how we should handle the
    weather data.


    Planned changes to working hours for drivers may affect the way that trucks are
    scheduled and the length of the routes that are permitted to travel. The changes
    are still in the proposal stage; details will be available by the end of the year.


    Considerations


    When you are probing the user''s business, questions often come to the surface,
    and for the moment they cannot be answered. Similarly, as you are gathering the
    requirements for a future product, it may well be that your stakeholders are unsure
    of how the work should be done in the future.

