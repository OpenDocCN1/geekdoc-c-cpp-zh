    # Considerations


    # Form


    Include the constraint requirements as a specific type of atomic requirement in
    your requirements spreadsheet or database. For attributes of an atomic requirement
    see the Atomic Requirements Shell example at the start of this template. Also
    refer to atomic requirements at


    http://www.volere.co.uk


    Another form for constraints can be diagram/s of the systems architecture for
    the new/changed product - see 3b & 3c.


    # 3b. Implementation Environment of the Current System


    # Content


    This describes the technological and physical environment in which the product
    is to be installed. It includes automated, mechanical, organizational, and other
    devices, along with the nonhuman adjacent systems.


    # Motivation


    To describe the technological environment into which the product must fit. The
    environment places design constraints on the product. This part of the specification
    provides enough information about the environment for the designers to make the
    product successfully interact with its surrounding technology.


    The operational requirements are derived from this description.


    # Examples


    Examples can be shown as a diagram, with some kind of icon to represent each separate
    device or person (processor). Add interfaces between the processors, and annotate
    them with their form and content.


    # Considerations


    All component of the current system, regardless of their type, should be included
    in the description of the implementation environment.'
  - '[PAGE 17]


    If the product is to affect, or be important to, the current organization, then
    include an organization chart.


    # Form


    A diagram that represents each hardware and software component/subcomponent/device/building
    block that will be used to implement the product. The particular diagrams you
    use depend on your organization and your projects'' ways of working, the important
    issue is that the implementation environment is unambiguously understandable by
    the people who have to make decisions about how the functional and non-functional
    requirements will be implemented. Types of UML diagrams commonly used are: Class,
    Component, Component Structure, Deployment, Package diagrams. There are many other
    home-grown diagrams.


    # 3c. Partner or Collaborative Applications


    # Content


    This describes applications that are not part of the product but with which the
    product will collaborate. They can be external applications, commercial packages,
    or pre-existing in-house applications.


    # Motivation


    To provide information about design constraints caused by using partner applications.
    By describing or modelling these partner applications, you discover and highlight
    potential problems of integration.


    # Examples


    This section can be completed by including written descriptions, models, or references
    to other specifications. The descriptions must include a full specification of
    all interfaces that have an effect on the product.


    # Considerations


    Examine the work context model to determine whether any of the adjacent systems
    should be treated as partner applications. It might also be necessary to examine
    some of the details of the work to discover relevant partner applications.


    # Form


    A diagram or table that identifies all the interfaces between the product to be
    built and other adjacent systems. Be in mind that the adjacent systems might be
    software, human or hardware. Some adjacent systems are within your organization
    and potentially more easily understood and perhaps influenced. Other adjacent
    systems are outside your organization and might be'
  - '[PAGE 18]


    difficult if impossible to influence. A product scope diagram (see 8a for an example)
    is often used to define interfaces with partner or collaborative applications.


    # 3d. Off-the-Shelf Software


    # Content


    This describes commercial, open source, or any other off-the-shelf software (OTS)
    must be used to implement some of the requirements for the product. It could also
    apply to non-software OTS components such as hardware or any other commercial
    product that is intended as part of the solution.


    # Motivation


    To identify and describe existing commercial, free, open source, or other products
    to be incorporated into the eventual product. The characteristics, behaviour,
    and interfaces of the package design constraints.


    # Considerations


    When gathering requirements, you may discover requirements that conflict with
    the behaviour and characteristics of the OTS software. Keep in mind that the use
    of OTS software was mandated before the full extent of the requirements become
    known. In light of your discoveries, you must consider whether the OTS product
    is a viable choice. If the use of the OTS software is not negotiable, then the
    conflicting requirements must be discarded.


    Note that your strategy for discovering requirements is affected by the decision
    to use OTS software. In this situation you investigate the work context in parallel
    with making comparisons with the capabilities of the OTS product. Depending on
    the comprehensibility of the OTS software, you might be able to discover the matches
    or mismatches without having to write each of the business requirements in atomic
    detail. The mismatches are the requirements that you will need to specify so that
    you can decide whether to satisfy them by either modifying the OTS software or
    satisfying the requirement in another way by modifying the business requirements.


    Given the spate of lawsuits in the software area, you should consider whether
    any legal implications might arise from your use of OTS. You can cover this in
    section 17. Legal Requirements.


    # Form


    Models or written documentation that specifies the functional and non-functional
    requirements that can be implemented using this OTS software product. If the OTS
    product has a well structured requirements specification'
  - '[PAGE 19]


    and systems architecture model then provides you with the basis for identifying
    which of your requirements can be satisfied by the product. If the product''s
    documentation is not traceable and well organized then you will need to do more
    detailed work on your own requirements until you find a level at which you can
    map your requirements to the OTS product.


    Another form is a person or people who are experts in the OTS product and can
    answer your questions without having to puzzle through cryptic or marketing-oriented
    documents.


    # 3e. Anticipated Workplace Environment


    Content


    This describes the workplace in which the users are to work and use the product.
    It should describe any features of the workplace that could have an effect on
    the design of the product, and the social and cultural aspects of the workplace.


    Motivation


    To identify characteristics of the workplace so that the product is designed to
    compensate for any difficulties.


    Examples


    +   - The single office printer is a considerable distance from the user''s desk.
    This constraint suggests printed output should be deemphasized.


    +   - The workplace is noisy, so audible signals might not work.


    +   - The workplace is outside, so the product must be weather resistant, have
    displays that are visible in sunlight, and allow for the effect of wind on any
    paper output.


    +   - The product is to be used in a library; it must be very quiet.


    +   - The product is a photocopier to be used by an environmentally conscious
    organization; it must work with recycled paper.


    +   - The user will be standing up or working in positions where he hold the product.
    This suggests a hand-held product, but only a careful study of the users'' work
    and workplace will provide the necessary input to identifying the operational
    requirements.


    Considerations


    The physical work environment constrains the way that is done. The product should
    overcome whatever difficulties exist; however, you might consider a redesign of
    the workplace as an alternative to having the product compensate for it.'
  - '[PAGE 20]


    Written description of the workplace; rich pictures showing all the components
    in the workplace; photographs of the workplace; videos of the workplace.


    # 3f. Schedule Constraints


    # Content


    Any known deadlines, or windows of opportunity, should be stated here.


    # Motivation


    To identify critical times and dates that have an effect on product requirements.
    If the deadline is short, the requirements must be kept to whatever can be built
    within the time allowed.


    # Examples


    To meet scheduled software releases.


    There may be other parts of the business or other software products that are dependent
    on this product.


    Windows of marketing opportunity.


    Scheduled changes to the business that will use your product. For example, the
    organization may be starting up a new factory and your product is needed before
    production commences.


    # Considerations


    State deadline limitations by giving the date and describing why it is critical.
    Also, identify prior dates where parts of your product need to be available for
    testing.


    You should also ask questions about the impact of not meeting the deadline:


    +   * What happens if we don''t build the product by the end of the calendar year?

    * What is the financial impact of not having the product by the beginning of the
    Christmas buying season?

    * What parts of the product are most critical for the Christmas buying season?


    # Form


    A written statement giving: The date of the deadline, The reason for the deadline,
    The effect of not meeting the deadline'
- md: "\n## 3g. Budget Constraints\n\nContent\n\nThis section shows the budget for\
    \ the project, expressed in money or available resources.\n\nMotivation\n\nThe\
    \ requirements must not exceed the budget. This limitation may constrain the number\
    \ of requirements that can be included in the product.\n\nThe intention of this\
    \ question is to determine whether the product is really wanted.\n\nConsiderations\n\
    \nThe intention is to restrict the wildest ambitions and to prevent the team from\
    \ gathering requirements for an Airbus 380 when the budget can buy only a Cessna.\
    \ Is it realistic to build a product within this budget? If the answer to this\
    \ question is no, either the client is not really committed to building the product\
    \ or the client does not place enough value on the product. In either case you\
    \ should consider whether it is worthwhile continuing.\n\nForm\n\nA statement\
    \ giving the amount of the budget and the source of the funding.\n\n## 3h. Enterprise\
    \ Constraints\n\nContent\n\nThis section contains requirements that are specific\
    \ to the enterprise that is making the investment in your project.\n\nMotivation\n\
    \nTo understand requirements that sometimes appear irrelevant or irrational because\
    \ they are not obviously relevant to the goals of the project.\n\nExamples\n\n\
    - The product shall be installed using only American-made components.\n- The product\
    \ shall make all functionality available to the CEO.\n\nConsiderations\n\nDid\
    \ you intend to develop the product on a Macintosh, when the office manager has\
    \ laid down an edict that only Windows machines are permitted?\n\nIs a director\
    \ also on the board of a company that manufactures products similar to the one\
    \ that you intend to build?\n\nWhether you agree with these enterprise requirements\
    \ has little bearing on the outcome. The reality is that the system has to comply\
    \ with enterprise requirements even if you can find a better, more efficient,\
    \ or more economical solution. A few probing questions here may save some heartache\
    \ later.\n\nThe enterprise requirements might be purely concerned with the politics\
    \ inside your organization. However, in other situations you may need to consider\
    \ the politics inside your customers' organizations or the national politics of\
    \ the country. Another way to think about the enterprise requirements is that\
    \ they are constraint requirements that have been defined by strategic decisions\
    \ that are outside the obvious boundary of your project scope.\n\n## 4. Naming\
    \ Conventions and Terminology\n\nIt has been our experience that all projects\
    \ have their own unique vocabulary usually containing a variety of acronyms and\
    \ abbreviations. Failure to understand this project-specific nomenclature inevitably\
    \ leads to misunderstandings, hours of lost time, miscommunication between team\
    \ members, and ultimately poor-quality specifications.\n\n## 4a. Definitions of\
    \ All Terms, Including Acronyms, Used by Stakeholders Involved in the Project\n\
    \nContent\n\nA glossary containing the meanings of all names, acronyms, and abbreviations\
    \ used by the stakeholders. Select names carefully to avoid giving a different,\
    \ unintended meaning.\n\nIf the work that you are studying already has a glossary\
    \ of terms then use this as your starting point. This glossary should be enlarged\
    \ and refined as the analysis proceeds, but for the moment, it introduce the terms\
    \ that the stakeholders use and the meanings of those terms. This glossary reflects\
    \ the terminology in current use within the work area. You might also get started\
    \ by building on the standard names used within your industry.\n\nFor each term,\
    \ write a description. The appropriate stakeholders must agree on this description\
    \ of the meaning of the term.\n\nWe suggest you add all acronyms and abbreviations.\
    \ We often encounter situations where team members use acronyms, but admit they\
    \ do not know meanings of those acronyms. This section gives you a place to register\
    \ your acronyms.\n\nMotivation\n\nNames are very important. They invoke meanings\
    \ that, if carefully defined, can save hours of explanations. Attention to names\
    \ early in the project helps to highlight misunderstandings.\n\nAs the detailed\
    \ work progresses the glossary provides input to the more precisely business/work\
    \ data model and data dictionary – see section 7 of the template. As the analysis\
    \ data evolves, many of the definitions from the glossary are expanded in the\
    \ dictionary by adding their data composition.\n\nExamples\n\n- Truck: A vehicle\
    \ used for spreading de-icing material on roads.\n- \"Truck\" is not used to refer\
    \ to goods-carrying vehicles.\n\nBIS: Business Intelligence Service. The department\
    \ runs by Steven Peters to supply business intelligence for the rest of the organization.\n\
    \nThermal Map: A region or other geographical area is surveyed to determine determine\
    \ the temperature differences at various parts of the area. The resulting thermal\
    \ map means the temperature at any part of the area can be determined by knowing\
    \ the temperature at a reference point.\n\nConsiderations\n\nMake use of existing\
    \ references and existing data dictionaries. Obviously, it is best to avoid renaming\
    \ existing items they are so ambiguous that they cause confusion.\n\nFrom the\
    \ beginning of the project, emphasize the need to avoid homonyms and synonyms.\
    \ Explain how they increase the cost of the project.\n\nForm\n\nAn existing glossary\
    \ of terms, or a pointer to industry dictionaries, or a list of terms commonly\
    \ used in the problem domain along a sentence describing the meaning and purpose\
    \ of each term.\n\n## 5. Relevant Facts and Assumptions\n\nRelevant facts are\
    \ external factors that have an effect on the product but are not covered by other\
    \ sections in the requirements template. They are not necessarily translated into\
    \ requirements but could be. Relevant facts alert the developers to conditions\
    \ and factors that have a bearing on the requirements.\n\n## 5a. Relevant Facts\n\
    \nContent\n\nFactors that have an effect on the product, but are not mandated\
    \ requirements constraints. Facts provide the reader of the specification with\
    \ more background for understanding the business problem.\n\nMotivation\n\nRelevant\
    \ facts provide background information to the specification readers, and might\
    \ contribute to requirements. They will have an effect on the eventual design\
    \ of the product.\n\nExamples\n\n- One ton of de-icing material will treat three\
    \ miles of single-lane roadway.\n- The existing application is 10,000 lines of\
    \ C code.\n\n## 5b. Business Rules\n\nContent\n\nThese are business rules that\
    \ might have an impact on the work/business/domain that is the source of the requirements.\
    \ Relevant business rules will be the trigger for the requirements.\n\nMotivation\n\
    \nBusiness rules are mentioned at all stages of the requirements process. It is\
    \ often difficult to immediately ascertain whether a rule or is not relevant to\
    \ the project. This section provides a place to capture the business rules and,\
    \ as understanding of the work increases, to revisit them and use them as triggers.\n\
    \nExamples\n\n- The maximum length of a truck driver's shift is 5 hours.\n- The\
    \ engineers maintain the weather stations once a week.\n\nForm\n\nA statement\
    \ describing the business rule, the reason for the rule, the authority for the\
    \ rule. At the start of a new project have a look to see if there are some business\
    \ rules that have already been defined. This sets you on the road to requirements\
    \ reuse.\n\nThe treatment trucks being built will be capable of operating up to\
    \ 40 mph.\nThey will have a material capacity of two tons.\n\nConsiderations\n\
    \nWe make unconscious assumptions. It is necessary to talk to the members of the\
    \ project team to discover any unconscious assumptions that they have. Ask stakeholders\
    \ (both technical and business-related) questions such as these:\n\n- What software\
    \ tools are you expecting to be available?\n- Will there be any new software products?\n\
    - Are you expecting to use a current product in the new way?\n- Are there any\
    \ business changes you are assuming we will be able to deal with?\n\nIt is important\
    \ to state these assumptions up front. You might consider the probability of whether\
    \ the assumption is correct and, when relevant, a list of alternatives if that\
    \ is assumed not happen.\n\nThe assumptions are intended to be transient. That,\
    \ they should all be cleared by the time the specification is released–the assumption\
    \ should become either a requirement or a constraint. For example, if the assumption\
    \ related to the capability of a product that is intended to be a partner product\
    \ to yours, the capability should have been proven satisfactory, and it becomes\
    \ a constraint to use it. Conversely, if the bought-in product is not suitable,\
    \ then it becomes a requirement for the project team to construct the needed capability.\n\
    \nForm\n\nA written statement describing the assumption along with the effect\
    \ on the project if the assumption is false. Depending on the complexity of the\
    \ assumption, it might be necessary to include references to other documents or\
    \ people\n\n assumptions can be explored and shared by using cause and effect\
    \ diagrams such as Peter Senge’s dynamics models.\n\n## 6. The Scope of the Work\n\
    \nThe scope of the work determines the boundaries of the business area to be studied\
    \ and outlines how it fits into its environment. Once you understand the work\
    \ and its constraints, you can establish the scope of the product see Section\
    \ 8 of the template.\n"
