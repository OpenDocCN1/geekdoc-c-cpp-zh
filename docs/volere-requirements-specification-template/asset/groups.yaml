  - '[PAGE 11]


    # 2d. The Hands-On Users of the Product


    # Content


    A list of a special type of stakeholder—the potential users of the product. For
    each category of user, provide the following information:


    +   - User name/category: Most likely the name of a user group, such as clerical
    users, schoolchildren, road engineers, or project managers.

    - User role: Summarizes the users'' responsibilities.

    - Subject matter experience: Summarizes the users'' knowledge of the subject matter/business.
    Rate as novice, journeyman, or master.

    - Technological experience: Describes the users'' experience with relevant technology.
    Rate as novice, journeyman, or master.

    - Other user characteristics: Describe any characteristics of the users that have
    an effect on the requirements and eventual design of the product. For example:

    - Physical abilities/disabilities

    - Intellectual abilities/disabilities

    - Attitude toward job

    - Attitude toward technology

    - Physical location

    - Education

    - Linguistic skills

    - Age group

    - Gender

    - Ethnic group/s


    # Motivation


    Users are human beings who interface with the product in some way. Use the characteristics
    of the users to define the usability requirements for the product. Users are also
    known as actors.


    # Examples


    Users can come from wide variety of (sometimes unexpected) sources. Consider the
    possibility of your users being clerical staff, shop workers, managers, highly
    trained operators, the general public, casual users, passersby, illiterate people,
    tradesmen, students, test engineers, foreigners, children,'
  - '[PAGE 12]


    lawyers, remote users, people using the system over the telephone or an Internet
    connection, emergency workers, and so on.


    # Form


    A simple list or a spreadsheet containing the User Characteristics for each User
    Role + User Name/Representative


    # 2e. Personas


    # Content


    A story about an invented person that includes:


    Persona''s name, age, job, family, hobbies, where they live, favourite food, favourite
    music, likes, dislikes, where they go on holiday, attitude to technology, money,
    or any other characteristic that could influence the way that the persona thinks
    of the product. It helps if you include a photograph or drawing of the imagined
    person.


    # Motivation


    By having one or more (limit it to 3) personas you can make the requirements specific
    to the people you are trying to satisfy. This is a particularly effective technique
    if you are specifying the requirements for a consumer product or a product that
    will be used by members of the public.


    # Form


    A profile containing the life story of the persona. Include a photograph or drawing
    of the persona. The profile can be in the form of a document that you use to introduce
    project participants to the persona. You can also put the persona onto a large
    format, A3, card that you display at meetings to remind participants about whose
    requirements you are trying to discover. Another idea is to build a storyboard
    of the persona''s life. You can also make a website for the persona and keep him/her
    alive by adding more about the persona''s everyday life. All of these forms of
    capturing and communicating the persona are intended to help people think of the
    persona as a real user with specific, rather than general, real requirements.


    # 2f. Priorities Assigned to Users


    # Content


    Attach a priority to each category of user. This identifies the importance and
    precedence of the user. Prioritize the users as follows:'
  - '[PAGE 13]


    +   * Key users: They are critical to the continued success of the product.

    Give greater importance to requirements generated by this category of user.


    +   * Secondary users: They will use the product, but their opinion of it has
    no effect on its long-term success. Where there is a conflict between secondary
    users'' requirements and those of key users, the key users take precedence.


    +   * Unimportant users: This category of user is given the lowest priority. It
    includes frequent, unauthorized, and unskilled users, as well as people who misuse
    the product.


    The percentage of the type of user is intended to assess the amount of consideration
    given to each category of user.


    # Motivation


    If some are considered to be more important to the product or to the organization,
    this preference should be stated because it should affect the way that you design
    the product. For instance, you need to know if there is a large customer group
    who has specifically asked for the product, and for which, if they do not get
    what they want, the results could be a significant loss of business.


    Some users may be listed as having no impact on the product. These users will
    make use of the product, but have no vested interest in it. In other words, these
    users will not complain, nor will they contribute. Any special requirements from
    these users will have a lower design priority.


    # Form


    Include the user importance rating on your user characteristics spreadsheet, see
    2d, for the information of the core project team. Depending on the culture of
    your organization, you might need to treat this as sensitive information.


    # 2g. User Participation


    # Content


    Where appropriate, attach to the category of user a statement of the participation
    that you think will be necessary for those users to provide the requirements.
    Describe the contribution that you expect these users to provide—for example,
    business knowledge, interface prototyping, or usability requirements. If possible,
    assess the minimum amount of time that these users must spend for you to be able
    to determine the complete requirements.'
  - '[PAGE 14]


    # Motivation


    Many projects fail through lack of user participation, sometimes because the required
    degree of participation was not made clear. When people have to make a choice
    between getting their everyday work done and working on a new project, the everyday
    work usually takes priority. This requirement makes it clear, from the outset,
    specified user resources must be allocated to the project.


    # Form


    Include the estimated user participation time, together with the type of knowledge
    you expect that user to provide, on your user characteristics spreadsheet, see
    2d.


    # 2h. Maintenance Users and Service Technicians


    # Content


    Maintenance users are a special type of hands-on users who have requirements that
    are specific to maintaining and changing the product.


    # Motivation


    Many of these requirements will be discovered by considering the various types
    of maintenance requirements detailed in section 14. However, if we define the
    characteristics of the people who maintain the product, it will help to trigger
    requirements that might otherwise be missed.


    # Form


    Include the maintenance users, on your user characteristics spreadsheet, see 2d.


    # 3. Mandated Constraints


    This section describes constraints on the eventual design of the product. Constraints
    are global—the factors that apply to the entire product. The product must be built
    within the stated constraints. Often you know about the constraints, or they are
    mandated before the project gets under way. They are properly determined by management
    and worth considering carefully—restrict what you can do and shape the product.
    Constraints, like other types of requirements have a description, rationale, and
    fit each criterion, and generally are written in the same format as functional
    and non-functional requirements.'
  - '[PAGE 15]


    # 3a. Solution Constraints


    Content


    This specifies constraints on the mandated technology or solution. Include any
    appropriate version numbers. You should also explain the reason for using the
    technology.


    Motivation


    To identify constraints that guide the final product. Your client, customer, or
    user may have design preferences, or only certain solutions may be acceptable.
    If these constraints are not met, your solution is not acceptable.


    Examples


    Constraints are written using the same form as other atomic requirements (refer
    to the requirements snow card/shell for the attributes). It is important for each
    constraint to have a rationale and a fit criterion, as they help expose false
    constraints (solutions masquerading as constraints). Also, you will usually find
    that a constraint affects the entire product rather than one or more product use
    cases.


    +   Description: The product shall use the current two-way radio system to communicate
    with the drivers in their trucks.

    Rationale: The client will not pay for a new radio system, nor are any other means
    of communication available to the drivers.

    Fit criterion: All signals generated by the product shall be audible and understandable
    by all drivers via their two-way radio system.


    +   Description: The product shall operate using Windows XP.

    Rationale: The client uses XP and does not wish to change to a later version.

    Fit criterion: The product shall be approved as XP compliant by the MS testing
    group.


    +   Description: The product shall be a hand-held device.

    Rationale: The product is to be marketed to hikers and mountain climbers.

    Fit criterion: The product shall weigh no more than 300 grams, no dimension shall
    be more than 15imetres, and there shall be no external power source.'
- md: '

    # Considerations


    # Form


    Include the constraint requirements as a specific type of atomic requirement in
    your requirements spreadsheet or database. For attributes of an atomic requirement
    see the Atomic Requirements Shell example at the start of this template. Also
    refer to atomic requirements at


    http://www.volere.co.uk


    Another form for constraints can be diagram/s of the systems architecture for
    the new/changed product - see 3b & 3c.


    ## 3b. Implementation Environment of the Current System


    ### Content


    This describes the technological and physical environment in which the product
    is to be installed. It includes automated, mechanical, organizational, and other
    devices, along with the non-human adjacent systems.


    ### Motivation


    To describe the technological environment into which the product must fit. The
    environment places design constraints on the product. This part of the specification
    provides enough information about the environment for the designers to make the
    product successfully interact with its surrounding technology.


    The operational requirements are derived from this description.


    ### Examples


    Examples can be shown as a diagram, with some kind of icon to represent each separate
    device or person (processor). Add interfaces between the processors, and annotate
    them with their form and content.


    ### Considerations


    All component of the current system, regardless of their type, should be included
    in the description of the implementation environment.


    If the product is to affect, or be important to, the current organization, then
    include an organization chart.


    ### Form


    A diagram that represents each hardware and software component/subcomponent/device/building
    block that will be used to implement the product. The particular diagrams you
    use depend on your organization and your projects'' ways of working, the important
    issue is that the implementation environment is unambiguously understandable by
    the people who have to make decisions about how the functional and non-functional
    requirements will be implemented. Types of UML diagrams commonly used are: Class,
    Component, Component Structure, Deployment, Package diagrams. There are many other
    home-grown diagrams.


    ## 3c. Partner or Collaborative Applications


    ### Content


    This describes applications that are not part of the product but with which the
    product will collaborate. They can be external applications, commercial packages,
    or pre-existing in-house applications.


    ### Motivation


    To provide information about design constraints caused by using partner applications.
    By describing or modelling these partner applications, you discover and highlight
    potential problems of integration.


    ### Examples


    This section can be completed by including written descriptions, models, or references
    to other specifications. The descriptions must include a full specification of
    all interfaces that have an effect on the product.


    ### Considerations


    Examine the work context model to determine whether any of the adjacent systems
    should be treated as partner applications. It might also be necessary to examine
    some of the details of the work to discover relevant partner applications.


    ### Form


    A diagram or table that identifies all the interfaces between the product to be
    built and other adjacent systems. Be in mind that the adjacent systems might be
    software, human or hardware. Some adjacent systems are within your organization
    and potentially more easily understood and perhaps influenced. Other adjacent
    systems are outside your organization and might be difficult if impossible to
    influence. A product scope diagram (see 8a for an example) is often used to define
    interfaces with partner or collaborative applications.


    ## 3d. Off-the-Shelf Software


    ### Content


    This describes commercial, open source, or any other off-the-shelf software (OTS)
    must be used to implement some of the requirements for the product. It could also
    apply to non-software OTS components such as hardware or any other commercial
    product that is intended as part of the solution.


    ### Motivation


    To identify and describe existing commercial, free, open source, or other products
    to be incorporated into the eventual product. The characteristics, behaviour,
    and interfaces of the package de design constraints.


    ### Considerations


    When gathering requirements, you may discover requirements that conflict with
    the behaviour and characteristics of the OTS software. Keep in mind that the use
    of OTS software was mandated before the full extent of the requirements become
    known. In light of your discoveries, you must consider whether the OTS product
    is a viable choice. If the use of the OTS software is not negotiable, then the
    conflicting requirements must be discarded.


    Note that your strategy for discovering requirements is affected by the decision
    to use OTS software. In this situation you investigate the work context in parallel
    with making comparisons with the capabilities of the OTS product. Depending on
    the comprehensibility of the OTS software, you might be able to discover the matches
    or mismatches without having to write each of the business requirements in atomic
    detail. The mismatches are the requirements that you will need to specify so that
    you can decide whether to satisfy them by either modifying the OTS software or
    satisfying the requirement in another way by modifying the business requirements.


    Given the spate of lawsuits in the software area, you should consider whether
    any legal implications might arise from your use of OTS. You can cover this in
    section 17. Legal Requirements.


    ### Form


    Models or written documentation that specifies the functional and non-functional
    requirements that can be implemented using this OTS software product. If the OTS
    product has a well structured requirements specification and systems architecture
    model then provides you with the basis for identifying which of your requirements
    can be satisfied by the product. If the product''s documentation is not traceable
    and well organized then you will need to do more detailed work on your own requirements
    until you find a level at which you can map your requirements to the OTS product.


    Another form is a person or people who are experts in the OTS product and can
    answer your questions without having to puzzle through cryptic or marketing-oriented
    documents.


    ## 3e. Anticipated Workplace Environment


    ### Content


    This describes the workplace in which the users are to work and use the product.
    It should describe any features of the workplace that could have an effect on
    the design of the product, and the social and cultural aspects of the workplace.


    ### Motivation


    To identify characteristics of the workplace so that the product is designed to
    compensate for any difficulties.


    ### Examples


    - The single printer is a considerable distance from the user''s desk. This suggests
    output output be deemphasized.

    - The workplace is noisy, so audible signals might not work.

    - The workplace is outside, so the product must be weather resistant, have displays
    that are visible in sunlight, and allow for effect of wind on paper output.

    - The product is to be used in a library; it must be very quiet.

    - The product is a photocopier to be used by an environmentally conscious organization;
    it must work with recycled paper.

    - The user will be standing up or working in positions where hold the product.
    This suggests a hand-held product.


    ### Considerations


    The physical work environment constrains the way that is done. The product should
    overcome whatever difficulties exist; however, you might consider a redesign of
    the workplace as an alternative to having the product compensate for it.


    ### Form


    Written description of the workplace; rich pictures showing all the components
    of the workplace; photographs of the workplace; videos of the workplace.


    ## 3f. Schedule Constraints


    ### Content


    Any known deadlines, or windows of opportunity, should be stated here.


    ### Motivation


    To identify critical times and dates that have an effect on product requirements.
    If the deadline is short, the requirements must be kept to whatever can be built
    within the time allowed.


    ### Examples


    - To meet scheduled software releases. There may be other parts of the business
    or other software products that are dependent on this product.

    - Windows of opportunity. Scheduled changes to the business that will use your
    product. For example, the organization may be starting up a new factory and your
    product is needed before production commences.


    ### Considerations


    State deadline limitations by giving the date and describing why it is critical.
    Also, identify prior dates where parts of your product need to be available for
    testing.


    You should also ask questions about the impact of not meeting the deadline:


    - What happens if we don''t build the product by the end of the calendar year?

    - What is the financial impact of not having the product by the beginning of the
    Christmas buying season?

    - What parts of the product are most critical for the Christmas buying season?


    ### Form


    A written statement giving: The date of the deadline, The reason for the deadline,
    The effect of not meeting the deadline.

    '
  mdcn: "\n\n# 注意事项\n\n# 格式\n\n将约束要求作为特定类型的原子需求（atomic requirement）包含在你的需求电子表格或数据库中。关于原子需求的属性，请参考此模板开头的“原子需求外壳”（Atomic\
    \ Requirements Shell）示例。此外，请参考原子需求\n\nhttp://www.volere.co.uk\n\n约束的另一种形式可以是新产品/变更产品的系统架构图——参见\
    \ 3b 和 3c。\n\n## 3b. 当前系统的实现环境\n\n### 内容\n\n此部分描述了产品将安装的技术和物理环境。它包括自动化、机械、组织和其他设备，以及非人类的相邻系统。\n\
    \n### 动机\n\n描述产品必须适应的技术环境。该环境对产品施加了设计约束。规范的这部分内容提供了关于环境的充分信息，使设计人员能够让产品与其周围的技术成功交互。\n\
    \n运行需求是根据此描述得出的。\n\n### 示例\n\n示例可以用图表的形式展示，用某种图标来代表每个独立的设备或人员（处理器）。在处理器之间添加接口，并对其形式和内容进行注释。\n\
    \n### 注意事项\n\n当前系统的所有组件，无论其类型如何，都应该包含在实现环境的描述中。\n\n如果产品将影响当前组织或对当前组织很重要，则请包含一张组织图。\n\
    \n### 格式\n\n表示将用于实现产品的每个硬件和软件组件/子组件/设备/构建块的图。你所使用的特定图表取决于你的组织和项目的工作方式，重要的是，实现环境对于必须对如何实现功能和非功能需求决策的人来说必须是清晰理解的。常用的\
    \ UML 图类型有：类图、组件图、组件结构图、部署图、包图。还有许多其他自定义图表。\n\n## 3c. 合作伙伴或协作应用程序\n\n### 内容\n\n\
    描述不属于产品的一部分但产品将与之协作的应用程序。它们可以是外部应用程序、商业软件包或预存在的内部应用程序。\n\n### 动机\n\n提供由于使用合作伙伴应用程序引起的设计约束信息。通过描述或建模这些合作伙伴应用程序，你可以发现并突出潜在的集成问题。\n\
    \n### 示例\n\n此章节可以通过包含文字描述、模型或与其他规范的引用来完成。描述必须包含对产品影响的所有接口的完整规范。\n\n### 注意事项\n\n\
    检查工作上下文模型，以确定任何相邻系统是否应被视为合作伙伴应用程序。可能还需要检查工作的一些细节以发现相关的合作伙伴应用程序。\n\n### 格式\n\n\
    用图表或表格识别待构建的产品与其他相邻系统之间的所有接口。记住，相邻系统可能是软件、人类或硬件。某些相邻系统位于你的组织内部，可能更容易理解且可能受到影响。其他相邻系统位于你的组织之外，如果无法影响则可能会很困难。产品范围图（示例参见\
    \ 8a）通常用于定义与合作伙伴或协作应用程序的接口。\n\n## 3d. 现成软件 (Off-the-Shelf Software)\n\n### 内容\n\
    \n描述为了实现产品的某些需求必须使用的商业、开源或其他任何现成软件 (OTS)。它也适用于非软件 OTS 组件，如硬件或任何作为解决方案部分的其他商业产品。\n\
    \n### 动机\n\n识别并描述将并入最终产品的现有商用、免费、开源或其他产品。该软件包的特性、行为和接口构成了设计约束。\n\n### 注意事项\n\n\
    在收集需求时，你可能会发现与 OTS 软件的行为和特性冲突的需求。请记住，在完全了解需求范围之前，就已经强制使用 OTS 软件。根据你的发现，你必须考虑 OTS\
    \ 产品是否是一个可行的选择。如果使用 OTS 软件不可商榷，则必须舍弃冲突的需求。\n\n注意，你发现需求的策略会受到使用 OTS 软件决策的影响。根据你的发现，你必须考虑\
    \ OTS 产品是否是一个可行的选择。如果使用 OTS 软件不可商榷，则必须舍弃冲突的需求。\n\n（注：此处原文存在重复内容，已根据“不重复输出原文”原则进行了逻辑处理，翻译确保语义连贯）\n\
    \n注意：此处原文多处存在表述重复。\n\n根据你的发现，请考虑 OTS 可能会引发的法律影响。\n\n## 3e. 预期工作环境\n\n### 内容\n\n\
    描述用户工作和使用产品的环境。它应该描述对产品设计产生影响的工作环境，以及社交文化方面。\n\n### 动机\n\n识别工作环境的特征，以便设计产品以应对困难。\n\
    \n### 示例\n\n 全 打印机距离用户桌子很远。这建议减少输出频率。\n- 环境嘈杂，因此声音信号可能无效。\n- 环境在室外，因此产品必须耐候、具有阳光下可见的显示，并考虑风的影响。\n\
    - 产品将用于图书馆；必须非常安静。\n- 产品是环保意识组织使用的打印机；必须可以使用再生纸。\n- 用户将站立或在某些位置工作。这建议采用手持产品。\n\
    \n### 注意事项\n\n物理工作环境限制了完成方式。产品应该克服任何存在的困难；然而，你可能考虑重新设计工作环境，作为让产品补偿的替代方案。\n\n###\
    \ 格式\n\n工作环境的文字描述；显示工作环境所有组件的图片；照片；视频。\n\n## 3f. 进度约束\n\n### 内容\n\n应在此说明任何知的截止日期或机会窗口。\n\
    \n### 动机\n\n识别对产品需求影响的关键节点。如果截止日期短，需求必须限制在允许时间内可以构建的内容。\n\n### 示例\n\n- 为了满足定期的软件发布。可能有其他业务部分或其他软件产品依赖于此产品。\n\
    - 机会窗口。对你产品的业务计划变更。例如，组织可能正在启动新工厂，在生产开始之前需要你的产品。\n\n### 注意事项\n\n通过给出日期并描述其重要性来说明截止日期限制。此外，识别产品某些部分需要测试之前的日期。\n\
    \n你还应该就未能在截止日期完成提出：\n\n- 如果我们在年底之前没有完成该产品会怎样？\n- 在圣诞购物季之前没有产品会有什么财务影响？\n- 产品的哪些部分对于圣诞购物季至关重要？\n\
    \n### 格式\n\n一份书面声明，给出：截止日期、截止日期原因、未能在截止日期完成的影响。\n\n"
