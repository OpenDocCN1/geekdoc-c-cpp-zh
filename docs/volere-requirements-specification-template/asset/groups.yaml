    # 10b. Style Requirements


    Content


    Requirements that specify the mood, style, or feeling of the product, which influences
    the way a potential customer will see the product. Also, the stakeholders'' intentions
    for the amount of interaction the user is to have with the product.


    In this section, you would also describe the appearance of the package if this
    is to be a manufactured product. The package may have some requirements as to
    its size, style, and consistency with other packages out by your organization.
    Keep in mind the European laws on packaging, which require that the package not
    be significantly larger than the product it encloses.


    The style requirements you record here will guide the designers to create a product
    as envisioned by your client.


    # Motivation


    Given the state of today''s market and people''s expectations, we cannot afford
    to build products that have the wrong style. Once the functional requirements
    are satisfied, it is often the appearance and style of products that determine
    whether they are successful. Your task in this section is to determine precisely
    how the product shall appear to its intended consumer.


    # Example


    The product shall appear authoritative.


    # Fit Criterion


    After their first encounter with the product, 70 percent of representative potential
    customers shall agree they feel they can trust the product.


    # Considerations


    The look and feel requirements specify your client''s vision of the product''s
    appearance. The requirements may at first seem to be vague (e.g., “conservative
    and professional appearance”), but these will be quantified by their criteria.
    The fit criteria give you the opportunity to extract from your client precisely
    what is meant, and give the designer precise instructions on what he is to accomplish.


    # 11. Usability and Humanity Requirements


    This section is concerned with requirements that make the product usable and ergonomically
    acceptable to its hands-users.'
  - '[PAGE 46]


    # 11a. Ease of Use Requirements


    Content


    This section describes your client''s aspirations for how easy it is for the intended
    users of the product to operate. The product''s usability is derived from the
    abilities of the expected users of the product and the complexity of its functionality.


    The usability requirements should cover properties such as these:


    +   - Efficiency of use: How quickly or accurately the user can use the product.


    +   - Ease of remembering: How much the casual user is expected to remember about
    using the product.


    +   - Error rates: For some products it is crucial that the user commits few,
    or no, errors.


    +   - Overall satisfaction in using the product: This is especially important
    for commercial, interactive products that face a lot of competition. Web sites
    are a good example.


    +   - Feedback: How feedback the user needs to feel confident that the product
    is accurately doing what the user expects. The necessary degree of feedback will
    be higher for some products (e.g., safety-critical products) than for others.


    # Motivation


    To guide the product''s designers toward building a product that meets the expectations
    of its eventual users.


    # Examples


    +   - The product shall be easy for 11-year-old children to use.


    +   - The product shall help the user to avoid making mistakes.


    +   - The product shall make the users want to use it.


    +   - The product shall be used by people with no training, and possibly no understanding
    of English.


    # Fit Criterion


    These examples may seem simplistic, but they do express the intention of the client.
    To completely specify what is meant by the requirement, you must add a measurement
    against which it can be tested—that is, a fit criterion. Here are the fit criteria
    for the preceding examples:


    Eighty percent of a test panel of 11-year-old children shall be able to successfully
    complete [list of tasks] within [specified time].'
  - '[PAGE 47]


    One month’s use of the product shall result in a total error rate of less than
    1 percent.


    An anonymous survey shall show that 75 percent of the intended users are regularly
    using the product after a three-week familiarization period.


    # Considerations


    Refer to section 3, Users of the Product, to ensure that you have considered the
    usability requirements from the perspective of all the different types of users.


    It may be necessary to have special consulting sessions with your users and your
    client to determine whether any special usability considerations must be built
    into the product.


    You could also consider a usability laboratory experienced in testing the usability
    of products that have a project situation (sections 1–7 of the template) similar
    to yours.


    # 11b. Personalization and Internationalization Requirements


    # Content


    This section describes the way in which the product can be altered or configured
    to take into account the user’s personal preferences or choice of language.


    The personalization requirements shall cover issues such as the following:


    +   - Languages, spelling preferences, and language idioms

    - Currencies, including the symbols and decimal conventions

    - Personal configuration options


    # Motivation


    To ensure that the product’s users do not have to struggle with, or meekly accept,
    the builder’s cultural conventions.


    # Examples


    The product shall retain the buyer’s buying preferences.

    The product shall allow the user to select a chosen language.


    # Considerations


    Consider the country and culture of the potential customers and users of your
    product. Any out-of-country users will welcome the opportunity to convert to their
    home spelling and expressions.'
  - '[PAGE 48]


    By allowing users to customize the way in which they use the product, you give
    them the opportunity to participate more closely with your organization as well
    as enjoy their own personal user experience.

    You might also consider the configurability of the product. Configurability allows
    different users to have different functional variations of the product.


    # 11c. Learning Requirements


    # Content


    Requirements specifying how easy it should be to learn to use the product. This
    learning curve ranges from zero time for products intended for placement in the
    public domain (e.g., a parking meter or a web site) to a considerable amount of
    time for complex, highly technical products. (We know of one product where it
    was necessary for graduate engineers to spend 18 months in a training program
    before being qualified to use the product.)


    # Motivation


    To quantify the amount of time that your client feels is allowable before a user
    can successfully use the product. This requirement guides designers to understand
    how users will learn the product. For example, designers may build elaborate interactive
    help facilities into the product, or the product may be packaged with a tutorial.
    Alternatively, the product may have to be constructed so that all of its functionality
    is apparent upon first encountering it.


    # Examples


    +   - The product should be easy for an engineer to learn.

    - A clerk shall be able to be productive within a short time.

    - The product shall be able to be used by members of the public who will receive
    no training before using it.

    - The product shall be used by engineers who will attend five weeks of training
    before using the product."


    # Fit Criterion


    An engineer shall produce a [specified result] within [specified time] of beginning
    to use the product, without needing to use the manual.

    After receiving [number of hours] training a clerk shall be able to produce [quantity
    of specified outputs] per [unit of time].

    [Agreed percentage] of a test panel shall successfully complete specified task
    within [specified time limit].nThe engineers shall achieve [agreed percentage]
    pass rate from the final examination of the training.'
  - '[PAGE 49]


    # Considerations


    Refer to section 2d, Hands-On Users of the Product, to ensure that you have considered
    the ease of learning requirements from the perspective of all the different types
    of users.


    # 11d. Understandability and Politeness Requirements


    This section is concerned with discovering requirements related to concepts and
    metaphors that are familiar to the intended end users.


    # Content


    This specifies this requirement for the product to be understood by its users.
    While “usability” refers to use, efficiency, and similar characteristics, “understandability”
    determines whether the users instinctively know what the product will do for them
    and how it fits into their view of the world. You can think of understandability
    as the product being polite to not expecting them to know or learn things that
    have nothing to do with their business problem. Another aspect of politeness is
    that the product should not expect the user to input any information to which
    the product already has access.


    # Motivation


    To avoid forcing users to learn terms and concepts that are part of the product’s
    internal construction and are not relevant to the users’ world. To make the product
    more comprehensible and thus more likely to be adopted by its intended users.


    # Examples


    The product shall use symbols and words that are naturally understandable by the
    user community.


    The product shall hide the details of its construction from the user.


    # Considerations


    Refer to section 2d, Hands-On Users of the Product, and consider the world from
    the point of view of each of the different types of users.


    # 11e. Accessibility Requirements


    # Content


    The requirements for how easy it should be for people with common disabilities
    to access the product. These disabilities might be related to physical disability
    or visual, hearing, cognitive, or other abilities.'
