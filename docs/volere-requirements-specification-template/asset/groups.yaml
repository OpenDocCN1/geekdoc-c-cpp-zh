    # 5a. Relevant Facts


    Content


    Factors that have an effect on the product, but are not mandated requirements
    constraints. Facts provide the reader of the specification with more background
    for understanding the business problem.


    Motivation


    Relevant facts provide background information to the specification readers, and
    might contribute to requirements. They will have an effect on the eventual design
    of the product.


    Examples


    +   - One ton of de-icing material will treat three miles of single-lane roadway.

    - The existing application is 10,000 lines of C code.


    # 5b. Business Rules


