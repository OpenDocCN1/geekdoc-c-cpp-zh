- md: ' # Volere

    Requirements Specification Template


    Edition 16–2012


    by James Robertson & Suzanne Robertson principals of the Atlantic Systems Guild


    The Volere Requirements Specification Template is intended for use as a basis
    for your requirements specifications. The template provides sections for each
    of the requirements types appropriate to today''s software systems. You may download
    the template from the Volere site and adapt it to your requirements gathering
    process and requirements tools. The template can be used with Requisite, DOORS,
    Caliber RM, IRQa and other popular tools see http://www.volere.co.uk/tools.htm


    The template may not be sold, or used for commercial gain or purposes other than
    as a basis for a requirements specification without prior written permission.
    The Template may be modified or copied and used for your requirements work, provided
    you include the following copyright notice in any document that uses any part
    of template:


    We acknowledge that this document uses material from the Volere Requirements Specification
    Template, copyright © 1995 – 2012 the Atlantic Systems Guild Limited.


    # Contents


    # Project Drivers


    + 1. The Purpose of the Project

    2. The Stakeholders


    # Project Constraints


    + 3. Mandated Constraints

    4. Naming Conventions and Terminology

    5. Relevant Facts and Assumptions


    # Functional Requirements


    + 6. The Scope of the Work

    7. Business Data Model & Data Dictionary

    8. The Scope of the Product

    9. Functional Requirements


    # Non-functional Requirements


    + 10. Look and Feel Requirements

    11. Usability and Humanity Requirements

    12. Performance Requirements

    13. Operational and Environmental Requirements

    14. Maintainability and Support Requirements

    15. Security Requirements

    16. Cultural Requirements

    17. Legal Requirements


    # Project Issues


    + 18. Open Issues

    19. Off-the-Shelf Solutions

    20. New Problems

    21. Tasks

    22. Migration to the New Product

    23. Risks

    24. Costs

    25. User Documentation and Training

    26. Waiting Room

    27. Ideas for Solutions


    The Volere Requirements Knowledge Model (included with the download of Version
    16 of this template) shows the formal structure and cross references between the
    components in the above table of contents.


    # Volere


    Volere is the result of many years of practice, consulting, and research in requirements
    engineering and business analysis. We have packaged our experience in the form
    of a generic requirements process, requirements training, requirements consultancy,
    requirements audits, a variety of downloadable guides and articles, a requirements
    knowledge model and this requirements template. We also provide requirements specification-writing
    services.


    The first edition of the Volere Specification Template was released in 1995. Since
    then, organizations from all over the world have saved time and money by using
    the template as the basis for discovering, organizing, and communicating their
    requirements.


    The Volere web site volere.co.uk contains articles about the Volere techniques,
    experiences of Volere users and case studies, requirements tools, and other information
    useful to requirements practitioners.


    The Volere requirements process is described in the book Mastering the Requirements
    Process—Second Edition by Suzanne Robertson and James Robertson, Addison-Wesley,
    2006. ISBN 0-321-41949-9


    For more about managing requirements see Requirements Led Project Management by
    Suzanne Robertson and James Robertson, Addison-Wesley, 2005. ISBN 0-321-65904-X


    Updates to this template and instructions for downloading are available at http://www.volere.co.uk


    Public seminars on Volere run on a regular basis in Europe, the United States,
    Australia, and New Zealand. For a schedule of courses, refer to www.volere.co.uk.


    # Requirements Types


    For ease of use, we have found it convenient to think of requirements as belonging
    to a type. There are two reasons for the type: as an aid to finding the requirements,
    to be able to group the requirements that are relevant to a specific expert specialty.


    Functional requirements are the fundamental or essential subject matter of the
    product. They describe what the product has to do or what processing actions it
    must take.


    The Volere philosophy is to start testing requirements as soon as you start writing
    them. You make a requirement testable by adding its fit criterion. This fit criterion
    measures the requirement, making it possible to determine whether a given solution
    fits the requirement. If a fit criterion cannot be found for a requirement, then
    the requirement is either ambiguous or poorly understood. All requirements can
    be measured, and all should carry a fit criterion.


    # Atomic Requirements Shell


    The requirements shell is a guide to writing each atomic requirement. The components
    of the shell (also called a "snow card") are identified below. You might decide
    to add some additional attributes to provide traceability necessary for your environment.
    For example: products that implement this requirement, version of the software
    that implements this requirement, departments who are interested in this requirement,
    etc. There are others but not capriciously add attributes unless they really help
    you: every attribute you add needs to be maintained.


    This requirements shell can, and should, be automated. When you download the template
    you will also find an Excel spreadsheet implementation of the snow.


    | Requirement #: Unique id Requirement Type/ Event/BUC/PUC #: |

    | :--- | :--- |

    | Description: A one sentence statement of the intention of the requirement |
    |

    | Rationale: A justification of the requirement | |

    | Originator: The stakeholder who raised this requirement such that it is possible
    to test if the solution matches the original requirement | |

    | Fit Criterion: A measurement of the requirement such | |

    | Customer Satisfaction: Customer dissatisfaction Other requirements that cannot
    be implemented if this is Priority: The relative importance of the requirement
    Conflicts: | |

    | Supporting Materials: History: Creation, changes: Pointer to documents illustrate
    and explain this requirement Volere |

    | Degree of stakeholder happiness if this requirement is successfully implemented.
    Scale from 1 = uninterested to 5 = extremely pleased. Measure of stakeholder unhappiness
    if this requirement is not part of the final product. Scale from 1 = hardly matters
    to 5 = extremely displeased |

    | Id of events / use cases that need this requirement The type from the template
    |


    The following discusses and provides examples for each of the sections of the
    Volere Specification Template. For each section, the Content, Motivation, Considerations
    and Form provide the template user with some guidance for writing each type of
    requirement. When you download the template you will also find a Template Skeleton
    that you might find convenient to use as the basis for producing a document.


    # 1. The Purpose of the Project


    The first section of the template deals with the fundamental reason your client
    asked you to build a new product. That is, it describes the business problem the
    client faces and explains how the product is intended to solve the problem.


    ### 1a. The User Business or Background of the Project Effort


    Content


    A short description of the business being done, its context, and the situation
    that triggered the development effort. It should also describe the work that the
    user intends to do with the delivered product.


    ### Motivation


    Without this statement, the project lacks justification and direction.


    ### Considerations


    You should consider whether the business problem is serious, and whether and why
    it needs to be solved.


    Perhaps there are no serious problems, just a significant business opportunity
    your client wishes to exploit. In this case, describe the opportunity


    Alternatively, the project may seek to explore or investigate possibilities. In
    this case the project deliverable, instead of a new product, would be a document
    proving that the requirements for a product can (or cannot) be satisfied.


    ### Form


    A text description is often sufficient to provide an understanding of the project.
    You can choose to support the description with some combination of a current situation
    model, business process models, samples of current documents, photographs and
    videos of the current situation, website addresses and organization charts.'
  mdcn: "\n # Volere\n需求规格书模板\n\n第 16–2012 版\n\n作者：James Robertson & Suzanne Robertson，Atlantic\
    \ Systems Guild 负责人\n\nVolere 需求规格书模板旨在作为您需求规格书的基础。该模板为适用于当今软件系统的每种需求类型提供了相应的章节。您可以从\
    \ Volere 网站下载该模板，并根据您的需求收集流程和需求工具进行调整。该模板可与 Requisite、DOORS、Caliber RM、IRQa 以及其他流行工具配合使用，详参见\
    \ http://www.volere.co.uk/tools.htm\n\n未经事先获得书面许可，不得出售本模板，或将其用于商业收益或除作为需求规格书基础以外的。在满足以下条件下，可以修改或复制本模板并用于您的需求工作，前提是您在任何使用本模板任何部分的文档中包含以下版权声明：\n\
    \n我们承认本文档使用了来自 Volere 需求规格书模板的材料，版权所有 © 1995 – 2012 Atlantic Systems Guild Limited。\n\
    \n# 目录\n\n# 项目驱动因素\n\n+ 1. 项目目的\n2. 相关利益者\n\n# 项目约束\n\n+ 3. 强制约束\n4. 命名规范与术语\n\
    5. 相关事实与假设\n\n# 功能性需求\n\n+ 6. 工作范围\n7. 业务数据模型与数据字典\n8. 产品范围\n9. 功能性需求\n\n# 非功能性需求\n\
    \n+ 10. 外观需求\n11. 可用性与人性化需求\n12. 性能需求\n13. 运行与环境需求\n14. 可维护性与支持需求\n15. 安全需求\n\
    16. 文化需求\n17. 法律需求\n\n# 项目问题\n\n+ 18. 开放问题\n19. 现成解决方案\n20. 新问题\n21. 任务\n22. 迁移到新产品\n\
    23. 风险\n24. 成本\n25. 用户文档与培训\n26. 等候室\n27. 解决方案设\n\nVolere 需求知识模型（包含在模板第 16 版中）展示了上述目录组件之间的正式结构和交叉引用。\n\
    \n# Volere\n\nVolere 是需求工程和业务分析领域多年实践、咨询和研究的成果。我们将这些经验封装为通用需求流程、需求培训、需求咨询、需求审计、各种可下载指南和文章、需求知识模型以及此需求模板。我们还提供需求规格书编写服务。\n\
    \nVolere 规格书模板第一版于 1995 年发布。从那时起，世界各组织通过使用该模板作为发现、组织和沟通需求的基础，节省了大量的时间和金钱。\n\n\
    Volere 网站 volere.co.uk 包含关于 Volere 技术、Volere 用户经验和案例研究、需求工具以及其他对需求从业者有用的信息。\n\n\
    Volere 需求流程描述在 Suzanne Robertson 和 James Robertson 著的《掌握需求过程》（Mastering the Requirements\
    \ Process—Second Edition）书中，Addison-Wesley，2006。ISBN 0-321-41949-9。\n\n更多关于需求管理的信息，请参见\
    \ Suzanne Robertson 和 James Robertson 著的《需求驱动的项目管理》（Requirements Led Project Management），Addison-Wesley，2005。ISBN\
    \ 0-321-65904-X。\n\n本模板的更新内容和下载说明请访问 http://www.volere.co.uk。\n\nVolere 公开研讨会在欧洲、美国、澳大利亚和新西兰定期举行。课程表请参阅\
    \ www.volere.co.uk。\n\n# 需求类型\n\n为了方便使用，我们发现将需求归为某种类型是非常方便的。分类类型有两个原因：作为发现需求的帮助，能够对与特定专家领域相关的需求进行分组。\n\
    \n功能性需求是产品的基础或核心主题内容。它们描述了产品必须做什么或它必须采取哪些处理操作。\n\nVolere 的哲学是从开始编写需求时就开始对其进行测试。您通过添加其的**验收标准（fit\
    \ criterion）**来使需求变得可测试。该验收标准对需求进行衡量，从而确定给定的解决方案是否符合需求。如果无法为需求找到验收标准，那么该需求要么是模糊的，要么是理解的。所有需求都是可以衡量的，且都应该带有验收标准。\n\
    \n# 原子化需求外壳\n\n需求外壳（requirements shell）是编写每个原子需求的指南。外壳的组件（也称为“雪花卡”）下文所示。您可能决定添加一些额外的属性，以提供您的环境所需的追溯性。例如：实现此需求的产品、实现此需求的软件版本、对此需求的部门等。还有其他属性，但除非它们对你有帮助，否则不要随意添加属性：您添加的每个属性都需要进行维护。\n\
    \n这种需求外壳可以且应当自动化。当您下载模板时，您还会发现雪花卡的 Excel 表格实现版本。\n\n| 需求 #： 唯一 ID 需求类型/ 事件/BUC/PUC\
    \ #： |\n| :--- | :--- |\n| 描述：对需求意图的单句陈述 | |\n| 依据：对需求的合理性说明 | |\n| 发起者：提出此需求的利益者，以便能够测试解决方案是否符合原始需求\
    \ | |\n| 验收标准：对需求的衡量标准，例如 | |\n| 客户满意度：如果此需求未实现，客户的不满意度 | 如果此需求未包含在最终产品中，导致无法实现的其他需求\
    \ | 优先级：需求的相对重要性 | 冲突： | |\n| 支持材料：历史：创建、更改： 指向说明和解释此需求的文档 Volere |\n| 如果此需求被成功实施，利益者的快乐程度。分值从\
    \ 1（不感兴趣）到 5（非常满意）。利益者的不满意程度。分值从 1（几乎不重要）到 5（极度不悦） | 需要此需求的事件/用例 ID | 模板中的类型 |\n\
    \n以下内容讨论并为 Volere 规格书模板的每个章节提供了示例。对于每个章节，内容、动机、考虑因素和格式为模板用户编写每种需求提供了一些指导。当您下载模板时，您还会发现一个模板骨架，您可能会发现它可以作为生成文档的基础。\n\
    \n# 1. 项目目的\n\n模板的第一部分处理客户要求您构建新产品的根本原因。也就是说，它描述了客户面临的业务问题，并解释了产品旨在解决该问题。\n\n\
    ### 1a. 用户业务或项目工作背景\n\n内容\n\n对正在进行的业务、背景以及触发开发工作的的简要描述。它还应该描述用户打算对交付的产品进行的工作。\n\
    \n### 动机\n\n没有这一声明，项目将缺乏理由和方向。\n\n### 考虑因素\n\n您应该考虑业务问题是否严重，以及是否以及为什么要解决。\n\n\
    也许没有严重的问题，只是客户希望利用的一个重大商业机会。在这种情况下，请描述该机会\n\n或者，项目可能寻求探索或调查可能性。在这种情况下，项目的交付物不是新产品，而是一个证明产品需求可以（或不能）满足的文档。\n\
    \n### 格式\n\n文本描述通常足以理解项目。您可以选择结合现状模型、业务流程模型、当前文档样本、现状的照片和视频、网站地址以及组织架构图的组合来支持该描述。\n"
