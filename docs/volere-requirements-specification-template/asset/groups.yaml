    # 3g. Budget Constraints


    Content


    This section shows the budget for the project, expressed in money or available
    resources.


    Motivation


    The requirements must not exceed the budget. This limitation may constrain the
    number of requirements that can be included in the product.


    The intention of this question is to determine whether the product is really wanted.


    Considerations


    The intention is to restrict the wildest ambitions and to prevent the team from
    gathering requirements for an Airbus 380 when the budget can buy only a Cessna.
    Is it realistic to build a product within this budget? If the answer to this question
    is no, either the client is not really committed to building the product or the
    client does not place enough value on the product. In either case you should consider
    whether it is worthwhile continuing.


    Form


    A statement giving the amount of the budget and the source of the funding.


