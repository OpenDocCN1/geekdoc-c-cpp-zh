    # 7b. Data Dictionary


    The glossary described earlier in section 4 of the template is the starting point
    for establishing common understanding of terminology. As you start to define the
    scope of the investigation you define the data inputs and outputs in a formal
    data dictionary. The terms that you define in this dictionary, right down to elemental
    level, are the same terms that you use when defining detailed atomic requirements.


    # Content


    The data dictionary specifies the content of:


    +   - Classes on the data model

    - Attributes of the classes

    - Relationships between the classes

    - Inputs and Outputs on all models

    - Elements of data within the Inputs and Outputs


    When implementation decisions are made the technical specifications for the interfaces
    should be added to the dictionary.


    # Motivation


    The work context diagram provides an accurate definition of the scope of the work
    being studied and the product scope diagram (See Sections 8a & 8b) defines the
    boundary of the product to be built. These definition can be completely accurate
    only if the information flows bordering the scope have their attributes defined.


