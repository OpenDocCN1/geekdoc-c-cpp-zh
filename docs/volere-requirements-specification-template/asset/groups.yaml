    that is the source of the requirements. Relevant business rules will be the trigger
    for requirements.


    Motivation


    Business rules are mentioned at all stages of the requirements discovery process.
    It is often difficult to immediately ascertain whether a business rule or is not
    relevant to the project that you are doing. This section provides a place to capture
    the business rules and, as understanding of the work increases, to revisit them
    and use them as triggers to discover relevant requirements.


    Examples


    +   - The maximum length of a truck driver''s shift is 5 hours.

    - The engineers maintain the weather stations once a week.


    Form


    A statement describing the business rule, the reason for the rule, the authority
    for the rule.


    At the start of a new project have a look to see if there are some relevant business
    rules that have already been defined. This sets you on the road to requirements
    reuse. When your project discovers a new or changed business'
