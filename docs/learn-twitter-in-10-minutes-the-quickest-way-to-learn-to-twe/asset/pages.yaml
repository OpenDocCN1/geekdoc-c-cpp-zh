- img_proc: true
  md: '# Little Twitter helpers'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Lists


    After a while, you may be following so many people that your timeline moves too
    fast for you to keep up with it. This is where lists come handy. Categorize those
    you follow into groups, e.g. ‘work’, ‘news’, ‘fun’, ‘people for chatting’, ‘knitters’,
    ‘rugby tweeps’, etc. (More Twitter lingo – ‘tweep’ is a shortened version of ‘Twitter’
    and ‘Peeps’, so a rugby tweep is someone that follows rugby on Twitter.) You can
    share these lists or keep them private.


    Flicking back and forth between lists on the Twitter website can be slightly annoying,
    so now is a good time to look into different Twitter clients that enable you to
    see your lists at a glance.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '![](img/ac5d888ab73738d97783942701b8a835_46_0.png)'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Twitter clients


    Software that was developed to host Twitter accounts called ''Twitter clients''
    enable you to switch between several Twitter accounts, e.g. business and private,
    often in columns across your computer screen. Tweetdeck and Hootsuite are popular,
    but they update and change constantly, so ask your followers for their current
    recommendation.


    # Mobile Twitter apps


    The sheer brilliance of Twitter becomes most apparent when it is used on the go.
    Download one of the many apps on your phone or tablet, and tweet whenever you
    have a spare minute. Whether under the table at a boring meeting, on public transport
    (check out #tubetweets) or when waiting for a friend to turn up, with Twitter
    on your phone you are never alone.'
  merge: -1
  pgno: 47
- img_proc: true
  md: '![](img/ac5d888ab73738d97783942701b8a835_48_0.png)'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Apps for clever stuff


    There are lots of apps available to help you enhance your Twitter experience.
    These change almost daily, but here are some of the main functions you''ll be
    able to find apps for.


    ![](img/ac5d888ab73738d97783942701b8a835_49_0.png)'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Twitter photos


    There are various apps for sharing photos. Check them out and find which one suits
    you best.


    # Deleting tweets


    If you have shared more than you feel comfortable with, you can delete tweets
    up to a specified date with www.tweetdelete.net.


    # Tracking followers


    For keeping up to date with your follower list and seeing who unfollowed you,
    check out who.unfollowed.me – but remember not to take it personally!


    ![](img/ac5d888ab73738d97783942701b8a835_50_0.png)


    A word of warning – don’t use too many apps, and remove them later if you don’t
    need them to protect your account from hackers.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '> The issue of privacy on social networking sites Is a serious one: make sure
    you understand what you are using Twitter for and how far you need to protect
    yourself.


    ![](img/ac5d888ab73738d97783942701b8a835_51_0.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Privacy'
  merge: -1
  pgno: 52
- img_proc: true
  md: 'If you are using your own name, remember that everything you tweet can come
    back and haunt you. Deleting a tweet does not delete retweets, which may go on
    to be retweeted themselves. A disclaimer stating that the views expressed are
    your own and not those of your employer is a good idea, but this may not protect
    you completely. Be aware that anyone can sign up to Twitter and follow you.


    Don’t tweet anything that you are not prepared to defend. If you make a mistake,
    or inadvertently offend someone, apologise and move on.


    Discussion and arguments are a part of Twitter, but if someone crosses the line
    you can block him or her from reading or commenting on your tweets. You can also
    report a Twitter user if his or her behaviour strays from being offensive to being
    illegal.'
  merge: -1
  pgno: 53
- img_proc: true
  md: '![](img/ac5d888ab73738d97783942701b8a835_54_0.png)'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Account settings


    You can lock your account for added privacy, meaning that anyone who wishes to
    follow you will have to ask you first. Some people are reticent about sending
    a follow request to a locked account, so if you choose this option, be aware that
    you may not be able to build followers quite so easily.


    # Trolls


    Trolls are Internet users who deliberately post inflammatory comments in order
    to provoke a reaction. If you suspect someone is trolling, ignore or block him
    or her. It is always best not to engage with trolls.'
  merge: -1
  pgno: 55
