  md: '# Glossary/index


    **Direct Message** A privately sent tweet 39


    **Hashtag** A device to collate information about a topic 36


    **Favourite** To bookmark a tweet for referring back to later 35


    **Follow Friday** Recommend a user to followers by prefixing their user name with
    #ff 38


    **Mention** Using a user name within a tweet to refer to another Twitter user
    24


    **Modified Tweet (MT)** An altered retweet 32


    **Profile** Your short biography 12


    **Reply** Beginning a tweet with a username to reply to a comment 23


    **Retweet (RT)** To forward a tweet to your followers 28


    **Timeline** The stream of tweets from people follow 13


    **Trends** The current most talked-about topics on Twitter 37


    **Username** the name used to refer to a Twitter user, eg @LynnCSchiber 10'
