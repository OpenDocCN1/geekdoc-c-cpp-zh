  md: '# Friends and followers'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Following folk


    When you sign up, Twitter suggests people for to follow. These are usually celebrities
    or prolific Twitter users. Twitter verifies the accounts of famous people, so
    make sure there is a little blue tick next to the name.


    Just following celebrities can be boring, as they seldom follow back or reply
    to a tweet, so have a look for ordinary people to follow. Use the search box to
    find those tweeting about issues or hobbies that interest you, for example, rugby,
    physics or a genre of music you are keen on. Check out the profile and previous
    tweets of those people, and if they look particularly interesting, follow them
    – which goes to show how important it is to create an interesting profile.


    If you regularly read a newspaper, blog or magazine online, you can follow it
    on Twitter by clicking on the ‘Follow Me’ button on their website. You can search
    for your favourite journalists and writers, who are'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'often more likely to respond to their followers than celebrities. And if you
    have a favourite shop, restaurant or other business, you can follow it for special
    offers and news about its products.


    ![](img/ac5d888ab73738d97783942701b8a835_20_0.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Finding followers


    We all start with zero followers. Some people will go on to have thousands of
    followers, while others have only a handful. This should have no bearing on your
    enjoyment of Twitter: surely it is better to have 50 followers who share your
    interests, and reply to your tweets, than 5,000 followers who lurk silently and
    never communicate with you.


    When you start to follow people, they will receive an email informing them of
    a new follower. Once you start chatting to them, some will follow you back; if
    they don''t, it is nothing personal, so don''t be offended. Resist the temptation
    to ask them why, or beg them to follow you – it will only make you sound desperate!'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'Watch out for spambots, which are accounts created in order to advertise a
    product, or direct you to a particular website that may contain material that
    you might find offensive, or might harbour a nasty virus waiting to attack your
    computer. If a spambot looks suspicious, be careful not to click on any links,
    and have a look at its previous tweets to see if it tweets the same thing to everyone.
    Clicking on a link may enable it to hack your account, so keep well clear. Always
    block and report to keep Twitter safe for everyone.


    ![](img/ac5d888ab73738d97783942701b8a835_22_0.png)'
  merge: -1
  pgno: 22
- img_proc: true
  md: Now it's time to jump in and start tweeting!
