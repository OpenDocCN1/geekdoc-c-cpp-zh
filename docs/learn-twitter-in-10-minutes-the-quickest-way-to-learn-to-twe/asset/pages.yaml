  md: 'are addressing will see your tweet is to put a full stop at the beginning,
    which in effect converts the tweet into a mention rather than a reply:


    ![](img/ac5d888ab73738d97783942701b8a835_28_0.png)


    This opens the conversation to anyone who follows you:


    ![](img/ac5d888ab73738d97783942701b8a835_28_1.png)'
