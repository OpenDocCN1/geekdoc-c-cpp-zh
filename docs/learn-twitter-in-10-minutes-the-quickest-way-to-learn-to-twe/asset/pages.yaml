  md: '# # First tweets'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'First of all, don''t be shy. Twitter is made for dialogue, not monologue, and
    there is no such thing as interrupting a private conversation, although if you
    don''t already know the other users it is polite to start your tweet with ‘Sorry
    to butt in’ or similar.


    Twitter limits you to 140 characters, so you may have to be creative if you are
    usually fairly verbose. Try not to resort to text speak as not everyone understands
    it well.


    ![](img/ac5d888ab73738d97783942701b8a835_25_0.png)'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Tell us what is going on in your life


    ![](img/ac5d888ab73738d97783942701b8a835_26_0.png)


    (This is what most non-Twitterers think that Twitter users do, but in reality
    it might be slightly more interesting.) Everyone who follows you can see this.


    # Reply to a tweet


    ![](img/ac5d888ab73738d97783942701b8a835_26_1.png)


    Either hit the reply button, or type @ at the beginning to address that person,
    but be aware that those follow both you and the person you are addressing will
    also see the tweet.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Mention someone else


    Put an @ in the middle of a tweet and everyone who follows you will see the tweet,
    not just those who also follow the person you are addressing.


    ![](img/ac5d888ab73738d97783942701b8a835_27_0.png)


    (Note the different names and Usernames of Bill Boring and Lynn Schreiber, as
    explained on page 10.)


    When replying to a tweet, another way of ensuring that people who follow both
    you and the person you'
