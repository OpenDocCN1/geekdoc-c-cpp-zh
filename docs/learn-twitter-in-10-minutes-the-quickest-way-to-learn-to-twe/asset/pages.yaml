  md: '# Using Twitter for business'
  merge: -1
  pgno: 58
- img_proc: true
  md: '+   - Don’t do it half-heartedly: this is not a job for the office junior,
    just because she is young and will understand this new-fangled Twitter thing.
    Rather it is a project for an employee or agency who understands your brand, knows
    your products and how to sell them, and is able to check the Twitter account regularly
    throughout the day.


    +   - Do it with humour: allow whoever is responsible to communicate openly and
    warmly with your customers, instead of behaving like a corporate robot.


    +   - Post regularly: nothing turns a customer off more than a Twitter account
    that hasn’t been updated for weeks.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '+   - Set up a standard Twitter search for mentions of your product so that
    you can respond to anyone talking about them.


    +   - Remember that you cannot control Twitter, as some well-known companies have
    found to their detriment. When a derogatory Twitter #hashtag is created by disgruntled
    customers, it is referred to as a ‘bashtag’.


    ![](img/ac5d888ab73738d97783942701b8a835_60_0.png)'
