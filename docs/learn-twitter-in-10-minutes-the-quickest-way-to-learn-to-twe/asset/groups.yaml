  - '[PAGE 10]


    Welcome to Twitter! It looks a bit confusing, doesn’t it? It is actually very
    simple – take ten minutes to read this book and you''ll see for yourself.


    Twitter was founded in 2006 and within a year 400,000 tweets were posted each
    quarter. Fast-forward three years and 50 million tweets were posted in a day,
    and by 2012 an incredible 400 million messages a day were being tweeted.


    Twitter was initially used by private individuals to share status updates, but
    soon the true strength of the network was realized: companies use it to reach
    out to their customers, governments use it to reach out to their citizens, and
    activists use it to organize campaigns and spread awareness.


    ![](img/ac5d888ab73738d97783942701b8a835_10_0.png)'
  - '[PAGE 11]


    @noviceteeter Feeling a bit unsure about this Twitter thing...'
  - '[PAGE 12]


    # Getting started'
  - '[PAGE 13]


    Your first impression of Twitter might be the feeling of reading several disjointed
    conversations, peppered with strange abbreviations and symbols, but fear not,
    this is about to change!


    When you first visit Twitter – at www.twitter.com – you will be asked to sign
    up, giving your name, an email address and a password.


    When you click ‘Sign up for Twitter’ you will be directed to a registration page
    that features the details you have given, a suggested Username (your ''@’ name)
    that is a variation on the names you have provided, and other suggestions for
    Usernames you might prefer. If you don’t like any of Twitter’s Username suggestions,
    you can pick any name you like, but as there are so many Twitter users it might
    take a while before you find a good name that has not already been taken.'
  - '[PAGE 14]


    Remember that other people will be able to find you by name, Username or email
    address, although the latter will not be shown publicly, and you can disable this
    option later.


    You can make one, both or neither of your Twitter names your real name. Try to
    make your Username as short as possible, to leave more space for tweeting, and
    also make it memorable and eye-catching. If you choose a generic-sounding name,
    such as ‘@tracey1974’, then this might make it difficult for people searching
    for you.


    On this page you will also find links to the terms of Service and Privacy Policy.
    Although these are long, boring and full of legal-type jargon, it is worth having
    a look so you know what you are signing up for!


    ❦


    Once you have signed up there is a tutorial to get you started. First this will
    make suggestions about people and organizations you might want to follow, and
    then it will ask you for your profile.'
  - '[PAGE 15]


    As well as these details, be brave and add a photo. If you are shy, then a photo
    of scenery or a blog logo will do, but in general people respond better to a face
    – don’t leave the Twitter egg as it marks you as a novice.'
  - '[PAGE 16]


    Adding a photo is easy. On the Twitter website, locate the small grey camera icon
    at the bottom left-hand corner of the text box in which you write your tweets:
    click to open your files, choose a photo, and voilà!


    Your ''timeline'' is the stream of tweets from people you follow. Now you are
    ready to find some folk to follow and fill that timeline.


    ![](img/ac5d888ab73738d97783942701b8a835_16_0.png)'
  - '[PAGE 17]


    > Twitter is all about information and communication: you can tell people what
    you are doing or thinking and find out what other individuals/companies/organizations
    are up to.'
  - '[PAGE 18]


    # Friends and followers'
  - '[PAGE 19]


    # Following folk


    When you sign up, Twitter suggests people for to follow. These are usually celebrities
    or prolific Twitter users. Twitter verifies the accounts of famous people, so
    make sure there is a little blue tick next to the name.


    Just following celebrities can be boring, as they seldom follow back or reply
    to a tweet, so have a look for ordinary people to follow. Use the search box to
    find those tweeting about issues or hobbies that interest you, for example, rugby,
    physics or a genre of music you are keen on. Check out the profile and previous
    tweets of those people, and if they look particularly interesting, follow them
    – which goes to show how important it is to create an interesting profile.


    If you regularly read a newspaper, blog or magazine online, you can follow it
    on Twitter by clicking on the ‘Follow Me’ button on their website. You can search
    for your favourite journalists and writers, who are'
  - '[PAGE 20]


    often more likely to respond to their followers than celebrities. And if you have
    a favourite shop, restaurant or other business, you can follow it for special
    offers and news about its products.


    ![](img/ac5d888ab73738d97783942701b8a835_20_0.png)'
  - '[PAGE 21]


    # Finding followers


    We all start with zero followers. Some people will go on to have thousands of
    followers, while others have only a handful. This should have no bearing on your
    enjoyment of Twitter: surely it is better to have 50 followers who share your
    interests, and reply to your tweets, than 5,000 followers who lurk silently and
    never communicate with you.


    When you start to follow people, they will receive an email informing them of
    a new follower. Once you start chatting to them, some will follow you back; if
    they don''t, it is nothing personal, so don''t be offended. Resist the temptation
    to ask them why, or beg them to follow you – it will only make you sound desperate!'
  - '[PAGE 22]


    Watch out for spambots, which are accounts created in order to advertise a product,
    or direct you to a particular website that may contain material that you might
    find offensive, or might harbour a nasty virus waiting to attack your computer.
    If a spambot looks suspicious, be careful not to click on any links, and have
    a look at its previous tweets to see if it tweets the same thing to everyone.
    Clicking on a link may enable it to hack your account, so keep well clear. Always
    block and report to keep Twitter safe for everyone.


    ![](img/ac5d888ab73738d97783942701b8a835_22_0.png)'
  - '[PAGE 23]


    Now it''s time to jump in and start tweeting!'
  - '[PAGE 24]


    # # First tweets'
  - '[PAGE 25]


    First of all, don''t be shy. Twitter is made for dialogue, not monologue, and
    there is no such thing as interrupting a private conversation, although if you
    don''t already know the other users it is polite to start your tweet with ‘Sorry
    to butt in’ or similar.


    Twitter limits you to 140 characters, so you may have to be creative if you are
    usually fairly verbose. Try not to resort to text speak as not everyone understands
    it well.


    ![](img/ac5d888ab73738d97783942701b8a835_25_0.png)'
- md: '

    # Tell us what is going on in your life


    ![](img/ac5d888ab73738d97783942701b8a835_26_0.png)


    (This is what most non-Twitterers think that Twitter users do, but in reality
    it might be slightly more interesting.) Everyone who follows you can see this.


    # Reply to a tweet


    ![](img/ac5d888ab73738d97783942701b8a835_26_1.png)


    Either hit the reply button, or type @ at the beginning to address that person,
    but be aware that those who follow both you and the person you are addressing
    will also see the tweet.


    # Mention someone else


    Put an @ in the middle of a tweet and everyone who follows you will see the tweet,
    not just those who also follow the person you are addressing.


    ![](img/ac5d888ab73738d97783942701b8a835_27_0.png)


    (Note the different names and Usernames of Bill Boring and Lynn Schreiber, as
    explained on page 10.)


    When replying to a tweet, another way of ensuring that people who follow both
    you and the person you are addressing will see your tweet is to put a full stop
    at the beginning, which in effect converts the tweet into a mention rather than
    a reply:


    ![](img/ac5d888ab73738d97783942701b8a835_28_0.png)


    This opens the conversation to anyone who follows you:


    ![](img/ac5d888ab73738d97783942701b8a835_28_1.png)


    What do RT, MT and #FF mean? What is a DM? What is # and how do I use it? Once
    you master Twitter language, it all becomes much easier to interpret.


    ![](img/ac5d888ab73738d97783942701b8a835_29_0.png)


    ## Advanced tweeting


    ### How to retweet


    Retweeting (RT for short) is used to pass on a tweet to your followers. It may
    be that you enjoyed the linked article, or the tweet was so funny/horrifying/offensive
    that you want your followers to read it too.


    You can retweet without adding a comment, but this generally implies that you
    agree with the comment that you are retweeting.


    ![](img/ac5d888ab73738d97783942701b8a835_31_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_32_0.png)


    ### Retweeting and adding a comment


    If you use a Twitter ''client'' (see page 44) or a Twitter mobile phone app, you
    can add a comment to a RT.


    ![](img/ac5d888ab73738d97783942701b8a835_33_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_33_1.png)


    ![](img/ac5d888ab73738d97783942701b8a835_34_0.png)


    ### Modified tweets


    Sometimes you may want to change a tweet slightly, shorten it so that you can
    add your comment, or correct a spelling mistake. The use of MT for ‘modified tweet’
    shows that the original tweet was slightly different.


    ![](img/ac5d888ab73738d97783942701b8a835_35_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_35_1.png)


    ### Quoting tweets


    You might also sometimes see a tweet quoted using quotation marks.


    ![](img/ac5d888ab73738d97783942701b8a835_36_0.png)


    Be brave and add your opinion when you retweet or quote tweets, as this encourages
    others to respond to you, and may net you some new followers.


    But don''t overdo the reteting. A timeline full of retweeted comments and links
    is unlikely to persuade a potential follower to click that magic Follow button.


    ### Recommending links


    You can also pass on a link or story and credit the person who first tweeted it:


    ![](img/ac5d888ab73738d97783942701b8a835_37_0.png)


    ### ‘Favouriting’ tweets


    The ‘Favourite’ button allows you to bookmark tweets that you want to read again
    later, when you have more time. It is also handy if you don’t have time to reply
    but want to remind yourself to comment on a tweet later.


    ![](img/ac5d888ab73738d97783942701b8a835_38_0.png)


    ## Hashtags (#)


    A hashtag or ''#’ is a way of collating information about a particular topic.
    Use a hashtag before key words or phrases to make them easier to find. This can
    range from a television show, e.g. #xfactor, to a sporting event such as, #olympics
    or #worldcup. Don’t overdo it with hashtags – one or two are enough in any one
    tweet.


    Hashtags have been used during important world events such as elections and revolutions
    – the Arab Spring hashtags, such as #egypt, #jan25 and #egyelection, are particularly
    good examples of how hashtags can help to collate information.


    Hashtags are also used for humorous or ironic effect, for example in tweets like,
    ‘I went to the dentist today #ow’ or ‘Making the most of my day off #sittingarounddoingnothing’.


    ## Trending


    When something is trending, it is one of the most talked-about topics on Twitter,
    often collated by using a #hashtag. Trending topics can be ridiculous, such as
    #ilovemydog, or world-changing, such as the Arab Spring hashtags, or an important
    national event like #GeneralElection. You can check what is trending both nationally
    and internationally.


    Twitter allows companies to pay for sponsored tweets, which results in artificially
    trending topics, though these are clearly marked.


    Twitter tailors your trends, so you see trends based on your location and followers.
    To see worldwide or country-based tweets, click the #Discover tag on web-based
    Twitter.


    ![](img/ac5d888ab73738d97783942701b8a835_40_0.png)


    ## Follow Friday


    #FF is short for #FollowFriday, a Twitter trend created back in 2009 by Twitter
    users that has since become a customary activity. Each Friday you can recommend
    people you enjoy.


    - Use #FF to find new people.

    - Use Twitter whenever you have a spare minute, under the table at a boring meeting.

    - On public transport or when waiting for a friend to turn up.

    - Check out #tubweets on your phone.


    ![](img/ac5d888ab73738d97783942701b8a835_41_0.png)


    ### Direct messages


    A DM or ''direct message'' is a tweet sent privately. You can send a DM if you
    want to chat, but be aware that only you and the person you are messaging will
    see it. Don''t use it for spam, as it may get you unfollowed.


    ![](img/ac5d888ab73738d97783942701b8a835_42_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_43_0.png)


    ## Lists


    After a while, you may be following many people that your timeline moves too fast
    to keep up. This is where lists come handy. Categorize those into groups, e.g.
    ‘work’, ‘news’, ‘fun’. You can share these lists or keep them private. Flicking
    back and forth between lists on the Twitter website can be slightly annoying,
    so use an app to see your lists at a glance.


    ![](img/ac5d888ab73738d97783942701b8a835_46_0.png)


    ### Twitter clients


    Software that was developed to host Twitter accounts called ''Twitter clients''
    enable you to switch between several accounts, e.g. business and private. Tweetdeck
    and Hootsuite are popular, but they update and change constantly, so ask your
    followers for their recommendation.


    ### Mobile Twitter apps


    The sheer brilliance of Twitter becomes most apparent when it is used on the go.
    Download one of the many apps on your phone or tablet, and tweet whenever you
    have a spare minute. Whether under the table at a boring meeting, on public transport
    or when waiting for a friend to turn up, with Twitter on your phone you are never
    alone.


    ![](img/ac5d888ab73738d97783942701b8a835_48_0.png)


    ## Apps for clever stuff


    There are lots of apps available to help you enhance your Twitter experience.
    These change almost daily, but here are some of the main functions you will be
    able to find apps for.


    ![](img/ac5d888ab73738d97783942701b8a835_49_0.png)


    ### Twitter photos


    There are various apps for sharing photos. Check them out and find which one suits
    you best.


    ### Deleting tweets


    If you have shared more than you feel comfortable with, you can delete tweets
    up to a specified date with www.tweetdelete.net.


    # Tracking followers


    For keeping up to date with your follower list and seeing who unfollowed you,
    check out who.unfollowed.me – but remember not to take it personally!

    '
  mdcn: '


    # 告诉我们你的生活近况


    ![](img/ac5d888ab73738d97783942701b8a835_26_0.png)


    （这是大多数非 Twitter 用户认为 Twitter 用户在做的事情，但实际上可能稍微有趣一点。）每一个关注你的人都能看到这些。


    # 回复推文


    ![](img/ac5d888ab73738d97783942701b8a835_26_1.png)


    可以点击回复按钮，或者在开头输入 @ 来称呼那个人，但请注意，同时关注你和你被称呼那个人的人也会看到这条推文。


    # 提及他人


    在推文中间放入一个 @，所有关注你的人都会看到这条推文，而不仅仅是那些也关注被称呼者的人。


    ![](img/ac5d888ab73738d97783942701b8a835_27_0.png)


    （注意第 10 页解释的 Bill Boring 和 Lynn Schreiber 的不同名称和用户名。）


    在回复推文时，另一种确保同时关注你和你被称呼者的人能看到你推文的方法是在开头加一个句号，这在实际上将推文转换成了“提及”而非“回复”：


    ![](img/ac5d888ab73738d97783942701b8a835_28_0.png)


    这让任何关注你的人都能参与对话：


    ![](img/ac5d888ab73738d97783942701b8a835_28_1.png)


    RT、MT 和 #FF 是什么意思？DM 是什么？# 是什么，我该如何使用它？一旦你掌握了 Twitter 语言，这一切都会变得容易解释得多。


    ![](img/ac5d888ab73738d97783942701b8a835_29_0.png)


    ## 高级推文


    ### 如何转发推文


    转发（简称为 RT）用于将推文传递给你的关注者。可能是因为你喜欢链接中的文章，或者该推文太幽默/恐怖/冒犯，让你你的关注者也读读它。


    你可以在不添加评论的情况下转发，但这通常意味着你同意你正在转发的某条评论。


    ![](img/ac5d888ab73738d97783942701b8a835_31_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_32_0.png)


    ### 转发并添加评论


    如果你使用 Twitter “客户端”（见第 44 页）或 Twitter 手机应用，你可以在 RT 上添加评论。


    ![](img/ac5d888ab73738d97783942701b8a835_33_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_33_1.png)


    ![](img/ac5d888ab73738d97783942701b8a835_34_0.png)


    ### 修改过的推文


    有时你可能想稍微更改推文，将其缩短以便添加你的评论，或者纠正拼写错误。使用 MT 表示“修改过的推文”，显示了原始推文略有不同。


    ![](img/ac5d888ab73738d97783942701b8a835_35_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_35_1.png)


    ### 引用推文


    你有时也可能会看到使用引号引用的推文。


    ![](img/ac5d888ab73738d97783942701b8a835_36_0.png)


    在转转发或引用推文时，要勇敢地加入你的观点，因为这会鼓励他人回应你，并可能为你带来一些新粉丝。


    但不要过度转发。一个充斥着转发评论和链接的时间线不太可能说服潜在的粉丝点击那个神奇的“关注（Follow）”按钮。


    ### 推荐链接


    你也可以传递链接或故事，并注明第一个发布该内容的推文者：


    ![](img/ac5d888ab73738d97783942701b8a835_37_0.png)


    ### “收藏”推文


    “收藏（Favourite）”按钮允许你收藏以后在更有时间时想再次阅读的推文。如果你没有时间回复但想提醒自己以后对某条推文进行评论，这也非常方便。


    ![](img/ac5d888ab73738d97783942701b8a835_38_0.png)


    ## 标签 (#)


    标签（hashtag）或“#”是整理关于特定主题信息的一种。在关键词或短语之前使用标签，使其更容易被找到。这可以从电视节目，例如 #xfactor，到体育赛事，如
    #olympics 或 #worldcup。不要过度使用标签——在任何一条推文中，一或两个就足够了。


    标签已用于重要的世界事件，如选举和革命——阿拉伯之春的标签，如 #egypt、#jan25 和 #egyelection，是标签如何帮助整理信息的极佳例子。


    标签也用于产生幽默或讽刺的效果，例如在像这样的推文中：“我今天去去看牙医了 #好疼”或“充分利用我的休息日 #坐着无所事事”。


    ## 趋势


    当某件事成为热门趋势时，它是 Twitter 上被讨论最多的话题之一，通常通过使用 #标签来汇总。热门话题可能是荒谬的，例如 #ilovemydog，或者是改变世界的，如阿拉伯之春的标签，或者是重要的国家事件如
    #GeneralElection。你可以查看国内和国际的趋势。


    Twitter 允许公司支付赞助推文，这会导致人为的热门话题，尽管这些会有明显的标记。


    Twitter 为你定制趋势，因此你会看到基于你的位置和关注者的趋势。要查看全球或基于地区的推文，请点击网页版 Twitter 上的 #Discover 标签。


    ![](img/ac5d888ab73738d97783942701b8a835_40_0.png)


    ## 周五关注 (Follow Friday)


    #FF 是 #FollowFriday 的缩写，这是一个在 2009 年创建的 Twitter 趋势，已成为惯性活动。每个周五推荐你：


    - 每个周五推荐你喜欢的人

    - 在无聊的会议桌下时使用 #FF

    - 在公共交通工具上或等待朋友时

    - 在手机上查看这些推文


    ![](img/ac5d888ab73738d97783942701b8a835_41_0.png)


    ### 私信 (DM)


    DM 或“私信”是发送的私人推文。如果你想聊天可以发送 DM，但请注意只有你和你消息的对象能看到。不要用它发送垃圾信息，否则可能会被取消关注。


    ![](img/ac5d888ab73738d97783942701b8a835_42_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_43_0.png)


    ## 列表


    久而久之，你可能会关注很多人，时间线快到跟不上。这时列表就很有用了。将他们分组，例如“工作”、“新闻”、“娱乐”。你可以分享这些列表，也可以保持私密。在 Twitter
    网站上切换列表可能很麻烦，所以使用 App 一目了然地查看。


    ![](img/ac5d888ab73738d97783942701b8a835_46_0.png)


    ### Twitter 客户端


    用于托管 Twitter 账号的软件被称为客户端允许你切换多个账号，例如业务和私人。Tweetdeck 和 Hootsuite 非常流行，但它们不断更新，所以请向你的粉丝咨询。


    ### 移动 Twitter 应用


    Twitter 的魅力在移动时最为明显。在手机或平板电脑上下载一个应用，在无聊的会议桌下、在公共交通工具上或等待朋友时随时发布。只要手机上有 Twitter，你就永远不孤单。


    ![](img/ac5d888ab73738d97783942701b8a835_48_0.png)


    ## 各种功能的 App


    有很多应用可以帮助增强你的 Twitter 体验。这些应用几乎每天更新，但这里是你可以找到的一些主要功能。


    ![](img/ac5d888ab73738d97783942701b8a835_49_0.png)


    ### Twitter 照片


    有各种分享照片的应用。查看它们并找到最适合你的一个。


    ### 删除推文


    如果你分享了超过你感到舒适的内容，可以通过 www.tweetdelete.net 删除指定日期之前的推文。


    # 粉丝追踪


    为了跟进粉丝列表并查看谁取消了关注，请查看 who.unfollowed.me —— 但记住不要介意！


    '
