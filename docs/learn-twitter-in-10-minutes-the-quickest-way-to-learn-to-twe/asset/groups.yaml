    # Finding followers


    If you have a favourite shop, restaurant or other business, you can follow it
    for special offers and news.


    ![](img/ac5d888ab73738d97783942701b8a835_20.png)


    # Finding followers


    We all start with zero followers. Some people will go on to have thousands, while
    others have only a handful. This should have no bearing on your enjoyment of Twitter:
    surely it is better to have 50 followers who share your interests, than 5,000
    followers who lurk silently and never communicate with you.


    When you start to follow people, they will receive an email informing them of
    a new follower. Once you start chatting to them, some will follow back; if they
    don''t, it is nothing personal, so don''t be offended. Resist the temptation to
    ask them why, or beg them to follow – it will only make you sound desperate!


    Watch out for spambots, which are accounts created in order to advertise a product,
    or direct you to a particular website that may contain material that you might
    find offensive, or might harbour a nasty virus waiting to attack your computer.
    If a spambot looks suspicious, be careful not to click on any links, and have
    a look at previous tweets to see if it tweets the same thing to everyone. Clicking
    on a link may enable it to hack your account, so keep well clear. Always block
    and report to keep Twitter safe for everyone.


    # First tweets


    Now it''s time to jump in and start tweeting!


    # # First tweets


    First of all, don''t be shy. Twitter is made for dialogue, not monologue, and
    there is no such thing as interrupting a private conversation, although if you
    don''t already know the other users it is polite to start your tweet with ‘Sorry
    to butt in’ or similar.


    Twitter limits you to 140 characters, so you may have to be creative if you are
    usually fairly verbose. Try not to resort to text speak as not everyone understands
    it well.

