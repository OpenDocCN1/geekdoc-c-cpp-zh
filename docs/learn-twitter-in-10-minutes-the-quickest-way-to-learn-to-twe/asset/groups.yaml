    or inadvertently offend someone, apologise and move on.


    Discussion and arguments are a part of Twitter, but if someone crosses the line
    you can block him or her from reading or commenting on your tweets. You can also
    report a Twitter user if his or her behaviour strays from being offensive to being
    illegal.'
  - '[PAGE 54]


    ![](img/ac5d888ab73738d97783942701b8a835_54_0.png)'
  - '[PAGE 55]


    # Account settings


    You can lock your account for added privacy, meaning that anyone who wishes to
    follow you will have to ask you first. Some people are reticent about sending
    a follow request to a locked account, so if you choose this option, be aware that
    you may not be able to build followers quite so easily.


    # Trolls


    Trolls are Internet users who deliberately post inflammatory comments in order
    to provoke a reaction. If you suspect someone is trolling, ignore or block him
    or her. It is always best not to engage with trolls.'
  - '[PAGE 56]


    ![](img/ac5d888ab73738d97783942701b8a835_56_0.png)'
  - '[PAGE 57]


    This is a very big topic, but as we only have ten minutes, here is a quick summary.


    ![](img/ac5d888ab73738d97783942701b8a835_57_0.png)'
  - '[PAGE 58]


    # Using Twitter for business'
  - '[PAGE 59]


    +   - Don’t do it half-heartedly: this is not a job for the office junior, just
    because she is young and will understand this new-fangled Twitter thing. Rather
    it is a project for an employee or agency who understands your brand, knows your
    products and how to sell them, and is able to check the Twitter account regularly
    throughout the day.


    +   - Do it with humour: allow whoever is responsible to communicate openly and
    warmly with your customers, instead of behaving like a corporate robot.


    +   - Post regularly: nothing turns a customer off more than a Twitter account
    that hasn’t been updated for weeks.'
  - '[PAGE 60]


    +   - Set up a standard Twitter search for mentions of your product so that you
    can respond to anyone talking about them.


    +   - Remember that you cannot control Twitter, as some well-known companies have
    found to their detriment. When a derogatory Twitter #hashtag is created by disgruntled
    customers, it is referred to as a ‘bashtag’.


    ![](img/ac5d888ab73738d97783942701b8a835_60_0.png)'
  - '[PAGE 61]


    Here are some dos and don''ts for Twitter users so you can maximize your fun and
    your number of followers.'
  - '[PAGE 62]


    # # How to make the most of Twitter'
  - '[PAGE 63]


    # Do


    +   * Be polite and helpful.

    * Reply when someone @mentions you.

    * Give credit when you retweet – passing off someone else’s jokes as your own
    is a big no-no.

    * Thank others for retweeting your tweets and for #FF (but don’t do a mass thanks
    for #FF).

    * Remember basic Internet safety rules.

    * If you are not sure of something, just ask. There will always be someone around
    to help you out.'
  - '[PAGE 64]


    # Don’t


    +   - Be taken in by ‘Get More Followers’ schemes or groups. Follow people because
    you are interested in what they have to say, not to amass thousands of followers.


    +   - Only follow celebrities, most of whom don’t reply.


    +   - Use an app to find out who unfollowed you, and then ask them why.


    +   - Just use Twitter to link to your blog or website, without interacting with
    your followers.


    +   - Give up after a day, saying ‘Boring!’ Like so many things, you will get
    out what you put in, so persevere!


    ![](img/ac5d888ab73738d97783942701b8a835_64_0.png)'
  - '[PAGE 65]


    # Five fab things about Twitter


    +   1. Watching TV becomes a social event when your timeline is full of people
    discussing the programme you are watching.


    2. Finding the answer to an obscure question takes minutes of interaction with
    real people, instead of hours of Internet searching.


    3. Keeping up to date with news and gossip is as easy as one-two-tweet.


    4. When it is your birthday, your timeline is filled with good wishes and virtual
    pints of beer/glasses of wine.


    5. Twitter knows no borders. You can exchange sushi recipes with a tweep in Japan,
    talk to an American about car racing, then ask an Australian for barbecue tips.
    All without leaving your armchair!'
  - '[PAGE 66]


    Right, your ten minutes are up – are you ready to go and share your thoughts in
    140 characters and find out what''s trending?


    Off you go and happy tweeting!


    ![](img/ac5d888ab73738d97783942701b8a835_66_0.png)'
  - '[PAGE 67]


    # Glossary/index


    **Direct Message** A privately sent tweet 39


    **Hashtag** A device to collate information about a topic 36


    **Favourite** To bookmark a tweet for referring back to later 35


    **Follow Friday** Recommend a user to followers by prefixing their user name with
    #ff 38


    **Mention** Using a user name within a tweet to refer to another Twitter user
    24


    **Modified Tweet (MT)** An altered retweet 32


    **Profile** Your short biography 12


    **Reply** Beginning a tweet with a username to reply to a comment 23


    **Retweet (RT)** To forward a tweet to your followers 28


    **Timeline** The stream of tweets from people follow 13


    **Trends** The current most talked-about topics on Twitter 37


    **Username** the name used to refer to a Twitter user, eg @LynnCSchiber 10'
  - '[PAGE 68]


