  - '[PAGE 26]


    # Tell us what is going on in your life


    ![](img/ac5d888ab73738d97783942701b8a835_26_0.png)


    (This is what most non-Twitterers think that Twitter users do, but in reality
    it might be slightly more interesting.) Everyone who follows you can see this.


    # Reply to a tweet


    ![](img/ac5d888ab73738d97783942701b8a835_26_1.png)


    Either hit the reply button, or type @ at the beginning to address that person,
    but be aware that those follow both you and the person you are addressing will
    also see the tweet.'
  - '[PAGE 27]


    # Mention someone else


    Put an @ in the middle of a tweet and everyone who follows you will see the tweet,
    not just those who also follow the person you are addressing.


    ![](img/ac5d888ab73738d97783942701b8a835_27_0.png)


    (Note the different names and Usernames of Bill Boring and Lynn Schreiber, as
    explained on page 10.)


    When replying to a tweet, another way of ensuring that people who follow both
    you and the person you'
  - '[PAGE 28]


    are addressing will see your tweet is to put a full stop at the beginning, which
    in effect converts the tweet into a mention rather than a reply:


    ![](img/ac5d888ab73738d97783942701b8a835_28_0.png)


    This opens the conversation to anyone who follows you:


    ![](img/ac5d888ab73738d97783942701b8a835_28_1.png)'
  - '[PAGE 29]


    What do RT, MT and #FF mean? What is a DM? What is # and how do I use it? Once
    you master Twitter language, it all becomes much easier to interpret.


    ![](img/ac5d888ab73738d97783942701b8a835_29_0.png)'
  - '[PAGE 30]


    # # Advanced tweeting'
  - '[PAGE 31]


    # How to retweet


    Retweeting (RT for short) is used to pass on a tweet to your followers. It may
    be that you enjoyed the linked article, or the tweet was so funny/horrifying/offensive
    that you want your followers to read it too.


    You can retweet without adding a comment, but this generally implies that you
    agree with the comment that you are retweeting.


    ![](img/ac5d888ab73738d97783942701b8a835_31_0.png)'
  - '[PAGE 32]


    ![](img/ac5d888ab73738d97783942701b8a835_32_0.png)'
  - '[PAGE 33]


    # # Retweeting and adding a comment


    If you use a Twitter ''client'' (see page 44) or a Twitter mobile phone app, you
    can add a comment to a RT.


    ![](img/ac5d888ab73738d97783942701b8a835_33_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_33_1.png)'
  - '[PAGE 34]


    ![](img/ac5d888ab73738d97783942701b8a835_34_0.png)'
  - '[PAGE 35]


    # Modified tweets


    Sometimes you may want to change a tweet slightly, shorten it so that you can
    add your comment, or correct a spelling mistake. The use of MT for ‘modified tweet’
    shows that the original tweet was slightly different.


    ![](img/ac5d888ab73738d97783942701b8a835_35_0.png)


    ![](img/ac5d888ab73738d97783942701b8a835_35_1.png)'
  - '[PAGE 36]


    # Quoting tweets


    You might also sometimes see a tweet quoted using quotation marks.


    ![](img/ac5d888ab73738d97783942701b8a835_36_0.png)


    Be brave and add your opinion when you retweet or quote tweets, as this encourages
    others to respond to you, and may net you some new followers.


    But don''t overdo the reteting. A timeline full of retweeted comments and links
    is unlikely to persuade a potential follower to click that magic Follow button.'
  - '[PAGE 37]


    # Recommending links


    You can also pass on a link or story and credit the person who first tweeted it:


    ![](img/ac5d888ab73738d97783942701b8a835_37_0.png)


    # ‘Favouriting’ tweets


    The ‘Favourite’ button allows you to bookmark tweets that you want to read again
    later, when you have more time. It is also handy if you don’t have time to reply
    but want to remind yourself to comment on a tweet later.'
  - '[PAGE 38]


    ![](img/ac5d888ab73738d97783942701b8a835_38_0.png)'
  - '[PAGE 39]


    # Hashtags (#)


    A hashtag or ''#’ is a way of collating information about a particular topic.
    Use a hashtag before key words or phrases to make them easier to find. This can
    range from a television show, e.g. #xfactor, to a sporting event such as, #olympics
    or #worldcup. Don’t overdo it with hashtags – one or two are enough in any one
    tweet.


    Hashtags have been used during important world events such as elections and revolutions
    – the Arab Spring hashtags, such as #egypt, #jan25 and #egyelection, are particularly
    good examples of how hashtags can help to collate information.


    Hashtags are also used for humorous or ironic effect, for example in tweets like,
    ‘I went to the dentist today #ow’ or ‘Making the most of my day off #sittingarounddoingnothing’.'
  - '[PAGE 40]


    # Trending


    When something is trending, it is one of the most talked-about topics on Twitter,
    often collated by using a #hashtag. Trending topics can be ridiculous, such as
    #ilovemydog, or world-changing, such as the Arab Spring hashtags, or an important
    national event like #GeneralElection. You can check what is trending both nationally
    and internationally.


    Twitter allows companies to pay for sponsored tweets, which results in artificially
    trending topics, though these are clearly marked.


    Twitter tailors your trends, so you see trends based on your location and followers.
    To see worldwide or country-based tweets, click the #Discover tag on web-based
    Twitter.


    ![](img/ac5d888ab73738d97783942701b8a835_40_0.png)'
  - '[PAGE 41]


    # Follow Friday


    #FF is short for #FollowFriday, a Twitter trend created back in 2009 by Twitter
    users that has since become a customary Friday activity. Each Friday you can recommend
    Twitter profiles that you appreciate and enjoy to all of your followers, the idea
    that your #FF recommendation will encourage others to check out that profile,
    generating more followers for them.


    Don''t just list five people in one tweet, or even worse, use a #FF helper to
    pluck several random people from your follow list. Instead, tell your followers
    why you are recommending that they follow the person.


    ![](img/ac5d888ab73738d97783942701b8a835_41_0.png)'
  - '[PAGE 42]


    # Direct messages


    A DM or ''direct message'' is a tweet sent privately. You can only send a DM if
    you and the person you are messaging follow each other. A word of warning; don''t
    set up an automatic DM to thank people for following you, as it can be viewed
    as spam and may get you swiftly unfollowed.


    ![](img/ac5d888ab73738d97783942701b8a835_42_0.png)'
  - '[PAGE 43]


    ![](img/ac5d888ab73738d97783942701b8a835_43_0.png)'
  - '[PAGE 44]


    # Little Twitter helpers'
  - '[PAGE 45]


    # Lists


    After a while, you may be following so many people that your timeline moves too
    fast for you to keep up with it. This is where lists come handy. Categorize those
    you follow into groups, e.g. ‘work’, ‘news’, ‘fun’, ‘people for chatting’, ‘knitters’,
    ‘rugby tweeps’, etc. (More Twitter lingo – ‘tweep’ is a shortened version of ‘Twitter’
    and ‘Peeps’, so a rugby tweep is someone that follows rugby on Twitter.) You can
    share these lists or keep them private.


    Flicking back and forth between lists on the Twitter website can be slightly annoying,
    so now is a good time to look into different Twitter clients that enable you to
    see your lists at a glance.'
  - '[PAGE 46]


    ![](img/ac5d888ab73738d97783942701b8a835_46_0.png)'
  - '[PAGE 47]


    # Twitter clients


    Software that was developed to host Twitter accounts called ''Twitter clients''
    enable you to switch between several Twitter accounts, e.g. business and private,
    often in columns across your computer screen. Tweetdeck and Hootsuite are popular,
    but they update and change constantly, so ask your followers for their current
    recommendation.


    # Mobile Twitter apps


    The sheer brilliance of Twitter becomes most apparent when it is used on the go.
    Download one of the many apps on your phone or tablet, and tweet whenever you
    have a spare minute. Whether under the table at a boring meeting, on public transport
    (check out #tubetweets) or when waiting for a friend to turn up, with Twitter
    on your phone you are never alone.'
  - '[PAGE 48]


    ![](img/ac5d888ab73738d97783942701b8a835_48_0.png)'
  - '[PAGE 49]


    # Apps for clever stuff


    There are lots of apps available to help you enhance your Twitter experience.
    These change almost daily, but here are some of the main functions you''ll be
    able to find apps for.


    ![](img/ac5d888ab73738d97783942701b8a835_49_0.png)'
  - '[PAGE 50]


    # Twitter photos


    There are various apps for sharing photos. Check them out and find which one suits
    you best.


    # Deleting tweets


    If you have shared more than you feel comfortable with, you can delete tweets
    up to a specified date with www.tweetdelete.net.


    # Tracking followers


    For keeping up to date with your follower list and seeing who unfollowed you,
    check out who.unfollowed.me – but remember not to take it personally!


    ![](img/ac5d888ab73738d97783942701b8a835_50_0.png)


    A word of warning – don’t use too many apps, and remove them later if you don’t
    need them to protect your account from hackers.'
