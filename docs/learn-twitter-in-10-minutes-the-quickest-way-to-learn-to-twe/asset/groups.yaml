  mdcn: '


    社交网站上的隐私问题是一个严肃的问题：请确保你理解自己使用 Twitter 的目的，以及你需要保护自己到什么程度。


    ![](img/ac5d888ab73738d97783942701b8a835_51_0.png)


    # 隐私


    如果你使用自己的真实，请记住你发布的每条推文都可能反噬并困扰你。删除推文并不会删除转推，而这些转推本身可能会继续被转发。发布一份声明说明你表达的观点仅代表你个人而非你的雇主，是一个好主意，但这可能无法完全保护你。请注意，任何人都可以注册
    Twitter 并关注你。


    不要发布任何你未准备好去辩护的内容。如果你犯了错或无意中冒犯了某人，请道歉并继续。


    讨论和争论是 Twitter 的一部分，但如果有人越了界限，你可以阻止他们阅读或评论你的推文。如果某个 Twitter 用户的行为从冒犯演变为违法，你可以举报他们。


    ![](img/ac5d888ab73738d97783942701b8a835_54_0.png)


    # 账户设置


    你可以锁定账户以增加隐私性，这意味着任何想要关注你的人必须先向你申请。有些人对向锁定账户发送关注请求感到很顾虑，因此如果你选择此选项，请注意你可能无法那么容易地积累粉丝。


    # 喷子 (Trolls)


    喷子是指故意发布煽动性评论以引起反应的互联网用户。如果你怀疑有人在喷你，请忽略或屏蔽他们。最好的办法是不与喷子交涉。


    ![](img/ac5d888ab73738d97783942701b8a835_56_0.png)


    这是一个非常大的话题，但由于我们只有十分钟，这里有一个快速的总结。


    ![](img/ac5d888ab73738d97783942701b8a835_57_0.png)


    # 使用 Twitter 开展业务


    - 不要心不专事：这并不是办公室初级员工的工作，仅仅因为她年轻且会理解这个新奇的 Twitter 东西。相反，这应该是了解你的品牌、熟悉你的产品以及如何销售它们的员工或机构的项目，并且他们能够在全天候检查
    Twitter 账户。


    - 带着幽默感去做：让负责的人与客户进行开放温暖的沟通，而不是表现得像个企业机器人。


    - 定期发布：没有什么比几周未更新的 Twitter 账户更让客户反感了。


    - 设置标准的 Twitter 搜索，查找提及你产品的关键词，这样你就可以回应任何讨论这些产品的人。


    - 记住你无法控制 Twitter，正如一些知名公司所发现的那样，这对他们是有害。当不满的客户创建一个贬义的 Twitter #hashtag（标签）时，它被称为“黑粉标签”(bashtag)。


    ![](img/ac5d888ab73738d97783942701b8a835_60_0.png)


    以下是 Twitter 用户的一些要做和不要做的，以便你最大限度地获得乐趣和粉丝数量。


    ## 如何充分利用 Twitter


    ### 应该做的


    - 保持礼貌并乐于助人。

    - 当有人 @ 提到你时给予回复。

    - 在转推时注明出处——把别人的笑话当成自己的是大忌。

    - 感谢他人转推你的推文以及 #FF（关注周五）（但不要对 #FF 进行批量感谢）。

    - 记住基本的互联网安全规则。

    - 如果你对某事不确定，尽管问。总会有人在帮助你。


    ### 不要做的


    - 不要被“获取更多粉丝”的计划或群组欺骗。因为对他们说的话感兴趣而关注他人，而不是为了积累成千上万的粉丝。

    - 只关注名人，大多数人是不回复的。

    - 使用 App 查找谁取消了你的粉丝，然后问他们为什么。

    - 只用 Twitter 链接到你的博客或网站，而不与你的粉丝互动。

    - 只用了一天就放弃，并说“无聊！”。像很多事情一样，投入多少就有多少收获，所以请坚持！


    ![](img/ac5d888ab73738d97783942701b8a835_64_0.png)


    # 关于 Twitter 的五个棒点


    1. 当你的时间线充满了讨论你正在看的节目的人时，看电视变成了一场社交活动。

    2. 找到一个冷僻问题的答案只需与真人进行几分钟互动，而不是花费数小时在网上搜索。

    3. 跟进新闻和八卦就像发一两条推文一样简单。

    4. 当你过生日时，你的时间线充满了美好的祝福和虚拟的啤酒/葡萄酒杯。

    5. Twitter 没有国界。你可以与日本的 Twitter 用户交流寿司食谱，与美国人谈论赛车，然后向澳大利亚人请教烧烤技巧。这一切无需离开你的沙发椅！


    好了，你的十分钟结束了——你准备好去用 140 个字符分享你的想法并看看现在的趋势是什么了吗？


    去去吧，祝推特愉快！


    ![](img/ac5d888ab73738d97783942701b8a835_66_0.png)


    # 词汇表/索引


    **Direct Message (私信)** 一条私下发送的推文 39


    **Hashtag (标签)** 用于汇总有关某一主题信息的工具 36


    **Favourite (收藏)** 将推文加签以便日后查阅 35


    **Follow Friday (关注周五)** 通过在用户名字前加上 #ff 向粉丝推荐用户 38


    **Mention (提到)** 在推文中使用用户名指代另一个 Twitter 用户 24


    **Modified Tweet (MT) (修改过的推文)** 一条被更改过的转推 32


    **Profile (个人资料)** 你的短传 12


    **Reply (回复)** 以用户名开头推文以回复评论 23


    **Retweet (RT) (转推)** 将一条推文转发给你的粉丝 28


    **Timeline (时间线)** 你关注的人所发布的推文流 13


    **Trends (趋势)** 当前最受讨论的话题 37


    **Username (用户名)** 用于指代 Twitter 用户的名字，例如 @LynnCSiber 10


    '
