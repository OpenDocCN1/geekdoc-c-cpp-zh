    ![](img/ac5d888ab73738d97783942701b8a835_9_0.png)


    Welcome to Twitter! It looks a bit confusing, doesn’t it? It is actually very
    simple – take ten minutes to read this book and you''ll see for yourself.


    Twitter was founded in 2006 and within a year 400,000 tweets were posted each
    quarter. Fast-forward three years and 50 million tweets were posted in a day,
    and by 2012 an incredible 400 million messages a day were being tweeted.


    Twitter was initially used by private individuals to share status updates, but
    soon the true strength of the network was realized: companies use it to reach
    out to their customers, governments use it to reach out to their citizens, and
    activists use it to organize campaigns and spread awareness.


    ![](img/ac5d888ab73738d97783942701b8a835_10_0.png)


    @noviceteeter Feeling a bit unsure about this Twitter thing...


    # Getting started


    Your first impression of Twitter might be the feeling of reading several disjointed
    conversations, peppered with strange abbreviations and symbols, but fear not,
    this is about to change!


    When you first visit Twitter – at www.twitter.com – you will be asked to sign
    up, giving your name, an email address and a password.


    When you click ‘Sign up for Twitter’ you will be directed to a registration page
    that features the details you have given, a suggested Username (your ''@’ name)
    that is a variation on the names you have provided, and other suggestions for
    Usernames you might prefer. If you don’t like any of Twitter’s Username suggestions,
    you can pick any name you like, but as there are so many Twitter users it might
    take a while before you find a good name that has not already been taken.


    Remember that other people will be able to find you by name, Username or email
    address, although the latter will not be shown publicly, and you can disable this
    option later.


    You can make one, both or neither of your Twitter names your real name. Try to
    make your Username as short as possible, to leave more space for tweeting, and
    also make it memorable and eye-catching. If you choose a generic-sounding name,
    such as ‘@tracey1974’, then this might make it difficult for people searching
    for you.


    On this page you will also find links to the terms of Service and Privacy Policy.
    Although these are long, boring and full of legal-type jargon, it is worth having
    a look so you know what you are signing up for!


    ❦


    Once you have signed up there is a tutorial to get you started. First this will
    make suggestions about people and organizations you might want to follow, and
    then it will ask you for your profile.


    As well as these details, be brave and add a photo. If you are shy, then a photo
    of scenery or a blog logo will do, but in general people respond better to a face
    – don’t leave the Twitter egg as it marks you as a novice.


    Adding a photo is easy. On the Twitter website, locate the small grey camera icon
    at the bottom left-hand corner of the text box in which you write your tweets:
    click to open your files, choose a photo, and voilà!


    Your ''timeline'' is the stream of tweets from people you follow. Now you are
    ready to find some folk to follow and fill that timeline.


    ![](img/ac5d888ab73738d97783942701b8a835_16_0.png)


    > Twitter is all about information and communication: you can tell people what
    you are doing or thinking and find out what other individuals/companies/organizations
    are up to.


    # Friends and followers


    # Following


    When you start to follow people, they will receive an email informing them of
    a new follower. Once you start chatting to them, some will follow back; if they
    don''t, it is nothing personal, so don''t be offended. Resist the temptation to
    ask them why, or beg them to follow – it will only make you sound desperate!


