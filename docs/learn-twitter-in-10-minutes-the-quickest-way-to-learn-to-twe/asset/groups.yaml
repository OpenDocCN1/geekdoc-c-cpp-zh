    当你开始关注某人时，他们会收到一封邮件通知有新的关注者。一旦你开始和他们聊天，有些人会回关；如果他们没有回，这并不是针对个人，不要感到被冒犯。不要问他们为什么，或者求他们关注——这只会让你看起来很卑微。


    # 朋友与关注者


    # 关注


    当你开始关注某人时，他们会收到一封邮件通知有新的关注者。


    # 寻找关注者


    如果你有喜欢的商店、餐厅或其他企业，你可以关注它以获取特别优惠和新闻。


    ![](img/ac5d888ab73738d97783942701b8a835_20.png)


    # 寻找关注者


    我们都从零关注者开始。有些人最终会有数千个关注者，而另一些人只有几个。这不应该影响你对 Twitter 的享受：与其拥有 5000 个默默潜伏从与你交流的关注者，不如拥有
    50 个和你志趣相投的关注者。


    当你开始关注某人时，他们会收到一封邮件通知有新的关注者。一旦你开始和他们聊天，有些人会回关；如果他们没有回，这并不是针对个人，不要感到被冒犯。不要问他们为什么，或者求他们关注——这只会让你看起来很卑微。


    # 第一条推文


    现在是时候上手开始推文了！


    # 第一条推文


    首先，不要害羞。Twitter 是为了对话而生的，而不是独白，而且没有所谓的打断私人对话，尽管如果你还不认识其他用户，在推文开头加上“抱歉打扰了”之的话是礼貌的。


    Twitter 限制你使用 140 个字符，所以如果你通常很啰嗦，可能需要发挥创意。尽量不要使用短信缩写，因为并不是所有人都能很好地理解。


