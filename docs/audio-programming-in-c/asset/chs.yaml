  \n# 附录 B：音频工程术语 (0 - 9 - A - Z)\n\n### 0–5v\n表示 0 到 5 伏的电压范围，这是模块化合成器中门（gates）、触发器（triggers）和调制控制电压的范围。门和触发器（启动新音符等事件）通常从\
  \ `0v` 上升到 `5v`（`0` 到 `10v` 也很常见），在该起始点的大部分位置触发事件。当门保持在 `5v`（或 `10v`）时被视为高电平，返回\
  \ `0v` 时为低电平。\n\n### 1 pole\n这种数字和缩写格式（`dB/oct` = 每八度分贝）通常用于指代滤波器的频率响应行为。滤波器通常有一个其调优的截止频率或角频率。它会减少（滤波）通过它的信号的频率频谱，使其在距离截止频率每远一个八度时，音量减弱\
  \ 6 分贝的倍数。`6dB/octave` 滤波器通常被称为“一极”滤波器（因为滤波器设计中的每个极点都会导致 `6dB` 的衰减），对通过它的信号影响相对较弱。低通门\
  \ (`LPGs`) 通常——但并非总是——使用 1 极低通滤波器，使其在高于截止频率的每一个八度，高次泛波强度减少 6 分贝。\n\n### 1 ppqn\n\
  最常见的序列器时钟分频每四分音符向前推进一步（脉冲 `pulse`）。这通常是模块系统中传输的核心同步脉冲，通过倍法或除法来创建其他的节奏划分。\n\n###\
  \ 1 v/oct\n模块化合成器中控制音高最常用的标准。在该系统中，将输入 `VCO`（电压控制振荡器）的电压增加 1 伏特——例如从 `0.5v` 到 `1.5v`——将使其音高升高一个八度。\n\
  \n### 1.2 v/oct\n兼容 Buchla 的合成器采用了 `1.2 伏特每八度` 系统，而不是更常见的 `1 v/oct`。西方音乐中一个八度有 12\
  \ 个半音，平均律意味着音高每改变一个半音，对应精确的 `0.1 伏特`。\n\n### 1/4”\n`5U`（Moog 格式）模块化合成器最常用的连接尺寸。这些是\
  \ `TS`（端/环）插座和插头，类似于吉他和和其他乐器电缆。\n\n### 1/8”\n经常被错误地描述为 Eurorack 格式模块常用的连接尺寸，以及 Buchla\
  \ 音频信号。事实上，Eurorack 模块使用 `3.5mm` 插座和插头（比 `1/8”` 大）；Buchla 使用 `craft Tini-Jax` 连接器。`Tini-Jax`\
  \ 直径为 `3.5mm`，但物理上与常见的 `3.5 mm` 插座略有不同。`1/8”` 插头在这两种座中都会松动，因此在为这些格式订购零件或电缆时，请确保购买的是\
  \ `3.5mm` 连接器。\n\n### 10 vpp\n“10 伏特峰值”的缩写，峰值是指信号在传输过程中达到的最低和最高电压之间的差值。这是模块化合成器中音频和调制信号的常用电压范围。实际范围在\
  \ –,5` 和 `+5` 伏之间。精确范围可能会变化以改变其效果深度，因此不要过于纠结于特定的电压范围。更多关注它们是在 `0v` 和某个值之间变化，还是在\
  \ `0v` 上下大致相等的范围内波动（如 `10vpp` 那样）。\n\n### 12 dB/oct\n这种数字和缩写格式（`dB/oct` = 每八度分贝）通常用于指代滤波器的频率响应行为。滤波器通常有一个其调优的截止频率或角频率。它会减少（滤波）通过它的信号的频率频谱，使其在距离截止频率每远一个八度时，音量减弱\
  \ 12 分贝的倍数。`12dB/octave` 滤波器通常被称为“二极”滤波器（因为滤波器设计中的每个极点都会导致 `6dB` 的衰减）。老式的 `Arp`、`Korg`\
  \ 和 `Oberheim` 乐器通常具有二极滤波器，与带有四极乐器相比，通常会产生更亮的音色。\n\n### 16’\n有时出现在振荡器的八度选择开关上。它指的是风琴管的长度。管子越长\
  \ = 音高越低；`16’` 处于中低音区。长度一半的管或设置（`8’`）高一个八度；再短一半的管（`4’`）高两个八度；以此此类推。\n\n### 18 dB/oct\n\
  这种数字和缩写格式（`dB/oct` = 每八度分贝）通常用于指代滤波器的频率响应行为。滤波器通常有一个其调优的截止频率或角频率。它会减少（滤波）通过它的信号的频率频谱，使其在距离截止频率每远一个八度时，音量减弱\
  \ 18 分贝的倍数。它通常用作代码简写，当有人想在不提及乐器名称的情况下引用 `TB-303` 的酸性贝斯线时。\n\n### 2 Pole\n这种数字和缩写格式（`dB/oct`\
  \ = 每八度分贝）通常用于指代滤波器的频率响应行为。滤波器通常有一个其调优的截止频率或角频率。它会减少（滤波）通过它的信号的频率频谱，使其在距离截止频率每远一个八度时，音量减弱\
  \ 12 分贝的倍数。`12dB/octave` 滤波器通常被称为“二极”滤波器（因为滤波器设计中的每个极点都会导致 `6dB` 的衰减）。老式的 `Arp`、`Korg`\
  \ 和 `Oberheim` 乐器通常具有二极滤波器，与带有四极乐器相比，通常会产生更亮的音色。\n\n### 2.5 mm\n用于安装 Eurorack 模块的常用螺纹。这种尺寸最用于用于模块连接的轨道上滑动的螺母。\n\
  \n### 24 dB/oct\n这种数字和缩写格式（`dB/oct` = 每八度分贝）通常用于指代滤波器的频率响应行为。滤波器通常有一个其调优的截止频率或角频率。它会减少（滤波）通过它的信号的频率频谱，使其在距离截止频率每远一个八度时，音量减弱\
  \ 24 分贝的倍数。这种设计通常用于老式的 `Moog` 和 `Roland` 合成器。四极滤波器在主观上通常认为比二极滤波器具有更厚实、更圆润的音色——但概括总是有风险的。\n\
  \n### 24 ppqn\n`MIDI`、`DIN sync` 以及电子音乐和合成器中常用的主时钟分频。这意味着在内部，每个四分音符会计算 24 个时间划分。这个快速的内部时钟可以进一步分频以产生十六分音符（`÷6`）、八分音符（`÷12`）、八分三音（`÷8`）等。\n\
  \n### 2’\n有时出现在振荡器的八度选择开关上。它指的是风琴管的长度。管子越短 = 音高越高；`2’` 在模块振荡器上很少见，因为音高很高——比中音起点高两个八度。长度两倍的管或设置（`4’`）低一个八度；再两倍的管（`8’`）低两个八度；以此此类推。\n\
  \n### 3 mm\n用于安装 Eurorack 模块的常用螺纹。这种尺寸最用于已钻孔的模块安装轨道。\n\n\n\n\n用于 Eurorack 格式模块合成器中插座和电缆的标准连接器尺寸。请注意，这比\
  \ `1/8”` 略大。\n\n### 303\n`Roland` 的 `TB-303` 贝斯线路器因其橡胶感、滑动的合成器低音音色，成为了 Acid House\
  \ 和其他风格 EDM（电子舞曲）的文化宠儿。许多人将 `303` 的音色归于它的滤波器设计。\n\n### 32’\n有时出现在振荡器的八度选择开关上。它指的是风琴管的长度。管子越长\
  \ = 音调越低；`32’` 是你所看到的最低设置，已经进入了地震级别。长度一半的管子或设置（`16’`）高一个八度；再短一半的管子（`8’`）再高两个八度；以此类推。\n\
  \n### 3U\n指高度为 `3` 个机架（U）的模块——即 Eurorack 标准。它是目前最常见的模块化格式，尽管它是最年轻的格式之一。\n\n### 4\
  \ Pole\n这种数字和缩写格式（`dB/oct` = 分贝每八度）通常用于描述滤波器的频率响应行为。滤波器通常有一个其调优的截止频率或角频率。它会减少（过滤）通过它的信号的频谱，使得每距离截止频率再远一个八度，其亮度就会降低\
  \ `24` 分贝的倍数。这种设计常用于复古 `Moog` 和 `Roland` 合成器。四极（`4-pole`）滤波器通常比双极（`2-pole`）滤波器主观上更厚实、更“圆润”——但概括总是危险的。\n\
  \n### 4-40\n一种偶尔用于安装 Eurorack 模块的螺纹尺寸。例如，`Pittsburgh Modular` 在其外壳使用了这种尺寸。\n\n###\
  \ 4U\n指高度为 `4U`（机架单元）的模块——即 `Buchla` 和 `Serge` 系统，以及这些模块的 DIY 克隆版本。`Buchla` 和 `Serge`\
  \ 都倾向于更具实验性的合成和音乐方法，因此一些用户将“4U”视为荣誉勋，代表他们是不随波流且酷的。（而且他们确实如此。）\n\n### 4’\n有时出现在振荡器的八度选择开关上。它指的是风琴管的长度。管子越短\
  \ = 音调越高；`4’` 是你在大多数振荡器上看到的最高八度设置。长度两倍的管子或设置（`8’`）低一个八度；再倍倍管子（`16’`）低两个八度；以此类推。\n\
  \n### 5U\n指高度为 `5U`（机架单元）或 `8.75”`（`22.2 cm`）的模块，通常与复古 `Moog` 标准以及遵循其脚步的人有关，包括 `Synthesizers.com`\
  \ (Dotcom) 和 `Moon Modular`。有时你会听到它与 `MU`（Moog Units）混用，后者也指每个 `MU` 宽度为 `2.125”`（`5.4\
  \ cm`）的标准。鉴于这种标准具有历史性且物理尺寸巨大，一些用户将“5U”视为荣誉勋，代表他们是传统且酷的。（而且他们确实如此。）曾有一个短暂流行的 `5U`\
  \ 格式来自 `MOTM`，使用不同的宽度和电源连接。它已停产，但今天仍有死忠的 `MOTM` 格式用户。\n\n### 6 dB/oct\n这种数字和缩写格式（`dB/oct`\
  \ = 分贝每八度）通常用于描述滤波器的频率响应行为。滤波器通常有一个其调优的截止频率或角频率。它会减少（过滤）通过它的信号的频谱，使得每距离截止频率再远一个八度，其亮度就会降低\
  \ `6` 分贝的倍数。`6dB/octave` 滤波器通常被称为“单极”滤波器（因为滤波器设计中的每个极都会导致 `6dB` 的衰减），并且对通过它的信号产生的影响相对较弱。低通门（`LPGs`）通常——但并非总是——使用\
  \ `1 pole` 低通滤波器，每高于截止频率一个八度就将高谐波强度降低 `6` 分贝。\n\n### 808\n`Roland` 的 `TR-808` 节奏作曲器使用模拟电路创建了所有的声音。它刚问世时并不受欢迎，因为模拟声音不够真实。但后来，House\
  \ 和 Hip-Hop 等音乐风格采纳了它巨大、浑浊的合成音。当一个模块说它重现了“808”鼓声时，这就是它们试图模仿的乐器。复制最多的是 `808` 踢鼓声，它倾向于是一种低音、长衰减的正弦波形，且通常带有清脆的攻击音。\n\
  \n### 8’\n有时出现在振荡器的八度选择开关上。它指的是风琴管的长度。管子越短 = 音调越高；`8’` 通常与中央 C 相关。长度一半的管子或设置（`4’`）高一个八度；长度两倍的管子或设置（`16’`）低一个八度。\n\
  \n### 909\n`TR-909` 节奏作曲器是 `Roland` 现在备推崇的 `TR-808` 的续作。它将用于踩踏板和镲的数字样本与 `808` 的模拟声音相结合，并同样流行。当一个模块说它产生\
  \ `909-like` 的声音时，这就是它所指的乐器。\n\n***\n\n### A-440\n这是中音 C 之上 `A` 的赫兹频率（每秒循环次数）。它通常用作调音参考。\n\
  \n### A/B Technique\n一种立体声放置技术，将两个心形或全指向性麦克风间隔在 3-10 英尺处（取决于声源的大小），以创建左/右立体声结象。也称为间距对（Spaced\
  \ Pair）。\n\n### A/D\n模拟数字转换（Analog-to-Digital Conversion）的缩写，将具有连续变化的量（如电信号）转换为近似这些变化的数字。\n\
  \n### Absolute Phase\n该术语描述了原始有信号（进入麦克风）与还原信号（通过扬声器）之间的完美极性。当施在麦克风上的正压力被转换为扬声器的正压力时，两者处于绝对相位。\n\
  \n### Absorption\n吸收\n在声学中，吸收是指声波被表面吸收发生，而不是从表面反射（反射）。例如，控制室中的吸收材料倾向于“消除”房间的声音，因为声能被吸收而非反射。（参见反射\
  \ Reflection。）\n\n### AC Coupled\n交流耦合\n交流耦合输入尝试移除通过它的任何恒直流直流。如果你有一个本质上是交流的音频信号（如振荡器的输出），并且你想移除可能进入的意外直流偏移，这很有用。\n\
  \n### AC\n交流电 - 标准电源座中以及音频线路中电流类型。在交流电中，电流方向“交替”，在电路中往复流动。在模块术语中，AC 指在正负值之间交变的电压——例如振荡器的输出。\n\
  \n### Accelerometer\n加速度计是一种测量其所承受加速度并创建与之匹配电信号的设备。在音乐和音频领域，加速度计用于麦克风和吉他拾音器等设备。\n\
  \n### Acorn Tube\n果壳管因其果壳形状而命名，是一种用于超高频（UHF）电子设备（如真空管放大器）的小真空管。\n\n### Acoustic\
  \ Amplifier\n图中乐器中响应乐器初始振动而振动的部分，导致周围空气移动更有效，并使声音更大。例如：原声吉他的琴身、喇叭的喇、鼓壳以及钢琴的木制共板。\n\
  \n### Acoustic Echo Chamber\n\n\n\n\n一个采用坚硬、非平行表面设计的房间，用于产生回声。在录音室中，它们被用于为干信号添加自然混响。\n\
  \n### 声学 (Acoustics)\n\n声音的科学——更具体地说，是声波属性和行为的科学。良好的声学知识对于音频工程和工作室设计至关重要。\n\n###\
  \ 有源设备 (Active Device)\n\n具有控制电流能力的组件（相对于“无源设备”）。在录音室中，有源设备通常包含放大器组件。（参见“无源设备”。）\n\
  \n### 有源分配器 (Active Multiple)\n\n你经常需要分配或复制信号以发送到多个目的地。这通常通过分配器完成，你接入一个信号源，然后插入额外的跳线线连接到多个目的地。有源或缓冲分配器在输入和输出之间包含一个缓冲电路，以确保信号不会因为多次分分而丢失强度或完整性，并确保其中一个输出端的任何异常情况都不会影响其他连接。某些模块的输出内置了良好的缓冲功能，可以无问题地驱动多个模块。但如果你尝试使用无源分配器连接到（例如）三个振荡器，并发现调谐跟踪并不理想（随着你上下音阶，它们会迅速跑调），那么你需要一个缓冲分配器了。\n\
  \n### 执行器 (Actuator)\n\n开关中引起触点连接变化的部分（例如拨动开关、按钮或翘板开关）。\n\n### AD\n\n两阶段攻击/衰减（Attack/Decay）包络的缩写。这种简单的包络形状以其\
  \ `Attack` 参数定义的速度从 0 伏上升到最大电平（通常为 5、8 或可能是 10 伏），然后立即按照其 `Decay` 参数定义的速率掉落回 0 伏。这种形式的变体是\
  \ `AHD` 包络：在完成 `Attack` 阶段后，它会在最大水平保持一段指定的时间（与 `AR` 包络相比，后者在门电信号（gate）保持为高电平期间一直保持在最大水平），然后衰减回零。我听过有些包络是\
  \ `AHD` 和 `AR` 的混合体，它们会在定义的 `Hold` 时间内或在输入门电信号保持为高电平期间保持最大水平。\n\n### 加法合成 (Additive\
  \ Synthesis)\n\n使声音独特的的主要特性之一是其所构建的谐波（纯组分频率）的混合。加法合成是一种让你直接控制这些组分谐波的技术，允许你直接调出你想要的混合比例。尽管这在纸面上（或屏幕上）听起来是直接且直观的，但实际上要制作正确的混合来重建另一种声音需要大量工作，特别是每个谐波的强度通常随时间变化。加法合成振荡器在模块合成器中相对稀少；两个例子是\
  \ `Verbos Harmonic Oscillator` 和 `Make Noise tELHARMONIC`。\n\n### ADSR\n\n具有四个阶段的包络发生器：攻击（Attack）、衰减（Decay）、维持（Sustain）和释放（Release）。当此包络发生器接收门输入时，它通常从\
  \ 0 伏开始（连接到电压控制放大器时等同于静，连接到电压控制滤波器或振荡器时等同于最低频率），并在 `Attack` 控制设置的时间内达到它可以输出的最大电压（取决于系统，通常为\
  \ 5 到 10 伏；通常可以使用输出电平控制进行设置）。一旦达到该电平，输出电压立即开始按照 `Decay` 控制设置的速度下降，直到达到 `Sustain`\
  \ 控制设置的电压。如果输入门仍然激活，该电平将一直保持，直到门信号回到 0 伏（通常是因为你松开了控制键盘上的琴键等）。此时，输出电压将开始按照 `Release`\
  \ 控制设置的速率掉落回 0 伏。\n\n### AES\n\n音频工程学会（Audio Engineering Society）。\n\n### AES3\n\
  \n（有时称为 `AES/EBU`）一种由音频工程学会和欧洲广播联盟开发的数字音频传输标准，用于在设备之间传输双通道数字音频数据`AES3` 是 `XLR` 线缆以及\
  \ `RCA` 和 `S/PDIF` 线缆背后的协议。\n\n### AFG\n\n`AFG`（音频频率发生器）是由 Livewire Electronics\
  \ 发布的一款功能非常齐全模拟振荡器。它自那时已停产，但偶尔会有翻新的 B 级库存上市出售。据我所知，扩展模块从未发布过（至少没有广泛发行过）。\n\n###\
  \ 触后 (Aftertouch)\n\n（也称为“压力敏感”）某些键盘可以测量你按下按键的力度，并将其转换为电压（或其他控制信号，如 MIDI，然后可以转换为控制电压），你可以用它为音符增加表情，例如添加颤音或更宽打开滤波器。单声道触后对整个键盘测量一个压力值，无论你按了哪个键；多声道触后则为每个单独的按键产生信号。重要冷知识：触控键盘实际上测量的是接触它们的皮肤表面积，而不是压力或力——因此你可以通过在指尖和指腹之间滚动来增加或减少触后量。\n\
  \n### AHDSR\n\n攻击（Attack）、保持（Hold）、衰减（Decay）、维持（Sustain）和释放（Release）。这是一个稍微复杂的 `ADSR`\
  \ 包络，在攻击停止上升到衰减开始下降之前，通常会将电压保持在其最大值处一段时间。\n\n### 混叠 (Aliasing)\n\n一种数字信号失真，发生在采样器中，当输入信号频率超过该单元的\
  \ `Nyquist frequency`（奈奎频率）时。采样器以错误的频率（或“镜像频率”）重现它，导致声音产生失真或伪影。如果你播放一个采样率的一半为可听频率的数字音频文件，除非经过良好的滤波，否则你还会听到谐波内容的镜像。（另见“奈奎频率”）\n\
  \n### 交流电 (AC)\n\n在标准插座和音频线路中使用的电流类型。在 `AC` 中，电流方向交替，在电路中来回流动。\n\n### 幅度调制 (AM)\n\
  \n幅度调制（AM）是使用称为调制器的第二个信号来改变载波信号（通常是在 0 伏上下波动的音频信号）的幅度或响度的技术的名称。在典型的幅度调制（AM）场景中，一个正电压的低频振荡器（例如在\
  \ `0v` 到 `5v` 之间，或者更小的 `1v` 到 `2v`）被输入电压控制放大器的控制端，为通过它的音频信号增加调制。技术上，这被称为二限乘法器或调制器，因为调制信号的任何负波动都会被忽略；在连接颤音（tremolo）时，你可能需要确保为\
  \ `LFO` 添加偏移电压，以确保声音在 `LFO` 波形的低偏置处不会消失。\n\n\n\n\n这指的是将麦克风置于房间的环境中，以录制声音的环境混响。录音工程师经常会对乐器进行直接拾音的同时也这样做，以便在录音中创建直接声与混响声的融合或混合。\n\
  \n### Amp\n根据上下文的不同，它是“放大器”（Amplifier）、“幅度”（Amplitude）或“安培”（Ampere）的缩写。\n\n### Ampere\n\
  电流的单位，缩写为 `Amp`。\n\n### Amplifier\n一种增加电信号电平或振度的设备，使产生的声音更大。\n\n### Amplitude Modulation\n\
  幅度调制（AM）是指通过第二个信号（称为调制器）来改变称为载波（通常是音频信号，在 0 上方和下方波动）的信号的幅度或响度的技术。在典型的幅度调制（AM）场景中，一个带有正电压的低频振荡器（例如在\
  \ `0v` 到 `5v` 之间，或者 `1v` 到 `2v` 之间的更小值）被接入电压控制放大器的控制输入，以为通过它的音频信号添加颤音。从技术上讲，这被称为二象限乘法器，因为调制信号中的任何负波动都会被忽略；在连接颤音（tremolo）时，你可能需要确保为\
  \ LFO 添加偏移电压，以确保声音在波形的低端偏移处不会中断。\n\n### Amplitude\n波形在零线以上或以下的高度。在音频中，这通常意味着信号强度或声音音量。\n\
  \n### Analog Recording\n对音频波形连续变化的录制。模拟录制最常见的例子是盘带录音。\n\n### Analog Shift Register\n\
  模拟移位寄存器（`ASR`）采样保持（Sample & Hold）模块与桶形延迟（Bucket Brigade Delay）之间的结合体（假设你已经知道它们是如何工作的）。在初始触发时，它采样输入电压并将其显示在第一个输出端。在第二次触发时，再次采样输入电压，并将新电压显示在第一个输出端，而原始电压现在移动到第二个输出端。这种“传筒游戏”会一直传递，直到达到\
  \ `ASR` 拥有的级数——传统上为三或四级。\n\n### Analog To Digital Converter (A/D; or ADC)\n一种将连续变化的信号（模拟）转换为近似这些变化的数值（数字）的设备。在音频录制中，这指的是将声音电电压转换为数据。\n\
  \n### Analog\n“模拟”一词意味着信号是连续变化的，而数字信号则被转换为离散的数字。在模块化合成器领域，模拟指的是没有数字（或至少没有基于计算机的）组件的设计设计——而是使用晶体管、二极管、电容进行所有的处理，而不是\
  \ CPU 和 DSP。\n\n### AND function\n最常见的布尔逻辑函数之一，AND 只有在所有输入都为“高”电时（即输入 1 和输入 2 都开启）才会输出门控信号。NAND\
  \ 函数具有反相输出：如果两个输入都是高电，输出为低，否则为高电。\n\n### AR\n两阶段攻击/释放（Attack/Release）包络按照 Attack\
  \ 参数设置的速率从 `0v` 升到最大电平（通常为 `5v`、`8v` 甚至 `10v`），然后只要馈入包络器的门控信号保持高电，它就会保持在该值。。当门控信号回到零时，包络的输出也会按照\
  \ Release 参数设置的速率回到零。（另一种类型的包络称为 AHD——攻击/保持/衰减——你在其中指定电平保持在最大水平的固定时间，而不是关注门控信号。）\n\
  \n### Arpeggiator\n先谈一下音乐理论，分解弦是一种类型的“破碎和弦”，其中音符是逐个播放的，而不是同时播放。分解音器（通常内置在键盘中，或插入你的键盘和音源模块之间的设备）能让你更容易演奏分解弦：你只需要按住和弦的音符，它就会一个接一个自动播放音符，反复进行，就像一个你可以通过按住和弦即时编程的步进序列器。良好的分解音器具有不同模式的选项（向上、向下、来回、随机等），甚至有锁存（latch）或保持（hold）功能，即使在你松开琴键后它也会继续这样做。\n\
  \n### ASR\n模拟移位寄存器（`ASR`）采样保持（Sample & Hold）模块与桶形延迟（Bucket Brigade Delay）之间的结合体（假设你已经知道它们是如何工作的）。在初始触发时，它采样输入电压并将其显示在第一个输出端。在第二次触发时，再次采样输入电压，并将新电压显示在第一个输出端，而原始电压现在移动到第二个输出端。这种“传筒游戏”会一直传递，直到达到\
  \ `ASR` 拥有的级数——传统上为三或四级。\n\n### Attack/Decay/Sustain/Release\n具有四个阶段的包络发生：攻击（Attack）、衰减（Decay）、维持（Sustain）和释放（Release）。当此包络发生接收门控输入时，它通常从\
  \ `0v` 开始（连接到电压控制放大器相当于静音，连接到电压控制滤波器或振荡器时相当于最低频率），并按照 Attack 控制设置的时间升到它可以输出的最大电压（取决于系统通常为\
  \ `5` 到 `10v`；通常可以通过输出电平控制进行设置）。一旦达到该水平，输出电压立即开始以 Decay 控制设置的速度下降，直到达到 Sustain 控制设置的电压。如果输入门控仍然激活，该电平将一直保持，直到门控回到\
  \ `0v`（通常是因为你松开了控制键盘上的键等）。此时，输出电压开始按照 Release 控制设置的速率回到 `0v`。\n\n### Attack/Decay\n\
  两阶段攻击/衰减包络的简写。这种简单的包络形状按照 Attack 参数定义的速率从 `0v` 升到最大电平（通常为 `5v`、`8v` 或可能的 `10v`），然后按照\
  \ Decay 参数定义的速率立即回到 `0v`。这种包络的一个变体是 AHD 包络：在完成攻击阶段后，它在指定的时间内保持最大水平（与 AR 包络相反，后者在门控信号保持高电期间一直保持最大水平），然后衰减回零。我听说有些包络是\
  \ AHD 和 AR 的混合体，它们在保持时间或输入门控保持高电的期间内保持最大水平。\n\n### Attack/Hold/Decay/Sustain/Release\n\
  这是一个稍微复杂的 ADSR 包络，在攻击完成上升之后衰减开始下降之前，在指定的时间内将电压保持在最大值上。\n\n### Attack/Release\n两阶段攻击/释放包络按照\
  \ Attack 参数设置的速率从 `0v` 升到最大电平（通常为 `5v`、`8v` 甚至 `10v`），然后只要馈入包络器的门控信号保持高电，它就会保持在该值。。当门控信号回到零时，包络的输出也会按照\
  \ Release 控制设置的速率回到零。\n\n\n\n\n\n### 起始 (Attack)\n这通常指包络的第一阶段，发生在音符开始时，电压从 0 伏（如果控制放大器模块，则为静音）上升到典型的最大音量值。打击乐和拨弦乐具有非常快的起始；而缓慢、悠闲的管乐或弦乐乐句可能有很长的起始。\n\
  \n### 衰减 (Attenuation)\n电信号或声信号强度的降低。在音频中，衰减以分贝（`dB`）测量，通常听为音量的减小。通过空气传播的波在远离声源时会自然衰减。工程师在录音室内还会通过增益控制或衰减器故意衰减信号，以防止过载。\n\
  \n### 衰减器 (Attenuator)\n可以减少通过它的信号或电压强度的控制装置。\n\n# 反相衰减器 (Attenuverter)\n衰减器的特殊版本，还可以反转通过它的信号或电压极性。大多数反相衰减器在中间位置不通过信号；当你顺时针旋转时，它会增加正常信号的量；当你逆时针旋转时，它会增加反相信号的量。某些反相衰减器是在普通衰减器基础上增加了一个极性开关。\n\
  \n### 音频发生器 (Audio Frequency Generator)\nAFG (`Audio Frequency Generator`）是由 Livewire\
  \ Electronics 发布的一款功能非常丰富的模拟振荡器。它已经停产，但偶尔会有翻新的 B 级设备出售。据我所知，其扩展模块从未发布过（至少没有广泛发行）。\n\
  \n### 音频 (Audio)\n从广义上讲，音频是指人类用耳朵听到的频率范围。从技术角度讲，音频指的是声音的传输、录制或复制，无论是数字、电还是声学的。\n\
  \n### 自动对白 (ADR)\n在电影拍摄完成后，在受控环境中重新录制对话的过程，用于替换质量不好的对话。\n\n### 自动增益控制 (Automatic\
  \ Gain Control)\n一种具有长释放时间的压缩器，用于保持音频音量在一致水平。\n\n### 自动化 (Automation)\n编程让录制和播放期间自动发生某些变化。在录音室里，工程师在调音台或计算机上使用自动化，使参数在多轨录制和播放期间的不同时间自动变化。这种预编程功能使得创建这些变化比尝试在实时手动执行所有操作容易得多。\n\
  \n### 辅助设备 (Auxiliary Equipment)\n与调音台配合工作修改信号的外部信号处理设备。\n\n### 辅助返回 (Auxiliary\
  \ Return)\n（缩写为 `Aux Return` 或 `Return`）调音台或 DAW 上的输入，将通过辅助发送出去的特效信号返回通道混音中。\n\n\
  ### 辅助发送 (Auxiliary Send)\n（缩写为 `Aux Send` 或 `Send`）用于调整从调音台或 DAW 输入通道通过辅助总线发送到辅助设备或插件的信号电平控制。这通常用于创建效果循环，处理部分信号，然后通过辅助返回将其回混音。\n\
  \n### 轴 (Axis)\n设备运行环绕的虚拟线。例如：在使用麦克风时，轴是从麦克风正面沿振振膜运动方向延伸出的虚拟线，界定了麦克风拾取声音的最佳位置。发生在麦克风“轴外”的声音不会被清晰地捕捉。\n\
  \n***\n\n### 背景噪声 (Background Noise)\n指：\n1) 与乐器无关的房间环境噪声\n2) 与乐器或空间无关的房间环境噪声\n\n\
  ### 隔板 (Baffles)\n用于防止声音进入或离开的吸音板。\n\n### 平衡 (Balance)\n1) 频率范围，通常由该范围的中心频率识别。\n\
  2) 一组一起演奏的音乐家。\n\n### 带通滤波器 (Bandpass Filter)\n带通滤波器 (BPF) 保持中心、角频率或截止频率附近的谐波不变，并衰减中心频率上方和以下的频率。根据滤波器中极点的数量，你离中心越远，衰减越严重，每个极点在每偏离中心一个八度时，会产生\
  \ 6 分贝的衰减。\n\n### 带宽 (Bandwidth)\n在信号处理中，带宽是指通信通道的频率范围，通过设备最高和最低可用频率之差来测量。\n\n###\
  \ 组 (Bank)\n1) 内存中合成器发生器和调制器的音色、序列器数据和/或操作参数的集合。\n2) 作为单元的一组音频模块。\n\n### 小节 (Bar)\n\
  \n\n\n\n\n在音乐记法中，“小节”（bar）是“拍”（measure）的另一种术语，指包含特定数量拍子的特定时间段，并在书写的小节两侧用小节线标记。\n\
  \n### 巴克标度 (Bark Scale)\n人类的听觉系统可以被认为由一系列带通滤波器组成。有趣的是，这些滤波器的间距并不严格遵循线性频率标度或对数音乐标度。巴克标度试图确定这些这些“听力滤波器”的中心频率和带宽（被称为关键频带）。\n\
  \n### 屏障录音 (Barrier Miking)\n一种麦克风放置技术，将麦克风放在反射表面附近。如果操作得，屏障录音可以确保直声和反射声同时到达麦克风，防止两者之间的相位抵消。\n\
  \n### 基础分轨 (Basic Session)\n首次音频录制环节，用于录制作为歌曲基础的基础轨道（例如，鼓组和贝斯）。\n\n### 低音反射 (Bass\
  \ Reflex)\n一种扬声箱体设计，扬声箱体上的端口（开口）可以增强低频。其原理是音箱内部扬声器振膜背面产生的声压通过箱体前部的端口排出，与来自低音器单元正面的声音混合。改变端口的大小和位置将极大改变低频的特性。\n\
  \n### 低音 (Bass)\n频率最高约 250 Hz 的音频低频。一个参考值。\n\n## BBD (桶形传输延迟)\n一种早期的回声或延迟效果设计，其中输入音频被采样为模拟电压并保持片刻。然后，在下一个高于音频采样率的时钟脉冲处，该电压将传递到电路中的下一个采样并保持单元（桶），同时采样一个新的电平平。桶形传输延迟（BBDs）通常具有\
  \ 2 的幂方的级数或桶（256,512,1024,2048 等）；延迟长度由级数数量乘以样本之间的时间间隔决定。\n\n## 束射效应 (Beaming)\n\
  扬声器中发现的一种现象，高频直接从扬声器射出，而不是与低频一起色散。当你站在扬声器正前轴线上时，听起来它只在播放高频，而不是中频或低频。这种现象可以通过通过扬声器内的号叭路由高频来缓解。\n\
  \n### 节拍映射 (Beat Mapping)\n调整录制音乐作品中的速度变化以适应项目设定速度的过程。在 DAW 中，这是使用时间拉伸工具和剪辑完成，将瞬态（transients）同步到适当的节拍标记。这种技术经常被用于，例如，协调在没有节拍器轨道的情况下录制的鼓或贝斯表演。\n\
  \n### 节拍 (Beat)\n1) 音乐中稳定、均匀的脉冲。\n2) 两个频率略有不同的声音或音频信号相互干扰，导致音量周期性增加和减少，耳朵听起来为“拍频”。\n\
  \n### 拍频现象 (Beating)\n当两个振荡器的频率调到非常接近但并不完全相同的频率时，它们之间的差异会导致被称为“拍频”的干涉图案。当频率差低于音频速率时，这听起来就像是应用于组合声音上的颤音（tremolo）。\n\
  \n## 踩拍 (Beatmatching)\n一种主要由 DJ 使用的技术，用于同步两个录制轨道的速度，通常通过使用时间拉伸和音移工具，以创建从一首歌到另一首歌的无缝衔接。\n\
  \n## 每分钟拍数 (B.P.M.)\nBPM（每分钟拍数）是表示速度最常用的方式：每分钟应该计算多少拍（通常是四分音符）。每分钟 120 拍意味着每秒有两个拍（120\
  \ 拍/分钟 x 1 分钟/60 秒 = 2）。\n\n音乐内稳定均匀脉冲的数量，定义了歌曲的速度。\n\n### 柏林学 (Berlin School)\n\
  一种特定的电子音乐风格，由 Tangerine Dream 和 Klaus Schulze 等人推广，基于模拟合成器，强调重复的序列和漂浮的和弦或无人音（drones），并在上面弹奏独奏。较新版本的柏林学音乐可以在\
  \ Node 和 Red Shift 中听到。\n\n### 双分频 (Bi-amplification)\n一种由两个独立的放大器驱动扬声器或扬声系统的高频和低频的技术。\n\
  \n## 双向模式 (Bi-Directional Pattern)\n一种麦克风拾音模式，对麦克风正前方后方的声音最敏感，有效地抑制来自侧面的声音。也称为“八字形”。\n\
  \n### 二进制 (Binary)\n数字系统的基石是二进制计数法，其中每个数字只能有两个不同的值：0 或 1；关闭或开启；低或高。二进制信号只能有这两个状态之一。因此，模块化合成器中的门信号或触发信号——即使是由模拟电路生成的——也可以被称为二进制类型信号。关于可以使用二进制信号（如门和分频时钟）的操作，请参见布尔（Boolean）条目。\n\
  \n### 双极性 (Bipolar)\n可以在零的上下范围内变化的电压被称为双极性。模块化合成器内部的某些调制信号——例如颤音（在振荡器应播放的音符上下改变频率）——本质上是双极性的。\n\
  \n### 位 (Bit)\n代表单个“0”或“1”的数字最小单位。\n\n### 位深 (Bit Depth)\n在数字录制中，用于描述每个样本的比特数。位深越高，动态范围越大。样本的质量和分辨率由采样率和位深共同描述。（参见“采样率”）。\n\
  \n### 混合 (Blending)\n将多个声音或通道混合成一个声音，或将左右信号混合。\n\n### 蓝噪声 (Blue Noise)\n技术上，一种噪声类型，其功率密度（频谱亮度）随频率每倍频增加\
  \ 3 dB。它具有非常“嘶嘶”的特性，缺乏低音。\n\n### 布尔 (Boolean)\n布尔逻辑只有两种状态：高或低；1 或 0；开或关。\n\n## 吊杆架\
  \ (Boom Stand)\n带有伸缩支撑臂的麦克风架。\n\n### 吊杆 (Boom)\n连接在麦克风架上的伸缩支撑臂。\n\n### 增益 (Boost)\n\
  使用均衡器增加特定频率的增益。\n\n### 渲染 (Bouncing)\n（也称为“乒乓处理”或“砰处理”）将多个轨道合并并混合到一个或两个轨道（单声道或立体声）的技术。这可以通过实时模拟（通过调音台播放轨道并录制到独立轨道上）或通过数字音频工作站数字完成。工程师过去经常使用渲染来释放额外的记录轨道，但在轨道几乎无限的数字工作站中，这种做法已基本过时。今天，工程师通常渲染是为了创建歌曲的初步或最终混音。\n\
  \n## 边界麦克风 (Boundary Microphone)\n一种设计为贴紧平面表面（或边界）的全指向麦克风，有效地产生“半全指向”拾音模式，同时消除了反射声引起的相位问题风险。一种流行的边界麦克风是\
  \ Crown Audio 的专利产品压力区麦克风（PZM）。\n\n### BPF\n带通滤波器（BPF）保留中心、角频率或截止频率周围的谐波不变，并衰减中心频率上下的频率。距离中心越远，衰减越严重，取决于滤波器中极点的数量，每个极点在距离中心每一个倍频处衰减\
  \ 6 分贝。\n\n\n\n\n\n`BPM`（每分钟拍数）是表示速度最常用的方法：即每分钟应该计算多少个拍（通常是四分音符）。每分钟 120 拍的速度意味着每秒有两个拍（120\
  \ 拍/分钟 x 1 分钟/60 秒 = 2）。\n\n### 呼吸（Breathing）\n\n`Pumping and Breathing`（泵吸与呼吸）——录音室术语，指压缩器快速压缩和释放声音时产生的效应，会导致信号电平产生可见的变化。`Pumping`（泵吸）通常指压缩发生后声级的可听增大；`breathing`（呼吸）是指人声的类似效果，在歌手吸气时提高信号音量。泵吸和呼吸是廉价压缩器或过度压缩的标志，通常是不受欢迎的，尽管某些工程师和音乐家偶尔会故意使用它来营造特定的效果。\n\
  \n### 砖墙滤波器（Brickwall Filter）\n\n一种具有陡峭截止斜率的低通滤波器，形状类似于“砖墙”。虽然这些滤波器经常出现在 `A/D` 转换器中以防止混叠，但其陡峭的截止可能会给音频信号引入不希望的副作用，例如相位偏移。\n\
  \n### 桥接（Bridging）\n\n一种将单个输入馈入放大器的两个通道，然后将它们合并为一个的技术，从而有效地将放大器提供给信号的功率倍增。\n\n###\
  \ 布朗噪声（Brownian Noise）\n\n也称为棕噪声，技术上讲，它是一种功率密度（频谱响度）随频率增加而每八度下降 `6 dB` 的噪声。它具有沉重的低音，类似于远处的波浪声。它也可以作为缓慢变化的随机控制电压或调制信号，而不是作为音频源。\n\
  \n### Buchla 邦巴鼓（Buchla Bongos）\n\n这是一种经典的连接，将一个复杂的声源（例如一个振荡器调制另一个振荡器）通过 `Low Pass\
  \ Gate`（低通门），仅发送一个触发信号来“击打”内部的光电开关（vactrol），或者使用瞬时攻击/快速衰减包络来产生悦耳的打击声。低通门随着音量衰减而减少高次谐波，这有助于抑制复杂声源产生的谐波，并使其产生类似于击打乐器的衰减效果。\n\
  \n### 桶式延迟（Bucket Brigade Delay）\n\n一种回声或延迟效果的早期设计，输入音频被采样为模拟电压并保持片刻。然后，在下一个高于音频采样率的时钟脉脉冲处，该电压将传递到电路中的下一个采样并保持（`bucket`）单元中，同时采样一个新的电平。桶式延迟（`BBDs`）通常具有\
  \ 2 次方幂的级数或“桶”（`256`、`512`、`1024`、`2048`等）；延迟长度由级数数量乘以采样之间的时间间隔决定。\n\n### 抵消（Bucking）\n\
  \n一种相位抵消现象，两个相同的信号或频率具有相同的幅度但极性相反，会相互抵消。最常用于乐器频率背景。例如，“双线圈”（Humbucker）吉他拾音器的设计就是利用这一原理来消除或“抵消”（buck）信号中的嗡嗡声频率。\n\
  \n### 缓冲多路输出（Buffered Multiple）\n\n你经常需要分拆或复制信号以发送到多个目的地。这通常通过多路输出（multiple）实现，你插入一个源，然后插入额外的跳线线连接到多个目的地。主动或缓冲多路输出在输入和输出之间包含一个缓冲电路，确保信号不会因为分拆次数过多而丢失强度或完整性，并确保其中一个输出端发生的异常情况不会影响其他任何连接。某些模块的输出内置了良好的缓冲功能，可以无问题地驱动多个模块。但如果你尝试使用无源多路输出（passive\
  \ mult）连接到（例如）三个振荡器，并发现跟踪（tracking）并不理想（当你沿着音阶上下移动时，它们会很快跑调），那么你需要一个缓冲多路输出。\n\n\
  ### 批量转储（Bulk Dump）\n\n`System Exclusive Bulk Dump`（系统独占批量传输）的缩写，一种在 `MIDI` 设备之间传输如内部参数等数据的方法。\n\
  \n### 脉冲发生器（Burst Generator）\n\n当你向此模块发送触发信号时，它会响应输出一路触发信号或“脉冲”（burst）。你通常可以控制触发的数量、它们之间的间距，并且通常可以单个触发输出发送或跳过的概率（用于随机图案）。在最温和的情况下，它可以用于创建响应正常音符的“双拨弦”触发；在最极端的情况下，它被用于触发高能量、混沌的鼓点流，这些鼓点可能与音乐不对拍。\n\
  \n### 总线板（Bus Board）\n\n这种简单的电路板获取你的模块化系统电源的输出并创建其多个副本，路由到连接你各个模块的连接器。\n\n### 总线（Bus）\n\
  \n一种音频路径，将一个或多个来自不同的信号路由到一个指定位置。由于总线与信号流密切相关，它们在音频应用中具有广泛用途。2) 指通过总线传输的信号本身的简写（参见“子组”Subgroup）。\n\
  \n### 字节（Byte）\n\n一组八位的信息（数据位）。一个 `byte` = 八个 `bits`。\n\n***\n\n### 线缆组件（Cable Assembly）\n\
  \n准备好在特定应用中安装的电缆，通常带有连接器。\n\n### 线缆束（Cable Harness）\n\n用于相互连接电子系统的电缆或电线组。\n\n###\
  \ 电缆护层（Cable Sheath）\n\n应用于电缆的导电保护层。\n\n### 电缆（Cable）\n\n封装在护套内的一组或多个绝缘导体、光纤或两者的结合，通常用于传输不同类型的电信号。\n\
  \n### 电容器（Capacitor）\n\n由两个由绝缘体分开的板制成的电子元件，旨在储存静电。例如，`capacitor` 是电容麦克风中的关键组件。\n\
  \n### 卷轴（Capstan）\n\n磁带录音机的一个机械部件，控制磁带通过它时的速度。\n\n### 囊（Capsule）\n\n除去太空旅行的定义，这是麦克风中包含振膜和活性元件部分的名称，即将声波转换为电流的机械结构。\n\
  \n### 碳粒麦克风（Carbon Microphone）\n\n使用碳颗粒将声波转换为电冲的麦克风。碳元件位于两个板之间；当声波击中碳颗粒时，会产生板之间电阻的变化，影响电信号。\n\
  \n### 心形指向（Cardioid Pattern）\n\n一种麦克风采集模式，对来自前面的声音最敏感，侧面较少，对振膜背面最不利。如此命名是因为采集的形状像心（cardio）。\n\
  \n### 载波（Carrier）\n\n在几种不同的合成技术中，通常一个音频速率信号调制另一个音频信号。例如，在频率调制中，第二个信号（调制器）改变主信号（载波）的频率（音高）。\n\
  \n### 级联（Cascade）\n\n连接或链联调音器，使第一个调音器的立体总线进入第二个调音器的立体总线。\n\n### CCW\n\n逆时针，通常用于旋转旋钮向左（与时钟指针移动相反的方向）。\n\
  \n### CD\n\n光盘（Compact Disc）的缩写，或一种记录有数字音频的小型光盘。\n\n### 分（Cent）\n\n在调音时，一个半音被分为\
  \ 100 个称为分（cents）的单位；每个八度有 1200 分。当一个振荡器相对于另一个产生调调时，它们的频率差异有时用分来测量。\n\n\n\n\n\n\
  受均衡器影响最大的音频信号频率，表现为对频率的增益或衰减。在图表中，这是频率钟形曲线的最顶端或底部（即“峰值”）。\n\n### 通道路径 (Channel Path)\n\
  从声源到多轨道录音器（或数字音频工作站）的完整信号路径。例如，音频信号从麦克风传输到前放大器，然后进入调音台的通道条，最后通过输出发送到录音器。这与监听路径（Monitor\
  \ Path）不同，后者将混合信号送入监听扬声器或耳机，而不影响录制的信号。（参见“监听路径”。）\n\n### 通道 (Channel)\n1) 在多轨道磁带宽度范围内进行的音频录音，或在数字音频工作站内隔离的轨道，通常用于与其他通道合并。\n\
  2) 音频信号通过设备从输入到输出传输或可以传输的单一路径。\n\n### 混沌 (Chaotic)\n信不信由，对于数学家来说，混沌并不意味着完全随机。混沌理论处理的是在某些边界内随机的系统——例如摇晃轮子的路径或滴水龙头的频率。尽管它们并非不受控制，但也并非完全可预测。在合成中，混沌系统通常指的是类似于低频振荡器（LFO）的调制生成器，但在原本松散或偶尔重复的模式中，具有不可预测的抖动或故障。它也可以指不符合音乐节拍的触发脉冲。\n\
  \n### 追随 (Chase)\n自动调整录音机（或序列器）的速度，以与另一台录音机同步。\n\n### 和弦图 (Chord Chart)\n一种音乐记法的简写形式，提供了歌曲的基本和弦变化和基本节奏信息。最由录音室乐手、节奏组或爵士乐队使用，提供歌曲的骨架结构，同时为演奏者创作自己的部分和即兴发挥留空间。领谱通常关注旋律线和和弦结构，而和弦图主要显示和弦变化和节奏。（参见“领谱”。）\n\
  \n### 和弦 (Chord)\n三个或多个同时演唱或演奏的音乐音高。\n\n### 副歌 (Chorus)\n1) 歌曲中每次都重复相同音乐和歌词的部分，通常包含歌曲的主旨或记忆点（Hook）。\n\
  2) 一个由许多歌手组成的音乐合唱团。\n3) 一种延迟效果，通过添加多个带有轻微反馈和中等深度延迟来模拟人声合唱效果。\n\n### 电路 (Circuit)\n\
  1) 电流的一条完整路径。\n2) 与定义 1 类似，但包括完成特定音频功能的所有音频信号路径和组件。\n\n### 类兼容 (Class Compliant)\n\
  这指的是“即插即用”的设备——它可以直接插入计算机或其他主机，并立即被识别，而无需安装额外的驱动程序。这在模块化世界中带有 USB 的 MIDI 转 CV/Gate\
  \ 接口中：如果你的转换器是 `USB Host`，并且将一个类兼容的 `USB Device`（如控制器键盘或推子面板）插入它，转换器将识别它。\n\n###\
  \ 节拍 (Click Track)\n输入到耳机监听中的节拍器“滴答声”，旨在帮助音乐家与歌曲保持同步。\n\n### 剪切 (Clip)\n所有活动电子电路对通过其的信号强度都有限制。这些限制通常与正负电源电平水平有关。如果信号尝试超过这些限制，它们会在限制处被切断或削掉。例如，`+12\
  \ volts` 的输入电压可以无损地通过，但输入处的 `+13 volts` 输出为 `12 volts`。这种剪切会导致波形失真，通常会高谐波（如刺耳的嗡嗡声）。不同的电路以不同的方式进入剪切——某些在达到平坦阈值之前可能会有一定的圆角；这被称为\
  \ `soft clipping`（软剪切），通常是理想的，因为它不那么刺耳。之所以被称为 Clipping，是因为生成的图形波形看起来像波形的边缘被“剪掉”了。\n\
  \n### 时钟信号 (Clock Signal)\n由电路内设备发送的信号，产生稳定的脉冲或代码，以保持其他设备同步。音乐世界中的例子是通过 MIDI 进行排序。序列器发送时钟信号，以便连接的设备同步播放。\n\
  \n### 时钟 (Clock)\n通常指系统中的主节奏脉冲。通常，时钟脉冲远快于它驱动的任何东西，例如序列器或 `LFO`。最常见的时钟频率是 `24 ppqn`（每四分音符脉冲），MIDI\
  \ 时钟和 `DIN Sync` 如此。然而，驱动序列器每次前进一个音符的触发信号也可以称为系统中的“时钟”。事实上，某些模块会创建主时钟的分频和倍频，以生成与主时钟相关的新时钟信号。\n\
  \n### 顺时针 (Clockwise)\n顺时针，如向右旋转旋钮——与时钟指针移动的方向相同。\n\n### 近距离采样 (Close Miking)\n\
  一种麦克风放置技术，将麦克风放置靠近声源处，以捕捉直接声音并抑制环境声。\n\n### 同轴电缆 (Coaxial Cable)\n（缩写为“Coax”）一种双导体电缆，由一个屏蔽层围绕一个导体组成。\n\
  \n### 同相拾音 (Coincident Miking)\n一种立体声拾音技术，将两个麦克风的头部尽可能靠近。这防止了混音中的相位抵消问题，因为声音到任一麦克风的距离是相同的。\n\
  \n### 扩缩器 (Compander)\n作为压缩器和扩展器的结合信号处理器，主要用于模拟系统中的降噪。音频信号在录制前被压缩，然后在播放阶段被扩展。扩缩是\
  \ `Dolby noise reduction systems` 后背的原理。\n\n### 比较器 (Comparator)\n一种比较一个电压水平与第二个电压水平的电气设备。第二个电压可以是\
  \ `comparator synth module` 第二个输入，也可以通过旋钮或内部参考电压设置。大多数情况下，比较器输出一个门控信号，当第一个电压高于第二个电压（或反之）时为高电平，当第一个低于第二个时为低电平。在音频速率下，它将输入波形转换为方波或脉冲波，并在新波形变高或低时设置第二个信号。\n\
  \n### 轨道编辑 (Comping)\n1) 在数字音频工作站 (DAWs) 中，合并多次录音以创建“编译”轨道的过程。（参见“Take”、“播放列表”。）\n\
  2) 在爵士乐表演中，“伴奏”（accompanying）的缩写。\n\n### 复合振荡器 (Complex Oscillator)\n该模块通常在一个面板后有一对振荡器，并经过预先布线，其中一个振荡器调制另一个的频率（称为\
  \ `Frequency Modulation` 或 `FM synthesis`）；有些还允许你快速切换它们，使第一个调制第二个的振幅，或其他变体。它们可能还内置了波形整形器。它们基于\
  \ Buchla 创建的一种流行模块，这是“西海岸”合成方法的标准。\n\n### 压缩驱动器 (Compression Driver)\n一种将声压波送入喇叭式扬声器的振动膜。\n\
  \n### 压缩比 (Compression Ratio)\n压缩器衰减输入信号的速率，以分贝测量。例如，`4:1` 的压缩比意味着当信号超过阈值每增加 4 dB\
  \ 时，压缩器只允许信号增加 1 dB。\n\n### 压缩 (Compression)\n1) 在信号处理中，压缩器执行的动作（参见“Compressor”）。\n\
  2) 在声学中，由声压波峰值引起的空气压力增加，用于“压缩与稀疏”的语境（参见“Rarefaction”）。\n\n### 压缩器 (Compressor)\n\
  \n\n\n\n\n# 信号处理器或插件，通过放大音频信号的较小部分并衰减较大的部分来缩小音频信号的动态范围。\n\n## 电容式麦克风\n一种通过电容器的变化将声音转换为电流的麦克风。声波推动振膜，产生电容的变化，然后这些变化被转换为电压。\n\
  \n## 接触式麦克风\n一种设计用于拾取固体振动（而非空气中的振动）的麦克风。也被称为“拾音器”或“压电”，这种麦克风常用作声吉拾音器来采集面板的振动，或用于使用各种物体创作“噪音音乐”的实验音乐人。\n\
  \n## 控制电压处理器\nCVP 是此类模块的缩写，它允许对通过它的电压进行处理——例如放大或衰减电压、向正向或负方向偏移、引入压摆（电压变化的平滑处理），以及可能的其他功能，例如通过通过比较器从输入电压派生门控信号。Make\
  \ Noise 的 Maths 可能是市场上最知名的控制电压处理器；你也会发现一些名称中专门带有 CVP 的模块。无论如何，在系统中拥有一个或多个此类模块是很有帮助的，可以帮助调节电压以实现你的想要（或教给它们新技巧）。\n\
  \n## 控制电压\n控制电压（CV）的概念是模块化合成器的核心。其基本思想是使用模拟电压电来控制模块的功能和参数。例如，一个控制电压可以决定振荡器播放的音高；第二个控制电压可以决定该信号通过电压控制放大器后的音量大小。CV\
  \ 是控制电压最常用的缩写——例如，当一个合成器模块说它具有“滤波器共振的 CV 控制”时，这意味着有一个控制电压输入用于控制共振（反馈）的量，而不仅仅是前面板上常见的旋钮。\n\
  \n## 控制器\n从广义上讲，控制器是任何用于控制另一个设备的设备。最常用的是 MIDI 控制器，它发送 MIDI 信号来控制其他连接的 MIDI 乐器和设备。录音室中的其他控制器示例还包括监听控制器、DAW\
  \ 控制器和 DJ 控制器。\n\n## 角频率\n滤波器的截止频率或角频率是其开始过滤的点。例如，如果低通滤波器的角频率为 500 Hz（每秒周期），则所有低于\
  \ 500 Hz 的谐波或其他声音成分将不受干涉地通过，而所有高于 500 Hz 的谐波将被“过滤”——越高于 500 Hz，音量就越小。\n\n## 逆时针\n\
  逆时针，通常在向左旋转控制旋钮的语境下（与时钟指针移动的方向相反）。\n\n## CPU\n中央处理器的缩写，计算机中的主“大脑”芯片（也简单称为“处理器”）。\n\
  \n## 关键距离\n直达声与回声音量相等的声源距离。关键距离根据空间而异；在有吸音墙的房间里，关键距离离声源较远；而在回响较大的房间里，距离会靠近声源。\n\n\
  ## 交叉淡入\n音频编辑技术，其中一个声音淡出的同时另一个声音淡入，以在两者之间创建无缝过渡。音频工程师使用交叉淡入，例如，将录音轨目的两个或多个“分轨”混合为一个复合轨道。俱乐部\
  \ DJ 也使用交叉淡入在不停止的情况下从一首歌切换到下一首歌。\n\n## 分频频率\n分频器停止向一个扬声器发送信号并开始发送给另一个扬声器的频率。\n\n\
  ## 分频器\n一种音频滤波器组件，将音频信号分成两个或多个频段或信号，通常根据频率范围馈入扬声器系统的不同组件。（也称为“分频网络”。）\n\n## 串扰\n\
  两个音频通道之间不必要的音频信号泄漏——例如，调音台通道之间的信号重叠，或者磁带上两条轨道之间的音频重叠。\n\n## 标记/切入 (Cue)\n通常来说，cue\
  \ 是一首音乐或一段音乐片段的起始点。根据语境，“cue”一词可能描述：\n1) 音乐家或歌手应该开始演奏或演唱的点；\n2) 通过耳机馈送给音乐家的音频，以便他们判断何时开始演奏/演唱；\n\
  3) DAW 内或磁带音乐时间轴上的特定位置点；或\n4) 将磁带或光盘设置到歌曲的某个起始点（“点入”）。cue 甚至可以指用于视频制作的整个音乐部分。\n\n\
  ## 截止频率\n滤波器的截止频率或角频率是其开始过滤的点。例如，如果低通滤波器的角频率为 500 Hz（每秒周期），则所有低于 500 Hz 的谐波或其他声音成分将不受干涉地通过，而所有高于\
  \ 500 Hz 的谐波将被“过滤”——越高于 500 Hz，音量就越小。\n\n## 截止斜率\n滤波器通过带之外频率衰减率。斜率描述为滤波器在截止频率之后每倍频内减少信号的分贝（dB）数。\n\
  \n## CV/Gate\n这种简写，表示合成器可以通过电压（通常用于音高）和门控信号（指示音符何时“开启”）来受控制。越来越多的控制器键盘除了常见的 MIDI（乐器数字接口）外，还包含了\
  \ CV/Gate 输出，这使得它们更容易连接到模块化合成器，因为不需要额外的 MIDI 转 CV 接口。\n\n## CV\n控制电压（CV）的概念是模块化合成器的核心。其基本思想是使用模拟电压电来控制模块的功能和参数。例如，一个控制电压可以决定振荡器播放的音高；第二个控制电压可以决定该信号通过电压控制放大器后的音量大小。CV\
  \ 是控制电压最常用的缩写——例如，当一个合成器模块说它具有“滤波器共振的 CV 控制”时，这意味着有一个控制电压输入用于控制共振（反馈）的量，而不仅仅是前面板上常见的旋钮。\n\
  \n## CW\n顺时针，如在向右旋转控制旋钮的语境下——与时钟指针移动的方向相同。\n\n## 周期\n波的一个完整表达式，从某点开始，经过零线到达波形的最高和最低点，最后返回与起始点相同的值。一个完整的振动或声波。\n\
  \n* * *\n\nD-Sub 连接器\n\n\n\n\n\n“D-subminiature connector”（D 型小型连接器）的缩写，`D-sub`是一种多针连接器，通常用于将计算机连接到\
  \ VGA 显示，但也偶尔用于录音室的数字音频应用。\n\n### D/A\n数字转模拟转换的缩写，将数字数据（数字音频信号）转换为离散电压电平。这是 `A/D`\
  \ 的逆过程。也称为 `DAC`。\n\n### DADSR\n这是对标准 `ADSR` 包络发生的一种稍微复杂的变体，它在初始攻击阶段（从 0 升到峰值水平）开始之前引入了一个初始时间延迟。一种补丁思路是将此类包络路由到低通滤波器截止频率，这样当音符开始时最初是静音且经过过滤的声音，经过暂停后声音开始增强变成更明亮、更饱满的声音。\n\
  \n### Daisy Chain（链链连接）\n将三个或更多设备串联连接，音频信号通过一个设备到达第二个设备，再通过第二个设备到达第三个，以此此类推。\n\n\
  ### Damping Factor（阻尼系数）\n描述放大器在音频信号停止时，抑制扬声器振膜推回运动（`反电动势`）的能力。\n\n### Damping（阻尼）\n\
  通过摩擦力减少振动系统中的能量。可以指电信号中振幅的减少，也可以指乐器受抑制的振动（例如原声钢琴上的延音踏板）。\n\n### DAW\n数字音频工作站（Digital\
  \ Audio Workstation）的缩写，一种用于数字录制和混合音频的设备或软件程序。\n\n### dB\n分贝（decibel）的缩写，一种比较信号强度（通常是音频电平）的测量比例值。\n\
  \n### DBX\n一系列降噪系统，以开发这些系统的公司命名。`DBX` 降噪系统的广为人知的 `Dolby`杜比）系统商业成功程度较低，但在录音室中仍偶尔可见。\n\
  \n### DC Coupled（直流耦合）\n当一个模块说明其输入是 `DC Coupled` 时，意味着它可以接受 `DC` 电压（恒定或缓慢变化的电压）并将其不改变地通过。如果你（例如）想使用\
  \ `VCA` 来控制通过它的包络的振幅，这一点非常重要：你需要一个 `DC coupled` 的设备，因为 `AC coupled` 输入会尝试移除信号的 `DC`\
  \ 成分（如其持续电平）并将其返回 `0v`。\n\n### DC（直流）\n单向流动的电流，与交替方向流动的交流电（`AC`）相反。许多电子设备运行在直流电，通常由电池、USB\
  \ 电源或插入墙插座的 `AC adapter` 提供。\n\n在模块术语中，`DC` 指倾向于保持一段时间稳定水平的电压，例如门输出在音符关闭时切换到 `0v`，在音符开启时切换到\
  \ `5v` 或 `10v`。它也可以指缓慢变化的电压，例如包络线。\n\n### DCO（数字控制振荡器）\n`DCO`（`Digitally Controlled\
  \ Oscillator`）是一种模拟振荡器的混合设计——它不是使用电压电平来确定振荡器的频率，而是使用计数器等数字设备来确定每个波形周期的长度，从而确定频率。优点是调音非常稳定，不像某些全模拟设计。缺点是，当每个音色使用多个振荡器时，音高上没有产生细微偏调（因此不会产生“厚实感”）的不完美之处。\n\
  \n### De-esser（去齿器）\n一种音频压缩器，旨在降低咱音和频率的音量，特别是发字母“s”时产生的声音。\n\n### Decay（衰减）\n通常，衰减是指电压或整体电平从某个高点下降，例如包络发生器的衰减阶段。现实中的类比是，在你最初击鼓或拨动琴弦后，它的音量从初始的响度逐渐衰减，直到完全安静。它也可以指混响或回声效果的尾声，声音随时间推移消失。\n\
  \n### Decca Tree（德卡树阵列）\n一种立体声麦克风放置技术，涉及三个（通常是全指向性的）呈“T”型排列的麦克风。常用于唱团、交响团和其他大型编制，但\
  \ `Decca tree` 技术的变体今天也用于环绕声环境。\n\n### Decibel（分贝）\n（缩写为“dB”）根据比例尺对两个水平进行的比例测量，其中特定百分比的变化为一个单位。最常描述音频电平。\n\
  \n### Degaussing（消磁）\n使物体去磁的过程。在音频背景下，消磁基本上是擦除磁带上的记录。\n\n### Delay/Attack/Decay/Sustain/Release（延迟/攻击/衰减/持续/释放）\n\
  这是对标准 `ADSR` 包络发生的一种稍微复杂的变体，它在初始攻击阶段（从 0 升到峰值水平）开始之前引入了一个初始时间延迟。一种补丁思路是将此类包络路由到低通滤波器截止频率，这样当音符开始时最初是静音且经过过滤的声音，经过暂停后声音开始增强变成更明亮、更饱满的声音。\n\
  \n### Delay（延迟）\n你们都知道在现实世界中 delay 这个词的含义；它在模块合成器内部可以以不同的形式出现。例如，它可以指回声重复之间的间距；这就是为什么回声设备通常被称为“延迟”效果。它也可以指你延迟信号程序的时间，例如门信号、触发器或包络的初始阶段，使音符开始的时间比实际播放的时间要晚。\n\
  \n1) 一种将音频信号录制到介质或设备，并在延迟后播放，然后与原始未延迟信号混合，以创建各种效果，如更饱满的声音、回声、合唱、法兰等。\n\n2) 创建延迟效果的信号处理器。\n\
  \n### Demo（演示带）\n一种初步录制，旨在让听众了解歌曲在最终制作中听起来的样子。Demo 通常包含较少的跟踪或制作，就像录制的“草稿”。\n\n###\
  \ Difference\n从另一种电压减去电压的一种高级说法。它也可以应用于音频或谐波。\n\n### Detune（偏调）\n如果你有两个频率完全相同的振荡器——我的意思是，频率完全相同——那么使用多个振荡器就没意义。然而，当你稍微改变一个振荡器的调谐时——换句话说，使其偏调——你将开始听到两者之间有趣的相互作用，通常被称为合唱或拍频。\n\
  \n故意让乐器或信号偏调（通常是微小的）。这种效果在录音室有很多用途，但常用于“双轨”，将偏调的乐器/轨道与原始轨道混合以产生更饱满的声音。\n\n### DI（直接输入）\n\
  通过电学拾声器或直接连接盒将电气音频信号直接发送到调音台的过程，而不是使用麦克风。\n\n### Dialogue（人声/对话）\n在电影/视频声音、广告和指令录制中录制的说话内容。\n\
  \n### Diaphragm（振膜）\n麦克风的一部分，响应声波而移动，将其转换为电信号。\n\n### Digital Multimeter（数字万用表）\n\
  一种测试电压、电流和电阻的小型设备。万用表在录音室中校准电气系统和排除问题非常有用。\n\n### Digital Recording（数字录制）\n\n\n\n\
  \n\n*将音频信号转换为代表波形的数字，然后将这些数字存储为数据的过程。*\n\n## 数字信号处理\n\n（缩写为 `DSP`）指在模拟音频信号转换为数字音频后进行的任何信号处理。*\n\
  \n## 数字模拟转换器\n\n（缩写为 `D/A`）一种将数字音频的数字数据转换为接近原始模拟音频的电压水平的设备。*\n\n## 数字\n\n曾有那么段时间，`digital`（指基于二进制逻辑、计算机等构建的电路，这与构成模拟电路的旧式晶体管、运放大器、电容器和其他元件相比）在合成器制造者中曾是一个贬义词。人们的假设是，数字技术产生的声音听起来更加冷冰、刺耳且具有攻击性——而且就是不够“正宗”。今天，数字电路已被合成器（包括模块化系统）所采用。尽管模拟信号在我们心中永远占据着特殊地位，但一个实现良好的数字电路听起来和模拟电路一样好，而且数字信号处理和编程可以创造比大多数模拟电路更广泛的声音。*\n\
  \n## 数字控制振荡器\n\n`DCO`（`Digitally Controlled Oscillator`）是一种模拟振荡器的混合设计——它不使用电压电平来确定振荡器的音高，而是使用数字设备（如`counter`）来确定每个波形周期的长度，从而确定音高。优点是调音非常稳定，不像某些全模拟设计。缺点是，当每个音色使用多个振荡器时，音高上没有导致细微偏调（从而产生“厚实感”感知）的缺陷。*\n\
  \n## DIN 立声\n\n一种立体声麦克风放置技术，将两个心形麦克风间隔约 `20cm`，并彼此成 90 度向外偏以创建立体声场。特别适用于近距离立体声采样。（参见“近距离同步拾音”）。*\n\
  \n## DIN Sync\n\n一种用于控制序列器、琶音器和鼓机节奏的时钟信号，使用带有 `DIN` 连接器的电缆进行传输（是的，就像旧式的 MIDI 接口一样，但\
  \ `DIN Sync` 还要老）。Roland 开创了这一标准，包括每四分音符发送 24 个脉冲（`PPQN`），产生了 `Sync24` 这一别名。Korg\
  \ 设备使用了该标准的变体，运行为每四分音符 48 个脉冲，也称为 `Sync48`。`DIN Sync` 仍然是向模块化合成器发送时钟信号的流行方式，特别是在与其他老合成器、序列器和鼓机连接时。*\n\
  \n## 二极管梯滤波器\n\n这种滤波器设计通常与 Roland `TB-303` 低音线相关，它以其橡胶般的声音和渴望的共鸣而闻名。*\n\n## 二极管\n\
  \n允许电流在一个方向流动而在另一个方向不流动的电子元件。在录音室中，这些元件常见于电子管放大器的真空管中。*\n\n## 直一种将不平衡高阻抗扬声器或乐器电平输出转换为平衡低阻抗麦克风电平输出的小设备。经常用于将乐器“直接”连接到调音台的信号路径，而不是通过麦克风采集。也称为“直接注入盒”或\
  \ `DI`。*\n\n## 直流\n\n（缩写为 `DC`）沿一个方向流动的电流，与交替方向流动的交流电（`AC`）相对。许多设备运行在 `DC` 上。*\n\
  \n## 直接注入\n\n（缩写为 `DI`）将乐器直接发送到调音台的过程，而不是通过麦克风采集。*\n\n## 直接输出\n\n某些调音台上可用的输出，可将信号直接发送到另一个设备（如录音机），而不通过通道条。这通常被称为\
  \ `dry`（干声）。*\n\n## 直声\n\n不经过任何障碍物反射直接到达耳朵的声音。*\n\n## 方向性模式\n\n1. 在麦克风中，指其最敏感的区域。\n\
  2. 在扬声器中，指声音覆盖的模式。*\n\n## 扩散角（也称为离散角）\n\n扬声器具有水平和垂直扩散角的区域。*\n\n## 远拾音\n\n将麦克风放置在远离声源的地方的技术，以便采集直接声和反射声的结合。*\n\
  \n## 失真\n\n指的是设备输出处波形的变形，通常由于过载引起。虽然电气或音频失真通常是不希望且应被避免的，但在受控的情况下经常被用于产生理想的效果。*\n\
  \n## 分性\n\n1. 在音频设置中：在无线接收器中使用两个或多个天线以防止音频中断。\n2. 在其他设置中：对个人独特性的追求。*\n\n## 杜比\n\n\
  一个降噪系统和其他音频系统的制造商品牌，用于提高音频录制和播放的性能和保真度。*\n\n## 多普勒效应\n\n声源在移动时，人耳感知到声音频率（音高）变化的现象。当声源靠近时，声波到达耳朵的距离缩短，增加了波频和声音音高；当声源远离时，声波必须传播得远，导致频率降低。这种效应的一个常见例子是接近的紧急车辆，其警报声在靠近时较高，经过后变低。多普勒效应可以用于音频设置，例如在\
  \ Leslie 扬声器中，电动机旋转箱体内的扬声器，不断改变声源与听者（或麦克风）之间的距离，创造出其标志性的颤音效果。*\n\n## 双录\n\n1. 录制与第一次非常匹配的第二次表演，目的是混合两条轨道。\n\
  2. 使用中等延迟的延迟线来模拟双轨叠加。*\n\n## 驱动器\n\n1. 扬声器中将电信号转换为声压波的换能器。\n2. 控制外接设备或硬件的计算机程序。*\n\
  \n## 掉声\n\n磁带上音频信号的短暂丢失，或数字音频文件中数据的短暂丢失（通常由于丢帧），会导致音频出现不希望的凹陷、裂纹声或砰声。*\n\n## 鼓机\n\
  \n一种在内存中包含合成和/采样鼓声的电子设备，并带有一个内部序列器，可以编程播放鼓点模式或循环。\n\n## 鼓点模式\n\n由鼓手演奏或序列进鼓机用于歌曲的特定鼓声序列。\n\
  \n\n\n\n\n没有添加效果的声音被称为“干声”（dry）；而混合了效果（如混响）的声音被称为“湿声”（wet）。效果器或调音器通常具有干/湿混合量调节功能，用于设定原始未处理声音与完全经过效果声音之间的比例。\n\
  \n### DSP\n在模拟音频信号转换为数字音频后进行的任何信号处理。\n\n### Dub（双声道录制/叠加录制）\n1. 复制录音。\n2. 与另一段录音进行实时录制，意在混合这两段录音（参见“Overdub/Overdubbing”）。\n\
  3. “Dub”是“Dubstep”（低步舞）的缩写，一种电子音乐的风格或子类型。\n\n### Ducking（避让）\n一种基于压缩的音频效果，音频信号会根据另一个音频信号的存在而按比例降低，有时通过与信号处理器的“侧链”（sidechain）连接来实现。一个显著例子是在音乐轨道上录制旁人旁白音轨道，当说话者开始说话时，音乐音量会下降。另一个更微妙的例子是音频工程师“压低”特定声音，以为轨道中的其他声音留出空间；例如，低音吉他信号触发了鼓或吉他音量的轻微降低。（参见“Sidechain”。）\n\
  \n### Duophonic（双声）\nDuophonic 意味着两个“声音”。大多数早期合成器（包括模块化系统）是单声的（monophonic），这意味着它们一次只能弹音符；某些乐器拥有足够的振荡器、滤波器、包络和放大器，可以同时播放两个独立的音符。某些模块合成器的\
  \ MIDI 接口包含双声模式，你可以从键盘连接并控制两个独立的声音。一些用户会混用双声、单声和多声（polyphonic）等术语。\n\n### Duration（持续时间）\n\
  Duration 是长度的另一种表达方式。持续一段时间（例如 100 msec）高电平的时钟脉冲或门信号被称为持续时间为 100 msec。你按住音符的时间或序列中一个步骤的长度也被称为持续时间。\n\
  \n### Dynamic Microphone（动圈麦克风）\n（也称为动圈麦克风）一种通过在磁场中移动感应线将声波转换为电音频信号的麦克风——这一过程通常被比作反向工作的扬声器。动圈麦克风不如电容麦克风灵敏，但在录制较大的声源或近距离应用中非常有效。\n\
  \n### Dynamic Processing/Dynamic Signal Processing（动态处理/动态信号处理）\n自动改变电平（或增益）以改变最大音频与最软音频之间电平关系的过程。动态处理器包括压缩器、限幅器、扩展器和门。\n\
  \n### Dynamic Range（动态范围）\n1. 歌曲或录音中最强峰值与最低电平之间的比例（dB）。\n2. 设备或系统在不失真的情况下能提供的最低与最高电平之间的比例（dB）。\n\
  \n### Early Reflections（早期反射）\n经过房间表面反射到达者耳朵的第一声波，通常在初始声音后几乎立即听到。混响的第一阶段。\n\n###\
  \ East Coast Synthesis（东海岸合成）\n这是一个统称，适用于由东海岸公司（如 Moog、Arp 和 EML，以及 Roland 和 Korg\
  \ 等“远东”公司）开的最常见的合成器配置，其中一个或多个振荡器被输入滤波器，这即减法合成。\n\n### Echo Chamber（回声室）\n一个设计有反射表面的封闭房间。\n\
  \n### Echo（回声）\n由于反射引起的声音的清晰重复。\n\n### Edit（编辑）\n更改录音的一个部分。\n\n### Effect Loop（效果循环）\n\
  有时你可能想将信号发送到外部，处理后再回来。\n\n### Effects Processor（效果处理器）\n（也称为吉他效果器）一种为直接信号添加效果的设备，如混响、合唱、滤波、延迟、过载、放大器模拟。\n\
  \n### Effects Track（效果轨道）\n1. 在电影制作音频中，用于与对话混合的效果录音。\n2. 在音乐录制中，一个添加到另一个轨道上的效果轨道。\n\
  \n### Effects（效果）\n1. 通过向信号中添加内容来修改音频信号的各种方式。\n2. 电影或视频中 Sound Effects（对话或音乐之外的声音）的简称。\n\
  \n### EG（包络发生器）\n包络发生器（`EG`）连接到 `VCA`（电压控制放大器）时用于塑造音符的响度或动态，当连接到 `VCF`（电压控制滤波器）时改变其频率内容或音色随时间的变化。\n\
  \n### Electret Microphone（驻极电容麦克风）\n电容麦克风的一种变，使用驻极代替电容器。\n\n### Electret（驻极）\n一种设计有永久极性的电介质板。\n\
  \n\n\n\n# (电磁场，简称 EMF) \n由于电流流过导体而产生的磁能场。\n\n## 电磁干扰 (EMI)\n\n全球音频专业人士的噩梦。EMI 是一种由附近的电磁活动引起的干扰，这种干扰会被音频线缆和设备接收，导致音频系统中产生不需要的噪声、嗡嗡声或滋滋。音频系统中\
  \ EMI 的常见原因包括大电流电源线、荧光灯、调光开关、计算机、视频显示器和无线电发射器。\n\n## 电子\n\n围绕原子核运行的带负电的粒子。电流是由电子沿导体（如金属线丝）移动产生的。\n\
  \n## 强调 (Emphasis)\n\n这个词有两个含义。在普通的音频语境下，它通常指某种形式的高频增强，因为强调高谐波可以增加音色的清晰度，并帮助将其与其他声音区分开。在合成器中，强调通常指滤波器上的\
  \ `Q` 或共振设置，因为增加此设置会增强（强调）截止频率或转角频率处的谐波。\n\n## 包络跟踪器 (Envelope Follower)\n\n该模块追踪声音的响度轮廓，并输出与该响度变化相对应的电压。它们倾向于对信号进行某种平滑处理，使其在本质上不那么敏感或跳跃。包络跟踪器通常还有一个门限输出，当输入信号的响度超过特定电平时输出高电平，当落回该电平以下时输出低电平。\n\
  \n## 包络生成器 (Envelope Generator)\n\n包络生成器 (`EG`) 模块连接到 `VCA`（电压控制放大器）时用于塑造音符的响度或动态；连接到\
  \ `VCF`（电压控制滤波器）时用于塑造频率内容或音色随时间的变化。为了实现这一点，包络生成器创建一个通常从 0 伏上升到某个最大值，然后再下降的电压。你可以控制这个过程持续多久，通常分为几个阶段：从\
  \ 0 到最大值的起始阶段 (Attack)；从最大值回落到 0（在 `AD`，即 `起始/衰减` 包络的情况下）或称为维持 (Sustain) 的中间电的衰减阶段\
  \ (Decay）；然后（通常在按键释放且相应的门限信号回到 0 后）从维持电平回到 0，这段持续称为释放 (Release)。\n\n## 包络跟踪 (Envelope\
  \ Tracking)\n\n这描述了包络跟踪器的主要动作：一个模块或模块的一部分通过追踪信号的响度，并输出与该输入——即轨迹——对应的电压。\n\n## 包络\
  \ (Envelope)\n\n声音生命周期四个元素的统称：起始 (Attack)、衰减 (Decay)、维持 (Sustain) 和释放 (Release)，简称\
  \ `ASDR`。声音的包络描述了声音或音频信号在一段时间内强度的变化情况。\n\n## 等响度曲线 (Equal Loudness Contours)\n\n\
  绘制了几条曲线，显示了不同频率的音调需要多多大的播放，人们才会认为它们的响度相等。（参见“费彻-曼森曲线”。）\n\n## 均衡器 (Equalizer)\n\n\
  一种音频信号处理器，使用一个或多个滤波器来增强或减少声音中某些频率的幅度（音量）。其基本原理是平衡或“均衡”音频系统的频率响应，或者在声空间中的多个信号之间建立平衡。然而，音频工程师可能会使用均衡器以许多不同的方式改变或“染色”声音。\n\
  \n## Eurorack (欧若贝)\n\nEurorack 可能是目前最流行的模块化合成器格式，拥有 100 多个制造商和 1000 多个模块。它由 `Doepfer\
  \ Musikelektronik` 于 1995 年创建，其尺寸基于实验室设备的 Eurorack 格式。有些用户会试图告诉你 Eurorack 的“听起来”没有其他格式好，但这只是基于少数质量不标准的制造商或模块；该标准本身没有任何导致最终声音产生巨大差异的特性（不；12\
  \ 伏和 15 伏电源之间的差异对大多数耳朵来说并不大）。\n\n## 扩展器 (Expander)\n\n一种信号处理器（或插件），其功能与压缩器相反，它是扩展音频信号的动态范围而不是压缩它。它通过进一步减小低于设定阈值的信号的幅度来实现这一点。\n\
  \n## 扩展比 (Expansion Ratio)\n\n扩展器衰减输入信号的速率，以分贝为单位。例如，`2:1` 的扩展比意味着信号每低出阈值 `1dB`，扩展器就会减少\
  \ `2dB` 的信号。如果信号低于阈值 `3dB`，扩展器会将其衰减 `6 dB`，依此类推。\n\n## 指数 (Exponential)\n\n##而言，这是一种数学曲线，开始相对平坦，然后弯曲陡峭上升。在合成器术语中，它通常指控制电压方案，其中\
  \ `1 volt` 的变化对应于音高增加一个八度，即每秒循环（振动）次数翻倍。这与线性系统相反，在线性系统中 `1 volt` 的增加始终会导致相同的每秒循环增加。\n\
  \n***\n\n## 淡出 (Fade)\n\n音频信号电平的逐渐降低，或电平从一个预设水平到另一个电平的逐渐变化。\n\n## 推子 (Fader)\n\n\
  一种用于调整控制台通道或通道组的输入信号电平（增益或衰减）的控制器。\n\n## 远场 (Far Field)\n\n远离扬声器的区域，在此距离每增加一倍，声音下降\
  \ `6dB`，直到达到临界距离。远场的开始取决于扬声器的大小，但在大多数情况下，远场开始于声源约 3 英尺处。音频工程师在精调混音时通常同时使用近场和远场监听。（参见“临界距离”、“近场”。）\n\
  \n## 馈送 (Feed)\n\n发送音频或控制信号到。\n\n## 反馈控制 (Feedback Control)\n\n延迟线或效果设备上的控制，用于控制反馈系统的量。\n\
  \n## 反馈 (Feedback)\n\n将输出信号的一部分返回系统输入。这可以通过反馈电路以受控的方式改变乐器的声音（最常见电吉他或模拟合成器）。它也可以描述当开启的麦克风接收附近扬声器声音时产生的反馈循环，产生巨大的震荡频率，直到通过关闭麦克风或扬声器或使用均衡器衰减该频率来打破反馈循环。\n\
  \n## 真度 (Fidelity)\n\n描述从源处再现声音准确性的词。\n\n## 字形图形 (Figure-8 Pattern)\n\n一种麦克风拾音模式，对正前方和正方的声音最敏感，有效抑制来自侧面的声音。\n\
  \n### 滤波器 (Filter)\n\n通过减少或移除某些频率和谐波的模块。在合成器中，最典型的滤波器类型有低通（允许截止频率或转角频率以下的所有谐波不受影响，然后越高于该截止频率，高频谐波的幅度越小）、高通（允许截止频率以上的所有谐波不受影响，并随着越低于截止频率，低频谐波的幅度越小）、带通（允许截止频率附近的谐波完整通过，然后越远离截止频率（无论是上方还是下方），幅度越小）以及带阻（截止频率附近的谐波被减小或完全切除；上方或以下的谐波则保留）。\n\
  \n## 磁链 (Flanger)\n\n\n\n\n\n### 简介\n信号处理器通常被识别为产生“喷气式飞机起飞”嗖声的设备。面板背后的原理是输入信号的一个副本被延迟了极小的时间（比合唱效果长，但短于回声效果），并与原始信号混合。当延迟是恒定时，结果就是产生“梳状滤波器”，某些谐波在反相位混合回自身之上时会被抵消。当延迟随时间变化时，你就会得到“嗖嗖”声和扫频声。这种效果最初是通过同时播放两盘相同歌曲的磁带，让它们同步启动，然后用手指按住其中一个磁带的法兰来延迟它实现的。\n\
  \n### 快速效果 (Flanging)\n一种通过将信号与其带有微小时间延迟的副本混合，然后对延迟副本进行修改，产生“旋转”声的音频效果。这最初在模拟磁带录制中是通过同时在两台录音机上播放原始磁带和副本，然后物理地按下其中一台机器的法兰来改变复制轨道的时间来实现的。如今，大多数快速效果都是通过延迟盒或数字插件完成的。\n\
  \n### 平直 (Flat)\n1) 用于描述设备或扬声器频率响应均匀的术语，意味着设备/扬声器平等对待所有频率，不需要 `EQ`。当以图形显示时，频率响应显示为一条没有峰值或谷值的“平直”直线。\n\
  2) 在音乐中，描述音准错误的音符或音高，听起来比应有的频率略低。\n3) 在乐谱中，一种“临时记号”，指示演奏者/歌手将该音符降低半音。\n\n### 莱特勒-蒙森曲线\
  \ (Fletcher-Munson Curves)\n也称为“等响度曲线”，一组绘制的图表曲线，用于说明人耳在不同音量下对不同频率的响应。以首次绘制这些曲线的两位研究人员命名。（另见“等响度曲线”。）\n\
  \n### 锁触发器 (Flip-Flop)\n在二进制逻辑术语中，触发器每次接收到输入触发时会在高电和低电之间切换（即：第一次触发将输出置为高，第二次触发再次将其置为低，依此类推）。在时钟或音频术语中，它将输入时钟或方波的速度除以\
  \ 2。\n\n### 浮空平衡线 (Floating Unbalanced Line)\n一种连接“变通方法”，通过修改线路中的连接使其类似于平衡线，将不平衡输出连接到平衡输入，从而减轻不需要的嗡嗡声或滋滋。\n\
  \n### 飞入 (Fly In)\n在混音或录制中加入没有同步的音频。\n\n### 飞行总线 (Flying Bus)\n这是一种非常简单的电源分配类型或总线板，通常使用沿整个长度带有多个连接器的排线，将电源的输出并分发到各个独立的模块中。它们廉价且易于安装和使用，但在某些情况下可能会导致模块之间共享噪声的根源。\n\
  \n### 调频 (FM)\n频率调制（缩写 `FM`）是指一种合成技术，其中振荡器的音高通过另一个振荡器快速地（在音频速率下）变化（调制）。结果是一组复杂的谐波侧带，这些谐波可能调准，也可能与主振荡器的基础音高产生刺耳且“不准”的声音。\n\
  \n### 音控台 (FOH)\n在现场音频环境中，场馆内舞台对面的位置，用于控制和混音演出的现场音频。\n\n### 舞台监听 (Foldback)\n一种用于现场音频的舞台监控系统。一组被称为监听器或楔形扬声器（在英国称为“折回扬声器”）的舞台扬声器提供特殊的音频信号混合，供舞台表演者听并进行演奏。这种混音通常与观众听到的\
  \ `FOH`（调控台）混音不同，有时由第二位工程师通过独立于主声响系统的放大器和扬声器进行控制。这种类型的舞台监听经常受到麦克风反馈的影响，并且在某些场馆中可能会引起不必要的反射性噪声，使\
  \ `FOH` 工程师难以为观众创建良好的混音。由于由于原因，许多现场音频系统现在使用入耳监听作为舞台扬声器的替代方案，以控制舞台噪声并降低反馈风险。\n\n\
  ### 脚踏板 (Foot Pedal)\n由音乐人用脚控制的特效设备。\n\n### 脚踏开关 (Foot Switch)\n放置在地板上由音乐人按下以执行各种功能的开关。\n\
  \n### 压力敏感电阻 (Force-Sensing Resistor)\n在模块化系统中，`FSR`（压力敏感电阻）通常呈圆形垫状，你通过按压它改变参数。它充当一个电阻，按得越用力，电阻越小。\n\
  \n### 共振峰 (Formant)\n许多基于振动管的乐器——包括我们自身的声道——都有它们喜欢振动或“共振”的特定频率。当你将声音通过这些管子时，它们会加强该声音的频率（或其某些谐波）以匹配这些共振频率。这些每一个共振频率被称为该乐器的一个\
  \ `formant`。合成类人声音的一种常用方法是将振荡器通过一个具有多个共振峰的滤波器或均衡器，这些共振峰的间距方式模拟了某些元音。\n\n`Formant`\
  \ 是人声或乐器声音中的一种元素，在发出不同音高时不会改变频率。共振峰本质上是由于声源物理结构产生的“固定”频率或共振。这些频率创造了音色，即创造吉他、长笛、男或女声等特定声音的元素。\n\
  \n### 格式 (Format)\n1) 用于存储和播放音频的许多不同媒介之一，无论是在录音室还是出于听目的。示例包括目前使用的物理格式，如黑胶唱片和光盘；过时的格式，如磁带、8\
  \ 轨道磁带和 `DAT`；模拟录制的开带轨道；以及许多不同的音频文件格式，如 `mp3`、`WAV`。\n2) 格式也可以描述录制到磁带时的特定参数，如轨道数、宽度、间距。\n\
  3) 准备硬盘或内存卡，通常是擦除所有数据。\n\n### 四限乘法器 (Four Count Multiplier)\n四限乘法器是幅度调制 (`AM`) 的特殊情况。它称为环调制或平衡调制。它改变——“乘以”第二个信号的电平。用法是将两个以音频速率运行的\
  \ `VCO` 馈入环调制器。输出是一组复杂的分量音，不遵循基础音高以上的典型“音乐”间距。也就是说，调制频率既加上又减去载波频率；产生的谐波取代原始载波和调制器。假设载波是\
  \ `600Hz` 的正弦波（只有基础谐波），调制器是 `100Hz` 的正弦波。结果将是具有 `500` 和 `700Hz` 频率分量的音调。\n\n###\
  \ 分数机架 (FracRack)\n一种由 PAiA 和 Blacet Research 提出的不常见的模块化合成器格式。它是分数机架；一个单位是 `1.5\
  \ 英寸` (3.8 cm) 宽，`3U` 高，或 `5.25 英寸` (13.3 cm) 高。\n\n### 频率范围 (Frequency Range)\n\
  1) 电子设备输出有用信号的频率范围（另见“带宽”）。\n\n\n\n\n\n### 2) 相声源能够实质性传输或接收的频率范围。每种乐器都有其特定的频率范围；人耳也可以在特定的频率范围内听音。\n\
  \n#### 频率响应 (Frequency Response)\n音频系统组件能够妥善处理、传输或接收的高、低频率之间的范围。\n\n#### 频率跳敏 (Frequency-Agile)\n\
  在无线麦克风系统中，频率跳敏指的是系统在特定带宽内选择不同 RF（射频）频率进行运行的能力。频率跳敏系统更适用于现场巡演和无线电信号密集的地区（如大城市），因为可以更改设备的\
  \ RF 频率以避免干扰。\n\n#### 频率键移编码 (Frequency-Shift Key, FSK)\n一种已过时的协议，通过将同步音录制多轨道磁带录音机的空闲轨道上，使电子设备（主要是鼓机机）能够与磁带同步运行。虽然一些旧设备仍读取\
  \ FSK，但现在更常用的是更新后的协议（`Smart FSK`）。（参见“Smart FSK”。）\n\n### 频率 (Frequency)\n特定事件在特定时间内内发生的次数。在音频和声学中，频率特指振动或波形每秒完成的完整循环次数，单位为每秒循环或赫兹（`Hz`）。在声音中，频率决定了我们听到的音高。波长越长，每秒循环越少，音高越低。\n\
  \n#### 音台 (Front-of-House)\n（简称 `FOH`）在现场音频设置中，舞台对面的位置，用于控制和混合表演的现场音频。\n\n#### 压力敏感电阻\
  \ (FSR)\n在模块化系统中，`FSR`（力感应或压力敏感电阻）通常表现为一个圆形垫，你通过按压它来改变参数。它像一个电阻，按得越用力，电阻就越小。\n\n\
  #### 全直连 (Full-Normalled)\n描述跳线矩阵（patch bay）内部的配置，插座形成一条连接的通路，直到插入跳线线以改变路径。当跳线矩阵为“全直连”时，通过在输入或输出端插入电缆即可改变连接；当为“半直连”时，仅当电缆插入输入端时路径才会改变。“非直连”或“开启”意味着没有内部连接，每个输入都通过其对应的输出发送信号。\n\
  \n#### 全波整流器 (Full-Wave Rectifier)\n全波整流器获取任何负电压并将其反转为变为正电压。这有效地使倍了许多简单波形（如三角波和正弦波）的频率。\n\
  \n#### 函数发生器 (Function Generator)\n函数发生器一术语在合成领域有两个含义。第一，产生正弦波或方波等波形的测试设备通常被称为“函数发生器”。第二，包络发生器有时被称为“函数发生器”。在这两种情况下，“函数”都指执行某种方程，例如创建正弦波等周期性波形，或响应触发产生上升和下降。\n\
  \n#### 基音 (Fundamental)\n（也称为基波频率或第一谐波）乐器或人声发出音符时存在的最低频率。\n\n***\n\n#### 增益控制 (Gain\
  \ Control)\n一种改变放大器或电路增益的设备，通常是一个可以旋转的旋钮（电位器）。在调音台上，每个通道通常都有自己的增益控制，用于调节进入调音台的信号增益——不要与通道“推子”（fader）混淆，推子是调节已经放大信号的输出。\n\
  \n#### 增益衰减 (Gain Reduction)\n压缩器或限制器调节音频信号幅的动作。\n\n#### 增益结构 (Gain Structure)\n\
  一个描述音频系统中多个组件之间互连情况，以及在每个点发生的增益增加或减少数量的术语。良好的增益结构配置意味着组件正在正常协同工作，以最小的失真或噪声提供最佳增益。\n\
  \n#### 增益 (Gain)\n音频信号强度的增加量，通常以 `dB` 表示。\n\n#### 门限器检测器 (Gate Detector)\n这是在模块化合成器内部传输的主要信号类型之一。当新音符应该开始时（例如当你按下键盘控制器上的按键），或者当序列器跳到下一个“阶段”或音符时，它会跳到高电平——通常为\
  \ `5 volts`。门信号通常会在音符持续期间（即按住按键时）保持在该水平，并在音符结束时（即松开按键时）突然下降或“变低”到休息水平——通常为 `0 volts`，但有时为\
  \ `-5 volts` 或其他数字。在实践中，当门信号发送到典型的包络发生器时，门的开始（当它“变高”时）告诉包络经历其攻击（Attack）和衰减（Decay）阶段；当门保持高电平时，包络保持在维持（Sustain）水平上，而当门再次变低时，包络移动到释放（Release）阶段。\n\
  \n#### 代际损失 (Generation Loss)\n录音音频复制时由于增加噪声和失真而丢失的清晰度。\n\n#### 代 (Generation)\n\
  用于描述录音音频信号被复制次数的术语。\n\n#### 滑音 (Glide)\n指音符在可听范围内从一个音高滑到另一个音高。这种效果的音乐术语是滑音（portamento），即音符之间的连滑。在合成器中，这种效果通过使音符音高的控制电压从上一个音符的音高滑动而不是离散跳跃来实现。创建这种效果的模块有时被称为速率发生器（slew\
  \ generator）、速率限制器（slew limiter）、斜率变发生器（slope generator）或延迟器（lag）。有些人会交叉使用 glide、glissando\
  \ 和 portamento 术语，但如果你想钻牛角尖，glissando（`gliss`）是一种不同的效果，其中中间音符更加清晰——例如按顺序快速播放——而不是连滑。\n\
  \n#### 黄金分割 (Golden Section)\n（也称为黄金比例）高度、宽度和长度的比例，其中宽度约为高度的 `1.6` 倍，长度约为高度的 `2.6`\
  \ 倍。这种比例由古希腊计算（在数学上称为 `phi`）被用作许多应用的最佳比例，包括房间尺寸和工作室设计（以获得“最佳声学效果”），甚至是某些声学乐器的设计。\n\
  \n#### 颗粒合成 (Granular Synthesis)\n颗粒合成可以被认为是应用于声音的粒子理论。该概念是声音可以分解成非常小的“颗粒”——通常持续时间为\
  \ `1-50` 或 `100 msec`。这些微小片段随后被播放以还原原始声音，或者通过改变单个颗粒的速度、音高、音量、播放顺序和方向来创建新声音。你可以在这些修改过的颗粒之间进行交叉淡入，或者叠加更多的颗粒。结果可以从音频处理技巧（如在不改变音高的情况下改变速度，反之亦然）到创造迷幻的声音“云”（事实上，确实有一个名为\
  \ Clouds 的流行模块）。\n\n#### 图形均衡器 (Graphic Equalizer)\n一种均衡器，使用分配给特定频段的滑块来调整输入信号的各种频率。（参见“均衡器”Equalizer。）\n\
  \n#### 地线抬起接头 (Ground Lift Plug)\n一种允许三脚电源线插入两脚插座的适配器。一些工程师错误地使用这种接头来中断接地连接并防止蜂鸣声（buzz），但在不通过其他手段接地设备的情况下，使用此接头断开接地是非常不安全的做法。\n\
  \n#### 地线抬起开关 (Ground Lift Switch)\n一种断开一个电路接地与另一个电路接地之间连接的开关，用于消除由地回路引起的嗡嗡声。\n\n\
  #### 地回路 (Ground Loop)\n\n\n\n\n当一个或多个电子设备连接到同一地的不同地点时产生的情况。设备在不同的接地电位下运行，接地产生电压，从而导致低频嗡嗡声，这种声音最好只是令人厌烦，最坏的情况下会损坏设备。地线环的最佳解决方案是使用中心电源将所有设备连接到同一点接地。另一种方案是通过接地抬升开关或插头打破环路，但应尽可能避免，因为这被认为是不安全的用电管理方式。\n\
  \n### 分组 (Group)\n调音台上的若干输入通道，在将组合信号发送到主输出之前，可以作为一个整体进行控制和调整。有时也称为“副混”（Submix）、“总线”（Bus）或“分组”。\n\
  \n### 群延迟\n在音频中，群延迟是所有电子音频设备（如扬声器、放大器）中的一种现象，信号中不同频率的输出之间略有延迟。简单来说，低频率的传输比高频率稍慢。在所有设备中，信号的输入和输出之间都有固有的延迟，但群延迟专门处理特定频率之间的时间延迟。任何配置的目标都是将群延迟保持尽可能小；在配置极其糟糕的情况下，高低音之间的延迟是可以听得见的。\n\
  \n### 吉他控制器\n一种电吉他（或像吉他一样演奏的设备），它传输 MIDI 数据，可用于控制合成器和声音模块。\n\n### 吉他处理器\n一种为直连吉他信号添加音频效果的设备，如混响、合唱、法兰、延迟、过载、放大器模拟等。效果处理器可以单独效果盒或多功能效果踏板（参见“脚踏踏板”、“脚踏开关”）的形式添加在吉他和调音台之间的信号路径中。它们也可以作为吉他放大器中的预设出现，甚至作为\
  \ DAW 中的数字插件存在。\n\n### 哈斯效应 (Haas Effect)\n（也称为优先效应）简单来说，是人类听觉的一种因素，我们根据时间而不是电平来感知声源。在他的研究中，赫尔穆特·哈斯（Helmut\
  \ Haas）确定，最到达耳朵的声波帮助大脑判断声音来自哪里，而不是来自来自另一个源的反射或复制。声音的反射必须比原声大至少 10dB，或者延迟超过 30ms（此时我们可以感知为回声），才会影响我们对声音方向的感知。这帮助我们区分原始声源，而不被附近表面的反射和混响所困扰。理解哈斯效应在现场音频环境中特别有用，尤其是在大型场馆，那里的扬声器经过延迟处理以匹配来自源的初始声波。\n\
  \n### 半音 (Half Step)\n音高的变化，相当于钢琴上相邻的琴键。也称为“半音”。\n\n### 半直通 (Half-Normalled)\n描述跳线矩阵（patch\
  \ bay）内的配置，其中插孔形成一条连接路径，直到插入跳线线改变路径。当跳线矩阵为“全直通”（full-normalled）时，通过在输入或输出端插入电缆来改变连接；当“半直通”（half-normalled）时，只有当插入输入端时路径才会改变。“非直通”（non-normalled）或“开路”意味着没有内部连接，每个输入通过其相应的输出发送信号。\n\
  \n### 半波整流器 (Half-Wave Rectifier)\n半波整流器仅通过正电压，并将负电压替换为 0v。换句话之，任何“零以下”的内容都会被削掉。\n\
  \n### 大厅程序 (Hall Program)\n数字延迟/混响效果单元的设置，用于模拟音乐厅。大厅程序的特征是具有高达 25 ms 的预延迟。\n\n###\
  \ 硬拐点 (Hard Knee)\n在压缩中，指一旦声音电平超过阈值，信号压缩的引入变得更加突兀。（参见“拐点”。）\n\n### 硬同步 (Hard Sync)\n\
  这是最常见的振荡器同步类型，从振荡器每当收到同步脉冲都会重置其波形。如果没有指定同步类型，那么它可能是硬同步。\n\n### 谐波失真 (Harmonic Distortion)\n\
  设备输出信号中存在输入信号中不存在的谐波，通常用于改变乐器的音色。\n\n### 谐波 (Harmonic)\n单个谐波是可能的最纯净的声音：除了音高和响度外，它不包含任何泛音或其他特征。它的振动形状——无论是振动空气让你能听见，还是引起电压起伏的的电振动——都是正弦波。大多数时候，泛音之间具有非常特定的音高关系。第一个或最低的谐波——称为“基音”，是声音的音高，就像和弦的最低音是其“根音”一样。其他谐波更高，并作为基音的整数倍排列：其频率的两倍、三倍、四倍，依此类推。前几个谐波恰好具有良好的音乐间距：一个八度；一个八度五度；两个八度。但频率越高，它们听起来可能越不音乐化。\n\
  \n### 谐波 (Harmonics)\n基频的整数倍，自然发生于音的产生过程中。在数学上，如果基频为 `x`，则谐波为 `2x`、`3x`、`4x` 等。例如，如果弹奏音的基频是\
  \ 440Hz（或 A-440），谐波将是 880Hz、1320Hz、1760Hz 等。音中谐波的存在创造了乐器或人声的音色。\n\n### 磁头 (Head)\n\
  在磁带录音中，一种通过磁性影响经过磁带的电磁换能器。录/播放头将音频信号从电能转换为磁能，反之亦然，用于录音。消磁头产生强大的电磁场以消除磁带。\n\n###\
  \ 裕量 (Headroom)\n放大器或设备中正常工作电平与裁剪电平之间的 dB 差。也称为“边缘”。\n\n### 赫兹/伏特 (Hertz/Volt)\n\
  一种系统，输入 1 伏特会导致音高变化固定数量的赫兹。\n\n### 赫兹 (Hertz)\n（缩写 `Hz`）\n1）频率的测量单位，具体指每秒发生的完整波形次数。1\
  \ Hz = 每秒一个完整波。\n2）一种流行的租赁车（通常不用于录音）。\n\n### 踩镲 (Hi-Hat)\n鼓组中位于架上的双镲，通常位于军鼓旁边，可以通过脚踏和击上方镲来演奏。\n\
  \n### 高阻抗 (Hi-Z)\n（缩写 `Hi-Z`）描述为几千欧姆的阻抗。在麦克风中，`Hi-Z` 通常指定为 10000 欧姆以上。（参见“阻抗”。）\n\
  \n### 高电平 (High (gate))\n当门信号处于指示其“开启”（例如按下键盘控制器上的按键）的电压水平（通常为 5 伏特，但也更高）时，称为门高电平。\n\
  \n### 高阻抗 (High Impedance)\n（缩写 `Hi-Z`）描述为几千欧姆的阻抗。在麦克风中，`Hi-Z` 通常指定为 10000 欧姆以上。（参见“阻抗”。）\n\
  \n### 高通滤波器 (High Pass Filter)\n一种衰减低于某些频率（截止频率）的信号并通过高于该频率信号的音频滤波器。\n\n### 高端 (High-End)\n\
  \n\n\n\n# 高频 (Highs or High-End)\n“High frequencies”的缩写，泛指 4000 Hz 以上的频率。通常用于音频信号的“高音、中音和低音”语文中。\n\
  \n## 高通滤波器 (High-Pass Filter)\n高通滤波器（`HPF`）的设计允许高于截止频率或角频率的谐波通过通过，并根据低谐波低于截止频率的程度降低其电平。在\
  \ `12dB/oct`（分贝/八度）高通滤波器中，低于截止频率一个八度（即截止频率的一半）的谐波电平降低 `12 dB`；低于截止频率两个八度（频率的四分之一）的谐波降低\
  \ `24dB`，依此类推。高通滤波器通常用于创建明亮的声音，其中高谐波远强于基频和低谐波——例如大古琴的声音。\n\n## 水平音高 (Horizontal\
  \ Pitch)\n`HP` = `Horizontal Pitch`。在 Eurorack 合成器模块格式中，模块的宽度定义为 `hp`（水平音高）单位的数量。每个\
  \ `hp` 为 `0.2”`（`0.5 cm`）。大多数模块宽度为 `hp` 的偶数，尽管有些是奇数。此外，模块的宽度往往略小于 `0.2”` 的某个整数倍，以确保你不会遇到略微宽的模块重叠的问题。\n\
  \n## 喇叭 (Horn)\n1) 扬声器或扬声器箱，其中声波通过扬声器锥或驱动器发送到一个狭口，该口扩大到更大的开口。\n2) 几种不同类型的铜乐器之一。\n\
  \n## 线路同步 (House Sync)\n一种参考信号，例如 `SMPTE 时间码`，用于保持房间内所有设备的同步。\n\n## HP\n`HP = `Horizontal\
  \ Pitch`。在 Eurorack 合成器模块格式中，模块的宽度被定义为 `hp`（水平音高）单位的数量。每个 `hp` 为 `0.2”`（`0.5 cm`）。大多数模块宽度为\
  \ `hp` 的偶数，尽管有些是奇数。此外，模块的宽度往往略小于 `0.2”` 的某个整数倍，以确保你不会遇到略微宽的模块重叠的问题。\n\n## HPF\n\
  高通滤波器（`HPF`）的设计允许高于截止频率或角频率的谐波通过，并根据低谐波低于截止频率的程度降低其电平。在 `12dB/oct`（分贝/八度）高通滤波器中，低于截止频率一个八度（即截止频率的一半）的谐波电平降低\
  \ `12 dB`；低于截止频率两个八度（频率的四分之一）的谐波降低 `24dB`，依此类推。高通滤波器通常用于创建明亮的声音，其中高谐波远强于基频和低谐波——例如大古琴的声音。\n\
  \n## 交流声 (Hum)\n1) 当电源线电流意外感应或馈入电子设备时会产生的低频音高。交流声反映了电流的基频（美国为 `60 Hz`，许多欧洲国家为 `50\
  \ Hz`）。\n2) 在不开口的情况下用口声唱出某个音高。\n\n## 混合电源 (Hybrid Power Supply)\n混合电源使用重量更轻、效率更高的开关电源来执行大部分的电压降降——例如从\
  \ `120v AC` 降到 `15v DC`——然后使用线性电源处理剩余较小的降压，例如从 `15v` 到 `12v`。这些正成为许多模块化合成器外壳中的首选设计。电源的缺点——噪声太大或功率不足——往往是导致模块化合成器中许多意外问题的根源。\n\
  \n## 超心形 (Hypercardioid)\n心形麦克风拾音灵敏模式的变体，其最佳拾音区域的形状比心形更紧凑、更具方向性。超心形麦克风对正轴前方的声音最敏感，并根据模式的紧凑程度，从轴外\
  \ `90-150 度` 开始开始抑制声音。\n\n## Hz/V\n一种系统，输入端 `1 volt` 的变化会导致音高发生固定数量的 `hertz`（每秒循环），而不是固定的音乐间隔。\n\
  \n## Hz\n`Hertz`（赫兹）术的缩写，频率的单位。\n\n## IADSR\n这是一种攻击/衰减/维持/释放（`ADSR`）包络发生器，允许你从初始电平——“I”——开始攻击阶段，而不是通常的\
  \ `0 volts`。`Prophet VS` 以及 `Ladik` 的模块都具有这种功能。\n\n## IC\n集成电路（Integrated Circuit）——设置在半导体材料上的由许多组件组成的微型电路，用于电子设备。“芯片”或“微芯片”的华丽说法。\n\
  \n## 成像 (Imaging)\n指在声场空间内定位特定声音的能力。在录音环境中，它是将乐器“放置”在立体声或环绕场中，以便当声音通过扬声器播放时，能够欺骗我们的耳朵，认为声源是从特定点发出的，而不是来自扬声器。在现场音频和扩声系统中，成像原理是相同的，目标是让观众感知声音来自舞台上的表演者，而不是扬声器。\n\
  \n## 阻抗 (Impedance)\n指电路或设备对交流电的电阻，可以用数学描述为电压与电流的比值。录音室设备之间的阻抗差异会影响它们的协同工作。阻抗用字母\
  \ `Z` 写，单位是欧姆。\n\n## 线路调音台 (In Line Console)\n一种音频调音台，其设计配置使得每个通道都可以用于多轨录音的监听。这种配置与分路调音台形成对比，后者录音和监听需要独立的通道。\n\
  \n## 同相 (In Phase)\n一种理想情况，两个或多个设备（及其相应信号）的极性相同，产生不会冲突或抵消的波形。\n\n## 端口 (In Port)\n\
  MIDI 设备或计算机上接收输入数据信号接口。\n\n## 电感 (Inductance)\n电导体的一种特性，由于对电流变化的自然阻力，产生或存储电荷（电压）。电感是一种电磁原理，既可以在音频应用中提供帮助（如扬声器），也会引起电阻（如使用规格过小的扬声线）。\n\
  \n## 电感器 (Inductor)\n一种器件（通常是线圈），当电流通过时将电能转换为存储磁能。常见于各种音频应用，如吉他拾音器和扬声器。\n\n## 无限边界\
  \ (Infinite Baffle)\n一种扬声器支架或箱体设计，理论上不允许来自前方的声波到达背面，防止声波相互抵消。“无限”一词源于这样观点：将扬声器安装在没有终点的墙上，声波就无法移动到它后面。当然，这在物理上是不可能的，因此无限边界旨在尽可能模拟这种效果。无限边界的示例包括将扬声器安装在封闭房间的墙上，或者将其构建在足够密封箱体内，以防止背面的声音影响锥振膜。\n\
  \n## 初始/攻击/衰减/维持/释放\n这是一种攻击/衰减/维持/释放（`ADSR`）包络发生器，允许你从初始电平——“I”——开始攻击阶段，而不是通常的 `0\
  \ volts`。\n\n## 输入阻抗\n设备首级电路对电流流的阻碍。\n\n## 输入监听 (Input Monitoring)\n\n\n\n\n许多 DAW（数字音频工作站）中的设置，允许你监控进入\
  \ DAW 的实时输入信号（相对于录制信号）。\n\n### 输入 (Input)\n设备接收信号的插孔或物理位置。也指输入的信号本身。\n\n### 插入 (Insert)\n\
  信号链中的一个接入点（通常在调音台上或虚拟位于 DAW 内部），设备、信号处理器或数字插件可以“插入”到预放大与通道或总线输出之间的电路中。通常用于为通道或通道组添加混响、压缩或均衡器（EQ）等处理。\n\
  \n### 乐器放大 (Instrument Amplifier)\n具有功率放大器和扬声器的设备，用于还原电乐器的输出信号。\n\n### 乐器直出 (Instrument\
  \ Out Direct)\n将电乐器（如电吉他）的输出直接传输录音控制台或录带机，而不是通过麦克风放大器。\n\n### 绝缘体 (Insulator)\n\
  玻璃、空气、塑料等（在所有实际用途中）不导电的物质。\n\n### 集成电路 (Integrated Circuit)\n集成电路（缩写“IC”）——设置在半导体材料上的由许多组件组成的微型电路，用于电子设备。“芯片”或“微芯片”的高级术语。\n\
  \n### 积分器 (Integrator)\n此功能可以平滑输入信号，使电压水平发生变化。“积分器”是该数学函数的学术名称；你更有可能看到此模块被称为斜率限制器（我将在后面详细介绍其用途），或者较少地被称为延迟生成器或处理器。\n\
  \n### 接口 (Interface)\n任何允许一个单元工作、驱动或与另一个单元通信，或允许人类与计算机或其他电子设备交互的设备或连接点。专业音频环境中有很多接口示例，包括\
  \ MIDI（乐器数字接口）；连接音频输入到电脑的音频接口；甚至是你的 DAW 程序，它显示的屏幕允许你分配乐器、调整设置、录音、混音和播放。甚至调音台也是一种接口，连接着控制室的许多元素。\n\
  \n### 互调失真 (Intermodulation (IM) Distortion)\n由两个或多个不同频率的音频信号相互作用引起的失真。频率的和和差会产生新的（通常是不需要的）频率，这些频率在原始频率中并不存在。\n\
  \n### 反平方定律 (Inverse Square Law)\n一种描述一个量与另一个量的平方之间反比关系的数学规则。用通俗的话说，当另一个数字翻倍时，一个数字就会减少一定量。在音频和声学中，反平方定律认为，在没有障碍物的开放声场中，距离声源每增加一倍，声压级就会减半（6dB）。这个公式对于试图在户外环境中提供声音的音频工程师来说非常有用。\n\
  \n### 反相器 (Inverter)\n反相器将输入的控制电压乘以 –1。在门限器或逻辑反相器的情况下，它会反转高低状态，使得（例如）0v 变成 5v，5v\
  \ 变成 0v。这有时被称为极化器，因为它改变了信号的极性（正与负）。控制电压反相器通常与偏移电压结合，以将输出电压调整到所需的范围。例如，如果你有一个输出范围为\
  \ 0 到 +8 伏的包发生器，你对其进行了取反，结果将是 0 到 –8 伏。由于某些模块（如电压控制放大器）通常只接受正电压，你需要对该结果加上 8 伏，以获得一个整体范围仍为\
  \ 0 到 +8v 的倒置（反相）包络。\n\n### 反相混音器 (Inverting Mixer)\n大多数信号混合器都会努力让信号在通过混合器时保持相同的极性。然而，某些混合器可能会反转信号的极性或“相位”（因为这样设计更简单）；其他混合器可能允许你故意反转信号，以便尝试一些技巧，例如将一个波形或滤波器模式输出与来自同一振荡器或滤波器的另一个输出以反相位叠加。\n\
  \n### 隔离 (Isolation)\n将声音限制在特定区域内的过程，使其与其他声音不产生干扰。例如，声学处理过的隔间通常用于在录音室录制人声或乐器，以防止外部噪音泄入录音麦克风，或者同样在现场录音期间防止人声或其他声音干扰到乐器麦克风。\n\
  \n### IV 线缆 (IV Cable)\n你通常需要将一个信号发送到多个目的地。实现此目的的方法包括使用专用分路器、多个插孔连接在一起的浮动组件，或者允许你向其插入一或两根额外电缆的花哨电缆。IV\
  \ 线缆属于后者：由 Erthenvar 制造，在电缆中间模制了一个额外的 3.5mm 插孔（形状类似于静脉滴注“IV”），两端还有 3.5mm 插头。\n\n\
  ***\n\n### 插孔 (Jack)\n你在合成器模块正面插入跳线线的那个洞？它被称为插孔（Jack）。插孔的大小和类型——3.5mm、香蕉头或 1/4 英寸——通常是不同合成器模块格式的定义特征之一：分别为\
  \ 3U/Eurorack、4U 和 5U/MU。（不，插头不叫 Jill。实际上，反相反：插头有时被称为公性连接器，而插孔被称为母性连接器。）\n\n###\
  \ 节拍同步 (Jam Sync)\n某些时钟或同步设备上可用的一种功能，它可以读取外部时间码并重建（或“挤入”）一个与原始外部代码相同的新时间码，用于设备同步。此功能主要用于替换已经退化的代码。\n\
  \n***\n\n### Karplus-Strong 算法 (Karplus Strong)\n这是一种物理合成算法，旨在模拟拨动、振动弦的声音——尽管它也被证明对某些打击乐器很有用。一个短样本（最初是噪声，也可以是高频啾叫声或其他声音）被发送到输出端和延迟线。延迟线的输出连接到滤波器（最初是单极性低通滤波器；改变滤波器对声音的特性有巨大影响）——并连接回主输出和延迟线的输入。少数模块实现了\
  \ Karplus 合成，尽管自己进行跳线连接并尝试其结果是一个有趣的挑战。\n\n### 键值/调性 (Key)\n1. 在音乐中，编写或演奏音乐作品的音阶，通过音阶的第一个音（主音）确定，例如“C\
  \ 大调”。\n2. 通过侧链使用外部音频信号对动力学处理设备进行控制。\n3. 用于解锁设备或软件使用的数字或数据代码。例如：Pro Tools 通过物理 USB\
  \ 密钥 iLok ID 进行授权。\n\n### 键盘控制器 (Keyboard Controller)\n一种钢琴形状的键盘，通过发送 MIDI 信号来控制其他设备。大多数键盘乐器都配备\
  \ MIDI 控制功能，但专用的 MIDI 键盘控制器不产生音频信号，只产生 MIDI 数据。\n\n### 键盘跟踪 (Keyboard Tracking)\n\
  大多数模块合成器在电压和音高之间遵循严格的关系，例如每八度 1 伏特；任何偏差都会导致调音错误。由于这种敏感性，1v/oct 和类似的信号和连接有时被专门区分为键盘跟踪，而不是简单的“CV”（控制电压），以明确它们在控制模块功能时不会被衰减或进行修改。\n\
  \n### 键盘 (Keyboard)\n任何通过按下按键控制的乐器或电脑。\n\n### 吉他键盘 (Keytar)\n轻便、便携的键盘，旨在让键盘手获得与吉他手一样的自由（更不用说摆拍的机会）。\n\
  \n### 底鼓 (Kick Drum)\n\n\n\n\n架子鼓组中的底鼓，之所以得名是因为它是通过踏板演奏的。\n\n## 千赫兹 (kHz)\n\n`kHz`\
  \ – 千赫的缩写（`1000 Hz`，或每秒 `1000` 次）。例如：`2000 Hz = 2 kHz`。在录音室中最常用于描述音频频率范围或数字采样率。\n\
  \n## 节点 (Knee)\n\n压缩器上的一个功能，决定了声音电平超过阈值后，压缩开始的剧烈或缓慢。之所以这样命名是因为响应曲线上的图形“弯曲”处让人想起膝盖。“硬膝”（Hard\
  \ knee）指的是压缩器的突然启动，而“软膝”（soft knee）则指更平缓的变化。\n\n## Krell 音色 (Krell Patch)\n\n重建这个音色是许多模块化音乐人想要尝试的挑战。它基于\
  \ 1959 年的电影《幻行星》，其中一段据称他们演奏了古老 Krell 种族的音乐。简单来说，每个音符都有随机的音高、包络和时长。\n\n## 延迟生成器 (Lag\
  \ Generator)\n\n该功能可以平滑输入信号，使得电压电平的变化每秒不能超过特定的电压数。这导致结果“滞后”输入的变化。它有时被称为斜率限制器（slew\
  \ limiter）或在技术上称为积分器（integrator）。\n\n## 叠层 (Layering)\n\n指几乎任何多个相似音乐部分或声音的同步混合，通常组合在一个通道上或分配给一个控制器。在音频录制中，叠层通常涉及录制同一乐器或人声的相似采样（或带有轻微延迟或合唱效果的部分），以创造比人声/乐器本身更丰满、丰富的声音。在声音设计中，它也指混合多个采样（例如：两个或多个鼓声）以创建更丰满的声音。\n\
  \n## 领奏谱 (Lead Sheet)\n\n一种音乐记法的简写形式（类似于和弦图），显示歌曲的基本本质元素，让音乐人能够跟随，而不需要每个音符或表情的完整记法。领奏谱最常见的是用记谱写的旋律线，谱上方是和弦变化，下方是歌词。（参见“和弦图”。）\n\
  \n## 串音 (Leakage)\n\n来自其他乐器和声源的声音，这些声音并不是想要被麦克风拾取的。\n\n## 电平 (Level)\n\n信号强度程度；振幅，特别是平均振幅。\n\
  \n## LFO (低频振荡器)\n\n该模块产生循环的波形，频率范围从音频的低端到每周期几秒甚至几分钟不等。它们被用于产生各种效果，如颤音（控制信号音量时）、揉音（控制信号音高时）、重复的滤波器\
  \ wah-wah 效果、改变振荡器中脉冲波形的脉冲宽度调制等。\n\n## 限制器 (Limiter)\n\n一种压缩器类型，当音频电平达到特定阈值时会剧烈减少（限制）信号的增益，通常用于防止过载和信号峰值。当压缩器的压缩比为\
  \ `10:1` 或更高时，压缩器实际上变成了限制器。（参见“压缩器”。）\n\n## 线路输入 (Line Input)\n\n`Line Input` (`Line\
  \ In`) – 设计用于接收线路电平信号的输入。\n\n## 线路电平 (Line Level)\n\n大多数消费级和低成本专业音频设备使用被称为线路电平或\
  \ `-10dBV`（分贝伏）的信号参考参考。常用的连接器是 `RCA`（藕圈）或 `3.5mm`，尽管也使用 `1/4 英寸`；信号是“平衡”的（使用两根线：信号和地）。在线路电平标准中，在\
  \ `+/–0.447 volts` 之间变化的正波被认为是 `-10dBV`。相比之下，模块化合成器的典型振荡器信号是 `+/–5` 到 `+/–8 volts`。因此，你需要在模块化合成器中使用一个输出模块，或者在调音台或录音机上使用一个强大的输入衰减器，以便将合成器连接到运行线路电平的设备上。同样，你需要大幅提升线路电平信号以达到模块化标准，以便在模块化合成器中进行处理。\n\
  \n## 线路输出 (Line Output)\n\n`Line Output` (`Line Out`) – 任何发送线路电平信号的输出，例如向录音机传输的调音台输出。\n\
  \n## 线性 FM (Linear FM)\n\n这通常是频率调制（FM）振荡器的首选输入响应，因为当你改变调制器时，结果会保持调谐。线性电源设计采用较高的输入电压并使用变压器等元件将其降低到较低电压。泛泛之，它们往往向输出功率信号中引入更少的噪声，代价是增加热量重量（效率不高）。许多人正在转向混合电源，将开关电源与小型线性电源或调节器相结合，以获得两者的优点。\n\
  \n## 线性 VCA (Linear VCA)\n\n线性电压控制放大器 (`VCA`）使用控制电压输入与信号电平输出之间的简单数学关系——例如，`50%`\
  \ 的额控制电压会导致输出信号处于输入信号电平的 `50%`。然而，这并不是我们耳朵感知响量的方式；声音必须放大 `10 倍` 才能被感知为大一倍。这使得线性\
  \ VCA 在缩放控制电压方面很有吸引力，但对于缩放音频信号可能如此。如果你将一个具有指数输出的包络生成器连接到线性 VCA，你将获得所需的听觉结果。很困？这就是为什么当包络生成器或\
  \ VCA 有一个开关或控制可以在线性和指数响应之间切换时就太棒了。线性混音器类似于线性 VCA：输入电平控制上的“一半”等于输出电压摆幅为输入的一半。同样，这对于改变控制电压很好，但对于混合音频信号则不然。\n\
  \n## 线性 VCO (Linear VCO)\n\n线性电压控制振荡器 (`VCO`) 遵循 `电压/赫兹` (`v/Hz`) 标准；更常见的是指数 `电压/八度`\
  \ (`v/oct`) 标准。例外是频率调制 (`FM`)，那里通常采用线性控制输入来复现经典的 FM。\n\n## 现场录制 (Live Recording)\n\
  \n所有音乐人同时演奏且没有后期叠加的录音课程。\n\n## 现场室 (Live Room)\n\n录音室的大房间，大多数乐器和人声在此表演。之所以这样命名，不仅是因为有现场表演的空间，还因为房间经过了声学处理，以产生悦人的现场混响。\n\
  \n## 现场 (Live)\n\n1. 描述具有混响或反射空间的术语。在现场空间内，声波是活跃的或“现场的”。\n2. 实时发生的，相对于录制的。\n\n##\
  \ 本地开启/关闭 (Local On/Off)\n\n`Local On/Off` – 一种控制合成器或 MIDI 控制器内部模块的 MIDI 消息。“Local\
  \ On”在按下键盘时触发内部模块；“Local Off”则断开连接。“Local Off”经常用于防止某些配置中 MIDI 消息循环，或通过另一个控制器控制内部模块。\n\
  \n## 逻辑功能 (Logic Functions)\n\n在模块化合成器中，控制电压往往是连续的，而门信号和触发信号是二元的：开启或关闭；高或低。这与数字电路中的逻辑信号相同。因此，有些人会制作数字逻辑模块。一种常见的逻辑功能是“或”（OR）：如果信号\
  \ A 或信号 B 任何一个高（开启），则输出高门信号（开启）；否则输出低门信号（关闭）。另一个是“与”（AND）：仅当信号 A 和信号 B 都高时，才输出高门信号（开启）；否则输出低门信号（关闭）。这些功能对于结合来自不同计时源的节奏触发信号非常棒。\n\
  \n\n\n\n\n二进制逻辑或布尔逻辑是一种组合门控信号（开启或关闭电压）以创建新输出的方法。逻辑模块的每个部分通常包含 1 到 3 个输入，其中 2 个最为常见。`OR`（或）函数表示如果任何一个输入端有门开启（或“高电平”）信号（例如输入\
  \ 1 或输入 2 或输入 3 等），则输出门开启信号。`AND`（与）函数表示只有当所有输入端检测到“高电平”门信号时（即输入 1 和输入 2 等都处于门开启状态），才输出门开启信号。在函数名称前加上“N”表示“非”该函数——换句话说，`NOR`（非或）函数只有在所有输入均为低电平时（输入\
  \ 1 和输入 2 都不高）才会输出高电信号。\n\n# Loop (循环)\n\n1) 从效果而言，是指任何不断重复的音乐或数据。在数字音频和采样出现之前，循环是通过循环磁带创建的。今天，循环被用于采样中，以使采样音符在触发期间保持持续，而鼓点循环和其他音乐循环在现代音乐制作中非常常见。\n\
  \n2) 波节（antinode）的另一种术语，指振动的伸弦或声波中位移最大的点。（参见“驻波波”。）\n\n# Looping (循环过程)\n\n有时让模块循环或重复其功能是有用的。例如，一个可以设置为循环的包络发生器变成了一个低频振荡器：当它攻击到最大值并衰减回零时，它会重新开始该攻击阶段。我们通常希望音符序列器循环：当它到达序列中的最后一个音符时，如果它能回溯或返回第一个音符并重新开始，将非常有用。具有循环功能的音频录机在现场表演中流行。\n\
  \n# Loudness (响度)\n\n一个指人耳感知传入声波方式的术语。这个词似乎自而易懂，但它具有误骗性。我们通常将响度与声音的大小联系起来，但这是一种间接关系。在声学术语中，音（volume）更多是指声波的振幅，而响度描述的是我们的耳朵如何听到这些波的强度。\n\
  \n# Low (gate) (低电平 (门控))\n\n通常，这是简写，表示门控或触发信号处于“关闭”状态（通常为 0 或 –5 伏，与 +5 伏的“高”或“开启”信号形成对比）。\n\
  \n# Low Frequency Oscillator (低频振荡器)\n\n该模块产生重复的、循环的波形，频率范围从音频的低端到每周期几秒甚至几分钟不等。它们被用于产生各种效果，如颤音（当控制信号的响度时）、揉音（当控制信号的音高时）、重复的滤波器哇哇效果、改变振荡器中脉冲波形的脉冲宽度调制等。\n\
  \n# Low Impedance (低阻抗)\n\n（缩写为 `Lo-Z`）描述为 500 欧姆或以下的阻抗。（参见“阻抗”。）\n\n# Low Pass\
  \ Filter (低通滤波器)\n\n低通滤波器（`LPF`）的设计通过通过截止或角频率以下的谐波保持不变，并根据谐波高于截止频率的远程度降低较低谐波的水平。在\
  \ `12dB/oct`（分贝/八度）低通滤波器中，高于截止频率一个八度（换句话说，截止频率翻倍）的谐波水平降低 `12 dB`；高于截止两个八度（频率四倍）的谐波降低\
  \ `24dB`，依此类推。这是最常用的滤波器类型，因为大多数自然声音具有较强的低谐波和较弱的高谐波——尤其是当音符淡减至寂时。\n\n# Low Pass Gate\
  \ (低通门)\n\n根据严格定义，低通门（`LPG`）是一种低通滤波器，其截止频率随着控制电压趋向于 0 伏而下降到亚声波范围内，导致输入信号几乎被过滤为静音。有些设备通过将低通滤波器和电压控制放大器在同一个模块中来实现这一点，两者都遵循相同的控制电压。在哪种情况下，当输入包络从高电平下降到\
  \ 0 伏时，输出变得暗淡（高谐波被过滤得更多），直到变为寂。这模仿了许多自然声音的工作方式。\n\n# Low-Frequency Oscillator (LFO)\
  \ (低频振荡器)\n\n一种发射低于人耳听力范围范围（20 Hz 或以下）的低频电子波形的电路。这种低频波形产生一种节奏脉冲，用于调制音频信号中的各种参数，如音高或音量。`LFOs`\
  \ 经常用于采样器、合成器和信号处理器，以产生如揉音、颤音和相位等效果。\n\n# low-pass-filter (低通滤波器)\n\n一种音频滤波器或设备，衰减某些频率（截止频率）以上的信号，并通过低于截止频率的信号。\n\
  \n# Lows or Low-End (低频或低端)\n\n“low frequencies”的缩写，泛泛指 250 Hz 以下的低频信号。通常用于音频信号的“高、中、低”语境中。\n\
  \n# LPF (低通滤波器)\n\n低通滤波器（`LPF`）的设计通过通过截止或角频率以下的谐波保持不变，并根据谐波高于截止频率的远程度降低较低谐波的水平。在\
  \ `12dB/oct`（分贝/八度）低通滤波器中，高于截止频率一个八度（换句话说，截止频率翻倍）的谐波水平降低 `12 dB`；高于截止两个八度（频率四倍）的谐波降低\
  \ `24dB`，依此类推。这是最常用的滤波器类型，因为大多数自然声音具有较强的低谐波和较弱的高谐波——尤其是当音符淡减至寂时。\n\n# LPG (低通门)\n\
  \n根据严格定义，低通门（`LPG`）是一种低通滤波器，其截止频率随着控制电压趋向于 0 伏而下降到亚声波范围内，导致输入信号几乎被过滤为静音。有些设备通过将低通滤波器和电压控制放大器在同一个模块中来实现这一点，两者都遵循相同的控制电压。在哪种情况下，当输入包络从高电平下降到\
  \ 0 伏时，输出变得暗淡（高谐波被过滤得更多），直到变为寂。这模仿了许多自然声音的工作方式。\n\n***\n\n# M2.5\n\n用于安装 Eurrack\
  \ 模块的常用螺纹规格。最常见于使用在模块的轨道上滑动的螺母系统。\n\n# M3\n\n用于安装 Eurrack 模块的常用螺纹规格。最常见于使用已钻孔的模块安装轨道。\n\
  \n# Magnetic Tape (磁带)\n\n由涂有磁性材料（细磨的氧化铁颗粒）的塑料带组成的录带。常用于模拟录音。\n\n# Magnetism (磁性)\n\
  \n铁基材料对其他铁基材料的自然吸引力。\n\n# MArF\n\n稀有的 `248 MArF`（多任意函数发生器）是序列器和包络发生器（两者在词表中其他地方描述）的交叉，因为它通常包含\
  \ 16 或 32 个阶段（有时称为“段”），以及用于在这些阶段之间插值的速率控制。这意味着可以创建非常复杂的包络形状和其他电压序列。后来，Buchla 使用\
  \ `MARF` 术语描述 `400` 系列仪器中的多步包络。\n\n# Margin (余)参见“Headroom”。\n\n# Masking (掩蔽)\n\
  \n一种听觉特性，大声音使耳朵听不到相似频率的小声音。也指大声掩盖小声。\n\n# Master (主)\n\n1) 控制台或 DAW 的主输出控制，设置混合信号离开控制台时的电平。（也称为\
  \ `master fader`）。\n\n2) 用于制作复制的最终混合原始录音。\n\n# Mastering (母带处理)\n\n对歌曲或歌曲集的混音进行微调和“美化”的最终过程，并此创建母带。\n\
  \n# Measure (小节)\n\n音乐中节拍的分组。（参见“Bar”。）\n\nMeg\n\n\n\n\n\n基于前缀 `Mega-` 的俚语缩写，意为\
  \ 1,000,000。常作为兆赫（1,000,000 Hertz，`Mhz`）或兆字节（1,000,000 字节，`MB`）的简写。\n\n### 电表 (Meter)\n\
  1) 一种用于测量和显示音频或数字设备信号电的设备。电表通常测量峰值或均方根值（RMS）（参见“峰值”、“RMS 值”）。\n2) 音乐的节奏结构，通常描述小节中的拍子数。\n\
  \n### 麦克/线路开关 (Mic / Line Switch)\n`Mic`, `Mike` – “microphone”的缩写。\n\n### 麦克风 (Mic)\
  \ 输入\n调音台或其他设备指定的麦克风信号输入。\n\n### 麦克风 (Mic) 电平\n录室麦克风发出的极低音频电压电平。信号在进入调音台之前必须通过 `preamplifier`（前放大器）增加到线路电平。（参见“线路电平”、“前放大器”）。\n\
  \n### 麦克风 (Mic) \n麦克风或前放大器上的设置，或独立的适配器/连接器，用于在麦克风信号进入前放大器之前降低其电平以防止过载。\n\n### 麦克风\
  \ (Microphone)\n一种将声波转换为电信号的换能器。\n\n### 中侧拾音法 (Mid-Side Miking)\n(缩写 `M/S`) 一种同相麦克风放置技术，其中一个心形指向麦克风指向声源，另一个双指向麦克风侧放并尽可能靠近第一个麦克风。\n\
  \n### MIDI 时钟 (MIDI Clock)\n由 `MIDI` 传输的时钟信号，用于连接的序列器和音乐设备之间保持同步。不要与 MIDI 时间码 (`MTC`)\
  \ 混淆，MIDI 时钟与每分钟拍数 (`BPM`) 速度绑定，每个四分音前进 24 步。\n\n### MIDI 控制器 (MIDI Controller)\n\
  根据上下文，可以指 `MIDI` 的两种不同元素：\n1) 通过预编程序列或音乐家的现场表演，向连接设备发送 `MIDI` 数据的设备或软件。\n2) `MIDI`\
  \ 设备上的多个较小控制中的任何一个，用于控制声音或性能的特定参数。\n\n### MIDI 接口 (MIDI Interface)\n一种将 `MIDI` 信号转换为计算机数字格式的设备，以便存储和使用\
  \ `MIDI` 信号。\n\n### 蓝牙 MIDI (MIDI over Bluetooth)\n蓝牙低功耗 (`BLE`) 是大多数计算设备支持的无线连接规范。`BLE`（也称为蓝牙\
  \ SMART）可以为使用非持续传输数据的连接配件（如 `MIDI` 键盘和控制器）的移动设备延长电池使用寿命。\n\n一个 MMA 工作组评估了蓝牙 `LE\
  \ MIDI` 的性能（延迟和抖动），并决定了蓝牙 MIDI 的规范，以使不同制造商的产品能够相互操作。蓝牙低功耗 MIDI (`BLE-MIDI`) 规范基于\
  \ Apple 在 `iOS8` 和 `OSX 10.10` 中出现的实现，以确保早期采用者的产品仍能与行业标准兼容。\n\n### MIDI 采样转储标准 (MIDI\
  \ Sample Dump Standard, SDS)\n添加到 `MIDI` 中的子协议，用于在乐器、存储单元或声音模块之间传输数字录制的样本，而无需将其转换为模拟信号。\n\
  \n### MIDI 序列器 (MIDI Sequencer)\n一种可以录制和播放 `MIDI` 数据的设备或软件，通过一系列定时步骤控制 `MIDI` 音乐乐器或设备的性能。`MIDI`\
  \ 序列器存在于 `MIDI` 控制器、键盘或工作站内部、作为独立设备或计算机软件存在。\n\n### MIDI 转发盒 (MIDI Thru Box)\n具有一个\
  \ `MIDI In Port` 和多个 `MIDI Thru Ports` 的单元，用于将 `MIDI` 信号中继到多个设备。`MIDI` 用户通常偏于此作为设备“串联”的替代方案，因为后者会导致\
  \ `MIDI` 信号产生轻微延迟。\n\n### MIDI 转发 (MIDI Thru)\n输出与输入 `MIDI` 信号相同的 `MIDI` 信号端口，在不修改或更改信号的情况下将信号中继到另一个设备。（许多\
  \ `MIDI` 设备具有三个 `MIDI` 端口：`In`、`Out` 和 `Thru`。）\n\n### MIDI 时间码 (MIDI Time Code,\
  \ MTC)\n将 SMPTE 时间码中的信息翻译为 `MIDI` 数据，使 `MIDI` 序列器和连接设备与 SMPTE （通常与视频相关）同步。（参见“SMPTE\
  \ 时间码”）。\n\n### MIDI\nMusical Instrument Digital Interface（乐器数字接口）的缩写。`MIDI` 是连接合成器与其他合成器以及合成器与计算机的常用语言。虽然它是一种数字语言，但很容易买到\
  \ `MIDI` 转 `CV/Gate`（控制电压和门）的转换模块，它可以处理用于驱动序列器等的音符事件和 `MIDI` 时钟。最需要注意的是需要何种类型的连接器：传统的\
  \ 5 针 DIN 口，还是 USB 计算机风格连接。\n\n### 中频 (Mids)\n“mid-range frequencies”（中频范围）的缩写，指从\
  \ 250 Hz 到 6000 Hz 的音频频率。用于音频信号的“高、中、低频”语文中。\n\n### 迷你键 (Mini Keys)\n一些键盘控制器甚至键盘合成器使用的键尺寸比典型的钢琴键小得多。Mini\
  \ keys 是指代这种硬件选择的常用术语（有时带有贬义，尽管空间和成本的节省可能非常显著）。\n\n### 混缩 (Mix Down)\n`Mixdown`\
  \ 或 `Mix Down` – 在母带阶段之前，通过将多个音频轨道合并为单个轨道（或双声道立体轨道）来创建最终混音的过程。这包括将模拟磁带的多个通道混入双轨主带的传统方法。\n\
  \n### 混音 (Mix)\n1) 将音频信号合并为复合信号的过程。\n2) 也可以指将处理过的音频信号混回直接信号。\n\n### 混音器 (Mixer)\n\
  该模块合并信号。你可能使用 `mixer` 合并音频信号（在这种情况下你可能需要指数电平控制），或者合并控制电压（在这种情况下你可能需要对通过的电压进行反转和偏移）。\n\
  \n### 模块化 (Modular)\n模块化合成器将合成器的主要组件——产生声音的振荡器、修改声音的滤波器、VCA 以及创建包络、颤音等的调制源——分解可以购买和安装的独立模块。在最基础的层，这允许通过组合来构建你自己的自定义合成器。\n\
  \n### 调制噪声 (Modulation Noise)\n仅在音频信号存在时存在的噪声。\n\n### 调制 (Modulation)\n当你使用电压控制改变合成器模块的参数时，被称为你正在调制该参数。例如，当低频振荡器\
  \ (`LFO`) 改变滤波器的截止频率以产生哇哇音效果时，被称为 `LFO` 正在调制。当包络发生器导致电压控制放大器 (`VCA`) 打开允许声音突然变大，然后淡出消失时，你也可以说包络正在调制放大（尽管有些人喜欢将“调制”限制为重复动作）。因此，我们将这些变化的源称为调制器。\n\
  \n### 调制器 (Modulator)\n我们在上面的定义中触及了调制和调制器的般主题。然而，经常当有人使用调制器一词时，他们通常在讨论一种合成技术，其中一个通常是音频信号“调制”（改变）另一个音频信号。例如，在频率调制\
  \ (`FM`) 合成中，调制器（调制振荡器）改变主信号发生器（振荡器）的频率（音高），后者称为载波。在环形、平衡或幅度调制中，调制器改变载波信号的亮度。因此，调制器这一术语让你在这些连接中中清楚你讨论的是哪一个组件：不是主要的音发生器，而是那个让发生器疯狂的模块。*\n\
  \n\n\n\n\n# 模块 (Module)\n一个自包含的电路和控制组。在录音室中，模块通常包含在可更换的外壳中，以便安装在机架上，并包括放大器、均衡器、效果处理器和声音模块（由外部控制器激活的\
  \ MIDI 乐器）。在数字空间中，插件、软件合成器、采样器和插件也被描述为模块。\n\n# 单声道 (Monaural)\n（缩写为“Mono”）描述通过单通道传输的音频信号，与之相对的是双通道的双声道。（参见“单音\
  \ Monophonic”。）\n\n# 监听混音 (Monitor Mix)\n传输给音乐人的现场和/或录音音频信号混合，以便他们在表演时（无论是在舞台上还是录音室内）听到音乐。监听混音与主混音信号路径分离（通常由独立的较小调音台控制），且不会影响\
  \ FOH 混音（现场音频）或进入多轨道录音机/DAW 的信号。在现场表演环境中，监听混音通常由运行另一台调音台的独立音响工程师控制。\n\n# 监听调音器部分\
  \ (Monitor Mixer Section)\n监听部分/监听调音器部分 – 调音台上用于创建粗略混音的部分，以便工程师听到正在录制的内容，而不影响馈送到多轨道录音机或\
  \ DAW 的电平水平。\n\n# 监听路径 (Monitor Path)\n与通道路径分离的信号路径，允许工程师听到正在录制的内容，而不影响馈送到多轨道录音机或\
  \ DAW 的信号。（参见“通道路径 Channel Path”。）\n\n# 监听 (Monitor)\n1) 为了检查质量或避免峰值而收听音乐。\n2) 录音室中的扬声器（通常是一对中的一个），用于监听音频信号。这包括控制室里用于听混音的监听扬声器，以及隔间或现场的耳机，供表演者在表演时听到音轨混音。\n\
  \n# 单音 (Monophonic)\n（缩写为“Mono”）\n1) 单声源或单通道传输（与双声道相对）。\n2) 一次只弹一个音的旋律线。\n3) 描述乐器或合成器设置一次只播放一个音高（或“声部”\
  \ Voice）。参见“声部 Voice”。）\n\n# 变形 (Morphing)\n在模块化合成器的语境下，变形指的是振荡器可以随着你的演奏多或平滑地改变其输出波形的形状——从而改变声音。这通常是数字振荡器的领域，它们在内部从一种波形交叉淡入到另一种（或者在某些情况下是切换），尽管有时也应用于模拟振荡器，后者可以让你对波形进行实时控制。\n\
  \n# Mother-32\nMoog 出出的非常流行的半模块化合成器。它有自己的外壳，也可以安装在 Eurorack 格式的机箱中。它带有一个 `VCO`（锯波和脉冲波）、一个\
  \ `LFO`（三角波和方波）、一个 Moog 风格的晶体阶梯滤波器（可低通或高通）以及一个 `AD` 或 `AR` 包络发生器。它还有一个非常强大的步进序列器和一个微型单八度键盘。使其成为半模块化的是一个漂亮的跳线面板，允许对合成器声部的内部布线进行替代路由，并允许将其连接到外部模块。由于这类产品销售得非常好，因此在讨论如何扩展基础模块化系统时，我将其作为典型半模块化或“入门级”合成器声部的代表。我今年春天将推出关于\
  \ `Mother-32` 的在线入门课程，并将有一个关于在这个入门系统中添加不同模块的课程以及持续每周节目。\n\n# 动圈麦克风 (Moving Coil\
  \ Microphone)\n一种通过磁场中移动感应线将声波转换为电音频信号的麦克风——这一过程通常被比作反向扬声器。动态麦克风不如电容麦克风灵敏，但在用于拾取较大的声源或近距离采集应用中非常有效。\n\
  \n# 移动推子自动化 (Moving Fader Automation)\n某些调音台中的一项功能，可以预先编程推子变化，在多轨道录制回放期间自动发生。\n\n\
  # MU\n指高度为 `5U`（机架单元）或 `8.75 英寸`（22.2 厘米）的模块，这通常与经典的 Moog 标准以及追随其脚步的人有关，包括 Synthesizers.com\
  \ (Dotcom) 和 Moon Modular。你有时会听到这与代表 Moog 的 `MU` 词互换使用，后者也指每个 `MU` 宽 `2.125 英寸`（5.4\
  \ 厘米）的标准。鉴于于标准既具有历史意义，物理尺寸又很大，某些用户将“5U”作为他们传统且酷的荣誉勋章。（而且他们确实如此）。此前还有过短暂流行的来自 `MOTM`\
  \ 的 `5U` 格式，使用不同的宽度和电源连接。该格式已停产，但今天仍有忠诚的 `MOTM` 格式用户。\n\n# 多点延迟 (Multi-Tap Delay)\n\
  延迟的本质上是将音频放入管子的一端，并在它从另一端出来时再次抓取。多点延迟则说：“为什么要等音频快照完全穿过整个管子呢？让我们在它只通过一半管子时就抓取。”这些被提前抓取的点被称为“采样点\
  \ (taps)”——就像在长管子上添加的额外水龙头。\n\n# 万用表 (Multimeter)\n一种测试电电压、电流和电阻的小型设备。万用表在录音室中用于校准电气系统和排除故障。\n\
  \n# 多任意函数发生器 (Multiple Arbitrary Function Generator)\n罕见的 `Buchla Model 248 MArF`（多任意函数发生器）是序列器和包络发生器（另有描述）的混合体，通常包含\
  \ 16 或 32 个阶段（有时称为段），以及用于在这些阶段之间进行插值的速率控制。这意味着可以创建复杂的包络形状和其他控制电压。之后，Buchla 使用 `MARF`\
  \ 术语来描述 `400` 等仪器中的多步包络。\n\n# 多路分配 (Multiple)\n经常你需要分割或复制信号以发送到多个目的地。这通常通过多路分配器（简称\
  \ `mult`）完成，你插入一个源，然后插入额外的跳线线到多个目的地。\n\n# 多路用器 (Multiplexer)\n复用是一种用于描述信号路由的技术方法，其中多个信号可以被路由到一个目的地。在合成器模块中，这通常扩展到一个输入在多个输出之间切换的可能性。顺序开关是一种复用器，因为它在多个输入之间进行选择以决定发送哪一个输出。有些模块在音频速率执行此操作，使用振荡器的输出在另一种波形的变体之间切换，以创建这些波形的复杂混合。\n\
  \n# 多音色 (Multitimbral)\n指合成器或模块同时播放几种不同声音、补丁或“音色”的能力。\n\n# 多轨道录制 (Multitrack Recording)\n\
  也称为轨道录制或多轨道录制）录音室的心脏，是将多个声源录制到单独轨道上，每个轨道都有自己的音频通道，然后将这些轨道同时回放。录制可以一次录制一个轨道或乐器（以后合并），也可以在表演者现场演奏时将他们录制到单独轨道上。这些信号最初录在多轨道磁带上，但现在也可以作为独立的音频文件数字录制到数字音频工作站\
  \ (DAW) 中。\n\n# 多轨道磁带 (Multitrack Tape)\n用于同步存储两个或多个离散信号的磁带/卷。\n\n# 音乐乐器数字接口 (MIDI)\n\
  \n\n\n\n\n乐器数字接口（Musical Instrument Digital Interface）的缩写。`MIDI` 是一种连接合成器与合成器、合成器与计算机的常用语言。尽管它是数字语言，但很容易买到一个\
  \ `MIDI` 转 CV/Gate（控制电压和门信号）转换器模块，它可以同时处理音符事件和用于驱动序列器等的 `MIDI` 时钟。最需要注意的是所需的连接器类型：是传统的\
  \ 5 针 `DIN`，还是电脑式的 `USB` 连接。\n\n## 静音开关 (Mute Switch)\n调音台或其他音频设备上的开关，用于关闭输入或输出，也可以是\
  \ `DAW` 虚拟音频控制空间中相应的按钮。调音台上的每个通道都有一个静音开关，可以切断该通道的信号。\n\n## 静音 (Mute)\n有时你需要静音或断开信号。允许你执行此操作的电路被称为静音（mute）。\n\
  \n## 每米纳韦 (NW/m)\n测量模拟磁带磁场强度的标准单位。`韦`（Weber）是磁场强度的单位，但对于磁带机中的磁性来说，这个单位太大了，因此使用 `纳韦`（nanowebers）。每米纳韦有效地描述了录制到磁带上的信号强度。\n\
  \n## 窄带噪声 (Narrowband Noise)\n发生在有限频率范围内的噪声（随机能量）。\n\n## 近场 (Near Field)\n距离声源 1-5\
  \ 英尺范围内的区域。录音室监音器通常被认为是“近场”扬声器，因为它们的设计初衷是近距离聆听。（参见“远场”。）\n\n## 近共直拾风 (Near-Coincident\
  \ Miking)\n一种双声道拾风技术，将两个麦克风以向外的角度彼此靠近，以创建声像（与麦克风彼此指向的“共直拾风”相反）。近共直拾风的常见版本包括 `DIN`\
  \ 声（90 度角，间距 20cm）、`NOS` 声（90 度角，间距 30cm）和 `ORTF`（110 度角，间距 17cm）。\n\n## 负反馈 (Negative\
  \ Feedback)\n输出信号的一部分被反馈回放大器的输入端，其相位与原始输出信号相反。这会对输出产生抑制作用，有效地抵消一部分音量。\n\n## 噪底 (Noise\
  \ Floor)\n音频信号下方存在的噪声水平，以 `dB` 测量。每个电子设备即使在没有音频传输时，也会发出最低水平的噪声；这被称为其噪底。通常情况下，这些设备的噪底越低，设备质量越高。噪底也会反映到录制的信号中；录音的噪底是所有连接设备产生的噪声之和。目标始终是让噪底尽可能低。\n\
  \n## 噪声门 (Noise Gate)\n一种门限电路，用于在信号不存在时自动关闭音频通道，以减少可听的噪声。\n\n## 降噪 (Noise Reduction)\n\
  从信号、设备或系统去除消除噪声的多种过程之一。\n\n## 噪声 (Noise)\n描述音频信号中存在的任何不悦的、反感或非预期的频率。所有电子设备都会产生某种类型的噪声，可以描述为安静或无声段落中听到的嘶嘶声或嗡嗡声。（参见“噪底”。）连接不良、接地不当、无线电干扰和其他问题也可能导致信号引入噪声。工程师也可能为了测试目的故意通过音响系统运行噪声信号。（参见“白噪声”、“粉噪声”。）\n\
  \n## 非破坏性编辑 (Non-destructive Editing)\n录音系统中的一种功能（最常见于数字音频工作站 `DAWs`），在执行编辑时原始信号或内容保持完整，允许工程师随时恢复原始版本。（有时也称为“非线性编辑”。）\n\
  \n## 无向性 (Nondirectional)\n在麦克风中指从所有方向均匀采集信号。\n\n## 标准化 (Normalize)\n对音频应用固定量的增益，使最高峰值设置为最高可接受的录音水平。\n\
  \n## 直连 (Normalled)\n模块化合成器的强大在于你可以跳接信号使其按照你喜欢的方式流经系统。当你只想尝试连接一个“典型”的信号流时，这可能是一个非常耗时的麻烦。因此，一些制造商创建了“半模块化”合成器，它们为你预连了所有这些典型连接，其重要特性是许多此类布线可以通过向正确的插孔插入跳线线来覆盖。这些预连连接通常被称为直连（normalled）。例如：内部噪声源通常会连接到调音台上滤波器之前的一个通道，但如果你向通常标记为\
  \ `external input`（外部输入）的插孔插入跳线，这种“直连”连接就会断开并被你的外部连接取代。\n\n## 陷波滤波器 (Notch Filter)\n\
  这是一种特殊的滤波器模式，移除拐角或截止频率设置附近的音频频率或谐波，但并不是从整个频谱中“切除”。它是带通滤波器的相反物，后者只通过截止频率附近的谐波。陷波滤波器对声音的影响往往细微；移动（调制）截止频率可能会导致微弱的相位感声音。陷波滤波器常用于音响系统以减轻或消除问题频率，例如地环嗡嗡声、房间共振或声音谐波频谱中的其他烦人峰值。考虑一下在跳线连接中使用陷波滤波器来掏空声音，为谐波频谱留出空间让其他声音以较少的竞争存在，或者仅仅为了创造一种由于预期内容缺失而更可能吸引耳朵的声音。\n\
  \n## 陷波 (Notch)\n一个窄带的音频频率。\n\n## NW/m\n测量模拟磁带磁场强度的标准单位。`韦`（Weber）是磁场强度的单位，但对于磁带机中的磁性来说，这个单位太大了，因此使用\
  \ `纳韦`（nanowebers）。每米纳韦有效地描述了录制到磁带上的信号强度。\n\n## 半字节 (Nybble)\n半字节（或 Nibble）——计算机数据的一半，即\
  \ 4 位。\n\n## 奎斯特频率 (Nyquist Frequency)\n在数字录音中，能够正确记录和复制的最高频率，等于采样率的一半。（例如，对于常见的\
  \ 44100 Hz 采样率，奎斯特频率为 22050 Hz。）超过此阈值的频率会导致混叠。（参见“混叠”。）\n\n## 奎斯特率 (Nyquist Rate)\n\
  用于记录和复制给定音频信号的最低采样率，相当于最高频率的两倍。如果模拟信号或声音中的最高频率是 18000 Hz，理论上该信号必须以每秒至少 36000 Hz\
  \ 进行采样——否则信号被认为采样不足并产生混叠。这在本质上是奎斯特频率的相反原理。（注意：44100 Hz/秒的采样率被认为是标准采样率，因为它轻松覆盖了人类听力约\
  \ 20000 Hz 的上限。）\n\n## 八八分频器 (Octave Divider)\n一种模块产生比输入声音基础谐波（即“音高”）低一个或两个八度的新音调，以强调低音。有时也称为亚八度或亚低音功能。\n\
  \nOctave\n\n\n\n\n\n# 八度 (Octave)\n八度是一个典型的音乐单位。例如，键盘上所有的“C”音之间都隔了一个八度。要弹出一个比当前频率高一个八度的音，你需要将其音高翻倍；要弹出一个低一个八度的音，则需要将频率减半。在电路连接（patch）术语中，这通常意味着通过增加或减少\
  \ 1 伏特来实现一个八度的频率变化；某些振荡器的前面板上带有八度开关，可以为你加或减这些电压（尽管它们并不总是完全准确；你通常在切换八度后需要重新调音）。次八度或次谐波发生器通过将输入频率除以\
  \ 2 或 4 来产生低一或两个八度的新波形，从而增加低音。\n\n# Off 轴 (Off Axis)\n偏离麦克风接收端正方的虚拟线（轴）。以角度度为单位。（例如，直接从麦克风后方传来的声音被称为离轴\
  \ 180 度。）\n\n# 偏移时间 (Offset Time)\n1) 用于触发 `MIDI` 序列器开始运行的 `SMPTE` 时间。\n2) 为了让两个卷带轮同步播放音乐所需的位置差。\n\
  \n# 偏移 (Offset)\n简单来说，`Offset` 模块通常会对通过它的信号增加或减去电压——例如将一个 0 伏信号偏移为 +10v 信号，使其变为在\
  \ -5 到 +5 伏特之间变化。\n\n# 欧姆定律 (Ohm’s Law)\n电压、电流和电阻之间的数学关系。\n\n# 欧姆 (Ohm)\n用于测量信号或设备中电流流阻碍（阻抗）大小的单位。（参见“阻抗”。）\n\
  \n# 全能模式 (Omni Mode)\n一种让 `MIDI` 设备能够同时识别并响应所有 `MIDI` 通道的设置。\n\n# 全能 (Omni)\n一个表示“全”的意思的前缀。\n\
  \n# 全向性图形 (Omnidirectional Pattern)\n1) 在麦克风中，从所有方向均匀地采集（有时也称为“非指向性”）。\n2) 在扬声器中，向所有方向均匀地发送信号。\n\
  \n# 在轴 (On Axis)\n位于麦克风振膜正前方的位置，与其运动方向对齐。\n\n# 开路 (Open Circuit)\n一种断开、中断或不完整的电气电路，会阻止电流流动。\n\
  \n# 工作电平 (Operating Level)\n（有时也称为“参考电平”）在正常运行中不应超过的最大电平。\n\n# 运算放大器 (Operational\
  \ Amplifier)\n（缩写为“Op Amp”）用于大多数音频和电子设备的放大电路。\n\n# 运算跨导放大器 (Operational Transconductance\
  \ Amplifier)\n`OTA`（运算跨导放大器）电路是一种将输入电压转换为输出电流的电路。这是一种非常流行的放大器设计，因为它不容易进入饱和（裁剪），具有良好的带宽，并以“温暖”的声音闻名。因此，你可能会在\
  \ `VCAs`（电压控制放大器）中发现它。电流可以被视为电阻的反数，因此你在 `OTA` 电路中本质上是一个电压转电阻器件，使得向滤波器等电路添加电压控制成为可能。通常，当有人吹他们基于\
  \ `OTA` 的滤波器时，他们通常是指它具有“温暖”的声音……除非它是 `MS-20` 滤波器的克隆，那种情况下它的声音会更薄、更尖锐。实际上，使用 `OTA`\
  \ 更多是为了设计的便利性，而不是为了创造特定的声音。\n\n# 操作器 (Operator)\n有几种不同的合成技术，其中通常是一个音频速率信号对另一个音频信号进行处理。例如，在频率调制（`FM`）中，第二个信号（称为调制器）改变主信号（称为载波）的频率（音高）。这两个信号或振荡器通常被称为操作器，特别是在\
  \ `FM` 连接中。相比模块系统，你更有可能在使用专门的 `FM` 合成器（如 `Yamaha DX-7` 及其后代产品）时听到这个术语。\n\n# 或逻辑函数\
  \ (OR function)\n最常见的布尔或二进制逻辑函数之一，`OR` 表示如果任何一个输入上有门开启（或“高电平”）信号（即输入 1 或输入 2 或输入\
  \ 3 等），则输出门开启信号。`NOR` 函数具有反相的输出：只有当所有输入均为低电平时（输入 1 和输入 2 都不是高电平），输出才会开启（高电平）。`XOR`（异或）仅当其中一个输入为高电平时才会输出高电平，但如果两个输入均为高（或均为低）则不会。最后，`XNOR`\
  \ 是 `XOR` 函数的反相。\n\n# 振荡器 (Oscillator)\n核心上，振荡意味着以重复的模式往复变化。模块系统中的主要声音发生器被称为 `oscillator`（振荡器），因为它的输出电压以重复的模式上下变化（振荡）。这种模式被称为其波形（例如方波，它在高电压和低电压之间交替）；这种模式重复的快慢被称为其频率或音高。振荡器在声学乐器中的对应物是吉他上往复振动的弦、上下振动的鼓皮，或者木管乐器中簧片中的振动。模块合成器振荡器的振动只是通过电流流过导，而不是物理物体在空气中振动。（最终，这些电会被传输到扬声器，然后扬声器通过电线发送的相同模式振动空气。）\n\
  \n# 示波器 (Oscilloscope)\n这是一种将电压波动显示为图形波形的测试设备。“示波器”可以在宽的频率范围内运行，显示缓慢变化的电压（如 `LFOs`\
  \ 或包络）或快速变化的电压（如振荡器和噪声）。示波器曾是笨笨的外部设备，但现在你可以获得 `USB scopes`，它们将显示部分交给电脑，或者作为模块使用示波器。\n\
  \n# OTA\n`OTA`（运算跨导放大器）电路是一种将输入电压转换为输出电流的电路。这是一种非常流行的放大器设计，因为它不容易进入饱和（裁剪），具有良好的带宽，并以“温暖”的声音闻名。因此，你可能会在\
  \ `VCAs`（电压控制放大器）中发现它。电流可以被视为电阻的反数，因此你在 `OTA` 电路中本质上是一个电压转电阻器件，使得向滤波器等电路添加电压控制成为可能。通常，当有人吹他们基于\
  \ `OTA` 的滤波器时，他们通常是指它具有“温暖”的声音……除非它是 `MS-20` 滤波器的克隆，那种情况下它的声音会更薄、更尖锐。实际上，使用 `OTA`\
  \ 更多是为了设计的便利性，而不是为了创造特定的声音。\n\n# 反相 (Out of Phase)\n1) 与另一个信号在振幅、频率和波形上相似，但在时间上偏移了一个周期。\n\
  2) 具有相反的极性。\n\n# 外置设备 (Outboard Equipment)\n与控制台配合但不是控制台组成部分的设备。\n\n# 输出阻抗 (Output\
  \ Impedance)\n放大器（或其他设备）输出电路对电流流动的阻碍。\n\n# 输出电平 (Output Level)\n设备输出信号电平。\n\n# 输出\
  \ (Output)\n1) 设备发送信号的接口或物理位置。\n2) 输出输出信号。\n\n# 叠录 (Overdubbing)\n在现有录音上录制额外的音乐表演的过程，通常在独立的轨道上。随着多轨道录音的出现，叠录已成为一种常见的录音技术，最初是在多轨道磁带上，后来则通过计算机和数字音频工作站（DAW）实现。\n\
  \n# 泛音 (Overtone)\n音中除基频频率之外的任何谐波。（参见“分音”。）\n\n# 垫 (Pad)\n1) 一种衰减输入信号的设备或电路，通常用于防止后续的放大器过载。（有时也称为“衰减器垫”。）\n\
  2) 一种表面可以用鼓棒击打的设备；击打垫会产生输出信号脉冲（或 MIDI 命令），导致鼓机或合成器发出鼓声。\n3) 一种合成器音色/程序，用于创建持续的背景或氛围声音。\n\
  \n\n\n\n\n在立体声场中“放置”某个特定声音的过程。这是通过控制左右扬声器之间信号的平衡来实现，使耳朵听到的声音来自左右之间声学空间中的特定点。这种声学空间有时被称为“立体声全景”（stereo\
  \ panorama），“声位”（panning）一词便源于此。在环绕声中，声位发生在 360° 的声空间内，而不仅仅是左右。\n\n### Panpot (或\
  \ Pan Pot)\n“Panoramic Potentiometer”（全景位器）的缩写，是通道条上的一个旋钮，通过控制发送到每个扬声器或通道的信号量，来控制音频信号在立体（或环绕）空间中的声位。\n\
  \n### 并联接口 (Parallel Jacks)\n多个插孔，每个连接都与其他插孔的相应连接。\n\n### 并口 (Parallel Port)\n一种能够通过不同引脚同时传输和接收数字数据的连接器。\n\
  \n### 参数 (Parameter)\n参数是你试图更改的合成器模块的任何值、属性或控制项的雅称。例如，振荡器的参数通常包括它的音高和脉冲波宽度。滤波器的参数将包括它的截止频率（音高）、共振量（反馈），以及可能的其他控制项，如不同输出之间的混合。“参数”是一个描述软件中可以更改的值的流行术语，已被一些人引入到硬件模块合成器中。\n\
  \n### 参数均衡器 (Parametric Equalization)\n一种均衡器，其中所有的均衡参数都可以调整到任意数值，包括中心频率、增强或衰减量以及带宽。\n\
  \n### 半声性 (Paraphonic)\n半声合成器是指所有播放的音符都通过单个滤波器（`VCF`）和放大器（`VCA`）的合成器。这是多声合成器早期的一种流行方案，每个音符都使用一个独立的振荡器（对于“弦乐合成器”等则使用类似风琴的频率分频器），但在进入滤波器和放大器之前，它们会被混合在一起发出音符。某些单声合成器允许二到四个独立音符独立控制其振荡器的音高，但仍然通过单个滤波器，这并不。对于和弦非常有效；但当按住其他音符时弹奏新音符，效果并不总是那么理想，因为所有音符将重新一起发声。\n\
  \n### 部分音 (Partial)\n1) 泛音（overtone）的另一种说法。\n2) 构成复杂声音的多个正波之一，有助于定义音色。这个概念是合成器创建声音的关键部分：在加法合成中，将多个部分音组合起来创建一个特定的频率。\n\
  \n### 通带 (Pass Band)\n滤波器会“通过”而非衰减的信号频率范围。\n\n### 被动设备 (Passive Device)\n不产生或控制电电流的组件（与“有源设备”相反）。在音频应用中，这通常指设计中不包含放大器的设备。例如，有源扬声器是自供电的，而被动扬声器需要外部放大器来重现声音。（参见“有源设备”。）\n\
  \n### 被动 (Passive)\n意味着不涉及有源（即未连接电源）电子设备——例如直接将信号通过电位器控制发送，而不是使用运算放大器和其他电子设备在其周围创建混合电路。被动既便宜又简单，且不会给信号增加噪声。但被动电子设备无法对一个信号与其他信号进行缓冲（这意味着它们可能会以不利的方式相互作用），并且无法对信号进行放大、偏移或反转。\n\
  \n### 跳线板 (Patch Bay)\n跳线板（或 Patchbay, Patch Field, Patch Panel）——一个包含一系列插孔的面板或组件，带有控制音台和工作室组件的大部分输入和输出的连接，用于组织、管理和调节信号流。\n\
  \n### 跳线线 (Patch Cable)\n用于连接模块合成器中不同输入和输出的电缆，携带电控制电压和音频。该术语源于旧电话交换机，接线员必须使用电缆物理性地将两个通话者连接在一起。由于不同的模块格式通常使用不同的连接器标准，你需要确保跳线线末端的连接器尺寸是你所需要的（Eurorack\
  \ 使用 3.5mm，5U/Moog Unit 使用 1/4”，或者 Serge 或 Buchla 控制电压使用香蕉头）。\n\n### 跳线 (Patch Cord\
  \ 或 Patch Cable)\n一种两端带有插头的绝缘电缆，用于路由音频信号。跳线通常被认为是用于在跳线板中建立连接的短线（因此得名）；然而，跳线可以方便设备之间几乎任何类型的音频连接，有多种长度，并包含许多不同类型的连接器。\n\
  \n### 跳线区域 (Patch Field)\n一个包含一系列插孔的面板或组件，带有音台和工作室组件的大部分输入和输出的连接，用于组织、管理和调节信号流。\n\
  \n### 跳线库管理器 (Patch Librarian)\n一种允许通过 MIDI 在合成器外部存储声音补丁（patches）的计算机程序。\n\n###\
  \ 跳线面板 (Patch Panel)\n一个包含一系列插孔的面板或组件，带有控制音台和工作室组件的大部分输入和输出的连接，用于组织、管理和调节信号流。\n\n\
  ### 跳线 (Patch)\n用于描述一组模块如何互连以创建声音的简称为术，源于使用跳线连接模块。\n1) 通过使用插入插孔的带插头短线，在音频系统（如音台）中路由或重新路由信号。\n\
  2) 合成器上的一个声音设置或程序。\n\n### 路径 (Path)\n信号路径（Signal Path）的缩写，电流流过电路或设备的方式。\n\n### PCM\n\
  脉冲编码调制（Pulse Code Modulation）——一种将模拟信号转换为数字代码的过程。这是通过在快速间隔内对模拟信号的幅度进行采样，然后将其转换为原始信号的二进制表示来实现。采样率越高，数字复制越好。PCM\
  \ 是数字音频中最常见的数/数转换形式。\n\n### PD\n相位失真（Phase Distortion）合成最初在 80 年代用于卡奥 系列合成器。它与 FM（频率调制）有关，但有足够的差异可以避免当时雅马频率合成器的专利问题。有趣的是，它很好地模拟了许多模拟合成效果，包括共振滤波器的声音。\n\
  \n### 峰滤波器 (Peak Filter)\n一种增强或衰减中间部分（音频信号中的中心频率，而非高通或低通滤波器）的均衡电路/滤波器。（不要与幅度峰混淆。）\n\
  \n### 峰值表 (Peak Meter)\n一种检测波形绝对峰值的值表，而不是 RMS 值。（参见“峰值”、“均方根”、“RMS 值表”。）\n\n###\
  \ 峰峰值 (Peak to Peak Value)\n音频信号中正峰和负峰之间总幅度的量。对于正弦波来说，它等于峰值的两倍。（参见“峰值”。）\n\n###\
  \ 效果板 (Pedal Board)\n一个安装了多个吉他效果器并相互连接的板子，以便吉他手可以方便地激活多种效果。\n\n### 幻象电源 (Phantom\
  \ Power)\n一种通过音频电缆为电容麦克风和其他组件提供直流电压的系统，消除了对外部电源的需求。\n\n### 相位叠加 (Phase Addition)\n\
  \n\n\n\n当波形处于相似相位关系时，音频能量增加，导致音量增加到理论应水平的两倍。\n\n## 相位抵消 (Phase Cancellation)\n相位相加的反面，它是当两个相位相反的相似波形开始相互抵消时发生的能量衰减，这会大幅降低或消除音量。当两个完全相同的波形完全相反（相差\
  \ 180 度）时，理论上的结果是信号完全静音或抵消。\n\n# 相位失真合成 (Phase Distortion Synthesis)\n相位失真合成最初由卡西欧在\
  \ 80 年代用于其 `CZ` 系列合成器中。它与 `FM`（频率调制）有关，但具有足够的差异以避免与当时雅马哈 `FM` 合成器所使用的专利冲突。有趣的是，它很好地模拟了许多“模拟”合成器效果，包括共振滤波的声音。\n\
  \n## 相位失真 (Phase Distortion)\n由于信号的相位移动导致声音变化。有时在合成器中用作改变波形或为声音添加谐波的方法。\n\n## 相位锁定\
  \ (Phase Lock)\n指通过纠正相位差来帮助同步信号或设备的若干过程之一。例如，在模拟磁带机中，相位锁定通过感知两台机器播放导频调的相位差并调整速度来消除相位差，帮助保持多台机器同步。在合成器中，相位锁定控制一个音调发生器，使其波形与另一个音调发生器的信号相位相同。相位锁定环（`PLL`）是电子设备时钟功能的参考信号。\n\
  \n## 相位锁定环 (Phase Locked Loop)\n相位锁定环本质上是一种振荡器，试图匹配另一个信号的频率——或者更重要的是匹配其频率的倍数或除数。这最常用于创建一个远高于输入参考信号的频率——例如，可以产生比输入时钟节拍\
  \ 2、4、8 或更多倍的输出时钟的时序模块，或者锁定在输入音高倍数的高频振荡器——也许用于驱动诸如开关电容滤波器等特殊电路。\n\n## 相位调制 (Phase\
  \ Modulation)\n一些人认为这是频率调制（`FM`）严谨的术语，因为使载波振荡器播放得更快或更慢（快速改变其频率使其高或低）与波形正常播放位置的提前或推迟（相位）是相同的。但在创建\
  \ `FM` 补丁时不要纠结于术语；只需将一个振荡器的输出连接到另一个振荡器的音高输入即可。\n\n## 相位反转 (Phase Reversal)\n电路中的变化，使波形移动\
  \ 180 度。\n\n## 相位移 (Phase Shift)\n引入音频信号的延迟，以延迟的角度为单位。\n\n## 相位移器 (Phase Shifter)\n\
  这种效果将信号分成两个拷贝。其中一个拷贝通过“全通滤波器”，该滤波器不会像低通或高通滤波器那样衰减任何原始谐波，但它会改变信号的相位，导致这些谐波根据其频率相对于原始信号产生不同程度的相位偏移。将这两个拷贝重新混合在一起，原始声音的不同谐波分量就会相互抵消（参见\
  \ `Phase`），导致陷波滤波器效果。相位移器的每个“阶段”——全通滤波器部分——都会创建一个这样的槽点。阶段越多，槽点就越多，效果也越深。\n\n## 相位锁定环\
  \ (Phase-Locked Loop)\n`PLL` - 指通过纠正相位差来帮助同步信号或设备的若干过程之一。例如，在模拟磁带机中，相位锁定通过感知两台机器播放导频调的相位差并调整速度来消除相位差，帮助保持多台机器同步。在合成器中，相位锁定控制一个音调发生器，使其波形与另一个音调发生器的信号相位相同。相位锁定环（`PLL`）是电子设备时钟功能的参考信号。\n\
  \n## 相位 (Phase)\n两个相似波形之间时间差的测量值（以度表示）。\n\n波形的一个周期被认为是 360 度，就像圆一样。你在圆上移动（或穿过波形）的距离可以用相位来定义。例如，如果你运行完一个波形周期的四分之一，你的相位就是\
  \ 90°。\n\n## 移相效果 (Phasing)\n一种通过改变音频信号的相位移，然后与直接信号混合产生的效果声音。\n\n## 冯 (Phon)\n一种表观响度的单位，数值上等于\
  \ 1000 `Hz` 音调播放时具有相同 `dB` 数。例如，如果一个声音被感知为与 60`dB` 播放的 1000 Hz 音调一样响，则该声音为 60 冯。\n\
  \n## 手机插头 (Phone Plug)\n一种直径为 1/4 英制、长度为 1 1/4 英制的插头，用于音频连接。\n\n## 唱头头 (Phono Plug)\n\
  大多数立体声系统中常见的音频接口，中心针脚作为一个连接，外壳作为第二个连接。\n\n# 物理建模 (Physical Modeling)\n一种（通常是数字）合成方法，通过重建实际乐器的组件——如振动的弦或管子，或者共鸣体（如吉他或鼓的外壳）并将它们连接起来创建声音。可以使用几个模块执行这种建模来创建它们的声音。\n\
  \n## 拾音器形状 (Pickup Pattern)\n麦克风前方或周围均匀采集声音的区域形状。许多人将此术语与“极性图形”互换，但极性图形提供了更多关于麦克风敏感性的细节。（另见“极性图形”）。\n\
  \n## 拾音器 (Pickup)\n1) 电吉或其他乐器上的设备，根据弦的运动输出音频信号。\n2) 参见 `接触式麦克风`。\n\n## 压轮 (Pinch\
  \ Roller)\n录音机上的橡胶（或塑料）轮，将磁带压在它和动轴之间，允许动轴带动磁带。\n\n## 乒乓处理 (Ping-Ponging / Bouncing)\n\
  将多个轨道合并并混合到一个或两个轨道（单声道或立体声）的技术。这可以通过控制台播放并录制到单独轨道来实现实时或模拟，也可以通过数字音频工作站进行。工程师曾经常使用这种方法来释放额外的录制轨道，但在轨道无限的数字工作站中，这种做法已基本过时。今天，工程师通常为了创建歌曲的初步或最终混音而合并轨道。\n\
  \n## 粉色噪声 (Pink Noise)\n类似于类似于白噪声，包含所有音频频率，但每个频区的能量相等而非所有频带。工程师经常使用粉色噪声作为调整和校准音频设备的工具。（另见“白噪声”）。\n\
  \n噪声是一种随机的无调信号，在音频频率下听起来像嘶嘶声或风声。粉色噪声每个音区的能量相等。由于每个高音区的频率都是下方音区的两倍，将能量分散到更宽的频率范围内，因此粉色噪声往往具有更自然、电子感更低的声音，低音更多高音更——特别是与白噪声相比，白噪声每个赫兹（频率）的能量相等，因此听起来非常亮。\n\
  \n## 音高弯曲 (Pitch Bend)\n合成器、键盘或控制器上的机制，可以使音高略微向上或向下移动。\n\n## 音高转电压转换器 (Pitch to\
  \ Voltage Converter)\n检测音频波形频率并将其转换为控制电压的设备，该电压随后输入到产生相同频率的振荡器。\n\n## 音高转 MIDI 转换器\
  \ (Pitch-to-MIDI Converter)\n\n\n\n\n\n一种检测模拟音频信号中的音高并将其转换为 MIDI 信息的设备。（也称为“音频转\
  \ MIDI 转换器”）\n\n### 音高转电压器 (Pitch-to-Voltage Converter)\n一种检测音频波形频率并将其转换为控制电压设备，该电压随后馈给振荡器以产生相同频率的音高。\n\
  \n### 音高 (Pitch)\n1) 耳对频率的感知（音乐中的高音或低音）。\n2) 磁带传输设备上的控制装置，用于微调提高或降低速度，从而改变音乐的音高和时间。\n\
  \n### 板胆混响 (Plate Reverb)\n一种通过类似于扬声器驱动器的换能器将振动传过金属板产生人工混响的设备。现在的物理板混响被认为是一种复古的人工混响形式；如今大多数板胆混响效果通过插件或混响单元进行数字仿真。\n\
  \n### 播放头 (Playback Head)\n一种将记录在磁带上的磁通量转换为播放音频信号的换能器。\n\n### 播放模式 (Playback Mode)\n\
  调音台上的某种配置，允许通过监听混音器快速播放之前在磁带上或通过 DAW 记录的信号。\n\n### 播放 (Playback)\n1) 录制音频的再生。\n\
  2) 在电影或视频制作中，通过扬声器播放音乐，以便表演者/音乐家能够根据音乐节拍进行拍摄表演。\n\n### 播放列表 (Playlist)\n1) 参见“分轨\
  \ (Take)”。\n2) 用户定义的歌曲选择；大多数流媒体和数字媒体播放器均具有此功能。\n\n### PLL (锁相环)\n锁相环本质上是一种振荡器，试图匹配另一个信号的频率——更重要的是匹配该信号频率的倍频或分频。它最常用于创建一个远高于输入参考信号的频率——例如，可以产生比输入时钟\
  \ 2、4、8 或更多倍率率输出时钟的时序模块，或者锁定在输入音高倍频上的高频振荡器——可能用于驱动如开关电容滤波器等特种电路。\n\n### 插头 (Plug)\n\
  一种通常位于电缆上的连接器，与插座（jack）配合。\n\n### 极性图 (Polar Pattern)\n1) 在麦克风中，显示麦克风周围对声波敏感区域的图形，详细列出从不同方向到达的音频输出电平（单位为\
  \ dB）。类似于“拾音模式 (Pickup pattern)”，但更具体。\n2) 在扬声器中，显示扬声器声音扩散的图形。\n\n### 极性 (Polarity)\n\
  电流流向或磁化力的方向。\n\n### 极性器 (Polarizer)\n反相器将输入的控制电压乘以 –1。在门或逻辑反相器中，它会反转高低电平，使得（例如）`0v`\
  \ 变为 `5v` `5v` 变为 `0v`。这有时被称为极性器，因为它改变了信号的极性（+ 与 –）。控制电压反相器通常与偏移电压结合，以将输出电压调整到所需的范围。例如，如果你有一个输出范围为\
  \ `0` 到 `+8` 伏的包络发生器，而你对其进行了反相，结果将是 `0` 到 –8 伏。由于某些模块（如电压控制放大器）通常只接受正电压，你需要在该结果加上\
  \ `8` 伏，以得到一个整体范围仍为 `0` 到 `+8v` 的反转（倒）包络。\n\n### 极化电压 (Polarizing Voltage)\n在电容式和电极麦克风中，引入少量电流以产生磁性，通过电容器将音频信号转换为电流。在电容式麦克风中，极化电压由外部提供（参见“幻象电源”）；在电极麦克风中，极化电压在制造过程中永久施加在电容器上。\n\
  \n### 极片 (Pole Pieces)\n铁或其他磁性材料，引导磁力，用于唱片头、播放头、麦克风、扬声器等换能器。\n\n### 极点 (Pole)\n\
  这是一个帮助描述滤波器设计的术语。滤波器的每个极点都会将其截止频率或角频率以上的频率衰减 6 分贝 (dB)/倍频；极点越多，滤波效果越强。例如，4 极低通滤波器会将高于截止频率一个倍频的频率衰减\
  \ 24 dB；高于截止频率两个倍频的频率衰减 48 dB，依此类推。\n\n### 多声 (Polyphonic)\n“多声”一词指的是可以同时演奏多个独立清晰音符的合成器；在大多数情况下，这些音符都产生相似的声音或音色。能够同时播放多个音高或“声部”。一种常用于描述合成器和键盘的术语。（参见“声部\
  \ (Voice)”）。\n\n### 混录 (Ponging/Bouncing)\n将多个轨道合并并混合到一个或两个轨道（单声道或立体声）的技术。这可以通过实时或模拟方式通过调音台播放轨道并将其记录到单独轨道上完成，也可以通过数字音频工作站以数字方式完成。工程师曾使用混录来释放额外的录音轨道，但在轨道几乎无限制的数字工作站中，这种做法已基本过时。如今，工程师通常通过混录来创建歌曲的初步或最终混音。\n\
  \n### 防喷罩 (Pop Filter)\n一种放置在麦克风上或麦克风与歌手之间的设备，用以防止歌手吹向麦克风的气流产生巨大的“噗噗”声。\n\n### 端口\
  \ (Port)\n1) 计算机或电子设备中用于传输和接收数字数据的连接点，类似于插座接收和传输音频信号的方式。\n2) 扬声器外壳上的开口或通风口，与扬声器内的空气运动产生共鸣，用于低音反射扬声器和低音单元以增强低频。\n\
  \n### 滑音 (Portamento)\n一种从一个音高平滑过渡到另一个音高的频率变化。也指允许或导致这种现象发生的合成器模式或 MIDI 命令。\n\n\
  ### 后期 (Post Production)\n指在录制或拍摄完成后添加轨道、编辑和其他精细调整的工作。录制的后期制作包括叠录、编辑、混音和母带处理。电影后期制作包括广泛的音频和视觉效果。注意：我们在此上下文中提到电影，是因为电影后期涉及大量的音频工作（例如配音、音效、音频混音和编辑），以至于许多音频工程师全职参与电影后期。\n\
  \n### 后滚带 (Post Roll)\n录制结束后的空白磁带（或 DAW 中的轨道静音）部分。（参见“前滚带 (Pre-Roll)”）。\n\n### 后推子\
  \ (Post Fader)\n一种辅助发送的的位置或设置，将发送放置在通道推子之后。后推子发送意味着推子本身会影响发送信号的电平，而前推子则不会。\n\n###\
  \ 后 (Post)\n一种辅助发送的位置或设置，将发送放置在通道推子之后。后推子发送意味着推子本身会影响发送信号的电平，而前推子则不会。\n\n### 电位器\
  \ (Potentiometer)\n通常被认为是“旋钮”的高级词汇，电位器本质上是任何通过改变量来控制输入或输出电压的机制（例如控制左右平衡、音量控制，或发送到辅助发送或总线的信号量）。电位器可以是旋钮也可以是推子，这意味着调音台上几乎每个按钮或开关以外的控制装置都是电位器。然而，许多工程师通常将推子称为“faders”，将旋钮称为“pots”。\n\
  \n\n\n\n\n*（Pot 的缩写）这通常被认为是“旋钮（knob）”的高级说法，电位器基本上是任何通过改变量来控制输入或输出电压的机制（例如，信号的左/右平移、音量控制，或发送到辅助发送端或总线的信号量）。电位器可以是旋钮也可以是推子，这意味着调调音台上几乎每一个不是按钮或开关的控制部件都是电位器。然而，许多工程师通常将推子推称为“faders”，将旋钮称为“pots”。*\n\
  \n# 功率放大器 (Power Amplifier)\n\n*（Power Amp 的缩写）一种将线路电平信号放大以驱动扬声器或一组扬声器的设备。（参见“线路电平”。）*\n\
  \n# 电源分配板 (Power Distribution Board)\n\n这种简单的电路板获取你的模块化系统电源的输出，并创建它的多个副本，路由到连接各个模块的连接器上。\n\
  \n# PPQN\n\n当你发送时钟信号（通常是门信号或其他电脉冲）在模块化合成器中传输以使序列器在步骤之间移动时，了解该时钟的脉冲速度是很有用的。这通常定义为每四分音符有多少个脉冲——简称为\
  \ PPQ 或 PPQN。如果时钟只是每个四分音符发生一次，那么时钟速度就是 1 PPQN；在 DIN Sync（早期 Roland 合成器中常用的常用标准，DIN\
  \ 是所使用的电连接器类型）或 MIDI 时钟的情况下，标准是 24 PPQN。这意味着主脉冲可以为每个八分音定义一个三连音（8 x 3）。\n\n# 前/后切换开关\
  \ (Pre / Post Switch)\n\n输入模块上的一个开关，决定发送控制是在信号路径中位于主通道推子的之前还是之后（参见“推子前”、“推子后”）。\n\
  \n# 前置性性强调 (Pre Emphasis)\n\n在录音过程中对高频进行增强，以使可听信号保持在噪声底之上。\n\n# 推子前 (Pre Fader)\n\
  \n指辅助发送的位置或设置，它将发送放置在信号路径中通道推子的之前。推子前发送信号意味着推子不会影响发送信号的电平，这与推子后相反。\n\n# 前延迟 (Pre-Delay)\n\
  \n混响单元或插件上的一个参数，决定了原始干声与混响早期反射之间时间量（延迟）。此功能通常用于模拟房间的自然声学特性，也可以用于创建趣味性的非自然效果。\n\n\
  # 前置声 (Pre-Echo)\n\n*（也称为“正向回声”）一种经常出现在数字音频中的压缩伪真，其中声音（或部分声音）的“回声”在声音本身之前被听到，通常是由于某些压缩数字格式中的数据不一致引起的。某种类型的前置声有时也会出现在录音的最终产品中，在磁带上是由于渗透（print-through）引起的低电平泄漏，在黑胶唱片上则是由于静音与大瞬态之间凹槽的物理差异和/或变形引起的。在数字格式中，前置声通常是一个不需要的问题，需要额外的信号处理来解决——但在某些情况下，它也可以特意用音效（不要与“反向回声”混淆）。*\n\
  \n# 推子前监听 (PFL)\n\n调音器通道调音台或 DAW 通道条上的功能，允许在通道推子之前听到并通常对通道信号进行电平测量。\n\n# 前放大器 (Preamplifier\
  \ / Preamp)\n\n一种低噪声放大器，旨在接收低电平信号（例如来自麦克风），并在发送到调音台之前将其提升到正常的线路电平。\n\n# 哈斯效应 (Precedence\
  \ Effect / Haas Effect)\n\n简单来说，人类听觉中的一种因素，我们通过时间而不是声音电平来感知声源。赫尔穆特·哈斯（Helmut Haas）在他的研究中确定，首先到达耳朵的声波帮助大脑判断声音来自哪里，而不是它的反射或来自另一个源的复制。声音的反射必须比原始源大至少\
  \ 10dB，或者延迟超过 30ms（我们可以将其感知为回声），才会影响我们对声音方向的感知。这有助于我们区分原始声源，而不会被附近表面的反射和混响所困扰。理解哈斯效应在现场音频设置中特别有用，尤其是在大型场馆中，场馆内的扬声器经过时间延迟处理，以匹配从声源传来的初始声波。\n\
  \n# 精确加法器 (Precision Adder)\n\n合成器对音高控制电压的意外变化非常敏感——任何误差都可能导致受控的振荡器跑调。因此，每你在模块化合成器内部叠加音高控制电压时，你真的应该使用精确加法器，精确地相加音高电压而不引入误差。普通的调音器可能会轻微衰减或放大通过它们的电压，这在大多数情况下会导致调误差。\n\
  \n# 预混 (Premix)\n\n1) 将一组轨道作为一个组进行混合的过程，然后通过将其路由到辅助通道，在其他轨道的上下文中管理混合组。通过跳混（bouncing）合并轨道是预混的一种形式，但预混并不一定是预录制的。（参见“跳混”。）\n\
  \n2) 电影后期制作的一个重要部分，即混合某部分音频以与其他部分结合的过程。对话、拟音（Foley）、特效和音乐在视频下合并之前可能都会进行预混。\n\n#\
  \ 存在感频率 (Presence Frequencies)\n\n4 kHz 到 6 kHz 之间的音频频率范围，增强后可以增加存在感，尤其是对于人声。\n\n\
  # 存在感 (Presence)\n\n1) 在放大和混音中，对中高频进行增强以使声音或乐器突出，营造出声源更加“存在”、就在听者旁边的印象。\n\n2) 参见“环境音（Room\
  \ Tone）”。\n\n# 预设 (Preset)\n\n合成器、信号处理器、插件或其他电子设备上的出厂编程参数集。\n\n# 压力麦克风 (Pressure\
  \ Microphone)\n\n*（也称为“压力作用麦克风”）——一种麦膜对入射声波压力做出响应，同时对抗麦克风壳内的正常或受控空气压力。这种设计使麦膜对方向不敏感，从而产生全向拾音模式。（参见“全向模式”。）*\n\
  \n# 压力敏感 (Pressure Sensitivity / Aftertouch)\n\n某些键盘乐的一种功能，在按下按键后对其施加额外压力可以激活额外的\
  \ MIDI 控制命令。合成器或键盘控制器的 After Touch（合成器的一种控制或操作功能，在按下按键后释放之前激活一个由玩家设置的控制命令）。\n\n\
  # 压力区域麦克风 (Pressure Zone Microphone / Boundary Microphone)\n\n一种全向麦克风，设计为紧贴平面表面（或边界）放置，有效地产生“半全向”拾音模式，同时消除了反射声产生相位问题的危险。一种流行的边界麦克风是\
  \ Crown Audio 的商标产品压力区域麦克风 (PZM)。\n\n# 压力梯度麦克风 (Pressure-Gradient Microphone)\n\n\
  *（也称为“速度麦克风”）一种麦膜前后暴露的麦克风，麦膜的运动是由其前后的压力差引起的。这创建了双向或“8 字形”拾音模式（参见“双向模式”。）*\n\n# 压力\
  \ (Pressure)\n\n\n\n\n\n-某些键盘可以测量你按下按键的力度，并将其转换为电压（或其他控制信号，如 MIDI，随后可以转换为控制电压），你可以利用它为音符增加表现力，例如添加颤音或更宽地开启滤波器。单声道触后力度（Monophonic\
  \ aftertouch）为整个键盘测量一个压力值，无论你按了哪个按键；多声道触后力度（polyphonic aftertouch）则为每个单独的按键产生信号。一个重要的冷知识：触控键盘实际上测量的是接触键盘的皮肤表面面积，而不是压力或力——因此，你可以通过在指尖和指节长度之间滚动来增加或减少触后力度量。\n\
  \n### 串扰 (Print Through)\n磁通量从模拟磁带的一层到另一层的非意愿传输。\n\n### Pro Tools\nAvid 对其数字音频工作站（DAW）的商品名称，已成为专业录音室的行业标准。\n\
  \n### 制作人 (Producer)\n在音乐中，制作人是音频录制项目的导演；负责在预算内获得所需质量的最终产品的人。\n\n### 制作室 (Production\
  \ Studio)\n广义来说，任何艺术领域内用于制作的空间，例如电影/视频、动画或后期制作。在音频背景下，制作室实际上是一个录音室，专门负责将预录的音乐、效果与新录制的对话进行组合和混音，用于广告和广播节目。\n\
  \n### 制作 (Production)\n1) 投入音乐制作的集体活动。\n2) 描述录音质量——录音和混音过程中制作决策的最终结果。\n\n### 节目更改\
  \ (Program Change)\n一种告诉接收设备更改预设设置的 MIDI 消息。\n\n### 可编程的 (Programmable)\n允许用户更改参数，特别是在计算机控制的设备中。\n\
  \n### 提示 (Prompt)\n出现在计算机屏幕上供用户遵循的指令集。\n\n### 协议 (Protocol)\n在数字和信息技术中，一组规定以标准格式结构和传输数据的规则，以便所有相关设备都能正确解释数据。\n\
  \n### 近接效应 (Proximity Effect)\n当麦克风离声源越近时，麦克风输出中低频率自然增强。\n\n### 声心理学 (Psychoacoustics)\n\
  研究人类如何感知和响应声音，不仅不仅限于解释物理声波，还考虑了心理和情感因素。这门科学有助于音频工程师理解大脑如何解释各种声音和频率。\n\n### 轮子 (Puck)\n\
  任何由金属、纤维、橡胶等制成的圆形部件，它通过旋转动力源驱动物体。录音室中一个常见的例子是旋转 Leslie 扬声器中的轮子。\n\n### 脉冲编码调制 (PCM)\n\
  将模拟信号转换为数字代码的过程。这是通过在快速的时间间隔对模拟信号的振幅进行采样，然后将其转换为二进制数作为原始信号的数字表示来实现。采样率越高，数字复制效果越好。`PCM`\
  \ 是数字音频中最常见的数模转换形式。\n\n### 每四分音符脉冲 (Pulse Per Quarter Note)\n当你向模块化合成器发送时钟信号（通常是门信号或其他电脉冲）以让序列器移动其步骤等时，了解该时钟的脉冲速度很有用。这通常根据每四音符有多少脉冲来定义——简称为\
  \ `PPQ` 或 `PPQN`。如果时钟只是每四音符发生一次，那么时钟速度就是 `1 PPQN`；在 `DIN Sync`（早期 Roland 合成器中常用的标准，`DIN`\
  \ 是使用的电气连接器类型）或 `MIDI` 时钟的情况下，标准是 `24 PPQN`。这意味着主脉冲可以定义每个八分音符的三连音符（8 x 3）。\n\n###\
  \ 脉冲宽度调制 (Pulse Width Modulation)\n大多数输出方波的振荡器还有一个额外的控制电压输入，用于设置“方”波形顶部部分的宽度（显然，使顶部部分变宽会导致底部部分变窄，反之亦然）。改变产生的脉冲波宽度的行为会产生某种多普勒频；来回改变宽度——例如，通过低频振荡器调制脉冲宽度——会产生一种合唱效果，听起来像是一对未调谐的振荡器。这种效果被称为脉冲宽度调制。\n\
  \n使用控制电压来改变脉冲波形宽的过程，本质上是在方波和脉冲波之间切换。这种处理的效果是产生更丰富的音色，赋予声音更厚实、更丰满的感觉，或者赋予数字声音更多的模拟特性。\n\
  \n### 脉冲 (Pulse)\n脉冲在模块化合成器中有几种不同的含义。当你改变方波的形状，使某一部分比另一部分窄时，它被称为脉冲波（见下方的 `Pulse\
  \ Wave Modulation`）。此外，用作序列器等时钟信号的窄门信号或触发信号通常被称为脉冲。\n\n1) 音乐中基于节奏的稳定节拍，无论是可听的还是感知的。\n\
  2) 一种通常由合成器创建和处理的声波，其波形特点是像方波一样振幅尖剧上升和下降，但其峰值比谷值短，使波具有脉冲感。也称为“脉冲波”（Pulse Wave）。\n\
  \n### 泵吸与呼吸 (Pumping and Breathing)\n在录音室术语中，当压缩器快速压缩和释放声音时产生的效果，导致信号电平产生可见的变化。“泵吸”（Pumping）通常指压缩发生后声音水平的可听增加；“呼吸”（Breathing）是指人声类似的效果，在歌手吸气时提高信号音量。泵吸和呼吸是廉价压缩或过度压缩的标志，通常是不受欢迎的，尽管一些工程师和音乐家偶尔会使用它来创造特定的效果。\n\
  \n### 切点切入/切出录音 (Punch In / Punch Out Recording)\n在播放某段内容期间，激活和/或停用磁带或 DAW 上的录制功能的过程，通常是在表演者演奏/演唱时进行的。这可以作为快速叠加录音（overdubs）的方法，也可以在不从头开始轨道的情况下获得更好的片段效果。\n\
  \n### 纯音 (Pure Tone)\n仅由基础频率组成的声音，没有泛音或谐波，在图上表示为简单的正弦波。\n\n### 频率转电压 (PVC)\n`PVC`\
  \ 代表频率到电压转换。在尝试使用键盘以外的东西（包括触控板）来电压控制合成器的过程中，一些人设计了模块或其他设备，尝试检测音频信号（例如来自吉他、长笛或歌手）的频率，并将其转换为相应的电压，驱动\
  \ `VCO` 与原始声音同步。\n\n### 脉冲宽度调制 (PWM)\n大多数输出方波的振荡器还有一个额外的控制电压输入，用于设置“方”波形顶部部分的宽度（显然，使顶部部分变宽会导致底部部分变窄，反之亦然）。改变产生的脉冲波宽度的行为会产生某种多普勒频；来回改变宽度——例如，通过低频振荡器调制脉冲宽度——会产生一种合唱效果，听起来像是一对未调谐的振荡器。\n\
  \n### PZM\nCrown Audio 压力区域麦克风（Pressure Zone Microphone）的缩写。（另见“边界麦克风”。）\n\n* *\
  \ *\n\nQ –（也称为“Q 值”）\n代表“品质因子”（Quality Factor），定义了受均衡器影响的频率带宽。`Q` 值越低，被增强或衰减的频率带宽曲线就越宽。\n\
  \n\n\n\n\n如果你来自专业音频领域，你可能习惯将 `Q` 指峰值滤波器或陷波滤波器的宽度或狭窄。在合成器滤波器中，当你增加共振（反馈）时，在滤波器曲线或形状的截止频率周围会形成一个峰值。共振越高，这个峰值就越高、越尖锐。因此，有些人曾使用音频术语\
  \ `Q` 来指代共振量，尽管你现在几乎听不到这个术语了。\n\n## 四声道立体声 (Quadraphonic)\n一种现在极少使用的四声道声音系统，通道被指定为左前、左后、右前、右后，旨在从房间的四个角传输声音。四声道立体声是当今环绕声系统的先驱。\n\
  \n## 正交 (Quadrature)\n你可以将波形的一个完整周期定义为 360 度，类似于圆。沿着这个圆移动四分之一处——或者移动到周期性波四分之一处的点——就是\
  \ 90 度。正弦波和余弦波在相位上彼此错开了 90 度，即四分之一的周期。由于这是一个周期的四分之一，因此通常被称为正交关系。\n\n## 量化失真 (Quantization\
  \ Distortion)\n量化失真/量化误差——模拟信号与其采样对应物之间有效的“翻译误差”，这是由于大量的模拟值被舍入到最近的数字量所导致的。这通常会导致声音中产生额外的随机频率，通常听起来像噪声。\n\
  \n## 量化噪声 (Quantization Noise)\n由于量化误差导致信号中的调制噪声。\n\n## 量化 (Quantization)\n1) 在数字音乐中，通过将音符移动到时间轴上的精确位置来调整音乐的节奏表现的过程，实际上是将音符的发生“舍入”到最近的定义增量。\n\
  2) 在模拟转数字转换中，使用相同的数学量化原理将模拟信号转换为较小的阶梯集合（数字量）。\n\n## 量化器 (Quantizer)\n量化器将输入电压自动修正为最接近的预期目标，例如对应于音阶半音或其他音符的电压。这些设备有时被内置在序列器或振荡器等模块中，但很多时候是独立模块。\n\
  \n***\n\n## 机架耳朵 (Rack Ears)\n机架耳朵/机架法——固定在设备上的安装支架，以便将其安装在标准设备机架中。\n\n## 机架式 (Rack\
  \ Mounted)\n描述可以放置在设备机架中的外置设备。\n\n## 机架划痕 (Rack Rash)\n当你将一个模块安装到箱体时，用于安装模块的螺丝钉或螺栓头可能会划伤模块的前面板。这些划痕被称为机架划痕。当你安装模块时几乎永远看不到它，因为划痕在螺丝钉或螺栓头后面，但尽管如此，仍有人愿意为没有划痕的二手模块支付更多费用。所以，买一袋塑料垫圈并将它们放在螺丝钉或螺栓头后面，仅仅是为了消除别人不买你二手模块的另一个理由。\n\
  \n## 机架单元 (Rack Unit)\n机架式设备通常遵循一套标准尺寸，包括 19 英寸（48.3 厘米）宽，以及高度“机架单元”（简称 `U`），每个\
  \ `U` 等于 1.75 英寸（4.4 厘米）。许多常见的模块化合成器格式遵循机架单元系统来标准化模块高度——例如 Eurorack 使用 `3U`（`3 x\
  \ 1.75 = 5.25”` 或 13.3 厘米），Buchla 和 Serge 使用 `4U`，经典模块化 Moog 使用 `5U`（有时称为 Moog Unit\
  \ `MU`）。\n\n## 辐射图 (Radiation Pattern)\n扬声器覆盖范围图形描述。这与麦克风的极性图相似，区别在于极性图描述声音到达麦克风的区域，而辐射图描述声音如何从扬声器扩散。\n\
  \n## 辐射 (Radiation)\n扬声器的覆盖角度和模式。\n\n## 斜坡 (Ramp)\n通常，斜坡是指任何稳定上升或下降的电压；它通常在达到目标电压时重置并重新开始。锯齿振荡器波形有时被称为斜坡。有时，包络生成器的各个阶段也被称为斜坡，因为它从\
  \ `0` 上升到最大水平（例如攻击阶段的 `5v`），然后从此峰值下降到衰减阶段的持续水平。\n\n## 随机存取器 (RAM)\n计算机中的“短期”内存，与处理器配合执行即时任务（与保存和调取项目的硬盘存储内存相反）。在录音室中，计算机拥有的\
  \ `RAM` 越多，处理大量数据的能力就越强（例如在多轨道录音或使用虚拟 MIDI 乐器时）。\n\n## 随机音符生成器 (Random Note Generator)\n\
  一种以设定速率生成随机频率的设备，用于合成器。\n\n## 随机 (Random)\n模块合成器内部移动的大多数电压其变化都是非常有目的的：音频速率或低频振荡器的重复波形；包络生成器上升后下降的电压。然而，具有随机游走的电压也很有用，可以创造从细微的音高变化到剧烈量或过滤的效果。噪声是音频速率随机信号的一个例子。\n\
  \n## 说唱 (Rap)\n在音乐或打击乐表演中执行有节奏的说话部分。\n\n## 稀疏 (Rarefaction)\n声波波谷期间空气颗粒密度的降低；在“压缩与稀疏”的背景下，它是压缩的对面。（另见“压缩”。）\n\
  \n## 步进 (Ratcheting)\n这是使用序列器的一种技巧，其中序列中的一个阶段可能会被快速触发多次，而不是在移动到该阶段时仅触发一次。例如，结果可能是一系列四分音符，取而代之的是爆发的十六音符。\n\
  \n## 速率 (Rate)\n这个词有时用于指低频振荡器或类似功能的频率，例如序列器的时钟。\n\n## 额定负载阻 (Rated Load Impedance)\n\
  设备输入的阻抗或对电流流的阻碍，该设备设计用于供电的对象。\n\n## RCA 插 (RCA Plug)\n（也称为唱片头）大多数音响系统中常见的音频连接器，中心针为一处连接点，外壳为第二个连接点。\n\
  \n## 只读存储 (ROM)\n一种用户无法进行擦除或重新编程的数据存储类型。今天音频/视频设置中最常见的 `ROM` 形式是光介质（如 CD、DVD、CD-ROM\
  \ 和 DVD-ROM）。\n\n## 读取 (Read)\n从存储设备检索信息位；在数字音频中是指数字信号的复制。\n\n## Reason\n来自 Propellerhead\
  \ Software 的流行音乐软件。它提供了硬件合成器、采样器、信号处理器、序列器和调音器的数字等效物。Reason 可以作为一个虚拟音乐工作室，也可以作为一组虚拟音乐乐器，用于现场演奏或与其他序列软件配合使用。\n\
  \n## 换容 (Recapping)\n电子元件会老化。某些类型的电容——特别是用于电源部分的电解电和钽电容——最容易随时间变质；有些人认为电解容器的最大安全寿命为\
  \ 25 年。因此，严肃的古董合成器用户会对他们的旧设备进行“换容”（更换老化电容）。\n\n## 录音头 (Record Head)\n模拟录带机上的设备，将电流变为磁能；磁性的变化与馈送到磁头的音频信号波形匹配。\n\
  \n## 录音电平 (Record Level)\n录带机上的控制，用于确定记录在磁带上的磁通量，或者 DAW 控制用于确定录制到声音文件的数字信号电平。\n\n\
  ## 录音监听 (Record Monitor)\n\n\n\n\n\n*在某些磁带机上，有一个开关位置允许 VU 表格和磁带机电子设备的输出监控磁带机的输入信号。*\n\
  \n### 录制就绪 (Record Ready)\n多轨道磁带录机的一种控制状态，当激活录机的录制功能时，指定的轨道将开始录制。\n\n### 录制总线 (Recording\
  \ Bus)\n一种将控制台通道的混合信号发送到多轨道录音机或 DAW 的总线。（参见“Bus”）\n\n### 录音时 (Recording Session)\n\
  在录音室内录制音乐的时间段。\n\n### 整流器 (Rectifier)\n一种确保电压仅保持正值或负值的电路。在电源设备中，它用于消除交流电压的负分量，或防止你反插模块的电源连接器。作为一个模块，半波整流器只通过正电压，并将任何负电压替换为\
  \ 0v；全波整流器则接受任何负电压并将其反转为正电压。这有效地使倍了许多简单波形（如三角波和正弦波）的频率。\n\n### 红噪声 (Red Noise)\n\
  也称为棕噪声，从技术上讲，它是这类噪声，其功率密度（频谱响度）随频率增加而每倍八度减少 6 dB。它具有浓重的低音，类似于远处的波浪声。它也可以作为缓慢变化的随机控制电压或调制信号，而不是音频源。\n\
  \n### 卷轴 (Reel)\n1) 用于卷绕模拟磁带的轮轴和幅圈；录制和播放涉及将磁带从一个卷轴放开并绕到另一个卷轴上。\n2) 有时也称为“演示带（demo\
  \ reel）”，是一段展示音乐家、音频工程师、演员或其他视听专业人士能力的音频或视频合集。与旨在推销一或多首歌曲的 Demo 不同，演示带是为了推广专业人士的能力而非产品本身。该术语本身是过去这种宣传材料通过卷轴递送的遗留说法。\n\
  \n### 参考电平 (Reference Level)\n1) 一种标准的基准音量，用于测量高于或低于基准的 dB 电平值。\n2) 参见“工作电平（Operating\
  \ Level）”。\n\n### 参考调 (Reference Tone)\n一种单频调（通常为 1000 kHz），用于校准音频设备的电平；用于设置参考电平的调。（参见“测试调（Test\
  \ Tones）”）\n\n### 反射声 (Reflected Sound)\n经过周围表面一次或多次反射到达麦克风或听者的声音。\n\n### 反射 (Reflection)\n\
  在声学中，声波在平面表面上的反弹，与吸收相反。反射对我们感知整体声音的方式影响很大；来自远处的反射声被感知为回声，而混响则由成千上万次的反射产生。（参见“吸收”、“早期反射”、“回声”、“混响”。）\n\
  \n### 再生 (Regeneration)\n在合成器内部，再生可能有几种不同的含义，但都指反馈。回声单元可以将部分输出反馈回输入，导致延迟信号再次重复；这有时被称为再生。此外，非常罕见的情况下，你会听到滤波器中的共鸣被称为再生。\n\
  \n### 稳压电源 (Regulated Power Supply)\n一种为电子设备供电的设备，当更多设备开启或电源线电压变化时，其输出电压不会波动。稳压电源旨在保护敏感电子设备免受破坏性电压浪涌的影响。\n\
  \n### 继电器 (Relay)\n一种电磁激活的开关，当应用控制电压时连接或断开两个端子。\n\n### 释放时间 (Release Time)\n在动态信号处理器中，当输入信号超过设定阈值时，输出信号恢复原始水平所需的时间。\n\
  \n### 释放 (Release)\n这指的是包络的最后一个阶段，通常回落到 0 ，通常导致静音。它通常用于讨论攻击/释放（AR）或攻击/衰减/维持/释放（ADSR）包络发生器的上下文中，但也可以指包络的任何最终阶段。\n\
  \n### 遥控 (Remote)\n1) 一种无线控制另一个设备功能的设备。\n2) 描述现场录制，与在室内录制相对。\n\n### 重置 (Reset)\n\
  模块上的 `Reset` 输入接收触发或门控信号，并告诉模块回到它正在执行的任何操作的开头。在分频器的情况下，这意味着假装下一个时钟是你应该在分频中计数的第一个时钟（在完整定义中会有更多介绍）。在序列发生器的情况下，意味着回到第一阶段。在包络的情况下，意味着回到攻击的开始。在门控延迟的情况下，意味着重新启动计时器。\n\
  \n### 剩磁 (Residual Magnetization)\n在去除磁化力后磁性材料中留下的磁性。剩磁会随着时间的推移在磁带机中积累，产生声音输出的失真和噪声，或部分擦除磁带。\n\
  \n### 残留噪声 (Residual Noise)\n磁带在擦除后留在录带上的噪声水平。\n\n### 电阻 (Resistance)\n物质对电流流的反对，以欧姆为单位。\n\
  \n### 电阻 (Resistor)\n一种具有特定电阻值的电子元件，用于电路内调节电流流。\n\n### 共鸣 (Resonance)\n1) 物理物质在某些频率下以更多能量振动的自然倾向。共鸣原理是声学乐器设计中的关键要素；例如，吉他或小提琴的空腔被设计为与琴弦的振动产生共鸣。共鸣在空间声学设计中起着作用，甚至在开发良好的投影声音的人声技巧时也起着作用。\n\
  当滤波器的输出反馈到其输入时，结果是滤波器截止频率或角频率附近的谐波增强。听觉上的结果类似于在具有共鸣的房间里播放声音——在特定频率下的感应、增强回声或振动。因此，共鸣一词通常用于指滤波器的反馈量。\n\
  \n### 共振频率 (Resonant Frequency)\n物体自然振动的频率。\n\n### 共振 (Resonate)\n以共振频率振动。也指声源停止后持续的残留混响。这种持续的声音由于周围物体的感应共振。\n\
  \n### 共振器 (Resonator)\n许多声学乐器包含一个能“共振”（感应振动或增强）一个或多个频率的体或腔。为了在模块合成器中模拟这种效果，可以使用特殊的滤波器或均衡模块，它会增强三个或几个用户定义的频率，每个频率通常在一个窄带内。这是合成现实声音或空间的秘密之一。\n\
  \n### 混响 (Reverb)\n1) “Reverberation”的缩写。（参见“Reverberation”）\n2) 一种为信号创建人工混响的处理器或插件。\n\
  \n### 混响时间 (Reverb Time)\n声源停止后，混响或回声消失所需的时间。具体而言，混响时间测量的是声源停止点到混响水平下降 60 dB 的点之间的时间。\n\
  \n\n\n\n\n混响（Reverberation）的缩写。这种效果设备模拟了处于房间内的感觉，在房间里，你可以听到原始声音在墙壁上多次反射，在声音的海洋中回荡，直到最终衰减为寂。混响可以极大地增强合成器的声音，为原本可能单调的声音增添华丽感和维度。实现混响效果的模块相对较少，允许你通过电压控制某些参数的模块更少（`ErbeVerb`\
  \ 是最著名的）；许多模块仅使用外部混响效果。\n\n### 混响场 (Reverberant Field)\n描述距离声源足够远的空间，混响声大于直接声。\n\
  \n### 混响室 (Reverberation Chamber)\n用于模拟房间反射的设备。\n\n### 混响包络 (Reverberation Envelope)\n\
  混响音量的起始（Attack）、衰减（Decay）、持续（Sustain）和释放（Release）；或者混响达到峰值的速度及其衰减率。\n\n### 混响 (Reverberation)\n\
  声源停止发射后声音持续现象，由于许多离散的回声在时间上非常紧密地到达耳朵，以至于耳朵无法区分它们。\n\n### 射频干扰 (RF Interference)\n\
  由于 `RF` 信号的存在引入电子设备、电路和/或音频系统的意外噪声。系统中的 `RF` 干扰会导致嗡嗡声、滋滋声、静电甚至播放广播传输。\n\n### 射频信号\
  \ (RF Signals)\n`RF Signals`（或 `RF`）——无线频信号的缩写，携带无线广播和电视信号的电磁波。大部分射频信号的频率高于 `100\
  \ kHz`。\n\n### 节奏组 (Rhythm Section)\n乐队或合奏中负责演奏节奏而非旋律部分的乐器。在当代音乐中，节奏组通常由鼓和贝斯组成，并结合打击乐、钢琴/键盘和/或吉他的组合。\n\
  \n### 丝带控制器 (Ribbon Controller)\n这是一个长条，能够测量你沿着长度按压的位置以及按下时使用的压力。它可以作为替代键盘或音高控制器，由位置决定音高。较短的版本有时也作为合成器上的替代控制器出现，例如\
  \ `Yamaha CS-80`。\n\n### 丝带麦克风 (Ribbon Microphone)\n一种通过位于磁极之间的细导电丝带将声波转换为电流的麦克风。丝带麦克风几乎总是对丝带两侧的声音都有反应，创建出双向或字\
  \ 8 形图型。\n\n### 乐句 (Riff)\n曲子中反复播放的短旋律，通常在人声行之间会有变化。\n\n### 环形调制器 (Ring Modulator)\n\
  平衡调制或环形调制是一种特殊的幅度调制，其中一个双极信号（在 0 伏上下之间摆动）——调制器——被用来改变第二个双极信号（称为载波）的幅度。调制器的频率既加到载波频率上又减去载波频率；产生的谐波取代了原始的载波和调制器。\n\
  \n### 房间除鸣 (Ringing Out a Room)\n识别并补偿房间内问题频率的过程，其目的是优化该空间内的现场音频。这通常通过向扬声器发送粉红噪声、增大麦克风音量直到产生反馈，并使用\
  \ `EQ` 消除引起问题的频率来实现。\n\n### 上升时间 (Rise Time)\n音频波形突然增加到较高幅值的速率。\n\n### RMS 表 (RMS\
  \ Meter)\n一种识别并响应交流波有效平均值（即 `RMS` 电平）或交流波有效平均值的仪表，而不是响应峰值电平。（另见“均方根”、“峰值表”。）\n\n\
  ### 衰减 (Roll Off)\n当信号频率远离截止频率时，信号电平的降低，特别是当截止率较缓时。\n\n### 房间均衡 (Room Equalization)\n\
  在现场音频中，插入监听监听系统中的均衡器，试图补偿由房间声学引起的频率响应变化。\n\n### 房间音色 (Room Sound)\n房间的自然氛围，包括混响和背景噪声。\n\
  \n### 房间环境音 (Room Tone)\n在没有音乐播放或人说话的情况下房间内的自然背景噪声。在为电影和电视录制音频时，现场录音师会捕捉一段环境音，以便在后期制作的对话片段之间提供连续性。\n\
  \n### 均方根 (Root Mean Square, RMS)\n交流波的有效平均值。用于衡量声音的整体水平，而不是仅仅通过峰值进行测量。（另见“RMS 测量”、“峰值测量”。）\n\
  \n### 旋转磁头 (Rotating Head)\n一个带有两个（或更多）间隙的圆形头部，它相对于磁带运动方向以微小角度旋转。\n\n### 隆隆 (Rumble)\n\
  一种低频噪声，通常由地面/地板震动或录音机或播放单元驱动机构中的不平整表面引起。\n\n### 节奏轨道 (Rythm Tracks)\n音乐制作中节奏乐器的录音。\n\
  \n***\n\n### S-触发器 (S-trig)\n某些系统——例如原始的 `Moog modular`——使用 `s-trigger`（开关触发或短路触发）而不是普通的门信号（gate），门是一种短路到\
  \ `0` 伏地的地的线，就像连接到地的开关关闭一样。在没有进行某种形式转换的情况下，你无法连接这两个系统，这种转换可以简单如一根特殊的电缆。\n\n### 采样保持\
  \ (S/H)\n采样保持（`S/H`）模块有两个输入：一个正在被采样的信号，和一个指示何时应采样第一个输入的触发输入。当接收到触发时，第一个输入当前的电压被采样（测量）并保持（存储），然后从输出。这个稳定的电压将一直保持，直到接收到新的触发。采样保持通常与创建阶梯随机电压有关。为了做到这一点，向主输入噪声；每当接收到触发时，输入处的电压就是某个随机值，然后被忠实地发送到输出。\n\
  \n### S/PDIF\n`Sony/Phillips Digital Interface`（索尼/飞利浦数字接口）的缩写，一种使用常用 RCA 连接器发送和接收数字音频的协议。\n\
  \n### 安全备份 (ST)\n在质量合格的轨道后，额外录制的音频。\n\n### 萨伦基 (Sallen-Key)\n`Sallen-Key` 滤波器拓扑或设计创建一个二阶或双极低、高或带通滤波器，并具有高共振或\
  \ Q 值。这种设计用于 `Korg MS-20` 滤波器及其克隆版本。\n\n### 采样保持 (Sample & Hold)\n采样保持（`S/H`）模块有两个输入：一个正在被采样的信号，和一个指示何时应采样第一个输入的触发输入。当接收到触发时，第一个输入当前的电压被采样（测量）并保持（存储），然后从输出。这个稳定的电压将一直保持，直到接收到新的触发。采样保持通常与创建阶梯随机电压有关。为了做到这一点，向主输入噪声；每当接收到触发时，输入处的电压就是某个随机值，然后被忠实地发送到输出。\n\
  \n### 采样数据标准 (SDS)\n`Sample Dump Standard` (`SDS`)——另见“MIDI 采样数据标准”。\n\n### 采样率转换\
  \ (Sample Rate Conversion)\n在不先将信号转换为模拟的情况下，将一个采样率的数字音频转换为另一种采样率。\n\n### 采样率 (Sample\
  \ Rate)\n这是数字音频的一个规格：重建声音的单个测量值（采样）记录或播放的速度。该音频文件的带宽（对应于复制的最高频率）在实际上略小于采样率的一半。\n\
  \n\n\n\n\n在数字录制中，每秒采样的次数。采样率越高，声音的数字再现就越真实，能够再现的高频也越高。在数字音频中，数字再现声音的质量和分辨率被描述为采样率和比特率的结合。（另见“比特率”）。\n\
  \n### 采样 (Sample)\n1) 在数字录制中，在给定时间时刻波形电平的数值测量。模拟音乐通过快速连续采集的许多采样以数字形式表示。\n2) 为了对声音进行数字再现和处理而录制的短音频段。\n\
  \n### 采样器 (Sampler)\n一种用于录制和播放采样的设备，通常具有编辑、处理和存储采样的功能。\n\n### 饱和 (Saturation)\n\
  从简单层面来说，饱和是“削波”（clipping）的一个风雅说法：一旦输入电压高于（或低于）电路能够处理的范围，它就会被保持在该限制上。然而，饱和通常意味着对这种削波限制采用更圆润、更有形状的处理方式，从而产生更悦耳（或至少不那么烦人）的失真。电子管电路通常与这种软削波行为相关，尽管它可以在其他电路甚至数字信号处理中进行模拟。人们可能会为了特定的音色特征而寻找不同的设备。\n\
  1) 磁带因声音电平过大而达到完全磁化的点。这会产生一些失真，一些音频发烧友将其描述为“模拟温暖感”，这在某些情况下是一种理想的品质。\n2) 声音信号通过电子管放大器或前置放大器过度驱动而产生的音频失真——同样在声音中产生了色彩和温暖感，工程师们通常认为这种效果很有吸引力。\n\
  3) 一种模拟磁带或电子管饱和的数字插件。\n\n### 锯齿波 (Sawtooth Wave)\n一种在每个周期内都从零值跳到峰值值，然后立即掉回零值的波形。（有时也称为“坡波”）。\n\
  \n### 锯齿 (Sawtooth)\n合成器产生的最常见的波形之一。这种坡度形的波形包含了偶次和奇次谐，在基频（正在播放的音符）处最强，在高频处逐渐减小。其结果是非常明亮、响亮且具有“铜管感”的声音。\n\
  \n### 施密特触发器 (Schmitt Trigger)\n这是一种门限检测器，它观察变化的输入信号并输出“高”（通常为 0、10 甚至 15 伏）信号或“低”信号（通常为\
  \ 0 伏）。当输入超过一个参考阈值——例如 4 伏时，输出变为高电平。当输入回到第二个不同的阈值以下——例如 1 伏时，输出回到低电平。\n\n### 示波器\
  \ (scope)\n这是一种以图形波形形式显示电压波动的测试设备。示波器可以在宽的频率范围内运行，显示缓慢变化的电压（如 `LFOs` 或包络），或快速变化的电压（如振荡器和噪声）。示波器曾是笨重的外部设备，但现在你可以获得将显示部分工作交给电脑的\
  \ `USB 示波器`，或者作为模块的示波器。\n\n### 粗稿 (Scratch)\n1) 一个表示“临时的”的描述性词汇。\n2) 粗稿人（scratch\
  \ vocal）是指在基础录音期间完成的人声，用于帮助音乐家演奏他们的部分。在稍后的日期，会覆盖录制最终的人声轨道。\n3) 音乐家或唱片发行师在唱片机上来回移动唱片的动作，复制唱针的运动以创建一种节奏感声音模式。\n\
  \n### 倒带 (Scrubbing)\n在监控的同时将录制的音频来回往复移动的操作或功能，通常用于定位录音中的某一点。在早期，倒带是通过开盘式模拟磁带完成的，通过手动旋转卷轴使磁带穿过播放头来实现。今天，倒带主要在\
  \ `DAW` 上通过数字方式完成，通过拖动光标来回移动。\n\n\n\n\n\n### 架式 (Shelf)\n均衡电路的一种频率响应，其频率的增益或衰减在频率响应图上形成一个“架式”形状。高频架式控制影响设定频率及其以上所有频率的信号电平；低频架式则对设定频率及以下的所有信号具有相同的作用。\n\
  \n### 屏蔽 (Shield)\n电缆内部单根或多根线周围的外部导电包裹，用于防止电缆吸收外部电磁干扰。\n\n### 屏蔽线 (Shielded Cable)\n\
  在内部导体或多个内部导体周围带有屏蔽层的电缆。\n\n### 避震架 (Shock Mount)\n麦克风支架上的弹性支座，用于减少可能影响支架的意外震动影响（例如脚步引起的地面震动）。\n\
  \n### 短路 (Short Circuit)\n电路中两个（通常）不应连接的点之间的直接连接。\n\n### 短延迟 (Short Delay)\n小于 20\
  \ 毫秒的延迟时间。\n\n### 最短路径 (Shortest Path)\n录音中的技术，使信号在录音过程中通过最少数量的（放大）设备。\n\n### 枪式麦克风\
  \ (Shotgun Microphone)\n一种带有长滤波器管的麦克风，该管能在声学上消除从侧面到达的声音，使麦克风对某一方向的采集远优于任何其他方向。这使得枪式麦克风具有紧凑的超心形指向模式。枪式麦克风常用于电影现场的对话录制，通常安装在带有避震架的吊杆上。\n\
  \n### 嘶音 (Sibilance)\n集中在 7 kHz 左右的语音能量，由发出的“s”、“sh”或“ch”音引起。\n\n### 侧链 (Sidechain)\n\
  信号处理器的辅助输入，允许由外部源触发处理控制。侧链的一个常见用途是压缩器，特别是在闪避效果（ducking effects）中，即特定音频信号的存在会触发另一个音频信号的压缩。（参见“闪避效果”。）\n\
  \n### 信号流 (Signal Flow)\n1) 广义上，音频信号从声源到系统输出的传输路径。（例如，从歌手的声音进入麦克风，通过电缆进入前置放大器，从前置放大器输出到调台，经过所有插入和总线，最后输出到\
  \ DAW 进行录制。）\n2. 信号流通常特指音频信号通过调台从输入到输出的路由方式。\n\n### 信号处理 (Signal Processing)\n通过各种设备或插件（如均衡器、压缩器、混响单元等）改变音频信号特征或声音的做法。\n\
  \n### 信噪比 (Signal to Noise Ratio, SNR)\n信号电平强度与设备发射噪声量之间的比较，以 dB 为单位。\n\n### 信号\
  \ (Signal)\n1) 在音频中，与声压波匹配或最初从声压波获得的交流电（或电压）。\n2) 同样在音频中，20 Hz 到 20,000 Hz 之间的交流电（或电压）。\n\
  3) 数字音频比特流。\n\n### 正弦波 (Sine Wave)\n1) 广义上，音频信号从声源到系统输出的传输路径。（例如，从歌手的声音进入麦克风，通过电缆进入前置放大器，从前置放大器输出到调台，经过所有插入和总线，最后输出到\
  \ DAW 进行录制。）\n2. 信号流通常特指音频信号通过调台从输入到输出的路由方式。\n\n### 正弦 (Sine)\n这是最纯净的波形：它只包含基波，没有高次谐波。因此，它是创建次低音踢鼓或其他纯净鼓声的极佳波形；在探索诸如频率调制（FM）、幅度调制（AM）或波折（会添加或移动谐波内容）技术时，这也是很好的源波。\n\
  \n### 啪回声 (Slap Echo, 也称为 Slapback)\n声音的单一、清晰的回声，可以由于高频在非吸收性墙面上的反射自然产生，也可以通过信号处理单元或插件人工复制。啪回声会创造出一种“现场感”的效果，类似于你在场馆中听到的声音。\n\
  \n### 场板 (Slate)\n场板（拍板）—— 1) 在视频/电影中，在片段开头识别场景（scene）和镜头（take），用于视频剪辑。这是通过在摄像机前的拍板上书面形式展示场景/镜头，口头报出场景/镜头，然后通过响板的声音进行标记，以便将音频与视频同步。\n\
  2) 在音频录制中，类似的做法是在录制轨道开头通过听觉提示来识别音乐镜头。虽然有些工程师仍然坚持这种做法，但在模拟磁带录制时代，这是必要的，因为可以帮助编辑人员跟踪录音机上镜头的标记。今天，DAW\
  \ 通过在屏幕上视觉化识别每个镜头使跟踪变得更容易。\n\n### 从机 (Slave)\n1) 在音频中，任何通过读取主设备发射的时钟信息来同步到另一个设备的设备。\n\
  2) 在 MIDI 中，任何通过从另一个设备发送的 MIDI 信息进行远程操作的设备或乐器。\n\n### 速率限制器 (Slew Limiter)\n该功能平滑输入信号，使电压电平的变化每秒不能超过特定的伏数。因此，它有时被称为延迟发生器或处理器，或者在技术上更称为积分器。\n\
  \n### 滑动轨道 (Sliding Rails)\n这是一种将模块安装到机箱中的常用系统，模块连接的轨道包含槽位而不是孔。若干个螺母插入这些槽位中，然后可以滑动到任何位置，以适应你的模块的安装孔间距。在\
  \ Eurorack 机箱中，这些螺母通常具有 2.5mm 或 3mm 的孔和相应的螺纹。\n\n### 斜率发生器 (Slope Generator)\n斜率发生器产生斜坡：上升或下降的电压。它本质上是将门发生器和速率限制器（见上文）焊接在模块中。斜率发生器的常见示例是攻击/衰减（AD）或攻击/释放（AR）包络发生器。\n\
  \n### 斜率 (Slope)\n大多数滤波器通常有一个调谐的截止频率。它会减少通过滤波器的信号的频谱，使得谐波越远离该截止频率，声音越小。这种效果的强度被称为其斜率。大多数滤波器的斜率定义为每离开截止频率一个倍频就减弱\
  \ 6 分贝（dB）。例如，斜率为 24 dB/倍频的低通滤波器（LPF）会使其截止频率上方一个倍频的谐波衰减 24 分贝。\n\n### 智能 FSK (Smart\
  \ FSK, 频率移频)\n智能 FSK —— 移频（FSK）同步的更新形式，使 MIDI 设备能够同步到模拟录带机和/或记录设备。带有 MIDI 歌曲指针（SPP）数据的数字信号被编码到空轨道上，标识\
  \ MIDI 序列器在录制中任何点的精确小节、小节和拍。这使得无论从磁带的哪里开始，设备都能在正确的位置播放。\n\n### SMPTE 时间码 (SMPTE\
  \ Time Code)\n（缩写“SMPTE”）由电影电视工程师学会创建的标准计时同步信号协议，用于将音频与视频同步，也可用于音频录制环境中的同步。许多音频专业人士简单将这种时间码称为“SMPTE”。\n\
  \n### SMPTE\n1) 电影电视工程师学会。\n2) 参见“SMPTE 时间码”。\n\n### 军鼓 (Snare)\n1) “snare drum”（小军鼓）的缩写。\n\
  \n\n\n\n\n### 2) 跨越军鼓底部的金属丝，它们有助于在击打军鼓时产生尖锐的“啪啪”声。\n\n### 袜子踩��片 (Sock Cymbal)\n\
  “Hi-hat”（��片）的一个较少使用的替代术语，源于踩��片被放置在“脚踝高度”的时代。（参见“Hi-Hat”。）\n\n### 软拐 (Soft Knee)\n\
  在压缩中，指一旦声音电平超过阈值，逐渐引入对信号的压缩。（参见“Knee”。）\n\n### 软件乐器（虚拟乐器）（Software Instrument）\n\
  许多基于软件的合成器、采样器或声音样本之一，它们通过计算机存储和访问，并由外部 `MIDI` 控制器演奏，而不是在独立的合成器或模块中运行。由于这些乐器具有极大的通用性，越来越多的作曲家和电子音乐人开始使用存储在硬盘中的虚拟乐器，而不是购买一堆键盘和模块。\n\
  \n### 焊接 (Soldering)\n使用焊锡进行连接的行为，焊锡是一种软金属合金，通过熔化来结合两个金属表面。在音频设置中，焊接用于构建、修改或维修设备的各种目的——最常见的可能是为了节省成本而维修或制作音频电缆，而不是购买新电缆或将其送去维修。\n\
  \n### 固态 (Solid State)\n在电子设备中，指在制造电子设备时使用晶体管和半导体（固体材料），而不是电子管。在录音室中，固态放大器具有与电子管放大器不同的特性，且各有其优缺点。固态结构的一个较新的应用是于计算机设备，特别是固态硬盘（`SSD`），它们比传统的旋转式硬盘硬盘传输数据更快，且更不易损坏。\n\
  \n### 独奏开关 (Solo Switch)\n一种在控制台或 `DAW` 上激活独奏功能的开关。\n\n### 独奏 (Solo)\n1) 控制台或 `DAW`\
  \ 中的一种电路，允许一个或多个选定的通道被听到或到达输出，而其他通道自动静音。\n2) 在音乐中，指歌曲中的某一段，歌唱或乐器在其他乐器之上突出。\n\n###\
  \ 歌曲位置指针 (SPP)\n一种 `MIDI` 消息，允许连接的 `MIDI` 设备定位歌曲中的给定点。通常与 `MIDI` 时钟配合使用，用于同步设备或告诉连接设备何时开始播放。\n\
  \n### 隔音毯 (Sound Blanket)\n一种可以铺在地板或悬挂的厚毯子，用于增加房间的吸音，并帮助防止声音反射。\n\n### 音效 (SFX)\n\
  音频中除对话、旁白或音乐之外的声音，通常出现在电影/视频中。\n\n### 音频文件 (Sound File)\n可以存储在计算机或数字存储介质（如硬盘）上的数字音频记录。\n\
  \n### 声音建模 (Sound Modeling)\n一种在不直接模拟物理设备的情况下重建声音的技术。例如加法合成法，它使用正弦波和噪声的组合来重建声音。\n\
  \n### 音色模块 (Sound Module)\n一种电子乐器（音调器、合成器或采样播放单元），它没有可演奏的界面，而是对输入的 `MIDI` 消息做出响应。音模块通常被创建作为流行合成器的“大脑”，即该产品的廉价版本，可以添加到现有的\
  \ `MIDI` 配置中。今天，音模块也可以以软件版本或插件的形式在计算机上访问。\n\n### 声压级 (SPL)\n在科学/技术术语中，测量声波引起的空气压力变化，单位为\
  \ `dB`。我们通过幅度、音量或响度来听到和感知 `SPL`。\n\n### 声压级 (Sound Pressure Level)\n在科学/技术术语中，测量声波引起的空气压力变化，单位为\
  \ `dB`。我们通过幅度、音量或响度来听到和感知 `SPL`。\n\n### 声源 (Sound Source)\n声音的起源，其振动产生声波。\n\n###\
  \ 声波 (Sound Wave)\n（也称为“声压波”）由振动引起的波，导致空气压力发生微小变化，我们听为声音。\n\n### 原声带/配乐 (Soundtrack)\n\
  1) 广而言之，指随视觉媒体的任何/所有音频，无论是音乐、对话还是 `SFX`。\n2) 在更常用的术语中，指与电影、视频、电视节目或视频游戏同步的配乐和或授权音乐。\n\
  \n### 不确定性源 (Source of Uncertainty)\n这是 `Buchla 265` 和 `266` 模块的名称，用于产生随机控制电压。它的名称经常用于遵循或受原始\
  \ `Buchla` 模板启发的随机源模块。\n\n### 间距对 (Spaced Pair)\n（也称为“A/B 技术”）一种立体声麦克风放置技术，将两个心形或全指向性麦克风放置在\
  \ 3 到 10 英之间的范围内（取决于声源的大小），以创建左/右立体声场。\n\n### 扬声器 (Speaker)\n将电信号转换为声音的设备；更技术地说，这是一种将电音频信号转换为声压波的换能器。\n\
  \n### 声速 (Speed of Sound)\n通常来说，声波穿过介质所需的时间。声音在固体、液体和气体中的传播速度不同，尽管我们通常认为声音是在空气中传播的，但温度、气压和湿度的差异也会影响声音传播的速度。作为一个起始参考框架，声速通常由航空航天工程师定义为“马赫\
  \ 1.0”，相当于每秒 340.29 米（约每秒 761.1 英里，或每秒 1116 英尺），这是 15 摄氏度（59 华氏度）的海平面空气中声音传播的速度。相比之下，在标准大气条件下的\
  \ 70 华氏度下，声速约为每秒 344 米，或每秒 770 英里。\n\n### 剪辑 (Splicing)\n在历史上，是指通过应用特殊的胶带将之前切好的音频磁带或胶片精确地连接在一起。这样做是为了缩短音频片段。今天，剪辑已通过在\
  \ `DAW` 中数字编辑变成一个非常简单的过程。\n\n### 分路器 (Splitter)\n简单定义是指可以将信号划分成两个或多个副本的设备，例如两个输出连接到一输入的分路电缆。要深入讨论，请参见多路（multiple），因为除了简单的接线外还有其他方法。\n\
  \n### 扩散 (Spread)\n一些振荡器模块可以同时产生多个音调。对这些音调进行微调调或“扩散”会产生通常令人愉悦的调制效果。根据模块的不同，你甚至可以扩散这些音调来形成音程、三和和和弦。\n\
  \n### 弹簧混响 (Spring Reverb)\n一种设备通过将弹簧连接到换能器上并发送音频信号，在弹簧内部产生振动来模拟混响。另一端的拾音器将这些振动转换为电信号，与原始音频信号混合。虽然物理弹簧混响仍然存在，但大多数录音室使用插件或硬件混响单元模拟弹簧混响。\n\
  \n### 方波 (Square wave)\n这是合成器振荡器产生的一种常见波形。它在高电压和低电压之间切换（音频振荡器通常为 +/-5 或 8 伏；低频振荡器有时在\
  \ 0v 和正电压之间变化）。除了是模拟电路很容易生成的波形外，它具有有趣的谐波序列：它有一个强基频，然后是逐渐减弱的奇次谐波：基频三倍的分量、五倍的分量，依此类推。与具有既奇次和偶次谐波的锯齿波相比，结果是产生更开阔、更空洞的声音。\n\
  \n\n\n\n一种波形，其中电压瞬间上升到一个电平，在该电平保持一段时间，瞬间下降到另一个电平并保持，最后瞬间回到原始电平以完成波形周期。\n\n### 可堆叠电缆\
  \ (Stackable Cable)\n许多香蕉插头电缆的每个插头背部都内置了一个插座，允许你直接在原始插头上方插入另一根电缆。这些用于兼容 Buchla 和\
  \ Serge 的系统。TipTop 使用了一种类似的适用于 3.5mm 插头和插座的 Eurorackget 电缆，称为 Stackables。\n\n###\
  \ 舞台监听器 (Stage Monitor)\n位于舞台上的扬声器，让表演者听到自己的声音以及舞台上其他音乐人的的演奏声。\n\n### 阶段 (Stage)\n\
  1) 现场音乐家表演的半封闭或抬高的区域。\n\n2) 在混响效果设备中，在混响之前添加的回声，用来模拟来自音乐会舞台的回声。\n\n从最通用的术语来说，阶段（stage）是指一系列变化中的下一次电压变化。例如，在一个\
  \ 8 步步序器中，它按顺序产生的每一个新音符都是一个阶段。在像 ADSR（攻击/衰减/维持/释放）这样的包络生成器中，每个相位——例如攻击阶段，包络通常从 0\
  \ 伏上升到其能输出的最高电压——都是一个阶段。你可能还会听到它用于描述 BBD（桶形延迟）中的采样阶段，这在文中另有描述。\n\n### 标准工作水平 (Standard\
  \ Operating Level)\n正常操作中不应超过的参考电压电平或最大平均水平。\n\n### 驻波 (Standing Wave)\n一种不必要的声波模式，通常当声波在房间内两个平行的反射表面之间反射时发生，反射波与来自声源的初始波产生干涉，导致受影响频率的组合波长实际上等于房间的长度。这产生了一种波静止的听觉幻象，导致频率在房间的某些部分被放大到不理想的水平，而在另一些地方几乎消失。驻波在具有平行平面的正方形或矩形房间中最常见，因此声学设计师试图通过安装吸收材料或引入其他物品来抵消平行表面，防止这些波的产生。\n\
  \n### 步进模式 (Step Mode)\n步序器或数字音频工作站（DAW）中的一种设置，手动逐个输入音符（或步骤）。\n\n### 步进步序器 (Step\
  \ Sequencer)\n这通常指一种步序器，你移动到一个阶段并暂停，输入该阶段的音符（可能还有持续时间），移动到下一步，以此此类推。\n\n### 步骤 (Step)\n\
  Step 通常与 stage（见上）通用，特别是在讨论步序器时。\n\n### 声声场 (Stereo Image)\n对立体声的听觉感知，其中不同的声源似乎来自极左、极右或中间的任何地方。\n\
  \n### 立体声录音 (Stereo Micing)\n放置两个或多个麦克风，使它们的输出组合以创建一个立体声场。\n\n### 立体声 (Stereo)\n\
  至少两个通道的录制或再现，可以感知乐器声音从左到右的定位。\n\n### 触发 (Strike)\n这个术语出现在几个 Make Noise 模块上，尽管它正逐渐进入通用术语。某些使用或模拟光电传输（一种放置在\
  \ LED 等光源旁的光敏电阻，允许将电压转换为电阻以控制参数）的滤波器、放大器和低通门（LPGs）可能有一个 strike 输入。当你用 LED 闪烁光敏电阻时，电阻不会瞬间改变并保持在在那里——相反，在它滑向目标电阻的过程中会有一些延迟。当你关闭\
  \ LED 时，电阻可能不会瞬间恢复到满值；相反，它可能需要短时间来衰减。这些特性对于创建打击性声音和攻击（attacks）非常有用。strike 输入的目的是通过一个极短的脉冲，或者允许你在\
  \ LED 保持开启的情况下进行再次攻击（re-attack）。\n\n在录音结束后收拾设备并清理现场。\n\n### 子代码 (Subcode)\n随数字音频一同录制的额外信息位，用于控制和播放目的。\n\
  \n### 子帧 (Subframe)\nSMPTE 码中比一帧更小的单位。\n\n### 子组 (Subgroup)\n控制台上的若干个输入通道，在将组合信号发送到主输出之前，可以作为一个整体进行控制和调整。有时也称为“Submix”（子混）、、“Bus”（总线）或简单的“Group”（分组）。\n\
  \n### 次谐波 (Subharmonic)\n一种将输入声音的基础谐波划分以产生较低频率（从而产生次谐波）的电路。最常见的是八度分频器或次低音电路，通过将基础频率除以\
  \ `2` 来产生次谐波（有些也可以通过除以 `4` 创建比基础频率低两个八度的次谐波）。\n\n### 副主母 (Submaster / Sub-Master)\n\
  在混音或录音期间控制多个通道组合声音水平的推子。\n\n### 子混 (Submix)\nSubmix – 参见“Subgroup”（子组）。\n\n### 次八度\
  \ (Suboctave)\n一种模块，它创建一个位于输入声音的基础谐波（即“音高”）下方一个或两个八度的新音调，以强调低音。（次谐波在本词表其他部分有详细讨论。）这种音调通常是方波，尽管某些巧妙的模块可能会创建更像正弦波的或更接近原始波形的东西。\n\
  \n### 减法合成 (Subtractive Synthesis)\n最常用的合成技术：你从一个或多个输出具有大量谐波波形的振荡器开始，然后将此混合通过滤波器，移除一些谐波以创建所需的声音或音色。这种修改后的音调随后发送到放大器，通过改变其音量为音符增加清晰度。\n\
  \n一种老派的音频合成方法，通过产生谐波丰富的波形来设计和创建声音，然后过滤掉不必要的谐波以得到所需的声音。\n\n### 求和 (Sum)\n“Sum”是一种高级的说法，表示你将两个（或多个）东西相加；总和就是结果。它通常用于控制电压的语境，尽管也可以用于音频甚至谐波混合。相反的是差分（difference），即从一个输入减去另一个。\n\
  \n两个立体声通道的相等且相位相同的混合信号。\n\n### 混合 (Summing)\n将两个或多个信号混合为一个混合信号的过程。在音频混合中，每个后续通道都会为总信号增加量，因此必须按顺序混合以防止过载。\n\
  \n### 超心形模式 (Super-Cardioid Pattern)\n一种非常窄的心形麦克风模式，轴线灵敏度最高，离轴 150 度灵敏度最低。\n\n###\
  \ 环绕声 (Surround Sound)\n一种录制和再现技术，听者可以从前、后以及两侧听到声音的各个方面——一个 360 度的音频像，而不是标准的立体声左右像。环绕声可以通过各种格式实现，房间内布置不同数量的扬声器。环绕声今天最用于电影和电视制作。\n\
  \n### 维持 (Sustain)\n这是包络生成器的一个常见阶段，其中电压（通常发送到滤波截止频率或放大器电平）在音符被按住时保持恒定水平。音符被按下的知识通常由门信号提供，只要音符被按住，信号就保持高电，尽管某些包络生成器可能会有专门的时间控制来决定维持阶段持续多久。包含维持阶段的包络包括\
  \ ADSR（攻击/衰减/维持/释放）和 AR（攻击/释放，通常假设有一个维持阶段）。\n\nSVF\n\n\n\n\n\n### SVF\n状态变量滤波器（SVF）是合成器滤波器中一种常见的设计。这种设计允许低通、高通和带通滤波器同时可用。另一个副作用是，它们在\
  \ във反馈（共振）设置较高时，不容易发生发生震荡，尽管某些设计显然已经找到了实现这一点的方法。Oberheim SEM（合成器扩展模块）滤波器可能是最著名的状态变量滤波器设计。\n\
  \n### Sweetening（音色甜化/后期润色）\n一个模糊的术语，指在录音的后期制作阶段对音频进行的精细调整。实际上，任何为了让音频听起来更好听的细微“微调”都被视为甜化。\n\
  \n### Switch Trigger（开关触发）\n某些系统——例如原始的 Moog 模块合成器——使用 `s-trigger`（开关触发或短路触发）而不是普通的门信号（gate）。门信号是一种短路到\
  \ 0 伏地的导线，就像连接到地地的开关关闭一样。在不进行某种形式转换的情况下，你无法将这两个系统连接起来，这种转换可能仅仅是一根特殊的电缆。\n\n### Switch（开关）\n\
  一种接通和或断开电气连接的设备。\n\n### Switchable Pattern Microphone（多极性切换麦克风）\n具有两种或多种采集极性的麦克风，可以通过麦克风上的开关进行切换。\n\
  \n### Switching Power Supply（开关电源）\n开关电源通过直接将输入的高压交流信号转换为高压直流信号开始。然后它们通过快速切换输出的开启和关闭来获得较低的平均输出电压。随后对该开关电压进行平滑处理，产生所需电压的恒定直流电源。开关电源通常更轻、更凉、更便宜，但代价是噪声往往更高——包括输出电压噪声和射频噪声（这就是为什么它们通常被屏蔽罩包围）。许多电源正在转向混合电源，将开关器与小型线性电源或稳压器结合，以兼顾两者之长。\n\
  \n### Sync Pop（同步脉冲）\n一个短音调（通常是 1 kHz 的正弦波，长度为一帧），精确放置在电影或音乐开始前两秒处。同步脉冲用于确保所有相关的音频和视频轨道在后期制作的所有阶段都保持同步。\n\
  \n### Sync24\n`Sync24` 是 Roland 创建的标准 DIN Sync 的另一种名称，它以当前速度下每四分符 24 个脉冲的速度发送时钟信号。Korg\
  \ 设备使用了它的变体，运行速度为每四分符 48 个脉冲，被称为 `Sync48`。\n\n### Sync（同步）\n同步有两个含义，取决于我们指的是振荡器还是时钟信号。某些振荡器支持一种模式，当接收到另一个振荡器的信号时，将其波形重置为起始。如果两个振荡器之间没有精确的八度关系，结果是一个过早重置的修改波形，遵循第二个振荡器的频率。你可以通过调制从振荡器的频率来创建一些非常酷的“撕裂”声；一个简单的\
  \ `AD` 包络效果很好。在计时方面，当你同步序列器或鼓鼓点构型时，通常会在模块系统周围发送一个主时钟或同步信号，供所有相关模块跟随。这通常是一个门信号或触发信号。\n\
  \n“Synchronization”（同步）的缩写。在音频/录音室环境中，同步指的是两个多个音频或视频片段之间的关联。这可以包括同步两个相对于 `SMPTE\
  \ 码` 等同步信号计时的录音/播放设备、同步电影或电视中的音频与视频，以及许多其他示例。为电影、电视或视频的歌曲或音乐授权也被称为“同步”（syncing）。\n\
  \n### Synthesizer Expander Module（合成器扩展模块）\nOberheim SEM（合成器扩展模块）是他们最早的产品之一。它是一个完整的合成器音色——两个振荡器、两个简单的包络、`VCA`\
  \ 以及一个非常流行的双极状态变量滤波器设计，带有一个旋钮可以在低通、陷波和高通输出之间交叉滤波，以及独立的带通设置——封装在一个立方体形状的外壳中。现在，当模块制造商使用“SEM”这两个魔法字母时，他们通常指的是旨在模拟原始\
  \ Oberheim 合成器中滤波器。\n\n### Synthesizer（合成器）\n一种使用电气振荡器人工产生音调的乐器，用于模拟其他乐器的声音或创造其他乐器无法的声音。\n\
  \n### System Exclusive（系统专用）\n系统专用（`SysEx`）一种仅会被特定制造商设备识别的 MIDI 消息。\n\n### Tach/Tachometer（转速计）\n\
  在模拟磁带录音中，录音机上的设备通过在磁带穿过磁头时发出脉冲来测量和调节磁带速度。\n\n### Tails Out（带尾外露）\n一种卷绕音频磁带的方法，使最后一个录制选择的结尾位于带轴的外侧。\n\
  \n### Take Notation（分带标记）\n在分带单或轨道日志上记录下录制曲目的分带情况并带有注释。模拟磁带录音建议/使用分带标记，但在大多数录音室，此功能现在在\
  \ `DAW` 上完成。\n\n### Take（分带）\n在磁带录音机或 `DAW` 的一次开始和停止之间完成录制。\n\n### Talk Box（人声盒）\n\
  一种效果器，允许音乐家通过放入嘴里的软管来调制其乐器的声音。从历史上看，声盒一直被用吉他的效果，但也可以用于修改其他乐器。\n\n### Talkback（对讲）\n\
  控制室中的一个麦克风，其与录音通道采用独立电路，允许工程师通过监听系统与现场录音室或录音间内的音乐家交流。\n\n### Tape Delay（磁带延迟）\n\
  一种信号处理技术，通过模拟磁带机操控时间延迟来创建人工延迟或回声。这种技术开始是将信号路由到单独录音机，并将延迟响应混合回来；随后它演变为使用专用机器，通过调整录音头和播放头之间的距离来调整延迟长度。今天，录音室中的磁带延迟效果通过\
  \ `DAW` 中的插件进行模拟。\n\n### Tape Guide（磁带导向）\n任何引导磁带通过录带机磁头，或在两个带轴之间移动的静止或旋转设备。\n\n\
  ### Tape Hiss（带底噪）\n由于制造磁带的磁颗粒而在模拟磁带上产生的自然高频噪声。带底噪构成了模拟录音中大部分的底噪，可以通过更细的磁颗粒制造的磁带来减少。（另见“底噪”）\n\
  \n### Tape Loop（磁带环路）\n一段两头接磁带，以便录制连续播放。\n\n### Tape Recording Equalization（磁带录音均衡）\n\
  在录带机电子系统中录制时增加高频信号幅度，以使高频信号录制在带噪之上。\n\n### Telephone Filter（电话滤波器）\n一种通过移除 300 Hz\
  \ 以下和 3500 Hz 以上的信号来模拟通过电话接收器听到的音频的滤波器。\n\n### Tempo Mapping（速度映射）\n编写序列器或 `DAW`\
  \ 使其遵循录制表演的速度变化的过程。与节点映射或节奏同步不同，后者在本质上是调整录内容以适应固定速度，而速度映射是调整项目速度（特别是 MIDI 乐器）以匹配录制材料的自然速度细微差别。（另见“节点映射”、“节奏同步”）\n\
  \n### Tempo（速度）\n音乐移动的速率，以每分钟拍数（BPM）测量。\n\n### Terminal（终端）\n1) 两根线之间的连接点，包括电缆末端的插头和设备上的插座。\n\
  2) 指计算机的键盘和显示器，允许用户输入信息和访问数据。\n\n### Test Oscillator（测试振荡器）\n\n\n\n\n\n一种用于测试目的而产生各种频率音频波形的设备。\n\
  \n## 测试压片 (Test Pressing)\n由第一个母版压制出的少数初始黑胶唱片拷贝之一。在压制更多拷贝之前，人们会对其进行听音和视觉检查，以批准其质量。\n\
  \n## 测试音 (Test Tones)\n1) 磁带卷开头位于磁参考电平处录制的几个单频音调，将用于录制节目。\n\n2) 用于校准音频系统的人工生成音。\n\
  \n## 薄音色 (Thin Sound)\n一个模糊的术语，描述缺乏某些频率（尤其是低频）的音频信号。例如，使用 `EQ` 对信号进行过度过滤可能会产生薄音色。\n\
  \n## 螺纹嵌件 (Threaded Inserts)\n一种将模块安装到外箱的常用系统称为滑动导轨或螺母。许多螺母插入这些凹槽中，然后可以将它们滑动到任何位置，以适应模块的整个安装间距。有些人不喜欢这种系统，因此他们用插入凹槽的金属条代替螺母，这些金属条已预钻了标准的\
  \ Eurorack 安装孔间距。它们可能是为 2.5 mm 或 3 mm 的螺丝钻的；在购买带有预安装导轨或外箱时请注意。\n\n## 三比一规则 (Three-To-One\
  \ Rule)\n一种麦克风放置原则，规定当同时使用多个麦克风时，麦克风之间的距离至少应该是每个麦克风与其相应声源距离的三倍。三比一规则用于防止音频信号之间的相位问题。\n\
  \n## 三路扬声器 (Three-Way Speaker)\n一种具有独立扬声器来再现低音、中频和高频的系统。\n\n## 听阈 (Threshold of\
  \ Hearing)\n描述为人们在 50% 的时间内能够听到的声压级。\n\n## 阈值 (Threshold)\n阈值通常是指模块在采取动作之前信号需要越过的电压电平。例如，当包络跟随器（一种产生与音频信号当前水平相应的电压的模块）的输出高于阈值电平时，它的门限信号（gate\
  \ signal）将变为高，表示音符开始。当包络跟随器的输出下降到阈值之前（该阈值可能与开启音阈值相同也可能不同）时，门限变为低，表示音符应结束。\n\n动态处理单元开始改变输入信号增益的电平。\n\
  \n## 喉口 (Throat)\n在扬声器中，喇叭或驱动单元上的小开口，声波通过此处从驱动单元进入喇叭。\n\n## 过零频率调制 (Through-Zero\
  \ Frequency Modulation)\n`TZFM` 是过零频率调制的缩写。想象一个电路，你将一个振荡器的输出（调制器）输入第二个振荡器（载波）的频率控制电压输入。当调制器的波形输出高于零伏时，它会被到载波正常的音高控制电压上，载波的音高上升。当调制器的波形输出低于零伏时，它从正常的音高控制电压中减去，音高下降。但如果音高控制电压减去调制器的结果低于零伏会发生什么？在明确表示实现过零调制的振荡器中，载波将开始反向播放——本质上是负频率。这通常会产生更悦耳的结果，是振荡器的一个理想特性。\n\
  \n## 投射距离 (Throw)\n1) 在扬声器和麦克风中，描述振膜可以进行的无限制运动量。在麦克风中，这影响麦克风的灵敏度；在扬声器中，这影响声音投影的距离。（为较小空间设计的扬声器具有“短投”，而为远距离投影设计的扬声器具有“长投”。）\n\
  \n2) 在扬声器中，“投”也可以用于描述扬声器的方向性输出，通常基于它发射的频率。例如，喇叭在有限的角度内发射高频，因此具有“长投”，而低音扬声器向所有方向发射低频，具有“短投”。\n\
  \n3) 制作人、工程师或音乐家在极度沮丧时对手中任何东西可能做的事。\n\n## 跳线 (Tie Lines)\n跳线——两端带有连接器的电缆，通常穿过录音室墙墙或地板，用于在房间之间传输信号。跳线提供了一种很好的半永久方式，快速在工作室的不同部分路由和配置信号路径，并帮助工程师跟踪信号流。\n\
  \n## 音色 (Timbre)\n这个词经常用于描述你所创造的声音的独特音调特征，独立于其音高或响度。根据定义，不同的声音具有不同的音色。当你改变一个改变其音调特征的声音参数时（例如改变滤波器截止频率、脉冲宽度、波折叠量等），你就是在改变它的音色。音色通常在音符的寿命期间发生变化。\n\
  \n使一种乐器听起来与其他乐器不同的声音质量，即使演奏相同的音高。例如，小号的音色让它听起来像小号而不是笛子。音色在很大程度上是通过乐器演奏时泛波的存在、缺失和复杂性形成的。\n\
  \n## 时间码 (Time Code)\n一种标准的计时信号，用于帮助设备相互同步，或将音频与视频同步。录音室常用的时间码是 `MIDI Time Code`\
  \ (`MTC`) 和 `SMPTE` 时间码。\n\n## 时间压缩/扩展 (Time Compression / Expansion)\n（也称为“时间拉伸”或“时间平移”）在不改变声音音高的情况下加速或减慢音频录制的过程。\n\
  \n## 时间常数 (Time Constant)\n一个复杂的数学概念，基本上描述了将电电压应用于电路与电路做出响应之间的时间延迟。\n\n## Tini-Jax\n\
  这是由 Switchcraft 制造的一种特殊设计的插座，用于 Buchla（以及许多克隆产品）传输音频信号。它们的直径为 3.5mm，但在物理上与常见的 3.5mm\
  \ 插座略有不同。1/8 英寸插头插入 Tini-Jax 插座时会松动；Tini-Jax 插头可能无法插入甚至会损坏 1/8 英寸插座。\n\n## 通鼓 (Toms)\n\
  鼓组中安装在底鼓上方架子上的鼓（直径小至 10 英寸）。\n\n## 音调发生器 (Tone Generator)\n1) 一种产生各种频率测试音以对齐带机或其他测试目的的设备。\n\
  \n2) 合成器中产生输出音频信号的电路，通常用于模拟另一种乐器的声音。\n\n## 音 (Tone)\n1) 任何单频信号或声音。\n\n2) 乐器声音相对于不同频率所含能量的质量。\n\
  \n## 吐音法 (Tonguing)\n用舌头控制铜管或木管乐音符开始的技巧。\n\n## 总谐波失真 (Total Harmonic Distortion,\
  \ THD)\n放大器输出级与输入级相比，谐波频率电平的差异量，以百分比表示的比例。对于许多耳朵来说，这是一个难以察觉的精细调节规格，但 THD 越低，放大器/扬声器还原声音就越准确。\n\
  \n## 触控敏感 (Touch Sensitive)\nTouch Sensitive – 见“速度灵敏 (Velocity Sensitive)\n\n##\
  \ 跟踪与保持 (Track & Hold)\n\n\n\n\n这是采样保持器（Sample & Hold）的一种变体。它们都有两个输入——门控信号和电压参考信号——以及一个电压输出。当采样保持器接收到高电平信号时，它会冻结并输出进入参考输入的电压。该电压将一直保持，直到接收到新的高电平信号；低电平信号会被忽略。在跟踪保持器（Track\
  \ & Hold）中，当门控为高电平时，参考输入会被传递到电压输出（这是“跟踪”阶段）；当门控变为低电平时，该瞬间的电压会被冻结并保持在电压输出端，直到接收到新的高电平信号。\n\
  \n# 轨道日志 / 轨道分配表 (Track Log / Track Assignment Sheet)\n\n轨道日志/轨道分配表 – 随多轨道磁带保存的纸张，用于记录每个轨道录制的是什么乐器。\n\
  \n## 轨道 (Track)\n1) 在多轨道磁带的宽度部分上完成的一个音频录制，或使用 DAW 创建的数字表示。\n2) 序列器或 DAW 中的一组控制命令，用于控制某一个\
  \ MIDI 通道上的一个乐器。3) 参见“乐队轨道（Band Track）”。\n\n## 跟踪 (Tracking)\n跟踪通常指的是振荡器跟随发送给它的音高控制电压（CV）的程度。随着电压升高，振荡器“跟踪”它并产生更高的音高。大多数（但不是所有！）合成器遵循每八度\
  \ 1 伏的系统，其中音高输入上升 1.00 伏应应产生振荡器音高的精确倍倍（升高一个八度）。如果确实如此，则该振荡器具有良好的跟踪性。如果振荡器略微偏调，则被视为跟踪误差或跟踪性差。有时你会发现电压控制滤波器有一个\
  \ CV 输入的“跟踪”开关，此时滤波器截止频率的音高上升幅度仅为对应音高输入变化的 1/3、1/2 或 2/3。这可以防止高音听起来太刺耳，同时又不让低音听起来太沉闷。有时你会发现电压控制滤波器有一个\
  \ CV 输入的“跟踪”开关，此时滤波器截止频率的音高上升幅度仅为对应音高输入变化的 1/3、1/2 或 2/3。\n\n多轨道录制中录制各个轨道的行为。\n\n\
  ## 换能器 (Transducer)\n一种将能量从一种介质转换为另一种的设备。换能器遍布录音室的各种设备。\n\n## 瞬态 (Transient)\n波形开始处的初始能量峰值，例如由拨片或锤子击弦产生的动作，或鼓的敲击。\n\
  \n## 晶体管阶梯滤波器 (Transistor Ladder Filter)\n此术通常用于描述深受喜爱的 Moog 低通滤波的设计，许多人仍认为它是低通滤波器声音的黄金标准。Moog\
  \ 实际上为这种设计获得过专利（现已过期）；他们的许多竞争对手要么直接抄袭它，要么尽力模仿它。\n\n## 传输控制 (Transport)\n1) 磁带机中负责将磁带从供带卷移过磁头并移动到卷带卷的部分。\n\
  2) DAW 或序列器上的一组控制按钮，用于启动、停止、暂停、快进和倒退，模拟磁带机传输控制的功能。\n\n## 移调 (Transpose)\n简单来说，移调音律的音高是指将其按固定数量的半音或八度向上或向下移动。这有时被称为“半音”移调。更复杂的变体是“阶式”移调，其中每个音按固定数量的音阶步移动；这与半音移调不同，因为某些音阶步长之间的半音数可能与其他音阶不同。\n\
  \n按固定音程移动一组音符。这可以通过多种方式实现——例如：1) 用新调性重写整首曲子；2) 改变乐器的调音，使其发音音程比弹出的音符更低或更高（通过人工方式，如电子键盘，或通过移调乐器的自然调音，如小号）；或\
  \ 3) 实时移调，在谱面上方或下方按固定音程演奏（也称为视奏移调）。\n\n## 陷阱 (Trap)\n1) 一种拒绝某些频率音频信号的滤波器。\n2) 一种用声学材料设计的物体，放置在墙内以减少房间内的低频反射（也称为“低音陷阱”）。\n\
  3) 鼓组的另一种（如“trap set”）。\n\n## 颤音 (Tremolo)\n这是改变音符振幅（响度）的效果。在模块合成器上创建这种效果的方法是将低频振荡器（LFO）连接到放大器的一个控制电压输入上。颤音与揉音（vibrato）不同；后者是音高的波动而非响度的波动。\n\
  \n一种波动或“抖动”的音乐效果，通过快速重复音符（如小提琴颤音）或振幅快速产生。\n\n## 三角波 (Triangle)\n三角波是一种常见的合成器波形。当被选为振荡器的输出时，它的声音比标准的方波或锯齿波更柔和，高波更少且更弱。这也是低频振荡器（LFO）的常用输出，因为它在其控制的任何范围内产生相对平滑的上下变化，同时比更平滑的正弦波更容易创建。\n\
  \n## 三角波 (Triangular Wave)\n一种谐波丰富的波形，在图形表示时呈三角形形状，这是由于奇谐波的存在和快速衰减共同导致的。\n\n## 触发\
  \ (Trigger)\n触发是一个极短的电脉冲信号，从 0 伏上升到 5 或 10 伏等标准水平，持续几毫秒，然后掉回 0 伏。它通常用于启动或“触发”打击乐的播放，包括启动包络发生器。它们也可以用于在合成器周围传递时钟信号，以便模块知道音符（或音符的更细划分）的开始。\n\
  \n控制事件发生的信号或行为。\n\n## 电平 (Trim / Trim Control)\n一种在放大器中减少或增加信号强度的设备，通常范围有限。通常与增益（gain）通用，但通常指的是微调信号强度，而不仅仅是放大它。\n\
  \n## 截断 (Truncation)\n1) 音频信号、采样或歌曲的短，通常通过切掉末尾来实现。\n2) 当位降低时丢弃数据位（例如从 24 位降至 16\
  \ 位），如果不应用抖动（dither），会导致数字失真。\n\n## 调音 (Tune)\n调整合成器振荡器（主音高产生元件）的音高以匹配另一个振荡器、乐器或参考源被称为调音。\n\
  \n## 调音叉 (Tuning Fork)\n带有两个齿的金属叉，在击击叉时会产生一个频率的相当纯净音调。\n\n## 转盘 (Turntable)\n一种在播放期间支撑并旋转唱胶片的设备。\n\
  \n## 高音喇器 (Tweeter)\n专门设计用于重现声音中高频部分的扬声器。\n\n双象限乘法\n\n\n\n\n双象限乘法器执行的是简单的幅度调制（AM）版本，它通过一个被称为载波波的信号（通常是音频信号，在\
  \ 0 伏上下波动）和另一个被称为调制波的信号，来改变载波信号的振幅或响度。在典型的幅度调制（AM）场景中，一个带有正电压的低频振荡器（例如 0v 到 5v 之间，或者更小如\
  \ 1v 到 2v 之间）被馈入电压控制放大器的控制输入端，以为通过它的音频信号添加颤音。调制信号中的任何负向波动都会被忽略；在连接颤音调制（tremolo）时，你可能需要确保为你的\
  \ `LFO` 添加一个偏置电压，以确保声音在 `LFO` 波形的低端偏移处不会断掉。（同时使用调制器的负向和正向偏移的情况被称为四象限乘法器。）\n\n##\
  \ 双音道扬声器 (Two-Way Speaker)\n一种具有独立扬声器还原低频（低音单元）和高频（高音单元）扬声器系统。\n\n## TZFM\n`TZFM`\
  \ 是“过零频率调制”（Through-Zero Frequency Modulation）的缩写。想象这样一个电路：你将一个振荡器的输出（调制器）馈入第二个振荡器（载波）的频率控制电压输入。当调制器的波形输出高于\
  \ 0 伏时，它会被加到载波正常的音调控制电压上，载波的音调上升。当调制器的波形输出低于零时，它会从正常的音调控制电压中减去，音调下降。但如果从音调控制中减去调制器的结果低于\
  \ 0 伏会怎样？在明确表示实现过零频率调制的振荡器中，载波将开始反向播放——本质上是负频率。这通常会产生更悦耳的结果，是振荡器的一种理想特性。\n\n## U\
  \ (Rack Unit)\n机架式设备通常遵循一套标准尺寸，包括 19 英寸（48.3 厘米）的宽度，以及“机架单元”（简称 `U`）的高度，每个 `U` 等于\
  \ 1.75 英寸（4.4 厘米）。许多常见的合成器格式遵循机架单元系统来标准化模块高度——例如 Eurorack 的 `3U`（3 x 1.75 = 5.25\
  \ 英寸或 13.3 厘米），Buchla 和 Serge 的 `4U`，以及经典模块化 Moog 的 `5U`（有时被称为 Moog Unit `MU`）。\n\
  \n## 不平衡音频 (Unbalanced Audio)\n大多数音频信号通过带有两根线的电缆传输：一根代表音频振动的电压，另一根是地。这种排列通常被称为不平衡音频。\n\
  \n## 不平衡电缆 (Unbalanced Cable)\n具有两个导体（信号线和地线）且两端均有连接器的电缆。不平衡电缆通常容易受到电磁干扰和噪声。不平衡电缆的示例包括吉他/乐器线（也称为枪头套接线或\
  \ `TS` 线）和 RCA 线。\n\n## 单指向模式 (Unidirectional Pattern)\n一种麦克风拾音模式，对来自一个方向的声音比来自任何其他方向更敏感。\n\
  \n## 单极 (Unipolar)\n模块合成器中的许多电压——包括音频振荡器的输出以及大多数低频振荡器的输出——都在正电压和负电压之间波动。这被称为双极电压（bipolar\
  \ voltage）。某些电压——例如包络生成器的输出——仅在 0 伏和某个最大正电压之间变化；这被称为单极（unipolar）。\n\n## 同音 (Unison)\n\
  多个同时以相同音高发声的者、乐器或声源。\n\n## 单位增益 (Unity Gain)\n指放大器或设备输出端的信号强度与输入端的信号强度相比没有增加或减少的情况（通常描述为\
  \ `0 dB`）。\n\n## 统一 (Unity)\n通常用于“单位增益”短语中，意味着信号从输入到输出保持完全相同的水平。\n\n## 真空管 (Vacuum\
  \ Tube)\n一种二极管，一种抽真空的玻璃管，电流可以流过。在音频领域，真空管用于放大器、振荡器和其他模拟设备。\n\n## 循环段与淡出 (Vamp and\
  \ Fade)\n一种结束歌曲录制的方法，音乐有一个重复部分，工程师减小音量直到音乐淡出。\n\n## 循环段 (Vamp)\n歌曲或和弦进行中重复的部分，通常位于歌曲结尾，且通常是副歌或副歌的一部分。\n\
  \n## 变速 (Vari-Speed)\n磁带机上改变播放速度的控制。\n\n## 可变 D (Variable-D)\nElectroVoice 在其麦克风设计中的一项专利技术，用于改变麦克风的近距离效应。`Variable-D`\
  \ 在麦克风身上放置了几个端口，每个端口距离麦克风振膜越远，对高频的敏感度越低。\n\n## VCA 自动化 (VCA Automation)\n某些调音台中的混合自动化系统，通过使用电压控制放大器来改变音量或其他功能。\n\
  \n## VCA 分组 (VCA Group)\n若干接收来自组主推子控制电压的 `VCA` 推子。这是高档调音台上的一项功能，允许工程师通过单个推子控制独立信号组，该推子使用\
  \ `VCA` 调整发送到每个通道的电压。\n\n## 速度消息 (Velocity Message)\n在合成器和键盘控制器中，传输击键力度数据的 MIDI\
  \ 消息。`Velocity` 消息可以传输音量信息，还可以触发多采样乐器补丁上的不同采样。\n\n## 速度麦克风 / 压力梯度麦克风 (Velocity Microphone\
  \ / Pressure-Gradient Mirophone)\n`Velocity Microphone` —— 参见“压力梯度麦克风”。\n\n## 速度敏感\
  \ (Velocity Sensitive)\n(也称为“触控敏感”）MIDI 乐器（如键盘）的一种功能，根据击键的力度传输 MIDI `velocity` 消息。\n\
  \n## 颤音 (Vibrato)\n音调平滑且重复的变化，通常由歌手或吹管乐器演奏者完成。\n\n## 虚拟乐器 (Virtual Instrument)\n\
  (也称为软件乐器) 基于软件的合成器、采样器或声音样本，通过计算机存储并通过外部 MIDI 控制器访问，而不是独立的合成器或模块。由于这些乐器的广泛通用性，越来越多的作曲家和电子音乐人使用存储在硬盘中的虚拟乐器，而不是购买大量的键盘和模块。\n\
  \n## 歌间 (Vocal Booth)\n录音室中用于隔离录制人声的房间。这种做法可以防止乐器声音渗入人声麦克风，并减少人声录制中的自然环境和混响。\n\n\
  ## 声码器 (Vocoder)\n一种音频处理设备、效果设备或插件，它分析音频信号的特征并利用这些特征影响另一个合成信号。声码器主要用于通过人类语音产生合成语音效果，创造出特征机器人声音或“人类合成器”效果，听起来就像合成器在说话或唱歌。\n\
  \n## 旁白 (Voice Over)\n在视频、电影和广告的背景音乐上录制的语音公告或旁白。\n\n## 声 (Voice)\n1) 除了人类嘴发出的声音这一定义外……在合成器中，`voice`\
  \ 指同时播放的多个声音/音调之一。“单声道”意味着一次只一个声音，而“多声道”意味着可以同时有多个声音播放。（参见“多声道”、“单声道”。）\n\n2) 在某些合成器中（如雅马哈），voice”也可以指合成器上的特定声音补丁。\n\
  \n## 易失性内存 (Volatile Memory)\n计算机关闭时数据会丢失的内存。`RAM`（随机存存储器）是最常见的易失性内存形式。\n\n## 电压控制放大器\
  \ (VCA)\n\n\n\n\n其增益电平受外部电压影响的放大器。`VCAs` 经常用于合成器、信号处理器，以及作为某些调音台的自动化控制手段。\n\n###\
  \ 电压控制滤波器\n一种滤波器（尤其是低通滤波器），它会根据输入到控制输入的控制电压来改变其截止频率。\n\n### 电压控制振荡器 (VCO)\n一种频率通过电压输入进行修改的振荡器。常见于合成器中。\n\
  \n### 电压\n两个物体之间电动力或压力（电势）的差异，导致它们之间产生电流流。\n\n### 音量单位 (VU)\n用于测量音频中感知响度变化的单位。该单位基本上是\
  \ `VU Meter` 读数的平均电平的分贝变化。（参见“VU 表计”。）\n\n### 音量 (Volume)\n一个常见的非技术性术语，可以指声压级（我们听到的响度），也可以指音频电平。\n\
  \n### Vox\n一个拉丁词，意为“声音”，常作为录音室轨道日志的缩写。\n\n### VU 表计\n一种读取设备输入或输出音频电平的仪表，设计用于匹配耳朵对电平突然变化的响应。\n\
  \n***\n\n### 瓦特\n电功率的单位。\n\n### 波 (Wave)\n这是振荡器输出的振动模式——电压的上下波动。不同的模式产生不同的声音。\n\n\
  ### 波折叠器 (Wavefolder)\n`wavefolder` 是一种非常特定的波形整形器设计，它使用了比较器和其他电路。它们的作用是观察波形是否高于（或低于）特定阈值。当发生这种情况时，它们不是剪掉波形的顶部和底部，而是创建一个它的镜像，并将该部分波形反射回自身，在此过程中产生更多的高谐波和有趣的频谱。\n\
  \n### 波形 (Waveform)\n这是振荡器输出的振动模式——电压的上下波动。不同的模式产生不同的声音。\n\n声波、音频信号或其他类型波形的视觉表示或图形，显示波形在零线以上和以下的振荡。\n\
  \n### 波长\n波形的一个周期的物理长度，以英尺、英寸等单位测量。声波波长越长，频率越低；波长越短，频率越高。\n\n### 波形整形器 (Waveshaper)\n\
  说它是“一个改变通过的波形形状的电路”可能有点显而易见，但这正是核心。波形整形器通常有特定的目标，例如将输入的三角形波转换为输出的正弦波，或者在波形的峰值和瞬态处添加类似电子管的软剪切。许多波形整形器仅仅是为了以有趣的方式扭曲（呃，添加更高阶谐波）波形，创建出噪声更多（呃，更复杂且更明亮）的谐波频谱以产生新的声音。\n\
  \n### 波形表 (Wavetable)\n这个术语有两个相关但略有不同的含义。数字振荡器通常通过按顺序读取数字表来产生声音，从一个数字描述的电平跳转到下一个电平。这个数字表描述了波形的一个周期，因此通常被称为\
  \ `wavetable`。许多数字振荡器有多个并排排列的波形表，并可以在这些表之间移动——要么通过突然跳转（原始的 `PPG Wave` 合成器所做的），要么在它们之间进行交叉淡入（如今大多数数字波形表振荡器所做的）。有些人人将每个表称为一个“波”，将一组单独的波称为一个\
  \ `wavetable`。\n\n### 加权 (Weighting)\n音频测试中使用的均衡化曲线，用于补偿不同电平下的弗莱彻-蒙森曲线。（参见“弗莱彻-蒙森曲线”。）\n\
  \n### 西海岸合成器 (West Coast Synthesis)\n所谓的“西海岸”合成方法——传统上与 `Buchla` 和 `Serge` 等公司相关——通常基于在简单波形上添加谐波，而不是从复杂波形中移除（滤波）它们。这通常通过使用一对振荡器（有时组合成所谓的“复杂振荡器”）来实现，其中一个调制另一个的频率\
  \ (`FM`) 或振幅 (`AM`)；另一个常见的西海岸模块是 `waveshaper` 或 `wavefolder`。你还可能还会发现两阶段包络发生器，例如\
  \ `AD` 或 `AR`（通常称为斜率发生器），而不是四阶段的 `ADSR`，以及更强调对控制电压的操作。一个共同特征也是带有内置低通滤波器的电压控制放大器，创建了所谓的低通门（`LPG`）。西海岸方法还拥抱了非传统的控制器，如触摸板等。在今天，在同一个系统中混合使用东海岸和西海岸方法是很常见的。\n\
  \n### 湿声 (wet sound)\n有时人们会说滤波器有一种“湿”声。这通常指的是少于 4 极的滤波器声音——通常是低通或带通——共振略微，但未达到自激振的程度。这种声音在酸\
  \ House 和其他类似的科技曲风格中很流行。\n\n### 湿 (Wet)\n混合了效果（如混响）的声音被称为“湿”；没有效果的声音被称为“干”。效果器或调音台通常有湿/干混合量控制，用于设置原始未处理声音与完全经过效果处理声音之间的比例。\n\
  \n指应用了全量效果（如混响）的信号，与“干”相对，后者指的是未经过效果的声音。在很多时候，混音中的首选声音是湿信号和干信号的混合。（参见“干”。）\n\n###\
  \ 白噪声 (White Noise)\n噪声是一种没有明显音调的随机信号，例如嘶声、呼吸声或风声或海浪声。噪声通常通过不同的“颜色”来描述，如白、粉、红或蓝，它们具有不同的频率分布。白噪声单位频率内的功率相等（例如\
  \ 1000 赫兹），产生更亮、更嘶哑的声音。\n\n在频率范围内分布均匀的噪声。像粉红噪声一样，工程师会将白噪声通过音频设备进行调校。（参见“粉红噪声”。）\n\
  \n### 全音 (Whole Step)\n等同于半音的角度变化，或者钢琴键之间的音高差。\n\n### 野音 (Wild Sound)\n在电影和视频中，与画面分离录制的音频，稍后添加到音频轨道中，不需要与画面同步。\n\
  \n### 风控制器 (Wind Controller)\n一种像风类乐器一样通过 `MIDI` 信号控制合成器、模块或虚拟乐器的设备，相对于键盘控制器。\n\n\
  ### 防风罩 (Windscreen)\n覆盖在麦克风上的覆盖物，以减少风吹进风产生的过度噪声。通常用于户外录音。\n\n### 无线麦克风\n通过 `FM`\
  \ 频率传输信号到场外接收器的麦克风，而不是通过音频线。\n\n### 低音 (Woofer)\n设计用于产生低频率的扬声器。\n\n### 写入模式 (Write\
  \ Mode)\n自动调音台的操作模式，工程师控制通道增益，而计算机记录随时间变化的增益。\n\n***\n\n### XLR 线缆\n使用 `XLR` 连接器的平衡麦克风电缆。（参见“XLR\
  \ 连接器”。）\n\n### XLR 连接器\n由 3 或 7 针组成的平衡电连接器，最常用于麦克风电缆。\n\n### XY 法 (XY Miking)\n\
  一种同步立体声麦克风放置技术，将两个心形麦克风头指向彼此，成 90 度角，并尽可能靠近。（参见“同步放置法”。）\n\n***\n\n### 顶峰 (Zenith)\n\
  \n\n\n\n\n在模拟磁带录音中，该术是指磁头垂直于磁带运行方向的倾斜。\n\n## 零阶保持 (ZOH)\n\n指传统数模转换器 (DAC) 所执行的信号处理的数学表达式。\n\
