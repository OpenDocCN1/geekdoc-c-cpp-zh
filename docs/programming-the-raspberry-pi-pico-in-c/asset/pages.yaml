- img_proc: true
  md: 'To make the SDK example easier to use we will connect the device using the
    same GPIO pins:


    | PICO | BME280 |

    |---| GP16 (pin 21) MISO/spi0_rx | SDO/SDO |

    | GP17 (pin 22) Chip Select | CSB/!CS |

    | GP18 (pin 24) SCK/spi0_sclk | SCL/SCK |

    | GP19 (pin 25) MOSI/spi0_tx | SDA/SDI |

    | 3.3v (pin 36) | VCC |

    | GND (pin 38) | GND |


    Notice that the pins are called on a typical BME280 board varies, but you should
    be able to identify them.


    Once you have the device connected what you need to know to send and receive data
    varies according to the SPI bus varies the device and you have little choice but
    to find and read the datasheet. In this case the table "memory map":


    | Register Name | Address | bit7 | bit6 | bit5 | bit4 | bit3 | bit2 | bit1 | Reset
    |

    |---|---|---|---|---|---|---|---|---||

    | hum_lab | 0xFE | | | | hum_lab[7:0] | | | | 0x00 |

    | temp_lab | 0xFC | | | temp_xls[7:4] | | 0 | 0 | | 0x00 |

    | hum_map | 0xFA | | | | | | | | | 0xA0 |

    | temp_map | 0xF8 | | | | temp_xls[7:4] | | 0 | 0 | 0x80 |

    | press_lab | 0xF6 | | | | press_lab[7:0] | | | | 0x80 |

    | press_map | 0xF4 | | | | | | filter | | | 0x80 |

    | ctrl_meas | 0xF2 | | | t_ds[2:0] | | osrs[2:0] | spce[en] | | 0x00 |

    | ctrl_hum | 0xD0 | | | | | | mode[1:0] | osrs_h[2:0] | 0x00 |

    | reset | 0xE0 | | | | | | calibration_d | | | | 0x00 |

    | calib00_calib25 | 0x88 | | | | | | reset[0] | | individual | individual |


    | Registers | Reservation | Control | Data | Status | Chip ID | Reset |

    |---|---|---|---|---|---|---||

    | Type: | do not change | read only | read / write | read only | read only | read
    only | write only |


    The important registers for our simple implementation are the first data registers
    which give the raw values of humidity, temperature and pressure. These are all
    read-only registers and that work on the SPI bus is that first you write the address
    of the register you want to read and then read as many bytes as you need. The
    address is auto-incremented each time you read, so the first address followed
    by eight reads the contents of all the registers.'
  merge: -1
  pgno: 190
- img_proc: true
  md: 'There is one other detail to note. The most significant of the address byte
    is used to indicate a read or write operation – it has to be set to 1 for a read.
    If it is zero then the bytes that you send following the address are stored in
    the registers – the data registers are read-only. Notice that all the registers
    already have bit 7 in their usual addresses and there is no need to do anything
    extra for a read.


    So a read operation is typically:


    | Control byte | Data byte | Data byte | |

    |---|---|---||

    | Start R/W Register address (F6h) | Data register - address F6h | Data register
    - address F7h | Stop |

    | CS = 1 | 1 | 1 | 0 | 1 | 1 | 0 | bit15 | bit14 | bit13 | bit12 | bit11 | bit10
    | bit9 | bit8 | bit7 | bit6 | bit5 | bit4 | bit3 | bit2 | bit1 | bit0 | 1 =


    and a write operation is:


    | CS | Register address (F6h) | Data register - address F6h | Register address
    (F7h) | Data register - address F7h | Stop |

    |---|---|---|---|---||

    | CS = 0 | 1 | 1 | 1 | 0 | 1 | 1 | 0 | bit15 | bit14 | bit13 | bit12 | bit11 |
    bit10 | bit9 | bit8 | bit7 | bit6 | bit5 | bit4 | bit3 | bit2 | bit1 | bit0 |
    1 =


    Notice that the operation is started by lowering the CS line and stopped by raising
    the CS line. You can read or write as many values as you like and you can send
    another address to start the operation off at a different location.


    If you look at the detailed specification of the SPI bus you will find that the
    CS line has to be low at least 20ns before the first pulse and has to remain low
    until at least 20ns before the final pulse. It also limits the clock to less than
    10MHz.


    This is enough information to start create some functions that will read the BME200''s
    data registers. First we need to set the SPI hardware and the GPIO lines correctly:


    ```

    spi_init(spi0, 500 * 1000);

    gpio_set_function(16, GPIO_FUNC);

    gpio_set_function(18, GPIO_FUNC);

    gpio_set_function(19, GPIO_FUNC);

    ```


    The CS line has to be high before we start:


    ```

    gpio_init(17);

    gpio_set_dir(17, GPIO_OUT);

    gpio_put(17, 1);

    ```'
