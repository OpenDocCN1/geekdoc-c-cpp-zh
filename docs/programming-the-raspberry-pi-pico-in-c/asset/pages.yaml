  md: '# Summary


    +   The Pico is a remarkably powerful device given its low cost and is ideal for
    building prototypes, one-offs and production devices.


    +   The RP2040 chip that is at the heart of the Pico is also used in a number
    of similar devices, all of which can be treated as variations on the basic Pico.


    +   You need to decide on a development machine to use in conjunction with your
    Pico. The best and simplest choice is a Pi 4 or a Pico 400. This has GPIO lines
    which can be connected to the Pico to provide fast program loading and debugging.


    +   If you want to use a desktop PC, Mac or Linux machine then you need a minimum
    of two Picos – to work with, and one to run PicoProbe and act as a debugging connection.


    +   Although you can get started with the Pico without a debugging connection
    using drag-and-drop, this isn''t a long term solution to developing programs.


    +   VS Code provides an easy-to-use and efficient development environment, irrespective
    of the type of development machine you choose.


    +   To work with electronics, you need a solderless prototyping board, some hookup
    wires and some components. You also need a multimeter and preferably a logic analyzer.
    After these instruments you can add what you can afford.


    +   There is an active Pico community forum and if you get stuck it''s the place
    to ask for advice. However, always evaluate any advice proffered and, in general,
    don''t accept it unless you understand it.'
