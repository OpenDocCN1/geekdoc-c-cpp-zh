- img_proc: true
  md: 'You also need to add hardware_adc to the CMakeLists.txt file:

    target_link_libraries(MyProg pico_stdlib hardware_adc)


    You have to initialize each of the GPIO lines you want to use. Then you can select
    input to read and read it.


    Reading the ADC in this way is often the best way to work, but occasionally you
    need to read the inputs one after another. In this case the fact that there is
    a buffer that can store four readings is useful.


    To set round-robin mode you need to use:\adc_set_round_robin (uint input_mask)


    The mask specifies which inputs are included in the measurement of the obvious
    way - bit 0 controls input and 0. You also have to set up the way the FIFO buffer:


    ```

    adc_fifo_setup(bool en,bool dreq_en,uint16_t dreq_thresh,bool

    err_in_fifo,bool run)

    ```


    The first parameter enables the FIFO. The next two and the final parameter set
    up DMA to transfer results automatically from the buffer to another location and
    this is beyond the scope of this book. The fourth parameter determines if bit
    15 of the result is used for an error flag.


    Once you have set the inputs to read, you can use:

    adc_run (bool run)


    which starts the automatic reading. Each reading is stored in the FIFO buffer.
    If you don''t read the buffer to retrieve a value then it sits there until the
    buffer fills and it is discarded. Notice the buffer doesn''t contain the last
    four readings, but the first read before the buffer fills.


    You can read the buffer using:

    static uint16_t adc_fifo_get (void)

    static uint16_t adc_fifo_get_blocking (void)


    The difference is that the blocking function will wait until there is data ready

    to read.


    You can also find out the state of the buffer using:

    static bool adc_fifo_is_empty (void)

    static uint8_t adc_fifo_get_level (void)


    and you can empty the buffer using:\adc_fifo_drain (void)'
  merge: -1
  pgno: 201
- img_proc: true
  md: "The simplest robin-robin-reading program is:\n#include <stdio.h>\n#include\
    \ \"pico/stdlib.h\"\n#include \"hardware/adc.h\"\n\n```\nint main() {\n    adc_init_all();\n\
    \n    adc_init();\n    init(26);\n    adc_gpio_init(26);\n    adc_gpio_init(27);\n\
    \    adc_set_round_robin(0x03);\n    adc_fifo_setup(true,0,false,false);\n   \
    \ adc_run(true);\n    const float conversion_factor = 3.3f / (1 << 12);\n    while\
    \ (1) {\n        uint16_t result = adc_fifo_get();\n        printf(\"Raw value:\
    \ 0x%03x, voltage: %f V\\n\", result, conversion_factor);\n        int level =\
    \ adc_fifo_get_level();\n        printf(\"level: %d\\n\", level);\n    }\n}\n\
    ```\n\nThis just reads inputs 0 and 1 is as fast as possible, given the need to\
    \ print the results. If you try this out and you will see that you get input 0\
    \ followed by input 1 reported alternately, but you will also see that the level\
    \ reported is always 8. This is the time to print the values takes longer than\
    \ a conversion and the buffer fills and values are discarded.\n\nYou can slow\
    \ down the clock rate, and hence the conversion rate, by setting the clock divider.\n\
    \nadc_set_clkdiv(float clkdiv)\nThe divider is a 16-bit integer with a 4-bit fractional\
    \ part. With the default 48MHz clock the slowest sampling rate is approximately\
    \ one sample every 1.366ms or 732 samples per second.\n\nEven if you add:\nadc_set_clkdiv((float)0xFFFF);\n\
    \nto the program you will find that you cannot read and print the result quickly\
    \ enough to avoid the buffer overflowing. This isn't unreasonable as the idea\
    \ of using an automatic system is to record data faster than the Pico could normally\
    \ process it."
  merge: -1
  pgno: 202
- img_proc: true
  md: 'If you are going to rely on the round-robin-reading method you need to make
    use of some even more advanced features of the ADC to implement either an IRQ
    handler or a DMA transfer of data. To enable the IRQ handler you need to use:


    ```

    adc_irq_set_enabled (bool enabled)

    ```


    The interrupt is active when the buffer reaches the threshold set for a DMA transfer,
    even if DMA isn''t in use.


    # The MCP3008 SPI ADC


    An alternative to use the Pico''s built-in ADC with its noise and stability problems
    is to use an external chip. The MCP3000 family is a low-cost versatile SPI-based
    of A-to-D converters, with eight analog inputs at 10-bit precision, and the MCP3004,
    with four analog inputs at 10-bit precision, the best known, there are other devices
    in the family, including ones with 12-bit and 13-bit precision and differential
    inputs, at the same sort of cost - $1 to $2.


    In this chapter the MCP3008 is used because it is readily available and provides
    a good performance at low cost, but the other devices in the family work in the
    same way and could be easily substituted.


    The MCP3008 is available in a number of different packages but the 16-pin PDIP
    is the easiest to work with a prototyping board. You can buy it from usual sources
    including Amazon, see Resources on this book''s webpage. Its pinouts are fairly-explanatory:


    ![](img/470d59c61482018b86da50823ee18a57_203_0.png)


    You can see that the analog inputs are on the left and the power and SPI bus connections
    are on right. The conversion accuracy is claimed to be 10 bits, but how many of
    these bits correspond to reality and how many noise depend on how you design the
    layout of the circuit.


    You need to take care if you need high accuracy. For example, you will notice
    that there are two voltage inputs, VDD and VREF. VDD is the supply voltage that
    runs the chip and VREF is the reference voltage that is used to compare the input
    voltage. Obviously, if you want highest accuracy, VREF, which has to be lower
    than or equal to VDD, should be set by an accurate low-noise voltage source. However,
    in most applications VREF and VDD are simply connected together and the usual,
    low-quality, supply voltage is used as the reference. If this isn''t good enough
    then you can use anything from a'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'Zener diode to a precision voltage reference chip such as the TL431. At the
    very least, however, you should add a 1µF capacitor to ground connected to the
    VDD pin and the VREF pin.


    The MC3000 family is based on the same type of ADC as the Pico''s built-in device,
    a successive approximation converter.


    You can see that successive approximations fits well with a serial bus as each
    bit can be obtained in the time needed to transmit the previous bit. However,
    the conversion is relatively slow and a sample-and-hold circuit is to be used
    to keep the input to the converter stage fixed. The sample-and-hold takes the
    form of a 20µF capacitor and a switch. The only reason to know about this is that
    the conversion has to be completed in a time that is short compared to the discharge
    time of the capacitor. So, for accuracy, there is a minimum SPI clock rate as
    well as a maximum:


    ![](img/470d59c61482018b86da50823ee18a57_204_0.png)


    Also, to change the capacitor quickly enough for it to follow a changing voltage,
    it needs to be connected to a low-impedance source. In most cases this isn''t
    a problem, but if you need to include an op amp. If you are using an op amp then
    you might as well implement an anti-aliasing filter to remove frequencies from
    the signal that are too fast for the ADC to respond. How all this works takes
    us into the realm of analog electronics and signal processing and well beyond
    the core subject of this book.


    You can also use the A-to-D channels in pairs, in differential mode, to measure
    the voltage difference between them. For example, in differential mode you measure
    the difference between CH0 and CH1, i.e. what you measure CH1-CH0. In most cases,
    you want to use all eight channels in single-ended mode. In principle, you can
    take 200k samples per second, but only to the upper limit of the supply voltage,
    VDD=5V, falling to 75k samples per second at its lower limit of VDD=2.7V.


    The SPI clock limits are a maximum of 3.6MHz at 5V and 1.35MHz at 2.7V. The clock
    can go slower, but because of the problem with the sample-and-hold mentioned earlier,
    it shouldn''t go below 10kHz. How fast we can take samples is discussed later
    in this chapter.'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Connecting To The Pico


    The connection from the MCP3008 to the Pico''s SPI bus is very simple and can
    be seen in the diagram below.


    | | | 3.3V Pin 36 |

    |---|---|---|

    | | 15 | 16 |

    | | 13 | 15 |

    | | 14 | | GND Pin 28 |

    | MCP3008 | SCLK Pin 24 | |

    | | 12 | MISO Pin 21 |

    | | 11 | MOSI Pin 25 |

    | | 9 | CS pin 22 |

    | | 10 | |


    | Pico | MCP3008 |

    |---|---|

    | GPIO 16 (pin 21) MISO | Pin 12 |

    | GPIO 17 (pin 22) Chip Select | Pin 10 |

    | GPIO 18 (pin 24) SCLK | Pin 13 |

    | GPIO 19 (pin 25) MOSI | Pin 11 |

    | 3.3v (pin 36) | Pins 15 and 16 |

    | GND (pin 38) | Pins 14 and 9 |


    The additional component that is recommended is a 1µF capacitor connected between
    pins 15 and 16 to ground, which is mounted as close to the chip as possible. As
    discussed in the previous section, you might want a separate voltage reference
    for pin 15 rather than just using the 3.3V supply.


    # Basic Configuration


    Now we come to the configuration of the SPI bus. We have some rough figures for
    the SPI clock speed - around 10kHz to a little more than 1.35MHz. A clock frequency
    of 500kHz seems a reasonable starting point.


    From the datasheet, the chip select has to be active low and, by default, data
    is sent most significant first for both the master and the slave. The only puzzle
    is what mode to use? This is listed in the datasheet as mode 0 with clock active
    high or mode 1 with clock active low. For simplicity we will use mode 0.'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'We now have enough information to initialize the slave:


    ```

    * *init(spi0, 500 * 1000);

    spi_set_format(spi0, 8, SPI_CPOL 0, SPI_CPHA 0, SPI_MSB_FIRST);

    gpio_set_function(16, GPIO_FUNC_SPI);

    gpio_set_function(18, GPIO_FUNC_SPI);

    gpio_set_function(19, GPIO_FUNC_SPI);


    gpio_init(17);

    gpio_set_dir(17, GPIO_OUT);

    gpio_put(17, 1);

    ```


    # The Protocol


    We have the SPI initialized and ready to transfer data, but what data do we transfer?
    As already discussed in the previous chapter, the SPI bus doesn''t have standard
    commands or addressing structure. Each device responds to data sent in different
    ways and sends back data in different ways. You simply have to read the datasheet
    to find out what the commands and responses are.


    Reading the datasheet might be initially confusing because it says that you have
    to send five bits to the slave - a start bit, a bit that selects its operating
    mode single or differential, and a 3-bit channel number. The operating mode is
    1 for single-ended and 0 for differential.


    So to read Channel 3, i.e. 011, in single-ended mode you would send the slave:


    ```

    11011xxx

    ```


    where an x can take either value. In response, the slave holds its output in a
    high impedance state until the sixth clock pulse, then sends a zero bit on the
    seventh, followed by bit 9 of data on the eighth clock pulse.


    That is, the slave sends back:


    ```

    xxxxxx0b

    ```


    where x means indeterminate. The remaining nine bits are sent back in response
    to the next clock pulses. This means you have to transfer three bytes to get all
    bits of data. This all makes reading the data in 8-bit chunks confusing.


    The datasheet suggests a different way of doing the job that delivers the data
    more neatly packed into three bytes. What it suggests to send a single byte is:


    ```

    00000001

    ```'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'At the same time, the save transfers random data, which is ignored. The final
    1 is treated as the start bit. If you transfer a second byte with most significant
    bit indicating single or differential mode, then a 3-bit channel address and the
    remaining bits be set to 0, the slave will respond with the null and the top two
    bits of the conversion. Now all you have to do to get the eight bits of data is
    to read a third byte:


    | MCU Transmitted Data (aligned with edge of clock) | Start Bit | | | | | | D2
    | D1 | D0 | X | X | X | X | X | X | X |

    | MCU Received Data (aligned with edge of clock) | ? | ? | ? | ? | ? | ? | ? |
    B7 | B6 | B5 | B4 | B3 | B2 | B1 | B0 |


    ![](img/470d59c61482018b86da50823ee18a57_207_0.png)


    ![](img/470d59c61482018b86da50823ee18a57_207_1.png)


    ![](img/470d59c61482018b86da50823ee18a57_207_2.png)


    This way you get two new bytes containing the data with all the low-order bits
    in their correct positions.


    Using this we can write some instructions that read a given channel. For example,
    to read Channel 0 we first send a byte to set 0x01 to start and begin the byte
    the slave transfers. We send 0x80 to select single-ended Channel and keep the
    slave sends back as the two high-order bits. Finally, we send a zero byte (0x00)
    so that we get the low-order bits from the slave:


    ```

    uint8_t wBuff[3] = {0x01, 0x80, 0x00};

    uint8_t rBuff[3];ngpio_put(17, 0);

    int n = spi_write16_read16_blocking(spi0, wBuff, rBuff, 3);

    sleep(1);

    gpio_put(17, 1);

    ```


    You notice that the three bytes ones one at a time by using transfer that results
    in the CS line being deactivated between the transfer of each byte.


    To get the data of rBuff we need to do bit manipulation:

    int data = ((int)rBuff[1] & 0x03) << 8 | (int)rBuff[2];


    The first part of the expression takes the low three from the first byte the slave
    sent, and as these are the most significant bits, they are shifted eight places.
    The rest of the bits are then ORed with them to get the full 10-bit result. Rest
    to convert to us use:


    ```

    float volts = (float)data * 3.3f / 1023.0f;

    ```


    assuming that VREF is 3.3V.

    in a real application you would also need to convert the voltage to some other
    quantity, like temperature or light level.'
  merge: -1
  pgno: 207
