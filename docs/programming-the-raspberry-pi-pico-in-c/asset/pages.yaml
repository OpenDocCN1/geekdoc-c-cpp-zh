- img_proc: true
  md: "# Using PWM Lines Together\n\nEach of the PWM slices can be set to a single\
    \ divider and wrap, but each of the channels can be set to a different level.\
    \ What this means is that the A and B channels of each PWM slice are set to the\
    \ same PWM frequency, but can generate different duty cycles. This may sound restrictive,\
    \ but it is usually what you need in most applications. For example, if you are\
    \ driving a pair of servo motors, from one A and from B, then the frequency of\
    \ both has to be set to 50Hz and you can vary the duty cycle of each independently.\n\
    \nThis, however, does raise a small problem in setting the duty cycle depends\
    \ on knowing the wrap value and that could have been set at some other time. One\
    \ solution is to read the wrap register, but the SDK doesn't currently have a\
    \ function to do this Fortunately it is very easy to\n\n```\nuint32_t pwm_get_wrap(uint\
    \ slice_num){\n    valid_params_if(PWM, slice_num >= 0 &&\n        slice_num <\
    \ NUM_PWM_SLICES);\n    return pwm_hw->slice[slice_num].top;\n}\n```\n\nUsing\
    \ this you can set a duty cycle without setting the wrap or the clock divider,\
    \ for example:\n\n```\nint d=25;\npwm_set_chan_level(slice_num, pwm_get_wrap(slice_num)\
    \ * d / 100);\n```\n\nand you can easily create a function to set the duty cycle:\n\
    \n```\nvoid pwm_set_duty(uint slice_num, uint chan, int d)\n{\n    pwm_set_chan_level(slice_num,chan,pwm_get_wrap(slice_num)*d/100);\n\
    }\n```\n\nUsing this is very easy, for example:\n\n```\npwm_set_duty(slice_num,\
    \ chan, 50);\n```\n\nsets 50% duty cycle without changing the frequency or explicitly\
    \ stating the wrap in use."
  merge: -1
  pgno: 122
- img_proc: true
  md: "Just to demonstrate that two PWM lines can be used independently of one another,\
