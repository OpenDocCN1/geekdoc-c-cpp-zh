    \n```\nstatic bool uart_is_writable (uart_t *uart)\nstatic bool uart_is_readable\
    \ (uart_t *uart)\n```\n\nwhich returns true if you can safely send or receive\
    \ a single item of data.\nNotice that it isn't safe to assume that you can send\
    \ or receive more than\none item of data.\n\nYou want to set a timeout for a read\
    \ use:\n\n```\nbool uart_is_readable_within_us (uart_t *uart, uint32_t us)\n```\n\
    \nwhich returns true if there is data to read in the buffer or false if it times\
    \ out\nafter microseconds. Despite returning a bool, this gives the number of\n\
    characters waiting in the queue.\n\nIn the case of transmit you can test to see\
    \ if there is space in the FIFO buffer\nfor a single element using:\n\n```\nstatic\
    \ bool uart_is_writable (uart_t *uart)\n```\n\nThere are two less-used functions:\n\
    \n```\nuart_tx_wait_blocking (uart_t *uart)\nuart_default_tx_wait_blocking (void)\n\
    ```\n\nwhich wait until the FIFO is empty, i.e. all the data has been sent and\n\
    resumably. The second function defaults the UART, see for later.\n\nIt is easy\
    \ to see that you can use these functions to write polling loops\ntest if there\
    \ is anything to read or any space to send data. For example:\n\n```\nuint8_t\
    \ RecData[1];\n{\n    if (uart_is_readable(uart1))\n        uart_read_blocking(uart1,\
    \ RecData, 1);\n        printf(\"%c\", RecData[0]);\n    }\n}\n```\n\nThe advantage\
    \ of this loop is that you can do other work within the\nloop and check that hasn't\
    \ been waiting too long."
