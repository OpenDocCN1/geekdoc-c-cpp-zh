- img_proc: true
  md: '# MOSFET Driver


    There are many who think that the FET (Field Effect Transistor) or more precisely
    the MOSFET (Metal Oxide Semiconductor FET) is the perfect amplification device
    and we should ignore BJTs. They are simpler to understand and use, but it can
    be more difficult to find one with the characteristics you require.


    Like the BJT, a MOSFET has three terminals called the gate, drain and source.
    The current that you want to control flows between the source and drain and it
    is controlled by the gate. This is analogous to the BJT''s base, collector and
    emitter, but the difference is that it is the voltage on the gate that controls
    the current between the source and drain.


    The gate is essentially a high resistance and very little current flows in it.
    This makes it an ideal way to connect a GPIO line to a device that needs more
    current or drain. When the gate voltage is low the source drain current is very
    small. When the gate voltage reaches the threshold $V_{GSth}$, the source drain
    starts to increase exponentially. Basically, when the gate is connected to 0V
    or below $V_{GSth}$ the MOSFET is off and when it is above $V_{GSth}$ the MOSFET
    turns on, but as the voltage below which it is turned off.


    The problem is that the gate voltage to turn a typical MOSFET fully is in the
    region of 10V. Special "logic" MOSFETs need a gate voltage around 5V to fully
    turn on and this makes the 3.3V at which the Pico''s GPIO lines work a problem.
    The datasheets generally use voltage that it produces, usually on the resistance
    and the minimum gate voltage as Drain-Source-State Resistance. For digital work
    this is a more important parameter than the gate threshold voltage.


    You can deal with this problem in one of two ways – ignore it or find a MOSFET
    with a very small $V_{GSth}$. In practice MOSFETs with thresholds low to work
    at 3.3V are hard to find and when you do find they are generally only available
    as surface-mount. Ignoring the problem works if you can tolerate the MOSFET not
    being fully. If the current is kept low, even though the MOSFET might have a resistance
    of a few ohms, the power loss and voltage drop may be acceptable.


    What MOSFETs are useful for in connecting higher voltages to a GPIO line used
    as an input – see later.


    Also note that this discussion has been in terms of an N-channel MOSFET. A P-channel
    works in the same way, but with all polarities reversed. It is cut off when the
    gate is the positive voltage and when the gate is grounded. This is exactly the
    same as the NPN versus PNP behavior for the BJT.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# MOSFET LED


    A BJT is the easiest way to drive an LED, but as an example of using a common
    MOSFET we can arrange to drive one using a 2N7000, a low-cost, N-channel device
    available in a standard TO92 form factor suitable for experimentation:


    ![](img/470d59c61482018b86da50823ee18a57_70_0.png)


    Its datasheet states that it has a VGS(thb) typically 2V, but it could be as low
    as 0.8V or as high as 3V. Given we are trying to work with a gate voltage of 3.3V
    you can see that in the worst case this is hardly going to work – the device will
    only just turn on. The best you can do is to buy a batch of 2N7000 and measure
    their VGS(thb) to weed out any that are too high. This said, in practice the circuit
    given below does generally work.


    Assuming a VGS(thb) of 2V and a current of 20mA for the LED the datasheet gives
    a rough value of 6Ω for the on resistance with a gate voltage of 3V. The calculation
    for the current-limiting resistor is the same as in the BJT case and the final
    circuit is:


    ![](img/470d59c61482018b86da50823ee18a57_70_1.png)'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'Notice that we don''t need a current-limiting resistor for the GPIO line as
    the gate connection is high impedance and doesn''t draw much current. In practice,
    it is usually a good idea to include a current-limiting resistor in the GPIO line
    if you plan to switch it on and off rapidly. The problem is that the gate looks
    like a capacitor and fast changes in voltage can produce high currents. Notice
    that there are likely to devices labeled 2N7000 that will not work in this circuit
    due to the threshold gate voltage being too high, encountering one is rare.


    A logic-level MOSFET like the IRLZ44 has a resistance of 0.028Ω at 5V compared
    to the 2N2222s of 6Ω. It also has a VGS(th) guaranteed to be between 1V and 2V.
    It would then be a better candidate for this circuit.


    # Setting Drive Type


    The GPIO output can be configured into one of a number of modes, but the most
    important is pull-up/down. Before we get to the code to do the job it is worth
    spending a moment explaining the three basic output modes, pushpull, pull-up and
    pull-down.


    # Push-Pull Mode


    In push-pull mode two transistors of opposite polarity, one PNP and one NPN, are
    used:


    ![](img/470d59c61482018b86da50823ee18a57_71_0.png)


    The circuit behaves like the two-switch equivalent shown on the right. Only one
    of the transistors, or switches, is "closed" at any time. If Q1 is saturated and
    the output is connected to ground - exactly as if S1 was closed. If the input
    is low then Q2 is saturated and it is as if S2 was closed and the output is connected
    to 3.3V. You can see that this pushes the output line high with the same "force"
    as it pulls it low. This is the standard configuration for a GPIO output.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Pull-Up Mode


    In pull-up mode one of the transistors is replaced by a resistor:


    ![](img/470d59c61482018b86da50823ee18a57_72_0.png)


    In this case the circuit is equivalent to having a single switch. When the switch
    is closed, the output line is connected to ground and hence driven low. When the
    switch is open, the output line in this case the degree of pull-down is greater
    than the pull-up, where the current is limited by the resistor. The advantage
    of this mode is that it can be used in an AND configuration. If multiple GPIO
    or other lines are connected to the output, then any one of them being low will
    pull the output line low. Only when all of them are off the resistor succeed in
    pulling the line high. This is used, for example, in a serial bus configuration
    like the I2C bus.


    # Pull-Down Mode


    Finally the pull-down mode, which is the best mode for driving general loads,
    motors, LEDs, etc, is exactly the same as the pull-up now it is used to pull the
    output line low.


    ![](img/470d59c61482018b86da50823ee18a57_72_1.png)


    The line is held high by the transistor and pulled low by the resistor only when
    all the switches are open. Putting this the other round, the line is high if any
    one switch is closed. This is the OR version of the shared bus idea.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Setting Output Mode


    To set the mode for a GPIO line there are three functions:

    gpio_pull_down (uint gpio)

    gpio_pull_up (uint gpio)


    and:


    gpio_set_pulls (uint gpio, bool up, bool down)


    By default the line is configured as input with a pull-down between 50kΩ and 80kΩ
    enabled. The pull-up resistance is also between 50kΩ and 80kΩ. Notice that the
    set_pulls function allows you to set up and down with the result that both pull-up
    and pull-down resistors are enabled.


    If you want a pure push-pull mode you can turn off the resistors using:

    gpio_disable_pulls (uint gpio)


    Finally, you can test to see if a GPIO line is in pull-up or pull-down mode:


    ```

    static bool gpio_is_pulled_up (uint gpio)

    static bool gpio_is_pulled_down (uint gpio)

    ```


    # Basic Input Circuit - The Switch


    Now it is time to turn our attention to the electrical characteristics of GPIO
    lines as inputs. One of the most common input circuits is the switch or button.


    Many beginners make the mistake of wiring a GPIO line to a switch something like:


    ![](img/470d59c61482018b86da50823ee18a57_73_0.png)


    The problem with this is, if the switch is pressed, the GPIO line is connected
    to ground and will read as zero. The question is, what does it when the switch
    is open? A GPIO line configured as an input without pull up or pull down enabled
    has a very high resistance. It isn''t connected to any'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'particular voltage and the voltage on it varies due to the static it picks
    up. The jargon is that the unconnected line is “floating”. When the switch is
    open the line is floating and if you read it the result, zero or one, depends
    on whatever noise it has picked up.


    The correct way to do the job is to tie the input line either high or low when
    the switch is open using a resistor. A pull-up arrangement would be something
    like:


    ![](img/470d59c61482018b86da50823ee18a57_74_0.png)


    The value of the resistor used isn''t critical. It simply pulls the GPIO line
    high when the switch isn''t pressed. When it is pressed a current of a little
    more than 0.3mA flows in the resistor. If this is too much, increase the resistance
    to 100kΩ or even more - notice that the higher resistor value the noisier the
    input to the GPIO and the more it is susceptible to RF interference. Notice that
    this gives a zero when the switch is pressed.


    If you want a switch that pulls the line instead of low, reverse the logic by
    swapping the positions of the resistor and the switch in the diagram to create
    a pull-down:


    ![](img/470d59c61482018b86da50823ee18a57_74_1.png)


    Notice that this gives a one when the switch is pressed.


    The good news is that the Pico defaults to an input configuration with a pull-down
    resistor of around 50k which means you can connect a switch directly to a default
    GPIO line and it will give a one when the switch is pressed.'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Debounce


    Although the switch is the simplest input device, it is very difficult to get
    right. When a user clicks a switch of any sort, the action isn''t clean - the
    switch bounces. What this means is that the logic level on the GPIO line goes
    high low and high again and bounces between the two until it settles down. There
    are electronic ways of debouncing switches, but software does the job much better.
    All you have to do is insert a delay of a millisecond or so after detecting switch
    press and read the line again - if it is still low then record a switch press.
    Similarly, when the switch is released, read the state twice with a delay. You
    can vary the delay to modify the perceived characteristics of the switch.


    A more sophisticated algorithm is based on the idea of integration to debounce
    a switch, every few milliseconds say, and keep a running sum of values. If you
    sum ten values each time a total of 6 and 10 can be taken as an indication that
    the switch is high. A total less than this indicates that the switch is low. You
    can think of this as a majority vote in the time period for the switch being high
    or low.


    # The Potential Divider


    If you have an input that is outside of the range of 0V to 3.3V then you can reduce
    it using a simple potential divider. In the diagram V is the input from the external
    logic and Vout is the connection to the GPIO input line:


    ![](img/470d59c61482018b86da50823ee18a57_75_0.png)


    Vout = V R2/ (R1+R2)


    You can spend a lot of time on working good values of R1 and R2. For loads that
    take a lot of current you need R1+R2 to be small and divided in the same ratio
    as the voltages.'
  merge: -1
  pgno: 75
- img_proc: true
  md: 'For example, for a 5V device R1=18KΩ or 20KΩ R2=33KΩ work well to drop the
    voltage to 3.3V.


    A simpler approach that works for a 5V signal is to notice that the ratio R1:R2
    has to be the same as (5-3.3):3.3, the voltage divides itself across the resistors
    in proportion to their value, which is roughly 1:2. What this is that you can
    take any resistor and use it for R1 and use two of the same value in series for
    R2 and the Vout be 3.3V.


    The problem with a resistive divider is that it can run off fast pulses due to
    the small capacitive effects. This usually isn''t a problem, but if it is then
    the solution to use a FET or a BJT as an active buffer:


    ![](img/470d59c61482018b86da50823ee18a57_76_0.png)


    Notice that this is an inverting buffer, the output is low when the input is high,
    but you usually ignore this and simply correct it in software, i.e. read a 1 as
    a low state and a 0 as a high state. The role of R1 is to make sure the FET is
    off when the 5V signal is absent and R2 limits the current in the FET to be about
    0.3mA. In most cases you should try the simple voltage divider and move to an
    active buffer if it doesn''t work.


    This basic look at electronics isn''t all that you need to know, but it is enough
    for you to see some of the problems and find some answers. In general, this sort
    of electronics is all about making sure that voltages and currents are within
    limits. As switching speeds increase you have additional problems, which are mainly
    concerned with making sure that your circuits aren''t slowing things down. This
    is where things get more subtle.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# Summary


    +   You can get a long way with only a small understanding of electronics, but
    you need to know enough to protect the Pico and things you connect to it.


    +   The maximum current from any GPIO line should be less than 12mA and the total
    current should be less than 30mA.


    +   All of the GPIO lines work at 3.3V and you should avoid connecting any other
    voltage.


    +   You can drive an LED directly from a GPIO line, but only at 16mA rather than
    the nominal 20mA needed for full brightness.


    +   Calculating a current-limiting resistor always follows the same steps- find
    out the current in the device, find out the voltage across the device and work
    out the resistor that supplies that current when the remainder of the voltage
    is applied to it.


    +   For any load you connect to a GPIO output, you generally need a current-limiting
    resistor.


    +   In many cases you need a transistor, BJT, to increase the current supplied
    by the GPIO line.


    +   To use a BJT you need a current-limiting resistor in the base and generally
    one in the collector.


    +   MOSFETs are popular alternatives to BJTs, but it is difficult to find a MOSFET
    that works reliably at 3.3V.


    +   GPIO outputs can be set to activate push-pull mode, where a transistor is
    used to pull the line high or low, or passive pull-up or pull-down mode, where
    one transistor is used and a resistor pulls the line high or low when the transistor
    is inactive.


    +   GPIO lines have built-in pull-up and pull-down resistors which can be selected
    or disabled under software control.


    +   When as inputs, GPIO lines have a very high resistance and in most cases you
    need pull-up or pull-down resistors to stop the line floating.


    +   The built-in pull-up or pull-down resistors can be used in input mode. Mechanical
    input devices have to be debounced to stop spurious input.


    +   If you need to connect an input to something bigger than 3.3V then you need
    a potential divider to reduce the voltage back to 3.3V. You can also use a transistor.'
  merge: -1
