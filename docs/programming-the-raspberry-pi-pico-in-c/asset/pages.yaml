    \ data:\n\n```\nuint16_t wBuffer[1] = {0AA};\nuint16_t rBuff[1];\nt n = spi_write16_blocking(spi0,\
    \ wBuff, rBuff, 1);\n```\n\nFinally we close the bus:\n\n```\nspi_init(spi0);\n\
    ```\n\nPutting all of this gives us the complete program (remember to add\nhardware_spi\
