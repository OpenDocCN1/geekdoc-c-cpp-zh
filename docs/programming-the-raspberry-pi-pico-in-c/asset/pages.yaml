    \ you need to do\nsimple I/O with a single GPIO line.\n\n# Blinky Revisited\n\n\
    We have already written the customary Blinky program as part of getting\nstarted\
    \ but a real program to flash an LED should use a general I/O line and\nan external\
    \ LED. With this in mind let's flash an LED connected to GP22.\n\nThen enter the\
    \ program:\n\n```\n#include \"pico/stdlib.h\"\nint main()\n{\n    gpio_init(22);\n\
    \    gpio_set_dir(22, true);\n    while (true)\n{\n        gpio_put(22, 1);\n\
    \        sleep_ms(1000);\n        gpio_put(22, 0);\n        sleep_ms(1000);\n\
    \    }\n}\n```\n\nThis uses the same CMakeLists.txt file as blinky in the previous\
    \ chapter and\nt same launch.json file. The only difference is that now we are\
    \ using\nGP22. The program also doesn't use any constants in order to make what\
    \ is\nhappening clearer. It first initializes GP22, which sets it to an input,\
    \ then\nit to an output and sets it repeatedly high and low."
