- img_proc: true
  md: "Now we come to a subtle point. What is the difference between transferring\
    \ multiple bytes and simply sending the bytes individually using multiple transfer\
    \ calls? The answer is that each time you make a transfer call the chip select\
    \ line should be activated, the data transferred and then deactivated. Using the\
    \ buffer transfers, the chip select can be left active for the entire transfer,\
    \ i.e. it's not necessary to deactivate between each byte. Sometimes this difference\
    \ isn't important and you can transfer three bytes using three calls, or just\
    \ one, to a function. However, some slaves will abort the current byte operation\
    \ if the chip select is deactivated in the middle of a multibyte transfer. As\
    \ the Pico requires you to activate and deactivate the chip select line manually,\
    \ it is up to you to make the distinction between single and multibyte transfers.\n\
    \nIt is important to realize that the nature of the transfer is that the first\
    \ element is sent at the same time that the first element is received. That is,\
    \ unlike other protocols, the whole of the send buffer isn't sent before the received\
    \ data comes back. The entire transfer works a element at a time – the first element\
    \ is sent while the first element is being received, then the second element is\
    \ sent at the same time as the second element is being received and so on. Not\
    \ fully understanding this idea can lead to some interesting bugs.\n\n# Loopback\
    \ Example\n\nBecause of the way data is transferred on the SPI bus, it is very\
    \ easy to test that everything is working without having to add any components.\
    \ All you have to do is connect MOSI to MISO so that anything is also received\
    \ in a loopback mode.\n\nFirst we have select which pins to use and this is fairly\
    \ arbitrary for this stage we may as well use:\n\n```\nSPI0  MISO GP4  pin 6\n\
    \      SCLK GP6  pin 9\n      MOSI GP7  pin 10\n```\n\nWe can ignore the CS line\
    \ at the moment as it isn't used in a loopback.\nFirst connect pin 6 to pin 10\
    \ using a jumper wire and start a new project.\n\n![](img/470d59c61482018b86da50823ee18a57_185_0.png)"
