- img_proc: true
  md: "The most basic ATWiFi function is simply:\n\n```\nint ATWiFi()\n{\n    uint8_t\
    \ SendData[] = \"AT\\r\\n\";n    uart_write_blocking(uart1, SendData, 4);\n  \
    \  return 9;\n}\n```\n\nThis is the most basic form of function that will do the\
    \ job, it isn't really practical. We need to check that it works and get some\
    \ feedback by reading the data from the device.\n\nThe following function attempts\
    \ to read a block of data from the device:\n\n```\nint getBlock(uint8_t buf[],\
    \ int len)\n{\n    int count = 0;\n    while (count < len - 1)\n    {\n      \
    \  if (uart_is_readable_within_us(uart1, 10000))\n        {\n            buf[count++]\
    \ = uart_getc(uart1);\n            if (Debug)\n                uart_putc(uart0,buf[count-1]);\n\
    \        }\n        else\n        {\n            break;\n        }\n    }\n  \
    \  buf[count] = 0;\n    return count;\n}\n```\n\nThe uart_readable_within_us function\
    \ is used to set an inter-character timeout of 0.1s. That is, if no data is received\
    \ after 0.1s it is assumed that this is the end of the transaction. The timeout\
    \ is enough for more than 500 characters at 115200 baud and 100 at 9600 baud.\
    \ Typical responses are a few hundred bytes, using a buffer 512 bytes in size\
    \ is reasonable.\n\nThe next function attempts to read a full buffer of data.\
    \ Notice that there might not be a full when the call is made, but as long as\
    \ the data is coming in gaps shorter than 0.1s between characters it will continue\
    \ until the buffer is full. Notice that a zero byte is added to the buffer so\
    \ that it can be treated like a valid C string and gives the length of the string,\
    \ not including the zero."
