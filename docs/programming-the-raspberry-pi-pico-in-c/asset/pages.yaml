- img_proc: true
  md: 'If you experiment with this program you will discover that the interrupts are
    being cleared so that you don''t get an immediate call of the interrupt handler
    on its return. You also don''t get an interrupt during the interrupt handler.
    Part of the reason for this is that the SDK doesn''t deliver the interrupt mechanism
    directly. It sets up its IRQ handler, which does the housekeeping and then calls
    your IRQ handler:


    ```

    static void gpio_irq_handler(void) {

    io_irq_ctrl_hw_t *irq_ctrl_reg = get_core_num() ?

    obank0hw->proc1_irq_ctrl : &obank0hw->proc0_irq_ctrl;


    for (uint gpio = 0; gpio < NUM_BANK0_GPIOS; gpio++) {

    io_wr_32 *status_reg = &irq_ctrl_base->ints[gpio / 8];

    events = (*status_reg >> 4 * (gpio % 8)) & 0xf;


    if (events) {

    // TODO: If both cores care about this event then

    // the second core won''t get the irq;

    gpio_acknowledge irq(gpio, events);

    gpio_irq_callback_t callback = callbacks[get_core_num()];


    if (callback) {

    callback(gpio, events);

    }

    }

    }

    ```


    The most interesting part of this function is the for loop loop which tests each
    GPIO line''s IRQ status register to discover if it caused an interrupt. For each
    GPIO line it detects as causing an interrupt, it resets the interrupt and then
    calls the IRQ handler with the number of that GPIO line and the event. This means
    that you don''t have to reset the IRQ in your owner routine, but notice that the
    loop takes time to scan through the GPIO registers and your IRQ handler will be
    called for each GPIO line that caused an interrupt. This may change in the future.'
  merge: -1
