- img_proc: true
  md: 'A complete CMakeLists.txt for a project called pioBlinky with the main C

    program in pio.c and the assembler in sqwave.pio.h is:

    make_minimum_required(VERSION 3.13)


    set(CMAKE_C STANDARD 11)

    set(CMAKE_CXX_STANDARD 17)


    include(pico_sdk_import.cmake)

    pico_sdk_init()


    project(pioBlinky CXX ASM)

    add_executable(pio)

    pio.c


    pio_generate_pio_header(pio ${CMAKE_CURRENT_LIST_DIR}/sqwave.pio)


    target_link_libraries(pio pico_std_sdk hardware_pio)

    pio_add_extra_outputs(pio)


    Remember you also need to copy pico_sdk_import.cmake into the folder.

    Now all we need a C program to make use of the assembler – load it and

    set the state machine running. We have to include the header file that the

    assembler generated:


    #include "sqwave.pio.h"


    This adds the definition of the machine code to your program:

    static const uint16_t sqwave_program_instructions[] =


    ```

    //

    //wrap_target

    0xe001, // 0: set pindirs, 1

    0xe001, // 1: set pins, 1

    0xe000, // 2: set pins, 0

    0xe001, // 3: jump 1

    //

    //wrap

    ```


    You could write some code to load the contents of the array into PIO, but

    the header file also creates a struct that can be passed to an SDK function that

    will load the code for you:


    ```

    static struct pio_program sqwave_program = {

    .instructions = sqwave_program_instructions,

    .length = 4,

    .origin = -1,

    ```


    ;'
