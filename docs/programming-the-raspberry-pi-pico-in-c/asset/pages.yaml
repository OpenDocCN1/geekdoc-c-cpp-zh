- img_proc: true
  md: 'If you try this out you will see the LED slowly increase in brightness, but
    there seems to be a longer time that it is at maximum brightness than any other
    value. This is a consequence of the non-linear relationship between duty cycle
    and perceived brightness.


    By changing the duty cycle of the PWM pulse train you can set the amount of power
    delivered to an LED, or any other device, hence change its brightness. If you
    use a 50% duty cycle, the LED is on 50% of the time and it has been determined
    that this makes it look as if it is half as bright. However, this is not the end
    of the story as humans do not respond to physical brightness in a linear way.
    The Weber-Fechner law gives the general relationship between perceived intensity
    and physical stimulus as logarithmic.


    In the case of an LED, the connection between duty cycle and brightness is a complicated
    matter, but the simplest approach uses the fact that the perceived brightness
    is roughly proportional to the cube root of the physical brightness. The exact
    equations, published by CIE 1931, are:


    ```

    $L = 903.3 \cdot (Y/Y_n) \le 0.008856$

    ```


    ```

    $L = 116 \cdot (Y/Y_n)^{1/3} - 16 \quad (Y/Y_n) > 0.008856$

    ```


    where L is the perceived brightness and $Y/Y_n$ is a measure of physical brightness.


    The exact relationship is complicated, but in most cases a roughly cubic law,
    obtained by inverting the CIE relationship, can be used:

    $d=kb^3$


    where b is the perceived brightness and d is the duty cycle. The constant k depends
    on the LED. The graph shows the general characteristic of the relationship for
    a duty cycle of 0 to 100% on the y-axis and arbitrary, 0 to 100, perceived brightness
    units on the x-axis.


    ![](img/470d59c61482018b86da50823ee18a57_134_0.png)'
  merge: -1
  pgno: 134
- img_proc: true
  md: "Notice that, as the LED is powered by a PWM signal is either full on or full\
    \ off, there is no effect in the change in LED light output with current - the\
    \ LED is always run at the same current.\n\nWhat all of this means is that if\
    \ you want an LED to fade in a linear fashion you need to change the duty cycle\
    \ in a non-linear fashion. Intuitively it means that when the duty cycle is small\
    \ produce bigger changes in brightness than when the duty cycle is large.\n\n\
    ```\n#include <pico/stdlib.h>\n#include \"hardware/pwm.h\"\nint main() {\n   \
    \ gpio_set_function(25, GPIO_FUNC_PWM);\n    uint slice_num = pwm_gpio_to_slice_num(25);\n\
    \    uint chan = pwm_gpio_to_channel(25);\n\n    pwm_set_frequency(slice_num,\
    \ chan, 2000, 0);\n\n    pwm_set_enabled(slice_num, true);\n    int d = 0;\n \
    \   while (true) {\n        for (int b = 0; b <= 100; b++) {\n            d =\
    \ (b * b * b) / 10000;\n            pwm_set_duty(slice_num, chan, d);\n      \
    \      sleep_ms(50);\n        }\n    }\n}\n```\n\nIf you try this out should notice\
    \ that the LED changes brightness evenly across its range. Only 100 steps isn't\
    \ enough to mask the steps in brightness at the lower level. The solution is to\
    \ work with a more precise specification of duty cycle.\n\nIn most cases it is\
    \ irrelevant exactly how the response of the LED is - a rough approximation which\
    \ looks smooth to the human eye. You can even get away using a square to dim the\
    \ LED. The only exception is when you are trying to drive LEDs to a gray-level\
    \ or color display when color calibration is another level of accuracy.\n\nThere\
    \ is also the question of what frequency we should use. Clearly it has to be fast\
    \ enough not to be seen as flickering and generally means it has to be greater\
    \ than 80Hz, the upper limit for human flicker fusion, but because of the strobe\
    \ effect flickering becomes more visible in connection with moving"
