  md: '# # Chapter 11

    A-To-D and The SPI Bus


    The SPI bus can be difficult to work at first, but once you know what to look
    for how the slave claims to work it gets easier. To demonstrate how it is done,
    let''s add eight channels of 12-bit A-to-D using the MCP3008.

    Pico has a single A-to-D Converter (ADC) with analog inputs, four of which can
    be used via external pins. Before moving on inputs to look at the use of SPI to
    add more A-to-D converters, let''s take a look at those the Pico already has.
    If you are only interested in the detail of using the SPI bus, skip to that section.


    # ## Pico ADC


    The Pico has a single onboard ADC which has four multiplexed inputs. Three are
    available on the external pins and one is used for an internal temperature sensor.
    You can see from the diagram that pins GP26, GP27, GP28 and GP29 can be used as
    analog inputs.


    ![](img/470d59c61482018b86da50823ee18a57_198_0.png)


    199'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'The ADC is a successive approximation converter. You don''t need to know how
    it works to use it, but it isn''t difficult to understand. The input voltage is
    compared to a standard voltage, VREF. The idea is that first a voltage equal to
    VREF/2 is generated and the input voltage is compared to this. If it is lower
    then the most significant bit is a 0 and if it is equal or greater then it is
    a 1. At the next step the voltage generated is VREF/2 + VREF/4 and the comparison
    is repeated to generate the next bit. Success approximation converters are easy
    to build, but they are slow. The Pico''s ADC needs 96 clock cycles to create a
    12-bit result, which gives a maximum sampling rate of 500ks/S with a default clock
    of 48MHz.


    ![](img/470d59c61482018b86da50823ee18a57_199_0.png)


    The Pico''s ADC is very useful, but it isn''t as accurate as you might hope. Although
    it has 12 bits, the claimed effective accuracy is only 9 bits and most of this
    loss of precision is due to the way reference voltage is supplied and to noise
    due to its integration with other digital devices. According to the documentation,
    you can improve the accuracy by modifying the reference voltage:


    For improved ADC performance, an external 3.0V shunt reference, such as LM4040,
    can be connected from the ADC_VREF pin to ground. Note that if doing this the
    ADC range is limited to 0-3.0V signals (rather than 0-3.3V), and the shunt reference
    will draw continuous current through the 200R resistor (3.3V-3.0V)/200 ~1.5mA.'
  merge: -1
  pgno: 199
- img_proc: true
  md: "The ADC can be set to do conversions continuously, reading each of the possible\
    \ inputs in a round-robin fashion, storing the results in an 8-deep FIFO\nthe\
    \ documentation says 4-deep) buffer. Alternatively, you can simply start a conversion\
    \ on a given input when you need the data.\n\nThe simplest way of using the ADC\
    \ is to perform a single read of a single input using software control. Before\
    \ making use of it, you have to initialize it:\nadc_init (void)\n\nYou also have\
    \ to initialize the pins you are going to use in a special analog input mode:\n\
    adc_gpio_init (uint gpio)\n\nand select the ADC input used with that GPIO line:\n\
    adc_select_input (uint input)\n\nYou can include the internal temperature sensor\
    \ as an input using:\nadc_set_temp_sensor_enabled(bool enable)\n\nOnce you have\
    \ selected the input you are going to read, you can start a\nconversion and get\
    \ the result:\nstatic uint16_t adc_read(void)\n\nThe simplest A-to-D program you\
    \ can write is:\n#include <stdio.h>\n#include \"pico/stdlib.h\"\n#include \"hardware/adc.h\"\
    \nint main()\n{\nstdio_init_all();\nadc_init();\nadc_gpio_init(26);\nadc_gpio_init(27);\n\
    \nwhile (1) {\nconst float conversion_factor = 3.3f / (1 << 12);\nadc_select_input(0);\n\
    int16_t result = adc_read();\nprintf(\"Raw value 0: 0x%03x, voltage: %f V\\n\"\
    ,\n\tresult, result * conversion_factor);\nadc_select_input(1);\nresult = adc_read();\n\
    printf(\"Raw value 1: 0x%03x, voltage: %f V\\n\",\n\tresult, result * conversion_factor);\n\
    sleep_ms(500);\n}"
