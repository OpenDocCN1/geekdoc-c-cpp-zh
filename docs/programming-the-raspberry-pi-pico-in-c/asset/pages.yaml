- img_proc: true
  md: "The initialization program is the only function of additional interest as of\
    \ the rest of the program follows the previous example. The function dhtInitialize(PIO\
    \ pio, int gpio) sets the clock frequency so that instructions take 2us. This\
    \ gives a count in the region of 4 to 13 and the threshold is set accordingly.\
    \ At this clock speed, you also need to set the x register to 1000 to get the\
    \ 1ms initialization pulse. It sets the auto-push to 32 bits and a right shift.\
    \ Notice that as well the SET and IN groups, you have to set the jump pin to the\
    \ GPIO line being used or the counting loop does work.\n\nThe PIO program is:\n\
    \n```\n.program dht\n  set pins, 1\n  set pindirs, 1\nagain:\n  pull block\n \
    \ set pins, 0\n  osr\nmov x, osr\nloop1:\n  jmp x--,loop1\n  set pindirs, 0\n\
    \  wait 1 pin 0\n  wait 0 pin 0\n  wait 1 pin 0\n  wait 0 pin 0\n  set y,31\n\
