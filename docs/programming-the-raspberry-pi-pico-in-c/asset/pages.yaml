  md: '# Basic GPIO Functions


    There are a great GPIO functions provided by the SDK, but the most basic are those
    that let you work with a single GPIO line. You refer to all GPIO lines by their
    number – a simple integer. There are four important functions when you are using
    GPIO lines starting with:


    ```

    void gpio_init (uint gpio)

    ```


    This initializes a single line to work as a software controlled GPIO line (GPIO_FUNC_SIO).
    It is also set to input, which is a safe option from the hardware point of view


    If you want to set a line to any of the possible modes then you use:


    ```

    void gpio_set_function (uint gpio, enum gpio_function fn)

    ```


    where gpio_function is one of:


    | | |

    |---|---|

    | GPIO_FUNC_XIP | Special function for QSPI pins |

    | GPIO_FUNC_SPI | SPI bus |

    | GPIO_FUNC_UART | UART |

    | GPIO_FUNC_I2C | I2C bus |

    | GPIO_FUNC_PWM | PWM |

    | GPIO_FUNC_SIO | Software IO control |

    | GPIO_FUNC_PI00 | Programmable IO control |

    | GPIO_FUNC_PI01 | Programmable IO control |

    | GPIO_FUNC_GPCK | GPIO Clock |

    | GPIO_FUNC_USB | USB |

    | GPIO_FUNC_NULL |


    Not that all GPIO lines can be set to any particular function.


    The gpio_init_function leaves the line set as an input. To explicitly set a line
    to input or output you can use:


    ```

    static void gpio_set_dir (uint gpio, bool out)

    ```


    with out set to true for output and false for input.'
