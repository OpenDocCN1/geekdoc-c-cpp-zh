- img_proc: true
  md: "# Bidirectional Motor Software\n\nWe can easily extend the Motor struct and\
    \ its functions to work with a bidirectional motor. The only real difference is\
    \ that now we have to use two GPIO lines and these are most easily used if they\
    \ are the A and B channels of the same slice – for simplicity the code doesn't\
    \ check this condition. For forward we activate the first GPIO line and for reverse\
    \ we activate the second (remember to add hardware_pwm to the CMakeLists.txt file\
    \ and the functions from the previous chapter):\n\n```\ntypedef struct {\n   \
    \ uint gpioForward;\n    uint gpioBackward;\n    uint slice;\n    uint Fchan;\n\
    \    uint Bchan;\n    bool forward;\n    uint freq;\n    uint resolution;\n  \
    \  bool on;\n} BiMotor;\n```\n\n```\nvoid BiMotorInit(BiMotor *m, uint gpioForward,\
    \ uint gpioBackward, uint freq) {\n    gpio_set_function(gpioForward, GPIO_FUNC_PWM);\n\
    \    m->gpioForward = gpioForward;\n    m->slice = pwm_gpio_to_slice(gpioForward);\n\
    \    m->Fchan = pwm_gpio_to_channel(gpioForward);\n\n    gpio_set_function(gpioBackward,\
    \ GPIO_FUNC_PWM);\n    m->gpioBackward = gpioBackward;\n    m->Bchan = pwm_gpio_to_channel(gpioBackward);\n\
    \n    m->freq = freq;\n    m->speed = 0;\n    m->forward = true;\n    m->resolution\
    \ = pwm_set_freq_duty(m->slice, m->Fchan, m->freq);\n\n    pwm_set_on(m->slice,\
    \ m->Bchan, 0);\n    m->on = false;\n}\n```"
  merge: -1
  pgno: 153
- img_proc: true
  md: "```\nvoid BiMotorspeed(BiMotor *m, int s, bool forward)\n{\n    if (forward)\n\
    \    {\n        pwm_set_duty(m->slice, m->Bchan, 0);\n        pwm_set_duty(m->slice,\
    \ m->Fchan, s);\n        m->forward = true;\n    }\n    else\n    {\n        pwm_set_duty(m->slice,\
    \ m->Fchan, 0);\n        pwm_set_duty(m->slice, m->Bchan, s);\n        m->forward\
    \ = true;\n    }\n    m->speed = s;\n}\n\nvoid BiMotorOn(BiMotor *m)\n{\n    pwm_set_enabled(m->slice,\
    \ true);\n    m->on = true;\n}\n\nvoid BiMotorOff(BiMotor *m)\n{\n    pwm_set_enabled(m->slice,\
    \ false);\n    m->on = false;\n}\n\nint main()\n{\n    BiMotor mot1;\n    BiMotorInit(&mot1,\
    \ 20, 21, 2000);\n\n    BiMotorOn(mot1);\n    while (true)\n    {\n        BiMotorspeed(&mot1,\
    \ 50, true);\n        sleep_ms(2000);\n        BiMotorspeed(&mot1, 25, false);\n\
    \        sleep_ms(2000);\n    }\n\n    return 0;\n}\n```"
  merge: -1
