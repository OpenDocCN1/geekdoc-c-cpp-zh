  md: '# Chapter 3


    # Getting Started With The GPIO


    In this chapter we take a look at the basic operations involved in using the Pico''s
    General Purpose Input/Output (GPIO) lines with an emphasis on output. We will
    consider consider questions such as how fast can you change a GPIO line, how do
    you generate pulses of a given duration and how can you change multiple lines
    with each other?


    # Pico Pins


    The first thing to make ourselves familiar with the layout and range of GPIO pins
    available on a standard Pico – some compatible devices have fewer or differently
    arranged pins. The RP2040 chip has 30 GPIO lines, GP0 to GP29, of which the Pico
    makes 26 available for general use on the edge of the board. The other four are
    used internally. GP23 is used as a power control line, GP24 is used to sense the
    USB power input, GP25 powers the on-board LED and GP29 is used to measure the
    system voltage. There are also additional GPIO lines, but these are dedicated
    for use as a quad SPI bus to interface flash.


    As is the case with microprocessors, each GPIO line, with the exception of GP22,
    multiple uses as you can see in the diagram on the next page.


    You can select mode a pin is used in and for this chapter we concentrate using
    pins in the simplest GPIO mode. Even so, which pins you select for general-purpose
    should take into account what other uses you put pins to. For example, using GP26
    as a general GPIO line when you need an additional A-to-D converter, which is
    one of its alternative functions. The only pin that has no alternative function
    is GP22 and this should be your first choice for any general-purpose duties.'
  merge: -1
  pgno: 42
