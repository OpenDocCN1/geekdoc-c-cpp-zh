    \ &reading);\n  printf(\"Humidity: %f \\n\", reading.humidity);\n  printf(\"Temperature:\
    \ %f C\\n\", reading.temperature);\n  return 0;\nn\n```\n\n# ## DHT22 Using the\
    \ PIO – Counting\n\nThe DHT22 is not well suited to working with the protocol\
    \ does not use fixed time slots for each bit or synchronization via a separate\
    \ clock, two situations where it is usually possible to write compact PIO programs\
    \ to send and receive data. The DHT22 relies on the length of the slot used to\
    \ transmit a single bit to code zero or one and this means decoding is a method\
    \ of measuring the time between edges. The PIO doesn't have access to a timer\
    \ and implementing an instruction clock counter isn't straightforward – but it\
    \ can be done. The following PIO program does exactly this, but it is a long program\
    \ and it just satisfies the constraints placed on it to work. After presenting\
    \ the obvious algorithm with a slightly difficult implementation, a simpler and\
    \ more direct but less obvious method is"
