- img_proc: true
  md: "You set autopoll using the last two parameters of:\nsm_config_set_out_shift\
    \ (pico sm_config *c, bool shift_right,\nautopoll, uint pull_threshold);\n\nIf\
    \ you set autopoll to true then the OSR will be reloaded from the TX FIFO\nwhen\
    \ it contents fall below the pull_threshold.\n\nUsing this PIO program becomes:\n\
    \n```\n.program squarewave\nagain:\n  out pins,2\n  jmp again\n```\n\nOn this\
    \ occasion no attempt has been made to the OUT group of pins to\noutput - this\
    \ will be done in the C program to illustrate how this works.\n\n```\n#include\
    \ \"pico/stdlib.h\"\n#include \"hardware/pio.h\"\n#include \"sqwave.pio.h\"\n\n\
    int main() {\n  uint offset = pico_add_program(pio0, &squarewave_program);\n \
