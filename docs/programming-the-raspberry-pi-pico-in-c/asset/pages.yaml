- img_proc: true
  md: 'First we up the GPIO lines for input and output and set the outputs so that
    LED 0 is on, i.e. s = $\Theta$. Next we start the polling loop. Inside the loop
    there is a switch statement that manages three states. At the start of the loop
    the difference between the current button value and its previous value are used
    to calculate edge which is 1 when the button has changed from pressed, 1 to released,
    $\Theta$. That is, edge=1 on a down-going edge. If the button has just been pressed
    then the state is moved on to the next state, $\Theta$-1, 1-2 and 2-$\Theta$,
    and the LEDs are set to the appropriate values.


    You might wonder why all three LEDs are set and not just the two that are changing?
    There are a number of reasons including it''s easier to see what is happening
    from the code and it makes sure that all of the LEDs are in the state you intend.
    Notice that polling loop is set up to repeat every 1000$\mu$s so providing debouncing
    and a predictable service time. If you try this out you will find that the LEDs
    light up sequentially on each button press.


    Like many more advanced methods the FSM approach can make things seem more complicated
    in simple examples, but it repays the effort as soon as things get more complicated.
    A polling loop with tens of states and lots of input and outline lines to manage
    becomes impossible to maintain without some organizing principle.'
