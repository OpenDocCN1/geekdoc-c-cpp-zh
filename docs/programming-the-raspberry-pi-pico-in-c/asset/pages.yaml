- img_proc: true
  md: "# Configuring WiFi\n\nThe first thing we need to configure is the operating\
    \ mode. The ESP8266 can operate as an access point, i.e. it can allow other devices\
    \ to connect to it. However, in most cases you will want it to work in client\
    \ mode, i.e. connecting to your existing WiFi.\n\n# Mode\n\nA function to set\
    \ its operating mode is:\n\n```\nint modeWiFi(uint8_t buf[], int len, int mode)\n\
    {\n    uint8_t command[32];\n    int count = snprintf(command, 32, \"AT+CMODE_CUR=%d\\\
    r\\n\", mode);\n    uart_write_blocking(uart1, command, count);\n    return getBlock(buf,\
    \ len);\n}\n```\n\nIn this case the command is:\nAT+CMODE_CUR = n\n\nwhere n is\
    \ 1 for client, 2 for access and 3 for both. If you want to make the permanent\
    \ change CUR to DEF and the setting is stored in flash memory. Older devices do\
    \ not support CWMODE_CUR. Simply change it to CMODE, which is deprecated.\n\n\
    To set client you would call:\nmodeWiFi(buf, 512, 1);\nand see OK sent back.\n\
    \n# Scan\n\nThe scan function is that everyone wants to try out, but in practice\
    \ it's very useful. Why would you want a list of WiFi networks? There are some\
    \ applications for this function, but not as many as you might think. In cases,\
    \ you simply want to connect to a known WiFi network, which is what we do in the\
    \ next section.\n\nThe scan command is easy - just send AT+CWLAP and the device\
    \ sends you a complete list of WiFi networks. The problem is scanning takes a\
    \ long time and often hangs for a few seconds. Clearly we can't simply read a\
    \ single block of data using the getBlock function as it will time out due to\
    \ the long pauses. We need a more powerful reading function that retrieves multiple\
    \ blocks with an overall timeout."
  merge: -1
  pgno: 334
- img_proc: true
  md: "While it is doing this it might as well scan the incoming data for a target\
    \ like \"OK\" to use as a signal that it can stop blocks:\n\n```\nint getBlocks(uint8_t\
    \ buf[], int len, int num, char target[]) {\n  for (int i = 0; i < num; i++) {\n\
    \    if (uart_readable_within_us(uart1, 1000)) {\n      getBlock(buf, len);\n\
    \      if (strstr(buf, target))\n        return i;\n    }\n  }\n  return -1;\n\
    }\n```\n\nNotice that we try to retrieve a maximum of num blocks and wait 1 second\
    \ between trying each. If a block contains the target string then we return with\
    \ the number of blocks read. The getBlock function is used to get each block and\
    \ displays that it has retrieved if Debug is set to 1. In a more sophisticated\
    \ application you would probably want to concatenate the received blocks into\
    \ a single larger buffer for further processing – as written it simply throws\
    \ this away.\n\nNow we can retrieve multiple blocks we can implement the scan\
    \ function:\nscanWiFi(uint8_t buf[], int len) {\n  uint8_t SendData[] = \"AT+CWLAP\\\
    r\\n\";\n  uart_write_blocking(uart1, SendData, 18);\n  return getBlocks(buf,\
    \ len, 20, \"OK\");\n}\n\nIn this case the function is set to retrieve a maximum\
    \ of 20 blocks, which could mean waiting as long as 20 seconds for the function\
    \ to exit. However, in most cases it exits after only a small number of blocks\
    \ because it detects \"Ok\".\n\nThe getBlocks function is so useful that you might\
    \ as well go back and change the call to getBlock to getBlocks(buf,len,20, \"\
    OK\"), which will improve the reliability of the program."
  merge: -1
  pgno: 335
- img_proc: true
  md: "# Connecting to WiFi\n\nOur final, and most useful, functions connect the device\
    \ to a known WiFi network. All you have to do is supply the SSID and password.\
    \ There are other versions of the command that allow you to specify the connection\
    \ more precisely, but this general form is the most useful. Connection to a network\
    \ takes a while and there is quite lot of data sent back, so we need to use a\
    \ long timeout in the getBlocks function introduced in the scan function:\n\n\
    ```\nint connectWiFi(uint8_t buf, int len, char ssid[]) {\n    uint8_t command[128];\n\
    \    int count = sprintf(command, \"AT+CWAP_CUR=%%s\\\"%s\\\\r\\n\", ssid, pass);\n\
    \    uart_write_blocking(uart1, command, count);\n    return getBlocks(buf, len,\
    \ \"OK\");\n}\n```\n\nNotice that the sprintf function is used to insert the SSID\
    \ into the command. If you have an older device you might need to change CWAP_CUR\
    \ to the deprecated CWAP command. There is also a CWAP_DEF command that will save\
    \ the connection in the flash memory.\nThe connection is made with:\n\n```\nconnectWiFi(buf,\
    \ 512,mymyWiFi\",\"myPassword\");\n```\n\nAfter a few seconds you should see:\n\
    \n```\nAT+CWAP_CUR=myWiFi,\"myPassword\"\nWIFI CONNECTED\nWIFI GOT IP\nOK\n```\n\
    \nOnce you are connected and the \"WIFI GOT IP\" message has been received you\
    \ can ask what the IP address:\n\n```\nint getIPWiFi(uint8_t buf[], int len) {\n\
    \    uint8_t SendData[] = \"AT+CIFSR\\r\\n\";\n    uart_write_blocking(uart1,\
    \ SendData, 10);\n    return getBlocks(buf, len, 20, \"OK\");\n}\n```\n\nIf you\
    \ really need to know the IP address within a program you need to extract it from\
    \ the string. The device replies with:\n\n```\nAT+CIFSR\n+CIFSR:STAIP,\"192.168.253.4\"\
    \n+CIFSR:STAMAC,\"5c:cf:7f:16:97:ab\"\nOK\n```\n\nThis makes it very easy to get\
    \ the IP address, even without the help of a regular expression."
  merge: -1
  pgno: 336
- img_proc: true
  md: "# Getting a Web Page\n\nNow we have enough functions to tackle the two standard\
    \ tasks in using the TCP stack - getting and sending data as a client and as a\
    \ server.\n\nFirst we tackle the problem of acting as a client. This isn't as\
    \ common as a requirement you might expect most of the time devices like the Pico\
    \ are used to supply data to other servers, not the other way round. However it\
    \ is worth seeing how it is done.\n\nIt doesn't matter if you are implementing\
    \ a client or a server, either way you make use of sockets which represent the\
    \ basic TCP connection. What you do with this connection is up to you. For example,\
    \ if you send HTTP headers on an appropriate port, you can fetch or deliver a\
    \ web page, i.e. HTTP over TCP.\n\nThe first thing we have to do is set up a socket\
    \ connection between the client, i.e. the Pico, and the server.\n\n```\nint getWebPageWiFi(uint8_t\
    \ buf[], int len, char URL[], char page[])\n    uint8_t command[128];\n    int\
    \ count = snprintf(command, 128,\n\"AT+CIPSTART=TCP\\\",%s\\\",80\\r\\n\", URL);\n\
    \    uart_write_blocking(uart1, count);\n    if (getblocks(buf, len, \"OK\") <\
    \ 0)\n        return -1;\n```\n\nYou pass the URL to the function as an IP address\
    \ or as a full URL, but the device looks up domain names using a fixed set of\
    \ DNS servers. It is recommended that you use an IP address, especially when testing.\
    \ CIPSTART command opens a socket to the specified IP address and port.\n\nYou\
    \ can also specify a TCP or UDP connection in the AT command:\nAT+CIPSTART=type,\
    \ IP, port\n\nIn this case we open port 80 on the specified IP address or URL.\
    \ If it works you will get back a message like this:\n\n```\nConnect\nAT+CIPSTART=\"\
    TCP\",\"192.168.253.23\",80\nCONNECT\nOK\n```\n\nNow we have a socket open we\
    \ can send some data to the server and wait for some data to be sent back to us.\
    \ This can be a problem as you can anticipate the amount of data you get from\
    \ the web server."
  merge: -1
  pgno: 337
- img_proc: true
  md: 'For this example, the web page is served by a small sensor that returns a JSON
    temperature and Humidity reading. The sensor is another Pico running the web server
    as described in the next section.


    To send data over a socket you use CIPSEND, which will send any data you specify
    to the server. As already made clear, what you send is a matter of what protocol
    you are using over the socket. In this case it is HTTP and we are going to send
    headers corresponding to a GET request for index.html


    ```

    char http[150];

    sprint(http, "GET %s HTTP/1.1\r\nHost:%s\r\n\n", page, URL);

    ```


    This time we can''t just send the string using uart_write_blocking because we
    need to include the length of the string in the header we send to the server.


    The headers we are sending:


    ```

    GET /index.html HTTP/1.1

    Host:192.168.253.23

    ```


    Remember, an HTTP request always ends with a blank line.

    to send this we use the CIPEND command which specifies the number of characters
    that are to follow:


    ```

    count = snprintf(command, 128, "AT+CIPEND=%d\r\n", nstrlen(http));

    uart_write_blocking(uart1, command, count);

    ```


    Now we have to send the number of bytes/ characters that we specified in the CIPSEND,
    but we wait for a "> to indicate that the device is ready to receive the data:


    ```

    if (getBlocks(buf, len, 20, ">") < 0)

    return -1;

    uart_write_blocking(uart1, http, strlen(http));

    return getBlocks(buf, len, 20, "</html>");

    ```


    What happens next on the server. As a result of the HTTP GET the server will now
    send data over the WiFi link and the device will send this over the serial connection
    as it gets it. Notice that this data is not a direct response to a command and
    the device prefixes it with:


    +IPD,len:


    +IPD makes it clear that the client is a packet of data sent from the server.
    The len value gives the number of characters sent after the colon we could use
    this to work out when to stop reading data, but for simplicity we scan for "</html>"
    which is usually, but not the final tag at the end of a web page.'
  merge: -1
  pgno: 338
- img_proc: true
  md: "In principle what your program should do not sit in a polling loop looking\
    \ for +IPD. It should then read the digits between the comma and the colon and\
    \ convert this to an integer. Finally it should then read exactly that number\
    \ of characters from the serial port:\n\n```\n+IPD, 1440:HTTP/1.1 200 OK\nAccept-Ranges:\
    \ bytes\nAge: 223181\nCache-Control: max-age=604800\nContent-Type: text/html;\
    \ charset=UTF-8\nDate: Sun, 11 Apr 2021 06:40:22 GMT\nETag: \"3147526947-gzip\"\
    \nExpires: Sun, 18 Apr 2021 06:40:22 GMT\nLast-Modified: Thu, 17 Oct 2019 07:18:26\
    \ GMT\nServer: ECS (dcf/7fb83)\nVary: Accept-Encoding\nX-Cache: HIT\nContent-Length:\
    \ 1256\n+IPD, 127:<html><head><title>Temperature</title></head><body><p>{\"humidity\"\
    :0}</p></body></html>CLOSED\n```\n\nYou can see that there are three \"packets\"\
    \ of data - 1440 characters and 127 characters. In principle you could process\
    \ the +IPD characters as they come in and work out how many characters to read.\
    \ However, you still wouldn't know how many packets to expect.\n\nThe complete\
    \ function and a more general main program is:\n\n```\nint getWebPageWiFi(uint8_t\
    \ buf[], int len, char url[], char page[]) {\n\tuint8_t command[128];\n\tint count\
    \ = snprintf(command, \n\t\t\"+CIPSTART=TCP\\,\\%s\\%s,80\\r\\n\", url);\n\t\t\
    uart_write_blocking(uart1, command, count);\n\t\tif (getBlocks(buf, len, 20, \"\
    OK\") < 0) {\n\t\treturn -1;\n\t}\n\tchar http[150];\n\tsnprintf(http, \"HTTP/1.1\\\
    r\\nhost:%s\\r\\n\\r\\n\", url, page);\n\t\tcount = snprintf(command, \n\t\t\t\
    \"+CIPHERSEND=%d\\r\\n\", strlen(http));\n\t\tuart_write_blocking(uart1, command,\
    \ count);\n\t\tif (getBlocks(buf, len, 20, \">\") < 0) {\n\t\t\treturn -1;\n\t\
    }\n\t\tuart_write_blocking(uart1, http, strlen(http));\n\t\treturn getBlocks(buf,\
    \ len, 20, \"</html>\");\n}\n```"
  merge: -1
  pgno: 339
- img_proc: true
  md: "```\nint main()\n{\n    stdio_init_all();\n    initWiFi();\n    uint8 t buf[512,\
    \ 1];\n    modeWiFi(buf, 512, \"ssid\", \"password\");\n    getWebPageWiFi(buf,\
    \ 512, \"example.com\", \"/index.html\");\n    sleep_ms(1000);\n}\n```\n\nThis\
    \ program makes some of the functions given earlier: initWiFi, modeWiFi, getBlocks\
    \ and getBlock. It starts with:\n\n+   #include <stdio.h>\n#include \"pico/stdlib.h\"\
    \n#include \"hardware/gpio.h\"\n#include <string.h\">\n\n# A Web Server\n\nThe\
    \ most common for an internet connection on a small device like the Pico is to\
    \ allow another device to request data. It is fairly easy to create a web server\
    \ running on the ESP8266, but don't expect Apache or anything advanced. All you\
    \ can reasonably do is accept a connection and send a web page or two back to\
    \ the client.\n\nThe key differences between client and server mode is that in\
    \ server mode the device is constantly \"listening\" for clients to make TCP connections\
    \ on the port. When the device receives a connection it reads all of the data\
    \ client sends and passes it via the serial port to the Pico. This means that\
    \ in server mode the Pico has to be constantly on the lookout for new data from\
    \ the ESP8266. You can do this using an interrupt, but for simplicity example\
    \ uses a polling loop.\n\nThere is another difference between client mode and\
    \ server mode - there can be multiple TCP connections from many clients as try\
    \ to connect. The solution to this problem is that the ESP8266 assigns each TCP\
    \ socket connection an id number and this is what you need to make sure you send\
    \ the data to the right place."
  merge: -1
  pgno: 340
- img_proc: true
  md: "Let's see how it works. Assuming we are already connected to WiFi and have\
    \ an IP address, we can set up a server quite easily. First we need to use the\
    \ command CIPMUX=1 to set the device into multiple connection mode. You cannot\
    \ start a server if CIPMUX=0, the default single connection mode. Once multiple\
    \ connections are allowed you can create a server using CIPSERVER=1,port.\n\n\
    In this example we are using port 80, the standard HTTP port, but you can change\
    \ this to anything you want:\n\n```\nint startServerWifi(uint8_t buf[], int len)\n\
    {\n    char temp[256];\n    char id[10];\n    uart_write_blocking(uart1, \"AT+CIPMUX=1\\\
    r\\n\", 13);\n    if (getBlocks(buf, len, 10, \"OK\") < 0)\n        return -1;\n\
    \    uart_write_blocking(uart1, \"AT+CIPSERVER=1,80\\r\\n\", 19);\n    if (getBlocks(buf,\
    \ len, 10, \"OK\") < 0)\n        return -1;\n    return 0;\n}\n```\n\nIf you run\
    \ this part of the program you will see the response:\nAT+CIPMUX=1\nOK\nAT+CIPSERVER=1,80\n\
    OK\n\nNow we have to wait for a client to make a connection and send some data.\
    \ This is done by reading the serial input and checking for \"+IPD\" in an infinite\
    \ polling loop:\n\n```\nfor (;\n    if (getBlocks(1, \"+IPD\") < 0)continue;\n\
    ```\n\nIf we don't get a block containing \"+IPD\" we simply move on to the next\
    \ iteration, i.e. there is nothing to do.\n\nIf we have received a block containing\
    \ \"+IPD\", the body of the loop processes it. Note that all of the following\
    \ instructions are inside the loop and are repeated for each request for the web\
    \ page. We need to remove the IPD information. As this is C, string processing\
    \ it is not elegant. The received data has the format: \n\n```\n+IPD,id, rest\
    \ of data\n```"
  merge: -1
  pgno: 341
- img_proc: true
  md: 'We need to extract the ID, as a string, so we can use it to communicate with
    the client. This is just some standard string handling, but it is still messy:


    The algorithm is:


    +   1. Find "+IPD" and trim the string to remove it and the comma

    2. Find the next comma and the characters from the start of the string to the
    next comma.


    Now we have the ID we can communicate with the client, but first we need something
    to send. As all with HTTP transactions, we have to send some headers and some
    data. There is a list of possible headers you could send, a reasonable minimum
    that works with most browsers is:


    ```

    char data[] = "HTTP/1.0 200 OK\r\nServer: Pico\r\nContent-type:text/html\r\n\n<head><title>Temperature</title></head><body><p>\"humidity\":81,\airtemperature\":23.5C\</p></body></html>\r\n";

    ```


    Note that this is a single string with no spaces between the elements that we
    have split over different lines for presentation.


    Of course, in a real application, the HTML part of the data would be generated
    by the program or from a file. You can include timestamps and lots of other useful
    information, but this is simple and works. Remember to include a blank line at
    the end of the headers. This is vital as the browser will ignore everything sent
    to it you doesn''t.


    Now we want to send the data to the client. This is just a matter of using the
    CIPSEND command again, only this time with id specified as the first parameter:


    ```

    CIPSEND=id,data length

    ```


    and we wait for the response ">" before sending the data.'
  merge: -1
  pgno: 342
- img_proc: true
  md: "Notice that we don't have to open a TCP socket as we did in the case of acting\
    \ as a client. The TCP socket has already been opened by the client connecting\
    \ to the server and when the transaction is complete we can close it:\n\n```\n\
    uint8_t command[128];\nint count = snprintf(command, 128,\n\"AT+CIPEND=%s,%d\\\
    r\\n\", id, strlen(data));\nuart_write_blocking(uart1, command, count);\n```\n\
    \nNow, at last, we can send the data to the client:\n\n```\nuart_write_blocking(uart1,\
    \ data, strlen(data));\nif (getBlocks(buf, len, 10, \"OK\") < 0)\n  return -1;\n\
    ```\n\nand wait for it to complete.\n\nFinally we close the connection and the\
    \ loop to wait for another connection:\n\n```\ncount = snprintf(command, 128,\
    \ \"AT+CIPCLOSE=%s\\r\\n\", id);\nuart_write_blocking(uart1, command, count);\n\
    if (getBlocks(buf, len, 10, \"OK\") < 0)\n  return -1;\n```\n\nTry it out with\
    \ a main program like this:\nint main()\n\n\n```\nstdio_init_all();\nuint8_t buf[512];\n\
    initWiFi();\nmodeWiFi(buf, 512, 1);\nconnectWiFi(buf, 512, \"Laribular\",\"hawhawk\"\
    );\ngetIPWiFi(buf, 512);\nstartServer(buf, 512);\nsleep_ms(1000);\n```\n\nYou\
    \ should now be able to connect to the IP address that is displayed and retrieve\
    \ the web page displays:\n{\"humidity\":81%,\"temperature\":23.5C\"}\n\nThere\
    \ are a lot of WiFi commands that haven't been covered here, but now that you\
    \ have seen examples of most of the basic types and encountered the typical problems\
    \ that occur you should be able to implement any that you need."
  merge: -1
