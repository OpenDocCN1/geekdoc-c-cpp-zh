- img_proc: true
  md: '# Chapter 13


    # Using The PIO


    The most interesting and attractive feature of the Pico is arguably its PIO -

    Programmable I/O hardware. So far we have used direct access to the GPIO

    lines or to some built-in hardware that controls them by PWM, I2C or

    SPI. If you want to connect to a device that these standards apply to your

    problem is solved. If, on the other hand, you have a device that doesn''t

    one of these standards then you are faced with the task of constructing your

    own implementation of the interface. For example, the DHT22 temperature

    and humidity sensor uses its own protocol for delivering its data and the 1-

    Wire is commonly encountered, but not often supported, in hardware.

    You even go beyond any standard and implement your own custom data

    transfer protocol.


    The traditional way to approach any custom or unsupported protocol is to use

    “bit banging”. This is simply the act of writing a program which controls

    PIO lines to simulate the hardware that might be used to implement the

    protocol. Basically what you have to do is set PIO lines high and implement

    read data at set times. This is

    easy in theory, but getting the timings is harder than it appears and

    synchronization between state changes is particularly challenging.

    in addition there is the problem that bit banging ties up the processor. In many

    cases doesn''t matter. In other cases you can use one core to implement

    the protocol and another to process the data. However the Pico''s PIOs provide

    gen-purpose solution to the problem that offers advantages that go well

    beyond the traditional solutions.


    The Pico documentation on the PIO even suggests that if you find yourself

    working on a bit-banging solution then you should stop and start again using

    the PIO. I wouldn''t go this far because the PIO solution is more complex and

    specialized and if a simple bit-banging solution works you need a motivation

    to transfer your attention to the PIO. This said, it is worth spending time

    learning about the PIO if you anticipate ever making use of it. With the right

    approach it isn''t as difficult as it first appears.'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# PIO Basic Concepts


    The problem with getting to grips with the PIO is that there are two distinct
    views of it – inside and outside. You can also add to this the extra complication
    of setting up a project that makes use of it, but that is a one-time problem.
    The best way to think about the PIO is as a black box that performs some transaction
    using GPIO lines and presents and accepts data from the processor – exactly like
    other I/O subsystems PWM, SPI, I2C etc. The only difference is that the transaction
    it performs programmable


    ![](img/470d59c61482018b86da50823ee18a57_235_0.png)


    This same situation for the I2C or SPI hardware – once up you communicate with
    the PIO by reading and writing registers and it is associated with a number of
    GPIO lines.


    As you might guess from the illustration there is more than one PIO. The Pico
    has two, PIO0 and PIO1, and each can be programmed independently of the other.
    To make things simple, we will use PIO but everything translates to PIO1 if you
    need to use it.


    You communicate with the PIO by reading and writing registers, but as with other
    hardware modules, the SDK provides functions to do this for you. Not all of the
    examples that you will encounter make use of the SDK functions and there is certainly
    more than one way to write a program to work with a PIO. In this book we will
    make use of the SDK functions, explaining a little about what they are.


    # Configuring GPIO for PIO Output


    The first and most important thing to master is that the PIO doesn''t have instructions
    that work with particular GPIO lines. You don''t write a GPIO program that sets
    the output of GPIO2, instead you specify which GPIO lines are to be linked in
    a number of groups. Each PIO has four different state machines that can be set
    to run a program stored in the PIO. Each state machine has its own set of GPIO
    lines that it works with and the simplest state machine can perform some sort
    of task on different GPIO pins. For example, if you programmed the PIO to be an
    SPI controller then you could define four different SPI interfaces, each to a
    different set of pins. It is also possible to run each state machine from a different
    program, but more of this later.'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'Each state machine has two sets of output lines:


    **OUT - Lines in the OUT group are specified by a base and a count, e.g. base
    is GP4 and count is 2 gives GP4 and GP5. They are controlled by instructions that
    transfer data from the processor to the state machine. That is, they are lines
    you set by writing data to the state machine. Typically the lines in the OUT group
    are what you would think of as data lines.


    You can set the OUT group using:


    ```

    sm_config_set_out_pins pio_sm_config *c

    ```


    which modifies a configuration struct c which you use later to configure the state
    machine using pio_sm_init. The out_base parameter gives the first GPIO line in
    the group and the out_count parameter gives you the number of lines in the group.
    By default all of the OUT pins are set to high impedance mode and have to be explicitly
    set as outputs.


    **SET – Specified by a base and a count e.g. base is GP4 and count is 2 gives
    GP4 and GP5. The SET group of GPIO lines are controlled by instructions running
    on the state machine. They are lines you set within the PIO program. Typically
    the lines in the SET group are used for what you would think of as clock lines.


    You can set the SET group using:


    ```

    sm_config_set_set_pins pio_sm_config *c

    ```


    which modifies a configuration struct c which you use later to configure the state
    machine using pio_sm_init. The set_base parameter gives the first GPIO line in
    the group and the set_count parameter gives you the number of lines in the group.
    By default all of the SET pins are set to highのである mode and have to be explicitly
    set as outputs.


    A third group of output lines, SIDESET, is also available and it turns out to
    be very slightly more difficult to understand. We will return to it later.


    Notice that a PIO program does not write to a particular GPIO line but to one
    of the groups of lines and these are defined by writing to registers or, better,
    using the SDK functions in your C program. Notice also that the groups of GPIO
    lines are associated with different PIO instructions. The OUT group is used by
    the out instruction and the SET group is used by the set instruction.'
  merge: -1
  pgno: 236
