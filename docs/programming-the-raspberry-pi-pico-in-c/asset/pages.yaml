- img_proc: true
  md: '# Interrupts


    The Pico supports 32 distinct interrupts, but only 26 are actually used. All of
    the user GPIO lines act together to create a single IO interrupt. A subtle point
    is that each of the Pico''s two processors can respond at the same time to an
    IO interrupt caused by a different GPIO line – that is, the IO interrupts are
    not shared between cores. In all other cases interrupts can only be enabled on
    one at time.


    The fact that there is only a single interrupt for all the GPIO lines means it
    is up to the interrupt handler to work out which line caused the interrupt and
    to reset it after dealing with it. Which GPIO line can generate an interrupt is
    specified by the bits in the same register that we have been using as event indicators
    in the earlier sections. If an interrupt is enabled for a given line and a given
    event the interrupt will occur if that bit is set to one.


    The events that you can use are the same as before:


    ```

    GPIO IRQ LEVEL LOW

    GPIO IRQ LEVEL HIGH

    GPIO IRQ EDGE FALL

    GPIO IRQ EDGE RISE

    ```


    The SDK provides three basic functions for working with GPIO interrupts.

    The most important is:


    ```

    gpio_set_irq_enabled with callback (uint gpio, uint32_t events, bool enabled,
    gpio_irq_callback_t callback)

    ```


    This enables or disables the interrupt associated with the specified GPIO line
    and event. The callback is the function that is executed when the interrupt occurs,
    ie it is the interrupt handler. Although it looks as if you can associate a different
    callback with each GPIO line, at the time of writing this is not a feature. While
    that might be added in the future, there is currently only one GPIO interrupt
    handler for all of the GPIO lines, despite appearances to the contrary. If you
    try to set different callbacks for each GPIO line, the last one you set is actually
    used. Notice that all this means it is up to your interrupt handler to respond
    to which GPIO line and which event caused the interrupt. This is made easier by
    the two parameters passed to the event handler:


    ```

    void gpio_callback(uint gpio, uint32_t events)

    ```


    The first parameter gives the line which caused the interrupt and events gives
    the event that it caused.


    Once you have set a callback you can enable the interrupt:


    ```

    gpio_set_irq_enabled (uint gpio, uint32_t events, bool enabled)

    ```


    This enables or disables the ability of the specified GPIO line to cause an interrupt
    when the specified event occurs.'
