  md: '# Pico On Pi


    Using a Pi 4 as the development machine is the recommended option. If you want
    to make Pico development as easy as possible, this is the way to go.


    If you opt to use a Pi 4 or a Pi 400 then there is an installation script that
    does all of the work for you. All you have to do is it from the Raspberry Pi site,
    set it to be executable and execute it:


    ```

    wget https://raw.githubusercontent.com/raspberrypi/pico-setup/

    chmod +x pico_setup.sh

    ./pico_setup.sh

    ```


    This works and doesn''t install anything you already have installed. You do have
    to reboot for it all to take effect, however.


    The script does all of the steps that you could do yourself.


    +   1. Creates a pico directory in the user''s home directory.

    2. Installs the GCC ARM compiler, CMake and a support library: sudo apt install
    cmake gcc-arm-none-eabi libnlib-arm-none-eabi

    3. Clones the GitHub SDK repository:

    git clone -b master https://github.com/raspberrypi/pico-sdk.git

    cd pico-sdk

    git submodule update --init

    cd

    4. Clones the examples and playground repositories – these are essential:

    git clone -b master https://github.com/raspberrypi/pico-examples.git

    5. Sets up paths by defining Pico_SDK_PATH, Pico_EXAMPLES_PATH, Pico_EXTRAS_PATH,
    and Pico_PLAYGROUND_PATH in your .bashrc

    6. Builds the blink and hello_world examples in pico-examples/build/blink and
    pico-examples/build/hello_world

    7. Downloads and builds pico picotool and copies it to /usr/local/bin - this isn''t
    essential.

    8. Downloads and builds picoprobe - this is necessary to do easy debugging with
    another Pico acting as a SWD (Serial Wire Debug)

    9. Downloads and compiles the debugging tool OpenOCD.

    10. Downloads and installs Visual Studio Code.

    11. Installs the required Visual Studio Code extensions.

    12. Configures the Raspberry Pi UART for use with the Pico.


    Notice that the only things you actually need installed to get started are the
    GCC ARM compiler, CMake and the SDK. The other items will be useful later.'
  merge: -1
