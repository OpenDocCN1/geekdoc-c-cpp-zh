    Alternatively, if speed of data transfer isn''t an issue, you could just use a
    fixed delay of a few microseconds.


    In the next chapter we will put together some functions that make the SPI bus
    and the CS lines easier to work with.


    # The BME280 Humidity, Pressure and Temperature Sensor


    As an example of getting to grips with a real SPI device, we can write some code
    to get data from the commonly used BME280 sensor. You can also use the earlier
    BMP280, which is register-compatible but doesn''t have a humidity sensor. Both
    as an SPI device and an I2C device some of their operations are compromised relative
    to their performance as an I2C device. The BME280 is also the subject of a complete
    example in the Pico''s SDK which implements a full interface, including the correction
    of raw data values. In this section we will simply implement a basic read of the
    raw data to show how it is done. If you want to use the device in a real application
    you will need the additional functions in the SDK example – or implement them
    yourself.'
