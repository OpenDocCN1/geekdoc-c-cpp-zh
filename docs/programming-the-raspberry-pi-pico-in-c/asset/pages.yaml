  md: "# Data Transfer functions\n\nBecause of the way the SPI bus uses a full-duplex\
    \ transfer, things are a little\ndifferent from other buses when it comes to implementing\
    \ functions to\ntransfer data. The most basic transfer function is:\n\n```\nint\
    \ spi_write16_read16 (spi_inst_t *spi,\nconst uint16_t *src, uint16_t *dst, size_t\
    \ len)\n```\n\nThe src and dst array have to be the same size as the final\nparameter\
    \ len. The src array is used for the data to be transmitted and the\ndst array\
    \ is used for the data that is transmitted. If you don't understand\nthis idea\
    \ of a send (source) or a receive (destination) array then the\ndiscussion about\
    \ how SPI works earlier. Each of the arrays is composed\nof16-bit elements, but\
    \ only the number of bits specified in the configuration\nare actually sent. If\
    \ you set a data_bits to 8 then only the first eight\nbits of each array element\
    \ are sent or received. The 16-bit halves are used\nto accommodate situations\
    \ where you are working with more than 8-bit\ntransfers.\n\nNotice that a call\
    \ to any of the transfer functions is blocking, i.e. the function\ndoes return\
    \ until the transfer is complete. There is also no need for a\ntimeout as all\
    \ SPI transfers end after the number of clock pulses needed to\ransfer the specified\
    \ data. Also of the transfer functions return the\nof elements read/written.\n\
    \nIf you are only interesting in reading or writing data then you can use:\nspi_write16_blocking\
    \ (spi_inst_t *spi, const uint16_t *src, size_t\nlen)\nspi_read16_blocking (spi_inst_t\
    \ *spi, uint16_t repeated_tx_data,\nuint16_t *dst, size_t len)\n\nIn the case\
    \ of the write function received the data is discarded. The\nread function has\
    \ a parameter to specify what data you want sent. This is\nusually zero, but some\
    \ slaves require a specific value to be sent even though\nit, in principle, of\
    \ no interest. Notice that both of these functions are just\neasier ways of calling\
    \ spi_write16_read16_blocking.\n\nThere are also two 8-bit versions of the read/write\
    \ functions:\n\n```\nspi_write_blocking (spi_inst_t *spi, const uint8_t *src,\
    \ size_t len)\nspi_read_blocking (spi_inst_t *spi, uint8_t *dst, size_t len)\n\
    ```\n\nThese again are just simpler versions of spi_write16_read16_blocking using\n\
    byte arrays rather than 16-bit arrays."
  merge: -1
  pgno: 183
- img_proc: true
  md: "There is one final complication that you can mostly ignore. The SPI hardware\
    \ is buffered. Both the MISO and MOSI connections have an 8-deep FIFO buffer and\
    \ this means that you can send and receive data faster if the buffer isn't full\
    \ or empty. To test the buffer's state you can use:\n\n```\nstatic size_t spi_is_readable(spi_inst_t\
    \ * spi) \nreturns non-zero if there is data waiting to be read and:\nstatic size_t\
    \ spi_is_writable(spi_inst_t * spi)\n```\n\nwhich returns non-zero if the buffer\
    \ has space. You can use these two functions to minimize the effect of using I/O\
    \ functions.\n\n# Using the Data Transfer Functions\n\nWhen you start using SPI\
    \ it can be difficult to get the idea that you send and receive data at the same\
    \ time. Indeed, you cannot receive data unless you send the same number of data.\n\
    \nThe most basic of transfer functions is spi_write16_read16_blocking and makes\
    \ the bidirectional transfer obvious. For example:\n\n```\nuint16_t wBuffer[]\
    \ = {'A' 'B' 'C'};\nuint16_t rBuffer[3];\nint n = spi_write16_read16_blocking(spi0,\
    \ wBuffer, rBuffer, 3);\n```\n\nThis sends the three elements in wbuffer and receives\
    \ back three in rBuffer. Whether the three elements in bluff make any sense is\
    \ a matter of what the slave sends back and they might be of no interest at all.\
    \ If this is the case you may use use:\n\n```\nuint16_t wBuffer[] = {'A' 'B' 'C'};\n\
    int n=spi_write16_blocking(spi0, wBuffer, 3);\n```\n\nWhatever the slave sends\
    \ back are simply ignored. If you are using 8-bit transfers you can also use:\n\
    \n```\nuint8_t wBuffer[] = {'A' 'B' 'C'};\nuint8_t rBuffer[3];\nint n = spi_write16_read16_blocking(spi0,\
    \ wBuffer, rBuffer, 3);\n```\n\nor\n\n```\nuint16_t rBuffer[3];\nint n=spi_write16_blocking(spi0,\
    \ rBuffer,3);\nuint8_t rBuffer[3];\nspi_read_blocking(spi0, rBuffer,3);\n```\n\
    \nand if you are working with 8-bit data:\nUsing just these functions you should\
    \ be able to deal with most SPI slaves."
  merge: -1
