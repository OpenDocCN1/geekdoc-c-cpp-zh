- img_proc: true
  md: 'The serial protocol is also fairly simple:


    +   1. The host pulls the line low for between 0.8ms and 29ms, usually 1ms.

    2. It releases the bus which is pulled high.

    3. After between 20µs and 200µs, usually 30µs, the device starts to send data
    by pulling the line down for around 80µs and then lets float high for another
    80µs.

    4. Next 40 bits of data are sent using a 70µs high for a 1 and a 26µs high for
    a θ with the high pulses separated by around 50µs periods.


    ![](img/470d59c61482018b86da50823ee18a57_262_0.png)


    We have to do pull the line low for 1ms or to start the device sending data and
    this is very easy. Then we have to wait for the device to pull the line down and
    let it pull up again for about 160µs and then read the time that the line is high
    or 40 times.


    A 1 corresponds to 70µs and a θ corresponds to 26 to 28µs. This is within the
    range of pulse measurements that can be achieved using standard library functions.
    There is also a 50µs low period between each data bit and this can be used to
    do some limited processing. The time between transitions is therefore 120µs for
    a 1 and 76µs for a θ.


    When trying to work out how to decode a new protocol it often helps to try to
    answer the question, "how can I tell the difference between a θ and a 1",


    If you have a logic analyzer it can help to look at the waveform and see how you
    work it out manually. In this case, despite the complex-looking timing diagram,
    the difference comes down to a short versus a long pulse!'
  merge: -1
