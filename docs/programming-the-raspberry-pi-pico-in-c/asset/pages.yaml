  md: "If the baud rate cannot be achieved using the current clock frequency and\n\
    available dividers then the nearest rate is returned and returned as the result.\n\
    \nTo set the complete configuration of the UART, other than baud rate, you need\n\
    to use:\n\n```\nuart_set_format (uart_inst_t *uart, uint data_bits,\n        \
    \                    uint stop bits, uart_parity_t parity)\n```\n\nYou can set\
    \ 5, 6, 7 or 8 data bits and 1 or 2 stop bits. Parity can be any of:\n\n+   UART_PARITY_NONE\n\
    UART_PARITY_EVEN\nUART_PARITY_ODD\n\nThese are the main configuration functions,\
    \ but there are others that are\noccasionally useful. If you want to make use\
    \ of hardware flow control, i.e.\nnRTS/CTS lines, then you need to enable them\
    \ using:\n\n```\nuart_set_hw_flow (uart_inst_t *uart, bool cts, bool rts)\n```\n\
    \nIf you set cts to true then the CTS line has to be high to allow the UART to\n\
    s data and if the rts is true then the RTS line is set high if there is data to\n\
    send.\n\nBy default 32-element FIFO buffers are used on RX and TX. This is usually\n\
    what you want, but if you need to react to immediate input, and can risk\nlosing\
    \ data, then you can turn the buffering off. Notice that with buffering off\n\
    only a single character is stored while another is being received:\n\n```\nuart_set_fifo_enabled\
    \ (uart_inst_t *uart, bool enabled)\n```\n\nFinally you enable interrupts:\n\n\
    ```\nuart_set_irq_enables (uart_inst_t *uart, bool rx_has_data,\n            \
    \            bool tx_needs_data)\n```\n\neither on the read or write data or both.\n\
    \nTo set up the interrupt handler you need to use:\n\n```\nirq_set_exclusive_handler(uartIRQ,\
    \ handler);\nirq_set_enabled(uartIRQ, true);\n```\n\nwhere uartIRQ is UART0_IRQ\
    \ or UART1_IRQ and you also have to enable the\ninterrupt."
