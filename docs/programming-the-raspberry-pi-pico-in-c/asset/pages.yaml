  md: A simple event can avoid the loss of a single input, but what if there is more
    than one while the polling loop is unavailable? The most common solution is to
    create an event queue – that is, a FIFO (first in, first out) queue of events
    as they occur. The polling loop now reads the event at the front of the queue,
    processes it and reads the next. It continues like the the queue is empty; it
    simply waits for an event. As long as the queue is big enough, an event means
    you don't miss any input, but input events are not necessarily processed close
    to the time that they occurred. They should be processed in order, unless the
    events are timestamped the program no idea when they happened.
