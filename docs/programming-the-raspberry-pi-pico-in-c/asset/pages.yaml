- img_proc: true
  md: "Before going into details, it is worth explaining what the constraints are\
    \ and what makes PIO access worth the effort. The bit-banging solution given earlier\
    \ works and is perfectly good. However, it demands the full attention of the processor\
    \ while the data is being read in. If an interrupt occurs during reading, the\
    \ data will be corrupt. On the other hand, if you can implement a PIO program\
    \ that reads the data the processor is free to do something until it waits to\
    \ use the data and interrupts have no effect. This depends on the PIO being able\
    \ to read the data from the device and keep it stored ready when the processor\
    \ wants to read it. If you consider this for a few moments, this means you can\
    \ hold data in the 4-word FIFO buffer and an additional word making a total of\
    \ 160 bits of temporary storage, which seems to be more than enough for the 40\
    \ bits that the DHT22 produces. However, for a timing-based protocol, things are\
    \ more complicated.\n\nWe can write a loop that counts instruction cycles when\
    \ the input line is high and this count can be up to 32 bits in resolution. However,\
    \ there is no way to convert the 32-bit count into single bits by applying a threshold\
    \ as in the bit-banging example. What this means is that we are forced to send\
    \ the counts, the decoded bits back to a processor. A little arithmetic reveals\
    \ that we can store the counts for all 40 bits as long as the count is represented\
    \ as a 4-bit number. We can store the first 32-bits, the data in the four word\
    \ FIFO buffer with the counts for each byte, in a single element. The final byte\
    \ can be stored in the ISR until the processor reads the FIFO and frees up space.\
    \ A count of 4 bits is enough to tell the difference between the times for a zero\
    \ and one and this makes the whole scheme possible, as long as we adjust the clock\
    \ frequency correctly.\n\nAll this means is that we can write a PIO program that\
    \ can be set to read the data from the DHT22 and store the result in the FIFO\
    \ and the ISR until the processor is ready to read it. The downside is that the\
    \ processor has to convert the timing counts to bits and pack the results into\
    \ bytes before processing the humidity, temperature and checksum – a small price\
    \ to pay.\n\nWith this worked out we can write the PIO program. The first problem\
    \ is that we have to set a 1ms initialization pulse:\n\n```\n.program dht\n  \
    \  set pins, 1\n    set pindirs, 1\nagain:\n    pull block\n    set pins, 0\n\
    \    mov x, osr\nloop:\n    jmp x--,loop\n    set pindirs, 0\n```"
  merge: -1
  pgno: 270
- img_proc: true
  md: 'This uses a data value written to the state machine by the C program to execute
    a delay loop that takes 1ms. It also serves to start the conversion. Also notice
    the low pulse is terminated by setting the pin to input. Next we have to wait
    for two rising edges to pass before we get to the data pulses:


    ```

    wait 1 pin 0

    wait 0 pin 0

    wait 1 pin 0

    wait 0 pin 0

    ```


    Finally we can start reading in the four bytes of data:


    ```

    set y,31

    bits:

    wait 1 pin 0

    set x, 0

    ```


    ```

    loop2:

    jmp x--,continue

    continue: jump pin,loop2

    in x,4

    jmp y--,bits

    ```


    The bits loop processes all 32 bits. The inner 2 processes each bit in turn. The
    x register is set to zero and decremented using a forward jump to the end of the
    loop. Notice that it doesn''t matter if the jump is taken, the next instruction
    is always continue. Decrementing the x register when it is already at zero there
    is a small danger that this behavior might change. Once there is not part of the
    PIO specification that the loop has completed, the 4-bit count is transferred
    to the ISR and the next bit starts. Notice that it is assumed that auto-push is
    set so that the FIFO is automatically added to when the ISR is full.


    We have to repeat the process for the checksum:


    ```

    set y,7

    check:

    wait 1 pin 0

    set x, 0

    loop3:

    jmp x--,continue2

    continue2: jump pin,loop3

    in x,4

    jmp y--,check

    jmp again

    ```


    Notice that if the C program has not read the FIFO then this blocks and waits
    for free space. Finally, we jump back to the start of the program to wait for
    the C program to write to the FIFO.'
  merge: -1
  pgno: 271
- img_proc: true
  md: "The C program to make all this work is fairly straightforward, but it involves\
    \ lot of bit manipulation to convert the counts into bits:\nuint8_t getByte(PIO\
    \ pio, uint sm)\n\n\n```\n{\n    uint32_t count = pio_sm_get_blocking(pio0, sm);\n\
    \    uint8_t byte = 0;\n    for (int i = 0; i < 8; i++) {\n        byte = byte\
    \ << 1;\n        if (((count >> i * 4) & 0x0F) > 8) {\n            byte = byte\
    \ | 1;\n        }\n    }\n    return byte;\n}\n```\n\nThis reads a word from the\
    \ PIO and converts it into a byte by comparing each 4-bit count with a threshold,\
    \ i.e. 8.\n\nUsing this function we can obtain the humidity, temperature and checksum\
    \ as the previous program. All that is needed to complete the program is to get\
    \ the data in a useful form and an initialization function.\n\nThe complete program\
    \ is:\n\n```\n#include <stdio.h>\n#include \"pico/stdlib.h\"\n#include \"hardware/gpio.h\"\
    \n#include \"hardware/pio.h\"\n#include \"DHT.h\"\nint dhtInitialize(PIO pio,\
    \ int gpio)\n{\n    uint offset = pio_add_program(pio, &dht_program);\n    uint\
    \ sm = pio_claim_unused_sm(pio, true);\n    pio gpio_init(pio, gpio);\n    pio\
    \ sm_config c = dht_program get_default_config(offset);\n    sm_config_set_clkdiv_int\
    \ frac(&c, 128, 0);\n    sm_config_set_in_pins(&c, gpio, 1);\n    sm_config_set_in_pins(&c,\
    \ gpio);\n    sm_config_set_jmp_pin(&c, gpio);\n    sm_config_set_in_shift(&c,\
    \ true, true, 32);\n    pio_sm_init(pio0, sm, offset, &c);\n}\npio_sm_set_enabled(pio0,\
    \ sm, true);\nreturn sm;\n```"
