- img_proc: true
  md: "The first return value is the number of bytes read which could be zero. If\
    \ the constant Debug is a 1 then the string is printed to UART0 and you can examine\
    \ it. Notice that the function can come to an end for two different reasons –\
    \ the time between characters is long enough to suggest that the transmission\
    \ is finished or the buffer is full. If the buffer is full there may be more data\
    \ to be received, and as it stands, this data is lost.\n\nIf the AT command has\
    \ successful it returns a string containing \"OK\". One of the problems of working\
    \ with AT commands is that they don't have an exact syntax and there is no final\
    \ \"end of message\" signal. By observation, any successful command will end with\
    \ \"OK\" and if you can't find \"OK\" in the response you either haven't read\
    \ all or there has been an error.\n\nWith all of this we can create an AT function\
    \ that returns its response:\n\n```\nint ATWiFi(uint8_t buf[], int len)\n{\n \
    \   uint8_t SendData[] = \"AT\\r\\n\";\n    uart_write_blocking(uart1, SendData,\
    \ 4);\n    return getBlock(buf,len);\n}\n```\n\nA complete program is:\n#include\
    \ <stdio.h>\n#include \"pico/stdlib.h\"\n#include \"hardware/gpio.h\"\n\n```\n\
    #define Debug true\ninit initWiFi()\n{\n    uart_init(uart1, 115200);\n    gpio_set_function(4,\
    \ GPIO_FUNC_UART);\n    gpio_set_function(5, GPIO_FUNC_UART);\n    uart_set_format(uart1,\
    \ 8, 1, UART_PARITY_NONE);\n    sleep_ms(100);\n    return 0;\n}\n```"
