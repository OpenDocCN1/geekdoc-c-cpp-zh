- img_proc: true
  md: "# How Fast Is An Interrupt?\n\nLet's find out how much overhead is inherent\
    \ in an interrupt by repeating the pulse width measurement. This time, we can't\
    \ simply print the results as this would stop the interrupt-handling. As a compromise,\
    \ we save 20 readings in an array and then print them. It is also important to\
    \ keep the interrupt-handling routines short as how long they take to complete\
    \ governs how fast the next interrupt can be handled.\n\nThe new interrupt handler\
    \ is:\n\n```\nuint64_t t[20];\nint count=0;\nvoid myHandler(int fd) {\n    struct\
    \ gpio_data data;\n    read(fd,&data, sizeof edata);\n    t[count++]=data.timestamp;\n\
    \    if(count<19) {\n        for(int i=1;i<19; i++){\n            printf(\"%llu\
    \ \\n\", t[i]-t[i-1]);\n        }\n        fflush(stdout);\n    }\n    count=0;\n\
    }\n```\n\nIt records reasonably accurate times for pulses longer than 6µs. It\
    \ is less capable than the polling loop, which works better down to 1µs, but the\
    \ difference isn't that great. What this means is that even with the overhead\
    \ of the SDK, interrupts are very usable. However, a lot depends on the time that\
    \ the interrupt handler takes to relinquish control.\n\n# Race Conditions and\
    \ Starvation\n\nOne of the big problems of using interrupts on a small processor\
    \ like the Pico is that there is no operating system to make sure that different\
    \ tasks get a fair share of the processor. It is entirely possible for an interrupt\
    \ routine to be called so the main program, or some other function, doesn't get\
    \ a chance to execute."
  merge: -1
  pgno: 106
- img_proc: true
  md: "For example, if you try a program that prints a message in the main program\
    \ and responds to interrupts then you can see the starvation of the main program’s\
    \ code very easily:\n\n```\n#include <stdio.h>\n#include \"pico/stdlib.h\"\n\n\
    uint64_t t;\n\nvoid MyIRQHandler(uint gpio, uint32_t events) {\n    t = time_us(64);\n\
    \    printf(\"GPIO %d %X %d\\n\", gpio, events, t);\n}\n\nint main() {\n    stdio_init_all();\n\
    \    gpio_set_function(22, GPIO_FUNC_SIO);\n    gpio_set_dir(22, false);\n   \
    \ gpio_pull_down(22);\n\n    gpio_set_irq_enabled_with_callback(22, GPIO_IRQ_EDGE_RISE\
    \ | GPIO_IRQ_EDGE_FALL, true, &MyIRQHandler);\n\n    while (1) {\n        printf(\"\
    doing something\\n\\r\");\n    }\n    return 0;\n}\n```\n\nIf you apply a square\
    \ wave input to GP22 then you will see both the \"doing something\" and the interrupt\
    \ message, as long as the frequency is 200Hz or less. Above this frequency the\
    \ interrupt routine is called almost once after it returns to the main program.\
    \ As a result the main program makes little or no progress - it is starved of\
    \ CPU time. The reason for the very low interrupt rate that causes starvation\
    \ is due to the time interrupt routine takes to run as printing is slow. A faster\
    \ routine would work at a higher frequency before starvation is set in, but it\
    \ is a constant problem with interrupt-driven systems.\n\nIf you also look closely\
    \ at the output of the program when the main program is getting a chance to run,\
    \ you will see the second problem with simple interrupt systems - race conditions."
  merge: -1
  pgno: 107
- img_proc: true
  md: "The output isn't clean, instead it is all jumbled together:\n\n```\ndoGPIO\
    \ 22 8 536873856\nngsomeGPIO 22 4 536873856\nthing\nGPIO 22 8 536873856\ndoingGPIO\
    \ 22 4 536873856\nsomeGPIO 22 8 536873856\ning\ndGGPIO 22 4 536873856\nnoing soGPIO\
    \ 22 8 536873856\nmethingGPIO 22 4 536\n```\n\nThe reason for this is simply that\
    \ the interrupt can occur while the program is in the middle of a call to printf.\
    \ That is, the call to printf is not \"atomic\" and can be split by the action\
    \ of the interrupt. The key takeaway is that interrupts can occur anywhere within\
    \ your program, even within actions you think of as atomic, which cannot be interrupted.\n\
    \nWhat is even more confusing is that often attempts to remove the problem of\
    \ race conditions can lead to starvation. For example, you might think that the\
    \ solution is to disable interrupts while printing:\n\n```\nwhile (1)\n  gpio_set_irq_enabled(22,\
    \ GPIO_IRQ_EDGE_RISE | \n    GPIO_IRQ_EDGE_FALL, false);\n  printf(\"doing something\\\
    r\");\n  gpio_set_irq_enabled(22, GPIO_IRQ_EDGE_RISE | \n    GPIO_IRQ_EDGE_FALL,\
    \ true);\n```\n\nIf you try this you will discover that you never see the interrupt\
    \ routine print its message. The reason is that the time the interrupt is enabled\
    \ for is, very small and only if an interrupt occurs in this interval will the\
    \ interrupt get to run. Now it is the interrupt routine that is starved of CPU\
    \ attention. If you add: sleep(1000);\n\nat the end of the loop you will see both\
    \ messages and they won't be interwoven.\n\nIn this case the problem is made worse\
    \ by the gpio_set_irq enabled function always clearing any pending interrupts.\
    \ If an interrupt occurs during the printf it won't be remembered because it is\
    \ reset when the IRQ is enabled."
  merge: -1
  pgno: 108
- img_proc: true
  md: "If you want to disable interrupts while remembering any that occur while disabled\
    \ them then you need to add:\n\n```\n#include \"hardware/structs/iobank0.h\"\n\
    #include \"hardware/sync.h\"\nvoid gpio_irq_active(uint gpio, uint32_t events,\
    \ bool enabled) {\n io_irq_ctrl hw_t t = &irq_core_base = get_num() ? &niobank0->hw->proc1_irq_ctrl\
    \ : &iobank0->hw->proc0_irq_ctrl;\n io_rw 32 = en_reg = &irq_core_base->inte[gpio\
    \ / 8];\n events <<=4 * (gpio % 8);\n if (enabled)\n hw_set_bits(en_reg, events);\n\
    \ else\n hw_clear_bits(en_reg, events);\n}\n```\n\nYou also need change the main\
    \ program loop to:\n\n```\nwhile (1) {\n gpio_set_irq_active(22, GPIO_IRQ_EDGE_RI\
    \ | GPIO_IRQ_EDGE_FALL, false);\n printf(\"doing something\\n\\r\");\n gpio_set_irq_active(22,\
    \ GPIO_IRQ_EDGE_RI | GPIO_IRQ_EDGE_FALL, true);\n}\n```\n\nNow you will see both\
    \ messages without a pause. The solution isn't perfect as some interrupts will\
    \ be missed, but in many cases this is a better way to work.\n\nIf you have encountered\
    \ this sort of problem before you might be thinking of traditional solutions such\
    \ as mutex, semaphore and critical sections. These are all available within the\
    \ SDK, but without threads they are only really necessary when start to use the\
    \ second core. In nearly all cases you can control access by simply pausing interrupts.\n\
    \n# Responding To Input\n\nThis look at methods of dealing with the problems of\
    \ input isn't exhaustive – there are always new ways of doing things, but it covers\
    \ the most general ways of implementing input. As already mentioned, the problem\
    \ with input is that you don't know when it is going to happen. What generally\
    \ matters is speed of response.\n\nFor low-frequency inputs, interrupts are worthwhile.\
    \ They can leave your program free to do other tasks and simplify its overall\
    \ structure. For high-frequency inputs that need to be serviced regularly, a polling\
    \ loop is still the best option for maximum throughput. How quickly you can respond\
    \ to an input depends on how long the polling loop is and how many times you test\
    \ for it per loop."
  merge: -1
  pgno: 109
- img_proc: true
  md: '# Summary


    +   - Events are a stored indication that something happened.


    +   - Interrupts are events that cause something to happen.


    +   - You can use an event with a polling loop to protect against missing input
    because the program is busy doing something else.


    +   - If an event occurs before the current event has been cleared then it might
    be missed. To avoid missing events, you can use an event queue which stores events
    in the order they happened until they are processed.


    +   - The Pico SDK doesn''t support events but it is easy to add a function to
    make use of them. You can enable a bit to be set if a GPIO line goes high, low
    or is high or low. Edge-triggered events are the easiest to work with.


    +   - Using events in a polling loop hardly slows things down at all.


    +   - You can use events to generate an interrupt and call an interrupt handler.


    +   - Pico interrupts are fast and hence usable for many tasks but they are best
    for low frequency events that need rapid attention.'
  merge: -1
