- img_proc: true
  md: '# # Chapter 4

    # Simple Output


    A GPIO line is either configured to be an input or an output. The electronics
    of working with inputs and outputs are discussed in the next chapter. In this
    chapter we focus on the software side of the task of using GPIO lines in output
    mode. While it isn''t possible to ignore some electronics in this chapter, keep
    in mind that this is discussed in detail in the next chapter.


    It is worth noting at this stage that output is easy. Your program chooses the
    time to change a line''s state and you can use the system timer to work out exactly
    when should happen. The real problems only start to become apparent when you are
    trying to change the state of lines very fast or when they need to be changed
    synchronously. This raises the question of how fast the Pico can change a GPIO
    line and this is something we consider at this early stage because it puts constraints
    on what we can easily do.


    # ## GPIO Functions


    There are a number of basic functions that let you work with a single GPIO line.
    Some of these we have already met in the previous chapter.


    There are two ways to initialize a GPIO line, specified by gpio, to act as a simple
    software controlled line:


    ```

    gpio_set_function (uint gpio, GPIO_FUNC_SIO)

    ```


    or:


    ```

    gpio_init (uint gpio)

    ```


    After either we have a GPIO line to software control and the second initializes
    it to input.


    You can then set the direction of the line using:


    ```

    gpio_set_dir (uint gpio, bool out)

    ```


    The line is set to output if out is true and input if it is false.'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'You can find out the direction of any line using:

    static uint gpio_get_dir (uint gpio)

    static bool gpio_is_dir_out (uint gpio)


    The get dir returns 0 or 1 for input and output and gpio_is_dir_out returns true
    if the line is set to output.


    Once the line direction is set you use:

    static bool gpio_get (uint gpio)

    to read the state of the line and:

    gpio_put (uint gpio, bool value)

    to set the state of the line. Both of these work irrespective of the direction
    the line is set to.


    There is also:

    gpio_set_input_enabled (uint gpio, bool enabled)

    which, if enabled is false, stops the line responding to input. There is currently
    no similar function for output, even though the hardware supports it.


    # Working With Multiple GPIO Lines


    So far the functions have allowed us to change one line at a time. If you want
    to change more than one line then there are a range of mask functions which affect
    only the lines specified in a binary mask.


    The mask is very simple; each of the first 30 bits in the mask represents a GPIO
    line – bit zero is for GPIO0, but one is for GPIO1 and so. Of course, the problem
    is making up the mask.


    It very easy to automatically make a mask that corresponds to any set of GPIO
    lines specified by pin number. Suppose you want a mask for pin GP3 then this means
    you need to set the third bit in the mask. This can be done using 1<<3, i.e. 1
    shifted three places to the left. If you want to know about manipulation of this
    sort, see Chapter 12 of Fundamental C: Getting Closer To The Machine, ISBN: 9781871962604.


    This is the mask you require and it has been found by a general algorithm. If
    you want a mask for pin n all you have to do:

    1<<n'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'Now suppose you want a mask for pin n and pin m. All you have to do is use
    the bitwise operator,| to OR the masks for each pin together, so the complete
    mask is:


    ```

    (1<<n) | (1<<m)

    ```


    Of course, you can use pin enumeration in place of pin numbers. So, to create
    a mask for pin 3 and pin 5, you would use:

    uint32_t_mask=(1 << 3) | (1 << 5);


    Once you have the mask you can use it in any of the mask functions.


    The gpio_init_mask function will initialize the lines specified in the mask to
    inputs:

    gpio_init_mask (uint gpio_mask)


    Once you have initialized the lines you can set their direction using any:

    gpio_set_dir_out_masked (uint32_t mask)

    gpio_set_dir_in_masked (uint32_t mask)

    gpio_set_dir_masked (uint32_t mask, uint32_t value)


    The gpio_set_dir_masked function sets the lines specified in the mask to 0 or
    1 corresponding to input or output according to the bits in value.


    Once you have set the direction you can set the output state using any of:

    gpio_set_mask (uint32_t mask)

    gpio_clr_mask (uint32_t mask)

    gpio_xor_mask (uint32_t mask)

    gpio_put_masked (uint32_t mask, uint32_t value)


    The set and clr functions set the lines high and low respectively. The xor function
    inverts the current state of the specified lines - i.e a low line is set high
    and a high line is low. The final put_masked function sets each of the specified
    lines to the state indicated by the corresponding bit in value.


    Only the lines specified in the mask are modified – the rest are left in their
    current state. For example:

    uint32_t_mask=(1 << 3) | (1 << 5);

    gpio_set_mask (mask);


    sets both pin 3 and pin 5 high in a single operation.'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'You can use gpio_put_masked to change the state of multiple lines to different
    values. For example:


    ```

    uint32_t mask=(1 << 3) |(1 << 5);

    uint32_t value=1<< 5;

    gpio_set_dir_masked (mask,value)

    ```


    will set pin 3 to low and pin 5 to high because the mask specifies these pins
    and in the value corresponding to pin 3 is 0 and the bit corresponding to correspond
    to bits set to pin 5 is 1. Notice the state of bits in value that do not correspond
    to bits set to 1 in mask have no effect.


    The mask functions are very useful when you want changes across a number of GPIO
    lines, see later. It is worth saying at this early stage that you can set a group
    of lines in one operation and can unset a group of lines in one operation, but
    if you want to set some lines and others is always two separate operations.


    As well as mask functions, there are also three functions that operate on all
    of the GPIO lines. You can use:


    ```

    static void gpio_set_dir_all_bits (uint32_t values)

    ```


    to set the directions of all GPIO lines in one go. The function:


    ```

    static uint32_t gpio_get_all ( )

    ```


    returns the current state of all of the lines as a 29-bit value and:


    ```

    static void gpio_put_all (uint32_t value)

    ```


    sets the state of all 29 lines. These are only occasionally useful.


    # How Fast?


    A fundamental question that you have to answer for any processor intended for
    use in embedded or IoT projects, how fast can the GPIO lines work?

    Sometimes the answer isn''t of too much concern because what you want to do works
    relatively slowly. Any application that is happy with response times in the tens
    of millisecond region will generally work with almost any processor. However,
    if you want to implement custom protocols or anything that needs microsecond,
    or even nanosecond, responses the question is much important.'
  merge: -1
  pgno: 51
