- img_proc: true
  md: 'The program simply tests for the line to be pulled low by the switch being
    closed and sets GP21 high. If you connect GP21 to an LED or a logic analyzer you
    will see the effect of the button being closed – the LED light up while it is
    pressed. Notice GP22 goes low to indicate that the switch is pressed.


    If you change gpio_pull_up(21) to gpio_pull_down(21) , the way the switch is connected
    becomes:


    ![](img/470d59c61482018b86da50823ee18a57_81_0.png)


    The program still works, but now GP21 is high when the switch is pressed and hence
    the LED is on when the switch is not pressed.


    Should you use an internal or external resistor? The answer is that it mostly
    doesn''t matter as long as there is a resistor. The only problem with using an
    internal resistor is the possibility that the software fails to set the pull-up/down
    mode and leaves the input floating.


    Also notice that this switch input is not debounced. The simplest way to do this
    is to include a time delay in the loop before the line is sampled again.'
