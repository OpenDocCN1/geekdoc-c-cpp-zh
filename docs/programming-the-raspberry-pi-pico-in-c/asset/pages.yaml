  md: 'objects. The faster the LED switches on and off the less flicker should be
    visible, but before you select frequencies in the high kHz range it is worth knowing
    that an LED has a minimum time to turn on and so frequencies at low kHz work best.

    If you want to dim something other than the onboard LED, you will, in many cases,
    you need a driver to increase the brightness. For a simple example, we can connect
    a standard LED to the PWM line and use the BJT driver circuit introduced in Chapter
    5.


    ![](img/470d59c61482018b86da50823ee18a57_136_0.png)


    # PWM Input


    The B Channel of each slice can also be used as an input. In this mode the block
    diagram of the slice is:


    B Input | Divider | Counter | A Output


    The signal on the B input can be configured to modify the way the counting works:


    +   - Count when B is high – in this mode the input starts and stops the count

    - Increment when B has a rising edge

    - Increment count when B has a falling edge


    To set the mode you need to use pwm_set_clkdiv_mode (uint slice_num, enum pwm_clkdiv_mode
    mode)

    with pwm_clkdiv_mode enumeration:


    ```

    PWM DIV FREE RUNNING,

    PWM DIV B HIGH

    PWM DIV B RISING

    PWM DIV_B_FALLING

    ```


    The first option is the usual configuration where the clock simply increments
    the counter.'
