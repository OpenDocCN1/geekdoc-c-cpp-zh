  md: "It is clear that you can't know the button has been pressed until it is released\
    \ so the actions are now all in the button pushed state. While the button is in\
    \ the pushed state it can be released and we can compute the time it has keeps\
    \ it has been pressed and modify the action accordingly.\n\n# FSM Ring Counter\n\
    \nAnother common input configuration is the ring counter. A ring counter moves\
    \ to a new output each time it receives an input and repeats when it reaches the\
    \ last output of the set. For example, if you have three output lines connected\
    \ to three LEDs initially LED 0 is on, when the user presses the button 1 is on\
    \ and the rest, the next press moves on to LED 2 and another press turns LED 0.\
    \ You can see as the user pressing the button LEDs go on and off in a repeating\
    \ sequence.\n\nA common implementation of a ring counter has a state for each\
    \ button press and release for each LED being. For three LEDs makes six states\
    \ and this has a number of disadvantages. A better idea is to have just two, button\
    \ pressed and released and use a press counter as an additional value. This means\
    \ what happens when you enter the button pressed state depends on the value of\
    \ the counter.\n\nWe also change from using the measurement of the button as pressed\
    \ or released and move to considering an \"edge\" signal. Generally we need inputs\
    \ that indicate an event located in time. Button \"pressed\" and button \"released\"\
    \ are events that are extended in time but \"press\" and \"release\" are localized\
    \ to small intervals that can be thought of as single measurements. In general\
    \ we prefer \"edge\" signals because these indicate when something changed.\n\n\
    Implementing this fairly easy:\n\n```\n#include <stdio.h>\n#include \"pico/stdlib.h\"\
    \n\nint main() \n{\n    stdio_init_all();\n    gpio_set_function(22, GPIO_FUNC_SI);\n\
    \    gpio_dir(22, false);\n    gpio_set_function(21, GPIO_FUNC_SI);\n    gpio_dir(21,\
    \ true);\n    gpio_set_function(20, GPIO_FUNC_SI);\n    gpio_dir(20, true);\n\
