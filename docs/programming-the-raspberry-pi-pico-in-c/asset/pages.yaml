  pgno: 191
- img_proc: true
  md: 'As a proof that the SPI bus is working, the first thing to try is to read the
    ID register which is at address 0xD0 and returns a single byte giving the id number
    which should be 0x60 for the BME280 and 0x58 for the BMP280.


    ```

    uint16_t wBuff[1] = {0xD0};

    uint16_t rBuff[8];

    ```


    ```

    gpio_put(17, 0);

    sppi_write_blocking(spi0, wBuff, 1);

    sleep_ms(10);

    sppi_read_blocking(spi0, 0, rBuff, 1);

    sleep_us(1);

    gpio_put(17, 1);

    ```


    ```

    printf("Chip ID is 0x%x\n", rBuff[0]);

    ```


    As long as this works we can move on to read the raw data. If it doesn''t work
    then you have connected the device incorrectly or the device is broken.

    We have to set up measurements we want to make and exactly how. This is controlled
    by two registers - 0xF4 controls pressure and temperature and 0xF2 controls humidity.
    You can see how the differences in these registers set the accuracy and rate of
    measurement in the datasheet, but for general use we can set both registers using:


    ```

    gpio_put(17, 0);

    sleep_us(1);

    wBuff[0] = 0xF2;

    wBuff[1] = 0x01;

    sppi_write_blocking(spi0, wBuff, 2);

    wBuff[0] = 0xF4;

    wBuff[1] = 0x27;

    sppi_write_blocking(spi0, wBuff, 2);

    gpio_put(17, 1);

    sleep_us(1);

    ```


    This sets the humidity, temperature and pressure measurement to x1 oversampling
    and normal mode sampling, which reads the sensors at a regular interval set by
    another register.

    To read the raw data we can use the same technique of writing a register address,
    but this time we read eight items of data:


    ```

    wBuff[0]=0xF7;

    gpio_put(17, 0);

    sppi_write_blocking(spi0, wBuff, 1);

    sleep_ms(10);

    sppi_read_blocking(spi0, 0, rBuff, 8);

    sleep_us(1);

    gpio_put(17, 1);

    ```'
