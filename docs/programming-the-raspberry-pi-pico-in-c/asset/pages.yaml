  md: '# Summary


    +   - Input is hard because things happen at any time, irrespective of what your
    program might be doing.


    +   - You can call gpio_get at any time to discover the state of a GPIO line –
    the problem is when and how often to call it.


    +   - You can chose between external or internal pull-up/pull-down resistors.


    +   - Mechanical input devices such as buttons have to be debounced.


    +   - The power of software is that it can enhance a simple device. The simple
    button is either pushed or released, but you can use this to generate a third
    “held” state.


    +   - Using a polling loop can you handle inputs as short as a few tens of microseconds.


    +   - Most IoT programs are best written as a polling loop.


    +   - The Finite State Machine (FSM) is one way of organizing a complex polling
    loop so that inputs are tested and outputs are set once for each time through
    the loop.


    +   - Ideally the states of a FSM should not be simple statements of the inputs
    of outputs that determine the state, but for simple systems this can be difficult
    to achieve.


    +   - It can be difficult to work out what constitutes the events of a FSM. Ideally
    they should be localized in time so that they indicate the moment that something
    happens.'
