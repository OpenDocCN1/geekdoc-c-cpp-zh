  md: "to flush any buffers in use call:\nstdio_flush(void)\n\nThe default UART is\
    \ also set up via defines in a header file:\n#define PICO DEFAULT UART 0\n#define\
    \ PICO DEFAULT UART TX_PIN 0\n#define PICO_DEFAULT_UART_RX_PIN 1\n\nYou can redefine\
    \ about stdio if you want to.\nThe important thing to realize about stdio is by\
    \ default its printf\nfunction is a simplified implementation of the one in the\
    \ full stdio. You can\nfind out more at: https://github.com/mpaland/printf\n\n\
    As well as printf you get implementations of:\nint sprintf(char* buffer, const\
    \ char* format, ...);\nint snprintf(char* buffer, size_t count, const char* format,\
    \ ...);\nint vsnprintf(char* buffer, size_t count, const char* format, va_list\
    \ va);\n\nwhich can be used to format a list of variables into a string. You can\
    \ think\nam working exactly like printf but sending their output to a string.\
    \ You\ncan ignore vsprintf and avoid vsnprintf and always use the safer snprintf\n\
    where you have to specify the length of the buffer and avoid any chance of\nbuffer\
    \ overflow.\n\n# Working With Small Buffers\n\nIf you have used serial communications\
    \ under an operating system such as\nLinux, you may be familiar with how it works\
    \ with the help of a large buffer.\nPico's serial interface has a very small buffer\
    \ and this makes a lot of\ndifference. For example, you can restrict any processing\
    \ of data to the time\nit takes to empty or fill the 32-element FIFO buffers.\
    \ This can be more\ndifficultult and tricky than you might think. Consider the\
    \ problem of echoing\nthe input on one UART to another.\n\n```\nint count = 0;\n\
    while (count < len - 1)\n{\n    buf[count++] = uart_get(uart1);\n}\nbuf[count]\
    \ = 0;\nprintf(\"%s\",buf);\n```"
