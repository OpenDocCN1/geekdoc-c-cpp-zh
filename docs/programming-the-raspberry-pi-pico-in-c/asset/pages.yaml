- img_proc: true
  md: '# Summary


    +   - The DHT22 is a low-cost temperature and humidity sensor.


    +   - It uses a custom single wire bus which is not compatible with the 1-nWire
    bus.


    +   - Its asynchronous protocol is easy to implement directly in user space.


    +   - A very simple checksum is used to detect errors.


    +   - It is possible to implement the protocol as defined in the data sheet using
    a PIO by using counting loops to time each pulse.


    +   - A better use of the PIO is to notice that the protocol can be decoded by
    testing the state of the line a fixed time after the rising edge.'
