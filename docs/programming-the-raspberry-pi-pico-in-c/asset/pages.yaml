  md: "# The Software\n\nWith the hardware shown above connected to the Pico, the\
    \ first thing that we need to do is establish that the system is working. The\
    \ simplest way to do this is to pull the line down for 1ms and see if the device\
    \ responds with a stream of pulses. These can be seen on a logic analyzer or an\
    \ oscilloscope, both are indispensable tools. If you don't have access to either\
    \ then you will just have to skip to the next stage and see if you can read in\
    \ some data.\n\nThe simplest code that will do the job:\n\n```\n#include <stdio.h>\n\
    #include \"pico/stdlib.h\"\n#include \"hardware/gpio.h\"\n\nint main() {\n   \
    \ stdio_init_all();\n    gpio_init(2);\n    gpio_set_dir(2, GPIO_OUT);\n    gpio_put(2,\
    \ 1);\n    sleep_ms(1);\n    gpio_put(2, 0);\n    sleep_ms(1);\n    gpio_set_dir(2,\
    \ GPIO_IN);\n    return 0;\n}\n```\n\nSetting the line initially, to ensure that\
    \ it is configured as an output, and then set it, wait for around 1ms and then\
    \ change its direction to input and allow the line to be pulled high.\n\nThere\
    \ is no need to set the line's pull-up mode because the Pico is the only device\
    \ driving the line until it releases the changing direction to input. When a line\
    \ is in input mode it is high impedance and this is why we need an external pull-up\
    \ resistor in the circuit.\n\nAs long as the circuit has been correctly assembled\
    \ and you have a working device, you should see something like:\n\n![](img/470d59c61482018b86da50823ee18a57_264_0.png)"
  merge: -1
  pgno: 264
- img_proc: true
  md: "# Reading the Data\n\nWith preliminary flight checks complete, it is time to\
    \ read the 40-bit data stream. The first thing to do is wait for the low that\
    \ the device sends before the start bit and then wait for the start bit:\n\n```\n\
    for (int i = 0; i < 2; i++) {\n    while (gpio_get(2) == 1);\n    while (gpio_get(2)\
    \ == 0);\n}\n```\n\nThe loop waits for two falling edges.\n\nNext we can start\
    \ to read the data. A total of 40 bits, i.e. 5 bytes, is difficult to work with\
    \ standard variable types. A good compromise is to read the first 32 bits into\
    \ a 32-bit unsigned integer and then read the byte variable. The reason is that\
    \ the fifth byte is a checksum, so we have many different ways to organize this\
    \ task.\n\nFirst we read the 32 data bits:\n\n```\nuint32_t t2;\nuint32_t data\
    \ = 0;\nuint32_t t1 = time_us(32);\nfor (int i = 0; i < 32; i++) {\n    while\
    \ (gpio_get(2) == 1);\n    while (gpio_get(2) == 0);\n    t2 = time_us(32);\n\
    \    data = data << 1;\n    data = data | ((t2 - t1) > 100);\n    t1 = t2;\n}\n\
    ```\n\nYou can see the general idea is to simply find the time between falling\
    \ edges and then treat anything bigger 100µs as a 1. In practice, the measured\
    \ times between falling edges is 80µs for a 0 and 120µs and 100 is a threshold\
    \ halfway between the two. The bits are shifted into the variable data so that\
    \ the first byte transmitted is the high-order byte."
  merge: -1
  pgno: 265
- img_proc: true
  md: "Next we need to read the checksum byte:\n\n```\nuint8_t checksum = 0;\nfor\
    \ (int i = 0; i < 8; i++) {\n    while (gpio_get(2) == 1){}\n    while (gpio_get(2)\
    \ == 0){}\n    t2 = time_us(32);\n    checksum = checksum << 1;\n    checksum\
    \ = checksum | (t2 - t1) > 100;\n}\n```\n\nThis works in the same way. At the\
    \ end of this we have 32 data bits in data and eight checksum bits in checksum\
    \ and all we have to do process the data to get the temperature and humidity.\n\
    \n# Extracting the Data\n\nYou can process the data without unpacking it into\
    \ individual bytes, but it is easier to see what is happening if we do:\n\n```\n\
    uint8_t byte1 = (data >> 24 & 0xFF);\nuint8_t byte2 = (data >> 16 & 0xFF);\nuint8_t\
    \ byte3 = (data >> 8 & 0xFF);\nuint8_t byte4 = (data & 0xFF);\n```\n\nThe first\
    \ two bytes are the humidity measurement and the second two are eight bits and\
    \ reduced to the temperature.\n\nThe checksum is just the sum of the four bytes\
    \ reduced to eight bits and we can test it using:\nprintf(\"Checksum %X %X\\n\"\
    , (byte1+byte2+byte3+byte4)&0xFF);\n\nIf you don't want to unpack the data then\
    \ you can use:\nprintf(\"Checksum %X\\n\", checksum, ((data & 0xFF) + (data >>\
    \ 8 & 0xFF)) + (data >> 16 & 0xFF) + (data >> 24 & 0xFF)) & 0xFF);\n\nIf the two\
    \ values are different, there has been a transmission error. The addition of the\
    \ bytes is done as a full integer and then is reduced back to a single byte by\
    \ the AND operation. If there is a checksum error, the simplest thing to do is\
    \ get another reading from the device. Notice, however, that you shouldn't read\
    \ the device more than once every two seconds.\n\nThe humidity and temperature\
    \ data are also easy to reconstruct as they are transmitted high byte first and\
    \ 10 times the actual value."
