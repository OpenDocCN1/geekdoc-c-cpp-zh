  md: '# Chapter 17


    # WiFi Using The ESP8266


    The Pico currently lacks WiFi which severely limits its utility as an IoT device.
    The ESP8266 provides a low cost and relatively easy way to remedy this. As we
    will make a lot of use of the Pico''s serial ports, it is assumed that you know
    roughly how this work. In particular, it is assumed that you are familiar with
    the material in the previous chapter.


    # The Amazing ESP8266


    Before we get on the details of using the ESP8266 we need to find out what makes
    it special. It is remarkably low cost, $5 or less, but it is a full microprocessor
    with GPIO lines, RAM and built-in WiFi. It is built by a Chinese company Espressif
    Systems, but there are a number of copies on the market. The proliferation of
    devices and software revisions makes it difficult to work with, but it is well
    worth the effort.


    While you can set up a development system yourself and program the ESP8266 to
    do almost anything, with built-in software that allows it to be used as a WiFi
    module for other processors. This is how we are going to use it to give WiFi capability
    to the Pico.


    ![](img/470d59c61482018b86da50823ee18a57_326_0.png)'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'There is another version, the ESP-07, which comes with a screen RF stage and
    other advantages, and this should also work. A bigger problem is that there are
    new versions of the firmware and some of these might not work in exactly the same
    way. However, it should be easy to make the changes necessary.


    # Connecting the ESP8266 ESP-01


    There are a number of minor problems in using the ESP8266. The first is that it
    comes with an 8-pin male connector which is not prototype board friendly. The
    best solution to this is to use some female-to-male jumper cables to connect it
    to the prototype board or use female-to-female cables to connect directly to the
    Pico. Note that for high baud rate cables should be kept as short as possible.


    You can power the ESP8266 directly from the Pico''s 3.3V supply pin, but if possible
    it is better to use an alternative as, when transmitting, the ESP8266 takes a
    lot of current, 300mA or so, and this means there isn''t lot left over to power
    other things. The maximum current for the Pico''s 3.3V isn''t given, but the chip
    used claims to be happy at 1200mA and it worked to run all of the examples in
    this chapter.


    The pinout of the ESP-01 is usually shown from the component side, but in fact
    the pins that you want to connect are on the other side. To make things easier,
    the two views are given in the diagram:


    ![](img/470d59c61482018b86da50823ee18a57_327_0.png)


    The pin functions are:


    +   1 Ground connect to ground

    2 TXO the serial tx pin

    3 GPIO2 ignore

    4 CHPD chip enable connect to 3.3V

    5 GPIO0 ignore

    6 RST reset leave unconnected

    7 RXI the serial rx pin

    8 VDD supply voltage connect to 3.3V'
  merge: -1
