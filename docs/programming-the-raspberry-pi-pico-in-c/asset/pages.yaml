- img_proc: true
  md: "This brings us to another important idea. Most of the timing in PIO programs\
    \ is linked to the time an instruction takes to complete and most instructions\
    \ take one clock cycle. This can cause difficulties in execution paths may not\
    \ be equal in time when you want them to be. For example consider consider PIO\
    \ program:\n\n```\n.program squarewave\n    set pind, 1 ; Set pin to output\n\
    again:\n    set pins, 1 ; Drive pin high\n    set pins, 0 ; Drive pin low\n  \
    \  jmp again ; Set PC to label `again`\n```\n\nThe first set pins takes 1 clock\
    \ cycle, the second takes one clock cycle meaning that the GPIO line is high for\
    \ one clock cycle and low for two clock cycles. There are a number of ways of\
    \ changing times. For example, you could include a nop instruction wastes a single\
    \ clock cycle but also uses one memory slot. Alternatively you could specify a\
    \ delay as part of the instruction – all PIO instructions can have a delay in\
    \ clock cycles specified as [n] at the end of the instruction. Our new program:\n\
    \n```\n.program squarewave\n    set pindirs, 1 ; Set pin to output\nagain:\n \
    \   set pins, 1 [1] ; Drive pin high\n    set pins, 0 [30] ; Drive pin low\n \
    \   jmp again ; Set PC to label `again`\n```\n\nHolds the line high for two clock\
    \ cycles and low for two clock cycles.\nWith the maximum clock divider this gives\
    \ a square wave output around 120kHz which is still fast enough for flashing an\
    \ LED. The maximum delay you can specify in any instruction is 31 clock cycles\
    \ so even:\n\n```\n.program squarewave\n    set pindirs, 1 ; Set pin to output\n\
    again:\n    set pins, 1 [31] ; Drive pin high\n    set pins, 0 [] ; Drive pin\
    \ low\n    jmp again ; Set PC to label `again`\n```\n\nonly brings the clock down\
    \ to 7.5kHz.\nIn general you should try to choose a clock frequency that makes\
    \ timing of pulses using just per instruction delays to adjust the relative times.\
    \ Each instruction and delay takes one clock cycle so this is the natural unit\
    \ of measurement to use.\nIn our case we need a much longer than 32 clock cycles\
    \ instruction delays can produce – we need a spin wait loop."
  merge: -1
