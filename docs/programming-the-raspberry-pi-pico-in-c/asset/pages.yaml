- img_proc: true
  md: 'To load the code all we have to do is:

    int offset = pio_add_program(pio,&squarewave_program);


    In this case we have decided to use pio0.


    Now we have the code loaded into pio0 the next job is to pick one of the four

    possible state machines to execute and configure it. To select a state machine

    it is better to let the SDK select the first free machine:


    ```

    uint sm = pio_claim_unused_sm(pio, true);

    ```


    The final parameter will cause the program to fail if there are no state

    machine available. Set the final parameter to fail and the return value is

    negative rather than a state index in case of error.


    With the state machine we are going to get settled, we can now configure

    You could do this directly, but the simplest and best way to do the job is to

    use the SDK. This allows you to set up a struct with all of the configuration

    values set and then initialize the state machine in one go. We need a

    default configuration so we only need to change the values that matter:


    ```

    pio_sm_config c = squarewave_program_get_default_config(offset);

    ```


    Now we have set the configuration as promised. We need to specify which

    pins are going to be in the SET group:

    sm_config_set_pins(&c, 2, 1);


    and in this case we have selected just one pin, GP2, as the group starts at GP2

    and has just one pin. This means that our set instruction in the PIO program

    will toggle pin GP2. We also have to set the GPIO function to

    GPIO_FUNC_PIO0 to let the processor know that this pin is being controlled

    by the PIO. Instead of using the standard:


    ```

    gpio_set_function(2, GPIO_FUNC_PIO0);

    ```


    you can use the specific PIO function to do the same job:

    pio_gpio_init(pio, 2);


    Finally we can load the configuration into the state machine and start it

    running:


    ```

    pio_sm_init(pio, sm, offset, &);

    pio_sm_set_enabled(pio, sm, true);

    ```


    If you now look at the output of GP2 you will see a square wave.'
