    \n![](img/470d59c61482018b86da50823ee18a57_52_0.png)\n\nWhen you run the program\
    \ you will not see any debug information relating to the C program, only the assembler\
    \ that it creates.\n\nIf you do this the pulses are 50ns in width – which compares\
    \ well to the 70ns similar program creates on a Pi Zero or Pi 4. There are no\
    \ major irregularities due to interrupts or software system, but the pulses occur\
    \ in groups of two with a long 200ns gap:\n\n| 157.866ms | +200ns | +400ns | +600ns\
    \ | +800ns | 157.869ms | +200ns | +40 |\n| --- | --- | --- | --- | --- | --- |\
    \ --- | --- |\n| | | | | | | | |\n| ▼ Measurements | Width: 50ns |\n| | Period:\
    \ 250ns |\n| | DutyCycle: 20% |\n| | Frequency: 4MHz |\n| ▼ Pulse Counters | +\n\
    \n53"
