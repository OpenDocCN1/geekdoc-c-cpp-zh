- img_proc: true
  md: 'terminated. That is, the end of a string is indicated by a zero and not by
    the length of the array. You can send a string to the serial interface using:

    uart_puts (uart_inst_t *uart, const char *s)


    This is blocking and there is no equivalent to get a string, but it isn''t difficult
    to create one.


    This is an appropriate place to point out the, hopefully well-known, fact that
    null strings are dangerous in that it is far too easy to create a buffer overrun
    by not having a null termination in a supposed string. The standard C library
    has functions that allow you to work with strings, but with a maximum length indicated
    as a parameter to avoid overflows.


    Finally, it is worth mentioning that there is a function that will send a break
    signal. The break signal does not correspond to any character that you can send
    in the usual way – it corresponds to holding the TX line for more than the time
    to transmit a single character. It is not often used today, but there are serial-based
    protocols that use the break to synchronize data transfer. You can send a break
    using:


    ```

    uart_set_break (uart_inst_t *uart, bool)

    ```


    # Stdio


    The Pico supports the C Stdio library this can be used to send and receive data
    via UART or via the USB port. It also has non-standard extensions designed to
    make it easier to work with the hardware. The main advantage of using stdio is
    the availability of printf. Notice that there can be multiple devices connected
    to either stdin or stdout. In this section the focus is on using the UART – there
    are similar functions for using the USB as a serial interface.


    To initialize all devices use:


    ```

    stdio_init_all (void)

    ```


    To initialize just the default UART:


    ```

    void stdio_uart_init (void)

    ```


    and to initialize it just as stdout or stdin use:


    ```

    void stdout_uart_init (void)

    void stdin_uart_init (void)

    ```


    If you want to configure the UART then use:


    ```

    stdio_uart_init_full (uart_inst_t *uart, uint baud_rate)

    int tx_pin, int rx_pin)

    ```'
