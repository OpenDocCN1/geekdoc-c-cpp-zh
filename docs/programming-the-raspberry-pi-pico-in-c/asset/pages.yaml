  md: "# Press Or Hold\n\nYou can carry on elaborating on how to respond to a button.\
    \ For example, most users have grown accustomed to the idea that holding a button\
    \ down for a longer time than a press makes something different happen. To distinguish\
    \ between a press and a hold all you need to do is time the difference between\
    \ line down and line up:\n\n```\n#include \"pico/stdlib.h\"\nint main() {\n  \
    \  gpio_set_function(21, GPIO_FUNC_SIO);\n    gpio_set_dir(21, false);\n    gpio_pull_down(21);\n\
    \n    gpio_set_function(22, GPIO_FUNC_SIO);\n    gpio_set_dir(22, true);\n   \
    \ gpio_put(22, 0);\n\n    uint64_t t;\n    while (true) {\n        while (gpio_get(21)\
    \ == 0) {\n            t = time_us(64);\n            sleep_ms(1);\n        }\n\
    \        while (gpio_get(21) == 1) {\n            t = (uint64_t)(time_us(64) -\
    \ t);\n        }\n        if (t < 2000*1000) {\n            gpio_put(22, 1);\n\
    \            sleep_ms(1000);\n            gpio_put(22, 0);\n        }\n      \
    \  else {\n            for (int i = 0; i < 10; i++) {\n                gpio_put(22,\
    \ 1);\n                sleep_ms(100);\n                gpio_put(22, 0);\n    \
    \            sleep_ms(100);\n            }\n        }\n    }\n}\n```"
