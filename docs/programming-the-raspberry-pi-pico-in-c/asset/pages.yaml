    \ GPIO_FUNC_SIO);\n    gpio_set_dir(22, true);\n    while (true) {\n        gpio_put(22,\
    \ 1);\n        gpio_put(22, 0);\n    }\n}\n```\n\nHowever, to get the best possible\
    \ result you have to compile the program as a Release build. Click on the CMake\
