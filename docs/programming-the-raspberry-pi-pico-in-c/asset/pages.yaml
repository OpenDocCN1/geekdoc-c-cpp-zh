    \n# Stepper Motor Rotation – Using Timers\n\nMost of the time you use a stepper\
    \ motor to move to a given position by executing an exact number of steps. If\
    \ you do not want to make a stepper motor rotate then you need to arrange to step\
    \ at a regular rate. The simplest way to do this with a Pico is to use a timer\
    \ interrupt. There is a low-level set of functions allowing you to interact with\
    \ the four hardware timers, but the higher-level repeating_timer set of functions\
    \ is much easier to use for interrupts.\n\nThe most useful functions are:\n\n\
    ```\nadd_repeating_timer (int64_t delay_us,\n    repeating_timer_t callback_callback,\n\
    \    void *user_data, repeating_timer_t *out)\n\nadd_repeating_timer_ms (int32_t\
    \ delay_ms,\n    repeating_timer_t callback_callback,\n    void *user_data, repeating_timer_t\
    \ *out)\n```\n\n```\ncancel_repeating_timer (repeating_timer_t *timer)\n```\n\n\
    The first adds a repeating timer with a repeat time in microseconds or milliseconds.\
    \ The second cancels a timer. The important points to note are that you need a\
    \ repeating_timer struct to pass to each of these functions and this has to exist\
    \ while the timer is running. The struct is used to record the"
  merge: -1
  pgno: 171
- img_proc: true
  md: "details of the timer and you can mostly ignore it apart from the user_data\
    \ field which can be used to pass data to the interrupt handler. The callback\
    \ is a function that accepts a repeating_timer struct as its only parameter. To\
    \ make the motor rotate continuously we need to set up a timer which calls a step\
    \ function at the correct interval:\n\n```\nbool step(struct repeating_timer *t)\n\
    {\n    StepperBi *s = (StepperBi*) (t->user_data);\n    if (s->forward)\n{\n \
    \       stepForward(s);\n    } else {\n        stepReverse(s);\n    }\n    return\
    \ true;\n}\n```\n\nYou can see that this function simply steps the motor forward\
    \ or backward depending on the setting of the dir field. Notice that the stepper\
    \ motor in use is determined by the user_data passed in. To make this work we\
    \ need a function to set up the timer interrupt:\nstruct repeating_timer *timer;\n\
    \n```\nvoid rotate(StepperBi *s, bool dir, int speed)\n{\n    cancel_repeating_timer(&timer);\n\
    \    s->forward = dir;\n    if (speed == 0)\n    {\n        s->speed = 0;\n  \
    \      return;\n    }\n    s->speed = 1000 * 1000 / (4 * speed);\n    add_repeating_timer(s->speed,\
    \ step, s, &timer);\n}\n```\n\nNotice that we have to deal with the case of speed\
    \ set to zero to avoid a divide by zero exception. The speed is specified in rpm\
    \ *100. So setting speed to 250 gives a rotation of 2.5rpm."
