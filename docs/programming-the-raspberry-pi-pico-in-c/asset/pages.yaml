  md: '# Summary


    +   - The I2C bus is simple yet flexible and is one of the most commonly encountered
    ways of connecting devices.


    +   - The I2C bus uses two wires – a data line and a clock.


    +   - The Pico has two I2C interfaces.


    +   - Each I2C interface can be connected to a pair of GPIO lines.


    +   - The I2C protocol isn''t standardized and you have to take account of variations
    in the way devices implement it.


    +   - There are single byte transfer operations and multibyte transfers which
    differ in when a stop bit is sent.


    +   - The low-level protocol can be made slightly high-level by thinking of it
    as a single write or read a register operation.


    +   - Sometimes a device cannot respond immediately and needs to keep the master
    waiting for data. There are two ways to do this, polling and clock stretching.


    +   - The HTU21D is a simple I2C device, but getting it working involves using
    polling or stretching.


    +   - Computing a check sum is an involved, but common, operation.'
