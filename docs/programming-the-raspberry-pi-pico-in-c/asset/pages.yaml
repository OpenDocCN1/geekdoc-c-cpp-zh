  md: 'The Clean Rebuild All Projects option rebuilds everything in the project including
    the SDK and files that haven''t changed since the last build. If you click the
    Build All Projects icon then only the files that have changed since the last build
    are recompiled. This is usually much faster and is the option to use unless something
    doesn''t work because files have out of sync.


    ![](img/470d59c61482018b86da50823ee18a57_30_0.png)


    For first compile you will see a lot of messages about what is being compiled
    and so on and it will take a few minutes. On a subsequent build files that have
    changed are recompiled and things are quicker. Once the compile is complete you
    will find the results in the build directory. The file that you want in this instance
    is vblinky.uf2 which can be run by dragging-and-dropping it onto the USB drive
    that a connected Pico presents to the development machine.


    To run the program the simplest thing to do is connect a Pico to the development
    machine via USB. The USB connection will also power the Pico, and to get the Pico
    to present a USB drive to the development machine you have to hold the BootSel
    button which is to the left of the USB connector as the power is applied. If you
    have done this correctly you will see a new drive added to the development machine
    and you will have to supply a password to mount it:


    ![](img/470d59c61482018b86da50823ee18a57_30_1.png)


