- img_proc: true
  md: "# Changing The Duty Cycle\n\nFor reasons that will be discussed later, in most\
    \ cases the whole point is to vary the duty cycle or the period of the pulse train.\
    \ This means that the next question is, how fast can you change the characteristic\
    \ of a PWM line? In other words, how fast can you change the duty cycle? There\
    \ is no easy way to give an exact answer and, in most applications, an exact answer\
    \ isn't of much value. The reason is that for a PWM signal to convey information\
    \ it generally has to deliver a number of complete cycles with a given duty cycle.\
    \ This is because of the way pulses are often averaged in applications.\n\nWe\
    \ also have another problem – synchronization. It is more subtle than it first\
    \ seems. The hardware won't change the duty cycle until the current pulse is complete,\
    \ i.e. when the counter reaches zero and then takes effect. So you might think\
    \ that the following program to switch between two duty cycles on a pulse basis\
    \ (remember to add hardware_pwm to the CMakeLists.txt file):\n\n```\n#include\
    \ <stdio.h>\n#include \"hardware/pwm.h\"\nint main()\n{\n    gpio_set_function(20,\
    \ GPIO_FUNC_PWM);\n\n    uint slice_num = pwm_gpio_to_slice_num(20);\n    uint\
    \ chan20 = pwm_gpio_to_channel(20);\n\n    uint wrap = pwm_set_freq_duty(slice_num,\
    \ chan20, 50, 50);\n\n    pwm_set_enabled(slice_num, true);\n    while (true)\n\
    {\n        pwm_set_duty(slice_num, chan20, 25);\n        pwm_set_duty(slice_num,\
    \ chan20, 50);\n    }\n    return 0;\n}\n```\n\nIf you try this out the result\
    \ isn't what you might expect on a first analysis:\n\n![](img/470d59c61482018b86da50823ee18a57_125_0.png)"
  merge: -1
  pgno: 125
- img_proc: true
  md: 'You don''t get 25% and one 50% pulse by a set of each of varying number. The
    reason is, of course, that the duty cycle is being set asynchronously to the counter
    wrap. This means that the effective duty cycle depends on the last update. To
    make this work you need to detect when the counter reaches zero and only update
    once per counter detected. To do this we need some counter functions.


    # Working With The Counter


    It is clear to change the duty cycle synchronously we need access to the current
    state of the counter. The SDK provider provides the following functions:


    ```

    uint16_t pwm_get_counter(uint slice_num)

    pwm set_counter(uint slice_num, uint16_t c)

    pwm_advance_count(uint slice_num)

    wm_retard_count(uint slice_num)

    ```


    The most generally useful is pwm_get_counter, which returns the counter''s current
    value. You can use this to test in the PWM period the slice is.

    Less useful are the pwm_set_counter, pwm_advance_count and pwm_retard_count functions.
    These can be used to modify the counter by setting it to a new value or adding
    subtracting from its current value. Why would you want to do this? By setting
    the counter to a new value you can modify the instantaneous frequency of the PWM
    signal, which is something you would want to do if you were using PWM for signaling
    or generating musical tones. You also need to know that the advance and retard
    functions work by blocking counter pulses, not modifying the counter register,
    and for the advance to work you have to be using a clock greater than one.


    Returning to the example in the previous section we can make use of the pwm_get_counter
    function to test when it is to update the duty cycle (remember to add _pwm_ to
    the CMakeLists.txt file):


    ```

    int main() {

    gpio_set_function(20, GPIO_FUNC PWM);

    uint slice_num = pwm_gpio_to_slice(20);

    uint chan20 = pwm_gpio_to_channel(20);

    uint wrap = pwm_freq_duty(slice_num, chan20, 50, 50);

    pwm_set_enabled(slice_num, true);

    while (true) {

    pwm_set_duty(slice_num, chan20, 25);

    while (pwm_get_counter(slice_num)) { };

    pwm_set_duty(slice_num, chan20, 50);

    while (pwm_get_counter(slice_num)) { };

    }

    return 0;

    }

    ```'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'Notice that as the duty cycle is set after the counter reaches zero, it is
    the pulse after the next pulse that has its duty cycle changed.


    ![](img/470d59c61482018b86da50823ee18a57_127_0.png)


    If you want to change the next pulse you will need to set the duty cycle at a
    count of one.


    What is the fastest PWM signal you can generate using this method so that the
    duty cycle changes at every pulse? The answer is surprisingly low, around 300Hz.
    This could be improved on optimizing the program, but overall this is not a fast
    way to modify the PWM slice. A better way is to use interrupts.


    # Using PWM Interrupts


    Changing the duty cycle is one time when interrupts are faster than polling. The
    reason is that testing the value of the counter is slow but firing an interrupt
    on wrap is fast. We could make the polling loop faster than the interrupt by testing
    on events rather than the counter''s value, but the SDK supports PWM interrupts
    and not events.


    There are a number of PWM interrupt functions:


    ```

    pwm_set_irq_enabled(uint slice_name, bool enabled)

    pwm_set_irq_mask(uint32_t mask, bool enabled)

    pwm_clear_irq(uint slice_name)

    static uint32_t pwm_get_irq_status_mask(void)

    pwm_force_irq(uint slice_name)

    ```


    The two important functions are pwm_set_irq_enabled and pwm_irq. The first enables
    the interrupt on the specified slice and the second clears the interrupt. In general,
    you need to clear the interrupt before enabling it and clear it when you enter
    the IRQ handler. You can enable multiple slices using the pwm_set_irq_mask enabled
    function. The mask has only one bit per slice starting with bit 0 and slice and
    so on. The pwm_get_irq_status_mask function gets the status of which slices are
    enabled using the same mask format. Finally pwm_force_irq triggers an interrupt
    under software control.'
  merge: -1
  pgno: 127
- img_proc: true
  md: "At this point, you might be wondering where the function defines the interrupt\
    \ handler is. The GPIO lines have such a function for their IRQ handler, but the\
    \ PWM slices make use of the more general Pico interrupt handling. The function:\n\
    \n```\nirq_set_exclusive_handler (uint num, irq_handler_t handler)\nsets an interrupt\
    \ handler for one of the Pico's interrupts. The PWM slices use IRQ 4 or PWM_IRQ_WRAP.\
    \ That is, any slice that calls an interrupt generates IRQ 4 and calls the IRQ\
    \ 4. There is a mechanism to allow multiple handlers to be attached to a given\
    \ IRQ number, but the simplest way of doing things is to use irq_set_exclusive_handler\
    \ to set a single IRQ handler for the interrupt number. In the case of the PWM\
    \ hardware you can do this using:\n```\n\n```\nirq_set_exclusive_handler(PWM_IRQ_WRAP,\
    \ MyIRQHandler);\n```\n\nNow we have a handler set we also have to enable the\
    \ IRQ using:\nirq_set_enabled (uint num, bool enabled)\n\nwhich for the PWM interrupt\
    \ gives:\nirq_set_enabled(PWM_IRQ_WRAP, true);\n\nNotice that we have to enable\
    \ two things to make PWM IRQs work. First you need to enable the interrupt itself\
    \ and the slices that can generate interrupt. It isn't enough just to enable the\
    \ slice.\n\nWe can now put all this together and write a program that changes\
    \ the duty cycle of each pulse using an interrupt (remember to add hardware_pwm\
    \ to CMakeLists.txt file):\n\n```\n#include \"pico/stdlib.h\"\n#include \"hardware/pwm.h\"\
    \n#include \"hardware/irq.h\"\n```\n\n```\nuint slice_num;\nuint chan20;\nuint\
    \ state = 0;\nvoid MyIRQHandler(){\n    pwm_clear_irq(slice_num);\n    if (state)\
    \ {\n        pwm_set_duty_cycle(slice_num, chan20, 25);\n    } else {\n      \
    \  pwm_set_duty_cycle(slice_num, chan20, 50);\n    }\n    state = ~state;\n}\n\
    ```"
  merge: -1
  pgno: 128
- img_proc: true
  md: "```\nint main()\n{\n    gpio_set_function(20, GPIO_FUNC_PWM);\n\n    slice\
    \ num = pwm_gpio_to_slice_num(20);\n    chan20 = pwm_gpio_to_channel(20);\n\n\
    \    pwm clear irq(slice num);\n    pwm_set_irq_enabled(slice num, true);\n  \
    \  irq_set_exclusive_handler(PWM IRQ WRAP, MyIRQHandler);\n    irq_set_enabled(PWM_IRQ_WRAP,\
    \ true);\n\n    unsigned int wrap = pwm_set_freq_duty(slice_num, chan20, 100000,\
    \ 25);\n    pwm_set_enabled(slice_num, true);\n    while (true)\n    {\n     \
    \   return 0;\n    }\n}\n```\n\nYou need the functions defined in previous sections\
    \ and:\n#include \"hardware/irq.h\"\n\nYou can see that the IRQ handlers simply\
    \ change the duty cycle by keeping an odd/even state variable. Also notice that\
    \ we have to clear any pending IRQs – If you don't the program will simply hang.\n\
    \nIf you try out you will discover that it works up to around 100kHz, which is\
    \ 300Hz of the polling method that tests the counter value.\n\n# Uses Of PWM –\
    \ Digital Analog\n\nWhat sorts of things do you use PWM for? There are lots of\
    \ very clever uses for PWM. However, there are two use cases which account for\
    \ most PWM applications – voltage or power modulation and signaling to servos.\n\
    \nThe amount of power delivered to a device by a pulse train is proportional to\
    \ the duty cycle. A pulse train with a 50% duty cycle is delivering current to\
    \ the load only 50% of the time and this is irrespective of the pulse repetition\
    \ rate. The duty cycle controls the power, but the period still matters in many\
    \ situations because you want to avoid any flashing or other effects. A higher\
    \ frequency smooths out the power flow at any duty cycle.\n\nIf you add a low-pass\
    \ filter to the output of a PWM signal then you will get a voltage that is proportional\
    \ to the duty cycle. This can be looked at many different ways, but again it is\
    \ the result of the amount of power delivered by a"
  merge: -1
  pgno: 129
- img_proc: true
  md: "PWM signal. You can also think of it as the filter to remove the high-frequency\
    \ components of the signal, leaving only the slower components due to the modulation\
    \ of the duty cycle depends on the duty cycle resolution. If you work\n\n8-bit\
    \ resolution your D-to-A conversion will have 256 steps, which at 3.3V gives a\
    \ potential resolution of 3.3/256 or about 13mV. This is often good enough. With\
    \ a wrap of 255 and a clock divider of 1 gives a sampling frequency of approximately\
    \ 488kHz. The PWM output in this configuration mimics the works of an 8-bit A-to-D\
    \ converter. You set the duty cycle using each value of 0 to 256 for level and\
    \ get a voltage output that is\n\n3.3*/256V. The theoretical (Nyquist) rate gives\
    \ the maximum frequency that can be represented as 488/2=244kHz, but for simple\
    \ reproduction systems the upper limit is simpler. A typical rule of thumb is\
    \ that the sampling frequency should be at least seven times higher than the highest\
    \ frequency you hope to generate, i. around 70kHz.\n\nIf use 16-bit resolution,\
    \ which is what CD audio quality uses, the sampling rate drops to 1.9kHz, which\
    \ is well below the 44kHz generally used.\n\nTo demonstrate the sort of approach\
    \ that you can take to D-to-A conversion, the following program creates a sine\
    \ wave. To do we need to compute the duty cycle for 256 points in a complete cycle.\
    \ We could do this time a value is needed, but to make the program fast enough\
    \ to compute the 256 points and store them in an array. While there are fixed\
    \ point arithmetic ways of computing the sine or the cos of an angle, it is simpler\
    \ to use the Pico's built-in floating-point software. Notice that the Pico does\
    \ not have floating-point implemented in hardware and it is best to avoid it if\
    \ possible. If we only want to update the duty cycle once each sample point, the\
    \ simplest solution is to use an interrupt handler to do the job. The program\
    \ is:\n\n```\n#include \"pico/stdlib.h\"\n#include \"hardware/pwm.h\"\n#include\
    \ \"hardware/irq.h\"\n#include \"math.h\"\n```\n\n```\nuint32_t pwm_get_wrap(uint\
    \ slice_num)\n  valid_params_if(PWM, slice_num >= 0 & slice_num < NUM_PWM_SLICES);\n\
    \  return pwm->slice[slice_num].top);\n```\n\n```\nvoid pwm_set_duty(uint slice_num,\
    \ uint chan, int d)\n{\n  pwm_set_channel_level(slice_num, chan, pwm_get_wrap(slice_num)*d/100);\n\
    }\n```"
  merge: -1
  pgno: 130
- img_proc: true
  md: "```\nuint slice num;\nuint chan20;\nint state = 0;\nint8_t wave[256];\n\nvoid\
    \ MyIRQHandler()\n{\n    pwm_clear_irq(slice num);\n    pwm_set_duty(slice num,\
    \ chan20, wave[state]);\n    state = (state + 1) % 256;\n}\n```\n\n```\nint main()\n\
    {\n    for (int i = 0; i < 256; i++)\n        wave[i] = (uint8_t)((128.0 + (float)i\
    \ * 2.0 * 3.14159 / 256.0) * 128.0) / 100.0 / 256.0;\n```\n\n```\ngpio_set_function(22,\
    \ GPIO_PWC_PWM);\n\nslice_num = pwm_gpio_to_slice_num(22);\nint chan22 = pwm_gpio_to_channel(22);\n\
    \npwm_clear_irq(slice_num);\npwm_set_irq_enabled(slice_num, true);\nirq_set_exclusive_handler(PWM_IRQ_WRAP,\
    \ MyIRQHandler);\nirq_set_enabled(PWM_IRQ_WRAP, true);\n\npwm_set_cldkdiv_int_frac(slice_num,\
    \ 1, 0);\npwm_set_wrap(slice_num, 255);\n\npwm_set_enabled(slice_num, true);\n\
    {\n    return 0;\n}\n```\n\nThe duty cycle values needed are computed and stored\
    \ in the wave array. Then the PWM is set up to use a divider of 1 and a wrap of\
    \ 255 and the interrupt is enabled. The interrupt handler simply sets the level\
    \ to each value in the wave array turn. The waveform repeats after around 526µs,\
    \ which makes the frequency around 1.9kHz."
  merge: -1
  pgno: 131
- img_proc: true
  md: 'To see the analog waveform, we need to put the digital output into a low-pass
    filter. A simple resistor and capacitor work reasonably well:


    ![](img/470d59c61482018b86da50823ee18a57_132_0.png)


    The filter''s cutoff is around 33kHz and might be a little on the high side for
    this low-frequency, 2kHz, output, but it produces a reasonable waveform:


    ![](img/470d59c61482018b86da50823ee18a57_132_1.png)


    You can create a sine wave, or any other waveform you need, using the same techniques,
    but for high quality audio you need a higher sampling rate.


    # Frequency Modulation


    Using PWM to create musical tones, and sound effects in general, is a well-explored
    area which is too big to cover in this book. In most cases we choose to vary the
    duty cycle at a fixed sample rate, but an alternative is to leave the duty cycle
    fixed at sat, 50% and modulate the frequency. You can use this approach to create
    simple musical tones and scales.'
  merge: -1
  pgno: 132
- img_proc: true
  md: "As the frequency of middle C is 281.6Hz. to generate middle C you could use:\n\
    int main()\n\n```\n{\n  gpio_set_function(22, GPIO_FUNC_PWM);\n  uint slice_num\
    \ = pwm_gpio_to_slice_num(22);\n\n  uint chan22 = pwm_gpio_to_channel(22);\n \
    \ pwm_set_freq_duty(slice_num, chan22, 281, 50);\n\n  pwm_set_enabled(slice_num,\
    \ true);\n}\n```\n\nThe resulting output is a square wave with a measured frequency\
    \ of 281Hz which isn't particularly nice to listen to. You can improve it by feeding\
    \ it through a simple low-pass filter like the one used above for waveform synthesis.\
    \ You can look up the frequencies for other notes and use a table to generate\
    \ them.\n\n# Controlling An LED\n\nYou can also use PWM to generate physical quantities\
    \ such as an LED or the rotation rate of a DC motor. The only differences required\
    \ by these applications are to do with the voltage and current you need and the\
    \ way the duty cycle relates to whatever the physical effect is. In other words,\
    \ if you want to change some effect by 50%, how much do you need to change the\
    \ duty cycle? For example is example to drive the onboard LED with a PWM signal:\n\
    \nThe simplest example is to drive the onboard LED with a PWM signal:\n```c\n\
    #include \"pico/stdlib.h\"\n#include \"hardware/pwm.h\"\nint main()\n```\n\n```\n\
    {\n  gpio_set_function(25, GPIO_FUNC_PWM);\n  uint slice_num = pwm_gpio_to_slice_num(25);\n\
    \  uint chan = pwm_gpio_to_channel(25);\n  pwm_set_freq_duty(slice_num, chan,\
    \ 2000, 0);\n  pwm_set_enabled(slice_num, true);\n}\n```\n\n```\n{\n  while (true)\n\
    {\n    for (int d = 0; d <= 100; d++) {\n      pwm_set_duty(slice_num, chan, d);\n\
    \      sleep_ms(50);\n    }\n  }\n}\n```"
