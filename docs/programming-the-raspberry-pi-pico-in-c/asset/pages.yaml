- img_proc: true
  md: '# Summary


    +   - The serial port is one of the oldest ways of connecting devices together,
    but it is still very much in use.


    +   - The serial protocol is asynchronous, but simple. A start bit gives the timing
    for the entire exchange.


    +   - There are many control lines once used with telephone equipment that are
    mostly ignored in computer use. Similarly, the original ±12V signaling has been
    mostly replaced by 5V, and even 3.3V, signaling.


    +   - The standard hardware that implements a serial connection is usually called
    a UART.


    +   - The Pico contains two UARTs in addition to the USB serial connection.


    +   - The SDK provides functions for initializing and sending and receiving data.


    +   - Each UART has a 32 element FIFO send and receive buffer which can be disabled.


    +   - You can use the read and write blocking functions to send and receive byte
    buffers of data.


    +   - There are also functions to work with single characters and strings.


    +   - The stdio library provides an efficient implementation of printf.


    +   - As the UART buffers are small all transactions should be in terms of amounts
    of data that do not fill the buffers.'
  merge: -1
