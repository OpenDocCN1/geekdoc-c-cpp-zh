  md: '# # Chapter 2

    Getting Started


    It is natural to program the Pico in C. It is what its system software is written
    in and it is the only way to get at many of the sophisticated and powerful features
    it offers. You can get a long way with Python or some other language, but to get
    all of the way you need C.


    You can describe C as a machine-independent assembly language and hence when you
    learn it you get deeper into the system than with other languages and discover
    what is really going on. If you need to learn C as it is used in IoT programming
    then see Fundamental C: Getting Closer To The Machine, ISBN: 9781871962604.


    Sometimes you do not need speed, even in an IoT application. For example, if you
    just want to flash a few LEDs or read a temperature sensor in a human timescale,
    then you can write in almost any language. However, if you want to interface directly
    with other systems and externally connected hardware at its full speed, C is your
    best choice. If timing is critical, then C is the only way to go. Simply, if you
    can''t make your application work enough in C, then you probably can''t in any
    language as C, being so “low-level”, makes it easy to access the underlying hardware.


    Put simply, C is a great language for any interfacing, IoT or embedded program
    and it leads to C++ and many more sophisticated languages.


    So C is worth learning and the Pico provides low-cost hardware to experiment with.
    With do we get started?


    # ## Getting Started In C


    The Raspberry Pi website has lots of detailed instructions on how to get started
    programming in C. What might surprise you, and perhaps even put you off, is that
    there are many steps involved. The reason is that you need to install a complete
    C development system, often called a “toolchain”, on the machine that you plan
    to write programs that will run on the Pico. Notice that it isn''t sensible to
    use a Pico to develop code for a Pico – it is just powerful enough, but the toolchain
    generally needs a full operating system which the Pico doesn''t have. So you have
    to use another computer system to develop programs for the Pico and at the moment
    there'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'types of system supported – Linux, Windows and Mac OS. The Pico website has
    a definite preference for using Linux in the form of Pi OS running on a Pi 4 or
    a Pi 400. This is a very attractive option, but using Windows or a Mac is attractive
    to any programmer familiar with their operating systems and ways of working.


    It isn''t useful to go into the exact steps needed to install the necessary software
    – the procedures change and they are well-documented on the Pico website. What
    is useful to make clear why the steps are necessary and how the parts of the toolchain
    fit together. This knowledge makes it easier to understand the steps and to troubleshoot
    what goes wrong.


    You also have a choice of how to create programs on the Pico – the editor or IDE
    to use. While the Pico website attempts to be neutral and suggest anything, there
    are big advantages in opting to use Visual Studio, VS Code. It is free, open source
    multi-language editor that offers many features that make programming easier,
    faster and less error-prone. It is advised that you adopt VS Code even though
    it might take more time to get started if you haven''t used it before. It is a
    general skill that will continue to be useful if you and when you move away from
    programming the Pico in C.


    Finally, it is worth saying that is is very worthwhile to use a Pi 4 as your development
    machine. This is preferable to using another Linux system, Windows or Mac OS.
    The reason is twofold. First, the Pi4 runs Linux software, which is the basis
    of the entire toolchain. For example, the toolchain only runs on Windows after
    some effort to make it feel at home – Linux it is already at home. Second, the
    Pi 4 has GPIO lines which are readily available and can be used to make a debugging
    connection to the Pico. If you use a Windows or Mac development machine you either
    have to use a dedicated debugging device or you have to use a second Pico to act
    as a debugging device. This isn''t expensive, but it is more complicated. While
    you might think that you probably don''t need a debug connection – you do. The
    difficulties of working without one are so great that you have to regard a debugging
    connection as part of a “standard configuration” and hence how difficult it is
    to set up is an issue.'
  merge: -1
