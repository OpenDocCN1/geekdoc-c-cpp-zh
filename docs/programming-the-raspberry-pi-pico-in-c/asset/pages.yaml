  md: "# The Simple Button\n\nOne of the most common input circuits is the switch\
    \ or button. If you want another external button you can use any GPIO line and\
    \ the circuit explained in the previous chapter. That is, the switch has to have\
    \ either a pull-up or pull-down resistor either by you or a built-in one using\
    \ software.\n\nThe simplest input program using an internal pull-up is:\n\n```\n\
    #include \"pico/stdlib.h\"\nint main()\n{\n    gpio_set_function(21, GPIO_FUNC_SIO);\n\
    \    gpio_set_dir(21,false);\n    gpio_pull_up(21);\n\n    gpio_set_function(22,\
    \ GPIO_FUNC_SIO);\n    gpio_set_dir(22, true);\n\n    while (true)\n{\n      \
    \  if (gpio_get(21))\n        {\n            gpio_put(22, 0);\n        }\n   \
    \     else\n        {\n            gpio_put(22, 1);\n        }\n    }\n}\n```\n\
    \nAs the internal pull-down resistor is used, the switch can be connected to the\
    \ line and ground without any external resistors:\n\n![](img/470d59c61482018b86da50823ee18a57_80_0.png)"
  merge: -1
