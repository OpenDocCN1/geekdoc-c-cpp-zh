- img_proc: true
  md: '# # Summary


    +   - C is a very good language to learn for any IoT project. It is fast and efficient
    and close to the machine. There are lots of other languages that are derived from
    it, so it is worth learning.


    +   - You can write programs in C using just an editor and the command line compilers,
    but VS Code provides an easy-to-use and productive environment and is used throughout
    this book.


    +   - A development environment for the Pico requires a lot of different items
    of software to be installed. You can do this manually, but it is much easier to
    use the installation scripts provided by the Raspberry Foundation.


    +   - The best way to develop for the Pico is to use a Pi 4 to host the development
    software. The advantage is that it provides GPIO lines which can be connected
    to the Pico to facilitate debugging.


    +   - You can use a Windows or general Linux system, but in this case you either
    need an SWD programmer or an additional Pico to act as one.


    +   - There are installation scripts for a general Linux/Pi 4 system and for a
    Windows system and they are the recommended way to install the software.


    +   - Initially you install software by manually copying UF4 using the Pico as
    a USB drive, but this very quickly becomes unworkable and you need to move to
    using an SWD programmer to download and debug programs.


    +   - Using a Pi 4 as the development system you can implement an SWD programmer
    just by connecting some GPIO lines to the Pico.


    +   - Using a Windows or general Linux system, which lack GPIO lines, you need
    to use a second Pico as an SWD programmer. A program, PicoProbe, is provided which
    converts a Pico into an SWD programmer.


    +   - VS Code can easily be configured to use an SWD programmer to automatically
    download code to the Pico and provide debugging facilities.'
