  md: 'The only manual configuration you need to perform is set CMake as the build
    tool to use. If you don''t do this then VS Code makes use of Ninja and your build
    will fail. To do this open the File,Settings dialog and search for cmake generator
    and enter CMake Makefiles in the field:


    ```

