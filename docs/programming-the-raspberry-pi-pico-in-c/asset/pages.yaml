- img_proc: true
  md: '# Summary


    +   - The PIO and the state machine are special processors designed to interact
    with the outside world.


    +   - You can use a PIO attempt to implement any otherwise unsupported protocol.


    +   - The Pico has two PIOs each with four state machines.


    +   - The GPIO lines associated with the PIO are determined by a set of groups
    – OUT, SET, IN and SETSIDE. GPIO lines also have to be set to PIO mode before
    they will work in any of the groups.


    +   - You can set the clock frequency that the PIO uses to execute instructions
    one per clock cycle.


    +   - The clock should be set to a frequency that is suitable for the sort of
    pulses the PIO is working with.


    +   - It is easy to toggle a GPIO line but slightly harder to make it slow enough
    to flash an LED. To do this you need to implement a busy wait loop.


    +   - The OSR and ISR are used to send data and receive data from the GPIO lines.


    +   - There are two FIFO stacks which can be used to send data to the OSR and
    ISR from the processor.


    +   - Every instruction can change the state of GPIO lines in the SETSIDE group
    as a side effect of its execution.


    +   - Working with edges isn’t natural for the state machine but it can be achieved
    using wait instructions.'
  merge: -1
