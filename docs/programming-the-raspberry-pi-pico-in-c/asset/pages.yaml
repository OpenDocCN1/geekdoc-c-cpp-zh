    # # Advanced PIO


    This first look at the PIO and its use has covered the main points to make it
    possible for you to write PIO programs and use them from C. It isn''t complete
    and there are many additional features that you still have to discover. Most of
    these features are about optimization. For example, nearly all PIO programs take
    the form of an infinite loop and is a waste of the scarce 32 instruction locations
    and introduces a clock cycle delay. As an alternative you can place:


    +   .wrap_target

    before the instruction that you want to start the program at:

    .wrap

    after the last instruction. For example, our previous program can be

    .program_squarewave

    .wrap_target

    wait 0 pin 0

    wait 1 pin 0

    set pins, 1

    set pins, 0

    wrap


    In this case there is no jmp instruction as the program counter is automatically
    set back to the target when it reaches the wrap. It is as if the program''s address
    space was circular.


    Other topics not discussed are the use of DMA, interrupts, and the interaction
    between multiple PIOs. This is all very straightforward and logical once you have
    mastered the basics.


    Now we move on to discover how the PIO can do useful work for us.'
