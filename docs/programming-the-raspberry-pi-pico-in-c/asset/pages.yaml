- img_proc: true
  md: '# Chapter 18


    # Direct To The Hardware


    The SDK provides functions to let you access most of the hardware features of
    the Pico. They are very simple wrappers around the basic mechanism of working
    with the hardware – memory mapped registers. You might think that bypassing the
    SDK and doing the job directly via hardware access would be attractive because
    it is more efficient – it isn''t. The SDK is such a light fractions of a microsecond
    over the hardware there is very little in trying to gain the few fractions direct
    access provides. The obvious reason for knowing how to use memory-mapped registers
    is if the SDK doesn''t provide a function that does what you want – perhaps a
    better reason is to know how things work!


    In this chapter we take a look at how the Pico presents its hardware for you and
    how to access it via basic software.


    # Registers


    Some processors have special ways of connecting devices, but the Pico''s processor
    uses the more common memory-mapping approach. In this, each external device is
    represented by a set of memory locations or “registers” that control it. Each
    bit in the register controls some aspect of the device behaves. Groups of bits
    also can be interpreted as short integers which set operating values or modes.


    How do you access a register? Simply by storing the values in it or assigning
    its value to a variable. This is nothing new in C. The big difference is that
    you now have to refer not to a memory location provided by the system, but to
    a fixed address provided by the documentation. You still use a pointer, but one
    that is initialized by a constant or literal. For example, if you look in the
    documentation you find `0x40014000`. The registers are defined by their offset
    from this starting address.'
  merge: -1
  pgno: 350
- img_proc: true
  md: 'So for example the table of GPIO registers starts:


    | Offset | Register Name | Description |

    |---|---|--|

    | 0x000 | GPIO0_STATUS | GPIO status |

    | 0x004 | GPIO0_CTRL | GPIO control including function select and overrides |

    | 0x008 | GPIO1_STATUS | GPIO status |

    | 0x00c | GPIO1_CTRL | GPIO control including function select and overrides |

    | ... and so on down to \0ec | GPIO29_CTRL | GPIO control including function select
    and overrides |


    You can see that there are two registers for each GPIO line from GP0 to GP29,
    one control register and one status register.

    Each register has the same format for each GPIO line. For the example status register
    is:


    | Bits | Name | Description | Type | Reset |

    |---|---|---|---|--|

    | 31:27 | Reserved | | - |

    | 26 | IRQTOPROC | Interrupt to processors, after override applied | RO | \0x0
    |

    | 25 | Reserved | | - |

    | 24 | IRQFROMPAD | Interrupt from pad, before override applied | RO | \0x0 |

    | 23:20 | Reserved | | - |

    | 19 | INTOPERI | Input signal to peripheral, after override applied | RO | \0x0
    |

    | 18 | Reserved | | - |

    | 17 | INFROMPAD | Input signal from pad, before override applied | RO | \0x0
    |

    | 16:14 | Reserved | | - |

    | 13 | OETOPAD | Output enable to pad, after override applied | RO | \0x0 |

    | 12 | OEFROMPERI | Output enable from selected peripheral, before override applied
    | RO | \0x0 |

    | 11:10 | Reserved | | - |

    | 9 | OUTTOPAD | Output signal to pad after override applied | RO | \0x0 |

    | 8 | OUTFROMPERI | Output signal from selected peripheral, before override applied
    | RO | \0x0 |

    | 7:0 | Reserved | | - |'
  merge: -1
  pgno: 351
- img_proc: true
  md: "You can see that many of the 32 bits in the register are not used, but bit\
    \ 9 is\nOUTOPAD which is the final state of the GPIO line after register overrides\n\
    have been applied. You can read its current value using:\n#include <stdio.h>\n\
    #include \"pico/stdlib.h\"\n\n```\nint main() {\n    stdio init_all();\n    uint32_t\
    \ t *addGPIO0Status=(uint32_t*) 0x40014000;\n    uint32_t value=*addGPIO0Status;\n\
    \    printf(\"bb\",value);\n}\n```\n\nThis prints the current status of GPIO in\
    \ binary. If you want to find the status of\nGPn you need to use address 0x40014000+2n.\n\
    This is the general way you work with peripheral devices such as the PWM\nor I2C\
    \ hardware, but the GPIO is special in that it has another set of\nregisters that\
    \ control it.\n\n# Single-Cycle IO Block\n\nAt this point you might think we are\
    \ ready to access the state of the GPIO\nlines for general input and output. This\
    \ isn't quite the whole story. To\naccommodate the fact that the processor has\
    \ two cores, and to make access\nfaster to important devices, there is a special\
    \ connection, the SIO or Single-\ncycle IO Block, between the cores and, among\
    \ other things, the GPIO. The\nSI connects directly to the two cores and they\
    \ can perform single-cycle 32-\nbit reads and writes to any register in the SIO.\
    \ Notice the SIO is not\nconnected via the general address bus.\n\nYou can see\
    \ the general structure of the SIO in the diagram below. You can\nfind out about\
    \ the devices it connects to through documentation - our\nfocus is on the GPIO\
    \ lines.\n\n![](img/470d59c61482018b86da50823ee18a57_352_0.png)"
  merge: -1
  pgno: 352
- img_proc: true
  md: 'Notice that the GPIO lines are multipurpose and to use a GPIO line via the
    SIO register or via direct access to its control register or using the SDK function:

    gpio_set_function(pin,GPIO_FUNC_SIO);


    In this sense the SIO is just another peripheral that can take control of a GPIO
    line. The SDK gpio_init function automatically sets the GPIO line to use the SIO,
    so you are using the SIO even if you don''t realize it.


    The SIO provides a set of registers that makes using the GPIO much faster and
    much easier. The basic registers are:


    +   - GPIO_OUT Sets all GPIO lines to high or low

    - GPIO_IN Reads all GPIO lines

    - GPIO_OE Sets any GPIO line to output driver or high impedance


    There are three registers – SET, CLR and XOR - that make working with GPIO_OUT
    and GPIO_OE easier. Each of these can be thought of as a mask that sets, clears
    or XORs bits in the corresponding register.


    For example, GPIO_OUT_SET is used to set just those bits in GPIO_OUT that correspond
    to the positions that are high.


    The locations of these registers are as offsets from 0xd0000000 (defined as SIO_BASE
    in the SDK):


    | Offset | Name | Description |

    |---|---|--|

    | 0x004 | GPIO_IN | GPIO Input value |

    | 0x010 | GPIO_OUT | GPIO output value |

    | 0x014 | GPIO_OUT_SET | GPIO output value set |

    | 0x018 | GPIO_OUT_CLR | GPIO output value clear |

    | 0x01c | GPIO_OUT_XOR | GPIO output value XOR |

    | 0x020 | GPIO_OE | GPIO output enable |

    | 0x024 | GPIO_OE_SET | GPIO output enable set |

    | 0x028 | GPIO_OE_CLR | GPIO output enable clear |

    | 0x02c | GPIO_OE_XOR | GPIO output enable XOR |'
  merge: -1
  pgno: 353
- img_proc: true
  md: "Now we can re-write Blinky again, but this time using direct access to SIO\
    \ GPIO registers.\n\n```\n#include \"pico/stdlib.h\"\n#include \"hardware/gpio.h\"\
    \n\nint main() {\n    gpio_init(25);\n    gpio_set_dir(25, GPIO_OUT);\n\n    uint32_t\
    \ *SIO = (uint32_t *)0xd0000000;\n    while (true) {\n        *(SIO + 0x014 /\
    \ 4) = 1ul << 25;\n        sleep_ms(500);\n        *(SIO + 0x018 / 4) = 1ul <<\
    \ 25;\n        sleep_ms(500);\n    }\n}\n```\n\nThis program uses the SDK to get\
    \ the GPIO line to SIO control and output. If you think that this is cheating,\
    \ it is an exercise to set the line correctly using the GPIO control register\
    \ and the SIO. The only possible confusion is the use of the offset by 4. The\
    \ reason for this is that the pointer to the start of the registers is declared\
    \ as uint32_t and, and by the rules of pointer arithmetic, adding one to it adds\
    \ the size of a uint32_t, i.e. 4. To keep the address as a byte address we have\
    \ divide the offset by 4 and rely on the pointer arithmetic to multiply it by\
    \ 4 before use.\n\n# The SDK Set Function\n\nThe single instruction in our previous\
    \ program:\n*(SIO + 0x018 / 4) = 1ul << 25;\n\nis equivalent to the SDK's gpio_set\
    \ function. Now that we know how things work, it is worth looking at how the SDK\
    \ does the job:\n\n```\nstatic inline void gpio_put(uint32_t gpio, uint32_t mask)\
    \ {\n    uint value = 1ul << gpio;\n    if (value)\n        gpio_set_mask(mask);\n\
    \    else\n        gpio_clr_mask(mask);\n}\n```\n\nThis doesn't really tell us\
    \ how about things work because the put function simply passes the job onto the\
    \ set or clr function. You can at least"
  merge: -1
  pgno: 354
- img_proc: true
  md: "see that the function creates a bit mask in the same way our function did.\n\
    Let's look at set and see how it completes the job:\n\n```\nstatic inline void\
    \ gpio_set_mask(uint32_t mask) {\n  sio_hw->gpio_set = mask;\n}\n```\n\nThe key\
    \ to understanding is that sio_hw is a struct that has fields for each of the\
    \ SIO registers and its starting address is set to the start of the SIO. This\
    \ is a fairly standard way of getting easy access to registers as offsets from\
    \ a base address without having to do pointer arithmetic or defining lots of constants.\
    \ If you take a look at the start of the sio_hw definition, it should make sense:\n\
    \n```\ntypedef struct {\n  io_32 cpuid;\n  io_32 gpio_in;\n  io_32 gpio_hi;\n\
    \  uint32_t _pad;\n\n  io_32 gpio_out;\n  io_32 gpio_set;\n  io_32 gpio_clr;\n\
    \  io_32 gpio_togl;\n\n  rest of the registers;\n}\nsio_hw_t;\n```\n\nTo set this\
    \ struct so that its fields correspond to the registers we specified simply set\
    \ its starting location to the address of SIO_BASE:\n\n```\n#define sio_hw ((sio_hw_t*)SIO_BASE)\n\
    ```\n\nFollowing this, when you set and retrieve values from the struct's fields\
    \ you are working with the registers.\n\n# Example I - Events\n\nThe SDK does\
    \ a fairly good job of covering all of the possible ways you might want to access\
    \ the hardware but there are some omissions. In Chapter 7 the idea of events was\
    \ introduced, but the SDK doesn't provide any access to events. The solution is\
    \ to add our own function that accesses the GPIO register that records interrupts.\
    \ This is a register in the GPIO set of registers rather than the SIO as GPIO\
    \ interrupts aren't specific to what is controlling the GPIO line."
  merge: -1
  pgno: 355
- img_proc: true
  md: "Now that we know about using structs to gain access to registers it makes sense\
    \ to use the struct that the SDK defines to access the GPIO registers:\n\n```\n\
    typedef struct {\n    io rw_32 status;\n    io rw_32 ctrl;\n} io[30];\nio rw_32\
    \ intr[4];\nio_irq_ctrl_hw_t proc0_irq_ctrl;\nio_irq_ctrl_hw_t proc1_irq_ctrl;\n\
    io_irq_ctrl_hw_t dormant_wake_irq_ctrl;\n} iobank_hw_t;\n```\n\nThe struct is\
    \ set to start at the base of the GPIO registers and you can see that it starts\
    \ off with the status and control registers for each GPIO line and then the raw\
    \ interrupt registers. The format of the raw interrupt registers is more complicated\
    \ than the previous one bit one GPIO line arrangement we have encountered before.\
    \ In this case there are four bits per GPIO line and we record interrupt types.\
    \ The first four bits of the first register record interrupts over GPIO:\n\n|\
    \ | | | |\n|---|---|---||\n| 3 | GPIO_EDGE_HIGH | WC | 0x0 |\n| 2 | GPIO_EDGE_LOW\
    \ | WC | 0x0 |\n| 1 | GPIO_LEVEL_HIGH | RO | 0x0 |\n| 0 | GPIO_LEVEL_LOW | RO\
    \ | 0x0 |\n\nThis pattern is repeated for each of the GPIO lines, and when all\
    \ of the bits in the first register have been used, the pattern continues in the\
    \ second register with GPIO8 and so. Each register records the event data for\
    \ each GPIO lines. Notice that each of the bits is set if the event that would\
    \ cause the interrupt occurs the interrupt only if it is enabled. What this means\
    \ is the level bits track the current level of the GPIO line and the edge bits\
    \ are set if an edge of that type has occurred. The WC in the third column indicates\
    \ that the bit is cleared if you write to it and this is how the event is cleared.\n\
    \nWe now know how to check for an event. All we have to do is read the value of\
    \ the four bits corresponding to the GPIO line. If we are interested in GPIO line\
    \ then it is easy to see that the register has its information gpio/8. A mask\
    \ for the correct four bits within the register is more difficult to devise, but\
    \ you have to shift 0xFF, i.e. 1111, left by 4*(gpio%8). To see that this works\
    \ it out with a few values."
  merge: -1
  pgno: 356
- img_proc: true
  md: "Using this we can now get the four bits:\niobank_hw->intr[gpio/8] & mask\n\n\
    However, this gives the bits in their original position. To get a\nright-aligned\
    \ four bits we need to shift them down by 4*(gpio8). Putting all\nthis together\
    \ gives the function introduced in Chapter 7:\n\n```\nuint32_t gpio_get_events(uint\
    \ gpio)\n{\n  int32_t mask = 0xF << 4 * (gpio8);\n  return (iobank_hw->intr[gpio\
    \ / 8] & mask) >> 4 * (gpio8);\n}\n```\n\nTo clear the reset interrupt you simply\
    \ have to write a zero to it and there is\nalready an SDK function that will do\
    \ this.\n\n# Example II PAD - Pull, Drive and Schmitt\n\nEach GPIO line has an\
    \ identical input output stage, called a PAD, which is the\nconnection to the\
    \ outside world, no matter what mode the GPIO line is being\nused in. This is\
    \ fundamental to the workings of the GPIO line and you might\nbendering why it\
    \ is being introduced so late? The answer is that the SDK\ndoes't fully support\
    \ it and the aspects of the PAD that it does support, Pull\nUp and Pull Down,\
    \ are simple enough. If you are interested in the finer\ndetails then you are\
    \ going to have to implement functions that work with\nthem.\n\nThe structure\
    \ of the PAD can be seen below:\n\n![](img/470d59c61482018b86da50823ee18a57_357_0.png)"
  merge: -1
  pgno: 357
- img_proc: true
  md: 'You can see that under program control you can set the Pull Up/Pull Down configuration
    and enable the input/output. The input also has a Schmitt trigger that can be
    enabled to clean up noisy inputs. The output can be customized by slew rate, how
    fast it changes and drive strength.


    Before moving on to the software, it is worth explaining the basic ideas of the
    options.


    The Schmitt trigger adds hysteresis to the input line. This means that before
    the state changes from high to low it has to cross a threshold, but to change
    back to a low state it has to cross a lower threshold. This acts like a limited
    debounce mechanism in that stops the line from going low because the input drops
    after going high. The Pico''s Schmitt trigger uses thresholds of 0.2V difference
    if the processor supply voltage is 2.5V to 3.3V and 0.18V if the voltage is 1.8V.
    What this means is at 3.3V the input has to be greater than 2V to be one, but
    after this the voltage has to fall to 1.8V before it changes back to a zero. For
    a zero the thresholds are 0.8V to change a zero and 2V to change back to a one.


    The output drive strength isn''t to do how much current the GPIO line source,
    it is about the voltage output at different currents. The effective output resistance.
    Each time the drive current is increased by 2mA another transistor is used in
    the drive, so lowering the output resistance. This has the effect of increasing
    or decreasing the voltage at the pin. For example, if you set the drive to 1 then
    you want to keep the output voltage at or above 2.62V, i.e. a logic 1, then you
    can''t draw more than 2mA. Put more, if you want the output to maintain voltages
    that are within the threshold for a logic 1 or 0 you can only draw 2, 4, 8 or
    12mA from the GPIO line depending on the drive strength. If you draw more current
    then this is fine, but the voltage will fall below the standards for 3.3V logic.


    The final option is to change the slew rate. There is no information on this in
    the data sheet, but slowing the rate of change of the GPIO line can be useful
    when driving lines or reactive loads. How useful this is in practice is a matter
    of work with experimentation.


    If you want to work with the PAD directly then you need to know the location and
    format of the PAD control registers. These start at 0x4001c000 (defined as PADS_BANK0
    BASE in the SDK) and the first, controlling the GP0 PAD is at offset 0x04 and
    in general the register for GPn PAD is at offset 4(n+1).'
  merge: -1
  pgno: 358
- img_proc: true
  md: "The format of the PAD register is:\n\n| Bits | Name | Description | Type |\
    \ Reset |\n|---|---|---|---|--|\n| 31:8 | Reserved. | - | | - |\n| 7 | OD | Output\
    \ disable. Has priority over output enable from peripherals | RW | 0x0 |\n| 6\
    \ | IE | Input enable | RW | 0x1 |\n| 5:4 | DRIVE | Drive strength.\n0x0 → 2mA\n\
    0x1 → 4mA\n0x2 → 8mA\n0x3 → 12mA | | |\n| | RW | 0x1 | | |\n| 3 | PUE | Pull up\
    \ enable | RW | 0x0 |\n| 2 | PDE | Pull down enable | RW | 0x1 |\n| 1 | SCHMITT\
    \ | Enable Schmitt trigger | RW | 0x1 |\n| 0 | SLEWFAST | Slew rate control. 1\
    \ = Fast, 0 = Slow | RW | 0x0 |\n\nUsing this information it is fairly easy to\
    \ write functions to set each of the characteristics of the PAD. For example,\
    \ to read the slew rate:\n\n```\nuint32_t pad_get_slew(uint_t gpio) {\n    return\
    \ padsbank0_hw->io[gpio] &0x01;\n}\n```\n\nwhere we are using the SDK-defined\
    \ padsbank0_hw which is defined in:\n#include \"hardware/structs/padsbank0.h\"\
    \n\nTo set the bit we need to use a mask that only changes the bit in question.\
    \ This sort of operation is so commonly required that the SDK provides some functions\
    \ to the job:\n\n```\nhw_set_bits(io_rw_32 *addr, uint32_t mask)\nhw_clear_bits(io_rw_32\
    \ *addr, uint32_t mask)\nhw_xor_bits(io_rw_32 *addr, uint32_t mask)\nhw_write_masked(io_rw_32\
    \ *addr, uint32_t values, uint32_t write_mask)\n```\n\nThese are not only convenient\
    \ to use, they are also atomic in the sense that if both cores attempt to modify\
    \ the same register the two operations will not interfere with one another – one\
    \ will complete before the other begins."
  merge: -1
  pgno: 359
- img_proc: true
  md: "Using the set_bits function, we can easily set the skew rate:\nvoid pad_set_slew(uint\
    \ gpio, bool value)\n\n```\n{\n    if (value)\n        hw_set_bits(&padsbank0_hw->io[gpio],\
    \ 1ul);\n    else\n        hw_set_bits(&padsbank0_hw->io[gpio], 1ul);\n}\n```\n\
    \nGetting and setting the Schmitt trigger is as easy as:\nvoid pad_set_schmitt(uint\
    \ gpio, bool value)\n\n```\n{\n    uint32_t mask = 1ul << 1;\n    if (value)\n\
    \        hw_set_bits(&padsbank0_hw->io[gpio], mask);\n    else\n        hw_set_bits(&padsbank0_hw->io[gpio],\
    \ mask);\n}\n```\n\nSetting the drive is slightly more complicated as it is a\
    \ three-bit value:\nuint32_t pad_get_drive(uint gpio)\n\n```\n{\n    return (padsbank0_hw->io[gpio]\
    \ & 0xE0) >> 5;\n}\n```\n\nvoid pad_set_drive(uint gpio, uint8_t value)\n\n```\n\
    {\n    uint32_t mask = 0xE0ul;\n    hw_write_masked(&padsbank0_hw->io[gpio],value<<5,mask);\n\
    }\n```\n\nOf course, we don't need to deal with the pull-ups or pull-downs as\
    \ there are SDK functions that do the job.\n\n# Digging Deeper\n\nThere is so\
    \ much to explore, but now we have covered the details that make things difficult\
    \ to get started. From here you can find out how they work and you should be able\
    \ to modify them and add to them. If you find that you need to create a program\
    \ that doesn't include the SDK you can also use this knowledge to create slimmed-down\
    \ versions of the code that does exactly what you want. Knowledge is never superfluous."
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Summary


    +   - All of the peripherals, including the GPIO lines, are controlled by registers
    – special memory locations that you write and read to configure and use the hardware.


    +   - Exactly where the registers are positioned in address space is given in
    the documentation as a base address used for all of the similar registers and
    an offset that has to be added to the base to get the address of a particular
    register.


    +   - The SIO block provides a more convenient way to access the GPIO lines and
    it has a different set of addresses and registers to the GPIO lines.


    +   - You can learn a lot about how things work by reading the code for the relevant
    SDK functions.


    +   - With knowledge of how things work you can add functions that are missing
    from the SDK such as events and PAD control.


    +   - Each GPIO line connects to the outside world via a PAD which has a number
    of configurable elements such as pull-up, Slew rate and so on.'
  merge: -1
  pgno: 361
