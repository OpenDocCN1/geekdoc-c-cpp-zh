  md: 'Although your program is downloaded and running you won''t see much happening
    because by default it is paused at the first instruction. You will see the debug
    toolbar appear and this is what you need to use to debug your program:


    ```

    blinky.c

    blinky.c > main()

    1 #include "pico/stdlib.h"

    2

    3 int main() {

    4 const uint LED_PIN = 25;

    5 gpio_init(LED_PIN);

    6 gpio_set_dir(LED_PIN, GPIO_OUT

    ```


    To get the program running simply click the tiny icon. You can also use the red
    square icon to stop the program and the green arrow icon to restart it. You can
    set breakpoints in the code by clicking in the left-hand margin. After this program
    will automatically stop at the breakpoint and display the current status of variables
    in the left-hand debug pane. You can also single-step, step into called functions
    and step out of any called function. All of these also show you the current status
    of the variables. Notice that you have to stop the program using the stop icon
    before you rebuild and run it again.


    You have a workable system that allows you to edit, build and debug Pico programs.
    You will need to modify the CMakeLists.txt file to include specific parts of the
    library, but this is fairly standard.


    # Automatic Project Creation


    You can work by manually modifying and adding to the CMakeLists.txt file. However,
    there is an automatic project creation tool, written in Python, that will generate
    a complete project for you. You can copy the CMakeLists.txt to an existing project
    or the folder that has been created with VS Code.


    You can install it on the Pi 4 using:

    git clone https://github.com/raspberrypi/pico-project-generator.git


    If you used the installation script for Windows it is already installed and you
    will find the project generator in Pico\pico-project-generator where you can run
    it from the command line:

    pico-project.py --gui'
