  md: '# Chapter 10


    # Getting Started With The SPI Bus


    The Serial Peripheral Interface (SPI) bus can be something of a problem because
    it doesn''t have a well-defined standard that every device conforms to. Even so,
    if you only want to work with one specific device it is usually easy to find a
    configuration that works - as long as you understand what the possibilities are.


    # SPI Bus Basics


    The SPI bus is commonly encountered as it is used to connect all sorts of devices
    from LCD, through realtime clocks and A-to-D converters, but as different companies
    have implemented it in different ways, you have to work harder to implement it
    in any particular case. However, it usually work, which is a surprise for a bus
    with no standard, or clear, specification.


    The reason it can be made to work is that you can specify a range of different
    operating modes, frequencies and polarities. This makes the bus slightly more
    complicated to use, but generally it is a matter of looking up how the device
    you are trying to work with implements the SPI bus and then getting the Pico to
    work in the same way.


    The SPI is odd in another way - it does not use bidirectional connections. There
    is a data line for the master to the slave and a separate data line from the slave
    back to the master. That is, instead of a single data line that changes its transfer
    direction, there is one for data going out and one for data coming in. It is also
    worth knowing that the drive on the SPI is push-pull and not open-collector/drain.
    This provides higher speed and more noise protection as the drive is driven in
    both directions. There is a bidirectional mode, where a single wire is used for
    the data, and the Pico supports this.


    In the configuration most used for the Pico, there is a single master and, at
    most, two slaves. The signal lines are:


    +   * MOSI (Master Output Slave Input), i.e. data to the slave

    * MISO (Master Input Slave Output), i.e. data to the master

    * SCLK (Serial Clock), which is always generated by the master'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'In general, there can also be any number of SS (Slave Select), CE (Chip Enable)
    or CS (Chip Select) lines, which are usually set low to select which slave is
    addressed. Notice that unlike other buses, I2C for example, there are no SPI commands
    or addresses, only bytes of data. However, slave devices do interpret the data
    as commands to do something or send some particular data.


    ![](img/470d59c61482018b86da50823ee18a57_179_0.png)


    There are two other modes of operation of the SPI interface – bidirectional and
    LoSSI mode. The bidirectional mode simply uses a single data line, MIMO, for both
    input and output. The direction of the line is determined by writing a command
    to the slave. LoSSI mode is used to communicate with sophisticated peripherals
    such as LCD panels. Both of these are unsupported by the SDK and the scope of
    this chapter. However, once you know how standard mode works, the other two are
    simple variations.


    The data transfer on the SPI bus is slightly offset. What happens is the master
    pulls one of the chip selects low, which activates a slave. Then the master toggles
    the clock SCLK and both the master and the slave send a single bit on their respective
    data lines. After eight clock cycles, a byte has been transferred from the master
    to the slave and from the slave to the master. You can think of this as being
    implemented as a circular buffer, although it doesn''t have to be.


    ![](img/470d59c61482018b86da50823ee18a57_179_1.png)'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'This full-duplex data transfer is often hidden by the software and the protocol
    used. For example, there is a read function that reads data from the slave and
    sends zeros or data that is ignored by the slave. Similarly, there is a write
    function that sends data, but ignores whatever the slave sends. The transfer is
    typically in groups of eight bits, usually most significant first, but this isn''t
    always the case. In general, as long as the master supplies pulse, data is transferred.


    Notice this circular buffer arrangement allows slaves to be daisy-chained with
    the output of one going to the input of the next. This makes the entire one big
    shift register. This can make it possible to have multiple devices with a single
    chip select, but it also means any commands to the slaves are received by each
    one in turn. For example, you could send a convert command to each A-to-D converter
    in turn and receive back results from each one.


    The final odd thing about the SPI bus is that there are four modes which define
    the relationship between the data timing and the clock pulse. The clock can be
    either active high or low, which is referred to as polarity (CPOL), and data can
    be sampled on the rising or falling edge of the clock, which is clock phase (CPHA).


    All combinations of these two possibilities gives the following:


    | SPI Mode* | Clock Polarity CPOL | Clock Phase CPHA | Characteristics |

    |---|---|---||}{

    | 0 | 0 | 0 | Clock active high data output on falling edge and sampled on rising
    |

    | 1 | 0 | 1 | Clock active high data output on rising edge and sampled on falling
    |

    | 2 | 1 | 0 | Clock active low data output on falling edge and sampled on rising
    |

    | 3 | 1 | 1 | Clock active low data output on rising edge and sampled on falling
    |


    *The way that the SPI modes are labeled is common but not universal.


    There is often a problem trying to work out what a slave device uses. The clock
    polarity is usually easy and the Clock phase can sometimes be worked out from
    the data transfer timing diagrams and:


    +   - First clock transition in the middle of a data bit means CPHA=0

    - First clock transition at the start of a data bit means CPHA=1'
  merge: -1
