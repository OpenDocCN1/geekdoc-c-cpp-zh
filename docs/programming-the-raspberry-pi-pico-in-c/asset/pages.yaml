- img_proc: true
  md: '# Writing Loops


    One of the things you will most likely have to do is write the equivalent of a
    for or while loop in PIO assembler and it might not be obvious how to do this
    because it doesn''t have control structures like C. To write a loop you need to
    know each state machine has two scratch 32-bit storage registers called x and
    y. You can store values and use values in these registers from various sources
    using the in, out, or mov instructions. If you want to set a register, x say,
    to a constant value then you need to use:


    ```

    set x, 31

    ```


    where 31 is the maximum value you can set because the instruction is limited to
    a 5-bit immediate value.

    You can use the registers to implement a loop with up to 32 repeats. jmp instruction
    can test the value of a register for zero and auto-decrement it after the test.
    This means an n repeat for loop can be constructed as:


    ```

    set x, n

    loop: nop

    jump x--, loop

    ```


    Using this you can slow the rate at which the GPIO line is toggled by repeating
    the nop 32 times. However, even if you use:


    ```

    set x, n

    loop: nop [31]

    jump x--, loop

    ```


    the effective rate of toggling the GPIO line is still too great to see an LED
    flash. To slow down even more you need two nested loops.'
  merge: -1
  pgno: 242
- img_proc: true
  md: "The complete PIO program is:\n\n```\n.program squarewave\nset pindirs, 1\n\
    again:\n  set pins, 1\n  set x, 31\nloop1:\n  set y, 31\nloop2:\n  nop [31]\n\
    \  jmp y-,,loop2\n  jmp x-,,loop1\n  set pins, 0\n  set x, 31\nloop3:\n  set y,\
    \ 31\nloop4:\n  nop [31]\n  jmp y-,,loop4\n  jmp x-,,loop3\nagain\n```\n\nYou\
    \ can see the two nested loops - loop1/loop2 loop3/loop4. This is not a good design,\
    \ but it is a working Blinky program and there are many optimizations you can\
    \ apply to reduce the size of the program. If you try it will find it runs at\
    \ 7.2Hz and if you change the GPIO line to GP25 you will see the onboard LED flash.\n\
    \nThe need for a pair of nested loops to slow things down is due to the simple\
    \ fact that we can only set the x or y register to a maximum of 31 because the\
    \ PIO instructions only have space for a 5-bit literal field. There is another\
    \ way to set the x and y register using data transferred into the PIO program\
    \ from the C program and this brings us to the subject of data input.\n\n# Data\
    \ To The PIO\n\nJust like any of the I/O subsystems in the Pico, you can send\
    \ data to the PIO from your C program. There are more basic ways to do this job,\
    \ and the SDK provides easy-to-use functions. The Pico provides a 3-element, 32-bit\
    \ FIFO buffer, the TX FIFO, for input to the state machine and, usually, output\
    \ to the GPIO lines. You can write data to the TX FIFO using:\n\n```\npio_sm_put(PIO\
    \ pio, uint sm, uint32_t data)\npio_sm_put_blocking(PIO pio, uint sm, uint32_t\
    \ data)\n```"
  merge: -1
  pgno: 243
- img_proc: true
  md: "The difference is that the first function doesn't wait for free space in the\
    \ FIFO and without making any changes apart from setting the TXOVER flag if the\
    \ FIFO is full. The second blocks until there is space to store the data. You\
    \ can find out the current state of the FIFO:\n\n```\nstatic bool pio_sm_tx_fifo_full\
    \ (PIO pio, uint sm)\nstatic bool pio_sm_tx_fifo_empty (PIO pio, uint sm)\nstatic\
    \ uint pio_sm_get_tx_fifo_level (PIO pio, uint sm)\n```\n\nThe PIO program can\
    \ read data from the TX FIFO using the pull instruction which moves the first\
    \ item of data from the FIFO into the Output Shift Register OSR. Usually the OSR\
    \ is used to drive the OUT group of lines, more of this. However, the mov instruction\
    \ can be used to move the OSR to a range of destinations including the x and y\
    \ registers. This means we can use the TX FIFO buffer to set the x or y register\
    \ to a full 32-bit value.\n\nUsing this can create a Blinky program that just\
    \ uses one loop and can create time delays of 30 minutes. The PIO program is:\n\
    \n```\n.program squarewave\n    set pindirs, 1\n    pull\nagain:\n    set pins,\
    \ 1\n    mov x, osr\nloop1:\n    jmp x--,loop1\n    set pins, 0\n    mov x, osr\n\
    loop2:\n    jmp x--,loop2\n    jmp again\n```\n\nNotice how the OSR is used as\
    \ a way of storing the loop count that it can be used to reset the x register\
    \ each time. If you needed to use the OSR for something else this wouldn't be\
    \ possible and you would have to use the y register or some other method. Also\
    \ notice that the pull instruction causes the PIO program to wait until there\
    \ is some data in the TX FIFO to start things off."
