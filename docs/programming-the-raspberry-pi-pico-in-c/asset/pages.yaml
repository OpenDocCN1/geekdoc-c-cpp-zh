  md: '# Other Books by Harry Fairhead


    | Programming the Raspberry Pi Pico in Python | Programming The Raspberry Pi Pico
    with Python

    ISBN: 978-1871926297 |

    |---|---|

    | ![image]() | Harry Fairhead & Mike James I/O Press Programmer Library |


    The MicroPython version of this book explains the many reasons for wanting to
    use Python with the Pico, not least of which is the fact that it is simpler and
    easier to use. This makes it ideal for prototyping and education. It is slower
    than using C and programs use more memory, but sometimes it is a worthwhile trade
    off to get the sophistication of a higher-level language. What is surprising is
    how much you can do with Python I2C, SPI, PWM and PIO.


    # Raspberry Pi IoT in C, Second Edition

    ISBN: 978-1871926235


    | Raspberry Pi IoT in C Second Edition |

    |---|---|

    | ![image]() | Harry Fairhead I/O Press Programmer Library |


    In Raspberry Pi IoT in C you will find a practical approach to understanding electronic
    circuits and datasheets and translating this to code, specifically using the C
    programming language. The main reason for choosing C is speed, a crucial factor
    when you are writing programs to communicate with the outside world. If you are
    unfamiliar with another programming language, C shouldn''t be hard to pick up.
    This second edition has been brought up to date and focuses on the Pi 4 and the
    Pi Zero. There is new material on the recently introduced GPIO character driver
    and using the Pi''s 4 additional ports and scheduling.


    The main idea in this book is to not simply install a driver, but to work directly
    with the hardware using the Raspberry Pi''s GPIO (General Purpose Input Output)
    to connect with off-the-shelf sensors. It explains how to use its standard output
    with custom protocols, including an in-depth exposition of the 1-Wire bus. You
    will also discover how to put the Internet into the IoT sockets.


    Although NetBeans is used to develop programs, VS Code is now considered an alternative
    remote development environment and all the book''s code, which is available for
    download, has been tested with VS Code.'
  merge: -1
  pgno: 369
- img_proc: true
  md: '# Applying C For The IoT With Linux


    ISBN: 978-1871926211


    ![](img/470d59c61482018b86da50823ee18a57_370_0.png)


    If you are using C to write low-level code using small Single Board Computers
    (SBCs) that run Linux, or if you do any coding in C that interacts with the hardware,
    this book brings together low-level, hardware-oriented and often hardware-specific
    information.


    It starts by looking at how programs work with user-mode Linux. When working with
    hardware, arithmetic cannot be ignored, separate chapters are devoted to integer,
    fixed-point and floating-point arithmetic. It goes on to the pseudo file system,
    memory-mapped files and sockets as a generalpurpose way of communicating over
    networks and similar infrastructure. It continues by looking at multitasking,
    coding, using mutex and condition variables, and scheduling. Later chapters manage
    cores, and C11''s atomics, memory models and barriers it rounds out with a short
    loop how to mix assembler with C.


    # Fundamental C: Getting Closer To The Machine


    ISBN: 978-1871926204


    ![](img/470d59c61482018b86da50823ee18a57_370_1.png)


    At an introductory level, this book explores C from the point of view of the low-level
    programmer and keeps close to the hardware. It covers addresses, pointers, and
    how things are represented using binary and emphasizes the important idea that
    everything is a bit pattern and what it means change.


    For beginners, the book covers installing an IDE and GCC before writing a Hello
    World program and then presents the fundamental blocks of any program - variables,
    assignment and expressions, flow of control using conditionals and loops.


    When programming in C you need to think about how the data is represented, and
    this book emphasizes the idea of modifying how a bit is treated using type punning
    and unions tackles the topic of undefined behavior, which is ignored in many books
    on C. A particular feature of the book is how C is illustrated by the assembly
    language it generates. This helps you understand how C is the way it is. And the
    way it was always intended to be written - close to the metal.'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# Raspberry Pi IoT in Python With GPIO Zero

    ISBN:978-1871962666


    Python is an excellent language to learn about the IoT or physical computing.
    It might not be as fast as C, but it is much easier to use for complex data processing.
    The GPIO Zero library is the official way to use Python with the GPIO and other
    devices. This book looks how to use it to Raspberry Pi 4 and Raspberry Pi Zero
    to IoT devices and how it works that you can extend it to custom devices. Studying
    GPIO Zero is also a great way to improve your Python.


    ![](img/470d59c61482018b86da50823ee18a57_371_0.png)


    # Raspberry Pi IoT in C With Linux Drivers

    ISBN:978-1871962642


    There are Linux drivers for many off-the-shelf IoT devices and they provide a
    very easy-to-use, highlevel way of working. The big problem is that there is very
    little documentation to help you get started. This book explains the principles
    so that you can tackle new devices and provides examples of using external hardware
    via standard Linux drivers with the Raspberry Pi 4 and Raspberry Pi Zero in the
    C language, which provides optimal performance.


    ![](img/470d59c61482018b86da50823ee18a57_371_1.png)


    # Raspberry Pi IoT in Python With Linux Drivers

    ISBN:978-1871962659


    If you opt to use Linux drivers to connect to external devices then Python becomes
    a good choice, as speed of execution is no longer a big issue. This book explains
    how to use Python to connect and control external devices with the Raspberry Pi
    4 and Raspberry Pi Zero using the standard Linux drivers.


    ![](img/470d59c61482018b86da50823ee18a57_371_2.png)'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# micro:bit IoT In C, Second Edition

    ISBN: 978-1871962673


    The new V2 version of the micro:bit is fully covered in this fully updated second
    edition which now uses VS Code for offline development.

    It covers how to get started the easy way with two downloadable templates. Next
    it looks how to control the micro:bit''s I/O lines and explores using the GPIO.
    For speed we need to work directly with the raw hardware and also memory-mapping
    and pulse width modulation. Sensors are connected first the I2C bus, by implementing
    a custom protocol for a 1-Wire bus, and eventually adding eight channels of 12-bit
    ADC. The micro:bit lacks WiFi connectivity, but can become an Internet server
    via its serial port.

    The book concludes with a look at the micro:bit''s LED display and how it can
    be used in C for the classic game of Commando Jump, and a new chapter on the micro:bit''s
    ratio and the V2''s sound capabilities.


    ![](img/470d59c61482018b86da50823ee18a57_372_0.png)


    # Programmer''s Python: Everything is an Object: Something Completely Different
    by Mike James

    ISBN: 978-1871962581


    This book set out to explain the deeper logic in the approach that Python 3 takes
    to classes and objects. The subject is roughly speaking everything to do with
    the way Python implements objects. That is, in order of sophistication, metaclass;
    class; object; attribute; and all of the other functions such as, methods and
    the many "magic methods" that Python uses to make it all work. This is a fairly
    advanced book in the sense that you are expected to know basic Python. However,
    it tries to explain the ideas using the simplest examples


    ![](img/470d59c61482018b86da50823ee18a57_372_1.png)


    possible. As long as you can write a Python program, and you have an idea what
    object-oriented programming is about, it should all be understandable and, as
    important, usable.'
  merge: -1
  pgno: 372
