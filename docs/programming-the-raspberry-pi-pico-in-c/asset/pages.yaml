- img_proc: true
  md: 'How good a design this is depends on how much the doorbell has to interact
    with the rest of the program and how many doorbell pushes you are expecting. It
    takes time to respond to the doorbell push and then the ISR has to run to completion
    - what is going to happen if another doorbell push happens while the first one
    is still being processed? Some processors have provision for forming a queue of
    interrupts, but that doesn''t help with the fact that the process can only handle
    one interrupt at a time. Of course, the same is true of a polling loop, but if
    you can''t handle the throughput of events with a polling loop, you can''t handle
    it with an interrupt, because interrupts add the time to transfer to the ISR and
    back again.


    Finally, before you dismiss the idea of having a processor do nothing but ask
    repeatedly "is the doorbell pressed", consider what else it has to do. If it is
    "not much" then a polling loop might well be your simplest option. Also, if the
    processor has multiple cores, then the fastest way of dealing with any external
    event is to use one of the cores in a fast polling loop. This can be considered
    to be a software emulation of a hardware interrupt - not to be confused with a
    software interrupt or wrap, which is a hardware interrupt triggered by software.


    If you are going to use interrupts to service input then a good design is to use
    the interrupt handler to feed an event queue. This at lowers the chance that input
    will be missed.


    Despite their attraction, interrupts are usually a poor choice for anything other
    than low-frequency events that need to be dealt with:


    # Hardware Events


    The Pico SDK doesn''t support events, but the hardware does as part of its implementation
    of GPIO interrupts. Each GPIO line records four events:


    ```

    GPIO IRQ LEVEL LOW

    GPIO IRQ LEVEL HIGH

    GPIO IRQ EDGE FALL

    GPIO IRQ EDGE RISE

    ```


    The level events are not latched and simply reflect the current state of the GPIO
    line. The edge events are latched and stay set until you clear them. In practice,
    the edge events are far more useful.


    Each of these events can also be set to cause an interrupt and this is something
    we look at later in this chapter. For the moment, all we are concerned with using
    these events as "memories" that something something happened.'
