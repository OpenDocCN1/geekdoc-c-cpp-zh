- img_proc: true
  md: '# UART Hardware


    A simple serial interface has a transmit pin, TX, and a receive pin, RX. That
    is, a full serial interface uses two wires for two-way communications. Typically
    you connect the TX pin on one device to the RX pin on the other and vice versa.
    The only problem is that some manufacturers label the pins by what they are connected
    to not what they are and then you have to connect RX to RX and TX to TX. You generally
    need to check with a scope, logic probe or meter which pin is if you are in any
    doubt.


    In addition to the TX and RX pins, a full serial interface also has a lot of control
    lines. Most of these were designed to help with old fashioned teleprinters and
    are not used. For example, RTS - Request Send is a line that is used to ask permission
    to send data from the device at the other end of the connection, CTS - Clear To
    Send is a line that indicates that is okay to send data and so on. Usually these
    are set by the hardware automatically when the receive buffer is full or empty.


    You can use RTS and CTS as a hardware flow control. There is also a standard software
    flow control involving XON and XOFF characters to start and stop the transmission
    of data. For most connections between modern devices you can ignore these additional
    lines and just send and receive data. If you need to interface to something that
    implements a complex serial interface you are going to look up the details and
    hand-craft a program to interact with it.


    | TX | GP0 | GP12 | GP16 | GP28 |

    | RX | | GP13 | GP17 | GP29 |

    | CTS | GP2 | GP14 | GP18 | |

    | RTS | GP3 | GP15 | GP19 | |


    | UART1 |

    | TX | GP4 | GP8 | GP20 | GP24 |

    | RX | GP5 | GP9 | GP21 | GP25 |

    | CTS | GP6 | GP10 | GP22 | GP26 |

    | RTS | GP7 | GP11 | GP23 | GP27 |'
  merge: -1
