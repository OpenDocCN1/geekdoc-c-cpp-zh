  pgno: 52
- img_proc: true
  md: 'The reason for the difference from a Pi Zero or Pi 4 is probably due to the
    larger and more variable time it takes to perform the loop. The two instructions:


    ```

    gpio_put(22, 1);

    gpio_put(22, 0);

    ```


    occur one after the other in a fairly short and regular time, but the loop back
    to the start is more complex and takes more time. You can see that this is by
    case swapping the order of the instructions:


    ![](img/470d59c61482018b86da50823ee18a57_53_0.png)


    Now you can see that high part of the pulse train is longer and more variable
    due to the setting back to how having to wait for the loop to repeat. When you
    are using timings that are close to the fastest that a processor can manage you
    do to take account of how long different instructions take.


    # Including Pauses


    To generate pulses of a known duration we need to pause the program between state
    changes. We have already used sleep_ms to slow things down, but the SDK has a
    range of different functions for adding pauses to a program. These fall into two
    groups – the sleep functions and the busy_wait functions. The sleep functions
    work by putting the processor into a low power state until the time is when the
    processor is awakened and the program proceeds. The only problem with the sleep
    functions is that it takes time to wake up and the time they generate is only
    guaranteed to shorter than the specified time. The busy_wait functions keep the
    processor alive and consuming power and as a result they are generally more accurate.


    The two sets of functions are very similar:


    ```

    sleep us (uint64_t us)

    bus_wait_us (uint64_t delay_us)

    ```


    Both wait for the specified time in microseconds but the sleep_us saves power
    and the busy_wait doesn''t but is more accurate. There is also a 32-bit version
    of the busy_wait which is often more convenient:


    ```

    busy_wait_us_32 (uint32_t delay_us)

    ```'
  merge: -1
  pgno: 53
- img_proc: true
  md: "Any differences between the two approaches only make a practical difference\
    \ at very short time delays.\n\nIf you want a pause as long as a millisecond then\
    \ you should use: sleep_ms(uint32_t ms)\n\nThere is no busy_wait equivalent because\
    \ if you want to pause for milliseconds you might as save power as the pause is\
    \ going to be accurate to microseconds.\n\nThere are also two functions that let\
    \ you set a pause until the system time reaches a given value:\n\n```\nsleep until(absolute_time_t\
    \ target)\nbus_wait until(absolute_time_t t)\n```\n\nTo compare the two approaches\
    \ you can try the following program:\n#include <pico/stdlib.h>\n\n```\nint main()\
    \ {\n    gpio_set_function(22, GPIO_FUNC_SI);\n    gpio_set_dir(22, true);\n \
    \   while (true) {\n        sleep_us(1);\n        gpio_put(22, 0);\n        sleep_us(1);\n\
    \        gpio_put(22, 1);\n    }\n}\n```\n\nThis attempts to create 1µs pulses,\
    \ but due to the additional wake-up time you get pulses approximately 1.3µs:\n\
    \n![](img/470d59c61482018b86da50823ee18a57_54_0.png)\n\nIf you replace the instances\
    \ of sleep_us(1) by busy_wait_us(1) then you get pulses that are very close to\
    \ 1µs:\n\n![](img/470d59c61482018b86da50823ee18a57_54_1.png)\n\nOnce the time\
    \ delay reaches 10µs the difference is negligible."
  merge: -1
  pgno: 54
- img_proc: true
  md: "The traditional way of introducing a busy wait is to simply use a time-wasting\
    \ loop. Given that busy_wait_us is accurate at 1µs there is little reason to use\
    \ it for time periods of 1µs or more. For a loop busy_wait can produce shorter\
    \ wait times:\n\n```\n#include \"stdlib.h\"\nint main()\n{\n    gpio_set_function(22,\
    \ GPIO_FUNC_SIO);\n    gpio_set_dir(22, true);\n    volatile int i;\n    int n\
    \ = 1;\n    while (true) {\n        for (i = 0; i < n; i++) {\n            gpio_put(22,\
    \ 0);\n            for (i = 0; i < n; i++) {\n                gpio_put(22, 1);\n\
    \            }\n        }\n}\n```\n\nwhich generates pulses according to the setting\
    \ of n:\n\n| n | Time in µs |\n|---|---|\n| 1 | 100-150ns |\n| 2 | 200-250ns |\n\
    | 3 | 300-350ns |\n| 4 | 350-400ns |\n| 5 | 450-500ns |\n| 6 | 500-550ns |\n|\
    \ 7 | 600-650ns |\n| 8 | 700-750ns |\n| 9 | 750-800ns |\n| 10 | 850-900ns |\n\
    | 11 | 900-950ns |"
