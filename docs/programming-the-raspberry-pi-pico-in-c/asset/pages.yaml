  md: 'If you run the program and don''t get any data received back then the most
    likely reason is that you have connected the wrong pins or not connected them
    at all.


    If you connect a logic analyzer to the three pins involved – 4, 6 and 7, you will
    see the data transfer:


    ![](img/470d59c61482018b86da50823ee18a57_187_0.png)


    # Using The CS Line


    Of course there is no CS line activity on the logic analyzer because, unlike many
    SPI implementations, the Pico doesn''t automatically control the CS line. It is
    up to you to initialize a CS line as a standard GPIO line and set it as appropriate
    during the data transfer.


    For example, let''s add GP5:


    +   - SPI0 MSIO GP4 pin 6

    - CSn GP5 pin 7

    - SCLK GP6 pin 9

    - MOSI GP7 pin 10


    Notice that there is no real reason to use GP5, any of the possible CS pins would.


    Using CS active we first have to initialize the GPIO line to output and set it
    high:


    ```

    gpio_init(5);

    gpio_set_dir(5, GPIO_OUT);

    gpio_put(5, 1);

    ```'
  merge: -1
  pgno: 187
- img_proc: true
  md: "Now we can use the CS line to activate the slave by setting it low before starting\
    \ the transfer and then setting it back high afterwards:\n\n```\ngpio_put(5, 0);\n\
    int n = spi_write16_read16_blocking(spi0, wBuff, rBuff, 5);\ngpio_put(5, 1);\n\
    ```\n\nIf you try this out might notice there is a problem if what is happening\
    \ very carefully. The setting of the CS line occurs about 0.7µs just before the\
    \ final clock pulse. This means that the CS line goes high just before the transfer\
    \ is complete.\n\n![](img/470d59c61482018b86da50823ee18a57_188_0.png)\n\nFor many\
    \ devices this doesn't make any difference, but it is safer to include a delay\
    \ to make sure that the CS lines go high again after the end of the final clock\
    \ pulse. To do this accurately need to compute the time remaining to the end of\
    \ the pulse and this depends on the clock frequency. You can set a delay using:\n\
    \n```\nint clock = 100 * 1000;\nspi_init(spi0, clock);\n```\n\n```\n...\n csDelay\
    \ = 1000000 / 2/clock;\ngpio_put(5, 0);\nint n = spi_write16_read16_blocking(spi0,\
    \ wBuff, rBuff, 5);\nsleep_us(csDelay);\ngpio_put(5, 1);\n```"
