- img_proc: true
  md: "You can see two ones followed by two zeros in the following logic trace:\n\n\
    | | 1ms | +100us | +200us | +300us |\n|---|---|---|---|---|n| Measurements | |\
    \ | | 61.15us |\n| Width | | | | 70.05us |\n| Period | | | | 14.7952106% |\n|\
    \ DutyCycle | | | | 14.2751759kHz |\n\n# # A First Command - Writing Bytes\n\n\
    After discovering that there is at least one device connected to the bus, the\
    \ master has to issue a ROM command. In many cases the ROM command used will be\
    \ the Search ROM command, which enumerates the 64-bit codes of all of the devices\
    \ on the bus. After collecting all of these codes, the master can use Match ROM\
    \ commands with a specific 64-bit code to select the device the master wants to\
    \ talk to.\n\nWhile it is perfectly possible to implement the Search ROM procedure,\
    \ it is simpler to work with the single device using commands which ignore the\
    \ 64-bit code and address all of the devices on the bus at the same time. Of course,\
    \ this only works as long as there is only one device on the bus. If there is\
    \ only one device then we can use the Skip ROM command 0xCC to tell all the devices\
    \ on the bus to be active.\n\nWe now need a function that can send a byte. As\
    \ we have a writeBit function for this is:\n\n```\nvoid sendskip(uint8_t pin)\
    \ {\n  writeBit(pin 0);\n  writeBit(pin 0);\n  writeBit(pin 1);\n  writeBit(pin\
    \ 1);\n  writeBit(pin 0);\n  writeBit(pin 0);\n  writeBit(pin 1);\n  writeBit(pin\
    \ 1);\n}\n```\n\nNotice that 0xCC is 1100 in binary and the 1-Wire bus sends the\
    \ least significant bit first. If you try this out it works, the device doesn't\
    \ respond because it is waiting for another command. Again, the time between writing\
    \ bits isn't critical, we can take this first implementation of the function and\
    \ write something more general, slightly slower."
