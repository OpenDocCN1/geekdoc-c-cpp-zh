  md: '# Pico On Windows


    There is no question that it is easier to work with a Raspberry Pi or other Linux
    system as the development machine. As already mentioned, the reason it is harder
    on Windows is that the software is not native Windows software. There is also
    the issue that you have to find a way to make a debug connection to the machine
    and this is much easier with access to GPIO as the Pi 4 or P400.


    There is an installation script for Windows, but it isn''t an official installer.
    You can find it at:


    https://github.com/ndabas/pico-setup-windows


    and it is easy to use and works it.

    At the time of writing it automatically installs and configures the following:


    +   1. Creates a pico directory in the user''s home directory

    2. GNU Arm Embedded toolchain

    3. CMake

    4. Build Tools for Visual Studio 2019

    5. Python 3

    6. Git for Windows

    7. Visual Studio Code

    8. Doxygen

    9. Graphviz

    10. Zadig


    At the end of the installation it asks if you want to clone the SDK from the GitHub
    repo and the usual answer is "Yes". Of the only essential ones are GNU Arm Embedded
    Toolchain, CMake and Build Tools for Visual Studio 2019 and you can install them
    separately if you don''t want to use the script.


    Notice that the build tools are for Visual Studio not VS Code. You don''t actually
    use Visual Studio, but this is the easiest way to get CMake which is needed to
    execute the output of CMake. It is also important to realize that you have to
    run VS Code from the VS Studio Command Prompt. If you don''t then the paths to
    the various tools aren''t correctly set up. If you use the installer you will
    find:


    Visual Studio Code for Pico


    in the pico directory and you can simply click on this to start VS Code with it
    correctly configured.'
