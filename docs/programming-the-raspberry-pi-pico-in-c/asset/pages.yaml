- img_proc: true
  md: 'The only difficult part is to remember that the 1-Wire bus sends the least
    significant bit first and so this has to be shifted into the result from the right.
    The sequence is:


    +   - Test to see if a device is present:

    presence(uint8_t pin)


    +   - Write a byte:

    void writeByte(uint8_t pin, int byte)


    +   - Read a byte:

    int readByte(uint8_t pin)


    These functions will be used in the next two chapters to work with real 1-wire
    devices.


    Are are not the only functions we need to work with the 1-Wire bus. We need to
    be able to compute the CRC error checks that are common to confirm that data has
    been transmitted correctly and we need to perform a ROM search to discover which
    devices are connected to the bus, but this is beyond the scope of this introduction.
    For details of a general C implementation, Raspberry Pi IOT in C, Second Edition,
    ISBN:9781871962635.


    # Computing The CRC


    We have already encountered the idea and implementation of a CRC (Cyclic Redundancy
    Checksum) in Chapter 12. The 1-Wire bus uses the same CRC for all its devices
    and therefore we need to implement it just once. This is perhaps not in the most
    efficient way, but it will work. For low data rate applications high efficiency
    isn''t needed and you can make use of direct implementation. The 1-Wire datasheet
    specifies the CRC used in 1-wire devices as a shift register rather than as a
    polynomial:


    ![](img/470d59c61482018b86da50823ee18a57_290_0.png)


    However, this is equivalent to a generator polynomial that defines the CRC as
    it is simply the hardware implementation of the calculation.


    In this case it is:


    X^8 + X^5 + X^4 + 1'
  merge: -1
  pgno: 290
- img_proc: true
  md: "The first question to answer, what is the connection between binary values,\
    \ polynomials and shift-registers? The answer is that you can treat a binary number\
    \ as the coefficients of a polynomial, for example 101 is 1*X²+0*X+1. Each bit\
    \ position corresponds to a power of X. Using this notation creates a very simple\
    \ relationship between multiplying X and a left-shift.\n\nFor example:\n\n(1*X²+0*X+1)*X\
    \ = 1*X³+0*X²+1X +0\n\ncorresponds to:\n\n101 <<1 == 1010\n\nYou can see this\
    \ that multiplying one polynomial by another and even polynomial division, all\
    \ accomplished by shifting and XOR (eExclusive).\n\nThe CRC is the remainder when\
    \ you divide the polynomial that represents the data by. The computation of the\
    \ remainder is what the shift register specified on the datasheet does. The fact\
    \ that the division can be implemented simply in hardware is what makes this sort\
    \ of CRC computation so common. All the hardware has to do is zero the shift register\
    \ and feed the data into it. When all the data has been shifted in, what is left\
    \ in shift register is the CRC, the remainder.\n\nTo check the data you have received,\
    \ all you have to do is run it through the shift register again and compare the\
    \ computed CRC with the one received. A better trick is also to run the received\
    \ CRC through the shift register. If there have been no errors, this will result\
    \ in 0.\n\nYou can look into the theory of CRCs, bit sequences and polynomials\
    \ further, it is interesting and practically useful, but we now know everything\
    \ we need to want implement the CRC used by1-Wire devices. All we have to do is\
    \ implement the shift register in software.\n\nFrom the diagram, what we have\
    \ to do is take each bit of the input data and XOR it with the least significant\
    \ bit of the current shift register. If the input bit is 0, the XORs in the shift\
    \ register have no effect and the CRC just has to be moved one bit to the right.\
    \ If the input bit is 1, we have to XOR the bits at positions 3 and 4 with a 1\
    \ and put a 1 at position 7 to simulate shifting a1 into the register, i.e the\
    \ shift register with 10001100.\n\n```\nSo the algorithm for a single byte is:\n\
    for (j = 0; j < 8; j++) {\n  temp = (crc ^ databyte) & 0x01;\n  crc >>= 1;\n \
    \ if (temp) {\n    crc ^= 0x8C;\n    databyte>>= 1;\n  }\n}\n```"
  merge: -1
  pgno: 291
- img_proc: true
  md: "First XOR the data with the current CRC and extract the low-order bit into\
    \ temp. Then we right-shift the CRC by one place. If the low-order result stored\
    \ in temp was a 1, we have to XOR the CRC with 0x8c to simulate the XORs in the\
    \ shift register and shift in a 1 at the most significant bit. Then shift the\
    \ data one place and repeat for the next data.\n\nWith this worked out, we can\
    \ now write a crc8 function that computes the CRC for the entire bytes of data:\n\
    \n```\nuint8_t crc8(uint8_t *data, uint8_t len) {\n    uint8_t i;\n    uint8_t\
    \ j;\n    uint8_t temp;\n    uint8_t datbyte;\n    uint8_t crc = 0;\n    for (i\
    \ = 0; i < len; i++) {\n        datbyte = data[i];\n        for (j = 0; j < 8;\
    \ j++) {\n            temp = (crc ^ datbyte) & 0x01;\n            crc >>= 1;\n\
    \            if (temp)\n                crc ^= 0x8c;\n            datbyte >>=\
    \ 1;\n        }\n    }\n    return crc;\n}\n```\n\nWith this in place we can now\
    \ now check the CRC of any data a 1-Wire bus sends us.\n\n# The DS18B20 Hardware\n\
    \nNow let's put all of this to work with the most popular 1-Wire device, the DS18B20.\
    \ It is available in a number of formats, but the most common it look just like\
    \ a standard BJT (Bipolar Transistor) which can sometimes be a problem when you\
    \ are trying to find one. You can also get them made up into waterproof sensors\
    \ complete with cable.\n\n![](img/470d59c61482018b86da50823ee18a57_292_0.png)"
  merge: -1
  pgno: 292
- img_proc: true
  md: 'No matter how packaged, they will work at 3.3V or 5V.

    The basic specification of the DS18B20 is:


    +   - Measures temperatures from -55°C to +125°C (-67°F to +257°F)

    - ±0.5°C accuracy from -10°C to +85°C

    - Thermometer resolution is user-selectable from 9 to 12 bits

    - Converts temperature to 12-bit digital word in 750ms (max)


    It can also be powered from the data line, allowing the bus to operate with only
    two wires - data and ground. However, this "parasitic power" mode is difficult
    to work reliably and best avoided in an initial design. To supply it with enough
    power during a conversion, the host has to connect directly to the data line by
    providing a "strong pull-up" - essentially a transistor. In normal-powered mode
    there are just three connections:


    ![](img/470d59c61482018b86da50823ee18a57_293_0.png)


    Ground needs to be connected to the system ground, VDD to 3.3V and DQ to the pull-up
    resistor of an open collector bus.


    ![](img/470d59c61482018b86da50823ee18a57_293_1.png)


    While you can have multiple devices on the same bus, for simplicity it is better
    to start off with a single device until you know that everything is working.'
  merge: -1
  pgno: 293
- img_proc: true
  md: "You can build the circuit in a variety of ways. You can solder the resistor\
    \ to the temperature sensor and then use some longer wires with clips to connect\
    \ to the Pico. You could also solder directly to the Pico or use a prototyping\
    \ board.\n\n![](img/470d59c61482018b86da50823ee18a57_294_0.png)\n\n# # Initialization\n\
    \nEvery transaction with the 1-wire device starts with an initialization handshake.\
    \ The master holds the bus low for at least 480µs, a pause of 15µs for 60µs follows,\
    \ and then any and all of the devices on the bus pull the line low for 60µs to\
    \ 240µs.\n\nFor this we need the presence function:\n\n```\nint main()\n{\n  \
    \  stdio_init all();\n    gpio_init(2);\n    if (presence(2) == 1)\n    {\n  \
    \      printf(\"No device \\n\");\n    }\n    read temperature\n}...\n```\n\n\
    If you try this partial program and have a logic analyzer with a 1-wire protocol\
    \ analyzer, you will see something like:\n\n| | +100us | +200us | +300us | +400us\
    \ | +500us | +600us | +700us | +8 |\n|---|---|---|---|---|---|---|---|---||\n\
    | RESET condition | | | | | | PRESENCE condition | | |\n\n| ▼ Measurements |\n\
    | Width: 452.4us |\n| Presence: 512.1us |\n| DutyCycle: 5.98329913% |\n| Frequency:\
    \ 1.94897830kHz |\n| ▼ Pulse Measurements"
  merge: -1
  pgno: 294
- img_proc: true
  md: "Seeing a pulse is the simplest and quickest way to be sure that your hardware\
    \ is working. From this point it is just a matter of using the functions developed\
    \ in the previous chapters to work with the commands defined in the datasheet.\n\
    \n# Initiating Temperature Conversion\n\nAs there is only one device on the 1-Wire\
    \ bus, we can use the Skip ROM command (0xCC) to signal it to be active:\n\nYou\
    \ can see the pattern of bits sent on a logic analyzer:\n\n![](img/470d59c61482018b86da50823ee18a57_295_0.png)\n\
    \nOur next task is to send a Convert command, 0x44, to start the DS18B20 making\
    \ a temperature measurement. Depending on the resolution selected, this can take\
    \ as long as 750ns. How the device tells master that the measurement has completed\
    \ depends on the mode in which it is operating, using an external power line,\
    \ i.e. not using parasitic mode, the device sends a θ bit in response to a read\
    \ unit until it is completed when it sends a 1.\n\nThis is how 1-Wire devices\
    \ that need time to get data slow down the master until they are ready. The master\
    \ can read a single bit as if it likes and the slave will respond with a θ until\
    \ it is ready with the data.\n\nAs we already have a readBit function this is\
    \ easy. The software polls for the completion by reading the bus until it gets\
    \ a 1 bit:\n\n```\nint convert(uint8_t pin)\n{\n  writeByte(pin, 0x44);\n  int\
    \ i;\n  for (i = 0; i < 500; i++)\n{\n    sleep ms(10);\n    if (readBit(pin)\
    \ == 1)\n      break;\n  }\n  return i;\n}\n```"
  merge: -1
  pgno: 295
- img_proc: true
  md: "You can course test the return value to ROM check that the result has been\
    \ obtained. If convert returns 500 then the loop times out. When the function\
    \ returns, the new temperature measurement is stored in the device's scratchpad\
    \ memory and now all we have to do is read.\n\n# Reading the Scratchpad\n\nThe\
    \ scratchpad memory has nine bytes of storage in total and does things like control\
    \ the accuracy of conversion and provide status information. In simple example\
    \ the only two bytes of any great interest are the first two, which hold the result\
    \ of a temperature conversion. However, as we are going to check the CRC for error\
    \ detection, we need to read all nine bytes. All we have to do is issue a Read\
    \ Scratchpad, 0xBE, command and then the new command we have to issue a new initialization\
    \ pulse and a Skip ROM, 0xCC, command followed by a Read Scratchpad, 0xBE:\n\n\
    ```\npresence(2);\nwriteByte(2, 0xCC);\nwriteByte(2, 0xBE);\n```\n\nNow the data\
    \ is ready to read. We can read all nine bytes of it or just the first two that\
    \ we are interested in. The device will keep track of which bytes have been read.\
    \ If you come back later and read more bytes you will continue the read from where\
    \ you left off. If you issue another initialization pulse then the device aborts\
    \ data transmission.\n\nAs we do not check the CRC for errors, we will read all\
    \ nine bytes:\n\n```\nuint8_t data[9];\nfor (int i = 0; i < 9; i++ {\n  data[i]\
    \ = readByte(2);\n}\n```\n\nNow we have all of the data in the scratchpad and\
    \ the CRC byte, we can check for errors:\nuint8_t crc = crc8(data, 9);\nAs before,\
    \ before crc will be 0 if there are no transmission errors. The crc8 function\
    \ was given earlier.\n\n# Getting The Temperature\n\nTo obtain the temperature\
    \ measurement we need to work with the first two bytes, which are the least and\
    \ most significant bytes of the 12-bit temperature reading:\n\n```\nint t1 = data[0];\n\
    int t2 = data[1];\n```"
  merge: -1
  pgno: 296
- img_proc: true
  md: "t1 holds the low-order bits and t2 the high-order bits.\n\nAll we now have\
    \ to do is to put the two bytes together as a 16-bit two's\ncomplement integer.\
    \ As the Pico supports a 16-bit int type, we can do this\nvery easily:\n\n```\n\
    int16_t temp1 = (t2 << 8 | t1);\n```\n\nNotice that this only works because int16_t\
    \ really is a 16-bit integer. If you\nwere to use:\n\n```\nint temp1= (t2<<8 |\
    \ t1);\n```\n\ntemp1 would be correct for positive temperatures but it would give\
    \ the wrong\nanswer for negative values because the sign bit is not propagated\
    \ to the top\n16 bits. If you want to use a 32-bit integer, you will have to propagate\
    \ the sign\nt2 & manually:\n\n```\nif(t2 & 0x80) temp1= 0xFFFF0000;\n```\n\nFinally,\
    \ we have to convert the temperature to a scaled floating-point value.\nAs returned\
    \ data giving the fractional part, it has to be scaled by a factor of 1/16:\n\n\
    ```\nfloat temp = (float) temp1 / 16;\n```\n\nNow we can print the CRC and the\
    \ temperature:\n\n```\nprintf(\"CRC %hho \\n\\r\", crc);\nprintf(\"temperature\
    \ = %f C\\n\", temp);\n```\n\n# A Temperature Function\n\nPackaging all of this\
    \ into a single function is easy:\n\n```\nfloat getTemperature(uint8_t pin) {\n\
    \  if (presence(pin) == 1) return -1000;\n  writeByte(pin, 0xCC);\n  if (convert(pin)\
    \ == 500) return -3000;\n  presence(pin);\n  writeByte(pin, 0xCC);\n  writeByte(pin,\
    \ 0xBE);\n  int i;\n  uint8_t data[9];\n  for (i = 0; i < 9; i++) {\n    data[i]\
    \ = readByte(pin);\n  }\n  uint8_t crc = crc8(data, 9);\n  if(crc!=0) return -2000;\n\
    \  int t1 = data[0];\n  int t2 = data[1];\n  int16_t temp1 = (t2 << 8 | t1);\n\
    \  float temp = (float) temp1 / 16;\n  return temp;\n}\n```"
  merge: -1
  pgno: 297
- img_proc: true
  md: "Notice that the function returns -1000 if there is no device, -2000 if there\
    \ is a CRC error and -3000 if the device fails to provide data. These values are\
    \ outside the range of temperatures that can be measured.\n\n# The Complete Program\n\
    \nThe complete program to read and display the temperature is:\n#include <stdio.h>\n\
    #include \"pico/stdlib.h\"\n#include \"hardware/gpio.h\"\n\n```\nint presence(uint8_t\
    \ pin)\n{\n    gpio_set_dir(2, GPIO_OUT);\n    gpio_put(pin, 1);\n    sleep_ms(1);\n\
    \    gpio_put(pin, 0);\n    sleep_us(480);\n    gpio_set_dir(pin, GPIO_IN);\n\
    \    sleep_us(70);\n    int b = gpio_get(pin);\n    sleep_us(410);\n    return\
    \ b;\n}\n```\n\n```\nvoid write8bit(uint8_t pin, int b)\n{\n    int delay1, delay2;\n\
    \    if (b == 1)\n    {\n        delay1 = 6;\n        delay2 = 64;\n    }\n  \
    \  else\n    {\n        delay1 = 60;\n        delay2 = 10;\n    }\n    gpio_set_dir(pin,\
    \ GPIO_OUT);\n    gpio_put(pin, 0);\n    sleep_us(delay1);\n    gpio_set_dir(pin,\
    \ GPIO_IN);\n    sleep_us(delay2);\n}\n```"
