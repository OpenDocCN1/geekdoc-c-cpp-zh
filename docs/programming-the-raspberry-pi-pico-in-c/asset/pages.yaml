- img_proc: true
  md: 'This is a very basic set of functions, you can add others to improve motor
    control according to how sophisticated you want it to be. For example, a brake
    function would set both lines high for brake mode or you could introduce limits
    on how fast the speed can be changed.


    There are H-bridges that use two lines to control Phase and Enable. These map
    to the usual Forward, Reverse and Enable as shown below:


    ![](img/470d59c61482018b86da50823ee18a57_155_0.png)


    The disadvantage of this arrangement is that you cannot set Forward and Reverse
    to put the motor into brake mode. If you have this sort of controller, anything
    based on the MAX14870/2 for example, then you can modify the functions to use
    a single PWM line and one standard GPIO line for speed and direction.


    # # Using A Single Full H-Bridge As Two Half H-Bridges


    It is easy to think of an H-bridge as being only for bidirectional control, but
    each full bridge is composed of two half bridges and this means a typical dual
    full H-bridge can control four unidirectional motors:


    ![](img/470d59c61482018b86da50823ee18a57_155_1.png)


    In this case Forward is now MotorM1 speed control and Reverse is now MotorM2 speed
    control. Any enable line has to be set high to allow the two motors to be controlled.
    You can make use of this arrangement H-bridge with the unidirectional software
    given earlier.'
  merge: -1
