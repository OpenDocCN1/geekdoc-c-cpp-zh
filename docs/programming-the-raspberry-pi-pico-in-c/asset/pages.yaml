  md: 'As well as the Read ScratchPad command that we used to read the temperature,
    there is also a Write ScratchPad command, 0x4E.

    The format of the scratchpad is:


    | BYTE 0 | TEMPERATURE LSB (50h) | EEPROM |

    |---|---||

    | BYTE 1 | TEMPERATURE MSB (50h) | |

    | BYTE 2 | T_REGISTER OR USER BYTE 1* | T_REGISTER OR USER BYTE 1* |

    | BYTE 3 | T_REGISTER OR USER BYTE 2* | T_REGISTER OR USER BYTE 2* |

    | BYTE 4 | CONFIGURATION REGISTER* | CONFIGURATION REGISTER* |

    | BYTE 5 | RESERVED (FFh) | |

    | BYTE 6 | RESERVED | |

    | BYTE 7 | RESERVED (10h) | |

    | BYTE 8 | CRC* | |


    The first two bytes are the temperature that we have already used. The only writable
    entries are bytes 2, 3 and 4. The Write ScratchPad command transfers three bytes
    to these locations. Notice that there is no CRC and no error response if there
    is a transmission error. The datasheet suggests that you read the scratchpad after
    writing it to check that you have been successful in setting the three bytes.

    The third byte written to the scratchpad is to the configuration register:


    | BIT 7 | BIT 6 | BIT 5 | BIT 4 | BIT 3 | BIT 2 | BIT 1 | BIT 0 |

    |---|---|---|---|---|---|---|--|

    | 0 | R1 | RD | 1 | 1 | 1 | 1 | 1 |


    Essentially the only thing you can change is the resolution of the temperature
    measurement.


    | Configuration Register | Resolution | Time |

    |---|---|--|

    | 0x1F | 9 bits | 93ms |

    | 0x3F | 10 bits | 175ms |

    | 0x5F | 11 bits | 375ms |

    | 0x7F | 12 bits | 750ms |


    The time quoted is the maximum for a conversion at the given precision. You can
    see that the only real advantage of decreasing precision is to make conversion
    faster. The default is 0x7F and 12 bits of precision.'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'The first two bytes of the write scratchpad set a high and low temperature
    alarm. This feature isn''t much used, but you can set two temperatures that will
    trigger the device into alarm mode. Notice you only set the top eight bits of
    the threshold temperatures. This is easy enough, but the alarm status is set with
    every read so if the temperature goes outside the set bounds and then back in
    the alarm is cleared.


    The second problem is that, to discover which devices are in alarm mode, you have
    to use the Alarm Search command, 0xEC. This works like the Search ROM command,
    but the devices that respond are the ones with an alarm state. The alarm feature
    might be useful if you have a lot of devices and simply want to detect an out-of-band
    temperature. You could set up multiple devices with appropriate temperature limits
    and then simply repeatedly scan the bus for devices with alarms set.


    You may notice that the scratchpad also has an EEPROM memory connected. Scratchpad,
    you transfer the three bytes of the scratchpad to the EEPROM using Copy Scratchpad,
    0x48, and transfer them back using the Recall EEPROM command, 0xB8. You can use
    this to make the settings non-volatile.


    Finally there is the Read Power Supply command, 0xB4. If the master reads the
    bus after issuing this command a 0 indicates that there are parasitic devices
    on the bus. If there are such devices the master has to run the bus in such a
    way that they are powered correctly.


    If you restrict yourself to a single slave device on the bus, this is more or
    less all there is to the DS18B20, and the 1-Wire bus in general. If you want to
    have multiple slave devices, however while you don''t need any more hardware,
    you do need some software. Multidrop working as it is called beyond the scope
    of this introduction, but you should find it possible to follow the description
    in Chapter 15 of Raspberry Pi IOT in C, Second Edition and implement your own
    version.'
