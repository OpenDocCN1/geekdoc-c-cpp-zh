    ```


    | User | Workspace |

    | --- | --- |

    | Text Editor (1) | The CMake generator to use. |

    | Suggestions (1) | CMake Makefiles |

    | Extensions (6) | CMake configur... (1) |


    Once you have VS Code running the procedure for running the first example blinky.c
    is the same as using a Pi as the development machine.


    # Blinky Using VS Code


    The official documentation takes you through various steps on the way to creating
    your project. If you want to do this it is a good learning experience, but it
    is much more efficient to move directly to creating your own project using the
    tools that you are going to use for all the projects you create. So, we will start
    off VS Code and our own project created from scratch.


    First open VS Code - it is in the Programming section of the menu. If you have
    installed everything using the installation script, it will be set up and ready
    to work with a CMake project. That is, the two CMake and debug extensions will
    already be installed and this is worth checking before moving


