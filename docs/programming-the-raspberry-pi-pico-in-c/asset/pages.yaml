    #include <pico/stdlib.h>\n#include \"hardware/pwm.h\"\nint main() {\n    gpio_set_function(20,\
    \ GPIO_FUNC_PWM);\n    gpio_set_function(21, GPIO_FUNC_PWM);\n    uint slice_num\
