    ```\n\nThis waits on the first pin in the INPUT group to change from 0 to 1, i.e.\
    \ a\nrising edge, and then toggles the first pin in the SET group.\n\nThe C program\
    \ to make this work, using GP2 as the input and GP3 as\n\n```\n#include \"pico/stdlib.h\"\
