  md: "# Data Transfer\n\nAfter you have set up the UART you can start sending and\
    \ receiving data\nusing SDK functions.\n\nThere are two general-purpose read/write\
    \ functions:\n\n```\nuart_write_blocking(uart_inst_t *uart,src,uint8_t *size_t\
    \ len)\n```\n\n```\nuart_read_blocking(uart_inst_t *uart,uint8_t *dst,size_t len)\n\
    ```\n\nIn both cases data is stored in a byte array. In the case of the write\
    \ function\nt number of bytes indicated by len are written - it is up to you to\
    \ make sure\nt the array has enough data. If the data isn't read the buffer might\
    \ fill up\nand the function will block until all the data has been sent. In the\
    \ case of\nthe read function len parameter gives the number of bytes to read and\
    \ the\nfunction blocks until it has that number of bytes.\n\nFor example:\n\n\
    ```\n#include <stdio.h>\n#include <pico/stdlib.h>\n#include \"hardware/gpio.h\"\
