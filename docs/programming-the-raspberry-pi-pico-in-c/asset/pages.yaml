    \ 0, offset, &c);\n    pio_sm_init(pio0, sm, c);\n    pio_sm_set_enabled(pio0,\
    \ sm, true);\n\n    pio_sm_put_blocking(pio0, sm, 0xFFFF);\n    return 0;\n}\n\
    ```\n\nThe only real difference is the pio_sm_put_blocking function at the end\
    \ which stores the TX FIFO to start the PIO running. If you run this program you\
    \ will find that the frequency is 3.7Hz. If you change the pin from GP2 to GP25\
    \ you will also see the onboard LED flash.\n is a way of passing a single parameter\
    \ to a PIO program. If you want to pass two or more parameters then it can be\
    \ done, but things become more complicated.\n\n# Output To GPIO\n\nThe use of\
    \ the Output Shift Register, OSR, to store a value that is moved to the x register\
    \ is reasonable but it isn't the usual role for the OSR. It is the link between\
    \ values passed the state machine and the state of the GPIO lines. We have already\
    \ seen the SET group of GPIO lines can be controlled using the set command, now\
    \ we move on to consider how the OUT group of GPIO lines can be controlled using\
    \ the out command. Recall that the OUT group is a set of GPIO lines specified\
    \ by a starting number and number of lines:\n\n```\nsm_config_set_out_pins (pio_sm_config\
    \ *c, uint out_base, uint out_count)\n```"
