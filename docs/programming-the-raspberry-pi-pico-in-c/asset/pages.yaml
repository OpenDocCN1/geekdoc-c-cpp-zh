- img_proc: true
  md: 'To configure the SPI bus to work with a particular slave device:


    +   1. Select the clock frequency - anything from 125MHz to 3.8kHz

    2. Determine the CS polarity - active high or low

    3. Set the clock mode Mode0 thru Mode3


    Now we have to find out how to do this with the SDK.


    # Pico SPI Interfaces


    The Pico has two SPI controllers, SPI0 and SPI1, that can work as a master or
    slave. The connections from both controllers can be routed to different pins:


    | | GP0 | GP4 | GP16 | GP20 |

    |---|---|---|---|---|n| CSn | GP1 | GP5 | GP17 | GP21 |

    | SCLK | GP2 | GP6 | GP18 | GP22 |

    | MOSI | GP3 | GP7 | GP19 | GP23 |


    | | GP8 | GP12 | GP24 | GP28 |

    |---|---|---|---|---|n| CSn | GP9 | GP13 | GP25 | GP29 |

    | SCLK | GP10 | GP14 | GP26 |

    | MOSI | GP11 | GP15 | GP27 |


    To select a pin to operate as an SPI pin all you have to do is use:

    `gpio_set_function(gpio, gpio_FUNC_SPI);`


    For a full SPI interface you need to set the mode of one pin for one MSIO, one
    MOSI and one SCLK implementation. To make use of them you have to treat them like
    standard GPIO lines and set them high and low to select the device under program
    control. What this means is that you can use as many of the CSn lines with any
    SPI interface as you need.


    # The SPI Functions


    Before you can make use of the SPI functions you have to include the header file:

    #include "hardware/spi.h"


    and you need to add the SPI library `hardware_spi` to the CMakeLists.txt file:

    `target_link_libraries pico_stdlib hardware_spi`


    You might need to reconfigure the project and rebuild.

    The SPI functions can be grouped into initialization, configuration, and data
    transfer. Let''s look at each group in turn.'
