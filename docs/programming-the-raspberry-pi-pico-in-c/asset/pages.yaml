- img_proc: true
  md: "What can you use input for? At its simplest you can use it as an alternative\
    \ clock input for the PWM generator. In PWM_DIV_B_RISING or PWM_DIV_B_FALLING\
    \ mode the counter is incremented just once for each specified edge. The important\
    \ fact to take into account is that the clock divider is still operational and\
    \ the edge signal is divided by the specified value.\n\nFor example, consider\
    \ a configuration in which a 1kHz pulse is fed into the B channel. If the divider\
    \ is set to 1 and the counter is set up with a wrap of 127 and a level of 63 and\
    \ the mode is set to PWM_DIV_B RISING then the output is 1000/128 = 7.8 Hz at\
    \ 50% duty cycle. If we set the clock divider to 2 then the output frequency is\
    \ 1000/(2*128) = 3.9 Hz and so on:\n\n```\n#include \"pico/stdlib.h\"\n#include\
    \ \"hardware/pwm.h\"\nint main() {\n  gpio_set_function(20, GPIO_FUNC_PWM);\n\
    \  gpio_set_function(21, GPIO_FUNC_PWM);\n  uint slice_num = pwm_gpio_to_slice(20);\n\
    \  uint chanA = pwm_gpio_to_channel(20);\n  uint chanB = pwm_gpio_to_channel(21);\n\
    \  pwm_set_clkdiv_int_frac(slice_num, 2, 0);\n  pwm_set_wrap(slice_num, 127);\n\
    \  pwm_set_level(slice_num, chanA, 63);\n  pwm_set_clkdiv(slice_num, PWM_DIV_B_RISING);\n\
    \  pwm_set_enabled(slice_num, true);\n}\n```\n\nNotice that the output frequency\
    \ depends on the signal input to the B input and you can use this to generate\
    \ a frequency PWM signal. To be clear, the output frequency depends on the signal\
    \ applied to B, the clock divider and the wrap. The duty cycle depends on the\
    \ level as usual.\n\nBy allowing the count to proceed for a amount of time using\
    \ PWM_DIV_B_HIGH, you can, in theory, use the PWM slice to measure the duty cycle\
    \ or frequency of the input wave form. There is an example of this included in\
    \ the Pico documentation, but it doesn't emphasize the conditions required to\
    \ make it work. The PWM_DIV_B_HIGH is different from the edge modes in it doesn't\
    \ act as a clock, but as a gate for the internal clock. That is, the clock is\
    \ provided in the usual way by the system clock and the divider to the counter.\
    \ The counter only advances, however, when the B input is high. This means that,\
    \ in fact, the slice is configured to count the time that the B input is. For\
    \ example, if we enable the slice with a clock of approximately 488kHz, wait 10ms,\
    \ disable the slice and read the counter – what does it tell us? Suppose the count\
    \ is 100, this means the B"
  merge: -1
  pgno: 137
- img_proc: true
  md: 'input was high for 100 clock pulses or 100x0.2µs=20µs. You cannot infer the
    frequency from this measurement, it simply gives you the time that the signal
    was high in a 10ms period. However, you can work out that it has a 50% duty cycle
    at any frequency which would allow the clock to proceed for half of the measurement
    period. In general the duty cycle is:


    d = time high/measurement time %


    Of course, this is just the average duty cycle over the measurement time. To get
    an estimate that is close to the instantaneous duty cycle, the measurement time
    has to be small, but this reduces accuracy because of the possibility of including
    fractional pulses also at the start and end of the period. The clock frequency
    should also be selected so for a 100% duty cycle we get a maximum count, i.e.:


    max count = clock frequency*measurement time


    or we we want the max count to be 65535:

    clock frequency = 65535/measurement time


    which gives the frequency in kiloHertz if the measurement time is in milliseconds.


    For example with a measurement time of 10ms, we need a clock of:

    65535/10 = 6553.5kHz.


    A more useful utility is the divider needed to get the clock rate:

    divider = 125000*measurement time/65535


    For example, a measurement time of 10ms gives a clock divider of:

    divider = 12500*10/65535 =19.074


    Selecting the next largest integer divider gives you a clock rate that doesn''t
    quite get to the maximum count. If you select the lower then you will get a complete
    wrap and the start of another cycle which will return a low count at the end of
    the period. You don''t want the counter to wrap during the measurement period.
    If we use 20 as the divider then the maximum count is:


    max count=125000000*1000/(20*10)

    = 62500'
  merge: -1
  pgno: 138
- img_proc: true
  md: "Putting all of this together gives a duty cycle measurement program:\n\n```\n\
    int main() {\n  stdio_init_all();\n  gpio_set_function(20, GPIO_FUNC_PWM);\n \
    \ gpio_set_function(21, GPIO_FUNC_PWM);\n  uint slice_num = pwm_gpio_to_slice_num(20);\n\
    \n  uint chanA = pwm_gpio_to_channel(20);\n  uint chanB = pwm_gpio_to_channel(21);\n\
    \n  pwm_set_clkdiv_int(slice_num, 20, 0);\n  int maxcount=125000000*10/20/1000;\n\
    \n  pwm_set_wrap(slice_num, 65535);\n  pwm_set_level(slice_num, chanA, 100);\n\
    \  pwm_set_clkdiv_mode(slice_num, PWM_DIV_B_HIGH);\n\n  while (true) {\n    pwm_set_enabled(slice_num,\
    \ true);\n    sleep_ms(10);\n    pwm_set_enabled(slice_num, false);\n    uint16_t\
    \ count = pwm_get_counter(slice_num);\n    pwm_set_counter(slice_num, 0);\n  \
    \  printf(\"count=%u duty cycle=%%d%%\\n\", count, (int)count*100/maxcount);\n\
    \    sleep_ms(1000);\n  }\nn\n```\n\nThis program will work and give a reasonably\
    \ accurate result as long as the frequency of the signal measured presents a reasonable\
    \ number of cycles in a 10ms period – about 200Hz in practice.\n\n# A Configuration\
    \ Struct\n\nThe SDK provides an alternative way of configuring a PWM slice. Instead\
    \ of making separate calls to configuration functions, you can set values in a\
    \ struct:\n\n```\ntypedef struct {\n  uint32_t csr;\n  uint32_t div;\n  uint32_t\
    \ top;\n} pwm_config;\n\n```"
  merge: -1
  pgno: 139
- img_proc: true
  md: 'and then use functions to set some of the values:


    ```

    pwm_config_set_phase_correct (pwm_config *c, bool phase_correct)

    pwm_config_set_clkdiv_div (pwm_config *c, float div)

    pwm_config_set_clkdiv_int (pwm_config *c, uint div)

    pwm_config_set_clkdiv_mode (pwm_config *c, enum pwm_clkdiv_mode)

    ```


    ```

    pwm_config_set_output_polarity (pwm_config *c, bool a, bool b)

    pwm_config_set_wrap (pwm_config *c, uint16_t wrap)

    ```


    You can initialize the struct to default values using:


    ```

    pwm_get_default_config (void)

    ```


    and apply the configuration using:


    ```

    pwm_init (slice_num, pwm_config *c, bool start)

    ```


    The advantage is that once you have the struct configured you can reuse it. For
    example:


    ```

    pwm_config cfg = pwm_get_default_config();

    pwm_config_set_wrap(&cfg, wrap);

    pwm_init(slice_num, &cfg, true);

    ```


    Use whichever to initialize the slice seems natural.


    # What Else Can You Use PWM For?


    PWM lines are incredibly versatile and it is always worth asking the question
    “could I use PWM?” when considering almost any problem. The LED example shows
    how you can use PWM as a power controller. You can extend this idea to a computer-controlled
    switched-mode power supply. All you need is a capacitor to smooth out the voltage
    and a transformer to change the voltage. You can also use PWM to control the speed
    of a DC motor and by adding a bridge circuit, its direction and speed. Finally,
    you can use a PWM signal as a modulated carrier for data communications. For example,
    most infrared controllers make use of a 38kHz carrier, which is roughly a 26µs
    pulse. This is switched on and off for 1ms and this is well within the range that
    the PWM can manage. So all you have to do is the red LED in the previous circuit
    with an infrared LED and you have the start of a remote control, or data transmission,
    link.


    One big area of use is in controlling motors and servo motors in particular and
    this is the subject of the next chapter.'
  merge: -1
  pgno: 140
- img_proc: true
  md: '# # Summary


    +   - PWM, Pulse Width Modulation, has a fixed repetition rate but a variable
    duty cycle, i.e. the amount of time the signal is high or low changes.

    - PWM can be generated by software simply by changing the state of a GPIO line
    correctly, but it can also be generated in hardware so relieving the processor
    of some work.

    - As well as way of signaling, PWM can also be used to vary the amount of power
    or voltage transferred. The higher the duty cycle, the more power/voltage.

    - The Pico has eight hardware PWM generators and these are capable of a range
    of operational modes.

    - The PWM lines are controlled by a counter and two values wrap which gives the
    frequency and level which gives the duty cycle.

    - You can generate phase correct PWM or allow the phase to vary with the duty
    cycle.

    - The higher the wrap value the higher resolution of the duty cycle. It is possible
    to work out the best value for the clock frequency for any PWM frequency to maximize
    the duty cycle resolution.

    - Changing the duty cycle is slow using but fast using interrupts.

    - PWM can be used to implement a DAC simply by varying the duty cycle.

    - In the same way, by varying the duty cycle, you can dim an LED.

    - You can use the PWM hardware in input mode to count the number of cycles that
    the line is high and so estimate the duty cycle.'
  merge: -1
  pgno: 141
- img_proc: true
  md: '# Chapter 9


    # Controlling Motors And Servos


    Controlling motors is an obvious use for the low cost Pico, but it is important
    to understand the different types of motor that you can use and exactly how to
    control them using PWM. In addition to motor control, we also look at the very
    useful stepper motor which doesn''t make use of PWM.


    The simplest division among types of motor is AC and DC. AC motors are generally
    large and powerful and run from mains voltage. As they are more difficult to work
    with, and they work at mains voltages, these aren''t used much in IoT applications.
    DC motors generally work on lower voltage and are much more suitable for the IoT.
    In this chapter we will only look at DC motors and how they work thanks to pulse
    modulation. The parts used are listed in the Resources section of the book''s
    webpage at www.iopress.info.


    # DC Motor


    There are two classes of DC motor – brushed and brushless. All motors work by
    using a set of fixed magnets, the stator, and a set of rotating magnets, the rotor.
    The important idea is that a motor generates a “push” that rotates the shaft by
    the forces between the magnet that makes up the stator and the rotor. The stronger
    these magnets are, the stronger and the more torque (turning force) the motor
    can produce. To keep the motor turning, one of the two magnetic fields has to
    change the rotor being attracted to a new position.


    | 1 | 2 | 3 | 4 |

    |---|---|---|---|n| Stator | Permanent | Electromagnet | Electromagnet |

    | Rotor | Permanent | Electromagnet | Permanent | Electromagnet |

    | Type | Can''t work | Brushed DC | Brushless DC | Series or shunt |'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'Arrangement 1 can''t produce a motor because there is no easy way of changing
    the magnetic field. Arrangement 4 produces the biggest and most powerful DC motors
    used in trains, cars and so on. Arrangement 2, Brushed DC, is the most commonly
    encountered form of "small" DC motor. However, arrangement 3, brushless DC, is
    becoming increasingly popular.


    Different arrangements produce motors which have different torque characteristics,
    i.e. how they are to stop at any speed. Some types of motor are typically low
    torque at any speed, i.e. they spin fast but are easy to stop.


    Low torque motors are often used with gearboxes, which reduce the speed and increase
    the torque. The big problem with gearboxes, apart from extra cost, is backlash.
    The gears don''t mesh perfectly and this looseness means that you can turn the
    input shaft and at the output shaft won''t move. When only the shaft in the gears
    has been taken up the output shaft won''t move. This makes a geared motor less
    useful for precise positioning, although there are ways to improve on this using
    feedback and clever programming.


    # Brushed Motors


    To energize the electromagnets, a brushed motor supplies current to the armature
    via a split ring or commutator or brushes. As the rotor rotates, the current in
    the coil is reversed and it is always attracted to the other pole of the magnet.


    The only problem with this arrangement is that, as the brushes rub on the slip
    ring as the armature rotates, they wear out and cause sparks and hence RF interference.
    The quality of a brushed motor depends very much on the design of the brushes
    and the commutator.


    ![](img/470d59c61482018b86da50823ee18a57_143_0.png)'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Very small, cheap, brushed DC motors, of the sort in the picture below, tend
    to not have brushes that can be changed and when they wear out the motor has to
    be replaced. They also tend to have very low torque and high speed. This usually
    means that they have to be used with a gearbox. If you overload a brushed motor
    then the tendency is to demagnetize the stator magnets. The cheapest devices are
    basically toys.


    ![](img/470d59c61482018b86da50823ee18a57_144_0.png)


    Higher quality brushed motors are available and they also come in a variety of
    form factors. For example, the 775 motor is 66.7 by 42mm with a 5mm shaft:


    # 775 motor


    ![](img/470d59c61482018b86da50823ee18a57_144_1.png)


    Even these motors tend not to have user-serviceable brushes, but they tend to
    last a long time due to better construction.'
  merge: -1
  pgno: 144
- img_proc: true
  md: '# Unidirectional Brushed Motor


    A brushed motor can be powered by simply connecting it to a DC supply. Reversing
    the DC supply reverses the direction of the motor. The speed is simply proportional
    to the applied voltage. If all you want is a unidirectional control then all you
    need is a PWM driver that can supply the necessary current and voltage.


    A single transistor solution is workable as long as you include a diode to allow
    the energy stored in the windings to discharge when the motor is rotating, but
    not under power:


    ![](img/470d59c61482018b86da50823ee18a57_145_0.png)


    This circuit is simple and will work with motor voltages up to 40V and motor currents
    up to 5A continuous, 8A peak. The only small point to note is that the TIP120
    is a Darlington pair, i.e. it is two transistors in the same case, and as the
    base voltage drop is twice the usual 0.6V, i.e 1.2V, and this has to be taken
    into account when calculating the current-limiting resistor.


    It is sometimes said that the TIP120 and similar are inefficient power controllers
    because, comprising two transistors, they have twice the emitter-collector voltage
    you would expect, which means they dissipate more power than necessary.'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'If you are running a motor from a battery you might want to use a MOSFET, but,
    as described earlier, 3.3V is low to switch a MOSFET on and off. One solution
    is to use a BJT to increase the voltage applied to the gate:


    ![](img/470d59c61482018b86da50823ee18a57_146_0.png)


    The BJT connects the gate to 12V. As the IRZ44NPBF has a threshold voltage between
    2V and 4V, devices should work at 5V and sometimes at 3.3V without the help of
    the BJT, but providing 12V ensures that the MOSFET is fully on. One problem is
    that the use of the BJT inverts the signal. When the GPIO line is high the BJT
    is on and the MOSFET is off and vice versa. In other words, GPIO high switches
    the motor off and low switches it. This MOSFET can work with voltages up to 50V
    and currents of 40A. The 2N2222 can only work at 30V, or 40V in the case of the
    2N2222A.


    A third approach to controlling a unidirectional motor is to use half an H-bridge.
    Why this is so-called, and why you might want to do it, will become apparent in
    the next section on bidirectional motors. Half an H-bridge makes use of two complementary
    devices, either an NPN and a PNP BJT or an N- and P-type MOSFET.'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'For example:


    ![](img/470d59c61482018b86da50823ee18a57_147_0.png)


    If the GPIO line is high then Q1 is on and Q2 off and the motor runs. If the GPIO
    line is low then Q1 is off and Q2 is on and the motor is braked - it has a resistance
    to rotating because of the back electromotive force (EMF) generated when the motor
    turns. You probably need a BJT to feed the MOSFETs as selected.


    # Unidirectional PWM Motor Controller


    A function to control the speed of a unidirectional motor is very simple. The
    speed is set by the duty cycle - the only parameter you have to choose in addition
    is the frequency. If you want an optimal controller then setting the frequency
    is a difficult task. Higher speeds make the motor run faster and quieter - too
    high a frequency and the motor loses power and the driving transistor or MOSFET
    becomes hot and less efficient. The determining factor is the inductance of the
    motor''s coil and any other components connected to it such as capacitors. In
    practice, PWM frequencies from 100Hz to 20kHz are commonly used, but in most cases
    1kHz to 2kHz is a good choice.


    How we implement code to make motor control easy?


    A good pattern, which has many of the advantages of object-oriented programming,
    is to create a struct which has fields that represent the state of the entity.'
  merge: -1
  pgno: 147
- img_proc: true
  md: "For example, to implement a unidirectional motor we can create a Motor struct:\n\
    \n```\ntypedef struct {\n    uint gpio;\n    uint slice;\n    uint chan;\n   \
    \ uint speed;\n    uint freq;\n    uint resolution;\n    bool on;\n} Motor;\n\
    ```\n\nYou can see that this has all of the information needed to define the current\
    \ state of a motor. All we need now are some functions to modify the fields and\
    \ implement the changes to the state. The first is an initialization function:\n\
    \n```\nvoid motorInit(Motor *m, uint gpio, uint freq) {\n    gpio_set_duty(gpio,\
    \ GPIO_FNC_PWM);\n    m->gpio = gpio;\n    m->slice = pwm_gpio_to_slice(gpio);\n\
    \    m->chan = pwm_gpio_to_channel(gpio);\n    m->freq = freq;\n    m->speed =\
    \ 0;\n    m->resolution = pwm_set_freq_duty(m->freq, m->speed);\n    m->on=false;\n\
    }\n```\n\nNext, we need a function to set the speed:\n\n```\nvoid motorspeed(Motor\
    \ *m, int s) {\n    pwm_set_duty(m->slice, m->chan, s);\n    m->speed = s;\n}\n\
    ```\n\nand finally, two functions, to turn the motor on and to turn it off:\n\n\
    ```\nvoid motorOn(Motor *m) {\n    pwm_set_enabled(m->slice, true);\n    m->on=true;\n\
    }\n```\n\n```\nvoid motorOff(Motor *m) {\n    pwm_set_enabled(m->slice, false);\n\
    \    m->on=false;\n}\n```"
  merge: -1
  pgno: 148
- img_proc: true
  md: "With this struct and its associated functions, the functions from the previous\
    \ chapter, we can create and use a motor very easily (remember to add hardware_pwm\
    \ to the CMakeLists.txt file):\n\n```\n#include <pico/stdlib.h>\n#include \"hardware/pwm.h\"\
    \nint main() {\n  Motor mot1;\n  motorInit(&mot1, 21, 2000);\n  motorspeed(&mot1,\
    \ 50);\n  motorOn(&mot1);\n  return 0;\n}\n```\n\nThis sets up a motor connected\
    \ to GP21, using 2kHz for the frequency, then sets it to 50% speed and turns it\
    \ on. You can see that the functions can be used to control multiple motors connected\
    \ to different GPIO lines — simply create a Motor struct for each one.\n\n# Bidirectional\
    \ Brushed Motor\n\nIf you want bidirectional control then you need to use an H-bridge:\n\
    \n![](img/470d59c61482018b86da50823ee18a57_149_0.png)\n\nIt is easy to see how\
    \ this works. If Q1 and Q4 are the only MOSFETs on the motor, + is connected to\
    \ 12V and – ground. The motor runs in the forward direction. If Q2 and Q3 are\
    \ the only MOSFETs on the motor, + is connected to ground and – connected to 12V.\
    \ The motor runs in the reverse direction. Of course, if none or any single one\
    \ is the motor is off. If Q1 and Q3, or Q2 and Q4, are on then the motor is braked\
    \ as its windings are shorted out and the back EMF acts as a brake."
  merge: -1
  pgno: 149
- img_proc: true
  md: 'You can arrange to drive the four MOSFETs using four GPIO lines - just make
    sure that they switch on and off in the correct order. To make the bridge easier
    to drive, you can add a NOT gate to each pair so that you switch Q1/Q2 and Q3/
    Q4 to opposite states.


    ![](img/470d59c61482018b86da50823ee18a57_150_0.png)


    An alternative design is to use complementary MOSFETs:


    ![](img/470d59c61482018b86da50823ee18a57_150_1.png)


    In this configuration, the first GPIO line drives the motor forward and the second
    drives it in reverse. The effect of setting the two lines is:


    | Forward | Reverse | Motor |

    |---|---|--|

    | Low | Low | Off |

    | Low | High | Reverse |

    | High | Low | Forward |

    | High | High | Braked |'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'You can also drive the GPIO lines for Forward/Reverse with a PWM signal and
    control the motor''s speed as well as direction. If you use the MOSFETs shown
    in the diagram you would also need a BJT to increase the drive voltage to each
    MOSFET, in the unidirectional case. You also need to include diodes with potential
    reverse voltage on each of the MOSFETs. The most important thing about an H-bridge
    is Q1/Q2 and Q3/Q4 should never be on together – this would short the power supply.


    If working with four power BJTs is more than you want to tackle, the good news
    is that there are chips that implement two H-bridges per device. You can also
    buy low-cost ready-made modules with one or more H-bridges. One of the most used
    devices is the L298 Dual H-bridge which works up to 46V and total DC current of
    4A.


    ![](img/470d59c61482018b86da50823ee18a57_151_0.png)


    The block diagram of one of the two H-bridges shows exactly how it works:


    ![](img/470d59c61482018b86da50823ee18a57_151_1.png)


    You can see that the bridge is made up of four BJTs and there are logic gates
    to allow IN1 and IN2 to select the appropriate pairs of devices. The only extras
    are AND gates and that the ENA (enable) line is used to switch all of the transistors
    off. The line shown as SENSE A can be used to detect the speed or load of the
    motor, but is rarely used.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# A typical module based on the L298 out be seen below.


    ![](img/470d59c61482018b86da50823ee18a57_152_0.png)


    It is easier to describe how to use this sort of module with a single motor. The
    motor is connected to OUT1 and OUT2. Three GPIO lines are connected to ENA, IN1
    is an enable line, ENA has to be high for the motor to run at all. IN1 and IN2
    play the role of direction control lines – which one is forward and which is reverse
    on which way you connect the motor. Putting a PWM signal onto ENA controls the
    speed of the motor and this allows IN1 and IN2 to be simple digital outputs.


    Notice that the power connector shows 5V and 12V supplies, but most of these modules
    have a voltage regulator which will reduce the 12V to 5V. In this case you don''t
    have to supply a 5V connection. If you want to use more than 12V then the regulator
    has to be disconnected and you need to arrange for a separate 5V supply – check
    with the module''s documentation. Notice that the transistors in the H-bridge
    have have around a 2V drop, so using 12V results in just 10V applied to the motor.


    Another very popular H-bridge device is the SN754410 driver. This is suitable
    for smaller, power-motors, and has two complete H-bridges. It can supply up to
    1A per driver and work from 4.5 to 6V. It has the same set of control lines as
    the L298, i.e. each motor has a forward/reverse control line and an enable line.
    You don''t use the enable line - it can be connected to +5V to allow PWM to be
    applied on the forward/reverse lines.


    ![](img/470d59c61482018b86da50823ee18a57_152_1.png)'
  merge: -1
