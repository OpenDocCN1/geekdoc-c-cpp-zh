  md: "The complete program is but remember that it needs the PIO program and the\n\
    CMakeLists.txt file:\n\n```\n#include \"pico/stdlib.h\"\n#include \"hardware/pio.h\"\
    \n\n#include \"sqquareave.pio.h\"\n```\n\n```\nint main() {\n    uint offset =\
    \ pio_add_program(pio0, &sqquareave_program);\n\n    uint sm = pio_claim_unusedsm(pio0,\
    \ true);\n    pio_sm_config c = squarewave_program_get_default_config(offset);\n\
    \n    sm_config_set_pins(&c, 2, 1);\n    pio_gpio_init(pio0, 2);\n\n    pio_sm_init(pio0,\
    \ sm, offset, &c);\n    pio_sm_set_enabled(pio0, sm, true);\n    return 0;\n}\n\
    ```\n\nWe have a square wave producing program but it isn't suitable as a Blinky\n\
    At the moment the clock rate is to produce a square wave at\naround 40MHz and\
    \ we need to bring down the frequency to something\nreasonable so that we can\
    \ see an LED blink on and off.\n\n# Clock Division And Timing\n\nThere are a number\
    \ of ways of controlling the speed with which things\nhappen, the most direct\
    \ and preferable is to change the clock frequency by\nspecifying a divider. The\
    \ PIO clock can be divided down using a 16-bit\ndivider – 8-bit integer/8-bit\
    \ fractional. In most cases, you should avoid using a\nfraction divider as it\
    \ introduces extra periods to the frequency average\nout to the part. This can\
    \ make the PIO subject to jitter, which\ndecreases the reliability.\n\nYou can\
    \ set the clock divider using either of:\n\n```\npio_sm_set_clkdiv (PIO pio, uint\
    \ sm, float div)\npio_sm_set_clkdiv_int_frac (PIO pio, uint sm,\nuint16_t div_int,\
    \ uint8_t div_frac)\n```\n\nIf you add:\n\n```\nsm_config_set_clkdiv_int_frac(&c,255,0);\n\
    ```\n\nthen you will get the lowest clock frequency using the default clock,\n\
    i.e. 500kHz."
