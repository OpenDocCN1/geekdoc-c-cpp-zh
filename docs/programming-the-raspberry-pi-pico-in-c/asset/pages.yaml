- img_proc: true
  md: '# Edges


    This is all there is using input, but the big problem is when you read the state
    of the GPIO lines? When you are implementing a data transfer protocol, it is usual
    that you output something and then wait a given time before reading. Alternatively,
    data is read in response to a clock state transition, often an edge, but we have
    no direct way of responding to an input edge.


    The solution to the problem takes us a little way beyond the simple instruction.
    The PIO supports a conditional wait and a conditional jump, based on the state
    of a GPIO line. The instruction:


    ```

    wait state pin n

    ```


    will wait until the pin indexed by n in the INPUT group is in the specified state.
    Notice that n=0 is the first pin in the group.


    You can also select the pin by absolute GPIO number:


    ```

    wait state Gpn n

    ```


    will wait until Gpn is in the specified state. You can also wait on an IRQ, but
    this is beyond the scope of this first look at the PIO system.


    The conditional jump:


    ```

    jmp pin target

    ```


    jumps to the target if the pin is specified by sm_config_set_jmp_pin (pio_sm_config
    *c, uint pin)


    is a 1 and pin is a raw GPIO number and not specified by the INPUT group. The
    wait instruction is about synchronizing the program to the outside world and the
    jmp is determining what processing should occur according to the state of the
    outside world. For example, if you need to start a process based on the start
    of a rising edge you could:


    ```

    wait 0 pin 0

    wait 1 pin 0

    ```


    This works by waiting for the GPIO line to go to zero and hence, when the second
    wait, you know that a rising edge has occurred. For this to be accurate the clock
    rate should be high compared to the pulses being input. Notice that if you read
    the line after the second wait, the state will be one clock cycle after the rising
    edge. In general, whatever the edge will occur some number of clock cycles after
    the edge. This need for a high clock rate to localize the edge can make other
    aspects of timing difficult.'
