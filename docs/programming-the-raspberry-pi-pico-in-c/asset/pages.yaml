- img_proc: true
  md: 'An event queue is a common architecture, but to work or have any

    advantages, it needs multiple cores so that events can always be added

    to the queue before another occurs or it needs the help of hardware, usually

    to the form of interrupts. Notice that an event, or an event queue, cannot

    increase the program''s throughput or its latency – the time to react to an

    input. In fact, an event decreases throughput and increases latency due

    to overheads of implementation. An event system does is to ensure that

    y do not miss any input and that all inputs processed eventually.


    # Interrupts Considered Harmful?


    Interrupts are often confused with events, but they are very different. An

    interrupt is a hardware mechanism that stops the computer whatever it

    is currently doing and makes it its attention to running an interrupt

    handler. You can think of an interrupt as an event flag that, when set,

    interrupt the current program to run the assigned interrupt handler.


    Using interrupts means the outside world when the computer should

    pay attention to input and there is no need for a polling loop. Most hardware

    people think that interrupts are the solution to everything and polling is

    inelegant and only to be used when you can''t use an interrupt. This is far

    from the reality. There is a general feeling that real-time programming and

    interrupts go together and if you are not using an interrupt you are probably

    doing something wrong. In fact, the truth is that if you are using an interrupt

    you are probably doing something wrong. So much so that some

    organizations are convinced that interrupts are so dangerous that they are

    banned from being used out.


    Interrupts are only really useful when you have a low-frequency condition

    that needs to be dealt with on a high-priority basis. Interrupts can simplify

    t logic of your program, but rarely does using an interrupt speed things up

    because the overhead in interrupt handling is usually quite high.


    If you have a polling loop that takes 100ms to poll all inputs and there is an

    input that demands attention under 60ms then clearly the polling loop is

    not going to be good enough. Using an interrupt allows the high-priority event

    t interrupt the polling loop and be processed in less than 100ms. However, if

    this happens very often the polling loop will cease to work as intended.

    alternative is to simply make the polling loop check the input twice per loop.


    For a more real world example, suppose you want to react to a doorbell

    button. You could write a polling loop that simply checks the button status

    repeatedly and forever or you could write an interrupt service routine (ISR)

    to respond to the doorbell. The processor would be free to get with other

    things until the doorbell was pushed when it would stop what it was doing

    and transfer its attention to the ISR.'
