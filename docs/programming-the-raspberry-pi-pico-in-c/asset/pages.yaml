- img_proc: true
  md: "In practice, a final delay of 2µs seems to work best and allows for the time\
    \ to change the line's direction:\n\n```\nuint8_t readBit(uint8_t pin) {\n  gpio_set_dir(pin,\
    \ GPIO_OUT);\n  gpio_put(pin, 0);\n  sleep(8);\n  gpio_set_dir(pin, GPIO_IN);\n\
    \  sleep(2);\n  uint8_t b = gpio_get(pin);\n  sleep(60);\n  return b;\n}\n```\n\
    \nA logic analyzer shows the typical pattern of bits from the device:\n\n![](img/470d59c61482018b86da50823ee18a57_289_0.png)\n\
    \nBy adding some commands to toggle a line after the sample is taken, we can see\
    \ how the timing works:\n\nYou might think that sampling so close to the rising\
    \ edge of the timing pulse is a bad idea, but the timing of the sample will drift\
    \ longer not shorter and this short timing reduces the error rate.\n\n![](img/470d59c61482018b86da50823ee18a57_289_1.png)\n\
    \nFinally, we need a function that will read a byte. As in the case of writing\
    \ a byte, there is no time criticality in the time between reading bits so we\
    \ don't need to extract extra special care in constructing the function:\n\n```\n\
    uint8_t readByte(uint8_t pin) {\n  int byte = 0;\n  int i;\n  for (i = 0; i <\
    \ 8; i++) {\n    byte = byte | readBit(pin) << i;\n  }\n  return byte;\n}\n```"
