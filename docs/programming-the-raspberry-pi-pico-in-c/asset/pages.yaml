- img_proc: true
  md: '# Chapter 12


    # Using The I2C Bus


    The I2C, standing for I-Squared-C or Inter IC, bus is one of the most useful ways
    of connecting moderately sophisticated sensors and peripherals to any processor.
    The only problem is that it can seem like a nightmare confusion of hardware, low-level
    interaction and high-level software. There are few general introductions to the
    subject first sight every I2C device is different, but there are shared principles
    that can help you work out how to connect and talk to a new device.


    The I2C bus is a serial bus that can be used to connect multiple devices to a
    controller. It is a simple bus that uses two wires: one for data and one for a
    clock. Despite there lots of problems in using the I2C bus, because it isn''t
    well standardized and devices can conflict and generally do things in their own
    way, it is still commonly used and too useful to ignore.


    The big problem in getting started with the I2C bus is that you will find it at
    many levels of detail, from the physical bus characteristics and protocol to the
    details of individual devices. It can be difficult to relate all of this together
    and produce a working project. In fact, you only need to know the general workings
    of the I2C bus, some general features of the protocol, and know the addresses
    and commands used by any particular device.


    To explain and illustrate these idea we really do have to work with a particular
    device to make things concrete. However, the basic stages of getting things to
    work, the steps, the testing and verification, are more or less the same irrespective
    of the device.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# I2C Hardware Basics


    The I2C bus is very simple from the hardware point of view. It has just two signal
    lines, SDA and SCL, the data and clock lines respectively. Each of these lines
    is pulled up by a suitable resistor to the supply line at whatever voltage the
    devices are working - 3.3V and 5V are common choices. The size of the pull-up
    resistors is not critical, 4.7K is typical as shown in the circuit diagram.


    You simply connect the SDA and SCL pins of each of the devices to the pull-up
    resistors. Of course, if any of the devices have built-in pull-up resistors you
    can omit the external resistors. More of a problem is if multiple devices each
    have pull-ups. In this case you need to disable all but one.


    ![](img/470d59c61482018b86da50823ee18a57_213_0.png)


    The I2C bus is an open collector bus. This means that it is actively pulled down
    by a transistor set to on. When the transistor is off, however, the bus returns
    to the high state via the pull-up resistor. The advantage of this approach is
    that multiple devices can pull the bus low at the same time. That is, an open
    collector bus is low when one or more devices pulls it low and high when none
    of the devices is active.


    The SCL line provides a clock which is used to set the speed of data transfer,
    one bit is presented on the SDA line for each pulse on the SCL line. In all cases,
    the master drives the clock line to control how fast bits are transferred. The
    slave can, however, hold the clock line if it needs to slow down the data transfer.
    In most cases the I2C bus has a single master device, the Pico in our case, which
    drives the clock and invites the slaves to receive or transmit data. Multiple
    masters are possible, but this is advanced and usually not necessary.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'All you really need to know is that communication usually occurs in 8-bit packets.
    The master sends a packet, an address frame, which contains the address of the
    slave it wants to interact with. Every slave has to have a unique address, which
    is usually 7 bits, but it can be 10 bits, and the Pico does support this. In the
    rest of this chapter we will use 7-bit addressing because it is commonly supported.


    One of the problems in using the I2C bus is that manufacturers often use the same
    address, or same of selectable addresses, and this can make using particular combinations
    of devices on the same difficult or impossible.


    The 7-bit address is set as the high-order 7 bits in the byte and this can be
    confusing as an address that is stated as 0x48 in the datasheet results in 0x80
    sent to the device. The low-order bit of the address signals a write or a read
    operation on whether it is a 0 or a 1 respectively. After sending an address frame
    it sends or receives data frames back from slave. There are also special signals
    used to mark the start and end of an exchange of packets, but the library functions
    take care of these.


    This is all you need to know about I2C in general to get started, but it is worth
    finding out more of the details as you need. You certainly will need them as you
    debug I2C programs.


    The clock SCL and SDA lines rest high. The master signals a Start Bit by pulling
    the SDA line down - S in the diagram below. The clock then pulled low by the master,
    during which time the SDA line can change state. The bit is in the middle of the
    following high period of the clock pulse B1, B2 and so on in the diagram. This
    continues until the last bit has been sent when the data line is allowed to rise
    while the clock is high, sending a stopP - P in the diagram. Notice that when
    data is transmitted the data line doesn''t change while the clock is high. Any
    change in the data line when the clock sends a start or a stop bit, i.e. clock
    high and falling data line is a start bit and clock rising data line is a stop
    bit:


    ![](img/470d59c61482018b86da50823ee18a57_214_0.png)


    The clock speed was originally set at 100kHz, standard mode, but then increased
    to 400kHz in fast mode. In practice, devices usually specify a maximum clock speed
    that they will work.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# The Pico I2C


    The Pico has two I2C controllers, I2C0 and I2C1, that can work as a master or
    slave. The connections from both controllers can be routed to different pins:


    | I2C0 | SDA | GP0 | GP4 | GP8 | GP12 | GP16 | GP28 |

    | --- | --- | --- | --- | --- | --- | --- | --- |

    | | SCL | GP1 | GP5 | GP9 | GP13 | GP17 | GP21 | |

    | I2C1 | SDA | GP2 | GP6 | GP14 | GP18 | GP22 | GP26 |

    | | SCL | GP3 | GP7 | GP11 | GP19 | GP27 | |


    To select a pin to operate as a SPI pin all you have to do is :

    `gpio_set_function(gpio, GPIO_FUNC_I2C)`

    For a full I2C interface, you need to set the mode of one pin for one SDA and
    one SCL. You should ensure that only one GPIO line is enabled for a particular
    I2C function. You also have to set the GPIO lines to pull-up or preferably provide
    an external pull-up resistor.


    # The I2C Functions


    There are I2C functions for initialization, configuration and for writing and
    reading to the registers. Let''s look at each group in turn.


    # Initialization


    There are two functions concerned with enabling and disabling the I2C bus:

    `uint i2c_init(i2c_inst *i2c, uint baudrate)`

    `i2c_deinit(i2c_inst *i2c)`


    You can use the `i2c_init` function to set the baud rate, i.e. the clock rate,
    in Hertz.


    It is worth noting at this point that the specification of the I2C controller
    is in terms of its hardware address rather an 0/1 index. A macro is provided so
    you can use `i2c0` and `i2c1` in place of the addressees. You can also use:


    ```

    static uint i2c_hw_index(i2c_inst *i2c)

    ```


    to convert a hardware address to a 0/1 index.

    You also need to add:

    `#include "hardware/i2c.h"

    and edit CMakeLists.txt to include:

    `target_link_libraries(myProject pico_stdlib hardware_i2c)`'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# Configuration


    There are a number of functions that you can use to configure the way the bus
    works.

    The i2ci_set_baudrate function is the best way of setting the baud rate because
    it returns the actual baud rate set, usually the closest clock rate.

    uint i2c_set_baudrate (i2c_inst_t *i2c, uint baudrate)

    The Pico doesn''t support the most recent high speed modes and the maximum clock
    rate is 1MHz.

    i2c_set_slave determines if the Pico will act as a master or slave. The default
    is master.

    ni2c_set_slave_mode (i2c_inst_t *i2c, bool slave, uint8_t addr)

    You also have to specify the address that the slave will respond to.


    # Write


    There are a number of very similar write functions in the SDK. The most basic
    is:

    int i2c_write_blocking (i2c_inst_t *i2c, uint8_t addr, const uint8_t *src, size_t
    len, bool nostop)


    The first parameter specifies the I2C hardware to use and the second gives a buffer
    of bytes to be sent and its length. The return value is the number of bytes written.

    The final parameter, nostop, needs some explanation. When you use this function
    it first sends an address, a byte containing the address of the device you specify.
    Notice that the 7-bit address will be shifted into the topmost bits and the first
    bit to be zeroed for a write operation. So when you write to a device with an
    address of 0x40, you will see 0x80 on a logic analyzer, ie 0x40<=1. After the
    address as many frames are specified in src and len.


    The final parameters control how the stop bit is sent or not. The usual write
    transaction is:

    START|ADDR|DATA0|ACK|

    DATA1|ACK|...

    DATAn|ACK|STOP


    Notice that it is the slave that sends the ACK bit, and if the data is not received
    correctly, it can send N instead. Also notice that there is a single STOP bit
    at the end of the transaction and this is if you set nostop to true the final
    stop bit is not sent and the next data transfer can continue as part of the same
    transaction.'
  merge: -1
  pgno: 216
- img_proc: true
  md: "Notice that multibyte transfer is quite different from sending single bytes\
    \ one at a time:\n\n| START| ADDR |ACK|DATA0|ACK|STOP |\n| START| ADDR |ACK|DATA1|ACK|STOP\
    \ |\n| START| ADDR |ACK|DATAn|ACK|STOP |\n\nNotice that there are multiple ADDR\
    \ frames the same as well as multiple START and STOP bits. What this means in\
    \ practice is that you have to look at a device's datasheet and send many bytes\
    \ it needs as a single operation. You cannot rely on being able to send the same\
    \ number of bytes broken into chunks.\n\nThe other functions work in the same\
    \ way but with slight variations. There are two which allow you to specify a timeout:\n\
    \n```\nint i2c_write_timeout_us (i2c_inst_t *i2c, uint8_t addr,\n            \
    \ const uint8_t *src, size_t len,\n             bool nostop, int timeout us)\n\
    int2c_write_blocking_until (i2c_inst_t *i2c, uint8_t addr,\n             const\
    \ uint8_t *src, size_t len,\n             bool nostop, absolute_time_t until)\n\
    ```\n\nThe first specifies the timeout in microseconds and the second will time\
    \ out when a time is reached.\n\nThe hardware also supports a 16-element buffer\
    \ on both receive and send. The standard functions make use of this by default\
    \ and hence return immediately if the buffers are not full. You can find the state\
    \ of the write buffer using:\n\n```\nstatic size_t i2c_get_write_available (i2c_inst_t\
    \ *i2c)\n```\n\nand you can send data to the buffer using:\n\n```\nint i2c_write_raw_blocking\
    \ (i2c_inst_t *i2c,\n             const uint8_t *src, size_t len)\n```"
  merge: -1
  pgno: 217
- img_proc: true
  md: '# Writing To A Register


    A very standard interaction between master and slave is writing data to a register.
    This isn''t anything special, and as far the I2C bus is concerned, you are simply
    writing raw data. However, datasheets and users tend to think in terms of reading
    and writing internal storage locations, i.e. registers in the device. In fact,
    many devices have lots of internal storage, indeed but some I2C devices, for example
    I2C EPROMS, are nothing but internal storage.


    In this case a standard transaction to write to a register is:


    +   1. Send address frame

    2. Send a data frame with the command to select the register

    3. Send a data frame containing the byte, or word, to be written to the register


    So, for example, you might use:


    ```

    uint8_t buf[]={registerAddress,data};

    int2c_write_blocking(i2c, addr,buf,2, false);

    ```


    Notice the command that has to be sent depends on the device and you have to look
    it up in its datasheet. Also notice that there is a single START and STOP at the
    beginning and end of the transaction.


    # Read


    The read functions are similar to the write functions. The most important is:

    int2c_read_blocking(i2c_inst t *i2c, uint8_t *dst, size_t len, bool nostop


    and the parameters mean the same things as for the corresponding writing function.
    this sends an address frame and reads as many bytes from the slave as specified.
    In the case of write, the address supplied is shifted up one bit and the lower-order
    bit set to 1 to indicate a read operation. So, if the current slave is at address
    0x40, the read reads a read address of 0x81 – this is important to remember if
    you are viewing the transaction on a logic analyzer.'
  merge: -1
  pgno: 218
- img_proc: true
  md: "The main problem with the simple read function is that, if the slave doesn't\
    \ send the data, it can block forever. There are two timeout functions:\n\n```\n\
    static int i2c_read_timeout_us (i2c_inst_t *i2c, uint8_t addr,\n             \
    \ uint8_t *dst, size_t len,\n              bool nostop, uint timeout_us)\nint\
    \ i2c_read_blocking_until (i2c_inst_t *i2c, uint8_t addr,\n              uint8_t\
    \ *dst, size_t len,\n              bool nostop, absolute_time_t until)\n```\n\n\
    The first will time out after the specified number of microseconds and the\nsecond\
    \ times out when the time is reached.\n\nThe read channel has a 16-element buffer\
    \ and you can determine how many\nfree entries there are using:\n\n```\nstatic\
    \ size_t i2c_get_read_available (i2c_inst_t *i2c)\n you can send data directly\
    \ to the buffer using:\ni2c_read_raw_blocking (i2c_inst_t *i2c, uint8_t *dst,\
    \ size_t len)\n```\n\nThe read transaction is:\n\n```\nSTART|ADDR|ACK|DATA0|ACK|\n\
    \           |DATA1|ACK|\n           |DATA2|ACK|\n           ...\n           |DATA|NAK|STOP\n\
    ```\n\nThe master sends the address frame and the slave sends the ACK after the\n\
    address to acknowledge that it has been received and it is ready to send data.\n\
    Then, the slave sends bytes, one at a time, and the master sends ACK in\nresponse\
    \ to each byte. Finally, the master sends a NAK to indicate that the last\nbyte\
    \ has been read and then a STOP bit. That is, the master controls how\nmany bytes\
    \ are transferred.\n\nAs in the case of the write functions, a block transfer\
    \ of n bytes is different\nfrom transferring n bytes one at a time and you can\
    \ suppress the final stop bit\nby setting nostop to true."
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Reading A Register


    As for writing to a register, reading from a register is a very standard operation,
    but it is slightly more complicated in that you need both a write and read operation.
    That is, to read a register you need a write operation to send the address of
    the register to the device and a read operation to get the data that the device
    sends as the contents of the register. For example, you would use something like:


    ```

    char buf[]={registerAddress};

    i2c_write_blocking(i2c, 0x04, buf, 1, false);

    i2c_read_blocking(i2c, 0x04, buf, 1, false);

    ```


    If the register sends multiple bytes then you can usually read these one after
    another as a block transfer without sending an address frame each time. Notice
    that we do not suppress the stop between the read and the write to make it a single
    transaction.


    In theory, and mostly in practice, a register read of this sort can work with
    stop-start separating the write and the read operation, which is what you get
    if you use separate write and read function calls without suppressing the stop
    bit. That is, the transfer sequence is:


    ```

    START| ADDR| ACK| REGADDR|ACK|STOP|

    START| ADDR| ACK| DATA1| ACK|

    DATA2| ACK|

    ...

    DATA1| NAK|STOP

    ```


    If you look at the end of the write and the start of the read using a logic analyzer,
    you will see that is a STOP and START between them.


    ![](img/470d59c61482018b86da50823ee18a57_220_0.png)


    For some devices this is a problem. A STOP is a signal that another transaction
    can start and might allow another master to take over the bus. To avoid some devices
    demand a repeated START bit between the write and read no STOP bit. This is referred
    to as a “repeated start bit” or a “restart” transaction.'
  merge: -1
  pgno: 220
- img_proc: true
  md: "The sequence for a repeated start bit register read:\nSTART|ADDR|ACK|REGADDR|ACK|\n\
    START|ADDR|ACK|DATA0|ACK|\n... \nDATA1|ACK|\n|DATAn|NAK|STOP\n\nThat there is\
    \ only one STOP bit.\nIn theory, either form of transaction would work, but in\
    \ practice you will find that some slave devices state that they need a repeated\
    \ start and no stop bits in continued transactions. In this case you need to be\
    \ careful how you send and receive data. For example, to read a register from\
    \ a device that requires START bits but no STOP bit you would use:\n\n```\nchar\
    \ buf[]=registerAddress;\ni2c write blocking(i2c0, 0x40, buf, 1, true);\ni2c_read_blocking(i2c0,\
    \ 0x40, buf, 1, false);\n```\n\nYou can see in the logic analyzer display that\
    \ there is just a single START bit between the write and the read.\n\n![](img/470d59c61482018b86da50823ee18a57_221_0.png)\n\
    \nVery few devices need a repeated start transaction. The documentation mentions\
    \ the MLX90620 IR array, but this is hardly a common peripheral. Practically it\
    \ doesn't make any difference if you send a stop bit in the middle of a write/read\
    \ transaction, but you need to know about it just in case.\n\n# Slow Read Protocols\n\
    \nThe I2C clock is mostly controlled by the master and raises the question of\
    \ how we cope with a slave that can respond to a request for data.\nThere are\
    \ two broad approaches to waiting for data on the I2C bus. The first is simply\
    \ to request the data and then perform reads in a polling loop. If the device\
    \ isn't ready with the data, then it sends a data frame with a NAK bit set."
  merge: -1
  pgno: 221
- img_proc: true
  md: 'In this case the SDK read function returns a negative error value rather than
    the number of bytes read. So all we have to do is test for a negative response.
    Of course, the polling loop doesn''t have to be "tight". The response time is
    often long enough to do other things and you can use the I2C bus to work with
    other slave devices which you activated on trying to get the data you requested.
    All you have to do is to remember its data at some later time.


    The second way is to allow the slave to hold the clock line after the master has
    released it - so called "clock stretching". In most cases the master will simply
    wait before moving to the next frame while the clock line is held now. This is
    very simple and it means you don''t have to implement a polling loop, but also
    notice that your program is frozen until the slave releases the clock line.


    Many devices implement both types of slow read protocol and you can use whichever
    quits your application.


    # A Real Device


    Using an I2C device has two problems - the physical connection between master
    and slave and figuring out what the software has to do to make it work. Here we''ll
    work with the HTU21D/Si7021 and the information in its datasheet to make a working
    temperature humidity sensor using the I2C functions we''ve met.


    ![](img/470d59c61482018b86da50823ee18a57_222_0.png)


    First the hardware. The HTU21D Humidity and Temperature sensor is one of the easiest
    I2C devices to use. Its only problem is that it is only available as a surface-mount
    package. To overcome this you could solder some wires onto the pads or buy a general
    breakout board. However, it is much simpler to buy the HTU21D breakout board because
    this has easy connections and built-in pull-up resistors. The HTU21D has been
    replaced by the Si7021, which is more robust than the original and works in the
    same way, but the HTU21D is still available from many sources.'
  merge: -1
  pgno: 222
- img_proc: true
  md: 'If you decide to work with some other I2C device you can still follow the steps
    given, modifying what you do to suit it. In particular, if you select a device
    that only works at 5V you might need a level converter.


    Given that the HTU21D has pull-up resistors you don''t need to enable the onboard
    pull-ups provided by the Pico. If you notice any irregularity in the signal at
    higher frequencies adding some additional pull-ups might help.


    You can use a prototype board to make the connections and this makes it easier
    to connect other instruments such as a logic analyzer. Given that the pinouts
    vary according to the exact make of the device, you need to compare the suggested
    wiring with the breakout board you are actually using.


    ![](img/470d59c61482018b86da50823ee18a57_223_0.png)


    | Pico | HTU21 |

    |---||

    | SDA GP4 pin 6 | SDA/DA |

    | SCK GP5 pin 7 | SCL/CL |

    | 3.3v pin 36 | VCC/VIN/+ |

    | GND pin 38 | GND/- |'
  merge: -1
  pgno: 223
- img_proc: true
  md: "# First Program\n\nAfter wiring up I2C device, the first question that needs\
    \ to be answered is, does it work? Unfortunately for most complex devices finding\
    \ out if it is a multi-step process. Our first program aims to read some data\
    \ back from the HTU21D, any data will do. \n\nIf you look at the datasheet you\
    \ will find that the device address is 0x40 and it supports the following commands/registers:\n\
    \n| Command | Code | Comment |\n| --- | --- | --- |\n| Trigger Temperature Measurement\
    \ | 0xE3 | Hold master |\n| Trigger Humidity Measurement | 0xE5 | Hold master\
    \ |\n| Trigger Temperature Measurement | 0xF3 | No Hold master |\n| Trigger Humidity\
    \ Measurement | 0xF5 | No Hold master |\n| Write user register | 0xE6 | |\n| Read\
    \ user register | 0xE7 | |\n| Soft Reset | 0xFE | |\n\nThe easiest of these to\
    \ get started is with the Read user register command.\nThe user register gives\
    \ the current setup of the device and can be used to set the resolution of the\
    \ measurement.\n\nNotice that the codes that you send to the device can be considered\
    \ as addresses or commands. In this case you can think of sending 0xE7 as a command\
    \ to read the register or the read address of the register, it makes no difference.\
    \ In most cases, the term \"command\" is used when sending the code makes the\
    \ device do something, and the term \"address\" is used when it simply makes the\
    \ device read or write specific data.\n\nTo read the user register we have to\
    \ write a byte containing 0xE7 and then read the device sends back. This involves\
    \ sending an address frame, a data frame, and then another address frame and reading\
    \ a data frame. The device seems to be happy if you send a sort bit between each\
    \ transaction or a new start bit.\n\nA program to read the user register is fairly\
    \ to put together. The address of the device is 0x40, so its write address is\
    \ 0x80 and its read address is 0x81. Recall that bus addresses are shifted one\
    \ bit to the left and the base address is the write address and the read address\
    \ is base+1."
  merge: -1
  pgno: 224
- img_proc: true
  md: "The I2C functions adjust the address as needed, we simply use 0x40 as the device's\
    \ address, but it affects what you see if you sample the data being exchanged\
    \ (remember to add hardware_i2c to the CMakeLists.txt file):\n\n```\n#include\
    \ <stdio.h>\n#include <pico/stdlib.h>\n#include <hardware/i2c.h>\n```\n\n```\n\
    int main() {\n    stdio_init_all();\n    i2c_init(i2c0, 100 * 1000);\n    gpio_set_function(4,\
    \ GPIO_FUNC_I2C);\n    gpio_set_function(5, GPIO_FUNC_I2C);\n    uint8_t buf[]\
    \ = {0xE7};\n    i2c_write_blocking(i2c0, 0x40, buf, 1, false);\n    i2c_read_blocking(i2c0,\
    \ 0x40, buf, 1, false);\n    printf(\"User Register = %X \\r\\n\", buf[0]);\n\
    }\n```\n\nThis sends the address frame 0x80 and then the data byte 0xE7 to select\
    \ the user register. Next it sends an address frame 0x81 to read the data.\n\n\
    If you run the program you will see:\n\nRegister = 2\n\nThis is the default value\
    \ of the register and it corresponds to a resolution of 12 bits for the humidity\
    \ and temperature respectively and a supply voltage greater than 2.25V.\n\n# The\
    \ I2C Protocol In Action\n\nIf you have a logic analyzer that can interpret the\
    \ I2C protocol connected, what you will see:\n\n![](img/470d59c61482018b86da50823ee18a57_225_0.png)"
  merge: -1
  pgno: 225
- img_proc: true
  md: 'You can see that the write_byte function sends an address packet set to the
    device''s 7-bit address 0x40 as the high-order bits with the low-order bit set
    to zero to indicate a write, i.e 0x30. After this you get a data packet sent containing
    0xE7, the address of the register. After a few microseconds it sends the address
    frame again, only this time with the low-order bit set to 1 to indicate a read.
    It receives back a single byte of data from the device, 0x02. Also notice the
    start and stop bits at the end of each byte.


    This all demonstrates that the external device is working properly and we can
    move on to getting some data of interest.


    # Reading The Raw Temperature Data


    Now we are coming to read one of the quantities that the device measures temperature.
    If you look back at the command table you will see that there are two possible
    commands for reading the temperature:


    | Command | Code | Comment |

    |---|---||

    | Trigger Temperature Measurement | 0xE3 | Hold master |

    | Trigger Temperature Measurement | 0xF3 | No Hold master |


    What is the difference between Hold master and No Hold master? This was discussed
    earlier in a general context under the Slow Read Protocols. The device cannot
    read the temperature instantaneously and the master can either opt to be held
    waiting for the data, i.e. Hold master, or released to do something else and poll
    for the data until it is ready, i.e No Hold master.'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'Hold master option works by allowing the device to stretch the clock line low
    after the master has released it. In this mode the master will wait until the
    device releases the line. Not all masters support this mode, but the Pico does
    and makes it the simpler option. To read the temperature using the Hold master
    mode you simply send 0xE3 and then read three bytes. The simplest program that
    will work is:


    The buffer is unpacked into three variables with more meaningful names: msb -
    most significant byte, lsb - least significant byte, check - checksum

    If you try this you should find that it works and it prints something like:

    msb 97

    lsb 232

    checksum 217

    with the temperature in the 20°C range.


    The logic analyzer reveals what is happening. First we send the usual address
    frame and write 0xE3. Then, after a pause, the read address frame is sent and
    the clock line is held low by the device (lower trace):

    The clock line is held low by the device for over 42ms while it gets the data
    ready. It is released and the three data are:


    ![](img/470d59c61482018b86da50823ee18a57_227_0.png)'
  merge: -1
  pgno: 227
- img_proc: true
  md: "This response is a long way down the logic analyzer trace to keep scrolling\
    \ until you find it.\n\n![](img/470d59c61482018b86da50823ee18a57_228_0.png)\n\n\
    Notice that we suppress the stop bit between the write and the read to make a\
    \ single transaction.\n\n# # Processing The Data\n\nOur next task isn't really\
    \ related to the problem of using the I2C bus, but it is a very typical next step.\
    \ The device returns the data in three bytes, but the way that this data relates\
    \ to the temperature is not simple.\n\nIf you read the datasheet you will discover\
    \ that the temperature data is the 14-bit value results from putting together\
    \ the most and least significant bits and zeroing the bottom two bits. The bottom\
    \ two bits are used as status bits, bit zero currently isn't used and bit one\
    \ is a 1 if the data is a humidity measurement and a 0 if it is a temperature.\n\
    \nTo put the two bytes together we use:\n\n```\nunsigned int data6=((unsigned\
    \ int ins) << 8) | (lsb & 0FC);\n```\n\nThis zeros the bottom two bits, shifts\
    \ the msb up eight bits and ORs the two together. The result is a 16-bit temperature\
    \ value with the bottom two bits zeroed. We have a raw temperature value but we\
    \ still have to convert it to standard units. The datasheet gives you the formula:\n\
    \nTemperature in °C = -46.85 + 175.72 * data6 / 216\n\nThe only problem in implementing\
    \ this works out 2^n. You can work out 2° with the exponent 1<<x, i.e. shift 1\
    \ x to the right.\n\nThis gives:\n\n```\nfloat temp = (float)(-46.85 + 175.72\
    \ * data6 / (float(1<<x)));\n```\n\nAs 2^n is a constant that works out to 65536\
    \ it is more efficient to write:\nfloat temp = (float)(-46.85 +(175.72 /(float)65536));\n\
    \nNow all we have to print the temperature:\n\n```\nprintf(\"Temperature %f \n\
    \\r\", temp);\n```\n\nThe full listing is at the end of this chapter."
  merge: -1
  pgno: 228
- img_proc: true
  md: "# Reading Humidity\n\nThe nice thing about I2C and using a particular I2C device\
    \ is that it gets easier. Once you have seen how to do it with one device, the\
    \ skill generalizes and, once you you know how to deal with a particular device,\
    \ other aspects of the device are usually similar.\n\nWhile clock stretching is\
    \ simple it sometimes doesn't work with some slave master combinations. It is\
    \ worth knowing the alternative method works. For this reason let's implement\
    \ the humidity reading by polling. We also find out to use the No Hold mode of\
    \ reading the data, which is sometimes useful.\n\nWe write the 0xF5 to the slave\
    \ and then repeatedly to read the three-byte response. If the slave isn't ready\
    \ it simply returns a NAK which the SDK function signals by returning a negative\
    \ error value:\n\n```\nbuf[0] = 0xF5;\ni2c_write_blocking(i2c0, 0x40, buf, 1,\
    \ true);\nwhile (i2c_read_blocking(i2c0, 0x40, buf, 3, false) < 0)\n{\n    sleep_ms(1);\n\
    }\n```\n\nThis polls repeatedly until the slave returns an ACK, when the data\
    \ is loaded into the buffer. Once we have the data, the formula to convert the\
    \ 16-bit value to percentage humidity is:\n\nRH= -6 + 125 * data16 / 216\n\nPutting\
    \ all together, and reusing some variables from the previous parts of the program,\
    \ we have:\n\n```\nbuf[0] = 0xF5;\ni2c_write_blocking(i2c0, 0x40, buf, 1, true);\n\
    while (i2c_read_blocking(i2c0, 0x40, buf, 3, false) < 0)\n{\n    sleep_ms(1);\n\
    }\nmsb = buf[0];\nlsb = buf[1];\ncheck = buf[2];\nprintf(\"msb %d\\n\\r lsb %d\\\
    n\\r checksum %d\\n\\r\", msb, lsb, check);\n```\n\n```\ndata16 = ((unsigned int)msb\
    \ << 8) | (unsigned int)(lsb & 0xFC);\nfloat hum = -6 + ((float)data16) / 65536;\n\
    printf(\"Humidity %f %\\n\\r\", hum);\n```\n\nThe only unusual part of the program\
    \ is using % to print a single % character, which is necessary because % means\
    \ something in printf. We also need to implement the crcCheck function."
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Checksum Calculation


    Although computing a cyclic redundancy checksum, CRC, isn''t specific to I2C,
    it is another common task. The datasheet explains that the polynomial used is:


    ```

    X^8+X^2+X+1

    ```


    Once you have this information you can work out the divisor by writing a binary
    number with a one in each location corresponding to a power of X in the polynomial.
    In this case the 8th, 5th and 1st bit. Hence the divisor is:


    ```

    0x0131

    uint32_t data32 = ((uint32_t)msb << 16) |

    ((uint32_t)lsb << 8) | (uint32_t) check;

    ```


    What you do next is roughly the same for all CRCs. First you put the data that
    was used to compute the checksum together with the checksum value as the low-order
    bits:


    Now you have three bytes, 24 bits in a 32-bit variable. Next adjust the divisor
    so that its most significant non-zero bit aligns with the significant bit of the
    three bytes. As this divisor has a 1 at bit, it needs to be shifted 15 bits to
    the right to move it to the 24th bit:


    ```

    uint32_t divisor = ((uint32_t) 0x0131 <<15);

    ```


    Now that you have both the data and the divisor aligned, you step through the
    topmost 16 bits, i.e. you don''t process the lower-order bits which hold the received
    checksum. For each bit you check to see if it is a 1. If you replace the data
    with the data XOR divisor. In either case you shift the divisor one to the right:


    ```

    for (int i = 0; i < 16; i++){

    if(data32 & (uint32_t)1<<(23 - i ))data32=data32 ^ divisor;

    disor=divisor>> 1;

    }

    ```


    When the loop ends, there is no error, the data32 should be zeroed and the received
    checksum is correct as computed on the data received.


    ```

    A complete function to compute the checksum, with some optimization:

    uint8_t crcCheck(uint8_t msb, uint8_t lsb, uint8_t check){

    uint32_t data32 = ((uint32_t)msb << 16)|((uint32_t) lsb << 8]);

    (uint32_t) check;

    ```


    ```

    uint32_t divisor = 0x988000;

    for (int i = 0; i < 16; i++) {

    if(data32 & (uint32_t)1<<(23 - i )) data32 ^= divisor;

    disor>>= 1;

    return (uint8_t) data32;

    }

    ```


    It is rare to get a CRC error on an I2C bus unless it is overloaded or subject
    to a lot of noise.'
