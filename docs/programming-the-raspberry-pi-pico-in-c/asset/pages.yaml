  md: '# Chapter 14


    # The DHT22 Sensor

    Implementing A Custom Protocol


    In this chapter we make use of all the ideas introduced in earlier chapters to
    create a raw interface with the low-cost DHT11/22 temperature and humidity sensor.
    It is an exercise in implementing a custom protocol directly in C using bit banging
    and then using the PIO. Given the document advises against using it, you might
    be wondering why we start with bit banging? The answer is that bit banging is
    easier to debug and it is usually a good idea to implement it first if possible,
    if only to prove that the device in question works and you know how it works.


    # The DHT22


    The DHT22 is a more accurate version of the DHT11 and it is used in this project.
    The software will work with both versions and also with the AM2302, which is equivalent
    to the DHT22.


    Model AM2302/DHT22

    Power supply 3.3-5.5V DC

    Output digital signal via 1-wire bus

    Sensing element Polymer humidity capacitor

    Operating range

    humidity 0-100%RH;

    tperature ~40~80Celsius

    Accuracy

    humidity +-2%RH(Max +-5%RH);

    tperature +-0.5Celsius

    Resolution or sensitivity

    humidity 1%RH;

    tperature 0.1Celsius

    Repeatability

    humidity +-1%RH;

    tperature +-0.2Celsius


    ![](img/470d59c61482018b86da50823ee18a57_260_0.png)


    The device will work at 3.3V and it makes use of a 1-wire open collector-style
    bus, which makes it very easy to make the physical connection to the Pico.'
  merge: -1
  pgno: 260
- img_proc: true
  md: 'The 1-wire bus used isn''t standard and is only used by this family of devices,
    so we have little choice but to implement the protocol in C.


    ![](img/470d59c61482018b86da50823ee18a57_261_0.png)


    The pinouts are:


    +   1. VDD

    2. SDA serial data

    3. not used

    4. GND


    and the standard way of connecting the device is:


    ![](img/470d59c61482018b86da50823ee18a57_261_1.png)


    Although the recommended pull-up resistor is 1K, a higher value works better with
    the Pico - typically 4.7K, but larger will work.'
