  md: "Alternatively you can set an interrupt to send or receive data when the hardware\
    \ is ready. For example to read data using an interrupt, the equivalent polling\
    \ loop in the last example, the interrupt handler simply has to read the data\
    \ until there is no more and return:\n\n```\nvoid uartIRQ() {\n    uint8_t RecData;\n\
    \    while (uart_is_readable(uart1)) {\n        uart_blocking(uart1, &RecData,\
    \ 1);\n        printf(\"%c\", RecData);\n    }\n}\n```\n\nSetting up the handler\
    \ is just a matter of three lines of code:\nirq_set_exclusive_handler(UART1_IRQ,\
    \ uartIRQ());\nirq_set_enabled(UART1_IRQ, true);\nuart_set_irq_enables(uart1,\
    \ true, false);\n\nAfter this the interrupt handler is called every time there\
    \ is at least one character waiting to be read.\n\n# Reading and Writing Characters\
    \ and Strings\n\nIn the previous examples we have used a byte array to read and\
    \ write data. A more basic method of working is to read and write a single character\
    \ at a time. The functions:\n\n```\nuart_putc(uart_inst_t *uart, char c)\nstatic\
    \ char uart_getc(uart_inst_t *uart)\n```\n\nread and write a single character\
    \ or byte. They are simply more equivalent to the usual blocking read or write\
    \ functions. There is also:\nuart_putc_raw(uart_inst_t *uart, char c)\n\nwhich\
    \ puts a character without applying carriage return line feed translation. Some\
    \ systems need a carriage return to start to a new line and a line feed. You can\
    \ set automatic translation of line feed for carriage return using:\nvoid uart_set_translate_crlf(uart_inst_t\
    \ *uart, bool translate)\n\nA bigger problem for which there is no easy solution\
    \ is that some systems need a line feed and carriage return for a new line.\n\n\
    So far we have used read and write and put to work with arrays and characters.\
    \ There is also a function that allows you to work with strings. Recall that a\
    \ C string is just a byte or character array that is null- or zero-"
