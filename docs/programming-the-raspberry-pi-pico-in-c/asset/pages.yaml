- img_proc: true
  md: "There is still going to be the occasional unexplained crash and in this case\
    \ the best solution is to use the soft reset command introduced earlier. It is\
    \ also worth mentioning that the server program as presented does not actually\
    \ handle multiple simultaneous connections. It has to finish dealing with one\
    \ connection before it can deal with a second. To make it deal with multiple connections\
    \ would mean checking for another connection while processing the first.\n\n#\
    \ Complete Listing Of Web Server\n\nThe following listing also includes all of\
    \ the functions presented in the chapter even if they aren't used.\n\n```\n#include\
    \ <stdio.h>\n#include \"pico/stdlib.h\"\n#include \"hardware/gpio.h\"\n#include\
    \ <string.h>\n#define Debug true\nint initWiwif() {\n    uart_init(uart1, 115200);\n\
    \    gpio_set_function(4, GPIO_FUNC UART);\n    gpio_set_function(5, GPIO_FUNC\
    \ UART);\n    uart_set_format(uart1, 8, 1, UART_PARITY_NONE);\n\n    uart_set_translate_crlf(uart0,\
    \ true);\n    sleep_ms(100);\n    return 0;\n}\nint getBlock(uint8_t buf[], int\
    \ len) {\n    int count = 0;\n    while (count < len - 1) {\n        if (uart_is_readable_within_us(uart1,\
    \ 10000)) {\n            buf[count++] = uart_getc(uart1);\n            if (Debug)\
    \ {\n                uart_putc(uart0, buf[count - 1]);\n            }\n      \
    \  } else {\n            break;\n        }\n    }\n    buf[count] = 0;\n    return\
    \ count;\n}\n```"
