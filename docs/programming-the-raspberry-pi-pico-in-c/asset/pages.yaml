- img_proc: true
  md: '# Summary


    +   - The 1-Wire bus is a proprietary, widely-used, bus. It is simple and very
    capable.


    +   - As its name suggests it makes use of a single data wire and usually a power
    supply and ground.


    +   - It is possible to dispense with the power line and the connected device
    will draw power from the data line.


    +   - Implementing the 1-Wire protocol is mostly a matter of getting the timing
    right.


    +   - There are three types of interaction: presence pulse, read and write.


    +   - The presence pulse sensor simply asks any connected devices to reply and
    make themselves known.


    +   - The 1-Wire protocol is easier to implement than you might think because
    each bit is sent as a "slot" and while timing is critical within the slot, how
    fast slots are sent isn''t and the master is in control of when this happens.


    +   - The DS18B20 temperature sensor is one of the most commonly encountered 1-Wire
    bus devices. It is small, low-cost and you can use multiple devices on a single
    bus.


    +   - After a convert command is sent to the device, it can take 750ms before
    reading is ready.


    +   - To test for data ready you have to poll on a single bit. Reading a zero
    means data not ready and reading a one means data ready.


    +   - When the data is ready you can read the scratchpad memory where data is
    stored.


    +   - The DS18B20 has other commands that can be used to set temperature alarms
    etc, but these are rarely used.


    +   - With a shift in viewpoint it is just possible to squeeze a 1-Wire protocol
    into a 32 instruction PIO program.'
  merge: -1
