- img_proc: true
  md: 'In this case holding the button for 2s registers a “held” – the LED flashes
    10 times and anything less is a “push” – the LED flashes just once. Notice the
    1ms debounce pause between the test for no-press and press. One of the problems
    with all of these sample programs is that they wait for the button to be pressed
    or held and this makes it difficult for them to do anything else. You have to
    include whatever your programs need to do within the loop that waits for the button
    – the polling loop. You can do this in an ad hoc way, but the best approach is
    to implement a finite state machine, see later.


    # Serial Data


    In the next project we need to gather some data and the simplest way of doing
    this is to use a serial connection between the Pico and the host machine. This
    topic is covered in detail in Chapter 16. If you have any problems making this
    work, read the section on setting up the UART. This is the short version and it
    should “just work”.

    Pico has a dual UART connected to pins 1 GP0 TX and pin 2 GP1 RX. You simply need
    to connect the RX/TX pins to the corresponding TX/RX pins on the host machine.
    In the case of a machine that doesn’t have a serial port that can work at 3.3V
    you need an adapter – usually a USB to serial adapter. If you are using a Raspberry
    Pi 4 as the development system you can simply connect the Pico’s GPIO lines to
    the Pi’s:


    | Raspberry Pi | Raspberry Pico |

    |---|--|

    | GND (Pin 14) | GND (Pin 3) |

    | GPIO15 (UART RX0, Pin 10) | GP0 (UART0, Pin 1) |

    | GPIO14 (UART TX0, Pin 8) | GP1 (UART0, Pin 2) |


    If you have already connected the Pico and the Pi by the SW interface you don’t
    need to connect the GND. If you are only interested in transmitting data from
    the Pico you only need to connect Pin 1 and Pin 10.


    ![](img/470d59c61482018b86da50823ee18a57_84_0.png)'
  merge: -1
  pgno: 84
- img_proc: true
  md: "The hardware setup is simple but you also need to use the:\n\nsudo raspi-config\n\
    \nto set up the serial port on the Pi. Select Interfaces and then disable the\
    \ Linux shell and enable the serial port. The system will reboot. After this you\
    \ can use serial0 to communicate with devices connected to the serial port.\n\n\
    To make the connection use:\n\n```\nsudo minicom -b 115200 -D /dev/serial0\n```\n\
    \nNotice that you can do this in a terminal window in VS Code which is the best\
    \ way to work.\n\n# How Fast Can We Measure?\n\nButtons are one form of input,\
    \ but often we want to read data from a GPIO line driven by an electronic device\
    \ and decode the data. This usually means measuring the width of the pulses and\
    \ this raises the question of how fast we accept input?\n\nThe simplest way to\
    \ find out quickly we can take a measurement is to perform a pulse width measurement.\
    \ Applying a square wave to GP22 we can measure the time that the pulse is high\
    \ using:\n\n```\n#include <stdio.h>\n#include \"pico/stdlib.h\"\n\nint main()\
    \ {\n    stdio_init_all();\n    gpio_set_function(22, GPIO_FUNC_SIO);\n    gpio_set_dir(22,\
    \ false);\n    uint64_t t;\n\n    while (true) {\n        while (gpio_get(22)\
    \ == 1) {}\n        while (gpio_get(22) == 0) {}\n        t = time_us_64();\n\
    \        while (gpio_get(22) == 1) {\n            t = (uint64_t)(time_us_64()\
    \ - t);\n            printf(\"%llu\\n\", t);\n            sleep_ms(1000);\n  \
    \      }\n    }\n}\n```\n\nThis might look a little strange at first. The inner\
    \ while loops are responsible for getting us to the right point in the waveform.\
    \ We first loop until the line goes low, then we loop high again and finally measure\
    \ how long"
  merge: -1
  pgno: 85
- img_proc: true
  md: "before it goes low. You might think that we simply have to wait for it to go\
    \ high and then measure long till it goes low, but this misses the possibility\
    \ that the signal might be part way through a high period when we first measure\
    \ it. This can be measured down to around 1 microsecond with an accuracy of 0.5µs\
    \ with the accuracy poor at the low end of the range.\n\nNotice that in either\
    \ case if you try measuring widths much shorter than the lower limit that works,\
    \ you will get results that look longer pulses being applied. The reason is simply\
    \ that the Pico will miss the first transition to zero but will detect a second\
    \ or third or later transition. This is the digital effect of the aliasing effect\
    \ found in the Fourier Transform or general signal processing.\n\n# The Finite\
    \ State Machine\n\nIf you are working with an application that requires you to\
    \ deal with a complex set of input and output lines then you need an organizing\
    \ principle to save you from the complexity. When you first start writing IoT\
    \ programs that respond to the world outside you discover that all of your programs\
    \ take a simple form:\n\n```\nfor{\n  wait for some input lines\n  process the\
    \ input data\n  write some output lines\n  wait for some input lines\n  read some\
    \ more input lines\n  write some output lines\n}\n```\n\nFor most programmers\
    \ this is a slightly disturbing discovery because programs are not proposed to\
    \ consist of infinite loops, but IoT programs nearly always, in principle if not\
    \ in practice, take the form of an apparently infinite polling loop. A second,\
    \ and more important, aspect is that the way in which reading and writing GPIO\
    \ lines is related can be so complex that it can be difficult to see exactly when\
    \ any particular line is read and when it is written.\n\nIt is natural to try\
    \ to find implementations that make this simpler. In most cases, programmers discover\
    \ or invent the idea of the event or, better, the interrupt. In this case when\
    \ something happens in the outside world a function is automatically called to\
    \ deal with it and the relation between the external state and the system's response\
    \ is seemingly well-defined. Of course, in practice it isn't, as you have to deal\
    \ with what happens when multiple events or interrupts occur at the same, or very\
    \ nearly the same, time."
  merge: -1
  pgno: 86
- img_proc: true
  md: 'Often more sophisticated approaches are used to try and handle more external
    changes of state in a given time. Somehow the infinite polling loop is seen as
    wasteful. What is the CPU doing if it spends all its time looping round waiting
    for something to happen? Of course, if it has nothing better to do then it is
    not a waste. If IoT devices are dedicated to just getting one job done so the
    “polling is wasteful” meme, so prevalent in the rest of computing, is completely
    unjustified.


    What is more, the polling loop is usually the way to get the greatest throughput.
    If a processor can handle X state changes per second and respond to them with
    Y state changes per second, moving to an event- or interrupt-based implementation
    reduces both X and Y. In short, if a processor cannot do the job using a polling
    loop then it cannot do the job. This is not to say that there are no advantages
    to events and interrupts – are, but they do not increase throughput.


    So how you organize a polling loop so that it does is self-evident looking at
    the code?


    There are many answers to this the system being implemented and there are no “pure”
    theoretical answers that solve all problems, but the finite state machine, or
    FSM, is a model every IoT programmer should know.


    A finite state machine is very simple. At any time the machine/program has a record
    of the current state S. At a regular interval the external world provides an input
    I which changes the state from S to S'' and produces an output O. That''s all
    there is a finite state machine. There are variations on the definition of the
    FSM by this one, a Mealy machine because its outputs depend on both its state
    and input, is most suitable for IoT programming.


    ![](img/470d59c61482018b86da50823ee18a57_87_0.png)


    You can design an FSM with the help of a diagram. In the FSM shown we have three
    states 1, 2 and 3 if you are in state 1 an input of A moves the system to state
    2 and an input of B moves it into state 3.'
  merge: -1
  pgno: 87
- img_proc: true
  md: "Your program simply needs to take the form of a polling loop that implements\
    \ a finite state machine. It reads the input lines as I and uses this and the\
    \ current state S to determine the new state S' and the output O. There is some\
    \ overhead in using this organization, but it is usually worth. Notice that this\
    \ organization implies that you read input once, make changes and set outputs\
    \ once in the loop. If you fix that the polling loop takes then you know the characteristic\
    \ time for any changes to the system.\n\n# FSM Button\n\nAs an example, let's\
    \ implement the simple button earlier in the chapter. The first version used multiple\
    \ loops to wait for changes in the state of the input line. The finite state version\
    \ uses only a single polling loop:\n\n```\n#include <stdio.h>\n#include <pico/stdlib.h>\n\
    \nint main() {\n    stdio_init_all();\n    gpio_set_function(22, GPIO_FUNC_SIO);\n\
    \    gpio_set_dir(22, false);\n    uint64_t s = 0;\n    int i;\n    int count=0;\n\
    \    while (true) {\n        i = gpio_get(22);\n        t = time_us(64) + 100;\n\
    \        switch (s) {\n            case 0: //button not pushed\n            if\
    \ (i) {\n                    s = 1;\n                    count++;\n          \
    \          printf(\"Button Push %d\\n\\r\",count);\n                }\n      \
    \          break;\n            case 1: //Button pushed\n            if (!i) {\n\
    \                    s = 0;\n                }\n                break;\n     \
    \       default:\n                s = 0;\n        }\n        sleep_until((absolute_time_t){t});\n\
    \    }\n}\n```"
  merge: -1
  pgno: 88
- img_proc: true
  md: 'This looks more complicated than the original, and there are more lines of
    code, but it is much easier to extend to more complex situations. In this case
    we have only two states - s = 0 for button not pushed and s = 1 for button pushed.
    Ideally states that we use shouldn''t refer to inputs or outputs, but to the overall
    state of the system. For example, if you were using a Pico to control a neural
    reactor you might use a state "CoreMeltdown" States should be about the consequence
    of the inputs and the output to be the consequence of the current state. In the
    example above the inputs and output are simple to give rise to an abstract of
    "state". Even if you were to change the state labels to "LEDOn" or "LEDOf" they
    are directly related to the state of a single output line.


    The key idea, however, is that the states indicate the state of the system at
    the time of the input. That is, s = 0 (button not pushed) is the state when the
    system reads in a GPIO line pulled low so pushing the button makes it go high).
    You can see at the start of the polling loop we read the input line and store
    its value depending on the current state. You can see that if s = 0, i.e. button
    not pushed, then the next statement is used to process the input and Next, the
    state moves to s = 1, i.e. button pushed, and a message is printed depending on
    the number of times the button has been pressed as a simple action. In general,
    the action could be setting a GPIO line or doing anything that is appropriate
    for the new state. Notice that actions occur on change state.


    If the state is in s = 1, i.e. button pushed, then the input has to be 0 and any
    actions that are needed to take the state changes from state 1 to state 0 are
    performed – none in this case. Finally, if the state is anything other than 0
    or 1, we set it to  as something is wrong.


    Notice that the polling loop is set up so the whole thing repeats every 100ms.
    The time is taken at the start of the loop and after everything has been processed
    we wait for 100ms to be up. What this means is, no matter long the processing
    in the loop takes, as long as it takes less than 100ms the loop will repeat every
    100ms.


    This is a very simple finite state polling loop. In practice, there is usually
    a switch statement that deals with each current state, but there is often another
    switch statement within each state case to deal with what happens according to
    different inputs. An alternative way of defining a finite state machine loop is
    to use a lookup table, indexed by state and input, which gives you the new state
    and the actions.'
