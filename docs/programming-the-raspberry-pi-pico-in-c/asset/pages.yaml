  md: "This is just a very general overview and omits the commands that allow the\
    \ device to work as an access point. It is assumed that client mode is the more\
    \ common application, but it isn't difficult to extend this example to access\
    \ point operation.\n\n# Setup\n\nWe need a function to set up the hardware ready\
    \ to communicate with the device:\n\n```\nint initWiFi()\n{\n  uart_init(uart1,\
    \ 115200);\n  gpio_set_function(4, GPIO_FUNC_UART);\n  gpio_set_function(5, GPIO_FUNC_UART);\n\
    \  uart_set_format(uart1, 8, 1, UART_PARITY_NONE);\n  uart_set_translate_crlf(uart0,true);\n\
    \n  sleep_ms(100);\n  return 0;\n}\n```\n\nThe model of ESP8266 used worked at\
    \ 115200 baud by default. Newer models and updated firmware at 9600 baud reported\
    \ to work. If you need to modify the data rate and/or change the ESP8266's baud\
    \ rate.\n\nThe entire program is hard coded to use UART1 as this leaves UART0\
    \ free for use as a debug port. The 100ms delay at the end is needed to allow\
    \ the ESP8266 to initialize. The uart_set_translate_crlf call is only needed to\
    \ make web pages display correctly as HTML tends to use lf in place of cr.\n\n\
    # Attention!\n\nTo start with the easiest, but possibly least useful, command\
    \ let's implement some functions that test that we have a connection to the device\
    \ - always a good idea at the beginning of a project.\n\nIn this section we develop\
    \ the first of a number of functions that send a command to the device and get\
    \ back a response. To do this we need a few other functions to help and here they\
    \ are reused in other AT functions. Once you have one AT function, the rest are\
    \ very similar, so it is worth some time following how this simple AT function\
    \ works.\n\nThere isn't much point in moving on until you have tested that the\
    \ connection works. To do this send the string AT\\r\\n and the ESP8266 should\
    \ reply with a single \"OK\", which proves that the serial interface is working."
