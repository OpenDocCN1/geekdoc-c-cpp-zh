  md: '# Overrides


    There are three functions which change the way that the GPIO lines work. They
    override the normal operation – hence their names:


    ```

    gpio_set_outover (uint gpio, uint value)

    gpio_set_inover (uint gpio, uint value)

    gpio_set_oeover (uint gpio, uint value)

    ```


    The first overrides the output behavior, the second the input and the third enable.
    The value can be any of:


    | GPIO_OVERRIDE_NORMAL | where the peripheral signal is selected via gpio_set_function
    |

    | GPIO_OVERRIDE_INVERT | where the invert peripheral signal is selected via gpio_set_function
    |

    | GPIO_OVERRIDE_LOW | drive low/disable output |

    | GPIO_OVERRIDE_HIGH | drive high/enable output |


    So for example:


    ```

    gpio_set_outover (22, GPIO_OVERRIDE_INVERT)

    ```


    sets GP22 to inverted output so that a zero sets the line high and a one it sets
    low.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Summary


    +   - Output is easy because the program decides when to change the state of a
    line. Input is hard because you never know when an input line will change state.


    +   - GPIO lines can be set to act as inputs or outputs.


    +   - If a line is set to output it can be set high or low using the put function.


    +   - You can either set or clear a group of GPIO lines in one operation using
    a mask to indicate which lines to change.


    +   - You can generate pulses as short as 50ns but not reliably.


    +   - A delay can be introduced into a program using the sleep or busy_wait functions.


    +   - The sleep_until and busy_wait until can be used to create a fixed time for
    a set of instructions no matter how long they take to execute in the given time.


    +   - An alternative is to use a busy wait loop which is simply a loop that keeps
    the CPU busy for an amount of time. It is easy to obtain an equation that gives
    the delay per loop.


    +   - If you are going to use a busy wait you should create a function that calibrates
    the number of loops needed for any given time.


    +   - Producing pulses which are in phase is difficult but can be done using the
    mask based operations.


    +   - You can override the usual behavior of the GPIO lines using the over function.'
  merge: -1
