- img_proc: true
  md: "This looks harmless – simply collect characters from uart1 until the buffer\
    \ is full then print it as a string. In a system with a large serial buffer the\
    \ printf would be complete in a few microseconds and the outer while loop would\
    \ restart ready to read the next block of data. However, with a buffer of 32 elements,\
    \ things don't work in the same way. After the first 32 characters are sent to\
    \ the default UART buffer has to wait for free space in the FIFO. This means that\
    \ the time it takes to send the data using the printf is only a little shorter\
    \ than the time it took to receive it. If there is any other sending data at the\
    \ same time, it will be lost during the time the printf is sending data. A better\
    \ solution, although it depends on the exact nature of the character is, to use\
    \ uartputc to send one character as neither FIFO is ever allowed to fill:\n\n\
    ```\nint count = 0;\nwhile(true) {\n    buf[count] = uartgetc(uart1);\n    uartputc(uart0,buf[count++]);\n\
    }\n```\n\nThe point is, when buffers are small sending lots of data can take more\
    \ time that you expect. You can implement a larger buffered system using interrupts\
    \ or you can simply break down serial operations into smaller, blocking operations."
  merge: -1
