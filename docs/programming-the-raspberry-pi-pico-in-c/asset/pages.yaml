  md: '# Fixed Time Delay


    A common problem is making sure that something happens after a fixed time delay
    when you have a variable amount of work to do during that time interval. Consider
    the program snippet:


    ```

    gpio_put(22, 1);

    for (i = 0; i < n; i++);

    sleep us (5);

    gpio_put(22, 0);

    ```


    where the loop is intended to stand for doing some other work. The intention is
    to wait the GPIO line be set high for 5µs, but clearly long the line is set high
    depends on how long the loop takes, which depends on n, plus 5µs. What is needed
    is a pause that takes into account the time the loop uses and simply delays the
    program for the remaining amount of time to make it up to 5µs. This is where the
    two functions:


    ```

    sleep until (absolute_time_t target)

    busy_wait_until (absolute_time_t t)

    ```


    come in useful. They will pause the program until the system timestamp reaches
    the specified value. All you need to make use of these is the additional function:


    ```

    uint64_t time_us_64 (void)

    ```


    which returns a 64-bit timestamp in microseconds.

    We can now write the program snippet earlier as:


    ```

    uint64_t t;

    gpio_put(22, 1);

    t=time_us 64 (+5);

    for (i = 0; i < n; i++);

    sleep_until((absolute_time_t){t);

    gpio_put(22, 0);

    ```


    Now we obtain the timestamp after setting the line high and add 5 to it. No matter
    how long the loop takes, the sleep_until will provide a delay of 5µs, as long
    as the loop takes less than this time. Notice that sleep_until needs an absolute_time_t
    struct and we have to convert the uint64_t to this.

    This is a very general technique and one that can often make difficult timing
    problems very simple.'
  merge: -1
  pgno: 56
- img_proc: true
  md: "# Phased Pulses\n\nAs a simple example of using the output functions, let's\
    \ try to write a short program that pulses two lines, high and low, out of phase.\n\
    \nThe simplest program to do this job is:\n\n```\n#include \"pico/stdlib.h\"\n\
    int main() {\n    gpio_set_function(22, GPIO_FUNC_SIO);\n    gpio_set_dir(22,\
    \ true);\n    gpio_set_function(21, GPIO_FUNC_SIO);\n    gpio_set_dir(21, true);\n\
    \    while (true) {\n        gpio_put(22, 0);\n        gpio_put(21, 1);\n    \
    \    gpio_put(22, 1);\n        gpio_put(21, 0);\n    }\n}\n```\n\nNotice that\
    \ there is no delay in the loop the pulses are produced at the fastest possible\
    \ speed.\n\nUsing a logic analyzer reveals that the result isn't what you might\
    \ expect:\n\n![](img/470d59c61482018b86da50823ee18a57_57_0.png)\n\nThe top train\
    \ switches on and the bottom train takes about half a pulse it switches off, although\
    \ the intent is for both actions to occur at the same time. The point is that\
    \ it takes quite a long to access and change the state of an output line.\n\n\
    Of course, if we include a delay to increase the pulse width then the delay caused\
    \ by accessing the GPIO lines in two separate actions is not so obvious, but it\
    \ is still there. There are applications where the switching speed is so low that\
    \ the delay between switching doesn't matter - flashing LEDs for instance. You\
    \ could flash a line of 800,000 LEDs before the lag between the first and the\
    \ last became apparent. On the other hand, if you use out-of-phase pulses to"
  merge: -1
  pgno: 57
- img_proc: true
  md: "control a motor, then the overlap when both GPIO lines were would burn\nout\
    \ the drivers quite quickly. Of course, any sensible, cautious, engineer\nwould't\
    \ feed a motor control bridge from two independently generated pulse\ntrains unless\
    \ they are guaranteed not to switch both sides of the bridge on\nthe same time.\n\
    \nA better way to generate pulses that are out of phase is to use a masked\nfunction.\
    \ For example, if you change the first program to:\n\n```\n#include <pico/stdlib.h>\n\
    int main() {\n    gpio_set_function(22, GPIO_FUNC_SIO);\n    gpio_set_dir(22,\
    \ true);\n    gpio_set_function(21, GPIO_FUNC_SIO);\n    gpio_set_dir(21, true);\n\
    \n    uint32_t mask = (1 << 22) | (1 << 21);\n    uint32_t value1 = 1 << 21;\n\
    \    uint32_t value2 = 1 << 22;\n    {\n        gpio_put_masked(mask, value1);\n\
    \        gpio_put_masked(mask, value2);\n    }\n}\n```\n\nThe two GPIO lines are\
    \ now set to change at the same time and they do it at\neven at a higher speed:\n\
    \n![](img/470d59c61482018b86da50823ee18a57_58_0.png)\n\nThe reason is that the\
    \ masked operation works by setting a value into\nregister that changes all of\
    \ the GPIO lines concerned at once. As a result the\naction is not only synchronous\
    \ but faster as it is a single operation to set two\nGPIO lines as opposed to\
    \ two operations."
  merge: -1
