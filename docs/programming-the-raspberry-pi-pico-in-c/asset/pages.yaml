- img_proc: true
  md: 'the simple-minded bit-banging protocol as a PIO program isn''t going to work.
    A slightly different interpretation of the protocol, however, makes it very possible.
    If you think of each bit frame starting with a short low pulse which signals the
    start of the frame, a zero sends a low after the initial pulse and a one sends
    a high. In other words, we can implement the write protocol as:


    +   1) Send short “start bit” of about 6µs


    +   2) Send the data bit for the rest of the frame – about 60µs


    +   3) Set the line high for 10µs as a spacer between bit frames


    The read protocol is much the same:


    +   1) Send short “start bit” of about 6µs


    +   2) After about 9µs sample the line and use this as the read bit


    +   3) Do nothing about 55µs as a spacer between bit frames


    In this form the protocol doesn''t need conditionals as the sending of a zero
    or one and the receiving of a zero or a one follows the same steps.


    Using this you could simplify the logic of the bit-banging example given earlier,
    but there is no real need to use as there is plenty of space and computational
    power – using a PIO is a very different matter and regularity in the implementation
    of a protocol is important.


    There is also the problem of how to implement the PIO program so that the C program
    can use of it. One possibility is to use one state machine for send and receive,
    but it is possible to create a single program to do both jobs.


    Start a new PIO project and create a file DS1820.c and DS1820.pio. The PIO program
    starts off with a presence pulse, and as this is long compared to the clock time,
    we use a loop set by the C program. As you generally don''t need a presence pulse
    when reading data from a device, we can use a zero value to indicate that the
    operation is a read, not a write.'
  merge: -1
  pgno: 302
- img_proc: true
  md: "That is, you use the program by pushing data onto the FIFO – the first byte\
    \ starts the program off and if it is zero it starts a read operation and otherwise\
    \ starts a write operation with its value setting the length of the initialization\
    \ pulse:\n\n```\n.program DS1820\n.wrap_target\nagain:\n    pull block\n    mov\
    \ x, osr\n    jmp !, read\n\nwrite:\n    set pindirs, 1\n    set pins, 0\nloop:\n\
    \    jmp x,--loop\n    set pindirs, 0 [31]\n    wait 1 pin [0]\n```\n\nOnce the\
    \ part of the code gets starts, the non-zero value passed in via the FIFO is used\
    \ to create a long, 500us, pulse which the slave responds to with a 120us low\
    \ presence pulse. The final instruction waits for the end of the pulse so we can\
    \ start to send some data.\n\nThe second byte pushed onto the FIFO gives the number\
    \ of bytes to send and these are pushed onto the stack to keep. Notice that if\
    \ there are more than four or five then the program might stall until the FIFO\
    \ has space.\n\n```\npull block\nmov x, osr\nbytes:\n    pull block\n    set y,\
    \ 7\n    set pindirs, 1\nbit1:\n    set pins, 0 [31]\n    out pins, 1 [31]\n \
    \   set pins, 1 [20]\n    jmp y--,bit1\n    jmp x--,bytes1\n    set pindirs, 0\
    \ [31]\n    jmp again\n```\n\nYou can see that the inner loop starting at bit1\
    \ takes the data byte in the OSR and sends it out to the GPIO line, a bit at a\
    \ time. The first instruction in the loop generates the short pulse and the second\
    \ instruction sets the line high or low for 32 clock cycles. The final instruction\
    \ in the loop provides the space between the bit frames. The loop repeats until\
    \ all bits have been sent when the outer loop gets another byte to send, if there\
    \ is one. If not, the program restarts and waits for the next set of data."
