  md: "To create a new project first create a folder called blinky within the pico\
    \ directory – it has to be within the pico directory to find the SDK. Next open\
    \ VS Code and use the File,Open Folder command to open the newly created blinky\
    \ folder. Use the File,New command and the editor to create blinky.c containing:\n\
    \n```\n#include \"stdio.h\"\n\nint main() {\n    gpio_init(25);\n    gpio_set_dir(25,\
    \ GPIO_OUT);\n    while (true) {\n        gpio_put(25, 1);\n        sleep_ms(500);\n\
    \        gpio_put(25, 0);\n        sleep_ms(500);\n    }\n}\n```\n\nAlthough we\
    \ haven't explored how to use the GPIO lines or any aspect of the SDK, you should\
    \ be able to understand this simple program. It makes use of GPIO pin 25, which\
    \ is connected to the on-board LED, to flash the LED every half second. You can\
    \ see that there is a call to initialize the pin, set it to output and after that\
    \ a loop sets it to 1 and 0 with a half second pause.\n\nIn a simple system this\
    \ all you would need to make the device flash, programs written for the Pico make\
    \ use of an extensive library of code. The simplest thing to do would be to link\
    \ your program to the entire library and just run the program, but this would\
    \ be hopelessly inefficient. What we actually do is use a build system that only\
    \ compiles the parts of the library, and our own code, that actually have changed\
    \ and need to be recompiled. then only links the parts of the library that we\
    \ have used and this creates a more efficient program. The only problem is we\
    \ now have the increased complexity that the build system has to manage. The Pico\
    \ makes use of the CMake system. This takes a specification for the project and\
    \ outputs instructions to a lower-level build utility to actually create the executable\
    \ program. The instructions that CMake usually are stored in a file called CMake.txt\
    \ which is stored in the root of the project directory. In this case we only need\
    \ a simple set of instructions that describes the project and makes clear that\
    \ it uses the SDK."
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Create a file called CMakeLists.txt in the blinky folder and enter:

    ```cmake

    make_minimum_required(VERSION 3.13)

    include(pico_sdk_import.cmake)

    project(blinky CXX ASM)

    set(CMAKE CXX_STANDARD 11)

    set(CMAKE CXX_STANDARD 17)

    pico_sdk_init()

    add_executable(blinky

    blinky.c)

    target_link_libraries(blinky pico_stdlib)

    pico_add_extra_outputs(blinky)

    ```


    This states that the minimum version of CMake that works with is 3.13. It then
    includes the file pico_sdk_import.cmake – this is a CMake file that defines how
    the entire SDK is to be built. You need this for nearly all of the projects you
    create. The project statement defines the blinky project to be one that uses C,
    C++ and ARM assembly – your main program will be in C but the rest of the project
    uses more. After that we indicate the standards in use and then make a call to
    a routine defined in pico_sdk_import.cmake which initializes the SDK part of the
    project. Finally we define in the project that are not in the SDK, the targets
    for the build and add a call to a predefined routine which converts the raw output
    into formats that we use to load onto the Pico. The options are:


    | File extension | Description |

    |--- |--- |

    | .bin | Raw binary dump of the program code and data |

    | .elf | The full program output, possibly including debug information |

    | .uf2 | The program code and data in a UF2 form that you can drag-and-drop on
    to the RP2040 board when it is mounted as a USB drive |

    | .dis | A disasm of the compiled binary |

    | .hex | Hexdump of the compiled binary |

    | .map | A map file to accompany the .elf file describing where the linker has
    arranged segments in memory |


    We “include” pico_sdk_import.cmake this has to be copied into the root of the
    project. You can get it from any existing project, but you can get an up-to-date
    copy from pico/pico-sdk/external/'
  merge: -1
