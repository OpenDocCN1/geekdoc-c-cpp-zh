- img_proc: true
  md: 'The read part of the program is very similar to the write:

    read:


    ```

    pull block

    mov x, osr

    bytes2:

    set y, 7

    bit2:

    set pindirs, 1

    set pindirs, 0 [1]

    set pindirs, 0 [5]

    in pins,1 [10]

    jmp x--,bytes2

    .wrap

    ```


    In this case the only data we need from the FIFO is the number of bytes to read.
    This is stored in the C register and controls the number of bytes processed. The
    inner loop, starting at bit2, reads each bit in turn. The first three instructions
    change the line to output, send the short start pulse and sets the line back to
    input. The instruction samples the line after a short delay and gets the data
    which is auto-pushed onto the FIFO for the C program to read. Notice that if the
    C program fails to read the data then the loop stalls, which is fine as the 1-Wire
    device can live with a pause – the DS18B20.


    The entire program is 29 instructions, which does leave space for instructions
    to toggle GPIO line for debugging purposes. It is very probable that it can be
    made shorter.


    Next we move on the C program. We first need an initialization function:

    uint DS18Initialize(PIO pio, int gpio)

    {


    ```

    uint offset = pio_add_program(pio, &DS1820_program);

    uint sm = pio_claim_unused(sm, true);

    ppio_init(pio, gpio);

    pio_config c = DS1820_config default_config(offset);

    sm_config_set cldkiv int_frac(&c, 255, 0);

    sm_config_set_pins(&c, gpio, 1);

    sm_config_set_out_pins(&c, gpio, 1);

    sm_config_set_in_pins(&c, gpio);

    sm_config_set_shift(&c, true, true, 8);

    pio_sm_init(pio0, sm, offset, &c);

    pio_sm_set_enabled(pio0, sm, true);

    return sm;

    ```'
