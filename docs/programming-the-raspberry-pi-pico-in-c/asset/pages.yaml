  md: '# Problems


    The SPI bus is often a real headache because of the lack of a definitive

    standard, but in most cases you can make it work. The first problem is in

    discovering the characteristics of the slave device you want to work with. In


    If you are working with a single slave then generally things work once you

    have the SPI bus configuration set correctly. Things are more difficult when

    there are multiple devices on the same bus. The Pico has enough CS lines to

    handle eight devices, more if you only want to use a single SPI interface.


    Typically you will find SPI devices that don''t switch off properly when they

    are not being addressed. In principle, all SPI devices should present high

    impedance outputs (i.e. tri-state buffers) when not being addressed, but some

    don''t. If you encounter a problem you need to check that the selected slave is

    able to control the MISO line properly.'
  merge: -1
  pgno: 195
- img_proc: true
  md: '# Summary


    +   - The SPI bus is often problematic because there is no SPI standard.

    - Unlike other serial buses, it makes use of unidirectional connections.

    - The data lines are MOSI (master output slave input) and MISO (master input slave
    output).

    - In addition, there is a clock line, output from master, and a number of select
    lines that you have to drive under program control.

    - Timing for the select lines is a problem as you have to include a delay that
    makes sure that it remains low until the end of the final clock pulse.

    - Data is transferred from the master to the slave and from the slave to the master
    on each clock pulse, arranged as a circular buffer.

    - The Pico has two SPI devices which can work with almost any of the GPIO lines.

    - The SDK provides all the functions you need to set up the SPI bus and transfer
    one byte or multiple bytes at a time.

    - You can test the SPI bus using a simple loopback connection.

    - Working with a single slave is usually fairly easy, working with multiple slaves
    can be more of a problem.

    - The BME280 is included as a complete example as part of the SDK but serves as
    a good example of how the SPI bus works.'
  merge: -1
