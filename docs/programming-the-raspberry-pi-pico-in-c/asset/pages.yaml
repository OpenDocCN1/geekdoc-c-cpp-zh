  md: "The frequency is selected to allow the pulse times to be implemented using\
    \ delays from 1 to 31.\n\nThe program is fairly general in that you could use\
    \ it to talk to almost any 1-Wire device, but we are interested in the DS18B20\
    \ and it is easy enough to implement a function to read the temperature along\
    \ the lines of the previous function:\n\n```\nfloat getTemperature(PIO pio, uint\
    \ sm)\n{\n```\n\nFirst we send an initialization pulse followed by a Skip ROM\
    \ and a Convert command. The first item sets a write operation with an initialization\
    \ pulse:\n\n```\npio_sm_put_blocking(pio, sm, 250);\npio_sm_put_blocking(pio,\
    \ sm, 1);\npio_sm_put_blocking(pio, sm, 0xCC);\npio_sm_put_blocking(pio, sm, 0x44);\n\
    ```\n\nNext we should wait until the conversion is complete, but for simplicity\
    \ we wait for 1s – after which time conversion is either complete or the device\
    \ is broken. Then we send another initialization pulse, a Skip ROM and a Read\
    \ ScratchPad command:\n\n```\nsleep_ms(1000);\npio_sm_put_blocking(pio, sm, 250);\n\
    pio_sm_put_blocking(pio, sm, 1);\npio_sm_put_blocking(pio, sm, 0xCC);\npio_sm_put_blocking(pio,\
    \ sm, 0xBE);\n```\n\nFinally we send a read command for nine bytes of data:\n\n\
    ```\npio_sm_put_blocking(pio, sm, 0);\npio_sm_put_blocking(pio, sm, 8);\n```\n\
    \nand read the nine bytes from the FIFO:\n\n```\nint i;\nuint8_t data[9];\nfor\
    \ (int i = 0; i < 9; i++) {\n  data[i] = pio_sm_get_blocking(pio, sm) >> 24;\n\
    }\n```\n\nNow we have the same nine bytes of data as in the bit-banging example\
