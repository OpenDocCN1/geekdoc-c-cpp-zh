  md: '# Preface


    The Pico is a remarkable microcontroller. It has a power and sophistication that
    would have been unthinkable just a short time ago. For the sort of jobs it is
    ideal for, it has plenty of processing power and enough memory to make tasks that
    would have once required careful planning, relatively easy. Instead of struggling
    with the machine, you can now focus on getting a good implementation of your algorithms.


    This said, it is to be admitted that enjoy all of its power and sophistication
    there is no better language than C. It wastes none of the power and it gives you
    what you need to get at the new features. However, getting started with the Pico
    with C isn''t as simple as getting started with MicroPython. You have to find
    a way to create programs and you have to set things up so that program testing
    and debugging is.


    I have settled on VS Code as my preferred IDE and it is a good choice to use with
    the Pico SDK. I take the approach that you need to get up in VS Code and debugging
    as quickly as possible. So, rather than explain how to get command line things
    working, we go straight to a workable IDE-based environment. I hope this approach
    makes getting started with Pico C programming easier than alternatives.


    The rewards of getting a good IDE are many and once you have things working you
    can concentrate on making use of the Pico, which has so many resources that a
    comprehensive account would fill a book twice size. In order to make things fit
    in the space available I have limited myself to explaining what you need to know
    to get a good understanding of the basics. Topics not covered are Direct Memory
    Access (DMA), using the second core, power-saving states, the interpolator and
    the hardware divider. All of these topics are “second level” in the sense that
    you generally need them after you have mastered everything else. There clearly
    is scope for a second volume of this book!


    I covered the use of the PIO (Programmable I/O), because it is one of the key
    advantages of using the Pico, as it allows you to delegate interaction with external
    hardware to a peripheral. The PIO is not the solution to every problem, but it
    is very useful, challenging and a lot of fun. You will find out about the PIO
    in a dedicated chapter and then you need to implement a “driver” for the DHT22
    and the 1-Wire bus.'
  merge: -1
  pgno: 2
- img_proc: true
  md: 'This book doesn''t teach you C, but you really only need a basic level of understanding
    the language. All examples are written in a very simple style that avoids the
    use of constants and functions that might obscure the meaning. You can easily
    refactor any of the examples into a set of functions that suit your particular
    purpose and programming style.


    If the Pico has a drawback, it is that it doesn''t have a network connection.
    To solve this problem there is a chapter on using the low cost ESP8266 as a WiFi
    client and web server. The two devices together make the Pico true IoT device.


    This is not a projects book, although there isn''t much left for you to do round
    out the embryonic projects that are used as examples. Instead it is about understanding
    concepts and the acquisition of skills. The hope is that by the end of the book
    you will know how to tackle your own projects and get them safely to completion
    without wasting time in trial and error.


    Thanks to my tireless editors Sue Gee and Kay Ewbank. I may know what a comma
    is for in C, but my understanding of its role in natural language is severely
    limited. Errors that remain, and I hope they are few, are mine.


    For the source code for the programs in this book, together with any updates or
    errata, links to resources including recommendations for obtaining electronic
    components, visit its dedicated page on the IO Press website: iopress.info.


    You can also contact me at harry.fairhead@i-programmer.info.


    Harry Fairhead


    April, 2021'
