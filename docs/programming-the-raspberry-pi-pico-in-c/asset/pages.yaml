- img_proc: true
  md: '![](img/470d59c61482018b86da50823ee18a57_328_0.png)


    From the pinouts you should be able to work out the ESP8266 has to be connected.
    If we use GP4 as Tx from the Pico and GP5 as Rx to the Pico we have to connect
    ESP-01 pin 7 to GP4, pin 2 to GP5 and pins 8 and 4 to the power supply. To make
    it all work we also have to connect pin 1 to the ground.


    # AT Commands


    The key idea in using the ESP8266 is that the Pico has to send an AT command,
    literally the characters AT, followed by other command strings. The command has
    to end with \r\n for the ESP8266 to take notice of it.


    You can find a list of commands at the Espressif web site, but the most important
    are:


    +   AT Attention

    AT+RST Reset the board

    AT+GMR Firmware version

    AT+CWMODE= Operating Mode 1 - Client, 2 -Access Point, 3 - Client and Access Point

    AT+CWJAP= Join network

    AT+CWLAP View available networks

    AT+CWQAP Disconnect from network

    AT+CIPSTATUS Show current status as socket client or server

    AT+CIPSTART= Connect to socket server

    AT+CIPCLOSE Close socket connection

    AT+CIFSR Show IP local IP address

    AT+CIPMUX= Set connection 0 - Single Connection, 1 - Multi-Channel Connection

    AT+CIPCIPERVE= Open the Socket Server

    AT+CIPMODE= Set transparent mode

    AT+CIPSTTO= Set auto socket client disconnect timeout from 1s to 28800

    +IPD Data'
