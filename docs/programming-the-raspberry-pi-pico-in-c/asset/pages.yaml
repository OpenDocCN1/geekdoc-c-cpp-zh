- img_proc: true
  md: 'To set a GPIO line to its UART function use:

    gpio_set_function(UART_TX_PIN, GPIO_FUNC_UART);


    You can select any combination of pins and if you don''t want to use the

    RTS/CTS lines they can be used for some other purpose.


    There is a problem with making the connection to the Pico''s RX and TX pins

    in that devices work at different voltages. PC-based serial ports usually use

    +13V to -13V and all RS232-compliant ports use a + - voltage swing,

    which is completely incompatible with microprocessors which work at

    5V or 3.3V.


    If you want to connect the Pico to a PC or other standard device you

    need to use a TTL-to-RS232 level converter. In this case it is easier to use

    PC''s USB port as a serial interface with a USB-to-TTL level converter. All you

    have to do is plug the USB port into the PC, install a driver and start to

    transmit data.


    Remember when you connect the Pico to another device that TX goes to the\other
    device''s RX and RX goes to the other device''s TX pin. Also remember

    t the signaling value is 0V to 3.3V.


    # Setting Up the UART


    There are two basic ways to use the serial interface, directly or via the stdio

    library. In most cases you need to know how to work with both so we start

    with the SDK functions that control the UART.


    In all of these cases the UART is specified as the address of the hardware,

    but there are two constants you can use, uart0 and uart1, and there is a

    function that connects the hardware address to a 0/1 index:


    ```

    static uint uart_get_index (uart_inst_t *uart)

    ```


    The simplest initialization function is:


    ```

    uint uart_init (uart_inst_t *uart, int baudrate)

    and to stop using the UART:

    void uart_deinit (uart_inst_t *uart)

    ```


    The function:


    ```

    static bool uart_is_enabled (uart_inst_t *uart)

    ```


    can be used to find out if a UART is enabled.

    You can also set the baud rate separately:


    ```

    uint uart_set_baudrate (uart_inst_t *uart, int baudrate)

    ```'
