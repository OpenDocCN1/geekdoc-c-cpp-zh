  md: '# # Chapter 16


    # ## The Serial Port


    The serial port is one of the oldest ways of connecting devices together, it is
    still very useful as it provides a reasonably fast communication channel that
    can be used over a longer distance than most other connections such as USB. Today,
    however, its most common and important use is in making connections with small
    computers and simple peripherals. It can also be used as a custom signal computers
    peripherals. see later.


    # ### Serial Protocol


    The serial protocol is very simple. It has to be because it was invented in the
    days when it was generated using electromechanical components, motors and the
    like. It was invented to make early teletype machines work and hence you will
    often find abbreviations such as T used in connection with it. As the electronic
    device to work with serial is called a Universal Asynchronous Receiver/Transmitter,
    the term UART is also often used.


    The earliest standards are V24 and RS232. Notice, however, that serial communications
    worked between plus minus 24V and others ±12V. Today''s serial communications
    work at logic, or TTL, levels of 0V to 5V or 0V to 3.3V. This voltage difference
    is a problem we will return to later. What matters is, irrespective of the voltage,
    the protocol is always the same.


    For the moment let concentrate on the protocol. As already mentioned, the protocol
    is simple. The line rests high and represents a zero. When the device starts to
    transmit it pulls the line low to generate a start bit. The width of this bit
    sets the transmission speed - all bits are the width with the start bit. After
    the start bit there are a variable number, usually seven or eight, data bits,
    an optional parity bit, and finally one or two stop bits.


    Originally the purpose of the start bit was to allow the motors to get started
    and allow the receiving end to perform any timing corrections. The stop bits were
    similarly there to give time for the motors to come back to their rest position.
    In the early days the protocol was used at very slow speeds: 300 baud, i.e. roughly
    300 bits per second, was considered fast enough.'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'Today the protocol is much the same, but there is little need for multiple
    stop bits and communication is often so reliable that parity bits are dispensed
    with. Transmission speeds are also higher, typically 9600 or 115200 baud.

    To specify what exact protocol is in use, you will often encounter a short form
    notation. For example, 9600 baud, 8 data bits, no parity, one stop bit, will be
    written as 9600 8n1. Here you can see the letter 0 (01101111 or 0x6F) transmitted
    8n1:


    ![](img/470d59c61482018b86da50823ee18a57_315_0.png)


    Notice that the signal is sent least significant first. The first low is the start
    bit, then the even dots show the ideal sampling positions for the receiver. The
    basic decoding algorithm for receiving serial data is to detect the start of the
    start bit and then sample the line at the center of each bit time. Notice that
    the final high on the right is the stop bit.


    Notice also that the sampling points can be put to use on custom protocols. As
    long as the data is transmitted in fixed time “cells” indicated by a start bit,
    you can use a serial port to read individual bits.


    For a serial connection to work, it is essential that the transmitter and receiver
    are set to the same speed, data bits and parity. Serial interfaces most often
    fail because they are not working with the same settings.


    A logic analyzer with serial decoder is an essential piece of equipment if you
    are going to do anything complicated with serial interfacing.

    What is a baud rate refers to the bit time. It is, 300 baud has a start bit that
    is 1/300s. This means that for 9600 baud a bit is 1/9600 wide or roughly 104µs
    and at 115200 baud a bit is 1/115200 or roughly 8.6µs. Notice that baud rate doesn''t
    equate to speed of sending data because of the overhead in start, stop and perhaps
    parity bits to include in the calculation.'
