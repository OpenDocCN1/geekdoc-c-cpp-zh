  md: "# PIO Blinky\n\nNow it is time to write and run our first PIO program and in\
    \ the grand\ntradition we will, eventually, write a Blinky program – the Hello\
    \ World of\nhardware.\n\nThe PIO is programmed using a special assembly language\
    \ and we will return\nto its main features later, but for now you can most understand\
    \ the\nmeaning of our first simple program:\n\n```\n.program squarewave\nset pins,\
    \ 1      ; Set pin to output\nagain:\n    set pins, 1      ; Drive pin high\n\
    \    set pins, 0      ; Drive pin low\n    jmp again         ; Set PC to label\
    \ `again`\n```\n\nThe first instruction sets pin 1 in the SET group of pins to\
    \ be an active\noutput, it changes it from a high impedance state to an output.\
    \ It is more\ncomplicated than it seems. More exactly how this works in the section\
    \ on\nOutput to the GPIO.\n\nThe loop that follows this repeatedly changes the\
    \ SET group of pins from\nhigh to low. Notice that from this program you cannot\
    \ tell which pins are\nactually being used – this is set in your C program via\
    \ the PIO registers or the\nequ SDK functions.\n\nThe program is simple, but now\
    \ we have to convert it into machine code by\neither hand-assembling it, which\
    \ is possible but tedious, or passing through an\nassembler. The SDK has an assembler\
    \ and a CMake function\nthat will invoke the assembly and transfer its machine\
    \ code into C array that\nbe loaded into the PIO. The C array and other useful\
    \ things are presented\nto your program in a header file that you include in your\
    \ program. The line\nthat you need to add to the CMakeLists file are:\n\npico_generate_pio_header(${CMAKE_CURRENT_LIST_DIR}/squarewave.pio)\n\
    \nThis assumes that the name of the executable is pio and that the assembly\n\
    language is stored in a file called squarewave.pio stored in the project's folder.\n\
    When the project is built this generates the file squarewave.pio.h i.e. whatever\n\
    name of the assembly file is .h as an extension.\n\nIf you are going to use the\
    \ SDK functions to configure and interact with the\nPIO you also need:\n\n```\n\
    target_link_libraries(pio pico_stdstdlib hardware_pio)\n```\n\nassuming your executable\
    \ is called pio."
