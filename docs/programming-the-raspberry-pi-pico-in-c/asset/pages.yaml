- img_proc: true
  md: '# Chapter 15

    The 1-Wire Bus And The DS1820


    The 1-Wire bus is a proprietary bus that is very easy to use and has a lot of
    useful devices you can connect to it, including the iButton security devices,
    memory, data loggers, fuel gauges and more. However, probably the popular of all
    1-Wire devices is the DS18B20 temperature sensor - it is small, very cheap and
    very easy to use. This chapter show you how to work with it, but first let''s
    deal with the general techniques needed to work with the 1-Wire bus.


    Programming in C on the Pico gives you more than enough speed to implement a bit-banging
    driver, which for many purposes is sufficient. However, the 1-Wire protocol is
    easy enough to implement using the PIO. In this chapter we look at the basic of
    the 1-Wire bus, implement a bit banging program for your most popular device and
    extend this to a PIO program.


    # The Hardware


    One-wire devices are very simple and use only a single wire to transmit data:


    ![](img/470d59c61482018b86da50823ee18a57_282_0.png)


    The 1-Wire device can pull the bus using its Tx line and read the line using its
    Rx line. The reason for the pull-up resistor is that both the bus master and the
    slave can pull the bus low and it will stay low until they release the bus.


    The device can even be powered by the bus line by drawing sufficient current through
    the pull-up resistor - so called parasitic mode. Low power devices work well in
    parasitic mode, but some devices have a heavy current draw that the master has
    to provide to connect them to the power line - so called strong pull-up. In practice,
    parasitic mode can be difficult to make work reliably for high-power devices.'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'In normal-powered mode there are just three connections - V power, usually

    3.3V for the Pico, Ground and Data:


    ![](img/470d59c61482018b86da50823ee18a57_283_0.png)


    The pull-up resistor varies according to the device, but anything from 2.2K to

    4.7k works. The longer the bus, the lower the pull-up resistor has to be

    reduce "ringing". There can be multiple devices on the bus and each one has

    a unique 64-bit laser ROM code, which can be used as an address to select

    active devices.


    For simplicity, it is better to start off with a single device and avoid the

    problem of enumerating the devices on the bus, although you know how

    every this isn''t difficult to implement. To get started, select

    1-wire device that you want to work with and set it up ready to talk to the

    Pico, in this case the DS18B20 is explained. The functions described in this

    chapter should work with any 1-wire device.


    # Initialization


    Every transaction with a 1-wire device starts with an initialization handshake.

    First we have to work out how to configure the GPIO line. This example

    assumes that the 1-wire device is connected to GP2.


    You might think that we have to initialize the GPIO line so that it works in

    pull-up mode. This isn''t necessary and the default push-pull mode will do.

    The master controls when

    other devices send their data. Typically the master sends a pulse and then the

    sslave respond by pulling the line low. As long as the master doesn''t drive the

    line during the period when the slaves are responding, everything is fine.


    What we do in practice is to configure the GPIO line for output only when the

    master needs to drive the line. Once the master is finished the GPIO line is set

    back to input and the pull-up resistor is allowed to pull the line back up.

    After this, any slave wanting to send data is free to pull the line low.


    The first transaction we need is the initialization pulse. This is simply a low

    pulse that lasts at least 480µs, a pause of 15µs to 60µs follows and then any

    all of the devices on the bus pull the line low for 60µs to 240µs.'
  merge: -1
  pgno: 283
- img_proc: true
  md: "![](img/470d59c61482018b86da50823ee18a57_284_0.png)\n\nThe suggested timings\
    \ are set the line low for 40µs and read the line after 70µs followed by a pause\
    \ of 410µs.\n\nThis is fairly easy to implement as a function:\n\n```\nint present(uint8_t\
    \ pin)\n{\n    gpio_set_dir(2, GPIO_OUT);\n    gpio_put(pin, 1);\n    sleep_ms(1);\n\
    \    gpio_put(pin, 0);\n    sleep_us(480);\n    gpio_set_dir(pin, GPIO_IN);\n\
    \    sleep_us(70);\n    int b = gpio_get(pin);\n    sleep_us(410);\n    return\
    \ b;\n}\n```\n\nWe pull the line low for 40µs and then let it be pulled up by\
    \ changing the line to input, i.e. high impedance. After a 70µs wait, which is\
    \ right at the start of the guaranteed period when the line should be low if there\
    \ is an active device on the bus, we read the input line and wait another 410µs\
    \ to complete the data slot."
  merge: -1
  pgno: 284
- img_proc: true
  md: "The timings in this case are not critical as long as the line is read while\
    \ it is held low by the slaves, which is never less than 60µs and is typically\
    \ as much as 100µs. If there is a device, the function should return a 0 and if\
    \ there are no devices it should return a 1.\n\n```\n#include <stdio.h>\n#include\
    \ \"pico/stdliblib.h\"\n#include \"hardware/gpio.h\"\nint main() {\n    stdio_init_all();\n\
    \    gpio_init(2);\n\n    if (presence(2) == 1) {\n        printf(\"No device\
    \ \\n\");\n    } else {\n        printf(\"Device present \\n\");\n    }\n    return\
    \ 0;\n}\n```\n\nIf you try this partial program and have a logic analyzer with\
    \ a 1-wire protocol analyzer you will see something like:\n\n| | +100us | +200us\
    \ | +300us | +400us | +500us | +600us | Measurements |\n|---|---|---|---|---|---|---||\n\
    | | | | | | PRESENCE condition | | Width: 482.4us |\n| | | | | | | | Period: 513.1us\
    \ |\n| | | | | | | | DutyCycle: 5.90232913% |\n| | | | | | | | | Frequency: 1.94893783KHz\
    \ |\n| | | | | | | | Pulse Measurements |\n\nSeeing a presence pulse is the simplest\
    \ and quickest to be sure that your hardware is working.\n\n# Writing Bits\n\n\
    Our next task is to implement the sending of some data bits to the device. The\
    \ 1-Wire bus has a very simple data protocol. All bits are sent using a minimum\
    \ of 60µs for a read/write slot. Each slot must be separated from the next by\
    \ a minimum of 1µs.\n\nThe good news is that timing is only critical within each\
    \ slot. You can send the first bit in a time slot and take your time before you\
    \ send the next bit"
  merge: -1
  pgno: 285
- img_proc: true
  md: "as the device will wait for you. This means you only have to worry about timing\
    \ within the functions that read and write individual bits.\n\nTo send a 0 you\
    \ have to hold the line low for most of the slot. To send a 1 you have to hold\
    \ the line low for just between $\\mu s$ and $15\\mu s$ and leave the line high\
    \ for the rest of the slot. The exact timings can be seen below:\n\n![](img/470d59c61482018b86da50823ee18a57_286_0.png)\n\
    \nIt seems reasonable to use the typical timings given in the datasheets. For\
    \ a $\\theta$ we hold the line low for $6\\mu s$ then let it go high for the remainder\
    \ of the slot, $10\\mu s$. To send a 1 we hold the line low for $6\\mu s$ and\
    \ then let it go high for the remainder of the slot, $64\\mu s$. The only critical\
    \ operations are the actual setting of the line low and then back to high, there\
    \ is no need to worry much about the speed of operation of the entire function\
    \ so we might as well combine 0 and 1 into a single writeBit function:\n\n```\n\
    void writeBit(uint8_t pin, int b)\n{\n    int delay1, delay2;\n    if (b == 1)\n\
    \    {\n        delay1 = 6;\n        delay2 = 64;\n    }\n    else\n    {\n  \
    \      delay1 = 60;\n        delay2 = 10;\n    }\n    gpio_set_dir(pin, GPIO_OUT);\n\
    \    gpio_put(pin, 0);\n    sleep_us(delay1);\n    gpio_set_dir(pin, GPIO_IN);\n\
    \    sleep_us(delay2);\n}\n```\n\nThe code at the start of the function simply\
    \ increases the time between slots slightly. Notice that once again we return\
    \ the GPIO line to input, i.e. high impedance, rather than driving the line high\
    \ at the end of the transaction. This allows the line to be pulled high ready\
    \ for any response from the slave."
  merge: -1
