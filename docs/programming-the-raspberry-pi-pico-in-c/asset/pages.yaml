  md: "# Some Utility Functions\n\nAssuming that you have managed to make the AT command\
    \ work, it is time to move on to other AT commands. The first useful command is\
    \ to find the Version number of the firmware. This is more or less the same as\
    \ the AT function, but the command is AT+GMR:\n\n```\nint getVersionWiFi(uint8_t\
    \ buf[], int len)\n{\n    uint8_t SendData[] = \"AT+GMR\\r\\n\";n    uart write\
    \ blocking(uart1, SendData, 8);\n    return getBlock(buf, len);\n}\n```\n\nThe\
    \ device in returned:\n\n+   AT+GMR\nAT version:1.3.0.0(Jul 14 2016 18:54:01)\n\
    SDK version:2.0.0(5a875ba)\nv1.0.0.3\nMar 13 2018 09:35:47\nOK\n\nThe manual says\
    \ that it should return AT, SDK and the time it was compiled, so we get a little\
    \ extra with this third-party device.\n\nReset is another useful function. The\
    \ device often gets stuck and then a reset is all that you can try. This is a\
    \ software reset; another option is to use a GPIO line to connect to reset pin\
    \ 6. By controlling this line you can force the device to hard reset. The soft\
    \ reset command is AT+RESET and all you get back in theory is \"OK\", but in practice\
    \ what the device sends:\n\n```\nint resetWiFi(uint8_t buf[], int len)\n{\n  \
    \  uint8_t SendData[] = \"AT+RESET\\r\\n\";\n    uart write blocking(uart1, SendData,\
    \ 8);\n    return getBlock(buf, len);\n}\n```\n\nThe ultimate utility function\
    \ is to set the serial connection parameters to 115200, 8 Bits, 1 stop bit, no\
    \ parity, no flow control:\n\n```\nint setUARTWiFi(uint8_t buf[])\n{\n    uint8_t\
    \ SendData[] = \"AT+UART_CUR=115200,8,1,0,0\\r\\n\";\n    uart write blocking(uart1,\
    \ SendData, 8);\n    return getBlock(buf, len);\n}\n```\n\nIf you change the baud\
    \ rate to something other than what is in use you will, of course, lose communication\
    \ with the device until you reconfigure the serial connection."
