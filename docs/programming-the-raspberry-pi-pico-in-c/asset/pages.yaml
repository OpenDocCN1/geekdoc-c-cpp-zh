- img_proc: true
  md: "The most sensible thing to do is to move to VS Code which makes running a program\
    \ automatic and provides easy debug facilities. All you have to do is create a\
    \ file called launch.json in the .vscode folder containing:\n\n```\n{\n  \"version\"\
    : \"0.2.0\",\n  \"configurations\": [\n    \"name\": \"Cortex Debug\",\n    \"\
    cwd\": \"${workspaceRoot}\",\n    \"executable\": \"${command:cmake.launchTargetPath}\"\
    ,\n    \"request\": \"launch\",\n    \"type\": \"cortex-debug\",\n    \"servertype\"\
    : \"opencod\",\n    \"gdbPath\": \"gdb-multiarch\",\n    \"device\": \"rp2040\"\
    ,\n    \"configFile\": [\n      \"interface/raspberrypi-swd.cfg\",\n      \"target/rp2040.cfg\"\
    \n    ],\n    \"svdFile\": \"${env:PICO_SDK_PATH}/src/rp2040/hardware_regs/rp2040.svd\"\
    ,\n    \"runToMain\": true,\n    // Give restar the same functionality as runToMain\n\
    \    \"postRestartCommands\": [\n      \"break main\",\n      \"continue\"\n \
    \   ]\n  ]\n}\n```\n\nNext you can select the debug configuration. Select the\
    \ green arrow labeled RUN in the Debug toolbar on the left. Select Pico Debug\
    \ from the drop-down list and your program should be downloaded and run:\n\n![](img/470d59c61482018b86da50823ee18a57_33_0.png)"
  merge: -1
  pgno: 33
- img_proc: true
  md: 'Although your program is running you won''t see much happening because default
    it is paused at the first instruction. You will see the debug toolbar appear and
    this is what you need to use to debug your program:


    ```

    C blinky.c > main()

    1    #include "pico/stdlib.h"

    2

    int main() {

    3    const uint LED_PIN = 25;

    4    gpio_init(LED_PIN);

    5    gpio_set_dir(LED_PIN, GPIO_OUT);

    ```


    To get the program running, simply click the blue triangle Run icon. You can also
    use the red square icon to stop the program and the green arrow Restart icon to
    restart the program. If there are breakpoints in the code, click in the left-hand
    margin, the program will automatically stop and display the current state of variables
    in the left-hand debug pane. You can also single-step, step into called functions
    and out of any called function. All of these also show you the status of the variables.
    Notice that you have to stop the program using the Stop icon before you rebuild
    and run it again.


    You now have a workable system that allows you to edit, build and debug Pico programs.
    You will need to modify the CMakeLists.txt file to include specific parts of the
    library, but this is fairly standard.


    # Debug Using PicoProbe For Windows


    Using the USB file system is a reasonable way of checking that you have VS Code
    installed correctly, but it is not suitable as a way to develop programs. You
    need to install and use an SWD link between the Pico and the Windows system you
    are using to develop programs and this is more difficult because PCs generally
    do not have suitable interfaces to make this possible. One solution is to use
    a SWD programmer, but it is easier, and cheaper, to use a second Pico to act as
    one. This is possible with the help of a Pico program called PicoProbe. This converts
    a Pico into an SWD programmer which can be used under Windows or Linux. It could
    also be used with a Pi 4, but this seems to offer no advantages over direct connection
    to GPIO lines.'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'As described in the section on using SWD with a Pi 4, the Pico has three debug
    pins:


    ![](img/470d59c61482018b86da50823ee18a57_35_0.png)


    These are most easy to work with if you solder three pins onto the top side of
    the board. The connections to the second, or PicoProbe Pico are:


    | PicoProbe | Pi Pico |

    | GND | SWD GND |

    | GP2 | SWDIO |

    | GP3 | SWCLK |


    These are the only connections you need to make to turn the Pico into an SWD programmer.


    ![](img/470d59c61482018b86da50823ee18a57_35_1.png)


    36'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'A good way to implement this is to solder three male/female jumper cables known
    as Dupont wires onto the PicoProbe. You can then use the PicoProbe as if it was
    a proper SW programmer. There are also some 3D printed cases that you can download
    can be used to turn the Pico into a debugging device, see the Resources section
    on this book''s page for the I/O Website. Both Picos need to be powered. The Pico
    that is running the program can be powered by a USB connection or any method you
    care to use. The PicoProbe, however, has to have a USB connection to the Pico
    as this is the method used to communicate with it.


    To make the Pico act like an SW programmer you have to download the PicoProbe
    program. You can find this on the Raspberry Pi Pico Getting Started page, or if
    you find the installation script, you will find a UF2 file, picoprobe, uf2, in
    pico/picoprobe/build. To install all you have to do connect to the Pico while
    holding down the BootSel button and then drag-and-drop the UF2 file onto the USB
    driver that is installed on the PC. After this your Pico is a Pico device whenever
    you turn it on.


