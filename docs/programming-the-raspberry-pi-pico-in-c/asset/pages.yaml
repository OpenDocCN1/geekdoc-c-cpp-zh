    point for the files that you need and it will get better with time.


    # What Is Missing?


    At this point we now have workable development environments using the Pi 4 and
    a windows/Linux system. The documentation includes extra features in both of these
    environments which complicates things. Later you may want to deal add connections
    and software to make the UART usable – this is dealt in Chapter 6. There is also
    a program called Picotool which will interrogate a Pico to discover what software
    is installed. This is well described in the documentation where you can find out
    it if you think it might be useful.


