  md: "Edge interrupts are the most commonly used and, as these are latched, you do\
    \ need to clear the event bit using:\n\n```\nvoid gpio_acknowledge_irq (uint gpio,\
    \ uint32_t events)\n```\n\nThis is also the function gpio_clear_events that you\
    \ call to clear an event on a given GPIO line.\n\nThis is all there is to using\
    \ GPIO to generate an interrupt and handling it. In practice, things are more\
    \ difficult to get right than you might expect. There is the question of what\
    \ happens if an interrupt occurs while you are in the interrupt handler and what\
    \ about accessing shared resources in the interrupt handler?\n\nFirst simple example:\n\
    #include <stdio.h>\n#include \"pico/stdlib.h\"\n\n```\nstatic uint64_t t;\nvoid\
    \ MyIRQHandler(uint gpio, uint32_t events)\n{\n    t = time_us_64() - t;\n   \
    \ printf(\"%d %%X %%dd \\n\", gpio, events, t);\n}\nint main()\n{\n    stdio_init_all();\n\
    \    gpio_set_function(22, GPIO_FUNC_SIO);\n    gpio_set_dir(22, false);\n   \
    \ gpio_pull_down(22);\n\n    gpio_set_irq_enabled(22, callback, GPIO_IRQ_EDGE_RISE\
    \ | GPIO_IRQ_EDGE_FALL, true, &MyIRQHandler);\n    while (1){\n        return\
    \ 0;\n}\n```\n\nThis sets up an interrupt handler which prints the GPIO line,\
    \ event and time since the last event. If the events occur slowly enough then\
    \ you should see one event as the cause of the interrupt, but if they occur more\
    \ quickly than the print takes to complete you will see both edges as having occurred.\
    \ Only one of the events will have initiated the interrupt, the other will simply\
    \ have been recorded while the interrupt handler was being called."
