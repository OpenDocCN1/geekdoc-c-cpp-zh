- img_proc: true
  md: '# Side Effects


    Now we have encountered most of the idea behind PIO output to the GPIO lines but
    there is one more additional feature – setside as a side effect. As well as being
    able to explicitly set GPIO lines using set or out, we can also arrange for any
    instruction to set GPIO lines as part of its execution. In sense, the setting
    of the GPIO lines is a "side effect" of the instruction. Side effects are usually
    thought of as something to avoid in a standard program – you want to do what it
    appears to do and nothing more. In the case of PIO programming, however, side
    effects are very useful because they allow you to set GPIO lines according to
    where the program is in its execution. That is, they can be used to signal to
    the outside world the state of the program. At a more utilitarian level, being
    able to set a GPIO line as a side effect of another instruction can save time
    and instructions.


    The only downside of side effects is that they are coded using the space in the
    PIO instruction used to specify a delay. There is a 5-bit field used to code the
    delay and the effect and you can trade bits for each purpose. The default is that
    all five bits are used to specify a delay and this makes it possible to specify
    up to 31 clock cycles of delay. You can allocate


    ```

    .side_set count opt pinders

    ```


    where count is the number of set-side bits to allocate, opt means that the set
    is optional on an instruction and pinders is the option to set the pin directions
    as a side effect. Setting pinders as a side effect is useful if you need to change
    a line from out to in as the program progresses.


    Alternatively you can use the SDK to set the same options when you configure the
    state machine:


    ```

    sm_config_sideset (pio_sm_config *c, uint bit_count, bool optional, bool pinders)

    ```


    Both ways of setting the options apply to the entire program.


    Obviously you should choose to use few set-side bits as possible if you want to
    make use of a delay. The side_set directive has to come at the start of the program
    and it remains in effect for the entire program.


    In addition to setting the number of side_set bits you also need to set the SIDESET
    GPIO group:


    ```

    sm_config_sideset_pins (pio_sm_config *c, uint sidesetbase)

    ```


    This sets the start of the SIDESET group and you can specify any number of contiguous
    GPIO lines that the number of set-side bits allows.'
  merge: -1
  pgno: 250
- img_proc: true
  md: "Finally to include a GPIO line to set as a side effect you can add:\nside value\n\
    \nafter any instruction and the value will be used to set the SETSIDE pins (or\
    \ their directions).\n\nTo show how all this works the simplest thing to do is\
    \ write the square wave generator again, but this time using nothing but set-side\
    \ options:\n\n```\n.program squarewave\n.side_set 1 opt\nagain:\nnop side 1\n\
    jmp again side bit 0\n```\n\nThe side directive specifies a single bit, which\
    \ means that the SETSIDE group of GPIO lines is effectively a single line. The\
    \ nop has a side effect of setting the side effect lines to 1 and the jump sets\
    \ it back to 0.\n\nThe main program to use of this is fairly standard, but we\
    \ need to set the SETSIDE group to start at GP2 if this is the line we want to\
    \ toggle:\n\n```\n#include \"pico/stdlib.h\"\n#include \"hardware/pio.h\"\n#include\
    \ \"sqwave.pio.h\"\n```\n\n```\nint main() {\n\tuint offset = pio_add_program(pio0,\
    \ &squarewave_program);\n\n\tuint sm = pio_claim_unused_sm(pio0, true);\nnpio_sm_config\
    \ c = squarewave_program_get_default_config(offset);\npio_sm_config_set_side_pins(&c,2,2);\n\
    pio_gpio_init(pio0, 2);\npio_sm_set_consecutive_pindirs(pio0, sm, 2, 1, true);\n\
    pio_sm_config_set_clkdiv_init_frac(&c,255, 0);\npio_sm_init(pio0, sm, offset,\
    \ &c);\n\npio_sm_set_enabled(pio0, sm, true);\n\treturn 0;\n}\n```\n\nIf you run\
    \ this program you will find that pin GP2 is toggled in a 50% square wave at 245kHz,\
    \ without a single or set instruction in sight. Notice that the rising edge occurs\
    \ when the loop starts and the falling edge when the loop ends."
  merge: -1
  pgno: 251
- img_proc: true
  md: 'As an example of using more than one GPIO line as a side effect:

    .program squarewave

    .side_set 2 opt

    again:

    nop side 2

    jmp again side 1


    Now we have set two bits to control set-side GPIO lines, which means we can control
    two of them. First we write 2, 10 in binary, to the pair of lines and then 1,
    or 01, which switches the lines in anti-phase – when one is high the other is
    low. The main program has to be changed to configure two GPIO lines:


    ```

    sm_config_set_sideset_pins(&c,2);

    pio_gpio_init(pio0, 2);

    pio_gpio_init(pio0, 3);

    ```


    Set-side lines can overlap with OUT and SET lines, if such instructions set the
    same GPIO line, the set-side instruction has precedent.


    # Input


    Now we have described most of the general ideas of GPIO output to GPIO lines,
    it is time to consider input from GPIO lines. The good news is that this is easy
    to understand as long as you have followed the ideas involved in output. The only
    problem is that, in practice, input is harder than output and in the case of PIO
    programming you have to rethink how things work. We don''t have any edge-triggered
    events or timers. Everything you have to be conditioned on the state of the system
    and raw timings based on how long instructions to execute.


    The basic mechanisms of input are the same as output. There is a 4-element, 32-bit
    RX FIFO that you can read from your C program using:


    ```

    static uint32_t pio_sm_get(PIO pio, uint sm)

    static uint32_t pio_sm_get(PIO pio, uint sm);

    ```


    Obviously the first function blocks until there is some data to read and the second
    returns at once, either with data or with an undefined value.


    You can find the current state of the RX FIFO using:


    ```

    static bool pio_sm_is_rx_fifo_full(PIO pio, uint sm)

    static bool pio_sm_is_rx_fifo_empty(PIO pio, uint sm)

    static uint pio_sm_get_rx_fifo_level(PIO pio, uint sm);

    ```


    Data enters into the RX FIFO from the PIO via the Input Shift Register, ISR, which
    is the input equivalent of the OSR.'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'To transfer data from the GPIO lines you use the in instruction,

    in pins,n


    The in instruction moves n bits from the IN GPIO group to the ISR shifting

    any data that is already present. You can also use it to transfer n bits from

    the x or y registers and a few other sources. The IN group of GPIO lines is

    defined in the C program:


    ```

    sm_config_set_in_pins (pio_sm_config *c, uint_in_base)

    ```


    As in the case of the SETSIDE group, you only have to specify a base number

    as you can read from any GPIO line, even if it is an output. What this means

    is that an in instruction can read all of the 32 GPIO lines and only the

    numbering of the lines changes. For example:


    ```

    sm_config_set_in_pins (&c,10);

    ```


    which sets the base to GP10, the push instruction:


    ```

    in pins,3

    ```


    will transfer the state of GP10, GP11 and GP12 to the ISR.

    Once you have sufficient bits in the ISR, you can transfer the entire 32-bit

    value to the RX FIFO using the push instruction:


    ```

    push block

    ```


    This waits for a free space in the RX FIFO and clears the ISR ready for further

    use. You can also use autopush to transfer data to the RX FIFO automatically

    when a count threshold is reached. You can set the direction in which the

    ISR is shifted and the use of autopush and push threshold using:


    ```

    static void sm_config_set_shift (pio_sm_config *c,

    shift_right, bool autopush, uint push_threshold)

    ```


    As the simplest example, let read push and use its state to control the

    on-board LED. This isn''t a useful program, but it is a good illustration of the

    bbasics. The PIO program is simply:


    ```

    .program light

    again:

    in pins,1

    push block

    jmp again

    ```


    You can see that this simply read the state of the first INPUT pin and pushes

    it to the RX FIFO. Of course, after four reads and pushes, the RX FIFO will

    full and the program will stall.'
