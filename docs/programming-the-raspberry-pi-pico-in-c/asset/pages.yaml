  md: "# DHT22 Using the PIO – Sampling\n\nA simpler alternative way for decoding\
    \ the data is to ignore the fact that it is the width of each bit's frame that\
    \ defines a zero, a short frame, or a one long frame, and notice that if you sample\
    \ at a suitable fixed time from the rising edge of a pulse then you will get a\
    \ zero in a zero frame and a one in one frame:\n\n![](img/470d59c61482018b86da50823ee18a57_275_0.png)\n\
    \nYou can see the sampling times from the pulses on the lower trace of the logic\
    \ analyzer and the fact that you do indeed get a 0 in a zero frame and a 1 in\
    \ one frame. You can also see that the time to sample from the rising edge is\
    \ constant, even if the sampling period varies.\n\nSurprisingly, the PIO program\
    \ to implement this sampling isn't significantly simpler than the previous program,\
    \ but the entire four data bytes can now be packed into a single FIFO entry and\
    \ the checksum byte can occupy a second entry.\n\nThe PIO program starts off in\
    \ the same way:\n\n```\n.program dht\n  set pins, 1\n  set pindirs, 1\nagain:\n\
    \  pull block\n  set pins, 0\n  mov x, osr\nloop1:\n  jmp x--,loop1\n  set pindirs,\
    \ 0\n  wait 1 pin 0\n  wait 0 pin 0\n  wait 1 pin 0\n  wait 0 pin 0\n```"
  merge: -1
  pgno: 275
- img_proc: true
  md: "The waits' position is at the state of the data and now we can wait for a rising\n\
    edge and then delay until the sample time:\n\n```\nset y,31\nbits:\n    wait 1\
    \ pin 0 [25]\n    in pins,1\n    wait 0 pin 0\njmp y--,bits\n```\n\nThis too is\
    \ very similar, only now we don't keep a count but simply add the\nsingle bit\
    \ sampled from the input line to the ISR. When all 32 bits have been\nadded, the\
    \ autopush moves the data to the FIFO.\n\nThe eight checksum bits are just as\
    \ easy to process and the complete PIO\nprogram is:\n\n```\n.program dht\n   \
    \ set pins, 1\n    set pindirs, 1\nagain:\n    pull block\n    set pins, 0\n \
    \   mov osr\nloop1:\n    jmp x--,loop1\n    set pindirs, 0\n    wait 1 pin 0\n\
    \    wait 0 pin 0\n    wait 1 pin 0\n    wait 0 pin 0\n```\n\n```\nset y,31\n\
    bits:\n    wait 1 pin 0 [25]\n    in pins,1\n    wait 0 pin 0\njmp y--,bits\n\
    ```\n\n```\nset y,7\ncheck:\n    wait 1 pin 0 [25]\n    in pins,1\n    wait 0\
    \ pin 0\njmp y--,check\npush block\njmp again\n```\n\nNotice that we have to manually\
    \ push the ISR because it doesn't fill up just\nthe 8 bits of the checksum."
