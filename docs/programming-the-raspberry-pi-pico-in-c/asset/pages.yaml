- img_proc: true
  md: 'The data in the OSR can be moved to the OUT group of pins using the out instruction:


    out pins, n


    n is the number of bits shifted to the OUT group. The bits that are shifted out
    are used to set the first n GPIO lines in the OUT group and any remaining lines
    are set to zero. Notice that we use the term “shift” this applies only to what
    happens to the contents of the OSR register. The n bits are presented to the n
    GPIO lines in one operation – i.e. all of the GPIO lines change their state at
    the same time. The “shift” simply means that the data in the OSR register is moved
    to remove the n bits used. You can set the direction of the shift so as make either
    the most significant or least significant bits of the ones that are used in the
    OSR register:


    ```

    sm_config_out_shift (pio sm_config *c, bool shift_right,

    bool autopoll, uint pin_threshold)

    ```


    The last two parameters control the automatic loading of the OSR, see later.

    in general, 32 bits are sent to the destination of the out command, the lower
    n bits coming from the OSR and the remaining bits are zero. Course usually the
    lower n bits are used and so on until the shift register is empty when all 32
    bits have been shifted. A simple PIO program example will help clarify. In this
    case we will send the bits from a 32-bit value to two GPIO just to show how this
    works:


    ```

    .program squarewave

    set pindirs, 3

    pull block

    again:

    out pins,2

    jmp again

    ```


    You can see that all the program does is to pull a single 32-bit value from the
    TX FIFO into the OSR and then uses the instruction to send pairs of bits to the
    first two pins in the OUT group of pins.


    This seems simple, but the pindir is more complicated than you might expect. The
    instruction sets the direction of the SET group of pins. The literal value in
    the instruction is used as a mask to set the pin directions. This means that it
    can only set the direction of the first five GPIO lines in the SET group. This
    usually isn''t a problem using more than five GPIO lines for output is uncommon.
    However, the out instruction sets the data from the OSR to the first two GPIO
    lines in the OUT group, not the SET group. You can see that the set instruction
    only enables the first two GPIO group if they are the same in both groups.'
  merge: -1
  pgno: 246
- img_proc: true
  md: "The key thing is that GPIO lines are controlled by a single 32-bit register\
    \ which ignores pin mappings and it doesn't matter how you set a bit, the GPIO\
    \ line is enabled. You could use an out instruction to set the bits in the OUT\
    \ group, but this would require data from your C program to be placed in the TX\
    \ FIFO.\n\nAnother solution is to configure the pindir from the C program using:\n\
    pio_sm_set_consecutive_pindirs (PIO pio, uint sm, uint pin_base, uint pin_count,\
    \ bool is_out)\n\nor\npio_sm_set_pindirs_with_mask (PIO pio, uint sm, uint32_t\
    \ pin_dirs, uint32_t pin_mask)\n\nThe first sets the GPIO pins starting at GPpin_base+pin_count\
    \ to high impedance or output according to is_out. The second uses a mask to set\
    \ the directions of the pins corresponding to ones in the mask to the state specified\
    \ in pin dirs. Notice that in both cases you are working with the entire 32 GPIO\
    \ lines, not any of the PIO groups. These functions should be used to initialize\
    \ the PIO before it is enabled.\n\nNow we have the PIO program, all that remains\
    \ is the C program which sends some \"random\" data:\n\n```\n#include \"pico/stdlib.h\"\
    \n#include \"hardware/pio.h\"\n#include \"sqquarewave.pio.h\"\n```\n\n```\nint\
    \ main()\n{\n\tuint offset = pio_add_program(pio, &sqquarewave_program);\n\n\t\
    suint sm = pio_claim_unused sm(pio, true);\n\tspio_sm_config c = squarewave_program_default_config(offset);\n\
    \tsm_config_set_set_pins(&c, 2, 2);\n\tsm_config_set_out_pins(&c, 2, 2);\n\tpio_gpio_init(pio0,\
    \ 2);\n\tpio_gpio_init(pio0, 3);\n\n\tsm_config_set_clk_div_int_frac(&c, 255,\
    \ 0);\n\tpio_sm_init(pio0, sm, offset, &c);\n\tpio_sm_set_enabled(pio0, sm, true);\n\
    \n\tpio_sm_put_blocking(pio0, sm, 0xFEDCBA98);\n\treturn 0;\n}\n```"
  merge: -1
  pgno: 247
- img_proc: true
  md: "Notice that we need to set the SET and the OUT pins to be the same as we use\
    \ both set and out instructions in the PIO program. The final instruction sends\
    \ some arbitrary data to the TX FIFO and this is output two bits at a time to\
    \ the two GPIO lines, GP2 and GP3:\n\n![](img/470d59c61482018b86da50823ee18a57_248_0.png)\n\
    \nThe output stops when the OSR is empty but the out instruction keeps sending\
    \ zeros to the GPIO lines.\n\nIf you want to keep the data flowing, you have to\
    \ keep refilling the OSR. For example, you could change the C program to send\
    \ data to the buffer whenever there was a free space:\n\n```\nwhile (true)\n \
    \ pio_sm_put_blocking(pio0, sm, 0xFEDCBA98);\n}\n```\n\nNow the PIO program can\
    \ read new data from the TX FIFO whenever it to:\n\n```\n.program squarewave\n\
    set pindirs, 3    ; Set pin to output\npull block\n```\n\n```\njmp again\n```\n\
    \nIn this case we set the first pairs of bits to the output pins and then read\
    \ the TX FIFO into the OSR to get new data.\n\nOf course, usually you would use\
    \ all of the data in the OSR before reloading it. This standard task can be done\
    \ automatically with the autopull which reloads the OSR whenever its contents\
    \ fall below a threshold."
  merge: -1
