    \ the read function to retrieve.\nNotice that if the FIFO buffer became full,\
    \ the function would block until\nit it was cleared. As this is a loopback the\
    \ receiver automatically\naccepts data until it is full when it stops receiving\
    \ data. What this means is\n\n320"
