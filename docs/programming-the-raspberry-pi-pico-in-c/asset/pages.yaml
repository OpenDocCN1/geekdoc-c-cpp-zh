  md: '# Summary


    +   - There are a number of different types of electric motor, but DC brushed
    or brushless motors are the most used in the IoT.


    +   - Brushed motors can be speed controlled using a single transistor driver
    and a PWM signal.


    +   - For bidirectional control you need an H-bridge. In this case you need two
    PWM signals.


    +   - Servo motors set their position in response to the duty cycle of a PWM signal.


    +   - Brushless DC motors are very powerful and best controlled using off-the-shelf
    electronic modules. They are very powerful and thus dangerous if used incorrectly.
    They can be driven using a simple PWM signal.


    +   - Stepper motors are a special case of a Brushless DC motor. They move in
    discrete steps in response to energizing different coils.


    +   - A unipolar motor has coils that can be driven in the same direction for
    every step. A bipolar motor has coils that need to be driven in reverse for some
    steps.


    +   - Bipolar motors need two H-bridges to operate and four GPIO lines.


    +   - You can easily create a stepper motor driver using four GPIO lines.'
