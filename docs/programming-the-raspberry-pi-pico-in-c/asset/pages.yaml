  md: '# Chapter 1


    # The Raspberry Pi Pico - Before We Begin


    The Raspberry Pi Pico is a bold step for the Raspberry Pi world. It isn''t a full
    System On a Chip (SoC), but a microcontroller - a small system with a minimal
    operating system designed to control and connect to other devices. Its uses range
    from controlling washing machines to making games that use buttons and lights.
    Unlike the Raspberry Pi Zero, which is often used as a microcontroller, you can
    program it without having to struggle with Linux drivers and system commands.
    Perhaps more importantly, you don''t have to fight against the multi-tasking behavior
    of Linux which makes getting timing right difficult. Programming the Pico means
    you know exactly what is happening and when timing becomes so much easier. It
    doesn''t a solved problem, but it is easier. However, not having an operating
    system also brings its own problems and if you are used to working with the Pi
    Zero, you might well find there are times when you would like to make a Linux
    call to solve a problem. My opinion, and I hope you once you have read on, that
    is overall for the type of task the Pico is suited to, not having an operating
    system is a big point.


    As comparing the Pico to alternative microcontrollers, its big advantage is that
    it is powerful. It has a fast processor with enough memory to get jobs done. It
    also has many built-in peripherals and can talk to devices such as the PWM, I2C,
    SPI, UART and ADC without much trouble and, with the help of the innovative PIO
    (Programmable I/O), just about anything else, including custom interfaces and
    the 1-Wire bus.


    The PIO is a special feature of the Pico that is worth knowing sooner rather than
    later. It is a processor in its own right and while it is restricted to only a
    handful of instructions it is targeted at the very specific job of working with
    pulsed input and output. This means that you can often write a fairly simple program
    to enable the PIO to code and decode any protocol that is isn already supported.
    For example, in Chapter 14 we implement a 1-Wire bus protocol and extend the Pico


    to working with this popular class of device. It doesn''t just stop at new protocols.
    For example, if you find an I2C or SPI device that doesn''t quite fit into the
    very loose specifications of these two protocols, or goes beyond them'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'in some way, then you can implement custom versions. Going beyond the very
    practical, it is worth saying that programming the PIO is great fun and very educational.
    It gives you an insight into how assembly language works in general.


    At the moment the only negative aspect of the Pico is that it doesn''t have WiFi
    on board. This means, out of the box, it can''t be used as an IoT (Internet of
    Things) device as it can''t connect to the Internet. However this is easily fixed.
    In Chapter 17 we discover that it is simple and cheap to add an ESP8266 WiFi device
    via a single serial interface.


    A very important point about the Pico is that it is widely available. This might
    seem like a strange thing to say, but the Raspberry Pi Zero is still restricted
    to one customer and, as so, not really a good candidate for moving from a prototype
    to a commercial product. The Pico can be bought in any quantity and so can the
    chip it is built on. As so, it is suitable for a project that might graduate to
    a fully finished end product.


    This is a sketchy overview of what the Pico is all about. In the rest of the chapter
    we look at the details of the Pico and the things you need to get started.


    # The Pico And Its Family


    The Pico is based on the RP2040 processor chip which was designed by Raspberry
    Pi specially for the Pico. It is based on the ARM Cortex M0 and runs ARM machine
    code. The processor is available as a chip that purchased to build your implementation
    of a Pico-like device. Many other well known hardware companies, notably Arduino,
    have done just this and, if you want a Pico, you aren''t restricted to just the
    Raspberry Pi Pico, there are other choices. Some have extras on board:


    ![](img/470d59c61482018b86da50823ee18a57_13_0.png)'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'These alternatives to the Pico are easy to use because they operate just like
    the Pico. You can program them using the same SDK and the same environment. The
    only differences might be that the smaller form factors expose fewer hardware
    lines so you might not be able to use everything you can use on the full Pico.
    In the remainder of this book the programs target the Raspberry Pico, but they
    should just work or be easily modifiable for any device that used the RP2040.


    The key points about the Pico hardware are:


    +   - Dual-core Arm Cortex M0+ processor, flexible clock running up to 133 MHz

    - 264KB of SRAM and 2MB of on-board Flash memory

    - USB 1.1 with device and host support

    - Low-power sleep and dormant modes

    - Drag-and-drop programming using mass storage over USB

    - 26 × SPI, 2 × UART, 3 x 12-bit ADC, 16 × controllable PWM channels

    - Accurate clock and timer on-chip

    - Temperature sensor

    - Accelerated floating-point libraries on-chip

    - 8 × Programmable I/O (PIO) state machines


    ![](img/470d59c61482018b86da50823ee18a57_14_0.png)


    You could also consider the on-board LED, which is indicated on the diagram, as
    a key feature – it may be small, but it is very useful in getting started and
    testing.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# What To Expect


    There are no complete projects in this book – although some examples come very
    close and it is clear that some of them could be used together to create finished
    projects. The reason for this is that the focus is on learning how things work
    so that you can move on and do things that are non-standard.


    What matters is that you can reason about what the processor is doing and how
    it interacts with the real world in real time. This is the big difference between
    desktop and embedded programming. In the desktop world you don''t really care
    much when something happens, but when you are programming a physical system you
    can care very much.


    This is a book about understanding general principles and making things work at
    the lowest possible level. This knowledge isn''t always necessary when you are
    working on a relatively slow system, say, MicroPython, but it is always helpful
    for understanding what is going when things go wrong. When you are working directly
    with the hardware, speed matters and so does knowing what is happening.


    All of the examples are as basic as possible and the code is designed to be easy
    to understand as possible. In most cases this means avoiding the use of constants
    that appear from nowhere and functions that make it difficult to see the basic
    steps. Also error handling is reduced to a bare minimum – simple programs look
    complicated if you add error handling code. Of course, there is no reason to refactor
    these examples into something that looks more like production code and the effort
    in doing this is much less than getting the basic programs working in the first
    place.


    Rather than going through multiple configurations for a development environment,
    this book uses VS Code from the start. All of the setup and programming instructions
    are in terms of using VS Code. If you want to work in a different way then the
    documentation has instructions, but working with VS Code is a lot simpler and
    more powerful than using the command line.


    # What Do You Need?


    – A Pico at least! In fact you would be advised to buy at least two Picos, especially
    if you are going to be programming using a PC, Mac or Linux machine. The Pico
    is small and lacks an operating system, so running all of the software you need
    to create programs on it needs another machine – the development machine. The
    choice here is between all the other possible computers and a Raspberry Pi 4 or
    400. Using a Pi as the development machine has some big advantages - so much that
    you can consider it the standard and recommended way of doing things. The reason
    is'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'that the Pi has its own GPIO connections which makes it possible to download
    and debug programs running on the Pico without having to buy anything extra. The
    software installation instructions for the Pi are also simpler than for other
    machines. If you don''t want to work directly with a Pi then you can still program
    from the comfort of your desktop machine by using remote desktop to the Pi 4.


    If you opt to use a Pi 4 or 400 as your development system then you only need
    to buy a single Pico and you don''t need an extra to debugging. However, given
    the error-prone nature of such physical computing, I would still suggest buying
    more than one Pico, although I have never damaged one since I have been working
    with them.


    If you opt to use a PC, Mac or general Linux system then you really need to do
    GPIO connections and this makes it impossible to easily download and debug connections.
    The easiest solution in this case is to use a second Pico to act as a debug probe.
    The second Pico connects to your desktop machine via USB and to the Pico you are
    working with a basic three-wire debug connection. You also need to download some
    special PicoProbe software onto the first Pico, all of this is described in more
    detail in the next chapter. What matters at the moment is that you know you will
    need two Picos to develop if you are using a PC, Mac or general Linux.


    This isn''t quite true that the Pico has a "drag-and-drop" of loading programs
    using just a USB connection. This is much advertised as the easy way to get started,
    but in fact this is really all it is. Dragging-and-dropping programs means that
    you don''t need a second Pico to act as a download and debug probe. You simply
    connect the Pico you are using to the desktop machine via USB and while holding
    down the reset button. This makes it appear as folder on the desktop machine and
    you can drag-and-drop a program into the folder and it will start. The problem
    is that no debugging facilities are provides and the time wasted in restarting
    and dragging-and-dropping to the Pico is that it quickly becomes irritating and
    an impediment to getting anything done. If you are going to program anything more
    than a "Hello World" style "Blinky", you need to use a full debug connection and
    this should be considered the essential way to work.


    If you are not using a Pi 4/400 to develop and debug programs you need a second
    Pico to act as a debugging device.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'There is also the problem of how to connect to the Pico. As it comes, the Pico
    has no pins soldered to its PCB. For development you either need to buy a slightly
    upgraded Pico with pins already soldered or you need to solder your own. As well
    as the 40 pins on both sides of the Pico, you also need to solder three pins to
    the debug port at the edge opposite the USB port. Many off-the-shelf "kits" to
    fend for, so it is worth checking that the debug port is fitted or that you have
    three extra pins to solder yourself. Also notice if you are using a prototyping
    board to connect to the pins, you need to solder the debug pins on the other side
    of the Pico so that they are accessible while the Pico is plugged in:


    ![](img/470d59c61482018b86da50823ee18a57_17_0.png)


    As to additional hardware over and above the Picos, you will need a solderless
    prototype board and some mockup wires – known as Dupont wires. You will also need
    some LEDs, a selection of resistors, some 2N2222 or other general purpose transistors
    and any of the sensors used in later chapters. See the Resources page for this
    book on the I/O Press website for links. It is probably better to buy what you
    need as you choose to implement one of the projects, but an alternative is to
    buy one of the many "getting started" kits. You will probably still need to buy
    some extra components, however.


    ![](img/470d59c61482018b86da50823ee18a57_17_1.png)


    A solderless prototype board and some Dupont wires'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'While you don''t need to know how to solder, you will need to be able to hook
    up a circuit on a prototyping board. A multimeter (less than $10) is useful, but
    if you are serious about electronic projects, investing in a logic analyzer (less
    than $100) will repay itself in no time at all. You can get small analyzers that
    plug in via a USB port and use an application to show you what is happening. It
    is only with a multichannel logic analyzer that you have any hope of understanding
    what is happening. Without one and the slight skill involved in using it, you
    are essentially flying blind and left to just guess what might be wrong.


    ![](img/470d59c61482018b86da50823ee18a57_18_0.png)


    # A Low Cost Logic Analyzer


    Finally, if you are even more serious, then a pocket oscilloscope is also worth
    investing in to check out the analog nature of the digital signals that microcontrollers
    put out. However, if you have to choose between these instruments, the logic analyzer
    should be your first acquisition.


    It is worth noting that the Pico can generate signals that are too fast to be
    reliably detected by low-cost oscilloscopes and logic analyzers, which work at
    between 1MHz and 25MHz. This can mean that working with pulses much faster than
    1µs can be difficult as you cannot rely on your instruments. There are reasonably
    priced 200MHz and 500MHz logic analyzers and one of these is certainly worthwhile
    if you are serious about hardware. It is worth knowing that both instruments can
    mislead you if you try to work with signals outside of the range that they can
    work with.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'It is also assumed that you are able to program in a C-like language – Java,
    C#, Python are all similar to C and, of course, so is C++. There isn''t space
    in this book to teach C programming, but the programs are easy enough to follow
    and any out-of-the-ordinary coding is explained. If you want to learn C in detail,
    see Fundamental C:Getting Closer To The Machine,

    ISBN: 9781871926204.


    # Community


    If you get stuck the best place to ask for help is in the Pico forums or, second
    best, Stack Overflow. There are lots of people ready to help, but notice that
    programming the Pico in C is beyond the scope of most developers and you need
    to filter out attempts to be helpful by people who misunderstand your question.
    The quality of answers varies from misleading to excellent. Always make sure you
    evaluate what you are advised in the light of what you know. Be kind and supportive
    of anyone offering an answer that indicates that they misunderstand your question.


    You also need to keep in mind that the advice is usually offered from a biased
    point of view. The Python programmer will give you an answer that suits a system
    that uses Python and electronics beginners will offer you solutions that are based
    on "off-the-shelf" modules, when a simple alternative solution is available, based
    on a few cheap components. Even when the advice you get is 100% correct, it still
    isn''t necessarily the right advice for you. As a rule never follow any advice
    that you don''t understand.'
  merge: -1
