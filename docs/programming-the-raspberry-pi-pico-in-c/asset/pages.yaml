  md: "The C program is:\n#include \"pico/stdlib.h\"\n#include \"hardware/pio.h\"\n\
    \n#include \"sqwave.pio.h\"\n\n```\nint main() {\n    uint offset = pio_add_program(pio0,\
    \ &sqquare_program);\n    uint sm = pio_claim_unused_sm(pio0, true);\n    pio_sm_config\
    \ c = square_program_get_default_config(offset);\n\n    sm_config_set_pins(&c,\
