- img_proc: true
  md: "A better idea is to create two functions which read and write an array of bytes\
    \ to the device:\n\n```\nvoid writeBytes(PIO pio, uint sm, uint8_t bytes[], int\
    \ len){\n    pio_sm_put_blocking(pio, sm, 250);\n    pio_sm_put_blocking(pio,\
    \ sm, len-1);\n    for(int i=0;i<len;i++){\n        pio_sm_put_blocking(pio, sm,\
    \ bytes[i]);\n    }\n}\nvoid readBytes(PIO pio, uint sm, uint8_t bytes[], int\
    \ len){\n    pio_sm_put_blocking(pio, sm, 0);\n    pio_sm_put_blocking(pio, sm,\
    \ len-1);\n    for(int i=0;i<len;i++){\n        bytes[i]=pio_sm_get_blocking(pio,\
    \ sm) >> 24;\n    }\n}\n```\n\nUsing these two functions the interaction with\
    \ the One-Wire device starts to look a lot like using the SPI or I2C bus.\n\n\
    This is about a complex PIO program as you can implement. This raises the question\
    \ of what to do if you need something more complex? You might think that using\
    \ additional state machines might help, but you are still limited to 32 instructions\
    \ in total. There are two possible practical solutions. You can immediately executed\
    \ instructions put directly into the state machine from the C program. This works\
    \ for small tasks such as initialization. The second solution is more generally\
    \ useful. If you can split your program into small, less than 32 instructions,\
    \ modules then you can load one into PIO and another into the second PIO. This,\
    \ of course, occupies both PIOs and you cannot use a PIO for another task. For\
    \ example, you could use PIO to send data to a One-Wire bus device and the other\
    \ to receive data. This approach is limited to two modules, so a total of 64 instructions.\
    \ You can extend this to any number of modules if they can be reloaded into the\
    \ same PIO. For example, by splitting the One-Wire code into a receive and send\
    \ module you easily afford the time to load each module and set it up the same\
    \ PIO.\n\nThe current program can only work with a single device on the One-Wire\
    \ bus. If you want to support more, you could implement the search algorithm outlined\
    \ in Chapter 15 of Raspberry Pi IOT in C, Second Edition, though this is complex.\
    \ A simpler solution is to use one state machine and one GPIO per device. This\
    \ can support up to eight different One-Wire devices."
