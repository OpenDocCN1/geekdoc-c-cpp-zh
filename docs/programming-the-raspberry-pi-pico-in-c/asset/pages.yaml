  md: "# Initialization\n\nThere are two functions concerned with enabling and disabling\
    \ the SPI bus:\nsp_init (spi_inst_t *spi, uint baudrate)\nsp_deinit (spi_inst_t\
    \ *spi)\n\nYou can use spi_init to set the baud rate i.e. the clock rate, in Hertz.\n\
    it is worth mentioning at this point that the specification of the SPI controller\n\
    is in terms of its hardware address rather than a 0/1 index. A macro is\nprovided\
    \ so that you can use SPI0 and SPI1 in place of the addressees.\ncan also use:\n\
    \n```\nspi_get_index (spi_inst_t *spi)\n```\n\nto convert a hardware address to\
    \ a 0/1 index.\n\n# Configuration\n\nThere are a number of functions that you\
    \ can use to configure the way the\nbus works.\n\nThe set_baudrate function is\
    \ the best way of setting the baud rate\nbecause it returns the actual baud rate\
    \ set, usually the closest clock rate:\nuint\t\tsspi_set_baudrate (spi_inst_t\
    \ *spi, uint baudrate)\n\nThe set_slave slave function determines if the Pico\
    \ will act as a master or\nslave. The default is master:\nsp_set_slave (spi_inst_t\
    \ *spi, bool slave)\n\nThe most important function is:\nsp_set_format (spi_inst_t\
    \ *spi, uint data bits, spi_cpol_t cpol,\nsp_cha_t cpha, _unused spi_order_t order)\n\
    \nThis lets you set the number of data bits, and the SPI mode. Notice that for\n\
    t Pico the bit order can only be SPI_MSB_FIRST. The mode is set by\nSPI_CPOL and\
    \ CPHA using:\ndata latched on first clock transition\n\nSPI_CPHA_1 = data latched\
    \ on second clock transition\ntogether with:\n\nSPI_CPOL_0 = clock active high\n\
    or:\nSPI_CPOL_1 = clock active low"
