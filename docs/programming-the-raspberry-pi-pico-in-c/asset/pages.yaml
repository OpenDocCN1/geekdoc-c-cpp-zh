- img_proc: true
  md: 'If you don''t see this dialog box then you haven''t held down the BootSel button
    while the power is being applied. Now you can drag-and-drop the blink.uf2 file
    and you should see the on-board LED start to flash slowly.

    While this approach to running programs works for a first program, it isn''t a
    sustainable way to develop programs for the Pico. There are ways to make the job
    easier, for example by connecting a reset button that restarts the Pico without
    having to remove the power. However, none of these ways provides the sort of ease
    of use that you need test modifications to programs quickly, let alone debug them.
    So spending a little more time in setting up use a dedicated debug connection
    is very worthwhile.


    # Download And Debug Using A Pi 4


    Although using the USB file system is a reasonable way of running a first program,
    it really isn''t up to the job of developing any non-trivial program. To do this
    you need to set up an SWD connection. This has the advantage of allowing automatic
    download of programs and debugging. SWD, Serial Wire Debug, is a standard protocol
    for downloading programs and for debugging them on devices based on the Cortex
    M processor – like the Pico.


    The Pico has a debug connector at the bottom edge composed of the three pins:


    ![](img/470d59c61482018b86da50823ee18a57_31_0.png)


    This is a three-wire interface consisting of ground, clock and data lines. These
    have to be connected either to another SWD three-wire interface or to three general
    purpose GPIO lines that have been programmed to work as an SWD interface.'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'If you are using a Pi 4 to program the Pico then three GPIO lines is the simpler
    option. By default the pins used are GND, GPIO24 and GPIO25:


    | Pi 4 | Pi Pico |

    |---|---|

    | GND (Pin 20) | SWD GND |

    | GPIO24 (Pin 18) | SWDIO |

    | GPIO25 (Pin 22) | SWCLK |


    These are best connected using direct jumper wires between the two boards to make
    sure there is no noise or disturbance. To make this easy, solder three pins onto
    the side of the board away from the prototyping pins.


    ![](img/470d59c61482018b86da50823ee18a57_32_0.png)


    You also need to supply the Pico with a USB power connection, but this USB connection
    isn''t used to download your program. Once you have the Pico connected in this
    way you can test it using the command line. However, moving directly to using
    VS Code is also very easy and you might want to skip to it:

    openocd -f interface/raspberrypi-swd.cfg -f target/rp2040.cfg -c "program /home/pi/pico/blinky/build/blinky.elf
    verify reset exit"


    This assumes you have compiled the blinky program earlier and you are logged on
    user pi. Change the command if this isn''t correct. It also assumes that you have
    OpenOCD installed. Notice that the SWD download makes use of the .elf file and
    not the .uf2 file.'
  merge: -1
