  md: "# How Fast\n\nOnce you have the basic facilities working, the next question\
    \ is always how fast does something work. In this case we need to know what sort\
    \ of data rates we can achieve using this ADC. The simplest way of finding this\
    \ out is to use the fastest loop for a channel:\n\n```\nfor(;;){\n    int data=readADC(0x5);\n\
    }\n```\n\nWith the clock of 500kHz the sampling rate is measured to be 17kHz.\
    \ This is perfectly reasonable as it takes at least 24 clock pulses to read the\
    \ data. Most of the time in the loop is due to the 24 clock pulses, so there is\
    \ little to be gained from optimization.\n\nIncreasing the clock rate to 1MHz\
    \ pushes the sampling rate to 32kHz, which is just fast enough to digitize audio,\
    \ as long as you don't waste too much time in the loop in processing.\n\nChanging\
    \ the clock rate to 2MHz pushes the sampling up to 55kHz, which is fast enough\
    \ for most audio, but notice that this is more than the recommended clock rate\
    \ at 3.3V.\n\nAlso notice that as the clock rate goes up, you have to ensure that\
    \ the voltage source is increasingly low-impedance to allow the sample-and-hold\
    \ to charge in a short time."
  merge: -1
  pgno: 210
- img_proc: true
  md: "# Summary\n\n+   - The Pico has a single ADC with four inputs. It is subject\
    \ to a lot of noise from the power supply and circuits around it which reduces\
    \ its accuracy.\n\n+   - You can read individual input lines or set a round-robin\
    \ read to make regular measurements.\n\n+   - Making SPI work with any particular\
    \ device has four steps:\n  1. Discover how to connect the device to the SPI pins.\
    \ This is a matter of identifying pinouts and mostly what chip selects are supported.\n\
    \  2. Find out how to configure the PI's SPI bus to work with the device. This\
    \ is mostly a matter of clock speed and mode.\n  3. Identify the commands that\
    \ you need to send to the device to get it to do something and what data it sends\
    \ back as a response.\n  4. Find, or work out, the relationship between the raw\
    \ reading, the voltage and the quantity the voltage represents.\n\n+   - The MCP3000\
    \ range of A-to-D converters is very easy to use SPI.\n\n+   - You can read data\
    \ at rates as fast as 55KHz which is fast enough for some audio applications."
