- img_proc: true
  md: '# Chapter 6


    # Simple Input


    There is no doubt that input is more difficult than output. When you need to drive
    a line high or low you are in command of when it happens, but input is in the
    hands of the outside world. If your program isn''t ready to read the input, or
    if it reads it at the wrong time, then things just don''t work. What is worse,
    you have no idea what your program is doing relative to the event you are trying
    to capture. Welcome to the world of input.


    In this chapter we look at the simplest approach to input – the polling loop.
    This may be simple, but it is a good way to approach many tasks. Chapter 8 we
    look at more sophisticated alternatives – events and interrupts.


    # GPIO Input


    GPIO input is a much more difficult problem than output from the point of view
    of measurement and verification. For output at least you can see the change in
    the signal on a logic analyzer and know the exact time that it occurred. This
    makes possible to track down timing problems and fine tune things with good accuracy.


    Input on the other hand is “silent” and unobservable. When did you read the status
    of the line? Usually the timing of the line is with respect to some other action
    that the device has taken. For example, you read the input line 20µ after setting
    the output line high. But how do you know when the input line changed state after
    20 microseconds? The simple answer is in most cases you dont.


    In some applications the times are long and/or unimportant but then we may need
    some strategies for monitoring and controlling events. The usual rule of thumb
    is to assume that it takes as long to read a GPIO line as it does to set it. This
    means we can use the delay mechanisms that we looked at with regard to output
    as well.


    One common and very useful trick when you are trying to get the timing of input
    correct is to substitute an output command to a spare GPIO line and monitor it
    with a logic analyzer. Place the output instruction just before the'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'input instruction and where you see the line change on the logic analyzer should
    be close to the time that the input would be read in the unmodified program. You
    can use this to debug and fine tune then remove the output statement.


    # Basic Input Functions


    We have already met the functions that sets a GPIO line to input or output:

    gpio_set_function (uint gpio, GPIO_FUNC_SIO)

    or:


    gpio_init (uint gpio)

    After both we have a GPIO line set to software control and initialized to input.

    You can also set the direction:

    gpio_set_dir (uint gpio, bool out)


    The line is set to output if it is true and input if it is false.

    Once to input, the GPIO line is high impedance, it won''t take very much current,
    no matter how you connect it to. However, notice the Pico 3.3V logic and will
    not exceed this value on an input line – for a full discussion of how to work
    with input see the previous chapter.


    You can read it through your input setting:

    static bool gpio_get (uint gpio)


    This is all there is using a GPIO line as an input, apart from the details of
    the electronics and the small matter of interrupts. Notice that the function works
    even if the GPIO line is set to output – it reads the current level of the line
    as high or low.


    There is:

    static uint32_t gpio_get_all ()

    which will read the state of all of the GPIO lines in a single operation.


    As introduced in the previous chapter you can also set the internal pull-up or
    pull-down resistors using one of:


    +   - gpio_pull down (uint gpio)

    - gpio_pull up (uint gpio)

    gpio_set_pulls (uint gpio, bool up, bool out)


    The pull-up/down resistors are between 50 and 80kΩ.

    If you want a pure push-pull mode you can turn off the resistors using:

    gpio_disable_pulls (uint gpio)'
  merge: -1
