  md: '# Summary


    +   - The Pico has 34 GPIO lines in total. Four are used to interface to flash
    memory and of the remainder, GP0 to GP29, the Pico makes 26 available for general
    use on the edge of the board.


    +   - Some of the GPIO lines have alternative functions and these are best avoided
    if all you need a simple GPIO input/output line.


    +   - The only GPIO line that doesn''t have another important function is GP22
