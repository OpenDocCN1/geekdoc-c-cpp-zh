  md: 'This function will allow you to print whatever you want, not just the words
    “Try This”.


    Now let''s break down the various aspects of the program that is set out above.
    There are several different aspects of this language that you have to take in
    consideration. Each aspect is important in getting it to run, and if you do not
    execute them entirely.


    **Headers**- There are several headers out there for C++, and all of them are
    necessary or at the very least useful to your programming operations. However,
    for most functions you will see the header that is above <iostream>. When you
    use a header be sure to enclose it properly, and put **#include** before it to
    prompt the program to use that header.


    **Namespace**- Namespaces are a fairly new addition to C++, only coming about
