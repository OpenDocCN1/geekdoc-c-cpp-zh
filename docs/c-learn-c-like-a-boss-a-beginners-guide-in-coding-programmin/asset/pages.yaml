- pgno: 54
  md: "When you choose to use the decimal point to represent these literals, you need\
    \ to make sure that you are adding in at least the decimal, although adding in\
    \ the exponent is good as well. When you are representing through the exponential\
    \ form, you should include either the fractional part, the integer part, or both\
    \ of them. The signed exponent that you are using should also be started with\
    \ either E or e.\n\nSome of the floating point literals that you are able to use\
    \ in your code writing include:\n\n```\n    .e55   //these are illegal because\
    \ they are missing the fraction or the integer\n    21of.  //these are illegal\
    \ because they don't have the exponent or the decimal\n    51oE   //these are\
    \ illegal because they have an incomplete exponent\n    314159E-5L  //these are\
    \ legal\n    3.15159//these are legal\n```\n\n# **Boolean Literals**\n\nThe next\
    \ type of literal that we can discuss are the Boolean literals. There are two\
    \ types that you will be able to use inside of your C++ code. Basically the Boolean\
    \ values are going to be shown as either true or false. If the conditions that\
    \ you set out are true, the Boolean expression is going to come out as true. On\
    \ the other hand, if the conditions that you set out are not met, you are going\
    \ to end up with a condition that is false. All of the answers when they are Boolean\
    \ will come out either true or false.\n\n# **Character Literals**"
