    \ Methods are especially important because without them, your program would not\
    \ know what it is supposed to do with the variable that you give it. It would\
    \ just sit there like a dud and do nothing.\n\n**Instant Variables**- These refer\
    \ to each individual object. Each object is classified with a unique set of these\
    \ variables that act as a fingerprint for an object. These variables are assigned\
    \ to the object by using values that occur whenever the object is created.\n\n\
    Now that you know the four main definitions of programming. Let's take a look\
    \ at a code that you can write that will print out: **“Try This”**. Unlike the\
    \ example above, this will explain a little more in depth what you are wanting\
    \ to do, and the reason for each function.\n\n```\n```cpp\n#include <iostream>\n\
    \nusing namespace std;\n\n// main() [this is when the program will begin to execute.]\n\
    \nint main()\n{\n    cout << \"Try This\"; // [Prints Try This]\n\n    return\
    \ 0;\n}\n```\n```"
