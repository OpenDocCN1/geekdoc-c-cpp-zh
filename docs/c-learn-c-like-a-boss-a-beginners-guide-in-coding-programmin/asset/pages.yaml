    # Three Important Components of C++


    The standard C++ is made up of three very important concepts.


    +   - **Core Language:** This is made up of all the variables, data types, literals,
    and other important aspects of the language, creating building blocks to get to
    the next level

    +   - **C++ Standard Library:** this allows you to manipulate files, and other
    workings within the language, and bend them to your will.

    +   - **STL:** This stands for Standard Template Library, which gives you functions
    to manipulate data structures and variables and other things of the sort.


    # Why is C++ considered the best language out there?


    Well, aside from the copiously mentioned flexibility, speed, and simplicity, it
    is a language that has spanned over thirty years, and is still widely used today.
    There are not many products in any genre of life out there that can say the same.
    Products and companies come and go, but only true perfection stays. Well that
    is how the saying goes. To be honest, C++ has had many updates since then, but
    the core process is still the same. When it came out it was light years ahead
    of its time, and today it is still a pretty advanced piece of technology, due
    to the updates that keep it on top.'
