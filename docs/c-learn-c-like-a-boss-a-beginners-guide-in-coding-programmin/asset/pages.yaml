    # ## Program Comments


    So, there are going to be times when you will want to write some comments inside
    of your code. These are important because they allow you to leave a little message
    inside the code so that others who are reading through it later on will be able
    to get a good look at exactly how your code is ran and also provide “referral”
    to what you’re trying to accomplish in your code. Furthermore, leaving notes within
    the lines of your code is a good way to notify yourself where a code might have
    gone wrong. By putting comments inside your codes, you are more likely to know
    where you succeed or where you went wrong.


    These comments can be as simple or as complex as you would like. Some people will
    just place in one or two words if that is all that is needed to help out the other
    users, but there are other times when you are going to need to combine a few more
    lines into the mix to ensure that it is all going to work out and that the other
    person understands what is going on inside of the code.


    In this language, you will just need to use the // symbol in order to show that
    you are writing out a comment. You can make it as long as you would like, just
    make sure that when the comment is done, you skip to the next line so that the
    program knows that it is supposed to start reading through it again.'
