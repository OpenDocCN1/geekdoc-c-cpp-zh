    instructs the program to start executing the main function of the program, and
    start the out put process. It is essential that you set up the main function command,
    otherwise your program will not know what it is supposed to be running, nor will
    it know when it is supposed to run. This will be seen as a single line comment
    inside the program and it is going to tell the program that the main function
    is beginning.


    **INT main**- This is where the function execution officially begins. If you do
    not include this, the entire process will stop, because you did not introduce
    the variables, and without the variables, the program is lost.'
