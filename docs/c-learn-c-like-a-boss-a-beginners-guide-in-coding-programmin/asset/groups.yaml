  mdcn: "\n## 第2章：开始吧\n\n让我们开始吧！我们可以从很多地方入手，但先来谈谈环境。虽然你并不真的需要搭建自己的环境，因为网上有很多现成的环境。环境是你所选择的编译器，它接收你的代码并为你完成所有功能。在过去，你必须打开命令提示符并创建一个可用的环境，但那样的日子已经一去不复返了。当年，一个简单的错误就可能对他们的计算机造成严重损坏。现在，你可以练习一些有风险的命令，而不会对你的设备造成任何风险。\n\
    \n互联网上有很多示例可以尝试和使用。要试用它们，最简单的去处是 http://www.compileonline.com。选择底部的“学习C++”选项，它就会带你到达需要去的地方。\n\
    \n这里有一个示例可以尝试。输出应该是“Try This”这两个词。\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main ()\n{\n    cout << \"Try This\";\n    return 0;\n}\n```\n\n\
    现在，你可以选择将这些代码直接输入编译器，也可以编写多个代码并保存到计算机上，随时访问，这样就不必每次想摆弄它们时都重新输入。你可以使用几种不同类型的文本编辑器。不过，其中一些编辑器是特定于设备类型的。这意味着它们只能在你创建代码的那种设备类型上运行。\n\
    \n你可以使用的文本编辑器有 OS 编辑命令、Brief、EMACS、epsilon、Windows 记事本、vim 或 vi。不过，只有 vim 和 vi\
    \ 可以跨平台使用。确保将文件保存为 .c 或 .cpp 扩展名。\n\n在考虑转向编译器之前，你应该先在文本编辑器中起草程序的初稿。这是因为一旦进入编译器，你的程序就更容易出错，而且不易发现。然而，如果你在文本编辑器中把程序布局得整洁明了，那么在编译器中进行操作就不会有任何问题。\n\
    \n### C++ 编译器\n\n市面上有很多不同的编译器，其中不少都相当昂贵。这些编译器是为那些已经掌握了低级编译器的精英程序员准备的。初学者只需要一个基本的编译器，而这些大多数都是免费的。然而，就像任何免费的东西一样，你必须小心你所得到的东西。市面上糟糕的廉价编译器比好的要多，所以，在免费的表象之下，我建议你为初始页面之外的其他功能付费。这些额外功能通常也非常便宜，所以你不需要为此倾家荡产。\n\
    \n最流行的编译器之一是 GNU C/C++ 编译器。它最常用于 UNIX 和 Linux 系统。要查看你是否已经安装了该编译器，请在 UNIX/Linux\
    \ 应用程序中打开命令行并输入以下内容：\n\n```bash\n$ g++ -v\n```\n\n如果编译器已安装，你应该会在屏幕上看到以下信息：\n\n\
    ```text\nUsing built-in specs.\nTarget: i386-redhat-linux\nConfigured with: ../configure\
    \ --prefix=/usr ......\nThread model: posix\ngcc version 4.1.2 20080704 (Red Hat\
    \ 4.1.2-46)\n```\n\n如果屏幕上没有出现这条信息，说明编译器未安装在计算机上，或者你安装不正确，你需要重新操作，确保正确安装。\n\n在本书中，我们将介绍如何在\
    \ Windows 平台上安装。如果你使用不同的平台，则应访问 http://gcc.gnu.org/install/ 并阅读如何将其下载到你的平台上的说明。\n\
    \n要在 Windows 计算机上安装此编译器，你首先需要安装 MinGW。这个软件能让编译器与你的计算机兼容，拥有这个软件非常重要，否则你甚至根本无法下载编译器。\n\
    \n要安装此软件，你可以访问该软件的主页 www.mingw.org，让它带你到需要去的地方。安装该软件后，你至少应该安装 gcc core、gcc-g++、MinGW\
    \ runtime 和 binutils，当然，如果你愿意，也可以安装更多。安装完成后，你就可以在 Windows 的命令行中运行所有 GNU 工具了。\n\
    \n现在你已经万事俱备，可以运行了，接下来就可以开始进一步学习如何运行这些程序本身。\n\n### 基本语法\n\nC++ 不仅可以定义为程序，还可以定义为一组通过调用其他方法进行集体通信的对象。在使用\
    \ C++ 时，你首先应该知道以下四件事的含义。\n\n- **类（Class）** - 这是一个模板或蓝图，规定了对象及其支持类型，并描述对象的行为。这意味着对象会根据其行为以及动作/支持被归类到符合该对象描述的类中。\n\
    - **对象（Object）** - 对象具有行为和状态。例如，你看到一只狗，它就有状态。这些状态可以分为颜色、品种、名字、品种标准（AKC/AKA/APC\
    \ 注册机构）。“狗”也表现出某些行为。它们摇尾巴、吠叫、喘气、吃干狗粮，还会在院子外面上厕所。这些特性使狗成为一个*独特的对象*。这些对象被归类到一个个组中，你猜到了，那就是类。\n\
    - **方法（Method）** - 这是行为的另一种说法。你可以在类中根据需要设置任意多或少的方法。所有数据的操作、动作的执行以及所有逻辑的编写都在这里进行。方法尤其重要，因为如果没有方法，你的程序就不知道该如何处理你给它的变量。它只会像一块废铁一样呆在那里，什么也不做。\n\
    - **实例变量（Instance Variables）** - 这些变量指的是每一个具体的对象。每个对象都用一组独特的变量进行分类，这些变量就像对象的指纹。这些变量是通过对象创建时出现的值赋给对象的。\n\
    \n既然你已经知道了编程的四个主要定义，让我们来看一段代码，你可以用它打印出：**“Try This”**。与上面的示例不同，这段代码会稍微深入解释你想要做什么，以及每个函数的原因。\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\n// main() [this is when\
    \ the program will begin to execute.]\n\nint main()\n{\n    cout << \"Try This\"\
    ; // [Prints Try This]\n\n    return 0;\n}\n```\n\n这个函数允许你打印任何你想要的内容，不仅仅是“Try\
    \ This”这两个词。\n\n现在，让我们分解一下上面程序的各个方面。你需要考虑这种语言的几个不同方面。每个方面对于让它运行起来都很重要，如果你没有完全执行它们，程序就无法运行。\n\
    \n- **头文件（Headers）** - C++ 中有多种头文件，所有头文件都是必要的，或者至少对你的编程操作非常有用。不过，对于大多数功能，你都会看到上面提到的\
    \ `<iostream>` 头文件。使用头文件时，请确保正确地将它括起来，并在前面加上 `#include`，以提示程序使用该头文件。\n- **命名空间（Namespace）**\
    \ - 命名空间是 C++ 中比较新的特性，直到 2011 年的更新才出现。除了指定使用哪个命名空间之外，它们没有太多作用。虽然它们不是必需的，但它们可以避免你在程序功能上产生很多困惑。它们只是作为一种更有条理地组织函数的方式。\n\
    - **主函数（Main）** - 这是主函数开始的地方。使用 `// main()` 这一行会指示程序开始执行主函数，并开始输出过程。设置主函数命令至关重要，否则你的程序将不知道它应该运行什么，也不知道应该在什么时候运行。这会被视为程序中的单行注释，并告诉程序主函数即将开始。\n\
    - **int main()** - 这是函数执行正式开始的地方。如果你没有包含这一部分，整个进程将停止，因为你没有引入变量，而没有变量，程序就会迷失方向。\n"
