  mdcn: "\n如果对上面的问题把答案填成5，那它不会正确，系统会判定这个答案是错误的。\n\n由于 if 语句相当基础，你会发现，如果用户输入错误答案，它并没有做好准备。在这个阶段，如果用户为上面的示例输入除4以外的任何数字，屏幕只会变成空白，什么也不会发生。下一类语句会讲得更深入，并展示如何根据用户输入系统的内容来获得答案。\n\
    \n### if else 语句\n\n现在，正如我们上面稍微讨论过的，使用 if 语句时可能会出现一些限制。如果用户输入错误答案，屏幕只会变成空白，这在系统中可能会很麻烦。此外，有时用户需要输入各种答案，例如当他们输入自己的年龄，而你想把这些年龄区分开时。他们的年龄不一定错误，但如果你只想要21岁以上的人，你就要确保在这个过程中能正确显示某个答案。\n\
    \n为了处理 if else 语句，一个可用的良好语法包括：\n\n```cpp\nif(boolean_expression)\n{\n    // statement(s)\
    \ will execute if the boolean expression is true\n}\nelse\n{\n    // statement(s)\
    \ will execute if the boolean expression is false\n}\n```\n\n你可以按自己的意愿在语句中加入任意多个这样的结构。因此，如果你想做一个把人们分成五个不同年龄组的程序，你可以根据语法中更多的“else”来设置。这会让你更容易加入其他一些选择。\n\
    \n所以让我们保持简单。假设系统中有 2 + 2。如果用户猜答案是4，你可以在第一部分把它设为真语句，然后屏幕上会显示“答对了！干得好！”这条消息。但如果用户输入答案5（或除4以外的任何其他答案），你可以让屏幕上显示“抱歉，这不是正确答案”这样的消息。\n\
    \n这在你处理代码中想做的事情时给了你很大的自由。你将能够在这个过程中加入一些不同的东西，并且可以真正扩展你正在编写的代码。\n\n在处理这些内容时，你还可以记住另一点：你可以把一些\
    \ if 语句和一些 if else 语句相互嵌套。对初学者来说，这可能会变得有点复杂，但经过一些练习，你会发现它会给整个过程增加很大的能力，并能让你更容易地在这个编程语言中实现你想要做的一些事情。\n\
    \n使用 if 语句和 if else 语句可以让你的编程体验好得多。它允许系统根据用户输入系统的内容做出决定，而不必有人在旁边亲自操作。一定要尝试几种不同类型的语句，看看它们在你的代码中、以及在你想要做的事情中会如何发挥作用。\n\
    \n## 第6章：常量和各类字面量\n\n这门语言很复杂，尽管你上面学到的内容足以运行一些简单函数，但这门语言还有太多部分，如果不在这里加入更深入的知识来帮助你过渡到下一步，那简直是一种罪过。\n\
    \n如果你想成功掌握这门语言，就要准备好花很长时间努力钻研。虽然它对初学者来说是一门好语言，因为它有多个难度层次，但你也必须努力才能进入下一层次。你越尝试学习，附加的效果就越难。\n\
    \n编程本身是一个漫长而艰难的过程，但它绝对值得，因为有很多职业都需要 C++ 知识。从游戏设计到机器人工作等等。只要涉及技术，很可能就涉及 C++。\n\n\
    所以，这里还有一些你可以学习的步骤，以及一些你需要知道、以便开始掌握这门语言的更重要的函数。\n\n### 常量和字面量\n\n常量和字面量是学习 C++\
    \ 的重要部分。它们涉及数据类型以及这些数据类型中的变量。它们是常量，不能被更改。\n\n当你选择用小数点来表示这些字面量时，需要确保至少加入小数点，不过加入指数也很好。当你用指数形式表示时，应该包括小数部分、整数部分或两者都包括。你使用的带符号指数也应该以\
    \ E 或 e 开头。\n\n你在编写代码时可以使用的一些浮点字面量包括：\n\n```cpp\n.e55        // these are illegal\
    \ because they are missing the fraction or the integer\n210f        // these are\
    \ illegal because they don't have the exponent or the decimal\n510E        //\
    \ these are illegal because they have an incomplete exponent\n314159E-5L  // these\
    \ are legal\n3.14159     // these are legal\n```\n\n### 布尔字面量\n\n接下来我们可以讨论的字面量类型是布尔字面量。在\
    \ C++ 代码中，你可以使用两种类型。基本上，布尔值会显示为 true 或 false。如果你设定的条件为真，布尔表达式的结果就是 true。另一方面，如果你设定的条件没有得到满足，你最终会得到一个为\
    \ false 的条件。当答案是布尔值时，所有答案都会以 true 或 false 的形式出现。\n\n### 字符字面量\n\n当你在代码中看到字符字面量时，你会注意到它们用单引号括起来。它们可以很简单，比如用\
