    \ C++；不妨随意尝试，看看自己喜欢什么。\n\n## 第5章：在 C++ 中使用运算符\n\n无论你计划使用哪种编程语言，学会使用运算符都很重要。它们可以帮助你告诉程序你想做什么，并让你处理自己的代码轻松得多。在你的程序中，可以使用四种主要类型的运算符，它们各自会以不同方式告诉程序如何运行。在\
    \ C++ 语言中，你可以使用的一些运算符包括：\n\n- 逻辑运算符\n- 算术运算符\n- 赋值运算符\n- 关系运算符\n\n我们来看看其中一些运算符如何工作，以及在使用\
    \ C++ 语言编写代码时，如何让它们发挥良好作用。\n\n### 逻辑运算符\n\n本指南中我们要使用的第一类运算符是逻辑运算符。它们可以帮助你比较输入系统中的某些部分。你可以使用的一些逻辑运算符包括：\n\
    \n- (||)：这被称为逻辑或。使用这个运算符时，如果你的一个操作数不为零，条件就会为真。\n- (&&)：这个被称为逻辑与。如果你有两个操作数且它们都不为零，条件就为真。\n\
    - (!)：这是逻辑非。你可以用它来反转操作数的状态。因此，如果条件最终为假，这个符号会使其变为真。\n\n### 算术运算符\n\n你可以使用的另一类运算符是算术运算符。这些基本上和在学校里做数学一样。你会告诉程序对你提供的信息进行加法、减法和其他运算。你可以使用的一些算术运算符包括：\n\
    \n- (+)：这是加法运算符，会将你选择的两个操作数相加。\n- (-)：这是减法运算符。它会取右侧操作数，并从左侧操作数中减去它。\n- (*)：这个运算符使得在\
    \ C++ 语言中可以进行乘法运算。\n- (/)：这个运算符帮助你在 C++ 中进行除法运算。\n- (++)：这是自增运算符。它会把你的操作数的值增加一。\n\
    - (--)：这是自减运算符。它会把操作数的值减少一。\n\n### 赋值运算符\n\n赋值运算符可以让你更轻松地为变量指定名称，并有助于在你编写的代码的不同部分中进行搜索、保存等操作。你在\
    \ C++ 中可能会使用的一些赋值运算符包括：\n\n- (=)：这个运算符是简单赋值运算符。它会将右侧操作数的值赋给左侧操作数。\n- (+=)：这个称为加且赋值运算符。它会将两个操作数的值相加，然后将它们的和赋给左侧操作数。\n\
    - (*=)：这是乘且赋值运算符。它会将两个操作数相乘，然后把结果赋给左侧操作数。\n- (-=)：这个运算符会从左侧操作数中减去右侧操作数的值，然后将差值赋给左侧操作数。\n\
    - (/=)：这是除且赋值运算符。它会用左侧的值除以右侧的值，然后将这个结果赋给左侧。\n\n还有一些其他赋值运算符可用，但它们更高级，因此我们只保留这些基础运算符，以帮助保持条理！\n\
    \n### 关系运算符\n\n在使用 C++ 语言时，关系运算符非常有用。你可以使用的一些运算符包括：\n\n- (==)：这个运算符会检查你的两个操作数是否相等。如果它们相等，条件将为真。\n\
    - (>)：这个运算符会检查操作数的值。如果左侧操作数大于右侧操作数，条件将为真。\n- (<)：这个运算符基本上与上面的运算符相反。如果你发现左侧操作数的值小于右侧操作数，条件将为真。\n\
    - (!=)：这个运算符会检查你的两个操作数是否相等，如果值不相等，条件就为真。\n- (<=)：这个运算符会检查左侧操作数是否小于或等于右侧操作数。如果满足这个条件，条件就为真。\n\
    - (>=)：这个运算符会检查左侧操作数的值是否大于或等于右侧操作数。如果为真，条件就为真。\n\n## 第6章：帮助 C++ 做出决策\n\n有时你需要让程序为你做出决策。你可以根据用户输入计算机的信息，以及你决定条件为真所需满足的内容，设置程序以某种方式行动。在这个系统中，决策功能稍微高级一些，但你会发现它很容易学习，并且会为你打开许多可以在\
    \ C++ 系统中运用的思路。我们来看看你可以做哪些事情来帮助系统自行做出决策。\n\n### switch 语句\n\n我们要在这个系统中处理的第一种决策是\
    \ switch 语句。这些语句很好用，因为它们允许你将变量的相等性与一组值（或情况）进行比较。你试图检查的变量将与每个情况进行比较。你可以使用的一个很好的语法示例如下：\n\
    \n```cpp\nswitch(expression) {\n    case constant-expression:\n        statement(s);\n\
    \        break; // optional\n    case constant-expression:\n        statement(s);\n\
    \        break; // optional\n        // you can add in as many of these case statements\
