  mdcn: "\n定义数据类型。\n\n| 类型 | 关键字 |\n|---|---|\n| 宽字符 | `wchar_t` |\n| 无值 | `void`\
    \ |\n| 双精度浮点数 | `double` |\n| 浮点数 | `float` |\n| 整数 | `int` |\n| 字符 | `char` |\n\
    | 布尔值 | `bool` |\n\n你可以使用的大多数数据类型都可以用以下修饰符之一来修改，以提供帮助：\n\n- long\n- short\n- unsigned\n\
    - signed\n\n### 变量类型（续）……\n\n在编程语言中使用变量时，你提供了一些存储空间，使程序更容易操作。你使用的所有变量都会关联到不同的类型，而这些类型将决定变量内存的布局和大小。它还会设定你能够存储在该内存空间中的值范围。\n\
    \n变量命名与标识符命名类似。你只能用字母或下划线来命名，并且字母区分大小写。但在此之后，你可以随意使用任何数字、字母和字符。\n\n再次说明，下面更详细地列出你可以使用的基本变量：\n\
    \n- wchar_t：这是宽字符类型。\n- void：这表示没有类型。\n- double：这是具有双精度的浮点值。\n- float：这是具有单精度的浮点数。\n\
    - int：这是整数。\n- char：这通常只占一个字节，是一种整数类型。\n- bool：这用于处理真或假的值。\n\n你还可以定义其他类型的变量。这些变量包括指针、数组、引用、枚举、数据结构和类。\n\
    \n### 创建新行\n\n现在你已经了解了数据类型和修饰符，以及如何在程序中添加注释，接下来该学习如何创建新行了。这是许多新程序员都会遇到的问题。他们在输入中把程序排得整整齐齐，但输出仍然挤在一起，非常凌乱。这是因为他们没有正确地创建新行。记住，空白会被忽略，所以你不能只是跳过一个空行，就指望程序里也会跳过一行。你必须向编译器表明你想开始新的一行。这非常重要，因为当你运行程序时，你希望它顺利运行。你不会想看到像这样的输出。\n\
    \n试试这个 我今天吃了披萨，还做了数学。6=(7-1) 这就是我今天学到的。\n\n你可能更希望看到这样。\n\n试试这个  \n今天我吃了披萨，还做了数学\
    \  \n6=(7-1)  \n这就是我今天学到的\n\n为了做出这种区分，你必须使用正确的函数，因为编程正是依赖于使用正确的函数。\n\n要创建换行，你必须使用函数\
    \ endl;；它会表明你想要换行，而且如果你不想添加空白，甚至可以不加，不过建议加上，因为这会让你的程序更便于人阅读。\n\n例如，这样：\n\n```cpp\n\
    {\n    cout << \"Try This\" << endl;\n    cout << \"Today I ate Pizza and did\
    \ Math\" << endl;\n    cout << \"6=(7-1)\" << endl;\n    cout << \"That is what\
    \ I learned today\" << endl;\n    return 0;\n}\n```\n\n看起来比这样好多了：\n\n```cpp\n\
    {\n    cout << \"Try This\" << endl; cout << \"Today I ate Pizza and did Math\"\
    \ << endl; cout << \"6=(7-1)\" << endl; cout << \"That is what I learned today\"\
    \ << endl;\n    return 0;\n}\n```\n\n你能看出这会让阅读代码的人多么困惑吗？你希望你的代码文件易于阅读，这样如果别人需要修复某些东西，就能轻松找到错误所在。如果所有内容都乱七八糟地挤在一起，那他们也无法轻易找到任何东西，不是吗？\n\
    \n你也可以使用 \\n 来表示换行。它与 endl; 相同，但输入起来快得多。你可以任选一种方法，但选定后就要坚持使用。\n\n### C++ 基础知识的重要性\n\
    \n我知道你在想什么：为什么刚开始学就必须知道所有这些琐碎信息？原因是，如果你现在不学，你就不会觉得自己将来会需要它们；而当你阅读别人写的程序时，你就会纳闷那些额外字符是什么意思，以及为什么有那么多空白。养成处理这些简单却有些繁琐的任务的习惯，对于掌握更复杂的编程方法至关重要。就像掌握任何一门语言一样，你必须掌握基础知识，才能掌握专家级概念。\n\
    \n### 变量定义\n\n变量定义会指示编译器要创建变量、存储多少内容以及存储在何处。它指定数据类型，并列出该类型的一个或多个变量。例如\n\n```cpp\n\
    type variable_list;\n```\n\n你必须使用上面列出的有效数据类型。它们可以包含一个或多个标识符名称，只要用逗号分隔即可，例如\n\n\
    ```cpp\nint j, k, l;\nchar c, ch;\nfloat f, salary;\n```\n\n下面是设置。你应该有一句话、一道数学题，然后使用上述整数给出这道数学题的答案。所有变量都可以由你自己编造，想设成什么就设成什么。\n\
    \n```cpp\n#include <header>\n\nusing namespace std;\n\nint main ()\n{\n    int\
    \ _ = ;\n    int _ = ;\n    int _ = _ + _;\n\n    cout << \"\" << endl;\n    cout\
    \ << \"\" << endl;\n    cout << \"int_\" << endl;\n\n    return 0;\n}\n```\n\n\
    只需输入你的数字，并确保数字相加正确。完成之后，重新运行代码，而不要依赖复制粘贴那些不含整数的代码。这样，你将对变量以及 C++ 中基本整数运算的使用有基本理解。\n\
    \n## 第 4 章：数组、循环和条件\n\n信不信由你，你已经学到了很多。基础知识其实并不难，现在只需再学习一些内容，并把一个概念接一个概念地组合起来，确保你成为更优秀的\
    \ C++ 程序员。我们继续吧。\n\n### 数组\n\n数组是 C++ 中的一种数据结构，能够存储类型基本相同且大小固定的元素。基本上就是一组相同类型的变量。与其使用单个变量，不如声明一个变量数组，例如数字。为此，你使用\
    \ 0 到 99 这些编号，并通过数组索引访问每一个元素。\n\n数组将是连续的内存位置。最低地址始终对应第一个元素，最高地址则对应最后一个元素。\n\n\
    ### 初始化数组\n\n你可以逐个初始化数组，也可以使用单条语句初始化。例如\n\n```cpp\ndouble balance[5] = {1000.0,\
    \ 2.0, 3.4, 17.0, 50.0};\n```\n\n方括号中的数字不能超过你使用的元素数量。这意味着，当数组大小只指定为五个元素时，你不能有六组数字。但是，如果你不指定大小，就会创建一个大小刚好合适的数组。你会这样写：\n\
    \n```cpp\ndouble balance[] = {1000.0, 2.0, 3.4, 17.0, 50.0};\n```\n\n这会创建与前一个示例完全相同的数组，只是你没有指定数组大小，因此系统为你创建了它。相当巧妙。\n\
    \n现在你已经知道如何编写数组，接下来该把它放入实际程序中了。这个程序比之前的程序稍微高级一些，并且有更多元素。你可以在 www.compileonline.com\
    \ 上查找这些元素。你会被引导到许多教程，甚至还有可下载的 PDF 文件。\n\n下面是你的程序分配数组的公式。\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n\n#include <iomanip>\n```\n\n一遍又一遍地执行它。这些语句会一个接一个地执行。循环语句会让你更容易按所需次数执行这些语句。\n\
    \n循环有四种类型。这些循环处理不同的需求。\n\n### while 循环\n\nwhile 循环会在满足某个条件时持续重复循环。每次重新开始循环周期时，它都会测试这个条件，直到条件不再为真为止。\n\
    \n写成这样\n\n```cpp\nwhile (condition)\n{\n    statement(s);\n}\n```\n\n### for 循环\n\
    \n这种循环会反复执行一个语句序列，同时简化管理循环变量的代码。\n"
