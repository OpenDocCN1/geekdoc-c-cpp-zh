    The garbage collector is an optional service; if we do not want to use it, our
    application can rely on a reference counting mechanism. This system employs a
    novel technique for delayed release that considerably minimizes the work required
    for human reference counting.


    When writing, the iPhone did not support the automatic garbage collector.


    ## C INSIDE


    The Objective-C programming language is an object-oriented extension and superset
    of the `C` programming language. This implies that the raw power of `C` is available
    and that `C` libraries may utilize it directly. Furthermore, because Mac OS X,
    a `UNIX` system, is written mainly in `C` and Objective-C for higher-level components,
    this offers a symbiotic relationship between the language and the operating system.


    ## C++ FLUENT


    Objective-C is more than just a `C` superset; it can also comprehend and execute
    `C++` code. In this configuration, the language is known as Objective-C++ and
    allows for combining Objective-C and `C++` code statements. It also enables the
    usage of `C++` libraries directly.


    ## SIMPLICITY


    Objective-C Smalltalk-inspired’s object structure favors simplicity. Many of the
    traits that make languages complex (templates, overloading, multiple inheritances,
    etc.) are absent from Objective-C, which leverages its dynamic nature to enable
    easier programming paradigms.


    ## ACCESS TO APPLE’S PRODUCTS


    Each new version of Mac OS X through Objective-C, and now the iPhone OS, is packed
    with intriguing new features that can access directly from Objective-C. This significantly
    improves the usability of Objective-C.


