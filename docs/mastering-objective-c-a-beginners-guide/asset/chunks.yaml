    The Foundation framework’s NSError class handles error handling in Objective-C
    programming.


    An NSError object has more extensive and expandable error information than an
    error code or error text. An NSError object has three basic properties: an error
    domain (represented as a text), a domain-specific error code, and a user info
    dictionary that contains application-specific information.


    ## NSError


    In Objective-C programs, NSError objects convey information about runtime errors
    that users should be aware of. A program will often display this error information
    in a dialog or sheet. It may, however, analyze data and either request that the
    user attempt to recover from the error or attempt to resolve the problem on its
    own.


    The NSError Object is made up of the following components:


    *   Domain: The error domain cannot be null and must be one of the predefined
