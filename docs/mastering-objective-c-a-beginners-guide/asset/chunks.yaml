    ## VARIABLES IN OBJECTIVE-C


    Variable is the name given to a storage place that our programs may use. Each
    variable in Objective-C has a type that governs its memory size and organization,
    the range of values it may hold, and the set of operations that can be performed
    on it.


    The name of a variable can consist of characters, numbers, and the underscore
    character. Begin with a letter or underscore. Upper and lowercase letters differ
    because Objective-C is case-sensitive.


    | Sr. No. | Type and Description |


    | --- | --- |


    | 1 | charA single octet is single (one byte). It is an integer type. |


    | 2 | intThe most natural integer size for the machine. |


    | 3 | floatA single precision floating-point value. |


    | 4 | doubleA double precision floating-point value. |


    | 5 | voidRepresents the lack of type. |


    The Objective-C programming language also provides many types of variables, which
    we will go over in detail in the following chapters, such as Enumeration, Pointer,
    Array, Structure, Union, and so on. In this part, we will look at fundamental
    variable kinds.


    ## VARIABLE DEFINITION


    A variable definition in Objective-C instructs the compiler where and how much
    storage to produce for the variable. As seen below, a variable description explains
    a data type and provides a list of one or more variables.


    A type must be a valid Objective-C data type in this example, such as char, wchar,
    int, float, double, bool, or any user defined object. There may be one or more
    identifier names in the variable list, separated by commas. Here are some instances
    of legitimate declarations.


    The line int e, f, g; declares and defines the variables e, f, and g, and instructs
    the compiler to construct int variables e, f, and g.


    Variables can be initialized in their declaration (given an initial value). As
    shown below, the initializer consists of an equal sign followed by a constant
    expression.


    Variables with static storage lifetime are automatically initialized with NULL
    when defined without an initializer (all bytes have the value 0). On the other
    hand, all other variables have an uncertain beginning value.


    ## VARIABLE DECLARATION


    A variable declaration ensures the compiler that at least one variable of the
    given type and name exists, enabling the compiler to proceed with further compilation
    without demanding more information. A variable declaration is only relevant during
    compilation; the compiler needs the actual variable declaration when linking the
    program.


    When using several files, a variable declaration is required. We define our variable
    in one of the files available during program linking. The extern keyword will
    use to specify a variable at any position. Variables in Objective-C applications
    be declared several times, but they may only be defined once per file, function,
    or code block.


    **Example:** Consider the following example: variables are declared at the top
    but defined and initialized within the main function.


    A similar concept applies to function declarations, in which we supply a function
    name at the time of declaration and its exact definition afterward. The following
    example employs a C function, and as we all know, Objective-C supports C-style
    functions.


    ## LVALUES AND RVALUES


    There are two types of expressions in Objective-C.


    *   lvalue: “lvalue” expressions are those that relate to a memory location. An
    assignment can have an lvalue on either the left or right side.


    *   rvalue: An rvalue is a data value stored in memory at a specific address.
    Because an rvalue is an expression that cannot assign a value, it can appear on
    the right but not the left side of an assignment.


    Variables are lvalues and can thus appear on the assignment’s left side. Numerical
    literals cannot be allocated and cannot appear on the left-hand side since they
    are rvalues. This is an accurate statement:


    ## **CONSTANTS IN OBJECTIVE-C**


    Constants are values that the program cannot change during execution. These values
    are also referred to as literals.


    Integer constants, floating constants, character constants, and string literals
    are all examples of fundamental data types. There are also enumeration constants.


    Constants are handled the same as regular variables, except that their values
    are not changed after they are defined.


    ## INTEGER LITERALS


    A decimal, octal, or hexadecimal constant can be used as an integer literal. A
    prefix indicates the base or radix: 0x or 0X for hexadecimal, 0 for octal, and
    nothing for decimal.


    A literal number can also have a suffix of U or L, which stands for unsigned or
    long, respectively. Write the suffix in any order, using uppercase or lowercase
    letters.


    Integer literals are used in the following examples.


    Other examples of Integer literals are shown below.


