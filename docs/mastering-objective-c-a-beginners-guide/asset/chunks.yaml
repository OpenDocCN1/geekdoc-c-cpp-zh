    错误域（error domain）错误代码的命名空间。单个域内的代码必须是唯一的，尽管它们可能与其他域的代码重叠。域提供了有关问题来源的信息，并避免了代码冲突。四个主要的内置错误域是
    `NSMachErrorDomain`、`NSPOSIXErrorDomain`、`NSOSStatusErrorDomain` 和 `NSCCocoaErrorDomain`。Apple
    大多数标准 Objective-C 框架在 `NSCCocoaErrorDomain` 中包含错误代码；然而，某些框架定义了自己的错误域（例如 `NSXMLParserErrorDomain`）。


    如果我们需要为自己的库和应用程序生成新的错误代码，应该始终向我们的错误域添加新的错误代码；绝不扩大任何已有的错误域。创建我们的域是一项简单的任务。由于域本质上是字符串，我们必须定义一个与应用程序其他任何错误域都不冲突的字符串常量。Apple
    建议域采用 `com.<company>.project>.ErrorDomain` 的形式。


    ## 检测错误


    语言中没有用于处理 `NSError` 对象的结构（尽管有几个内置类专为处理它们而设计）。它们的设计旨在与函数配合使用，函数在成功时返回对象，失败时返回 nil。捕获错误的典型方法如下：


    1.  创建一个名为 `NSError` 的变量。它不需要分配或设置。

    2.  将此变量作为双指针（double pointer）传递给可能出错的函数。如果发生问题，函数将使用此引用来记录任何错误。

    3.  检查函数的返回值以查看其是否成功。如果操作失败，我们可能会使用 `NSError` 来处理或显示错误。


    函数通常不返回 `NSError` 对象；相反，如果成功，它返回预期的结果，失败则返回 nil。要发现问题，始终使用函数的返回值；永远不要使用 `NSError`
    对象的存在与否来判断操作是否成功。错误对象的设计是为了表示可能的错误，而不是告诉我们是否发生了错误。


    我们首先创建一个指向 `~/Desktop/SomeContent.txt` 的文件路径。然后，我们创建一个 `NSError` 引用并将其提供给 `stringWithContentsOfFile:encoding:error:`
    函数，以记录加载文件时遇到的任何问题。我们提供了一个指向 `error` 指针的指针，这意味着该函数请求一个指向指针的指针（即双指针）。这使得过程能够提供变量的内容。最后，我们查看返回值（而不是检查错误变量是否存在）来查看
    `stringWithContentsOfFile:encoding:error:` 是成功还是失败。如果成功，我们可以处理 `content` 变量的值；否则，我们使用错误变量显示有关发生错误的信息。


    ## 自定义错误


    我们可以通过接受 `NSError` 对象的双引用并填充填充我们的数据来建立自定义错误。记住，你的函数或方法应该根据其成功与返回对象或空（不要返回 `NSError`
    引用）。下面的示例使用错误而不是异常处理发送到 `generateRandomInteger()` 函数的错误输入。由于 `error` 是双指针，我们可以在方法内部初始化底层值。


    使用 `if (error!= NULL)` 来验证用户是否提供了有效的 `error` 参数是重要的。这在生成错误的函数中完成。由于 `error` 参数是双指针，`error`
    参数可能会为所引用的变量分配值。再次，我们检查返回值是否有错误（`if (result == nil)`），而不是检查错误变量。


    `NSError` 的 `localizedDescription`、`localizedFailureReason` 以及相关特征存储在它的 `userInfo`
    字典中，使用特殊键如 `NSLocalizedDescriptionKey`、`NSLocalizedFailureReasonErrorKey` 等。因此，要定义问题，我们只需向适当的键添加一些字符串，如前面的示例所示。


    我们应该为某些错误域和代码提供常量，以保证类之间的一致性。


    ## Objective-C 语言特性


    以下是我认为有助于 Objective-C 成为一种优秀且有趣的编程语言的元素列表。


    ### 类都是对象


    每个 Objective-C 类都是运行时自动生成并管理的元类（meta-class）的实例。类方法可以创建类，类可以作为参数传递，类可以存储在集合中，等等。要产生一个实例，我们只需向想要实例化的
    Objective-C 类发送消息。没有必要重新设计“工厂”系统。在语言级别，不需要特定的构造函数机制。这有助于语言保持基础且高效。此外，元类也是对象。


    ### 动态类型


    与 Ruby、Python、Smalltalk 和 Groovy 类似……这非常有用，因为我们并不总是知道运行时对象会是什么。在 Objective-C 中使用动态类型非常简单。例如，这指定了一个可能持有对象引用的变量：


    ### 可选静态类型


    尽管如此，Objective-C 也提供了静态类型。它是兼顾两者的者。这定义了一个可以持有 `NSView` 或子类对象引用的变量：


    ### 分类 (Categories)


    我们可以使用分类来创建新方法，并将它们添加到我们不知道源代码的类中（例如 Apple 提供的标准 Cocoa 类）。这使得在不需要子类的情况下进行类扩展成为。对于根据我们想要使用或设计的框架要求自定义现有类非常有用。


    ### 消息传递


    消息是我们与对象通信的方式。通常，消息的接收者有一个与消息直接匹配的方法（即具有相同的名称，或在 Objective-C 术语中具有相同的选择器 selector）。在这种情况下，方法将被调用。然而，这并不是唯一的结论。对象还可以通过将消息转发给另一个对象、广播给多个对象、对其进行内省、应用自定义逻辑等来处理消息。


    ### 消息表达语法


    Objective-C 的消息模式类似于带有空格的自然语言句子（以冒号前缀）。当我们编写代码向对象发送消息时，我们用真实数据填充空白以构建一个逻辑语句。这种表达消息的方式借用自
    Smalltalk，并增强了代码的表达力。


    例如，向有序集合发送消息，请求插入索引为 12 的项：


    一个消息发送表达式可以被视为一个句子，接收者为主语，消息是句子的剩余部分（例如，我们希望接收者执行的操作）：“在 myCollection 的索引 12 处，插入
    myObject。”


    ### 内省 (Introspection)


    对象内省很容易的。例如，我们可能使用以下语法向对象询问它的类：


    检查对象是否具有方法“fooo”：


    请求对象方法“foo0”的签名：


    确定一个类是否是另一个类的子类：


    ### 动态运行时


    Objective-C 的运行时是动态的。它允许消息的动态生成、向现有类动态添加方法、更改方法的实现等。


    ### 自动垃圾回收


    在在它的线程上，自动垃圾回收器与应用程序代码协作。它使用分代方法，通过关注更有可能包含垃圾的内存区域来提高性能。它与 `NSAllocateCollactable()`
    函数及相关方法分配的对象和原始 C 内存块兼容。`malloc()` 函数按预期工作，允许访问收集器不保留的内存。

