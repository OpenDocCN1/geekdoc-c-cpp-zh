    ## WHAT DOES COMPILER DO


    In this part, we’ll look at what a compiler does and how we may utilize it to
    our advantage.


    In general, the compiler has two tasks: translating our Objective-C code into
    low-level code and assessing our code to ensure there are no errors.


    Xcode now includes `Clang` as the compiler. We may read `Clang` anywhere we write
    a compiler.


    `Clang` is a tool that analyzes Objective-C code and converts it to a lower-level
    representation that mimics assembly code: LLVM Intermediate Representation (`LLVM
    IR`).


    `LLVM IR` is low-level and independent of operating systems. LLVM converts instructions
    into native bytecode for the target platform. This may be done either just in
    time or concurrently with compilation.


    The advantage of having those LLVM instructions is that you can produce and execute
    them on any platform that LLVM supports. For example, suppose we develop an iOS
    app. In that case, it will automatically operate on two entirely different architectures
    (Intel and ARM), and LLVM will translate the IR code into native bytecode for
    both systems.


    LLVM has a three-tier design, which means it supports a wide range of input languages
    (including C, Objective-C, and C++, as well as Haskell) in the first tier, a shared
    optimizer in the second tier (which optimizes the `LLVM IR`), and many targets
    in the third tier (e.g., Intel, ARM, and PowerPC). If we want to add a language,
    concentrate on the top layer; if we want to add another compilation target, don’t
    worry too much about the input languages.


