    ## 优点


    - 该语言是作为现代 C 编译器的 `GCC` 预处理器包而开发的。

    - Objective-C 与 `C++` 的兼容性更好。

    - Objective-C 更稳定。

    - Objective-C 使使用私有 API 更加容易。


    ## 缺点


    - 与 `C++` 不同，Objective-C 不支持运算符重载。

    - Objective-C 的第一个版本不支持垃圾收集，但它仍然使用基于 `-` 的运行时，这增加了程序的大小。

    - 它需要头文件才能正常工作，因为它依赖于 `C` 编译器。

    - Objective-C 是一门相当困难的语言，考虑到它的历史，这是预料中的。


    ## 我们应该选择 Objective-C 吗？


    即使对这两种语言的主要特征进行简单检查，也能证明 `Swift` 优于 Objective-C。此外，Objective-C 相比 `Swift` 的优势之一最近已被移除。


    `Swift` 5 是该编程语言的最新版本，现在具有 `ABI` 稳定性，这是实现卓越性能和安全的关键一步。`Swift` 缺乏 `ABI` 稳定性直到最近一直是备关注的问题，尽管现在已经得到了解决。


    随着最新 `Swift` 版本的发布，Apple 正在鼓励开发者在未来的 `iOS` 应用中使用。这是合理的，因为这种更年轻的语言相比较旧且更具挑战性的 Objective-C
    有许多优势。


    ## 2022 年学习 Objective-C 的意义何？


    大多数 `macOS`、`XCode` 和 `iOS` 的内核代码是用 `C` 和 `C++` 编写的。因为 Objective-C 并不是编程语言，而是纯
    `C` 的庞大预处理器，所以它与它们“契合”得。


    Apple 的整个生态系统都是构建在 Objective-C 之上的。`Swift` 主要基于它。要从内部理解系统如何工作，以及为什么 `Swift` 会像那样出现和运行，就需要理解“基础”。Objective-C
    有助于理解某些概念，例如并不是所有的 `NSProxy` 对象都是 `NSObject`，以及 `Int`、`NSInteger` 和 `NSNumber`
    之间的区别。此外 `Swizzling` 如何工作、`Selector` 是什么、响应链如何工作等。`Swift` 固地包含并抽象了这些内容，因此并不显而易见。此外，Objective-C
    与任何 `C` 语言一样，有助于了解链接、指针和内存的底层行为知识。


    ## 在开发中，Objective-C 仍然被使用


    首先，似乎任何持续超过两三年的项目都包含 Objective-C 代码。它可能是一个隐藏的依赖层，不符合通用代码库，但它确实存在并需要定期维护：修复 Bug
    和增强功能。


    虽然特定的程序无法在 `Swift` 中重构，但这样做需要业务部门和客户都不准备投入的时间和资金。因此，Objective-C 的数据库正在不断增长。


    第三，由于抽象程度低于 `Swift` 的语言被用于涉及网络、内存和设备资源的复杂操作。可能是 Objective-C、`Objective-C++` 或仅仅是
    `C` 和 `C++`，取决于所需的抽象级别。


    ## OBJECTIVE-C 中的 BLOCKS


    Objective-C 中的类是某种将数据与相关功能相结合的对象。有时，指定单个任务或动作单元比指定一组方法更佳。


    Blocks 是一个添加到 `C`、Objective-C 和 `C++` 中的语言级特性，允许我们创建不同的代码块，并将它们像值一样传递给方法和函数。因为
    blocks 是 Objective-C 对象，所以它们应该被添加到 `NSArray` 或 `NSDictionary` 等集合中。它们还可以捕获其他作用域的值，使其类似于其他编程语言中的闭包（closures）或
    lambda 表达式。


