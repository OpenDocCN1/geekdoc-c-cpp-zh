    ## 模运算符


    模运算符由百分号（`%`）表示，在本节介绍的最后一个算术运算符。分析 `Program` 的结果来尝试弄清楚这个运算符是如何工作的。


    注意 `main` 中的语句，它在一行内声明并初始化了变量 `p`、`q`、`r` 和 `s`。众所知，`NSLog` 使用紧跟百分号的字符来指示如何打印后续参数。然而，如果百分号后面跟着另一个百分号，`NSLog`
    过程将其解释为你确实想要显示一个百分号。程序会生成一个 `%` 符号并将其插入输出的相应位置。


    如果我们确定模运算符 `%` 的功能是交付第一个值除以第二个值的余数，那么我们是正确的。在第一种情况下，`25` 除以 `5` 的余数为 `0`。如输出的第二行所示，`25`
    除以 `10` 得到余数 `5`。如第三行输出所示，`25` 除以 `7` 得到余数 `4`。


    现在，看上一个语句中评估的算术表达式。在 Objective-C 中，两个整数值之间的任何操作都是使用整数算术完成的。因此，两个整数相除产生的任何余数都会丢弃。公式
    `p/s` 表示 `25` 除以 `7` 得到一个中间值 `3`。当这个数字乘以 `s` 的值（即 `7`）时，中间结果是 `21`。


    最后，通过加上 `p/s` 除法产生的余数（由短语 `p % s` 表示），得到了 `25` 的最终结果。意料之中的是，这个值与变量 `a` 的值相同。通常，只要
