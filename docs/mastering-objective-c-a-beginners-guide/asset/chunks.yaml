    ### Bit Fields


    Data may be packed into a structure using Bit Fields. This is especially useful
    when memory or the data storage is at a limit.


    Packing many things into a machine word, for example. Flags of one bit can compress.


    If the file format is not standard, it can be read in. Consider 9-bit integers
    as an example.


