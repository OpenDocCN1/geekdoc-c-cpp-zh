    # STRUCTURE IN OBJECTIVE-C


    Arrays in Objective-C allow us to create variable types that can hold many data
    objects of the same kind. Nonetheless, the structure is another user-defined data
    type available in Objective-C programming that allows us to blend data items of
    different types.


    Data is represented using structures. Let’s say we want to maintain track of your
    library books. We might want to keep the following aspects of each book in mind:


    * Title

    * Author

    * Book ID

    * Subject


    ### Creating a Structure


    To define a structure, use the `struct` statement. The `struct` command generates
    a new data type with several members for our code. The `struct` statement format
    is given below:


    Each member definition in Objective-C is a standard variable definition, such
    as `int`, `float`, or any other acceptable variable definition, and the structure
    tag is optional. Although it is not required, we can declare one or more structural
    variables after the structure’s definition but before the final semicolon. This
    is how we would describe the `Book` structure.


    ### Access to Structure Members


    The member access operator is used to acquire access to any structure member (`.`).
    In Objective-C, the member access operator is represented by a period between
    the name of the structure variable and the name of the structure member we want
    to access. The `struct` keyword would use to define variables of the structure
    type. The following example shows how to use structure.


    ### Function Arguments as Structures


    Like any other variable or pointer, a structure can be sent as a function argument.
    We’d access structural variables the way we did in the previous example.


    ### Pointers to Structures


    We may define pointers to structures in the same manner that we define pointers
    to any other variable, as seen below:


