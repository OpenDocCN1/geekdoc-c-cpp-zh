    以下示例演示了如何在程序中处理多个分数。将一个分数设置为 3/4，另一个设置为 4/7，并在 `Program` 中显示它们。


    ![](img/ufig2_5.jpg)


    ### 设置分数的分子和分母。


    ### 访问实例变量和数据封装


    我们已经看到处理分数的的方法可能如何通过名称直接访问 `numerator` 和 `denominator` 实例变量。在实际上，实例方法在各种情况下都非常有用。


    另一方面，类方法无法直接访问其实例变量，因为类方法仅处理类本身，而不是它的任何实例。如果我们需要从不同的位置（即从我们的主程序内部）访问实例变量，该怎么办？


    我们无法直接做到这一点，因为数据封装是一个核心概念，它描述了数据对我们是隐藏的这一事实。它允许编写类定义的人扩展和修改这些定义，而不必担心程序员（即类用户）是否在扰动类的内部工作机制。数据封装在编码员和类开发者之间增加了一层保护。


    我们可以通过编写自定义方法来设置和获取这些值，从而整洁地访问实例变量。为了设置 `Fraction` 类两个实例变量的值，我们创建了 `setNumerator:`
    和 `setDenominator:` 方法。我们需要额外创建两个方法来访问这些实例变量的值。例如，我们将构建名为 `numerator` 和 `denominator`
    的两个新方法来访问作为消息接收者的 `Fraction` 的相应实例变量。


    我们返回匹配的整数值作为结果。我们两个新方法的声明如下：


    这里是一些定义：


    值得注意的是，方法名称与它们访问的实例变量名称是相同的。这并不是问题（尽管初看起来可能很奇怪）；这是正常做法。程序对我们的两个新方法进行了测试。


    此 `NSLog` 语句标明了向 `my_Fraction` 发送两个消息的结果：第一个用于获取分子的值，第二个用于检索分母的值：


    结果，`numerator` 消息将在初始消息调用时传递给 `Fraction` 对象 `my_Fraction`。代码将返回该方法中该分数的 `numerator`
    实例变量的值。记住，方法在运行时的上下文是消息接收者对象。当 `numerator` 方法访问并返回 `numerator` 实例变量的值时，就获取并返回了
    `my_Fraction` 的 `numerator` 值。返回的整数值随后提供给 `NSLog` 并在其中显示。


    第二个消息调用将调用 `denominator` 方法，以访问并返回 `my_Fraction` 的 `denominator` 值，该值随后将提供给 `NSLog`
    显示。


    此外，设置实例变量值的方法通常称为 **setter**（访问），而获取实例变量值的方法称为 **getter**（访问器）。`Fraction` 类的 setter
    是 `setNumerator:` 和 `setDenominator:`，而 getter 是 `numerator` 和 `denominator`。setter
    和 getter 结合使用时也被称为访问技术（accessor techniques）。


    确保我们理解 setter 和 getter 之间的区别。由于 setter 的功能是接收一个参数并将相关的实例变量设置为该参数的值，因此 setter 不返回值。在这种情况下，不应返回任何值。setter
    通常不返回值，因为它们的功能是设置实例变量的值。另一方面，getter 用于“获取”存储在对象中的实例变量的值并将其返回应用程序。为了实现这一点，getter
    必须使用 `return` 语句来返回实例变量的值。


    再次，数据封装的概念规定，我们无法从类提供的方法之外直接设置或接收实例变量的值。相反，我们必须构建 setter 和 getter 方法来实现。因此，我们必须采用策略来获取通常对“外部世界”隐藏的数据。这为实例变量提供了集中访问机制，并间接防止了其他代码修改这些值，使应用程序更难以阅读、调试和编辑。


    值得注意的是，还有一种名为 `new` 的技术，它结合了 `alloc` 和 `init` 操作。因此，这行代码可能被用于分配并初始化一个新的 `new`。


    通常优于使用两步分配和初始化策略，以便理解认知上正在发生的两个特定活动：我们创建一个新对象，然后初始化它。


