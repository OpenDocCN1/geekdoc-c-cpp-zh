    ## Objective-C 左值和右值 (OBJECTIVE-C Lvalues AND Rvalues)


    Objective-C 中有两种类型的表达式。


    * 左值：lvalue 表达式是与内存位置相关的。赋值可以在左侧或右侧具有左值。

