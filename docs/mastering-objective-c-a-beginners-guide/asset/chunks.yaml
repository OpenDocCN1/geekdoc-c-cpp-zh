    A variable is a name assigned to a storage location that our programs may access.
    In Objective-C, each variable has a type that governs the amount and layout of
    the variable’s memory, the range of values stored inside that memory, and the
    set of operations that can apply to the variable.


    A variable’s name can be letters, numbers, and an underscore character. It must
    start with a letter or an underscore. Because Objective-C is case-sensitive, upper
    and lowercase letters are different.


