    A namespace for error codes is what an error domain is. Codes within a single
    domain must be unique, though they may overlap with codes from other domains.
    Domains provide information about an issue’s source and avoid code clashes. The
    four principal built-in error domains are `NSMachErrorDomain`, `NSPOSIXErrorDomain`,
    `NSOSStatusErrorDomain`, and `NSCCocoaErrorDomain`. Most of Apple’s standard Objective-C
    frameworks include error codes in the `NSCCocoaErrorDomain`; however, some frameworks
    define their error domains (e.g., `NSXMLParserErrorDomain`).


    We should always add new error codes to our error domain if we need to produce
    new error codes for your libraries and apps; we should never enlarge any established
    error domains. It is a straightforward task to create our domain. Because domains
    are simply strings, we must define a string constant that does not conflict with
    any of the application’s other error domains. Apple suggests that domains be in
    the form `com.<company>.project>.ErrorDomain`.


    ## Detecting Errors


    There are no language constructs for dealing with `NSError` objects (though several
    built-in classes are designed to handle them). They are designed to be used in
    conjunction with functions that return an object when successful and nil when
    failing. The typical method for capturing mistakes is as follows:


    1. Make a variable called `NSError`. It requires no allocation or setup.

    2. This variable should be sent as a double pointer to a possibly error-prone
    function. If something goes wrong, the function will use this reference to log
    any errors.

    3. Check the function’s return value to see if it was successful or not. If the
    action fails, we might use `NSError` to handle or display the error.


    A function usually does not return an `NSError` object; instead, it returns the
    intended result if it succeeds and nil if it fails. To find issues, always use
    the function’s return value; never use the presence or absence of an `NSError`
    object to establish if an action was successful. Error objects are designed to
    represent a possible error, not to tell whether or not one occurred.


    We begin by creating a file path to `~/Desktop/SomeContent.txt`. Then, we create
    an `NSError` reference and provide it to the `stringWithContentsOfFile:encoding:error:`
    function to record any problems encountered when loading the file. We’ve supplied
    a pointer to the `error` pointer, indicating that the function asks a pointer
    to a pointer (i.e., a double pointer). This enables the procedure to supply the
    variable’s content. Finally, we look at the return result (rather than the lack
    of the error variable) to see if `stringWithContentsOfFile:encoding:error:` succeeded
    or failed. If it does, we may work with the value of the `content` variable; otherwise,
    we use the error variable to display information about what went wrong.


    ## Custom Errors


    We can establish custom errors by accepting a double reference to an `NSError`
    object and populating it with our data. Remember that your function or method
    should return either an object or null based on its success (do not return the
    `NSError` reference). The following example handles incorrect inputs sent to the
    `generateRandomInteger()` function using an error instead of an exception. Noting
    that the `error` is a double-pointer, we may initialize the underlying value inside
    the method.


    Using `if (error!= NULL)` to validate that the user has provided a valid `error`
    parameter is important. This is done in error-generating functions. Because the
    `error` parameter is a double-pointer, the `error` parameter may assign a value
    to the referenced variable. Again, we examine the return value for errors (`if
    (result == nil)`) instead of the error variable.


    The `localizedDescription`, `localizedFailureReason`, and associated characteristics
    of `NSError` are stored in its `userInfo` dictionary using special keys such as
    `NSLocalizedDescriptionKey`, `NSLocalizedFailureReasonErrorKey`, and so on. So,
    to define the problem, we just add some strings to the appropriate keys, as seen
    in the preceding sample.


    We should offer constants for certain error domains and codes to guarantee consistency
    between classes.


    ## Objective-C Language’s Features


    Here is a list of elements that, in my opinion, contribute to Objective-C being
    a good and interesting programming language.


    ### Classes are objects


    Each Objective-C class is an instance of a meta-class generated and managed automatically
    by the runtime. Class methods may create, classes can be sent as arguments, classes
    can store in collections, and so on. To produce an instance, we simply send a
    message to the Objective-C class we wish to instantiate. It is not necessary to
    redesign a “factory” system. At the language level, no specific constructor mechanism
    is necessary. This contributes to the language remaining basic and effective.
    Furthermore, meta-classes are objects.


    ### Dynamic Typing


    In the same vein as Ruby, Python, Smalltalk, and Groovy… This is quite useful
    because we don’t always know what our runtime objects will be. It is simple to
    use dynamic typing in Objective-C. For example, this specifies a variable that
    may hold a reference to an object:


    ### Optional Static Typing


    Nonetheless, Objective-C provides static typing as well. It’s the best of both
    worlds. This defines a variable that can hold a reference to an `NSView` or a
    subclass object:


    ### Categories


    We may use categories to create new methods and add them to classes whose source
    code we do not know (such as the standard Cocoa classes provided by Apple). This
    makes class expansion possible without the requirement for subclassing. Very useful
    for customizing existing classes to the requirements of frameworks we wish to
    use or design.


    ### Message Sending


    Messages are how we communicate with objects. Typically, the message’s receiver
    has a method that directly matches the message (i.e., that has the same name or,
    in Objective-C terms, the same selector). The method will be invoked in this case.
    However, this is not only possible conclusion. An object can also handle a message
    by forwarding it to another object, broadcasting it to multiple objects, introspecting
    it, applying custom logic, and so on.


    ### The Syntax for Expressing Messages


    The message patterns of Objective-C are comparable to natural language sentences
    with gaps (prefixed with colons). When we write code to send a message to an object,
    we fill in the blanks with real data to construct a logical statement. This expressing
    message is borrowed from Smalltalk and enhances the code’s expressiveness.


    Sending a message to an ordered collection, for example, requesting that an item
    at index 12 be inserted:


    A message sending expression can be regarded as a sentence, with the receiver
    as the subject and the message as the remainder of the sentence (e.g., an action
    that we want the recipient to perform): “at index 12 of myCollection, insert myObject.”


    ### Introspection


    Object introspection is easy. For example, we might use the following syntax to
    ask an object for its class:


    Check to see whether an object has the method “fooo”:


    Request the signature of an object’s “foo0” method:


    Determine whether one class is a subclass of another:


    ### Dynamic Operating Time


    The runtime of Objective-C is dynamic. It enables the dynamic production of messages,
    the dynamic addition of methods to existing classes, the changing of method implementations,
    and so on.


    ### Automatic Garbage Collection


    On its thread, the automatic garbage collector collaborates with the application
    code. It uses a generational method to boost performance by focusing on memory
    zones more likely to hold garbage. It is compatible with objects and raw C memory
    blocks allocated with the `NSAllocateCollactable()` function and related approaches.
    The `malloc()` function works as predicted, allowing access to memory that the
    collector does not keep.

