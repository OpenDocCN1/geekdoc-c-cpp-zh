    `@throw` 用于发现异常，而 `@try`、`@catch()` 和 `@finally` 则用于捕获和管理异常。如果我们已经在 C# 中处理过异常，就应该熟悉这些异常处理结构。


    至关重要的一点是，Objective-C 中的异常执行速度较慢。因此，它的使用仅限于识别严重的编程错误，而不是基本的控制流。如果我们试图确定在出现预期问题（例如无法加载文件）时该怎么办，请参阅“错误处理”章节。


    # NSException 类


    异常由 `NSException` 类或其子类的实例表示。这是一种封装异常所有相关信息的简便方法。以下是异常的三个属性：


    - `name` – 一个 `NSString` 实例，用于唯一标识该异常。

    - `reason` – 一个 `NSString` 对象，以人类可读的格式描述异常。

    - `userInfo` – 一个 `NSDictionary` 实例，持有特定于异常的详细信息。


    基础框架（Foundation framework）中的几个变量指定了“标准”异常名称。这些字符串用于确定所捕获的异常类型。


    使用 `initWithName:reason:userInfo:` 初始化函数，我们可以轻松创建带有特定数据的新异常对象。通过遵循后续章节中概述步骤，也可以捕获和抛出自定义异常对象。


    # 创建异常


    让我们从程序的默认异常处理行为开始。在 Objective-C 中，当我们尝试访问不存在的索引时，`NSArray` 的 `object:` 函数会返回一个
    `NSRangeException`（`NSException` 的子类）。因此，如果我们请求三个组件数组的第十项，我们就会有一个异常要处理了：


    当发生未捕获的异常时，Xcode 会暂停程序并显示产生错误的行。


    # 捕获异常


    为了管理异常，任何可能导致异常的代码都应该放在 `@try` 块中。然后应用 `@catch()` 指令来捕获特定异常。如有必要，我们可以在 `@finally`
    块中执行任何清理代码。下面的示例演示了这三个异常处理指令：


    消息 `[crew objectAtIndex:10]` 导致软件产生 `NSRangeException`，该异常被 `@catch()` 指令捕获。实际的异常处理发生在
    `@catch()` 子句中。在例例中，我们只是显示了一条条有用的错误信息，但在其他情况下，我们可能需要编写代码来解决问题。


    当 `@try` 块中检测到错误时，程序移动到相应的 `@catch()` 块，防止异常后的代码被执行。如果 `@try` 块需要清理（例如，如果它打开了一个文件，则需要关闭），就会出现问题。这个问题通过
    `@finally` 块解决，因为无论是否抛出异常，它的执行都能得到保证。这使得它成为解决 `@try` 块中任何遗留问题的绝佳位置。


    `@catch()` 指令后的括号允许我们定义要捕获的异常类型。在这种情况下，异常是 `NSException`，这是最基础的异常类型。另一方面，异常可以是任何类型，而不仅仅是
    `NSException`。例如，下面的 `@catch()` 指令将处理一个通用对象：


    # 抛出异常


    在我们的代码中，每当我们遇到异常情况时，我们都会创建一个 `NSException` 实例并填充相关数据。当我们使用恰当调用的 `@throw` 指令抛出它时，最近的
    `@try/@catch` 块将处理它。


    下面的示例生成指定间隔范围内的随机数。如果调用者提供了不正确的范围，该方法将抛出一个自定义错误。


    这段代码不会抛出错误，因为它为 `generateRandomInteger()` 提供了一个有效范围 (0, 10)。如果我们将范围更改为 (0, −10)，我们将看到
    `@catch()` 部分在运行。这就是基础类获取异常时在后台发生的情况（例如 `NSArray` 抛出的 `NSRangeException`）。


    我们还可以重新抛出之前捕获的异常。当我们想要收到异常提醒但不想自己处理它时，这非常有用。为了起见，我们可以省略 `@throw` 指令的参数：


    捕获的异常随后被转发给下一个高别的处理器，在本例中，是顶层异常处理程序。这应该显示我们的 `@catch()` 块的结果，以及“由于未捕获的异常导致程序正常终止……”的消息，随后程序将突然关闭。


    `@throw` 指令并不非要抛出 `NSException` 对象；它可以抛出任何内容。下面的示例抛出了一个 `NSNumber` 对象而不是普通异常。此外，注意我们通过在
    `@try` 块之后跟随一系列 `@catch()` 语句来针对某些对象：


    `generateRandomInteger()` 并不是返回一个 `NSException` 对象，而是尝试在指定的“默认”边界之间生成一个新整数。示例展示了如何对不同对象使用
    `@throw`；然而，这不是最好的应用程序设计，也不是 Objective-C 异常处理工具的最有效用法。如果我们想利用抛出的值（如前面的代码所示），正如下一节中讨论的那样，使用
    `NSError` 进行简单的条件检查会更理想。


    Apple 的一些核心框架也期望抛出 `NSException` 对象，因此在与标准库集成时要小心。


    # 在 Objective-C 中管理错误


    错误（Errors）旨在提供一种快速简单的方法来判断操作是否成功，而异常（Exceptions）旨在程序出错时警告程序员。与异常不同，错误旨在用于普通的控制流语句。


    # NSError 类


    错误和异常唯一的共同点是，它们都被实现为对象。`NSError` 类包含了信号错误所需的所有信息：


    - `code` – 一个唯一标识错误的 `NSInteger`。

    - `Domain` – 一个描述错误的 `NSString` 对象。

    - `userInfo` – 一个 `NSDictionary` 实例，持有特定于问题的的详细信息。这比 `NSException` 的 `userInfo`
    字典要常用得多。


    除了这些关键属性外，`NSError` 还包含许多有助于显示和处理错误的变量。


    - `localizedDescription` – 一个包含完整错误说明的 `NSString`，通常包含失败的原因。此数字通常通过警框显示给用户。

    - `localizedFailureReason` – 一个对错误原因进行不同解释的 `NSString`。想要从综合解释中移除错误原因的用户可以使用此选项。

    - `recoverySuggestion` – 一个提供用户如何从错误中恢复信息的 `NSString`。

    - `localizedRecoveryOptions` – 一个包含错误对话框按钮标题的 `NSArray`。如果此数组为空，则显示单个 OK 按钮来关闭警框。

    - `helpAnchor` – 当按下警框中的帮助锚按钮时，会显示一个 `NSString`。


    - `initWithDomain:code:userInfo` 方法与 `NSException` 一一样，用于带有详细数据的初始化 `NSError`
    对象。


