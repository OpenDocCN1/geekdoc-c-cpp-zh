    A class in Objective-C is a sort of object that combines data with related functionality.
    It is sometimes preferable to specify a single task or unit of action rather than
    a set of methods.


    Blocks are a language-level feature that has been added to `C`, Objective-C, and
    `C++`, allowing us to create distinct blocks of code that are passed around to
    methods and functions like values. Because blocks are Objective-C objects, they
    should add to collections like `NSArray` or `NSDictionary`. They may also catch
    values from other scopes, making them similar to closures or lambdas in other
    programming languages.


