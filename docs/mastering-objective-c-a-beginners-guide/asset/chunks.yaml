    `if` 语句验证表达式的评估结果。如果结果非零，则执行下一语句；否则，跳过该语句。


    之前的概念也适用于 `for`、`while` 和 `do` 语句中的条件评估。复合关系表达式（如下语句所示）的评估遵循之前描述的相同过程：


