    ## MERITS


    - The language was developed as a `GCC` preprocessor package for modern C compilers.

    - Objective-C is better compatible with `C++`.

    - Objective-C is more stable.

    - Objective-C makes it easier to use private APIs.


    ## DEMERITS


    - Unlike `C++`, Objective-C does not support operator overloading.

    - The first version of Objective-C did not support garbage collection, but it
    still uses a `-` based runtime, increasing the program’s size.

    - It requires a header file to work correctly because it is dependent on `C` Compilers.

    - Objective-C is a pretty difficult language, which is to be expected considering
    its age.


    ## SHOULD WE CHOOSE OBJECTIVE-C?


    Even a casual examination of the main features of both languages demonstrates
    that `Swift` outperforms Objective-C. Furthermore, one of Objective-final C’s
    advantages over `Swift` has recently been removed.


    `Swift` 5, the most recent version of the programming language, now features `ABI`
    stability, which is an essential step toward achieving exceptional performance
    and security. `Swift`’s lack of `ABI` stability was a significant concern until
    recently, although it has now been resolved.


    With the release of the latest `Swift` version, Apple is encouraging developers
    to use it for future `iOS` applications. It makes sense because the younger language
    has several advantages over the older and more challenging Objective-C.


    ## WHAT IS THE POINT OF LEARNING OBJECTIVE-C IN 2022?


    Most `macOS`, `XCode`, and `iOS` kernel codes are written in `C` and `C++`. Because
    Objective-C is not a programming language but rather a massive preprocessor for
    pure `C`, it “fits in” with them rather well.


    Apple’s whole ecosystem is built on Objective-C. `Swift` is mainly based on it.
    To understand how the system works from the inside and why `Swift` appears and
    acts the way it does, it is required to comprehend the “base.” Objective-C facilitates
    understanding of concepts such as the fact that not all `NSProxy` objects are
    `NSObject` and the distinction between `Int`, `NSInteger`, and `NSNumber`. Aside
    from how `Swizzling` works, what a `Selector` is, how the responder chain works,
    and so on. `Swift` has firmly contained and abstracted this, so it is not immediately
    evident. Furthermore, Objective-C, like any `C` language, aids knowledge of the
    underlying behavior of links, pointers, and memory.


    ## IN DEVELOPMENT, OBJECTIVE-C IS STILL UTILIZED


    To begin, it appears that any project that has lasted greater than two to three
    years has Objective-C code. It may be a hidden layer that has been made dependent
    and does not fit into the common code base, but it exists and requires regular
    maintenance: bug repairs and feature enhancements.


    While specific programs cannot be rebuilt in `Swift`, doing so would require time
    and money that neither the business nor the customer is prepared to invest. As
    a result, the Objective-C database is growing.


    Third, languages with a lower degree of abstraction than `Swift` are employed
    for complex operations with network, memory, and device resources. It might be
    Objective-C, `Objective-C++`, or merely `C` and `C++`, depending on the level
    of abstraction necessary.


