    ## PROPERTIES


    The idea of properties is used in both Objective-C and C# to offer a high-level
    abstraction around accessor methods. The @property compiler directive is used
    in Objective-C to build accessor methods effectively. C#, on the other hand, comes
    with built-in support for properties.


    ## STATIC KEYWORD


    The static keyword in Objective-C and C# have pretty different meanings.


    Static functions are used in Objective-C to restrict the scope of a function to
    the current file. The public, private, and internal keywords in C#, on the other
    hand, keep the scope under check. When we use the static keyword on a variable
    in Objective-C, it keeps its value across function calls. A static keyword is
    also available in C#.


    When applied to a method, it performs the same function as the + modifier in Objective-C.
    It does this by creating a class method. When applied to other constructs like
    fields, properties, and events, it makes them part of the type they’re defined
    in, rather than any instance of that type. We may also create a static class,
    which requires all of the class’s methods to be static.[²](#chapter01.xhtml_en1_2)


    ## LIST VS NSARRAY INITIALIZATION


    The addition of literal syntax for usage with NSArray in Objective-C makes it
    easier to initialize. C#, on the other hand, C # has a richer type called a List
    that is generic, meaning that the type the list carries may be specified by the
    code that constructs the list (similar to templates in C++).


    ## LAMBDA EXPRESSIONS VS BLOCKS


    Objective-C employs blocks to generate closures, allowing us to create an inline
    function that may use the contained state. C# uses lambda expressions to implement
    a similar approach.


    This chapter covered the Objective-C overview with the framework, advantages,
    disadvantages, compiler, and differentiation from other languages.


