    (c < d)`


    括号对于保证表达式被正确评估至关重要。当然，我们也可以以类似的措辞表达相同的观点：


    一些 Objective-C 的内置功能使得处理布尔变量变得稍微容易。一个例子是特殊类型 `BOOL`，它可用于声明具有真或假值的变量。另一个是预定义值 `YES`
    和 `NO`。在程序中使用预设值可能有助于使其更易开发和阅读。检查 `program`，它已经重新构建以利用这些功能。


    ## 条件运算符


    条件运算符是 Objective-C 语言中最不寻常的运算符之一。与 Objective-C 中所有其他单元或二元运算符不同，条件运算符是一个三元运算符，这意味着它接受三个操作数。问号
    `?` 和冒号 `:` 是表示该运算符的两个符号（`:`）。第一个操作数在 `:` 之前，第二个在 `:` 和第三个之间，第三个在 `:` 之后。


