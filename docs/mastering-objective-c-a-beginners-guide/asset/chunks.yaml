    The `memberDeclarations` section describes what sorts of data are held in a `Fraction`
    and their names.


    As we can see, this section is surrounded by its own set of curly braces. These
    declarations for our `Fraction` class indicate that a `Fraction` object contains
    two integer members: `numerator` and `denominator`.


    The instance variables are the members defined in this section. When we create
    a new object, we generate a new and distinct collection of instance variables.
    As a result, if we have two `Frractions`, `fracA` and `fracB`, each will have
    its own set of instance variables – that is, `fracA` and `fracB` will each have
    their independent `numerator` and `denominator`. One of the advantages of dealing
    with objects is that the Objective-C system automatically maintains track of this
    for us. The `@implementation` section’s `methodDefinitions` section provides the
    code for each method declared in the `@interface` section. Each method’s definition,
    like the `@interface` section, begins by specifying the kind of the method (class
    or instance), its return type, and its parameters and their types. Instead of
    a semicolon at the end of the line, the method code is surrounded by a series
    of curly brackets. It should be mentioned that by utilizing a specific `@synthesize`
    directive, we may have the compiler automatically construct methods for us.


    The `print` method displays the values of the instance variables `numerator` and
    `denominator` using `NSLog`. But whose `numerator` and `denominator` is this approach
    referring to? It refers to the instance variables present in the message’s receiver
    object. That is a crucial topic, and we will return to it shortly.


    The integer parameter `n` is stored in the instance variable `numerator` using
    the `setNumerator:` method. `SetDenominator`, on the other hand, keeps the value
    of its argument `d` in the instance variable `denominator`.


    ## PROGRAM SECTION


    The code to handle our problem is contained in the program section, which can
