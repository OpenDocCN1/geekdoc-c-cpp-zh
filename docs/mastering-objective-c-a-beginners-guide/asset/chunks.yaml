  trans: "\n前文提到的名为“计算所需的三角形数”的循环组件实际上由将变量 `triangularNumber` 的值设置为 `0`，以及一个用于计算三角形数的\
    \ `for` 循环组成。因此，`for` 语句被包含在另一个 `for` 语句之中。这在 `Objective-C` 中是完全合法的，且嵌套可以扩展到任何所需的级别。\n\
    \n在处理日益复杂的程序结构（如嵌套的 `for` 语句）时，适当的缩进变得尤为重要。我们可以快速地发现每个 `for` 语句中包含哪些语句。\n\n##\
    \ for 循环的变体\n\n在结束对 `for` 循环的解释之前，我们应该涵盖一些用于创建此循环的语法变化。在构建 `for` 循环时，我们可能会发现在循环开始前想初始化多个变量，或者想在每次循环运行时评估多个表达式。只要用逗号隔开，多个表达式可以包含在\
    \ `for` 循环的任何字段中。例如，在以以下语句开头的 `for` 语句中：\n\n```objc\nfor (x = 0, y = 0; ...)\n\
    ```\n\n在循环开始之前，`x` 的值被设置为 `0`，`y` 的值被设置为 `0`。逗号分隔了两个表达式 `x = 0` 和 `y = 0`，这两个表达式都被视为循环\
    \ `init-expression`（初始化表达式）字段的一部分。另一个是以以下方式开始 `for` 循环：\n\n```objc\nfor (x = 0,\
    \ y = 100; ...)\n```\n\n在循环开始之前，两个索引变量 `x` 和 `y` 分别赋值为 `0` 和 `100`。每次执行循环体时，`x`\
    \ 的值增加 `1`，`y` 的值减少 `10`。\n\n我们可能需要在 `for` 语句的某个字段中包含多个一个表达式，也可能需要从语句中排除一个或多个字段。只需省略所需的字段并将其替换为分号即可。\n\
    \n当不需要评估起始表达式时，就会出现在 `for` 语句中省略字段的最典型用法。\n\n在这种情况下，只要我们包含分号，就可以直接将 `init`（初始化）字段留空：\n\
    \n```objc\nfor (; ...)\n```\n\n如果 `y` 在循环开始之前已经设置了某个初始值，则可能会使用此语句。\n\n一个没有循环条件字段的\
    \ `for` 循环会创建一个无限循环，即在理论上会无限执行的循环。只要使用另一种退出方法，就可以这种循环。\n\n变量也可以定义为 `for` 循环内部第一条语句的一部分。这种方法与我们之前定义变量的方式相同。例如，以下代码可以创建一个带有整数变量\
    \ `counter` 的 `for` 循环，该变量被指定并初始化为值 `1`：\n\n```objc\nfor (int counter = 1; ...)\n\
    ```\n\n变量 `counter` 仅在 `for` 循环执行期间可见（称为局部变量），且无法在循环外部被访问。\n\n## while 语句\n\n\
    `while` 语句进一步扩展了 `Objective-C` 语言的循环能力。这种广泛使用的结构具有以下语法：\n\n```objc\nwhile (expression)\
    \ { ...}\n```\n\n括号中的 `expression` 会被评估。如果 `expression` 的评估结果为真，则执行后续的程序语句。在执行该语句（如果在大括号内则是多个语句）之后，会再次评估\
    \ `expression`。如果评估结果为真，则再次运行该程序语句。此操作不断重复，直到循环停止时 `expression` 评估为 `false`。随后，程序的执行将继续程序语句之后的语句。\n\
    \n例如，以下程序创建了一个简单的从 `1` 计数到 `6` 的 `while` 循环。\n\n```objc\nint count = 1;\nwhile\
    \ (count <= 6) {\n    ...\n    count++;\n}\n```\n\n程序在启动 `while` 循环之前首先将 `count`\
    \ 的值更改为 `1`。\n"
