  trans: "\n\n在 Objective-C 中，函数是一组执行特定任务的语句集合。每个 Objective-C 程序都有一个名为 `main()` 的单一\
    \ C 函数；即使是最简单的程序也可能声明额外的函数。我们可以将代码划分为许多函数。\n\n我们必须将代码划分为离散的函数，但每个函数应该在逻辑上执行特定的职责。函数声明向编译器指定函数的名称、返回类型和参数。函数的定义则指定了函数体。\n\
    \n在 Objective-C 中，函数的术语是“方法”（method）。Objective-C 基础框架包含许多应用程序可能调用的方法。\n\n例如，`appendString()`\
    \ 方法将一个字符串附加另一个字符串。方法有多个名称，包括函数（function）、子程序（subroutine）和过程（process）。\n\n 创建方法\n\
    \n在 Objective-C 编程语言中，方法的定义采用以下通用形式：\n\n方法规范由 Objective-C 编程语言中的方法头和方法体组成。\n\n\
    以下是方法的组成部分：\n\n*   **返回类型**：在 Objective-C 中，方法可以作为其 `returntype` 返回一个值。返回类型指定了函数返回值的数据类型。某些方法执行所需的操作但不返回任何值。在这种情况下，使用\
    \ `void` 作为 `returntype`。\n*   **方法名称**：方法的实际名称。方法签名由方法名和参数列表组成。\n*   **参数**：参数的作用类似于占位符。在调用函数时，我们发送一个包含值的参数。这个值本身被称为参数。方法的参数列表描述了参数的类型、顺序和数量。参数是可选的，方法可以没有任何任何参数。\n\
    *   **连接参数**：连接参数在在使用时使其解释变得更简单、更清晰。\n*   **方法体**：方法体由解释方法功能的语句组成。\n\n**示例：**下方显示了\
    \ `max()` 方法 get。该函数接受两个参数 `numbr1` 和 `numbr2`，并返回两者中较大的一个：\n\n 方法的声明\n\n方法声明告诉编译器函数的名称以及如何调用它。在\
    \ Objective-C 中，函数的实际体可以单独提供。\n\n在 Objective-C 中，方法声明包含以下元素：\n\n上述函数 `max()` 的方法声明如下：\n\
    \n当在一个源文件中声明方法并在另一个源文件中调用它时，需要进行方法声明。在这种情况下，该函数应该定义在调用它的文件开头。\n\n 调用方法\n\n在编写\
    \ Objective-C 方法时，我们指定了函数必须做什么。我们必须调用该函数并使用方法完成指定的任务。\n\n当程序调用函数时，控制权将交给被调用的方法。当被调用方法的返回语句或函数结束的大括号时，程序控制权返回给主程序。\n\
    \n要调用方法，请提供必要的参数以及方法名称；如果方法返回结果，我们可以将其存储。示例所示：\n\n 函数参数\n\n如果函数接收参数，它必须在 Objective-C\
    \ 中指定接受参数值的变量。这些变量在 Objective-C 中被称为函数的形式参数（formal parameters）。\n\n形式参数与函数内部其他局部变量的工作相同，在进入时形成，在退出时删除。\n\
    \n调用函数时有两种方式向其传递参数。\n\n| 序号 | 调用类型和描述 |\n| --- | --- |\n| 1 | **按值传递** 这种方法将参数的真实值转换为函数的形式参数。在这种情况下，函数内部对参数的修改不会影响参数本身。\
    \ |\n| 2 | **按引用传递** 这种方法将参数的地址放入形式参数中。在函数内部，使用该地址来检索调用时使用的实际参数。这表明对参数的修改会影响参数。\
    \ |\n\n默认情况下，Objective-C 使用按值传递传递参数。这通常意味着函数内部的代码不能修改用于调用函数的参数，而上一个示例也类似地使用了 `max()`\
    \ 方法。\n\n在本章中，我们通过相关示例涵盖了函数。\n\n# 评述\n\nDOI: [10.1201/9781003358534-11](https://doi.org/10.1201/9781003358534-11)\n\
    \n一种名为 Objective-C 的通用面向对象计算机语言通过 Smalltalk 风格的消息机制增强了 C 语言。\n\n在 Swift 出现之前，Cocoa\
    \ 和 Cocoa Touch 是 Apple 用于 OS X 和 iOS 操作系统及其相应的应用程序开发接口（API）的主要型编程语言。20 世纪 80\
    \ 年代初，创建了 Objective-C 程序代码。Objective-C 编程语言发明于 20 世纪 80 年代。它被选为 NeXT 的 NeXTSTEP\
    \ 操作系统的核心编程语言，该系统是 OS X 和 iOS 的祖先。\n\n可以为任何支持 GNU 编译器集合（GCC）或 Clang 的系统创建不需要 Cocoa\
    \ 或 Cocoa Touch 库、或使用可移植或为其他平台实现的组件的可移植 Objective-C 程序。\n\n通常，Objective-C “实现”软件文件具有\
    \ `.m` 文件扩展名，但 Objective-C “头/接口”文件具有 `.h` 文件扩展名，与 C 头文件相同。用 Objective-C++ 编写的论文扩展名为\
    \ `.mm`。20 世纪 80 年代初，Objective-C 主要由 Brad Cox 和 Tom Love 在他们的公司 Stepstone 创建。\n\
    \n尽管他非常谨慎地强调重用性问题不仅涉及语言本身，但在特性方面，Objective-C 经常与其他语言进行比较。1988 年一定见证了该语言许可以及 NeXTSTEP\
    \ 代码库的开发。\n\n在 1996 年收购 NeXT 后，Apple 计算机在其新的操作系统 Mac OS X 中采用了 OpenStep。这包括 Objective-C、NeXT\
    \ 基于 Objective-C 的开发者工具 Project Builder，以及其界面设计工具 Interface Builder（两者现在均已合并到\
    \ Xcode 应用程序中）。\n\nOpenStep 接口对象构成了 Apple 目前 Cocoa API 的大部分，它是目前正在使用的最重要的 Objective-C\
    \ 开发环境。Apple 在 2014 年 WWDC 上引入的 Swift 被誉为“去掉了 C 的 Objective-C”。Objective-C 编程语言的历史非常悠久。Objective-C\
    \ 在 2012 年 1 月获得 2011 年 TIOBE 编程语言奖。尽管在大部分时间里作为一种小众语言处于边缘状态，但 iPhone 的出现推动了它的普及。该奖授予过去一年使用量增长最大的语言；Objective-C\
    \ 在 2011 年的排名从第八名升至第五名。\n\n"
- fmt: '

    Objective-C has existed for 35 years, making it older than most contemporary macOS
    and iOS programmers. Swift, launched in 2014, is quickly overtaking Objective-C
    and increasing its market share. Swift is apparently used in almost 50% of the
    top downloaded apps from the App Store, a significant increase in just five years.
    The million-dollar question is whether Objective-C or Swift should use from the
    outset for new iOS applications. Let’s study Objective-C current’s situation.
    First, no one has ever received an official statement from Apple on the deprecation
    of Objective-C support or a likely date when it would be terminated.


    A substantial amount of Objective-C code is still being maintained, and several
    popular programs are written in this language. Consider: who would commit to converting
    these apps to a new language for no other reason? Consider how much time and money
    such a project would need with little visible return. We may thus assume that
    Objective-C will exist for the foreseeable future. Objective-C programmers may
    be certain that their skills will remain in demand. The situation has changed
    as new applications, and young developers choose to learn the language.


    ## A Comparison of Objective-C and Swift


    Let’s look at how Objective-C compares to Swift and what can tip the scales, in
    this case, to see if it’s a good idea to use it for our new iOS app project.


    Let’s examine how Swift and Objective-C vary from one another.


    - Because of runtime code compilation, Objective-C performance is slow. According
    to an official Apple release, Swift is `2.6` times more efficient than Objective-C.

    - Objective-C inherits the code structure of C and, as a result, has a very challenging
    syntax with various special symbols. On the other hand, Swift is close to plain
    English, making it easier to learn than Objective-C.

    - The biggest difference between Objective-C and Swift regarding code safety is
    how they handle null references. In Objective-C, a null pointer does not cause
    an application crash, making it difficult to detect and rectify. On the other
    hand, Null pointers cause detectable crashes in Swift. In general, Objective-C
    programs may have more hidden issues than Swift ones.

    - Objective-C necessitates the upkeep of two code files: time- and effort-consuming.
    With Swift, we need to maintain one code file, saving time and human work.

    - Objective-C frequently necessitates more lines of code than Swift.

    - Objective-C does not allow dynamic libraries and instead relies on static ones.
    They are larger and have a negative impact on application performance. Swift uses
    dynamic libraries, which reduce the overall size of the program while improving
    performance and responsiveness.


    | Swift | Objective-C |

    | --- | --- |

    | Swift is a general-purpose programming language with a focus on safety and speed.
    | Objective-C is a general-purpose computer language that is considered a superset
    of C. It was designed to include object-oriented characteristics. |

    | Chris Lattner and other Apple programmers designed it. | Brad Cox and Tom Love
    founded Stepstone. |

    | It was influenced by Objective-C, Rust, Ruby, and Python. | C and Smalltalk
    served as inspiration for the language. |

    | Swift made her debut appearance in 2014. | In 1984, Objective-C was first introduced.
    |

    | Swift type is fixed. | The Objective-C type is dynamic. |

    | Swift is an Apache-licensed open-source project. | The Objective-C license is
    a General Public License. |

    | It just contains courses. | Structs and classes are both present. |

    | It was designed for the creation of iOS, Mac, Apple TV, and Apple Watch apps.
    | Smalltalk communications facilities are built into Objective-C. |

    | Swift polymorphism is not found directly. | Polymorphism exists instantly at
    compile time in Objective-C. |

    | It makes use of true and false values. | It makes use of YES and NO values,
    as well as BOOl. |

    | Objective-C has fewer template types than Swift. | Objective-C has fewer templates
    than Swift. |


    ## C and Objective-C


    | C Language | Objective-C |

    | --- | --- |

    | It is a procedure-based language. Problems are handled in order. | Objective-C
    is an object-oriented programming language. It defines the syntax and semantics
    of an object-oriented programming language. However, it does not support multiple
    inheritance properties. |

    | The C programming language is a subset of Objective-C. | The Objective-C programming
    language is a subset of the C programming language. In addition to the C programming
    language, it features classes and objects. |

    | The pointers in the C programming language are vulnerable to security risks.
    | In comparison to C, Objective-C uses null pointers and is hence type-safe. |

    | It is essentially a low-level language that is too similar to assembly language.
    | Objective-C is a high-level programming language that mixes C with a communications
    style similar to small talk. |

    | Classes are not available in the C programming language. Bjarne Stroustrup designed
    the C++ programming language to add object-oriented features to the C programming
    language, such as classes. | Objective-C is a class-based object-oriented programming
    language with a dynamic runtime. |

    | It employs a top-down programming approach. | It employs a bottom-up programming
    approach. |

    | Large amounts of program code are divided into smaller portions known as functions.
    | This programming language divides large program code into smaller pieces known
    as Objects and Classes. |

    | It only works with pointers. | Pointers and references are both supported. |

    | Variables must declare at the start of a program. | In this programming language,
    variables may declare anywhere. |

    | Exception handling is not available in the C programming language. | Exception
    handling in Objective-C may be accomplished through catch and try. |

    | The creation of functions with default arguments is forbidden in C. | It allows
    for the construction of functions with default arguments. |

    | Objective-C code cannot execute in C. | C code may be executed using Objective-C.
    |

    | For dynamic memory allocation and deallocation, C has `malloc()`, `calloc()`,
    and `free()`. | For memory allocation and deallocation, Objective-C has `new`
    and `delete` operators. |

    | The C programming language does not secure data. | Objective-C security is achieved
    using the concept of encapsulation. |

    | There is no inline function available. | It supports the inline function. |

    | Overloading of functions and operators is not permitted in C. | Overloading
    of functions and operators is possible in Objective-C. |

    | It is also known as a function-driven language. | It is referred to as object-oriented
    programming. |

    | There is no support for encapsulation, data hiding, inheritance, polymorphism,
    or abstraction. | The essential features of Objective-C are encapsulation, data
    hiding, inheritance, polymorphism, and abstraction. |

    | Templates are not supported in the C programming language. | Objective-C supports
    templates. |

    | It is advantageous for embedded services. | It is useful for gaming, networking,
    and so on. |


    | C++ | Objective-C |

    | --- | --- |

    | C++ is a high-level, procedural, object-oriented programming language. It was
    known as “C with Classes.” It is an extension of the C language. | The Objective-C
    programming language is a general-purpose object-oriented programming language
    that offers syntax and semantics for object-oriented programming. It is a superset
    of the C language. |

    | Bjarne Stroustrup invented it at Bell Laboratories in 1980. | Productivity Products
    International’s Brad Cox and Tom Love created the device in 1980. (PPI). |

    | It supports multiple inheritances. | It does not work with multiple inheritances.
    |

    | In C++, structures and classes are treated the same way. | Objective-C does
    not handle structures and classes in the same way. |

    '
