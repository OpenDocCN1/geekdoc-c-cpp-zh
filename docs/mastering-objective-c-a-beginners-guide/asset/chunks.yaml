    ### WHITESPACE IN OBJECTIVE-C


    An Objective-C compiler ignores blank lines since they include only whitespace,
    maybe with a comment.


    Whitespace in Objective-C refers to blanks, tabs, newline characters, and comments.
    Whitespace separates sections of a statement and helps the compiler discern where
    one element, such as `int`, stops, and the next element begins in a statement.
    As a result, in the statement that follows:


    ```

    int age = 25;

    ```


    The compiler must have at least one whitespace character to distinguish between
    `int` and `age` (typically a space). In comparison, consider the following statement:


    ```

    intfruit=lichi;

