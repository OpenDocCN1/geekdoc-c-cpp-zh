    The Objective-C compiler treats any characters between the opening `/*` and the
    ending `*/` as part of the comment statement and ignores them.


    When comments span many lines of code, such as in the following, this kind of
    comment is often utilized. It’s totally up to you the kind of remark you make.


    It’s worth noting that the `/*` style comments cannot be nested. For three excellent
    reasons, get into the habit of incorporating comment statements into our software
    as we create it or enter it into the computer.


    To begin with, documenting the software while the reasoning is still fresh in
    our head is significantly simpler than going back and reworking the logic after
    it has been done.


    Second, by including comments in the program at such an early stage, we may profit
    from them during the debug phase, when program logic issues are identified and
    debugged. Not only may a remark assist us (and others) in reading the program,
    but it can also direct us to the root of the logic error.


    Finally, we had yet to meet a programmer who loves writing documentation for a
    program. In fact, when you’ve done debugging your software, the prospect of returning
    to it to add comments is unlikely to appeal to us. Adding comments to the software
    as it’s being developed makes this sometimes-difficult chore a little simpler
    to tackle.


    Following line instructs the compiler to look for and execute a file called `Foundation.h`:


    ```objc

    #import <Foundation.h>

    ```


    This is a system file, which means we did not generate it. `#import` tells the
    program to import or include the information from that file as if its contents
    were entered into it at that moment. Because it contains information about additional
    classes and functions that will utilize later in the application, we imported
    the file `Foundation.h`. This line in `Program` states that the program’s name
    is `main:`


    `main` is a unique name that specifies where the program should start running.


    The reserved term `int`, which comes before `main`, indicates that the value returned
    by `main` is an integer.


    For the time being, disregard what occurs between the open and closed parenthesis;
    these are command-line parameters. We may now explain exactly what this routine
    should do now that we’ve identified the `main` to the system.


    This is accomplished by encapsulating all of the routine’s program statements
    in a pair of curly braces. A statement is just an expression that is finished
    by a semicolon in the simplest instance. All program statements between the brackets
    are treated as part of the main procedure by the system.


    The next line in the `main` reads:


    ```objc

    @autoreleasepool {

    ```


    Any program statements between and the matching closure are performed under an
    autorelease pool context. The autorelease pool is a feature that helps the system
    manage the memory our application needs as it produces new objects more effectively.
    “Automatic Reference Counting and Memory Management.” Within our `@autoreleasepool`
    context, we have one sentence. This line instructs the execution of a function
    called `NSLog`.


    The following string of characters is the parameter, or argument, to be supplied
    or handed to the `NSLog` routine:


    ```objc

    NSLog(@"Hello, World!");

    }

    }

    ```


    The `@` symbol immediately follows a string of text contained by a pair of double
    quotes in this case. This is referred to as a constant `NSString` object.


    The `NSLog` routine is an Objective-C library function that simply shows or logs
    its input. However, before doing so, it displays the date and time the routine
    is performed, the program name, and some other numbers we won’t get into here.


    In Objective-C, all program statements must be terminated with a semicolon (`;`).
    This is why a semicolon occurs right after the `NSLog` call’s closing parenthesis.


    The final program statement in the `main` is as follows:


    ```objc

    return 0;

    ```


    It states that the `main` should be terminated, and a status value of `0` should
    be returned. By convention, `0` indicates that the program terminated normally.
    Any nonzero number often indicates that a problem occurred, such as the software
    cannot identify a required file.


    If we use `Xcode` and return to our output window, we’ll notice the following
    shown after the line of output from `NSLog`:


    ```

    2023-10-27 10:00:00 ProgramName: Hello, World!

    ```


    We should know what that message signifies by now. Now that we’ve completed talking
    about our first program, let’s change it to include the statement “And writing
    in Objective-C is much more enjoyable!” This is easily accomplished by just adding
    another call to the `NSLog` function, as illustrated in `Program`. Remember that
    each Objective-C program statement must end with a semicolon. The leading remark
    lines have been omitted in the following program examples.


    If we enter `Program` and then build and execute it, we may anticipate the following
    result (without the text that `NSLog` typically appends to the output):


    ```

    Hello, World!

    And writing in Objective-C is much more enjoyable!

    ```


    As the following software example shows, you don’t need to use the `NSLog` function
    for each output line. Let’s start with a unique two-character sequence. The newline
    character comprises the backslash `\` and the letter `n`. A newline character
    instructs the system to do exactly what its name implies: go to the new line.
    Any characters that follow the newline character are printed on the following
    line of the display. Indeed, the newline character is comparable to the carriage
    return key on a typewriter.


    ## DISPLAYING THE VALUES OF VARIABLES


    With `NSLog`, we may display not only basic sentences but also variable values
    and calculation results. The program uses the `NSLog` function to display the
    results of adding two integers, `55` and `35`.


    After the autorelease pool is set up, the first program instruction within the
    `main` declares the variable `total` to be of type integer. All program variables
    must define before they can use in a program. The definition of a variable tells
    the Objective-C compiler how the program should use the variable. The compiler
    needs this information to construct the necessary instructions for storing and
    retrieving values from the variable. A variable of type `int` may only contain
    integral values – that is, numbers with no decimal places.


    Integral values include `3`, `5`, `-20`, and `0`. Real numbers having decimal
    places, such as `2.14`, `2.455`, and `27.0`, are known as floating-point numbers.


    The result of adding the numbers `55` and `35` is stored in the integer variable
    `sum`. To visually separate the variable declarations of the routine from the
    program statements, we have purposefully left a blank line after the definition
    of this variable; this is entirely a matter of style. A single blank line in a
    program can sometimes make it more understandable.


    The program statement is written in the same way as it would in most other programming
    languages:


    ```objc

    total = 55 + 35;

    ```


    The number `55` is added (as shown by the plus sign `+`) to the number `35`, and
    the result is placed in the variable `total` (as indicated by the assignment operator,
    the equals sign `=`).


    In `Program`, the `NSLog` routine call now includes two parameters in parentheses.
    A comma separates these parameters. The character string shown is always the first
    input to the `NSLog` function. However, in addition to displaying the character
    string, we may also wish to display the value of specific program variables. In
    this scenario, you want the value of the variable `sum` to be shown after these
    characters:


    ```objc

    NSLog(@"The sum of 55 and 35 is %d", sum);

    ```


    The `%` character in the first parameter is a special character that the `NSLog`
    method recognizes. The character that appears immediately after the `%` sign indicates
    the type of value that will present at that moment. The `NSLog` method in the
    preceding software identifies the letter `d` as indicating that an integer value
    is to be shown.


    When the `NSLog` procedure discovers the `%d` characters within a character string,
    it shows the value of the next parameter to the routine. Because `sum` is the
    next input to `NSLog`, its value is printed automatically after “The sum of 55
    and 35 is.”


    Inside `main`, the second program instruction declares three `int` variables:
    `value1`, `value2`, and `sum`.


    Three distinct statements may have been used to represent this statement, as follows:


    ```objc

    int value1;

    int value2;

    int sum;

    ```

