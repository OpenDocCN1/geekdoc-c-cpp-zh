    在读取了两个数字和一个运算符后，程序将第一个值保存在计算器的累加器中。然后将 `operator` 的值与四种允许的运算符进行比较。当找到匹配项时，会将相应的消息传递给计算器，由计算器执行操作。在最后一个
    `NSLog` 中获取并显示累加器的值。此时，程序的执行即完成。


    此时，有必要对程序的完整性进行几点说明。尽管上一个程序完成了我们设定的要实现的任务，但它并不是真正完整的，因为它没有考虑到用户错误。例如，如果用户误将运算符输入为
    `a?` 会发生什么呢？程序将直接退出 `if` 语句，终端上不会显示任何通知来告知用户输入的表达式不正确。


    另一个例子是用户输入除以零的除法操作。我们可能知道，在 Objective-C 中永远不应该尝试将整数除以零。程序应该检查这种情况。


    预测程序可能失败或产生意外影响的方法，并采取预防性措施以应对这些可能发生的情况，是创建优秀、可靠程序的关键组成部分。对程序运行足够数量的测试用例经常指向程序未能考虑到某些情况的区域。但远不止于。在编写程序时，必须养成一种自律，即始终提问“如果……会发生什么？”并编写必要的程序语句来有效处理该问题。


