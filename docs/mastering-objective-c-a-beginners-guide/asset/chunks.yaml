    `(float) p` 与表达式 `-p` 一样，对 `p` 的值没有永久影响。


    除了一元负和一元加，类型转换运算符的优先级高于所有算术运算符。当然，我们始终可以在表达式中使用括号来按照我们选择的任何顺序评估项。


