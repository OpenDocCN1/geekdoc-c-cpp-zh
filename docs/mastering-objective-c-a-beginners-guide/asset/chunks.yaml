    在保留现有 Objective-C 资源的同时使用 Xamarin，可以通过绑定（bindings）让 C# 访问这些资源。这种 Xamarin 技术将 Objective-C
    代码暴露给托管的 `C#` 世界。


    如果需要，也可以逐行将代码转换为 `C#`。


    为了在使用 `Xamarin.iOS` 正确使用现有 Objective-C 代码，无论采用绑定还是迁移技术，都需要对 Objective-C 和 `C#`
    有一定的了解。


    ## Objective-C 互操作


    目前还没有批准的方法可以通过 `Xamarin.iOS` 创建可以从 Objective-C 调用的 C#` 库。


    主要原因是除了绑定之外，还需要 `Mono` 运行时。我们的大部分逻辑（包括用户界面）仍然可以使用 Objective-C 编写。将 Objective-C
    代码封装在库中并建立绑定。


    启动应用需要 `Xamarin.iOS`（这意味着它必须创建 `Main` 入口）。任何其他功能都可以 Objective-C 编写，并通过绑定（通过 `P/Invoke`）提供给
    C#`。通过这种方式，我们可以在 `C#` 中构建平台无关的部分，同时在 Objective-C 中保留平台特定的逻辑。本节对比了这两种语言之间的一些显著相似点和不同，作为使用
    `Xamarin.iOS` 迁移到 C#` 的入门指南，无论是绑定到现有的 Objective-C 代码还是将其转换为 C#`。


    ## 语言比较


    在语法和运行时方面，Objective-C 和 `C#` 都是相当不同的语言。`C#` 是静态类型的，而 Objective-C 是动态的并采用消息传递系统。


    Objective-C 在语法上与 `Smalltalk` 相似；虽然 `C#` 的大部分基础语法借自 `Java`，但多年来它已经发展出了许多 `Java`
    之外的特性。然而，在 Objective-C 和 `C#` 中，许多语言特性在功能上是等价的。在从 C# 为 Objective-C 代码建立绑定或将 Objective-C
    转换为 `C#` 时，理解这些共同点至关重要。


    ## 接口 vs. 协议


    Objective-C 和 `C#` 都是单继承语言。另一方面，两种语言都允许我们在单个类中实现多个接口。这些逻辑接口在 Objective-C 中被称为协议（protocols），在
    `C#` 中被称为接口（interfaces）。从实现角度来看，`C#` 接口与 Objective-C 协议的关键区别在于后者可能有可选方法。


    ## 扩展方法 vs. 分类


    通过分类（Categories），Objective-C 允许我们为可能没有实现代码的类添加方法。


    扩展方法类似于 `C#` 中的扩展方法，提供了类似的概念。`C#` 中的静态方法等同于 Objective-C 中的类方法，而扩展方法允许我们将它们添加到类中。


    ## 程序集 vs. 框架


    框架（Frameworks）是 Objective-C 组织相似类的特定文件夹。另一方面，程序集（Assemblies）用于 `C#` 和 `.NET`，提供可重用的预编译代码块。iOS
    以外系统的程序集文件包含在运行时实时编译（`JIT`）的中间语言代码 (`IL`）。


    另一方面，Apple 不允许在 App Store 发布的 iOS 应用中执行 `JIT` 编译的代码。因此，Xamarin 提前（`AOT`）为 iOS
    编译 `C#` 代码，生成包含在应用程序中的中的 Unix 执行文件和元数据文件。


    ## 命名参数 vs. 选择器


    根据其本质，Objective-C 方法在选择器（selectors）中包含了参数名称。在代码中使用时，如 `AddCrayon:WithColor:` 使每个参数的含义都显而易见。


    ## 命名空间和头文件


    Objective-C 作为 `C` 的超集，使用头文件进行区别于实现文件的公共声明。`C#` 不使用头文件。与 Objective-C 代码不同，`C#`
    代码封装在命名空间中。如果我们想包含另一个命名空间中的代码，可以在实现文件的开头添加 `using` 指令，或使用整个命名空间来限定类型。


    ## 属性


    属性（properties）的概念在 Objective-C 和 `C#` 中都用于对访问器方法提供高层级抽象。Objective-C 使用 `@property`
    编译器指令来有效地构建访问器方法。另一方面，`C#` 内置了对属性的支持。


    ## static 关键字


    Objective-C 和 `C#` 中的 `static` 关键字含义非常不同。


    静态函数在 Objective-C 中用于限制函数的作用范围到当前文件。另一方面，`C#` 中的 `public`、`private` 和 `internal`
    关键字控制作用范围。当我们在 Objective-C 变量上使用 `static` 关键字时，它使其值在函数调用之间保持不变。`C#` 中也支持 `static`
    关键字。


    当应用于方法时，它执行与 Objective-C 中 `+` 修饰符相同的功能。它通过创建类方法来实现这一点。当应用于字段、属性和事件等其他结构时，它使其成为定义所在类型的一部分，而不是该类型的任何实例。我们还可以创建
    `static` 类，这要求类的所有方法都必须是静态的。


    ## List vs. NSArray 初始化


    Objective-C 中增加了用于 `NSArray` 的字面量语法，使其初始化变得更容易。另一方面，`C#` 拥有一种更丰富的类型称为 `List`，它是泛型的，这意味着列表承载的类型可以由构建列表的代码指定（类似于
    `C++` 中的模板）。


    ## Lambda 表达式 vs. 块


    Objective-C 使用块（blocks）来生成闭包，允许我们创建一个可能使用包含状态的内联函数。`C#` 使用 Lambda 表达式来实现类似的方法。


    本章涵盖了 Objective-C 概述，包括框架、优点、缺点、编译器以及与其他语言的区别。


