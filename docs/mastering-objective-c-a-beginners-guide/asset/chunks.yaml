    and tells the compiler to create variables of type `int` called `d`, `e`, and
    `f`.


    In their declaration, variables can be initialized (given an initial value). The
    initializer is made of an equal sign followed by a constant expression, as seen
    below.


    Variables with static storage lifetime are automatically initialized with `NULL`
    when defined without an initializer (all bytes have the value 0). On the other
    hand, all other variables have an uncertain beginning value.


    ## OBJECTIVE-C VARIABLE DECLARATION


    A variable declaration ensures the compiler that at least one variable of the
    specified type and name exists, enabling the compiler to proceed with other compilations
    without demanding more information. A variable declaration is only relevant during
    compilation; the compiler requires the actual variable declaration when linking
    the program.


    When working with several files, a variable declaration is required. We define
    your variable in one of the files available during program linking. The `extern`
