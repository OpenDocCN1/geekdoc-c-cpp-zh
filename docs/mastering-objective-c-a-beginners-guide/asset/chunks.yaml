    ## Data Types and Constants


    An `int` variable may only use to store integral values, that is, numbers that
    do not contain decimal digits. Other data types supported by the Objective-C language
    include `float`, `double`, and `char`.


    A variable of type `float` can use to store floating-point numbers (values containing
    decimal digits). The `double` type is similar to the `float` type but nearly twice
    the range. Finally, `char` data type can hold a single character, such as the
    letter a, numeric 6, or semicolon.


    A constant in Objective-C is any literal, single character, or character string.
    The number 6 indicates a constant value. A constant character string is the string
    “Programming in Objective-C is interesting.” Constant expressions are expressions
    that are entirely composed of constant values because each of its terms has a
    constant value: however, if I declared an integer variable, this statement would
    not be a constant.


    ## Type int


    An integer constant comprises a series of one or more digits. The presence of
    a minus sign before the sequence indicates that the value is negative. Integer
    constants are represented by the integers 6, -10, and 0. There are no embedded
    spaces or commas allowed between the numerals. Every value, whether a character,
    integer, or floating-point number, has a range of values. This range refers to
    the amount of storage available to store data. In general, that number is not
    stated in the language; it often relies on the computer we’re operating on and
    hence referred to as implementation-dependent. An integer variable, for example,
    may occupy 32 bits on our machine or 64 bits. When 64 bits are utilized, substantially
    bigger numbers may be stored in integer variables than when 32 bits are used.


    | Type | Storage Size | Value Range |

    | --- | --- | --- |

    | `char` | 1 byte | −128 to 127 |

    | `unsigned-char` | 1 byte | 0 to 255 |

    | `signed-char` | 1 byte | −128 to 127 |

    | `int` | 2 or 4 byte | −32,768 to 32,767 or −2,147,483,648 to 2,147,483,647 |

    | `unsigned-int` | 2 or 4 byte | 0 to 65,535 or 0 to 4,294,967,295 |

    | `short` | 2 bytes | −32,768 to 32,767 |

    | `unsigned-short` | 2 bytes | 0 to 65,535 |

    | `long` | 4 bytes | −2,147,483,648 to 2,147,483,647 |

    | `unsigned-long` | 4 bytes | 0 to 4,294,967,295 |


    ## Type float


    To store values with decimal digits, use a variable defined to be of `float`.
    The presence of a decimal point distinguishes a floating-point constant. `5.`,
    `126.8`, and `-.0001` are all instances of acceptable floating-point constants.
    The `NSLog` conversion characters `%f` or `%g` can use to show a floating-point
    number.


    Scientific notation can also use to express floating-point constants. The value
    `1.8e4` is a floating-point value represented by this notation that equals $1.8
    \times 10^4$. As previously stated, the `double` type is the same as the `float`
    type, but with nearly twice the range.


    | Type | Storage Size | Value Range | Precision |

    | --- | --- | --- | --- |

    | `float` | 4 byte | 1.2E−38 to 3.4E+38 | 6 decimal places |

    | `double` | 8 byte | 2.3E−308 to 1.7E+308 | 15 decimal places |

    | `long double` | 10 byte | 3.4E−4932 to 1.1E+4932 | 19 decimal places |


    ## Type char


    A `char` variable may use to hold a single character. Enclosing a character inside
    a pair of single quote marks creates a character constant. As a result, ‘a’, ‘;’,
    and ‘0’ are all acceptable character constants. The letter `a` is represented
    by the first constant, a semicolon by the second, and the symbol zero by the third
    – which is not the same as the number zero.


    A single character encased in single quotes is not the same as a C-style character
    string, which may include any number of characters. An `NSString` string object
    is a string of characters wrapped in a pair of double quotes and preceded by a
    `@` character, as explained in the previous chapter. Even though it contradicts
    the preceding rule, the character constant `\n`, the newline character, is a legitimate
    character constant. Because the backslash character is regarded as a special character,
    this is the case. In other words, even if the character `\n` is made up of two
    characters, the Objective-C compiler sees it as a single character. The backslash
    character is used to begin other special characters.


    To show the value of a `char` variable, use the format characters `%c` in an `NSLog`
    call. The fundamental Objective-C data types are used in `Program`.


    ## Qualifiers: long, long long, short, unsigned, and signed


    On some computer systems, the defined integer variable has an increased range
    if the qualifier `long` is added right before the `int` declaration. A lengthy
    int declaration would look like this:


    ```

    long factorial;

    ```


    The variable `factorial` is now declared to be a long integer variable. The range
    of a `long` variable, like that of floats and doubles, is determined by your computer
    system. The letter `l` is used as a modifier before the integer format letters
    in `NSLog` to represent the value of a long int.

