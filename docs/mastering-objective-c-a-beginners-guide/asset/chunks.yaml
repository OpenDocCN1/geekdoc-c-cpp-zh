    essential. This allows someone reading our program to differentiate between class
    names and other sorts of variables by looking at the first character of the name.
    Let’s take a brief detour to discuss name formation in Objective-C.


    To hold integer values, we used many variables. In `Program`, for example, we
    utilized the variable `total` to hold the result of adding the two numbers 55
    and 35.


    The Objective-C programming language allows us to store data types other than
    integers in variables as long as the variable is declared properly before it is
    utilized in the application. Variables may use to hold floats, characters, and
    even objects.


    The rules for creating names are straightforward: They must begin with a letter
    or underscore (`_`), and can include any combination of letters (upper- or lowercase),
    underscores, or digits 0–9. The following is a list of acceptable names:


    * `sum`

    * `pieceFlag`

    * `i`

    * `myLocation`

    * `numberOfMoves`

    * `sysFlag`

    * `ChessBoard`


    The following names, on the other hand, are not acceptable for the reasons stated:


    * `sum$value $`: The character `sum$value ` is not valid.

    * `piece flag`: Embedded spaces are not permitted in the `piece flag`.

    * `3Spencer`: Names can’t begin with a number.

    * `int`: This is a reserved word.


    The variable name `int` cannot use because it has a specific significance to the
    Objective-C compiler. This is referred to as a reserved name or a reserved term.
    Any name that has specific importance to the Objective-C compiler, in general,
    cannot be used as a variable name.


    Remember that upper- and lowercase letters in Objective-C are separate.


    As a result, each variable’s names `sum`, `Sum`, and `SUM` refers to a separate
    variable.


    As previously stated, when naming a class, begin with a capital letter. In contrast,
    instance variables, objects, and method names often begin with lowercase letters.
    To improve readability, capital letters are used inside names to denote the beginning
    of a new word, as seen in the instances below:


