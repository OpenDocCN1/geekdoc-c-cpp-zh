    Objective-C 中，标志作为真或假的概念最自然的翻译方式是分别对应数字 1 和 0。当我们在程序循环内部将 `isPrime` 的值设置为 1 时，我们是将其设置为真，以表示
    `p` “是素数”。如果在执行内部 `for` 循环期间发现了偶数因数，则将 `isPrime` 的值设置为假，以指示 `p` 不再是“素数”。


    数字 1 常被用来表示真或开启状态，而值 0 通常被用来表示假或关闭状态，这并不意外。这种表示法类似于计算机中单比特（bit）的概念。当比特位被开启时，其值为
    1；当被关闭时，其值为 0。然而，在 Objective-C 中，这些逻辑值还有更强的依据。这与 Objective-C 编程语言处理真和假的概念有关。


    当我们开始讨论这一章时，我们提到如果满足 `if` 语句内提供的标准，将执行后续的程序语句。但“满足”意味着什么？在 Objective-C 中，满足意味着非零，且仅此而已。


    由于 `if` 语句中的条件（在本例中，仅为值 200）是非零的因此符合条件，`NSLog` 语句被执行。


    我们在本章的程序中使用了“非零表示满足”和“零表示不满足”的概念。


    这是因为当在 Objective-C 中评估关系表达式时，如果它满足条件，则被赋值为 1；如果不满足，则赋值为 0。结果，语句的评估过程如下：


