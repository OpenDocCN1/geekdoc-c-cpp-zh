    ## EXCEPTIONS AND ERRORS


    Two types of errors can arise when a program is written in Objective-C. Unexpected
    errors are “severe” programming mistakes that cause our application to stop. These
    are referred to as exceptions because they represent an unusual event in our software.
    Expected mistakes, on the other hand, occur naturally during the execution of
    a program and may be used to evaluate the success of an activity. These are referred
    to as errors.


    We might also consider the contrast between exceptions and errors as distinguishing
    their target audiences. In general, exceptions are used to notify the programmer
    of a problem, whereas errors notify the user that a requested action is not being
    accomplished.


    ![](images/ufig11_3.jpg)


    Control flow of exception and error.


    Attempting to access a non-existent array index, for example, is an exception
    (a programming fault), but failing to open a file is an error (a user error).
    In the first case, something went horribly wrong with our program’s flow, and
    it should have stopped immediately following the exception. In the latter scenario,
    we’d want to notify the user that the file couldn’t be opened and maybe request
    that they try again, but there’s no reason our software couldn’t keep running
    after the mistake.


    ## **EXCEPTION HANDLING**


    The main benefit of Objective-C exception handling capabilities is that they separate
    error detection from error management. When a portion of code detects an exception,
    it may “throw” it to the nearest error handling block, which may “catch” and handle
    specific issues appropriately. The ability to throw exceptions from anywhere eliminates
    the need to constantly check for success or failure messages from each function
    involved in a particular job.'
