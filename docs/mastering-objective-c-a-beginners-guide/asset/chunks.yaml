    ## OBJECTIVE-C LVALUES AND RVALUES


    There are two types of expressions in Objective-C.


    * lvalue: “lvalue” expressions are those that relate to a memory location. An
    assignment can have an lvalue on either the left or right side.

    * rvalue: The term rvalue refers to a data value stored in memory. Because an
    rvalue is an expression that cannot assign a value, it can appear on the right
    but not the left.


    Variables are lvalues and can thus appear on the assignment’s left side. Numerical
    literals cannot be allocated and cannot appear on the left side since they are
    rvalues.


