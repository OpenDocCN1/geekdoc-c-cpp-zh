    ### OBJECTIVE-C TOKENS


    In an Objective-C program, a token is a keyword, identifier, constant, literal
    string, or symbol. The following Objective-C statement, for example, is made up
    of six tokens:


    Individual tokens are referred to as:


    ### SEMICOLONS


    In an Objective-C program, a semicolon serves as a statement terminator. That
    is, a semicolon must follow each phrase. It represents the end of a single logical
    object.


    Take a look at the following two statements:


    ### COMMENTS


    Comments, like help text in our Objective-C program, are ignored by the compiler.
    They begin with `/*` and end with the characters `*/`, as seen below.


    There may be no comments within comments, nor can they be within strings or character
    literals.


    ### IDENTIFIERS


    An Objective-C identifier recognizes a variable, function, or other user-defined
    entity. An identifier begins with one of the letters A to Z, a to z, or an underscore
    and ends with zero or more letters, underscores, or digits (0 to 9).


    Punctuation characters such as `@`, `$`, and `%` are not permitted in Objective-C
    identifiers. Objective-C is a case-sensitive programming language. As a result,
    in Objective-C, `Manpower` and `manpower` are two distinct IDs. Here are some
    examples of acceptable identifiers:


    ### KEYWORDS


    The following is a list of Objective-C reserved terminology. These reserved words
    may not use as constant, variable, or identifier names.


    | auto | return | else | switch |

    | break | enum | register | typedef |

    | const | extern | short | union |

    | case | float | long | unsigned |

    | Char | goto | signed | void |

    | continue | for | sizeof | volatile |

    | if | default | struct | while |

    | do | int | Static | _Packed |

    | double | protocol | interface | implementation |

    | NSObject | NSInteger | retain | CGFloat |

