  trans: '

    Objective-C 是一种优秀的内存管理语言；目前已有编译器可以将 Objective-C 代码转换为静态代码分析，该语言利用这种分析将有价值的信息与“垃圾”区分开来。


    理解 Objective-C 最关键的组件是其面向对象的特性。你可以使用这门新语言移动图表和更改文件，但理解其局限性对于发挥其优势至关重要。


    Objective-C 是一门开发于 20 世纪 80 年代的编程语言，它的许多方面仍被用于 iOS 特定的移动应用开发。虽然还没有突破性能让 Objective-C
    可以在所有平台上运行，但 Objective-C 在 iOS 应用中与 `C` 及其他语言兼容。


    Swift 是一种更现代的 iOS 编程语言，与 Objective-C 竞争。关于哪种编程语言能产生更好的 iOS 移动应用开发结果，存在许多争论。


    # 为什么选择 OBJECTIVE-C？


    选择 Objective-C 编程语言有许多原因。首先也是重要的是，它是一种面向对象的语言。面向对象的方法对于提供 `Cocoa` 框架的功能是必不可少的。其次，由于
    Objective-C 是 `ANSI C` 的扩展，现有的 `C` 程序可以转换为使用软件框架，而不会丢失开发投入的任何工作。由于 Objective-C
    包含了 `C`，我们在与其交互时可以获得其所有的益处。


    我们可以决定是使用面向对象编程 (OOP) 方法（例如创建一个新的 `class`）还是过程化编程方法（定义一个结构和一些 `functions` 而不是
    `class`）。


    此外，Objective-C 是一门相对简单的编程语言。它具有基础、无歧的语法，易于学习。


    OOP 以其自我意识的语言和对抽象设计的强调，对新招人员来说有一条陡峭的学习曲线。一种结构良好的语言（如 Objective-C）可能会让成为一名熟练的面向对象程序员变得简单得多。


    与其他基于 `C` 的面向对象语言相比，Objective-C 非常动态。编译器维护了大量关于对象本身的信息以供运行时使用。编译时做出的决策会被推迟到程序运行时。由于它们的动态性，Objective-C
    程序提供了极大的灵活性和威力。它提供了其他面向对象语言不具备的两个优势。


    Objective-C 提供了一种开放的动态绑定方法，允许创建基础的交互式用户界面。消息并不一定限于接收者的 `class` 或 `method` 名称。因此，软件框架可以允许用户在运行时做出选择，同时为开发者在设计上提供创作自由。（动态绑定、消息、`class`
    和 `receiver` 等术语将在本文后面详细描述。）


    动态性使得开发更好的工具成为可能。通过使用运行时系统的接口（该接口提供运行的应用信息），可以构建监控、干预并揭示 Objective-C 应用底层结构和活动的工具。


    # 优点与缺点


    ### 优点


    * 与 `C++` 以及 `Objective-C` 的兼容性。

    * 方法元汇（Method swizzling）是一个有效特性。

    * 在二进制框架编码方面有更专用的支持。


    ### 缺点


    * 由于 Objective-C 基于 `C`，因此命名空间至关重要。Objective-C 应用中的每个 `class` 必须在全局范围内是唯一的。为了尽量减少冲突，通常的做法是为类名添加前缀。我们拥有
    `Foundation Framework` 类的 `NS` 前缀和 `UIKit` 类的 `UI` 前缀。

    * 特定的指针。

    * 在 `nil` 对象上发送消息而不会崩溃，且缺乏严格的类型检查，这使得识别和解决问题变得更加困难。

    * 语言的语法繁琐且困难。


    # 需要考虑的因素


    Objective-C 应用开发可以加速，并且它是向程序添加基于对象的功能的有效方法。这种超集语言有许多基本的考虑因素：


    * 升级基于 Objective-C 构建的应用需要定期维护。虽然这种语言已经过时，但它并没有淘汰。为了保持更新，只需要少量的维护。

    * 许多 API 对于 `Swift` 开发的应用来说仍有很多追赶工作；因此需要的适应很少。这意味着 Objective-C 在 iOS 移动应用中可能更容易实现。

    * 对象处理使得苹果痴迷于对象网络。这些项目可以使用 Objective-C 轻松移动。

    * Objective-C 可能让所有 Apple iOS 设备（包括智能手机和平电脑）的应用更容易开发。


    # OBJECT-C 与 C++


    根据 Wilkerson 的说法，`C++` 于 1979 年建立，将对象和实例方法与原始 `C` 编程语言集成。创建 Objective-C 编程语言理念是
    OOP 对于大型软件项目将更有生产力且更有效；许多资深专家认为，这导致了 `C++` 在随后的几年中广泛流行。根据编程社区专家的说法，大多数现代桌面应用都是用
    `C++` 编写的。由于它的流行，创建了各种框架和库来扩展 `C++`，用于高性能图形、音频数字信号处理和用户界面设计。


    两种语言都开发自 `C`，尽管它们非常不同。Objective-C 主要依赖于其运行时库来管理继承和多态，而 `C` 高度依赖编译时选项。尽管如此，对于 `C++`，重点通常放在编译时结论上。中间层计算机语言
    `C++` 兼容许多跨平台操作系统，包括 Windows、UNIX 和 macOS。另一方面，Apple 在其 `Cocoa` 和操作系统使用了 Objective-C
    这种通用的面向对象编程语言。


    # OBJECTIVE-C 与 SWIFT 的区别


    Swift 是 Apple 在 2014 年 6 月推出的的一种计算机语言。Objective-C 具有人们对基于 `C` 的语言所预期的所有缺陷。Objective-C
    用 `@` 为新关键字加上前缀以将其与 `C` 类型区分来。Swift 不使用 `C`。因此，它可以聚合所有的 Objective-C 类型和对象相关的关键字，并提取它们的许多
    `@` 符号。


    与其他最近的计算机语言一样，Swift 代码非常类似于自然英语。相比于 Objective-C 程序员经历过的痛苦体验，这种可读性使得现有的 `JavaScript`、`Java`、`Python`、`C#`
    和 `C++` 程序员更容易接受 Swift 作为其工具链的一部分。


    # FOUNDATION 框架


    `Foundation Framework` 具有丰富的功能，下文描述：


    * 它包含了若干种扩展数据类型，如 `NSArray`、`NSDictionary`、`NSSet` 等。

    * 它拥有一系列函数用于处理文件、字符串等。

    * 它有 `URL` 处理 `functions` 以及如日期格式化、数据处理、错误处理等工具。


    # 学习 OBJECT-C


    在学习 Objective-C 时，要记住的关键点是保持关注原则，而不是纠结于语言的技术细节。


    学习编程语言的目标是成为一名更好的程序员，或者在开发、实施和维护现有系统方面更成功。


