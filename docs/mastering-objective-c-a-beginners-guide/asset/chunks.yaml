    ## 布尔变量 (BOOLEAN VARIABLES)


    几乎每个学习编程的人最终都将被要求编写一个生成质数表的程序。为了重温记忆，质数是指不能被 1 以外的任何数字整除的数字。第一个质数是 2。下一个质数是 3，因为它不能被
    1 以外的任何整数整除；而 4 不是质数，因为它被 2 整除。


    我们可能会使用多种技术来构建质数表。如果我们被要求创建 55 以内的质数，最明显且简单的方法将是测试每个整数 `p` 是否被 2 到 `p-1` 的所有整数整除。如果任何这样的整数能整除
    `p`，则 `p` 不是质数；否则，它是。


    程序创建一个从 2 到 55 的质数列表。


    关于程序有几点需要说明。外层的 `for` 语句创建一个遍历 2-55 数字的循环。循环变量 `p` 表示当前正在测试的是否为质数的值。变量 `isPrime`
    在循环的第一行被赋值为 1。该变量的使用很快就会显而易见。


    使用第二个循环将 2 到 `p-1` 的数字除以 `p`。内部执行测试以判断 `p` 除以 `d` 的结果是否为 0。如果是，则 `p` 不可能是质数，因为它可以被
    1 以外的任何整数整除。将 `isPrime` 变量设置为 0，以表示 `p` 不再是质数选项。


