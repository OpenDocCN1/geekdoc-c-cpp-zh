    如果 `c` 小于零，则评估 `?` 之后的表达式。该表达式本质上是常量整数 -1，如果 `c` 小于 0，则将其赋值给 `s`。


    如果 `x` 大于零，则评估 `:` 之后的表达式并赋值给 `s`。如果 `c` 大于等于零，则将值 `c * c` 或 `c2` 赋值给 `s`。


