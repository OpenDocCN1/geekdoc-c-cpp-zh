    ## 整数与浮点转换


    为了高效地编写 Objective-C 应用程序，我们必须首先掌握 Objective-C 中浮点值和整数值的隐式转换规则。程序展示了数值数据格式之间极其简单的转换。


    在 Objective-C 中，当将浮点值赋值给整数变量时，数字的小数部分会被截断。因此，在之前的程序中，当 `f1` 的值赋值给 `i1` 时，数字 `223.125`
    被截断，这意味着只有整数部分（即 `223`）被保存在 `i1` 中。程序输出的第一行证实了这一点。


    当将整数变量赋值给浮点变量时，数字的值不会改变；系统只是翻译该值并将其保存。程序输出的第二行证实了 `i2` 的值被正确翻译并保存在浮点变量中。


    程序的两行强调了在创建算术表达式时需要注意的两点。当表达式中的两个操作数都是整数（包括短型、无符号和长型），操作遵循整数算术原则。因此，即使结果被放入浮点变量，除法操作产生的任何小数部分都会丢失（正如我们在程序中所做的那样）。当整数变量
    `i2` 除以整数 `100` 时，系统按整数除法进行，浮点变量 `f1` 的值为 `-1`。


    在之前的程序中，随后的除法涉及一个整数变量和一个浮点常量。在 Objective-C 中，只要值中有一个浮点变量或常量，两个值之间的任何操作都是作为浮点操作完成的。因此，当
    `i2` 除以 `100.0` 时，系统执行浮点除法并返回 `-1.6`，将其赋值给浮点变量 `f1`。




    在声明和定义方法时，我们之前已经见过将类型放在括号内用于指定返回和参数类型。在表达式内部，它有独特的用途。


