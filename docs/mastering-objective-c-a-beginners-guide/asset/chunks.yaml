    | --- | --- |

    | 1 | char:A single octet is typical (one byte). This is a kind of integer. |

    | 2 | int:The machine’s most natural integer size. |

    | 3 | float:A floating-point value with single precision. |

    | 4 | Double:A floating-point value with double precision. |

    | 5 | void:resents absence of type. |


    The Objective-C programming language also defines different variables, which we
