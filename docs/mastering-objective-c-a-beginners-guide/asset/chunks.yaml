    # 2. About the Editor


    **Sufyan bin Uzayr** is a writer, coder, and entrepreneur having over a decade
    of experience in the industry. He has authored several books in the past, pertaining
    to a diverse range of topics, ranging from History to Computers/IT.


    Sufyan is the Director of `Parakozm`, a multinational IT company specializing
    in EdTech solutions. He also runs `Zeba Academy`, an online learning and teaching
    vertical with a focus on STEM fields.


    Sufyan specializes in a wide variety of technologies, such as `JavaScript`, `Dart`,
    `WordPress`, `Drupal`, `Linux`, and `Python`. He holds multiple degrees, including
    ones in Management, IT, Literature, and Political Science.


    Sufyan is a digital nomad, dividing his time between four countries. He has lived
    and taught in universities and educational institutions around the globe. Sufyan
    takes a keen interest in technology, politics, literature, history, and sports,
    and in his spare time, he enjoys teaching coding and English to young students.


    Learn more at [sufyanism.com](http://sufyanism.com).


    # 3. Acknowledgments


    There are many people who deserve to be on this page, for this book would not
    have come into existence without their support. That said, some names deserve
    a special mention, and I am genuinely grateful to:


    *   My parents, for everything they have done for me.

    *   The `Parakozm` team, especially `Divya Sachdeva`, `Jaskiran Kaur`, and `Simran`,
    for offering great amounts of help.

    *   The `CRC` team, especially `Sean Connelly` and `Danielle Zarfati`, for ensuring
    that the book’s content, layout, and formatting remain perfect.

    *   Reviewers of this book, for going through the manuscript and providing their
    insight.

    *   Typeset, cover designers, printers, and everyone else, for their part in the
    development.

    *   All the folks associated with `Zeba Academy`, either directly or indirectly,
    for their help and support.

    *   The programming community, in general, and the web development community,
    in particular, for all their hard work and efforts.


    **Sufyan bin Uzayr**


    # 4. Zeba Academy – Mastering Computer Science


    The `Mastering Computer Science` series of books are authored by the Zeba Academy
    team, led by `Syan bin Uzayr, consisting of:


    *   `Divya Sachdeva`

    *   `Jaskiran Kaur`

    *   `Simran Rao`

    *   `Aruqqa Khateib`

    *   `Suleymen Fez`

    *   `Ibbi Yasmin`

    *   `Alexander Izassar`


    `Zeba Academy` is an EdTech venture that develops courses and content for learners
    primarily in STEM fields. Additionally, `Zeba Academy` is actively engaged in
    running IT schools in the CIS countries and is currently working in partnership
    with numerous universities. For more info, please visit [https://zeba.academy](https://zeba.academy)


    # 5. CHAPTER 1 Objective-C Overview


    DOI: [10.1201/9781003358534-1](https://doi.org/10.1201/9781003358534-1)


    ## IN THIS CHAPTER


    *   Object-Oriented Programming

    *   Framework for Foundations

    *   Learning Objective-C

    *   Advantages and Use of Objective-C


    A general-purpose, object-oriented computer language called Objective-C enhances
    the C language with Smalltalk-style messaging. `Cocoa` and `Cocoa Touch` are Apple’s
    major programming languages for the OS X and iOS operating systems and their accompanying
    APIs. This book will guide you through a simple and practical approach to learning
    the Objective-C programming language.


    Objective-C programming is a general-purpose programming language. Although it
    is not exclusive to any platform or system, it may be used to build various frameworks.
    Objective-C programming extends the language C with communication capabilities.


    Objective-C is one of Apple’s core programming languages for the iOS platform
    and is used to create mobile applications for this platform. It enables developers
    to be more detail-oriented and accept objects and other programming languages
    since it is a superset of the C language.

