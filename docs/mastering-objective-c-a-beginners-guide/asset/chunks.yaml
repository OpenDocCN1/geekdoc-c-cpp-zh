    Union, and so on. Let us look at fundamental variable types.


    ## OBJECTIVE-C VARIABLE DEFINITION


    A variable definition in Objective-C instructs the compiler where and how much
    storage to produce for the variable. As seen below, a variable description explains
    a data type and provides a list of one or more variables.


