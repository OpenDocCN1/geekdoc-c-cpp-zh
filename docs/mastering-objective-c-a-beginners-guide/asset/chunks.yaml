    @throw` is used to discover exceptions, whereas `@try`, `@catch()`, and `@finally`
    are used to catch and manage them. We should be familiar with these exception
    handling constructs if we have worked with exceptions in C#.


    It is critical to understand that exceptions in Objective-C are somewhat slow.
    As a result, its use is limited to identifying serious programming faults rather
    than basic control flow. Please refer to the section on Error Handling if we are
    attempting to determine what to do in the case of an expected problem (e.g., inability
    to load a file).


    # THE CLASS NSException


    Exceptions are represented by instances of the `NSException` class or a subclass
    thereof. This is a straightforward approach for encapsulating all relevant information
    about an exception. The following are the three qualities of an exception:


    - `name` – An instance of `NSString` that uniquely identifies the exception.

    - `reason` – An `NSString` object describing the exception in a human-readable
    format.

    - `userInfo` – An instance of `NSDictionary` holding exception-specific information.


    Several variables in the Foundation framework specify “standard” exception names.
    These strings are used to determine the type of exception that was caught.


    Using the `initWithName:reason:userInfo:` initialization function, we can easily
    create new exception objects with specific data. It is possible to catch and throw
    custom exception objects by following the same steps outlined in the following
    sections.


    # MAKING EXCEPTIONS


    Let’s start with the default exception-handling behavior of a program. When we
    attempt to access an index that does not exist in Objective-C, the `objectObject:`
    function of `NSArray` returns an `NSRangeException` (a subclass of `NSException`).
    So, if we request the tenth item in a three-component array, we’ll have an exception
    to play with:


    When an uncaught exception occurs, Xcode pauses the program and displays the line
    that produced the error.


    # CATCHING EXCEPTIONS


    To manage exceptions, any code that may result in one should be put in a `@try`
    block. The `@catch()` directive is then applied to catch specific exceptions.
    We may execute any housekeeping code in a `@finally` block if necessary. All three
    of these exception-handling instructions are demonstrated in the example below:


    The message `[crew objectAtIndex:10]` causes the software to produce an `NSRangeException`,
    which is caught by the `@catch()` instruction. The actual exception handling takes
    place within the `@catch()` clause. In this instance, we just display a helpful
    error message, but in other circumstances, we’ll probably need to create code
    to address the problem.


    When an error is detected in the `@try` block, the program moves to the appropriate
    `@catch()` block, preventing any code after the exception from being executed.
    This is an issue if the `@try` block needs to be cleaned up (e.g., if it opened
    a file, it needs to be closed). This issue is resolved by the `@finally` block
    since its execution is assured regardless of whether an exception was thrown or
    not. This makes it an excellent spot for resolving any outstanding issues with
    the `@try` block.


    The parentheses after the `@catch()` directive let us define the type of exception
    to catch. In this case, the exception is an `NSException`, which is the most fundamental
    exception type. An exception, on the other hand, can be of any type, not only
    `NSException`. For instance, the following `@catch()` directive will handle a
    generic object:


    # EXCEPTION THROWING


    In our code, whenever we come into unusual situations, we create an instance of
    `NSException` and fill it with the pertinent data. The closest `@try/@catch` block
    will take care of it when we throw it using the appropriately called `@throw`
    directive.


    The following example generates random numbers between a specified interval. The
    method throws a custom error if the caller provides an incorrect interval.


    This code will not throw an error since it provides a valid interval (0, 10) to
    `generateRandomInteger()`. If we change the interval to (0, −10), we’ll see the
    `@catch()` section in operation. This is what occurs behind the scenes when the
    foundation classes get exceptions (e.g., the `NSRangeException` raised by `NSArray`).


    We may also re-throw previously caught exceptions. This is useful when we want
    to be alerted of an exception but do not want to handle it ourselves. As a convenience,
    we may omit the argument to the `@throw` directive:


    The captured exception is subsequently forwarded to the next-highest handler,
    in this instance, the top-level exception handler. This should display the results
    of our `@catch()` block and the normal Terminating program owing to an uncaught
    exception… message, followed by an abrupt shutdown.


    The `@throw` directive does not have to throw `NSException` objects; it can throw
    anything. The following example throws an `NSNumber` object instead of a normal
    exception. Also, notice how we may target certain objects by following the `@try`
    block with a series of `@catch()` statements:


    Rather than returning an `NSException` object, `generateRandomInteger()` attempts
    to generate a new integer between the specified “default” bounds. The example
    shows how to utilize `@throw` with different objects; however, it isn’t the best
    application design or the most effective use of Objective-C exception-handling
    tools. If we wish to utilize the thrown value, as the previous code does, a simple
    conditional check using `NSError`, as discussed in the next section, would be
    preferable.


    Some of Apple’s core frameworks also expect an `NSException` object to be thrown,
    so use caution when integrating with the standard libraries.


    # MANAGING ERRORS IN OBJECTIVE-C


    Errors are intended to be a quick and easy way to identify whether or not an action
    was successful, whereas exceptions are intended to warn programmers when anything
    goes wrong. Errors, unlike exceptions, are intended to be used in ordinary control
    flow statements.


    # THE NSError CLASS


    The only thing mistakes and exceptions have in common is that they are both implemented
    as objects. The `NSError` class contains all of the information needed to signal
    errors:


    - `code` – An `NSInteger` that identifies the mistake uniquely.

    - `Domain` – An `NSString` object that describes the errors.

    - `userInfo` – An instance of `NSDictionary` holding problem-specific information.
    This is significantly more commonly used than the `userInfo` dictionary of `NSException`.


    Aside from these critical properties, `NSError` contains many variables that aid
    in the display and processing of errors.


    - `localizedDescription` – An `NSString` containing the whole error explanation,
    frequently including the failure’s reason. This number is often displayed to the
    user via an alert panel.

    - `localizedFailureReason` – An `NSString` with a different explanation for the
    error’s cause. Customers that want to remove the error’s cause from its comprehensive
    explanation should utilize this option.

    - `recoverySuggestion` – An `NSString` gives the user information on how to recover
    from a mistake.

    - `localizedRecoveryOptions` – An `NSArray` containing titles for the buttons
    in the error dialog. A single OK button is displayed to dismiss the alert if this
    array is empty.

    - `helpAnchor` – When the Help anchor button in an alert panel is pressed, an
    `NSString` is shown.


    - The `initWithDomain:code:userInfo` method, like `NSException`, may be used to
    initialize `NSError` objects with detailed data.


    ## ERROR DOMAINS

