    ## switch 语句


    你在上一个程序示例中看到的这种 `if-else` 语句链（将变量的值按顺序与多个值进行比较）在编程中非常普遍，以至于存在一种专门的 Objective-C
    程序语句可以精确地实现这一目的。该语句被称为 `switch` 语句，其典型格式如下：


    括号中的表达式与值 `value1`、`value2`、. . . , `value n` 进行比较，这些值必须是简单的常量或常量表达式。如果识别出一个值与表达式之值相等的
    `case`，则执行 `case` 之后的程序语句。应该注意的是，当包含多个此类程序语句时，它们不需要括在大括号之间。


    `break` 语句表示某个 `case` 的结束并终止 `switch` 语句的执行。请在每个实例后始终添加 `break` 语句。如果对某个实例未这样做，则每当运行该
    `case` 时，程序执行将进入下一个 `case`。这通常是有意为之的；如果我们想这样做，请确保包含注释以警告他人我们的目标。


    如果表达式的值与任何 `case` 值都不匹配，则执行名为 `default` 的特殊可选 `case`。这基本上类似于上一个示例中最后的 catchall
    otherwise（否则所有其他情况）。实际上，`switch` 语句的一般形式可以表述为 `if` 语句，如下：


    在读取表达式后，`operator` 的值与每个 `case` 提供的值进行顺序比较。当发现匹配项时，执行 `case` 内部提供的语句。然后 `break`
    语句退出 `switch` 语句，此时程序执行完成。如果没有一个 `case` 匹配 `operator` 的值，则运行 `default` 情况，显示“Unknown
    operator（未知运算符）”。


    在在先的程序中，`default` 情况中的 `break` 语句实际上是不需要的，因为在 `switch` 内部该情况下之后没有其他语句。尽管如此，记住在每个实例结束时添加
    `break` 是一种良好的编程习惯。


    记住在编写 `switch` 语句时，任何两个 `case` 值不能相同。然而，我们可以将多个 `case` 值与特定的程序指令关联起来。这只需在执行公共语句之前列出各种
    `case` 值即可实现。例如，在下面的 `switch` 语句中，如果 `operator` 等于星号或小写字母 `x`，则运行 `multiply:`
