  trans: '

    垃圾回收器是一个可选服务；如果我们不想使用它，我们的应用程序可以依赖引用计数机制。该系统采用了一种新的延迟释放技术，极大地减少了人工引用计数所需的工作量。


    在编写时，iPhone 不支持自动垃圾回收器。


    ## C 内部


    Objective-C 编程语言是 `C` 编程语言的面向对象的扩展和超集。这意味着 `C` 的原生威力是可用的，且 `C` 库可以直接利用它。此外，由于
    Mac OS X（一个 `UNIX` 系统）主要使用 `C` 和 Objective-C 编写（用于高层组件），这使得该语言与操作系统之间存在共生关系。


    ## C++ 流畅性


    Objective-C 不仅仅是 `C` 的超集；它还能理解并执行 `C++` 代码。在这种配置下，该语言被称为 Objective-C++，允许将 Objective-C
    和 `C++` 代码语句相结合。它还允许直接使用 `C++` 库。


    ## 简单性


    Objective-C 受 Smalltalk 启发的对象结构倾向于简单。许多使语言复杂的特性（模板、重载、多重继承等）在 Objective-C 中都是缺失，它利用其动态特性来实现更简单的编程范式。


    ## 苹果产品访问


    通过 Objective-C 的每一个 Mac OS X 新版本以及现在的 iPhone OS 都包含了许多有趣的新功能，这些功能可以从 Objective-C
    直接访问。这显著提升了 Objective-C 的易用性。


