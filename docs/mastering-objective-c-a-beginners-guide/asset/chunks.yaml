    ## ACCESSING INSTANCE VARIABLES AND DATA ENCAPSULATION


    We’ve seen how the methods that deal with fractions may directly access the numerator
    and denominator instance variables by name. In reality, an instance method may
    be useful in various situations.


    On the other hand, a class method can’t access its instance variables directly
    since it’s a class method dealing solely with the class itself, not any of its
    instances. What if we needed to access our instance variables from a different
    location, from inside our primary routine?


    We won’t be able to do so directly since data encapsulation is a vital idea that
    describes the fact that they are concealed from us. It allows someone authoring
    class definitions to expand and alter them without being concerned about whether
    programmers (i.e., class users) are tinkering with the class’s internal workings.
    Data encapsulation adds a layer of protection between the coder and the developer
    of classes.


    We may access our instance variables cleanly by writing custom methods to set
    and get their values. To set the values of our Fraction class’s two instance variables,
    we created setNumerator: and setDenominator: methods. We’ll need to create two
    additional methods to access the values of those instance variables. For example,
    we’ll build two new methods called numerator and denominator to access the respective
    instance variables of the Fraction that is the message’s recipient.


    We return the matching integer value as a result. The declarations for our two
    new methods are as follows:


    Here are some definitions:


    It is worth noting that the names of the methods and the instance variables they
    access are identical. This is not an issue (though it may appear strange at first);
    it is normal practice. The program puts our two new approaches to the test.


    This NSLog statement indicates the results of sending two messages to my_Fraction:
    the first to obtain the numerator’s value and the second to retrieve the denominator’s
    value:


    As a result, the numerator message will be delivered to the Fraction object my_Fraction
    in the initial message call. The code will return the value of the numerator instance
    variable for that fraction in that method. Remember that the context of a method,
    while running, is the object of the message’s recipient. When the numerator method
    accesses and returns the value of the numerator instance variable, the value of
    my_Fraction’s numerator is obtained and returned. The returned integer value is
    subsequently provided to NSLog, where it is displayed.


    The denominator method will be called for the second message call to access and
    return the value of my_Fraction’s denominator, which will subsequently be provided
    to NSLog to be shown.


    In addition, methods that set the values of instance variables are commonly referred
    to as setters, whereas methods that obtain the values of instance variables are
    referred to as getters. Setters for the Fraction class are setNumerator: and setDenominator:,
    whereas getters are numerator and denominator. Setters and getters are also known
    as accessor techniques when used together.


    Make that we grasp the distinction between setters and getters. Because its function
    is to take an argument and set the relevant instance variable to the value of
    that argument, setters do not return a value. In that instance, no value should
    return. Setters typically do not return values because their function is to set
    the value of an instance variable. On the other hand, the getter is used to “get”
    the value of an instance variable stored in an object and return it to the application.
    To do this, the getter must use the return statement to return the value of the
    instance variable.


    Again, the concept of data encapsulation states that we cannot directly set or
    receive the value of an instance variable from outside of the methods provided
    for the class. Instead, we must construct setter and getter methods to do so.
    As a result, we must employ strategies to gain access to data ordinarily concealed
    from the “outside world.” This offers centralized access to the instance variables
    and indirectly prevents other code from modifying these values, making our applications
    more difficult to read, debug, and edit.


    It’s also worth noting that there’s a technique called new that combines the acts
    of an alloc and an init. As a result, this line might be used to allocate and
    initialize a new.


    It is often preferable to utilize the two-step allocation and initialization strategy
    to comprehend that two specific activities are occurring cognitively: We create
    a new object and then initialize it.


