    # do 语句


    在本节在此为止检查的两种循环结构在执行循环之前都会测试条件。因此，如果不符合要求，循环体可能永远不会执行。在设计程序时，有时让测试在循环结束时而不是开始运行更好。自然地，Objective-C
    语言有一种名为 `do` 语句的独特语言结构来处理此类情况。该语句的语法如下：


    `do` 语句按照以下顺序运行：首先执行程序语句。然后计算括号内的表达式。如果表达式求值为真（true），则继续循环并再次运行程序语句。只要表达式求值保持为真，就会重复程序语句。当表达式求值为为假（false）时，循环结束，并正常执行程序中的后续语句。


    `do` 语句只是 `while` 语句的转置，将循环条件置于循环的末尾而不是开头。


    为了反转数字的数字，程序使用了 `while` 语句。回到该软件并尝试思考如果用户输入 `0` 而不是 `45678` 会发生什么。`while` 语句的循环将永远不会运行，也不会显示任何输出。如果我们使用
    `do` 语句代替 `while` 语句，你就可以确保程序循环至少完成一次，从而确保在任何情况下至少显示一个数字。


    # do-while 循环


    与在循环顶部测试循环条件的 `for` 和 `while` 循环不同，Objective-C 中的 `do-while` 循环在循环底部检查其条件。


    `do-while` 循环与 `while` 循环相同，但它保证至少运行一次。


    由于条件表达式位于循环的末尾，循环语句在测试条件之前只执行一次。如果条件为真，控制流返回到 `do`，再次执行循环中的语句。此步骤不断重复，直到指定的条件不再为真。


    # break 语句


    在运行循环时，我们可能希望在特定条件发生时立即退出循环，例如检测到错误情况或在数据列表中找到正在寻找的数据。我们可以通过 `break` 语句来实现。当执行
    `break` 语句时，程序将退出当前循环（无论是 `for`、`while` 还是 `do`）。


