- fmt: "\nIn Objective-C, a function is a set of statements that carry out a specific\
    \ task. Every Objective-C program has a single C function named `main()`; even\
    \ the most straightforward programs may declare additional functions. We may divide\
    \ your code into many functions.\n\nWe must divide our code into discrete functions,\
    \ but each function should logically perform a specific duty. A function declaration\
    \ specifies the function's name, return type, and parameters to the compiler.\
    \ The definition of a function specifies its body.\n\nIn Objective-C, the term\
    \ for the function is a method. The Objective-C basic framework has many methods\
    \ that our application may invoke.\n\nThe `appendString()` method, for example,\
    \ appends one string to another. A method is known by several names, including\
    \ function, subroutine, and process.\n\n## CREATING A METHOD\n\nIn the Objective-C\
    \ programming language, a method definition takes the following general form:\n\
    \nA method specification comprises a method header and a method body in the Objective-C\
    \ programming language.\n\nThe following are the components of a method:\n\n*\
    \   **Return type**: A method may return a value as its `returntype` in Objective-C.\
    \ The return type specifies the data type of the function's return value. Some\
    \ methods perform the required operations but do not return a value. In this instance,\
    \ the `void` is utilized as the `returntype`.\n*   **Method Name**: The actual\
    \ name of the method. The method signature consists of the method's name and the\
    \ list of its arguments.\n*   **Arguments**: An argument serves a similar purpose\
    \ as a placeholder. When calling a function, we send a value-containing parameter.\n\
    \    This value is referred to as the parameter or argument itself. The parameter\
    \ list of a method describes the type, order, and the number of its arguments.\
    \ Arguments are optional, and a method may not have any.\n*   **Joining Argument**:\
    \ A joining argument makes it simpler to interpret and more clear when it is used.\n\
    *   **Method Body**: The method body consists of statements that explain the method's\
    \ functionality.\n\n**Example:** The `max()` method's source code is shown below.\
    \ This function takes two arguments, `numbr1` and `numbr2`, and returns the greater\
    \ of the two:\n\n## DECLARATIONS OF METHOD\n\nA method declaration tells the compiler\
    \ the function's name and how to call it. In Objective-C, the function's actual\
    \ body can provide individually.\n\nIn Objective-C, a method declaration consists\
    \ of the following elements:\n\nThe method declaration for the above-described\
    \ function `max()` is as follows:\n\nMethod declaration is required when declaring\
    \ a method in one source file and invoking it in another. In this case, the function\
    \ should define at the beginning of the file that calls it.\n\n## CALLING A METHOD\n\
    \nWhen writing an Objective-C method, we specify what the function must do. We\
    \ must call that function and accomplish the stated task using a method.\n\nWhen\
    \ a program calls a function, control is given to the called method. Program control\
    \ is returned to the main program when a called method's return statement or function-ending\
    \ closing brace is reached.\n\nTo invoke a method, supply the necessary arguments\
    \ along with the method name; if the method returns a result, we may store it.\
    \ As an illustration:\n\n## FUNCTION ARGUMENTS\n\nIf a function receives arguments,\
    \ it must specify variables in Objective-C that accept the values of the parameters.\
    \ These variables are referred to as the function's formal parameters in Objective-C.\n\
    \nThe formal parameters work the same way as other local variables within the\
    \ function, being formed upon entry and erased upon exit.\n\nWhen calling a function,\
    \ there are two ways to give parameters to it.\n\n| Sr. No. | Call Type and Description\
    \ |\n| --- | --- |\n| 1 | **Call by value** This method converts an argument's\
    \ true value into the function's formal parameter. In this scenario, changes to\
    \ the parameter within the function do not affect the argument. |\n| 2 | **Call\
    \ by reference** This method puts the address of an argument into the formal parameter.\
    \ Within the function, the address is used to retrieve the actual argument used\
    \ in the call. This indicates that changes to the parameter affect the argument.\
    \ |\n\nBy default, Objective-C uses call-by-value to pass arguments. This generally\
    \ means that code within a function cannot modify the arguments used to call the\
    \ function, and the last example uses the `max()` method similarly.\n\nIn this\
    \ chapter, we covered functions with relevant examples.\n\n# Appraisal\n\nDOI:\
    \ [10.1201/9781003358534-11](https://doi.org/10.1201/9781003358534-11)\n\nA general-purpose,\
    \ object-oriented computer language called Objective-C enhances the C language\
    \ with Smalltalk-style messaging.\n\nBefore the debut of Swift, Cocoa and Cocoa\
    \ Touch were Apple’s primary programming languages for the OS X and iOS operating\
    \ systems and their corresponding interfaces for application development (APIs).\
    \ Early in the 1980s, the program code Objective-C was created. The programming\
    \ language Objective-C was invented in the early 1980s. It was selected as the\
    \ core programming language for NeXT’s NeXTSTEP operating system, the ancestor\
    \ of both OS X and iOS.\n\nPortable Objective-C programs that do not require the\
    \ Cocoa or Cocoa Touch libraries, or employ components that can be ported or re-implemented\
    \ for other platforms, may be created for any system that supports GNU Compiler\
    \ Collection (GCC) or Clang.3\n\nTypically, Objective-C “implementation” software\
    \ files have `.m` filename extensions, but Objective-C “header/interface” files\
    \ have `.h` filename extensions, the same as C header files. The file extension\
    \ for papers written in Objective-C++ is `.mm`. In the early 1980s, Objective-C\
    \ was created primarily by Brad Cox and Tom Love at their company Stepstone.\n\
    \nAlthough he was careful to stress that the problem of reusability includes more\
    \ than just the language, Objective-C was often compared to other languages in\
    \ terms of the features. The year 1988 must have seen the licensing of the language\
    \ and the development of NeXTSTEP code library.\n\nAfter acquiring NeXT in 196,\
    \ Apple Computer employed OpenStep in its new operating system, Mac OS X. This\
    \ comprises Objective-C, NeXT’s Objective-C-based developer tool Project Builder,\
    \ and its interface design tool Interface Builder (both now merged into Xcode\
    \ application).\n\nOpenStep interface objects comprise the bulk of Apple’s current\
    \ Cocoa API, and it is the most significant Objective-C development environment\
    \ in use today. Swift, introduced by Apple at the 2014 WWDC, was billed as “Objective-C\
    \ without the C.” The history of the programming language Objective-C is extensive.\
    \ Objective-C was voted the winner of the TIOBE Programming Language Award for\
    \ 2011 in January 2012\\. Despite languishing as a niche language for most of\
    \ that period, the advent of the iPhone has catapulted its popularity. This award\
    \ is presented to the language with the largest use increase over the last year;\
    \ Objective-C rose from eighth to fifth place on the index in 2011\\. Objective-C\
    \ may be traced back to International Telephone and Telegraph (ITT) division,\
    \ where Tom Love and Brad Cox attempted to boost programmer efficiency. Alan Kay\
    \ and his colleagues at Xerox PARC introduced Smalltalk, a revolutionary new programming\
    \ language, in a special issue of Byte magazine in 1981.\n\nKay coined the word\
    \ “object-oriented” to describe Smalltalk’s modern approach to program design.\
    \ Smalltalk envisioned programs as collections of objects that exchanged messages,\
    \ thereby calling “methods” (perform actions). The invoked methods were selected\
    \ “dynamically,” that is, during program execution. A Smalltalk application is\
    \ capable of real-time self-editing in response to user input.\n"
