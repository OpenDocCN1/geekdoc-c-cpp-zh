    To use Xamarin while keeping current Objective-C assets, the latter may be accessible
    to C# through bindings. This Xamarin technique exposes Objective-C code to the
    managed `C#` world.


    Code may also be converted to `C#` line by line if required.


    To properly use existing Objective-C code with `Xamarin.iOS`, regardless of the
    technique, whether binding or porting, some understanding of both Objective-C
    and `C#` is required.


    ## INTEROP OBJECTIVE-C


    There is currently no approved technique for creating a `C#` library that can
    be called from Objective-C using `Xamarin.iOS`.


    The primary reason for this is that the `Mono` runtime is also needed in addition
    to the binding. Most of our logic, including user interfaces, may still be written
    in Objective-C. Encapsulate the Objective-C code in a library and establish a
    binding to it.


    `Xamarin.iOS`''s is required to start the app (meaning it must create the `Main`
    entry point). Any other functionality may then be written in Objective-C and provided
    to `C#` through the binding (via `P/Invoke`). In this manner, we can build platform-agnostic
    sections in `C#` while keeping the platform-specific logic in Objective-C. This
    section compares and contrasts some significant similarities and differences between
    the two languages to serve as a primer for transitioning to `C#` using `Xamarin.iOS`,
    whether binding to existing Objective-C code or converting it to `C#`.


    ## COMPARISON OF LANGUAGES


    Both syntactically and in terms of runtime, Objective-C and `C#` are pretty distinct
    languages. `C#` is statically typed, while Objective-C is dynamic and employs
    a message-passing system.


    Objective-C is similar to `Smalltalk` in terms of syntax; while `C#` borrows most
    of its basic grammar from `Java`, it has grown to incorporate many features beyond
    `Java` in recent years. However, numerous language features are functionally equivalent
    in both Objective-C and `C#`. Understanding these commonalities is essential when
    establishing a binding to Objective-C code from `C#` or when converting Objective-C
    to `C#`.


    ## INTERFACES VS. PROTOCOLS


    Single inheritance languages are both Objective-C and `C#`. On the other hand,
    both languages allow us to implement numerous interfaces in a single class. These
    logical interfaces are referred to as protocols in Objective-C and interfaces
    in `C#`. The critical difference between a `C#` interface and an Objective-C protocol
    in terms of implementation is that the latter might have optional methods.


    ## EXTENSION METHODS VS. CATEGORIES


    Using Categories, Objective-C enables us to add methods to a class for which we
    may not have the implementation code.


    Extension methods, analogous to extension methods in `C#`, provide a similar notion.
    Static methods in `C#` are equivalent to class methods in Objective-C, and extension
    methods allow us to add them to a class.


    ## ASSEMBLIES VS. FRAMEWORKS


    Frameworks are specific folders in which Objective-C organizes similar classes.
    Assemblies, on the other hand, are used in `C#` and `.NET` to offer reusable chunks
    of precompiled code. Assembly files in systems other than iOS include intermediate
    language code (`IL`) compiled just in time (`JIT`) during runtime.


    On the other hand, Apple does not enable `JIT`-compiled code to be executed in
    App Store-released iOS apps. As a result, Xamarin compiles `C#` code for iOS ahead
    of time (`AOT`), resulting in a single Unix executable and metadata files included
    in the application bundle.


    ## NAMED PARAMETERS VS. SELECTORS


    By their very nature, Objective-C methods incorporate parameter names in selectors.
    When used in code, a selection like `AddCrayon:WithColor:` makes it apparent what
    each argument implies.


    ## NAMESPACES AND HEADERS


    Objective-C, as a superset of `C`, employs headers for public declarations distinct
    from the implementation file. `C#` does not make use of header files. `C#` code,
    unlike Objective-C code, is enclosed in namespaces. If we wish to incorporate
    code from another namespace, add a `using` directive to the start of the implementation
    file, or qualify the type with the whole namespace.


    ## PROPERTIES


    The idea of properties is used in both Objective-C and `C#` to offer a high-level
    abstraction around accessor methods. The `@property` compiler directive is used
    in Objective-C to build accessor methods effectively. `C#`, on the other hand,
    comes with built-in support for properties.


    ## STATIC KEYWORD


    The `static` keyword in Objective-C and `C#` have pretty different meanings.


    Static functions are used in Objective-C to restrict the scope of a function to
    the current file. The `public`, `private`, and `internal` keywords in `C#`, on
    the other hand, keep the scope under check. When we use the `static` keyword on
    a variable in Objective-C, it keeps its value across function calls. A `static`
    keyword is also available in `C#`.


    When applied to a method, it performs the same function as the `+` modifier in
    Objective-C. It does this by creating a class method. When applied to other constructs
    like fields, properties, and events, it makes them part of the type they’re defined
    in, rather than any instance of that type. We may also create a `static` class,
    which requires all of the class’s methods to be static.


    ## LIST VS NSARRAY INITIALIZATION


    The addition of literal syntax for usage with `NSArray` in Objective-C makes it
    easier to initialize. `C#`, on the other hand, `C#` has a richer type called a
    `List` that is generic, meaning that the type the list carries may be specified
    by the code that constructs the list (similar to templates in `C++`).


    ## LAMBDA EXPRESSIONS VS BLOCKS


    Objective-C employs blocks to generate closures, allowing us to create an inline
    function that may use the contained state. `C#` uses lambda expressions to implement
    a similar approach.


    This chapter covered the Objective-C overview with the framework, advantages,
    disadvantages, compiler, and differentiation from other languages.


