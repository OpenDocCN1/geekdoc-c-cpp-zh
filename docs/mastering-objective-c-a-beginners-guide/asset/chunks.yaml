    in a list of data. We may accomplish this with the break statement. When the break
    statement is executed, the program exits the current loop, whether for, while,
    or do loop. Subsequent statements in the loop are skipped, and the loop’s execution
    is ended. The statement that comes after the loop is executed.


    Only the innermost loop in which break is executed is ended when a break is done
    from inside a series of nested loops.


    The break statement is just the keyword break followed by a semicolon, as shown
    below:


    ## continue Statement


    The continue statement is similar to break statement because it does not terminate
    the loop. Any statements that follow after the continue statement up to the conclusion
    of the loop are skipped when the continue statement is performed. Otherwise, the
    loop’s execution continues as usual.


    The continue statement is most commonly used to skip a number of statements within
    a loop based on some condition but then to continue running the loop otherwise.
    The continue statement is written in the following format:


    Use the break and continue statements only when you’ve mastered the art of constructing
    program loops and elegantly leaving them. These assertions are far too simple
    to misuse, resulting in difficult-to-follow plans.


