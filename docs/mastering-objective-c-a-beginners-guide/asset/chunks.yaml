    `NSLog` 语句的主要修改是增加了字段宽度设置。字符 `% 2i` 告诉 `NSLog` 过程你想要显示在该特定时刻的整数值，并且要显示的整数大小至少占据显示中的两列。任何通常占用少于两列的整数（即数字
    0–9）前面都会有一个空格。这被称为对齐（proper justification）。


    因此，通过指定 `% 2i` 的字段宽度，我们确保了至少使用两列来表示 `n` 的值；我们还确保了 `triangularNumber` 的值是对齐的。


    ## 键盘输入


    程序只计算第 200 个三角形数。如果我们想计算第 50 个或第 100 个三角形数呢？如果是那样，我们需要修改程序以确保 `for` 循环执行了正确的次数。我们还需要更改
    `NSLog` 语句以显示正确的消息。


    一种简单的方法是询问应用程序我们想要计算哪个三角形数。当我们提供响应时，程序可能会计算相应的三角形数。可以使用 `scanf` 过程来实现这种解决方案。`scanf`
    例在概念上与 `NSLog` 例相同相同。与显示信息的 `NSLog` 函数不同，`scanf` 例允许程序员向程序输入值。当然，如果我们正在构建具有图形界面
    (UI) 的 Objective-C 程序（例如 Cocoa 或 iOS 应用），我们将完全不会使用 `NSLog` 或 `scanf`。


    程序询问用户应该计算哪个三角形数，然后计算并显示结果。


    ## 嵌套 for 循环


    应用程序允许用户让程序计算任何请求的三角形数。但如果给了给了一个五个三角形数的列表呢？在这个例子中，用户可能简单地运行应用程序五次，每次输入列表中的下一个三角形数。另一种实现相同目标且学习
    Objective-C 时更具技巧的方法是让程序来处理这种情况。最好的方法是在程序中放入一个循环，使整组计算重复五次。为了创建这样的循环，我们可以利用 `for`
    语句。这种方法通过一个程序及其相应的输出进行了演示。


