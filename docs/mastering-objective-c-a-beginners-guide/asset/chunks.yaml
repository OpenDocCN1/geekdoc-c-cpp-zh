    7. 选择工具栏中 `View` 下方的中心图标。调试区域现在将可见。我们可以在那里查看你的输出。

    8. 点击工具栏中的 `Launch` 按钮或从 Product 菜单中选择 `Run` 来构建并运行我们的应用程序。


