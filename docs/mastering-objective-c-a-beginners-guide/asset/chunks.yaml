    2. 接着测试循环条件。如果条件不满足（表达式为假），循环将立即终止。执行紧随在循环之后的软件语句。


    3. 执行构成循环体的程序语句。


    4. 在第四步中评估循环表达式。该表达式通常用于调整索引变量的值，通常通过加 1 或减 1 来。


    5. 回到第 2 步。


    记住，循环条件是在循环体执行之前进入循环时立即评估的。记住不要在循环的右括号后使用分号，因为会导致循环立即终止。由于上述程序在通往终点的过程中创建了所有 300
    个三角形数，因此生成这些数字的数据库可能是很有用的。为了节省空间，假设我们只想打印一个包含前十个三角形数的表格。此任务由下面列出的程序完成。


