    # DATA TYPES


    Data types are a comprehensive structure used in the Objective-C programming language
    to declare numerous variables and functions. The type of a variable determines
    how much storage space it requires and how the bit pattern stored is interpreted.


    The following are the Objective-C types:


    | Sr. No. | Types and Description |

    | --- | --- |

    | 1 | Basic typesThey are classified into two groups of arithmetic types: (x)
    integer types and (y) floating-point types. |

    | 2 | Enumerated typesThey are, once more, arithmetic types, and they are used
    to create variables that can only be assigned discrete integer values throughout
    the program. |

    | 3 | The type `void`The type `void` indicates that no value is accessible. |

    | 4 | Derived typesPointer kinds, Array types, Structure types, Union types, and
    Function types are among them. |


    The aggregate types combine the array and structure types. The type of a function
    shows the kind of the function’s return value.


    # TYPES OF INTEGERS


    The table below offers information about standard integer types, such as storage
    sizes and value ranges.


    | Type | Storage Size | Value Range |

    | --- | --- | --- |

    | char | 1 byte | −128 to 127 or 0 to 255 |

    | unsigned char | 1 byte | 0 to 255 |

    | signed char | 1 byte | −128 to 127 |

    | int | 2 or 4 bytes | −32,768 to 32,767 or −2,147,483,648 to 2,147,483,647 |

    | unsigned int | 2 or 4 bytes | 0 to 65,535 or 0 to 4,294,967,295 |

    | short | 2 bytes | −32,768 to 32,767 |

    | unsigned short | 2 bytes | 0 to 65,535 |

    | long | 4 bytes | −2,147,483,648 to 2,147,483,647 |

    | unsigned long | 4 bytes | 0 to 4,294,967,295 |


    On a certain platform, the `sizeof` operator can identify the precise size of
    a type or variable. `sizeof(type)` returns the storage size of an object or type
    in the bytes. The example below shows how to determine the size of an `int` type
    on any machine.


    # TYPES OF FLOATING-POINT


    The below table lists the details of common float-point types, such as storage
    capacities, value ranges, and precision.


    | Type | Storage Size | Value Range | Precision |

    | --- | --- | --- | --- |

    | float | 4 byte | 1.2E−38 to 3.4E+38 | 6 decimal-places |

    | double | 8 byte | 2.3E−308 to 1.7E+308 | 15 decimal-places |

    | long double | 10 byte | 3.4E−4932 to 1.1E+4932 | 19 decimal-places |


    The `float.h` header file contains macros that allow us to use these values and
    other binary representations of real numbers information in our programs. The
    following example will return the amount of storage space utilized by a `float`
    type and its range values.


    # VOID TYPE


    The `void` type signifies that no value is available. It has three separate meanings.


    | Sr. No. | Types and Description |

    | --- | --- |

    | 1 | Function returns as voidSeveral Objective-C functions return a `void` or
    do not return a value. The return type of a function that has no return value
    is `void`. Take the `void exit` as an illustration `(int status)`. |

    | 2 | Function arguments as voidSome Objective-C functions take no arguments.
    A function that has no parameters can take a `void`. For example `int rand(void)`.
    |


    # VARIABLES IN OBJECTIVE-C


    Variable is the name given to a storage place that our programs may use. Each
    variable in Objective-C has a type that governs its memory size and organization,
    the range of values it may hold, and the set of operations that can be performed
    on it.


    The name of a variable can consist of characters, numbers, and the underscore
    character. Begin with a letter or underscore. Upper and lowercase letters differ
    because Objective-C is case-sensitive.


    | Sr. No. | Type and Description |

    | --- | --- |

    | 1 | charA single octet is single (one byte). It is an integer type. |

    | 2 | intThe most natural integer size for the machine. |

    | 3 | floatA single precision floating-point value. |

    | 4 | doubleA double precision floating-point value. |

    | 5 | voidRepresents the lack of type. |


    The Objective-C programming language also provides many types of variables, which
    we will go over in detail in the following chapters, such as Enumeration, Pointer,
    Array, Structure, Union, and so on. In this part, we will look at fundamental
    variable kinds.


    # VARIABLE DEFINITION


    A variable definition in Objective-C instructs the compiler where and how much
    storage to produce for the variable. As seen below, a variable description explains
    a data type and provides a list of one or more variables.


    A type must be a valid Objective-C data type in this example, such as `char`,
    `wchar`, `int`, `float`, `double`, `bool`, or `void`.


    # VARIABLE DECLATION


    The `extern` keyword will use to specify a variable at any position.


    **Example:** Consider the following:

    ```c

    int e, f;

    int g = 10;

    ```


    # LVALUES AND RVALUES


    There are two types of expressions in Objective-C.


    - **lvalue**: `lvalue` expressions are those that relate to a memory location.
    An assignment can have an `lvalue` on either the left or right side.

    - **rvalue**: An `rvalue` is a data value stored in memory at a specific address.
    Because an `rvalue` is an expression that cannot assign a value, it can appear
    on the right but not the left side of an assignment.


    Variables are `lvalues` and can thus appear on the assignment’ left side. Numerical
    literals cannot be allocated and cannot appear on the left side since they are
    `rvalues`. This is an accurate statement


    # CONSTANTS IN OBJECTIVE-C


    Constants are values that the program cannot change during execution. These values
    are also referred to as literals.


    Integer constants, floating constants, character constants, and string literals
    are all examples of fundamental data types. There are also enumeration constants.


    Constants are handled the same as regular variables, except that their values
    are not changed after they are defined.


    # INTEGER LITERALS


    A decimal, octal, or hexadecimal constant can be used as an integer literal. A
    prefix indicates the base or radix: `0x` or `0X` for hexadecimal, `0` for octal,
    and nothing for decimal.


    A literal number can also have a suffix of `U` or `L`, which stands for unsigned
    or long, respectively. Write the suffix in any order, using uppercase or lowercase
    letters.

