    We can get the rightmost digit from an integer number by taking the remaining
    after dividing it by `10`. For instance, `3456% 10` yields the value `4`, which
    is the rightmost digit of `3456` and the first digit of the reversed number. (Recall
    that the modulus operator returns the remainder of dividing one integer by another.)
    Using the same approach, we can acquire the next digit of the number if we first
    divide the number by `10`, keeping in mind how integer division works. Thus, `3456/10`
    is `345`, and `345% 10` equals `5`, the following digit of the inverted number.


    We can continue this technique until we get to the last digit. When the result
    of last integer division by `10` is `0`, we know that the number’s last digit
    has been retrieved.


    The program invites the user to input a number and then displays the digits from
    that number from right to left.


    # THE do Statement


    Both of the looping constructions examined thus far in this section test the criteria
    before executing the loop. As a result, if the requirements are not met, the loop
    body may never be performed. When designing programs, it is sometimes preferable
    to have the test run toward the conclusion of the loop rather than at the beginning.
    Naturally, the Objective-C language has a unique language construct called the
    `do` statement to handle such a situation. This statement’s syntax is as follows:


    The `do` statement is run in the following order: the program statement comes
    first. The expression within the parenthesis is then evaluated. If the result
    of evaluating the expression is true, the loop is continued and the program statement
    is run once more. The program statement is repeated as long as the expression
    evaluation remains true. When the expression is evaluated as false, the loop is
    ended, and the following statement in the program is executed normally.


    The `do` statement is just a transposition of the `while` statement, with the
    looping conditions placed at the end rather than beginning of the loop.


    To reverse digits of a number, the program employed a `while` statement. Return
    to that software and try to figure out what would happen if the user had put in
    `0` instead of `45678`. The `while` statement’s loop would never have been run,
    and no output would have been displayed. If we used a `do` statement instead of
    a `while` statement, you would ensure that the program loop was completed at least
    once, ensuring that at least one digit was displayed in all circumstances.


    # do-while Loop


    In contrast to `for` and `while` loops, which test the loop condition at the top
    of the loop, the `do-while` loop in Objective-C examines its condition at the
    bottom of the loop.


    A `do-while` loop is identical to a `while` loop, but it is guaranteed to run
    at least once.


    Because the conditional expression comes at the conclusion of the loop, the loop’s
    statements are only executed once before the condition is tested. If the condition
    is true, the flow of control returns to `do`, and the statement in the loop is
    executed once again. This step is repeated until the specified condition is no
    longer true.


    # THE break Statement


    When running a loop, we may wish to exit the loop as soon as a specific condition
    happens, such as detecting an error condition or finding the data we’re seeking
    in a list of data. We may accomplish this with the `break` statement. When the
    `break` statement is executed, the program exits the current loop, whether `for`,
    `while`, or `do`.


