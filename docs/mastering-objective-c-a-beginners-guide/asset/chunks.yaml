    ## THE switch Statement


    The sort of `if-else` statement chain you saw in the last program example, with
    the value of a variable being sequentially compared against multiple values, is
    so prevalent in programming that an Objective-C program statement exists to accomplish
    exactly this purpose. The statement is known as a `switch` statement, and its
    typical format is as follows:


    The expression enclosed in parentheses is compared to the values `value1`, `value2`,
    . . . , `value n`, which must be simple constants or constant expressions. If
    a case with a value equal to the value of the expression is identified, the program
    statements that follow the `case` are performed. It should note that when more
    than one of these program statements is included, they do not need to be enclosed
    between braces.


    The `break` statement signifies a certain case’s conclusion and terminates the
    `switch` statement’s execution. Always add a `break` statement after each instance.
    If this is not done for a certain instance, program execution will proceed into
    the following `case` whenever that case is run. This is often done on purpose;
    if we want to do so, make sure to include remarks to warn others of our goal.


    If value of the expression does not match any of the `case` values, the special
    optional case named `default` is executed. This is basically analogous to the
    last example’s catchall otherwise. In reality, the `switch` statement’s general
    form may be stated as `if` statement, as follows:


    Following the reading of the expression, the value of the `operator` is sequentially
    compared to the values supplied by each `case`. The statements provided within
    the `case` are performed when a match is discovered. The `break` statement then
    exits the `switch` statement, where the program’s execution is completed. If none
    of the `cases` matches the value of the `operator`, the `default` case is run,
    which shows “Unknown operator.”


    In the preceding program, the `break` statement in `default` case is actually
    unneeded because no statements follow this case inside the `switch`. Nonetheless,
    remembering to add the `break` at the conclusion of each instance is a good programming
    practice.


    Remember that no two `case` values can be the same when writing a `switch` statement.
    We can, however, correlate more than one `case` value with a certain sequence
    of program instructions. This is accomplished simply by stating the various `case`
    values before the common statements are performed. In the following `switch` statement,
    for example, the `multiply:` method is run if the `operator` equals an asterisk
    or the lowercase letter `x:`


    ## BOOLEAN VARIABLES


    Almost everybody learning to program will eventually be required to develop a
    program that generates a table of prime numbers. To refresh our recall, a prime
    number is one that is not evenly divided by any other numbers other than 1 and
    itself. The first prime integer is 2 by definition. The following prime is 3 since
    it is not equally divisible by any integer other than 1 and 3, while 4 is not
    prime because it is evenly divisible by 2.


    We might use numerous techniques to construct a table of prime numbers. If we
    were asked to create all prime numbers up to 55, the most obvious (and simplest)
    technique would simply test each integer, `p`, for the divisibility by all integers
    from 2 to `p-1`. If any such integer evenly divides `p`, then `p` is not a prime
    number; otherwise, it is.


    Program creates a list of prime numbers ranging from 2 to 55.


    Several points should make concerning the program. The outermost `for` statement
    creates a loop that iterates over the numbers 2–55. The loop variable `p` indicates
    the value presently being tested to check if it is prime. The variable `isPrime`
    is given the value 1 in the loop’s first line. The use of this variable will soon
    be made obvious.


    The digits 2 to `p-1` are divided by `p` using a second loop. A test is performed
    inside the loop to determine if the result of `p` divided by `d` is 0. If it is,
    then `p` cannot be a prime number since it may be divided equally by any integer
    other than 1. The variable `isPrime` is set to zero to indicate that `p` is no
    longer a prime number option.


    When the innermost loop completes, the value of `isPrime` is checked. If its value
    is unequal to zero, no integer that evenly divides `p` was discovered; hence,
    `p` must be a prime number, and its value is printed.


    We may have observed that the variable `isPrime` only accepts 0 or 1, with no
    other values. It has the value 1 as long as `p` is still a prime number. However,
    once a single even divisor is discovered, its value is set to 0 to indicate that
    the p no longer meets the conditions for being prime. Variables used in this manner
    are commonly known as Boolean variables. A flag has typically just one of two
    possible values.

