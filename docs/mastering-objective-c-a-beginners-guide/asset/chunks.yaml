    在显示完必要的标题后，应用程序计算了前十个三角形数。变量 `n` 用于计数我们正在计算的当前数字（计算从 1 到 `n` 的总和），变量 `triangularNumber`
    则存储三角形数 `n` 的值。


    `for` 语句通过首先将变量 `n` 的值改为 `1` 来执行。如前所述，程序循环的体是紧随 `for` 语句之后的程序语句。但如果我们想运行一组程序语句而不是单个程序语句呢？这通过将所有此类程序语句封装在括号中来实现。这种语句的集合（或块）随后被系统视为单一实体。通常情况下，只要语句块被封装在一对括号之间，就可以在
    Objective-C 程序中任何允许单个语句的地方使用语句块。


    因此，在 `Program` 中，该表达式将 `n` 的值加到 `triangularNumber` 的值上，随后是紧跟在程序循环体之后的 `NSLog`
    语句。特别注意程序语句的缩进方式。我们可以通过观察语句来判断哪些语句是 `for` 循环的一部分。同样值得注意的是，程序员有不同的编码风格；例如，某些人喜欢像这样写循环：


    在这种情况下，左括号被放在 `for` 之后的一行。这纯粹是一个个人喜好问题，对程序没有影响。


    简单地将 `n` 的值加到上一个三角形数即可得到下一个三角形数。


    因为第一次通过 `for` 循环时上一个三角形数是 0，所以当 `n` 等于 1 时，`triangularNumber` 的新值就是 `n` 的值，即 1。


    然后显示 `n` 和 `triangularNumber` 的值，在格式字符串中放置了足够的空格，以确保两个变量的值在相关的列标题下对齐。


    由于循环体现在已经执行，接下来评估循环表达式。然而，这个 `for` 语句中的表达式看起来很奇怪。我们一定犯了拼写错误，本意是输入 `n = n + 1`
    而不是这个看起来奇怪的表达式：


    然而，`++n` 是一个完全有效的 Objective-C 表达式。增量运算符作为 Objective-C 编程语言中一种新的（且非常有特色的）运算符被引入。双加号符号（通常称为增量运算符）对其操作数加
    1。因为在程序中加 1 是一项非常通用的操作，所以专门为它构建了一个特定的运算符。结果，表达式 `++n` 与 `n = n + 1` 是等价的。初一看，`n
    = n + 1` 似乎更具可读性，但你会很快习惯它的操作，甚至开始喜欢它的简洁。


    当然，任何具有用于加 1 的增量运算符的编程语言，如果不包含一个类似的用于减 1 的运算符，就是不完整的。这种运算符被称为减量运算符，双减号符号代表它。所以，在
    Objective-C 中，读取为


    n = n - 1 的表达式可以使用减量运算符以类似的方式表示，如下：


    一些程序员喜欢在变量名后使用 `++` 或 `--` 符号，例如 `n++` 或 `bean-counter--`。在 `for` 语句示例中，这取决于个人喜好。


    我们可能已经注意到 `Program` 输出的最后一行没有对齐。我们可以通过将 `Program` 中的相关代码替换为以下 `NSLog` 语句来修复这个小困扰：


