    \ PO、社区、其他项目以及解决方案（飞行）的项目负责人（PL）之间的协作。\n\n## 解决方案“飞行”层级\n\n在解决方案（飞行）层级，接口是项目负责人（PL），他代表解决方案团队中的一个或两个团队，在定义的路线图内运行。产品所有者（PO）负责概述、优先排序和批准功能以及整体解决方案。项目经理（PM）与\
    \ Scrum 大师（SM）合作，以促进沟通，就流程对团队成员提供指导，并帮助所有方识别并解决障碍。\n\n## 团队“功能”层级\n\n我们的每个团队都由团队成员组成，他们结对小组负责开发/贡献以及测试/评审的职责。只有当团队完成开发和测试活动并符合“完成定义”（DoD）时，责任才算完成。这并不会鼓励或重新引入瀑布式顺序，因为团队可以进行单元测试，并与开发工作并行处理。\n\
