    ## Copyediting/Reviews


    You can remember the product you bought and how your frustration increased as
    you the incomplete, complex, or illegal user documentation?

    Subject matter experts (SME), content editors, and copeditors must review all
    documentation:


    - SMEs verify that the documentation is actually correct and that its content,
    length, and level of detail are complementary for a successful deployment and
    use of the solution.

    - Content editors support the team with proofreading and fact checking, often
    getting involved with the content development. These editors are already involved
    from start finish.

    - Copeditors are the last line of defense and focus on proofreading, fact checking,
    flow, and readability. When teams deem the content ready for consumption, these
    editors review the material.


    Using word and the power of Team Foundation Version Control (TFVC), we effectively
    manage documentation throughout the flight (project). As shown in Figure 85, most
    of our solutions have a documentation note in TFVC with a predefined set of editors.


    1. **Work in Progress** For content that is under copyediting, whereby we recommend
    using templates to simplify formatting tasks and ensure that the editors leave
    consistent-looking content. Move to the next folder when done to signal a state
    change and notify the team that the documentation is ready for the next step—example,
    review, or copyediting.

    2. **Copyediting** For content that is ready for copyediting. Content developers
    should “sit on their hands” while the copeditor edits it. The use of comments
    and inline change tracking is highly recommended.

    3. **Ready for Review** For content that is ready for SME, community, and content
    review. The use of comments and in-line change tracking is highly recommended,
    whereby reviewers can check in the document with revisions if there are no merge
    conflicts or commit to the content owner for manual merging.

