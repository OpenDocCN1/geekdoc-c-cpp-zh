    # Chapter 2: Getting ready


    Today the typical duration of a project is three to four three-week sprints, with
    a potentially shippable deliverable after every sprint. Although team members
    are still breaking down their work into actionable and detailed tasks, frequent
    anomalies we observe:


    +   - Teams do not use or track tasks, and boards are seldom used.

    - Features marked as Done often contain orphaned tasks that are still in the new
    or in-progress state.

    - Information documented in tasks—for example, objectives and the definition of
    Done (DoD)—is difficult to find.


    Reflection, continuous improvement, a willingness to risk embrace and change and
    new features on Visual Studio Online are instrumental to our dogfooding and productivity.
    This is our tomorrow:


    +   - New projects use informative Kanban board (Figure 53) to eliminate waste
    and visualize all the work.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_69_0.png)


    Figure 53. Using the Kanban board of tomorrow.


    +   - The definition of done (DoD), acceptance criteria, and other relevant information
    driving state is accessible from the board.

    - Split columns visualize our work through our workflow.

    - Personal Kanban boards and sticky notes replace the use of detailed task planning
    and boards.


    # Dogfood case study: Where is the fire?


    Estimating, managing, and tracking requirements with geographically distributed,
    virtual, and part-time teams are parts of a complex adventure. In this case study,
    we explore evidence from a few of the previous teams'' observations that have
    infused solutions.


    # Evidence from the field


    # Scenario 1—Burning down


    Teams trend around the ideal burndown line, giving most observers a sense of comfort.
    What raises concern are the three spikes (see Figure 54), typically caused by
    scope creep or acceptance of new tasks or bugs. This could create a discrepancy
    between planned velocity and actual velocity.'
