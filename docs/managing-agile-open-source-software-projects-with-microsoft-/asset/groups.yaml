    ## 为未来而创新


    对质量和规划的关注是投入带宽进行研究和创新的理想机会。我们通过支持新技术、流程和技术的探索，赋予团队力量，激发个人，并点燃对技术的热情。技术“玩耍时间”、技术车库、“黑客松”、午餐会（brown-bags）以及其他令人兴奋的机制促进了不受限制的创新、学习和信息共享。


    虽然我们应该将整体创新主题与当前及未来的解决方案保持一致，但我们需要注意不要具有限制性或专断，以免无意中扼杀了“乐趣”因素。


    为什么会有人投资或投入自己宝贵的时间自愿在独裁下“工作”呢？


    ## 规划后续


    专注于质量保证（QP）的冲刺的第二个支柱以最后一个冲刺结束，其重点是确定是否需要后续发布，并开始进行规划。


    规划下一次发布将是下一次专注于“培训-研究-规划”的冲刺的一部分。在这个阶段，我们可以重新审视核心目标，并头脑风暴可能增加价值或解决已知业务问题的未来功能。


    与之前的冲刺一样，规划迫使团队“停下手来”（图 90），反思过去的发布，并公开讨论未来。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_108_0.png)


    图 90。如果其他都失败了，就上披萨吧！


    对许多项目的观察表明，许多自愿团队成员在最后一个冲刺期间会失联消失，因为那时每个人都在等待飞机降落和“发布”（ship-it）事件的触发。


    创新和规划都有助于维持团队精神，并确保在下一次冒险黎明前保留其心跳。在所有冲刺期间，让团队保持忙碌都是重要的，但在冲刺结束时尤为关键。


    ## 产品所有签字


    最后的仪式发生在产品所有（Product Owner）对功能进行签字、将功能状态设置为“已完成”（Done），并对解决方案点大拇指时。


    无论是他们、系统团队还是集中式支持团队，解决方案都随组织而异。在我们情况下，“发布”不可避免地触发了以下操作：


    - 将解决方案作为下载包上传到 CodePlex。

    - 解决方案的稳定主分支合并到版本控制中的发布分支。

    - 更新解决方案目录89 以反映解决方案和相关版本。


    ## 第 4 章：提高质量标杆


    - 告示板上显示的飞行计划已刷新，以突出降落。

    - 发布了一条公告。


    ## 公告与热烈发布


    公告的风格取决于组织、团队，通常是个人偏好。跨航班的一致性是一个优势，但并非必须，特别是在社区项目世界中。图 91 显示了一个使用博客通道的公告示例：


    ## 关于 Azure IaaS 上的 TFVC 和 TFS 的实用指南


    Willy S. Schau 2014年5月15日 下午3:21


    Visual Studio ALM Rangers 很高兴地介绍近期发布的新及更新实用指南。

    FS 映射、DR 规避以及 Azure IaaS 上的 TFS v1.B 已发布！


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_109_0.png)


    新指南包含了 Azure 基础设施即服务（SaaS）上 Team Foundation Server (TFS) 的实践方法。我们根据真实的实证概念部署和“一线”经验，引导你完成规划和设置。


    版本控制指南 v3.BETA 已发布

    这本重磅指南的第三版本已如摘要所示被拆分为几个独立的章节，允许你选择你感兴趣的“世界”（指南）。这发布了一个新的交付物，风格更紧凑，更易于在多个设备上阅读，且不牺牲任何内容。内容已根据最新的
    Studio 技术进行了更新，并结合了上一版指南读者的反馈。


    > 指南使用了更“友好”的策略。例如，新的“发布隔离”（Release Isolation）比过去使用的基础-分支（Basic - Branch）方法更有意义。


    图 91。两个 Beta 版本的博客公告。


    一旦我们落地并发布了解决方案，营销、可见度和“热度”就至关重要。伴随着热情的博客、视频和活跃社区成员的解决方案将具有感染力。活跃的社区成员能以更专业、更昂贵的体验销售解决方案。


    使用 Microsoft Visual Studio Online 管理敏捷开源项目


    ## 为什么我们在 CodePlex 而不是 VSO 上发布？


    > 注意：我们流程的这部分将随 Visual Studio Online 一起演进，允许我们在 Visual Studio Online 上管理和发布开源解决方案。


    由于 Studio Online 邀请访客访问以及公开发布解决方案并接受反馈和贡献的能力，我们保留了在 CodePlex 的存在。我们的“梦想”是可以接受社区的反馈和贡献，并通过拉取请求（pull
    request）来请求功能更新。


    ## 案例研究：vsVersionControl 和 vsTreasureMap 发布响响胜利之钟


    总结并落地发布是冒险的最后部分。没有哪个项目的完成方式与它的前一个项目或其他解决方案相同。没有一种完美的配方可以确保按时落地解决方案、超过质量标杆并让 100%
    的客户满意。在这一案例研究中，我们探索了两个项目，它们都实现了壮观且成功的落地，但使用了完全不同的策略。


    ### 背景信息


    我们在案例研究中引入了 ALM Treasure Map 团队。我们欢迎该团队参加质量和规划冲刺。另一个团队没有从书中涵盖的创新中获益，他们专注于质量和规划结束了其生命周期。这些团队是作为本案例研究一部分的真实示例。版本控制（除分支和合并）指南曾被三或四份指南拖慢。


    ### 不同策略，相同目标 . . . “落地”


    图 92 显示的专注于质量和规划的团队及其解决方案说明，没有哪个团队遵循了“最优”计划。两个团队都进行了调整并发布，这引入了一个重要的概念：反思、持续改进以及承担风险和拥抱变化对于我们的成功至关重要！


    ## 第 4 章：提高质量标杆


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_111_0.png)


    图 92。质量和规划策略的不同冲刺。


    这是他们的故事……


    ### 就绪地图


    海盗们分出了两项质量改进活动：一个专注于修复已知 Bug 并测试更新，另一个是用户验收测试。每个团队成员（在此例中为船员）都参与了解决方案，向开发者提供持续反馈，并响应首席测试员
    Darren，他可能为第一个月落地的敏捷模块创建了更多更复杂的用例。创新发生在 Bug 和测试反馈的解决过程中，每个船员都参与其中并被展示。在产品所有签字仪式后，解决方案通过了商店认证流程，并在内部
    TechReady 19 活动中作为 RTM v3 发布，这又是一个“有趣的”演示环节。


    一个明显的异常是缺乏明显的规划，这是特意推迟到 TechReady 19 会话的，让观众参与功能和未来方向的规划。这是一个创新的、透明且具有参与感的概念。ARRGH！


    ### 版本控制指南


    团队还分出了两项并行活动：一个专注于技术审查，另一个专注于文本编辑，以使三份指南在一致性、语气和风格上统一。当技术审查完成后，团队已准备好发布，但质量标杆要求完成文本编辑。由于文本编辑遇到瓶颈，预计完成时间远超专注于质量和规划的冲刺结束时间，团队向产品所有做出决定，允许发布一个
    Beta 版，以避免向社区共享电子书的进一步延迟。每个书已传输


    51 TechReady 是微软内部的一项技术活动，是 Rangers 与现场工程师建立联系的绝佳机会。


