    ## 第 3 章：构建可解决方案


    梳理（grooming），这种规划迫使团队成员“静下来”，反思过去的冲刺，并讨论即将到来的故事和冲刺。


    良好的待办列表（backlog）能够实现透明化、便于估算，并对已经完成和需要采取的操作产生洞察。与一个经过梳理的待办列表合作，比在每次 Scrum 会、计划或回顾会议上筛选浪费的噪音和干扰要高效得多。


    **GEM 准则：保持你的待办列表整洁！**


    请将你的待办列表视为项目的主入口。保持它的整洁和梳理将确保第一印象是良好的，并且访问是协作且高效的。


    ## 梳理未来的开发冲刺


    当我们使用“梳理”的定义时，我们呈现的是以下选项（The Free Dictionary, 2014）：


    - 照顾外表；使其整洁修剪：他在镜子前仔细地梳理。

    - 清洁和刷洗（动物）。

    - 从人的皮肤、皮毛或羽毛上去除污垢和颗粒。

    - 为特定目的或职位做准备：为员工的晋升做准备。


    当产品负责人（PO）、项目负责人（PL）和计划经理（PM）在 Scrum Master 的指导下共同定义并完善路线图、发布目标、待办列表以及拟定的冲刺待办列表时，他们执行第一次梳理。在待办列表上投入时间和精力的想法是创建一个整洁清晰的需求列表，并理解需要按顺序完成哪些工作。此外，梳理消除了由范围之外的需求引入的噪音和混乱，并为任务做好准备。我们通常记录，在专注于培训-研究-计划的冲刺期间，我们无缝应用了梳理待办列表的定义。


    **GEM 准则：自上而下进行**


    确保产品负责人和利益相关者优先考虑所有待办事项。从待办事项的顶部（最重要）到底部（最重要）依次处理。


    在每个开发冲刺期间，从开始到结束，我们监控并梳理想法和冲刺待办列表。待办事项的有效性随着范围蔓延（坏）、需求变化（现实）和功能的实现（好）而改变。


    “响应变化高于遵循计划”（敏捷宣言，2001）强调了需求随时间变化的现实。在我们实现即时解决方案开发之前，我们必须面对持续变化的现实，这需要持续的梳理。


    ## 目标/愿景


    如果产品负责人决定更改发布目标、验收标准、完成定义（definition of done）或目标将会怎样？


    记住，这些是团队的支柱——需求的定义，更重要的是成功的定义。这些支柱中的任何一个发生变化都需要团队进行反思和响应。


    ## 第 3 章：构建可解决方案


    > **警告：分布式和兼职团队的响应能力较不理想**


    - 团队跨越的时区越多，团队成员接收、反应和响应变更通知所需的时间就越长。

    - 安排短期和紧急会议具有挑战性，特别是当与兼职志愿者合作时。


    **记住：家庭 > 现实工作 > 兼职副业**


    产品负责人是解决方案和“交付”业务价值的[法官·德瑞德]（Judge Dredd）。对于团队来说，对变化做出反应，并与利益相关者协商如何最大化业务价值并最小化产品浪费是至关重要的。


    具体的重构取决于变化的性质。团队不应该抵制重新估算、排序甚至撤销已完成工作的可能性。最终目标是尽快恢复，最小化浪费，并针对变化使解决方案价值最大化。


    **GEM 准则：短冲刺 == 少浪费**


    冲刺越短，如果你需要响应变化，在迭代过程中产生的浪费就越少。


