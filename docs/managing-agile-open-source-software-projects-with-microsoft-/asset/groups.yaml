    ## Building the working solutions


    ## Gems


    ### Heartbeat

    The heartbeat and pulse of an Agile team is an iterative and consistent cadence.


    **Pull and push** Adopt a policy and design the user stories by team members by
    default, but be ready to prepare and push stories to team members who hesitate
    to grab stories from the backlog.


    **Sprint objectives** Rule the deliverable, the features from the team. These
    reinforce why we are doing the project, what needs to be done, who will be responsible
    for it, and how confident the team is about succeeding.


    **Repetition** Adopt a sprint pattern that is natural to the team and repeat,
    repeat, repeat. For example:


    - Assume ownership of the sprint challenge as a team—example, return to moon Europa.

    - Review and refine the objectives, the requirements, and the features from the
    sprint backlog—for example, transfer W-Astr X Y of samples, and return to Terra
    within Z years. Verify that we understand the requirements, and are in a position
    to meet the acceptance criteria, and are in a position to proceed with none or
    manageable unknowns.

    - Plan and design the sprint development journey.

    - Develop the features to realize the requirements.

    - Integrate, test, and validate the features.

    - Reflect on the sprint, identify improvements, and plan the next actions.

    - Demo and show working solution;


    **Scrums** These meetings project the project goal and transparency. Schedule
    a short, effective meeting as possible.


    | GEMS | **Weekly heartbeat “rocks”** |

    | --- | --- |

    | With geographically distributed, part-time, and virtual teams, a weekly scrum,
    which adheres to a 15 [+15] minute time box, is recommended. | |

    | **Regular heartbeat “rocks”** | |

    | With geographically distributed, part-time, and virtual teams, we recommend
    a once-per-sprint scrum of scrums that adheres to a 2-3 minute per team box |
    |


    **Demos** These are an opportunity for the team, leadership, and stakeholders
    to synchronize.


    | GEM | **2-3 minute demo video “rocks”** |

    | --- | --- |

    | The testers/reviewers are in a prime position to record their validation tests
    and produce a video used as a demo and visual communication. Keep your video to
    2 minutes (optimal) to 3 minutes (maximum) for the greatest impact. | |


    **Retrospective** Use the retrospective to gather subjective and quantitative
    evidence that can be used to improve the sprint process.


    | GEM | **Agree on one innovation** |

    | --- | --- |

    | Every team should agree on one innovation that will improve its experience and
    productivity on the team. | |


    **Planning** Planning the next sprint is part of completing the current sprint!


    | GEM | **Keep your backlog groomed and clean!** |


    ## Appendix A: Supporting toolbox


    Consider your backlog as the main entrance of your project. Keeping it clean and
    groomed will ensure that first impressions are positive and visits collaborative
    and productive.


    **Grooming** Produce a trim and clean backlog of requirements and better understand
    what needs to be done, in order, and by when.


    **GEM** Groom top down

    Ensure that the Product Owner and stakeholders prioritize all backlog items. Work
    through the backlog from the top (most important) to the bottom (least important)
    in the list of backlog items.


    ## Raising the quality bar


    ## Gems and planning


    **Quality and planning** We end projects with a focus on raising the quality bar
    and planning the future.


    **GEM** Automation "rocks"

    While different there is a place for manual testing, test automation allows teams
    to run more tests, more often and continuously. Carefully evaluate and select
    the test that suits your team and investigate When to Test Manually and When to
    Automate.¹100


    **Review process** We have a well-defined review process to ensure that we can
    gather feedback and track its integration through development. Make sure the team
    is aware of the process to ensure that quality is maintained from the start.


    **Maturity milestones** Shipping early to targeted audiences drive early feedback.


    | Milestone | Description | State of the nation |

    | --- | --- | --- |

    | Raw | Refers to all activities performed during research and prototyping, typically
    performed during the sprint(s) focused on training-planning. | Unknown |

    | Prealpha | Refers to all activities performed during the development sprints
    delivering features, but not including testing and reviews. | Unknown |

    | Alpha | The first phase in which to begin and establishing testing and reviews,
    with the knowledge that we are working with a feature incomplete unstable solution.
    The team may decide to release an internal-only/private alpha to obtain early
    feedback from the "restricted" community. | Unstable, feature, incomplete, and
    likely to crash. |

    | Beta "silent" | This is the phase when a solution is complete but with impediments
    and bugs. While working on stabilization, and quality improvements, the team may
    decide to release an internal-only/private beta to expose the solution to a selected
    audience and get real-world feedback. | Stable, feature, complete, and unlikely
    to crash. |

    | Beta “public” | The Product Owner (PO) signs-off on the quality bar, acknowledging
    that the solution is entering beta territory. The intent of a public beta is to
    release the solution as it is landed or shipped. | Minimum quality met. |


    > ¹⁰⁰ http://blogs.msdn.com/b/stever/2008/02/26/when-to-test-manually-and-to-automate.aspx


    | Milestone | Description | State of the nation |

    | --- | --- | --- |

    | RTM | The release to manufacturing (RTM) or "golden CD" milestones is the milestone
    when the team has completed all activities, improved quality as much as possible,
    and resolved all bugs assigned to the release. As with the public beta, the solution
    is shown as landed or shipped. | Minimum quality bar met or exceeded. |


    ## Eating your dogfood is key


    ## Gems and checklists


    **Visual Studio Online** We run our business using Visual Studio Online. It is
    improving every weeks and is truly our technical foundation.


    **Reduce complexity to one** We try and keep things simple in our world, and that
    can often produce much better than a more complex solution:


    - We use one project

    - We use one team

    - We align all to one shared sprint

    - We follow one process, Scrum


    **Collaboration** We promote frequent collaboration to break down barriers and
    friction. To be effective we know our team. Do not underestimate the effect of
    seeing each other; use those cameras in the virtual meetings.


    **Process** Our Software Framework focus the basis of our practices and is highly
    comparable to the Agile Manifesto and Lean principles.


    | MSF | Agile Manifesto | Lean principles |

    | --- | --- | --- |

    | Principles | Mindsets | Values |

    | Foster open communication | Familiarize team members to how they should approach
    solution delivery | Individuals and interactions over processes and tools | Eliminate
    waste |

    | Work toward a shared vision | Foster a team of peers | Working software over
    comprehensive documentation | Build quality in |

    | Empower team members | Focus on business | Establish accountability and shared
    responsibility | Customer collaboration over negotiation | Respect people |

    | Focus on delivering business value | Take in workmanship | Responding to change
    over following a plan | Optimize the whole |

    | Stay agile, except change | Learn continuously | |

    | Invest in quality | Practice good citizenship | |

    | Learn from all experiences | Deliver on our commitments | Internalize qualities
    of service |


