    tone, and style. When the technical review was complete, the team was ready to
    ship, but the quality bar required the copyediting to be completed.


    With the copyediting bottlenecked and estimated completion dates far exceeding
    the end of the sprint focused on quality and planning, the team made a call to
    the Product Owner to sign off and give permission to ship a bottle beta to avoid
    further delays in sharing the e-book with the community. Each-book was transferred


