    ## 核心收获\n\n- 透明度和沟通确保我们都在相同的道路上，这有助于保持团队的动力和力量。\n- 最好的想法包含了最高的业务价值，并且以最快的速度和最小的风险交付，符合使命宣言。\n\
    - 一个活跃、热情且丰富的：\n  - 产品负责人确保我们保持关注并与所有利益相关者保持一致。\n  - 项目负责人激励团队并保持航向正确。\n  - Scrum\
    \ Master 导师指导团队，鼓励持续的敏捷实践。\n- 价值会随着时间的推移而减少。\n- 核心步骤如图 30 所示，并列如下：\n\n![](img/eb2bb5eedd7e9f0a74372984f6317b95_43_0.png)\n\
