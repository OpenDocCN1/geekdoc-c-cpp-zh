    # 前言


    ALM Rangers 是一个由于多个原因而特殊的群体。他们不仅具有创新精神并关注现实世界，为 Visual Studio 开发者社区提供增值解决方案，而且生活和工作在全球四个角落。ALM
    Rangers 是一个志愿者组织。谈谈这种奉献吧！当我们获得为这本书撰写前言的机会时，我们知道自己将参与一项非凡的事业。


    ALM Rangers 并不自诩他们发现了唯一的真理。这些是那些一线实践者所提供的生产优秀软件的实用方法和示例——最重要的是——他们仍在不断创新和编码。读者们会发现，他们有一群虚拟同事，这些同事会诚实且幽默地分享经验，揭示了学习心得以及
    Visual Studio Online 中哪些做法是有效的。这并不意味着这本书缺乏指导性建议。Rangers 将 Visual Studio Online
    视为他们自己的，并在 GitHub 上以开源软件的形式发布，以学习成功的 OSS 项目是如何运行的以及社区最看重什么。他们创建了一个生态系统，识别出“触手易得的果实”并从想法到解决方案对其进行追踪，并且从不忽视那些投入个人时间和热情投入其
    OSS 项目的 Rangers 和 ALM 副总裁。


    这里分享的广泛指导并非适用于人的端到端计划，尽管它可以作为某些团队的权威指南。这本书的众多资产之一是它将典型的 ALM Ranger 项目（从想法到解决方案）通过实用的演练进行组织，并以易于阅读的参考形式呈现。其他额外收获包括一个用于快速启动你自己项目的附录，以及让你保持不偏离轨道的参考清单。


    在作者中，这本书被称为“v1 黎明版”。秉持着“学习并分享所有经验”的核心价值观，ALM Rangers 始终意识到，生产优秀软件意味着要根据新的学习和反馈进行持续改进，并且这本书还会有更多版本。但首先，我们邀请你沉浸在*使用
    Microsoft Visual Studio Online 管理敏捷开源软件项目*之中。


    秉持真正的敏捷精神和持续创新的祝愿，


    Sam Guckenheimer

    Clemri Steyn


    # 前序


    2006年1月，我从慕尼黑的微软咨询服务部门搬到了雷德蒙，加入了 Visual Studio 产品组。几个月后，我们成立了 Visual Studio ALM
    Rangers，愿景是填补功能和指导方面的空白。“让我们解决问题而不是抱怨”是我们的格言，这引起了 ALM 实践者的共鸣。今天，我们已经帮助了数十个客户，并获得了大量的下载量和顶级评价。


    如果说这本书只有一个理由，那就是分享实践。我们在过去忙碌的岁月里学到并分享的内容改变了社区开发开源软件的艺术。


    这本书是一本实践库，是我们通过数十次迭代创建并完善的。为了便于消化，我们将这些实践安排在不同的章节中。每一章代表了社区的主要操作。这些实践涵盖了我们从端到端的业务，从想法到交付的产品。


    每一个好的解决方案都始于一个好的想法。就像其他想法一样，我们以系统化和结构化的方式收集所有的想法。我曾将其称为“数学民主”，即社区通过投票决定我们做什么，以及最重要的事情是什么。


    我们是亲力实行的实践者。我们使用自己的工具来开发解决方案，并且只有在它们对我们有效时才推荐它们。通常，我们会扩展“通过在真实的客户项目中使用和测试我们创建的内容来吃自己的狗粮（dogfooding）”的概念。


    我们还关注就绪。我们通过将就绪和问题解决合并为一个连续且重叠的实践，掌握了这个领域。每个项目都始于就绪。我们的格言是“如果你不理解这个领域，你就无法解决问题”。就绪是高效生产的前提。


    当涉及到开发时，我们著名的“激光聚焦”遇上了务实主义。没有范围蔓延（scope creep），也没有过度设计（gold plating）。我们更倾向于将所有精力都放在解决方案的质量上。


    我们写这本书是为了以开源精神与 ALM 实践者社区分享我们的知识，使他人能够复制我们的成功。


    > Bijan Jivindi, 首席计划经理


    “吃自己的狗粮”的实践在微软有着悠久的历史，特别是在 Visual Studio 团队。使用自己的产品来构建自己的产品，并在客户之前采用最新版本，这是一个强大且极具服力的观点。这种实践的影响是如此强大，以至于团队内部许多成员都清楚它被广泛采用——这得益于它的精炼、实用性和可靠性。即使对“吃狗粮者”生产力的最初影响也是巨大的，对内部和外部客户的投资回报也是丰丰的，使得这种实践是值得的。


    这里分享的广泛指导并非适用于人的端到端计划，尽管它可以作为某些团队的权威指南。这本书的众多资产之一是它将典型的 ALM Ranger 项目（从想法到解决方案）通过实用的演练进行组织，并以易于阅读的参考形式呈现。其他收获还有一个用于快速启动你自己项目的附录，以及让你保持不偏离轨道的参考清单。


    在作者中，这本书被称为“v1 黎明版”。秉持着“学习并分享所有经验”的核心价值观，ALM Rangers 始终意识到，生产优秀软件意味着要根据新的学习和反馈进行持续改进，并且这本书还会有更多版本。但首先，我们邀请你沉浸在*使用
    Visual Studio Online 管理敏捷开源软件项目*之中。


    # 引言


    通过这本书，分享我们在透明、简单和信任的环境中磨练技能的冒险。我们是一个地理分布、兼职、虚拟且基于志愿者的团队，这意味着很难获得承诺。我们构建的解决方案从小到复杂不等，并使用通常处于前沿的技术。对于我们来说，不走常路是一种资产，这涉及到各种技能、传统、文化和经验。


    ## 谁应该读这本书


    这本书针对敏捷开发团队及其 Scrum Master，他们希望探索并从我们的“吃狗粮”经验以及我们对软件需求的持续适应中学习。产品所有和其他利益相关者也能在书中发现价值，学习如何支持他们的敏捷开发团队并理解项目的限制。


    ## 假设


    这本书假设你对敏捷、精益和 Scrum 开发概念有基本的了解，并熟悉 Team Foundation Server (TFS) 和 Visual Studio
    Online (VSO)。想要超越这本书并扩展对敏捷实践或 Visual Studio 技术的知识，MSDN 和其他微软书籍提供了完整的介绍和全面的信息。


    ## 如果符合以下情况，这本书可能不适合你……


    如果你正在寻找专注于软件需求、工具或实践的过程、开发或架构的研究，这本书可能不适合你。同样，如果你正在寻找 ALM、DevOps 或官方框架（如敏捷、Scrum
    和看板）源代码或指导，这本书将不完全相关，我们建议考虑这些出版物：


    - Agile Software Engineering with Visual Studio, Sam Guckenheimer and Neno Loje

    - Professional Scrum Development with Microsoft Visual Studio 2012, Richard Hundhausen


    ## 本书结构


    我们将分为分为章和两个附录，旨在作为易于阅读的内容帮助你入门，并在以后作为你在复杂环境中过程的宝贵参考。附录侧重于技术、清单和支持指导。第 1 至第 4 章带你通过一个实用且简单的生命周期，从初始想法到准备工作、构建解决方案以及提高质量标准，重点在于需求管理，而不是工具。


    '
