    # 第 3 章：构建可行的解决方案


    不承担责任，也不参与解决问题或障碍。如果我们都认识一个“电影影评人”式的人，他们对任何电影都有正面的评价；或者一个“技术影评人”，他们认为技术已经足够好，但却能有一百万一件事可能出错的地方。


    并不是所有批评者都是“胆小鬼”（critical chickens）！那些对项目成功负责的团队成员会提供建设性的反馈，并投入到寻找解决方案中。他们知道，如果团队失败，他们也无法成功……我们同荣共辱！


    对于分布式的、兼职以及（尤其是基于志愿者的）团队和社区项目，“胆小鬼”是有毒的，必须将他们从发布“飞行计划”中推出去。


    # “自产自用”案例研究：四象限图


    可视化是关键，不同的利益相关者对不同视图的反应是“积极”的。


    # 背景信息


    在“想法分检”（Triage of ideas）中，我们引入了社区熟悉的想法分检以及相关的可视化方案。假设我们有 19 个假设的预测项目，标题为 A-S，通过使用示例分检工作簿，我们得到了下面的原始视图。根据
    ALM 社区和 ALM Rangers 利益相关者定义的规模、业务价值和优先级，我们在图 77 中清楚地看到前两个想法是 A 和 B。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_96_0.png)


    图 77。原始视图。


    当我们审查若干潜在可视化方案时，Wouter de Kort78 评价：“这是我们以前使用的那种。我喜欢它能很容易看出相对价值。”他还说：“有帮助的是将条形分成两种颜色，代表社区价值和
    PG 价值”，关于这一点稍后会讨论。


    # 四象限体验


    整合后的分检工作簿引入了一种新的四象限可视化，我们对其进行了一段时间的“自产自用”。视图是在产品经理（PM）与产品组 PM 及其他利益相关者协作对原始数据进行标准化后生成的。其目的是是将每个想法放在四个象限之一：社区、产品组、双赢或拒绝。包含真正宝石的象限是右上角，它具有高社区价值和高产品组价值……双赢。我们在图
    78 中注意到，想法 A 和 B 都包含在内，还有 E，它在原始数据标准化期间获得了信誉提升。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_97_0.png)


    图 78。四象限视图


    当我们把上面的视图转换为堆叠视图（图 79）时，Wouter de Kort79 感到非常满意：“这就是我的意思。有助于理解项目的位置。同时也显示了 PG
    喜欢什么。”


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_97_1.png)


    图 79。堆叠视图。


    注意不要引入像图 80 那样看起来花哨但嘈杂且低价值的可视化。我们与利益相关者协作，确定哪些是有效的，哪些是无效的。我们以更多的可视化方案结束这项案例研究，Wouter
    de Kort 对此评价道：“难以阅读”。


    > 79 http://aka.ms/vsar-wdk


    使用 Microsoft Visual Studio 管理敏捷开源软件项目 94


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_98_0.png)


    # 核心收获


    - 采用对团队自然的迭代生命周期模式是关键。

    - 通过每周团队 Scrum（scrums），团队完全了解项目状态和任何障碍。这提高了项目的可见性和整体透明度。

    - 每个冲刺（sprint）进行一次定期的 Scrum（scrum of scrums），有助于透明化，并帮助大家理解飞行愿景和动力，同时也有助于发现与其他飞行计划和团队之间的问题和依赖关系。

    - 对于分布式和兼职团队，自动化可以减少交付和依赖时间，并强制某种一致性。这使得团队成员能够专注于他们最擅长的工作。

    - 团队不断反思、改进并认可团队成就是非常重要的。信任和透明是关键。

    - 通过更短的冲刺，团队可以更快地交付，从而减少浪费并保持团队的热情。


    # 第 4 章：提高质量门槛


    > 现在不是结束。它甚至不是结束的开始。但它也许是开始的结束。

    > 温斯顿·丘吉


    我们通过提高质量门槛并规划未来（图 81）来完成路线图和相关的发布飞行计划。这是团队成员进行创新、规划并反思自身以及整体流程的机会，以支持持续改进。它提供了时间来完成经常被忘记或推迟的关键开发和测试阶段，特别是对于具有地理位置分散和部分兼职的项目。


    培训、研究与规划


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_99_0.png)


    图 81。生命周期：质量与规划。


    # 质量与规划 (QP)


    在每个冲刺结束时，我们都会交付一个可行的解决方案，并提供我们正在取得进展的证据。理念是尽早发布并能够对业务做出反应。包含真正宝石的象限是右上角，它具有高社区价值和高产品组价值……双赢。我们在图
    78 中注意到，想法 A 和 B 都包含在内，还有 E，它在原始数据标准化期间获得了信誉提升。


    （注：提示中提供的文本由于分页存在一些重叠部分。我已根据提供的文本合并了逻辑叙述流。）

