    # Introduction


    **Chapter 1, "Triage of ideas"** Describe our use of Visual Studio Online (VSO)
    to drive the requirements, prioritization, ownership, and management concepts.
    Every working solution starts with a great and nearly pruned idea!


    **Chapter 2, "Getting ready"** As part of training-research-planning (TRP), we
    gather as a team, understand what we have and what we agree on. Looking back at
    a number of projects tackled by our geographically distributed, volunteer, and
    part-time teams, it is what that is pivotal.


    **Chapter 3, "Building the working solutions"** We switch from planning and enter
    the development phase, where the rubber meets the road—executing our plan, implementing
    features and their associated value, and working solutions quickly and often.


    **Chapter 4, "Raising the quality bar"** We complete an adventure by raising the
    quality bar and planning the future. This is an opportunity for the team to innovate,
    reflect and on the overall process to support continuous improvement. It provides
    the time to complete activities often forgotten or postponed during critical development
    and testing phases, with geographically distributed and part-time teams.


    **Appendix A, "Supporting toolbox"** A collection of templates, checklists, and
    gadgets that can be used for quick reference and for teams to get started in a
    confident way.


    **Appendix B, "mastering your own dog is key"** A collection of proven technologies
    and techniques we have used 24/7 on our projects. We share our cherry-picked and
    tailored framework and learnings, allowing everyone to reflect, discover possible
    improvements, and continuously improve the way they work.


    # Technologies/TRP/QP


    +   - Technologies or concepts covered herein, as training-research-planning (TRP)
    and quality planning (QP), we are equipped to solve our geographically distributed,
    virtual, and part-time development teams.

    - Whether you adopt these technologies or concepts, make them part of our development
    sprints, or otherwise that is your prerogative.

    - We are not making these concepts but simply sharing what has proven valuable
    to us.


    +   **Continuous reflection, adaptation, and improvements**

    - We will continue to use the concepts covered herein. By the time you read this,
    we have probably made changes based on continuous process improvements and adaptations.

    - We publish what at the time of writing, gather feedback, innovate tomorrow,
    and will update this content at the next possible opportunity.


    # System requirements


    We have no real system other than an Application Lifecycle Management (ALM) system
    to track your requirements and backlogs. While the concepts covered herein are
    technology agnostic, we recommend that you evaluate [Visual Studio Online* as
    your ALM solution.


    # Downloads: Toolbox samples


    You can download the templates and tools mentioned in Appendix A, "Supporting
    Toolbox" here: [http://aka.ms/ALMRangers/files].'
