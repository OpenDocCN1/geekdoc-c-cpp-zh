    # Chapter 2: Getting ready


    +   * Teams fail to invest the time needed to plan each sprint or perform microtask
    planning, leading to inaccurate planning, inconsistent sprint velocities, and
    overhead in terms of task management during the sprint.

    * Team members often report status late—Oh, I completed what a long time ago—resulting
    in a sudden drop of the burden towards the end.

    * Starting with no clear objectives or milestones, projects generally turn into
    an on-going run. Teams often retrospectives as overhead rather than as an opportunity
    to improve the team environment, and teams often abandoned retrospectives altogether.


    GEM | Proactive retrospective "quick" survey

    For teams that are reliant on part-time volunteers and geographically dispersed,
    we''ve found that online retrospective surveys help the team gather good, bad,
    and ugly quickly. We can use the survey feedback to fast track the retrospective
    discussions.


    # Training-research-planning (TRP) as a remedy


    The focus on training-research-planning encourages teams to practice proactive
    sprint planning, reducing ambiguity and task management. With realistic and accurate
    estimations, teams are able to deliver working software frequently and regularly.
    Over time, a realistic velocity can be determined for each team and normalized
    across the community. Agreeing on one innovation each sprint reduces the perceived
    waste of time due to meetings but continuously encourages reflection and innovation.


    # Key learnings


    +   * The focus on training-research-planning helps the team to educate themselves
    and understand and define what, why, and how of the underlying solution.

    * Estimations play a huge role in projects, especially normalized estimations.
    Normalized estimations help simplify the estimation effort and improve estimation
    accuracy. This in turn helps the team to deliver software frequently and regularly
    with continuous improvements.

    * Recorded Vface-to-Vface meetings provide transparency and access to information.'
