    ## 构建解决方案


    ## 核心要素 (Gems)


    ### 心跳 (Heartbeat)

    敏捷团队的心跳和脉动是迭代且一致的节奏。


    **拉取与推送 (Pull and push)** 默认情况下由团队成员拉取并设计用户故事，但要准备向那些迟于从积压列表（backlog）中提取故事的成员准备并推送故事。


    **冲刺目标 (Sprint objectives)** 规定团队的交付物和功能。这些目标强化了我们为什么要这个项目、需要做什么、由谁负责，以及团队对成功的有多大信心。


    **重复 (Repetition)** 采用一种让团队自然的冲刺模式，并不断重复、重复、重复。例如：


    - 以团队形式承担冲刺挑战——例如，返回木卫二（Europa）。

    - 审查并精炼冲刺积压列表中的目标、需求和功能——例如，转移 W-Astr X Y 样本，并在 Z 年内返回地球。验证我们是否理解了需求，是否有能力满足验收标准，并且能够在无或可控未知因素的情况下进行。

    - 计划并设计冲刺开发旅程。

    - 开发功能以实现需求。

    - 集成、测试并验证功能。

    - 反思冲刺，识别改进点并计划后续行动。

    - 演示并展示可行的解决方案；


    **每日站 (Scrums)** 这些会议体现了项目目标和透明度。尽可能安排简短、有效的会议。


    | 核心要素 | **每周心跳“关键项 (rocks)”** |

    | --- | --- |

    | 对于地理位置分散、兼职和虚拟团队，建议进行每周符合 15 [+15] 分钟时间限制的每日站。 | |

    | **定期心跳“关键项”** | |

    | 对于地理位置分散、兼职和虚拟团队，我们建议每冲刺进行一次站会（scrum of scrums），每个团队限制在 2-3 分钟。 | |


    **演示 (Demos)** 这些是团队、领导和利益相关者同步信息的机会。


    | 核心要素 | **2-3 分钟的演示视频“关键项”** |

    | --- | --- |

    | 测试人员/评审人员处于最佳位置，可以记录他们的验证测试并制作作为演示和视觉化工具的视频。为了产生最大的影响力，请将视频控制在 2 分钟（最佳）到 3 分钟（最长）。
    | |


    **回顾 (Retrospective)** 使用回顾来收集主观和定量证据，用于改进冲刺过程。


    | 核心要素 | **就一项创新达成一致** |

    | --- | --- |

    | 每个团队应该就一项能够提高其团队体验和生产力的创新达成一致。 | |


    **计划 (Planning)** 计划下一次冲刺是完成当前冲刺的一部分！


    | 核心要素 | **保持积压列表的整与整洁！** |


    ## 附录 A：支持工具箱


    将你的积压列表视为项目的主入口。保持它的整洁和梳理将确保第一印象是良好的，且访问是协作且高效的。


    **梳理 (Grooming)** 生成一个精简且整洁的需求积压列表，并更好地理解需要按什么顺序在何时完成什么。


    **核心要素 从上至下梳理**

    确保产品负责人（Product Owner）和利益相关者对所有积压项进行优先级排序。从积压列表的顶部（最重要）到底部（最不重要）处理。


    ## 提高质量标准


    ## 核心要素与规划


    **质量与规划 (Quality and planning)** 我们结束项目时侧重于提高质量标准并规划未来。


    **核心要素 自动化“关键项”**

    虽然手动测试有其价值，但测试自动化允许团队运行更多、更频繁且持续的测试。仔细评估并选择适合你团队的测试，并调查何时进行手动测试，何时进行自动化¹¹⁰⁰


    **评审流程 (Review process)** 我们有定义良好的评审流程，以确保我们可以收集反馈并跟踪其在开发过程中的集成。确保团队了解该流程，以确保从开始维持质量。


    **成熟度里程碑 (Maturity milestones)** 向目标受众早期发布可以驱动早期反馈。


    | 里程碑 | 描述 | 现状 |

    | --- | --- | --- |

    | 原始 (Raw) | 指在研究和原型期间执行的所有活动，通常在专注于培训计划的冲刺期间进行。 | 未知 |

    | Alpha 前 (Prealpha) | 指在交付功能的开发冲刺期间执行的所有活动，但不包括测试和评审。 | 未知 |

    | Alpha 版 | 开始并建立测试和评审的第一阶段，且我们知道正在处理一个功能不完整且不稳定的解决方案。团队可能会决定发布内部/私有的 Alpha 以从“受限”社区获取早期反馈。
    | 不稳定、功能不全、且可能崩溃。 |

    | 静默 Beta (Beta "silent") | 这是一个解决方案已完成但存在障碍和错误的阶段。在进行稳定和质量改进期间，团队可能会发布内部/私有的
    Beta，将解决方案暴露给选定的观众并获取真实反馈。 | 稳定、功能完整、不太可能崩溃。 |

    | 公开 Beta (Beta “public”) | 产品负责人（PO）签署质量标准，承认解决方案进入 Beta 阶段。公开 Beta 的意图是在落地或交付时发布解决方案。
    | 满足最低质量。 |


    > ¹⁰⁰ http://blogs.msdn.com/b/stever/2008/02/26/when-to-test-manually-and-to-automate.aspx


    | 里程碑 | 描述 | 现状 |

    | --- | --- | --- |

    | RTM | 发布准备制造（RTM）或“金光 CD”里程碑是团队已完成所有活动、尽可能提高质量并解决所有分配到发布版本中的 Bug 的里程碑。与公开 Beta一样，解决方案已落地或交付。
    | 达到或超过最低质量标准。 |


    ## 自用产品（Eating your dogfood）是关键


    ## 核心要素与清单


    **Visual Studio Online** 我们使用 Visual Studio Online 运行业务。它每周都在改进，是我们的技术基础。


    **将复杂性简化为单一** 我们尝试在我们的世界中保持简单，这通常比更复杂的解决方案效果更好：


    - 我们使用一个项目

    - 我们使用一个团队

    - 我们对齐到一个共同冲刺

    - 我们遵循一个流程，即 Scrum


    **协作 (Collaboration)** 我们促进频繁协作以打破障碍和摩擦。为了有效，我们了解自己的团队。不要低估面对面交流的影响；在虚拟会议中开启摄像头。


    **流程 (Process)** 我们的软件框架是实践的基础，并与敏捷宣言和精益原则具有高度可比性。


    | MSF | 敏捷宣言 | 精益原则 |

    | --- | --- | --- |

    | 原则 | 心态 | 价值 |

    | 促进开放沟通 | 让团队成员熟悉他们如何处理解决方案交付 | 个人和互动优于过程和工具 | 消除浪费 |

    | 朝着共同愿景努力 | 关注业务 | 可运行的软件优于详尽的文档 | 构建质量 |

    | 授权团队成员 | 追求工作质量 | 建立问责制和共同责任 | 客户协作优于谈判 | 尊重人员 |

    | 关注交付业务价值 | 履行承诺 | 响应变化优于遵循计划 | 优化整体 |

    | 保持敏捷，除非变化有害 | 持续学习 | |

    | 投资质量 | 培养良好的公民意识 | |

    | 履行我们的承诺 | 内化服务品质 | |


    我们有几个关键角色，作为系统的胶水（见表 11）。在某些情况下，他们的角色可能会重叠：


