    “已批准”状态意味着 PO 对团队有良好的评价，并支持团队投入带宽进行实现。


    “已批准”状态意味着 PO 对团队有良好的评价，并支持团队投入带宽进行实现。


    “已批准”状态意味着 PO 对团队有良好的评价，并支持团队投入带宽进行实现。


    - 最短作业优先（SJF）方法（Wikipedia, 2014）在延迟成本相等时非常有用，并建议先做最小的故事（图46）。


    如果我们需要更准确且无偏的优先级排序：


    | 价值 | 场景 1 | | 场景 2 |

    |---|---|---|---|

    | | 延迟成本 | B | A |

    | | 1 | 3 | 个时间 | 5 | 个时间 |


    图 46. 最短作业优先。


    场景 1 显示了延迟成本最低的最优序列。场景 2 的延迟成本较高，小任务随时间推移失去价值的风险更高。最重要的是，场景 2 将让用户等待可交付增的时间的时间。


    - 加权最短作业优先（WSJF）方法（Leffingwell, 2014b）在故事具有不同延迟成本和所需工作时非常有用，这很常见。它衡量用户价值、时间价值、风险降低/机会实现，工作量定义公式如下：

    WSJF = (用户价值 + 时间价值 + RROE 价值) / 工作量

    其中 RROE 值代表风险降低/机会实现，范围从 1 到 10。


    ## 发布计划：离线准备


    在理想世界中，我们会在同地面对面的研讨会和小组讨论中安排并进行发布计划。但并不是确保所有成员到场并准备就绪的最佳方法，确保每个人确切知道团队的期望、如何操作，最重要的是，每个人必须知道并同意解决方案发布的“计划”。


    在一个典型的兼职、地理分布且基于志愿者的社区中，面对面交流的梦想只是梦想。协作通常限于电子邮件和电话会议，这需要有效且准确的沟通以避免低效。


    情况会有所不同，这里涵盖的概念基于广泛的内部自用（dogfood）以及我们的“最坏情况”项目，范围从 1-2 个成员到 1-2 个拥有 5–10 名成员的功能团队。


