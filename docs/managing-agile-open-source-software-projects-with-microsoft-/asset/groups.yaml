    # Project Lead


    The Project Lead (PL), also known as Dev Lead, enables development teams. The
    PL loves transparency, dislikes information hiding, and focuses on fine-tuning
    the team and collaboration with other stakeholders.

    As shown in Figure 103, the PL is the interface to the development team(s). The
    PL facilitates all communication with the development team, shielding the team
    and establishing 1:1 communication links when and appropriate.


    +   A PL can optionally act as a Scrum Master, contributor, and reviewer as well,
    in which case this team member’s responsibilities and estimated effort will change.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_146_0.png)


    Figure 103. Roles and responsibilities for Product Owner, Project Lead, and Program
    Manager.


    # Program Manager


    The Program Manager (PM) works with stakeholders, customers, and development teams,
    focusing on orchestration and keeping the team and backlog from stagnating. The
    blog Persona within the ALM Rangers¹128 Energizing the team¹129 Program Management-Thinking
    about PM 1: PM and Visual Studio ALM Rangers (Part 2)¹130 and Program Management
    – Are some of the Rangers Symbiotic PMs?¹131 explore the definition of a PM within
    Microsoft and the slight variation within the ALM Rangers. The PM lives between
    the backlog and the users, especially when aligning customer expectations and
    scope, and coordinates communication between stakeholders. With other roles, we
    expect Program Managers to create product awareness and passionately promote the
    solution.


    # Contributors


    The contributor, also known as developer, builds the product. Contributors maintain
    their assigned tasks and keep them up to the backlog. Our process is to select
    and work one task at a time to keep the backlog free for others to assign when
    necessary. When a contributor assigns more than one task to himself or herself,
    they assume they need to work on both because there is some dependency. Otherwise,
    we are creating waste in the form of undework.


    ¹128 https://blog.mdn.com/willy-peter-schauer/archive/2014/08/fun-of-pm-persona-within-the-alm-rangers.aspx

    ¹129 https://blog.mdn.com/willy-peter-schauer/archive/2014/07/22/fun-of-pm-2-energizing-the-team.aspx

    ¹130 https://blog.mdn.com/willy-peter-schauer/archive/2011/10/25/program-management-thinking-about-pm-and-visual-studio-alm-rangers-part-2.aspx

    ¹131 https://blog.mdn.com/willy-peter-schauer/archive/2011/11/15/program-management-are-some-of-the-rangers-symbiotic-pms.aspx


