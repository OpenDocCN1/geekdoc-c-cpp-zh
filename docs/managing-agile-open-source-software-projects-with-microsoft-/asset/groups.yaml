    ## Innovate for next time


    The focus on quality and planning is an ideal opportunity to commit bandwidth
    to research and innovation. We empower the team, inspire the individual, and fuel
    the passion for technology by enabling the exploration of new technology, processes,
    and techniques. Technology “play time,” technology garages, “hackathons,” brown-bags,
    and other exciting mechanisms foster unrestricted innovation, learning, and information
    sharing.


    While we should align the overall innovation theme with the current and future
    solutions, we need to be careful not to be restrictive or autocratic, inadvertently
    stifling the “fun” factor.


    Why would anyone invest or his invaluable time to volunteer to “work” in a dictatorship?


    ## Planning what is next


    The second pillar of the sprint focused on QP concludes the final sprint with
    a focus on determining whether a subsequent release is needed and starting to
    plan it.


    Planning the next release will be part of the next sprint(s) focused on training-research-planning.
    At this stage, we can revisit the core objectives and brainstorm future features
    that could potentially add value or address known business problems.


    As in previous sprints, the planning forces the team to “sit on their hands” (Figure
    90), reflect on the past release, and openly discuss the future.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_108_0.png)


    Figure 90. If all else fails, serve pizza!


    Observation of numerous projects has shown that many volunteer team members go
    dark and vanish during the final sprint, when everyone is just waiting for the
    flight to land and the ship-it event to trigger.


    Both innovation and planning help maintain the team’s spirit and ensure that its
    heartbeat is retained until the next adventure dawns. Keeping the team busy is
    important during all sprints but paramount and especially toward the end of the
    sprint.


    ## Product Owner sign off


    The final ceremony occurs when the Product Owner signs off on the features, sets
    the feature state to Done, and gives the team a thumbs up to the solution.


    Whether the, a system team, or a centralized support team, the solution varies
    from organization to organization. In our case, the ship-it inevitably triggers
    the following actions:


    - Solution uploaded to CodePlex as a download.

    - Stable main branch of the solution is merged to a release branch in version
    control.

    - Solution catalogue89 is updated to reflect the solution and associated version.


    ## Chapter 4: Raising the quality bar


    - Bullet boards show the flight plan are refreshed to highlight the landing.

    - An announcement is published.


    ## Announcement and noisy release


    The style of announcement is organizational, team, and often personal preference.
    Consistency across flights is an advantage but not a necessity, especially in
    the world of community projects.

    Figure 91 shows an example announcement using the blogging channel:


    ## Practical guidance for TFVC and TFS on Azure IaaS


    Willy S. Schau May 15 2014 3:21 PM


    The Visual Studio ALM Rangers are pleased to highlight new and updated practical
    guidance that landed lately.

    FS Mapping, DR avoidance and TFS on Azure IaaS v1.BETA has arrived!


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_109_0.png)


    The new guidance includes practices for Team Foundation Server (TFS) on Azure
    Infrastructure as a service (SaaS). We guide you through the planning and setup,
    based on a real-world proof-of-concept deployment and experience from ''in the
    field''.


    Version control guidance v3.BETA has landed

    Third version of this blockbuster guidance has been split into separate sections
    as summarized, allowing you to pick the ''world'' (guide) you are interested in.
    This releases a new deliverable, more compact style, which is easier to consume
    on multiple devices without sacrificing any content. The content is updated along
    with the latest Studio technologies and incorporates feedback from the readers
    of the previous guidance.


    > The guidance uses "friendlier" strategies. For example, the new Release Isolation
    is more meaningful than the Basic - Branch approach used in past.


    Figure 91. Blog announcement for two beta releases.


    Once we have landed and shipped the solution, marketing, visibility, and "noisy"
    are important. A solution accompanied by passionate blogging, videos, and vibrant
    community members will be infectious. Hyperactive community members sell solutions
    more professional and expensive experience.


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online


    ## Why do we ship on CodePlex and not VSO?


    > NOTE: This part of our process will evolve with Visual Studio Online, allowing
    us to manage and release open source solutions on Visual Studio Online.


    As Studio Online invites guest access and the ability to publish solutions publicly
    and accept feedback and contributions, we retain our presence on CodePlex. Our
    “dream” is that one we can accept feedback and contributions from the community
    and by using a pull request to request a feature update.


    ## Foodfooding case study: vsVersionControl and vsTreasureMap ship ringing victory
    bells


    Wrapping up and landing a release is the last part of the adventure. No project
    ever finishes the same way as its predecessor or other solutions. There is no
    perfect recipe for landing the solution on time, above the quality bar, and with
    100 percent satisfied customers. In this case study, we explore two projects,
    each with a spectacular and successful landing but using a completely different
    strategy.


    ### Background information


    We introduce the ALM Treasure Map team in the case study. We welcome this team
    for the quality and planning sprint. Another team, which did not payoff the innovations
    covered in this book, ended their lifecycle focused on quality and planning. These
    teams are real-world examples to include as part of this case study. Version Control
    (ex Branching and Merging) Guide had been bogged down with three or four guidance
    e-books, the new release of the fourth failing to achieve the minimum quality
    bar. A “Judge Dread” decision was to spin up a new release for the ill-fated fourth
    guidance e-book and dogfood the quality and planning focused concepts for the
    others.


    ### Different strategies, same objective . . . “land”


    The lifecycle of both the teams and their solutions shown below the quality and
    planning bar in Figure 92 illustrate that neither team stuck to the “optimal”
    plan. Both team adapted and shipped, and this introduces an important concept:
    Reflection, continuous improvement, and a willingness to take risks and embrace
    change are instrumental to our success!


    ## Chapter 4: Raising the quality bar


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_111_0.png)


    Figure 92. Different sprints focused on quality and planning strategies.


    Here is their story ...


    ### Readiness test map


    The pirates spin off two quality-improvement activities, one focused on fixing
    known bugs and testing the updates, and the second on user-acceptance testing.
    Every team member, or in this case shipmate, was engaged with the solution, giving
    continuous feedback to the developers and responding to the chief tester, Darren,
    who likely created more and more-complex test cases than the team testing the
    Agile module for the first month landing. Innovation occurred as part of bug and
    test feedback and resolution, with every shipmate engaged and featured. After
    the Product Owner sign-off ceremony, the solution was put through the store certification
    process and shipped as a RTM v3 in the internal TechReady 19 event and yet another
    "fun" demo session.


    An obvious anomaly is the lack of noticeable planning, intentionally deferred
    to the TechReady 19 session where the captain engaged the audience in feature
    and future-direction planning. This is an innovative, transparent, and engaging
    concept. ARRGH!


    ### Version control guide


    The team also spin off two parallel activities, one focused on a technical review
    and the other on a copyedit to align the three guides in terms of consistency,
    tone, and style. When the technical review was complete, the team was ready to
    ship, but the quality bar required the copyediting to be completed. With the copyediting
    bottlenecked and estimated completion dates far exceeding the end of the sprint
    focused on quality and planning, the team made a call to the Product Owner to
    sign off and give permission to ship a bottle beta to avoid further delays in
    sharing the e-book with the community. Each-book was transferred


    51 TechReady is an internal technical event at Microsoft and prime opportunity
    for the Rangers to connect with the field engineers.

