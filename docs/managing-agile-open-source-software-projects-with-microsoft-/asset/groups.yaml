    信心


    如果产品负责人决定更改发布目标、验收标准、完成定义或目标将会怎样？


    记住，这些是团队的支柱——需求的定义，更重要的是成功的定义。这些支柱中的任何一个发生变化都需要团队进行反思和响应。


    > **警告：分布式和兼职团队的响应能力较不理想**


    - 团队跨越的时区越多，团队成员接收、反应和响应变更通知所需的时间就越长。

    - 安排短期和紧急会议具有挑战性，特别是当与兼职志愿者合作时。


    **记住：家庭 > 现实工作 > 兼职副业**


    产品负责人是解决方案和“交付”业务价值的[法官·德瑞德]。对于团队来说，对变化做出反应，并与利益相关者协商如何最大化业务价值并最小化产品浪费是至关重要的。


    具体的重构取决于变化的性质。团队不应该抵制重新估算、排序甚至撤销已完成工作的可能性。最终目标是尽快恢复，最小化浪费，并针对变化使解决方案价值最大化。


    **GEM 准则：短冲刺 == 少浪费**


    冲刺越短，如果你需要响应变化，在迭代过程中产生的浪费就越少。


