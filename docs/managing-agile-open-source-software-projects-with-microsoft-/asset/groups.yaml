    # Reviewers


    Reviewers, also known as testers, validate the functionality and quality of the
    product. As with other roles, reviewers keep their tasks up to date, identify
    impediments early, and push the team to achieve the highest quality quality bar.


    # Mentors


    The mentor, also called buddy, is an experienced subject matter expert, acting
    as a mentor to his or her peers, in particular to the Project Leads and Backup
    Leads also to engineers in training.


    > NOTE The article The Difference Between a Mentor and a Consultant132 gives an
    interesting perspective of a mentor. The article states: "A mentor should be motivated
    by nothing more than the desire to help. Second, a mentor''s role is not to advise
    but rather to give you a different way of thinking."


    # Scrum Master


    The Scrum Master (SM) guides, mentors, and coaches the Project Leads and teams
    as needed using Scrum, Extreme Programming, SAFE, and Kanban as teams, a team
    player, facilitates, mentors, and guides the team. We strive to share information
    transparent and ensure team status is visible and known at all times to everyone.


    The Scrum Master supports the Product Owner and Project Leads in an effort to
    facilitate their involvement and minimize their overhead. The Scrum Master continuously
    improves the teams and the engineering practices and tools.


    This appendix provides an overview of the Agile frameworks and our adaptations
    for part-time and geographically distributed teams. We shared with how we adapted,
    our use of the Microsoft Visual Studio ALM stack and other Microsoft solutions
    such as Yammer and Lync, and our use of third-party tools.


    Before we end this appendix, we give you a final case study for one of our projects.


