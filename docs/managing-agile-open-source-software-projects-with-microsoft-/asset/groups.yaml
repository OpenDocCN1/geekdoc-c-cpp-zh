    ## 校对/评审


    你是否还记得你购买的产品，以及当你面对不完整、复杂或非法的用户文档时，挫败感如何增加？

    领域专家（SME）、内容编辑（人员）和校对人员必须审查所有文档：


    - SME 验证内容实际上正确，且其内容长度和详细程度对于成功的部署和使用是补充。

    - 内容编辑支持团队进行校对和事实核查，通常参与内容开发。这些编辑从头到尾都参与。

    - 校对人员是最后的防线，专注于校对、事实核查、流程和可读性。当团队认为内容可以发布时，这些编辑会对材料进行评审。


    使用 Word 和 Team Foundation 版本控制 (TFVC) 的功能，我们在整个飞行（项目）期间有效地管理文档。如图 85 所示，我们的大多数解决方案在
    TFVC 中都有一个预定义编辑者的文档说明。


    1. **进行中 (Work in Progress)**：适用于正在校对的内容，我们建议使用模板来简化格式任务，并确保编辑留下的内容一致。完成后移动到下一个文件夹以指示状态更改，并通知团队文档已准备进入下一步——例如，评审或校对。

    2. **校对中 (Copyediting)**：适用于准备好进行校对的内容。内容开发人员在校对人员编辑时应“停手”。强烈建议使用注释和内联修订跟踪。

    3. **准备评审 (Ready for Review)**：适用于准备好进行 SME、社区和内容评审的内容。强烈建议使用注释和内联修订跟踪，以便评审人员在没有合并冲突的情况下提交带有修订的文档，或提交给内容所有者进行手动合并。


