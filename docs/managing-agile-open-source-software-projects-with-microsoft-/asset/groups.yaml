    ## Controlled Vocabulary: Walkthrough


    Email remains the most common form of electronic communication, coping with the
    volume of messages can be challenging. To assist with initial processing and future
    searching, we recommend adopting a structured format to the subjects of email,
    mentioned earlier in this book. To assist with this, use the Controlled Vocabulary
    Outlook add-in. The quick start below is based on release 1.6.0.0.


    ## Quick start


    Open the Controlled Vocabulary Quick start in the supporting toolkit (part of
    the downloadable content mentioned in the book''s introduction). In this folder,
    you will find the following files and folders:


    - QuickStart This folder contains the images used in the add-in, as well as the
    button.xml file containing the makeup of the buttons and menus you also add and
    the configuration.xml file that your button will use to update itself.

    - QuickStart.cvcf This is a file used by the add-in to install your.

    - QuickStart.xml This file has the same content as button.xml. The idea is that
    you place this on your web server file share along any other buttons you have
    configured.

    - QuickStart.zip This is the QuickStart folder zipped up, which the add-in uses
    to update the button when necessary. Again, this would be placed on the web server
    or file share you are using to host your resources.


    To get the QuickStart sample working, let''s use a file share as our host.


    1. Run the following from command line to create a folder and share it:

    ```

    md c:\QuickStart

    net share QuickStart c:\QuickStart /grant:everyone

    ```

    2. Copy QuickStart.zip and QuickStart.xml to the share.

    3. Double-click QuickStart.cvcf, and then click Selected. (img/eb2bb5eedd7e9f0a74372984f6317b95_133_0.png)

    4. Open Outlook to see that the button has been added. (img/eb2bb5eedd7e9f0a74372984f6317b95_134_0.png)

    5. Clicking on the selected creates an email with the appropriate recipients and
    subject line: (img/eb2bb5eedd7e9f0a74372984f6317b95_134_1.png)


    Once you have an idea of how Controlled Vocabulary works, spend some time thinking
    about how your team could collaborate most efficiently. For more information on
    capabilities, you can visit development site https://github.com/mikeourier/ControlledVocabulary
    and even contribute any enhancements you may have.


