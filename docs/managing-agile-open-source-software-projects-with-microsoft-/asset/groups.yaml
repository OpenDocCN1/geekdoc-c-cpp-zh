    # Chapter 3: Building the working solutions


    Scenarios where stories are pushed selectively to team members include:


    +   - Team member(s) may prefer to be guided by the team as to which story they
    need to work on.

    - Multiple team members volunteer for a story, and the team needs to decide on
    the best owner.


    | GEM | Pull & push

    |---|Adopt a strategy for stories by default, but be ready to propose and push
    stories to team members who hesitate to grab stories from the backlog |


    It is important that the commitment for the stories is made by the team, not for
    the team. Team members need a sense of awareness, independence, and freedom, especially
    when volunteering and working in geographically distributed and remote locations.


    # Fixed or variable cadence?


    Most Agile teams swear by a one-week, two-week, or three-week sprint. In the real
    world, the majority of teams appear to be using two-week iteration.


    +   - Key factors that affect the duration of a sprint include:

    - The shorter the sprint, the greater the backlog and sprint management tax in
    comparison with development and testing efforts.

    - The longer the sprint, the longer it can take for impediments to surface, feedback
    to be gathered, and more importantly, to be in a position to reflect and respond
    to change.


    As discussed in "One maine environment... simplicity rules," we highly recommend
    using consistent and shared iterations across our community. Consistency enables
    team members to collaborate effectively on multiple stories and flip-flop between
    teams when we need. Consistency also simplifies training, look ups, and reporting
    across flights and feature teams.


    The naming, duration and breakdown of iterations varies from organization to organization,
    possibly even within teams from the same organization. We use monthly sprints,
    best suited for part-time resources, but recently aligned with the parent department
    division using three-week sprints.


    | GEM | Partial and full sprints

    |---|TRP and QP focused sprints are well suited for partial or full sprints, whereas
    DEV sprints are complete sprints to counterbalance the “part-time” nature of our
    resource bandwidth.|


    # Repetition!


    Irrespective of the length of the sprint, it is important to adopt a sprinting
    pattern that matches the nature of the team. (Figure 6.2) Let''s consider what
    we would typically take on if we need to make adjustments to our home, a passenger
    plane across the Pacific, or to moon Europa:


    +   - Assume the objective of the sprint as a team, for example, travel to moon
    Europa.

    - Review and refine the objectives, requirements and features from the sprint
    backlog, for example, transfer X astronauts to the moon, collect X Y types of
    samples, and return to Terra within Z years. Verify that we understand the requirements,
    we are in a position to meet the acceptance criteria, and are in a position to
    proceed with none or manageable unknowns.

    - Plan and design the sprint development journey.

    - Develop the features to realize the requirements.

    - Integrate, test, and validate the features.

    - Reflect on the sprint, identify improvements, and plan the next actions.

    - Demo and ship working solution(s).


