    Figure 41. Custom boards.


    For example, we proposed the Next Sprint column to allow the team to draw stories
    covered in the next sprint into one common column. The Current Sprint column contains
    the stories to address in the current sprint, where the Ready for Review column
    identifies all stories that are ready for testing, review, and validation. These
    columns do not introduce new stories but vastly improve visibility and planning.


    - (Optional) Refine the team home page using images, tiles, and lightweight graphs
    for improved tracking.


    ## Training . . . learning new things from SMEs


    The first pillar of TRP is the concept of readiness for the team, which includes
    framework, architecture, and technology training.


    - Framework training ensures all team members and stakeholders have an understanding
    of the selected framework and methodology and the principles of Lean and Agile
    thinking.

    - Architecture training ensures all team members have an understanding of the
    underlying solution architecture—for example, the .NET Framework—which helps the
    team build valuable solutions on the relevant architecture.

    - Technology training completes architecture training and delivers focused technology
    training, especially when the team is using early adopter technologies such as
    Desired State Configuration (DSC).


    ## Research... investigate and model requirements


    The second pillar of TRP includes research about the technology, concepts, functional,
    and nonfunctional requirements. We must invest in research and understand the
    requirements and reduce the unknowns in order to estimate and plan the subsequent
    sprints and the shippable solution.


    Before a scuba dive embarks on a search and recovery, the diver researches the
    equipment, situation, conditions, and proposed dive profile to reduce the risk
    and the search time and be in a position to plan and deliver a successful recovery
    (Figure 42).


    Figure 42. A safe, enjoyable, and successful dive starts with research and planning.


    ## Planning


    The third pillar of TRP reoccurs at the end, with a focus on planning and estimating
    the next sprint accurately and subsequent sprints as best possible.


    Martin Hinshelwood^49 introduces the Agility metrics (Hinshelwood, 2014) as follows:


    - We need to focus on value (Business Outcomes) to make sure that we are producing
    something that our customers value while not alienating our employees or spending
    too much money doing it.

    - We need to focus on lead time (Time to Market) to make sure that we can take
    those things of value that we are producing and quickly get them, in order, the
    hands of our customers.

    - We focus on (Ability to Innovate) to make sure that what we deliver works, is
    easy to use, has useful features, and does not have a high maintenance cycle.


    Delivering value and focusing on quality are self-explanatory. If we want to invest
    a lot of money in a new vehicle, a new house, or a new service, we will only consider
    spending our hard-earned money if we perceive the investment as valuable and of
    quality.


    ## Estimating and prioritization fundamentals


    1. Why should we care about estimation?


    Assume we decide that we want to walk from point A to point B (for example, Ladner
    to Tofino). The first thing we would typically do estimate the time it takes to
    walk this distance and break down the journey into manageable and measurable dimensions.


    Using our favorite search engine (see Figure 43), we get a view of the journey
    and an indication whether the adventure is viable. By changing the journey from
    Ladner to Whitehouse, Yukon, the search result would give us visual clues that
    we are heading for a potential disaster or would need to break down the journey
    into smaller and shorter excursions. We also get nonfunctional requirements and
    impediments, an estimation of effort.


    Figure 43. Hypothetical journey from Ladner to Tofino.


    ## Requirements estimations


    In the section "Planning", we use T-shirt sizes or story points to estimate the
    effort.


    ## Ideal estimations


    In an ideal world, we would estimate every functional and nonfunctional requirement.


    ## Normalized estimations


    For distributed, and (especially) part-time teams, we use a normalized estimation
    strategy based on:


    - Fibonacci sequence for (example, 0, 1/2, 1, 2, 3, 5, 8, 13, 21, and so on).
    When we are Planning Poker, 0 means no effort required and it is too complex or
    impossible to estimate.

    - Estimations are based on one developer/contributor and a tester/reviewer pair
    story. This implies that a story is not complete until we have developed and tested
    it and the story is ready to ship.

    - We estimate stories relative to the 1-story point reference story. A 13-story
    story should therefore take approximately 13 times as much (not time) to ship
    than the 1-story point reference story.

    - We estimate stories considered smaller than the 1-story point reference as/2.

    - Stories estimated at 21 or higher need to be broken into smaller stories.


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio 50 of
    151

