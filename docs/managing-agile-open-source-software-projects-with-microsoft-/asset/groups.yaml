  mdcn: "\n\n## 第 2 章：准备工作\n\n图 33 强调了我们运行在一个非典型的生态系统中。产生想法和主题的“组合层”（Portfolio level）是全球性的。实例化项目（飞行）的“解决方案层”同样是全球性的，其成员是基于兼职志愿者的热情、知识和时间投入而组成的地理分散虚拟团队。持续的演进使我们能够根据解决方案需求的增加和交付能力的要求不断适应和增长，而这两者都是生态系统和团队的需求。\n\
