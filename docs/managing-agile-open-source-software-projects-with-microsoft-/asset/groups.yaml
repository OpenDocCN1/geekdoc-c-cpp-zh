    例如，我们提议了“下一次迭代”列，允许团队将下一次迭代中涵盖的故事绘制到一个公共列中。“当前迭代”列包含在迭代中要处理的故事，而“等待评审”列识别了所有准备好进行测试、评审和验证的故事。这些列并没有引入新故事，但极大地提高了可见性和规划性。


    - （可选）使用图像、磁片和轻量级图表完善团队主页，以改进跟踪。


    ## 培训 . . . 从领域专家处学习新知识


    TRP 的第一支柱是团队的就绪概念，包括框架、架构和技术培训。


    - 框架培训确保所有团队成员和利益相关者理解所选的框架和方法论以及精益和敏捷思维的原则。

    - 架构培训确保所有团队成员理解底层解决方案架构——例如 .NET Framework——这有助于团队在相关架构上构建有价值的解决方案。

    - 技术培训完善了架构培训并提供专注的技术培训，特别是当团队使用早期采用技术（如预期状态配置 DSC）时。


    ## 研究……调查并对需求建模


    TRP 的第二支柱包括对技术、概念、功能性及非功能性需求的研究。我们必须投入研究并理解需求，减少不确定性，以便估计和计划随后的迭代以及可交付的解决方案。


    潜水员在开始搜索和救援之前，会研究设备、情况、条件和建议的潜水剖，以降低风险和搜索时间，并能够计划和交付成功的救援（图 42）。


    图 42。一次安全、愉快且成功的潜水始于研究和规划。


    ## 规划


    TRP 的第三支柱在结束时再次出现，重点是准确地规划和估计下一次迭代以及尽可能地规划随后的迭代。


    Martin Hinshelwood^49 引入了敏捷指标（Hinshelwood, 2014），如下：


    - 我们需要关注**价值（业务成果）**，以确保我们生产的是客户所重视的东西，同时不疏远员工或花费过多的资金来实现。

    - 我们需要关注**交付周期（上市时间）**，以确保我们可以将生产的有价值的事物快速、按顺序交付到客户手中。

    - 我们关注（**创新能力**），以确保我们交付的东西好用、易用、具有有用功能，并且没有高维护周期。


    交付价值和关注质量是不言自明的。如果我们想在一在一辆新车、一个新房子或一项服务上投入大量资金，只有当我们认为这项投资有价值且有质量时，才会考虑花费我们辛苦赚来的钱。


    ## 估计和优先级排序的基础


    1. 为什么我们应该关注估计？


    假设我们决定要从 A 点步行到 B 点（例如，从 Ladner 到 Tofino）。我们通常做的第一件事是估计步行这段距离所需的时间，并将旅程分解为可管理和可衡量的维度。


    使用我们最喜欢的搜索引擎（见图 43），我们可以获得旅程的视图，并判断冒险是否可行。通过将旅程从 Ladner 改为 Yukon 的 Whitehouse，搜索结果将给我们视觉线索，告诉我们正走向潜在的灾难，或者需要将旅程分解为更短的远足。我们还会获得非功能性需求和障碍以及工作量的估计。


    图 43。从 Ladner 到 Tofino 的假设旅程。


    ## 需求估计


    在“规划”部分，我们使用 T 恤尺寸或故事点来估计工作量。


    ## 理想估计


    在理想的世界中，我们会估计每一个功能性和非功能性需求。


    ## 规范化估计


    对于分布式和（尤其是）兼职团队，我们使用基于以下内容的规范化估计策略：


    - 斐波那契序列（例如：0, 1/2, 1, 2, 3, 5, 8, 13, 21 等）。当我们进行计划师扑克时，0 意味着不需要工作，且太复杂或无法估计。

    - 估计基于一个开发者/贡献者和一个测试人员/评审员的故事对。这意味着在我们开发并测试了故事并准备好交付之前，该故事是不完成的。

    - 我们相对于 1 点的参考故事来估计故事。因此，一个 13 点的故事交付所需量（不是时间）大约是 1 点参考故事的 13 倍。

    - 我们将比 1 点参考故事小的故事估计为 /2。

    - 估计为 21 或更高的故事需要拆分为更小的故事。


    使用 Microsoft Visual Studio 管理敏捷开源项目 50 之 151


