  mdcn: "\n\n## 投入功能功能\nINVEST 缩写词有助于管理所有者为团队确定的、用于投入解决方案下一个及可选未来功能的功能。\n\n| 属性 |\
    \ 描述 |\n| --- | --- |\n| 独立性 (Independent) | 自包含、松耦合且具有高内聚性。 |\n| 可协商性 (Negotiable)\
    \ | 在功能提交之前，我们可以对其进行重新谈判和修订。 |\n| 价值 (Valuable) | 功能必须增加价值。 |\n| 可估算性 (Estimable)\
    \ | 功能必须符合我们的估算策略。 |\n| 小巧 (Small) | 功能的大小必须切实际，并适应迭代节奏和发布里程碑。 |\n| 可测试性 (Testable)\
    \ | 功能必须有清晰的验收标准，我们据此创建测试用例并确认功能已完成。 |\n\n### 时间盒与限制进行中工作 (WIP) 我们发现，通过使用时间盒和限制进行中工作，我们可以减少项目管理的压力，并更明智地快速交付更小价值价值。始终记住权衡三角形。\n\
    \n> 每个飞行周期 1 到 3 个功能\n每个 Epic 定义的功能数量取决于每个功能的粒度。我们建议定义一到两个“必须具备”的功能，以及可选的一到两个“超出”功能。定义更多功能会干扰团队的注意力，增加协调复杂性，并引入范围蔓延的风险。\n\
    \n### 识别热情的所有者\n我们通常利用产品所有者 (Product Owner)、项目负责人 (Project Lead) 和计划经理 (Program\
    \ Manager)，必要时可以自由选择。根据我们的“自用产品”观察，我们建议：\n\n- 一个团队由一个或两个功能团队组成，最多七个功能团队成员。\n-\
    \ 项目负责人负责一个进行中的项目发布。\n- 计划经理负责一到三个进行中的项目发布。\n- Scrum Master 负责一到三个进行中的项目发布，并作为另一个\
    \ Scrum Master 及其相关团队的潜在应急备用。\n\n### 可见性是关键\n利用仪表板提供状态和趋势信息。\n\n## 准备就绪\n\n##\
    \ 宝石与清单\n\n培训、研究和规划 (TRP) 这些是我们项目成功的核心支柱。团队共享技术和需求；理解估算和优先级规划的基础。关注培训-研究-规划让团队能够理解并正式完善项目：\n\
    \n- 动机（为什么）\n- 愿景（什么）\n- SMART™ 目标\n- 功能\n- 验收标准\n- 完成定义 (Definition of done)\n\
    \n### 了解你的背景\n为了让团队加入，我们必须能够沟通最终目标并提供背景，以便团队成员能够参与冒险、分享理解并产生加入团队的动力。\n\n> 在会议前几小时发送会议背景让与会者做好准备是有价值的。通常，我们会分享\
    \ PDF 格式的启动幻灯片进行预览，以防电话会议基础设施出现问题导致会议中断。不要过早发送信息。否则，可能会影响与会者以及他们的优先级排序。\n\n###\
    \ A3 问题解决\n这种简单的技术可以帮助定义问题、现状、目标和预期结果。\n\n### 透明度\n整个团队都应该能够看到需求、计划和状态，以便团队成员保持投入，并致力于处理待办工作列表\
    \ (backlog)。\n\n### 基础设施\n我们需要规划人力基础设施以确保其有效运行。技术上，我们可能使用 TFSE 的任何实例或决定使用 Visual\
    \ Studio Online。无论如何，我们需要定义项目和团队布局，包括源代码。\n\n### 估算\n这些是最难计算的。参考第 2 章获取多种想法和场景。\n\
    \n### 依赖隔离\n减少依赖并隔离活动。松耦合和高内聚的团队减少了对其他团队成员和专业知识的依赖。减少依赖使团队或成员能够进行隔离工作。\n\n###\
    \ 快速交付\n尽快交付价值。专注于对用户具有高价值的任务，而不仅仅是尽快交付解决方案。优先关注最小部分并将延迟成本最小化！\n\n### 调查\n对于地理位置分散且可能不是每天面对面的团队，快速调查是一项很好的工具，有助于在团队见面时激发讨论，或在团队被阻塞时提供指导。\n\
    \n### 组织你的团队\n在启动会议之后，决定我们是否需要一个或多个功能团队。\n\n```\nMAX = (3-9)n + 2\n建议的团队规模是每个功能区域\
    \ (n) 6~9 名开发团队成员。此外，Scrum Master 和产品所有者跨越 Epic 确定的一个发布的所有功能区域。对于地理分布的团队，我们建议\
    \ n<2。\n```\n\n- TFS 规划与规避指南^95\n- 版本控制（分支与合并）指南^96\n\n## 模板：电子邮件\n\n## 启动（大纲）\n\
    \n收件人：@@\n主题：[ @PROJECTCODE ] - 项目 @PROJECT@ 启动活动\n你对 XYZ 有热情吗？这可能适合你的项目。\n我们将在\
    \ TIME/DATE 举行启动会议，鼓励你参加。\n\n项目构思\n简要描述。\n（如果有外部影响因素，请提供链接，例如 UserVoice）\n\n项目负责人\n\
    你的名字\n产品所有者 姓名\n任何已知的备用人员\n\n录像\n我们会录制本次会议，但非常希望你能在线参加启动会议。\n谢谢 - 你的名字\n\n## 启动议程（大纲）\n\
    \n- 议程\n- 介绍产品所有者、计划经理和 Scrum Master\n- 介绍问题和建议的解决方案\n    - 问题陈述\n    - 现状\n \
    \   - 目标\n    - 预期结果\n- 下一步工作\n\n## 发布规划（大纲）\n\n收件人：@@\n主题：[ @PROJECTCODE ] -\
    \ 项目 @PROJECT@ 发布规划\n\n## 动机\n强化为什么该解决方案非常重要。\n\n## 愿景\n强化解决方案意图构建的内容。\n\n## 路线图\n\
    强化解决方案何时需要实现里程碑。\n\n## 目标\n强化具体的、可衡量的、可实现的、现实的、基于时间的系列目标。\n\n## 非功能性需求 (NFR)\n\
    提及所有已知的非功能性需求，例如扩展性、可靠性等，我们在规划期间需要考虑。\n\n## 功能\n强化包含在解决方案中的想法和功能。\n\n## 流程\n强化团队使用的流程和框架，确保团队成员知道哪里寻找指导。\n\
    \n## 问题 (ASKs)\n总结团队从线下协作中产生的问题。最多七 (7) 个！\n\n## 链接\n总结指向团队主页、启动录像、文档、源代码控制和其他产物的关键链接。\n\
    \n谢谢 - 你的名字\n\n## 欢迎（大纲）\n\n收件人：@@\n主题：[ @PROJECTCODE ] - 欢迎来到 @PROJECT 团队\n\n\
    欢迎大家加入 @PROJECT 并关注培训-研究-规划 (TRP)\n\n感谢加入此项目！这将是一个具有挑战性的原型项目，但我们有一组明星团队，我预计将会有一个有趣的原型！许多人被分配到了其他项目，所以如果你有任何冲突或认为没有时间，请告诉我。\n\
    \n## 基础设施\n\n- 主页 @URL\n- TFVC @PATH\n- 标签 @TAG\n- 下载 @DL\n\n## 团队\n我们想介绍团队的每个人，以便我们互相熟悉：\n\
    \n### 核心团队\n- 成员列表\n\n### 贡献者角色\n- 成员列表\n\n### 评审者角色\n- 成员列表\n\n### 静默评审者角色（仍在参与其他项目的伙伴们）\n\
    - 成员列表\n\n## 下一步工作\n\n- 会议\n- 我们将在下周发送会议邀请进行小组讨论……在此期间通过电子邮件协作。\n- 我们将在 @month\
    \ 的最后一周发送会议邀请，规划 Scrum 系列并作为团队估算工作量。\n- 请审阅我们将在项目中使用的 Scrum 创新\n- 请阅读并理解我们这个原型的核心功能……我们以后可以做得更多：\n\
