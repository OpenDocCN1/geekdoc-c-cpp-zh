    ## 安排臭名昭彰的全球每日站会


    由于涉及不同的角色和不同的时区，一个分布式且兼职的团队为项目经理（PM）和 Scrum 主管（SM）的调度工作增添许多有趣的挑战。PM 或 SM 通常通过接手并推动这一挑战来支持项目负责人（PL）。


    随堂测验


    我们如何安排一次会议，让我们所有的团队成员都能在合理的时间会面一小时，并且可以在每周每日站会中重复进行？假设人员 1 号位于美国西海岸，2 号位于东海岸，3
    号在厄瓜多尔，4 号在瑞士，5 号在南非，6 号在巴基斯坦，7 号在新新西兰，8 号在澳大利亚（图 50）。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_66_0.png)


    图 50。随堂测试：多个时区，一个团队。


    如果我们按照温哥华时间周一上午 08:00 安排会议，那么其他团队成员将在周一的 10:00、11:00、17:00 和 20:00 参加，以及周二的凌晨
    01:00 和 03:00 参加。


    从这个简单的例子可以看出，安排一个符合人们高效工作时间的循环性每日站会，其挑战是显而易见的。


    虽然听起来可能像在老调重弹，但在理想的世界里，我们每天应该面对面进行几分钟的每日站会。然而，在分布式、兼职和基于志愿者的社区生态系统中，建议是安排一次“心跳”式的站会，时长至少为
    15 分钟，并可以根据需要选择扩展到 30 分钟。


    每日站会的意图是共享信息、讨论“国家状态”、在问题演变成熊火之灾之前解决问题和障碍，并管理范围及其衍生问题。参会人员包括 Scrum 主管（SM）、项目负责人（PL）、团队，以及可选的产品所有者（PO）和项目经理（PM）。


    ## 我们的流程和需求基础概述


    作为专注于培训-研究-规划的冲刺（s）的一部分，我们涵盖了解决方案需求中一个巨大且具有战略性的领域。这一切都是一个战略性想法，由少数几个功能定义，并通过故事（stories）实现。这是一个反思整体流程以及大部分需求的绝佳机会。


    ## 第 2 章：准备工作


    - 1. **史诗（Epic）**代表了社区和利益相关者提出的实现价值主张的想法。想法可能源于投资、投资主题、产品主题，或仅仅是一个绝佳的主意。

    - 我们在待办列表（backlog）中使用 Epic 工作项类型捕捉这些想法，并在想法筛选期间对其进行分拣。

    - 史诗以正式或项目列表的形式表达想法，其实实现细节包含在其依赖的功能（features）和故事（stories）中。

    - 我们不隐含地暗示或测试史诗。相反，我们通过功能来完成史诗，而我们反过来通过故事交付这些功能。

    - 史诗并不通过与其依赖的功能和故事相关的测试用例进行验证。


    - 2. **功能（Features）**模拟核心领域。作为想法的一部分，产品所有者识别并优先考虑几个功能，供团队在解决方案的下一次及未来的发布中投入。

    - 我们在想法待办列表中捕捉功能，并将其作为依赖子对象链接到父级。

    - 我们通过路径（path）将功能分配给解决方案的“飞行”（flight），并使用 VSO 上的迭代路径将其分配给解决方案“发布”（release）。

    - 功能的类型为目标、架构目标、过程目标或其他自定义目标。业务目标和架构目标在 SAFe™ 或 CMM 中很常见，用于识别架构基础设施、业务需求或用户体验。


    - 3. **故事（Stories）**描述了解决方案应该为业务或架构执行什么以实现涵盖的功能。作为计划的一部分，团队识别、估计并优先考虑几个故事，这些故事可能会被拆分为任务（Task）对象。

    - 我们在冲刺待办列表中捕捉故事，并将其作为依赖子对象链接到父级功能。

    - 我们通过区域路径（area path）和迭代或 VSO 上的迭代将故事分配给团队。

    - 故事使用看板板（Kanban board）或作为任务板上的依赖任务进行跟踪。

    - 故事的类型通常与其父项类型相同。在某些情况下，例如业务目标，可能需要功能和创新来实现架构或基础设施，在这种情况下，将会有多种类型的故事共同实现功能。


    - 4. **团队（Teams）**代表了热情的志愿者，他们负责运营基础设施、项目管理、作为功能团队进行自我组织，并通过定期的反思对他们的生态系统进行创新。

    - 我们有一个工程团队，负责运营基础设施、项目管理、部署和跨飞行协作。我们将每个解决方案飞行组织为一个或两个专注的功能团队——例如，指导团队和工具功能团队。

    - 团队的生命周期通常持续解决方案的一个飞行和发布。一个或两个团队的核心将演维护和所有团队，他们在解决方案发布后进行，并在后续飞行中启动功能团队。

    - 长期核心确保知识留存、增加学习、更准确的估计、更好的规划以及更少的上手浪费。


    图 51 显示了解决方案发布（飞行）的第一阶段以及史诗-功能-故事的层级和相关的工作项类型。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_68_0.png)


    图 51。通过功能和最优任务实现的章节。使用 Foundation Server (TFS)，我们可以像图 52 所示进行可视化。


    | 工作项类型 | 标题 | 状态 | 工作量 | 迭代路径 | 区域路径 | 标签 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 功能 | | 进行中 | | | | |

    | 待办事项 | 实现 scrum | 已提交 | 3 | Process2\Sprint1 | | | 业务目标 |

    | 待办事项 | 文档定制 | 已提交 | 2 | Process2\Sprint1 | | | 功能团队 |

    | 待办事项 | 创建故事 | | | Process2\Sprint1 | | | 业务目标 |

    | 待办事项 | 自动化流程 | 新建 | 5 | Process2\Sprint1 | | | 系统团队 |


    图 52。使用 Scrum 模板的示例。


    ## 未来展望……带信息的横幅跟踪


    今天项目的典型周期为三到四个冲刺，交付一个可发布的交付物。尽管团队成员仍然将工作拆分为可操作的详细任务，但我们观察到了频繁的异常：


    - 团队没有使用或跟踪任务。

