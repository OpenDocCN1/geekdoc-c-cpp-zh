    # Chapter 2: Getting ready


    This is no time for ease and comfort. It is time to dare and endure.

    —Winston Churchill


    We continue with simplicity and all clarity! It is time to gather as a team, understand
    the why and the what, and agree on the how. Looking back at a number of projects
    tackled by geographically distributed, volunteer, part-time teams, it is evident
    that the time and effort invested at this stage of a solution is invaluable. Teams
    that ''parachute'' into a project without a clear vision, objectives, or requirements
    quickly fizzle out as resources vanish, or worse, drag into never-ending nightmares
    with frustrating value drain. This phase is outlined in Figure 31.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_44_0.png)


    Figure 31. Lifecycle: Getting ready.


    # Training-research-plan (TRP)


    > GEM Know your destiny!

    As a scuba diver, you must plan your dive, limiting your maximum depth and time,
    and agreeing on the objectives. Unless you are on a military or search-recovery
    mission, the actual excursion is very agile. Yet everyone knows the plan. Everyone
    is in a position to mitigate changing environments and assist one''s friends in
    times of need.


    Each new project or release starts with training-research-planning and optionally
    ends with a focus on raising the quality bar and additional planning, as discussed
    in the section ''Raising the quality bar.''


    The introduction of training-research-planning and a quality-research focus will
    create a perception of a predictive waterfall-like process. With geographically
    distributed and part-time teams, many of members will never meet each other in
    person, it is imperative that we understand the idea and need features, and agree
    on the requirements, that the team be in a position to optimize the delivery time
    and reduce the value drain.


    The focus on training-research-planning can occur over either an entire or a partial
    sprint. With complex or new technology projects, a complete sprint is typical,
    whereas subsequent releases of the same usually require only a partial sprint.


    The training-research-planning focus allows the team to understand and optionally
    refine the project:


    - Motivation (why)

    - Vision (what)

    - SMART³ objectives (Wikipedia, SMART Criteria, 2015)

    - Features

    - Acceptance criteria (corresponds to customer expectations)

    - Definition of done (corresponds to what needs to be completed prior to handing
    off a feature)


    The sprint starts with a kickoff meeting, followed by research and training, and
    finally a sprint-planning meeting for the next and best-case estimates for development
    sprints.


    # It all starts with the kickoff!


    It is important to sell the concepts of the project idea to all stakeholders,
    which in our case includes every development team member. In addition, it is important
    to identify anyone who could contribute or whose needs must be satisfied to ensure
    that the solution is successful and valuable.


    The kickoff meeting delivers overview, drives consensus, and allows the team to
    reach an agreement and plan the next steps in a very short time.


    The meeting typically lasts 30–60 minutes and is facilitated by the Program Manager
    and Project Lead.


    > **GEM Provide context ... but not too early!** It is valuable to enable attendees
    to prepare by sending them for the meeting a few hours beforehand. Typically,
    we share the kickoff slides in PDF format for preview and in the event that the
    teleconference infrastructure acts up during the meeting. Do not send out the
    information too early. Otherwise, you may influence the attendees and their prioritization
    accordingly.


    A structured meeting allows everyone to engage and address any technical, business,
    or political concerns. It also ensures that stakeholders are fully committed and,
    most importantly, that we align everyone''s understanding of the idea, and the
    solution.

    Here''s a sample kickoff agenda:


    - Why Motivation and beneficiaries

    - What Vision, milestones, team leadership, and features

    - Plan Deliverables, channels, and process

    - Team Skills and contact details


    We have used a consistent, formal kickoff template for teams that have recently
    started investigating A3 Problem Solving–Applying Lean Thinking (Finchaugh, 2014).
    We need to select a strategy that suits us. There is no one size fits all.


    # Planning the meeting


    We start by filling the template for the kickoff meeting agenda. Work with the
    Product Owner, Project Lead, Program Manager, and the Scrum Master to flesh out
    the details, include out-of-the-box thinking and ideas, and agree on a date and
    time to host the kickoff meeting.


    > **GEM Respect family time!** Avoid scheduling meetings on Friday or weekend
    time zones because you will encroach on Friday evening family time. Where possible,
    schedule a morning and an afternoon repeat meeting, allowing your team to pick
    the most convenient meeting for their time zone.


    When working with part-time volunteers, give at least a week advance. Be sure
    that the invitation intends highly professional to emphasize the importance of
    both the kickoff and the solution. We get only once to entice volunteers to join.
    The energy and passion levels of a team directly relate to the stakeholders''
    energy when hosting the event.


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online

    42 of 151


    # Hosting the meeting


    The facilitator(s) of the event are responsible for ensuring the kickoff meeting
    is a roaring success. Within our context, this is typically the only time we are
    able to gather all stakeholders in a face-to-face meeting, teleconference, or
    combination thereof.


    If you are a facilitator, remember the:


    - Keep it simple!

    - Record the meeting so that attendees can view the recording offline.

    - Start and stop the meeting on time. We must respect everyone''s time.

    - Define the rules of engagement during the meeting—for example, when to track,
    facilitate and defer decisions, and keep notes of all decisions and ideas raised.

    - Keep everyone engaged but controlling stakeholders. Remember that English is
    not everyone''s native language and that some cultures will not interrupt (ever)
    out of respect.


    The last step of the kickoff meeting should be a simple go/no-go decision. Using
    Microsoft Lync, we can consider the two standard polls in Figure 32:


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_46_0.png)


    Figure 32. Kickoff meeting go/no-go and confidence polls.


    Before we end the kickoff, we make sure everyone is happy with the outcome of
    the meeting and knows what the next steps are.


    # Organizing the team


    After the kickoff, we consolidate the feedback and continue refining the Epic
    and the features for the project, while we assemble the team and decide whether
    we need one or two feature teams. To minimize degradation of value over time,
    it is important to ship value often and as soon as possible. It is important to
    realize that we can always raise the idea and a subsequent release, we can always
    do better next time, but we have only one chance each release.


    ```

    MAX = (3–9)n +2

    The recommended team size is 6–9 development members per feature area, plus the
    Scrum Master and Product Owner. For geographically distributed teams, we recommend
    n<=2.

    ```


    # Chapter 2: Getting ready


    We eagerly have to commit to the team, which often raises the dilemma of having
    many volunteers. See I volunteered for a project, but am booked on another voyage...
    for more information.


    One of the pillars of Lean thinking is respect for people. Be sure to keep the
    community and volunteers informed, never go dark, and promote the following conventions:


    - Do not despair! There is more than bandwidth!

    - Look for other opportunities!

    - Always listen for a call for help by email, at the coffee machine, or during
    discussions! All the part-time resources are unchanged by default, therefore changes
    are inevitable.

    - Team members never leave.

    - Team members can be spread across other projects.


    We send an email to the team members selected for the project. The message is
    similar to the example of the welcome email from the Security team.


    It is important to remember those not selected for the team in a professional
    and supportive manner, similar to the team-limit-reached example from the DevOps
    team.


    # Objectives


    The kickoff meeting not allows us to share the story but also to take a step back
    and ensure that we align all the stars perfectly. After the kickoff, everyone
    knows we are doing the project, who he or she needs to do, who will be responsible
    for what, and how confident the team is about succeeding. Most importantly, they
    know when they start and when they will need to complete the first potentially
    shippable release.


    # Team structure


    The team structure depends on a number of variables, which as the organizational
    structure, process, framework, and even the experience and preferences of individuals
    within the organization. (See Figure 33.) We are continuously analyzing, improving,
    and adapting the process and team structure in line with kaizen(continuous improvement
    and reflection). Let''s explore an overview of our ecosystem and team structure.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_47_0.png)


    > ³⁹ http://aka.ms/fc6d28

    ⁴⁰ http://en.wikipedia.org/wiki/Kaizen


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online

