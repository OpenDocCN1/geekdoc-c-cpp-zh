    ## Appendix B: Eating your dogfood is key


    - The most efficient and effective method of conveying information to and within
    a development team is face-to-face conversation.

    - Working software is the primary measure of progress.

    - Agile processes promote sustainable development. The sponsors, developers, and
    users should be able to maintain a constant pace indefinitely.

    - Continuous attention to technical excellence and good design enhances agility.

    - Simplicity—the art of maximizing the amount of work not done—is essential.

    - The best architectures, requirements, and designs emerge from self-organizing
    teams.


    At regular intervals, the team reflects on how to become more effective and tunes
    and adjusts its behavior accordingly.


    ## Lean


    Lean software development is a translation of Lean manufacturing and Lean IT principles
    and practices to the software development realm as adapted from the Toyota Production
    System.¹¹¹ The following are the Lean principles:


    - Eliminate waste

    - Build quality in

    - Create knowledge

    - Defer commitment

    - Deliver fast

    - Respect people

    - Optimize the whole


    *Eliminate waste* is at the top of the list because how software development has
    the most potential for changing software. Addressing and eliminating waste provides
    the greatest opportunity to reduce costs and increase the effectiveness of the
    solution under development (Table 12).


    | Manufacturing | Software development |

    | --- | --- |

    | In-process inventory | Partially done work |

    | Overproduction | Extra features |

    | Extra processing | Relearning |

    | Transportation | Handoffs |

    | Motion | Task switching |

    | Waiting | Delays |

    | Defects | Defects |


    Table 11. Seven Wastes.


    ## Scrum


    Scrum has been around for some time now, and experience teaches us that while
    it is easy to understand, it is challenging to implement. We do not declare that
    we are strict Scrum teams. As we have written before, we are in many ways anti-Scrum,
    as we are not colocated and we are not full-time. However, there are process gems
    that of value to our teams, and we use what facilitates and enables our teams
    to ensure frequent and consistent delivery of quality solutions (Table 12).


    > ¹¹¹ Mary and Thomas Poppieck, Implementing Lean Software Development (Addison-Wesley,
    2007)


    | Scrum recommendations | Adaptation |

    | --- | --- |

    | Product Owner owns backlog | Product Owner owns backlog |

    | Team completes work in sprints | Team completes work in sprints |

    | Daily "scrum" for 15 minutes to assess progress | Daily "scrum" for 15 minutes
    to assess progress |

    | Scrum Master keeps team focused | Scrum Master keeps team focused |

    | Each sprint delivers potentially something | Each sprint delivers potentially
    something |

    | Each sprint ends with review and retrospective | Each sprint ends with review
    and retrospective |

    | Team is typically full-time and colocated | Team is typically full-time and
    colocated |


    Table 12. Comparing Scrum recommendations.


    ## Kanban


    Kanban is a method for process improvement. Initially, we used Kanban for software
    development to identify bottlenecks and reduce waste. In software development,
    Kanban focuses on flow. The goal is to maximize the flow of value from the development
    team to the customer.


    ## Visualize the workflow


    Visualizing the workflow is essential for understanding how work moves through
    the system. By using a Kanban board, we can see where work is getting stuck. This
    helps us to identify and address bottlenecks.


    ## Limit work in progress


    Limiting work in progress (WIP) is a key principle of Kanban. By limiting the
    amount of work, we can reduce context switching and improve our focus. This also
    allows us to finish tasks faster.


    ## SAFe


    Scaled Agile Framework (SaFe) is a framework for scaling Agile practices across
    organizations. It provides a set of tools and practices to help teams work together
    more effectively. We have used SAFe to manage our larger software projects.


    ## Using tools wisely


    Using the right tools is important for success. We have found that some tools
    can help us improve our process. However, we must be careful not to use tools
    that do not add value.


    ## Team Foundation Server


    Team Foundation Server is a tool for managing software development projects. It
    provides a wide range of features that help us track our work, manage our code,
    and collaborate. We have found that Team Foundation Server is very helpful for
    our needs.

