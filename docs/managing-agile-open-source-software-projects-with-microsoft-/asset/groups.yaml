    The core themes of the focus on quality and planning (QP) are to raise the quality
    bar and plan to the future. In addition, the team may use this opportunity for
    additional research, innovation, and hackathons for the future.


    # What it is not


    It is important that every team has a discussion to understand what the focus
    on quality and planning is not.


    +   - It is not a dumping ground for technical debt, such as code refactoring,
