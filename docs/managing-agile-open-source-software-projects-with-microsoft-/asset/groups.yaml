    of us know a "movie critic" persona who has anything positive to say about any
    movie, a "technology critic" for whom technology is good enough, who has a million
    and one things that can go wrong.


    Not all critics are "critical chickens! Team members who feel accountable for
    the success of the project deliver and constructive feedback and are then engaged
    in finding a resolution. They know that they cannot succeed if the team fails
    ...we rise or fall as a team!


    With distributed, part-time, and (especially) volunteer-based teams and community
    projects, critical chickens are poisonous and must be nudged off the release "flights."


    # Dogfooding case study: Trie quadrant


    Visualizations are key, and different stakeholders react "positively" to different
    views.


    # Background information


    In Triage of ideas, we introduced the ideas triage and associated visualizations
    that our community is familiar with. If we assume we have 19 hypothetical projected
    items, titled A-S, we get the following raw view by using the sample triage workbook.
    Based on the size, business value, and priority as defined by the stakeholders
    from the ALM community and ALM Rangers, we clearly see in Figure 77 that the two
    top ideas are A and B.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_96_0.png)


    Figure 77. Raw view.


    Wouter de Kort78 commented, "the one we used to use. I like it that it''s very
    easy to see the relative value," when we reviewed a number of potential visualizations.
    He also said, "What could help is split the bar in two colors for community value
    and PG value," but more on that later.


    # The quadrant experience


    The consolidated triage workbook introduces a new quadrant visualization, which
    we dogfooded for a while. The view is generated after our PMs have normalized
    the raw data, collaborating with product group PMs and other stakeholders. The
    intention is to position each idea in one of four quadrants: Community, product
    group, win-win or reject. The quadrant that contains the real gems is top right,
    which has a high community and product group value ... a win-win. We notice in
    Figure 78 that both idea A and B are included, as well as E, which received a
    confidence boost during the raw data normalization.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_97_0.png)


    Figure 78. Quadrant view


    When we turned the view above into a stacked view (Figure 79), Wouter de Kort79
    was happy: "That’s what I meant. Helps in understanding the position of an item.
    Also shows what the PG likes."


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_97_1.png)


    Figure 79. Stacked view.


    Be careful not to introduce fancy looking but noisy and low-value visualizations
    such as those in Figure 80. We collaborate with stakeholders and determine what
    works and what does not. We conclude this case study with more visualizations,
    for which Wouter de Kort commented, "Hard to read."


    > 79 http://aka.ms/vsar-wdk


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio 94 of
    151


    # Key learnings


    -   - It is key to adopt an iterative lifecycle pattern that is natural to the
    team.

    - By having weekly team scrums, the team is fully aware of the status of the project
    and any impediments. This raises the visibility and overall transparency of the
    project.

    - A regular scrum of scrums, once every sprint, assists with transparency and
    helps everyone of the flight vision and motivation, but it also helps to bubble
    up any questions and dependencies with other flights and teams.

    - With distributed and part-time teams, automation can reduce lead and dependency
    times and enforce a level of consistency. This allows team members to focus on
    what they do best.

    - It is important that teams continuously reflect, improve, and recognize the
    accomplishments of the team. Trust and transparency are the key.

    - With shorter sprints, the team can ship more quickly, which will reduce waste
    and keep team passions high.


    # Chapter 4: Raising the quality bar


    > Now is not the end. It is not even the beginning of the end. But it is, perhaps,
    the end of the beginning.

    > Winston Churchill


    We complete our roadmap and associated release flight by raising the quality bar
    and planning the future (Figure 81). This is an opportunity for team members to
    innovate, plan, and reflect on the themselves, and the overall process in order
    to support continuous improvement. It provides the time to complete activities
    often forgotten or postponed critical development and testing phases, especially
    with geographically dispersed and part-team projects.


    training, research & planning


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_99_0.png)


    Figure 81. Lifecycle: Quality and planning.


    # Quality and planning (QP)


    At the end of every sprint, we ship a working solution and offer evidence that
    we are making progress. The idea is to release early and be in a position to react
    to business. The intention is to position each idea in one of four quadrants:
    Community, product group, win-win or reject. The quadrant that contains the real
    gems is top right, which has a high community and product group value ... a win-win.
    We notice in Figure 78 that both idea A and B are included, as well as E, which
    received a confidence boost during the raw data normalization.


