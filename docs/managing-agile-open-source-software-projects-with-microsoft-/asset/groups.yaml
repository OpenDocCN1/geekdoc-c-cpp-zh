    # Chapter 1: Triage of ideas


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_26_0.png)


    Figure 10. Triage cadence and project overlap.


    # A maximum of five concurrent flights (for us)


    +   - Complexity, duration, and personal involvement influence the in-flight limits,
    also known as work-in-process (PIP) limits.

    - More than five (5) projects that are in parallel place undue strain on our two
    (2) Program Managers (PMs), require increased coordination and context switching,
    and drain the community passion.

    - You will need to experiment and refer this guidance to suit your PMS.


    When the triage is finished, you should have an ordered list of potential ideas.
    There be no doubt solution ideas are critical, which are important, and which
    would be "nice" to consider.

    At this point, we know what we should be considering for our next project adventures.
    The next step is to determine who will be the driving force behind the projects.


    # To be successful we need passionate stakeholders


    Experience has shown that distributed, part-time, and virtual teams thrive with
    committed and passionate stakeholders (for example, the Product Owner, Program
    Manager, and Scrum Master) who deliver guidance, direction, and a "pulse" that
    keeps the team spirit alive. Without these, the team eventually transforms into
    a black hole and dies, or it continues to trouble through space without any noticeable
    progress. The team will reflect the stakeholders'' passion or lack thereof.


    # Identify passionate owners


    With distributed, virtual, and part-time teams, three personas are pivotal to
    the success of the project. Scrum typically defines a team that consists of a
    Product Owner (PO), a Scrum Master, and the rest of the team. We recommend two
    additional owners, namely a Project Lead (PL) and a Program Manager (PM).

    How you raise the visibility of the idea to identify these champions depends on
    you and your ecosystem. An approach we use is shown in Figure 11.


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio


