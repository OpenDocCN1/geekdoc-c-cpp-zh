    ## 第3章：构建工作解决方案


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_76_0.png)


    图 62。冲刺内部及作为冲刺的重复。


    插图显示路线图包含了提到的七个动作，并被分为最初关注 TRIP、一个或多个 DEV 冲刺，以及最后对质量和计划的关注。每个冲刺包含相同的七个动作。每个迭代生命周期都有起点（我们从某处过渡过来）和终（我们过渡到另一个地方）。


    步骤 2 是遵循敏捷管理生命周期。我们不使用详细的设计规范工作，而是使用封装在特性（features）和故事（stories）中的“愿望列表”。团队负责以迭代的方式详细说明整个解决方案的需求，并在迭代内部冲刺的过程中可能演变为详细的描述和验收标准。


    Scrum 导师（SM）与项目负责人（PL）及产品负责人（PO）协作，负责指导和引导团队完成这段迭代旅程。使用基础检查清单可以进一步帮助每个冲刺的一致性迭代：


    - 与 PO 的预期以及目标和需求保持一致。

    - 随着需求的演变，审查并重新调整积压工作（backlog）特性/故事的优先级。

    - 验证所有故事都关联到一个父特性，所有特性都关联到一个父 Epic（构想）。

    - 鼓励团队进行反思、创新，并通过冲刺和发布演示展示他们所做的工作。眼见为实！

    - 控制范围蔓变（scope creep），否则团队无法像路线图那样承诺进度或资源。


    使用 Microsoft Visual Studio 管理敏捷开源软件项目


    团队、项目负责人和产品负责人必须共同协商与原计划和目标的偏差以及承诺。在冲刺期间，范围必须保持静态，以便团队的关注以及对整体航程和冲刺的承诺变得可行。如果我们必须在重新开始带有修订的承诺之前调整范围，我们就会中止正在进行的冲刺。


    ## 冲刺目标是交付物


    团队根据与利益相关者协商的资源、特性和目标承诺冲刺。在每个冲刺结束时，我们计划后续步骤，并客观地精炼项目路线图、目标、特性和资源配置。精炼之后，团队重新连接，在此之后权衡三角（资源、特性和路线图）在冲刺期间保持完好。


    这些目标不是“大棒”，也不是“营销噱头”。团队仪表板上刻画的航程/项目目标通常被继承为冲刺目标，或根据每个冲刺所选故事进行选择，如图 63 所示。


    ## 目标


    ### 故事


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_77_0.png)


    图 63。基于目标的冲刺待办列表。


    目标强化了我们为什么要这个项目、需要做什么、谁负责什么，以及团队对成功的有多大信心。我们确保在仪表板、沟通中以及每个 scrum 开始时展示它们以强化这些目标。


    ## 每周（或双周） scrum


    团队已经承担了责任并开始开发，并在面对面的、同地的团队环境中主动协作，这鼓励了信息的共享以及根据需要随时走到白板前。在我们经历的地理分布式、兼职和基于志愿者的团队环境中，共享状态、管理工作队列、对障碍采取行动以及查看质量标准的需求变得至关重要。


    团队的透明度基于 scrum 会议，也称为团队的“心跳”或“脉搏”。通常，在我们的生态系统中，每日仪式是每周（推荐）或双周一次的活动，由 15 分钟的状态审查和一个可选的
    15 分钟讨论环节组成。


    ## 每周心跳“岩石”


    对于地理分布、兼职和虚拟团队，建议进行遵循 15+[15] 分钟时间块的每周 scrum。


    以下是推荐的 scrum 会议拆分和流程：


    0–15 分钟：**状态**

    - 依靠视觉信息（如燃尽图/burnout chart）与团队共享整体状态。

    - Scrum 导师询问团队是否有人需要先来，然后与团队其余成员进行迭代（例如，按字母顺序）。

    - 每位团队成员分享了自上次 scrum 以来做了什么、正在做什么以及将要做的什么，以及（如果有的话）阻碍因素。Scrum 导师确保讨论保持在领域/执行/障碍的边界内，并对所有其他讨论记录在可选的
    15 分钟问答中。

    - 审查所有障碍，包括之前的和新的。


    16–30 分钟：问答


    如果没有要讨论的话题，scrum 会议在状态更新后结束。在可选的 15 分钟问答期间，团队成员可以选择留下参与讨论或离开会议。


    **那些无法参加 scrum 的人怎么办？**


    无法参加 scrum 的团队成员必须通知团队并分享他们的心跳（已完成、进行中、障碍），最好在 scrum 之前，但必须在 scrum 后的收务工作完成之前完成。未显示心跳的成员被称为僵尸！


    ## scrum 后收务工作


    scrum 状态、障碍、讨论记录、当前待办和视觉辐射器（仪表板、图表）会更新并与团队所有利益相关者共享。记住，透明度是关键！团队如何以及在哪里保留 scrum
    记录并不重要，我们可以使用 scrum 桶来存储这些记录。（见图 64。）


    ## 产品积压图表


    | ID | 工作项类型 | 积压优先级 | 标题 | 分配给 | 状态 | 剩余 |

    |---|---|---|---|---|---|

    | 8941 | 特性 | | Azure  TFS | Mario | 进行中 | |

    | 9350 | 积压项 | | Azure TFS 计划 | Willy Peter | 已承诺 | |

    | 9397 | 积压项 | | 每日站会 | Jah | 已承诺 | |

    | 9468 | 任务 | | 2013-12-27 | Willy Peter | 已完成 | |

    | 9503 | 任务 | | 2014-02-05 | Willy Peter | 已完成 | |

    | 9552 | 任务 | | 2014-02-19 | Willy Peter | 已完成 | |

    | 9558 | 任务 | | 2014-02-26 | Willy Peter | 已完成 | |

    | 9658 | 任务 | | 2014-03-27 | Willy Peter | 已完成 | |


    图 64。用于用户 PM 的 scrum 任务。


    最后，我们需要发送团队邮件提醒他们在哪里找到记录以及任何需要采取的特殊行动（行动）。查看安全团队的 scrum 记录（示例）邮件。


    ## 每周还是双周？


    对于兼职和地理分布的团队，我们强烈建议进行每周 scrum，以确保我们有定期的节奏、透明的进展和障碍视图，以及调整和修正路线的能力。在随后的冲刺中，如果每周会议成本超过了团队价值，我们会考虑双周一次。


    ## Scrum scrum


    基于 scrum scrum 技术，scrum scrum 是每个冲刺一次的会议，指派代表汇报团队状态、后续步骤和障碍。代表通常是项目负责人（PL）或 Scrum
    导师，他们也会分享状态，更重要的是与其他航程和团队提出问题和依赖关系。


    > 定期的心跳“岩石”

    > 对于地理分布、兼职和虚拟团队，我们建议每个冲刺进行一次 scrum scrum，每个团队遵循 2–3 分钟的时间框。


    我们使用每个团队一张幻灯片的演示（图 65）来展示 2 到 3 分钟的团队更新，然后切换到可选的问答讨论。


