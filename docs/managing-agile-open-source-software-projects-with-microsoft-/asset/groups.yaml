    Tooling Guides;82 Visual Studio Testing Tools.83 and the Better Unit Testing using
    Microsoft Fakes an e-book software testing section within the Visual Studio ALM
    Rangers, 2014.


    While there is a place for manual testing, test automation allows teams to run
    more tests, more often and continuously. Carefully evaluate and select the testing
    that suits your team and investigate this: When to Test Manually and When to Automate.84


    # Why unit testing is important


    When someone asks why unit testing or testing in general is important, ask whether
    they believe it is important to thoroughly test commercial space probes, frequently
    when travel across vast space, before each flight. Is it important that the probe
    of space is flight tested? Okay, now it is important that the navigation system
    is itself well tested? The navigation system of space probe is an example of unit
    testing. However, the navigation system does not guarantee the probe will fly,
    but the probe really cannot travel without it.


    Climate Orbiter.85 the unfortunate crash with the metric system and subsequent
    crash of the ~$125 million Orbiter, is a stark reminder that testing and continuous
    analysis of metrics is invaluable.


    The importance of testing begins at the start of the project and continues throughout
    the application lifecycle. Testing is what we are striving for:


    +   * Higher-quality code from the start

    * Fewer bugs

    * Self-describing code

    * Reducing the cost of fixing bugs by fixing them earlier rather than later


