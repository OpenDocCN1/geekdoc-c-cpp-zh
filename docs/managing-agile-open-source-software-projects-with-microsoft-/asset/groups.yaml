    ## Shippable release


    The question of a release is shippable is easier to answer than when we should
    release.


    ## When is a release shippable?


    Simple! When we get the "thumbs up" signal from the Product Owner, we have a shippable
    release.


    We base this simplicity on the assumption that the Product Owner defined, owned,
    and tracked the vision, objectives, acceptance criteria, and features on the backlog.
    A successful flight and landing requires an on-going participation in scrum meetings,
    show-what-we-have-demonstrations, and accepting the sprint deliverables from the
    Product Owner (Figure 87). This is usually a primary role execution in solution
    lifecycles; actual involvement may be sporadic, part-time, and require a lot of
    support from the Program Manager and trust in the overall team for geographically
    distributed, part-time, community projects.


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio

    101 of 151


    ## Chapter 4: Raising the quality bar


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_105_0.png)


    ## TAKING OFF INFLIGHT LANDED


    Figure 88. Simplistic view of Product Owner''s involvement during a part-time
    flight.


    As we''ve discussed earlier, the Product Owner determines the ① features and owns
    ② tracks the objectives, acceptance criteria, and scope, ③ tracks and collaborates
    with the team during 1–3 development sprints, and ④ accepts the quality bar. In
    addition, the Product Owner may defer features and associated stories or remove
    them from the scope entirely while dearing up for the release.


    The Product Owner "owns" the release before takeoff, during its flight, and after
    landing. It is a critical role and often referred to as the "soul" of the project.
    The "bits and bytes" stop with the Product Owner! No "soul," no "pulse," means
    no shippable release.


    Step ③ is ceremonial which we will discuss shortly.


    ## When should we release?


    The more difficult question, and the reason we pause after step ⑤ in the previous
    diagram, is when we do land the flight to "ship"? At this stage, our team is ready
    to ship, confidence is high, and excitement is rising with the ominous drumroll.


    The next important responsibility of the Product Owner is to synchronize with
    the stakeholders and ensure that the landing will have an optimal impact for the
    organization and community. Some of the important considerations include:


    - The system-support team is ready and capable of supporting the new release.

    - The release will not have a negative impact on any other imminent release.

    - The community is not currently swamped with events or other product releases.

    - The community is not overwhelmed with too frequent and too many releases.


    Optimally, the "when" is before or coincides with the end of the sprint (Figure
    88).


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online

    102 of 151


    ## Chapter 4: Raising the quality bar


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_106_0.png)


    Figure 88. The sooner the team has a shippable release, the sooner it can focus
    on innovation and planning.


    As shown, we have three options for the Product Owner: ① ship early (optimal),
    ② ship on time, or ③ postpone and place the flight into a holding pattern if the
    sprint is not optimal.


    ### Do we ship a beta or a RTM?


    In **Deliver on silent releases**, we discussed the concept of one or more silent
    releases of a beta. This is a good time to take a deep breath, take a step back,
    and look at the very maturity milestones used by our development teams (Figure
    89 and Table 10).


    We view the milestones and the workflow as a practical example, not as practical
    guidance, as you need to define a workflow that works for you and your environment.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_106_1.png)


    Figure 89. Solution milestones.


    | Milestone | Description | State of the nation |

    | --- | --- | --- |

    | Raw | Referred to all activities performed during research and prototyping,
    typically performed during the sprint(s) | Unknown |

    | Prealpha | Referred to all activities performed during development sprints |
    Unknown |

    | Alpha | The first phase in which we begin testing and reviews | Unstable, feature
    incomplete |


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online

    103 of 151


    ## Chapter 4: Raising the quality bar


    | Milestone | Description |

    | --- | --- |

    | Beta "silent" | This phase is when the solution is feature but infested with
    bugs. While working on bug resolutions and overall improvements, the team may
    decide to release internal-only, private beta to expose to selected audience.
    |

    | Beta "public" | The Product Owner signs off on the quality bar and acknowledges
    that the solution is ready for public beta. The intent is to show and get real
    feedback. |

    | RTM | The release to manufacturing (RTM) or "golden CD" is the milestone when
    the team has completed all activities, improved quality as much as possible, and
    resolved all bugs. As with the public beta, the solution is shown. |


    Table 10. Maturity milestones.


    Now that we have a better understanding of the milestones, we can return to the
    question: "Do we ship a beta or an RTM?"


    It depends if the Product Owner is happy to sign off on the solution and if all
    the requirements, landing an RTM is the preferred option. If, however, the quality
    bar has met, the Product Owner is happy to sign off, but there are still ongoing
    activities, we consider a public beta. This puts us in a position to show the
    project as "landed" and release resources to other adventures.


    ## "Ship-it" or "landing" preparations


    There is no way to predict exactly when and how a flight will land. To be honest,
    there is no real need to predict accurately for part-time community projects;
    just ensure the team is ready to ship when the Product Owner gives the signal.
    Proactive precautions we include as part of a sprint focused on quality and planning
    includes:


    - Prepare the announcement

    - Prepare the release vehicle, for example on GitHub including the home page and
    downloads package.

    - Prepare the team to be in a position to monitor and receive feedback, issues,
    and other events.

    - Validate that announcements and documentation method create all team members.

    - Validate that all processes—that is, the essentials—are ready for completion.

    - Gather and analyze flight metrics to reflect, learn, and improve predictability.


    Once the team starts to relax and "idle," we are in a good position to spin up
    parallel activities to innovate and for the future. See "General templates" for
    an example of a checklist.

