  - '[PAGE 117]


    # Getting ready


    # Gems and checklists


    Training, research, and planning (TRP) These are the core pillars of success for
    our projects. The team share the technologies and requirements; understand estimation
    and prioritization planning fundamentals. The focus on training-research-planning
    allows the team to understand and officially refine the project:


    +   - Motivation (why)

    - Vision (what)

    - SMART™ objectives

    - Features

    - Acceptance criteria

    - Definition of done


    Know your context To get a team onboard, we must be able to communicate the end
    goal and provide context so that team members can engage in the adventure, share
    the understanding, and be motivated to join the team.


    > It is valuable to enable the attendees to prepare by sending them context for
    the meeting a few hours beforehand. Typically, we share the kickoff slides in
    PDF for preview and in the event that the teleconference infrastructure acts up
    the meeting. Do not send out information early. Otherwise, you may influence the
    attendees and their prioritization accordingly.


    A3 problem solving This simple technique can help define the problem, current
    situation, objectives, and target outcome.


    Transparency The whole team should be able to see the requirements, plan, and
    status so that team members remain engaged and committed to working through the
    backlog.


    Infrastructure We need to plan our human infrastructure to ensure that it works
    effectively. Technically, we may use any instance of TFSE or decide to use Visual
    Studio Online. Regardless, we will need to define the project and team layout,
    including source code.


    Estimations These will be the most difficult to calculate. Refer to Chapter 2
    for several ideas and scenarios.


    Dependency isolation Reduce dependency and isolated activities. Loosely coupled
    and highly cohesive teams reduce dependency on other team members and specialized
    knowledge. Reduced dependency enables teams or members to work in isolation.


    Ship quickly Ship to the value as soon as possible. Focus on tasks that are of
    high value to users, not just shipping solutions as soon as possible. Focus on
    the smallest first and minimize cost of delay!


    Surveys For the teams that are geographically dispersed and may not meet every
    day, a quick survey is a great tool to help stimulate discussion when the team
    meets or to provide guidance if a team is blocked.


    Organize your team After the kickoff meeting, decide whether we will need one
    or multiple feature teams.


    ```

    MAX = (3-9)n + 2

    The recommended team size is 6~3 development team members per feature area (n).
    Moreover, the Scrum Master and Product Owner span all feature areas of the one
    release identified by the Epic. For geographically distributed teams, we recommend
    n<2.

    ```'
