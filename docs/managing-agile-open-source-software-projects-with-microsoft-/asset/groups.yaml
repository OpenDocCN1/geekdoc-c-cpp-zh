    # Chapter 1: Triage of ideas


    +   - The area path identifies the solution (flight)—example, \varDevOps defines
    DevOps hybrid solution, which contains a guidance, tooling, and pattern team.

    - The business value uses Fibonacci numbers²⁹ (Wikipedia, Fibonacci number 2015)
    to estimate the value of relation to the objectives and other features.

    - The iteration identifies the point in time when the team should start the feature—example,
    \FY14 indicates that the team should implement the feature during the 2014 financial
    year.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_32_0.png)


    Figure 15. An epic is broken down into features.


    Looking at the hierarchy of an epic (idea), associated features, and one ranked
    from the ALM Readiness Roadmap map for the version 3, it is evident that both
    the features and their value (BV) relative to the objectives (Epic).


    | Type Tag | Epic | 1* | Feature |

    |---|---|---|---|n| Source Tag | | 0,1 | |

    | Title | | | |

    | Description | Idea name | | Description Feature info |

    | Area Path | triage | | triage |

    | Iteration | | | start sprint |

    | Priority | | | PO priority |

    | Bus. Value | $ Votes | | PO ranking |

    | Effort | | | Team(s) estimate


    Figure 16. example readiness treasure map for features.


    # One to three per feature


    The number of features defined per Epic depends on the granularity of each feature.
    We define one to three "must have" features and optionally one to two "exceeded"
    features. Defining more features disperses the team''s focus, coordination, and
    introduces the potential of scope creep.


    # Roadmap


    Now that we have proposed motivation, vision, category, and features, we can talk
    about the roadmap that defines one or more teams will realize the idea. As discussed
    in "One maintainable environment," we use shared sprints (iterations) for all
    our teams. The gray-haired users use the MSF tradeoff, which states that if we
    fix one side of the triangle (the schedule, for example), changing the second
    side of the triangle (features) will affect the third side (resources). Therefore,
    when we schedule or for-roadmap, any increase in scope implies that we need more
    resources. A reduction of resources means we will reduce scope. Figure 17 illustrates
    the trilogy.


    The second scenario (a reduction of resources) is common in our part-time, volunteer-based
    community and project teams.


    > ²⁹ http://en.wikipedia.org/wiki/Fibonacci_number


