    # Chapter 4: Raising the quality bar


    | Milestone | Description |

    | --- | --- |

    | Beta "silent" | This phase is when the solution is feature but infested with
    impediments and bugs. While working on bug resolutions, stabilization, and overall
    quality improvements, the team may decide to release one or more internal-only,
    private beta releases to expose the solution to a selected audience and get real-world
    feedback. | Stable, feature complete, and unlikely to crash. |

    | Beta "public" | The Product Owner signs-off on the quality bar and acknowledges
    that the solution is complete and ready for a public beta. The intent of a public
    BETA is to release the solution as it is shown and as shipped. Potential users
    are aware that they are entering territory and there could be no üçün changes.
    | Minimum quality bar met. |

    | RTM | The release to manufacturing (RTM) or "golden CD" is the milestone when
    the team has completed all activities, improved quality as much as possible, and
    resolved all bugs assigned to the release. As with the public beta, the solution
    is shown and as shipped. | Minimum quality bar met or exceeded.


    Table 10. Maturity milestones.


    Now that we have a better understanding of the milestones, we can return to the
    question: "Do we land a beta or an RTM release at the end of the sprint focused
    on quality and planning?"


    It depends if the Product Owner is happy to sign off on the solution and if all
    the requirements, landing an RTM is the preferred option or at the end of the
    sprint. If, however, the quality bar has met, the Product Owner is happy to sign
    off, but there are still ongoing activities, we consider a public BETA at the
    end of the sprint. This puts us in a position to show the project as "landed"
    and release resources to other adventures. The remaining activities can then be
    covered by a skeleton team, as which public beta is replaced with the RTM with
    minimal ceremony.


    We frequently use the public beta strategy with guidance points if the copywriting
    is bottlenecked or expected to take longer than the sprint. This may not be an
    ideal or typical scenario, it enables the team to deliver to the community.


    # "Ship-it" or "landing" preparations


    There is no way to predict exactly when and how a flight will land. To be honest,
    there is no real need to predict accurately for part-time community projects;
    just ensure the team is ready to ship when the Product Owner gives the signal.
    Proactive precautions we include as part of a sprint focused on quality and planning
    includes:


    +   - Prepare the announcement

    - Prepare the release vehicle, for example on CodePlex including the home page
    and downloads package.

    - Prepare the team to be in a position to monitor and receive feedback, issues,
    and other events.

    - Validate that announcements and documentation method and create all team members.

    - Validate that all processes—that is, the essentials—are ready for completion.

    - Gather and analyze flight metrics to reflect, learn, and improve predictability.


    Once the team starts to relax and "idle," we are in a good position to spin up
    parallel activities to innovate and for the future. See "General templates" for
    an example of a checklist.'
