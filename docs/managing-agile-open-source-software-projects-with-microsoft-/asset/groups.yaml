    ## Chapter 3: Building the working solutions


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_76_0.png)


    Figure 62. Repetition within and as sprints.


    The illustration shows that the roadmap contains the seven actions mentioned and
    is broken down into an initial focus on TRIP, one or more DEV sprints, and a final
    focus on quality and planning. Each sprint contains the same seven actions. Every
    iterative lifecycle has a beginning to which we transition from somewhere and
    an end where we transition to somewhere else.


    Step 2 is to follow the Agile Management lifecycle. We no work with detailed design
    specifications but "wish lists" encapsulated in features and stories. The team
    is responsible for elaborating the requirements for the overall solution in an
    iterative manner and probably evolving a detailed description and acceptance criteria
    while iterating through the sprints within.


    The Scrum Master (SM), in collaboration with the Project Lead (PL) and Product
    Owner (PO), has the responsibility of mentoring and guiding the team through this
    iterative journey. The use of a basic checklist can further assist the consistent
    iteration through each sprint:


    - Align with expectations of the PO and objectives and requirements.

    - Review and reprioritize backlog features/or stories as requirements evolve.

    - Verify that all stories are associated with one parent feature and all features
    with one parent Epic (idea).

    - Encourage the team to reflect, innovate, and show what they have done with a
    sprint and release demo. Seeing is believing!

    - Contain scope creep, otherwise the team cannot commit to a schedule or resources
    as roadmap.


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio


    The team, the Project Lead, and the Product Owner must negotiate deviations from
    the original plan and objectives and commitment jointly. The scope must remain
    static during a sprint, making focus by the team and commitment to the overall
    flight and sprint feasible. We abort an active sprint if we must adjust the scope
    before restarting with revised commitments.


    ## Sprint objectives are the deliverable


    The team commits to a sprint based on resources, features, and objectives negotiated
    with the stakeholders. At the end of each sprint, we plan the next steps and objectively
    refine the project roadmap, objectives, features, and resourcing. After a refinement,
    the team reconnects, and thereafter the tradeoff triangle (resource, features,
    and roadmap) remains intact for the duration of the sprint.


    The objectives are not "big stick" nor "marketing fluff." The flight/project objectives
    chiseled on the team dashboard are typically inherited as sprint objectives or
    selected based on the selected stories for each sprint, as shown in Figure 63.


    ## OBJECTIVES


    ### Stories


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_77_0.png)


    Figure 63. Objective-based sprint backlogs.


    The objectives reinforce why we are doing the project, what needs to be done,
    who will be responsible for what, and how confident the team is about succeeding.
    We ensure that we display them on dashboards, in communications, and at the start
    of each scrum to reinforce them.


    ## (Bi-)weekly scrum


    The team has taken responsibility and started development and proactively collaborates
    in a face-to-face, colocated team environment, which encourages the sharing of
    information and the ad hoc, as needed, walk to the whiteboard. In a geographically
    distributed, part-time, and volunteer-based team environment, as experienced by
    us, the need to share the status, manage the work queues, take action on the impediments,
    and view the quality bar becomes paramount.


    Team transparency is based on the scrum meeting, also known as the "heartbeat"
    or "pulse" of the team. Typically a daily ceremony is a weekly (recommended) or
    bi-weekly event in our ecosystem, made up of a 15-minute review of status and
    an optional 15-minute discussion slot.


    ## Weekly heartbeats “rock”


    With geographically distributed, part-time, and virtual teams, a weekly scrum,
    which adheres to 15+[15] minute time block, is recommended.


    Here’s a recommended breakdown and flow of the scrum meeting:


    0–15 minutes: status**

    - Share the overall status with the team, relying on visual information such as
    the burnout chart.

    - The Scrum Master asks the team whether anyone has to go first and then iterates
    with the rest of the team (for example, alphabetically).

    - Every team member shares what was done since the last scrum, what they are and
    will be doing, and impediments, if any. The Scrum Master ensures the discussions
    remain within the domain/doing/impediments boundaries and makes a note of all
    other discussions to the optional 15-minute Q&A.

    - Review all impediments, both previous and new.


    16–30 minutes: Q&A


    If there are no topics to discuss, the scrum meeting ends after the status update.
    During the optional 15-minute Q&A, team members have the option to stay and participate
    in discussions or to leave the meeting.


    **What about those who cannot make the scrum?**


    Team members who cannot make the scrum must notify the team and share their heartbeat
    (done, doing, impediments), preferably before the scrum but definitively before
    the post-scrum housekeeping is done. Members who fail to show a heartbeat are
    known as dark zombie suspects!


    ## Postscrum housekeeping


    The scrum status, impediments, discussion notes, current backlog, and visual information
    radiator (dashboard, charts/scrum chart sheet) are updated and shared with the
    team and all stakeholders. Remember, transparency is key!


    How and where the teams keep the scrum notes is not as important as every team
    knows where to find the notes. For example, we can use the Scrum bucket to store
    the scrum notes, for acceptance criteria. (See Figure 64.)


    ## Product Backlog Charts


    | ID | Work Item Type | Backlog Priority | Title | Assigned To | State | Remaining
    |

    |---|---|---|---|---|---|---|

    | 8941 | Feature | | TFS on Azure (IAAS) | Mario | In Progress | |

    | 9350 | Backlog Item | | TFS on Azure IAAS Planning | Willy Peter | Committed
    | |

    | 9397 | Backlog Item | | Stand-up Meetings | Jah | Committed | |

