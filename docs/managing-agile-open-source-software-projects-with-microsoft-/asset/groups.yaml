    ## 关键交付物


    路线图定义了 sprint（冲刺）的数量和每个 sprint 的持续时间（图 71）。当路线图结束时，项目结束；当 sprint 框结束时，项目 结束，无论天气或待办列表的状态如何。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_87_0.png)


    图 71。Sprint 交付物和“完成”。


    当团队接近“完成”里程碑时，我们关注评审和回顾，以收集证据并宣布成功或失败。在任何情况下，持续反思和改进以认可团队的成就都是重要的。无论是在 sprint
    结束时还是之前设置“完成”里程碑，取决于团队的。对于每周 sprint，建议在 sprint 结束前将其标记为“完成”里程碑。这为团队提供了交付交付物并宣布
    sprint 成功的时间。


    ## 工作解决方案 (Working solution)


    “工作的软件胜过详尽的文档”（敏捷宣言，2001）原则意味着 sprint 的成功不是通过产生的文档千斤或热情来衡量的，而是通过交付工作的解决方案。


    - 对于指导项目，工作的解决方案意味着专业且实用的指导、操作演示视频，并且在可读性和可用性方面达到了最低质量标准。

    - 对于工具项目，工作的解决方案意味着可安装且功能完备的工具，在代码覆盖和可用性方面达到了最低质量标准。


