    - S22 (4月) - 代理密集型 TFS。

    - S23 (5月) - 构建场景并发布！


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_80_0.png)


    图 65. Scrum 每日会（Scrum-of-scrum）状态幻灯片。


    Scrum 的核心目标是：

    - 提醒所有人飞行状态和动机。

    - 展示飞行路线图状态的更新（已完成、进行中）。

    - 提出并讨论障碍。

    - 提出并讨论回顾发现和提议的创新方案。

    - 提出并讨论其他飞行任务的差异。

    - 展示已完成任务的冲刺演示视频或现场演示。


