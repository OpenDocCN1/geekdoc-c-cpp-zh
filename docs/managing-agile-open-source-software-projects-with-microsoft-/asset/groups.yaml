    ## 附录 B：吃自己的狗粮是关键


    - 向开发团队内部以及团队之间传递信息最高、最有效的方法是面对面交流。

    - 可运行的软件是衡量进展的主要标准。

    - 敏捷流程促进可持续开发。赞助者、开发者和用户应该能够无限地保持恒定的节奏。

    - 对卓越技术和良好设计的持续关注可以增强敏捷性。

    - 简单——最大化未完成工作量的艺术——至关重要。

    - 好的架构、需求和设计源于自组织团队。


    团队定期反思如何变得更高效，并据此调整和调优其行为。


    ## 精益


    精益软件开发是将精益生产和精益 IT 的原则与实践应用于软件开发领域，并根据丰田生产系统进行了调整¹¹¹。以下是精益原则：


    - 消除浪费

    - 将质量内置于其中

    - 创造知识

    - 推迟决定

    - 快速交付

    - 尊重人员

    - 优化整体


    *消除浪费*位于列表顶部，是因为软件开发在改变软件方面具有最大的潜力。解决和消除浪费为降低成本和提高开发中解决方案的有效性提供了最大的机会（表 12）。


    | 制造 | 软件开发 |

    | --- | --- |

    | 在制品库存 | 部分完成的工作 |

    | 过产 | 额外功能 |

    | 额外处理 | 重新学习 |

    | 运输 | 交接 |

    | 动作 | 任务切换 |

    | 等待 | 延迟 |

    | 缺陷 | 缺陷 |


    表 11。七大。


    ## Scrum


    Scrum 已经存在一段时间了，经验告诉我们，它很容易理解，但实施起来充满挑战。我们并不宣布自己是严格的 Scrum 团队。正如我们之前写的，我们在很多方面是反
    Scrum 的，因为我们不是同地办公，也不是全职的。然而，有一些对我们团队有价值的过程精华，我们使用那些有助于和使我们的团队能够频繁且一致地交付解决方案的方法（表
    12）。


    > ¹¹¹ Mary and Thomas Poppieck, Implementing Lean Software Development (Addison-Wesley,
    2007)


