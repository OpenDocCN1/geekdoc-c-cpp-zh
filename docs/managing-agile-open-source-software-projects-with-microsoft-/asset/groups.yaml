    # Release planning: virtualFace-to-virtualFace (vFace-to-vFace)


    # Plan the meeting


    As before, in an ideal world we would schedule and do the release planning in
    colocated and face-to-face workshops and breakouts. Instead, we plan and host
    teleferencing vface-to-vFace meeting, which is long enough to get the core planning
    done in a professional way, yet short so as not to encroach on much family time.


    The optimal duration for a VFace-to-VFace sprint planning is 45 minutes to a maximum
    of 60 minutes. usually scheduling a morning and an afternoon repeat, enabling
    team members to pick the most suitable slot for their time zone. We record and
    share the recordings for all sessions, if we run sessions or if there are team
    members who cannot attend the sessions. In the distributed and virtual world,
    transparency and access to information is key!


    | 45-602 meetings |

    | Schedule a 45 minute (recommended) to 60 minute (maximum) planning meeting.

    | Schedule both a morning and an afternoon session to allow team members in different
    time zones to select the most productive slot. |


    Plan the meeting ahead of time, giving team members at least one week to accept
    the invitation and digest the agenda. We see the planning meeting example invite,
    which defines the intent of the meeting and contains the context and scope.


