    and you won''t have to scan the chapters for the information you are seeking.


    NOTE We recommend that you read this appendix after reading the previous chapters


    # Triage of ideas


    # Gems and checklists


    Roles, responsibilities, and ownership (summarized here for the triage phase):


    | Persona | Responsibility | Ownership |

    |---|---|---|

    | Program Manager | Works with the teams, triage group, and leadership to elaborate
    ideas, participate in planning reviews, coordinate, and drive the ideas.<br><br>Maintains
    the operational environment and the ideas backlog, produces a report for the triage
    group, and helps launch new flights. | - Triage group<br>- Triage<br>- VSO environment<br>-
    Ideas gathering<br>- Pre-triage |

    | Scrum Master | Mentors the teams, enforces the framework guidelines, eliminates
    impediments raised during the triage phase, and actively leads the continuous
    improvement and training efforts. | - Process<br>- Framework<br>- Scrum Masters
    |


    **Encourage ideas and feedback** There is no such thing as a bad idea or question.
    They, in fact, highlight a very different perspective and produce surprising results
    and conversation points.


    **Capture ideas** Every idea, no matter how small or far-fetched, should be captured.
    Revisiting an idea could provoke a totally different reaction than when it was
    logged, perhaps leading to solutions and ideas that were never imagined at the
    time. We tag ideas by type and source.


    | Category Values | Description |

    |---|---|---|

    | Type | Architecture | Ideas focused on architectural or infrastructure changes
    that are typically reusable and evolve.

    | | Business | Ideas focused on business functionality or user experience. This
    is our default type.

    | | Ruck | Ideas focused on our ''loose-Scrum'' framework, documented herein.

    | | Community idea | Ideas sourced from the BLM communities, typically during
    events.

    | | Research idea | Ideas sourced from Rangers who intend to research or future-proof
    technologies.

    | | Strategic idea | Ideas sourced from the Studio leadership, marketing, or product
    groups.

    | | UserVoice idea | Ideas sourced from the UserForum.'
  - "[PAGE 115]\n\n# Appendix A: Supporting toolbox\n\nTriage ideas should be triaged\
    \ regularly to see how they meet priorities, strategies, and return on investment.\
    \ Value decays as dissatisfaction grows time. Ideas that are quickly developed\
    \ or can be broken down into smaller sizeable increments should be favored over\
    \ ideas that will decay over time. For more information, shortest job next (S/JN)\
    \ and shortest job first (SJF). Knowing your limits is an important metric when\
    \ triaging ideas and selecting your next objectives.\n\n| Top ideas |\n The best\
    \ candidates are those with the highest business value that can be delivered most\
    \ quickly, and impose the least risk to the main product line and mission statement\
    \ |\n\nService mode Do not drag the world with you. Sometimes ideas and projects\
    \ need to be put in \"service mode\" because they no longer align with strategy.\n\
    \n| Top service-mode candidates |\n Good service candidates are those with declining\
    \ business value, that require maintenance investment, and are misaligned with\
    \ the main product strategy. Do not invest invaluable resources in solutions that\
    \ do not add value.\n\n+   KISS Keep it simple and ship soon!\n- Do less, and\
    \ quicker! We can always improve and do better next time!\n- Share solutions sooner,\
    \ even if they are in alpha or beta state, to get early feedback.\n- Empower the\
    \ community to influence and take over solutions that are entering maintenance-only\
    \ mode.\n\nShared ownership speak of having multiple owners and backed deals,\
    \ etc. A key to success is rapidly growing \"shared ownership\" awareness in the\
    \ deliver. What sets in, the effect of losing a team member is greatly reduced\
    \ because he or her responsibilities can easily be taken by the rest of the team.\n\
    \nSMART objectives define SMART objectives as:\n\n| Property | Description |\n\
    | Specific | Objectives need to be precise and unambiguous. Every team member\
    \ should be able to explain each objective. There should be no disagreements among\
    \ the team members. |\n Measurable | Objectives must be measurable and aligned\
    \ with expectations and acceptance criteria. The team and Product Owner must be\
    \ able to decide when they have achieved the objectives. |\n Achievable | Objectives\
    \ need to be achievable in terms of timeline and the capabilities of the team.\
    \ |\n Realistic | Objectives must be aligned with the vision and relevant to the\
    \ overall idea. For example, it is unrealistic to expect the Alm Readiness Map\
    \ team to deliver version-control guidance or release-management tools. Such expectations\
    \ will result in frustration and failure. |\n Time-based | We must set the completion\
    \ date for our objectives within a specific time and align these dates with the\
    \ overall roadmap. We naturally prioritize objectives that we must deliver by\
    \ a specific date (when) over those we can deliver any time (whenever). |"
