    85 |


    图 100。不同步的节奏。


    定期的全利益者集成和同步具有挑战性，且往往令人困惑。使用三周节奏和里程碑的利益者对“项目 X 将在迭代 30 发布，即迭代 76 结束或迭代 77 结束”这种表述感到困惑。因此，在
    8 月 25 日，在 Scrum Master 经过简短讨论后，我们将未来的迭代从每月一次改为三周一次。现在，我们在节奏、同步和可预测性方面与所有其他软件工程团队保持了对齐（图
    101）。


    ## 节奏 + 同步 = 可预测性！


    | 7月 | 8月 | 九月 | 十0月 | 11月 | 12月 | 1月 | 2月 | 3月 | 4月 | 5月 | 6月 |

    |---|---|---|---|---|---|---|---|---|---|---|---|

