    ## Schedule the infamous worldwide scrums


    Working with different personas and in different time zones, a distributed and
    part-time team sprinkles interesting challenges over the scheduling for the Program
    Manager (PM) and the Scrum Master (SM). The PM or SM typically support the Project
    Lead (PL) by owning and driving this challenge.


    POP QUIZ


    How do we schedule a meeting that allows all of our team members to meet for an
    hour, at a reasonable time, and that we can repeat for weekly scrums? Assume person
    1 is on the West Coast of the United States, 2 on the East Coast, 3 in Ecuador,
    4 in Switzerland, 5 in South Africa, 6 in Pakistan, 7 in New Zealand, and 8 in
    Australia (Figure 50).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_66_0.png)


    Figure 50. Pop quiz: Many time zones, one team.


    If we schedule the meeting on Monday at 08:00 AM PDT in Vancouver, we would have
    other team members attending on Monday at 10:00, 11:00, 17:00, and 20:00, as well
    as Tuesday at 01:00 AM and 03:00 AM.


    The challenge of scheduling a recurring scrum that meets people''s time is productive
    should be clear from this simple example.


    At the risk of looking like a broken record, in an ideal world we would meet face-to-face
    each day for a few minutes for the daily scrum. However, in the distributed, part-time,
    and volunteer-based community ecosystem, the recommendation is to schedule a “heartbeat”
    scrum, which is at least 15 minutes long and can optionally extend to 30 minutes
    if needed.


    The intent of the scrum is to share information, discuss the “state of the nation,”
    address issues and impediments before they turn into raging fires, and manage
    scope and derivations thereof. Attendance includes the Scrum Master (SM), Project
    Lead (PL), the team, and optionally the Product Owner (PO) and Program Manager
    (PM).


    ## Summary of our process and requirement rudiments


    As part of the sprint(s) focused on training-research-planning, we cover a huge
    and strategic area of the solution requirements. It all as a strategic idea, defined
    by a handful of features and realized by stories. This is a great opportunity
    to reflect on the overall process and by the requirement most.


    ## Chapter 2: Getting ready


    - 1. Epic represent the ideas raised by the community and stakeholders to realize
    value propositions. Ideas can originate from investments, investment themes, product
    themes, or simply as a great idea.

    - We capture the ideas in the backlog using the Epic work-item type and triage
    them during the triage of ideas.

    - Epics convey an idea expressed in a formal or bulleted form, and the implementation
    detail is contained in their dependent features and stories.

    - We do not implicitly imply or test Epics. Instead, fulfill Epics with features,
    which we in turn return by stories.

    - Epics are not validated by the test cases associated with their dependent features
    and stories.


    - 2. Features emulate from the core area. As part of the idea, the Product Owner
    identifies and prioritizes a few features for the team to invest in the next and
    future releases of the solution.

    - We capture features on the ideas backlog and link them to the parental as dependent
    child objects.

    - We assign features to a solution "flight" by using the path and a solution "release"
    using the iteration path on VSO.

    - Features are of type objective, architecture objective, process objective, or
    other custom objectives. The business and architecture objectives are common in
    SAFe™ or CMM, identifying architectural infrastructure, business requirements,
    or user experiences.


    - 3. Stories describe what the solution should do for the business or architecture
    to realize the encompassing feature. As part of planning, the team identifies,
    estimates, and prioritizes a few stories, which may be broken down into Task objects.

    - We capture stories on the sprint backlog and link them to the parental features
    as dependent child objects.

    - We assign stories to a team by the area path and an iteration or using the iteration
    path on VSO.

    - Stories are tracked using the Kanban board or as dependent tasks using the task
    board.

    - Stories are typically of the same type as their parent. In some cases, a business
    objective, for example, may require features and innovations to an an architecture
    or infrastructure, in which case there be a mix of story types realizing a feature.


    - 4. Teams represent the passionate volunteers who take the operational infrastructure,
    program management, self-organize as feature teams, and innovate their ecosystem
    through regular reflection.

    - We have one engineering team that owns the operational infrastructure, program
    management, deployment, and cross-flight collaboration. We organize each solution
    flight into one or two focused feature teams—for example, the guidance team and
    tooling feature team.

    - Teams are typically short-lived for the duration of a flight and release of
    a solution. A nucleus of one or both teams will evolve into the maintenance and
    ownership team, which accompanies a solution after release and will kick-start
    feature teams with subsequent flights.

    - Long-lived nuclei ensure knowledge retention, increased learning, more accurate
    estimating, better planning, and less ramp-up waste.


    Figure 51 shows the first phases of the overall solution release (flight) and
    the hierarchy of Epic-Feature-Story and associated work-item types.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_68_0.png)


    Figure 51. Episodes realized by features and Scrum optimally tasks.


    Using Foundation Server (TFS), we can visualize as shown in Figure 52.


    | Work Item Type | Title | State | Effort | Iteration Path | Area Path | Tags
    |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Feature | | In Progress | | | | |

    | Product Back Item | Implement scrum | Committed | 3 | ProcessDev2\Sprint1 |
    ProcessDev2\Innovation | Business Objective |

    | Product Back Item | Document customizations | Committed | 2 | ProcessDev2\Sprint1
    | ProcessDev2\Innovation | Feature Team |

    | Product Back Item | Create story | | | ProcessDev2\Sprint1 | ProcessDev2\Innovation
    | Business Objective |

    | Product Back Item | Automate the process | New | 5 | ProcessDev2\Sprint1 | ProcessDev2\Innovation
    | System Team |


    Figure 52. Example-work item hierarchy using Scrum process template.


    ## Glimpse of tomorrow ... tracking with informative banner


    Today the typical duration of a project is three to four sprints, with a potentially
    shippable deliverable. Although team members are still breaking down their work
    into actionable and detailed tasks, frequent anomalies we observe:


    - Teams do not use or track tasks.

    - Features marked as Done often contain orphaned tasks that are still in the new
    or in-progress state.

    - Information documented in tasks—for example, objectives and the definition of
    Done (DoD)—is difficult to find.


    Reflection, continuous improvement, a willingness to embrace and change and new
    features on Visual Online are instrumental to our dogfooding and productivity.
    This is our tomorrow:


    - New projects use informative Kanban board (Figure 53) to eliminate waste and
    visualize all the work.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_69_0.png)


    Figure 53. Using the Kanban board of tomorrow.


    - The definition of done (DoD), acceptance criteria, and other relevant information
    driving state is accessible from the board.

    - Split columns visualize our work through our workflow.

    - Personal Kanban boards and sticky notes replace the use of detailed task planning
    and boards.


    ## Dogfood case study: Where is the fire?


    Estimating, managing, and tracking requirements with geographically distributed,
    virtual, and part-time teams are parts of a complex adventure. In this case study,
    we explore evidence from a few of the previous teams'' observations that have
    infused solutions.


    ### Evidence from the field


    ### Scenario 1—Burning down


    Teams trend around the ideal burndown line, giving most observers a sense of comfort.
    What raises concern are the three spikes (see Figure 54), typically caused by
    scope creep or acceptance of new tasks or bugs. This could create a discrepancy
    between planned velocity and actual velocity.

