    # 第3章：构建可行的解决方案


    ## Azure上的 TFS (IAAS)


    ### 愿景

    提供实用的指南和易于理解的就绪材料，使一线人员通过自我学习，规划、实施和维护一个用于云端项目评估、测试和生产的有效 TFS on AzureaaS 环境。


    ### 动机

    支持 DevOps 计划的战略计划，并帮助用户在其私有云中实现 TFS 服务。


    ### 交付物

    - 实用的指南（电子书、快速学习教程、视频）

    - 技术就绪会议 (Techready session)

    - 与 On-Time VM Factory 服务的协作


    ### 状态

    - 进行中 (In-flight)

