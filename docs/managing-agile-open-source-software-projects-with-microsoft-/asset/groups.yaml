    (unresolved) bugs.


    # Dealing with impediments


    An impediment is anything that blocks the team from being fully productive, including
    environmental, technical, infrastructure, interpersonal, culture, or experience
    impediments.


    +   - It is the responsibility of the team to raise all impediments in a timely
    way.

    - It is the responsibility of the Scrum Master and the Program Manager, irrespective
    of the nature of an impediment''s severity, to remove impediments and enable the
    team to regain full productivity.


    Capture all impediments, assign responsibility, and raise them for a long time
    (Figure 75). In this case, the Scrum Master and Program Manager must nudge and
    work with the responsible team member to remove the impediment.


