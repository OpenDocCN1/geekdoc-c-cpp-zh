  - '[PAGE 23]


    # Service-mode candidates


    Before committing to new ideas, we evaluate our previously shifted assets to decide
    which are ready for service mode and which should be retired. We do this because
    our bandwidth is limited and severely impacted by long-term maintenance.


    > GEM

    Top service-mode candidates

    Good service-mode candidates are those solutions with declining value, that require
    maintenance investment, and are misaligned with the main product strategy. Do
    not invest invaluable resources in solutions that no longer add or no value.


    When a solution enters service mode, we continue to monitor forums and discussions
    to maintain a vibrant community. We consider only critical bug-fix maintenance
    and no new features. This ensures that we are able to invest our limited and precious
    bandwidth in new initiatives.


    # New candidates


    Based on priority and business value, new ideas already appear in rough order
    of importance. To display them in a visible ranking diagram, we use these values
    to calculate a ranking score.


    > NOTE

    The calculation of the ranking score is going to vary from environment to environment.
    We use the following:

    Ranking score = (( 5 - Priority * 1000 ) + business value ) / size


    Priority is defined in TFS process templates as 1 by default, with 15 representing
    the highest priority. We calculate the value based on community votes (or use
    a constant 900) for strategic ideas. We prefer to use Fibonacci numbers¹⁴⁵ (Wikipedia,
    Fibonacci, 2015), assigning for < 10 votes, for < 20, for < 30, for < 35, for
    < 40, for < 50, and for < 130.


    The template defines size with the values 1 through 5, representing Extra Small,
    Small, Medium, Large, and Extra Large problem to resolve. Size corresponds to
    the length of time or sprints in the development queue.


    > GEMS

    (Fast) value delivery

    Value decays as dissatisfaction grows over time. Ideas that are quickly developed
    or can be broken down into smaller checkpoints are favored over ideas that will
    decay over time. For more information, see shortest job (SJN) and shortest job
    first (SJF)¹⁵ (Wikipedia, Fibonacci, 2015).


    Prepare a triage crisp presentation


    We distribute the triage report together with the triage invitation a week before
    the online telemeeting to give everyone an opportunity to review and contemplate
    the ideas. It is highly likely stakeholders who are physically located will dominate
    the meeting. We recommend that you include the following information in a slide
    deck (Figure 7 shows an example):


    +   * Project highlights

    nA summary of recent project activities and highlights to provide context for
    past and recent success stories as well as failures that are relevant to the triage.

    * Recommendations—Service Mode

    A summary of the service-mode analysis that shows the ranking and recommended
    candidates


    ¹⁴ http://en.wikipedia.org/wiki/Fibonacci_number

    ¹⁵ http://en.wikipedia.org/wiki/Shortest_job_First


