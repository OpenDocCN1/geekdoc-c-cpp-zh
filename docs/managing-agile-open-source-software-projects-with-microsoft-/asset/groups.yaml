    # Key deliverables


    The roadmap defines the number of sprints and the duration of each sprint (Figure
    71). When the roadmap time box is over, the project is over, which will be the
    topic of discussion in the next chapter. When the sprint time box is over, the
    sprint is over, irrespective of the weather, world peace, or the status of the
    sprint backlog.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_87_0.png)


    Figure 71. Sprint deliverables and the "peg in the ground."


    As the team approaches the "peg in the ground" milestone, we focus on review and
    the retrospective to gather evidence and be in a position to declare success or
    failure. In either case it is important to continuously reflect and improve to
    recognize the accomplishments by the team.

    Whether we put the peg in the ground at the end of the sprint or before is the
    team''s call. With weekly sprints, the recommendation is to mark the sprint a
    week before the end of the sprint as the "peg in the ground" milestone. That gives
    the team a part-time week to deliver the core deliverables needed and declare
    the sprint as a success.


    # Working solution


    The principle "Working software over comprehensive documentation" (Agile Manifesto,
    2001) implies that the success of the sprint is not measured by the kilograms
    of documentation produced or the tons of passion invested, but in delivering working
    solutions.


    +   * For guidance projects, working solutions implies professional and practical
    guidance, walkthroughs, hands-on videos, and heads that have reached the minimum
    quality bar in terms of readability, accuracy, and usability.

    * For tooling projects, working solutions implies installable and functional tools
    that have reached the minimum quality bar in terms of code, coverage, and usability.


