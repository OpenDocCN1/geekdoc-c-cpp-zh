    # Chapter 2: Getting ready


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_59_0.png)


    Figure 45. Latest by time zones.


    +   1. A question raised at 11:00 in Vancouver could be acted on within minutes
    if the team member in South Africa is at 20:00.

    2. A question raised at 19:00 could be acted on within 14 hours if the normal
    and part-time/community hours overlap.

    3. If the times do not overlap, we will incur an additional 8 hours of latency
    before a team member picks up an answer.


    Worse, if the team member in Johannesburg is part-time, the response latency could
    increase from hours to days. By reducing the need for flexibility or reliance
    on others, we create loosely coupled stories that any team member can pick up
    and process.


    Stories that have high cohesion have clear responsibilities to answer the "what"
    questions. Unfortunately, there is no perfect story in terms of coupling and cohesion
    without asking yourself, "Could this story be done effectively in isolation? If
    not, can we break it down further?"


    # Let us not forget states!


    As the stakeholders consensus around the value and details of features and stories,
    we must ensure that we maintain the state as outlined in Table 9, Important story
    (PI) events when using Kanban. The team should consider features and stories that
    the Product Owner (PO) marks as Approved.


    The Approved state implies that the PO speaks or thinks favorably of the team
    and is in favor of the team investing bandwidth to implement the value.


    # Why should we care about prioritization?


    The art of prioritization is not an easy one. Users want all of the features,
    and as we come in more than one plan with planning, the relative priorities of
    features become blurred and debated. The values of features are often difficult
    to quantify, especially for research, prototyping, debugging, and bleeding-edge
    technologies.


    The Agile Manifesto states that we should collaborate with the user, deliver working
    software, and react to change. This mandates that we cannot deliver everything,
    and the reality of time demands prioritizing features for yesterday.


    We respect the fixed Roadmap and Resources of the tradeoff discussed in Planning
    the kickoff, leaving us with the prioritization of features. The objective is
    to ship as many features as possible, increase the return on investment (ROI),
    and decrease the cost of delay.


    It is common with volunteer and part-time teams that family and jobs interfere
    with moonlight projects. It negatively affects the Resources side of the tradeoff,
    forcing us to reprioritize features continuously. It is more intuitive to prioritize
    small and high-value stories. Working with large, complex, and tightly coupled
    stories is a disaster waiting to happen, resulting in failure to deliver value,
    dissatisfaction, and a rapid decline of return (ROI).


    > 53 http://en.wikipedia.org/wiki/Cost_of_delay


