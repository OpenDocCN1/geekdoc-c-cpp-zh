    Folders\n almagners.visualstudio.com/DefaultCollection\n Articles and Publications\n\
    \ VisualStudio.ALM\n VisualStudio.ServMode\n98. We actually have more than one\
    \ team project (for a reason).\n\nAs we have three team projects, VisualStudio.ALM\
    \ is our production team project, 99 percent of our artifacts and 100 percent\
    \ of all active projects. The Articles and Publication and the VisualStudio.ServMode\
    \ team projects are our team projects, which contain a backup of our publications\
    \ and our inactive projects.\n\n> We have one operational team project and a \"\
    few\" archive team projects.\n\n# Multiple teams lining up\n\nThe introduction\
    \ of Team Foundation Server allows us to design an environment that is more representative\
    \ of and conducive to a team environment. Working the Team Foundation Server Planning\
    \ Guide, we quickly realized that we needed more than one team, each owning an\
    \ area and iteration path. As part of our dogfeeding, we are encouraging teams\
    \ to remain relatively small, typically five members, but up to a maximum of ten,\
    \ to promote agility and reduce administrative overhead on the Lead and Scrum\
    \ Masters. Teams that outweigh these limits usually become to monitor our unchanging\
    \ environment (ALM Guidance: Visual Studio ALM Rangers—Reflections on Virtual\
    \ Teams)125 and are best broken into smaller teams.\n\nWe have sliced our project\
    \ into teams, relating 1:1 to those on the ALM Ranger solutions catalog.126 Each\
    \ team represents each project. In some cases, for with our quick-response, we\
    \ have an umbrella project that contains multiple related but separate feature\
    \ projects. We use the area path as the dividing line between feature teams, but\
    \ treat them as one project, with one goal, tracking, and backlog.\n\n> We have\
    \ many teams and in some cases feature teams.\n\n# One (sized) sprint\n\nIn ALM\
    \ Rangers dogfooding of the Team Foundation Service, we introduced our monthly\
    \ cadence in July 2012. By using all team projects, we created a predictable rhythm\
    \ for the community and our engineering process. with a common language.\n\n#\
    \ Cadence + Synchronization = Predictability!\n\nWe broke up our year into 12\
    \ monthly sprints, each of which we split into two one-half month sprints. We\
    \ started with the new definition of the iteration path on July 1, 2012, which\
    \ is the reason why the monthly sprints are numbered 1-12 for monthly (and 1.1,\
    \ 1.2, 2.2, and so) on FY13 and 13-24 in FY14. (See Figure 99.) We use monthly,\
    \ half-monthly, or a combination of them. Each team can choose their cadence.\
    \ The typical pattern is a half-month sprint, followed by three monthly sprints.\
    \ Each sprint starts with achievable objectives and ends with a sprint deadline.\
    \ Teams with no deliverable or heartbeat instill no confidence and are red flagged.\n\
    \n125 http://mdn.microsoft.com/en-ca/magazine/hh394152.aspx\n126 http://aka.ms/vsarsolutions\n\
    \nManaging Agile Open-Source Software Projects with Microsoft Visual Studio Online\
