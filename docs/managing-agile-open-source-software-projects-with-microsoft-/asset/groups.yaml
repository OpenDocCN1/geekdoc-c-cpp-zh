    # Estimating and prioritization fundamentals


    1. Why should we care about estimation?


    Assume we decide that we want to walk from point A to point B (for example, Ladner
    to Tofino). The first thing we would typically do estimate the time it takes to
    walk this distance and break down the journey into manageable and measurable dimensions.


    Using our favorite search engine (see Figure 43), we get a view of the journey
    and an indication whether the adventure is viable. By changing the journey from
    Ladner to Whitehouse, Yukon, the search result would give us visual clues that
    we are heading for a potential disaster or would need to break down the journey
    into smaller and shorter excursions. We also get nonfunctional requirements and
    impediments, an estimation of effort, distance and time, and plan.


    If we do this for a 300 kilometer stroll, why would we not do so for a mission-critical
    and potentially expensive project?


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_55_0.png)


    Figure 43. Hypothetical project to walk from Ladner to Tofino.


    Even for light and part-time projects, we need an organized and well-maintained
    backlog to determine the feasibility and estimate, the cost of a proposed solution.


    Let''s take a quick look at features, costs, the ideal-world, and how we deal
    with normalized estimations.


    # Requirements estimations


    In the section "Planning the kickoff", we described how the Product Owner estimated
    and prioritized features in terms of value. For product backlog items and stories,
    we estimate the value using story points (SP), representing a combination of complexity,
    the number of features, and a clarity or uncertainty assurance. Estimations can
    be based on story points, T-shirt or tractor sizes, Fibonacci series derivations,
    or any integer value of choice.


