    # Chapter 4: Raising the quality bar


    to the public download channel as it emerged from the codepditing process, and
    the release state switched beta to RTM with the last e-book.


    An obvious anomaly is once again with the lack of noticeable planning, deferred
    to the associated project dealing with the ill-fated fourth e-book.


    ## Innovate explore


    Both teams did not focus on the optional innovation and research during the sprint
    focused on quality and planning. Focus was on improving the quality of both solutions,
    landing something, and delivering tangible value to the community. While the pirates
    will likely continue innovations and research while waiting for the next release,
    the Version Control guidance team members dispersed to other projects, for example
    DevOps and DSC, where they embraced research as part of the sprint focused on
    training-research-planning. Innovation and research during the sprint focused
    on quality and planning is optional and should not distract from the core objectives:
    Improve the quality and land the flight!*


    ## Keep everyone busy informed


    Members on the Version Control guidance team were not busy during the sprint focused
    on quality and planning. The solution was essentially feature complete, with no
    subsequent releases planned. Consequently there was a gradual resource drain team
    members moved to new projects, for example vasDesc. While not an issue in this
    instance, it provides a stark reminder that idle and bored team members will jump
    ship as new and exciting opportunities emerge.


    In contrast, we infected the Treasure Map team with a “fun” pirates theme and
    a passionate Project Lead (PL) and kept the team busy with testing (Figure 93).
    Not all team members react to such a “fun” factor and a theme like “pirates,”
    but in this case, we created a vibrant crew that never seemed to sleep. A key
    is to keep the team engaged and aligned with the vision and objectives as we finalize
    the release.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_112_0.png)


    Figure 93. A fun theme helps!


    ## Make noise


    When the teams shipped, whether a beta release or RTM, they made noise, announced
    the release and constraints, and most importantly asked everyone to do likewise.
    The passionate and vocal team demonstrated commitment and created infectious interest
    in the solution.


