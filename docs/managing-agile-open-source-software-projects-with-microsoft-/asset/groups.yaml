    # Foreword


    The ALM Rangers are a special group for several reasons. Not only are they innovative
    and focused on the real world, providing value-added solutions for the Visual
    Studio developer community, but they live and work in all four corners of the
    globe. The ALM Rangers are a volunteer organization. Talk about dedication! When
    we were offered the opportunity to write a foreword for this book, we knew we''d
    be part of something special.


    The ALM Rangers don''t pontificate that they''ve found the one true way. This
    is practical and examples for producing great software by those who do it—and
    most importantly—are still innovating and coding. Readers will find that they
    have virtual coworkers who share their experiences with honesty and humor, revealing
    learnings and what has worked for Visual Studio Online. This doesn''t mean that
    this book lacks prescriptive guidance. The Rangers have embraced Visual Studio
    Online as their own and open source software in GitHub to learn how successful
    OSS projects are run and where the community values most. They''ve created an
    ecosystem that identifies the "low hanging fruit" and tracks it from idea to solution,
    and they never fail to recognize the Rangers and the ALM VPs who dedicate their
    personal time and passion to their OSS projects.


    The extensive guidance shared here is not an end-to-end plan for everyone, although
    it could be used as a definitive guide for some teams. One of the many assets
    of this book is its organization in practical walkthroughs of typical ALM Ranger
    projects from idea to solution, and presented as an easy to consume reference.
    Other bonuses are an appendix to quick-start your own project and reference checklists
    to keep you on track.


    Among the authors, this book was called the "v1 dawn edition." True to their core
    value of "learn and share all experiences," the ALM Rangers are always mindful
    of producing great software means continuous refinements from new learnings and
    feedback and that there will be more versions of this book. But first we invite
    you to immerse yourself in *Managing Agile Open-Source Software Projects with
    Microsoft Visual Studio Online.*


    In the true spirit of Agile, ongoing innovation,


    Sam Guckenheimer

    Clemri Steyn


    # Preface


    In January 2006, I moved from Microsoft Consulting Services in Munich to Redmond
    and joined the Visual Studio product group. A few months later, we founded the
    Visual Studio ALM Rangers with the vision to fill feature and guidance gaps. "Let''s
    solve our problems instead of complaining" was our motto, which resonated with
    ALM practitioners. Today, we have helped dozens of customers with large numbers
    of downloads and top ratings.


    If there is only one reason for this book, it is sharing practices. What we have
    learned and shared over the past busy years have revolutionized the art of open
    source software for the community development.


    This book is a library of practices that we created and matured through dozens
    of iterations. To make it easier to digest, we have arranged these practices in
    chapters. Each chapter represents the main operations of the community. These
    practices cover our business end to end, from ideas to shipped products.


    Every good solution starts with a good idea. Just like other ideas, we collect
    all ideas in a systematic and structured way. I used to call this "mathematical
    democracy," where the community decides through votes, what we work on and what
    is the most important thing to do.


    We are hands-on practitioners. We use our tools to develop our solutions and recommend
    them only if they work well for us. Typically, we extend the concept of "dogfooding
    by using and testing what we create in real customer projects."


    We are also about readiness. We have mastered this area by merging readiness and
    problem solving as one continuous and overlapping practice. Every project starts
    with a readiness. Our motto is "If you don''t understand the space, you can''t
    solve the problem." Readiness is a prerequisite for efficient production.


    When it comes to development, our famous "laser focus" meets pragmatism. No scope
    creep and no gold plating. We prefer to put all our energy into the quality of
    our solutions.


    We wrote this book to share our knowledge with the community of ALM practitioners
    in the spirit of open source, enabling others to repeat our success.


    > Bijan Jivindi, Principal Program Manager


    The practice of "eating your own dogfood" has a long history at Microsoft and
    within the Visual Studio team in particular. The notion that using your own product
    to build your product and adopting the latest versions before your customers is
    a powerful and compelling notion. The effect of the practice is so strong that
    it is clear to which many members we have broad adoption within the team—a result
    of their polish, utility, and reliability. Even the initial impact on the productivity
    of the dogfood "eaters" is considerable, the return on investment to both internal
    and external customers is significant, making the practice worthwhile.


    The extensive guidance shared here is not an end-to-end plan for everyone, although
    it could be used as a definitive guide for some teams. One of the many assets
    of this book is its organization in practical walkthroughs of typical ALM Ranger
    projects from idea to solution, and presented as an easy to consume reference.
    Other bonuses are an appendix to quick-start your own project and reference checklists
    to keep you on track.


    Among the authors, this book was called the "v1 dawn edition." True to their core
    value of "learn and share all experiences," the ALM Rangers are always mindful
    of producing great software means continuous refinements from new learnings and
    feedback and that there will be more versions of this book. But first we invite
    you to immerse yourself in *Managing Agile Open-Source Software Projects with
    Microsoft Visual Studio Online.*


    # Introduction


    With this book, we share our adventures as we hone our skills in an environment
    where transparency, simplicity, and trust prevail. We are a geographically distributed,
    part-time, virtual, and volunteer-based team, which implies hard-to-get commitments.
    We build solutions that range from small to complex and use a variety of technologies
    that are often at the bleeding edge. For us, being unconventional is an asset
    when it comes with a variety of skills, traditions, cultures, and experiences.


    ## Who should read this book


    This book targets Agile development teams and their Scrum Masters who want to
    explore and learn from our “dogfooding” experiences and our continuous adaptation
    of software requirements. Product Owners and other stakeholders will also find
    value in this book in learning how they can support their Agile development teams
    and by gaining an understanding of the constraints of community projects.


    ## Assumptions


    This book assumes that you have at least a minimal understanding of Agile, Lean,
    and Scrum development concepts and are familiar with Team Foundation Server (TFS)
    and Visual Studio Online (VSO). To go beyond this book and expand your knowledge
    of Agile practices or Visual Studio technologies, MSDN and other Microsoft Press
    books offer complete introductions and comprehensive information.


    ## This book might not be for you if . . .


    This book might not be for you if you are looking for an in-depth focused on the
    process, development, or architecture of software requirements, tooling, or practices.
    Similarly, if you are looking for source code or guidance on ALM, DevOps, or proven
    official frameworks as Agile, Scrum and Kanban, this book will not be fully relevant,
    and we recommend that you consider these publications:


    - Agile Software Engineering with Visual Studio, Sam Guckheimer and Neno Loje

    - Professional Scrum Development with Microsoft Visual Studio 2012, by Richard
    Hundhausen


    ## Organization of this book


    We divided this book into four chapters and two appendices, intended as easy reading
    to get you started and later as an invaluable reference for you, and your process
    in a complex environment. The appendices focus on technologies, checklists, and
    supporting guidance. Chapters 1 through 4 take you through a practical and simple
    lifecycle with starting ideas and moves to get ready, building the solution, and
    raising the quality bar, with a focus on requirements management, not tooling.

