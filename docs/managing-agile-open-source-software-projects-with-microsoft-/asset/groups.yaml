    # Why do we ship on CodePlex and not VSO?


    > NOTE This part of our process will evolve with Visual Studio Online, allowing
    us to manage and release open source solutions on Visual Studio Online.


    As Studio Online invites guest access and the ability to publish solutions publicly
    and accept feedback and contributions, we retain our presence on CodePlex. Our
    “dream” is that one we can accept feedback and contributions from the community
    and by using a pull request to request a feature update.


    # Foodfooding case study: vsarVersionControl and vsarTreasureMap ship ringing
    victory bells


    Wrapping up and landing a release is the last part of the adventure. No project
    ever finishes the same way as its predecessor or other solutions. There is no
    perfect recipe for landing the solution on time, above the quality bar, and with
    100 percent satisfied customers. In this case study, we explore two projects,
    each with a spectacular and successful landing but using a completely different
    strategy.


    # Background information


    We introduce the ALM Treasure Map team in the case study. We welcome this team
    for the quality and planning sprint. Another team, which did not payoff the innovations
    covered in this book, ended their lifecycle focused on quality and planning. These
    teams are real-world examples to include as part of this case study. Version Control
    (ex Branching and Merging) Guide had been bogged down with three or four guidance
    e-books, the new release of the fourth failing to achieve the minimum quality
    bar. A “Judge Dread” decision was to spin up a new release for the ill-fated fourth
    guidance e-book and dogfood the quality and planning focused concepts for the
    others.


    # Different strategies, same objective . . . “land”


    The lifecycle of both the teams and their solutions shown below the quality and
    planning bar in Figure 92 illustrate that neither team stuck to the “optimal”
    plan. Both team adapted and shipped, and this introduces an important concept:
    Reflection, continuous improvement, and a willingness to take risks and embrace
    change are instrumental to our success!'
