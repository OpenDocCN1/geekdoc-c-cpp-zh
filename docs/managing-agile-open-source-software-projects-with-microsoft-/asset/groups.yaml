    ## Appendix B: Eating own dogfood


    Software is a great combination between artistry and engineering.—Bill Gates


    The concepts covered here are not silver bullets but rather a collection of proven
    technologies and techniques that we have used on projects. We have cherry-picked
    and evolved a tailored framework based on our context but keep deep roots and
    a foundation based on Lean thinking and Agile values. Sharing our framework is
    not an attempt to trigger another process, such as Kanban (Toyota, 2014), Agile
    (2001), Lean Enterprise (2009), versus Scaled Agile (SAFe)(2014). Instead, we
    want to share our learnings, allowing everyone to continuously inspect, discover
    improvements, and continuously adapt the way we work. Dogfood gives us access
    to the latest and greatest technologies, enables collaboration with the product
    group, and provides early feedback to the product team. Within this chapter, we
    will provide an overview of the various frameworks and methodologies we have leveraged
    in churning out projects over the past years.


    ## Agility is key


    ## ALM Rangers manifesto


    We provide professional guidance, practical experience, and gap-filling solutions
    to the ALM community. We expect every team member to virtually sign and commit
    to our manifesto:


    ### Razor sharp focus on quality and detail on the work

    - Favor simplicity and low tech over complexity

    - Expect and adapt to change, delivering incremental value


    ### Accountability and commitment

    - Actively manage the project attributes: features, bandwidth, and cost

    - Never go dark... always share the good, the bad, and the ugly


    ### Nonstop and unrestricted collaboration

    - Empower the ALM community

    - Enable open communications


    ### Global transparency and visibility through shared infrastructure

    - For all initiatives, track and publish status on a timely basis

    - Access to everything for everyone


    ### Empathy, trust, humility, and openness at all times

    - No one knows everything; we know more

    - Learn from and share all experiences


    ## Regular feeding of Visual Studio Application Lifecycle Management tools


    Improve productivity of teams Gather real-life experiences


    ## Microsoft Solutions Framework


    Since the early days of the Microsoft Solutions Framework (MSF), we have emphasized
    that agility is extremely important and that we must change. MSF has principles
    and practices where the former was about the mindset of the team and the latter
    about the actual practice of the individual. In our mind, we have always aligned
    closely with the Agile Manifesto. MSF forms the base of our practices.


    Microsoft Solutions Framework is a set of software engineering processes, principles,
    and proven practices intended to enable developers to achieve success in the software
    development lifecycle (SDLC). The following are eight foundational principles
    and nine mindsets that form the backbone for the other models and disciplines
    of MSF:


    | Principles | Mindsets |

    | --- | --- |

    | Foster open communication | Familiarize team members to how they should approach
    solution delivery |

    | Work toward a shared vision | Foster a team of peers |

    | Empower team members | Focus on business value |

    | Establish clear accountability and shared responsibility | Keep a solution perspective
    |

    | Focus on delivering business value | Take pride in workmanship |

    | Stay agile, except change | Learn continuously |

    | Invest in quality | Internalize qualities of service |

    | Learn from all experiences | Practice good citizenship |

    | | Deliver on our commitments |


    ## Agile Manifesto


    The Agile Manifesto for Agile Software Development shares some of the same considerations
    with MSF. The Agile Manifesto is "uncovering better ways of developing software
    by doing it and helping others do it." (Agile Manifesto, 2001). We are encouraged
    to value:


    - Individuals and interactions over processes and tools

    - Working software over comprehensive documentation

    - Customer collaboration over contract negotiation

    - Responding to change over following a plan


    In addition, the principles behind the manifesto are:


    - Our highest priority is to satisfy the customer early and continuous delivery
    of valuable software.

    - Welcome changing requirements, even late in development. Agile processes harness
    change for the customer''s competitive advantage.

    - Deliver working software frequently, from a couple of weeks to a week of months,
    with a preference to the shorter timescale.

    - Business people and developers must work daily throughout the project.

    - Build projects around motivated individuals. Give them the environment and support
    they need, and trust them to get the job done.

