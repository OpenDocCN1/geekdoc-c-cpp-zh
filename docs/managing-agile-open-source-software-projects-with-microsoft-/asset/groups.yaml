    # Chapter 4: Raising the quality bar


    Figure 94 shows blog post announcements and a tweet. The message was transparent,
    and encouraged the community to deliver candid feedback.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_113_0.png)


    Figure 94. Announcements using blogs, Twitter, and so on.


    In addition, team members were encouraged to add their comments to announcement
    and blog logs, to highlight why they saw the solutions as invaluable, and to integrate
    vibrant discussions.


    ## Key learnings


    - * By releasing a shippable as early and frequently as possible, the team can
    gather candid feedback and be in a position to react to any business value changes.

    - The Quality and sprint points helps raise the bar. It is the ideal opportunity
    for the team to learn, innovate, and by focusing on the core objectives and future
    features. This increases the team''s passion.

    - Quality Essentials and codepddriting are important because they ensure the engineering
    policies and user documentation are accurate.


    # Appendix A: Supporting toolbox


    This appendix serves as a quick reference to many of the gems, checklists, and
    supporting tools and templates we have identified throughout the book. Once you
    read the previous chapters, this appendix provides you with a quick point of reference,
    and you won''t have to scan the chapters for the information you are seeking.


    NOTE We recommend that you read this appendix after reading the previous chapters


    ## Triage of ideas


    ## Gems and checklists


    Roles, responsibilities, and ownership (summarized here for the triage phase):


    | Persona | Responsibility | Ownership |

    |---|---|---|

    | Program Manager | Works with the teams, triage group, and leadership to elaborate
    ideas, participate in planning reviews, coordinate, and drive the ideas.<br><br>Maintains
    the operational environment and the ideas backlog, produces a report for the triage
    group, and helps launch new flights. | - Triage group<br>- Triage<br>- VSO environment<br>-
    Ideas gathering<br>- Pre-triage |

    | Scrum Master | Mentors the teams, enforces the framework guidelines, eliminates
    impediments raised during the triage phase, and actively leads the continuous
    improvement and training efforts. | - Process<br>- Framework<br>- Scrum Masters
    |


    **Encourage ideas and feedback** There is no such thing as a bad idea or question.
    They, in fact, highlight a very different perspective and produce surprising results
    and conversation points.


    **Capture ideas** Every idea, no matter how small or far-fetched, should be captured.
    Revisiting an idea could provoke a totally different reaction than when it was
    logged, perhaps leading to solutions and ideas that were never imagined at the
    time. We tag ideas by type and source.


    | Category Values | Description |

    |---|---|

    | Type | Architecture | Ideas focused on architectural or infrastructure changes
    that are typically reusable and evolve. |

    | | Business | Ideas focused on business functionality or user experience. This
    is our default type. |

    | | Ruck | Ideas focused on our ''loose-Scrum'' framework, documented herein.
    |

    | | Community idea | Ideas sourced from the BLM communities, typically during
    events. |

    | | Research idea | Ideas sourced from Rangers who intend to research or future-proof
    technologies. |

    | | Strategic idea | Ideas sourced from the Studio leadership, marketing, or product
    groups. |

    | | UserVoice idea | Ideas sourced from the UserForum. |


    # Appendix A: Supporting toolbox


    Triage ideas should be triaged regularly to see how they meet priorities, strategies,
    and return on investment. Value decays as dissatisfaction grows. Ideas that are
    quickly developed or can be broken down into smaller increments should be favored
    over ideas that will decay over time. For more information, shortest job next
    (S/JN) and shortest job first (SJF). Knowing your limits is an important metric
    when triaging ideas.


    - The best ideas candidates are those with the highest business value that can
    be delivered most quickly, and impose the least risk to the main product line
    and mission statement

    - Do not drag the world with you. | The best service-mode candidates are those
    with declining business value, that require maintenance investment, and are misaligned
    with strategy. Do not invest invaluable resources in solutions that do not add
    value.


    - Share even if they are in alpha or beta state, to get early feedback. | Empower
    the community to influence and take over solutions that are entering maintenance-only
    mode.


    Shared ownership speak of having multiple owners and backed deals, etc. A key
    to success is rapidly growing "shared ownership" awareness in the deliver. What
    sets in, the effect of losing a team member is greatly reduced because she or
    her responsibilities can easily be taken by the rest of the team.


    SMART objectives define SMART objectives as:


    | Property | Description |

    |---|---|

    | Specific | Objectives need to be precise and unambiguous. Every team member
    should be able to explain each objective. There should be no disagreements among
    the team members. |

    | Measurable | Objectives must be measurable and aligned with expectations and
    acceptance criteria. The team and Product Owner must be able to decide when they
    have achieved the objectives. |

    | Achievable | Objectives need to be achievable in terms of timeline and the capabilities
    of the team. |

    | Realistic | Objectives must be aligned with the vision and relevant to the overall
    idea. For example, it is unrealistic to expect the Alm Readiness team to deliver
    version-control guidance or release-management tools. Such expectations will result
    in frustration and failure. |

    | Time-based | We must set the completion date for our objectives within a specific
    time and align these dates with the overall roadmap. We naturally prioritize objectives
    that we must deliver by a specific date (when) over those we can deliver any time
    (whenever). |

