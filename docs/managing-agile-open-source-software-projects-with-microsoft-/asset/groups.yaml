    # 第3 章：构建可解决方案


    决定性测试是评审人员、测试人员以及最终利益者如何感知解决方案。假设我们去当地杂货店买了一罐烤豆。我们阅读了如何打开罐头的简短说明，我们期望什么？是关于计划、收获和加工烤豆的详尽文档，还是准备好食用的番茄烤豆？可能是后者。

    每个 sprint 都是团队交付交付更新并获取客户诚实反馈和指导的机会。


    ## 演示 (Demo)


    演示是团队、领导层和利益相关者面对面（首选）或通过视频进行同步的机会。演示团队承诺的每个故事，并讨论利益相关者的诚实反馈。

    在交付工作演示后，团队应该清楚地了解 sprint 目标是否达成——以及如果未达成，需要在下一个 sprint 中计划什么。


    - 2-3 分钟的演示视频“非常棒”。测试人员/评审人员处于评审验证测试的最佳位置，并产生视频演示和视频文档。为了产生最大影响，请将视频时间保持在 2 分钟（最佳）到
    3 分钟（最多）。


    对于演示视频的价值和努力一直争议。价值是不言而疑的！第一印象是持久的，精制的视频比现场演示传递更强的信息，现场演示“由于许多我们控制之外的原因而失败”。专业的演示需要仔细的计划、练习和一点运气，这些都涉及大量的时间投入。录视频和运行测试是无缝的，不需要额外的努力，并交付可以轻松编辑成
    2 分钟演示的内容。

    保持演示（视频）简单！计划将创建演示作为 sprint 计划的一部分，而不是事后补救或现场演示的最后替代方案。


    ## 回顾 (Retro)：一项创新


    回顾反思的意图是从 sprint 中的教训和经验中学习，并不断改进和适应我们的流程以使项目更有效。通常，回顾会议收集团队成员的证据以及在过程指标（如节奏以及已计划、完成和遗留的工作）方面的定量证据。


    - 同意一项创新

    每个团队都应该同意一项提高其效率和生产力的创新。


    在地理分布和兼职团队中，安排回顾会议可能是一项巨大的任务，并导致没有建设性的反馈，特别是在“埋头工作”的 sprint 期间。另一种方法是 Scrum Master
    在整个 sprint 期间收集定量证据，并要求团队仅同意一项创新作为下一个 sprint 的部分。


    ## 计划 (Planning)


    计划下一个 sprint 是完成当前 sprint 的。对于具有经过整理且定义良好的待办列表的精细团队，这可以作为最后一次日常会议的一部分并在 15–30
    分钟内完成。另一种方法是安排一次 sprint 前的会议，产品所有者在那里重申核心目标和功能，团队可以在其中进行脑脑暴、精炼、排序和估算待办事项。也称为待办列表
    (backlog)。


