    Jeff is the Program Management Director of the Visual Studio team. In this role,
    he coordinates many aspects of the Visual Studio effort from planning to release
    to collecting customer feedback. As a result, he is involved with each of the
    teams sharing Visual Studio and "dogfooding" many parts of the system to do his
