    ## 接下来？


    现在取决于你了 . . .


    我们进入了一个我们不断反思自身、创新并进化的时代，正如用户需求和软件解决方案演进得一样。我们需要确保对用户，否则将面临快速灭绝。


    在书中总结我们的收获和建议是这段长期旅程中最有趣、短暂且简单的部分。我们希望我们提供了可操作的见解，激发了你们环境中的潜在创新，并且你们将继续支持和鼓励自组织团队。


    ## 持续创新


    对我们来说，这不是道路的终点。随着 Visual Studio Online138 等产品的演进，我们将创新、适应并改进自己的框架。如果书中的实用指南证明是有价值的，我们可能会对该出版物进行修订。


