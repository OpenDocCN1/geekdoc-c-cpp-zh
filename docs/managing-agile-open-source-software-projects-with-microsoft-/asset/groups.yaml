    ### GEM | 主动反思“快速”调查

    对于依赖兼职志愿者且地理位置分散的团队，我们发现在线反思调查有助于团队快速收集好的、坏的和糟糕的反馈。我们可以利用调查反馈来加速反思讨论。


    ### 培训-研究-规划 (TRP) 作为补救措施


    对“培训-研究-规划”的关注鼓励团队实践主动的冲刺规划，减少模糊性和任务管理。通过现实且准确的估计，团队能够频繁且定期地交付可行的软件。随着时间的推移，可以为每个团队确定一个现实的速率，并在社区中进行标准化。在每次冲刺中达成一项创新共识减少了因会议导致的时间浪费感，但持续鼓励了反思和创新。


    ### 核心学习点


    - 对“培训-研究-规划”的关注有助于团队自我教育，并理解和定义底层解决方案的什么、为什么以及如何做。

    - 估计在项目中起着巨大的作用，特别是标准化的估计。标准化的估计有助于简化估算工作并提高估计准确性。这反过来有助于团队频繁、定期地交付软件并进行持续改进。

    - 记录的面对面（Vface-to-Vface）会议提供了透明度和信息获取途径。


