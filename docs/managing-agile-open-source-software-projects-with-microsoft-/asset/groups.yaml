  - '[PAGE 148]


    # Case study: ALM Readiness Treasure Map . . . walking the plank


    Managing a virtual team distributed around the globe and establishing a team identity
    is a complex challenge. We introduce the ALM Readiness Treasure Map team because
    they have managed to create a cohesive and effective team scattered across Brazil,
    Canada, India, South Africa, the United Kingdom, and the United States (Figure
    104 and 105).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_148_0.png)


    Figure 104. Captain Robert Bernstein^{133} introduced an exciting team spirit
    and identity.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_148_1.png)


    Figure 105. Distributed ALM Readiness Treasure Map team.


    # Background information


    The team''s original motivation was to provide a master catalog (treasure map)
    of the available ALM Readiness content to guide and track anyone through the process
    of becoming proficient in ALM practices. The design and development of the map
    intended to dogfood new concepts and technologies while delivering a quality reference
    solution. Find more information at TOC—ALM Readiness Treasure Map.^{134}


    ${133} http://blogs.msdn.com/b/willy-peter-chaubs/archive/2012/03/04/introducing-the-visual-studio-almers-rangers-robert-bernstein.aspx

    ${134} http://aka.ms/vsartmotoc


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio'
  - '[PAGE 149]


    # Team and their use of technology


    The team operated with clear rules, responsibilities, and ownership, using our
    process and scheduling weekly scrum meetings. We constrained these meetings to
    15 minutes of status feedback and 15 optional minutes of questions and answers.
    As part of the team inevitably attended the meetings at dawn, during business
    hours, or in the evening, the management of time was important to use time and
    limit impact on real jobs and family time.


    Visual Studio Online (VSO), Microsoft Lynx, and Skype have been the home of the
    team from the start of their journey. They continue to push horizons, learning
    and researching about new Visual Studio and Windows features, dogfooding emerging
    VSO features and process innovations.


    The recently teamed TFS Agile Poker and the Lynch poll forecast to estimate their
    stories and tasks for the next adventure. The result was candid feedback to Mike
    Douglas¹¹³⁶ of TFS Agile Poker, and the realization that playing poker is free
    and rewarding to estimate as a team, but polls are a great suck bottom (106).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_149_0.png)


    Figure 106. Using TFS Agile Poker (left) and the Lynch poll to estimate stories.


    The team created a treasure hunt and evolved a pirate identity, which created
    an inspirational team dynamic. Meetings to start with "................." Team
    members who failed to deliver on their objectives had to walk a virtual park.
    A treasure map without the captain at the helm (podium) is just not the same.


    # Key learnings


    +   - We have to be cognizant that we are working with a variety of different
    cultures and that we can neither make assumptions about cultural norms or customs
    for granted.

    - We have to acknowledge that all persone and stakeholders have much to learn
    from each other. Information and responsibility sharing is key to productive and
    rewarding team effort.

    - We have to realize that there is a time to be serious and a time to have fun.
    Getting the balance of serious versus fun and work family optimally calibrated
    is not easy, but it is important to morale, productivity, and health.'
  - '[PAGE 150]


    # # Afterword: We are definitely not dysfunctional!


    Context: "Our final sprint is blocked and potentially delayed again."


    We need to fine-tune our value stream from start to finish, automating everything
    and raising events as early as possible. Does this ring a bell? Just like a factory
    line or a release pipeline, we strive to automate the entire creation process.
    Delivering business value is not just about raw speed, it is about agility, detecting
    and resolving impediments early, and a willingness to take a risk. "Do and ask
    for forgiveness later" is advice we hear and often.

    Focusing our final sprint on quality and planning, we ensure that Product Owners
    (PO), Program Managers (PMs), and selected Project Leads (Pls) sit together, discussing
    what needs attention and looking for wait times. Figure 107 highlights the often
    potential problematics in our assembly line.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_150_0.png)


    Figure 107. The last sprint, focused on quality and planning, shows bottlenecks.


    Snippets of the dialogue from one of these meetings:


    +   * "Do you agree this enables our Config as Code for DevOps and ALM practitioners¹³⁷
    project? Willy asks.

    * Keith poanders the diagram. "Yes, and we started the codepyping and quality
    essentials earlier, to ensure we do not create bottlenecks in the last sprint."

    * "Anything else we could improve to make the Product Owner more effective?"

    * "The farewell was one thing that slipped my mind and created a substantial level
    of ''Angst.'' I recommend that Product Owners be reminded of these core deliverables
    during each sprint to keep them on their radar."

    * "What went well for you, Keith?"'
  - '[PAGE 151]


    Afterword: We are definitely not dysfunctional!


    +   - "The team, status, backlog transparency and unrestricted access to the potentially
    shippable increments allowed me to proactively review and give candid feedback."

    - "Great, candid and actionable feedback," Willy says with excitement.


    What this brief elapse and case study demonstrates that our framework, developed
    and refined during years of dogfooding, is not perfect. Reflection, continuous
    improvement, and a willingness to take risks and embrace change are instrumental
    to our success.


    # Influenced by giants


    Our framework is based on a number of trusted, established, and proven technologies
    and frameworks, such as Lean thinking, Agile, MSF, Scrum and the Scaled Agile
    Framework (SAFe 108). In addition, we stand on the shoulders of giants from the
    ALM community and a mantra of continuous inspection and adaptation.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_151_0.png)


    Figure 108. Influenced by giants.


    There is no silver bullet, no framework that suits them all. or no one individual
    who has all the experience and drive to enable communities such as the Visual
    Studio ALM Rangers to become overnight. It is a continuous journey that requires
    tenacity, passion, experience, and a willingness to uncover impediments, realize
    that we are not perfect, adapt, and improve.'
  - '[PAGE 152]


    # Ruck == Loose Scrum == Scrum != Dysfunctional


    The final myth we dispel is that we are rebellious and dysfunctional anti-Scrum
    activists. We have done what Scrum encourages us to do ... inspect, adapt, and
    improve (Figure 109).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_152_0.png)


    Figure 109. Ruck is at this illustration "loose Scrum" and hence Scrum.


    Looking at this illustration, we recognize the foundations of Scrum and our adaptation
    to our geographically dispersed, part-time, and volunteer-driven community more
    effective. Yes, we introduced the Program Manager (PM) as a pivotal and supposed
    stakeholder, we have instead of daily scrums, and we have reviews of reviews for
    better transparency and cross-team collaboration, retrospectives based on online
    surveys, and a quick one-minute chat. We have adapted our framework and, we are
    not pure Scrum. We are effective and constantly inspecting and adapting ... not
    something we would find in a dysfunctional team.


    Thank you for your interest in our dogfooding, your candid feedback, and for bearing
    with us up to this page. We are all incredibly proud of what we are, as a community
    of passionate, motivated, experienced, geographically distributed, and part-time
    volunteers who have achieved. We urge you to embrace reflection, innovation, change,
    and risk. You, too, will look back and say:


    > "Wow, we really did it"'
  - '[PAGE 153]


    # What’s Next?


    It’s up to you now . . .


    We have entered an era where we continuously reflect on ourselves and innovate
    and evolve as rapidly as user requirements are changing and software solutions
    are evolving. We need to ensure that we maintain to the user, or we face rapid
    extinction.


    Summarizing our learnings and recommendations in this book was the fun, brief,
    and easy part of a potentially long-term journey. We hope that we have given you
    actionable gems, initiated around potential innovations in your environment, and
    that you will continue to support and encourage self-organized Agile teams. We
    encourage you to give us candid feedback and wish you success in your software
    adventures.


    # Continuous innovation


    For us, this is not the end of the road. As products such as Visual Studio Online138
    evolve, we will innovate, adapt, and improve our own frameworks. If the practical
    guidance summarized herein proves valuable, we may even meet for a revision of
    this publication.


    # Further information


    For further information, please visit Visual Studio ALM Ranger Solutions Catalogue139
    or email the authors.140


    138 http://www.visualstudio.com/products/what-is-visual-studio-online-vs

    139 http://aka.ms/visualsolutions

    140 vsarAsm4Dpt@visualstudio.microsoft.com


