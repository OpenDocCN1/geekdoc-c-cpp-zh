    图 99（常见标记点）于 2012 年 7 月 1 日开始 S1。


    我们成功创建了一个受控的环境、节奏和同步机制，并减少了不可预测的事件。我们并不完美的软件工程星球由地理分布的兼职志愿者团队组成，但这尚可接受。然而，我们没有将迭代与三周的广泛工程节奏对齐，正如图
    100 中的假设示例所示。


    ## (节奏 + 同步) = 不步一致的团队


    | 7月 | 8月 | 九月 | 十0月 | 11月 | 12月 | 1月 | 2月 | 3月 | 4月 | 5月 | 6月 |

    |---|---|---|---|---|---|---|---|---|---|---|---|

