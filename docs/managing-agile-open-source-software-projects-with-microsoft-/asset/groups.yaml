    # Chapter 2: Getting ready


    # Cost estimations


    Seasoned teams will have a cost estimate per story point and an average velocity
    of story points per sprint. Multiplying the story points by the cost per story
    point, we can determine an estimate for the release backlog. Part-time community
    projects, we often misunderstand the resource bandwidth commonly based on volunteer
    time as zero cost.


    Although teams and volunteers might not perceive monetary value in what they do,
    it is important to estimate Product Backlog Items (BPI) and stories as accurately
    as possible. Effort, expertise, and the sacrifice of precious family time must
    be calculated in monetary value, which is understood by both the technical and
    business stakeholders.


    # Ideal estimations


    In an ideal world, we would estimate every functional and nonfunctional requirement
    in terms of expertise, cost, and hours (time) we have developed to analyze, design,
    develop, test, and ship the feature. Multiplying cost by time, adding up all the
    features costs, and adjusting for loss of value due to delay, would give us a
    total release cost.


    However, in an agile world, we strive to deliver working software over detailed
    documentation, customer collaboration over negotiation, and respond to change
    following a plan. These agile values make it very difficult to determine a precise
    time or cost estimation.


    # Normalized estimations


    For distributed, and (especially) part-time teams, we use a normalized estimation
    strategy based on a number of prerequisites:


    +   Fibonacci⁵⁰ (Wikipedia, Fibonacci, 2015) for (example, 0, 1/2, 1, 2, 3, 5,
    8, 13, 21, and so on). When we are Planning Poker²¹ (Wikipedia, Planning Poker,
    2015), 0 means no effort required and it is too complex or impossible to estimate
    the effort.


    +   Estimations are based on a perfect world, full-time, and colocated team and
    the unavailability of expertise.


    +   We base estimates on one developer/contributor and a tester/reviewer pair
    story. This implies that a story is not complete until we have developed and tested
    it and the story is ready to ship.


    +   Estimations need team consensus. If there is a disagreement, we deestimate
    or respect the respect the story for further investigation.


    +   We estimate stories relative to the 1-story point reference story. A 13-story
    story should therefore take approximately 13 times as much (not time) to ship
    than the 1-story point reference story.


    +   We estimate stories considered smaller than the 1-story point reference as/2.


    +   Stories estimated at 21 or higher need to be broken into smaller stories.


    When planning Planning Poker, using Lynch, or estimating with cards sitting around
    a table, the facilitator ensures that there is no bias caused by others showing
    their estimations or through the team the estimations of the more experienced
    members or team leads.


    As normalized estimations are atypical, it is important that we ask ourselves
    a few questions and delve into the details.


    > ⁵⁰ http://en.wikipedia.org/wiki/Fibonacci


    > ²¹ http://en.wikipedia.org/wiki/Planning_Poker


