    # Preface


    In January 2006, I moved from Microsoft Consulting Services in Munich to Redmond
    and joined the Visual Studio product group. A few months later, we founded the
    Visual Studio ALM Rangers with the vision to fill feature and guidance gaps "Let''s
    solve our problems instead of complaining" was our motto, which resonated with
    ALM practitioners. Today, we have helped dozens of customers with large numbers
    of downloads and top ratings.


    If there is only one reason for this book, it is sharing practices. What we have
    learned and shared over the past busy years have revolutionized the art of open
    source software for the community development.


    This book is a library of practices that we created and matured through dozens
    of iterations. To make it easier to digest, we have arranged these practices in
    chapters. Each chapter represents the main operations of the community. These
    practices cover our business end to end, from ideas to shipped products.


    Every good solution starts with a good idea. Just like other ideas, we collect
    all ideas in a systematic and structured way. I used to call this "mathematical
    democracy," where the community decides through votes, what we work on and what
    is the most important thing to do.


    We are hands-on practitioners. We use our tools to develop our solutions and recommend
    them only if they work well for us. Typically, we extend the concept of "dogfooding
    by using and testing what we create in real customer projects.


    We are also about readiness. We have mastered this area by merging readiness and
    problem solving as one continuous and overlapping practice. Every project starts
    with a readiness. Our motto is "If you don''t understand the space, you can''t
    solve the problem." Readiness is a prerequisite for efficient production.


    When it comes to development, our famous "laser focus" meets pragmatism. No scope
    creep and no gold plating. We prefer to put all our energy into the quality of
    our solutions.


    We wrote this book to share our knowledge with the community of ALM practitioners
    in the spirit of open source, enabling others to repeat our success.


    > Bijan Jivindi, Principal Program Manager


    The practice of "eating your own dogfood" has a long history at Microsoft and
    within the Visual Studio team in particular. The notion that using your own product
    to build your product and adopting the latest versions before your customers is
    a powerful and compelling notion. The effect of the practice is so strong that
    it is clear to which many members we have broad adoption within the team a result
    of their polish, utility, and reliability. Even the initial impact on the productivity
    of the dogfood "eaters" is considerable, the return on investment to both internal
    and external customers is significant, making the practice worthwhile.


    The ALM Rangers have been longtime users of Visual Studio Online (VSO). In fact,
    they started VSO before it was called VSO. Starting in April 2011, and two a half
    years before the general availability of VSO, the ALM Rangers began using VSO
    in nascent.


    While the journey has not always been smooth, the benefits of our collaboration
    with the ALM Rangers have been always using the service, so we regularly hear
    from them when it seems though something goes wrong with the service. We have
    a direct connection to the engineering team that runs VSO and are not shy about
    providing our feedback. We have even been on the cutting edge of some service
    upgrades that did not go as well as planned. Their quick feedback has prevented
    others from experiencing outages or other errors in the service. We thank them
    for their dedication and commitment to the success of VSO. It is clear from the
    high-quality service VSO has become that-the-ir efforts are paying off.


    > Jeff Beehler


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online'
