    最后，感谢 Clemis Sterny 赞助了这本书，并感谢我们所有的 ALM Rangers 为 ALM 社区付出的非凡热情、奉献精神以及对宝贵家庭时间的投入。


    你们都太棒了！


    ## 第 1 章：想法筛选（Triage of ideas）


    说服人们去做某事并让他们认为那是他们自己的主意，是明智的。

    —纳尔逊·曼德拉


    由于有200多位领域专家同时在至少五个项目上协作，我们可以认为自己是投资组合管理中的一个小型企业。然而，我们的两个核心价值观驱动着我们：偏于简单和低技术复杂度，并持续对
    Visual 应用程序生命周期管理工具进行定期“内部自用”。我们在书中介绍的需求、所有权和管理概念是基于 Visual Studio Online (VSO)
    的功能以及我们共同筛选的利益相关者想法所产生的结果（图1）。记住，简单至上！


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_18_0.png)


    图 1。生命周期：需求和所有权的筛选。


    ### 想法的飞行（Flights of ideas）


    在 Visual Studio Online 中，我们通过 Epic 类型项目（WIT）来表示想法，并装饰以一个或多个标签，以与想法来源（我们发现想法的地方）、主题和倡议保持一致。


    > 敏捷投资组合管理：使用 TFS 支持跨团队的待办事项列表 (Boer & Ferrell, 2013)。


    > 什么是伟大的想法？

    就像没有糟糕的问题一样，也没有糟糕的想法。对某些人来说可能很狂野的想法，对另人来说却是“跳出思维”和创新的指标。一个想法应该是大胆的，或是超凡脱俗的，并且能够提供差异化的创新。


    从高空视角来看，我们将项目视觉化为“飞行”（flights），这是一个广为人知的比喻。每次飞行都有时间限制，在项目飞行期间，有一支或多个团队共同工作，并在着陆时交付解决方案。


    ### 角色、职责和所有权


    我们在附录 B “吃自己的狗狗粮是关键”的“角色作为胶水”章节中介绍了常见的角色画像（personas）及其职责。某些角色的头和职责可能与其他角色发生重叠。这视组织而异。


    ## 第 1 章：想法筛选


    我们需要若干角色来驱动整体愿景、拥有并维护待办事项列表，并在需求和所有权筛选期间与所有利益相关者进行协调。


    表 1 列出了两个角色，并总结了他们在筛选阶段的职位、职责和所有权：


    | 角色 | 职责 | 所有权 |

    | --- | --- | --- |

    | 项目经理 | 与团队、筛选小组和领导层合作以详述想法，参与评审，协调并驱动想法筛选。 | - 筛选小组<br>- 筛选<br>- VSO 环境 |

    | | 维护运行环境和想法待办事项列表，为筛选小组制作想法报告，并帮助启动新飞行。 | - 想法收集<br>- 预筛选 |

    | Scrum Master | 指导团队，执行框架指南，消除筛选期间提出的障碍，并积极领导持续改进和培训工作。 | - 流程<br>- 框架<br>- Scrum
    Masters |


    表 1。筛选阶段的角色、职责和所有权。


    这两个角色中的一个或两个将与筛选小组的其他利益相关者合作，该小组负责选择和协调下一下一波倡议。


    # 想法管理


    我们处理想法，筛选它们并将其解决方案。ALM 社区和利益相关者提交了伟大的想法（通常称为倡议、投资主题或产品主题）。


    将解决方案视觉化为：开始（黎明）、全面运行中（白昼）以及解决方案价值消退的时期（黄昏），有助于突出想法的风险和价值。想法需要收集、整理并按优先级提交给筛选小组，以理解其价值。投资新的（黎明）、现有的（白昼）或退役的（黄昏）。


    # 捕捉想法


    与农民不同，我们没有收获想法的季节。我们全年从多个来源收集想法——无论想法是小、大还是超凡脱俗（见图2）。我们主要的收集渠道是活动、论坛以及与产品组、ALM
    Rangers 和社区的面对面讨论。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_20_0.png)


    图 2。收集新想法。


    我们在任何想法待办事项列表中捕捉所有与我们的使命宣言相符的想法。


    **我们的使命：**

    Studio ALM Rangers 为社区提供专业的指导、实践经验和填空白解决方案。


    我们使用 TFS 工作项捕捉每个想法，并使用支持信息作为描述。源自 UserVoice，我们利用票数来驱动业务价值。我们根据已知的产品和营销策略优先考虑感知重要性。


    **避免将业务价值与金钱价值挂钩**

    使用波那契数列进行优先级排序可以避免尝试将业务价值与货币影响联系起来。或者，你可以使用任何具有更大业务价值或影响的数字。如果你不确定在业务价值字段中填写什么，这是一个很好的起点。


    在此时点捕捉的信息是“原始”的，因为除了少量的编辑外，我们按原样记录发起者的想法和背景。然而，我们鼓励想法至少定义“是什么”、“为什么”和“何时”，以减少理解和误解。


    我们使用标签来识别想法。类型标签将想法分类为业务、架构或流程想法（见表 2）。来源标签标识想法的来源。


    在本文编写期间，我们正在推行标签和自定义的需求类型项目项字段。推荐的方法是使用自定义字段，但如果你无法自定义项目，模板标签是一种备选方案。


    | 类型 | 描述 |

    |---|---|

    | 架构 | 关注架构或基础设施变更的想法，这些想法通常是可用的且不断演化的。 |

    | 业务 | 关注业务功能或用户体验的想法。这是我们的默认类型。 |


    '
