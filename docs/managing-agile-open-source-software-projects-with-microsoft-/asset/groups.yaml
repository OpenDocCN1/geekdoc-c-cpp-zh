    ## 可发布版本


    关于一个发布版本是否可发布的问题，比我们何时应该发布更容易回答。


    ## 何时一个发布版本是可发布的？


    简单！当我们获得产品负责人（Product Owner）的“点赞”信号时，我们就有一个可发布的版本。


    我们这种简单性基于这样一个假设：产品负责人定义、拥有并跟踪了待办事项列表中的愿景、目标、验收标准和功能。一次成功的飞行和着陆需要持续参与 Scrum 会议、成果演示（show-what-we-have
    demonstrations），并从产品负责人处接受冲刺交付物（图 87）。这通常是解决方案生命周期中的主要角色执行工作；实际参与可能是零星、兼职的，并且需要项目经理的大量支持，以及对地理分布的、兼职的社区项目的整个团队的信任。


    使用 Microsoft Visual Studio 管理敏捷开源软件项目

    101 / 151


    ## 第 4 章：提高质量标准


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_105_0.png)


    ## 起飞与途中着陆


    图 88。产品负责人在兼职飞行期间参与的简化视图。


    正如我们之前讨论过的，产品负责人确定 ① 功能，拥有并 ② 跟踪目标、验收标准和范围，③ 在 1–3 个开发冲刺期间内跟踪并与团队协作，以及 ④ 接受质量标准。此外，产品负责人可以在准备发布时推迟功能和相关的用户故事，或将它们完全从范围移除。


    产品负责人在起飞前、飞行期间和着陆后都“拥有”发布版本。这是一个关键角色，通常被称为项目的“灵魂”。“比特和字节”（技术细节）的终点到产品负责人为止！没有“灵魂”，没有“脉动”，意味着没有可发布的版本。


    步骤 ③ 是一种仪式性的，我们稍后会讨论。


    ## 我们应该何时发布？


    这是一个更困难的问题，也是我们在上一个图中步骤 ⑤ 之后停顿的原因：我们何时才让飞机着陆并“发货”？在这个阶段，我们的团队已准备好发布，信心很高，兴奋情绪随着不祥的鼓点声而高涨。


    产品负责人的下一个重要责任是与利益相关者同步，并确保着陆对组织和社区产生最佳影响。一些重要的考虑因素包括：


    - 系统支持团队已准备绪并能够支持新版本。

    - 发布不会对任何其他即将发布的版本产生负面影响。

    - 社区目前没有被活动或其他产品发布淹没。

    - 社区没有被过于频繁和大量的发布所压垮。


    理想情况下，“何时”是在冲刺结束之前或与之同时（图 88）。


    使用 Microsoft Visual Studio 管理敏捷开源软件项目 版

    102 / 151


    ## 第 4 章：提高质量标准


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_106_0.png)


    图 88。团队越早拥有可发布版本，就越早能够专注于创新和规划。


    如所示，产品负责人有三个选择：① 提前发布（理想），② 按时发布，或 ③ 如果冲刺不理想，则推迟并让飞行进入等待模式。


    ### 我们发布的是 Beta 版还是 RTM 版？


    在**执行静默发布**中，我们讨论过一个或多个 Beta 版静默发布的概念。现在是深呼吸、后退一步并查看我们开发团队使用的非常成熟的里程碑的好时（图 89
    和表 10）。


    我们将这些里程碑和工作流视为一个实际案例，而不是实际指导，因为你需要定义一个适用于你和你所在环境的工作流。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_106_1.png)


    图 89。解决方案里程碑。


    | 里程碑 | 描述 | 现状 |

    | --- | --- | --- |

    | 原始 (Raw) | 指研究和原型设计期间执行的所有活动，通常在冲刺期间进行 | 未知 |

    | 预览 (Prealpha) | 指在开发冲刺期间执行的所有活动 | 未知 |

    | 内部 (Alpha) | 我们开始测试和评审的第一阶段 | 不稳定，功能不完整 |


    使用 Microsoft Visual Studio 管理敏捷开源软件项目 版

    103 / 151


    ## 第 4 章：提高质量标准


    | 里程碑 | 描述 |

    | --- | --- |

    | Beta “静默” | 此阶段解决方案已具有功能但充斥着 Bug。在处理 Bug 修复和整体改进的同时，团队可能会决定仅限内部的私有 Beta，向选定的受众开放。
    |

    | Beta “公开” | 产品负责人签署质量标准并确认解决方案已准备好公开 Beta。意图是展示并获取真实反馈。 |

    | RTM | 交付制造版（RTM）或“金光 CD”是一个里程碑，此时团队已完成所有活动，尽可能改进了质量并解决了所有 Bug。与公开 Beta 一样，解决方案会因此展示出来。
    |


    表 10。成熟度里程碑。


    现在我们对里程碑有了更好的理解，可以回到问题了：“我们发布的是 Beta 版还是 RTM 版？”


    这取决于产品负责人是否乐意对解决方案签署，以及是否满足了所有要求；如果是，交付 RTM 是首选。然而，如果质量标准已达到，产品负责人乐意签署，但仍有正在进行的活动，我们考虑公开
    Beta。这让我们能够将项目展示为“已着陆”，并将资源释放到其他冒险中。


    ## “发货”或“着陆”准备工作


    无法预测飞机具体何时以及如何着陆。诚实地说，对于兼职社区项目，没有必要准确预测；只需确保在产品负责人发出信号时团队准备好发布即可。我们作为专注于质量和规划的冲刺部分的积极预防措施包括：


    - 准备公告

    - 准备发布媒介，例如 GitHub 上，包括首页和下载包。

    - 准备团队使其能够监控并接收反馈、问题和其他事件。

    - 验证公告和文档方法涵盖了所有团队成员。

    - 验证所有流程——即核心要素已准备好完成。

    - 收集并分析飞行指标，以反思、学习并提高预测性。


    一旦团队开始放松和“闲置”，我们就处于启动并行活动以进行创新和未来的良好位置。检查清单示例请参见“通用模板”。


