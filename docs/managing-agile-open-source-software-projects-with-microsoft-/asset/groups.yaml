    ## 第1章：想法分流


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_33_0.png)


    图 17. 权衡三角形。


    我们的项目通常在两个到五个冲刺（sprint）时间箱内进行，具体取决于项目类别和功能集（表 6）。我们将任何超过这些时间箱的项目发布划分为多个更小的、可交付的发布，以确保我们有一致的节奏，这成为了投资组合层面的*心跳*。


    | 项目类型 | 准备就 | 开发 | 质量 | 时间箱 |

    |---|---|---|---|---|

    | 快速响应示例 | 0–1 | 1–2 | 1 | 2–4 个冲刺 |

    | 快速响应原型 | 0–1 | 1–3 | 1 | 2–5 个冲刺 |

    | 指南性 | 1 | 2–3 | 1 | 4–5 个冲刺 |

    | 工具类 | 1 | 2–3 | 1 | 4–5 个冲刺 |


    表 6. 每个项目类别的冲刺数量。


    一旦所有者同意路线图，我们就可以定义发布、建议的团队归属、里程碑以及建议的解决方案归属（图 18）。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_33_1.png)


    图 18. v3 的示例就绪团队映射分类。


    > GEM，作为兼职工作者，我们发现持续超过四个冲刺的项目会导致热情、能量和功能价值的流失。少做一点，尽早发布——我们总可以在下一次在此基础上构建并做得更好！


    到此时，我们准备好进入下一章以及项目生命周期的下一个阶段。然而，那些未被选中的或被遗留的想法该怎么办？


    ## 那些遗留的想法怎么办？


    如图 19 所示，某些想法可能无法进入想法积池（ideas backlog），未能通过分流筛选。另一些想法虽然进入了积池，但在其业务价值或相关性衰减之前，未能吸引到具备热情的所有者，或者不是任何行动的目标。


    注意：我们将这些想法称为“遗留的想法”或“无团队的想法”。我们并不简单地拒绝这些想法，而是将它们提交给社区进行最终分流。社区决定是否作为社区解决方案来处理该想法，并可由
    ALM Rangers 提供支持。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_34_0.png)


    图 19. 选择和拒绝项目想法的流程。


    演变为社区解决方案的快速响应解决方案示例包括 TFS Community Teams Line Line Utility 和 TFS Community Branch
    Tool。一个我们在 ALM Rangers 的协作和支持下，作为社区解决方案开发的想法示例是 Flight Plan（飞行计划）。


    ## 扩展飞行 . . . 多少才算太多？


    一种常见的业务策略是做得更多、更快、且投入更少。这在业务上是合理的，并且支持敏捷开发原则，例如《敏捷宣言》的原则一：“我们的最高优先级是尽早满足客户，持续交付有价值的软件”（敏捷宣言，2001b）。


    在地理分散且兼职参与一个或多个社区项目的团队世界中，领导力、协作和可扩展性的性质与在传统企业级规模组织中的体验和管理方式不同。我们专注于遍布全球的传统但日益增长的团队生态系统，团队成员参与多个项目，并主要负责兼职社区项目发布（称为“飞行”，flights）。


    基于几年的观察，利用粗略的监控和分析概念，我们的生态系统揭示了一些有趣的模式，如图 20 所示。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_35_0.png)


    图 20. 随着团队规模和项目数量增加，项目的感知价值和投入。


    显而易见，我们的团队和整个计划无法无限扩展。地理分布团队和成员需要协调的越多，项目负责人和计划经理对项目及整个生态系统所需的投入精力和精力分配就越大。


    与管理层争论（他们习惯了全职企业甚至全职的地理分散团队）是徒劳的——兼职和资源投入缺乏是挑战。


    - **支柱 #1——尊重人**（精益企业协会，2009）对我们来说可能是一个挑战。项目负责人和计划经理需要意识到侵犯宝贵的家庭时间、志愿者的角色，以及全球不同时区之间传统和文化的差异。这是一项真正有趣且有回报的努力，但绝对不利在业务价值需求和路线图时间表之间进行协调和平衡，而这两者都是完全无形抽象的。

    - **支柱 #2——持续改进**（精益企业协会，2009）是另一个潜在挑战。从本质上，我们从小开始，保持专注，持续反思和适应，并进化自己的生态系统，平衡社区热情和经济压力。我们保护并培养我们的社区；没有它，我们一无所有。


    在对想法进行分流和选择下一次冒险时，了解我们的局限性是一个重要的指标。


    ## 从开始到结束的可视化


    几年前，项目仪表板曾风靡一时并承诺带来成功的项目管理。遗憾的是，小组件、插件和颜色的过度使用和误用导致了令人目目的仪表板，使得人们难以发现“风暴眼”，并忽视信息直到为时已晚。


    我们依靠两个仪表板来可视化状态和随时间变化的趋势。第一个是任何旅行过的人都会觉得很自然的可视化。我们建议以下指南（如图 21 所示）：


    - 一个团队由最多七成员组成。

    - 项目负责人拥有一个飞行发布。

    - 计划经理负责一个到三个项目发布。

    - Scrum Master 负责项目直到团队变得自组织和自给自足。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_36_0.png)


    图 21. 团队和飞行的可扩展性。


    '
