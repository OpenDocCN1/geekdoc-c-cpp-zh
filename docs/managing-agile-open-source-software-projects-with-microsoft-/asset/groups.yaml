    # Chapter 3: Building the working solutions


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_92_0.png)


    Figure 73. Keep an eye out for negative signals.


    ## Deliver on demand with silent preview releases


    The silent preview release is our typical term or process checkpoint. It is a
    release we can introduce to a small group of "friends" for early feedback and
    possible realignment. The core intent is to give early adopters an opportunity
    to evaluate and give candidate feedback when the team raises the quality bars.
    (See Figure 74.) The intent during a silent release is not to awaken the pedantic
    quality, spelling, grammar, or coding style validations but to determine whether
    the team is in the "correct move" and avoid disappointment, confusion, and discouraging
    storms when they ship.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_92_1.png)


    Figure 74. Silent preview release a la whiteboard.


    TFS Feedback Management Behind the Scenes^77 (Lange, 2012)


    Looking at this immaculate whiteboard scribble:


    - 1. The solution feature teams construct the features and validate them as normal.


    > ^77 http://blogs.msdn.com/b/slange/archive/2012/10/04/vs-tfs-2012-tidbits-tfs-feedback-management-behind-the-scenes.aspx


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online


    89 of 151


    - 2. When the solution reaches a minimal quality level (as agreed at kickoff),
    the Project Lead (PL), Program Manager (PM), and Product Owner (PO) can consider
    and agree to "ship a preview silently."


    - 3. The working solution is shipped using a public delivery channel, for example,
    www.CodePlex.com, and clearly marked as beta. There is no public announcement,
    only an email announcement to selected friends, with instructions to evaluate,
    deliver feedback and not to tweet, or announce in any other form. Silence is golden!


    > Clarify the beta release! Example:

    - CAUTION. Wandering into territory can ruin anyone''s day, beware! We are conducting
    content active tests within an evaluation radius and this guidance should be used
    with caution during beta state.

    - PLEASE NOT blog, tweet, or make noise about this "silent" beta release!


    - 4. In parallel, the team continues to raise the quality bar. For example, technical
    editors review the content, correcting spelling, grammar, context, terminology,
    and other goblins. Having volunteers from around the world, with a variety of
    home languages, often results in deliverables that need fine-tuning.


    - 5. The silent release feedback is acted on, and when team members believe that
    the quality bars are met, once again their PL, PM, and PO for sign off. The result
    is another silent release or a public release with broad announcements.


    ## Dealing with bugs


    In this context, we refer to the work-item type Bug used to report missing or
    incorrect features, crashes, or unwelcome guests in software development lifecycles.


    ## Self-describing bugs


    The concept of "garbage in-garbage out" (GIGO) is also but very applicable! It
    is important to educate and guide anyone who captures a bug to take care when
    so. For example:


    - Title is the first and most viewed field bug. Make sure it is self-describing.

    - Specify the estimated effort and severity to help the triage.

    - Description and attachment data should be used to add context and evidence to
    the bug.

    - Area Path must be set to the appropriate feature.

    - Iteration Path should be set to a predefined path.

    - Assigned to the Project Lead (PL) or left blank if the originator is unsure
    who the PL is.


    Incomplete or bad data in a Bug WIT results in unnecessary delays or bugs vanishing
    off the radar. Some teams do not create bugs for those found by the team but only
    for those outside the team. The thought here is that the bugs are right away as
    part of the sprint since they were found in the sprint.


    ## Triage


    The Project Lead takes ownership of bugs and performs a triage, which can be discussed
    during the second half (Q&A) of the next scrum meeting.


    - Consult the owner of the bug if there is any uncertainty.

    - Consult the stakeholders to ensure the correct priority and severity are unclear.

    - Revise information to ensure clarity and accuracy.

    - Prioritize the bugs in triage of the quality bar. If our quality bar states
    that no critical bugs are acceptable, we should focus on critical bugs working
    on high-priority, medium-priority, or low-priority bugs.

    - Assign to a team member, who assumes ownership of the bug.

    - Set State to Approved.

    - Set Iteration Path (sprint) to the iteration (sprint) during which the bug must
    be resolved.

    - Link the bug to the associated parent feature or story (PBI).


    ## Resolve


    The owner of the bug optionally breaks the bug into actionable tasks, which are
    subject to the GIGO concept as well.


    - Set State to Committed when starting work.

    - Work with the testers/reviewers to validate resolution.

    - Assign back to the originator when resolved for final resolution.


    It is important to fix bugs in the various "show what we have" announcements and
    clearly identify all resolved bugs, constraints, and resolutions well as queued
    (unresolved) bugs.


    ## Dealing with impediments


    An impediment is anything that blocks the team from being productive.


    - It is the responsibility of the team to raise all impediments.

    - It is the responsibility of the Scrum Master and Program Manager to nudge and
    remove impediments.


    We need to ensure that the impediments light up our team for maximum visibility
    and awareness, as shown in Figure 75.


    ## Impediments


    | ID | Area Path | Iteration Path | Impediment | Title |

    |---|---|---|---|---|

    | 9754 | VisualStudio.AlM.UserSecurity | VisualStudio.AlM.Project\FY14\Sprint22...
    | Impediment | Research did not reveal Much |

    | 6343 | VisualStudio.AlM.Userseatmap | VisualStudio.AlM.Project\FY10\Sprint11...
    | Impediment | Reliable method for importing and exporting |

    | 9650 | VisualStudio.AlM.Userseatmap | VisualStudio.AlM.Project\FY14\Sprint21...
    | Impediment | Application Insights breaks the build |

    | 9733 | VisualStudio.AlM.UserInfactory | VisualStudio.AlM.Project\FY14\Sprint22...
    | Impediment | Hosting contract approval |

    | 9775 | VisualStudio.AlM.UserInfactory | VisualStudio.AlM.Project\FY14\Sprint23...
    | Impediment | Azure ACS is blocking numerous tasks |


    Figure 75. Impediment backlog.


    ## Dealing with scope creep


    A change in scope can result from an unexpected business or service requirement
    or from a requirement that''s misunderstood.


    The former is "valid" scope creep for the Product Owner determines that the business
    value of the remaining Features is no longer valuable, resulting in expensive
    waste.


    A misunderstood requirement is a disastrous scenario. If the solution''s vision,
    goals, objectives, or requirements are fluid or not, the resultant features and
    stories will be proportionally unstable. Some of the common signs of "bad" scope
    creep:


    - The Product Owner is not engaged with the team and shows little interest or
    passion in the solution.

    - The Product Owner''s expectations and team deliverables are not aligned at the
    end of a sprint.

    - The Product Owner continuously introduces feature, vision, goal, or objectives
    release changes.

    - The Product Owner cannot link scope creep to virtual architecture, business,
    or technology changes.


    Transparency and trust are key! Without transparency, there can be no trust. Without
    complete trust in the Product Owner, the team cannot be committed. It is paramount
    for Scrum Masters and Program Managers to get involved if there is dysfunction
    due to lack of trust, transparency, an inexperienced Product Owner, or poor backlog
    grooming or management.


    The Product Owner has the responsibility to determine whether a sprint, roadmap,
    or release is required. Nothing frustrates a team of volunteers more investing
    precious time in a solution that''s canceled and moth-balled. The Product Owner
    must take this into consideration before pulling the eject.


    ## Dealing with critical chickens


    Lastly, we need to recognize and deal with "critical chickens" who demivate the
    team. Critical chickens are team members or stakeholders who are determined to
    always point out what could, has, or is going wrong but neither


