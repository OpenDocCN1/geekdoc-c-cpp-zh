    ## Chapter 1: Triage ideas


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_33_0.png)


    Figure 17. Trade-off triangle.


    Our project typically works in two to five sprint time boxes, which vary by the
    project category and set of features (Table 6). We will divide any project release
    that exceeds these time boxes into multiple, smaller, shippable releases to ensure
    we have a consistent cadence, which becomes the *heartbeat* of a portfolio-level.


    | Project type | Getting ready | Development | Quality | Time box |

    |---|---|---|---|---|

    | Quick-response sample | 0–1 | 1–2 | 1 | 2–4 sprints |

    | Quick-response prototype | 0–1 | 1–3 | 1 | 2–5 sprints |

    | Guidance | 1 | 2–3 | 1 | 4–5 sprints |

    | Tooling | 1 | 2–3 | 1 | 4–5 sprints |


    Table 6. Number of sprints per project category.


    Once the owners have agreed to the roadmap, we can define the release, proposed
    team home, milestone, and proposed solution home (Figure 18).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_33_1.png)


    Figure 18. Example readiness team map categorization for v3.


    > GEM, working part-time, we have found that projects that exceed a four-sprint
    duration result in loss of passion, energy, and feature value. Do less and release
    sooner—we can always build on and do better next time!


    At this point, we are ready to proceed to the next chapter and the next step in
    our project lifecycle. However, what about the ideas that are not selected or
    orphaned?


    ## What about the orphaned ideas?


    As shown in Figure 19, some ideas may not make it into the ideas backlog, failing
    to get a thumbs up from the triage. Others may make it into the ideas backlog
    but fail to attract the prerequisite passionate owners or are not the targets
    of any actions before their business value or relevance decays.


    NOTE: We refer to these ideas as orphaned or "left team-less." Instead of simply
    rejecting the ideas, we submit them to the community for a final triage. The community
    decides whether to tackle the idea as a community solution, optionally supported
    by the ALM Rangers.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_34_0.png)


    Figure 19. Process for selecting and rejecting project ideas.


    Examples of quick-response solutions that evolved to community solutions include
    the TFS Community Teams Line Line Utility and TFS Community Branch Tool. An example
    of an idea that we developed as a community solution, with collaboration and support
    from the ALM Rangers, is the Flight Plan.


    ## Scaling flights . . . how many are too?


    A common business strategy is to do more, quicker, and with less. It makes business
    sense and it supports the Agile principles such as Agile Manifesto''s principle
    #1: "Our highest priority is to satisfy the customer early and continuous delivery
    of valuable software" (Agile Manifesto, 2001b).


    In the world of geographically dispersed teams working part-time on one or more
    community projects, the nature of leadership, collaboration, and scalability differs
    from how these are experienced and managed in traditional scale to enterprise-size
    organizations. We focused on the nontraditional but growing ecosystem of teams
    that are scattered across the globe, team members working on multiple projects
    and primarily part-time community project releases, also referred to as flights.


    Based on a few years of observations, using crude monitoring and analysis concepts,
    our ecosystem has revealed a few interesting patterns, shown in Figure 20.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_35_0.png)


    Figure 20. Perceived value and effort of projects as team size and number of projects
    grew.


    It is evident that our teams and overall program cannot scale indefinitely. The
    more that geographically distributed teams and more members need to be coordinated,
    the greater the amount of effort and distribution of focus is required from the
    Project Lead and Program Manager, over a project and overall ecosystem.


    It is futile to argue with management—who are used to full-time enterprise or
    even full-time geographically dispersed teams—part-time availability and lack
    of resource commitment are challenging.


    - **Pillar #1—Respect for People** (Lean Enterprise Institute, 2009) can be a
    challenge for us. The Project Lead and Program Manager need to be cognizant of
    infringing on precious family time, the volunteer''s role, and the variation of
    traditions and cultures across time zones and around the globe. It is a truly
    interesting and rewarding effort, but definitely not an easy to coordinate and
    balance with the demand for business value and roadmap timelines, both of which
    are utterly intangible.

    - **Pillar #2—Continuous Improvement** (Lean Enterprise Institute, 2009) is another
    potential challenge. Essentially, we start small, remain focused, continuously
    reflect and adapt, and evolve our own ecosystem, which balances community passion
    and economic pressure. We protect and nurture our community; without it, we have
    nothing.


    Knowing our limits is an important metric when triaging ideas and selecting our
    next adventures.


    ## Visibility from start to finish


    A few years ago, project dashboards were in vogue and promised successful project
    management. Unfortunately, the overuse and misuse of widgets, gadgets, and colors
    created overwhelming dashboards that made it difficult to spot the "eye of the
    storm" and ignore information until it was too late.


    We rely on two of dashboards to visualize status and trends over time. The first
    is a visualization that seems natural to anyone who has traveled. We recommend
    the following guidelines (illustrated in Figure 21):


    - A team consists of up to seven members.

    - A Project Lead owns one-flight release.

    - A Program Manager is responsible for one to three project releases.

    - A Scrum Master is responsible for projects until the team becomes self-organizing
    and self-sufficient.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_36_0.png)


    Figure 21. Team and flight scalability.

    '
