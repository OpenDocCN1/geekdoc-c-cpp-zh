    ## Kanban


    Kanban 是一种流程改进方法。最初，我们使用 Kanban 进行软件开发以识别瓶颈并减少浪费。在软件开发中，Kanban 关注流。目标是最大化从开发团队到客户的价值流。


    ## 可视化工作流


    工作流可视化对于理解工作如何在系统中移动至关重要。通过使用看板，我们可以看到工作在哪里卡住了。这有助于我们识别并解决瓶颈。


    ## 限制进行中工作


    限制进行中工作（WIP）是 Kanban 的核心原则。通过限制工作量，我们可以减少上下文切换并提高专注度。这也允许我们更快地完成任务。


    ## SAFe


    规模化敏捷框架（SAFe）是一个在跨组织范围内扩展敏捷实践的框架。它提供了一系列工具和实践，帮助团队更有效地合作。我们使用 SAFe 来管理我们较大的软件项目。


    ## 明智地使用工具


    使用正确的工具对于成功非常重要。我们发现某些工具可以帮助我们改进流程。但是，我们必须小心不要使用不价值的工具。


