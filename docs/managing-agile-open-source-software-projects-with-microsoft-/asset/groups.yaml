    Figure 76. Impediment dashboard.


    # Dealing with scope creep


    A change in scope can result from an unexpected business or service requirement
    or from a requirement that''s misunderstood.


    The former is "valid" scope creep for the Product Owner determines that the business
    value of the remaining Features is no longer valuable, resulting in expensive
    waste if developed.


    A misunderstood requirement is a disastrous scenario. If the solution''s vision,
    goals, objectives, or requirements are fluid or not, the resultant features and
    stories will be proportionally unstable. Some of the common signs of "bad" scope
    creep:


    +   * The Product Owner is not engaged with the team and shows little interest
    or passion in the solution team.

    * The Product Owner''s expectations and team deliverables are not aligned at the
    end of a sprint.

    * The Product Owner continuously introduces feature, vision, goal, or objectives
    release changes.

    * The Product Owner cannot link scope creep to virtual architecture, business,
    or technology changes.


    Transparency and trust are key! Without transparency, there can be no trust. Without
    complete trust in the Product Owner, the team cannot be committed. It is paramount
    for Scrum Masters and Program Managers to get involved if there is dysfunction
    due to lack of trust, transparency, an inexperienced Product Owner, or poor backlog
    grooming or management.


    The Product Owner has the responsibility to determine whether a sprint, roadmap,
    or release is required. Nothing frustrates a team of volunteers more investing
    precious time in a solution that''s canceled and moth-balled. The Product Owner
    must take this into consideration before pulling the eject.


