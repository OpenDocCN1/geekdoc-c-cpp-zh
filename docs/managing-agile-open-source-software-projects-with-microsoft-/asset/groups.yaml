    # Chapter 1: Triage of ideas


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_25_0.png)


    Figure 9. Triage process.


    # Top ideas


    The best candidates are those with the highest business value, that can be delivered
    most quickly, and that impose the least risk to the main product line and mission
    statement.


    When we brainstorm, it is important to consider variables such as value, viability,
    quality, cost, risk, and mission to be able to select and prioritize the right
    ideas.


    +   - **Mission** An idea needs to be in harmony with our mission statement or
    we will disqualify it.

    We rejected the idea "add UserVoice integration service" because it had a low
    community vote and was not aligned with our mission statement.


    +   - **Value** An idea needs to deliver additional value, quantified in terms
    of enabling more adoption of the main product, return on investment (ROI), and,
    most importantly, customer satisfaction.

    Delivering a gap-filling solution that uses Visual Studio testing has a higher
    value than a readiness solution that promotes future technologies. On the other
    hand, delivering a solution that has less today probably has a greater impact
    than delivering a solution that may have astronomical value in 10 years.


    +   - **Viability** An idea needs to be viable.

    The idea of sending a mission to Pluto might be a nice dream, and it may offer
    great value as our sun continues to expand. However, this idea is not yet technically
    viable.


    +   - **Quality** An idea needs to be within defined quality and a time box (roadmap).

    - **Cost** An idea must be affordable and deliver a cost or fortune to maintain
    in a nation in need of reconciliation capabilities to patrol vast oceans and ice
    may not deliver a return on investment.

    - **Risk** An idea may be phenomenal, but it may be risky to develop or may be
    a risk to the main product line.

    Developing a utility that exceeds the permissions of a user may be a strategic
    idea, but if it negatively affects the performance and stability of an operational
    product, it may be too risky.


    +   - **Bandwidth** An idea needs bandwidth for a variety of dedicated resources.

    The best idea can turn into a nightmare if the required resources, subject matter
    experts (SMEs), and processing bandwidth is not available.


    +   - **In-flight limit** An idea requires focused attention.

    The meals served by a cook on a handful of dishes are highly likely to be more
    successful (tasty) than meals served by a cook to coordinate dishes of dishes.
    As shown below, there may be a number of flight solutions at the time of the triage.
    This reduces the number of new projects that we can consider.

    Figure 10 ideas are triage cannot and overlap through the year.


