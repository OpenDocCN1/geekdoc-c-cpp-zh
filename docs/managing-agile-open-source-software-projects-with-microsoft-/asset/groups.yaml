    # Chapter 3: Building the working solutions


    Team transparency is based on the scrum meeting, also known as the "heartbeat"
    or "pulse" of the team. Typically a daily ceremony is a weekly (recommended) or
    biweekly event in our ecosystem, made up of a 15-minute review of status and an
    optional 15-minute discussion slot.


    # Weekly heartbeats “rock”


    With geographically distributed, part-time, and virtual teams, a weekly scrum,
    which adheres to 15+[15] minute time block, is recommended.


    Here’s a recommended breakdown and flow of the scrum meeting:


    0–15 minutes: status


    +   - Share the overall status with the team, relying on visual information such
    as the burnout chart.

    - The Scrum Master asks the team whether anyone has to go first and then iterates
    with the rest of the team (for example, alphabetically).

    - Every team member shares what was done since the last scrum, what they are and
    will be doing, and impediments, if any. The Scrum Master ensures the discussions
    remain within the domain/doing/impediments boundaries and makes a note of all
    other discussions to the optional 15-minute Q&A.

    - Review all impediments, both previous and new.


    16–30 minutes: Q&A


    If there are no topics to discuss, the scrum meeting ends after the status update.
    During the optional 15-minute Q&A, team members have the option to stay and participate
    in discussions or to leave the meeting.


    What about those who cannot make the scrum?


    Team members who cannot make the scrum must notify the team and share their heartbeat
    (done, doing, impediments), preferably before the scrum but definitively before
    the poststand housekeeping is done. Members who fail to show a heartbeat are known
    as dark zombie suspects!


    # Postscrum housekeeping


    The scrum status, impediments, discussion notes, current backlog, and visual information
    radiator (dashboard, charts/scrum chart sheet) are updated and shared with the
    team and all stakeholders. Remember, transparency is key!


    How and where the teams keep the scrum notes is not as important as every team
    knows where to find the notes. For example, we can use Visual Online and a task
    item to store the scrum notes, associated documentation, and links to other items.
    Considering the link tasks to the Program Manager (PM) bucket backlog product
    item (PBI), which we introduced in “Team infrastructure,” and which contains the
    objectives and the acceptance criteria information. (See Figure 64.)'
