    # Chapter 4: Raising the quality bar


    +   - Solution responsibility and ownership through pride down to the bits and
    bytes

    - Customer satisfaction


    > NOTE The value of test-driven development and unit testing is to ensure that
    the team thinks and even dreams about the code, scrutinizes the requirements,
    and proactively avoids problems and scope creep.


    # Quality essentials


    The concepts and definitions of quality, process compliance, and validation vary
    from organization to organization. With every solution, teams need to consider
    the quality essentials that define engineering policies, standards, and procedures.
    These quality essentials influence all our adventures and projects flights.


    As we have already mentioned, the quest for quality should not be an afterthought!
    We review and implement the requirements for our environment as early as possible.
    The quality essentials embrace both mandatory policies and practical guidance
    that ensure our solution is compliant with the latest standards and user experience
    guidelines and results in satisfied users.


    Examples of the type of engineering policies may include:


    +   - Accessibility Focused on making easier and more intuitive for users to see,
    hear, and use the solution on a computer device. For example, using the color
    red and green to signal states can be a compliance issue. The most common form
    of color deficiency is "red-green color deficiency," not to mention that many
    screens and printers are monochrome.

    - Export controls Products subject to export and import control laws in many countries
    and regions. While this is not enough to prevent all compliance issues, awareness
    of public laws is good when planning and designing a solution that targets an
    international audience.

    - Geopolitical Solutions must be politically and culturally sensitive and cognizant
    of local laws and regulations. Avoid using national symbols, flags, or icons of
    political, religious, or contentious matters.


    > WARNING First impressions last! In an ALM workshop, many years ago, a colleague
    had a slide with a "knight in shining armor" to replace the Scrum Master who comes
    to the aid of the team in a gallant and professional master. The workshop was
    a rousing success until presented in the Middle East, where the attendees associated
    the knight with the Crusaders. Although there was no intent for disrespect, the
    interpretation resulted in a culturally sensitive situation.


    +   - Privacy The collection, use, and transfer of user data are sensitive issues.
    Teams must protect the collection and usage of data on using permissions. Teams
    must explain privacy policies to all users.

    - Licensing Licensing terms protect intellectual property and clearly outline
    rights, restrictions, and obligations. The use of open source software (OSS) must
    be clearly identified to the user and be compliant with review and usage licensing.

    - Security and integrity policy Protect all solutions, associated supply chains,
    and users against internal attacks and security breaches. Many organizations,
    such as law enforcement, rely and therefore enforce software integrity.


    The quality "deal" determines which of the quality essentials engineering policies
    are optional, recommended, or mandatory. Avoid lengthy delays and frustrating
    re caused by noncompliance. Include a focus on quality essentials before the release
    rather than after it lasts.


    Whether we track the process as a quality-essentials story or a detailed list
    of quality-essentials policies tasks is up to us and our organization. Figure
    84 shows the task-based QE list for the ALM Readiness Treasure Map solution from
    our VSO backlog.'
