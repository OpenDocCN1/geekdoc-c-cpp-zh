    \ Bug，那么我们应该关注关键 Bug，并处理高优先级、中优先级或低优先级 Bug。\n- 分配给团队成员，由该成员承担 Bug 的所有权。\n- 将状态设置为“已批准”(Approved)。\n\
    - 将迭代路径（冲刺）设置为必须解决该 Bug 的迭代（冲刺）。\n- 将 Bug 链接到相关的父功能或用户故事 (PBI)。\n\n## 解决\n\nBug\
    \ 所有者可以选择性地将 Bug 拆分为可执行的任务，这些任务也同样受 GIGO 概念的影响。\n\n 开始工作时，将状态设置为“已提交”(Committed)。\n\
    - 与测试人员/评审人员合作验证解决结果。\n- 解决后重新分配给发起者进行最终确认。\n\n在各种“展示我们拥有的”的公告中修复 Bug，并清晰地识别所有已解决的\
    \ Bug、限制和解决方案，以及队列中的（未解决）Bug 是非常重要的。\n\n## 处理阻碍\n\n阻碍是任何阻碍团队生产力的因素。\n\n- 提出所有阻碍是团队的责任。\n\
    - 推动和消除阻碍是 Scrum Master 和计划经理的责任。\n\n我们需要确保阻碍对我们具有可见度和意识，如图 75 所示。\n\n## 阻碍\n\n\
    | ID | 区域路径 | 迭代路径 | 阻碍 | 标题 |\n|---|---|---|---|\n| 9754 | VisualStudio.AlM.UserSecurity\
    \ | VisualStudio.AlM.Project\\FY14\\Sprint22... | 阻碍 | 研究没有 |\n| 6343 | VisualStudio.AlM.Usermap\
    \ | VisualStudio.AlM.Project\\FY10\\Sprint11... | 阻碍 | 导入导出的方法 |\n| 9650 | VisualStudio.AlM.Usermap\
    \ | VisualStudio.AlM.Project\\FY14\\Sprint21... | 阻碍 | Application Insights 破坏了构建\
    \ |\n| 9733 | VisualStudio.AlM.Userfactory | VisualStudio.AlM.Project\\FY14\\\
    Sprint22... | 阻碍 | 托管合同审批 |\n| 9775 | VisualStudio.AlM.Userfactory | VisualStudio.AlM.Project\\\
    FY14\\Sprint23... | 阻碍 | Azure ACS 阻塞了大量任务 |\n\n图 75。阻碍待办列表。\n\n## 处理范围蔓变\n\n\
    范围扩大可能源于意外的业务或服务需求，也可能源于误解的需求。\n\n前者是有效的范围蔓变，产品所有者确定剩余的功能不再具有价值，导致昂贵的浪费。\n\n误解的需求是一个灾难性的场景。如果解决方案的愿景、目标、目的或需求是流动的，那么产生的功能和故事将处于不稳定状态。糟糕范围蔓变的常见迹象包括：\n\
    \n- 产品所有者没有参与团队，对解决方案表现出缺乏兴趣或热情。\n- 产品所有者的预期与冲刺结束时的交付物不一致。\n- 产品不断引入功能、愿景、目标或发布的变更。\n\
    - 产品所有者无法将范围蔓变与虚拟架构、业务或技术变化联系起来。\n\n透明信任是关键！没有透明度就没有信任。如果不完全信任产品所有者，团队就无法投入。由于缺乏信任、透明度、缺乏经验的产品所有者或糟糕的待办列表清理/管理导致功能故障，Scrum\
    \ Master 和计划经理的介入至关重要。\n\n产品所有者负责确定是否需要冲刺、路线图或发布。对于志愿者来说，在一个被取消并封存的解决方案上投入宝贵的时间，没有什么更令人沮丧的。产品所有者在按下退出按钮之前必须考虑这一点。\n\
