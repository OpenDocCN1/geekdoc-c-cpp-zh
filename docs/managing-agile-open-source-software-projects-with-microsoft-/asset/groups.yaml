    ## 所以1个故事点等于 8 小时吗？


    不！故事点代表了对故事的感知和相对大小估算。

    包含一个（1）故事点的故事，理论上可以在一天内完成开发、测试和交付。其他团队可能需要比一天多或少的时间，而且并不是每天都需要满八（8）个工作小时。一旦团队建立了已知且一致的速率（velocity），我们就可以估计实现团队待办列表可能需要多少天：


    预计天数（天） = 每个故事的天数 * 待办列表大小估计 / 速率


    这是我们在功能（发布）级别和故事（功能团队）级别进行估计的准确程度。


    ## 兼职估计如何？


    我们所有的估计都是基于全职团队，正如之前讨论的，我们按照以下方式估计兼职情况下的平均速率：


    - 估计日历周可以投入比例。

    - 将每周速率乘以可能的兼职投入百分比。

    - 将结果四舍五入到最近整数。

    - 结果为兼职开发者/贡献者/测试人员/评审人员团队在一个迭代（sprint）中可以交付的最大量。


    我们采用的情况是每个兼职每迭代 3 个故事点。任何大于 3 个故事点/速率的故事都会被拆分为更小的故事。换句话说，任何估计为 5、8 和 13 的故事都不是未来迭代的潜在候选。请参考
    [Radio TFS 和关于（曾是噩梦的）更短周期的 GREAT 大球问题](52) 以获取更详细的拆解。


    > GEM 1/8 且最大为 3

    > 我们社区实现的最佳兼职投入最多为八分之一，且估计的最大速率为 3 个故事点。不要追求更高的速率，因为家庭工作与社区之间的平衡对于保持志愿者热情的投入而不至于流失至关重要！


    ## 不同团队之间的估计如何？


    在理想世界中，速率是在团队层面决定的，并且通常随团队不同而异。我们通常不会全职或长期地投入资源到某个项目中。相反，团队成员参与多个项目并在项目之间跳跃，这使得为每个团队建立一致的速率变得非常困难。（见图
    44。）


    ## 第 2 章：准备工作


    图 44. 项目与团队成员的重叠。


    我们对跨团队的速率进行了归一化处理，确保项目 A、B 和 C 的估计过程及其原则是相同的，如上所示。两个在多个团队和项目中工作的假设资源使用一致的和相对故事点整数值，该值代表复杂性、功能数量以及清晰度或不确定性的保证。


    ## 低耦合与高内聚


    - 减少依赖并实现孤立活动

    - 松耦合和高内聚的故事减少了对其他团队成员和专业知识的依赖。

    - 减少依赖使团队或团队成员能够孤立工作。


    当我们设计可操作系统时，我们努力实现低耦合和高内聚。“追求高内聚和低耦合。将正确的职责分配给正确的类确保了高内聚性。限制一个类对另一个类的知识或依赖（在实现接口可能发生变化的情况下），确保了耦合性”（Pereira
    & Schaub, 2006）。


    如果我们用这段引话替换“类”，我们得到了为适用于分散在不同地点（尤其是不同时区）的团队的故事提供了一个良好的定义。


    通过使用松耦合的故事，我们增加了灵活性以及回答“如何做”问题对专业知识的需求。例如，如果一个团队成员在温哥华，正在处理一个需要约翰内堡团队成员专业知识的故事，那么提问和接收反馈的延迟可能从几分钟到几小时不等，如图45
    所示。


    使用 Microsoft Visual Studio Online 管理敏捷开源项目

    151 页中的 55


    图 45. 按时区划分。


    - 1. 温哥华时间 11:00 提出的问题，如果南非团队成员是 20:00，可以在几分钟内采取行动。

    2. 19:00 提出的问题，如果正常工作时间与兼职/社区时间重叠，可以在 14 小时内采取行动。

    3. 如果时间不重叠，在团队成员看到答案之前，我们将面临额外的 8 小时延迟。


    更糟糕，如果约翰内堡的团队成员是兼职的，响应延迟可能会从几小时增加几天。通过减少对灵活性或他人的依赖，我们创建了任何团队成员都可以提取并处理的松耦合故事。


    高内聚的故事具有明确的职责来回答“是什么”的问题。遗憾的是，在耦合和内聚方面没有完美的故事，除非你问自己：“这个故事是否可以孤立地有效地完成？如果不能，我们可以进一步拆分吗？”


