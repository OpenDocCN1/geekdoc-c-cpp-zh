    Figure 64. Scrum tasks used for user PM bit.


    Lastly, we need an email to the team the objectives and reminding them where to
    find the notes and any special ASK (action) that should be acted on. See the Scrum
    notes (sample) example email from the varSecurity team.


    ## Weekly or biweekly?


    For part-time and geographically distributed teams, we strongly recommend weekly
    scrums to ensure that we have a regular cadence, a transparent view of progress
    and impediments, and an ability to alter and correct our flight route. During
    subsequent sprints, we consider a biweekly cadence if the weekly tax of the meeting
    exceeds the value to the team.


    ## Scrum of scrums


    Based on the scrum of scrums technique, the scrum of scrums is a once-per-sprint
    meeting with appointed representatives reporting their team status, next steps,
    and impediments. The representative is usually the Project Lead (PL) or Scrum
    Master, who also shares the status but, more importantly, raises questions and
    dependencies with other flights and teams.


    > Regular heartbeat “rocks”

    > For geographically distributed, part-time, and virtual teams, we recommend a
    once-per-sprint scrum of scrums, which adheres to a 2–3 minute per team box.


    We use a one-slide per team presentation (Figure 65) to present the two to three
    minute team update and then switch to an optional question-and-answer discussion.

