    # Introduction


    With this book, we share our adventures as we hone our skills in managing solution
    requirements in an environment where transparency, simplicity, and trust prevail.
    We are hardly a typical group but instead a worst-scenario.


    We are a geographically distributed, part-time, virtual, and volunteer-based team,
    which implies hard-to-get commitments. We build solutions that range from small
    to complex and use a variety of technologies that are often at the bleeding edge.
    For us, being unconventional is an asset when it comes with a variety of skills,
    traditions, cultures, and experiences.


    # Who should read this book


    This book targets Agile development teams and their Scrum Masters who want to
    explore and learn from our “dogfoodging” experiences and our continuous adaptation
    of software requirements management. Product Owners and other stakeholders will
    also find value in this book in learning how they can support their Agile development
    teams and by gaining an understanding of the constraints of open source community
    projects.


    # Assumptions


    This book assumes that you have at least a minimal understanding of Agile, Lean,
    and Scrum development concepts and are familiar with Team Foundation Server (TFS)
    and Visual Studio Online (VSO). To go beyond this book and expand your knowledge
    of Agile practices or Visual Studio technologies, MSDN and other Microsoft Press
    books offer complete introductions and comprehensive information.


    # This book might not be for you if . . .


    This book might not be for you if you are looking for an in-depth focused on the
    process, development, or architecture of software requirements, tooling, or practices.


    Similarly, if you are looking for source code or guidance on ALM, DevOps, or proven
    official frameworks as Agile, Scrum and Kanban, this book will not be fully relevant,
    and we recommend that you consider these publications:


    +   - Agile Software Engineering with Visual Studio, Sam Guckheimer and Neno Loje²

    - Professional Scrum Development with Microsoft Visual Studio 2012, by Richard
    Hundhausen³


    # Organization of this book


    We divided this book into four chapters and two appendices, intended as easy reading
    to get you started and later as an invaluable reference for you, and your process
    in a complex environment.


    The appendices focus on technologies, checklists, and supporting guidance. Chapters
    1 through 4 take you through a practical and simple lifecycle with starting ideas
    and moves to get ready, building the solution, and raising the quality bar, with
    a focus on requirements management, not tooling.'
