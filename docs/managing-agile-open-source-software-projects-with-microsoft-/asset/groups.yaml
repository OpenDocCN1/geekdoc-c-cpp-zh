    ## 案例研究：ALM 就绪性宝藏图 . . . 走木板


    管理一个遍布全球的虚拟团队并建立团队认同是一项复杂的挑战。我们介绍 ALM 就绪性宝藏图团队，是因为他们成功地让分散在巴西、加拿大、印度、南非、英国和美国的团队创建了一个凝聚且高效的团队（图
    104 和 105）。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_148_0.png)


    图 104. Robert Bernstein 船长^{133} 引入了令人兴奋的团队精神和身份认同。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_148_1.png)


    图 105. 分布式的 ALM 就绪性宝藏图团队。


    ## 背景信息


    团队最初的动力是为现有的 ALM 就绪性内容提供主目录（宝藏图），以引导并跟踪任何人精通 ALM 实践的过程。该地图的设计和开发旨在通过交付高质量参考解决方案的同时，对新的概念和技术进行“自嗨”（dogfood）。更多信息请参见
    TOC—ALM 就绪性宝藏图。^{134}


    ${133} http://blogs.msdn.com/b/willy-peter-chaubs/archive/2012/03/04/introducing-the-visual-studio-almers-rangers-robert-bernstein.aspx

    ${134} http://aka.ms/vsartmotoc


    使用 Microsoft Visual Studio 管理敏捷开源项目


    ## 团队及其技术的使用


    团队在明确的规则、职责和所有权下运行，使用我们的流程并每周安排 scrum 会议。我们将这些会议限制在 15 分钟的状态反馈和 15 分钟的可选问答内。作为团队的一员，不可避免地需要在凌晨、工作期间或晚上参加会议，因此时间管理对于利用时间并限制对实际工作和家庭时间的影响至关重要。


    Visual Studio Online (VSO)、Microsoft Lynx 和 Skype 从他们旅程的开始就是团队的家。他们继续推向边界，学习并研究新的
    Visual Studio 和 Windows 特性，自嗨新兴的 VSO 特性和流程创新。


    最近结组的 TFS Agile Poker 和 Lynch 投票预测用于估计他们下一次冒险的 story（故事）和任务。结果是对 Mike Douglas¹¹³⁶
    提供的 TFS Agile Poker 给出了坦诚的反馈，并意识到玩扑克游戏作为团队估算是免费且有回报的，但投票是一个非常糟糕的底方法 (106)。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_149_0.png)


    图 106. 使用 TFS Agile Poker（左侧）和 Lynch 投票来估计故事。


    团队创建了一个宝藏寻，并演化出了海盗身份，这创造了一种鼓舞的团队动态。会议以“.................”开始。未能实现目标的团队成员必须在虚拟公园里走木板。没有船长掌舵（讲台）的宝藏图感觉大不相同。


    ## 核心收获


    - 我们必须意识到我们正在与各种不同的文化一起工作，既不能对文化规范或习俗理所当然，也不能做出假设。

    - 我们必须承认所有人员和利益相关者从彼此那里可以学习很多。信息和责任的分享是高效且富有回报团队努力的关键。

    - 我们必须意识到有严肃的时候，也有娱乐的时候。将严肃与娱乐、工作与家庭之间的平衡进行最优校准并不，但这对士气、生产力和健康至关重要。


    ## 后记：我们绝对没有功能失调！


    背景：“我们的最后一个冲刺（sprint）再次被阻塞并可能延迟。”


    我们需要从头到尾精调我们的价值流，自动化一切并尽早发出事件。这听起来熟悉吗？就像工厂流水线或发布流水线一样，我们努力实现整个创建过程。交付业务价值不仅关乎原始速度，还关乎敏捷性、早期检测并解决障碍以及承担风险的意愿。“先做后请原谅”是经常经常听到的建议。


    将我们的最后一个冲刺重点放在质量和规划上，我们确保产品负责人 (PO)、计划经理 (PMs) 和选定的项目负责人 (PLs) 坐在一起讨论需要注意的问题并寻找等待时间。图
    107 突出了我们组装线上经常潜在的问题。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_150_0.png)


    图 107. 专注于质量和规划的最后一个冲刺显示了瓶颈。


