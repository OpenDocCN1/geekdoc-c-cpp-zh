    # # Chapter 1: Triage of ideas


    It is wise to persuade people to do things and make them think it was their own
    idea.

    —Nelson Mandela


    With more than 200 subject matter experts collaborating on at least five projects
    simultaneously, we could regard ourselves as a small enterprise in portfolio management.
    However, two of our core values motivate us: to favor simplicity and low tech
    complexity and continue on regular dogfooding of Visual Application Lifecycle
    Management tools. We base the requirements, ownership, and management concepts
    introduced in this book on Visual Studio Online (VSO) features and the results
    driven by stakeholder ideas that we all triage (Figure 1). Remember, simplicity
    rules!


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_18_0.png)


    Figure 1. Lifecycle: Requirements and ownership triage.


    # ## Flights of ideas


    We represent an idea in Visual Studio Online by an Epic-item type (WIT) decorated
    with one or more tags to align with Idea Source (where we found the ideas), Themes,
    and initiatives.


    > Agile Portfolio Management: Using TFS to support backlogs across multiple teams⁹
    (Boer & Ferrell, 2013).


    > What is a great idea?

    Just as there are no bad questions, there are no bad ideas. Ideas that might seem
    wild to some are to others an indicator of thinking "out of the box" and innovation.
    An idea should be bold, or out of this world, and should offer differentiating
    innovation.


    From a high-altitude view, we visualize our projects as flights, which is a well-understood
    metaphor. Each flight is timeboxed, has one or more teams working together when
    the project is in flight, and delivers a solution when it lands.


    # ## Roles, responsibilities, and ownership


    We introduce common personas and their responsibilities in Appendix B, "Eating
    your own dogfood is key," in the section "Personas as the glue.\ The titles and
    responsibilities of some personas may overlap with other personas. This varies
    from organization to organization.'
  - '[PAGE 19]


    # Chapter 1: Triage of ideas


    We need a number of personas to drive the overall vision, own and maintain the
    backlogs, and coordinate with all stakeholders during the requirements and ownership
    triage.


    Table 1 lists two personas and summarizes their roles, responsibilities, and ownership
    during the triage phase:


    | Persona | Responsibility | Ownership |

    | --- | --- | --- |

    | Program Manager | Works with the teams, triage, group, and leadership to elaborate
    ideas, participating in pinion reviews, coordinate, and drive the ideas triage.
    | - Triage group

    - Triage

    - VSO environment |

    | | Maintains the operational environment and the ideas backlog, produces a report
    of ideas for the triage group, and helps launch new flights. | - Ideas gathering

    - Pre-triage |

    | Scrum Master | Mentors the teams, enforces the framework guidelines, eliminates
    impediments raised during the triage, and actively leads the continuous improvement
    and training efforts. | - Process

    - Framework

    - Scrum Masters |


    Table 1. Roles, responsibilities, and ownership during the triage phase.


    One or both of these personas will work with other stakeholders in a triage group,
    which has the ultimate responsibility for selecting and coordinating the next
    wave of initiatives.


    # Idea management


    We work with ideas, triage them, and turn them into solutions. The ALM community
    and stakeholders submit great ideas (commonly referred to as initiatives, investment
    themes, or product themes).


    It helps to visualize solutions as the beginning of something (dawn), in full
    operation (daylight), and during the period in which the value of a solution has
    faded (dusk) to highlight the risk and value ideas. Ideas need to be harvested,
    groomed, and prioritized to the triage group to understand their value proposition
    and decide how to invest in new (dawn), future, existing (daylight), or retiring
    (dusk) solutions.


    For example, investing in a solution that is in the dusk phase is potentially
    a high-risk and short-lived investment. Remember the saying “the darkest hour
    is just before the dawn”(Thomas Fuller, 1650) when you''re faced with the challenges
    of embarking a new project.


    # Capturing ideas


    Unlike farmers, we have no specific season for harvesting ideas. We collect ideas—no
    matter how small, big, or out-of-this-world—from a number of sources throughout
    the year (see Figure 2). Our primary collection channels are Visual Studio UserVoice.¹10
    events, forums, email, and face-to-face discussions with the product group, ALM
    Rangers, and the ALM community.'
