    # Chapter 1: Triage ideas


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_28_0.png)


    Figure 12. Lifecycle: Requirements and ownership triage final preparations.


    > > Every lead should have a backup

    > Everyone needs an opportunity to relax, focus on family > job > rangers, or
    focus on a complex and crucial task. To ensure that there is no single point of
    failure, we recommend that the Program Managers and Project Leads each backups.


    # Planning the kickoff to enable innovative teams


    +   - KISSSS ... Keep it simple and ship soon!

    - Do less, better and quicker! We can always improve and do better next time!

    - Share sooner, even in alpha or beta state, to get early candidate feedback.

    - Empower the community to influence and take over solutions that are entering
    maintenance-only mode.


    The owners now collaborate on the strategic intent for the idea, align with the
    overall vision, and start planning the activities for the kickoff. In an ideal
    world, the most effective way would be to assemble the team in a face-to-face
    workshop, allow the team to organize itself, and allow the requirements to emerge
    as outlined in the [Agile Manifesto](agilemanifesto.org). As mentioned before,
    we work as geographically distributed teams, with part-time volunteers, making
    the face-to-face and self-organizing experience very challenging. The objective
    of the owners is to define the motivation, vision, objectives, and a features.
    The owners prepare a realistic roadmap, deferring innovation, emerging demands,
    and organization to the team.


    > > It is important to highlight that an idea is turned into a project only after
    the stakeholders, owners, and the team gives thumbs up. At this point, we have
    only the stakeholder and owners committed to the idea. Robert Bernstein''s¹ words,
    we have a proposed treasure map and the captain of the ship but no crew (yet).


    # Motivation


    We derive motivation from the original description of the idea, captured on UserVoice,
    in an email, or during a discussion around the coffee machine. The motivation
    describes the problem the idea is supposed to solve, the features and benefits
    it may provide to the beneficiaries, and why we should care about the idea.


    ¹⁸ http://agilemanifesto.org

    ¹⁹ http://aka.com/nsoQ or http://aka.com/vsarindex


    Managing Open-Source Software Projects with Microsoft Visual Studio Online


