    ## Case study: ALM Readiness Treasure Map . . . walking the plank


    Managing a virtual team distributed around the globe and establishing a team identity
    is a complex challenge. We introduce the ALM Readiness Treasure Map team because
    they have managed to create a cohesive and effective team scattered across Brazil,
    Canada, India, South Africa, the United Kingdom, and the United States (Figure
    104 and 105).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_148_0.png)


    Figure 104. Captain Robert Bernstein^{133} introduced an exciting team spirit
    and identity.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_148_1.png)


    Figure 105. Distributed ALM Readiness Treasure Map team.


    ## Background information


    The team''s original motivation was to provide a master catalog (treasure map)
    of the available ALM Readiness content to guide and track anyone through the process
    of becoming proficient in ALM practices. The design and development of the map
    intended to dogfood new concepts and technologies while delivering a quality reference
    solution. Find more information at TOC—ALM Readiness Treasure Map.^{134}


    ${133} http://blogs.msdn.com/b/willy-peter-chaubs/archive/2012/03/04/introducing-the-visual-studio-almers-rangers-robert-bernstein.aspx

    ${134} http://aka.ms/vsartmotoc


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio


    ## Team and their use of technology


    The team operated with clear rules, responsibilities, and ownership, using our
    process and scheduling weekly scrum meetings. We constrained these meetings to
    15 minutes of status feedback and 15 optional minutes of questions and answers.
    As part of the team inevitably attended the meetings at dawn, during business
    hours, or in the evening, the management of time was important to use time and
    limit impact on real jobs and family time.


    Visual Studio Online (VSO), Microsoft Lynx, and Skype have been the home of the
    team from the start of their journey. They continue to push horizons, learning
    and researching about new Visual Studio and Windows features, dogfooding emerging
    VSO features and process innovations.


    The recently teamed TFS Agile Poker and the Lynch poll forecast to estimate their
    stories and tasks for the next adventure. The result was candid feedback to Mike
    Douglas¹¹³⁶ of TFS Agile Poker, and the realization that playing poker is free
    and rewarding to estimate as a team, but polls are a great suck bottom (106).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_149_0.png)


    Figure 106. Using TFS Agile Poker (left) and the Lynch poll to estimate stories.


    The team created a treasure hunt and evolved a pirate identity, which created
    an inspirational team dynamic. Meetings to start with "................." Team
    members who failed to deliver on their objectives had to walk a virtual park.
    A treasure map without the captain at the helm (podium) is just not the same.


    ## Key learnings


    - We have to be cognizant that we are working with a variety of different cultures
    and that we can neither make assumptions about cultural norms or customs for granted.

    - We have to acknowledge that all persone and stakeholders have much to learn
    from each other. Information and responsibility sharing is key to productive and
    rewarding team effort.

    - We have to realize that there is a time to be serious and a time to have fun.
    Getting the balance of serious versus fun and work family optimally calibrated
    is not easy, but it is important to morale, productivity, and health.


    ## Afterword: We are definitely not dysfunctional!


    Context: "Our final sprint is blocked and potentially delayed again."


    We need to fine-tune our value stream from start to finish, automating everything
    and raising events as early as possible. Does this ring a bell? Just like a factory
    line or a release pipeline, we strive to automate the entire creation process.
    Delivering business value is not just about raw speed, it is about agility, detecting
    and resolving impediments early, and a willingness to take a risk. "Do and ask
    for forgiveness later" is advice we hear and often.


    Focusing our final sprint on quality and planning, we ensure that Product Owners
    (PO), Program Managers (PMs), and selected Project Leads (Pls) sit together, discussing
    what needs attention and looking for wait times. Figure 107 highlights the often
    potential problematics in our assembly line.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_150_0.png)


