    ## So is 1 story point == 8 hours?


    No! A story point represents the perceived and relative sizing of stories.

    A story with one (1) story point can be potentially developed, tested, and shipped
    in a day by the team. Other teams may require more or less than a day, and not
    every day is necessary eight (8) working hours long. Once the team has established
    a known and consistent velocity, we can estimate how many days it might take to
    implement the team''s backlog:


    Estimated duration in days = (days per story * backlog size estimate / velocity)


    This is our degree of accuracy when we estimate at a feature (release) and Story
    (feature team) level.


    ## What about part-time estimations?


    We do all estimations based on a full-time team and, as discussed. Then we estimate
    how much the average velocity is on a part-time basis as follows:


    - Estimate how much of a calendar week can be committed.

    - Multiply the weekly velocity by the percentage of possible part-time commitment.

    - Round the result to the nearest integer.

    - The result is the maximum part-time developer/contributor/tester/reviewer team
    can deliver in one sprint.


    We work with a case of 3 story points per part-time per sprint. Any story larger
    than the 3 story points/ velocity is broken down into smaller stories. In other
    words, any story estimated as 5, 8, and 13 are not potential candidates for a
    forthcoming sprint. [Radio TFS and the GREAT curve ball question about (ex-nightmare)
    shorter delivery cycles](52) for a more detailed breakdown.


    > GEM 1/8 and max 3

    The best-case part-time commitment achieved with our community maxes out at one-eighth,
    and the maximum velocity estimated as 3 story points. Do not strive for a higher
    velocity as the family job community balance is essential to keep volunteers passionately
    engaged without out!


    ## What about estimations across different teams?


    In an ideal world, the velocity is determined on a team level and typically varies
    from team to team. We do not commonly dedicate resources to a project full-time
    or long-term. Instead, the team members are engaged in multiple projects and jump
    from project to project, making it very difficult to establish a consistent velocity
    per team. (See Figure 44.)


    ## Chapter 2: Getting ready


    Figure 44. Overlap of projects and team members.


    We normalize team velocity across teams, ensuring that the estimation process
    and its principles are the same for project A, B, and C, as shown above. The two
    hypothetical resources working on multiple teams and projects work with a consistent
    process and a relative story-point integer value, representing complexity, the
    amount of features, and clarity or uncertainty assurance.


    ## Loose coupling and tight cohesion


    - Reduce dependency and enable isolated activities

    - Loosely coupled and highly cohesive stories reduce dependency on other team
    members and specialized knowledge.

    - Reduced dependency enables teams or team members to work in isolation.


    When we design interoperable systems, we strive for loose coupling and high cohesion.
    "Strive for high cohesion and low coupling. The assignment of the correct responsibilities
    to the correct classes ensures high cohesion. Limiting knowledge or reliance from
    one class to another class, where the interface of implementation is likely to
    change, ensures coupling" (Pereira & Schaub, 2006).


    If we replace class with this quotation, we get a good definition for stories
    that are suitable for teams scattered across locations and especially time zones.


    With loosely coupled stories, we increase versatility and the need for specialized
    knowledge to answer the "how" questions. If, for example, a team member is in
    Vancouver and working on a story that requires specialized knowledge from a team
    member in Johannesburg, the latency of asking a question and receiving feedback
    can range from minutes to hours as illustrated in Figure 45.


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online

    55 of 151


    Figure 45. Latest by time zones.


    - 1. A question raised at 11:00 in Vancouver could be acted on within minutes
    if the team member in South Africa is at 20:00.

    2. A question raised at 19:00 could be acted on within 14 hours if the normal
    and part-time/community hours overlap.

    3. If the times do not overlap, we will incur an additional 8 hours of latency
    before a team member picks up an answer.


    Worse, if the team member in Johannesburg is part-time, the response latency could
    increase from hours to days. By reducing the need for flexibility or reliance
    on others, we create loosely coupled stories that any team member can pick up
    and process.


    Stories that have high cohesion have clear responsibilities to answer the "what"
    questions. Unfortunately, there is no perfect story in terms of coupling and cohesion
    without asking yourself, "Could this story be done effectively in isolation? If
    not, can we break it down further?"


