    图 101。对齐的节奏。


    定期的全利益者集成和同步现在应该能够消除困惑，取而代之的是预测性带来的微笑。我们迫不及待地要在下一次同步活动中报告“项目 X 将在迭代 77 发布”。简单！节奏
    + 同步 = 可预测性！ => 步一致的团队！


    ## 附录 B：自用产品是关键的


    正如通用词汇能增加清晰度一样，将迭代名称与组织的其余部分对齐会使其变得更容易。例如，图 12 中的截图使用财年度作为主节点，子节点根据部门冲刺名称 S1-Sn
    命名。我们增加了一些额外内容，最初是开始日期，更多的是周数。


    图 12。在线迭代/冲刺视图。


    ## Area path == 团队


    我们主要使用 area path 作为创建新团队的默认设置，尽管团队应该创建子区域以供额外使用。


    ## 角色模型是胶水


    《支持指南》和白皮书定义了我们遇到的或我们的解决方案针对的所有角色及其职责。但在讨论我们的角色之前，请务必回顾表 11，该表显示了一个比较这些角色及其重叠适用性的矩阵。


    ## 产品负责人 (Product Owner)


    产品负责人 (PO) 是产品面向领导团队和开发团队的窗口，负责对范围做出艰难决策，并在需要时与其他利益者接触。


    如图 103 所示，PO 是产品组或团队的接口。PO 促进与产品组的所有通信，保护产品组并建立沟通。PO 负责对待办事项进行优先级排序。


    ## 项目负责人 (Project Lead)


    项目负责人 (PL)，也被称为开发者，为团队提供支持。如图 103 所示，PL 是产品组或团队的接口。PL 促进与产品组的所有通信，保护产品组并建立沟通。


    ## Scrum Master


    Scrum Master (SM) 根据需要，使用 Scrum、极端编程 (Extreme Programming)、SAFE 和看板对项目负责人和团队进行指导、导师指导和教练。我们努力透明地共享信息，并确保团队状态对所有人可见且已知。Scrum
    Master 支持产品负责人和项目负责人，以促进他们的参与并尽可能减少他们的开销。Scrum Master 持续改进团队以及工程实践和工具。


