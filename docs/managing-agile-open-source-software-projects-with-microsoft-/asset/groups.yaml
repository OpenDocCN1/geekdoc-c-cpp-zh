    # Chapter 1: Triage of ideas


    An example borrowed from the ALM Readiness Treasure Map defines the motivation
    as follows:


    +   - Provide a master catalogue (treasure map) of the available ALM Readiness
    content to guide users through the process of becoming proficient in ALM practices.
    Users include ALM Rangers and the ALM Community, looking to become more proficient
    in ALM, searching for specific guidance or wanting to track their progress through
    all the guidance.


    # Vision


    The vision defines what we intend to solve. The vision outlines architectures,
    technologies, and core deliverables and highlights the key benefits. It is the
    first nugget we share with a colleague or senior manager who asks us about our
    project at the coffee machine. The ALM Readiness Treasure Map has the following
    on its quick-reference chart:


    +   - Enhance the existing functionality in the ALM Readiness Treasure Map application
    to provide the user with improved experience.

    - The vi/2 version provides a master catalogue (treasure map) of the available
    ALM Readiness content to guide users through the process of becoming proficient
    in ALM practices. Enable a team to research and provide an innovative Windows
    8 user experience and architecture reference sample solution, to be demonstrated
    at TechReady 16 in support of the Windows Store campaign.


    # Categorize solution


    It is important to categorize the type of solution and the expected quality in
    the form of objectives, acceptance criteria, and release governance (Table 3).
    Always keep an eye on the overall mission and ensure alignment with the mission
    (Figure 13).


    > Practical guidance created by ALM Rangers in collaboration with product groups
    and subject matter experts / Solutions, such as tooling, which fill a feature
    gap in the out-of-the-box solutions


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_29_0.png)


    aka.ms/vsarunderstand real-world experience from real-world engagements You!


    Figure 13. Our mission statement.


    | Category | Description |

    | --- | --- |

    | Quick-response sample | Quickly provide information, samples, and prototypes
    in response to feature gaps to supplement the product and knowledge base information.
    In some cases, the community adapts, enhances, and maintains these samples.

    See TOC—Quick Response Solutions² for examples. |

    | Guidance | Real-world, insightful, and practical guidance made up of topics
