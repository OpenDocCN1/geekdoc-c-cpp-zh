    # Microsoft Solutions Framework


    Since the early days of the Microsoft Solutions Framework (MSF), we have emphasized
    that agility is extremely important and that we must change. MSF has principles
    and practices where the former was about the mindset of the team and the latter
    about the actual practice of the individual. In our mind, we have always aligned
    closely with the Agile Manifesto. MSF forms the base of our practices.


    Microsoft Solutions Framework is a set of software engineering processes, principles,
    and proven practices intended to enable developers to achieve success in the software
    development lifecycle (SDLC). The following are eight foundational principles
    and nine mindsets that form the backbone for the other models and disciplines
    of MSF:


    | Principles | Mindsets |

    | --- | --- |

    | Foster open communication | Familiarize team members to how they should approach
    solution delivery |

    | Work toward a shared vision | Foster a team of peers |

    | Empower team members | Focus on business value |

    | Establish clear accountability and shared responsibility | Keep a solution perspective
    |

    | Focus on delivering business value | Take pride in workmanship |

    | Stay agile, except change | Learn continuously |

    | Invest in quality | Internalize qualities of service |

    | Learn from all experiences | Practice good citizenship

    | | Deliver on our commitments


    # Agile Manifesto


    The Agile Manifesto¹¹¹⁰ for Agile Software Development shares some of the same
    considerations with MSF. The Agile Manifesto is "uncovering better ways of developing
    software by doing it and helping others do it." (Agile Manifesto, 2001a). We are
    encouraged to value:


    Individuals and interactions\over processes and tools


    Working software\over comprehensive documentation


    Customer collaboration\over contract negotiation


    Responding to change\over following a plan


    In addition, the principles behind the manifesto are:


    +   * Our highest priority is to satisfy the customer early and continuous delivery
    of valuable software.

    * Welcome changing requirements, even late in development. Agile processes harness
    change for the customer''s competitive advantage.

    * Deliver working software frequently, from a couple of weeks to a week of months,
    with a preference to the shorter timescale.

    * Business people and developers must work together daily throughout the project.

    * Build projects around motivated individuals. Give them the environment and support
    they need, and trust them to get the job done.


    > ¹¹¹⁰ http://www.agilemanifesto.org


