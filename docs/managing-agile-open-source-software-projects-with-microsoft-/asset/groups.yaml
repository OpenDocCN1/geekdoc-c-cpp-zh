    # Chapter 4: Raising the quality bar


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_111_0.png)


    Figure 92. Different sprints focused on quality and planning strategies.


    Here is their story ...


    # Readiness test map


    The pirates spin off two quality-improvement activities, one focused on fixing
    known bugs and testing the updates, and the second on user-acceptance testing.
    Every team member, or in this case shipmate, was engaged with the solution, giving
    continuous feedback to the developers and responding to the chief tester, Darren,
    who likely created more and more-complex test cases than the team testing the
    Agile module for the first month landing. Innovation occurred as part of bug and
    test feedback analysis and resolution, with every shipmate engaged and featured.
    After the Product Owner sign-off ceremony, the solution was put through the store
    certification process and shipped as a RTM v3 in the internal TechReady 19 event
    and yet another "fun" demo session.


    An obvious anomaly is the lack of noticeable planning, intentionally deferred
    to the TechReady 1991 session where the captain engaged the audience in feature
    and future-direction planning. This is an innovative, transparent, and engaging
