    # Running through or pulling stories to team members?


    With mature teams, stories and assigned tasks are pulled from the backlog. Just
    as with the planning of stories, allowing team members to commit to stories by
    taking (pulling) them from the backlog creates a sense of ownership and independence.


    With a geographically distributed team, however, we mix a variety of cultures,
    skills, and levels of commitment. Some stories and their "best" may need to be
    reconsidered in the current project context, which may require the team leadership
    to recommend (push) stories to team members for consideration.


