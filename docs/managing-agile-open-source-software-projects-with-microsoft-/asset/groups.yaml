    # Blog – triage results


    # Blog - news


    Figure 11. Raise the visibility of adventures "early."


    We share the results of the triage on an internal or external blog as soon the
    triage is complete. Similarly, we share news on the project we kick it off. This
    raises the visibility and transparency of the project idea and the project natures
    interest and excitement for the solution.


    While preparing for the kickoff (meeting), the Product Owner or representative
    delivers a 15–30 minute awareness session to explain why the project is important,
    what it is needed by, and who the prospective subject matter experts are. This
    allows the community to see a context, mull over the adventure, and volunteer
    as Project Lead or


    +   * The Product Owner is the face of the product, owns the product, makes tough
    decisions on scope, and engages others as stakeholders.

    * The Project Lead, also known as Dev Lead, is the team enabler and focuses on
    fine-tuning the team and representing the team on public forums. The Project Lead
    typically owns and maintains the project long after it has shipped and the rest
    of the team has moved to other adventures.

    * The Program Manager works with stakeholders and customers, focusing on project
    orchestration and keeping the team and backlog from stagnating. Program Management—Thinking
    about PM! and Program Management—Are of the ALM Rangers Symbiotic PMs?17 blog
    posts explore the definition of an ALM Ranger PM, the role’s focus on orchestration,
    and other responsibilities.


    Why others? Depending on the environment and availability of resources, we could
    combine these three personas into one Product Owner persona.


    In our experience the Product Owner and Project Lead personas are, like other
    ALM Rangers, to work on projects a part-time basis, and in the case of the Product
    Owner, occasionally change even the course of the project. The only permanent
    person in our ecosystem is the Program Manager, who coordinates a handful of concurrent
    projects, a number of service-mode projects, and a community of 200+, with the
    associated infrastructure and quality processes. To make matters interesting,
    the Program Manager also acts as a tester/reviewer and occasionally works as a
    developer/coordinator on multiple projects.


    What happens is that none of these owner personas is truly committed to "the"
    project and therefore load balancing among the Product Owner, Project Lead, and
    Program Manager combines skills, knowledge, and passion, but most importantly
    creates crucial backup.


    Once we have identified all the owners and everyone is committed to the project,
    we proceed with the final preparations and planning for the kickoff meeting (Figure
    12).'
