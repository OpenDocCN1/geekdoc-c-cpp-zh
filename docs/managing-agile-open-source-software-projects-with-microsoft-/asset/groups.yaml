- md: "\n## Chapter 1: Triage of ideas\n\n![](img/eb2bb5eedd7e9f0a74372984f6317b95_25_0.png)\n\
    \nFigure 9. Triage process.\n\n## Top ideas\n\nThe best candidates are those with\
    \ the highest business value, that can be delivered most quickly, and that impose\
    \ the least risk to the main product line and mission statement.\n\nWhen we brainstorm,\
    \ it is important to consider variables such as value, viability, quality, cost,\
    \ risk, and mission to be able to select and prioritize the right ideas.\n\n-\
    \ **Mission**: An idea needs to be in harmony with our mission statement or we\
    \ will disqualify it.\n  We rejected the idea \"add UserVoice integration service\"\
    \ because it had a low community vote and was not aligned with our mission statement.\n\
    \n- **Value**: An idea needs to deliver additional value, quantified in terms\
    \ of enabling more adoption of the main product, return on investment (ROI), and,\
    \ most importantly, customer satisfaction.\n  Delivering a gap-filling solution\
    \ that uses Visual Studio testing has a higher value than a readiness solution\
    \ that promotes future technologies. On the other hand, delivering a solution\
    \ that has less today probably has a greater impact than delivering a solution\
    \ that may have astronomical value in 10 years.\n\n- **Viability**: An idea needs\
    \ to be viable.\n  The idea of sending a mission to Pluto might be a nice dream,\
    \ and it may offer great value as our sun continues to expand. However, this idea\
    \ is not yet technically viable.\n\n- **Quality**: An idea needs to be within\
    \ defined quality and a time box (roadmap).\n\n- **Cost**: An idea must be affordable\
    \ and deliver a cost or fortune to maintain. A nation in need of reconciliation\
    \ capabilities to patrol vast oceans and ice may not deliver a return on investment.\n\
    \n- **Risk**: An idea may be phenomenal, but it may be risky to develop or may\
    \ be a risk to the main product line.\n  Developing a utility that exceeds the\
    \ permissions of a user may be a strategic idea, but if it negatively affects\
    \ the performance and stability of an operational product, it may be too risky.\n\
    \n- **Bandwidth**: An idea needs bandwidth for a variety of dedicated resources.\n\
    \  The best idea can turn into a nightmare if the required resources, subject\
    \ matter experts (SMEs), and processing bandwidth is not available.\n\n- **In-flight\
    \ limit**: An idea requires focused attention.\n  The meals served by a cook on\
    \ a handful of dishes are highly likely to be more successful (tasty) than meals\
    \ served by a cook to coordinate dishes of dishes. As shown below, there may be\
    \ a number of in-flight solutions at the time of the triage. This reduces the\
    \ number of new projects that we can consider.\n  Figure 10. Ideas in triage cannot\
    \ and do overlap through the year.\n\n## Chapter 1: Triage of ideas (continued)\n\
    \n![](img/eb2bb5eedd7e9f0a74372984f6317b95_26_0.png)\n\nFigure 10. Triage cadence\
    \ and project overlap.\n\n## A maximum of five concurrent flights (for us)\n\n\
    - Complexity, duration, and personal involvement influence the in-flight limits,\
    \ also known as work-in-process (WIP) limits.\n- More than five (5) projects that\
    \ are in parallel place undue strain on our two (2) Program Managers (PMs), require\
    \ increased coordination and context switching, and drain the community passion.\n\
    - You will need to experiment and refer this guidance to suit your PMs.\n\nWhen\
    \ the triage is finished, you should have an ordered list of potential ideas.\
    \ There is no doubt which solution ideas are critical, which are important, and\
    \ which would be \"nice\" to consider.\nAt this point, we know what we should\
    \ be considering for our next project adventures. The next step is to determine\
    \ who will be the driving force behind the projects.\n\n## To be successful we\
    \ need passionate stakeholders\n\nExperience has shown that distributed, part-time,\
    \ and virtual teams thrive with committed and passionate stakeholders (for example,\
    \ the Product Owner, Program Manager, and Scrum Master) who deliver guidance,\
    \ direction, and a \"pulse\" that keeps the team spirit alive. Without these,\
    \ the team eventually transforms into a black hole and dies, or it continues to\
    \ trouble through space without any noticeable progress. The team will reflect\
    \ the stakeholders' passion or lack thereof.\n\n## Identify passionate owners\n\
    \nWith distributed, virtual, and part-time teams, three personas are pivotal to\
    \ the success of the project. Scrum typically defines a team that consists of\
    \ a Product Owner (PO), a Scrum Master, and the rest of the team. We recommend\
    \ two additional owners, namely a Project Lead (PL) and a Program Manager (PM).\n\
    How you raise the visibility of the idea to identify these champions depends on\
    \ you and your ecosystem. An approach we use is shown in Figure 11.\n\n## Blog\
    \ – triage results\n\n## Blog - news\n\nFigure 11. Raise the visibility of adventures\
    \ \"early.\"\n\nWe share the results of the triage on an internal or external\
    \ blog as soon as the triage is complete. Similarly, we share news on the project\
    \ we kick it off. This raises the visibility and transparency of the project idea\
    \ and the project's interest and excitement for the solution.\n\nWhile preparing\
    \ for the kickoff (meeting), the Product Owner or representative delivers a 15–30\
    \ minute awareness session to explain why the project is important, what it is\
    \ needed by, and who the prospective subject matter experts are. This allows the\
    \ community to see a context, mull over the adventure, and volunteer as Project\
    \ Lead or...\n\n- The Product Owner is the one who defines the vision and manages\
    \ the backlog of features.\n- The Project Lead is the one who focuses on the technical\
    \ execution and helps the team navigate.\n- The Program Manager is the one who\
    \ coordinates between teams and ensures the project stays on track.\n\nThe objective\
    \ of the owners is to define the motivation, vision, objectives, and a features.\
    \ The owners prepare a realistic roadmap, deferring innovation, emerging demands,\
    \ and organization to the team.\n\nIt is important to highlight that an idea is\
    \ turned into a project only after the stakeholders, owners, and the team give\
    \ thumbs up. At this point, we have only the stakeholder and owners committed\
    \ to the idea. Robert Bernstein's¹ words, we have a proposed treasure map and\
    \ the captain of the ship but no crew (yet).\n\nOnce we have identified all the\
    \ owners and everyone is committed to the project, we proceed with the final preparations\
    \ and planning for the kickoff (Figure 12).\n\n## Chapter 1: Triage ideas (continued)\n\
    \n![](img/eb2bb5eedd7e9f0a74372984f6317b95_28_0.png)\n\nFigure 12. Lifecycle:\
    \ Requirements and ownership.\n\n- KISS: Keep it simple and ship soon!\n- Do less,\
    \ better and quicker! We can always improve next time!\n- Share sooner, even in\
    \ alpha or beta state, to get early feedback.\n- Empower the community to influence\
    \ and take over solutions that are entering maintenance-only mode.\n\n¹ http://agilemanifesto.org\n"
  mdcn: "\n\n## 第 1 章：想法的筛选 (Triage)\n\n![](img/eb2bb5eedd7e9f0a74372984f6317b95_25_0.png)\n\
    \n图 9。筛选流程。\n\n## 核心想法\n\n最佳候选方案是那些具有最高业务价值、交付最快，且对主产品线和使命宣言造成风险最小的想法。\n\n当我们进行头脑风暴时，考虑价值、可行性、质量、成本、风险和使命等变量至关重要，以便能够选择并优先考虑正确的想法。\n\
    \n- **使命 (Mission)**：一个想法必须与我们的使命宣言保持一致，否则我们将其淘汰。\n  我们拒绝了“添加 UserVoice 集成服务”的想法，因为它的社区投票率低，且不符合我们的使命宣言。\n\
    \n- **价值 (Value)**：一个想法需要提供额外的价值，量化标准包括提高主产品的采用率、投资回报率 (ROI)，以及最重要的客户满意度。\n  交付一个使用\
    \ Visual Studio 测试的填补性解决方案，其价值高于一个推广未来技术的就绪解决方案。另一方面，交付一个今天价值较低的解决方案，可能比交付一个 10\
    \ 年后可能有巨大价值的解决方案具有更大的影响。\n\n- **可行性 (Viability)**：一个想法必须是可行的。\n  向王星发送任务的想法可能是一个美梦，随着我们太阳的不断膨，它可能会提供巨大的价值。然而，这个想法在技术上尚不可行。\n\
    \n- **质量 (Quality)**：一个想法必须在定义的质量和时间盒（路线图）范围内。\n\n- **成本 (Cost)**：一个想法必须负担得起，且维护成本可控。一个需要调和能力来巡逻广阔海洋和冰封的国家，可能无法产生投资回报。\n\
    \n- **风险 (Risk)**：一个想法可能是卓越的，但开发它可能存在风险，或者对主产品线构成风险。\n  开发一个超出用户权限的工具可能是一个战略想法，但如果它负面影响了运行产品的性能和稳定性，那么可能风险太大了。\n\
    \n- **带宽 (Bandwidth)**：一个想法需要各种专用资源的带宽。\n  如果没有所需的资源、领域专家 (SMEs) 和处理带宽，最好的想法也可能变成噩梦。\n\
    \n- **进行中限制 (In-flight limit)**：一个想法需要集中的注意力。\n  厨师专注于几道菜所提供的餐点，比厨师协调各种菜肴提供的餐更容易成功（美味）。如下所示，在筛选时可能会有许多进行中的解决方案。这减少了我们可以考虑的新项目数量。\n\
    \  图 10。筛选中的想法在一年中可能会发生重叠。\n\n## 第 1 章：想法的筛选（继续）\n\n![](img/eb2bb5eedd7e9f0a74372984f6317b95_26_0.png)\n\
    \n图 10。筛选节奏和项目重叠。\n\n## 并发任务最多只有五个（对我们而言）\n\n- 复杂度、持续时间和个人参与度会影响进行中限制，也称为在制品数量\
    \ (WIP) 限制。\n- 超过五个 (5) 个并行项目会给我们的两个 (2) 项目经理 (PM) 带来过度压力，增加协调和上下文切换，并消耗社区的热情。\n\
    - 你将需要实验并参考此指南以适应你的项目经理。\n\n筛选完成后，你应该有一个按顺序的潜在想法列表。哪些解决方案想法是关键的，哪些是重要的，哪些是“不错”可以考虑的，是不言疑问的。\n\
    此时，我们知道应该为下一次项目冒险考虑什么。下一步是确定谁将成为项目的驱动力量。\n\n## 要取得成功，我们需要热情的利益相关者\n\n经验表明，分布式、兼职和虚拟团队在投入且充满热情的利益相关者（例如产品负责人、项目经理和\
    \ Scrum 大师）的支持下蓬勃发展，这些人提供了指导、方向和保持团队精神活力的“脉搏”。没有这些，团队最终会变成黑洞并死亡，或者在空间中继续漂流而没有任何显著的进展。团队将反映利益相关者的热情或缺乏热情。\n\
    \n## 识别热情的负责人\n\n在分布式、虚拟和兼职团队中，有三种角色对项目的成功至关重要。Scrum 通常定义团队由一个产品负责人 (PO)、一个 Scrum\
    \ 大师和团队其余成员组成。我们建议额外增加两个负责人，即项目负责人 (PL) 和项目经理 (PM)。\n你如何提高想法的可见性以识别这些支持者，取决于你和你的生态系统。我们使用的一种方法如图\
    \ 11 所示。\n\n## 博客 – 筛选结果\n\n## 博客 - 新闻\n\n图 11。“尽早”提高冒险的可见性。\n\n筛选完成后，我们立即在内部或外部博客上分享筛选结果。同样，我们在启动项目时也会分享新闻。这提高了项目想法的可见度和透明度，以及人们对解决方案的兴趣和兴奋程度。\n\
    \n在准备启动（会议）时，产品负责人或代表将进行 15–30 分钟的意识说明，解释为什么这个项目很重要，谁需要它，以及潜在的领域专家是谁。这让社区看到背景，思考这次冒险，并自愿担任项目负责人或……\n\
    \n- 产品负责人 (Product Owner) 是定义愿景和管理功能积压的人。\n- 项目负责人 (Project Lead) 是专注于技术执行并帮助团队导航的人。\n\
    - 项目经理 (Program Manager) 是协调团队之间并确保项目顺利进行的人。\n\n负责人的目标是定义动机、愿景、目标和功能。负责人准备一份现实的路线图，将创新、新兴需求和组织工作留给团队。\n\
    \n重要的是，只有在利益相关者、负责人和团队都赞同后，一个想法才会转化为项目。此时，只有利益相关者和负责人对该想法表示承诺。正如罗伯特·伯斯坦¹ 所言，我们有一张提议的宝藏地图和船长，但还没有船员。\n\
    \n一旦确定了所有负责人并且人都承诺项目，我们就进行最后的准备和启动计划（图 12）。\n\n## 第 1 章：筛选想法（继续）\n\n![](img/eb2bb5eedd7e9f0a74372984f6317b95_28_0.png)\n\
    \n图 12。生命周期：需求与所有权。\n\n- KISS：保持简单，尽快发布！\n- 做少、做得更好、更快！我们下次可以改进！\n- 尽早分享，即使在 Alpha\
    \ 或 Beta 阶段，以获得早期反馈。\n- 授权社区影响并接管进入仅维护模式的解决方案。\n\n¹ http://agilemanifesto.org\n\
    \n"
