    # Chapter 3: Building the working solutions


    ## TFS on Azure (IAAS)


    ### vision

    Deliver practical guidance and easy-to-consume readiness material to enable the
    field to educate themselves to plan, implement and maintain an effective TFS on
    AzureaaS environment for project evaluation, testing and production in the cloud.


    ### motivation

    Strategic initiative supporting DevOps initiatives and support the user to implement
    a TFS service in their private cloud.


    ### deliverables

    - Practical guidance (ebook, HOLs, videos)

    - Techready session

    - Collaboration with On-Time VM Factory Service


    ### status

    - In-flight

    - S21 (Mar) - Silent BETA shipped!

    - S22 (Apr) - TFS on Proxy dense.

    - S23 (May) - Build scenarios and ship!


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_80_0.png)


    Figure 65. Scrum-of-scrum status slide.


    The core objectives of the scrum are:

    - Remind everyone of the flight status and motivation.

    - Present an update on the flight roadmap status (done, doing).

    - Raise and discuss impediments.

    - Raise and discuss retrospective findings and proposed innovations.

    - Raise and discuss discrepancies on other flights.

    - Show-what-we-have-done sprint demo videos or a live demonstration.


    | TOOLING |

    | :--- |

    | - Integrated Development Environment |

    | - Create your app |

    | - Building Azure Web Sites with Visual Studio Online "Monaco" |


    ## Dealing to work in isolation


    The complexity of working on and leading projects in isolation is a topic of debate.
    Some argue that the life of a full-time Scrum Master, Project Lead, Product Owner,
    and Program Manager is far more involved and complex. Some argue that the business
    value and strategic impact of dedicated projects are superior to their part-time
    community counterparts.


    This guide will not debate these arguments. Instead, we will explore the challenges
    of sitting in a cockpit and flying plane with guiding a drone on the other side
    of the planet—or worse, a probe exploring the orbit of another planet. In an actual
    cockpit the pilot will sense the conditions and status of the flight by sight,
    hearing, and face-to-face collaboration. While the complexity of flying the plane
    is not to be taken lightly, the ability to visually experience and interpret the
    surrounding conditions in time appears more effective and is a preferred experience
    to the average person.


    In a disconnected scenario, the pilot relies on information transferred back from
    the remote device. The receipt and analysis of information and the reaction to
    it is less than optimal. The overall success depends on the accurate and timely
    sharing of information needed to make critical decisions. When a space probe enters
    the correct orbit, burns up in the atmosphere, or explodes in a fiery impact often
    depends on split-second decisions based on information with high latency.


    Similarly, the Project Lead, Product Owner, Program Manager, and Scrum Master
    all depend on transparency, accurate, and timely sharing of information and collaboration
    by the geographically distributed and part-time team members.


    Transparency, reflection, and continuous improvement are the core pillars. If
    we get accurate information on time, nothing remains hidden, and we have reliable
    team collaboration, we have the three fundamentals of Lean thinking. We will be
    in a good position to inspect, adapt, and improve, with an understanding that
    everyone is and will continue to make mistakes. The team rises or falls as one
    self-organized hive!


    Transparency also covers the common scenarios of black hole, rude awakenings,
    and perpetual scope creep. Nightmares we are aware of avoid:

    - Black hole: Team members need to vanish off radar, the leadership and the rest
    of the team need information to reflect and innovate. If we have team members
    with the "black hole" syndrome, we transition them to other projects as quickly
    as possible.

    - Rude awakening: The team iterates with transparency and enjoys a false sense
    of security. As the team approaches the end of the sprint, it becomes apparent
    that there will be no demo or working software, but a sudden spike of issues and
    impediments.

    - Perpetual scope creep: The team continuously reacts to scope creep. The result
    is usually a need to renegotiate scope, quality, and expectations and also reset
    a sprint or even the release.


    We work with their Scrum Master when we encounter scenarios of these nightmares.
    With patient mentorship, even those new to the distributed, part-time, and virtual
    collaboration environment will adapt.


    Best. With which of these team environments would feel most comfortable? The one
    you described or the one with positive that we know and should encourage:

    - Self-organization allows the team to get their work done, deliver value, and
    do so iteratively.

    - Trust allows the leadership to let teams go about their business with the knowledge
    that they will deliver business value regularly and raise all issues and impediments
    when they arise.

    - Transparency ensures visibility of the good, the bad, and the ugly. While everyone
    loves sailing trips, storms and unexpected challenges will emerge. With transparency,
    we are not alone when we need to ask for help. In fact, if we have a transparent
    team, we will be asked when we need help before we have an opportunity to ask.

    - Simplistic mindset keep it simple! Ship something as soon and as often as possible.
    Through iterative feedback and rapid adaptation, we can always do better tomorrow.


    ## Events are invaluable


    Every team must agree to key events, as Under Development, Ready for Review, or
    Done, and the tracking thereof avoided distributed team members from waiting on
    each other, wasting time and eventually deadlocking the flow. Whether we track
    stories, tasks, or both is a decision we make with the team.


    ## Coarse story tracking


    One option is to encourage teams to break stories down into tasks where needed,
    but to visually track the encompassing features using the Kanban board in VSO.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_82_0.png)


    | New | Approved | Committed | Ready For Review | Done |

    | :--- | :--- | :--- | :--- | :--- |

    | Automate the customization process | Create a context whitepaper | Implement
    process template | | |

    | 5 | Gregg Boer 21 | Document as a walkthrough | | |

    | | Gordon B 3 | Type values need to be updated to reflect design | |


    Figure 66. Kanban board and event: committed stories.


    The idea is to develop a story to Committed when there is a commitment to develop
    the feature and Ready-for-Review when the story is ready for testing or review.
    Testers/reviewers typically monitor the Ready-for-Review state and stories when
    they appear.


    > ### Scrum vs. Kanban

    > Scrum and Kanban approaches can be mixed with caution:

    > - Scrum is based on fixed-length sprints, continuous reflection, and improvement.

    > - Kanban is based on WIP limits, visual workflow, and measuring and optimizing
    lead time.


    A few benefits of the Kanban board are that work-in-progress limits (WIP) can
    be used to define a healthy amount of work that can be queued in a specific state,
    and that bottlenecks can be visually identified.


    Those who know the process templates, associated work items, and by heart will
    wonder where the ready-for-review state emerged. As shown in Figure 67, we have
    only the states New, Approved, Committed, and Done for bugs and product backlog
    items. Kanban appears twice, once in the Committed and once in the Ready for Review
    column.


    Similarly, we could decide that a story needs to go through phases, for example
    Ungroomed, Ready for Triage, Triaged, Current Sprint, Future, etc. while in the
    Approved state. This is where the extensibility and customizability of Visual
    Studio Online (VSO) and Team Foundation Server (TFS) prove very powerful.

