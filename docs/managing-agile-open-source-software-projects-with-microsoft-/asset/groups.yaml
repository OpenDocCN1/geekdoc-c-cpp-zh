    # 第2章：准备工作


    现在不是安逸和舒适的时候。这是勇于尝试与坚持的时候。

    —温斯顿·丘吉


    我们继续保持简单和清晰！现在是时候以团队的形式聚集在一起，理解“为什么”和“做什么”，并对“如何做”达成共识了。回顾许多由地理分布的志愿者、兼职团队处理的项目，显而易见，在解决方案的阶段投入的时间精力是无价的。那些在没有愿景、目标或需求的情况下“空伞式”进入项目的团队，会随着资源的消失而迅速萎缩，更糟糕的是，会陷入价值流失的沮丧且无休止的噩梦中。这一阶段如图31所示。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_44_0.png)


    图31。生命周期：准备工作。


    # 培训-研究计划 (TRP)


    > GEM 洞悉你的命运！

    作为一名潜水员，你必须计划你的潜水行程，限制最大深度和时间，并约定目标。除非你是在执行军事或搜索救援任务，否则实际的活动是非常灵活的。然而，每个人都知道计划。每个人都有能力应对不断变化的环境，并在需要时帮助朋友。


    每个新项目或发布都始于培训-研究计划，并根据情况可选结束于对提高质量基准和额外计划的关注，正如在“提高质量基准”章节中讨论的那样。


    培训-研究计划的引入和质量研究的重点将产生一种预测性瀑布式流程的感知。对于地理分布和兼职团队，许多成员可能永远不会面对面交流，因此，我们必须理解主意和所需的功能，并对需求达成共识，使团队能够优化交付时间并减少价值流失。


    重点对培训-研究计划的关注可以发生在整个迭代（Sprint）或部分迭代中。对于复杂或新技术的项目，通常需要一个完整的迭代，而同一项目的后续发布版通常只需要部分迭代。


    培训-研究计划的关注允许团队理解并（可选地）完善项目：


    - 动机（为什么）

    - 愿景（做什么）

    - SMART³ 目标（[Wikipedia](https://en.wikipedia.org/wiki/SMART_criteria), SMART 标准,
    2015）

    - 功能

    - 验收标准（对应客户预期）

    - 完成定义（对应于交付功能之前需要完成的内容）


    迭代从启动会议开始，随后是研究和培训，最后是迭代计划会议，为接下来的开发迭代提供下一次和最佳情况的估算。


    # 一切从启动会议开始！


    向所有利益相关者推销项目想法的理念是重要的，在我们的案例中，这包括每一个开发团队成员。此外，识别任何可能做出贡献或需求必须被满足的人，以确保解决方案的成功和价值，也是重要的。


    启动会议提供概述，推动共识，并允许团队在极短的时间内达成一致并规划下一步。


    会议通常持续 30–60 分钟，由计划经理和项目负责人主持。


    > **GEM 提供背景……但不要太早！** 在会议开始前几小时发送会议信息，让参会者做好准备是有价值的。通常情况下，我们会分享 PDF 格式的启动会议幻灯片供预览，以防在会议期间电话会议基础设施出现问题。不要过早发送信息。否则，你可能会影响参会者及其优先级排序。


    结构化的会议允许每个人参与并解决任何技术、业务或政治上的疑虑。它还确保了利益相关者完全投入，最重要的是，我们统一了所有人对想法和解决方案的理解。

    以下是启动会议议程示例：


    - 为什么：动机和受益者

    - 是什么：愿景、里程碑、团队领导力和功能

    - 计划交付物、渠道和流程

    - 团队技能和联系方式


    对于最近开始研究 A3 问题解决——应用精益思维（Finchaugh, 2014）的团队，我们使用了一个一致、正式的启动模板。我们需要选择一种适合自己的策略。没有一刀适用于所有的方案。


    # 规划会议


    我们首先填写启动会议议程的模板。与产品所有者、项目负责人、计划经理和 Scrum 主师合作充实细节，包括跳出思维和想法，并就举办启动会议的日期和时间达成一致。


    > **GEM 尊重家庭时间！** 避免在周五或周末时区安排会议，因为你将侵占周五晚上的家庭时间。可能的话，安排上午和下午的重复会议，让你的团队选择选择他们时区最方便的会议。


    在与兼职志愿者合作时，至少提前一周通知。确保邀请函表现出高度专业性，以强调启动会议和解决方案的重要性。我们只有一次机会吸引志愿者加入。团队的能量和热情水平直接关系到利益相关者在举办活动时的能量。


    使用 Microsoft Visual Studio Online 管理敏捷开源软件项目

    42 / 151


    # 主持会议


    活动的主持者负责确保启动会议圆满成功。在我们的语境下，这通常是我们能够通过面对面会议、电话会议或两者结合聚集所有利益相关者的唯一时间。


    如果你是主持人，请记住：


    - 保持简单！

    - 记录会议，以便参会者离线查看录像。

    - 按时开始和结束会议。我们必须尊重人的时间。

    - 在会议期间定义参与规则——例如，何时跟踪、引导和推迟决策，并记录所有提出的决策和想法。

    - 保持每个人的参与，但要控制局面。


    确保所有人对想法和解决方案的理解达成一致，这是最重要的。

    启动会议的步骤：


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_46_0.png)


    图32。启动会议的步骤。


    在结束结束会议之前，我们要确保每个人对结果满意并知道下一步。


    # 组织团队


    启动会议后，我们收集反馈并（可选地）完善项目：组织团队。为了减少随时间推移的价值损失，重要的是频繁并尽可能地交付价值。


    ```

    MAX = (3–9)n

    建议的团队规模为 6–9 名开发人员，加上 Scrum 主师和产品所有者。对于地理分布的团队，我们建议 n<=2。

    ```

    '
