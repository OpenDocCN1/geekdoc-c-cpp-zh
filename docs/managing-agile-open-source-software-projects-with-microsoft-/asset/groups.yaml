    ## 第一章：构思的分类


    借自 ALM Readiness Treasure Map 的示例对该动机定义如下：


    - 提供一份可用 ALM Readiness 内容的总目录（宝藏图），引导用户完成精通 ALM 实践的过程。用户包括 ALM Rangers 和 ALM 社区，他们希望更精通
    ALM，搜索特定的指导，或希望通过所有指导来跟踪自己的进度。


    ## 愿景


    愿景定义了我们意图解决的问题。愿景概述了架构、技术和核心交付物，并突出了关键收益。当我们在咖啡机旁同事或高级经理询问我们的项目时，这是我们分享的第一个“金句”。ALM
    Readiness Treasure Map 的快速参考表包含以下内容：


    - 增强 ALM Readiness Treasure Map 应用程序现有功能，为用户提供更好的体验。

    - 版本 1.2 提供了一份可用 ALM Readiness 内容的总目录（宝藏图），引导用户完成精通 ALM 实践的过程。使团队能够研究并提供创新的 Windows
    8 用户体验和架构参考示例解决方案，并在 TechReady 16 上演示，以支持 Windows Store 推广。


    ## 分类解决方案


    以目标、验收标准和发布治理的形式对解决方案类型和预期质量进行分类至关重要（表 3）。始终关注整体使命并确保与使命保持一致（图 13）。


    > 由 ALM Rangers 与产品组及领域专家合作创建的实用指南 / 解决方案（如工具），它们填补了开箱即用解决方案的功能缺口


    图 13。我们的使命宣言。


    | 类别 | 描述 |

    | --- | --- |

    | 快速响应示例 | 针对功能缺口快速提供信息、示例和原型，以补充产品和知识库信息。在某些情况下，社区会对这些示例进行调整、增强和维护。示例请参见 TOC—快速响应解决方案²。
    |

    | 指南 | 真实、具有洞察力且实用的指导，由简明的技术概述、规划、使用、演示和实操实验室等主题组成。 |


    使用 Microsoft Visual Studio 管理敏捷开源软件项目 26/151


    ## 章节：构思分类


    | 类别 | 描述 |

    | --- | --- |

    | | TFS 规划和 DR 避免指南²¹ 以及版本控制（以前名为分支与合并）²² 是两个热门示例。更多信息请参见解决方案目录²³。 |

    | 工具 | 用于开箱即用产品功能的解决方案和工具，或用于共享代码、二进制文件和文档的功能原型。WCF 负载测试²⁴ 和单元测试生成器²⁵ 是两个热门示例，前者代表功能解决方案，后者代表原型。更多请参见解决方案目录。
    |

    | 混合 | 两个或多个其他解决方案类别的组合。 |


    表 3。我们使用的解决方案类别。


    预期质量范围从快速响应解决方案的最低质量标准，到主产品（例如 Visual Studio）解决方案的高质量标准不等。有关过程、质量和相关检查列表的更多信息，请参见附录
    A，“支持工具集”。图 14 显示了我们的质量线范围。


    图 14。我们的质量线。


    ## 目标


    对于 SMART²⁶（维基百科，SMART 标准，2015）目标有许多定义。我们使用 SMART 的“具体、可衡量、可实现、现实和基于时间”版本来定义某个发布版本的目标（例如，ALM
    Readiness Treasure Map 的第 3 版本）。表 4 描述了这些内容。


    | 属性 | 描述 |

    | --- | --- |

    | 具体 (Specific) | 目标必须精确且明确。每个团队成员都应该解释每个目标。团队成员之间不应有争议。 |

    | 可衡量 (Measurable) | 目标必须是可衡量的并与预期和验收标准一致。团队和产品负责人必须能够判断何时实现了目标。 |

    | 可实现 (Achievable) | 目标在时间线团队能力范围内是可以实现的。 |

    | 现实 (Realistic) | 目标必须与愿景一致并与整体构思相关。例如，期望 ALM Readiness Treasure Map 提供控制指南或发布管理工具是不切实际的。这种期望会导致挫败和失败。
    |


