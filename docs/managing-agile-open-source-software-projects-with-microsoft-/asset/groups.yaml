    Figure 90. If all else fails, serve pizza!


    Observation of numerous projects has shown that many volunteer team members go
    dark and vanish during the final sprint, when everyone is just waiting for the
    flight to land and the ship-it event to trigger.


    Both innovation and planning help maintain the team’s spirit and ensure that its
    heartbeat is retained until the next adventure dawns. Keeping the team busy is
    important during all sprints but paramount and especially toward the end of the
    sprint.


    # Product Owner sign off


    The final ceremony occurs when the Product Owner signs off on the features, sets
    the feature state to Done, and gives the team a thumbs up to the solution.


    Whether the, a system team, or a centralized support team the solution varies
    from organization to organization. In our case, the ship-it inevitably triggers
    the following actions:


    +   - Solution uploaded to CodePlex as a download.

    - Stable main branch of the solution is merged to a release branch in version
    control.

    - Solution catalogue89 is updated to reflect the solution and associated version.'
