    # 第 4 章：提高质量标准


    从代码编辑过程中发布到公共下载通道，并在最后一个电子书发布时，发布状态从 Beta（测试版）切换到了 RTM（正式版）。


    一个显而易见的异常再次是缺乏明显的规划，这被推给了处理那不幸的第四本电子书的相关项目。


    ## 创新与探索


    在专注于质量和规划的冲刺阶段，两个团队都没有关注可选的创新与研究。重点在于改进这两种解决方案的质量、落地，并为社区交付切实的价值。虽然海盗团队可能会在等待下一次发布期间继续创新和研究，但版本控制指导团队的成员分散到了其他项目，例如
    DevOps 和 DSC，在这些项目中，他们将研究作为专注于培训-研究-规划冲刺阶段的一部分。在专注于质量和规划的冲刺期间，创新和研究是可选的，不应该分散核心目标的注意力：提高质量并顺利交付！*


    ## 让每个人保持忙碌与知通


    版本控制指导团队的成员在专注于质量和规划的冲刺阶段并不忙碌。解决方案基本上已经完成了功能开发，没有后续的发布计划。因此，团队资源逐渐流失，成员搬到了新项目，例如
    vasDesc。虽然在这一次情况下这不是问题，但它提供了一个深刻的提醒：当新的、令人兴奋的机会出现，空闲和无聊的团队成员将会跳船。


    相比之下，我们为宝藏地图团队注入了“有趣”的海盗主题和一位充满激情的项目负责人（PL），并让团队忙于测试（如图 93所示）。并非所有团队成员都会对这种“有趣”因素和“海盗”之类的主题做出反应，但在这种情况下，我们创造了一个似乎从不睡觉的活力团队。关键在于我们在完成发布时，保持团队的参与度并与愿景及目标保持一致。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_112_0.png)


    图 93。有趣的主题很有帮助！


    ## 制造声势


    当团队发布时，无论是 Beta 版本还是 RTM 版本，他们都会制造声势，宣布发布和限制条件，最重要的是要求大家也这样做。充满激情且直率的团队展示了投入，并对解决方案产生了感染性的兴趣。


    使用 Microsoft Visual Studio Online 管理敏捷开源项目 109/151


    # 第 4 章：提高质量标准


    图 94 显示了博客文章公告和一条推文。信息是透明的，并鼓励社区提供坦诚的反馈。


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_113_0.png)


    图 94。使用博客、Twitter 等工具发布公告。


    此外，鼓励团队成员在公告和博客日志中添加评论，以突出他们为何认为这些解决方案无价之宝，并整合活跃的讨论。


    ## 核心收获


    - 通过尽早、频繁地发布可交付的版本，团队可以收集坦诚的反馈，并能够应对任何业务价值的变化。

    - 质量和冲刺点有助于提高标准。这是团队学习、创新的理想机会，通过关注核心目标和未来功能，这增加了团队的激情。

    - 质量要素（Quality Essentials）和代码编写至关重要的，因为它们确保了工程策略和用户文档的准确性。


    ## 附录 A：支持工具箱


    本附录作为我们在全书中识别出的许多宝石、检查清单以及支持工具和模板的快速参考。一旦你读了之前的章节，本附录将为你提供一个快速参考点，你无需再次扫描章节来寻找你需要的信息。


    注意：我们建议在读完之前的章节后阅读此附录


    ## 想法筛选（Triage of ideas）


    ## 宝石与清单


    角色、职责和所有权（在此处总结为筛选阶段）：


    | 角色 | 职责 | 所有权 |

    |---|---|---|

    | 项目经理 | 与团队协作，负责筛选小组，与领导层合作以完善想法，参与筛选，并推动想法。 | 筛选小组<br>筛选<br>环境<br>交付 |

    | Scrum Master | 在筛选期间维护团队，维护框架，并消除阻碍。 | 流程<br>框架<br> Scrum Master |


    **鼓励想法** 并非所有想法都是坏想法，我们根据截止日期来鼓励想法。目标是明确的，并符合预期验收标准。


    **捕捉想法** 无论想法多么小或遥远，都应该被捕获。我们根据类型和来源来标记想法。


    | 类别 | 描述 |

    |---|---|

    | 类型 | 架构 | 专注于架构或基础设施变更的想法。 |

    | | 业务 | 专注于业务功能或用户体验的想法。 |

    | | 维护 | 专注于维护演进的想法。 |

    | | 社区 | 源自社区的想法。 |

    | | 研究 | 专注于研究或未来技术的想法。 |

    | | 战略 | 源自领导层、市场小组的想法。 |

    | | 用户 | 源自用户论坛的想法。 |


    # 附录 A：支持工具箱


    应定期筛选想法，以查看它们如何符合优先级、策略和投资回报。价值随时间推移而递减。应优先考虑可以快速开发或拆分为更小增量的想法。有关更多信息请参考最短作业下一步（JN）和最短作业优先（SJF）。在筛选想法时，了解你的局限是一个重要的指标。


    - 最好的想法候选是那些价值最高、交付最快且对主产品线和使命影响最小的想法。不要拖累整个世界。| 最好的维护模式候选是那些业务价值下降、需要维护投入且与策略不匹配的想法。不要为没有价值的解决方案投入宝贵资源。


    - 即使处于 Alpha 或 Beta 状态也要分享，以获得早期反馈。 | 赋予社区影响并接管进入维护模式的解决方案。


    共享所有权意味着多个所有者和支持协议等。成功的关键是在交付过程中建立“共享所有权”意识。一旦这种建立，失去团队成员的影响将大大减少，因为她的职责很容易被团队其他人接替。


    SMART 目标定义如下：


    | 属性 | 描述 |

    |---|---|

    | 具体 (Specific) | 目标需要精确且无歧。每个团队成员都应该解释每个目标。成员之间不应有争议。 |

    | 可衡量 (Measurable) | 目标必须是可衡量的，并符合预期和验收标准。团队和产品负责人能够判断何时实现了目标。 |

    | 可行 (Achievable) | 目标在规定的时间和团队能力范围内应该是可行的。 |

    | 现实 (Realistic) | 必须符合愿景并与整体想法相关。例如，期望就绪团队交付版本控制指南或发布管理工具是不现实的。这种期望会导致挫败和失败。
    |

    | 有限 (Time-based) | 我们必须在特定时间内为目标设定完成日期，并将其与整体路线图对齐。 |


