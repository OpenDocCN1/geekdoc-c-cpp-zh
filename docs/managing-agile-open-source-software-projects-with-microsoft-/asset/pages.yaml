    # Training-research-plan (TRP)


    > GEM Know your destiny!

    As a scuba diver, you must plan your dive, limiting your maximum depth and time,
    and agreeing on the objectives. Unless you are on a military or search-recovery
    mission, the actual excursion is very agile. Yet everyone knows the plan. Everyone
    is in a position to mitigate changing environments and assist one''s friends in
    times of need.


    Each new project or release starts with training-research-planning and optionally
    ends with a focus on raising the quality bar and additional planning, as discussed
    in the section ''Raising the quality bar.''


    The introduction of training-research-planning and a quality-research focus will
    create a perception of a predictive waterfall-like process. With geographically
    distributed and part-time teams, many of members will never meet each other in
    person, it is imperative that we understand the idea and need features, and agree
    on the requirements, that the team be in a position to optimize the delivery time
    and reduce the value drain.


    The focus on training-research-planning can occur over either an entire or a partial
    sprint. With complex or new technology projects, a complete sprint is typical,
    whereas subsequent releases of the same usually require only a partial sprint.


    The training-research-planning focus allows the team to understand and optionally
    refine the project:


    +   - Motivation (why)

    - Vision (what)

    - SMART³ objectives (Wikipedia, SMART Criteria, 2015)

