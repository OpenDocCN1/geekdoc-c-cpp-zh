    # One to three per feature


    The number of features defined per Epic depends on the granularity of each feature.
    We define one to three "must have" features and optionally one to two "exceeded"
    features. Defining more features disperses the team''s focus, coordination, and
    introduces the potential of scope creep.


    # Roadmap


    Now that we have proposed motivation, vision, category, and features, we can talk
    about the roadmap that defines one or more teams will realize the idea. As discussed
    in "One maintainable environment," we use shared sprints (iterations) for all
    our teams. The gray-haired users use the MSF tradeoff, which states that if we
    fix one side of the triangle (the schedule, for example), changing the second
    side of the triangle (features) will affect the third side (resources). Therefore,
    when we schedule or for-roadmap, any increase in scope implies that we need more
    resources. A reduction of resources means we will reduce scope. Figure 17 illustrates
    the trilogy.


    The second scenario (a reduction of resources) is common in our part-time, volunteer-based
    community and project teams.


