  md: '# Case study: ALM Readiness Treasure Map . . . walking the plank


    Managing a virtual team distributed around the globe and establishing a team identity
    is a complex challenge. We introduce the ALM Readiness Treasure Map team because
    they have managed to create a cohesive and effective team scattered across Brazil,
    Canada, India, South Africa, the United Kingdom, and the United States (Figure
    104 and 105).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_148_0.png)


    Figure 104. Captain Robert Bernstein^{133} introduced an exciting team spirit
    and identity.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_148_1.png)


    Figure 105. Distributed ALM Readiness Treasure Map team.


    # Background information


    The team''s original motivation was to provide a master catalog (treasure map)
    of the available ALM Readiness content to guide and track anyone through the process
    of becoming proficient in ALM practices. The design and development of the map
    intended to dogfood new concepts and technologies while delivering a quality reference
    solution. Find more information at TOC—ALM Readiness Treasure Map.^{134}


