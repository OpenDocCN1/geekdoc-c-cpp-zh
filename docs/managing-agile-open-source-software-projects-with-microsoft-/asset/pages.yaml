  md: '# Team and their use of technology


    The team operated with clear rules, responsibilities, and ownership, using our
    process and scheduling weekly scrum meetings. We constrained these meetings to
    15 minutes of status feedback and 15 optional minutes of questions and answers.
    As part of the team inevitably attended the meetings at dawn, during business
    hours, or in the evening, the management of time was important to use time and
    limit impact on real jobs and family time.


    Visual Studio Online (VSO), Microsoft Lynx, and Skype have been the home of the
    team from the start of their journey. They continue to push horizons, learning
    and researching about new Visual Studio and Windows features, dogfooding emerging
    VSO features and process innovations.


    The recently teamed TFS Agile Poker and the Lynch poll forecast to estimate their
    stories and tasks for the next adventure. The result was candid feedback to Mike
    Douglas¹¹³⁶ of TFS Agile Poker, and the realization that playing poker is free
    and rewarding to estimate as a team, but polls are a great suck bottom (106).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_149_0.png)


    Figure 106. Using TFS Agile Poker (left) and the Lynch poll to estimate stories.


    The team created a treasure hunt and evolved a pirate identity, which created
    an inspirational team dynamic. Meetings to start with "................." Team
    members who failed to deliver on their objectives had to walk a virtual park.
    A treasure map without the captain at the helm (podium) is just not the same.


    # Key learnings


    +   - We have to be cognizant that we are working with a variety of different
    cultures and that we can neither make assumptions about cultural norms or customs
    for granted.

    - We have to acknowledge that all persone and stakeholders have much to learn
    from each other. Information and responsibility sharing is key to productive and
    rewarding team effort.

    - We have to realize that there is a time to be serious and a time to have fun.
    Getting the balance of serious versus fun and work family optimally calibrated
    is not easy, but it is important to morale, productivity, and health.'
