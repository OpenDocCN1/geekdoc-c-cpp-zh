  md: '# So is 1 story point == 8 hours?


    No! A story point represents the perceived and relative sizing of stories.

    A story with one (1) story point can be potentially developed, tested, and shipped
    in a day by the team. Other teams may require more or less than a day, and not
    every day is necessary eight (8) working hours long.\ Once the team has established
    a known and consistent velocity, we can estimate how many days it might take to
    implement the team''s backlog:


    *Estimated duration in days = (days per story * backlog size estimate / velocity)*


    This is our degree of accuracy when we estimate at a feature (release) and Story
    (feature team) level.


    # What about part-time estimations?


    We do all estimations based on a full-time team and, as discussed. Then we estimate
    how much the average velocity is on a part-time basis as follows:


    +   * Estimate how much of a calendar week can be committed.

    * Multiply the weekly velocity by the percentage of possible part-time commitment.

    * Round the result to the nearest integer.

    * The result is the maximum part-time developer/contributor/tester/reviewer team
    can deliver in one sprint.


    We work with a case of 3 story points per part-time per sprint. Any story larger
    than the 3 story point/s velocity is broken down into smaller stories. In other
    words, any story estimated as 5, 8, and 13 are not potential candidates for a
    forthcoming sprint. [Radio TFS and the GREAT curve ball question about (ex-nightmare)
    shorter delivery cycles](52) for a more detailed breakdown.


    > GEM 1/8 and max 3

    The best-case part-time commitment achieved with our community maxes out at one-eight,
    and the maximum velocity estimated as 3 story points. Do not strive for a higher
    velocity as the family>job community balance is essential to keep volunteers passionately
    engaged without out!


    # What about estimations across different teams?


    In an ideal world, the velocity is determined on a team level and typically varies
    from team to team. We do not commonly dedicate resources to a project full-time
    or long-term. Instead, the team members are engaged in multiple projects and jump
    from project to project, making it very difficult to establish a consistent velocity
    per team. (See Figure 44.)'
