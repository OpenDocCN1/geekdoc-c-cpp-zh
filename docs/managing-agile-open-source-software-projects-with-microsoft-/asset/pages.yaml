    Ideas gathering<br>- Pre-triage |

    | Scrum Master | Mentors the teams, enforces the framework guidelines, eliminates
    impediments raised during the triage phase, and actively leads the continuous
    improvement and training efforts. | - Process<br>- Framework<br>- Scrum Masters
    |


    **Encourage ideas and feedback** There is no such thing as a bad idea or question.
    They, in fact, highlight a very different perspective and produce surprising results
    and conversation points.


    **Capture ideas** Every idea, no matter how small or far-fetched, should be captured.
    Revisiting an idea could provoke a totally different reaction than when it was
    logged, perhaps leading to solutions and ideas that were never imagined at the
    time. We tag ideas by type and source.


    | Category Values | Description |

    |---|---|---|

    | Type | Architecture | Ideas focused on architectural or infrastructure changes
    that are typically reusable and evolve.

    | | Business | Ideas focused on business functionality or user experience. This
    is our default type.

    | | Ruck | Ideas focused on our ''loose-Scrum'' framework, documented herein.

    | | Community idea | Ideas sourced from the BLM communities, typically during
    events.

    | | Research idea | Ideas sourced from Rangers who intend to research or future-proof
    technologies.

    | | Strategic idea | Ideas sourced from the Studio leadership, marketing, or product
    groups.

    | | UserVoice idea | Ideas sourced from the UserForum.'
