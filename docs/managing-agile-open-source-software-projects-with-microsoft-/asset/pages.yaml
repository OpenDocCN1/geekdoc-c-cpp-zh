  md: '# SAFe


    Scaled Agile Framework (SAFe)¹¹² does a very good job of describing approaches
    to Agile and Scrum from top to bottom in larger organizations where importance
    is placed on budget and shift that may have known. SAFe does this well-established
    and well-outlined framework, principles, and best engineering practices that are
    based on the fundamentals of Lean, Kanban, Scrum, and Extreme Programming.


    We are adopting some of the best practices from SAFe. For example, we use the
    SAFe naming convention for sprints and standardized estimation so that we normalize
    the values across all projects. In other words, a value of 3 for estimation is
    uniform across all projects and teams.


    Microsoft published the Scaled Agile Framework: Using TFS to support epochs, release
    trains, and multiple backlogs¹¹³ paper on the implementation of SAFe in the Team
    Foundation Server process templates. In addition, we provide collateral tools
    to implement SAFe support in our process template.


    # Using testimony wisely


    We base our work on the Microsoft Visual Studio backbone. Team Foundation Server
    for experimentation and Visual Studio Online for our operational needs. Yet, this
    does not preclude us from leveraging third-party solutions to deliver on our mission.
    Identifying the right tasks is as important as using the right process.


    # Team Foundation Server


    Before we used Visual Studio Online, we leveraged the internal Microsoft IT managed
    Team Foundation Server. worked well for us, and our challenges were to extend
    the internal services to team members who are not full-time employees and managing
    process customizations. We could customize-work-item templates for existing projects,
    but we could not update custom process templates with our changes for new teams.
    Customizing-work-item templates for each project was much with little return on
    our investment. The upside is we with the existing process templates without customization,
    and us to provide valuable feedback to the product group that would often result
    in product changes for the next release. In addition, we avoided process template
    changes that may have enabled process changes but may not have business value.
    This limited contention for us is we move to Visual Studio Online.


    # Visual Studio Online


    We one of the first organizations to use Visual Studio Online (VSO); initially,
    Microsoft named it TFSPreview. VSO maintained the same constraint for process
    template customization and added a new constraint for work-item customization.
    However, these constraints resulted in providing valuable feedback to the product
    team. The new delivery cadence, features and cloud deployment meant our suggestions
    made their way into the product quickly. We would test these changes before we
    enabled the feature for all users. In VSO, we manage all of our work in one team
    project collection and in one team project using teams.


    In fact, April 2011, we moved all teams from on-premises environments to the VSO
    service, with no easy or painless return strategy . . . we committed to making
    it!


    # CodePlex


    CodePlex¹⁴ is a Microsoft website for hosting shared development of open source
    software. CodePlex is where engineers and computer scientists share projects ideas,
    and the source code. It features such as wiki pages,


    ```

    http://scaledagileframework.com/

