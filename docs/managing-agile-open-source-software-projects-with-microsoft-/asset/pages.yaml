    # Organizing the team


    After the kickoff, we consolidate the feedback and continue refining the Epic
    and the features for the project, while we assemble the team and decide whether
    we need one or two feature teams. To minimize degradation of value over time,
    it is important to ship value often and as soon as possible. It is important to
    realize that we can always raise an idea and a subsequent release, we can always
    do better next time, but we have only one chance to get each release shipped.


    ```

    MAX = (3–9)n +2

    The recommended team size is 6~3 development team members per feature area (n),
    plus the Scrum Master and Product Owner, spanning across all feature areas of
