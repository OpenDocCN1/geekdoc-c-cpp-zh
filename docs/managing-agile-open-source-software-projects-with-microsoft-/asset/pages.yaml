    # One (or few) team project(s)


    We keep the number of team project collections as small as possible to minimize
    administration cost and, most importantly, to keep it simple for the user. Switching
    between team project collections closes all queries, items, documents, and solutions.
    This frequent switching can be a daunting, confusing, and unproductive experience.


    Our decision to create Visual Studio Online enforced the one project collection
    model because each service account is currently limited to one team project. This
    implies that we are reaping the advantages of administrative and user simplicity,
    as well as the ability to share artifacts among team projects.


    In the future, we may have the "potential" need for more team project collections
    if the service introduces support for more than one collection per account. What
    we would like to change, when possible, is the team project collection name to
    make it more descriptive.


    > NOTE We live and thrive within one team project collection.


    # One (or few) team project(s)


    Planning of team projects is crucial, because once it becomes immutable and, very
    difficult and costly to change. Our objectives were to improve the user experience,
    centralize the backlog and bug management on one process template, and to dogfood
    and align our environment with our latest planning guidance.


    Looking back over the past year, the move to a single project has been interesting,
    sometimes challenging, but definitely a good one. For those who have embraced
    the environment and the supporting process, the productivity gain through less
    context switching (remember, context switching is a waste) and better sharing,
    as well as improved transparency across projects, is both evident and accepted.


    In reality, our team project collection contains nine teams. We started with one
    team project model, now in one team project product (Visual Studio ALM), and anticipate
    that the collection will have no more than three projects in the future.


    Are we really using one team project? The answer is both yes and no (Figure 98).


