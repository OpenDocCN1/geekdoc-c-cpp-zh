    # TAKING OFF INFLIGHT LANDED


    Figure 88. Simplistic view of Product Owner''s involvement during a part-time
    flight.


    As we''ve discussed earlier, the Product Owner determines the ① features and owns
    ② tracks the objectives, acceptance criteria, and scope, ③ tracks and collaborates
    with the team during 1–3 development sprints, and ④ accepts the quality bar. In
    addition, the Product Owner may defer features and associated stories or remove
    them from the scope entirely while dearing up for the release.


    The Product Owner "owns" the release before takeoff, during its flight, and after
    landing. It is a critical role and often referred to as the "soul" of the project.
    The "bits and bytes" stop with the Product Owner! No "soul," no "pulse," means
    no shippable release.


    Step ③ is ceremonial which we will discuss shortly.


    # When should we release?


    The more difficult question, and the reason we pause after step ⑤ in the previous
    diagram, is when we do land the flight to "ship? At this stage, our team is ready
    to ship, confidence is high, and excitement is rising with the ominous drumroll.


    The next important responsibility of the Product Owner is to synchronize with
    the stakeholders and ensure that the landing will have an optimal impact for the
    organization and community. Some of the important considerations include:


    +   - The system-support team is ready and capable of supporting the new release.

    - The release will not have a negative impact on any other imminent release.

    - The community is not currently swamped with events or other product releases.

    - The community is not overwhelmed with too frequent and too many releases.


    Optimally, the "when" is before or coincides with the end of the sprint (Figure
    88).


