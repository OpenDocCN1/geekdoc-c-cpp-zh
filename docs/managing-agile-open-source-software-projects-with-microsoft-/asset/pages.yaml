    | Scrum Master keeps team focused and removes blockers | Scrum Master keeps team
    focused |

    | Each sprint delivers potentially shabby product | Each sprint delivers potentially
    shabby product |

    | Each sprint ends with a sprint review and retrospective | Each sprint ends with
    a sprint review and retrospective |

    | Team is typically full-time and colocated | Team is typically part-time and
    not colocated |


    Table 12. Comparing pure Scrum recommendations to our reality.


    # Kanban


    Kanban is a method for process improvement. Initially, Kanban for software development
    was positioned as a process and later positioned as a process improvement that
    works on top of our existing process. In software development, teams apply Kanban
    to their software development process to help the team. Kanban pulls from the
    principles of Lean manufacturing, which is based on systems thinking, to take
    an overall view of our software development process from end to end, identifying
    wasteful activities. Eliminating waste is a key principle. Kanban provides tools
    to aid in the identification of waste for elimination.


    # Principles of Kanban


    In software development, Kanban focuses on the time it takes for work to go through
    one''s process from conception to final delivery, also known as "cash to cash."
    We call this lead time. The delivery to the customer represents realized value.
    So, through reduced lead time, the customer swiftly receives the value.


    # Visualize the workflow


    Visualization of workflow is key in understanding the flow of work through our
    software development process and identifying the phases in our process. Visual
    Studio Online and Foundation Server provide such visualization with a Cumulative
    Flow Diagram and a Kanban board. These visualizations are useful in viewing the
    work and phases and tell a story at a glance about the team and its work.


    # Limit work in progress


    Kanban is based on working-in-progress (WIP) limits at each stage of the workflow
    and relies on a pull push mechanism for new work. This emphasizes the completion
    of work over the acceptance of new work. The net effect is to concentrate on features
    at the same time; remember that one of the wastes is task switching. WIP limits
    reduce a buildup of unfinished work, another waste previously mentioned. By preventing
    people from starting (pulling) new work, WIP limits expose constraints or bottlenecks
    in an organization''s process. Focusing improvement methods on these constraints
    ensures the highest payback.'
