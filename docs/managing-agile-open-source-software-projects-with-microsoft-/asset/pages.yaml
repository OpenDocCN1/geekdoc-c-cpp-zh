  md: '# Chapter 2: Getting ready


    Figure 33 emphasizes that we operate in an atypical ecosystem. The portfolio level,
    where ideas and themes emerge, is worldwide. The solution level, where projects
    (flights) are instantiated, is also worldwide, and its members are geographically
    dispersed virtual teams based on passion, knowledge and time investments by part-time
    volunteers. Continuous evolution allows us to adapt and grow in response to an
    increase in solution demands and a requirement in delivery capacity, both of which
    the ecosystem and teams demand.


