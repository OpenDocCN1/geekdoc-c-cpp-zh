    **Grooming** Produce a trim and clean backlog of requirements and better understand
    what needs to be done, in order, and by when.


    **GEM** Groom top down

    Ensure that the Product Owner and stakeholders prioritize all backlog items. Work
    through the backlog from the top (most important) to the bottom (least important)
    in the list of backlog items.


    # Raising the quality bar


    # Gems and planning


    **Quality and planning** We end projects with a focus on raising the quality bar
    and planning the future.


    **GEM** Automation "rocks"

    While different there is a place for manual testing, test automation allows teams
    to run more tests, more often and continuously. Carefully evaluate and select
    the test that suits your team and investigate When to Test Manually and When to
    Automate.¹100


    **Review process** We have a well-defined review process to ensure that we can
    gather feedback and track its integration through development. Make sure the team
    is aware of the process to ensure that quality is maintained from the start.


    **Maturity milestones** Shipping early to targeted audiences drive early feedback.


    | Milestone | Description | State of the nation |

    | Raw | Refers to all activities performed during research and prototyping, typically
    performed during the sprint(s) focused on training-planning. | Unknown |

    | Prealpha | Refers to all activities performed during the development sprints
    delivering features, but not including testing and reviews. | Unknown |

    | Alpha | The first phase in which to begin and establishing testing and reviews,
    with the knowledge that we are working with a feature incomplete unstable solution.
    The team may decide to release an internal-only/private alpha to obtain early
    feedback from the "restricted" community. | Unstable, feature, incomplete, and
    likely to crash. |

    | Beta "silent" | This is the phase when a solution is complete but with impediments
    and bugs. While working on resolutions, stabilization, and overall quality improvements,
    the team may decide to release one or more internal-only/private silent beta to
    expose the solution to a selected audience and get real-world feedback. | Stable,
    feature, complete, and unlikely to crash. |

    | Beta “public” | The Product Owner (PO) signs-off on the quality bar, acknowledging
    that the solution is complete and ready for a public beta. The intent of a public
    beta is to release the solution as it is landed or shipped. Potential users are
    made aware that they are entering beta territory and could be nonbreaking changes.
    | Minimum quality bar met. |


