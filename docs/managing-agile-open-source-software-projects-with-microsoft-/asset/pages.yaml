  md: '# Chapter 1: Triage ideas


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_35_0.png)


    Figure 20. Perceived value and effort of projects as team size and number of projects
    grew.


    What is evident that our teams and overall program cannot scale indefinitely.
    The more that geographically distributed teams and more members need to be coordinated,
    the greater the amount of effort and distribution of focus is required from the
    Project Lead and Program Manager, over a project and overall ecosystem.


    It is futile to argue with management—who are used to full-time enterprise or
    even full-time geographically dispersed teams—part-time availability, and lack
    of resource commitment are challenging.


    +   **Pillar #1—Respect for People** (Lean Enterprise Institute, 2009) can be
    a challenge for us. The Project Lead and Program Manager need to be cognizant
    of infringing on precious family time, the volunteer''s role, and the variation
    of traditions and cultures across time zones and around the globe. It is a truly
    interesting and rewarding effort, but definitely not an easy to coordinate and
    balance with the demand for business value and roadmap timelines, both of which
    are utterly intangible.

    **Pillar #2—Continuous Improvement** (Lean Enterprise Institute, 2009) is another
    potential challenge. The technology, process, and overall ecosystem constantly
    evolve as technology changes. Team retrospectives share learnings and adopting
    adapts accordingly.


    Essentially, each Project Lead and each Program Manager have their own instance
    of an active queue of things they are tracking, on, and deferring. Queue management
    is crucial, the longer the queue, the longer the response cycles and the greater
    the delay and impact on teams, with a rapid decline in overall quality and motivation.


    > MAX = 2-3 projects per Program Manager

    For geographically distributed teams we recommend that n<=3 per Program Manager
    (PM), allowing the PM to focus on the teams and associated flights.


    We recommend the following guidelines (illustrated in Figure 21):


    +   * A team consists of one or two feature teams, with each up to seven team
    members.

    * A Project Lead owns one-flight project release.

    * A Program Manager is responsible for one to three in-flight project releases.

    * A Scrum Master is responsible for one to three in-flight project releases until
    the team becomes self-organizing and self-sufficient.'
