  md: '# Chapter 4: Raising the quality bar


    > Now is not the end. It is not even the beginning of the end. But it is, perhaps,
    the end of the beginning.

    Winston Churchill


    We complete our roadmap and associated release flight by raising the quality bar
    and planning the future (Figure 81). This is an opportunity for team members to
    innovate, plan, and reflect on the themselves, and the overall process in order
    to support continuous improvement. It provides the time to complete activities
    often forgotten or postponed critical development and testing phases, especially
    with geographically dispersed and part-team projects.


    training, research & planning


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_99_0.png)


    Figure 81. Lifecycle: Quality and planning.


    # Quality and planning (QP)


    At the end of every sprint, we ship a working solution and offer evidence that
    we are making progress. The idea is to release early and be in a position to react
    to business value changes and candid feedback. What makes the final focus on quality
    and planning (QP) different is that we have a goal of shipping (also referred
    to as landing) the release. The team completes the roadmap and releases the teams
    for other project adventures or another (vnext) of the sprint.


    The core themes of the focus on quality and planning (QP) are to raise the quality
    bar and plan to the future. In addition, the team may use this opportunity for
    additional research, innovation, and hackathons for the future.


    # What it is not


    It is important that every team has a discussion to understand what the focus
    on quality and planning is not.


    +   - It is not a dumping ground for technical debt, such as code refactoring,
    or quality processes. We need to schedule and include these technical-debt activities
    during every sprint—to continue with a view of learning and improving.

    - It is not about reaching a minimum quality bar. We need to reach a minimum quality
    bar at the end of every sprint.

    - It is not opportunity to schedule incomplete features. In fact, developers should
    be “sitting on their hands,” and teams do not permit new feature development during
    this sprint.


    # Hardening


    With an understanding of what the focus on quality and planning (QP) is not, the
    time is right to talk about the hardening, innovation, and planning projects.
    At this stage of the flight we have reached the minimum quality bar as agreed,
    using the definition of done and acceptance criteria. We continue to harden or
    improve the solution.


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online'
