    Knowing our limits is an important metric when triaging ideas and selecting our
    next adventures.


    # Visibility from start to finish


    A few years ago, project dashboards were in vogue and promised successful project
    management. Unfortunately, the overuse and misuse of widgets, gadgets, and colors
    created overwhelming dashboards that made it difficult to spot the "eye of the
    storm" and ignore information until it was too late.


    We rely on two of dashboards to visualize status and trends over time.


    The first is a visualization that seems natural to anyone who has traveled by
    bus, train, ship, or plane and tracked their departure, arrival, or connecting
    journey to the status board. Using the Flight Plan¹³ community solution, we visualize
    our landed, in flight and implements on our flight plan board, pulling this information
    in real-time from our Visual Studio Online. Use of a common user experience makes
    the information easy to consume, and the subtle use of colors makes us aware of
    potential issues.


    +   - Green The Product Owner signs off the (project), it has landed successfully,
    and therefore meets expectations.

    - Blue The flight (project) is in flight (under construction) and is on track.

    - Red The flight (project) is in flight (under construction) but is overdue and
    requires attention.

    - Gray The flight (project) is one of the next ideas to prepare for takeoff.


