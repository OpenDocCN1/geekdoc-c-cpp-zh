  md: '# What’s Next?


    It’s up to you now . . .


    We have entered an era where we continuously reflect on ourselves and innovate
    and evolve as rapidly as user requirements are changing and software solutions
    are evolving. We need to ensure that we maintain to the user, or we face rapid
    extinction.


    Summarizing our learnings and recommendations in this book was the fun, brief,
    and easy part of a potentially long-term journey. We hope that we have given you
    actionable gems, initiated around potential innovations in your environment, and
    that you will continue to support and encourage self-organized Agile teams. We
    encourage you to give us candid feedback and wish you success in your software
    adventures.


    # Continuous innovation


    For us, this is not the end of the road. As products such as Visual Studio Online138
    evolve, we will innovate, adapt, and improve our own frameworks. If the practical
    guidance summarized herein proves valuable, we may even meet for a revision of
    this publication.


    # Further information


    For further information, please visit Visual Studio ALM Ranger Solutions Catalogue139
    or email the authors.140


