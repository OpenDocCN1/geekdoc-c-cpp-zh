  md: '# Chapter 3: Building the working solutions


    # Confidence


    What if the team decides to take note of a change in delivering the team''s sprint
    objectives?


    Stakeholders confidence. If the team''s confidence increases, we have no problem.
    An increase typically signals a maturing team, a rise in passion and interest,
    and confidence in the current and future releases.


    If confidence decreases, we potentially have a problem, ranging from a lack of
    pizza to Chernobyl disaster.¹76 It is important for the stakeholders, in the Product
    Owner, Project Lead, and Program Manager, to analyze the cause of the decline
    and to reflect, plan, and adjust until we restore confidence.


    > WARNING Low confidence is disastrous with disrupted and part-time teams

    A part-time and volunteer-based team is driven by passion, ego, and confidence.
    A loss in confidence is infectious and may result in parts or your entire team
    going dark.


    # Be brave and reset if you need


    What if we have to stop and reset?


    "Responding to change following a plan" (Agile Manifesto, 2001), by its very nature,
    implies that there comes a time when it is a good idea for the team to stop, reflect,
    and improve the solution. If this requires a reset of the current sprint or the
    current release roadmap, the team should not reset. Remember that the Product
    Owner is responsible for delivering the solution and the business value and however,
    it has the authority to approve or cancel a release.

    If a reset occurs, a cancellation of the current release, maximizes the overall
    value to the business, and then it is a drastic decision the team needs to accept.

    Always reflect to understand what has happened and innovate to keep it from happening
    again.


    What are some of the possible reasons for resetting or cancelling a sprint?


    +   - Architecture or technology used to develop or host is phased out.

    - Business strategies change, eliminating the perceived business value of the
    solution.

    - Expertise or resource bandwidth is no longer committed or available to the team.

    - Extraordinary circumstances, such as a natural disaster that impacts the team
    or solution.


    # Watch for "smoke" signals


    As described herein, the two major negative signals to monitor are:


    +   - Scope creep (creep) from top down, which causes churn and frustration with
    the teams, especially investing their personal time on part-time, volunteer, and
    moonlighting projects.

    - Decline of confidence from bottom up, which indicates a loss of passion and
    commitment and a potential for parts of the team going dark. Figure 73 shows the
    effect of these signals.'
