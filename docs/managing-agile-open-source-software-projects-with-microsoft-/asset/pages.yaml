  md: 'About us


    # About us


    # Authors Blackman


    Brian Blackman is a principal consultant with Microsoft Premier Developer, focusing
    on affecting the success of ISV partners and enterprises in engineering and the
    marketplace. He has an MBA, is a CSM, CSP, C+, SAFe Agilist, Agile, and a Visual
    Studio ALM Ranger. During his tenure at Microsoft, he has worked with Windows
    for Automotive, Mobile Access, SQL Server, Windows Embedded, Visual Studio, and
    Team Founder Server. When he is not Scrum Mastering and consulting to ALM Ranger,
    he spends his time writing code, and developing works, in various concentrations,
    especially helping organizations in their quest for business agility. Brian''s
    author of technical content featured in the first release of the MSD library,
