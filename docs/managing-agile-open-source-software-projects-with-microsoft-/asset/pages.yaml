  md: '# Building the working solutions


    # Gems


    Heartbeat The heartbeat and pulse of an Agile team is an iterative and consistent
    cadence.


    **Pull and push** Adopt a policy and design the unturn stories by team members
    by default, but be ready to prepare and push stories to team members who hesitate
    to grab stories from the backlog.


    **Sprint objectives** Rule the deliverable, the features from the team. These
    reinforce why we are doing the project, what needs to be done, who will be responsible
    for it, and how confident the team is about succeeding


    **Repetition** Adopt a sprint pattern that is natural to the team and repeat,
    repeat, repeat. For example:


    +   - Assume ownership of the sprint challenge as a team—example, return to moon
    Europa.

    - Review and refine the objectives, the requirements, and the features from the
    sprint backlog—for example, transfer W Astron X Y of samples, and return to Terra
    within Z years. Verify that we understand the requirements, and are in a position
    to meet the acceptance criteria, and are in a position to proceed with none or
    manageable unknowns.

    - Plan and design the sprint development journey.

    - Develop the features to realize the requirements.

    - Integrate, test, and validate the features.

    - Reflect on the sprint, identify improvements, and plan the next actions.

    - Demo and show working(solution);


    **Scrums** These meetings project the project goal and transparency. Schedule
    a short, effective meeting as possible.


    | GEMS | **Weekly heartbeat “rocks”** |

    | --- | --- |

    | With geographically distributed, part-time, and virtual teams, a weekly scrum,
    which adheres to a 15 [+15] minute time box, is recommended. |

    | **Regular heartbeat “rocks”** |

    | With geographically distributed, part-time, and virtual teams, we recommend
    a once-per-sprint scrum of scrums that adheres to a 2-3 minute per team box |


    **Demos** These are an opportunity for the team, leadership, and stakeholders
    to synchronize.


    | GEM | **2-3 minute demo video “rocks”** |

    | --- | --- |

    | The testers/reviewers are in a prime position to record their validation tests
    and produce a video used as a demo and visual communication. Keep your video to
    2 minutes (optimal) to 3 minutes (maximum) for the greatest impact. |


    **Retrospective** Use the retrospective to gather subjective and quantitative
