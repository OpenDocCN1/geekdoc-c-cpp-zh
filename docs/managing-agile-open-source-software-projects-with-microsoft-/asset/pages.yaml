  md: '# INVEST in features The INVEST²³ acronym is useful for managing features that
    owners identify for the team

    invest in the next and optionally future features of the solution.


    | Property | Description |

    | --- | --- |

    | Independent | Self-contained, loosely coupled, and with tight cohesion. |

    | Negotiable | Until a feature is committed, we can renegotiate and revise it.
    |

    | Valuable | Feature must add value. |

    | Estimable | Feature must align with our estimation strategy. |

    | Small | Size of the feature must be realistic and fit into the iteration cadence
    and release milestone. |

    | Testable | Feature must have clear acceptance criteria that we use to create
    test cases and sign off of the feature as done. |


    Time box and limit work in Progress (WIP) We have found that using time boxes
    and limiting working in progress, we reduce the strain on project management and
    wisely smaller bits of value more rapidly. Always keep in mind the tradeoff triangle.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_116_0.png)


    > One to three features per flight

    The number of features defined per Epic depends on the granularity of each feature.
    We recommend defining one to two “must-have” features and optionally one to two
    “exceeded” features. Defining more features disturbs the team’s focus, complicates
    coordination, and introduces the potential of scope creep.


    Identify passionate owners We typically utilize a Product Owner, Project Lead,
    and Program Manager, we feel free to choose where necessary. Based on our dogfood
    observations, we recommend that:


    +   - A team consists of one or two feature teams, with up to seven feature team
    members.

    - A Project Lead owns one in-flight project release.

    - A Program Manager is responsible for one to three in-flight project releases.

    - A Scrum Master is responsible for one to three in-flight project releases and
    serves as a potential emergency backup for another Scrum Master and associated
    teams.


    Visibility is key Make use of dashboards to provide status and trend information.'
