    # Triaging ideas to meet priorities, strategies, and return on investment (ROI)


    We actively manage the backlog to keep it from stagnating. Our default triage
    cadence is quarterly, aligned with the organizational financial year and introducing
    a predictable planning rhythm. As shown in Figure 5, we initiate a triage in January,
    April, July, and October. If a new priority or critical idea emerges, we trigger
    an ad hoc triage.


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_22_1.png)


    Figure 5. Quarterly triage cadence.


    # Pre-triage . . warming up


    In the pre-triage phase, we review ideas that have landed (released) or are in
    flight (under development). For new ideas, we provide a list of service-mode candidates,
    an ordered list of new candidates, and a report that we submit to the triage group
    for consideration (Figure 6).


