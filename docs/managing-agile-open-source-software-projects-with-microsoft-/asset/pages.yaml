  md: '# Chapter 3: Building the working solutions


    The decisive test is how the reviewers, testers, and eventually the stakeholders
    perceive the solution.

    Assume we go to the local grocery and buy a can of baked beans. We read the brief
    instructions on how to open the can, what would we expect in can? Comprehensive
    documentation for how to plan, harvest, and process beans or a portion of baked
    beans in tomato sauce, ready for consumption? Most likely the latter.

    Every sprint is an opportunity for the team to deliver an update to the baked
    beans and obtain candid feedback and guidance from the customer about how to improve
    the value added.


    # Demo


    The demonstration is an opportunity for the team, leadership, and stakeholders
    to synchronize face to face (preferred) or in a virtualFace-to-virtualFace videocon
    call. Demonstrate each story that was committed by the team and discuss candid
    feedback from stakeholders.

    After delivering the working demo, the team should have a clear understanding
    of whether the objectives for the sprint were achieved–and whether they were or
    not, what needs to be planned in the next sprint.


    +   2-3 minute demo video "rocks"

    The testers/reviewers are in a prime position to review their validation tests
    and produce a video used as a demo and video documentation. Keep your video to
    2 (optimal) to 3 (maximum) minutes for maximum impact.


    An ongoing debate is the value and effort to create demo videos. Value is undisputed!
    First impressions last, and a fine-tuned video delivers a much stronger message
    than a hands-on demo "could fail for many reasons outside our control. A professional
    demonstration requires careful planning, practice, and a pinch of luck, all of
    which relate to a huge investment of time. Recording video and test runs is seamless,
    requires no additional effort, and delivers what can be easily edited into a 2-minute
    demo.

    Keep the demo (video) simple! Plan to create the demo as part of the sprint plan,
    not as an afterthought or last-minute alternative to a hands-on.


    # Retro: One innovation


    The intent of retrospective reflection is to learn from lessons and experiences
    during the sprints and to continuously improve and adapt our process to make projects
    more effective. Typically, a retrospective meeting gathers evidence from team
    members and quantitative evidence in terms of process metrics such as cadence
    and work planned, completed, and carried over in incomplete or failure.


    +   Agree on one innovation

    Every team should agree on one innovation that will improve its efficiency and
    productivity.


    In geographically distributed and part-time teams, scheduling a retrospective
    meeting can be a mammoth task and result in no constructive feedback, especially
    during "heads-down" sprints. An alternative is the Scrum Master to gather the
    quantitative evidence throughout the sprint and ask the team to agree on just
    one innovation to be considered as part of the next sprint.


    # Planning


    Planning the next sprint is part of completing the current sprint. For fine-tuned
    teams that have a groomed and well-defined backlog, this can be included as part
    of the last scrum meeting and completed in 15–30 minutes. Another way is to schedule
    a near-sprint meeting where the Product Owner reiterates the core objectives and
    features and where the team can brainstorm, refine, prioritize, and estimate backlog
    items. Also known as backlog


