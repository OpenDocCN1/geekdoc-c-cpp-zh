    # It all starts with the kickoff!


    It is important to sell the concepts of the project idea to all stakeholders,
    which in our case includes every development team member. In addition, it is important
    to identify anyone who could contribute or whose needs must be satisfied to ensure
    that the solution is successful and valuable.


    The kickoff meeting delivers overview, drives consensus, and allows the team to
    reach an agreement and plan the next steps in a very short time.


    The meeting typically lasts 30–60 minutes and is facilitated by the Program Manager
    and Project Lead.


    > **GEM Provide context ... but not too early!** It is valuable to enable attendees
    to prepare by sending them for the meeting a few hours beforehand. Typically,
    we share the kickoff slides in PDF format for preview and in the event that the
    teleconference infrastructure acts up during the meeting. Do not send out the
    information too early. Otherwise, you may influence the attendees and their prioritization
    accordingly.


    A structured meeting allows everyone to engage and address any technical, business,
    or political concerns. It also ensures that stakeholders are fully committed and,
    most importantly, that we align everyone''s understanding of the idea, and the
    solution.

    Here''s a sample kickoff agenda:


    +   - Why Motivation and beneficiaries

    - What Vision, milestones, team leadership, and features

    - Plan Deliverables, channels, and process

    - Team Skills and contact details


    We have used a consistent, formal kickoff template for teams that have recently
    started investigating A3 Problem Solving–Applying Lean Thinking (Finchaugh, 2014).
    We need to select a strategy that suits us. There is no one size fits all.


    # Planning the meeting


    We start by filling the template for the kickoff meeting agenda. Work with the
    Product Owner, Project Lead, Program Manager, and the Scrum Master to flesh out
    the details, include out-of-the-box thinking and ideas, and agree on a date and
    time to host the kickoff meeting.


    > **GEM Respect family time!** Avoid scheduling meetings on Friday or weekend
    time zones because you will encroach on Friday evening family time. Where possible,
    schedule a morning and an afternoon repeat meeting, allowing your team to pick
    the most convenient meeting for their time zone.


    When working with part-time volunteers, give at least a week advance. Be sure
    that the invitation intends highly professional to emphasize the importance of
    both the kickoff and the solution. We get only once to entice volunteers to join.
    The energy and passion levels of a team directly relate to the stakeholders''
    energy when hosting the event.


    Managing Agile Open-Source Software Projects with Microsoft Visual Studio Online


