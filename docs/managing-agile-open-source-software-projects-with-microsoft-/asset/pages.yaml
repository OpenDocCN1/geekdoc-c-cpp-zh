    # Why should we care about prioritization?


    The art of prioritization is not an easy one. Users want all of the features,
    and as we come in more than one plan with planning, the relative priorities of
    features become blurred and debated. The values of features are often difficult
    to quantify, especially for research, prototyping, debugging, and bleeding-edge
    technologies.


    The Agile Manifesto states that we should collaborate with the user, deliver working
    software, and react to change. This mandates that we cannot deliver everything,
    and the reality of time demands prioritizing features for yesterday.


    We respect the fixed Roadmap and Resources of the tradeoff discussed in Planning
    the kickoff, leaving us with the prioritization of features. The objective is
    to ship as many features as possible, increase the return on investment (ROI),
    and decrease the cost of delay.


    It is common with volunteer and part-time teams that family and jobs interfere
    with moonlight projects. It negatively affects the Resources side of the tradeoff,
    forcing us to reprioritize features continuously. It is more intuitive to prioritize
    small and high-value stories. Working with large, complex, and tightly coupled
    stories is a disaster waiting to happen, resulting in failure to deliver value,
    dissatisfaction, and a rapid decline of return (ROI).


