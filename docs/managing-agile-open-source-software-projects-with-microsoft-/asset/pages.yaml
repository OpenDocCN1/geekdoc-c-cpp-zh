    team⁴¹ |

    | SharePoint—the new way to work together⁴² |

    | Project Server—A flexible solution for project portfolio management (PPM) and
    everyday work⁴³ |


    # Portfolio “level”


    The stakeholders, consisting of community managers, group PMs, and group leader,
    triage the ideas and ensure that they align with the projects (flights) and features
    as well as business and technology strategies. At this level, we work with the
    bigger picture and strive for a continuous delivery of value. The Product Owner
    (PO) is the interface to the product group and represents the solution (flight).
    The operational Program Manager (PM) coordinates the collaboration with the PO,
    the community, other projects, and the Project Lead (PL) of the solution (flight).


    # Solution “flights” level


    At the solution (flight) level, the interface is the Project Lead (PL), who represents
    one or two teams within the solution team, operating within the defined roadmap.
    The Product Owner (PO) is responsible for outlining, prioritizing, and approving
    features and the overall solution. The Program Manager (PM) works with the Scrum
    Master (SM) to facilitate communication, mentor team members about the process,
    and help all parties identify and resolve impediments.


    # Team “feature” level


    Each of our teams consist of team members who pair up for development/contribution
    and testing/review responsibilities. Responsibility is only complete when the
    team completes development and testing activities and meets the definition of
    done (DoD). This does not encourage or reintroduce a waterfall sequence because
    the team can unit test and work on these in parallel to development efforts.


    | GEM | Transparency rules! |

    Transparency and visibility to requirements, plans, and status are required down
    to the team level. If you leave a solution team or feature in the dark for too
    long, you will typically return to an empty team room because your rock stars
    have moved on to other adventures.|


    # Team infrastructure


    During the early sprint(s), we focus on an infrastructure as well as three main
    pillars, as shown in Figure 34. The infrastructure and pillars are part of the
    overall nonfunctional requirements.


