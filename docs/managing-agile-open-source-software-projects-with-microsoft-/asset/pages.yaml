  md: '# Research... investigate and model requirements


    The second pillar of TRP includes research about the technology, concepts, functional,
    and nonfunctional requirements. We must invest in research and understand the
    requirements and reduce the unknowns in order to estimate and plan the subsequent
    sprints and the shippable solution.


    Before a scuba dive embarks on a search and recovery, the diver researches the
    equipment, situation, conditions, and proposed dive profile to reduce the risk
    and the search time and be in a position to plan and deliver a successful recovery
    (Figure 42).


    ![](img/eb2bb5eedd7e9f0a74372984f6317b95_54_0.png)


    Figure 42. A safe, enjoyable, and successful dive starts with research and planning.


    # Planning


    The third pillar of TRP reoccurs at the end, with a focus on planning and estimating
    the next sprint accurately and subsequent sprints as best possible.


    Martin Hinshelwood^49 introduces the Agility metrics (Hinshelwood, 2014) as follows:


    +   - We need to focus on value (Business Outcomes) to make sure that we are producing
    something that our customers value while not alienating our employees or spending
    too much money doing it.

    - We need to focus on lead time (Time to Market) to make sure that we can take
    those things of value that we are producing and quickly get them, in order, to
    the hands of our customers.

    - We focus on (Ability to Innovate) to make sure that what we deliver works, is
    easy to use, has useful features, and does not have a high maintenance cycle.


    Delivering value and focusing on quality are self-explanatory. If we want to invest
    a lot of money in a new vehicle, a new house, or a new service, we will only consider
    spending our hard-earned money if we perceive the investment as valuable and of
    quality.'
