  md: '# Chapter 3: Building the working solutions


    grooming, this planning forces team members to "sit on their hands," reflect on
    the past sprint, and discuss the upcoming stories and sprint.


    A well-groomed backlog enables transparency, estimations, and insight into what
    has and needs to be acted on. It is also far more efficient to work with a groomed
    backlog than have to sift through wasteful noise and distractions at every scrum,
    planning, or retrospective meeting.


    GEM Keep your groomed backlog clean!


    Consider your backlog as the main entrance of your project. Keeping it clean and
    groomed will ensure that first impressions are positive and visits collaborative
    and productive.


    # Groom future development sprints


    When we use the definition of grooming, we are presenting with the following options
    (The Free Dictionary, 2014):


    +   - To care for the appearance of; to make neat and trim: groom himself carefully
    in front of the mirror.

    - To clean and brush (an animal).

    - To remove dirt and particles from the skin, fur, or feathers of another).

    - To prepare for a specific purpose or position: groom an employee for advancement.


    When the Product Owner (PO), Project Lead (PL), and Program Manager (PM) get together
    under the guidance of the Scrum Master to define and refine the roadmap, release
    objectives, backlog, and the proposed sprint backlog, they perform the first grooming.
    The idea of investing time and effort in grooming the backlog is to produce a
    trim and clean backlog of requirements and understand what needs to be done in
    order and by. In addition, the grooming removes noise and clutter introduced by
    out-of-scope requirements and prepares the team for the task. We usually note
    that we have seamlessly applied the definition of grooming the backlog during
    the sprint(s) focused on training-research-planning.


    GEM Groom top down


    Ensure that the Product Owner and stakeholders prioritize all backlog items. Work
    through the backlog from the top (most important) to the bottom (least important)
    of the backlog items.


    During each development sprint, from start to finish, we monitor and groom both
    the ideas and the sprint backlog. The validity of the backlog items change with
    scope creep (bad), requirements changes (reality), and the implementation of features
    (good).


    "Responding to change over following plan" (Agile Manifesto, 2001) highlights
    the reality of requirements changing over time. Until we instantaneous solution
    development, we will have to face the reality of continuous change, which in requires
    continuous grooming.


    # Objectives/Goals


    What if the Product Owner decides to change the release objectives, acceptance
    criteria, the definition of done, or goals?


    Remember that these are pillars of the team—the definition of requirements and,
    more importantly, the definition of success. A change in any of these pillars
    requires the team to reflect and respond.'
