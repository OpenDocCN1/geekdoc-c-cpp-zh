    # Objectives


    There are many definitions for SMART^26 (Wikipedia, SMART Criteria, 2015) objectives.
    We use the Specific, Measurable, Achievable, Realistic, and Time-based version
    of SMART for defining the objectives for a release (for example, version 3 of
    the ALM Readiness Treasure Map). Table 4 describes these.


    | Property | Description |

    | --- | --- |

    | Specific | Objectives need to be precise and unambiguous. Every team member
    should be able to explain each objective. There should be no disagreements among
    team members.

    | Measurable | Objectives must be measurable and aligned with expectations and
    acceptance criteria. The team and Product Owner must be able to decide when they
    have achieved the objectives.

    | Achievable | Objectives must be achievable in terms of timeline and capabilities
    of the team.

    | Realistic | Objectives must be aligned with the vision and relevant to the overall
    idea. For example, it is unrealistic to expect the ALM Readiness Treasure Map
