  md: '# Ship value quickly!


    +   - Ship working solutions as soon as possible. Focus on the smallest stories
    first, and minimize the cost of delay!

    - Ship value to the user as soon as possible. Focus on stories that are of high
    value to the user, you!

    - Use common sense and solid prioritization methods to balance these two themes,
    which often clash.


    # Common prioritization methods


    Having the Product Owner prioritize the features and guide the team in terms of
    the story prioritization is a lightweight method that works well for small and
    part-time based teams, common with our projects.

    If we need a more accurate and unbiased prioritization, we use two common methods
    for planning and prioritization to consider:


    +   - The shortest job first (SJF) method (Wikipedia, 2014) is useful when the
    cost of delay is equal and recommends doing the smallest story first (Figure 46).


    | value | Scenario 1 | | Scenario 2 |

    |---|---|---|---|n| | A | C | |

    | | delay cost | B | A |

    | | 1 | 3 | 6 time | 5 | 6 time |


    Figure 46. Shortest job first.


    Scenario 1 shows the optimal sequence with least cost of delay. Scenario 2 has
    a higher cost of delay but a higher risk for the smaller tasks to lose their value
    over time. Most importantly, scenario 2 will make the user wait longer for shippable
    increments.


    +   - The weighted shortest job first (WSJF) method (Leffingwell, 2014b) is useful
    when stories have different costs of delay and required effort, which is common.
    It measures for User Value, Time Value, Risk Reduction/Opportunity Enablement
    and Job Size is defined by the following formula:

    WSJF = (User Value + Time Value + RROE Value) / Job Size

    where RROE value stands for Risk Reduction/Opportunity Enable and from 1 to 10.


    # Release planning: Offline preparations


    In an ideal world, we would schedule and do the release planning in colocated
    and face-to-face workshops and breakouts. But not the best way to ensure that
    all members are present and they are ready, that everyone knows exactly what the
    team expects, how to do it, and most importantly, everyone must know and agree
    with the "plan" for the solution release success.


    In a typical part-time, geographically distributed, and volunteer-based community,
    the dream of face-to-face communication is just a dream. Collaboration is typically
    limited to email, and teleferencing events, which requires effective and accurate
    communication to avoid inefficiencies.


    The circumstances will vary, the concepts covered here are based on extensive
    dogfood and our "worst case" projects, ranging from 1-2 members to 1-2 feature
    teams, with 5–10 members, as well as other stakeholders.'
