  md: '# # Appendix B: Eating your own dogfood is key


    Software is a great combination between artistry and engineering.

    —Bill Gates


    The concepts covered here are not silver bullets but rather a collection of proven
    technologies and techniques that we have used on our projects. We have cherry-picked
    and evolved a tailored framework based on our context but keep deep roots and
    a foundation based on Lean thinking and Agile values.


    Sharing our framework is not an attempt to trigger another process, such as Kanban
    (Toyota, 2014) version Agile (Agile Manifesto, 2001a) versus Lean (Lean Enterprise,
    2009) versus Scaled Agile Framework(SAFe) (Leffelling, 2014a). Instead, we want
    to share our learnings, allowing everyone to continuously inspect, discover possible
    improvements, and continuously adapt the way we work.


    Dogfood gives us access to the latest and greatest technologies, enables collaboration
    with the product group, and provides early feedback to the product team. Within
    this chapter, we will provide an overview of the various frameworks and methodologies
    we have leveraged in churning out projects over the past years.


    # ## Agility is key


    # ## ALM Rangers manifesto


    We provide professional guidance, practical experience, and gap-filling solutions
    to the ALM community. We expect every team member to virtually sign and commit
    to our manifesto:


    # ### Razor sharp focus on quality and detail on the work we do


    +   - Favor simplicity and low tech over complexity

    - Expect and adapt to change, delivering incremental value


    # ### Accountability and commitment


    +   - Actively manage the project triangle attributes: features, bandwidth, and
    cost

    - Never go dark... always share the good, the bad, and the ugly


    # ### Nonstop and unrestricted collaboration


    +   - Empower the ALM community

    - Enable open communications


    # ### Global transparency and visibility through collaboration and shared infrastructure


    +   - For all initiatives, track and publish status on a timely basis

    - Access to everything for everyone


    # ### Empathy, trust, humility, honesty, and openness at all times


    +   - No one knows everything; as a, we know more

    - Learn from and share all experiences'
