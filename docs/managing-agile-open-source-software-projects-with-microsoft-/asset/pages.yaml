  md: '# Chapter 3: Building the working solutions


    This guide will not debate these arguments. Instead, we will explore the challenges
    of sitting in a cockpit and flying plane with guiding a drone on the other side
    of the planet—or worse, a probe exploring the orbit of another planet. In an actual
    cockpit the pilot will sense the conditions and status of the flight by sight,
    hearing, and face-to-face collaboration. While the complexity of flying the plane
    is not to be taken lightly, the ability to visually experience and interpret the
    surrounding conditions in time appears more effective and is a preferred experience
    to the average person.


    In a disconnected scenario, the pilot relies on information transferred back from
    the remote device. The receipt and analysis of information and the reaction to
    it is less than optimal. The overall success depends on the accurate and timely
    sharing of information needed to make critical decisions. When a space probe enters
    the correct orbit, burns up in the atmosphere, or explodes in a fiery impact often
    depends on split-second decisions based on information with high latency.


    Similarly, the Project Lead, Product Owner, Program Manager, and Scrum Master
    all depend on transparency, accurate, and timely sharing of information and collaboration
    by the geographically distributed and part-time team members.


    Transparency, reflection, and continuous improvement are the core pillars. If
    we get accurate information on time, nothing remains hidden, and we have reliable
    team collaboration, we have the three fundamentals of Lean thinking. We will be
    in a good position to inspect, adapt, and improve, with an understanding that
    everyone is and will continue to make mistakes. The team rises or falls as one
    self-organized hive!


    Transparency also covers the common scenarios of black hole, rude awakenings,
    and perpetual scope creep. Nightmares we are aware of avoid:


    +   - Black hole Team members need to vanish off radar, the leadership and the
    rest of the team need information to reflect and innovate. If we have team members
    with the "black hole" syndrome, we transition them to other projects as quickly
    as possible.

    - Rude awakening The team iterates with transparency and enjoys a false sense
    of security. As the team approaches the end of the sprint, it becomes apparent
    that there will be no demo or working software, but a sudden spike of issues and
    impediments.

    - Perpetual scope creep The team continuously reacts to scope creep. The result
    is usually a need to renegotiate scope, quality, and expectations and also reset
    a sprint or even the release.


    We work with their Scrum Master when we encounter scenarios of these nightmares.
    With patient mentorship, even view new to the distributed, part-time, and virtual
    collaboration environment will adapt.

    Best. With which of these team environments would feel most comfortable? The one
    you described or the one with positive that we know and should encourage:


    +   - Self-organization allows the team to get their work done, deliver value,
    and do so iteratively.

    - Trust allows the leadership to let teams go about their business with the knowledge
    that they will deliver business value regularly and raise all issues and impediments
    when they arise.

    - Transparency ensures visibility of the good, the bad, and the ugly. While everyone
    loves sailing trips, storms and unexpected challenges will emerge. With transparency,
    we are not alone when we need to ask for help. In fact, if we have a transparent
    team, we will be asked when we need help before we have an opportunity to ask.

    - Simplistic mindset keep it simple! Ship something as soon and as often as possible.
    Through iterative feedback and rapid adaptation, we can always do better tomorrow.'
