- pgno: 106
  md: '# Author’s Note


    # Software Stack


    Building software is not unlike building a skyscraper, or a pyramid.


    There are things that go near the ground, and there are things that go near the
    top. Viewing software as a vertical stack of blocks is a very useful metaphor.
    Sometimes we look at things from top to bottom, and sometime we look at things
    from bottom to top.


    In *C#, the building blocks are “custom types” and “static methods”.


    When you use a class property or method or a static method from the (dn) standard
    library, for example, you are putting your block on top of the standard library
    blocks.


    The closer to the ground, the building blocks do smaller but more generic tasks.
    The blocks in the higher up do broader but more specific tasks.


    At the top of the pyramid is the Main() method of the main class, or interface,
    of your program. The “main” class in a *C#* program is no different from any other
    types in *C#*.


    In *C#, all types and static methods in a program are all compiled together as
    if they are all from one giant source code file. There are no strict linear, or
    directional, dependencies within a program. Any entity can depend on, or use,
    any other entity in the same program.


    In that sense, the true building block in a *C#* program is an “assembly”, and
    not its components like types and static methods. We are building an executable
    assembly, for instance, on top of other library assemblies.


    But, regardless, it is a good practice to view each component in an assembly as
    a small block. And, to think about the “dependencies” between these small'
