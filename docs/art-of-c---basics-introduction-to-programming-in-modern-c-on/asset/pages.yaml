    \ Most digital watches use LCD screens, and again those using LED-style digital\
    \ displays are relatively hard to find.\n\nLet's suppose that we need to program\
    \ a digital clock, which consists of four digits, and each digit consists of 7\
    \ LEDs.\n\nSomething like this, using the vertical bar and underscore characters\
    \ as the \"light emitting diodes\":\n\n```\n```\n  _\n| _|\n|  _|\n```\n```\n\n\
    Here's a representation of all ten digits.\n\n```\n```\n  _     _     _   _  \
    \   _     _     _     _\n| |   | _    _| | _| | _|     _|   | _|   |_\n|_|   |_\
    \    _|    | |_| |_| | |_|  | _|   |  |\n```\n```\n\nWe are showing only the LEDs\
    \ that are \"turned on\", in this notation.\n\nThe problem of this lesson is to\
    \ create a program that \"controls\" the digital clock display. Given a time,\
    \ we need to turn on and off particular LEDs to indicate the time on the display.\n\
    \nTo be concrete, we have 28 LEDs (4 times 7), and the goal is to control these\
    \ 28 LEDs to display a particular time."
