  md: '# **5.2.2. Grammar**


    A computer is a machine that "computes". At the most fundamental level, computers
    deal with numbers. Binary numbers. Everything that the computer stores and processes
    is 0s and 1s.


    So, what does, for example, `00110011` mean?


    Suppose that we have a series of 0’s and 1’s in a particular location in memory,
    for instance. What do these numbers mean?


    This is where the "types" come in. Based on the type of the value at a certain
    memory location, we can interpret what those numbers mean.


    If a byte in memory has a value `01000001` and if its type is *byte*, then it
    is A (or, a number 65). If the byte is a part of a 32 bit integer type value,
    then it could mean a very different thing. If this byte is a part of a value of
    a string type, then it could mean A or something completely different (based on
    the byte alignment, etc.).


    "Types" are of the fundamental importance in programming, especially for the "statically
    typed languages" like C#.


    We deal with a number of different "builtin types", or "primitive types" in this
    sample code.


    +   * String type: Lines 3~4

    * Integer types: Lines 6~10, 23~26, 32~37

    * Floating point number types: Lines 12~21

    * Boolean type: Lines 28~30


    > C# has a "unified type system". Every type inherits from the base `object` type
    (which corresponds to `System.Object` in .NET). This is true for both value types
    and reference types. This is true for both builtin types and user-defined types.'
