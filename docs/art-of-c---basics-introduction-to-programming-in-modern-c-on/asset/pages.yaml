    ```


    Even though r2 and r3 have the same value (or, they include the same data), the
    equality test returns *false*. It is not the value-equality semantics.


    As indicated, this is not necessarily a problem. In many cases, it matters little.
    For "data" types, however, the value equality semantics is desirable.


    C# now has a special kind of *class* that is a reference type, but supports the
    value equality semantics out of the box. We will look at a *record* type, *RcNumeral*,
    next.


    In the *Main()* method of *RcNumeral*, we try the same things.


    This time, we create three objects, r1, r2, and r3, using the constructor and
