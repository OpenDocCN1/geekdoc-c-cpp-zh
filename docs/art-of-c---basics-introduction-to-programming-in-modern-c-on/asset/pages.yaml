- pgno: 334
  md: '# 20.3. Pair Programming - Interfaces, Polymorphism, Custom Tuple Deconstruction


    The `SPoint` type additionally implements the `IComparable<SPoint>` interface
    as well as the `IEquatable<SPoint>` interface (again using the `:` syntax), which
    includes one method `bool Equals(SPoint? other)`.


    Any (value-semantics) type, or "data" type, that can be used in a context where
    equality comparisons may be required should implement `IEquatable<T>`. For example,
    objects of a type that does not support `IEquatable<T>` cannot be used as entries
    in the .NET generic collections such as `List<T>` or `Dictionary<K, V>`.


    The type `RPoint` also implements `IPoint` as well as `IComparable<RPoint>`.


    One of the nicest things about using `record` is that the compiler automatically
    generates a number of methods for us. In particular, a `record` type automatically
    provides implementations for `IEquatable<T>`, or `IEquatable<RPoint>` in this
    example.


    It also syntheses a universal `ToString()` method based on the public properties
    of the record. One can always override it if necessary/desired. For instance,


    ```

    public override string ToString() => $"({X},{Y})";

    ```


    It also automatically includes the `Deconstruct()` method if we define a record
    type using the positional record syntax, as we do in this example:


    ```

    record RPoint(float X, float Y);

    ```


    As stated, a default implementation of `Deconstruct()` could have been provided
    in the definition of the `IPoint` interface, in our particular sample code.


    Note that we do not declare this record `sealed` in this example. Unlike `struct`,
    records can be inherited. For instance, we can easily define a 3-D point type
    from this `RPoint` type, e.g., just by adding an additional property `float Z`,
    and overriding some implementations, etc.'
