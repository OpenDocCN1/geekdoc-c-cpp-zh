    basic concepts of generics.


    This is similar to the use of *delegates*. You may not have a need to define your
    own delegates "until later", but you will still need to understand what they are
    and how to use them. Note that we introduced the delegates rather early in this
    book.


    The main program calls the generic `TryFindMax()` method with an "integer list"
    (`List<int>`).


    .NET defines a number of "collection types". It supports a *list*, which is a
    dynamically sized list data structure, and a *dictionary*, which is a key value
    mapping data structure, among other types.


    One thing to note is that there are two different kinds for each collection type
    and their related types such as interfaces, etc.


    One kind is a "non-generic" kind. It stores any object, value or reference, as
    a base type `object`. Since all types in C# inherits from `object` (`System.Object`
    in .NET), we can store any objects in a non-generic collection instance. These
    are there primarily for historical reasons, however.


    If you use non-generic collections (e.g., from the `System.Collections` namespace),
    you may end up losing most, if not all, of the benefits of using the strongly
    typed languages like C#. We will not use any non-generic collections in this book.


    The other kind is *generic* collections. The generic collection types can support
    a broad range of specific types as their elements, like `int` or `string`, not
    just the'
