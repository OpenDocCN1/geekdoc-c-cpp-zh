- pgno: 455
  md: '![](img/25af69ec45b3c0b589a8dccd0c2a88be_455_0.png)


    # 28.2. Discussion


    A Rubik’s cube is a “real” object. An object in the real world. It has a state
    (e.g., what tiles have what colors). It has some allowed operations, like a rotation
    of a face.


    This is an ideal (real-world) object to represent as an “object” (in the sense
    of object oriented programming). The Rubik’s cube has a state (e.g., the colors
    of the 54 tiles, as stated). And, the only way to change its state is through
    a well-defined set of interfaces (e.g., rotations of the faces by 90 degrees clockwise
    or counterclockwise, as stated).


    All objects of OOP have states and interfaces. The challenge, for us developers,
    is to find a “good” representation of a real world object in a program. (The “good”
    may mean different things depending on the requirements.)


    The readers are encouraged to think about this problem before reading the sample
    code. First of all, what are we trying to do? Then, what would be the best way
    (or, a “good enough” way) to achieve our goal? Is the OOP going to help? If so,
    how? And so forth.'
