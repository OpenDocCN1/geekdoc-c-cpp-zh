  md: '# Lesson 13. Sort Numbers


    # 13.1. Agenda - Generic Methods, Type Constraints, IEquatable, IComparable, dynamic
    Casting


    Sorting is one of the most common operations in programming. There are a lot of
    different algorithms that can sort, for example, a list of numbers in an ascending
    order (e.g., the smaller numbers first and the bigger numbers last).


    Most programming language libraries/runtimes come with an extensive set of sorting-related
    library functions and methods. .NET is no exception. In many cases, you will not
    reinvent the wheel, and end up just using the .NET-provided (generic) types and
    methods for sorting and its related tasks.


    In this lesson, we will try to "reinvent the wheel", just for fun. ☺ And, we will
    add a small twist to the good old sorting problem. More specifically, We will
    try to sort a list of integers based on its "distance" from a particular number,
    which we call the "pivot".


    For example, given a list `{9, 3, 19, 1}` and a pivot `4`, the list can be sorted
    as `{3, 1, 9, 19}`, in the ascending order of the distance, since the distance
    between `3` and `4` is the smallest, and then between `1` and `4`, and so forth.


    This is relatively simple to do for a list of `ints` or any other particular numeric
    types. In this lesson, however, we will try to implement the sorting method *generically*,
    in particular, across *all* numeric types, not just `ints`.'
