- pgno: 330
  md: '# ## 20.3. Pair Programming - Interfaces, Polymorphism, Custom Tuple Deconstruction


    An interface is a reference type. The C# keyword `interface` is used to define
    a reference type.


    Unlike the types defined by `struct` and `class`, an `interface` type is always
    an "abstract type". It defines a set of "behaviors", and it can provide some default
    implementations, but the objects of an interface type cannot be directly instantiated.
    Interfaces do not include "states" or "data". They only prescribe "behaviors".


    Interfaces provide "polymorphic behavior" to other types. Types defined with `class`/`record`
    and `struct`/`record struct` can inherit behaviors from interfaces, e.g., by "implementing
    the interfaces".


    C# also provides another way to define a type which is primarily behavior, namely
    `abstract class`. An abstract class defines a type that cannot be directly instantiated
    like `interface`. But, it can still include states unlike the `interface`. We
    will see example uses of abstract `class` in later lessons.


    The `IPoint` public interface of the sample program defines a set of behaviors,
    i.e., properties and methods, that encapsulate the abstract concept of the "point"
    in the 2-D space.


    That is, a point comprises two numbers (e.g., `float` in this example) and they
    are publicly accessible (e.g., through properties named `X` and `Y`).


    ```

    ```

    float X { get; }

    float Y { get; }

    ```

    ```


    Given a point, one can obtain a certain number called the "radius" of the point.'
