    `ToUpper()` from the *name* object.


    Note the syntax. The method `ToUpper()` is called on *name* using the "dot notation".
    The method `ToUpper()` is defined in the `System.String` class, but it is used
    on an "instance" of the `String` class, namely, *name* in this example. Methods
    like this are called "instance methods" as just stated.


    ![](\image/placeholder.png) We will discuss the difference between the static
