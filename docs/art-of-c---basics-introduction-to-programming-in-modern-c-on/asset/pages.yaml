    \ place it was rethrown. A common use of exception filter expressions is logging.\
    \ You can create a filter that always returns false that also outputs to a log,\
    \ you can log exceptions as they go by without having to handle them and rethrow.\n\
    \nA throw statement can be used in a catch block to re-throw the exception that\
    \ is caught by the catch statement. The following example extracts source information\
    \ from an System.IO.IOException exception, and then throws the exception to the\
    \ parent method.\n\n```\ncatch (FileNotFoundException e)\n{\n        // FileNotFoundExceptions\
    \ are handled here.\n}\ncatch (IOException e)\n{\n        // Extract some information\
    \ from this exception, and then\n        // throw it to the parent method.\n \
    \       if (e.Source != null)\n                Console.WriteLine(\"IOException\
    \ source: {0}\", e.Source);\n        throw;\n}\n```\n\nYou can catch one exception\
    \ and throw a different exception. When you do this, specify the exception that\
