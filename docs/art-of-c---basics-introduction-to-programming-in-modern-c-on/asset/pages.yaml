  md: 'It is worth mentioning that generics supports the type-based "polymorphism".
    Although we do not commonly use the term polymorphism in this context (in the
    OOP), it is indeed a polymorphism (which literally means that a thing can have
    multiple forms). It is often called the "parameterized polymorphism".


    Generics is really a concept borrowed from the functional programming. In the
    pure functional languages like Haskell with static typing, for instance, the "types"
    are the most essential components of the language (along with the "functions").


    Although generics has been used for a long time in the imperative programming
    languages (like C++), the modern C# uses a lot of functional programming features,
    besides generics, as alluded in the prelude of this book. In fact, most, if not
    all, of the modern features in C# described in this book have some functional
    flavors (although we will not always mention them explicitly).


    The method TryFindMaxInt(), as well as its generic counter part TryFindMax<T>(),
    uses the "TryXXX method convention", as we discussed in the earlier lessons.


    Instead of throwing an exception, the "Try" method returns a false Boolean value
    when it runs into an unusual situation. When it runs successfully, it return a
    true value, and the result of the operation is returned as an out parameter, max
    in this example.


    When an empty list is passed, there is no "max" value, and hence we return false.
    Note that, even in this case, the out parameter has to be set (unlike in the case
    of throwing an exception).


    In this example, we just set it to the "default" int value, which is 0. In the
    case of the generic version, we use the default operator to set the default value
    of a generic type T. Different concrete types can have different default values.'
