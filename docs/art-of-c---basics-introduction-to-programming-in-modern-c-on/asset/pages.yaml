  md: 'Again, namespaces do not play any role in this regards. The namespace names
    are simply part of the names that we are exporting. That is, the full name of
    LeapYear1 is Example.LeapYear1.


    For the nested types (e.g., the types that are defined in another type), and for
    the members of a type (e.g., properties and methods), e.g., the LeapYear1() static
    method, the access control in C# is much more complicated. In fact, C# has several
    different access modifiers with different behaviors.


    In this lesson, we used the internal access modifier for all three static methods,
    LeapYear1.IsleapYear(), LeapYear2.IsleapYear(), and LeapYear3.IsleapYear(). Internal
    methods can be accessed by anybody within the same program (or, assembly).


    If we want to share IsleapYear(), then we would need to declare it as public as
    well, not just the IsleapYear class.


    The default access level for the member methods, as in this case, is private.
    The private members can be accessed only within the definition/implementation
    of that type. If we omitted internal in the declarations of the three static methods,
    IsleapYear(), then they would not have been accessible from our "main program".


    # ## Summary


    A delegate in C# is a type, and it is used to represent a group of methods, (static
    methods or instance methods), that have the same certain function signature.


    The delegate instances can be used just like any other objects, and they can be
    "called" as if they are methods.


    Various access modifiers like public and internal can be used to control the access
    levels for your types and their members.'
