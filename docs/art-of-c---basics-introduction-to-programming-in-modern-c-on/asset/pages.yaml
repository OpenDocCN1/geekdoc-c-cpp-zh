  md: '# Part I: First Steps


    The beginning is the most important part of the work. -Plato


    The C# programs run on the .NET runtime, among others. A "runtime" can include
    both the build time and run time support, including the "standard libraries".
    We will mostly use the .NET runtime version 6 in this book.


    We will use the C# version 10.0, which are the default C# language version on
