- pgno: 306
  md: "We stopped the program using \"Control-C\" in this example.\n\nA (fake) Apple\
    \ Stock record is created using the new operator syntax, new(Prices.AAPL, 0.0m).\n\
    \nInside the foreach loop, we call the Ticker.Get(symbol) static method to get\
    \ the current Stock record for the given symbol. We store them in a cache dictionary\
    \ stocks, and print it out on console.\n\nNote the if statement. This is done\
    \ only if the current Stock record is different from the previously cached value\
    \ for the given symbol.\n\n```\nif (stock != stocks[symbol]) {\n  // ...\n}\n\
    ```\n\nAlthough we have not explicitly defined the inequality operator (!=), we\
    \ can use it for the Stock objects. This is because the compiler automatically\
    \ generates equality and inequality operators for the record types (record classes\
    \ and record structs). In fact, the compiler automatically synthesizes a number\
    \ of methods for record types. Refer to the official C# reference for more information.\n\
    \nThese synthesized method implementations ensure that the record class objects\
    \ follow value equality semantics (even though they are intrinsically reference\
    \ variables).\n\nThat is to say, in this particular example, the expression stock\
    \ != stocks[symbol] will evaluate to false if the values of each of the properties\
    \ of the Stock record type are all the same for the stock and stocks[symbol] variables.\n\
    \nThis compiler help can greatly simplify the task of creating value or value-like\
    \ types, or, \"data types\"."
