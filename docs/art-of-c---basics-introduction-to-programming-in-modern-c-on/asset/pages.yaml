    # # Book Organization


    The lessons in this book are organized into four parts: First Steps, Moving Forward,
    Having Fun, and Final Projects.


    This division is somewhat arbitrary, but the first part, Part I: First Steps,
    mostly focuses on general programming. If you are coming from a different programming
    language background, especially languages like C++ or Java, then you will feel
    comfortable with the lessons in this part. One thing to note is that we introduce
    "generics" rather early in the book, unlike many "introductory" beginner''s books.
    Generics is an essential part of the modern C# programming language.


    The second part, Part II: Moving Forward, mainly focuses on the object oriented
    style programming in C#. In some object oriented programming (OOP) languages,
    there is only one or two constructs, such as class or struct, to create a custom
    type. In C#, there are several. In particular, C# has class, struct, record, and
    interface, among others.


    In Part II, we discuss the fundamental concepts of object oriented programming,
    and the C#s support for the OOP. In addition, this part introduces some features
    in C# that support the functional programming style. We will also go over some
    basic examples of Web programming in C# as well in this part.


    In Part III: Having Fun, we will cover a few independent topics, mostly to help
    the readers internalize the important programming concepts in C#, like object-oriented
    and functional programming styles.


    Finally, in Part IV: Final Projects, we will work on a few hands-on projects.
    We will design and implement a program to solve Rubik''s Cube, among other things.
    The readers are encouraged to tackle all the projects in this part. They are excellent
    projects for beginning programmers as well as more experienced developers.'
