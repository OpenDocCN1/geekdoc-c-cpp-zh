  md: 'The book covers a lot of topics. But it is not meant to be a language reference
    of the C# programming language. This is not an academic textbook. In fact, there
    are many topics that we leave out for the sake of brevity.


    The Art of C# - Basics covers the following topics, among other things:


    +   - The basic structure of a C# program.

    - Top level statements.

    - Command line interface. Basic input/output processing.

    - Basic constructs of the C# language such as expressions and statements.

    - Primitive types, strings, arrays, and tuples.

    - Custom types, in particular, enums, structs, classes, and records.

    - Value types vs reference types.

    - Interfaces. Delegates.

    - Collections. Enumerators. LINQ. Lambda expressions.

    - Error handling.

    - Object oriented programming. Inheritance. Polymorphism.

    - Generics. Type variance. Type constraints.

    - Pattern matching. Switch expressions.

    - Async programming.

    - File-scoped namespace.

    - Global using. Implicit using.


    # ## Basic Concepts of C# Programming


    Programs written in different programming languages are processed and run differently.
    For example, a program in C is compiled into a machine-readable binary, specific
    to a given machine architecture. Java programs are compiled first'
