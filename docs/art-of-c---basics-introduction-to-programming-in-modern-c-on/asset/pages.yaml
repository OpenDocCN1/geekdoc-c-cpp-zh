- pgno: 239
  md: '> The wildcard catch-all pattern should be the last one. Why?


    The result of a switch expression is the value of the expression of the first
    switch expression arm whose pattern matches the input expression and whose case
    guard, if present, evaluates to true. The switch expression arms are evaluated
    in the order specified, from beginning to end.


    Even though you may not know the exact syntax of the switch expression, you can
    still intuitively see what is happening in this switch expression.


    A "case guard" is an additional condition that must be satisfied together with
    a matched pattern. You specify a case guard after the when keyword that follows
    a pattern. Although we do not use the case guards in any of the example code in
    this book, they can be very useful in differentiating similar patterns based on
    different conditions. Refer to the C# language reference for more information.


    Note that the entire definition of the method, `Game.DeterminePrize()`, is included
    in a single expression. (As mentioned, the `return` statement is implied in the
    expression body.) If you are coming from the more traditional (C-style) programming
    style, then it may require some getting-used-to.


    It is a matter of preference, but as stated, this is the future of C#. The modern
    C# prefers using expressions over statements, and the more compact over the more
    verbose.


    As for the strange-looking method call `whites.Count(numbers.Contains)`, `T[].Count()`
    is a LINQ method.


    It is an extension method defined in the System.Linq namespace, and its function
    signature is something like this: `int Count<T> (this IEnumerable<T> source, Func<T,
    bool> predicate)`. Note that we can use this method with `whites` because the
    type `ushort[]` is a subtype of `IEnumerable<ushort>`.


    In this example, the `whites.Count()` method is called with the argument, `numbers.Contains`
    (without the parentheses), as a delegate of type `Func<T,bool>`.'
