    Although there is no explicit declaration, the record is implemented with a positional
    record syntax and it keeps no other internal data. It has no other data accessors
    or methods. (The properties, Title and Singer, are readonly by construction.)
    Hence, Song is truly immutable for all intents and purposes.


    Clearly, the simplest immutable record type is the one declared with no body.
    For instance,


