  md: "```\n```csharp\nclass Program {\n    static void Main() {\n        Console.WriteLine(\"\
    Hello World!!!\");\n    }\n}\n```\n```\n\nNote that a method call (e.g., `WriteLine(\"\
    ...\")`) is an expression, which can also be used as a statement. In this alternative,\
    \ and more traditional, example, `Console.WriteLine(\"Hello World!!!\");` is a\
    \ statement. Note the semicolon at the end.\n\nIn the expression-bodied method,\
    \ on the other hand, `Console.WriteLine(\"Hello World!!!\")` is an expression.\
    \ The semicolon in this case belongs to the entire statement, `static void Main()\
    \ => Console.WriteLine(\"Hello World!!!\");`.\n\nC# now supports a number of different\
    \ \"expression body\" syntax. The right hand side of the fat arrow operator is\
    \ an expression in all these cases. If the only statement in a method happens\
    \ to be a return statement, then the return value (an expression) can be used\
    \ in the expression body without the `return` keyword.\n\nUsing this new syntax\
    \ is generally preferred (when applicable) because they tend to reduce the code\
    \ clutter and they typically make the code easier to read (although it may require\
    \ some getting-used-to for some people).\n\n# ## Summary\n\nIn this lesson, we\
    \ learned the simplest way to write an output to the console, namely, using `Console.WriteLine()`\
    \ methods.\n\nWe also learned the main C# program structure, either using the\
    \ \"top-level statements\" or using the more traditional `Main()` static method.\
    \ The top-level statements are merely a syntactic sugar for the implicitly defined\
    \ `Main()` method in an implicitly defined class."
