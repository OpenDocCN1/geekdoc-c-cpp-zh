    Methods


    The *record*, or *record class*, provides a new way to create a reference type
    in C#. In fact, when a type is created using the *record* (class) declaration,
    the compiler creates a reference type using class behind the scene.


    The compiler also generates a few synthesized methods to make a record type follow
    value equality semantics.


    Records are typically used for "data" types in the same way that readonly structs
    are used. Structs are generally useful for "small" value types because copying
    large values can be expensive.


    On the other hand, records are reference types. They follow mostly reference semantics,
    but the data (the references point to) need not be copied making their use more
    efficient for "large" data types.


    Records follow value equality semantics. In many situations, they behave more
    like values than references.


    Like structs, records are primarily used to create immutable types. As of C# 10.0,
    one can also create a record struct, which is a value type (struct) and which
    is syntactically similar to record class. The compiler generates the same set
    of methods for the record structs as well.


    A record type can be created as follows:'
