  md: '# 18.3. Pair Programming - Primary Constructors, switch Expressions, async
    Methods


    In cases when a record type does not include any other methods or other properties,
    the whole block can be omitted.


    ```

    record Stock(/* ... */);

    ```


    A record defined in this syntax is called the "positional record". Note the semicolon
    at the end of the statement instead of the usual curly brace block.


    In the sample code, `Stock` could have been declared as follows if it included
    no other properties or methods.


    ```

    record Stock(string Symbol, decimal Price, decimal PreviousPrice = 0M);

    ```


    Note the syntax. The readonly properties is listed in a pair of parentheses as
    if they are constructor arguments. One can set the initial/default values of the
    properties using a similar syntax as the optional arguments for the constructors.


    The positional record syntax does define a constructor for the type. It is called
    the "primary constructor" of the record. Additional constructors can be defined.


    Records can be created using the object initializer syntax as well just like `struct`
    and `class`.


    The `Stock` record class defines four properties, `Symbol`, `Price`, `PreviousPrice`,
    and `Trend`.


    Three of them are declared using the positional, or constructor, syntax. The `Trend`
    readonly property is defined using the more traditional `get` property syntax:'
