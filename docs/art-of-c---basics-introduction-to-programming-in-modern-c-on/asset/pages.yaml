    This prints out `Hello at least once!` to the console, once, even if the while
    Boolean expression is always `false`. Notice the trailing semicolon at the end
    of the `do` statement. (There is, however, no semicolon after the `while` block.)


    The `while` statement in the sample code is an "infinite loop". The Boolean expression
    is always `true`. In order to exit out of a loop (infinite or not), before its
    normal completion, we use the C# keyword `break`.


    Note that the loops can be nested (e.g., a `foreach` loop inside a `while` loop,
    etc.) and the `break` statement only breaks out of the innermost loop, or the
    `switch` statement, that encloses the statement.


    Inside the `while` loop in the sample code, we have an `if-else` statement. If
    the user input is in a valid date format, then we perform our main task. Otherwise,
    we ask the user if he/she wants to try again.


    The `else` block uses a `switch` statement. `switch` is a selection statement
    that chooses a single `switch` section, or a `case`, to execute from a list of
    candidates based on a pattern match with the match expression. The `switch` statement
    is often used as an alternative to an `if-else` construct if a single expression
    is tested against two or more conditions. In this particular example, we could
    have simply used an `if-else` statement.


    The match expression (in the parentheses) can be any valid expression, in the
    "modern C#", which evaluates to a (compile-time) value of `any type`.


    In the sample code, the type of `firstLetter` is a `string`. And its value is
    compared with "Y". If it is `true`, then it "continues", by going back to the
    beginning of the `while` loop. If not, then the `default` case is executed. It
    merely `returns` in this case, thereby effectively terminating the program.'
