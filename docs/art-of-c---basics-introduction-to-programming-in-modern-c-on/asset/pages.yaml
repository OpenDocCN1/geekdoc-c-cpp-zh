  md: '# 22.3. Pair Programming - OOP, Inheritance, Polymorphism, Nullable Reference
    Types, ForEach


    A class in C# can inherit from another class. Likewise, a `record` type can inherit
    from another `record` type.


    Every concrete type inherits from `object`, ultimately. And, no concrete type
    can inherit from more than one concrete type in C#.


    Hence, a user-defined type can have a linear inheritance hierarchy that eventually
    reaches the top, `object`. (Or, the root, depending on the how you look at it.)


    In this example, an `Employee` record, which implicitly inherits from `object`,
    is declared as an `abstract record`. An `Employee` object cannot be directly instantiated.
    It only defines a "type", like an interface.


    Instead, two other concrete types, `Manager` and `Worker`, inherit from this abstract
    record, which can be instantiated.


    The colon (:) syntax, e.g., `record Manager(string Name) : Employee(Name)`, indicates
    that the record being declared, e.g., `Manager`, is a subtype of the record on
    the right-hand side, e.g., `Employee` in this case.


    Note the syntax. `Manager` uses the positional record syntax, and more or less
    the same constructor syntax is used for its base class (or, base record) declaration.


    Note that the abstract record type `Employee` includes a read-only property, `Name`,
    through the positional syntax, and in addition, it includes another `abstract
    readonly` property, `Salary`.


    Abstract properties and methods, which do not include definitions, can only be
    declared in abstract classes and records.


    Abstract properties and methods can be "overridden" in its sub-classes and records'
