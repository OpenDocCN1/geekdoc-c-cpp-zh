  md: '# catch


    The try-catch statement consists of a try block followed by one or more catch
    clauses, which specify handlers for different exceptions.


    # checked


    The checked keyword is used to control the overflow-checking context for integral-type
    arithmetic operations and conversions.


    # class


    The keyword class is used to define a reference type.


    # const


    The const keyword is used to declare a compile-time constant.


    # continue


    The continue statement passes control to the next iteration of the enclosing iteration
    statement in which it appears.


    # default


    The default keyword can be used as the default label in the switch statement or
    as the default operator to produce the default value of a type.


    # delegate


    A delegate declaration defines a reference type that can be used to encapsulate
    a method with a specific signature.


    # do


    The do statement executes a statement or a block of statements repeatedly until
    a specified expression evaluates to false.


    # dynamic


    An object of type dynamic bypasses static type checking. In most cases, it functions
    like it has type object.'
