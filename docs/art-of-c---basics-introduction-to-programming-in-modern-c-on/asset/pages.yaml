  md: "Earlier in the book, we mentioned the importance of implementing `System.IEnumerable<>`\
    \ when the type is to be used in `foreach` as a collection. In fact, its explicit\
    \ declaration is not needed. As long as the type provides an implementation of\
    \ `IEnumerator<T> GetEnumerator()` method, it can be used in the `foreach` statement.\
    \ (Note that this feature is new as of C# 9.0.)\n\nThis comes in handy when we\
    \ need to use a variable of a collection type that is not under our control. In\
    \ that case, we can add an extension method to the type that has the same signature\
    \ as `IEnumerator<T> System.IEnumerable<T>.GetEnumerator()`.\n\nWe will leave\
    \ it to the readers to go through the implementation of `Buffer`. It is a good\
    \ exercise.\n\nBut one thing to note is that the access of the `ring` field of\
    \ `Buffer` is not synchronized. `ring` is of a type `T[]`, an array of elements\
    \ of type T. An array is a reference type. The use of `Buffer` is in general not\
    \ thread safe regardless of the element type T. As indicated, however, not every\
    \ type has to be thread-safe. It is the overall program that matters.\n\nHere's\
