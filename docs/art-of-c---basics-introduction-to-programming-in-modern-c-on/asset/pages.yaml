- pgno: 15
  md: '# ## Introduction


    Most good programmers do programming not because they expect to get paid or get
    adulation by the public, but because it is fun to program.


    > - Craig Rumar


    C# is a rather complex language. There is no other way to put it. C# includes
    a lot of "features". Once you master the basics, however, it will be one of *the
    easiest languages to use*. It will make you more productive like no other languages.
    You can achieve the same things with less code in less time in many cases.


    # ## Are You a Beginner?


    If you are new to programming, and thinking about learning C#, then welcome! It
    will be a hack of a fun ride.


    ***The Art of C# - Basics: Introduction to Programming in Modern C#*** starts
    from the basics and progresses to more advanced topics. Although it is written
    to be a beginner''s book, the caveat is that if you haven''t had any experience
    in programming then you can expect some bumpy ride. The book tries to explain
    (most) everything from scratch (as far as the basic programming goes), but it
    will take some effort and commitment on your part to get benefits from this book.


    The book does not tell you how to install Visual Studio, for example, or how to
    create new Visual Studio projects or solutions. It does not teach you what keyboard
    shortcuts to use for certain tasks.


    The main focus of this book is to teach you the fundamentals of programming. *Real*
    programming in C#. As with any other skills, the foundation is the most important
    thing. This book will teach you the best practices in C# programming.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Are You an Experienced Developer New to C#?


    If you are a seasoned programmer with experiences in other programming languages,
    and want to try out C#, then welcome! You picked the right book as your first
    guide to the wonderful world of C#.


    The Art of C# - Basics covers the essential elements of the C# language. Regardless
    of your background, the book will provide a gentle introduction to the "idiomatic"
    style of programming in Modern C#.


    If you learn any unique features of C# that you haven''t seen in other programming
    languages, after reading this book, and you are intrigued enough to decide to
    learn more of C#, then the book will have served its purpose.


    # Have You Used C# Before?


    Last but not least, if you have used C# before, and if you are now interested
    in using it again, then welcome back! The modern C# is not your grandfather''s
    C# as the saying goes. C# has been around for over two decades now, and it has
    gone through many small and big changes. The current major version is C# 10.0,
    as of this writing.


    The Art of C# - Basics provides the most up-to-date introduction to the C# programming
    language. This book will primarily focus on the current C# as is, mostly ignoring
    the historical baggages, if you will. This book will present C#, as one programming
    language, not as a patchwork of the C# 1.0 features and the C# 2.0 features ...
    and the C# 10.0 features.'
