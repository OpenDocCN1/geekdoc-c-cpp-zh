- pgno: 353
  md: '# 22.1. Introduction


    In this lesson, we will briefly touch on a number of features in C# that support
    the inheritance-based polymorphism. We already discussed its closely related cousin,
    the interface-based polymorphism in the earlier lessons. Broadly speaking, the
    term inheritance-based polymorphism includes both class-based and interface-based
    polymorphisms.


    Note that the inheritance-based polymorphism, in the narrow sense, is really "overrated".
    In practice, the interfaces are much more versatile. Implementation reuse can
    be also done via "composition" without using inheritance.


    In the modern C#, regardless of whether it is a good thing or not, even an interface
    can include implementations. (They are called the "default implementations" because
    they provide the default implementations for the concrete types that inherit from
    the interface.)


