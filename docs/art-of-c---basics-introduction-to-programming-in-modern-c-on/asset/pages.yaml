  md: '# # Lesson 19. Roman Numerals


    # ## 19.1. Introduction


    In the previous three lessons, we learned how to create custom types using struct
    and class, and their record cousins.


    As stated, these are two of the most important building blocks in the C# programming
    language. (Or, four, depending on how we count them.) We will further explore
    these concepts in this lesson by creating a new type, Roman.Numeral, using each
    of these constructs.


    Roman numerals is a very interesting way to write numbers. Integers between 1
    and 3999 can be represented using Roman numerals. For more information, refer
    to this article on Wikipedia, for instance, Roman Numerals [https://en.wikipedia.org/wiki/Roman_numerals].


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_308_0.png)


