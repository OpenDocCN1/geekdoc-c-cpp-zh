    declaration:


    ```

    ```

    namespace LED.Ascii;

    // ...

    ```

    ```


    This namespace `LED.Ascii` is "contained" in the namespace `LED`. In C#, you can
    have as many nested namespaces. This is equivalent to


    ```

    ```

    namespace LED.Ascii {

    // ...

    }

    ```

    ```


    which is in turn equivalent (according to the C# formal grammar) to


    ```

    ```

    namespace LED {

    namespace Asci i {

    // ...

    }

    }

    ```

    ```


    By using the file-scoped namespace (available as of C# 10.0), we are "saving"
    the precious space on the left-hand side. (Note the indentations of the main part
    of the code (...) in each namespace declaration.)'
