    ```text

    namespace hello_universe_0;

    // ...```

    ```


    In this case, anything that is declared/defined in the file, after this `namespace`
    declaration, will belong to that namespace. This is called the "file-scoped namespace"
    in C# 10.0.


    Note that the namespace name (generated by `dotnet new`) is based on the folder
    name, `hello-universe-0` in this example, but they are slightly different. The
    dash or minus sign (-) cannot be used in an identifier, or name, in C# programs.
    Hence it is converted to the underscore symbol (_).


    Different programming languages have different rules, but for most C-style languages
    including C#, a valid identifier comprises one or more alphanumeric characters.
    Special symbols are not allowed in a name, but the underscore _ is an exception.
    An identifier cannot start with a number character/digit (since the numeric literals,
    or numbers, start with a number character).


    Another thing to note is that it is more typical to use the "PascalCase" for namespace
    names in C# as well as for the custom type names, etc. The PascalCase naming convention,
    aka the upper "CamelCase", uses a concatenation of one or more words as a name
    in which all words are capitalized. As in "PascalCase".


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_36_0.png)


    On the other hand, the lower camelCase naming convention follows the same rule
    as that of the PascalCase, but it uses a starting lowercase letter. As in "camelCase".
    In C#, the camelCase names are typically used for the variable names, among other
    things.


    Within this (optional) namespace, the `dotnet new console` command created a simple
    class named "Program".'
