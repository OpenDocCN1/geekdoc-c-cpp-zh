- pgno: 486
  md: 'and `Pop()` methods as public API.


    This example shows four different possible implementations of the `Pop()` method.
    (Obviously, you will only need one.) The implementation of the `Push()` method
    is straightforward. But, for `Pop()`, we need to consider an edge case when the
    stack does not contain any data.


    Traditionally, we could have indicated this special situation by returning the
    `null` value, if T is a reference type, as shown in the first `Pop()` method.
    This implementation is not as convenient when T is a value type since the type''s
    `default` value might be a valid value for the stack data.


    Another way is just to throw an exception. This example implementation is shown
    in the `PopOrDie()` method. The caller will need to try and catch any possible
    exceptions. As alluded throughout the earlier parts of this book, the modern trend
    in C# programming is not to use exceptions, when avoidable. (And, avoid the `null`
    value, if possible.)


    A "better" alternative might be using the `TryXXX` pattern. This is shown in the
    implementation of the `bool TryPop(out T? tok)` method. We have seen a number
    of such "Try" methods earlier in the book. We only use the `tok` out parameter
    value if the method returns `true`.


    The `PopSoft()` method essentially follows the same pattern, but it uses a tuple
    return value instead of using the `out` parameter.


    Again, the choice is yours. The C# programming style is changing, and there is
    no "right" or "wrong" way. It is really a matter of preference at this point.'
