    As stated, a C# program (or, a C# project) can have only one entry point. It can
    be the top-level statements in a single source file, or it can be the Main() static
    method of a class/record, struct/record struct, or an interface.


    In this lesson, we basically create four distinct types to demonstrate the use
    of'
