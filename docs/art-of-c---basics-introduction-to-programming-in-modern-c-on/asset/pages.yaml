  md: '# 25.2. Discussion


    The most efficient way to shuffle a list of items, like a deck of cards, is using
    an algorithm known as the Fisher-Yates shuffle. Cf. Fisher-Yates Shuffle [https://en.wikipedia.org/wiki/Fisher%E2%80%93Yates_shuffle].


    Let''s start by defining a type for playlist. A playlist contains a list of songs.
    To shuffle a list, we will need to make a copy of the list since we do not want
    to change the original (ordered) list. The type `Playlist` that we use for playlists
    will therefore have to support some kind of "clone" or "copy" operations.


    It will also have to support comparison operations, for sorting. We can do that
    in a number of different ways, including explicitly implementing the `IComparable<T>`
    interface, or inheriting from a collection type, as we did in the earlier example,
    `Orgs` and `Employees`.


    > We used the inheritance in defining the `Organization` type. But that is not
    a very common practice, that is, inheriting directly from a collection type. In
    that example, one of the reasons for doing so was to illustrate the use of the
    collection initializer syntax for custom types, which was kind of "cool". :)


    In this lesson, we will use a more common technique known as "composition". In
    fact, composition is not that special. We simply include a variable of a type
    that we need to reuse/borrow as a field in our type definition. And, we delegate
    certain functionalities to the contained field variable.


    For instance, conceptually a `Playlist` is a list of `Songs`. But, instead of
    directly inheriting from a list of `Songs`, in the code sample, we "embed" a variable
    of a type `List<Song>` in the `Playlist` type.


    We expose some List-related APIs, such as `Add()` and `Size`, and we simply reuse
    the implementation of `List<Song>`. For example,'
  merge: -1
