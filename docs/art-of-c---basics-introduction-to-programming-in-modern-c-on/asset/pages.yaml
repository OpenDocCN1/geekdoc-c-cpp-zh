  md: 'Generics is often called the "templates" (in languages like C++) since it generates
    a concrete type using the generic definition as a "template".


    One small difference that we note here is that in the generic version, the out
    parameter type out T? max is declared nullable, T?. This is because the default
    value can be null for reference types. Values of int, which is a value type, cannot
    be null.


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_187_0.png)


    C# has a construct called the "nullable value types". In that context, null signifies
    the absence of a value, not the null reference. Although there are definitely
    situations where the nullable value types can be useful (and, this is again a
    concept borrowed from the functional programming, e.g., the algebraic data types),
    we do not recommend the use of the nullable value types. We do not use the nullable
    value types in this book.


    One other thing to note is that the relationship between a value type and its
    nullable value type is *rather different* from that between a reference type and
    its nullable counterpart. It is unfortunate that the terminologies used by the
    C# community are not very consistent, but learning these subtle, or not so subtle,
    differences is a part of the learning process.


