- pgno: 336
  md: 'Note that the generic methods/classes generate specializations at build time,
    whereas inheritance-based polymorphism is a runtime behavior.


    As alluded before, C# provides an extremely powerful generics, unparalalled in
    any other modern programming languages except for maybe C++20, and programmers
    should take advantage of the generics more than anything else, if possible.


    In fact, we implement a sorting method using generics in this lesson. The `Bubble.Sort<T>`
    static method is based on the version that we used in part 1. It is simplified.
    (There is no "pivot".) The sorting order, in this example, is based the "radius"
    (the distance of a point from the origin $(0,0)$).


    Although it is a simple example, this method would have been more difficult to
    efficiently implement, and use, for both `SPoint` and `RPoint` using the interface-based
    polymorphism, e.g., using `IList<IPoints>`.


    > We will not go into details of the advanced concepts like "variance", e.g.,
    covariance and contravariance, in this book. Readers, if interested, are encouraged
    to explore further on this (very important) topic.


    One other thing to note is that `SPoint` is a value type whereas `IPoint` is a
    reference type. By using `IPoint` for `SPoint`, we may end up losing some benefits
    of using value types.


    C# does the so-called "boxing" and "unboxing" operations when the variables are
    converted between the value and reference types at *run time*.


    The values stored on the stack memory, for instance, can be moved to the heap
    memory through "boxing". An "unboxing" refers to the reverse operation.


    The implementation of `Bubble.Sort()` is more or less the same (only simpler)
    as the previous generic implementation for the "number" types. It uses the "bubble
    sort" algorithm.'
