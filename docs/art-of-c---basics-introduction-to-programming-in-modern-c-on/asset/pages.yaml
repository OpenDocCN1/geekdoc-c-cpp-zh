- pgno: 196
  md: 'The `Rotate<T>()` method returns, as its first element (i == 0), the value
    of `list[delta]` (ignoring the modulo operation for now). That is, the value of
    its first element (of the rotated list) is that of the `delta`-th element of the
    original list. The value of its second element, i == 1, is that of `list[1 + delta]`
    in the original list. And so forth. This effectively shifts the elements by `delta`
    to the left.


    The result of `Mod(n, b)` function falls into a range from 0 (inclusive) to b
    (exclusive). (The double modulo operations in the implementation is to take care
    of the negative n values.)


    The `IEnumerable<T> Shift<T>(this IList<T> list, int delta)` method is implemented
    exactly the same way other than that it is declared as an extension method.


    Both methods use the default value of 1 for the second argument `delta`. That
    is, if the methods are used only with the first argument, then the default value
    1 is used for the value of the second argument, `delta`, The method call `Rotate(list)`,
    for example, is equivalent to `Rotate(list, 1)`.


    The arguments like `delta` that have the default values are often called the "optional
    arguments" since they do not always need to be specified. Only the last (consecutive)
    set of arguments in the argument list can be made optional.


    # Summary


    We introduced the concept of method overloading. In C#, one can use the same method
    names for different (but related) methods as long as they have different parameter
    lists.


    We looked at a couple of important interfaces in .NET, namely `IEnumerable<T>`
    and `IEnumerator<T>`, in this lesson. We also introduced a special syntax in C#
    to create a method that returns an `IEnumerable<T>`, using the `yield return`
    statement.


    In addition, we reviewed the "extension methods", which we first introduced in
    the previous lesson.'
