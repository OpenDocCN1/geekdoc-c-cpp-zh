    In the Python world, virtually nobody uses semicolons. The semicolons are not
    "Pythonic". In Javascript (which is a C descendant), there are two camps. The
    people who vehemently object to using semicolons, and the rest who do not care.


    For some people, it is a religion. If you use semicolons in some teams, you cannot
    even check in your code. Through the forced linting, you have to completely strip
    off the semicolons. Otherwise your code is just "too ugly" to be included in the
    team’s code repository.


    Go is another (opinionated) language that takes this up to another level. Go is
    based on C, which uses the semicolons. Go’s grammar requires the statement-ending
    semicolons. And yet, in practice, nobody uses semicolons. You simply can’t. The
