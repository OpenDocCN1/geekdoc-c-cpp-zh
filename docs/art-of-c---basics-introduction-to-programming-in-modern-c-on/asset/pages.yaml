    # 6.2.2. Grammar - Delegates, Arrays, Conditional Statements


    Methods in C# can be given an explicit type. It is called a **delegate**.


    A delegate is a type that represents the references to certain methods with a
    particular parameter list and return type.


    For instance, in the sample code, we declare a delegate named `IsLeapYear` (in
    the "file-scoped namespace" Example).


    ```

    delegate bool IsLeapYear(int year);

    ```


    This statement declares a "delegate type", using the keyword `delegate`, which
    represents a method which takes an argument of type `int` and returns a `bool`
    value, and gives it a name `IsLeapYear`. (`IsLeapYear` is the name of this type,
    just like `int` or `string`.)


    As stated, as of C# 10.0, the use of the file-scoped names syntax is preferred
    since it reduces the need for indentation. This source code could have been written
    as follows, using the more traditional block namespace:


    ```

    namespace Example { delegate bool IsLeapYear(int year); }

    ```


    Note the indentation within the namespace block. This is sometimes called the
    "horizontal waste". It is just one line in this example, but one can easily imagine
    how much unnecessary space we can remove by using the file scoped namespaces in
    large programs (e.g., with nested namespaces, etc.).'
