- pgno: 418
  md: 'As indicated, the `Playlist` type contains a list of `Songs` as a private member
    field.


    ```

    private readonly List<Song> list; .

    ```


    Note that we also mark it as `readonly`. As a general rule, you should always
    *try to make your internal data readonly or immutable by default, unless it is
    required otherwise. In the modern multi-threaded, multi-processed runtime environments,
    dealing with mutable data is much more complicated. (Clearly, it is not always
    possible to make all data immutable, however.)*


    Declaring the variables of a collection type as `readonly` provides only limited
    protection. For example, even though the variable `list` is `readonly` and cannot
    be changed, one can easily *change its elements*.


    In fact, this is true for all reference types. The language constructs like `readonly`
    only provides protection for the variable itself. But, for reference type variables,
    we mostly do not care about the reference values. We primarily care about the
    values that they reference. But, C# has no fundamental support at the language
    level to make the underlying data immutable that the references point to. (This
    is not only for C# but in general for all C-style languages.)


    This is one of the reasons why the (immutable) values, and the value types, might
    be preferred over the references, and the reference types, in many situations.'
  merge: -1
  img_proc: true
- pgno: 419
  md: 'We discussed the value type vs the reference types in earlier lessons. And,
    the “data type” vs everything else. The truth is, we barely scratched the surface.
    There is only so much that an (introductory) book like this can teach you. Ultimately,
    you will have to develop an “intuition”, if you will, through experience.


    But, as a general rule of thumb, related to this lesson, always strive to use
    immutable values. If you use a struct type, then make it “readonly”, as well as
    all its fields, so that the values of the type are guaranteed to be immutable.


    If you create a type using record (for “data”), then again make it immutable.
    All properties should be readonly, and you should not provide any method that
    can mutate the data.


    In practice, it is not always possible. Some types are sometimes more like data,
    and at other times, it is their “behaviors” that are more important. Some types
    have dual nature of values and references. Regardless, this dichotomy of thinking
    is very useful when designing a large software system.


    In the sample code of this lesson, we use the C#s lock statement to “protect”
    the data list. It is a common practice to create an (empty) object instance as
    a lock object.


    ```

    private readonly object listLock = new();

    ```


    The listLock object is a surrogate for the real resource that we are really protecting,
    namely, list. We could have just used the reference variable list as a lock, but
    using a proxy like this is not uncommon. In some cases, the values that we are
    protecting cannot be used as a lock.


    In a multi-threaded environment, only one thread can hold any given lock. For
    instance,'
