  md: '# ## Type Conversions


    There are a number of ways to convert a value/variable of one type to another.
    All numeric types include the `Parse()` and `TryParse()` static methods to convert
    strings to integral or floating point numbers.


    # ### Array


    An array data type is used to store multiple variables of the same type. Array
    elements can be of any type, including an array type. An array can be single-dimensional,
    multidimensional, or jagged.


    # ## Custom Types


    # ### Enum Type


    We introduced the `enum` types, which are user-defined integer types. An enum
    type use to define a set of related constants. The enum values can be cast into
    integers and vice versa.


    # ### Static Class


    A `static class` is used to define `static methods`. Static methods are like "functions"
    in other programming languages.


    # ### Access Modifiers


    Various `access modifiers` like `public` and `internal` can be used to control
    the access levels for your types and their members. The top-level (custom) types
    can only be either `internal` (they can only be used within the same assembly)
    or `public` (they can be potentially used by other assemblies).'
