- pgno: 288
  md: 'C# does have pointers (as well as keywords like fixed), which can be used in
    an "unsafe" context. As stated, we do not discuss the "unsafe C#" in this book.


    The underlying values of reference variables are generally stored in the "heap
    memory". The heap memory is allocated to a running program, and it remains until
    the program terminates. To support the reference semantics, as stated, the underlying
    values need to be stored in some "permanent" locations.


    On the other hand, the values of value types or reference values (not the underlying
    values) can be, and typically are, stored in transient place known as the "stack
    memory". When a function/method is invoked, a new stack frame is created, and
    all temporary, or "local", variables are stored on the stack. When the function/method
    returns, the stack frame is destroyed and all values stored in that frame are
    lost (unless they are "copied" to somewhere else).


    One of the most important differences of these memory locations is that allocating
    memory on the heap is generally more expensive because it has some overhead of
    managing memory. In contrast, creating and destroying values on the stack memory
    is much cheaper. In this sense, values of the value types, which are almost always
    stored on the stack, are preferred.


    On the flip side, copying large values can be expensive. References are small
    values (e.g., on the order of a few bytes depending on the machine architecture),
    and copying their values (not the underlying values) can be rather efficient.
    It is typically comparable to copying integer values. Hence, in certain situations,
    reference variables are preferred over value variables.


    We are ignoring many details, but that''s the most important takeaway from this
    lesson. Values can be useful, and the value semantics can be useful, in certain
    situations. References can be useful, and the reference semantics can be useful,
    in certain situations.


    As a programmer, you will have to figure out what to use when, when you have a
    choice.'
