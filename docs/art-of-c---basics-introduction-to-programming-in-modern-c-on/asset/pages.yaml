  md: '# Lesson 30. Reverse Polish Calculator


    # 30.1. Project


    As one of the three final projects, we will work on implementing a calculator
    in this lesson, which can process an arbitrary arithmetic expression. For example,
    let’s consider the following input:


    ```

    (1+3) * (6.0/2) - 3.5

    ```


    It includes the four different arithmetic operations, addition $(+)$, multiplication
    $(*)$, division $(/)$, and subtraction $(-)$. The parentheses are used to change
    the precedence in mathematical expressions. This expression evaluates to 8.5,
    as you can easily verify.


    Writing a program to evaluate a general arithmetic expression like this is a relatively
    complicated problem. We will need to write a "parser" to parse an input expression.


    If any of the (ambitious) readers is interested, then this can be done by writing
    a simple "recursive descent parser". We will leave it to the readers. If you are
    learning programming without computer science background, then this can be a very
    interesting, and challenging, problem. You will end up learning a lot by writing
    a simple calculator program.


    For this project, however, we will tackle a slightly simpler problem. The computation
    can be simplified by using what we call the "postfix notation", aka Reverse Polish
    notation. Here''s the link to a Wikipedia article: Reverse Polish notation [https://en.wikipedia.org/wiki/Reverse_Polish_notation].


    The above input expression in the standard "infix notation" can be written as'
  merge: -1
  img_proc: true
- pgno: 482
  md: 'follows in the postfix notation:


    ```

    1 3 + 6.0 2 / * 3.5 - .

    ```


    Note that the postfix notation does not require any use of parentheses. Note also
    that this simple notation can only support binary operations (that is, those with
    two operands). Take your time and see if you can figure out how to read this expression.
    We will go over this together in the next section.


    Given an input like this, our program will need to produce an answer like this:


    ```

    The result is 8.5

    ```


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_482_0.png)


    # ### 30.2. Design Suggestion


    The easiest way to implement a Reverse Polish calculator is using "stacks". A
    stack is'
  merge: -1
  img_proc: true
- pgno: 483
  md: 'a LIFO data structure (last in first out), and it generally supports interfaces
    for adding (to the end/top of the stack) and for removing items (from the end/top):
    *Stack (abstract data type)* [https://en.wikipedia.org/wiki/Stack_(abstract_data_type)].


    Let''s look at how the postfix notation works, using the above example. We will
    just use a stack to illustrate this concept instead of going through this twice,
    once without a stack and the second time with a stack.


    +   1.  When we see a number, 1 in this case, we push it into a stack. At this
    point, we have one item in the stack.

    2.  When we see another number, 3, we push it again into the stack. Now, we have
    3 and 1 in the stack, from top to bottom.

    3.  When we see a binary operator, + in this case, we pop two elements at the
    top of the stack, that is, 3 and 1 in this example, and compute the expression,
    `3 + 1`. The result `4`, a number, is then pushed back into the stack. At this
    point, the content of the stack is this one item `4`.

    4.  Now, we have `6.0` in the input, another number. This is pushed into the stack.
    The stack content: `{6.0, 4}`.

    5.  Then, the number `2` is also pushed into the stack. The stack content: `{2,
    6.0, 4}`.

    6.  When we see the binary operator `/`, we pop the two elements at the top, and
    compute the expression, `6.0 / 2`. Note the order. The value of this expression
    is `3.0`. This number is pushed back into the stack. The stack content at this
    point: `{3.0, 4}`.

    7.  The next token is another operator `*`. Hence, we pop the top two elements
    and do the operation, `3.0 * 4`, whose result is put back into the stack. Now,
    the stack contains only one item, `12.0`.

    8.  The next number `3.5` from the input is pushed into the stack. At this point,
    the stack content is `{3.5, 12.0}`.

    9.  We then compute `12.0 - 3.5` since the next token is a binary operator `−`,
    and we put the result `8.5` back into the stack.'
