  md: '```

    var context = await listener.GetContextAsync();

    await handler(context);

    ```


    The program cannot call the handler delegate method (e.g., server.ProcessTextResponse()
    or server.ProcessJsonResponse()), for example, until it gets a context object
    from listener.GetContextAsync(). Logically, it has to be synchronous.


    The beauty of the async/await paradigm is that the code is written as if they
    are synchronous calls (except for the uses of async and await keywords), and yet
    they are not "blocking". The program, or the thread, can do other things like
    accepting and processing user input, etc., while waiting for the previous async
    call to complete.


    There is no need to use completely different syntaxes like "callbacks" or there
    is no need to explicitly create and manage separate threads, etc.


    There are many different ways to do asynchronous programming in many different
    programming languages.


    The C#''s async/await model is one of the best, the easiest, and the most intuitive
    to use (although it can be subjective).


    The async/await programming model is based on a decades-old computer science theory,
    and now many programming languages are adopting this model, not just C#, to varying
    degrees, including modern Javascript/Typescript, Rust, Swift, Kotlin, etc., and
    yes now even Python, which has been around for over 30 years. (Their precise names
    and syntaxes vary.)'
