    only to the Windows platform. You can run any modern C# programs on .NET, using
    the .NET libraries.


    The word "program" can mean, depending on the context, a binary program, e.g.,
    an executable on a particular computer architecture, or a source program, which
    is typically a collection of source code files, (Or, even a part of the complete
    program.)


    A C# binary program can be either an executable or a library. In the .NET world,
    they are called the "assemblies". An assembly can be either an executable (e.g.,
    typically with the file name extension `.exe` on Windows) or a dynamically linked
    library (e.g., typically with the extension `.dll` on Windows).


    C# is a class-based programming language. A `class` plays an essential role in
    C#. The `class`, and its cousins, allow the programmers to create custom types,
    which are the core components of any C# programs.


    In this first part, we will primarily focus on the programming styles using the
    built-in or library-supplied types. We will start defining and using our own custom
    types from the second part.'
