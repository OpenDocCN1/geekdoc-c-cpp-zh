  md: 'In the modern programming using multi-core CPUs and what not, the need and
    importance of asynchronous programming is ever growing.


    Although we did not really discuss async/await until this lesson, that does not
    mean that it is less important than other topics we have covered earlier in this
    book. In order to become productive and effective, the readers will need to understand
    and use async/await programming well, including various APIs from the Task class,
    etc.


    When using third parity libraries and frameworks, such as ASP.NET, for example,
    many public APIs are async methods. Once you start really programming in C#, for
    any real tasks, you will realized that async/await is everywhere.


    The `Server.Run()` method uses an interesting pattern.


    It needs to call multiple async methods (in a loop). Instead of calling each one
    with await sequentially, e.g., `await Listener.StartAsync(r, h)`, it first stores
    its returned object (of type `Task`) in a temporary list.


    And then, after collecting all Tasks, it calls the static method `WhenAll()` of
    `Task`:


    ```

    ```csharp

    await Task.WhenAll(tasks);

    ```

    ```


    This is an important async programming pattern to learn. There are a couple of
    things to note.


    First, in this example, there is no need for one `Listener.StartAsync(r, h)` call
    to wait for another call to finish. They can run simultaneously. Hence calling
    them sequentially using `await` would have been rather inefficient. (On top of
    this, the `StartAsync()` method, in this particular example, does not return.
    It has an infinite loop.)'
