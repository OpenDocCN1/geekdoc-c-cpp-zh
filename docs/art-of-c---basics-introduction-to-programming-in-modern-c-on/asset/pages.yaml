  md: '# Join Our Mailing List


    Please join our mailing list, csharp@codingbookspress.com, to receive coding tips
    and other news from **Coding Books Press**, including free, or discounted, book
    promotions.


    Advance review copies will be made available to select members on the list before
    new books are published so that their input can be incorporated, if feasible.


    # Office Hours


    We may set up a regular time, weekly or monthly, to answer any questions from
    the readers, or to go through some of the exercises in the book together. If you
    sign up on the mailing list, then we will notify you when the office hours starts.


    *Note: Regular office hours will be held only if there is a sufficient demand.*'
