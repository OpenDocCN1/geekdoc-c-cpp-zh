  md: 'What is "wrong" with this picture?


    The separation of "interface" and "implementation" is a fundamental tenet in programming.
    C# violates this fundamental tenet by introducing this concept of implicit vs
    explicit interface method/property implementations and the interface method/property
    default implementations.


    Whether a type implements an interface method/property explicitly or not is an
    implementation detail. And yet, as we have seen in some examples, the usage of
    an object depends on how the interface method/property is implemented.


    Whether an interface method/property has a default implementation or not is an
    implementation detail. And yet, again, as we have seen in some examples, the usage
    of an object depends on whether an interface method/property has a default implementation
    or not.


    The author does not recommend the use of interface method/property default implementations.
    There are use cases for this, and whether those are valid, or good, use cases
    or not is debateable. If you need to share an implementation across multiple types,
    then consider using (abstract) base types rather than the interfaces with default
    implementations.


