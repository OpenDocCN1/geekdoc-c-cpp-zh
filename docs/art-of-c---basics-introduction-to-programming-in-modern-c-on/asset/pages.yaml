    This book is *for reading*. The author does all the work. 😊 He even includes all
    the relevant outputs from all (or, most of) the sample programs in this book.
    The readers can just sit back and "read". 😊


    # 1.2.2. Grammar


    A C# program primarily contains the "custom type definitions", using constructs
    like *struct* or *class*, as we will learn throughout this book.


    This hello world program is an exception, however. It merely includes one "statement".
    A statement is an instruction to the computer as to what needs to be done. The
    statements written in a program like this, instead of being included in other
    constructs like classes or methods, are called the "top level statements" in C#
    (C# 9.0 and later).


    An executable C# program can have at most one source file that contains the top
    level statements. Furthermore, the top level statements, if present, must be in
    the beginning part of the source file, before any custom type definitions.


    The top level statements can also include static method definitions, as we will
    illustrate in the next lessons. The top level statement feature (new as of 9.0)
    makes the main part of a program look a bit simpler by eliminating some boilerplate
    code.'
