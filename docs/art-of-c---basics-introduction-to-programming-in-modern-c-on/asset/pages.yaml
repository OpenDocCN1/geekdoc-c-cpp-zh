  md: 'Or, more generally, the "distance" between a pair of numbers can be defined
    as follows without using Math.Abs():


    ```

    int Distance(int l, int r) => (l - r) > 0 ? (l - r) : (r - l);

    ```


    (Note the use of the subtraction (-) operation to compute the "distance".)


    Then, the two distances between the two pairs of numbers, between l and pivot
    and between r and pivot, are compared using the two ternary operators. Note that
    the second operand of the first ternary operator is another ternary operator expression.
    None of the parentheses are required in this return statement.


    It is conventional, for this type of "comparison" functions, to return -1 if the
    first argument is smaller than the second, and return 1 if it’s the reverse. If
    the two values are the same, then it returns 0. This Compare() function follows
    that convention.


    The int-version of Compare() is then used in our int-version of the Sort() method.
    The if statement would have been a simple integer comparison if we were to sort
    numbers in terms of their natural size. For example,


    ```

    if (arr[j] > arr[j + 1]) { /* ... */ }

    ```


    This condition, if evaluated to true, indicates that the value of the left element
    (from a pair of the two consecutive elements) is bigger than the value of the
    right element. That is, they are "out of order". In the sorted order (which is
    our goal), the right element of the pair should be bigger.


    Therefore, if the boolean expression evaluates to true, then we swap the two numbers.


    ```

    (arr[j], arr[j + 1]) = (arr[j + 1], arr[j]);

    ```'
