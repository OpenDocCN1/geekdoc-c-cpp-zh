- pgno: 17
  md: 'If you have some programming experience, either in C# or in other languages,
    the book might seem too verbose or too slow-moving. If you are familiar with the
    basic concepts of programming, then you can probably skip some early parts of
    the book without losing too much continuity. There are a fair amount of repetitions
    in the book, by design.


    # # Reading Before "Premature Writing"


    Learning a programming language is not much different from learning a foreign
    language. You learn from examples, primarily by listening and reading.


    The same principle applies to learning programming languages. You learn from examples,
    primarily by reading the well-written code.


    Most of the examples used in this book are, although small and elementary, all
    inspired by the real world use cases, to varying degrees. The readers are encouraged
    to "read" the code samples first, not just the text in the book, before diving
    into the main part of each lesson. Much of the code may not make much sense at
    the first reading. But, that is how we learn a new language. That is how we learn
    a new skill.


    # # The Topics Covered in This Book


    *The Art of C# - Basics: Introduction to Programming in Modern C# - Beginner to
    Intermediate* is organized into a series of small lessons. Each lesson teaches
    basic concepts of programming, and programming in C# in particular, by going through
    carefully-designed sample code.


    The lessons gradually progress from the basic topics to the more advanced subjects.
    You can advance at your own pace. If you are just starting out, then you can take
    your time. If you have some programming experience, then you can skip, or skim
    over, some of the earlier lessons, as stated.'
