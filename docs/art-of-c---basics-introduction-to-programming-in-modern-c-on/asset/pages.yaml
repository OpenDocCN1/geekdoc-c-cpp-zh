  md: 'If you implement a calculator, then you will likely define a "token" type (for
    numbers and operators) and it is this token type that will be stored in the stack
    (the `T` type parameter). In the example above, the nullable `T?` type is an artifact
    of the generic implementation. You will likely use a non-nullable record/struct
    as a token type, but there is no easy way to specify that as a generic type constraint,
    as of the current version of C#.


    # ## 30.3. Sample Implementations


    We will leave the implementation to the readers. After all, this is a "hands-on"
    project. \u2635 An example program is included in the appendix: Code Listing -
    Part IV.


    No cheating! \u2639\u2635\u2639


    There are two implementations. reverse-polish-1 and reverse-polish-2. They are
    more or less equivalent, but one sample program uses a property `TokType` to distinguish
    different token types. The other one uses the object types, and the polymorphism,
    to achieve the same.


    One sample code is not necessarily "better" than the other. But, there will be
    situations where one style is preferred over the other. It will be instructive
    to compare these two programs.


    Not all input sequences are valid expressions in the postfix notation. The sample
    program, either version, does not do much error handling when it encounters an
    invalid input expression. It will be a good exercise to think of a good error
    handling method for this problem.'
