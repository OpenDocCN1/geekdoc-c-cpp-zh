  md: 'definition.


    # ### protected internal


    Conceptually, `protected OR internal`. That is, the `protected internal` names
    are accessible from an inherited type or any type within the same assembly.


    # ### protected


    Protected names can be accessed from the type''s child/inherited types, either
    within or outside the assembly.


    # ### internal


    Internal names are accessible within the same assembly.


    # ### private protected


    Conceptually, `protected AND internal`. That is, the `private protected` names
    are accessible from an inherited type within the same assembly.


    # ### private


    Private names cannot be accessed from outside the type definition.


    These access modifiers are listed here more or less in the descending order, from
    "more open" to "more closed".


    When you "override" a member method or property, you can either use the same access
    modifier or you can use a "more restricted" one as long as it does not change
    the parent type''s public API. That is, the `public` methods and properties in
    the super class/record can be only be overriden as `public`.


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_362_0.png)


    Note that we do not discuss nested types and functions in this book. As stated,
    this is an introductory book and our goal is not to go through all the features
    of C#. The readers are encouraged to learn more about these concepts, if interested,
    from other resources.'
