    \ a Reverse Polish calculator is straightforward.\n\n+   * First, we read the\
    \ input expression.\n* Next, we \"tokenize\" this expression. That is, we divide\
    \ it into a sequence of numbers and binary operators. For simplicity, we will\
    \ just assume that all tokens are separated by at least one whitespace, e.g.,\
