- pgno: 420
  md: "```\n```csharp\npublic void Add(Song song) {\n    lock (listLock) {\n     \
    \   list.Add(song);\n    }\n}\n```\n```\n\nIn order to be able to add a new item\
    \ to the `list`, we need to hold the lock first, using the `lock (listLock) {\
    \ }` statement. While the thread executing this method is holding the lock (inside\
    \ the curly brace pair), no other thread can access `list`. None can modify the\
    \ `list` or even read it without first acquiring the lock (because our API design\
    \ does not allow it). Doing so could result in ending up using inconsistent data\
    \ based on which thread accesses the data first. This is known as the \"race condition\"\
    \ in computer science.\n\nIf you are new, or coming from languages like Javascript,\
    \ then this may all sound like a gibberish. In some languages like Java, multi-threading\
    \ is such an essential part of programming. In some other languages like Python,\
    \ or even Go, it is less so (e.g., because they provide higher-level/easier-to-use\
    \ APIs. Javascript runtimes are single-threaded. (But, \"asynchronous programming\"\
    \ is still a very important part of modern Javascript.)\n\nC# lies somewhere in\
    \ between. In C#, threading APIs are considered \"low-level\" APIs. We mostly\
    \ program using \"high-level\" constructs like `async`/`await`, as we discussed\
    \ in the previous part.\n\nBut, the C# programmers still have to be aware of the\
    \ implications of running the program in the multi-threaded runtime environments\
    \ (like .NET or anywhere else).\n\nThe important thing to note is that the data\
    \ field like `list` in an instance of a type (class, record, struct) is `shared`\
    \ by multiple threads, and we need to coordinate their access (unless they are\
    \ (truly) immutable). (As stated, declaring the reference variables `readonly`\
    \ is not sufficient unless the type is designed to be \"truly immutable\".)"
