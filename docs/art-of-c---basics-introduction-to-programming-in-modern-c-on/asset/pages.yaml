    * And, every time we see an operator, we pop the top two items from the stack\
    \ and compute the binary expression. The result is pushed back into the stack.\n\
    * When we have no more tokens to process, the top element in the stack is the\
    \ result of the input expression.\n\nYou can use a stack data structure from the\
    \ .NET library, or you can create your own stack type using what we have learned\
    \ in this book.\n\nHere's an example:\n\n```\npublic sealed class Stack<T> where\
