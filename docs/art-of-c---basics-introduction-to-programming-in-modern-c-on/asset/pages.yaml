  md: 'composition over inheritance unless there is an explicit reason to use inheritance.


    Note that we synchronize the use of the internal field, `buffer`. Since an object
    of Type `Buffer` is not thread-safe, we should synchronize its uses in some way.
    And, the `lock` statement is one of the simplest and the most common ways to protect
    the shared resources.


    > If we create a non-thread-safe type, for example, for `ShortQueue<T>`, then
    again we should protect its uses when we use the variables of the type.


    One more thing to note is that there is really no easy way to synchronize the
    implementation of `GetEnumerator()` method.


    The method returns a (reference) variable of type `IEnumerator<T>`. Once the `GetEnumerator()`
    method returns an `IEnumerator<T>` object, the caller can do whatever it wants
    to do with the "data" (i.e., the embedded buffer items), which are in turn the
    elements of the array type `T[ ]`.


    Hence, `ShortQueue<T>` is not fully thread-safe, and its user should synchronize
    the data uses in some way.


    That is what the Queue test program does in this example. Note the use of `lock(queue)`.
    It directly uses the resource that we are protecting as a lock object. As stated,
    it is also a common pattern to do so when that is possible. The values of value
    types, and strings (whose values are "interned"), and any variables of the types
    that have copy semantics, may not be suitable as a lock object.


    In this particular example, the resource to synchronize its use is a variable
    of a reference type, `Ring.Buffer<T>`, whose resource needs synchronization, is
    in turn a variable of the reference type `T[ ]`. Whether T is a value type or
    a string or another reference type has no bearing in this example.


    Another use case of `Buffer<T>` is an MRU list.'
