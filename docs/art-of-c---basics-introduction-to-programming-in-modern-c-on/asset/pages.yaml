    # 21.2. Code Review - Electronic Door Lock Controller


    The requirements of this exemplary door lock are "behaviors". Doors open and close.
    Door locks lock and unlock.


    A door lock can keep an internal state (e.g., the secret code), but that is not
    really "data".'
