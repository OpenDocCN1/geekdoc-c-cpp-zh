  md: '# ### Properties


    The internal data of a variable can be accessed via properties. Properties in
    C# are like data fields, in terms of syntax, but they are semantically methods,
    essentially getters and setters.


    # ### Methods


    The definitions of static or instance methods can be included in a "block", using
    a pair of curly braces, or they can be stated as an "expression body", using the
    fat arrow syntax, if the implementation can be represented by a single expression.


    # ### Method overloading


    We introduced the concept of method overloading. In C#, one can use the same method
    names for different (but, related) methods as long as they have different argument
    lists.


    # ### Extension Methods


    The extension methods are used to "add" methods to existing types. They are static
    methods, but they’re called as if they were instance methods on the extended type.


    # ### Delegates


    A delegate in C# is a type, and it is used to represent a class of methods (static
    methods or instance methods) that have a certain function signature.


    Delegate instances can be used just like any other object, and they can be "called"
    as if they are methods.


