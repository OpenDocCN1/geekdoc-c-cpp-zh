- pgno: 28
  md: 'In this example, the single-line top-level statement is a “method call”, Console.WriteLine(“Hello
    World!!!”). (The pair of parentheses ( ( and ) ) is used for the “method invocation”.
    In this case, WriteLine is the method.)


    The statement appears to include two components separated by a dot (.), namely
    Console and WriteLine(“Hello World!!!”). in fact, this statement is a shorthand
    for


    ```

    System.Console.WriteLine("Hello World!!!");

    ```


    This includes three components. The first part, System, is called a “namespace”.
    The System namespace is from the standard .NET library, and it includes many different
    types and what not. The Console class happens to be one of them. The namespaces
    are used to reduce the chances of name collisions across different C# programs
    (e.g., executables and libraries).


    In order be able to use the Console class, its name should be qualified with the
    namespace, as in the example: System.Console. Alternatively, one can use the keyword
    using to “introduce” (all) the names from the given namespace into the program,
    or more precisely to the specific source code file. For example,


    ```

    using System;

    Console.WriteLine("Hello World!!!");

    ```


    In this example, by using the using declaration, we can refer to the Console class
    without having to fully qualify its name. Note, however, that certain system namespaces
    are treated as special, as of C# 10.0, including the System namespace. They need
    not be explicitly imported using the using declaration. As in the original example
    code, we can just omit the using System declaration. This is known as the “implicit
    using”, “implicit global using”, or “implicit namespace import”, in C# 10.0. This
    is an “opt-in” feature, and we will discuss this further a bit later.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 1.2. Code Reading - Hello World 1


    Console happens to be what we call a "static class". It does not really define
    a "type". It merely includes a number of "static methods" and other static variables
    and constants. In this example, we use the static method WriteLine() defined in
    the Console class to print out a text to the console (hence the name). Note again
    the dot syntax, connecting the names of the static class and its static method.


    In languages like C# and Java, one cannot define a top-level function, which is
    an essential part of most other programming languages like C++, Go, Python, and
    Javascript. As a workaround, if you will, one can use the "static methods" in
    liu of the top level functions. In fact, the static methods in C# and Java can
    be viewed as the functions in other programming languages. It''s mostly their
    syntax that are different.


    The syntax for using the names from a static class can be simplified by using
    the using static declaration. For instance,


    ```

    using static System.Console;


    WriteLine("Hello World!!!");

    ```


    By introducing the name System.Console into the source code file using the using
    static declaration, now we can refer to the static method WriteLine() of Console
    without having to qualify its name.


    Note that we are using the fully qualified name of System.Console, not just the
    class name, in the using static statement, as required by the C# grammar.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'This feature is officially called the "static using". The author prefers to
    call it the `using static` declaration because that is how he uses it when he
    programs. The terminologies are important, but only to the extent that they help
    clarify the underlying concepts and/or as long as they facilitate easier communications.


    Throughout this book, we will just use the terms that make sense (although they
    may not be the "official" terms). At the end of the day, it is the program that
    speaks, not the names that we attach to the parts of the program.


    Now, as for the static method `WriteLine()` of the `Console` class defined in
    the `System` namespace, it takes one argument of the `string` type (in this example),
    and it prints out the given argument(s) to the terminal. "Hello World!!!" (with
    a pair of double quotes) is a "string literal". It represents a specific (constant)
    value of the `type` `string`.


    That’s all there is to it. If you build and run the program, then it prints out
    the given `string` (Hello World!!! in this case, without the double quotes) to
    the console, and since there is nothing more to do, the program terminates.


    One thing to note is that many statements in C# end with a semicolon (;). It is
    required in many types of statements. (Also, a "block" can terminate a statement
    instead of the semicolon.)


    At the risk of stating the obvious, the semicolon is required at the end of a
    statement in a C# program. It is not the end of a line where we need to use a
    semicolon. (Just to reiterate, some types of statements in C# require (explicit
    or implicit) "blocks" and those types of statements do not end with semicolons.)'
