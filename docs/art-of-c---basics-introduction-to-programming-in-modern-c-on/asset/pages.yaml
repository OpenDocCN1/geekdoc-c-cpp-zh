- pgno: 352
  md: '# Lesson 22. Orgs and Employees


    # 22.1. Introduction


    As stated, C# is an *object-oriented programming (OOP)* language. That is, C#,
    as a programming language, has many features that support the object-oriented
    programming style.


    First and foremost, it supports "data encapsulation" (or, "data hiding").


    The modern C# prefers properties, or auto-properties, over the use of explicit
    data fields. Although, in theory, one can still have public fields, such practices
    are all but disappeared from the C# universe. Data is always accessed via a well-defined,
    and access-controlled, interface such as properties or methods.


    We have seen some of such examples in this book. The three main constructs of
    C#, *class*, *record*, and *struct*, all support data encapsulation.


    C# also supports inheritance-based polymorphism (aka "subtyping") via interfaces
    and other reference types like classes and records, as we indicated in the earlier
    lessons.


    > Note that this kind of polymorphism only works with reference type variables.
    C#''s value objects, defined by structs or enums, do not, and cannot, support
    such polymorphic behavior.


    > This is not the limitation of C#. This is true for all OOP languages. For example,
    in C++ and Rust, if you want to use polymorphism, you will need to use pointer/reference
    types.


    > This is because, roughly speaking, the polymorphism relies on some kind of "indirection".
    A reference variable points to a value in other location. A value variable does
    not.'
  merge: -1
