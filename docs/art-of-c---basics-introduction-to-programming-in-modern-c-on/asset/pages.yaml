  md: '# Author''s Note


    # What It Takes to Be a Good Programmer


    Programming, or more broadly software development, involves a lot of different
    skills and talents.


    First, you will need to be an expert in the language you use in programming. This
    is actually the easiest skill that you can learn. The programming languages have
    well-defined grammar, unlike spoken languages, with a finite set of rules. The
    resources like this book can help you learn the languages.


    Second, you will need to be familiar with commonly used libraries and APIs. It
    takes experience. The longer you program, the more familiar you will become with
    various libraries. It is not "difficult", but it just takes time.


    Third, you will need some analytical or problem solving skills. This is not something
    you can learn by reading books or anything like that. But, you will get better
    over time as you train yourself by working on more problems. It helps to learn
    some common algorithms as well. The "familiarity" with a diverse set of problems
    will be definitely helpful when you face a new problem.


    And, eventually, you will need to develop the system or architectural design skills.
    This is different from the programming skills. Creating a large software is like
    "building a pyramid", using the analogy that we used before, or building a "starship"
    using Lego blocks. You can only learn this skill by actually doing it, that is,
    by building a large scale software.'
