    \ a virtual member can be changed by an overriding member in a derived class.\n\
    \n# Remarks\n\nWhen a virtual method is invoked, the run-time type of the object\
    \ is checked for an overriding member. The overriding member in the most derived\
    \ class is called, which might be the original member, if no derived class has\
    \ overridden the member.\n\nBy default, methods are non-virtual. You cannot override\
    \ a non-virtual method.\n\nYou cannot use the `virtual` modifier with the `static`,\
    \ `abstract`, `private`, or `override` modifiers.\n\nVirtual properties behave\
