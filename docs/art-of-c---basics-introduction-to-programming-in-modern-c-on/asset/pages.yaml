    ever since.


    C# was originally created based on Java. C# 1.0 was pretty much indistinguishable
    from Java. Now, C# 10.0 is completely different. The idiomatic way of programming
    in C# is very different from that in Java (although Java has been evolving as
    well with some similar updates).


    There is no "modern C#". It is just a play of words. C# is constantly changing.
    There will be a new major release every year.


    If you cannot keep up, then unfortunately C# may not be for you. You do not have
    to retrain yourself, or refresh your programming style or C# knowledge, every
    year. But, with some reasonable lag, you will still have to keep up in order to
    be able to keep using C# productively in the long run. (Note that you do not create
    software by yourself in isolation. You use other people''s libraries, and so forth.)


    If you are just starting to learn C#, then there is no reason not to start with
    the current, most up-to-date, version.


    In fact, it is absolutely recommended to start learning the most recent language
    version. Even if you do not constantly keep up with the ongoing changes in C#,
