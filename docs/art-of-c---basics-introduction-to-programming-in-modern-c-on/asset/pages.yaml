    In the particular example of this lesson, we just needed to override the object.ToString()
    method, which is (supposed to be) semantically readonly.


    In C#, currently (as of versions 9.0 and 10.0), there is no way to explicitly
    declare or indicate that a particular record type is truly immutable (other than
    using the pure positional record type). It is up to the programmer to practice
    safe programming.'
