- pgno: 19
  md: 'into the byte code for the JVM (Java virtual machine), which is then compiled
    into the machine code at run time.


    The C# programs are processed rather similarly to those of Java. They are compiled
    into the Microsoft IL code (intermediate language code) first, and the IL code
    is then run on the common language runtime (CLR). But, a modern C# program can
    also be compiled/packaged into a machine executable.


    The C# programs can be run in a number of different environments or "runtimes".
    .NET is one of the most common runtimes that support the C# programming language.


    In this book, we will mostly use .NET 6. .NET has many different flavors and versions.
    .NET 5 and 6 are, at least in theory, the next generation of .NET that is the
    (eventual) successor of both the .NET Framework (Windows only) and the .NET Core
    (cross-platform) as well as Mono/Xamarin.


    .NET is a cross-platform runtime. You can run .NET 5 and 6 on Linux and Mac as
    well as on Windows. Therefore, C# effectively has the cross-platform support.
    Any programs that you write in C# can run on different operating systems.


    We will mostly use the command line tool, dotnet, in this book to manage and build
    the C# programs. dotnet is also a cross-platform tool. (If you would like to install
    the .NET SDK on your computer, which includes the dotnet CLI, then there is a
    quick note at the end of Lesson 1.)


    The C# compiler can now handle non-nullable references and nullable references
    differently. It was first introduced in version 8.0, under the name "the nullable
    references" (or "the nullable context"), and it is an "opt-in" feature. Although
    it appears to be a small change, it is indeed one of the most significant updates
    in the C#’s 20+ year history.


    We will use this feature throughout this book. It is more than likely that it
    is here to stay. The nullable context will be the future of C#. One thing to note
    is that enabling the nullable context feature can potentially make your programs
    incompatible with'
