  md: '# 11.2. Code Reading - TryFindMax Function


    The method returns a bool value, and its name has a type parameter appended at
    the end. This indicates that TryFindMax<T>() is a generic method. The associated
    type parameter, T by convention, can be used, once declared this way, in the method
    parameter list as well as in the body of the method.


    In general, T can be any type. In certain method definitions, or type definitions,
    however, using an arbitrary type may not make sense. In this particular example,
    the method is supposed to return the biggest value among the elements in a given
    list.


    If a particular type T has no concept of "biggest", or "bigger" more generally,
    then this method will not make sense for such a type. This is where the where
    clause comes in. It is called the "type constraint".


    We are declaring that we are defining the TryFindMax<T> method only for the types
    that implements the interface IComparable<T> from the System namespace, not for
    any type. (Note that we are using using System in virtually every source file
    when we use anything from the System namespace.)


    That is, one cannot use our TryFindMax<T> method with an associated type that
    does not implement System.IComparable<T>.


    System.Int32 (or, int), as well as all other numeric types in C#, happens to implement
    System.IComparable<System.Int32> (or, the corresponding IComparable<T> specializations).
    That is, the values of the int type are "comparable". (We will discuss the interfaces
    in more detail later in the book.)


    Why is this important? This is because the implementation uses the fact that an
    object of that type has a method CompareTo(T) (as defined in IComparable<T>).
    This is a "codification" of the condition, as stated, that the values of the type
    need to be "comparable". Otherwise, the "max" cannot be defined.


    Let''s first take a look at an example which does not use generics. Let''s keep
    using int for simplicity.'
