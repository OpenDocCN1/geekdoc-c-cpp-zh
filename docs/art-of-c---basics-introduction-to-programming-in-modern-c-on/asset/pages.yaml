- pgno: 453
  md: '# Lesson 28. Rubik’s Cube


    # 28.1. Problem


    The Rubik’s Cube was wildly popular when it first came out in the 1970s. It is
    still very popular among the children, and among many enthusiasts and "speedcubers".
    Cf. [Rubik’s Cube](https://en.wikipedia.org/wiki/Rubik%27s_Cube).


    This is a very interesting puzzle. Not very "complex", but it is still very difficult
    to visualize in mind. The space of all possible configurations of the Rubik’s
    Cube has a topology of $3$ dimensional $torus$ [https://en.wikipedia.org/wiki/Torus],
    as we will see shortly.


    Now the question is, how to "represent" the configurations of the Rubik’s cube
    in a program? In particular, in this lesson, we will tackle a problem of "shuffling"
    a cube or randomizing its configurations.


    Each side of the Rubik’s cube can be rotated by 90, 180, and 270 degrees. 180
    and 270 degree rotations can be viewed as two and three 90 degree rotations, respectively.
    It is customary among the Rubik’s cube players, however, that counting 90 degree
    and 270 (-90) degree rotations as two distinct moves. A 180 degree rotation can
    still be viewed as two moves of one of these rotations.


    The Rubik’s Cube has six sides or "faces" (it’s a cube after all), and hence,
    from any given configuration, we can make one of the 12 moves: A 90 degree clockwise
    or counterclockwise rotation for one of the 6 faces.


    Each of the 6 faces is associated with a color, White (W), Blue (B), Red (R),
    Green (G), Orange (O), and Yellow (Y). The white and yellow faces are on the opposite
    sides of the cube. The blue and green faces are on the opposite sides. The red
    and orange faces are on the opposite sides.


    It’s hard to represent a three-dimensional object on a two dimensional surface,
    but the Rubik’s cube can be drawn as follows:'
  merge: -1
  img_proc: true
- pgno: 454
  md: 'If we place the cube on the surface, and if we look down on it from the top,
    then we see the white face, and each of the four sides is G, R, B, and O. The
    yellow face is at the bottom.


    Each of the small piece on the cube faces is called a "tile". There are 54 tiles,
    6 times 9 (3 by 3). There are 6 center tiles, 12 edge tiles, and 8 corner tiles.


    ```

    $$54 = 1\times6 + 2\times12 + 3\times8$$

    ```


    Note that not all tiles are independent. There are, in fact, only 26 independent
    pieces in the Rubik''s cube. 6 center pieces are not movable. 12 edge pieces consists
    of two tiles and hence two colors. 8 corner pieces consists of three tiles of
    three different colors.


    > It might be useful to examine one of those cubes at this point if you happen
    to have one.


    > "Reading" a program is an order of magnitude more difficult than "writing".
    The sample code in this lesson may be difficult for you to read and understand.
    You can skip this lesson if you feel like it is too hard to read. If you would
    like to tackle the final final project, *Rubik''s Cube Challenge*, however, then
    the information from this lesson may turn out to be rather useful.'
