  md: 'Note that improperly implemented synchronization can lead to a situation known
    as a "dead lock". All, or some, threads cannot proceed because they cannot acquire
    a lock, which eventually leads to a situation in which there is no real progress
    in the program execution.


    As stated, if you are not entirely familiar with multi-threaded programming, it
    is best to stick with C#''s async/await features.


