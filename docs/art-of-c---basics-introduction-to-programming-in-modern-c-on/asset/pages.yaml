  md: '# Tip - Learn "Modern C#"


    This book includes a number of "tip" sections. They are more like informal essays,
    and they are not part of the main lessons of the book. These tips can be skipped,
    if you like.


    C++, the grandfather of C#, was created in the mid 1980''s, which was supposed
    to be an "improvement" over the C programming language, as indicated by the ++
    increment operator in the name. C had been around since the early 1970''s.


    The second edition of the book, The C++ Programming Language, by the language
    creator Bjarne Stroustrup, came out in 1991, and C++ started to get more and more
    popular throughout the 1990''s. The "Object Oriented Programming" style was all
    the craze. Everybody wanted to get on the OOP bandwagon.


    During that time, however, there were no compilers that implemented all the features
    that were described in the book. Things were in flux. Compiler tool vendors like
    GNU and Microsoft were slow to catch up. No reliable implementation of the standard
    template library (STL), for instance, was available until the mid/late 1990''s.


    Finally, the then-de-facto-standard C++ was officially standardized as C++98 in
    1998. It was mostly what the second edition of The C++ Programming Language specified
    (in 1990/1991). The language was stable since then, and it appeared that it was
    going to remain that way, just like C had been.


    Then came Java. Then came C#.


    These were the languages directly based on, or influenced by, the C++ programming
    language. And, they were created as the "OOP" languages from the ground up, unlike
    C++, which was an extension of C. These were "modern" languages in various respects,
    compared to the languages like C and C++.


    Throughout 2010''s, and beyond, C++ went through dramatic changes, C++11, C++14,
    C++17, and C++20. We call them the "modern C++" in contrast with C++98. These'
