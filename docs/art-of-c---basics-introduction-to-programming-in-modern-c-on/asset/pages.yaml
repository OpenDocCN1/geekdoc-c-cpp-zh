  md: "\"Interface inheritance\" is not the most commonly used term in this context.\
    \ We more commonly say that a class \"implements\" an interface(s), etc. But,\
    \ as long as we know what we are talking about here, what kind of terms we use\
    \ is not that critical.\n\nThe complexity comes from the fact that C# gives us\
    \ too many options. The choices are blessings and curses at the same time.\n\n\
    When we define an interface, we can optionally provide a default implementation\
    \ for a method or property. When we implement an interface method or property,\
    \ a class can either explicitly or implicitly implement the method or property.\
    \ And so forth.\n\nIn situations like this, we often face what is called the \"\
    combinatorial explosion\".\n\nLet's take a look at some concrete examples. Here's\
    \ a simple interface:\n\narea-calculation/si1/Area.cs (lines 4-10)\n\n```\n```\n\
