  md: 'The System namespace defines a set of delegates, and the delegate Func<T, bool>
    represents a method that takes one parameter of a generic type T and returns a
    Boolean value. In all Func<...> style delegates, the last type is the return type.


    The List<T>.Contains(T item) method returns true if the item is in the list or
