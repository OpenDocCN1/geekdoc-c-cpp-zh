  md: 'algorithms.


    But, one can easily convince oneself that after the first iteration of the outer
    loop (for `i == 0`), the last element is the biggest one (in terms of the distance
    from the pivot in our example) out of all the elements in the given array.


    Through the inner iteration of swapping two consecutive elements (for `j`), we
    do not end up sorting all the elements. But, one thing is guaranteed. Each (potential)
    swap of a pair pushes the bigger element to the right. After going through the
    entire inner loop, from beginning to end, the last element is the biggest.


    Now, in the next iteration of the outer loop (`i == 1`), we do not have to sort
    the entire array. We only have to sort the sub-array (the range of `j` when `i
    == 1`), leaving the last element alone. And, it continues until the sub-array
    consists of only one element, the first element.


    After these nested iterations, we will end up with a completely sorted array.


    > In the "Big O notation", the bubble sort algorithm takes *O(N^2)* time for an
    *N* element array/list. That is, as the number of elements increases in an array,
    the sorting time increases quadratically. Not the most efficient sorting algorithm.


    Just as a side note, this implementation can be slightly improved by keeping track
    of whether the remaining region is already sorted or not. Here''s an example.'
