- pgno: 5
  md: '# # Preface


    Learn C# programming for fun!


    C# is a very interesting programming language. It is indeed *fun* to program in
    the "modern C#". That is, if you know how to *really program in C#*.


    ***The Art of C# - Basics: Introduction to Programming in Modern C# - Beginner
    to Intermediate*** is an attempt to introduce the modern C# to the masses, so
    to speak. This book is written for a broad audience. Whether you are new to programming,
    or whether you have been programming for some time using other languages, you
    will have to learn C# as a new modern language, as of 2022. As of version C# 10.0.


    ***The Art of C# - Basics*** starts from the absolute basics and moves on to more
    advanced topics. The book provides a comprehensive introduction to "the modern
    C#". It is not a language reference. It is not a grammar book. The book does not
    merely teach the language syntax.


    This book teaches the fundamentals of programming in Modern C# and its idiomatic
    uses. Although it is an introductory book, you will gain sufficient knowledge
    and perspective that you can venture into a journey of real programming in C#
    on your own.


    ***The Art of C# - Basics: Introduction to Programming in Modern C#*** teaches
    the important "concepts". But, not necessarily all the details. This book teaches
    you "what", but not necessarily "how" exactly in every situation. The goal of
    the book is to give you a real taste of what the modern C# is, and teach you how
    to get started with professional C# programming. This book will not be the only
    resource in your effort to learn and master programming in C#. But it will be
    an invaluable part.


    *Knowledge is familiarity.*


    Throughout this book, we will introduce certain terms and concepts without precisely
    defining them first and then we will elaborate on them later in the book.'
