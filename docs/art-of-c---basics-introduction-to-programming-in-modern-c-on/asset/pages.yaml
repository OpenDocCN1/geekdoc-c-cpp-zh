  md: 'The record type was first introduced in C# 9.0, and it is now can be used with
    both classes (reference types) and structs (value types) (as of C# 10.0). And,
    depending on what kind of programming you generally do, records can be one of
    the best things that ever happened to the C# programmers.


    One of the worst things in programming is doing the same things again and again.
    For example, we often need to create a number of types that are, in many ways,
    very similar to each other and yet different enough to be a single type. We end
    up with a lot of similar code, much of which may be called the "boilerplate" code.


    C#’s record is one of the efforts to reduce the boilerplate code.


    In general, "less code" is a good thing. Less code means less code to write to
    begin with, less code to read, and less code to maintain.


    Writing less code means that you’ll have more time to do other things. Or, you’ll
    have more time to do more coding. ⋆


