    (The old value of name, e.g., the value originally read from the input, line 4)
    is no longer accessible from the program, after this if/else statement, and it
    can be "garbage-collected". More on this later. One other thing to note is that,
    as stated, certain statements like if/else that use the "blocks" do not end with
    semicolons.)


    Next, a personalized greeting is created using the static method string.Format():


    ```

    var greeting = string.Format("Hello {0}! How are you?", name);

    ```


    This statement is equivalent to the following, using the interpolated string:


    ```

    var greeting = $"Hello {name}! How are you?";

    ```


    The Format() method of System.String takes one or more arguments. The first argument,
    a string, is a format specifier, which includes the placeholders like {0} and
    {1}, etc. These placeholders are replaced by any subsequent arguments, in the
    order, starting from zero {0}.


    In this example, there is only one placeholder and one additional argument. The
    result will be a single string. If name is "JOHN", then greeting will be "Hello
    JOHN! How are you?"'
