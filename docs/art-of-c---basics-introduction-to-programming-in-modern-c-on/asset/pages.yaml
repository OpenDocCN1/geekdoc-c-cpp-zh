- pgno: 333
  md: "An `interface` type can be used anywhere we can use a type, just like a `delegate`.\
    \ In fact, a `delegate` can be conceptually viewed as a special kind of an `interface`\
    \ (that defines a single method).\n\nAn object of a given `interface` type cannot\
    \ be directly instantiated, however. (And, as a corollary, an `interface` cannot\
    \ have constructors.) For that, we need to use a concrete type that \"implements\"\
    \ the given `interface`.\n\nFor example, the type `SPoint` in this lesson implements\
    \ the `interface` `IPoint`. Any object of a type `SPoint` is therefore an object\
    \ of a type `IPoint`.\n\nThe `SPoint` type implements all properties and methods\
    \ declared in `IPoint`, and more. In particular, it includes a public constructor:\n\
    \n```\nSPoint(float x, float y) => (X, Y) = (x, y);\n```\n\nNote that this expression\
    \ body syntax is equivalent to the following:\n\n```\npublic Point(float x, float\
    \ y) {\n    (X, Y) = (x, y);\n}\n```\n\nThis is in turn equivalent to the following:\n\
    \n```\npublic Point(float x, float y) {\n    X = x;\n    Y = y;\n}\n```\n\nAs\
    \ stated, there is no difference among these definitions as far as the compiler\
    \ is concerned. It will generate the same IL code or an executable. It is really\
    \ a matter of an individual's, or a team's, preference as to which style to prefer."
