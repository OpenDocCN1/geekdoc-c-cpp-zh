- pgno: 521
  md: '# In Parameter Modifier (in)


    The in keyword causes arguments to be passed by reference. It makes the formal
    parameter an alias for the argument, which must be a variable. In other words,
    any operation on the parameter is made on the argument. It is like the ref or
    out keywords, except that in arguments cannot be modified by the called method.
    Whereas ref arguments may be modified, out arguments must be modified by the called
    method, and those modifications are observable in the calling context.


    The in modifier is usually unnecessary at the call site. It is only required in
    the method declaration.


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_521_0.png)


    The in keyword can also be used with a generic type parameter to specify that
    the type parameter is contravariant, as part of a foreach statement, or as part
    of a join clause in a LINQ query.


    Variables passed as in arguments must be initialized before being passed in a
    method call. However, the called method may not assign a value or modify the argument.


    The in, ref, and out keywords are not considered part of the method signature
    for the purpose of overload resolution. Therefore, methods cannot be overloaded
    if the only difference is that one method takes a ref or in argument and the other
    takes an out argument.


