    # Type pattern


    When using the type pattern to perform pattern matching, `is` tests whether an
    expression can be converted to a specified type and, if it can be, casts it to
    a variable of that type. It''s a straightforward extension of the `is` statement
    that enables concise type evaluation and conversion. The general form of the `is`
    type pattern is:


    ```

    expr is type varname

    ```


    Where `expr` is an expression that evaluates to an instance of some type, `type`
    is the name of the type to which the result of `expr` is to be converted, and
    `varname` is the object to which the result of `expr` is converted if the `is`
    test is `true`.


    The `is` expression is `true` if `expr` isn''t `null`, and any of the following
    conditions is true:


