    The operator precedence rule determines which parts of an expression get evaluated
    first. For example, 2 + 3 * 4 is evaluated to 2 + (3 * 4), which is 14. This is
    because the multiplication operator (*) has a higher "precedence" than the addition
    operator (+). The explicit use of the parentheses can change the evaluation order.
    For instance, (2 + 3) * 4 is evaluated to 20.


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_122_0.png)


    The unary operators (e.g., - in front of a number) have the highest precedence.
    You can refer to the C# language reference for the complete list of the binary
    operator precedence rules, if necessary. But, you do not have to memorize these
    precedence rules. When in doubt, use the parentheses to make your intentions clear
    (e.g., to the human readers), rather than relying on some (possibly obscure) precedence
    rules.


    Note that multiple binary operators may have the same precedence. In that case,
    operators of the same precedence associate from left to right. For example, 6.0
    / 2.0 * 3.0 is the same as (6.0 / 2.0) * 3.0, which evaluates to 9.0.


    Before we end this lesson, there are a few more things that we will need to review.


    First of all, a C# program is a collection of custom type definitions (other than
    the top-level statement exception). For example, the sample program of this lesson
    included the LeapYear1, LeapYear2, and LeapYear3 classes as well as the IsLeapYear
    delegate.


    As we will see throughout this book, a type can be defined with C# constructs
    like class, struct, record, enum, interface, and delegate.


    Technically speaking, a static class (which cannot be instantiated) does not define
    a type. But, syntactically, it also belongs to these top-level elements that comprise
    a C# program.'
