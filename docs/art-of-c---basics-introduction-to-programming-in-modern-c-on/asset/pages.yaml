  md: '# Author''s Note


    # Don''t Be a Parrot


    It is not uncommon to see a beginning programmer copy code from a book to a computer.
    Or, copy the code found on the Web to his/her computer.


    Often they type the code, not even just copy and paste, and they claim that they
    *learn better* by actually typing.


    There is no evidence for that. If anything, that will be a very inefficient way
    to learn programming. While an imitation is an important part of learning a new
    language, or a new skill, in the spirit of "listen and repeat", mindless imitations
    would not enhance your speaking or writing skills very much.


    The author made a conscious decision not to release the sample code of this book.
    For one thing, it has little value. But, there are other reasons as well. In his
    opinion, the downloadable code samples do more harm than good.


    Often the learning students download a code sample and run it on their computers.
    And, they think that that''s the end of it. *It works. Now, let''s move on.*


    In doing so, however, they have learned very little. On the contrary, they only
    ended up with the false sense that they were able to "write" the same code because
    they compiled the code and ran it. Or, because they even "typed" the code.


    Obviously, they did not *write* the code.


    Although the author has asserted that this book is "for reading", if you are inclined
    to try out some sample code in this book, then here''s a suggestion.


    +   1. Learn the main points of the lesson.'
