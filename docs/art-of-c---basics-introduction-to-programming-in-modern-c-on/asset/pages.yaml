- pgno: 6
  md: 'You do not have to learn, understand, or memorize, everything on your first
    encounter. This book teaches programming in C# *through repetitions*. Readers
    are encouraged to read the book through, from beginning to end, or at least the
    first two parts, without interruption. The details are not as important as you
    might think.


    There are a lot of programming "technicians". I hope that the readers of this
    book strive to become "artists". The artists in programming.


    Good luck!


    Revision 2.0.0, 2021-12-26'
