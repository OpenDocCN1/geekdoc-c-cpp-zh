  md: "One thing to note here is that when we check the emptiness of the `list` argument,\
    \ we do not check its “nullness”. In fact, traditionally, we should have done\
    \ something like this:\n\n```\nif (list is null || list.Count == 0) {\n    //\
    \ Throw an error or return.\n}\n// Use list here.\n```\n\nThe boolean expression\
    \ in the `if` statement does “short circuiting”. If `list` is `null` (which is\
    \ equivalent to `list == null`), then regardless of the value of the second operand\
    \ of the OR (||) operator, the overall value is true, and hence the expression\
    \ `list.Count == 0` is not evaluated, preventing the null reference exception.\n\
    \nIn our sample, however, since we are using the enabled nullable context, the\
    \ `list` argument of type `IList<int>` is guaranteed to be non-null. Hence, the\
    \ null check is not needed. A nullable `int` list type would have been denoted\
    \ as `IList<int?>`, with the question mark `?`.\n\nThe algorithm of finding the\
    \ largest value in a list of `int` values is straightforward.\n\nWe start from\
    \ the first element, and go through all the elements. Every time we see a value\
    \ bigger than the maximum of the values that we have seen so far, we replace the\
    \ current max with that value.\n\nAfter having gone through the entire list, the\
    \ current max is *the max* among all the elements in the list.\n\nIn the non-generic\
    \ version, `TryFindMaxInt()`, we use the comparison `v > max`. The expression\
    \ `v > max` is equivalent to `v.CompareTo(max) > 0` for types like the numeric\
    \ types for which the greater-than (>) operator is defined.\n\nThe non-generic\
    \ method `TryFindMaxInt()` is pretty much equivalent to what the compiler would\
    \ have generated from `TryFindMax<T>()` when `T` is `int`."
