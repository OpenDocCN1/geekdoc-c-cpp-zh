- pgno: 74
  md: '# ## Tip - Nullable Context


    A reference variable, or a variable of a reference type, can be `null`. The null
    value simply means that the variable points to nothing. That it points to no real
    data in memory. The default value of a reference variable is `null`.


    (If you don’t know what a "reference" is, you can ignore this section. We will
    discuss this throughout this book.)


    This is true across all different C-style programming languages which support
    the reference types or pointer types. Unfortunately, accessing these variables
    when they are `null` has been the cause of so many (potentially preventable) errors,
    or program "bugs". They are called the null-pointer exceptions or null reference
    exceptions, or the NPEs for short.


    One possible solution is to check if a variable is `null` before using the variable.
    In practice, however, this solution is not always feasible, especially for large
    scale software projects. Checking "null-ness" of every reference variable every
    time we use it will add substantial overhead in terms of development time and
    runtime cost. It will also add not-so-insignificant amount of clutter to the source
    code.


    C# now has a compile time support (since 8.0) to address this problem. C#, and
    other languages like Typescript, are "waging war against the null pointer exceptions".
    The goal is to completely eradicate the NPEs. ⊙


    This new feature of C# is called the "nullable context". It is by default disabled.
    A missing nullable context specification means that its value is `disable`. This
    means that all reference variables are nullable, as they always have been.


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_74_0.png)


    > There are other possible values for the `nullable context` flag. But, we will
    not discuss them in this book. We will primarily, in fact exclusively, use the
    `enable` value.


    Now, if you enable this feature, interesting things happen. We will discuss how
    to'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'enable it shortly, but for now let''s see what enabling the nullable context
    means.


    In any code that is within the enabled nullable context, the traditional (nullable)
    reference variables become non-nullable. Setting `null` values to these variables
    will cause the compile time errors. (That is, you cannot even build the program.
    The compiler won''t let you. Note that you cannot have runtime errors from your
    program unless you can build and run the program first. \U0001f642)


    In addition, one can use a new kind of reference types within the enabled nullable
    context. They are called the "nullable reference types". The naming is obviously
    confusing since all reference types are nullable in the default/traditional C#
    as well as in all other similar languages that support the pointer/reference types.


    But, note that, within the enabled nullable context in C#, the (normal) reference
    types are non-nullable. Hence, it seems appropriate to use this name for this
    "new" kind of reference types. The names make sense only in a particular context.


    All nullable reference variables (or, the variables of nullable reference types)
    should be checked for nullability before using them. Otherwise, the compiler will
    throw the compile errors or warnings (unless the compiler knows for sure that
    they cannot be null, e.g., through static analysis).


    In theory, by doing this, we can eliminate all potential (run-time) null reference
    exceptions. Variables of non-nullable reference types cannot be null, and hence
    there is no possibilities of NPEs. For nullable reference variables, you are forced
    to check the nullability and do the right thing based on their null check. Otherwise,
    the compiler will stop you. Hence, again, you cannot have NPEs.


    In practice, however, even this solution is not perfect. First of all, the compiler
    support is not perfect. There are a number of different scenarios where the compiler
    cannot help you much. Refer to the C# official doc if you are interested. But,
    more importantly, it is not always easy to tell if a certain variable is guaranteed
    to be non null. Programs have many interconnected components, one component calls/uses
    another, etc., and they evolve over time, often maintained by different developers
    or even different teams.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Another complexity comes from the way the C# grammar was written in the first
    place. It was originally assumed that all reference variables were potentially
    nullable.


    For example, one will have to use certain "nullable attributes" when calling a
    function with a reference type argument, sometimes *before* and *after*. That
    is well beyond the scope of this book, however.


    When in doubt, you should fall back to the old behavior. Assume that a reference
    variable can be null unless you are absolutely sure that it cannot be null. Clearly,
    using nullable reference variables for *all* reference variables (within the enabled
    nullable context) beats the purpose. Some efforts will need to be made to reduce
    the number of nullable reference variables.


    Despite all these issues, we will use the enabled nullable context in this book,
    across all the examples. As stated, this could be the way we program in C#, in
    the not-so-distant future.


    The best approach is to start using the enabled nullable context but use primarily
    nullable reference variables just as you have been, and to gradually decrease
    the use of the nullable reference variables, over time, as just stated.


    > The nullable context is relevant only to the reference variables, in certain
    situations. Even though we use the enabled nullable context in all the examples
    in this book, it may not always be relevant, or even apparent. And, in many cases,
    it is not really visible because we cannot see what is not there. The sample code
    in this book mostly lack the (rather common, in fact ubiquitous) null check if
    statements.


    You can enable the nullable context using the C# compile time directives. To enable,
    put this is in your source code file:


    ```

    #nullable enable

    ```'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'To disable, use this:


    ```

    #nullable disable

    ```


    These directives are in effect until the end of the source file, or until the
    next #nullable directive is used, if any. You can also restore the previous context
    value using the following directive:


    ```

    #nullable restore

    ```


    > We will not discuss C#’s compile directives in this book other than #nullable.


    In theory, the nullable context can be enabled or disabled (or, set to other options)
    on a line-by-line basis. In practice, however, that kind of uses will be limited
    since variables are block-scoped in C#.


    If you use the dotnet command line tool, or Visual Studio, then you can also globally
    enable or disable the nullable context per "project". For example, in a project
    XML file, you can set the "Nullable" property.


    ```

    <PropertyGroup>

    <OutputType>Exe</OutputType>

    <TargetFramework>net6.0</TargetFramework>

    <Nullable>enable</Nullable>

    </PropertyGroup>

    ```


    In fact, if you use the new dotnet CLI version 6.0 or later, then all scaffolded
    C# projects will have the nullable context enabled by default. The compile time
    directives can be used to overwrite the default project-level settings.


    We will discuss the details of the nullable and non-nullable reference types,
    in the'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'enabled nullable context, throughout this book.


    The nullable context is purely a compile time support. Regardless of the specific
    context used, the C# program will end up with the same IL code (that is, if the
    C# compiler lets you compile it). The .NET 5/6 runtime does not know anything
    about the nullable context, and as far as it is concerned, all reference variables
    are nullable.'
  merge: -1
