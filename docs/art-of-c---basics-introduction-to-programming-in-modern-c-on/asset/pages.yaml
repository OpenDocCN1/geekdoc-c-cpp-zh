  md: '# # Lesson 25. Shuffle Play


    # ## 25.1. Problem


    The music "playlist" is one of the best ways to listen to music nowadays. All
    big music streaming services like Spotify and Apple Music support both public
    and private playlists.


    Playlists are generally ordered (e.g., from top to bottom), and they can be played
    in the preset order. Alternatively, they can be also played in a random order,
    known as the "shuffle play".


    Let''s suppose that we have a list of songs, or a playlist. Implement an algorithm
    that shuffles the songs in a random order.


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_411_0.png)'
