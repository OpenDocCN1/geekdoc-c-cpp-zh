  md: '# 19.3. Pair Programming - Data Types, switch Expressions, Init-Only Properties


    record is a special kind of class that follows the value equality semantics by
    default.


    We demonstrate the behaviors of Equals() or == with three different types based
    on class, struct, record, and record struct.


    In the Main() method of SNumer al, we create three values, r1, r2, and r3, and
    compare their values.


    If you run the program, as follows,


    ```

    dotnet build -t:Rebuild -p:StartupObject=Roman.SNumeral

    dotnet run

    ```


    Here''s a sample output.


    ```

    $ dotnet run


    r1 = MCCXXXIV

    r2 = MMXXII

    r3 = MMXXII


    r1 != r2

    r2 == r3

    ```


    r1 is not the same as r2, and r2 is the same as r3, as expected.


    Although r2 and r3 are created differently, and they are distinct variables, their
    values are the same, and they are equal to each other.


    In the SNumer al struct, we do override Equals(), operator ==(), and operator
    !=(). But, that is just for convenience so that we can use the r2 == r3 syntax.
    If we do not override these methods and just use r2.Equals(r3), then we will still
    get the same result.'
