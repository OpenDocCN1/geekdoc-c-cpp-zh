    # 10.2.2. Grammar


    "Hashing", broadly speaking, is a one way function. Given a value or data, you
    can compute its hash value. But, given its hash value, you cannot reconstruct
    the original data.


    Hashing is used in many applications. One of the simplest use cases is to use
    it as a data "checksum" to verify the integrity of the data.


    Without having to compare every byte in a given data set (e.g., file content),
    we can just compare the hash values, e.g., before and after the transmission over
    the Internet, and check whether the data has been corrupted or otherwise tampered
    with.


    The "MD5" is one of the simplest and most commonly used hashing methods. .NET
    includes a support for MD5 as well as for many other algorithms. For example,
    refer to the dotnet doc, MD5 Class [https://docs.microsoft.com/en-us/dotnet/api/system.security.cryptography.md5],
    for more information.'
