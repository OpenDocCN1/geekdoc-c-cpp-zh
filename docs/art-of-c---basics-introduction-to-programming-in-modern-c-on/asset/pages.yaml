  md: '# ## Tip - So, What is OOP?


    In the beginning of this part, we stated that the importance of the OOP style
    has been diminishing, in general, and in the "modern C#", in particular.


    Still, OOP is one of the most important component of C#. When you develop games
    in Unity, for example, you will use the OOP. When you program Web services using
    ASP.NET, for instance, you will use the OOP. When you do Windows programming using
    the Win32 API, for instance, you will use the OOP. The OOP is everywhere as long
    as you program in C#.


    Hence, it is of paramount importance for you to understand the basic concepts
    of OOP. The details are less important.


    > You can skip this section if you are familiar with the OOP style from other
    languages like Java or C++. If you know how to, and what it means to, "override"
    a "virtual method", for example, then you are all set. ◎


    So, what exactly is the "object oriented programming style"? Before we discuss
    what it is, let''s look at the problems that OOP is trying to solve.


    When a software grows, its complexity increases super-linearly. It is hard to
    quantify, but in general, we can assume that it grows, or it can possibly grow,
    exponentially.


    Let''s suppose that you have a system with N components (anything) and they are
    all connected to each other, not just between the pairs, but between the triplets,
    ... and among all of them. The number of connections grows as 2^N. In the worst
    case, the "complexity" (regardless of how we exactly define it) can potentially
    grow exponentially with the number of its constituent components.


    In theory, one can write such bad software that they could behave like this. In
    practice, nobody can possibly write such bad software. ◎ But, the problem was,
    in'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'the early days, that there was no way to manage this kind of complexity, at
    least as long as we used the imperative programming style.


    For example, although we do not use this term very much these days, the "global
    variable" was considered evil. A global variable can be accessed by anyone (in
    the program), and it can be changed by anyone. Think about the exponential complexity.
    As the program grows, it will get harder and harder to understand the program.
    Because, essentially, everything is connected to everything.


    But, there was no way to prevent this, for instance, in the programs written in
    the C programming language. We had to rely on the programmers'' competence, which
    did not always work out. ⊙


    One way to manage this kind of complexity is to use "components" or "modules",
    broadly speaking. We mentioned this in the software stack metaphor earlier. By
    "compartmentalizing" big software into smaller constituent components, and managing
    their "connections", we can reduce the run-away complexity problem. That is the
    idea.


    C# supports, broadly speaking, this kind of component style programming. Whether
    we view an assembly as a component or a custom type as a component is not that
    important in our discussion. In theory, one can imagine a hierarchy of different
    kinds of components in more than one or two levels.


    The object oriented programming is, in some sense, a special kind of the component
    based, or modular, programming style. In the OOP, there is a concept of an "object"
    (an abstract concept, not necessarily the same as an `System.Object` object of
    C# and .NET). And the object knows how to manage itself. It hides all its "complexities"
    (again, we are just using these terms without precisely defining them), and it
    exposes only what is needed by the "outside world".


    Anybody who interacts with an object need not know anything about its internal
    complexities, e.g., how it implements a certain function, or what kind of data
    it holds, etc. That is the object''s job.'
