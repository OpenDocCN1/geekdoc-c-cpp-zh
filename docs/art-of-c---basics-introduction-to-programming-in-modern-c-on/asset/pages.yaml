    The `JsonPayload` property is initialized with an object of an "anonyous type".


    In C#, you can create a (concrete) type using `struct`, `class`, or `record`.
    Then you can create an object of that type using `new` constructors or initializers.


    There is another way. You can just create an object without explicitly specifying
    a particular type. The object is then given a specific type based on the initial
    value, but the type does not have a name. Hence, it is called an anonymous type.


    It is really a one-off, one of a kind, type whose sole purpose is to give a type
    to the object that is being created without being given an explicit type.


    Note the syntax. It is somewhat similar to the (typed) object initializer starting
    with `new`, but the type name is missing.


    Anonymous types are more commonly used for local variables, which are declared
    with `var` because we do not have to specify an explicit type when we use the
    `var` declaration.


    In this example, the usage is somewhat unusual, but it serves our purpose. We
    can set `JsonPayload` to a value of any type, including anonymous types.


    > Note that the values of anonymous types are "pure data" objects. Anonymous types
    cannot include methods or implement interfaces, etc.


