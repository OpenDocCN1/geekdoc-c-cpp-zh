  md: 'earlier in the book.


    The .NET standard library includes a number of predefined (generic) delegates.
    `Func<HttpListenerContext, Task>` is a delegate type that takes one argument of
    type `HttpListenerContext` and returns a value of a type `Task`.


    As we will see shortly, `Task` is the fundamental building block of async, or
    asynchronous, programming in C#.


    The `handlers` field stores pairs of "routes" and their "handler". In this sample
    code, the route "/" is mapped to the `Server`''s instance method `ProcessTextResponse()`,
    and the route "/json/" is mapped to another method, `ProcessJsonResponse()`.


    The `Listener.StartAsync()` static method takes these two values as arguments
    and sets up an `HttpListener` object to handle the requests targeted to the routes.
    `HttpListener` is an `IDisposable` and we use the `using` statement. An `HttpListener`
    can be used to serve multiple routes, and the "prefixes" is a collection (of strings).


    Once the prefixes are set, we can "start" the `HttpListener` instance by calling
    the `Start()` method.


    Then we process the requests through the `while (true)` infinite loop.


    In the loop, we first get an `HttpListenerContext` object by calling `await listener.GetContextAsync()`
    and next call the handler delegate with that context object, `await handler(context)`.


    Note that `GetContextAsync()` is an async method and it has the suffix `Async`
    in the method name. It is a convention to use the "Async" suffix when there is
    a corresponding synchronous version of the method exists. For example, the `HttpListener`
    class has a (synchronous) method `GetContext()`. Hence the async version is named
    `GetContextAsync()`.


    In some cases, we just use the "Async" suffix for any async method, but that is
    really a matter of style or preference.'
