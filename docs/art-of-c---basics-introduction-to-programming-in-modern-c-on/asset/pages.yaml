  md: 'We use many terms without precise definitions in this book, but the word "data"
    often means the data that can be, for example, transmitted between two entities,
    or can be stored as numbers or strings, etc.


    A door lock is not "data". Roughly speaking. Regardless, a smart door lock is
    primarily about the "behavior" not the "data".


    The appropriate construct to use to encapsulate an object like a smart door lock
    is therefore `class`. We `can` use `struct` or `record` to define a smart door
    lock type, but their value semantics or data semantics may not be very useful
    for door locks.


    The rule of thumb is to just use `class` unless the abstract concept, a thing,
    that we are trying to encapsulate as a type is primarily a "value" or "data".


