    ```\n```\n\n# sort-numbers/Bubble.cs\n\n```\n```csharp\nnamespace Example;\n\n\
    static class Bubble {\n    internal static void Sort<T>(IList<T> arr, T pivot)\
    \ where T :\n        IEquatable<T>, IComparable<T> {\n        for (var i = 0;\
    \ i < arr.Count - 1; i++) {\n            for (var j = 0; j < arr.Count - i - 1;\
    \ j++) {\n                if (Compare(arr[j], arr[j + 1], pivot) > 0) {\n    \
    \                (arr[j], arr[j + 1]) = (arr[j + 1], arr[j]);\n              \
    \  }\n            }\n        }\n    }\n\n    private static int Compare<T>(T l,\
    \ T r, T pivot) where T :\n        IEquatable<T>, IComparable<T> {\n        var\
    \ (dl, dr) = (Distance(l, pivot), Distance(r, pivot));\n        return dl.Equals(dr)\
    \ ? 0 : (dl.CompareTo(dr) > 0 ? 1 : -1);\n    }\n```\n```"
