  md: '# 13.2. Code Reading - Generic Bubble Sort


    In addition, `Compare<T>()` uses the custom `Distance<T>()` method, which is essentially
    a generalization of `Math.Abs()`. The implementation of the `Distance<T>()` method
    uses another helper method, `Subtract<T>()`. This is where the "magic" happens.
    `Subtract<T>(T l, T r)` computes the different between two given argument values,
    `l` and `r`, using the – operator.


    As indicated, not all types (even those that implement `IEquatable<T>` and `IComparable<T>`)
    support the binary subtraction operation. All numeric types support the minus
    operation. As we will see later in the book, one can define an implementation
    for the minus – operator for the custom types (known as the "operator overloading"),
    and those types can be used with our `Sort<T>()` method.


    The implementation of `Subtract<T>()` seems quite complicated. Let’s break it
    down.


    First, the `notnull` constraint requires the type `T` should be non-nullable.
    This is fine in our case because our primary uses will be for numeric types and,
    possibly, for other custom values types (which cannot be null).


    Then, the method uses the "expression body". That is, it is one large expression.
    As stated, whether ones uses an expression body or a block body is a matter of
    taste and preference in most cases.


    C# has an interesting feature called the "switch expression". This is not to be
    confused with the traditional "switch statement", which is found in virtually
    all C-style languages. The `switch` expression feature of C# is "borrowed" from
    the functional style programming languages. It uses "pattern matching", which
    is also a concept from the functional programming.


    A general syntax is like this:'
