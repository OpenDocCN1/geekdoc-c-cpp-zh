  md: 'Historically, generics came to C# first, and the type constraint feature was
    later introduced into the existing generics framework. The name "type constraint"
    implies that it is something that is added to "constrain" or "limit" other things.
    This is not, however, how it really works in the modern C#. The type constraints
    are the integral part of generics. The old generics without the type constraints
    are merely the special cases.


    ![](img/25af69ec45b3c0b589a8dccd0c2a88be_188_0.png)


    That is why we introduce the "full generics" first (with the type constraints)
