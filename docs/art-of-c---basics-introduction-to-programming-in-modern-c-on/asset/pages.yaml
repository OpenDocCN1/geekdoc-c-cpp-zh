  md: '# # Appendix A: C# Keywords


    # ## C# Language Keywords


    **abstract**


    The `abstract` modifier can be used with classes and records, and member methods
    and properties to indicate that the implementation is missing or incomplete.


    **as**


    The `as` operator is used to perform conversions between compatible reference
    types. It evaluates to `null` if conversion fails.


    **async**


    The `async` modifier is used to specify that a method, lambda expression, or anonymous
    method is asynchronous.


    **await**


    The `await` operator suspends evaluation of the enclosing `async` method until
    the asynchronous operation represented by its operand completes.


    **base**


    The `base` keyword is used to access members of the base class from within a derived
    class or record.


    **break**


    The `break` statement terminates the closest enclosing loop or switch statement
    in which it appears.


    **case**


    The `switch` statement is a control statement that handles multiple selections
    by passing control to one of the case statements within its body.'
  merge: -1
