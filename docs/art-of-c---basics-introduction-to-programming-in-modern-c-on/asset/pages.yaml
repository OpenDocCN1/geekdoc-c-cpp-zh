    an array are stored in the consecutive memory space. The array type is generally
    the most efficient collection data structure (although it may not be the most
    flexible one).


    One of the most powerful aspects of programming is that a single program can behave
    differently at run time, e.g., based on the user input or other conditions. The
    `if` statement is used to execute different pieces of the code depending on the
    runtime conditions. We will learn the `if` statement in more detail later in the
    book.'
  merge: -1
