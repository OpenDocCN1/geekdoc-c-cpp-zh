- pgno: 402
  md: 'In the sample code, we use `Run()` for one `async` method, and `StartAsync()`
    for another. Names are not that important as long as one follows the broad general
    conventions.


    In general, `async` methods need to be called with `await`.


    Any `async` method in C# returns, by definition, a type `Task` or `Task<T>` (for
    a particular type T). Methods that do not return any of these types are not `async`
    methods.


    The `Task` (or, `Task<T>`) is very similar to "promises" or "futures" in other
    programming languages.


    A synchronous, or blocking, method call does not return until the method completes
    its work. During that time, the caller cannot do anything else but wait. This
    can cause many issues such as non-responsiveness of UI, or under-utilization of
    the computer resources, etc.


    An `async`, or non-blocking, method call, in contrast, returns immediately. It
    returns a `Task` object (`Task` or `Task<T>` for a type T), and it continues its
    work in a different thread.


    The caller can check the status or the result of the `async` method call through
    the returned `Task` object.


    But, the more common pattern is for the caller to `await` until the `async` method
    completes. But, unlike in the case of the synchronous calls, `await` does not
    block the current thread, which is the primary benefit of using the `async` methods.


    C# is a procedural language at its core. Statements are supposed to run in a certain
    order. In general, a statement cannot, or should not, start before the previous
    one completes.


    In the sample code, for instance,'
