    # 13.2.2. Grammar


    The C# programming language supports an extremely powerful generics. In fact,
    its big brother C++, which first introduced generics/templates to the main stream
    programming some 30 years ago, now follows C# in various respects when it comes
    to the features of generics.


    > Incidentally, the C++20 standard includes a lot of powerful new features, including
    "concepts". If you haven''t used C++ in a while, or if you have never programmed
    in C++, then it is highly recommended to take a new/fresh look at the "modern
    C++".


    Despite all the advanced features in generics, however, the current design of
    C# generics has some limitations.


    For instance, there is currently no way to create a generic method or class that
    can be used as a template across all different numeric types. Or for the types
    that support certain primitive operations such as the addition or the multiplication.


    Although it is not a big limitation by itself, because of the fact that numeric
    types and primitive operations are such a crucial part of programming, you will
    sometimes feel limited even with the C#''s advanced generics support.


    For instance, there are almost a dozen numeric types in C#. You do not want to
    implement the same method for each numeric type (without using generics). That
    is the whole point of using the generic templates in the first place.


    This is not limited to the number types. In general, there is no general way to
    specify a group of types that you have no control over, e.g., the builtin types,
    or the types from other third party libraries, etc. For the types that you have
    defined, you can always use the interface type constraints, among other things.'
