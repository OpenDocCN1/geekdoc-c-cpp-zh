- pgno: 21
  md: '# ## Notes on C# 10.0


    This book was completely revised after the release of C# 10.0, in the late 2021
    and early 2022. Although the C# changes were relatively minor, there were still
    a few parts in the book that required some substantial updates.


    Most notably, C# 10.0 introduced another way to create a custom type, namely,
    `record struct`. This is essentially a combination of the C# 9.0 record (which
    can now be alternatively declared as `record class`) and the struct.


    Another major change is that C# now allows overriding the parameterless default
    constructor of the struct type. This can have some far-reaching implications depending
    on how you have been using structs.


    Furthermore, C# 10.0 also includes the features known as the "global using", "implicit
    usings", and "file-scoped namespace" declarations. They are mostly "cosmetic",
    but they can change the general look of any C# code (along with the C# 9.0 top-level
    statement feature). And hence they are really significant changes.


    We will discuss these features throughout this revised edition.


    # # Final Remarks


    Regarding the sample programs, one thing to note is that we do not include comments
    in the code. Comments will mostly add clutter in books like this. The content
    of the book serves as code comments. And, more. In practice, writing good comments,
    and documentations, is a very important skill to learn.


    All exercises are "optional" in that the lessons in the book mostly focus on the
    "code reading", and not writing. The exercises may also require knowledge on some
    subjects that we do not thoroughly cover in this book.


    As stated, C# may not be the easiest language to learn. It has a lot of "features".
    There are many different ways to use C# for the same task. It will take time and
    effort to become really proficient in the modern C#. Hope you find this book helpful'
