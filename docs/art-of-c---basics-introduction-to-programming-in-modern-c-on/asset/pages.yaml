  md: 'C# supports the C++/Java style comments. `/* ... */` is a multi-line comment.
    Anything between `/*` and `*/` is ignored by the compiler. `// ...` is a single
    line comment. Anything after `//` in the same line is ignored.


    Although we call `/* ... */` the multi-line comment, by convention, it is more
    versatile. You can comment out one line, or you can even comment out a part of
    a line, using this syntax. In general, however, most programmers prefer the “single
    line comment” syntax in most cases. And they use it for multi-line commenting
    as well. Just use `//` in front of every line that needs to be a comment. The
    “names” can be deceiving. 😊


    Lines 34 and 35 demonstrate the bitwise AND and bitwise OR operations, respectively.
    In the bitwise AND or OR operations, the corresponding bits of the two numbers,
    or bytes, are operated on independently of the other bits (hence the name “bitwise
    operations”).


    1 `&` 1 results in 1. Likewise, 1 `&` 0 is 0, 0 `&` 1 is 0, and 0 `&` 0 is 0.
    Also, 1 `|` 1 is 1, 1 `|` 0 is 1, 0 `|` 1 is 1, and 0 `|` 0 is 0.


    The statement of line 36 demonstrates the (left) bit-shift operation. It shifts
    each bit of the given byte (the first operand) to the left by the second operand.
    That is, `0b_1110_0010 << 1` becomes `0b_1100_0100`. Note that it does not “wrap
    around”. Rather, it fills the right-most positions with zeros.


    The same holds true with the right bit-shift operator `>>`. It just moves all
    bits to the right (with no wrapping).


