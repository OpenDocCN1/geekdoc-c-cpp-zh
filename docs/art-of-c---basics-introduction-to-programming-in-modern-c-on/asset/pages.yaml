- pgno: 245
  md: '# ## Comments


    C# comments are largely ignored by the compiler tools. You can use single line
    comments with `//` or multiline comments with `/* */`.


    # ## C# Built-In Types


    # ### String


    `string` is a builtin type in C#. A string literal, like "Hello World!", can be
    assigned to a variable of the `string` type. Sting can be manipulated, or formatted,
    using the string interpolation expression, or using the `string.Format()` static
    method, among other things.


    The `@` character in the front of a string literal indicates that the string is
    to be interpreted verbatim.


    # ### Char


    `char` is a struct type that represents a Unicode UTF-16 character. The `string`
    type represents text as a sequence of `char` values.


    # ### Primitive Numeric Types


    C#, and .NET, supports a number of different integer and floating types. Integer
    literals can be represented in base 2, base 8, base 16 as well as in base 10.


    # ### Boolean Type


    `bool` is a value type that represents a Boolean value, either `true` or `false`.
    To perform logical operations with values of the `bool` type, we use Boolean logical
    operators. The default value of the `bool` type is `false`.'
