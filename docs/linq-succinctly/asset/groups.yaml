- md: "\nSugar\nEgg\nMilk\n\nNote this is exactly the same as the input sequence.\n\
    \nThe following code shows the second mode of operation where the input sequence\
    \ contains zero elements.\n\n```\nIngredient[] ingredients = {};\nIEnumerable<Ingredient>\
    \ query = ingredients.DefaultEmpty();\nforeach (Ingredient item in query)\n{\n\
    \    Console.WriteLine(item == null);\n}\n```\n\nThis produces the output:\n\n\
    True\n\nNotice here that the input sequence was empty, but the output sequence\
    \ contains a single null element, a null being the default value for Ingredient\
    \ (which is a reference type).\n\n## Query expression usage\n\nThere is no keyword\
    \ for DefaultEmpty when using the query expression style; however, mixed style\
    \ can be used.\n\n## Generation Operators\n\nThe generation query operators create\
    \ sequences for us.\n\nThe generation operators differ from the majority of the\
    \ other standard query operators in two main ways. The first is that they do not\
    \ take an input sequence; the second is that they are not implemented as extension\
    \ methods, but rather as static methods of the Enumerable classes.\n\nFor an example,\
    \ the following code shows the signature of the Empty query operator.\n\n```\n\
    public static IEnumerable<TResult> Empty<TResult>()\n```\n\n## Empty\n\nThe Empty\
    \ query operator creates an empty sequence (zero elements) of a specified type.\n\
    \nThe following code shows the creation of empty sequence of **Ingredient**. Notice\
    \ that the type of the empty sequence we want is specified as a generic type parameter\
    \ of the **Empty** method.\n\n```\nIEnumerable<Ingredient> ingredients = Enumerable.Empty<Ingredient>();\n\
    \nConsole.WriteLine(ingredients.Count());\n```\n\nThis produces the following\
    \ output:\n\n0\n\n## Query expression usage\n\nThere is no keyword for Empty when\
    \ using the query expression style; however, mixed style can be used.\n\n## Range\n\
    \nThe Range query operator creates a sequence of integer values. When using Range,\
    \ the first parameter specified is the starting number of the range to be generated.\
    \ The second parameter is the total number of elements to generate, starting at\
    \ the first parameter value.\n\n```\nIEnumerable<int> fiveToTen = Enumerable.Range(5,\
    \ 6);\nforeach (int num in fiveToTen)\n{\n    Console.WriteLine(num);\n}\n```\n\
    \nThis produces the following output:\n\n5\n6\n7\n8\n9\n10\n\nNotice that a total\
    \ of six elements have been generated, as specified by the second parameter in\
    \ the call to Range.\n\n## Query expression usage\n\nThere is no keyword for Range\
    \ when using the query expression style; however, mixed style can be used.\n\n\
    ## Repeat\n\nThe Repeat query operator repeats a specified integer a specified\
    \ number of times, as the following code shows.\n\n```\nIEnumerable<int> nums\
    \ = Enumerable.Repeat(42, 5);\nforeach (int num in nums)\n{\n  Console.WriteLine(num);\n\
    }\n```\n\nThis produces the following output:\n\n42\n42\n42\n42\n42\n\n## Query\
    \ expression usage\n\nThere is no keyword for Repeat when using the query expression\
    \ style; however, mixed style can be used.\n\n## Quantifier Operators\n\nThe Contains\
    \ query operator evaluates the elements in the input sequence and returns true\
    \ if a specified value exists.\n\n```\nint[] nums = {1, 2, 3};\nbool isTwoThere\
    \ = nums.Contains(2);\nbool isFiveThere = nums.Contains(5);\n\nConsole.WriteLine(isTwoThere);\n\
    Console.WriteLine(isFiveThere);\n```\n\n## Contains\n\nThis produces the following\
    \ output:\n\nTrue\nFalse\n\n## Query expression usage\n\nThere is no keyword for\
    \ Contains when using the query expression style; however, mixed style can be\
    \ used.\n\n## Any\n\nThere are two overloads of the Any operator. The first version\
    \ simply returns true if the input sequence contains at least one element. The\
    \ second version of Any takes a predicate as parameter and returns true if at\
    \ least one element in the input sequence satisfies the predicate.\n\nThe following\
    \ code demonstrates the simple version of Any.\n\n```\nint[] nums = { 1, 2, 3\
    \ };\nIEnumerable<int> nNums = Enumerable.Empty<int>();\nConsole.WriteLine( nums.Any()\
    \ );\nConsole.WriteLine( nNums.Any() );\n```\n\nThis produces the following output:\n\
    \nTrue\nFalse\n\nThe following code shows the predicate overload of Any to determine\
    \ if a sequence contains any even numbers.\n\n```\nint[] nums = { 1, 2, 3 };\n\
    bool areAnyEvenNumbers = nums.Any(x => x % 2 == 0);\nConsole.WriteLine(areAnyEvenNumbers);\n\
    ```\n\nThis produces the following output:\n\nTrue\n\n## Query expression usage\n\
    \nThere is no keyword for Any when using the query expression style; however,\
    \ mixed style can be used.\n\n## All\n\nThe All query operator takes a predicate\
    \ and evaluates the elements in the input sequence to determine if every element\
    \ satisfies this predicate.\n\nThe following code checks that a sequence of ingredients\
    \ constitutes a low-fat recipe.\n\n```\nIngredient[] ingredients =\n{\nnew Ingredient\
    \ {Name = \"Sugar\", Calories = 500},\nnew Ingredient {Name = \"Egg\", Calories\
    \ = 100},\nnew Ingredient {Name = \"Milk\", Calories = 150},\nnew Ingredient {Name\
    \ = \"Flour\", Calories = 50},\nnew Ingredient {Name = \"Butter\", Calories =\
    \ 400}\n};\n\nbool isLowFatRecipe = ingredients.All(x => x.Calories < 200);\n\n\
    Console.WriteLine(isLowFatRecipe);\n```\n\nThis produces the following output:\n\
    \nFalse\n\n> Note: As soon as an element is found that does not satisfy the predicate,\
    \ All() returns false and does not examine any subsequent elements.\n\n## Query\
    \ expression usage\n\nThere is no keyword for All when using the query expression\
    \ style; however, mixed style can be used.\n\n## SequenceEqual\n\nThe SequenceEqual\
    \ query operator compares two sequences to see if they both have exactly the elements\
    \ in the same order.\n\nThe following code compares two identical sequences:\n\
    \n```\nIEnumerable<int> sequence1 = new[] { 1, 2, 3 };\nIEnumerable<int> sequence2\
    \ = new[] { 1, 2, 3 };\n\nbool isSeqEqual = sequence1.SequenceEqual(sequence2);\n\
    \nConsole.WriteLine(isSeqEqual);\n```\n\nThis produces the following output:\n\
    \nTrue\n\nIf the two sequences are being compared contain the same elements, but\
    \ in different orders, then SequenceEqual will return false, as the following\
    \ code demonstrates.\n\n```\nIEnumerable<int> sequence1 = new[] { 1, 2, 3 };\n\
    IEnumerable<int> sequence2 = new[] { 3, 2, 1 };\n\nbool isSequenceEqual = sequence1.SequenceEqual(sequence2);\n\
    \nConsole.WriteLine(isSequenceEqual);\n```\n\nThis produces the following output:\n\
    \nFalse\n\nNotice here even though the sequences contain the same values (1, 2,\
    \ 3) the order is different, so SequenceEqual returns false.\n\n## Query expression\
    \ usage\n\nThere is no keyword for SequenceEqual when using the query expression\
    \ style; however, mixed style can be used.\n\n## Aggregate Operators\n\nThe aggregate\
    \ operators take an input sequence and return a single scalar value. The returned\
    \ value is not one of the elements from the input sequence, but rather some derived\
    \ value computed from the elements in the input sequence.\n\nThe aggregate query\
    \ operators are:\n\n- Count\n- LongCount\n- Sum\n- Min\n- Max\n- Average\n- Aggregate\n\
    \n## Count\n\nThe Count query operator simply returns the number of elements contained\
    \ in the input sequence. There are two overloads, one of which accepts a predicate.\n\
    \nThe following example shows the non-predicate version.\n\n```\nint[] nums =\
    \ {1, 2, 3};\nint numberOfElements = nums.Count();\nConsole.WriteLine(numberOfElements);\n\
    ```\n\nThis produces the following output:\n\n3\n\nWhen a predicate is supplied,\
    \ the count is restricted to those elements satisfying the predicate. The following\
    \ code shows a predicate being used to count all the even numbers in the input\
    \ sequence.\n\n```\nint[] nums = {1, 2, 3 };\nint numberOfEvenElements = nums.Count(x\
    \ => x % 2 == 0);\nConsole.WriteLine(numberOfEvenElements);\n```\n\nThis produces\
    \ the following output:\n\n1\n\n> Tip: Using Any() instead of Count() != 0 usually\
    \ conveys the intent of the code better, and in some circumstances, can perform\
    \ better.\n\n## Query expression usage\n\nThere is no keyword for Count when using\
    \ the query expression style; however, mixed style can be used.\n\n## LongCount\n\
    \nThe LongCount query operator provides the same features as Count (including\
    \ a predicate overload), instead of returning an int, it returns a long, so it\
    \ can be used with very long input sequences.\n\n## Query expression usage\n\n\
    There is no keyword for LongCount when using the query expression style; however,\
    \ mixed style can be used.\n"
  mdcn: "\n糖\n蛋\n牛奶\n\n注意，这与输入序列完全相同。\n\n以下代码展示了第二运行模式，即输入序列包含零元素。\n\n```\nIngredient[]\
    \ ingredients = {};\nIEnumerable<Ingredient> query = ingredients.DefaultEmpty();\n\
    foreach (Ingredient item in query)\n{\n    Console.WriteLine(item == null);\n\
    }\n```\n\n这产生了以下输出：\n\nTrue\n\n请注意，这里输入序列是空的，但输出序列包含单个 `null` 元素，`null` 是 `Ingredient`\
    \ 的默认值（它是一个引用类型）。\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有 `DefaultEmpty` 关键字；但可以使用混合样式。\n\
    \n## 生成操作符\n\n生成查询操作符为我们创建序列。\n\n生成操作符与大多数其他标准查询运算符在两个方面有所不同。第一是它们不接收输入序列；其次它们不是作为扩展方法实现的，而是作为\
    \ `Enumerable` 类的静态方法实现的。\n\n例如，以下代码显示了 `Empty` 查询操作符的签名。\n\n```\npublic static\
    \ IEnumerable<TResult> Empty<TResult>()\n```\n\n## Empty\n\n`Empty` 查询操作符创建一个指定类型的空序列（零元素）。\n\
    \n以下代码显示了 **Ingredient** 空序列的创建。注意，我们想要的空序列的类型被指定为 **Empty** 方法的泛型类型参数。\n\n```\n\
    IEnumerable<Ingredient> ingredients = Enumerable.Empty<Ingredient>();\n\nConsole.WriteLine(ingredients.Count());\n\
    ```\n\n这产生了以下输出：\n\n0\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有 `Empty` 关键字；但可以使用混合样式。\n\
    \n## Range\n\n`Range` 查询操作符创建一个整数值序列。在使用 `Range` 时，指定的第一个参数是要生成的范围的起始数字。第二个参数是从第一个参数的值开始，要生成的元素总数。\n\
    \n```\nIEnumerable<int> fiveToTen = Enumerable.Range(5, 6);\nforeach (int num\
    \ in fiveToTen)\n{\n    Console.WriteLine(num);\n}\n```\n\n这产生了以下输出：\n\n5\n6\n\
    7\n8\n9\n10\n\n注意，总共生成了六个元素，正如对 `Range` 调用中的第二个参数所指定的那样。\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有\
    \ `Range` 关键字；但可以使用混合样式。\n\n## Repeat\n\n`Repeat` 查询操作符按照指定的次数重复指定的整数，如以下代码所示。\n\
    \n```\nIEnumerable<int> nums = Enumerable.Repeat(42, 5);\nforeach (int num in\
    \ nums)\n{\n  Console.WriteLine(num);\n}\n```\n\n这产生了以下输出：\n\n42\n42\n42\n42\n\
    42\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有 `Repeat` 关键字；但可以使用混合样式。\n\n## 量化操作符\n\n`Contains`\
    \ 查询操作符评估输入序列中的元素，如果存在指定的值，则返回 `true`。\n\n```\nint[] nums = {1, 2, 3};\nbool isTwoThere\
    \ = nums.Contains(2);\nbool isFiveThere = nums.Contains(5);\n\nConsole.WriteLine(isTwoThere);\n\
    Console.WriteLine(isFiveThere);\n```\n\n## Contains\n\n这产生了以下输出：\n\nTrue\nFalse\n\
    \n## 查询表达式用法\n\n在使用查询表达式样式时，没有 `Contains` 关键字；但可以使用混合样式。\n\n## Any\n\n`Any` 操作符有两个重载。第一个版本仅当输入序列包含至少一个元素时返回\
    \ `true`。第二个版本 `Any` 取一个谓词作为参数，如果输入序列中至少有一个元素满足该谓词，则返回 `true`。\n\n以下代码演示了 `Any`\
    \ 的简单版本。\n\n```\nint[] nums = { 1, 2, 3 };\nIEnumerable<int> nNums = Enumerable.Empty<int>();\n\
    Console.WriteLine( nums.Any() );\nConsole.WriteLine( nNums.Any() );\n```\n\n这产生了以下输出：\n\
    \nTrue\nFalse\n\n以下代码显示了 `Any` 的谓词重载，用于判断序列是否包含任何偶数。\n\n```\nint[] nums = { 1,\
    \ 2, 3 };\nbool areAnyEvenNumbers = nums.Any(x => x % 2 == 0);\nConsole.WriteLine(areAnyEvenNumbers);\n\
    ```\n\n这产生了以下输出：\n\nTrue\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有 `Any` 关键字；但可以使用混合样式。\n\
    \n## All\n\n`All` 查询操作符接收一个谓词并评估输入序列中的元素，以判断是否每个元素都满足该谓词。\n\n以下代码检查一个成分序列是否构成低脂配方。\n\
    \n```\nIngredient[] ingredients =\n{\nnew Ingredient {Name = \"Sugar\", Calories\
    \ = 500},\nnew Ingredient {Name = \"Egg\", Calories = 100},\nnew Ingredient {Name\
    \ = \"Milk\", Calories = 150},\nnew Ingredient {Name = \"Flour\", Calories = 50},\n\
    new Ingredient {Name = \"Butter\", Calories = 400}\n};\n\nbool isLowFatRecipe\
    \ = ingredients.All(x => x.Calories < 200);\n\nConsole.WriteLine(isLowFatRecipe);\n\
    ```\n\n这产生了以下输出：\n\nFalse\n\n> 注意：一旦发现不满足谓词的元素，All() 就会返回 `false` 并不再检查任何后续元素。\n\
    \n## 查询表达式用法\n\n在使用查询表达式样式时，没有 `All` 关键字；但可以使用混合样式。\n\n## SequenceEqual\n\n`SequenceEqual`\
    \ 查询操作符比较两个序列，看它们是否具有相同的元素和顺序。\n\n以下代码比较两个相同的序列：\n\n```\nIEnumerable<int> sequence1\
    \ = new[] { 1, 2, 3 };\nIEnumerable<int> sequence2 = new[] { 1, 2, 3 };\n\nbool\
    \ isSeqEqual = sequence1.SequenceEqual(sequence2);\n\nConsole.WriteLine(isSeqEqual);\n\
    ```\n\n这产生了以下输出：\n\nTrue\n\n如果两个序列包含相同的元素但顺序不同，则 `SequenceEqual` 将返回 `false`，如下代码所示。\n\
    \n```\nIEnumerable<int> sequence1 = new[] { 1, 2, 3 };\nIEnumerable<int> sequence2\
    \ = new[] { 3, 2, 1 };\n\nbool isSequenceEqual = sequence1.SequenceEqual(sequence2);\n\
    \nConsole.WriteLine(isSequenceEqual);\n```\n\n这产生了以下输出：\n\nFalse\n\n注意这里，虽然序列包含\
    \ (1, 2, 3)，但顺序不同，因此 `SequenceEqual` 返回 `false`。\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有\
    \ `SequenceEqual` 关键字；但可以使用混合样式。\n\n## 聚合操作符\n\n聚合操作符接收输入序列并返回单个标量值。返回的值不是输入序列中的元素，而是从输入序列元素中计算出的派生值。\n\
    \n聚合查询操作符有：\n\n- Count\n- LongCount\n- Sum\n- Min\n- Max\n- Average\n- Aggregate\n\
    \n## Count\n\n`Count` 查询操作符简单返回输入序列中的元素数量。它有两个重载，其中一个接收谓词。\n\n以下示例显示了非谓词版本。\n\n\
    ```\nint[] nums = {1, 2, 3};\nint numberOfElements = nums.Count();\nConsole.WriteLine(numberOfElements);\n\
    ```\n\n这产生了以下输出：\n\n3\n\n当提供谓词时，计数限制为满足谓词的元素。以下代码显示了使用谓词统计输入序列中所有的偶数。\n\n```\n\
    int[] nums = {1, 2, 3 };\nint numberOfEvenElements = nums.Count(x => x % 2 ==\
    \ 0);\nConsole.WriteLine(numberOfEvenElements);\n```\n\n这产生了以下输出：\n\n1\n\n> 提示：使用\
    \ `Any()` 代替 `Count() != 0` 通常能更好地表达代码意图，在某些情况下性能也更好。\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有\
    \ `Count` 关键字；但可以使用混合样式。\n\n## LongCount\n\n`LongCount` 查询操作符提供了与 `Count` 相同的功能（包括谓词重载），它不再返回\
    \ `int` 而是返回 `long`，因此它可以用于非常长的输入序列。\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有 `LongCount`\
    \ 关键字；但可以使用混合样式。\n"
