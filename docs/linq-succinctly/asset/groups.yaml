  - "[PAGE 21]\n\n# Range variables\n\nA range variable is an identifier that represents\
    \ each element in the sequence turn. It's similar to the variable used in a foreach\
    \ statement; as the sequence is processed, this range variable represents the\
    \ current element being processed. In the preceding code, the range variable i\
    \ is being declared. Even though the same range variable identifier i is used\
    \ in each clause, the sequence that the range variable \"traverses\" is different.\
    \ Each clause works with the input sequence produced from the preceding clause\
    \ (or the initial IEnumerable<T>). This means that each clause is processing a\
    \ different sequence; it is simply the name of the range variable that is being\
    \ reused.\n\nIn addition to the range variable introduced in the from, additional\
    \ range variables can be added using other clauses or keywords. The following\
    \ can introduce new range variables into a query expression:\n\n+   * Additional\
    \ from clauses\n* The let clause\n* The into keyword\n* The join clause\n\n# The\
    \ let clause\n\nA clause in a LINQ query expression allows the introduction of\
    \ an additional range variable. This additional range variable can then be used\
    \ in other clauses that follow it.\n\nIn the following code, the let clause is\
