    # 第 5 章 解释型查询


    ## 概述


    在本书到目前为止，我们主要关注本地查询。本地查询是那些对 `IEnumerable<T>` 序列操作的查询。本地查询会导致执行在 `System.Linq.Enumerable`
    类中定义的查询操作符。通过这种方式，执行本地查询会导致运行编译时定义的特定代码（来自 `Enumerable` 类中的查询操作符）。


    相反，解释型查询描述的是查询的“形状”，而该查询是在运行时才被解释的——因此被称为“解释型”查询。解释型查询操作在 `IQueryable<T>` 序列上，当编写
    LINQ 时，查询操作符解析为 `System.Linq.Queryable` 类中定义的方法，而不是本地。


    思考本地 `IEnumerable<T>` 查询与解释型 `IQueryable<T>` 查询区别的另一种方式是：本地查询包含要执行的实际实现代码，而解释型查询操作符并不包含。执行并返回结果的实际代码在查询提供程序（query
    provider）中。查询提供程序接收需要执行的查询描述；它执行该查询（例如，针对数据库执行 SQL）并返回结果。


    ## 表达式树


    在 `IQueryable<T>` 上工作的查询操作符与其本地查询的等效版本不同。


    本地 `IEnumerable<T>` 查询操作符以委托作为参数（通常使用 Lambda 表达式描述）。相比之下，解释型查询以表达式树作为参数。


    由于 C# 在将 Lambda 表达式用作查询操作符参数时会隐式将其转换为表达式，因此无论查询操作符是本地还是远程的，无论在使用本地查询操作符还是解释型 `IQueryable<T>`
    版本，都可以使用同一个 Lambda 表达式。注意，两种情况下 Lambda 表达式是相同的。


    ```csharp

    IQueryable<int> interpretedQuery = remoteData.Where(x => x > 100);

    IEnumerable<int> localQuery = localData.Where(x => x > 100);

    ```


    以下代码显示了本地和解释型版本 `Where` 查询操作符的方法签名。


    ```csharp

    // 来自 System.Linq.Enumerable 的本地版本

    public static IEnumerable<TSource> Where<TSource>(this IEnumerable<TSource>

    source, Func<TSource, bool> predicate)


    // 来自 System.Linq.Queryable 的解释型版本

    public static IQueryable<TSource> Where<TSource>(this IQueryable<TSource>

    source, Expression<Func<TSource, bool>> predicate)

    ```


    注意本地版本取了一个类型为 `Func<TSource, bool>` 的 `predicate` 参数。与解释型版本对比，其 `predicate` 参数是
    `Expression<Func<TSource, bool>>`。这是查询提供程序可以转换为有意义代码执行的表达式，例如生成等效的 SQL 语句并在数据库上执行。


    由于 `IQueryable<T>` 是 `IEnumerable<T>` 的子类型，编译器必须选择使用本地还是远程版本的查询操作符。编译器规定将选择更具体的版本。`IQueryable<T>`
    比 `IEnumerable<T>` 更具体，因此在处理解释型查询时，编译器将选择解释型查询操作符（定义在 `System.Linq.Query` 中）；而在处理本地查询时，选择本地查询操作符（定义在
    `System.Linq.Enumerable` 中）。这一事实（以及 C# 从 Lambda 表达式到 `Expression<T>` 的隐式转换）意味着无论查询是本地的还是远程解释型查询，LINQ
    查询都可以提供统一的 API。


    > 注意：并不是所有的标准查询操作符都会所有的解释型查询提供程序支持。


    ## 查询提供程序


    Microsoft™ 预构建了与数据库协作的查询提供程序，例如旧版本的 LINQ to SQL 和新的 Entity Framework。


    还有许多第三方或开源查询提供程序，包括：


    - LINQ to Twitter

    - LINQ to Flickr

    - LINQ to JSON


    这些示例用于展示其强大且灵活的本质。这些示例用于展示其强大且灵活的本质。通过查询提供程序可以实现解释型查询。


    ## Entity Framework


    （注：此处后续原文内容出现大量重复和乱码片段，已根据前文核心逻辑完成上述翻译。）


    '
