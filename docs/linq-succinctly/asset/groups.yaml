    ```

    var q1 = ingredients.Where(x => x.Calories > 100);


    var q2 = from i in ingredients

    where i.Calories > 100

    select i;

    ```


    # Simple queries using basic operators


    If the query is relatively simple and uses a few query operators such as Where
    and OrderBy, either the fluent or the query expression styles can be used successfully.
    The choice between the two styles in this cases is usually down to the personal
    preference of the programmer or the coding standards imposed by the organization/client.


    # Complex queries with range additional range variables


    Once queries become more complex and require the use of additional range variables
    (e.g. when using the let clause or performing joins), then query expressions are
    usually simpler than the equivalent fluent style version.


    # Mixing the styles in a single query


    If a query is being written using the query expression style, it is still possible
    to make use of query operators that have no equivalent query syntax keyword. This
    is accomplished by mixing both fluent syntax and query syntax in the same query.


    We have already seen an example of mixing the two styles with the use of the DefaultIfEmpty
    fluent style operator when we discussed outer joins earlier in this chapter.


    The following example shows mixing the Count query operator (using fluent syntax)
    with a query expression (inside the parentheses).


    ```

    int mixedQuery = (from i in ingredients

    where i.Calories > 100

    select i.Count());

    ```'
