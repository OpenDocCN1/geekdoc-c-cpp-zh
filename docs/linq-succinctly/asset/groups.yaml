    \ **Max** 关键字；但是，可以使用混合样式。\n\n## 聚合 (Aggregate)\n\n之前的聚合运算符都执行特定的聚合操作；而 **Aggregate**\
    \ 查询运算符是一个更高级的运算符，允许对输入序列定义并执行自定义聚合。\n\n**Aggregate** 有两个版本：一个允许指定“种子（seed）”值，另一个则使用序列中的第一个元素作为种子值。\n\
    \n所有版本的 **Aggregate** 都要求指定一个“累加器函数”。正如其名称所示，累加器在处理输入序列中的每个元素时会累加结果。累加器函数接收当前正在处理的元素值和当前累累加值。\n\
