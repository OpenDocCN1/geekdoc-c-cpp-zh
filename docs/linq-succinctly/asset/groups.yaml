- md: "\n```csharp\n{\n  Console.WriteLine(item);\n}\n```\n\nThis produces the following\
    \ output:\n\nApple\nSugar\n\nBecause IEnumerable<T> implements IEnumerable, OfType\
    \ can also be used on strongly-typed sequences. The following code show a simple\
    \ object-oriented hierarchy.\n\n```csharp\nclass Ingredient\n{\n  public string\
    \ Name { get; set; }\n}\nclass DryIngredient : Ingredient\n{\n  public int Grams\
    \ { get; set; }\n}\nclass WetIngredient : Ingredient\n{\n  public int Millilitres\
    \ { get; set; }\n}\n```\n\nThe following code shows how OfType can be used to\
    \ get a specific subtype, in this example getting all the WetIngredient objects:\n\
    \n```csharp\nIEnumerable<Ingredient> input = new Ingredient[]\n{\n  new DryIngredient\
    \ {Name = \"Flour\"},\n  new WetIngredient {Name = \"Milk\"},\n  new WetIngredient\
    \ {Name = \"Water\"}\n};\nIEnumerable<WetIngredient> query = input.OfType<WetIngredient>();\n\
    foreach (WetIngredient item in query)\n{\n  Console.WriteLine(item.Name);\n}\n\
    ```\n\nThis produces the following output:\n\nMilk\nWater\n\n## Query expression\
    \ usage\n\nThere is no keyword for OfType when using the query expression style;\
    \ however, mixed style can be used.\n\n## Cast\n\nLike the OfType query operator,\
    \ the Cast query operator can take an input sequence and return an output sequence\
    \ containing elements of each type. Each element in the input sequence is cast\
    \ to the specified type; however, unlike OfType, which just ignores any incompatible\
    \ types, if the cast is not successful, an exception will be thrown.\n\nThe following\
    \ code shows an example of using Cast will throw an exception.\n\n```csharp\n\
    IEnumerable input = new object[]\n{\n    \"Apple\", 33, \"Sugar\", 44, 'a', new\
    \ DateTime()\n};\nIEnumerable<string> query = input.Cast<string>();\nforeach (string\
    \ item in query)\n{\n    Console.WriteLine(item);\n}\n```\n\nRunning this code\
    \ will cause a \"System.InvalidCastException : Unable to cast object of 'System.Int32'\
    \ to type 'System.String' exception.\n\n## Query expression usage\n\nWhile there\
    \ is no keyword for Cast when using the query expression style, it is supported\
    \ by giving the range variable specific type, as in the following code.\n\n```csharp\n\
    IEnumerable input = new object[] {\"Apple\", \"Sugar\", \"Flour\"};\nIEnumerable<string>\
    \ query = from string i in input\nselect i;\n```\n\nNote in the preceding code\
    \ the explicit type declaration string before the range variable name i.\n\n##\
    \ ToArray\n\nThe **ToArray** query operator takes an input sequence and creates\
    \ an output array containing the elements. **ToArray** will also cause immediate\
    \ query execution (enumeration of the input sequence) and overrides the default\
    \ execution behavior\n\nIn the following code, the `IEnumerable<string>` is converted\
    \ to an array of strings.\n\n```csharp\nIEnumerable<string> input = new List<string>\
    \ { \"Apple\", \"Sugar\", \"Flour\" };\nstring[] array = input.ToArray();\n```\n\
    \n## Query expression usage\n\nThere is no keyword for **ToArray** when using\
    \ the query expression style; however, mixed style can be used.\n\n## ToList\n\
    \nThe **ToList** query operator, like the **ToArray** operator, usually bypasses\
    \ deferred execution. Whereas **ToArray** creates an array representing the input\
    \ elements, **ToList**, as its name suggests, instead outputs a List<T>.\n\n```csharp\n\
    IEnumerable<string> input = new[] { { \"Apple\", \"Sugar\", \"Flour\" };\nList<string>\
    \ list = input.ToList();\n```\n\n## Query expression usage\n\nThere is no keyword\
    \ for **ToList** when using the query expression style; however, mixed style can\
    \ be used.\n\n## ToDictionary\n\nThe **ToDictionary** query operator converts\
    \ an input sequence into a generic **Dictionary<TKey, TValue>.\n\nThe simplest\
    \ overload of the **ToDictionary** method takes a lambda expression representing\
    \ a function, which is used for the key of each item in the resulting Dictionary.\n\
    \n```csharp\nIEnumerable<Recipe> recipes = new[]\n{\n    new Recipe {Id = 1, Name\
    \ = \"Apple Pie\", Rating = 5},\n    new Recipe {Id = 2, Name = \"Cherry Pie\"\
    , Rating = 2},\n    new Recipe {Id = 3, Name = \"Beef Pie\", Rating = 3}\n};\n\
    ```\n\n```csharp\nDictionary<int, Recipe> dict = recipes.ToDictionary(x => x.Id);\n\
    foreach (KeyValuePair<int, Recipe> item in dict)\n{\n    Console.WriteLine(\"\
    Key = {0}, Recipe = {1}\", item.Key, item.Value.Name);\n}\n```\n\nIn the preceding\
    \ code, the Key of the items in the resultant Dictionary is of type int and is\
    \ set to the Id Recipe. The Value of each item in the Dictionary represents the\
    \ Recipe itself.\n\nRunning the preceding code produces the following output:\n\
    \nKey = 1, Recipe = Apple Pie\nKey = 2, Recipe = Cherry Pie\nKey = 3, Recipe =\
    \ Beef Pie\n\n## Query expression usage\n\nThere is no keyword for ToDictionary\
    \ when using the query expression style; however, mixed style can be used.\n\n\
    ## ToLookup\n\nThe ToLookup query operator works in a similar fashion to the ToDictionary\
    \ operator, rather than producing a dictionary, it creates an instance of an ILookup.\n\
    \nThe following code shows the creation of a lookup that groups recipes into similar\
    \ ratings. In this example, the key comes from the byte rating.\n\n```csharp\n\
    IEnumerable<Recipe> recipes = new[]\n{\n    new Recipe {Id = 1, Name = \"Apple\
