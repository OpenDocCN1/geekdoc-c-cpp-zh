    \ = \"Flour\", Calories = 50);\n    new Ingredient(Name = \"Butter\", Calories\
    \ = 500);\n};\n```\n\nIngredient element = ingredients.Last(x => x.Calories ==\
    \ 50);\n\nConsole.WriteLine(element.Name);\n\nThis produces the following output:\n\
    \nFlour\n\nNotice here that \"Flour\" is not the last element in the sequence\
    \ as a whole, but rather the last element that has 50 calories.\n\n# Query expression\
    \ usage\n\nThere is no keyword for Last when using the query expression style;\
    \ however, mixed style can be used.\n\n# LastOrDefault\n\nThe LastOrDefault query\
