    \    }\n}\n```\n\nThis produces the following output:\n\n5\nApple Pie\nBanana\
    \ Pie\n2\nCherry Pie\n3\nBeef Pie\n\n## Element Operators\n\nThe element operators\
    \ take an input sequence and return a single element from that sequence. In this\
    \ way, the element operators do not return sequences.\n\n## First\n\nThe First\
