    The types that make up the X-DOM can be instantiated, just as with regular .NET
    types. To create an X-DOM that represents the previous <ingredients> XML, the
    following code can be written.


    ```

    XElement ingredients = new XElement("ingredients");


    XElement sugar = new XElement("ingredient", "Sugar");

    XElement milk = new XElement("ingredient", "Milk");

    XElement butter = new XElement("ingredient", "Butter");

    ```


    ```

    ingredients.Add(sugar);

    ingredients.Add(milk);

    ingredients.Add(butter);

    ```


    ```

    Console.WriteLine(ingredients);

    ```


