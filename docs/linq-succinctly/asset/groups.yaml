  - "[PAGE 13]\n\nDeferred execution means that the input sequence can be modified\
    \ after the query is constructed, but before the query is executed. It is only\
    \ when the query is executed that the input sequence is processed.\n\nIn the following\
    \ code, the input sequence is modified after the query is constructed, but before\
    \ it is executed.\n\n```\nint[] fibonacci = { 0, 1, 1, 2, 3, 5 };\n// Construct\
    \ the query\nIEnumerable<int> numbersGreaterThanTwoQuery = fibonacci.Where(x =>\
    \ x > 2);\n// At this point the query has still been created but not executed\n\
    fibonacci[0] = 99;\n// Cause the query to be executed (enumerated)\nforeach (var\
    \ number in numbersGreaterThanTwoQuery)\n{\n    Console.WriteLine(number);\n}\n\
    ```\n\nThe query is not actually executed until the foreach is executed. The results\
    \ of running this code are as follows:\n\n+   99\n3\n5\n\nNotice that the value\
    \ 99 has been included in the results, even though at the time the query was constructed\
    \ the first element was still the original value of 0.\n\nWith the exception of\
    \ those that return a scalar value (or a single element from the input sequence)\
    \ such as Count, Min, and Last, the standard query operators work in the deferred\
    \ execution way. Using operators such as Count will cause the query to be executed\
    \ immediately, and not deferred.\n\nThere are a number of conversion operators\
    \ that also cause immediate query execution, such as ToList, ToArray, ToLookup,\
    \ and ToDictionary."
