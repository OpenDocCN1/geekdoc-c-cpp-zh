  - "[PAGE 24]\n\nTo perform a join, some value of the elements in the first sequence\
    \ is compared for equality with some value of the elements in the second sequence.\
    \ It is important to note here that the join clause perform equi-joins; the values\
    \ from both sequences are compared for equality. It means that the join clause\
    \ does not support non-equijoins as inequality, or comparisons such as greater-than\
    \ or less-than. Because of this, rather than specifying joined elements using\
    \ an operator as == in C#, the equals keyword is used. The design thinking about\
    \ introducing this keyword is to make it very clear that joins are equi-joins.\n\
    \nCommon types of joins:\n\n+   - Inner joins.\n- Group joins.\n- Left outer joins.\n\
    \nThe following join code examples assume that the following classes have been\
    \ defined:\n\n```\nclass Recipe\n{\n    public int Id { get; set; }\n    public\
    \ string Name { get; set; }\n}\n\nclass Review\n{\n    public int RecipeID { get;\
    \ set; }\n    public string ReviewText { get; set; }\n}\n```\n\nThese two classes\
    \ model the fact that recipes can have 0, 1, or many reviews. The Review class\
    \ has a RecipeID property that holds the id of the recipe that the Review pertains\
    \ to; notice though that there is no direct relationship in the form of a type\
    \ Recipe.\n\n# Inner join\n\nAn inner join returns an element in the output sequence\
    \ for each item in the first sequence that has matching items in the second sequence.\
    \ If an element in the first sequence does not have any matching elements in the\
    \ second sequence, it will not appear in the output sequence."
