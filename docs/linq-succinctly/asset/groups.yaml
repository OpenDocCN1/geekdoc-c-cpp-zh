    \ = 100},\n  new Ingredient {Name = \"Milk\", Calories = 150},\n  new Ingredient\
    \ {Name = \"Flour\", Calories = 50},\n  new Ingredient {Name = \"Butter\", Calories\
    \ = 500}\n};\nIngredient element = ingredients.First();\nConsole.WriteLine(element.Name);\n\
    ```\n\nThis produces the following output:\n\nSugar\n\nAn overload of First allows\
    \ a predicate to be specified. This will return the first item in the input sequence\
    \ that satisfies this predicate. The following code shows how to find the first\
    \ Ingredient that has a calorie value of 150.\n\n```csharp\nIngredient[] ingredients\
    \ = {\n    new Ingredient {Name = \"Sugar\", Calories = 500},\n    new Ingredient\
    \ {Name = \"Egg\", Calories = 100},\n    new Ingredient {Name = \"Milk\", Calories\
    \ = 150},\n    new Ingredient {Name = \"Flour\", Calories = 50},\n    new Ingredient\
    \ {Name = \"Butter\", Calories = 500}\n};\n\nIngredient element = ingredients.First(x\
    \ => x.Calories == 150);\nConsole.WriteLine(element.Name);\n```\n\nThis produces\
    \ the following output:\n\nMilk\n\nIf the input sequence contains zero elements,\
    \ the use of First will result in an exception.\n\nThe following code will result\
    \ in an exception: \"System.InvalidOperationException : Sequence contains no elements\"\
    .\n\n```csharp\nIngredient[] ingredients = {};\nIngredient element = ingredients.First();\n\
    ```\n\nIf First is used with a predicate and that predicate cannot be satisfied\
    \ by any element in the input sequence, an exception will also be thrown. The\
    \ following code produces the exception: \"System.InvalidOperationException :\
    \ Sequence contains no matching element.\" This is because no Ingredient exists\
    \ with 9,999 calories.\n\n```csharp\nIngredient[] ingredients = {\n    new Ingredient\
    \ {Name = \"Sugar\", Calories = 500},\n    new Ingredient {Name = \"Egg\", Calories\
    \ = 100},\n    new Ingredient {Name = \"Milk\", Calories = 150},\n    new Ingredient\
    \ {Name = \"Flour\", Calories = 50},\n    new Ingredient {Name = \"Butter\", Calories\
    \ = 500}\n};\n\nIngredient element = ingredients.First(x => x.Calories == 9999);\n\
    ```\n"
