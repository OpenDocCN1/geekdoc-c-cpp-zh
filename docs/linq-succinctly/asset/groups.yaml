- md: "\n## Sum\n\nThe Sum query operator adds all the elements of the input sequence\
    \ and returns the total result.\n\nThe following code demonstrates adding a sequence\
    \ of ints.\n\n```\nint[] nums = { 1, 2, 3 };\nint total = nums.Sum();\nConsole.WriteLine(total);\n\
    ```\n\nThis produces the following output:\n\n6\n\nThe Sum query operator is implemented\
    \ as individual extension methods for IEnumerable<T> (for example, IEnumerable<long>)\
    \ for each of the numeric types (nullable equivalents). This means that in order\
    \ to use Sum on non-numeric sequences, an overload must be used to select a numeric\
    \ value from the non-numeric input elements. The following code shows how to Sum\
    \ the calorie values of a sequence of Ingredient.\n\n```c\nIngredient[] ingredients\
    \ = {\n    new Ingredient {Name = \"Sugar\", Calories = 500},\n    new Ingredient\
    \ {Name = \"Egg\", Calories = 100},\n    new Ingredient {Name = \"Milk\", Calories\
    \ = 150},\n    new Ingredient {Name = \"Flour\", Calories = 50},\n    new Ingredient\
    \ {Name = \"Butter\", Calories = 400}\n};\nint totalCalories = ingredients.Sum(x\
    \ => x.Calories);\nConsole.WriteLine(totalCalories);\n```\n\nThis produces the\
    \ following output:\n\n1200\n\n## Query expression usage\n\nThere is no keyword\
    \ for Sum when using the query expression style; however, mixed style can be used.\n\
    \n## Average\n\nThe Average query operator works on a sequence of numeric values\
    \ and calculates the average.\n\nThe following code shows Average in use.\n\n\
    ```csharp\nint[] nums = { 1, 2, 3 };\nvar avg = nums.Average();\nConsole.WriteLine(avg);\n\
    ```\n\nThis produces the following output:\n\n2\n\nNotice in the preceding code\
    \ the type for total has not been explicitly set; instead, var is being used.\
    \ Depending on the numeric input type, Average will return different output numeric\
    \ types. For example, the following code will not compile because the implementation\
    \ of Average for IEnumerable<int> returns a double.\n\n```csharp\nint[] nums =\
    \ { 1, 2, 3 };\nvar avg = nums.Average(); // this line causes compilation failure\n\
    ```\n\nAverage will return either a double, float, or decimal return type (or\
    \ the nullable versions of these).\n\nWith Sum, Average can be used on an input\
    \ sequence of non-numeric values using an overload, which allows a numeric value\
    \ to be selected, as shown in the following code.\n\n```csharp\nIngredient[] ingredients\
    \ = {\n    new Ingredient(Name = \"Sugar\", Calories = 500),\n    new Ingredient(Name\
    \ = \"Egg\", Calories = 100),\n    new Ingredient(Name = \"Milk\", Calories =\
    \ 150),\n    new Ingredient(Name = \"Flour\", Calories = 50),\n    new Ingredient(Name\
    \ = \"Butter\", Calories = 400)\n};\n\nvar avgCalories = ingredients.Average(x\
    \ => x.Calories);\nConsole.WriteLine(avgCalories);\n```\n\nThis produces the following\
    \ output:\n\n240\n\n## Query expression usage\n\nThere is no keyword for Average\
    \ when using the query expression style; however, mixed style can be used.\n\n\
    ## Min\n\nThe Min query operator returns the smallest element from the input sequence,\
    \ as the following code demonstrates.\n\n```csharp\nint[] nums = { 3, 2, 1 };\n\
    var smallest = nums.Min();\nConsole.WriteLine(smallest);\n```\n\nThis produces\
    \ the following output:\n\n1\n\nAn overload of Min also needs the selector to\
    \ be specified, as the following code shows.\n\n```csharp\nIngredient[] ingredients\
    \ = {\n    new Ingredient(Name = \"Sugar\", Calories = 500),\n    new Ingredient(Name\
    \ = \"Egg\", Calories = 100),\n    new Ingredient(Name = \"Milk\", Calories =\
    \ 150),\n    new Ingredient(Name = \"Flour\", Calories = 50),\n    new Ingredient(Name\
    \ = \"Butter\", Calories = 400)\n};\nvar smallestCalories = ingredients.Min(x\
    \ => x.Calories);\nConsole.WriteLine(smallestCalories);\n```\n\nThis produces\
    \ the following output:\n\n50\n\n## Query expression usage\n\nThere is no keyword\
    \ for Min when using the query expression style; however, mixed style can be used.\n\
    \n## Max\n\nThe **Max** query operator complements the **Min** operator and returns\
    \ the largest value from the input sequence, as the following code demonstrates.\n\
    \n```csharp\nint[] nums = { 1, 3, 2 };\nvar largest = nums.Max();\nConsole.WriteLine(largest);\n\
    ```\n\nThis produces the following output:\n\n3\n\nAs with Min, there is an overload\
    \ of **Max** that allows a selector to be specified.\n\n## Query expression usage\n\
    \nThere is no keyword for **Max** when using the query expression style; however,\
    \ mixed style can be used.\n\n## Aggregate\n\nThe previous aggregate operators\
    \ all perform a specific aggregation; the **Aggregate** query operator is a more\
    \ advanced operator that allows custom aggregations to be defined and executed\
    \ against an input sequence.\n\nThere are two versions of **Aggregate**: one that\
    \ allows a \"seed\" value to be specified, and one that uses the first element\
    \ in the sequence as the seed value.\n\nAll versions of **Aggregate** require\
    \ an \"accumulator function\" to be specified. The accumulator, as its name suggests,\
    \ accumulates a result as each element in the input sequence is processed. The\
    \ accumulator function is passed the value of the current element being processed\
    \ and the current accumulated value.\n\nThe following code demonstrates how to\
    \ simulate the **Sum** operator using **Aggregate**.\n\n```csharp\nint[] nums\
    \ = { 1, 2, 3 };\nvar result = nums.Aggregate(0,\n    (currentElement, runningTotal)\
    \ => runningTotal + currentElement);\nConsole.WriteLine(result);\n```\n\nThis\
    \ produces the following output:\n\nThe preceding code uses Aggregate that specifies\
    \ the seed value.\n\n## Query expression usage\n\nThere is no keyword for Aggregate\
    \ when using the query expression style; however, mixed style can be used.\n\n\
    ## Joining Operators\n\nThe Join query joins two sequences, combine them in some\
    \ way, and output a sequence. The Join operator takes a number of parameters:\n\
    \n- IEnumerable<TInner>: The inner sequence.\n- Func<TOuter, TKey> outerKeySelector:\
    \ What key to join on outer sequence elements.\n- IEnumerable<TInner, TKey> innerKeySelector:\
    \ What key to join on inner sequence elements.\n- Func<TOuter, TInner, TResult>\
    \ resultSelector: What the output will look like.\n\nThe following code shows\
    \ Join in use. Notice the result selector is creating an anonymous type containing\
    \ the group \"key\" (i.e. the recipe name), and a list of the reviews that belong\
    \ to that recipe.\n\n```csharp\nRecipe[] recipes = {\n    new Recipe {Id = 1,\
    \ Name = \"Mashed Potato\"},\n    new Recipe {Id = 2, Name = \"Crispy Duck\"},\n\
    \    new Recipe {Id = 3, Name = \"Sachertorte\"}\n};\n\nReview[] reviews = {\n\
    \    new Review {RecipeId = 1, Text = \"Tasty!\"},\n    new Review {RecipeId =\
    \ 1, Text = \"Not nice\"},\n    new Review {RecipeId = 2, Text = \"Pretty good\"\
    },\n    new Review {RecipeId = 2, Text = \"Too hard\"},\n    new Review {RecipeId\
    \ = 2, Text = \"Loved it\"}\n};\n\nvar query = recipes.Join(\n    reviews,\n \
    \   recipe => recipe.Id,\n    review => review.RecipeId,\n    (recipe, review)\
    \ => recipe.Name + \" - \" + review.Text\n);\n\nforeach (string item in query)\n\
    {\n    Console.WriteLine(item);\n}\n```\n\nThis produces the following output:\n\
    \nMashed Potato - Tasty!\nMashed Potato - Not nice\nCrispy Duck - Pretty good\n\
    Crispy Duck - Too hard\nCrispy Duck - Loved it\n\nNotice in this output \"Sachertorte\"\
    \ does not appear. This is because Join performs an inner join, so elements in\
    \ the outer sequence that have no matches in the inner sequence will not be included.\n\
    \n## Query expression usage\n\nThe join keyword is used when using the query expression\
    \ style. The following code shows how to perform an inner join using the query\
    \ expression style.\n\n```csharp\nvar query = from recipe in recipes\n    join\
    \ review in reviews on recipe.Id equals review.RecipeId\n    select new\n    {\n\
    \        RecipeName = recipe.Name,\n        RecipeReview = review.Text\n    };\n\
    ```\n\nTip: Consider using the query expression when performing joins, as it is\
    \ usually more readable.\n\n## GroupJoin\n\nThe GroupJoin query joins an inner\
    \ and outer sequence, just as with the Join operator; however, GroupJoin produces\
    \ a hierarchical result sequence. The output sequence is essentially a sequence\
    \ of groups, with each group able to contain the sequence of items from the inner\
    \ sequence that belong to that group.\n\nThe GroupJoin operator takes a number\
    \ of parameters:\n\n- IEnumerable<TInner> inner: The inner sequence.\n- Func<TOuter,\
    \ TKey> outerKeySelector: What key to join on outer sequence elements.\n- IEnumerable<TInner,\
    \ TKey> innerKeySelector: What key to join on inner sequence elements.\n- Func<TOuter,\
    \ Iumerable<TInner>, TResult> resultSelector: What the output groups will look\
    \ like.\n\nNotice the final parameter is different from Join's (Func<TOuter, TInner,\
    \ TResult> resultSelector). Rather than a single Inner, GroupJoin has IEnumerable<TInner>.\
    \ This IEnumerable<TInner> contains all the elements from the inner sequence that\
    \ matches the outer sequence key; it is essentially all inner sequence elements\
    \ that belong to the group.\n\nThe following code shows GroupJoin in use. Notice\
    \ the result selector is creating an anonymous type containing the group \"key\"\
    \ (i.e. the recipe name), and a list of the reviews that belong to that recipe.\n\
    \n```csharp\nvar query = recipes.GroupJoin(\n    reviews,\n    recipe => recipe.Id,\n\
    \    review => review.RecipeId,\n    (recipe, review) => new\n    {\n        RecipeName\
    \ = recipe.Name,\n        Reviews = review\n    }\n);\n\nforeach (var group in\
    \ query)\n{\n    Console.WriteLine(group.RecipeName);\n    foreach (var review\
    \ in group.Reviews)\n    {\n        Console.WriteLine(review.Text);\n    }\n}\n\
    ```\n"
