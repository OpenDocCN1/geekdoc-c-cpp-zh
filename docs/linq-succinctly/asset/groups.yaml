    # Chapter 4 LINQ to XML


    The building blocks that comprise LINQ to XML allow the creation, modification,
    querying, and saving of XML data.


    At a high level, LINQ to XML consists of two key architectural elements that are
    designed to work well together:


    +   - XML document object model.

    - Additional LINQ to XML query operators.


    The XML document object model in LINQ to XML (the X-DOM) is not the W3C DOM; it
    is a set of .NET types that represent in-memory XML data. While the types that
    make up the X-DOM can be used independently from any LINQ queries, they are designed
    to be LINQ-friendly and facilitate easy interaction when using LINQ.


    # X-DOM Overview


    The types that make up the X-DOM are used to represent the structure of an XML
    document fragment. They represent an in-memory model of the structure and content
    of XML data.


    # Key X-DOM types


    There are numerous types that make up the X-DOM object model. Some of the keys
    types are shown in the following class hierarchy diagram.


    ![](img/ddd03c95c0e0aea3c64c904c312e545b_91_0.png)'
