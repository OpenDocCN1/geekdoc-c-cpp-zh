    \ to cast object of 'System.Int32' to type 'System.String\" exception.\n\n# Query\
    \ expression usage\n\nWhile there is no keyword for Cast when using the query\
    \ expression style, it is supported by giving the range variable specific type,\
    \ as in the following code.\n\n```\nIEnumerable input = new object[] {\"Apple\"\
    , \"Sugar\", \"Flour\"};\nIEnumerable<string> query = from string i in input\n\
    select i;\n```\n\nNote in the preceding code the explicit type declaration string\
