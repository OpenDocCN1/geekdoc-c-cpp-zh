- md: "\n# Skip\n\nThe Skip query operator ignore the specified number of input elements\
    \ from the start of the input sequence and return the remainder.\n\nThe following\
    \ code skips over the first three elements and returns the rest:\n\n```csharp\n\
    Ingredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\", Calories =\
    \ 500},\n    new Ingredient {Name = \"Egg\", Calories = 100},\n    new Ingredient\
    \ {Name = \"Milk\", Calories = 150},\n    new Ingredient {Name = \"Flour\", Calories\
    \ = 50},\n    new Ingredient {Name = \"Butter\", Calories = 200}\n};\nIEnumerable<Ingredient>\
    \ query = ingredients.Skip(3);\n\nforeach (var ingredient in query) {\n    Console.WriteLine(ingredient.Name);\n\
    }\n```\n\nThis produces the following output:\n\nFlour\nButter\n\n# Query expression\
    \ usage\n\nThere is no keyword for Skip when using the query expression style;\
    \ however, mixed style can be used.\n\n# Using Skip and Take for result set paging\n\
    \nWhen used together, the Skip and Take query operators can implement the paging\
    \ of result sets for display to users, as demonstrated in the following code.\n\
    \n```csharp\nIngredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\"\
    , Calories = 500},\n    new Ingredient {Name = \"Egg\", Calories = 100},\n   \
    \ new Ingredient {Name = \"Milk\", Calories = 150},\n    new Ingredient {Name\
    \ = \"Flour\", Calories = 50},\n    new Ingredient {Name = \"Butter\", Calories\
    \ = 200}\n};\n\nIEnumerable<Ingredient> firstPage = ingredients.Take(2);\n\nIEnumerable<Ingredient>\
    \ secondPage = ingredients\n  .Skip(2)\n  .Take(2);\n\nIEnumerable<Ingredient>\
    \ thirdPage = ingredients\n  .Skip(4)\n  .Take(2);\n\nConsole.WriteLine(\"Page\
    \ One:\");\nforeach (var ingredient in firstPage)\n{\n  Console.WriteLine(\" -\
    \ \" + ingredient.Name);\n}\n\nConsole.WriteLine(\"Page Two:\");\nforeach (var\
    \ ingredient in secondPage)\n{\n  Console.WriteLine(\" - \" + ingredient.Name);\n\
    }\n\nConsole.WriteLine(\"Page Three:\");\nforeach (var ingredient in thirdPage)\n\
    {\n  Console.WriteLine(\" - \" + ingredient.Name);\n}\n```\n\nThis produces the\
    \ following output:\n\n- Page One:\n- Sugar\n- Egg\n- Page Two:\n- Milk\n- Flour\n\
    - Page Three:\n- Butter\n\n# SkipWhile\n\nLike TakeWhile, the SkipWhile query\
    \ operator uses a predicate to evaluate each element in the input sequence. SkipWhile\
    \ ignore items in the input sequence until the supplied predicate returns false.\n\
    \nThe following code will skip input elements until \"Milk\" is encountered; at\
    \ this point the predicate x => x.Name != \"Milk\" becomes false, and the remainder\
    \ of the ingredients will be returned.\n\n```csharp\nIngredient[] ingredients\
    \ = {\n  new Ingredient {Name = \"Sugar\", Calories = 500},\n  new Ingredient\
    \ {Name = \"Egg\", Calories = 100},\n  new Ingredient {Name = \"Milk\", Calories\
    \ = 150},\n  new Ingredient {Name = \"Flour\", Calories = 50},\n  new Ingredient\
    \ {Name = \"Butter\", Calories = 200}\n};\n\nIEnumerable<Ingredient> query = ingredients.SkipWhile(x\
    \ => x.Name != \"Milk\");\n\nforeach (var ingredient in query) {\n  Console.WriteLine(ingredient.Name);\n\
    }\n```\n\nThis produces the following output:\n\nMilk\nFlour\nButter\n\nJust as\
    \ with TakeWhile, there is an overload of SkipWhile that allows the positional\
    \ index of the input element to be used.\n\n# Query expression usage\n\nThere\
    \ is no keyword for SkipWhile when using the query expression style; however,\
    \ mixed style can be used.\n\n# Ordering Operators\n\nThe ordering query operators\
    \ return the same number of elements as the input sequence, but arranged in a\
    \ (potentially) different order.\n\n# OrderBy\n\nThe OrderBy query operator sorts\
    \ the input sequence by comparing the elements in the input sequence using a specified\
    \ key.\n\nThe following code shows the sorting of a simple input sequence of strings.\
    \ In this example, the key is the string itself as specified by the lambda expression\
    \ x => x.\n\n```csharp\nstring[] ingredients = {\n  \"Sugar\",\n  \"Egg\",\n \
    \ \"Milk\",\n  \"Flour\",\n  \"Butter\"\n};\n\nvar query = ingredients.OrderBy(x\
    \ => x);\n\nforeach (var item in query) {\n  Console.WriteLine(item);\n}\n```\n\
    \nThis produces the following output:\n\nButter\nEgg\nFlour\nMilk\nSugar\n\nThe\
    \ lambda expression that used to specify the sorting can specify a property of\
    \ the input element, as the following code shows.\n\n```csharp\nIngredient[] ingredients\
    \ = {\n  new Ingredient {Name = \"Sugar\", Calories = 500},\n  new Ingredient\
    \ {Name = \"Egg\", Calories = 100},\n  new Ingredient {Name = \"Milk\", Calories\
    \ = 150},\n  new Ingredient {Name = \"Flour\", Calories = 50},\n  new Ingredient\
    \ {Name = \"Butter\", Calories = 200}\n};\n\nvar query = ingredients.OrderBy(x\
    \ => x.Calories);\n\nforeach (var item in query) {\n  Console.WriteLine(item.Name\
    \ + \" \" + item.Calories);\n}\n```\n\nIn the preceding code, the lambda expression\
    \ x => x.Calories is selecting the Calories property to be sorted on. This produces\
    \ the following output:\n\nFlour 50\nEgg 100\nMilk 150\nButter 200\nSugar 500\n\
    \n# Query expression usage\n\nThe orderby keyword is used when using the query\
    \ expression style, as shown in the following code.\n\n```csharp\nvar query =\
    \ from i in ingredients\n            orderby i.Calories\nselect i;\n```\n\n# ThenBy\n\
    \nThe ThenBy query operator can be chained one or multiple times following an\
    \ OrderBy. The ThenBy operator adds additional levels of sorting. In the following\
    \ code, the ingredients are first sorted with the OrderBy sort into calorie order;\
    \ this sorted sequence is further sorted by ingredient name.\n\n```csharp\nIngredient[]\
    \ ingredients = {\n  new Ingredient {Name = \"Sugar\", Calories = 500},\n  new\
    \ Ingredient {Name = \"Milk\", Calories = 100},\n  new Ingredient {Name = \"Egg\"\
    , Calories = 100},\n  new Ingredient {Name = \"Flour\", Calories = 500},\n  new\
    \ Ingredient {Name = \"Butter\", Calories = 200}\n};\n\nvar query = ingredients.OrderBy(x\
    \ => x.Calories)\n      .ThenBy(x => x.Name);\n\nforeach (var item in query) {\n\
    \  Console.WriteLine(item.Name + \" \" + item.Calories);\n}\n```\n\nThis produces\
    \ the following output:\n\nEgg 100\nMilk 100\nButter 200\nFlour 500\nSugar 500\n\
    \nNotice that in the original input sequence, \"Milk\" came before \"Egg,\" but\
    \ because of the Then operator, in the output the ingredients are sorted by name\
    \ within matching calorie values.\n\n# Query expression usage\n\nThe orderby keyword\
    \ is used when using the query expression style, rather than a single sort expression,\
    \ subsequent sort expressions are added as a comma-separated list, as shown in\
    \ this code.\n\n```csharp\nvar query = from i in ingredients\n            orderby\
    \ i.Calories, i.Name\nselect i;\n```\n\n# OrderByDescending\n\nThe OrderByDescending\
    \ query operator works in the same fashion as the OrderBy operator, except that\
    \ the results are returned in the reverse order, as the following code demonstrates.\n\
    \n```csharp\nIngredient[] ingredients = {\n  new Ingredient {Name = \"Sugar\"\
    , Calories = 500},\n  new Ingredient {Name = \"Milk\", Calories = 100},\n  new\
    \ Ingredient {Name = \"Egg\", Calories = 100},\n  new Ingredient {Name = \"Flour\"\
    , Calories = 500},\n  new Ingredient {Name = \"Butter\", Calories = 200}\n};\n\
    \nvar query = ingredients.OrderByDescending(x => x.Calories);\n\nforeach (var\
    \ item in query) {\n  Console.WriteLine(item.Name + \" \" + item.Calories);\n\
    }\n```\n\nThis produces the following output:\n\nSugar 500\nFlour 500\nButter\
    \ 200\nMilk 100\nEgg 100\n\nNote that this time the calorie numbers are in descending\
    \ order.\n\n# Query expression usage\n\nThe descending keyword is used when using\
    \ the query expression style, and is applied after the sort expression itself,\
    \ as shown in the following code.\n\n```csharp\nvar query = from i in ingredients\n\
    \              orderby i.Calories descending\nselect i;\n```\n\n# ThenByDescending\n\
    \nThe ThenByDescending query operator follows the same usage as the ThenBy operator,\
    \ and returns results in reverse sort order. The following code shows the ingredients\
    \ being sorted by calorie (in ascending order), by the ingredient names, but this\
    \ time the names are sorted in descending order.\n\n```csharp\nIngredient[] ingredients\
    \ = {\n  new Ingredient {Name = \"Flour\", Calories = 500},\n  new Ingredient\
    \ {Name = \"Sugar\", Calories = 500},\n  new Ingredient {Name = \"Egg\", Calories\
    \ = 100},\n  new Ingredient {Name = \"Milk\", Calories = 100},\n  new Ingredient\
    \ {Name = \"Butter\", Calories = 200}\n};\nvar query = ingredients.OrderBy(x =>\
    \ x.Calories).ThenByDescending(x => x.Name);\n\nforeach (var item in query) {\n\
    \  Console.WriteLine(item.Name + \" \" + item.Calories);\n}\n```\n"
  mdcn: "\n\n# Skip\n\nSkip 查询操作符忽略输入序列开头指定数量的输入元素，并返回剩余部分。\n\n以下代码跳过了前三个元素并返回其余部分：\n\
    \n```csharp\nIngredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\"\
    , Calories = 500},\n    new Ingredient {Name = \"Egg\", Calories = 100},\n   \
    \ new Ingredient {Name = \"Milk\", Calories = 150},\n    new Ingredient {Name\
    \ = \"Flour\", Calories = 50},\n    new Ingredient {Name = \"Butter\", Calories\
    \ = 200}\n};\nIEnumerable<Ingredient> query = ingredients.Skip(3);\n\nforeach\
    \ (var ingredient in query) {\n    Console.WriteLine(ingredient.Name);\n}\n```\n\
    \n这产生以下输出：\n\nFlour\nButter\n\n# 查询表达式用法\n\n在 Go查询表达式样式时，Skip 没有专门的关键字；但可以使用混合样式。\n\
    \n# 使用 Skip 和 Take 进行结果集分页\n\n当结合使用时，Skip 和 Take 查询操作符可以实现面向用户的结果集分页，如下代码所示。\n\
    \n```csharp\nIngredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\"\
    , Calories = 500},\n    new Ingredient {Name = \"Egg\", Calories = 100},\n   \
    \ new Ingredient {Name = \"Milk\", Calories = 150},\n    new Ingredient {Name\
    \ = \"Flour\", Calories = 50},\n    new Ingredient {Name = \"Butter\", Calories\
    \ = 200}\n};\n\nIEnumerable<Ingredient> firstPage = ingredients.Take(2);\n\nIEnumerable<Ingredient>\
    \ secondPage = ingredients\n  .Skip(2)\n  .Take(2);\n\nIEnumerable<Ingredient>\
    \ thirdPage = ingredients\n  .Skip(4)\n  .Take(2);\n\nConsole.WriteLine(\"Page\
    \ One:\");\nforeach (var ingredient in firstPage)\n{\n  Console.WriteLine(\" -\
    \ \" + ingredient.Name);\n}\n\nConsole.WriteLine(\"Page Two:\");\nforeach (var\
    \ ingredient in secondPage)\n{\n  Console.WriteLine(\" - \" + ingredient.Name);\n\
    }\n\nConsole.WriteLine(\"Page Three:\");\nforeach (var ingredient in thirdPage)\n\
    {\n  Console.WriteLine(\" - \" + ingredient.Name);\n}\n```\n\n这产生以下输出：\n\n- Page\
    \ One:\n- Sugar\n- Egg\n- Page Two:\n- Milk\n- Flour\n- Page Three:\n- Butter\n\
    \n# SkipWhile\n\n与 TakeWhile 类似，SkipWhile 查询操作符使用谓词评估输入序列中的每个元素。SkipWhile 忽略输入序列中的项，直到提供的谓词返回\
    \ false。\n\n以下代码将跳过输入元素，直到遇到 \"Milk\"；此时，谓词 `x => x.Name != \"Milk\"` 变为 false并返回剩余的食材。\n\
    \n```csharp\nIngredient[] ingredients = {\n  new Ingredient {Name = \"Sugar\"\
    , Calories = 500},\n  new Ingredient {Name = \"Egg\", Calories = 100},\n  new\
    \ Ingredient {Name = \"Milk\", Calories = 150},\n  new Ingredient {Name = \"Flour\"\
    , Calories = 50},\n  new Ingredient {Name = \"Butter\", Calories = 200}\n};\n\n\
    IEnumerable<Ingredient> query = ingredients.SkipWhile(x => x.Name != \"Milk\"\
    );\n\nforeach (var ingredient in query) {\n  Console.WriteLine(ingredient.Name);\n\
    }\n```\n\n这产生以下输出：\n\nMilk\nFlour\nButter\n\n正如 TakeWhile 一样，SkipWhile 有一个重载版本允许使用输入元素的位置索引。\n\
    \n# 查询表达式用法\n\n在 Go查询表达式样式时，SkipWhile 没有专门的关键字；但可以使用混合样式。\n\n# 排序操作符\n\n排序查询操作符返回与输入序列相同数量的元素，但排列顺序（可能是）不同的。\n\
    \n# OrderBy\n\nOrderBy 查询操作符通过指定的键比较输入序列中的元素对输入序列进行排序。\n\n以下代码显示了对简单的字符串输入序列的排序。在此示例中，由\
    \ lambda 表达式 `x => x` 指定字符串本身。\n\n```csharp\nstring[] ingredients = {\n  \"Sugar\"\
    ,\n  \"Egg\",\n  \"Milk\",\n  \"Flour\",\n  \"Butter\"\n};\n\nvar query = ingredients.OrderBy(x\
    \ => x);\n\nforeach (var item in query) {\n  Console.WriteLine(item);\n}\n```\n\
    \n这产生以下输出：\n\nButter\nEgg\nFlour\nMilk\nSugar\n\n用于指定排序的 lambda 表达式可以指定输入元素的属性，如下代码所示。\n\
    \n```csharp\nIngredient[] ingredients = {\n  new Ingredient {Name = \"Sugar\"\
    , Calories = 500},\n  new Ingredient {Name = \"Egg\", Calories = 100},\n  new\
    \ Ingredient {Name = \"Milk\", Calories = 150},\n  new Ingredient {Name = \"Flour\"\
    , Calories = 50},\n  new Ingredient {Name = \"Butter\", Calories = 200}\n};\n\n\
    var query = ingredients.OrderBy(x => x.Calories);\n\nforeach (var item in query)\
    \ {\n  Console.WriteLine(item.Name + \" \" + item.Calories);\n}\n```\n\n在前面的代码中，lambda\
    \ 表达式 `x => x.Calories` 选择了要排序的 Calories 属性。这产生了以下输出：\n\nFlour 50\nEgg 100\nMilk\
    \ 150\nButter 200\nSugar 500\n\n# 查询表达式用法\n\n在使用 Go查询表达式样式时使用 `orderby` 关键字，如下所示。\n\
    \n```csharp\nvar query = from i in ingredients\n            orderby i.Calories\n\
    select i;\n```\n\n# ThenBy\n\nThenBy 查询操作符可以在 OrderBy 之后链式一次或多次。ThenBy 操作符添加额外的排序级别。在以下代码中，食材首先通过\
    \ OrderBy 排序按卡里量排序；排序后的序列进一步按食材名称进行排序。\n\n```csharp\nIngredient[] ingredients\
    \ = {\n  new Ingredient {Name = \"Sugar\", Calories = 500},\n  new Ingredient\
    \ {Name = \"Milk\", Calories = 100},\n  new Ingredient {Name = \"Egg\", Calories\
    \ = 100},\n  new Ingredient {Name = \"Flour\", Calories = 500},\n  new Ingredient\
    \ {Name = \"Butter\", Calories = 200}\n};\n\nvar query = ingredients.OrderBy(x\
    \ => x.Calories)\n      .ThenBy(x => x.Name);\n\nforeach (var item in query) {\n\
    \  Console.WriteLine(item.Name + \" \" + item.Calories);\n}\n```\n\n这产生了以下输出：\n\
    \nEgg 100\nMilk 100\nButter 200\nFlour 500\nSugar 500\n\n注意在原始输入序列中 \"Milk\" 在\
    \ \"Egg\" 之前，但由于 Then 操作，输出中的食材在相同值内进行了排序。\n\n# 查询表达式用法\n\n在使用 Go查询表达式样式时使用 `orderby`\
    \ 关键字，而不是单个排序表达式，后续排序表达式作为逗号分隔列表添加，如下代码所示。\n\n```csharp\nvar query = from i in\
    \ ingredients\n            orderby i.Calories, i.Name\nselect i;\n```\n\n# OrderByDescending\n\
    \nOrderByDescending 查询操作符与 OrderBy 操作符相同，只是以反序返回结果，如下代码所示。\n\n```csharp\nIngredient[]\
    \ ingredients = {\n  new Ingredient {Name = \"Sugar\", Calories = 500},\n  new\
    \ Ingredient {Name = \"Milk\", Calories = 100},\n  new Ingredient {Name = \"Egg\"\
    , Calories = 100},\n  new Ingredient {Name = \"Flour\", Calories = 500},\n  new\
    \ Ingredient {Name = \"Butter\", Calories = 200}\n};\n\nvar query = ingredients.OrderByDescending(x\
    \ => x.Calories);\n\nforeach (var item in query) {\n  Console.WriteLine(item.Name\
    \ + \" \" + item.Calories);\n}\n```\n\n这产生了以下输出：\n\nSugar 500\nFlour 500\nButter\
    \ 200\nMilk 100\nEgg 100\n\n注意这次卡里量数字是降序的。\n\n# 查询表达式用法\n\n在使用 Go查询表达式样式时使用 `descending`\
    \ 关键字，并应用于排序表达式本身，如下所示。\n\n```csharp\nvar query = from i in ingredients\n    \
    \          orderby i.Calories descending\nselect i;\n```\n\n# ThenByDescending\n\
    \nThenByDescending 查询操作符用法与 ThenBy 操作符相同，并返回反序排序结果。以下代码显示食材按卡里量（升序）排序，但这次名称是降序排序的。\n\
    \n```csharp\nIngredient[] ingredients = {\n  new Ingredient {Name = \"Flour\"\
    , Calories = 500},\n  new Ingredient {Name = \"Sugar\", Calories = 500},\n  new\
    \ Ingredient {Name = \"Egg\", Calories = 100},\n  new Ingredient {Name = \"Milk\"\
    , Calories = 100},\n  new Ingredient {Name = \"Butter\", Calories = 200}\n};\n\
    var query = ingredients.OrderBy(x => x.Calories).ThenByDescending(x => x.Name);\n\
    \nforeach (var item in query) {\n  Console.WriteLine(item.Name + \" \" + item.Calories);\n\
    }\n```\n\n"
