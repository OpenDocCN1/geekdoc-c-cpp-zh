- md: "\n## FirstOrDefault\n\nThe FirstOrDefault query operator works in a similar\
    \ way to First, but instead of an exception being thrown, the default value for\
    \ the element type is returned. This default value will be null for reference\
    \ types, zero for numeric types, and false for Boolean types.\n\nThe following\
    \ code uses FirstOrDefault with an empty sequence:\n\n```\nIngredient[] ingredients\
    \ = { };\nIngredient element = ingredients.FirstOrDefault();\nConsole.WriteLine(element\
    \ == null);\n```\n\nThis produces the following output:\n\nTrue\n\nNotice that\
    \ no exception is thrown, and the resulting element is set to null. The same behavior\
    \ is true for the version of FirstOrDefault that takes a predicate, as the following\
    \ examples.\n\n```\nIngredient[] ingredients = {\n    new Ingredient {Name = \"\
    Sugar\", Calories = 500},\n    new Ingredient {Name = \"Egg\", Calories = 100},\n\
    \    new Ingredient {Name = \"Milk\", Calories = 150},\n    new Ingredient {Name\
    \ = \"Flour\", Calories = 50},\n    new Ingredient {Name = \"Butter\", Calories\
    \ = 500}\n}\n```\n\n```\nIngredient element = ingredients.FirstOrDefault(x =>\
    \ x.Calories == 9999);\nConsole.WriteLine(element == null);\n```\n\nThis produces\
    \ the following output:\n\nTrue\n\n## Query expression usage\n\nThere is no keyword\
    \ for FirstOrDefault when using the query expression style; however, mixed style\
    \ can be used.\n\n## Last\n\nThe Last query operator returns the final element\
    \ in the input sequence. As with First, there is an overloaded version that also\
    \ takes a predicate. This predicate version will return the last element in the\
    \ sequence that satisfies the predicate. Also as with First, an exception will\
    \ be thrown if the input sequence contains zero elements, or if the predicate\
    \ cannot be satisfied by any element.\n\nThe following code shows the predicate\
    \ version of Last.\n\n```\nIngredient[] ingredients = {\n    new Ingredient {Name\
    \ = \"Sugar\", Calories = 500};\n    new Ingredient {Name = \"Egg\", Calories\
    \ = 100};\n    new Ingredient {Name = \"Milk\", Calories = 50};\n    new Ingredient\
    \ {Name = \"Flour\", Calories = 50};\n    new Ingredient {Name = \"Butter\", Calories\
    \ = 500};\n};\n\nIngredient element = ingredients.Last(x => x.Calories == 50);\n\
    \nConsole.WriteLine(element.Name);\n```\n\nThis produces the following output:\n\
    \nFlour\n\nNotice here that \"Flour\" is not the last element in the sequence\
    \ as a whole, but rather the last element that has 50 calories.\n\n## Query expression\
    \ usage\n\nThere is no keyword for Last when using the query expression style;\
    \ however, mixed style can be used.\n\n## LastOrDefault\n\nThe LastOrDefault query\
    \ operator works in a similar way to Last, and also has an overloaded version\
    \ that takes a predicate.\n\nLike FirstOrDefault, if the input sequence is empty\
    \ or no element satisfies the predicate, rather than an exception being thrown,\
    \ the default value for the element type is returned instead.\n\n## Query expression\
    \ usage\n\nThere is no keyword for LastOrDefault when using the query expression\
    \ style; however, mixed style can be used.\n\n## Single\n\nThe Single query operator\
    \ returns the only element in the input sequence. If the input sequence contains\
    \ more than one element, the following code uses Single to retrieve the only element\
    \ in the input sequence.\n\n```\nIngredient[] ingredients = {\n    new Ingredient\
    \ {Name = \"Sugar\", Calories = 500};\n}\nIngredient element = ingredients.Single();\n\
    Console.WriteLine(element.Name);\n```\n\nThis produces the following output:\n\
    \nSugar\n\nThere is an overload of Single that allows a predicate to be specified.\
    \ The predicate will locate and return the single element that matches it. If\
    \ there is more than one element in the input sequence that matches the predicate,\
    \ then an exception will be thrown: \"System.InvalidOperationException : Sequence\
    \ contains more than one element.\".\n\nThe following code shows how to use the\
    \ predicate version of Single. Even though there is more than one element in the\
    \ input sequence, because there is not more than one element that matches the\
    \ predicate, an exception will not be thrown.\n\n```\nIngredient[] ingredients\
    \ = {\n    new Ingredient {Name = \"Sugar\", Calories = 500};\n    new Ingredient\
    \ {Name = \"Butter\", Calories = 150};\n    new Ingredient {Name = \"Milk\", Calories\
    \ = 500};\n}\nIngredient element = ingredients.Single(x => x.Calories == 150);\n\
    Console.WriteLine(element.Name);\n```\n\nThis produces the following output:\n\
    \nButter\n\nIf the predicate is changed (as in the following code) so that it\
    \ matches more than one element, then an exception will be thrown.\n\n```\nIngredient[]\
    \ ingredients = {\n    new Ingredient {Name = \"Sugar\", Calories = 500},\n  \
    \  new Ingredient {Name = \"Butter\", Calories = 150},\n    new Ingredient {Name\
    \ = \"Milk\", Calories = 500}\n}\n\nIngredient element = ingredients.Single(x\
    \ => x.Calories == 500);\n```\n\nNotice the predicate in the preceding code will\
    \ find two ingredients with calories of 500, there will be an exception.\n\n##\
    \ Query expression usage\n\nThere is no keyword for Single when using the query\
    \ expression style; however, mixed style can be used.\n\n## SingleOrDefault\n\n\
    The SingleOrDefault query operator works in a similar fashion to Single. However,\
    \ rather than throwing an exception when there are zero input elements, the default\
    \ for the type is returned. The predicate version is being used and no matching\
    \ elements are found, the default value is again returned, rather than an exception\
    \ (as happens with Single). To summarize, SingleOrDefault to not throw an exception,\
    \ either zero or one element must be found. Zero elements or more than one element\
    \ will result in an exception.\n\nThe following code shows the predicate version\
    \ of SingleOrDefault being used where there will be matching elements found for\
    \ 9,999.\n\n```\nIngredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\"\
    , Calories = 500},\n    new Ingredient {Name = \"Egg\", Calories = 100},\n   \
    \ new Ingredient {Name = \"Milk\", Calories = 500}\n}\nIngredient element = ingredients.SingleOrDefault(x\
    \ => x.Calories == 9999);\nConsole.WriteLine(element == null);\n```\n\nThis produces\
    \ the following output:\n\nTrue\n\nNote that no exception is thrown, rather the\
    \ default value (null) is returned.\n\n## Query expression usage\n\nThere is no\
    \ keyword for SingleOrDefault when using the query expression style; however,\
    \ mixed style can be used.\n\n## ElementAt\n\nThe ElementAt query operator returns\
    \ the element that exists at the specified position in the input sequence.\n\n\
    The following code selects the third element from the input sequence.\n\n```\n\
    Ingredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\", Calories =\
    \ 500},\n    new Ingredient {Name = \"Egg\", Calories = 100},\n    new Ingredient\
    \ {Name = \"Milk\", Calories = 500}\n};\n\nIngredient element = ingredients.ElementAt(2);\n\
    Console.WriteLine(element.Name);\n```\n\nThis produces the following output:\n\
    \nMilk\n\nNotice that the value passed to ElementAt is a zero-based index; for\
    \ example, to select the first element, the value would be 0.\n\nIf the value\
    \ passed to ElementAt tries to select an element that is greater than the number\
    \ of elements in the input sequence, an exception will be thrown: \"Index was\
    \ out of range. Must be non-negative and less than the size of the collection.\"\
    \n\n## Query expression usage\n\nThere is no keyword for ElementAt when using\
    \ the query expression style; however, mixed style can be used.\n\n## ElementAtOrDefault\n\
    \nThe ElementAtOrDefault query operator works in a similar way to ElementAt, but\
    \ rather than throw an exception if the value passed to it exceeds the size of\
    \ the input sequence, it will return the default value for the input type. The\
    \ following code demonstrates this.\n\n```\nIngredient[] ingredients = {\n   \
    \ new Ingredient {Name = \"Sugar\", Calories = 500},\n    new Ingredient {Name\
    \ = \"Egg\", Calories = 100},\n    new Ingredient {Name = \"Milk\", Calories =\
    \ 500}\n}\nIngredient element = ingredients.ElementAtOrDefault(4);\nConsole.WriteLine(element\
    \ == null);\n```\n\nThis produces the following output:\n\nTrue\n\n## Query expression\
    \ usage\n\nThere is no keyword for ElementAtOrDefault when using the query expression\
    \ style; however, mixed style can be used.\n\n## DefaultEmpty\n\nThe DefaultEmpty\
    \ query operator takes an input sequence and does one of two things. If the input\
    \ sequence contains at least one element, then the input sequence is returned\
    \ without any changes. If, however, the input sequence contains zero elements,\
    \ the output sequence returned will not be empty; it will contain a single element\
    \ with a default value.\n\nThe following code shows what happens when the input\
    \ sequence contains elements.\n\n```\nIngredient[] ingredients = {\nnew Ingredient\
    \ {Name = \"Sugar\", Calories = 500},\nnew Ingredient {Name = \"Egg\", Calories\
    \ = 100},\nnew Ingredient {Name = \"Milk\", Calories = 50}\n}\nIEnumerable<Ingredient>\
    \ query = ingredients.DefaultEmpty();\nforeach (Ingredient item in query) {\n\
    Console.WriteLine(item.Name);\n}\n```\n\nThis produces the following output:\n"
  mdcn: "\n\n## FirstOrDefault\n\nFirstOrDefault 查询操作符的工作方式与 First 类似，但它不是抛出异常，而是返回元素类型的默认值。对于引用类型，该默认值为\
    \ `null`；对于数值类型为 `0`；对于布尔类型为 `false`。\n\n以下代码在空序列上使用了 FirstOrDefault：\n\n```\n\
    Ingredient[] ingredients = { };\nIngredient element = ingredients.FirstOrDefault();\n\
    Console.WriteLine(element == null);\n```\n\n这产生以下输出：\n\nTrue\n\n注意，没有抛出异常，并且结果元素被设置为\
    \ `null`。对于接受谓词的 FirstOrDefault 版本，其行为也是相同的，如下例所示。\n\n```\nIngredient[] ingredients\
    \ = {\n    new Ingredient {Name = \"Sugar\", Calories = 500},\n    new Ingredient\
    \ {Name = \"Egg\", Calories = 100},\n    new Ingredient {Name = \"Milk\", Calories\
    \ = 150},\n    new Ingredient {Name = \"Flour\", Calories = 50},\n    new Ingredient\
    \ {Name = \"Butter\", Calories = 500}\n}\n```\n\n```\nIngredient element = ingredients.FirstOrDefault(x\
    \ => x.Calories == 9999);\nConsole.WriteLine(element == null);\n```\n\n这产生以下输出：\n\
    \nTrue\n\n## 查询表达式用法\n\n在使用查询表达式风格时，没有 FirstOrDefault 关键字；但是，可以使用混合样式。\n\n## Last\n\
    \nLast 查询操作符返回输入序列中的最后一个元素。与 First 一样，它也有一个接受谓词的重载版本。该谓词版本将返回序列中满足谓词的最后一个元素。同样与\
    \ First一样，如果输入序列包含零元素，或者任何元素都无法满足谓词，则将抛出异常。\n\n以下代码展示了 Last 的谓词版本。\n\n```\nIngredient[]\
    \ ingredients = {\n    new Ingredient {Name = \"Sugar\", Calories = 500};\n  \
    \  new Ingredient {Name = \"Egg\", Calories = 100};\n    new Ingredient {Name\
    \ = \"Milk\", Calories = 50};\n    new Ingredient {Name = \"Flour\", Calories\
    \ = 50};\n    new Ingredient {Name = \"Butter\", Calories = 500};\n};\n\nIngredient\
    \ element = ingredients.Last(x => x.Calories == 50);\n\nConsole.WriteLine(element.Name);\n\
    ```\n\n这产生以下输出：\n\nFlour\n\n注意，这里 \"Flour\"并不是整个序列的最后一个元素，而是具有 50 卡路里的最后一个元素。\n\
    \n## 查询表达式用法\n\n在使用查询表达式风格时，没有 Last 关键字；但是，可以使用混合样式。\n\n## LastOrDefault\n\nLastOrDefault\
    \ 查询操作符的工作方式与 Last 类似，也有一个接受谓词的重载版本。\n\n与 FirstOrDefault 类似，如果输入序列为空或没有元素满足谓词，则不是抛出异常，而是返回元素类型的默认值。\n\
    \n## 查询表达式用法\n\n在使用查询表达式风格时，没有 LastOrDefault 关键字；但是，可以使用混合样式。\n\n## Single\n\n\
    Single 查询操作符返回输入序列中的唯一元素。如果输入序列包含多个元素，以下代码使用 Single 来检索输入序列中的唯一元素。\n\n```\nIngredient[]\
    \ ingredients = {\n    new Ingredient {Name = \"Sugar\", Calories = 500};\n}\n\
    Ingredient element = ingredients.Single();\nConsole.WriteLine(element.Name);\n\
    ```\n\n这产生以下输出：\n\nSugar\n\nSingle 有一个重载版本允许指定谓词。该谓词将定位并返回匹配它的唯一元素。如果输入序列中有多个元素匹配谓词，则将抛出异常：“System.InvalidOperationException\
    \ : Sequence contains more than one element.”。\n\n以下代码展示了如何使用 Single 的谓词版本。虽然输入序列中有多个元素，但由于没有多个匹配谓词的元素，因此不会抛出异常。\n\
    \n```\nIngredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\", Calories\
    \ = 500};\n    new Ingredient {Name = \"Butter\", Calories = 150};\n    new Ingredient\
    \ {Name = \"Milk\", Calories = 500};\n}\nIngredient element = ingredients.Single(x\
    \ => x.Calories == 150);\nConsole.WriteLine(element.Name);\n```\n\n这产生以下输出：\n\n\
    Butter\n\n如果更改了谓词（如下面的代码所示）使其匹配多个元素，则将抛出异常。\n\n```\nIngredient[] ingredients =\
    \ {\n    new Ingredient {Name = \"Sugar\", Calories = 500},\n    new Ingredient\
    \ {Name = \"Butter\", Calories = 150},\n    new Ingredient {Name = \"Milk\", Calories\
    \ = 500}\n}\n\nIngredient element = ingredients.Single(x => x.Calories == 500);\n\
    ```\n\n注意上述代码中的谓词将找到两个卡路里为 500 的成分，这将抛出异常。\n\n## 查询表达式用法\n\n在使用查询表达式风格时，没有 Single\
    \ 关键字；但是，可以使用混合样式。\n\n## SingleOrDefault\n\nSingleOrDefault 查询操作符的工作方式与 Single\
    \ 相似。然而，当输入元素不存在时，它不是抛出异常，而是返回类型的默认值。在使用谓词版本且没有找到匹配元素时，同样返回默认值，而不是抛出异常（如 Single\
    \ 所示）。总结来说，为了 SingleOrDefault 不抛出异常，必须找到零个或一个元素。零个元素或多个元素将导致异常。\n\n以下代码展示了 SingleOrDefault\
    \ 的谓词版本，在没有找到 9999 个匹配元素的情况下。\n\n```\nIngredient[] ingredients = {\n    new Ingredient\
    \ {Name = \"Sugar\", Calories = 500},\n    new Ingredient {Name = \"Egg\", Calories\
    \ = 100},\n    new Ingredient {Name = \"Milk\", Calories = 500}\n}\nIngredient\
    \ element = ingredients.SingleOrDefault(x => x.Calories == 9999);\nConsole.WriteLine(element\
    \ == null);\n```\n\n这产生以下输出：\n\nTrue\n\n注意没有抛出异常，而是返回了默认值（null）。\n\n## 查询表达式用法\n\
    \n在使用查询表达式风格时，没有 SingleOrDefault 关键字；但是，可以使用混合样式。\n\n## ElementAt\n\nElementAt\
    \ 查询操作符返回输入序列中指定位置的元素。\n\n以下代码从输入序列选择第三个元素。\n\n```\nIngredient[] ingredients =\
    \ {\n    new Ingredient {Name = \"Sugar\", Calories = 500},\n    new Ingredient\
    \ {Name = \"Egg\", Calories = 100},\n    new Ingredient {Name = \"Milk\", Calories\
    \ = 500}\n};\n\nIngredient element = ingredients.ElementAt(2);\nConsole.WriteLine(element.Name);\n\
    ```\n\n这产生以下输出：\n\nMilk\n\n注意传递给 ElementAt 的值是从零开始的索引；例如，选择第一个元素的值应为 0。\n\n如果传递给\
    \ ElementAt 的值大于输入序列中的元素数量，将抛出异常：“Index was out of range. Must be non-negative\
    \ and less than the size of the collection.”。\n\n## 查询表达式用法\n\n在使用查询表达式风格时，没有\
    \ ElementAt 关键字；但是，可以使用混合样式。\n\n## ElementAtOrDefault\n\nElementAtOrDefault 查询操作符的工作方式与\
    \ ElementAt 类似，但如果传递给它的值超过序列的大小，它将返回输入类型的默认值。以下代码演示了这一点。\n\n```\nIngredient[]\
    \ ingredients = {\n    new Ingredient {Name = \"Sugar\", Calories = 500},\n  \
    \  new Ingredient {Name = \"Egg\", Calories = 100},\n    new Ingredient {Name\
    \ = \"Milk\", Calories = 500}\n}\nIngredient element = ingredients.ElementAtOrDefault(4);\n\
    Console.WriteLine(element == null);\n```\n\n这产生以下输出：\n\nTrue\n\n## 查询表达式用法\n\n\
    在使用查询表达式风格时，没有 ElementAtOrDefault 关键字；但是，可以使用混合样式。\n\n## DefaultEmpty\n\nDefaultEmpty\
    \ 查询操作符接收输入序列并执行两种操作之一。如果输入序列包含至少一个元素，则返回输入序列。然而，如果输入序列包含零元素，返回的输出序列将为空；它将包含一个具有默认值的元素。\n\
    \n以下代码展示了当输入序列包含元素时的情况。\n\n```\nIngredient[] ingredients = {\nnew Ingredient {Name\
    \ = \"Sugar\", Calories = 500},\nnew Ingredient {Name = \"Egg\", Calories = 100},\n\
    new Ingredient {Name = \"Milk\", Calories = 50}\n}\nIEnumerable<Ingredient> query\
    \ = ingredients.DefaultEmpty();\nforeach (Ingredient item in query) {\nConsole.WriteLine(item.Name);\n\
    }\n```\n\n这产生以下输出：\n\nSugar\nEgg\nMilk\n\n"
