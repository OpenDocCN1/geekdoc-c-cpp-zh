- md: "\n# Chapter 5 Interpreted Queries\n\n## Overview\n\nUp until this point in\
    \ the book, we have focused mainly on local queries. Local queries are those that\
    \ operate on IEnumerable<T> sequences. Local queries result in the query operators\
    \ that are defined in the System.Linq.Enumerable class being executed. In this\
    \ way, executing local queries results in specific code running (from the query\
    \ operators in the Enumerable class) as defined at compile time.\n\nInterpreted\
    \ queries, on the other hand, describe the \"shape\" of the query that is instead\
    \ interpreted at runtime—hence the name \"interpreted\". Interpreted queries operate\
    \ on IQueryable<T> sequences, and when writing LINQ, the query operators resolve\
    \ to methods defined in the System.Linq.Queryable class rather than with local.\n\
    \nAnother way to think about the difference between local IEnumerable<T> queries\
    \ and interpreted IQueryable<T> queries is that the local queries contain the\
    \ actual implementation code that gets executed, whereas the interpreted query\
    \ operators do not. The actual code that gets executed and returns some result\
    \ is defined in a query provider. The query provider is passed the description\
    \ of the query that needs to be executed; it executes the query (for example,\
    \ executing SQL against a database) and returns the result.\n\n## Expression trees\n\
    \nThe query operators that work on IQueryable<T> differ from their equivalent\
    \ versions for local queries.\n\nLocal IEnumerable<T> versions of query operators\
    \ take delegates as parameters (often described using a lambda expression). In\
    \ contrast, interpreted queries take expression trees as parameters.\n\nBecause\
    \ C# will implicitly convert a lambda expression when used as a query operator\
    \ parameter to an expression, the same lambda expression can be used regardless\
    \ of whether the query operator is a local or remote one of where query operator\
    \ and the interpreted IQueryable<T> version is being used. Notice that the lambda\
    \ expression is the same in both cases.\n\n```csharp\nIQueryable<int> interpretedQuery\
    \ = remoteData.Where(x => x > 100);\nIEnumerable<int> localQuery = localData.Where(x\
    \ => x > 100);\n```\n\nThe following code shows the method signatures for the\
    \ Where query operator for both the local and interpreted versions.\n\n```csharp\n\
    // Local version of Where from System.Linq.Enumerable\npublic static IEnumerable<TSource>\
    \ Where<TSource>(this IEnumerable<TSource>\nsource, Func<TSource, bool> predicate)\n\
    \n// Interpreted version of Where from System.Linq.Queryable\npublic static IQueryable<TSource>\
    \ Where<TSource>(this IQueryable<TSource>\nsource, Expression<Func<TSource, bool>>\
    \ predicate)\n```\n\nIn noticing the code that the local version takes a predicate\
    \ parameter of type Func<TSource, bool>. Contrast this with the interpreted version\
    \ where the predicate parameter is Expression<Func<TSource, bool>>. This is the\
    \ expression that the query provider can turn into meaningful code execution,\
    \ such as generating an equivalent SQL statement and executing against a database.\n\
    \nBecause IQueryable<T> is a subtype of IEnumerable<T>, the compiler has to choose\
    \ whether to use the local or remote version of query operator. The compiler dictates\
    \ that the more specific version will be chosen. IQueryable<T> is more specific\
    \ than IEnumerable<T>, the compiler will choose the interpreted versions of the\
    \ query operators (as defined in System.Linq.Query) when dealing with interpreted\
    \ queries, and local versions of query operators (as defined in System.Linq.Enumerable)\
    \ when dealing with local queries. This fact (and C#'s implicit conversion of\
    \ lambda expressions to Expression<T>) means that LINQ queries can provide a unified\
    \ API regardless of whether the query is a local one or a remote interpreted query.\n\
    \n> Note: Not all of the standard query operators will be supported by all interpreted\
    \ query providers.\n\n## Query providers\n\nMicrosoft™ has pre-built query providers\
    \ that operate with databases, such as the older LINQ to SQL and the new Entity\
    \ Framework.\n\nThere are also numerous third-party or open source query providers\
    \ including:\n\n- LINQ to Twitter\n- LINQ to Flickr\n- LINQ to JSON\n\nThese examples\
    \ serve to demonstrate the powerful and flexible nature of LINQ interpreted queries.\
    \ Remote data stores of different types can be queried using a common set of LINQ\
    \ query operators.\n\nIn addition to LINQ providers built by others, it is also\
    \ possible to create them ourselves, though the work may be quite involved.\n\n\
    ## Entity Framework\n\nAs an example of using LINQ to query a database using Entity\
    \ Framework, imagine a SQL Server database that contains the following entities\
    \ (tables).\n\n```csharp\npublic class Recipe {\n  public int ID { get; set; }\n\
    \  public string Name { get; set; }\n  public virtual ICollection<Review> Reviews\
    \ { get; set; }\n}\n\npublic class Review {\n  public int ID { get; set; }\n \
    \ public int RecipeID { get; set; }\n  public string ReviewText { get; set; }\n\
    \  public virtual Recipe Recipe { get; set; }\n}\n```\n\nIn the preceding code,\
    \ the model represents that a recipe can have multiple reviews.\n\n> Tip: To learn\
    \ more about using Entity Framework, be sure to check out the Entity Framework\
    \ Code First Succinctly eBook from Syncfusion.\n\nNow that the entities are defined,\
    \ a data context class can be defined, as the following code demonstrates.\n\n\
    ```csharp\npublic class RecipeDbContext : DbContext {\n  public RecipeDbContext()\
    \ : base(\"RecipeDbConnectionString\")\n  {\n  }\n  public DbSet<Recipe> Recipes\
    \ { get; set; }\n  public DbSet<Review> Reviews { get; set; }\n  protected override\
    \ void OnModelCreating(DbModelBuilder modelBuilder) {\n    modelBuilder.Conventions.Remove<PluralizingNameConvention>();\n\
    \  }\n}\n```\n\nA database initializer is created to always recreate the database\
    \ and populate it with some initial demo data, as the following code shows.\n\n\
    ```csharp\npublic class RecipeDbInitializer {\n    System.Data.Entity.CreateDatabaseAlways<RecipeDbContext>();\n\
    \    protected override void Seed(RecipeDbContext context) {\n        context.Recipes.Add(new\
    \ Recipe { Name = \"Cherry Pie\" });\n        context.Recipes.Add(new Recipe {\
    \ Name = \"Apple Pie\" });\n        context.SaveChanges();\n\n        context.Reviews.Add(new\
    \ Review { ReviewText = \"Quite nice\", RecipeID = 1 });\n        context.Reviews.Add(new\
    \ Review { ReviewText = \"I hate cherries!\", RecipeID = 1 });\n        context.Reviews.Add(new\
    \ Review { ReviewText = \"Ok\", RecipeID = 1 });\n        context.Reviews.Add(new\
    \ Review { ReviewText = \"Not too bad\", RecipeID = 2 });\n        context.SaveChanges();\n\
    \    }\n}\n```\n\nNow that there is an EF model and a database containing some\
    \ demo data, it can be queried using LINQ via the RecipeDbContext. The following\
    \ code shows how to use fluent style syntax to get all the recipes sorted by the\
    \ recipe name.\n\n```csharp\nRecipeDbContext ctx = new RecipeDbContext();\nIQueryable<Recipe>\
    \ allRecipes = ctx.Recipes\n    .OrderBy(x => x.Name);\nforeach (var recipe in\
    \ allRecipes)\n{\n    Console.WriteLine(recipe.Name);\n}\n```\n\nThis produces\
    \ the following output:\n\nApple Pie\nCherry Pie\n\nJust as local queries, query\
    \ expression syntax can also be used with interpreted queries.\n\nThe following\
    \ code shows the combination of using query expression syntax against an Entity\
    \ Framework model and projecting into X-DOM.\n\n```csharp\nRecipeDbContext ctx\
    \ = new RecipeDbContext();\n\nXElement xml = new XElement(\"recipes\",\nfrom rec\
    \ in ctx.Recipes.Include(x => x.Reviews).ToList()\nselect\n    new XElement(\"\
    recipe\",\n        new XAttribute(\"name\", rec.Name),\n        new XAttribute(\"\
    id\", rec.ID),\n        new XElement(\"reviews\",\n            from rev in rec.Reviews\n\
    \            new XElement(\"review\", rev.ReviewText)\n        )\n    ));\n\n\
    Console.WriteLine(xml);\n```\n\nThis produces the following output:\n\n```xml\n\
    <recipes>\n  <recipe name=\"Apple Pie\" id=\"2\">\n    <reviews>\n      <review>Not\
    \ too bad</review>\n    </reviews>\n  </recipe>\n  <recipe name=\"Cherry Pie\"\
    \ id=\"1\">\n    <reviews>\n      <review>Quite nice</review>\n      <review>I\
    \ hate cherries!</review>\n      <review>Ok</review>\n    </reviews>\n  </recipe>\n\
    </recipes>\n```\n"
