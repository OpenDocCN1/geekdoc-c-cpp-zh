    # XContainer


    An **XContainer** represents the idea of an item in the XML hierarchy that may
    have zero, one, or many children **XNode** objects. **XContainer** is an abstract
    class, so it cannot be instantiated directly; instead, either **XElement** or
    **XDocument** can be used.


    # XElement and XDocument


    An **XElement** represents an element in an XML document such as an `<ingredient>`
    element. An **XElement** can contain a value such as "Butter", and may contain
    zero, one, or many **XAttributes**. By virtue of inheriting from **XContainer**,
    it may also have child **XNode** objects that belong to.


    An **XDocument** wraps a root **XElement** to provide the additional capability
    of XML declaration items such as XML version and encoding, as well as other "header"
    items, such as a DTD for the XML document. Unless these kind of additional attributes
    are required, **XElement** is usually sufficient.


    # XAttribute


    An **XAttribute** represents an XML attribute on an XML element. For example,
    the calories attribute in the following XML would be represented as an **XAttribute**
    object: `<ingredient calories="500">`


    # XNode


    While an **XNode** object has the concept of belonging to a parent (**XElement**)
    node that it can navigate to, unlike **XContainer** (and its subclasses **XElement**
    and **XDocument**), it has no concept of having any child nodes.


    # XName


    **XName** is not part of the hierarchy, but it is used in many methods when wanting
    to specify node(s) to locate in the XML document hierarchy. It is used to represent
    the name of an XML element or attribute. In addition to representing elements
    as simple name strings, **XName** also contains logic for working with XML namespaces.


    # Creating an X-DOM


    There are a number of ways to arrive at an in-memory X-DOM, including loading
    XML files and instantiation through code.


    # Parsing Strings and Loading Files


    To create an **XElement** from a *string*, the static **Parse** method can be
    used, as the following code shows.'
