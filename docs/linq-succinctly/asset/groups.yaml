    \ runningTotal + currentElement);\nConsole.WriteLine(result);\n```\n\n这产生了以下输出：\n\
    \n6\n\n`Aggregate` 使用了种子值。\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有 `Aggregate` 关键字；但是，可以使用混合样式。\n\
    \n## 连接运算符 (Joining)\n\n`Join` 运算符连接两个序列，以某种方式合并它们。`Join` 运算符需要：\n\n- `IEnumerable<TOuter>`\
    \ 输出序列。\n- `Func<TOuter, TKey> outerKeySelector`: 输出序列的连接键。\n- `IEnumerable<TInner,\
    \ TKey> innerKeySelector`: 输入序列的连接键。\n- `Func<TOuter, TInner, TResult> resultSelector`:\
    \ 输出的结果。\n\n以下代码展示了 `Join` 的用法。注意结果选择器创建了一个包含“分组”（即配料名称）以及该配料对应的评论的匿名类型。\n\n```csharp\n\
    Ingredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\", Calories =\
    \ 500},\n    new Ingredient {Name = \"Egg\", Calories = 100},\n    new Ingredient\
    \ {Name = \"Milk\", Calories = 150},\n    new Ingredient {Name = \"Flour\", Calories\
    \ = 50},\n    new Ingredient {Name = \"Butter\", Calories = 400}\n};\n\nReview[]\
    \ reviews = {\n    new Review {RecipeId = 1, Text = \"Tasty!\"},\n    new Review\
    \ {RecipeId = 1, Text = \"Not nice\"},\n    new Review {RecipeId = 2, Text = \"\
    Pretty good\"},\n    new Review {RecipeId = 2, Text = \"Too hard\"},\n    new\
    \ Review {RecipeId = 3, Text = \"Loved it\"}\n};\n\nvar query = ingredients.Join(\n\
    \    reviews,\n    recipe => recipe.Id,\n    review => review.RecipeId,\n    (recipe,\
    \ review) => new\n    {\n        RecipeName = recipe.Name,\n        RecipeReview\
    \ = review.Text\n    }\n);\n\nforeach (var item in query)\n{\n    Console.WriteLine(item.RecipeName\
    \ + \" - \" + item.RecipeReview);\n}\n```\n\n这产生了输出：\n\nSugar - Tasty\nEgg - Pretty\
    \ good\nEgg - Too hard\n\n注意，在此输出中 \"Sachertorte\" 没有出现。这是因为 `Join` 执行的是内连接，因此输出序列中在输入序列中没有匹配项的元素将不会包含。\n\
    \n## 查询表达式用法\n\n在使用查询表达式样式时，使用 `join` 关键字。以下代码展示了如何使用查询表达式执行内连接。\n\n```csharp\n\
    var query = from recipe in ingredients\n    join review in reviews on recipe.Id\
    \ equals review.RecipeId\n    select new\n    {\n        RecipeName = recipe.Name,\n\
    \        RecipeReview = review.Text\n    };\n```\n\n提示：执行连接操作时考虑使用查询表达式，因为它通常更具读性。\n\
    \n## 分组连接 (GroupJoin)\n\n`GroupJoin` 查询连接内部和外部序列，类似于 `Join` 运算符；但 `GroupJoin`\
    \ 产生的是层次结果序列。输出序列本质上是一个分组，每个组都可以包含来自内部序列的项序列。\n\n`GroupJoin` 运算符需要：\n\n- `IEnumerable<TInner>\
    \ inner`: 内部序列。\n- `Func<TOuter, TKey> outerKeySelector`: 输出序列的连接键。\n- `IEnumerable<TInner,\
    \ TKey> innerKeySelector`: 输入序列的连接键。\n- `Func<TOuter, IEnumerable<TInner>, TResult>\
    \ resultSelector`: 输出分组的样式。\n\n注意最后一个参数与 `Join` 的 (`Func<TOuter, TInner, TResult>\
    \ resultSelector`) 不同。与其单个 `Inner`，`GroupJoin` 拥有 `IEnumerable<TInner>`。这个 `IEnumerable<TInner>`\
    \ 包含了与外部序列键匹配的所有内部序列元素；它本质上是属于该组的所有内部序列元素。\n\n以下代码展示了 `GroupJoin` 的用法。注意结果选择器创建了一个包含分组（即配料名称）以及其评论列表的匿名类型。\n\
    \n```csharp\nvar query = ingredients.GroupJoin(\n    reviews,\n    recipe => recipe.Id,\n\
    \    review => review.RecipeId,\n    (recipe, review) => new\n    {\n        RecipeName\
    \ = recipe.Name,\n        Reviews = review\n    }\n);\n\nforeach (var group in\
    \ query)\n{\n    Console.WriteLine(group.RecipeName);\n    foreach (var review\
    \ in group.Reviews)\n    {\n        Console.WriteLine(review.Text);\n    }\n}\n\
    ```\n\n"
