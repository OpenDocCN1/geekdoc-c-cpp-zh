    # The Story behind the Succinctly Series


    Daniel Jebaraj, Vice President Syncfusion, Inc.


    As many of you know, Syncfusion is a provider of software components for the Microsoft
    platform. This puts us in the exciting but challenging position of always being
    on the edge. Whenever platforms or tools shipping out every week, we have to educate
    ourselves quickly.


    # Information is plentiful but harder to digest


    In reality, this translates into a lot of book orders and searches. While more
    information is becoming available on the Internet, and more books being published,
    even on topics that are relatively new, one aspect continues to inhibit us inability
    to find technology. We are usually faced with two options: read several 500+ page
    books or scour the web for relevant blog posts and articles. Just like everyone
    else who has a job to do, we find this frustrating.


    # The Succinctly series


    We firmly believe, given the background knowledge developers have, most topics
    can be translated into books between 50 and 100 pages. This is exactly what we
    resolved to accomplish with the Succinctly series to change things better. Each
    author was carefully chosen from a pool of talented experts who shared our vision.
    The book you now hold in your hands, and the others available in this series,
    are a result of authors’ tireless work. You will find original content that is
    guaranteed to get you up and running in the time it takes to drink a few cups
    of coffee.


    # Free


    Syncfusion will be working to produce books on several topics. Any updates we
    publish will also be free. There is no catch here. Syncfusion has a vested interest
    in this effort. As a component vendor, our unique claim has always been that we
    offer deeper and broader frameworks than anyone else on the market. Developer
    education greatly helps us market and sell against competing vendors who promise
    to "enable AJAX support with one click"!


    # Let us know what you think


    If you have any topics of interest, thoughts, or feedback, please feel free to
    send them to us at succinctly-series@syncfusion.com. We sincerely hope you enjoy
    reading this book and that it helps you better understand the topic of study.
    Thank you for reading. Please follow us on Twitter and “Like” us on Facebook to
    help us spread the word about the Succinctly series!


    # About the Author


    Jason Roberts is a Microsoft C# MVP with over 13 years of commercial experience.
    He is a writer, blogger, open source contributor, and Pluralsight course author,
    and he holds a Bachelor of Science degree in computing.


    You can find him on Twitter as @robertsjason and at his blog at http://dontcodired.com/blog.


    # Chapter 1 LINQ Fundamentals


    # Why LINQ?


    At a high level, there are number of benefits that may be gained by using LINQ
    (Language Integrated Query), including:


    - Reduce the amount of code that needs writing.

    - A better understanding of the intent of what the code is doing.

    - Once learned, can use a similar set of LINQ query knowledge against different
    data sources (in-memory objects, or remote sources such as SQL Server or even
    Twitter).

    - Queries can be composed together and built up in stages.

    - Queries offer the safety of compile-time checking.


    Essentially, LINQ enables queries to be treated as first-class citizens in C#
    and Visual Basic.


    # The building blocks of LINQ


    The two fundamental building blocks of LINQ are the concepts of **elements** and
    **sequences**.


    A sequence can be thought of as a list of items, with each item being the element.
    A sequence is an instance of a class that implements the `IEnumerable<T>` interface.


    If an array of numbers were declared as: `int[] fibonacci = {0, 1, 1, 2, 3, 5};`
    the variable `fibonacci` represents a sequence with each `int` in the array being
    an individual element.


    A sequence could be a **local sequence** of in-memory objects or a **remote sequence**,
    like a SQL Server database. In case of remote data sources (for example SQL Server),
    remote sequences also implement the `IQueryable<T>` interface.


    Queries, or more specifically **query operators**, work on an **input sequence**
    and produce some output value. This output value could be a transformed version
    of the input sequence, i.e. an **output sequence** or single scalar value such
    as the count of elements in the input sequence.


    Queries that run on local sequences are known as **local queries** or **LINQ-to-objects**
    queries.


    There are a whole host of query operators that are implemented as extension methods
    in the static **System.Linq.Enumerable** class. This set of query operators are
    known as the **standard query operators**. These query operators will be covered
    in depth in the LINQ Query Operators chapter later in this book.

