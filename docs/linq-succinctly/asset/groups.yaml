    # Chapter 6 Parallel LINQ


    # # Overview


    The area of parallel programming is vast and potentially complicated. This chapter
    introduces parallel LINQ (PLINQ) as a method of reducing processing time when
    executing LINQ queries.


    PLINQ is a higher level abstraction that sits above various lower level .NET multithreading
    related components and aims to abstract away the lower-level details of multithreading,
    while at the same time offering the familiar LINQ query semantics.


    > Note: Because PLINQ is at a higher level of abstraction, the programmer still
    needs to have basic working knowledge of multithreaded programming.


    When converting a LINQ query to a PLINQ query, PLINQ takes care of the following
    lower-level aspects of parallelization:


    +   - Split the query work (input sequence) into a number of smaller sub-segments.

    - Execute query code against each sub-segment on different threads.

    - Once all sub-segments have been processed, reassemble all the results from the
    sub-segments back into a single output sequence.


    In this way, PLINQ may help reduce overall query processing time by utilizing
    multiple cores of the machine on which it is executing. It should also be noted
    that PLINQ works on local queries, as opposed to remote interpreted queries.


    Not all queries will benefit from PLINQ, and indeed, depending on the number of
    input elements and the amount of processing required. PLINQ queries may actually
    take longer to run due to the overhead of splitting/threading/reassembly. As with
    all performance-related tasks, measurements/profiling and methodical performance-tuning
    adjustments should be made rather than randomly turning LINQ queries in the code
    base using PLINQ.


    It should also be noted that using PLINQ is no guarantee of the query actually
    executing in parallel. This is not because all query operators are able to be
    parallelized. Even with those query operators that are parallelizable, during
    execution, PLINQ may decide to run them sequentially if it determines that it
    may perform better.


    # # Applying PLINQ


    To a normal LINQ query to a PLINQ query, this extension method is defined in the
    System.Linq.ParallelEnumerable class. When the AsParallel method is added to a
    query, it essentially "switches on" PLINQ for that query.'
