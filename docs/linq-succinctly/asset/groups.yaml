    # Chapter 1 LINQ Fundamentals


    # Why LINQ?


    At a high level, there are number of benefits that may be gained by using LINQ
    (Language Integrated Query), including:


    +   - Reduce the amount of code that needs writing.

    - A better understanding of the intent of what the code is doing.

    - Once learned, can use a similar set of LINQ query knowledge against different
    data sources (in-memory objects, or remote sources such as SQL Server or even
    Twitter).

    - Queries can be composed together and built up in stages.

    - Queries offer the safety of compile-time checking.


    Essentially, LINQ enables queries to be treated as first-class citizens in C#
    and Visual Basic.


    # The building blocks of LINQ


    The two fundamental building blocks of LINQ are the concepts of **elements** and
    **sequences**.


    A sequence can be thought of as a list of items, with each item in the being element.
    A sequence is an instance of a class that implements the `IEnumerable<T>` interface.


    If an array of numbers were declared as: `int[] fibonacci = {0, 1, 1, 2, 3, 5};`
    the variable `fibonacci` represents a sequence with each `int` in the array being
    an individual element.


    A sequence could be a **local sequence** of in-memory objects or a **remote sequence**,
    like a SQL Server database. In case of remote data sources (for example SQL Server),
    remote sequences also implement the `IQueryable<T>` interface.


    Queries, or more specifically **query operators**, work on an **input sequence**
    and produce some output value. This output value could be a transformed version
    of the input sequence, i.e. an **output sequence** or single scalar value such
    as the count of elements in the input sequence.


    Queries that run on local sequences are known as **local queries** or **LINQ-to-objects**
    queries.


    There are a whole host of query operators that are implemented as extension methods
    in the static **System.Linq.Enumerable** class. This set of query operators are
    known as the **standard query operators**. These query operators will be covered
    in depth in the LINQ Query Operators chapter later in this book.'
- md: "\nOne important thing to note when using query operators is that they do not\
    \ alter the input sequence; rather, the query operator will return a new sequence\
    \ (or a scalar value).\n\n## Scalar return values and output sequences\n\nA query\
    \ operator returns an output sequence or a scalar value. In the following code,\
    \ the input sequence fibonacci is operated by the Count query operator that produces\
    \ a single scalar value representing the number of elements in the input sequence.\
    \ The next sequence is operated by the Distinct query operator that produces a\
    \ new output sequence containing the elements from the input sequence, with duplicate\
    \ elements removed.\n\n```c\nint[] fibonacci = { 0, 1, 1, 2, 3, 5 };\n// Scalar\
    \ return value\nint numberOfElements = fibonacci.Count();\nConsole.WriteLine(\"\
    Count: {0}\", numberOfElements);\n// Output sequence return value\nIEnumerable<int>\
    \ distinctNumbers = fibonacci.Distinct();\nConsole.WriteLine(\"Elements in output\
    \ sequence:\");\nforeach (var number in distinctNumbers)\n{\n    Console.WriteLine(number);\n\
    }\n```\n\nThe output from this code produces the following:\n\nCount: 6\nElements\
    \ in output sequence:\n0\n1\n2\n3\n5\n\n## Deferred execution\n\nThe majority\
    \ of query operators do not execute immediately; their execution is deferred to\
    \ a later time in the program execution. This means that the query does not execute\
    \ when it is created, but when it is used or enumerated.\n\nDeferred execution\
    \ means that the input sequence can be modified after the query is constructed,\
    \ but before the query is executed. It is only when the query is executed that\
    \ the input sequence is processed.\n\nIn the following code, the input sequence\
    \ is modified after the query is constructed, but before it is executed.\n\n```csharp\n\
    int[] fibonacci = { 0, 1, 1, 2, 3, 5 };\n// Construct the query\nIEnumerable<int>\
    \ numbersGreaterThanTwoQuery = fibonacci.Where(x => x > 2);\n// At this point\
    \ the query has still been created but not executed\nfibonacci[0] = 99;\n// Cause\
    \ the query to be executed (enumerated)\nforeach (var number in numbersGreaterThanTwoQuery)\n\
    {\n    Console.WriteLine(number);\n}\n```\n\nThe query is not actually executed\
    \ until the foreach is executed. The results of running this code are as follows:\n\
    \n- 99\n3\n5\n\nNotice that the value 99 has been included in the results, even\
    \ though at the time the query was constructed the first element was still the\
    \ original value of 0.\n\nWith the exception of those that return a scalar value\
    \ (or a single element from the input sequence) such as Count, Min, and Last,\
    \ the standard query operators work in the deferred execution way. Using operators\
    \ such as Count will cause the query to be executed immediately, and not deferred.\n\
    \nThere are a number of conversion operators that also cause immediate query execution,\
    \ such as ToList, ToArray, ToLookup, and ToDictionary.\n\nIn the following code,\
    \ the fibonacci array is being modified in the preceding example code, but in\
    \ this example, by the time the modification takes place (fibonacci[0] = 99),\
    \ the query has already been executed because of the additional ToArray().\n\n\
    ```csharp\nint[] fibonacci = { 0, 1, 1, 2, 3, 5 };\n\n// Construct the query\n\
    IEnumerable<int> numbersGreaterThanTwoQuery = fibonacci.Where(x => x > 2)\n  \
    \  .ToArray();\n\n// At this point the query has been executed because of the\
    \ .ToArray();\n\n// Change the first element of the input sequence\nfibonacci[0]\
    \ = 99;\n\n// Enumerate the results\nforeach (var number in numbersGreaterThanTwoQuery)\n\
    {\n    Console.WriteLine(number);\n}\n```\n\nThe results of running this code\
    \ are\n\n3\n5\n\nNotice here the value 99 is no longer present because the input\
    \ sequence is being modified after the query has executed.\n\n## Lambda expressions\
    \ in query operators\n\nSome query operators allow custom logic to be supplied.\
    \ This custom logic can be supplied to the query operator by way of a lambda expression.\n\
    \nThe fibonacci.where(x => x > 2) code in the preceding code sample is an example\
    \ of a query operator being supplied some custom logic. Here the lambda expression\
    \ x => x > 2 will only return elements (ints in this case) that are greater than\
    \ 2.\n\nWhen a query operator takes a lambda expression, it will apply the logic\
    \ in the lambda expression to each individual element in the input sequence.\n\
    \nThe type of lambda expression that is supplied to a query operator depends on\
    \ what task the query operator is performing. In Figure 1, we can see the signature\
    \ of the where query operator; here the element int is provided and a bool needs\
    \ to be returned that determines if the element will be included in the output\
    \ sequence.\n\n### fibonacci.Where(x => x > 2)\n\n```csharp\n.ToArray(this IEnumerable<int>\
    \ source, Func<int,bool> predicate):IEnumerable<int>\nFilters a sequence of values\
    \ based on a predicate.\npredicate: A function to test each element for a condition.\n\
    (this IEnumerable<int> source, Func<int,bool> predicate):IEnumerable<int>\n```\n\
    \nFigure 1: Visual Studio showing the signature of the Where operator\n\nAs an\
    \ alternative to using a lambda expression, it is also possible to use a traditional\
    \ delegate that points to a method.\n\n## Local and interpreted queries\n\nLINQ\
    \ provides two distinct architectures: local and interpreted.\n\nLocal queries\
    \ operate on IEnumerable<T> sequences and are compiled into the resulting assembly\
    \ at compile time. Local queries, as the name suggests, can be thought of as operating\
    \ on sequences local to the machine on which the query is executing (for example,\
    \ querying in-memory list of objects).\n\nInterpreted queries are interpreted\
    \ at runtime and on sequences that can come from a remote source such as a SQL\
    \ database. Interpreted queries operate on IQueryable<T> sequences.\n\nInterpreted\
    \ queries will be discussed later in Chapter 5, \"Interpreted Queries.\"\n\nThe\
    \ following code demonstrates the use of the Attribute(XName) method to locate\
    \ a specific XAttribute and get its value by reading its Value property. This\
    \ example also uses the FirstAttribute method to get an element's first declared\
    \ attribute, and also how to combine standard query operators such as Skip to\
    \ query the IEnumerable<XAttribute> provided by the Attributes method.\n\n```csharp\n\
    var xml = @\"\n<ingredients>\n  <ingredient name='milk' quantity='200' price='2.99'\
    \ />\n  <ingredient name='sugar' quantity='100' price='4.99' />\n  <ingredient\
    \ name='safron' quantity='1' price='46.77' />\n</ingredients>\";\n```\n\n```csharp\n\
    XElement xmlData = XElement.Parse(xml);\nXElement milk =\n  xmlData.Descendants(\"\
    ingredient\")\n  .First(x => x.Attribute(\"name\").Value == \"milk\");\n```\n\n\
    ```csharp\nXAttribute nameAttribute = milk.FirstAttribute; // name attribute\n\
    XAttribute priceAttribute = milk.Attribute(\"price\");\nstring priceOfMilk = priceAttribute.Value;\
    \ // 2.99\nXAttribute quantity = milk.Attributes()\n  .Skip(1)\n  .First(); //\
    \ quantity attribute\n```\n\n## Chapter 2 Fluent and Query Expression Styles\n\
    \nThere are two styles of writing LINQ queries: the fluent style (or fluent syntax)\
    \ and the query expression style (or query syntax).\n\nThe fluent style uses query\
    \ operator extension methods to create queries, while the query expression style\
    \ uses a different syntax that the compiler will translate into fluent style.\n\
    \n## Fluent style\n\nThe code samples up until this point have all used the fluent\
    \ syntax.\n\nThe fluent syntax makes use of the query operator extension methods\
    \ as defined in the static System.Linq.Enumerable class (or System.Linq.Queryable\
    \ for interpreted or System.Linq.ParallelEnumerable for LINQ queries). These extension\
    \ methods add additional methods to instances of IEnumerable<TSource>. This means\
    \ that any instance of a class that implements this interface can use these fluent\
    \ extension methods.\n\nQuery operators can be used singularly, or chained together\
    \ to create more complex queries.\n\n## Chained query operators\n\nIf the following\
    \ class has been defined:\n\n```csharp\nclass Ingredient\n{\n    public string\
    \ Name { get; set; }\n    public int Calories { get; set; }\n}\n```\n\nThe following\
    \ code uses three chained queries: Where, OrderBy, and Select.\n\n```csharp\n\
    Ingredient[] ingredients = {\n    new Ingredient{Name = \"Sugar\", Calories=500},\n\
    \    new Ingredient{Name = \"Egg\", Calories=100},\n    new Ingredient{Name =\
    \ \"Milk\", Calories=150},\n    new Ingredient{Name = \"Flour\", Calories=50},\n\
    \    new Ingredient{Name = \"Butter\", Calories=200}\n};\n```\n"
  mdcn: "\n\n使用查询操作符时需要注意的一点是，它们不会更改输入序列；相反，查询操作符将返回一个新的序列（或标量值）。\n\n## 标量返回值和输出序列\n\
    \n查询操作符返回输出序列或标量值。在以下代码中，输入序列 `fibonacci` 由 `Count` 查询操作符处理，它产生一个单一标量值，表示输入序列中的元素数量。下一个序列由\
    \ `Distinct` 查询操作符处理，它产生一个新的输出序列，其中包含输入序列中的元素并删除了重复元素。\n\n```c\nint[] fibonacci\
    \ = { 0, 1, 1, 2, 3, 5 };\n// 标量返回值\nint numberOfElements = fibonacci.Count();\n\
    Console.WriteLine(\"Count: {0}\", numberOfElements);\n// 输出序列返回值\nIEnumerable<int>\
    \ distinctNumbers = fibonacci.Distinct();\nConsole.WriteLine(\"Elements in output\
    \ sequence:\");\nforeach (var number in distinctNumbers)\n{\n    Console.WriteLine(number);\n\
    }\n```\n\n此代码的输出如下：\n\nCount: 6\nElements in output sequence:\n0\n1\n2\n3\n5\n\
    \n## 延迟执行\n\n大多数查询操作符不会立即执行；它们的执行被推迟到程序执行的后某个阶段。这意味着查询在创建时并不执行，而是在使用或枚举它时才执行。\n\
    \n延迟执行意味着在构建查询之后、执行之前，可以修改输入序列。只有在执行查询时，输入序列才会被处理。\n\n在以下代码中，输入序列在查询构建之后、执行之前被修改了。\n\
    \n```csharp\nint[] fibonacci = { 0, 1, 1, 2, 3, 5 };\n// 构建查询\nIEnumerable<int>\
    \ numbersGreaterThanTwoQuery = fibonacci.Where(x => x > 2);\n// 此时查询已经创建但尚未执行\n\
    fibonacci[0] = 99;\n// 导致查询执行（枚举）\nforeach (var number in numbersGreaterThanTwoQuery)\n\
    {\n    Console.WriteLine(number);\n}\n```\n\n在执行 `foreach` 之前，查询实际上不会实际执行。运行此代码的结果如下：\n\
    \n- 99\n3\n5\n\n注意，值 99 已经被包含在结果中，尽管在构建查询时，第一个元素仍然是原始值 0。\n\n除了 `Count`、`Min`\
    \ 和 `Last` 等返回标量值（或输入序列中的单个元素）的操作符外，标准查询操作符均以延迟执行的方式工作。使用 `Count` 等操作符会导致查询立即执行而不是延迟。\n\
    \n有许多转换操作符也会导致查询立即执行，例如 `ToList`、`ToArray`、`ToLookup` 和 `ToDictionary`。\n\n在以下代码中，`fibonacci`\
    \ 数组在之前的示例中被修改，但在示例中，当修改发生（`fibonacci[0] = 99`）时，由于额外的 `ToArray()`，查询已经执行完毕。\n\
    \n```csharp\nint[] fibonacci = { 0, 1, 1, 2, 3, 5 };\n\n// 构建查询\nIEnumerable<int>\
    \ numbersGreaterThanTwoQuery = fibonacci.Where(x => x > 2)\n    .ToArray();\n\n\
    // 此时由于 .ToArray()，查询已经执行\n\n// 修改输入序列的第一个元素\nfibonacci[0] = 99;\n\n// 枚举结果\n\
    foreach (var number in numbersGreaterThanTwoQuery)\n{\n    Console.WriteLine(number);\n\
    }\n```\n\n运行此代码的结果为：\n\n3\n5\n\n这里这里值 99 不再出现，因为输入序列在查询执行后被修改了。\n\n## 查询操作符中的\
    \ Lambda 表达式\n\n某些查询操作符允许提供自定义逻辑。这种自定义逻辑可以通过 Lambda 表达式提供给查询操作符。\n\n上述代码中的 `fibonacci.where(x\
    \ => x > 2)` 是向查询操作符提供自定义逻辑的示例。这里的 Lambda 表达式 `x => x > 2` 将仅返回大于 2 的元素（在本例中为\
    \ `int`）。\n\n当查询操作符接收 Lambda 表达式时，它会将 Lambda 表达式中的逻辑应用于输入序列中的每个单独元素。\n\n提供查询操作符的\
    \ Lambda 表达式类型取决于查询操作符正在执行的任务。在图 1 中，我们可以看到 `where` 查询操作符的签名；这里提供了元素 `int`，并且需要返回一个\
    \ `bool` 来决定该元素是否包含在输出序列中。\n\n### fibonacci.Where(x => x > 2)\n\n```csharp\n.ToArray(this\
    \ IEnumerable<int> source, Func<int,bool> predicate):IEnumerable<int>\n根据谓词过滤值序列。\n\
    predicate: 用于测试每个元素是否符合条件的函数。\n(this IEnumerable<int> source, Func<int,bool> predicate):IEnumerable<int>\n\
    ```\n\n图 1：Visual Studio 显示 `Where` 操作符的签名\n\n作为使用 Lambda 表达式的替代方案，也可以使用指向方法的传统委托。\n\
    \n## 本地和解释型查询\n\nLINQ 提供了两种不同的架构：本地和解释型。\n\n本地查询在 `IEnumerable<T>` 序列上操作，并在编译时被编译到生成的程序集中。正如名称所示，本地查询可以被认为是在执行查询的机器本地的序列上进行操作（例如，查询内存中的对象列表）。\n\
    \n解释型查询在运行时被解释，并操作来自远程源（如 SQL 数据库）的序列。解释型查询操作 `IQueryable<T>` 序列。\n\n解释型查询将在第\
    \ 5 章讨论。以下代码演示了如何使用 `Attribute(XName)` 方法定位特定的 `Attribute` 并通过读取其 `Value` 属性获取值。\n\
    \n```csharp\nvar xml = @\"\n<ingredients>\n  <ingredient name='milk' quantity='200'\
    \ price='2.99' />\n  <ingredient name='sugar' quantity='100' price='4.99' />\n\
    \  <ingredient name='safron' quantity='1' price='46.77' />\n</ingredients>\";\n\
    \nXElement xmlData = XElement.Parse(xml);\nXElement milk =\n  xmlData.Descendants(\"\
    ingredient\")\n  .First(x => x.Attribute(\"name\").Value == \"milk\");\n\nXAttribute\
    \ nameAttribute = milk.FirstAttribute; // 属性\nXAttribute priceAttribute = milk.Attribute(\"\
    price\");\nstring priceOfMilk = priceAttribute.Value; // 2.99\nXAttribute quantity\
    \ = milk.Attributes()\n  .Skip(1)\n  .First(); // 属性\n```\n\n## 第 2 章 流式和查询表达式样式\n\
    \n编写 LINQ 查询有两种样式：流式样式（流式语法）和查询表达式样式（查询语法）。\n\n流式样式使用查询操作符扩展方法创建查询，而查询表达式样式使用编译器将其翻译为流式语法。\n\
    \n## 流式样式\n\n到目前为止的代码示例都使用了流式语法。\n\n流式语法利用在静态 `System.Linq.Enumerable` 类（或用于解释型的\
    \ `System.Linq.Queryable` 以及用于并行 LINQ 查询的 `System.Linq.ParallelEnumerable`）中查询操作符扩展方法。这些扩展方法为\
    \ `IEnumerable<TSource>` 实例增加了方法。这意味着实现此接口的任何类都可以这些流式扩展方法。\n\n查询操作符可以单独使用，也可以链式组合创建复杂的查询。\n\
    \n## 链式查询操作符\n\n如果定义了以下类：\n\n```csharp\nclass Ingredient\n{\n    public string\
    \ Name { get; set; }\n    public int Calories { get; set; }\n}\n```\n\n以下代码使用了三个链式查询：`Where`、`OrderBy`\
    \ 和 `Select`。\n\n```csharp\nIngredient[] ingredients = {\n    new Ingredient{Name\
    \ = \"Sugar\", Calories=500},\n    new Ingredient{Name = \"Egg\", Calories=100},\n\
    \    new Ingredient{Name = \"Milk\", Calories=150},\n    new Ingredient{Name =\
    \ \"Flour\", Calories=50},\n    new Ingredient{Name = \"Butter\", Calories=200}\n\
    };\n```\n\n"
