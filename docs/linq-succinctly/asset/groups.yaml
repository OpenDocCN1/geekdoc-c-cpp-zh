    ```\n\n这产生了以下输出：\n\n50\n\n## 查询表达式用法\n\n在使用查询表达式样式时，没有 `Min` 关键字；但是，可以使用混合样式。\n\
    \n## 最大值 (Max)\n\n**Max** 查询运算符补充了 **Min** 运算符，并从输入序列返回最大的值，如下代码所示。\n\n```csharp\n\
