  - "[PAGE 17]\n\n# Chapter 2 Fluent and Query Expression Styles\n\nThere are two\
    \ styles of writing LINQ queries: the fluent style (or fluent syntax) and the\
    \ query expression style (or query syntax).\n\nThe fluent style uses query operator\
    \ extension methods to create queries, while the query expression style uses a\
    \ different syntax that the compiler will translate into fluent style.\n\n# Fluent\
    \ style\n\nThe code samples up until this point have all used the fluent syntax.\n\
    \nThe fluent syntax makes use of the query operator extension methods as defined\
    \ in the static System.Linq.Enumerable class (or System.Linq.Queryable for interpreted\
    \ or System.Linq.ParallelEnumerable for LINQ queries). These extension methods\
    \ add additional methods to instances of IEnumerable<TSource>. This means that\
    \ any instance of a class that implements this interface can use these fluent\
    \ extension methods.\n\nQuery operators can be used singularly, or chained together\
    \ to create more complex queries.\n\n# Chained query operators\n\nIf the following\
    \ class has been defined:\n\n```\nclass Ingredient\n{\n    public string Name\
    \ { get; set; }\n    public int Calories { get; set; }\n}\n\nThe following code\
    \ uses three chained queries: Where, OrderBy, and Select.\n\nIngredient[] ingredients\
    \ = {\n    new Ingredient{Name = \"Sugar\", Calories=500},\n    new Ingredient{Name\
    \ = \"Egg\", Calories=100},\n    new Ingredient{Name = \"Milk\", Calories=150},\n\
    \    new Ingredient{Name = \"Flour\", Calories=50},\n    new Ingredient{Name =\
    \ \"Butter\", Calories=200}\n};\n```"
- md: "\n```cs\nIEnumerable<string> highCalorieIngredientNamesQuery =\n    ingredients.Where(x\
    \ => x.Calories >= 150)\n    .OrderBy(x => x.Name)\n    .Select(x => x.Name);\n\
    \nforeach (var ingredientName in highCalorieIngredientNamesQuery)\n{\n    Console.WriteLine(ingredientName);\n\
    }\n```\n\nExecuting this code produces the following output:\n\n- Butter\n- Milk\n\
    - Sugar\n\nFigure 2 shows a graphical representation of this chain of query operators.\
    \ Each operator input on the sequence provided by the preceding query operator.\
    \ Notice that the initial input sequence (represented by the variable ingredients)\
    \ is an IEnumerable<Ingredient>, whereas the output sequence (represented by the\
    \ variable highCalorieIngredientNamesQuery) is a different type; it is an IEnumerable<string>.\n\
    \nIn this example, the chain of operators is working with a sequence of Ingredient\
    \ elements until the Select transforms each element in the sequence; each Ingredient\
    \ object is transformed to a simple string. This transformation is called projection.\
    \ Input elements are projected into transformed output elements.\n\n| initial\
    \ input sequence : IEnumerable<Ingredient> |\n| :--- |\n| Sugar | Egg | Milk |\
    \ Flour | Butter |\n| Where(x => x.Calories >= 150) |\n| Sugar | Milk | Butter\
    \ |\n| OrderBy(x => x.Name) |\n| Butter | Milk | Sugar |\n| Select(x => x.Name)\
    \ |\n| \"Butter\" | \"Milk\" | \"Sugar\" |\n| output sequence : IEnumerable<string>\
    \ |\n| \"Butter\" | \"Milk\" | \"Sugar\" |\n\nFigure 2: Multiple query operators\
    \ acting in a chain\n\nThe lambda expression provided to the Select query operator\
    \ decides what \"shape\" the elements in the output sequence will take. The lambda\
    \ expression x => x.Name is telling the Select operator \"for each Ingredient,\
    \ output a string element with the value of the Name property from the input Ingredient.\"\
    .\n\n> Note: Individual query operators will be discussed later in Chapter 3,\
    \ LINQ Query Operators.\n\n## Query expression style\n\nQuery expressions offer\
    \ a syntactical nicety on top of the fluent syntax.\n\nThe following code shows\
    \ the equivalent version using query syntax of the preceding fluent style query.\n\
    \n```cs\nIngredient[] ingredients = \n{\nnew Ingredient(Name = \"Sugar\", Calories=500),\n\
    new Ingredient(Name = \"Egg\", Calories=100),\nnew Ingredient(Name = \"Milk\"\
    , Calories=150),\nnew Ingredient(Name = \"Flour\", Calories=50),\nnew Ingredient(Name\
    \ = \"Butter\", Calories=200)\n};\n```\n\n```cs\nIEnumerable<string> highCalorieIngredientNamesQuery\
    \ =\nfrom i in ingredients\nwhere i.Calories >= 150\norderby i.Name\nselect i.Name;\n\
    ```\n\n```cs\nforeach (var ingredientName in highCalorieIngredientNamesQuery)\n\
    {\n  Console.WriteLine(ingredientName);\n}\n```\n\nExecuting this code produces\
    \ the same output as the fluent syntax version:\n\nButter\nMilk\nSugar\n\nThe\
    \ steps that are performed are the same as in the fluent syntax version, with\
    \ each query clause (from, where, orderby, select) passing on a modified sequence\
    \ to the next query clause.\n\nThe query expression in the preceding code begins\
    \ with the from clause. The from clause has two purposes: the first is to describe\
    \ what the input sequence is (in this case ingredients); the second is to introduce\
    \ a range variable.\n\nThe final clause is the select clause, which describes\
    \ what the output sequence will be from the entire query. Just as with the fluent\
    \ syntax version, the select clause in the preceding code is projecting a sequence\
    \ of Ingredient objects into a sequence of string objects.\n\n## Range variables\n\
    \nA range variable is an identifier that represents each element in the sequence\
    \ turn. It's similar to the variable used in a foreach statement; as the sequence\
    \ is processed, this range variable represents the current element being processed.\
    \ In the preceding code, the range variable i is being declared. Even though the\
    \ same range variable identifier i is used in each clause, the sequence that the\
    \ range variable \"traverses\" is different. Each clause works with the input\
    \ sequence produced from the preceding clause (or the initial IEnumerable<T>).\
    \ This means that each clause is processing a different sequence; it is simply\
    \ the name of the range variable that is being reused.\n\nIn addition to the range\
    \ variable introduced in the from, additional range variables can be added using\
    \ other clauses or keywords. The following can introduce new range variables into\
    \ a query expression:\n\n- Additional from clauses\n- The let clause\n- The into\
    \ keyword\n- The join clause\n\n## The let clause\n\nA clause in a LINQ query\
    \ expression allows the introduction of an additional range variable. This additional\
    \ range variable can then be used in other clauses that follow it.\n\nIn the following\
    \ code, the let clause is used to introduce a new range variable called Dairy,\
    \ which will be type Boolean.\n\n```cs\nIngredient[] ingredients = {\n    new\
    \ Ingredient{Name = \"Sugar\", Calories=500},\n    new Ingredient{Name = \"Egg\"\
    , Calories=100},\n    new Ingredient{Name = \"Milk\", Calories=150},\n    new\
    \ Ingredient{Name = \"Flour\", Calories=50},\n    new Ingredient{Name = \"Butter\"\
    , Calories=200}\n}\n\nIEnumerable<Ingredient> highDairyQuery =\n    from i in\
    \ ingredients\n    let isDairy = i.Name == \"Milk\" || i.Name == \"Butter\"\n\
    \    where i.Calories >= 150 && isDairy\n    select i;\n\nforeach (var ingredient\
    \ in highDairyQuery) {\n    Console.WriteLine(ingredient.Name);\n}\n```\n\nThe\
    \ output of this code produces:\n\nMilk\nButter\n\nIn the preceding code, the\
    \ **isDairy** range variable is introduced and then used in the **where** clause.\
    \ Notice that the original dairy variable **i** remains available to the **select**\
    \ clause.\n\nIn this example, the new range variable is simple scalar value, but\
    \ **let** can also be used to introduce a subsequence. In the following code sample,\
    \ the range variable **ingredients** is not a scalar value, but an array of strings.\n\
    \n```cs\nstring[] csvRecipes = {\n  \"milk,sugar,eggs\",\n  \"flour,BUT,eggs\"\
    ,\n  \"vanilla,CHEESE,oats\"\n}\n```\n\n```cs\nvar dairyQuery =\n  from csvRecipe\
    \ in csvRecipes\n  let ingredients = csvRecipe.Split(',')\n  from ingredient in\
    \ ingredients\n  let uppercaseIngredient = ingredient.ToUpper()\n  where uppercaseIngredient\
    \ == \"MILK\" ||\n       uppercaseIngredient == \"BUTTER\" ||\n       uppercaseIngredient\
    \ == \"CHEESE\"\n  select uppercaseIngredient;\n```\n\n```cs\nforeach (var dairyIngredient\
    \ in dairyQuery)\n{\n  Console.WriteLine(\"{0} is dairy\");\n}\n```\n\nIn noticing\
    \ the code that we are using multiple **let** clauses as well as additional **from**\
    \ clauses. Using additional **from** clauses is another way to introduce new range\
    \ variables into a query expression.\n\n## The into keyword\n\nThe **into** keyword\
    \ also allows a new identifier to be declared that can store the result of a **select**\
    \ clause (as well as **group** and **join** clauses.)\n\nThe following code demonstrates\
    \ using **into** to create a new anonymous type and then using this in the remainder\
    \ of the query expression.\n\n```cs\nIngredient[] ingredients =\n{\n    new Ingredient(Name\
    \ = \"Sugar\", Calories=500),\n    new Ingredient(Name = \"Egg\", Calories=100),\n\
    \    new Ingredient(Name = \"Milk\", Calories=150),\n    new Ingredient(Name =\
    \ \"Flour\", Calories=50),\n    new Ingredient(Name = \"Butter\", Calories=200);\n\
    };\n\nIEnumerable<Ingredient> highCalDairyQuery\nfrom i in ingredients\nselect\
    \ new // anonymous type\n{\n    OriginalIngredient i = i,\n    IsDairy = i.Name\
    \ == \"Milk\" || i.Name == \"Butter\",\n    IsHighCalorie = i.Calories >= 150\n\
    }\ninto temp\nwhere temp.IsDairy && temp.IsHighCalorie\n// cannot write \"select\
    \ i\" as into hides the previous range variable i\nselect temp.OriginalIngredient;\n\
    \nforeach (var ingredient in highCalDairyQuery)\n{\n    Console.WriteLine(ingredient.Name);\n\
    }\n```\n\nThis code produces the following output:\n\nMilk\nButter\n\nNote that\
    \ using into hides the previous range variable i. This means that I cannot be\
    \ used in the final select.\n\nThe let clause, however, does not hide the previous\
    \ range variable(s), meaning they can still be used later in query expressions.\n\
    \n## The join clause\n\nThe join clause takes two input sequences in which elements\
    \ in either sequence do not necessarily have any direct relationship in the class\
    \ domain model.\n"
