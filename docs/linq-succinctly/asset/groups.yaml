    \ {Id = 3, Name = \"Beef Pie\", Rating = 3}\n};\n\nILookup<byte, Recipe> look\
    \ = recipes.ToLookup(x => x.Rating);\n\nforeach (IGroup<byte, Recipe> ratingGroup\
    \ in look)\n{\n    Console.WriteLine(\"{0}\", ratingGroup.Key);\n    foreach (Recipe\
