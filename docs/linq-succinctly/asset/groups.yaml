    \    });\n```\n\nThis query could also be written using an anonymous type; notice\
    \ in the following code the query return type has been changed to var.\n\n```csharp\n\
    var query = ingredients.Select(x =>\n    {\n        Name = x.Name,\n        Length\
    \ = x.Name.Length\n    });\n```\n\n# Query expression usage\n\nThe Select keyword\
    \ is used in query expression style code as shown in the following code that replicates\
    \ the preceding fluent style version using an anonymous type.\n\n```csharp\nvar\
    \ query = from i in ingredients\nselect new\n    {\n        Name = i.Name,\n \
    \       Length = i.Name.Length\n    };\n```\n\n# SelectMany\n\nWhereas the Select\
    \ query operator returns an output element for every input element, the SelectMany\
    \ query operator produces a variable number of output elements for each input\
    \ element. This means that the output sequence may contain more or fewer elements\
    \ than were in the input sequence.\n\nThe lambda expression in the Select query\
    \ operator returns a single item. The lambda expression in a SelectMany query\
    \ operator produces a child sequence. This child sequence may contain a varying\
    \ number of elements for each element in the input sequence.\n\nIn the following\
    \ code, the lambda expression will produce a child sequence of chars, one char\
    \ for each letter of each input element. For example the input element “Sugar”,\
    \ when processed by the lambda expression, will produce a child sequence containing\
    \ five elements: 'S', 'u', 'g', 'a', and 'r’. Each input ingredient string can\
    \ be a different number of letters, so the lambda expression will produce child\
    \ sequences of different lengths. Each of the child sequences produced are concatenated\
    \ (“flattened”) into a single output sequence.\n\n```csharp\nstring[] ingredients\
    \ = {\"Sugar\", \"Egg\", \"Milk\", \"Flour\", \"Butter\"};\nIEnumerable<char>\
    \ query = ingredients.SelectMany(x => x.ToCharArray());\nforeach (char item in\
    \ query)\n{\n    Console.WriteLine(item);\n}\n```\n\nThis code produces the following\
    \ output (notice there are more output elements than there were in the input sequence\
    \ that only contained five elements):\n\n# Query expression usage\n\nIn the query\
    \ expression style, an additional **from** clause is added to produce the child\
    \ sequence.\n\nThe following code produces the same output as the previous fluent\
    \ version.\n\n```csharp\nIEnumerable<char> query = from i in ingredients\nfrom\
    \ c in i.ToCharArray()\nselect c;\n```\n\n# Partitioning Operators\n\nThe partitioning\
    \ query operators take an input sequence and partition it, or \"return a chunk\"\
    \ in the output sequence. One use of these operators is to break up a larger sequence\
    \ into \"pages,\" paging ten results at a time in a user interface.\n\n# Take\n\
    \nThe Take query operator takes in an input sequence and returns the specified\
    \ number of elements as an output.\n\nThe following code shows how to use the\
    \ Take operator to return the first three ingredients in the sequence.\n\n```csharp\n\
    Ingredient[] ingredients = {\nnew Ingredient (Name = \"Sugar\", Calories = 500),\n\
    new Ingredient (Name = \"EGG\", Calories = 100),\nnew Ingredient (Name = \"Milk\"\
    , Calories = 150),\nnew Ingredient (Name = \"Flour\", Calories = 50),\nnew Ingredient\
    \ (Name = \"Butter\", Calories = 200)\n}\n```\n\n```csharp\nIEnumerable<Ingredient>\
    \ firstThree = ingredients.Take(3);\n\nforeach (var ingredient in firstThree)\n\
    {\n    Console.WriteLine(ingredient.Name);\n}\n```\n\nThe preceding code produces\
    \ the following output:\n\nSugar\nEgg\nMilk\n\nAs with other query operators.\
    \ Take can be chained together. In the following code, Where is used to restrict\
    \ the ingredients to only those containing more than 100 calories. The Take query\
    \ operator then produces this restricted sequence and returns the first two ingredients.\n\
    \n```csharp\nIngredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\"\
    , Calories = 500},\n    new Ingredient {Name = \"Egg\", Calories = 100},\n   \
    \ new Ingredient {Name = \"Milk\", Calories = 150},\n    new Ingredient {Name\
    \ = \"Flour\", Calories = 50},\n    new Ingredient {Name = \"Butter\", Calories\
    \ = 200}\n};\n```\n\n```csharp\nIEnumerable<Ingredient> query =\n    .Where(x\
    \ => x.Calories > 100)\n    .Take(2);\n```\n\n```csharp\nforeach (var ingredient\
    \ in query)\n{\n    Console.WriteLine(ingredient.Name);\n}\n```\n\nThis code produces\
    \ the following result:\n\nSugar\nMilk\n\n# Query expression usage\n\nThere is\
    \ no keyword for Take when using the query style; however, mixed style can be\
    \ used as the following code demonstrates.\n\n```csharp\nIEnumerable<Ingredient>\
    \ query = from i in ingredients\n    where i.Calories > 100\n    select i).Take(2);\n\
    ```\n\n# TakeWhile\n\nThe TakeWhile query operator, rather than return elements\
    \ based on a fixed number of elements, instead continues to return input elements\
    \ until such time as a predicate becomes false.\n\nThe following code will continue\
    \ to \"take\" elements from the input sequence while the number of calories is\
    \ greater than or equal to 100.\n\n# Ingredient[] ingredients =\n\n```csharp\n\
    {\nnew Ingredient(Name = \"Sugar\", Calories = 500),\nnew Ingredient(Name = \"\
    Egg\", Calories = 100),\nnew Ingredient(Name = \"Milk\", Calories = 150),\nnew\
    \ Ingredient(Name = \"Flour\", Calories = 50),\nnew Ingredient(Name = \"Butter\"\
    , Calories = 200)\n}\n```\n\n```csharp\nIEnumerable<Ingredient> query = ingredients.TakeWhile(x\
    \ => x.Calories >= 100);\n\n```csharp\nforeach (var ingredient in query)\n{\n\
    \    Console.WriteLine(ingredient.Name);\n}\n```\n\nThis produces the following\
    \ output:\n\n+   Sugar\nEgg\nMilk\n\nNotice here that as soon as an element in\
    \ the input sequence is reached that does not match predicate, the \"taking\"\
    \ stops; no more elements from the remainder of the input sequence are returned,\
    \ even if they match the predicate.\n\nThere is an overload of TakeWhile that\
    \ allows the positional index of the input element to be used; in the preceding\
    \ code, this predicate would take the form Func<Ingredient, int, bool>. The int\
    \ generic type parameter represents the positional index of the current Ingredient\
    \ being examined.\n"
  mdcn: "\n\n# Where\n\nwhere 查询操作符返回匹配给定谓词的输出元素。\n\n> 提示：谓词是一个函数，当某些条件满足时返回 bool\
    \ 结果为 true。\n\n```\nIngredient[] ingredients = {\n    new Ingredient {Name = \"\
    Sugar\", Calories = 500};\n    new Ingredient {Name = \"EGG\", Calories = 100};\n\
    \    new Ingredient {Name = \"Milk\", Calories = 150};\n    new Ingredient {Name\
    \ = \"Flour\", Calories = 50};\n    new Ingredient {Name = \"Butter\", Calories\
    \ = 200};\n}\nIEnumerable<Ingredient> query = ingredients\n    .Where(x => x.Calories\
    \ >= 200);\n\nforeach (var ingredient in query)\n{\n    Console.WriteLine(ingredient.Name);\n\
    }\n```\n\n前面的代码显示了 Where 如何在实际中使用。在这里，谓词 `x => x.Calories >= 200` 将对每个卡路里大于或等于\
    \ 200 的原料返回 true。\n\n此代码产生以下输出：\n\nSugar\nButter\n\nwhere 的重载提供了输入元素的位置索引，用于在谓词中使用。\n\
    在前面的代码中，“Sugar”的索引为 0，“Butter”的索引为 4。下面的查询产生与之前的版本相同的输出。\n\n```\nIEnumerable<Ingredient>\
    \ queryUsingIndex = ingredients\n    .Where((ingredient, index) => ingredient.Name\
    \ == \"Sugar\" || index == 4);\n```\n\n注意 lambda 表达式是不同的。在这种情况下，谓词函数的类型将为 `Func<Ingredient,\
    \ int, int, bool>`；`int` 参数提供了元素在输入序列中的位置。\n\n# 查询表达式用法\n\nwhere 关键字用于查询表达式风格的代码中，其后面跟着一个布尔表达式，如下面的代码所示。\n\
    \n```\nIEnumerable<Ingredient> queryX = from i in ingredients\nwhere i.Calories\
    \ >= 200\nselect i;\n```\n\n# 投影操作符\n\n投影查询操作符接收一个输入序列，转换该序列中的每个元素，并产生这些转换后的元素的输出序列。通过这种方式，输入序列被投影到不同的输出序列。\n\
    \n# Select\n\nSelect 查询操作符将输入序列中的每个元素转换为输出序列中的元素。输出序列中的元素数量将与输入序列相同。\n\n下面的查询将\
    \ Ingredient 元素的输入序列投影为 string 元素的输出序列。描述投影的 lambda 表达式：获取每个输入 Ingredient 元素并返回一个\
    \ string 元素。\n\n```\nIEnumerable<string> query = ingredients.Select(x => x.Name);\n\
    ```\n\n我们可以通过以下代码创建一个 int 的输出序列：\n\n```\nIEnumerable<int> queryNameLength = ingredients.Select(x\
    \ => x.Length);\n```\n\n投影也可以在输出中产生复杂对象。在下面的代码中，每个输入 Ingredient 都投影为 `IngredientNameAndLength`\
    \ 对象的一个新实例。\n\n```csharp\nclass IngredientNameAndLength\n{\n    public string\
    \ Name { get; set; }\n    public int Length { get; set; }\n\n    public override\
    \ string ToString();\n```\n\n```csharp\n{\n    return Name + \" - \" + Length;\n\
    }\n...\nIEnumerable<IngredientNameAndLength> query = ingredients.Select(x =>\n\
    \    new IngredientNameAndLength\n    {\n        Name = x.Name,\n        Length\
    \ = x.Name.Length\n    });\n```\n\n此查询也可以匿名类型编写；注意在下面的代码中查询的返回类型已更改为 `var`。\n\n\
    ```csharp\nvar query = ingredients.Select(x =>\n    {\n        Name = x.Name,\n\
    \        Length = x.Name.Length\n    });\n```\n\n# 查询表达式用法\n\nSelect 关键字用于查询表达式风格的代码中，如下代码所示，它使用匿名类型复制了之前的流式风格版本。\n\
    \n```csharp\nvar query = from i in ingredients\nselect new\n    {\n        Name\
    \ = i.Name,\n        Length = i.Name.Length\n    };\n```\n\n# SelectMany\n\nSelect\
    \ 查询操作符为每个输入元素返回一个输出元素，而 SelectMany 查询操作符为每个输入元素产生数量数量的输出元素。这意味着输出序列中的元素可能比输入序列中的多或少。\n\
    \nSelect 查询操作符中的 lambda 表达式返回单个项目。SelectMany 查询操作符中的 lambda 表达式产生一个子序列。该子序列对于输入序列中的每个元素可能包含不同数量的元素。\n\
    \n在下面的代码中，lambda 表达式将产生字符子序列，每个输入元素的每个字母产生一个字符。例如，输入元素“Sugar”被 lambda 表达式处理时，将产生一个包含五个元素的子序列：'S'、'u'、'g'、'a'\
    \ 和'r'。每个输入原料字符串可能有不同的字母数量，因此 lambda 表达式将产生不同长度的子序列。产生的每个子序列都被连接（“扁平化”）到单个输出序列中。\n\
    \n```csharp\nstring[] ingredients = {\"Sugar\", \"Egg\", \"Milk\", \"Flour\",\
    \ \"Butter\"};\nIEnumerable<char> query = ingredients.SelectMany(x => x.ToCharArray());\n\
    foreach (char item in query)\n{\n    Console.WriteLine(item);\n}\n```\n\n此代码产生以下输出（注意输出元素比只包含五个元素的输入序列多）：\n\
    \n# 查询表达式用法\n\n在查询表达式风格中，添加了额外的 **from** 子句来产生子序列。\n\n下面的代码产生与之前的流式版本相同的输出。\n\n\
    ```csharp\nIEnumerable<char> query = from i in ingredients\nfrom c in i.ToCharArray()\n\
    select c;\n```\n\n# 分区操作符\n\n分区操作符接收输入序列并将其拆分，或者每次“分页”到输出序列。这些操作符的用法是将较大的序列分成若干页的块。\n\
    \n# Take\n\nTake 操作符接收输入序列并返回指定数量的元素。\n\n下面的代码显示了如何使用 Take 返回序列前三个元素。\n\n```csharp\n\
    Ingredient[] ingredients = {\n    new Ingredient {Name = \"Sugar\", Calories =\
    \ 500},\n    new Ingredient {Name = \"EGG\", Calories = 100},\n    new Ingredient\
    \ {Name = \"Milk\", Calories = 150},\n    new Ingredient {Name = \"Flour\", Calories\
    \ = 50},\n    new Ingredient {Name = \"Butter\", Calories = 200}\n};\n```\n\n\
    ```csharp\nIEnumerable<Ingredient> firstThree = ingredients.Take(3);\n\nforeach\
    \ (var ingredient in firstThree)\n{\n    Console.WriteLine(ingredient.Name);\n\
    }\n```\n\n```：\n\nTake 可以与其他查询操作符链式使用。在下面的代码中，使用 Where 将原料限制为卡路里大于 100 的原料。Take\
    \ 操作符然后返回该序列的前两个。\n\n```csharp\nIngredient[] ingredients = {\n    new Ingredient\
    \ {Name = \"Sugar\", Calories = 500},\n    new Ingredient {Name = \"Egg\", Calories\
    \ = 100},\n    new Ingredient {Name = \"Milk\", Calories = 150},\n    new Ingredient\
    \ {Name = \"Flour\", Calories = 50},\n    new Ingredient {Name = \"Butter\", Calories\
    \ = 200}\n};\n\n```csharp\nIEnumerable<Ingredient> query = ingredients\n    .Where(x\
    \ => x.Calories > 100)\n    .Take(2);\n\nforeach (var ingredient in query)\n{\n\
    \    Console.WriteLine(ingredient.Name);\n}\n```\n\n此代码产生以下结果：\n\nSugar\nMilk\n\
    \n# 查询表达式用法\n\n在查询风格下没有 Take 关键字；但如下面的代码所示，可以使用混合风格。\n\n```csharp\nIEnumerable<Ingredient>\
    \ query = from i in ingredients\n    where i.Calories > 100\n    select i).Take(2);\n\
    ```\n\n# TakeWhile\n\nTakeWhile 查询操作符不是根据固定数量的元素返回元素，而是持续返回输入元素，直到谓词变为 false。\n\
    \n下面的代码将在卡路里大于或等于 100 时继续从输入序列中“获取”元素。\n\n# Ingredient[] ingredients =\n\n```csharp\n\
    {\n    new Ingredient(Name = \"Sugar\", Calories = 500),\n    new Ingredient(Name\
    \ = \"Egg\", Calories = 100),\n    new Ingredient(Name = \"Milk\", Calories =\
    \ 150),\n    new Ingredient(Name = \"Flour\", Calories = 50),\n    new Ingredient(Name\
    \ = \"Butter\", Calories = 200)\n}\n```\n\n```csharp\nIEnumerable<Ingredient>\
    \ query = ingredients.TakeWhile(x => x.Calories >= 100);\n\n```csharp\nforeach\
    \ (var ingredient in query)\n{\n    Console.WriteLine(ingredient.Name);\n}\n```\n\
    \n此产生以下输出：\n\nSugar\nEgg\nMilk\n\n注意这里，一旦在输入序列中遇到不匹配谓词的元素，“获取”就会停止；不再返回输入序列的剩余元素，即使它们匹配谓词。\n\
    \n"
