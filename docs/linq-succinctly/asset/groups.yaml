- md: "\nTo perform a join, some value of the elements in the first sequence is compared\
    \ for equality with some value of the elements in the second sequence. It is important\
    \ to note here that the join clause perform equi-joins; the values from both sequences\
    \ are compared for equality. It means that the join clause does not support non-equijoins\
    \ as inequality, or comparisons such as greater-than or less-than. Because of\
    \ this, rather than specifying joined elements using an operator as == in C#,\
    \ the equals keyword is used. The design thinking about introducing this keyword\
    \ is to make it very clear that joins are equi-joins.\n\nCommon types of joins:\n\
    \n- Inner joins.\n- Group joins.\n- Left outer joins.\n\nThe following join code\
    \ examples assume that the following classes have been defined:\n\n```cs\nclass\
    \ Recipe\n{\n    public int Id { get; set; }\n    public string Name { get; set;\
    \ }\n}\n\nclass Review\n{\n    public int RecipeID { get; set; }\n    public string\
    \ ReviewText { get; set; }\n}\n```\n\nThese two classes model the fact that recipes\
    \ can have 0, 1, or many reviews. The Review class has a RecipeID property that\
    \ holds the id of the recipe that the Review pertains to; notice though that there\
    \ is no direct relationship in the form of a type Recipe.\n\n## Inner join\n\n\
    An inner join returns an element in the output sequence for each item in the first\
    \ sequence that has matching items in the second sequence. If an element in the\
    \ first sequence does not have any matching elements in the second sequence, it\
    \ will not appear in the output sequence.\n\nTake the following code example:\n\
    \n```cs\nRecipe[] recipes = {\n  new Recipe {Id = 1, Name = \"Mashed Potato\"\
    },\n  new Recipe {Id = 2, Name = \"Crispy Duck\"},\n  new Recipe {Id = 3, Name\
    \ = \"Sachertorte\"}\n};\n```\n\n```cs\nReview[] reviews = {\n  new Review {RecipeId\
    \ = 1, ReviewText = \"Tasty!\"},\n  new Review {RecipeId = 1, ReviewText = \"\
    Not nice:(\"},\n  new Review {RecipeId = 1, ReviewText = \"Pretty good\"},\n \
    \ new Review {RecipeId = 2, ReviewText = \"Too hard\"},\n  new Review {RecipeId\
    \ = 2, ReviewText = \"Loved it\"}\n};\n```\n\n```cs\nvar query = from recipe review\
    \ in reviews on recipe.Id equals review.RecipeId\n  select new // anonymous type\n\
    \  {\n    RecipeName = recipe.Name,\n    RecipeReview = review.ReviewText\n  };\n\
    \nforeach (var item in query)\n{\n  Console.WriteLine(\"{0} - '{1}\", item.RecipeName,\
    \ item.RecipeReview);\n}\n```\n\nIn this preceding code, two input sequences are\
    \ created: recipes, holding a number of recipes, and a second sequence, reviews\
    \ of objects.\n\nThe query expression starts with the from clause pointing to\
    \ the first sequence (recipes) and declaring the variable recipeId.\n\nNext comes\
    \ the use of the join clause. Here another variable (review) is introduced that\
    \ represents elements being processed in the reviews input sequence. The on keyword\
    \ allows the specification of what value of the recipe range object is related\
    \ to which value of the review range variable object. Again the equals keyword\
    \ is used here to represent an equijoin. This Join clause is essentially stating\
    \ that reviews belong to recipes as identified by the common values of Id in Recipe\
    \ and RecipeId in Review.\n\nThe result of executing this code is as follows:\n\
    \nMashed Potato - 'Tasty!'\nMashed Potato - 'Not nice :('\nMashed Potato - 'Pretty\
    \ good'\nCrispy Duck - 'Too hard'\nCrispy Duck - 'Loved it'\n\nNotice here the\
    \ recipe 'Sachertorte' does not exist in the output. This is because there are\
    \ no reviews for it, i.e. there are no matching elements in the second input sequence\
    \ (reviews).\n\nAlso notice that the result are \"flat\", meaning there is no\
    \ concept of groups of reviews belonging to a \"parent\" recipe.\n\n## Group join\n\
    \nA group join can produce a grouped hierarchical result where items in the second\
    \ sequence are matched to items in the first sequence.\n\nUnlike the previous\
    \ inner join, the output of a group join can be organized hierarchically with\
    \ reviews grouped into their related recipe.\n\n```cs\nRecipe[] recipes = {\n\
    \  new Recipe {Id = 1, Name = \"Mashed Potato\"},\n  new Recipe {Id = 2, Name\
    \ = \"Crispy Duck\"},\n  new Recipe {Id = 3, Name = \"Sachertorte\"}\n};\n```\n\
    \n```cs\nReview[] reviews = {\n  new Review {Id = 1, ReviewText = \"Tasty!\"},\n\
    \  new Review {Id = 1, ReviewText = \"Not nice :(\"},\n  new Review {Id = 1, ReviewText\
    \ = \"Pretty good\"},\n  new Review {Id = 2, ReviewText = \"Too hard\"},\n  new\
    \ Review {Id = 2, ReviewText = \"Liked it\"}\n};\n```\n\n```cs\nvar query =\n\
    \  from recipe in recipes\n  join review in reviews on recipe.Id equals review.Id\n\
    \  into reviewGroup\n  select new // anonymous type\n  {\n    RecipeName = recipe.Name,\n\
    \    Reviews = reviewGroup // collection of related reviews\n  };\n```\n\n```cs\n\
    foreach (var item in query) {\n  Console.WriteLine(\"Reviews {0}\", item.RecipeName);\n\
    }\n\nforeach (var review in item.Reviews)\n{\n    Console.WriteLine(\" {0}\" -\
    \ review.ReviewText);\n}\n```\n\nIn this version, notice the addition of the **into**\
    \ keyword. This allows the creation of hierarchical results. The **reviewGroup**\
    \ range represents a sequence of reviews that match the join expression, in this\
    \ case where `recipe.Id` equals `review.RecipeId`.\n\nTo create the output of\
    \ groups (where each group contains the related reviews) the result of the query\
    \ is projected into an anonymous type. Each instance of this anonymous type in\
    \ the output sequence represents each group. The anonymous type has two properties:\
    \ **RecipeName** coming from the element in the first sequence, and **Reviews**\
    \ that come from the results of the expression, i.e. the reviews that belong to\
    \ the recipe.\n\nThe output of this code produces the following:\n\n- Reviews\
    \ for Mashed Potato\n- Tasty!\n- Not nice :\n- Pretty good\nReviews for Crispy\
    \ Duck\n- Too hard\n- Loved it\nReviews for Sachertorte\n\nNotice the hierarchical\
    \ output here, and also that \"Sachertorte\" has been included in the output this\
    \ time, even though it has no associated reviews.\n\n## Left outer join\n\nTo\
    \ get flat, non-hierarchical output that includes elements in the first sequence\
    \ that have no matching elements in the second sequence (our example \"Sachertorte\"\
    ), the **into** keyword can be used with the **DefaultEmpty** method. The following\
    \ code shows this:\n\n```cs\nRecipe[] recipes = {\n    new Recipe {Id = 1, Name\
    \ = \"Mashed Potato\"},\n    new Recipe {Id = 2, Name = \"Crispy Duck\"},\n  \
    \  new Recipe {Id = 3, Name = \"Sachertorte\"}\n};\n```\n\n```cs\nReview[] reviews\
    \ = {\n    new Review {RecipeId = 1, ReviewText = \"Tasty!\"},\n    new Review\
    \ {RecipeId = 1, ReviewText = \"Not nice :(\"},\n    new Review {RecipeId = 1,\
    \ ReviewText = \"Pretty good\"},\n    new Review {RecipeId = 2, ReviewText = \"\
    Too hard\"},\n    new Review {RecipeId = 2, ReviewText = \"Loved it\"}\n};\n```\n\
    \n```cs\nvar query = from recipe review in reviews on recipe.Id equals review.RecipeId\n\
    \  into reviewGroup\n  select new // anonymous type\n  {\n    RecipeName = recipe.Name,\n\
    \    RecipeReview = (review == null ? \"n/a\" : review.ReviewText)\n  };\n\nforeach\
    \ (var item in query)\n{\n    Console.WriteLine(\"{0} - '{1}', item.RecipeName,\
    \ item.RecipeReview);\n}\n```\n\nMashed Potato - 'Tasty!'\nMashed Potato - 'Not\
    \ nice :('\nMashed Potato - 'Pretty good'\nCrispy Duck - 'Too hard'\nCrispy Duck\
    \ - 'Loved it'\nSachertorte - 'n/a\n\n# Other query expression syntax\n\nThere\
    \ are a number of other syntactical elements when using query expressions:\n\n\
    - The group clause\n- The orderby clause\n- The ascending and descending keywords\n\
    - The by keyword\n\n# The group clause and the by keyword\n\nThe group clause\
    \ takes a flat input sequence and produces an output sequence of groups. Another\
    \ way to think of this is that the output is produced like a list of lists; because\
    \ of this, a nested for loop can be used to iterate over all the groups and group\
    \ items.\n\nThe following code shows the use of the group clause and the by keyword\
    \ to group all ingredients that have the same amount of calories.\n\n```cs\nIngredient[]\
    \ ingredients = {\n    new Ingredient{Name = \"Sugar\", Calories=500},\n    new\
    \ Ingredient{Name = \"Lard\", Calories=500},\n    new Ingredient{Name = \"Butter\"\
    , Calories=500},\n    new Ingredient{Name = \"Egg\", Calories=100},\n};\n```\n"
  mdcn: "\n\n要执行连接（join），会将第一个序列中元素的某些值与第二个序列中元素的某些值进行等值比较。这里重要的是，连接子句执行的是等值连接（equi-joins）；对来自两个序列的值进行等值比较。这意味着连接子句不支持非等值连接，例如不等式，或大于、小于等比较。因此，并没有像\
    \ C# 中那样使用 `==` 运算符来指定连接元素，而是使用了 `equals` 关键字。引入此关键字的设计思路是为了非常清晰地表明连接是等值连接。\n\n\
    常见的连接类型：\n\n- 内连接连接（Inner joins）。\n- 分组连接（Group joins）。\n- 左外连接（Left outer joins）。\n\
    \n接下来的代码示例假设定义了以下类：\n\n```cs\nclass Recipe\n{\n    public int Id { get; set; }\n\
    \    public string Name { get; set; }\n}\n\nclass Review\n{\n    public int RecipeID\
    \ { get; set; }\n    public string ReviewText { get; set; }\n}\n```\n\n这两个类模拟了食谱可以有\
    \ 0 个、1 个或多个评论这一事实。`Review` 类有一个 `RecipeID` 属性，存储了评论所属食谱的 ID；但请注意，并没有以 `Recipe`\
    \ 类型形式存在的直接关系。\n\n## 内连接 (Inner join)\n\n内连接为第一个序列中的每个在第二个序列中具有匹配项的元素，在输出序列中返回一个元素。如果第一个序列中的元素在第二个序列中没有任何匹配元素，则它将不会出现在输出序列中。\n\
    \n看以下代码示例：\n\n```cs\nRecipe[] recipes = {\n  new Recipe {Id = 1, Name = \"Mashed\
    \ Potato\"},\n  new Recipe {Id = 2, Name = \"Crispy Duck\"},\n  new Recipe {Id\
    \ = 3, Name = \"Sachertorte\"}\n};\n```\n\n```cs\nReview[] reviews = {\n  new\
    \ Review {RecipeId = 1, ReviewText = \"Tasty!\"},\n  new Review {RecipeId = 1,\
    \ ReviewText = \"Not nice:(\"},\n  new Review {RecipeId = 1, ReviewText = \"Pretty\
    \ good\"},\n  new Review {RecipeId = 2, ReviewText = \"Too hard\"},\n  new Review\
    \ {RecipeId = 2, ReviewText = \"Loved it\"}\n};\n```\n\n```cs\nvar query = from\
    \ recipe review in reviews on recipe.Id equals review.RecipeId\n  select new //\
    \ anonymous type\n  {\n    RecipeName = recipe.Name,\n    RecipeReview = review.ReviewText\n\
    \  };\n\nforeach (var item in query)\n{\n  Console.WriteLine(\"{0} - '{1}\", item.RecipeName,\
    \ item.RecipeReview);\n}\n```\n\n在前面的代码中，创建了两个输入序列：`recipes`（包含若干个食谱）和第二个序列 `reviews`（对象的评论）。\n\
    \n查询表达式以 `from` 子句开头，指向第一个序列（`recipes`）并声明变量 `recipeId`。\n\n接下来是使用 `join` 子句。这里引入了另一个变量（`review`），代表在\
    \ `reviews` 输入序列中处理的元素。`on` 关键字允许指定 `recipe` 范围对象的哪个值与 `review` 范围变量对象的哪个值相关。在这里再次使用了\
    \ `equals` 关键字来表示等值连接。此 `Join` 子句本质上是说明评论通过 `Recipe` 中的 `Id` 和 `Review` 中的 `RecipeId`\
    \ 的共同值来属于食谱。\n\n执行此代码的运行如下：\n\nMashed Potato - 'Tasty!'\nMashed Potato - 'Not\
    \ nice :('\nMashed Potato - 'Pretty good'\nCrispy Duck - 'Too hard'\nCrispy Duck\
    \ - 'Loved it'\n\n注意这里食谱 'Sachertorte' 不在输出中。这是因为没有关于它的评论，即在第二个输入序列（`reviews`）中没有匹配元素。\n\
    \n另外请注意结果是“扁平的”，这意味着不存在一个属于“父级”食谱的评论组的概念。\n\n## 分组连接 (Group join)\n\n分组连接可以产生分组的分层级结果，其中第二个序列中的项匹配到第一个序列中的项。\n\
    \n与之前的内连接不同，分组连接的输出可以分层地组织，将评论分组到它们相关的食谱中。\n\n```cs\nRecipe[] recipes = {\n  new\
    \ Recipe {Id = 1, Name = \"Mashed Potato\"},\n  new Recipe {Id = 2, Name = \"\
    Crispy Duck\"},\n  new Recipe {Id = 3, Name = \"Sachertorte\"}\n};\n```\n\n```cs\n\
    Review[] reviews = {\n  new Review {Id = 1, ReviewText = \"Tasty!\"},\n  new Review\
    \ {Id = 1, ReviewText = \"Not nice :(\"},\n  new Review {Id = 1, ReviewText =\
    \ \"Pretty good\"},\n  new Review {Id = 2, ReviewText = \"Too hard\"},\n  new\
    \ Review {Id = 2, ReviewText = \"Liked it\"}\n};\n```\n\n```cs\nvar query =\n\
    \  from recipe in recipes\n  join review in reviews on recipe.Id equals review.Id\n\
    \  into reviewGroup\n  select new // anonymous type\n  {\n    RecipeName = recipe.Name,\n\
