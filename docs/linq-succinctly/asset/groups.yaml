    \ 属性值的字符串元素。”\n\n\n\n> 注意：单个查询操作符将在第 3 节“LINQ 查询操作符”中进行讨论。\n\n## 查询表达式样式\n\n查询表达式（Query\
    \ expressions）在流式语法（fluent syntax）的基础上提供了语法上的便利。\n\n以下代码显示了使用查询语法实现上述流式语法查询的等效版本。\n\
    \n```cs\nIngredient[] ingredients = \n{\nnew Ingredient(Name = \"Sugar\", Calories=500),\n\
