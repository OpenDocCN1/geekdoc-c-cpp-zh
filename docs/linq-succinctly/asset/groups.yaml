    # # Chapter 3 LINQ Query Operators


    This chapter discusses the standard query operators and is organized by the classification
    of the operators. Query operators can be grouped into categories such as join
    operators, generation operators, and projection operators.


    At a higher level, query operators can be classified as falling into one of three
    categories based on their inputs/outputs:


    +   - Input sequence(s) results in an output sequence.

    - Input sequence results in scalar value/single element output.

    - No input results in an output sequence (these operators generate their own elements).


    The final category might seem strange at first glance, as these operators do not
    take an input sequence. They can be useful, for example, when sequence of integers
    needs creating, by reducing the amount of code we need to perform this generation.


    Beyond this categorization based on input/output, the standard query operators
    can be grouped as shown in the following list. The operators in each category
    will be discussed in detail in this chapter.


    Query operators:


    +   - Restriction: Where

    - Projection: Select, SelectMany

    - Partitioning: Take, Skip, TakeWhile, SkipWhile

    - Ordering: OrderBy, OrderOrderBy, ThenBy, ThenOrderBy, Reverse

    - Grouping: GroupBy

    - Set: Concat, Union, Intersect, Except

    - Conversion: ToArray, ToList, ToDictionary, ToLookup, OfType, Cast

    - Element: First, FirstOrDefault, Last, LastOrDefault, Single, SingleOrDefault,
    ElementAt, DefaultIfEmpty

    - Generation: Empty, Range, Repeat

    - Quantifiers: Any, All, Contains, SequenceEqual

    - Aggregate: Count, LongCount, Sum, Min, Max, Average, Aggregate

    - Joining: Join, GroupJoin, Zip


    # # Restriction Operators


    Restriction query operators take an input sequence and output sequence of elements
    that are restricted ("filtered") in some way. The elements that make up the output
    sequence are those that match the specified restriction. Individual output elements
    themselves are not modified or transformed.'
