  mdcn: "\n这产生了以下输出：\n\n```\nMilk 100\nEgg 100\nButter 200\nSugar 500\nFlour 500\n\
    ```\n\n注意，在输入序列中，“Flour\" 在 \"Sugar\" 之前，但由于使用了 `ThenDescending`，它们在输出中被反转了。\n\
    \n# 查询表达式的用法\n\n在使用查询表达式风格时，使用 `descending` 关键字，如下代码所示。\n\n```\nvar query = from\
    \ i in ingredients\n    orderby i.Calories, i.Name descending\n    select i;\n\
    ```\n\n# 反转 (Reverse)\n\n`Reverse` 查询操作符简单地获取输入序列并在输出序列中以反序返回元素；例如，输入序列中的第一个元素将成为输出序列中的最后一个元素。\n\
    \n```\nchar[] letters={'A', 'B', 'C'};\n\nvar query = letters.Reverse();\n\nforeach\
    \ (var item in query)\n{\n    Console.WriteLine(item);\n}\n```\n\n上述代码产生了以下输出：\n\
    \n```\nC\nB\nA\n```\n\n# 查询表达式的用法\n\n在使用查询表达式风格时，没有 `Reverse` 关键字；但是，可以使用混合风格。\n\
    \n# 分组操作符 (Grouping Operators)\n\n## GroupBy\n\n`GroupBy` 查询操作符接收一个输入序列并返回一个序列的序列（组）输出序列。`GroupBy`\
    \ 方法的基本重载接受一个表示分组键的 Lambda 表达式。\n\n以下代码展示了如何根据卡路里对所有配料进行分组。\n\n```\nIngredient[]\
    \ ingredients = {\n    new Ingredient(Name = \"Sugar\", Calories=500),\n    new\
    \ Ingredient(Name = \"Lard\", Calories=500),\n    new Ingredient(Name = \"Butter\"\
    , Calories=500),\n    new Ingredient(Name = \"Egg\", Calories=100),\n    new Ingredient(Name\
    \ = \"Milk\", Calories=100),\n    new Ingredient(Name = \"Flour\", Calories=50),\n\
    \    new Ingredient(Name = \"Oats\", Calories=50)\n};\n```\n\n```\nIEnumerable<IGrouping<int,\
    \ Ingredient>> query =\n    ingredients.GroupBy(x => x.Calories);\n\nforeach (IGrouping<int,\
    \ Ingredient> group in query)\n{\n    Console.WriteLine(\"Ingredients with {0}\
    \ calories\", group.Key);\n    foreach (Ingredient ingredient in group)\n    {\n\
    \        Console.WriteLine(\"- {0}\", ingredient.Name);\n    }\n}\n```\n\n在上述代码中，序列的序列本质上是一个\
    \ `Grouping` 列表 (IEnumerable)。每个 `Grouping` 元素包含键（在本例中是卡路里的 int 类型）以及具有相同卡路里的配料列表。\n\
    \n这产生了以下输出：\n\n- Ingredients with 500 calories\n- Sugar\n- Lard\n- Butter\n\n\
    - Ingredients with 100 calories\n- Egg\n- Milk\n\n- Ingredients with 50 calories\n\
    - Flour\n- Oats\n\n# 查询表达式的用法\n\n在使用查询表达式风格时，使用 **group** 关键字；我们在第 2 章“流式风格与查询表达式风格”中见过\
    \ **group** 关键字的使用。\n\n# 集合操作符 (Set Operators)\n\n集合查询操作符执行基于集合的操作。这些操作符接收两个表示两个“集合”的序列并返回单一的输出序列。\n\
    \n集合查询操作符包括：\n\n- Concat\n- Union\n- Distinct\n- Intersect\n- Except\n\n# Concat\n\
    \n`Concat` 查询操作符接收第一个序列，并在其后追加第二个序列的所有元素后返回，如下代码所示。\n\n```\nstring[] applePie\
    \ = {\"Apple\", \"Sugar\", \"Pastry\", \"Cinnamon\"};\nstring[] cherryPie = {\"\
    Cherry\", \"Sugar\", \"Pastry\", \"Kirsch\"};\n\nIEnumerable<string> query = applePie.Concat(cherryPie);\n\
    foreach (string item in query)\n{\n    Console.WriteLine(item);\n}\n```\n\n这产生了以下输出：\n\
    \n- Apple\n- Sugar\n- Pastry\n- Cinnamon\n- Cherry\n- Sugar\n- Pastry\n- Kirsch\n\
    \n注意，任何重复元素（如 \"Sugar\" 和 \"Pastry\"）都被保留了。\n\n# 查询表达式的用法\n\n在使用查询表达式风格时，没有 `Concat`\
    \ 关键字；但是，可以使用混合风格。\n\n# Union\n\n`Union` 查询操作符执行与 `Concat` 类似的“合并”操作；然而，第一个和第二个序列中存在的任何重复元素都不会在输出中重复。\n\
    \n```c\nstring[] applePie = { \"Apple\", \"Sugar\", \"Pastry\", \"Cinnamon\" };\n\
    string[] cherryPie = { \"Cherry\", \"Sugar\", \"Pastry\", \"Kirsch\" };\n```\n\
    \n```c\nIEnumerable<string> query = applePie.Union(cherryPie);\n\nforeach (string\
    \ item in query)\n{\n    Console.WriteLine(item);\n}\n```\n\n这产生了以下输出：\n\n- Apple\n\
    - Sugar\n- Pastry\n- Cinnamon\n- Cherry\n- Kirsch\n\n注意任何重复项（例如 \"Sugar\" 和 \"\
    Pastry\"）已从输出序列中移除。\n\n# 查询表达式的用法\n\n在使用查询表达式风格时，没有 `Union` 关键字；但是，可以使用混合风格。\n\
    \n# Distinct\n\n虽然严格来说 `Distinct` 查询操作符不是集合操作符，因为它只作用于单个输入序列，但将其包含在此是为了展示如何通过使用\
    \ `Concat` 后接 `Distinct` 来模拟 `Union` 操作符。此外注意，`Distinct` 操作符与其他查询操作符链式调用，而不仅仅是集合操作符。\n\
    \n```c\nstring[] applePie = { \"Apple\", \"Sugar\", \"Pastry\", \"Cinnamon\" };\n\
    string[] cherryPie = { \"Cherry\", \"Sugar\", \"Pastry\", \"Kirsch\" };\nIEnumerable<string>\
    \ query = applePie.Concat(cherryPie).Distinct();\n\nforeach (string item in query)\n\
    {\n    Console.WriteLine(item);\n}\n```\n\n这产生了以下输出：\n\n- Apple\n- Sugar\n- Pastry\n\
    - Cinnamon\n- Cherry\n- Kirsch\n\n注意这与使用 `Union` 的输出相同。\n\n# 查询表达式的用法\n\n在使用查询表达式风格时，没有\
    \ `Distinct` 关键字；但是，可以使用混合风格。\n\n# Intersect\n\n`Intersect` 查询操作符返回存在于两个序列中的元素。在以下代码中，两个序列共有的元素是\
    \ \"Sugar\" 和 \"Pastry\"。\n\n```c\nstring[] applePie = { \"Apple\", \"Sugar\"\
    , \"Pastry\", \"Cinnamon\" };\nstring[] cherryPie = { \"Cherry\", \"Sugar\", \"\
    Pastry\", \"Kirsch\" };\n\nIEnumerable<string> query = applePie.Intersect(cherryPie);\n\
    \nforeach (string item in query)\n{\n    Console.WriteLine(item);\n}\n```\n\n\
    这产生了以下输出：\n\nSugar\nPastry\n\n注意这里的公共元素在输出中不会重复。\n\n# 查询表达式的用法\n\n在使用查询表达式风格时，没有\
    \ `Intersect` 关键字；但是，可以使用混合风格。\n\n# Except\n\n`Except` 查询操作符将返回第一个序列中不存在于第二个序列的元素。取以下代码：\n\
    \n```c\nstring[] applePie = { \"Apple\", \"Sugar\", \"Pastry\", \"Cinnamon\" };\n\
    string[] cherryPie = { \"Cherry\", \"Sugar\", \"Pastry\", \"Kirsch\" };\n\nIEnumerable<string>\
    \ query = applePie.Except(cherryPie);\n\nforeach (string item in query)\n{\n \
    \   Console.WriteLine(item);\n}\n```\n\n这产生了以下输出：\n\nApple\nCinnamon\n\n注意我们没有从第二个序列中获取任何元素。\n\
    \n# 查询表达式的用法\n\n在使用查询表达式风格时，没有 `Except` 关键字；但是，可以使用混合风格。\n\n# 转换操作符 (Conversion\
    \ Operators)\n\n转换查询操作符将 `IEnumerable<T>` 序列转换为其他类型的集合。\n\n可以使用以下查询操作符执行序列转换：\n\
    \n- OType\n- Cast\n- ToArray\n- ToList\n- ToDictionary\n- ToLookup\n\n# OType\n\
    \n`OType` 查询操作符返回包含指定元素的输出序列。实现 `OType` 查询操作符的扩展方法签名如下：\n\n```c\npublic static\
