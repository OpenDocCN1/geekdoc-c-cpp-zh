    牛奶\n糖\n\n执行的步骤与流式语法版本相同，每个查询句（`from`、`where`、`orderby`、`select`）将修改后的序列传递给下一个查询句。\n\
    \n上述代码中的查询表达式以 `from` 子句开始。`from` 子句有两个用途：第一个是描述输入序列是什么（在此情况下为 `ingredients`）；第二个是引入范围变量（range\
    \ variable）。\n\n最后一个子句是 `select` 子句，它描述了整个查询的输出序列。与流式语法版本一样，上述代码中的 `select` 子句将\
    \ `Ingredient` 对象序列投影为 `string` 对象序列。\n\n## 范围变量\n\n范围变量是一个表示序列中每个轮转元素的标识符。它类似于\
    \ `foreach` 语句中使用的变量；随着序列的处理，该范围变量代表正在处理的当前元素。在上述代码中，正在声明范围变量 `i`。尽管在每个子句中使用了相同的范围变量标识符\
    \ `i`，但范围变量“遍历”的序列是不同的。每个子句都对前一个子句产生的序列（或初始的 `IEnumerable<T>`）进行。这意味着每个子句都在处理不同的序列；只是重用了范围变量的名称。\n\
    \n除了 `from` 中引入的范围变量外，还可以其他子句或关键字添加额外的范围变量。以下内容可以在查询表达式中引入新的范围变量：\n\n- 额外的 `from`\
    \ 子句\n- `let` 子句\n- `into` 关键字\n- `join` 子句\n\n## let 子句\n\nLINQ 查询表达式中的子句允许引入额外的范围变量。这个额外的范围变量可以在随其后的其他子句中使用。\n\
    \n在以下代码中，使用 `let` 子句引入了一个名为 `Dairy` 的新范围变量，其类型为 `Boolean`。\n\n```cs\nIngredient[]\
    \ ingredients = {\n    new Ingredient{Name = \"Sugar\", Calories=500},\n    new\
