  md: '# Sum


    The Sum query operator adds all the elements of the input sequence and returns
    the total result.


    The following code demonstrates adding a sequence of ints.


    ```

    int[] nums = { 1, 2, 3 };

    int total = nums.Sum();

    Console.WriteLine(total);

    ```


    This produces the following output:


    6


    The Sum query operator is implemented as individual extension methods for IEnumerable<T>
    (for example, IEnumerable<long>) for each of the numeric types (nullable equivalents).
    This means that in order to use Sum on non-numeric sequences, overload must be
    used to select a numeric value from the non-numeric input elements. The following
    code shows how to Sum the calorie values of a sequence of Ingredient.


    ```

    Ingredient[] ingredients = {

    new Ingredient {Name = "Sugar", Calories = 500},

    new Ingredient {Name = "Egg", Calories = 100},

    new Ingredient {Name = "Milk", Calories = 150},

    new Ingredient {Name = "Flour", Calories = 50},

    new Ingredient {Name = "Butter", Calories = 400}

    }

    int totalCalories = ingredients.Sum(x => x.Calories);

    Console.WriteLine(totalCalories);

    ```


    This produces the following output:


    1200


    # Query expression usage


    There is no keyword for Sum when using the query expression style; however, mixed
    style can be used.'
