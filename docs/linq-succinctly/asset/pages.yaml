  md: '# Max


    The **Max** query operator complements the **Min** operator and returns the smallest
    value from the input sequence, as the following code demonstrates.


    ```

    int[] nums = { 1, 3, 2 };

    var largest = nums.Max();

    Console.WriteLine(largest);

    ```


    This produces the following output:


    3


    As with Min, there is an overload of **Max** that allows a selector to be specified.


    # Query expression usage


    There is no keyword for **Max** when using the query expression style; however,
    mixed style can be used.


    # Aggregate


    The previous aggregate operators all perform a specific aggregation; the **Aggregate**
    query operator is a more advanced operator that allows custom aggregations to
    be defined and executed against an input sequence.


    There are two versions of **Aggregate**: one that allows a "seed" value to be
    specified, and one that uses the first element in the sequence as the seed value.


    All versions of **Aggregate** require an "accumulator function" to be specified.
    The accumulator, as its name suggests, accumulates a result as each element in
    the input sequence is processed. The accumulator function is passed the value
    of the current element being processed and the current accumulated value.


    The following code demonstrates how to simulate the **Sum** operator using **Aggregate**.


    ```

    int[] nums = { 1, 2, 3 };

    var result = nums.Aggregate(0,

    (currentElement, runningTotal) => runningTotal + currentElement);

    Console.WriteLine(result);

    ```


    This produces the following output:'
