    Notice the output elements are in the same order as the input elements. It should
    be noted that PLINQ has to do extra work to track the position of input elements
    when AsOrdered is used, there may be some negative performance implications, depending
    on the size of the input sequence. If only part of the query requires order preservation,
    then AsOrdered can be used for those parts. If other parts of the query do not
    require order preservation, the default unordered behavior can be restored by
    adding a call to the AsUnordered extension method. Subsequent query operators
    after the AsUnordered will not track the input ordering of elements.


    # Potential PLINQ Problems


    There are a number of things to not always be aware of when using PLINQ:


    +   - PLINQ may not be faster than LINQ

    - Avoid writing to shared memory (as static variables)

    - Do not call thread-safe methods from PLINQ

    - Calling thread-safe methods may incur locking/synchronization overheads'
