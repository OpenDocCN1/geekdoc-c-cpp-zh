  md: 'The following code shows the method signatures for the Where query operator
    for both the local and interpreted versions.


    ```

    // Local version of Where from System.Linq.Enumerable

    public static IEnumerable<TSource> Where<TSource>(this IEnumerable<TSource>

    source, Func<TSource, bool> predicate)


    // Interpreted version of Where from System.Linq.Queryable

    public static IQueryable<TSource> Where<TSource>(this IQueryable<TSource>

    source, Expression<Func<TSource, bool>> predicate)

    ```


    In noticing the code that the local version takes a predicate parameter of type
    Func<TSource, bool>. Contrast this with the interpreted version where the predicate
    parameter is Expression<Func<TSource, bool>>. This is the expression that the
    query provider can turn into meaningful code execution, such as generating an
    equivalent SQL statement and executing against a database.


    Because IQueryable<T> is a subtype of IEnumerable<T>, the compiler has to choose
    whether to use the local or remote version of query operator. The compiler dictates
    that the more specific version will be chosen. IQueryable<T> is more specific
    than IEnumerable<T>, the compiler will choose the interpreted versions of the
    query operators (as defined in System.Linq.Query) when dealing with interpreted
    queries, and local versions of query operators (as defined in System.Linq.Enumerable)
    when dealing with local queries. This fact (and C#''s implicit conversion of lambda
    expressions to Expression<T>) means that LINQ queries can provide a unified API
    regardless of whether the query is a local one or a remote interpreted query.


    > Note: Not all of the standard query operators will be supported by all interpreted
    query providers.


    # Query providers


    Microsoft™ has pre-built query providers that operate with databases, such as
    the older LINQ to SQL and the new Entity Framework.


    There are also numerous third-party or open source query providers including:


    +   - LINQ to Twitter

    - LINQ to flickr

    - LINQ to JSON


    These examples serve to demonstrate the powerful and flexible nature of LINQ interpreted
    queries. Remote data stores of different types can be queried using a common set
    of LINQ query operators.'
