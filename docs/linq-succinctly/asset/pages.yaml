  md: "# Query expression usage\n\nThere is no keyword for OType when using the query\
    \ expression style; however, mixed style can be used.\n\n# Cast\n\nLike the OType\
    \ query operator, the Cast query operator can take an input sequence and return\
    \ an output sequence containing elements of each type. Each element in the input\
    \ sequence is cast to the specified type; however, unlike OType, which just ignores\
    \ any incompatible types, if the cast is not successful, an exception will be\
    \ thrown.\n\nThe following code shows an example of using Cast will throw an exception.\n\
    \n```\nIEnumerable input = new object[]\n{\n    \"Apple\", 33, \"Sugar\", 44,\
    \ 'a', new DateTime()\n}\nIEnumerable<string> query = input.Cast<string>();\n\
    foreach (string item in query)\n{\n    Console.WriteLine(item);\n}\n```\n\nRunning\
    \ this code will cause a \"System.InvalidCastException : Unable to cast object\
    \ of 'System.Int32' to type 'System.String\" exception.\n\n# Query expression\
    \ usage\n\nWhile there is no keyword for Cast when using the query expression\
    \ style, it is supported by giving the range variable specific type, as in the\
    \ following code.\n\n```\nIEnumerable input = new object[] {\"Apple\", \"Sugar\"\
    , \"Flour\"};\nIEnumerable<string> query = from string i in input\nselect i;\n\
    ```\n\nNote in the preceding code the explicit type declaration string before\
    \ the range variable name i."
