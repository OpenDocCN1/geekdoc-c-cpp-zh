  md: "# Last\n\nThe Last query operator returns the final element in the input sequence.\
    \ As with First, there is an overloaded version that also takes a predicate. This\
    \ predicate version will return the last element in the sequence that satisfies\
    \ the predicate. Also as with First, an exception will be thrown if the input\
    \ sequence contains zero elements, or if the predicate cannot be satisfied by\
    \ any element.\n\nThe following code shows the predicate version of Last.\n\n\
    ```\nIngredient[] ingredients = {\n    new Ingredient(Name = \"Sugar\", Calories\
    \ = 500);\n    new Ingredient(Name = \"Egg\", Calories = 100);\n    new Ingredient(Name\
    \ = \"Milk\", Calories = 50);\n    new Ingredient(Name = \"Flour\", Calories =\
    \ 50);\n    new Ingredient(Name = \"Butter\", Calories = 500);\n};\n```\n\nIngredient\
    \ element = ingredients.Last(x => x.Calories == 50);\n\nConsole.WriteLine(element.Name);\n\
    \nThis produces the following output:\n\nFlour\n\nNotice here that \"Flour\" is\
    \ not the last element in the sequence as a whole, but rather the last element\
    \ that has 50 calories.\n\n# Query expression usage\n\nThere is no keyword for\
    \ Last when using the query expression style; however, mixed style can be used.\n\
    \n# LastOrDefault\n\nThe LastOrDefault query operator works in a similar way to\
    \ Last, and also has an overloaded version that takes a predicate.\n\nLike FirstOrDefault,\
    \ if the input sequence is empty or no element satisfies the predicate, rather\
    \ than an exception being thrown, the default value for the element type is returned\
    \ instead.\n\n# Query expression usage\n\nThere is no keyword for LastOrDefault\
    \ when using the query expression style; however, mixed style can be used."
