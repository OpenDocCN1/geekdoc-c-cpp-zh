  md: "# Chapter 2 Fluent and Query Expression Styles\n\nThere are two styles of writing\
    \ LINQ queries: the fluent style (or fluent syntax) and the query expression style\
    \ (or query syntax).\n\nThe fluent style uses query operator extension methods\
    \ to create queries, while the query expression style uses a different syntax\
    \ that the compiler will translate into fluent style.\n\n# Fluent style\n\nThe\
    \ code samples up until this point have all used the fluent syntax.\n\nThe fluent\
    \ syntax makes use of the query operator extension methods as defined in the static\
    \ System.Linq.Enumerable class (or System.Linq.Queryable for interpreted or System.Linq.ParallelEnumerable\
    \ for LINQ queries). These extension methods add additional methods to instances\
    \ of IEnumerable<TSource>. This means that any instance of a class that implements\
    \ this interface can use these fluent extension methods.\n\nQuery operators can\
    \ be used singularly, or chained together to create more complex queries.\n\n\
    # Chained query operators\n\nIf the following class has been defined:\n\n```\n\
    class Ingredient\n{\n    public string Name { get; set; }\n    public int Calories\
    \ { get; set; }\n}\n\nThe following code uses three chained queries: Where, OrderBy,\
    \ and Select.\n\nIngredient[] ingredients = {\n    new Ingredient{Name = \"Sugar\"\
    , Calories=500},\n    new Ingredient{Name = \"Egg\", Calories=100},\n    new Ingredient{Name\
    \ = \"Milk\", Calories=150},\n    new Ingredient{Name = \"Flour\", Calories=50},\n\
    \    new Ingredient{Name = \"Butter\", Calories=200}\n};\n```"
  merge: -1
  pgno: 17
- img_proc: true
  md: "```\nIEnumerable<string> highCalorieIngredientNamesQuery =\n    ingredients.Where(x\
    \ => x.Calories >= 150)\n    .OrderBy(x => x.Name)\n    .Select(x => x.Name);\n\
    \nforeach (var ingredientName in highCalorieIngredientNamesQuery)\n{\n    Console.WriteLine(ingredientName);\n\
    }\n```\n\nExecuting this code produces the following output:\n\n+   - Butter\n\
    - Milk\n- Sugar\n\nFigure 2 shows a graphical representation of this chain of\
    \ query operators. Each operator input on the sequence provided by the preceding\
    \ query operator. Notice that the initial input sequence (represented by the variable\
    \ ingredients) is an IEnumerable<Ingredient>, whereas the output sequence (represented\
    \ by the variable highCalorieIngredientNamesQuery) is a different type; it is\
    \ an IEnumerable<string>.\n\nIn this example, the chain of operators is working\
    \ with a sequence of Ingredient elements until the Select transforms each element\
    \ in the sequence; each Ingredient object is transformed to a simple string. This\
    \ transformation is called projection. Input elements are projected into transformed\
    \ output elements."
  merge: -1
