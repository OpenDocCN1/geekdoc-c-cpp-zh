  md: '# # Chapter 5 Interpreted Queries


    # ## Overview


    Up until this point in the book, we have focused mainly on local queries. Local
    queries are those that operate on IEnumerable<T> sequences. Local queries result
    in the query operators that are defined in the System.Linq.Enumerable class being
    executed. In this way, executing local queries results in specific code running
    (from the query operators in the Enumerable class) as defined at compile time.


    Interpreted queries, on the other hand, describe the "shape" of the query that
    is instead interpreted at runtime—hence the name "interpreted". Interpreted queries
    operate on IQueryable<T> sequences, and when writing LINQ, the query operators
    resolve to methods defined in the System.Linq.Queryable class rather than with
    local.


    Another way to think about the difference between local IEnumerable<T> queries
    and interpreted IQueryable<T> queries is that the local queries contain the actual
    implementation code that gets executed, whereas the interpreted query operators
    do not. actual code that gets executed and returns some result is defined in a
    query provider. The query provider is passed the description of the query that
    needs to be executed; it executes the query (for example, executing SQL against
    a database) and returns the result.


    # ## Expression trees


    The query operators that work on IQueryable<T> differ from their equivalent versions
    for local queries.


    Local IEnumerable<T> versions of query operators take delegates as parameters
    (often described using a lambda expression). In contrast, interpreted queries
    take expression trees as parameters.


    Because C# will implicitly convert a lambda expression when used as a query operator
    parameter to an expression, the same lambda expression can be used regardless
    of whether the query operator is a local or remote. The one of where query operator
    and the interpreted IQueryable<T> version being used. Notice that the lambda expression
    is the same in both cases.


    ```

    IQueryable<int> interpretedQuery = remoteData.Where(x => x > 100);

    IEnumerable<int> localQuery = localData.Where(x => x > 100);

    ```'
