    | Select(x => x.Name) |

    | "Butter" | "Milk" | "Sugar" |

    | output sequence : IEnumerable<string> |

    | "Butter" | "Milk" | "Sugar" |


    Figure 2: Multiple query operators acting in a chain


    The lambda expression provided to the Select query operator decides what "shape"
    the elements in the output sequence will take. The lambda expression x => x.Name
    is telling the Select operator "for each Ingredient, output a string element with
    the value of the Name property from the input Ingredient.".


    > Note: Individual query operators will be discussed later in Chapter 3, LINQ
    Query Operators.


    # # Query expression style


    Query expressions offer a syntactical nicety on top of the fluent syntax.


    The following code shows the equivalent version using query syntax of the preceding
    fluent style query.'
