  md: "# ToArray\n\nThe **ToArray** query operator takes an input sequence and creates\
    \ an output array containing the elements. **ToArray** will also cause immediate\
    \ query execution (enumeration of the input sequence) and overrides the default\
    \ execution behavior\n\nIn the following code, the `IEnumerable<string>` is converted\
    \ to an array of strings.\n\n```\nIEnumerable<string> input = new List<string>\
    \ { \"Apple\", \"Sugar\", \"Flour\" };\nstring[] array = input.ToArray();\n```\n\
    \n# Query expression usage\n\nThere is no keyword for **ToArray** when using the\
    \ query expression style; however, mixed style can be used.\n\n# ToList\n\nThe\
    \ **ToList** query operator, like the **ToArray** operator, usually bypasses deferred\
    \ execution. Whereas **ToArray** creates an array representing the input elements,\
    \ **ToList**, as its name suggests, instead outputs a List<T>.\n\n```\nIEnumerable<string>\
    \ input = new[] { { \"Apple\", \"Sugar\", \"Flour\" };\nList<string> list = input.ToList();\n\
    ```\n\n# Query expression usage\n\nThere is no keyword for **ToList** when using\
    \ the query expression style; however, mixed style can be used.\n\n# ToDictionary\n\
    \nThe **ToDictionary** query operator converts an input sequence into a generic\
    \ **Dictionary<TKey, TValue>.\n\nThe simplest overload of the **ToDictionary**\
    \ method takes a lambda expression representing a function, which is used for\
    \ the key of each item in the resulting Dictionary.\n\n```\nIEnumerable<Recipe>\
    \ recipes = new[]\n{\n    new Recipe {Id = 1, Name = \"Apple Pie\", Rating = 5},\n\
    \    new Recipe {IdId = 2, Name = \"Cherry Pie\", Rating = 2},\n    new Recipe\
    \ {IdId = 3, Name = \"Beef Pie\", Rating = 3}\n};\n```"
