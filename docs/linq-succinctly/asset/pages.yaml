    # Using the different styles


    The two LINQ styles can be used together; for example, fluent query operators
    can be mixed with the query expression style.


    # Advantages of the different styles


    Each syntax has its own benefits.


    # Query expression style keyword availability


    Not every query operator that is available using the fluent syntax has an equivalent
    query expression syntax keyword. The following query operators using the fluent
    style have associated keywords when using the query expression syntax:


    +   - GroupBy

    - GroupJoin

    - Join

    - OrderBy

    - OrderByDescending

    - Select

    - SelectMany

    - ThenBy

    - ThenByDescending

    - Where


    # Number of operators


    If the query only requires the use of a single query operator to get the required
    results, then a single call to a fluent style operator is usually a smaller amount
    of code to write, and can also be more comprehensible by readers.


    The following code shows a query returning all ingredients over 150 calories using
    both the fluent style (q1) and query expression style (q2). Notice the fluent
    style is much terser when needing to use only a single operator.'
