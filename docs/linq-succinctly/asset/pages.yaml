  md: "```\nIngredient[] ingredients = \n{\nnew Ingredient(Name = \"Sugar\", Calories=500),\n\
    new Ingredient(Name = \"Egg\", Calories=100),\nnew Ingredient(Name = \"Milk\"\
    , Calories=150),\nnew Ingredient(Name = \"Flour\", Calories=50),\nnew Ingredient(Name\
    \ = \"Butter\", Calories=200)\n};\n```\n\n```\nIEnumerable<string> highCalorieIngredientNamesQuery\
    \ =\nfrom i in ingredients\nwhere i.Calories >= 150\norderby i.Name\nselect i.Name;\n\
    ```\n\n```\nforeach (var ingredientName in highCalorieIngredientNamesQuery)\n\
    {\n  Console.WriteLine(ingredientName);\n}\n```\n\nExecuting this code produces\
    \ the same output as the fluent syntax version:\n\nButter\nMilk\nSugar\n\nThe\
    \ steps that are performed are the same as in the fluent syntax version, with\
    \ each query clause (from, where, orderby, select) passing on a modified sequence\
    \ to the next query clause.\n\nThe query expression in the preceding code begins\
    \ with the from clause. The from clause has two purposes: the first is to describe\
    \ what the input sequence is (in this case ingredients); the second is to introduce\
    \ a range variable.\n\nThe final clause is the select clause, which describes\
    \ what the output sequence will be from the entire query. Just as with the fluent\
    \ syntax version, the select clause in the preceding code is projecting a sequence\
    \ of Ingredient objects into a sequence of string objects."
