  md: "For further information and a more comprehensive list, see the MSDN documentation\
    \ at https://msdn.microsoft.com/en-us/library/dd997403%28vs=ls110%29.aspx.\n\n\
    # Mixing LINQ and PLINQ\n\nA single query can execute in standard sequential mode\
    \ and have some parts of the query execute in parallel. This provides flexibility\
    \ to the query author and enables non-threadsafe parts of the query (or where\
    \ parallelization may run more slowly) to run sequentially, while other parts\
    \ run in parallel.\n\nWhile the AsParallel method switches the query to PLINQ\
    \ mode, the companion AsSequential method switches back to regular LINQ.\n\nThe\
    \ following code shows the method signature of the AsSequential method. Notice\
    \ that the extension method works on a ParallelQuery<TSource> input sequence and\
    \ returns a IEnumerable<T>. Because the return type is a normal IEnumerable<T>,\
    \ subsequent query operators will bind to the local LINQ operators, not PLINQ\
    \ ones.\n\n```\npublic static IEnumerable<TSource> AsSequential<TSource>(\this\
    \ ParallelQuery<TSource> source)\n```\n\nThe following code demonstrates how to\
    \ switch between LINQ and PLINQ in a single query.\n\n```\nIEnumerable<int> inputNumbers\
    \ = Enumerable.Range(1, 10).ToArray();\nIEnumerable<int> outputNumbers = .AsParallel()\n\
    \    .Select(x => x) // PLINQ version of Select\n    .AsSequential()\n    .Select(x\
    \ => x); // LINQ version of Select\n```"
