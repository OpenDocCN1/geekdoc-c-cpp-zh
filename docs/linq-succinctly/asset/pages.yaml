  md: '# All


    The All query operator takes a predicate and evaluates the elements in the input
    sequence to determine if every element satisfies this predicate.


    The following code checks that a sequence of ingredients constitutes a low-fat
    recipe.


    ```

    Ingredient[] ingredients =

    {

    new Ingredient {Name = "Sugar", Calories = 500},

    new Ingredient {Name = "Egg", Calories = 100},

    new Ingredient {Name = "Milk", Calories = 150},

    new Ingredient {Name = "Flour", Calories = 50},

    new Ingredient {Name = "Butter", Calories = 400}

    };


    bool isLowFatRecipe = ingredients.All(x => x.Calories < 200);


    Console.WriteLine(isLowFatRecipe);

    ```


    This produces the following output:


    False


    > Note: As soon as an element is found that does not satisfy the predicate, All()
    returns false and does not examine any subsequent elements.


    # Query expression usage


    There is no keyword for All when using the query expression style; however, mixed
    style can be used.


    # SequenceEqual


    The SequenceEqual query operator compares two sequences to see if they both have
    exactly the elements in the same order.


    The following code compares two identical sequences:


    ```

    IEnumerable<int> sequence1 = new[] { 1, 2, 3 };

    IEnumerable<int> sequence2 = new[] { 1, 2, 3 };


    bool isSeqEqual = sequence1.SequenceEqual(sequence2);


    Console.WriteLine(isSeqEqual);

    ```'
