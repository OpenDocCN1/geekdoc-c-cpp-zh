  md: "# Where\n\nThe where query operator returns output elements that match a given\
    \ predicate.\n\n> Tip: A predicate is a function that returns a bool result of\
    \ true if some condition is satisfied.\n\n```\nIngredient[] ingredients = {\n\
    \    new Ingredient {Name = \"Sugar\", Calories = 500};\n    new Ingredient {Name\
    \ = \"EGG\", Calories = 100};\n    new Ingredient {Name = \"Milk\", Calories =\
    \ 150};\n    new Ingredient {Name = \"Flour\", Calories = 50};\n    new Ingredient\
    \ {Name = \"Butter\", Calories = 200};\n}\nIEnumerable<Ingredient> query = ingredients\n\
    \    .Where(x => x.Calories >= 200);\n\nforeach (var ingredient in query)\n{\n\
    \    Console.WriteLine(ingredient.Name);\n}\n```\n\nThe preceding code shows how\
    \ the Where operates in use. Here the predicate x => x.Calories >= 200 will return\
    \ true for every ingredient that is greater than or equal to 200 calories.\n\n\
