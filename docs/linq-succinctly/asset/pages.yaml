    # Aggregate Operators


    The aggregate operators take an input sequence and return a single scalar value.
    The returned value is not one of the elements from the input sequence, but rather
    some derived value computed from the elements in the input sequence.


    The aggregate query operators are:


    +   - Count

    - LongCount

    - Sum

    - Min

    - Max

    - Average

    - Aggregate


    # Count


    The Count query operator simply returns the number of elements contained in the
    input sequence. There are two overloads, one of which accepts a predicate.'
