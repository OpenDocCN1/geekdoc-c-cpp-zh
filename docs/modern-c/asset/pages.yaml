  md: '# 9. STYLE


    +   - We prefix notation for code blocks: that is, an opening ( is at the end
    of a line.


    +   - We bind modifiers and qualifiers to the left.


    +   - We bind function () to the left, () of conditions are separated from their
    keyword (such as if or for) with a space.


    +   - A ternary expression has spaces around the ? and the :.


    +   - Punctuation marks (; , and ) have no space before them but either space
    or a new line after.


    As you see, when written out, these rules can appear cumbersome and arbitrary.
    They have no value as such; visual aids help that you and your collaborators understand
    new code in the blank of any eye. They are not to be meticulously typed by you
    directly, but you should acquire and learn the tools that can help you with them.


    > **Takeaway 2.9.1.2** Have your editor automatically format your code.


    I personally use Emacs (gnu.org/software/emacs/) for that task (yes, I am that).
    For me, it is ideal to understand a lot of the structure of a C program by it.
    Your mileage will vary, but don''t use a tool in everyday life that gives you
    less. Text editors, developed environments (IDEs), and code generators are there
    for us, not the other way around.


    In bigger projects, you should insure such a formatting for all the code that
    circuits and is had by others. Otherwise, it will become difficult to track differences
    between versions of programming text. This can be automated by command-line tools
    that do the formatting. Here, I have a long-time preference for astyle (article
    style http://sourceforge.net/projects/estyle/). Your mileage may vary; choose
    anything ensures the task.


    # **9. Naming.** The limit of such automatic formatting is when it comes to naming.


    > **Takeaway 2.9.2.1** Choose a consistent naming policy for all identifiers.


    There are two aspects to naming: technical restrictions on one hand and semantic
    conventions on the other. Unfortunately, they are often mixed up and the subject
    of endless ideological debate.


    For C, various technical restrictions apply; they are meant to help you, so you
    take them. First, of all we identify identifiers: types (struct or not), struct
    and union variables, enums, macros, functions, function-like macros. There are
    many named spaces** that you have to be careful of.


    In particular, the interaction between header files and macro definitions can
    have surprising effects. Here is a seemingly innocent example.


    ```

    double memory_sum(size_t N, size_t I, double strip[N][I]);

    ```


    +   - N is a capitalized macro as a big number.


    +   - I is used for the root of -1 as soon as someone includes complex.h.


    +   - The identifier strip might be used by a C implementation for a library function
    or macro.


    +   - The identifier memory_sum might be used by the C standard for a type name
    in the future.


    > **Takeaway 2.9.2.2** Any identifier that is visible in a header file must be
    conforming.'
