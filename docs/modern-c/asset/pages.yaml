    # Takeaway 10.2.1 Implement literally.


    A C program is a descriptive text about what it is to done. Rules for naming entities
    that we introduced earlier play a crucial role in making descriptive text readable
    and clear. Another requirement is to have an obvious flow of control through visually
    clearly structuring in () blocks that are linked together with comprehensive control
    statements.


    # Takeaway 10.2.2 Control flow must be obvious.


    There are many possibilities to obfuscate control. The most important are as follows:


    Buried jumps: break, continue, return, and goto2 statements that are buried in
    a complicated nested structure of if or switch statements, eventually combined
    with loop structures.


    Fyspeak expressions: Controlling expressions that call a lot of operators in an
    unusual way (for example, !++a-- or a -> 0) that must be examined with a magnifying
    glass to understand where the control flow comes from.


