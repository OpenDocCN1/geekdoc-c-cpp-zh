    - The function return value depends only on its parameters.\n\nThe only interest\
    \ in the execution of a pure function is its result, and that result only depends\
    \ on the arguments that are passed. From the point of view of optimization, pure\
    \ functions can be moved around or even in parallel to other tasks. Execution\
    \ can start at any point when its parameters are available and must be finished\
    \ before the result is used.\n\nEffects that disqualify a function from being\
