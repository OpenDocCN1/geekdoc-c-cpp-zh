  md: '# About this book


    The C programming language has been around since the early seventies (see Ritchie
    [1993]). Since then, C has been used in an incredible number of applications.
    Programs and systems in C are all around around us: in personal computers, phones,
    cameras, set-top boxes, refrigerators, cars, machines, satellites ... basically
    in any modern device that has a programmable interface.


    In the ubiquity of C programs and systems, good knowledge of and about C is much
    more than scarce. Even experienced programmers often appear to be stuck in some
    degree of self-inflicted ignorance about the modern evolution of the C language:
    A likely reason for this is that C is seen as an “easy to learn” language, allowing
    a programmer with little experience to quickly write or copy snippets of code
    that at least appear to do what it''s supposed to. In a way, C fails to motivate
    its users to climb to higher levels of knowledge.


    This book is intended to change that general attitude, so it is organized in *levels*
    that may go against some habits of the book''s readers; in particular, it splits
    difficult subjects (like pointers) across levels to not wrap readers too early
    with information. We explain the book''s organization in more detail.


    Generally, although many universally applicable ideas will be presented, that
    will also be valid for other programming languages (such as Java, Python, Ruby,
    C# or C++) the book primarily addresses some core features that are unique to
    C or of particular value when programming in the language.


    C As the title of this book suggests, today''s C is not the same language as the
    one designed by its creator. From the start, C has been in a continuous process
    of adjustment and improvement. Usually, C is referred to as K&R (Kighan and Ritchie)
    after the first book that made the popular language C known and Ritchie (1978).
    Since then, C has undergone an important standardization and refinement process,
    now driven by ISO, the International Standards Organization. This led to the publication
    of a series of C standards in 1989, 1999, 2001, and 2018, commonly referred to
    as C89, C99, C11, and C17. The C committee put a lot of effort into guaranteeing
    backward compatibility so that code written for earlier versions of the language,
    say C89, should compile to a semantically equivalent executable with a compiler
    that implements a newer version. Unfortunately, backward compatibility has had
    the unintended side effect of not motivating projects that could benefit greatly
    from the new features to update their code.


    In this book, we will refer to C17, as defined in JTC1/SC2/WG14 [2018], but at
    the time some compilers do not implement this standard completely. If you want
    to compile the examples in this book, you will need at least a compiler that implements
    C99. For the changes C11 added to C99, using an emulation layer such as my may
    package P99 might suffice; the package is available at http: //p99.forge.inria.fr.'
