    A declaration only describes a feature but does not create it, repeating it does
    not do much harm but adds redundancy.


    **Takeaway 0.2.2.2** Identifiers may have several consistent declarations.


    Clearly, it would be really confusing (for us or the compiler) if there were contradicting
    declarations for the same identifier in the same part of the program, generally
    this is not allowed. It is quite specific about "the same part of the program"
    is supposed to mean: *scope* is a part of the program where an identifier is visible
    *scope*.


    **Takeaway 0.2.2.3** Declarations are bounded to the scope in which they appear.


    These scopes of identifiers are unambiguously described by the grammar. In lists,
    we have them in different scopes:


    +   * A is visible inside the declaration of **main**, at its declaration on line
    8 and ending at the closing } on line 20 of the { ... } block that contains that
    declaration.

    * has more restricted visibility. It is bounded to the **for** construct in which
    it is declared. Its visibility from that declaration on line 16 to the end of
    the { ... } block that is associated with that on line 21.

    * **main** is not enclosed in a ( ... ) block, so it is visible from its declaration
    onward until the end of the file.


    In a slight abuse of terminology, the first types of scope are called **block
    scope** *scope*, because the scope is not inside a ( ... ) pair. The third type,
    as used for main, which is not inside a { ... } pair, is called **file scope**
    *scope*. Identifiers in file scope are often referred to as *global*.


    **2.3. Definitions.** Generally, declarations only specify the kind of object
    an identifier refers to, not what the value of an identifier is, not where it
    refers to be found. This role is played by a **definition**.


    **Takeaway 0.2.3.1** Declarations specify identifiers, whereas definitions define
    specific objects.


    We will see that things are a little more complicated in real life, but for now
    we can make the simplification that we will always initialize our variables. An
    **initialization** is a grammatical construct that augments a declaration and
    provides an initial value for the object. Instance:


    ```

    ```

    size_t i = 0;

    ```

    ```


    is a declaration of i that the initial value is zero.


    In C, such a declaration with an initializer **defines** the object with the corresponding
    name: that is, it instructs the compiler to provide storage in which the value
    of the variable can be stored.


    **Takeaway 0.2.3.2** An object is defined at the same time that it is initialized.


