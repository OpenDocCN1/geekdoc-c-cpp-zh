  md: '# 9. Style


    This section covers


    +   - Writing readable code

    - Formatting code

    - Naming identifiers


    Programs serve both sides; for as we have already seen, they serve to give instructions
    to the compiler and the final executable. But equally important, they document
    the intended behavior of a system for the people (users, customers, maintainers,
    lawyers, and so on) who have to deal with it.


    Therefore, we have a directive:


    > > Takeaway C: All code must be readable.


    The difficulty with that directive is what constitutes "readable." Not all experienced
    programmers agree, so we will begin by trying to establish a minimal list of necessities.
    The first thing we must have in mind when discussing the human condition is that
    it is constrained by two major factors: physical ability and cultural baggage.


    > **Takeaway 2.9.0** Short-term memory and the field of vision are small.


    Torvals et al. [1996], the coding style for the Linux kernel, is a good example
    that insists on that aspect and is worth a detour if you haven''t read it yet.
    Its main assumptions are still: a programming text has to be represented in a
    relatively small "window" on the console or consists of roughly 30 lines of columns,
    making a "surface" of 2,400 characters. Everything that doesn''t fit has to be
    memorized. For example, our first program in listing 1.1 fits into these constraints.


    By its humorous reference to Kernighan and Ritchie [1978], the Linux coding style
    also refers to another fact:


    > **Takeaway 2.9.0.2** Coding style is not a question of taste but culture.


    Ignoring this easily leads to endless and fruitless debates about not much at
    all.


    > **Takeaway 2.9.0.3** When you edit an established project, when you create a
    new project, you create a new culture.


    Try to adapt to the habits of the inhabitants. When you create your new project,
    you have a bit of freedom to establish your own rules. But be careful if you want
    to adhere to them; you must not deviate too much from the sense that reigns in
    the corresponding community.


    # 9.1. Formatting.


    The C language itself is relatively tolerant of formatting issues. Under normal
    circumstances, a compiler will plainly dump an entire program that is written
    on a single line with white space and where all identifiers are identified by
    the letter l and the digit 1. The need for code formatting originates in human
    incapacity.


    > **Takeaway 2.9.1.1** Choose a consistent strategy for space and other text formatting.


    Formatting indentation, placement of parentheses and all kinds of brackets ({}),
    spaces after operators, trailing spaces, and multiple new lines. The human eye
    are quite peculiar in their habits, and to ensure that they work properly and
    efficiently, everything must be in sync.


    In the introduction for level 1, you saw a lot of the coding style rules applied
    to the code in this. Take them as an example of style; you will likely encounter
    other styles as you go along. Let us recall some of the rules and others that
    have not been presented.'
  merge: -1
