    # 16.6. Type-generic programming. One of the genuine additions of C11 to the C
    lan-

    gauge has direct language support for type-generic programming. C99 had typeof.

    (see subsection 8.2) for type-generic mathematical functions, but it didn''t offer
    much to

    interfaces yourself. The special add-on is the keyword _Generic,

    introduces a primary expression of the following form:


    +   1 _Generic(controlling expression,

    2 type:expression);

    3 type:expressionN


    This is very similar to a switch statement. The controlling expression is only
    taken for

    its type (but shortly), and the result is one of the expressions expression1...expressionN

    chosen by the corresponding type-specific type...typeN, which one may be simply
    the

    keyword default.


    One of the simplest cases, and perhaps that the committee had in mind, is to

    use _Generic for a type-generic macro interface by providing a choice between
    function

    pointers. A basic example for this is the tmath.h interfaces, such as fabs. _Generic

    is not a feature itself but can be used in a macro expansion. By ignoring

    complex floating-point types, such a macro for fabs could look like this:


    ```

    #define fabs(X) \

    _Generic(X, \

    float: fabsf, \

    long double: fabsl, \

    default: fabs(X))

    ```


    This distinguishes between two types, float and long double, which choose the

    corresponding functions fabs and fabs, respectively. If X is any of other

    type, it is mapped to the default case of fabs. That is, other arithmetic types
    as

    double and integer are mapped to fabs [Ess 13][Ess 14]


    Now, once the resulting _Generic pointer is determined, it is applied to the argument

    list (X) that then follows.

    Here comes a more complete example:


    ```

    inline

    double min(double a, double b) {

    return a < b ? a : b;

    }

    inline

    long min(long double a, long double b) {

    return a < b ? a : b;}

    ```


