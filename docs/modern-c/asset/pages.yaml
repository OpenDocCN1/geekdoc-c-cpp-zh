    We will see this mechanism in return to the statement.


    2.4.3. Function return: The last statement in a function is a return. It tells
    the main function to return that once it''s done. Here, since main is in its declaration,
    a return must send back a value of type int to the calling statement. In this
    case, the value is EXIT_SUCCESS.


    Even though we can''t see its definition, the printf function must contain a similar
    return statement. At the point where we call the function on line 17, execution
    of the statements in main is suspended. Execution continues in the printf function
    until a return is encountered. After the return from printf, execution of the
    statements continues from where it stopped.


