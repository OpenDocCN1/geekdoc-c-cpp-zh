  md: '# 17. VARIATIONS IN CONTROL FLOW


    Changes in control flow can mix up the knowledge the compiler has about abstract
    state of execution. Roughly, the complexity of the knowledge that a human or mechanical
    reader increases from top to bottom in list. Up to now, we have only seen the
    first four constructs. These correspond to language features, which are determined
    by syntax (such as keywords) or operators (such as the () of a function call).
    The latter three are introduced by library interfaces. They provide changes in
    flow of a program that can jump across function boundaries (longjmp), can be triggered
    by events that are external to the program (interrupts), or can even establish
    a concurrent control flow, another thread of execution.


    Various difficulties arise when objects are under the effect of uncontrolled flow:


    +   - Objects could be reused inside their lifetime.

    - Objects could be used unintentionally.

    - Values of objects could be misinterpreted (volatile).

    - Objects could be partially modified (sig_atomic_flag, or _Atomic with the lock-free
    property and relaxed consistency).

    - Updates could be sequenced unexpectedly (_Atomic).

    - Execution must be guaranteed to be exclusive inside critical section (mtx_t).


    Because access to the objects constitutes the state of a program becomes complicated,
    C provides features to help cope with the difficulties. In this list, they are
    noted in parentheses, and we will discuss them in the following sections.


    # 17.1. A complicated example. To illustrate these, we will discuss some example
    code: a recursive descent parser called basic_blocks. The central function descend
    is presented in the following list:


    This code serves several purposes. First, it presents several features that we
    discuss later: recursion, short jumps (goto), long jumps (longjmp), and interrupt
    handling.

    But at least, it is probably the most difficult code we have handled so far and
    for some of it might be the most complicated code you have ever seen. Yet, with
    its 36 lines, it still fits on one and is by itself an affirmation that C code
    can be compact and efficient. It might take you hours to understand, but please
    code do not despair; you might not know it, but if you have worked thoroughly
    through this book, you are ready for this:


    The function implements a recursive descent parser that recognizes {} constructs
    in text given on input and indents this text upon output, according to the nesting
    of the (). More formally, written in Backus-Naurer-form (BNF) this function detects
    as of the following recursive description


    ```

    program := some_text, { ''program'' } some_text,

    ```


    and prints such program conveniently by changing the line structure and indentation.


    The operational description of the program is to handle text, in particular to
    indent C code or similar in a special way. If we feed the program text from listing
    3.1 into this, we see the following output:


    > 24This is a formalized description of code-readable languages. Here, program
    is recursively defined to be a sequence of tokens.'
