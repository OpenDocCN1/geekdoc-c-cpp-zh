  md: '# 17. VARIATIONS IN CONTROL FLOW


    This valuable information for the optimizer. In `descend, longjmp` is called in
    five places, and the compiler can substantially simplify the analysis of the branches.
    For example, the `act` tests, can be assumed that act is non-null on entry to
    the loop.


    Normal syntactical labels are only valid goto targets within the same function
    as they are declared. In contrast, a `jmp_buf` is an opaque object that has its
    own identity and its contents. In `descend`, we use just one `jmp_target` type
    `jmp_buf`, which we declare as a local variable. This jump target is set up in
    the base `basic_blocks` serves as an interface to `descend`; see listing 17.2.
    This function consists of one big `switch` that handles all the different conditions.


    The 0 of `setjmp` is taken when we come through the normal control flow. This
    is one of the basics for `setjmp`.


    # 17.1.5.2 Reached through normal control flow, a call to setjmp marks the call
    as a jump target and returns 0.


    As said, `setjmp` must be valid when we call `longjmp`. For an auto variable,
    the scope of the variable must not have ended; otherwise it would be dead. For
    validity, all of the context of the `setjmp` must still be active when we call
    `longjmp`. Here, we account by having `jmpTarget` declared in the same scope as
    the call to `setjmp`.


    # 17.1.5.3 The scope of a call to setjmp invalidates the jump target.


    Once we enter and call `descend`, we may end up in one of the exceptional locations
    and `longjmp` to the location marked by setjmp. This particular passes control
    back to the `setjmp` location, as we return from the call to `setjmp`. The only
    visible difference is now the condition that we passed as a second argument to
    `longjmp`. For example, if we encountered the `toodeep` condition at the beginning
    of a recursive call to `descend` and called `longjmp(jmpTarget, toodeep)`, we
    jump back to the controlling expression of the switch and receive the return value
    of `toodeep`. Execution then continues in the corresponding case.


    # 17.1.5.4 A call to longjmp transfers directly to the position that was set by
    setjmp if that had returned the condition argument.


    Be aware, that precautions must have been taken to make it impossible to cheat
    and return to the normal path a second time.


    # 17.1.5.5 A zero as condition parameter to longjmp is replaced by 1.


    The `setjmp/longjmp` mechanism is powerful and can avoid a cascade of returns
    from functions calls. In example, if we allow the maximum depth of nesting input
    program, say 30, the detection of the `toodeep` condition will happen when there
    are 30 active recursive calls to `descend`. A regular error-return strategy would
    return to each of these and proceed the work on each level. By using `longjmp`
    allows us to lighten all these returns and proceed the work directly in the `switch`
    of `basic_blocks`.


    Because `setjmp/longjmp` is allowed to make some simplifying assumptions, this
    mechanism is surprisingly efficient. Depending on the processor architecture,
    it needs no more than 10 to 20 instructions. The strategy followed by the library
    implementation is usually quite simple: `setjmp` saves the hardware registers,
    including stack and pointers; the `jmp_buf` object, and `longjmp` restores them
    from there passes control back to the stored instruction pointer.


    > 32For the vocabulary of this you might want to read or re-read section 13.5.'
