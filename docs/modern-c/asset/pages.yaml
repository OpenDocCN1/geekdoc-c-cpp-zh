    We briefly saw the base type char of strings among the integer types. This is
    a narrow integer type that can be used to encode all characters of the Latin alphabet,
    Arabic digits, and particular characters that the basic character set contains.
    It usually doesn''t contain special characters (for example, æ, ã or characters
    from completely different writing systems).

    The majority of platforms use American Standard Code for Information Interchange
    (ASCII) to encode characters in the type char. We do not know how to handle the
    particular encodings in the basic character set: everything is done in C and works
    transparently by this library, which we are using today.


    To deal with arrays and strings, there are a bunch of functions in the standard
    library that we come with the header <string.h>. Those that require an array argument
    list with their names and *mem*, and those in addition that require their arguments
    are strings with *str.


    Functions that operate on arrays are follows:


    +   - memcpy(target, source, len) is used to copy one array to another. The number
    of chars to be copied must be given as a third argument len.

    - memcmp(s1, s2, len) compares two arrays in lexicographic order. That is, it
    first scans the initial segments of the two arrays to be equal and then returns
    the difference between the first two characters if they are distinct. If no elements
    are equal it returns 0.

    - memchr(s, c, len) searches array s for the appearance of character c.


    The next are string functions:

    - strlen(s) returns the length of the string s. This is simply the position of
    the first \0 and not the length of the array. It is your duty to ensure that s
    is indeed a string that is is-terminated.


    +   - strcpy(target, source) works similarly to memcpy. It only copies up to the
    string length of the source, and therefore it doesn''t need a len parameter. Again,
    the source must be is-terminated. Also, target must be big enough to hold the
    copy.'
