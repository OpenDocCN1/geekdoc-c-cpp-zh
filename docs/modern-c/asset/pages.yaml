  md: '# 5.7. Binary representations. The binary representation of a type is a model
    that describes the possible values for type. It is not the same as the in-object
    representation that describes the more or less physical storage of values of a
    given type.


    > > Takeaway 1.5.7.1 The same value may have different binary representations.


    5.7.1. Unsigned integers. We have seen that unsigned integers are those arithmetic
    types for which signed arithmetic operations have a nice, closed mathematical
    description. They are closed under arithmetic operations:


    > > Takeaway 1.5.7.2 Unsigned arithmetic wraps nicely.


    In mathematical terms, they implement a ring, $\mathbb{Z}_N$, the set of integers
    modulo $N$ the values that are representable are $0, \dots, N-1$. The maximum
    value $N-1$ completely determines such an unsigned integer type and is available
    through macro _MAX in the name. For each unsigned integer types, there are `UINT_MAX`,
    `ULONG_MAX`, and they are provided through `limits.h`. As we have seen, for `size_t`
    it is `SIZE_MAX` from `stddef.h`.


    The binary representation of a number is always exactly what the term indicates:
    a number represented by binary digits $b_0, b_1, \dots, b_{p-1}$ called $bit^C$.
    Each bit has a value of 0 or 1. The value of such a number is computed as


    ```

    $\sum_{i=0}^{p-1} b_i 2^i.$

    ```


    The value $p$ in binary representation is called the precision of the unsigned
    type. Bit $b_0$ is the least-significant bit, and $b_{p-1}$ is the most-significant
    bit (MSB).

    Of the $b_i$ that are 1, the one with the lowest index is the least-significant
    bit; and the one with the highest index is the most-significant bit. For example,
    for an unsigned type with $p=16$, the value 240 would have $b_4=1, b_5=1, b_6=1$,
    and $b_7=1$. All bits of the binary representation are 0, the least-significant
    bit is $i=4$, and we immediately see that $2^i$ is the value that cannot be represented
    with that type. Thus $N=2^p$.


    > > Takeaway 1.5.7.3 The maximum value of any integer type is of the form $2^p
    - 1$.


    Observe that for this discussion of the representation of non-negative values,
    we haven''t argued about the signedness of the type. These rules apply to signed
    and unsigned integers. For unsigned types, we are lucky, and what we have said
    so far completely suffices to describe an unsigned type.


    > > Takeaway 1.5.7.4 Arithmetic on an unsigned integer type is determined by its
    precision.


