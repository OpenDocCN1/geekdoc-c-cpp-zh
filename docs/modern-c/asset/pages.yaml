    Here, the success consistency must be at as strong as the failure consistency;
    see 19.4.


    Up to now, we have implicitly assumed that the acquire and release sides of synchronization
    are symmetric, but they aren''t: whereas there is just one writer of a modification,
    there can be several readers. Because moving data to several processors or cores
    is expensive, some platforms allow us to avoid the propagation of all visible
    effects that happened before an atomic operation to threads that read the new
    value. C''s consume consistency is designed to map this behavior. We will not
    go into the details of this model, and you should use it only when you are certain
    that some effects prior to atomic read will not affect the reading thread.


    # Summary


    +   * The "happens before" relation is the only way to reason about timing between
    different threads. It is only established through synchronization that uses either
    atomic objects or specific C library functions.

    * Sequential consistency is the default consistency model for atomics, but not
    for other C library functions. It is a strong model because it assumes that all
    corresponding synchronization events are totally ordered. This is an assumption
    that can be expensive.

    * Explicitly using acquire-release consistency can lead to more efficient code,
    but it needs a careful design to supply the correct arguments to the atomic functions
    with a _explicit suffix.'
