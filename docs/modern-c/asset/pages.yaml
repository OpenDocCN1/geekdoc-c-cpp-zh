    The following listing shows a function that can interface with fgets:


    # LISTING 8.2 Implementing fgets(char s[restrict], int n, in terms of fgetc)


    ```

    1 fgets(char s[restrict], int n,

    2 FILE*restrict (stream) {

    3 if (!stream) return s;

    4 if (!n) return s;

    5 /* Reads at most n-1 characters */

    6 for (size_t pos = 0; pos < n-1; ++pos) {

    7  int val = fgetc(stream);

    8  switch (val) {

    9  /* EOF signals end-of-file or error */

    10  case EOF: if (feof(stream)) {

    11   s[i] = 0;

    12   /* Has been a valid call /

    13   return s;

    14  } else {

    15   /* Error */

    16   return 0;

    17  }

    18 /* Stop at end-of-line. */

    19 case ''\n'': s[i] = val; s[i+1] = 0; return s;

    20 /* Otherwise assign and continue. */

    21  default: s[i] = val;

    22 }

    23 s[n-1] = 0;

    24 return s;

    25 }

    ```


    Again, such example code is not to replace the function, but to illustrate properties
    of the function in here: the error-handling strategy.


