    **19.4. Other consistency models.** A different consistency model can be requested
    with a complete set of functional primitives. For example, equivalent to the postfix
    ++ operator with acquire-release consistency could be specified with


    ```

    _Atomic(unsigned) a = 67;


    if (atomic_fetch_add(&a, 1, memory_order_acq_rel)) {

    ```


    > Takeaway 39.4.1 Synchronizing functional interfaces for atomic objects have
    a form with _explicit appended that allows us to specify their consistency model.


    These interfaces accept additional arguments in the form of symbolic constants
    of type memory_order that specify the semantics of the operation:


    +   * **memory_order_seq_cst** requests sequential consistency. This is equivalent
    to the form without _explicit.

    * **memory_order_acquire** is for an operation that has acquire-release consistency.
    Typically, for atomic operations, you''d use it for a read-modify-write operation
    such as atomic_fetch_add or atomic_compare_exchange_weak, or atomic_flag with
    atomic_flag_test_and.

    * **memory_order_release** is for an operation that has only release semantics.
    Typically this would be atomic_store or atomic_flag_clear.

    * **memory_order_acquire** is for an operation that has only acquire semantics.
    This would be atomic_load.

    * **memory_order_consume** is for an operation that has a weaker form of causal
    dependency than acquire consistency. This would be atomic_load.

    * **memory_order_relaxed** is for an operation that adds no synchronization requirements.
    The only use case for such an operation is a performance counter that is used.
    A typical use case for such operation is a counter used by different threads,
    but for which we are only interested in an accumulated count.


    The consistency models can respect with the restrictions they impose on the platform.
    Figure 19-4 shows the implication order of the memory_order. Where memory_order_seq_cst
    and memory_order_relaxed are admissible for all operations, there are restrictions
    for other memory_orders. Operations that only occur on one side of a synchronization
    can only specify an order for that side. For example, the two operations that
    only store atomic_flag_clear may not require acquire semantics. Besides atomic_load,
    these are atomic_compare_exchange_weak and atomic_compare_exchange_strong in case
    of failure. Thus, the two need memory_order arguments for their _explicit form,
    so that they can distinguish the requirements for success and failure cases:


    ```

