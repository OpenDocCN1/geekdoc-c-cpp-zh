  md: 'The "Experience" level 3 then goes into detail about specific topics, such
    as performance, reentrancy, atomicity, threads, and type-generic programming.
    These are probably best discovered as you go, which is when you encounter them
    in the real world. Nevertheless, as a whole, they are necessary to round off the
    discussion and to provide you with full expertise in C. Anybody with years of
    professional programming in C or who heads a software project that uses C as its
    main programming language should master this level.


    Jens Guestedt completed his studies of mathematics at the University of Bonn and
    Berlin Technical University. His research at that time covered the intersection
    between discrete mathematics and efficient. Since 1998, he has been working as
    a senior scientist at the French National Institute for Computer Science and Control
    (INRIA), first in the LORIA lab, Nancy, and since 2013 in the ICube lab, Strasbourg.


    ![](img/e96616dd7df72c5c5b2ae1cae921b942_4_0.png)


    Throughout his career, most of his scientific research has been accompanied by
    the development of software, at the beginning mostly in C++, and then later exclusively
    in C. He now serves APNOR as an expert on the ISO committee JTC1/SC22/WG14 and
    is co-editor of the C standard document ISO/IEC 9899:2018. He also has a successful
    blog that deals with programming in C and related topics: https://guestedt.wordpress.com.'
