  md: 'C and C++. Programming has become a very important cultural economic activity,
    and C remains an important element in the programming world. As in all human activity,
    progress in C is driven by many factors: corporate or individual interest, politics,
    beauty, logic, ignorance, selfishness, sectarianism, ... (add your motivation
    here). Thus the development of C has not been cannot be ideal. It has flaws and
    artifacts that can only be understood through their historical and contextual
    context.


    An important part of the context in which C developed was the early appearance
    of sister language, C++. One common misconception is that C++ evolved from C by
    adding its particular features. However, this history (C++ evolved from a very
    ancestor) is not particularly relevant. In fact, C and C++ evolved from a common
    ancestor more than 30 years ago and have evolved similarly but ever. But this
    evolution of the two languages has not taken place in isolation; they have exchanged
    and adopted each other''s concepts over the years. Some new features, such as
    the recent addition of atomics and threads, have been designed in close collaboration
    between the C and C++ standard committees.


    Nevertheless, differences remain, and generally all that is said in this book
    is not, C++. Many code examples that are given will not even compile with a C++
    compiler. So we do not mix sources of languages.


    > C and C++ are different: don''t mix them, and don''t mix them up.


    Note that you are reading through this book, you will encounter many lines marked
    like those. These are takeaways that summarize features, rules, recommendations,
    and so on. There is a list of these takeaways towards the end of the book, which
    you might use as a cheat sheet.


    # Requirements. To be able to profit from this book, you need to fulfill minimal
    requirements. If you are uncertain about any of these, please obtain or learn
    them; otherwise you might waste a lot of time.


    First, can you learn a programming language without practicing it, so you must
    have a decent programming environment at you (usually on a PC or laptop), and
    you must master it to some extent. This environment can be an integrated (IDE)
    or a collection of separate utilities. Platforms vary in what they offer, so it
    is difficult to advise on species. On Unix-like environments such as Linux and
    Apple macOS, you will find editors such as vi and emacs, and compilers such as
    gcc, clang.


    You must be able to do the following:


    +   1) Navigate your file system. File systems are usually organized hierarchically
    in directories. You must be able to navigate through these to find and manipulate
    files.


    +   2) Edit programming text. This is different from editing a letter in a processing
    environment. Your environment, editor, or whatever it is called should have a
    basic understanding of the programming language C. You will see that if you open
    a C file (which usually has the file extension .c) might highlight some keywords
    or help you indent your code to understand the nesting of { } brackets,


    +   3) Execute a program. The programs you will see here very basic at first and
    will not offer any graphical features. They need to be launched in the command
    line. An example of such a program that is launched is the compiler. On Unix-like
    environments, the command line is usually called a shell and is launched in a
    (or) the console terminal.


    +   4) Compile program. Some environments provide a menu button or a keyboard
    shortcut for compilation. An alternative to that is to launch the compiler in
    the command line of a terminal. This compiler must adhere to recent standards;
    don t waste your time with a compiler that does not conform.'
