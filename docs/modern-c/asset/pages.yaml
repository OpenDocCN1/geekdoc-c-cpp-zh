  md: 'They refer to the same objects A, an atomic pointer to an array of 45 double
    elements, and B, a pointer to an array of 45 atomic double elements.


    The qualifier notation has a pitfall: it might suggest similarities between _Atomic
    qualifiers or others, but in fact these do not go far. Consider the following
    example with threequalifiers":


    ```

    double var;

    // Valid; adding const to the pointed-to type

    extern double const * f = &var;

    // Valid; adding volatile qualification to the pointed-to type

    extern double volatile * v = &var;

    // Invalid; pointers to incompatible types

    extern double *Atomic: a = &var;

    ```


    So it is preferable not to fall into the trap of seeing atomic qualifiers.


    # Takeaway 3.18.1.3 Use the syntax _Atomic(T) for atomic declarations.


    Another restriction for _Atomic is that it cannot be applied to array types:


    ```

    _Atomic(double[45]) C; // Invalid: atomic cannot be applied to arrays.

    _Atomic(double)[45]; // Valid: atomic can be applied to array base

    ```


    Again, this differs from similarly "qualified" types:


    ```

    typedef double array[45];

    array _Atomic; // Invalid: atomic cannot be applied to arrays.

    array const;   // Valid: const can be applied to arrays.

    array const * f = {}; // Applies to base type

    double const f[45]; // Compatible declaration

    ```


    # Takeaway 3.18.1.4 There are no atomic array types.


    Later on in this, we will also see another tool that ensures linearizability:

    mtx_t. But atomic objects are by far the most and easy to use.


    # Takeaway 3.18.1.5 Atomic objects are the privileged tool to force the absence
    of race conditions.


    18.2. Race-free initialization and destruction. For any data that is shared by
    threads, it is important that it is initialized into a well-controlled state before
    any concurrent access is made, and it is never accessed after it has been destroyed.
    For initialization, there are several possibilities, presented here in order of
    preference:


    +   (1) Shared objects with static storage are initialized before any execution.

    (2) Shared objects with atomic or allocated storage duration can be properly initialized
    by the thread that creates them before shared access occurs.

    (3) Shared objects with static storage duration where the information for dynamic
    initialization is


    +   (a) Available at startup time should be initialized by main after any other
    thread is created.


    +   (b) Not available at startup time must be initialized with call_once,


    So the latter, call_once, is only needed under very special circumstances:


    ```

    void call_once(once_flag* flag, void cb(void));

    ```'
