    |---|---|---|---|---|

    | A | 9.0 | 2.9 | 0 | 0.0007 | 3.0+E25 |


    The form of an initializer that we see here is called designated: a pair of brackets
    with an integer designate which the array is initialized with the corresponding
    value. For example, [3]=3.E25 sets the last item of the array A to the value 3.E25.
    As a special rule, any position that is not listed in the initializer is set to
    0. In our example, the missing [2] is filled with 0.¹


    > Takeaway 0.2.3.3 Missing elements in initializers default to 0


    You might have noticed that array positions, indices², do not start with 1 for
    the first element, but with 0. Think of an array position as the distance of the
    corresponding array element from the start of the array.


    > Takeaway 0.2.3.4 For an array with n elements, the first element has index 0,
    and the last has index n-1.


    For a function, we have a definition (as opposed to only a declaration) if its
    declaration is followed by braces { ... } containing the code of the function:


    ```

    int main(void) {

    }

    ```


    In our examples so far, we have seen names for two different features: objects³,
    and A, and functions⁴, main and printf. In contrast to object or function declarations,
    where several are allowed for the same identifier, definitions of objects or functions
    must be unique. That is, for a C program any object or function that is used must
    have a definition (otherwise the execution would not know where to look for them),
    and must be no more than one definition (otherwise the execution could become
    inconsistent).


    > Takeaway 0.2.3.5 Each object and function must have exactly one definition.


