  md: '# 5. Basic values and data


    This section covers


    +   * Understanding the abstract state machine

    * Working with types and values

    * Initializing variables

    * Using named constants

    * Binary representations of types


    We will now change our focus from "how things are to be done" (statements and
    expressions) to the things on which C operates: values and date. A concrete program
    at an instance in time has to represent values. Humans have a similar strategy:
    nowadays we use a decimal representation to write numbers for numbers: example,
    the Hindu-Arabic numerical system. We have other systems to write numbers: Roman
    numerals (i, ii, iii, iv) or textual notation. To know that word twelve value
    12 is a nontrivial step and that European languages denote numbers not only in
    decimal but also in other systems with bases 16 and 20. For non-native French
    speakers like myself, it may be difficult to spontaneously associate twelve with
    quite the value 95.


    Similarly, representations of values on a computer can vary "culturally" by architecture
    or are determined by the type the programmer gave to the value. Therefore, we
    should try to reason primarily about values and not representations if we want
    to write portable code.


    If you have some experience in C and in manipulating bytes and bits, you will
    need to make an effort to actively "forget" your knowledge for most of this. Thinking
    about concrete representations of values on your computer will inhibit you more
    than it helps.


    > Takeaway 1.5.0.1 C programs primarily reason about values and not about their
    representation.


    The representation that a particular value should in most cases not be your concern;
    the compiler is there to organize the translation and between values and representations.


    In this section, we will see how the different parts of this translation are supposed
    to work. The ideal world in which we use "argue" in your program is C''s abstract
    state machine (subsection 5.1). It gives a vision of the execution of the program
    that is mostly independent of the platform on which the program runs. The components
    of the state of objects, all have a fixed interpretation (their type) and a value
    that varies time. C''s basic types are described in subsection 5.2, followed by
    descriptions of how we can express specific values for such basic types (subsection
    5.3), how types are assembled in expressions (subsection 5.4), how we can ensure
    that our objects initially have the desired values (subsection 5.5), and how we
    assign values to recurrent values (subsection 5.6), and how such values are represented
    in the abstract state machine (subsection 5.7).


