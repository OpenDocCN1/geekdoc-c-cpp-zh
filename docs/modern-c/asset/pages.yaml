  md: 'Other operators don''t have an evaluation restriction. For example, in an expression
    such as f(a)+g(b), there is no pre-established order specifying whether f(a) or
    g(b) is to be computed first. If either f or g works with side effects (for instance,
    if modifies b between scenes), the outcome of the expression will depend on the
    chosen order.


    # Takeaway 1.4.5.3. Most operators don''t sequence their operands.


    That order may depend on your compiler, on the particular version of that compiler,
    on compile-time sequencing, or on the code that surrounds the expression. Don''t
    rely on any particular sequencing for function arguments; it will bite you.

    The same holds for something like


    ```

    printf("%d,and_%d\n", f(a), f(b));

    ```


    we wouldn''t know which of the last two arguments is evaluated first.


    # Takeaway 1.4.5.4. Function calls don''t sequence their argument expressions.


    The only reliable way to depend on evaluation ordering of arithmetic expressions
    is to have side effects:


    # Takeaway 1.4.5.5. Functions that are called inside expressions should not have
    side effects.


    # Summary


    +   - Arithmetic operators do math. They operate on values.

    - Assignment operators modify objects.

    - Comparison operators compare values and return 0 or 1.

    - Function calls and most operators evaluate their operands in a nonspecific order.

    Only &&, ||, and ? impose an ordering on the evaluation of their operands.'
