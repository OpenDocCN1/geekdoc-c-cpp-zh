  md: '# 2. COGNITION


    # Takeaway 2.9.2.7 A type name identifies a concept.


    Examples of such concepts are time for struct timespec, size for size_t, a collection
    of corvida for enum corvid, person for a data structure that collects data about,
    list for a chained list items, dictionary for a data store, and so on. If you
    have difficulty coming up with a concept for a data structure, an enumeration,
    or an arithmetic type, you should probably revisit your design.


    # Takeaway 2.9.2.8 A global constant identifies an artifact.


    That is, a constant stands out for some reason the other constants of the same
    type: it has a special meaning. It may have this meaning for some external reason
    beyond our control (MPI for re), because the C standard says so (false, true),
    because of a restriction of the execution platform (SIZE_MAX), to be factual (corvid_num),
    for a reason that is culturally motivated (fortytwo), or as a design decision.


    Generally, we will see shortly that file-scope variables (globals) are much frowned
    upon. Nevertheless, there are sometimes unavoidable, so we to have an idea of
    how to name them.


    # Takeaway 2.9.2.9 A global variable identifies state.


    Typical names for variables are todo_initialized to encode the fact that library
    toto has already been initialized, onError for a file-scope internal variable
    that is set in a library that has been turned down, and visited_entries for a
    hash table that collects shared data.


    # Takeaway 2.9.2.10 A function or functional macro identifies an action.


    Not all, but many, of the functions in the C standard library follow that and
    use verbs as a component of their members. Here are some examples:


    +   * A standard function that compares two strings is strcmp

    * A standard macro that queries for a property is isless

    * A function that accesses a data member could be called todo_getFlag

    * The corresponding one that sets such a member would be todo_setFlag

    * A function that multiplies two matrices is matrixMult


    # Summary


    +   * Coding style is a matter of taste. Be tolerant and patient.

    * Code formatting is a matter of visual habits. It should be automatically provided
    by your environment such that you and your co-workers can read and write code
    effortlessly.

    * Naming of variables, functions, and types is an art and plays a central role
    in the comprehensiveness of your code.'
