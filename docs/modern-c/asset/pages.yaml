    For the first three types of storage duration, we have seen a examples of them.
    Thread storage duration (thread_local or thread_local) is related to C''s thread
    API, which sees the corresponding call to malloc, calloc, realloc, or aligned_alloc
    that creates it. It ends with a call to free or realloc that destroys it, or if
    no call is issued, with the end of the program.


