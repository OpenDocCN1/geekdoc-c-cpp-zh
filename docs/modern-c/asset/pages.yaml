  md: '# 18. THREADS


    # 18. Threads


    This section covers


    +   - Inter-thread control

    - Initializing and destroying threads

    - Working with thread-local data

    - Critical data and critical sections

    - Communicating through condition variables


    Threads are another variation of control flow that allow us to pursue several
    tasks concurrently. Here, a task is a part of the job that is be executed by a
    program such that different tasks can be done with no or little interaction between
    each other.

    Our example is for a primitive game that we call B9 is a variant of Conway''s
    game of life (1970). It models a matrix of primitive "cells" that are born, live,
    and die according to simple rules. We divide the game into four different tasks,
    each of proceeds iteratively. The cells go through life cycles through drawing
    cycles, which are updated as fast as the terminal allow. Spread between these
    are the graphical presentation in the terminal through user keystrokes that occur
    irregularly and that allow the user to add cells at chosen positions. Figure 18.1
    shows a schematic view of these threads for B9.


    ![](img/e96616dd7df72c5c5b2ae1cae921b942_269_0.png)


    The tasks are:


    **Draw**: Draws pictures of cells to the terminal; see Fig. 18.2

    **Input**: Captures the keystrokes, updates the cursor position, and creates cells

    **Update**: Updates the state of the game from one life cycle to the next

    **Account**: Is tightly coupled with the update task and counts the number of
    living neighboring cells of each cell


    Each such task is executed by a thread that follows its own control flow, much
    like a simple program of its own. If the platform has several processors or cores,
    these threads may be executed simultaneously. Even if the platform does not have
    this capacity, the system will interleave the execution of the threads. The execution
    as a whole will appear to the user as if the events are handled by the tasks are
    concurrent. This is crucial for our example, since we want the game to appear
    constantly whether the player presses keys on the keyboard or not.

    Threads in care deal with two principal function interfaces that can be used to
    start a new thread and then wait for the termination of such a thread:


    ```

    #include <threads.h>

    typedef int (*thrd_start_t)(void);

    int thrd_create(thrd_t*, thrd_start_t, void*);

    int thrd_join(thrd_t, int *);

    ```'
