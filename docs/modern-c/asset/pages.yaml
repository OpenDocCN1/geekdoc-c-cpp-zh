  md: '# BUCKLE UP


    (3) We use array notation for pointer parameters.: We do so wherever we assume
    that the pointer cannot be null. Examples:


    ```

    / These emphasize that the arguments cannot be null. */

    size_t strlen(const string[]static int j]);

    int main(int argc, char *argv[argc+1]);

    /* Compatible declarations for the same functions. */

    size_t strlen(const char *string);

    int main(int argc, char **argv);

    ```


    The first restricts fact that strlen must receive a valid (non-null) pointer and
    will at least one element of string. The second summarizes that the main receives
    an array of pointers to char program name, argc-1 program programs, and one null
    pointer that terminates it.


    Note that the previous code is valid as it stands. The second set of declarations
    adds additional declarations for features that are already known to the compiler.
    Along the same lines, we do so wherever we know that a function pointer can''t
    be


    ```

    /* Emphasizes that the ''handler'' argument cannot be null. */

    int atex(void (*handler);

    /* Compatible declaration for the same function. */

    int atex(void (*handler)(void));

    ```


    The first declaration of atex emphasizes that it receives a function named handler
    as an argument and a null function pointer is not allowed. Technically, the function
    handler is "rewritten" to a function pointer as much arrays are rewritten to object
    pointers, but this is of minor interest for a description of the functionality.


    Note, again, the previous code is valid as it stands and that the second declaration
    adds just an additional declaration for atex.


    (5) We define variables as close to their first use possible.: Lack of initialization,
    especially for pointers, is one of the major pitfalls for C programmers. This
    is why we, whenever possible, combine the declaration of a variable with its first
    assignment to it: the tool that gives us for this is the definition: a declaration
    together with an initialization. This gives a name to a value and introduces this
    name at the first place where it is used.


    This is particularly convenient for for loops. The iterator variable of one loop
    is semantically a different object from another, so we declare the variable within
    for ensure it stays within the loop''s scope.


    (6) We use prefix notation for code blocks.: To be able to read a code block,
    it is important to capture two things about it: its purpose and its extent. Therefore:


    +   * All are prefixed on the same line as the statement or declaration that introduces
    them.

    * The code is indented by one level.

    * The terminating } starts a new line on the same level as the statement that
    introduced the block.

    * Block statements have a continuation after the } continue on the same line.

