    # 15.1. Inline functions. For C programs, the standard tool to write modular code
    functions. As we have seen, they have several advantages:


    +   * They clearly separate interface and implementation. Thereby they allow us
    to improve code incrementally, from revision to revision, or to rewrite function
    from scratch if deemed necessary.

    * If we avoid communicating with the code via global variables, ensure that the
    state of a function accesses is local. That way, the state is present in the parameters
    of the call and local variables only. Optimization opportunities may be detected
    more easily.


    Unfortunately, functions also have some downsides from a performance point of
    view:


    +   * Even on modern platforms, a function call has a certain overhead. Usually,
    when calling a function, some space is put aside, and local variables are initialized
    or copied. Control jumps to a different point in the executable, which might or
    not be in the execution cache.

    * Depending on the calling convention of the platform, if the return value of
    a function is a struct, the return value may have to be copied where the call
    of the function expects.


    If, by coincidence, the code of the caller (say, caller) and the callee (say,
    fmall) are present inside the same translation (TU), a good compiler may avoid
    these downsides by inlining. Here, the compiler does something equivalent replacing
    the call to fmall with the code of fmall itself. Then there is no call, and so
    there is no call overhead.


    Even better, since the code of fmall is inlined, all instructions of fmall are
    seen in new context. The compiler can detect, for example:


    +   * Dead branches that are never executed

    * Repeated computation of an expression where the result is already known

    * That the function (as called) may only return a certain type of value


    > Takeaway 35.1.1.1 Inlining can open up a lot of optimization opportunities.


    A traditional compiler can only inline functions for it also knows the definition:
    only making the declaration is not enough. Therefore, programmers and compilers
    have built strategies to increase inlining by making function definitions visible.
    Without additional support from the language, there are two strategies to do so:


    +   * Concatenate all code of a project into a single large file, and then compile
    all in one giant TU. Doing such thing systematically is not as easy as it sounds;
    we must ensure that the compilation order of the source files doesn''t produce
    cycles and that we do not have naming conflicts (for example, two TUs, each with
    a static function in)

    * Functions that inline are placed in header files and then included by all TUs
    that need. To avoid multiple definitions of the function symbol in each TU, functions
    must be declared static


    Where the first approach is infeasible for large projects, the second approach
    is relatively easy to put in place. Nevertheless, its drawbacks:


    +   * If the function is too big to be inline-compiler, it is instantiated separately
    in every TU. That is, a function that big will potentially have a lot of copies
    and increase the size of the final executable.'
