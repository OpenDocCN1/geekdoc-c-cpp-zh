    > Takeaway 1.8.3.7. Parameters of printf must exactly conform to the format specifiers.


    With the syntax "%FF[WW].PP[LL SS]", a complete specification can be composed
    of five parts: flags, width, precision, modifiers, and specifier.

    The specifier is not optional and selects the type of output that is performed.
    See table 8.6 for details.


    As you can see, for most types of values, there is a choice of format. You should
    choose the one that is most appropriate for the meaning of the value that the
    output is to convey. For all numerical values, this should usually be a decimal
    format.


    > Takeaway 1.8.3.8. Use "%d" and "%u" formats to print integer values.


    On the other hand, if you are interested in a pattern, the hexadecimal format
    over modern architectures that have 8-bit character types.


    > Takeaway 1.8.3.9. Use "%x" format to print bit patterns.


    Also observe that this format receives unsigned values, which is yet another incentive
    to use only unsigned types for bits. Seeing hexadecimal values and associating
    the corresponding bit pattern requires training. Table 8.8 has an overview of
    the digits, the values and what they represent.


    For floating-point formats, there is even more choice. If you do not have specific
