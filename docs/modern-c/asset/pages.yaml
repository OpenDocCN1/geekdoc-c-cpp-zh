    \ abused to obfuscate control flow: As you hopefully remember from subsections\
    \ 5.6.3 and 8.1.2, macros define textual replacements that can contain any C text.\
    \ Because of the problems we will illustrate here, many projects use macros completely.\
    \ This is not the direction of the C standard, though as you have seen, for example,\
    \ type-generic macros are the modern interface to mathematical functions (see\
    \ 8.2); macros should be used for initialization constants (5.6.3) or to implement\
    \ compiler magic (errno, section 8.1.3).\n\nSo of denying it, we should try to\
    \ tame the beast and use some simple rules that confines the possible damage.\n\
    \n> Takeaway 10.2.2.3 Macros should not change control flow in a surprising way.\n\
    \nNotorious examples that pop up in discussion with beginners from time to time\
    \ are like this:\n\n```\n#define begin (\n#define end )\n#define forever for (;)\n\
    #define ERRORCHECK(CODE) if (CODE) return -1\n\forever\nbegin\n// do something\n\
    ERRORCHECK(x);\nend\n```\n\nDon't do that. The visual habits of C Programmers\
    \ and our tools don't easily work with something like that, and if you use such\
