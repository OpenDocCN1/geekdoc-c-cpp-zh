    \nC11 addressed this sort of problems by deprecating or removing some functions\
    \ from the standard and by adding an optional set of new interfaces that check\
    \ consistency of the parameters at runtime. These are bounds-checking interfaces\
    \ of Annex K of the C standard. Unlike other features, this comes with its own\
    \ header file but adds interfaces to others. Two macros regulate access to these\
    \ interfaces: __STC_LIB_EXT1__, __STC_WANT_LIB_EXT1__ switches it on. The latter\
    \ must be defined before headers are included:\n\n```\n#if __STC_LIB_EXT1__\n\
    # error \"this_code_needs_bounds_checking_interface,Annex_K\"\n#endif\n#define\
    \ __STC_WANT_LIB_EXT1__ 1\n\ninclude <stdio.h>\n```\n\n/* printf_s from here on\
    \ */\n\nThis mechanism was (and still is) open to debate, and therefore Annex\
    \ K is an optional feature. Many modern platforms have chosen not to support it.\
