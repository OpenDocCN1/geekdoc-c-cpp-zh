    \ control statements: if, for, while, and switch. We will look at these statements\
    \ in section: if introduces a conditional execution depending on a boolean expression;\
    \ for, and while handle for of iterations; and switch is a multiple selection.\n\
    \nC has some other conditionals that we will discuss later: the ternary operator?,\
