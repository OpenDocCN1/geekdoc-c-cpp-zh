  md: '# 8. C library functions


    This section covers


    +   * Doing math, handling files, and processing strings

    * Manipulating time

    * Managing the runtime environment

    * Terminating programs


    The functionality that the C standard provides is separated into two big parts.
    One is the Proper language, and the other is the C library. We have looked at
    several functions that come with the C library, including printf, puts, and strtod,
    so you should have a good idea what to use: basic tools implement features we
    need in everyday programming and for we need clear interfaces and semantics to
    ensure portability.


    On many platforms, the clear specification through an application programming
    interface (API) allows us to separate the compiler implementation from the library
    implementation. For example, on Linux, we have different compilers, different
    C library implementations, such as the GNU C library (glibc), dietlib or others;
    potentially any of these can be used to produce an executable.


    We will first discuss the general properties and tools of the C library and its
    interfaces, then describe some groups of functions: mathematical (numerical) functions,
    input/output functions, string processing, time handling, access to the runtime
    environment, and program termination.


    **8.1. General properties of the C library and its functions.** Roughly, functions
    target one or two purposes:


    **Platform abstraction** Functions abstract the specific properties and needs
    of the platform. These functions need platform-specific bits to implement basic
    operations such as IO, which could not be implemented without deep knowledge of
    the platform. For example, puts has to have some component of a "terminal output"
    and to address it. Implementing these functions would require the knowledge of
    most C programmers, because doing so requires OS or even processor-specific magic.
    Be glad that some people did that job for you.


    **Basic tools.** Functions that implement a task (such as strtod) that often occurs
    in programming in C and for it is important that the interface is fixed. These
    should be implemented relatively efficiently, because they are used a lot), so
    they should be well tested and bug free so we can rely on them. Implementing such
    functions should be possible for any configured programmer [C5].


    A function like printf is viewed as having two purposes: it can be effectively
    separated into two phases: formatting the text and an output phase that is platform
    specific. There is another function sprintf (explained much later, in subsection
    14.1) that provides the same functionalities as printf but returns the result
    in a string. This string could be passed with puts to get the same output as printf.


    In the following sections, we will discuss the different header files that declare
    the interfaces of the C library (subsection 8.1.1), the different types of interfaces
