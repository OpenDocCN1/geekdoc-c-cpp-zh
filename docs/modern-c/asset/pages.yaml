  md: '# ABOUT THIS BOOK


    If you have never programmed before, this book will be tough. Knowing some of
    the following will help: Basic, C (historical versions), C++, Fortran, R, bash,
    JavaScript, Java, MATLAB, Perl, Python, Scilab, and so on. But perhaps you have
    some programming experience, even without mentioning it. Many technical specifications
    actually come in some sort of specialized language that can be helpful as an analogy:
    HTML for web pages and LaTeX for document formatting.


    You should have an idea of the following concepts, although their meanings may
    be a bit different in C in the context where you learned them:


    +   (1) Variables — Named entities that hold values

    (2) Conditional — Doing something (or not) subject to a precise condition

    (3) Iteration — Doing something repeatedly for a specified number of times or
    until a certain condition is met


    **Source.** Many of the programming snippets provided in this book are available
    for download as a .zip archive from the book''s website at https://gforge.inria.fr/download.php?latest/5238/code.zip.
    This allows you to find them in context and compile them and try them out. The
    archive also contains a Makefile with description of the components that are needed
    to compile these files. It is centered around Linux but works on other systems,
    and may also help you to find out what you need when you are on a different system.


    **Exercises and thinking challenges.** Throughout this book, you''ll see exercises
    that are meant to guide you about the concepts you are becoming. These are probably
    best done directly with your reading. They will be generally demanding. You will
    need to do some research to understand what they are, and the solutions will not
    come all by themselves; they will require effort. They will take time, sometimes
    hours, or depending on your degree of satisfaction with your work, even days.
    Covering these challenges is the fruit of my own personal bias toward "interesting
    challenges" from my personal experience. If you have other problems in your projects
    or your work that covers the same ground, you should equally well. The important
    part is to train yourself by first searching for help and ideas elsewhere, and
    then to get your hands dirty and get things done. You will only learn if you jump
    into it.


    **Organization.** This book is organized into levels, from 0 to 3. The starting
    level 0, "Beginner," will summarize the very basics of programming with C. Its
    principal role is to remind you of the main concepts we have mentioned and familiarize
    you with the special vocabulary and viewpoints of C applicants. By the end of
    this, if you have no experience in programming with C, you would be able to understand
    the structure of C programs and start with them.


    The "Acquaintance" level 1 deals with principles and features such as control
    structures, data types, operators and functions. It will give you a deeper understanding
    of the things that are going when you run your programs. This knowledge would
    be sufficient for an introductory course in algorithms and other work at that
    level, with the notable caveat that pointers are not fully included.


    The "Cognition" level 2 goes to the heart of the C language. It fully familiarizes
    you with C and allows you to understand most of C''s library interface. Completing
    this level should enable you to write C code professionally; it begins with an
    essential discussion about the writing and organization of C programs. I would
    personally expect anybody who graduated from an engineering school with a major
    related to computer science or programming in C to master this level. Don''t be
    satisfied with less.


    > ¹One of C''s special viewpoints is that indexing starts at 0, and not at 1 as'
