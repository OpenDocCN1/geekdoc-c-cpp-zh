  md: '# 11. Pointers


    This section covers


    +   - Introduction to pointer structs, arrays, and functions

    - Using pointers with structs, arrays, and functions


    Pointers are the first real hurdle to a deeper understanding of C. They are used
    in contexts where we are able to access objects from different points in the code,
    or where a function is added dynamically on the fly.


    The confusion of inexperienced programmers with pointers and arrays is notorious,
    so be warned that you encounter difficulties getting the terms correct. On the
    other hand, pointers are one of the most important features of C. They are a big
    plus to help abstract from details, add flexibility to platforms and enable us
    to write portable code. So, equip yourself with patience when you work through
    this section, because it is crucial for the understanding of the rest of this
    book.


    The term pointer stands for a special derived type construct that "points" or
    "refers" to something. We have seen the syntax for this construct, a type (the
    referenced type) that is followed by a * character. For example, pO is a pointer
    to double:


    ```

    double* pO;

    ```


    The idea is that we have one variable (the pointer) that points to the memory
    of another object:


    ```

    pO \rightarrow double

    ```


    An important distinction is that we will have to make throughout this section
    is between the pointer (on the left of the arrow) and the unnamed object that
    is pointed to (on the right).

    Our first use of a pointer will be the barrier between the code of the caller
    and the code inside a function, and this allows us to write functions that are
    not pure. This example will be a function with this prototype:


    ```

    void double_swap(double* pO, double* p1);

    ```


    Here we see two arguments that "point" to objects of type double. In the example,
    the function double_swap is used to interchange (swap) the contents of these two
    objects. For where the function is called, pO and p1 could be pointing to double
    variables d0 and d1, respectively, that defined by the caller:


    | d0 | double 3.5 | p1 |

    | | | double 10 | |


    By receiving information about two such objects, the function double_swap can
    effectively change the contents of the double objects without changing the pointers
    themselves:


    | pO | double 10 | p1 |

    | | | double 3.5 | |


    Using pointers, the function will be able to apply the change directly to the
    variables of the calling function; without pointers or arrays would not be able
    to do this.

    In this section, we will go into the details of every operations with pointers
    (section 11.1) and specific types for which pointers have particular properties:
    structures (subsection 11.2), arrays (subsection 11.3), and functions (subsection
    11.4).


    # 11.1. Pointer operations. Pointers are an important concept, so there are several
    C operations and features just for them. Most importantly, specific operators
    allow us to deal with the "pointing-to" and "pointed-to" relation between pointers
    and the objects'
  merge: -1
