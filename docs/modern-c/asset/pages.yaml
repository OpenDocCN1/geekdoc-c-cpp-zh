    13.1.2. Ensuring consistency of dynamic allocations. As both our examples, calls
    to allocation functions such as malloc, realloc, and free always comes in pairs.
    This mustn''t necessarily be inside the same function, but in most case count-
    the occurrence of both should give the same number:


    > Takeaway 23.1.2.4: For every allocation, there must be a free.


    If not, this could induce a memory leak: a lot of allocated objects. This could
    lead to resource exhaustion of your platform, showing itself in low performance
    or random crashes.


    > Takeaway 23.1.2.5: For every free, there must be a malloc, calloc, aligned_alloc,
    or realloc.


    But beware that realloc can easily obfuscate counting of allocations: be- cause
    if it is called with an existing object, it serves as deallocation (for the old
    object) and allocation (for the new object) at the same time.

    The memory-allocation system is meant to be simple, thus free is only allowed
    for pointers that have been allocated with malloc or that that are null.


    > Takeaway 23.1.2.6: Only call free with pointers as they are returned by malloc,
    calloc, aligned_alloc, or realloc.


    They must not


    +   - Point to an object that has been allocated by other means (that is, a variable
    or a compound literal)

    - Have been freed yet

    - Only point to a smaller part of the allocated object.


    Otherwise, your program will crash. Seriously, this will completely corrupt the
    memory of your program execution, which is one of the worst of crashes you can
    have. Be careful.


