    \ execution. The first construct that we will look at is specified by if.\n\n\
    ```\nif (i > 25) {\n    j = 25;\n}\n```\n\nHere we compare against the value 25.\
    \ If it is larger than 25, j is set to the value i-25. In the example, i > 25\
    \ is called the controlling expression?, and the part in { ... } is the called\
    \ block.\n\nOn the surface, of an if statement represents the for statement that\
    \ differs: there is only one part inside the parentheses, and that determines\
    \ whether the statement or block is run once or not all.\n\nThere is a more general\
    \ form of the if construct:\n\n```\nif (i > 25) {\n    j = 25;\n} else {\n   \
    \ j = i;\n}\n```\n\nIt has a second dependent statement or block that is executed\
    \ if the controlling condition is not fulfilled. This, is done by inserting another\
    \ keyword else that separates the two statements or blocks.\n\nThe (... else ...)\
    \ ... is a selection statement?. It selects one of the two possible paths? according\
