    be implemented with sufficient numerical knowledge, you should not try to replace
    or circumvent them. Many of them are not just implemented as C functions but also
    as processor-specific instructions. For example, processors may have approximations
    of sqrt and functions, or implement a floating-point add, fma, in a low-level
    instruction. In particular, there is a chance that such-level instructions are
    used for all functions that inspect or modify floating-point internals, as carg,
    const, fabs, frexp, ldround, lround, nearbyint, rint, round, scalbn, and trunc.
    So, replacing them in handcrafted code is usually a bad idea.


    # 8.3. Input, output and file management. We have seen some of the functions that
    come with the header file stdio.h: puts and printf. Whereas the second lets you
    format output in a end-of-line character, the first is more basic: it puts your
    string (argument) and an end-of-line character.


    # 8.3.1. Unformatted text output. There is an even more basic function than puts:
    putchar, which outputs a single character. The interfaces of these functions are
    as:


    ```

    int putchar(int c);

    int puts(char const s[static]);

    ```


    The type int as a parameter for putchar is a historical accident that shouldn''t
    hurt you. In contrast to, having a return type of int is necessary so the function
    can return errors to its caller. It returns the argument if successful and a negative
    value EOF (End Of File) that is guaranteed not to correspond to any character
    on failure.


    With this function, we could actually implement puts ourselves:


    ```

    int puts_manual(char const s[static]) {

    for (size_t i = 0; s[i]; ++i) {

    if (putchar(s[i]) == EOF) return EOF;

    }

    if (putchar(''\n'') == EOF) return EOF;

    return 0;

    }}

    ```


    This is just an example; it is probably less efficient than the puts that your
    platform provides.


    Up to now, we have only seen how to output to the terminal. Often, you want to
    write results to persistent storage, and the type FILE provides an abstraction
    for streams. There are two functions, fprintf and fread, that generalize the interface
    of unformatted output to:


    ```

    int fprintf(FILE*, char const s[static], FILE* stream);

    int fread(char const s[static], FILE* stream);

    ```


    Here, the *FILE type indicates that this is a pointer to structure, and we won''t
    go into the details. The only thing we need to know is that a pointer can be tested
    whether is null (1.6.2.4), so we will be able to test whether a stream is valid.


    The identifier FILE represents an opaque type, for which we don''t know more than
    is provided by the functional interfaces that we will see in this section. The
    fact that it is implemented as a pointer, and the misuse of the name "FILE" for
    a stream is a reminder that this is one of the historical interfaces predicate
    standardization.


    +   Takeaway 1.8.3.1 Opaque types are specified through functional interfaces.


    +   Takeaway 1.8.3.2 Don''t rely on implementation details of opaque types.


