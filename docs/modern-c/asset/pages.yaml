    signal draws the drawing that something in game celebration has and the board
    should be redrawn:


    ```

    } while ((L->finished || foof(stdin)));

    ```


    The mtx_t parameter to the wait function has an important rule. The mutex may
    be held by calling the wait function. It is temporarily released during wait,
    so others can do their job to assert the condition expression. The lock is reacquired
    just before returning from the wait call so the critical data can be safely accessed
    without races.


    Figure 18.3 shows a typical interaction between the input and draw threads, and
    the corresponding condition variable. It shows that six functions are involved
    in the interaction: four for the critical sections and the mutex, and two for
    the condition variable.


    ![](img/e96616dd7df72c5c5b2ae1cae921b942_282_0.png)


    Figure 18.3. Control flow managed by mutex L->mtx and condition variable L->draw
    between input and draw threads. Critical sections are shaded with grey. The condition
    variable is associated with the mutex until the waiter reacquires the mutex.


    The coupling between a condition variable and the mutex in the wait call should
    be handled with care.


    > A condition variable can only be used simultaneously with one mutex.


    But it is probably best to never change the mutex that is used with a condition
    variable.

    Our example also shows that there can be many condition variables for the same
    mutex: we use our mutex with three different condition variables at the same time.
    This will be imperative in many applications, since the condition expressions
    under which threads will be accessing the resource depend on their roles.

    In situations where several threads are waiting for the same condition variable
    and are woken up by a call to cnd_broadcast, they will not wake up all at once,
    but one after another as they reacquire the mutex.'
