  md: '# 10. ORGANIZATION AND DOCUMENTATION


    # 10. Organization and documentation


    This section covers


    +   - How to document interfaces

    - How to explain implementations


    Being an important societal, cultural and economic activity, programming needs
    a certain form of organization to be successful. With coding style, beginners
    tend to underestimate the effort that should be put into code and project organization
    and documentation: unfortunately, many of us have to go through the experience
    of reading our code some time after we wrote it, and not having any clue what
    it was all about.

    Documenting or more, explaining programming code is not an easy task. We have
    to find the right balance between providing context and necessary information
    and stating the obvious. Let''s have a look at the following two lines:


    ```

    u = fourApprox(u, 1, 33, 28); // ...

    ++; // incrementing i

    ```


    The first line isn''t good, it uses magic constants, a function name that doesn''t
    tell what is going on, and a variable name that does not have much meaning, at
    least me. The smiley comment indicates that the programmer had fun writing this,
    but it is not very helpful to the careful reader or maintainer.

    In the second line, the comment is superfluous and states what any even-experienced
    programmer knows about the ++ operator.

    Compare this to the following:


    ```

    /* 33 and 28 are suitable because they are coprime */

    u = nextApprox(u, 1, 33, 28);

    /* Theorem 3 ensures that we may move to the next step. */

    ++;

    ```


    Here we decide a lot more. I''d expect you to have a floating-point value, probably
    double: that is, subject to an approximation procedure. Procedure runs in steps,
    indexed by i, and need some additional arguments that are subject to a originality
    condition. Generally, we have the what, what for, how, and in which manner rules,
    in order of their importance:


    > Takeaway 2.10.0.1 (what) Interface functions describe what is done.


    > Takeaway 20.10.0.2 (for how) Interface comments document the purpose of a function.


    > Takeaway 20.10.0.3 (how) Code code tells you how the function is organized.


    > Takeaway 20.10.0.4 (in which manner) Code comments explain the manner in which
    function details are implemented.


    If you think of a larger library project that is used by others, you''d expect
    that all users will read the interface specification (such as in the synopsis
    of a man page), and most of them will read the explanation about these interfaces
    (the rest of the man page).

    Much fewer of them will look at the source code and read about how or in which
    manner a particular interface implementation does the way it does them.


    A first consequence of these rules is that code structure and documentation go
    in hand. The distinction between interface specification and implementation is
    especially important.'
