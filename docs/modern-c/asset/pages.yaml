  md: '# 3. EXPERIENCE


    **Takeaway 3.16.5.2.** A variadic function has to receive valid information about
    the type of each argument in the variadic list.


    The `printf` function gets away with this difficulty by imposing a specification
    for the types inside the format argument. Let us look at the following short code
    snippet


    ```

    unsigned char zChar = 0;

    printf("%Bhu", zChar);

    ```


    This has the effect that `zChar` is evaluated, promoted to `int`, which then reads
    this `int` and re-interprets the value as `unsigned char`. This is mechanism


    **Complicated:** the implementation of variadic function must provide specification
    for all the basic types


    **Error-prone:** because each call depends on the fact that the argument types
    are correctly transmitted to the function


    Exigent: the programmer has to check the type of each argument


    In particular, the latter can cause serious portability bugs, because constants
    can have different types from platform to platform. For example, the innocent
    call


    ```

    printf("%s\n", "a_small_number"); // Not portable

    ```


    will work on most platforms: those that have an int with type 16 bits. On some
    platforms, it may fail at runtime because 6536 is long. The worst case for a potential
    failure is the mechanism NULL:


    ```

    printf("%s\n", NULL, "print_of_NULL"); // Not portable

    ```


    As we saw in subsection 11.1.5, NULL is only guaranteed to be a null pointer constant.
    Compiler implementations are free to choose which variant they provide: some `(void*)0`,
    with a type of `void*`, most choose `0`, with a type of `int`. On platforms that
    have different widths for `pointer` and `int`, such as all 64-bit platforms, the
    result is a program crash.


    **Takeaway 3.16.5.3** Using variadic functions is not portable unless each argument
    is forced to a specific type.


    This is quite from the use of variadic macros as we saw in the TRACE_VALUES. We
    used the variadic list as an initializer to an array, so all elements were automatically
    converted to the correct type mechanism


    **Takeaway 3.16.5.4** Avoid variadic functions for new interfaces.


    They are not just the pain. But if you want to implement a variadic function,
    you need the C library header stdarg.h. It defines `va_list`, `va_arg`, and four
    function-like macros that can be used as the arguments behind a `va_list`. Their
    pseudo interfaces like this:


    ```

    void va_start(va_list ap, paramN);

    void va_end(va_list ap);

    type va_arg(va_list ap, type);

    void va_copy(va_list dest, va_list src);

    ```


    > ¹¹That is one of the reasons we should not use NULL (takeaway 2.11.4.14).'
