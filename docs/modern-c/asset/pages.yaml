  md: '# 3. EXPERIENCE


    # 17. Variations in control flow


    This section covers


    +   - Normal sequencing of statements in C

    - Making short and long jumps through code

    - Control flow

    - Handling signals


    The control flow (see 2.1) of program execution describes how the individual statements
    of the program code are sequenced, that is, which statement is executed after
    another. Up to now, we have mostly looked at code that lets us describe this control
    flow from syntax and controlling expression. This way, each can be described using
    a hierarchical structure of both. A basic block is a maximum sequence of statements
    that once execution starts at the first of these statements, it continues unconditionally
    until the last, and such that any execution of the sequence starts with the first.


    If we are supposing that conditions and loop statements use {} blocks, in a simplified
    view such a block:


    +   - Starts either at the beginning of a {} block or a case or jump block

    - Ends at the end of the corresponding {} block or at the next

    - Statement that is the target of a case or jump label

    - Body of a conditional or loop statement

    - return statement

    - goto statement

    - Call to a function with special control flow


    Observe that in this definition, no exception is made for general functions: these
    are seen to temporarily suspend execution of a basic block but not end it. The
    statements with special control flow that end a basic block are some we know:
    those marked with the keyword Noreturn, such as exit or for. Another function
    is setjmp, which returns more than once, as discussed later


    Code that is composed of basic blocks that are stitched together by if/else or
    loop statements has the double advantage of being easily readable for humans,
    and leads to better optimization opportunities for the compiler. But can directly
    define the lifetime and access patterns of variables and compound literals in
    basic blocks, and capture how these are handled by the hierarchical structure
    of the basic blocks into their functions.


    A theoretical foundation of this approach was given early for Pascal programs
    by Nishiski et al. [1977] and extended to C and other imperative languages by
    Thoroup [1995]. They prove that structured programs (that is, programs without
    goto or other jump constructs) have a control flow that nests nicely into a tree-like
    structure that can be derived from the syntactic nesting of the program. Unless
    you have to do otherwise, you should stick to this model.


    Nevertheless, some situations require exceptional measures. Generally, changes
    to the control flow of a program can originate from


    Conditional statements: if/while, while(), for()

    Loop statements: do-while(), for()

    Functions: Function calls, return statements, or Noreturn specifications

    Long jumps: setjmp/longjmp, getcontext/setcontext²³

    Interrupts: signals and signal handlers²

    Threads: third_create, thrd_exit


    > ²²switch/case statements complicate the view bit.


    > ³³Defined in POSIX systems.


    ![](img/e96616dd7df72c5c5b2ae1cae921b942_248_0.png)'
