  md: '# COGNITION


    Conversions of pointer types are more delicate, because the change can change
    the type-interpretation of an object. Only few of implicit conversions are permitted
    for data pointers, conversions from to void*, and conversions that add a qualifier
    to the type. Let''s look at some examples:


    ```

    float * p = 37.0;           // Conversion: to float

    double a = f;               // Conversion: back to double

    float * pv = &f;           // Exact type

    float const *pdc = &f;    // Conversion: adding a qualifier

    void *pv = &f;              // Conversion: pointer to void*

    float *pdv = pv;            // Error: incompatible pointer type

    double *pdv = pv;           // Error: undefined behavior if used

    ```


    The first two conversions use void*(pf and pv) are a bit tricky: we convert a
    pointer and back, but we know that the target type of pv is the same as so everything
    works fine.


    Then comes the erroneous part. In the initialization of pd, the compiler can protect
    us from a severe fault: assigning a pointer to a type that has a different size
    and interpretation and can lead to serious damage. Any conforming compiler must
    give a diagnosis for this line. As you know by well understood that your code
    should not produce compiler warnings unless you have suffered an error.


    The last line is however: it has an error, but it is syntactically correct. The
    reason this error might go undetected is that our conversion for pv has stripped
    the pointer from all information. So, in general, the compiler can''t know what
    type of object is behind the pointer.


    In addition to the implicit conversions that we have seen now, C allows us to
    convert explicitly casts*. With a cast, you are telling the compiler that you
    know better than it does, the type of the object behind is not what it thinks,
    and that it should shut up. In most cases that I have come across in real life,
    the compiler was right and the programmer was wrong: even experienced programmers
    need to abuse casts to hide poor decisions concerning types.


    +   12.2.5.1 Don''t use casts.


    They deprive you of precious information, and if you choose your types carefully,
    you will only need them for special cases.

    One such is when you want to inspect the contents of an object at the byte level.
    Constructing a union around an object, as we saw in subsection 12.2, might not
    be possible (or too complicated), so we have to go for a cast:


    ```

    unsigned val = @AABBCCD;

    unsigned char *valp = (unsigned char*)&val;

    for (size_t i = 0; i < sizeof(val); ++i)

    printf("byte[%zu]:%02x@hhx\n", i, valp[i]);

    ```


    # 12.6. Effective types. To cope with different views of the same object that
    pointers may provide, C has introduced the concept of effective types. It heavily
    restricts how an object can be accessed.


    > A cast of an expression X to type T has the type (T). Think of it like "to cast
    a spell."'
