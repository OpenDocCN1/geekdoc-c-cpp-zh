  md: "# 16. Function-like macros\n\nThis section covers\n\n+   - Checking arguments\n\
    - Accessing the calling context\n- Working with variadic macros\n- Type-generic\
    \ programming\n\nWe have encountered function-like macros explicitly in subsection\
    \ 10.2.1 and also implicitly. Some interfaces in the C standard library are typically\
    \ implemented by using them, such as the type-generic interfaces in tgnah, h.\
    \ We have also seen that functionlike macros can easily obfuscate our code and\
    \ require a certain restrictive set of rules. The easiest strategy to avoid many\
    \ of the problems that come with function-like macros is to use them only when\
    \ they are irreplaceable, and to use appropriate means where they are replaceable.\n\
    \nTakeaway 3.16.0.1 Whenever, prefer an inline function to a functional macro.\n\
    \nThat is, whenever we have a fixed number of arguments with a known type, we\
    \ should provide a proper type-safe interface in the form of a function prototype.\
    \ Let us suppose we have a simple function with such effects:\n\n```\nunsigned\
    \ count(void) {\n    static counter = 0;\n    ++counter;\n    return counter;\n\
    }\n```\n\nNow consider that this function is used with a macro to square a value:\n\
    \n```\n#define square_macro(XX) (XX) // Bad: do not use this.\n\nunsigned a =\
    \ count();\nunsigned b = square_macro(count());\n```\n\nHere, use of square_macro(count())\
    \ is replaced by count()*count(), two executions of: [Ex6]That is not what a reader\
    \ expects at point. To achieve the same performance as a function-like macro,\
    \ it is completely sufficient to provide an inline definition in a header file:\n\
    \n```\ninline unsigned square_unsigned(unsigned x) // Good\nreturn x*x;\n\nunsigned\
    \ c = count();\nunsigned d = square_unsigned(count());\n```\n\nHere, square_unsigned(count())\
    \ leads only to one execution of count. [Ex 7]But there are situations where function-like\
    \ macros can do more than a function. They can\n\n+   - Force certain type mapping\
    \ and argument checking\n- Trace execution\n- Provide interfaces with a variable\
    \ number of arguments\n- Provide type-generic interfaces\n- Provide default arguments\
    \ to functions"
