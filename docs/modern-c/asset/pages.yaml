  md: '# 17. VARIATIONS IN CONTROL FLOW


    Here, exceptional usually means we encounter a transitional error condition that
    requires local cleanup, as we showed in subsection 14.5. But it could also mean
    algorithmic conditions, as we can see in listing 17.1.


