  md: '```

    int mtx_init(mtx_t*, int);

    void mtx_destroy(mtx_t*);

    ```


    Other than more-sophisticated thread interfaces, the use of mtx_init is mandatory;
    there is no static initialization for mtx_t.


    > **Takeaway 3.18.4.2** Every mutex must be initialized with mtx_init.


    The second parameter of mtx_init specifies the "type" of the mutex. It must be
    one of these four values:


    +   * mtx_plain

    * mtx_timed

    * mtx_plain|mtx_recursive

    * mtx_timed|mtx_recursive


    As you have probably guessed, using mtx_plain controls the possibility to use
    mtx_timedlock. The additional property mtx_recursive enables us to call mtx_lock
    and similar functions several times for the same thread, without unlocking it
    beforehand.


    > **Takeaway 3.18.4.3** A thread that holds a nonrecursive mutex must not call
    any of the mutex lock functions for it.


    The name mtx_recursive indicates that it is likely used for recursive functions
    that call mtx_lock on entry of a critical section and mtx_unlock on exit.


    > **Takeaway 3.18.4.4** A recursive mutex is only released after the thread holding
    issues as many calls to mtx_unlock as it has acquired locks.


    > **Takeaway 3.18.4.5** A locked mutex must be released before the termination
    of the thread.


    > **Takeaway 3.18.4.6** A thread must only call mtx_unlock on a mutex that it
    holds.


    From all of this, we can deduce a simple rule of thumb:


    > **Takeaway 3.18.4.7** Each successful mutex lock corresponds to exactly one
    to mtx_unlock.


    Depending on the policy, a mutex may be a system resource that is attributed each
    time mtx_init is called. Such a resource can be an additional memory (such as
    a call to malloc) or special hardware. Therefore, it is important to release such
    resources once a mutex reaches the end of its lifetime.


    > **Takeaway 3.18.4.8** A mutex must be destroyed at the end of its lifetime.


    In particular, mtx_destroy must be called


    +   * Before the scope of a mutex with automatic storage duration ends

    * And before the memory of a dynamically allocated mutex is freed'
