  md: '# 13. Storage


    This section covers


    +   - Creating objects with dynamic allocation

    - The rules of storage and initialization

    - Understanding object lifetime

    - Handling automatic storage


    So far, most objects we have handled in our programs have *variables*: that is,
    objects that we have defined in a regular declaration with a specific type and
    an identifier that refers to the object. Sometimes they were defined at a different
    place in the code than they were declared, even when a definition referred to
    them with a type and identifier. Another category of objects that we have seen
    less often is specified with a type but not without an identifier: *compound fields,
    literals* (subsection 5.6).

    All objects, or compound literals, have a *lifetime* that depends on the syntactic
    structure of the program. They have an object lifetime and identifier visibility
    that either spans the whole program (global variables, global literals, and variables
    that are declared with *static*) or are bound to a block of statements inside
    a function.


    We have also seen that for certain objects, it is important to distinguish instances
    when we declare a variable in a recursive function. Each call in a hierarchy has
    its own instance of a variable. It is convenient to distinguish another that is
    not exactly the same as an object, the storage instance.

    In this section, we will have another mechanism to create objects, called *dynamic
    allocation* (subsection 13.1). In fact, this mechanism creates storage instances
    that are only seen as bytes and do not have any interpretation as objects. They
    only acquire a type, once we store them.


    With this, we have almost-complete picture of the different possibilities, and
    we can discuss the different lifetimes for storage duration, object lifetime,
    and identifier visibility (subsection 13.2); we will also take a full dive into
    the rules for initialization (subsection 13.4), as these differ significantly
    for created objects.

    Additionally, we propose two divisions. The first is a more-detailed view of object
    lifetime, which allows us to access objects at points in the C code (subsection
    13.3). The second provides a glimpse into the memory model for the concrete architecture
    (subsection 13.5) and in particular how automatic storage might be handled on
    your particular machine.


    # 13.1. malloc and free. For programs that have to handle growing collections
    of data


    The following set of functions, in stdlib.h, has been designed to provide an interface
    to allocated storage:


    ```

    #include <stdlib.h>

    void* malloc(size_t size);

    void free(void* ptr);

    void* calloc(size_t nemb, size_t size);

    void* realloc(void* ptr, size_t size);

    void* aligned_alloc(size_t alignment, size_t size);

    ```


    > 28In fact, this is a bit of a simplification; we will see the details shortly.'
