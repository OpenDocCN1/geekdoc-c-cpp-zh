  md: '# 3. EXPERIENCE


    These can result in program crashes, loss of data, incorrect results, exposure
    of sensitive information, and even loss of money or lives.


    # Takeaway 3.15.0.1 Do not trade off safety for performance.


    C compilers have much better in recent years; basically, they complain about all
    problems that are detectable at compile time. Some severe problems in code still
    remain undetected in code that tries to be clearer. Many of these problems are
    avoidable, or at least detectable, by very simple means:


    +   - All block-scope variables should be initialized, thereby eliminating the
    problems with uninitialized objects.

    - Dynamical allocation should be done with calloc instead of malloc whereas that
    is suitable. This avoids another quarter of the problems with uninitialized objects.

    - A specific initialization function should be implemented for more-complicated
    data structures that are allocated dynamically. Eliminates the rest of problems
    with uninitialized objects.

    - Functions that return pointers should use array syntax and distinguish different
    cases:


    +   - A pointer to a single object of the type – These functions should use the
    static notation and thus indicate that they expect a pointer that is non-null:


    ```

    void func(double a[static 1]);

    ```


    +   - A pointer to a collection of objects of known number – These functions should
    use the static notation and thus indicate that they expect a pointer that points
    to at least that number of elements:


    ```

    void func(double a[static 7]);

    ```


    +   - A pointer to a collection of objects of unknown number – These functions
    should use the VA notation:


    ```

    void func(size_t n, double a[n]);

    ```


    +   - A pointer to a single object of the type or a null pointer – Such function
    must guarantee that even when it receives a null pointer, the execution remains
    in a defined state:


    ```

    void func(double* a);

    ```


    Compiler builders only start to implement checks for these cases, so your compiler
    probably will not detect such. Nevertheless, writing these down and make them
    clear for yourself will help you to avoid out-of-bounds errors.


    +   - Addressing of block-scope (local) variables should be avoided, if possible.
    Therefore, it is good practice to mark all variables in complex code with register

    - Use unsigned integer types for loop indices, and handle wrap-around explicitly.
    The latter, for example, can be achieved by comparing the loop variable to the
    maximum value of the type before the increment operation.'
