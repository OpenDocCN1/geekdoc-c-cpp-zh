    For objects we have seen so far, it is easy to determine the effective type:


    # Takeaway 2.12.6.3 The effective type of a variable or compound literal is the
    type of its declaration.


    Later, we will see another category of objects that are bit more involved. Note
    that this rule has no exceptions, and we can''t change the type of such a variable
    or compound literal.


