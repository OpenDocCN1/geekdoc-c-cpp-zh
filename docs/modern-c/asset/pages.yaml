  md: '# 0. ENCOUNTER


    # 1. Getting started


    This section covers


    +   - Introduction to imperative programming

    - Compiling and running code


    In this section, I will introduce you to one program that has been chosen because
    it contains many of the constructs of the C language. If you already have programming
    experience, you might feel that parts of it like needless repetition. If you lack
    such experience, you might feel overwhelmed by the stream of new terms and concepts.


    In either case, be prepared. For those of you with programming experience, it''s
    possible that there are subtle details you are not aware of, or assumptions you
    have made about the language that are not valid, even if you have programmed C
    before. For those approaching programming for the first time, be assured that
    after approximately 10 pages your understanding will have increased a lot, and
    you should have a much clearer idea of what programming represents.


    An important bit of wisdom for programming in general, and for this book in particular
    is summarized in the following citation from the Hitchiker''s Guide to the Galaxy
    by Douglas Adams [1986].


    > Takeaway Don''t panic.


    It''s not worth. There are many cross references, links, and bits of information
    in the text, and there is an index at the end. Follow those if you have a question.
    Or just take a break.


    Programming in C is about having the computer complete some specific tasks. A
    C program does by giving orders, which as we express such orders in the imperative
    manner in many human languages; the term imperative programming for particular
    way of organizing programs. To started and see what we are talking about, consider
    our first program in language 1.1:


    > Takeaway 0.1.1.1 C is an imperative programming language.


    In this book, we will only encounter the C programming language, but also vocabulary
    from another dialect, C language that helps us to talk about C. It will not be
    possible to immediately explain each the first time it occurs. But I will explain
    each one in time, and all of them are indexed so you can easily catch and jump
    to more explanatory text, at your own risk.


    As you can possibly guess from this example, such a C program has different components
    form some intermixed layers. Let''s try to understand it from the inside out.
    The visible result of running this program is to output 5 lines of text on the
    command terminal of your computer. On my computer, using this program looks something
    like this:


    ^Such special terms from C jargon are marked, as shown here.'
