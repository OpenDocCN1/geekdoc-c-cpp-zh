  md: '# 16. FUNCTION-LIKE MACROS


    In this section, I will try to explain how such features can be implemented. We
    will also discuss two other features of C that are clearly to be distinguished:
    one _Generic, variadic functions, because they are many mostly obsolete and should
    not be used in new code.


    A warning about this is also in order. Macro programming quickly becomes ugly
    and barely readable, so you will need patience and good will to understand some
    of the code here. Let us take an example:


    ```

    #define MINSIZE(X, Y) (sizeof(X) < sizeof(Y) ? sizeof(X) : sizeof(Y))

    ```


    The right side, the replacement, is quite complex. It has four evaluations and
    some operators that change state. The usage of this macro wouldn''t be difficult:
    it simply completes the minimum size of the arguments.


    ![](img/e96616dd7df72c5c5b2ae1cae921b942_227_0.png)


    16.1. How function-like macros work. To provide the features that we listed, C
    has chosen a path that is quite different from other programming languages: textual
    replacement. As mentioned, macros are replaced in a very early stage of compilation,
    preprocessing. This replacement follows a strict set of rules that are specified
    in the C Standard, and all compilers (on the same platform) should preprocess
    any source code to exactly the same intermediate code.


    Let us add to our example:


    ```

    #define BYTOPCOPY(T, S) memcpy(&(T), &(S), MINSIZE(T, S))

    ```


    Now we have two macro definitions for MINSIZE and BYTOPCOPY. The first has a replacement
    list (X, Y), that defines two parameters X and Y, and replacement text


    ```

    (sizeof(X)<sizeof(Y) ? sizeof(X) : sizeof(Y))

    ```


    that refers to X and Y. Similarly, BYTOPCOPY also has two parameters T and S and
    replacement text starting with memcpy.


    These macros fulfill our requirements about function-like macros: they evaluate
    each argument only once [8] parenthesized around {}, and have hidden effects as
    unexpected control flow. The macro parameters must be identifiers. A strict scope
    rule restricts the validity of these identifiers to use inside the replacement.


    When the compiler expands the name of a function call by a closing pair of (),
    such as BYTOPCOPY(X, Y), it considers this a macro and replaces it textually according
    to the following rules:


    +   (1) The definition of the macro is temporarily deleted to avoid infinite recursion.

    (2) The text inside {}, is scanned for parentheses and commas. Each opening parenthesis
    ( must match ). A comma that is not inside such a parenthesis is used to handle
    the argument list into the macro. For the case that we have in here, the number
    of arguments must match the number of parameters in the definition of the macro.

    (3) Each argument is recursively expanded for macros that might appear in them.
    For our example, A could be yet another macro and expand to some variable name
    such as reda.

    (4) The resulting text fragments from the expansion of the arguments are assigned
    to the parameters.


    > [8]Why is this so?'
