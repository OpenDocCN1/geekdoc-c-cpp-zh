    \ and then used in a similar way as for fabs. The difference is that Generic requires\
    \ two arguments, not only one, so the _Generic expression must decide on the combination\
    \ of the two types. As a consequence, argument and conversions are effected to\
    \ the arguments of that plus operation, and as the _Generic expression chooses\
    \ the function for the wider of the two types, or double if both arguments are\
    \ doubles.\n\nThe difference from just having one function for long double, say,\
    \ is that the information about the type of the argument is not lost.\n\n> > **Takeaway\
    \ 31.6.2.1** The result of a _Generic expression is the type of the chosen expression.\n\
    \nIn this contrast to what is happening, for example, for the ternary operator\
    \ a?b:c. For the ternary operator, this must be done like that a base may be different\
    \ from run to run, so either b or c may be selected. Generic makes its choice\
    \ based on the type, this choice is fixed at compile time. So, the compiler can\
    \ know the result of the choice in advance.\n\nIn our example, we can be sure\
    \ that all generated code that uses our interface will never use wider types than\
    \ the programmer foreseen. In particular, our micro should always run in the compiler\
    \ installing the appropriate code for the types in question [Ex 15][Ex 16].\n\n\
    > > **Takeaway 31.6.2.2** Using _Generic with inline functions adds optimization\
    \ opportunities.\n\nThe interpretation of what it means to talk about the type\
    \ of the controlling expression is a bit ambiguous, so C17 clarifies this in comparison\
    \ to C11. As the previous examples imply, this type is the type of the expression\
    \ as if it were passed to a function. This means in particular:\n\n+   * If there\
