  md: '# 2. COGNITION


    # 12. The C memory model


    This section covers


    +   - Understanding untyped representations

    - Working with untyped pointers and casts

    - Restricting object access with effective types and alignment


    Pointers present us with a certain abstraction of the environment and state in
    which your process is executed, the C memory model. We may apply the unary operator
    & to (almost) all objects¹⁸ to retrieve their data and use it to change the state
    of your execution.


    Access to objects pointers is still an abstraction, seen from C, no distinction
    of the "real" location of an object. It could reside in your computer''s RAM or
    on a disk file, or to an IO port of a temperature sensor on the moon; you shouldn''t
    care. C is supposed to do the right thing, regardless.


    And indeed, modern operating systems, all you get pointers sometimes virtual memory,
    a fiction that maps the address space of your process to physical memory addresses
    of your machine. All was invented to ensure countless properties of your execution:


    +   - portable: You do not have to care about virtual memory that your process
    does not affect your operating system or any other process.


    The only C must care about the type of the object pointers addresses. Each pointer
    is derived from any type, its base type, and each such derived is a distinct new
    type:


    > Takeaway 21.2.0.1 Pointers with distinct base types are distinct.


    In addition to providing a view of physical memory, the memory model also simplifies
    the view of objects themselves. It makes that each object is a collection of bytes,
    the object representation (subsection 12.1)¹⁹ see figure 12.1 for a schematic
    view. A convenient tool is that object representation is integer (subsection 12.2).
    Giving direct access to the objects allows us to do some fine tuning; but on the
    other hand, it opens the door to unwanted or conscious manipulations of the abstract
    machine (subsection 12.4) and effective types (subsection 12.5) and alignment
    (subsection 12.7) describe real formats and constraints for such manipulations.


    # 12.1. A uniform memory model. When generally all objects are typed, the memory
    model needs another simplification: that all objects are an assemblage of bytes².
    The sizeof that we introduced in the context of arrays measures the size of an
    object in terms of the type it uses. There three distinct types that by definition
    use exactly one byte of memory; the character types char, unsigned char, and signed
    char.


    > Takeaway 21.2.1.1 sizeof (char) is 1 by definition.


    Not only all objects can be "accounted" in size as character types on a lower
    level, can be inspected and manipulated if they are arrays of such character types.
    A little later, we will see how this can be achieved, but for the moment we will
    just note the following:


    ¹⁸Only objects that are declared with register don''t have an address; see subsection
    13.2.2 over level 2.


    ¹⁹The object representation is related to but not the same thing as the binary
    representation that we saw in subsection 5.1.3.'
