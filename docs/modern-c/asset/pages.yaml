    to which they point (subsection 11.1.1). Also, pointers are considered scalars^17:
    arithmetic operations are defined for them, offset additions (subsection 11.1.2)
    and subtractions (section 11.1.3); they have state (subsection 11.1.4) and have
    a dedicated "null" state (subsection 11.1.5).


    11.1.1 Address-of and object-of operators. If we perform tasks that can''t be
    expressed with pure functions, things get more involved. We have to poke around
    in objects that are not variables of the function. Pointers are a suitable abstraction
    to do this.


    So, let us use the function_swap from earlier to swap the contents of two objects
    d0 and d1. For we use the address-of operator "&". It allows us to refer to an
    object through its address^18. A call to our function could look like this:


    ```

    double_swap(&$d0, &$d1) {

    double tmp = *p0;

    *p0 = p1;

    *p1 = tmp;

    }

    ```


    The type that the address-of operator returns is a pointer type^19 and can be
    specified with the * notation that we have seen. An implementation of the function
    could look like this: Inside the function, pointers p0 and p1 hold the addresses
    of the objects which


    the function is supposed to operate: in our example, the addresses of d0 and d1.
    But the function knows nothing about the names of the two d0 and d1; it only knows
    p0 and p1.


    | <unknown> | <unknown> |

    | --- | --- |

    | p0 | double 3.5 |

    | p1 | double 10.6 |


    To access, another construct that is the inverse of the address-of operator is
    used: the unary object-of operator "*" then p0 is the object corresponding to
    d1^[Ex 9]. With the first argument, that would be d0, and similarly *p1 is the
    object d1.


    | <unknown> | <unknown> |

    | --- | --- |

    | *p0 | double 3.5 |

    | *p1 | double 10.6 |


    Please note that the * character plays two roles in the definition of double_swap.
    In a declaration, it creates a new type (pointer type), whereas in an expression
    it dereferences^20 to the object a pointer refers^21. To distinguish these two
    uses of the symbol, we use the flush to the left with no blanks in if it modifies
    a type (such as double*) and if it refers to a pointer (*p0).


    Remember from subsection 6.2 that addition to holding a valid address, pointers
    may be null or indeterminate.


    > Takeaway 2.1.1.1 Using with an indeterminate or null pointer has undefined behavior.


    In practice, though both cases will behave differently. The first might encounter
    a random object and modify it. This often leads to bugs that are difficult to
    trace because it will poke into objects it is not supposed to. The second, if
    the pointer is null, will manifest early during development and nicely crash our
    program. Consider this to be a feature.


    [Ex 9]Write a function that receives pointers to three objects and shifts the
    values of these objects cyclically.'
