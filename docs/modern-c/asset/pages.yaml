    wraps around to 0. All of this may take some time, but after UINT_MAX-iterations,
    the loop stops

    For the second loop, everything looks similar. But because the behavior of overflow
    is undefined, the compiler is allowed to predict that it will never happen. Since
    it also knows that the value at the start is positive, it may assume that i, as
