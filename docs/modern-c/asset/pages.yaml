    # 15.3. Measurement and inspection. We have several times spoken about the performance
    of programs without talking about how to assess it. And indeed, we are notoriously
    bad at predicting the performance of code. So, our prime directive for questioning
    performance should be:


    +   Takeaway E Don''t speculate about the performance of code; verify it rigorously.


    The first step when we dive into a code project that may be performance-critical
    will always be to choose the best algorithms that solve the problem(s) at hand.
    This should be done before coding starts, so we have to make a first complexity
    assessment by arguing (but not speculating!) about the behavior of such an algorithm.


    # Takeaway 15.3.3.1 Complexity assessment of algorithms requires proofs.


    Unfortunately, a discussion of complexity proofs is far beyond the scope of this
    book, so we will not be able to go into it. But fortunately, many other books
    have written about it. The interested reader may refer to the textbook of Cormen
    al. [2001] or to Knuth''s measure theory.


    # Takeaway 15.3.3.2 Performance assessment of code requires measurement.


    Measurement in experimental sciences is a difficult subject, and obviously we
    can''t tackle it in full detail. But we should first aware how the act of modifying
    the observed hides. This holds in physics, where measuring the mass of an object
    necessarily replaces it; in biology, where collecting species exactly kills animals
    or plants; and in sociology, where asking for gender or immigration background
    before a test changes the behavior of the test subject. Not only also holds in
    computer science and, in particular, for time measurement, since all time measurements
    need time themselves to be accomplished.


    # Takeaway 15.3.3.3 All time measurements introduce bias.


    At the worst, the impact of time measurements can go beyond the additional time
    spent making measurement. In the first place, a call to timespec_get, for example,
    is a call to a function that might be there if we didn''t measure. The compiler
    has to take some precautions before such call, in particular saving hardware registers,
    and have some assumptions about the state of execution. So time measurement can
    suppress optimization opportunities. Also, such a function usually translates
    into a system call (a call into the operating system), and this can have effects
    on many properties of the program execution, such as on the task or scheduling,
    or can invalidate caches.


    # Takeaway 15.3.3.4 Instrumentation changes compile-time and runtime properties.


    The art of experimental sciences is to address these issues and to ensure that
    the bias introduced by the measurement is small and the result of an experiment
    can be assessed qualitatively. Concretely, before we can do any time measurements
    on code that interests us, we have to address the bias that time measurements
    themselves introduce. A'
