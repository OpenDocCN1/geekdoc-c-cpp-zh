  md: "# ACQUATAINTANCE\n\n7.3. Recursion. An important feature of functions is encapsulation:\
    \ local variables are only visible and alive until we leave the function, either\
    \ via an explicit return or because execution falls out of the last brace of the\
    \ function's block. Their identifiers (names) do not conflict with similar identifiers\
    \ in other functions, and once we leave the function, all the memory we used is\
    \ cleaned up.\n\nEven when we call a function, one we have called before, a new\
    \ set of local variables (including function parameters) is created, and these\
    \ are newly initialized. This also holds if we call a function for which another\
    \ call is still active in the calling functions. A function that calls itself\
    \ directly or indirectly is called recursive, and the process is called recursion.\n\
    \nRecursive functions are crucial for understanding C: they demonstrate and use\
    \ primary features of the function model and are only fully functional with these\
    \ features. As a first example, we will look at an implementation of Euclid's\
    \ algorithm to compute the greatest common divisor (gcd) of two:\n\n```\nsize_t\
    \ gcd2(size_t a, size_t b) {\n  assert(a <= b);\n  if (!a) return b;\n  size_t\
    \ rem = b % a;\n  return gcd2(rem, a);\n}\n```\n\n![](img/e96616dd7df72c5c5b2ae1cae921b942_92_0.png)\n\
    \nAs you can see, this function is short and cleanly. But to understand how it\
    \ works, we need to thoroughly understand how functions work, and how we transform\
    \ mathematical statements into algorithms.\n\nGiven two integers a, b > 0, the\
    \ gcd is defined as the greatest integer c > 0 that divides both a and b. Here\
    \ is the formula:\n\n> gcd(a, b) = max{e ∈ N | e|a and e|b}\n\nIf we also assume\
    \ that a < b, we can easily see that two recursive formulas hold:\n\n+   (2) gcd(a,\
    \ b) = gcd(b, a - b)\n(3) gcd(a, b) = gcd(a, b%a)\n\nThat is, the gcd changes\
    \ if we subtract the smaller integer or if we replace the larger of the two with\
    \ the modulus of the other. These formulas have been used to compute the gcd since\
    \ the days of ancient Greek. They are attributed to Euclid (c. 300 B.C.), but\
    \ may have been known before him.\n\nOur function gcd2(a, b) (line 9), checks\
    \ if if a precondition for the execution of this function is satisfied: whether\
    \ the first argument is less than or equal to the second. It does this using the\
    \ assert macro from assert.h. This would abort the program with an informative\
    \ message if the function was called with arguments that didn't satisfy that condition\
    \ (we will see more explanations of assert in subsection 8.7).\n\n+   Takeaway\
    \ 1.7.3.1 Make all preconditions for a function explicit.\n\nThen, line 10 checks\
    \ whether a is zero, in which case it returns b. This is an important step in\
    \ a recursive algorithm:\n\n+   Takeaway 1.7.3.2 In a recursive function, check\
    \ the termination condition.\n\nA missing detection leads to infinite recursion;\
    \ the function repeatedly calls copies of itself until all system resources are\
    \ exhausted and the program crashes. On modern systems with large amounts of memory,\
    \ this may take some time, during which the system will be completely unresponsive.\
    \ You'd better not try it."
