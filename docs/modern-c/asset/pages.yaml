    A C program may have many threads than it has processing elements

    at its disposal. A runtime system should be able to schedule the threads

    by distributing time slices on a process. If a thread has no work to do, it

    should not demand a time slice and leave the processing resources to other threads

    that might need them. This is one of the main features of the data structures
    mtx_t

    and cnd_t.


    > > Takeaway: While blocking on mtx_t or cnd_t a thread frees processing re-sources.


    If this is not enough, there are two other functions that can suspend:


    +   * thrd_sleep allows a thread to suspend its execution for a certain time,
    such that

