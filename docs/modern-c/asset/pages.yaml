    # 17.6. Signal handlers. As we have seen, setlongjmp can be used to handle exceptions
    that we detect during the execution of our code. A signal handler is a tool that
    handles exception conditions that are different: they are triggered by some event
    that is external to the program. Technically, there are two types of external
    events: hardware interrupts, also referred to as traps or synchronous signals,
    software interrupts or asynchronous signals,


    The first occurs when the processing device encounters a fault that it cannot
    handle: for example division by zero, or a misaligned address in an instruction
    that operates on a wider type. Such an event is synchronous with the program execution.
    It is directly caused by a faulting instruction, so it is always known which instruction
    the interrupt was raised.


    The second arises when the operating or runtime system decides that program should
    terminate, because some user has issued a request, or what we know it is going
    to end. Such an event is asynchronous, because it can fall in the middle of a
    multistage instruction, leaving the execution environment in an intermediate state.


    Most processors have a built-in mechanism to handle hardware interrupts: an interrupt
    vector table. This table is indexed by the different hardware faults that the
    platform knows about. Its entries are pointers to interrupt handlers, which are
    executed when the specific fault occurs. So the processor detects a fault, execution
    is automatically switched away from the current program. The interrupt handler
    is executed. Since a mechanism is not provided, but the names and locations of
    the faults are different from platform to platform. It is tedious to handle, because
    to program a simple application, we''d have to provide all handlers for all interrupts.


    C''s signal handlers use an abstraction to deal with both types of interrupts,
    hardware and software, in a portable way. They work similarly to what we describe
    for hardware interrupts, but


    +   * The names of (some of) the faults are standardized.

    * All faults have a default handler (which is mostly implemented).

    * And (most) handlers can be specialized.'
