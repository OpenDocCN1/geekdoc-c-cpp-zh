  md: '# Buckle up


    In many ways, C is a permissive language; programmers are allowed to shoot themselves
    in the foot or other body parts if they choose, and C will make no effort to stop
    them. Therefore, for the moment, we will introduce some restrictions. We''ll try
    to avoid handing out the key to the gun out of your reach for the moment, marking
    its location with big and multiple exclamation marks.


    The most dangerous constructs in C are the so-called casts, so we''ll skip them
    at this level. We will approach some of them in a way that might look unfamiliar
    to you, or if you learned C in the last millenium or if you were introduced to
    C on a platform that wasn''t upgraded to ISO C for years.


    **Experienced programmers**: If you already have experience with C programming,
    what follows may take some getting used or even provoke allergic reactions. If
    you happen to break out in spots when you read some of the code here, take a deep
    breath and try to relax, but please do not skip these pages.


    **Inexperienced programmers**: If you are not an experienced C programmer, much
    of the following may be a bit over your head; for example, we may use terminology
    that you have not yet heard of. If so, this is a digression for you, and you may
    skip to the start of section 3 and come back when you feel a bit more comfortable.
    But sure to do before the end of this level.


    Some of "getting used to" our approach on this level may concern the emphasis
    and ordering in which we present the material:


    +   - We will focus on the `unsigned` versions of types.

    - We will introduce pointers in order: first, in disguise as parameters to functions
    (section 6.1.4), then with their state (being valid or not, section 6.2), and
    then, on the next level (section 11), using their entire potential.

    - We will focus on the `use` of arrays whenever possible, instead.


    You might be surprised by some style considerations that we will discuss in the
    following-level points. On the next level, we will dedicate an entire section
    (section 9) to these questions, so please be patient and accept them for the moment
    as they may be.


    (1) We bind type qualifiers to the left**: We want to separate identifiers by
    their type. We will typically write things as


    ```

    char* name;

    ```


    where `*` is the type and `name` is the identifier. We also apply the left-binding
    rule to qualifiers and write


    ```

    char const* path_name;

    ```


    Here the first `const` qualifies the char to its left, the `*` makes it a pointer,
    and the second `const` qualifies what is to its left.


    (2) We do not use continued declarations.: They obfuscate the bindings of type
    declarations. For example:


    ```

    unsigned const* a, b;

    ```


    Here, b has `unsigned const*`: that is, the first `const` goes to the type, and
    the second `const` only goes to the declaration of `a`. Such rules are highly
    confusing, and you have more important things to learn.'
