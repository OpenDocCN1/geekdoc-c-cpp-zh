  md: 'Similar to signal handlers, the simultaneous conflicting action of threads
    on shared variables mut be be handled very carefully.


    # Takeaway 3.18.1.1 If a thread T0 writes a non-atomic object that is simultaneously
    read or written by another thread T1, the behavior of the execution becomes undefined.


    In general, it will be difficult to establish what simultaneous should mean when
    we talk about different threads (as discussed). Our only choice to avoid such
    situations is to rule out all potential conflicts. If there is such a potential
    simultaneous unprotected access, we speak of a race condition.


    In our example, unless we take precautions, an update of a bool as finished is
    visible between different threads. If two threads access it in an interactive
    way, an update may lead to an undefined program state; the compiler cannot know
    whether a specific object can be subject to a race condition, and therefore we
    have to tell it explicitly. The simplest way to do so is by using a tool that
    also saw with signal atomics. Here, our life structure has several members that
    are specified with _Atomic:


    ```

    // Parameters will dynamically be changed by

    // different threads

    _Atomic(size_t) constellations; // Constellations visited

    _Atomic(size_t) x0; // Cursor position, row

    _Atomic(size_t) x1; // Cursor position, column

    _Atomic(size_t) frames; // FPS for display

    _Atomic(bool) finished; // This game is finished.

    ```


    Access to these members is guaranteed to be atomic. Here, this is the member finished
    we already know, and some other members that we use to communicate between input
    and draw, in current position of the cursor.


    # Takeaway 3.18.1.2 In execution of different threads, standard operations on
    atomic objects are indivisible and linearizable.


    Here, linearizability ensures that we can argue with respect to the order of computations
    in two different threads. For example, if a thread sees that finished is modified
    (set to true), it knows that the thread has performed all the actions that it
    is supposed to do. In effect this extends the merely syntactic properties of sequencing
    (section 17.2).


    Operations on atomic objects also help us to determine which parts of our threads
    are not executed simultaneously, so that no race conditions may occur between
    them. Later, in subsection 19.1, we will see how this can be formalized into the
    happened-before relation.


    Because atomic objects differ semantically from normal objects, the primary syntax
    is to declare them as an atomic specifier; as we have seen, the keyword _Atomic
    followed by parentheses the type from which the atomic is derived. There is also
    another syntax that uses _Atomic as an atomic qualifier similar to the other qualifiers
    const, volatile and restrict. In the following specifications, the two different
    declarations of A are equivalent:


    ```

    extern _Atomic (double (+)[45]; A;

    extern double (*Atomic A) [45];

    extern _Atomic (double) (*)[45];

    extern double _Atomic (*8)[45];

    ```'
