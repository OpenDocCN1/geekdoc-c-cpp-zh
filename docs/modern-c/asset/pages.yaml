    If you are interested in code (and if you are, probably), early in the development
    phase are really helpful?² So, considering a feature. See the blog entry mentioned
    in crash.h for an interesting discussion on this topic.


    In the previous code, we also see a new operator, alignof (or Alignof, if you
    don''t include <stdalign.h>), that provides us with the alignment of a specific
    type. You will rarely find the need to use it in real code.


    Another key can be used to force alignment at a specified segment: aligns (respectively,
    Aligns). Its argument can be either a type or expression. It is useful if you
    know that your platform can perform operations more efficiently if the data is
    aligned in a certain way.


    For example, for alignment of a complex variable to the size and not half the
    size, as we saw, you could use


    ```

    alignas(sizeof(complex double)) double z;

    ```


    Or if you know that your platform has efficient vector instructions for float[4]
    arrays:


    ```

    alignas(sizeof(float[4])) float vec[4];

    ```


    These operators do not help against the Effective Type Rule (takeaway 21.2.6.1).
    Even with


    ```

    alignas(unsigned) unsigned char[sizeof(unsigned)] = { 9 };

    ```


    the example at the end of section 12.6 remains valid.


