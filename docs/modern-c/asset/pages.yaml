    #include <stdio.h>\n\n/* The main thing that this program does. */\nint main(void)\
    \ {\n    // Declarations\n    double A[5] = {\n        [0] = 9.0,\n        [1]\
    \ = 2.9,\n        [4] = 3.E+25,\n        [3] = .00007,\n    };\n\n    // Doing\
    \ work\n    for (size_t i = 0; i < 5; i++) {\n        printf(\"element_%zu_is_%zu,its_square=%g\\\
    n\",\n               i, A[i]*A[i]);\n    }\n    return EXIT_SUCCESS;\n}\n```\n\
    \n| element 0 is 9, its square is 81 element 1 is 2.9, its square is 8.41 element\
