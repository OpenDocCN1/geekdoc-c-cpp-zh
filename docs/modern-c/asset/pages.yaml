    are known to be uninterruptible; other operations aren''t, and the width may be
    limited.


    # Takeaway 3.17.6.6 Objects of type sig_atomic_t should not be used as counters.


    This is because simple ++ operation might be deferred in three (load, increment,
    and store) and because it might easily overflow. The latter could trigger a hardware
    interrupt, which would be really bad if were inside a signal handler.

    The later classes were only introduced by C11 for the prospect of threads (which
    are asynchronous) and are only for the test macro _SDNC_ATOMIC_ has not been defined
    by the platform and the header stdatomic.h has been included. The function sh_count
    uses these features, and we will see an example for this later.

    Because signal handlers for asynchronous signals may, they cannot access or change
    the program state in any asynchronous way except volatile signal. Generally, it
    is difficult to know from an specification whether a function has this property,
    and the C standard guarantees only a handful of functions:


    +   - The Noreturn functions abort_exit, and quick_exit which terminate the program;

    - signal for the same signal number for which the signal handler was called

    - Some functions that act on atomic objects (discussed shortly)


    # Takeaway 3.17.6.7 Unless specified otherwise, C library functions are not asynchronous.


    By the C standard itself, a signal handler cannot exit or do any form of IO, but
    it can use quick_exit and the at_quick_exit handlers to execute some cleanup code.

    As noted, C''s specifications for signal handlers are minimal, and often a specific
    platform will allow for more. Therefore, portable programming with signals is
    tedious, and exceptional conditions should be dealt with in a cascade, as we have
    in our examples:

    (1) Exceptional conditions that can be detected and handled locally can be dealt
    with using goto for a limited number of labels.

    (2) Exceptional conditions that are not handled locally should be returned as
    a special value from functions whenever this is possible, such as returning a
    null pointer of a pointer to an object.

    (3) Exceptional conditions that change global state can be handled with setjmp/longjmp
    if an exceptional return would be expensive or complex.

    (4) Exceptional that result in a signal being caught by a signal handler, should
    be handled after the return of the handler in the normal flow of execution.

    Since we have the list of signals that the C standard is minimal, dealing, with
    the different possible conditions becomes complicated. The following shows how
    we can handle a collection of signal numbers that goes beyond those that are specified
