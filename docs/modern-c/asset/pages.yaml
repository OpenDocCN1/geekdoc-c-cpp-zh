  md: '# I. ACQUAINTANCE


    # 7. Functions


    This section covers


    +   - Introduction to simple functions

    - Working with main

    - Understanding recursion


    We have already seen the different means that C offers for **conditional execution**:
    execution based on a value, chooses one branch of the program over another to
    continue. The reason for a potential "jump" to another part of the program code
    (for example, an *else* branch) is a runtime decision that depends on runtime
    data. This section starts with a discussion of nonunconditional ways to transfer
    control over other parts of our code: by themselves, they do not require us to
    decide where to go.


    The examples we have seen far used functions from the C library that we did not
    (or were not able) to implement ourselves, such as `printf` for printing and `strlen`
    for computing the length of a string. The idea behind this concept of functions
    is that they implement a certain feature, once and for all, and that we can rely
    only on that feature in the rest of the program.


    A function for which we have several definitions is **main**, the entry point
    of execution into a program. In this section, we will look at how to write functions
    ourselves that provide features just like the functions in the C library.


    The reasons motivating the concept of functions are modularity and code factorization:


    +   - Functions avoid repetition. In repetition they avoid easily introduced copy-paste
    and errors and save the effort of editing in multiple places if you modify a piece
    of functionality. Therefore, functions increase readability and maintainability.

    - Use of functions decreases compilation times. A given code snippet that we encapsulate
    in a function is compiled only once, not at each point it is used.

    - Functions simplify code reuse. Once we have extracted code into a function that
    provides functionality, it can easily be applied in other places that we did not
    expect when implementing the function.

    - Functions provide clear interfaces. Arguments and return types specify the origin
    and type of data that flows into and out of a computation. Additionally, functions
    allow us to specify invariants for a computation: pre- and post-conditions.

    - Functions provide a way to formulate algorithms that use a "stack" of intermediate
    values.


    In addition to functions, C has other means of unconditional transfer of control,
    which are mostly used to handle error conditions or other forms of exception from
    the usual control flow:


    +   - `exit`, `quick_exit`, and `abort` terminate the program execution (see section
    8.7).

    - `goto` transfers control within a function (see subsections 13.2.2 and 14.5).

    - `setjmp` and `longjmp` can be used to return unconditionally to a calling context
    (see subsection 17.5).

    - Certain events in the execution environment or calls to the function may `raise
    signals` that pass control to a specialized function, a `signal handler`.


    # 7.1. Simple functions. We have used a lot of functions and seen some their declarations
    (for example in section 6.1.5) and definitions (as listing 6.3). In all of these
    functions, parentheses `()` play an important syntactic role. They are used for
    function'
