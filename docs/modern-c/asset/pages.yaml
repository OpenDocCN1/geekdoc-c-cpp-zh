  md: '# 6. Derived data types


    This section covers


    +   - Grouping objects into arrays

    - Using pointers as opaque types

    - Combining objects into structures

    - Giving new names with typedef


    All other data types in C are derived from the basic types that we know now. There
    are four strategies for deriving data types. Two of them are called aggregate
    data types, because they combine multiple instances of one or several other data
    types:


    Arrays: These combine items that all have the same type (subsection 6.1).

    Structures: These combine items that may have different base types (subsection
    6.3).


    The two other strategies to derive data types are other involved:


    +   - Pointers: Entities that refer to an object in memory.

    Pointers are by far the most important concept, and we will delay a full discussion
    of them to section 11. Here, in subsection 6.2, we will only discuss them as opaque
    data types, without mentioning the reason they fulfill.

    - Unions: These overlay of different base types in the same memory location. Unions
    require a deeper understanding of C''s memory model and are not of much use in
    a programmer''s everyday life, so they are only introduced later, in subsection
    1.2.


    There is a fifth that introduces new names for types: typedef. Unlike the previous
    four, this does not create a new type in C''s type system, but only creates a
    new name for an entity. In that way, it is similar to the definition of macros
    #define; thus the choice for the keyword for this feature.


    # 6.1. Arrays. Arrays allow us to group objects of the same type in an encapsulating
    object. We will see pointer types (section 11), but many people who come to C
    are confused about arrays and pointers. This is completely normal: arrays and
    pointers look like pointers in many contexts, and pointers refer to arrays. We
    chose an order of introduction that is perhaps unusual: we start with arrays and
    stay with them as long as possible before introducing pointers. This may seem
    seem "wrong" to some of you, but remember that everything stated here must be
    viewed based on the as-if Rule (Takeaway 1.5.1:7); we will describe arrays in
    a way that is consistent with C''s assumptions about the abstract state machine.


    | Takeaway 1.6.1 Arrays are not pointers.


    Later, we will show how these two concepts relate, but for the moment it is important
    to read this without prejudice towards arrays; otherwise, you will delay your
    ascent to a better understanding of C.


