    **8.3.3. Io** Output to streams is usually buffered; that is, to make more efficient\
    \ use of its resources, the IO system can delay the physical write of a stream\
    \ until we close the stream with fclose; all buffers are guaranteed to be flushed\
    \ where it is supposed to go. The function flush is in places where we want to\
    \ see output immediately on the terminal, or where to close the file but we want\
    \ to ensure all content we have written has properly recorded its listing. Listing\
    \ 8.1 shows that example writes 10 to stdout with a delay of approximately one\
    \ second between all writes[53]\n\nThe most common consequence of IO buffering\
    \ for text files is line buffering. In that mode, output is only physically written\
    \ when the end of a line is encountered. Usually, text that is written with puts\
    \ appears immediately on the terminal; fputs waits until it encounters an '\\\
    n' in the put string. Another interesting thing about text streams and files is\
    \ that there is no one-to-one correspondence between characters that are written\
