    # 7.2. main.** Perhaps you have noted some particularities about main. It has
    a special role as the entry point into the program; its prototype is enforced
    by the C standard, but it is implemented by the between the runtime system and
    the application, main has obey some special rules.


    First, to suit different needs, it has several prototypes, of which one must be
    implemented:


    ```

    int main(void);

    int main(int argc, char* argv[1]);

    ```


    Then, C platform may provide other interfaces. Two variations are relatively common:


    +   * On embedded platforms where main is not expected to return to the runtime
    system, the system type may be void.

    * On many platforms, a parameter can get access to the "environment".


