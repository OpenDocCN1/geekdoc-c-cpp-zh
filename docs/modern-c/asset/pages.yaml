    portable code (which you do), stick to the "official" forms. For these, the return
    value of int gives an indication to the runtime system if the execution was successful:
    a value of EXIT_SUCCESS or EXIT_FAILURE indicates success or failure of the execution
    from the programmer''s point of view. These are the only values that are guaranteed
    to work on all platforms.


