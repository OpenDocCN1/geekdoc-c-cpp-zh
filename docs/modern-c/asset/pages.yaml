    **15.2. Using restrict qualifiers.** We have seen many examples of C library functions
    that use the keyword restrict to qualify pointers, and we have also used this
    qualification for our own functions. The basic idea of restrict is relatively
    simple: it tells the compiler that the pointer in question is the only access
    to the object it points to. Thus the compiler can make the assumption that changes
    to the object can only occur through that pointer, and the object cannot change
    inadvertently. In other words, with restrict, we are telling the compiler that
    the object does not alias any other object that the compiler handles in this part
    of the code.


    +   Takeaway 3.15.2.1 A restrict-qualified pointer provides exclusive access.


    As is often the case in C, a declaration places the burden of verifying this property
    on the caller.


    +   Takeaway 3.15.2.2 A restrict-qualification constrains the caller of a function.


    Consider, the differences between memcpy and memmove:


    ```

    void memcpy(void*restrict s1, void const*restrict s2, size_t n);

    void memmove(void const* s1, void* s2, size_t n);

    ```


    For memcpy, both pointers are restrict-qualified. For the execution of this function,
    the access through both pointers must be exclusive. Note that, s1 and s2 have
    different values, and neither of them can provide access to parts of the object
    of the other. In other words, the two objects "seen" through the two pointers
    must not overlap. Assuming this violated results in undefined behavior.


    In contrast, memmove does not make such an assumption. s1 and s2 may be equal,
    or the objects may overlap. The function must be able to cope with that situation.
    Therefore it might be less efficient, but it is more general.


    In subsection 13.2 it might be important for the compiler to consider whether
    two pointers point to the same object (aliasing). Pointers of different types
    are not supposed to alias, unless one of them is a character type. So both parameters
    of fputs are declared with restrict


    ```

    int fputs(const char *restrict s, FILE *restrict stream);

    ```


    although it might seem very unlikely that any fputs calls with the same pointer
    value for both parameters.


    This specification is more important for functions like printf and:


    ```

    int printf(const char *restrict format, ...);

    int fprintf(FILE *restrict stream, const char *restrict format, ...)

    ```


    The format pointer does not alias any of the arguments that might have been passed
    to the ... parameter. For example, the following case has undefined behavior:


    ```

    char const* format = format_printing_self:"s\n";nprintf(format, format); // Restrict
    violation

    ```


    This example will probably do what you think it does. If it does, your program
    might employ:


    ```

    char const* format = "First_two_bytes_in_stdin_object:%.2s\n";nchar const* bytes
    = (char*)stdin; // Legal cast to char

    printf(stdin, format, bytes); // Restrict violation

    ```'
