    For example, the operations on the type `size_t` can be entirely determined when
    inspecting the value of `SIZE_MAX` in addition to the operations. We call the
    model that represents values of a given type on a given platform the *binary representation*$
    of the type.


    **Takeaway 1.5.1.5** A type''s binary representation determines the results of
    all operations.


    Generally, all we need to determine is what is within reach of any program; the
    C headers provide the necessary information through named values (such as `SIZE_MAX`),
    operators, and function calls.


    **Takeaway 1.5.1.6** A type''s binary representation is observable.


    This binary representation is still model and thus an *abstract representation*
    in the sense that it doesn''t completely determine how values are stored in a
    computer or on disk other persistent storage device. That representation is the
    *object representation*. In contrast to the binary representation, the object
    representation is usually not much concern to us, as we don''t want to have back
    values of objects in memory or have to communicate with computers that have different
    platform models. Later, in 12.1, we will see that we can even observe the object
    representation, if such an object is stored in memory and we know its address.


    As a consequence, all computation is fixed through the values, types, and their
    binary representations that are specified in the program. The program text describes
    an *abstract state machine*$^C$ that regulates how the program switches from one
    state to the next. The transitions are determined by value, type, and binary representation.


    **Takeaway 1.5.1.7 (as-if)** Programs execute as if following the abstract state
    machine.


