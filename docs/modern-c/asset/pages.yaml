  md: "# COGNITION\n\nHere, **conforming** is a wide field. In C jargon, an identifier\
    \ is *reserved*^C if its meaning is fixed by the C standard and you may not redefine\
    \ it otherwise:\n\n+   * Names starting with an underscore and an underscore reserved\
    \ for language extensions and other internal use.\n* Names starting with an underscore\
    \ are reserved for file scope identifiers and for **enum**, **struct** and union.\n\
    * Macros have all-caps names.\n* All identifiers that have a predefined name are\
    \ reserved and cannot be used in file scope. This includes a lot of identifiers,\
    \ such as all functions in the C library, all identifiers starting with **str**\
    \ (like *strip*, earlier), all identifiers starting with **f**, ending in **t**,\
    \ and many more.\n\nWhat makes all of these rules difficult is that you might\
    \ not detect any violation for years; then, all of a sudden, on a new client machine,\
    \ after the introduction of the next C standard or after a simple system upgrade,\
    \ your code explodes.\n\nA simple strategy to keep the probability of naming conflicts\
    \ low is to expose as few names as possible.\n\n# Takeaway 2.9.2.3 Don't pollute\
    \ the global space of identifiers.\n\nExpose only types and functions that are\
    \ part of the application **programming interface** (*API*); that is, those to\
    \ be used by users of your code.\n\nA good strategy for that is used by or in\
    \ other projects is to use naming prefixes that are unlikely to create conflicts.\
    \ For example, many functions and types in the POSIX thread are prefixed with\
    \ **pthread_**. For my tool box P9, I use the prefixes **p99_** and **p99_** for\
    \ API identifiers and **p0_** and **p08_**, for internals.\n\nThere are two sorts\
    \ of names that may interact badly with what another grammar writers and which\
    \ you might not think of:\n\n+   * Members of **struct** and union\n* Parameter\
    \ names in function interfaces.\n\nThe first is the reason why members in standard\
    \ structures have a prefix to their names: **struct** has **t_sec** as a member\
    \ name, because an uneducated user might declare a macro **sec** that would interfere\
    \ in unpredictable ways including **t_h**. In P99, I would specify such a function\
    \ like this (we will see an example later).\n\n```\ndouble p99_memory_sum(size_t\
    \ p08_n, size_t p00_i,\n      double p08_strip[p00_n][p00_i]);\n```\n\nThis problem\
    \ gets worse when we are also programming interfaces to the public view.\n\n+\
    \   * So-**inline** functions, are functions whose definition (not only declaration)\
