  md: '# 2. The principal structure of a program


    This section covers


    +   - Grammar

    - Declaring identifiers

    - Defining objects

    - Instructing the compiler with statements


    Compared to our little examples in the previous section, real programs will be
    more complicated and contain additional constructs, but their structure will be
    very similar. Listing 1.1 has most of the structural elements of a C program.


    There are two categories of aspects to consider in a C program: syntactic aspects
    (how do we specify the program so the compiler understands?) and semantic aspects
    (what do we specify so that the program does what we want it to do?). In the following
    substitutions, we will use the terms syntactic aspects (grammar) and three different
    semantic aspects: declarative parts (what things are), definitions of objects
    (where things are), and statements (what things are supposed to do).


    # 2.1. Grammar. Looking at its overall structure, we can see that a C program
    is composed of different types of elements that are assembled in a kind of grammar.
    The elements are:


    **Special words:** In listing 1.1, we used the following special words #include,
    int., void., double., and return. In program text in this book, they will be printed
    in bold face. These special words represents concepts and features that the C
    language implies and cannot be changed.


    +   **Punctuation:** C uses several types of punctuation to structure the program.

    - There are five kinds of brackets: { ... }, ( ... ), [ ... ], / * and / . . and
    < >. Brackets group parts of the program together and should always come in pairs.
    Furthermore, the < > brackets are rare in C and are only used limited to a single
    line; their contents may span several lines, as they did when we used print earlier.

    - There are two different separators or terminators: comma and semicolon. When
    we used print, we saw that comma separated the four arguments of function; and
    on line 12 we saw that a comma can also connect the final list of elements.


    | [3] = .00007 |


    One of the difficulties for newcomers in C is that the same punctuation characters
    are used to express different concepts. For example, the pairs { } and [ ] are
    each used for three different purposes in listing 1.1 [Ex 9]


    **Takeaway 0.2.1.1** Punctuation characters can be used with several different
    meanings.


    **Comments:** The construct /* ... */ as we saw earlier tells the compiler that
    everything inside it is a comment, see, for example, line 5:'
