  md: '# ACQUAINTANCE


    In this exploration, we only need to know some simple properties of pointers.
    The binary representation of a pointer is completely up to the platform and is
    not our business.


    # Takeaway 1.6.2.1 Pointers are opaque objects.


    This means we will only be able to deal with pointers through the operations that
    the C language allows them for. As I said, most of these operations will be introduced
    later; in our first attempt, we will only need initialization, assignment, and
    evaluation.

    One particular property of pointers distinguishes them from others is their state.


    # Takeaway 1.6.2.2 Pointers are valid, null, or indeterminate.


    For example, variable pstring is always valid, because it points to the string
    literal "some_text", and because of the second const, its association can never
    be changed.

    The null of any pointer type corresponds to our old friend o, sometimes known
    under its pseudonym false.


    # Takeaway 1.6.2.3 Initialization or assignment with o makes a null pointer.


    Take the following as example:


    ```

    char const*const pnothing = 0;

    ```


    We visualize this special situation like this:


    ```

    p2nothing

    ↓

    * char const*const

    ```


    Note that this is different from an empty string:


    ```

    char const*const p2empty = "";

    ```


    p2empty char const*const

    ↓

    "

    Usually, we refer to a pointer in the null state as a null pointer. Surprisingly,
    disposing of null pointers is really a feature.


    # Takeaway 1.6.2.4 In logical expressions, pointers evaluate to false if they
    are null.


    Note that such tests can''t distinguish valid pointers from indeterminate ones.
    So, the really "bad" state of a pointer is indeterminate, since this state is
    not observable.


    # Takeaway 1.6.2.5 Indeterminate pointers lead to undefined behavior.


    An example of an indeterminate pointer could look like this:


    ```

    char const*const p2invalid;

    ```'
