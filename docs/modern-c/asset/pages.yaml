  md: '# 4. Expressing computations


    This section covers


    +   - Performing arithmetic

    - Modifying objects

    - Working with booleans

    - Conditional compilation with the ternary operator

    - Setting the evaluation order


    We''ve made use of simple examples of expressions$^C$. These are code snippets
    that compute a value based on other values. The simplest such expressions are
    arithmetic expressions, which are similar to those we learned in school. But there
    are others, notably comparison operators as == and !=, which we saw earlier.

    In this section, the values and objects on which we do these computations will
    be of the type size\_t, which we have already met. Such values correspond to "sizes,"
    so they cannot be negative. At what point we would like to represent all the non-negative
    integers, often denoted as $N_0$, or "natural" numbers in mathematics. Unfortunately,
    computers are finite, so we can''t directly represent all the natural numbers,
    but we can do a reasonable approximation. There is a big limit SIZE\_MAX that
    is the upper bound of what we can represent in size\_t.


    > Takeaway 1.4.0.1 The type size\_t represents values in the range [0, SIZE\_MAX].


    The value of SIZE\_MAX is large. On the platform, it is one of

    $$2^{16} - 1 = 65535$$

    $$2^{32} - 1 = 4294967295$$

    $$2^{64} - 1 = 1844674407370951615$$

