    > **Takeaway 31.5.3.7** Runtime measurements must be hardened with statistics.


    # Summary


    +   * Performance should not be traded for correctness.

    * **inline** is an adequate tool to optimize size, functions in place.

    * **restrict** has to deal with mainly properties of function parameters. It has
    to be used with care, because it imposes restrictions on the calling side of the
    function that may not be enforceable at compile time.

    * Claims of performance improvements should be accompanied by thorough measurements
    and statistics.'
