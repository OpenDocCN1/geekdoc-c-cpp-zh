  md: "# 3. EXPERIENCE\n\nIf you are trying to understand this program for the first\
    \ time, the rest is noise. This noise helps to handle exceptional cases, such\
    \ as an end of line or surplus of left or right braces. We will see all of this\
    \ works in more detail later.\n\n# 17.2 Sequencing. Before we look at the details\
    \ of how the control flow of a program can change in unexpected ways, we must\
    \ first understand what the normal sequence of statements guarantees and what\
    \ it does not. We saw in subsection 4.5 that the evaluation of C expressions does\
    \ not necessarily follow the lexicographical order in which they are written.\
    \ For example, the evaluation of function arguments can occur in any order Different\
    \ expressions can be interleaved by the compiler, or depending on the availability\
    \ of resources at execution time. We may say that function argument evaluation\
    \ is unspecified.\n\nThere are several reasons for allowing this easy implementation\
    \ of optimizing compilers. The efficiency of code has been a strong point of C\
    \ compared to other programming languages.\n\nBut another reason is that C does\
    \ not add restrictions when they don't have a convincing mathematical or technical\
    \ foundation. Mathematically, the operands a and b are freely exchangeable order\
    \ which would break this rule, and arguing about a C program would become more\
    \ complicated.\n\nIn the absence of threads, most of C's formalization of this\
    \ is with sequence points. These points are in the syntactic specification of\
    \ the program that impose a serialization of execution. We will also specify rules\
    \ that forcing sequencing between the evaluation of expressions that imply simple\
    \ sequence points.\n\nOn a high level, a C program can be seen as a series of\
    \ sequence points that are reached after the other, and the code between these\
    \ sequence points may be executed in any order, or obey other sequencing constraints.\
    \ In the simplest case, for when two statements are separated by a; a statement\
    \ before a sequence point is sequenced before the statement after the sequence\
    \ point.\n\nBut even the existence of sequence points may not impose a particular\
    \ order between two expressions: it only imposes that there is some order. To\
    \ see that, consider the following code, which is well defined:\n\n```\nunsigned\
    \ add(unsigned x, unsigned const * y) {\n    return *x *= y;\n}\n\nint main(void)\
    \ {\n    unsigned a = 3;\n    unsigned b = 5;\n    printf(\"a=%u,b=%u\\n\", add(&a,\
    \ &b), add(&b, &a));\n}\n```\n\nFrom subsection 4.5, we remember that the two\
    \ printf can be evaluated in any order, and the sequence points that we will shortly\
    \ tell us that the function calls do impose sequence points. As a result, we have\
    \ two possible outcomes for this code. Either the first is executed first, entirely,\
    \ and then the second, or the other way around. For the first possibility we have\n\
    \n+   * a is changed to 8, and that value is returned.\n* b is changed to 13,\
