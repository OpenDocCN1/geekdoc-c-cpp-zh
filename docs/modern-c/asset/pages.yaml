    # Takeaway 3.17.2.1 Side effects in functions can lead to indeterminate results.


    Here is a list of all sequence points that are defined in C''s grammar:


    +   - The end of a statement, with either semicolon (;) or a closing brace ())²⁵

    - The end of an expression before the comma operator (,)²⁶

    - The end of a declaration, with either semicolon (;) or a comma (,)²⁷

    - The end of the controlling expression of if, switch, for, while, conditional
    evaluation (?), and short-circuit evaluation (|| and &&)

    - After the evaluations of a function designation (usually a function name) and
    the function arguments of a function call but but before the actual call

    - The end of a return statement


    There are other sequencing restrictions besides implied by sequence points. The
    first two are more or less obvious but should be stated nevertheless:


    # Takeaway 3.17.2.2 The specific operation of any operator is sequenced after
    the evaluation of all its operands.


    # Takeaway 3.17.2.3 The effect of updating an object with any of the assignment,
    increment, or decrement operators is sequenced after the evaluation of its operands.


    For calls, there is also an additional rule that says the execution of a function
    is always complete before any other expression.


    # Takeaway 3.17.2.4 A function call is sequenced with respect to all evaluations
    of the caller.


    As we have seen, this might be indeterminate sequenced, but nevertheless less.
    Another source of indeterminate sequenced expressions originates from initializers.


    # Takeaway 3.17.2.5 Initialization-list expressions for array or structure types
    are indeterminate sequenced.


