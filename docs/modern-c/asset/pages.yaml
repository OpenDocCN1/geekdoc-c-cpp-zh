    There are several conventions for multiple words in identifiers.

    The most commonly used are following:


    +   - CamelCase, usingCapitalToBreakWords

    - Snake_case, using internal_underscores_to_break_words

    - Hungarian notation, which encodes type information in the prefix of identifiers,
    such as sName, where stands for string and zero terminated


    As you might imagine, none of these could obscure our view: they easily clog up
    a precious line of programming text with an unreadable expression:


    ```

    return theVerySeldomlyUsedConstant+theVerySeldomlyUsedConstant/number_of_elements;

    ```


    Hungarian notation, in turn, tends to use abbreviation for types or concepts,
    produces unpronounceable identifiers, and completely breaks down if you have an
    API change.


    So, in opinion, none of these strategies have absolute values. I encourage you
    to take a pragmatic approach to the convention.


    > **Takeaway 2.9.2** Naming is a creative act.


    It is not easily submitted by simple technical rules.

    Obviously, naming is more important the more widely an identifier is used. So,
    it is particularly important for identifiers where the declaration is generally
    out of view of the programmer: global names that constitute the API.


    > **Takeaway 2.9.6** File-scope identifiers must be comprehensive.


    What constitutes comprehensive here should be derived from the identifier. Type
    names, constants, variables, and functions generally serve different purposes,
    for different strategies apply.


    *Invented in Simonyi [1976], the PhD thesis by Simonyi Karroly'
