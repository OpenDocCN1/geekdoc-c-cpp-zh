  md: '# SUMMARY


    enable_alignment_check: enable alignment check for i386 processors


    Intel''s i386 processor family is quite tolerant in accepting misalignment of
    data. This can lead to irritating bugs when ported to other architectures that
    are not as tolerant.


    This function enables a check for this problem also for this family or processors,
    such that you can be sure to detect this problem.


    I found code on Ydrasil blog: http://orchistro.tistory.com/286


    ```

    void enable_alignment_check(void);

