    **8.1.1. Headers.** The C library has a lot of functions, far than we can handle
    in this header. A *header* files bundle interface descriptions for a number of
    features, mostly functions. The header files that we will discuss provide features
    of the C library, but we can create our own interfaces and collect them in headers
    (section 10).


    On this level, we will discuss the functions of the C library that are necessary
    for basic programming with the language we have seen so far. We will complete
    this discussion on higher levels, when we discuss a greater range of contents.
    Table 8.1 has an overview of the standard header files.


    **8.1.2. Interfaces.** Most interfaces in the C library are specified as functions,
    but implementations are there to implement them as macros, as is appropriate.
    Compared to what we saw in section 5.6.3, this uses a second form of macros that
    are syntactically similar to *function-like macros*:


    ```

    #define putchar(c, stdout)

    ```


    As before, these are just replacements, and since the replacement text may contain
    a macro argument several times, it would be bad to pass any expression with side
    effects to such a macro or function. Hopefully, our previous discussion about
    side effects (takeaway 1.4.2.2) has convinced you not to do that.'
