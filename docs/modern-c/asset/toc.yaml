  - 15.2. 使用 restrict 限定符。我们已经见过许多 C 库函数的示例，它们使用 `restrict` 关键字来修饰指针，而且我们在自己的函数也使用了这种修饰。`restrict`
    的基本思想简单：它告诉编译器，所涉及的指针是其指向对象的唯一访问途径。因此，编译器可以假设对象的修改只能通过该指针发生，而对象不会无意中发生变化。换句话说，通过
    `restrict`，我们告诉编译器该对象没有与编译器在代码此部分处理的其他对象产生别名。
