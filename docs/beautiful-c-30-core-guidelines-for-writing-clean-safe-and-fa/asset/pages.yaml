    \ we bothering?\n\nIdeally, all your classes that are associated with any resources\
    \ should have construc-tors and destructors that correctly manage the life cycle\
    \ of those resources. As we saw with std::FILE* we have an escape hatch for nonconforming\
    \ objects, but what do we do when our resource is not exposed as a pointer?\n\n\
    It might have occurred to you that we seem to be going to a lot of trouble here\
    \ to clean up after ourselves when surely the operating system does all that for\
    \ us. When a process terminates, all the handles associated with that process\
    \ are closed, all the memory is released, and everything is left ready for reuse.\
    \ Why do we care about resource leaks when the environment is going to take care\
    \ of that for us anyway?\n\nThere are a few reasons. The first is that if you\
    \ leak resources fast enough there will come a point where you will request a\
    \ resource and the operating system will decline your request, warning you that\
    \ there are none left of whatever it is you are requesting. This is especially\
    \ likely if your program is long lived, designed to run for the entire uptime\
    \ of the computer on which it is deployed.\n\nSecond, it is a good habit to get\
    \ into. If you decide that cleaning up after yourself is optional, that means\
    \ you have put a decision point into your development cycle. Every time you create\
    \ something that may leak, you"
