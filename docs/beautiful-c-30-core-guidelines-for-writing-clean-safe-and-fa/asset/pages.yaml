  md: '# Chapter 2.3


    # I.26: If you want a cross-compiler ABI, use a C-style subset


    # Creating libraries


    Writing libraries in C++ is a simple matter. Compile your source files, glue them
    together into a library, expose your exports in a header, or module if your compiler
    supports it, and supply the library file and header or module definition to your
    client.


    Unfortunately, that is not the end of the story. There is a substantial amount
    of detail to get right. The purpose of this guideline is to show you a way to
    minimize this overhead, to prevent a truly overwhelming amount of work from landing
    on your desk at some random point in the future, and to enable you to create libraries
    that will serve the community for many years to come.


    Recall the operation of the linker. It matches missing symbols from object files
    or libraries with exported symbols other object files or libraries. The declarations
    in the header point to definitions in the library file.


    For example, imagine you have written a library that contains, among other items,
    the function


    Click here to view code image


    ```

    id retrieve_customer_id_from_name(std::string const& name);

    ```


    and a header that declares it. This is a handy way of doing things: it allows
    you to create a package of functionality with a header, and your user does not
    need to spend time recompiling. Maybe your source is proprietary, and you are
    not allowed to share it.'
