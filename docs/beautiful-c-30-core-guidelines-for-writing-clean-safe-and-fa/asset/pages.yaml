- pgno: 218
  md: 'The caller provides somewhere to report errors and checks after calling that
    no error was reported. There are a few things wrong with this solution too. First,
    it’s just ugly. Readable APIs will simply tell you what is going on: if you want
    a logarithm, you expect to pass in a number and get one back. The extra parameter
    is a little extra cognitive load.


    Second, it represents additional overhead in circumstances where you are very
    confident of the range of numbers you are expecting to pass to the function. Such
    an approach will often lead to a dual-function API, where each function has a
    matching overload containing an additional error return parameter. This is rather
    inelegant.


    # Exceptions


    With the arrival of C++ came constructors. These are special functions that do
    not return anything and, in some circumstances, take no arguments. No amount of
    signature shenanigans would help you here: unless you sacrificed your default
    constructor there was nothing you could do to signal error. Worse, the destructor
    has only one function signature, taking no arguments and returning nothing. Overloaded
    operators are similarly affected.


    Exceptions were introduced to deal with this. They create an additional return
    path that can be followed in the event of error, called throwing, which bypasses
    the usual return path, and performs all the necessary cleanup normally required
    at the end of a function. Additionally, exceptions can be caught anywhere in the
    call stack, rather than precisely at the function’s call site, enabling the programmer
    to deal with errors where possible or to simply ignore them, bubbling them up
    through the call stack otherwise.


    This comes at a cost. The end of a function is very obvious: there is a return
    statement or a final closing brace. An exception can occur during any call which
    requires a lot of additional furniture to manage. Whenever you call a function
    an exception may be thrown, so the compiler must insert all the code required
    to clean up what’s on the stack in that event. This extra furniture comes with
    not only an execution speed cost, but also a space cost. This cost is so large
    that all compilers provide an option to disable'
