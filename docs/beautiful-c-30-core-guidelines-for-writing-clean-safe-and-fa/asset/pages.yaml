    that you could declare scoped objects of const-qualified type (please never call
    them const variables). A single, well-placed definition of pi was a welcome sight.
    In fact, since C++20 we have a standard definition of pi. You will find it in
    the <numbers> header, defined in the namespace std::numbers:


    Click here to view code image


    ```

    template <>

    inline constexpr double pi_v<double> =

    3.141592653589793;

    inline constexpr double pi = pi_v<double>;

    ```


    Some constants are important, but their values are arbitrary. Unlike PI, or E,
    or MONTHS_IN_YEAR, there are times when we need a handful of named values to repre-sent
    some ideas. These have always been in the form of small integers, such as 1 for
    edit, 2 for browse, -1 to quit, and so on. There is still code out there with
    vast swathes of macros defining related integers. From WinUser.h, part of the
    Windows SDK:


