- pgno: 97
  md: '> Information hiding implies that some encapsulation is taking place, but encapsulation
    does not imply that information hiding is taking place.


    Some of the encapsulation mechanisms of C++ support information hiding. The class
    offers us access levels. Members within the private implementation are hidden
    from clients of the struct. This is how we relieve clients of the burden of enforcing
    class invariants: by hiding the implementation and thus preventing clients from
    breaking them. The enumeration offers no information hiding: there is no way of
    exposing only a few members of an enumeration. Functions hide information perfectly,
    by merely exposing an identifier and a return type, while hiding away the implementation.
    Namespaces can expose declarations and hide definitions by distributing over more
    than one file. Header and source files do the same thing, as do modules.


    Consider the problem at hand. How will encapsulation help us? We have lots and
    lots of options being handled in a single function. Perhaps we can have a different
    function for each option. We then call the correct function within the if statement
    that checks the key. The function could return a bool depending on whether or
    not the parameter data was valid.


    This looks good: we have encapsulated all the different options in their own function
    and we can easily add further functions for new options; we just need to grow
    the parsing function for each one. We can even capture the return value to validate
    the options file. We still have to create an object which can apply the options
    if they are all valid, so we’ll need to update that when we add a new option,
    but that’s an easy thing to document, and anyway, other engineers will get the
    pattern when they look at other examples of these option functions.


    Mmm...


    Your Spidey-Sense should be kicking off about the places where this can go wrong.
    You are still relying on the other engineers to do the right thing when they add
    new options. They might misunderstand the nature of the validation process, or
    forget to check for the function in the if statement, or misspell the option text.
    You have improved matters considerably, but sometimes encapsulation and information
    hiding are not enough. To solve these remaining problems, we are going to have
    to bring out the big guns: abstraction.'
