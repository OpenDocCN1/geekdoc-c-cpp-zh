- pgno: 98
  md: '# The purpose of language and the nature of abstraction


    Abstraction is a tricky word. Matters aren’t helped by the fact that the result
    of abstraction is an abstraction, just as an encapsulation is the result of encapsulation.
    Let us consider the process of abstraction, in the same way that we just considered
    the processes of encapsulation and information hiding.


    Literally, abstraction means to draw off from. In a programming context, it means
    identifying and isolating the important parts of a problem, drawing them off,
    and discarding the remainder. We separate them from the details of implementation.
    We label abstractions with identifiers. Again, consider the nature of functions:
    we bun-dle a set of instructions into a single entity and label it. The function
    is an abstrac-tion with a name meaningful to the problem domain. Similarly with
    classes: the class is an abstraction with a name meaningful to the problem domain,
    containing rel-evant functionality to model behavior implied by the name.


    However, the art of abstraction is deciding what should lie within the scope of
    the abstraction and what should stay outside. This is where it differs from mere
    encap-sulation. Also, we use the word “art” advisedly: there is no mechanical
    method for deciding where to draw the line between what is relevant to the abstraction
    and what is not. That ability comes with practice and experience.


    Returning to our problem, we are trying to parse a file of key-value pairs and
    apply the results to the environment if they are valid. The function is well named:
    `parse_options_file`. The problem we have is safely adding arbitrary key-value
    pairs. Is the identity of the full set of pairs actually relevant to `parse_options_file`?
    Is it within scope? Can we separate the options from the function?


    At the moment we are simply pulling keys from the file and checking each in an
    ever-growing if-else statement since we cannot switch-case on strings. This sounds
    like an associative container. In fact, a map of keys against function point-ers
    sounds perfect here. Suddenly our function has lost a huge amount of repeti-tion
    and been replaced with a single interrogation of a map and a corresponding function
    call.'
