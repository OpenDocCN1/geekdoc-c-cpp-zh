    # Setting aside locks and mutexes


    The phrase “Don’t communicate by sharing memory; share memory by communi-cating”
    is the first Go proverb: it is a piece of wisdom as old as concurrency. The application
    of this wisdom in C++ requires setting aside mutexes and associated data entirely
    and embracing a different way of communicating between threads. This is achieved
    by passing messages.


    Messages are small objects passed by value to message queues. Each thread will
    maintain a message queue and periodically inspect it for new messages, acting
    upon them as appropriate. Messages are sent when one thread has finished something
    and needs to tell another thread that the results of its activity are now available.
    The result may be referenced in a `std::unique_ptr` object—not a `std::shared_ptr`
    object, as that would defeat the point of the approach.


    Of course, we’ve just moved the problem around. Ultimately, we can’t get away
    from sharing some data somewhere, but what we have done here is abstracted it
    into a queue object. The queue object is the only place where there will be any
    kind of write-sharing shenanigans, relieving you from the risk of shooting yourself
    in the foot.


    However, by using `std::unique_ptr` objects as handles to data, and by moving
    them from thread to thread through a message queue,³ we can treat each thread
    as a self-contained unit of work, minimizing shared writable data to the management
    of the queue.


    3. As of writing, there is no standard concurrent queue, although a paper has
