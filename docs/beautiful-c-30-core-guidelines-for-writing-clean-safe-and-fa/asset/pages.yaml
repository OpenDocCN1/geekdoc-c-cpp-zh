  md: 'withdrew the state declared to support an unused part of the algorithm. Out
    of sight, out of mind. Additionally, it is the engineer’s habit to append to a
    list rather than find the proper location, so range_average and range_max are
    separated from range_floor and range_ceiling.


    If the programmer were dedicated, keen, and not in a hurry, those variables would
    be withdrawn from the function, improving its clarity, and the remainder appropri-ately
    collected together to highlight how pieces of state are related. If the program-mer
    had Lint to hand, a static code analysis tool released to the public in 1979,
    it would warn about unused objects, making this task easier. Otherwise, the function
    would consume a few extra unnecessary bytes on the stack. Today this would not
    even be noticed as compilers would eliminate the unused variables anyway thanks
    to the as-if rule, but in the constrained environments of the 1970s, where the
    size of offline files could exceed the RAM in your machine, this might be significant.


    Another problem this introduced was variable reuse. The function may reuse an
    int for a loop counter, or for storing the result of a function call. Again, as
    the function mutated, reused variables might take on unexpected new meanings,
    and their reuse might be inappropriate. The trade-off being made was readability
    over resource constraint.


    A further impact of early declaration was that initialization was somewhat hap-hazard.
    It was easy to introduce dependencies between variables and to use them before
    they had been initialized. Every function had to be closely examined for vari-able
    coupling. Whenever a line of code was moved, it was important to ensure that any
    dependencies were honored.


    This is not a pleasant way to write code. Declaring a batch of variables, and
    then carefully initializing them one by one, is painful, error prone, and makes
    your gums ache. C++ introduced late declaration, and the first thing that happened
    was that structs and built-in types were declared and then initialized in a safe
    order. This was a significant leap forward. Rather than worrying about whether
    a struct was ready for initialization, you could declare all its dependent data
    first, initialize it, and then safely initialize the struct, without a care in
    the world.'
