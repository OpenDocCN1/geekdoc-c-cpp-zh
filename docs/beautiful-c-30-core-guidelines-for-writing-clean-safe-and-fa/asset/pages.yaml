  md: 'mainstream desktop processors in the 1990s highlighted the large amount of
    waiting incurred by the processor for loading and storing. Even worse is reading
    from and writing to external storage such as disk drives or SSDs. Worse still
    is reading from and writing to arbitrary storage over net-work cables or Wi-Fi.


    Typically, during the operation of your program there exists some data stored
    outside main memory, on a remote device. There also exist operating system calls
    which open connections to these devices. We will consider a file on a local disk
    drive.


    The program will create a buffer of memory to receive the data, and then direct
    the operating system to open a file on the local disk drive, read the data into
    the buffer, and close the file. It would be ideal if the program could leave the
    operating system to its own devices, and then receive a notification when the
    data from the disk drive has filled the buffer. Such a facility is in fact available
    on all modern operating systems. Two threads of execution exist, one which creates
    the buffer and one which fills the buffer.


    This kind of concurrency is relatively simple. If you handle I/O errors correctly,
    if you do not read the buffer prematurely, and if you periodically check for completion,
    all is well. Reading the buffer early is a class of error known as a data race.
    Precisely, a data race occurs when these conditions are met:


    +   - Two or more threads access the same memory location concurrently.

    +   - One of the threads is writing to the memory.

    +   - The threads are not using anything to control or schedule their accesses
    to that memory.


    Sadly, as programs increase in complexity, it is too easy to create a data race.
    A branch of your code may not be checking if the buffer has been filled. Perhaps
