  md: 'Changing the type of an object can hurt static type safety. Sometimes it is
    perfectly safe, as in this example:


    ```

    short f2();

    ```


    ```

    long result = f2();

    ```


    Here, the result of the call to f2 has been converted from a short to a long using
    an implicit conversion. This is an integral promotion, where the representation
    is simply widened. Every value that can be represented by an object of type short
    can also be represented by an object of type long. The same is true when promoting
    from float to double.


    Not all conversions are as safe as that. Consider this:


    Click here to view code image


    ```

    long f2();

    ```


    ```

    short result = (short)f2();

    ```


    This is an explicit conversion where the destination type is named. If you know
    that the return value of f2 lies within the representation range of a short object,
    then this is conditionally safe. However, it is not entirely safe: the function
    may change specification and start returning larger numbers. There is no requirement
    for the compiler to emit a diagnostic telling you that you are performing a risky
    conversion, although most will warn you.


    This style of conversion is often known as C-style casting. The syntax comes straight
    from the C programming language. Conversion was important to the C programming
    language. Consider this function signature:


    ```

    long max(long, long);

    ```


    If we call this function with an object of type long and an object of type short
    and we don’t have conversion available to us, then we will be presented with an
    error and we will need to write a different function:'
