    # Variations in C++ language level and compiler


    C++ compiler implementers must entirely and precisely support the standard if
    they want to announce that their compiler is standard-compliant. However, this
    does not tie their hands entirely, and leaves the door open for them to add additional
    features or extensions. For example, GCC included additional type traits such
    as `__has_trivial_constructor` and `__is_abstract` before they were added to the
    standard. These have both been present in the type traits library since C++11
    under different names: `std::is_trivially_constructible` and `std::is_abstract`.


    Note that `__is_abstract` is preceded by a double underscore: the double underscore
    is reserved by the standard to implementers. Implementers are NOT allowed to add
    new identifiers to the `std` namespace. This would be a very bad idea, as they
    might subsequently be added to the standard with a completely different meaning.
    What this means in practice for C++ developers is that it is possible to accidentally
    write code that appears to be using standard features, but in fact is accidentally
    using a compiler-specific feature. A good way to guard against this is to build
    and test your code on more than one compiler and operating system, to discover
    accidentally non-standard code.


    These two features were provided for good reason: they were useful metaprogramming
    tools. Indeed, they were so useful that they were added to the standard. Many
    parts of the standard, both language and library'
