    int report_fileIO(Report&, int, int, int);

    ```


    These functions take an object and modify it according to some input parameters.
    This sounds like a member function, particularly if we look at a potential member
    function signature:


    Click here to view code image


    ```

    int Report::report_rendering(int, int);

    int Report::report_fileIO(int, int, int);

    ```


    The technique of passing in-out parameters in addition to input parameters is
    in fact just a way of extending the class’s API without creating a new member
    func-tion. This is a valuable technique for a client of the class since it does
    not require you to find the original author and hound them for additional functionality.
    It is also a valuable technique for the author since it enables the support of
    Core Guideline C.4: “Make a function a member only if it needs direct access to
    the representation of a class.”


    This guideline contributes toward keeping your interfaces minimal and complete.
    If a function can be enabled in this way, as a nonmember function, then that is
    one fewer function for your class interface. Alternatively, if you have a collection
    of non-member friend functions, or a collection of getters and setters which are
    only called by a few functions that could be friend functions, you have identified
    candidates for extending your interface. If you can correct this imbalance, do
    so.


    Having said all this, it turns out that there is a use case for taking an object
    by non-const reference and returning it: the iostream library. The chevron operator
    for outputting a character looks like this:


    Click here to view code image


    ```

    template<class Traits>

    std::basic_ostream<char, Traits>& operator<<(

    ```'
