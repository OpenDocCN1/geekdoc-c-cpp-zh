  md: '# Solving the problem of cluttered scope resolution operators


    The convenience of using-directives at global scope is very hard to let go of.
    Without it, we have to liberally sprinkle scope resolution operators, ::, throughout
    our code. This is perhaps bearable when the namespace is std. But when the namespace
    is World::Buildings::Business, things become rather harder to read and easily
    appre-hend. Let''s review the correct use of namespaces.


    Recall the existence of one single global namespace. The things you should declare
    in the global namespace are strictly limited to other namespaces, the main function,
    and extern "C" declarations. As a result of this, you should declare all your
    symbols inside your own namespaces.


    Namespaces encapsulate symbols but also offer abstraction capabilities. Keep-ing
    abstractions small enough to apprehend in a single glance is a commendable strategy:
    gathering related classes into a single namespace is a form of abstraction. However,
    as projects grow the number of classes will grow, as will perforce the num-ber
    of namespaces if you are being smart about small abstractions. This leads to declarations
    as described above, such as World::Buildings::Business. This is a lot of typing
    and highlights why engineers are tempted by using-directives.


    Fortunately, a more fine-grained approach exists. Aliasing is available to namespaces
    as well. This enables you to abbreviate World::Buildings::Business to something
    a little more palatable:


    Click here to view code image


    ```

    namespace BizBuild = World::Buildings::Business;

    ```


    This namespace alias does not import any symbols into the current scope, or into
    a parent scope, or anything inconvenient and confusing like that. It simply introduces
    another name that aliases a namespace. From the above declaration of this names-pace,
    it allows you to type


    ```

    auto x = BizBuild::compete();

    ```'
