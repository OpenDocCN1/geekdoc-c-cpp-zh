  md: 'An immediate manifestation of this problem is that you may have a favorite
    framework that you use extensively, which may contain idiomatic use of C++ that
    has been deprecated. Perhaps it contains a Singleton for capturing and manipulating
    environment variables, or settings informed by the command-line parameters which
    may be subject to change. You might feel that your favorite framework can do no
    wrong, but that is not the case. Just as scientific opinion changes with the arrival
    of new information, so does best C++ practice. This book that you are reading
    today may contain some timeless advice, but it would be supremely arrogant and
    foolish of me to suggest that the entire text is wisdom for the ages, with stone-carved
    commandments about how you should write C++.


    The second problem is that advisories are the distillation of several motivations,
    often hidden entirely from the snappy and memorable phrase that sits in our imme-diate
    recall. “Avoid singletons” is much easier to remember than “avoid overengi-neering
    single-instance abstractions into a class and abusing access levels to prevent
    multiple instantiations.” Learning the advice is not enough. You must learn the
    moti-vations so that you know why you are taking a particular approach, and when
    it is safe not to do so.


    C++ Core Guidelines is a living document with a GitHub repository on which you
    can make pull requests. It contains hundreds of advisories with varying amounts
    of motivation, and the purpose of this book is to highlight some of the deeper
    moti-vations for 30 of them.


    Earlier we remarked that you may be thinking that all static objects are Single-tons,
    so all static objects should be avoided. You should be able to see now that static
    objects are not Singletons, nor are they necessarily singletons. They are an instance
    of an object whose duration is the entire duration of the program. Nor are they
    nec-essarily globals: static data members have class scope, not global scope.


    Similarly, “Globals are bad, m’kay?” is not universally the case. It is global
    muta-ble state that can hurt you, as revealed in Core Guideline I.2: “Avoid non-const
    global variables.” If your global object is immutable, then it is merely a property
    of your program. For example, while writing a physics simulation for a space game
    we could quite reasonably declare an object of type float called G, which is the
    gravitational constant, in the global namespace like this:

