  md: 'I graduated to an Atari ST, with a Motorola 68000 CPU running at 8MHz, and
    a truly extraordinary 512MB of RAM. My programming style of well-organized parts
    kept me sane. There was one and only one place to start a piece of code, and you
    would always go back to where you came from. I told everyone it was the one true
    way: I was religious in my zeal.


    It turned out I was not the only person to write code like this. FORTRAN and COBOL
    programmers could tie themselves in similar knots if they decided not to take
    the same kind of care. This led to a simple piece of wisdom: “Single Entry, Sin-gle
    Exit.” There should be one and only one entry point for a function. There should
    be only one place it returns to: where it was called from.


    Single Entry, Single Exit was part of the structured programming philosophy, which
    emerged from Edsger Dijkstra’s letter to the editor titled “GOTO statement considered
    harmful.”³ The book Structured Programming⁴ is still an excellent read and you
    should consider reading both of these. They informed how programming was done
    for over a decade.


    3. www.cs.utexas.edu/users/EWD/ewd02xx/EWD215.PDF


    4. Structured Programming by Ole Johan-Dahl, Edsger W. Dijkstra, and Charles Anthony
    Richard Hoare.


    Unfortunately, old habits die hard. Not only that, but the motivation behind those
    habits starts to recede from memory with the passage of time. New innovations
    diminish the importance of old wisdom. Functions in C++ obviate the need to pay
    attention to the idea of “Single Entry.” The syntax of C++ makes it impossible
    to jump halfway into a function. Similarly, there is no way to return to anywhere
    other than the call site (exception handling and coroutines aside).


    You might be asking yourself what this has to do with multiple return statements.
    Well, unfortunately, there was a mix-up with the prepositions in the minds of
    the programmer community, and single exit came to mean “return FROM one place
    only” rather than “return TO one place only.” Disaster.


