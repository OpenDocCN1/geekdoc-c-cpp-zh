    Some of these types can be modified by sign or by size. The keywords signed and
    unsigned can be applied to char and int. The keyword short can be applied to int.
    The keyword long can be applied to int and double. This keyword can also be applied
    twice to int. In fact, the keyword int can be omitted entirely and replaced with
    the sign or size modifiers. The modifiers can also be applied in any order: the
    type long unsigned long is entirely valid.


    This might seem at first glance to be somewhat cumbersome, although if I saw long
    unsigned long in any code submitted for review, I would return it with a request
    for justification. The presence of the size modifier gives rise to a favorite
    interview question of mine: “How big is an int?” the answer to which is, “It depends.”
    The standard offers some guarantees.


    +   - A short int and an int are at least 16 bits wide.

    +   - A long int is at least 32 bits wide.

    +   - A long long int is at least 64 bits wide.

    +   - 1 == sizeof(char) <= sizeof(short) <= sizeof(int) <= sizeof(long) <= sizeof(long
    long).


    The implementation decides on these widths. This set of choices is known as the
    data model. There are four models that have found wide acceptance:


    +   - LP32 or 2/4/4 (int is 16-bit, long and pointer are 32-bit) as used in the
    Win16 API

    +   - ILP32 or 4/4/4 (int, long, and pointer are 32-bit) as used in the Win32
    API and some Unix systems

    +   - LLP64 or 4/4/8 (int and long are 32-bit, pointer is 64-bit) as used in the
    Win64 API

    +   - LP64 or 4/8/8 (int is 32-bit, long and pointer are 64-bit) as also used
    in some Unix systems'
