- pgno: 469
  md: '# # INTERESTING PROPERTIES OF THE AIR.


    **NEW OBSERVATIONS ON THE LIQUEFACTION OF GASES**


    **CONDENSATION OF CERTAIN GASES AT TEMPERATURES FAR ABOVE THEIR CRITICAL TEMPERATURES.**


    The critical temperature of a gas is the temperature above which it cannot be
    liquefied by pressure alone, no matter how great the pressure may be. At temperatures
    below this critical point the gas may be condensed, and if the pressure is sufficiently
    high it becomes a liquid. The gases whose properties are here considered are those
    which remain in the gaseous state under ordinary conditions, and hence are often
    called the non-boiling gases.


    The following table gives the temperatures at which the more important of these
    gases cease to boil when the pressure is reduced to a very low point. It will
    be observed that these temperatures are in general far below the ordinary boiling
    points of the substances, and are often much higher than the critical temperatures
    of the corresponding gases.


    **TABLE I.**


    **TEMPERATURES OF THE NON-BOILING GASES.**


    | Gas | Temperature |

    |---|---|

    | Carbon dioxide | 31° C. |

    | Oxygen | -118.8° C. |

    | Nitrogen | -146.9° C. |

    | Hydrogen | -240.3° C. |

    | Helium | -267.9° C. |


    These figures show how far the so-called permanent gases are from condensation
    at ordinary temperatures. The recent observations described in the opening heading
    show, however, that under suitable conditions certain gases may be condensed at
    temperatures far above their critical temperatures. This remarkable result is
    of great theoretical interest, and it promises to throw much light on our knowledge
    of the physical properties of matter in the gaseous state.


    Further experiments on the condensation of gases in vacuo have been undertaken,
    and it is believed that they will not only explain the facts already observed,
    but will also lead to the discovery of many new properties of the air and of the
    other gases which compose the atmosphere.'
