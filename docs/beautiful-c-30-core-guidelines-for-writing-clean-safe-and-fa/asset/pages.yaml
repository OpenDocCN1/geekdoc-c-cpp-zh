  md: 'The next kind of error is the programming bug. Rather than the caller getting
    something wrong, the thing being called has got something wrong, for example dereferencing
    memory that it shouldn’t. The trouble with these bugs is that they put the program
    in a corrupted state, and everything should stop. You can no longer rea-son about
    what is going on with the program and there is no value in reporting this to the
    caller. What could they possibly do about it? The program is in a corrupt state,
    from which there is no restoration.


    The final kind of error is a little more subtle. This occurs when the program
    envi-ronment breaks. If you have Read The Front Matter of the standard you will
    have learned all about the “abstract machine” at the same place that you learned
    about the as-if rule. You will find it in the standard at [intro.abstract].³ There
    are a few ways you can break the abstract machine: exhausting the free store,
    or exhausting the stack, are the two most common. Both are out-of-memory conditions.
    You would exhaust the free store by requesting a vector of a billion doubles on
    a 32-bit machine. You would exhaust the stack with infinite recursion.


    3. https://eel.is/c++draft/intro.abstract


    It is only in the case of the first error, the recoverable error, that you should
    notify the calling code by throwing an exception or returning an error value.
    Otherwise, you should simply stop the program and tell the programmer via an assert
    or by writing to a log file or to stdout. If you have broken the abstract machine
    your options for telling the programmer are very limited.


    > *You do not know how your calling code is going to respond to errors. You cannot
    rely on your caller handling the error.*


    The second problem is that you do not know how your calling code is going to respond
    to errors. You cannot rely on your caller handling the error. They might intentionally
    discard the error value entirely and carry on their merry way, or they may simply
    forget about it.


    For example, your string conversion function could return a double and take a
    reference to an error code in addition to the string to be converted.'
