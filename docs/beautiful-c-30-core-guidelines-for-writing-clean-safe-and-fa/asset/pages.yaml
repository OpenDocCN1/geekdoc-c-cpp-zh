    means that client code is less likely to need modifying if the implementation
    of the abstraction changes.


    Of course, having said all this, sometimes you simply want to fling bundled data
    around without going to all the trouble of building a class: it might not be necessary,
    since the data could simply be bytes read from a file or a network socket. This
    is when you would use a struct. The data is public, and getters and setters are
    neither necessary nor relevant.


    # Summary


    In summary:


    +   - Trivial getters and setters add nothing to an interface.

    +   - Nontrivial setters should preserve class invariants.

    +   - Nouns and verbs provide superior function identifiers that better reflect
    the abstraction.

    +   - Unrelated data without class invariants can be bundled into a struct.'
