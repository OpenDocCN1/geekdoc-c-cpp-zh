  md: 'The implementation does not need to be exposed to the client like some Heath
    Robinson drawing of marvelous and fascinating complexity. It can be hidden away
    in the dark recesses of a private implementation file. This has the additional
    advantage of improving the stability of the file in which the namespace is declared,
    minimizing large-scale dependent recompilation. Of course, the data used to model
    the abstraction will not be owned by an object, so it will be static. Beware of
    the static initialization order fiasco as described above.


    # Wait a moment...


    You might be looking at this namespace solution and remarking to yourself “but
    this is still a Singleton.”


    It is not a Singleton. It is a singleton. The problem that the guideline is warning
    about is the Singleton pattern, not the existence of single-instance abstractions.
    Indeed, in an interview with InformIT in 2009, Erich Gamma, one of the four authors
    of *Design Patterns*, remarked that he wanted to remove Singleton from the catalogue.
    6


    6. https://www.informit.com/articles/article.aspx?p=1404056


    There are two problems that we have with C++ advice. The first is that what was
    smart advice once may not remain smart advice forever.


    At the moment, a new version of C++ is released every three years. The introduction
    of `std::unique_ptr` and `std::shared_ptr` in 2011 changed the advice on how we
    matched new and delete pairs (“Don’t delete an object in a different module from
    where it was created”) by making it entirely feasible to never use raw new and
    delete, as advised by Core Guideline R.11: “Avoid calling new and delete explicitly.”
    Learning a set of advisories and then moving on with your life is not sufficient:
    you need to continually review advice as the language grows and changes.


    > *What was smart advice once may not remain smart advice forever.*'
