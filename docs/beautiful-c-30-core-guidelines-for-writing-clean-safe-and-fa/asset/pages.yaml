- pgno: 221
  md: 'This is nice: there is a consistent way to test for error, with error information
    wrapped up in the object in the case of failure. Everything is local. Unfortunately,
    it is still possible to forget to test.


    The second class of interest is outcome<T, EC, EP, NoValuePolicy>. Where the result
    class signals a simple success or failure bundled with context, the outcome class
    exposes failure in two ways: expected and unexpected failure, which are specified
    by the second and third parameters. The expected failure can be recovered from,
    while the unexpected failure cannot. This unrecoverable failure is where an exception
    would feature in the usual run of things within the language.


    This class is a way of retrofitting exception safety to a codebase. It can transport
    exceptions across layers of the program that were never designed with exception
    safety in mind.


    While boost::outcome is a useful part of the Boost library, it has not been standardized
    (more on this shortly), and so is only available in codebases where use of Boost
    is permitted. There are a surprising number of environments where this is not
    the case, which leaves you with only three error-handling options: throw and catch
    exceptions, propagate error codes back through the call stack, or roll your own
    superior, solution-domain-specific error-handling mechanism. This seems less than
    satisfactory.


    # Why is error handling so hard?


    The first problem is that different types of errors need handling in different
    ways. Let’s identify three types of errors.


    Consider a function for converting a string to a number. This will fail if the
    string does not include a number and only a number. This is a recoverable error
    that you should report back to the caller: there was a logic error in the calling
    code that meant that the input did not meet the constraints identified by the
    author of the function. This is the simplest kind of error: “I was expecting this,
    you supplied that, that’s wrong, please go and think about what you have done.”
    It is a violation of a precondition and the caller should always be told about
    this.'
