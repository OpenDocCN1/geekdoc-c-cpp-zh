    # constinit


    We shall complete this chapter with the constinit keyword. To do this, we need
    to be clear about zero initialization and constant initialization. Initialization
    is, sadly, a huge topic worth a book on its own, so we shall only focus on these
    two aspects of C++ initialization.


    Zero initialization is a fine example of good naming. It means setting the initial
    value of an object to zero. There is a small problem with C++ in that there is
    no special syntax for zero initialization. It occurs in a variety of situations,
    for example:


    ```

    static int j;

    ```


    Ordinarily, if you declare an object without initializing it, then you have no
    guarantee of its value unless there is a default constructor. Since int has no
    constructor, you might expect j to be random bits. However, there is a special
    exception for objects of static duration: they are zero-initialized as part of
    static initialization, before main() is called. Particularly, the value is zero
    explicitly converted to the type.'
