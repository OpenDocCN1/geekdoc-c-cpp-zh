  md: 'The likely operation of this function is that it will retrieve the character
    buffer from the string reference, query a database Somewhere In The Cloud with
    it, and return an id formed from the result of the query. A string implementation
    may contain a length followed by a pointer to a buffer, so retrieving the character
    buffer and passing it to the database is a trivial matter.


    Now, imagine that your library becomes insanely popular: perhaps the database
    is full of particularly useful information and everyone wants a piece. You have
    hun-dreds, then thousands, then tens of thousands of clients, all cheerfully parting
    with their cash in exchange for this functionality. Suddenly, a trickle of complaints
    come in telling you that the library is crashing during the execution of this
    function. The trickle becomes a torrent and then a veritable flood of ire. You
    investigate and notice that there has been a toolset upgrade: the compiler, linker,
    and standard library have changed.


    The next thing you do is rebuild the library and the unit tests with the new toolset
    and run everything. It all passes. There is no crash. You attempt to reproduce
    the bug report, but to no avail. What has happened?


    The answer is that the definition of std::string has changed. When you first shipped
    the library, std::string was implemented as a length followed by a pointer. Unfortunately,
    your clients have upgraded to a new toolset which now implements string as a pointer
    followed by a length. They are now supplying a std::string const& to your function
    whose memory layout is different from what it is expecting. On attempting to dereference
    the pointer, it is in fact dereferencing the length, reach-ing into forbidden
    memory, and engendering a hasty exit.


    Of course, when you recompiled the library and the unit tests, they were all built
    with the new toolset, so the definition of std::string agreed throughout, as a
    pointer followed by a length. Everything passed. It is only when new code called
    your old code that things went wrong.


