  md: 'I’m not going to detail the descent into madness that I endured over the follow-ing
    12 days (and nights) as I tried to work out what on earth was going on. It turned
    out that the problem was an artifact of timing, and both threads were waiting
    for a buffer owned by the other thread. This timing artifact was unique to multiprocessor
    machines, it turned out. I could reproduce it nowhere else in the building.


    I had encountered my first deadlock.


    A deadlock occurs when two threads of execution are waiting for a resource held
    by the other. Each thread was waiting on the other buffer before completing its
    work and releasing its lock. On the single-processor machines, things proceeded
    as expected: one buffer would fill and release its lock, allowing the other thread
    to carry on. With two processors it was possible, and in fact usual, to block
    both threads at the same time, each waiting for the other to finish.


