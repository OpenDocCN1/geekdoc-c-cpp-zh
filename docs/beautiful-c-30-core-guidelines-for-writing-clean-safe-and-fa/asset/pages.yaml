  md: '# Chapter 4.6


    # T.10: Specify concepts for all template arguments


    # How did we get here?


    Concepts are one of the big-ticket items of C++20. They have taken a long, long
    time to make their way into the standard. The first attempt at standardizing them
    started after C++98 and a version of concepts nearly made it into C++11, or C++0x
    as it was being called at the time. However, concepts were withdrawn from the
    working draft at the eleventh hour and put into a Technical Specification (TS).
    Technical Specifications are used to gather implementation experience. The Concepts
    TS was published at the end of 2015 allowing compiler implementers to kick the
    tires and check the roadworthiness of the feature.


    C++17 hit feature freeze during 2016, at which point concepts were insufficiently
    proven for safe addition to the language. However, at the first committee meeting
    of the C++20 delivery cycle, in Toronto in the summer of 2017, motion 11, “Move
    to apply the changes in P0734 (Wording Paper, C++ extensions for Concepts) to
    the C++ working paper,” was passed to joyous applause.


    As an aside, this was my first committee meeting. I had attended study group meetings
    before, and national body meetings, but this was the first time I had put myself
    in the same room as the people who shape the standard. Concepts were not the only
    thing to make significant advance. Motion 12 advanced Modules for balloting among
    the national bodies, motion 13 advanced the Coroutines TS and motion 22 appointed
    an editing committee, including me, to verify the correctness of the Ranges TS.
    Clearly C++20 was going to be a great leap forward. This was not what I was expecting
    for my first visit, but history is made by those who turn up. Should you ever
    find yourself at your first committee meeting, come and find me and then volunteer
    for everything.'
