    # Do as little as possible, but no less


    Does this mean that you should always convert a bundle of parameters to a class?


    It does not. The guideline says keep the number of function arguments low. If
    you are working within the x64 ABI, there is a four-register fast-call calling
    convention by default. A four-parameter function will execute slightly faster
    than a function taking a class by reference. It is up to you to decide if the
    trade-off is worth it. Of course, if you have a dozen parameters, then creating
    a class to encapsulate the state is an obvious choice. There is no hard-and-fast
    rule, just a guideline that should be interpreted in the context in which you
    are working.


    The second part of the guideline discussion focuses on violating the “one function,
    one responsibility” rule. This is a simple rule that says that a function should
    do one thing only, which enables it to do it well. The poster child for violation
    of this principle is the realloc function. There is a good chance that if you
    are a well-behaved C++ programmer you will never have encountered this beast.
    It exists in the C Standard Library, where it is declared in the header <stdlib.h>
    with this signature:


