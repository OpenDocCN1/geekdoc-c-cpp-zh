  md: 'didn’t see the point. UIComponent is a trivial object, swapping it is trivial,
    why call a function?”


    My immediate response was “declaration of intent.” There is a Core Guideline for
    this, P3: “Express intent.” Yes, it is obvious what was going on; we have all
    manually written a swap by assigning to a temporary and so on. By replacing that
    with a single word, swap, we make it even clearer at no extra cost. The function
    call will be substituted for the implementation by even the simplest of compilers.
    Additionally, if UIComponent stops being a trivial object and merits its own specialization
    of swap, the code benefits from that change in detail. Eliminating that little
    piece of detail and replacing it with a function template reduced complexity,
    raised the level of abstraction, and made the code more expressive. It also added
    some future-proofing.


    Of course, we already have a large source of useful function templates in the
    standard library, particularly those in the `<algorithm>` header. There is a very
    high chance that if you find yourself writing a loop, you will be able to replace
    that loop with one of the function templates defined in this header. Indeed, if
    you cannot do that, perhaps you have found a new algorithm. You should share it
    with the world.


    We really are quite serious.


    There are likely to be some omissions from the `<algorithm>` header. For example,
    C++20 saw the standardization of `std::shift_left` and `std::shift_right`. This
    shifts elements in a range, and it was something I found myself doing quite a
    lot. It never occurred to me that plenty of other people might be doing something
    so fun-damental. When I saw the paper come before the committee, I felt quite
    foolish: there was a lightbulb moment as I realized how much I would use this
    function.


    Some of the function templates in the `<algorithm>` header make use of other functions
    from the same header. For example, `std::minmax` will make use of `std::min` and
    `std::max`. Every opportunity is taken to raise the level of abstraction, resulting
    in reuse of code and thus as few new lines of code as possible.


    Once you start replacing your loops with existing function templates, your code
    becomes markedly more expressive and less prone to bugs. If you are unwittingly
