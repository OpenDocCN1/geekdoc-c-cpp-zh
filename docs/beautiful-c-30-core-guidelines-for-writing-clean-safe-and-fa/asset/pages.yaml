  md: "Why is there a jump from 0x01E1 to 0x0200? Most likely, there was a change\
    \ in domain after MN_GETHMENU and there was no guarantee that there would be no\
    \ further addi-tions. It would be easy to identify the domain by looking at the\
    \ second nibble. Or maybe it was completely arbitrary. We can never know. We cannot\
    \ capture this infor-mation with simple preprocessor definitions.\n\nEnumerated\
    \ types provide a way of gathering constants together, which make them ideal for\
    \ identifying, for example, error values, thus creating a specific error abstraction.\
    \ Rather than declaring:\n\nClick here to view code image\n\n```\n#define OK =\
    \ 0\n#define RECORD_NOT_FOUND = 1\n#define TABLE_NOT_FOUND = 2\n```\n\nyou can\
    \ define an enumeration instead:\n\n```\nenum DB_error {\n    OK,\n    RECORD_NOT_FOUND,\n\
    \    TABLE_NOT_FOUND\n};\n```\n\nThe enumerators have the same values as the preprocessor\
    \ constants since enumera-tions start at zero by default and increment by one\
    \ for each enumerator. They are spelled using uppercase letters since they are\
    \ directly replacing those preprocessor constants. This should be the exception\
    \ rather than the rule and enumerators should usually be spelled using lowercase\
    \ letters. This is a matter of style rather than part of the standard: following\
    \ this style prevents collisions with preprocessor symbols, which are conventionally\
    \ spelled using uppercase letters.\n\nUnfortunately, the enum keyword does not\
    \ define a scope, nor does it define an underlying type. This can lead to some\
    \ interesting problems. Consider an enumera-tion of two-letter codes for US states.\
    \ Here is a snippet:"
