- pgno: 122
  md: 'This sounds like the job is done: pass and return fixed-width built-in types
    and there should be no problems. However, there is another way that data passes
    between functions, which is via the exception-handling machinery. When an exception
    is thrown, the compiler will allocate space for the exception and then start unwinding
    the stack via a call to a special function in the standard library implementation.
    On some platforms, this function will iterate through each catch statement via
    data inserted by the compiler corresponding to each function body. It''s looking
    for a catch statement that will handle the type of exception that has been thrown.


    There are two possible outcomes: either a matching catch statement is found, or
    no matching catch statement is found. In the latter case, the standard library
    implementation will call std::terminate which, by default, will call std::abort.
    This returns control to the host environment without cleaning up. If the stack
    unwinder is fortunate enough to find a matching catch statement, it will then
    go back through the stack and clean up each function, calling destructors and
    restoring the stack, before resuming execution at this matching catch statement.
    After the catch statement is executed, the memory allocated for the exception
    is released.


    Setting aside the matter of what might happen when the exception is thrown because
    of a lack of memory, this behavior is deeply implementation specific. The mechanism
    used to allocate space for the exception, and the format of the data inserted
    by the compiler after each function body, will depend on the implementation, as
    will the means by which each catch statement is described to the stack-unwinding
    function. This information is all written by the toolset at compile time, and
    if two libraries built with two compilers differing by even the version number
    coexist in the same program, there is a risk of ABI incompatibility. The risk
    is quite small, however: the exception-handling info format is defined by the
    platform ABI, and the exception types are defined by the library, and the vendors
    go to great lengths not to change those things. However, if you are feeling particularly
    cautious, the only option here is to ensure that exceptions do not leave your
    library, and to decorate each function in the API with noexcept or noexcept(true)
    depending on your local style.


    As you can see, some work is required to ensure a cross-compiler ABI for a library.
    This is a manifestation of the perils of binary dependency. You may decide to
    distribute (or consume) a library as source or as a prebuilt'
