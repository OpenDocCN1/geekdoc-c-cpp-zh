    But what IS metaprogramming, and how does TMP model it?


    In a nutshell, metaprogramming blurs the line between state and execution by treating
    code as data. The program can see and understand its own code and rea-son about
    it, making decisions based on its own structure and content. This leads to things
    like self-modifying code. For example, and this is going back many years, knowledge
    of Z80 assembly has allowed me to change code while it’s running. I was able to
    change jump destinations while code was running to change the behavior of algorithms
    at runtime.


    In the case of C++, the compiler knows about the language and treats all the declarations
    as data. It works on this data to produce the final program. This means there
    is scope for metaprogramming, which is realized through templates. Templates are
    customization points for the language, yielding new types depending on how they
    are instantiated. These types can be thought of as the result of calculations
