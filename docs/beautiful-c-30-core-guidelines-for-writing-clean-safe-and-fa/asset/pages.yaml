    # Summary


    There are many ways of building abstractions, but often there comes a time when
    the client wants more from their function. We cannot simply say, “Nope, I’m not
    going to add another parameter, that violates Core Guideline I.23,” and fold our
    arms, glaring at them. This is not very kind to your colleagues. What, then, do
    we do when there are no further meaningful abstractions to be induced?


    The presence of a surplus of parameters is a signal that complexity is getting
    out of control and that something needs attention. If there are no more abstractions
    to be induced from them, then perhaps the problem lies with the function identi-fier
    itself. If a lot is being demanded of it, then it is clearly a very important
    identi-fier in the problem domain. Rather than try and encapsulate that importance
    in a single abstraction, perhaps it is time to consider broadening the function.
    Perhaps the function should be overloaded according to how its use is intended,
    or varying function names can be used to accommodate the different types of operation.
    Maybe a function template is required. There are always other options besides
    adding addi-tional parameters.


    The important thing to remember, whatever the reason for adding additional parameters
    to a function, is that it is not to be undertaken lightly and should be considered
    a last resort, and a place to start reconsidering the nature of the function itself.
    Keep the parameter count low, separate similar parameters, minimize com-plexity,
    and rejoice in the discovery of abstractions.


    +   - Multiple parameters increase the burden of understanding on the user.

    +   - Gather parameters together in structs, perhaps with a view to discovering
    a latent abstraction.

    +   - View multiple parameters as a sign that the function may be trying to do
    too much.'
