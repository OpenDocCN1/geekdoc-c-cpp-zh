    own chapter, but it’s worth considering some others here in the context of multiple
    return statements. For example, Core Guideline F.2: “A function should perform
    a single logical operation.” Although this guideline talks about splitting larger
    functions into smaller component functions, and viewing large numbers of parameters
    with suspicion, one of the side effects of following this advice is that your
    functions are likely to have a single return instruction, which is the result
    of the function.


    In the same vein, Core Guideline F.3: “Keep functions short and simple.” The function
    that acts as a counterexample stretches over 27 lines of text and includes three
    return statements. However, the final example, which puts some of the logic into
    two helper functions, is nearly a third of the size but still contains three different
    return instructions, decided upon by the input parameters.


