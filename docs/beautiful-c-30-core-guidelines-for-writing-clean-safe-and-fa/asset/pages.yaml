    # Why have default constructors anyway?


    We will start this chapter with a scenic detour. Consider Core Guideline NR.5:
    “Don’t use two-phase initialization.” This is referring to the habit of constructing
    an object and then calling an initialization function. This practice dates from
    the last century, when C was the very thing, and one would declare an object on
    the stack or allocate some memory from the free store and then initialize it.
    If you were really on top of things, you would define a function that took a pointer
    to your struct and call it my_struct_init or something like that.


    The two phases were allocate, then initialize. All sorts of things could go wrong:
    you could insert more and more code between the allocation and the initialization
    and suddenly find you were using your object prior to initialization. Then along
    came C++ and constructors and this problem vanished forever.


    For objects with static duration, the linker would create a list of their construc-tors
    for execution prior to main() and a function to iterate through them. The linker
    would have full knowledge about how much space they would take up, so that func-tion
    might allocate some address space for those objects, initialize them all by con-structing
    them in that address space, and then invoke main().


    For objects with automatic duration, the compiler would allocate some stack space
    and initialize the object within that memory. For objects with dynamic dura-tion,
    the new operator would invoke operator new to allocate some memory, followed by
    the constructor to initialize the object'
