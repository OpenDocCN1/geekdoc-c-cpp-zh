    # Nouns and Verbs


    But this is rather missing the point of good class design. A class is an abstraction
    of an idea, not a bundle of data. The reason why change_height and height are
    good function identifiers is because they convey, in English, what is going on.
    The client engineer doesn’t care that they are changing an int by some amount:
    they care that they are changing the height of the object. They don’t want to
    know the value of the height_member, they want to know the height of the object.
    These two things oper-ate at different levels of abstraction, and leaking abstraction
    details is bad practice, unnecessarily increasing the cognitive load of the client
    engineer.


    The private data, the implementation, models the abstraction. The public mem-ber
    functions are expected to have meaning related to the abstraction, not to the
    implementation of the abstraction. Get and set functions precisely don’t do this.
    The public/private divide identifies the different levels of abstraction.


    Particularly, this approach helps to model the Model-View-Controller concept.
    As a real-world example, consider an elderly nuclear reactor consisting of a reactor
    core, and a control room that might have many panels of buttons, switches, and
    slid-ers and rows and rows of lamps and gauges. The lamps and gauges give you
    informa-tion about the reactor core; they are views. The buttons, switches, and
    sliders change the reactor core in some way; they are controllers.


    This is observed in API design. Member functions that are const-qualified give
    you a view of the object. Other member functions control the object. Member data
    models the object. When choosing identifiers for the view and controller functions,
    it makes sense to choose nouns for the former and verbs for the latter rather
    than get and set functions.


