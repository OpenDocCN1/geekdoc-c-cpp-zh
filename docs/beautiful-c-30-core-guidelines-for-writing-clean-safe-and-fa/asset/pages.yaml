  md: '# Preface


    The complexity of writing C++ is diminishing with each new standard and each new
    piece of teaching literature. Conferences, blogs, and books abound, and this is
    a good thing. The world does not have enough engineers of sufficient quality to
    solve the very real problems we face.


    Despite the continuing simplification of the language, there is still much to
    learn about how to write good C++. Bjarne Stroustrup, the inventor of C++, and
    Herb Sutter, the convenor of the standards body that maintains C++, have devoted
    considerable resources to creating teaching materials for both learning C++ and
    writing better C++. These volumes include *The C++ Programming Language*¹ and
    *A Tour of C++*², as well as *Exceptional C++*³ and *C++ Coding Standards*⁴.


    +   1. Stroustrup, B, 2013. *The C++ Programming Language*, Fourth Edition. Boston:
    Addison-Wesley.

    +   2. Stroustrup, B, 2018. *A Tour of C++*, Second Edition. Boston: Addison-Wesley.

    +   3. Sutter, H, 1999. *Exceptional C++*. Reading, MA: Addison-Wesley.

    +   4. Sutter, H, and Alexandrescu, A, 2004. *C++ Coding Standards*. Boston: Addison-Wesley.


    The problem with books, even this modest volume, is that they represent a snapshot
    in time of the state of affairs, yet C++ is a continuously evolving language.
    What was good advice in 1998 may no longer be such a smart idea. An evolving language
    needs an evolving guide.


    An online resource, C++ Core Guidelines,⁵ was launched at the CppCon Conference
    in 2015 by Bjarne Stroustrup and Herb Sutter during their two⁶ keynote⁷ talks.
    The guidelines provide excellent, simple advice for improving your C++ style such
    that you can write correct, performant, and efficient code at your first attempt.
    It is the evolving guide that C++ practitioners need, and the authors will be
    delighted to review pull requests with corrections and improvements. Everyone,
    from beginners to veterans, should be able to follow its advisories.'
