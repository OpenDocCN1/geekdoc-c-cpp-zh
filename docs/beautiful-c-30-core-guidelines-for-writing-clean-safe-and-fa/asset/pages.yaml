  md: 'though, there was an obvious optimization, and that was to use memcpy rather
    than per-item copying.


    memcpy is a C function that you should never use directly, since it simply duplicates
    the contents of memory somewhere else, without any regard for the copy construc-tor.
    This means that although the data is correct, any additional initialization, for
    example registering objects with a notification service, or destruction, for example
    deregistering from the notification service, is skipped. memcpy is an implementation
    detail that should not be part of your daily use.


    My colleagues turned and walked away. I was crestfallen and decided to write a
    vector that would use memcpy rather than copy constructing and destructing as
    it should have done. I called it mem_vector. This was only for use with types
    that had no constructor or destructor, and it was great. Everyone was excited
    about it and put it to good use in combination with the algorithms. I was on cloud
    nine for about three days until someone broke everything by adding a constructor
    to a type. The mem_vector was no longer fit for purpose in that case, and soon
    it became clear that it was not fit for purpose unless the code was finished,
    by which point The Old Ways had been followed anyway.


    What I REALLY needed was a way of choosing between using memcpy and individ-ual
    per-element copy-and-destroy. This was a bit of a head scratcher, since it meant
    providing a member function overload that would be chosen for families of types
    rather than specific types. I wanted to be able to declare:


    Click here to view code image


    ```

    template <class T>

    void mem_vector<T>::resize(size_type count);

    ```


    (this was before C++11) along with


    Click here to view code image


    ```

    template <class Trivial>

    void mem_vector<Trivial>::resize(size_type count);

    ```'
