  md: "# Chapter 3.1\n\n# I.11: Never transfer ownership by a raw pointer (T*) or\
    \ reference (T&)\n\n# Using the free store\n\nOwnership is important. It implies\
    \ responsibility which, in C++, means cleaning up after yourself. If you create\
    \ something, you clean it up. While this is a completely trivial matter for objects\
    \ of static and automatic storage duration, it is a minefield for objects of dynamic\
    \ duration which are allocated from the free store.\n\nOnce memory is allocated\
    \ from the free store it can be very easily lost. It can only be returned to the\
    \ free store using the pointer to which it was assigned. This pointer is the only\
    \ available handle to the memory. If that pointer falls out of scope without being\
    \ copied, then the memory can never be recovered. This is known as a memory leak.\
    \ For example:\n\nClick here to view code image\n\n```\nsize_t make_a_wish(int\
    \ id, std::string owner) {\n    Wish* wish = new Wish(wishes[id], owner);\n  \
    \  return wish->size();\n}\n```\n\nAt the end of the function the Wish pointer\
    \ falls out of scope, leaving the memory unrecoverable. We can change the function\
    \ a little by returning the pointer so that the caller can take ownership and\
    \ delete the object later, freeing the memory.\n\nClick here to view code image"
