  md: '# Chapter 5.4


    # ES.22: Don’t declare a variable until you have a value to initialize it with


    # The importance of expressions and statements


    This is the fourth guideline from the ES section of the Core Guidelines, Expressions
    and Statements, to which we have devoted a chapter. One reason for that is the
    size of this section (over sixty items), but more importantly it gets to the heart
    of C++. The section opens with the following:


    > “Expressions and statements are the lowest and most direct way of expressing
    actions and computation.”


    This guideline binds together with ES.5: “Keep scopes small” and ES.10: “Declare
    one name (only) per declaration.” As you saw in ES.5, keeping scopes small is
    a great improvement to readability, since scope creates context. Small scopes
    also improve resource management, since their release is supported by deterministic
    destruction, minimizing their retention. In ES.10 you saw the importance of separating
    declara-tions into individual objects rather than grouping them together C-style.
    The facility to group declarations behind a single type is a feature of backward
    compatibility, no more than that. It offers no advantage to the C++ programmer,
    and in fact can serve to confuse and complicate.


    Another way of improving readability is to delay the declaration of objects until
    the last possible moment. Functions grow and change. They just do. Often, we do
    not quite spot their rampant expansion in a timely fashion and we are left with
    a somewhat unwieldy collection of objects and logic. When we realize what has
    hap-pened, we seek to partition the function into useful parts, to abstract it
    into smaller functions, hiding the complexity and restoring order to our source
    file. This process is hampered'
