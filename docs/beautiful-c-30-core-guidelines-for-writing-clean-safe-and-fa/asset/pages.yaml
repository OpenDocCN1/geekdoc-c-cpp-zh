  md: 'What this demonstrates is a pair of functions that support a single idea, but
    which operate at different levels of abstraction. You can choose the correct function
    for the level at which you are working, and by doing so you are offering the compiler
    neither more nor less than what it needs to know about the task at hand to generate
    optimal code.


    # Summary


    Optimization is something that the compiler is best placed to do. You may have
    an idea about the sort of code that will be generated from your source, but it
    is the com-piler that will actually do the job. Signaling your intentions to the
    compiler, as fully and precisely as possible, is the key to getting the most out
    of it.


    Focus on designing your interfaces for composition. As you develop a function,
    ask yourself if the parts that make it up could be expressed as individual functions
    that may have some subsidiary use. Hand optimization is not the only way to improve
    your code and is most likely premature optimization. Careful composition of func-tions
    and correct generalization will support superior optimization opportunities.


    Everything has a cost. You may be aware of how many nanoseconds a CPU instruction
    takes, how many microseconds a thread context switch takes, how many milliseconds
    it takes to send a 1KB buffer halfway around the world, and so on. Comparison
    between magnitudes will serve you better than comparison across mag-nitudes. Leave
    the intra-magnitude work to the compiler.'
