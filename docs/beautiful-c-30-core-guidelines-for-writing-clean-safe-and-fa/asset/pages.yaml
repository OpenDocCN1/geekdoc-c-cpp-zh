    # Abstraction


    The purpose of language is abstraction. So, what is it that we are actually doing
    when we abstract with the C++ programming language?


    We are turning chunks of memory, containing numbers, into representations of things
    that inhabit our problem domain. This is one of the core strengths of C++, as
    well as one of its primary motivations.


    A house can be represented as a collection of numbers. They might include the
    dimensions of the plot of land on which it is situated; the height; the size of
    the floor space; the quantity of floors, rooms, and windows; and the quantity
    of attics. This last item is likely to be zero or one, unless your house is particularly
    grand.


    This abstraction is implemented as a series of numbers, or fields, arranged into
    a record. The record dictates the order in which the fields are arranged, which
    means that if you have a set of records stored consecutively in memory, then you
    can trivi-ally navigate to any record from the first record, and any field within
    that record, with some simple arithmetic.


    In the early days of computing, a lot of time was spent wrangling these collec-tions
    of records, or tables. Simple data processing would involve either collecting
    some data and making some records or reading some records and producing more data.
    These were happy, simple days.


    If you are at all familiar with C++, you will recognize the struct as a record,
    mem-ber data as fields, and tables as arrays of structs. For simple data processing,
    it seems sensible to read and write directly to the records.'
