    # <system_error>


    The second C++ standard, C++11, introduced `std::error_code` and `std::error_condition`
    which can be found in the `<system_error>` header. This is an error-signaling
    mechanism that provides a way of standardizing error reporting from the operating
    system or from low-level interfaces in the case of unhosted systems. Not only
    does it include an error code, but it also includes a pointer to an error category.
    This innovation allows programmers to create new families of errors by deriving
    from the `error_category` base class.


    This solves the problem of making errors look more like one another. A large col-lection
    of error codes are defined in an enumeration called `errc` which are imported
    from POSIX and given more comprehensible names. For example, ENOENT is trans-lated
    to `no_such_file_or_directory`. Predefined error categories include `generic_category`,
    `system_category`, `iostream_category`, and `future_category`.


    Unfortunately, this is merely an upgrade to `errno`. It is still an object that
    needs to be returned to the caller somehow. It doesn’t persist in global state
    or propagate through the stack unless you throw it as an exception, so while it
    gives you a good way to stop using `errno`, it still leaves you with many of the
    problems inherent to error handling.


    What to do.'
