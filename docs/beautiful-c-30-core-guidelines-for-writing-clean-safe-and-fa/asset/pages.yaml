    Click here to view code image


    ```

    std::uint32_t Ramanujan_u =

    0b0000''0000''0000''0000''0000''0110''1100''0001;

    ```


    As you can see, it is identical. However, consider the bit pattern for 1,729 as
    a float:


    Click here to view code image


