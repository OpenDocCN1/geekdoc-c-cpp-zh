  md: '# Chapter 1.6


    # NR.2: Don’t insist to have only a single return-statement in a function


    # Rules evolve


    It astonishes me that, 20 percent of the way through the 21st century, people
    still argue about this. This section of the Core Guidelines is called “Non-rules
    and myths.” The remarkably prevalent advice that there should be only one return
    state-ment in a function falls right into this category.


    Mandating a single return statement is an old, old rule. It is easy to forget
    the advances that have been made in programming. I bought my first computer, or
    rather, my parents did, back in 1981. It was a Sinclair ZX81, powered by an NEC
    Z80 CPU running at 3.25MHz. The operating system, supplied on 8KB of read-only
    memory (ROM), included a BASIC interpreter which enabled me to write simple programs
    in the meager 1KB of RAM.


    Of course, I was 14 years old and I wanted to write games, and I discovered that
    the best way to do that was to bypass the BASIC interpreter entirely and write
    in native Z80 assembly language. With the help of *Mastering Machine Code on Your
    ZX81* by Toni Baker,¹ the astounding *Programming the Z80* by Rodnay Zaks,² and
    an assembler, I was able to write and sell my first games to my friends at school.


    1. Baker, T, 1982. *Mastering Machine Code on Your ZX81*. Reston, VA: Reston Publishing
    Company, Inc.


    2. Zaks, R, 1979. *Programming the Z80*. Berkeley, CA: Sybex.


    I found it much harder to write things in Z80 assembly language than I did in
    BASIC. Particularly, BASIC had line numbers and the concept of subroutines. I
    could branch by executing GOTO, or I could branch by'
