    Consider what the “3%” figure means: that is three lines of code in each one hun-dred.
    How long are your functions? There is a good chance that your short five-line
    functions are in good order, but it is the longer functions that benefit from
    closer inspection. The best optimizations you can make are those that improve
    the clarity of what you are doing and maximize the information you give to the
    compiler, such as swapping your hand-rolled loops for existing algorithms.


    Returning to the sort example, one difference between qsort and std::ranges::sort
    is the return type. Rather than returning void as qsort does, std::ranges::sort
    returns an iterator equal to the end of the range. It is not necessary, but it
    is useful in some cases. One way of designing to enable optimization is to provide
    a family of functions with different amounts of information being returned, all
    imple-mented using the same fundamental algorithm.


    The standard algorithms support this. The function std::is_sorted takes a range
    and a comparison function, and returns a bool telling you whether or not the ele-ments
    are sorted. std::is_sorted_until returns the iterator at which point a range stops
    being sorted. std::is_sorted could be implemented as a call to std::is_sorted_until
    and a check on whether the return value is the end of the range.


    Similarly, std::mismatch compares two ranges, searching for the first correspond-ing
    pair of elements that don’t satisfy a predicate. std::equal is a specialization
    of this: the predicate is the equality operator, and if std::mismatch returns
    the end of the range, then the ranges are equal.'
