    # Variation in fundamental types


    Operating system implementation is not the only kind of system variation. As you
    may know, the width of arithmetic types like int and char is not standardized.
    You might think an int is 32 bits wide, but I remember a time when an int was
    16 bits wide. At times I needed a type that was exactly 32 bits wide, and, fearful
    of making the mistake of assuming int would always be 32 bits wide (it had changed
    once, why not again?), I used the implementation headers to discover which type
    was that wide, and created an alias to that type:


    Click here to view code image


    ```

    typedef __int i32; // older way of doing this: do not use now

    ```


    I introduced an identifier called i32 that was an alias of the platform’s definition
    of a type named __int. I was entirely safe if the project was ported to another
    platform: I could find out how the target platform defined a 32-bit signed integral
    type and sim-ply update the typedef definition for that platform as required.


    Of course, when the next standard was released, in this case C++11, new types
    were introduced to the library in header <cstdint> that defined fixed-width integral
    types. I was able to update the definition in two attractive ways:


    ```

    using i32 = std::int32_t;

    ```


    First, I was able to use the new type to future-proof my definition: the type
    being ali-ased is part of the standard and is extremely unlikely to change, because
    backward compatibility is so important to the language. This'
