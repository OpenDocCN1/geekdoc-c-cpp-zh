  md: 'in the first section, have the side effect of reducing class scope size. In
    the case of C.45, one fewer function implies smaller scope because the class definition
    is smaller and there is one fewer member function definition, which is also part
    of the scope of the class. In the case of C.131, the same reasoning applies: fewer
    member functions imply smaller scope.


    Core Guideline C.4: “Make a function a member only if it needs direct access to
    the representation of a class” reduces scope by replacing member functions with
    nonmember nonfriend functions where possible. These functions may be declared
    near the class, but they do not need to be declared in the scope of the class.
    Of course, this increases the size of the namespace scope, but any declaration
    is going to have an impact on a scope somewhere.


    Simply refusing to grow the interface of a class beyond a certain size will keep
    class scopes small. You might decide that, whenever a public interface exceeds
    10 functions, it is time to examine the abstraction and see if there are two more
    inside, ready to be realized. Perhaps the class invariants can be partitioned
    into two, and a more refined pair of abstractions can be drawn out.


    The same approach can be taken to shrinking The Blob. Checking the invariants
    (and often, a class will start off with a handful of invariants whose quantity
    grows slowly over time), gathering them, and partitioning them will highlight
    the set of abstractions that model the broad collection of concepts contained
    therein.


    We hope that this overlap of guidelines is making it apparent that following the
