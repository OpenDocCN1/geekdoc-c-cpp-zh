- pgno: 13
  md: '# # Non‐destructive Porosity Measurements of Thermal Barrier Coatings using
    Terahertz FMCW Reflectometry


    Christian J. Brandtén1, 2, Adrian Dathe1, 3, Simonas Krotkus1, 3, Mirco Panzner1,
    3, Hans-Michael Stübling4, 5, Martin Bastian4, 5, and Martin Koch4, 5


    1 Fraunhofer Institute for Material and Beam Technology IWS, Dresden, Germany


    2 Institute of Materials Science, Technical University Dresden, Dresden, Germany


    3 Fraunhofer Institute for Ceramic Technologies and Systems IKTS, Dresden, Germany


    4 Department of Physics, Philipps-Universität Marburg, Marburg, Germany


    5 Institute of Nanostructure Technologies and Analytics, University of Kassel,
    Kassel, Germany


    # ## Abstract


    Thermal barrier coatings (TBCs) are widely used in gas turbine engines to protect
    metallic components from high temperatures. The porosity of TBCs is a critical
    parameter affecting their thermal insulation performance and lifetime. This paper
    presents a non-destructive approach for measuring the porosity of TBCs using terahertz
    frequency-modulated continuous-wave (FMCW) reflectometry. The method is based
    on the correlation between the effective refractive index of the coating and its
    porosity. Terahertz FMCW reflectometry provides depth-resolved information, allowing
    the measurement of the refractive index and thickness of the TBC. The porosity
    of the TBC is then determined from the effective refractive index using effective
    medium approximations. The proposed method was validated on plasma-sprayed YSZ
    coatings with varying porosity levels. The results show that terahertz FMCW reflectometry
    can accurately measure the porosity of TBCs in a non-destructive and non-contact
    manner. The method has the potential to be used for quality control and lifetime
    assessment of TBCs in industrial applications.


    **Keywords:** Terahertz, FMCW, thermal barrier coating, porosity, non-destructive
    testing'
