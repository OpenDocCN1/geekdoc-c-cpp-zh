- pgno: 243
  md: 'However, SAL does not eliminate the burden of maintaining documentation. It
    may enable superior reporting of errors and abuse, but it merely moves the problem
    of parameter description elsewhere. This problem was inherited from C, and while
    SAL is useful for decorating C functions, there are additional ways in C++ to
    make your function signatures more expressive that involve the use of the language
    itself. This has the advantage of being closer to the goal of self-documenting
    code.


    # Now you can return an object


    A useful thing you can do is return an instance of a struct or class. All the
    values calculated by your function can be bundled together into a single entity
    and handed back to the caller, rather than scattering output parameters through
    your function signature. Being able to return an object is a great bonus to clarity,
    enabled by the introduction of copy and move constructors. However, this feature
    has had a check-ered history.


    When I first started using C++, I despaired at the cost of returning objects by
    value. I would typically see a copy constructor being invoked to return the object
    and then an assignment operator being invoked to assign the result of the call.
    During the years prior to standardization, different compilers would optimize
    this in different, unreliable ways.


    One easy optimization was to pass an output parameter to the function so that
    rather than this:


    Click here to view code image


    ```

    BigObj create_big_obj(); // Function prototype

    BigObj big_obj = create_big_obj();

    ```


    you would do this:


    Click here to view code image


    ```

    void create_big_obj(BigObj&); // Function prototype

    ```'
