  md: '# Raising the level of abstraction


    My favorite part of engineering is eliminating code. Fewer lines of code lead
    to a smaller cognitive burden and easier apprehension of the codebase. The aim
    of the engineer should be to express the solution domain as simply and easily
    as possible. Paying engineers “by the line” is a surefire way to destroy your
    project.


    Consider the difference between the input and output of a compiler. You will typi-cally
    pass in a translation unit with hundreds of lines of code and be presented with
    thousands of assembly instructions wrapped up in an object file. Those assembly
    instructions each trigger activity of greater complexity on the CPU. The assembly
    is more complex, more detailed than the C++ source code. The CPU activity is yet
    more complex than the assembly instructions. The entire effort of software engineer-ing
    and language design is the reduction of complexity and detail.


    When I was learning my trade in the 1980s, I was presented with the concept of
    high-level languages like Sinclair BASIC and BBC BASIC, and then low-level lan-guages
    like Z80 assembly and 6502 assembly. The level in question is the level of abstraction.
    The distance between BASIC and assembly is significant. When I first started learning
    C, having absorbed BASIC and assembly, it was presented as a low-level language,
    although not as low level as assembly. I treated it like an assembly macro programming
    language. I could see which assembly instructions would be generated by which
    C constructs. I had the immediacy of assembly available to me, with the naming
    clarity of BASIC. I could name variables, like in BASIC, but I could easily infer
    how much memory they would take up. I could create control loop struc-tures without
    having to fiddle about with the correct flag testing to decide whether to jump
    back or continue.


    > *Fewer lines of code lead to a smaller cognitive burden and easier apprehension
    of the codebase. The aim of the engineer should be to express the solution domain
    as simply and easily as possible. Paying engineers “by the line” is a surefire
    way to destroy your project.*'
