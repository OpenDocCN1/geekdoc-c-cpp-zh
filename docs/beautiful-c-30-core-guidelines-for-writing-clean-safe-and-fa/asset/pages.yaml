  md: "them. This made returning objects a much more attractive proposition because\
    \ the move constructor would be invoked to return something, so even if elision\
    \ didn’t take place, at least the cost could be reduced and copying containers\
    \ would be cheap.\n\nHeroic efforts have been made to update the standard so that\
    \ returning objects is as cheap as possible as often as possible. Since C++17,\
    \ compilers are required to omit the copy and move construction of class objects,\
    \ even if that means omitting observable side effects, in a return statement when\
    \ the object being returned is a prvalue of the same type as the function return\
    \ type. Before C++17 this was existing practice in most compilers, but standardizing\
    \ this practice reassures the user.\n\nThis means that RVO is a safe bet, and\
    \ you should always make heroic efforts to ensure that you return objects from\
    \ a function as a constructor invocation, as in the RVO example above. You may\
    \ have also seen return invoked with an initialization list:\n\nClick here to\
    \ view code image\n\n```\n```cpp\nstd::pair<int, int> f(int a, int b) {\n    return\
    \ {a + b, a * b};\n}\n```\n```\n\nThis is also a prvalue and will enable the compiler\
    \ to generate RVO-flavored code. NRVO is not required, since the object has no\
    \ name. This requirement is not attached to optimizations or compiler flags: this\
    \ will Just Happen, due to fundamental changes in C++17 to the specification of\
