  md: 'To explain levels of abstraction, consider the seven-layer OSI model.² This
    model partitions a communication system into abstraction layers. Each layer exposes
    an interface to the next layer, but not to the previous layer. Engineers work
    in the layer that fits their specialty. For example, I am a software engineer
    rather than an elec-tronics engineer. I would feel very uncomfortable working
    in layer 1, the physical layer, and much happier working in layer 7, the application
    layer. You may have heard the term “full-stack engineer.” This engineer is comfortable
    in all the layers. They are mythical creatures.


    2. https://en.wikipedia.org/wiki/OSI_model


    The levels of abstraction in the parsing problem can be described thus:


    +   1. The streaming layer, which delivers a stream of data to...

    +   2. The parsing layer, which delivers individual symbols to...

    +   3. The dictionary layer, which matches symbols to tokens and delivers them
    to...

    +   4. The token layer, which validates input and updates values


    These abstractions are all distinct, nonoverlapping parts of the problem.


    # Abstraction by refactoring and drawing the line


    The key to abstraction is knowing where to draw the line that separates the different
    layers. As we remarked earlier, it is an art, not a science, but there are three
    things you can look for. First, excessive detail. Does the code spend time carrying
    out tasks that seem sin-gularly unrelated to the task at hand? The Core Guideline
    for this chapter uses a busy for loop involving reading a file, validating, and
    performing reallocation as an exam-ple: there is too much going on in there. One
    can also consider designing baroque data structures especially for local use.
    Is this data structure of any use outside of this context? Will it ever be? If
    the answer is yes, take this data structure and move it from the code under examination
    to a more generic library. Separating detail into'
