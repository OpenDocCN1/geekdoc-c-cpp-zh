    \ of type `double`, known as floating-point promotion.\n\nConversions differ from\
    \ promotions in that they may change the value, which may cost precision. For\
    \ example, a floating-point value can be converted to an integer, rounding to\
    \ the nearest integer value. Also, integral and floating-point values, unscoped\
