    # Summary


    Default constructors should be an active choice. Not all classes have meaningful
    default values. Member data initialization can happen in three places: the constructor
    function body, the constructor initialization list, and at the point of declaration
    of the member data, known as default member initializers.


    Default member initializers define a default value at the point of declaration.
    If there is a member that cannot be defined in such a way, it suggests that there
    may be no legal mechanism by which a default constructor can be defined. This
    is fine. As remarked earlier, there is no necessity for default constructors.


    Constructors provide a variation from the default. Providing default member initializers
    gives each variation increased specificity. This is a bonus for the client as
    they have fewer things to worry about regarding the state of the object: it can
    be more closely tailored to their requirements.'
