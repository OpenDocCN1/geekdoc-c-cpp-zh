    The first four clauses that make up the front matter tell you how the document
    is structured, what the conventions are, what “undefined behavior” means, what
    an “ill-formed program” is: in fact, the entire frame of reference is described
    here. In the General principles clause, in particular in section [intro.abstract],⁷
    you will find the following text:


    7. https://eel.is/c++draft/intro.abstract


    > “The semantic descriptions in this document define a parameterized nondeterministic
    abstract machine. This document places no requirement on the structure of conforming
    implementations. In particular, they need not copy or emulate the structure of
    the abstract machine. Rather, conforming implementations are required to emulate
    (only) the observable behavior of the abstract machine as explained below.”


    A footnote is attached to this paragraph, which says:


    > “This provision is sometimes called the “as-if” rule, because an implementation
    is free to disregard any requirement of this document as long as the result is
    as if the requirement had been obeyed, as far as can be determined from the observable
    behavior of the program. For instance, an actual implementation need not evaluate
    part of an expression if it can deduce that its value is not used and that no
    side effects affecting the observable behavior of the program are produced.”


    This is a marvelous get-out clause (more correctly, get-out paragraph). All that
    an implementation must do is emulate the observable behavior. This means it can
    look at your code, examine the result of its execution, and do whatever is necessary
    to match that result. This is how optimization works: by looking at a result and
    substituting the optimal set of instructions required for achieving it.


