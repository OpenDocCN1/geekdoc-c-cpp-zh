- pgno: 36
  md: '# Chapter 1.2


    # F.51: Where there is a choice, prefer default arguments over overloading


    # Introduction


    API design is a valuable skill. As you decompose a problem into its constituent
    abstractions, you need to identify the abstractions and design an interface for
    them, giving the client clear and unambiguous usage instructions in the form of
    a completely obvious set of carefully named functions. There is a saying that
    code should be self-documenting. While this is a lofty ambition, it is in API
    design that you should try hardest to meet this goal.


    Codebases grow. They just do. There is no getting away from it. Time passes, more
    abstractions are discovered and encoded, more problems are solved, and the problem
    domain itself expands to accommodate more use cases. This is fine and perfectly
    normal. It is part of the usual operation of development and engineering.


    As these extra abstractions are added to the codebase, the problem of unambiguously
    naming things rears its ugly head. Naming is hard. That phrase will come up a
    lot in your programming career. Sometimes you want to let the client, which is
    often yourself, do the same thing but in a slightly different way.


    This is where overloading may seem like a good idea. The difference between two
    abstractions may simply be the arguments that are passed to them; in all other
    respects they are semantically identical. Function overloading allows you to reuse
    a function name with a different set of parameters. But if they are indeed semantically
    identical, can you express that difference in terms of a default argument? If
    so, your API will be simpler to understand.'
  merge: -1
  img_proc: true
