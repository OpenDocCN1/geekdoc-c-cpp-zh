- pgno: 321
  md: 'As you implement your solution and find abstractions, you can describe them
    not just in terms of types and functions, but types and behaviors. The beauty
    of concepts is that they allow you to build a taxonomy for your solution domain.
    Just as you aren’t limited by types defined by the standard, nor are you limited
    to the concepts defined by the standard. You can define your own concepts, just
    as you can define your own types, and use them to clarify the design of your library,
    conveying its full meaning and utility. The process of breaking down your solution
    domain into manageable pieces, of finding the factors, is greatly aided by having
    a mechanism by which you can identify behaviors as well as types.


    The only thing harder than naming is taxonomy, which is finding the names of names.
    Concepts allow you to bring identifiers for the behaviors of your solution domain
    to the surface. Of course, you don’t need to go mad and identify everything, nor
    should you. Concepts constrain template parameters, so unless your program consisted
    entirely of function templates you would not be able to make use of them all.
    This is reminiscent of the argument against object-oriented programming that speaks
    about modeling every last detail. However, for optimal clarity, specify con-straints
    in the form of concepts for all your template arguments.


    # Summary


    Whenever I start teaching about C++, one of the first things I say is that there
    are two things to worry about: state and execution. Behind all the syntactic noise
    of class declarations and access levels and function template specializations
    and const quali-fication, C++ source files define objects and functions. Linkers
    link objects and func-tions into a single binary. Operating systems bind together
    files and processes. CS courses teach you data structures and algorithms. Now
    there is another pairing to think about: types and concepts.


    As you write function templates, examine what you are doing with your param-eters
    and abstract your constraints from them. Identify the requirements and reuse a
    concept, or form a new one, to describe them at the point at which you take the
    argument.'
