    # std::enable_if => requires


    Let’s look at another popular technique.


    When C++98 emerged, one of the first things I did was look at the interactions
    of the containers with the algorithms. At the time, I was working for a game com-pany
    in London and trying to persuade some of the engineers that C++ was the way to
    go (I was possibly a little premature). I demonstrated tiny functions that would
    search and sort their way through our collections of stuff. The big problem, though,
    was std::vector. Whenever its capacity was exceeded and a resize was triggered,
    it would copy the contents, one by one, to the new location using a for loop,
    and then it would destroy the prior versions. Of course it did: the standard required
    the con-tents be copy constructed to their new location and then their destructors
    invoked. In the majority of situations,'
