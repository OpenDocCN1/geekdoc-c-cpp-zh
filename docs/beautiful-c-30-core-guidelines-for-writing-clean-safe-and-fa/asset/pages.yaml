  md: 'Unfortunately, occasionally it can be unwise to rely on the best efforts of
    your col-leagues and the safest approach is to seek clarification.


    # Summary


    Prefer class (scoped) enumerations over “plain” (unscoped) enumerations to benefit
    from a reliable default underlying type and to enable disambiguation of symbols.


    Simply adding the keyword class to all your enum declarations is cheap and improves
    safety by disallowing implicit conversion, while enabling you to improve readability
    by removing “decoration” from enumerators that was only added to make them unique.


    # Postscript


    Back in the last decade I arranged for some C++ training for my team to be given
    by Scott Meyers. This was a pretty big deal for us, and he truly delivered. One
    of the things that sticks in my mind was that it was the first time I heard someone
    say enum differently to me. I am English, and I’ve only ever heard this word pronounced
    to rhyme with “bee-come.” He rhymed it with “resume,” as if he were beginning
    to say “enumeration” but lost interest after the second syllable.'
