  md: 'you. It stands for appli-cation binary interface. Just as an API, an application
    programming interface, is a guide to humans about what you can do with a library,
    so is an ABI a guide to machines about how libraries interact. Think of it as
    the compiled version of an API.


    An ABI defines several things: not just how objects are laid out in the standard
    library, but also how things are passed to functions. For example, the System
    V AMD64 ABI¹ specifies that the first six integer or pointer arguments are passed
    in registers RDI, RSI, RDX, RCX, R8, and R9. This ABI is followed by Unix and
    Unix-like operating systems. Other considerations include how exceptions are handled
    and propagated, function prolog and epilog code, the virtual table layout, virtual
    function calling conventions, and so on.


    1. https://wiki.osdev.org/System_V_ABI


    > *A library that does not use types from another library in the signatures of
    its functions cannot suffer an ABI break if that library changes. Eventually,
    all libraries change, and this is a rather problematic fact of development.*


    The need for an ABI is one of the rea-sons why code compiled for one operating
    system will not work with another operat-ing system: although they might have
    the same processor architecture, for exam-ple x86, they may have different ABIs.
    Of course, if there were one unifying ABI this would not matter, but ABIs are
    intimately bound up with the performance character-istics of the hardware. Pinning
    everything to one ABI would come at a performance cost. A library that does not
    use types from another library in the signatures of its functions cannot suffer
    an ABI break if that library changes. Eventually, all libraries change, and this
    is a rather problematic fact of development.


    It is therefore important to keep your ABI stable. Changing a function in any
    way, the return type or the types, the quantity and order of arguments, or the
    noexcept specification, is an ABI break. It is also an API change. Changing definitions
    of data types or data structures in the private interface is not an API change
    but it IS an ABI break.'
