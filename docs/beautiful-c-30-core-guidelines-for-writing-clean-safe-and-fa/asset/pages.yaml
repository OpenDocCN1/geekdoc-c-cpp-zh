    # P.11: Encapsulate messy constructs, rather than spreading through the code


    In the course of this chapter we’ll learn about encapsulation, and also about
    the closely related concepts of information hiding and abstraction. These three
    are often used interchangeably, usually at the cost of clarity. Before we start,
    we want to set the scene by building a parser. We will return to these three concepts
    in a moment.


    # All in one gulp


    One of the qualities that marks out a great engineer is the ability to notice
    when things start to get out of hand. We are all excellent at spotting when things
    have got completely out of hand: who has not started a code review with the phrase,
    “There’s quite a lot going on here and I found it hard to follow.” Sadly, that
    skill rarely stretches to anticipating the bloom of messy code.


    Let’s walk through an example. Early in the execution of my program, I want to
    read in some options from an external file identified on the command line. They
    are declared as key-value pairs. There are only a dozen possible options, but
    being a smart engineer, I decide to create a separate function for doing this.
    I am going to call it parse_options_file. It will take a filename which I will
    pull out of the command line. If none is declared, I will not call the function.
    This leads me to the function signature:


    Click here to view code image


    ```

    void parse_options_file(const char*);

    ```'
