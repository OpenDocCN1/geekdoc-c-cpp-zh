  md: '```

    void* realloc(void* p, size_t new_size);

    ```


    It does a number of things. Principally, it resizes the memory pointed to by p.
    More precisely, it will grow or contract the raw memory block pointed to by p
    to new_size bytes, allocating a new block if it can’t grow the existing block,
    and then copying the contents of the old memory block to the new memory block.
    This copy ignores the semantics of copy construction and simply copies the bytes,
    which is why a well-behaved C++ programmer is unlikely to encounter it.


    If you pass zero to the new_size parameter, the behavior is implementation defined.
    You might think that it would simply free the block entirely, but that is not
    necessarily the case.


    The function returns the address of the new block of memory, or the address of
    the expanded block of memory. If a bigger block is requested and there is not
    enough memory to allocate this new block, the return value is the null pointer.


    There are two things going on here. The memory is resized, and the contents may
    be moved. Different levels of abstraction are being mixed up, and the second action
    is conditional on the first failing. If I were to offer this functionality from
    scratch, I would offer a single function, called resize, like this:


    Click here to view code image


    ```

    bool resize(void* p, size_t new_size);

    ```


    This would simply attempt to grow or shrink the block. If it failed, I could then
    allocate a new block myself and move everything over. There would be no need for
    implementation-defined behavior. I would be respecting levels of abstraction by
    sep-arating reallocation from moving stuff around.


    The principle of “one function, one responsibility” is related to cohesion. In
