  md: '# # About the Authors


    **J. Guy Davidson** was first introduced to computing by way of the Acorn Atom
    in 1980. He spent most of his teenage years writing games on a variety of home
    computers: the Sinclair Research ZX81 and ZX Spectrum, as well as the Atari ST.
    After taking a mathematics degree from Sussex University, dabbling with theater,
    and playing keyboards in a soul band, he settled on writing presentation applications
    in the early 1990s and moved to the games industry in 1997 when he started working
    for Codemasters in their London office.


    In 1999 he joined Creative Assembly where he is now the head of engineering practice.
    He works on the *Total War* franchise, curating the back catalogue, as well as
    working on the standard of programming among the engineering team. He serves on
    the IGGI advisory board, the BSI C++ panel, and the ISO C++ committee. He is the
    standards officer of the ACCU committee and serves on the program committee of
    the ACCU conference. He is a moderator on the #include<C++> discord server. He
    serves as code of conduct lead for several organizations. He can be found speaking
    at C++ conferences and meetups, particularly about adding linear algebra to the
    standard library.


    In his bountiful spare time he offers C++ mentoring support through Prospela and
    BAME in Games; addresses schools, colleges, and universities through UKIE, STEMNet,
    and as a Video Game Ambassador; practices and teaches wu-style tai chi; studies
    the piano; sings first bass for the Brighton Festival Chorus; runs a local film
    club; is a voting member of BAFTA; has stood twice (unsuccessfully) for election
    to local council on behalf of The Green Party of England and Wales; and is trying
    to learn Spanish. You may occasionally find him at the card table playing bridge
    for a penny a point. There are probably other things he is not one for letting
    the grass grow under his feet.


    **Kate Gregory** met programming, some of her dearest friends, and the man she
    married all at the University of Waterloo in 1977 and has never looked'
