    car. I have additional sunglasses for when I am not in the car. Driving into the
    sun without sunglasses is enough of a danger for me to avoid it where possible.
    This means the sunglasses are in one of two places: on my face, or in the special
    pocket I have for them in the car door. I have habituated myself to simply check
    that they are where they should be when I open the car door. I really do not need
    to think about it.


    My car is sadly not an electric vehicle. I hope it will be my last gas-guzzler.
    When I start a journey, I must decide whether I have enough fuel for the journey.
    The manu-facturers have gone to some lengths to make this as simple as possible.
    There is a fuel gauge on the dashboard, with an estimated range telling me how
    far I can go before I need to refuel. There is a safety margin built in, so in
    the normal case I do not run out of fuel because I can do the arithmetic required.
    Sometimes things have gone wrong, though. There are long stretches of road in
    the UK where there are no filling stations, for example across moors. Getting
    stuck in a traffic jam in that sort of situation can be a tense occasion for everyone
    in the car if I have allowed the fuel tank to drain a little too far.


    It is much easier for me to think about my sunglasses than it is to think about
