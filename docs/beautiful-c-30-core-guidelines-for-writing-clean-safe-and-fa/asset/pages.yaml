- pgno: 373
  md: 'space. There was no optimizing just for speed: a fixed amount of RAM meant
    that loop unrolling was robbing Peter to pay Paul. Similarly, optimizing just
    for size would mean increasing the amount of time it took to display a frame.


    Frequent tricks included hand-specified inlining. Once a function had been writ-ten
    and debugged, you could decide yourself whether to make the function call or to
    insert the code into the call site instead. Armed with the knowledge of how long
    each instruction would take to execute, and how much RAM this substitution would
    cost, this could be a very precise way of finding speed gains.


    This substitution differs from loop unrolling. With unrolling, the body of the
    loop is duplicated one or more times to reduce the number of jumps back to the
    start of the loop. This carries costs in space of course. However, substituting
    a function body for a function call could sometimes save space, since the effort
    required to call a function in terms of preserving registers could be eliminated
    by simply duplicating the function.


    Stack manipulation was a particular favorite. When the processor encounters a
    call instruction rather than a jump instruction, it stores the program counter
    on the stack and changes the program counter to the call operand. When the processor
    encounters a return instruction, it pops the stack contents into the program coun-ter.
    While this perfectly supports the idea of single point of entry, single point
    of return, it can be beautifully subverted to create jump tables. If you know
    a selection of functions must execute in a particular order, you could push their
    addresses onto the stack in reverse order of desired execution and then return.
    Each function would execute, and “return” to the next function in the stack. It
    was a valuable space saver, but fiendishly hard to debug and completely nonportable.


    I found optimization to be the funnest part of making games. You could chip away
    at it until you decided that you had simply reached the end of the line, and you
    would declare your function optimal. Optimization relied upon a deep and intimate
    knowl-edge of the platform. When I was working with the Z80 processor I had to
    know that the register-loading instructions lay between 0x40 and 0x7f, and that
    the conditional return instructions started 0xc, 0xd, 0xe, or 0xf and ended 0x0
    or 0x8, and that the xor instructions ran from 0xA8 to 0xAF, in the order b, c,
    d, e, h, l, (hl), a.'
