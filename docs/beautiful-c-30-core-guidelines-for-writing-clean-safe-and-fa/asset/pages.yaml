- pgno: 216
  md: 'The thread ownership problem is simple enough: in today’s multithreaded world,
    a global error object would need to contain thread information about which thread
    signaled the error. You might try using an object with thread-local storage duration,
    but that would mean that errors relevant beyond a particular thread would be hidden.
    Alternatively, you could create a single object containing per-thread error informa-tion,
    which would require some careful synchronization. This is not insurmountable,
    but it demotes this approach down my ranking of preferred error-handling solutions.


    Of course, it wasn’t always like this, and legacy code will indeed contain refer-ences
    to an object called errno. This is part of the C standard and is simply an int.
    Since C++11 it is an object of thread-local storage duration; prior to that it
    was static. It is not necessarily a bad approach: if something goes wrong, you
    want to be able to invoke an error-handling function to deal with it. A single
    error code means that it doesn’t matter where the error happens, the error-handling
    function can iden-tify what went wrong. The error code can be divided up into
    groups of bits: some bits refer to the domain of the error, others refer to the
    nature of the error, and still other bits provide context.


    It is not without problems, though. What happens if another error occurs while
    you are navigating to your error code? Your error code can only hold the most
    recent error, which makes recovery a tricky proposal. Also, it simply doesn’t
    scale very well. All code needs to check the error status after a function call
    in case that function has signaled an error. Even if no error signaling is documented,
    that doesn’t mean that the function won’t change and start signaling errors. Finally,
    clients can and will ignore or forget about error codes, no matter how forcefully
    you exhort them not to do so in your documentation.


    This is rather reminiscent of “globals are bad, m’kay?” Since errno has no owner,
    there is no way of controlling how it is managed in the case of unusual circum-stances.
    What happens if there is an error in the error recovery? As the guideline remarks,
    global state is hard to manage.


    Unfortunately, as remarked above, errno is part of the standard, and some parts
    of the C Standard Library use errno to signal failure. For example, if you try
    and cal-culate the square root of a negative number by calling sqrt, errno will
    be set to EDOM.'
