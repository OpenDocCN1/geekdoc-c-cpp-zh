- pgno: 224
  md: 'The third paper under consideration proposes a new status_code and standard
    error object. This operates with zero-overhead deterministic exceptions. It offers
    some improvements over the <system_error> header, such as not including the <string>
    header, which brings with it a large quantity of additional machinery such as
    allocators and algorithms, greatly increasing build and link times.


    One aspect of error handling we have yet to mention is the use of the assert macro.
    This is a way of discovering instances of the second type of error described in
    the previous section. It highlights what the programmer is expecting to be the
    state of the abstract machine at a particular instant and directs the program
    to stop execution if that state turns out to be different. This is different from
    a broken abstract machine: this is the programmer getting things wrong.


    As a development of this idea, there is yet another proposal under consideration
    which very nearly made it into C++20. In fact, it got as far as the working draft
    before being pulled out at the last minute. We are talking about contracts. These
    define pre- and post-conditions in the language rather than as a library macro,
    by decorating the function definition with programmer-defined expectations.


    Unfortunately, this cornucopia of upgrades to the language and library is yet
    to be emptied into the C++ Standard working draft at time of writing. Today, in
    the community of C++ users, things have remained largely unchanged for many years.
    Programmers are still using old C-style error-handling strategies for want of
    a better option. The future looks bright, but it has yet to arrive.


    # Summary


    In summary:


    +   - Global state is a bad place to handle errors. Keep error state local and
    pay attention to it.

    +   - If you can throw and catch exceptions, do so.'
