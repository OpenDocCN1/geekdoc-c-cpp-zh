  md: '# Chapter 3.5


    # E.28: Avoid error handling based on global state (e.g. errno)


    # Error handling is hard


    There may be some people whose code never goes wrong and is perfect in every way
    at all times. Sadly, for us mere mortals, sometimes things do not go according
    to plan. This can be for a variety of reasons: the problem was incorrectly specified,
    or the range of input was exceeded, or the hardware has broken down. It is not
    usually acceptable for the program to simply shrug its metaphorical shoulders,
    mumble “meh,” and stop working, nor simply attempt to carry on to the best of
    its abilities. Programs are not people: they are machines, with moving parts and
    without con-science. They are supremely good at doing what they are told, although
    you may find this rather hard to believe at times.


    Error handling has a long, varied, and checkered history. The presence of the
    word “varied” should alert you to the fact that there are many ways of handling
    errors and a universally useful facility has yet to emerge.


    # C and errno


    This guideline is about avoiding signaling error in global state, so we’ll start
    there. Two problems should immediately spring to mind when we think of global
    state:


    +   1. Thread ownership

    +   2. Error reference'
