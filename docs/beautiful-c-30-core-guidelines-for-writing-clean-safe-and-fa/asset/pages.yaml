    # Wait, there’s more


    In the early 1990s, fresh from university, I became a Windows developer, working
    on Windows machines. I wrote a lot of multimedia software: I really wanted to
    write games, but I took what I could get. It was fun.


    One of the features of developer life back then was the sudden, unexpected freeze
    of your system. A badly written program would bring your session down, and if
    you couldn’t bring up the Task Manager and kill the offending process, the only
    option was to hit the reset button. Sadly, the environment I worked in meant that
    I was, in fact, rarely able to bring up the Task Manager in the case of a freeze.
    Although I quickly learned to save often, it was a quite maddening aspect of software
    development.


    I wrote presentations for workstation manufacturers (among other businesses) to
    assist their sales teams, and one day a Windows NT 3.51 workstation with two Intel
    Pentium processors turned up on my desk. I was used to servers with multiple processors,
    but not desktop machines. The transition was amazing. After a day or so of installing
    my development environment, I was up and running and the first thing I noticed
    was how often I was able to bring up the Task Manager and kill stalled processes.
    I could just do my work. It was an utter joy to develop on.


    Of course, being an inquisitive developer, the first thing I did was see if I
    could make use of both processors in a single program. I decided to write a decoder
    that would decompress backups from the network and write them to the local disk.
    One processor would read and write, the other would decompress.


    It took me less than an hour to stall my program entirely. I had no idea why.
    I was being super careful waiting for my buffers to fill before decompressing
    them: each one had its own lock, which was released when the buffer was filled.
    I spent ages trying to work out what was causing the problem. Maddeningly, if
    I single-stepped through the code, everything worked fine. Worse still, when I
    ran the code on other machines it also worked fine.'
