    ```


    The default is `signed`. This is a default that C++ got right.


    If you tried compiling this yourself, you will have almost certainly encountered
    a warning at line 5, noting that there is a signed/unsigned mismatch. You are
    perfectly entitled to write this code (it is not an error), but there may be trouble.
    This is why you should pay attention to all warnings and eliminate each one.


    > > If you are doing any arithmetic, including comparison, use a signed type.

    > > If you are using an unsigned type to get an extra bit of representation,

    > > you are using the wrong type and you should go wider or recognize that

    > > you are performing a very risky optimization.


    The problem is that if you try mixing signed and unsigned arithmetic, unwanted
    and entirely predictable things will happen. Your signed values will be promoted
    to unsigned values, and any comparison may yield the incorrect result. In larger
    codebases, one of your libraries may export unsigned results, and this will infect
    libraries that deal purely with signed values. Disaster looms.


    Even worse, some code shops obscure the use of `unsigned` by creating shorter
    aliases, for example:


    ```

    ```cpp

    using u32 = unsigned int;

    ```

    ```


    Sight of the keyword `unsigned` should be the equivalent of neon flashing lights
    telling you to apply the brakes and navigate the hazardous roads ahead with extreme
    care.


    There are more situations where `unsigned` is the correct choice. Core Guideline
    ES.101: “Use unsigned types for bit manipulation” highlights one of them. They
    are very limited, though:'
