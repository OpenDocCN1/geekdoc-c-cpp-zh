  md: 'This highlights the significance of the word “cross-compiler” in the guideline.
    Your library needs to work on your compiler today, but it also needs to work a
    year from now, and on the compiler used by your clients. If the compilers have
    different opinions on the size of an int or a pointer, then their behavior will
    differ in ways that you did not intend.


    The floating-point types are simpler than the integral types, since they are defined
    by reference to another standard, particularly ISO/IEC/IEEE 60559:2011, which
    is the same as IEEE 754-2008. This makes them utterly reliable between platforms.
    char can be signed, unsigned, or neither; all three are distinct types. unsigned
    char is used for dealing with raw memory.


    It is clear from this that changing data models is an ABI break: I first encoun-tered
    ABI breaks (although I didn’t understand the problem in this way) when I first
    installed Win32s on my Windows 3.11 machine in the early 1990s. Suddenly, all
    my ints took up twice as much memory and some of my programs fell over. More recently,
    the slight difference between LLP64 and LP64 (width of long) caused me pain writing
    for Windows and MacOS, the former using LLP64 and the latter using LP64.


    You may now relax, breathe out, and raise an eyebrow. The advice is “If you want
    a cross-compiler ABI, use a C-style subset” and yet we have just demonstrated
    how fragile the built-in types are. However, this fragility is only present when
    you are try-ing to move between data models. Also, there is a way to overcome
    the data model hazard and that is with the use of fixed-width integer types. These
    embed the width of the type in the identifier, and have names like int32_t and
    uint8_t. These are defined in C in the header <stdint.h> and in C++ in the header
    <cstdint>.


