    \ care-fully crafted function overloads differentiated by std::enable_if clauses\
    \ of varying verbosity. The committee was not blind to this problem, though, and\
    \ in C++17 a new facility was added to the language: the constexpr if statement.\n\
    \nThis beauty solved a few classes of problems that would historically have seen\
    \ you reaching for enable_if. It enables you to evaluate an expression at compile\
    \ time and choose execution based on the result. You can use it like this:\n\n\
    Click here to view code image\n\n```\nif constexpr(sizeof(int) == 4)\n{\n    //\
    \ ints are 32 bits wide.\n}\n```\n\nbut particularly you can use it where you\
    \ might have used enable_if, for example:\n\nClick here to view code image\n\n\
    ```\nif constexpr(std::is_move_constructible_v<T>)\n{\n    // the function template\
    \ is being specialized for\n    a move-constructible type\n}\n```\n\nRather than\
    \ having function template overloads for different types, you were now able to\
    \ express the difference in a single function. For example, the following pair\
    \ of overloads:\n\nClick here to view code image\n\n```\ntemplate <class T, typename\
    \ =\n    std::enable_if<std::is_move_constructible_v<T>\n>::type>\n```"
