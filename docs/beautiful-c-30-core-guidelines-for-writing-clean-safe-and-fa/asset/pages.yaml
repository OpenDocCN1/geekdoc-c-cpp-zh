    and so on.


    # The temptation and The Fall


    We must offer one final warning. It is very hard to turn back from this path once
    you start to walk it.


    Large codebases ideally consist of many libraries, each declaring their own namespace.
    It conveniently divides the solution domain; it is a useful abstraction technique.
    Each library will have a set of headers to expose its functionality through a
    well-designed API. If you decide to follow these declarations with a using-directive,
    clients of the code do not need to qualify any of the symbols. You may think you
    are doing them a favor by saving them extra typing.


    This may seem like a good idea, but as the codebase increases in size and the
    number of symbols starts to balloon, the chances of inadvertently creating overload
    sets increase. Eventually common sense will prevail, and you will have to remove
    all your using-directives. Suddenly your compilations will fail hard and heavy,
    as thousands of unknown symbols'
