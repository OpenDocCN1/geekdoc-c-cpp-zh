  md: 'stand-alone decla-ration with the same specifiers. For example:


    ```

    int a, b, c, d;

    ```


    Here we have four instances of an integer, named a, b, c, and d.


    # Backward compatibility


    Look at this:


    ```

    int* a, b, c, d;

    ```


    Of what type are these objects?


    We are hoping you spotted the trap and said that a is a pointer to an int, while
    b, c, and d are ints (this is one reason why you will often see pointers declared
    with the asterisk next to the identifier rather than the type). Of course, you
    spotted it because you were looking for trouble; historically I have uncovered
    compilation errors where the programmer has assumed that they are all pointers
    to int.


    This is legal, but not wise. It is an accident waiting to happen and it should
    be excised from the language. At least, that is what one of my colleagues said
    when I told him about this. Unfortunately, this is legal for reasons of backward
    compat-ibility. The C programming language permits this because it used to require
    you to declare all your objects at the top of the function. This told the compiler
    how much the stack should grow by and provided addresses for all the data at the
    point of entry to the function. It was a handy optimization. However, the wiser
    thing to do instead is to write declarations on separate lines, like this:


    ```

    int* a;

    int b;

    int c;

    int d;

    ```'
