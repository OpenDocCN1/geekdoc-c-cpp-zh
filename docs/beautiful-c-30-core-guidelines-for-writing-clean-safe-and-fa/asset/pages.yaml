    Repetition is a hint that there is an algorithm waiting to be uncovered, and a
    good algorithm is merely a concise description of what a piece of code does. In
    2013 Sean Parent gave a talk called C++ Seasoning.³ which spent much of the first
    half addressing the mantra “no raw loops.” His advice was to use an existing algorithm
    such as std::find_if, or implement a known algorithm as a function template and
    contribute it to an open source library, or devise a brand-new algorithm, write
    a paper about it, and become famous giving talks. This is excellent advice that
    will guide you on your way to eliminating messy code.


    3. https://www.youtube.com/watch?v=W2tWOdzgXHA


    # Summary


    Messy code stops the reader from understanding at a glance what is going on. Avoid
    this by:


    +   - Identifying patterns of existing code or existing algorithms, preferably
    as they happen, and lifting them out of the mess and abstracting them into their
    own function

    +   - Identifying the different levels of abstraction

    +   - Identifying how to encapsulate all these parts'
