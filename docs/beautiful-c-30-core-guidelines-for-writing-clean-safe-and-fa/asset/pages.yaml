- pgno: 258
  md: "Click here to view code image\n\n```\nenum US_state {\n    ...\n    MP, //\
    \ Great quiz question...\n    OH,\n    OK, // Uh-oh...\n    OR,\n    PA,\n   \
    \ ...\n};\n```\n\nSince the braces do not define a scope as normally expected,\
    \ OK is now an ambiguous identifier. If the enumerations themselves are defined\
    \ in unrelated scopes this is not a problem. Otherwise, we need to modify the\
    \ enumerators to disambiguate them. OK is obviously a hugely useful identifier,\
    \ so it cannot be allowed to exist unadorned. In the pre-C++11 world you would\
    \ come across enumerators like S_OK, R_OK, E_OK, and so on, leading to somewhat\
    \ illegible code. Indeed, using a single letter was a luxury afforded only to\
    \ the biggest players. In the above example you would be far more likely to use\
    \ DBE_OK or USS_OK. Once you had adorned one enumerator, you felt obliged to adorn\
    \ all the others, with the result that your code would become scat-tered with\
    \ TLAs and underbars prefixing all your enumerators.\n\nFortunately, although\
    \ ugly and inconvenient, this hindrance would manifest at compile time in the\
    \ form of a simple error, easily resolved by uglifying your collid-ing enumerators\
    \ a little bit more. The other, rather more insidious problem was that of implicit\
    \ conversion. Functions could cheerfully return an enumerator like OK, or more\
    \ likely DBE_OK, and that value could be freely converted to an int. The same\
    \ was true the other way around: a function could take an int but be passed an\
    \ enumerator. This leads to interesting bugs where you pass an enumerator from\
    \ one enumeration and it might be interpreted as an enumerator from another enumeration."
