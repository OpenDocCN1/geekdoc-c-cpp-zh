- pgno: 223
  md: 'That error code may be ignored entirely. The problem of ignoring return codes
    in the general case has been partially solved with the addition of the [[no_discard]]
    attribute, but this is only useful if you are exclusively using the return value
    for returning errors. Even then, the caller may store the return value and forget
    to consider it. Forcing users to check for errors is a bad idea anyway: it is
    for them to decide how to deal with fail-ure, not you.


    The trouble is that there are more ways for code to go wrong than to perform cor-rectly.
    Much like the human body, we can identify when it is in good working order, but
    identifying the myriad ways in which it can fail is a tall order.


    # Light at the end of the tunnel


    We mentioned that the Boost solutions have not been standardized and are only
    avail-able where use of Boost is permitted. The committee is considering several
    papers to improve matters. The first of these proposes std::expected<T, E>, which
    is a type that may contain a value of type T, or a value of type E, which represents
    the reason why a value of type T is not present. It is rather like a specialized
    version of std::variant. This was first proposed shortly after C++14 was finalized,
    so it has spent a long time being considered. You can check progress by examining
    paper P0323.4


    4. www.open-std.org/jtc1/sc22/wg21/docs/papers/2021/p0323r10.html


    Next, we have zero-overhead deterministic exceptions, which throw values rather
    than types. This paper addresses the divided C++ community by making exception
    handling much more palatable. Particularly, the values that are thrown are stack
    allo-cated and statically typed, which means no heap allocation is required and
    RTTL is not used. They are like a special return type. You can check progress
    by examining paper P0709.5 Note that Boost.Outcome is a partial, library-only
    implementation of this idea. Language changes will need to be made to fully implement
    it.


    5. www.open-std.org/jtc1/sc22/wg21/docs/papers/2019/p0709r4.pdf'
