  md: 'your source code. The second-ary benefit is that you will start to learn how
    the standard is specified, and how to implement library features. The tertiary
    benefit is that if you encounter any mistakes or ambiguities in the Technical
    Specification, you can pass this information back to the editors and enable them
    to make fixes before it gets adopted into the standard. Once something is in the
    standard, fixing it is quite hard. It is, of course, preferable to spot all errors
    ahead of time, prior to deployment.


    Finally, if you think this is a useful addition to the language, you should let
    the committee know and ask them to prioritize it for inclusion. Alternatively,
    if you think this is overengineered, overly elaborate, unnecessary, or not deserving
    of a place within the standard, you can also let the committee know by writing
    a paper presenting your arguments. The committee is made up of representatives
    from many nations and companies who volunteer their time to improve the C++ standard.
    They do what the rest of the world asks them to do, within the bounds of reasonable
    debate on desirability, feasibility, and achievement of consensus, to deliver
    the C++ standard that supports the needs of the C++ community. Be advised that
    progress can be glacial: getting agreement from over a hundred people from dozens
    of compa-nies, industries, and countries is a slow process.


    It is important to stress the voluntary nature of this work. There is no member-ship
    test, no private invitation, no secret handshake: participation is achieved simply
    by turning up to committee meetings and helping the process along. A code of con-duct
    moderates all behavior and keeps proceedings open and transparent.


    There are several routes to participation. In my case, as a UK resident, I contacted
    the British Standards Institute and requested details about joining the BSI C++
    panel. (In Canada, where Kate lives, it’s the Standards Council of Canada you
    con-tact. In the US it is INCITS.) Each country has its own name for its National
    Stand-ards Development Organization (SDO), as well as its own cost structure with
    some being free to participate and others charging a membership fee. You may be
    able to contact your own standards institute and make inquiries. Even if you don’t
    want to participate in full, you should be able to make your views known to your
    national body.


    Not every country in the world is represented in the C++ committee, but new countries
    are always welcome, and formal participation can be initiated and under-taken
    by anyone who is prepared to engage with their own nation’s standards body. Sometimes
    one person can simply bring a'
