  md: 'function, and these two phenomena will often appear together. But the question
    must be asked: was this optimization premature?


    During the 1990s, “premature optimization is the root of all evil” was a warning
    I heard very often. Usually, it was uttered when someone spent time hand-optimizing
    a function before the requirements had stabilized. The phrase itself is attributed
    to either Donald Knuth or Tony Hoare: one may have been quoting the other. Both
    are remarkable computer scientists; we would go so far as to say legendary, the
    giants on whose shoulders we stand. Hoare invented quicksort. Knuth invented TeX.
    We need to pay attention to what they say, but we also need to understand what
    they say, and know when the phrase is being misapplied.


    In “Structured Programming with go to Statements,” published in *Computing Surveys*,
    Volume 6, Number 4, December 1974, Donald Knuth writes:


    > “There is no doubt that the grail of efficiency leads to abuse. Programmers
    waste enormous amounts of time thinking about, or worrying about, the speed of
    noncrit-ical parts of their programs, and these attempts at efficiency actually
    have a strong negative impact when debugging and maintenance are considered. We
    should forget about small efficiencies, say about 97% of the time: premature optimization
    is the root of all evil.”


    > “Yet we should not pass up our opportunities in that critical 3%. A good pro-grammer
    will not be lulled into complacency by such reasoning, he will be wise to look
    carefully at the critical code; but only after that code has been identified.
    It is often a mistake to make a priori judgments about what parts of a program
    are really critical, since the universal experience of programmers who have been
    using meas-urement tools has been that their intuitive guesses fail. After working
    with such tools for seven years, I''ve become convinced that all compilers written
    from now on should be designed to provide all programmers with feedback indicating
    what parts of their programs are costing the most; indeed, this feedback should
    be supplied automati-cally unless it has been specifically turned off.”


    A common misapplication derives from the Pareto Principle, which suggests that
    80 percent of execution time will occur in 20 percent of the code. This being
    the case, the time to optimize is at the end of development, when that 20 percent
    can be identified. However, if that 20 percent is diffused throughout the source,
    then safe modification is going to be all but impossible. Additionally, as Knuth
    suggests, it is extremely hard to look at'
