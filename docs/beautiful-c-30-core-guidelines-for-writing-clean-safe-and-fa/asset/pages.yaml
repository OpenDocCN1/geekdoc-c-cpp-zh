    # P.4: Ideally, a program should be statically type safe


    # Type safety is a security feature of C++


    I rank type safety close to deterministic destruction among my favorite features
    of C++. Type safety tells different parts of your program what a bit pattern means.
    For example, here is the bit pattern for 1,729 as a 32-bit integer:


