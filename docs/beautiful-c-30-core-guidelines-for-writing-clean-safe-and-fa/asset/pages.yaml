    # What it means to encapsulate a messy construct


    We mentioned encapsulation, information hiding, and abstraction at the start of
    this item. As promised, we will take a look at these concepts now.


    Encapsulation is the process of enclosing one or more things into a single entity.
    Confusingly, that entity is called an encapsulation. C++ offers a number of encapsulation
    mechanisms. The class is the most obvious: take some data and some functions,
    wrap them up in a pair of braces, and put class (or struct) and an identifier
    at the front. Of course, there is also the enumeration: take a bunch of constants,
    wrap them up in a pair of braces, and put enum and an identifier at the front.
    Function definitions are a form of encapsulation: take a bunch of instructions,
    wrap them up in a pair of braces, and put an identifier and a pair of parentheses,
    optionally containing parameters, at the front.


    How about namespaces? Take a bunch of definitions and declarations, wrap them
    up in a pair of braces, and put namespace and an optional identifier on the outside.
    Source files work in a similar way: take a bunch of definitions and declarations,
    put them in a file, and save it to your file system with a name. Modules are the
    first new encapsulation mechanism in a long time. These work in a similar way
    to source files: take a bunch of definitions and declarations, put them in a file,
    add the export keyword at the top, and save it to your file system with a name.


    Encapsulation is only part of the story, as anyone with any experience of modules
    will tell you. All we have done in each of these examples is gathered things together
    and named them as a single entity. If we are smart, we will have gathered related
    things together. Information hiding is a more subtle activity, requiring you to
    make more careful decisions. In addition to gathering, you must decide which items
    you are going to reveal to the outside world, and which you are going to hide.
    Information hiding implies that some encapsulation is taking place, but encapsulation
    does not imply that information hiding is taking place.'
