    You might be asking yourself, "Well, if they all generate the same code, what''s
    the difference? Why should I choose one of these over another?" The answer is
    that this guideline is not about performance, but about maintenance. Declaring
    at point of use improves readability of code, and not declaring state at all improves
    things even further. Reasoning about state requires a comprehensive memory, which
    is a dimin-ishing asset as codebases expand.


    Delaying declaration as late as possible carries several benefits. Unnecessary
    state can be reduced or even eliminated. Scope is minimized. Objects are not used
    prior to initialization. Readability is improved. All of this adds up to improved
    safety and, occasionally, improved performance characteristics. I think this is
    a golden rule to be followed as far as possible.'
