- pgno: 242
  md: "Back at the turn of the century, Microsoft proposed a solution to the problem\
    \ of documenting the nature of function parameters. It is called the source code\
    \ annota-tion language (SAL) and it lives in the header file sal.h as part of\
    \ the vendor imple-mentation.¹ It takes the form of annotations within the function\
    \ signature that describe the ins and outs of the parameters. For example, you\
    \ may be familiar with the function signature of memcpy:\n\n1. https://docs.microsoft.com/en-us/cpp/code-quality/using-sal-annotations-to-reduce-c-cpp-code-defects\n\
    \n```\nvoid* memcpy(\n    void* dest,\n    const void* src,\n    size_t count\n\
    );\n```\n\nApplying the annotations yields:\n\nClick here to view code image\n\
    \n```\nvoid* memcpy(\n    _Out_writes_bytes_all_(count) void* dest,\n    _In_reads_bytes_(count)\
    \ const void* src,\n    size_t count\n);\n```\n\nThese keywords provide extra\
    \ machine-readable information about the nature of the parameters. In this example,\
    \ _Out_writes_bytes_all_(count) signals that the output writes count bytes while\
    \ _In_reads_bytes_(count) signals that count bytes are read in. There are a lot\
    \ of annotations available, making this a very rich way of disam-biguating the\
    \ precise nature of the parameters.\n\nThese annotations are macros that disappear\
    \ during the preprocessor phase, but tooling within the Microsoft Visual Studio\
    \ IDE ensured that functions were being used correctly. If you use Visual Studio\
    \ you can try it out and benefit from the extra code analysis."
