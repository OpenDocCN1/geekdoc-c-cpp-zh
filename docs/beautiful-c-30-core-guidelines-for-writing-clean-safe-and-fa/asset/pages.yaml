  md: "Here you can see how tie has been eliminated and replaced with some syntactic\
    \ sugar in the form of auto and brackets.\n\nStructured binding was my favorite\
    \ C++17 feature. You can even use it to bind to an array or a struct:\n\nClick\
    \ here to view code image\n\n```\nint a[2] = {1, 2};\nauto [b, c] = a; // b and\
    \ c are ints, where b = 1\nand c = 2\n\nstruct S {\n    int a;\n    int b;\n};\n\
    S make_s();\n\nauto [d, e] = make_s(); // d = the first member of\nthe returned\
    \ struct\n                        // e = the second member.\n```\n\nThe use cases\
    \ for out parameters are few. While returning tuples is a neat trick, do not overlook\
    \ returning a struct. If your return values are related in some way, you may be\
    \ in the process of unearthing an abstraction. The same tricks used to return\
    \ a tuple are used to return a struct. Copy elision means the values are created\
    \ where they will be needed by the caller.\n\nAlways check that you are not discarding\
    \ an abstraction when you merely return a tuple. A pair of BigObj and an error\
    \ code doesn’t sensibly lend itself to being com-posed into a new abstraction,\
    \ but a tuple consisting of several related objects most likely needs names for\
