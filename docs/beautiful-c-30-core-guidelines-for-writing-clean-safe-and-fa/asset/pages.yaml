- pgno: 32
  md: '# Backward compatibility of C++


    It’s important to remember where this language came from, and also what motivates
    its development. There is code in my current project that I wrote in 2005. It
    looks a little peculiar to today’s programmers as it uses long-discarded paradigms,
    no auto, no lambdas: it’s a history lesson in source.


    However, it still works. It still compiles and runs well. During your career,
    you will come across code of various ages. It’s important to make use of the latest
    stand-ard and build with the latest compiler you can find, but it’s also important
    to know where the language came from and to plan for the future.


    > *Stability over decades is a feature.*


    Sometimes it isn’t possible to use the latest version of the standard. In embed-ded
    development, regulation, certification of systems, or elderly infrastructure may
    force you to use C++11, or even C++98. C++ relies on backward compatibility. It
    is backward-compatible with C. It is backward-compatible with prior standards.
    Sta-bility over decades is a feature. This is one of its great strengths: billions
    of lines of code around the world still build with a modern compiler, occasionally
    with a little tweaking. At some point you may be asked to maintain this code.


    # Forward compatibility and “Y2K”


    Conversely, write code that is built to last. At the end of the last century,
    a problem was unearthed in much of the world’s elderly computer software: only
    two digits were used to represent the year.⁶ Memory was at a premium, and the
    efficient thing to do was simply store 74 rather than 1974. The developer thought
    nothing of it: “This piece of software will not be running in 25 years; surely
    it will have been replaced.”


    6. https://www.britannica.com/technology/Y2K-bug


    Ah, such pessimism, or perhaps optimism, depending on your point of view. Of course,
    once the date rolled around to the year 2000, then the year was represented as
    00, spoiling time interval calculations, interest payment calculations, indeed,
    ANYTHING to do with the passage of time.'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'This was known as the Y2K bug or the millennium bug. It proved to be a bonanza
    for older contractors, who toured the computers of the world effecting repairs
    on 25-year-old systems at considerable expense. Disaster was largely averted because
    the problem was identified in sufficient time and there were enough engineers
    avail-able to put things right.


    However, if the engineers had planned for the future instead, had assumed that
    their code would run “forever,” and were writing the code at a point in time when
    four-digit integers occupied the same space as two-digit integers, this would
    have been avoided. It would have been clear that two digits was NOT enough to
    repre-sent all dates that may be required, and at least a third digit would be
    needed, and really a fourth digit would just be simpler all around to accommodate
    the turn of the millennium.


    Incidentally, this is not the only date problem. Linux has a similar problem with
    measuring time in seconds since January 1, 1970. This was stored as a 32-bit signed
    integer, which means it will roll over on January 19, 2038. I say “was”: from
    Linux 5.6 the problem was solved.


    An important pair of career skills is therefore writing code for the future and
    learning to read code from the past.


    # Staying on top of developments to the standard


    C++ is developing all the time. With every publication of a new standard there
    comes a cornucopia of new language features and library additions. There is no
    especial virtue in simply using the most novel features; they should be used where
    they give definite and concrete benefit. However, the C++ community is very fortu-nate
    to have many excellent teachers ready to unfold and reveal all these new things
    to us. Finding these resources is made easier in four ways.


    # IsoCpp


    First of all, there is isocpp.org.7 This is the home of C++ on the Web and is
    run by the Standard C++ Foundation. This is a Washington 501(c)(6) not-for-profit
    organi-zation whose purpose is to support the C++ software developer community
    and pro-mote the understanding and use of modern Standard C++ on all compilers
    and platforms. On this site you can find a'
