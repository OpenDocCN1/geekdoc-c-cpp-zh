  md: '+   - If you are modeling hardware registers that hold unsigned values

    +   - If you are dealing with sizes rather than quantities; for example values
    returned by `sizeof`

    +   - If you are doing bit manipulation with masks, since you will be doing no
    arith-metic with these values


    Here is the rule: if you are doing any arithmetic, including comparison, use a
    signed type. If you are using an unsigned type to get an extra bit of representation,
    you are using the wrong type and you should go wider or recognize that you are
    performing a very risky optimization. It would not surprise me if a bitfield type
    makes its way into the language sooner or later, making even that case redundant.


    Unfortunately, there is a rather large error in the standard library. All the
    size member functions on the containers return `size_t`, which is an unsigned
    type. This is a misunderstanding of the difference between quantity and amount.
    The size of a container is the quantity of elements it contains. The size of an
    object is the amount of memory it occupies.


    Fortunately, since C++20, we have been blessed with the arrival of the function
    `std::ssize`, short for signed size. It returns a signed value. Disavow all use
    of the `size` member function, and instead use this nonmember function thus:


    Click here to view code image


    ```

    auto collection = std::vector<int>{1, 3, 5, 7, 9};

    auto element_count = std::ssize(collection);

    ```


    # Buffers and sizes


    Staying with sizes, consider buffers. There are two important things to keep in
