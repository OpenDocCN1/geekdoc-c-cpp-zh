  md: '# Envoi


    When Kate and I started to develop this book, I did not know what would be revealed
    to me along the way. Part of the fun of writing is discovering what it is you
    don’t quite know. In my day job as Head of Engineering Practice at Creative Assembly
    I frequently write short posts about how to use a language or library feature,
    and the process of clarifying it in writing forces a greater clarification in
    my mind.


    Writing ninety thousand words rather than a thousand has magnified this experience
    greatly. The one thing I will take away from this book is the primary importance
    of abstraction and of working at the correct level of abstraction. Many of the
    guide-lines can be viewed as advisories in the service of improving abstraction.
    At the end of Chapter 5.3 I listed a few.


    Another part of my day job is interviewing fresh university graduates who seek
    to join our graduate programmer initiative. In the early days of learning C++,
    the student will typically focus on writing functions that conditionally read
    and write state from objects in the program. They will treat classes as vessels
    for storing state, rather than abstractions formed from invariants.


    It is my fervent hope that, having read this book, you will focus more on the
    idea of a program being a set of small abstractions that model the problem at
    hand, and less on the idea of a program being a scripted sequence of actions.
    C++ is characterized as a blend of zero-overhead abstraction facilities and bare-metal
    performance opportunities. If you only take advantage of the performance opportunities
    and discard the abstraction facilities, your code will be hard to maintain and
    difficult to incorporate into other codebases.


    I also hope that your interest has been piqued regarding the remaining Core Guidelines.
    As the language grows, so must the guidelines, and the authors welcome pull requests
    with improvements and evidence. Similarly, I hope you are motivated to look more
    closely at the development of the'
  merge: -1
  img_proc: true
