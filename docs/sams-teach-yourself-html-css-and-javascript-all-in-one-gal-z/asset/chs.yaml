  \      </ul>\n    </div>\n  </body>\n</html>\n```\n\n* *\n\n当用户的光标悬停在包含链接的列表项上时，该列表项会显示一个像素的实白色边框，这归功于样式表中的此条目：\n\
  \n```css\n#theImg a:hover {\n    border: 1px solid #ffffff;\n}\n```\n\n列表项本身根据图像中应的可点击区域被定义并放置在特定位置。例如，id\
