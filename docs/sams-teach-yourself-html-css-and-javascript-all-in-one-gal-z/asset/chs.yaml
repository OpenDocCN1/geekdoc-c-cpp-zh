  \ HTML 表格更易读（并且更不容易产生浪费时间的错误）。\n\n示例中的表格包含棒球排名，非常适合按行和列排列——尽管可能有点单调。你将在本章中学习如何让它变得有趣。表格中的表头显示了排名中的球队、胜场（W）、负场（L）和落后场（GB）。\n\
  \n虽然我们没有对 列表 6.1 中的 HTML 应用任何样式，但如果你使用空格来缩进 `<tr>` 和 `<td>` 标签，你可能会发现你的 HTML 表格更易读（并且更不容易产生浪费时间的错误）。\n\
  \n(注：由于提供的文本中存在大量重复的段落，我已根据“一定不要重复输出原文”的原则，仅对核心内容进行了翻译。)\n\n\n\n\n```html\n<table>\n\
  \  <tr>\n    <th style=\"width:25px;\">W</th>\n    <th style=\"width:25px;\">L</th>\n\
  \    <th style=\"width:25px;\">GB</th>\n  </tr>\n  <tr>\n    <td><img src=\"losangeles.gif\"\
  \ alt=\"Los Angeles Dodgers\" /></</td>>\n    <td>Los Angeles Dodgers</td>\n   \
  \ <td>62</td>\n    <td>38</td>\n    <td>—</td>\n  </tr>\n  <tr>\n    <td><img src=\"\
  sanfrancisco.gif\" alt=\"San Francisco Giants\" /></</td>>\n    <td>San Francisco\
  \ Giants</td>\n    <td>54</td>\n    <td>46</td>\n    <td>8.0</td>\n  </tr>\n  <tr>\n\
  \    <td><img src=\"colorado.gif\" alt=\"Colorado Rockies\" /></</td>>\n    <td>Colorado\
  \ Rockies</td>\n    <td>54</td>\n    <td>46</td>\n    <td>8.0</td>\n  </tr>\n  <tr>\n\
  \    <td><img src=\"arizona.gif\" alt=\"Arizona Diamondbacks\" /></</td>>\n    <td>Arizona\
  \ Diamondbacks</td>\n    <td>43</td>\n    <td>58</td>\n    <td>19.5</td>\n  </tr>\n\
  \  <tr>\n    <td><img src=\"sandiego.gif\" alt=\"San Diego Padres\" /></</td>>\n\
  \    <td>San Diego Padres</td>\n    <td>39</td>\n    <td>62</td>\n    <td>23.5</td>\n\
  \  </tr>\n</table>\n```\n\n你可以在图 6.2 中看到一致的列宽。\n\n**图 6.2** 代码列表 6.2 中的 HTML 代码创建了一个包含六行五五列的表格，并为每列指定了特定的宽度。\n\
  \n![image](img/06fig02.jpg)\n\n列表 6.1 中的代码与列表 6.2 中使用的代码有两处区别。首先，列表 6.2 中增加了一个列；该列没有标题，但第一行中仍然存在\
  \ `<th></th>th` 标签对。在第二行到第六行中，这个额外的列包含一个图像（即 `<img />` 标签）。列表 6.2 的第二处区别是第一行中每个\
  \ `<th>` 元素添加了特定的宽度。第一列定义为 `35px` 宽，第二列为 `75px`，第三、第四和第五列的宽度均为 `25px`。\n\n另请注意，这些宽度在后续行的\
  \ `<td>` 元素中并没有重复。从技术上讲，你只需要在第一行中定义宽度；它们都属于同一个表格。然而，如果你使用了其他样式（例如更改字体大小或颜色的样式），则必须对每个具有这些属性的元素重复该样式。\n\
  \n### 表格内部的对齐与跨越\n\n默认情况下，放置在表格单元格内的任何内容都向左对齐并垂直居中。图 6.1 和 6.2 展示了这种默认。然而，你可以通过\
  \ `text-align` 和 `vertical-align` 样式属性对表格单元格的内容进行水平和垂直对齐。\n\n你可以将这些对齐属性应用于任何 `<tr>`、`<td>`\
  \ 或 `<th>` 标签。分配给 `<tr>` 标签的对齐属性适用于该行的所有单元格。根据表格的大小，通过在 `<tr>` 级别应用这些属性而不是在每个 `<td>`\
  \ 或 `<th>` 标签中应用，可以节省大量的精力和时间。列表 6.3 中的 HTML 代码使用了组合样式来对行应用默认对齐，但在少数单独单元格中这些设置被覆盖了。图\
  \ 6.3 展示了列表 6.3 中代码的结果。\n\n**图 6.3**列表 6.3 中的代码展示了 `colspan` 属性和对齐样式的使用。\n\n![image](img/06fig03.jpg)\n\
  \n以下是一些较常用的 `vertical-align` 样式属性值：`top`、`middle`、`bottom`、`text-top`、`text-bottom`\
  \ 和 `baseline`（针对文本）。这些属性值在对齐表格数据时提供了足够的活性。\n\n#### 列表 6.3 表格中的对齐、单元格间距、边框和背景颜色\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>Things to Fear</title>\n\
  </head>\n<body>\n  <h1>Things to Fear</h1>\n  <table border=\"2\" cellpadding=\"\
  4\" cellspacing=\"2\" width=\"100%\">\n    <tr style=\"background-color:red;color:white\"\
  >\n      <th colspan=\"2\">Description</th>\n      <th>Size</th>\n      <th>Weight</th>\n\
  \      <th>Speed</th>\n    </tr>\n    <tr style=\"vertical-align:top\">\n      <td><img\
  \ src=\"handgun.gif\" alt=\".38 Special\"/></td>\n      <td style=\"font-size: 14px;font-weight:bold;\
  \ vertical-align:middle;text-align:center\">.38 Special</td>\n      <td>Five-inch\
  \ barrel.</td>\n      <td>Twenty ounces.</td>\n      <td>Six rounds in four seconds.</td>\n\
  \    </tr>\n    <tr style=\"vertical-align:top\">\n      <td><img src=\"rhino.gif\"\
  \ alt=\"Rhinoceros\" /></td>\n      <td style=\"font-size: 14px;font-weight:bold;\
  \ vertical-align:middle;text-align:center\">Rhinoceros</td>\n      <td>Twelve feet.</td>\n\
  \      <td>Two tons.</td>\n      <td>Sixty miles per hour.</td>\n    </tr>\n  </table>\n\
  </body>\n</html>\n```\n\n\n\n\n\n你经常会在表格中看到交替的行颜色。例如，某一行可能是灰色背景，而下一行可能是白色背景。交替的行颜色有助于用户更清晰地阅读表格内容，特别是当表格很大时。\n\
  \n***\n\n与 `background-color` 样式属性类似的是 `background-image` 属性（在本例中未显示），它被用于为表格的背景图像。如果你想将\
  \ `leaves.gif` 图像设置为表格的背景，将使用 `<table style=\"background-image:url(leaves.gif)\"\
  >`。注意，图像文件被放在括号内，并在前面带有 `url` 单词，这表示你正在描述图像文件所在。\n\n***\n\n### 注意事项\n\n尽管在 XHTML\
  \ 中仍然允许 `cellpadding` 和 `cellspacing` 属性，但 CSS 中对应的等效属性是以 `padding` 和 `border-spacing`\
  \ 样式属性的形式存在的。\n\n***\n\n调整表格不仅仅是使用样式属性。如列表 6.3 所示，你可以使用 `cellpadding` 和 `cellspacing`\
  \ 属性来控制表格边界周围的空间。`cellspacing` 属性设置表格边界之间以及表格单元格之间的空间（以像素为单位）。`cellpadding` 属性设置单元格信息边缘的空间，同样以像素为单位。将\
  \ `cellpadding` 值设置为 `0` 会导致表格中的所有信息尽可能地紧贴表格边界，甚至可能碰到边界。`cellpadding` 和 `cellspacing`\
  \ 属性让你对表格的外观进行良好的整体控制。\n\n### 使用表格进行页面布局\n\n在本章的开头，我提到设计人员一直使用表格进行页面布局和显示表格化信息。如果你偷看其他设计师的源代码，仍然会发现许多基于表格的布局示例。这种设计方法源于旧时代（20\
  \ 世纪 90 年代中期到 2000 年代初）浏览器对 CSS 支持的不一致性。当时所有浏览器都支持表格，且通常方式相同，因此网页设计师就青睐了这种基于表格的内容创建方法，以实现在所有浏览器中实现相同的视觉页面显示。然而，现在所有主流浏览器对\
  \ CSS 的支持已非常相似，设计人员可以遵循长期以来基于标准的建议，*不*使用表格进行页面布局。\n\n万维网联盟（W3C）是监督 Web 未来发展的标准机构，它推广样式表作为布局页面的正确方式（而不是使用表格）。样式表最终比表格要强大得多，这就是为什么本书的大部分内容都在教你如何使用样式表进行页面布局。\n\
  \n避免使用表格进行布局的主要原因包括：\n\n- **将演示效果与内容混合**——CSS 和遵循标准的 Web 设计的目标之一是将演示层与内容层分离。\n-\
  \ **导致重新设计变得不必要的异常困难**——要更改基于表格的布局，你必须更改网站上每一个页面的基于表格的布局（除非它是复杂的、动态驱动网站的一部分，在这种情况下，你必须撤销所有动态部分并重新制作）。\n\
  - **可访问性问题**——屏幕阅读器软件会在表格中寻找内容，并经常尝试将你的布局表格当作内容表格来读取。\n- **在移动设备上渲染**——表格布局通常不够灵活，无法缩小到小屏幕（参见第\
  \ 12 章，“创建固定或流式布局]”）。\n\n这些只是基于表格的网页设计中的几个问题。若要更深入地了解其中一些问题，请参阅热门演示文稿“为什么用于布局是愚蠢的”，地址为\
  \ [`www.hotdesign.com/seybold/everything.html`](http://www.hotdesign.com/seybold/everything.html)。\n\
  \n## 总结\n\n在本短章节中，你学习了将文本和图像排列成有组织的行列，称为表格。你学习了创建表格的三个基本标签，以及许多控制表格对齐、间距和外观可选属性和样式。你还发现表格可以结合使用并嵌套，以获得更丰富的布局选项。\n\
  \n表格 6.1 总结了本章涵盖的标签和属性。\n\n表格 6.1 第 6 章涵盖的 HTML 标签和属性\n\n![image](img/06tab01.jpg)![image](img/06tab01a.jpg)\n\
  \n## 问答\n\n**问：我做了一个大表格，加载页面时，页面上长时间没有任何显示。为什么要等？**\n\n**答：**复杂的表格可能需要一段时间才能出现在屏幕上。网页浏览器必须在显示任何部分之前计算表格中所有内容的大小。你可以通过始终为表格中的每个图形图像包含\
  \ `width` 和 `height` 属性来稍微加快速度。在 `<table>` 和 `<td>` 标签中使用 `width` 属性也有帮助。\n\n**问：我可以在表格内嵌套表格吗？**\n\
  \n**答：** 可以，可以将表格嵌套其他表格单元格中。然而，嵌套表格——尤其是大型表格——需要时间正确加载和渲染。在创建嵌套表格之前，考虑你放在页面上的内容，并问自己是否可以使用\
  \ CSS 显示。在你读完这本书之前可能不知道所有的答案，但这里有一个提示：在大多数情况下，答案是肯定的。\n\n## 工作坊\n\n工作坊包含测试题和练习，帮助你巩固知识。在查看答案部分之前，尝试回答所有问题。\n\
  \n#### 测试题\n\n**1. 如何创建一个带有标准框的双行两列表格？**\n\n**2. 在第 1 题的基础上，如何在表格与单元格之间添加 30 像素的空间？**\n\
  \n**3. 继续你在第 1 和 2 题中构建的表格，如何让左上单元格为绿色，右上单元格为红色，左下单元格为黄色，右下单元格为蓝色？**\n\n#### 答案\n\
  \n**1.** 使用以下 HTML：\n\n```html\n<table border=\"1\">\n  <tr>\n    <td>左上...</td>\n\
  \    <td>右上...</td>\n  </tr>\n  <tr>\n    <td>左下...</td>\n    <td>右下...</td>\n \
  \ </tr>\n</table>\n```\n\n**2.** 在 `<table>` 标签中添加 `cellspacing=\"30\"`。\n\n**3.**\
  \ 为左上 `<td>` 标签添加 `style=\"background-color:green\"`，为右上 `<td>` 标签添加 `style=\"background-color:red\"\
  `，为左下 `<td>` 标签添加 `style=\"background-color:yellow\"`，为右下 `<td>` 标签添加 `style=\"\
  background-color:blue\"`。\n\n## 练习\n\n• 你是否有任何页面包含访问者可能感兴趣以列表或表格查看的信息？使用表格展示一些表格化信息。确保每列都有自己的标题（或者可能是自己的图形）。尝试你在本章中学到的各种各种对齐和间距类型。\n\
  \n• 你经常会在表格中看到交替的行颜色，其中一行可能是灰色背景，而下一行可能是白色背景。表格行交替颜色的目标是为了在快速查看满数据的表格时，更容易辨别单行。创建一个具有交替行颜色和文本颜色的表格（如有必要）。虽然颜色的课程在第\
  \ 8 章，但你在本节中已经拥有了足够的信息来尝试这一过程。\n\n\n\n\n到目前为止，你已经学习了如何使用 HTML 标签来创建基础网页。然而，在此时，这些内容就像是孤立的岛屿，与任何其他内容都没有连接（尽管在第\
  \ 3 章“理解层级样式表](#ch03.html_ch03)”中，我在示例中偷偷加入了页面链接）。要让你的工作变成真正的网页内容，你需要将其与 Web 的其他部分连接——或者至少连接到个人或公司网站内的其他页面。\n\
  \n本章将介绍如何创建指向文档内部内容的超链接，以及如何链接到其他外部文档。此外，你还将学习如何对超链接设置样式，使其以你所需的颜色和装饰方式显示——而不一定是默认的蓝色下划线显示。\n\
  \n## 使用 Web 地址\n\n为个人网站存储网页内容最简单的方法是将所有文件都放在同一个文件夹中。当文件像这样存储在一起时，你只需要在 `<a>` 标签的\
  \ `href` 属性中提供文件名即可链接到它们。\n\n***\n\n**注意**\n\n在我们开始之前，你可能想复习一下关于在服务器上放置文件的基础知识，以及如何在一组目录中管理文件。在创建网页内容链接时，这些信息非常重要。请参阅第\
  \ 1 章“发布网页内容](#ch01.html_ch01)”，特别是标题为“理解在 Web 服务器上放置文件的位置](#ch01.html_ch01sec1lev8)”的章节。\n\
  \n***\n\n*属性*（attribute）是与标签关联的额外信息，提供了有关该标签的更多细节。例如，`<a>` 标签的 `href` 属性标识了你正在链接的页面地址。\n\
  \n当你拥有有多个页面，或者当你开始对网站中的内容进行组织结构划分时，你应该将文件放入目录（或者说是*文件夹*，folders）中，这些目录的名称应反映其中的内容。例如，你所有的图片都可以放在“images”目录中，公司信息可以放在“about”目录中，以此此类推。无论你如何在自己的\
  \ Web 服务器上组织文档，你都可以使用相对地址，这种地址仅包含从一个页面找到另一个页面所需的信息。\n\n***\n\n**警告**\n\nHTML 中始终使用\
  \ `/` 正斜线来分隔目录。不要使用 `\\` 反斜线（通常用于 Windows）来分隔你的目录。记住，Web 世界中的一切都是向前的，所以请使用正斜线。\n\
  \n***\n\n*相对地址*（relative address）描述从一个网页到另一个网页的路径，而不是完整的（或*绝对*）互联网地址。\n\n如果你还记得第\
  \ 1 章中的内容，你 Web 服务器的文档根是被指定为网页内容的顶层目录。在 Web 地址中，该文档根由正斜线（`/`）表示。所有后续级别的目录都由相同类型的正斜线分隔。例如：\n\
  \n`/directory/subdirectory/subsubdirectory/`\n\n假设你在文档根目录中创建了一个名为 `zoo.html` 的页面，并想在\
  \ `elephants` 子目录中包含指向名为 `african.html` 和 `asian.html` 页面的链接。链接如下所示：\n\n```html\n\
  <a href=\"/elephants/african.html\">了解非洲大象。</a>\n<a href=\"/elephants/asian.html\"\
  >了解亚洲大象。</a>\n```\n\n这些特定地址实际上被称为*根相对地址*（relative-root addresses），因为它们是缺少整个域名但相对地址，但它们特地是相对于正斜线指定的文档根的。\n\
  \n使用普通的相对地址，你可以跳过初始的正斜线。这种类型的地址允许链接相对于它们所在的任何目录——它可以是文档根目录，也可以是文档根目录下一级或多级的另一个目录：\n\
  \n```html\n<a href=\"elephants/african.html\">了解非洲大象。</a>\n<a href=\"elephants/asian.html\"\
  >了解亚洲大象。</a>\n```\n\n你位于 `elephants` 子目录下的 `african.html` 和 `asian.html` 文档可以通过这两种方式之一链接回主\
  \ `zoo.html` 页面：\n\n```html\n<a href=\"http://www.yourdomain.com/zoo.html\">返回动物园。</a>\n\
  <a href=\"/zoo.html\">返回动物园。</a>\n<a href=\"../zoo.html\">返回动物园。</a>\n```\n\n第一个链接是绝对链接。对于绝对链接，*完全*不需要疑问链接应该去向何处，因为提供了完整的\
  \ URL——包括域名。\n\n第二个链接是根相对链接。它相对于你当前正在浏览的域名，因此不需要协议类型（例如 `http://`）和域名（例如 [www.yourdomain.com](http://www.yourdomain.com)），但提供了初始的正斜线以显示地址从文档根开始。\n\
  \n***\n\n**提示**\n\n关于相对地址（`elephants/african.html`）与绝对地址（[`www.takeme2thezoo.com/elephants/african.html`](http://www.takeme2thezoo.com/elephants/african.html)）的一般规则是：当你链接到存储在一起的文件时（例如所有属于同一个网站的文件），你应该使用相对地址。当你链接到其他地方的文件时——另一台计算机、另一个磁盘驱动器，或者更常见的另一个网站——应该使用绝对地址。\n\
  \n***\n\n在第三个链接中，双点（`..`）是一个特殊命令，表示当前目录所在的文件夹——换句话说是*父目录*（parent folder）。在目录结构中看到双点，只需只需“向上一级”。\n\
  \n如果你在整个网页中一致地使用相对地址，就可以将页面移动到另一个文件夹、磁盘驱动器或 Web 服务器，而无需更改链接。\n\n如果有需要，相对地址可以跨越复杂的目录结构。第\
  \ 27 章“组织和管理网站](#ch27.html_ch27)”提供了关于组织大量页面的更详细的建议。\n\n## 动手尝试：创建一个简单的网站架构\n\n\
  希望到现在，你在学习这些章节时已经创建了一两个属于自己的页面。按照以下步骤添加更多页面并链接它们：\n\n1. 使用主页作为主要入口和所有其他页面的中心枢纽。如果你创建了关于你自己或你业务的页面，请使用该页面作为主页。你现在也可能为此创建一个新页面。\n\
  2. 在主页上，列出你已创建的其他 HTML 文件的链接（或计划创建的 HTML 文件的占位符）。确保每个链接中的文件名拼写（包括大小写）完全正确。\n3. 在主页以外的所有页面上，在底部或顶部包含一个返回主页的链接。这使得导航变得简单快捷。\n\
  4. 你可能还想列出相关或有趣网站的链接列表，放在主页上或单独的链接页面上。人们通常会在自己的主页上列出朋友的个人页面。\n\n\n\n\n# 使用锚点识别页面中的位置\n\
  \n`<<a>>` 标签可以用于将页面上的某一点标记为锚点，使你能够创建一个指向该精确位置的链接。列表 7.1 将在本章稍后的部分给出，它展示了指向页面内锚点的链接。为了查看如何制作此类链接，让我们先看一眼列表中的第一个\
  \ `<a>` 标签：\n\n```html\n<a id=\"top\"></a>\n```\n\n`<a>` 标签通常使用 `href` 属性来指定链接目标。`<a\
  \ href>` 是你点击的地方，而 `<a id>` 是你点击后所在去的地方。在这个示例中，`<a>` 标签仍然指定了一个目标，但没有创建实际的链接。相反，`<a>`\
  \ 标签为标签所在的页面特定点赋予了名称。必须包含 `</a>` 标签，并为 `id` 属性分配一个唯一的名称，但 `<a>` 和 `</a>` 之间不需要任何文本。\n\
  \n> **注意**\n> 旧版本的 HTML 使用 `name` 而不是 `id`。较新版本的 HTML 和 XHTML 已经废弃了 `name` 属性，改为使用\
  \ `id`。\n\n# 链接到锚点位置\n\n列表 7.1 展示了一个在单个页面内设置了各种锚点的站点。查看 列表 7.1 中的最后一个 `<a>` 标签以查看示例：\n\
  \n```html\n<a href=\"#top\">返回索引。</a>\n```\n\n`#` 符号意味着单词 `top` 指向当前文档内一个命名的锚点，而不是另一个页面。当用户点击\
  \ `返回索引` 时，网页浏览器将显示从 `<a id=\"top\">` 标签开始的页面部分。\n\n列表 7.1 使用带有 `id` 属性的 `<a>` 标签设置锚点\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>字母排序的莎士比亚</title>\n\
  \  </head>\n  <body>\n    <h1><a id=\"top\"></a>莎士比亚十四行诗的首句</span></h1>\n    <p>你难道不不喜欢当你正在追求时，你单膝跪地，正要背诵出一首完全浪漫的莎士比亚十四行诗，结果砰！你大脑卡壳了。<em>“嗯……那是，呃……我想它是以\
  \ B 开头的……”</em></em></p>\n    <p>好了，你看起来再也不像个呆瓜了。只需参考此页面，点击你想要的首十四行诗的首字母，就能立即获得第一行的提醒来帮助你开始。<em>“该保佑那颗让我的心哀叹的心吧……”</em></em></p>\n\
  \    <h2 style=\"text-align:center\">字母索引</h2>\n    <h3 style=\"text-align:center\"\
  >\n      <a href=\"#A\">A</a> <a href=\"#B\">B</a> <a href=\"#C\">C</a>\n      <a\
  \ href=\"#D\">D</a> <a href=\"#E\">E</a> <a href=\"#F\">F</a>\n      <a href=\"\
  #G\">G</a> <a href=\"#H\">H</a> <a href=\"#I\">I</a>\n      <a href=\"#J\">J</a>\
  \ <a href=\"#K\">K</a> <a href=\"#L\">L</a>\n      <a href=\"#M\">M</a> <a href=\"\
  #N\">N</a> <a href=\"#O\">O</a>\n      <a href=\"#P\">P</a> <a href=\"#Q\">Q</a>\
  \ <a href=\"#R\">R</a>\n      <a href=\"#S\">S</a> <a href=\"#T\">T</a> <a href=\"\
  #U\">U</a>\n      <a href=\"#V\">V</a> <a href=\"#W\">W</a> <a href=\"#X\">X</a>\n\
  \      <a href=\"#Y\">Y</a> <a href=\"#Z\">Z</a>\n    </h3>\n    <hr />\n    <h3><a\
  \ id=\"A\"></a>A</h3>\n    <ul>\n      <li>用自然之手描绘的女子面庞，</li>\n      <li>就这样指责我吧，我已经省去了一切，</li>\n\
  \      <li>对于我的爱将像我现在一样，</li>\n      <li>相对于那个时代（如果时间真的来过）</li>\n      <li>啊，为何要与感染共存，</li>\n\
  \      <li>哀哉，我的灵感带来了怎样的贫穷，</li>\n      <li>唉，事实如此，我已处处走动，</li>\n      <li>像一个衰老的父亲那样感到欣悦，</li>\n\
  \      <li>像舞台上一个不完美的演员，</li>\n      <li>正如你消逝得那样飞快。</li>\n    </ul>\n    <p><a\
  \ href=\"#top\">返回索引。</a></p>\n    <hr />\n    <!-- 继续字母 -->\n    <h3><a id=\"Z\"\
  ></a>Z</h3>\n    <p>(没有十四行诗是以 Z 开头的。）</p>\n    <p><a href=\"#top\">返回索引。</a></p>\n\
  \  </body>\n</html>\n```\n\n> **注意**\n> 在 列表 7.1 的末，你会看到一行：\n> `<!-- 继续字母 -->`\n\
  > 该文本（HTML 注释）会出现在你的代码中，但不会被浏览器显示。你可以在第 27 章 学习更多关于注释的知识。\n\n> **注意**\n> 通过 `<a>`\
  \ 标签中的 `id` 属性指定的锚点名称必须以字母开头。因此，如果你想给锚点编号，请确保用字母开头（如 `photo1`、`photo2` 等），而不是 `1`、`2`\
  \ 等。纯数字锚点在浏览器中有效，但不符合 XHTML 标准。\n\n列表 7.1 中的每个 `<a href>` 链接都是指向相应 `<a id>` 锚点的下划线链接——如果我填充了文本的话。在这个示例中\
  \ `A` 和 `Z` 有效，因为它们有对应的文本链接，但你可以自由填充剩余！例如，点击图 1 中字母索引下的字母 `Z` 将带你进入图 2 所示页面的相应部分。\n\
  \n**图 1** 列表 7.1 中的 `<a id>` 标签完全没有出现在网页上。`<a href>` 标签显示为下划线链接。\n\n**图 2** 点击图\
  \ 1 所示页面上的字母 `Z` 将带你同一页面的相应部分。\n\n掌握了链接页面内文本的概念后，你现在可以学习链接其他网页内容。\n\n### 网页内容之间的链接\n\
  \n正如你在本章早期学到的，链接到域名内的内容（或如果你在本地查看站点），不需要在 `href` 属性的每个地址前包含 `http://`。当你从同一域名或同一计算机上的文件链接到另一个文件时，不需要指定完整的\
  \ Internet 地址。事实上，如果两个文件存储同一个文件夹中，可以直接使用文件名：\n\n```html\n<a href=\"pagetwo.html\"\
  >前往第 2 页。</a>\n```\n\n例如，列表 7.2 和图 3 展示了一个测验页面，链接到列表 7.3 和图 4 所示的答案页面。答案页面包含一个返回测验页面的链接。因为列表\
  \ 7.2 中的页面链接到同一目录下的另一个页面，所以文件名可以代替完整地址。\n\n**图 3** 这是列表 7.2 中列出的 `historyquiz.html`\
  \ 文件，被列表 7.3 中的链接引用。\n\n**图 4** 图 3 中的 `检查你的答案!` 链接将带你进入此答案页面。`返回问题` 链接将带你回到回图 3\
  \ 所示的内容。\n\n列表 7.2 `historyanswers.html` 文件\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>历史测验</title>\n  </head>\n  <body>\n    <h1>历史测验</h1>\n    <p>完成以下韵律句。（例如：征服者威廉在……一零六六年对萨克逊人实施了残酷的圈套。）</p>\n\
  \    <ol>\n      <li>哥伦布在蓝色的海洋航行于……</li>\n      <li>西班牙无敌舰队在……丧失了命运</li>\n     \
  \ <li>伦敦像腐烂的木头一样烧于……</li>\n    </ol>\n    <p style=\"text-align: center;font-weight:\
  \ bold;\">\n      <a href=\"historyanswers.html\">检查你的答案!</a>\n    </p>\n  </body>\n\
  </html>\n```\n\n\n\n\n\n# 列表 7.3 `historyquiz.html` 链接的 `historyanswers.html` 文件\n\
  \n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"\
  -//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>History Quiz Answers</title>\n  </head>\n  <body>\n    <h1>History Quiz\
  \ Answers</h1>\n    <ol>\n      <li>...fourteen hundred and ninety-two.</li>\n \
  \     <li>...fifteen hundred and eighty eight.</li>\n      <li>...sixteen hundred\
  \ and sixty-six.</li>\n    </ol>\n    <p style=\"text-align: center;font-weight:\
  \ bold;\">\n      <a href=\"historyquiz.html\">返回问题页面</a>\n    </p>\n  </body>\n\
  </html>\n```\n\n使用文件名而不是完整的 Internet 地址可以节省大量的打字时间。更重要的是，无论这组页面存储在何处，页面之间的链接都能正常工作。你可以在文件仍留在计算机硬盘上时测试链接。然后，你可以将它们移动到\
  \ Web 服务器、CD-ROM、DVD 或内存卡上，所有链接仍将能够正常工作。这种识别网页的简化方法并没有什么神奇之处——正如你所学到的，这完全与网页地址定有关。\n\
  \n## 链接到外部网络内容\n\n链接到你自己站点页面与链接到外部网络内容的唯一区别在于，当你链接到站点外部时，你需要包含该部分内容的完整地址。完整地址包括域名之前的\
  \ `http://`，然后指向文件的完整路径（例如，HTML 文件、图像文件、多媒体文件等）。\n\n### 注意事项\n正如你可能知道的，在大多数网络浏览器中输入地址时，可以省略开头的\
  \ `http://`。但是，当你在网页的 `<a href>` 链接中输入 Internet 地址时，你不能省略该部分。\n\n例如，为了从你自己的网页中包含一个指向\
  \ Google 的链接，你会在 `<a>` 链接中使用这种绝对地址法：\n\n```html\n<a href=\"http://www.google.com/\"\
  >前往 Google</a>\n```\n\n你可以将之前章节中学到的知识应用于创建指向其他页面上命名锚点的链接。链接锚点不仅限于同一个页面。你可以通过包含地址或文件名，后跟\
  \ `#` 和锚点名称，链接到另一个页面上的命名锚点。例如，下面的链接将带你进入 `www.takeme2thezoo.com` 域名下 `elephants`\
  \ 目录中 `african.html` 页内名为 `photos` 的锚点。\n\n```html\n<a href=\"http://www.takemetothezoo.com/elephants/african.html#photos\"\
  >\n查看非洲象照片！</a>\n```\n\n如果你是从已经位于 `www.takemet2thezoo.com` 域名的另一个页面链接（因为你实际上是该站的维护者），你的链接可能如下：\n\
  \n```html\n<a href=\"/elephants/african.html#photos\">查看非洲象照片！</a>\n```\n\n### 注意事项\n\
  请确保仅在 `<a href>` 链接标签中包含 `#` 符号。不要在 `<a id>` 标签中放置 `#` 符号；否则该名称的链接将无法工作。\n\n正如你已经学到的，在这种情况下，`http://`\
  \ 和域名将是不必要的。\n\n## 链接到电子邮件地址\n\n除了页面之间以及单个页面部分之间的链接外，`<a>` 标签还允许你链接到电子邮件地址。这是让你的网页访问者与你交流的最简单方法。当然，你也可以为访问者提供你的电子邮件地址，并信任他们将其输入他们使用的任何电子邮件程序中，但这增加了错误的概率。通过为你的电子邮件地址提供一个可点击的链接，你可以让他们向你发送消息变得几乎毫不费力，并消除拼写错误的可能。\n\
  \n指向电子邮件地址的 HTML 链接如下：\n\n```html\n<a href=\"mailto:yourusername@yourdomain.com\"\
  >给我发一封邮件。</a>\n```\n\n`给我发一封邮件` 这些文字将像任何其他 `<a>` 链接一样显示。\n\n如果你希望人们看到你真实的电子邮件地址（以便他们记录它或使用不同的电子邮件程序发送消息），请将其包含在\
  \ `href` 属性以及作为 `<a>` 和 `</a>` 标签之间消息的一部分，如下所示：\n\n```html\n<a href=\"mailto:you@yourdomain.com\"\
  >you@yourdomain.com</a>\n```\n\n在大多数网络浏览器中，当有人点击链接时，她会得到一个窗口，可以在其中输入消息，该消息将立即发送给你——无论该人使用什么电子邮件程序收发邮件，都会自动调用。你可以在链接中提供一些额外信息，以便：\n\
  \n```html\n<a href=\"mailto:you@yourdomain.com?subject=Book Question&body=When is\
  \ the next edition coming out?\">you@yourdomain.com</a>\n```\n\n当用户点击此链接时，将创建一个电子邮件，以\
  \ `you@yourdomain.com` 为收件者，`Book Question` 为主题，`When is the next edition coming\
  \ out?` 为正文。\n\n### 提示\n如果你只想指定邮件主题而不指定正文，你可以省略 `&` 和 `body` 变量值，文本如下所示：\n\n```html\n\
  <a href=\"mailto:author@somedom.com?subject=Book Question\">author@somedom.com</a>\n\
  ```\n\n\n\n\n\n因为浏览器将字符编码解释为……嗯，字符，所以从浏览器的角度来看，结果是相同的。然而，自动化电子邮件抓取程序会在原始 HTML 代码中搜索页面，在这种情况下，显示的是一个看起来相当杂乱的电子邮件地址。如果你不想为自己的地址研究字符编码，只需在搜索引擎中输入\
  \ `email address encoder`，你就能找到一些在线服务可以为你生成编码后的字符串。\n\n## 在新浏览器窗口中打开链接\n\n现在你已经掌握了如何为链接创建地址——包括内部链接（你的站点内）和外部链接（指向其他网站）——还有一种链接方法：强制用户在新窗口中打开链接。\n\
  \n你一定听说过*弹出窗口*（pop-up windows），它们是浏览器窗口——通常用于投放产品或服务——在未经用户许可的情况下自动打开并显示。然而，在某些情况下，打开另一个窗口或目标指向另一个位置确实有其用途。例如，你可能想在一个较小的次要浏览器窗口中显示信息，但仍然允许用户在主窗口查看这些信息。这在点击动画演示、电影片段或其他多媒体元素的链接时通常是如此。当你链接到站外内容时，也可能希望目标一个新的浏览器窗口。\n\
  \n然而，代表用户打开新的浏览器窗口——尤其是当它是全尺寸新窗口时——违背了某些可用性和可访问性原则。当人们打开新窗口时，通常是通过使用 `<a>` 标签的 `target`\
  \ 属性实现的。在严格的 XHTML 1.1 规范中，`target` 属性已从 `<a>` 标签中移除。\n\n有可以在遵循可用性和可访问性原则的同时实现相同结果，但这些方法需要一些\
  \ JavaScript 和其他技巧。在我们进入本书的 JavaScript 部分时，将学习这些方法，该部分还将涵盖如何以符合标准且可访问的方式通过外部链接调用新窗口。\n\
  \n## 使用 CSS 为超链接设置样式\n\n网页上文本超链接的默认显示是带下划线的蓝色文本。你可能还会注意到，你访问过的链接显示为带下划线的紫色文本——那种颜色也是默认的。如果你在\
  \ Web 上度过任何时间，你也会注意到并不是所有的链接都是蓝色或紫色的——对于这一点，我想我们都对此表示感谢。通过使用一点 CSS 和对 `<a>` 链接的各种伪类（pseudoclasses）的知识，你可以让你的链接呈现任何你想要的样子。\n\
  \n> **注意**\n> 你可以通过将 `<img>` 标签放在起始标签 `<a>` 和结束标签 `</a>` 之间来将图形作为链接（而不是使用文本作为链接）。你将在第\
  \ 8 章“使用颜色、图像和多媒体](#ch08.html_ch08)”中中学习如何将图形作为链接。\n\n*伪类*是一种描述适用于特定情况元素样式的类，例如用户与该元素交互的各种状态。\n\
  \n例如，`<a>` 标签的常用伪类是 `link`、`visited`、`hover` 和 `active`。如果你愿意，可以用“爱与恨”（Love-Hate）这个口诀来记住它们：LV（love）\
  \ HA（hate）。\n\n- `a:link` 描述以前未访问过的超链接的样式。\n- `a:visited` 描述以前访问过且存在于浏览器内存中的超链接样式。\n\
  - `a:hover` 描述用户鼠标悬停在链接上（在点击之前）的超链接样式。\n- `a:active` 描述正在被点击但尚未释放的超链接样式。\n\n例如，假设你想创建一个具有以下样式的链接：\n\
  \n- 字体为加粗且为 Verdana（并且没有下划线，这意味着没有文本装饰）\n- 基础颜色为浅蓝色\n- 用户悬停或或点击它时颜色为红色\n- 用户访问过之后颜色为灰色\n\
  \n你的样式表条目可能如下：\n\n```css\na {\n    font-family: Verdana, sans-serif;\n    font-weight:\
  \ bold;\n    text-decoration: none;\n}\n\na:link {\n    color: #6479A0;\n}\n\na:visited\
  \ {\n    color: #CCCCCC;\n}\n\na:hover {\n    color: #E03A3E;\n}\n\na:active {\n\
  \    color: #E03A3E;\n}\n```\n\n> **注意**\n> 示例中的颜色通过其十六进制值表示，你将在第 8 章中学习这些内容。\n\n\
  由于示例链接无论处于什么状态，字体都将 Verdana 加粗（且没有下划线），因此这三个属性和值对可以位于 `a` 选择器的规则中。然而，因为每个伪类必须关联一个特定的颜色，我们像代码示例所示，为每个伪类使用一个规则。伪类继承父规则的样式，除非该伪类的规则专门覆盖了该规则。换句话说，上一个示例中的所有伪类都将是\
  \ Verdana 加粗（且没有下划线）。但是，如果我们为 `hover` 伪类使用了以下规则，文本将以 Comic Sans 字体显示：\n\n```css\n\
  a:hover {\n    font-family: \"Comic Sans\";\n}\n```\n\n此外，因为每个伪类必须关联一个特定的颜色，我们像代码示例所示为每个伪类使用一个规则。伪类继承父规则的样式，除非该伪类的规则专门覆盖了该规则。换句话说，上一个示例中的所有伪类都将是\
  \ Verdana 加粗（且没有下划线）。\n\n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\"\
  >\n<html lang=\"en\">\n<head>\n<title>Sample Link Style</title>\n<style type=\"\
  text/css\">\n    a {\n        font-family: Verdana, sans-serif;\n        font-weight:\
  \ bold;\n        text-decoration: none;\n    }\n    a:link {\n        color: #6479A0;\n\
  \    }\n    a:visited {\n        color: #CCCCCC;\n    }\n    a:hover, a:active {\n\
  \        color: #FF0000;\n    }\n</style>\n</head>\n<body>\n    <h1>Sample Link\
  \ Style</h1>\n    <p><a href=\"simplelink.html\">当你第一次看到我时，我应该是一个浅蓝色、加粗、无下划线的 Verdana\
  \ 字体链接。</a></p>\n</body>\n</html>\n```\n\n\n\n\n如如下示例所示，类名（`footerlink`）出现在选择器名（`a`）之后，用点号分隔，并出现在伪类名（`hover`）之前，用冒号分隔：\n\
  \n`selector.class:pseudoclass`\n\n`a.footerlink:hover`\n\n## 总结\n\n`<a>` 标签是使文本“超”（hyper）的关键。通过它，你可以创建页面之间的链接，以及指向任何页面上特定锚点的链接。本章重点关注了如何使用相对地址或绝对地址标识页面，创建并样式指向其他页面的简单链接。\n\
  \n你了解到，在创建指向他人页面的链接时，在 `<a href>` 标签中包含每个页面的完整互联网地址是非常重要的。对于自己页面之间的链接，只需包含文件名以及从一个页面跳转到另一个页面所需的足够目录信息。\n\
  \n你发现了如何在页面内创建命名的锚点，以及如何创建指向特定锚点的链接。你还学习了如何链接到你的电子邮件地址，以便用户轻松地向给你发送消息。你甚至学习了如何保护你的电子邮件地址免受垃圾邮件发送者的攻击。最后，你学习了使用\
  \ CSS 控制链接显示的方法。\n\n表 7.1 总结了本章讨论的 `<a>` 标签。\n\n表 7.1 第 7 章涵盖的 HTML 标签和属性\n\n![image](img/07tab01.jpg)\n\
  \n## 问答\n\n**问：如果我链接到一个互联网上的页面，然后该页面的所有者删除或移动了它会发生什么？**\n\n**答：这取决于外部页面维护者如何设置他的\
  \ Web 服务器。通常，当你点击已移动或删除的链接时，你会看到 `page not found`（未找到页面）或其他信息。你仍然可以点击返回按钮回到你的页面。作为网站管理员，你可以定期运行链接检查程序，确保你的内部和外部链接都是有效的。一个例子是\
  \ [`validator.w3.org/checklink`](http://validator.w3.org/checklink) 链接检查服务。\n\n\
  **问：我网站上的一个内部链接在我的电脑上运行正常，但当我把页面放到网上后，链接就不起作用了。怎么回事？**\n\n**答：这些是最可能的元凶：**\n\n•\
  \ **大小写问题**——在 Windows 电脑，使用 `<a href=\"myfile.html\">` 链接到名为 `MyFile.html` 的文件是可以的。在大多数\
  \ Web 服务器上，链接必须是 `<a href=\"MyFile.html\">`（或者你必须将文件名改为 `MyFile.html`）。更糟糕的是，某些文本和文件传输程序实际上会在不通知你的情况下更改大小写！最好的解决方案是网页统一使用全小写文件名。\n\
  \n• **文件名中的空格**——大多数 Web 服务器不允许带有空格的文件名。例如，你永远不要将网页命名为 `my page.html`。相反，请将其命名为\
  \ `mypage.html` 甚至 `my_page.html`（使用下划线代替空格）。\n\n• **本地绝对地址**——如果由于原因，你使用本地绝对地址链接到文件（例如\
  \ `C:\\mywebsite\\news.html`），那么当你把文件放到网上时，链接将无法工作。你永远不要使用本地绝对地址；当发生这种情况时，通常是因为为了测试页面部分而创建的临时链接导致的意外。因此，在\
  \ Web 上发布页面之前，请务必小心删除任何测试链接。\n\n**问：我可以在同一个 `<a>` 标签中同时放入 `href` 和 `id` 吗？我有任何理由想要这样做吗？**\n\
  \n**答：可以，如果你有一个命名的锚点和一个链接紧挨在一起，这可能会节省你一些打字时间。然而，通常分开使用 `<a href>` 和 `<a id>` 更好以避免混乱，因为它们在\
  \ HTML 文档中扮演着完全不同的角色。**\n\n**问：如果我不小心拼错了锚点的名称或忘记在它前面加 `#` 会发生什么？**\n\n**答：如果你链接到一个页面内不存在的锚点名称或拼错了锚点名称，链接将跳转到该页面的顶部。**\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n**1.**\
  \ 你小学的好朋友在互联网上找到了你，并说他想交换主页链接。你如何在你的一个页面上放置指向 [www.supercheapsuits.com/~billybob/](http://www.supercheapsuits.com/~billybob/)\
  \ 网站的链接？\n\n**2.** 你会使用什么 HTML 来让点击页面顶部“About the Authors”（关于作者）文字的人可以直接跳转到页面其他地方的致谢列表？\n\
  \n**3.** 如果你的电子邮件地址是 bon@soir.com，你如何让文本“goodnight greeting”（晚安问候）变成一个人们可以点击以撰写并向你发送电子邮件的链接？\n\
  \n#### 答案\n\n**1.** 在你的页面上放置以下内容：\n\n```html\n<a href=\"http://www.supercheapsuits.com/~billybob/\"\
  >Bob's site</a>\n```\n\n**2.** 在页面顶部输入以下内容：\n\n```html\n<a href=\"#credits\">About\
  \ the Authors</a>\n```\n\n**3.** 在开头输入以下内容：\n\n```html\n<a href=\"mailto:bon@soir.com\"\
  >goodnight greeting</a>\n```\n\n## 练习\n\n• 创建一个包含你喜爱的网站格式列表的 HTML 文件。你可能已经在浏览器中收藏了这些网站，如果是这样，你可以从地址栏找到它们的\
  \ URL。\n\n• 如果你已经为网站创建了任何页面，请查看它们并考虑文本中是否有任何地方你想让人们方便地联系你。在该处包含你电子邮件地址的链接。为人们提供联系的机会越多越好——特别是当你经营业务时。\n\
  \n\n\n在你学习了如何创建图形之后，你将学习如何使用 `HTML` 和 `CSS` 来整合你创建的图形。在本章结束时，你将学习如何将额外的媒体（或称多媒体）集成到你的网站中。\n\
  \n## 选择颜色的最佳实践\n\n我无法准确告诉你在网站上应该具体使用哪些颜色，但我可以帮助你理解在自己选择这些颜色时应该考虑的因素。你使用的颜色会极大影响你的访问者；如果你经营的是电子商务网站，你将希望使用能够诱导用户查看目录并最终购买物品的颜色。为此，你希望确保颜色的使用是审慎且受到尊重的。你可能会奇怪，在谈论颜色时“尊重”是如何体现的，但请记住，万维网是一个国际社区，人们的解读各不相同；例如，粉色在日本是非常受欢迎的颜色，但在东欧国家非常不受欢迎。同样，绿色在美国是金钱的颜色，但大多数其他国家的纸币是多颜色的，因此“金钱的颜色”根本不是单一的颜色，这种比喻对他们来说毫无价值。\n\
  \n除了使用具有文化敏感性的颜色外，其他最佳实践还包括：\n\n- 使用自然的色调。这并不意味着你应该使用大地色调，而是指使用人们在镇上闲散步行时自然看到的颜色——避免使用引起眼睛疲劳的亮色。\n\
  - 使用较小的色板。你不需要使用 15 种不同的颜色来实现你的目标。事实上，如果你的页面包含 15 种不同颜色的文本和图像，你可能需要重新评估你试图传达的信息。专注于三到四种主色，最多配以几种辅助色。\n\
  - 考虑你的受众群体。你可能无法控制你的受众群体，因此必须找到一个兼顾所有人的折中方案。年轻人喜欢的颜色并不一定是老年人欣赏的颜色，就像男性、女性以及来自不同地区和文化的人之间也存在颜色偏好。\n\
  \n只要记住这几点建议，你的颜色选择似乎很有限。事实并非如此——这意味着你应该在做决定之前先思考你正在做的决定。在你喜欢的搜索引擎中搜索 `color theory`（色彩理论）应该为你提供更多思考，使用色轮也是如此。\n\
  \n`color wheel`（色轮）是一个以圆形方式组织颜色的图表。这种显示方法试图帮助你视觉化原色、间色和补色之间的关系。色彩方案是根据色轮的使用开发出来的；理解色彩方案可以帮助你确定在整个网站中一致使用的色板。例如，了解一些颜色关系将使你能够避免在浅蓝色背景上使用橙色文本，或在棕色背景上使用亮蓝色文本。\n\
  \nWeb 设计中一些常见的色彩方案如下：\n\n- `Analogous`（邻比色）——色轮上相邻的颜色，例如黄色和绿色。一种颜色为主色调，其邻比色被用于丰富显示效果。\n\
  - `Complementary`（补色）——色轮上相互相对的颜色，例如暖色（红色）和冷色（绿色）。\n- `Triadic`（三色调）——色轮上等距分布的三颜色。三色调在提供平衡的同时仍允许丰富的色彩使用。\n\
  \n有整本书籍和课程专门用于色彩理论，因此在书中继续讨论这个话题确实会偏离主题。然而，如果你打算从事 Web 设计和开发，对色彩理论基础的扎实理解将让你受益匪浅。花时间阅读相关内容——在线搜索将提供丰富的信息。\n\
  \n此外，花些时间实践一下色轮。`http://colorschemedesigner.com/` 上的色彩方案生成器允许你从基础颜色开始，生成单色、补色、三色调、四色调、邻比和强调邻比色彩方案。\n\
  \n## 理解 Web 颜色\n\n为网页指定除白色以外的背景颜色比你想象的要简单。例如，要将蓝色指定为页面背景颜色，可以在 `<body>` 标签内放入 `style=\"\
  background-color:blue\"` 或在 body 元素的样式规则中编写。当然，你可以使用蓝色以外的许多颜色。事实上，W3C 标准列出了 16 种颜色：aqua、black、blue、fuchsia、gray、green、lime、maroon、navy、olive、purple、red、silver、teal、white\
  \ 和 yellow。\n\n***\n\n**注意**\n\n要查看 140 种描述性颜色名称的完整列表、它们的十六进制代码以及浏览器显示的示例，请访问 `http://www.w3schools.com/HTML/html_colornames.asp`。\n\
  \n***\n\n显然，Web 上显示的颜色远不止这 16 种。事实上，有 140 种颜色名称你可以放心使用，所有浏览器都会以类似的方式显示这些颜色。以下是 140\
  \ 种描述性颜色名称的部分列表：azure、bisque、cornflowerblue、darksalmon、firebrick、honeydew、lemonchiffon、papayawhip、peachpuff、saddlebrown、thistle、tomato、wheat\
  \ 和 whitesmoke。\n\n但名称是主观的——例如，如果你查看 140 种跨浏览器颜色名称图表，你将无法区分 fuchsia 和 magenta。你会发现这两个术语相关的十六进制颜色值是完全相同的：`#FF00FF`。你将在下一节学习十六进制颜色值，但现在知道，如果你想符合标准并使用超过\
  \ 16 种颜色名称，你应该尽可能使用十六进制代码。\n\n***\n\n**提示**\n\n值得指出的是颜色名称是不区分大小写的。因此，`Black`、`black`\
  \ 和 `BLACK` 都是黑色，尽管大多数 Web 设计师倾向于使用小写或混合大小（如果他们确实使用颜色名称的话，大多数设计师会使用十六进制表示法对颜色的使用进行更细致的处理）。\n\
  \n***\n\n事实上，十六进制颜色代码实现了 1600 万种颜色。然而，大多数现代计算机显示器只能显示 16,384 种。但 16,384 仍然远多于 140\
  \ 或 16。\n\n你应该意识到，并非所有的计算机显示器显示的颜色色调都是相同的。在你的显示器上看起来是美丽的浅蓝色背景颜色，在另一个用户的显示器上可能更偏向紫色。中性的大地色调（如中灰色、浅褐色和象牙白）在许多计算机显示器上可能会产生更不可预测的结果。这些颜色甚至可能根据房间的光线条件或时间，在一个显示器上看起来发生颜色变化。\n\
  \n\n\n\n\n有很多非常糟糕的网站，有些是由认真的人创建的，完全没有任何讽刺意味。然而，图 8.1 所示的“世界上最糟糕网站”是有意创建的，旨在展示网站设计中一些极其严重的错误，特别是在色彩的使用上。一张截图并无法展现其全貌——请访问[`www.angelfire.com/super/badwebs/main.htm`](http://www.angelfire.com/super/badwebs/main.htm)\
  \ 亲自体验该网站。\n\n**图 8.1** “世界上最糟糕网站”的局部截图。\n\n![image](img/08fig01.jpg)\n\n如果你在搜索引擎中搜索\
  \ `bad website examples`，你会发现许多收集了糟糕设计案例的网站，并解释了为什么此类网站应该进入“耻辱授堂”而不是“名人堂”。许多网站因为其视觉展示被认为是糟糕的，而这种展示始于色彩的选择。因此，理解颜色以及其规范和用法的细微差别，是创建一个良好网站的关键步骤。\n\
  \n### 使用十六进制值表示颜色\n\n为了保持符合标准，并对网站中的颜色保持精确控制，你可以通过它们的十六进制值来引用颜色。颜色的`hexadecimal\
  \ value` 表示在每种颜色中应该混合多少红光、绿光和蓝光。它的原理有点像橡皮泥——只需混合你想要的红色、蓝色和绿色数量即可获得相应的颜色。\n\n十六进制颜色格式为\
  \ `#rrggbb`，其中 `rr`、`gg` 和 `bb` 是颜色的红色 (`rr`)、绿色 (`gg`) 和蓝色 (`bb`) 分量的两个位的十六进制值。如果你不熟悉十六进制数字，不用担心。只需记住\
  \ `FF` 是最大值，`00` 是最小值即可。为每个组件使用以下代码之一：\n\n* `FF` 表示全亮度。\n* `CC` 表示 80% 亮度。\n* `99`\
  \ 表示 60% 亮度。\n* `66` 表示 40% 亮度。\n* `33` 表示 20% 亮度。\n* `00` 表示不包含此此颜色成分。\n\n例如，亮红色是\
  \ `#FF0000`，深绿色是 `#003300`，蓝紫色是 `#660099`，中灰色是 `#999999`。要创建一个具有红色背景和深绿色文本的页面，HTML\
  \ 代码如下：\n\n```html\n<body style=\"background-color:#FF0000; color:#003300\">\n```\n\
  \n虽然这里只显示了六个两位十六进制值的示例，但实际上有 225 种两位十六进制值的组合——从 0 到 9 和 A 到 F 配对。例如，`F0` 是一个可能的十六进制值（十进制\
  \ 240），`62` 是一个可能的十六进制值（十进制 98），以此类推。\n\n如前所述，`#rrggbb` 十六进制颜色代码格式中的 `rr`、`gg` 和\
  \ `bb` 代表颜色的红色、绿色和蓝色成分。这些组件中的每一个十进制值范围从 0（无色）到 255（全色）。\n\n因此，白色（或 `#FFFFFF`）对应红色值\
  \ 255、绿色值 255 和蓝色值 255。同样，黑色（`#000000`）对应红色值 0、绿色值 0 和蓝色值 0。纯红色是 `#FF0000`（全红、无绿、无蓝），纯绿色是\
  \ `#00FF00`（无红、全绿、无蓝），纯蓝色是 `#0000FF`（无红、无绿、全蓝）。所有其他十六进制表示都对应三种颜色中 255 种可能值的某种变体。跨浏览器兼容的颜色名称\
  \ `cornflowerblue` 与十六进制表示 #6495ED 相关——其红色值为 40，绿色值为 149，蓝色值为 237（几乎是所有可用蓝色值）。\n\
  \n在选择颜色时（通过图形程序还是在网上找到你喜欢的），你可能会看到十六进制或十进制的颜色表示。如果你在搜索引擎中输入 `hexadecimal color converter`，你会发现许多选项可以帮助你将颜色值转换为可以在样式表里使用的内容。\n\
  \n### 使用 CSS 设置背景、文本和边框颜色\n\n使用 CSS 时，颜色值可以在三种情况下使用：当指定元素的背景颜色、文本颜色或边框颜色时。之前的章节包含了指定颜色的示例，但没有详细阐述颜色概念或颜色理论。例如，在第\
  \ 7 章“使用外部和内部链接”中，你学习了如何为各种链接状态使用颜色。\n\n图 8.2 展示了一个可以很容易进入网页设计耻辱授堂的颜色用法示例。我无法想象在严肃的网站中使用这些颜色和样式的组合，但它在这里作为一个颜色样式*可以*被应用于各种元素的示例。\n\
  \n**图 8.2** 背景、文本和边框颜色都可以使用 CSS 设置。\n\n![image](img/08fig01.jpg)\n\n（注：此处原文逻辑似乎有重复或编号错位，已按原文内容翻译）\
  \ \n图 8.2 展示了一个可以很容易进入网页设计耻辱授堂的颜色用法示例。我无法想象在严肃的网站中使用这些颜色和样式的组合，但它在这里作为一个颜色样式*可以*被应用于各种元素的示例。\n\
  \n\n\n\n最后，请考虑你的观众中不容忽视的色盲群体。为了无障碍访问，你可能考虑使用[色盲网页过滤器工具](http://colorfilter.wickline.org/](http://colorfilter.wickline.org/)\
  \ 来查看你的网站在色盲人士看来是什么样的。\n\n### 选择图形软件\n\n为你的网站选择整体配色方案是一回事，而创建或编辑用于这些模板的图像则是另一回事——而且这超出了本书的范围（或者说，单本书无法涵盖）。不过，在接下来的章节中，你将学习任何维护网站的人都应该快速掌握的一些基本操作。\n\
  \n### 使用其他网站的素材\n\n创建网页图形和媒体文件的节省时间方法之一，当然是完全避免创建它们。从任何网页上获取图形，只需右键点击它（或在 Macintosh\
  \ 鼠标上点击并按住），然后选择`图像另存为`或`图片另存为`（取决于你的浏览器）。从页面中提取背景图像同样简单：右键点击它并选择`将背景另存为`。\n\n然而，你不能在没有所有者明确许可的情况下使用图像，无论是通过询问他们还是寻找知识共享（Creative\
  \ Commons）许可。在未经明确许可的情况下使用图像是侵权行为（也是令人反感的）。要了解更多关于版权的知识，请访问[`www.utsystem.edu/OGC/IntellectualProperty/cprtindx.htm`](http://www.utsystem.edu/OGC/IntellectualProperty/cprtindx.htm)。\n\
  \n你可能还会考虑免版税剪画（royalty-free clip art），这不需要获得版权许可。在线剪画的一个良好来源是微软 Office Online 剪画和媒体网站，地址为[`office.microsoft.com/clipart/`](http://office.microsoft.com/clipart/)。Barry’s\
  \ Clipart Server 是另一个流行的剪画素材地，位于[`www.barrysclipart.com/`](http://www.barrysclipart.com/)。\n\
  \n你可以使用几乎任何图形程序为你的网站创建和编辑图像，从通常随操作系统附带的简单画图程序，到 Adobe Photoshop 这样昂贵的专业程序。同样，如果你的电脑连接了数字照相机或扫描仪，它可能附带了一些能够创建网页图形的图形软件。还有几种可以下载的（甚至作为\
  \ Web 在线运行）免费图像编辑器，它们专门处理照片元素的编辑。\n\n如果你已经有了你认为可能有助于创建网页图形的软件，尝试用它来完成接下来几个章节中描述的所有内容。如果你的软件无法完成此处涵盖的某些任务，那么它可能不是一个良好的网页图形工具。在这种情况下，请从[`www.gimp.org`](http://www.gimp.org)\
  \ 下载并安装 `GIMP`。这个功能全的图形程序是完全免费的，用于执行本章所示的操作。\n\n如果 GIMP 不适合你，可以考虑下载 Adobe Photoshop\
  \ 或 Corel DRAW 的评估版本。仅用于照片处理，有很多免费选择，且都具有实用的功能。Google 的 Picasa（可以在[`picasa.google.com/`](http://picasa.google.com/)\
  \ 免费获取）就是其中之一。Picnik ([`www.picnik.com/`](http://www.picnik.com/)) 是另一个。这两个程序都适合编辑图像而不是从零开始创建，而且\
  \ Picasa 还侧重于组织你的数字照片集。因此，这类程序并不一定能帮助你为网站设计横幅或按钮图像。然而，这些程序可以帮助你处理一些补充图像，而且它们足够强大，值得尝试。\n\
  \n### 关于图形你最少需要知道的\n\n当你在互联网上发布图形和多媒体时，总有两种力量在相互冲突。用户的眼睛和耳朵希望你的所有内容尽可能详细和准确，他们也希望这些信息立即显示。复杂、色彩丰富的图形意味着大文件大小，这会导致即使在快速连接下也会增加传输时间。你如何在最小化文件大小的同时最大化演示的质量？为了做出这些选择，你需要理解颜色和分辨率如何共同工作产生主观的质量感。\n\
  \n图像的分辨是指构成图像的单个点（或 `pixels`，像素）的数量。大高分辨率图像的传输和显示通常比小低分辨率图像慢。分辨率通常以图像的宽度乘以高度，以像素表示；例如，一张\
  \ 300×200 的图像宽为 300 像素，高为 200 像素。\n\n**注意**\n\n有多种类型的分辨率，包括像素、空间、光谱、时间和辐射分辨率。你可以花费几个小时来学习每种类型；如果你在上图形设计课，你可能会这样做。但现在，你只需要记住的是，大图像下载时间更长，而且会占用大量的显示器空间。在设计网站时，显示尺寸和存储或传输尺寸是你应该考虑的因素。\n\
  \n你可能会惊讶地发现，分辨率并不是图像文件存储大小（以及传输时间）的最重要因素。这是因为用于网页的图像总是以压缩的形式存储和传输。图像压缩是图像经过的数学处理，以挤出重复模式。图像压缩的数学原理很复杂，但基本思想是当图像存储在磁盘上时，重复的模式或相同颜色的大区域可以被挤出来。这使得图像文件小很多，并允许在互联网上更快传输。在后面的章节中，你将学习如何创建具有视觉冲击力但文件大小较小的图形。你实现这些目标所需的技术取决于图像的内容和目的。图形的用途和网页一样多，但有四种类型最为常见：\n\
  \n- 人、产品或地点的照片\n- 图形横幅和 Logo\n- 用于操作的按钮或图标\n- 容器元素的背景纹理\n\n### 准备图像\n\n为了将照片放在你的网页上，你需要将打印照片转换为数字图像，或者通过使用数字照相机创建数字照片。你可能需要使用扫描仪或照相机附带的自定义软件将图片保存到硬盘上，或者你可以直接将文件从相机拖放到硬盘。如果你使用扫描仪创建照片的数字版本，你可以从你选择的任何图形程序中直接控制扫描仪——详情见软件文档。\n\
  \n**提示**\n\n如果你没有扫描仪或数字照相机，几乎所有的冲洗店都提供一种服务，将 35mm 胶片照片传输到 CD 或 DVD 中，费用低廉。你可以将文件从\
  \ CD 或 DVD 复制到硬盘上，然后使用你的图形程序打开并修改图像文件。\n\n将数字图像文件传输到电脑后，你可以使用图形程序对其进行裁剪、调整大小、调色和压缩，为网站使用做好准备。\n\
  \n### 裁剪图像\n\n由于你希望网页图形尽可能紧凑，你通常需要裁剪你的数字照片。当你 `裁剪` 照片时，你选择想要显示的区域，并裁掉其他部分。\n\n###\
  \ 动手尝试：在 GIMP 中裁剪\n\n\n\n\n\nGIMP 工具箱可以快速访问裁剪工具及其可能的属性。找到一个图像文件——可以是你用相机拍摄并存储在硬盘上的数字图像，也可以是你在网上找到的图像。在\
  \ GIMP 中打开该图像后，按照以下步骤在 GIMP 中对其进行裁剪：\n\n1.  在 GIMP 工具箱中，点击裁剪工具（参见图 8.3）。根据你选择的工具，可能会有额外的可以选择的属性。例如，图\
  \ 8.3 显示了裁剪工具的属性（如宽高比例、位置、大小等）。\n\n**图 8.3** 从工具箱中选择裁剪工具。\n\n![image](img/08fig03.jpg)\n\
  \n2.  在你想要裁剪的图像中，点击你想要保留的部分的左上角，并按住左鼠标键拖动到右下角，在选择区域周围画一个框（参见图 8.4）。\n\n**图 8.4**\
  \ 选择你想要显示的图像区域。\n\n![image](img/08fig04.jpg)\n\n3.  点击选择区域的任意角来应用裁剪。\n\n你的图形程序使用的方法可能与所示的不同，但概念是相同的：选择要保留的区域，然后裁剪掉其余部分。\n\
  \n***\n\n即使图像已经经过了裁剪，它可能仍然比网页所需的尺寸要大。根据特定网页的设计，你可能希望将大图像限制在 800×600 像素以内（如果它单独显示在页面上，例如产品目录），甚至是\
  \ 640×480 像素或更小。当与文本一起显示时，图像的宽度通常在 250 到 350 像素之间，这样就有足够的空间显示文本。在某些情况下，你可能还想提供图像的缩略图版本链接到更大的版本，在这种情况下，缩略图的最大尺寸可能会接近\
  \ 100 像素。\n\n***\n\n### 提示\n\n你的图形软件通常会在图像窗口本身的某处无处不在地显示尺寸。在 GIMP 中，可以在窗口顶部看到当前图像尺寸。其他程序可能显示在右下角或左下角。你可能还会看到窗口中的放大比例以及更改该比例（通过放大或缩小）的能力。\n\
  \n***\n\n### 调整图像大小\n\n更改图像尺寸所需的精确工具取决于你正在使用的程序。在 GIMP 中，进入`Image`（图像）菜单并点击`Scale\
  \ Image`（缩放图像）打开`Scale Image`对话框（参见图 8.5）。\n\n**图 8.5** 使用缩放图像对话框更改图像尺寸。\n\n![image](img/08fig05.jpg)\n\
  \n你几乎总是希望使用现有的宽高比例来调整大小，这意味着当你输入想要的图像宽度时，高度将自动计算出来（反之亦然），以防止图像变形。在 GIMP 中，宽高比例默认是锁定的，如图\
  \ 8.5 所示的`Width`（宽度）和`Height`（高度）选项旁显示的链图标所示。点击一次链条即可解锁它，允许你指定自定义的像素宽度和高度——无论是否变形。\n\
  \n***\n\n### 注意事项\n\n与 GIMP 的许多功能一样，`Scale Image`对话框会出现在包含正在调整大小图像的窗口之前。这种布局使你能够在对话框中进行更改、应用更改并立即看到结果。\n\
  \n***\n\n在大多数（如果不是所有）图形程序中，你还可以根据百分比来调整图像大小，而不是提供特定的像素尺寸。例如，如果我的图像最初是 1629×1487，而我不想通过计算来确定显示为一半宽度所需的值，我只需选择`Percent`（百分比，在此情况下从图\
  \ 8.5 所示像素显示旁边的下拉菜单选择）并将默认设置（`100`）更改为`50`。图像宽度随将变为 815 像素宽、744 像素高——我不需要进行任何计算。\n\
  \n### 调整图像颜色\n\n如果你正在编辑照片而不是创建自己的图形，你可能需要使用一些色彩校正工具来让照片恰到完美。像许多图像编辑程序一样，GIMP 提供了调整图像亮度、对比度和色彩平衡的多个选项，以及一个减少讨厌的红眼的滤。要使用\
  \ GIMP 消除红眼，进入`Filters`（滤镜），点击`Enhance`（增强），然后点击`Red Eye Removal`（消除红眼）。\n\n这些选项大部分非常直观。如果你想让图像更亮，就调整亮度。如果你想让图像中有更多红色，就调整色彩平衡。在\
  \ GIMP 中，`Colors`（颜色）菜单让你能够访问许多工具。与上一节描述的`Scale Image`对话框一样，每个工具都会在工作区的前景显示一个对话框。当你调整颜色时，图像会反映这些变化。这种预览功能是大多数图像编辑软件都包含的功能。\n\
  \n图 8.6 显示了`Adjust Hue/Lightness/Saturation`（调整色调/亮度/饱和度）工具，这是色彩菜单提供的许多工具之一。如图所示，通过使用对话框中的滑块许多色彩变化。`Preview`功能允许你在操作时看到效果。`Reset\
  \ Color`（重置颜色）按钮将图像恢复到初始状态。\n\n**图 8.6** 调整色调/亮度/饱和度工具是许多基于滑块的色彩修改工具之一。\n\n![image](img/08fig06.jpg)\n\
  \n由于你有许多可用工具并且每个工具都有预览功能，一些实验是了解每个工具作用的最佳方法。\n\n### 控制 JPEG 压缩\n\n网页上的照片以 JPEG 格式保存比\
  \ GIF 更好；JPEG 允许你在保留文件中色彩的同时，将整体文件大小控制在合理的范围内。当你完成照片尺寸和外观调整后，选择`File`（文件）、`Save\
  \ As`（另存为）并选择`JPEG`作为文件类型。你的图形程序可能会为你提供另一个对话框，你通过它可以控制各种 JPEG 选项，例如压缩。\n\n图 8.7\
  \ 显示了你在 GIMP 中保存 JPEG 时看到的`Save as JPEG`对话框。你可以看到可以通过调整`Quality`（质量）滑块在`1`（低质量，小文件）和`100`（高质量，大文件）之间移动来控制保存\
  \ JPEG 文件的压缩率。\n\n你可能想实验一下不同的 JPEG 压缩级别如何影响图像质量，但对于大多数照片来说，85% 的质量（或 15% 的压缩）在文件大小（以及下载速度）和质量之间通常是一个很好的折中。\n\
  \n### 创建横幅和按钮\n\n从头创建的图形（如横幅和按钮）需要你考虑与照片完全不同的因素。\n\n\n\n\n\n# 在制作横幅或按钮时，你需要做的决定是它们的大小。现在大多数访问网页的人都有一台屏幕分辨率至少为\
  \ 1024×768 像素的电脑，甚至更大。例如，我的屏幕目前设置为 1440×900 像素。通常情况下，你应该规划你的图形，使其始终能够适应较小的屏幕（1024×768），并为滚动条和边距留出足够的空间。关键的尺寸限制是页面的水平宽度，因为水平滚动页面对于网页用户来说是一个巨大的麻烦，也是困惑的来源。垂直滚动页面的接受度要得多，所以即使你的页面比最小屏幕尺寸高，也没关系。\n\
  \n### 提示\n多年来，针对 800×600 屏幕分辨率进行设计一直是标准。仍请记住这个低数值，因为许多人并没有以全屏模式打开应用程序。然而，针对 1,024×768\
  \ 基准屏幕分辨率进行设计并不是一个坏主意。\n\n假设你的目标最小分辨率是 800×600 像素，那么全尺寸的横幅和标题图形的宽度不应超过 770 像素，高度不超过\
  \ 430 像素，这是在考虑到滚动条、工具栏和浏览器窗口的其他部分后页面的最大可见区域。在页面内，普通照片和艺术作品的每个维度都应在 100 到 300 像素之间，较小的按钮和图标的高度和宽度应在\
  \ 20 到 100 像素之间。显然，如果你为 1024×768 分辨率进行设计，你有更多的屏幕“领地”可以利用，但横幅、按钮和其他辅助图形的尺寸指南仍然有效。\n\
  \n要在 GIMP 中创建新图像，转到 `File`（文件）并选择 `New`（新建）。会显示“创建新图像”对话框（参见图 8.8）。如果你不确定图像需要多大，只需接受\
  \ 640×480 的默认尺寸即可。或者你也可以从 `Template`（模板）下拉列表中选择其他预设尺寸，例如 `Web banner common 468×60`\
  \ 或 `Web banner huge 728×90`。这两个设置确实被认为是网站横幅的“常见”和“巨大”。否则，输入新图像的宽度和高度。\n\n**图 8.8**\
  \ 在开始处理图像之前，你需要决定图像的大小。\n\n![image](img/08fig08.jpg)\n\n对于图像的背景颜色，你通常应该选择白色，以匹配大多数网页浏览器用于网页的背景（尽管正如你在上一章中学到的，那种颜色是可以更改的）。当你知道将创建一个非白色背景的页面时，你可以为你的图像选择不同的背景颜色。或者你可能想创建一个完全没有背景的图像，在这种情况下你将选择\
  \ `Transparency`（透明）作为背景颜色。当图像背景透明时，图像背后的网页允许显示图像的这些区域。在 GIMP 中，通过打开“创建新图像”对话框中的\
  \ `Advanced Options`（高级选项），为新图像选择背景颜色。\n\n当你以像素为单位输入图像的宽并点击 `OK` 时，你会面对一个空白画布——如果你像我们大多数人一样恐艺术的话，这真是一个令人胆畏的景象！然而，因为有这么多图像创建教程（更不用整本书了）可以引导你完成整个过程，所以我放心让你自己发挥创意。这一节完全是向你介绍在为你的网站制作图形时需要记住的事项。这一节并不一定教你具体如何做，因为熟悉你所选择的工具是精通它们的第一步。\n\
  \n### 减少图像中的颜色数量\n\n减少图像尺寸（从而缩短下载时间）最有效的方法之一是减少图像使用的颜色数量。这会大幅降低某些照片图像的视觉质量，但对于大多数横幅、按钮和其他图标效果非常好。\n\
  \n你会很高兴地知道，对于颜色有限的图像，有一种特殊的格式格式；它被称为 `Graphics Interchange Format (GIF)`（图形交换格式）。当你将图像保存为\
  \ `GIF` 时，系统可能会提示你合并图或通过转换为索引图像来减少颜色数量，因为这些是 GIF 的要求，如图 8.9 所示。对话框只会要求你确认保存过程将为你执行的这些更改——目前不必担心理解这些选项，但请阅读你软件中关于层和索引颜色的帮助文件以获得充分理解。\n\
  \n**图 8.9** 在将图像保存为 `GIF` 时，系统可能会提示将其转换为索引调色板。\n\n![image](img/08fig09.jpg)\n\n\
  ### 提示\n*抖动*（Dithering）是图像编辑程序使用的一种技术，通过交替两种相似色的像素来模拟调色板中的颜色。例如，抖动的粉色由交替的红色和白色像素组成，这将产生粉色的整体。。抖动某些情况下可以让图像看起来更好，但通常应避免用于网页图形。为什么呢？它大幅增加了图像的信息复杂性，这通常会导致文件大小大得多。\n\
  \n记住，`GIF` 格式用于包含实色区域的图像，例如网页标题和其他插图；`GIF` 格式不适合照片。\n\n`PNG`（读作 \"ping\"）是另一种所有主流浏览器都支持的有用格式。尽管\
  \ `GIF` 格式允许指定一种透明颜色，这意味着背景将显示出来，但 `PNG` 格式通过允许不同的透明度进一步\n\n### 处理透明图像\n\n你可能见过某些网站在容器元素中使用背景颜色或图像，但同时又使用了允许背景显示的前景图像。在这种情况下，前景图像的部分是透明的，因此背景可以显示出来。使用这些部分透明图像可以使图形在你可能放置的任何背景颜色或背景图像上看起来良好。\n\
  \n要使图像的一部分透明，图像必须保存为 `GIF` 或 `PNG` 文件格式。正如本章之前提到的，大多数支持 `GIF` 格式的图形程序允许指定一种透明颜色，而\
  \ `PNG` 图像允许一系列透明度。由于由于这种透明度范围，`PNG` 格式优于 `GIF`。所有现代网络浏览器都支持 `PNG` 图像。有关 `PNG` 格式的更多信息，请访问\
  \ [`www.libpng.org/pub/png/pngintro.html`](http://www.libpng.org/pub/png/pngintro.html)。\n\
  \n创建透明图像的过程取决于你创建的图像类型（`GIF` 或 `PNG`）以及你使用的图形软件。操作说明请查看你图形程序的帮助文件，或在搜索引擎中输入 **transparent\
  \ images with [你的程序]**。\n\n### 创建平铺背景\n\n任何 `GIF` 或 `JPEG` 图像都可以作为容器元素内的背景平铺。然而，在你创作平铺背景之前，特别是创建一个图案复杂的平铺背景之前，请问问自己那个平铺背景为你的网站的整体视觉效果增加了什么，更重要的是，问问自己当文字放在该图案上时是否仍然易读。\n\
  \n\n\n\n回想你每天访问的网站，你会发现很少有网站在整个页面上使用平铺的图案背景。如果你将浏览范围限制在公司、产品、体育队或其他以信息（主要是文本）为核心的网站，那么带有平铺图案背景的网站数量会进一步减少。虽然\
  \ Web 赋予了每个人设计上的个性化，但如果你正在为自己的业务创建一个网站，你可能希望避免使用带有对比色文字的高图案背景。\n\n如果你确实为整个网站使用了平铺的图案背景图，请记住，只有当你看不出它们是平铺的时，效果才是最好的。换句话说，当背景瓷砖顶边缘与底部无缝衔接，左边缘与右边缘匹配时，你就知道有一张很好的图片。\n\
  \n图 8.10 和 8.11 显示了背景瓷砖的应用，两者都使用了无缝背景，但效果程度不同。\n\n**图 8.10** 这是一个无缝背景图的示例，由于你可以看到六个相同的形状，因此看出背景是平铺的。\n\
  \n![image](img/08fig10.jpg)\n\n**图 8.11** 这也是一个无缝背景图的示例，只是你看不出它是平铺的。\n\n![image](img/08fig11.jpg)\n\
  \n在本章的后续部分，你将学习如何如何在容器元素中放置背景图像。尽管我在这一节中出了警告，但实际上在某些情况下，背景图像可以成为你设计库中的强大武器——只是不是当它们作为整个页面背景时。\n\
  \n> 提示\n 如果你真的想使用平铺瓷砖，但似乎无法得到想要的图案，你可以查看互联网上数百个提供公领域背景图的网站，这些图片免费或价格低廉，而且设计专业。\n\
  \n### 创建动画网页图形\n\nGIF 图像格式允许你创建动画图像，用于添加一些动作来为任何网页增添色彩。动画 GIF 图像传输速度也比大多数用于类似效果的视频或多媒体文件快。通过\
  \ GIMP，你可以在图像中创建多个层，然后在保存文件时修改动画 GIF 选项来创建动画 GIF。此外，如果你有一系列想要制作动画的图像，可以使用 Gickr\
  \ 提供的免费 Web 端 GIF 动画服务（[`www.gickr.com/`](http://www.gickr.com/)）。\n\n创建 GIF 动画的第一步是创建一系列连续显示的图像——或者是一系列层，取决于你具体的软件程序。这些图像中的每一个被称为\
  \ `frame`（帧）。顺便说一下，这个 `frame` 一词的使用与你在第 20 章中学习的“使用窗口和框架”中的 `frames` 完全无关。相反，请把帧想象成电影或卡通片的组合方式——你在屏幕上看到的图像是由许多外观略有不同的单个帧组成的。一旦你构思好了帧，将它们结合起来相对简单——最困难的是规划阶段。花时间画脚本，特别是如果你计划使用几帧以上。当你知道你的帧将如何组合在一起后，使用本节提到的\
  \ Gickr 服务，或阅读你图形软件的文档，以学习其整合所有内容的特定流程。\n\n### 动手尝试：为你的网站准备图像\n\n你现在应该准备好二三张图像，以便在你跟随学习本章剩余内容时，尝试将它们放在你自己的页面上。如果你已经保存了一些\
  \ GIF、PNG 或 JPEG 格式的图像（文件名以 `.gif`、`.png` 或 `.jpg` 结尾），请使用它们。使用你在阅读上一节时创建的任何图形也可以的。\n\
  \n搜索引擎（如 Google）可以通过引导你访问与自己主题相关的网站，成为图像金矿。搜索引擎还可以帮助你发现大量专门提供免费和廉价可重用媒体集合的网站。此外，不要忘记微软在\
  \ Office Online Clip Art and Media 网站上的巨大素材库，位于 [`office.microsoft.com/clipart/`](http://office.microsoft.com/clipart/)。其他价值源来源包括\
  \ Google Images（[http://images.google.com/](http://images.google.com/））和 Flickr（[http://www.flickr.com](http://www.flickr.com））——寻找使用\
  \ Creative Commons 许可且允许署名免费使用的图像。\n\n### 在网页上放置图像\n\n要在网页上放置图像，首先将图像文件移动到与 HTML\
  \ 文件相同的文件夹中，或者命名为 `images` 的目录中以便组织。\n\n在文本中希望图像出现的地方插入以下 HTML 标签。使用你的图像文件名代替 `myimage.gif`：\n\
  \n```html\n<img src=\"myimage.gif\" alt=\"My Image\" />\n```\n\n> 注意\n对于 Web 服务器、\
  \ 浏览器或最终用户来说，你把图像放在哪里并不重要，只要你知道它们在哪里并在 HTML 代码中使用了正确的路径。\n\n如果你的图像文件在文档根目录下的 images\
  \ 目录中，你将使用以下代码：\n\n```html\n<img src=\"/images/myimage.gif\" alt=\"My Image\" />\n\
  ```\n\n\n\n从理论上讲，你可以在自己的页面包含来自任何网站的图像。在这种情况下，每当你的页面显示时，图像都会从另一个页面的 Web 服务器进行检索。你可以这样做，但你不应该这样做！这不仅是一种不礼貌，因为你正在为了个人利益而使用他人的带宽，而且还会让你的页面显示变慢。此外，你无法控制图像何时可能被更改或删除。\n\
  \n如果你被许可重新发布另一个网页上的图像，请务必将该图像的副本传输到你的计算机，并使用本地文件引用，例如 `<img src=\"myimage.jpg\"\
  \ />`，而不是 `<img src=\"http://www.otherserver.com/theirimage.jpg\" />`。然而，当你将图像（如照片）托管在专门的图像存储服务上时——例如\
  \ Flickr ([`www.flickr.com/`](http://www.flickr.com/))——这条建议并不适用。像 Flickr 这样的服务会为每张图像提供一个\
  \ URL，且每个 URL 的地址中包含 Flickr 的域名。\n\n***\n\n如果你猜 `img` 代表 `image`（图像），你是对的。`src`\
  \ 代表 `source`（源），它是图像文件位置的引用。正如本书开头讨论的，图像始终存储在与文本分离的文件中，尽管在浏览器中查看时它似乎是同一个页面的一部分。\n\
  \n就像用于超链接的 `<a href>` 标签一样，你可以在 `<img />` 标签的 `src` 属性中指定任何完整的 Internet 地址。或者，如果图像位于\
  \ HTML 相同的文件夹中，你可以仅指定文件名。你也可以使用相对地址，例如 `/images/birdy.jpg` 或 `../smiley.gif`。\n\n\
  ### 使用文本描述图像\n\nListing 8.2 中的每个 `<img />` 标签都包含一条短文本消息，例如 `alt=\"Half Dome\"`。`alt`\
  \ 代表 `alternate text`（备用文本），如果图像没有加载，则会出现在图像所在位置的消息。如果地址错误、用户在 Web 偏好中关闭了自动下载图像，或者\
  \ Internet 连接非常慢且数据尚未传输，图像可能无法加载。图 8.13 显示了替代图像的 `alt` 文本的示例。\n\n**图 8.13** 当图像未出现时，用户将看到\
  \ `alt` 消息。\n\n![image](img/08fig13.jpg)\n\n即使图形已完全加载并在 Web 浏览器中可见，每当鼠标指针悬过图像时，`alt`\
  \ 消息通常也会出现在一个小框中（被称为 `tool tip` 工具提示）。`alt` 消息还有助于任何视觉障碍的用户（或使用基于语音的界面读取网页的用户）。\n\
  \n你必须在网页上的每个 `<img />` 标签中包含一个合适的 `alt` 属性，考虑到人们看到该消息的各种情况。对图像进行简要描述通常是最好的，但网页作者有时会在\
  \ `alt` 消息中放入简短的广告信息或微妙的幽默；然而，幽默过多而信息不足是不受欢迎的。对于较小或不重要的图像，完全省略 `alt` 消息很有吸引力，但它是\
  \ `<img />` 标签的必选属性。这并不意味着你的页面将无法正常显示，但这意味着你违反了最新的 XHTML 标准。如果你绝对不需要它，我建议给 `alt`\
  \ 分配一个空文本消息（`alt=\"\"`），这对于小型或装饰性图像有时是需要的。\n\n`title` 属性并不是 `<img />` 标签要求的，但它的功能与\
  \ `alt` 属性类似；事实上，如果两个属性都存在，`title` 属性将取代 `alt` 属性作为工具提示。知道这一点，通过文本描述图像的最佳方法是同时使用\
  \ `alt` 属性和 `title` 属性，为图像提供相关的注释或帮助提示，你认为这些信息在作为工具提示或通过屏幕阅读器软件查看时有用。\n\n### 指定图像的高度和宽度\n\
  \n由于文本在 Internet 上的传输速度远快于图形，大多数 Web 浏览器会在显示图像之前先显示页面上的文本。这让用户在等待图片显示时有内容可读，使得整个页面看起来加载更快。\n\
  \n通过显式地指定每张图像的高度和宽度，你可以确保页面上的所有内容都能尽可能快出现在正确的位置。这样，Web 浏览器在布局页面以及等待图像传输完成时，就可以立即准确地为每个图像留出空间。\n\
  \n对于你想在网站中的每张图像，你可以使用图形程序确定其精确的像素高度和宽度。你可能还可以通过系统工具找到这些图像属性。例如，在 Windows 中，你可以通过右键点击图像、选择“属性”，然后选择“详细信息”来查看图像的高度和宽度。知道图像的高度和宽度后，你可以将其尺寸包含在\
  \ `<img />` 标签中，如下：\n\n```html\n<img src=\"myimage.gif\" alt=\"Fancy Picture\" width=\"\
  200\" height=\"100\" />\n```\n\n***\n\n**提示：** 为图像指定的和宽度不需要与图像的实际高度和宽度匹配。Web 浏览器会尝试压缩或拉伸图像以显示你指定的任何尺寸。然而。\n\
  \n\n\n\n酋长岩（El Capitan）是优美地国家公园内一个高 3000 英尺（910 米）的垂直岩层，位于优美地谷北侧，靠近其西端。这座花岗岩单岩是全球攀岩者最喜爱的挑战之一。1851\
  \ 年，马里波萨营团在探索该山谷时将其命名为“酋长岩”。\n\n隧道景观（Tunnel View）是位于 41 号州道上的一个观景点，从南方进入优美地谷时，它直接位于瓦奥纳隧道东侧。从该处可以向东望整个优美地谷，包括酋长岩的西南面、半圆顶和新娘纱瀑布。对许多人来说，这是对优美地热门景点的初印象。\n\
  \n## 注意\n请注意列表 8.3 中使用的两个 `<img/>` 标签的样式属性中都添加了内边距（padding）。这种内边距在图像和文本之间提供了一些呼吸空间——图像四边均为\
  \ 6 像素。你将在第 9 章“处理外边距、内边距、对齐和浮动](#ch09.html_ch09)”中学习更多关于内边距的知识。\n\n## 图像垂直对齐\n\
  有时，你可能想在行文本中间插入一张小图像；或者你想在图像旁边放置单行文本作为说明。无论何种情况，控制文本和图像的垂直对齐方式都会非常方便。应该是图像的底部与字母底部对齐，还是让文本和图像的中部都对齐？你可以在这些及其他几个选项之间进行选择：\n\
  \n- 要将图像顶部与同一行中最高的图像或字母顶部对齐，请使用 `<img style=\"vertical-align:text-top\" />`。\n-\
  \ 要将图像底部与文本底部对齐，请使用 `<img style=\"vertical-align:text-bottom\" />`。\n- 要将图像中间与行内所有内容的垂直中心对齐，请使用\
  \ `<img style=\"vertical-align:middle\" />`。\n- 要将图像底部与文本基线（baseline）对齐，请使用 `<img\
  \ style=\"vertical-align:baseline\" />`。\n\n## 注意\n`vertical-align` 样式属性也支持 `top`\
  \ 和 `bottom` 值，它们可将图像与元素的整体顶部或底部对齐，无论行中是否有任何文本。\n\n这四个选项都用于列表 8.4 并并在图 8.15 中显示。现在有四张缩略图垂直列出在页面上，每张图像旁边都有描述性文本。使用了\
  \ `vertical-align` 样式属性的不同设置来对齐每张图像及其相关文本。\n\n**图 8.15** 显示了列表 8.4 中使用的图像垂直对齐选项。\n\
  \n![image](img/08fig15.jpg)\n\n列表 8.4 使用 `vertical-align` 样式对齐文本与图像\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>小而壮丽的优美地景观</title>\n\
  \  </head>\n  <body>\n    <h1>小而壮丽的优美地景观</h1>\n    <p><img src=\"elcap_sm.jpg\"\
  \ alt=\"El Capitan\" width=\"100\" height=\"75\" style=\"vertical-align:text-top;\"\
  <<strong>酋长岩</strong> 是是优美地国家公园内一个高 3000 英尺（910 米）的垂直岩层。</p>\n    <p><img src=\"\
  tunnelview_sm.jpg\" alt=\"Tunnel View\" width=\"100\" height=\"80\" style=\"vertical-align:text-bottom;\"\
  <<strong>隧道景观</strong> 是向东望向优美地谷。</p>\n    <p><img src=\"upperyosefalls_sm.jpg\"\
  \ alt=\"Upper Yosemite Falls\" width=\"87\" height=\"100\" style=\"vertical-align:middle;\"\
  <<strong>优美地上瀑布</strong> 高 1430 英尺，是世界上排名最高的 20 个瀑布之一。</p>\n    <p><img src=\"hanging_sm.jpg\"\
  \ alt=\"Hanging Rock\" width=\"100\" height=\"75\" style=\"vertical-align:baseline;\"\
  <<strong>悬挂岩</strong>，位于冰川点，曾是人们悬挂的热门景点。</p>\n  </body>\n</html>\n```\n\n### 提示\n\
  如果在 `<img />` 标签中不包含任何 `align` 属性，则图像的底部将与其旁边的任何文本的基线对齐。这意味着你永远不需要输入 `style=\"vertical-align:baseline\"\
  `，因为这是默认假设的。然而，如果你为图像指定了外边距（margin），并希望对齐与文本更加精确，你可能希望显式地将 `vertical-align` 属性设置为\
  \ `text-bottom`。查看图 8.15 中显示的最后一张图像。\n\n### 将图像转换为链接\n你可能在图 8.12 中注意到，优美地谷的图像很大，当你尝试展示多个图像时，这并不理想。在这种情况下，使用缩略图链接到更大版本会更合理。你可以使用\
  \ `<a>` 标签来包裹图像，正如列表 8.5 所示，这样可以方便用户点击缩略图查看完整图像。为了确保用户知道可以点击图像，可以在 `<div>` 中包含辅助文本，如图\
  \ 8.16 所示。\n\n**图 8.16** 使用缩略图作为链接改进了页面布局，这些优美地景观。\n\n![image](img/08fig16.jpg)\n\
  \n列表 8.5 使用缩略图实现有效的图像链接\n\n\n\n\n从南部进入约瑟米谷时，可以看到位于瓦奥纳隧道（Wawona Tunnel）正东的 41 号州道的景观。视野向东望入约瑟米谷，包括酋长岩（El\
  \ Capitan）的西南面、半圆顶（Half Dome）以及婚纱（Bridalveil Falls）。对许多人来说，这是约瑟米热门景点的首次印象。\n\nListing\
  \ 8.5 中的代码使用了后续章节将详细解释的额外样式，但你应该能够推出基本原理：\n\n- `<a>` 标签将这些特定的图像链接到更大的版本，在这种情况下，这些版本存储在外部服务器（Flickr）上。\n\
  - `<div>` 标签及其样式用于对齐这些组图形和说明文字（并包含包含一些内边距）。\n\n除非另有说明，否则网页浏览器会在每个图像链接的边缘显示一个彩色矩形。与文本链接一样，如果链接最近没有访问过，矩形通常显示为蓝色；如果最近访问过，则显示为紫色——除非你在样式表中指定了不同颜色的链接。因为你很少（如果有的话）想在链接的图像周围出现这条丑陋线，所以通常应该在链接内的任何\
  \ `<img />>` 标签中包含 `style=\"border:none\"`。在这种情况下，`border:none` 样式被作为 `img` 元素的样式表条，因为我们使用了两次相同的样式。\n\
  \n当你点击所示示例页面上的一个缩略图时，链接会在浏览器中打开，如图图 8.17 所示。\n\n**图 8.17** 点击链接的缩略图将打开链接的目标页面。\n\
  \n![image](img/08fig17.jpg)\n\n### 使用背景图像\n\n正如你在本章前面学到的，可以使用背景图像作为容器元素中的某种壁纸，以便文本或其他图像显示在这一底层设计之上。\n\
  \n共同工作以创建背景的基本样式属性如下：\n\n- `background-color`——指定元素的背景颜色。虽然与图像无关，但它是背景相关属性集的一部分。\n\
  - `background-image`——使用以下语法指定作为元素背景的图像：`url('imagename.gif')`。\n- `background-repeat`——指定图像在水平和垂直方向上如何重复。默认情况下（不指定任何内容），背景图像将在水平和垂直方向上重复。其他选项有\
  \ `repeat`（同默认）、`repeat-x`（水平）、`repeat-y`（垂直）和 `no-repeat`（图形仅出现一次）。\n- `background-position`——指定图像相对于容器的初始位置。选项包括\
  \ `top-left`、`top-center`、`top-right`、`center-left`、`center-center`、`center-right`、`bottom-left`、`bottom-center`、`bottom-right`\
  \ 以及特定的像素和百分比位置。\n\n指定背景图像时，你可以将所有这些规格组合组合属性，如下：\n\n```css\nbody {\n    background:\
  \ #ffffff url('imagename.gif') no-repeat top right;\n}\n```\n\n在之前的样式表中，网页的`body`元素将是白色，并在右上包含名为\
  \ `imagename.gif` 的图形。`background`属性的另一个用途是为无序列表创建自定义项目符号。要使用图像作为项目符号，首先如下所示定义 `<ul>`\
  \ 标签的样式：\n\n```css\nul {\n  list-style-type: none;\n  padding-left: 0;\n  margin-left:\
  \ 0;\n}\n```\n\n接下来，将 `<li>` 标签的声明更改：\n\n```css\nli {\n  background: url(mybullet.gif)\
  \ left center no-repeat\n}\n```\n\n确保 `mybullet.gif`（或你命名的任何图形）位于网络服务器并可以访问；在这种情况下，所有无序列表项将显示你的自定义图像，而不是标准的实心圆点。\n\
  \n我们将在第三部分“使用 CSS 进行高级网页设计”中用 CSS 进行整体页面布局时，回到背景属性的具体用法。\n\n### 使用图像映射（Imagemaps）\n\
  \n有时你可能想使用图像作为导航，而不仅仅是网站中常见的基于按钮或链接的导航。例如，你可能有一个包含医疗信息的网站，你想显示一张人体图像，链接到提供各个身体部位信息的页面。或者，你有一个提供世界地图的网站，用户可以点击它访问有关国家的信息。你可以根据用户在图像内的点击位置，将图像划分为链接到不同文档的区域。这被称为*图像映射（imagemap）*，任何图像都可以变成图像映射。\n\
  \n#### 为什么图像映射并非总是必要的\n\n关于图像映射你应该知道的第一点是，除非在非常特殊的情况下，否则你可能不需要使用它们。使用几个直接放置在一起的普通图像并为每个图像提供单独的链接通常更简单更高效。\n\
  \n例如，参见图 8.18。这是一个显示 12 个不同公司标志的网页；这种示例是商界中常见的网页类型，即你为合作伙伴提供一点免费的广告。你*可以*将这些标志作为一张大图呈现，并创建一个为每个标志提供链接的图像映射。\n\
  \n**图 8.18** 显示 12 个不同公司标志的网页；这种示例是商界中常见的网页类型，每个图像都有单独链接。\n\n![image](img/08fig18.jpg)\n\
  \n图像映射对于具有许多部分、布局奇特或设计本身难以拆分成单独图像的图像是选择。图 8.19 显示了最适合作为图像映射的图像。\n\n**图 8.19** 一个不适合被拆分的图像。\n\
  \n![image](img/08fig19.jpg)\n\n#### 在图像内进行映射\n\n要创建任何类型的图像映射，你都需要确定图像内你想转换为链接的每个区域的像素坐标。这些可点击链接也被称为*区域*。你的图形程序可能为你提供查找这些坐标的简单方法。或者你可能想使用独立的图像映射工具，例如\
  \ Mapedit ([`www.boutell.com/mapedit/`](http://www.boutell.com/mapedit/)) 或在线图像映射制作工具\
  \ [`www.image-maps.com/`](http://www.image-maps.com/)。除了帮助映射坐标，这些工具还提供了使映射工作所需的\
  \ HTML 代码。\n\n使用图像映射工具通常就像使用鼠标在你想要链接的区域周围绘制矩形（或自定义形状）一样简单。图 8.20 显示了这些矩形选择之一的结果，以及添加\
  \ URL 和标题或备用文本的界面。创建图像映射的 HTML 需要若干信息：坐标、目标 URL、链接标题和链接的备用文本。\n\n**图 8.20** 使用图像映射工具创建单个图形的链接区域。\n\
  \n![image](img/08fig20.jpg)\n\n### 动手尝试：创建你自己的图像映射\n\n如果你在继续学习本章时，获取自己的图像并将其转换为图像映射，你可能会记住如何制作图像映射：\n\
  \n- 开始时，选择一个视觉上划分为大致矩形区域的大图像是最容易的。\n\n\n\n\n\n- 如果你手头没有合适的图片，可以使用你最喜欢的图形程序制作一张。也许可以使用一张一张显示有多个人的照片，并将每个人都用作图像映射（imagemap）的一个区域。\n\
  - 尝试几种不同的图像映射工具，以确定你最喜欢哪一个。先从独立软件开始，如 `MapEdit` ([`www.boutell.com/mapedit/`](http://www.boutell.com/mapedit/))，然后转向\
  \ [`www.image-maps.com/`](http://www.image-maps.com/) 上的图像映射制作器。还有其他工具；使用你喜欢的搜索引擎来查找图像映射软件主题的变体。\n\
  \n***\n\n### 为图像映射创建 HTML\n\n如果你使用图像映射生成器，你已经拥有了创建图像映射所需的 HTML。然而，了解代码的各个部分是一个好主意，这样你就可以检查它的准确性。启动任何图像映射都需要以下\
  \ HTML 代码：\n\n```html\n<map name=\"mapname\">\n```\n\n请记住，你可以为 `<map>` 标签的 `name`\
  \ 属性使用你想要的任何名称，尽管尽可能具有描述性会越有帮助。接下来，你需要为图像的每个区域提供一个 `<area />` 标签。下面是在映射-a-map 图像映射示例中使用的单个\
  \ `<area />` 标签示例：\n\n```html\n<area shape=\"rect\" coords=\"100,136,116,152\"\n\
  \    href=\"http://www.whitmancounty.org/\"\n    alt=\"Whitman County, WA\"\n  \
  \  title=\"Whitman County, WA\" />\n```\n\n此 `<area />` 标签有五个属性，你将在图像映射中描述的每个区域都使用它们：\n\
  \n- `shape` 表明区域是矩形（`shape=\"rect\"`）、圆形（`shape=\"circle\"`）还是不规则多边形（`shape=\"poly\"\
  `）。\n- `coords` 提供区域的精确像素坐标。对于矩形，给出左上角的 `x,y` 坐标，然后是右下角的 `x,y` 坐标。对于圆形，给出 `x,y`\
  \ 中心点，然后是以像素为单位的半径。对于多边形，按连点的顺序列出所有顶点的 `x,y` 坐标。\n- `href` 指定区域链接到的页面。你可以使用在普通 `<a\
  \ href>` 链接标签中使用的任何地址或文件名。\n- `alt` 允许你提供一段与形状相关的文本。大多数浏览器（Firefox 除外）当用户将鼠标悬停在形状上时，会在小框中显示此文本。这段文本为那些可能没有意识到自己正在看图像映射的用户提供了细微但重要的视觉提示。Firefox\
  \ 在使用 `alt` 属性外，还正确地使用了 `title` 属性来提供视觉提示，这就是为什么正如在本章前面提到的，你应该同时使用这两个属性。\n\n图像映射中的每个不同可点击区域都必须描述为单个区域，这意味着一个典型的图像映射由区域列表组成。在编写完\
  \ `<area />` 标签后，你就完成了对图像映射的定义，因此用闭合的 `</map>` 标签结束工作。\n\n创建图像映射的最后一步将其连接到实际的地图图像。使用普通的\
  \ `<img />` 标签将地图放在页面上。但是，有一个额外的 `usemap` 属性，其代码如下：\n\n```html\n<img src=\"map.png\"\
  \ usemap=\"#countymap\"\n    style=\"border:none; width:650px; height:509px\"\n\
  \    alt=\"Native Peoples Census Map\" />\n```\n\n在指定 `usemap` 属性的值时，使用你在 `<map>`\
  \ 标签的 `id` 中放入名称（不要忘记 `#` 符号）。还包含 `style` 属性以指定图像的高度和宽度，并关闭图像映射周围的边框，你可能选择在自己的图像映射中保留或保留边框。\n\
  \n代码 8.6 显示了包含地图图形、其图像映射和几个映射区域的示例页面的完整代码。\n\n代码 8.6 使用 `<map>` 和 `<area />` 标签定义图像映射的区域\n\
  \n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n  \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Testing an Imagemap</title>\n  </head>\n  <body>\n    <h1>Testing an Imagemap</h1>\n\
  \    <p style=\"text-align:center\">点击 logo 进入该\n    县的网站。<br/>\n    <img src=\"\
  map.png\" usemap=\"#countymap\"\n      style=\"border:none; width:650px;height:509px\"\
  \n      alt=\"Native Peoples Census Map\" /></p>\n    <map name=\"countymap\" id=\"\
  countymap\">\n      <area shape=\"rect\" coords=\"100,136,116,152\"\n        href=\"\
  http://www.whitmancounty.org/\"\n        alt=\"Whitman County, WA\"\n        title=\"\
  Whitman County, WA\" />\n      <area shape=\"rect\" coords=\"29,271,42,283\"\n \
  \       href=\"http://www.sccgov.org/\"\n        alt=\"Santa Clara County, CA\"\n\
  \        title=\"Santa Clara County, CA\" />\n      <area shape=\"rect\" coords=\"\
  535,216,548,228\"\n        href=\"http://www.visitingflincounty.com/\"\n       \
  \ alt=\"Whitman County, WA\"\n        title=\"Whitman County, WA\" />\n    </map>\n\
  \  </body>\n</html>\n```\n\n***\n\n注意\n\n如果你是一个细节控，你可能注意到（查看代码的第一几行）——这个示例使用了 XHTML\
  \ 1.1。事实上事实上，某些浏览器（Internet Explorer）在支持方面有所落后。\n\n***\n\n### 将多媒体集成到你的网站\n\n现在你已经学会了如何处理静态图像，下一步自然是处理多媒体。*多媒体*一词涵盖了我们在网页上看到和听到的一切：音频、视频、动画以及静态图像和文本。在本节中，你不会学习如何创建任何特定的音频、视频或动画，但你将学习如何链接或嵌入将这些文件包含在你的网站中。\n\
  \n\n\n\n\n-   互联网上的大部分材料都是免费的。当然，向内容的作者或当前所有者进行双重检查仍然是一个好主意；你不想因侵犯版权而被起诉。此外，美国政府的各个办事机构产生的内容根据法律属于所有美国人。（例如，在网上找到的任何\
  \ NASA 视频片段都可以供你免费使用。）\n\n-   许多搜索引擎（[google.com](http://google.com)、[yahoo.com](http://yahoo.com)、[bing.com](http://bing.com)\
  \ 等）都具有寻找多媒体文件的特定搜索功能。只要你注意版权问题，这就是寻找与特定主题相关的多媒体文件的简单方法。简单搜索 `sample Flash animations`、`sample\
  \ QuickTime movie` 或 `sample audio files` 产生的结果将远超你的处理能力。\n\n-   如果你有创作倾向，请确定你最喜欢的媒介——对于你的一些人来说，可能是视频制作，另一些人可能喜欢音频制作，而还有一些人可能想尝试动画。在确定了起点后，研究各种能够让你创作此类艺术杰作的软件。许多公司提供多媒体软件，例如\
  \ Adobe ([`www.adobe.com/`](http://www.adobe.com/)) 和 Apple ([`www.apple.com/`](http://www.apple.com/))。\n\
  \n## 链接到多媒体文件\n\n将视频或音频文件纳入你的网站的最简单且可靠的方法是直接使用 `<a href>` 将其链接，就像你链接到另一个 HTML 文件一样。\n\
  \n> 注意：无论本章显示的特定媒体类型如何，无论你选择哪种媒体格式，将多媒体整合到网页中所示所示程序都是相似的。\n\n例如，可以使用以下行来提供一个冰球比赛的\
  \ MOV 视频：\n\n```html\n<a href=\"hockey.mov\">View the hockey video clip.</a>\n```\n\
  \n当用户点击 `View the hockey video clip.` 时，`hockey.mov` QuickTime 视频文件将从你的网络服务器传输到她的计算机。无论她安装了哪种辅助应用程序或插件，文件下载完成后，它会自动启动。如果找不到兼容的辅助程序或插件，网络浏览器将提供一个让她下载适当的插件或将视频保存到她的硬盘上以便日后查看。\n\
  \n> 注意：如果你不熟悉*辅助应用程序*（简称为 *helper apps*），它们是网络浏览器调用以显示它无法处理的任何类型文件的外部程序。通常，与文件类型关联的辅助应用程序在网络浏览器无法单独显示该类型文件时被调用。\n\
  \n`Plug-ins` 是一种直接安装在网络浏览器中的特殊辅助应用程序，它们允许你直接在浏览器窗口内查看多媒体内容。\n\n点击操作将导致浏览器在插件帮助下播放视频（如果找到了可以播放该片段的插件），或者推迟给合适的辅助应用程序。\n\
  \n如果你将链接从 `pond.wmv`（Windows Media）更改为 `pond.mov`（QuickTime），你的浏览器处理链接的方式将有所不同。QuickTime\
  \ 插件不是启动另一个程序，而是允许你直接在浏览器窗口中查看电影片段。\n\n正如你可能猜到的那样，这种使用简单链接播放多媒体文件的方法提供了最好的向后兼容性，因为浏览器承担了确定如何播放多媒体片段的所有责任。这种方法的缺点是你对片段的播放方式没有太大控制权，而且你绝对无法在页面上下文中直接播放片段。\n\
  \n> 注意：如果你的浏览器不支持 QuickTime，你可以从 Apple 免费下载 QuickTime player：[`www.apple.com/quicktime/`](http://www.apple.com/quicktime/)。即使你安装了\
  \ QuickTime，某些浏览器仍可能根据是否安装了插件以不同的方式播放 QuickTime Movie。例如，在我的 Windows 计算机上，Internet\
  \ Explorer 和 Firefox 都通过插件在浏览器窗口中直接播放 QuickTime ，而 Opera 则启动 QuickTime 作为辅助应用程序。\n\
  \n## 嵌入多媒体文件\n\nXHTML 包含一个标准的 `<object>` 标签，这是在网页中嵌入任何类型多媒体的首选方法。该标签取代了可能在某些 HTML\
  \ 源代码中看到的旧 `<embed />` 标签。\n\n将多媒体文件嵌入页面中会产生一组软件控件，允许文件直接播放——不需要次级窗口，也不需要离开你所在的页面。以下是使用\
  \ `<object>` 标签本身嵌入 pond 视频的代码：\n\n```html\n<object classid=\"CLSID:6BF52A52-394A-11d3-B153-00C04F79FAA6\"\
  \ width=\"320\" height=\"305\">\n  <param name=\"type\" value=\"video/x-ms-wmv\"\
  \ />\n  <param name=\"URL\" value=\"pond.wmv\" />\n  <param name=\"uiMode\" value=\"\
  full\" />\n  <param name=\"autoStart\" value=\"false\" />\n</object>\n```\n\n考虑到这段代码实际上是将视频直接嵌入到你的网页中，所以它并不算太复杂（请参见\
  \ 图 8.22）。代码中最混乱的部分是 `<object>` 标签的 `classid` 属性，它被设置为很长的字母数字代码。此代码是 Windows Media\
  \ Player 的全局 ID，这意味着你正在告诉 `<object>` 标签在页面上嵌入 Media Player 来播放视频片段。你可以将此代码复制并粘贴到自己的网页中。\n\
  \n**图 8.22** `<object>` 标签允许你在网页上嵌入视频片段，同时指定由哪个媒体播放器播放。\n\n![image](img/08fig22.jpg)\n\
  \n> 注意：重要的是，Windows Media Player 功能足够，会自动*流传输*多媒体文件，这意味着它在加载前几秒内容后就开始播放。其原理是在你观看或听到早期内容时在后台加载剩余内容。结果是访问者在查看或收听你的多媒体片段时，不需要等待长时间的下载。\n\
  \n`<object>` 标签的 `width` 和 `height` 属性决定了嵌入的 Media Player 窗口的大小。如果你省略这些属性，某些浏览器会自动调整嵌入器的大小以适应内容，而另一些则什么都不显示。为了安全起见，请将它们设置为适合正在播放的多媒体内容的大小。\n\
  \n`<object>` 标签内部有四个 `<param>` 标签负责如何播放片段的详细信息。每个标签有两个属性 `name` 和 `value`，它们负责将数据（value）与特定设置（name）关联起来。在示例中，媒体片段的\
  \ `URL` 被设置为 `pond.wmv`。第三个参数 `uiMode` 决定了 Media Player 提供哪些按钮和用户界面选项——`full` 表示启用所有用户界面功能。最后，`autoStart`\
  \ 参数设置为 `false`，这样视频片段在浏览器打开页面时就不会自动播放。\n\n`type` 参数可能是最难处理的。它识别正在显示的媒体类型，在本例中，它是\
  \ Windows Media 视频 (WMV) 文件。此媒体类型必须指定为标准的 Internet MIME 类型之一。\n\n\n\n\n\n`MIME type`\
  \ 是用于唯一标识互联网上不同类型媒体对象的标识符。MIME 代表多用途互联网邮件扩展（Multipurpose Internet Mail Extensions），这个名称源于\
  \ MIME 类型最初用于标识电子邮件附件的事。这些 MIME 类型应该在 `<object>` 标签的 `type` 属性中使用，以标识 `data` 属性中引用的是什么种多媒体对象。\n\
  \n以下是你可能在网页中使用的几种常用音视频格式的 MIME 类型：\n\n*   **WAV Audio**—`audio/x-wav`\n*   **AU\
  \ Audio**—`audio/basic`\n*   **MP3 Audio**—`audio/mpeg`\n*   **MIDI Audio**—`audio/midi`\n\
  *   **WMA Audio**—`audio/x-ms-wma`\n*   **RealAudio**—`audio/x-pn-realaudio-plugin`\n\
  *   **AVI**—`video/x-msvideo`\n*   **WMV**—`video/x-ms-wmv`\n*   **MPEG Video**—`video/mpeg`\n\
  *   **QuickTime**—`video/quicktime`\n\n列表 8.7 显示了池塘网页的相关代码，你可以在其中看到上下文中的 `<object>`\
  \ 标签。\n\n#### 列表 8.7 使用 `<object>` 标签直接嵌入 WMV 视频片段\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n \"\
  http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Fun in the Pond</title>\n  </head>\n  <body>\n\
  \    <h1>Fun in the Pond</h1>\n    <div style=\"float:left; padding:3px\">\n   \
  \   <object classid=\"CLSID:6BF52A52-394A-11d3-B153-00C04F79FAA6\"\n      width=\"\
  320\" height=\"305\">\n        <param name=\"type\" value=\"video/x-ms-wmv\" />\n\
  \        <param name=\"URL\" value=\"pond.wmv\" />\n        <param name=\"uiMode\"\
  \ value=\"full\" />\n        <param name=\"autoStart\" value=\"false\" />\n    \
  \    <embed width=\"320\" height=\"305\" type=\"video/x-ms-wmv\"\n        src=\"\
  pond.wmv\" controls=\"All\" loop=\"false\" autostart=\"false\"\n        pluginspage=\"\
  http://www.microsoft.com/windows/windowsmedia/\" />\n      </object>\n    </div>\n\
  \    <p>Michael 的后院池塘不仅是一个有趣的爱好，还是一个正在进行的家居改良项目，既有创意又让人放松。</p>\n    <p>他的池塘里有许多鱼，全部是来自不同地的锦鲤，远远可以追溯到日本、以色列和澳大利亚。虽然它们不会吠叫、打呼噜或捡回食物以外的任何东西，但这些鱼是他的宠物，而且是非常优秀的宠物。</p>\n\
  \  </body>\n</html>\n```\n\n**注意**\n由于 XHTML 不支持 `<embed />` 标签，它会阻止你的页面通过验证。遗憾的是，这个问题确实没有解决办法——我们只能等待浏览器完全支持\
  \ `<object>` 标签本身，或者迁移到 HTML5 的 `<embed />` 元素。\n\n你可能会注意到，这里有一些没有出现在之前的 `<object>`\
  \ 标签示例中的额外代码。正如正如本节前面提到的，并不是所有的网络浏览器对 `<object>` 标签的支持都是一致的。因此，必须在 `<object>` 标签内部包含一个\
  \ `<embed />` 标签以考虑到浏览器的不一致性。这不是理想的解决方案，但在浏览器厂商继续落后于主流标准的情况下，我们唯一的办法。如果你仔细观察，你会发现\
  \ `<embed />` 标签包含了与 `<object>` 标签相同的所有信息。\n\n**注意**\n视频文件并不是你可以使用 `<object>` 和\
  \ `<embed />` 标签在网站中包含的媒体文件。添加任何多媒体文件都将遵循相同的流程。要确定具体应该使用哪些 `classid` 和 `codebase`\
  \ 属性，以及额外的参数（在 `<param />` 标签中），请使用搜索引擎查找诸如 `object embed mediatype` 的内容，其中 `mediatype`\
  \ 是 Real Audio、QuickTime、Flash 或任何其他。\n\n#### 使用多媒体的额外提示\n你可能会注意到，这里有一些没有出现在之前的\
  \ `<object>` 标签示例中的额外代码。正如本节前面提到的，并不是所有的网络浏览器对 `<object>` 标签的支持都是一致的。因此，必须在 `<object>`\
  \ 标签内部包含一个 `<embed />` 标签以考虑到浏览器的不一致性。这不是理想的解决方案，但在浏览器厂商继续落后于主流标准的情况下，我们唯一的办法。如果你仔细观察，你会发现\
  \ `<embed />` 标签包含了与 `<object>` 标签相同的所有信息。\n\n视频文件并不是你可以使用 `<object>` 和 `<embed\
  \ />` 标签在网站中包含的媒体文件。添加任何多媒体文件都将遵循相同的流程。要确定具体应该使用哪些 `classid` 和 `codebase` 属性，以及额外的参数（在\
  \ `<param />` 标签中），请使用搜索引擎查找诸如 `object embed mediatype` 的内容，其中 `mediatype` 是 Real\
  \ Audio、QuickTime、Flash 或任何其他。\n\n视频文件并不是你可以使用 `<object>` 和 `<embed />` 标签在网站中包含的媒体文件。添加任何多媒体文件都将遵循相同的流程。要确定具体应该使用哪些\
  \ `classid` 和 `codebase` 属性，以及额外的参数（在 `<param />` 标签中），请使用搜索引擎查找诸如 `object embed\
  \ mediatype` 的内容，其中 `mediatype` 是 Real Audio、QuickTime、Flash 或任何其他。\n\n```html\n\
  ...\n      <param name=\"type\" value=\"video/x-ms-wmv\" />\n      <param name=\"\
  URL\" value=\"pond.wmv\" />\n      <param name=\"uiMode\" value=\"full\" />\n  \
  \    <param name=\"autoStart\" value=\"false\" />\n      <embed width=\"320\" height=\"\
  305\" type=\"video/x-ms-wmv\"\n      src=\"pond.wmv\" controls=\"All\" loop=\"false\"\
  \ autostart=\"false\"\n      pluginspage=\"http://www.microsoft.com/windows/windowsmedia/\"\
  \ />\n    </object>\n...\n```\n\n## 总结\n在本章中，你学习了关于颜色使用的的一些最佳实践，以及如何使用色轮来帮助寻找与文字相协调的颜色。此外，你学习了颜色的十六进制表示法——所有颜色都是通过与红、绿、蓝含量相关的表示法的——以及十六进制表示法如何对你的元素应用细微颜色。更重要的是，你学习了三种颜色相关的样式属性，可以使用\
  \ CSS 为容器背景、边框和文本应用颜色。你还学习了为网页准备图形的基础知识。即使即便如此，你也了解到这是一个非常复杂的话题，而你在本章中学学的知识足以引起你的兴趣。本章中的示例使用了流行的（且免费的！）GIMP\
  \ 软件包，但请自由使用最适合你需求的图形软件。你学习的操作包括如何裁剪、调整大小和调整图像颜色，你还学习了不同的文件格式。在网站中包含图形时，你必须考虑许多因素，包括图形尺寸和分辨率，以及如何使用透明度、动画\
  \ GIF 和平铺背景。\n\n\n\n\n在你创建或编辑了某些图像后，你可以将它们放置在网页中，你之前已经通过 `<img />` 标签学会了如何操作。你学习了如何包含一段短文本消息，它会在图像加载时代替图像显示，并且当用户将鼠标指针悬在图像上时也会出现。你还发现了如何控制每张图片的水平和垂直对齐，以及如何让文本环绕图像的左侧或右侧。\n\
  \n你学习了如何将图像作为链接——可以在图像周围使用 `<a>` 标签，或者通过创建图像映射（imagemaps）。你还学习了一点关于如何在容器元素的背景中使用图像。\n\
  \n最后，你学习了如何将视频和音频嵌入到网页中。你发现了如何使用指向多媒体文件的简单链接，这是播放媒体内容时支持性最广泛但灵活性最低的选项。然后，你学习了如何使用\
  \ `<object>` 标签直接在网页中嵌入媒体播放器。不仅如此，你还发现为了获得最大的浏览器兼容性，用 `<embed />` 标签辅助 `<object>`\
  \ 标签会有帮助。`<object>` 和 `<embed />` 标签可以包含大量的媒体类型，包括 WAV、MP3、RealAudio 和 MIDI 文件——更不用说\
  \ AVI、WMV 和 QuickTime 视频了，这只是其中几个。\n\n表 8.1 总结了本章涵盖的标签和属性。\n\n表 8.1 第 8 章 涵盖的标签和属性\n\
  \n![image](img/08tab01.jpg)![image](img/08tab01a.jpg)\n\n### 答\n\n**Q. 与自己学习这些东西，我难道不应该聘请一个平面设计师来设计我的页面吗？**\n\
  \n**A.** 这是一个很难回答的问题，这并不是因为我在这里有利益冲突——我为一家网页开发和设计机构工作，所以推荐机构符合我的最佳利益。但机构并不总是最佳解决方案。聘请平面设计师需要花费时间和金钱。此外，许多平面艺术家制作的作品并不适用于\
  \ Web——他们是专门从事印刷的艺术家，而印刷世界与在线世界非常不同。此外，聘请一位自认为平面设计师的个人来创建网站，可能无法发挥该特定设计师的长处。换句话说，他可能擅长设计网站的图形元素，但可能不擅长担任内容架构师或处理\
  \ HTML 和 CSS。如果你的网站只是一个个人网站，那么专业设计可能不是你想要投入资金的地方。但如果你的网站旨在推广业务、产品、学校或任何形象对你成功至关重要的东西，那么花时间（和金钱）咨询网页设计专业人士是值得的。\n\
  \n**Q. 我制作过用于纸张打印的图形。网页图形有什么不同吗？**\n\n**A.** 有的。事实上，许多打印图形的规则在 Web 上是反的。网页图形必须是低分辨率的，而打印图形应该尽可能高分辨率。在计算机屏幕上，白色会冲淡黑色，而在纸张上，黑色会渗透到白色中。此外，有人可能在只下载了一半图形时就停止网页加载。如果你做过很多打印图形设计，尽量避免掉入旧习惯。\n\
  \n**Q. 我按照你建议的方法使用了 `<img />` 标签，但当我查看页面时，我只看到一个里面有一些形状的小框。这是怎么了？**\n\n**A.** 你看到的损坏图像图标可能意味着两种情况之一：要么浏览器无法找到图像文件，要么图像没有以浏览器识别的格式保存。要解决这些问题，首先检查图像是否在它应该在。如果是，请在你的图形编辑器中打开图像并将其重新保存为\
  \ GIF、JPG 或 PNG 格式。\n\n**Q. 如果我在图像映射上重叠区域会发生什么？**\n\n**A.** 你允许在图像映射上重叠区域。只需记住，在确定遵循哪个链接时，一个区域将优先于另一个区域。优先级是根据区域在图像映射中的列表顺序分配的。例如，地图中的第一个区域优先级高于第二个区域，这意味着在区域的重叠部分点击将链接到第一个区域。如果你在图像映射中有一个不链接到任何内容的区域（称为“死区域”），你可以使用这个重叠技巧来刻意防止该区域链接到任何内容。要做到这一点，只需将死区域放在其他区域之前，使死区域重叠它们，然后将它的\
  \ `href` 属性设置为 `\"\"`。\n\n**Q. 我听过很多关于流媒体视频和音频。那是什么意思？**\n\n**A.** 在过去，通过大多数调制解调器检索视频音频文件需要几分钟，有时甚至几小时，这严重限制了在网页中包含视频和音频。每个人都在追求的目标是流媒体视频或音频，它在数据接收的同时进行播放。换句话说，你不需要在开始观看或收听之前完全下载片段。\n\
  \n流媒体播放现在通过大多数媒体播放器广泛支持，包括独立版本和插件。当你使用 `<object>` 标签嵌入媒体对象时，如果播放器支持流传输，底层媒体播放器会自动流传输媒体片段。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。\n\n#### 测验\n\n**1。** 与其自己学习所有这些东西，我该如何给网页一个黑色背景并将文字设为亮绿色？根据你在本章中学到的知识，你还会使用这种颜色吗？\n\
  \n**2。** 你有一张扫描的马的照片需要放在页面上。你应该把它做得多大？你应该用什么格式保存它？\n\n**3。** 你将如何在网页顶部插入一个 elephant.jpg\
  \ 图像文件？\n\n**4。** 当实际 elephant.jpg 图像无法显示时，你如何让 Elephant 这个单词显示？\n\n#### 答案\n\n\
  **1.** 在页面开头放置以下内容或为 body 使用样式规则：\n\n```html\n<body style=\"background-color:#000000;\
  \ color:#00FF0\">\n```\n\n**2.** 根据图像对页面的重要性，你应该将其缩小到 100×40 像素，或放大到 300×120 像素。JPEG\
  \ 格式配合 85% 的压缩是最好的。当然，你也可以提供指向较大图片的缩图链接。\n\n**3.** 将图像文件复制到与 HTML 文件相同的目录中。在 HTML\
  \ 文件的 `<body>` 标签之后，输入：\n\n```html\n<p><img src=\"elephant.jpg\" alt=\"\" /></p>\n\
  ```\n\n**4.** 使用以下 HTML：\n\n```html\n<img src=\"elephant.jpg\" alt=\"elephant\"\
  \ />\n```\n\n## 练习\n\n- 选择一个你喜欢的基础色——例如美丽的蓝色或大地色调——并使用 `http://colorscheme-designer.com/`\
  \ 的配色方案生成器得一组可以在网站中使用的颜色。我推荐四角色方案或强调类比方案类型。\n- 在你获得一组颜色（或几组颜色方案）后，创建一个基础 HTML 页面，包含一个\
  \ `<h1>` 元素、一段文字以及可能的一些列表项。使用你在本章中学到的颜色相关样式更改页面背景颜色以及各种块级元素的文本颜色，看看这些颜色组合如何工作。观察它们如何相互作用，并确定哪些颜色最适合容器，哪些颜色最适合正文、标题文本和链接文本。\n\
  \n\n\n\n- 在你开始为一个重要的业务网站设计图形之前，试着美化一下你自己的个人主页。这将让你获得一个学习 `GIMP` 的机会（或者获得一个使用你的图形处理软件的机会），这样你在处理工作中的任务时就知道自己在做什么了。\n\
  - 练习本章中的任何图像放置方法，都将极大地帮助你确定图像在你所设计的网站中可以发挥且将发挥的作用。使用一些示例图像，练习使用 `float` 样式来设置图像和文本的相对位置。记住\
  \ `float` 的可能值为 `left`、`right` 和 `none`（默认值）。\n\n# 第三部分：使用 CSS 进行高级网页设计\n\n## 第\
  \ 9 章：外边距、内边距、对齐和浮动\n\n***\n\n你将在本中学到：\n- 如何在元素周围添加外边距（margins）\n- 如何在元素内部添加内边距（padding）\n\
  - 如何保持一切对齐\n- 如何使用 `float` 属性\n\n现在你已经学习了创建内容的基础知识，在本章中，你将学习使用 CSS 增强这些内容的细节。在上一章中，你已经学习了如何使用基础\
  \ CSS 用于显示目的（如字体大小和颜色）。在随后的章节中，你将深入学习使用 CSS 控制整个网页的方面，而不仅仅是单个文本或图形。\n\n在处理页面布局之前，在将它们结合之前，重要的是单独理解四个特定的\
  \ CSS 属性：\n- `margin` 和 `padding` 属性——在元素周围添加空间\n- `align` 和 `float` 属性——用于设置元素与其他元素之间的相对位置\n\
  \n本章提供的示例并非创建过的最时尚的网页内容，但它们的意图并非如此。相反，这些示例清晰地展示了 XHTML 和 CSS 是如何协同工作的。当你通过本章和其他章节掌握\
  \ CSS 之后，你将能够创建出像图 9.1 所示的网页杰作，那是 CSS Zen Garden 的一个示例。\n\n**图 9.1** 这是 CSS Zen\
  \ Garden 中 XHTML 和 CSS 工作的众多示例之一。\n\n![image](img/09fig01.jpg)\n\nCSS Zen Garden\
  \ 的网站可能不像你经常访问的典型电子商务或社交网络网站。相反，这些网站展示了使用 CSS 可以展开的艺术可能性。毫无疑问，这些网站需要仔细的思考和规划，但潜在的设计是无尽的。\n\
  \n***\n\n注意\nCSS Zen Garden 的网站（[`www.csszengarden.com/`](http://www.csszengarden.com/))\
  \ 显示了通过使用符合标准的 CSS 可以实现的设计类型。花园中所有用户提交的作品都使用完全相同的 HTML 文件，但艺术家可以自由修改 CSS 文件以创建他们自己的视觉显示。图\
  \ 9.1 中显示的示例来自 Stuff and Nonsense 的 Andy Clarke（[`www.stuffandnonsense.co.uk/`](http://www.stuffandnonsense.co.uk/)）。\n\
  \n***\n\n## 使用外边距 (Margins)\n\n样式表外边距允许你在网页上元素的矩形区域外部添加空隙。重要的是记住，`margin` 属性作用于元素外部的空间。\n\
  \n以下是设置外边距的样式属性：\n- `margin-top`——设置上外边距\n- `margin-right`——设置右外边距\n- `margin-bottom`——设置下外边距\n\
  - `margin-left`——设置左外边距\n- `margin`——作为单个属性设置上、右、下、左外边距\n\n你可以使用任何单个外边距属性或使用单一的\
  \ `margin` 属性来指定外边距。外边距可以指定为 `auto`，这意味着浏览器本身根据特定的长度（像素、点、em）或百分比设置外边距。如果你决定将外边距设置为百分比，请记住该百分比是基于整个页面的大小而非元素的大小。因此，如果你将\
  \ `margin-left` 属性设置为 25%，则元素的左外边距最终将是整个页面宽度的 25%。\n\n***\n\n你可以通过至少两种不同的方式记住简写顺序。首先，如果你将元素想象成一个矩形，从顶部开始顺时针环绕四周移动：顶边、右边、底边、左边。或者，你可以使用字母首字母记忆法，并记住“TRBL”（读音为“trouble”），如果你忘记了外边距属性的顺序，这代表了可能出现的状态。\n\
  \n另外注意，TRBL 顺序也适用于内边距（padding）属性和边框（border）属性。\n\n***\n\n代码 9.1 中的代码在页面上产生四个矩形，每个宽\
  \ 250 像素，高 100 像素，并带有 5 像素的实黑色边框（见图 9.2）。每个矩形（在此情况下为 `div`）具有不同的颜色。我们希望每个 `div`\
  \ 周围的外边距四周均为 15 像素，因此可以使用：\n\n```css\nmargin-top:15px;\nmargin-right:15px;\nmargin-bottom:15px;\n\
  margin-left:15px;\n```\n\n**图 9.2** 基础颜色块显示了四个颜色块，具有相等的外边距。\n\n![image](img/09fig02.jpg)\n\
  \n你也可以使用 `margin` 属性以简写形式来实现：\n\n```css\nmargin:15px;\n```\n\n如果你使用 `margin` 属性（边框）：\n\
  \n```css\nmargin:15px 15px;\n```\n\n如果你想让所有值都相同，可以进一步简化并使用：\n\n```css\nmargin:15px;\n\
  ```\n\n如果你使用 `margin` 属性：\n\n```css\nmargin:15px 15px 15px 15px;\n```\n\n如果你使用 `margin`\
  \ 属性：\n\n```css\nmargin:15px 15px;\n```\n\n使用简写设置外边距时实际上有三种方法，取决于你使用的值：\n- 一个值——所有外边距的大小\n\
  - 两个值——上/下外边距和左/右外边距的大小\n- 四个值——上、右、下、左外边距的大小\n\n你可能会发现使用一个值或四个值更容易，但这并不是要求的。\n\n\
  \n\n\n\n-   在第四个颜色块周围设置 250 像素的左侧边距和 25 像素的顶部边距。\n\n这看起来似乎很简单——第一个块周围没有设置任何外边距。由于我们希望在第二个块的顶部设置外边距，所以实际上在第一个块和第二个块之间将有一个可见的边距，即使我们没有为第一个块指定外边距。\n\
  \n这四个命名的 `<div>` 的新样式表项现在看起来如下：\n\n```css\ndiv#d1 {\n  background-color:red;\n \
  \ margin:0px;\n}\n\ndiv#d2 {\n  background-color:green;\n  margin:5px 0px 0px 15px;\n\
  }\n\ndiv#d3 {\n  background-color:blue;\n  margin:0px 0px 0px 75px;\n}\n\ndiv#d4\
  \ {\n  background-color:yellow;\n  margin:25px 0px 0px 250px;\n}\n```\n\n之前的代码更改结果（参见图\
  \ 9.3 所示，页面内容与浏览器窗口框架之间存在明显的空隙。\n\n**图 9.3** 颜色块示例页的修改显示了不同的外边距。\n\n![image](img/09fig03.jpg)\n\
  \n如果我们正在处理元素布局——我们将在下一章中介绍——这将会导致你的布局出现问题。为了确保你的布局和外边距是从与浏览器对齐的位置开始计算的，你需要处理 `<body>`\
  \ 元素本身的外边距。在这种情况下，你将在你的样式表中添加以下内容：\n\n```css\nbody {\n  margin:0px;\n}\n```\n\n\
  另一个需要记住的“陷阱”是，如果你有两个边框的元素堆叠在一起，但它们之间没有外边距，它们接触的地方将看起来会有双重边框。你可能会考虑将顶部元素的 `border-bottom`\
  \ 宽度设为一半，并并将底部元素的 `border-top` 宽度也设为一半。如果你这样做，边框在堆叠时看起来将与其他侧的宽度相同。\n\n此外，你可能认为认为通过使用\
  \ 250 像素的左侧边距（`<div>` 的宽度），第四个颜色块将从第三个颜色块结束的地方开始。然而，事实并非如此，因为第三个颜色块有 75 像素的 `margin-left`。为了让它们至少能够对齐，第四个\
  \ `<div>` 的 `margin-left` 值必须是 325 像素。\n\n将样式更改为后续代码所示所示样式，将产生如图 9.4 所示的间距。\n\n\
  ```css\nbody {\n  margin:0px;\n}\n\ndiv {\n  width:250px;\n  height:100px;\n  color:black;\n\
  \  font-weight:bold;\n  text-align:center;\n}\n\ndiv#d1 {\n  border:5px solid #000000;\n\
  \  background-color:red;\n  margin:0px;\n}\n\ndiv#d2 {\n  border-width:6px 6px 3px\
  \ 6px;\n  border-style:solid;\n  border-color:#000000;\n  background-color:green;\n\
  \  margin:10px 0px 0px 15px;\n}\n\ndiv#d3 {\n  border-width:3px 6px 6px 6px;\n \
  \ border-style:solid;\n  border-color:#000000;\n  background-color:blue;\n  margin:0px\
  \ 0px 0px 15px;\n}\n\ndiv#d4 {\n  border:5px solid #000000;\n  background-color:yellow;\n\
  \  margin:0px 0px 0px 265px;\n}\n```\n\n**图 9.4** 对颜色块的第三次修改使项目之间的关系更加紧密。\n\n![image](img/09fig04.jpg)\n\
  \n这些更改为 `<body>` 元素提供了零外边距，从而确保 25 像素的 `margin-left` 值确实距离浏览器框架边缘 25 像素。它还展示了堆叠的第二和第三颜色块，但对边界元素进行了修改，以免出现双重边框。此外，第四个颜色块从第三个颜色块结束的地方开始。\n\
