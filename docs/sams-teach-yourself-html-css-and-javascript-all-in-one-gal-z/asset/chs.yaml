  \ 读者服务\n\n访问我们的网站并在 informit.com/register 注册本书，以便方便获取该书可能的任何更新、下载或勘误。\n\n# 第一部分：开启\
  \ Web 之门\n\n## 第一章：发布 Web 内容\n\n你将在本章中学习到：\n• 全球维网的简短历史\n• `web page` 一词的含义，以及为什么这个术语并不总是反映所有涉及的内容\n\
  • 内容如何从你的个人电脑传输到他人的浏览器\n• 如何选择 Web 托管服务\n• 不同的浏览器和设备类型如何影响你的内容\n• 如何使用 `FTP` 将文件传输到你的\
  \ Web 服务器\n• 文件应该放在 Web 服务器的什么位置\n• 如何在没有 Web 服务器的情况下发布 Web 内容\n• 如何使用博客等其他发布方法\n\
  在 在在学习 `HTML`（超文本标记语言）、`CSS`（级联样式表）和 `JavaScript` 的复杂细节之前，重要的是要实实理解帮助这些纯文本文件转换为你在计算机或手持设备上浏览全球维网时所看到的丰富多媒体显示的技术。例如，一个包含标记和客户端代码的\
  \ `HTML` 和 `CSS` 文件如果没有 Web 浏览器来查看它是毫无用处的；除非涉及 Web 服务器，否则除了你自己，没人能看到你的内容。Web 服务器让你的内容对其他人可见，而这些人反过来使用他们的浏览器导航到某个地址并等待服务器向他们发送信息。你将深度参与这一发布过程，因为你必须创建文件并将它们放在服务器上以使其可用，而且你必须确保你的内容以你预期的方式出现在终端用户面前。\n\
  \n### HTML 和全球维网的简史\n\n从前以前，在月球上还没有足迹的时候，一些远见卓识的人决定看看是否可以将几个主要的计算机网络连接在一起。我就不再赘述那些名字和故事了（有很多），但最终的结果就是“网络之母”，我们称之为\
  \ `Internet`（互联网）。\n\n在 1990 年之前，通过 `Internet` 访问信息是一项技术性很强的事务。其中一位物理学家，现在著名的（被封的）`Tim\
  \ Berners-Lee`，发明了一种轻松交叉引用文本的方法。这并不是新想法，但他简单的 `HTML` 却在更有雄心的项目陷入困同时脱而出。`Hypertext`（超文本）最初是指带有链接的电子格式存储文本。它现在是一个更广泛的术语，指的是任何可以链接的对象（文本、图像、文件等）。`Hypertext\
  \ Markup Language` 是一种用于描述文本、图形和文件如何组织方式的语言。\n\n***\n\n注意\n关于全球维网历史的更多信息，请参阅该主题的维基百科文章：[`en.wikipedia.org/wiki/History_of_the_Web`](http://en.wikipedia.org/wiki/History_of_the_Web)。\n\
  \n***\n\n到 1993 年，全世界只有 100 多台计算机能够提供 `HTML` 页面。那些互联的页面被称为 `World Wide Web (WWW)`（全球维网），并编写了若干网页浏览器程序允许人们查看网页。由于\
  \ `Web` 的日益流行，很快就有几个程序员编写了可以查看图形图像以及文本的浏览器。从那时候起，浏览器软件的持续开发以及 `HTML`（以及 `XHTML`）语言的标准化引导我们走向今天所处的世界——在这个世界里，11\
  \ 亿台 Web 服务器为 250 亿个文本和多媒体文件提供服务。\n\n### 创建 Web 内容\n\n你可能注意到使用了 `web content`（Web\
  \ 内容）而不是 `web pages`（网页）——这是有意为之。虽然我们谈论“访问网页”，但我们真正的意思是类似于“查看计算机上某个地址处的所有文本和图像”。我们阅读的文本和看到的图像是由我们的浏览器根据单个文件中的某些指令渲染的。\n\
  \n\n\n\n\n这些文件包含文本，这些文本被`标记`或由 HTML 代码包围，这些代码告诉浏览器如何显示文本——例如标题、段落、红色字体等。某些 HTML\
  \ 标记告诉浏览器显示图像或视频文件而不是纯文本，这让我回到了核心点：不同类型的内容会被发送到你的网络浏览器中，因此简单地用`网页`一词并不能涵盖全部。在这里，我们改用`网络内容`这一术语，来涵盖网上发现的文本、图像、音频、视频和其他媒体范围。\n\
  \n在随后的章节中，你将学习链接或创建网站中常见的各种类型多媒体网络内容的基础知识。在此时，你只需要记住，`你`控制着用户访问你的网站时所看到的内容。从包含要显示文本的文件，到告诉服务器向用户的网络浏览器发送图形的代码开始，你必须对最终构成你的网络存在感的所有部分进行计划、设计和实施。正如你将在本书中所学到的，只要你理解了沿途的每一个小步骤，这并不是一个困难的过程。\n\
  \n从最基本的形态来看，网络内容始于一个包含 HTML 或 XHTML 标记的简单文本文件。XHTML 是 HTML 的另一种变体；“X”代表可扩展（eXtensible），随着章节深入，你将学习更多关于它的知识。从一开始需要知道的重要点是，本书中的所有示例都兼容\
  \ HTML 4 和 XHTML，这意味着现在和未来的任何新版本的网络浏览器都将以类似的方式对其进行渲染。这就是编写符合标准的代码的好处之一：你不需要担心在未来的某个时候回到代码并因为无法运行而对其进行更改。只要网络浏览器遵循标准（希望是很长一段时间），你的代码可能一直有效。\n\
  \n### 理解网络内容交付\n\n为了最终生成你所看到的网络内容，在许多不同的位置会发生几个过程。这些过程发生非常快——在毫秒级——并且在后台进行。换句话说，尽管我们可能认为自己所做的仅仅是打开网络浏览器，输入一个网络地址，并即时看到我们请求的内容，但背景中的技术正在为我们辛勤工作。图\
  \ 1.1 显示了浏览器和服务器之间的基本交互。\n\n**图 1.1** 浏览器请求和服务器响应。\n\n![image](img/01fig01.jpg)\n\
  \n然而，在你看到所请求的网站的全部内容之前，在该过程中有几个步骤——可能在浏览器和服务器之间有多次往返。\n\n假设你想进行 Google 搜索，于是你顺从地在地址栏中输入`[`www.google.com`](http://www.google.com)`或从书签列表中选择\
  \ Google 书签。几乎立即，你的浏览器就会向你展示类似于图 1.2 所示的内容。\n\n**图 1.2** 访问`[www.google.com](http://www.google.com)`。\n\
  \n![image](img/01fig02.jpg)\n\n图 1.2 显示了一个包含文本加一张图像（Google 标志）的网站。从网络服务器检索该文本和图像并将其显示在你的屏幕上的简单过程版本如下：\n\
  \n**1.** 你的网络浏览器对位于`[`www.google.com/`](http://www.google.com/)`地址的 `index.html`\
  \ 文件发送请求。`index.html` 文件不需要是你在地址栏中输入的地址的一部分；你将在本章节后续学习更多关于 `index.html` 的知识。\n\n\
  **2.** 在接收到特定文件的请求后，网络服务器进程会在目录内容中查找特定文件，打开它，并将该文件的内容传回你的网络浏览器。\n\n**3.** 网络浏览器接收\
  \ `index.html` 文件的内容，这些是用 HTML 代码标记的文本，并根据这些 HTML 代码渲染内容。在渲染内容时，浏览器恰好遇到了 Google\
  \ 标志的 HTML 代码，你可以在图 1.2 中看到它。HTML 代码看起来如下：\n\n```html\n<img src=\"/logos/logo.gif\"\
  \ width=\"384\" height=\"121\" border=\"0\" alt=\"Google\"/>\n```\n\n该标签提供了属性，告诉浏览器显示标志所需的源文件位置（`src`）、宽度（`width`）、高度（`height`）、边框类型（`border`）和替代文本（`alt`）。你将在后面的章节中学习更多关于属性的知识。\n\
  \n**4.** 浏览器查看 `<img/>` 标签中的 `src` 属性以寻找源位置。在这种情况下，图像 `logo.gif` 可以在浏览器检索 HTML 文件的同一网络地址（`[www.google.com](http://www.google.com)`）的\
  \ `logos` 目录中找到。\n\n**5.** 浏览器请求`[`www.google.com/logos/logo.gif`](http://www.google.com/logos/logo.gif)`地址的文件。\n\
  \n**6.** 网络服务器解释该请求，找到文件，并将该文件的内容发送给请求它的网络浏览器。\n\n**7.** 网络浏览器在你的显示器上显示图像。\n\n正如你在网络内容交付过程的描述中所看到的，网络浏览器不仅仅是作为你查看内容的框架，它们会组装网络内容并根据文件指令安排这些部分。你也可以在本地、或在你自己的硬盘上查看网络内容，而不需要网络服务器。\n\
  \n### 选择网络托管供应商\n\n尽管只是告诉你可以在没有网络服务器的情况下完成本书中的章节，但拥有网络服务器是持续的推荐方法。不要担心——获取网络托管供应商通常是一个快速、轻松且相对廉廉的过程。事实上，你获得自己的域名和一年的网络托管服务只需比你正在读的书稍花一点钱。\n\
  \n\n\n\n\n- **域名的购买与管理**——该软件包是否包含自定义域名，还是你必须在托管账户之外单独购买并维护域名？\n\n- **价格**——不要为托管服务支付过高。你会看到各种价格的报价，并且立刻疑惑：“它们之间有什么区别？”通常，这种差异与服务质量关系不大，而与公司开销以及公司认为他们可以向用户收取多少费用有关。一个通用的准则是：如果如果你为一个基础托管包和域名的年度费用超过了\
  \ 75 美元，那么你可能付得了。\n\n以下是三家可靠的 Web 托管提供商，他们的基础软件包包含大量的服务器空间和带宽（以及域名和额外福利），且价格较低。如果你不选择其中任何一家\
  \ Web 托管提供商，至少在比价时可以将他们的基础软件包描述作为指南。\n\n- **[A Small Orange ([`www.asmallorange.com`](http://www.asmallorange.com))**——“Tiny”和“Small”托管包是新手网页内容发布者的理想起点。\n\
  \n- **[DailyRazor ([`www.dailyrazor.com`](http://www.dailyrazor.com))**——即使是它的 Rookie\
  \ 托管包也功能齐全且可靠。\n\n- **[LunarPages ([`www.lunarpages.com`](http://www.lunarpages.com))**——Basic\
  \ 托管包适用于许多个人和小型企业网站。\n\n***\n\n注意\n\n多年来我使用了所有这些提供商（甚至更多），并且没有任何问题推荐其中任何一个；我主要使用\
  \ `DailyRazor` 作为 Web 托管提供商，特别是对于高级开发环境。\n\n***\n\n一个良好的托管提供商的特点是它提供了一个“控制面板”，让你管理账户的各个方面。图\
  \ 1.3 显示我在 Daily Razor 托管账户的控制面板。许多 Web 托管提供商都提供这种特定的控制面板软件，或者设计相似的控制面板——清晰标记的图标指向你可以执行的用于配置和管理账户的任务。\n\
  \n**图 1.3** 示例控制面板。\n\n![image](img/01fig03.jpg)\n\n你可能永远不需要使用控制面板，但拥有它可以简化数据库和其他软件的安装、网页统计数据的查看以及添加电子邮件地址（以及许多其他功能）。如果你能遵循指令，你就可以管理自己的\
  \ Web 服务器——不需要特殊培训。\n\n### 使用多个 Web 浏览器进行测试\n\n在刚刚讨论了网页内容的交付过程和 Web 服务器的获取之后，现在退一步谈论如何使用多个\
  \ Web 浏览器测试你的网站似乎有点奇怪。然而，在你开始学习如何使用 HTML 和 CSS 创建网站之前，请牢记这个非常重要的陈述：你网站的每位访客都可能使用与你不同的硬件和软件配置。他们的设备类型（台式机、笔记本电脑、上网本、智能手机或\
  \ iPhone）、他们的屏幕分辨率、他们的浏览器类型、浏览器窗口大小以及连接速度都将是不相同的——记住，你无法控制访客在查看你的站点时所使用的任何方面。因此，正当你设置\
  \ Web 托管环境并准备工作时，请考虑下载几个不同的 Web 浏览器，这样你就可以有一套本地测试工具可用了。让我解释为什么这很重要。\n\n尽管所有 Web\
  \ 浏览器在处理和操作信息方面大致相同，但它们之间存在某些特定差异，导致内容在不同浏览器中的显示并不总是相同的。即使是同一版本同一 Web 浏览器的用户，也可以通过选择不同的显示选项或更改窗口大小来改变页面的外观。所有主流\
  \ Web 浏览器都允许用户用自己选择的背景和字体覆盖网页作者指定的背景和字体。屏幕分辨率、窗口大小和可选的工具栏也会改变页面首次出现在屏幕上时用户能看到的多少内容。你只能确保你编写的是符合标准的\
  \ HTML 和 CSS。\n\n在任何情况下，都不要花费几个小时去设计一个在你自己电脑上看起来很完美的东西——除非你愿意在朋友的电脑、平板电脑或你的 iPhone\
  \ 上查看它时感到失望。\n\n你应该尽可能使用尽可能多的 Web 浏览器来测试你的网站：\n\n- [Apple Safari ([`www.apple.com/safari/`](http://www.apple.com/safari/))](适用于\
  \ Mac 和 Windows\n\n- [Google Chrome ([`www.google.com/chrome`](http://www.google.com/chrome))](适用于\
  \ Windows\n\n- [Mozilla Firefox ([`www.mozilla.com/firefox/`](http://www.mozilla.com/firefox/))](适用于\
  \ Mac、Windows 和 Linux\n\n- [Microsoft Internet Explorer ([`www.microsoft.com/ie`](http://www.microsoft.com/ie))](适用于\
  \ Windows\n\n- [Opera ([`www.opera.com/`](http://www.opera.com/))](适用于 Mac、Windows\
  \ 和 Linux/UNIX\n\n现在你已经搭建好了开发环境，或者至少对未来想要建立的类型有了一些了解，让我们开始创建一个测试文件吧。\n\n### 创建示例文件\n\
  \n在我们开始之前，请查看代码列表 1.1。此代码列表表示了一个简单的网页内容——几行 HTML 代码，它们会在浏览器窗口内居中分两行，用大号粗体字体打印“Hello\
  \ World! Welcome to My Web Server.”。\n\n代码列表 1.1 我们的示例 HTML 文件\n\n***\n\n```html\n\
  <<html>>\n<head>\n<title>Hello World!</title>\n</head>\n<body>\n<h1 style=\"text-align:\
  \ center;\">Hello World!<br/>Welcome to My Web Server.</h1>\n</body>\n</html>\n\
  ```\n\n***\n\n要使用这些内容，请打开你喜欢的文本编辑器，例如 Windows 记事本或 Mac 文本编辑。不要使用 WordPad、Microsoft\
  \ Word 或其他功能强大的软件，因为这些程序创建的文件与我们用于 Web 的文本文件不同。\n\n***\n\n注意\n\n你将在第 2 章 中学习关于文本编辑器的知识，即“理解\
  \ HTML 和 XHTML 连接”。现在，我只想让你有一个可以放在 Web 服务器上的示例文件！\n\n***\n\n\n\n\n\n无论你使用哪种 FTP\
  \ 客户端，FTP 客户端通常都使用相同的界面。图 1.4 展示了 FireFTP 的示例，这是一种与 Firefox 浏览器配合使用的 FTP 客户端。本地机器（你的电脑）的目录列表显示在屏幕左侧，远程机器（Web\
  \ 服务器）的目录列表显示在右侧。通常，你会看到右箭头和左箭头按钮——如图 1.4 所示。右箭头将选定的文件从你的电脑发送到 Web 服务器；左箭头则将文件从\
  \ Web 服务器发送到你的电脑。许多 FTP 客户端还允许你只需选择文件，然后将这些文件拖放到目标机器。\n\n**图 1.4** FireFTP 界面。\n\
  \n![image](img/01fig04.jpg)\n\n你有许多免费的 FTP 客户端可以选用，但你也可以通过基于 Web 的文件管理器工具传输文件，该工具可能是你\
  \ Web 服务器控制面板的一部分。然而，那种文件传输方法通常会向过程中引入更多步骤，而且远没有在自己的机器上安装 FTP 客户端那样高效（或简单）。\n\n\
  以下是一些流行的免费 FTP 客户端：\n\n• 用于 Mac 和 Windows 的 Classic FTP ([`www.nchsoftware.com/classic/`](http://www.nchsoftware.com/classic/))\n\
  \n• 用于 Mac 的 Cyberduck ([`cyberduck.ch/`](http://cyberduck.ch/))\n\n• 用于 Mac 的 Fetch\
  \ ([`fetchsoftworks.com/`](http://fetchsoftworks.com/))\n\n• 适用于所有平台的 FileZilla\
  \ ([`filezilla-project.org/`](http://filezilla-project.org/))\n\n• 适用于所有平台的 FireFTP\
  \ ([`fireftp.mozdev.org/`](http://fireftp.mozdev.org/)) Firefox 扩展程序\n\n当你选择好一个\
  \ FTP 客户端并将其安装在电脑上后，就可以准备好从 Web 服务器上传和下载文件了。在下一节中，你将看到如何使用列表 1.1 中的示例文件来了解这一过程。\n\
  \n### 使用 FTP 客户端\n\n以下步骤展示了如何使用 Classic FTP 连接到你的 Web 服务器并传输文件。然而，所有的 FTP 客户端都使用相似（如果不是相同）的界面。如果你理解了这些步骤，你就应该能够使用任何\
  \ FTP 客户端。\n\n记住，你首先需要主机名、账户用户名和账户密码。\n\n**1.** 启动 Classic FTP 程序并点击 `Connect` 按钮。系统将提示填写要连接的站点信息，如图\
  \ 1.5 所示。\n\n**图 1.5** 在 Classic FTP 中连接到新站点。\n\n![image](img/01fig05.jpg)\n\n**2.**\
  \ 按照如下内容填写图 1.5 所示的每个项目：\n\n• 站点 `Label`（标签）是你用来指代自己站点的名称。其他人看不到这个名字，所以输入任何你喜欢的名称。\n\
  \n• `FTP Server` 是你需要发送 Web 页面的 Web 服务器的 FTP 地址。这个地址将由你的托管提供商给你。它可能是*yourdomain*.com*，但请检查你注册服务时收到的信息。\n\
  \n• `User Name`（用户名）字段和 `Password`（密码）字段也应使用托管提供商提供的信息进行填写。\n\n• 在你熟悉该客户端并建立工作流之前，不要更改\
  \ `Initial Remote Directory on First Connection`（首次连接远程目录）和 `Initial Local Directory\
  \ on First Connection`（首次连接本地目录）的值。\n\n**3.** 完成完成后后点击 `OK` 保存设置并与 Web 服务器建立连接。\n\
  \n你会看到一个对话框，指示 Classic FTP 正在尝试连接 Web 服务器。连接成功后，你将看到一个与图 1.6 类似的界面，左侧显示本地目录的内容，右侧显示你的\
  \ Web 服务器的内容。\n\n**图 1.6** 通过 Classic FTP 成功连接到远程 Web 服务器。\n\n![image](img/01fig06.jpg)\n\
  \n**4.** 你现在几乎准备好将文件传输到你的 Web 服务器了。剩下的只是切换目录到所谓的 Web 服务器的*文档根*（document root）。你\
  \ Web 服务器的文档根是指定为你的 Web 内容的顶层目录——目录结构的起点，你将在本章的稍后部分学习更多相关信息。通常，此目录会被命名为 `public_html`（如图\
  \ 1.6 所示）、`www`（同样如图 1.6 所示，因为 `www` 已创建为 `public_html` 的别名）或 `htdocs`。这不是你需要创建的目录，因为你的托管提供商已经为你创建了。\n\
  \n双击文档根目录名称打开它。FTP 客户端界面右侧的显示将转变为显示此目录的内容。（此时它可能是空的，除非你的 Web 托管提供商代表你在该目录放置了占位文件。）\n\
  \n**5.** 目标是将之前创建的 `sample.html` 文件从你的电脑传输到 Web 服务器。在左侧目录列表中找到该文件。\n\n**6.** 点击客户端界面中间的右箭头按钮将文件发送到\
  \ Web 服务器。传输完成后，客户端界面的右侧将刷新，显示该文件已到达目的地。\n\n**7.** 点击 `Disconnect` 按钮关闭连接，然后退出 Classic\
  \ FTP。\n\n这些步骤在概念上与你任何想将文件发送到 Web 服务器时将采取的步骤相似。你还可以使用你的 FTP 客户端在 Web 服务器上创建子目录。要使用\
  \ Classic FTP 创建子目录，点击 `Remote` 菜单，然后点击 `New Folder`。不同的 FTP 客户端具有不同的界面选项来实现相同的目标。\n\
  \n### 理解在 Web 服务器上放置文件的位置\n\n维护 Web 内容的一个重要方面是确定如何组织这些内容——不仅是为了让用户找到，也是为了你维护。将文件放在目录中将帮助你管理这些文件。\n\
  \n在你的 Web 服务器上命名和组织目录以及制定文件维护规则完全取决于你。然而，维护一个组织良好的服务器从长远来看会让你对内容的管理更加高效。\n\n####\
  \ 基础文件管理\n\n在浏览 Web 时，你可能注意到在浏览网站时 URL 会发生变化。例如，如果你正在查看某个公司的网站并点击指向公司产品或服务的图形导航，URL\
  \ 可能会从\n\n[http://www.companyname.com/]\n\n变为\n\n[http://www.companyname.com/products/]\n\
  \n或\n\n[http://www.companyname.com/services/]\n\n在上一节中，我使用了*文档根*一词，但并没有解释解释什么是。Web\
  \ 服务器的文档根本质上是完整 URL 末尾的斜杠。例如，如果你的域名是*yourdomain*.com，且你的 URL 是 http://www.*yourdomain*.com/，那么文档根就是末尾斜杠（/）。文档根是你\
  \ Web 服务器上创建的目录结构的起点；它是 Web 服务器开始查找 浏览器请求的文件的地方。\n\n如果你按照之前的指示将 `sample.html` 文件放置在文档根中，你就可以通过\
  \ Web 浏览器通过以下 URL 访问它：\n\nhttp://www.*yourdomain*.com/sample.html\n\n如果你在浏览器中输入此\
  \ URL，你将看到渲染后的 sample.html 文件，如图 1.7 所示。\n\n\n\n\n\n**图 1.7** 通过网络浏览器访问的 `sample.html`\
  \ 文件。\n\n![image](img/01fig07.jpg)\n\n然而，如果你在文档根目录下创建了一个新目录并将 `sample.html` 文件放在该目录中，该文件将通过此\
  \ URL 访问：\n\nhttp://www.*yourdomain*.com/newdirectory/sample.html\n\n如果你将 `sample.html`\
  \ 文件放在了你最初连接到服务器时看到的目录中——也就是说，你*没有*更改目录并将文件放置在文档根目录下——那么在你的 Web 服务器上将无法通过任何 URL\
  \ 访问该 `sample.html` 文件。该文件仍然存在于你所知道的 Web 服务器机器上，但由于该文件不在文档根目录（服务器软件知道从这里开始查找文件），因此任何人都无法通过网络浏览器访问它。\n\
  \n底线是什么？在在开始传输文件之前，务必导航到你 Web 服务器的文档根目录。\n\n这对于图形和其他多媒体文件来说尤其如此。Web 服务器上的一个常用目录被称为\
  \ `images`，正如你可以想象的，所有的图像资源都放置在这里以便调取。其他常用的目录还包括用于样式表的 `css`（如果你使用了多个）和用于外部 JavaScript\
  \ 文件的 `js`。或者，如果你知道网站上有一个区域供访问者下载许多不同类型的文件，你可以简单地将该目录命名为 `downloads`。\n\n无论是包含你艺术作品集的\
  \ ZIP 文件，还是包含销售数字的 Excel 表格，在互联网上发布并非仅仅是网页的文件通常是有用的。要让非 HTML 文件的文件在 Web 上变得可用，只需像它*是*\
  \ HTML 文件一样将该文件上传到你的网站，遵循本章之前提供的上传说明即可。在文件上传到 Web 服务器后，你可以为它创建一个链接（你将在后面的章节中学习到）。换句话说，你的\
  \ Web 服务器可以提供的服务远比 HTML 多。\n\n以下是一个你将在本书后部分进一步了解的 HTML 代码示例。以下代码将用于名为 `artfolio.zip`\
  \ 的文件，它位于你网站的 `downloads` 目录下，链接文本为“下载我的艺术作品集！”：\n\n```\n<a href=\"/downloads/artfolio.zip\"\
  >Download my art portfolio!</a>\n```\n\n### ## 使用索引页\n\n当你想到索引时，你可能会想到书后末尾的章节，它告诉你去哪里查找各种关键词和主题。Web\
  \ 服务器目录中的索引文件也可以起到该作用——只要你那样设计它。事实上，这个名称就是源于此。\n\n`index.html` 文件（或通常称为*索引文件*）是你提供的一个页面名称，当用户导航到你网站中的特定目录时，你希望他们看到的默认文件。如果你在考虑易用性的情况下创建了该页面，你的用户将能够从索引页进入该章节的所有内容。\n\
  \n例如，图 1.8 显示了下拉导航和左侧导航都包含指向三个页面的链接：解决方案概述（Solutions Overview，章节索引页本身）、连接管理（Connection\
  \ Management）和成本管理（Cost Management）。页面内容本身（名为 `index.html` 并位于 `solutions` 目录下）也有指向该解决方案章节中另外两个页面的链接。当用户到达这个特定网站的“solutions”章节的索引页时（至少在快照期间），他们可以到达该章节中的任何其他页面（通过三种不同的方式！）。\n\
  \n**图 1.8** 展示了一个良好的章节索引页。\n\n![image](img/01fig08.jpg)\n\n索引页的另一个功能是，当用户访问你网站上带有索引页的目录，但他们没有指定该页面时，他们仍然会进入你网站该章节的主页——或者网站的主页。\n\
  \n例如，在上一个例子中，用户可以输入以下任一 URL 并进入该网站的 solutions 章节的主页：\n\n[`www.ipass.com/solutions/`](http://www.ipass.com/solutions/)\n\
  \n[`www.ipass.com/solutions/index.html`](http://www.ipass.com/solutions/index.html)\n\
  \n如果 `solutions` 目录下没有 `index.html` 页面，结果将取决于 Web 服务器的配置。如果服务器被配置为禁止目录浏览，那么当用户尝试在未指定页面名的情况下访问\
  \ URL 时，将看到一条“目录列出被拒绝（Directory Listing Denied）”的消息。然而，如果服务器被配置为允许目录浏览，用户将会看到该目录下的文件列表。\n\
  \n这些服务器配置选项已经由你的托管提供商为你确定了。如果你的托管提供商允许你通过控制面板修改服务器设置，你可以更改这些设置，以便你的服务器根据你自己的需求对请求做出响应。\n\
  \n\n\n\n对于本地站点而言，保持良好的组织结构与远程网站同样重要，这样你就可以避免在 HTML 文件中出现断链。你将在稍后的章节中学习更多关于文件间链接的具体知识。\n\
  \n## 在博客上发布内容\n\n你可能拥有由第三方托管的博客，例如 `Blogger` 或 `WordPress`（以及其他平台），因此在没有专用 Web 服务器甚至完全不了解任何\
  \ HTML 的情况下就已经发布过内容。这些服务除了 `source editors`（源代码编辑器）外，还提供可视化编辑器，这意味着你可以输入文字并添加粗体、斜体或字体颜色等视觉化格式，而无需了解这些操作对应的\
  \ HTML 代码。但尽管如此，当你点击这些编辑器中的“发布”按钮时，内容依然就会变成真正的 HTML。\n\n然而，通过你将在本书中所学到的知识，你的博客写作将得到提升，因为你将能够使用源代码编辑器编写博客文章内容和博客模板，从而对内容的视觉效果和感受有更多的控制权。这些操作的过程与你学过的创建\
  \ HTML 文件并通过 `FTP` 上传到自己的专用 Web 服务器的过程不同，但如果我不指出博客实际上是网络发布的一种形式，那将是我的失职。\n\n## 测试\
  \ Web 内容的技巧\n\n每当你将文件传输到 Web 服务器或将其放在可移动介质上进行本地浏览时，都应该立即彻底测试每一个页面。下面的清单将帮助确保你的 Web\
  \ 内容符合你的预期。请注意，此时某些术语对你来说可能很陌生，但随着你学习本书并创建更大的项目，请回来查看此清单：\n\n- 在传输文件之前，先在本地机器上对其进行本地测试，以确保链接有效且内容反映了你预期的视觉设计。将页面传输到\
  \ Web 服务器或移动设备后，再次测试所有页面。\n- 使用尽可能多的浏览器进行这些测试——`Chrome`、`Firefox`、`Internet Explorer`、`Opera`\
  \ 和 `Safari` 是一个不错的列表——并在 Mac 和 Windows 平台上都进行。如果可能，检查低分辨率（800×600）和高分辨率（1600×1200）的效果。\n\
  - 在开始测试之前，关闭浏览器的自动加载图像，这样你就可以看到没有图形的页面样式。检查你的 `alt` 标签信息，然后重新开启图像加载以加载图形并再次仔细检查页面。\n\
  - 使用浏览器的字体大小设置查看各种字体大小下的页面，以确保如果用户用自己的字体覆盖你的字体规范，你的布局不会崩溃。\n- 等待每个页面完全加载完成，然后一直滚动到底，确保所有图像都出现在它们应该出现的地方。\n\
  - 每个页面加载所需的时间。加载是否超过了几秒钟？如果是，该页面上的信息是否足够价值，足以让用户在页面加载完成之前离开此处？诚然，宽带连接很常见，但这并不意味着你应该给页面加载大量\
  \ 1MB 的图像。\n\n如果你的页面通过了所有这些测试，你就可以放心了；你的站点已经准备好公开查看。\n\n## 总结\n\n本章向你介绍了使用 `HTML`\
  \ 对文本文件进行标记以生成 Web 内容的概念。你还学到 Web 内容不仅仅是“页面”—Web 内容还包括图像、音频和视频文件。所有这些内容都存储在 Web\
  \ 服务器上——这是一个通常远离你计算机的远程机器。在你的计算机或其他设备上，你使用 Web 浏览器请求、检索并最终在屏幕上显示 Web 内容。\n\n你学习了在确定\
  \ Web 托管供应商是否符合你的需求时应该考虑的标准。一旦有了 Web 托管供应商，你就可以开始使用 `FTP` 客户端将文件传输到你的 Web 服务器。你还学习了一点关于\
  \ Web 服务器目录结构和文件管理的知识，以及 `index.html` 文件在给定 Web 服务器目录中非常重要的作用。你发现可以在移动介质上分发 Web\
  \ 内容，并学会了如何组织文件和目录以实现无需使用远程 Web 服务器即可查看内容的目标。最后，你学习了将作品放置在 Web 服务器后，在多个浏览器中进行测试重要性。编写有效的、符合标准的\
  \ `HTML` 和 `CSS` 将有助于确保你的站点对所有访问者看起来都相似，但在没有获得来自开发团队之外的潜在用户意见之前，你不应该直接进行设计——当你是一个人的设计团队时，获取他人的意见变得更加重要！\n\
  \n## Q&A\n\n**Q. 我看了网上一些网页的 HTML 源代码，看起来学习起来非常惊人。我必须像计算机程序员一样思考才能学习这些东西吗？**\n\n\
  **A.** 虽然复杂的 HTML 页面确实看起来令人畏畏，但学习 `HTML` 比学习实际的软件编程语言（如 `C++` 或 `Java`）要简单得多。`HTML`\
  \ 是一种标记语言，而不是编程语言；你对文本进行标记，以便浏览器以某种方式渲染文本。这与开发计算机程序是完全不同的思维方式。要成为一名成功的 Web 内容作者，你不需要任何计算机程序员的经验或技能。\n\
  \n许多商业网站背后的 HTML 看起来复杂的原因之一是它们可能是由可视化 Web 设计工具创建的——一种“所见即所得”或“WYSIWYG”编辑器，它会在特定情况下使用其软件开发者告诉它使用的任何标记——而不是通过手动编码（在手动编码中，你对生成的标记有完全的控制权）。在书中，你学习的是从零开始的基础编码，这通常会产生整洁、易读的源代码。可视化\
  \ Web 设计工具擅长让代码变得难以阅读，并产生复杂不符合标准的代码。\n\n**Q. 你建议的所有测试比我创建页面还要长时间！我能少做点测试吗？**\n\n\
  **A.** 如果你的页面不是为了赚钱或提供重要服务，那么它们对某些用户来说很奇怪或偶尔出现错误可能不是大问题。情况下，只需在几个不同的浏览器中测试每个页面即可。然而，如果你需要展示专业形象，严谨的测试是不可替代的。\n\
  \n**Q. 说真的，谁会在意我如何组织我的 Web 内容？**\n\n**A.** 令人难以信的是，你的 Web 内容组织方式对搜索引擎和潜在访问者很重要——你将在第\
  \ 28 章“帮助人们找到你的页面”中学习更多内容。但总的来说，良好的 Web 服务器目录结构将有助于你跟踪可能更新的内容。例如，如果你有一个专门的图像或多媒体目录，你将确切知道要找的文件——不需要在包含其他内容的目录中寻找。\n\
  \n## 练习\n\n练习包含测验问题和活动，帮助巩固对内容的理解。在查看后面的答案部分之前，尝试回答所有问题。\n\n### 测验\n\n- **1.** 为了生成包含某些文本和两个图像的单个网页，你需要在\
  \ Web 服务器上存储多少个文件？\n- **2.** 选择 Web 托管供应商时应该寻找哪些功能？\n- **3.** 通过 `FTP` 连接到你的 Web\
  \ 服务器需要哪三项信息？\n- **4.** `index.html` 文件的作用是什么？\n\n\n\n\n\n# [5]. 你的网站必须包含目录结构吗？\n\
  \n### 答案\n\n1. 你需要三个：一个用于网页本身（包含文本和 HTML 标记），另外两张图片各需要一个。\n\n2. 关注可靠性、客户服务、网络空间和带宽、域名服务、网站管理额外功能以及价格。\n\
  \n3. 主机名、你的账户用户名和你的账户密码。\n\n4. `index.html` 文件通常是 Web 服务器中目录的默认文件。它允许用户在访问 [`www.yourdomain.com/somedirectory/`](http://www.yourdomain.com/somedirectory/)\
  \ 时无需使用末尾的文件名，仍能进入正确的位置。\n\n5. 不需要。使用目录结构进行文件组织完全取决于你，尽管强烈建议使用目录结构，因为它简化了内容的维护。\n\
  \n## 练习\n\n- 准备好你的 Web 托管——你是打算通过在自己的电脑上本地查看文件来学习书中的章节，还是打算使用网络托管提供商？请注意，大多数托管提供商会在你购买托管计划的当天让你上线并运行。\n\
  \n- 如果你正在使用外部托管提供商，并使用你的 FTP 客户端，请在网站的根目录下创建一个子目录。将 `sample.html` 文件的内容粘贴到名为 `index.html`\
  \ 的另一个文件中，将 `<title>` 和 `</title>` 标签之间的文本更改为新的，并将 `<h1>` 和 `</h1>` 标签之间的文本更改为新的。保存文件并将其上传到新的子目录。使用浏览器导航到\
  \ Web 服务器上的新目录，查看 `index.html` 文件中的内容是否显示。然后，使用你的 FTP 客户端从远程子目录中删除 `index.html`\
  \ 文件。使用浏览器返回该 URL，刷新页面，查看在没有 `index.html` 文件的情况下服务器如何响应。\n\n- 使用与上一个练习创建的相同组文件，将这些文件放置在可移动媒体设备上——例如\
  \ CD-ROM 或 USB 闪器。使用浏览器访问该示例网站的本地版本，并思考为了让其他人可以使用它，你需要随这些可移动媒体分发哪些说明。\n\n# 第 2 章。理解\
  \ HTML 和 XHTML 的关系\n\n在本章中将学习：\n\n- 如何使用 HTML 创建简单的网页\n- 如何包含每个网页必须具有的所有 HTML 标签\n\
  - 如何使用段落和换行符组织页面\n- 如何使用标题组织你的内容\n- 如何验证你的网页内容\n- 如何区分 HTML、XML、XHTML 和 HTML5\n\n\
  第一章让你对创建网页内容并在在线查看（或者如果你还没有网络托管提供商，就在本地查看）背后的流程有了基本的概念。在本章中，我们将正开始解释 HTML 文件中必须出现的各种元素，以便它们在你的\
  \ Web 浏览器中正确显示。\n\n在本章结束时，你将学习 HTML 与 XHTML 有何不同，以及为什么会有两种不同的语言旨在完成相同的事情——创建网页内容。通常，本章提供了\
  \ HTML 和 XHTML 基础知识的快速总结，并提供了一些实用技巧，帮助作为网页作者和发布者充分利用时间。然而，这并非全是理论；你将看到一个真实的网页及其背后的\
  \ HTML 代码。\n\n## 准备工作\n\n以下是你准备好使用本书其余部分需要做的回顾：\n\n1. 准备一台电脑。我使用了一台运行 Ubuntu (Linux)\
  \ 的电脑来测试示例网页内容并获取书中的插图，但可以使用任何 Windows、Macintosh 或 Linux/UNIX 机器来创建和查看你的网页内容。\n\n\
  2. 获取 Internet 连接。无论你是使用拨号、无线还是宽带连接，对于创建和查看网页内容来说并不重要，但连接越快，体验越好。提供你 Internet 连接的服务提供商\
  \ (ISP)、学校或公司可以帮助你完成正确设置的细节。此外，许多公共场所如咖啡馆、书店和图书馆都提供免费的无线 Internet 服务，如果你有支持 Wi-Fi\
  \ 网络的笔记本电脑，就可以使用。\n\n3. 获取 Web 浏览器软件。这是你的电脑检索和显示网页内容所需的软件。正如你在第一章中学到的，最流行的浏览器软件（按字母顺序排列）是\
  \ Apple Safari、Google Chrome、Microsoft Internet Explorer、Mozilla Firefox 和 Opera。安装其中几个浏览器是一个好主意，这样你就可以进行实验并确保你的内容在所有浏览器中看起来是一致的；你不能对别人正在使用的浏览器做假设。\n\
  \n> **注意**\n> 不确定如何找到 ISP？最好的方法是在网上进行比较购物（使用朋友的电脑或已连接 Internet 的公共电脑）。你可以在 [`www.thelist.com/`](http://www.thelist.com/)\
  \ 找到一份全面的国家和地区 ISP 列表。\n\n4. 探索！使用 Web 浏览器在 Internet 上寻找内容或外观与你想创建的相似的网站。注意哪些页面让你感到沮丧，哪些页面吸引了你并让你继续读下去，哪些让你反复返回某些页面。如果你有感兴趣的特定主题，可以考虑使用流行的搜索引擎，如\
  \ Google ([`www.google.com/`](http://www.google.com/)) 或 Bing ([`www.bing.com/`](http://www.bing.com/))\
  \ 进行搜索。\n\n> **警用**\n> 尽管所有浏览器处理信息的方式相同，但它们之间存在某些差异，导致显示并不总是相同的。务必在多个浏览器中检查你的网页，以确保它们看起来正常。\n\
  \n### 开始制作网页\n\n在第一章中，你学到了网页只是被 HTML 代码标记或围绕的文本文件，这些代码告诉浏览器如何显示文本。要创建这些文本文件，请使用文本编辑器，如\
  \ Windows 上的 Notepad 或 Mac 上的 TextEdit——不要使用 WordPad、Microsoft Word 或其他文字处理软件，因为它们创建的文件与我们用于网页内容的纯文本不同。\n\
  \n> **注意**\n正如第一章提到的，如果你计划将网页内容发布到 Internet（而不是在 CD-ROM 或本地局域网上），你需要将其传输到一台全天候连接\
  \ Internet 的电脑上。提供 Internet 连接的同一公司或学校可能也提供网络空间；如果没有，你可能需要向托管提供商付费。\n\n在开始工作之前，你应该从一些你想放在网页上的文本开始：\n\
  \n1. 寻找（或编写）关于你、你的家人、你的公司、你的足球球队或其他感兴趣主题的几段文本。\n\n2. 将此文本保存为纯、标准的 ASCII 文本。Notepad\
  \ 和大多数简单的文本编辑器始终以纯文本保存文件，但如果你使用其他程序，你可能需要选择这种文件类型（在选择“文件”、“另存为”后）。\n\n在本章中，你向文本文件添加\
  \ HTML 标记（称为*标签*），从而将其变为网页内容。\n\n\n\n\n当你保存包含 HTML 标签的文件时，请务必以 `.html` 结尾进行命名。这非常重要：如果你在保存文件时忘记在文件名末尾输入\
  \ `.html`，大多数文本编辑器会给它分配其他扩展名（例如 `.txt`）。如果发生这种情况，当你尝试用网络浏览器查看该文件时，可能找不到该文件；即使你找到了，它也绝无法正常显示。换句话说，网络浏览器期望网页页文件的扩展名为\
  \ `.html`。\n\n* * *\n\n### 注意事项\n\n再次强调，由于这对于结果和学习过程本身都非常重要：请勿使用 Microsoft Word\
  \ 或任何其他兼容 HTML 的字处理程序来创建你的第一个 HTML 文件；这些程序中的大多数都会尝试以一种奇怪的方式为你重写 HTML，这可能会让你完全一头雾水。此外，我建议你*不要*使用图形化、““所见即所得”（WYSIWYG）编辑器，例如\
  \ Microsoft FrontPage 或 Adobe Dreamweaver。你可能会发现，在刚学习 HTML 时，从简单的文本编辑器开始会更容易且更具教育意义。在你对底层原理有了更好的理解之后，可以再转向视觉化工具（如\
  \ FrontPage 和 Dreamweaver）。\n\n* * *\n\n访问网站时，你可能还会遇到扩展名为 `.htm` 的页面，这也是一种可以接受的文件扩展名。你可能会在\
  \ Web 上看到其他扩展名，例如 `.jsp`（Java Server Pages）、`.asp`（Microsoft Active Server Pages）或\
  \ `.php`（PHP: Hypertext Preprocessor），但这些文件类型使用了服务器端技术，超出了 HTML 以及本书各章节的范围。然而，这些文件除了编程语言外还包含\
  \ HTML；虽然这些文件中的编程代码是在服务器端编译的，你在客户端看到的只是 HTML 输出，但如果你查看源代码，可能会看到编程代码与标记代码之间错复杂的交织。\n\
  \n列表 2.1 显示了一个你可以输入并保存以创建简单 HTML 页面的文本示例。如果你用 Firefox 打开此文件，你将看到图 2.1 所示的页面。你创建的每一个网页必须包含\
  \ `<html></html>`、`<head></head>`、`<title></title>` 和 `<body></body>` 标签对。\n\n**图\
  \ 2.1** 当你将列表 2.1 中的文本保存为 HTML 文件并用网络浏览器查看时，仅显示实际的标题和正文。\n\n![image](img/02fig01.jpg)\n\
  \n* * *\n\n### 注意\n\n如果你在 Macintosh 电脑上使用 TextEdit，创建 HTML 文件的步骤与在 `Windows` 电脑上使用记事本略有不同。两者都是流行的文本编辑器，但对于后者，你必须先点击“格式”菜单，选择“制作纯文本”，然后在“保存”标题下的选项中，通过取消勾选“在纯文本文件中添加\
  \ .txt 扩展名”来更改设置。此外，默认设置为显示 `.html` 文档为其在浏览器中的样式，这将导致你无法编辑它们。要修复此问题，请勾选“文本处理”标题下的“忽略\
  \ HTML 文件中的富文本命令”。\n\n* * *\n\n### 列表 2.1 `<html>`、`<head>`、`<title>` 和 `<body>`\
  \ 标签\n\n* * *\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>The First Web Page</title>\n  </head>\n  <body>\n    <p>\n      起初，Tim\
  \ 创建了超文本标记语言。互联网\n      空虚且混沌，文字在显示器表面漂浮，\n      Tim 的手在键盘表面上移动。Tim 说：\n      让链接出现吧；于是有了链接。Tim\
  \ 发现链接是好的；\n      Tim 将链接与文本分离。Tim 将链接称为锚点（Anchors），\n      将文本称为其他东西（Other Stuff）。这一切在一起构成了第一个网页。\n\
  \    </p>\n  </body>\n</html>\n```\n\n* * *\n\n在列表 2.1 中，与每一个 HTML 页面一样，那些以 `<`\
  \ 开头并以 `>` 结尾的单词实际上是编码命令。这些编码命令被称为*HTML 标签*，因为它们“标记”了文本片段并告诉网络浏览器它是什么种文本。这允许网络浏览器恰当地地显示文本。\n\
  \n* * *\n\n### 注意\n\n从技术上来说，HTML5 将是下一个 Web 标准，但它是下一个 Web 标准。 \n\nTechn,,,, HTML5\
  \ will be the next web standard but it is the next web standard. \n,,,,, HTML5 will\
  \ the the web,,, the the the the....,,,,,,, the the..,,,,, HTML5 will the the next\
  \ web, but is is the next\n\n standard. \n\nTechnically speaking, HTML5 will be\
  \ the next web standard but it is the next web standard. \nTechnically speaking,\
  \ HTML5 will be the next web standard but it is the next web standard. \nTechnically\
  \ speaking, HTML5 will be the next web standard but it is the next web standard.\
  \ \nTechnically speaking, HTML5 will be the next web standard but it is the next\
  \ web standard. \nTechnically speaking, HTML5 will be the next web standard but\
  \ it is the next web standard. \nTechnically speaking, HTML5 will be the next web\
  \ standard but it is the next web standard. \nTechnically speaking, HTML5 will be\
  \ the next web standard but it is the next web standard. \nHTML tags are because\
  \ they “tag” pieces of text and tell the web browser what kind of text it is. This\
  \ allows the web browser to display the text.\n\n* * *\n\n### 注意\n\nTechnically\
  \ speaking, HTML5 will be the next web standard but it is the next web standard.\
  \ \nWait, I apologize. \n\nYou don’t need to be connected to the Internet to view\
  \ a page stored on your hard drive. By default, your browser tries to connect to\
  \ the Internet every time you start it, which makes sense most of the time. However,\
  \ this can be a hassle if you’re developing pages locally (offline) and you keep\
  \ getting errors about a page not found. If you have a full-time web connection\
  \ via LAN, cable modem, or DSL, this is a moot point because the browser will never\
  \ complain about being offline. Otherwise, the appropriate disciplinary action will\
  \ depend on your breed of browser; check the options under your browser’s Tools.\n\
  \n* * *\n\n###动手尝试：创建并查看基础页面\n\n在学习 HTML 标签之前，你可能想看看我是如何创建和查看文档的。\n\n1. 在记事本（或其他文本编辑器）中输入列表\
  \ 2.1 中的所有文本，包括 HTML 标签。\n2. 选择文件，“另存为”。确保选择纯文本（或 ASCII 文本）作为文件类型。\n3. 将文件命名为 `firstpage.html`。\n\
  4. 在硬盘上选择你想存放页面的文件夹——记住你选择了哪个！点击“保存”或“确定”按钮保存文件。\n5. 现在启动你喜欢的浏览器。（同时也保持记事本运行，以便在查看和编辑之间切换。）\n\
  \n在 Internet Explorer 中，选择文件，“打开”并点击“浏览”。如果你使用的是 Firefox，选择文件，“打开文件”。导航到相应的文件夹并选择\
  \ `firstpage.html` 文件。某些浏览器和操作系统还允许将 `firstpage.html` 文件拖放到浏览器窗口中查看。\n\n*好了！* 你应该看到图\
  \ 2.1 所示的页面。\n\n\n\n\n是时候向你揭示 HTML 标签的这种秘密语言了。当你理解了这种语言时，你将拥有远超其他人类的创造力。别告诉别人，其实这真的非常简单。\n\
  \n在进入 HTML 标签之前，让我们先来处理 Listing 2.1 顶部看起来杂乱的代码。第一行表示该 HTML 文档实际上是一个 XML 文档：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n```\n\n> 注意\n> 在现阶段，你理解字符编码等概念并不是极其重要。重要的是要在你的页面中包含适当的样板代码（boilerplate\
  \ code），以便它们符合最新的网络标准。截至本文写作时，XHTML 1.1 是一项网络标准。HTML5 还不是网络标准，但如果你正在创建一个 HTML5 文档，HTML\
  \ 文件开头的这些行就是必需的。\n\nXML 版本设置为 `1.0`，这非常标准，字符编码类型（`UTF-8`）也是如此。\n\nListing 2.1 中的第二行和第三行代码看起来甚至更复杂：\n\
  \n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n```\n\n再次，只要你记住在页面开头包含这段代码，这段代码的特定细节并不极端重要。这段代码将文档标识为 XHTML 1.1，从而允许网络浏览器确保代码符合\
  \ XHTML 1.1 的所有要求。\n\n大多数 HTML 标签由两部分组成：`opening tag`（起始标签），指示一段文本的开始；以及一个 `closing\
  \ tag`（结束标签），指示该文本的结束。结束标签以 `<` 符号后紧跟的 `/`（正斜杠）开始。\n\n> 注意\n> 创建网页时并不严格要求使用 XML/XHTML\
  \ 样板代码。你可以删除示例中的开头代码行，让页面从 `<html>` 标签开始，它仍然可以在网页浏览器中正常打开。包含额外的代码是为了确保你的页面与当前的网络标准同步。此外，额外的代码还允许你对网页的准确性进行验证，你将在本章稍后的部分学习如何操作。\n\
  \n另一种类型的标签是 `empty tag`（空标签），它的独特之处在于它不包含匹配的起始和结束标签对。相反，一个空标签由单个标签组成，它以 `<` 开头，并在\
  \ `>` 符号之前以 `/` 结束。\n\n以下是这三个标签的简要总结，以确保你理解它们各自所扮演的角色：\n\n- `opening tag`（起始标签）是指示\
  \ HTML 命令开始的 HTML 标签；受命令影响的文本出现在起始标签之后。起始标签始终以 `<` 开始并以 `>` 结束，例如 `<html>`。\n- `closing\
  \ tag`（结束标签）是指示 HTML 命令结束的 HTML 标签；受命令影响的文本出现在结束标签之前。结束标签始终以 `</` 开始并以 `>` 结束，例如\
  \ `</html>`。\n- `empty tag`（空标签）是发布 HTML 命令但不在此页面中包含任何文本的 HTML 标签。空标签始终以 `/>` 开始并以\
  \ `>` 结束，例如 `<br />` 和 `<img />`。\n\n例如，Listing 2.1 中的 `<body>` 标签告诉网页浏览器页面的实际正文从哪里开始，而\
  \ `</body>` 指它的结束。`<body>` 和 `</body>` 标签之间的所有内容将出现在网页浏览器窗口的主显示区域，如 Figure 2.1 所示。\n\
  \n> 注意\n> 你一定在 Listing 2.1 中注意到与 `<html>` 标签关联的一些额外代码。这段代码由两个属性（`xmlns` 和 `xml:lang`）组成，用于指定与标签相关的附加信息。这两个属性是所有\
  \ XHTML 网页的标准要求；前者定义了 XML 命名空间，后者定义了内容的语言。在整本书中，定义了一个标准的命名空间并使用了英语。如果你正在用其他语言编写，请将\
  \ `\"en\"`（代表英语）替换为与相关的语言标识符。\n\n浏览器窗口的最顶部（参考 Figure 2.1）显示标题文本，即任何位于 `<title>`\
  \ 和 `</title>` 之间的文本。标题文本还用于在浏览器的书签或收藏菜单中标识页面，取决于你使用哪种浏览器。为页面提供标题是重要的，这样页面访问者就可以正确地将其收藏以便以后参考。\n\
  \n你将在创建的每个 HTML 页面中使用 `<body>` 和 `<title>` 标签对，因为每个网页都需要标题和正文。你还会使用 `<html>` 和 `<head>`\
  \ 标签对，它们是 Listing 2.1 中显示的另外两个标签。将 `<html>` 置于文档开头仅表示该文档是一个网页。`</html>` 表示页面结束。\n\
  \n> 提示\n> 你可能会发现创建并保存一个基础页面（也称为*骨架*或*模板*）非常方便，只需包含起始和 `<title>` 和 `<body>` 标签，以节省每次都输入这些麻烦。\n\
  \n### 使用段落和换行组织页面\n\n当网页浏览器显示 HTML 页面时，它忽略换行符或单词之间的空格数。例如，Figure 2.2 所示的诗歌顶部版本单词之间只有一个空格，尽管这并不是\
  \ Listing 2.2 中的输入方式。这是因为 HTML 中的额外空白会被压缩成单个空格。此外，当文本到达浏览器窗口的边缘时，它会自动换行，无论原始文件中的换行符在哪里。\n\
  \n**图 2.2** 当 Listing 2.2 中的 HTML 被视为网页时，换行和段落只在 `<br />` 和 `<p>` 标签处出现。\n\n![image](img/02fig02.jpg)\n\
  Listing 2.2 包含段落和换行的 HTML\n\n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>广告代理之歌</title>\n  </head>\n  <body>\n    <p>\n      When your client's\
  \ hopping mad,\n      put his picture in the ad.\n      If he still should prove\
  \ refractory,\n      add a picture of his factory.\n    </p>\n    <hr />\n  </body>\n\
  </html>\n```\n\n\n\n\n\n当你的客户气得发疯时，\n把他的照片放在广告里。\n\n如果他仍然固执不化，\n再加一张他工厂的照片。\n\n\
  ***\n\n如果你想控制换行和段落的实际出现位置，就必须使用 HTML 标签。当文本包含在 `<p></p>` 容器标签内时，在闭合标签后将有一个换行符。在随后的章节中，你将学习使用\
  \ CSS 控制换行符的高度。`<br />` 标签强制在段落内进行换行。与你目前为止看到的其他标签不同，`<br />` 不需要闭合的 `</br>` 标签——这就是我们之前讨论过的空标签之一。虽然\
  \ HTML 4 并不要求在空标签中包含 `/`，但 `XHTML` 要求，未来的标准也将如此，因此，坚持最新标准并创建代码正确的网页对你来说很重要。始终编写空标签，并让它们以\
  \ `/>` 结尾。\n\n***\n\n### 注意\n\n你可能会遇到很多使用 `<br>` 而不是 `<br />` 的网页内容。或者你可能会看到其他不包含闭合\
  \ `</p>` 标签的内容。请记住，互联网上充斥着大量过时的网页内容，仅仅因为看到它们被使用并不意味着它们是正确的。遵循书中学的标准，可以避免你以后很多工作和挫败感。养成良好的\
  \ HTML 编码习惯是成为成功网页设计师非常重要的一部分。\n\n***\n\n列表 2.2 和 图 2.2 中的诗展示了使用 `<br />` 和 `<p>`\
  \ 标签来分隔广告代理歌曲的行和节。你可能还了列表中的 `<hr />` 标签，它会在页面上显示一条水平线（参见图 2.2）。使用 `<hr />` 标签插入水平线也会导致换行，即使你没有同时包含\
  \ `<br />` 标签。与 `<br />` 一样，`<hr />` 水线标签是一个空标签，因此永远不需要闭合的 `</hr>` 标签。\n\n***\n\n\
  ### 自己尝试：在 HTML 中格式化文本\n\n取一段文本，尝试将其格式化为适当的 HTML。\n\n1. 在文本开头添加 `<html><head><title>My\
  \ Title</title></head><body>`（使用你自己的页面标题代替 `My Title`）。同时在页面顶部包含处理 `XHTML` 要求的样板代码。\n\
  2. 在文本的最末尾添加 `</body></html>`。\n3. 在每个段落的开头添加 `<p>` 标签，在每个段落的结尾添加 `</p>` 标签。\n4.\
  \ 在任何你需要单间距换行的地方使用 `<br />` 标签。\n5. 使用 `<hr />` 绘制水平线来分隔主要文本，或任何你希望在页面上看到一条线的地方。\n\
  6. 将文件保存为 `mypage.html`（使用你自己的文件名代替 `mypage`）。\n7. 在网络浏览器中打开文件查看你的网页内容。（如果你有网络托管账户，请通过\
  \ `FTP` 将文件发送那里。）\n8. 如果某些地方看起来不对，回到文本编辑器进行修正并再次保存文件（如果适用，将其发送到你的网络托管账户）。然后你需要点击浏览器中的\
  \ `Reload/Refresh`（重新加载/刷新）查看你所做的更改。\n\n***\n\n### 注意\n\n如果你正在使用文字处理器创建网页，请确保将 HTML\
  \ 文件保存为纯文本或 `ASCII` 格式。\n\n***\n\n### 使用标题组织你的内容\n\n当你浏览互联网上的网页时，你会发现许多页面顶部都有一个标题，看起来比其他部分文本更大、更粗。列表\
  \ 2.3 是一个简单网页的示例代码和文本，包含标题与普通段落文本对比的示例。在 `<h1>` 和 `</h1>` 标签之间的任何文本将显示为大标题。此外，`<h2>`\
  \ 和 `<h3>` 会生成逐渐减小的标题，依此类推，一直到 `<h6>`。\n\n#### 列表 2.3 标题标签\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>My Widgets</title>\n  </head>\n  <body>\n\
  \    <h1>My Widgets</h1>\n    <p>My widgets are the best in the land. Continue reading\
  \ to</p>\n    <p>My widgets are the best in the land. Continue reading to</p>\n\
  \    </p>\n    <h2>Features</h2>\n    <p>My widgets are the best in the land. Continue\
  \ reading to</p>\n    <h3>Pricing</h3>\n    <p>My widgets are the best in the land.\
  \ Continue reading to</p>\n    <h3>Comparisons</h3>\n    <p>My widgets are the best\
  \ in the land. Continue reading to</p>\n  </body>\n</html>\n```\n\n***\n\n### 注意\n\
  \n现在你可能已经注意到 HTML 通常通过缩进来显示部分之间的关系。这种缩进完全是自愿的——你只需运行所有标签而不留空格，它们看起来仍然很好。缩进代码是一个非常好的习惯，并最终会让你的页面更容易。\n\
  \n\n\n\n记住 `title`（标题）与 `heading`（标题）之间的区别很重要。在日常英语中，这两个词通常可以互换，但当你谈论 HTML 时，`<title>`\
  \ 为整个页面提供一个标识名称，该名称不会显示在页面本身；它只显示在浏览器窗口的标题栏上。另一方面，标题标签（heading tags）则会使页面上的某些文本以视觉强调的方式显示。每个页面只能有一个\
  \ `<title>`，且它必须出现在 `<head>` 和 `</head>` 标签内，而你可以根据喜好以任何顺序拥有任意数量的 `<h1>`、`<h2>`\
  \ 和 `<h3>` 标题。然而，正如我之前提到的，你应该使用标题标签来严密控制内容的层级；不要使用标题来来实现特定的视觉效果，因为那是 CSS 的工作。\n\n\
  在本书的第第二部分和第三部分中，你将学习如何完全控制网页上文本的外观。除了精确控制字体的大小、族族和颜色之外，标题是为重要文本吸引额外关注的最简单、最流行的方法。\n\
  \n***\n\n**注意**\n\n不要忘记，放置在网页 `head` 中的任何内容都不是为了在页面上查看，而页面 `body` 中的所有内容都是为了查看。\n\
  \n***\n\n### 验证你的网页内容\n\n在第一章中，我讨论了测试页面的方法；测试页面的一种非常重要的方法是验证它们。可以这样想：设计和绘制一套精美的房屋蓝图是一回事，但建筑师将其盖章为适合施工的安全结构完全是另一回事了。验证你的网页是一个相似的过程；但在情况下，建筑师是一个应用程序——而不是人。\n\
  \n简而言之，验证是使用特殊的应用程序对你的页面进行测试，该程序会搜索错误并确保你的页面遵循严格的 XHTML 标准。验证非常简单。事实上，负责开发 Web 标准的机构——世界网联盟联盟（W3C）提供了一个你可以使用的在线验证工具。要验证页面，请访问此\
  \ URL：[`validator.w3.org/`](http://validator.w3.org/)。W3C 标记验证服务如图图 2.4 所示。\n\n\
  **图 2.4** W3C 标记验证服务允许你验证 HTML (XHTML) 文档，以确保其代码准确。\n\n![image](img/02fig04.jpg)\n\
  \n***\n\n### 窥视其他设计师的页面\n\n考虑到许多流行网页中存在的视觉（有时是音频）华丽效果，你可能意识到本章描述的简单页面只是 HTML 冰山的一角角。现在你已经掌握了基础知识，你可能会惊讶地发现，仅仅通过查看互联网上他人的页面，就能学到很多其他内容。你可以通过在任何网络浏览器中右键点击并选择“查看源代码”来查看任何页面的\
  \ HTML。\n\n如果你还不能读懂某些 HTML 标签的作用，或者不知道确切该如何使用它们，请不要担心。你将在接下来的章节中了解所有这些事情。然而，现在偷看一眼预览将让你看到你已经知道的标签是如何运行的，并让你对很快就能用你的网页做的事情有一个初步体验。\n\
  \n***\n\n如果你已经在网上发布了页面，可以使用“通过 URI 验证”（Validate by URI）标签。使用“通过文件上传验证”（Validate\
  \ by File Upload）标签来验证存储在本地计算机文件系统上的文件。“通过直接输入验证”（Validate by Direct Input）标签允许你从文本编辑器中粘贴文件内容。如果一切顺利，你的页面将获得一份通过报告（参见图\
  \ 2.5）。\n\n**图 2.5** 如果页面通过了 W3C 标记验证服务，你就知道它已经准备就绪。\n\n![image](img/02fig05.jpg)\n\
  \n如果 W3C 标记验证服务在你的网页中遇到错误，它将提供具体的细节（包括错误代码的行号）。这是寻找问题并从页面中清除错误代码的极佳方法。验证不仅告诉你你的页面是否构建正确，还能帮助你在将页面发布给世界看到之前发现并修复问题。\n\
  \n***\n\n**提示**\n\n某些 Web 开发工具包含了内置的验证功能，你可以用它们代替 W3C 标记验证服务。示例包括浏览器扩展，如 Firebug（[`getfirebug.com/`](http://getfirebug.com/))）和\
  \ HTML Validator ([`users.skynet.be/mgueury/mozilla/`](http://users.skynet.be/mgueury/mozilla/))），但许多其他程序也提供类似的功能；请检查你的用户文档。\n\
  \n***\n\n### 关于 HTML、XML、XHTML 和 HTML5 的内幕\n\n在早期，HTML 非常棒，因为它允许科学家以一种高效且相对结构化的方式在互联网上共享信息。直到后来，图形化浏览器被创建，HTML\
  \ 开始被用于编写科学论文以外的内容。HTML 迅速从一种用于研究人员的整洁的小标记语言变成了一种在线发布语言。在确定 HTML 可以为了图形化浏览进行装饰后，网页浏览器的创建者们给该语言添加了许多奇妙的功能而陷入疯狂。尽管这些新功能起初很棒，但它们损害了\
  \ HTML 的原始设计，并在浏览器显示网页的方式上引入了不一致性；新功能仅在某个浏览器中有效，而如果你恰好运行错误的浏览器，你就倒霉了。它开始变得像一个糟糕的房屋翻新工程——一个由许多承包商完成且缺乏妥善计划的任务。事实证明在此期间创建的一些浏览器特定功能现在已被采纳标准，而另一些则被完全抛弃。\n\
  \n正如大多数革命一样，Web 的诞生是非常混乱的，对 HTML 的修改反映了这种混乱。多年来，人们付出了巨大的努力来收敛 HTML 的不一致性，并为该语言恢复秩序。HTML\
  \ 混乱的问题在于它导致浏览器必须猜测如何显示页面，这并不是件好事。理想情况下，网页设计师应该能够精确定义页面的外观，并且无论用户使用何种浏览器或操作系统，页面看起来都一样。更好的是，设计师应该能够精确定义页面的*含义*，并让该页面在不同的浏览器和平台之间保持一致。这种乌托邦仍在未来的某处，但一种名为\
  \ XML（可扩展标记语言）的标记语言在引导我们向那里迈进的过程中发挥了重要作用。\n\nXML 是一种用于创建特定语言（如 HTML）的通用语言。听起来可能有点奇怪，但它意味着\
  \ XML 提供了一套基础结构和规则，任何标记语言都遵循这些规则。使用 XML，你可以创建一个独特的标记语言来描述任何类型的信息，包括网页。由于 XML 是一种创建其他标记语言的语言，你可以使用\
  \ XML 创建你自己的 HTML。例如，你可以创建一个名为 BCCML（瓶盖收藏标记语言）的标记语言，用它来创建和管理你的稀有瓶盖收藏。要点在于，XML 为以一致的方式组织信息奠定了基本规则，而这些信息可以是从网页到瓶盖的任何东西。\n\
  \n\n\n\n你可能认为瓶盖与 Web（万网）毫无关系，那么为什么要提到它们呢？原因是 XML 并不完全关于网页。XML 的范畴实际上比 Web 更广，它可以用于表示任何计算机上的任何类型的信息。如果你能想象出所有信息在全球范围内的计算机、手机、手持电脑、电视和收音机之间穿梭，你就能开始理解为什么\
  \ XML 的应用比仅仅清理网页要广泛得多。然而，XML 的早期应用之一是为 Web 恢复某种秩序，这就是为什么 XML 与学习 HTML 有关。\n\n如果\
  \ XML 描述数据比 HTML 好，这是否意味着 XML 将取代 HTML 成为 Web 首选的标记语言？并不是。XML 并不是 HTML 的替代品；它甚至不是\
  \ HTML 的竞争对手。XML 对 HTML 的影响在于清理 HTML。HTML 是一种相对无结构化的语言，受益于 XML 的规则。这两种技术的自然融合导致了\
  \ HTML 遵循 XML 的规则和结构。为了实现这种融合，制定了一个遵循更严格的 XML 规则的新版本 HTML。这种符合 XML 标准的新 HTML 版本被称为\
  \ XHTML。对你来说的是，你将在整本书中都会学习 XHTML，因为它真的只是一个更整洁的 HTML 版本。\n\n你可能听说过 HTML5，它被誉为下一个\
  \ Web 标准。它将会是，但尚未完全。当它成为 Web 标准时，并不会让 XHTML 变得毫无——HTML5 不是 XHTML 的替代品，而是 HTML 4\
  \ 的重大修订。换句话说，XHTML 和 HTML5 可以在 Web 上共存，目前支持 XHTML 的网页浏览器也将（有一天）支持 HTML5。\n\n本书的目标是引导你学习网页发布的基础知识，并将\
  \ XHTML 和 CSS 作为这些页面的核心语言。然而，只要可能，我都会注明 HTML5 中不存在的语言元素，以备你想设计更具可持续性的内容。如果你坚实地理解了网页发布以及\
  \ CSS 如何与页面整体标记语言（无论是 XHTML 还是 HTML5）工作，那么当你决定从 XHTML 转向 HTML5 时，将处于良好的位置。\n\n##\
  \ 总结\n\n本章介绍了网页及其工作原理的基础知识，包括 HTML 和 XHTML 之间的历史和区别。你学到了编码的 HTML 命令包含在文本文件中，并且手动输入\
  \ HTML 文本比使用图形编辑器为你创建 HTML 命令要好——尤其是当你正在学习 HTML 的时候。\n\n你接触了最基础、最重要的 HTML 标签。通过向任何纯文本文档添加这些编码命令，你可以快速将其转换为一个真正的网页。你学到了创建网页的第一步是在开头和结尾放置几个强制性的\
  \ HTML 标签，包括页面标题。然后你标记段落和行的结束处，并在需要时添加水平规则线和标题。表 2.1 总结了本章介绍的所有标签。\n\n表 2.1 第 2\
  \ 章 涵盖的 HTML 标签\n\n![image](img/02tab01.jpg)\n\n最后，你学习了 XML 和 XHTML，以及它们如何与 HTML\
  \ 关联，以及 HTML5 相对于你在这里学习的内容意味着什么。\n\n## 问答\n\n**Q. 我创建了一个网页，但当我用  浏览器打开文件时，我看到了所有的文本，包括\
  \ HTML 标签。有时我甚至会在页面顶部看到一些奇怪的乱码！我做错什么了？**\n\n**A.** 你没有将文件保存为纯文本。尝试重新保存文件，小心将其保存为“纯文本”（Text\
  \ Only）或“ASCII 文本”。如果你不确定如何让你的文字处理器做到，不要压力。只需在记事本或 TextEdit 中输入你的 HTML 文件即可，一切都应该运行正常。（另外，始终确保你的网页文件名以\
  \ `.html` 或 `.htm` 结尾。）\n\n**Q. 我在网上看到过开头没有 `<html>` 标签的网页。你说页面必须以 `<html>` 开始。这是怎么的？**\n\
  \n**A.** 如果你忘记包含 `<html>` 标签，许多网页浏览器都会原谅你并正确显示页面。然而，包含它是非常好的主意，因为某些软件确实需要它将页面识别为有效的\
  \ HTML。此外，你希望你的页面是真正的 XHTML 页面，符合最新的 Web 标准。\n\n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n### 测验\n\n**1.** 每一个 HTML 页面都需要哪四个标签？\n\n**2.** 你会使用哪些 HTML 标签和文本来生成以下网页内容：\n\n\
  • 一个带有 `We are Proud to Present` 字样的小标题\n• 一条横跨页面的水平规则\n• 一个带有单词 `Orbit` 的大标题\n\
  • 一个带有 `The Geometric Juggler` 字样的中等大小标题\n• 另一条水平规则\n\n**3.** 你会使用什么代码来创建一个完整的 HTML\
  \ 网页？\n\n### 答案\n\n**1.** `<html>`, `<head>`, `<title>` 和 `<body>`（以及它们的闭合标签 `</html>`,\
  \ `</head>`, `</title>` 和 `</body>`）。\n\n**2.** 你的代码应该如下：\n\n```html\n<h3>We are\
  \ Proud to Present</h3>\n<hr />\n<h1>Orbit</h1>\n<h2>The Geometric Juggler</h2>\n\
  <hr />\n```\n\n**3.** 你的代码应该如下：\n\n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n<title>Foo\
  \ Bar</title>\n</head>\n<body>\n  <h1>Happy Hour at the Foo Bar</h1>\n  <p>Come\
  \ on Down!</p>\n</body>\n</html>\n```\n\n\n\n\n\n```css\n/* 列表 3.1 单个外部样式表 */\n\n\
  body {\n  font-size: `10pt`;\n  font-family: Verdana, Geneva, Arial, Helvetica,\
  \ sans-serif`;\n  color: black;\n  line-height: `14pt`;\n  padding-left: `5pt`;\n\
  \  padding-right: `5pt`;\n  padding-top: `5pt`;\n}\n\nh1 {\n  font: `14pt Verdana,\
  \ Geneva, Arial, Helvetica, sans-serif`;\n  font-weight: bold;\n  line-height: `20pt`;\n\
  }\n\np.subheader {\n  font-weight: bold;\n  color: `#593d87`;\n}\n\nimg {\n  padding:\
  \ `3pt`;\n  float: right;\n}\n\na {\n  text-decoration: none;\n}\n\na:link, a:visited\
  \ {\n  color: `#8094d6`;\n}\n\na:hover, a:active {\n  color: `#FF9933`;\n}\n\ndiv.footer\
  \ {\n  font-size: `9pt`;\n  font-style: italic;\n  line-height: `12pt`;\n  text-align:\
  \ center;\n  padding-top: `30pt`;\n}\n```\n\n\n\n\n\n起初看起来可能有很多代码，但如果你仔细观察，你会发现每行代码并没有包含多少信息。将单独的样式规则单独放在一行是相当标准的做法，有助于让样式表更具可读性，但这完全取决于个人喜好；只要你继续使用分号来分隔每个规则，你可以将所有规则写在同一行（稍后会详细介绍）。说到代码的可读性，你注意到的这段样式表代码的第一点可能是，它看起来完全不像普通的\
  \ HTML 代码。CSS 使用了自己的一套语言来指定样式表。\n\n当然，列表中包含了一些熟悉的 HTML 标签。正如你猜的那样，样式表中的 `body`、`h1`、`p`、`img`、`a`\
  \ 和 `div` 指的是样式表将应用于 HTML 文档中对应的标签。每个标签名称后面的大括号包含了该标签内所有内容显示方式的规范。\n\n在这种情况下，样式表规定所有\
  \ `body` 都应以 10 磅（points）的大小渲染，使用 `Verdana` 字体（如果可能），颜色为黑色，行间距为 14 磅。如果用户没有安装 `Verdana`\
  \ 字体，样式表中的字体列表代表了浏览器搜索可用字体的顺序：`Geneva`，然后是 `Arial`，最后是 `Helvetica`。如果用户没有这些字体，浏览器将使用任何可用的默认无衬线字体（sans\
  \ serif）。此外，页面的左、右、顶部边距应各为 5 磅。\n\n`<h1>` 标签内的任何文本都应以 14 磅的加粗 `Verdana` 字体渲染。接下来，任何仅使用`<p>`\
  \ 标签的段落将继承 `body` 元素指示的所有样式。然而，如果 `<p>` 标签使用了名为 `subheader` 的特殊类，文本将加粗并显示为颜色 `#593d87`（一种紫色）。\n\
  \n列表 3.1 中每个测量值后的 `pt` 表示 `points`（磅，每英寸有 72 磅）。如果你愿意，可以用英寸（`in`）、厘米（`cm`）、像素（`px`）或字母\
  \ m 的宽度（称为 em `em`）来指定任何样式表测量单位。\n\n***\n\n注意\n\n你可以使用样式表指定任意大小的字体大小，尽管某些显示设备和打印机无法正确处理大于\
  \ 200 磅的字体。\n\n***\n\n你可能已经注意到列表中的每个样式规则都以分号（`;`）结尾。分号用于将各个样式规则隔开。因此，习惯做法是每个样式规则都以分号结尾，这样你就可以轻松在其之后添加另一个样式规则。\n\
  \n要将此样式表链接到 HTML 文档，请在每个文档的 `<head>` 部分包含一个 `<link />` 标签。列表 3.2 显示了图 3.1 中所示页面的\
  \ HTML 代码。它包含了以下 `<link />` 标签：\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"styles.css\" />\n```\n\n这假设样式表以 `styles.css` 的名称存储在与 HTML 文档相同的文件夹中。只要网页浏览器支持样式表——所有现代浏览器都支持样式表——样式表中指定的属性将应用于页面中的内容，而不需要任何特殊的\
  \ HTML 格式代码。这证实了 XHTML 的最终目标，即在网页内容与显示该内容所需的特定格式之间提供分离。\n\n列表 3.2 图 3.1 中所示页面的 HTML\
  \ 代码\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>About BAWSI</title>\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"\
  styles.css\" />\n  </head>\n  <body>\n    <h1>About BAWSI</h1>\n    <p><img src=\"\
  logo.gif\" alt=\"BAWSI logo\"/>The Bay Area Women's\n    Sports 倡议 (BAWSI) 是一家公益性、非营利性\n\
  \    公司，其使命是通过创建项目和合作伙伴关系，\n    让女运动员将健康、希望和完整带给\n    我们的社区。该机构由奥运冠军和世界杯足球\n   \
  \ 球星 Brandi Chastain、Julie Foudy 以及圣何塞 CyberRays\n    女子职业足球队前总经理 Marlene Bjornsrud\
  \ \n    于 2005 年创立，BAWSI 为女运动员成为\n    成为湾区体育文化中更具可见度和更有价值的\n    部分提供了有意义的途径。</p>\n\
  \    <p class=\"subheader\">BAWSI 的历史</p>\n    <p>BAWSI 的概念灵感源于女子运动史上最\n    壮丽的成就之一，并诞生于其最巨大的\n\
  \    失望之一……</p>\n    <p><a href=\"secondpage.html\">[继续阅读]</a></p>\n    <div class=\"\
  footer\">© 2005-2009 BAWSI\n    (www.bawsi.org)。保留所有权利。</div>\n  </body>\n</html>\n\
  ```\n\n***\n\n***\n\n提示\n\n在大多数浏览器中，你可以通过打开 .css 文件查看样式规则。要编辑自己的样式表，只需使用文本编辑器。\n\
  \n***\n\n***\n\n注意\n\n尽管 CSS 被广泛支持，但并非一直受到这种支持。要了解主要浏览器在 CSS 支持方面的比较，请查看此网站：[`www.quirksmode.org/css/contents.html`](http://www.quirksmode.org/css/contents.html)。\n\
  \n***\n\n尝试一下：创建一个样式表\n\n从开始，创建一个名为 `mystyles.css` 的新文本文档，并为以下基础标签 `<body>`、`<p>`、`<h1>`\
  \ 和 `<h2>` 添加样式规则。创建样式表后，创建一个包含这些基础标签的新 HTML 文件。尝试不同的样式规则，亲眼观察通过样式表中的简单更改改变整个段落文本。\n\
  \n### CSS 样式入门\n\n你现在已经熟悉了 CSS 样式表以及它们如何基于描述网页外观的样式规则。本章接下来的部分将提供一些重要样式属性的快速概述，并让你开始在自己的样式表中使用\
  \ CSS。\n\nCSS 包含了用于控制字体、颜色、对齐和边距的各种样式属性，仅举例此。CSS 中的样式属性可以大致分为两类：\n\n- 布局属性：影响网页上元素定位的样式属性组成，例如外边距、内边距、对齐等\n\
  - 格式属性：影响网站内元素视觉效果的样式属性组成，例如字体类型、大小、颜色等\n\n#### 布局属性\n\n\n\n\nCSS 布局属性用于确定内容在网页上的放置方式。最重要的布局属性之一是\
  \ `display` 属性，它描述了元素相对于其他元素的显示方式。`display` 属性有四种可能的值：\n\n- `block`—元素在一个新行中显示，就像新段落一样。\n\
  \n> 注意：`display` 属性依赖于一个名为 `relative positioning`（相对定位）的概念，这意味着元素是相对于页面上其他元素的位置进行定位的。CSS\
  \ 还支持 `absolute positioning`（绝对定位），它允许你独立于其他元素，将元素放置在页面上的某个精确位置。你将在第三部分中的“[使用 CSS\
  \ 进行高级网页设计]”中学习到更多关于这两种定位方式的知识。\n\n- `list-item`—元素在一个新行中显示，并带有一个列表项目标记（项目符号/点）。\n\
  - `inline`—元素与当前段落进行行内显示。\n- `none`—元素不显示；它被隐藏了。\n\n如果你将网页上的每个元素想象成在显示时占据一个矩形区域，那么理解\
  \ `display` 属性就会更容易——`display` 属性控制的就是这个矩形区域的显示方式。例如，`block` 值导致元素单独放置在一个新行上，而 `inline`\
  \ 值则将元素放置在紧邻之前的内容旁边。`display` 属性是少数可以应用于大多数样式规则的样式属性之一。以下是设置 `display` 属性的示例：\n\n\
  ```\ndisplay:block;\n```\n\n你通过 `width` 和 `height` 属性来控制元素矩形区域的大小。与许多尺寸相关的 CSS 属性一样，`width`\
  \ 和 `height` 属性值可以使用几种不同的测量单位指定：\n\n- `in`—英寸\n- `cm`—厘米\n- `mm`—毫米\n- `px`—像素\n\
  - `pt`—磅\n\n你可以在样式表中根据自己的意愿混合并匹配单位，但通常在一组相似的样式属性中保持一致是一个好做法。例如，你可能希望在字体属性上统一使用磅，在尺寸上统一使用像素。以下是使用像素单位设置元素宽度的示例：\n\
  \n```\nwidth: 200px;\n```\n\n### 格式属性\n\nCSS 格式属性用于控制网页上内容的显示，而不是控制内容的物理位置。最流行的格式属性之一是\
  \ `border` 属性，它用于通过框或部分部分框为元素建立一个可见的边界。以下 `border` 属性提供了描述元素边界的方法：\n\n- `border-width`—边框边的宽度\n\
  - `border-color`—边框边的颜色\n- `border-style`—边框边的样式\n- `border-left`—边框的左侧\n- `border-right`—边框的右侧\n\
  - `border-top`—边框的顶部\n- `border-bottom`—边框的底部\n- `border`—所有的边\n\n`border-width`\
  \ 属性用于建立框边的宽度。它通常以像素表示，如下代码所示：\n\n```\nborder-width:5px;\n```\n\n不出意料的是，`border-color`\
  \ 和 `border-style` 属性用于设置边框颜色和样式。以下是设置这两个属性的示例：\n\n```\nborder-color:blue;\nborder-style:dotted;\n\
  ```\n\n`border-style` 属性可以设置为以下任何值之一：\n\n- `solid`—单线边框\n- `double`—双线边框\n- `dashed`—虚线边框\n\
  - `dotted`—点线边框\n- `groove`—具有凹槽外观的边框\n- `ridge`—具有凸起外观的边框\n- `inset`—具有内凹外观的边框\n\
  - `outset`—具有凸出外观的边框\n- `none`—无边框\n\n`border-style` 属性的默认值为 `none`，这就是为什么除非将边界属性设置为不同的样式，否则元素就没有边界。最常见的边框样式是\
  \ `solid` 和 `double` 样式。\n\n> 注意：默认 `border-style` 为 `none` 的例外是图像放置在 `<a>` 标签内并作为链接图片。在这种情况下，默认会自动设置实线边框。这就是为什么你经常看到带有\
  \ `border-style:none` 样的链接图片，这会关闭自动边框。\n\n`border-left`、`border-right`、`border-top`\
  \ 和 `border-bottom` 属性允许你单独设置元素每个边的边框。如果你希望四边的边框看起来相同，可以使用单独的 `border` 属性，它接收由空格隔开的样式：`border-width`、`border-style`\
  \ 和 `border-color`。以下是使用 `border` 属性设置由两条（双线）红线组成、总宽度为 10 像素的边框的示例：\n\n```\nborder:10px\
  \ double red;\n```\n\n`border` 属性设置边框颜色。`background-color` 属性设置文本后的颜色。以下是同时设置这两个属性的示例：\n\
  \n```\ncolor:black;\nbackground-color:orange;\n```\n\n\n\n\n\n- `color`—使用标准颜色名称或十六进制颜色代码设置文本颜色（更多信息请参见第\
  \ 8 章）。\n- `text-decoration`—用于关闭链接下划线——将其设置为 `none` 即可。也支持 `underline`（下划线）、`italic`（斜体）和\
  \ `line-through`（删除线）值。链接样式的应用请参见第 7 章中的“使用外部和内部链接”。\n- `text-align`—将文本对齐到 `left`（左对）、`right`（右对）或\
  \ `center`（居中），并使用 `justify` 值实现两端对齐。\n- `padding`—在元素的左、右、顶部和底部添加内边距；这些内边距可以是测量单位或页面宽的百分比。如果你想独立地为元素的左右添加内边距，请使用\
  \ `padding-left` 和 `padding-right`。根据需要使用 `padding-top` 或 `padding-bottom` 为元素的顶部或底部添加内边距。你将在第\
  \ 9 章中的“处理外边距、内边距、对齐和浮动””以及第 10 章中的“理解 CSS 盒模型和定位”中学习更多这些样式属性的知识。\n\n### 使用样式类\n\
  \n这是一本自学书籍，所以你不需要参加课程来学习如何为页面添加精美的样式，尽管你确实需要学习什么是样式类。当你希望页面上的某些文本看起来与其他文本不同时，你就可以创建一个类似于自定义构建的\
  \ HTML 标签。你定义的每种特殊格式文本都被称为样式类（style class）。样式类是一组自定义的格式规范，可以应用于网页中的任何元素。\n\n在向你展示样式类之前，我需要快速回退一步，澄清一些\
  \ CSS 术语。首先，CSS 样式属性（style property）是一种可以赋值的特定样式，例如 `color` 或 `font-size`。你通过选择器（selector）将样式属性及其相应的值与网页上的元素关联起来。选择器用于标识页面上你应用样式的标签。以下是一个在基础样式规则中包含选择器、属性和值的示例：\n\
  \n```css\nh1 { font: 36pt Courier; }\n```\n\n在这段代码中，`h1` 是选择器，`font` 是样式属性，而 `36pt\
  \ Courier` 是值。选择器之所以重要，是因为这意味着字体设置将应用于网页中所有的 `h1` 元素。但也许你想要区分某些 `h1` 元素——那该怎么办呢？答案就在样式类中。\n\
  \n假设你想在文档中使用两种不同类型的 `<h1>` 标题。你可以通过在样式表中放入以下 CSS 代码，为每种标题创建一个样式类：\n\n```css\nh1.silly\
  \ { font: 36pt Comic Sans; }\nh1.serious { font: 36pt Arial; }\n```\n\n注意，这些选择器在\
  \ `h1` 之后包含一个点（`.`），紧后跟着一个描述性的类名。要在两个样式类之间进行选择，请使用 `class` 属性，如下：\n\n```html\n<h1\
  \ class=\"silly\">Marvin's Munchies Inc. </h1>\n<p>关于 Marvin's Munchies 的文本放在这里。\
  \ </p>\n```\n\n或者你也可以使用这个：\n\n```html\n<h1 class=\"serious\">MMI Investor Information</1>\n\
  <p>给商业投资者的文本放在这里。</p>\n```\n\n在 HTML 代码中引用样式类时，只需在元素的 `class` 属性中指定类名即可。在前面的示例中，`Marvin's\
  \ Munchies Inc.` 这几个词将以 36 点的 Comic Sans 字体显示，前提是你已经在网页顶部包含了指向样式表的 `<link />`，并且假设用户安装了\
  \ Comic Sans 字体。`MMI Investor Information` 这几个词将改以 36 点的 Arial 字体显示。你可以在示例 3.2 中看到类的应用的另一个示例；请寻找\
  \ `subheader <p>` 类和 `footer <div>` 类。\n\n如果你想创建一个可以应用于任何元素（不仅仅是标题或其他特定标签）的样式类怎么办？你可以将样式类与\
  \ `<div>` 标签关联，如示例 3.2 所示，它用于将任何文本封装在一个类似于段落的块中；`<div>` 标签是另一个常用的容器元素。\n\n你基本上可以通过使用\
  \ `div` 选择器后跟点（`.`），然后是你自己命名的任何类名以及你选择的任何样式规范来创建自己的自定义 HTML 标签。该标签可以同时控制任意数量的字体、间距和边缘设置。在页面的任何你想应用自定义标签的地方，使用带有\
  \ `class` 属性的 `<div>` 标签并后跟你创建的类名。\n\n> 提示\n> 你可能注意到当样式规则中包含多个属性时，编码风格发生了变化。对于只有一个样式的样式规则，你通常会看到属性与规则在同一行，如下所示：\n\
  > ```css\n> div.footer { font-size: 12pt; }\n> ```\n\n\n\n\n在某些情况下，你可能希望指定仅用于单个网页的样式，在这种情况下，你可以将样式表封装在\
  \ `<style>` 和 `</style>` 标签之间，并直接包含在 HTML 文档中。以此方式使用的样式表必须出现在 HTML 文档的 `<head>`\
  \ 中。不需要 `<link />` 标签，而且你无法从任何其他页面引用该样式表（除非你也将其复制到该文档的开头）。正如你在本节稍早时候学到的，这种类型的样式表被称为内部样式表。\n\
  \nListing 3.3 展示了如何指定内部样式表的示例。\n\nListing 3.3 带有内部样式表的网页\n\n***\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Some Page</title>\n\
  \    <style type=\"text/css\">\n      div.footer {\n        font-size: 9pt;\n  \
  \      line-height: 12pt;\n        text-align: center;\n      }\n    </style>\n\
  \  </head>\n  <body>\n  ...\n  <div class=\"footer\">\n    Copyright 2009 Acme Products,\
  \ Inc.\n  </div>\n  </body>\n</html>\n```\n\n***\n\n### 备注\n\n`<span>` 和 `</span>`\
  \ 是占位标签，它们本身不起任何作用，只是指定一个内容范围以便应用你添加的任何 `style` 属性。`<div>` 和 `<span>` 之间的唯一区别在于\
  \ `<div>` 是一个块级元素，因此会强制换行，而 `<span>` 则不会。因此，你应该使用 `<span>` 来修改任何出现在句子或段落中间且不产生换行的文本部分的样式。\n\
  \n***\n\n在列表代码中，`div.footer` 样式类定义在出现在页面 `<head>` 中的内部样式表中。该样式类现在可以在页面的 `<body>`\
  \ 中使用了。事实上，它被用于页面的 `<body>` 中来为版权声明设置样式。\n\n如果你想创建一个在页面内多次使用的样式规则，那么内部样式表是非常方便的。但在某些情况下，你可能需要对某个特定元素应用唯一的样式。这需要内联样式规则，它允许你仅为页面的一小部分（例如单个元素）指定样式。例如，你可以通过\
  \ `style` 属性在 `<p>`、`<div>` 或 `<span>` 标签内创建并应用样式规则。这种样式被称为内联样式，因为它是直接在 HTML 代码中间指定的。\n\
  \n以下是示例 `style` 属性的可能写法：\n\n```html\n<p style=\"color:green\">\n  这段文字是绿色的，但 <span\
  \ style=\"color:red\">这段文字是红色的。</span>\n  又变回绿色，但...\n</p>\n\n<p>\n  ...现在绿色结束了，我们回到了页面的默认颜色。\n\
  </p>\n```\n\n***\n\n### 验证你的样式表\n\n正如验证你的 HTML 或 XHTML 标记很重要一样，验证你的样式表同样重要。用于 CSS\
  \ 的特定验证工具可以在 `http://jigsaw.w3.org/css-validator/` 找到。就像在 第 2 章 “理解 HTML 和 XHTML\
  \ 连接”中讨论的验证工具一样，你可以将工具指向网页地址、上传文件或将内容粘贴到提供的表单字段中。最终目标是得到如图 3.3 所示的结果：有效！\n\n**图\
  \ 3.3** W3C CSS 验证器显示 Listing 3.1 中的样式表内容没有错误。\n\n![image](img/03fig03.jpg)\n\n\
  ***\n\n这段代码利用 `<span>` 标签展示如何在内联样式规则中应用 `color` 样式属性。事实上，示例中的 `<p>` 标签和 `<span>`\
  \ 标签都使用 `color` 属性作为内联样式。理解的是，对于出现在 `<span>` 和 `</span>` 标签之间的文本，`color:red` 样式属性覆盖了\
  \ `color:green` 样式属性。然后在第二个段落中，没有一个……\n\n## 总结\n\n在本章中，你学习了包含样式的三种主要方法：外部样式表、放置在\
  \ `<head>` 中的内部样式表以及通过 `style` 属性使用的内联样式。你还学习了级联样式效果，它从外部样式表开始，被内部样式表覆盖，再被内联样式覆盖。\n\
  \n## 问答\n\n**Q. 假设我为页面链接了一个样式表，说明所有文本应该是蓝色的，但页面中有一个 `<span style=\"color:red\">`\
  \ 标签。这段文字会显示为蓝色还是红色？**\n\n**A.** 红色。本地样式始终优先。\n\n**Q. 我可以向单个页面链接多个样式表吗？**\n\n**A.**\
  \ 可以可以。例如，你可能有一个用于格式化（文本、字体、颜色等）的表，另一个用于布局（外边距、内边距、对齐等）的表——只需为两者都包含 `<link />` 即可。从技术上讲，CSS\
  \ 标准要求网页浏览器在通过 `<link />` 标签呈现多个样式表时为用户提供选择。但在实践中，所有主要的网页浏览器都简单地包含每一个样式表。链接多个样式表的优选技术涉及\
  \ `@import` 命令。\n\n```css\n@import url(styles1.css);\n@import url(styles2.css);\n\
  ```\n\n类似于 `<link />` 标签，`@import` 命令必须放置在网页的 `<head>` 中。在第 25 章学习如何专门为打印页面创建样式表时，你会学更多关于这个实用的小命令。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对材料的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n1. 使用什么代码创建一个样式表，以指定\
  \ 30 磅蓝色 Arial 标题以及其他文本为双倍行距、10 磅蓝色 Times Roman（或浏览器默认字体）？\n2. 如果你将问题 1 中制作样式表保存为\
  \ `corporate.css`，你会如何将其应用于名为 `intro.html` 的网页？\n3. 有多少种方法可以确保样式规则可以应用到你的内容中？\n\n\
  #### 答案\n\n1. 你的样式表将包含以下内容：\n\n\n\n\n\n```css\nh1 { font: 30pt blue Arial; }\nbody\
  \ { font: 10pt blue; }\n```\n\n2. 将以下标签置于 `intro.html` 文档的 `<head>` 标签和 `</head>`\
  \ 标签之间：\n\n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"corporate.css\"\
  \ />\n```\n\n3. 三种方式：外部、内部和内联。\n\n## 练习题\n\n- 使用你在本章之前创建的样式表，为你的样式表添加一些样式类（classes）。为了看到你的劳动成果，请将这些类应用到你创建的\
  \ HTML 页面中。在 `<h1>` 和 `<p>` 标签上使用类来感受一下。\n- 为你的网站开发一个标准的样式表，并将其链接到所有页面。（对于需要偏离该标准的页面，使用内部样式表和/或内联样式。）如果你在公司工作，很可能公司已经为印刷材料开发了字体和样式规范。获取这些规范的副本，并在公司网页上也遵循这些规范。\n\
  - 请务必探索 `http://www.w3.org/Style/CSS/` 官方样式表规范，并尝试本章未涵盖的某些冷门样式属性。\n\n## 第 4 章 理解\
  \ JavaScript\n\n在本章你将学到：\n\n- 什么是网页脚本以及它有什么用\n- 脚本和编程有什么区别（以及相似之处）\n- JavaScript\
  \ 是什么以及它源于何\n- 如何在网页中包含 JavaScript 命令\n- JavaScript 能为你的网页做什么\n- 脚本的开始与结束\n- JavaScript\
  \ 语句的格式化\n- 脚本如何显示结果\n- 在网页文档中包含脚本\n- 在你的浏览器中测试脚本\n- 修改脚本\n- 处理脚本中的错误\n- 将脚本移动到单独的文件\n\
  \n全球维网（WWW）最初是一种纯文本媒介——第一批浏览器甚至不支持网页中的图像。从那些早期日子以来，Web 已经取得了巨大的进步，今天的网站除了有用内容外，还包含了丰富的视觉和交互功能：图形、声音、动画和视频。网页脚本语言（如\
  \ `JavaScript`）是增加网页活力并以新方式与用户交互的最的方法之一。\n\n本章的第一部分介绍了网页脚本的概念和 `JavaScript` 语言。随着章节的进行，你将学习如何直接在你的\
  \ HTML 文档中包含 JavaScript 命令，以及当在浏览器中查看页面时你的脚本将如何执行。你将处理一个简单的脚本，对其进行编辑，并在浏览器中进行测试，同时学习创建和使用\
  \ `JavaScript` 脚本涉及的基础任务。\n\n### 学习网页脚本基础\n\n在科幻电影（以及许多其他没有借口的电影）世界里，计算机经常被视为听从英语命令。尽管这在不久的将来确实可能发生，但目前计算机认为理解\
  \ `BASIC`、`C` 和 `Java` 等语言要容易得多。\n\n你已经知道如何使用一种计算机语言了：`HTML`。你使用 `HTML` 标签来描述你希望如何格式化文档，浏览器会听从你的命令并向用户显示格式化后的文档。但由于\
  \ `HTML` 是一种简单的文本标记语言，它无法响应用户、做出决策或自动执行重复任务。诸此类交互式任务需要更复杂的语言：编程语言或脚本语言。\n\n尽管许多编程语言是复杂的，但脚本语言通常是简单的。它们具有简单的语法，可以用最少的命令完成任务，并且易于学习。网页脚本语言允许你将脚本与\
  \ `HTML` 结合，创建交互式网页。\n\n### 脚本与程序\n\n电影或剧本遵循脚本——一份供演员表演的动作（或台词）列表。网页脚本为浏览器提供相同类型的指令。`JavaScript`\
  \ 中的脚本范围从单行到全功能应用程序。（无论何种情况，`JavaScript` 脚本通常都在浏览器中运行。）\n\n> 注意\n> `JavaScript`\
  \ 是脚本语言还是编程语言？这取决于你问\n\n有些编程语言必须在执行之前被编译或翻译成机器码。而 `JavaScript` 是解释型的：它在 `HTML` 更改时就会执行。更改\
  \ `HTML` 脚本非常简单。\n\n> 注意\n> 解释型语言有缺点——它们不适合执行复杂的任务，如图形。\n\n### 介绍 JavaScript\n\n\
  `JavaScript` 是由 Netscape 公司（网景浏览器的制造商）开发的。`JavaScript` 是第一个被浏览器支持的脚本语言，它仍然是最流行的。`JavaScript`\
  \ 学习起来几乎和 `HTML` 一样简单。它可以做的事情：\n\n> 注意\n> 一段历史：`JavaScript` 最初被称为 `LiveScript`，于\
  \ 1995 年引入 Netscape Navigator 2.0。为了表明与 `Java` 语言的营销关系——尽管在结构上没有其他关系。\n\n- 验证表单内容并进行计算（例如，订单表可以自动显示总和）\n\
  - 当鼠标悬停在图像上时制作动画图像\n- 创建与用户交互的横幅，而不仅仅是显示图形\n- 检测使用的浏览器或功能并仅执行高级功能\n- 检测已安装的插件并在需要时通知用户\n\
  -不需要用户刷新的情况下修改网页的所有或部分\n- 显示从远程服务器检索的数据\n\n你可以使用 `JavaScript` 实现这一切更多，包括创建整个应用程序。我们将在书中探讨\
  \ `JavaScript` 的用法。\n\n### JavaScript 如何融入网页\n\n使用 `<script>` 标签，你可以向网页文档添加一个短脚本（在本例中只有一行），如列表\
  \ 4.1;\n    // 停止隐藏脚本 -->\n    </script>\n    </p>\n</body>\n</html>\n```\n\n\n\n\
  \n\nJavaScript 的 `document.write` 语句（你稍后将学习更多关于它的知识）可以将输出作为网页文档的一部分。在这种情况下，它显示文档的修改日期，如图\
  \ 4.1 所示。\n\n**图 4.1** 使用 `document.write` 显示修改日期。\n\n![image](img/04fig01.jpg)\n\
  \n在这个示例中，我们将脚本放置在 HTML 文档的 `body` 中。实际上，你可以在四个不同的地方使用脚本：\n\n- **在页面的 `body` 中**——在这种情况下，当浏览器加载页面时，脚本的输出将作为\
  \ HTML 文档的一部分显示。\n- **在页面头部的 `<head>` 标签之间**——置在页面头部的脚本无法在 HTML 文档中创建输出，但可以被其他脚本引用。头部通常用于函数——即一组可以作为单一单元使用的\
  \ JavaScript 语句组。你将在第 14 章“开始 JavaScript 编程(#ch14.html_ch14)”中学习更多关于函数的知识。\n- **在\
  \ HTML 标签内部，例如 `<body>` 或 `<form>`**——这被称为*事件处理器*，它允许脚本与 HTML 元素协同工作。在事件处理器中使用 JavaScript\
  \ 时，你不需要使用 `<script>` 标签。你将在第 14 章中学习更多关于事件处理器的知识。\n- **在完全独立的文件中**——JavaScript\
  \ 支持使用 `.js` 扩展的文件包含脚本；这些文件可以通过在 `<script>` 标签中指定文件来引入。\n\n### 使用单独的 JavaScript\
  \ 文件\n\n当你创建更复杂的的脚本时，你会很快发现 HTML 文档变得庞大且混乱。为了避免这种情况，你可以使用一个或多个外部 JavaScript 文件。这些是带有\
  \ `.js` 扩展且包含 JavaScript 语句的文件。\n\n所有现代浏览器都支持外部脚本。要使用外部脚本，你可以在 `<script>` 标签中指定其文件名：\n\
  \n```\n<script type=\"text/javascript\" src=\"filename.js\"></script>\n```\n\n由于你将\
  \ JavaScript 语句放在了单独的文件中，因此你不需要起始和结束的 `<script>` 标签之间放置任何内容——事实上，它们之间的任何内容都会被浏览器忽略。\n\
  \n***\n\n**提示**\n\n外部 JavaScript 文件有一个明显的优势：你可以从两个或多个 HTML 文档链接到同一个 `.js` 文件。因为浏览器会将此文件存储在缓存中，这可以缩短网页显示的时间。\n\
  \n***\n\n你可以使用文本编辑器创建 `.js` 文件。它应该包含一个或多个 JavaScript 命令且仅包含 JavaScript——不要包含 `<script>`\
  \ 标签、其他 HTML 标签或 HTML 注释。将 `.js` 文件保存与引用它的 HTML 文档相同的目录中。\n\n#### 理解 JavaScript\
  \ 事件\n\n使用 JavaScript 可以完成的许多有用功能都涉及与用户交互，这意味着要响应*事件*——例如，点击链接或按钮。你可以在 HTML 标签内定义事件处理器，以告诉浏览器如何响应事件。例如，列表\
  \ 4.2 定义了一个点击时会显示消息的按钮。\n\n列表 4.2 一个简单的事件处理器\n\n***\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Event Test</title>\n  </head>\n  <body>\n\
  \    <h1>Event Test</h1>\n    <button type=\"button\"\n            onclick=\"alert('You\
  \ clicked the button.')\">\n            Click Me!\n    </button>\n  </body>\n</html>\n\
  ```\n\n***\n\n在本书的贯穿始终的各个地方中，你将学习更多关于 JavaScript 事件模型以及如何创建简单和复杂的事件处理器的知识。\n\n###\
  \ 探索 JavaScript 的功能\n\n如果你花过时间浏览 Web，那么你一定见过很多 JavaScript 运行的示例。以下是 JavaScript 典型应用的简要描述，你将在本书的后部分进一步探索这些内容。\n\
  \n#### 改进导航\n\nJavaScript 最常用的用途之一是网站的导航系统。你可以使用 JavaScript 创建导航工具——例如，用于选择下一页的下拉菜单，或者在悬停在导航链接上时弹出的子菜单。\n\
  \n如果处理得当，这种 JavaScript 交互性可以使网站更易用，同时保持对不支持 JavaScript 的浏览器的可用性。\n\n#### 表单验证\n\n\
  表单验证是 JavaScript 的另一个常见用途。简单的脚本可以读取用户输入到表单中的值，并确保它们的格式正确，例如邮政编码或电话号码。这允许用户注意到常见的错误并修复它们，而无需等待\
  \ Web 服务器的响应。\n\n#### 特殊效果\n\nJavaScript 最早且最令人讨厌的用途之一是创建吸引眼球的效果——例如，在状态栏中滚动消息，或闪烁页面背景颜色。\n\
  \n幸运的是，这些技术已经过时了，但得益于 W3C DOM 和最新的浏览器，使用 JavaScript 可以实现一些令人印象深刻的效果——在幻灯片图像之间创建淡入淡出的过渡。\n\
  \n#### 远程脚本 (AJAX)\n\n在很长一段时间内，JavaScript 最大的局限性是无法与服务器通信。你可以使用它来验证电话号码位数是否正确，但无法查询用户的位置。\n\
  \n现在 JavaScript 的一些高级功能已被大多数浏览器支持，这种情况已不再如此。你的脚本可以在不加载页面的情况下从服务器获取数据，并将数据传回服务器。这些功能统称为\
  \ AJAX（异步 JavaScript 和 XML），或*远程脚本*。如果你用过 Google 的 Gmail 应用程序或 way 版本的 Yahoo! Mail\
  \ 或 Microsoft Hotmail，你就见过 AJAX 的运行。所有这些都使用远程脚本为你提供与后台服务器交互的响应式界面。你将在第 24 章“AJAX：远程脚本(#ch24.html_ch24)”学习如何开发\
  \ AJAX 脚本。\n\n### 使用 JavaScript 显示时间\n\nJavaScript 一个常见且简单的用途是显示日期和时间。因为 JavaScript\
  \ 运行在浏览器上，它显示的时间将是用户所在时区的时间。然而，你也可以使用 JavaScript 计算“通用”时间。\n\n***\n\nUTC 代表协调世界时，它是基于旧\
  \ GMT（格林尼治标准时间）标准的原子时间标准。这是穿过英国格林尼的主子线的时间。\n\n***\n\n作为 JavaScript 的基础介绍，你现在将创建一个简单的脚本，在网页中显示当前\
  \ UTC 时间，从下一节开始。\n\n#### 编写脚本\n\n你的脚本像大多数 JavaScript 程序一样，从 HTML `<script>` 标签开始。正如你在本章前面学到的那样，你使用\
  \ `<script>` 和 `</script>` 标签在 HTML 文档中包围脚本。\n\n***\n\n**警告**\n\n记住在起始和结束的 `<script>`\
  \ 标签之间只包含有效的 JavaScript 语句。如果浏览器在 `<script>` 标签内发现任何非有效的 JavaScript 语句，将显示 JavaScript\
  \ 错误消息。\n\n***\n\n要开始创建脚本，打开你喜欢的文本编辑器并输入所示的起始和结束 `<script>` 标签。\n\n```html\n<script\
  \ type=\"text/javascript\"></script>\n```\n\n\n\n\n你的脚本现在需要确定本地时间和 UTC 时间，然后将它们显示在浏览器中。幸运的是，所有困难的部分（例如日期格式之间的转换）都内置在\
  \ JavaScript 解释器中了。\n\n### 在变量中存储数据\n\n要开始编写脚本，你将使用一个 `variable`（变量）来存储当前日期。你将在第\
  \ 16 章 的“使用 JavaScript 变量、字符串和数组”中学习更多关于变量的知识。变量是一个可以存储值的容器——数字、文本，或者在本例中，一个日期。\n\
  \n要开始编写脚本，请在第一个 `<script>` 标签之后添加以下行。请确保在你的版本中使用相同的大小写组合，因为 JavaScript 命令和变量名是大小写敏感的。\n\
  \n```javascript\nnow = new Date();\n```\n\n此语句创建了一个名为 `now` 的变量并将当前日期和时间存储其中。此语句以及你在脚本中使用的其他语句使用了\
  \ JavaScript 内置的 `Date` 对象，它让你能够方便地处理日期和时间。你将在第 17 章 的“使用 JavaScript 函数和对象”中学习更多关于处理日期的知识。\n\
  \n注意\n\n注意上一个语句末尾的分号。它告诉浏览器已到达语句的结束。分号是可选的，但使用它们可以帮助你避免一些常见的错误。为了清晰起见，我们将在本书中使用它们。\n\
  \n### 计算结果\n\n在内部，JavaScript 将日期存储为自 1970 年 1 月 1 日以来的毫秒数。幸运的是，JavaScript 包含了许多各种方式转换日期时间的函数，因此你不需要思考如何将毫秒转换为天、日期和时间。\n\
  \n继续你的脚本，请在最后的 `</script>` 标签之前添加以下两个语句：\n\n```javascript\nlocaltime = now.toString();\n\
  utctime = now.toGMTString();\n```\n\n注意\n\n`localtime` 和 `utctime` 变量存储的是文本，例如 `January\
  \ 1, 2001 12:00 PM`。在编程术语中，一段文本被称为 `string`（字符串）。\n\n这些语句创建了两个新变量：`localtime` 包含易读格式的当前时间和日期，而\
  \ `utctime` 包含对应的 UTC 时间。\n\n### 创建输出\n\n你现在有两个变量——`localtime` 和 `utctime`——它们包含了我们从脚本想要的结果。当然，除非我们可以看到它们，否则这些变量对我们没有大用。JavaScript\
  \ 包含了多种显示信息的方法，最简单的一种是 `document.write` 语句。\n\n`document.write` 语句显示文本字符串、数字或你传递给它的任何内容。由于你的\
  \ JavaScript 程序将在网页中使用，因此输出将作为页面的一部分显示。要显示结果，请在最后的 `</script>` 标签之前添加这些语句：\n\n```javascript\n\
  document.write(\"<strong>Local time:</strong> \" + localtime + \"<br/>\");\ndocument.write(\"\
  <strong>UTC time:</strong> \" + utctime);\n```\n\n这些语句告诉浏览器向包含你脚本的网页添加一些文本。输出将包含介绍结果的简短字符串以及\
  \ `localtime` 和 `utctime` 变量的内容。\n\n注意引号内的 HTML 标签，例如 `<strong>`——因为 JavaScript\
  \ 的输出出现在网页中，所以它需要使用 HTML 进行格式化。第一行中的 `<br/>` 标签确保两个时间将分行显示。\n\n注意\n\n注意列表 4.3 中文本和变量之间使用的加号（`+`）。在这种情况下，它告诉浏览器将值合并为一个文本字符串。如果你在两个数字之间使用加号，它们会被相加。\n\
  \n### 将脚本添加到网页中\n\n你现在应该有一个完整的脚本，它可以计算结果并将其显示。你的代码列表应该与列表 4.3 一致。\n\n列表 4.3 完整的日期和时间脚本\n\
  \n```html\n<script type=\"text/javascript\">\n\nnow = new Date();\n\nlocaltime =\
  \ now.toString();\n\nutctime = now.toGMTString();\n\ndocument.write(\"<strong>Local\
  \ time:</strong> \" + localtime + \"<br/>\");\n\ndocument.write(\"<strong>UTC time:</strong>\
  \ \" + utctime);\n\n</script>\n```\n\n要使用你的脚本，你需要将其添加到 HTML 文档中。如果你使用了到目前章节中看到的通用模板，你最终得到的应该类似于列表\
  \ 4.4。\n\n列表 4.4 HTML 文档中的日期和时间脚本\n\n```html\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n\n \
  \   <title>显示时间和日期</title>\n  </head>\n  <body>\n\n<script type=\"text/javascript\"\
  >\n\nnow = new Date();\n\nlocaltime = now.toString();\n\nutctime = now.toGMTString();\n\
  \ndocument.write(\"<strong>Local time:</strong> \" + localtime + \"<br/>\");\n\n\
  document.write(\"<strong>UTC time:</strong> \" + utctime);\n\n</script>\n\n</body>\n\
  </html>\n```\n\n注意\n\n注意上一个语句末尾的分号。它告诉浏览器已到达语句的结束。分号是可选的，但使用它们可以帮助你避免一些常见的错误。为了清晰起见，我们将在本书中使用它们。\n\
  \n测试脚本\n\n现在你已经有了 HTML，只需在网页浏览器中加载它即可。如果你输入的脚本正确，你的浏览器应该显示结果，如图 4.2 所示。（当然，你的结果与我的不一样。）\n\
  \n**图 4.2** Firefox 显示了日期和时间脚本的结果。\n\n![image](img/04fig02)\n\n关于 Internet Explorer\
  \ 6.0 及以上版本的说明：根据你的设置，脚本可能不会执行，顶部的黄色条可能会显示安全警告。在这种情况下，点击黄色条并选择“允许阻塞的内容”（Allow Blocked\
  \ Content）以允许你的脚本运行。（因为默认安全设置允许在线文档运行 JavaScript，但不允许本地文件。）\n\n修改脚本\n\n虽然当前脚本确实显示了当前日期和时间，但它的显示还没有墙上或桌面上的钟漂亮。为了解决这个问题，你可以使用一些\
  \ JavaScript 特性和一些 HTML 来显示一个大钟。\n\n为了显示大钟，我们需要将小时、分、秒放在独立的变量中。再次，JavaScript 有内置函数可以完成大部分工作：\n\
  \n```javascript\nhours = now.getHours();\nmins = now.getMinutes();\nsecs = now.getSeconds();\n\
  ```\n\n这些语句使用 JavaScript 内置函数为 `hours`、`mins` 和 `secs` 变量加载时间组件。在小时、分、秒成为独立变量后，你可以创建\
  \ `document.write` 语句来显示它们：\n\n```javascript\ndocument.write(\"<h1>\");\n\ndocument.write(hours\
  \ + \":\" + mins + \":\" + secs);\n\ndocument.write(\"</h1>\");\n```\n\n第一个语句显示一个\
  \ HTML `<h1>` 标签以便以大字体显示时。第二个语句通过冒号显示 `hours`、`mins` 和 `secs` 变量，第三个语句添加闭合标签 `</h1>`。\n\
  \n你可以将前面的语句添加到原始的日期和时间脚本中以添加大钟显示。列表 4.5 显示了脚本的完整版本。\n\n列表 4.5 带有大钟显示的日期和时间脚本\n\n\
  ```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n\n    <title>显示时间和日期</title>\n\
  \  </head>\n  <body>\n\n<script type=\"text/javascript\">\n\nnow = new Date();\n\
  \nlocaltime = now.toString();\n\nutctime = now.toGMTString();\n\ndocument.write(\"\
  <strong>Local time:</strong> \" + localtime + \"<br/>\");\n\ndocument.write(\"<strong>UTC\
  \ time:</strong> \" + utctime);\n\nhours = now.getHours();\nmins = now.getMinutes();\n\
  secs = now.getSeconds();\n\ndocument.write(\"<h1>\");\n\ndocument.write(hours +\
  \ \":\" + mins + \":\" + secs);\n\ndocument.write(\"</h1>\");\n\n</script>\n\n</body>\n\
  </html>\n```\n\n\n\n\n<html>\n  <body>\n    <h1>当前日期和时间</h1>\n    <script type=\"\
  text/javascript\">\n      now = new Date();\n      localtime = now.toString();\n\
  \      utctime = now.toGMTString();\n      document.write(\"<strong>本地时间：strong>\
  \ \"\n          + localtime + \"<br/>\");\n      document.write(\"<strong>UTC 时间：strong>\
  \ \" + utctime);\n      hours = now.getHours();\n      mins = now.getMinutes();\n\
  \      secs = now.getSeconds();\n      document.write(\"<h1>\");\n      document.write(hours\
  \ + \":\" + mins + \":\" + secs);\n      document.write(\"</h1>\");\n    </script>\n\
  \  </body>\n</html>\n\n***\n\n现在你已经修改了脚本，请保存该 HTML 文件并在浏览器中打开修改后的文件。如果浏览器一直在运行，你可以简单地使用\
  \ `Reload` 按钮加载新版本的脚本。尝试一下并验证窗口上半部分和新大时钟显示的是相同的时间。图 4.3 显示了结果。\n\n**图 4.3** Firefox\
  \ 显示了修改后的日期和时间脚本。\n\n![image](img/04fig03.jpg)\n\n## 处理 JavaScript 错误\n\n当你开发更复杂的\
  \ JavaScript 应用程序时，不可避免地会遇到错误。JavaScript 错误通常是由拼错误的 JavaScript 语句引起的。\n\n若要查看 JavaScript\
  \ 错误消息的示例，请修改你在上一节中添加的语句。我们将使用一个常见的错误：漏掉其中一个括号。将列表 4.5 中的最后一个 `document.write` 语句更改为：\n\
  \n```\ndocument.write(\"</h1>\";\n```\n\n***\n\n### 注意事项\n\n此脚本生成的时间格式并不完美；午后的小时采用的是\
  \ 24 小时制，且没有前导零，因此 12:04 会显示为 12:4。请参阅第 17 章 了解这些问题的解决方案。\n\n***\n\n再次保存你的 HTML\
  \ 文档并将文档加载到浏览器。根据你使用的浏览器版本，会发生两种情况之一：要么显示错误消息，要么脚本直接无法执行。\n\n如果显示了错误消息，通过添加缺失的括号，你就解决了一半问题。如果没有显示错误，你应该配置浏览器显示错误消息，以便诊断未来的问题：\n\
  \n- 在 Firefox 中，你也可以从菜单中选择`Tools`（工具）、`JavaScript Console`（JavaScript 控制台）。控制台如图\
  \ 4.4 所示，显示你在示例中创建错误消息。\n\n**图 4.4** Firefox 的 JavaScript 控制台显示了错误消息。\n\n![image](img/04fig04.jpg)\n\
  \n- 在 Chrome 中，从自定义（选项）菜单中选择`Tools`、`JavaScript Console`。控制台将会在浏览器窗口的底部。\n\n- 在\
  \ Internet Explorer 中，选择`Tools`、`Internet Options`。在“高级”页上，取消勾选`禁用脚本调试`框，并勾选`对每个脚本错误都显示通知`框。（如果禁用了此项，状态栏中的黄色图标仍会提示错误。）\n\
  \n我们在这种情况下得到的错误是 `missing ) after argument list` (Firefox) 或 `Expected ')'` (Internet\
  \ Explorer)，事实证明这正是问题所在。但要警告你的是，错误消息并不总是这么直白。\n\n尽管 Internet Explorer 为每个错误都显示错误对话框，但\
  \ Firefox 的 JavaScript 控制台会显示单一错误列表并允许你测试命令。出于这个原因，你可能会发现安装 Firefox 来调试和测试 JavaScript\
  \ 非常有用，即使 Internet Explorer 是你的主要浏览器。\n\n## 总结\n\n在本章中，你学习了什么是网络脚本以及什么是 JavaScript。你还学习了如何将脚本插入\
  \ HTML 文档或引用外部 JavaScript 文件、JavaScript 可以做哪些事情，以及 JavaScript 与与其他网络语言何不同。你还编写了一个简单的\
  \ JavaScript 程序并使用网络浏览器对其进行了测试。你发现了如何修改和测试脚本，以及当 JavaScript 程序遇到错误时会发生什么。\n\n在编写此脚本的过程中，你使用了一些\
  \ JavaScript 的基本特性：变量、`document.write` 语句以及处理日期时间的函数。\n\n现在你已经学习了一些 JavaScript 语法，准备好继续学习关于网络开发的各种知识，然后开始学习使用客户端脚本编写交互式网站了。\n\
  \n## 问答\n\n**Q. 我需要在多个浏览器上测试我的 JavaScript 吗？**\n\n**A.** 在理想世界中，你编写的任何遵循 JavaScript\
  \ 标准的脚本在所有浏览器中都能运行，在现实世界中，93% 的时间（上下浮动）确实如此。但浏览器确实有自己的怪癖，你应该在 Internet Explorer\
  \ 和 Firefox 上测试你的脚本。\n\n## 工作坊\n\n工作坊包含测验题和练习，有助于巩固你对内容的理解。在查看后面的答案 之前尝试回答所有问题。\n\
  \n### 测验\n\n**1.** 当用户查看包含 JavaScript 的页面时，究竟哪台机器执行了脚本？\n\n- a. 运行网络浏览器的用户机器\n-\
  \ b. 网络服务器\n- c. Netscape 公司内部的某台中央机器\n\n**2.** 你使用什么软件创建和编辑 JavaScript？\n\n- a.\
  \ 浏览器\n- b. 文本编辑器\n- c. 笔和纸\n\n**3.** 变量在 JavaScript 程序中用于什么？\n\n- a. 存储数字、日期或其他值\n\
  - b. 随机变化\n- c. 引起中学代数\n\n**4.** 嵌入 HTML 文件的 JavaScript 脚本末尾应该是什么？\n\n- a. `<script\
  \ type=\"text/javascript\">` 标签\n- b. `</script>` 标签\n- c. `END` 语句\n\n### 答案\n\n\
  **1.** a. JavaScript 程序在网络浏览器上执行。（实际上有一个服务器端的 JavaScript 版本，但那是另一个故事。）\n\n**2.**\
  \ b. 任何文本编辑器都可以创建脚本。如果你小心将文档保存为带有 .html 或 .htm 扩展名的文本文件，也可以使用文字处理器。\n\n**3.** a.\
  \ 变量用于存储数字、日期或其他值。\n\n**4.** b. 你的脚本应该以 `</script>` 标签结束。\n\n## 练习\n\n\n\n\n\n-\
  \ 为大时钟添加一个毫秒字段。你可以使用 `getMilliseconds` 函数，它的用法与 `getSeconds` 相同，但返回的是毫秒。\n- 修改脚本以显示两次时间（包括毫秒）。注意在加载页面时，两次时间显示之间是否流逝了时间。\n\
  \n# 第二部分：实用网页设计的构建模块\n\n## 第 5 章：字体字体、文本块和列表\n\n* * *\n\n在本章中你将学习：\n\n- 如何使用粗体、斜体和特殊的文本格式\n\
  - 如何调整字体\n- 如何使用特殊字符\n- 如何在页面上对齐文本\n- 如何使用三种类型的 HTML 列表\n- 如何在列表内嵌套列表\n\n* * *\n\
  \n在网页的早期，文本仅以一种字体和一种大小显示。然而，现在 HTML 和 CSS 的结合使得控制文本的外观效果（字体类型、大小或颜色）以及它在网页上的对齐和显示方式成为可能。在本章中，你将学习如何改变字体的视觉显示——改变其字体族、大小和粗细——以及如何将粗体、斜体、上标、下标和删除线文本引入你的页面中。你还将学习如何更改字体类型和字体大小。在熟练掌握这些文本方面后，你将学习文本对齐的基础知识以及一些高级文本技巧和技巧，例如列表的使用。由于列表非常常见，HTML\
  \ 提供了可以自动缩进文本并在每个列表项目前添加数字、项目或其他符号的标签。你将学习如何格式化不同类型的列表，这是你网站中显示内容的多种方式之一。\n\n* *\
  \ *\n\n### 注意事项\n\n在查看其他设计师的网页内容时，你可能会发现某些文本标记方法与书中教授的方法不同。旧的文本格式化方法包括使用 `<b></b></b>`\
  \ 标签对来指示单词何时应加粗，使用 `<i>`</i>` 标签对来指示单词何时应用斜体，以及使用 `<font></font>` 标签对来指定字体族、大小和其他属性。然而，没有必要学习这些，因为它们正在从\
  \ HTML 中被淘汰，而且 CSS 要强大强大得多。\n\n* * *\n\n* * *\n\n### 动手一试：准备示例文本\n\n如果你有一些可以用于显示不同字体和颜色，并且可以缩进、居中或其他处理的示例文本，那么你就可以在本章中充分学习如何样式化文本。使用什么种类型的文本并不重要，因为有非常多不同的样式可能性可以尝试，这些样式永远不会同时出现在同一个网页上（除非你想让你的访问者发狂）。利用这个机会感受一下文本层级变化如何影响你内容的外观。\n\
  \n- 如果你将使用的文本来自文字处理程序或数据库程序，请确保将其保存为纯文本或 ASCII 格式的新文件。然后你可以在学习本章的过程中添加适当的 HTML 标签和样式属性来对其进行格式化。\n\
  - 任何文本都可以，但请尝试找到（或输入）一些你想放在网页上的文本。来自公司手册或你的简历的文本可能是一个不错的选择。\n- 任何类型的大纲、演示文稿中的项目符号、编号步骤、词汇表或来自数据库的文本信息列表都可以作为很好的练习材料。\n\
  - 在使用本章引入的代码格式化正文之前，请添加你在之前的章节中使用过的一组 HTML 骨架标签（`<html>`、`<head>`、`<title>` 和 `<body>`\
  \ 标签）。\n\n* * *\n\n### 粗体、斜体和特殊文本格式化\n\n在很久的打字机时代，我们满足于纯文本显示以及偶尔使用下划线表示强调。今天，**粗体**和斜体文本已成为所有纸质通信的常态。自然地，你也可以为你的网页内容添加粗体和斜体文本。有一些标签和样式规则使得文本格式化成为可能。\n\
  \n为文本添加粗体和斜体格式的老方法涉及 `<b></b></b>` 和 `<i>`</i>` 标签对。对于粗体文本，在文本开头放置 `<b>` 标签，在结尾放置\
  \ `</b>`。同样地，你可以通过将任何文本封装在 `<i>` 和 `</i>` 标签之间来使任何文本变为斜体。尽管这种方法在浏览器中仍然有效并受到 XHTML\
  \ 的支持，但它没有用于文本格式化的 CSS 样式规则那样灵活或强大。\n\n虽然你将在第三部分 的“使用 CSS 的高级网页设计”中学习更多关于 CSS 样式规则的内容，但值得稍作铺垫，以便你理解文本格式化的选项。`font-weight`\
  \ 样式规则允许你使用样式规则设置字体的粗细或加粗程度。`font-weight` 的标准设置包括 `normal`、`bold`、`bolder` 和 `lighter`（其中\
  \ `normal` 为默认值）。斜体文本通过 `font-style` 规则控制，该规则可以设置为 `normal`、`italic` 或 `oblique`。如果你想应用多个规则，可以一起指定样式规则，如下例所示：\n\
  \n```html\n<p style=\"font-weight:bold; font-style:italic\">这段落是粗体加斜体的！</p>\n```\n\
  \n* * *\n\n### 注意事项\n\n对于粗体和斜体文本，样式规则的替代方案涉及 `<strong></strong>` 和 `<em></em>` 标签对。`<strong>`\
  \ 标签与 `<b>` 相同，而 `<em>` 标签就像 `<i>` 一样。\n\n`<strong>` 和 `<em>` 被认为是 `<b>` 和 `<i>`\
  \ 的改进，因为它们意味着文本应该受到特殊的强调，而不是规定具体的实现方式。换句话说，浏览器并不一定将 `<strong>` 解析为粗体或将 `<em>` 解析为斜体。`<strong>`\
  \ 和 `<em>` 标签仍然是 HTML5 的一部分，尽管用法变得更加微妙。\n\n* * *\n\n* * *\n\n在此示例中，两个样式规则都指定在 `<p>`\
  \ 标签的 `style` 属性中。多个样式规则的关键是它们必须用分号（`;`）隔开。\n\n然而，你并不限于在段落中使用字体样式。以下代码显示了如何在列表中斜化文本：\n\
  \n```html\n<ul>\n  <li style=\"font-style:italic\">重要内容</li>\n  <li style=\"font-style:italic\"\
  >关键信息</li>\n  <li style=\"font-style:italic\">高度敏感材料</li>\n  <li>无用信息</li>\n</ul>\n\
  ```\n\n你也可以在标题中使用 `font-weight` 样式规则，但较粗字体通常对标题没有影响，因为它们默认就是粗体。\n\n虽然使用 CSS 允许你应用更丰富的格式化，但其他一些\
  \ HTML 标签可以在你不需要像 CSS 那样精确时为文本添加特殊格式。以下是这些标签中的一些。列表 5.1 和 图 5.1 展示了每个标签的作用。\n\n\
  - `<small></small>`—小文本\n- `<big></big>`—大文本；在 HTML5 中不存在，因为文本大小更容易通过 CSS 控制\n-\
  \ `<sup></sup>`—上标文本\n- `<sub></sub>`—下标文本\n- `<<em></em>` 或 `<<i>>`</i>``>`—强调（斜体）文本\n\
  - `<strong></strong>` 或 `<b></b></b>``>`—强（粗体）文本\n- `<tt></tt>`—等宽字体（打字机字体），在 HTML5\
  \ 中不存在，因为字体外观更容易通过 CSS 控制\n- `<pre></pre>`—等宽字体，保留空格和换行\n\n**图 5.1** 这里是 列表 5.1\
  \ 中字符格式化的外观。\n\n![image](img/05fig01.jpg)\n\n* * *\n\n### 警告\n\n\n\n\n曾经有一个 `<u>`\
  \ 标签用于创建下划线文本，但现在有几个原因不再建议使用它。首先，用户期望下划线文本是一个链接，所以如果你对不是链接的文本加下划线，他们可能会困惑。其次，`<u>`\
  \ 标签已废弃（deprecated），这意味着它已经从 HTML/XHTML 语言中淘汰，`<strike>` 标签也是如此。这两个标签在网页浏览器中仍然受支持，并且可能还会持续很一段时间，但使用\
  \ CSS 是创建下划线和删除线文本的首选方法。在 HTML5 中，删除的文本可以用 `<strike></strike>` 标签对包围，这将渲染为带有删除线的文本。\n\
  \n***\n\n### 列表 5.1 特殊格式标签\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>奇迹产品</title>\n  </head>\n  <body>\n    <p>\n      新型 <sup>Super</sup><strong>Strength</strong>\
  \ H<sub>2</sub>O\n      <em>plus</em> 将消除任何污渍，无论 <big>大污渍</big> 还是\n      <small>小污渍</small>。<br\
  \ /> 请在您附近的商店中寻找新的\n      <sup>Super</sup><b>Strength</b> H<sub>2</sub>O <i>plus</i>。\n\
  \    </p>\n    <p>\n      <tt>营养成分信息</tt> (NUTRITION INFORMATION) \n（在法律禁止的情况下无效）\n\
  \    </p>\n    <pre>\n              Calories    Grams   USRDA\n              /Serving\
  \    of Fat  Moisture\n    Regular           3           4       100%\n    Unleaded\
  \          3           2       100%\n    Organic           2           3       \
  \ 99%\n    Sugar Free         0           1       110%\n    </pre>\n  </body>\n\
  </html>\n```\n\n***\n\n`<tt>` 标签通常将字体更改为 Courier New，一种等宽字体（`Monospaced` 意味着所有字母和空格的宽度相同）。然而，网页浏览器允许用户将等宽的\
  \ `<tt>` 字体更改为他们喜欢的字体（查看您浏览器的选项菜单）。对于某些用户来说，等宽字体可能甚至不是等宽的，尽管绝大多数用户仍然使用浏览器默认显示的标准字体。\n\
  \n`<pre>` 标签导致文本以等宽字体显示，但它还具有其他独特且实用的作用。正如你在第 2 章中所学习的那样，“理解 HTML 和 XHTML 的连接”，在\
  \ HTML 文件中，多个空格和换行通常会被忽略，但 `<pre>` 会导致精确的间距和换行被保留。例如，如果没有 `<pre>`，图 5.1 处的文本将像如下所示：\n\
  \ncalories grams usrda /serving of fat moisture regular\n3 4 100% unleaded 3 2 100%\
  \ organic 2 3 99% sugar free 0 1 110%\n\n即使你在每行末尾添加了 `<br />` 标签，列也不会正确对齐。然而，当你将`<pre>`放在开头并将`</pre>`放在结尾时，列就能正确对齐，因为精确的空格被保留了——不需要\
  \ `<br />` 标签。CSS 为你提供了更健壮的方法来对齐文本（以及对文本进行任何操作），你将在第三部分中学习更多内容。\n\n### 调整字体\n\n\
  `<big>`、`<small>` 和 `<tt>` 标签让你对文本的大小和外观有一定的粗浅的控制。然而，有时你可能只是想对大小和外观有更多的控制。在我深入介绍在\
  \ XHTML 中微调字体的正确方法之前，让我们简要查看一下在 CSS 之前是如何处理的，因为你在查看源码时可能仍然发现这种方法的示例。请记住，仅仅因为这些旧方法在使用，并不意味着你应该效仿它们。\n\
  \n***\n\n**注意**：你将在第 8 章“使用颜色、图像和多媒体”中学习更多关于控制页面文本颜色的知识。该章还将向你展示如何创建颜色以及如何控制颜色。\n\
  \n***\n\n在样式表引入之前，废弃的 `<font>` 标签被用于控制网页中的字体。例如，以下 HTML 将改变某些文本的大小和颜色：\n\n```html\n\
  <font size=\"5\" color=\"purple\">这段文字将是大的且紫色的。</font>\n```\n\n如你所见，`<font>` 标签的大小和颜色属性使得无需费太大精力更改文本字体成为可能。尽管这种方法可行，但得益于\
  \ CSS 样式规则，它被更优的字体格式方法取代了。以下是用于控制字体的一些样式规则：\n\n- `font-family`—设置字体族（字体类型）\n- `font-size`—设置字体大小\n\
  - `color`—设置颜色\n\n`font-family` 样式规则允许你设置字体族。你通常并且应该指定多个值（用逗号分隔），以便如果第一个字体不可用，浏览器可以回退。\n\
  \n提供字体族是重要的，因为每个用户安装的字体不同。通过提供备用字体，当理想字体未找到时，你有更好的机会回退到已知字体。\n\n在 HTML5 中，`font-family`\
  \ 样式允许你设置字体。以下是设置文本字体的示例：\n\n```html\n<p style=\"font-family:arial, sans-serif,'\"\
  >\n```\n\n关于这个示例有几个有趣的点。首先，`arial` 被指定为主要字体。大小写不会影响字体族，所以 `arial` 与 `ARIAL` 没有区别。这段代码的另一个有趣之处是对\
  \ `Times Roman` 使用了单引号，因为它包含空格。由于 `'times roman'` 出现在 `sans-serif` 之后，它不太会被使用。因为\
  \ `sans-serif` 在第二个位置，它告诉浏览器“如果没有 Arial”。\n\n`font-size` 和 `color` 规则也常用于控制字体。`font-size`\
  \ 样式可以设置为预设大小（如 `small`、`medium` 或 `large`），你也可以设置为特定的磅值（如 `12pt` 或 `14pt`）。`color`\
  \ 样式可以设置为预设颜色（如 `white`、`black`、`blue`、`red` 或 `green`），你也可以设置为特定的十六进制颜色（如 `#FFB499`）。以下是带有字体大小和颜色的之前的示例：\n\
  \n```html\n<p style=\"font-family:arial, sans-serif, 'times roman'; font-size:14pt;\
  \ color:green\">\n```\n\n***\n\n**注意**：你将在第 8 章学习十六进制颜色。现在，只需理解 `color` 样式规则允许你指定精确的颜色，而不仅仅使用\
  \ `green`、`blue`、`orange` 等。\n\n***\n\n\n\n\n```css\n<style>\n  body {\n    font-family:\
  \ Verdana, sans-serif;\n    font-size: 12px;\n  }\n  h1 {\n    font-family:Georgia,\
  \ serif;\n    font-size:28px;\n    text-align:center;\n  }\n  p.contactinfo {\n\
  \    font-size:14px;\n    text-align:center;\n  }\n  p.categorylabel {\n    font-size:12px;\n\
  \    font-weight:bold;\n    text-transform:uppercase;\n  }\n  div.indented {\n \
  \   margin-left: 25px;\n  }\n</style>\n```\n\n```html\n<body\n  <h1>简·多（Jane Doe）</h1>\n\
  \  <p class=\"contactinfo\">1234 Main Street, Sometown,\nCA 93829<br/>\ntel: 555-555-1212,\
  \ e-mail: jane@doe.com</p>\n  <p class=\"categorylabel\">资历总结</p>\n  <ul>\n    <li>具备高技能且敬业的专业人士，可为您\n\
  \    所需的任何领域提供坚实的背景支持。</li>\n    <li>为任何能让我\n    获得工作的方向提供全面的指导。</li>\n    <li>精通计算机，熟悉多种与行业相关的\n\
  \    计算机程序和设备。适用于任何行业。</li>\n  </ul>\n  <p class=\"categorylabel\">职业经历</p>\n  <div\
  \ class=\"indented\">\n    <p><span style=\"font-weight:bold;\">运营经理，\n    Super\
  \ Awesome 公司，Some City, CA [2002 年 9 月 –\n    至今]</span></p>\n    <ul>\n      <li>直接负责部门的所有运营</li>\n\
  \      <li>协调内部和外部\n      资源的工作</li>\n      <li>通常情况下负责所有事务</li>\n    </ul>\n  \
  \  <p><span style=\"font-weight:bold;\">项目经理，\n    Less Awesome 公司，Some City, CA\
  \ [2000 年 5 月 - 2002 年 9 月]</span></p>\n    <ul>\n      <li>直接负责部门的所有运营</li>\n \
  \     <li>协调内部和外部\n      资源的工作</li>\n      <li>通常情况下负责所有事务</li>\n    </ul>\n  </div>\n\
  \  <p class=\"categorylabel\">教育背景</p>\n  <ul>\n    <li>工商管理硕士（MBA），MyState 大学，2002\
  \ 年 5 月</li>\n    <li>工商管理学士（B.A），MyState 大学，\n    2000 年 5 月</li>\n  </ul>\n  <p\
  \ class=\"categorylabel\">推荐人</p>\n  <ul>\n    <li>可根据要求提供。</li>\n  </ul>\n</body>\n\
  ```\n\n通过 CSS，你可以将一组组样式组织成“类”（classes）——正如你在第 3 章（“理解级联样式表”）中所学习到的那样——你可以看到文本格式是如何应用于此内容的不同区域的。如果你仔细观察\
  \ `div.indented` 类的定义，你会看到 `margin-left` 样式的使用。你将在第三部分学习更多这种样式，它会在元素的左侧留出一定的空间（在本例中为\
  \ 25 像素）。该空间即形成了图 5.2 中所示的缩进效果。\n\n### 处理特殊字符\n\n大多数字体现在都包含了欧洲语言的特殊字符，例如 *Café*\
  \ 中带重音的 `é`。此外还有一些数学符号和特殊标点符号，例如圆形项目符号 •。\n\n你可以使用适当的代码在 HTML 文档的任何位置插入这些特殊字符，如表\
  \ 5.1 所示。你可以在 http://www.webstandards.org/learn/reference/named_entities.html 找到更广泛的多个字符集代码列表。\n\
  \n表 5.1 常用英语特殊字符\n\n例如，单词 *café* 可以使用以下两种方法之一书写：\ncaf&eacute;\ncaf&#233;\n\n正在寻找版权符号\
  \ © 和注册商标 ® 符号吗？这些代码分别是 `&copy;` 和 `&reg;`。要创建一个未注册的商标 ™，请使用 `&trade;`。\n\nHTML/XHTML\
  \ 使用称为“字符实体”（character entity）的特殊代码来表示如 © 和 ® 等特殊字符。字符实体总是以 `&` 开头并以 `;` 结尾。表 5.1\
  \ 列出了最常用的字符实体，尽管 HTML 还支持更多。表 5.1 包含了角括号、引号和和符号（&）的代码。如果你想让这些符号出现在你的页面上，就必须使用这些代码；否则，浏览器会将它们解释为\
  \ HTML 命令。\n\n在列表 5.3 和图 5.3 中，展示了表 5.1 中的几个符号的应用。\n\n**图 5.3** 这是列表 5.3 中的 HTML\
  \ 页面在大多数网络浏览器中的外观。\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n  <title>标点符号行</title>\n\
  </head>\n<body>\n  <p>\n    当英国银行家与你起架时，你应该怎么做？\n    A &pound; &cent; 进入他。\n   \
  \ <br/>\n    法官拿走了书的一部分，这叫什么？\n    A &sect; 暴力。\n    <br/>\n    足球教练在比赛中途从自动贩卖机得到了什么？\n\
  \    A &frac14; &frac12; 时间。\n    <br/>\n    当警察审问数学家时，天气有多热？\n    A x&sup3;&deg;\n\
  \    <br/>\n    一个严谨的剽窃者会做什么？\n    A &copy;\n  </p>\n</body>\n</html>\n```\n\n\n\
  \n\n\n属性调用了样式、类或 ID 使用，这些内容被应用于特定的标签。如果你在样式表中定义了一个特定的类或 ID——如你在第 3 章中所学习的“理解级联样式表”那样——那么你可以在标签内部使用\
  \ `class=\"someclass\"` 或 `id=\"someid\"` 来调用该类或 ID。当浏览器渲染内容进行显示时，它将查找样式表，根据关联的样式定义确定内容具体的显示方式。同样，你可以使用\
  \ `style` 属性为特定元素包含样式信息，而无需将元素连接到实际样式表中。例如，当你使用 `<p>` 标签开始一个段落时，可以通过设置 `style` 属性来指定该段落的文本应该是左对齐、右对齐还是页面居中。如果你想将该段落与现有的类或\
  \ ID 关联，则设置 `class` 或 `id` 属性。\n\n在以下中，每个段落都可以左对齐：\n\n```html\n<p style=\"text-align:\
  \ left;\">Text goes here.</p>\n<p class=\"leftAlignStyle\">Text goes here.</p>\n\
  <p id=\"firstLeftAlign\">Text goes here.</p>\n```\n\n在第一个段中，样式直接出现在 `style` 属性中。在第二个段中，如果\
  \ `leftAlignStyle` 类的样式表条目包含 `text-align` 语句，该段将左对齐。同样，如果 `firstLeftAlign` 类的样式表条目包含\
  \ text-align 语句，第三个段也将左对齐。\n\n在在上的示例中，你可能注意到标签、属性和样式使用了小写字母。严格的 XHTML 标准要求标签和属性必须是小写的；XHTML\
  \ 标准还要求属性值两端有引号。\n\n例如，以下代码将由大多数流行的网络浏览器渲染：\n\n```html\n<P STYLE=TEXT-ALIGN:CENTER>\n\
  ```\n\n然而，这段代码不符合 XHTML 标准，因为标签是大写的，`style` 属性及其值（`text-align:center`）是大写的，且该值没有放在引号中。如果你想与最新的标准和软件保持兼容，应该始终使用以下代码：\n\
  \n```html\n<p style=\"text-align:center\">\n```\n\n***\n\n**注意**\n\nHTML 中的每个属性和样式规则都有一个默认值，当你没有自己设置属性时会采用该值。对于\
  \ `<p>` 标签的 `text-align` 样式规则，默认值为 `left`，因此使用基础 `<p>` 标签与使用 `<p style=\"text-align:left\"\
  >` 的效果相同。学习常用样式规则的默认值是成为优秀网页开发者的重要部分。\n\n***\n\n### 对齐块级元素\n\n要将 `<p>` 等块级元素对齐到右边距，而不在样式表中创建单独的类或\
  \ ID，只需在段落开始处的 `<p>` 标签内部放置 `style=\"text-align:right\"` 即可。同样，要使元素居中，使用 `<p style=\"\
  text-align:center\">`。将段落左对齐，使用 `<p style=\"text-align:left\">`。\n\n`style` 属性的\
  \ `text-align` 部分被称为*样式规则*（style rule），这意味着它正在设置 HTML 元素的特定样式方面。你可以使用许多样式规则来精细地控制网络内容的格式。\n\
  \n`text-align` 样式规则并不限于 `<p>` 标签。事实上，你可以对任何块级元素使用 `text-align` 样式规则，包括 `<h1>`、`<h2>`、其他标题标签以及\
  \ `<div>` 标签等。`<div>` 标签特别有用，因为它可以包含其他块级元素，从而允许你一次性控制网络内容大部分部分的对齐。`<div>` 标签中的 `div`\
  \ 代表*划分*（division）。\n\n列表 5.4 展示了结合使用 `<p>` 和 `<div>` 标签的 `style` 属性和 `text-align`\
  \ 样式规则。结果显示在图 5.4 中。你将在第三部分中学习更多 `<div>` 标签的高级用法。\n\n**图 5.4** 在列表 5.4 中使用文本对齐的结果。\n\
  \n![image](img/05fig04.jpg)\n\n列表 5.4 配合 `style` 属性使用的 `text-align` 样式规则\n\n***\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Bohemia</title>\n\
  \  </head>\n  <body>\n    <div style=\"text-align:center\">\n      <h1>Bohemia</h1>\n\
  \    </div>\n    <div style=\"text-align:left\">\n      <h2>By Dorothy</h2>\n  \
  \    <p>Authors and artists</p>\n      <p>Sculptors and singers</p>\n      <p>Playwrights\
  \ and poets</p>\n      <p style=\"text-align:right\">God, for a man</p>\n    </div>\n\
  \  </body>\n</html>\n```\n\n***\n\n使用 `<div style=\"text-align:center\">` 确保了内容（包括两个标题）都是居中的。然而，第一个段落左对齐，第二个段落居中，第三个段落右对齐。\n\
  \n\n\n\n\n## 女士对执意鞠躬的讨厌男性的应对方法\n\n1. 在大多数情况下，一个简单的冷视就足够了。\n2. 冷淡的致意可以在不构成冒犯的情况下，消除对方的亲近意图。\n\
  3. 作为最后的手段：“先生，我无缘与您相识。”\n\n## 皇室的正式称呼\n\n- **陛下 (Your Majesty)**：用于国王或女王。\n- **皇室殿下\
  \ (Your Royal)**：用于君主的配偶、子女和兄弟姐妹。\n- **殿下 (Your Highness)**：用于君主的侄子、侄女和表亲。\n\n***\n\
  \n注意\n\n记住，不同的网络浏览器显示网页内容的方式大不相同。HTML 标准并没有规定规定浏览器应该如何格式化列表，因此使用旧版浏览器的用户可能看不到与你看到的完全相同的缩进。你可以使用\
  \ `CSS` 来对列表项目进行精确控制，你将在本章后面部分学习到这一点。\n\n### 在列表内嵌套列表\n\n尽管定义列表正式上应该用于定义术语，但许多网页作者在任何他们想要看到缩进的地方使用它们。在实践中，你只需在任何文本开头开头放入\
  \ `<dl><dd>`，结尾放入 `</dd></dl>` 并跳过 `<dt></dt>` 标签对，即可对其进行缩进。然而，缩进文本更好的方法是使用 `<blockquote></blockquote>`\
  \ 标签对，它在不假设定义的情况下缩进内容，并允许更清晰的样式设计。通过一组属性，你可以设置元素区域的宽度、高度、背景颜色、框类型和颜色以及其他视觉效果。\n\n\
  ***\n\n注意\n\n*嵌套 (Nesting)* 指完全出现在另一个标签内部的标签。嵌套标签也被称为包含它们的（父）标签的*子标签*。一种常见的（但并非必须的）编码习惯是对嵌套标签进行缩进，这样你就可以轻松地看到它们与父标签的关系。\n\
  \n***\n\n由于使用 `CSS` 时你对项目的显示具有很高程度的控制力，因此不需要使用嵌套列表来实现缩进的视觉效果。将嵌套列表的使用留给内容需要的时候。换句话说，使用嵌套列表来显示信息的层级结构，如列表\
  \ 5.6 所示。\n\n有序列表和无序列表可以相互嵌套，深度可以达到你想要的任何级别。在列表 5.6 中，一个复杂的缩进大纲是由几个无序列表构建的。你会在图\
  \ 5.6 中注意到，Firefox 为前三个缩进层级自动使用不同的项目符号，使列表非常易读。这在现代浏览器中很常见。\n\n**图 5.6** 在 Firefox\
  \ 中，多级无序列表进行了整齐的缩进和符号标记，以提高可读性。\n\n![image](img/05fig06.jpg)\n\n列表 5.6 使用列表构建大纲\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Vertebrates</title>\n\
  \  </head>\n  <body><body>\n    <h1>Vertebrates</h1>\n    <ul>\n      <li><span\
  \ style=\"font-weight:bold\">Fish</span>\n        <ul>\n          <li>Barramundi</li>\n\
  \          <li>Kissing Gourami</li>\n          <li>Mummichog</li>\n        </ul>\n\
  \      </</li>\n      <li><span style=\"font-weight:bold\">Amphibians</span>\n \
  \       <ul>\n          <li>Anura\n            <ul>\n              <li>Goliath Frog</li>\n\
  \              <li>Poison Dart Frog</li>\n              <li>Purple Frog</li>\n \
  \           </ul>\n          </li>\n          <li>Caudata\n            <ul>\n  \
  \            <li>Hellbender</li>\n              <li>Mudpuppy</li>\n            </ul>\n\
  \          </li>\n        </ul>\n      </</li>\n      <li><span style=\"font-weight:bold\"\
  >Reptiles</span>\n        <ul>\n          <li>Nile Crocodile</li>\n          <li>King\
  \ Cobra</li>\n          <li>Common Snapping Turtle</li>\n        </ul>\n      </</li>\n\
  \    </ul>\n  </body>\n</html>\n```\n\n***\n\n如图 5.6 所示，网页浏览器通常使用实心圆作为第一级项目符号，空心圆作为第二级项目符号，所有更深层级使用实心正方形。然而，你可以通过使用\
  \ `<ul style=\"list-style-type:disc\">`、`<ul style=\"list-style-type:circle\">`\
  \ 或 `<ul style=\"list-style-type:square\">` 代替 `<ul>`，显式地选择任何级别使用的项目符号类型。\n\n你甚至可以通过在\
  \ `<li>` 标签中使用 `list-style-type` 样式规则更改无序列表中任何单个单点的符号。例如，以下代码在 `extra` 和 `super`\
  \ 单词前面显示一个空心圆，在 `special` 前面显示一个实心正方形：\n\n```html\n<ul style=\"list-style-type:circle\"\
  >\n  <li>extra</li>\n  <li>super</li>\n  <li style=\"list-style-type:square\">special</li>\n\
  </ul>\n```\n\n`list-style-type` 样式规则也适用于有序列表，但它不是选择项目符号，而是选择放置在项目前的数字或字母。列表 5.7\
  \ 显示了如何使用罗马数字 (`list-style-type:upper-roman`)、大写字母 (`list-style-type:upper-alpha`)、小写字母\
  \ (`list-style-type:lower-alpha`) 以及多级列表中的普通数字。图 5.7 显示了结果。\n\n**图 5.7** 格式良好的大纲可以让任何计划看起来更可信。\n\
  \n![image](img/05fig07.jpg)\n\n尽管列表 5.7 仅对 `<ol>` 标签使用 `list-style-type` 样式规则，你也可以将其用于特定的\
  \ `<li>` 标签（尽管很难想象会有这种情况需要这样做）。你还可以显式指定普通数字 `list-style-type:decimal`，并可以使用小写罗马数字\
  \ `list-style-type:lower-roman`。\n\n列表 5.7 在多级列表中使用 `style` 属性使用 `list-style-type`\n\
  \n\n\n\n\n- 选择一个你的配偶或老板找不到你的高尔夫球\n- 为了节省费用，去你朋友工作的地方打球\n- 对手\n    - 寻找：过度自信、缺乏经验\n\
  \    - 在赛前尽可能给对手买多些赛前饮品\n- 在球场上\n    - 先发球，然后患上严重的季节性鼻炎\n    - 将高尔夫球推过对手球上方以破坏空气动力学\n\
  \    - 在球接触对手之前大喊“Fore（球来）”\n    - 推杆球时始终要修补草坪\n    - 水壶洞是纠正球的放置错误的好时机\n\n## 总结\n\
  在本章中，你学习了如何让文本显示为**粗体**或*斜体*，以及如何编写上标、下标、特殊符号和带变音字母的代码。你看到了如何让文本在预格式的等宽字体中正确对齐，以及如何控制任何文本部分的大小、颜色和字体。你还学习了属性如何指定许多\
  \ HTML 标签的行为，以及如何使用带有 CSS 规则的 `style` 属性对齐文本。你还发现了如何创建和组合三种基本的 HTML 列表：有序列表、无序列表和定义列表。列表可以放置在其他列表中，以创建大纲和其他复杂的文本布局。表\
  \ 5.2 第 5 章涵盖的 HTML 标签和属性总结了本章讨论的标签和属性。不要觉得你必须记住所有这些！\n\n## 问答\n**Q. 我如何找到电脑上某个字体的准确名称？**\n\
  **A.** 在 Windows 或 Macintosh 计算机上，打开控制面板并点击“字体”文件夹——你系统中的字体会列在其中。Vista 用户可能必须在控制面板中切换到“经典视图”。在\
  \ `font-family` 样式规则中指定字体时，请使用字名的准确拼写。然而，字体名称对大小写不敏感。\n\n**Q. 我如何在我的页面上显示汉字、阿拉伯语和其他非欧洲字符？**\n\
  **A.** 首先，需要在你的页面上阅读这些字符的用户必须安装了适当的语言字体。他们必须在网络浏览器中选择了该语言字符集及其关联字体。你可以使用 Windows\
  \ 中的“字符表”程序（或其他操作系统的类似程序）来获取任何语言字体中每个字符的数值代码。要找到字符表，点击“开始”、“所有程序”、“辅助工具”，然后点击“系统工具”。如果你需要的字符代码为\
  \ `214`，使用 `&#214;` 将其放置在网页上。如果你找不到字符表程序，请使用操作系统的内置“帮助”功能来查找特定位置。包含亚洲语言短消息（例如 `We\
  \ Speak Tamil-Call Us!`）的最好方法是将其作为图形包含在内。这样每个用户都能看到它，即使他们使用英语作为网页浏览的主要语言。但即使要使用语言字体，你可能也需要为你的操作系统下载特定的语言包。再次，请检查系统的“帮助”功能以获取特定说明。\n\
  \n**Q. 我见过一些网页使用三维球或其他特殊图形作为项目符号。它们是如何做到的？**\n**A.** 这个技巧稍微超出了本章的范围。你将在第 8 章学习如何自己实现。\n\
  \n**Q. 我如何对文本进行“两端对齐”以使左右边缘都对齐？**\n**A.** 你可以在你的样式声明中使用 `text-align:justify`。\n\n\
  ## 工作坊\n工作坊包含了一些测验题和活动，帮助你巩固对所涵盖内容的理解。尝试在查看随后的“答案”部分之前回答所有问题。\n\n#### 测验\n1. 你如何使用样式而不是\
  \ `<b>` 或 `<strong>` 标签来创建一个前三个单词为粗体的段落？\n2. 你如何表示水的分子公式？\n3. 如何在网页上显示“© 2010, Webwonks\
  \ Inc.”？\n4. 你如何让整个页面的所有内容都居中？\n5. 你会用什么来创建一个定义列表，显示单词 `glunch` 意味着“蔑视、愤怒或不满的神情”，而单词\
  \ `glumpy` 意味着“闷闷、忧郁或坏气”？\n\n#### 答案\n1. 你将使用以下代码：\n```html\n<p><span style=\"font-weight:\
  \ bold\">前三个单词</span>是粗体的。</p>\n```\n2. 你将使用 `H<sub>2</sub>O`。\n3. 你将使用以下任一：\n`&copy;\
  \ 2010, Webwonks Inc.`\n`&#169; 2010, Webwonks Inc.`\n4. 如果你考虑在页面顶部的 `<body>` 标签之后紧跟\
  \ `<div style=\"text-align:center\">`，并在页面底部的 `</body>` 标签之前紧跟 `</div>`，那么你是正确的。然而，`text-align`\
  \ 样式也直接支持在 `<body>` 标签中使用。\n\n\n\n\n表格由若干行信息组成，内部包含单个单元格。要创建表格，你必须从 `<table>` 标签开始。当然，你要用\
  \ `</table>` 标签结束表格。如果你想让表格带有边框，可以使用 `border` 属性来指定以像素为单位边框宽度。边框大小设置为 `0` 或 `none`（或完全省略\
  \ `border` 属性）将使边框不可见，如果你发现自己正将表格作为页面布局工具（不推荐这样做），这非常有用。\n\n### 提示\n在阅读本章时，请思考将文本排列成表格如何为你的网页内容带来收益。以下是一些需要记住的特定想法：\n\
  \n• 表格最明显的应用是组织表格化信息，例如包含名称和数字的多列列表。\n• 每当你需要多列文本或图像时，表格就是答案。\n\n在放置好 `<table>`\
  \ 标签后，你接下来需要的是 `<tr>` 标签。`<tr>` 标签创建一个表格行，它在闭合标签 `</tr>` 之前包含一个或多个信息单元格。要创建这些单个单元格，请使用\
  \ `<td>` 标签（`<td>` 代表表格数据）。将表格信息放在 `<td>` 和 `</td>` 标签之间。*单元格*是一个可以包含任何文本、图像和 HTML\
  \ 标签的矩形区域。表格中的每行至少包含一个单元格。行中的多个单元格形成了表格中的列。\n\n构建表格还涉及另一个基础标签。`<th>` 标签的作用与 `<td>`\
  \ 标签完全相同，只是 `<th>` 表明该单元格是表头的一部分。大多数网页浏览器会将 `<th>` 单元格中的文本渲染为居中并加粗。\n\n### 提示\n\
  某些样式属性允许你对表格边框进行更多控制。例如，你可以设置边框宽度（`border-width`）、样式（`border-style`）和颜色（`border-color`）。这些属性运行良好，但你必须将它们应用于每个表格元素，即使你为表格行或单元格元素使用了类，这可能是很繁琐。\n\
