  \ SEO 公司都是诈骗者。某些执行 SEO 任务的合法网站内容和架构顾问，与发送许可垃圾邮件的骚扰者被混为一谈，例如：\n\n“亲爱的 `google.com`，我访问了您的网站，注意到您没有列在大多数主要的搜索引擎和目录列表中……”\n\
  \n这封邮件示例被 Google 自己的网站站长指南用作，并附带了注释：“对于关于搜索引擎的垃圾邮件，要保持与对‘夜间减肥药’或‘帮助转从被下台独裁者的资金的请求’同样的怀疑态度。”是的，真的有人给\
  \ Google 发送了一封关于如何在 Google 内部提高搜索排名的垃圾邮件……要获取更多来自 Google 的良好建议，请访问 `http://www.google.com/webmasters/`。\n\
  \n以下是你可以采取的一些额外免费操作，以为搜索引擎优化你的内容：\n\n- 使用准确的页面标题。你的标题应该简短，但要具有描述性且独特。不要试图在标题中填充关键词。\n\
  \n- 创建人类友好的 URL，例如包含用户可以轻松记住的单词的。与 `http://www.mycompany.com?c=p&id=4&id=49f8sd7345fea`\
  \ 之类的相比，像 `http://www.mycompany.com/products/super_widget.html` 这样的 URL 更容易记忆——搜索引擎更容易以相关的方式对其进行索引。\n\
  \n- 创建反映你目录结构的 URL。这假设你已经有一个目录结构，而你本就应该有一个。\n\n- 在可能的情况下，使用文本而非图形元素进行导航。\n\n- 如果你的内容深达几层，请使用面包屑导航以便用户找到返回首页的路。面包屑还为搜索引擎提供了更多可索引文字。例如，如果你正在查看食品类网站“南方烹饪”类别下的饼干食谱，该页面的面包屑导航可能如下所示：\n\
  \n首页 > 南方烹饪 > 食谱 > 饼干\n\n- 在页面内容中，恰当地使用标题（`<h1>`, `<h2>`, `<h3>`）。\n\n除了为用户提供丰富且实用的内容外，你还应该遵循这些提示来提高你的网站在页面排名中的知名度。\n\
  \n## 总结\n\n本章通过探索如何向搜索引擎（如 `Google`、`Bing` 和 `Yahoo!`）提供提示，以便用户能够更容易找到你的页面，涵盖了一些极其重要的领域。你还看到一个将完全合理的网页\
  \ HTML *重做* 以使其更符合搜索引擎友好的示例。最后，你学习了更多关于优化网站整体索引的技巧。\n\n表 28：HTML 标签与属性\n\n## 问答\n\
  \n**Q：我有很多页面。我需要为每个页面单独填写搜索吗？**\n**答：** 不需要，如果你提交了网站，搜索引擎将爬取所有页面。\n\n**Q：我已提交到搜索引擎，但当我搜索我的页面时，它没有显示。我该怎么办？**\n\
  **答：** 索引你的网站需要几天甚至几周的时间。\n\n**Q：我听说可以使用 `meta` 标签每隔几秒刷新一次页面。这是真的吗？**\n**答：** 是的，但这受到\
  \ W3C 和普通用户的反感。\n\n**Q：当我在 meta 标签中放入关键词时，我需要担心大小写问题吗？**\n**答：** 搜索引擎全小写。\n\n**Q：如果我发布了一个关于领养幼犬的页面，如何如何确保它被找到？**\n\
  **答：** 确保 `puppy`、`dog` 和 `adoption` 在你的主页上频繁出现（它们可能已经这样）。\n\n## 工作坊\n\n工作坊包含测验题和活动，帮助你巩固材料。\n\
  \n#### 测验\n\n1. 如果你发布了一个关于领养幼犬的页面，你如何确保在所有主要搜索网站输入 puppy、dog 或 adoption 的用户能找到它？\n\
  2. 假设你决定在 HTML 代码中粘贴数百次你的关键词，在白色背景上使用白色字体，让你的读者看不到它们。搜索引擎将如何处理这种情况？\n3. 将所有内容放在一个目录中较好，还是将其组织成几个目录较好？\n\
  \n#### 答案\n\n1. 确保 `puppy`、`dog` 和 `adoption` 在你的主页上频繁出现（它们可能已经这样），并将你的页面命名为类似“领养幼犬”的标题。顺便在页面的\
  \ `<head>` 部分放入以下 `meta` 标签：\n```html\n<meta name=\"description\" content=\"dog\
  \ adoption information and services\">\n<meta name=\"keywords\" content=\"puppy,\
