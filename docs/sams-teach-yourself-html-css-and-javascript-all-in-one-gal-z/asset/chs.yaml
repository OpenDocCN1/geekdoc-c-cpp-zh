  \ 300 英尺、细节精妙的红杉树。\n2. 大多数“迭代系统”很容易在计算机上进行模拟，但只有少数是可以预测和可控的。为什么呢？因为一个微小的影响，比如“蝴蝶扇翅膀”，可能会被奇异地放大，产生重大后果，例如完全改变世界上遥远地区明天的天气。\n\
  3. 分形可以无限放大而不丢失细节，因此依赖于直线的数学对它们是徒劳无的。然而，它们给了我们一个名为“分形维度”的新概念，可以衡量从海岸线到云层的任何物的纹理和复杂性。\n\
  4. 虽然分形在图形展上屡获殊，但它们的混沌模式出现在科学的每一个分支中。物理学家发现绘图仪中产生了精美的艺术品；带有分形湍流的“奇异吸引子”出现在天体力学中；当分形节律失去同步时，生物学家会诊断出“动力学疾病”。甚至纯数学家也会带着他们那些炫目的研究视频进行巡演。\n\
  \n你觉得这些人可能都发现了某些奥秘了吗？\n\n现在将列表 28.1 中的页面与列表 28.2 中页面所做的更改进行对比。这两个页面看起来几乎相同，但对于爬虫机器人和搜索引擎来说，这两个页面看起来完全不同。以下列表总结了页面中发生了更改以及这些更改是如何影响索引的：\n\
  \n- 在 `<title>` 标签和页面第一个标题中添加了重要的搜索关键词。原始页面在这两个关键位置甚至没有包含 `fractal` 这个词。\n- 添加了\
  \ `<meta />` 标签以帮助搜索引擎获取描述和关键词。\n- 为第一个 `<img />` 标签添加了非常有描述性的 `alt` 属性。并不是所有的搜索引擎都会读取并索引\
  \ `alt` 文本，但有些会。\n- 删除了技术术语（如 `\"fractal\"` 和 `\"iterated\"`）周围的引号，因为某些搜索引擎认为“fractal”与\
  \ `fractal` 是不同的词。引号被替换为字符实体 `&quot;`，爬虫机器人会直接忽略它。这也是一个好主意，因为 XHTML 促使网页开发者使用 `&quot;`\
  \ 实体而不是引号。\n- 关键词 `fractal` 被两次添加到了订单表单文本中。目前无法量化搜索分形和混沌的用户在列表 28.2 中找到页面的概率比在列表\
  \ 28.1 中增加了多少，但可以确定，这些更改可以提高页面在搜索引擎中的可见性。正如通常情况，为了搜索而做的改进可能让人类更容易识别和理解页面的主题。这使得为搜索引擎优化页面变成了一项双赢的努力！\n\
