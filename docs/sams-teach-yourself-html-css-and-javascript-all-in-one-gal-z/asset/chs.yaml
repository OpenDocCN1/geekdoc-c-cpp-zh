  \n[content]\n\n### 修改页面内的文本\n\n接下来，你可以创建一个简单的脚本来修改页面内标题的内容。正如你在本章早期所学到的，文本节点的 `nodeValue`\
  \ 属性包含其实际文本，而标题的文本节点是该元素的子元素。因此，更改标识符 `head1` 文本的语法如下：\n\n```javascript\nvar head1\
  \ = document.getElementById(\"head1\");\nhead1.firstChild.nodeValue = \"新文本\";\n\
  ```\n\n这会将变量 `head1` 分配给标题对象。`firstChild` 属性返回作为标题唯一的文本节点，其 `nodeValue` 属性包含标题文本。\n\
  \n使用这种技术，你可以创建一个允许动态更改标题的页面。列表 15.7 显示了此脚本的完整 HTML 文档。\n\n列表 15.7 完整文本修改示例\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>JavaScript\
  \ 中的动态文本</title>\n    <script type=\"text/javascript\">\n    function ChangeTitle()\
  \ {\n        if (!document.getElementById) return;\n        var newtitle = document.form1.newtitle.value;\n\
  \        var head1 = document.getElementById(\"head1\");\n        head1.firstChild.nodeValue=newtitle;\n\
  \    }\n    </script>\n  </head>\n  <body>\n    <form name=\"form1\">\n      <input\
  \ type=\"text\" name=\"newtitle\" oninput=\"ChangeTitle()\">\n      <h1 id=\"head1\"\
  >JavaScript 中的动态文本</h1>\n    </form>\n  </body>\n</html>\n```\n\n\n\n点击 `Change!`\
  \ 按钮。\n\n```html\n<form action=\"\" name=\"form1\">\n  <div>\n    <input type=\"\
  text\" name=\"newtitle\" size=\"40\" />\n    <input type=\"button\" value=\"Change!\"\
  \ onclick=\"ChangeTitle();\" />\n  </div>\n</form>\n</body>\n</html>\n```\n\n***\n\
  \n此示例定义了一个表单，允许用户为页面输入新标题。点击按钮时会调用在头文件（header）中定义的 `ChangeTitle()` 函数。该函数获取用户在表单中输入的值，并将标题的值更改为新文本。\n\
  \n`图 15.8` 显示了输入新标题并点击 `Change!` 按钮后，该页面的运行情况。\n\n**图 15.8** 运行中的标题修改示例。\n\n![image](img/15fig08.jpg)\n\
  \n#### 向页面添加文本\n\n接下来，你可以创建一个实际向页面添加文本的脚本。要实现这一点，你必须首先创建一个新的文本节点。此语句语句创建了一个内容为“this\
  \ is a test”的新文本节点：\n\n```javascript\nnode=document.createTextNode(\"this is a test\"\
  );\n```\n\n接下来，你可以将此节点添加到文档中。要做到这一点，你需要使用 `appendChild` 方法。文本可以添加到任何包含文本的元素中，但我们将使用段落。以下语句将之前定义的文本节点添加到标识为\
  \ `p1` 的段落：\n\n```javascript\ndocument.getElementById(\"p1\").appendChild(node);\n\
  ```\n\n`列表 15.8` 显示了一个使用此技术的完整 HTML 文档，该示例使用表单允许用户指定要添加到页面的文本。\n\n列表 15.8 向页面添加文本\n\
  \n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Adding Text to a Page</title>\n    <script type=\"text/javascript\">\n\
  \      function AddText() {\n        if (!document.getElementById) return;\n   \
  \     var sentence=document.form1.sentence.value;\n        var node=document.createTextNode(\"\
  \ \" + sentence);\n        document.getElementById(\"p1\").appendChild(node);\n\
  \        document.form1.sentence.value=\"\";\n      }\n    </script>\n  </head>\n\
  \  <body>\n    <h1 id=\"head1\">创建你自己的内容</h1>\n    <p id=\"p1\"> 使用 W3C DOM，你可以动态地向此段落添加\n\
  \      句子。输入一个句子并点击\n      Add! 按钮。</p>\n    <form action=\"\" name=\"form1\">\n\
  \      <div>\n        <input type=\"text\" name=\"sentence\" size=\"65\" />\n  \
  \      <input type=\"button\" value=\"Add!\" onclick=\"AddText();\" />\n      </div>\n\
  \    </form>\n  </body>\n</html>\n```\n\n***\n\n在此示例中，`<p>` 部分定义了将添加文本的段落。`<form>`\
  \ 部分定义了一个表单，其中包含一个名为 `sentence` 的文本字段和一个调用 `AddText()` 函数的 Add 按钮。该函数定义在头文件中。\n\n\
  `AddText()` 函数首先将 `sentence` 变量赋值为文本字段中输入的文本。接下来，它创建一个包含该句子的新文本节点，并将该文本节点添加到段落中。\n\
  \n将此文档加载到浏览器中进行测试，并通过输入句子和点击 Add 按钮尝试添加多个句子。`图 15.9` 显示了在段落中添加了几个句子后的文档。\n\n**图\
  \ 15.9** 运行中的文本添加示例。\n\n![image](img/15fig09.jpg)\n\n## 总结\n\n在本章中，你学习了 DOM，即 JavaScript\
  \ 网页页面对象的层级结构。你学习了如何使用 `document` 对象来处理文档，并使用了 `history` 和 `location` 对象来控制浏览器中显示的当前\
  \ URL。\n\n此外，你还学习了可以用于管理 DOM 对象的函数和属性，并使用了示例脚本来隐藏和显示页面元素、修改文本以及添加文本。你还学习了如何使用 HTML\
  \ 和 CSS 定义一个可定位的层，以及如何使用 JavaScript 动态使用定位属性。\n\n这些关于 DOM 的基础知识让你能够以后更高级的方式有效地使用\
  \ JavaScript（此处并非双关），正如你将在后续章节中学习到的那样。\n\n## 问答\n\n**问：** 你可以使用 `document` 对象来管理\
  \ DOM 对象吗？\n**答：** 是的，你可以使用各种函数和属性来管理 DOM 对象。\n\n**问：** 如何向段落添加文本节点？\n**答：** 你使用\
  \ `appendChild` 方法。\n\n\n\n\n\n如果你想通过在本章中学习的 DOM 特性获得更多经验，请尝试以下操作：\n\n- 修改列表 15.2\
  \ 中的后退和前进”示例，在后退和前进按钮的基础上添加一个“刷新”按钮。（该按钮将触发 `location.reload()` 方法。）\n- 修改列表 15.4\
  \ 和 15.5 中的定位示例，使正方形每次移动 1 像素，而不是每次 10 像素。\n- 在列表 15.6 中添加第三个复选框，允许显示或隐藏文本段。你需要在\
  \ `<p>` 标签上添加 `id` 属性，在表单中添加一个复选框，并在脚本中添加相应的代码。\n\n# 第 16 章 使用 JavaScript 变量、字符串和数组\n\
  \n本章你将学习：\n\n- 如何命名和声明变量\n- 如何选择使用局部变量还是全局变量\n- 如何为变量赋值\n- 如何在不同数据类型之间转换\n- 如何在表达式中使用变量和字面量\n\
  - 字符串是如何存储在 `String` 对象中的\n- 如何创建和使用 `String` 对象\n- 如何创建和使用数字和字符串数组\n\n现在你已经学习了\
  \ JavaScript 和 DOM 的一些基础知识，是时候研究 JavaScript 语言的更多细节了。\n\n在本章中，你将学习在 JavaScript 中存储数据的三个工具：存储数字或文本的\
  \ `variables`；`strings`（用于处理文本的特殊变量）；以及 `arrays`（你可以通过数字引用的多个变量）。\n\n## 使用变量\n\n\
  除非你跳过了本书开头与 JavaScript 相关的章节，否则你已经使用过几个变量。你可能可以在没有任何帮助的情况下学会如何使用更多几个。尽管如此，变量的某些方面是你还没有学习过的。我们现在来看一些细节。\n\
  \n#### 选择变量名\n\n`variables` 是命名的容器，可以存储数据（例如，数字、文本字符串或对象）。正如你之前在书中学到的那样，每个变量都有一个名称。在选择变量名时，你必须遵循特定的规则：\n\
  \n- 变量名可以包含字母表中的大写和小写字母。它们还可以包含数字 0–9 和下划线 (`_`) 字符。\n- 变量名不能包含空格或其他任何标点字符。\n- 变量名的第一个字符必须是字母或下划线。\n\
  - 变量名区分大小写——`totalnum`、`Totalnum` 和 `TotalNum` 是不同的变量名。\n- 变量名的长度没有官方限制，但它们必须在一行内。\n\
  \n**注意**\n\n你可以选择使用友好、易于读的名字，也可以使用完全晦涩的名字。为自己一个忙吧：尽可能使用较长的、友好的名称。虽然你现在可能记得 `a`、`b`、`x`\
  \ 和 `x1` 之间的区别，但睡了一个好觉之后你可能就忘记了。\n\n使用这些规则，以下是有效变量名的示例：\n\n```\ntotal_number_of_fish\n\
  LastInvoiceNumber\ntemp1\na\n_var39\n```\n\n#### 使用局部变量全局变量\n\n某些计算机语言要求你在使用变量之前对其进行声明。JavaScript\
  \ 包含了 `var` 关键字，用于声明变量。在许多情况下，你可以省略 `var`；在第一次给变量赋值时，变量仍然会被声明。\n\n为了理解在何处声明变量，你需要理解作用域（`scope`）的概念。变量的作用域是变量可以使用的脚本区域。变量有两种：\n\
  \n- `Global variables`（全局变量）具有整个脚本（以及同一 HTML 文档中的其他脚本）的作用域。它们可以在任何地方使用，甚至是在函数内部。\n\
  - `Local variables`（局部变量）以单个函数作为作用域。它们只能在创建它们的函数内部使用。\n\n要创建一个全局变量，你需要在主脚本中声明函数之外之外。你可以使用\
  \ `var` 关键字来声明变量，如示例所示：\n\n```\nvar students = 25;\n```\n\n这条语句声明了一个名为 `students`\
  \ 的变量并将其赋值为 25。如果该语句在函数外部使用，就会创建一个全局变量。在这种情况下，`var` 关键字是可选的，因此此语句与上一个等效：\n\n```\n\
  students = 25;\n```\n\n在你养成省略 `var` 关键字的习惯之前，请确保你完全理解何时需要它。实际上，始终使用 `var` 关键字是一个好主意——你会避免错误并让你的脚本更易读，而且它通常不会引起任何麻烦。\n\
  \n局部变量属于特定的函数。你在函数内部用 `var` 关键字声明的任何变量都是局部变量。此外，函数参数列表中的变量始终是局部变量。\n\n要在函数内部创建局部变量，你必须使用\
  \ `var` 关键字。这强制 JavaScript 创建一个局部变量，即使存在同名的全局变量。\n\n你现在应该理解局部变量和全局变量之间的区别。如果你仍然感到有些困惑，不要担心——如果你每次都使用\
  \ `var` 关键字，你通常会得到正确类型的变量。\n\n#### 为变量赋值\n\n正如你在第 4 章中所学到的，你可以使用等号为变量赋值。例如，这条语句将\
  \ 40 赋值给变量 `lines`：\n\n```\nlines = 40;\n```\n\n你可以在等号右侧使用任何表达式，包括其他变量。你使用了这种语法给变量加\
  \ 1：\n\n```\nlines = lines + 1;\n```\n\n由于增加或减少变量非常常见，JavaScript 提供了两种简写形式。首先是 `+=`\
  \ 运算符，它让你创建上述示例的后续版本：\n\n```\nlines += 1;\n```\n\n同样，你可以使用 `-=` 运算符从变量中减去数字：\n\n\
  ```\nlines -= 1;\n```\n\n如果你仍然觉得这输入太麻烦了，JavaScript 还包含了递增和减少运算符，`++` 和 `--`。这条语句给\
  \ `lines` 加 1：\n\n```\nlines++;\n```\n\n同样，这条语句从 `lines` 减 1：\n\n```\nlines--;\n\
  ```\n\n你也可以在变量名之前使用 `++` 或 `--` 运算符，例如 `++lines`。然而，它们并不相同。区别在于增加或减少发生的时机：\n\n-\
  \ 如果运算符在变量名之后，增加或减少是在当前表达式评估之后之后发生的。\n- 如果运算符在变量名之前，增加或减少是在当前表达式评估*之前*发生的。\n\n这种差异只在你在同一个语句中使用变量并对其增加或减少时才会产生问题。作为一个例子，假设你将\
  \ `lines` 变量赋值为 40。以下两条语句的效果不同：\n\n```\nalert(lines++);\nalert(++lines);\n```\n\n\
  第一条语句显示值为 40 的警报，然后将 `lines` 增加到 41。第二条语句首先将 `lines` 增加到 41，然后显示值为 41 的警报。\n\n###\
  \ 理解表达式和运算符\n\n表达式（`expression`）是变量和值的组合，JavaScript 解释器将其评估为单个值。用于组合这些值的字符（如 `+`\
  \ 和 `/`）被称为运算符（`operators`）。\n\n**提示**\n\n除了变量和常量之外，你还可以在表达式中使用返回结果的函数调用。\n\n####\
  \ 使用 JavaScript 运算符\n\n\n\n\n\n你已经使用了一些运算符，例如 `+` 符号（加法）以及增（`increment`）减（`decrement`）运算符。表\
  \ 16.1 列出了你在 JavaScript 表达式中使用的一些重要运算符。\n\n表 16.1 常见的 JavaScript 运算符\n\n![image](img/16tab01.jpg)\n\
  \n除了这些之外，还有许多用于条件语句的其它运算符；你将在第 18 章“使用条件和循环控制流程](#ch18.html_ch18)”中学习这些内容。\n\n##\
  \ 运算符优先级\n\n当你在表达式中使用多个运算符时，JavaScript 会使用`运算符优先级`（operator precedence）规则来决定如何计算值。表\
  \ 16.1 按优先级从低到高的顺序列出了运算符，优先级最高的运算符会被优先计算。例如，考虑这条语句：\n\n```\nresult = 4 + 5 * 3;\n\
  ```\n\n> 注意\n> 如果你熟悉任何编程语言，你会发现 JavaScript 中的运算符和优先级在大多数情况下与 C、C++、Java 以及如 PHP\
  \ 等网络脚本语言的工作方式相同。\n\n如果你尝试计算这个结果，有两种方法。你可以先相乘 `5 * 3` 然后加 `4`（结果为：`19`），或者先加 `4\
  \ + 5` 然后乘以 `3`（结果为：`27`）。JavaScript 通过遵循优先级规则来解决这一困境：因为乘法的优先级高于加法，所以它会先计算 `5 *\
  \ 3` 然后加 `4`，得到结果 `19`。\n\n有时运算符优先级并不会产生你想要的结果。例如，考虑这条语句：\n\n```\nresult = a + b\
  \ + c + d / 4;\n```\n\n这是试图通过将四个数字相加然后除以四来计算平均值。然而，由于 JavaScript 给出的除法的优先级高于加法，它会在加上其他数字之前先将变量\
  \ `d` 除以 `4`，从而产生错误的结果。\n\n你可以通过使用括号来控制优先级。以下是计算平均值的有效语句：\n\n```\nresult = (a +\
  \ b + c + d) / 4;\n```\n\n> 提示\n> 如果你不确定运算符优先级，可以使用括号来确保运行结果符合你的预期，并使你的脚本更具可读性。\n\
  \n括号确保四个变量首先被相加，然后将总和除以四。\n\n## JavaScript 中的数据类型\n\n在某些计算机语言中，你必须指定变量将存储的数据类型，例如数字或字符串。在\
  \ JavaScript 中，大多数情况下你不需要指定数据类型。然而，你应该了解 JavaScript 可以处理的数据类型。\n\n> 注意\n> 你将在第 18\
  \ 章中学习更多关于布尔值以及在 JavaScript 中使用条件的内容。\n\n这些是基础 JavaScript 数据类型：\n\n- **数字（Numbers），例如\
  \ `3`、`25` 或 `1.4142138`**——JavaScript 支持整数和浮点数。\n- **布尔值（Boolean），或逻辑值**——它们可以有两个值之一：`true`\
  \ 或 `false`。这些值用于指示某个条件是否为真。\n- **字符串（Strings），例如 `\"I am a jelly doughnut\"`**——它们由一个或多个文本字符组成。（严格来说，这些是\
  \ `String` 对象，你将在本章稍后的部分学习。）\n- **空值（The null value），由关键字 `null` 表示**——这是未定义变量的值。例如，如果变量\
  \ `fig` 之前未被使用或定义，语句 `document.write(fig)` 将产生此值（以及一条错误消息）。\n\n尽管 JavaScript 会跟踪每个变量中当前存储的数据类型，但它并没有限制你在途中更改类型。例如，假设你通过赋值一个值来声明一个变量：\n\
  \n```\ntotal = 31;\n```\n\n> 注意\n> 虽然 JavaScript 的这一功能既方便又强大，但也可能让你容易出错。例如，如果 `total`\
  \ 变量随后被用于数学计算，结果将是无效的——但 JavaScript 不会警告你犯了这个错误。\n\n这条语句声明了一个名为 `total` 的变量并赋值赋值\
  \ 31。这是一个数值型变量。现在假设你更改了 `total` 的值：\n\n```\ntotal = \"albatross\";\n```\n\n这为 `total`\
  \ 赋值了一个字符串值，替换了数值值。当这条语句执行时，JavaScript 不会显示错误；它是完全有效的，尽管这可能不是一个很有用的总数。\n\n## 数据类型之间的转换\n\
  \nJavaScript 在任何可能的情况下为你处理数据类型之间的转换。例如，你已经用过类似这样的语句：\n\n```\ndocument.write(\"The\
  \ total is \" + total);\n```\n\n这条语句会打印诸如 `\"The total is 40\"` 的消息。由于 `document.write`\
  \ 函数与字符串一起工作，JavaScript 解释器在执行函数之前会自动将表达式中的任何非字符串内容（在本例中为 `total` 的值）转换为字符串。\n\n\
  这对于浮点值和布尔值同样有效。然而，在某些情况下它将无法起作用。例如，如果 `total` 的值为 `40`，那么述语句将正常工作：\n\n```\naverage\
  \ = total / 3;\n```\n\n然而，`total` 变量也可能包含一个字符串；在这种情况下，前述语句会导致错误。\n\n在某些情况下，你可能会得到一个包含数字的字符串并需要将其转换为数值变量。JavaScript\
  \ 提供了两个用于此目的函数：\n\n- `parseInt()` 将字符串转换为整数。\n- `parseFloat()` 将字符串转换为浮点数。\n\n这两个函数都会从字符串开头读取数字并返回数值版本。例如，这些语句将\
  \ `\"30 angry bears\"` 转换为数字：\n\n```\nstringvar = \"30 angry bears\";\nnumvar =\
  \ parseInt(stringvar);\n```\n\n> 注意\n> 这些函数会在字符串开头寻找数字。如果找不到有效数字，函数将返回特殊值 `NaN`（代表不是数字）。\n\
  \n执行这些语句后，`numvar` 变量包含数字 30。字符串中的数字部分被忽略了。\n\n## 使用字符串对象\n\n你在之前的章节已经使用了许多字符串。字符串存储一组文本字符，命名方式与其他变量类似。作为一个简单的示例，这条语句将字符串\
  \ `This is a test` 赋值给名为 `test` 的字符串变量：\n\n```\ntest = \"This is a test\";\n```\n\
  \n### 创建字符串对象\n\nJavaScript 将字符串存储为 `String` 对象。你通常不需要担心，但解释处理字符串的一些技巧，这些技巧使用了 `String`\
  \ 对象的方法（内置函数）。\n\n创建新的 `String` 对象有两种方法。第一种是你已经使用的，而第二种使用面向对象的语法。以下两个语句创建相同的字符串：\n\
  \n```\ntest = \"This is a test\";\ntest = new String(\"This is a test\");\n```\n\
  \n第二条语句使用了 `new` 关键字，你用它来创建对象。这告诉浏览器创建一个包含 `This is a test` 的新 `String` 对象，并将其赋值给变量\
  \ `test`。\n\n> 注意\n> 虽然可以使用面向对象的语法创建字符串，但标准的 JavaScript 语法更简单，且两种方法创建的字符串没有区别。\n\
  \n### 赋值\n\n你可以像处理其他变量一样给字符串赋值。前一节中的两个示例都为字符串分配了初始值。你也可以在字符串创建后进行赋值。例如，述语句会将 `test`\
  \ 变量的内容替换为新字符串：\n\n```\ntest = \"This is only a test.\";\n```\n\n\n\n\n你也可以使用连接运算符（`+`）来组合两个字符串的值。列表\
  \ 16.1 显示了赋值和组合字符串值的一个简单示例。\n\n#### 列表 16.1 给字符串赋值并组合它们\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>String Text</title>\n  </head>\n  <body>\n\
  \    <h1>String Test</h1>\n    <script type=\"text/javascript\">\n      test1 =\
  \ \"This is a test. \";\n      test2 = \"This is only a test.\";\n      both = test1\
  \ + test2;\n      alert(both);\n      </script>\n  </body>\n</html>\n```\n\n该脚本为两个字符串变量\
  \ `test1` 和 `test2` 赋值，然后显示它们组合后的值的警告框。如果你在浏览器中加载此 HTML 文档，输出应该类似于图 16.1。\n\n**图\
  \ 16.1** 字符串示例脚本的输出。\n\n![image](img/16fig01.jpg)\n\n除了使用 `+` 运算符连接两个字符串，你还可以使用\
  \ `+=` 运算符向字符串添加文本。例如，此语句向字符串 `sentence` 的当前内容添加了一个句号：\n\n`sentence += \".\";`\n\
  \n> 注意\n加号（`+`）在 JavaScript 中也用于数字加。浏览器根据你用于加号的数据类型判断是使用加法还是连接。如果你在数字和字符串之间使用它，数字将转换为字符串并进行连接。\n\
  \n#### 计算字符串的长度\n\n有时，你可能会发现知道字符串变量包含多少个字符是有用的。你可以通过 `String` 对象的 `length` 属性来实现这一点，该属性适用于任何字符串。要使用此属性，输入字符串的名称后跟\
  \ `.length`。\n\n例如，`test.length` 指的是 `test` 字符串的长度。这里是该属性的一个示例：\n\n```javascript\n\
  test = \"This is a test.\";\ndocument.write(test.length);\n```\n\n> 注意\n记住，尽管 `test`\
  \ 是一个字符串变量，但 `test.length` 的值是一个数字，可以用于任何数值表达式。\n\n第一条语句将字符串 `This is a test` 赋值给变量\
  \ `test`。第二条语句显示字符串的长度——在这种情况下为 15 个字符。`length` 属性是一个只读属性，因此你不能为其赋值来改变字符串的长度。\n\n\
  #### 转换字符串的大小\n\n`String` 对象的两种方法允许你将字符串的内容转换为全大写或全小写：\n\n- `toUpperCase()`——将字符串中的所有字符转换为大写\n\
  - `toLowerCase()`——将字符串中的所有字符转换为小写\n\n> 注意\n注意，这些方法的语法与之前介绍的 `length` 属性相似。区别在于方法始终使用括号，而属性则不然。`toUpperCase`\
  \ 和 `toLowerCase` 方法不接受任何参数，但你仍然需要使用括号。\n\n例如，以下语句以小写形式显示 `test` 变量的值：\n\n```javascript\n\
  document.write(test.toLowerCase());\n```\n\n假设该变量包含 `This Is Test`，结果将是以下字符串：`this\
  \ is a test`。注意，这些方法不会改变 `text` 变量。它们返回字符串的大写或小写版本。如果你想更改字符串的值，可以使用这样的语句：\n\n`test\
  \ = test.toLowerCase();`\n\n#### 处理子字符串\n\n到目前为止，你处理的是整个字符串。JavaScript 还允许你处理子字符串，即字符串的一部分。你可以使用\
  \ `substring` 方法获取字符串的一个部分，或者使用 `charAt` 方法获取单个字符。这些将在接下来的章节中解释。\n\n#### 使用字符串的一部分\n\
  \n`substring` 方法返回一个由原始字符串中两个索引值之间的部分组成的字符串，你必须在括号中指定它们。例如，以下语句显示 `text` 字符串的第四到第六个字符：\n\
  \n```javascript\ndocument.write(text.substring(3,6));\n```\n\n此时，你可能在想 `3` 和 `6`\
  \ 是哪里来的。关于索引参数，你需要理解三点：\n\n- 索引从字符串的第一个字符开始为 `0`，所以第四个字符实际上是索引 `3`。\n- 第二个索引是不包含的。第二个索引\
  \ `6` 包含到索引 `5`（第六个字符）。\n- 你可以以任何顺序指定两个索引。较小的将被假设为第一个索引。在之前的示例中，`(6,3)` 也会得到相同的结果。当然，很少有理由使用反向顺序。\n\
  \n作为另一个例子，假设你定义了一个名为 `alpha` 的字符串来存储字母表：\n\n`alpha = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ\"\
  ;`\n\n以下是使用该字符串的 `substring()` 方法的示例：\n\n- `alpha.substring(0,4)` 返回 `ABCD`。\n-\
  \ `alpha.substring(10,12)` 返回 `KL`。\n- `alpha.substring(12,10)` 也返回 `KL`。因为它较小，`10`\
  \ 被用作第一个索引。\n- `alpha.substring(6,7)` 返回 `G`。\n- `alpha.substring(24,26)` 返回 `YZ`。\n\
  - `alpha.substring(0,26)` 返回整个字母表。\n- `alpha.substring(6,6)` 返回空。当两个索引值相同时情况如此。\n\
  \n#### 获取单个字符\n\n`charAt` 方法是从字符串抓取单个字符的简单方法。你在括号中指定字符的索引或位置。索引从第一个字符开始为 `0`。这里是使用\
  \ `alpha` 字符串的一些示例：\n\n- `alpha.charAt(0)` 返回 `A`。\n- `alpha.charAt(12)` 返回 `M`。\n\
  - `alpha.charAt(25)` 返回 `Z`。\n- `alpha.charAt(27)` 返回空字符串，因为该位置没有字符。\n\n> 注意\n与大多数\
  \ JavaScript 方法名称一样，`indexOf` 是大小敏感的。在脚本中使用它时，确保按照所示方式输入。\n\n#### 查找子字符串\n\n子字符串的另一个用途是在另一个字符串中查找字符串。一种方法是使用\
  \ `indexOf` 方法。使用此方法，要在要搜索的字符串后添加 `indexOf` 括号内指定要搜索的字符串。此示例在 `test` 字符串中搜索 `\"\
  this\"`：\n\n`loc = test.indexOf(\"this\");`\n\n> 注意\n第二个参数的一个用途是搜索字符串的多次出现。在找到第一个出现处后，从该位置开始搜索第二个，依此类推。\n\
  \n存储在 `loc` 变量中的值是字符串的索引，类似于 `substring` 方法中的第一个索引。字符串的第一个字符索引为 `0`。\n\n你可以指定可选的第二个参数来指示开始搜索的索引值。例如，此语句从第\
  \ 20 个字符开始在 `temp` 字符串中搜索单词 `fish`：\n\n`location = temp.indexOf(\"fish\",19);`\n\
  \n第二个方法 `lastIndexOf()` 工作相同，但它是查找字符串的最后一次出现。它从最后一个字符开始反向搜索字符串。例如，此语句在 `names` 字符串中找到\
  \ `Fred` 的最后一次：\n\n`location = names.lastIndexOf(\"Fred\");`\n\n与 `indexOf()` 一样，你可以指定一个位置作为第二个参数。在这种情况下，字符串将从该位置开始反向搜索。\n\
  \n### 使用数字数组\n\n\n\n\n\n`array`（数组）是一个带编号的数据项组，你可以将其视为一个单一单元进行处理。例如，你可能会使用一个名为 `scores`\
  \ 的数组来存储某个游戏的多次分数。数组可以包含字符串、数字、对象或其他类型的数据。数组中的每个项目被称为该数组的 `element`（元素）。\n\n###\
  \ 创建数值数组\n\n与大多数其他类型的 JavaScript 变量不同，你通常需要在使用数组之前对其进行声明。下面的示例创建了一个包含四个元素的数组：\n\n\
  ```\nscores = new Array(4);\n```\n\n要给数组赋值，你使用方括号中的索引。索引从 `0` 开始，因此此示例中的数组元素将编号为\
  \ `0` 到 `3`。这些语句为数组的四个元素分配值：\n\n```javascript\nscores[0] = 39;\nscores[1] = 40;\n\
  scores[2] = 100;\nscores[3] = 49;\n```\n\n**Tip**\n记住在使用 `new` 关键字声明数组时要使用圆括号，例如\
  \ `a=new Array(3,4,5)`；在不使用 `new` 声明数组时要使用方括号，例如 `a=[3,4,5]`。否则，你会遇到 JavaScript\
  \ 错误。\n\n你也可以在声明数组的同时为元素指定值。这条语句在一行内创建了相同的 `scores` 数组：\n\n```javascript\nscores\
  \ = new Array(39,40,100,49);\n```\n\n你还可以使用简写语法来声明数组并指定其内容。下面的语句是创建 `scores` 数组的另一种方式：\n\
  \n```javascript\nscores = [39,40,100,49];\n```\n\n### 理解数组长度\n\n与字符串一样，数组有一个 `length`\
  \ 属性。它告诉你数组中元素的数量。如果你在创建数组时指定了长度，该值将成为 `length` 属性的值。例如，这些语句将打印数字 `30`：\n\n```javascript\n\
  scores = new Array(30);\ndocument.write(scores.length);\n```\n\n你可以声明一个没有特定长度的数组，稍后通过给元素赋值或更改\
  \ `length` 属性来改变长度。例如，这些语句创建了一个新数组并为其其中两个元素赋值：\n\n```javascript\ntest = new Array();\n\
  test[0]=21;\ntest[5]=22;\n```\n\n在这个示例中，因为目前分配的最大索引数字是 `5`，所以数组的 `length` 属性为 `6`——记住，元素是从\
  \ 0 开始编号的。\n\n**Tip**\n看到这个示例，你可能会认为显示大型数组的所有元素会很不方便。这正是循环的理想用场，循环允许你使用不同的值多次执行相同的语句。你将在第\
  \ 18 章中学习关于循环的所有知识。\n\n### 访问数组元素\n\n你可以使用与赋值时相同的表示法来读取数组的内容。例如，下面的语句将显示 `scores`\
  \ 数组前三个元素的值：\n\n```javascript\nscoredisp = \"Scores: \" + scores[0] + \",\" + scores[1]\
  \ + \",\" + scores[2];\ndocument.write(scoredisp);\n```\n\n### 使用字符串数组\n\n到目前为止，你使用的是数字数组。JavaScript\
  \ 还允许你使用 `string arrays`（字符串数组），即字符串数组。这是一个强大的功能，允许你同时处理大量字符串。\n\n#### 创建字符串数组\n\
  \n你以与数值数组相同的方式声明字符串数组——事实上，JavaScript 并不对它们进行区分：\n\n```javascript\nnames = new Array(30);\n\
  ```\n\n然后你可以为数组元素分配字符串值：\n\n```javascript\nnames[0] = \"Henry J. Tillman\";\nnames[1]\
  \ = \"Sherlock Holmes\";\n```\n\n与数值数组一样，你也可以创建时指定字符串数组的内容。以下任何一条语句都可以创建与前面示例相同的字符串数组：\n\
  \n```javascript\nnames = new Array(\"Henry J. Tillman\", \"Sherlock Holmes\");\n\
  names = [\"Henry J. Tillman\", \"Sherlock Holmes\"];\n```\n\n你可以在任何使用字符串的地方使用字符串数组元素。你甚至可以使用之前引入的字符串方法。例如，下面的语句打印\
  \ `names` 数组第一个元素的前五个字符，结果为 `Henry`：\n\n```javascript\ndocument.write(names[0].substring(0,5));\n\
  ```\n\n#### 拆分字符串\n\nJavaScript 包含一个名为 `split` 的字符串方法，它可以将字符串拆分成组成部分。要使用此方法，请指定要拆分的字符串和一个用于划分部分的字符：\n\
  \n```javascript\ntest = \"John Q. Public\";\nparts = test.split(\" \");\n```\n\n\
  在这个示例中，字符串 `test` 包含 `John Q. Public`。第二个语句中的 `split` 方法在每个空格处拆分 `name` 字符串，得到三个字符串。这些字符串存储在一个名为\
  \ `parts` 的字符串数组中。执行示例语句后，`parts` 的元素包含以下内容：\n\n* `parts[0] = \"John\"`\n* `parts[1]\
  \ = \"Q.\"`\n* `parts[2] = \"Public\"`\n\nJavaScript 还包含一个数组方法 `join`，执行相反的功能。这条语句将\
  \ `parts` 数组重新组合字符串：\n\n```javascript\nfullname = parts.join(\" \");\n```\n\n括号中的值指定了一个分隔部分的字符。在这种情况下，使用了空格，得到最终字符串\
  \ `John Q. Public`。如果你不指定字符，则使用逗号，得到 `John,Public`。\n\n#### 字符串排序\n\nJavaScript\
  \ 还包含一个数组方法 `sort`，它可以按字母顺序排序。例如，以下语句初始化数组：\n\n```javascript\nnames[0] = \"Public\"\
  ;\nnames[1] = \"Jane\";\nnames[2] = \"Duck\";\nnames[3] = \"Mickey\";\n```\n\n由于\
  \ `sort` 方法按字母顺序排序，它对数值数组不起作用——至少不像你期望的那样。如果数组包含 `4, 10, 30, 200`，例如，它将排序为 `10,\
  \ 200, 30, 4`。幸运的是有一个解决方案：你可以在 `sort` 方法中指定一个函数：\n\n```javascript\nfunction numcompare(a,b)\
  \ { return a-b; }\nnums = new Array(30);\nsorted = nums.sort(numcompare);\n```\n\
  \n**Note**\nJavaScript 期望比较函数在 `a` 在 `b` 之前时返回负数，相同时返回 0，在 `a` 在 `b` 之后返回正数。这就是为什么函数只需要\
  \ `a-b`。\n\n### 尝试一下：排序和显示\n\n为了获得更多使用 JavaScript 字符串和数组的经验，你可以创建一个输入列表的脚本。由于这是一个较大的脚本，你需要创建的\
  \ HTML 和 JavaScript 文件，如第 14 章所示。首先，`sort.html` 文件将包含 HTML 结构和脚本使用的表单字段。列表 16.2\
  \ 显示了 HTML 文档。\n\n**列表 16.2 排序示例的 HTML 文档**\n\n```html\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>数组排序示例</title>\n    <script type=\"text/javascript\" src=\"sort.js\"></script>\n\
  \  </head>\n  <body>\n    <h1>字符串数组</h1>\n    <p>在下面的字段中输入两个或多个名称，\n    排序后的名称列表将出现在文本区域。</p>\n\
  \    <form name=\"theform\">\n      名称:\n      <input type=\"text\" name=\"newname\"\
  \ size=\"20\" />\n      <input type=\"button\" name=\"addname\" value=\"添加\"\n \
  \     onclick=\"SortNames();\">\n    </form>\n    <br/>\n    <h2>排序后的名称</h2>\n \
  \ </body>\n</html>\n```\n\n\n\n\n```html\n<textarea cols=\"60\" rows=\"10\" name=\"\
  sorted\">\n\n  排序后的名称将显示在这里。\n\n</textarea>\n```\n</form>\n\n</body>\n\n</html>\n\
  \n* * *\n\n由于脚本将位于单独的文件，此文档头部的 `<script>` 标签使用 `src` 属性来包含名为 `sort.js` 的 JavaScript\
  \ 文件。你接下来将创建这个文件。\n\n本文档定义了一个名为 `theform` 的表单、名为 `newname` 的文本字段、一个 `addname` 按钮以及名为\
  \ `sorted` 的文本区域。你的脚本将使用这些表单字段作为用户界面。\n\nListing 16.3 提供了排序过程所需的 JavaScript。\n\n\
  Listing 16.3 排序示例的 JavaScript 文件\n\n* * *\n\n```javascript\n// 初始化计数器和数组\n\nvar\
  \ numnames=0;\n\nvar names = new Array();\n\nfunction SortNames() {\n   // 从文本框获取名称\n\
  \   thename=document.theform.newname.value;\n   // 将名称添加到数组\n   names[numnames]=thename;\n\
  \   // 计数器加 1\n   numnames++;\n   // 数组排序\n   names.sort();\n   document.theform.sorted.value=names.join(\"\
  \\n\");\n}\n```\n\n* * *\n\n脚本首先使用 `var` 关键字定义两个变量：`numnames` 是一个随着每次添加名称的计数器，`names`\
  \ 数组将存储名称。\n\n当你向文本字段中输入名称并点击按钮时，`onclick` 事件处理程序会调用 `SortNames()` 函数。该函数将文本字段的值存储在变量\
  \ `thename` 中，然后使用 `numnames` 作为索引将名称添加到 `names` 数组中。随后增加 `numnames` 为下一个名称做准备。\n\
  \n脚本的最后部分对名称进行排序并显示。首先，使用 `sort()` 方法对 `names` 数组排序。接下来，使用 `join()` 方法合并名称，用换行符分隔并显示在文本区域中。\n\
  \n要测试脚本，请将其保存为 `sort.js`，然后在浏览器中加载你之前创建的 `sort.html` 文件。然后你可以添加一些名称并测试脚本。图 16.2\
  \ 显示了排序几个名称后的结果。\n\n**图 16.2** 名称排序示例的输出。\n\n![image](img/16fig02.jpg)\n\n* * *\n\
  \n## 总结\n\n在本章中，你专注于变量以及 JavaScript 如何处理它们。你学习了如何命名变量、如何声明变量以及局部变量与全局变量之间的区别。你还探索了\
  \ JavaScript 支持的数据类型以及如何在它们之间转换。\n\n你还学习了 JavaScript 更复杂的变量、字符串和数组，并查看了允许你对它们执行操作的功能，例如将字符串转换为大写或对数组。\n\
  \n在下一章中，你将通过学习另外两个关键特性：函数和对象，继续你的 JavaScript 基础教育。\n\n## 问答\n\n**Q. `var` 关键字的重要性是什么？我应该一直使用它声明变量吗？**\n\
  \n**A.** 你只需要在函数中使用 `var` 来定义局部变量。但是，如果你有任何不确定，使用 `var` 总是安全的。一致地使用它将帮助你保持脚本整洁且无错误。\n\
  \n**Q. 是否有理由我想使用 `var` 关键字来创建一个与全局变量同名的局部变量？**\n\n**A.** 不是刻意为。使用 `var` 的主要原因是避免与你可能不知道的全局变量发生冲突。例如，你将来可能会添加一个全局变量，或者可能在页面上添加另一个使用相似变量名的脚本。这在大型、复杂的脚本中更多是一个问题。\n\
  \n**Q. 布尔变量有什么用？**\n\n**A.** 在脚本中，通常你需要一个变量来指示某些事情是否发生——例如，用户输入的电话号码格式是否正确。布尔变量非常适合这种用法；它们在处理条件时也有用，正如你在第\
  \ 18 章 中看到的。\n\n**Q. 我可以在数组中存储其他类型的数据吗？例如，我可以有一个日期数组吗？**\n\n**A.** 绝对可以。JavaScript\
  \ 允许你在数组中存储任何数据类型。\n\n**Q. 二维数组呢？**\n\n**A.** 这些是具有两个索引（如列和行）的数组。JavaScript 不直接支持这种数组，但你可以使用对象来实现相同的效果。你将在下一章学习更多关于对象的知识。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n**1.**\
  \ 下列哪项*不是*有效的变量名？\na. `2names`\nb. `first_and_last`\nc. `FirstLast`\n\n**2.** 如果语句\
  \ `var2` 出现在函数中，它声明的是哪种类型的变量？\na. 全局变量\nb. 局部变量\nc. 常量变量\n\n**3.** 如果字符串 `test`\
  \ 包含 the eagle landed.，那么 `test.length` 的值是多少？\na. `4`\nb. `21`\nc. `The`\n\n**4.**\
  \ 使用相同的示例，这些语句中哪一个会返回 `eagle` 单词？\na. `test.substring(4,9)`\nb. `test.substring(5,9)`\n\
  c. `test.substring(\"eagle\")`\n\n**5.** JavaScript 表达式 `31 + \" angry bears\"`\
  \ 的结果是什么？\na. 错误信息\nb. 32\nc. 31 angry bears\n\n#### 答案\n\n1. a. `2names` 是无效的变量名，因为它以数字开头。其他是有效的，尽管可能不是理想的选择。\n\
  2. b. 因为变量在函数中声明，所以它是局部变量。`var` 关键字确保创建了局部变量。\n3. b. 字符串长度为 21。\n4. a. 正确的语句是 `test.substring(4,9)`。记住索引从\
  \ 0 开始，第二个索引是不包含在内的。\n5. c. JavaScript 将整个表达式转换为字符串 \"31 angry bears\"。（无意北极熊，它们很少愤怒，也很少在这样的群体中出现。）\n\
  \n## 练习\n\n- 修改 Listing 16.3 中的排序示例，在排序和显示之前将名称转换为全大写。\n- 修改 Listing 16.3，在文本区域中显示带编号的名称列表。\n\
  \n\n\n\n你到目前为止看到的脚本都是简单的指令列表。浏览器从 `<script>` 标签后的第一个语句开始，并按顺序执行每条指令，直到遇到闭合标签 `</script>`（或遇到错误）。\n\
  \n虽然对于短脚本来说这种方法非常直观，但阅读以这种方式编写的长脚本可能会让你感到困惑。为了方便你组织脚本，JavaScript 支持函数，你已经在第 14 章“开始\
  \ JavaScript 编程”中学习过相关内容。在本节中，你将学习如何定义和使用函数。\n\n## 定义函数\n\n`函数` 是 JavaScript 语句的组，它们可以被视为单个单元。要使用函数，你必须先定义它。这里有一个函数定义的简单示例：\n\
  \n```javascript\nfunction Greet() {\n    alert(\"Greetings.\");\n}\n```\n\n这段代码定义了一个向用户显示警报信息的函数。它以\
  \ `function` 关键字开头。函数名是 `Greet`。注意函数名后的括号。正如你接下来将学到的，它们之间的空格并不总是空的。\n\n函数定义的第一行和最后一行包含了大括号（`{`\
  \ 和 `}`）。你用它们来包裹函数中的所有语句。浏览器利用大括号来确定函数的开始和结束位置。\n\n在大括号之间，这个特定的函数包含单行代码。它使用了内置的\
  \ `alert` 函数显示一条警报消息。消息将包含文本“Greetings.”。\n\n### 注意事项\n\n函数名是区分大小写的。如果你定义了一个带有大写字母的函数如\
  \ `Greet`，请确保在调用该函数时使用相同的名称。也就是说，如果你定义的函数名是 `Greet` 但却尝试使用 `greet` 来调用它，它将无法工作。\n\
  \n现在我们来说这些括号。当前的 `Greet` 函数总是执行相同的事情：每次你使用它，它都会显示相同的消息。虽然这避免了一些打字工作，但并没有提供多少优势。\n\
  \n为了让你的函数更灵活，你可以添加 `parameters`（参数），也称为 `arguments`（参数）。这些是函数每次被调用时接收的变量。例如，你可以添加一个名为\
  \ `who` 的参数，告诉函数要问候的人的名字。以下是修改后的 `Greet` 函数：\n\n```javascript\nfunction Greet(who)\
  \ {\n    alert(\"Greetings, \" + who);\n}\n```\n\n当然，要使用此函数，你应该将其包含在 HTML 文档中。传统上，函数定义的最佳位置是文档的\
  \ `<head>` 部分。因为 `<head>` 部分中的语句会首先执行，这确保了函数在在使用之前已经过定义。\n\n列表 17.1 显示了嵌入在 HTML\
  \ 文档头部区域的 `Greet` 函数。\n\n列表 17.1 HTML 文档中的 Greet 函数\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Functions</title>\n    <script type=\"\
  text/javascript\">\n      function Greet(who) {\n        alert(\"Greetings, \" +\
  \ who);\n      }\n    </script>\n  </head>\n  <body>\n    <p>This is the body of\
  \ the page.</p>\n  </body>\n</html>\n```\n\n## 调用函数\n\n你现在已经定义了一个函数并将其放置在 HTML 文档中。然而，如果你将列表\
  \ 17.1 加载到浏览器中，你会发现它什么也没做。这是因为函数已经定义了——准备好被使用——但我们还没有使用它。\n\n使用函数被称为 `calling`（调用）该函数。要调用函数，请使用函数名。例如：\n\
  \n```javascript\nGreet(\"World\");\n```\n\n## 返回值\n\n你刚刚创建的函数可以向用户显示消息，但函数还可以向调用它的脚本返回一个值。为了实现这一点，你可以使用\
  \ `return` 关键字。\n\n```javascript\nfunction Average(a, b, c, d) {\n    return (a\
  \ + b + c + d) / 4;\n}\n```\n\n当函数执行 `return` 语句时，它会将指定的值传递给调用者，并终止函数的执行。\n\n```javascript\n\
  var result = Average(10, 20, 30, 40);\nalert(result);\n```\n\n列表 17.3 显示了在 HTML\
  \ 文档中完整的 `Average` 函数。\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Functions</title>\n    <script type=\"text/javascript\">\n      function\
  \ Average(a,b,c,d) {\n        return (a + b + c + d) / 4;\n      }\n    </script>\n\
  \  </head>\n  <body>\n    <p>This is the body of the page.</p>\n    <script type=\"\
  text/javascript\">\n      var result = Average(10, 20, 30, 40);\n      alert(result);\n\
  \    </script>\n  </body>\n</html>\n```\n\n\n\n\n# 函数示例：平均值\n\n```javascript\nfunction\
  \ Average(a,b,c,d) {\n    result = (a + b + c + d) / 4;\n    return result;\n}\n\
  ```\n\n以下是函数调用的结果。\n\n```javascript\nscore = Average(3,4,5,6);\ndocument.write(\"\
  The average is: \" + score);\n```\n\n你可以像下面的列表所示，在函数调用中使用变量。该语句计算了数字 3, 4, 5 和 6\
  \ 的平均值，并将结果存储在名为 `score` 的变量中：\n\n```javascript\nscore = Average(3,4,5,6);\n```\n\
  \n### 提示\n你也可以直接在表达式中使用函数调用。例如，你可以使用 `alert` 语句来显示函数 `alert(Average(1,2,3,4))` 的结果。\n\
  \n## 介绍对象\n\n在在一章中，你学习了如何使用变量在 JavaScript 中表示不同类型的数据。JavaScript 还支持 `objects`（对象），这是一种更复杂的变量类型，可以存储多个数据项和函数。\n\
  \n虽然一个变量在同一时间只能有一个值，但对象可以包含多个值，以及处理这些值的函数。这允许你将相关的数据项和处理这些数据的函数分组到单个对象中。\n\n在本章中，你将学习如何定义和使用你自己的对象。你已经接触过其中一些对象，包括：\n\
  \n-   **DOM 对象**——允许你的脚本与网页进行交互。你已经在[第 15 章]，“使用文档对象模型 (DOM)”中中学习过这些内容。\n-   **内置对象**——包括字符串和数组，你已经在[第\
  \ 16 章]，“使用 JavaScript 变量、字符串和数组”中学习过这些内容。\n\n处理所有三种类型对象（DOM 对象、内置对象和自定义对象）的语法是相同的，因此即使你最终没有创建自己的对象，你也应该对\
  \ JavaScript 的对象术语和语法有良好的理解。\n\n### 创建对象\n\n当你上一章中创建一个数组时，你使用了以下 JavaScript 语句：\n\
  \n```javascript\nscores = new Array(4);\n```\n\n`new` 关键字告诉 JavaScript 解释器使用一个函数（在这种情况下，是内置的\
  \ `Array` 函数）来创建一个对象。你将在本章晚些时候为自定义对象创建一个函数。\n\n### 对象属性和值\n\n每个对象都有一个或多个 `properties`（属性）——本质上是存储在对象中的变量。例如，在[第\
  \ 15 章]中，你学习到 `location.href` 属性提供当前文档的 URL。`href` 属性是 DOM 中 `location` 对象的属性之一。\n\
  \n你也使用过 `String` 对象的 `length` 属性，如下一章中的示例：\n\n```javascript\ntest = \"This is a\
  \ test.\";\ndocument.write(test.length);\n```\n\n就像变量一样，每个对象属性都有一个 `value`（值）。要读取属性的值，只需要在任何表达式中包含对象和属性属性（用点隔开），如之前的\
  \ `test.length`。你可以使用 `=` 运算符更改属性的值，就像更改变量一样。接下来的示例通过更改 `location.href` 属性将浏览器引导到新的\
  \ URL：\n\n```javascript\nlocation.href=\"http://www.google.com/\";\n```\n\n> 注意：对象也可以是另一个对象的属性。这被称为“child\
  \ object”（子对象）。\n\n### 理解方法\n\n除了属性之外，每个对象还可以有一个或多个 `methods`（方法）。这些是处理对象数据的函数。例如，接下来的\
  \ JavaScript 语句正如你在[第 15 章]中所学习的那样，会重加载当前文档：\n\n```javascript\nlocation.reload();\n\
  ```\n\n当你使用 `reload()` 时，你正在使用 `location` 对象的方法。和普通函数一样，方法可以在括号中接受参数并可以返回值。\n\n\
  ## 使用对象简化脚本编写\n\n尽管 JavaScript 的变量和数组是存储数据的灵活方式，但有时你需要一个更复杂的结构。例如，假设你正在编写一个脚本来处理一个名片数据库，该数据库包含各种人的姓名、地址和电话号码。\n\
  \n如果你使用普通变量，则需要为数据库中的每一个人准备几个独立的变量：一个姓名变量、一个地址变量和一个电话号码。使用对象允许你将这些组合在一起。\n\n###\
  \ 定义对象\n\n创建对象的第一步是为它命名。每个对象具有以下属性：\n-   `name`\n-   `address`\n-   `workphone`\n\
  -   `home`\n\n这里是 `Card` 的构造函数：\n\n```javascript\nfunction Card(name,address,work,home)\
  \ {\n    this.name = name;\n    this.address = address;\n    this.workphone = work;\n\
  \    this.home = home;\n}\n```\n\n### 定义对象方法\n\n接下来，你将创建一个处理 `Card` 对象的方法。因为所有 `Card`\
  \ 对象具有相同的属性，如果有一个可以以整洁格式打印属性的函数可能会非常方便。我们将此函数称为 `PrintCard`。你的 `PrintCard` 函数将作为\
  \ `Card` 对象的方法使用，因此不需要请求参数。相反，你可以使用 `this` 关键字引用当前对象的属性。以下是 `PrintCard()` 函数的定义：\n\
  \n```javascript\nfunction PrintCard() {\n    line1 = \"Name: \" + this.name + \"\
  <br/>\\n\";\n    line2 = \"Address: \" + this.address + \"<br/>\\n\";\n    line3\
  \ = \"Work Phone: \" + this.workphone + \"<br/>\\n\";\n    line4 = \"Home Phone:\
  \ \" + this.home + \"<hr/>\\n\";\n    document.write(line1, line2, line3, line4);\n\
  }\n```\n\n你现在有一个可以打印名片的函数，但它并不是 `Card` 对象的正式方法。你最后需要做的是将 `PrintCard`  `Card` 对象函数定义的一部分。以下是修改后的函数定义：\n\
  \n```javascript\nfunction Card(name,address,work,home) {\n    this.name = name;\n\
  \    this.address = address;\n    this.workphone = work;\n    this.home = home;\n\
  \    this.PrintCard = PrintCard;\n}\n```\n\n\n\n\n新增的语句看起来就像另一个属性定义，但它引用了 `PrintCard`\
  \ 函数。只要 `PrintCard` 函数是用它自己的函数定义定义的，这种方法就能生效。方法本质上是定义函数的属性，而不是简单的值。\n\n* * *\n\n\
  ### 提示\n\n上一个示例对属性使用了小写名称（如 `workphone`），而对方法使用了大写字母名称（`PrintCard`）。你可以对属性和方法名使用任何大小写，但这是清晰表明\
  \ `PrintCard` 是方法而非普通属性的一种方法。\n\n* * *\n\n#### 创建对象实例\n\n现在，让我们使用你刚刚创建的对象定义和方法。要使用对象定义，你需要创建一个新对象。这是通过\
  \ `new` 关键字实现的。这与你已经用于创建 `Date` 和 `Array` 对象时使用的关键字相同。\n\n以下语句创建了一个名为 `tom` 的新 `Card`\
  \ 对象：\n\n```javascript\ntom = new Card(\"Tom Jones\", \"123 Elm Street\", \"555-1234\"\
  , \"555-9876\");\n```\n\n如你所见，创建一个对象非常简单。你只需要调用 `Card()` 函数（对象定义）并按照定义的相同顺序提供其所需的属性。\n\
  \n在执行该语句后，会创建一个新对象来存储 Tom 的信息。这被称为 `Card` 对象的*实例*（instance）。正就像程序中可以有多个字符串变量一样，你定义的对象也可以有多个实例。\n\
  \n与其使用 `new` 关键字为卡片指定所有信息，你可以在事后为它们进行赋值。例如，以下脚本创建了一个名为 `holmes` 的空 `Card` 对象，然后分配了它的属性：\n\
  \n```javascript\nholmes = new Card();\nholmes.name = \"Sherlock Holmes\";\nholmes.address\
  \ = \"221B Baker Street\";\nholmes.workphone = \"555-2345\";\nholmes.homephone =\
  \ \"555-3456\";\n```\n\n当你使用上述任一种方法创建了 `Card` 对象的实例后，你就可以使用 `PrintCard()` 方法来显示它的信息。例如，该语句显示了\
  \ `tom` 卡片的属性：\n\n```javascript\ntom.PrintCard();\n```\n\n#### 扩展内置对象\n\nJavaScript\
  \ 包含一项功能，允许你扩展内置对象的定义。例如，如果你认为 `String` 对象并不完全符合你的需求，你可以扩展它，添加新的属性或方法。如果你正在编写一个使用许多字符串的大型脚本，这可能会非常有用。\n\
  \n你可以通过 `prototype` 关键字向现有对象添加属性和方法。（*prototype*，即“原型”，是对象定义或构造函数的另一个名称。）`prototype`\
  \ 关键字允许你在构造函数之外更改对象的定义。\n\n为了举例说明，让我们向 `String` 对象定义中添加一个方法。你将创建一个名为 `heading` 的方法，该方法将字符串转换为\
  \ HTML 标题。以下语句定义了一个名为 `title` 的字符串：\n\n```javascript\ntitle = \"Fred's Home Page\"\
  ;\n```\n\n该语句将把 `title` 字符串的内容作为 HTML 1 级标题输出：\n\n```javascript\ndocument.write(title.heading(1));\n\
  ```\n\n列表 17.4 为 `String` 对象定义添加了一个 `heading` 方法，该方法将把字符串作为标题显示，然后使用该方法显示了三个标题。\n\
  \n列表 17.4 为 `String` 对象添加方法\n\n* * *\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Test of Heading Method</title>\n  </head>\n  <body>\n    <script type=\"\
  text/javascript\">\n      function addhead (level) {\n        html = \"h\" + level;\n\
  \        text = this.toString();\n        start = \"<\" + html + \">\";\n      \
  \  stop = \"</\" + html + \">\";\n        return start + text + stop;\n      }\n\
  \      String.prototype.heading = addhead;\n      document.write (\"This is a heading\
  \ 1\".heading(1));\n      document.write (\"This is a heading 2\".heading(2));\n\
  \      document.write (\"This is a heading 3\".heading(3));\n    </script>\n  </body>\n\
  </html>\n```\n\n* * *\n\n首先，你定义了 `addhead()` 函数，它将作为新的字符串方法。它接受一个数字来指定标题级别。`start`\
  \ 和 `stop` 变量用于存储 HTML。\n\n`start` 和 `stop` 变量用于存储 HTML。\n\n`prototype` 关键字允许你在构造函数之外更改对象的定义。\n\
  \n* * *\n\n#### 动手尝试：在对象中存储数据\n\n定义 `addhead()` 函数，它将作为新的字符串方法。它接受一个数字来指定标题级别。`start`\
  \ 和 `stop` 变量用于存储 HTML。\n\n#### 在对象中使用数据\n\n注意，`PrintCard()` 函数已经过修改，使其在加粗字体标题下看起来更好看。\n\
  \n```javascript\nfunction PrintCard(name,address,workphone,homephone) {\n  line1\
  \ = \"<strong>Name:</strong> \" + name;\n  line2 = \"<strong>Address:</strong> \"\
  \ + address;\n  line3 = \"<strong>Work Phone:</strong> \" + workphone;\n  line4\
  \ = \"<strong>Home Phone:</strong> \" + homephone;\n  document.write(line1);\n \
  \ document.write(line2);\n  document.write(line3);\n  document.write(line4);\n}\n\
  \nfunction Card(name,address,workphone,homephone) {\n  this.name = name;\n  this.address\
  \ = address;\n  this.workphone = workphone;\n  this.homephone = homephone;\n}\n\
  Card.prototype.PrintCard = PrintCard;\n\n// 创建对象\nsue = new Card(\"Sue Suthers\"\
  , \"123 Elm Street\", \"555-9876\");\n```\n\n浏览器对此示例的显示见图 17.2。\n\n**图 17.2** 显示名片示例的输出。\n\
  \n![image](img/17fig02.jpg)\n\n* * *\n\n注意\n\n这个示例并不是一个非常复杂的数据库，因为你必须将每个人的数据包含在\
  \ HTML 文文中。然而，这样的对象可以用于存储从具有数千条记录的数据库服务器检索的数据库记录。\n\n\n\n\n\n\n`Math` 对象是一个内置的 JavaScript\
  \ 对象，包含了许多数学常数和函数。你不需要创建 `Math` 对象；它在任何 JavaScript 程序中都会自动存在。`Math` 对象的属性代表数学常数，而它的方法则是数学函数。\n\
  \n## 舍五入与截断\n\n`Math` 对象中三个最实用的方法允许你对小数进行向上或向下舍五入：\n\n• `Math.ceil()` 将数字向上舍入到下一个整数。\n\
  • `Math.floor()` 将数字向下舍入到下一个整数。\n• `Math.round()` 将数字四舍入到最近的整数。\n\n所有这些方法都将要舍入的数字作为唯一的参数。你可能会注意到缺少了一个功能：对特定小数位数进行舍五入的能力（例如处理金额）。幸运的是，你可以轻松地模拟这种操作。这是一个将数字舍入到两位小数的简单函数：\n\
  \n```javascript\nfunction round(num) {\n    return Math.round(num * 100) / 100;\n\
  }\n```\n\n该函数通过将值乘以 100 来移动小数点，然后将数字四舍入到最近的整数。最后，将值除以 100 以将小数点恢复到原始位置。\n\n## 生成随机数\n\
  \n`Math` 对象最常用的方法之一是 `Math.random()` 方法，它可以生成一个随机数。该方法不需要任何参数。它返回的是 0 到 1 之间的随机小数。\n\
  \n你通常需要一个 1 到某个值之间的随机数。你可以通过一个通用的随机数函数来实现。以下是一个生成 1 到你传递的参数值之间随机数的函数：\n\n```javascript\n\
  function rand(num) {\n    return Math.floor(Math.random() * num) + 1;\n}\n```\n\n\
  该函数将随机数乘以参数 `num` 中指定的值，然后使用 `Math.floor()` 方法将其转换为 1 到该数字之间的整数。\n\n## 其他数学函数\n\n\
  `Math` 对象还包含许多你在此处未见过的函数。例如，`Math.sin()` 和 `Math.cos()` 计算正弦和余弦值。`Math` 对象还包含了各种数学常数的属性，例如\
  \ `Math.PI`。\n\n## 使用数学函数工作\n\n`Math.random` 方法生成一个 `0` 到 `1` 之间的随机数。然而，计算机要生成真正的随机数是非常困难的。（人类也很难做到——这就是发明骰子的原因。）\n\
  \n今天的计算机在生成随机数方面表现相当不错，但 JavaScript 的 `Math.random` 函数到底如何呢？测试它的方法是生成许多随机数并计算所有数的平均值。\n\
  \n理论上，平均值应该在 `.5` 左右，即 `0` 和 `1` 的中间。你生成的随机值越多，平均值就越接近这个中间值。\n\n作为使用 `Math` 对象方法的的一个示例，你可以创建一个测试\
  \ JavaScript 随机数函数的脚本。为此，你将生成 5,000 个随机数并计算它们的平均值。\n\n这个示例将使用一个循环，你将在下一章中学习更多内容。但这是一个足够简单的示例，你应该能够跟上。在这种情况下，循环将生成随机数。你会惊讶于\
  \ JavaScript 执行此操作有多快。\n\n要开始脚本，你需要初始化一个名为 `total` 的变量。该变量将存储所有随机值的运行总和，因此让它从 `0`\
  \ 开始非常重要：\n\n```javascript\ntotal = 0;\n```\n\n接下来，开始一个执行 5,000 次的循环。使用 `for` 循环是因为因为你想要它执行固定次数：\n\
  \n```javascript\nfor (i=1; i<=5000; i++) {\n```\n\n在循环内部，你需要创建一个随机数并将其值加到 `total`。以下是执行操作并继续下一次迭代的语句：\n\
  \n```javascript\nnum = Math.random();\ntotal += num;\n}\n```\n\n***\n\n注意：\n之前代码中的\
  \ `%` 符号是*取模运算符*，它给出一个数除以另一个数后的余数。在这里它被用于寻找 1,000 的偶倍数。\n\n***\n\n取决于你计算机的速度，可能需要几秒钟生成那\
  \ 5,000 个随机数。为了确保程序正在运行，脚本会在每 1,000 个数后显示一条状态消息：\n\n```javascript\nif (i % 1000\
  \ == 0)\n    document.write(\"Generated \" + i + \" numbers...<br/>\");\n```\n\n\
  脚本的最后部分将通过将 `total` 除以 5,000 计算平均值。你的脚本还可以将平均值舍入到三小数：\n\n```javascript\naverage\
  \ = total / 5000;\naverage = Math.round(average * 1000) / 1000;\ndocument.write(\"\
  <h2>Average of 5000 numbers: \" + average + \"</h2>\");\n```\n\n要测试此脚本并查看这些数字到底有多随机，可以将完整脚本与\
  \ HTML 文档和 `<script>` 标签结合。列表 17.7 显示了完整的随机数测试脚本。\n\n列表 17.7 测试 JavaScript 随机数函数的脚本\n\
  \n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"\
  -//W3C//DTD XHTML 1.0//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\">\n<html\
  \ lang=\"en\">\n<head>\n<title>Math Example</title>\n</head>\n<body>\n  <h1>Math\
  \ Example</h1>\n  <p>How random are JavaScript's random numbers? Let's generate\
  \ 5000 of them and find out.</p>\n  <script type=\"text/javascript\">\n    total\
  \ = 0;\n    for (i=1; i<=5000; i++) {\n      num = Math.random();\n      total +=\
  \ num;\n      if (i % 1000 == 0)\n        document.write(\"Generated \" + i + \"\
  \ numbers...<br/>\");\n    }\n    average = total / 5000;\n    average = Math.round(average\
  \ * 1000) / 1000;\n    document.write(\"<h2>Average of 5000 numbers: \" + average\
  \ + \"</h2>\");\n  </script>\n</body>\n</html>\n```\n\n***\n\n要测试此脚本并查看这些数字到底有多随机，可以将完整脚本与\
  \ HTML 文档和 `<script>` 标签结合。稍短后你将看到结果，如图 17.3 所示。\n\n**图 17.3** 运行中的示例结果。\n\n![image](img/17fig03.jpg)\n\
  \n***\n\n注意：\n在这里使用的平均值被称为*算术平均值*。这种平均值并不是测试随机性的完美方法。实际上，它测试的是 `.5` 之上的分布。例如，如果结果是\
  \ 2,500 个 `.4` 和 2,500 个 `.6`，平均值将是 `.5`——但它们并不随机。（幸运的是，JavaScript 的随机数没有这个问题。）\n\
  \n***\n\n## 使用 with 关键字\n\n`with` 关键字是一个你之前没见过的。你可以用它让 JavaScript 编程变得更容易——或者至少更容易输入。\n\
  \n`with` 关键字指定一个对象，后面跟着大括号括起来语句块。对于块中的每个语句，你提到的任何未指定对象的属性假设属于该对象。\n\n例如，假设你有一个名为\
  \ `lastname` 的字符串。你可以使用 `with` 对其进行字符串操作，而无需每次指定字符串的名字：\n\n```javascript\nwith (lastname)\
  \ {\n    window.alert(\"length of last name: \" + length);\n    capname = toUpperCase();\n\
  }\n```\n\n在这个示例中，`length` 属性和 `toUpperCase` 方法指向 `lastname` 字符串，尽管它只通过 `with` 关键字指定了一次。\n\
  \n显然，在这些情况下 `with` 关键字只节省了一些输入工作。但是，当你整个整个过程中处理 DOM 对象，或者当你反复使用内置对象（例如 `Math` 对象）时，可能会发现它更有用。\n\
  \n## 与日期工作\n\n`Date` 对象是一个内置的 JavaScript 对象，它让你方便地处理日期和时间。当你需要存储日期时，可以创建 `Date`\
  \ 对象，并使用 `Date` 对象的方法来处理该日期。\n\n\n\n\nJavaScript 日期存储为自 1970 年 1 月 1 日午夜以来的毫秒数。该日期被称为\
  \ `epoch`（纪元时间）。早期版本不允许使用 1970 年之前的日期，但现在用负数来表示。\n\n***\n\n你在第 4 章“理解 JavaScript”中的时间/日期脚本中，遇到过一个\
  \ `Date` 对象的示例。`Date` 对象没有属性。要设置或从 `Date` 对象获取值，你必须使用下一节中描述的方法。\n\n### 创建 `Date`\
  \ 对象\n\n你可以使用 `new` 关键字创建一个 `Date` 对象。在创建时，你还可以可选地指定要存储在对象中的日期。你可以使用以下任何格式：\n\n\
  ```javascript\nbirthday = new Date();\nbirthday = new Date(\"November 1, 2010 08:00:00\"\
  );\nbirthday = new Date(11,1, 2010);\nbirthday = new Date(11,1,2010, 8, 0, 0);\n\
  ```\n\n你可以根据想要设置的值选择这些格式中的任何一种。如果你不使用任何参数（如第一个示例所示），对象中将存储当前日期。然后你可以使用下一节中描述的 `set`\
  \ 方法来设置值。\n\n### 设置 `Date` 值\n\n多种 `set` 方法允许你将 `Date` 对象的组件设置为特定值：\n\n- `setDate()`\
  \ 设置月份中的某一天。\n- `setMonth()` 设置月份。JavaScript 的月份从 0 到 11 计数，从一月开始（`0`）。\n- `setFullYear()`\
  \ 设置年份。\n- `setTime()` 通过指定自 1970 年 1 月 1 日以来的毫秒数来设置时间（以及日期）。\n- `setHours()`、`setMinutes()`\
  \ 和 `setSeconds()` 设置时间。\n\n例如，以下语句将名为 `holiday` 的 `Date`对象的年份设置为 2010：\n\n```javascript\n\
  holiday.setFullYear(2010);\n```\n\n### 读取 `Date` 值\n\n你可以使用 `get` 方法从 `Date` 对象中获取值。这是获取这些值的唯一方法，因为它们无法作为属性使用。以下是用于日期的\
  \ `get` 方法：\n\n- `getDate()` 获取月份中的某一天。\n- `getMonth()` 获取月份。\n- `getFullYear()`\
  \ 获取年份。\n- `getTime()` 获取自 1970 年 1 月 1 日以来的毫秒数作为时间（以及日期）。\n- `getHours()`、`getMinutes()`、`getSeconds()`\
  \ 和 `getMilliseconds()` 获取时间的组件。\n\n***\n\n#### 注意\n\n除了需要四位年份的 `setFullYear` 和\
  \ `getFullYear` 之外，JavaScript 还包含了 `setYear` 和 `getYear` 方法，它们使用两位数的年份值。你应该始终使用四位数的版本，以避免**2000\
  \ 年问题**。\n\n***\n\n### 处理时区\n\n最后，有几个函数可以帮助你的 `Date` 对象与本地时间值和时区配合：\n\n- `getTimeZoneOffset()`\
  \ 函数提供本地时区相对于 UTC（协调世界时，基于旧的格林尼治标准时间标准）的偏移量。在这种情况下，*本地*指的是浏览器所在地。（当然，这只有在用户准确设置了系统时钟的情况下才有效。）\n\
  - `toUTCString()` 函数将 `date` 对象的时间值转换为使用 UTC 的文本。该方法在 JavaScript 1.2 中引入，以取代 `toGMTString`\
  \ 方法，后者仍然可用但应尽量避免。\n- `toLocalString()` 函数将 `date` 对象的时间值转换为使用本地时间的文本。\n\n除了这些基础函数外，JavaScript\
  \ 1.2 及更高版本还包含了之前描述的几个函数的 UTC 版本。这些与普通命令相同，但使用的是 UTC 而不是本地时间：\n\n- `getUTCDate()`\
  \ 函数获取 UTC 时间的月份中的某一天。\n- `getUTCDay()` 函数获取 UTC 时间的星期几。\n- `getUTCFullYear()` 函数获取\
  \ UTC 时间的四位年份。\n- `getUTCMonth()` 函数返回 UTC 时间的月份。\n- `getUTCHours()`、`getUTCMinutes()`、`getUTCSeconds()`\
  \ 和 `getUTCMilliseconds()` 返回 UTC 时间的组件。\n- `setUTCDate()`、`setUTCFullYear()`、`setUTCMonth()`、`setUTCHours()`、`setUTCMinutes()`、`setUTCSeconds()`\
  \ 和 `setUTCMilliseconds()` 设置 UTC 时间。\n\n### 在日期格式之间转换\n\n`Date` 对象的两个特殊方法允许你在日期格式之间进行转换。你不是在你创建的\
  \ `Date` 对象使用这些方法，而是对内置对象 `Date` 本身使用。它们包括：\n\n- `Date.parse()` 方法将日期字符串（例如 `November\
  \ 1, 2010`）转换为 `Date` 对象（自 1970/1/1 以来的毫秒数）。\n- `Date.UTC()` 方法则相反。它将 `Date` 对象的值（毫秒数）转换为\
  \ UTC (GMT) 时间。\n\n## 总结\n\n在本章中，你学习了 JavaScript 的几个重要特性。首先，你学习了如何使用函数来对 JavaScript\
  \ 语句进行分组以及如何调用它们。\n\n\n\n2. a. `this` 关键字指向当前对象。\n\n3. b. `Math` 对象是静态的；你不能创建一个\
  \ `Math` 对象。\n\n4. a. 日期被存储为自 1970 年 1 月 1 日以来的毫秒数。\n\n5. c. JavaScript 的随机数位于 `0`\
  \ 和 `1` 之间。\n\n### 练习题\n\n- 修改 `Greet` 函数，使其接受两个参数 `who1` 和 `who2`，并在单个问候框中包含这两个名字。修改列表\
  \ 17.2 以使用单个函数调用来调用新函数。\n- 修改 `Card` 对象的定义，添加一个名为 `email` 的属性用于存储此人的电子邮件地址。修改列表\
  \ 17.5 中的 `PrintCard` 函数以包含该属性。\n- 修改列表 17.7 中的随机数脚本，使其运行三次，计算总计 15,000 个随机数，并为每组\
  \ 5,000 个数显示单独的合计。（你需要使用另一个包裹了大部分脚本的 `for` 循环。）\n\n## 第 18 章：使用条件和循环控制流程\n\n**在本章中你将学习：**\n\
  \n- 如何使用 `if` 语句测试变量\n- 如何使用各种运算符来比较值\n- 如何使用逻辑运算符组合条件\n- 如何使用 `else` 使用备选条件\n-\
  \ 如何使用条件运算符创建表达式\n- 如何测试多个条件\n- 如何使用 `for` 循环执行重复语句\n- 如何使用 `while` 进行另一种类型的循环\n\
  - 如何使用 `do...while` 循环\n- 如何创建无限循环（以及为什么你不应该这样做）\n- 如何跳出循环和继续循环\n- 如何遍历数组的属性\n\n\
  JavaScript 程序中的语句通常按照它们出现的顺序执行执行，一个接一个地执行。由于这种方式并不总是切实际的，大多数编程语言都提供了流程控制语句，允许你控制代码执行的顺序。你在上一章中学习过的函数就是流程控制的一种类型——尽管函数可能在代码的最开始定义，但它的语句可以在脚本的任何地方执行。\n\
  \n在本章中，你将学习 JavaScript 中另外两种类型的流程控制：*条件*（conditions），它允许根据值选择不同的选项；以及*循环*（loops），它允许重复语句。\n\
  \n### `if` 语句\n\n计算机语言最重要的功能之一是测试和比较值的能力。这允许你的脚本根据变量的值或用户的输入表现出不同的行为。\n\n`if` 语句是\
  \ JavaScript 中主要的条件语句。该语句在 JavaScript 中的含义与英语中非常相似——例如，这里有一个典型的英语条件语句：\n\n*如果电话响了，就接电话。*\n\
  \n该语句由两部分组成：一个条件（*如果电话响了*）和一个动作（*接电话*）。JavaScript 中的 `if` 语句工作方式非常相似。这是一个基础 `if`\
  \ 语句的示例：\n\n```\nif (a == 1) window.alert(\"Found a 1!\");\n```\n\n该语句包含一个条件（如果\
  \ `a` 等于 `1`）和一个动作（显示消息）。该语句检查变量 `a`，如果它的值为 `1`，则显示警报消息。否则，它什么都不做。\n\n如果你像上例那样使用\
  \ `if` 语句，可以使用单个语句作为动作。你也可以通过将多个语句封装在大括号 `{}` 中来使用多个语句作为动作，如下：\n\n```\nif (a ==\
  \ 1) {\n    window.alert(\"Found a 1!\");\n    a = 0;\n}\n```\n\n这段语句块再次检查变量 `a`。如果发现值为\
  \ `1`，它会显示消息并将 `a` 设回 `0`。\n\n#### 条件运算符\n\n`if` 语句的动作部分可以包含你已经学过的任何 JavaScript\
  \ 语句（以及任何其他的），但语句的条件部分使用它自己的语法。这被称为*条件表达式*（conditional expression）。\n\n> **注意**\n\
  > 条件表达式的任意侧可以是变量、常量或表达式。你可以比较变量和值，也可以比较两个变量。（你可以比较两个常量，但通常没有必要。）\n\n一个条件表达式通常包含两个要比较的值（在前面的示例中，这两个值是\
  \ `a` 和 `1`）。这些值可以是变量、常量，甚至是它们自身的表达式。\n\n在两个要比较的值之间是一个*条件运算符*（conditional operator）。该运算符告诉\
  \ JavaScript 如何比较这两个值。例如，`==` 运算符用于测试两个值是否相等：\n\n- `==`—等于\n- `!=`—不等于\n- `<`—小于\n\
  - `>`—大于\n- `>=`—大于或等于\n- `<=`—小于或等于\n\n> **注意**\n> 务必不要混淆等等运算符 (`==`) 和赋值运算符 (`=`)。记住在赋值时使用\
  \ `=`，在比较时使用 `==`。\n\n#### 使用逻辑运算符组合条件\n\n通常，你可能想要检查多个一个值。JavaScript 包含了*逻辑运算符*（logical\
  \ operators），也称为布尔运算符，用于此目的。例如，以下两个语句使用了相同的动作：\n\n```\nif (phone == \"\") window.alert(\"\
  error!\");\n```\n\n```\nif (email == \"\") window.alert(\"error!\");\n```\n\n使用逻辑运算符，可以将它们合并为单个语句：\n\
  \n```\nif (phone == \"\" || email == \"\") alert(\"Something's Missing!\");\n```\n\
  \n该语句使用了逻辑或运算符 (`||`)。另一个逻辑运算符是逻辑与运算符 `&&`。考虑这个语句：\n\n```\nif (phone == \"\" &&\
  \ email == \"\") alert(\"Both are Missing!\");\n```\n\n> **提示**\n> 如果 JavaScript\
  \ 解释器在到达末尾之前发现了条件条件的答案，它就不会再评估剩余部分。你可以利用这一点提高脚本速度。\n\n该语句使用 `&&`，所以只有当电子邮件地址和电话号码变量为空时，才会显示错误消息。（在特定情况下，或是更好的选择。）\n\
  \n第三个逻辑运算符是感叹号 (`!`)，它表示“非”（Not）。它可以用于反转表达式——换句话说，真的表达式会变成假的，假的表达式会变成真的。例如，这里有一个使用“非”运算符的语句：\n\
  \n```\nif (!(phone == \"\")) alert(\"phone is OK\");\n```\n\n在该语句中，`!`（非）运算符反转了条件，因此\
  \ `if` 语句的动作只有在电话号码变量不时不才会执行。额外的括号是必要的，因为所有的 JavaScript 条件都必须放在括号中。你也可以使用 `!=`（不等于）运算符来简化这个语句：\n\
  \n```\nif (phone != \"\") alert(\"phone is OK\");\n```\n\n> **提示**\n> 逻辑运算符非常强大，但你很容易用它们在无意中创建一个无法满足的条件。例如，条件\
  \ `((a < 10) && (a > 20))` 看起来可能是正确的。然而，如果你大声读出它，得到的是“如果 `a` 小于 10 且 `a` 大于 20”——这在我们的宇宙中是不可能的。在这种情况下，应该使用或\
  \ (`||`)。\n\n与上一个语句一样，这在电话字段不为空时会提醒你。\n\n#### `else` 关键字\n\n\n\n\n\n`if` 语句的额外功能是\
  \ `else` 关键字。与其英语中的对应词一样，`else` 告诉 JavaScript 解释器当条件不为真时该做什么。以下是 `else` 关键字用法的一个简单示例：\n\
  \n```\nif (a == 1) {\n    alert(\"Found a 1!\");\n    a = 0;\n} else {\n    alert(\"\
  Incorrect value: \" + a);\n}\n```\n\n这是上一个示例的修改版本。如果满足条件，它会显示一条消息并重置变量 `a`。如果条件不满足（如果\
  \ `a` 不等于 `1`），则显示不同的消息。\n\n***\n\n### 注意事项\n\n与 `if` 语句一样，`else` 后面可以跟一个操作语句，也可以跟一组用括号括起来的多个语句。\n\
  \n***\n\n### 使用简写条件表达式\n\n除了 `if` 语句外，JavaScript 还提供了一种简写类型的条件表达式，你可以用它来快速决策。这种表达式使用在其他语言（如\
  \ C）中也能看到的特殊语法。条件表达式看起来如下：\n\n`variable = (condition) ? (true action) : (false action);`\n\
  \n这为 `variable` 赋值两个值之一：如果条件为真，则赋值一个；如果为假，则赋值另一个。这是一个条件表达式的示例：\n\n`value = (a ==\
  \ 1) ? 1 : 0;`\n\n这个语句看起来可能很混乱，但它等同于以下 `if` 语句：\n\n```\nif (a == 1) {\n    value\
  \ = 1;\n} else {\n    value = 0;\n}\n```\n\n换句话说，如果条件为真，将使用问号（`?`）后面的值；如果条件为假，将使用冒号（`:`）后面的值。冒号代表该语句的\
  \ `else` 部分，并且和 `if` 语句的 `else` 部分一样，它是可选的。\n\n这些简写表达式可以用任何 JavaScript 期望值的地方。它们提供了一种对值进行简单决策的简方法。例如，这里有一种显示关于变量的语法正确消息的简单方法：\n\
  \n```\ndocument.write(\"Found \" + counter + ((counter == 1) ? \" word.\" : \" words.\"\
  ));\n```\n\n如果变量 `counter` 的值为 `1`，它将打印消息 `Found 1 word`；如果其值为 `2` 或更大，则打印 `Found\
  \ 2 words`。这是条件表达式最常见的用途之一。\n\n### 使用 `if` 和 `else` 测试多个条件\n\n你现在可以使用 `if` 和 `else`\
  \ 创建一个示例脚本。在第 4 章“理解 JavaScript”中，你创建了一个显示当前日期时间的简单脚本。这个示例将使用条件来显示取决于时间的问候语：“早上好”、“下午好”、“晚上好”或“你好”。为了实现这一点，你可以使用多个\
  \ `if` 语句的组合：\n\n```\nif (hours < 10) {\n    document.write(\"Good morning.\");\n\
  } else if (hours >= 14 && hours <= 17) {\n    document.write(\"Good afternoon.\"\
  );\n} else if (hours >= 17) {\n    document.write(\"Good evening.\");\n} else {\n\
  \    document.write(\"Good day.\");\n}\n```\n\n第一条语句检查 `hours` 变量的值是否小于 10——也就是说，它检查当前时间是否在上午\
  \ 10:00 之前。如果是，它显示问候语“Good morning”。\n\n第二条语句检查时间是否在下午 2:00 到下午 5:00 之间，如果是，则显示“Good\
  \ afternoon”。这条语句使用 `else if` 表示只有在在前一个条件失败时才会测试此条件——如果是在早上，就没有需要检查是否是下午。同样，第三条语句检查下午\
  \ 5:00 之后的时间，并显示“Good evening”。\n\n最后一条语句使用简单的 `else`，意味着如果之前的没有任何条件都不匹配，则将执行它。这涵盖了上午\
  \ 10:00 到下午 2:00 之间的时间（其他语句忽略了这段时间），并显示“Good day”。\n\n#### HTML 文件\n\n要在浏览器中尝试此示例，你需要一个\
  \ HTML 文件。我们将 JavaScript 代码分开存放，因此列表 18.1 是完整的 HTML 文件。将其保存为 `timegreet.html`，但在你在下一节准备好\
  \ JavaScript 文件之前，不要将其加载到浏览器中。\n\n列表 18.1 用于时间和问候示例的 HTML 文件\n\n***\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n    <title>Time Greet</title>\n\
  </head>\n<body>\n    <h1>Current Date and Time</h1>\n    <script type=\"text/javascript\"\
  \ src=\"timegreet.js\"></script>\n</body>\n</html>\n```\n\n***\n\n#### JavaScript\
  \ 文件\n\n列表 18.2 显示了 JavaScript 文件。它使用内置的 `Date` 对象获取当前日期并将其存储在 `hours`、`mins` 和\
  \ `secs` 变量中。\n\n```javascript\n// 获取日期\nnow = new Date();\n// 分解为小时、分、秒\nhours\
  \ = now.getHours();\nmins = now.getMinutes();\nsecs = now.getSeconds();\n\n// 显示时间\n\
  document.write(\"<h2>\");\ndocument.write(hours + \":\" + mins);\ndocument.write(\"\
  </h2>\");\n\n// 显示问候\ndocument.write(\"<p>\");\nif (hours < 10) {\n    document.write(\"\
  Good morning.\");\n} else if (hours >= 14 && hours <= 17) {\n    document.write(\"\
  Good afternoon.\");\n} else if (hours >= 17) {\n    document.write(\"Good evening.\"\
  );\n} else {\n    document.write(\"Good day.\");\n}\ndocument.write(\"</p>\");\n\
  ```\n\n要尝试此示例，将此文件保存为 `timegreet.js`，然后将 `timegreet.html` 加载到浏览器。图 18.1 显示了脚本的结果。\n\
  \n### 使用 `switch` 处理多个条件\n\n在上一个示例中，你使用了多个 `if` 语句来测试不同的条件。这是该技术的另一个示例：\n\n```\n\
  if (button==\"next\") {\n    window.location=\"next.html\";\n} else if (button==\"\
  previous\") {\n    window.location=\"prev.html\";\n} else if (button==\"home\")\
  \ {\n    window.location=\"home.html\";\n} else if (button==\"back\") {\n    window.location=\"\
  menu.html\";\n}\n```\n\n虽然这是一种紧凑的方法，但如果每个 `if` 语句都有自己的代码块，这种方法可能会变得杂乱。作为替代方案，JavaScript\
  \ 包含了 `switch` 语句，允许你将对同一个变量的多次测试合并到一个语句块中。以下是将示例转换为 `switch` 的形式：\n\n```javascript\n\
  switch(button) {\n    case \"next\":\n        window.location=\"next.html\";\n \
  \       break;\n    case \"previous\":\n        window.location=\"prev.html\";\n\
  \        break;\n    case \"home\":\n        window.location=\"home.html\";\n  \
  \      break;\n    case \"back\":\n        window.location=\"menu.html\";\n    \
  \    break;\n    default:\n        window.alert(\"Wrong button.\");\n}\n```\n\n\
  `switch` 语句有几个组件：\n\n- 初始 `switch` 语句。该语句在括号中包含要测试的值（在本例中为 `button`）。\n- 大括号（`{`\
  \ 和 `}`）括起 `switch` 语句的内容，类似于函数或 `if` 语句。\n- 一个或多个 `case` 语句。这些语句中的每一个都指定了一个与 `switch`\
  \ 语句中指定的值进行比较的值。如果值匹配，则执行 `case` 语句后的语句。否则，则尝试下一个 `case`。\n- `break` 语句用于结束每个 `case`。它将跳到\
  \ `switch` 的结束。如果不包含 `break`，可能会执行多个 case 的语句，无论它们是否匹配。\n- `default` 语句（可选）在没有任何\
  \ `case` 语句都不匹配时执行。\n\n\n\n\n• 可选，可以包含 `default` 情况，其后跟着一个或多个语句，如果未匹配到其他情况，则将执行这些语句。\n\
  \n***\n\n注意\n\n你可以在 `switch` 结构内部的每个 `case` 语句之后使用多个语句。你不需要将它们括在大括号中。如果 case 匹配成功，JavaScript\
  \ 解释器将执行语句，直到遇到 `break` 或下一个 `case`。\n\n### 使用 `for` 循环\n\n`for` 关键字是创建循环时首要考虑的工具，就像你在上一章章节的随机数示例中看到的那样。`for`\
  \ 循环通常使用一个变量（称为 `counter` 或 `index`）来跟踪循环执行的次数，并在计数器达到某个数字时停止。一个基础的 `for` 语句如下：\n\
  \n```\nfor (var = 1; var < 10; var++) { // 更多代码 }\n```\n\n`for` 循环有三个参数，用分号隔开：\n\
  \n• 第一个参数（示例中的 `var = 1`）指定一个变量并为其分配一个初始值。这被称为 `initial expression`（初始表达式），因为它为循环设置了初始状态。\n\
  \n• 第二个参数（示例中的 `var < 10`）是一个必须保持为真的条件，以便循环运行。这被称为循环的 `condition`（条件）。\n\n• 第三个参数（示例中的\
  \ `var++`）是一个在循环每次迭代时执行的语句。这被称为 `increment expression`（递增表达式），因为它通常用于递增计数器。递增表达式在每次循环迭代结束时执行。\n\
  \n指定了三个参数后，使用左大括号（`{`）表示块的开始。在块结束时使用右大括号（`}`）。括号之间的所有语句将在循环的每次迭代时执行。\n\n`for` 循环的参数听起来可能有点困惑，但在你习惯之后，你会频繁使用\
  \ `for` 循环。这里有一个此类循环的简单示例：\n\n```\nfor (i=0; i<10; i++) {\n    document.write(\"\
  This is line \" + i + \"<br />\");\n}\n```\n\n这些语句定义了一个使用变量 `i` 的循环，将其初始化为零，并且只要\
  \ `i` 的值小于 10 就会循环。递增表达式 `i++` 在每次循环迭代时将 `i` 的值加 1。由于这发生在循环结束时，因此输出将列出从零到九的数字。\n\
  \n当循环在大括号之间只包含单个语句时（如示例所示），如果你愿意，可以省略括号。以下语句定义了没有大括号的相同循环：\n\n```\nfor (i=0; i<10;\
  \ i++)\n    document.write(\"This is line \" + i + \"<br />\");\n```\n\n***\n\n\
  提示\n\n无论循环包含一个语句还是多个语句，使用大括号是一种良好的代码风格。这有利于以后向循环中添加语句，而不会引起语法错误。\n\n***\n\n此示例中的循环包含一个会被反复执行的\
  \ `document.write` 语句。要查看此循环的具体作用，你可以将其添加到 HTML 文档的 `<script>` 部分，如 列表 18.3 所示。\n\
  \n列表 18.3 使用 `for` 关键字的循环\n\n***\n\n```xml\n<?xml=\"1.0\" encoding=\"UTF-8\"?>\n\
  <!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Using a for Loop</title>\n  </head>\n  <body>\n    <h1>Using a for Loop</h1>\n\
  \    <p>The following is the output of the <strong>for</strong> loop:</p>\n    <script\
  \ type=\"text/javascript\">\n    for (i=1;i<10;i++) {\n        document.write(\"\
  This is line \" + i + \"<br />\");\n    }\n    </script>\n  </body>\n</html>\n```\n\
  \n***\n\n此示例在每次迭代期间都会显示一条带有循环计数器的消息。 列表 18.3 的输出显示在 图 18.2 中。\n\n**图 18.2** `for`\
  \ 循环示例的结果。\n\n![image](img/18fig02.jpg)\n\n注意循环只执行了九次。这是因为条件是 `i<10`。当计数器（`i`）增加到\
  \ `10` 时，该表达式不再为真。如果你需要循环数到 `10`，可以更改条件；`i<=10` 或 `i<11` 都可以。\n\n此示例中的循环包含一个会被反复执行的\
  \ `document.write` 语句。要查看此循环的具体作用，你可以将其添加到 HTML 文档的 `<script>` 部分，如 列表 18.3 所示。\n\
  \n列表 18.3 使用 `for` 关键字的循环\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Using a for Loop</title>\n  </head>\n  <body>\n    <h1>Using a for Loop</h1>\n\
  \    <p>The following is the output of the <strong>for</strong> loop:</p>\n    <script\
  \ type=\"text/javascript\">\n    for (i=1;i<10;i++) {\n        document.write(\"\
  This is line \" + i + \"<br />\");\n    }\n    </script>\n  </body>\n</html>\n```\n\
  \n***\n\n此示例在每次迭代期间都会显示一条带有循环计数器的消息。 列表 18.3 的输出显示在 图 18.2 中。\n\n**图 18.2** `for`\
  \ 循环示例的结果。\n\n![image](img/18fig02.jpg)\n\n注意循环只执行了九次。这是因为条件是 `i<10`。当计数器（`i`）增加到\
  \ `10` 时，该表达式不再为真。如果你需要循环数到 `10`，可以更改条件；`i<=10` 或 `i<11` 都可以。\n\n\n\n\n取决于所使用的浏览器版本，无限循环甚至可能导致浏览器停止响应用户的请求。请务必为无限循环提供一条退出路径，并在测试之前保存你的脚本，以防万一。\n\
  \n* *\n\n有时，你可能刻意创建一个无限循环。这可能包括你希望程序一直运行，直到用户停止它的情况，或者你正在通过下一节将介绍的 `break` 语句提供退出路径。这里是创建无限循环的一种简单方法：\n\
  \n```javascript\nwhile (true) {\n```\n\n由于值 `true` 是条件条件，此循环将始终发现其条件为 `true`。\n\n\
  #### 退出循环\n\n跳出无限循环有一种方法。你可以在循环期间使用 `break` 语句来立即退出循环，并继续执行循环后的第一个语句。这里有一个使用 `break`\
  \ 的简单示例：\n\n```javascript\nwhile (true) {\n    n++;\n    if (values[n] == 1) break;\n\
  }\n```\n\n尽管 `while` 语句被设置为了无限循环，但 `if` 语句会检查数组对应的值。如果发现某个值为 `1`，它就会退出循环。\n\n当 JavaScript\
  \ 解释器遇到 `break` 语句时，它会跳过循环的剩余部分，并从循环结束右括号后的第一个语句继续执行脚本。你可以在任何类型的循环（无论是否是循环）中使用 `break`\
  \ 语句。这为发生错误或满足另一个条件时提供了一种简单的退出方法。\n\n#### 继续循环\n\n还有另一个语句可以帮助你控制循环中语句的执行。`continue`\
  \ 语句会跳过循环的剩余部分，但与 `break` 不同，它会继续循环的下次迭代。这里有一个简单的示例：\n\n```javascript\nfor (i=1;\
  \ i<21; i++) {\n    if (score[i]==0) continue;\n    document.write(\"Student number\
  \ \",i, \" Score: \", score[i], \"\\n\");\n}\n```\n\n此脚本使用 `for` 循环来打印存储在 `score`\
  \ 数组中的 20 个学生的成绩。`if` 语句用于检查分值为 `0` 的成绩。脚本假设分 `0` 表示学生没有参加考试，因此它会继续循环而不打印该分数。\n\n\
  #### 遍历对象属性\n\nJavaScript 中还有另一种类型的循环。`for...in` 循环不像普通的 `for` 或 `while` 循环那样灵活。相反，它专门设计用于对对象的每个属性执行操作。\n\
  \n例如，`navigator` 对象包含了描述用户浏览器的属性。你可以使用 `for...in` 来显示此对象的属性：\n\n```javascript\n\
  for (i in navigator) {\n    document.write(\"property: \" + i);\n    document.write(\"\
  \ value: \" + navigator[i] + \"<br>\");\n}\n```\n\n像普通的 `for` 循环一样，这种类型的循环使用索引变量（示例中的\
  \ `i`）。在循环的每次迭代中，该变量被设置为对象的下一个属性。当你需要检查或修改对象的每个属性时，这变得非常容易。\n\n* *\n\n#### 动手尝试：处理数组和循环\n\
  \n为了应用你对循环的知识，你现在将创建一个使用循环处理数组的脚本。在编写此脚本的过程中，尝试想象一下如果没有 JavaScript 的循环功能，将会有多困难。\n\
  \n这个简单的脚本将提示用户输入一系列名称。在输入所有名称后，它将以编号列表的形式显示名称。要开始脚本，初始化一些变量：\n\n```javascript\n\
  names = new Array();\ni = 0;\n```\n\n`names` 数组将存储用户输入的名称。你不知道会输入多少个名称，因此不需要为数组指定维度。`i`\
  \ 变量将在循环中作为计数器。\n\n接下来，使用 `prompt` 语句提示用户输入一系列名称。使用循环对每个名称重复提示。你希望用户至少输入一个名称，因此\
  \ `do` 循环是理想的：\n\n```javascript\ndo {\n    next = prompt(\"Enter the Next Name\"\
  , \"\");\n    if (next > \" \") names[i] = next;\n    i = i + 1;\n} while (next\
  \ > \" \");\n```\n\n此循环提示一个名为 `next` 的字符串。如果输入了名称且为空，它将被存储为 `names` 数组中的下一个条目。然后增加计数器\
  \ `i`。循环重复，直到用户不再输入名称或在提示对话框中点击“取消”。\n\n* *\n\n### 提示\n\n如果你感兴趣让你的脚本尽可能短，请记住你可以使用递增运算符\
  \ (`++`) 来将 `i = i + 1` 语句与上一个语句结合：`names[i++]=1`。\n\n* *\n\n接下来，你的脚本可以显示输入的名称数量：\n\
  \n```javascript\ndocument.write(\"<h2>\" + (names.length) + \" names entered.</h2>\"\
  );\n```\n\n此语句显示 `names` 数组的 `length` 属性，并用 2 级标题标签包围以强调。\n\n*(注：原文后续存在大量重复的段落，在翻译时已按要求进行处理)*\n\
  \n---### 列表 18.4 提示并显示名称的脚本 (HTML)\n\n```html\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n    <title>Loops\
  \ Example</title>\n</head>\n<body>\n    <h1>Loops Example</h1>\n    <p>Enter a series\
  \ of names, and I will display them in a numbered list.</p>\n    <script type=\"\
  text/javascript\" src=\"loops.js\"></script>\n</body>\n</html>\n```\n\n---### 列表\
  \ 18.5 提示并显示名称的脚本 (JavaScript)\n\n```javascript\n// 创建数组\nnames = new Array();\n\
  i = 0;\n\n// 循环并提示名称\ndo {\n    next = prompt(\"Enter the Next Name\", \"\");\n\
  \    if (next > \" \") names[i] = next;\n    i = i + 1;\n} while (next > \" \");\n\
  \ndocument.write(\"<h2>\" + (names.length) + \" names entered.</h2>\");\n\n// 显示所有名称\n\
  document.write(\"<ol>\");\nfor (i in names) {\n    document.write(\"<li>\" + names[i]\
  \ + \"</li>\");\n}\ndocument.write(\"</ol>\");\n```\n\n\n\n\n## Questions\n\n**A.**\
  \ JavaScript 解释器会尽力将值转换为通用格式并进行比较。在这种情况下，它会在比较之前先将它们都转换为字符串。在 JavaScript 1.3 及以后的版本中，你可以使用特殊的等等运算符\
  \ `===` 来比较两个值及其类型——使用此运算符时，只有当表达式具有相同的值*且*具有相同的数据类型时，该表达式结果才为真。\n\n**Q. 如果使用 `if`\
  \ 和 `else` 同样简单，我为什么还要用 `switch` 呢？**\n\n**A.** 两者都可以用，所以取决于你的选择。我个人而言，我觉得 `switch`\
  \ 语句很令人困惑，更倾向于使用 `if`。你的选择可能还取决于你熟悉的其他编程语言，因为某些语言支持 `switch`，而其他则不支持。\n\n**Q. 为什么当我不小心使用\
  \ `=` 而不是 `==` 时，我没有得到友好的错误提示？**\n\n**A.** 在某些情况下，这会导致错误。然而，错误的版本通常看起来是正确的语句。例如，在\
  \ `if (a=1)` 语句中，变量 `a` 将被赋值为 `1`。`if` 语句被认为是真的，而 `a` 的值丢失了。\n\n**Q. 似乎我可以用 `for`\
  \ 循环替换任何其他循环方法（`while`、`do` 等）。为什么有这么多选择？**\n\n**A.** 你得对。在大多数情况下，`for` 循环都是可行的，如果你愿意，可以用这种方式处理所有的循环。同样，你也可以用\
  \ `while` 来替换 `for` 循环。你可以使用任何对你的应用程序最有意义的循环方法。\n\n## Workshop\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n### Quiz\n\n**1.**** 下列运算符中哪个在 JavaScript 中表示“不等于”？\n\n**a.** `!`\n\n**b.** `!=`\n\
  \n**c.** `<>`\n\n**2.**** `switch` 语句的作用是什么？\n\n**a.** 测试一个变量的多个不同值\n\n**b.** 开启或关闭一个变量\n\
  \n**c.** 让普通的 `if` 语句变得更长且更困惑\n\n**3.**** 哪种 JavaScript 循环在循环的*结尾*检查条件？\n\n**a.**\
  \ `for`\n\n**b.** `while`\n\n**c.** `do...while`\n\n**4.**** 在循环内部，`break` 语句的作用是什么？\n\
  \n**a.** 导致浏览器崩溃\n\n**b.** 重新开始循环\n\n**c.** 完全退出循环\n\n**5.**** 语句 `while (3==3)`\
  \ 是哪种示例？\n\n**a.** 拼写错误\n\n**b.** 无限循环\n\n**c.** 非法的 JavaScript 语句\n\n### Answers\n\
  \n**1.** b. `!=` 运算符意味着*不等于*。\n\n**2.** a. `switch` 语句可以对同一个变量或表达式的多个不同值进行测试。\n\n\
  **3.** c. `do...while` 循环在循环末尾使用条件。\n\n**4.** c. `break` 语句退出循环。\n\n**5.** b. 因为条件\
  \ `(3==3)` 始终为真，此语句创建了一个无限循环。\n\n### Exercises\n\n• 修改 Listing 18.4，在显示名称之前按字母顺序进行排序。你可以使用\
  \ `Array` 对象的 `sort` 方法，该方法在第 16 章“使用 JavaScript 变量、字符串和数组”中有描述。\n\n• 修改 Listing\
  \ 18.4，提示恰好 10 个名称。如果你点击“取消”按钮而不是输入名称，会发生什么？\n\n## 第 19 章 响应事件\n\n* * *\n\n在本章中将学到：\n\
  \n• 事件处理器如何工作\n- 事件处理器与对象的关系\n- 如何创建事件处理器\n- 如何检测鼠标和键盘操作\n- 如何使用 `onclick` 改变 `<div>`\
  \ 的外观\n\n* * *\n\n在你目前为止的 JavaScript 经验中，你编写的大多数脚本都是平静、有序地执行的，从第一语句到最后一条。你在示例脚本中见过一些事件处理器，以将你的注意力放在编程的其他方面，你很可能根据常识跟上了这些操作。单此本身就说明了在\
  \ HTML 中使用 JavaScript 事件处理器是相对简单易用的。\n\n在本章中，你将学习使用 JavaScript 支持的各种事件处理器。使用事件处理器的脚本不是顺序执行的，而是可以直接与用户交互。在本书的其余部分，你编写几乎每个脚本都会用到事件处理器，事实上，它们可能会出现在你编写的大多数脚本中占据重要位置。\n\
  \n### 理解事件处理器\n\n正如你在第 14 章“初学 JavaScript”中学到的那样，JavaScript 程序并不按顺序执行。它们可以响应*事件*。\n\
  \n用于检测并响应事件的脚本被称为*事件处理器*。事件处理器是 JavaScript 最强大的功能之一。幸运的是，它们是最容易学习的功能之一。\n\n各种事件使你的脚本能够响应鼠标、键盘和其他情况。事件是使\
  \ Web 文交互的关键。\n\n对象\n\n正如你在第 15 章“对象模型 (DOM)”中学到的，JavaScript 使用一组对象来存储关于页面部分的信息——按钮、链接、图像、窗口等。一个事件通常发生在多个地方（例如，用户可以点击任何链接），因此每个事件与一个对象关联。\n\
  \n每个事件都有一个名称。例如，`mouseover` 事件在指针移过对象时发生。当指针移过特定链接时，`mouseover` 事件会被发送给该链接的事件处理器（如果有的话）。\n\
  \n要定义事件处理器，需要在事件名称的开头加上 `on`。例如，当鼠标移过链接时调用 `onmouseover` 事件处理器。你可以将其添加到特定链接的 `<a>`\
  \ HTML 标签中。\n\n* * *\n\n注意 `onmouseover` 关键字奇怪的大小写。这是事件处理器的标准写法。`on` 始终小写，事件名称中的每个单词大写开头。然而，为了符合\
  \ XHTML 标准，当你在代码中使用这些事件处理器时，必须全部使用小写字母。\n\n* * *\n\n#### 创建事件处理器\n\n你不需要 `<script>`\
  \ 标签来定义事件处理器。相反，你可以将事件处理器属性添加到单个 HTML 标签中。例如，这里有一个包含 `onmouseover` 事件处理器的链接：\n\n\
  ```html\n<a href=\"http://www.google.com/\"\n  onmouseover=\"alert('You moved over\
  \ the link.');\">\n这是一个链接。\n</a>\n```\n\n注意，这是一个完整的 `<a>` 标签，尽管它被分成了多行。这指定了一个作为该链接\
  \ `onmouseover` 事件处理器的语句。当鼠标移过链接时，该语句会显示一个警报消息。\n\n* * *\n\n注意，这里的示例使用单引号来包裹文本。这在事件处理器中是必要的，因为双引号被用于包裹事件处理器本身。（你也可以使用单引号来包裹事件处理器，并在脚本语句中使用双引号。）\n\
  \n\n\n\n\n你可以在事件处理程序中使用像前面那样的 JavaScript 语句，但如果你需要多条语句，使用函数会是一个更好的主意。只需在文档头部定义该函数，然后像下面这样调用该函数作为事件处理程序：\n\
  \n```html\n<a href=\"#bottom\" onmouseover=\"DoIt();\">将鼠标悬停在此链接上。</a>\n```\n\n\
  此示例在用户将鼠标移动到链接上时，会调用一个名为 `DoIt()` 的函数。使用函数非常方便，因为你可以使用更长、可读性更高的 JavaScript 程序的作为事件处理程序。\n\
  \n### 使用 JavaScript 定义事件处理程序\n\n与其在 HTML 文档中指定事件处理程序，你还可以使用 JavaScript 将函数赋值为事件处理程序。这允许你有条件地设置事件处理程序、开启或关闭它们，并动态更改处理事件的函数。\n\
  \n> 提示\n> 对于简单的事件处理程序，如果你用分号将它们分开，可以使用两条语句。然而，在大多数情况下，使用函数执行这些语句会更简单。\n\n要以这种方式定义事件处理程序，你首先定义一个函数，然后将该函数赋值为事件处理程序。事件处理程序存储为\
  \ `document` 对象或另一个可以接收事件对象的属性。例如，这些语句定义了一个名为 `mousealert` 的函数，然后将其赋值为文档的 `onMouseDown`\
  \ 事件处理程序：\n\n```javascript\nfunction mousealert() {\n    alert (\"你点击了鼠标！\");\n\
  }\n\ndocument.onmousedown = mousealert;\n```\n\n> 提示\n> 总体来说，以这种方式设置事件处理程序也是一种良好的做法：它允许你使用外部\
  \ JavaScript 文件来定义函数并设置事件，使 JavaScript 代码与 HTML 文件完全分离。\n\n你可以使用这种技术为任何 HTML 元素设置事件处理程序，但需要一个额外的步骤：你必须先找到与元素对应的对象。要做到这一点，请使用\
  \ `document.getElementById` 函数。首先，在 HTML 文档中定义一个元素并指定 `id` 属性：\n\n```html\n<a href=\"\
  http://www.google.com/\" id=\"link1\">\n```\n\n接下来，在 JavaScript 代码中找到该对象并应用事件处理程序：\n\
  \n```javascript\nobj = document.getElementById(\"link1\");\nobj.onclick = MyFunction;\n\
  ```\n\n只要你在 HTML 文件中用唯一的 `id` 属性定义了它，就可以对任何对象执行此操作。使用这种技术，你可以轻松地将同一个函数分配给多个对象的事件，而不会给你的\
  \ HTML 代码增加杂乱。\n\n### 支持多个事件处理程序\n\n如果你想在点击元素时发生多一件事怎么办？例如，假设你希望在点击按钮时，两个名为 `update`\
  \ 和 `display` 的函数都执行执行。你不能将两个函数赋值给 `onclick` 属性。一种解决方案是定义一个同时调用这两个函数的函数：\n\n```javascript\n\
  function UpdateDisplay() {\n    update();\n    display();\n}\n```\n\n这并不总是处理事情的理想方式。例如，如果你正在使用两个第三方脚本，并且它们都想向页面上添加一个\
  \ `onLoad` 事件，那么应该有一种方法同时添加这两者。W3C DOM 标准为此目的定义了一个函数 `addEventListener`。该函数为特定的事件和对象定义了一个*监听器*，你可以根据需要添加任意数量的监听器函数。\n\
  \n遗憾的是，Internet Explorer 不支持 `addEventListener`，因此在那个浏览器中必须使用另一个函数 `attachEvent`。请参阅第\
  \ 21 章，“使用非侵入式 JavaScript](#ch21.html_ch21)”，获取一个结合了两者用于跨浏览器事件添加脚本的函数。\n\n### 使用\
  \ `event` 对象\n\n当事件发生时，你可能需要更多关于该事件的信息——例如，对于键盘事件，你需要知道按了哪个键。DOM 包含一个提供此类信息的 `event`\
  \ 对象。\n\n要使用 `event` 对象，你可以将其将其传递给你的事件处理程序函数。例如，这条语句定义了一个 `onKeyPress` 事件，它将 `event`\
  \ 对象传递给一个函数：\n\n```html\n<body onkeypress=\"getkey(event);\">\n```\n\n然后，你可以定义你的函数来接受事件作为参数：\n\
  \n```javascript\nfunction getkey(e) {\n    ...\n}\n```\n\n在 Firefox、Safari、Opera\
  \ 和 Chrome 中，`event` 对象会自动传递给事件处理程序函数，因此即使你使用 JavaScript 而不是 HTML 来定义事件处理程序，这也能起作用。在\
  \ Internet Explorer 中，最近的事件存储在 `window.event` 对象中。之前的 HTML 示例将此对象传递给事件处理程序函数。如果你用\
  \ JavaScript 定义事件处理程序，这是可能的，因此你需要使用一些代码来找到正确的对象：\n\n```javascript\nfunction getkey(e)\
  \ {\n    if (!e) e=window.event;\n    ...\n}\n```\n\n这检查变量 `e` 是否已经定义。如果没有，它会获取\
  \ `window.event` 对象并将其存储在 `e` 中。这确保了你在任何浏览器中都有一个有效的 `event` 对象。\n\n遗憾的是，尽管 Internet\
  \ Explorer 和非 Internet Explorer 浏览器都支持 `event` 对象，但它们支持不同的属性。两个浏览器中相同的属性是 `event.type`，即事件类型。这仅仅是事件的名称，例如\
  \ `onMouseOver` 事件的 `mouseover` 以及 `onKeyPress` 事件的 `keypress`。接下来的章节列出了每个浏览器的一些额外有用属性。\n\
  \n#### Internet Explorer `event` 属性\n\n以下是 Internet Explorer 中 `event` 对象的一些常用属性：\n\
  \n- `event.button`——被点击的鼠标按钮。该值左键为 `1`，右键为 `2`。\n- `event.clientX`——事件发生的 x 坐标（像素）。\n\
  - `event.clientY`——事件发生的 y 坐标（像素）。\n- `event.altkey`——事件期间是否按了 Alt 键标志。\n- `event.ctrlkey`——事件期间是否按了\
  \ Ctrl 键标志。\n- `event.shiftkey`——事件期间是否按了 Shift 键标志。\n- `event.keyCode`——被按键的键码（Unicode）。\n\
  - `event.srcElement`——事件发生的对象。\n\n#### 非 Internet Explorer `event` 属性\n\n以下是非 Internet\
  \ Explorer 现代浏览器中 `event` 对象的一些常用属性：\n\n- `event.modifiers`——指示事件期间按下了哪些修饰键（Shift、Ctrl、Alt\
  \ 等）。该值是一个表示不同键的整数。\n- `event.pageX`——事件在页面内的 x 坐标。\n- `event.pageY`——事件在页面内的 y\
  \ 坐标。\n- `event.which`——键盘事件的键码（Unicode）或鼠标事件的被点击按钮（最好使用跨浏览器的 `button` 属性）。\n- `event.button`——被点击的鼠标按钮。它的工作方式与\
  \ Internet Explorer 类似，只是左键值为 `0`，右键值为 `2`。\n- `event.target`——事件发生的对象。\n\n> 注意\n\
  > `event.pageX` 和 `event.pageY` 属性基于事件发生元素的左上角，而不总是鼠标指针的精确位置。\n\n### 使用鼠标事件\n\n\
  DOM 包含了许多用于检测鼠标动作的事件处理程序。你的脚本可以检测鼠标指针的移动以及按钮的点击、释放或两者兼有。其中一些你可能已经熟悉，因为你在之前的章节中见过它们的运行效果。\n\
  \n> 提示\n> `onMouseOver` 和 `onMouseOut` 事件处理程序最常用的用途之一是创建*滚动效果*——当鼠标悬停在其上方时改变的图像。你将在本章后面学习如何创建它们。\n\
  \n#### Over 和 Out\n\n\n\n\n你已经见过第一个也是最常见的事件处理器 `onMouseOver`。当鼠标指针移动到链接或其他对象上时，就会调用此句柄程序。\n\
  \n`onMouseOut` 处理器则是相反的——当鼠标指针移出对象的边界时，它会被调用。除非发生某些异常，否则这总会在 `onMouseOver` 事件被调用后的某个时间发生。\n\
  \n### 注意\n在这种情况下，对象可以是一个链接，也可以是一个表单元素。你将在第 26 章 中的“处理基于 Web 的表单”中学习更多关于表单的知识。\n\n\
  如果你的脚本在指针移动到对象上时发生了更改，那么此处理器就特别有用——例如在状态栏中显示消息或更改图像。你可以使用 `onMouseOut` 处理器在指针移开时撤销该操作。\n\
  \n### 起起、落下（以及点击）\n\n你还可以使用事件来检测鼠标按钮何时被点击。此操作的事件事件处理器是 `onClick`。当在相应的对象上点击鼠标按钮时，就会调用此事件句柄程序。\n\
  \n例如，你可以使用以下事件处理器在链接被点击时显示警报：\n\n```html\n<a href=\"http://www.google.com/\"\n \
  \   onclick=\"alert('You are about to leave this site.');\">\n    Go Away\n</a>\n\
  ```\n\n在这种情况下，`onClick` 事件处理器会在链接的页面加载到浏览器之前运行。这对于为链接设置条件，或在启动链接页面之前显示免责声明非常有用。\n\
  \n如果你的 `onClick` 事件处理器返回 `false` 值，则将不会跳转到该链接。例如，下面的代码是一个显示确认对话框的链接。如果你点击“取消”，则不会跟随链接；如果你点击“确定”，则会加载新页面：\n\
  \n```html\n<a href=\"http://www.google.com/\"\n    onclick=\"return(window.confirm('Are\
  \ you sure?'));\">\n    Go Away\n</a>\n```\n\n此示例使用 `return` 语句来包裹事件处理器。这确保了当用户点击“取消”时返回的\
  \ `false` 值会从事件处理器中返回，从而防止链接被跟随。\n\n`onDblClick` 事件处理器与之类似，但仅在用户双击对象时使用。由于链接通常只需要点击一次，你可以利用它根据点击次数让链接执行两件不同的事情。（不用说，这可能会引起困惑）。你也可以检测对图像和其他对象的双击。\n\
  \n为了让你对按下鼠标按钮时发生的情况有更强的控制力，还包含了另外两个事件：\n\n- `onMouseDown` 用于用户按下鼠标按钮时。\n- `onMouseUp`\
  \ 用于用户松开鼠标按钮时。\n\n这两个事件是鼠标点击动作的两个半部分。如果你想检测整个点击过程，请使用 `onClick`。使用 `onMouseUp` 和\
  \ `onMouseDown` 仅检测其中之一。\n\n要检测按下的是哪个鼠标按钮，你可以使用 `event` 对象的 `button` 属性。该属性对左键赋值为\
  \ `0` 或 `1`，对右键赋值为 `2`。该属性被分配给 `onClick`、`onDblClick`、`onMouseUp` 和 `onMouseDown`\
  \ 事件。\n\n### 注意\n浏览器通常不会检测右鼠标按钮的 `onClick` 或 `onDblClick` 事件。如果你想检测右键，`onMouseDown`\
  \ 是最可靠的方法。\n\n作为这些事件处理器的示例，你可以创建一个脚本来显示关于鼠标按钮事件的信息并确定按下的是哪个按钮。列表 19.1 显示了鼠标事件脚本。\n\
  \n列表 19.1 用于鼠标点击示例的 JavaScript 文件\n\n```javascript\nfunction mousestatus(e) {\n\
  \    if (!e) e = window.event;\n    btn = e.button;\n    whichone = (btn < 2) ?\
  \ \"Left\" : \"Right\";\n    message=e.type + \" : \" + whichone + \"\\n\";\n  \
  \  document.form1.info.value += message;\n}\n\nobj=document.getElementById(\"testlink\"\
  );\nobj.onmousedown = mousestatus;\nobj.onmouseup = mousestatus;\nobj.onclick =\
  \ mousestatus;\nobj.ondblclick = mousestatus;\n```\n\n此脚本包含一个检测鼠标事件的函数 `mousestatus`。该函数使用\
  \ `event` 对象的 `button` 属性来确定按下的是哪个按钮。它还使用 `type` 属性来显示事件类型，因为该函数将用于处理多种事件类型。\n\n\
  在函数之后，脚本找到具有 `id` 属性 `testlink` 的链接对象，并将它的 `onmousedown`、`onmouseup`、`onclick` 和\
  \ `ondblclick` 事件分配给 `mousestatus` 函数。\n\n将此脚本保存为 `click.js`。接下来你需要一个 HTML 文档来配合脚本工作，如列表\
  \ 19.2 所示。\n\n列表 19.2 用于鼠标点击的 HTML 文件\n\n```html\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\"\
  >\n<html lang=\"en\">\n<head>\n<title>Mouse Click</title>\n</head>\n<body>\n<h1>Mouse\
  \ Click</h1>\n<p>Click the link below.</p>\n<a href=\"#\" id=\"testlink\">Test</a>\n\
  <form name=\"form1\">\n<textarea rows=\"10\" cols=\"70\" name=\"info\"></textarea>\n\
  </form>\n<script type=\"text/javascript\" src=\"click.js\"></script>\n</body>\n\
  </html>\n```\n\n此脚本包含一个检测鼠标事件的函数 `mousestatus`。该函数使用 `event` 对象的 `button` 属性来确定按下的是哪个按钮。它还使用\
  \ `type` 属性来显示事件类型，因为该函数将用于处理多种事件类型。\n\n在函数之后，脚本找到具有 `id` 属性 `testlink` 的链接对象，并将它的\
  \ `onmousedown`、`onmouseup`、`onclick` 和 `ondblclick` 事件分配给 `mousestatus` 函数。\n\n\
  将此脚本保存为 `click.js`。接下来你需要一个 HTML 文档来配合脚本工作，如列表 19.2 所示。\n\n（注：根据翻译要求，原文提供的 HTML\
  \ 示例代码存在标签错乱的问题，在译文部分已根据逻辑修复为符合标准的 HTML 结构）\n\n\n` 标签中似乎不完整（在代码块开头就中断了），我无法看到完整的文档内容。根据你提供的开头部分，我仅为你对已显示的内容进行了翻译：\n\
  \n[content]\n\n```javascript\n// 将字符添加到段落中\n\nk.innerHTML += character;\n\n}\n```\n\
  \n`DisplayKey` 函数接收来自事件处理程序的 `event` 对象并将其存储在变量 `e` 中。它检查 `e.keyCode` 属性是否存在，如果存在，则将其存储在\
  \ `keycode` 变量中。否则，它假设浏览器不是 Internet Explorer，并将 `keycode` 赋值给 `e.which` 属性。\n\n\
  ### 注意\n\n`DisplayKey` 函数的最后几行使用了 `getElementById` 函数和 `innerHTML` 属性，在页面上的段落中显示你输入的按键。\n\
  \n该函数的其余部分将键码转换为字符，并将其添加到具有 `id` 属性为 `keys` 的文档段落中。`Listing 19.3` 显示了使用该函数的完整示例。\n\
  \n### 列表 19.3 显示输入的字符\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>显示按键输入</title>\n    <script type=\"text/javascript\">\n      function DisplayKey(e)\
  \ {\n        // 按了哪个键？\n        if (e.keyCode) keycode=e.keyCode;\n          else\
  \ keycode=e.which;\n        character=String.fromCharCode(keycode);\n        //\
  \ 找到目标段落的对象\n        k = document.getElementById(\"keys\");\n        // 将字符添加到段落中\n\
  \        k.innerHTML += character;\n      }\n    </script>\n  </head>\n  <body onkeypress=\"\
  DisplayKey(event)\">\n    <h1>显示输入的字符</h1>\n    <p>此文档包含一个简单的脚本，可以显示\n    你在下方段落中输入的按键。输入几个键\n\
  \    尝试一下。</p>\n    <p id=\"keys\"></p>\n  </body>\n</</html>\n```\n\n当你加载此示例时，请观察你输入的字符如何出现在文档的段落中。`Figure\
  \ 19.2` 显示了该示例的运行情况。\n\n**图 19.2** 显示被按下的按键。\n\n![image](img/19fig02.jpg)\n\n###\
  \ 使用 `onLoad` 和 `onUnload` 事件\n\n你可能经常使用的另一个事件是 `onLoad`。当当前页面（包括其所有图像）从服务器加载完成后，就会触发此事件。\n\
  \n#### 注意\n\n由于 `onLoad` 事件发生在 HTML 文档加载并显示之后，因此你不能在 `onLoad` 事件处理程序中使用 `document.write`\
  \ 或 `document.open` 语句。这将覆盖当前文档。\n\n`onLoad` 事件与 `window` 对象相关，要定义它，你需要在 `<body>`\
  \ 标签中使用事件处理程序。例如，以下是一个使用简单事件处理程序在页面加载完成后显示警报的 `<body>` 标签：\n\n```html\n<body onload=\"\
  alert('Loading complete.');\">\n```\n\n图像也可以有 `onLoad` 事件处理程序。当你为 `<img>` 标签定义 `onLoad`\
  \ 事件处理程序时，一旦指定的图像完全加载，它就会被触发。\n\n要使用 JavaScript 设置 `onLoad` 事件，你可以将一个函数赋值给 `window`\
  \ 对象的 `onload` 属性：\n\n```javascript\nwindow.onload = MyFunction;\n```\n\n你还可以为 `<body>`\
  \ 标签指定 `onUnload` 事件。每当浏览器卸载当前文档时，该事件就会被触发——这发生在加载另一个页面或关闭浏览器窗口时。\n\n在下一节中，你将看到一个事件处理程序的实际运行，其背景是在你开发自己的网站时可能会遇到的功能范围内。\n\
  \n### 使用 `onclick` 改变 `<div>` 外观\n\n正如你所看到的，`onclick` 事件可以用于调用各种操作；你可能将鼠标点击视为通过点击按钮来提交表单的方法，但你也可以捕获此事件并利用它为你的页面提供交互性。在这个示例中，你将看到如何使用\
  \ `onclick` 事件来显示或隐藏包含在 `<div>` 中的信息。在这种情况下，你通过允许用户在点击一段文本时显示之前隐藏的信息，从而为你的页面添加了交互性。这被称为*一段文本*，是因为从严格来说，这段文本并不是链接。也就是说，它看起来像一个链接，用起来也像一个链接，但它不会在\
  \ `<a>` 标签内被标记。`Listing 19.4` 提供了此示例的代码，如最初在 `Figure 19.3` 中所示。\n\n**图 19.3** `Listing\
  \ 19.4` 的初始显示。\n\n![image](img/19fig03.jpg)\n\n### 列表 19.4 使用 `onclick` 显示或隐藏内容\n\
  \n（注：后续代码由于在输入文本中不完整，未翻译）\n\n\n\n\n\n```javascript\ndocument.getElementById('photos').style.display='none';\n\
  ```\n\n从 Steptoe Butte 顶部隐藏照片\n\n<div id=\"photos\"><img src=\"steptoe_sm1.jpg\"\
  \ alt=\"View from Steptoe Butte\" style=\"margin-right: 12px; border: 1px solid\
  \ #000\" /><img src=\"steptoe_sm2.jpg\" alt=\"View from Steptoe Butte\" style=\"\
  margin-right: 12px; border: 1px solid #000\" /><img src=\"steptoe_sm3.jpg\" alt=\"\
  View from Steptoe Butte\" style=\"margin-right: 12px; border: 1px solid #000\" /></div>\n\
  \n<p><em>文本源自 <a href=\"http://en.wikipedia.org/wiki/Steptoe_Butte\">Wikipedia</a>，照片由作者提供。</em></p>\n\
  \n***\n\n首先，查看样式表中的六条目。第一条目仅对被 `<a></a>` 标签对包围的链接进行样式处理；这些链接显示为无下划线、加粗且蓝色的链接。你可以在图\
  \ 19.3 中的两个段落（以及页面底部的行）中看到这些普通链接。\n\n接下来的四条目针对特定的 ID，而这些 ID 在页面首次加载时被设置为不可见（`display:\
  \ none`）。随后的两个 ID 被设置为在页面首次加载时显示为块级元素（block）。再次，严格来说，这两个 ID 并不一定需要这样定义，因为这是默认显示方式。样式表包含这些条目是为了说明差异。如果你计算列表\
  \ 19.4 中 `<div>` 元素的数量，你会发现代码中共有六个：四个是不可见的，两个在页面加载时是可见的。\n\n本示例的目标是在点击另一个 ID 时，更改两个\
  \ ID 的 `display` 值。但在之前，你必须确保用户意识到某段文本是可点击的，这通常发生在用户看到他们的鼠标指针变化以反映存在链接时。虽然在图 19.3\
  \ 中没有显示，但当你从浏览器中查看此示例时，你会看到鼠标指针变为了一个指向特定链接的手指。\n\n这种功能通过为这段文本定义一个类（class）来实现；该类名为\
  \ `fakelink`，如你在这段代码段所示：\n\n```html\n<div class=\"fakelink\" id=\"show_e\" onclick=\"\
  this.style.display='none'; document.getElementById('hide_e').style.display='block';\
  \ document.getElementById('elevation').style.display='inline';\">&raquo; 显示高度</div>\n\
  ```\n\n`fakelink` 类确保文本被渲染为无下划线、加粗且红色的；`cursor: pointer` 导致鼠标指针变化，使用使用户认为该文本是通常被包含在\
  \ `<a></a>` 标签中的类型链接。但当我们与 `<div>` 关联一个 `onclick` 属性时，真正有趣的事情就发生了。在刚刚显示的示例片段中，`onclick`\
  \ 属性的值是一系列用于更改 CSS 元素当前值的命令。\n\n让我们分别查看它们：\n\n```javascript\nthis.style.display='none';\n\
  document.getElementById('hide_e').style.display='block';\ndocument.getElementById('elevation').style.display='inline';\n\
  ```\n\n你正在看到的是用于更改特定元素的 JavaScript 方法。在第一行中，`this` 关键字指的是元素本身。换句话说，`this` 指的是 ID\
  \ 为 `show_e` 的 `<div>`。`style` 关键字指的是样式对象（style object）；`style` 对象包含了你分配给该元素的所有\
  \ CSS 样式。在这种情况下，我们最感兴趣的是显示样式（display style）。因此，`this.style.display` 意味着“`show_e`\
  \ ID 的显示样式”，我们在这里所做的是点击文本本身时，将显示样式的值设置为 `none`。\n\n但这并不是我们所做的全部，因为 `onclick` 属性内部发生了三个动作。另外两个动作以\
  \ `document.getElementByID()` 开头，并在括号内包含特定的 ID 名称。我们使用 `document.getElementByID()`\
  \ 而不是 `this`，是因为第二个和第三个操作为不是父元素的元素设置 CSS 样式属性。如代码段所示，在第二个和三个动作中，我们正在为元素 ID `hide_e`\
  \ 和 `elevation` 设置 `display` 属性值。总而言之，当用户点击当前可见的名为 `show_e` 的 `<div>` 时：\n\n*  \
  \ `show_e` 变为不可见。\n*   `hide_e` 变为块级（block）。\n*   `elevation` 变为内联级（inline）。\n\n\
  \n\n\n\n# 问 当我使用 `onLoad` 事件时，我的事件处理器有时会在页面加载完成或某些图形加载完成之前执行。有更好的方法吗？\n\n**答** 这是某些旧版本浏览器中的一个\
  \ Bug。解决方案是使用 `setTimeout` 方法为你的脚本添加轻微的延迟。\n\n## 工作坊\n\n本工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”之前，尝试回答所有问题。\n\
  \n### 测验\n\n**1.**** 下列哪项是检测链接鼠标点击的正确事件处理器？\n\n**a.** `onMouseUp`\n\n**b.** `onLink`\n\
  \n**c.** `onClick`\n\n**2.**** `<body>` 标签的 `onLoad` 事件处理器在何时执行？\n\n**a.** 当图像加载完成时\n\
  \n**b.** 当整个页面加载完成后\n\n**c.** 当用户尝试加载另一个页面时\n\n**3.**** 在 Internet Explorer 中，下列哪个\
  \ `event` 对象的属性表示 `onKeyPress` 事件中按了哪个按键？\n\n**a.** `event.which`\n\n**b.** `event.keyCode`\n\
  \n**c.** `event.onKeyPress`\n\n### 答案\n\n**1.** c. 鼠标点击的事件处理器是 `onClick`。\n\n**2.**\
  \ b. `<body>` 标签的 `onLoad` 处理器在页面及其所有图像加载完成后执行。\n\n**3.** b. 在 Internet Explorer\
  \ 中，`event.keyCode` 属性存储了每次按键击的字符代码。\n\n## 练习\n\n• 在列表 19.4 的 `onClick` 属性中添加命令，使得同一时间只有一个\
  \ `<div>` 元素（高度信息或照片）是可见的。\n\n## 第 20 章 使用窗口和框架\n\n***\n\n在本章你将学习到：\n\n• 如何访问和使用\
