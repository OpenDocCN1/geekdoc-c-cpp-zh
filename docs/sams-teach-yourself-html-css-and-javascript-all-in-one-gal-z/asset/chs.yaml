  \ DOM 中一些实用的对象——浏览器窗口和框架，以及 JavaScript 如何与它们进行交互。\n\n在本章中，你将学习更多关于 DOM 中一些实用的对象——浏览器窗口和框架，\
  \ \n\n### 使用对象控制窗口\n\n在本章中，你将学习更多关于 DOM 中一些实用的对象——浏览器窗口和框架， \n\n### 窗口对象的属性\n\n\
  在本章中，你将详细查看 `window` 对象的属性：\n\n- `closed`: 表示窗口是否已关闭的布尔值。\n- `opener`: 打开此窗口的窗口引用。\n\
  - `self`: 当前窗口的别名。\n- `top`: 顶级窗口的引用。\n- `parent`: 父框架的引用。\n- `frames`: 框架数组。\n\
  - `screen`: 关于窗口屏幕的信息。\n\n### 创建新窗口\n\n`window` 对象最方便的用途之一是创建新窗口。你可以以此显示文档，例如广告或说明。你可以使用\
  \ `window.open()` 方法创建新窗口。典型的语句如下：\n\n```\nWinObj = window.open(\"URL\", \"WindowName\"\
  , \"OF_FEATURES\");\n```\n\n以下是 `window.open()` 语句的组件：\n\n-变量 `WinObj` 用于存储新的 `window`\
  \ 对象。你可以使用此名称访问新对象的方法和属性。\n- 第一个参数是加载到新窗口的 URL。如果留空，则不加载网页。\n- 第二参数指定窗口名称（此处为 `WindowName`）。它被赋值给\
  \ `window` 对象的 `name` 属性并用于引用该窗口。\n- 第三参数是可选列表，用逗号分隔。你可以通过选择是否包含工具栏等功能来自定义新窗口。\n\
  \n`window.open()` 方法第三参数中的可用功能包括 `width` 和 `height`（以像素设置窗口大小），以及可以设置为 `yes` (1)\
  \ 或 `no` (0) 的若干功能：`toolbar`、`location`、`directories`、`status`、`menubar`、`scrollbars`\
  \ 和 `resizable`。你可以只列出你想从默认更改的功能。\n\n此示例创建了一个没有工具栏或状态栏的小窗口：\n\n```\nSmallWin = window.open(\"\
  \",small\",\"width=100,height=120,toolbar=0,status=0\");\n```\n\n### 打开和关闭窗口\n\n\
  当然，你也可以使用 JavaScript 关闭窗口。`window.close()` 方法关闭窗口。浏览器通常不允许你在没有用户许可的情况下关闭主浏览器窗口；该方法的主要目的是关闭你创建的窗口。例如，此语句关闭了名为\
  \ `updateWindow` 的窗口：\n\n```\nupdateWindow.close();\n```\n\n\n\n\n另一个示例，列表 20.1\
  \ 显示了一个 HTML 文档，它允许你通过点击按钮打开一个小的新窗口。然后你可以点击另一个按钮来关闭该新窗口。第三个按钮尝试关闭当前窗口。根据你的浏览器及其设置，这可能有效，也可能无效（例如，默认情况下，你的浏览器可能会阻止脚本关闭由脚本本身创建或打开的窗口）。如果脚本确实关闭了窗口，大多数浏览器会先请求确认。\n\
  \n列表 20.1 一个使用 JavaScript 创建和关闭窗口的 HTML 文档\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Create a New Window</title>\n  </head>\n  <body>\n    <h1>Create a New\
  \ Window</h1>\n    <p>Use the buttons below to open and close windows in JavaScript.</p>\n\
  \    <form name=\"winform\" action=\"\">\n      <p><input type=\"button\" value=\"\
  Open New Window\"\n          onclick=\"NewWin=window.open('','NewWin',\n       \
  \   'toolbar=no,status=no,width=200,height=100');\" /></p>\n      <p><input type=\"\
  button\" value=\"Close New Window\"\n          onclick=\"NewWin.close();\" /></p>\n\
  \      <p><input type=\"button\" value=\"Close Main Window\"\n          onclick=\"\
  window.close();\" /></p>\n    </form>\n  </body>\n</html>\n```\n\n此示例使用简单的事件处理程序来工作，通过为每个按钮提供不同的处理程序来实现。图\
  \ 20.1 显示了点击“打开新窗口”按钮后的结果：它在主浏览器窗口上方打开了一个小的新窗口。\n\n**图 20.1** 使用 JavaScript 打开的新型浏览器窗口。\n\
  \n![image](img/20fig01.jpg)\n\n### 移动和调整窗口大小\n\nDOM 还允许你移动或调整窗口大小。你可以对任何 `window`\
  \ 对象使用以下方法：\n\n- `window.moveTo()` 将窗口移动到新位置。参数指定了 `x`（列）和 `y`（行）位置。\n- `window.moveBy()`\
  \ 将窗口相对于其当前位置移动。`x` 和 `y` 参数可以是正数或负数，并加到当前值上以到达新位置。\n- `window.resizeTo()` 将窗口的大小调整为参数指定的宽度和高度。\n\
  - `window.resizeBy()` 相对于当前的大小调整窗口的大小。参数用于修改当前的宽度和高度。\n\n例如，列表 20.2 显示了一个 HTML 文档，其中包含一个简单的脚本，允许你根据表单中输入的值调整主窗口的大小并移动。\n\
  \n列表 20.2 移动和调整当前窗口\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Moving and Resizing Windows</title>\n    <script type=\"text/javascript\"\
  >\n    function doIt() {\n        if (document.form1.w.value && document.form1.h.value)\
  \ {\n          self.resizeTo(document.form1.w.value, document.form1.h.value);\n\
  \        }\n        if (document.form1.x.value && document.form1.y.value) {\n  \
  \        self.moveTo(document.form1.x.value, document.form1.y.value);\n        }\n\
  \      }\n    </script>\n  </head>\n  <body>\n    <h1>Moving and Resizing Windows</h1>\n\
  \    <form name=\"form1\">\n      <p><strong>调整大小为：</strong> <br/>\n      <input\
  \ size=\"5\" type=\"text\" name=\"w\" /> 像素宽且 <br/>\n      <input size=\"5\" type=\"\
  text\" name=\"h\" /> 像素高 </p>\n      <p><strong>— 和/或 — </strong></p>\n      <p><strong>移动到：</strong>\
  \ <br/>\n      X-位置: <input size=\"5\" type=\"text\" name=\"x\" />\n      Y-位置:\
  \ <input size=\"5\" type=\"text\" name=\"y\" /> </p>\n      <div><input type=\"\
  button\" value=\"Change Window\"\n          onclick=\"doIt();\" /></div>\n    </form>\n\
  \  </body>\n</html>\n```\n\n在此示例中，当点击“更改窗口”按钮时，`doIt` 函数被用作事件处理程序调用。该函数检查你是否指定了宽度和高度值。如果是，它将使用\
  \ `self.resizeTo()` 方法调整当前窗口的大小。\n\n\n\n\n\n```javascript\ntextField.innerHTML =\
  \ \"The counter is now at \" + counter;\n\n// set another timeout for the next count\n\
  \nID=window.setTimeout(\"Update();\",2000);\n\n}\n\n</script>\n\n</head>\n\n<body>\n\
  <h1>超时示例</h1>\n<p>计数器将每两秒更新一次。</p>\n<p>按下 RESET 或 STOP 可重新开始或停止计数。</p>\n<hr/>\n\
  <form name=\"form1\">\n<p id=\"showText\"></p>\n<div>\n  <input type=\"button\"\
  \ value=\"RESET\" onclick=\"counter = 0;\" />\n  <input type=\"button\" value=\"\
  STOP\" onclick=\"window.clearTimeout(ID);\" />\n</div>\n</form>\n</body>\n</html>\n\
  ```\n\n* * *\n\n此程序每两秒在特殊命名的 `<p>` 标签内显示一条消息，其中包含一个每次加 1 的计数器。`<p>` 标签被赋予了 `id`\
  \ 值 `\"showText\"`，而 `Update()` 函数包含两行代码，告诉脚本应将文本放置这两个标签之间：\n\n```javascript\ntextField\
  \ = document.getElementById(\"showText\");\ntextField.innerHTML = \"The counter\
  \ is now at \" + counter;\n```\n\n第一行创建了一个名为 `textField` 的变量，它持有 `id` 值为 `\"showText\"\
  ` 的元素值。第二行表示，给定该值，关于计数器的文本和计数器数字应该放置在 `id` 值为 `\"showText\"` 的元素的起始和结束标签之间——这就是\
  \ `innerHTML` 方法的作用。\n\n在脚本加载并开始计数后，你可以使用 Reset 按钮重新计数，使用 Stop 按钮停止计数。\n\n该脚本在页面加载时调用了\
  \ `setTimeout()` 方法，并在每次更新时再次调用。`Update()` 函数执行更新，将计数器加 1 并设置下一次超时。Reset 按钮将计数器置零，Stop\
  \ 按钮演示了 `clearTimeout()` 方法。图 20.2 显示了计数器运行一段时间后超时示例的显示情况。\n\n**图 20.2** 超时示例的输出。\n\
  \n![image](img/20fig02.jpg)\n\n### 显示对话框\n\n`window` 对象包含了三个用于显示消息和与用户交互的实用。你已经在某些脚本中使用过这些方法。以下是总结：\n\
  \n- `window.alert(message)` 显示一个警告对话框。此对话框仅向用户提供一条消息。\n- `window.confirm(message)`\
  \ 显示一个确认对话框。它显示一条消息并包含“确定”和“取消”按钮。如果点击“确定”，该方法返回 `true`；如果点击“取消”，则返回 `false`。\n\
  - `window.prompt(message,default)` 显示消息并提示用户输入。它返回用户输入的文本。如果用户没有输入任何内容，则使用默认值。\n\
  \n* * *\n\n> 提示\n\n在引用这些方法时，通常可以省略 `window` 对象，因为它是脚本的默认上下文（例如，`alert(\"text\")`）。\n\
  \n* * *\n\n要使用 `confirm` 和 `prompt` 方法，请使用变量来接收用户的响应。例如，此语句将显示一个提示框并将用户输入的文本存储在\
  \ `text` 变量中：\n\n```javascript\ntext = window.prompt(\"Enter some text\",\"Default\
  \ value\");\n```\n\n作为此类对话框的进一步说明，列表 20.4 显示了一个使用按钮和事件处理程序的 HTML 文档，允许你测试对话框。\n\n\
  列表 20.4 使用 JavaScript 显示警告、确认和提示的 HTML 文档\n\n* * *\n\n```html\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>警告、确认和提示</title>\n  </head>\n  <body>\n\
  \    <h1>警告、确认和提示</h1>\n    <p>使用下面的按钮测试 JavaScript 中的对话框。</p>\n  <form name=\"\
  winform\">\n  <div>\n    <input type=\"button\" value=\"RESET\" onclick=\"window.alert('This\
  \ is an alert');\" />\n    <input type=\"button\" value=\"STOP\" onclick=\"window.confirm('Would\
  \ you like to confirm?');\" />\n    <input type=\"button\" value=\"PROMPT\" onclick=\"\
  window.prompt('Enter text','Default value');\" />\n  </div>\n  </form>\n  </body>\n\
  </html>\n```\n\n\n\n\n\n尽管有这些缺点，在接下来的几节中，你将学习如何创建一个非常简单的框架站点（framed site）。你可能仍然遇到框架站点，并且可能需要知道如何在不使用框架的情况下重新创建站点的外观和感受。在这种情况下，理解框架是如何构造的重要的，这样你才能成功地解构它们。\n\
  \n此外，你将学习一种类型的框架——`<<iframe>>`，它确实起着重要作用并且在 HTML5 中仍然存在。\n\n### 构建框架集 (Frameset)\n\
  \n本节将向你展示如何创建图 20.4 和 20.5 所示的简单框架站点。每个框架的内容作为普通的 HTML 页面创建的。页面分别是 [`top.html`](http://top.html）（用于导航）、[`home.html`](http://home.html）、[`products.html`](http://products.html）、[`services.html`](http://services.html）以及\
  \ [`contact.html`](http://contact.html)。这些页面不包含任何你在其他章节中见过的标签。使用一个名为框架集文档（frameset\
  \ document）的特殊页面将页面组合在一起；在这种情况下，该文档是 [`index.html`](http://index.html)。\n\n### 创建框架集文档\n\
  \n`frameset document` 是一个 HTML 页面，它指示网络浏览器将其窗口分为多个框架，并指定在每个框架中应该显示哪个网页。\n\n框架集文档实际上没有内容。它只告诉浏览器加载哪些其他页面以及如何在浏览器窗口中排列它们。列表\
  \ 20.5 显示了图 20.4 和 20.5 所示示例框架站点的框架集文档。\n\n列表 20.5 图 20.4 和 20.5 所示站点的框架集文档\n\n\
  ```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.0 Frameset//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n\
  <html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Sample\
  \ Framed Site</title>\n  </head>\n  <frameset rows=\"50,*\">\n    <frame src=\"\
  top.html\" name=\"top\" />\n    <frame src=\"home.html\" name=\"main\" />\n    <noframes>\n\
  \      <body>\n        <h1>Sample Framed Site</h1>\n        Your browser does not\
  \ support frames. Sorry!\n      </body>\n    </noframes>\n  </frameset>\n</html>\n\
  ```\n\n列表 20.4 使用 `<frameset>` 标签而不是 `<body>` 标签。任何通常情况下会包含在 `<body>` 标签中的标签都不能出现在\
  \ `<frameset>` 标签内。此示例中的 `<frameset>` 标签包含一个 `rows` 属性，这意味着框架应该像表格的水平行一样堆叠在一起。如果你希望框架并排排列，请使用\
  \ `cols` 属性（而不是 `rows` 属性）。\n\n注意\n重要的是，此示例页面中使用的 DTD 并不是你整本书中一直在使用的熟悉的 XHTML 1.1\
  \ DTD。这是因为标准的 XHTML 1.1 DTD 不支持框架。因此，为了验证带有框架的页面，你必须使用 XHTML 1.0 Frameset DTD，这是一种专门为使用框架的页面设计的特殊\
  \ DTD。\n\n你必须指定 `rows` 或 `cols` 的大小，可以是精确的像素值，也可以是浏览器窗口总大小的百分比。你还可以使用星号（`*`）来指示框架应该填充窗口中任何可用空间。如果有多个框架具有\
  \ `*` 值，则剩余空间将平均分配给它们。\n\n在列表 20.5 中，`<frameset rows=\"50,*\">` 将窗口垂直分为两个框架。顶部框架恰好高\
  \ 50 像素，底部框架将占据窗口中所有剩余空间。顶部框架包含文档 [`top.html`](http://top.html）（参见列表 20.6），底部框架包含\
  \ [`home.html`](http://home.html）（参见列表 20.7）。\n\n列表 20.6 示例框架站点的 [`top.html`](http://top.html)\
  \ 导航栏\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.0 Transitional//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml1-transitional.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Sample Framed Site</title>\n    <style type=\"text/css\">\n      body {\
  \ background-color:#5F9F9F; }\n      a { color: #FFFFFF; }\n      .main {\n    \
  \    text-align:center;\n        color:#FFFFFF;\n        font-weight:bold;\n   \
  \     font-size:16pt;\n      }\n    </style>\n  </head>\n  <body>\n    <div class=\"\
  main\">\n      <a href=\"home.html\" target=\"main\">HOME</a> ::\n      <a href=\"\
  products.html\" target=\"main\">PRODUCTS</a> ::\n      <a href=\"services.html\"\
  \ target=\"main\">SERVICES</a> ::\n      <a href=\"contact.html\" target=\"main\"\
  >CONTACT</a>\n    </div>\n  </body>\n</html>\n```\n\n提示\n在列表 20.6 之后，有一个 `<body>`\
  \ 标签。请注意，图 20.4 和图 20.5 的内容并不包含 `<body>` 标签。由于大多数浏览器都支持框架，所以框架的问题已不大了。尽管如此，如果你使用框架，很容易包含\
  \ `<noframes>` 标签。\n\n列表 20.7 框架内的单框架 [`home.html`](http://home.html)\n\n```\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Sample Framed\
  \ Site</title>\n    <style type=\"text/css\">\n      body { background-color:#5F9F9F;\
  \ }\n      a { color: #FFFFFF; }\n      .main {\n        text-align:center;\n  \
  \      color:#FFFFFF;\n        font-weight:bold;\n        font-size:16pt;\n    \
  \  }\n    </style>\n  </head>\n  <body>\n    <div class=\"main\">\n      <a href=\"\
  home.html\" target=\"main\">HOME</a> ::\n      <a href=\"products.html\" target=\"\
  main\">PRODUCTS</a> ::\n      <a href=\"services.html\" target=\"main\">SERVICES</a>\
  \ ::\n      <a href=\"contact.html\" target=\"main\">CONTACT</a>\n    </div>\n \
  \ </body>\n</html>\n```\n\n注意\n列表 20.6 和列表 20.7 中的页面分别使用了 XHTML 1.0 Transitional\
  \ 和 XHTML 1.1 DTD。XHTML 1.1 DTD 更新且严格得多，但 [`top.html`](http://top.html) ch20.6 中\
  \ `target` 属性的使用需要使用 XHTML 1.0 Transitional DTD 才能有效；列表 20.7 中没有任何在 XHTML 1.1 中是无效的。\n\
  \n每当你指定任何像素的框架大小时，最好的做法是在同一个框架集中至少包含一个具有变量（`*`）的框架，这样文档就可以填充任何大小的窗口。\n\n#### 添加单个框架\n\
  \n在 `<frameset>` 和 `</frameset>` 标签之间，你应该有一个 `<frame />` 标签，指示在每个框架中显示哪个 HTML 文档。注意，如果\
  \ `<frame />` 标签的数量少于 `<frameset>` 标签中定义的框架数量，则任何剩余的框架将留白。\n\n\n\n\n当你在 `<frame\
  \ />` 标签中使用 `name` 属性为框架指定一个唯一的名称时，框架的真正威力开始显现。然后你可以通过 `<a>` 标签中的 `target` 属性，让页面上的任何链接改变该框架的内容。例如，Listing\
  \ 20.6 包含了以下标签：\n\n```html\n<frame src=\"home.html\" name=\"main\" />\n```\n\n这段代码在页面加载时会在框架中显示\
  \ [`home.html`](http://home.html) 页面，并将该框架命名为 \"main\"。\n\n### 注意\n从技术上讲，`name`\
  \ 标签已经过时，并已被 `id` 标签所取代。\n\n然而，在识别作为目标的框架时，目前的网页浏览器仍然依赖 `name` 而不是 `id`，且 `name`\
  \ 的使用在 XHTML 中仍然是有效的。因此，目前在识别框架时，你需要坚持使用 `name` 属性。当然，同时使用这两个属性也无益处。\n\n在顶部框架的代码中（显示在\
  \ Listing 20.7 中），你将看到以下链接：\n\n```html\n<a href=\"services.html\" target=\"main\"\
  >SERVICES</a>\n```\n\n当用户点击此链接时，[`services.html`](http://services.html)将在名为 `main`\
  \ 的框架（下方框架）中显示。如果漏掉了 `target=\"main\"` 属性，[`services.html`](http://services.html)\
  \ 页面将显示在当前（顶部）框架中。\n\n### 修改框架边界\n你可以在框架代码中使用一些 HTML 属性来消除框架分割线、通过缩小边距大小为小框架留出更多空间，并强制框架不显示滚动条。Listing\
  \ 20.8 显示了 Listing 20.4 代码的修改版本。对代码的两个更改是在 `<frame>` 标签中添加了以下属性：`scrolling=\"no\"\
  ` 和 `frameborder=\"0\"`。\n\nListing 20.8 图 20.6 所示网站的 Frameset 文档\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.0 Frameset//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html\
  \ xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Sample\
  \ Framed Site</title>\n  </head>\n  <frameset rows=\"50,*\">\n    <frame src=\"\
  top.html\" name=\"top\" scrolling=\"no\" frameborder=\"0\" />\n    <frame src=\"\
  home.html\" name=\"main\" scrolling=\"no\" frameborder=\"0\"/>\n    <noframes>\n\
  \      <body>\n        <h1>Sample Framed Site</h1>\n        Your browser does not\
  \ support frames. Sorry!\n      </body>\n    </noframes>\n  </frameset>\n</html>\n\
  ```\n\n**图 20.6** 这是该页面，在 `<frame />` 标签上添加属性后，其代码如 Listing 20.8 所示。\n\n![image](img/20fig06.jpg)\n\
  \n### 使用 JavaScript 对象处理框架\n当一个窗口包含多个框架时，每个框架在 JavaScript 中都由一个 `frame` 对象表示。该对象等同于\
  \ `window` 对象，但它专门用于处理该框架。`frame` 对象的名称与你在 `<frame>` 标签中赋予它的 `NAME` 属性相同。\n\n还记得指向当前窗口的\
  \ `window` 和 `self` 关键字吗？当你使用框架时，这些关键字将指向当前框架。另一个关键字 `parent` 允许你引用主窗口。\n\n窗口中的每个框架对象都是\
  \ `parent` 窗口对象的子级对象。假设你使用以下 HTML 定义了一组框架：\n\n```html\n<frameset rows=\"*,*\" cols=\"\
  *,*\">\n  <frame name=\"topleft\" src=\"topleft.html\">\n  <frame name=\"topright\"\
  \ src=\"topright.html\">\n  <frame name=\"bottomleft\" src=\"botleft.html\">\n \
  \ <frame name=\"bottomright\" src=\"botright.html\">\n</frameset>\n```\n\n### 注意\n\
  如果你使用嵌套的 frameset，情况会复杂一些。`window` 仍然代表当前框架，`parent` 代表包含当前框架的 frameset，而 `top`\
  \ 代表包含所有其他框架的主 frameset。\n\n这仅仅是将窗口划分为若干部分。\n\n### 数组\n与其通过名称引用框架，不如使用 `frames`\
  \ 数组。数组从 0 开始索引：\n- `frames[0]` 对应 `topleft` 框架。\n- `frames[1]` 对应 `topright` 框架。\n\
  - `frames[2]` 对应 `bottomleft` 框架。\n- `frames[3]` 对应 `bottomright` 框架。\n\n### 内联框架\n\
  内联框架并不像普通框架那样有名字，但它们用于在现有文档中嵌入内容。在类似于 `<object>` 标签的情况下，`<iframe>` 通常用于嵌入另一个独立的文档。你可以通过\
  \ `<iframe>` 标签中的 `src` 属性来指定内联文档。例如，Listing 20.6 显示：\n\nListing 20.9 使用 `<iframe>`\
  \ 标签的代码\n\n```html\n<iframe src=\"inline.html\"></iframe>\n```\n\n这段代码在页面加载时会在框架中显示\
  \ [`inline.html`](http://inline.html) 页面。\n\n### 内联框架\n内联框架并不像普通框架那样有名字，但它们用于在现有文档中嵌入内容。在类似于\
  \ `<object>` 标签的情况下，`<iframe>` 通常用于嵌入另一个独立的文档。你可以通过 `<iframe>` 标签中的 `src` 属性来指定内联文档。例如，Listing\
  \ 20.6 显示：\n\n```html\n<iframe src=\"inline.html\"></iframe>\n```\n\n这段代码在页面加载时会在框架中显示\
  \ [`inline.html`](http://inline.html) 页面。\n[/content] (注：由于您提供的待翻译文本中存在大量内容重复，我已根据“不要重复输出原文”的原则进行了去重翻译)\n\
