  \n无论你的导航元素布局如何（水平或垂直），本章都讨论了两个层级的导航：一级导航和二级导航。*一级导航*引导用户进入网站主要部分的介绍页；*二级导航*反映了特定区域内的这些页面。\n\
  \n### 使用 CSS 创建垂直导航\n\n根据你的网站架构——包括你创建的显示模板以及你在网站中分类信息的方式——你可能会发现自己正在使用垂直导航作为一级导航或二级导航。\n\
  \n例如，假设你为公司创建了一个网站，主要部分有“关于我们”、“产品”、“支持”和“新闻”。在“关于我们”主部分内，你可能有几个其他页面，如“使命”、“历史”、“执行团队”和“联系我们”——这些其他页面就是“关于我们”主部分的二级导航。\n\
  \n列表 11.3 设置了一个基本的二级页面，侧边带有垂直导航，中间是内容。侧边的链接和内容区域的链接都是基础 HTML 列表元素。\n\n此列表以及图 11.7\
  \ 所示的示例为你提供了一个起点，展示 CSS 如何让你将两个相似的 HTML 结构转换为不同的视觉显示（从而产生两个不同的上下文）。\n\n**图 11.7**\
  \ 起点：未样式的列表导航。\n\n![image](img/11fig07.jpg)\n\n列表 11.3 带有列表垂直导航的 Basic 页面\n\n（注：后续重复内容已根据指令“一定不要重复输出原文”进行处理）\n\
  \n\n\n\n```css\n    background-color: #628794;\n    color: #ffffff;\n}\n```\n\n\
  之前使用的所有样式你都应该很熟悉，可能只是样式表条目中 `display: block;` 的用法。将 `display` 属性设置为 `block` 可以确保当用户将鼠标悬停在元素上时，整个\
  \ `<li>` 元素都能起作用。图 11.9 显示了应用了这些新样式的垂直列表菜单。\n\n**图 11.9** 垂直列表开始看起来像导航菜单了。\n\n![image](img/11fig09.jpg)\n\
  \n当用户的鼠标悬停在导航列表元素上时，其意图是发生某种视觉变化，让用户知道该元素是可以点击的。这类似于大多数软件菜单在用户光标悬停在菜单项上时改变颜色的方式。在这种情况下，我们将更改列表项的背景颜色，并更改列表项的文本颜色；它们将与之前显示的蓝色和白色不同。\n\
  \n```css\n#nav li a:hover, #nav li a:active {\n    font-size: 10pt;\n    font-weight:\
  \ bold;\n    display: block;\n    padding: 3px 0px 3px 3px;\n    background-color:\
  \ #6cac46;\n    color: #000000;\n}\n```\n\n图 11.10 显示了目前为止所有样式工作的结果。通过使用样式表中的几条条目，简单的列表已转变为视觉上不同的菜单。\n\
  \n**图 11.10** 列表项现在当鼠标悬停在其上方时会改变颜色。\n\n![image](img/11fig10.jpg)\n\n### 为多级垂直导航设置样式\n\
  \n如果你的网站架构需要另一层你希望用户随时看到的导航，该该呢？这可以通过嵌套列表（你已经在之前的章节中学习过）和更多的样式表条目来表示。在这种情况下，假设“执行团队（Executive\
  \ Team）”链接下有四个导航元素。在 HTML 中，按如下方式修改列表：\n\n```html\n<ul>\n  <li><a href=\"#\">Mission</a></li>\n\
  \  <li><a href=\"#\">History</a></li>\n  <li><a href=\"#\">Executive Team</a>\n\
  \      <ul>\n      <li><a href=\"#\">&raquo; CEO</a></li>\n      <li><a href=\"\
  #\">&raquo; CFO</a></li>\n      <li><a href=\"#\">&raquo; COO</a></li>\n      <li><a\
  \ href=\"#\">&raquo; Other Minions</a></li>\n      </ul>\n  </li>\n  <li><a href=\"\
  #\">Contact Us</a></li>\n</ul>\n```\n\n这段代码在“执行团队”链接下生成了一个嵌套列表（参见图 11.11）。`&raquo;`\
  \ HTML 实体生成了显示在新链接文本之前的右指向箭头。\n\n**图 11.11** 创建嵌套导航列表（但样式设置得还不好）。\n\n![image](img/11fig11.jpg)\n\
  \n新项目作为块级元素显示在列表中，但信息的层级结构没有在视觉上表现出来。为了添加某种视觉元素，以识别这些项目是附着在“执行团队”链接上的子导航元素，请再次修改样式表以添加一些缩进。\n\
  \n但在在此之前，也请修改其他一些样式表条目。在上一节中，我们添加了如 `#nav ul` 和 `#nav li` 等选择器，它们分别表示“名为 `nav` 的\
  \ `<div>` 中的所有 `<ul>`”和“名为 `nav` 的 `<div>` 中的所有 `<li>`”。然而，现在 `nav` 中有两个 `<ul>`\
  \ 实例和另一组 `<li>` 元素，我们都希望它们看起来与原始集合不同。\n\n为了确保两组列表项都得到适当的样式设置，确保样式表选择器清晰地指示列表的层级结构。为了做到这一点，请使用如\
  \ `#nav ul` 和 `#nav ul li` 用于一级列表，并使用 `#nav ul ul` 和 `#nav ul ul li` 用于第二级列表。代码列表\
  \ 11.4 显示了新版本的样式表条目和 HTML，它们生成了图 11.12 所示的菜单。\n\n**图 11.12** 使用 CSS 创建两级垂直导航。\n\n\
  ![image](img/11fig12.jpg)\n\n代码列表 11.4 列表中的多级垂直导航\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"\
  http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>About Us</title>\n    <style type=\"text/css\"\
  >\n      body {\n        font: 12pt Verdana, Arial, Georgia, sans-serif;\n     \
  \ }\n      #nav {\n        width:150px;\n      }\n      #content {\n        float:left;\n\
  \      }\n      #nav a {\n        text-decoration: none;\n      }\n      #nav ul\
  \ {\n        list-style:none;\n      }\n      #nav li {\n        border-bottom:1px\
  \ solid #ffffff;\n      }\n      #nav li a:link, #nav li a:visited {\n        color:\
  \ #ffffff;\n      }\n      #nav li a:hover, #nav li a:active {\n        background-color:#6cac46;\n\
  \        color:#000000;\n        display:block;\n        padding:3px 0px 3px 3px;\n\
  \      }\n      #nav ul ul {\n        margin-left:20px;\n      }\n      #nav ul\
  \ ul li {\n        border-bottom:none;\n      }\n    </style>\n  </head>\n  <body>\n\
  \    <div id=\"nav\">\n      <ul>\n        <li><a href=\"#\">Mission</a></li>\n\
  \        <li><a href=\"#\">History</a></li>\n        <li><a href=\"#\">Executive\
  \ Team</a>\n          <ul>\n            <li><a href=\"#\">&raquo; CEO</a></li>\n\
  \            <li><a href=\"#\">&raquo; CFO</a></li>\n            <li><a href=\"\
  #\">&raquo; COO</a></li>\n            <li><a href=\"#\">&raquo; Other Minions</a></li>\n\
  \          </ul>\n        </li>\n        <li><a href=\"#\">Contact Us</a></li>\n\
  \      </ul>\n    </div>\n    <div id=\"content\">\n      <h1>About Us</h1>\n  \
  \    <p>On the introductory pages of main sections, it can be useful to repeat the\
  \ secondary navigation and provide more context, such as:</p>\n      <ul>\n    \
  \    <li><a href=\"#\">Mission</a>Learn more about our mission and philanthropic\
  \ efforts.</li>\n        <li><a href=\"#\">History</a>Read about our corporate history\
  \ and learn how we grew to become the largest widget maker in the country.</li>\n\
  \        <li><a href=\"#\">Executive Team</a>Our team of executives makes the company\
  \ run like a well-oiled machine (also useful for making widgets).</li>\n       \
  \ <li><a href=\"#\">Contact Us</a>Here you can find multiple methods for contacting\
  \ us (and we really do care what you have to say).</li>\n      </ul>\n    </div>\n\
  \  </body>\n</html>\n```\n\n垂直导航的不同样式仅限于你的创造力。你可以使用颜色、外边距、内边距、背景图像以及任何有效的 CSS 来创建灵活且易于修改的垂直导航。如果你在搜索引擎中输入\
  \ **CSS vertical navigation**，你将找到成千上万个示例——它们都是基于你在本章中学到的简单原理。\n\n### 使用 CSS 创建水平导航\n\
  \n\n\n\n\n导航课程从垂直导航开始，因为当导航仍然看起来像是一列表你可能在纸上垂直书写的项目列表（例如杂货购物清单）时，将列表转换为导航的概念会更容易理解。在创建水平导航时，你仍然使用\
  \ HTML 列表元素，但不再通过对两个 `<ul>` 和 `<li>` 使用 `display` 属性的 `inline` 值来实现垂直显示，而是使用 `display`\
  \ 属性的 `block` 值。这真的非常简单。\n\nListing 11.5 显示了一个包含水平导航页面的起点。该页面包含两个主要的 `<<div>>` 元素：一个用于页头，另一个用于内容。页头\
  \ `<div>` 包含一个标志 `<div>` 和一个并排浮动的导航 `<div>`。在导航 `<div>` 中出现的列表，其列表本身和列表项的 `display`\
  \ 属性值均为 `inline`。你可以在图 11.13 中看到这些元素及其位置。\n\n**图 11.13** 使用内联列表元素创建功能性（但不一定美）的水平导航。\n\
  \n![image](img/11fig13.jpg)\n\nListing 11.5 来自列表的简单水平导航\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>ACME Widgets LLC</title>\n    <style type=\"\
  text/css\">\n      body {\n        font: 12pt Verdana, Arial, Georgia, sans-serif;\n\
  \      }\n      #header {\n        width: auto;\n      }\n      #logo {\n      \
  \  float:left;\n      }\n      #nav {\n        float:left;\n      }\n      #nav\
  \ ul {\n        list-style: none;\n        display: inline;\n      }\n      #nav\
  \ li {\n        display: inline;\n      }\n      #content {\n        width: auto;\n\
  \        float: left;\n        clear: left;\n      }\n      #content a {\n     \
  \   text-decoration: none;\n        font-weight: bold;\n      }\n    </style>\n\
  \  </head>\n  <body>\n    <div id=\"header\">\n      <div id=\"logo\">\n       \
  \   <img src=\"acmewidgets.jpg\" alt=\"ACME Widgets LLC\" />\n      </div>\n   \
  \   <div id=\"nav\">\n        <ul>\n          <li><a href=\"#\">关于我们 (About Us)</a></li>\n\
  \          <li><a href=\"#\">产品 (Products)</a></li>\n          <li><a href=\"#\"\
  >支持 (Support)</a></li>\n          <li><a href=\"#\">媒体 (Press)</a></li>\n      \
  \  </ul>\n      </div>\n    </div>\n    <div id=\"content\">\n      <p><strong>ACME\
  \ Widgets LLC (ACME 部件有限公司)</strong>是这片土地上最伟大的部件制造商。</p>\n      <p>不相信我们吗？继续阅读...</p>\n\
  \      <ul>\n        <li><a href=\"#\">关于我们 (About Us)</a>: 我们非常棒的。</li>\n     \
  \   <li><a href=\"#\">产品 (Products)</a>: 我们的产品是最好的。</li>\n        <li><a href=\"\
  #\">支持 (Support)</a>: 你可能不需要支持，但我们还是提供了。</li>\n        <li><a href=\"#\">媒体 (Press)</a>:\
  \ 读读他人的评价（关于我们有多棒的）。</li>\n      </ul>\n    </div>\n  </body>\n</html>\n```\n\n\
  修改此列表的显示方式完全通过 CSS 实现；HTML 内部内容的结构已经设置好。要实现所期望的显示效果，请使用以下 CSS。首先，修改 `id` 为 `nav`\
  \ 的 `<div>` 以设置特定的宽度、显示背景颜色和边框，并使用 85 像素的上外边距（使其显示在标志附近）。\n\n```css\n#nav {\n  float:left;\n\
  \  margin: 85px 0px 0px 0px;\n  width: 400px;\n  background-color: #628794;\n  border:\
  \ 1px solid black;\n}\n```\n\n`<<ul>>` 的定义与 Listing 11.5 相同，但外边距和内边距发生了变化：\n\n```css\n\
  #nav ul {\n  margin: 0px;\n  padding: 0px;\n  list-style: none;\n  display: inline;\n\
  }\n```\n\n`<<li>>` 的定义与 Listing 11.5 相同，但被赋予了 `1.8em` 的 `line-height` 值：\n\n```css\n\
  #nav li {\n  display: inline;\n  line-height: 1.8em;\n}\n```\n\n链接样式与垂直导航中使用的相似；这些条目有不同的内边距值，但颜色和字体大小保持不变：\n\
  \n```css\n#nav ul li a:link, #nav ul li a:visited {\n  font-size: 10pt;\n  font-weight:\
  \ bold;\n  text-decoration: none;\n  padding: 7px 10px 7px 10px;\n  background-color:\
  \ #628794;\n  color: #ffffff;\n}\n\n#nav ul li a:hover, #nav ul li a:active {\n\
  \  font-size: 10pt;\n  font-weight: bold;\n  text-decoration: none;\n  padding:\
  \ 10px 7px 10px;\n  background-color: #c6a648;\n  color: #000000;\n}\n```\n\n将这些样式组合在一起，你就会产生图\
  \ 11.14 所示的显示效果。\n\n**图 11.14** 创建带有样式的水平导航。\n\n![image](img/11fig14.jpg)\n\n当用户鼠标悬停在导航元素上时，背景和文本颜色的变化与用户鼠标悬停在垂直导航菜单上时相同。同样，就像你在垂直导航菜单上做的那样，你可以使用嵌套列表在水平菜单中产生下拉功能。自己尝试一下！\n\
  \n## 总结\n\n本章从列表和列表元素如何受到内边距和外边距样式影响的示例开始。你首先学习了与列表相关的默认内边距以及如何控制该内边距。接下，你学习了如何修改内边距和外边距值，以及如何将列表项标记放在列表项内部或外部，以便你开始思考样式和列表如何影响你的整体网站设计。最后，你学习了如何利用列表和列表元素创建纯\
  \ XHTML 和 CSS 图像映射，，从而减少了对图像切割的需求。\n\n在学习了所谓的“跳出（列表）框框”之后，你学习了如何使用无序列表在网站内生成水平或垂直导航。通过使用\
  \ CSS 而不是图形，你在显示和维护方面将具有更大的灵活性。在整个章节中，你学到只需在样式表中添加条目，就可以将普通的下划线链接变为带有边框、背景颜色和其他文本式的区域。此外，你还学习了如何展示嵌套列表。\n\
  \n## 问答\n\n**Q. 有大量的网页在讨论关于外边距和内边距（特别是列表周围）的“盒模型破解（box model hack）”。你确定我不需要使用 hack\
  \ 吗？**\n\n**A.** 在本章开始时，你学到本章（以及其他章节）中的 HTML 和 CSS 在当前主流网络浏览器的版本中看起来是一样的。这是多年来网络开发者在现代浏览器开始按照\
  \ CSS 规范而非其自身的奇特性来处理事务之前，必须进行代码 hack 和其他技巧的结果。此外，有一项日益增长的运动旨在让互联网用户摆脱那些导致大多数 hack\
  \ 变得成为必然的极旧网络浏览器。因此，虽然我不一定建议你*仅为当前主流网络浏览器的版本*进行设计，但也不会建议你花费大量时间为旧版本的浏览器实现 hack——这些浏览器的使用者占不到互联网人口的\
  \ 5%。\n\n**Q. CSS 图像映射看起来工作量很大。`<map/>` 标签有那么糟糕吗？**\n\n\n\n\n\n# A. `<map/>` 标签一点也不糟糕，并且在\
  \ XHTML 和 HTML5 中都是有效的。然而，客户端图像地图中使用的坐标确定可能非常困难，特别是当没有图形软件或专门用于创建客户端图像地图的软件时。CSS\
  \ 版本为你定义和显示点击区域提供了更多选项，而你在这里只看到了其中一种。\n\n## Q. 我可以在导航菜单中使用图形作为自定义列表指示器吗？\n\n## A.\
  \ 可以的。你可以在列表项的 HTML 文本中使用图形，或者将其作为背景图像放在 `<li>` 元素中。你可以像对任何其他列表元素一样对导航元素进行样式设置。HTML\
  \ 无序列表与基于 CSS 的水平或垂直导航列表之间的唯一区别在于，你称其为导航列表，并且你在正文之外的特定用途使用了无序列表。此外，你还可以对列表进行样式化，告诉用户它确实是与众不同的——你可以通过图形来突出你的列表。\n\
  \n## Q. 我可以在哪里找到更多关于如何使用列表的示例？\n\n## A. 我上一次检查时，在搜索引擎中输入 `CSS navigation` 大约返回了\
  \ 440 万 万结果。这里有几个起点：\n\n• List Apart 的 CSS 文章：[`www.alistapart.com/topics/code/`](http://www.alistapart.com/topics/code/)\n\
  • Maxdesign 的 CSS Listamatic：[`css.maxdesign.com.au/listamatic/`](http://css.maxdesign.com.au/listamatic/)\n\
  • Vitaly Friedman 的 CSS Showcase：[`www.alvit.de/css-showcase/`](http://www.alvit.de/css-showcase/)\n\
  \n## 工作坊\n\n工作坊包含测验题和活动，旨在帮助你巩固对所涵盖材料的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n### 测验\n\n\
  **1.** `inside` 和 `outside` `list-style-position` 值之间的区别是什么？哪一个是默认值？\n\n**2.** 值为\
  \ `none` 的 `list-style` 是否仍然产生结构化列表（无论有序还是无序）？\n\n**3.** 在创建基于列表的导航时，你可以使用多少层嵌套列表？\n\
  \n**4.** 在创建任何类型的导航列表时，`a` 选择器的四个伪类可以可以具有相同的值吗？\n\n### 答案\n\n**1.** `list-style-position`\
  \ 的值 `inside` 将列表项指示器放置在由列表项创建的块内部。`outside` 值将列表项指示器放置在块外部。当为 `inside` 时，内容会环绕在列表项指示器下方。默认值是\
  \ `outside`。\n\n**2.** 是的。唯一的区别是列表项内部的内容之前没有列表项指示器。\n\n**3.** 从技术上讲，你可以根据需要无限深度地嵌套列表。但从可用性的角度来看，你*想要*用于嵌套列表的层数是有限制的。三层通常是极限——超过这个数字，你就面临创建一个组织混乱的网站的风险，或者仅仅是给用户提供了比他们一直需要看到的多多的选项。\n\
  \n**4.** 当然可以，但你将面临用户没有意识到你精美的菜单确实是菜单的风险（因为鼠标操作不会产生任何视觉显示）。\n\n## 练习\n\n• 找到一张图片，并尝试使用本章所示的技术来映射区域。选择一张区域可以使用热点或点击区域的图片，这些区域可以通向你网站上的其他页面或他人的网站。然后创建\
  \ HTML 和 CSS 来定义点击区域以及它们应该指向的 URL。\n• 使用本节所示的多级垂直列表技术，为章节末尾创建的垂直列表添加子导航项。\n• 查看网站中使用的许多基于\
  \ CSS 的导航示例，并找到一些看起来复杂的动作。使用 浏览器的“查看源代码”功能，查看这些网站使用的 CSS，并尝试为自己实现类似的内容。\n\n# 第 12\
  \ 章 创建固定或流式布局\n\n* *\n\n在本章中你将学习到：\n\n• 固定布局是如何工作的\n• 流式布局是如何工作的\n• 如何创建固定/流式混合布局\n\
  \n* *\n\n到目前，你已经学习了许多关于 Web 内容样化的知识，从字体大小、颜色到图像、块元素、列表等。但尚未讨论的是页面布局的高级概述。通常情况下，布局有两种类型——固定和流式——但还有一种结合了这两者的布局，其中某些元素是固定的，而另一些元素是流式的。\n\
  \n在本章中，你将首先学习这两种布局的特点，并看到一些使用这些布局的网站示例。在章节末尾，你将看到一个结合了两种类型布局元素的基础模板。最终，决定哪种布局类型取决于你——只要你的网站遵循\
  \ HTML 和 CSS 标准，就很难出错。\n\n* *\n\n## 亲手尝试：寻找你喜欢的布局示例\n\n获取流式布局示例的一个好地方是 WordPress\
  \ 主题库：[`wordpress.org/extend/themes/`](http://wordpress.org/extend/themes/)。WordPress\
  \ 是一个博客平台，其作为非博客网站的使用率正日益增加。主题库展示了数百个固定宽度布局和流式布局的示例，这让你对自己可以创建的内容有一个直观的了解（即使没有获取到全部代码）。尽管你在此练习中没有使用\
  \ WordPress，但请花些时间看看这些示例，也许还有 CSS Garden：[`www.csszarden.com/`](http://www.csszarden.com/)。这可以帮助你对这些布局类型产生感觉，而不会被偏向某一方。\n\
  \n* *\n\n## 理解固定布局\n\n固定布局（或固定宽度布局）顾其实名：一种页面 `body` 被设置为特定宽度的布局。该宽度通常由一个主“包装器” `<div>`\
  \ 控制，内容包含其中。该 `<div>` 的 `width` 属性设置在 `style` 属性中，或者如果 `<div>` 被赋予如 `main` 或 `wrapper`\
  \ 等 ID 值，则设置在样式表中（尽管名称由你决定）。\n\n创建固定宽度布局时，最重要的决定是确定你想要适应的最小屏幕分辨率。多年来，800×600 一直是\
  \ Web 设计师的“最低标准”，导致典型的固定宽度约为 760 像素。然而，自 2007 年以来，使用 800×600 屏幕分辨率的人数小于 8%（目前为 4%）。鉴于此，许多\
  \ Web 设计师认为 1024×768 是目前的最小屏幕分辨率，导致固定宽度设计范围在 800 到 1000 像素之间。\n\n* *\n\n### 注意事项\n\
  \n记住， 浏览器窗口包含不可见的区域，包括滚动条。因此，如果你的目标是 1024 像素宽的屏幕分辨率，你实际上无法使用全部 1024 个像素。\n\n* *\n\
  \n创建固定宽度布局的一个主要原因是为了让你对内容区域的外观进行精确控制。但是，如果用户用比你设计时设想的更小或大得多的分辨率访问你的固定宽度网站，他们可能会遇到滚动条（如果分辨率较小）或大量的空白区域（如果分辨率较大）。\n\
  \n\n\n\n\n当前的 [ESPN.com](http://ESPN.com) 首页提供了该问题的一个视觉示例；它的内容区域固定为 964 像素宽。在图 12.1\
  \ 中，浏览器窗口宽度略小于 800 像素。在图片的右侧，重要内容被截断了（在图底部，浏览器显示了一个水平滚动条）。\n\n**图 12.1** 针对较小屏幕尺寸的固定宽度示例。\n\
  \n![image](img/12fig01.jpg)\n\n然而，图 12.2 显示了当浏览器窗口大于 1400 像素时，该网站看起来是什么样子：在主体内容的两侧有大量的空白（或““空间”）。\n\
  \n**图 12.2** 针对较大屏幕尺寸的固定宽度示例。\n\n![image](img/12fig02.jpg)\n\n在创建固定宽度布局时，还有另一个考虑因素：是将内容左对齐还是将其居中。内容左对齐只会在右侧产生额外空间；而内容区域居中则会在两侧都产生额外空间。\n\
  \n### 理解流式布局\n\n*流式布局*（liquid layout）也称为流体布局（fluid layout），是指页面主体不使用指定的像素宽度，尽管它可能被封装在一个使用百分比宽度的主“包装器”`<<div>`\
  \ 中。流式布局背后的想法是，即使使用户拥有非常小或非常宽的屏幕，它也可以完美使用并保留整体设计美感。\n\n三个流式布局的运行示例显示在图 12.3、12.4\
  \ 和 12.5 中。\n\n**图 12.3** 在较小屏幕上看到的流式布局。\n\n![image](img/12fig03.jpg)\n\n**图 12.4**\
  \ 在极小屏幕上看到的流式布局。\n\n![image](img/12fig04.jpg)\n\n**图 12.5** 在宽屏幕上看到的流式布局。\n\n![image](img/12fig05.jpg)\n\
  \n在图 12.3 中，浏览器窗口宽度约为 770 像素。这个示例显示了在水平滚动条出现之前合理的最小屏幕宽度。事实上，直到浏览器窗口达到 735 像素宽时，滚动条才会出现。另一方面，图\
  \ 12.4 显示了一个非常小的浏览器窗口（545 像素宽）。\n\n在图 12.4 中，你可以看到一个水平滚动条；在页面内容的页眉区域，Logo 图形开始覆盖文本并显示在文本上方。但页面的大部分仍然非常实用。页面左侧的信息内容仍然清晰可见，并且它与右侧的输入表单共享可用空间。\n\
  \n图 12.5 显示了同一个页面在极宽屏幕上的样子。\n\n在图 12.5 中，浏览器窗口约为 1330 像素宽。有足够的空间让页面上的所有内容展开。这种流式布局之所以实现，是因为所有的设计元素都指定了百分比宽度（而不是固定宽度）。通过这样做，布局利用了所有可用的浏览器空间。\n\
  \n流式布局方法乍看可能是最佳方案——毕竟，谁不想利用所有可用的屏幕空间呢？利用空间与不让内容“呼吸”之间有一条微妙的界限。内容过多会让人应接 overwhelming；而在开放空间内内容太少则会显得平淡。\n\
  \n纯流式布局可能非常令人深刻，但它需要大量的测试，以确保它在不同屏幕分辨率的各种浏览器中都可用。你可能没有时间和精力制作这样的设计；在这种情况下，合理的折中方案是固定/流式混合布局。\n\
  \n### 创建固定/流式混合布局\n\n*固定/流式混合*（fixed/liquid hybrid）布局包含两种类型布局的元素。例如，你可以有一个流式布局，在主体区域内或作为锚点元素（如左侧列或顶部导航条）包含固定宽的内容区域。你甚至可以创建一个像框架一样的固定内容区域，正如你将在第\
  \ 20 章“使用窗口和框架”中所看到的，在其中即使使用户滚动内容，固定内容区域也保持固定。\n\n#### 从基础布局结构开始\n\n在这个示例中，你将学习创建一个流式的模板，但在主体区域的两侧有两个固定宽的列（如果你仔细想的话，这就是第三列，只是比其他列宽得多）。模板还具有划分好的页眉和页脚区域。代码列表\
  \ 12.1 显示了此布局的基础 HTML 结构。\n\n代码列表 12.1 这种布局的基础 HTML 结构\n\n```\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0//EN\"\
  \ \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\">\n<html lang=\"en\">\n<head>\n\
  \  <title>Sample Layout</title>\n  <link href=\"layout.css\" rel=\"stylesheet\"\
  \ type=\"text/css\" />\n</head>\n<body>\n  <div id=\"header\">HEADER</div>\n  <div\
  \ id=\"wrapper\">\n    <div id=\"content_area\">CONTENT</div>\n    <div id=\"left_side\"\
  >LEFT SIDE</div>\n    <div id=\"right_side\">RIGHT SIDE</div>\n  </div>\n  <div\
  \ id=\"footer\">FOOTER</div>\n</body>\n</html>\n```\n\n首先，注意样式表是通过 `<link>` 标签引用的。因为这被用于多个页面，你希望在一个地方控制样式——即样式表。\n\
  \n接下来，你会注意到 HTML 极其基础。而且说实话，这种基础结构可以用于固定布局、流式布局或混合布局，因为实际的布局发生在样式表中。\n\n在此阶段，`layout.css`\
  \ 文件仅包含：\n\n```\nbody {\n  margin:0;\n  padding:0;\n}\n```\n\n如果你查看代码列表 12.1 中的\
  \ HTML 并对自己说：“但这些 `div` 元素只会堆叠在一起”，那么你是正确的。正如图 12.6 所示，没有任何布局可言。\n\n**图 12.6** 一个未对\
  \ `div` 元素应用样式的基础 HTML。\n\n![image](img/12fig06.jpg)\n\n#### 在固定/流式布局中定义列\n\n我们可以从简单的事情开始。因为这种布局应该是流式的，我们知道在页眉和页脚区域放置的任何内容都会扩展窗口宽度，无论窗口窄或宽。\n\
  \n在样式表中添加以下代码，可以让页眉和页脚区域的宽度都达到 100%，并具有相同的背景颜色：\n\n```css\n#header {\n  float: left;\n\
  \  width: 100%;\n  background-color: #7152F4;\n}\n\n#footer {\n  float: left;\n\
  \  width: 100%;\n  background-color: #7152F4;\n}\n```\n\n\n\n\n\n```css\npadding-right:\
  \ 125px;\n}\n```\n\n使用这两个 `padding` 定义本质上是为了为页面左右两侧的两个固定宽度列留出空间。左列宽度为 200 像素，右列宽度为\
  \ 125 像素，且每列将有不同的背景颜色。但我们还必须将项目相对于相对于 HTML 未应用样式时的放置位置进行定位（请参见 图 12.6）。这意味着要在这些列的样式表条目中添加\
  \ `position: relative`。此外，我们指示了 `<div>` 元素应该向左浮动。\n\n但在 `left_side <div>` 的情况下，我们还指示了希望最右侧的外边距距离边缘内\
  \ 200 像素（这除了列本身定义为 200 像素宽之外）。我们还希望左侧的外边距为完全的负外边距（negative margin）；这将将其拉到位置（你很快就会看到）。`right_side\
  \ <div>` 不包含 `right` 值，但它右侧包含了一个负外边距：\n\n```css\n#left_side {\n  position: relative;\n\
  \  float: left;\n  width: 200px;\n  background-color: #52f471;\n  right: 200px;\n\
  \  margin-left: -100%;\n}\n\n#right_side {\n  position: relative;\n  float: left;\n\
  \  width: 125px;\n  background-color: #f452d5;\n  margin-right: -125px;\n}\n```\n\
  \n此时，让我们也定义内容区域，使其具有白色背景，占据可用区域的 100%，，并相对于其位置向左浮动：\n\n```css\n#content_area {\n\
  \  position: relative;\n  float: left;\n  background-color: #ffffff;\n  width: 100%;\n\
  }\n```\n\n此时，基础布局看起来将像 图 12.7 所示，区域界限清晰。\n\n**图 12.7** 在应用某些样式后的基础 HTML 模板。\n\n\
  ![image](img/12fig07.jpg)\n\n然而，如果窗口缩减到某些宽度以下，此模板就会有问题。因为左列宽为 200 像素，右列宽为 125 像素，且你希望内容区域至少有一些文本，你可以想象如果窗口宽度只有\
  \ 350 到 400 像素，此页面将会崩溃。图 12.8 显示了当窗口缩放到略小于 400 像素宽（确切来说是 390 像素）时发生的情况。\n\n**图 12.8**\
  \ 缩放到 400 像素以下的基础 HTML 模板：糟糕！\n\n![image](img/12fig08.jpg)\n\n### 设置布局的最小宽度\n\n\
  尽管用户不太可能使用宽度小于 400 像素的浏览器访问你的网站，但该示例在本书范围内具有其作用。你可以推断并广泛应用这些信息：即使在固定/流混合网站中，除非你采取措施，否则你的布局会在某一点崩溃。\n\
  \n这种“措施”就是使用 `min-width` 属性`min-width` 属性设置元素的最小宽度，不包括内边距、边框或外边距。图 12.9 显示了当 `min-width`\
  \ 应用于 `<body>` 元素时发生的情况。\n\n图 12.9 显示了向右滚动后右列的一点点，但关键在于，当在最小宽度以下缩放时，布局不会崩溃。在这种情况下，最小宽度为\
  \ 525 像素：\n\n```css\nbody {\n  margin: 0;\n  padding: 0;\n  min-width: 525px;\n\
  }\n```\n\n**图 12.9** 缩放到 400 像素以下的基础 HTML 模板：更好！\n\n![image](img/12fig09.jpg)\n\n\
  此示例中出现水平滚动条是因为浏览器窗口本身小于 500 像素。当窗口略大于 525 像素宽时，滚动条消失，而当浏览器约为 875 像素宽时，它绝对完全消失了（参见\
  \ 图 12.10）。\n\n**图 12.10** 在大于 800 像素的浏览器窗口中查看的基础 HTML 模板。\n\n![image](img/12fig10.jpg)\n\
  \n### 在固定/流混合布局中处理列高度\n\n这个示例很好，但除了一个问题外：它没有内容。当内容被添加到各种元素中时，会产生更多问题。如 图 12.11 所示，列的高度将根据其包含的内容增长。\n\
  \n**图 12.1** 列的高度仅与其内容等高。\n\n![image](img/1.jpg)\n\n由于你无法保证用户的浏览器是固定的，或者内容始终保持不变，你可能会认为这在固定/流布局中存在问题。除非你采取措施，你可以应用一些样式将它们结合在一起。首先，在样式表中为\
  \ `left_side`、`right_side` 和 `content_area` ID 添加以下声明：\n\n```css\nmargin-bottom:\
  \ 2000px;\npadding-bottom: 2000px;\n```\n\n这些声明增加了大量的内边距并为底部分配了巨大的外边距。你还必须在样式表中添加\
  \ `position: relative` 以便它是可见的。此时，页面看起来像 图 12.2。\n\n**图 12.2** 尽管列中有内容，颜色字段现在可见了。\n\
  \n![image](img/2.jpg)\n\n为了裁剪掉所有额外的颜色，为 `wrapper` ID 添加以下内容：\n\n```css\noverflow:\
  \ hidden;\n```\n\n图 12.3 显示了结果：具有必要的列间距的固定宽度布局。\n\n**图 12.3** 恭喜！这是一个固定宽度布局。\n\n\
  ![image](img/13.jpg)\n\n完整的 HTML 代码可以在 列表 12.2 中看到，最终的样式表见 列表 12.3。\n\n#### 列表 12.2\
  \ 基础固定宽度布局结构（带内容）\n\n\n\n\n\n立即行动！\n\n</div>\n</div>\n<div id=\"footer\"> 版权信息通常位于此处的。</div>\n\
  \n</body>\n</html>\n\n## 列表 12.3 固定宽度/流式混合布局的完整样式表\n\n```css\nbody {\n  margin:0;\n\
  \  padding:0;\n  min-width: 525px;\n}\n#header {\n  float: left;\n  width:100%;\n\
  \  background-color: #ffffff;\n}\n\n#footer {\n  float: left;\n  width:100%;\n \
  \ background-color: #7152f4;\n  font-size: 8pt;\n  font-weight: bold;\n  text-align:\
  \ center;\n  position: relative;\n}\n\n#wrapper {\n  float: left;\n  padding-left:\
  \ 200px;\n  padding-right: 125px;\n  overflow: hidden;\n}\n\n#left_side {\n  position:\
  \ relative;\n  float: left;\n  width: 200px;\n  background-color: #52f471;\n  right:\
  \ 200px;\n  margin-left: -100%;\n  padding-bottom: 2000px;\n  margin-bottom: -2000px;\n\
  }\n\n#right_side {\n  position: relative;\n  float: left;\n  width: 125px;\n  background-color:\
  \ #f452d5;\n  margin-right: -125px;\n  padding-bottom: 2000px;\n  margin-bottom:\
  \ -2000px;\n}\n\n#content_area {\n  position: relative;\n  float: left;\n  background-color:\
  \ #ffffff;\n  width: 100%;\n  padding-bottom: 2000px;\n  margin-bottom: -2000px;\n\
  }\n\n#left_side ul {\n  list-style: none;\n  margin: 12px 0px 0px 12px;\n  padding:\
  \ 0px;\n}\n\n#left_side li a:link, #nav li a:visited {\n  font-size: 12pt;\n  font-weight:\
  \ bold;\n  padding: 3px 0px 3px 3px;\n  color: #000000;\n  text-decoration: none;\n\
  \  display: block;\n}\n\n#left_side li a:hover, #nav li a:active {\n  font-size:\
  \ 12pt;\n  font-weight: bold;\n  padding: 3px 0px 3px 3px;\n  color: #ffffff;\n\
  \  text-decoration: none;\n  display: block;\n}\n```\n\n## 总结\n在本章中，你看到了三种主要布局类型的实际示例：固定宽度布局、流式布局以及固定/流式混合布局。在章节的第三节中，你看到了一个扩展示例，它带你逐步完成了创建固定/流式混合布局的过程，其中\
  \ HTML 和 CSS 均能通过验证。请记住，创建布局最重要的部分是确定你认为设计中可能需要考虑的内容区域。\n\n## 问答\n\n**问：我听说过一种叫做`弹性布局`的东西。它和流式布局有什么不同呢？**\n\
  \n**答：** `弹性布局`是一种内容区域在用户调整文本大小时会随之改变的布局。弹性布局使用 `ems`，这种单位在本质上与文本和字体大小成比例。一个 `em`\
  \ 是排版测量单位，等于当前字体的字号。在弹性布局中使用 `ems` 时，如果用户通过按 Ctrl 键并使用鼠标滚轮强制增大或缩小文本尺寸，包含文本的区域将按比例增大或缩小。弹性布局非常难以实现，由于完善它们需要花费大量时间，它们更多地出现在作品集中，而非实际应用。\n\
  \n**问：你花了大量时间讨论流式布局或混合布局。它们比纯的固定宽度布局更好吗？**\n\n**答：** “更好”是一个主观术语；在书中，我们关注的是符合标准的代码。大多数设计师会告诉你，流式布局的创建（和完善）需要更长的时间，但可用性的提升是值得的。什么情况下时间可能不值呢？如果你的客户没有意见，而且他们支付你的是固定费用而不是小时费，那么可能就不值了。在这种情况下，你工作仅仅是为了展示自己的技能——无论如何，这对你来说可能是值得的。\n\
  \n## 工作坊\n工作坊包含测试题和活动，帮助你巩固对所涵盖材料的理解。在查看后面的 `答案` 部分之前，尝试回答所有问题。\n\n#### 测验\n**1.**\
  \ 一般来说，哪种布局最好：固定宽度的、流式的还是混合的？\n\n**2.** 你可以将固定宽度布局放置在页面的任何位置吗？\n\n**3.** `min-width`\
  \ 的作用是什么？\n\n#### 答案\n**1.** 这是一个道陷阱题；没有所谓的“最佳”布局。它取决于你的内容和需求。\n\n**2.** 是的。虽然固定宽度布局通常居中，但你可以将其放置在哪里。\n\
  \n**3.** `min-width` 属性设置元素的最小宽度。\n\n## 练习\n**图 12.3** 显示了固定/流式混合布局。\n\n- 尝试在浏览器中调整窗口大小，观察布局如何变化。\n\
  - 尝试修改 CSS 中的 `width` 值，观察布局的影响。\n- 尝试添加新的 `div` 元素并对其应用样式。\n\n\n\n\n\n- **Ruby**—[`www.ruby-lang.org/`](http://www.ruby-lang.org/)\n\
  \n### 注意事项\n\n尽管名称相同，但 `JavaScript` 并不是名为 `Java` 的面向对象编程语言的派生版本或其他任何亲戚。`Java` 由\
  \ Sun Microsystems 于 1995 年发布，与服务器端脚本语言 `JSP` 关系非常密切。`JavaScript` 由 Netscape Communications\
  \ 同样于 1995 年创建，命名是为了表示它在外观上与 `Java` 相似，但两者之间没有直接联系。\n\n另一方面，`client-side scripting`（客户端脚本）指的是在你的浏览器内部运行的脚本；脚本的运行不需要与\
  \ Web 服务器进行交互。目前为止，最流行的客户端脚本语言是 `JavaScript`。多年来，研究显示超过 93% 的网页浏览器都启用了 `JavaScript`。\n\
  \n另一个客户端脚本语言是微软的 `VBScript`（Visual Basic 脚本版）。这种语言仅在 Microsoft Internet Explorer\
  \ 网页浏览器中可用，因此，除非你确定用户将使用该浏览器访问你的网站（例如在封闭的企业内部环境中），否则不应使用它。\n\n### 在 HTML 中引入 JavaScript\n\
  \n本章的大部分是对 第 4 章 的复习；我认为在 HTML 和 CSS 章节之后、开始高强度客户端应用程序编程之前，回顾一些 `JavaScript` 的基础知识是个好主意。\n\
  \n如果你还记得，`JavaScript` 代码可以存在文件中的两个位置之一：\n\n- 在具有 `.js` 扩展名的独立文件中\n- 直接写在你的 HTML\
  \ 文件中\n\n外部文件通常用于脚本库（你可以在许多页面中复用的代码），而直接出现在 HTML 文件中的代码往往是为了实现特定特定页面的功能。无论你的 `JavaScript`\
  \ 位于何处，浏览器都会通过使用 `<script></script>` 标签对来感知它的存在。\n\n当你将 `JavaScript` 存储在外部文件中时，按如下方式引用：\n\
  \n```html\n<script type=\"text/javascript\" src=\"/path/to/script.js\">\n```\n\n\
  这些 `<script></script>` 标签通常放置在 `<head></head>` 标签之间，因为从严格来说来说，它们不属于页面 `<body>` 的内容。相反，`<script>`\
  \ 提供了一组 `JavaScript` 函数或其他信息，页面的其他部分可以使用它们。不过，你也可以只需将 `JavaScript` 函数或代码片段封装在 `<script>`\
  \ 中，并根据需要放在页面的任何地方。列表 13.1 显示了一个放置在 HTML 文档 `<body>` 中的 `JavaScript` 代码段示例。\n\n\
  ### 列表 13.1 使用 JavaScript 打印文本\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>JavaScript Example</title>\n  </head>\n  <body>\n    <h1>JavaScript Example</h1>\n\
  \    <p>This text is HTML.</p>\n    <script type=\"text/javascript\">\n      <!--\
  \ 对旧版浏览器隐藏脚本\n      document.write('<p>This text comes from JavaScript.</p>');\n\
  \      // 停止隐藏脚本 -->\n    </script>\n  </body>\n</html>\n```\n\n在 `<script></script>`\
  \ 标签之间是一个单一的 `JavaScript` 命令，它输出以下 HTML：\n\n```html\n<p>This text comes from JavaScript.</p>\n\
  ```\n\n当浏览器渲染此 HTML 页面时，它看到 `<script></script>` 标签之间的 `JavaScript`，停止毫秒以执行该命令，然后返回渲染输出，此时输出已包含了\
  \ `JavaScript` 命令输出的 HTML 内容。图 13.1 显示该页面的外观与其他任何 HTML 页面完全一样。它是一个 HTML 页面，但 HTML\
  \ 中只有一小部分来自 `JavaScript` 命令。\n\n**图 13.1** `JavaScript` 代码段的输出看起来与其他任何输出无异。\n\n\
  ![image](img/13fig01.jpg)\n\n### 注意事项\n\n你可能注意到了 列表 13.1 中的这两行代码：\n\n```html\n<!--\
  \ 对旧版浏览器隐藏脚本\n// 停止隐藏脚本 -->\n```\n\n这是一段 HTML 注释。`<!--` 开始和 `-->` 结束之间的任何内容在源代码中可见，但不会被浏览器渲染。在这种情况下，\
  \ `JavaScript` 代码被 HTML 注释包围，以防你的访问者正在运行非常旧的网页浏览器或关闭了 `JavaScript`。\n\n### 显示随机内容\n\
  \n你可以使用 `JavaScript` 在每次加载页面时显示不同的内容。也许你拥有一组文本或图像，觉得它们足够有趣可以包含在你的页面中？\n\n我非常迷恋一句好的格言。如果你和我一样，你可能会发现向网页中加入一个不断变化的引言很有趣。要创建一个每次加载页面时都变化的引言的页面，你必须首先收集你所有的引言及其相应的来源。然后你将这些格言放入数组中。这些格言放入\
  \ `array`，是编程语言中用于存储项目的实用工具。`JavaScript` 用于随机抽取一个引言非常简单。[列表 13.2 随机引言\n\n### 列表\
  \ 13.2 随机引言页面\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Quotable Quotes</title>\n  </head>\n  <script type=\"text/javascript\"\
  >\n      <!-- 对旧版浏览器隐藏脚本\n      function getQuote() {\n        // 创建数组\n       \
  \ quotes = new Array(4);\n        sources = new Array(4);\n        // 用引言初始化数组\n\
  \        quotes[0] = \"当我 14 岁时，我父亲是那么无知……但当我 21 岁时，我很惊讶于他在 7 年里学到了这么多...\";\n \
  \       sources[0] = \"Mark Twain\";\n        quotes[1] = \"每个人都是无知的，只是课题不同...\"\
  ;\n        sources[1] = \"Will Rogers\";\n        quotes[2] = \"人们在葬礼上对人的评价是那么美好，这让我感到难过，我将仅仅错过我的那几天。\"\
  ;\n        sources[2] = \"Garrison Keillor\";\n        quotes[3] = \"同义词的另一种说法是什么？\"\
  ;\n        sources[3] = \"Steven Wright\";\n        // 获取数组的随机索引\n        i = Math.floor(Math.random()\
  \ * quotes.length);\n        // 将引言写入 HTML\n        document.write(\"<dl style='background-color:\
  \ lightpink'>\\n\");\n        document.write(\"<dt>\" + \"\\\"<em>\" + quotes[i]\
  \ + \"</em>\\\"\\n\");\n        document.write(\"<dd>\" + \"- \" + sources[i] +\
  \ \"\\n\");\n        document.write(\"<dl>\\n\");\n      }\n      // 停止隐藏脚本 -->\n\
  \    </script>\n  <body>\n    <h1>Quotable Quotes</h1>\n    <p>以下是一句随机的引言。要看新的引言，请刷新此页面。</p>\n\
  \    <script type=\"text/javascript\">\n      <!-- 对旧版浏览器隐藏脚本\n      getQuote();\n\
  \      // 停止隐藏脚本 -->\n    </script>\n  </body>\n</html>\n```\n\n\n\n\n如果你仔细观察代码，你会看到类似下面的几行：\n\
  \n```javascript\n// Create the arrays\n\nand\n\n// Initialize the arrays with quotes\n\
  ```\n\n这些是代码注释。开发者使用这些注释在代码中留下标记，以便任何阅读代码的人都能了解代码在特定位置在做什么。在第一个关于创建数组的注释之后，你可以看到了两个数组——一个名为\
  \ `quotes`，另一个名为 `sources`——每个数组都包含四个元素：\n\n```javascript\nquotes = new Array(4);\n\
  sources = new Array(4);\n```\n\n在第二个注释（关于用引号初始化数组）之后，数组中添加了四个项。我们将仔细观察其中之一，即马克·吐温（Mark\
  \ Twain）引用的第一句名言：\n\n```javascript\nquotes[0] = \"When I was a boy of 14, my father\
  \ was so \" +\n\"ignorant...but when I got to be 21, I was astonished at \" +\n\"\
  how much he had learned in 7 years.\";\nsources[0] = \"Mark Twain\";\n```\n\n你已经知道数组的名为\
  \ `quotes` 和 `sources`。但赋值给值的变量（在本例中）被称为 `quotes[0]` 和 `sources[0]`。因为 `quotes`\
  \ 和 `sources` 是数组，数组中的每项将有它们自己的位置。使用数组时，数组中的第一个项不在 #1 号槽中，而是在 #0 号槽。换句话说，你从 0 开始计数而不是\
  \ 1。因此，第一句名言的文本（一个值）被赋值给 `quotes[0]`（一个变量）。同样，第一个来源的文本被赋值给 `source[0]`。\n\n文本字符串由引号包含。然而，在\
  \ JavaScript 中，换行表示命令的结束，因此以下内容会导致代码出现问题：\n\n```javascript\nquotes[0] = \"When I\
  \ was a boy of 14, my father was so\nignorant...but when I got to be 21, I was astonished\
  \ at\nhow much he had learned in 7 years.\";\n```\n\n因此，你会看到字符串是由系列包含在引号中的字符串构建的，并用加号（`+`）连接这些字符串。\n\
  \n下一段代码看起来最像编程；这一行获取一个随机数：\n\n```javascript\ni = Math.floor(Math.random() * quotes.length);\n\
  ```\n\n但你不能随便挑选任何随机数，因为随机数的目的是确定应该打印哪些名言和来源——而只有四句名言。所以，这行 JavaScript 执行了以下操作：\n\
  \n- 使用 `Math.random()` 获取一个 0 到 1 之间的随机数。例如，0.5482749 可能是 `Math.random()` 的结果。\n\
  - 将随机数乘以 `quotes` 数组的长度，当前长度为 4；数组的长度是数组中元素的数量。如果随机数是 0.5482749（如之前所示），乘以 4 得到 2.1930996。\n\
  - 使用 `Math.floor()` 将结果向下取整到最近的整数。换句话说，2.1930996 变成了 2。\n- 给变量 `i` 赋值为 2。\n\n函数的其余部分看起来很熟悉，但有几个例外。首先，正如你在本章稍之前学到的，`document.write()`\
  \ 用于写入 HTML，然后由浏览器进行渲染。接下来，字符串被分开，以明确何时需要进行不同的处理，例如在应该原样打印引号（\\”）或替换变量值时使用反斜杠对引号进行转义。打印的实际名言和来源是与\
  \ `quotes[i]` 和 `sources[i]` 匹配的项，其中 `i` 是由之前所示数学函数指定的数字。\n\n但仅仅编写函数并不意味着会创建任何输出。在\
  \ HTML 的后续部分，你可以在两个 `<script></script>` 标签之间看到 `getQuote()`；这就是调用函数的方式。无论在何处调用该函数，函数的输出将被放置在那里。在这个示例中，输出显示在介绍引言的段落下方。\n\
  \n图 13.2 显示了在网络浏览器加载时的“可引用名言”（Quotable Quotes）页面。当页面刷新时，有四分之一的机会显示不同的名言——毕竟，它是随机的！\n\
  \n**图 13.2** “可引用名言”页面每次加载时都会显示一句随机名言。\n\n![image](img/13fig02.jpg)\n\n请记住，你可以轻松修改此页面以包含你自己的名言或其他你想随机显示的文本。你还可以通过在代码中的\
  \ `quotes` 和 `sources` 数组中添加更多条目来增加可用名言的数量。\n\n如果你将“可引用名言”页面作为起点，你可以轻松更改脚本并对这个想法创建你自己的有趣变体。如果你在此过程中犯了错误也没关系。解决脚本代码错误的诀窍是保持耐心并仔细分析你输入的代码。你可以始终删除代码来简化脚本直到它运行，然后一次添加一段新代码，以确保每个部分都能正常工作。\n\
  \n### 理解文档对象模型\n\n使用 JavaScript 进行客户端交互通常采取某种方式操作 DOM 的形式。DOM 是所有文档的隐形结构——而不是 HTML\
  \ 结构或你应用格式层级的方式。\n\n\n\n\n以下代码段在图 13.3 底部显示的五张图片中创建了第四张小图。`onmouseover` 事件表示，当用户将鼠标悬过此小图时，`document.product_img.src`（即大图插位）将被填充匹配大图片的路径。\n\
  \n```html\n<a href=\"#\" onmouseover=\"javascript:document.product_img.src = '/path/to/large4.jpg'\"\
  ><img src=\"/path/to/small4.jpg\" width=\"104\" height=\"104\" style=\"padding:\
  \ 4px; border: 0px\" alt=\"photo\" /></a>\n```\n\n图 13.4 显示了相同的页面——用户无需重新加载——当用户悬过页面底部的一张较小图片时，大图插位会被另一张填充。鼠标指针悬停在右起数第二张图片上。当用户悬过内部照片的小版本时，其大版本将显示在页面的顶部区域。\n\
  \n**图 13.4** 当用户悬过较小的图片时，大图会被替换。\n\n![image](img/13fig04.jpg)\n\n## 总结\n\n在这个简短的章节中，你回顾了服务器端脚本与客户端脚本之间的区别，并复习了如何在你的\
  \ HTML 文件中包含 JavaScript，以为你的网站添加一些交互性。你还学习了如何使用 JavaScript 的 `document.write()`\
  \ 方法在页面加载时显示随机引言。最后，你了解了 DOM 的本质。\n\n通过应用从之前章节中中学的知识，你学会了如何使用客户端脚本让网页上的图片对鼠标移动做出响应。这些任务并不需要太多的编程技能，但它们应该激励你继续读下去，并学习更多\
  \ JavaScript，以为你的页面提供更复杂的交互功能。\n\n## 问答\n\n**Q. 如果我想使用本章的随机引言脚本，但我希望有一个包含大量引言的库，我必须把所有的引言都放在每个页面中吗？**\n\
  \n**A.** 是的。数组中的每一项都必须存在。在这里，你可以开始看到可以在客户端处理的内容与最好在服务器端处理的内容之间的转折点。如果你有一个真正的随机引言库，并且任何时候只展示其中一个，最好的办法是将这些项存储在数据库表中，并使用一小段服务器端脚本连接到数据库、检索文本并将其打印在页面上。或者，你也可以一直通过\
  \ JavaScript 携带所有引言，但你至少应该将该 JavaScript 函数放在一个不同的文件中，以便与文本分开维护。\n\n**Q. 我见过一些在线目录，它们在似乎是位于网站内容上方的图层中显示大图。我看到底部的普通网站内容，但焦点在大图上。这是如何实现的？**\n\
  \n**A.** 这种描述听起来像是由一个名为 Lightbox 的 JavaScript 库创建的效果。Lightbox 库允许你通过放置在站点内容之上的图层来显示图片或图片集。这是一个流行的库，用于显示大图的细节，或者仅仅一组被认为足够重要而足以在内容“之上”展示的图片。（如需安装和使用它，请遵循软件随附的说明。你将能够利用到目前为止书中学到的知识将其集成到你的网站中。）\n\
  \n## 工作坊\n\n工作坊包含了测验题和练习题，帮助你巩固对所涵盖内容的理解。尝试在查看随后的“答案”部分之前回答所有问题。\n\n#### 测验\n\n\
  **1.** 你制作了一个按钮图片并将其命名为 button.gif。你还为按钮制作了一个简单的 GIF 动画，按钮会绿白闪烁。你将该 GIF 命名为 flashing.gif。你会使用什么\
  \ HTML 和 JavaScript 代码让按钮在用户移动鼠标指针到它上方时闪烁，并在用户点击按钮时链接到名为 gohere.html 的页面？\n\n**2.**\
  \ 你将如何修改为第 1 题编写的代码，使得按钮在用户移动鼠标到它上方时闪烁，并且即使鼠标移开也会继续闪烁？\n\n**3.** 在以下上下文中，加号（`+`）代表什么？\n\
  \n```javascript\ndocument.write('This is a text string ' + 'that I have created.');\n\
  ```\n\n#### 答案\n\n**1.** 你的代码可能看起来像这样：\n\n```html\n<a href=\"gohere.html\" onmouseover=\"\
  javascript:document.flasher.src='flashing.gif'\" onmouseout=\"javascript:document.flasher.src='button.gif'\"\
  ><img src=\"button.gif\" id=\"flasher\" style=\"border-style:none\" /></a>\n```\n\
  \n**2.** 你的代码可能看起来像这样：\n\n```html\n<a href=\"gohere.html\" onmouseover=\"javascript:document.flasher.src='flashing.gif'\"\
  ><img src=\"button.gif\" id=\"flasher\" style=\"border-style:none\" /></a>\n```\n\
  \n**3.** 加号（`+`）用于将两个字符串连接在一起。\n\n## 练习\n\n• 你是否有任何页面，如果导航图标或其他图片在鼠标经过过它们时发生变化，看起来会更闪亮或更易理解？如果是的话，尝试创建一些图片的突出显示版本，并尝试使用本章提供的信息修改你自己的页面。\n\
  \n• 你可以用之前在本章早期学习的通过 JavaScript 显示随机内容的方法来显示随机图片（例如图形横幅或广告）。不要打印文本，只需打印你想要显示的图片的\
  \ `<img/>` 标签。\n\n## 第 14 章。开始 JavaScript 编程\n\n* * *\n\n你将在本章中学习到：\n\n• 使用函数组织脚本\n\
  • 什么是对象以及 JavaScript 如何使用它们\n• JavaScript 如何响应事件\n• 条件语句和循环的导论\n• 浏览器如何按正确顺序执行脚本\n\
  • 避免 JavaScript 错误的语法规则\n• 添加注释以阐明你的 JavaScript 代码\n\n* * *\n\n上一个章节提醒了你 JavaScript\
  \ 是什么，JavaScript 能做什么，并让你创建了一个简单的脚本。\n\n在本章中，你将学习更多基础概念和脚本组件，你将在编写的每个脚本中用到它们。这将为你本书的后续章节做好准备，在那些章节中，我们将深入探讨特定的\
  \ JavaScript 函数和特性。\n\n### 基础概念\n\n在本书中你会遇到一些基础概念和术语。在接下来的章节中，你将学习 JavaScript 的基本构建块。\n\
  \n#### 语句\n\n语句是 JavaScript 程序的基本单元。语句是执行单一操作的代码段。例如，以下三个语句来自第 4 章“理解 JavaScript”中的日期和时间示例：\n\
  \n```javascript\nhours = now.getHours();\nmins = now.getMinutes();\nsecs = now.getSeconds();\n\
  ```\n\n虽然语句通常是单行 JavaScript，但这并不是规则——你可以将一个语句跨越多行，也可以在单行中包含多个语句。\n\n分号标记语句的结束。如果你在语句后另起一行，也可以省略分号。如果你将多个语句组合在单行中，必须使用分号分隔它们。\n\
  \n\n\n\n\n这是一个 `function` 的函数的示例。函数提供了一种处理任务的简单方法，例如向网页添加输出内容。JavaScript 包含了许多内置函数，你将在本书的其他部分学习这些内容。如上一个示例所示，使用函数的语句被称为\
  \ `function call`（函数调用）。\n\n函数接收 `parameters`（括号内的表达式）来告诉它们要执行什么。此外，函数可以向等待的变量返回一个值。例如，下面的函数调用会提示用户输入响应，并将其存储在\
  \ `text` 变量中：\n\n```\ntext = prompt(\"Enter some text.\")\n```\n\n你也可以创建自己的函数。这非常有用，主要基于两个原因：首先，你可以分离脚本的逻辑部分，使其更易理解。其次，更重要的一点是，你可以多次使用该函数，或者配合不同的数据使用它，以避免重复脚本语句。\n\
  \n### 变量\n\n在第 4 章中，你学习了变量是容器，可以存储数字、文本字符串或其他值。例如，以下语句创建了一个名为 `fred` 的变量并为其赋值了值\
  \ `27`：\n\n```\nvar fred = 27;\n```\n\nJavaScript 变量可以包含数字、文本字符串和其他值。你将在第 16 章中的“使用\
  \ JavaScript 变量、字符串和数组”中学习更多关于它们。\n\n### 理解对象\n\nJavaScript 还支持 `objects`（对象）。像变量一样，对象可以存储数据——但它们可以同时存储两个或多个数据。\n\
  \n存储在对象中的数据项被称为对象的 `properties`（属性）。例如，你可以使用对象来存储关于人的信息，如地址录。每个人物对象的属性可能包括姓名、地址和电话号码。\n\
  \nJavaScript 使用句号来分隔对象名和属性名。例如，对于一个名为 Bob 的人物对象，属性可能包括 `Bob.address` 和 `Bob.phone`。\n\
  \n***\n\n注意\n\n我们在本章稍早讨论的 `document.write` 函数实际上是 `document` 对象的 `write` 方法，你已经见过它几次了。\n\
  \n***\n\n对象还可以包含 `methods`（方法）。这些是与对象数据工作的函数。例如，我们用于地址录的人物对象可能包含一个 `display()` 方法来显示人的信息。在\
  \ JavaScript 术语中，语句 `Bob.display()` 将显示 Bob 的详情。\n\n如果这听起来很困惑，不要担心——你将在本书的后半部分更详细地探索对象。现在，你只需要了解基础。JavaScript\
  \ 支持三种对象：\n\n• `Built-in objects`（内置对象）是内置在 JavaScript 语言中的。你已经在第 2 章中的“理解 HTML\
  \ 和 XHTML 连接”中遇到过其中一个 `Date`。其他内置对象包括 `Array` 和 `String`，你将在第 16 章中探索它们，以及 `Math`，它在第\
  \ 17 章中进行了解释。\n\n• `DOM (Document Object Model) objects` 代表浏览器和当前 HTML 文档的各种组件。例如，你在本章稍早使用的\
  \ `alert()` 函数实际上是 `window` 对象的一个方法。你将在第 15 章中的“使用文档对象模型 (DOM)”中更详细地探索它们。\n\n• `Custom\
  \ objects`（自定义对象）是你自己创建的对象。例如，如本节前面提到的，你可以创建一个 `person` 对象。\n\n### 条件判断\n\n虽然事件处理程序会在某事发生时通知你的脚本，但你可能也想自己检查某些条件。例如，用户是否输入了有效的电子邮箱地址？\n\
  \n***\n\n注意\n\n你将在第 18 章中的“使用条件和循环控制流程”中学习更多关于条件的内容。\n\n***\n\nJavaScript 支持 `conditional\
  \ statements`（条件语句），让你能够回答此类问题。一个典型的条件语句使用 `if` 语句，如示例所示：\n\n```\nif (count==1)\
  \ alert(\"The countdown has reached 1.\");\n```\n\n这会将变量 `count` 与常量 `1` 进行比较，如果它们相同，则向用户显示警告消息。你将在大部分脚本中使用像这样的条件语句。\n\
  \n### 循环\n\nJavaScript（以及大多数其他编程语言）另一个有用功能是创建 `loops`（循环）的能力，即重复执行特定次数的语句组。例如，这些语句会显示相同的警告\
  \ 10 次，极大地骚扰了用户：\n\n```\nfor (i=1; i<=10; i++) {\n    alert(\"Yes, it's yet another\
  \ alert!\");\n}\n```\n\n`for` 语句是 JavaScript 用于循环的几种语句之一。这正是计算机应该擅长的事情——执行重复性任务。你将在许多脚本中使用循环，其方式比这个示例要有用得多。\n\
  \n### 事件处理程序\n\n如第 1 章所示，并不是所有脚本都位于 `<script>` 标签内。你也可以将脚本作为 `event handlers`（事件处理程序）。虽然这听起来像是一个复杂的编程术语，但它实际上就是它的字面意思：事件处理程序是处理事件的脚本。你已经在第\
  \ 11 章中的“使用 CSS 处理列表、文本和导航”中稍微了解了一点事件。\n\n在现实生活中，事件是发生在你身上的事情。你写在日历上的事情就是事件：“医生预约”或“生日”。你也会遇到计划外的事件：交通罚单、税务审计或亲戚的突然拜访。\n\
  \n无论事件是计划内的还是计划外的，你可能都有处理方法。你的事件处理程序可能包括：“生日到了，送他一份礼物”或“当亲戚来访时，关灯假装家里没人”。\n\nJavaScript\
  \ 中的事件处理程序类似的：它们告诉浏览器在特定事件发生时做什么。JavaScript 处理的事件没有你处理的事件那么刺激——它们包括诸如“鼠标点击”和“页面加载完成”。然而，它们是\
  \ JavaScript 非常有用的一部分。\n\n许多 JavaScript 事件（如你之前看到的鼠标点击）是由用户引起的。与其按照固定顺序执行，你的脚本可以对用户的操作做出响应。其他事件并不直接涉及用户——例如，当\
  \ HTML 文档加载完成。每个事件处理程序与特定的浏览器对象关联，你可以在定义对象的标签中指定事件处理程序。例如，图像和文本链接有一个事件 `onMouseOver`，当指针移动到对象上方时触发。这是一个带有事件处理程序的典型\
  \ HTML 标签：\n\n```html\n<img src=\"button.gif\" onMouseOver=\"highlight();\">\n```\n\
  \n你将事件处理程序作为属性指定给 HTML 标签，并将处理事件的 JavaScript 语句包含在引号内。这是函数的理想用处，因为函数名短而明了，并且可以引用一系列语句。\n\
  \n请参在本章末的“自己尝试”部分查看 HTML 文档中事件处理程序的完整示例。\n\n### 哪个脚本先运行？\n\n你实际上可以在网页文档中包含多个脚本：一个或多个\
  \ `<script>` 标签、外部 JavaScript 文件以及任意数量的事件处理程序。有了所有这些脚本，你可能会好奇浏览器如何知道先执行哪一个。幸运的是，这是以逻辑方式完成的：\n\
  \n\n\n\n\n- HTML 文档中 `<head>` 区域内的 `<script>` 标签组会被首先处理，无论它们包含嵌入代码还是引用 JavaScript\
  \ 文件。由于这些脚本不会在网页中创建输出内容，因此它们是定义稍后使用的函数的好地方。\n- HTML 文档中 `<body>` 区域内的 `<script>`\
  \ 标签组会在 `<head>` 区域的脚本之后执行，此时网页正在加载和显示。如果 `<body>` 中中有多个脚本，它们将按顺序执行。\n- 事件处理器在相应事件发生时执行。例如，`onLoad`\
  \ 事件处理器会在网页主体加载时执行。由于`<head>` 区域在任何事件发生之前加载，因此你可以在那里定义函数并在事件处理器中使用它们。\n\n## JavaScript\
  \ 语法规则\n\nJavaScript 是一种简单的语言，但你确实需要小心地使用它的`syntax`——定义你如何使用该语言的规则。本书的其他部分涵盖了 JavaScript\
  \ 语法的许多方面，但为了避免错误，你应该理解几条基本规则。\n\n### 大小写敏感\n\nJavaScript 中的几乎所有内容都是**大小写敏感的**，这意味着你不能交替使用小写和大写字母。以下是一些通用规则：\n\
  \n- JavaScript 关键字（如 `for` 和 `if`）始终使用小写。\n- 内置对象（如 `Math` 和 `Date`）首字母大写。\n- DOM\
  \ 对象名称通常是小写的，但它们的方法通常是大写和小小写的组合。通常除了第一个单词以外的所有单词都使用大写字母，例如 `toLowerCase` 和 `getElementById`。\n\
  \n如果不确定，请遵循本书或其他 JavaScript 参考资料中使用的精确大小写。如果你使用了错误的大小，浏览器通常会显示错误信息。\n\n### 变量、对象和函数名称\n\
  \n当你定义自己的变量、对象或函数时，你可以选择它们的名称。名称可以包含大写字母、小写字母、数字和下划线（`_`）。名称必须以字母或下划线开头。\n\n你可以选择在变量名中使用大写或小写，但记住\
  \ JavaScript 是大小写敏感的：`score`、`Score` 和 `SCORE` 被视为三个不同的变量。确保每次引用变量时使用相同的名称。\n\n\
  ### 保留字\n\n关于变量名的另一个规则：它们不能是**保留字**。这些包括构成 JavaScript 语言的单词（如 `if` 和 `for`）、DOM\
  \ 对象名称（如 `window` 和 `document`）以及内置对象名称（如 `Math` 和 `Date`）。\n\n### 空格\n\n空白区域（程序员称为\
  \ `whitespace`）会被 JavaScript 忽略。你可以在一行中包含空格和制表符，或者包含空行，而不会导致错误。空白区域通常使脚本更具可读性。\n\
  \n### 使用注释\n\nJavaScript `comments` 允许你在脚本中包含文档。如果其他人尝试理解该脚本，或者即使在你长时间没有看它后自己尝试理解它，这都会非常有用。要在\
  \ JavaScript 程序中包含注释，请以两个斜杠作为该行的开头，如下例所示：\n\n```\n//this is a comment.\n```\n\n\
  你也可以在行的中间用两个斜杠开始注释，这对于记录脚本很有用。在这种情况下，斜杠之后该行上的所有内容都被视为注释并被浏览器忽略。例如，\n\n```javascript\n\
  a = a + 1; // 给 a 的值加 1\n```\n\nJavaScript 还支持 C 风格的注释，这种注释以 `/*` 开始，以 `*/` 结束。这些注释可以跨多行，如下例所示：\n\
  \n```javascript\n/*This script includes a variety\nof features, including this comment.\
  \ */\n```\n\n由于注释内的 JavaScript 语句会被忽略，因此 C 风格的注释经常用于**注释掉**代码段。如果你在调试脚本时想暂时让某些 JavaScript\
  \ 代码行不再生效，你可以在该部分的开头添加 `/*` 并在末尾添加 `*/`。\n\n> ### 注意\n> 因为这些注释是 JavaScript 语法的一部分，它们只在\
  \ `<script>` 标签内部或外部 JavaScript 文件中有效。\n\n### JavaScript 最佳实践\n\n你现在应该熟悉编写有效 JavaScript\
  \ 的基本规则了。除了遵循规则外，遵循`best practices` 也是一个好主意。以下实践可能不是强制要求的，但如果你遵循它们，将为你自己和他人节省一些麻烦。\n\
  \n- **大量使用注释**——这些注释让你的代码更容易被他人理解，也让你在以后编辑它们时更容易理解。它们对于标记脚本的主要划分也很有用。\n- **在每个语句末尾使用分号，且每行仅使用一个语句**——这将使你的脚本更容易调试。\n\
  - **尽可能使用单独的 JavaScript 文件**——这可以将 JavaScript 与 HTML 分离，使调试更容易，并鼓励你编写可以重用的模块化脚本。\n\
  - **避免针对特定浏览器**——随着你对 JavaScript 的深入，你将学到一些只在一个浏览器中有效的功能。除非绝对必要，否则请避免它们，并始终在多个浏览器中测试你的代码。\n\
  - **保持 JavaScript 的可选性**——不要使用 JavaScript 执行网站上的核心功能——例如，主导航链接。只要可能，没有 JavaScript\
  \ 的用户也应该可以使用你的网站，尽管它可能没有那么吸引人或方便。这种策略被称为 `progressive enhancement`（渐进式增强）。\n\n还有许多涉及\
  \ JavaScript 高级方面的最佳实践。\n\n## 动手试试：使用事件处理器\n\n为了结束本章，这里有一个事件处理器的简单示例。这将展示你如何设置事件（你将在整书中使用这种设置），以及\
  \ JavaScript 在没有 `<script>` 标签的情况下是如何工作的。\n\n列表 14.1 带有事件处理器的 HTML 文档\n\n```html\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ HTML 1.1//EN\"\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n  <title>Event Handler\
  \ Example</title>\n</head>\n<body>\n  <h1>Event Handler Example</h1>\n  <p>\n  \
  \  <a href=\"http://www.google.com/\" onclick=\"alert('Aha! An Event!');\">Go to\
  \ Google</a>\n  </p>\n</body>\n</html>\n```\n\n事件处理器通过 `<a>` 标签内的 `onclick` 属性定义：\n\
  \n```javascript\nonclick=\"alert('Aha! An Event!');\"\n```\n\n此事件处理器使用内置的 `alert()`\
  \ 函数在点击链接时显示消息。在复杂的脚本中，你通常会定义自己的函数作为事件处理器。图 14.1 显示了此示例的运行。\n\n**图 14.1** 点击链接时浏览器显示警告框。\n\
  \n![image](img/14fig01.jpg)\n\n你将在接下来的小时内使用类似的其他事件处理器，事件将在第 19 章中的“响应事件”中进行详细介绍。\n\
  \n> **提示：** 注意，点击警告框上的确定按钮后，浏览器会遵循 `<a>` 标签中定义的链接。你的事件处理器还可以阻止浏览器遵循链接，正如第 19 章中所描述。\n\
  \n## 总结\n\n在本章中，你接触了 JavaScript 编程和语法的几个组成部分：函数、对象、事件处理器、条件和循环。你还学习了如何使用 JavaScript\
  \ 注释使脚本更易读，并查看了事件处理器的简单示例。\n\n## 问答\n\nQ. 我听说“面向对象”这个术语应用于 C++ 和 Java 等语言。如果 JavaScript\
  \ 支持对象，那么它是面向对象的语言吗？\n\n\n\n\n\n## **A.** 是的，尽管它可能不符合某些人的严格定义。JavaScript 对象不支持像\
  \ `C++` 和 `Java` 等语言所支持的所有功能，尽管最新版本的 JavaScript 增加了更多面向对象的特性。\n\n## **Q. 有多个在不同时间执行的脚本似乎很令人困惑。我为什么要使用事件处理器？**\n\
  \n**A.** 事件处理器是处理网页内组件（如按钮、复选框和文本字段）的理想方式（在 JavaScript 中也是唯一的方式）。这种方式实际上更加方便。与其编写一个静静等待按钮被点击的脚本，你只需创建一个事件处理器并让浏览器为你等待即可。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”之前，尝试回答所有问题。\n\n### 测验\n\n**1.**\
  \ 用户点击鼠标按钮时执行的脚本是哪什么的示例？\n\n**a.** 一个对象\n\n**b.** 事件处理器\n\n**c.** 不可能实现\n\n**2.**\
  \ 下列哪些是 JavaScript 函数的功能？\n\n**a.** 接受参数\n\n**b.** 返回值\n\n**c.** 以上两者都是\n\n**3.**\
  \ 浏览器首先执行的是哪一个？\n\n**a.** `<head>` 部分中的脚本\n\n**b.** `<body>` 部分中的脚本\n\n**c.** 按钮的事件处理器\n\
  \n### 答案\n\n**1.** b. 用户点击鼠标按钮时执行的脚本是一个事件处理器。\n\n**2.** c. 函数既可以接受参数，也可以返回返回值。\n\
  \n**3.** a. HTML 文档中 `<head>` 部分定义的脚本由浏览器首先执行。\n\n## 练习\n\n• 检查你在第 4 章中创建的 `Date`\
  \ 和 `Time` 脚本，并找到任何使用函数和对象的示例。\n\n• 为 `Date` 和 `Time` 脚本添加 JavaScript 注释，使每行代码的作用更加清晰。验证脚本是否仍正常运行。\n\
  \n## 第 15 章.使用文档对象模型 (DOM)\n\n* * *\n\n在本章你将学习到：\n\n• W3C DOM 标准如何让动态页面更容易控制\n•\
  \ `window` DOM 对象的基础\n• `document` DOM 对象的基础\n• `history` DOM 对象的基础\n• `location`\
  \ DOM 对象的基础\n• 如何处理节点、父节点、子节点和兄弟节点\n• 如何访问和使用 DOM 节点的属性\n• 如何访问和使用 DOM 节点方法\n• 如何用\
  \ JavaScript 控制定位\n• 如何用 JavaScript 隐藏和显示对象\n• 如何用 JavaScript 修改页面文本\n• 如何用 JavaScript\
  \ 向页面添加文本\n* * *\n\n上一章向你介绍了 JavaScript 编程的基本概念；本章将帮助你更好地理解文档对象模型 (DOM)，它是 JavaScript\
  \ 属性和方法显式控制的框架，让你能够开发丰富的用户体验。\n\n### 理解文档对象模型 (DOM)\n\nJavaScript 相比于纯 HTML 的一个优势是，这些客户端脚本可以在内容加载后直接在浏览器中操作网页文档及其内容。你的脚本可以向浏览器加载新页面，处理浏览器窗口和文档的部分内容，打开新窗口，甚至动态修改页面内的文本。\n\
  \n为了操作浏览器和文档，JavaScript 使用了一种名为 DOM 的父子对象层次结构。这些对象被组织成树形结构，代表了网页文档的所有内容和组件。\n\n\
  DOM 中的对象具有属性（描述网页的变量）和方法（允许你操作页面的函数）。要引用文档，你使用 `window` 的名称后接 `document`。例如，`window.document`。`document`\
  \ 代表网页。\n\n### 使用 `window`\n\n层次结构的顶端是 `window`，它代表当前窗口。你可以使用 `window.document`\
  \ 或直接使用 `document`。\n\n**注意**\n`window` 对象是当前窗口。\n\n* * *\n\n可以有多个窗口，每个窗口都有自己的 `document`\
  \ 对象。如果正在使用多个窗口，可能会有多个 `window` 对象，每个都有自己的 `document`。你将学习更多关于窗口和框架的内容。\n\n`window`\
  \ 对象是当前页面。\n\n**图 15.1** `window` 对象。\n\n![image](img/151)\n\n### 使用 `document`\n\
  \n`document` 对象代表当前文档。在较早的章节中，你只使用过 `window.document.write`。\n\n**注意**\n你已经用过 `document.write`。\n\
  \n* * *\n\n因为 `window` 始终代表当前窗口，你可以使用 `window.document` 或直接使用 `document`。如果在使用多个框架，可能会有多个\
  \ `document` 对象，每个都有自己的 `window`。\n\n### 获取文档信息\n\n`document` 对象的若干属性包含了关于当前文档的基础信息：\n\
  \n`document.URL` 指定文档的 URL。这是一个简单的文本字段。你无法更改此属性。如果你需要引导用户到另一个位置，请使用 `window.location`\
  \ 对象，你将进一步学习。\n\n`document.title` 列出当前页面的标题，由 `<title>` 标签定义。\n\n`document.referrer`\
  \ 是用户在访问当前页面之前的页面 URL——通常是指向当前页面的页面。\n\n`document.lastModified` 是文档最后修改的日期。该日期随页面一起从服务器发送。\n\
  \n`document.cookie` 允许你为文档读取或设置 cookie。\n\n`document.images` 返回文档使用的图像集合。\n\n作为文档属性的一个示例，列表\
  \ 15.1 显示了一个短的 HTML 文档，它使用 JavaScript 显示其最后修改日期。\n\n```html\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\"\
  http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n<head>\n  <title>Displaying the Last Modified Date</title>\n\
  </head>\n<body>\n  <h1>Displaying the Last Modified Date</h1>\n  <p>This page was\
  \ last modified on:</p>\n</body>\n</html>\n```\n[/content] (注：由于原文文本在 HTML 代码块处不完整，我根据上下文补全了闭合标签以符合格式，但翻译部分已保持代码块不变)\
  \ 抱歉，您提供的原文在 HTML 部分似乎截断了，以下是基于您提供内容的完整译文：\n\n[content]\n\n## **A.** 是的，尽管它可能不符合某些人的严格定义。JavaScript\
  \ 对象不支持像 `C++` 和 `Java` 等语言所支持的所有功能，尽管最新版本的 JavaScript 增加了更多面向对象的特性。\n\n## **Q.\
  \ 有多个在不同时间执行的脚本似乎很令人困惑。我为什么要使用事件处理器？**\n\n**A.** 事件处理器是处理网页内组件（如按钮、复选框和文本字段）的理想方式（在\
  \ JavaScript 中也是唯一的方式）。这种方式实际上更加方便。与其编写一个静静等待按钮被点击的脚本，你只需创建一个事件处理器并让浏览器为你等待即可。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”之前，尝试回答所有问题。\n\n### 测验\n\n**1.**\
  \ 用户点击鼠标按钮时执行的脚本是哪什么的示例？\n\n**a.** 一个对象\n\n**b.** 事件处理器\n\n**c.** 不可能实现\n\n**2.**\
  \ 下列哪些是 JavaScript 函数的功能？\n\n**a.** 接受参数\n\n**b.** 返回值\n\n**c.** 以上两者都是\n\n**3.**\
  \ 浏览器首先执行的是哪一个？\n\n**a.** `<head>` 部分中的脚本\n\n**b.** `<body>` 部分中的脚本\n\n**c.** 按钮的事件处理器\n\
  \n### 答案\n\n**1.** b. 用户点击鼠标按钮时执行的脚本是一个事件处理器。\n\n**2.** c. 函数既可以接受参数，也可以返回返回值。\n\
  \n**3.** a. HTML 文档中 `<head>` 部分定义的脚本由浏览器首先执行。\n\n## 练习\n\n• 检查你在第 4 章中创建的 `Date`\
  \ 和 `Time` 脚本，并找到任何使用函数和对象的示例。\n\n• 为 `Date` 和 `Time` 脚本添加 JavaScript 注释，使每行代码的作用更加清晰。验证脚本是否仍正常运行。\n\
  \n## 第 15 章.使用文档对象模型 (DOM)\n\n* * *\n\n在本章你将学习到：\n\n• W3C DOM 标准如何让动态页面更容易控制\n•\
  \ `window` DOM 对象的基础\n• `document` DOM 对象的基础\n• `history` DOM 对象的基础\n• `location`\
  \ DOM 对象的基础\n• 如何处理节点、父节点、子节点和兄弟节点\n• 如何访问和使用 DOM 节点的属性\n• 如何访问和使用 DOM 节点方法\n• 如何用\
  \ JavaScript 控制定位\n• 如何用 JavaScript 隐藏和显示对象\n• 如何用 JavaScript 修改页面文本\n• 如何用 JavaScript\
  \ 向页面添加文本\n* * *\n\n上一章向你介绍了 JavaScript 编程的基本概念；本章将帮助你更好地理解文档对象模型 (DOM)，它是 JavaScript\
  \ 属性和方法显式控制的框架，让你能够开发丰富的用户体验。\n\n### 理解文档对象模型 (DOM)\n\nJavaScript 相比于纯 HTML 的一个优势是，这些客户端脚本可以在内容加载后直接在浏览器中操作网页文档及其内容。你的脚本可以向浏览器加载新页面，处理浏览器窗口和文档的部分内容，打开新窗口，甚至动态修改页面内的文本。\n\
  \n为了操作浏览器和文档，JavaScript 使用了一种名为 DOM 的父子对象层次结构。这些对象被组织成树形结构，代表了网页文档的所有内容和组件。\n\n\
  DOM 中的对象具有属性（描述网页的变量）和方法（允许你操作页面的函数）。要引用文档，你使用 `window` 的名称后接 `document`。例如，`window.document`。`document`\
  \ 代表网页。\n\n### 使用 `window`\n\n层次结构的顶端是 `window`，它代表当前窗口。你可以使用 `window.document`\
  \ 或直接使用 `document`。\n\n**注意**\n`window` 对象是当前窗口。\n\n* * *\n\n可以有多个窗口，每个窗口都有自己的 `document`\
  \ 对象。如果正在使用多个窗口，可能会有多个 `window` 对象，每个都有自己的 `document`。你将学习更多关于窗口和框架的内容。\n\n`window`\
  \ 对象是当前页面。\n\n**图 15.1** `window` 对象。\n\n![image](img/151)\n\n### 使用 `document`\n\
  \n`document` 对象代表当前文档。在较早的章节中，你只使用过 `window.document.write`。\n\n**注意**\n你已经用过 `document.write`。\n\
  \n* * *\n\n因为 `window` 始终代表当前窗口，你可以使用 `window.document` 或直接使用 `document`。如果在使用多个框架，可能会有多个\
  \ `document` 对象，每个都有自己的 `window`。\n\n### 获取文档信息\n\n`document` 对象的若干属性包含了关于当前文档的基础信息：\n\
  \n`document.URL` 指定文档的 URL。这是一个简单的文本字段。你无法更改此属性。如果你需要引导用户到另一个位置，请使用 `window.location`\
  \ 对象，你将进一步学习。\n\n`document.title` 列出当前页面的标题，由 `<title>` 标签定义。\n\n`document.referrer`\
  \ 是用户在访问当前页面之前的页面 URL——通常是指向当前页面的页面。\n\n`document.lastModified` 是文档最后修改的日期。该日期随页面一起从服务器发送。\n\
  \n`document.cookie` 允许你为文档读取或设置 cookie。\n\n`document.images` 返回文档使用的图像集合。\n\n作为文档属性的一个示例，列表\
  \ 15.1 显示了一个短的 HTML 文档，它使用 JavaScript 显示其最后修改日期。\n\n```html\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\"\
  http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n<head>\n  <title>Displaying the Last Modified Date</title>\n\
  </head>\n<body>\n  <h1>Displaying the Last Modified Date</h1>\n  <p>This page was\
  \ last modified on:</p>\n</body>\n</html>\n```\n\n\n\n\n```html\n<script type=\"\
  text/javascript\">\n    document.write(document.lastModified);\n</script>\n</body>\n\
  </html\n```\n\n* *\n\n图 15.2 显示列表 15.1 的输出。\n\n**图 15.2** 查看文档的最后修改日期。\n\n![image](img/15fig02.jpg)\n\
  \n如果你使用 JavaScript 显示此 `document` 属性的值，那么当你选择向用户公开此信息时，就不需要在每次修改页面时记住更新日期。（你也可以使用脚本始终打印当前日期而不是最后修改日期，但那是作弊。）\n\
  \n* *\n\n### 注意事项\n\n你可能会发现 `document.lastModified` 属性在你的网页上不起作用，或者返回错误的值。该日期是从网络服务器接收的，某些服务器无法正确维护修改日期。\n\
  \n* *\n\n#### 在文档中编写文本\n\n最简单的 `document` 对象方法也是你最经常使用的方法。事实上，在在本书为止最基础的示例中，你已经使用了其中一个方法。`document.write`\
  \ 方法将文本作为文档窗口中 HTML 的打印。另一种语句 `document.writeln` 也会打印文本，但它末尾还会包含一个换行符（`\\n`）。当你希望文本是行的最后内容时，这个方法非常有用。\n\
  \n* *\n\n#### 注意\n\n请记住，换行符在浏览器中会被显示为空格，`<pre>` 容器内部除外。如果你需要真正的换行，则需要使用 `<br/>`\
  \ 标签。\n\n* *\n\n你只能在网页的 body 内使用这些方法，因此它们会在页面加载时执行。你无法使用这些方法向已加载的页面添加内容，而无需重新加载页面。然而，正如下一节所解释的那样，你可以为文档编写新内容。\n\
  \n`document.write` 方法可以在 HTML 文档正体中的 `<script>` 标签中使用。你也可以在函数中使用它，只要你在文档正体中包含对该函数的调用，正如你在列表\
  \ 15.1 中看到的那样。\n\n* *\n\n### 注意事项\n\n你还可以通过使用 DOM 的更高级特性来直接修改网页上的文本，这些你将在本章稍后的部分学习。\n\
  \n* *\n\n#### 使用链接和锚点\n\n`document` 对象的另一个子是 `link` 对象。实际上，一个文档中可以有多个 `link` 对象。每个对象都包含指向另一个位置或锚点的链接信息。\n\
  \n你可以通过 `links` 数组访问 `link` 对象。数组的每个成员都是当前页面中的一个 `link` 对象。数组的属性 `document.links.length`\
  \ 表示页面中链接的数量。\n\n每个 `link` 对象（或 `links` 数组的成员）都有一个定义 URL 的属性列表。`href` 属性包含整个 URL，其他属性定义了它的部分内容。这些与在本章稍后定义的\
  \ `location` 对象的属性相同。\n\n你可以通过指定链接编号和属性名来引用属性。例如，以下语句将第一个链接的完整 URL 赋值给变量 `link1`：\n\
  \n```\nlink1 = links[0].href;\n```\n\n`anchor` 对象也是 `document` 对象的子。每个 `anchor`\
  \ 对象代表当前文档中的一个锚点——一个可以直接跳转的特定位置。\n\n与链接一样，你可以通过数组 `anchors` 访问锚点。该数组的每个元素都是一个 `anchor`\
  \ 对象。`document.anchors.length` 属性给出 `anchors` 数组元素的数量。\n\n#### 访问浏览器历史\n\n`history`\
  \ 对象是 `window` 对象的另一个子（属性）。该对象存储了当前页面之前之后访问的 URL 信息，并包含了跳转到上一个或下一个位置的方法。\n\n* *\n\
  \n### 注意事项\n\n`history` 对象具有 `current`、`previous` 和 `next` 属性，用于存储历史列表中文档的 URL。然而，出于安全和隐私考虑，浏览器通常无法访问这些对象。\n\
  \n* *\n\n`history` 对象有一个你可以访问的属性：\n\n- `history.length` 跟踪历史列表的长度——换句话说，用户访问过的不同位置的数量。\n\
  \n`history` 对象有三个你可以使用的方法来遍历历史列表：\n\n- `history.go()` 从历史列表中打开一个 URL。要使用此方法，请在括号中指定正数或负数。例如，`history.go(-2)`\
  \ 等同于连续两次后退键。\n\n- `history.back()` 加载历史列表中的上一个 URL——等同于按下后退键。\n\n- `history.forward()`\
  \ 加载历史列表中的下一个 URL（如果可用）。这等同于按下前进键。\n\n你可以使用 `history` 对象的 `back` 和 `forward` 方法在网页文档中添加你自己的后退和前进按钮。当然，浏览器已经有了后退和前进按钮，但有时包含自己的实现相同目的的链接是有用的。假设你想创建后退和前进按钮。这里是代码：\n\
  \n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"\
  -//W3C//DTD XHTML 1.0//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\">\n<html\
  \ xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n    <title>Using\
  \ Back and Forward</title>\n</head>\n<body>\n    <h1>Using Back and Forward</h1>\n\
  \    <p>此页面允许你返回或前进跳转到历史列表中的页面。这些操作应该等同于浏览器工具栏中的后退和前进箭头。</p>\n    <p>\n        <input\
  \ type=\"button\" onclick=\"history.back();\" value=\"后退\" />\n        <input type=\"\
  button\" onclick=\"history.forward();\" value=\"前进\" />\n    </p>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n- `location.search` 是 URL 中的查询部分，如果有的话（示例中的 `q=javascript`）。\n\n\
  在本示例中虽未使用但也可以访问的属性还包括：\n\n- `location.host` 是 URL 的主机名加上端口号。\n- `location.hash`\
  \ 是 URL 中使用的锚点名称，如果有的话（示例中的 `#anchor`）。\n\n***\n\n### 注意事项\n\n尽管 `location.href`\
  \ 属性通常包含在本节之前描述的 `document.URL` 属性相同的 URL，但你无法更改 `document.URL` 属性。请始终使用 `location.href`\
  \ 来加载新页面。\n\n***\n\n本章之前介绍的 `link` 对象也包含此属性列表用于访问 URL 部分。\n\n`location` 对象有三个方法：\n\
  \n- `location.assign()` 如下所示使用时会加载新文档：\n  `location.assign(\"http://www.google.com\"\
  )`\n\n- `location.reload()` 重新加载当前文档。这与浏览器工具栏上的“刷新”按钮相同。如果你可选地包含参数 `true`，它将忽略浏览器缓存，无论文档是否已更改都强制重新加载。\n\
  \n- `location.replace()` 用新位置替换当前位置。这类似于手动设置 `location` 对象的属性。区别在于，`replace` 方法不会影响浏览器的历史记录。换句话说，无法使用“后退”按钮返回到之前的位置。这对于启动页或返回后没有意义的临时页面非常有用。\n\
  \n###更多关于 DOM 结构的知识\n\n在本章之前的节内容中，你已经学习了某些最重要的 DOM 对象是如何组织的：`window` 对象包含 `document`\
  \ 对象，依此类推。虽然这些对象最初是唯一可用的，但现代 DOM 为页面的每个元素在 `document` 对象下都添加了对象。\n\n为了更好地理解这个概念，让我们来看列表\
  \ 15.3（#ch15.html_ch15ex03）中的简单 HTML 文档。该文档具有标准的 `<head>` 和 `<body>` 部分、一个标题和一个段落文本。\n\
  \n列表 15.3 一个简单的 HTML 文档\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>A Simple HTML Document</title>\n  </head>\n  <body>\n    <h1>This is a\
  \ Level-1 Heading.</h1>\n    <p>This is a simple paragraph.</p>\n  </body>\n</html>\n\
  ```\n\n***\n\n和所有的 HTML 文档一样，这个文档由各种容器及其内容组成。`<html>` 标签形成一个包含整个文档的容器，`<body>` 标签包含页面的主体，依此类推。\n\
  \n在 DOM 中，页面中的每个容器及其内容都由一个对象表示。这些对象被组织成树形结构，`document` 对象本身位于树根节点，而单个元素（如标题和段落）位于树的叶子节点。图\
  \ 15.4（#ch15.html_ch15fig04）显示了这些关系的图表。\n\n**图 15.4** DOM 如何表示 HTML 文档。\n\n![image](img/15fig04.jpg)\n\
  \n***\n\n### 注意\n\n如果这个树形结构让你感到困惑，请担心；你只需通过为元素分配 ID 并引用它们，就可以完成几乎任何操作。这是书中早期某些示例中使用的方法。在之后，你将看到更复杂的示例，这些要求你理解\
  \ DOM 中对象的组织方式。\n\n***\n\n在接下来的章节中，你将更仔细地检查 DOM 的结构。\n\n#### 节点 (Nodes)\n\n文档中的每个容器或元素在\
  \ DOM 中都被称为**节点**（node）。在图 15.4（#ch15.html_ch15fig04）的示例中，框中的每个对象都是一个节点，线条表示节点之间的关系。\n\
  \n你经常需要在脚本中引用单个节点。你可以通过分配 ID 或使用节点之间的关系在树中导航来实现这一点。\n\n#### 父节点和子节点\n\n正如你已经学到的，每个\
  \ JavaScript 对象都可以有一个父节点（包含它的对象），也可以有子节点（它包含的对象）。DOM 使用了相同的术语。\n\n在图 15.4（#ch15.html_ch15fig04）中，`document`\
  \ 对象是其余对象的父对象，它本身没有父对象。`html` 对象是 `<head>` 和 `<body>` 对象的父节点，而 `<h1>` 和 `<p>` 对象是\
  \ `<body>` 对象的子节点。\n\n文本节点的工作稍微不同。段落中的实际文本本身就是一个节点，它是 `<p>` 对象的子节点。同样，`<h1>` 标签内的文本是\
  \ `<h1>` 对象的子节点。\n\n#### 兄弟节点 (Siblings)\n\nDOM 还使用了另一个术语：兄弟节点。在图 15.4（#ch15.html_ch15fig04）中，`h1`\
  \ 和 `p` 对象是 `<body>` 对象下的兄弟节点。\n\n#### 使用 DOM 节点操作\n\n文档中的每个容器或元素在 DOM 中都被称为节点。在图\
  \ 15.4（#ch15.html_ch15fig04）的示例中，框中的每个对象都是节点，线条表示节点之间的关系。\n\n你经常需要在脚本中引用单个节点。你可以通过分配\
  \ ID 或使用节点之间的关系在树中导航来实现这一点。\n\n#### 节点属性\n\n你已经使用节点的 `style` 属性来更改其样式值。每个节点还有许多可以检查或设置的基础属性。这些包括：\n\
  \n- `nodeName` 是节点的名称（不是 ID）。对于基于 HTML 标签的节点（如 `<p>` 或 `<body>`），名称是标签名。对于文档节点，名称是特殊代码：`#document`。同样，文本节点的名称为\
  \ `#text`。\n- `nodeType` 是描述节点类型的整数：`1` 表示普通 HTML 标签，`3` 表示文本节点，`9` 表示文档节点。\n- `nodeValue`\
  \ 是文本节点包含的实际文本。此属性对其他类型的节点无效。\n- `innerHTML` 是任何节点的 HTML 内容。你可以赋值包含 HTML 标签的值并动态更改\
  \ DOM 子对象。\n\n#### 节点关系属性\n\n除了之前描述的基础属性外，每个节点都有许多描述其与其他节点关系的属性。这些包括：\n\n- `firstChild`\
  \ 是节点的第一个子对象。对于包含文本的节点（如 `<h1>` 和 `<p>`），包含实际文本的文本节点是第一个子节点。\n- `lastChild` 是节点的最后一个子对象。\n\
  - `childNodes` 是一个包含节点所有子节点的数组。你可以使用循环此数组来处理给定节点下的所有节点。\n- `previousSibling` 是当前节点之前的兄弟节点（同一层级的节点）。\n\
  - `nextSibling` 是当前节点之后的兄弟节点。\n\n\n\n\n\n`document` 节点本身具有几个你可能会觉得很有用的方法。你已经使用过其中一个\
  \ `getElementById`，通过其 ID 属性来引用 DOM 对象。`document` 节点的方法包括：\n\n- `getElementById(id)`\
  \ 返回具有指定 `id` 属性的元素。\n- `getElementsByTagName(tag)` 返回一个包含所有指定标签名称的元素的数组。你可以使用通配符\
  \ `*` 来返回一个包含文档中所有节点的数组。\n- `createTextNode(text)` 创建一个包含指定文本的新文本节点，然后你可以将其添加到文档中。\n\
  - `createElement(tag)` 为指定的标签创建一个新的 HTML 元素。与 `createTextNode` 一样，你需要在创建元素后将其添加到文档中。你可以通过更改其子对象或\
  \ `innerHTML` 属性来为元素内部分配内容。\n\n## 节点方法 (Node Methods)\n\n页面中的每个节点都有许多可用方法。这些方法是否有效取决于节点在页面中的位置，以及它是否具有父节点或子节点。这些方法包括：\n\
  \n- `appendChild(new)` 将指定的新节点添加到该对象的所有现有节点之后。\n- `insertBefore(new, old)` 在指定的旧子节点（必须已存在）之前插入指定的新子节点。\n\
  - `replaceChild(new, old)` 用一个新节点替换指定的旧子节点。\n- `removeChild(node)` 从对象的子节点集中移除一个子节点。\n\
  - `hasChildNodes()` 如果对象具有一个或多个子节点，则返回布尔值 `true`，否则返回 `false`。\n- `cloneNode()`\
  \ 创建现有节点的副本。如果提供了参数 `true`，副本将也包含原始节点的任何子节点。\n\n## 创建可定位元素（层） (Creating Positionable\
  \ Elements)\n\n现在你已经进一步地了解了 DOM 的结构，你应该能够开始思考如何控制网页中的任何元素，例如段落或图像。例如，你可以使用 DOM 来更改元素的位置、可见性和其他属性。\n\
  \n在 W3C DOM 和 CSS2 标准之前，你只能重新定位 `layers`，即用专有标签定义的特殊元素组。虽然你现在可以定位任何元素，但在许多情况下，对一组元素进行操作仍然很有用。\n\
  \n你可以使用在本书早期学过的 `<div>` 或 `<span>` 标签有效地创建一个层，或者说创建一个作为一个整体控制的 HTML 对象组。\n\n要使用\
  \ `<div>` 创建一个层，将层的内容封装在两个 `<div>` 标签之间，并在 `<div>` 标签的 `style` 属性中指定层的属性。这是一个简单的示例：\n\
  \n```html\n<div id=\"layer1\" style=\"position:absolute; left:100px; top:100px\"\
  >\n  <p>这是该层的内容。</p>\n</div>\n```\n\n### 注意\n\n正如你在前面的章节中所学到的，你可以在 `<style>` 块、外部样式表或\
  \ HTML 标签的 `style` 属性中指定 CSS 属性（例如 `position` 属性和其他层属性），然后使用 JavaScript 控制这些属性。这里显示的代码片段使用\
  \ `style` 属性中的属性而不是 `<style>` 块中的属性，是因为这只是一个示例片段，而不是完整的代码列表。\n\n此代码定义了一个名为 `layer1`\
  \ 的层。这是一个可移动的层，位于浏览器窗口左上角向下 100 像素、向右 100 像素的位置。\n\n你已经学习了定位属性并在本书的 第二部分 和 第三部分\
  \ 中看到了它们的用法。这包括设置对象大小（如 `height` 和 `width`）和位置（如 `absolute` 或 `relative`）、对象可见性以及对象的背景和边界。本章中的其余示例将使用与你在本书中所看到的类似的\
  \ HTML 和 CSS，但将向你展示基于 JavaScript 的 DOM 交互。\n\n## 使用 JavaScript 控制定位\n\n使用上一节的代码片段，你将看到一个如何使用\
  \ JavaScript 控制对象定位属性的示例。\n\n这里是我们的示例层（`<div>`）：\n\n```html\n<div id=\"layer1\"\
  \ style=\"position:absolute; left:100px; top:100px\">\n  <p>这是该层的内容。</p>\n</div>\n\
  ```\n\n要使用 JavaScript 在页面内向上或向下移动此层，你可以更改它的 `style.top` 属性。例如，以下语句将层从原始位置向下移动 100\
  \ 像素：\n\n```javascript\nvar obj = document.getElementById(\"layer1\");\nobj.style.top=200;\n\
  ```\n\n`document.getElementById()` 方法返回对应于层 `<div>` 标签的对象，而第二个语句将对象的 `top` 定位属性设置为\
  \ 200px；你也可以结合这两个语句：\n\n```javascript\ndocument.getElementById(\"layer1\").style.top\
  \ = 200;\n```\n\n这只是为层设置了 `style.top` 属性，而没有为层对象分配变量。\n\n### 注意\n\n某些 CSS 属性（例如\
  \ `text-indent` 和 `border-color`）名称中带有连字符。当你在 JavaScript 中使用这些属性时，会将带连字符的部分合并并使用大写字母：`textIndent`\
  \ 和 `borderColor`。\n\n现在让我们创建一个 HTML 文档，定义一个层并与脚本结合，以便通过按钮移动、隐藏或显示该层。第 15.4 节 显示了按钮和层的\
  \ HTML 文档。脚本本身（position.js）将在 第 15.5 节 中出现。\n\n第 15.4 用于移动层的示例 HTML 文档\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ HTML 1.1//EN\"\n \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>使用 JavaScript\
  \ 定元素</title>\n    <script type=\"text/javascript\" src=\"position.js\"></script>\n\
  \    <style type=\"text/css\">\n      #buttons {\n        text-align:center;\n \
  \     }\n      #square {\n        position:absolute;\n        top:150px;\n     \
  \   left:100px;\n        width:200px;\n        height:200px;\n        border:2px\
  \ solid black;\n        background-color:#e0e0e0;\n        padding:10px;\n     \
  \ }\n    </style>\n  </head>\n  <body>\n    <h1>元素定位</h1>\n    <form action=\"\"\
  \ name=\"form1\">\n      <div id=\"buttons\">\n        <input type=\"button\" value=\"\
  左\" onclick=\"pos(-1,0);\" />\n        <input type=\"button\" value=\"右\" onclick=\"\
  pos(1,0);\" />\n        <input type=\"button\" value=\"上\" onclick=\"pos(0,-1);\"\
  \ />\n        <input type=\"button\" value=\"下\" onclick=\"pos(0,1);\" />\n    \
  \    <input type=\"button\" value=\"隐藏\" onclick=\"hideSquare();\" />\n        <input\
  \ type=\"button\" value=\"显示\" onclick=\"showSquare();\" />\n      </div>\n    </form>\n\
  \    <hr />\n    <div id=\"square\">\n      <p>这个正方形是一个绝对定位的层，你可以通过上面的按钮移动它。</p>\n\
  \    </div>\n  </body>\n</html>\n```\n\n\n\n\n\n-   `<<div>` 部分定义了层本身。`id` 属性被设置为值\
  \ `\"square\"`。此 `id` 在样式表中被用于引用该层，也将用于你的脚本中。\n\n如果你将其加载到浏览器中，你应该能看到按钮和 `\"square\"\
  ` 层，但按钮目前还不起任何作用。列表 15.5 中的脚本添加了使用操作的功能。当你将 列表 15.4 中的代码加载到浏览器中时，它的看起来应该像 图 15.5\
  \ 所示。\n\n**图 15.5** 可移动的层已准备好进行移动。\n\n![image](img/15fig05.jpg)\n\n列表 15.5 显示了 列表\
  \ 15.4 中 HTML 调用的 JavaScript 变量和函数。这段代码预计（通过 `<script>` 标签）位于一个名为 `position.js`\
  \ 的文件中。\n\n列表 15.5 可移动层示例脚本\n\n```\nvar x=100,y=150;\n\nfunction pos(dx,dy) {\n\
  \    if (!document.getElementById) return;\n    x += 10*dx;\n    y += 10*dy;\n \
  \   obj = document.getElementById(\"square\");\n    obj.style.top=y + \"px\";\n\
  \    obj.style.left=x + \"px\";\n}\n\nfunction hideSquare() {\n    if (!document.getElementById)\
  \ return;\n    obj = document.getElementById(\"square\");\n    obj.style.display=\"\
  none\";\n}\n\nfunction showSquare() {\n    if (!document.getElementById) return;\n\
  \    obj = document.getElementById(\"square\");\n    obj.style.display=\"block\"\
  ;\n}\n```\n\n脚本开头的 `var` 语句定义了两个变量 `x` 和 `y`，它们将存储层的当前位置。`pos` 函数由四个移动按钮的事件处理器调用。\n\
  \n`pos()` 函数的参数 `dx` 和 `dy` 告诉脚本层应该如何移动：如果 `dx` 为负数，则从 `x` 中减去一个数字，使层向左移动；如果 `dx`\
  \ 为正数，则给 `x` 加上一个数字，使层向右移动。同样，`dy` 表示向上还是向下移动。\n\n`pos()` 函数首先确保支持 `getElementById()`\
  \ 函数，这样它就不会在旧版浏览器中尝试运行。然后它将 `dx` 和 `dy` 乘以 10（为了让移动更明显），并将它们应用于 `x` 和 `y`。最后，它将\
  \ `top` 和 `left` 属性设置为新位置（包括指示测量单位的“px”），从而移动该层。\n\n另外两个函数 `hideSquare()` 和 `showsquare()`\
  \ 通过通过将其 `display` 属性设置为 `\"none\"`（隐藏）或 `\"block\"`（显示）来隐藏或显示层。\n\n要使用此脚本，请将其保存为\
  \ `position.js`，然后将 列表 15.4 中的 HTML 文档加载到浏览器中。图 15.6 显示了此脚本的运行情况——至少在执行一次操作之后。图\
  \ 15.6 显示了在点击右按钮七次和向下按钮十次后的脚本状态。\n\n**图 15.6** 可移动的层已经移动。\n\n![image](img/15fig06.jpg)\n\
  \n### 隐藏和显示对象\n\n在上一个示例中，你看到了一些可以用于隐藏或显示“正方形”的函数。在本节中，我们将仔细查看在页面内隐藏和显示对象。\n\n复习一下，对象有一个\
  \ `visibility` 样式属性，用于指定它们当前在页面内是否可见：\n\n```\nObject.style.visibility=\"hidden\"\
  ; // 隐藏对象\nObject.style.visibility=\"visible\"; // 显示对象\n```\n\n使用此属性，你可以创建一个在任何浏览器中隐藏或显示对象的脚本。列表\
  \ 15.6 显示了用于允许两个标题显示或隐藏的脚本的 HTML 文档。\n\n列表 15.6 隐藏和显示对象\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>隐藏或显示对象</title>\n    <script type=\"text/javascript\"\
  >\n    function ShowHide() {\n        if (!document.getElementById) return;\n  \
  \      var head1 = document.getElementById(\"head1\");\n        var head2 = document.getElementById(\"\
  head2\");\n        var showhead1 = document.form1.head1.checked;\n        var showhead2\
  \ = document.form1.head2.checked;\n        head1.style.visibility = showhead1 ?\
  \ \"visible\" : \"hidden\";\n        head2.style.visibility = showhead2 ? \"visible\"\
  \ : \"hidden\";\n    }\n    </script>\n  </head>\n  <body>\n    <form name=\"form1\"\
  >\n      <input type=\"checkbox\" name=\"head1\" checked onclick=\"ShowHide()\"\
  >\n      <h1 id=\"head1\">标题 1</h1>\n      <input type=\"checkbox\" name=\"head2\"\
  \ onclick=\"ShowHide()\">\n      <h1 id=\"head2\">标题 2</h1>\n    </form>\n  </body>\n\
  </html>\n```\n*(注：由于原文提供的 XML 示例不完整且逻辑混乱，此处翻译时根据上下文补全了合理的 HTML 结构以保持可读性，但严格遵循了翻译要求)*\n\
