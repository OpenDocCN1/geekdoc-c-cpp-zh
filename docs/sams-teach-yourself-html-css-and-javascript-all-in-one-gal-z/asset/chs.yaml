  \n**c.** `window.prompt`\n\n**2.** `window.setTimeout` 方法的作用是什么？\n\n**a.** 在延迟后执行\
  \ JavaScript 语句\n\n**b.** 锁定浏览器指定的时间\n\n**c.** 设置浏览器自动退出之前的时间\n\n**3.** 你正在处理一个包含三个三个名为\
  \ `first`、`second` 和 `third` 框架的文档。如果第二个框架中的脚本需要引用第一个框架，正确的语法是什么？\n\n**a.** `window.first`\n\
  \n**b.** `parent.first`\n\n**c.** `frames.first`\n\n**4.** 什么样的 `<iframe>` 代码会产生一个无边框的、白色背景的\
  \ `<iframe>`，它占据页面宽度的 98%，高度为 250 像素？\n\n#### 答案\n\n**1.** b. `window.confirm` 方法显示一个带有确定和取消按钮的对话框。\n\
  \n**2.** a. `window.setTimeout` 方法在延迟后执行 JavaScript 语句。\n\n**3.** b. 第二个框架中的脚本将使用\
  \ `parent.first` 来引用第一个框架。\n\n**4.**\n```html\n<iframe src=\"some_source.html\"\
  \ style=\"width:98%;height:250px;border:none;\">\n<p>对于无法看到框架的人显示的消息</p>\n</iframe>\n\
  ```\n\n## 练习\n\n• 使用超时和 JavaScript 显示日期和时间（你之前在本章中学习过），创建一个每秒自动刷新的脚本以显示“实时”时钟。\n\
  \n• 思考你可以在你的网站中使用 `<<iframe>>` 的某些方法——可能是为了广告，也可能是为了提供免费的 Google 搜索。为你的设计为该元素留位置。\n\
  \n# 第 V 部分 高级 JavaScript \n\n## 第 21 章 使用非侵入式 JavaScript\n\n* *\n\n在本章将学习：\n\n-\
  \ 创建脚本的最佳实践\n- 分离内容、呈现和行为\n- 遵循标准创建跨浏览器脚本\n- 读取和显示浏览器信息\n- 使用功能检测避免错误\n- 支持不支持 JavaScript\
  \ 的浏览器\n\n* *\n\n在本章中，你将学习一些创建易于维护、易于使用且符合标准的脚本指南。这被称为“非侵入式脚本”（unobtrusive scripting）：脚本添加功能的同时，不会干扰用户、维护代码的开发者或构建布局的设计师。你还将学习如何确保你的脚本在多个浏览器中运行，并且当新浏览器出现时不会停止。\n\
  \n## 脚本最佳实践\n\n当你开始开发更复杂的脚本时，了解一些脚本*最佳实践*很重要。这些是经验丰富的程序员通过教训学到的 JavaScript 使用指南。遵循这些实践的益处包括：\n\
  \n- 你的代码将具有可读性且易于维护，无论是将页面交给他人，还是试图记住一年前做了什么。\n- 你将创建遵循标准的代码，而不会因为特定浏览的新版本而失效。\n\
  - 你将创建即使没有 JavaScript 也能工作的页面。\n- 将你为一个网站的代码适配到另一个网站或项目将变得容易。\n- 你的用户将感谢你创建一个易于使用且在出错时易于修复的网站。\n\
  \n无论你是编写整个 AJAX Web 应用，还是仅仅用三行脚本增强页面，了解那些职业编写复杂脚本的人经常考虑的一些概念都是很有用的。接下来的章节介绍了其中一些最佳实践。\n\
  \n#### 内容、呈现和行为\n\n\n\n\n当你创建一个网页时，特别是创建一个整个网站或应用程序时，你正在处理三个关键领域：`content`（内容）、`presentation`（表现）和\
  \ `behavior`（行为）——你已经在之前的章节中学习过。\n\n*   `Content`（内容）由访问者在页面上看到的文字组成。你通过文本创建内容，并使用\
  \ HTML 对其进行标记以定义不同类型的内容——标题、段落、链接等。\n*   `Presentation`（表现）是每个页面上文字的外观和布局——文本格式、字体、颜色和图形。虽然在\
  \ Web 早期，仅使用 HTML 创建表现是常见做法，但你现在可以使用层叠样式表（`CSS`）来定义表现。\n*   `Behavior`（行为）是你与页面交互时发生的情况——例如鼠标悬停时高亮的项目、可以提交的表单等。这就是\
  \ JavaScript 发挥作用场的地方，以及诸如 `PHP` 等服务器端语言。\n\n记住这三个区域是一个好主意，特别是当你创建一个较大的网站时。理想情况下，你希望尽可能将内容、表现和行为分离。实现这一点的良好方法是为表现创建一个外部\
  \ CSS 文件，为行为创建一个外部 JavaScript 文件，并将它们链接到 HTML 文档中。\n\n这样保持分离使得维护大型网站变得更容易——例如，如果你需要更改标题的颜色，只需对\
  \ CSS 文件进行快速编辑，而无需遍历所有的 HTML 标记来寻找正确的编辑位置。它还方便你将在网站的多个页面上复用相同的 CSS 和 JavaScript。最后但同样重要的是，这将鼓励你在每种语言所擅长的地方使用它，让你的工作变得更容易。\n\
  \n## 渐进式增强 (Progressive Enhancement)\n\nWeb 设计的一个老旧术语是 `graceful degradation`（优雅降级）。其核心思想是，你可以构建一个使用最新浏览器所有功能的网站，只要它能够在较旧版浏览器上“优雅地降级”并正常工作即可。这主要意味着在几个旧版浏览器上进行测试并希望它能正常工作，而且在不支持最新功能的浏览器中始终存在问题的可能性。\n\
  \n讽刺的是，你可能认为缺乏最新功能的浏览器是那些老旧、不流行的浏览器，但一些最大的问题却出现在全新的浏览器上——那些手机手机和其他新设备自带的浏览器，与电脑上运行的最新浏览器相比，它们都是原始的。\n\
  \n一种解决此问题的 Web 设计新方法被称为 `progressive enhancement`（渐进式增强）。其想法是保持 HTML 文档尽可能简单，以便它们即使在最原始的浏览器中也能正常工作。在你测试了这一点并确保基本功能存在后，你可以添加功能，为使用新浏览器的用户让网站更易用或更漂亮。\n\
  \n如果你不留痕迹地添加这些功能，它们几乎不会阻止网站以其原始的 HTML 形式运行。以下是渐进式增强的一些指南：\n\n*   通过向单独的 CSS 文件中添加规则来增强表现。尝试避免严格将\
  \ HTML 标记用于表现，例如使用 `<em>` 来加粗或使用 `<blockquote>` 来表示缩进部分。\n*   通过向外部 JavaScript 文件中添加脚本来增强行为。\n\
  *   在不使用内联事件处理程序的情况下添加事件，如第 19 章 中的“响应事件”以及本章后续部分所述。\n*   使用本章稍后描述的特征检测（feature\
  \ sensing），确保 JavaScript 代码仅在支持所需功能的浏览器上执行。\n\n***\n\n注意\n\n`progressive enhancement`\
  \ 术语最早出现在 Steve Champeon 关于该主题的演示和文章中。原始文章以及许多其他 Web 设计文章可以在他的公司网站 [`hesketh.com/`](http://hesketh.com/)\
  \ 上找到。\n\n***\n\n## 添加事件处理程序 (Adding Event Handlers)\n\n在第 19 章中，你学习了设置事件处理程序的多种方法。最简单的方法是将它们直接添加到\
  \ HTML 标签中。例如，这个 `<body>` 标签有一个事件处理程序，调用一个名为 `Startup` 的函数。\n\n```\n<body onLoad=\"\
  Startup();\">\n```\n\n这种方法仍然有效，但它意味着将 JavaScript 代码放在 HTML 页面中，这意味着你还没有完全分离内容和行为。为了保持完全分离，你可以在\
  \ JavaScript 文件中设置事件处理程序，使用如下所示的语法：\n\n```\nwindow.onload=Startup;\n```\n\n目前，这通常是设置事件的最佳方式：它将\
  \ JavaScript 排除在 HTML 文件之外，并且在所有现代浏览器中都能运行。然而，它确实有一个问题：你不能向页面的同一个元素挂载多个事件。例如，你不能拥有两个在页面加载时都执行的不同的\
  \ `onLoad` 事件处理程序。\n\n当你是唯一编写脚本的人，这没什么问题——你可以将两个合并为一个函数。但当你试图在页面上使用两个或三个第三方脚本，并且它们都想给\
  \ body 添加一个 `onLoad` 事件处理程序时，你就遇到问题了。\n\n### W3C 事件模型 (The W3C Event Model)\n\n\
  为了解决这个问题并标准化事件处理，W3C 作为 DOM 2 级的一部分创建了事件模型。它使用方法 `addEventListener()` 来将处理程序挂载到任何元素上的任何事件上。例如，以下代码使用\
  \ W3C 模型来设置与之前示例相同的 `onLoad` 事件处理程序：\n\n```\nwindow.addEventListener('load', Startup,\
  \ false);\n```\n\n`addEventListener()` 的第一个参数是不带 `on` 前缀的事件名称——`load`、`click`、`mouseover`。第二个参数指定处理的函数，第三个参数是指示如何处理多个事件的标志（`false`\
  \ 适用于大多数情况）。\n\n通过这种方式可以向事件挂载任意数量的函数。由于一个事件不会替换另一个，你使用单独的函数 `removeEventListener()`，其参数相同：\n\
  \n```\nwindow.removeEventListener('load', Startup, false);\n```\n\nW3C 模型的问题在于 Internet\
  \ Explorer（6、7 和 8 版本）不支持它（它在 IE9 中才引入）。相反，它支持一个专有方法 `attachEvent()`，其功能类似。这里是微软式的\
  \ `Startup` 事件处理程序：\n\n```\nwindow.attachEvent('onload', Startup);\n```\n\n`attachEvent()`\
  \ 方法有两个参数。第一个是带 `on` 前缀的事件——`onload`、`onclick`、`onmouseover`。第二个是处理事件的函数。Internet\
  \ Explorer 还支持具有相同参数的 `detachEvent()` 方法来移除事件。\n\n### 跨浏览器方式绑定 (Cross-Browser Way)\n\
  \n正如你看到的，以这种方式绑定事件是复杂的，并且不同的浏览器需要不同的代码。大多数情况下，使用传统方法绑定事件效果更好，这种方法用于书中的大多数示例。然而，如果你确实需要支持多个事件处理程序，可以使用\
  \ `if` 语句来使用 W3C 方法或微软的方法。例如，以下代码为 `id` 属性为 `btn` 的元素添加 `ClickMe()` 函数作为事件：\n\n\
  ```\nobj = document.getElementById(\"btn\");\nif (obj.addEventListener) {\n    obj.addEventListener('click',ClickMe,false);\n\
  } else if (obj.attachEvent) {\n    obj.attachEvent('onclick',ClickMe);\n} else {\n\
  \    obj.onclick=ClickMe;\n}\n```\n\n这段代码检查是否存在 `addEventListener()` 方法，如果存在则使用它。否则，检查是否存在\
  \ `attachEvent()` 方法并使用它。如果都未找到，则使用传统方法附加事件处理程序。\n\n\n\n许多通用函数可以用来弥补缺乏统一事件绑定方式的不足。如果你正在使用第三方库，很有可能其中包含一个事件函数，可以为你简化这一过程。\n\
  \n### 提示\nYahoo! UI 库像许多其他第三方库一样，包含一个事件处理函数，该函数可以在任何浏览器中绑定事件、一次性为多个对象绑定相同的事件处理器，以及其他实用功能。详情请参阅\
  \ [`developer.yahoo.net/yui/`](http://developer.yahoo.net/yui/)，并参阅第 22 章](#ch22.html_ch22)“使用第三方库”获取有关其他各种可用库的信息。\n\
  \n## Web 标准：避免特定于浏览器\n\nWeb 是构建在标准上的，例如由 W3C 开发的 HTML 标准。现在有许多涉及 JavaScript 标准——CSS、W3C\
  \ DOM 以及定义 JavaScript 语法的 ECMAScript 标准。\n\n微软、Mozilla 项目、谷歌以及 Opera Software 等其他浏览器开发者不断改进他们的浏览器对\
  \ Web 标准的支持，但总会存在某些特定浏览器的非标准特性，而且最新标准中的某些部分在浏览器之间的支持程度并不一致。\n\n尽管在多个浏览器中测试你的代码并尽一切努力让其运行是完全没有问题的，但在可能的情况下遵循标准而非特定浏览器的技术是一个明智的主意。这确保了你的代码可以在未来改进了标准支持的浏览器上运行，而特定于浏览器的特性可能会在新版本中消失。\n\
  \n### 注意\n确保你遵循标准的理由之一是，你的页面可以被搜索引擎 地解析，这通常有助于你的网站获得搜索流量。将内容、演示和行为分离对搜索引擎也有益处，因为它们可以专注于你网站的\
  \ HTML 内容，而无需跳过 JavaScript 或 CSS。\n\n## 为你的代码编写文档\n\n当你创建越来越复杂的脚本时，不要忘记在代码中包含注释来记录其功能，特别是当某些代码看起来很困惑或难以运行时。对大型脚本中使用的所有数据结构、变量和函数参数编写注释也是一个好主意。\n\
  \n注释是组织代码的良好方法，并将帮助你以后维护该脚本。如果你以此为生，你绝对需要使用注释，以便他人能够像你一样轻松地处理你的代码。\n\n## 易用性\n\n\
  在你为网站添加酷功能时，不要忘记易用性——为网站用户提供尽可能简单、逻辑且方便的服务。尽管有许多致力于易用性信息的书籍和网站，但一点常识就能产生深远的影响。\n\
  \n例如，假设你使用下拉列表作为网站各页面之间导航的唯一方式。这是 JavaScript 的常见用法，而且效果良好，但它易用吗？尝试将其与页面顶部的简单链接组进行比较。\n\
  \n- 链接列表让你一目了然看到网站的内容；而下拉列表需要你点击才能看到相同的列表。\n- 用户期待链接并能快速识别它们——下拉列表更有可能是表单的一部分而非导航工具，因此当他们想要导航到你的网站时，它不会是他们寻找的第一个东西。\n\
  - 使用链接导航只需点击一次——使用下拉列表导航至少需要两次点击。\n\n每当你向网站添加 JavaScript 时，请记住考虑用户的角度，并确保你正在让网站变得更容易用——或者至少不让它变得难用。此外，确保网站在没有\
  \ JavaScript 的情况下也是易于使用的；尽管这可能只适用于一小部分用户，但这部分用户很可能包含屏幕阅读器用户或其他视障人士所需的其他软件包的用户。\n\
  \n## 设计模式\n\n如果你学习更多关于易用性的知识，无疑会看到“设计模式”被提及。这是一个计算机科学术语，意味着“常见问题的最佳解决方案”。在 Web 开发中，设计模式是网站管理员反复遇到的网站部分功能的设计和实现方式。\n\
  \n例如，如果你有一个显示多个页数据的网站，你将会有“下一页”和“上一页”链接，可能还有针对每页的数字链接。这是一种常见的设计模式——许多 Web 设计师必须解决的问题，并且有一个通常公认的解决方案。其他常见的\
  \ Web 设计模式包括登录表单、搜索引擎或网站的导航链接列表。\n\n当然，你可以完全原创，创建一个外观与任何其他地方都不太相同的搜索引擎、购物车或登录表单，但除非你有办法让它们变得更加易于使用，否则，遵循模式并给你的用户提供符合他们预期的体验是更好的选择。\n\
  \n虽然你只需通过浏览与你网站相似的网站并注意它们如何解决特定问题，就能找到一些常见的设计模式，但也有专门记录这些模式的网站，如果你需要关于如何让你的网站良好的良好的灵感，那里是一个很好的起点。\n\
  \n### 提示\nYahoo! 开发者网络记录了其站点网络中使用的各种设计模式，其中许多使用 JavaScript 实现：[`developer.yahoo.net/ypatterns/`](http://developer.yahoo.net/ypatterns/)。\n\
  \n## 可访问性\n\n易用性的最后一个考虑方面是可访问性——让你的网站尽可能适用于所有用户，包括残障人士。例如，盲人可能使用文本读取程序来读取你的网站，该程序会忽略图像和大多数脚本。访问性不仅是礼貌，在某些国家还是法律规定的。\n\
  \n### 注意\n确保网站在没有 JavaScript 的情况下运行是实现访问性的第一步之一。有关访问性的更多信息，请参阅 [`www.w3.org/WAI/`](http://www.w3.org/WAI/)。\n\
  \n访问性是一个复杂的课题，但你可以遵循渐进增强原则来实现：尽可能保持 HTML 简单，分离 JavaScript 和 CSS，并将 JavaScript 作为增强而非使用的要求。\n\
  \n### 读取浏览器信息\n\n在第 15 章](#ch15.html_ch15)“操作文档对象模型 (DOM)#ch15.html_ch15”，你学习了代表浏览器窗口和当前\
  \ Web 文档的对象。JavaScript 还有一个名为 `navigator` 的对象，你可以用它读取有关用户浏览器的信息。\n\n`navigator`\
  \ 对象不属于 DOM，因此你可以直接引用它。它包含许多属性，每个属性都会告诉你一些关于浏览器的信息。这些包括：\n\n- `navigator.appCodeName`\
  \ 是浏览器的内部代码，例如 `Mozilla`。\n- `navigator.appName` 是浏览器名称，例如 `Netscape` 或 `Microsoft\
  \ Internet Explorer`。\n- `navigator.appVersion` 是正在使用的浏览器版本——例如 `5.0 (Windows)`。\n\
  - `navigator.userAgent` 是用户代理头，浏览器在请求 Web 页面时发送到服务器的字符串。它包含了完整的版本信息——例如 `Mozilla/5.0\
  \ (Windows NT 6.1; WOW64; rv:5.0) Gecko/20100101 Firefox/5.0`。\n- `navigator.language`\
  \ 是浏览器的语言（如英语或西班牙语）。它以代码存储，例如 `en_US` 代表美国英语。此属性受 Chrome、Firefox、Opera 和 Safari\
  \ 支持。\n\n\n\n正如你可能猜到的那样，`navigator` 对象以 Netscape Navigator 命名，这是最初支持 JavaScript\
  \ 的浏览器。幸运的是，这个对象也被 Internet Explorer 以及大多数其他现代浏览器支持。\n\n• `navigator.platform` 是当前浏览器的计算机平台。这是一个短字符串，例如\
  \ Linux i686、Win32 或 MacPPC。你可以用它来启用任何特定平台的特性——例如 ActiveX 组件。\n\n## 显示浏览器信息\n\n\
  作为如何读取 `navigator` 对象属性的示例，列表 21.1](#ch21.html_ch21ex01) 显示了一个脚本，该脚本可以显示当前浏览器属性列表及其值。\n\
  \n列表 21.1 用于显示浏览器信息的脚本\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Browser Information</title>\n  </head>\n  <body>\n    <h1>Browser Information</h1>\n\
  \    <p>`navigator` 对象包含了以下关于你正在使用的浏览器的信息：</p>\n    <script type=\"text/javascript\"\
  >\n      document.write(\"<ul>\");\n      document.write(\"<li><strong>Code Name\
  \ (代码名称):</strong> \" + navigator.appCodeName);\n      document.write(\"<li><strong>App\
  \ Name (应用名称):</strong> \" + navigator.appName);\n      document.write(\"<li><strong>App\
  \ Version (应用版本):</strong> \" + navigator.appVersion);\n      document.write(\"\
  <li><strong>User Agent (用户代理):</strong> \" + navigator.userAgent);\n      document.write(\"\
  <li><strong>Language (语言):</strong> \" + navigator.language);\n      document.write(\"\
  <li><strong>Platform (平台):</strong> \" + navigator.platform);\n      document.write(\"\
  </ul>\");\n    </script>\n  </body>\n</html>\n```\n\n此脚本包含一个基础的 HTML 文档。文档主体中使用了一个脚本，通过\
  \ `document.write()` 语句显示 `navigator` 对象的每个属性。\n\n要尝试此脚本，请将其加载到你选择的浏览器中。如果你有多个浏览器或浏览器版本，请在每个浏览器中尝试。Firefox\
  \ 对该脚本的显示如图图 21.1](#ch21.html_ch21fig01）所示。\n\n**图 21.1** Firefox 显示浏览器信息脚本。\n\n\
  ![image](img/21fig01.jpg)\n\n## 处理不诚实的浏览器\n\n如果你在某些版本的 Internet Explorer 中尝试了列表\
  \ 21.1](#ch21.html_ch21ex01) 中的浏览器信息脚本，你可能会感到惊讶。图 21.2 显示了 Internet Explorer 6.0\
  \ 如何显示该脚本。\n\n**图 21.2** Internet Explorer 6 如何显示浏览器信息脚本。\n\n![image](img/21fig02.jpg)\n\
  \n这种显示有几个意料之外的地方。首先，`navigator.language` 属性被列为 undefined（未定义）。这并不意外，因为 Internet\
  \ Explorer 不支持该属性。\n\n更重要的是，你会发现 `Mozilla` 一词出现在 Code Name（代码名称）和 User Agent（用户代理）字段中。完整的用户代理字符串如下：\n\
  \n`Mozilla/4.0 (compatible; MSIE 6.0; Windows 98)`\n\n信不信由，微软这样做确实有充分的理由。在浏览器战争的高盛时期，大约在\
  \ Netscape 3.0 和 IE 3.0 发布期间，看到“仅限 Netscape”的页面变得越来越常见。一些使用框架（frames）和 JavaScript\
  \ 等特性的 Web 管理员将其服务器设置为：拒绝所有在用户代理字符串中不包含 `Mozilla` 的浏览器。这样做的问题在于，由于这些特性中的大多数也受到 Internet\
  \ Explorer 支持。\n\n微软在 IE 4.0 中解决了这个问题，让 IE 的用户代理读取显示为 `Mozilla`，并带有一个括号括的 `compatible`\
  \ 一词。这允许 IE 用户查看那些页面，但仍然包含了足够的细节来告诉 Web 服务器正在使用哪种浏览器。\n\n你可能已经发现了 Internet Explorer\
  \ 6.0 用户代理字符串的另一个问题：显示为 `Mozilla/4.0` 的部分。IE 不仅声称自己是 Netscape，而且还伪装成 4.0 版本。为什么呢？\n\
  \n事实证明，这是微软为了在浏览器战争中保持领先一步的另一个努力，尽管这种做法看起来没那么合理。因为某些编写得糟糕的脚本会专门针对动态 HTML 页面检查 Mozilla/4，因此微软担心其\
  \ 5.0 版本无法运行这些页面。由于现在更改它只会引起更多困惑，这种传统一直延续到了 IE 6.0。\n\n尽管这些是浏览器战争史中两个有趣的插曲，但这一切对你意味着什么？嗯，当你的脚本尝试在\
  \ IE 和 Netscape 之间、以及不同版本之间进行区分时，你需要小心。你需要检查特定的组合，而不仅仅是检查 `navigator.appVersion`\
  \ 的值。幸运的是，有更好的处理方法，正如你将在下一节中学到的。\n\n### 跨浏览器脚本编写\n\n如果所有关于检测不同浏览器版本的细节听起来很困惑，那么这里有一个好消息——在大多数情况下，你完全不需要引用\
  \ `navigator` 对象就可以编写跨浏览器脚本。这不仅更容易，而且更好，因为检查浏览器的代码经常会被新版本的浏览器所误淆。\n\n## 特性感知\n\n\
  检查浏览器版本有时被称为*浏览器感知 (browser sensing)*。处理多个浏览器的更好方法被称为*特性感知 (feature sensing)*。在特性感知中，你不是检查特定的浏览器，而是检查特定的特性。例如，假设你的脚本需要使用\
  \ `getElementById()`。你可以用 `if` 语句开始脚本，检查该函数是否存在：\n\n```javascript\nif (getElementById)\
  \ {\n  // 执行某些操作\n}\n```\n\n如果 `getElementById` 函数存在，将执行该代码块。另一种使用特性感知的常用方法是在将使用某特性的函数开头：\n\
  \n```javascript\nfunction changeText() {\n  if (!getElementById) return;\n  // 如果支持该特性，则执行函数的其余部分\n\
  }\n```\n\n你不需要在使用*每一个*特性之前都检查它——例如，在大多数情况下，验证 `window` 对象是否存在并没有意义。你也可以假设某个特性的存在意味着其他特性也被支持：如果\
  \ `getElementById()` 被支持，那么其他 W3C DOM 函数也是支持的。\n\n**注意**\n\n特性感知在处理第三方库时也很有用，正如第\
  \ 22 章](#ch22.html_ch22)所提到的。你可以检查属于库的对象或函数是否存在，以验证在脚本使用其特性之前库文件已加载。特性感知是一种保持 JavaScript\
  \ 非侵入性的非常可靠的方法——如果浏览器支持该特性，它就能工作；如果浏览器不支持，你的脚本就不会干扰。这比尝试跟踪数百个不同的浏览器版本及其支持的内容要容易得多。\n\
  \n## 处理浏览器怪异（Quirks）\n\n既然特性感知比浏览器感知更好，为什么你仍然需要 `navigator` 对象呢？只有一种情况它仍然有用，尽管你可能永远不会遇到那种情况。\n\
  \n当你开发复杂的脚本并在多个浏览器中测试它时，你可能会遇到这种情况：你完全标准的代码在某个浏览器中正常工作，但在另一个浏览器中失败。假设你已经排除了脚本本身问题的可能，那么你可能遇到了浏览器\
  \ Bug，或者浏览器之间的特性差异。针对这种情况，有一些建议：\n\n• 双重检查你自己的代码中的 Bug。\n\n• 在 Web 上搜索解决方案，你可能可以避开这个\
  \ Bug。\n\n\n\n\n- 如果问题是某个浏览器缺少某功能，请使用特性检测（feature sensing）来检查该功能。\n- 当所有其他方法都失败时，使用\
  \ `navigator` 对象检测特定的浏览器，并替换为在该浏览器中运行的代码。这应该是你的最后手段。\n\n### 提示\nPeter-Paul Koch\
  \ 编写的 QuirksMode（[`www.quirksmode.org`](http://www.quirksmode.org)）是你寻找特定浏览器 bug\
  \ 相关信息时的一个很好的起点。\n\n## 支持非 JavaScript 浏览器\n\n你网站的某些访问者将使用完全不支持 JavaScript 的浏览器。这些并不只是少数使用老旧浏览器的顽固分子——实际上，不支持\
  \ JavaScript 的浏览器数量比你想象的要多：\n\n- 大多数现代浏览器（如 Internet Explorer、Firefox 和 Chrome）都包含关闭\
  \ JavaScript 的选项，而且某些用户会这样做。更常见的是，浏览器可能由服务提供商（ISP）或雇主默认关闭 JavaScript，这通常是为了增加性的盲目尝试。\n\
  - 某些公司防火墙和个人杀病毒软件会阻止 JavaScript。\n- 某些广告拦截软件会误阻止脚本运行，即使这些脚本与广告无关。\n- 如今越来越多的手机配备了网络浏览器，而其中大多数支持极少或完全不支持\
  \ JavaScript。\n- 某些视障用户使用特殊用途的浏览器或纯文本浏览器，这些浏览器可能不支持 JavaScript。\n\n如你所见，假设所有访问者都支持\
  \ JavaScript 是愚蠢的。接下来的章节将讨论两种可以确保这些用户仍可以使用网站的技巧。\n\n### 注意事项\n搜索引擎是另一种会频繁访问你网站的“浏览器”，它们通常不关注\
  \ JavaScript。如果你想让搜索引擎完全索引你的网站，避免将 JavaScript 成为导航网站的必要条件至关重要。\n\n### 使用 `<noscript>`\
  \ 标签\n\n对非 JavaScript 浏览器友好的一种方法是使用 `<noscript>` 标签。该标签在大多数现代浏览器中都支持，它可以向非 JavaScript\
  \ 浏览器显示消息。支持 JavaScript 的浏览器会忽略 `<noscript>` 标签之间的文本，而其他浏览器则显示它。这是一个简单的示例：\n\n```html\n\
  <noscript>\n\n此页面需要 JavaScript。你可以切换到支持 JavaScript 的浏览器，\n开启浏览器的脚本支持，或者切换到此页面的 <a\
  \ href=\"nojs.html\">非 JavaScript</a>版本。\n\n</noscript>\n```\n\n虽然这种方法有效，但问题在于并非所有支持\
  \ JavaScript 的浏览器都一致地支持 `<noscript>`。另一种避免 `<noscript>` 的替代方案是将支持 JavaScript 的用户重定向到另一个页面。这可以通过一个\
  \ JavaScript 语句来实现：\n\n```javascript\n<script type=\"text/javascript\">\n\nwindow.location=\"\
  JavaScript.html\";\n\n</script>\n```\n\n此脚本将用户重定向到另一个页面。如果浏览器不支持 JavaScript，脚本脚本不会被执行，页面的其余部分可以显示警告消息来解释情况。\n\
  \n### 保持 JavaScript 可选\n\n尽管你可以检测支持 JavaScript 的浏览器并向其他用户显示消息，但最好的选择是简单让你的脚本是非侵入性的（untrusive）。使用\
  \ JavaScript 来增强功能而不是作为核心特性；将 JavaScript 保存在单独的文件中并在 JavaScript 文件中分配事件处理程序，而不是在\
  \ HTML 中。不支持 JavaScript 的浏览器将直接忽略你的脚本。\n\n在那些绝对需要 JavaScript 的极少数情况下（例如 AJAX 应用或\
  \ JavaScript 游戏），你可以警告用户需要 JavaScript。然而，提供一种无需 JavaScript 的替代方法来使用网站是一个好主意，特别是如果它是你业务赖以生存的电子商务或业务网站。不要因为懒惰的编程而推开客户。\n\
  \n你绝对*不应该*要求 JavaScript 的地方是网站的导航。虽然你可以使用 JavaScript 创建下拉菜单和其他花哨的导航工具，但它们会阻止用户的非\
  \ JavaScript 浏览器查看你网站的所有页面。它们还会阻止搜索引擎查看整个网站，从而损害了你获取搜索流量的机会。\n\n### 注意事项\nGoogle\
  \ 的 Gmail 应用程序（[`mail.google.com`](http://mail.google.com)）是 AJAX 最著名的用途之一，它优雅的界面需要\
  \ JavaScript。然而，Google 提供了一个无需 JavaScript 即可使用的基础 HTML 视图。这允许 Google 在支持旧版浏览器和手机，而不会损害使用现代浏览器的用户的用户体验。\n\
  \n### 避免错误\n\n如果你已经确保 JavaScript 只是你网站的增强而非必要条件，那么无论出于什么原因，不支持 JavaScript 的浏览器用户仍然可以导航你的网站。最后一点需要担心的是：JavaScript\
  \ 可能会导致错误或让这些浏览器错误地显示你的页面。\n\n对于部分支持 JavaScript 的浏览器（如手机浏览器），这是一个特别担心的问题。它们可能会解释\
  \ `<script>` 标签并启动脚本，但可能不支持完整的 JavaScript 语言或 DOM。以下是避免错误的某些指南：\n\n- 为所有脚本使用单独的\
  \ JavaScript 文件。这是确保浏览器在不支持 JavaScript 的情况下完全忽略你的脚本的最佳方法。\n\n### 提示\nFirefox 和 Internet\
  \ Explorer 的开发者工具栏包含一种方便的方法，用于测试时关闭 JavaScript。\n\n- 每当你的脚本尝试使用较新的 DOM 特性（如 `document.getElementById()`）时，请使用特性检测。\n\
  - 在关闭浏览器 JavaScript 支持的情况下测试你的页面。确保没有看起来异常，并确保你仍然可以导航网站。\n\n## 尝试一下：创建一个非侵入性脚本\n\
  \n作为非侵入性脚本的示例，你可以创建一个脚本，在向页面添加功能而不损害其在旧版浏览器中的性能。在这个示例中，你将创建一个作为普通复选框替代品的脚本。\n\n\
  让我们从结果开始：图 21.3 显示了示例在 Firefox 中的外观。第一个复选框是普通的，第二个是由 JavaScript 管理的图形框。\n\n**图 21.3**\
  \ 运行中的选择框示例，图形框已选中。\n\n![image](img/21fig3.jpg)\n\n图形复选框只是一个你可以点击显示选中或未选中状态的图形。虽然这可以只是一个像复选框的简单\
  \ JavaScript 模拟，但它更复杂。查看此示例在 列表 21.2 中的 HTML。\n\n### 列表 21.2 图形复选框的 HTML 文件\n\n\
  ```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ HTML 1.1//EN\"\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>复选框</title>\n\
  \  </head>\n  <body>\n    <h1>图形复选框示例</h1>\n    <form name=\"form1\" method=\"post\"\
  \ action=\"\">\n      <p><input type=\"checkbox\" name=\"check1\" id=\"check1\"\
  />\n      普通的复选框。</p>\n      <p><input type=\"checkbox\" name=\"check2\" id=\"check2\"\
  />\n      通过非侵入性 JavaScript 创建的图形复选框。</p>\n    </form>\n    <script type=\"text/javascript\"\
  \ src=\"checkbox.js\"></script>\n  </body>\n</html>\n```\n\n\n\n\n如果你仔细观察 HTML，你会发现这两个复选框是使用标准的\
  \ `<input>` 标签以完全相同定义的。该脚本并没有替代复选框，而是将普通的复选框替换为图形版本。此示例中的脚本如列表 21.3 所示。\n\n列表 21.3\
  \ 图形复选框示例的 JavaScript 文件\n\n* * *\n\n```javascript\nfunction graphicBox(box) {\n\
  \   // 保持非干扰性\n   if (!document.getElementById) return;\n   // 找到对象及其父对象\n   obj\
  \ = document.getElementById(box);\n   parentobj = obj.parentNode;\n   // 隐藏普通的复选框\n\
  \   obj.style.visibility = \"hidden\";\n   // 创建图像元素并设置点击事件\n   img = document.createElement(\"\
  img\");\n   img.onclick = Toggle;\n   img.src = \"unchecked.gif\";\n   // 将复选框 ID\
  \ 保存到图像 ID 中\n   img.id = \"img\" + box;\n   // 显示图形复选框\n   parentobj.insertBefore(img,obj);\n\
  }\n\nfunction Toggle(e) {\n   if (!e) var e=window.event;\n   // 找到图像 ID\n   img\
  \ = (e.target) ? e.target : e.srcElement;\n   // 通过从图像 ID 中删除 \"img\" 来找到复选框的 ID\n\
  \   checkid = img.id.substring(3);\n   checkbox = document.getElementById(checkid);\n\
  \   // “点击”复选框\n   checkbox.click();\n   // 根据选中或未选状态显示正确的图像\n   if (checkbox.checked)\
  \ file = \"checked.gif\";\n   else file=\"unchecked.gif\";\n   img.src=file;\n}\n\
  \n// 用图形替换第二个复选框\ngraphicBox(\"check2\");\n```\n\n* * *\n\n脚本包含三个主要部分：\n\n- `graphicBox()`\
  \ 函数将普通的复选框转换为图形复选框。它首先通过更改其 `style.visibility` 属性来隐藏现有的复选框，然后创建一个包含 `unchecked.gif`\
  \ 图形的新图像节点，并将其插入到 DOM 中原始复选框旁边。它为图像分配了一个包含文本 `img` 以及复选框 `id` 属性的 `id` 属性，以便以后查找复选框。\n\
  - `Toggle()` 函数由 `graphicBox()` 指定为新图像 `onClick` 事件的事件处理器。此函数从图像的 `id` 属性中移除 `img`\
  \ 以找到真实复选框的 `id`。它对复选框执行 `click()` 方法来切换其值。最后，它根据真实复选框的状态将图像改为 `unchecked.gif` 或\
  \ `checked.gif`。\n- 脚本文件的最后一行运行 `graphicBox()` 函数，以替换 ID 属性为 `check2` 的第二个复选框。\n\
  \n使用这种技术有三个重要的优点。首先，它是非干扰性脚本。HTML 保持了简单，不支持 JavaScript 的浏览器将显示普通的复选框。其次，由于真实的复选框仍在页面上只是被隐藏了，当表单提交到服务器端脚本时，它将正常工作。最后但同样重要的是，你可以通过通过在\
  \ HTML 文件中定义普通复选框并添加 `graphicBox()` 调用来转换每一个，从而创建任意数量的图形复选框。\n\n要尝试此示例，请将 JavaScript\
  \ 文件保存为 `checkbox.js`，并确保 HTML 文件位于同一文件夹中。你还需要在同一文件夹中两个大小相同的图像 `unchecked.gif` 和\
  \ `checked.gif`。\n\n* * *\n\n## 总结\n\n在本章中，你学习了许多编写尽可能在许多浏览器中运行的脚本的指南，以及在处理不同浏览器时如何避免错误和烦恼。最重要的是，你学会了如何在保持页面短小、高效且符合\
  \ Web 标准的同时使用 JavaScript。\n\n### 问与答\n\n**Q. 是否可能创建出 100% 非干扰性的 JavaScript，它可以在增强页面而不会给任何人带来任何麻烦？**\n\
  \n**A.** 不完全是。例如，本章“自己尝试”（Try It Yourself）部分的非干扰性脚本就很接近了——它将在最新的浏览器中运行，而普通的复选框即使在古老的浏览器中也能正常显示和工作。然而，如果使用现代浏览器的用户关闭了图像，它仍然可能会失败：由于支持\
  \ JavaScript，脚本会隐藏复选框，但那里将没有图像。这是一个罕见的情况，但它说明了你添加的任何功能都可能给一小部分用户带来问题。\n\n**Q. 我可以使用\
  \ `navigator` 对象或其他技术检测用户的电子邮箱地址吗？**\n\n**A.** 不，没有使用 JavaScript 检测用户电子邮件地址的可靠方法。（如果存在，你每天都会在信箱里收到成百封来自检测到它的公司的广告。）\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，旨在巩固知识点。\n\n#### 测验\n\n**1. 下列哪个是放置 JavaScript 的最佳位置？**\n\
  a. 直接放在 HTML 文档中\nb. 在单独的文件中\nc. 在 CSS 文件\n\n**2. 下列哪个是你无法用 JavaScript 做到的事情？**\n\
  a. 将不支持它的浏览器引导到另一个页面\nb. 将 Internet Explorer 的用户引导到另一个页面\nc. 将非 JavaScript 用户引导到某个页面\n\
  \n**3. 下列哪个是定义在所有浏览器中运行的事件处理器的最佳方法？**\na. `<body onLoad=\"MyFunction()\">`\nb. `window.onload=MyFunction;`\n\
  c. `window.attachEvent('load',MyFunction,false);`\n\n#### 答案\n\n1. b. JavaScript\
  \ 的最佳位置是在单独的文件。\n2. c. 你无法将非 JavaScript 用户引导到某个页面，因为脚本根本不会执行。\n3. b. `window.onload=MyFunction;`\
  \ 在所有浏览器中都有效。\n\n## 练习\n\n- 在列表 21.2 的 HTML 文档中添加几个复选框，并在列表 21.3 的脚本中添加相应的函数调用，将它们全部转换为图形复选框。\n\
  - 修改列表 21.3 中的脚本，将所有类 值为 `graphic` 的复选框转换为图形复选框。你可以使用 `getElementsByTagName()` 然后检查每个项的\
  \ `className` 属性。\n\n\n\n\n使用这些库中的某一个通常只需要将一个或多个文件复制到你的网站，并在文档中包含一个 `<script>` 标签来加载该库。接下来的章节将讨论几个流行的\
  \ JavaScript 库。\n\n### Prototype\n\nPrototype 由 Sam Stephenson 创建，是一个 JavaScript\
  \ 库，它可以简化诸如操作 DOM 对象、处理表单数据以及远程脚本（AJAX）等任务。通过在你的文档中包含单个 `prototype.js` 文件，你就可以使用基础\
  \ JavaScript 的许多改进功能。\n\n例如，你可能使用过 `document.getElementById` 方法来获取网页中某个元素的 DOM 对象。Prototype\
  \ 在 `$()` 函数中包含了该方法的改进版本。它不仅输入起来更方便，而且比内置函数更高级，并支持多个对象。\n\n在你的页面中添加 Prototype 只需要一个文件\
  \ `prototype.js` 和一个 `<script>` 标签：\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"prototype.js\"></script>\n```\n\n#### Note\nPrototype 是一个免费的开源软件。你可以从它的官方网站\
  \ [`www.prototypejs.org/`](http://www.prototypejs.org/) 下载它。Prototype 也被内置在用于服务端语言\
  \ Ruby 的 Ruby on Rails 框架中——更多信息请参见 [`www.rubyonrails.com/`](http://www.rubyonrails.com/)。\n\
  \n### jQuery\n\njQuery 的第一个版本于 2006 年推出。它最初是一种易的跨浏览器 DOM 操作手段，随后已变成了一个稳定且强大的库，不仅包含\
  \ DOM 操作工具，还包含许多额外功能，这些功能让跨浏览器 JavaScript 编写变得更加简单和高效。\n\n#### Note\njQuery 的主页位于\
  \ [`jquery.com/`](http://jquery.com/)，在那里你不仅可以下载最新版本，还可以访问广泛的文档和示例代码。\n\n配套的 UI\
  \ 库可以在 [`jqueryui.com/`](http://jqueryui.com/) 找到。\n\n该库目前已更新到 1.6.2 版本，现在还有一个额外的高级用户界面扩展库，可以与现有库配合使用，以快速构建和部署丰富的用户界面，或为现有组件添加各种吸引人的效果。\n\
  \n与之前描述的 Prototype 库一样，jQuery 的核心是一套复杂的跨浏览器元素选择方法。用于获取元素的选择器基于类似 CSS 的简单选择器样式的组合，因此结合你在第三部分中学习的\
  \ CSS 技术以及“[使用 CSS 的高级网页设计”，你上手 jQuery 应该没有问题。例如，如果你想获取一个 ID 为 `someElement` 的元素，只需要使用以下代码：\n\
  \n```javascript\n$(\"#someElement\")\n```\n\n#### Tip\n如果你不想在自己的电脑上下载并存储 jQuery\
  \ 库，可以使用远程托管的版本，例如 Google 提供的版本。与其在页面头部包含本地托管的 .js 文件，不如使用以下代码：\n\n```html\n<script\
  \ src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.6.2/jquery.min.js\" type=\"\
  text/javascript\"></script>\n```\n\n在许多情况下，由于 Google 的服务器针对低延迟、大规模并行内容交付进行了优化，这提供的性能比自己托管的版本更好。\n\
  \n或者，要返回一组具有 `someClass` 类名的元素，你只需使用以下代码：\n\n```javascript\n$(\".someClass\")\n\
  ```\n\n我们可以非常简单地获取或设置与所选元素关联的值。假设例如，我们想要隐藏所有类名为 `hideMe` 的元素。我们可以用完全跨浏览器的方式，只需一行代码即可实现这一点：\n\
  \n```javascript\n$(\".hideMe\").hide();\n```\n\n操作 HTML 和 CSS 属性同样简单。例如，要在所有段落元素后添加“powered\
  \ by jQuery”短语，我们只需编写如下：\n\n```javascript\n$(\"p\").append(\" powered by jQuery\"\
  );\n```\n\n#### Tip\n你甚至可以通过编写更多插件来自己扩展 jQuery，或者使用其他开发者提交的数千个插件。浏览 [`www.jqueryplugins.com/`](http://www.jqueryplugins.com/)\
  \ 可以查看可搜索类别中的大量示例。\n\n然后为了更改这些相同元素的背景颜色，我们可以直接操作它们的 CSS 属性：\n\n```javascript\n$(\"\
  p\").css(\"background-color\",\"yellow\");\n```\n\n此外，jQuery 还包含了简单的跨浏览器方法，用于判断元素是否具有某个类、添加和删除类、获取和设置元素的文本或\
  \ `innerHTML`、导航 DOM、获取和设置 CSS 属性，以及处理简单的跨浏览器事件。\n\n关联的 UI 库增加了大量的 UI 组件（如日期选择器、滑块、对话框和进度条）、动画工具、拖放能力以及更多功能。\n\
  \n### Script.aculo.us\n\n到本书结束时，你将学习使用 JavaScript 完成一些有用的操作，通常涉及复杂的代码。但你也可以使用预构建的库在页面中加入令人印象深刻的效果。这让你只需几行代码就能使用惊艳的效果。\n\
  \n由 Thomas Fuchs 创建的 Script.aculo.us 就是这样的库之一。它包含了简化拖放任务的功能，例如重新排列项目列表。它还包含许多组合效果，允许你在页面中使用高亮和动画过渡。例如，页面的新部分可以短暂高亮以吸引用户的注意力，或者页面的部分内容淡出或滑出屏幕。\n\
  \n在包含了适当的文件后，使用效果就像使用 JavaScript 的内置方法一样简单。例如，以下语句使用 Script.aculo.us 将 ID 为 `test`\
  \ 的元素淡出：\n\n```javascript\nobj = document.getElementById(\"test\");\nnew Effect.Fade(obj);\n\
  ```\n\n#### Note\n你将在本章节后面的尝试一下创建一个演示 Script.aculo.us 效果的脚本。\n\nScript.aculo.us\
  \ 构建在之前描述的 Prototype 框架之上，并包含了 Prototype 的所有函数，因此你也可以通过 `$` 函数进一步简化它：\n\n```javascript\n\
  new Effect.Fade(\"test\"));\n```\n\n### AJAX 框架\n\nAJAX（异步 JavaScript 和 XML），也称为远程脚本，允许\
  \ JavaScript 与运行在 Web 服务器上的程序通信。这使得 JavaScript 可以执行传统上无法的操作，例如从数据库动态加载信息或在不刷新网页的情况下存储数据。\n\
  \nAJAX 需要一些复杂的脚本，因为与服务器通信的方法取决于使用的浏览器。幸运的是，许多库被创建以满足简单使用 AJAX 的需求，你将在本书的后部分尝试这些。\n\
  \n之前描述的 jQuery 和 Prototype 库都包含了 AJAX 功能。还有许多专门的 AJAX 库。其中最流行的之一是 SAJAX（Simple AJAX），它是一个可以方便使用\
  \ JavaScript 与 PHP、Perl 以及其他语言进行 AJAX 通信的开源工具包。详情访问 [`www.modernmethod.com/sajax`](http://www.modernmethod.com/sajax)。\n\
  \n#### Note\n参见第 24 章 “AJAX: 远程脚本”，获取使用和不使用第三方库的远程脚本示例。\n\n### 其他库\n\n还有许多 JavaScript\
  \ 库，而且随着 JavaScript 作为应用语言受到越来越多的重视，越来越多的库不断出现。以下是你可能想要探索的更多库：\n\n\n\n\n\n- `Dojo`\
  \ ([`www.dojotoolkit.org/`](http://www.dojotoolkit.org/)) 是一个开源工具包，它增强了 JavaScript\
  \ 的功能，以简化应用程序和用户界面的构建。提供了从额外的字符串和数学函数到动画和 AJAX 的各种功能。\n- `Yahoo! UI Library` ([`developer.yahoo.net/yui/`](http://developer.yahoo.net/yui/))\
  \ 由 Yahoo! 开发并根据开源许可证向所有人开放。它包含了动画、DOM 特性、事件管理以及日历和滑动条等易于使用的用户界面元素。\n- `MochiKit`\
  \ ([`mochikit.com/`](http://mochikit.com/)) 是一个轻量级库，添加了处理 DOM、CSS 颜色、字符串格式化和 AJAX\
  \ 的功能。它还支持一个良好的日志机制用于调试你的脚本。\n- `MooTools` ([`mootools.net/`](http://mootools.net/))\
  \ 是一个紧凑、模块化的 JavaScript 框架，允许你使用简单易懂、文档良好的 API（应用程序编程接口）构建强大、灵活且跨浏览器的代码。\n\n***\n\
  \n# 亲自尝试：使用库添加效果\n\n为了看到使用外部库是多么简单，现在你将创建一个包含 `Script.aculo.us` 库的示例脚本，并使用事件处理器来演示几种可用的效果。\n\
  \n## 下载库\n\n要使用该库，你需要下载它并将所需的文件复制到存储你脚本的相同文件夹中。你可以从 `Script.aculo.us` 网站 [`script.aculo.us/downloads`](http://script.aculo.us/downloads)\
  \ 下载该库。\n\n***\n\n### 注意事项\n\n此示例是 `Script.aculo.us` 库的 1.9.0 版本创建的。它在更高版本上也应该可以工作，但该库自本文编写以来可能发生了变化。如果你遇到问题，可能需要使用这个特定的版本。\n\
  \n***\n\n下载内容以 Zip 文件的格式提供。在 Zip 文件内部，你将找到一个遵循 `scriptaculous-js-x.x.x` 命名的文件夹，其中每个\
  \ `x` 代表版本号的一部分（本文编写时的版本为 1.9.0）。你需要从该文件夹下的子文件夹中获取以下文件：\n\n- `lib` 文件夹下的 `prototype.js`（Prototype\
  \ 库）\n- `src` 文件夹下的 `effects.js`（效果函数）\n\n将这两个文件复制到电脑上的文件夹中，并确保在该文件夹中创建你的演示脚本。\n\
  \n***\n\n### 注意\n\n`Script.aculo.us` 下载包含许多其他文件，如果你打算使用所有功能，可以包含整个库。对于此示例，你只需要这里提到的两个文件。\n\
  \n***\n\n## 包含文件\n\n要将库添加到 HTML 文档，只需使用 `<script>` 标签包含你从下载中复制的两个 JavaScript 文件：\n\
  \n```html\n<script type=\"text/javascript\" src=\"prototype.js\"> </script>\n<script\
  \ type=\"text/javascript\" src=\"effects.js\"> </script>\n```\n\n如果你将这些语句作为文档 `<head>`\
  \ 部分的第一内容，则库函数将可以在页面任何地方的其他脚本或事件处理器可用。\n\n## 使用效果\n\n在包含库之后，你只需要包含一点 JavaScript\
  \ 来触发效果。我们将使用封装在 `id` 值为 `test` 的 `<div>` 标签中的页面部分来演示这些效果。每个效果都由按钮上的简单事件处理器触发。例如，这段代码定义了淡出（Fade\
  \ Out）按钮：\n\n```html\n<input type=\"button\" value=\"Fade Out\" onclick=\"new Effect.Fade($('test'))\"\
  >\n```\n\n***\n\n### 提示\n\n此示例将演示六种效果：`Fade`、`Appear`、`SlideUp`、`SlideDown`、`Highlight`\
  \ 和 `Shake`。库中有超过 16 种效果，以及支持拖放和其他功能的方法。详见 [`script.aculo.us`](http://script.aculo.us)。\n\
  \n***\n\n这使用了 `Prototype` 内置的 `$` 函数来获取 `id` 值为 `test` 的元素对象，然后将其传递给 `Script.aculo.us`\
  \ 内置的 `Effect.Fade` 函数。\n\n## 构建脚本\n\n在包含库之后，你可以将它们与事件处理器和一些示例文本结合，创建一个 `Script.aculo.us`\
  \ 效果的完整演示。此示例的完整 HTML 文档见 列表 22.1。\n\n### 列表 22.1 完整的库效果示例\n\n***\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n  <head>\n    <title>Testing script.aculo.us effects</title>\n\
  \    <script type=\"text/javascript\" src=\"prototype.js\"></script>\n    <script\
  \ type=\"text/javascript\" src=\"effects.js\"></script>\n  </head>\n  <body>\n \
  \   <h1>Testing script.aculo.us Effects</h1>\n    <form name=\"form1\">\n      <input\
  \ type=\"button\" value=\"Fade Out\" onclick=\"new Effect.Fade($('test'))\">\n \
  \     <input type=\"button\" value=\"Fade In\" onclick=\"new Effect.Appear($('test'))\"\
  >\n      <input type=\"button\" value=\"Slide Up\" onclick=\"new Effect.SlideUp($('test'))\"\
  >\n      <input type=\"button\" value=\"Slide Down\" onclick=\"new Effect.SlideDown($('test'))\"\
  >\n      <input type=\"button\" value=\"Highlight\" onclick=\"new Effect.Highlight($('test'))\"\
  >\n      <input type=\"button\" value=\"Shake\" onclick=\"new Effect.Shake($('test'))\"\
  >\n    </form>\n  </body>\n</html>\n```\n\n\n## 总结\n\n在本章中，你学习了许多 JavaScript 第三方库。这些库可以提供许多优势，包括简单的跨浏览器脚本、HTML\
  \ 和 CSS 值的选择与编辑、动画以及更高级的用户界面工具（如拖放）。\n\n## 问答\n\n**问：如何将第三方 JavaScript 库包含到我的页面中？**\n\
  \n答：每个库略有不同。通常只需将一个或多个外部 .js 文件引入页面的 `<head>` 部分即可。具体细节请参考所选库提供的文档。\n\n**问：我可以在同一个脚本中使用多个第三方库吗？**\n\
  \n答：理论上可以：如果库编写得良好且设计为互不干扰，那么组合它们应该没有问题。在实践中，这取决于你需要的库以及它们是如何编写的。\n\n**问：我可以构建自己的库来简化脚本编写吗？**\n\
  \n答：可以，当你处理更复杂的脚本时，你会发现自己反复使用相同的函数。你可以将它们合并成一个库供自己使用。这只需要创建一个 .js 文件即可。\n\n\n\n\n\
  工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n### 测验\n\n**1.** 下列中哪个对象不是\
  \ JavaScript 库？\n\n**a.** MooTools\n**b.** Prototype\n**c.** AJAX\n\n**2.** 你可以如何自己扩展\
  \ `jQuery`？\n\n**a.** `jQuery` 无法被扩展。\n**b.** 通过编写服务器端脚本。\n**c.** 通过编写插件或使用预编写的插件。\n\
  \n**3.** `Script.aculo.us` 还别使用了哪种 JavaScript 第三方库？\n\n**a.** Prototype\n**b.**\
  \ Dojo\n**c.** `jQuery`\n\n### 答案\n\n**1.** c. `AJAX` 是一种编程技术，允许你的脚本使用托管在你服务器上的资源。有很多库可以帮助你使用\
  \ `AJAX` 功能，但 `AJAX` 本身并不是一个库。\n\n**2.** c. `jQuery` 有完善文档的方法来编写和使用插件。\n\n**3.**\
  \ a. `Script.aculo.us` 使用了 `prototype.js` 库。\n\n## 练习\n\n• 使用 `jQuery` 库编写一个简单的脚本，或使用\
  \ `jQuery` 网站上的示例脚本。分别使用本地托管和远程托管版本的 `jQuery` 运行脚本。你能看到性能上的任何差异吗？\n\n• 访问 [`script.aculo.us/`](http://script.aculo.us/)\
  \  `Script.aculo.us` 页面查找完整的效果列表。修改 Listing 22.1` 为一个或多个额外效果添加按钮。\n\n## 第 23 章 Greasemonkey：使用\
  \ JavaScript 增强网页\n\n* *\n\n本章将学到：\n\n• `Greasemonkey` 和用户脚本如何增强你的浏览器\n• 如何在 Firefox\
  \ 中安装和配置 `Greasemonkey`\n• 安装和管理用户脚本\n• 创建你自己的用户脚本\n• 为脚本定义元数据\n• 使用 `Greasemonkey`\
  \ API\n• 在网页表单中添加宏\n* *\n\n最近的趋势之一是 `JavaScript` 正以新的方式在浏览器内部和外部使用。在本章中，你将了解 `Greasemonkey`，这是一个\
  \ Firefox 扩展，它允许你编写脚本来修改你访问的网站的外观和行为。在有适当插件的情况下，用户脚本也可以 Internet Explorer、Opera\
  \ 和 Safari 中运行，而 Chrome 对用户脚本有原生支持。\n\n### 介绍 Greasemonkey\n\n到目前为止，你一直在使用 `JavaScript`\
  \ 来处理自己的网站。在本章中，你将暂时休息，并学习一种在*他人的网站上*使用 `JavaScript` 的方法。`Greasemonkey` 是 Firefox\
  \ 浏览器的扩展，它允许运行*用户脚本*。这些脚本在你加载页面时立即运行，并可以对页面的 `DOM` 进行更改。\n\n用户脚本可以设计为适用于所有网页，或仅影响特定网站。以下是用户脚本可以做的一些事情：\n\
  \n• 改变一个或多个网站的外观——颜色、字体大小等\n• 使用 `JavaScript` 改变一个或多个网站的行为\n• 在网站作者之前修复网站中的 错误\n\
  • 为你的浏览器添加功能，例如文本宏——请参阅本章后面的自己试一下部分查看示例\n\n作为一个简单的例子，`Greasemonkey` 提供了一个名为 `Linkify`\
  \ 的用户脚本。它影响你访问的所有页面，并将未链接的 URL 转换为超链接。换句话说，脚本会在页面中查找任何类似于 URL 的字符串，如果它发现一个未包含在 `<a>`\
  \ 标签中的 URL，它会修改 `DOM` 为该 URL 添加链接。\n\n`Greasemonkey` 脚本可以从像 `Linkify` 这样简单的脚本到复杂的脚本，例如为浏览器添加功能、重新排列网站以使其更易用，或消除网站中烦人的功能（如弹出广告）。\n\
  \n* *\n\n注意\n\n`Greasemonkey` 由 Aaron Boodman 于 2004 年创建。它的官方网站是 [`www.greasespot.net/`](http://www.greasespot.net/)。在编写本书时，`Greasemonkey`\
  \ 的当前版本是 `0.9.10`。\n\n* *\n\n记住 `Greasemonkey` 对你访问的网站不会进行任何操作——它严格影响你对网站的*个人体验*。通过这种方式，它类似于其他的浏览器自定义，例如个人样式表和浏览器字体设置。\n\
  \n### 在 Firefox 中安装 Greasemonkey\n\n`Greasemonkey` 适用于 Windows、Macintosh 和 Linux\
  \ 平台的 Firefox。你可以通过访问 [`www.greasespot.net/`](http://www.greasespot.net/) 并点击下载链接来安装它。使用“添加到\
  \ Firefox”按钮安装 `Greasemonkey`（参见图 23.1）。安装后，你可能被要求重启 Firefox 才能使用 `Greasemonkey`。\n\
  \n**图 23.1** 使用“添加到 Firefox”按钮安装 `Greasemonkey`。\n\n![image](img/23fig01.jpg)\n\n\
  * *\n\n注意\n\n当你第一次安装 `Greasemonkey` 时，你需要安装一个或多个脚本，正如本章后部分“使用用户脚本”中描述的那样，以便使其变得有用。\n\
  \n* *\n\n### 用于 Internet Explorer 的 Trixie\n\nGreasemonkey 扩展是作为 Firefox 扩展编写的，在其他浏览器上不起。幸运的是，对于那些偏好\
  \ Internet Explorer 的人，有一个替代方案：Trixie 是一个支持用户脚本的 Internet Explorer 插件。可以从官网免费获取\
  \ Trixie。要安装 Trixie，你需要安装 .NET Framework。\n\nTrixie 支持 `Greasemonkey` 的大部分功能，`Greasemonkey`\
  \ 的用户脚本通常不需要修改即可与 Trixie 工作；然而，由于 Firefox 和 Internet Explorer 之间的差异，并不是所有脚本都能工作。\n\
  \n### 其他浏览器\n\n用户脚本功能也出现在其他浏览器中。除了 IE 版 Trixie 外，其他一些浏览器也可以支持用户脚本：\n\n• Opera Software\
  \ 的跨平台浏览器 Opera 内置了用户脚本支持，并在情况下支持 `Greasemonkey` 脚本。详情请访问 Opera 网站 [`www.opera.com/`](http://www.opera.com/)。\n\
  \n• 从 4.0 版本开始，Google Chrome 浏览器就对 `Greasemonkey` 脚本包含了原生支持。在后台，这些被转换为 Chrome 扩展。\n\
  \n• Creammonkey 是 Apple Safari 浏览器的测试版插件，用于支持用户脚本。你可以在 [`8-p.info/Creammonkey/`](http://8-p.info/Creammonkey/)\
  \ 找到它。\n\n### 用户脚本安全\n\n在进入用户脚本之前，警告：除非你理解脚本在做什么或从可靠来源获取，否则不要安装脚本。尽管 `Greasemonkey`\
  \ 开发者花费大量大量消除安全漏洞，但恶意脚本仍然可能给你带来麻烦——至少它可以将你访问哪些网站的信息发送到第三方网站。\n\n为了降低安全风险，请确保你运行最新版本的\
  \ `Greasemonkey` 或 `Trixie`。仅启用你正在使用的脚本，并将你不信任的脚本限制在特定页面，以免在你访问的每个页面上运行。\n\n###\
  \ 使用用户脚本\n\n用户脚本是使用 `JavaScript` 的全新方式——不是将其上传到你的网站，而是将其安装在浏览器中供个人使用。以下章节将向你展示如何查找、安装和管理脚本。\n\
  \n#### 查找脚本\n\n任何人都可以编写用户脚本，许多人已经这样做。`Greasemonkey` 赞助了一个用户脚本目录，位于 [`userscripts.org/`](http://userscripts.org/)。你可以在那里浏览或搜索脚本，或者提交你编写的脚本。\n\
  \n\n\n脚本库中有数千个可用的脚本。除了通用脚本外，许多脚本专门用于为特定网站添加功能，或移除某些烦人的功能。\n\n## 安装脚本\n\n在你找到想要安装的脚本后，可以从\
  \ Web 端安装它：\n\n• 在 Firefox 中使用 Greasemonkey，在浏览器中打开该脚本，然后从“工具”菜单中选择“安装此用户脚本”（Install\
  \ This User Script）。\n\n• 在 IE 中使用 Trixie，将脚本下载到 Trixie 安装文件夹下的 `Scripts` 目录。默认情况下，路径为\
  \ `Program Files\\Bhelpuri\\Trixie\\Scripts`。然后，进入“工具”菜单并选择 Trixie 选项（Alt-T, X）。这将显示\
  \ Trixie 选项对话框，你可以点击“重载脚本”（Reload Scripts）按钮并点击确定。这将加载你的新脚本并启用它。\n\n你也可以从本地文件安装脚本。你将在本章稍后的部分使用这种技术来安装你自己的脚本。\n\
  \n## 管理脚本\n\n使用 Greasemonkey 安装一个或多个脚本后，你可以从 Firefox 菜单中选择“Greasemonkey, 管理用户脚本”来管理它们。管理用户脚本对话框如图\
  \ 23.2 所示。\n\n**图 23.2** 在 Greasemonkey 中管理用户脚本。\n\n![image](img/23fig02.jpg)\n\n\
  你可用的用户脚本列在右侧。点击脚本名称对其进行管理：\n\n• 使用“启用/禁用”（Enable/Disable）按钮启用或禁用每个脚本。\n\n• 点击“移除”（Remove）按钮移除脚本。\n\
  \n• 右键点击并选择“编辑”（Edit）以用文本编辑器打开脚本。保存保存后，它将立即在你加载的页面上生效。\n\nIE 版 Trixie 也有类似的对话框。可以使用\
  \ Trixie 选项对话框（Alt-T, X）来管理已安装的脚本。如图 23.3 所示，从该对话框你可以查看安装的脚本、启用或禁用脚本或重载脚本。该对话框还显示脚本将在哪些网站或页面上执行。\n\
  \n**图 23.3** Trixie 选项对话框。\n\n![image](img/23fig03.jpg)\n\n## 测试用户脚本\n\n如果你启用了一个脚本，只要你加载与该脚本指定的“包含页面”（Included\
  \ Pages）匹配的页面，它就会被激活。（脚本在页面加载后、但在 `onload` 事件之前运行。）如果你想确保 Greasemonkey 正在运行，可以尝试一个已启用的可用脚本（一旦加载匹配其下载的页面它就会激活），或者输入下一节中的简单脚本。\n\
  \n## 激活和禁用 Greasemonkey 或 Trixie\n\n有时当脚本启用时，只要你加载匹配你想完全关闭 Greasemonkey 的页面，它就会被激活，特别是当你安装的某个脚本导致错误时。要要操作，右键点击浏览器右下角的猴子图标，选择“启用”（Enabled）选项以取消选择。猴子图标将变为灰色的难脸猴子，此时将不会运行任何用户脚本。你可以随时使用相同的选项重新启用它。\n\
  \n对于 Internet Explorer 版 Trixie，使用 Explorer 的“管理加载项”（Manage Add-Ons）菜单禁用 Trixie。\n\
  \n## 创建你自己的用户脚本\n\n你已经学习了创建用户脚本所需的大部分知识，因为它们是用 JavaScript 编写的。在本节中，你将创建并测试一个简单的脚本，并查看在创建更高级脚本时将用的一些功能。\n\
  \n### 创建简单的用户脚本\n\nGreasemonkey 的最佳用途之一是解决你访问的网站中的烦扰。例如，某个网站可能在橙色背景上使用绿色文字。尽管你可以联系管理员并请求更改颜色，但用户脚本让你自己快速解决解决问题。\n\
  \n作为用户脚本的简单演示，你可以创建一个用户脚本，更改你访问的网站中段落的文字和背景颜色。列表 23.1 显示了这个用户脚本。\n\n列表 23.1 更改段落颜色的简单用户脚本\n\
  \n* * *\n\n```\n// Change the color of each paragraph\n\nvar zParagraphs = document.getElementsByTagName(\"\
  p\");\n\nfor (var i=0; i<zParagraphs.length; i++) {\n\n   zParagraphs[i].style.backgroundColor=\"\
  #000000\";\n\n   zParagraphs[i].style.color=\"#ffffff\";\n}\n```\n\n* * *\n\n此脚本使用\
  \ `getElementsByTagName()` DOM 方法找到当前文档中的所有段落标签，并将它们的对象存储在 `zParagraphs` 数组中。`for`\
  \ 循环遍历数组并更改每个对象的 `style.color` 和 `style.backgroundColor` 属性。\n\n### 描述用户脚本\n\nGreasemonkey\
  \ 支持在脚本开头使用元数据。这些是不会被脚本执行的 JavaScript 注释，但为 Greasemonkey 提供信息。要使用此功能，请将注释封装在 `//\
  \ ==UserScript==` 和 `// ==/UserScript` 注释之间。\n\n元数据部分可以包含以下任何指令。这些都是可选的，但使用它们会让你的用户脚本更容易安装和使用。\n\
  \n• `@name`——脚本的短名称。\n\n• `@namespace`——脚本的可选 URL。\n\n• `@description`——脚本的单行描述。\n\
  \n• `@include`——脚本应该运行的网站 URL。\n\n• `@exclude`——脚本不应使用的网站 URL。\n\n列表 23.2 显示了带有元数据的颜色更改示例。\n\
  \n* * *\n\n```\n// ==UserScript==\n// @name WhiteOnBlack\n// @namespace http://thickbook.com/\n\
  // @description Display paragraphs in white on black\n// @include *\n// ==/UserScript==\n\
  \n// Change the color of each paragraph\n\nvar zParagraphs = document.getElementsByTagName(\"\
  p\");\n\nfor (var i=0; i<zParagraphs.length; i++) {\n\n   zParagraphs[i].style.backgroundColor=\"\
  #000000\";\n\n   zParagraphs[i].style.color=\"#ffffff\";\n}\n```\n\n* * *\n\n###\
  \ 测试你的脚本\n\n现在你已经添加了元数据，安装脚本非常简单。按照以下步骤在 Firefox 中安装脚本：\n\n1. 将脚本文件保存为 `colors.user.js`。文件名必须以\
  \ `.user.js` 结尾才能被识别为 Greasemonkey 脚本。\n2. 在 Firefox 中，选择“文件, 打开”（File, Open）。\n\
  3. 从打开文件对话框中选择你的脚本。\n4. 脚本在浏览器中显示后，选择工具, 安装此用户脚本（Tools, Install This User Script）。\n\
  5. 将显示提示告知安装成功。新的用户脚本现在正在所有网站上运行。\n\n\n\n\n\n你可能不想对你访问的*所有*网站都进行如此剧烈的更改。相反，你可以使用\
  \ `@include` 让此脚本仅影响一两个两个你觉得颜色难以阅读的网站。不要忘记，你也可以根据自己的喜好更改脚本中的颜色。\n\n* *\n\n### Greasemonkey\
  \ API 函数\n\n你可以使用本书中涵盖的所有 DOM 方法在用户脚本中处理页面操作，并结合 JavaScript 的内置函数一起使用。除了这些方法外，Greasemonkey\
  \ 还定义了一个 API（应用程序编程接口），包含几个可以专门在用户脚本中使用的函数：\n\n• `GM_log(message, level)`—向 JavaScript\
  \ 控制台插入一条消息。`level` 参数表示消息的严重程度：0 表示信息，1 表示警告，2 表示错误。\n\n• `GM_setValue(variable,\
  \ value)`—设置一个由 Greasemonkey 存储的变量。这些变量存储在本地机器上。它们特定于设置它们的脚本，并可以在将来由该脚本再次使用。（这些变量类似于\
  \ cookie，但不会发送到服务器。）\n\n• `GM_getValue(variable)`—获取之前通过 `GM_setValue` 设置的值。\n\n\
  • `GM_registerMenuCommand(command, function)`—向浏览器菜单添加一个命令。这些命令出现在“工具”，“用户脚本命令”下。`command`\
  \ 参数是菜单中列出的名称，`function` 是脚本中的一个函数，菜单选择将激活它。\n\n• `GM_xmlhttpRequest(details)`—从远程服务器请求文件，类似于第\
  \ 24 章中描述的“AJAX：远程脚本”中的 AJAX 功能。`details` 参数是一个包含多个用于控制请求的的对象。请查看 Greasemonkey 文档了解你可以指定的所有属性。\n\
  \n### 创建特定网站脚本\n\n你可能想使用用户脚本来修复问题或为特定网站添加功能。例如，你可能想移除 Facebook 个人资料页显示的所有广告——在 [`userscripts.org/`](http://userscripts.org/)\
  \ 上有很多 Greasemonkey 脚本可以解决此类问题。创建此类自定义脚本，除了使用 `@include` 指定网站的 URL 外，你还需要了解该网站的\
  \ DOM。\n\n你可以使用 Firefox 中的 DOM 检查器（或 Internet Explorer 开发者工具栏中的类似功能）浏览网站的 DOM，并找到你想要处理的对象。根据它们的标记方式，你可以通过\
  \ DOM 访问它们：\n\n• 如果一个元素具有 `id` 属性，你可以直接在脚本中使用 `document.getElementById()` 找到它的对象。\n\
  \n• 如果相邻的元素定义了 `id`，你可以使用 DOM 方法找到它——例如，如果父元素具有 `id`，你可以使用如 `firstChild()` 等方法找到你需要的对象。\n\
  \n• 如果其他方法都失败了，可以使用 `document.getElementsByTagName()` 来查找所有特定类型的对象——例如所有的段落。如果你需要引用某一个，可以使用循环并检查每个对象是否具有特定属性。\n\
  \n例如，列表 23.3 显示了一个简单的用户脚本，你可以将其作为特定网站脚本来自动填充表单中的某些字段。\n\n列表 23.3 用于自动填充表单字段的用户脚本\n\
  \n* *\n\n```javascript\n// ==UserScript==\n\n// @name         AutoForm\n// @namespace\
  \      http://www.thickbook.com/\n// @description    自动填充表单\n// @include       \
  \ *\n// ==/UserScript==\n\n// 此函数用于填充表单字段\n\n//\n\nvar zTextFields = document.getElementsByTagName(\"\
  input\");\n\nfor (var i=0; i<zTextFields.length; i++) {\n  thefield=zTextFields[i].name;\n\
  \  if (!thefield) thefield=zTextFields[i].id;\n  // 在此处设置你的自动填充值\n  if (thefield\
  \ == \"yourname\") zTextFields[i].value=\"Your Name Here\";\n  if (thefield == \"\
  phone\") zTextFields[i].value=\"(xxx) xxx-xxxx\";\n  alert(\"field:\" + thefield\
  \ + \" value: \" + zTextFields[i].value);\n}\n```\n\n* *\n\n此脚本使用 `getElementsByTagName()`\
  \ 文档中所有的 `<input>` 元素，包括文本字段。它使用 `for` 循环检查每一个元素。如果它找到 `name` 或 `id` 值为 `\"yourname\"\
  ` 或 `\"phone\"` 的字段，它就会插入相应的值。\n\n要测试此脚本，请将其保存为 autoform.user.js 并按照本章较些所述的方法安装用户脚本。要进行测试，请将列表\
  \ 23.4 保存为 form.html 并将其加载到 Firefox——`yourname` 和 `phone` 字段将自动填充，如图 23.5 所示。\n\n\
  图 23.5 运行中的自动填充用户脚本。\n\n列表 23.4 用于测试的 HTML\n\n* *\n\n```html\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n<title>AutoForm\
  \ Example</title>\n</head>\n<body>\n<h1>AutoForm Example</h1>\n<p>请输入以下内容：</p>\n\
  <form method=\"post\" action=\"\">\n<p>姓名：input type=\"text\" size=\"20\" name=\"\
  yourname\"></p>\n<p>地址：input type=\"text\" size=\"20\" name=\"address\"></p>\n<p>电话：input\
  \ type=\"text\" size=\"20\" name=\"phone\"></p>\n<input type=\"button\" value=\"\
  Display\" onclick=\"display();\" />\n</form>\n</body>\n</html>\n```\n\n为了方便测试，列表\
  \ 23.3 没有在 `@include` 行中包含特定网站。要创建一个真正的特定网站脚本，你需要找到字段的名称，在脚本中添加 `if` 语句来填充它们，并使用\
  \ `@include` 确保它只在该网站上运行。\n\n### 调试用户脚本\n\n用户脚本的大多数问题与普通 JavaScript 相同。\n\n调试用户脚本类似于调试\
  \ JavaScript 程序——错误显示在 Firefox 的 JavaScript 控制台中或 Internet Explorer 的错误消息中。这里有一些调试技巧：\n\
  \n• 与普通脚本一样，你也可以使用 `alert()` 方法显示有关脚本运行情况的信息。\n\n• 浏览器可能会在错误消息中显示行号，但在处理用户脚本时，这些行号是没有意义的——它们既不是指用户脚本中的行，也不是你正在查看的页面。\n\
  \n• 使用此处之前介绍的 `GM_log()` 方法将有关脚本的信息（例如变量的内容）记录到 JavaScript 控制台中。\n\n• 如果你尝试编写跨浏览器用户脚本，请注意特定浏览器的方法。有关跨浏览器问题，请参见第\
  \ 21 章“[使用非侵入式 JavaScript”，“获取相关信息。\n\n• 注意与页面上任何现有脚本的冲突。\n\n• 如果你使用多个用户脚本，请确保它们不会发生冲突。在你的脚本中使用唯一的变量和函数名称。\n\
  \n* *\n\n### 动手尝试：创建一个用户脚本\n\n现在你已经学习了 Greasemonkey 的基础知识，可以尝试一个更复杂、更有用的用户脚本示例。\n\
  \n\n\n\n\n如果你在 Web 上花费了大量时间，你会发现自己经常需要填写网络表单，并且你可能在表单中反复输入某些内容——例如你的名字或 URL。你在这里创建的用户脚本将允许你定义用于在任何文本区域的宏（macros）。当你输入一个宏关键字（一个点号后跟一段代码），然后再输入另一个字符时，该宏关键字将立即替换为你所定义的文本。例如，你可以定义一个宏，使得每当你输入\
  \ `.cu` 时，它都会展开为文本 `\"See you later.\"`。\n\n* * *\n\n### 注意\n\n此脚本已在 Firefox 的 Greasemonkey\
  \ 0.9.10 上经过测试。由于浏览器和扩展程序不断更新，它可能会在某个时刻停止工作。\n\n* * *\n\nListing 23.5 显示了文本区域宏用户脚本。\n\
  \nListing 23.5 文本区域宏用户脚本\n\n* * *\n\n```javascript\n// ==UserScript==\n\n// @name\
  \          TextMacro\n\n// @namespace      http://www.thickbook.com/\n// @description\
  \    expands macros in text areas as you type\n// @include        *\n\n// ==/UserScript==\n\
  \n// this function handles the macro replacements\n\nfunction textmacro(e) {\n \
  \  // define your macros here\n   zmacros = [\n     [\".mm\", \"Michael Moncur\"\
  ],\n     [\".js\", \"JavaScript\"],\n     [\".cu\", \"See you later.\"]\n   ];\n\
  \n   if (!e) var e = window.event;\n\n   // which textarea are we in?\n   thisarea=\
  \ (e.target) ? e.target : e.srcElement;\n\n   // replace text\n   for (i=0; i<zmacros.length;\
  \ i++) {\n      vv = thisarea.value;\n      vv = vv.replace(zmacros[i][0],zmacros[i][1]);\n\
  \      thisarea.value=vv;\n   }\n}\n\n// install the event handlers\nvar zTextAreas\
  \ = document.getElementsByTagName(\"textarea\");\nfor (var i=0; i<zTextAreas.length;\
  \ i++) {\n   if (zTextAreas[i].addEventListener)\n      zTextAreas[i].addEventListener(\"\
  keydown\",textmacro,0);\n   else if (zTextAreas[i].attachEvent)\n      zTextAreas[i].attachEvent(\"\
  onkeydown\",textmacro);\n}\n```\n\n* * *\n\n### 工作原理\n\n此用户脚本以通常的注释元数据开头。`@include`\
  \ 命令指定了一个通配符 `*`，因此脚本将在所有站点上运行。实际工作在 `textmacro` 函数中完成。该函数开始时定义了将可用的宏：\n\n```javascript\n\
  zmacros = [\n  [\".mm\", \"Michael Moncur\"],\n  [\".js\", \"JavaScript\"],\n  [\"\
  .cu\", \"See you later.\"]\n];\n```\n\n* * *\n\n### Note\n\n为了避免与网页中现有的事件处理程序冲突，本示例使用\
  \ `addEventListener()` 方法来添加事件处理程序。该方法在定义事件处理程序时不会覆盖现有的事件。在 Internet Explorer 中，它使用了相似的\
  \ `attachEvent()` 方法。\n\n此示例使用二维数组定义了三个宏。为了让脚本对你有用，请定义你自己的宏。你可以拥有任意数量的宏——只需在最后一行宏之后添加一个逗号，并在闭合括号之前添加你的项目即可。\n\
  \n接下来，函数使用 `target` 属性找到你当前正在输入的文本区域。接着，它使用 `for` 循环在文本区域的 `value` 属性中对你的每个宏进行搜索和替换。\n\
  \n`textmacro()` 函数之后的代码部分为每个文本区域设置了事件处理程序。首先，它使用 `getElementsByTagName()` 找到所有的文本区域，然后使用\
  \ `for` 循环为每个文本区域添加一个 `onkeydown` 事件处理程序。\n\n* * *\n\n### Tip\n\n此脚本默认运行在所有站点上。如果你只想让宏在某些站点上工作，可以更改\
  \ `@include` 指令来指定这些站点。如果脚本在某些站点上引起了问题，你可以使用 `@exclude` 排除它们。\n\n* * *\n\n### 使用此脚本\n\
  \n要使用此脚本，首先确保你已经按照本章早前的介绍安装并启用了 Greasemonkey。将脚本保存为 `textmacro.user.js`。然后你就可以安装该用户脚本。\n\
  \n脚本安装后，尝试加载任何带有文本区域的页面。你应该能够在文本区域内输入一个宏（例如 `.jd` 或 `.js`），紧接着输入另一个字符（例如空格），并看到它立即展开为正确的文本。\n\
  \n* * *\n\n## 总结\n\n在本章中，你学习了如何使用 Firefox 的 Greasemonkey 以及其 Internet Explorer 的对应工具\
  \ Trixie 来在你的浏览器中启用用户脚本。你学习了用户脚本是如何工作的，以及如何安装和管理它们。最后，你创建了两个运行的用户脚本示例。\n\n## 问答\n\
  \n**Q. 有什么方法可以防止用户在查看我的网站时使用 Greasemonkey 吗？**\n\n**A.** 因为 Greasemonkey 只影响安装它的用户，所以允许它通常是无的。如果你仍然想防止其使用，这很困难但并非不可能，并且会随着不同版本的\
  \ Greasemonkey 而变化。搜索网络以寻找当前的解决方案。\n\n**Q. 如果我想做一些复杂的操作，比如修改 Firefox 的菜单怎么办？**\n\
  \n**A.** 这种能力在 Greasemonkey 中不存在，但 Firefox 扩展也是用 JavaScript 编写的。事实上，你可以将用户脚本编译为扩展，详细信息请参阅\
  \ `http://www.ghacks.net/2009/08/31/greasemonkey-to-firefox-add-on/`。\n\n**Q. 当\
  \ Firefox 发布新版本时会怎样？**\n\n**A.** 我对 Greasemonkey 有信心，但不保证它在未来的版本中仍然有效。\n\n**Q. 使用\
  \ Greasemonkey 修改页面有限制吗？**\n\n**A.** 没有——事实上，你可以使用 `innerHTML` 取整个内容。\n\n## 工作坊\n\
  \n工作坊包含了测试题和练习，帮助你巩固知识。在查看答案部分之前，尝试回答所有问题。\n\n#### 测验\n\n**1. 下面哪个提供了 Internet Explorer\
  \ 的用户脚本？**\n   a. Greasemonkey\n   b. Microsoft Scripting Toolbar\n   c. Trixie\n\
  \n**2. 下面哪一个不是 Greasemonkey 函数？**\n   a. `GM_log()`\n   b. `GM_alert()`\n   c. `GM_setValue()`\n\
  \n**3. 哪个正确的 @include 指令可以在 www.google.com 和 google.com 上运行脚本？**\n   a. `@include\
  \ *.google.com`\n   b. `@include www.google.com.*`\n   c. `@include google.com`\n\
  \n#### 答案\n\n**1.** c. Trixie 是 Internet Explorer 的用户脚本插件。\n\n**2.** b. 没有 `GM_alert()`\
  \ 方法，尽管标准的 `alert()` 方法在用户脚本中有效。\n\n**3.** a. 使用 `@include *.google.com`将在 google.com\
  \ 域名下任何站点的任何页面上运行脚本。\n\n## 练习\n\n• 修改 23.2 中的颜色更改用户脚本，使用不同的颜色并添加另一个样式属性——例如，使用 `style.fontSize`\
  \ 更改字体大小。\n\n• 颜色示例适用于段落，但文本通常出现在其他地方，例如项目列表。修改 Listing 23.2，使其对 `<li>` 标签和段落生效。\n\
  \n• 目前，“尝试一下”部分的宏示例仅适用于使用 `<textarea>` 标签的文本输入。修改 Listing 23.3 中的脚本，使其也适用于 `<input>`\
  \ 标签。（你需要再次调用 `getElementsByTagName()` 并添加循环来添加事件处理程序。）\n\n## 第 24 章 AJAX：远程脚本\n\
  \n* * *\n\n你将在本章中学习到：\n\n• AJAX 如何让 JavaScript 与服务器端程序和文件通信\n\n\n\n\n\n- 使用 `XMLHttpRequest`\
  \ 对象的属性和方法\n- 创建你自己的 AJAX 库\n- 使用 AJAX 从 XML 文件读取数据\n- 调试 AJAX 应用\n- 使用 AJAX 与 PHP\
  \ 程序进行通信\n\n`Remote scripting`（远程脚本），也被称为 AJAX（异步 JavaScript 和 XML），这是一种浏览器功能，它允许\
  \ JavaScript 突破其在客户端的限制，并与 Web 服务器上的文件或服务器端程序进行交互。在本章中，你将学习 AJAX 的工作原理，并创建两个运行的示例。\n\
  \n## 介绍 AJAX\n\n传统上，JavaScript 的主要局限性之一是它无法与 Web 服务器通信，因为它是一种客户端技术——它局限于浏览器内部。例如，你可以用\
  \ JavaScript 创建一个游戏，但将高分列表存储在服务器上则需要将页面提交到服务器端的表单，而 JavaScript 是做不到点的（因为它原本就不是为此设计的）。\n\
  \n单从用户交互的角度来看，普通网页的一个局限性是，将数据从用户传输到服务器（或从服务器传输到用户）通常需要加载并显示一个新页面。但在 2011 年，你可能每天都会遇到一些网站，它们允许你在无需每次点击或提交按钮时加载新页面的情况下与内容进行交互。\n\
  \nAJAX 是这两个问题的答案。AJAX 指的是 JavaScript 使用内置对象 `XMLHttpRequest` 与 Web 服务器进行通信的能力，而无需提交表单或加载页面。该对象得到了\
  \ Internet Explorer、Firefox、Chrome 以及所有其他现代浏览器的支持。\n\n尽管 `AJAX` 这一术语诞生于 2005 年，但\
  \ `XMLHttpRequest` 已经被浏览器支持了多年——它由微软开发，并首次出现在 Internet Explorer 5 中。尽管如此，它直到最近才开始成为一种流行的应用程序开发方式，因为支持它的浏览器变得越来越普遍。这种技术的另一种名称是\
  \ `remote scripting`。\n\n> 注意\n> `AJAX` 术语首次出现在 Adaptive Path 的 Jesse James Garrett\
  \ 在 2005 年 2 月 18 日的一篇在线文章中。它仍然这里：[`www.adaptivepath.com/ideas/ajax-new-approach-web-applications`](http://www.adaptivepath.com/ideas/ajax-new-approach-web-applications)。\n\
  \n## JavaScript 客户端（前端）\n\nJavaScript 传统上只有一种与服务器通信的方式——提交表单。远程脚本允许与服务器进行更灵活的通信。AJAX\
  \ 中的 `A` 代表 `asynchronous`（异步），这意味着浏览器（以及用户）在等待服务器响应时不会被挂起。以下是典型的 AJAX 请求的工作原理：\n\
  \n1. 脚本创建一个 `XMLHttpRequest` 对象并将其发送到 Web 服务器。脚本在发送请求后可以继续执行。\n2. 服务器通过发送文件内容或服务器端程序的输出进行响应。\n\
  3. 当响应从服务器到达时，会触发一个 JavaScript 函数对数据进行操作。\n4. 由于目标是提供更具响应性的界面，脚本通常使用 `DOM` 显示来自服务器的数据，从而消除了刷新页面的需求。\n\
  \n在实践中，这一切发生得很快，即使服务器很慢，它仍然有效。此外，由于请求是异步的，同时可以有多个请求正在进行。\n\n## 服务器端脚本（后端）\n\n驻留在\
  \ Web 服务器上的应用程序部分被称为 `back end`（后端）。简单的后端是服务器上的静态文件——JavaScript 可以通过 `XMLHttpRequest`\
  \ 请求该文件，然后读取并对其内容进行操作。更情况下，后端是运行在 `PHP`、Perl 或 Ruby 等语言上的服务器端程序。\n\nJavaScript 可以使用\
  \ `GET` 或 `POST` 方法向服务器端程序发送数据，这与 HTML 表单的两种方式相同。在 `GET` 请求中，数据被编码在加载程序的 URL 中。在\
  \ `POST` 请求中，数据被单独发送，并可以包含更多数据。\n\n## XML\n\nAJAX 中的 `X` 代表 `XML`（可扩展标记语言），这是构建最新版本\
  \ HTML 基础的通用标记语言。服务器端文件或程序可以以 XML 格式发送数据，JavaScript 可以使用其处理 XML 的方法对数据进行操作。这些与你已经使用的\
  \ `DOM` 方法相似——例如，你可以使用 `getElementsByTagName()` 方法找到数据中具有特定标签的元素。\n\n> 注意\n> JSON（JavaScript\
  \ 对象表示）采用了在 JavaScript 中编码数据的思想并将其形式化。请参阅 [`www.json.org/`](http://www.json.org/)\
  \ 获取详细信息以及多种语言的代码示例。\n\n请记住，XML 只是发送数据的一种方式，并不总是最简单的。服务器可以同样轻松发送纯文本（脚本可以显示它），或者发送\
  \ HTML（脚本可以使用 `innerHTML` 属性将 HTML 插入页面）。某些程序员甚至使用服务器端脚本返回 JavaScript 格式的数据，这些数据可以使用\
  \ `eval` 函数轻松执行。\n\n## AJAX 的常见示例\n\n尽管典型的 HTML 和 JavaScript 用于构建网页和网站，但 AJAX 技术通常会产生\
  \ `web applications`（Web 应用）——为用户执行工作的基于 Web 的服务。以下是 AJAX 的一些示例：\n\n- Google 的 Gmail\
  \ 邮件客户端 ([`mail.google.com/`](http://mail.google.com/)) 使用 AJAX 构建了一个响应快速的电子邮件应用程序。你可以删除消息并执行其他任务，而无需等待新页面加载。\n\
  - [Amazon.com](http://Amazon.com) 的某些功能使用了 AJAX。例如，如果你点击产品评论的“是/否”投票按钮之一，它会将你的选票发送到服务器，并在旁边显示消息，而无需加载页面。\n\
  - Digg ([`www.digg.com/`](http://www.digg.com)) 是一个网站，用户可以在该网站上提交新闻故事，并通过投票来决定哪些故事显示在首页。这种投票过程发生在页面内部。\n\
  \n这些只是几个例子。远程脚本的细微元素出现在 Web 各处，你可能甚至没有注意到——等待页面加载的烦恼会减少。\n\n## AJAX 框架与库\n\n由于远程脚本可能非常复杂（特别是你将在本章之后学习的浏览器差异），许多框架和库旨在简化\
  \ AJAX 编程。\n\n> 注意\n> 请参阅第 22 章 [#22.html_22]，“使用第三方库](#22.html_22)”获取有关使用第三方库的信息。\n\
  \n首先，本书之前介绍的三个库 `JQuery`、`Prototype` 和 `Script.aculo.us` 包含了简化远程脚本的功能。还有针对 `PHP`、`Python`\
  \ 和 `Ruby` 等语言的库。\n\n某些库旨在为 JavaScript 添加服务器端功能，而另一些则旨在为 `PHP` 等语言添加 JavaScript\
  \ 交互性。你将在本章之后构建一个简单的库，用于处理本示例中的远程脚本函数。\n\n远程脚本是一种相对新的技术，因此它有一些局限，以及需要注意的问题。以下是 AJAX\
  \ 的局限性和潜在问题：\n\n- 脚本与其请求的 XML 数据或服务器端程序必须位于同一域。\n- 某些旧浏览器和不常用的浏览器（如移动浏览器）不支持 `XMLHttpRequest`，因此你无法保证所有用户都能使用。\n\
  - 要求 AJAX 可能会损害残障人士对网站的无障碍访问。\n- 用户可能习惯于每次更改内容时都加载新页面，因此对他们理解 AJAX 应用来说可能存在学习曲线。\n\
  \n\n\n\n\n与 JavaScript 的其他高级用法一样，最佳方法是不具侵入性的——确保在可能不支持 AJAX 的情况下，仍有方法可以使用该网站，并使用特性检测（feature\
  \ sensing）以在不支持它的浏览器上防止错误。更多细节请参阅第 21 章“使用非侵入性 JavaScript”。\n\n### 使用 `XMLHttpRequest`\n\
  \n你现在将查看如何使用 `XMLHttpRequest` 与服务器通信。这看起来可能有点复杂，但对于任何请求，其过程都是相同的。稍后，你将创建一个复用的代码库来简化这一过程。\n\
  \n#### 创建请求\n\n第一步是创建一个 `XMLHttpRequest` 对象。要此此，你需要像使用其他 JavaScript 对象一样使用 `new`\
  \ 关键字。以下语句在某些浏览器中创建了一个请求对象：\n\n```\najaxreq = new XMLHttpRequest();\n```\n\n上一个示例适用于\
  \ Firefox、Chrome、Internet Explorer 7 和 8 以及其他现代浏览器，但不支持 Internet Explorer 5 或 6。是否要支持这些浏览器取决于你，因为它们的使用率非常低。然而，某些机构的工作站上可能安装了大量的\
  \ IE6 浏览器，所以你的情况可能会有所不同。\n\n从现在开始，示例代码将仅支持 IE7 及更高版本（现代浏览器），但如果你想支持这些旧浏览器，必须使用 ActiveX\
  \ 语法：\n\n```\najaxreq = new ActiveXObject(\"Microsoft.XMLHTTP\");\n```\n\n本章稍后的库部分将演示如何根据正在使用的浏览器使用正确的方法。在哪种情况下，你使用的变量（示例中的\
  \ `ajaxreq`）都存储了 `XMLHttpRequest` 对象。你将使用该对象的方法来打开和发送请求，如下文节所示。\n\n#### 打开 URL\n\
  \n`XMLHttpRequest` 对象的 `open()` 方法指定文件名以及数据发送到服务器的方法：`GET` 或 `POST`。这些与 Web 表单支持的方法相同。\n\
  \n```\najaxreq.open(\"GET\",\"filename\");\n```\n\n对于 `GET` 方法，你发送的数据包含在 URL 中。例如，此命令打开了\
  \ `search.php` 程序并为 `query` 参数发送了值“John”：\n\n```\najaxreq.open(\"GET\",\"search.php?query=John\"\
  );\n```\n\n#### 发送请求\n\n你使用 `XMLHttpRequest` 对象的 `send()` 方法将请求发送到服务器。如果你正在使用 `POST`\
  \ 方法，要发送的数据是 `send()` 的参数。对于 `GET` 请求，你可以使用 `null` 值代替：\n\n```\najaxreq.send(null);\n\
  ```\n\n#### 等待响应\n\n请求发送后，你的脚本将继续执行而无需等待结果。因为结果可能在任何时间到达，你可以通过事件处理程序来检测它。`XMLHttpRequest`\
  \ 对象有一个 `onreadystatechange` 事件处理程序用于此目的。你可以创建一个函数来处理响应，并将其设置为该事件的处理器：\n\n```\n\
  ajaxreq.onreadystatechange = MyFunc;\n```\n\n### 注意事项\n\n与事件处理程序通常一样，请确保在指定函数名时不带括号。带有括号时，你指的是函数的*结果*；不带括号时，你指的是函数本身。\n\
  \n请求对象有一个属性 `readyState`，它指示其状态，每当 `readyState` 属性发生变化时，就会触发此事件。`readyState` 的值范围从新请求的\
  \ `0` 到完成请求的 `4`，因此你的事件处理函数通常需要监控值为 `4`。\n\n尽管请求已完成，但它可能并没有成功。如果请求成功，`status` 属性被设置为\
  \ 200；如果失败，则设置为错误代码。`statusText` 属性存储错误的文本说明，或者成功时存储“OK”。\n\n#### 解析响应数据\n\n当 `readyState`\
  \ 属性达到 `4` 且请求完成时，从服务器返回的数据将通过两个属性供你的脚本使用：`responseText` 是原始文本形式的响应，而 `responseXML`\
  \ 是 XML 对象形式的响应。如果数据不是 XML 格式，则只有文本属性可用。\n\nJavaScript 的 DOM 方法旨在在 XML 上运行，因此你可以配合\
  \ `responseXML` 属性使用它们。在本章的稍后部分中，你将使用 `getElementsByTagName()` 方法从 XML 中提取数据。\n\n\
  ### 创建一个简单的 AJAX 库\n\n你现在应该意识到 AJAX 请求可能会有点复杂。为了方便起见，你可以创建一个 AJAX 库。这是一个 JavaScript\
  \ 文件，提供了处理发送请求和接收结果的函数，你可以在需要 AJAX 函数时随时复用它。\n\n该库将用于本章稍后的两个示例中。代码列表 24.1 显示了完整的\
  \ AJAX 库，包括针对旧浏览器的特殊情况。\n\n代码列表 24.1 AJAX 库\n\n```javascript\n// 用于跟踪请求的全局变量\n//\
  \ 以及完成后调用的函数\nvar ajaxreq=false, ajaxCallback;\n\n// ajaxRequest: 设置请求\nfunction\
  \ ajaxRequest(filename) {\n    try {\n      // Firefox / 其他\n      ajaxreq= new\
  \ XMLHttpRequest();\n    } catch (error) {\n      // IE 5 / IE 6\n      try {\n\
  \        ajaxreq = new ActiveXObject(\"Microsoft.XMLHTTP\");\n      } catch (error)\
  \ {\n        return false;\n      }\n    }\n    ajaxreq.open(\"GET\", filename);\n\
  \    ajaxreq.onreadystatechange = ajaxResponse;\n    ajaxreq.send(null);\n}\n\n\
  // ajaxResponse: 等待响应并回调\nfunction ajaxResponse() {\n    if (ajaxreq.readyState\
  \ !=4) return;\n    if (ajaxreq.status==200) {\n      // 如果请求成功\n      if (ajaxCallback)\
  \ ajaxCallback();\n    } else alert(\"Request failed: \" + ajaxreq.statusText);\n\
  \    return true;\n}\n```\n\n接下来的节将解释该库如何工作以及如何使用。\n\n#### `ajaxRequest` 函数\n\n\
  `ajaxRequest` 函数处理创建和发送请求所需步骤。首先，它创建 `XMLHttpRequest` 对象。如之前所述，这对于旧浏览器需要不同的命令，因此使用\
  \ `try` 和 `catch` 来创建请求。首先尝试标准方法。\n\n#### `ajaxResponse` 函数\n\n`ajaxResponse` 函数被用作\
  \ `onreadystatechange` 事件处理程序。该函数首先检查 `readyState` 是否为 `4`。如果是其他值，函数将返回。\n\n接下来，它检查\
  \ `status` 属性是否为 `200`，这表示请求成功。如果是，则运行存储在 `ajaxCallback` 变量中的函数。\n\n#### 使用库\n\n\
  要使用此库，请遵循以下步骤：\n\n1. 将库文件保存为 `ajax.js`，并放在你的 HTML 文档和脚本所在的文件夹中。\n2. 使用 `<script>`\
  \ 标签将脚本引入你的文档。它应该在任何使用其功能的脚本之前引入。\n3. 在你的脚本中，创建一个在请求完成后调用的函数，并将 `ajaxCallback` 变量设置为该函数。\n\
  4. 调用 `ajaxRequest()` 函数。其参数是服务器端程序或文件的文件名。（此库仅支持 `GET` 请求，因此你不需要指定方法。）\n5. 当请求成功时，你在\
  \ `ajaxCallback` 中指定的函数将被调用，全局变量 `ajaxreq` 将数据存储在它的 `responseXML` 和 `responseText`\
  \ 属性中。\n\n本章剩下的两个示例将利用此库创建 AJAX 应用。\n\n### 使用库创建 AJAX 测验\n\n\n\n\n现在你已经有了一个可重用的\
  \ AJAX 库，可以使用它来创建利用远程脚本的 JavaScript 应用程序。第一个示例将在页面上显示测验题目并提示你输入答案。\n\n## 注意\n\n\
  与书中的大多数脚本不同，此示例需要一个 Web 服务器。由于浏览器对远程脚本的安全限制，它无法在本地机器上运行。\n\n此示例没有将问题包含脚本中，而是从服务器上的\
  \ XML 文件读取测验问题和答案，以此演示 AJAX。\n\n### HTML 文件\n\n此示例的 HTML 非常简单。它定义了一个带有 `Answer`\
  \ 字段和 `Submit` 按钮的简单表单，以及一些供脚本使用的钩子。此示例的 HTML 见列表 24.2。\n\n列表 24.2 样例示例的 HTML 文件\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Ajax Quiz\
  \ Test</title>\n    <script type=\"text/javascript\" src=\"ajax.js\"></script>\n\
  \  </head>\n  <body>\n    <h1>Ajax Quiz Example</h1>\n    <form method=\"post\"\
  \ action=\"\">\n      <p><input type=\"button\" value=\"Start the Quiz\" id=\"startq\"\
  \ /></p>\n      <p><strong>问题：</strong>\n      <span id=\"question\">[点击按钮开始测验]</span></p>\n\
  \      <p><strong>答案：</strong>\n      <input type=\"text\" name=\"answer\" id=\"\
  answer\" /></p>\n      <p><input type=\"button\" value=\"Submit Answer\" id=\"submit\"\
  \ /></p>\n    </form>\n    <script type=\"text/javascript\" src=\"quiz.js\"></script>\n\
  \  </body>\n</html>\n```\n\n此 HTML 文件包含以下元素：\n\n* `<head>` 部分中的 `<script>` 标签包含了你在上一节中从\
  \ `ajax.js` 文件创建的 AJAX 库。\n* `<body>` 部分中的 `<script>` 标签包含了 `quiz.js` 文件，该文件将包含测验脚本。\n\
  * `<span id=\"question\">` 标签为脚本插入问题留出了位置。\n* `id` 值为 `\"answer\"` 的文本字段是用户回答的地方。\n\
  * `id` 值为 `\"submit\"` 的按钮将提交答案。\n* `id` 值为 `\"startq\"` 的按钮将启动测验。\n\n此时，你可以通过将文件放置在\
  \ Web 服务器上并通过 URL 访问来测试 HTML 文档，但在你添加 XML 和 JavaScript 文件之前，按钮将无法工作，你将在接下来两个节中学习到这一点。\n\
  \n### XML 文件\n\n测验的 XML 文件见列表 24.3。我已经在其中填充了几个 JavaScript 问题，但也可以很容易地用于其他用途。\n\n\
  列表 24.3 包含测验问题和答案的 XML 文件\n\n```xml\n<?xml version=\"1.0\" ?>\n<questions>\n   \
  \ <q>哪个 DOM 对象包含窗口的 URL 信息？</q>\n    <a>location</a>\n    <q>document 对象的哪个方法可以找到元素的对象？</q>\n\
  \    <a>getElementById</a>\n    <q>如果你在函数外声明变量，它是全局的还是局部的？</q>\n    <a>global</a>\n\
  \    <q>JavaScript 语言的正式标准称什么？</q>\n    <a>ECMAScript</a>\n</questions>\n```\n\n\
  `<questions>` 标签封装了整个文件，每个问题和答案都封装在 `<q>` 和 `<a>` 标签中。记住，这是 XML 而不是 HTML——这些不是标准的\
  \ HTML 标签，而是为此示例创建的标签。由于此文件仅供你的脚本使用，因此不需要遵循标准格式。\n\n要使用此文件，请将其保存为 `questions.xml`\
  \ 并放在与 HTML 文档相同的文件夹中。它将由你在下一节中创建的脚本加载。\n\n当然，对于如此小的测验，你可以通过将内容存储在脚本中来使事情简单，但使用\
  \ XML 文件要灵活得多。\n\n### JavaScript 文件\n\n列表 24.4 样例示例的 JavaScript 文件\n\n```javascript\n\
  // 全局变量 qn 是当前题\nvar qn = 0;\n\n// 从 XML 文件加载问题\nfunction getQuestions() {\n   \
  \ document.getElementById(\"question\").innerHTML = \"请等待...\";\n    // 使用 AJAX\
  \ 库请求 questions.xml\n    ajax.get(\"questions.xml\", true, true);\n    ajax.onComplete\
  \ = nextQuestion;\n}\n\n// 显示下一个问题\nfunction nextQuestion() {\n    questions = ajax.responseXML.getElementsByTagName(\"\
  q\");\n    document.getElementById(\"question\").innerHTML = questions[qn].innerHTML;\n\
  \    if (qn < questions.length) {\n        document.getElementById(\"answer\").value\
  \ = \"\";\n    } else {\n        document.getElementById(\"question\").innerHTML\
  \ = \"没有更多问题了\";\n    }\n}\n\n// 检查用户的答案\nfunction checkAnswer() {\n    answers\
  \ = ajax.responseXML.getElementsByTagName(\"a\");\n    a = answers[qn].innerHTML;\n\
  \    answerfield = document.getElementById(\"answer\");\n    if (a == answerfield.value)\
  \ {\n        alert(\"正确!\");\n    } else {\n        alert(\"错误。正确答案是 \" + a);\n\
  \    }\n    qn = qn + 1;\n    answerfield.value = \"\";\n    nextQuestion();\n}\n\
  \n// 为按钮设置事件处理器\nobj = document.getElementById(\"startq\");\nobj.onclick = getQuestions;\n\
  \nans = document.getElementById(\"submit\");\nans.onclick = checkAnswer;\n```\n\n\
  此脚本包含：\n\n* 第一条 `var` 语句定义了一个全局变量 `qn`，用于记录当前题目。初始化为 0。\n* `getQuestions()` 函数在点击开始测验时调用。该函数使用\
  \ AJAX 请求 `questions.xml`。它将 `ajax.onComplete` 设置为 `nextQuestion`。\n* `nextQuestion()`\
  \ 函数在 AJAX 请求完成后调用。该函数使用 `responseXML` 的 `getElementsByTagName()` 方法找到问题（`<q>` 标签）并存储在\
  \ `questions` 数组中。\n* `check()` 函数在用户提交答案时调用。它使用 `getElementsByTagName()` 将答案（`<a>`\
  \ 标签）存储在 `answers` 数组中，然后将当前答案与用户的答案进行比较，并显示提示。\n* 该函数之后的脚本设置了两个事件处理器。一个将 `getQuestions()`\
  \ 绑定到开始测验按钮；另一个将 `checkAnswer()` 绑定到提交按钮。\n```\n\n\n\n\n- 确保所有文件名均正确，并且应用程序的所有文件都在服务器的同一个文件夹中。\n\
  - 如果你正在使用服务端语言，请在不运行脚本的情况下进行测试：在浏览器中加载它并确保其运行正常；尝试在 URL 中对其传递变量并检查结果。\n- 检查 `statusText`\
  \ 属性 get 请求结果——使用 `alert` 消息在这里很有帮助。它通常会给出如“未找到文件”之类的清晰信息，从而解释问题所在。\n- 如果你正在使用第三方\
  \ AJAX 库，请检查其文档——许多库都有内置的调试功能，你可以开启它们以检查发生的情况。\n\n* * *\n* * *\n* * *\n\n## 自己尝试：制作实时搜索表单\n\
  \nAJAX 最令人深刻的演示之一是*实时搜索*：普通的搜索表单需要你点击按钮并等待页面加载才能看到结果，而实时搜索会在你在搜索字段中输入时，立即在页面内显示结果。当你输入字母或按下退格键时，结果会立即更新，方便你找到所需的结果。\n\
  \n使用你之前创建的 AJAX 库，实现实时搜索并不困难。此示例将使用服务器端的 PHP 程序来提供搜索结果，并可以轻松适配到任何搜索应用。\n\n* * *\n\
  * * *\n* * *\n\n### 注意事项\n\n再次强调，由于使用了 AJAX，此示例需要一个 Web 服务器。你还需要安装 PHP，绝大多数托管服务默认都已安装了\
  \ PHP。\n\n* * *\n* * *\n* * *\n\n### HTML 表单\n\n此示例的 HTML 仅定义了一个搜索字段，并为动态结果留出了空间。HTML\
  \ 文档如列表 24.5 所示。\n\n列表 24.5 实时搜索示例的 HTML 文件\n\n* * *\n* * *\n* * *\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Ajax Live\
  \ Search Example</title>\n    <script type=\"text/javascript\" src=\"ajax.js\"></script>\n\
  \  </head>\n  <body>\n    <h1>Ajax Live Search Example</h1>\n    <form method=\"\
  get\" action=\"\">\n      <p><strong>搜索内容：<strong>（Search for:）</strong>\n     \
  \   <input type=\"text\" size=\"40\" id=\"searchlive\" /></p>\n      <div id=\"\
  results\">\n        <ul id=\"list\">\n          <li>[搜索结果将在此处显示。]</li>\n       \
  \ </ul>\n      </div>\n    </form>\n    <script type=\"text/javascript\" src=\"\
  search.js\"></script>\n  </body>\n</html>\n```\n\n* * *\n* * *\n* * *\n\n此 HTML\
  \ 文档包含以下内容：\n\n- `<head>` 部分中的 `<script>` 标签包含了 AJAX 库，即 `ajax.js`。\n- `<body>`\
  \ 部分中的 `<script>` 标签包含了 `search.js` 脚本，这是你接下来要创建的。\n- `id` 值为 `\"searchlive\"` 的\
  \ `<input>` 元素是你输入搜索查询的地方。\n- `id` 值为 `\"results\"` 的 `<div>` 元素将作为动态获取结果的容器。使用\
  \ `<ul>` 标签创建一个项目符号列表；当你开始输入时，该列表将被替换为结果列表。\n\n### PHP 后端\n\n接下来，你需要一个服务端程序来生成搜索结果。此\
  \ PHP 程序包含一个存储在数组中的姓名列表。它将响应 JavaScript 查询，返回与用户目前已输入内容匹配的姓名。姓名将以 XML 格式返回。例如，这里是\
  \ PHP 程序在搜索“smith”时的输出：\n\n```xml\n<names>\n<name>John Smith</name>\n<name>Jane\
  \ Smith</name>\n</names>\n```\n\n虽然在此示例中为了简单起见，姓名列表存储在此处的 PHP 程序中，但在实际应用中，它更有可能存储在数据库中——此脚本可以轻松适配到包含成千上万姓名的数据库。PHP\
  \ 程序如列表 24.6 所示。\n\n列表 24.6 实时搜索示例的 PHP 代码\n\n* * *\n* * *\n* * *\n\n```php\n<?php\n\
  \  header(\"Content-type: text/xml\");\n  $names = array (\n    \"John Smith\",\
  \ \"John Jones\", \"Jane Smith\", \"Jane Tillman\",\n    \"Abraham Lincoln\", \"\
  Sally Johnson\", \"Kilgore Trout\",\n    \"Bob Atkinson\", \"Joe Cool\", \"Dorothy\"\
  ,\n    \"Elizabeth Carlson\", \"Frank Dixon\", \"Gert East\",\n    \"Harvey Frank\"\
  , \"Inigo Montoya\", \"Jeff Austin\",\n    \"Lynn Arlington\", \"Michael Washington\"\
  , \"Nancy West\"\n  );\n  if (isset($_GET['query'])) {\n    echo \"<?xml version=\\\
  \"1.0\\\"\\n\";\n    echo \"<names>\\n\";\n    foreach ($names as $v) {\n      if\
  \ (stripos($v, $_GET['query']) !== false) {\n        echo \"<name>$v</name>\\n\"\
  ;\n      }\n    }\n    echo \"</names>\\n\";\n  }\n?>\n```\n\n* * *\n本章节太小，无法教教你，但这里是其工作原理的总结：\n\
  \n- `header` 语句指示输出为 XML。\n- `$names` 数组存储姓名。\n- `isset($_GET['query'])` 检查查询。\n\
  - `foreach` 循环遍历姓名。\n- `stripos` 函数匹配姓名与查询。\n- `echo` 语句输出 XML 标签。\n\n* * *\n* *\
  \ *\n* *\n\n如果你想了解更多关于 PHP 的知识，请尝试*Learn PHP*。\n\n* * *\n* * *\n* *\n\n### JavaScript\
  \ 前端\n\n最后，此示例的 JavaScript 如列表 24.7 所示。\n\n列表 24.7 实时搜索示例的 JavaScript 文件\n\n* *\
  \ *\n* * *\n* * *\n\n```javascript\n// 管理超时的全局变量\nvar t;\n\n// 按键时启动超时\nfunction\
  \ StartSearch() {\n  if (t) clearTimeout(t);\n  t = setTimeout(\"LiveSearch()\"\
  ,200);\n}\n\n// 执行搜索\nfunction LiveSearch() {\n  // 组合 PHP 文件名\n  query = document.getElementById(\"\
  searchlive\").value;\n  filename = \"search.php?query=\" + query;\n  // DisplayResults\
  \ 将处理 Ajax 响应\n  ajaxCallback = DisplayResults;\n  // 发送 Ajax 请求\n  ajaxRequest(filename);\n\
  }\n\n// 显示搜索结果\nfunction DisplayResults() {\n  // 旧列表\n  ul = document.getElementById(\"\
  list\");\n  div = document.getElementById(\"results\");\n  div.removeChild(ul);\n\
  \  // 创建一个新列表\n  ul = document.createElement(\"ul\");\n  ul.id = \"list\";\n  names\
  \ = ajax.responseXML.getElementsByTagName(\"name\");\n  for (i = 0; i < names.length;\
  \ i++) {\n    li = document.createElement(\"li\");\n    name = names[i].firstChild.nodeValue;\n\
  \    text = document.createTextNode(name);\n    li.appendChild(text);\n    ul.appendChild(li);\n\
  \  }\n  if (names.length==0) {\n    li = document.createElement(\"li\");\n    li.appendChild(document.createTextNode(\"\
  No results\"));\n    ul.appendChild(li);\n  }\n  // 显示新列表\n  div.appendChild(ul);\n\
  }\n\n// 设置事件处理器\nobj = document.getElementById(\"searchlive\");\nobj.onkeydown =\
  \ StartSearch;\n```\n\n\n\n\n• 当 AJAX 请求完成时，会调用 `DisplayResults()` 函数。它会删除 `<div\
  \ id=\"results\">` 部分中的项目列表，然后使用 W3C DOM 和 AJAX 结果组装一个新列表。如果没有结果，它会在列表中显示“No results（无结果）”的消息。\n\
  \n• 脚本的最后几行将 `StartSearch()` 函数设置为搜索字段 `onkeydown` 事件的事件处理器。\n\n## 让这一切运行起来\n\n\
  要尝试这个示例，你需要在 Web 服务器上准备三个文件：`ajax.js`（库）、`search.js`（搜索脚本）以及一个 HTML 文件。图 24.2 显示了该示例的实际运行情况。\n\
  \n**图 24.2** 在浏览器中显示的实时搜索示例。\n\n![image](img/24fig02.jpg)\n\n***\n\n## 总结\n\n在本章中，你学习了\
  \ AJAX（或远程脚本）如何让 JavaScript 与 Web 服务器进行通信。你创建了一个可重用的 AJAX 库，它可以用于创建任意数量的 AJAX 应用，并使用\
  \ XML 文件创建了一个示例。最后，你使用 AJAX 和 PHP 创建了一个实时搜索表单。\n\n## 问答\n\n**Q. 如果服务器很慢或者从不响应请求会发生什么？**\n\
  \n**A.** 这是你应该将 AJAX 作为可选功能的另一个原因——无论是由服务器还是用户连接引起的，总会有响应缓慢或从不响应的情况。在这种情况下，回调函数将被延迟调用或根本不被调用。这可能会导致请求交叉产生问题；例如，在实时搜索示例中，不稳定的服务器可能会导致前几个字符的响应间隔几秒到达，从而让用户感到困惑。你可以通过检查\
  \ `readyState` 属性来解决这个问题，确保在启动另一个请求之前当前请求已不在进行。\n\n**Q. 在实时搜索示例中，为什么需要 `onkeydown`\
  \ 事件处理器？使用 `onchange` 事件不是更容易用吗？**\n\n**A.** 虽然 `onchange` 可以通知你表单字段何时变化，但它在用户移动到另一个字段之前才会被触发——它不适用于“实时”搜索，因此你必须监听按键事件。`onkeypress`\
  \ 处理器也可以，但在某些浏览器中它无法检测到退格键（Backspace），而当你想通过退格缩短查询内容时，搜索能随之更新是非常好的。\n\n## 工作坊\n\n\
  工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”之前，尝试回答所有问题。\n\n#### 测验\n\n**1.** 下列哪项是 `AJAX`\
  \ 中的 `A`？\n\n**a.** Advanced（高级）\n**b.** Asynchronous（异步）\n**c.** Application（应用）\n\
  \n**2.** `XMLHttpRequest` 对象的哪个属性表示请求是否成功？\n\n**a.** `status`\n**b.** `readyState`\n\
  **c.** `success`\n\n**3.** 正确或错误：为了支持旧版本的 Internet Explorer，在使用 AJAX 时必须创建一个 ActiveX\
  \ 对象而不是 `XMLHttpRequest` 对象。\n\n#### 答案\n\n**1.** b. AJAX 代表 Asynchronous JavaScript\
  \ and XML（异步 JavaScript 和 XML）。\n\n**2.** a. `status` 属性表示请求是否成功；`readyState` 表示请求是否完成，但不表示是否成功。\n\
  \n**3.** 正确。Internet Explorer 5 和 6 需要 ActiveX，而第 7 之后的 Internet Explorer 版本原生支持\
  \ `XMLHttpRequest` 对象。\n\n## 练习\n\n• 就你喜欢的话题构建你自己的 XML 问答文件，并用测验示例进行尝试。\n\n• 使用\
  \ AJAX 库为你的网站添加 AJAX 功能，或创建一个你自己的简单示例。\n\n# 第 VI 部分。高级网站功能与管理\n\n## 第 25 章 创建打印友好的网页\n\
  \n***\n\n在本章中，你将学到：\n\n• 什么让一个页面具有打印友好性\n• 如何应用特定媒体的样式表\n• 如何为打印页面创建样式表\n• 如何在打印预览模式下查看你的网页\n\
  \n***\n\n如果你曾使用过如 MapQuest 或 Google Maps 等在线地图工具，你一定体会过打印网页的需求。同样，仅在线提供的优惠券、在线转售商的物品购买收据，以及基于\
  \ Web 的航班值机和从家里电脑打印登机牌的能力，都增加了对打印友好页面的需求。事实上，并不是所有的网页都是完全为屏幕显示而设计的！\n\n你可能没有意识到，但可以为想要打印副本进行离线阅读的用户专门设计并提供页面的打印友好版本——这是\
  \ Google Maps 在向你显示屏幕版本内容后提供的功能。CSS 能够轻松创建根据查看方式不同而改变外观的网页。在本章中，你将学习如何创建此类页面。\n\n\
  ***\n\n### 动手尝试：检查你的内容的打印友好性\n\n在学习本章内容时，考虑你自己的可能在打印时看起来良好的网页。然后思考你希望对它们进行哪些更改，以让它们在打印页面上看起来更好。以下是一些可以考虑的建议：\n\
  \n• 即使违反了之前章节中的警告，你是否有使用图案背景或不寻常颜色的页面？这种页面由于背景的原因很难打印，所以你可能考虑使用带有黑色文本的白色背景。\n\n\
  • 你的页面包含很多链接吗？如果是这样，你可能考虑更改链接的外观使其不突兀——例如，移除任何下划线。记住，你无法点击一张纸！\n\n• 最后，页面上的每张图片都是必不可少的吗？彩色图片在大多数打印机上会消耗大量的墨水，因此你可能考虑从打印友好页面中去掉部分、甚至全部图片。\n\
  \n***\n\n### 什么让页面具有打印友好性？\n\n重要的是指出，某些网页本身是打印友好的。如果你的页面使用白色背景和深色对比文本，且图片较少，你可能不需要考虑特殊的打印友好版本。相反，具有深色背景、动态链接和多张图片的页面对于普通打印机来说可能非常困难。\n\
  \n当你考虑如何让你的页面更加打印友好时，需要考虑的主要因素是媒介的限制。换句话说，打印页面的独特之处与计算机屏幕有何不同？明显的区别是尺寸——打印页面是固定尺寸，通常为\
  \ 8.5 x 11 英寸，而屏幕尺寸差异很大。除了尺寸之外，打印页面也有色彩限制（即使是彩色打印机）。\n\n大多数用户对打印页面上核心文本以外的内容并不感兴趣。例如，图\
  \ 25.1 显示了从密苏里州印第华市到俄勒冈州俄勒冈市的旅行路线（历史俄勒冈道的近似）。\n\n**图 25.1** 由于表单输入和带有自带显示控件的大图，此页面并不十分打印友好。\n\
  \n\n\n\n\n图 25.1 所示的页面包含表单输入字段、一个可以独立控制（移动、缩放等）的大幅图像，以及你在网页内容中预期的其他辅助项目。地图上方出现了一组你可以执行的操作（Actions），其中一个就是打印页面的链接。此时，你可能会奇怪为什么你不能直接点击网络浏览器上的“打印”按钮。你当然可以这样做，但该命令会按照屏幕上显示的样式打印页面——包括所有的表单输入字段和图形元素，而你真正想知道的是行驶这条路线时需要转哪些弯。\n\
  \n如果你点击页面正文中的打印链接，你的网络浏览器将显示一个页面（参见图 25.2），该页面由 Google 专门针对打印进行了格式。\n\n**图 25.2**\
  \ 页面的打印友好版本分离了驾驶指令的文本，以便单独打印。\n\n![image](img/25fig02.jpg)\n\n如图所示，该页面的打印友好版本相比原始版本有了显著改进，至少从打印机的角度来看是这样。所有的表单输入和图像都被删除。\n\
  \n***\n\n**注意**\n\n如果打印特定页面的字体是无衬线的（sans serif），某些网页设计师建议将字体更改为衬线字体（serif），这在打印时被认为更易读。如果你在页面上使用无衬线字体，则由你来决定是否要在打印时保持页面的核心视觉效果——这意味着你不要将字体更改为衬线字体。\n\
  \n***\n\n为了让你更好地掌握在转向创建打印友好页面时具体需要考虑哪些内容，以下是一份你至少应该考虑的更改列表：\n\n- 移除页面背景，这实际上是为打印的页面提供了白色背景。\n\
  - 将文本颜色更改为黑色；文本中保留一些颜色是可以的，但黑色是首选。\n- 确保字体足够大，以便页面在打印时易于阅读。你可能需要测试一些不同的尺寸。\n- 移除链接格式，或简单地恢复为基础下划线链接。有些设计师喜欢保留下划线，以便访问者知道原始页面存在链接。\n\
  - 移除任何所有非本质图像。这通常包括任何对传达页面内容至关重要的图像，例如导航按钮、大多数广告和动态图像。\n\n除了这些建议，你可能会发现添加一个包含页面作者信息的署名（byline），以及页面的\
  \ URL 和版权信息是有用的。这些信息在用户离开你的网站且手中只有页面打印版后，可能会丢失。\n\n你可能现在不需要对你的页面进行这些更改。此举目的是播下关于“什么是打印友好页面”的种子，以便你能够更好地创建针对打印的特定样式表。没错：可以创建一个仅在页面打印时才应用于页面的样式表。将在下一节中学习到这一点。\n\
  \n### 应用特定媒体的样式表\n\n图 25.1 展示了带有链接的小型打印机图标如何让你查看页面的特殊打印友好版本。这种类型的图标在许多新闻网站上很流行，它是一个重要功能，因为否则你可能不想费力打印页面，并在伴随文章的图形和广告浪费纸张和墨水。虽然打印图标和链接的方法直观且效果良好，但还有一种方案不需要这些特定的链接即可打印友好型内容。\n\
  \n这种方案涉及使用打印特定的样式表，当用户选择打印页面时，该样式表会自动应用于页面。CSS 支持媒体特定样式表的概念，这种样式表针对特定的媒体，例如屏幕或打印机。然而，CSS\
  \ 并不止于这两种媒体形式。请查看以下 CSS 2 允许你通过唯一样式表支持的特定媒体类型列表：\n\n- `all`——用于所有设备\n- `aural`——用于语音合成器（在\
  \ CSS 1 媒体类型中称为 *speech*）\n- `braille`——用于盲文触觉反馈设备\n- `embossed`——用于页码式凸凹盲文打印机\n\
  - `handheld`——用于屏幕尺寸和带宽有限的手持设备\n- `print`——用于打印材料和，以及在“打印预览”模式下在屏幕上查看的文档\n- `projection`——用于投影演示稿\n\
  - `screen`——用于彩色计算机屏幕\n- `tty`——用于使用固定等宽字符网格的设备（如终端、电传字或显示器有限的手持设备）\n- `tv`——用于电视类设备，这类设备通常是低分辨率、彩色且滚动能力有限\n\
  \n在这些媒体中，也许最有趣的是 `aural` 类型，它允许网页被朗读或以其他方式听。显然，CSS 的架构师在我们主要为计算机屏幕设计页面时，他们设想的 Web\
  \ 范围比我们目前认为的要广泛得多。虽然你现在可能不需要太担心 `aural` 网页的设计，但它作为一个很好的提示，告知了未来可能出现的趋势。\n\n关于应用于其他媒体的样式表，好消息是它们不需要你学习任何新东西。好吧，也许在\
  \ `aural` 网页的情况下你可能需要学习一些新招式，但现在你可以使用已经学习的样式属性来创建打印特定的样式表。诀窍在于知道如何为特定媒体应用样式表。\n\n\
  如果你记得，`<link />` 标签用于将外部样式表链接到网页。该标签支持一个你尚未见过的名为 `media` 的属性。该属性用于指定样式表所应用的媒体名称。默认情况下，该属性设置为\
  \ `all`，这意味着除非另有指定，否则外部样式表将用于所有媒体。其他接受的属性值与之前列表中提供的媒体列表对应。\n\n***\n\n**注意**\n\n\
  你也可以使用 `@import` 命令来链接媒体特定样式表。例如，以下代码与之前的 `<link />` 代码工作相同：\n\n```\n@import url(player.css)\
  \ all;\n@import url(player_print.css) print;\n```\n\n***\n\n为网页建立打印特定的样式表涉及使用两个\
  \ `<link />` 标签，一个用于打印机，另一个用于每个剩余媒体。以下是处理此任务的代码：\n\n```\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"standard.css\" media=\"all\" />\n\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"for_print.css\" media=\"print\" />\n```\n\n***\n\n**注意**\n\
  \n你可能想在上述代码的第一个链接样式表中指定 `media=\"screen\"`。虽然这在普通网络浏览器中查看页面时有效，但如果用户使用手持浏览器或任何其他类型的媒体查看页面，就会出现问题。换句话说，样式表仅适用于\
  \ `media` 属性提到的特定媒体类型，不再如此。\n\n***\n\n在此示例中，有两个样式表被链接到网页中。第一个表通过将 `media` 属性设置为\
  \ `all` 来针对所有媒体。如果你不进行其他操作，`standard.css` 样式表将应用于所有媒体。然而，第二个样式表的存在导致在打印页面时使用 `for_print.css`\
  \ 样式表。\n\n你可以通过逗号分隔类型在单个 `<link />` 标签中指定多个媒体类型，如下：\n\n```\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"for_pp.css\"\n    media=\"print, projector\" />\n```\n\
  \n此代码导致 `for_pp.css` 样式表仅适用于 `print` 和 `projector` 媒体类型，不再适用于其他。\n\n\n\n\n使用推荐的打印友好型网页所需的修改建议列表，现在是时候尝试创建一个打印友好型的样式表了。让我们先看一个使用普通（屏幕）样式表显示的页面（请参阅\
  \ 图 25.3）。\n\n**图 25.3** 在普通网络浏览器中查看的经过 CSS 样式化的页面。\n\n![image](img/25fig03.jpg)\n\
  \n***\n\n**提示**\n\n即使你没有链接到外部版本，也可以为你的样式表指定媒体类型（media type）。`<style>` 标签也使用与 `<link\
  \ />` 标签相同的 `media` 属性。\n\n***\n\n图中展示了该页面在普通网络浏览器中的外观。实际上，此页面离打印就绪状态并不远，但它仍然可以从某些改进中获益。\n\
  \n以下更改可以帮助此网页更具打印友好型特性：\n\n• 将所有文本的颜色改为黑色。\n• 移除链接格式（加粗和颜色）。\n• 将两个球员信息部分垂直堆叠，因为它们在打印页面上可能无法水平并排。\n\
  • 完全移除联系链接。\n\n对普通样式表的最初两个更改是直观的；它们主要涉及更改或撤销现有样式。然而，第三个更改需要一些思考。因为你知道打印页面是固定尺寸的，所以你应该对打印页面上的所有元素使用绝对定位（absolute\
  \ positioning）。这使得将内容精确放置在你想要的地方变得容易得多。最后，列表中的最后一项通过简单地将 `contact` 元素的 `display`\
  \ 属性设置为 `none` 就能实现。\n\n***\n\n**注意**\n\n虽然绝对定位对于球员页面有效，但对于为打印特定页面设置样式来说并不总是个好主意。具体来说，如果你的页面包含的内容超过了一个打印页的内容，最好使用相对定位并让内容流到多个页面上。\n\
  \n***\n\n列表 25.1 显示了 `player_print.css` 样式表的 CSS 代码，它将这些更改整合到一个非常适合打印冰球页面的样式表中。\n\
  \n### 列表 25.1 打印特定冰球样式表的 CSS 代码\n\n```css\nbody {\n  font-family:Verdana, Arial;\n\
  \  font-size:12pt;\n  color:black;\n}\n\ndiv {\n  padding:3px;\n}\n\ndiv.title {\n\
  \  font-size:18pt;\n  font-weight:bold;\n  font-variant:small-caps;\n  letter-spacing:2px;\n\
  \  position:absolute;\n  left:0in;\n  top:0in;\n}\n\ndiv.image {\n  position:absolute;\n\
  \  left:0in;\n  top:0.5in;\n}\n\ndiv.info {\n  position:absolute;\n  left:1.75in;\n\
  \  top:0.5in;\n}\n\ndiv.favorites {\n  position:absolute;\n  left:1.75in;\n  top:2in;\n\
  }\n\ndiv.footer {\n  position:absolute;\n  text-align:left;\n  left:0in;\n  top:9in;\n\
  }\n\ntable.stats {\n  width:100%;\n  text-align:right;\n  font-size:11pt;\n  position:absolute;\n\
  \  left:0in;\n  top:3.75in;\n}\n\ndiv.contact {\n  display:none;\n}\n\n.label {\n\
  \  font-weight:bold;\n  font-variant:small-caps;\n}\n\ntr.heading {\n  font-variant:small-caps;\n\
  \  background-color:black;\n  color:white;\n}\n\ntr.light {\n  background-color:white;\n\
  }\n\ntr.dark {\n  background-color:#EEEEEE;\n}\n\nth.season, td.season {\n  text-align:left;\n\
  }\n\na, a:link, a:visited {\n  color:black;\n  font-weight:normal;\n  text-decoration:none;\n\
  }\n```\n\n***\n\n这段代码中最整洁的地方可能是它使用英寸（`in`）作为所有绝对定位代码的测量单位。考虑到我们考虑打印页面时是以英寸而不是像素来考虑，这是合理的。如果你仔细研究代码，你会发现文本全是黑色的，链接中移除了所有特殊的样式格式，并且内容部分现在是绝对定位的（这样它们就会精确出现在你想要的地方）。\n\
  \n### 在打印预览中查看网页\n\n图 25.4 显示了冰球球员页面在浏览器打印预览窗口中显示的打印友好版本。\n\n**图 25.4** 你可以使用打印预览在打印之前查看网页的打印友好版本。\n\
  \n![image](img/25fig04.jpg)\n\n如果 图 25.4 显示的是整个页面——全部 11 英寸的高度甚至更多——你就会注意到页面的打印友好版本现在包含了页面最底部的页脚（请参阅\
  \ 图 25.5）。\n\n**图 25.5** 冰球球员页面通过打印被转换为 PDF 文档。\n\n![image](img/25fig05.jpg)\n\n\
  为了向你展示打印友好页面如何用于 PDF，请查看 图 25.5。此图显示了在 Acrobat Reader 中查看的冰球球员页面。\n\n***\n\n**注意**\n\
  \n要了解更多关于 Acrobat 的信息，请访问 http://www.adobe.com/acrobat/。\n\n***\n\nAdobe 的虚拟打印机可以用于“打印”冰球球员页面到\
  \ PDF。\n\n***\n\n你可能会发现像 DoPDF (http://www.dopdf.com/) 这样的 PDF 转换器很有用。打印到 PDF 有效创建网页网页。\n\
  \n工作坊包含测试问题和活动，帮助你巩固对所涵盖内容的理解。在查看后面的答案 部分之前，尝试回答所有问题。\n\n#### 测试\n\n1. 有指向打印友好页面的按钮意味着该页面真的是打印友好型的吗？\n\
  2. 链接到一个没有指定任何 `media` 属性的外部样式表会怎样？\n3. 如何将名为 `freestyle.css` 的样式表链接到页面，以便使其仅在电视上查看页面时生效？\n\
  \n#### 答案\n\n\n\n\n\n# 1. 不——你仍然必须链接到一个应用了特定样式表的页面，以便它显示为便于打印的。\n\n# 2. `media`\
  \ 属性假设其默认值为 `all`，这会导致样式表作用于所有媒体类型。\n\n# 3. 在 HTML 的 `<head>` 部分使用以下内容：\n\n```html\n\
  <link rel=\"stylesheet\" type=\"text/css\" href=\"freestyle.css\" media=\"tv\" />\n\
  ```\n\n## 练习\n\n- 为一个包含大量颜色和图片的页面创建一个便于打印的样式表。确保在页面上添加一个额外的 `<link />` 标签，用于链接到打印特定的样式表。\n\
  - 如果你觉得很有心勃，可以尝试使用 `<link />` 标签的 `media` 属性的 `handheld` 值，为你的其中一个网页创建一个适用于手持设备的版本。这个概念与创建便于打印的页面相同，区别在于这一次你处理的是极其受限的屏幕尺寸，而不是打印页面。你可以通过发布页面并在手机或手持浏览器上打开它来测试测试。\n\
  \n## 第 26 章：使用 Web 端表单\n\n### 本章你将学习到：\n\n- HTML 表单是如何运作的\n- 如何创建 HTML 表单的前端\n-\
  \ 如何为表单数据项命名\n- 如何在表单中包含隐藏数据\n- 如何根据情况选择正确的表单输入控件\n- 如何提交表单数据\n- 使用 JavaScript 使用表单对象\n\
  - 通过电子邮件发送表单结果\n- 使用 JavaScript 验证表单\n\n到目前，书中的几乎所有内容都侧重于将信息传递给他人。但你也可以利用你的网页从阅读这些网页的人那里收集信息。\n\
  \nWeb 表单允许你从访问你网页的用户那里接收反馈、订单或其他信息。如果你用过像 Google、Yahoo! 或 Bing 等搜索引擎，你就对 HTML 表单并不陌生——那些带有单个按钮的单字段输入表单，点击按钮后就能提供你想要的所有信息甚至更多。产品订单表也是表单的一种非常流行的用法；如果你在\
  \ `Amazon.com` 上订过任何东西或从 eBay 卖家处买过东西，你就用过表单。在本章中，你将学习如何创建自己的表单，但你只将学习如何创建这些表单的前端。处理表单的后端需要编程语言的知识，这超出了本书的范围。然而，在某些情况下，JavaScript\
  \ 可以在表单处理中发挥作用，例如基本的表单内容交付和验证。\n\n### HTML 表单如何工作\n\nHTML 表单是网页的一部分，包含用户可以在其中输入信息的区域，这些将被发送给你、发送到你指定的另一个电子邮件地址、发送到你管理的数据库，或发送到另一个系统（例如用于你表单的第三方管理系统如\
  \ `Salesforce.com`）。\n\n在学习用于创建自己表单的 HTML 标签之前，你至少应该在概念上理解这些表单信息是如何返回给你的。实际的幕后（*服务端*或*后端*）处理过程需要至少一种编程语言的知识，或者至少在用他人的服务端脚本处理表单输入时具备遵循特定指令的能力。在过程的那个阶段，你应当应该与具有技术知识的人合作，或者自己学习基础知识。简单的表单处理一点都不困难，你的网页托管提供商可能有几个后端脚本供你进行少量自定义即可使用。\n\
  \n**注意**\n\nPHP 是最流行的服务端编程语言；任何合格的网页托管提供商都支持它。你可以在 `http://www.php.net/` 了解更多关于\
  \ PHP 的信息，或者你可以直接从 *PHP, MySQL and Apache All in One* (ISBN: 067232976X) 中从零开始学习这种编程语言（外加数据库交互）。尽管还有其他几本关于\
  \ PHP 及相关技术的书籍，但我偏爱这一本，因为我是我写的。它是针对对 PHP 或任何其他编程语言完全陌生的初学者的。\n\n表单包含一个供用户提交表单的按钮；该按钮可以是你自己创建的图像，也可以是标准的\
  \ HTML 表单按钮，该按钮在创建表单 `<input>` 标签并赋予 `type` 值为 `submit` 时就会被创建。当有人点击表单提交按钮时，表单中输入的所有信息都会发送到你在\
  \ `<form>` 标签的 `action` 属性中指定的 URL。该 URL 应该指向一个处理你表单的特定脚本，通过电子邮件发送表单内容，或在交互过程执行执行另一个步骤（例如从搜索引擎请求结果或将项目置于在线购物车中）。\n\
  \n当你开始考虑对表单内容进行更多操作，而不仅仅是将结果通过电子邮件自发给自己时，就需要额外的技术知识了。例如，如果你想创建一个接受信用卡并处理交易的在线商店，会有一些成熟的实践方法，都是为了确保你客户的数据安全。那不是一个你想要轻率涉入的操作；你需要比本书提供的更多的知识。\n\
  \n**注意**\n\n有一种在没有服务端脚本的情况下发送表单数据的方法，你将在本章稍后部分学习该方法——它使用 `<form>` 标签的 `action` 属性中的\
  \ `mailto` 链接。但当你尝试时，请注意它可能会产生不一致的结果；单个浏览器以及个人设置都可能导致该操作的响应与你预期的不同。\n\n在将表单放到网上之前，你应该查看你的网页托管提供商的用户指南，看看他们提供了哪些表单处理脚本。你很可能会找到可以经过少量配置即可使用的\
  \ Perl 或 PHP 脚本。\n\n## 创建表单\n\n每个表单必须以 `<form>` 标签开始，它可以位于 HTML 文档的任何位置。`<form>`\
  \ 标签通常有三个属性：`name`、`method` 和 `action`：\n\n```html\n<form name=\"form1\" method=\"\
  post\" action=\"/mycript.php\">\n```\n\n最常用的 `method` 是 `post`，它将表单输入结果作为文档发送。在某些情况下，你可能需要使用\
  \ `method=\"get\"`，它将结果作为 URL 头部提交。例如，从 Web 表单向搜索引擎提交查询有时会使用 `get`。因为你还不是表单专家，除非你的网页托管提供商文档如此说明，否则请使用\
  \ `post`。\n\n`action` 属性指定了发送表单数据的地址。在这里有两种选择：\n\n- 你输入 Web 服务器上表单处理程序或脚本的位置，然后表单数据将发送到该程序。\n\
  - 你输入 `mailto:` 加上你的电子邮件地址，当有人填写表单时，表单数据将直接发送给你。然而，这种方法完全取决于用户的计算机是否正确配置了电子邮件客户端。\n\
  \n```html <form method=\"post\" action=\"mailto:me@mysite.com\">\n```\n\nHTML 页面上的每个表单在\
  \ JavaScript 中由一个 `form` 对象表示，它的名称与定义它的 `<form>` 标签中的 `name` 属性相同。\n\n或者，你可以使用 `forms`\
  \ 数组来引用表单。该数组包含每个表单元素，从 0 开始索引。例如，如果文档中的第一个表单名为 `form1`，你可以通过两种方式之一来引用它：\n\n```javascript\n\
  document.form1\ndocument.forms[0]\n```\n\n\n\n\n除了元素之外，每个 `form` 对象还拥有一个属性列表，其中大多数属性由相应的\
  \ `<form>` 标签定义。你也可以在 JavaScript 中设置这些属性。它们包括：\n\n*   `action` 是表单的 `action` 属性，或者说是用于提交表单数据的程序。\n\
  *   `encoding` 是表单的 `MIME` 类型，通过 `enctype` 属性指定。在大多数情况下，这是需要的（除非你通过表单上传文件）。\n* \
  \  `length` 是表单中元素的数量。你无法更改此属性。\n*   `method` 是用于提交表单的方法，可以是 `GET` 或 `POST`。这决定了用于将表单结果发送到\
  \ CGI 脚本的数据格式，且不影响 JavaScript。\n*   `target` 指定了显示表单结果（来自 CGI 脚本）的窗口。通常情况下，这是在主窗口中进行的，并替换表单本身，但你可以此属性来处理弹出窗口或框架（frames）。\n\
  \n在代码列表 26.1 中创建的表单以及在图 26.1 中显示的包含了目前 HTML 表单上使用的几乎所有类型的用户输入组件。在阅读以下对每种输入元素的说明时，请参考此列表和图形。\n\
  \n**图 26.1** 代码列表 26.1 中显示的代码使用了几乎所有类型的 HTML 表单输入元素。\n\n![image](img/26fig01.jpg)\n\
  \n代码列表 26.1 带有各种用户输入组件的表单\n\n***\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Guest Book</title>\n    <style type=\"text/css\">\n      .formlabel {\n\
  \        font-weight:bold;\n        width: 250px;\n        margin-bottom: 12px;\n\
  \        float: left;\n        text-align: left;\n        clear: left;\n      }\n\
  \      .formfield {\n        font-weight:normal;\n        margin-bottom: 12px;\n\
  \        float: left;\n        text-align: left;\n      }\n      input, textarea,\
  \ select {\n        border: 1px solid black;\n      }\n    </style>\n  </head>\n\
  \  <body>\n    <h1>My Guest Book</h1>\n    <p>Please sign my guest book. Thanks!</p>\n\
  \    <form name=\"gbForm\" method=\"post\" action=\"URL_to_script\">\n      <div\
  \ class=\"formlabel\">What is your name?</div>\n      <div class=\"formfield\"><input\
  \ type=\"text\" name=\"name\" size=\"50\" /></div>\n      <div class=\"formlabel\"\
  >What is your e-mail address?</div>\n      <div class=\"formfield\"><input type=\"\
  text\" name=\"email\" size=\"50\" /></div>\n      <div class=\"formlabel\">Please\
  \ check all that apply:</div>\n      <div class=\"formfield\">\n        <input type=\"\
  checkbox\" name=\"website_response[]\" value=\"I really like your Web site.\" />I\
  \ really like your Web site.<br />\n        <input type=\"checkbox\" name=\"website_response[]\"\
  \ value=\"One of the best sites I've seen.\" />One of the best sites I've seen.<br\
  \ />\n        <input type=\"checkbox\" name=\"website_response[]\" value=\"I sure\
  \ my site looked good as yours.\" />I sure my site looked good as yours.<br />\n\
  \        <input type=\"checkbox\" name=\"website_response[]\" value=\"I have no\
  \ taste and I'm dense, so your site didn't do much for me.\" />I have no taste and\
  \ I'm dense, so your site didn't do much for me.<br />\n      </div>>\n      <div\
  \ class=\"formlabel\">Choose the one thing you love about my site:</div>\n     \
  \ <div class=\"formfield\">\n        <input type=\"radio\" name=\"lovebest\" value=\"\
  me\" />That gorgeous picture of you.<br />\n        <input type=\"radio\" name=\"\
  lovebest\" value=\"cats\" />All the beautiful pictures of cats.<br />\n        <input\
  \ type=\"radio\" name=\"lovebest\" value=\"childhood\" />The inspiring recap of\
  \ your childhood.<br />\n        <input type=\"radio\" name=\"lovebest\" value=\"\
  treasures\" />The detailed list of all your memorabilia.<br />\n      </div>>\n\
  \      <div class=\"formlabel\">If my site were a book, how many copies would it\
  \ sell?</div>\n      <div class=\"formfield\">\n        <select size=\"3\" name=\"\
  sales\">\n          <option value=\"Millions, for sure.\" selected=\"selected\"\
  >Millions, for sure.</option>\n          <option value=\"100,000+ (would be Oprah's\
  \ favorite)\">100,000+ (would be Oprah's favorite)</option>\n          <option value=\"\
  Thousands (an under-appreciated classic)\">Thousands (an under-appreciated classic)</option>\n\
  \          <option value=\"Very few, not banal for today's public\">Very few, not\
  \ banal for today's public</option>\n          <option value=\"Sell? None. Everyone\
  \ will download it for free.\">Sell? None. Everyone will download it for free.</option>\n\
  \        </select>\n      </div>\n      <div class=\"formlabel\">How can I improve\
  \ my site?</div>\n      <div class=\"formfield\">\n        <select name=\"suggestion\"\
  >\n          <option value=\"Couldn't be better.\" selected=\"selected\">Couldn't\
  \ be better.</option>\n          <option value=\"More about the cats.\">More about\
  \ the cats.</option>\n          <option value=\"More about the family.\">More about\
  \ the family.</option>\n        </select>\n      </div>\n    </form>\n  </body>\n\
  </html>\n```\n\n***\n\n### 接收文本\n\n要在表单内让用户输入，使用 `<input />` 标签。该标签必须位于 `<form>`\
  \ 和 `</form>` 之间，但在页面相对于文本、图像和其他标签的任何位置。例如，为了询问别人的姓名，你可以输入以下文本并接上 `<input />` 字段：\n\
  \n<p>What's your name? <input type=\"text\" size=\"50\" maxlength=\"100\" name=\"\
  user_name\" /></p>\n\n***\n\n### 提示\n\n如果你希望用户输入文本而不在屏幕上显示，可以使用 `<input type=\"\
  password\" />` 代替 `<input type=\"text\" />`。此时，星号（***）将代替用户输入的文本。`size`、`maxlength`\
  \ 和 `name` 属性在 `type=\"password\"` 中的工作方式与 `type=\"text\"` 完全相同。请记住，这种隐藏密码的技术仅提供视觉保护；对于传输的密码没有加密或其他保护措施。\n\
  \n***\n\n`type` 属性指示显示何种类型的表单元素——在本例中是一个简单的单行文本输入框。（本章将单独讨论每种元素。）\n\n`size` 属性指示文本输入框大约有多个字符宽。如果你使用的是比例字体，输入框宽度取决于用户输入的内容。如果输入过长无法放入框内，大多数网络浏览器会自动向左滚动文本。\n\
  \n\n\n\n`maxlength` 属性决定了用户允许在文本框中输入的字符数。如果用户尝试输入超过指定的长度，多出的字符将不会显示。你可以指定一个比文本框物理尺寸更长、更短或相同的长度。`size`\
  \ 和 `maxlength` 属性仅用于 `type=\"text\"`，因为其他输入类型（复选框、单选按钮等）具有固定的尺寸。\n\n## 为每项表单数据命名\n\
  \n无论输入元素是什么种类型，你都必须为它收集的数据指定一个名称（name）。你可以为每个输入项任何任何喜欢的名称，只要表单上的每个名称都是唯一的即可（单选按钮和复选框除外，它们将在本章稍后的部分进行讨论）。当后端脚本处理表单时，每个数据项都通过名称进行标识。该名称将变成一个变量，并被赋值。该值可以是用户在表单中输入的内容，或者是用户所选元素关联的值。\n\
  \n***\n\n### 注意\n\n为了在本本书的范围内解释，这里的表单处理脚本被简化了。提供给处理脚本的变量的确切形式（或名称）取决于该脚本的编程语言。但从概念上来说，可以认为输入元素的名称变成了变量的名称，而输入元素的值变成了后端该变量的值，这是有效的。\n\
  \n***\n\n例如，如果用户在之前定义的文本框中输入 `Jane Doe`，则会向表单处理脚本发送一个变量；变量名为 `user_name`，其值为 `Jane\
  \ Doe`。表单处理脚本处理此类类型的变量名和值。\n\n在 JavaScript 中使用此（或其他）文本字段时，请记住文本对象使用 `name` 属性；你可以如下引用之前代码片段中字段的值：\n\
  \n```\ndocument.formname.user_name.value\n```\n\n本章将贯穿更多名称/值对的示例。\n\n## 在表单中包含隐藏数据\n\
  \n想将某些数据项发送到处理表单的服务器脚本但不想让用户看到这些数据？使用带有 `type=\"hidden\"` 属性的 `<input />` 标签。该属性对显示没有影响；它只是在提交表单时将你指定的任何名称和值添加到表单结果中。\n\
  \n如果你使用的是 Web 托管商提供的表单处理脚本，可能会使用此属性告诉脚本将表单结果发送到哪个邮箱。例如，包含以下代码将在表单提交后将结果发送到 `me@mysite.com`：\n\
  \n```\n<input type=\"hidden\" name=\"mailto\" value=\"me@mysite.com\" />\n```\n\n\
  你有时可能会看到脚本使用隐藏输入元素来携带在接收表单提交结果时可能有额外数据；隐藏表单字段的一些示例包括电子邮件地址和邮件主题。如果你使用的是 Web 托管商提供的脚本，请咨询该脚本提供的文档，以获取有关可能需要的隐藏字段的更多信息。\n\
  \n## 探索表单输入控件\n\n可以使用多种输入控件从用户那里获取信息。你已经看到了一种文本输入选项，接下来的几节将向你介绍设计表单时可以使用的大多数剩余输入选项。\n\
  \n### 复选框\n\n最简单的输入类型是复选框，它显示为一个小方框。用户可以点击复选框来选择或取消选择一组中的一个或多个项目。例如，Listing 26.1](#ch26.html_ch26ex01)\
  \ 中列出的复选框显示在标签“请勾选所有适用项”之后，这意味着用户确实可以勾选所有适用项。\n\nListing 26.1 中复选框的 HTML 显示所有复选框的\
  \ `name` 属性值都是相同的：`website_response[]`。\n\n```\n<input type=\"checkbox\" name=\"\
  website_response[]\" value=\"I really like your Web site.\" />I really like your\
  \ Web site.<br />\n<input type=\"checkbox\" name=\"website_response[]\" value=\"\
  One of the best sites I've seen.\" />One of the best sites I've seen.<br />\n<input\
  \ type=\"checkbox\" name=\"website_response[]\" value=\"I sure wish my site looked\
  \ as good as yours.\" />I sure wish my site looked as good as yours.<br />\n<input\
  \ type=\"checkbox\" name=\"website_response[]\" value=\"I have no taste and I'm\
  \ pretty dense, so your site didn't do much for me.\" />I have no taste and I'm\
  \ pretty dense, so your site didn't do much for me.<br />\n```\n\n`name` 属性中的括号（`[]`）向处理脚本指示了一系列值将被放入这一个变量，而不是仅仅是一个值（嗯，如果用户只选择了一个复选框，它可能确实只有一个值）。如果用户选择了第一个复选框，文本字符串“I\
  \ really like your Web site.”将被放入 `website_response[]` 桶中。如果用户选择了第三个复选框，文本字符串“I\
  \ sure wish my site looked as good as yours.”也会被放入 `website_response[]` 桶中。处理脚本随后将该变量作为一个值数组来处理。\n\
  \n***\n\n### 提示\n\n如果你发现输入标签与元素太近，只需在 `<input />` 标签结束处和标签之间添加一个空格：\n\n```\n<input\
  \ type=\"checkbox\" name=\"mini\" />\n```\n\n***\n\n然而，你可能会看到使用独立名称的复选框组。例如，如下：\n\
  \n```\n<input type=\"checkbox\" name=\"liked_site\" value=\"yes\" />I really like\
  \ your site.\n<input type=\"checkbox\" name=\"best_site\" value=\"yes\" />One of\
  \ the best I've seen.\n<input type=\"checkbox\" name=\"my_site_sucks\" value=\"\
  yes\" />I sure wish my site looked as good as yours.\n<input type=\"checkbox\" name=\"\
  am_dense\" value=\"yes\" />I have no taste and I'm pretty dense, so your site didn't\
  \ do much for me.\n```\n\n在之前的复选框中，第一个复选框的名称是 `liked_site`，值（如果勾选）是 `yes`。\n\n如果你想让复选框在表单渲染时默认被选中，请包含\
  \ `checked` 属性。例如，以下代码创建了两个复选框，且第一个默认被选中：\n\n```\n<input type=\"checkbox\" name=\"\
  website_response[]\" value=\"I really like your Web site.\" checked=\"checked\"\
  \ />I really like your Web site.<br />\n<input type=\"checkbox\" name=\"website_response[]\"\
  \ value=\"One of the best sites I've seen.\" />One of the best sites I've seen.<br\
  \ />\n```\n\n***\n\n### 注意\n\nXHTML 要求所有属性都有一个等号后跟一个值。这解释了为什么使用 `checked=\"checked\"\
  ` 来指示复选框被选中（而不是仅仅用 `checked`）。此规则适用于你在 HTML 中可能遇到的所有布尔属性（`true`/`false`、`on`/`off`、`yes`/`no`\
  \ 等）。\n\n***\n\n在这个示例中，标记为“I like your site.”的复选框默认被选中。用户必须点击复选框来表示他们对你的网站有其他意见。标记为“One\
  \ of the best I’ve seen.”的复选框最初未勾选，因此用户必须点击它来开启。未选中的复选框完全不会出现在表单输出中\n\n如果你想在 JavaScript\
  \ 中处理来自 `checkbox` 对象的值，该对象具有以下四个属性：\n\n- `name` 是复选框的名称，也是对象的名称。\n- `value` 是复选框的“真”值——通常是\
  \ `on`。此值被服务器端程序用于指示复选框是否被勾选。在 JavaScript 中，你应该使用 `checked` 属性。\n\n\n\n\n\n- `defaultChecked`\
  \ 是复选框的默认状态，由 HTML 中的 `checked` 属性赋值。\n- `checked` 是当前值。这是一个布尔值：`true` 表示选中，`false`\
  \ 表示未选中。\n\n要操作复选框或使用其值，您可以使用 `checked` 属性。例如，此条语句会勾选名为 `order` 的表单中名为 `same_address`\
  \ 的复选框：\n\n```javascript\ndocument.order.same.checked = true;\n```\n\n复选框有一个方法：`click()`。该方法模拟点击该框框。它还有一个事件\
  \ `onClick`，每当复选框被点击时，该事件就会发生。无论框框是开启还是关闭，都会发生，因此您需要通过 JavaScript 检查 `checked` 属性来查看实际上发生了什么操作。\n\
  \n### 单选按钮 (Radio Buttons)\n\n单选按钮一次只能选择一个选项，其实现方式与复选框一样简单。单选按钮简单的用法是用于回答是/否问题，或在只能选择一个候选人的情况下投票。\n\
  \n要创建一个单选按钮，只需使用 `type=\"radio\"` 并为每个选项提供自己的 `<input />` 标签。组中的所有单选按钮使用相同的 `name`，但不要使用您在复选框中使用的\
  \ `[]`：\n\n```html\n<input type=\"radio\" name=\"vote\" value=\"yes\" checked=\"\
  checked\" /> Yes<br />\n<input type=\"radio\" name=\"vote\" value=\"no\" /> No <br/>\n\
  ```\n\n`value` 可以您选择的任何名称或代码。如果包含了 `checked` 属性，则该按钮默认被选中。具有相同 `name` 的单选按钮最多不能有一个被选中。\n\
  \n#### Note\n\n单选按钮之所以这样命名，是因为它们类似于旧式按钮式收音机上的按钮。那些按钮使用机械结构，使得当你按下其中一个按钮时，其他按钮会弹出。\n\
  \n在设计表单并在复选框和单选按钮之间进行选择时，问问自己：“这个问题是只有一种回答方式吗？”如果是，请使用单选按钮。\n\n在脚本方面，单选按钮与复选框相似，区别在于整组按钮共享同一个\
  \ `name` 和同一个对象。您可以引用 `radio` 对象的以下属性：\n\n- `name` 是单选按钮的共同名称。\n- `length` 是组中单选按钮的数量。\n\
  \n在 JavaScript 中访问单个按钮时，您将 `radio` 对象视为数组。按钮是有索引的，从 `0` 开始。每个单独按钮都有以下属性：\n\n- `value`\
  \ 是分配给按钮的值。\n- `defaultChecked` 表示 `checked` 属性的值和按钮的默认状态。\n- `checked` 是当前状态。\n\
  \n例如，您可以使用此条语句检查 `form1` 表单中 `radio1` 组中的第一个单选按钮：\n\n```javascript\ndocument.form1.radio1[0].checked\
  \ = true;\n```\n\n然而，如果您这样做，请务必根据需要将其他值设置为 `false`。这并不会自动完成。您可以使用 `click()` 方法在一步内完成这两项操作。\n\
  \n像复选框一样，单选按钮也有一个 `click()` 方法和 `onClick` 事件处理器。每个单选按钮都可以为此事件编写一个单独的语句。\n\n### 选择列表\
  \ (Selection Lists)\n\n滚动列表和下拉选择列表都是用 `<select>` 标签创建的。如下例所示，您将此标签配合 `<option>`\
  \ 标签一起使用：\n\n```html\n<select size=\"3\" name=\"sales\">\n  <option value=\"Millions,\
  \ for sure.\" selected=\"selected\">Millions,\n      for sure.</option>\n  <option\
  \ value=\"100,000+ (would be Oprah's favorite)\">100,000+\n      (would be Oprah's\
  \ favorite)</option>\n  <option value=\"Thousands (an under-appreciated classic)\"\
  >Thousands\n      (an under-appreciated classic)</option>\n  <option value=\"Very\
  \ few: not banal enough for today's public\">Very\n      few: not banal enough for\
  \ today's public.</option>\n  <option value=\"Sell? None. Everyone will download\
  \ it for free.\">Sell?\n      None. Everyone will download it for free.</option>\n\
  </select>\n```\n\n在 `<select>` 和 `</select>` 标签之间不应出现 `<option>` 和 `</option>` 之外的\
  \ HTML 标签。\n\n#### Tip\n\n如果省略 `size` 属性或指定 `size=\"1\"`，列表将创建一个下拉选择列表。选择列表不允许多选；它们在逻辑上等同于一组单选按钮。接下来的示例展示了为问题选择是否的另一种方法：\n\
  \n```html\n<select name=\"vote\">\n  <option value=\"yes\">Yes</option>\n  <option\
  \ value=\"no\">No</option>\n</select>\n```\n\n与 `text` 输入类型不同，这里的 `size` 属性决定了选择列表中一次显示多少项。如果在前面的代码中使用了\
  \ `size=\"2\"`，则这里的 `size` 属性决定了选择列表中一次显示多少项。\n\n\n\n\n\n正如你可能猜到的，`rows` 和 `cols`\
  \ 属性控制输入框内可容的文本行数和列数。`cols` 属性没有 `rows` 精确，它近似于一行文本可容纳的字符数。然而，文本区域框确实有滚动条，因此用户输入的文本可以超过显示区域的范围。\n\
  \n`text` 和 `textarea` 对象还有几个你可以使用的方法：\n\n- `focus()` 将焦点设置到该字段。这会将光标置于字段中并使其成为当前字段。\n\
  - `blur()` 是相反的操作；它会移除字段的焦点。\n- `select()` 选择字段中的文本，就像用户使用鼠标操作一样。它会选中所有文本；没有办法只选择部分文本。\n\
  \n你还可以使用事件处理器来检测文本字段值的变化。`text` 和 `textarea` 对象支持以下事件处理器：\n\n- `onFocus` 事件在文本字段获得焦点时发生。\n\
  - `onBlur` 事件在文本字段失去焦点时发生。\n- `onChange` 事件在用户更改字段中的文本并然后离开该字段时发生。\n- `onSelect`\
  \ 事件在用户选取字段中的部分或全部文本时发生。遗憾的是，没有办法准确判断选取了哪部分文本。（如果使用前述的 `select()` 方法选取文本，则不会触发此事件。）\n\
  \n如果使用这些事件处理器，应将其包含在 `<input>` 标签声明中。例如，以下是一个包含显示警告的 `onChange` 事件的文本字段：\n\n```html\n\
  <input type=\"text\" name=\"text1\" onChange=\"window.alert('Changed.');\" />\n\
  ```\n\n### 提交表单数据\n\n表单通常包含一个按钮，将表单数据提交到服务器上的脚本或调用 JavaScript 动作。你可以使用 `value` 属性在提交按钮上放置任何喜欢的标签：\n\
  \n```html\n<input type=\"submit\" value=\"Place My Order Now!\" />\n```\n\n灰色按钮的大小将根据你放入\
  \ `value` 属性的标签内容进行调整。当用户点击它时，表单上的所有数据项将发送到表单 `action` 属性中指定的邮箱地址或脚本。\n\n你还可以包含一个重置（Reset）按钮，它可以清除表单上的所有条目，以便用户在改变主意或出错时重新开始。使用以下代码：\n\
  \n```html\n<input type=\"reset\" value=\"Clear This Form and Start Over\" />\n```\n\
  \n如果你觉得标准的提交和重置按钮看起来有些单调，记住你可以使用 CSS 对它们进行样式化。如果这还不够，你会高兴地知道，有一种简单的方法可以用自己的图形替换这些按钮。要使用你喜欢的图片作为提交按钮，请使用以下代码：\n\
  \n```html\n<input type=\"image\" src=\"button.gif\" alt=\"Order Now!\" />\n```\n\
  \n`button.gif` 将显示在页面上，当用户点击 `button.gif` 图片时，表单将提交。你还可以包含任何通常用于 `<img />` 标签的属性，例如\
  \ `alt` 和 `style`。\n\n表单元素还包含一种通用按钮类型。在 `<input />` 标签中使用 `type=\"button\"` 时，你将获得一个自身不执行任何动作的按钮，但可以使用\
  \ JavaScript 事件处理器为其分配动作。\n\n#### 使用 JavaScript 处理表单事件\n\n`form` 对象有两个方法：`submit()`\
  \ 和 `reset()`。你可以使用这些方法手动提交数据或重置表单，而不需要用户按下按钮。这样做的一个原因是在当用户点击图像或执行其他通常不会提交表单的动作时提交表单。\n\
  \n**注意**\n\n如果你使用 `submit()` 方法将数据发送到服务器或通过电子邮件，大多数浏览器会提示用户确认其是否想要提交这些信息。无法在用户不知情的情况下的情况下执行此操作。\n\
  \n`form` 对象有两个事件处理器：`onSubmit` 和 `onReset`。你可以在定义表单的 `<form>` 标签内为这些事件指定一组 JavaScript\
  \ 语句或函数调用。\n\n如果你为 `onSubmit` 事件指定了语句或函数，该语句将在数据提交到服务器端脚本之前被调用。你可以通过从 `onSubmit`\
  \ 事件处理器返回 `false` 值来防止提交的发生。如果语句返回 `true`，则数据将被提交。以同等的方式，你也可以通过 `onReset` 事件处理器阻止重置按钮生效。\n\
  \n### 使用 JavaScript 访问表单元素\n\n`form` 对象最重要的属性是 `elements` 数组，它包含了每个表单元素的一个对象。你可以通过元素自身的名称或数组中的索引来引用元素。例如，以下两个表达式都引用了\
  \ Listing 26.1 所示表单中的第一个元素：\n\n```javascript\ndocument.gbForm.elements[0]\ndocument.gbForm.name\n\
  ```\n\n**注意**\n\n表单和元素都可以通过它们自身的名称或作为 `forms` 和 `elements` 数组中的索引进行引用。为了清晰起见，本章示例使用了具体的表单和元素名称，而不是数组引用。你也会发现在自己的脚本中使用名称更加方便。\n\
  \n如果你确实将表单和元素视为数组，可以使用 `length` 属性来确定数组中对象的数量：`document.forms.length` 是表单的数量。\n\n\
  ### 显示表单数据\n\n```html\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.0//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1.dtd\"\
  ><html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en\">\n<head>\n  <title>Form\
  \ Display</title>\n  <script type=\"text/javascript\">\n    function display() {\n\
  \      dispWin = window.open('NewWin','toolbar=no,status=no,width=300,height=200')\n\
  \      message = \"<ul><li><strong>NAME:</strong> \" +\n      document.form1.name.value;\n\
  \      message += \"<li><strong>ADDRESS:</strong> \" +\n      document.form1.address.value;\n\
  \      message += \"<li><strong>PHONE:</strong> \" +\n      document.form1.phone.value\
  \ + \"</li></ul>\";\n      dispWin.document.write(message);\n    }\n  </script>\n\
  </head>\n<body>\n  <h1>Form Display</h1>\n  <p>输入以下信息。当点击 Display 按钮时，你输入的数据将在弹出窗口中显示。</p>\n\
  \  <form name=\"form1\" method=\"get\" action=\"\">\n    <p>NAME: <input type=\"\
  text\" name=\"name\" size=\"50\" /></p>\n    <p>ADDRESS: <input type=\"text\" name=\"\
  address\" size=\"50\" /></p>\n    <p>PHONE: <input type=\"text\" name=\"phone\"\
  \ size=\"50\" /></p>\n    <p><input type=\"button\" value=\"Display\" onclick=\"\
  display();\" /></p>\n  </form>\n</body>\n</html>\n```\n\n以下是此 HTML 文档和脚本的工作原理说明：\n\
  \n- 文档头部的 `<script>` 部分定义了一个名为 `display()` 的函数，该函数会打开一个新窗口并显示表单中的信息。\n\n\n\n\n\n\
  • `<form>` 标签开始表单。由于此表单完全由 JavaScript 处理，因此表单的 `action` 和 `method` 无值。\n\n• `<input\
  \ />` 标签定义了表单的三个字段：`yourname`、`address` 和 `phone`。最后一个 `<input />` 标签定义了显示按钮，设置为运行\
  \ `display()` 函数。\n\n图 26.2 显示了该表单的运行情况。显示按钮已被点击，弹出窗口了结果。\n\n**图 26.2** 在弹出窗口中显示表单数据。\n\
  \n![image](img/26fig02.jpg)\n\n### 通过电子邮件发送表单结果\n\n使用表单的一种简单方法是通过电子邮件发送结果。你可以不使用任何\
  \ JavaScript，尽管可以使用 JavaScript 来验证输入的信息（你将在本章后面的部分学习）。\n\n要通过电子邮件发送表单结果，可以在表单的 `action`\
  \ 属性中使用 `mailto:` 操作。列表 26.3 是列表 26.2 名称和地址表单的修改版本，通过电子邮件发送结果。\n\n列表 26.3 通过电子邮件发送表单结果\n\
  \n* * *\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Form Submit Example</title>\n  </head>\n  <body>\n    <h1>Form Submit Example</h1>\n\
  \    <p>Enter the following information. When you press the Send\n      button,\
  \ the data you entered will be send via e-mail.</p>\n    <form name=\"form1\" method=\"\
  post\" action=\"mailto:user@domain.com\"\n          enctype=\"text/plain\">\n  \
  \    <p>NAME: <input type=\"text\" name=\"name\" size=\"50\" /></p>\n      <p>ADDRESS:\
  \ <input type=\"text\" name=\"address\" size=\"50\" /></p>\n      <p>PHONE: <input\
  \ type=\"text\" name=\"phone\" size=\"50\" /></p>\n      <p><input type=\"submit\"\
  \ value=\"Submit Form\" /></p>\n    </form>\n  </body>\n</html>\n```\n\n* * *\n\n\
  * * *\n\n#### 注意\n\n由于这种技术在所有浏览器上的工作效果并不一致，我不建议你使用它。某些浏览器会调用你的邮件客户端；而另一些则会通过你基于浏览器的电子邮件账户发送表单数据。提供这个示例更多是作为你*可以*\
  \ 使用 JavaScript 完成的流程示例，你在网络上找到许多脚本时可能会看到它。对于更可靠的发送表单结果的方法，你可以使用服务器端的表单转电子邮件脚本；你的托管提供商可能有一个或多个此类脚本供你使用。\n\
  \n* * *\n\n要使用此表单，请将 `<form>` 标签 `action` 属性中的 `user@domain.com` 更改为你的电子邮件地址。注意\
  \ `<form>` 标签中的 `enctype=\"text/plain\"` 属性。这确保电子邮件消息中的信息将是可读的纯文本格式，而不是编码格式。\n\n\
  尽管这提供了一种从表单获取数据的快速粗暴的方法，但这种技术的缺点是它高度依赖浏览器。它是否对你页面的每个用户有效，取决于其浏览器和邮件客户端的配置。\n\n*\
  \ * *\n\n### 动手尝试：验证表单\n\nJavaScript 最有用途之一是验证表单。这意味着使用脚本来验证输入的信息是否有效——例如，确保没有字段为空，并且数据格式正确。\n\
  \n无论表单是通过电子邮件提交、到服务器端脚本还是仅供脚本使用，你都可以使用 JavaScript 来验证表单。列表 26.4 是包含验证功能的名称和地址表单。\n\
  \n列表 26.4 带有验证脚本的表单\n\n* * *\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>Form Submit Example</title>\n    <script type=\"text/javascript\">\n  \
  \    function validate() {\n        if (document.form1.name.value.length < 1) {\n\
  \          alert(\"Please enter name.\");\n          return false;\n        }\n\
  \        if (document.form1.address.value.length < 3) {\n          alert(\"Please\
  \ enter address.\");\n          return false;\n        }\n        if (document.form1.phone.value.length\
  \ < 3) {\n          alert(\"Please enter phone.\");\n          return false;\n \
  \       }\n        return true;\n      }\n    </script>\n  </head>\n  <body>\n \
  \   <h1>Form Submit Example</h1>\n    <p>Enter the following information. When you\
  \ press the Send\n      button, the data you entered will be send via e-mail.</p>\n\
  \    <form name=\"form1\" method=\"post\" action=\"mailto:user@domain.com\"\n  \
  \        enctype=\"text/plain\" onsubmit=\"return validate()\">\n      <p>NAME:\
  \ <input type=\"text\" name=\"name\" size=\"50\" /></p>\n      <p>ADDRESS: <input\
  \ type=\"text\" name=\"address\" size=\"50\" /></p>\n      <p>PHONE: <input type=\"\
  text\" name=\"phone\" size=\"50\" /></p>\n      <p><input type=\"submit\" value=\"\
  Submit Form\" /></p>\n    </form>\n  </body>\n</html>\n```\n\n\n\n\n\n**A.** 是的，如果你足够小心的话。请确保使用\
  \ `Submit` 按钮而不是 `submit` 动作。此外，服务器端脚本可能会接收到未验证的数据，因此请务必在 CGI 脚本中包含相同的验证逻辑。非 JavaScript\
  \ 用户仍然可以使用表单，但无法获得关于其错误的即时反馈。\n\n**Q. 是否有某种方法可以创建大量的文本字段，而无需为它们每一个都处理不同的名称？**\n\n\
  **A.** 是的。如果你在表单的多个元素中使用相同的名称，它们对应的对象将形成一个数组。例如，如果你定义了 20 个名称为 `member` 的文本字段，你可以通过\
  \ `member[0]` 到 `member[19]` 来引用它们。这对于其他类型的表单元素也同样有效。\n\n**Q. 是否有方法可以在表单加载时或在我的验证程序显示错误消息后，将光标放置在特定字段上？**\n\
  \n**A.** 是的。你可以使用字段的 `focus()` 方法将光标发送到那里。若要在页面加载时执行此操作，可以使用 `<body>` 标签中的 `onLoad`\
  \ 方法。然而，目前没有办法将光标放置在字段内的特定位置上。\n\n## 工作坊\n\n工作坊包含了测验题和活动，帮助你巩固对所涵盖内容的理解。在查看随后的“答案”部分之前，尝试回答所有问题。\n\
  \n#### 测验\n\n**1.** 你会使用什么 HTML 代码来创建一个访客簿表单，询问某人的姓名和性别？假设你已经在 `/scripts/formscript`\
  \ 设置好了一个表单处理脚本，并且你需要包含以下隐藏输入元素来告诉脚本将表单结果发送到何处：\n\n```html\n<input type=\"hidden\"\
  \ name=\"mailto\" value=\"you@yoursite.com\" />\n```\n\n**2.** 如果你创建了一个名为 `submit.gif`\
  \ 的图像，你将如何使用它作为问题 1 中创建的表单的提交按钮？\n\n**3.** `<form>` 标签的这些属性中哪一个决定了数据将发送到何处？\n\n\
  **a.** `action`\n\n**b.** `method`\n\n**c.** `name`\n\n**4.** 你在哪里放置 `onsubmit`\
  \ 事件处理程序来验证表单？\n\n**a.** 在 `<body>` 标签中\n\n**b.** 在 `<form>` 标签中\n\n**c.** 在提交按钮的\
  \ `<input />` 标签中\n\n#### 答案\n\n**1.** 你将使用类似下面的 HTML 代码（当然，，还需要适当的 DOCTYPE 和其他结构化标记）：\n\
  \n```html\n<form name=\"form1\" method=\"post\" action=\"/scripts/formscript\">\n\
  \  <input type=\"hidden\" name=\"mailto\" value=\"you@yoursite.com\" />\n  <p>您的姓名：<input\
  \ type=\"text\" name=\"name\" size=\"50\" /></p>\n  <p>您的性别：\n    <input type=\"\
  radio\" name=\"gender\" value=\"male\" /> 男\n    <input type=\"radio\" name=\"gender\"\
  \ value=\"female\" /> 女\n    <input type=\"radio\" name=\"gender\" value=\"mind\
  \ your business\" />\n    关你的事 </p>\n  <p><input type=\"submit\" value=\"提交表单\"\
  \ /></p>\n</form>\n```\n\n**2.** 替换以下代码：\n\n```html\n<input type=\"submit\" value=\"\
  Submit Form\" />\n```\n\n替换为这段代码：\n\n```html\n<input type=\"image\" src=\"submit.gif\"\
  \ />\n```\n\n**3.** a. `action` 属性决定了数据的发送去处。\n\n**4.** b. 你将 `onsubmit` 事件处理程序放置在\
  \ `<form>` 标签中。\n\n#### 练习题\n\n- 使用所有类型的输入元素和选择列表创建一个表单，以确保你理解它们每种的工作原理。\n- 修改 列表\
  \ 26.4 中的 `validate` 函数，使得在显示指示某个字段错误的消息后，光标会移动到该字段。（对相应的表单元素使用 `focus` 方法。）\n-\
  \ 在 列表 26.4 的表单中添加一个用于电子邮件地址的文本字段。在 `validate` 函数中添加一个功能，验证电子邮件地址至少包含五个字符且包含 `@`\
  \ 符号。\n- 调查你的网络托管提供商提供的表单处理选项，并使用网络托管提供商提供的脚本来处理你在上一个练习中创建的表单。\n\n## 第 27 章 网站的组织与管理\n\
  \n* *\n\n在本章中你将学习：\n\n- 如何判断一个页面是否足以处理你所有的内容\n- 如何组织简单的网站\n- 如何组织大型网站\n- 如何编写可维护的代码\n\
  - 如何开始使用版本控制\n\n* * *\n\n本书的大部分内容已经引导你完成了设计并创建自己的 Web 内容，从从文本到图形和多媒体的内容，以及为了增强用户交互而实现的基础\
  \ JavaScript 功能。在这一路途中，我记录了一些你可以考虑这些内容生命周期的方法，但在本章中，你将学习如何看待你的作品。\n\n本章向你展示如何组织和呈现多个页面，以便访问者能够在其中穿梭而不感到困惑。你还将学习如何从整体来看待。Web\
  \ 开发者使用 *sticky* 一词来描述那些人们不想离开的页面。希望本章能帮助你让你的网站具有吸引力！\n\n由于网站可以（通常应该）频繁更新，因此创建易于维护的页面至关重要。本章向你展示如何向页面添加注释，以便你或团队中的其他人可以理解并修改页面。\n\
  \n* *\n\n### 动手尝试：评估你的组织结构\n\n到本书为止，你应该已经了足够的 HTML、CSS 和 JavaScript 知识来制作大部分网站。你可能已经创建了一些页面，甚至已经发布了它们。\n\
  \n在阅读本章时，思考你现在的页面组织方式以及你可以如何改进这种结构。你是否在 HTML 和 JavaScript 中使用了注释，或者创建了展示你组织结构的文档？如果没有，现在是一个开始的好时机。在这个过程中，如果你决定对所有页面进行重新设计，请不要惊讶——结果可能是非常值得的！\n\
  \n* *\n\n### 何时一个页面足够\n\n构建和组织一个吸引且有效的网站并不总是一个复杂的任务。如果你在为一个单一实体（例如当地活动）创建一个 Web\
  \ 存在，且只需要少量特定信息，你可以在单个页面上有效地呈现这些信息。事实上，单页 Web 存在有几个优点：\n\n- 网站的所有信息下载速度比更广泛的网站更快。\n\
  - 整个网站可以使用一次打印命令打印，即使它有几页纸长。\n- 访问者可以轻松将网站保存在硬盘上以备后用，特别是当它图形图形时。\n- 同一页面不同部分之间的链接通常比指向其他页面的链接响应更快。\n\
  \n图 27.1 显示了一个页面的开头，作为一个单一长页面比多页网站更能服务其目标受众。该页面像大多数介绍页面一样，首先是对页面内容进行简要说明以及谁会阅读它。详细的目录允许访问者直接跳转到他们最的参考资料。它包含了大约八页纸内容的，解释了如何开始买房过程——访问者可能会考虑将其打印出来以后阅读，可能还会做笔记。\n\
  \n**图 27.1** 一个良好的目录可以让长页面变得易于导航。\n\n```\n![image](img/27fig01.jpg)\n```\n\n\n\n\
  \n\n如图 27.2 所示，页面的每个短小章节之后都跟着一个返回目录的链接，因此在页面上进行导航的感觉与在多页网站上进行导航非常相似。由于页面内容旨在作为方便的参考，访问者无疑更倾向于书签或保存单个页面的便利，而不是多个独立的页面。\n\
  \n**图 27.2** 在长网页的每个章节之后，始终务必提供一个返回目录的链接。\n\n![image](img/27fig02.jpg)\n\n在看过了此书中所有花哨的图形和布局后，你可能会想忘记：一个良好的、老式的大纲通常是组织网站内长页面的最清晰、最高效的方法。\n\
  \n### 组织简单网站\n\n虽然单页网站有其用武之地，但大多数公司和个人通过将网站分为短小、易于阅读的页面来更好地服务读者。这些页面环绕着图形化导航，允许用户在几次点击内访问他们几乎想要的所有信息。此外，使用多个页面而不是一系列非常长的页面可以减少在页面上的滚动，这对于使用移动设备查看网站或显示器分辨率较低（低于\
  \ 800×600）的访问者来说尤为困扰。\n\n首页的目标仅仅是让组织结构在互联网上可见，而且——更重要的是——作为通往网站内部信息的门户。网站的主页应该为用户提供足够的信息，以清晰展示组织情况，以及传统的地址、电话联系信息，以及用于咨询问题或反馈的电子邮件地址。它还应该提供清晰的路径，进入网站其他页面中应包含的高度结构化信息。图\
  \ 27.3 所示的主页提供了所有这些良好特性的示例：基本信息、联系信息以及面向多个受众的信息路径。\n\n**图 27.3** 该大学主页使用基础设计、极简但实用的图形和清晰的结构，来吸引用户探索更多信息。\n\
  \n![image](img/27fig03.jpg)\n\n***\n\n**提示**\n\n无论你的网站有多大，仔细组织你的资源都是一个好主意。例如，将你网页的图像放在一个名为\
  \ `images` 的独立文件夹中。同样，如果你有可下载的文件，请将它们放在名为 `downloads` 的文件夹中。这使得根据特定类型（HTML 页面、GIF\
  \ 图像等）跟踪网页资源变得容易得多。此外，如果你将网站划分为若干章节（如公司、产品、新闻等），请将单独页面放在类似命名的目录（`company`、`products`、`press`\
  \ 等）中，出于同样的组织考虑。\n\n***\n\n初级网站开发者犯的最常见错误之一是创建与网站上其他页面看起来不同的页面。另一个同样严重的错误是使用成千上万其他网页作者也在使用的相同公开剪贴画。记住，在互联网上，点击一下就能带你环游世界。让你的页面被记住并被识别为一个统一网站的唯一方法，就是让你所有页面都遵循一个独特的、不可误认的视觉主题。换句话之，努力与其他网站相比保持独特性，同时保持网站内部的统一性。\n\
  \n作为一个统一性如何帮助网站更具凝聚力的示例，请想想你访问过的大型热门网站，例如 [ESPN.com](http://ESPN.com)。如果你访问 [ESPN.com](http://ESPN.com)\
  \ 的 MLB 板块（参见图 27.4）和 NFL 板块（参见图 27.5），你会发现它们的结构非常相似。\n\n**图 27.4** [ESPN.com](http://ESPN.com)\
  \ 的 MLB 板块。\n\n![image](img/27fig04.jpg)\n\n**图 27.5** [ESPN.com](http://ESPN.com)\
  \ 的 NFL 板块。\n\n![image](img/27fig05.jpg)\n\n在两个示例中，你都能看到页面顶部的导航元素（包括一些子导航元素）、页面中间用于精选项目图形的大型区域、右侧一个包含当前头要新闻链接的矩形，以及头要新闻链接下方第二个矩形（用于显示广告）。MLB\
  \ 板块和 NFL 板块之间的唯一区别是配色方案：MLB 板块属于蓝色调配色方案，而 NFL 板块以绿色为主。然而，在两个板块中，你都知道如果想读热门新闻，就看页面右侧。如果你想导航到网站的其他板块或网站主页，就看页面左上角的导航元素。\n\
  \n这些一致的元素有助于确保你的用户能够自信地贯穿整个内容。从维护的角度来看，一致的结构模板允许你重用代码段。这种代码重用通常通过本书范围之外的动态服务器端编程实现，但通常意味着不需要反复复制和粘贴相同的\
  \ HTML 和 JavaScript，这些客户端代码只存在于一个地方，并动态应用于内容中。因此，你不需要对成千上万的文件进行修改，只需要修改一次即可。\n\n\
  ### 组织大型网站\n\n对于复杂的网站，如果能在所有页面中一致地使用复杂的布局和图形，可以帮助组织并改进网站的外观。为了查看如何让美学和组织齐手工作，让我们看看几个向不同受众展示大量信息的网站的导航（以及底层组织结构）示例。\n\
  \n图 27.6 显示了 [Amazon.com](http://Amazon.com) 的主页，特别是选择了侧边导航的情况。Amazon 的业务是销售产品，非常简单。因此，让\
  \ Amazon 显示产品类别作为主元素是合理的，如图所示。\n\n**图 27.6** [Amazon.com](http://Amazon.com) 显示产品类别作为主要的导航元素。\n\
  \n![image](img/27fig06.jpg)\n\n尽管 Amazon 的业务是销售产品，但它仍然必须提供关于它是谁、如何联系它以及其他辅助但重要的信息，以增强企业与消费者的关系。此类信息的链接出现在\
  \ [Amazon.com](http://Amazon.com) 网站的页脚（或底部）——位于此截图的查看区域之外。在创建网站模板时，你必须确定最重要的内容区域以及如何组织这些内容；此外，记住为用户提供基本信息——特别是如果这些信息可以提升你的形象，并让用户觉得你重视他们说的话。\n\
  \n\n\n\n下一个示例是 [Starbucks.com](http://Starbucks.com) 网站中的一个二级页面。[Starbucks.com](http://Starbucks.com)\
  \ 网站中的所有页面都遵循一种常见的导航和子导航呈现类型之一：用于主导航的水平条，以及该部分的二级元素放置在左侧的垂直列中。如图 27.7 二级页面显示了一个选中的主导航元素，页面左侧带有二级导航。\n\
  \n![image](img/27fig07.jpg)\n\n从不同的主导航元素可以看出——我们的咖啡、我们的门店、星巴克卡、居家、商务、关于我们以及在线购物——星巴克网站必须服务于因各种原因访问网站的许多不同类型的人。当你组织自己的网站内容时，请确定对你来说最重要的信息，以及对你的用户最重要的信息，并创建一个在两者之间找到良好平衡的导航方案。\n\
  \n图 27.8 显示了另一种导航风格的示例，这次是对标准顶部导航/左侧导航方案的变体。在这个例中，左侧导航（在此例中为二级导航）也出现在主导航下的下拉菜单中（请参阅第\
  \ 11 章“使用 CSS 为列表、文本和导航实现更多功能”，以获取如何实现此类操作的信息）。将鼠标悬停在任何其他主导航元素上都会显示类似的菜单。这种方案使用户在指尖就能拥有整个站点地图，因为他们从任何其他页面点击一下即可到达网站的任何地方。\n\
  \n图 27.8：[BAWSI.org](http://BAWSI.org) 网站显示了附加在每个主导航元素上的子导航。\n\n![image](img/27fig08.jpg)\n\
  \n你还会注意到侧边导航窗口中的“概述”（Overview）链接样式与窗口中的其他链接略有不同——使用了较深的紫色字体——这告诉访问者他们正处于哪个页面。这种视觉细节类似于你在星巴克网站上看到的，是一种不具侵入性的，为用户提供其在当前导航方案中的位置感。\n\
  \n有许多不同的导航样式和向用户指示他们在哪里以及他们可能想去何处的方法。请记住以下事实：研究反复表明，当人们一次面对超过七个选择时，会感到困惑和烦恼，而人们面对五个或更少的选择时感到最舒适。因此，如果可能，你应该避免相邻展示五个以上的链接（无论是列表形式还是图形图标形式），并绝对避免一次性展示超过七个链接。[Amazon.com](http://Amazon.com)\
  \ 在这里是可以被允许的，因为它是一个互联网超级超市，用户在到达那里时预期会有很多“部门”可以购物。但当你确实需要在导航列表中展示七个以上的链接时，请将它们拆分成多个列表，并为每五个到七个项目设置一个单独的标题，正如你在图\
  \ 27.6 中的[Amazon.com](http://Amazon.com)示例看到的那样。\n\n如果你避免让任何页面距离主页超过两个（或最多三个）链接，也将帮助读者在不困惑的情况下导航你的网站。在读者阅读子页面后，你还应该始终将读者引导主分类页面（或首页）。换句话说，尝试设计一种扁平化的链接结构，其中大多数页面的深度不超过一或两个链接。你不希望访问者严重依赖甚至完全依赖浏览器的“后退”按钮来浏览你的网站。\n\
  \n### 编写可维护的代码\n\n如果你在读此书之前做过任何编程，你已经知道编写可以维护的代码有多么重要——也就是说，你或其他人以后查看你的代码时，不会被它完全搞糊。挑战在于让你的代码尽可能地直观易懂。总会有一天，当你回头看自己写的一个页面，完全不知道当时在想什么，或者为什么要那样写代码。幸运的是，有一种方法可以对抗这种表面性遗忘的问题！\n\
  \n***\n\n注意\n\n要在 JavaScript 脚本中包含注释，请在每行注释的开头放置 `//`。（JavaScript 注释不需要闭合标签）。在样式表中，用\
  \ `/*` 开始注释并用 `*/` 结束。\n\nHTML 的 `<!--` 和 `-->` 标签在脚本或样式表中无法正常工作！\n\n然而，你可以也应该在\
  \ `<script>` 或 `<style>` 标签之后包含一个 `<!--` 标签，在匹配的 `</script>` 或 `</style>` 之前包含一个\
  \ `-->` 标签。这可以向旧浏览器隐藏脚本或样式命令，否则它们会将它们视为普通内容。\n\n***\n\n#### 使用注释记录代码\n\n每当你开发一个\
  \ HTML 页面或 JavaScript 代码段时，请记住你或其他人几乎肯定需要对其进行更改。简单的文本页面通常易于阅读和修改，但带有图形、表格和其他布局技巧的复杂页面可能非常难以解析。要看看我在说什么，请在浏览器中访问几乎任何页面并查看其源代码。使用\
  \ Internet Explorer，点击“查看”菜单，然后点击“源代码”。使用 Firefox，点击“查看”菜单，然后点击“页面源代码”。你可能会看到一堆杂乱的代码，作为纯\
  \ HTML 很难解析。这可能是因为标记是由内容管理系统动态生成的。也可能因为其人工维护者没有关注结构、易读性、代码注释以及其他让人类可读代码的方法。为了维护你自己的页面，我鼓励你对\
  \ HTML 标记施加更多的秩序。JavaScript 也是如此：正确的缩进是你（以及你未来的开发伙伴）的好伙伴。\n\n***\n\n提示\n\n注释的一个方便用法是隐藏网页中当前正在建设的区域。与其让文本和图形可见并解释它们正在建设中，你可以在不需要显示的\
  \ HTML 周围放置一些开启和闭合注释标签，将其完全从视图中隐藏。这是你逐步开发页面部分的一种极佳方法，并在完成后向世界展示最终结果。\n\n***\n\n\
  正如你在书的多个章节中看到的那样，你可以将写给你或合作者的注释封装在 `<!--` 和 `-->` 标签之间。这些注释在通过浏览器查看网页时不会显示，但任何通过文本编辑器查看\
  \ HTML 代码或通过浏览器的“查看源代码”（或“查看页面源代码”）功能的人都可以阅读。下面的示例提供了一个小复习，以展示如何编写注释：\n\n```\n<!--\
  \ 这张图片需要每天更新。 -->\n\n<img src=\"headline.jpg\" alt=\"Today's Headline\" />\n```\n\
  \n\n\n正如这段代码所示，`<img />` 标签之前的注释提供了关于该图像如何使用的线索。当有人阅读这段代码时，他会立即知道这是一个必须每天更新的图像。浏览器会完全忽略注释中的文本。\n\
  \n***\n\n## 动手尝试：为你的代码编写注释\n\n现在花时间检查你到目前为止创建的所有网页、脚本和样式表是非常值得的，并为其添加任何你或他人在未来修改时可能认为有帮助的注释。操作方法如下：\n\
  \n1. 在实现某些花哨格式或布局技术的标签之前，添加一条注释解释其内容。\n2. 在 `<img />` 标签之前使用注释，简要描述任何功能通过 `alt`\
  \ 消息无法直观表现出的重要图形。\n3. 考虑使用一条注释（或几条注释）来总结 `<table>` 中的单元格在视觉上是如何组合在一起的。\n4. 如果你使用了十六进制颜色代码（例如\
  \ `<div style=\"color: #8040B0\">`），请插入注释说明该颜色的实际颜色（蓝紫色）。\n5. 在 JavaScript 函数附近放置注释，解释该函数的作用。\n\
  6. 缩进你的注释以帮助它们脱颖而出，并使注释以及 HTML 或 JavaScript 代码更易读。不要忘记在 HTML 和 JavaScript 内部也使用缩进来提高可读性，我们将在下一节中讨论。\n\
  \n***\n\n## 为了清晰而缩进代码\n\n我有一个坦白。在整本书中，我一直在没有声张的情况下仔细地向你灌输一种 HTML 代码开发风格。现在是时候揭开真相了。你无疑注意到书中所有\
  \ HTML 代码的缩进有一个一致的模式。具体来说，每个子标签都比其父标签向右缩进了两个空格。此外，跨越多行的标签内的内容在标签内部也进行了缩进。\n\n学习缩进价值的最佳方法是看一些没有缩进的\
  \ HTML 代码。你知道那句歌是怎么唱的——“失去之前，你才不知道自己拥有什么”。不管怎样，这里有一个没有任何缩进编写的简单表格：\n\n```html\n\
  <table>\n<tr><td>单元格一</td><td>单元格二</td></tr>\n<tr><td>单元格三</td><td>单元格四</td></tr>\n\
  </table>\n```\n\n```.\n\n这段代码不仅没有缩进，表格内部的行和列之间也没有分界。现在将这段代码与下面的代码进行比较，后者描述的是同一个表格：\n\
  \n```html\n<table>\n  <tr>\n    <td>单元格一</td>\n    <td>单元格二</td>\n  </tr>\n  <tr>\n\
  \    <td>单元格三</td>\n    <td>单元格四</td>\n  </tr>\n</table>\n```\n\n这段深度缩进的代码显而易见地展示了如何通过\
  \ `<tr>` 和 `<td>` 标签划分行和列。\n\n***\n\n### 提示\n\n如果你正与他人一起工作，或者计划与他人合作开发网页，你应该考虑聚在一起制定一种一致的编码风格。这样大家就能达成共识（这里用了一个双关语，意为“大家在同一个页面上”）。\n\
  \n***\n\n在让你的 HTML 代码具有易读性和可维护性方面，一致的缩进可能比注释更重要。而且你不必认同这种特定的缩进策略。如果你倾向于使用三个或四个空格而不是两个，没问题。如果你想更紧凑一些，不对标签内的内容进行缩进，那也行。从中获得的最重要的一是：要开发你自己的编码风格，然后无情地坚持下去。\n\
  \n## 关于版本控制\n\n如果你用过 Google Docs，你就遇到过某种形式的版本控制；在 Google Docs 中，Google 会在你打字时自动保存你的工作修订版本。这与简单的自动保存工作不同（尽管它确实也会这样做），因为你可以恢复到过程中的任何修订版本。你可能在使用流行的博客写作软件（如\
  \ Blogger 或 WordPress）或甚至在编辑 wiki 时遇到过这个概念——这两者都允许用户修改其工作，而不会覆盖（从而不会永久删除）之前的工作内容。\n\
  \n你可能会想：“嗯，这和代码有什么关系？你谈论的是文档。”答案很简单：就像你可能想恢复到文章或信件的之前的版本一样，你也可能想恢复到代码的之前的版本。这可能是因为你执行了一个好主意直到最后，结果证明它是不可行的，但你不想完全从头开始——只需回到修订路径上的某一点。\n\
  \n版本控制不仅仅是修订历史。当你开始使用版本控制系统来维护代码时，你会听到这些术语：\n\n- **Commit/check-in（提交）和 checkout（检出）**——当你将一个对象放入代码仓库时，你正是在提交该文件；当你检出一个文件时，你正将其从仓库（存储了所有当前和历史版本的地方）中取出并进行处理，直到你准备好再次提交或检出该文件。\n\
  - **Branch（分支）**——你受版本控制的文件可以在任何一点进行分支或分叉，从而创建两个或多个开发路径。假设你想尝试一些新的显示布局或表单交互，但不想让现有网站出现。\n\
  - **Change/diff（更改/差异）**——这只是在版本控制下进行的修改的术语。你可能还会听到将 diff 用作动词使用，例如“我 diff 了这些文件”，指代比较两个版本的动作。（这里\
  \ 中有一个名为 `diff` 的底层命令。）\n\n版本控制的术语远不止于此，但如果你能理解仓库（repository）、本地工作副本（working copy）以及提交和检出的过程，你就为你的对象实现版本控制迈出了一步。\n\
  \n### 使用版本控制系统\n\n尽管有多种不同的版本控制系统可以使用——有些是免费开源的，有些是私有的——但最流行的两个系统是 Subversion ([`subversion.apache.org`](http://subversion.apache.org))\
  \ 和 Git ([`git-scm.com`](http://git-scm.com))。如果你有一个允许你安装 Subversion 的网络托管服务，你可以创建自己的仓库并使用\
  \ Subversion 客户端连接到它。\n\n但一种日益流行的工具是 Git，它是一种去中心化的版本控制方法，并为想要开始使用仓库但不一定需要所有额外安装和维护开销的用户提供了许多工具和托管选项。Git\
  \ 仓库的一种托管选项是 GitHub ([`github.org`](http://github.org))，它允许用户创建账户并免费存储和维护代码仓库（只要它们是开源的），同时也为想要维护私有代码仓库的用户提供付费解决方案。\n\
  \n对于任何想要开始版本控制的人，我推荐 Git 和 GitHub，因为它们相对易用且提供了免费的跨平台工具。GitHub 帮助网站是一个很好的起点：[`help.github.com/`](http://help.github.com/)。拥有\
  \ GitHub 账户的另一个额外好处是可以使用 Gist ([`gist.github.com`](http://gist.github.com))，这与他人分享代码片段（或整个页面）的方法，而这些片段本身就是\
  \ git 仓库，因此拥有版本控制并可以分叉。GitHub 仓库（包括 Gist）都是对工作进行版本控制的极佳方式。\n\n\n\n\n本章为你提供了许多示例和解释，帮助你将网页组织成一个连贯的、信息丰富的、具有吸引力且易导航的站点。网络用户在期待设计良好的网站方面已经变得非常精明，如果他们体验到设计糟糕且难以导航的网站，他们会迅速离开你的站点。\n\
  \n本章还讨论了通过添加注释和缩进来使代码易于维护的重要性。注释不仅在你日后重新查看代码时作为你的提醒，而且当其他人继承你的代码时也可以起到说明书的作用。缩进看起来像是一个美学问题，但它确实可以帮助你一眼就能快速分析并理解网页的结构。由于你可能很快就需要代码管理工具（无论是为了你自己，还是为了你以及小组中的其他开发人员），因此我们向你介绍了版本控制中的一些概念。版本控制让你能够在不丢失稳固的生产级质量工作的情况下进行创新，并为其他开发者在你的代码库工作提供了更多机会。\n\
  \n## Q&A\n\n**Q. 我见过有些页面要求观众在继续访问主页之前更改浏览器窗口宽度或调整其他设置。他们为什么要这样做？**\n\n**A.** 一个尖酸的回答是，网站创建者根本不在乎他们的用户。永远不要强迫用户执行与他们目前浏览器操作不同的操作，特别是千万、千万不要自动调整浏览器大小。这些是最大的易用性大忌之一。当网站要求你更改设置时，是因为网站创建者认为，如果他们获得对用户窗口大小或字体的特定控制权，他们就能提供更好的展示效果。当然，在被要求更改设置时，很少有人去这样做（尽管他们不应该这样做），所以这些网站通常看起来很奇怪或不可读。你通过使用在本书中学习的技巧来让你的站点在任何窗口大小和各种浏览器设置下都保持可读和吸引力会好得多。你的站点组织得越好，对访问者来说可用性就越高。\n\
  \n**Q. 大量的注释和空格会让别人查看我的页面时加载速度变慢吗？**\n\n**A.** 与其他更庞大的网页资源（如图像和多媒体）相比，页面中少量的额外文本的大小是可以忽略不计的。此外，较慢的拨号调制器连接在传输文本时通常能很好地压缩文本，因此添加空格来格式化\
  \ HTML 通常不会改变传输时间。你必须输入数百个注释单词才会导致页面加载额外延迟一秒。请记住，对于现在许多人拥有的宽带连接（电缆、DSL 等），文本传输极快。是图形让页面变慢，所以请尽可能压缩你的图像，但请尽情使用文本注释。\n\
  \n## Workshop\n\n工作坊包含了测验题和活动，帮助你巩固对所涵盖内容的理解。在查看随后的`Answers`部分之前，尝试回答所有问题。\n\n###\
  \ Quiz\n\n**1.** 确保你的所有页面形成单一统一网站的三种方法是什么？\n\n**2.** 你的主页上应该始终包含哪两种信息？\n\n**3.**\
  \ 你想对网页的未来编辑说：“不要改这张照片，这是我唯一的永生的机会”，但你不想查看页面的用户看到这条信息。你该如何做？\n\n### Answers\n\n\
  **1.** 使用一致的背景、颜色、字体和样式。在链接指向的页面顶部重复相同的链接词或图形。在站点的每个页面上重复相同的微型标题、按钮或其他元素。\n\n**2.**\
  \ 使用足够的标识信息，让用户能够立即看到站点名称及其涵盖的主题。此外，无论你想传达给目标受众的最重要的信息是什么，都要直接、简洁地陈述。无论是你的使命宣言还是注册了商标的营销口号，都要确保它在这里显眼可见。\n\
  \n**3.** 在 `<img />` 标签之前立即放置以下注释：\n\n```html\n<!-- Don't change this image of me.\n\
  \n     It's my only chance at immortality. -->\n```\n\n### Exercises\n\n- 拿一支铅笔（老式那种），将你的网站画成一堆带有箭头的的小矩形。通过在文本的地方画波浪线，在图像的地方画涂鸦，勾勒出每个页面看起来像样的粗略概述。每个箭头都应该从一个涂鸦图标开始，该图标与箭头指向的页面的导航按钮对应。即使你拥有最新最花哨的网站管理工具（这些工具通常比创建网站本身还要花精力），通过手绘你的站点也可以让你更直观地理解站点上的哪些页面容易访问，以及相邻页面的布局将如何协作——而这一切在你投入时间编写实际\
  \ HTML 来连接页面之前就完成了。信不信由，当我第一次设计网站时，仍然是这样画的。有时候，铅笔和纸是无法取代的！\n\n- 打开构成你当前网站的 HTML\
  \ 文件，并检查它们所有的注释和代码缩进。是否有某些区域需要向未来可能查看它的人解释代码？如果是，请添加说明性注释。对你来说判断代码的层级结构困难吗？是否很难看到标题和章节？如果是，缩进你的\
  \ HTML，使结构与层级关系匹配，从而让你能够快速跳转到该章节。\n\n\n\n\n\n-   有人告诉他们相关信息并给了他们地址；他们直接将该地址输入到网络浏览器中。\n\
  -   他们通过他人的网站、链接、诸如 `Digg` 或 `Reddit` 这样的聚合器和推荐服务，或者通过 `Facebook`、`Twitter` 或 `Google+`\
  \ 等社交网络网站上的链接或提到跳转到你的网站。\n-   他们在驱动 `Google`、`Bing` 或 `Yahoo!` 等搜索引擎的数据库中发现了你网站的索引。\n\
  \n你只需要花一点时间和精力就可以增加你网站的流量。要增加通过口碑了解你的人数，嗯，那就用好你的嘴——以及你所拥有的其他通信渠道。如果你有现有的联系人数据库或邮件列表，向这些人宣布你的网站。将网站地址添加到你的业务名片或公司宣传册中。如果你有钱，就去买电视和广播广告来播放你的互联网地址。简而言之，做营销该做的事。老式的口碑营销在互联网上仍然是最有效的方法——我们只是在网上拥有了越来越多的工具。\n\
  \n增加其他网站指向你网站的入站链接也相当简单——尽管这并不意味着不需要大量工作。如果针对你的主题有在线或纸质的专业目录，请确保你列入其中。参与社交网络，包括为你的服务或业务实施\
  \ `Facebook` 粉丝页（如果适用）。创建一个 `Twitter` 账户来发布新闻并与客户联系——再次，如果这适用于你的在线形象的话。进入你的客户可能出现的空间，例如评论你特定感兴趣主题的博客，并参与这些社区。这并不是说你应该找一个关于你主题或服务的论坛，并向其用户发送指向你网站的垃圾链接。要作为你所在领域的专家，提供建议和推荐，并附上你自己的网站\
  \ URL。关于这一点，在本章中我没什么说的可以帮到你，除了去执行。\n\n## Note\n\n一个非常流行、高流量且受尊敬的网站（由于其准确性和增值），提供了针对商业用户在社交空间互动技巧，是\
  \ `Mashable`：`[`www.mashable.com/`](http://www.mashable.com/)`。\n\n## 搜索引擎\n\n我能帮助你的主要事情是确保你的内容被搜索引擎正确地收集和索引。可以合理假设，如果你的内容不在\
  \ `Google` 的数据库中，你就有麻烦了。\n\n搜索引擎本质上是巨大的数据库，它们索引互联网上尽可能多的内容——包括视频和其他富媒体。它们使用自动化处理来搜索网站，使用名为\
  \ `robots` 或 `spiders`（爬虫）的程序来搜索页面内容并构建数据库。内容被索引后，搜索引擎本身会使用非常复杂的页面排名技术，以在用户输入搜索词时确定哪些内容首先显示在第一、第二、第三等等位。\n\
  \n当搜索引擎处理用户查询时，它会寻找包含用户正在寻找的关键词和短语的内容。但并不是简单的匹配，如 `“如果此页面包含此短语，则将其作为结果返回，”`，因为内容是根据关键词和短语的频率、上下文，以及来自其他网站提供信誉的链接数量进行排名的。本章将教你几种方法，根据你提供的内容和上下文，确保你的内容能够恰当得出现在搜索引擎中。\n\
  \n## 在列出你的页面之前\n\n等一下！在你急着提交列入请求之前，请读完本章的剩余部分。否则，你将面临非常严重的问题，而且你已经错过了解决它的最佳机会。\n\
  \n为了让你理解我的意思，请想象这样一个场景：你发布了一个销售自动蟑螂平灭器的页面。我是一个有蟑螂问题的互联网用户，而且对杀虫喷剂过敏。我打开笔记本电脑，拍掉键盘上的蟑螂，登录我喜欢的搜索网站，输入\
  \ `cockroach`（蟑螂）作为搜索词。搜索引擎迅速向我展示了 10,400,000 个网页中包含 `cockroach` 一词的前 10 个。你已经提交了列入请求，所以你知道你的页面就在该列表的某处。\n\
  \n我提到过我很钱吗？我提到过两只蟑螂正在我的脚上交配吗？你甚至在我所在的地区提供当日送。你希望你的页面排在列表第 3 名还是第 8,542 名？好了，现在你明白问题了。仅仅在搜索引擎中列出是不够的——你需要努力提高排名。\n\
  \n### 在主流搜索站点列出你的页面\n\n如果你想让用户找到你的页面，你必须向每个主要的搜索站点提交请求，以索引你的页面。尽管搜索引擎会自动索引网页内容，但这是确保你的网站在这些站点上存在的最佳方式。这些网站中的每一个都有一个表格供你填写\
  \ URL 地址、网站简要描述，在某些情况下，还有与你的列入应关联的类别或关键词列表。这些表格很容易填写；你可以在一小时内完成所有表格，并留出时间在你可能发现的一两个专业目录中列出自己。（你是如何找到专业目录的？通过主流搜索站点，当然了！）\n\
  \n尽管在主流搜索引擎中列入既简单又快速，但可能会有点困惑：每个搜索引擎都使用不同的术语来标识你应该点击哪里注册你的页面。以下列表可能会减少你一些烦恼；它包含了一些热门搜索引擎的地址，以及注册时点击的精确字样：\n\
  \n- **Google**: 访问 `[`www.google.com/addurl/`](http://www.google.com/addurl/)`，输入网站地址和简要描述，然后输入页面显示的扭曲验证文本，称为\
  \ `CAPTCHA`（全自动测试测试）。然后点击 Add URL 按钮将网站添加到 Google。\n- **Yahoo! Search**: 访问 `[`siteexplorer.yahoo.com/submit`](http://siteexplorer.yahoo.com/submit)`，点击\
  \ Submit a Website or Webpage，输入网站地址，然后点击 Submit。\n- **Bing**: 访问 `[`www.bing.com/docs/submit.aspx`](http://www.bing.com/docs/submit.aspx)`，输入验证文本，输入网站地址，然后点击\
  \ Submit URL。\n- **AllTheWeb**: AllTheWeb 的搜索结果由 `Yahoo!` 提供，所以请确保你向 `Yahoo!` 提交你的网站，如前所述。\n\
  - **AltaVista**: AltaVista 的搜索结果也由 `Yahoo!` 提供，所以请确保你向 `Yahoo!` 提交你的网站，如前所述。\n\n\
  ## Tip\n\n有些网站提供一个表单，可以自动提交到所有主流搜索引擎，以及几个次要搜索引擎。这些网站——例如 `[`www.scrubtheweb.com/`](http://www.scrubtheweb.com/)`、`[`www.submitexpress.com/`](http://www.submitexpress.com/)`\
  \ 和 `[`www.hypersubmit.com/`](http://www.hypersubmit.com/)`——是试图向你推销高级服务的常见示例，该服务会将你列入许多其他目录并进行索引。根据你的目标受众，这些服务可能有用也可能没有，但我强烈建议你直接访问右侧的主流搜索站点并使用它们的表单提交你的列入请求。这样你可以确保准确地回答问题（每个站点的问题略有不同），并且确切你的网站列表在每个搜索引擎中如何显示。\n\
  \n\n\n\n\n# 为搜索引擎提供提示\n\n事实是：你无法做任何事情来保证你的网站一定会出现在任何主流搜索引擎对某个特定单词或短语的搜索结果前 10 名（除非从该搜索引擎网站购买广告位除外）。毕竟，如果真的有这样的保证，那么其他所有想在列表上排名第一的人为什么不能也做到呢？你能做的是避免排在列表最后，并为自己争取一个与其他人一样好的机会来获得第一名；这被称为\
  \ SEO，或搜索引擎优化，即通过优化页面的内容和结构，让搜索引擎相对于其他页面更青睐你的页面。\n\n每个搜索引擎都使用不同的方法来确定哪些页面可能最相关，因此应该被排在搜索结果列表的前端。不过，你不需要过于纠结于这些差异，因为它们都使用了某些相同基础标准的组合。以下列表几乎包含了任何搜索引擎在尝试评估哪些页面最匹配一个或多个关键词时会考虑的所有因素：\n\
  \n* 关键词是否出现在页面的 `<title>` 标签中？\n* 关键词是否出现在页面的前几行？\n* 关键词是否出现在页面的 `<meta />` 标签中？\n\
  * 关键词是否出现在页面的 `<h1>` 标题中？\n* 关键词是否出现在页面的文件名和图像的 `alt` 文本中？\n* 网站内部有多少个页面链接到该页面？\n\
  * 其他网站中有多少个页面链接到该页面？又有多少个页面链接到这些页面？\n* 用户曾多少次从之前的搜索结果列表中选择过此页面？\n\n## 注意\n\n一些过度狂热的网页作者会在页面上重复几十次甚至上百次同一个单词，有时使用小字号或难以察觉的颜色，以便在用户每当搜索该单词时，搜索引擎都能将该页面置于列表顶端。这种做法被称为搜索引擎垃圾邮件（search\
  \ engine spamming）。\n\n不要尝试这种事情——所有主流搜索引擎都了解这种做法，并会立即从其数据库中删除任何因可疑模式重复相同单词或词组而触发垃圾邮件检测器的页面。在内容的自然流中，页面上出现几次重要的搜索词仍然是没问题的（而且非常有益的）。但是，请务必在正常的句子或短语中使用这些词汇——这样“垃圾邮件警察”就不会打扰你。\n\
  \n显然，提高排名所能做的最重要的事情是考虑你的目标受众最可能输入的关键词。我建议你不要关注像 `food` 这样常见的单词搜索；它们生成的列表通常非常长，尝试挤进前列就像买彩票一样。相反，请关注不常用的单词以及两个三个单词的组合，这些组合最可能表明与你的主题相关（例如，使用\
  \ `Southern home-style cooking` 而不仅仅是 `food`）。确保这些术语和短语在你的页面上出现几次，并把最重要的词放在 `<title>`\
  \ 标签以及第一个标题或介绍段落中。\n\n在上面列出的所有搜索引擎评估标准中，`<meta />` 标签的使用可能是最不被理解的。有些人对 `<meta />`\
  \ 标签推崇备至，仿佛使用它们就能让你跳到每个搜索列表的顶部。另一些人则认为 `<meta />` 标签无效无用。这两种极端都不是正确的。\n\n`<meta\
  \ />` 标签是一个通用标签，你可以将其放在任何文档的 `<head>` 部分，以指定某些不属于 `<body>` 文本的页面信息。大多数搜索引擎通过查看 `<meta\
  \ />` 标签来获取你页面的简短描述以及一些用于识别你页面主题的关键词。例如，你的自动压蟑子器订单表单可能包含以下两个标签：\n\n```html\n<meta\
  \ name=\"description\" content=\"Order the SuperSquish cockroach flattener.\" />\n\
  <meta name=\"keywords\" content=\"cockroach,roaches,kill,squish,supersquish\" />\n\
  ```\n\n## 警告\n\n始终将 `<meta />` 标签放置在 `<head>`、`<title>` 和 `</title>` 标签之后，但在闭合的\
  \ `</head>` 标签之前。\n\n根据 XHTML 标准，`<title>` 必须是每个文档 `<head>` 部分的第一个标签。\n\n示例中的第一个标签确保搜索引擎拥有准确的页面描述，以便展示在它的搜索结果列表中。第二个\
  \ `<meta />` 标签会在你指定的任何关键词包含在搜索查询时，略微提高你的页面在列表中的排名。\n\n在任何希望被搜索引擎索引的页面中，都应该包含带有\
  \ `name=\"description\"` 和 `name=\"keywords\"` 属性的 `<meta />` 标签。这样做可能对你在搜索列表中的排名没有显著影响，并不是所有的搜索引擎都会寻找\
  \ `<meta />` 标签，但它终会有帮助。\n\n### 提示\n\n撇开之前的蟑子例子不谈，搜索引擎专家建议 `<meta />` 标签中页面描述的理想长度在\
  \ 100 到 200 个字符之间。对于关键词，推荐的长度在 200 到 400 个字符之间。专家还建议不要在关键词之间浪费空格，这在蟑子例子中显而易见。最后，不要在关键词的多个短语中疯狂地重复相同的关键词——某些搜索引擎会惩罚你。\n\
  \n为了给你提供一个如何改进搜索结果的具体示例，请考虑 `28.1` 中的页面。\n\n## 列表 28.1 一个在期间可见度的页面\n\n```html\n\
