  \ (Wait, I should re-examine the `frame` section)\n\n以下是翻译后的文本：\n\n[content]\n###\
  \ Using JavaScript Objects for Frames\nWhen a window contains multiple frames, each\
  \ frame is represented in JavaScript by a `frame` object. This object is equivalent\
  \ to a `window` object, but it is used for dealing specifically with that frame.\
  \ The `frame` object’s name is the same as the `NAME` attribute you give it in the\
  \ `<frame>` tag.\n\nRemember the `window` and `self` keywords, which refer to the\
  \ current window? When you are using frames, these keywords refer to the current\
  \ frame instead. Another keyword, `parent`, enables you to refer to the main window.\n\
  \nEach frame object in a window is a child of the `parent` window object. Suppose\
  \ you define a set of frames using the following HTML:\n\n```html\n<frameset rows=\"\
  *,*\" cols=\"*,*\">\n  <frame name=\"topleft\" src=\"topleft.html\">\n  <frame name=\"\
  topright\" src=\"topright.html\">\n  <frame name=\"bottomleft\" src=\"botleft.html\"\
  >\n  <frame name=\"bottomright\" src=\"botright.html\">\n</frameset>\n```\n\n###\
  \ Note\nIf you use nested framesets, things are a bit more complicated. `window`\
  \ still represents the current frame, `parent` represents the frameset containing\
  \ the current frame, and `top` represents the main frameset that contains all the\
  \ others.\n[/content] (Wait, I noticed I only translated the second half of the\
  \ provided text. Let me re-translate the **entire** text as requested.)\n\n---\n\
  \n---\n\n**重新翻译的完整文本：**\n\n[content]\n当你在 `<frame />` 标签中使用 `name` 属性为框架指定一个唯一的名称时，框架的真正威力开始显现。你现在就可以通过使用\
  \ `<a>` 标签中的 `target` 属性，让页面上的任何链接都去改变该框架的内容。例如，Listing 20.6 包含了以下标签：\n\n```html\n\
  <frame src=\"home.html\" name=\"main\" />\n```\n\n这段代码在页面加载时会在框架中显示 [`home.html`](http://home.html)\
  \ 页面，并将该框架命名为 \"main\"。\n\n### 注意\n技术上来说，`name` 标签已经过时，并已被 `id` 标签所取代。\n\n然而，在识别作为目标的框架时，目前的网页浏览器仍然依赖\
  \ `name` 而不是 `id`，且 `name` 的使用在 XHTML 中仍然是有效的。因此，目前在识别框架时，你需要坚持使用 `name` 属性。当然，同时使用这两个属性也无益处。\n\
  \n在顶部框架的代码中（显示在 Listing 20.7 中），你将看到以下链接：\n\n```html\n<a href=\"services.html\"\
  \ target=\"main\">SERVICES</a>\n```\n\n当用户点击此链接时[`services.html`](http://services.html)将在名为\
  \ `main` 的框架（下方框架）中显示。如果漏掉了 `target=\"main\"` 属性，[`services.html`](http://services.html)\
  \ 页面将显示在当前（顶部）框架中。\n\n### 修改框架边界\n你可以在框架代码中使用一些 HTML 属性来消除框架分割线、通过缩小边距大小为小框架留出更多空间，并强制框架不显示滚动条。Listing\
  \ 20.8 显示了 Listing 20.4 代码的修改版本。对代码的两个更改是在 `<frame>` 标签中添加了以下属性：`scrolling=\"no\"\
  ` 和 `frameborder=\"0\"`。\n\nListing 20.8 图 20.6 所示网站的 Frameset 文档\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.0 Frameset//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html\
  \ xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Sample\
  \ Framed Site</title>\n  </head>\n  <frameset rows=\"50,*\">\n    <frame src=\"\
  top.html\" name=\"top\" scrolling=\"no\" frameborder=\"0\" />\n    <frame src=\"\
  home.html\" name=\"main\" scrolling=\"no\" frameborder=\"0\"/>\n    <noframes>\n\
  \      <body>\n        <h1>Sample Framed Site</h1>\n        Your browser does not\
  \ support frames. Sorry!\n      </body>\n    </noframes>\n  </frameset>\n</html>\n\
  ```\n\n**图 20.6** 这是该页面，在 `<frame />` 标签上添加属性后，其代码如 Listing 20.8 所示。\n\n![image](img/20fig06.jpg)\n\
  \n### 使用 JavaScript 对象处理框架\n当一个窗口包含多个框架时，每个框架在 JavaScript 中都由一个 `frame` 对象表示。该对象等同于\
  \ `window` 对象，但它专门用于处理该框架。`frame` 对象的名称与你在 `<frame>` 标签中赋予它的 `NAME` 属性相同。\n\n还记得指向当前窗口的\
  \ `window` 和 `self` 关键字吗？当你使用框架时，这些关键字将指向当前框架。另一个关键字 `parent` 允许你引用主窗口。\n\n窗口中的每个框架对象都是\
  \ `parent` 窗口对象的子级对象。假设你使用以下 HTML 定义了一组框架：\n\n```html\n<frameset rows=\"*,*\" cols=\"\
  *,*\">\n  <frame name=\"topleft\" src=\"topleft.html\">\n  <frame name=\"topright\"\
  \ src=\"topright.html\">\n  <frame name=\"bottomleft\" src=\"botleft.html\">\n \
  \ <frame name=\"bottomright\" src=\"botright.html\">\n</frameset>\n```\n\n### 注意\n\
  如果你使用嵌套的 frameset，情况会复杂一些。`window` 仍然代表当前框架，`parent` 代表包含当前框架的 frameset，而 `top`\
  \ 代表包含所有其他框架的主 frameset。\n\n\n\n\n内联框架（Inline frames）通常用于从其他网站引入内容。常见用途包括从第三方广告服务向用户投放广告，以及使用\
  \ Google 站点搜索向您的用户显示搜索结果（利用 Google 的搜索技术）。图 20.8 展示了一个使用 `<<iframe>>` 将搜索结果拉取到自定义网站模板中的实例。\n\
  \n**图 20.8** 使用 `<<iframe>>` 显示 Google 自定义搜索结果。\n\n![image](img/20fig08.jpg)\n\n\
  在图 20.8 中，白色区域内的所有内容实际上都是 `<<iframe>` 中的内容，其源文件是 Google 网站上的一个脚本，该脚本运行并在 Digital\
  \ Inspiration 网站的模板内显示内容。如果你仔细观察图 20.8——我不认为你能在图中看到它——你可以看到实际 `<iframe>` 本身周围有一圈浅灰色的边框。\n\
  \n与你在本章稍后学习的 `<frame />` 不同，`<iframe>` 将长期存在，并且仍然是 HTML5 的组成部分。\n\n## 总结\n\n在本章中，你学习了如何使用\
  \ `window` 对象来处理浏览器窗口，并使用了它的属性和方法来设置超时和显示对话框。你还学习了 JavaScript 如何与框架化文档工作。\n\n至于框架文档本身，你学习了如何通过将浏览器窗口拆分为框架来同时显示多个页面。你学习了如何使用\
  \ frameset 文档来定义框架的大小和布局，以及哪些网页内容将加载到每个框架中。你学习了如何创建链接，在保持其他框架不变的同时，更改你选择的任何框架的内容。你还学习了一些控制框架中可调整的边框和滚动条外观的可选设置。最后，你学习了如何使用内联框架显示来自你的网站或其他网站的内容。\n\
  \n表 20.1 总结了本章涵盖的标签和属性。\n\n表 20.1 第 20 章 涵盖的 HTML 标签和属性\n\n![image](img/20tab01.jpg)![image](img/20tab01a.jpg)\n\
  \n## 问答\n\n**Q. 当脚本在另一个脚本创建的窗口中运行时，它如何引用回原始窗口？**\n\n**A.** JavaScript 包含了 `window.opener`\
  \ 属性，允许你引用打开当前窗口的窗口。\n\n**Q. 当用户点击单个链接时，我如何同时更新两个框架？**\n\n**A.** 你可以通过使用事件处理程序并包含两个将\
  \ URL 加载到不同框架的语句来实现。\n\n**Q. 我同时在一个框架中显示其他用户的网页，在另一个框架中显示自己的页面吗？如果那些其他网站也使用框架呢？**\n\
  \n**A.** 你可以将从互联网（或内网）任何地方获取的任何文档加载到框架中。如果该文档是 frameset，它的框架将将调整大小以适应你加载它的那个现有框架。\n\
  \n例如，你可以在一个框架中放入你喜欢的链接列表，并使用单独的框架显示这些链接指向的页面。这可以轻松提供指向其他网站的链接，而不用担心有人会迷路永远不再回到你的网站。\n\
  \n你还应该意识到，将别人的页面框架化使其看起来像是你自己网站的一部分可能会让你陷入法律麻烦，因此请务必从你计划放在框架之一中的任何人那里获得显式书面许可（就像你将他们网站的图像或文本放在你自己的页面上一样）。\n\
  \n## 工作坊\n\n工作坊包含测试题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n**1.**\
