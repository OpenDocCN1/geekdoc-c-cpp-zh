  \ 9.3 所示，颜色块的 `  ..          .... .. 所示：\n\n```css\nmargin:0px 0px 0px 0px;\n```\n\
  \n\n\n\n\n```html\n\"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>Color Blocks</title>\n\
  \    <style type=\"text/css\">\n      body {\n        margin:0px;\n      }\n   \
  \   div {\n        width:250px;\n        height:100px;\n        border:5px solid\
  \ #000000;\n        color:black;\n        font-weight:bold;\n        margin:25px;\n\
  \      }\n      div#d1 {\n        background-color:red;\n        text-align:center;\n\
  \        padding:15px;\n      }\n      div#d2 {\n        background-color:green;\n\
  \        text-align:right;\n        padding:25px 50px 6px 6px;\n      }\n      div#d3\
  \ {\n        background-color:blue;\n        text-align:left;\n        padding:6px\
  \ 6px 6px 50px;\n      }\n      div#d4 {\n        background-color:yellow;\n   \
  \     text-align:center;\n        padding:50px;\n      }\n    </style>\n  </head>\n\
  \  <body>\n    <div id=\"d1\">DIV #1</div>\n    <div id=\"d2\">DIV #2</div>\n  \
  \  <div id=\"d3\">DIV #3</div>\n    <div id=\"d4\">DIV #4</div>\n  </body>\n</html>\n\
  ```\n\n* * *\n\n你应当立刻意识到这个例子中有些不对劲。所有的颜色块本应该是 250 像素宽、100 像素高。图 9.6 中的颜色块并不均匀，因为尽管我们努力控制\
  \ `<div>` 的大小，但稍后应用的 `padding` 覆盖了初始的尺寸声明。\n\n如果你将文本放置在 `<p>` 元素中并给该元素设置白色背景（参见图\
  \ 9.7），你就可以看到 `padding` 相对于文本的位置。当空间不足以使用所有定义的 `padding` 时，周围元素必须进行调整。你将在第 10 章“理解\
  \ CSS 盒模型与定位”中详细学习这种效果。\n\n**图 9.7** 显示了相对于文本的 `padding`。\n\n![image](img/09fig07.jpg)\n\
  \n你在 Web 设计中使用 CSS 进行的大多数“微调”或“调整”都与外边距（margins）和 `padding` 有。只需记住：margin 在元素外部，`padding`\
  \ 在元素内部。\n\n### 保持一切对齐\n\n由于网页上的内容并不总是填满显示它的矩形区域的整个宽度，因此控制内容的对齐通常很有帮助。即使矩形区域内的文本延伸到多行，对齐仍然会发挥作用，因为你可能希望文本左对齐、右对齐或居中对齐。有两个样式属性允许你控制元素的对齐：`text-align`\
  \ 和 `vertical-align`。\n\n你已经在第 8 章“色彩与多媒体处理](#ch08.html_ch08)”看到了这些样式属性的应用示例——对齐图像，但再次提到这些属性也无妨，因为对齐在整体设计中也起着作用。\n\
  \n作为回顾，使用 `text-align` 可以在边界区域内水平对齐元素，可以设置为 `left`、`right` 或 `center`。`vertical-align`\
  \ 属性与 `text-align` 类似，但用于垂直对齐元素。`vertical-align` 属性指定元素如何与其父元素或在某些情况下与当前元素行对齐。当前行指的是出现在同一个父元素内的元素的垂直位置——换句话说就是行内元素。如果多个行内元素出现在同一行，你可以设置它们的垂直对齐方式来使其垂直对齐。一个很好的例子是连续出现的图像排——`vertical-align`\
  \ 属性允许你对它们垂直对齐。\n\n以下是用于 `vertical-align` 属性的常用值：\n\n- `top`——将元素的顶部与当前行对齐\n- `middle`——将元素的中间与父元素的中间对齐\n\
  - `bottom`——将元素的底部与当前行对齐\n- `text-top`——将元素的顶部与父元素的顶部对齐\n- `baseline`——将元素的基线与父元素的基线对齐\n\
  - `text-bottom`——将元素的底部与父元素的底部对齐\n\n对齐与 margin、`padding` 以及（你将在下一节中学到的）`float` 属性结合工作，使你能够保持对设计的控制。\n\
  \n### 理解 float 属性\n\n`float` 属性是理解基于 CSS 的布局和设计的基础；它是这些元素如何组合在一起的拼图中的最后几个碎片之一。坦率地说，`float`\
  \ 属性允许在设计中移动元素，使其他元素环绕它们排列。你经常会在第 8 章中看到 `float` 与图像结合使用，但你可以在布局中让各种元素浮动。\n\n元素是水平浮动，而不是垂直浮动，因此你只需要关注两个可能的值：`right`\
  \ 和 `left`。使用时，浮动的元素会根据容器允许范围尽可能靠右或靠左。例如，如果你在一个 `<div>` 中有三个 `<div>` 向左浮动，它们将对齐在该元素的左侧，即使该元素本身是右浮动的。\n\
  \n浮动通过几个示例最易理解，所以让我们查看列表 9.3。该列表仅定义了三个矩形 `<div>` 并让它们并排（向左浮动）。\n\n列表 9.3 使用 `float`\
  \ 放置 `<div>`\n\n\n\n\n\n图 9.9 显示了使用 `float` 属性的另一种有趣可能。与列表 9.3 相比，代码中唯一的更改是将颜色块的宽度仅设为\
  \ 100 像素，将外边距缩小到 10px，并将第二个颜色块的 `float` 对齐方式改为右侧（而不是左侧）。\n\n**图 9.9** 使用浮动来放置颜色块。\n\
  \n![image](img/09fig09.jpg)\n\n然而，发生了一些非常有趣的事情。第二个颜色块现在视觉上看起来像第三个颜色块，因为它是右对齐的。第二个颜色块的\
  \ `float` 值为 `right`，所以它一直浮到了最右侧。第一个和第三个颜色块尽可能地向左浮动，无论 HTML 中的 `<div>` 代码以什么顺序出现，其代码如下：\n\
  \n```html\n<div id=\"d1\">DIV #1</div>\n<div id=\"d2\">DIV #2</div>\n<div id=\"\
  d3\">DIV #3</div>\n```\n\n浮动需要大量的练习才能习惯，尤其是当页面中还有额外的元素而不仅仅是几个颜色块时。例如，当你在加入一个基础段落时会发生什么？放置在浮动元素之后的元素将围绕该元素浮动。为了避免这种情况，请使用\
  \ `clear` 属性。\n\n`clear` 属性有五个可能的值：`left`、`right`、`both`、`none` 和 `inherit`。常用的值是\
  \ `left`、`right` 和 `both`。指定 `clear:left` 可确保左侧没有其他浮动元素，`clear:right` 可确保右侧没有其他浮动元素，依此类推。浮动和清除是在做中学会的过程，因此请在本章稍后的“工作坊”部分寻找更多场景。\n\
  \n## 总结\n\n本章向你介绍了 CSS 设计中一些最基础的样式属性：`margin`、`padding` 和 `float`。你学习了 `margin`\
  \ 属性如何控制元素外部的空间，以及 `padding` 属性如何与元素内部的空间配合。\n\n在复习了上一节课中学过的 `text-align` 和 `vertical-align`\
  \ 属性后，你学习了 `float` 属性。`float` 属性允许对元素进行特定放置，并在元素周围放置额外内容。\n\n## 问答\n\n**Q. 外边距和内边距的示例都与盒子和文本有关。我可以对图像应用外边距和内边距吗？**\n\
  \n**A.** 可以，你可以将外边距和内边距应用于任何块级元素上，例如 `<p>`、`<div>`、`<img>`、列表 `<ul>` 和 `<ol>` 以及列表项\
  \ (`<li>`) ——这只是举例。\n\n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看后面的“答案”部分之前，尝试回答所有问题。\n\
  \n#### 测验\n\n**1.** 要让两个 `<div>` 元素相互相邻，但它们之间留有 30 像素的外边距，可以在样式表中使用哪个或哪些条目？\n\n\
  **2.** 使用哪个 CSS 样式属性和值来确保内容不会出现在浮动元素的左侧？\n\n**3.** 使用什么样式表条目可以使 `<div>` 内的文本出现在距离元素顶部\
  \ 12 像素的位置？\n\n#### 答案\n\n**1.** 你可以使用几种方法。第一个 `<div>` 使用 `margin-right:15px` 样式属性，第二个\
  \ `<div>` 使用 `margin-left:15px` 样式属性。或者你也可以根据需要使用 `margin-right` 或 `margin-left`\
  \ 将全部 30 像素分配给任一 `<div>`。\n\n**2.** 在这种情况下，使用 `clear:left`。\n\n**3.** `padding-top:12px`\n\
  \n## 练习\n\n• 完全理解外边距、内边距、对齐和浮动需要练习。请使用颜色块代码或你自己的 `<div>`，练习各种各样的间距和浮动，然后再进入下一章。下一章将讨论整个\
  \ CSS 盒模型，它包含了本章讨论的各个项目。\n\n## 第 10 章。理解 CSS 盒模型和定位\n\n* * *\n\n你将在本章学到：\n\n• 如何概念化\
  \ CSS 盒模型\n• 如何定位你的元素\n• 如何控制元素的堆叠方式\n• 如何管理文本流\n\n* * *\n\n在上一章中，我提到了几次 CSS 盒模型——本章从讨论盒模型开始，并解释了你在上一章中学到的知识如何帮助你理解这个模型。通过学习盒模型，你在创建设计时就不会会抓狂头发，然后发现发现元素没有对齐，或者它们看起来有点“不对”。你会知道，在几乎所有情况下，某些东西——外边距、内边距、边框——只需要微调即可。\n\
  \n## CSS 盒模型\n\nHTML 中的每个元素都被视为一个盒子，无论是段落、`<div>`还是其他。图 10.1 是盒模型的示意图。\n\n**图 10.1**\
  \ HTML 中的每个元素都由盒模型表示。\n\n![image](img/10fig01.jpg)\n\n这里是盒模型的另一种解释，从外向内：\n\n• `margin`\
  \ 是元素外部的区域。它没有颜色；始终是透明的。\n• `border` 延伸到元素周围，位于任何 padding 的边缘。\n• `padding` 存在于内容周围，并继承内容的背景颜色。\n\
  • `content` 被 padding 包围。\n\n要知道元素的真实高度和宽度，你必须考虑盒模型的所有元素。如果你还记得上一章的例子，特别是指定 `<div>`\
  \ 宽为 250 像素、高为 100 像素，那个 `<div>` 必须变大以适应使用的内边距。\n\n你已经知道如何使用 `width` 和 `height`\
  \ 属性设置元素的宽度和高度。以下示例展示了如何定义一个宽 250 像素、高 100 像素、具有红色背景并具有黑色单像素边框的 `<div>`：\n\n```css\n\
  div {\n  width: 250px;\n  height: 100px;\n  background-color: #ff0000;\n  border:\
  \ 1px solid #000000;\n}\n```\n\n这个简单的 `<div>` 显示在图 10.2 中。\n\n**图 10.2** 这是一个简单的\
  \ `<div>`。\n\n![image](img/10fig02.jpg)\n\n如果我们定义具有相同属性的第二个元素，但添加特定尺寸的 `margin`\
  \ 和 `padding` 属性，我们开始看到元素尺寸的变化。这是因为盒模型的原因。\n\n\n\n\n第二个 `<div>` 定义如下，仅为该元素添加 10\
  \ 像素的外边距（margin）和 10 像素的内边距（padding）：\n\n```css\ndiv#d2 {\n  width: 250px;\n  height:\
  \ 100px;\n  background-color: #ff0000;\n  border: 5px solid #000000;\n  margin:\
  \ 10px;\n  padding: 10px;\n}\n```\n\n图 10.3 所示的第二个 `<div>`的高度和宽度与第一个相同，但考虑到外边距和内边距时，围绕元素本身的框的总高度和宽度要大得多。\n\
  \n**图 10.3** 这本应该是另一个简单的 `<div>`，但盒模型影响了第二个 `<div>` 的尺寸。\n\n![image](img/10fig03.jpg)\n\
  \n元素的总宽度是以下各项之和：\n\n`width + padding-left + padding-right + border-left + border-right\
  \ + margin-left + margin-right`\n\n元素的总高度是以下各项之和：\n\n`height + padding-top + padding-bottom\
  \ + border-top + border-bottom + margin-top + margin-bottom`\n\n因此，第二个 `<div>` 的实际宽度为\
  \ 300 (250 + 10 + 10 + 5 + 5 + 10 + 10)，实际高度为 150 (100 + 10 + 10 + 5 + 5 + 10 +\
  \ 10)。\n\n到目前，你已经开始理解盒模型将如何影响你的设计。假设你只有 250 像素的水平空间，但你希望在四周留有 10 像素的外边距、10 像素的内边距和\
  \ 5 像素的边框。为了在有限的空间内实现你喜要的效果，你必须将 `<div>` 的 `width` 仅为 200 像素，这样 200 + 10 + 10 +\
  \ 5 + 5 + 10 + 10 正好等于这 250 像素的可用水平空间。\n\n***\n\n### 注意\n\n在本书中，你一直在练习使用 `DOCTYPE`\
  \ 声明——所有的示例代码都包含 `DOCTYPE`。请继续这种做法，不仅是为了让你的代码通过验证，还因为 Internet Explorer 与 CSS 盒模型之间存在一个特定的问题：如果没有定义\
  \ `DOCTYPE`，Internet Explorer 将以你无意图的方式操纵元素的高度和宽度。这会导致你的布局出现浏览器兼容性问题，所以请记住包含 `DOCTYPE`。\n\
  \n***\n\n### 定位\n\n理解盒模型背后的概念固然重要，该模型的数学原理同样重要。在动态驱动的网站或客户端显示由用户交互驱动的网站（例如通过 `JavaScript`\
  \ 事件）中，你的服务器端或客户端代码可能会动态绘制并重绘容器元素。换句话说，你的代码会产生数值，但你必须提供边界。\n\n既然你已经学习了盒模型的知识，在本书的后续工作以及你的网页设计中，请始终记住这一点。除其他外，它还将影响元素定位和内容流，这正是我们将要处理的两个主题。\n\
  \n#### 关于定位的详解\n\n`Relative positioning`（相对定位）是 HTML 使用的默认定位类型。你可以将相对定位比作在棋盘上摆放棋子：棋子从左到右排列，当到达棋盘边缘时，就移动到下一行。`display`\
  \ 样式属性设置为 `block` 值的元素会自动放置在新的一行，而 `inline`（行内）元素则放置在紧邻前一个元素的同一行。例如，`<p>` 和 `<div>`\
  \ 标签被视为块元素，而 `<span>` 标签被视为行内元素。\n\nCSS 支持的另一种定位类型被称为 `absolute positioning`（绝对定位），因为它允许你设置\
  \ HTML 内容在页面上的精确位置。尽管绝对定位赋予了你精确指定元素出现位置的自由，但该位置仍然相对于页面上出现的任何父元素。换句话说，绝对定位允许你指定元素矩形区域相对于父元素区域的精确位置，这与相对定位非常不同。\n\
  \n由于可以自由地在页面的任何地方放置元素，你可能会遇到重叠问题，即一个元素占据了另一个元素空间。没有什么可以阻止你指定元素的绝对位置以让它们重叠。在这种情况下，CSS\
  \ 依赖于每个元素的 `z-index` 来决定哪个元素在上方，哪个在下方。你将在本章的晚些部分学习更多关于元素的 `z-index` 的知识。现在，让我们具体看看你是如何控制样式规则使用相对定位还是绝对定位的。\n\
  \n特定样式规则使用的定位类型（相对或绝对）由 `position` 属性决定，该属性可以取两个值之一：`relative` 或 `absolute`。在指定定位类型后，你通过以下属性提供特定位置：\n\
  \n* `left`—左侧偏移量\n* `right`—右侧偏移量\n* `top`—顶部偏移量\n* `bottom`—底部偏移量\n\n\n\n\n\n请注意图\
  \ 10.4，`<<div>` 元素是一个接一个显示的，这正是相对定位（relative positioning）所预期的。但为了让它更有趣（这也是我们在这里做的），你可以将定位更改为绝对定位（absolute），并显式地指定颜色的位置。在列表\
  \ 10.2 中，样式表条目被更改为使用绝对定位来排列颜色块。\n\n### 列表 10.2 使用绝对定位颜色块\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n\
  \ \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en\">\n <head>\n  <title>Positioning the Color Blocks</title>\n  <style\
  \ type=\"text/css\">\n    div {\n      position:absolute;\n      width:250px;\n\
  \      height:100px;\n      border:5px solid #000;\n      color:black;\n      font-weight:bold;\n\
  \      text-align:center;\n    }\n    div#d1 {\n      background-color:red;\n  \
  \    left:0px;\n      toppx;\n    }\n    div#d2 {\n      background-color:green;\n\
  \      left:75px;\n      top:25px;\n    }\n    div#d3 {\n      background-color:blue;\n\
  \      left:150px;\n      top:50px;\n    }\n    div#d4 {\n      background-color:yellow;\n\
  \      left:225px;\n      top:75px;\n    }\n  </style>\n</head>\n<body>\n  <div\
  \ id=\"d1\">DIV #1</div>\n  <div id=\"d2\">DIV #2</div>\n  <div id=\"d3\">DIV #3</div>\n\
  \  <div id=\"d4\">DIV #4</div>\n</body>\n</html>\n```\n\n此样式表将 `position` 属性设置为\
  \ `absolute`，这是样式表使用绝对定位所必需的。此外，为每个继承的 `<div>` 样式规则设置了 `left` 和 `top` 属性。然而，这些规则的每个位置的设置使得元素以相互重叠的方式显示，如图\
  \ 10.5 所示。\n\n**图 10.5** 使用绝对定位显示颜色块。\n\n![image](img/10fig05.jpg)\n\n现在我们谈论的是布局了！图\
  \ 10.5 展示了绝对定位如何让你能够将元素精确地放置在你想要的地方。它还揭示了排列元素使其相互重叠是多么简单。你可能对网页浏览器如何知道当元素重叠时应该在哪个元素上方绘制感到好奇。下一节将介绍你如何控制堆叠顺序。\n\
  \n### 控制元素的堆叠方式\n\n在某些情况下，你希望仔细控制元素在网页上相互重叠的方式。`z-index` 样式属性允许你根据元素相对于彼此堆叠的方式来设置元素的顺序。虽然\
  \ `z-index` 这个名字听起来有点奇怪，但它指的是第三维度（Z）的概念，除了横跨（X）和垂直向下（Y）屏幕的两个维度之外。另一种思考 `z-index`\
  \ 的方式是一叠杂志中单张杂志的相对位置。靠近堆叠顶部的杂志的 `z-index` 比堆叠中下方的杂志高。同样，具有较高 `z-index` 的重叠元素将显示在具有较低\
  \ `z-index` 的元素上方。\n\n`z-index` 属性用于设置一个数值，表示样式规则的相对 `z-index`。分配给 `z-index` 的数字只在相对于样式表中的其他样式规则时才有意义，这意味着为单条规则设置\
  \ `z-index` 属性并没有太大意义。另一方面，如果你为应用于重叠元素的多个样式规则设置了 `z-index`，那么 `z-index` 值值高的元素将显示在\
  \ `z-index` 值较低的元素上方。\n\n注意：无论你为样式规则设置了什么 `z-index` 值，使用该规则显示的元素始终会出现在其父元素的上方。\n\
  \n列表 10.3 包含了另一个版本的颜色块样式表和 HTML，它使用 `z-index` 来改变元素的自然重叠。\n\n### 列表 10.3 使用 `z-index`\
  \ 改变颜色块中元素的显示\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html\
  \ PUBLIC \"-//W3C//DTD XHTML 1.1//EN\"\n \"httpwww.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n<head>\n <title>Positioning\
  \ the Color Blocks</title>\n <style type=\"text/css\">\n  div {\n    position:absolute;\n\
  \    width:250px;\n    height:100px;\n    border:5px solid #000;\n    color:black;\n\
  \    font-weight:bold;\n    text-align:center;\n  }\n  div#d1 {\n    background-color:red;\n\
  \    left:0px;\n    toppx;\n    z-index:0;\n  }\n  div#d2 {\n    background-color:green;\n\
  \    left:75px;\n    top:25px;\n    z-index:3;\n  }\n  div#d3 {\n    background-color:blue;\n\
  \    left:150px;\n    top:50px;\n    z-index:2;\n  }\n  div#d4 {\n    background-color:yellow;\n\
  \    left:225px;\n    top:75px;\n    z-index:1;\n  }\n </style>\n</head>\n<body>\n\
  \  <div id=\"d1\">DIV #1</div>\n  <div id=\"d2\">DIV #2</div>\n  <div id=\"d3\"\
  >DIV #3</div>\n  <div id=\"d4\">DIV #4</div>\n</body>\n</html>\n```\n\n此代码与你在列表\
  \ 10.2 中看到的代码相比，唯一的区别是为每个编号 `div` 添加了 `z-index` 属性。注意，第一个编号 `div` 的 `z-index` 设置为\
  \ `0`，这应该使其在 `z-index` 方面处于最低，而第二个 `div` 具有最高。图 10.6 展示了使用此样式表显示的颜色块页面，清楚地展示了 `z-index`\
  \ 如何影响显示并使得仔细控制重叠成为可能。\n\n**图 10.6** 使用 `z-index` 改变颜色块的显示。\n\n![image](img/10fig06.jpg)\n\
  \n虽然示例是简单的 `<div>` 元素，但 `z-index` 样式属性可以影响任何 HTML 内容。\n\n### 管理文本流\n\n在你已经看到了一些相对于元素放置或绝对放置元素的示例之后，是时候重新审视元素周围的内容了。概念上的“当前行”是用于在页面上放置元素的无形线。这与页面上的元素流有关；当元素跨越页面和向下排列时，它就会发挥作用。元素流的一部分是页面上的文本流。当你将文本与其他元素（如图像）混合时，控制文本如何在这些其他元素周围流动是非常重要的。\n\
  \n你已经在第 9 章中看过了其中两个样式属性，“处理外边距、内边距、对齐和浮动(#ch09.html_ch09)。”以下是一些可以提供文本流控制的样式属性：\n\
  \n- `float`——确定文本如何在元素周围流动\n- `clear`——停止文本在元素周围流动\n- `overflow`——当元素太小无法包含所有文本时控制文本溢出\n\
  \n`float` 属性用于控制文本如何在元素周围流动。它可以设置为 `left` 或 `right`。这些值决定了元素相对于流动文本的位置。\n\n\n\n\n\
  \n正如你在上一章中所学习的，你可以使用 `clear` 属性来防止文本在元素旁边流动，该属性可以设置为 `none`、`left`、`right` 或 `both`。`clear`\
  \ 属性的默认值为 `none`，表示文本将自由流动，而不对元素进行任何特殊考虑。`left` 值会导致文本停止在元素周围流动，直到页面的左侧没有该元素为止。同样，`right`\
  \ 值意味着文本不会在元素的右侧周围流动。`both` 值则表示文本不会在元素的任何一侧流动。\n\n`overflow` 属性用于处理溢出文本，即无法容纳在元素矩形区域内的文本；如果你将元素的\
  \ `width` 和 `height` 设置得太小，就会发生这种情况。`overflow` 属性可以设置为 `visible`、`hidden` 或 `scroll`。`visible`\
  \ 设置会自动放大元素，使溢出文本能够包含在其中；这是该属性的默认设置。`hidden` 值保持元素的大小不变，允许溢出文本保持隐藏状态，不可可见。也许最有趣的值是\
  \ `scroll`，它会为元素添加滚动条，以便你移动并查看文本。\n\n## 总结\n\n本章从关于 CSS 盒模型的重要讨论开始，如何在考虑外边距（margins）、内边距（padding）和边框（borders）的情况下计算元素的宽度和高度。接着讨论了元素的绝对定位，然后你学习了使用\
  \ `z-index` 进行定位。你还发现了一些可以让你控制页面文本流的巧妙小样式属性。\n\n本章虽然简短，但包含了大量关于控制网站设计的基础信息。值得重读并练习示例，以便为你的工作打下良好的基础。\n\
  \n## 问答\n\n**Q. 我该如何判断何时使用相对定位，以及何时使用绝对定位？**\n\n**A.** 虽然关于相对定位和绝对定位的使用没有固定的指南，但通用观点是：只有当你想要对内容的定位进行更精细的控制时，才需要绝对定位。这是因为绝对定位允许你精确到像素地定位内容，而相对定位在内容定位方面的预测性要低得多。这并不是说相对定位不能很好地定位页面上的元素；它意味着绝对定位更加精确。当然，这使得绝对定位更容易受到屏幕尺寸变化的影响，而这些是你无法真正控制的。\n\
  \n**Q. 如果我没有指定两个重叠元素的 z-index，我如何知道哪个元素会显示在上方？**\n\n**A.** 如果重叠元素没有设置 `z-index`\
  \ 属性，则在网页中后后出现的元素将显示在上方。记住这一点的简单方法是：想象网页浏览器在读取 HTML 文档时在页面上绘制每个元素；在文档中后读取的元素会画在较先读取的元素之上。\n\
  \n## 工作坊\n\n工作坊包含测验题和练习，帮助你巩固对所涵盖内容的理解。在查看随后的“答案”部分之前，尝试回答所有问题。\n\n#### 测验\n\n**1.**\
  \ 相对定位和绝对定位之间有什么区别？\n\n**2.** 哪一个 CSS 样式属性控制元素相互重叠的方式？\n\n**3.** 你可以使用什么 HTML 代码来显示“Where\
  \ would you like to”这几个单词，使其恰好从浏览器窗口的左上角开始，并大字体显示“GO TODAY?”恰好位于角点下方 80 像素、左侧 20\
  \ 像素处？\n\n#### 答案\n\n**1.** 在相对定位中，内容根据页面流进行显示，每个元素在物理上出现在 HTML 代码中先于前一个元素之后。另一方面，绝对定位允许你设置内容在页面上的精确位置。\n\
  \n**2.** `z-index` 样式属性用于控制元素相互重叠的方式。\n\n**3.** 你可以使用以下：\n\n```html\n<span style=\"\
  position:absolute;left:0px;top:0px\">\n\nWhere would you like to\n</span>\n\n<h1\
  \ style=\"position:absolute;left:80px;top:20px\">GO TODAY?</h1>\n```\n\n## 练习\n\n\
  • 通过创建一系列不同外边距、内边距和边框的元素，练习处理 CSS 盒模型的复杂细节，并观察这些属性如何影响它们的高度和宽度。\n\n• 找到一组你喜欢的图片，并使用绝对定位甚至一些\
  \ `z-index` 值将它们排列成类似画廊的形式。尝试放置你的图片，使其形成一种设计（如正方形、三角形或圆形）。\n\n## 第 11 章 使用 CSS 更多地处理列表、文本和导航\n\
  \n* * *\n\n在本章中你将学习：\n\n• CSS 盒模型如何影响列表\n• 如何自定义列表项目指示器\n• 如何使用列表项目和 CSS 创建图像地图\n\
  • 导航列表与普通列表何不同\n• 如何使用 CSS 创建垂直导航\n• 如何使用 CSS 创建水平导航\n\n* * *\n\n在第 5 章“处理字体、文本块和列表”中，你学习了三种类型的\
  \ HTML 列表；在第 9 章“外边距、内边距和对齐”中，你学习了外边距、内边距和对齐。在本章中，你将学习如何将外边距、内边距和对齐样式应用于不同类型的 HTML\
  \ 列表，帮助你纯制作设计元素。\n\n具体而言，你将学习如何修改列表的外观——超出你在第 5 章中学习的 `list-type` 属性——以及如何使用 CSS\
  \ 样化的列表来替换你在第 8 章“颜色、图像和多媒体”中学习的客户端图像地图。你将实践已熟悉的许多 CSS 样式，并且在本章中获得的知识将直接引导你将列表用于不仅仅是展示一组项目项目。你将学习将列表作为垂直或水平导航的许多方法，包括如何使用列表创建下拉菜单。\n\
  \n本章介绍的方法只是使用列表创建众多导航方法的一个小子集。然而，所有原理都是相似的；不同的结果源于你对这些基本概念的创意应用。为了激发你的创意，我将在本章结束处提供其他\
  \ CSS 导航示例。\n\nHTML 列表复习\n\n正如你在第 5 章中所学习的，有三种基本的 HTML 列表。每种根据其类型和上下文以略有不同的方式呈现内容：\n\
  \n• *有序列表*（ordered list）是一种缩进列表，在每个列表项目前显示数字或字母。有序列表由 `<ol>` 和 `</ol>` 标签包裹，列表项目由\
  \ `<li>` 标签对包含。这种列表类型通常用于显示编号步骤或内容层级。\n\n• *无序列表*（unordered list）是一种缩进列表，在每个列表项目前显示项目符号或其他符号。无序列表由\
  \ `<ul>` 和 `</ul>` 标签包裹，列表项目由 `<li>` 标签对包含。这种列表类型通常用于提供视觉提示，显示后续将是简短但具体的信息。\n\n\n\
  \n\n\n- `definition list`（定义列表）通常用于显示术语及其含义，从而在列表本身范围内提供信息层级结构——类似于有序列表但没有编号。定义列表由\
  \ `<dl>` 和 `</dl>` 标签包裹，用 `<dt>` 和 `</dt>` 标签包裹术语，用 `<dd>` 和 `</dd>` 标签包裹定义。\n\n\
  当需要时，你可以嵌套有序和无序列表——或将列表置于其他列表中。嵌套列表会产生内容层级，因此请仅在内容确实具有你想要显示的层级结构（例如内容大纲或目录）时使用它们。或者正如你将在在本章后续部分学到的，当你的网站导航包含子导航元素时，可以使用嵌套列表。\n\
  \n***\n\n#### 注意\n\n某些旧版浏览器处理外边距（margins）和内边距（padding）的方式不同，特别是在列表和列表项周围。然而，在本书时，本书其他章节中的\
  \ HTML 和 CSS 在当前主流浏览器（Apple Safari、Google Chrome、Microsoft Internet Explorer、Mozilla\
  \ Firefox 和 Opera）中的显示效果完全相同。当然，在发布到网上之前，你仍应在所有浏览器中检查你的网页内容，但为了适应浏览器渲染特殊性而编写“黑科技”样式表的需求正在消失。\n\
  \n***\n\n### CSS 盒模型如何影响列表\n\n特定的列表相关样式包括 `list-style-image`（用于将图像作为列表项标记）、`list-style-position`（指定列表项标记的位置）以及\
  \ `list-style-type`（列表项标记本身的类型）。尽管这些样式控制着列表和列表项的结构，但你仍然可以使用 `margin`、`padding`、`color`\
  \ 和 `background-color` 样式来实现更具特定的列表显示效果。\n\n在第 9 章中，你学习了每个元素在内容和元素边界之间都有一些内边距（padding）；你还学习了元素边界与其他任何内容之间存在外边距（margin）。列表也是如此，当你对列表进行样式设计时，必须记住“列表”实际上是由两个元素组成的：父列表元素类型`<ul>`\
  \ 或 `<ol>`）和单个列表项本身。这些元素中的都有受样式表影响的外边距和内边距。\n\n本章的示例向你展示了不同的 CSS 样式如何影响 HTML 列表和列表项的视觉显示。在本章练习列表操作时，记住这些基础区别，你就能利用列表在网站导航中实现高级的视觉效果。\n\
  \nListing 11.1 创建一个包含三个项目的基本列表。在示例列表中，无序列表本身（`<ul>`）被赋予蓝色背景、黑色边框和 100 像素的特定宽度，如图\
  \ 11.1 所示。列表项（单个`<li>`）具有灰色背景和黄色边框。列表项文本和指示器（符号）为黑色。\n\n**图 11.1** 使用颜色和边框对列表和列表项进行样式设置。\n\
  \n![image](img/11fig01.jpg)\n\nListing 11.1 创建带有颜色和边框样式的基础列表\n\n***\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD\
  \ XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\">\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n    <title>List Test</title>\n\
  \    <style type=\"text/css\">\n      ul {\n        background-color: #6666ff;\n\
  \        border: 1px solid #000000;\n        width:100px;\n      }\n      li {\n\
  \        background-color: #cccccc;\n        border: 1px solid #ffff00;\n      }\n\
  \    </style>\n  </head>\n  <body>\n    <h1>List Test</h1>\n    <ul>\n      <li>Item\
  \ 1</li>\n      <li>Item 2</li>\n      <li>Item 3</li>\n    </ul>\n  </body>\n</html>\n\
  ```\n\n\n\n\n\n外部（outside）和内部（inside）列表样式位置的示例已在图 11.4 中所示。代码列表 11.1 与用于生成图 11.4\
  \ 所示示例的代码之间，唯一的区别（不包括添加到“项目 #2”和“项目 #3”中的填充文本）是：第二个列表项包含 `style=\"list-style-position:\
  \ outside;\"`，而第三个列表项包含 `style=\"list-style-position: inside;`。\n\n**图 11.4** `list-style-position`\
  \ 的 `outside` 值与 `inside` 值的区别。\n\n![image](img/11fig04.jpg)\n\n用于第二个列表项的额外填充文本展示了当列表宽度定义为不足以单行显示所有内容的值时，文本是如何换行的。即使不使用\
  \ `style=\"list-style-position: outside;\"`，也会获得相同的结果，因为在代码中没有任何显式声明的情况下，它是 `list-style-position`\
  \ 的默认值。\n\n然而，当使用“内部”位置时，你可以清楚地看到区别。在第三个列表项中，符号和文本都在黄色边界框定的灰色区域内——即列表项本身。当 `list-style-position`\
  \ 的值为 `inside` 时，外边距（Margins）和内边距（padding）对列表项的影响不同（参见图 11.5）。\n\n**图 11.5** 外边距和内边距改变了使用内部\
  \ `list-style-position` 的项的显示效果。\n\n![image](img/11fig05.jpg)\n\n在图 11.5 中，第二个和第三个列表项的\
  \ `list-style-position` 值均为 `inside`。然而，第二个列表项的 `margin-left` 值为 12 像素，而第三个列表项的\
  \ `padding-left` 值为 12 像素。尽管两个内容块（列表指示器加文本）都显示了文本环绕符号换行，且这些块在定义列表项的灰色区域内的位置是相同的，但受影响的是列表内部的列表项。\n\
  \n正如你预期的那样，`margin-left` 值为 12 像素的列表项显示出列表项周围透明外边距透出的 12 像素的红色。同样，`padding-left`\
  \ 值为 12 像素的列表项在内容开始之前显示了 12 像素的灰色背景（列表项的背景）。内边距位于元素内部；外边距位于元素外部。\n\n通过理解外边距和内边距如何影响列表项及其所属的列表，你应该能够在你的网站中创建纯\
  \ CSS 且不依赖外部图像的导航元素。在本章的后面部分，你将学习如何创建垂直和水平导航菜单以及菜单下拉。\n\n***\n\n**注意**\n\n关于用于创建\
  \ XHTML 和 CSS 图像映射的多个教程链接，请访问 [`designreviver.com/tutorials/css-image-map-techniques-and-tutorials/`](http://designreviver.com/tutorials/css-image-map-techniques-and-tutorials/)。这些教程的交互程度各不相同，某些可能会引入本书范围之外的客户端代码，但其解释非常详尽。\n\
  \n***\n\n### 使用列表项和 CSS 创建图像映射\n\n在第 8 章中，你学习了如何使用 HTML 中的 `<map/>` 标签创建客户端图像映射。图像映射允许你定义图像的一个区域并为该区域分配链接（而不是必须将图像切成若干碎片、为每个碎片应用链接并在\
  \ HTML 中将图像缝合在一起）。然而，你也可以完全通过有效的 XHTML 和 CSS 来创建图像映射。\n\n代码列表 11.2 中的代码生成了一个类似于图\
  \ 11.6 中所示的图像映射。（代码列表 11.2 中的代码并没有生成图中所示的红色边框。红色边框是添加到图中以突出显示定义的区域。）当代码在 Web 浏览器中渲染时，它看起来就像一个包含图像的网页。当你的鼠标悬停在“热点”区域时，动作就会发生。\n\
  \n**图 11.6** CSS 允许你在图像映射中定义热点。\n\n![image](img/11fig06.jpg)\n\n代码列表 11.2 使用 CSS\
  \ 创建图像映射\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE html PUBLIC\
  \ \"-//W3C//DTD XHTML 1.1//EN\"\n  \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
  >\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\">\n  <head>\n   \
  \ <title>CSS Image Map Example</title>\n    <style type=\"text/css\">\n    #theImg\
  \ {\n      width:500px;\n      height:375px;\n      background:url(tea_shipment.jpg)\
  \ no-repeat;\n      position:relative;\n      border: 1px solid #000;\n    }\n \
  \   #theImg ul {\n      margin:0px;\n      padding:0px;\n      list-style:none;\n\
  \    }\n    #theImg a {\n      position:absolute;\n      text-indent: -10em;\n \
  \   }\n    #theImg a:hover {\n      border: 1px solid #ffffff;\n    }\n    #ss {\n\
  \      top:0px;\n      left:5px;\n      width:80px;\n      height:25px;\n    }\n\
  \    #gn {\n      top:26px;\n      left:5px;\n      width:70px;\n      height:10px;\n\
  \    }\n    #ib {\n      top:225px;\n      left:85px;\n      width:60px;\n     \
  \ height:90px;\n    }\n    #iTEA1 {\n      top:100px;\n      left:320px;\n     \
  \ width:178px;\n      height:125px;\n    }\n    #iTEA2 {\n      top:225px;\n   \
  \   left:375px;\n      width:123px;\n      height:15px;\n    }\n    </style>\n \
  \ </head>\n  <body>\n    <div id=\"theImg\">\n      <ul>\n        <li id=\"ss\"\
  ><a href=\"[some URL]\" title=\"Sugarshots\">Sugarshots</a></li>;\n        <li id=\"\
  gn\"><a href=\"[some URL]\" title=\"Golden Needle\">Golden Needle</a></li>;\n  \
  \      <li id=\"ib\"><a href=\"[some URL]\" title=\"Irish Breakfast\">Irish Breakfast</a></li>;\n\
  \        <li id=\"iTEA1\"><a href=\"[some URL]\" title=\"IngenuiTEA\">IngenuiTEA</a></li>;\n\
  \        <li id=\"iTEA2\"><a href=\"[some URL]\" title=\"IngenuiTEA\">IngenuiTEA</a></li>;\n\
  \      </ul>\n    </div>\n  </body>\n</html>\n```\n\n***\n\n正如代码列表 11.2 所示，样式表表（style\
  \ sheet）有许多条目，但实际的 HTML 代码非常短。\n\n\n\n\n当用户的光标悬停在包含链接的列表项上时，该列表项会显示一个像素的实白色边框，这归功于样式表中的此条目：\n\
  \n```css\n#theImg a:hover {\n    border: 1px solid #ffffff;\n}\n```\n\n列表项本身根据图像中应的可点击区域被定义并放置在特定位置。例如，id\
  \ 为 `\"ss\"` 的列表项对应图中显示的项目名称`\"Sugarshots\"`，其左上角距离 `<div>` 顶部 0 像素，距离 `<div>` 左边缘\
  \ 5 像素。该列表项宽度为 80 像素，高度为 225 像素。对于 `\"#gn\"`、`\"#ib\"`、`\"#iTEA1\"` 和 `\"#iTEA2\"\
  ` 列表项也进行了类似的样式声明，使得与这些 ID 相关的区域出现在图像的特定位置。\n\n### 导航列表与普通列表的区别\n\n当我们谈论使用列表来创建导航元素时，我们实际上是指使用\
  \ CSS 以网站访问者期望导航外观的方式显示内容——简而言之，*不同于*简单的符号列表或编号列表。虽然一组导航元素本质上确实是链接列表，但这些链接的显示方式通常会让用户清楚地他们应该与内容进行交互：\n\
  \n• 用户的鼠标光标将改变，指示该元素是可以点击的。\n• 当鼠标悬停在元素上时，元素周围的外观会发生。\n• 内容区域在视觉上与正文隔离开。\n\n创建导航的老方法往往依赖图像——例如具有斜角边缘的图形以及对比色的背景和文本——加上\
  \ JavaScript 客户端编程来处理基于鼠标动作的图像切换。但使用纯 CSS 从列表元素创建导航可以产生更具可用性、更灵活且对搜索引擎友好的显示，方便各种类型设备的用户访问。\n\
  \n无论你的导航元素布局如何（水平或垂直），本章都讨论了两个层级的导航：一级导航和二级导航。*一级导航*引导用户进入网站主要部分的介绍页；*二级导航*反映了特定区域内的这些页面。\n\
  \n### 使用 CSS 创建垂直导航\n\n根据你的网站架构——包括你创建的显示模板以及你在网站中分类信息的方式——你可能会发现自己正在使用垂直导航作为一级导航或二级导航。\n\
  \n例如，假设你为公司创建了一个网站，主要部分有“关于我们”、“产品”、“支持”和“新闻”。在“关于我们”主部分内，你可能有几个其他页面，如“使命”、“历史”、“执行团队”和“联系我们”——这些其他页面就是“关于我们”主部分的二级导航。\n\
  \n列表 11.3 设置了一个基本的二级页面，侧边带有垂直导航，中间是内容。侧边的链接和内容区域的链接都是基础 HTML 列表元素。\n\n此列表以及图 11.7\
  \ 所示的示例为你提供了一个起点，展示 CSS 如何让你将两个相似的 HTML 结构转换为不同的视觉显示（从而产生两个不同的上下文）。\n\n**图 11.7**\
  \ 起点：未样式的列表导航。\n\n![image](img/11fig07.jpg)\n\n列表 11.3 带有列表垂直导航的 Basic 页面\n\n* *\n\
