- - '#'
  - 在制作横幅或按钮时，你需要做的决定是它们的大小。大多数访问网页的人都有一台屏幕分辨率至少为 1024×768 像素的电脑，甚至更大。例如，我的屏幕目前设置为
    1440×900 像素。通常情况下，你应该规划你的图形，使其始终能够适应较小的屏幕（1024×768），并为滚动条和边距留出空间。关键的尺寸限制是页面的水平宽度，因为水平滚动页面对于网页用户来说是一个巨大的麻烦，也是困惑的来源。垂直滚动页面的接受度要得多，所以即使你的页面比最小屏幕尺寸高，没关系。
