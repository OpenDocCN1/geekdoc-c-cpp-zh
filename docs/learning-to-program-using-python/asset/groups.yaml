    # 11.8 break and continue Statements


    Already mentioned, these two statements affect the flow control within a loop.
    When a particular condition is met, the break statement “breaks” out of the loop,
    effectively ending the loop prematurely (though in an expected manner). The continue
    statement “short circuits” the loop, causing flow control to return to the top
    of the loop immediately.


    I rarely use these statements but they are good to have when needed. They help
    ensure you don’t get stuck in a loop forever and also ensure that you don’t keep
    iterating through the loop for no good reason.


    # 11.9 try, except, finally and raise Statements


    I’ve briefly touched on some of these and will talk about them more in the Exceptions
    chapter. Briefly, try creates a block that attempts to perform an action. If that
    action fails, the except block catches any exception that is raised and does something
    about it. finally performs some last minute actions, regardless of whether an
    exception was raised or not. The raise statement manually creates an exception.


    # 11.10 import and from Statements


    These two statements are used to include other Python libraries and modules that
    you want to use in your program. This helps to keep your program small (you don’t
    have to put all the code within a single module) and “isolates” modules (you only
    import what you need). import actually calls the other libraries or modules while
    from makes the import statement selective; you only import subsections of a module,
    minimizing the amount of code brought into your program.


    # 11.11 def and return Statements


    These are used in functions and methods. Functions are used in procedural-based
    programming while methods are used in object-oriented'
