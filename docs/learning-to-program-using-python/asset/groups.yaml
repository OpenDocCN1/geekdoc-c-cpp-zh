    file.seek(12, 1) #move pointer 12 bytes from\ncurrent location\nfile.seek(-50,\
    \ 2) #move pointer 50 bytes backwards\nfrom end of file\nfile.seek(0, 2) #move\
    \ pointer at end of file\n```\n\nThe tell() method returns the current position\
    \ of the pointer within the file. This can be useful for troubleshooting (to make\
    \ sure the pointer is actually in the location you think it is) or as a returned\
    \ value for a function.\n\n## 10.7 Serialization\n\nSerialization (pickling) allows\
    \ you to save non-textual information to memory or transmit it over a network.\
    \ Pickling essentially takes any data object, such as dictionaries, lists, or\
    \ even class instances (which we'll cover later), and converts it into a byte\
    \ set that can be used to “reconstitute” the original data.\n\n![](img/d63d52373cb3bc50aa7b31d0d4a29406_76_0.png)\n\
    \n```python\n>>>import cPickle  #import cPickle library\n>>>a_list = [\"one\"\
    , \"two\", \"buckle\", \"my\", \"shoe\"]\n>>>save_file = open(\"pickled_list\"\
    , \"w\")\n>>>cPickle.dump(a_list, save_file)  #serialize\n...    list to file\n\
    >>>file.close()\n>>>open_file = open(\"pickled_list\", \"r\")\n>>>b_list = cPickle.load(open_file)\n\
    ```\n\nThere are two different pickle libraries for Python: cPickle and pickle.\
    \ In the above example, I used the cPickle library rather than the pickle library.\
    \ The reason is related to the information discussed in Chapter 2. Since Python\
    \ is interpreted, it runs a bit slower compared to compiled languages, like C.\
    \ Because of this, Python has a pre-compiled version of pickle that was written\
    \ in C; hence cPickle. Using cPickle makes your program run faster.\n\nOf course,\
    \ with processor speeds getting faster all the time, you probably won't see a\
    \ significant difference. However, it is there and the use is the same as the\
    \ normal pickle library, so you might as well use it. (As an aside, anytime you\
    \ need to increase the speed of your program, you can write the bottleneck code\
    \ in C and bind it into Python. I won't cover that in this book but you can learn\
    \ more in the official Python documentation.)\n\nShelves are similar to pickles\
    \ except that they pickle objects to an access-by-key database, much like dictionaries.\
