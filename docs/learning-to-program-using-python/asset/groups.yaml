    \ keepends 且为真，否则结果列表中不包含换行符。\n\n### str.startswith(*prefix*[,* start*, *end*])\n\
    如果字符串以 prefix 开头，则返回 True，否则返回 False。prefix 也可以是用于查找的前缀元组。通过可选参数 start，从该位置开始测试字符串。通过可选参数\
    \ end，在该位置停止比较字符串。\n\n### str.strip([*chars*])\n返回去除了前导和尾部字符的字符串副本。chars 参数是一个指定待删除字符集的字符串。如果省略或为\
    \ None，chars 参数默认为删除空白字符。chars 参数不是前缀或后缀；而是移除其值的所有组合。\n\n### str.swapcase()\n\
    返回转换大小写的字符串副本：大写字符转换为小写，反之亦然。\n\n### str.title()\n返回标题化版本的字符串：单词以大写字符开头，所有其余的大小写字符均为小写。还有一个方法\
