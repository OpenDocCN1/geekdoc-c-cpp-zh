    \ tools like wxGlade can make it easier but it still takes time.\n\n## Chapter\
    \ 22\n\n### What Can wxPython Do?\n\nwxPython is a stable, mature graphical library.\
    \ As such, it has widgets for nearly everything you plan on creating. Generally\
    \ speaking, if you can’t do it with wxPython, you’ll probably have to create a\
