    ```\n\n这将允许你多次运行你的数据库程序（例如在创建或测试期间），而无需在每次运行后删除数据库文件。\n\n在测试数据库文件是否已存在时，你还可以使用类似的\
    \ try/except 块；如果文件不存在，你就可以调用数据库创建模块。这允许你将数据库创建代码放在与你的“核心”程序不同的模块中，仅在需要时调用它。\n\
    \n# 第 18 章：分发你的程序\n\n这将是一个简短的章节，因为将你的 Python 程序分发给他人通常相当容易。用户获取你的程序的主要方式是获取原始的\
    \ `.py` 文件并将其保存到存储位置。假设用户的系统上已安装 Python，他所要做的就是像往常一样调用你的 Python 程序，例如 `python\
    \ foo.py`。这是你在本书中一直使用的方法，也是处理 Python 文件最简单的方式。\n\n分发源代码的另一种方式是提供字节码编译版本；这些文件以\
    \ `.pyc` 结尾，是在你第一次运行程序后创建的。这些编译版本不是你程序的程序员可读文件；它们是计算机实际使用的机器就绪文件。如果你希望你的程序具有一定的安全性，但不想处理混淆或其他隐藏作品的所有麻烦，你可能希望使用\
