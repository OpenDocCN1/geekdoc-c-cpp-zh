    \ thing to mention about assignment is that a name can be reassigned to different\
    \ objects. Since a name is just a reference to an object and doesn't have to be\
    \ declared, you can change its \"value\" to anything. For example:\n\n```\nListing\
    \ 11.1: Variable values aren't fixed\n>>>x = 0       #x is linked to an integer\n\
    >>>x = \"spam\"   #now it's a string\n>>>x = [1, 2, 3]   #now it's a list\n```\n\
    \n## 11.2 Expressions/Calls\n\nPython expressions can be used as statements but\
    \ since the result won't be saved, expressions are usually used to call functions/methods\
    \ and for printing values at the interactive prompt.\n\nHere's the typical format:\n\
    \n```\nListing 11.2: Expression examples\nspam(eggs, ham) #function call using\
    \ parenthesis\nspam.ham(eggs) #method call using dot operator\nspam #interactive\
    \ print\nspam < ham and ham != eggs #compound expression\nspam < ham < eggs #range\
    \ test\n```\n\nThe range test above lets you perform a Boolean test but in a \"\
    normal\" fashion; it looks just like a comparison from math class. Again, another\
    \ handy Python feature that other languages don't necessarily have.\n\n## 11.3\
    \ Printing\n\nPrinting in Python is extremely simple. Using **print** writes the\
    \ output to the C stdout stream and normally goes to the console unless you redirect\
    \ it to another file.\n\nNow is a good time to mention that Python has 3 streams\
    \ for input/output (I/O). *sys.stdout* is the standard output stream; it is normally\
    \ sent to the monitor but can be rerouted to a file or other location. *sys.stdin*\
    \ is the standard input stream; it normally receives input from the keyboard but\
    \ can also take input from a file or other location. *sys.stderr* is the standard\
    \ error stream; it only takes errors from the program.\n\nThe print statement\
    \ can be used with either the sys.stdout or sys.stderr streams. This allows you\
    \ to maximize efficiency. For example, you can print all program errors to a log\
    \ file and normal program output to a printer or another program.\n\nPrinting,\
    \ by default, adds a space between items separated by commas and adds a linefeed\
    \ at the end of the output stream. To suppress the linefeed, just add a comma\
    \ at the end of the print statement:\n\n```\nListing 11.3: Print example (no line\
    \ feed)\nprint lumberjack, spam, eggs,\n```\n\nTo suppress the space between elements,\
    \ just concatenate them when printing:\n\n```\nListing 11.4: Printing concatenation\n\
    print \"a\" + \"b\"\n```\n\nPython 3.x replaces the simple print statement with\
    \ the `print()` function. This is to make it more powerful, such as allowing overloading,\
    \ yet it requires very little to change. Instead of using the print statement\
    \ like I have throughout the book so far, you simply refer to it as a function.\
    \ Here are some examples from the *Python documentation page*:\n\n```\nOld: `print\
    \ \"The answer is\", 2*2`\nNew: `print(\"The answer is\", 2*2)`\n\nOld: `print\
    \ x, #Trailing comma suppresses newline`\nNew: `print(x, end=\" \") #Appends a\
    \ space instead of a newline`\n\nOld: `print #Prints a newline`\nNew: `print()\
    \ #You must call the function!`\n\nOld: `print >> sys.stderr, \"fatal error\"\
    `\nNew: `print(\"fatal error\", file=sys.stderr)`\n\nOld: `print (x, y) #prints\
    \ repr((x, y))`\nNew: `print((x, y)) #Not the same as print(x, y)!`\n```\n\n##\
    \ 11.4 *if* Tests\n\nOne of the most common control structures you'll use, and\
    \ run into in other programs, is the *if* conditional block. Simply put, you ask\
    \ a yes or no question; depending on the answer different things happen. For example,\
    \ you could say, \"If the movie selected is 'The Meaning of Life', then print\
    \ 'Good choice.' Otherwise, randomly select a movie from the database.\"\n\nIf\
    \ you've programmed in other languages, the *if* statement works the same as other\
    \ languages. The only difference is the *else/if* as shown below:\n\n```\nListing\
    \ 11.5: Using *if* statements\nif item == \"magnet\":\n   kitchen_list = [\"fridge\"\
    ]\nelif item == \"mirror\": #optional condition\n   bathroom_list = [\"sink\"\
    ]\nelif item == \"shrubbery\": #optional condition\n   landscape_list = [\"pink\
    \ flamingo\"]\nelse: #optional final condition\n   print \"No more money to remodel\"\
    \n```\n\nHaving the *elif* (else/if) or the *else* statement isn't necessary but\
    \ I like to have an *else* statement in my blocks. It helps clarify to me what\
    \ the alternative is if the *if* condition isn't met. Plus, later revisions can\
    \ remove it if it's irrelevant.\n\nUnlike C, Pascal, and other languages, there\
    \ isn't a *switch* or *case* statement in Python. You can get the same functionality\
    \ by using *if/elif* tests, searching lists, or indexing dictionaries. Since lists\
    \ and dictionaries are built at runtime, they can be more flexible. Here's an\
    \ equivalent switch statement using a dictionary:\n\n```\nListing 11.6: Dictionary\
    \ as a *switch* statement\n>>>choice = 'ham'\n>>>print {'spam': 1.25, #a dictionary-based\n\
    ...          'ham': 1.99,\n...          'eggs': 0.99,\n...          'bacon': 1.10}[choice]\n\
    1.99\n```\n\nObviously, this isn't the most intuitive way to write this program.\
    \ A better way to do it is to create the dictionary as a separate object, then\
    \ use something like *has_key()* or otherwise find the value corresponding to\
    \ your choice.\n\nTo be honest, I don't think about this way of using dictionaries\
    \ when I'm programming. It's not natural for me yet; I'm still used to\n"
  mdcn: "\n# 第 11 章\n\n## 语句\n\n既然我们已经了解了 Python 如何使用其基本数据类型，那么现在来谈谈如何实际使用它们。Python\
