    \ 次分割（因此，列表将最多包含 *maxsplit*+1 个元素）。如果未指定 *maxsplit*，则对分割次数没有限制（执行所有可能的分割）。\n\n\
    如果提供了 *sep*，连续的分隔符不会合并在一起，并且被视为界定空字符串（例如，'1,2'.split(',') 返回 ['1', '', '2']）。*sep*\
    \ 参数可以由多个字符组成（例如，'1<<2<<3'.split('<<') 返回 ['1', '2', '3']）。使用指定的分隔符分割空字符串返回 ['']。\n\
    \n如果未指定 sep 或为 None，则应用不同的分割算法：连续的空格序列被视为单个分隔符，并且如果字符串有前导或尾部空格，结果将不包含开头或结尾的空字符串。因此，使用\
    \ None 分隔符分割空字符串或仅由空格组成的字符串返回 []。\n\n例如，'1 2 3'.split() 返回 ['1', '2', '3']，而 '1\
