    Python 会话，允许你以交互式方式使用 Python 解释器。在 Windows 中，通常只需进入“所有程序”中的 Python 文件并点击它即可。


    ## 1.4 本书使用的约定


    Python 的最新版本是 3.2，而最新的“遗留”版本是 2.7。除非明确说明，我将使用 3.x 来表示 Python 3 系列中的任何版本，使用 2.x
