    ```


    字符串中的迭代与其他语言略有不同。Python 没有创建循环来不断遍历字符串并打印每个字符，而是具有内置的迭代类型。以下是一个示例及其解释：


    **代码示例 6.3：字符串迭代**


    ```python

    >>> myjob = "lumberjack"

    >>> for c in myjob: print c, # step through items

    ... l u m b e r j a c k

    >>> "k" in myjob # 1 means true

    1

    ```


    本质上，Python 正在顺序遍历变量 "myjob" 并打印字符串中存在的每个字符。for 语句将在本书后续部分深入介绍，但目前只需知道它们是用于遍历值范围的工具。正如你所见，它们可以用于字符串，或者更常用于数字。


    第二个示例是一个简单的比较。字母 “k” 是否存在于 “myjob” 存储的值中？如果是，Python 将返回数值 1，表示是。如果 “k” 不存在，它将返回
    0。这种情况最常见于文字处理应用，尽管你可能也能想到其他有用的情境。


    ## 6.2 字符串索引和切片


    Python 中的字符串处理方式类似于 C 中的数组。与 C 数组不同，字符串中的字符可以从前向后和从后向前访问。从前向后，字符串以位置 0 开始，所需的字符通过偏移量（从字符串末尾移动多远）找到。然而，你也可以通过从字符串末尾使用负偏移量来找到该字符。我不深入讲解，但这里有一个快速示例：


    **代码示例 6.4：字符串索引**


    ```python

    >>> S = "spam"

    >>> S[0], S[-2] # indexing from the front and rear

    (''s'', ''a'')

    ```


    索引就是告诉 Python 字符在字符串中的位置。与许多其他语言一样，Python 从 0 开始计数，而不是 1。因此，第一个字符的索引是 0，第二个字符的索引是
    1，依此类推。反向通过字符串计数也是如此，除了最后一个字母的索引是 -1 而不是 0（因为 0 已经被占用）。因此，要索引最后一个字母，你使用 -1，倒数第二个字母是
    -2，等等。了解字符的索引对于切片很重要。


    切片字符串听起来很直白：通过提供上下界索引值，我们可以只提取我们想要的字符。一个很好的例子是处理输入文件，其中每行以换行符结束；只需切掉最后一个字符并处理每一行。你也可以使用它通过“过滤”掉程序名称来处理命令行参数。再次，这里有一个示例：


    **代码示例 6.5：字符串切片**


    ```python

    >>> S = "spam"

    >>> S[1:3], S[1:], S[:-1]    # slicing: extract section

    (''pa'', ''pam'', ''spa'')

    ```


    你会注意到切片时使用了冒号符号。冒号充当上下界索引值之间的分隔符。如果未给出其中一个值，Python 将其解释为你想要从该索引值到字符串末尾的所有内容。在上面的示例中，第一个切片是从索引
    1（第二个字母，包含）到索引 3（第四个字母，不包含）。你可以将索引视为每个字母前的空间；这就是为什么字母 “m” 不包含在第一个切片中，而字母 “p” 包含在内。


    第二个切片是从索引 1（第二个字母）到字符串末尾。第三个切片从字符串末尾开始并向后延伸。


