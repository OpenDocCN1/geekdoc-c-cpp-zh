    # ## 4.4  Commenting Python


    One final thing to discuss is that comments in Python are marked with the “#”
    symbol. Comments are used to annotate notes or other information without having
    Python try to perform an operation on them. For example,


    ```

    Listing 4.6: Python comments

    dict = {"First phonetic": "Able", "Second phonetic": "Baker"}  #create a dictionary

    print dict.keys()              #dictionary values aren''t in order

    [''Second phonetic'', ''First phonetic'']

    print dict["First phonetic"]    #print the key''s value

    Able

    ```


    You will see later on that, even though Python is a very readable language, it
    still helps to put comments in your code. Sometimes it’s to explicitly state what
    the code is doing, to explain a neat shortcut you used, or to simply remind yourself
    of something while you’re coding, like a “todo” list.


