    functions (and any other objects) that are exported by the module, with a one-line
    summary of each. (These summaries generally give less detail than the summary
    line in the object’s docstring.)


    The docstring for a function or method should summarize its behavior and document
    its arguments, return value(s), side effects, exceptions raised, and restrictions
    on when it can be called (all if applicable). Optional arguments should be indicated.
    It should be documented whether keyword arguments are part of the interface.'
