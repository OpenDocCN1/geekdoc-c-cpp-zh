    # Chapter 20


    # Overview of Graphical User Interfaces


    # 20.1 Introduction


    Graphical user interfaces (GUIs) are very popular for computers nowadays. Rarely
    will you find a program that doesn''t have some sort of graphical interface to
    use it. Most non-graphical programs will be found in \*nix operating systems;
    even then, those programs are usually older ones where the programmer didn''t
    want (or see the need for) a graphical interface.


    Unless you are a power-user or feel very comfortable using command-line tools,
    you will interact with your computer via a graphical interface. A graphical interface
    entails the program creating what is commonly called a "window". This window is
    populated by "widgets", the basic building blocks of a GUI. Widgets are the pieces
    of a GUI that make it usable, e.g. the close button, menu items, sliders, scrollbars,
    etc. Basically, anything the user can see is a widget.


    Because most people are used to using windows to manipulate their computer, it''s
    worthwhile to know how to create a GUI. Though it''s easier and often faster to
    make a command-line program, very few people will use it. Humans are visual creatures
    and people like “flashy” things. Hence, putting a nice graphical interface on
    your program'
  - '[PAGE 142]


    makes it easier for people to use, even if it''s faster/easier to use the command
    line.


    There are many GUI development tools available. Some of the most popular are Qt,
    GTK, wxWidgets, and .NET. All but MFC are cross-platform, meaning you can develop
    your program in any operating system and know that it will work in any other operating
    system. However, some programs created in Microsoft’s Visual Studio will only
    run on Microsoft Windows.


