    \ 的 `distutils` 模块。我不会详细讨论这个工具；简而言之，许多可安装的 Python 程序使用此方法来自打包。它有助于将所有内容聚集在一起，并减少用户在运行你的程序时需要跟踪的单个文件数量。有关\
    \ distutils 的更多信息可以在 Python *distutils* 文档中找到。\n\n或者，你可以将你的程序打包为 Python egg。Egg\
    \ 类似于 Java 中的 JAR 文件；它们只是一种将信息与 Python 项目捆绑在一起的方式，能够启用程序依赖项的运行时检查，并允许一个程序为其他项目提供插件。一个使用\
    \ egg 的 Python 程序的良好示例是 Django，一个 Web 框架项目。Python egg 的一个优点是你可以使用 “Easy Install”\
    \ 包管理器，它负责为你查找、下载和安装 egg 文件。\n\n对于系统上未安装（或不想安装）Python 的人，你可以将你的程序编译为二进制可执行文件，例如\
    \ .exe 文件。对于 Unix 和 Linux 系统，你可以使用包含在 Python 语言中的 Freeze 实用工具。请注意，在大多数情况下，这真的没有必要，因为\
    \ Python 几乎总是 \\*nix 操作系统上的默认安装应用程序，并且一般来说，使用这些系统的人可能能够处理 Python 文件。但是，如果你想做，这个能力是存在的。\n\
    \n对于 Windows，它默认不安装 Python，你更可能想要创建一个标准的可执行文件（尽管你仍然可以为更冒险或高级用户提供原始的 .py 文件）。用于此的实用工具称为\
    \ **py2exe**。*py2exe* 是一个将 Python 脚本转换为普通可执行 Windows 程序的实用工具。同样，计算机上不需要安装 Python，因此这是为\
    \ Windows 创建 Python 程序的最受欢迎的方式之一。然而，与原始的 .py 文件相比，转换后的程序的文件大小可能会大得多。\n\n最后，对于\
    \ Mac 用户，你可以使用 **py2app** 实用工具。它的功能与 py2exe 一样，为 Mac 用户创建你的 Python 程序的编译版本。OS\
    \ X，Mac 当前的操作系统，随 OS 安装包含 Python，因此从技术上讲，你可以只分发源代码。但大多数 Mac 用户不知道如何使用 Python，因此为他们创建一个“正常”的程序可能更可取。\n\
    \n"
