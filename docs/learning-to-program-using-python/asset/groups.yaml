    \n## 第 22 章\n\n### wxPython 能做什么？\n\nwxPython 是一个稳定、成熟的图形库。因此，它几乎为你计划创建的一切都有控件。一般来说，如果你无法使用\
    \ wxPython 完成某事，你可能不得不创建自定义 GUI，例如在视频游戏中使用的。\n\n我不会涵盖 wxPython 能为你做的所有事情；浏览随 wxPython\
    \ 提供的演示代码将向你展示工具包中包含的所有当前控件。演示还在交互环境中显示源代码；你可以在演示代码中测试不同的想法，并查看结果 GUI 的变化。\n\n\
    wxPython 具有几个标准的内置框架和对话框。框架包括多文档界面（将同类型的文件包含在父窗口内，而不是单独的窗口）以及用于制作简单用户引导向导的向导类。\n\
    \n包含的对话框范围从简单的“关于”框和文件选择到颜色拾取器和打印对话框。对源代码的简单修改即可使它们在你的应用程序中即插即用。\n\n你将使用的主要对象组是核心控件和控件。这些是你构建\
    \ GUI 时使用的。这一类别包括按钮、复选框、单选按钮、列表框、菜单、标签和文本框等。同样，wxPython 演示展示了如何使用这些项目。\n\nwxPython\
    \ 演示中还展示了许多不同的工具。\n\n你其中大部分可能永远用不到，但知道 wxPython 包含它们并且有一些源代码供你使用是很好的。\n\n然而，我注意到的一件事是，示例演示并不总是展示如何使用控件的最佳方法。例如，向导演示当然显示了一个带有上一页/下一页按钮的简单向导。但它没有任何功能，例如接受用户输入文件名或动态更改显示的数据。如果你在没有\
    \ wxGlade 帮助的情况下编写程序，或者在程序中包含许多不同的控件，这将使你的应用程序难以良好运行。\n\n如果你真的想学习 wxPython，你必须不断摆弄示例程序以弄清楚它们如何工作以及如何根据你的需求修改它们，或者寻找一本关于\
    \ wxPython 的书。不幸的是，关于该主题的书很少且难以找到。[亚马逊](#) 网站可能是你最好的选择。或者，你可以转向 Qt，它拥有非常广泛的文档，因为它面向商业开发者。\n\
    \n## 附录 A\n\n### 字符串方法\n\n此列表是 Python 语言库中*字符串方法*部分的缩写版。它列出了你很可能要使用的一些常见字符串方法。\n\
    \n- **str.capitalize()**\n  – 返回字符串的一个副本，仅其首字符大写。\n\n- **str.center**(width, fillchar)\n\
    \  – 返回在长度为 width 的字符串中居中的字符串。填充使用指定的 fillchar（默认为空格）。\n\n- **str.count**(sub,\
    \ start, end)\n  – 返回子串 sub 在 [start, end] 范围内非重叠出现的次数。可选参数 start 和 end 按切片注释解释。\n\
    \n- **str.endswith**(suffix, start, end)\n  – 如果字符串以指定的后缀结尾，则返回 True，否则返回 False。suffix\
    \ 也可以是用于查找的后缀元组。使用可选的 start 时，从该位置开始测试。使用可选的 end 时，在该位置停止比较。\n\n- **str.expandtabs**([tabsize])\n\
    \  – 返回字符串的一个副本，其中所有制表符字符都被替换为一个或多个空格，具体取决于当前列和给定的制表符大小。在字符串中出现的每个换行符后，列号重置为零。如果未提供\
    \ tabsize，则假设制表符大小为 8 个字符。这不理解其他非打印字符或转义序列。\n\n- **str.find**(sub[, start[, end]])\n\
    \  – 返回字符串中子串 sub 被找到的最低索引，使得 sub 包含在 [start, end] 范围内。可选参数 start 和 end 按切片注释解释。如果未找到\
    \ sub，则返回 -1。另一种方法是 index()，它使用相同的参数，但在未找到子串时引发 ValueError。\n\n- **str.format**(format_string,\
    \ *args, **kwargs)\n  – 执行字符串格式化操作。format_string 参数可以包含字面文本或由花括号 {} 分隔的替换字段。每个替换字段包含位置参数的数字索引或关键字参数的名称。返回\
    \ format_string 的副本，其中每个替换字段都被替换为相应参数的字符串值。\n    >>> \"The sum of 1 + 2 is {0}\"\
    .format(1+2)\n    'The sum of 1 + 2 is 3'\n  – 有关可以在格式字符串中指定的各种格式选项的描述，请参阅 Format\
    \ String Syntax。\n  – 这种字符串格式化方法是 Python 3.x 中的新标准，应优先使用该方法而不是文本中描述的 % 格式化方法。但是，如果你使用的是\
    \ 2.6 之前的 Python 版本，则必须使用 % 方法。\n\n- **str.isalnum()**\n  – 如果字符串中的所有字符都是字母数字且至少有一个字符，则返回\
    \ true，否则返回 false。\n\n- **str.isalpha()**\n  – 如果字符串中的所有字符都是字母且至少有一个字符，则返回 true，否则返回\
    \ false。\n\n- **str.isdigit()**\n  – 如果字符串中的所有字符都是数字且至少有一个字符，则返回 true，否则返回 false。\n\
    \n- **str.islower()**\n  – 如果字符串中所有带大小写的字符都是小写且至少有一个带大小写的字符，则返回 true，否则返回 false。\n\
    \n- **str.isspace()**\n  – 如果字符串中只有空白字符且至少有一个字符，则返回 true，否则返回 false。\n\n- **str.isupper()**\n\
    \  – 如果字符串中所有带大小写的字符都是大写且至少有一个带大小写的字符，则返回 true，否则返回 false。\n\n- **str.join**(seq)\n\
    \  – 返回序列 seq 中字符串的拼接字符串。元素之间的分隔符是提供此方法的字符串。\n\n- **str.ljust**(width[, fillchar])\n\
    \  – 返回在长度为 width 的字符串中左对齐的字符串。填充使用指定的 fillchar（默认为空格）。如果 width 小于 len(s)，则返回原始字符串。还有一个具有相同参数的右对齐方法\
    \ [rjust()]。\n\n"
