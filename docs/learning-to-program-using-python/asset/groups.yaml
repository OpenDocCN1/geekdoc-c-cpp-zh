    # 5.1  Python Syntax


    # 5.1.1  Indentation


    Python forces the user to program in a structured format. Code blocks are determined
    by the amount of indentation used. As you’ll recall from the Comparison of Programming
    Languages chapter, brackets and semicolons were used to show code grouping or
    end-of-line termination for the other languages. Python doesn’t require those;
    indentation is used to signify where each code block starts and ends. Here is
