    \ 列表方法\n尽管这是一个完整的方法列表，有关 Python 列表的更多信息可以在 Python 网站关于数据结构的讨论中找到。\n\n- **list.append(x)**\n\
    \  – 在列表末尾添加一项；等效于 a[len(a):] = [x]。\n\n- **list.extend(L)**\n  – 通过追加给定列表中的所有项来扩展列表；等效于\
