    info for auto-matic indexing tools. They will use the one-line summary to create
    a documentation index, allowing the programmer to do less work.


    When continuing your docstring after the blank line, make sure to follow the indentation
    rules for Python, i.e. after the blank line all of your docstring info is indented
    as far as the initial triple-quote. Otherwise you will get errors when you run
