    \ 继承\n\n首先，类允许你在不真正修改程序的情况下对其进行修改。具体来说，通过对类进行子类化，你可以通过向其添加新的组件来改变程序的行为，而不是重写现有的组件。\n\
    \n如我们所见，类的实例继承该类的属性。然而，类也可以从其他类继承属性。因此，子类从父类（超类）继承，允许你创建一个通用的父类，并通过子类对其进行特化。子类可以覆盖父类中的逻辑，允许你在完全不改变父类的情况下改变类的行为。\n\
