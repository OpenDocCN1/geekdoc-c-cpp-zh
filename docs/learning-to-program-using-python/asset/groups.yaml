    ```python\n>>>tuple = (1, 2, 3, 4)\n```\n\n这一术语称为元组打包（packing a tuple），因为数据被“打包进”元组中，全部包裹好并准备就绪。所以，要从元组中移除项目，你只需将其解包（unpack\
    \ it）。\n\nListing 9.3: 解包一个元组\n```python\n>>>first, second, third, fourth = tuple\n\
    >>> first\n1\n>>> second\n2\n>>> third\n3\n>>> fourth\n4\n```\n\n很整洁，不是吗？元组打包/解包的一个好处是你可以原地交换项目。在其他语言中，你必须创建交换变量的逻辑；而在元组中，这种逻辑是数据类型固有的。\n\
    \nListing 9.4: 原地变量交换\n```python\n>>> bug = \"weevil\"\n>>> bird = \"African swallow\"\
    \n>>> bug, bird = bird, bug\n>>> bug\n'African swallow'\n>>> bird\n'weevil'\n\
    ```\n\n在我看来，元组解包和原地交换是 Python 最简洁的功能之一。而不是创建逻辑来从集合中拉取每一项并将其放入各自的变量，元组解包允许你一步完成所有操作。原地交换也是一个快捷方式；你不需要创建临时变量来存储值以交换位置。\n\
    \n### 9.3 方法\n\n元组没有方法。抱歉。\n\n你在使用元组时能做的最好事情是切片、迭代、打包和解包。然而，如果你需要元组具有更高的灵活性，Python\
    \ 有一个巧妙的小技巧：你可以将它们转换为列表。只需在元组上调用 **list()** 函数，它就会神奇地变成一个列表。相反，你可以对列表调用 **tuple()**，它就会变成一个元组。\n\
    \nListing 9.5: 转换列表和元组\n```python\n>>> my_list = [\"moose\", \"Sweden\", \"llama\"\
    ]\n>>> my_tuple = (\"Norwegian Blue\", \"parrot\", \"pet shop\")\n>>> tuple(my_list)\n\
    ('moose', 'Sweden', 'llama')\n>>> list(my_tuple)\n['Norwegian Blue', 'parrot',\
    \ 'pet shop']\n```\n\n显然，这样做的优点是你可以根据需要随意在这两者之间切换。如果在程序运行到一半时，你意识到需要能够操作元组，但又不希望它始终可修改，你可以创建一个新变量，该变量调用\
    \ list() 函数作用于元组，然后根据需要使用该新列表。\n\n因此，既然我们已经掌握了基本构建模块，我们可以继续讨论如何在实践中使用它们。然而，我们将涵盖所有程序员都需要知道如何使用的一个最后基本工具：文件。\n\
    \n# 第 10 章\n\n## 文件\n\nPython 的最终内置对象类型允许我们访问文件。**open()** 函数创建一个 Python 文件对象，该对象链接到外部文件。打开文件后，你可以像平常一样读取和写入它。\n\
    \nPython 中的文件与我之前涵盖的类型不同。它们不是数字、序列或映射；它们仅导出用于常见文件处理的方法。从技术上讲，文件是一个预构建的 C 扩展，为\
    \ C *stdio*（标准输入/输出）文件系统提供包装器。如果你已经知道如何使用 C 文件，那你基本上就知道如何使用 Python 文件了。\n\n文件是永久保存数据的一种方式。你目前所学的一切仅驻留在内存中；一旦你关闭\
    \ Python 或关闭计算机，它们就会消失。如果你想再次使用它们，不得不重新输入所有内容。\n\nPython 创建的文件由计算机的文件系统操作。Python\
    \ 能够使用操作系统特定的函数来导入、保存和修改文件。为了让某些功能以跨平台方式正确工作可能需要做一些工作，但这意味着你的程序将被更多人使用。当然，如果你正在为特定操作系统编写程序，那么你只需要担心该操作系统特定的函数。\n\
    \n### 10.1 文件操作\n\n为了保持一致性，以下是 Python 文件操作的列表：\n\n- `output = open('/tmp/spam',\
    \ 'w')` 创建输出文件（'w' 表示写入）\n- `input = open('data', 'r')` 创建输入文件（'r' 表示读取）\n- `S\
    \ = input.read()` 将整个文件读取到一个字符串中\n- `S = input.read(N)` 读取 N 个字节（1 个或多个）\n- `S\
    \ = input.readline()` 读取下一行（直到行结束标记）\n- `L = input.readlines()` 将整个文件读取到行字符串列表中\n\
    - `output.write(S)` 将字符串 S 写入文件\n- `output.writelines(L)` 将列表 L 中的所有行字符串写入文件\n\
    - `output.close()` 手动关闭（或在自动回收时执行）\n\n由于 Python 具有内置的垃圾回收器，你实际上不需要手动关闭文件；一旦对象在内存中不再被引用，对象的内存空间就会自动回收。这适用于\
    \ Python 中的所有对象，包括文件。然而，建议在大型系统中手动关闭文件；这样做不会有任何害处，并且养成习惯是个好主意，以防你以后不得不工作在一种没有垃圾回收机制的语言中。\n\
    \n### 10.2 文件与流\n\n来自 Unix 背景，Python 将文件视为数据流，即每个文件被读取并存储为字节的顺序流。每个文件都有一个文件结束（EOF）标记，表示数据最后一个字节已被读取。这很有用，因为你可以编写一个程序，分段读取文件，而不必一次性将整个文件加载到内存中。当达到文件结束标记时，你的程序知道没有更多内容可读，并可以继续进行任何所需的处理。\n\
    \n当读取文件时，例如使用 readline() 方法，文件结束在命令行上显示为空字符串；空行只是带有换行符的字符串。以下是一个示例：\n\n![](img/d63d52373cb3bc50aa7b31d0d4a29406_70_0.png)\n\
    \n### 10.3 创建文件\n\n使用 Python 创建文件非常简单。如上图所示，你只需创建表示文件的变量，打开文件，给它一个文件名，并告诉 Python\
    \ 你要写入它。\n\n如果你没有明确告诉 Python 你要写入文件，它将以只读模式打开。这作为一个安全功能，防止你意外覆盖文件。除了标准的“w”表示写入和“r”表示读取之外，Python\
    \ 支持其他几种文件访问模式。\n\n- \"a\": 将所有输出追加到文件末尾；不会覆盖当前存在的信息。如果指定的文件不存在，则会创建该文件。\n- \"\
    r\": 以输入（读取）方式打开文件。如果文件不存在，则引发 IOError 异常。（异常将在第 14 章中介绍。）\n- \"r+\": 以输入和输出方式打开文件。如果文件不存在，则引发\
    \ IOError 异常。\n- \"w\": 以输出（写入）方式打开文件。如果文件存在，则会被覆盖。如果文件不存在，则会创建一个。\n- \"w+\":\
    \ 以输入和输出方式打开文件。如果文件存在，则会被覆盖；否则创建一个。\n- \"ab\", \"rb\", \"r+b\", \"wb\", \"w+b\"\
    : 以二进制（即非文本）输入或输出方式打开文件。[注意：这些模式仅在 Windows 和 Macintosh 平台上受支持。Unix 类系统不关心数据类型。]\n\
    \n使用标准文件时，大多数信息通常是字母数字性质的，因此额外提供了二进制模式的文件操作。除非你有特定需求，否则这对于你的大多数任务来说是没问题的。在后面的章节中，我将讨论如何保存由列表、字典或其他数据元素组成的文件。\n\
    \n### 10.4 从文件读取\n\n如果你注意到上面的列表中，标准的读取模式在文件不存在时会产生 I/O（输入/输出）错误。如果你遇到此错误，你的程序将停止并给你一个错误消息，如下所示：\n\
    \nListing 10.2: 输入/输出错误示例\n```python\n>>> file = open(\"myfile\", \"r\")\nTraceback\
    \ (most recent call last):\nFile \"<stdin>\", line 1, in <module>\nIOError: [Errno\
    \ 2] No such file or directory: 'myfile'\n>>> \n```\n\n要修复这个问题，你应该始终以捕获错误的方式打开文件，以免它终止你的程序。这被称为“捕获异常”，因为给出的\
    \ IOError 实际上是 Python 解释器给出的异常。有一章专门介绍异常处理（第 14 章），但这里提供一个简要概述。\n\n"
