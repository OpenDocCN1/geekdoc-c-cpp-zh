    # # Chapter 19

    ## Python 3


    As mentioned at the beginning of this book, the newest version of Python is version
    3.2, as of this writing. Python 2.7 is the final version for Python 2.x; no new
    releases for Python 2 will be released.


    Python 3.x is the future of the language. It is not fully backwards-compatible
    with Python 2.x, breaking several features in order clean up the language, make
    some things easier, and in general improve the consistency of the language. (More
    information can be found at the Python web site).


    As mentioned previously, most *nix distributions and Mac OS X include Python 2.x
    by default. The vast majority of information on the Internet is geared towards
    Python 2.x, including packages and libraries. So, unless you are sure that all
    users of your programs are using Python 3.x, you may want to learn 2.x.


    This is a short summary of the major changes between the Python 2.x versions and
    Python 3.2, the latest version. Not all changes to the language are mentioned
    here; more comprehensive information can be found at the official Python web site
    or the “What’s New in Python 3.2” page. Some of the information here has already
    been talked about previously in this book; it is mentioned here again for easier
    reference.


    +   * The `print` statement has been replaced with a `print()` function, with
    keyword arguments to replace most of the special syntax of the old `print` statement.'
  - '[PAGE 139]


    +   - Certain APIs don''t use lists as return types but give views or iterators
    instead. For example, the dictionary methods dict.keys(), dict.items(), and dict.values()
    return views instead of lists.

    - Integers have only one type now (“long” integers for those who know them in
    other languages)

    - The default value for division (e.g. 1/2) is to return a float value. To have
    truncating behavior, i.e. return just the whole number, you must use a double
    forward slash: 1//2.

    - All text (a.k.a. “strings”) is Unicode; 8-bit strings are no longer.

    - “!=” is the only way to state “not equal to”; the old way (“<>”) has been removed.

    - Calling modules from within functions is essentially gone. The statement “from
    module import *” can only be used at the module level, not in functions.

    - String formatting has been changed, removing the need for the “%” formatting
    operator.

    - The exception APIs have been changed to clean them up and add new, powerful
    features.

    - raw_input() has been changed to just input().

    - The C language API has been modified, such as removing support for several operating
    systems.


    If you need to port Python 2.x code to version 3.0, there is a simple utility
    called “2to3” that will automatically correct and modify the legacy code to the
    new version. Generally speaking, you simply call the 2to3 program and let it run;
    it is robust enough to handle the vast majority of code changes necessary. However,
    the library is flexible enough to allow you to write your own “fixer” code if
    something doesn''t work correctly.'
