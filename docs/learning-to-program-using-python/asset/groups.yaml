    ### 5.1 Python 语法


    #### 5.1.1 缩进


    Python 强制用户以结构化的格式进行编程。代码块由使用的缩进量决定。正如你在编程语言比较章节中所记得的，其他语言使用括号和分号来显示代码分组或行结束。Python
    不需要这些；缩进被用来标识每个代码块的开始和结束。这里有一个示例（行号已添加以便说明）：


    ```python

    1   x = 1

    2   if x:  #if x is true

    3       y = 2

    4       if y:  #if y is true

    5           print "block 2"

    6       print "block 1"

    7   print "block 0"

    ```


    每个缩进的行标记了一个新的代码块。让我们梳理上面的代码片段：第 1 行是主代码块的开始。第 2 行是一个新的代码段；如果“x”的值不等于 0，则其下方的缩进行将被评估。因此，第
    3 行和第 4 行属于另一个代码段，如果第 2 行为真，它们将被评估。第 5 行是另一个代码段，只有当“y”不等于 0 时才被评估。第 6 行属于与第 3
    行和第 4 行相同的代码块；它也将在那几行所在的同一块中被评估。第 7 行与第 1 行在同一部分，无论任何缩进行做什么，它都会被评估。


    你会注意到，复合语句，比如 if 比较语句，是通过在头行后跟一个冒号 (":") 来创建的。语句的其余部分在其下方缩进。最需要记住的一点是，缩进决定分组；如果你的代码因某种原因不起作用，请仔细检查哪些语句被缩进了。


    快速提示：说 “x = 1” 这个动作是将一个值赋给一个变量。在这种情况下，“x” 是变量；根据定义，它的值是变化的。这意味着你可以赋予它任何你想要的值；在这种情况下，值是“1”。变量是你将经常处理的最常见的编程项目之一，因为它们存储值并用于数据操作。


    #### 5.1.2 跨多行


    如果语句被收集在大括号内（圆括号 "()"、方括号 "[]" 或花括号 "{}"），它们可以跨越多行。通常使用圆括号。当在大括号内跨行时，缩进并不重要；初始括号用于确定整个语句属于哪个代码部分。如果使用三重引号，字符串语句也可以是跨行的。例如：


    **列表 5.2：三重引号的使用**


    ```python

    >>> big = """This is

    ... a multi-line block

    ... of text; Python puts

    ... an end-of-line marker

    ... after each line. """

    >>>

    >>> big

    ''This is\012a multi-line block\012of text; Python

    puts\012an end-of-line marker \012after each

    line.''

    ```


    请注意，\012 是 \n 的八进制形式，即“换行”指示符。上面的省略号 (…) 是交互式 Python 提示符中的空白行，用于表示解释器正在等待更多信息。


    ### 5.2 Python 对象类型


    与其他许多编程语言一样，Python 具有内置的数据类型，程序员使用它们来创建程序。这些数据类型是程序的构建块。根据语言的不同，可用的数据类型也不同。一些语言，特别是
    C 和 C++，拥有非常原始的类型；大量的编程时间仅仅用于将这些原始类型组合成有用的数据结构。Python 消除大量这种繁琐的工作。它已经实现了一系列广泛的类型和结构，为开发人员留下了更多时间来实际创建程序。相信我；这是我在学习
    C/C++ 时讨厌的事情之一。不得不为每个程序不断重新创建相同的数据结构，不是一件令人期待的事。


    Python 拥有以下内置类型：数字、字符串、列表、字典、元组和文件。当然，如果需要，你可以构建自己的类型，但 Python 的创建使得你很少需要“自己动手”。内置类型足够强大，可以覆盖你代码的大多数部分，并且易于增强。我们将在讨论完数字后结束这一节；我们稍后会在其他章节中涵盖其他类型。


    在我忘记之前，我应该提到 Python 没有强类型编码；也就是说，一个变量可以作为整数、浮点数、字符串或任何其他类型使用。Python 在运行时将确定需要什么。参见下方：


    **列表 5.3：弱类型编码**


    ```python

    >>> x = 12

    >>> y = "lumberjack"

    >>> x

    12

