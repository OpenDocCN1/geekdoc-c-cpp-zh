    # 11.3 Printing


    Printing in Python is extremely simple. Using **print** writes the output to the
    C stdout stream and normally goes to the console unless you redirect it to another
    file.


    Now is a good time to mention that Python has 3 streams for input/output (I/O).
    *sys.stdout* is the standard output stream; it is normally send to the monitor
    but can be rerouted to a file or other location. *sys.stdin* is the standard input
    stream; it normally receives input from the keyboard but can also take input from
    a file or other location. *sys.stderr* is the standard error stream; it only takes
    errors from the program.


    The print statement can be used with either the sys.stdout or sys.stderr streams.
    This allows you to maximize efficiency. For example, you can print all program
    errors to a log file and normal program output to a printer or another program.


    Printing, by default, adds a space between items separated by commas and adds
    a linefeed at the end of the output stream. To suppress the linefeed, just add
    a comma at the end of the print statement:


    ```

    Listing 11.3: Print example (no line feed)

    print lumberjack, spam, eggs,

    ```


    To suppress the space between elements, just concatenate them when printing:'
