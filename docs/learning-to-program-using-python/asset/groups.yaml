  md: "\nusing *if/elif* conditions. Again, you can create your program using *if/elif*\
    \ statements and change them to dictionaries or lists when you revise it. This\
    \ can be part of normal refactoring (rewriting the code to make it easier to manage\
    \ or read), part of bug hunting, or to speed it up.\n\n### 11.5 while Loops\n\n\
    *while* loops are a standard workhorse of many languages. Essentially, the program\
    \ will continue doing something while a certain condition exists. As soon as that\
    \ condition is no longer true, the loop stops.\n\nThe Python *while* statement\
    \ is, again, similar to other languages. Here’s the main format:\n\nListing 11.7:\
    \ *while loops, part 1*\n\n```python\nwhile <test>:\n    #loop test\n    <code\
    \ block>\n    #loop body\nelse:\n    #optional else statement\n    <code block>\n\
    \    #run if didn't exit loop with\n    #break\n```\n\n*break* and *continue*\
    \ work the exact same as in C. The equivalent of C’s empty statement (a semicolon)\
    \ is the *pass* statement, and Python includes an *else* statement for use with\
    \ breaks. Here’s a full-blown *while* example loop:\n\nListing 11.8: *while loops,\
    \ part 2*\n\n```python\nwhile <test>:\n    <statements>\n    if <test>: break\
    \ #exit loop now if true\n    if <test>: continue #return to top of loop now if\
    \ true\nelse:\n    <statements>\n    #if we didn't hit a 'break'\n```\n\n*break*\
    \ statements simply force the loop to quit early; when used with nested loops,\
    \ it only exits the smallest enclosing loop. *continue* statements cause the loop\
    \ to start over, regardless of any other statements further on in the loop. The\
    \ else code block is ran “on the way out” of the loop, unless a break statement\
    \ causes the loop to quit early.\n\nFor those who are still confused, the next\
    \ section will show how these statements are used in a real-world program with\
    \ prime numbers.\n\n### 11.6 for Loops\n\nThe for loop is a sequence iterator\
    \ for Python. It will work on nearly anything: strings, lists, tuples, etc. I’ve\
    \ talked about for loops before, and we will see a lot of them in future chapters,\
    \ so I won’t get into much more detail about them. The main format is below in\
    \ Listing 11.9. Notice how it’s essentially the same as a while loop.\n\nListing\
    \ 11.9: for loops\n\n```python\nfor <target> in <object>:     #assign object items\n\
    \    #to target\n    <statements>\n    if <test>: break    #exit loop now, skip\
    \ else\n    if <test>: continue #go to top of loop now\nelse:\n    <statements>\
    \        #if we didn’t hit a ‘break’\n```\n\nFrom Learning Python from O'Reilly\
    \ publishing:\n\n> “When Python runs a for loop, it assigns items in the sequence\
    \ object to the target, one by one, and executes the loop body for each. The loop\
    \ body typically uses the assignment target to refer to the current item in the\
    \ sequence, as though it were a cursor stepping through the sequence. Technically,\
    \ the for works by repeatedly indexing the sequence object on successively higher\
    \ indexes (starting at zero), until an index out-of-bounds exception is raised.\
    \ Because for loops automatically manage sequence indexing behind the scenes,\
    \ they replace most of the counter style loops you may be used to coding in languages\
    \ like C.”\n\nIn other words, when the for loop starts, it looks at the first\
    \ item in the list. This item is given a value of 0 (many programming languages\
    \ start counting at 0, rather than 1). Once the code block is done doing its processing,\
    \ the *for* loop looks at the second value and gives it a value of 1. Again, the\
    \ code block does its processing and the *for* loop looks at the next value and\
    \ gives it a value of 2. This sequence continues until there are no more values\
    \ in the list. At that point the *for* loop stops and control proceeds to the\
    \ next statement in the program.\n\nListing 11.10 shows a practical version of\
    \ a *for* loop that implements *break* and *else* statements, as explained in\
    \ the **Python documentation**.\n\nListing 11.10: *break* and *else* statements\n\
    \n```python\n>>> for n in range(2, 10):\n...     for x in range(2, n):\n...  \
    \       if n % x == 0:    #if the remainder\n...             #of n/x is 0\n...\
    \             print n, 'equals', x, '*', n/x\n...             break    #exit immediately\n\
    ...     else:\n...         # loop fell through without finding a\n...        \
    \ #factor\n...     print n, 'is a prime number'\n\n2 is a prime number\n3 is a\
    \ prime number\n4 equals 2 * 2\n5 is a prime number\n6 equals 2 * 3\n7 is a prime\
    \ number\n8 equals 2 * 4\n9 equals 3 * 3\n```\n\nRelated to *for* loops are *range*\
    \ and counter loops. The **range()** function auto-builds a list of integers for\
    \ you. Typically it’s used to create indexes for a *for* statement but you can\
    \ use it anywhere.\n\nListing 11.11: Using the **range()** function\n\n```python\n\
    >>> range(5) #create a list of 5 numbers, starting\n... at 0\n[0, 1, 2, 3, 4]\n\
    >>> range(2, 5) #start at 2 and end at 5 (remember\n... the index values)\n[2,\
    \ 3, 4]\n>>> range(0, 10, 2) #start at 0, end at 10 (index\n... value), with an\
    \ increment of 2\n[0, 2, 4, 6, 8]\n```\n\nAs you can see, a single argument gives\
    \ you a list of integers, starting from 0 and ending at one less than the argument\
    \ (because of the index). Two arguments give a starting number and the max value\
    \ while three arguments adds a stepping value, i.e. how many numbers to skip between\
    \ each value.\n\nCounter loops simply count the number of times the loop has been\
    \ processed. At the end of the loop, a variable is incremented to show that the\
    \ loop has been completed. Once a certain number of loops have occurred, the loop\
    \ is executed and the rest of the program is executed.\n\n### 11.7 pass Statement\n\
    \nThe pass statement is simply a way to tell Python to continue moving, nothing\
    \ to see here. Most often, the pass statement is used while initially writing\
    \ a program. You may create a reference to a function but haven't actually implemented\
    \ any code for it yet. However, Python will be looking for something within that\
    \ function. Without having something to process, the Python interpreter will give\
    \ an exception and stop when it doesn't find anything. If you simply put a pass\
    \ statement in the function, it will continue on without stopping.\n\nListing\
    \ 11.12: pass statements\n\n```python\nif variable > 12:\n    print \"Yeah, that's\
    \ a big number.\"\nelse: pass\n```\n\n### 11.8 break and continue Statements\n\
    \nAlready mentioned, these two statements affect the flow control within a loop.\
    \ When a particular condition is met, the break statement “breaks” out of the\
    \ loop, effectively ending the loop prematurely (though in an expected manner).\
    \ The continue statement “short circuits” the loop, causing flow control to return\
    \ to the top of the loop immediately.\n\nI rarely use these statements but they\
    \ are good to have when needed. They help ensure you don’t get stuck in a loop\
    \ forever and also ensure that you don’t keep iterating through the loop for no\
    \ good reason.\n\n### 11.9 try, except, finally and raise Statements\n\nI’ve briefly\
    \ touched on some of these and will talk about them more in the Exceptions chapter.\
    \ Briefly, try creates a block that attempts to perform an action. If that action\
    \ fails, the except block catches any exception that is raised and does something\
    \ about it. finally performs some last minute actions, regardless of whether an\
    \ exception was raised or not. The raise statement manually creates an exception.\n\
    \n### 11.10 import and from Statements\n\nThese two statements are used to include\
    \ other Python libraries and modules that you want to use in your program. This\
    \ helps to keep your program small (you don’t have to put all the code within\
    \ a single module) and “isolates” modules (you only import what you need). import\
    \ actually calls the other libraries or modules while from makes the import statement\
    \ selective; you only import subsections of a module, minimizing the amount of\
    \ code brought into your program.\n\n### 11.11 def and return Statements\n\nThese\
    \ are used in functions and methods. Functions are used in procedural-based programming\
    \ while methods are used in object-oriented programming. The *def* statement defines\
    \ the function/method. The *return* statement returns a value from the function\
    \ or method, allowing you to assign the returned value to a variable.\n\nListing\
    \ 11.13: Defining functions\n\n```python\n>>> a = 2\n>>> b = 5\n>>> def math_function\
    \ ():\n...     return a * b\n...\n>>> product = math_function ()\n>>> product\n\
    10\n```\n\n### 11.12 Class Statements\n\nThese are the building blocks of OOP,\
    \ *class* creates a new object. This object can be anything, whether an abstract\
    \ data concept or a model of a physical object, e.g. a chair. Each class has individual\
    \ characteristics unique to that class, including variables and methods. Classes\
    \ are very powerful and currently “the big thing” in most programming languages.\
    \ Hence, there are several chapters dedicated to OOP later in the book.\n"
  mdcn: "\n\n使用 *if/elif* 条件。同样，你可以先使用 *if/elif* 语句创建程序，然后在修改时将其更改为字典或列表。这可以作为常规重构（重写代码以使其更易于管理或阅读）的一部分、查错的一部分，或者用于加速程序。\n\
    \n### 11.5 while 循环\n\n*while* 循环是许多语言中的标准主力。本质上，程序会在某个条件存在时继续执行某事。一旦该条件不再为真，循环就会停止。\n\
    \nPython 的 *while* 语句与其他语言类似。以下是主要格式：\n\n示例 11.7：*while 循环，第一部分*\n\n```python\n\
    while <test>:\n    #loop test\n    <code block>\n    #loop body\nelse:\n    #optional\
    \ else statement\n    <code block>\n    #run if didn't exit loop with\n    #break\n\
    ```\n\n*break* 和 *continue* 在 C 语言中工作方式完全相同。C 语言中的空语句（一个分号）的等价物是 *pass* 语句，并且\
    \ Python 为配合 break 使用而包含了一个 *else* 语句。以下是一个完整的 *while* 循环示例：\n\n示例 11.8：*while\
    \ 循环，第二部分*\n\n```python\nwhile <test>:\n    <statements>\n    if <test>: break\
    \ #exit loop now if true\n    if <test>: continue #return to top of loop now if\
    \ true\nelse:\n    <statements>\n    #if we didn't hit a 'break'\n```\n\n*break*\
    \ 语句仅仅强制循环提前退出；当与嵌套循环一起使用时，它只退出最内层（最小的包含）循环。*continue* 语句使循环重新开始，无论循环后面还有什么其他语句。除非\
    \ *break* 语句导致循环提前退出，否则 *else* 代码块会在循环的“出口处”运行。\n\n对于仍然感到困惑的人，下一节将展示这些语句在涉及质数的实际程序中是如何使用的。\n\
    \n### 11.6 for 循环\n\nfor 循环是 Python 中的序列迭代器。它几乎适用于任何对象：字符串、列表、元组等。我之前讨论过 for 循环，并且在未来的章节中我们会看到很多，所以我不再过多详细阐述。主要格式如下，见示例\
    \ 11.9。请注意，它本质上与 while 循环相同。\n\n示例 11.9：for 循环\n\n```python\nfor <target> in <object>:\
    \     #assign object items\n    #to target\n    <statements>\n    if <test>: break\
    \    #exit loop now, skip else\n    if <test>: continue #go to top of loop now\n\
    else:\n    <statements>        #if we didn’t hit a ‘break’\n```\n\n摘自 O'Reilly\
    \ 出版的《学习 Python》：\n\n> “当 Python 运行 for 循环时，它将序列对象中的项逐一分配给目标，并对每一项执行循环主体。循环主体通常使用赋值目标来引用序列中的当前项，就好像它是一个在序列中移动的游标。从技术上讲，for\
    \ 通过重复对序列对象进行索引（从零开始，索引依次增加），直到引发索引越界异常来实现。由于 for 循环在后台自动管理序列索引，它替代了你可能习惯于在 C\
    \ 等语言中编写的许多计数器风格的循环。”\n\n换句话说，当 for 循环开始时，它查看列表中的第一项。该项被赋予值 0（许多编程语言从 0 开始计数，而不是\
    \ 1）。一旦代码块完成其处理，*for* 循环查看第二个值并赋予其值 1。再次地，代码块完成其处理，*for* 循环查看下一个值并赋予其值 2。这个序列持续进行，直到列表中不再有值为止。在那一点上，*for*\
    \ 循环停止，控制权转移到程序中的下一条语句。\n\n示例 11.10 展示了一个实用的 *for* 循环版本，实现了 *break* 和 *else* 语句，如**Python\
    \ 文档**中所述。\n\n示例 11.10：*break* 和 *else* 语句\n\n```python\n>>> for n in range(2,\
    \ 10):\n...     for x in range(2, n):\n...         if n % x == 0:    #if the remainder\n\
    ...             #of n/x is 0\n...             print n, 'equals', x, '*', n/x\n\
    ...             break    #exit immediately\n...     else:\n...         # loop\
    \ fell through without finding a\n...         #factor\n...     print n, 'is a\
    \ prime number'\n\n2 is a prime number\n3 is a prime number\n4 equals 2 * 2\n\
    5 is a prime number\n6 equals 2 * 3\n7 is a prime number\n8 equals 2 * 4\n9 equals\
    \ 3 * 3\n```\n\n与 *for* 循环相关的是 *range* 和计数器循环。**range()** 函数会自动为你构建一个整数列表。通常它用于为\
    \ *for* 语句创建索引，但你可以在任何地方使用它。\n\n示例 11.11：使用 **range()** 函数\n\n```python\n>>> range(5)\
    \ #create a list of 5 numbers, starting\n... at 0\n[0, 1, 2, 3, 4]\n>>> range(2,\
    \ 5) #start at 2 and end at 5 (remember\n... the index values)\n[2, 3, 4]\n>>>\
    \ range(0, 10, 2) #start at 0, end at 10 (index\n... value), with an increment\
    \ of 2\n[0, 2, 4, 6, 8]\n```\n\n如你所见，单个参数会给你一个整数列表，从 0 开始，到参数减一结束（因为索引的原因）。两个参数提供起始数字和最大值，而三个参数则增加了一个步长值，即每个值之间跳过多少个数字。\n\
    \n计数器循环只是计算循环已处理的次数。在循环结束时，一个变量会自增，以表明循环已完成。一旦达到特定次数的循环，循环就会执行，然后程序的其余部分被执行。\n\
    \n### 11.7 pass 语句\n\npass 语句只是告诉 Python 继续移动，这里没有实质内容。通常，pass 语句在最初编写程序时使用。你可能创建了一个函数的引用，但尚未实际实现其代码。然而，Python\
    \ 将寻找该函数内部的某些内容。如果没有可处理的内容，Python 解释器在找不到任何东西时会引发异常并停止。如果你只是在函数中放入一个 pass 语句，它将不会停止地继续运行。\n\
    \n示例 11.12：pass 语句\n\n```python\nif variable > 12:\n    print \"Yeah, that's a\
    \ big number.\"\nelse: pass\n```\n\n### 11.8 break 和 continue 语句\n\n前面已提到，这两个语句影响循环内的流程控制。当满足特定条件时，break\
    \ 语句会“跳出”循环，从而有效地提前结束循环（虽然是以预期的方式）。continue 语句会使循环“短路”，立即使流程控制返回循环顶部。\n\n我很少使用这些语句，但在需要时它们很有用。它们有助于确保你不会永远卡在循环中，也确保你不会没有正当理由而持续迭代循环。\n\
    \n### 11.9 try, except, finally 和 raise 语句\n\n我简要提及了其中一些，将在异常章节中更详细地讨论它们。简要来说，try\
    \ 创建一个尝试执行操作的块。如果该操作失败，except 块捕获引发的任何异常并对其进行处理。finally 无论是否引发异常，都会执行最后的一些操作。raise\
    \ 语句手动创建异常。\n\n### 11.10 import 和 from 语句\n\n这两个语句用于包含你希望在程序中使用的其他 Python 库和模块。这有助于保持程序小巧（你不需要将所有代码放在单个模块中）并“隔离”模块（你只导入你需要的内容）。import\
    \ 实际调用了其他库或模块，而 from 使导入语句具有选择性；你只导入模块的子集，最小化带入程序的代码量。\n\n### 11.11 def 和 return\
    \ 语句\n\n这些用于函数和方法。函数用于过程式编程，而方法用于面向对象编程。*def* 语句定义函数/方法。*return* 语句从函数或方法返回一个值，允许你将返回值赋值给变量。\n\
    \n示例 11.13：定义函数\n\n```python\n>>> a = 2\n>>> b = 5\n>>> def math_function ():\n\
    ...     return a * b\n...\n>>> product = math_function ()\n>>> product\n10\n```\n\
    \n### 11.12 Class 语句\n\n这些是 OOP 的构建块，*class* 创建一个新的对象。该对象可以是任何东西，无论是抽象数据概念还是物理对象的模型，例如椅子。每个类都有独特于该类的特征，包括变量和方法。类非常强大，目前在大多数编程语言中都是“热门话题”。因此，书中后面有专门几章致力于\
    \ OOP。\n\n"
