    \ The reader is encouraged to review the official documentation for further details.)\n\
    \nYou can document a Python object by giving it a docstring. A docstring is simply\
    \ a triple-quoted sentence giving a brief summary of the object. The object can\
    \ be a function, method, class, etc. (In this section, the term “function” is\
    \ used to signify an actual function or a method, class, or other Python object.)\n\
    \n#### Listing 12.1: docstring example\n\n```python\ndef buildConnectionString(params):\n\
    \    \"\"\" Build a connection string from a dictionary of parameters.\n    Returns\
    \ string. \"\"\"\n```\n\nAs noted previously, triple quotes signify a multi-line\
    \ string. Everything between the start and end quotes is part of a single string,\
    \ including carriage returns and other quote characters. You’ll see them most\
    \ often used when defining a docstring.\n\nEverything between the triple quotes\
    \ is the function's docstring, which documents what the function does. A docstring,\
    \ if it exists, must be the first thing defined in a function (that is, the first\
    \ thing after the colon).\n\nYou don't technically need to give your function\
    \ a docstring, but you should; the docstring is available at runtime as an attribute\
