    Python 3.x 与使用 2.x 版本编写的程序不兼容。然而，你从学习 2.x 版本中获得的大部分知识仍然适用。这只是意味着当你开始使用 3.0 版本时，必须意识到语言的变化。此外，2.x
    版本的安装基数很大，在很长一段时间内不会消失。由于大多数 Linux 发行版（以及 Mac OS X）默认安装的仍然是较旧版本的 Python（有些甚至旧到
    v2.4），本书中的许多代码示例是针对 Python 2.x 编写的。在关于 **19** 的章节中，特别指出了 2.x 和 3.x 之间的重大变化，但学习任何一个版本都不会对你造成伤害。


    你可以从 *Python 网站* 下载 Python（适用于 Windows），或者如果你使用的是 Mac、Linux 或 *BSD，它可能已经安装在你的系统上。然而，类
    Unix 操作系统（包括 OS X）可能没有最新版本，因此你可能希望升级，至少升级到 2.6 版本。2.6 版本是 2.5 的修改版，允许同时使用 2.x
    代码和某些 3.0 功能。基本上，它允许你以“遗留”风格进行编码，同时仍能根据需要使用的最新功能，并测试哪些遗留功能在迁移到 3.0 时会失效。


    对于希望通过 USB 拇指驱动器使用 Python 的用户，可能会对 *Portable Python* 感兴趣。这是一个自包含的 Python 环境，你可以直接从拇指驱动器运行，也可以安装到你的计算机上。这对于那些不能或不想安装
    Python 但仍希望使用它的人很有用。


