    used but if you ever need to use them, check the documentation first.


    # Chapter 6


    # Strings


    Strings in programming are simply text, either individual characters, words, phrases,
    or complete sentences. They are one of the most common elements to use when programming,
    at least when it comes to interacting with the user. Because they are so common,
    they are a native data type within Python, meaning they have many powerful capabilities
    built-in. Unlike other languages, you don''t have to worry about creating these
    capabilities yourself. This is good because the built-in ones have been tested
    many times over and have been optimized for performance and stability.


    Strings in Python are different than most other languages. First off, there are
    no char types, only single character strings (char types are single characters,
    separate from actual strings, used for memory conservation). Strings also can''t
    be changed in-place; a new string object is created whenever you want to make
    changes to it, such as concatenation. This simply means you have to be aware that
    you are not manipulating the string in memory; it doesn''t get changed or deleted
    as you work with it. You are simply creating a new string each time.


    Here''s a list of common string operations:


    - `s1 = '' ''`: empty string

    - `s2 = "knight''s"`: double quotes

    - `block = """ - """`: triple-quoted block

    - `s1 + s2`: concatenate (combine)

    - `s2 * 3`: repeat the string a certain number of times

    - `s2[n]`: index (the position of a certain character)

    - `len(s2)`: get the length of a string

    - `"a %\s parrot" % ''dead''`: string formatting (deprecated in Python 3.x)

    - `"a {} parrot".format("dead")`: string formatting (Python 3.x)

    - `for x in s2`: iteration (sequentially move through the string''s characters)

    - `''m'' in s2`: membership (is there a given character in the string?)


    Empty strings are written as two quotes with nothing in between. The quotes used
    can be either single or double; my preference is to use double quotes since you
    don''t have to escape the single quote to use it in a string. That means you can
    write a statement like


    “And then he said, ‘No way’ when I told him.”


    If you want to use just one type of quote mark all the time, you have to use the
    backslash character to “escape” the desired quote marks so Python doesn''t think
    it''s at the end of the phrase, like this:


    “And then he said, \"No way\" when I told him.”


    Triple quoted blocks are for strings that span multiple lines, as shown last chapter.
    Python collects the entire text block into a single string with embedded newline
    characters. This is good for things like writing short paragraphs of text, e.g.
    instructions, or for formatting your source code for clarification.


    ## 6.1 Basic string operations


    The "++" and "*" operators are overloaded in Python, letting you concatenate and
    repeat string objects, respectively. Overloading is just using the same operator
    to do multiple things, based on the situation where it''s used. For example, the
    “+” symbol can mean addition when two numbers are involved or, as in this case,
    combining strings.


    Concatenation combines two (or more) strings into a new string object whereas
    repeat simply repeats a given string a given number of times. Here are some examples:


    **Listing 6.1: Operator overloading**


    ```python

    >>> len(''abc'') # length: number items

    3

    >>> ''abc'' + ''def'' # concatenation: a new string

    ''abcdef''

    >>> ''Ni!'' * 4 # multiple concatenation: "Ni!" + "Ni!" + ...

    ''Ni!Ni!Ni!Ni!''

    ```


    You need to be aware that Python doesn''t automatically change a number to a string,
    so writing "spam" + 3 will give you an error. To explicitly tell Python that a
    number should be a string, simply tell it. This is similar to casting values in
    C/C++. It informs Python that the number is not an integer or floating point number
    but is, in reality, a text representation of the number. Just remember that you
    can no longer perform mathematical functions with it; it''s strictly text.


    **Listing 6.2: Casting a number to a string**


    ```python

    >>> str(3) # converts number to string

    ```


    Iteration in strings is a little different than in other languages. Rather than
    creating a loop to continually go through the string and print out each character,
    Python has a built-in type for iteration. Here''s an example followed by an explanation:


    **Listing 6.3: Iteration through a string**


    ```python

    >>> myjob = "lumberjack"

    >>> for c in myjob: print c, # step through items

    ... l u m b e r j a c k

    >>> "k" in myjob # 1 means true

    1

    ```


    Essentially what is happening is that Python is sequentially going through the
    variable "myjob" and printing each character that exists in the string. for statements
    will be covered in depth later in the book but for now just be aware that they
    are what you use to step through a range of values. As you can see they can be
    used for strings or, more often, numbers.


    The second example is simply a comparison. Does the letter “k” exist in the value
    stored by “myjob”? If yes, then Python will return a numeric value of 1, indicating
    yes. If “k” didn’t exist, it would return a 0. This particular case is most often
    used in word processing applications, though you can probably think of other situations
    where it would be useful.


    ## 6.2 Indexing and slicing strings


    Strings in Python are handled similar to arrays in C. Unlike C arrays, characters
    within a string can be accessed both front and backwards. Front-ways, a string
    starts of with a position of 0 and the character desired is found via an offset
    value (how far to move from the end of the string). However, you also can find
    this character by using a negative offset value from the end of the string. I
    won’t go deeply into it, but here’s a quick example:


    **Listing 6.4: String indexing**


    ```python

    >>> S = "spam"

    >>> S[0], S[-2] # indexing from the front and rear

    (''s'', ''a'')

    ```


    Indexing is simply telling Python where a character can be found within the string.
    Like many other languages, Python starts counting at 0 instead of 1. So the first
    character’s index is 0, the second character’s index is 1, and so on. It’s the
    same counting backwards through the string, except that the last letter’s index
    is -1 instead of 0 (since 0 is already taken). Therefore, to index the final letter
    you would use -1, the second to the last letter is -2, etc. Knowing the index
    of a character is important for slicing.


    Slicing a string is basically what it sounds like: by giving upper and lower index
    values, we can pull out just the characters we want. A great example of this is
    when processing an input file where each line is terminated with a newline character;
    just slice off the last character and process each line. You could also use it
    to process command-line arguments by "filtering" out the program name. Again,
    here''s an example:


    **Listing 6.5: String slicing**


    ```python

    >>> S = "spam"

    >>> S[1:3], S[1:], S[:-1]    # slicing: extract section

    (''pa'', ''pam'', ''spa'')

    ```


    You''ll notice that the colon symbol is used when slicing. The colon acts as a
    separator between the upper and lower index values. If one of those values is
    not given, Python interprets that to mean that you want everything from the index
    value to the end of the string. In the example above, the first slice is from
    index 1 (the second letter, inclusive) to index 3 (the 4th letter, exclusive).
    You can consider the index to actually be the space before each letter; that''s
    why the letter “m” isn''t included in the first slice but the letter “p” is.


    The second slice is from index 1 (the second letter) to the end of the string.
    The third slice starts at the end of the string and goes backwards.


