    \           \"Square root of negative number not permitted\"\n\n    return math.sqrt(number)\n\
    ```\n\n第一行创建了自定义异常 `NegativeNumberError`，它继承自 `ArithmeticError`。因为它继承了基础异常的所有特性，你不需要定义其他内容，因此使用了表示不执行任何操作的\
    \ `pass` 语句。然后，为了使用新的异常，创建了一个函数（`squareRoot()`），如果参数值小于 0，则引发 `NegativeNumberError`；否则，它返回该数的平方根。\n\
