    \nYou can document a Python object by giving it a docstring. A docstring is simply\
    \ a triple-quoted sentence giving a brief summary of the object. The object can\
    \ be a function, method, class, etc. (In this section, the term “function” is\
    \ used to signify an actual function or a method, class, or other Python object.)\n\
    \nListing 12.1: docstring example\n\n```\ndef buildConnectionString (params):\n\
    \n    \"\"\" Build a connection string from a dictionary of parameters.\n\n  \
    \  Returns string. \"\"\"\n```\n\nAs noted previously, triple quotes signify a\
