    \ 中没有 *switch* 或 *case* 语句。你可以通过使用 *if/elif* 测试、搜索列表或索引字典来获得相同的功能。由于列表和字典是在运行时构建的，它们可以更具灵活性。这里是一个使用字典作为等效\
