    \n- **list.index(x)**\n  – 返回列表中第一个值为 x 的项的索引。如果不存在该项，则引发错误。\n\n- **list.count(x)**\n\
    \  – 返回 x 在列表中出现的次数。\n\n- **list.sort()**\n  – 就地对列表中的项进行排序。\n\n- **list.reverse()**\n\
    \  – 就地反转列表中的元素。\n\n## 附录 C\n### 字典操作\n这些操作以及字典的一般完整文档可以在 Python 文档中找到。\n\n- **len(d)**\n\
    \  – 返回字典 d 中项的数量。\n\n- **d[key]**\n  – 返回 d 中以 key 为键的项。如果 key 不在映射中，则引发 KeyError。\n\
    \n- **d[key] = value**\n  – 将 d[key] 设置为 value。\n\n- **del d[key]**\n  – 从 d 中移除\
    \ d[key]。如果 key 不在映射中，则引发 KeyError。\n\n- **key in d**\n  – 如果 d 有键 key，则返回 True，否则返回\
    \ False。\n\n- **key not in d**\n  – 等效于 not key in d。\n\n- **clear()**\n  – 移除字典中的所有项。\n\
    \n- **copy()**\n  – 返回字典的浅拷贝。\n\n- **fromkeys(seq[, value])**\n  – 创建一个新字典，其键来自\
    \ seq，值设置为 value。\n  – fromkeys() 是一个类方法，返回一个新字典。value 默认为 None。\n\n- **get(key[,\
    \ default])**\n  – 如果 key 在字典中，则返回 key 的值，否则返回 default。如果未提供 default，则默认为 None，因此该方法从不引发\
    \ KeyError。\n\n- **items()**\n  – 返回字典的 (key, value) 对列表的副本。注意：键和值的列表顺序是任意的，非随机的，因\
    \ Python 实现而异，并取决于字典的插入和删除历史。如果调用 items()、keys()、values()、iteritems()、iterkeys()\
    \ 和 itervalues() 且中间没有对字典进行修改，则这些列表将直接对应。这使得可以使用 zip() 创建 (value, key) 对：pairs\
    \ = zip(d.values(), d.keys())。iterkeys() 和 itervalues() 方法也保持相同的关系：pairs = zip(d.itervalues(),\
    \ d.iterkeys()) 为 pairs 提供相同的值。创建相同列表的另一种方式是 pairs = [(v, k) for (k, v) in d.iteritems()]。\n\
    \n- **iteritems()**\n  – 返回用于遍历字典 (key, value) 对的迭代器。参见 dict.items() 的注意事项。\n\n\
    - **iterkeys()**\n  – 返回用于遍历字典键的迭代器。参见 dict.items() 的注意事项。\n\n- **itervalues()**\n\
    \  – 返回用于遍历字典值的迭代器。参见 dict.items() 的注意事项。\n\n- **keys()**\n  – 返回字典的键列表的副本。参见\
    \ dict.items() 的注意事项。\n\n- **pop([key[, default]])**\n  – 如果 key 在字典中，移除它并返回其值，否则返回\
    \ default。如果未提供 default 且 key 不在字典中，则引发 KeyError。\n\n- **popitem()**\n  – 从字典中移除并返回一个任意的\
    \ (key, value) 对。\n  – popitem() 有助于以破坏性的方式迭代字典，常用于集合算法。如果字典为空，调用 popitem() 将引发\
