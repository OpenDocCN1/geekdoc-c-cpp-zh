    # 13.1 Making Python Do Something


    So far I''ve talked about how Python is structured and how it differs from other
    languages. Now it''s time to make some real programs. To begin with, Python programs
    are comprised of functions, classes, modules, and packages.


    +   1. Functions are programmer created code blocks that do a specific task.

    2. Classes are object-oriented structures that I''ll talk about later; suffice
    to say they are pretty powerful structures that can make programming life easier,
    though they can be difficult to learn and wield well.

    3. Modules are generally considered normal program files, i.e. a file comprised
    of functions/classes, loops, control statements, etc.

    4. Packages are programs made up of many different modules.


    In reality, I consider modules and packages to be "programs". It just depends
    on how many separate files are required to make the program run. Yes, it is possible
    to have a single, monolithic file that controls the entire program but it''s usually
