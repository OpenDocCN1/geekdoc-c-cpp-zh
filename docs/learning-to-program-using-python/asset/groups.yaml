  mdcn: "\n\n## 15.6 关于风格\n\n如前所述，Python 有一种被视为编写 Python 程序“正确”方式的特定“风格语法”。PEP 8 是描述所有“被认可”编写方式的文档。其中一点是关于如何命名类、函数、方法等。\n\
