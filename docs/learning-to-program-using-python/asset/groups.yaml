    SELECT * FROM Tools\")\nfor row in cursor:\n    print(\"_\" * 10)\n    print(\"\
    ID:\", row[0])\n    print(\"Name:\", row[1])\n    print(\"Size:\", row[2])\n \
    \   print(\"Price:\", row[3])\n    print(\"-\" * 10)\n```\n\n这给出了以下内容：\n\n清单 17.9：“美观打印”数据的输出\n\
