    ## 第二部分


    ## 图形用户界面


    ### 第 20 章


    #### 图形用户界面概述


    #### 20.1 简介


    图形用户界面（GUI）在如今的计算机中非常流行。你很少能找到没有某种图形界面的程序。大多数非图形程序可以在 \*nix 操作系统中找到；即便这样，那些程序通常也是较旧的，开发者不想要（或未意识到需要）图形界面。


    除非你是高级用户或对使用命令行工具感到非常自在，否则你将通过图形界面与计算机交互。图形界面意味着程序创建通常被称为“窗口”的东西。这个窗口由“控件”填充，它们是
    GUI 的基本构建模块。控件是使 GUI 可用的组件，例如关闭按钮、菜单项、滑块、滚动条等。基本上，用户可以看到的任何东西都是控件。


    由于大多数人习惯使用窗口来操作计算机，了解如何创建 GUI 是值得的。虽然制作命令行程序更容易且通常更快，但很少有人会使用它。人类是视觉动物，人们喜欢“花哨”的东西。因此，在程序上添加精美的图形界面使人们更容易使用它，即使命令行使用更快/更方便。


    有许多可用的 GUI 开发工具。一些最流行的是 Qt、GTK、wxWidgets 和 .NET。除了 MFC 之外，它们都是跨平台的，这意味着你可以在任何操作系统上开发程序，并知道它将在其他任何操作系统上运行。然而，一些在
    Microsoft Visual Studio 中创建的程序只能在 Microsoft Windows 上运行。


    #### 20.2 流行的 GUI 框架


    虽然本教程将专注于 wxPython（一个基于 wxWidgets 的 GUI 库），但我将简要介绍其他几个图形库。作为免责声明，我熟悉的 GUI 库只有
    wxPython 和 Tkinter；下面的一些信息可能不正确或过时，但据我所知，这些内容是准确的。


    - Qt- 基于 Trolltech（随后被诺基亚收购）的技术，Qt 是跨平台开发最流行的库之一。它是 KDE 桌面的主要图形库。Qt 提供多种许可协议，主要的是用于商业和开源用途的许可。如果你的应用程序是商业性质的，即闭源的，你必须支付许可费才能使用它。如果你的应用程序将是开源的，你可以使用
    GPL 许可协议；但是，如果不上升许可协议，你将无法将程序商业化。Qt 包含一个图形布局工具，允许用户通过拖放图形控件快速设计界面。或者，开发人员可以手动编写界面布局代码。Qt
    还支持非 GUI 功能，包括 SQL 数据库访问、XML 解析、网络支持等。Qt 是用 C++ 编写的，但可通过 PyQt 获得 Python 绑定。


    - GTK+- 最初是为开发 GIMP 图像处理软件而创建的（GTK 代表 GIMP Tool Kit），GTK+ 演变成了驱动 GNOME 桌面的图形库。许多为
