    \ Python 实现跨平台。Java 是另一种使用字节码的语言。\n\n然而，因为 Python 使用解释器而不是编译器，代码处理可能会更慢。字节码仍然需要被“解码”以供处理器使用，这需要额外的时间。但这种做法的好处是，程序员可以立即看到代码的结果。他不必等待编译器决定代码中是否存在某个导致程序崩溃的语法错误。\n\
    \n## 2.1.3 原型开发\n\n由于是解释型的，Python 和类似的语言被用于快速应用程序开发和程序原型制作。例如，一个简单的程序可以在短短几小时内创建出来，并在同一次拜访中展示给客户。\n\
    \n程序员可以反复修改程序并快速查看结果。这使得他们能够尝试不同的想法并查看哪一个最好，而无需在死胡同上投入大量时间。这也适用于创建图形用户界面（GUI）。因为\
    \ Python 不仅提供了多种不同的 GUI 库，还默认包含一个简单的库（*Tkinter*），所以简单的“草图”可以在几分钟内布局完成。\n\n没有编译器的另一个好处是，Python\
    \ 解释器会立即生成错误。根据开发环境的不同，它会在你开发代码时自动阅读代码并通知你语法错误。逻辑错误不会被指出，但简单的鼠标点击即可启动程序并展示最终产品。如果某些地方不对，你只需进行更改并再次点击启动按钮即可。\n\
    \n## 2.1.4 过程式与面向对象编程\n\nPython 在开发程序时提供了一个相当独特的选择：过程式编程或面向对象编程。事实上，你可以在同一个程序中混合使用两者。\n\
    \n简而言之，过程式编程是一种以某种线性方式开发程序的逐步过程。函数（有时称为子例程）在特定时刻被程序调用以执行某些处理，然后控制权返回主程序。C 和 BASIC\
    \ 是过程式语言。\n\n面向对象编程（OOP）就是那样：使用对象进行编程。对象由不同的编程逻辑单元创建；变量和方法（OOP 中对函数的称呼）被组合成对象，以执行特定的任务。例如，你可以对一个机器人进行建模，每个身体部件都是一个独立的对象，能够执行不同的功能，但仍然是整体对象的一部分。OOP\
    \ 在 GUI 开发中也大量使用。\n\n就个人而言，我觉得过程式编程更容易学习，尤其是在一开始。思维过程主要是直接的，本质上也是线性的。在我开始学习 Python\
    \ 之前，我从未理解过 OOP；理解它可能是一件困难的事情，特别是在你仍在弄清楚如何让程序首先正常运行的时候。\n\n本书后面部分将更详细地讨论过程式编程和\
    \ OOP。每个主题都将拥有自己的章节，希望你会看到它们如何建立在熟悉的概念之上。\n\n# 第 3 章 编程语言比较\n\n对于新程序员来说，本书中的一些术语可能是不熟悉的。当你读完这本书时，你应该对它们有更好的了解。然而，你也可能对存在的各种编程语言不熟悉。本章将展示一些目前程序员使用的更流行的语言。这些程序旨在展示每种语言如何被用来创建相同的输出。你会发现，Python\
    \ 程序比其他程序显著地简单。\n\n下面的代码示例都展示了歌曲“墙上有 99 瓶啤酒”（它们已被重新格式化以适合页面）。你可以在官方 99 Bottles\
    \ 网站找到更多内容：[http://99-bottles-of-beer.net](http://99-bottles-of-beer.net)。我无法保证这些程序中的每一个都是有效的并且实际能正确运行，但至少你能了解每种语言看起来是怎样的。你还应该意识到，一般来说，空白对于编程语言来说并不重要（Python\
    \ 是少数例外之一）。这意味着下面所有的程序都可以写在一行上，放入一个巨大的列中，或者任何其他组合。这就是为什么有些人讨厌 Python，因为它迫使他们拥有结构化的、可读的代码。\n\
    \n## 3.1 C\n\n```c\n/*\n * 99 bottles of beer in ansi c\n * by Bill Wein: bearheart@bearnet.com\n\
    \ *\n */\n#define MAXBEER (99)\nvoid chug(int beers);\n\nmain()\n{\n  register\
    \ beers;\n  for(beers = MAXBEER; beers; chug(beers--))\n      puts(\"\");\n  puts(\"\
    \\nTime to buy more beer!\\n\");\n  exit(0);\n}\n\nvoid chug(register beers)\n\
    {\n  char howmany[8] , *s;\n  s = beers != 1 ? \"s\" : \"\";\n  printf(\"%d bottle%s\
    \ of beer on the wall,\\n\", beers, s);\n  printf(\"%d bottle%s of beeeeer . .\
    \ . ,\\n\", beers, s);\n  printf(\"Take one down, pass it around,\\n\");\n\n \
    \ if(--beers) sprintf(howmany, \"%d\", beers); else\n      strcpy(howmany, \"\
    No more\");\n  s = beers != 1 ? \"s\" : \"\";\n  printf(\"%s bottle%s of beer\
    \ on the wall.\\n\", howmany, s);\n}\n```\n\n"
