    对我来说是一门语言。


    为了更有动力去学习这门语言，我决定将童年玩过的角色扮演游戏重新创建为计算机游戏。这样不仅让我有了学习语言的理由，而且希望最终能产出一些有用的东西，供他人娱乐使用。


    ## 1.1 为什么选择 Python？


    Python 被视为一款很棒的业余爱好编程语言，但它同时也是一门功能极其强大的语言。它支持 C/C++ 和 Java 绑定，因此可用于整合大型项目或进行快速原型开发。它通过
    Tkinter 内置了图形用户界面（GUI）库，使程序员能够以极低的成本创建简单的图形界面。不过，还有其他更强大、更完善的 GUI 构建工具可用，例如 Qt
    和 GTK+。IronPython 是一个基于 .NET 框架的 Windows 版 Python，也适用于使用 Microsoft Visual Studio
    产品的用户。Python 还可以用于实时解释器中，以便在将代码片段添加到常规“可执行文件”之前进行测试。


    Python 被归类为脚本语言。一般来说，这意味着它不会被编译成机器可读的代码，而是作为控制例程“嵌入”到另一个程序中。诸如 C++ 等编译语言要求程序员在软件被计算机使用之前，先通过编译器运行源代码。根据程序的大小，编译过程可能需要几分钟到几个小时。


    使用 Python 作为控制例程意味着 Python 可以在不同的程序之间充当“胶水”。例如，Python 常被用作视频游戏的脚本语言；虽然繁重的工作由预编译模块完成，但
    Python 可以以调用/响应的方式运行，例如获取控制器输入并将其传递给相应的模块。


    Python 也被认为是一种高级语言，这意味着它处理了大量编程中繁琐的基础工作。例如，Python 内置了垃圾回收器，因此作为程序员，你无需过多担心内存管理和内存泄漏——这是使用
    C 等较旧语言时常见的问题。


    Python 的主要重点在于代码的可读性以及提高程序员的生产力。这是通过强制执行一种严格的代码结构方式来实现的，以确保读者能够遵循逻辑流程，并秉持“万事俱备”的理念；程序员无需担心包含许多不同的库或其他源代码才能使程序运行。


    反对 Python 的主要论点之一是空格的使用。如第 3 章所示，许多其他语言要求程序员使用括号（通常是大括号，即“{}”）来识别不同的代码块。而在 Python
    中，这些代码块是通过不同的缩进量来识别的。


    那些长期接触“传统”语言的人可能觉得缺少括号是个缺点，而其他人则更喜欢空格。归根结底，这取决于个人喜好。我恰好喜欢没有括号这一点，因为当出现编码问题时，这减少了我需要排查的一项内容。想象一下，几十甚至几百行代码中缺失的一个括号导致程序无法运行。再想象一下，你不得不逐行检查代码以找到那个缺失的括号。（是的，编程环境可以提供帮助，但这仍然是一件需要额外考虑的事情。）


    ## 1.2 为什么还有另一份教程？


    尽管 Python 网站（http://www.python.org）上有几份优秀的教程，此外还有很多书籍，但我将侧重于该语言的实用特性，即我不会深入探讨语言的历史或其玄奥的用法。虽然如果你有编程经验，或者至少能理解编程逻辑和程序流程会很有帮助，但我将尽量确保内容开始时节奏缓慢，以免让你感到困惑。


    本书的主要目的是教人如何编程；Python 恰好是我选择使用的语言。如上所述，它是一门非常友好的语言，让你能在不被阻碍的情况下学习编程。大多数人决定学习编程时，往往想直接跳入
    C、C++ 或 Java。然而，这些语言存在许多“陷阱”，可能会使学习变得困难，并劝退人们继续编程。我的目标是以有趣、友好的方式呈现编程，从而激发你进一步学习的欲望。


    ## 1.3 获取 Python


