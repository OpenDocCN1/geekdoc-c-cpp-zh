    # 2.1.4 Procedural vs. Object-Oriented Programming


    Python is somewhat unique in that you have two choices when developing your programs:
    procedural programming or object-oriented. As a matter of fact, you can mix the
    two in the same program.


    Briefly, procedural programming is a step-by-step process of developing the program
    in a somewhat linear fashion. Functions (sometimes called subroutines) are called
    by the program at times to perform some processing, then control is returned back
    to the main program. C and BASIC are procedural languages.


    Object-oriented programming (OOP) is just that: programming with objects. Objects
    are created by distinct units of programming logic; variables and methods (an
    OOP term for functions) are combined into objects that do a particular thing.
    For example, you could model a robot and each body part would be a separate object,
    capable of doing different things but still part of the overall object. OOP is
    also heavily used in GUI development.


    Personally, I feel procedural programming is easier to learn, especially at first.
    The thought process is mostly straightforward and essentially linear. I never
    understood OOP until I started learning Python; it can be a difficult thing to
    wrap your head around, especially when you are still figuring out how to get your
    program to work in the first place.


    Procedural programming and OOP will be discussed in more depth later in the book.
    Each will get their own chapters and hopefully you will see how they build upon
    familiar concepts.'
