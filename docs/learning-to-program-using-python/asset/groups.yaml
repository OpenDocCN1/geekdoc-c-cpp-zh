    \ 或 MySQL。\n\n然而，这并不意味着 SQLite 没有用。在你引入完整的数据库之前，它非常适合用于应用程序的原型设计；这样你就知道你的程序是如何工作的，并且任何问题很可能都出在数据库实现上。对于不需要完整数据库包及其相关开销的小型程序，它也非常有用。\n\
    \n那么，你如何使用 Python 结合 SQLite？我会向你展示。\n\n## 17.5 创建 SQLite 数据库\n\n由于 SQLite 内置于\
    \ Python 中，你可以像导入任何其他库一样简单地导入它。导入后，你必须建立与它的连接；这会创建数据库文件。游标（cursor）是 SQLite 内部的对象，执行了你将要针对数据库进行的大部分操作。\n\
    \n清单 17.5：创建 SQLite 数据库\n\n```python\nimport sqlite3 # SQLite v3 是目前 Python 包含的版本\n\
    connection = sqlite3.connect(\"Hand_tools.db\") # .db 扩展名是可选的\ncursor = connection.cursor()\n\
    \n# 仅在内存中创建数据库的替代方案\n# mem_conn = sqlite3.connect(\":memory:\")\n# cursor = mem_conn.cursor()\n\
    \ncursor.execute(\"\"\"CREATE TABLE Tools\n(id INTEGER PRIMARY KEY,\nname TEXT,\n\
    size TEXT,\nprice INTEGER)\"\"\")\n\nfor item in (\n    (None, \"Knife\", \"Small\"\
    , 15),      # 末尾的逗号是必需的，用于分隔元组项\n    (None, \"Machete\", \"Medium\", 35),\n  \
    \  (None, \"Axe\", \"Large\", 55),\n    (None, \"Hatchet\", \"Small\", 25),\n\
    \    (None, \"Hammer\", \"Small\", 25),\n    (None, \"Screwdriver\", \"Small\"\
    , 10),\n    (None, \"Prybar\", \"Large\", 60),\n):\n    cursor.execute(\"INSERT\
    \ INTO Tools VALUES (?, ?, ?, ?)\", item)\n\nconnection.commit()    # 将数据写入数据库\n\
    cursor.close() # 关闭数据库\n```\n\n上述代码创建了一个简单的单表数据库，包含一组手动工具。请注意用于向表中插入项的问号。问号用于防止\
    \ SQL 注入攻击，在这种攻击中，SQL 命令作为合法值传递给数据库。数据库程序会将该命令作为一个正常的合法命令进行处理，这可能会删除数据、更改数据或以其他方式损害你的数据库。问号作为替换值，以防止这种情况发生。\n\
    \n你还会注意到在内创建数据库的能力。这对于测试很有用，当你不想花时间写入磁盘或担心目录时。如果你有足够多的内存，你也可以为你的最终产品完全在内创建数据库；然而，如果你断电或遇到其他内存问题，你将丢失整个数据库。我仅在测试初始实现以确保语法和格式正确时使用\
    \ RAM 数据库。一旦我验证它以我想要的方式工作，我就会将其更改为创建基于磁盘的数据库。\n\n## 17.6 从数据库中提取数据\n\n要从 SQLite\
