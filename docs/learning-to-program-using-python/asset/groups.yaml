    : #可选条件\n   landscape_list = [\"pink flamingo\"]\nelse: #可选的最终条件\n   print \"\
    No more money to remodel\"\n```\n\n拥有 *elif* (else/if) 或 *else* 语句并非必要，但我喜欢在我的代码块中包含\
