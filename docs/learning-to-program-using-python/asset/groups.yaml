    \ also shows the source code in an interactive environment; you can test different\
    \ ideas within the demonstration code and see what happens to the resulting GUI.\n\
    \nwxPython has several standard, built-in frames and dialogs. Frames include a\
    \ multiple document interface (having files of the same type contained within\
    \ the parent window, rather than separate windows) and a wizard class for making\
    \ simple user walk-throughs.\n\nIncluded dialogs range from simple “About” boxes\
    \ and file selections to color pickers and print dialogs. Simple modifications\
    \ to the source code makes them plug & play-ready for your application.\n\nThe\
    \ main group of objects you will be using are the core widgets and controls. These\
    \ are what you will use to build your GUI. This category includes things like\
    \ buttons, check boxes, radio buttons, list boxes, menus, labels, and text boxes.\
    \ As before, the wxPython demo shows how to use these items.\n\nThere are also\
    \ many different tools shown in the wxPython demo.\n\nMost of them you will probably\
    \ never use, but it's nice to know wxPython includes them and there is some source\
    \ code for you to work with.\n\nOne thing I've noticed, however, is that the sample\
    \ demonstrations don't always show how to best to use the widgets. For example,\
    \ the wizard demo certainly displays a simple wizard with previous/next buttons.\
    \ But it doesn't have any functionality, such as accepting input from the user\
