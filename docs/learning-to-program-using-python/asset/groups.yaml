    ```\n\n这会返回以下列表：\n\n清单 17.7：返回的数据\n\n- Knife, Small, 15\n- Machete, Medium, 35\n\
    - Axe, Large, 55\n- Hatchet, Small, 25\n- Hammer, Small, 25\n- Screwdriver, Small,\
