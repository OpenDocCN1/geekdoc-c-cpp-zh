    - The default value for division (e.g. 1/2) is to return a float value. To have
    truncating behavior, i.e. return just the whole number, you must use a double
    forward slash: 1//2.

    - All text (a.k.a. “strings”) is Unicode; 8-bit strings are no longer.

    - “!=” is the only way to state “not equal to”; the old way (“<>”) has been removed.

    - Calling modules from within functions is essentially gone. The statement “from
    module import *” can only be used at the module level, not in functions.

    - String formatting has been changed, removing the need for the “%” formatting
    operator.

    - The exception APIs have been changed to clean them up and add new, powerful
    features.

    - raw_input() has been changed to just input().

    - The C language API has been modified, such as removing support for several operating
    systems.


    If you need to port Python 2.x code to version 3.0, there is a simple utility
    called “2to3” that will automatically correct and modify the legacy code to the
    new version. Generally speaking, you simply call the 2to3 program and let it run;
    it is robust enough to handle the vast majority of code changes necessary. However,
    the library is flexible enough to allow you to write your own “fixer” code if
    something doesn''t work correctly.


    ## Part II


    ## Graphical User Interfaces


    ### Chapter 20


    #### Overview of Graphical User Interfaces


    #### 20.1 Introduction


    Graphical user interfaces (GUIs) are very popular for computers nowadays. Rarely
    will you find a program that doesn''t have some sort of graphical interface to
    use it. Most non-graphical programs will be found in \*nix operating systems;
    even then, those programs are usually older ones where the programmer didn''t
    want (or see the need for) a graphical interface.


    Unless you are a power-user or feel very comfortable using command-line tools,
    you will interact with your computer via a graphical interface. A graphical interface
    entails the program creating what is commonly called a "window". This window is
    populated by "widgets", the basic building blocks of a GUI. Widgets are the pieces
    of a GUI that make it usable, e.g. the close button, menu items, sliders, scrollbars,
    etc. Basically, anything the user can see is a widget.


    Because most people are used to using windows to manipulate their computer, it''s
    worthwhile to know how to create a GUI. Though it''s easier and often faster to
    make a command-line program, very few people will use it. Humans are visual creatures
    and people like “flashy” things. Hence, putting a nice graphical interface on
    your program makes it easier for people to use, even if it''s faster/easier to
    use the command line.


    There are many GUI development tools available. Some of the most popular are Qt,
    GTK, wxWidgets, and .NET. All but MFC are cross-platform, meaning you can develop
    your program in any operating system and know that it will work in any other operating
    system. However, some programs created in Microsoft’s Visual Studio will only
    run on Microsoft Windows.


    #### 20.2 Popular GUI Frameworks


    Though this tutorial will focus on wxPython, a GUI library based on wxWidgets,
    I will give a brief rundown of several other graphical libraries. As a disclaimer,
    the only GUI libraries I am familiar with are wxPython and Tkinter; some information
    below may be incorrect or outdated but is correct to the best of my knowledge.


    - Qt- Based upon technology from Trolltech (and subsequently purchased by Nokia),
    Qt is one of the most popular libraries for cross-platform development. It is
    the main graphical library for the KDE desktop. Qt has several licenses available,
    with the main ones being for commercial and open-source use. If your application
    will be commercial, i.e. closed-source, you have to pay for a license to use it.
    If your application will be open-sourced, then you can use the GPL license; however,
    you will be unable to commercialize your program without “upgrading” the license.
    Qt includes a graphical layout utility, allowing the user to drag & drop graphical
    widgets for quick design of the interface. Alternatively, the developer can hand-code
    the interface layout. Qt also support non-GUI features, including SQL database
    access, XML parsing, network support, et al. Qt is written in C++ but a Python
    binding is available via PyQt.


    - GTK+- Originally created for development of the GIMP image software (GTK stands
    for GIMP Tool Kit), GTK+ evolved into the graphical library that powers the GNOME
    desktop. Many of the applications written for KDE will run on GNOME and vice versa.
    GTK+ is open-sourced under the GPL license. This was intentional by the creators.
    When Qt was chosen to power the KDE desktop, Trolltech had a proprietary license
    for it. Because this goes against the Free Software philosophy, GTK was created
    to allow people to use the GNOME desktop and GTK applications as open-source software.
    GTK doesn’t necessarily have a built-in drag & drop interface, though the wxGlade
    utility provides this functionality. The original GTK was written in C while GTK+
    is written in C++, using OOP practices. PyGTK is the Python binding for GTK+.


    - wxPython- wxPython is a Python-implementation of wxWidgets, meaning Python programs
    interact with Python wrappers of the underlying C/C++ code. wxWidgets is a general
    purpose GUI library originally developed for use with C/C++ programs. wxPython
    is Free/Open Source Software (FOSS), licensed under the GPL. Programs written
    with wxPython use the native widgets of an operating system, so the programs don’t
    look out of place.


    - Tkinter- A graphical library created for the Tcl/Tk language. Tkinter is the
    default GUI library for Python development due to it’s inclusion in the core Python
    language. Tkinter programs don’t necessarily “blend in” with other applications,
    depending on operating system. Some of the widgets can look like older versions
    of Windows, which some developers feel is an issue. The Tkinter toolset is fairly
    limited but easy to learn, making it easy to make simple GUI programs in Python.


    - MFC/.NET- These two libraries were created by Microsoft for Windows development.
    MFC is the GUI library used with C++ programs while .NET is used with .NET languages,
    such as C# and VB.NET. Unlike the previous libraries mentioned, MFC is not cross-platform.
    Some open-source projects, like Mono, have been started to use the .NET framework
