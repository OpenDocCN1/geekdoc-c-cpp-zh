    ''lumberjack''

    ```


    其他语言通常要求程序员在初始创建变量时决定变量必须是什么类型。例如，C 语言要求你在上面的程序中声明 "x" 为 *int* 类型，"y" 为 *string*
    类型。从那时起，这些变量只能作为这些类型，即使你后来决定它们应该是不同的类型。


    这意味着当你开始你的程序时，你必须决定每个变量将是什么，即决定是否应将数字变量设为整数或浮点数。显然，你以后可以回去修改它们，但这只是你又得思考和记住的一件事。此外，任何时候你忘记某个变量是什么类型并尝试给它分配错误的值，你就会得到编译错误。


    ### 5.3 Python 数字


    Python 可以处理普通的长整数（最大长度根据操作系统确定，就像 C 语言一样）、Python 长整数（最大长度取决于可用内存）、浮点数（就像 C 语言的双精度浮点数）、八进制和十六进制数，以及复数（具有虚部数字）。以下是这些数字的一些示例：


    - 整数：12345, -32

    - Python 整数：999999999L (在 Python 3.x 中，所有整数都是 Python 整数)

    - 浮点数：1.23, 4e5, 3e-4

    - 八进制：012, 0456

    - 十六进制：0xf34, 0X12FA

    - 复数：3+4j, 2J, 5.0+2.5j


    Python 具有你预期的常规内置数值工具：表达式运算符 (*, >>, +, <, 等)、数学函数 (pow, abs, 等) 和实用工具 (rand,
    math, 等)。对于大量的数值计算，Python 有 Numeric Python (NumPy) 扩展，它包含矩阵数据类型等。如果需要，必须单独安装。由于它的强大功能和易用性相当于
    Mathematica、Maple 和 MatLab，它在科学和数学环境中被广泛使用。


    虽然这对非程序员可能没有太大意义，C 语言中的表达式运算符已被包含在 Python 中，但其中一些略有不同。逻辑运算符在 Python 中是用单词拼写出来的，而不是使用符号，例如，逻辑
