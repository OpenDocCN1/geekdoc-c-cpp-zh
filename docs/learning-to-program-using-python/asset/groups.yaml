    # ## 6.4 Combining and Separating Strings


    Strings can be combined (joined) and separated (split) quite easily. Tokenization
    is the process of splitting something up into individual tokens; in this case,
    a sentence is split into individual words. When a web page is parsed by a browser,
    the HTML, Javascript, and any other code in the page is tokenized and identified
    as a keyword, operator, variable, etc. The browser then uses this information
    to display the web page correctly, or at least as well as it can.


    Python does much the same thing (though with better results). The Python interpreter
    tokenizes the source code and identifies the parts that are part of the actual
    programming language and the parts that are data. The individual tokens are separated
    by delimiters, characters that actually separate one token from another.


    In strings, the main delimiter is a whitespace character, such as a tab, a newline,
    or an actual space. These delimiters mark off individual characters or words,
    sentences, and paragraphs. When special formatting is needed, other delimiters
    can be specified by the programmer.


    Joining strings combines the separate strings into one string. Because string
    operations always create a new string, you don''t have to worry about the original
    strings being overwritten. The catch is that it doesn''t concatenate the strings,
    i.e. joining doesn''t combine them like you would expect. Here''s an example:


    ```

    Listing 6.9: Joining strings

    ```python

    >>> string1 = "1 2 3"

    >>> string2= "A B C"

    >>> string3 = string2.join(string1)

    >>>print string3

    1A B C A B C2A B C A B C3

    ```

    ```'
