    ----------\nID: 10\nName: Axe\nSize: Large\nPrice: 55\n----------\n----------\n\
    ID: 11\nName: Hatchet\nSize: Small\nPrice: 25\n----------\n----------\nID: 12\n\
    Name: Hammer\nSize: Small\nPrice: 25\n----------\n----------\nID: 13\nName: Screwdriver\n\
    Size: Small\nPrice: 10\n----------\n----------\nID: 14\nName: Prybar\nSize: Large\n\
    Price: 60\n```\n\n显然，你可以调整格式以按你希望的方式呈现信息，例如提供带有标题的列，包括或移除某些字段等。\n\n## 17.7 SQLite\
    \ 数据库文件\n\nSQLite 将试图在每次运行程序时重新创建数据库文件。如果数据库文件已经存在，你将得到一个 “OperationalError” 异常，表明文件已经存在。处理这个问题最简单的方法只是捕获该异常并忽略它。\n\
    \n清单 17.10：处理现有数据库\n\n```python\ntry:\n    cursor.execute(\"CREATE TABLE Foo (id\
