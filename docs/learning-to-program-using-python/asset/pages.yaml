- pgno: 91
  md: 'Everything between the triple quotes is the function''s docstring, which documents
    what the function does. A docstring, if it exists, must be the first thing defined
    in a function (that is, the first thing after the colon).


    You don''t technically need to give your function a docstring, but you should;
    the docstring is available at runtime as an attribute of the function. Many Python
    IDEs use the docstring to provide context-sensitive documentation, so that when
    you type a function name, its docstring appears as a tooltip.


    From the Python Style Guide:


    > *“The docstring of a script should be usable as its ‘usage’ message, printed
    when the script is invoked with incorrect or missing arguments (or perhaps with
    a "-h" option, for "help"). Such a docstring should document the script''s function
    and command line syntax, environment variables, and files. Usage messages can
    be fairly elaborate (several screenfuls) and should be sufficient for a new user
    to use the command properly, as well as a complete quick reference to all options
    and arguments for the sophisticated user."*


    To be honest, I don''t adhere to this rule all the time. I normally write a short
    statement about what the function, method, class, etc. is supposed to accomplish.
    However, as my programs evolve I try to enhance the docstring, adding what inputs
    it gets and what the output is, if any.


    There are two forms of docstrings: one-liners and multi-line doc-strings. One-liners
    are exactly that: information that doesn''t need a lot of descriptive text to
    explain what''s going on. Triple quotes are used even though the string fits on
    one line to make it easy to later expand it. The closing quotes are on the same
    line as the opening quotes, since it looks better. There''s no blank line either
    before or after the docstring. The docstring is a phrase ending in a period. It
    describes the function''s effect as a command ("Do this", "Return that"). It should
    not restate the function''s parameters (or arguments) but it can state the expected
    return value, if present.


    Listing 12.2: Good use of docstring


    ```

    def kos_root():

    ```'
