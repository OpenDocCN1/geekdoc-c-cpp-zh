    implementations, and depends on the dictionary''s history of insertions and deletions.
    If items(), keys(), values(), iteritems(), iterkeys(), and itervalues() are called
    with no intervening modifications to the dictionary, the lists will directly correspond.
    This allows the creation of (value, key) pairs using zip(): pairs = zip(d.values(),
    d.keys()). The same relationship holds for the iterkeys() and itervalues() methods:
    pairs = zip(d.itervalues(), d.iterkeys()) provides the same value for pairs. Another
