- pgno: 128
  md: 'Listing 17.1: Returning data with SQL


    ```

    SELECT * FROM Customers_table

    ```


    The result should pretty look just like the table above; the command simply pulls
    everything from Customers_table and prints it. The printed results may be textual
    or have grid lines, depending on the environment you are using but the information
    will all be there.


    You can also limit the selection to specific fields, such as:


    Listing 17.2: Limiting results with SQL


    ```

    SELECT Last_name, First_name FROM Customers_table

    SELECT Address FROM Customers_table WHERE State == "NY"

    ```


    The second SQL query above uses the "WHERE" statement, which returns a limited
    set of information based on the condition specified. If you used the statement
    as written, you should only get back the addresses of customers who live in New
    York state. Obviously this is a good idea because it limits the results you have
    to process and it reduces the amount of memory being used. Many system slowdowns
    can be traced to bad DB queries that return too much information and consume too
    many resources.


    To combine the information from two tables, i.e. to harness the power of relational
    databases, you have to join the tables in the query.


    Listing 17.3: Joining database tables


    ```

    SELECT Last_name, First_name, Order_Number FROM Customers_table, Orders_table
    WHERE Customers_table.Index = Orders_table.Customer_ID

    ```


    This should give you something that looks like this:


    Listing 17.4: SQL query results


