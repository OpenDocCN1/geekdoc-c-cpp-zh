    |---|---|---|---|---|---|

    | 0 | Johnson | Jack | 123 Easy St. | Anywhere | CA |

    | 1 | Smith | John | 312 Hard St. | Somewhere | NY |


    The only column that needs special explanation is the Index field. This field
    isn’t required but is highly recommended. You can name it anything you want but
    the purpose is the same. It is a field that provides a unique value to every record;
    it’s often called the primary key field. The primary key is a special object for
    most databases; simply identifying which field is the primary key will automatically
    increment that field as new entries are made, thereby ensuring a unique data object
    for easy identification. The other fields are simply created based on the information
    that you want to include in the database.


    To make a true relational database, you have one table that refers to one or more
    tables in some fashion. If I wanted to make a order-entry database, I could make
    another table that tracks an order and relate that order to the above customer
    list, like so:


    | Key | Item_title | Price | Order_Number | Customer_ID |

    |---|---|---|---|---|

    | 0 | Boots | 55.50 | 4455 | 0 |

    | 1 | Shirt | 16.00 | 4455 | 0 |

    | 2 | Pants | 33.00 | 7690 | 0 |

    | 3 | Shoes | 23.99 | 3490 | 1 |

    | 4 | Shoes | 65.00 | 5512 | 1 |


    This table is called "Orders_table". This table shows the various orders made
    by each person in the customer table. Each entry has a unique key and is related
    to Customers_table by the Customer_ID field, which is the Index value for each
    customer.


    # ### 17.3  Using SQL to Query a Database


    To query a table using SQL, you simply tell the database what it is you are trying
    to do. If you want to get a list of the customers or a list of orders in the system,
    just select what parts of the table you want to get. (Note: the following code
    snippets are not Python specific; additionally, SQL statements are not case-sensitive
    but are usually written in uppercase for clarity.)'
