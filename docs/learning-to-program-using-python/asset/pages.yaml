  md: "# CHAPTER 14. EXCEPTIONS\n\nOne use of exceptions is to catch a fault and allow\
    \ the program to continue working; we have seen this before when we talked about\
    \ files. This is the most common way to use exceptions. When programming with\
    \ the Python command line interpreter, you don’t need to worry about catching\
    \ exceptions. Your program is usually short enough to not be hurt too much if\
    \ an exception occurs. Plus, having the exception occur at the command line is\
    \ a quick and easy way to tell if your code logic has a problem. However, if the\
    \ same error occurred in your real program, it will fail and stop working.\n\n\
    Exceptions can be created manually in the code by raising an exception. It operates\
    \ exactly as a system-caused exceptions, except that the programmer is doing it\
    \ on purpose. This can be for a number of reasons. One of the benefits of using\
    \ exceptions is that, by their nature, they don’t put any overhead on the code\
    \ processing. Because exceptions aren’t supposed to happen very often, they aren’t\
    \ processed until they occur.\n\nExceptions can be thought of as a special form\
    \ of the *if/elif* statements. You can realistically do the same thing with *if*\
    \ blocks as you can with exceptions. However, as already mentioned, exceptions\
    \ aren’t processed until they occur; *if* blocks are processed all the time. Proper\
    \ use of exceptions can help the performance of your program. The more infrequent\
    \ the error might occur, the better off you are to use exceptions; using *if*\
    \ blocks requires Python to always test extra conditions before continuing. Exceptions\
    \ also make code management easier: if your programming logic is mixed in with\
    \ error-handling *if* statements, it can be difficult to read, modify, and debug\
    \ your program.\n\nHere is a simple program that highlights most of the important\
    \ features of exception processing. It simply produces the quotient of 2 numbers.\n\
    \n# Listing 14.1: Exceptions\n\n```\n```python\nfirst_number = raw_input(\"Enter\
    \ the first number.\")   #gets input from keyboard\nsec_number = raw_input(\"\
    Enter the second number.\")\ntry:\n    num1 = float(first_number)\n    num2 =\
    \ float(sec_number)\n    result = num1/num2\n```\n```"
