    \n... \nThe file doesn't exist. Check filename.\n>>>\n```\n```\n\nThe file “file3”\
    \ hasn’t been created, so of course there is nothing to open. Normally you would\
    \ get an IOError but since you are expressly looking for this error, you can handle\
