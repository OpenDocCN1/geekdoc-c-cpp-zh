  md: 'goal is to present programming in a fun, friendly manner so you will have the
    desire to learn more.


    # ## 1.3 Getting Python


    As of this revision, Python 3.x has been out for several years. Most of my experience
    is with Python 2.4 and 2.5, though much of my knowledge was gained from reading
    books written for version 2.2. As you can see, it doesn’t necessarily mean your
    knowledge is obsolete when a new version comes out. Usually the newer versions
    simply add new features, often features that a beginner won’t have a need for.


    Python 3.x breaks compatibility with programs written in 2.x versions. However,
    much of the knowledge you gain from learning a 2.x version will still carry over.
    It just means you have to be aware of the changes to the language when you start
    using version 3.0. Plus, the install base of 2.x is quite large and won’t be going
    away for quite some time. Due to the fact that most Linux distributions (and Mac
    OS X) still have older Python versions installed by default (some as old as v2.4),
    many of the code examples in this book are written for Python 2.x. Special note
    is made of significant changes between 2.x and 3.x in the chapter about **19**,
    but learning either version won’t harm you.


    You can download Python from the *Python web site* (for Windows) or it may already
    be installed on your system if you’re using a Mac, Linux, or *BSD. However, the
    Unix-like operating systems, including OS X, may not have the latest version so
    you may wish to upgrade, at least to version 2.6. Version 2.6 is a modification
    of 2.5 that allows use of both 2.x code and certain 3.0 functions. Essentially
    it lets you code in “legacy” style while still being able to use the latest features
    as desired, and testing which legacy features will be broken when moving to 3.0.


    For those interested in using Python via a USB thumbdrive, you may be interested
    in *Portable Python*. This is a self-contained Python environment that you can
    either run from the thumbdrive or install to your computer. This is useful for
    people who can’t or don’t want to install Python but would still like to use it.


    I’ll assume you can figure out how to get the interactive interpreter running;
    if you need help, read the help pages on the web site. Gener-'
