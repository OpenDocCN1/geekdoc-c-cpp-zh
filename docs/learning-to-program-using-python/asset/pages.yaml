  md: '# Chapter 1

    Introduction


    I originally wanted to learn Python because I wanted to make a computer game.
    I had taken several programming classes in college (C, C++, and Java) but nothing
    really serious. I''m not a Computer Science major and I don''t program on a professional
    level.


    I didn''t really like the low-level work involved with C/C++. Things like pointers,
    memory management, and other concepts were difficult for me to grasp, much less
    effectively use. Java, as my first programming class in school, didn''t make any
    sense. I had never used an object-oriented language before and object-oriented
    programming (OOP) concepts gave me fits. It probably didn''t help that my Java
    class wasn''t actually real Java; it was actually Microsoft''s “custom” version:
    J++. So not only was I learning a language that had little practical use (J++
    added and cut many features found in real Java), but the programs didn''t work
    correctly. Ultimately the class was canceled near the end of the semester and
    everyone received full credit.


    These problems, and issues learning other programming languages, left a bad taste
    in my mouth for programming. I never thought I learned a language well enough
    to feel comfortable using it, much less actually enjoy programming. But then I
    heard about Python on a computer forum, and noticed several other mentions of
    the language at other sites around the Internet. People were talking about how
    great the language was for personal projects and how versatile it is. I decided
    to give programming one more try and see if Python was the'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'language for me.


    To give me more incentive to learn the language, I decided to recreate a role
    playing game from my childhood as a computer game. Not only would I have a reason
    to learn the language but, hopefully, I would have something useful that I could
    give to others for their enjoyment.


    # ## 1.1 Why Python?


    Python is regarded as being a great hobbyist language, yet it is also an extremely
    powerful language. It has bindings for C/C++ and Java so it can be used to tie
    large projects together or for rapid prototyping. It has a built-in GUI (graphical
    user interface) library via Tkinter, which lets the programmer make simple graphical
    interfaces with little effort. However, other, more powerful and complete GUI
    builders are available, such as Qt and GTK+. IronPython, a Python version for
    Windows using the .NET framework, is also available for those using Microsoft''s
    Visual Studio products. Python can also be used in a real-time interpreter for
    testing code snippets before adding them into a normal "executable".


    Python is classified as a scripting language. Generally speaking, this just means
    that it''s not compiled to create the machine-readable code and that the code
    is “tied-into” another program as a control routine. Compiled languages, such
    as C++, require the programmer to run the source code through a compiler before
    the software is can be used by a computer. Depending on the program''s size, the
    compilation process can take minutes to hours.


    Using Python as a control routine means Python can act as a “glue” between different
    programs. For example, Python is often used as the scripting language for video
    games; while the heavy-duty work is performed by pre-compiled modules, Python
    can act in a call/response fashion, such as taking controller input and passing
    it to the appropriate module.


    Python is also considered a high-level language, meaning it takes care of a lot
    of the grunt work involved in programming. For example, Python has a built-in
    garbage collector so you, as a programmer, don''t really need to worry about memory
    management and memory leaks, a common occurrence when using older languages such
    as C.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'The main emphasis of Python is readable code and enhancing programmer productivity.
    This is accomplished by enforcing a strict way of structuring the code to ensure
    the reader can follow the logic flow and by having an “everything’s included”
    mentality; the programmer doesn’t have to worry about including a lot of different
    libraries or other source code to make his program work.


    One of the main arguments against Python is the use of whitespace. As shown in
    Chapter 3, many other languages require the programmer to use brackets, typically
    curly braces, i.e. “{}”, to identify different blocks of code. With Python, these
    code blocks are identified by different amounts of indentation.


    People who have spent a lot of time with “traditional” languages feel the lack
    of brackets is a bad thing, while others prefer the white space. Ultimately, it
    comes down to personal preference. I happen to like the lack of brackets because
    it’s one less thing I have to troubleshoot when there is a coding problem. Imagine
    that one missing bracket in several dozen to hundreds lines of code is the reason
    your program won’t work. Now imagine having to go through your code line by line
    to find the missing bracket. (Yes, programming environments can help but it’s
    still one extra thing to consider).


    # 1.2 Why Another Tutorial?


    Even though there are several great tutorials at the Python web site (http://www.python.org),
    in addition to many books, my emphasis will be on the practical features of the
    language, i.e. I won’t go into the history of the language or the esoteric ways
    it can be used. Though it will help if you have programmed before, or at least
    can understand programming logic and program flow, I will try to make sure that
    things start out slow so you don’t get confused.


    The main purpose of this book is to teach people how to program; Python just happens
    to be the language I have chosen to use. As mentioned above, it is a very friendly
    language which lets you learn how to program without getting in your way. Most
    people, when they decide to learn programming, want to jump into C, C++, or Java.
    However, these languages have little “gotchas” that can make learning difficult
    and dissuade people from continuing with programming. My'
  merge: -1
  img_proc: true
