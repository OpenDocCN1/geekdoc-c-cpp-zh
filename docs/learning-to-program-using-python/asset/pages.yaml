    # ## 15.2 How Are Classes Better?


    Imagine you have a program that calculates the velocity of a car in a two-dimensional
    plane using functions. If you want to make a new program that calculates the velocity
    of an airplane in three dimensions, you can use the concepts of your car functions
    to make the airplane model work, but you’ll have to rewrite the many of the functions
    to make them work for the vertical dimension, especially want to map the object
    in a 3-D space. You may be lucky and be able to copy and paste some of them, but
    for the most part you’ll have to redo much of the work.


    Classes let you define an object once, then reuse it multiple times. You can give
    it a base function (called a method in OOP parlance) then build upon that method
    to redefine it as necessary. It also lets you model real-world objects much better
    than using functions.


    For example, you could make a tire class that defines the size of the tire, how
    much pressure it holds, what it’s made of, etc. then make methods to determine
    how quickly it wears down based on certain conditions. You can then use this tire
    class as part of a car class, a bicycle class, or whatever. Each use of the tire
    class (called instances) would use different properties of the base tire object.
    If the base tire object said it was just made of rubber, perhaps the car class
    would "enhance" the tire by saying it had steel bands or maybe the bike class
    would say it has an internal air bladder. This will make more sense later.


    # ## 15.3 Improving Your Class Standing


    Several concepts of classes are important to know.


    +   1. Classes have a definite namespace, just like modules. Trying to call a
    class method from a different class will give you an error unless you qualify
    it, e.g. `spamClass.eggMethod`.'
  merge: -1
