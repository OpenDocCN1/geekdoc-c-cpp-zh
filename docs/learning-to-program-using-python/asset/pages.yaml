    file is read and stored as a sequential flow of bytes. Each file has an end-of-file
    (EOF) marker denoting when the last byte of data has been read from it. This is
    useful because you can write a program that reads a file in pieces rather than
    loading the entire file into memory at one time. When the end-of-file marker is
    reached, your'
