  md: 'What? You didn’t know snakes got bad breath? (I know, bad joke.) Seriously
    though, scope describes the area of a program where an identifier (a name for
    something, like a variable) can access it’s associated value. Scope ties in with
    namespaces because namespaces pretty much define where an identifier’s scope is.


    In simple terms, namespaces store information about an identifier and it’s value.
    Python has three namespaces: local, global, and built-in. When an identifier is
    first accessed, Python looks for it’s value locally, i.e. it’s surrounding code
    block. In the example above, “x” is defined within the function **square()**.
    Every function is assigned its own local namespace. Functions can’t use identifiers
    defined in other functions; they’re simply not seen. If a function tries to call
    a variable defined in another function, you’ll get an error. If a function tried
    to define a previously defined variable, you’ll just get a brand new variable
    that happens to have the same name but a different value.


    However, if an identifier isn’t defined locally, Python will check if it’s in
    the global namespace. The global namespace is different from the local one in
    that global identifiers can be used by other functions. So if you made global
    variable cars_in_shop = 2, all functions in the program can access that variable
    and use it as needed. So you can define a variable in one location and have it
    used in multiple places without having to make it over and over. However, this
    isn’t recommended because it can lead to security issues or programming problems.
    For instance, making a variable global means any function can access them. If
    you start having multiple functions using the same variable, you don’t know what
    is happening to the variable at any given time; there is no guarantee its value
    will be what you expect it to be when you use it.


    This isn’t to say that global variables are a strict no-no. They are useful and
    can make your life easier, when used appropriately. But they can limit the scalability
    of a program and often lead to unexplained logic errors, so I tend to stay away
    from them.


    The built-in namespace is set aside for Python’s built-in functions. (Kinda convenient,
    huh?) So keywords and standard function calls like **range()** are already defined
    when the Python interpreter starts up and you can use them "out of the box".'
  merge: -1
