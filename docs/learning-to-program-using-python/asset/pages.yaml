    Strings in Python are different than most other languages. First off, there are
    no char types, only single character strings (char types are single characters,
    separate from actual strings, used for memory conservation). Strings also can''t
    be changed in-place; a new string object is created whenever you want to make
    changes to it, such as concatenation. This simply means you have to be aware that
