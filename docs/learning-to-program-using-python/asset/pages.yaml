    +   - Qt- Based upon technology from Trolltech (and subsequently purchased by
    Nokia), Qt is one of the most popular libraries for cross-platform development.
    It is the main graphical library for the KDE desktop. Qt has several licenses
    available, with the main ones being for commercial and open-source use. If your
    application will be commercial, i.e. closed-source, you have to pay for a license
    to use it. If your application will be open-sourced, then you can use the GPL
    license; however, you will be unable to commercialize your program without “upgrading”
    the license. Qt includes a graphical layout utility, allowing the user to drag
    & drop graphical widgets for quick design of the interface. Alternatively, the
    developer can hand-code the interface layout. Qt also support non-GUI features,
    including SQL database access, XML parsing, network support, et al. Qt is written
    in C++ but a Python binding is available via PyQt.


    +   - GTK+- Originally created for development of the GIMP image software (GTK
    stands for GIMP Tool Kit), GTK+ evolved into the graphical library that powers
    the GNOME desktop. Many of the applications written for KDE will run on GNOME
    and vice versa. GTK+ is open-sourced under the GPL license. This'
