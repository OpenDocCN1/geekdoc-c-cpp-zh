  md: '# 13.1 Making Python Do Something


    So far I''ve talked about how Python is structured and how it differs from other
    languages. Now it''s time to make some real programs. To begin with, Python programs
    are comprised of functions, classes, modules, and packages.


    +   1. Functions are programmer created code blocks that do a specific task.

    2. Classes are object-oriented structures that I''ll talk about later; suffice
    to say they are pretty powerful structures that can make programming life easier,
    though they can be difficult to learn and wield well.

    3. Modules are generally considered normal program files, i.e. a file comprised
    of functions/classes, loops, control statements, etc.

    4. Packages are programs made up of many different modules.


    In reality, I consider modules and packages to be "programs". It just depends
    on how many separate files are required to make the program run. Yes, it is possible
    to have a single, monolithic file that controls the entire program but it''s usually
    better to have different parts in different files. It''s actually easier to keep
    track of what''s going on and you can cluster bits of code that have common goals,
    e.g. have a file that holds library functions, one that handles the GUI, and one
    that processes data entry.


    An important module to know is the Python standard library. There are two versions:
    Python 2.6 and Python 3.0. The library is a collection of common code blocks that
    you can call when needed. This means you don''t have to "rebuild the wheel" every
    time you want to do something, such as calculate the tangent of a function. All
    you have to do is import the portion of the standard library you need, e.g. the
    math block, and then use it like regular Python code. Knowing what''s in the standard
    library separates the good programmers from the great ones, at least in my book.


    That being said, let''s make a simple Python program. This program can be made
    in IDLE (the standard Python programming environment that comes with the Python
    install), a third-party programming environment (such as SPE, Komodo, Eclipse,
