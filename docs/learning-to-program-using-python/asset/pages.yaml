    # 1.4 Conventions Used in this Book


    The latest version of Python is 3.2 while the most current “legacy” version is
    2.7. I will use the term 3.x to signify anything in the Python 3 family and 2.x
    for anything in the Python 2 family, unless explicitly stated.


    The term “*nix” is used to refer to any Unix-like language, including Linux and
    the various flavors of BSD (FreeBSD, OpenBSD, NetBSD). Though Mac OS X is built
    upon FreeBSD, it is different enough to not be lumped in the *nix label.


    Due to the word-wrap formatting for this book, some lines are automatically indented
    when they are really on the same line. It may make some of the examples confusing,
    especially because Python uses “white space” like tabs and spaces as significant
    areas. Thus, a word-wrapped line may appear to be an indented line when it really
    isn’t. Hopefully you will be able to figure out if a line is intentionally tabbed
    over or simply wrapped.'
