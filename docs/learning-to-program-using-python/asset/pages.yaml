  md: '# Chapter 5


    # Types and Operators


    Python is based on the C programming language and is written in C, so much of
    the format Python uses will be familiar to C and C++ programmers. However, it
    makes life a little easier because it’s not made to be a low-level language (it’s
    difficult to interact heavily with hardware or perform memory allocation) and
    it has built-in "garbage collection" (it tracks references to objects and automatically
    removes objects from memory when they are no longer referenced), which allows
    the programmer to worry more about how the program will work rather than dealing
    with the computer.


    # 5.1  Python Syntax


    # 5.1.1  Indentation


    Python forces the user to program in a structured format. Code blocks are determined
    by the amount of indentation used. As you’ll recall from the Comparison of Programming
    Languages chapter, brackets and semicolons were used to show code grouping or
    end-of-line termination for the other languages. Python doesn’t require those;
    indentation is used to signify where each code block starts and ends. Here is
    an example (line numbers are added for clarification):'
