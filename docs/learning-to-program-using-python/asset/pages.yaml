    Starting with v2.5, Python has included SQLite, a light-weight SQL library. SQLite
    is written in C, so it’s quick. It also creates the database in a single file,
    which makes implementing a DB fairly simple; you don’t have to worry about all
    the issues of having a DB spread across a server. However, it does mean that SQLite
    is better suited to either development purposes or small, stand-alone applications.
    If you are planning on using your Python program for large-scale systems, you’ll
    want to move to a more robust database, such as PostgreSQL or MySQL.


    However, this doesn’t mean SQLite isn’t useful. It’s good for prototyping your
    application before you throw in a full-blown DB; that way you know your program
    works and any problems are most likely with the DB implementation. It’s also good
    for small programs that don’t need a complete DB package with its associated overhead.


