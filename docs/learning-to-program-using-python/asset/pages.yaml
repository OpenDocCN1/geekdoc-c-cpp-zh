    # 10.6 Seeking


    Seeking is the process of moving a pointer within a file to an arbitrary position.
    This allows you to get data from anywhere within the file without having to start
    at the beginning every time.


    The seek() method can take several arguments. The first argument (offset) is starting
    position of the pointer. The second, optional argument is the seek direction from
    where the offset starts. 0 is the default value and indicates an offset relative
    to the beginning of the file, 1 is relative to the current position within the
    file, and 2 is relative to the end of the file.


    ```

    Listing 10.6: File seeking

    file.seek(15) #move pointer 15 bytes from

    beginning of file

    file.seek(12, 1) #move pointer 12 bytes from

    current location

    file.seek(-50, 2) #move pointer 50 bytes backwards

    from end of file

    file.seek(0, 2) #move pointer at end of file

    ```


