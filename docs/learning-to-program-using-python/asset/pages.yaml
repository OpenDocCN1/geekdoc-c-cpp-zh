    Neat, huh? One benefit of tuple packing/unpacking is that you can swap items in-place.
    With other languages, you have to create the logic to swap variables; with tuples,
    the logic is inherent in the data type.


    # Listing 9.4: In-place variable swapping


    ```

    >>> bug = "weevil"

    >>> bird = "African swallow"

    >>> bug, bird = bird, bug

    >>> bug

