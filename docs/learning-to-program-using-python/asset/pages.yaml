    >>> bird

    ''weevil''

    ```


    Tuple unpacking and in-place swapping are one of the neatest features of Python,
    in my opinion. Rather than creating the logic to pull each item from a collection
    and place it in its own variable, tuple unpacking allows you to do everything
    in one step. In-place swapping is also a shortcut; you don’t need to create temporary
    variables to hold the values as you switch places.


    # 9.3 Methods


