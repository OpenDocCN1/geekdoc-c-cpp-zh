  md: 'than a database. If that doesn''t work, then you can try a database.


    # 17.1 How to Use a Database


    A database (DB) is simply a collection of data, placed into an arbitrary structured
    format. The most common DB is a relational database; tables are used to store
    the data and relationships can be defined between different tables. SQL (Structured
    Query Language) is the language used to work with most DBs. (SQL can either be
    pronounced as discrete letters "S-Q-L" or as a word "sequel". I personally use
    "sequel".)


    SQL provides the commands to query a database and retrieve or manipulate information.
    The format of a query is one of the most powerful forces when working with DBs;
    an improper query won''t return the desired information, or worse, it will return
    the wrong information. SQL is also used to input information into a DB.


    While you can interact directly with a DB using SQL, as a programmer you have
    the liberty of using Python to control much of the interactions. You will still
    have to know SQL so you can populate and interact with the DB, but most of the
    calls to the DB will be with the Python DB-API (database application programming
    interface).


    # 17.2 Working With a Database


    This book is not intended to be a database or SQL primer. However, I will provide
    you with enough information to create simple database and an application that
    uses it. First I will cover the basic principles of databases and SQL queries
    then we will use Python to make and manipulate a small database.


    First off, consider a database to be one or more tables, just like a spreadsheet.
    The vertical columns comprise different fields or categories; they are analogous
    to the fields you fill out in a form. The horizontal rows are individual records;
    each row is one complete record entry. Here''s a pictorial summary, representing
    a customer list. The table''s name is "Customers_table":'
  merge: -1
  img_proc: true
