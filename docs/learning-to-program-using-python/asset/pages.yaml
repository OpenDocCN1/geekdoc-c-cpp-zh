    # ## 9.1 Why Use Tuples?


    Tuples typically store heterogeneous data, similar to how lists typically hold
    homogeneous data. It''s not a hard-coded rule but simply a convention that some
    Python programmers follow. Because tuples are immutable, they can be used to store
    different data about a certain thing. For example, a contact list could conceivably
    stored within a tuple; you could have a name and address (both strings) plus a
    phone number (integer) within on data object.


    The biggest thing to remember is that standard operations like slicing and iteration
    return new tuple objects. In my programming, I like use lists for everything except
    when I don''t want a collection to change. It cuts down on the number of collections
    to think about, plus tuples don''t let you add new items to them or delete data.
    You have to make a new tuple in those cases.


    There are a few times when you simply have to use a tuple because your code requires
    it. However, a lot of times you never know exactly what you''re going to do with
    your code and having the flexibility of lists can be useful.


    So why use tuples? Apart from sometimes being the only way to make your code work,
    there are few other reasons to use tuples:


    +   - Tuples are processed faster than lists. If you are creating a constant set
    of values that won''t change, and you need to simply iterate through them, use
    a tuple.'
