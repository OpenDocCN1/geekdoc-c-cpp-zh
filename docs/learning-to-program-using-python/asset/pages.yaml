    # # 14.1 Exception Class Hierarchy


    Table 14.1 shows the hierarchy of exceptions from the Python Library Reference.
    When an exception occurs, it starts at the lowest level possible (a child) and
    travels upward (through the parents), waiting to be caught. This means a couple
    of things to a programmer:


    +   1. If you don’t know what exception may occur, you can always just catch a
    higher level exception. For example, if you didn’t know that ZeroDivisionError
    from the previous example was a "stand-alone" exception, you could have used the
    ArithmeticError for the exception and caught that; as the diagram shows, ZeroDivisionError
    is a child of ArithmeticError, which in turn is a child of StandardError, and
    so on up the hierarchy.


    +   2. Multiple exceptions can be treated the same way. Following on with the
    above example, suppose you plan on using the ZeroDivisionError and you want to
    include the FloatingPointError. If you wanted to have the same action taken for
    both errors, simply use the parent exception ArithmeticError as the exception
    to catch. That way, when either a floating point or zero division error occurs,
    you don’t have to have a separate case for each one. Naturally, if you have a
    need or desire to catch each one separately, perhaps because you want different
    actions to be taken, then writing exceptions for each case is fine.'
