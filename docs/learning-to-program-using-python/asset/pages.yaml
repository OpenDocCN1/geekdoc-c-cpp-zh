  md: '# # Chapter 17

    # Databases


    Databases are popular for many applications, especially for use with web applications
    or customer-oriented programs. There is a caveat though; databases don''t have
    the performance that file-system based applications do.


    Normal files, such as text files, are easy to create and use; Python has the tools
    built-in and it doesn''t take much to work with files. File systems are more efficient
    (most of the time) in terms of performance because you don''t have the overhead
    of database queries or other things to worry about. And files are easily portable
    between operating systems (assuming you aren''t using a proprietary format) and
    are often editable/usable with different programs.


    Databases are good when discrete "structures" are to be operated on, e.g. a customer
    list that has phone numbers, addresses, past orders, etc. A database can store
    a lump of data and allow the user or developer to pull the necessary information,
    without regard to how the data is stored. Additionally, databases can be used
    to retrieve data randomly, rather than sequentially. For pure sequential processing,
    a standard file is better.


    Obviously, there is more to the file-system vs. database battle than what I just
    covered. But, generally speaking, you will be better suited using a file-system
    structure than a database unless there is a reason to use a database. My personal
    recommendation is that, unless you are creating a server-based application, try
    using a local file rather'
