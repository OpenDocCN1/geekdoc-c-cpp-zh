    \ 29\n\n- 2.1 Declaring functions ......................................................................................\
    \ 29\n- 2.2 Pointers ...................................................................................................................\
    \ 31\n- 2.3 Call-by-reference ...................................................................................................\
    \ 34\n\n# 3 ARRAYS .......................................................................................................................\
    \ 41\n\n- 3.1 One-dimensional arrays ..................................................................................\
    \ 41\n- 3.2 Multidimensional arrays ...............................................................................\
    \ 43\n- 3.3 Passing arrays as parameters ...................................................................\
    \ 44\n- 3.4 Dynamically allocated arrays ...................................................................\
    \ 48\n\n# 4 STRINGS\n\n- 4.1 Strings: Arrays of characters . . . . . . . . . .\
    \ . . . . . . 53\n- 4.2 Manipulating strings . . . . . . . . . . . . . . . 56\n\
    - 4.3 Reading strings with scanf() . . . . . . . . . . . 61\n\n# 5 STRUCTURED\
    \ DATA TYPES\n\n- 5.1 Declaring a structured data type . . . . . . . . . . 67\n\
    - 5.2 Passing structures as parameters . . . . . . . . . 71\n- 5.3 Pointers to\
    \ structures . . . . . . . . . . . . . 77\n- 5.4 Dynamic allocation of structure\
    \ values . . 80\n\n# 6 FILE I O AND MULTIPLE SOURCE FILES\n\n- 6.1 File I/O and\
    \ command-line arguments . . . . 87\n- 6.2 Header files . . . . . . . . . . .\
    \ . . . 92\n\n# 0.1. C standards\n\nThe C programming language was developed in\
    \ the early 1970s, originally as a system implementation language, and Brian Kernighan\
    \ and Dennis Ritchie published the first edition of “The C Programming Language”\
    \ in 1978. It is known to C programmers as “K&R” and the second edition of the\
    \ book covers the ANSI C standard from 1989.\n\nThe ISO standard, known as C90,\
    \ was published in 1990 as ISO/IEC 9899:1990. It is technically identical to the\
    \ ANSI C standard. A new edition of the ISO C standard, known as C99, was published\
    \ in 1999 as ISO/IEC 9899:1999. Yet another edition of the ISO C standard, known\
    \ as C11, was published in 2011 as ISO/IEC 9899:2011.\n\nAs of February 2013 the\
    \ default for the GNU Compiler Collection (GCC) is C90 with certain GNU extensions,\
    \ like the // single line comment style, which is allowed in C99 and C11. The\
    \ programs in this book have been tested using the gcc command without any options.\
    \ The current default, if no C language dialect options are given, is the option\
    \ -std=gnu90.\n\n# 1. Introduction\n\nFor the language features that are common\
    \ to both C and Java, the two languages usually have similar if not identical\
    \ syntax. One of the major differences between the two languages is that C is\
    \ not object-oriented. This means that a program is not a collection of classes.\
    \ Instead, a C program is a collection of functions. Functions in C are very similar\
    \ to static methods in Java. In this chapter we introduce the basic structure\
    \ of a C program, including built-in types, variable declarations, simple output,\
    \ conditionals, and loops. As you will see, most of these features are nearly\
    \ identical to their counterparts in Java.\n\n# 1.1. \"Hello, world!\"\n\nLet's\
    \ begin with the classic \"Hello, world!\" program.\n\n```\n/* hello.c\n * Print\
    \ hello.\n */\n#include <stdio.h>\n\nint main() {\n    printf(\"Hello, world!\\\
    n\");\n    return 0;\n}\n```\n\nThe output of this program is:\n\nHello, world!\n\
    \n# Dissection of hello.c\n\n```\n/* hello.c\n * Print hello.\n */\n```\n\nThis\
    \ is a comment, just as in Java. Most C compilers also allow the // single line\
    \ comment style.\n\n```c\n#include <stdio.h>\n```\n\nThis is similar in purpose\
    \ to import in Java; however, the effect is somewhat\ndifferent. The include statement\
    \ tells the compiler where to look\nadditional classes. The #include is called\
    \ a compiler directive. It tells thecompiler to insert the contents of the named\
    \ file, std.h in this case,\ndirectly into the program before the main phase of\
    \ compilation.\n\n```c\nint main()\n```\n\nThis line declares main() to be a function\
    \ that returns an int and has no parameters. Many programmers prefer the following\
    \ alternative declaration:\n\n```c\nint main(void)\n```\n\nThe keyword void is\
    \ optional; it is used to emphasize that no parameters\nexpected. But as we will\
    \ see in chapter 6 it is also possible to declare\nmain() with parameters.\n\n\
    # 1.2. Built-in types, local variables, loops, and conditionals\n\nJava primitive\
    \ types have equivalent types in C. The only exception is the Java type boolean.\
    \ C does not have a boolean type. Instead, C uses integers to represent boolean\
    \ values, interpreting the integer value zero as false and any other integer value\
    \ as true.\n\nTrouble spot\n\nC has no boolean type. Use int instead, interpreting\
    \ non-zero as true and zero as false.\n"
