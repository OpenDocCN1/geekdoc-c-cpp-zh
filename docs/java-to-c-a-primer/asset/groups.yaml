    # 4.2. Manipulating strings


    The standard C libraries include a number of functions for manipulating strings.
    In this section we introduce a few of the most commonly used string functions.
    The functions we describe are summarized in the following table.


    | Function | Brief Description |

    |---|---|

    | strcat(), strcat() | These functions are used to append the contents of one
    string onto the end of another string. This is called concatenation. |

    | strchr() | This function is used to search for the first occurrence of a particular
    character in a string. |

    | strcmp(), strncmp() | These functions are used to compare two strings. |

    | strcpy(), strncpy() | These functions are used to make a copy of a string. |

    |strlen() | This function is used to find the length of a string. |

    | strstr() | This function is used to search for the first occurrence of one string
    as a substring in another string. |


    Notice that several of the functions come in two forms; the str... form and the
    strn... form. The latter form is always safer. These safer functions allow you
    to specify the maximum number of characters to be processed. This can be used
    to prevent errors in the event that one of the strings was inadvertently left
    without a terminating null character.


    We describe the string functions in the above table using a dissection of the
    following example.'
