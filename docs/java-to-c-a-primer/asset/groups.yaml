    \ 类型包括 Java 的原始数据类型，除了非零为真。\n- C 将布尔值表示为整数。零为假；非零为真。\n- 通常情况下，标准 C 的内置运算符与对应的\
    \ Java 类型相同。\n- 涉及关系运算符的表达式求值为1（真），0（假）。布尔运算符操作整数，将任何非零视为真。\n- for 和 while 循环的语法与\
