    \ 28\n传真：+45 77 42 43 54\nforlag@polyteknisk.dk\nwww.polyteknisk.dk\n\n# 前言\n\n\
    本书旨在为熟悉 Java 的程序员提供 C 语言的快速介绍。它不是 C 语言参考书的替代品，而是补充。对于已经熟悉 Java 的程序员来说，典型的 C 语言书籍需要读者阅读许多已熟悉材料的细节。在书中，我们将快速介绍开始编写严肃\
    \ C 程序所需的主要概念，并重点介绍 C 与 Java 之间的区别。\n\n通常情况下，我们遵循 Java 代码规范，但仅使用两个空格作为缩进单位，并且在控制结构中对单条语句不使用大括号。\n\
