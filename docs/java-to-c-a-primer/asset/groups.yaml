- md: "\n## 4.2. Manipulating strings\n\nThe standard C libraries include a number\
    \ of functions for manipulating strings. In this section we introduce a few of\
    \ the most commonly used string functions. The functions we describe are summarized\
    \ in the following table.\n\n| Function | Brief Description |\n|---|---|\n| strcat(),\
    \ strcat() | These functions are used to append the contents of one string onto\
    \ the end of another string. This is called concatenation. |\n| strchr() | This\
    \ function is used to search for the first occurrence of a particular character\
    \ in a string. |\n| strcmp(), strncmp() | These functions are used to compare\
    \ two strings. |\n| strcpy(), strncpy() | These functions are used to make a copy\
    \ of a string. |\n| strlen() | This function is used to find the length of a string.\
    \ |\n| strstr() | This function is used to search for the first occurrence of\
    \ one string as a substring in another string. |\n\nNotice that several of the\
    \ functions come in two forms; the str... form and the strn... form. The latter\
    \ form is always safer. These safer functions allow you to specify the maximum\
    \ number of characters to be processed. This can be used to prevent errors in\
    \ the event that one of the strings was inadvertently left without a terminating\
    \ null character.\n\nWe describe the string functions in the above table using\
    \ a dissection of the following example.\n\n```c\n/* stringLib.c\n* Demonstrate\
    \ some standard string functions.\n */\n#include <stdio.h>\n#include <stdlib.h>\n\
    #include <string.h>\n#define MAX_S2 100\n\nint main() {\n    char *s1 = \"String\
    \ one\";\n    char *s2 = calloc(MAX_S2, sizeof(char));\n    char *s3;\n\n    printf(\"\
    The length of \\\"%s\\\" is %d\\n\",\n           s1, strlen(s1));\n\n    strncpy(s2,\
    \ \"Testing\", MAX_S2);\n    strncat(s2, \" 123\", MAX_S2 - strlen(s2));\n   \
    \ printf(\"%s2 contains:%s\\n\", s2);\n\n    s3 = strchr(s1, ' ');\n    printf(\"\
    %s3 is now %s\\n\", s3);\n\n    s3 = strstr(s1, \"tr\");\n    printf(\"%s3 is\
    \ now %s\\n\", s3);\n\n    printf(\"%s compared to %s gives %d\\n\",\n       \
    \    s1, s2, strncmp(s1, s2, MAX_S2));\n    printf(\"%s compared to %s gives %d\\\
    n\",\n           s2, s1, strncmp(s2, s1, MAX_S2));\n    printf(\"%s compared to\
    \ String one gives %d\\n\",\n           s1, strncmp(s1, \"String one\"));\n\n\
    \    return 0;\n}\n```\n\nThe output for this program is:\n\n```\nThe length of\
    \ \"String one\" is 10\ns2 contains:Testing 123\ns3 is now g one\ns3 is now tring\
    \ one\nString compared to Testing 123 gives -1\nTesting 123 compared to String\
    \ one gives 1\nString one compared to String one gives 0\n```\n\n### Dissection\
    \ of StringLib.c\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#include <string.h>\n\
    #define MAX_S2 100\n```\n\nWe need to include the header for the string library,\
    \ string.h. Constants are created in C using the #define construct shown. All\
    \ subsequent uses of the identifier MAX_S2 will be equivalent to typing the integer\
    \ 100.\n\n```c\nchar *s1 = \"String one\";\nchar *s2 = calloc(MAX_S2, sizeof(char));\n\
    char *s3;\n```\n\nWe declare three string variables for use in the program. The\
    \ first is initialized to a specific string literal. The second is pointing to\
    \ an uninitialized portion of memory large enough to contain 100 characters, counting\
    \ the null character at the end. The third string variable is uninitialized. Notice\
    \ that there is no type with the name string in C. Instead we use char *, a pointer\
    \ to char.\n\n```c\nprintf(\"The length of \\\"%s\\\" is %d\\n\",\n      s1, strlen(s1));\n\
    ```\n\nThe expression strlen(s1) returns the length of s1, not including the terminating\
    \ null character.\n\n```c\nstrncpy(s2, \"Testing\", MAX_S2);\n```\n\nThe expression\
    \ strncpy(str1, str2, n) copies the characters in str2 into str1, copying at most\
    \ n characters. The first parameter must already be pointing to memory large enough\
    \ to hold the copied characters. In example, we previously assigned s2 to point\
    \ to a freshly allocated array of 100 characters. The function strcpy() is similar,\
    \ but it takes only two arguments, the two strings. There is no check to make\
    \ sure that not too many characters are copied.\n\n```c\nstrcat(s2, \"123\", MAX_S2\
    \ - strlen(s2));\nprintf(\"%s2 contains:%s\\n\", s2);\n```\n\nThe expression strncat(str1,\
    \ str2, n) copies at most n characters from str2 onto the end of str1, and adds\
    \ a null character. In our example we limit the copy by the amount of space remaining\
    \ in s2. The function strcat() is similar but takes only two parameters, the two\
    \ strings, and no check is made for the number of characters copied. As shown\
    \ the output, the result of this concatenation is s2 now contains \"Testing 123\"\
    .\n\n```c\ns3 = strchr(s1, 'g');\nprintf(\"%s3 is now %s\\n\", s3);\n```\n\nThe\
    \ expression strchr(str1, c) searches the string str1 for the first occurrence\
    \ of the character c. The result is a pointer to the matching character that was\
    \ found. If the character is not found, the return value is NULL. It is important\
    \ to note that in our example at point s3 is pointing into the middle of the string\
    \ s1. If we change any of the characters after the 'g' in s1, we will also be\
    \ changing the string pointed to by s3.\n\nRemember, s1 and s3 are not really\
    \ strings but simply pointers to sequences of characters.\n\n```c\ns3 = strstr(s1,\
    \ \"tr\");\nprintf(\"s3 is now %s\\n\", s3);\n```\n\nThe function strstr() is\
    \ similar to strchr(), except instead of searching for a single character in a\
