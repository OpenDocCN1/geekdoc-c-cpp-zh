    Anker Engelunds Vej 1\nDK - 2800 Lyngby\nTel.: +45 77 42 43 28\nFax: +45 77 42\
    \ 43 54\nforlag@polyteknisk.dk\nwww.polyteknisk.dk\n\n# Preface\n\nThis book is\
    \ designed to be used as a quick introduction to C for programmers already familiar\
    \ with Java. It is not a replacement for a reference book on C, but is instead\
    \ a supplement. For the programmer already familiar with Java, the typical book\
    \ on C requires the reader to wade through many details of already-familiar material.\
    \ In this book, we quickly present the main concepts needed to begin writing serious\
    \ programs in C, highlighting the differences between C and Java.\n\nIn general\
    \ we follow the Java code conventions but only two spaces are used as the unit\
    \ of indentation and braces are not used around single statements as part of a\
    \ control structure.\n\n# Contents\n\n- 0.1 C standards .................................................................\
    \ . . . . . 9\n\n# 1 INTRODUCTION .................................................................................\
    \ . . . . . . . 11\n\n- 1.1 “Hello, world!\" . . . . . . . . . . . . . . . . .\
