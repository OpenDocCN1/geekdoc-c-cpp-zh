    \ second argument. The result is a pointer to the beginning of the matching substring\
    \ within the original string. If the character is not found, the return value\
    \ is NULL. As before, after the above statements, the memory for the string pointed\
    \ to by s1 and the memory for the string pointed to by s3 overlap.\n\n```c\nprintf(\"\
