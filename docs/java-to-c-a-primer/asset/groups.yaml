    # Introduction 13


    ```

    printf("Hello, world!\n");

    ```


    Java also includes System.out.printf() with many of the same format features as
    those of printf() in C. We will discuss printf() in more detail later. As used
    here, printf() is similar to System.out.print() in Java.


    ```

    return 0;

    ```


    By convention, a return value of 0 from main() indicates normal completion to
    the operating system. If the program is terminating abnormally, a non-zero return
    value can be used by the operating system. To compile this program from a command
    line use:


    ```

    gcc hello.c -o hello

    ```


    Depending upon the configuration of your computer, instead of gcc, you may need
    to use cc or some other command to compile the program. This will create a file
    hello (possibly with an extension for the file type), which can be executed by
    simply typing the name of the file.


    # 1.2. Built-in types, local variables, loops, and conditionals


    Java primitive types have equivalent types in C. The only exception is the Java
    type boolean. C does not have a boolean type. Instead, C uses integers to represent
    boolean values, interpreting the integer value zero as false and any other integer
    value as true.


    Trouble spot


    C has no boolean type. Use int instead, interpreting non-zero as true and zero
    as false.'
- md: "\n# 14\n\nLocal variables for the built-in types in C are declared just as\
    \ in Java. The same initialization syntax is also allowed. The one difference\
    \ is that variables must be declared at the beginning of a block or compound statement.\n\
    \n## Trouble spot\n\nAll variable declarations in a block must appear before the\
    \ first executable statement.\n\nC includes most of the same numeric, relational\
    \ and boolean operators as Java, summarized in the following table.\n\n| Description\
    \ | Operators |\n| --- | --- |\n| Arithmetic operators | +, -, *, /, % |\n| Relational\
    \ operators | <, <=, >=, ==, != |\n| Boolean operators | &&, || |\n| Bitwise operators\
    \ | &, |, ^, !, <<, >> |\n\nThe boolean operators operate on integer values, treating\
    \ zero as false and non-zero as true.\n\nA boolean operator always results in\
    \ a value of 0 or 1. The division operator, /, is the same as in Java. In particular,\
    \ integer division truncates towards zero without any warning. Also, as in Java,\
    \ the boolean operators are short-circuit operators, only evaluating their second\
    \ operand if necessary.\n\nThe syntax for if-else statements, for loops, and while\
    \ loops is identical to that of Java. The following program in C demonstrates\
    \ the substantial syntactic similarity between C and Java.\n\n```\n/* Syntax.c\n\
    \ * Demonstrate local variables, built-in types,\n * if-else and loops.\n */\n\
    #include <stdio.h>\n```\n\n# Introduction 15\n\n## Dissection of basicSyntax.c\n\
    \n```\nint num1 = 4, num2 = 10, i;\ndouble ratio;\n```\n\nHere we declare three\
    \ integer variables of type int, and one floating-point variable of type double.\
    \ Unlike Java, these types do not have a fixed size; however, in general they\
    \ will be the same as the Java types. Two of the variables have been initialized,\
    \ the others contain undefined data. Unlike Java, C will not give an error if\
    \ you attempt to use a local variable that has not been initialized. The C program\
    \ will simply use whatever value is stored in the memory location for the variable.\
    \ That value could be anything.\n\n# 16\n\n## Trouble spot\n\nMost C compilers\
    \ will not normally warn you about uninitialized variables. Use gcc -Wall to generate\
    \ all possible warning messages.\n\nThe syntax for the for loop in C is nearly\
    \ identical to that in Java. The one difference is that the loop index variable\
    \ cannot be declared as part of the loop. In Java, you could:\n\n```\nfor (int\
    \ i = 1; i <= num1; i++) ...\n```\n\nThis is syntax error in C. As shown in this\
    \ example, C includes the increment operator ++. It can be used postfix or prefix,\
    \ and has the exact same behavior as in Java. The for loop above uses an additional\
    \ feature of the printf() function. The string passed to a printf() can contain\
    \ special characters that are always preceded by the percent character. The sequence\
    \ %d says that the next parameter to the printf() should be converted from an\
    \ integer to a string and inserted at this point. The space after the printf()\
    \ simply prints a newline.\n\nThe syntax for the while loop in C is identical\
    \ to that in Java. As shown here, C also includes the decrement operator --, which\
    \ can be used as either prefix or postfix, having the exact same behavior as in\
    \ Java.\n\n# Introduction\n\n```\nif (num1 != 0)\n    ratio = num2 / num1;\nelse\n\
    \    ratio = num2 / 3.0;\n    printf(\"%f\\n\", ratio);\n```\n\nThe syntax for\
    \ if statements and if-else statements is identical to that in Java. There is\
    \ one important difference because C does not contain a boolean. The result of\
    \ the relational operators such as >, <=, and == is a value of type int. The value\
    \ will be 1 if the comparison is true and 0 if it is false. This will become important\
    \ later, because many C programmers use this fact in their programs. For example,\
    \ the above if-else statement can be rewritten equivalently as:\n\n```\nif (num1)\n\
    \    ratio = num2 / num1;\nelse\n    ratio = num2 / 3.0;\n```\n\nThe format string\
    \ %f in a printf() indicates that the next parameter to the printf should be converted\
    \ from a floating-point value to a string and inserted in the output string at\
    \ that point.\n\nAll of the rules about using braces to place blocks of statements\
    \ in the branches of an if-else statement are the same as in Java. Also, nesting\
    \ of if-else statements is the same in C as in Java.\n\n## Trouble spot\n\nIn\
    \ Java the following is a syntax error:\n\n```\nif (num1 = 0) ...\n```\n\nThe\
    \ expression num1 = 0 assigns zero to num1 and the value of the expression is\
    \ 0. It is interpreted as false, and the false branch of the if statement will\
    \ be taken. In Java this is a syntax-tax error because the expression does not\
    \ result in a boolean value. This is a particularly insidious error in C because\
    \ it is so close to what was probably intended:\n\n# 18\n\n```\nif (num1 == 0)\
    \ ...\n```\n\nTo help catch such typing errors, many programmers make\nhabit of\
    \ writing\n\n```\nif (0 == num1) ...\n```\n\ninstead. Then, if the == is mistyped\
    \ as =, a compile time error\nwill be generated.\n\n# 1.3. Output with printf()\n\
    \nThe standard output function in C is printf(). The name printf is\nderived from\
    \ the fact that this function allows formatted printing. The\nfunction printf()\
    \ can accept any number of arguments. This looks a\nbit like function overloading,\
    \ but C does not support function overloading.\nInstead, the function printf()\
    \ is designed to accept an arbitrary number\nof arguments.\n\nThe first argument\
    \ to printf() is always a format string. The format\nstring is then followed by\
    \ zero or more additional parameters that contain\nt values that are to be printed,\
    \ as part of the output string.\n\nThe format string contains both literal characters\
    \ to be printed, and format-\ncharacters. A sequence of formatting characters\
    \ always begins with\nthe special character % and ends with a conversion character.\
    \ Between the\n% and the conversion character can be additional formatting characters.\n\
    The following example shows how literal characters and several conversion\nspecifications\
    \ can be combined in a single printf().\n\n# Introduction 19\n\n```\n/* printfExample.c\n\
    \ * Simple use of printf().\n */\n#include <stdio.h>\n\nint main() {\n    int\
    \ intVal = 10;\n    double doubleVal = 1.234;\n\n    printf(\"intVal = %d, doubleVal\
    \ = %f\\n\",\n           intVal, doubleVal);\n\n    return 0;\n}\n```\n\nThe output\
    \ of this program is:\n\n```\nintVal = 10, doubleVal = 1.234000\n```\n\nNote how\
    \ the values were inserted into the output The following table lists all of the\
    \ conversion characters for printf.\n\n# 20\n\n| Conversion character | Argument\
    \ | Description |\n| --- | --- | --- |\n| c | char | Print a single character.\
    \ |\n| d or i | int | Print an integer. |\n| u | int | Print as unsigned integer.\
    \ |\n| o | int | Print integer in octal. |\n| x or X | int | Print integer in\
    \ hexadecimal. |\n| e or E | float or double | Print in scientific notation. |\n\
    | f | float or double | Print floating-point value. |\n| g or G | float or double\
    \ | Same as e, E, or f. |\n| s | char * | Print a string. |\n| p | void * | Print\
    \ pointer's value in hexadecimal. |\n| n | int * | Nothing is printed; instead\
    \ store into the argument the number of characters so far. |\n| % | none | Print\
    \ a single %; there is no corresponding argument. |\n\nThe basic formatting specified\
    \ by the conversion characters shown in this table can be modified with additional\
    \ characters inserted between the %, format string and the conversion character.\
    \ This additional formatting information may include the following, in order:\
    \ flags, field width, precision, and length modifier, as described below.\n\n\
    # Introduction 21\n\n## Flags — There are several optional flags that can be used\
    \ to control left/right justification, fill character, and related formatting.\
    \ They are described in the following table.\n\n| Flag | Description |\n| - |\
    \ - |\n| - | The output string will be left-justified in the field. The default\
    \ is right-justification |\n| + | For conversions that might generate a minus\
    \ sign for negative values, the + is normally omitted for positive values. With\
    \ this flag, the + is included. |\n| space | Inserts a space in front of non-negative\
    \ numeric output when using a conversion that might generate a minus sign. This\
    \ is similar to the + flag. The space flag is used to align the first digit when\
    \ the output includes both negative and positive values. If both the + and space\
    \ flags are included the space flag is ignored. |\n| # | The effect of this flag\
    \ depends upon the conversion character. With conversion character o, a zero is\
    \ printed at the front of the output string. The leading zero indicates to the\
    \ reader that this is in oct format. With conversion characters x or X, the string\
    \ 0x or OX is printed at the front of the output string indicating hexadecimal\
    \ to the reader. With conversion characters g or G, trailing zeros are printed.\
    \ With conversion characters e, E, f, g, or G, a decimal point is always printed.\
    \ |\n| 0 | Numeric conversions will use zeros instead of spaces to pad the output\
    \ to fill the specified field. |\n\nField Width — Each converted argument is printed\
    \ in a field. By default, the field is just wide enough to hold the converted\
    \ value. When a field width is specified, the output is padded on the left with\
    \ zeros or spaces, or on the right with spaces, depending on the flags. If the\
    \ field width is too small, it is extended to the width of the converted argument.\n"
  mdcn: "\n\n# 14\n\nC 中内置类型的局部变量声明方式与 Java 相同。也允许相同的初始化语法。唯一的区别是，变量必须在块或复合语句的开头声明。\n\
    \n## 难点\n\n块中的所有变量声明必须出现在第一个可执行语句之前。\n\nC 包含了与 Java 大多数相同的数值、关系和布尔运算符，总结如下表所示。\n\
    \n| 描述 | 运算符 |\n| --- | --- |\n| 算术运算符 | +, -, *, /, % |\n| 关系运算符 | <, <=, >=,\
    \ ==, != |\n| 布尔运算符 | &&, || |\n| 位运算运算符 | &, |, ^, !, <<, >> |\n\n布尔运算符作用于整数值，将\
    \ 0 视为假，非 0 视为真。\n\n布尔运算符的结果始终是 0 或 1。除法运算符 `/` 与 Java 中的相同。特别地，整数除法会向零截断，且没有任何警告。此外，与\
    \ Java 一样，布尔运算符是短路操作符，仅在需要时求值第二个操作数。\n\nif-else 语句、for 循环和 while 循环的语法与 Java 完全相同。以下\
    \ C  程序演示了 C 和 Java 之间大量的语法相似性。\n\n```\n/* Syntax.c\n * 演示局部变量、内置类型、\n * if-else\
    \ 和循环。\n */\n#include <stdio.h>\n```\n\n# 介绍 15\n\n## 分析 basicSyntax.c\n\n```\n\
    int num1 = 4, num2 = 10, i;\ndouble ratio;\n```\n\n在这里我们声明了三个 `int` 类型的整数变量和一个\
    \ `double` 类型的浮点数变量。与 Java 不同，这些类型没有固定的大小；但通常情况下它们与 Java 类型相同。其中两个变量已经初始化，其余包含未定义的数据。与\
    \ Java 不同，如果你尝试使用未初始化的局部变量，C 不会报错。C 程序将直接使用存储在变量对应内存位置上的任何值。该值可以是任何内容。\n\n# 16\n\
    \n## 难点\n\n大多数 C 编译器通常不会对未初始化的变量发出警告。使用 `gcc -Wall` 生成所有可能的警告信息。\n\nC 中 for 循环的语法与\
    \ Java 几乎相同。唯一的区别是循环索引变量不能作为循环的一部分进行声明。在 Java 中，你可以：\n\n```\nfor (int i = 1; i\
    \ <= num1; i++) ...\n```\n\n这在 C 中是语法错误。如示例所示，C 包含了自增运算符 `++`。它可以用于后置或前置，且行为与\
    \ Java 中完全相同。上面的 for 循环使用了 `printf()` 函数的一个额外功能。传递给 `printf()` 的字符串可以包含特殊字符，这些字符前面总有一个百分比字符。序列\
    \ `%d` 表示 `printf()` 的下一个参数应该从整数转换为字符串并插入在此处。`printf()` 之后的空格只是打印一个换行符。\n\nC 中\
    \ while 循环的语法与 Java 相同。在此所示，C 还包含了自减运算符 `--`，它可以作为前置或后置使用，行为与 Java 中完全相同。\n\n\
    # 介绍\n\n```\nif (num1 != 0)\n    ratio = num2 / num1;\nelse\n    ratio = num2\
    \ / 3.0;\n    printf(\"%f\\n\", ratio);\n```\n\nif 语句和 if-else 语句的语法与 Java 相同。有一个重要的区别，因为\
    \ C 不包含布尔类型。关系运算符（如 `>` `<=` 和 `==`）的结果是 `int` 类型的值。如果比较为真，值为 1；如果为假，则值为 0。这在以后将变得重要，因为许多\
    \ C 程序员在程序中使用这一事实。例如，上面的 if-else 语句可以等价重写为：\n\n```\nif (num1)\n    ratio = num2\
    \ / num1;\nelse\n    ratio = num2 / 3.0;\n```\n\n`printf()` 中的格式字符串 `%f` 表示 `printf()`\
    \ 的下一个参数应该从浮点值转换为字符串并插入到输出字符串的该点。使用大括号放置语句块的规则与 Java 相同。此外，if-else 语句的嵌套在 C 中与\
    \ Java 相同。\n\n## 难点\n\n在 Java 中，以下是语法错误：\n\n```\nif (num1 = 0) ...\n```\n\n`num1\
    \ = 0` 将 0 赋值给 `num1`，表达式的值为 0 被解释为假，将执行 if 语句的假分支。在 C 中这是一个非常隐蔽的错误，因为它非常接近用户的意图：\n\
    \n```\n18\nif (num1 == 0) ...\n```\n\n为了帮助发现此类类型错误，许多程序员习惯写成：\n\n```\nif (0 ==\
    \ num1) ...\n```\n\n# 1.3 使用 printf() 输出\n\nC 中的标准输出函数是 `printf()`。`printf` 的名称源于该函数允许格式化打印。这类似于函数重载，相反，`printf()`\
    \ 设计为接受任意数量的参数。`printf()` 的第一个参数总是格式字符串。格式字符串后面跟着零或多个额外的参数，包含了要打印的值。格式化字符序列以特殊字符\
    \ `%` 开头，以转换字符结束。在 `%` 和转换字符之间可以插入额外的格式化字符。以下示例显示了如何将文字字符和多个转换说明在单个 `printf()`\
    \ 中结合。\n\n# 介绍 19\n\n```\n/* printfExample.c\n * printf() 的简单用法。\n */\n#include\
    \ <stdio.h>\n\nint main() {\n    int intVal = 10;\n    double doubleVal = 1.234;\n\
    \n    printf(\"intVal = %d, doubleVal = %f\\n\",\n           intVal, doubleVal);\n\
    \n    return 0;\n}\n```\n\n该程序的输出是：\n\n```\nintVal = 10, doubleVal = 1.234000\n\
    ```\n\n注意值是如何插入到输出中的。下表列出了 `printf` 的所有转换字符。\n\n# 20\n\n| 转换字符 | 参数 | 描述 |\n|\
    \ --- | --- | --- |\n| c | char | 打印单个字符。 |\n| d or i | int | 打印整数。 |\n| u | int\
    \ | 打印无符号整数。 |\n| o | int | 打印八进制整数。 |\n| x or X | int | 打印十六进制整数。 |\n| e or E\
    \ | float or double | 以科学计数法打印。 |\n| f | float or double | 打印浮点值。 |\n| g or G\
    \ | float or double | 与 e、E 或 f 相同。 |\n| s | char * | 打印字符串。 |\n| p | void * |\
    \ 以十六进制打印指针的值。 |\n| n | int * | 不打印；而是将为止的字符数存入参数中。 |\n| % | none | 打印单个 %；没有对应的参数。\
    \ |\n\n表中所示转换字符指定的标准格式可以通过在 `%`、格式字符串和转换字符之间插入额外的字符进行修改。这些额外的格式信息可能包括以下内容，顺序为：标志、字段宽度、精度和长度修饰，下文所述。\n\
    \n# 介绍 21\n\n## 标志 — 有几个可选标志可用于控制左/右对齐、填充字符和相关格式。它们描述如下表所示。\n\n| 标志 | 描述 |\n|\
    \ - | - |\n| - | 输出字符串在字段中左对齐。默认是右对齐。 |\n| + | 对于可能为负值生成负号的转换，正值通常省略 `+`。使用此标志时将包含\
    \ `+`。 |\n| space | 使用可能生成负号的转换时，在非负数值输出前插入一个空格。这与 `+` 标志类似。当输出包含负正正值时，空格标志用于对齐第一位数字。如果同时包含\
    \ `+` 和空格标志，则忽略空格标志。 |\n| # | 此标志的效果取决于转换字符。对于转换字符 `o`，输出字符串开头打印一个 0。前导 0告知读者这是八进制格式。对于转换字符\
    \ `x` 或 `X`，输出字符串开头打印 `0x` 或 `OX`，告知读者这是十六进制。对于转换字符 `g` 或 `G`，打印尾随零。对于转换字符 `e`、`E`、`f`、`g`\
    \ 或 `G`，始终打印小数点。 |\n| 0 | 数值转换将使用 0 而不是空格填充输出以充满指定的字段。 |\n\n字段宽度 — 每个转换参数都打印在一个字段中。默认情况下，字段宽度足够容纳转换值。当指定了字段宽度时，根据标志在左侧用\
    \ 0 或空格填充，或在右侧用空格填充。如果字段宽度太小，它将扩展到转换参数的宽度。\n\n"
