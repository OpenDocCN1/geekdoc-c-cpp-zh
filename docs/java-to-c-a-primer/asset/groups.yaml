    \ 41\n- 3.2 多维数组 ...............................................................................\
    \ 43\n- 3.3 将数组作为参数传递 ...................................................................\
    \ 44\n- 3.4 动态分配数组 ...................................................................\
    \ 48\n\n# 4 字符串\n\n- 4.1 字符串：字符数组 . . . . . . . . . . . . . . . . . 53\n- 4.2\
    \ 字符串操作 . . . . . . . . . . . . . . . . 56\n- 4.3 使用 scanf() 读取字符串 . . . . . .\
    \ . . . . . 61\n\n# 5 结构化数据类型\n\n- 5.1 声明结构化数据类型 . . . . . . . . . . 67\n- 5.2\
    \ 将结构体作为参数传递 . . . . . . . . . . 71\n- 5.3 结构体指针 . . . . . . . . . . . . 77\n\
    - 5.4 结构体值的动态分配 . . 80\n\n# 6 文件 I/O 和多源文件\n\n- 6.1 文件 I/O 和命令行参数 . . . . . 87\n\
    - 6.2 头文件 . . . . . . . . . . . . . 92\n\n# 0.1 C 标准\n\nC 语言语言开发于 20 世纪 70 年代初，最初作为系统实现语言，Brian\
    \ Kernighan 和 Dennis Ritchie 于 1978 年出版了《C程序语言》第一版。它被 C 程序员称为“K&R”，该书的第二版涵盖 1989\
    \ 年的 ANSI C 标准。\n\nISO 标准被称为 C90，于 1990 年发布为 ISO/IEC 9899:1990。它在技术上与 ANSI C 标准相同。新版本的\
    \ ISO C 标准被称为 C99，于 1999 年发布为 ISO/IEC 9899:1999。另一个版本的 ISO C 标准被称为 C11，于 2011\
    \ 年发布为 ISO/IEC 9899:2011。\n\n截至 2013 年 2 月，GNU 编译器集合 (GCC) 的默认版本是带有某些 GNU 扩展的\
    \ C90（例如 // 单行注释样式，这在 C99 和 C11 中是允许的）。书中的程序已使用不带任何选项的 gcc 命令通过测试。在未给出 C 语言方言选项的情况下，当前的选项是\
    \ -std=gnu90。\n\n# 1 引言\n\n对于 C 和 Java 共同的语言特性，两种语言通常具有相似甚至完全相同的语法。这两种语言之间的主要区别之一是\
    \ C 不是面向对象的。这意味着程序不是类的集合。相反，一个 C 程序是函数的集合。C 中的函数与 Java 中的静态方法非常相似。在本章中，我们将介绍 C\
    \ 程序的各种结构，包括内置类型、变量声明、简单输出、条件判断和循环。正如你所看到的，这些特征大部分与 Java 中的对应特征几乎相同。\n\n# 1.1\
    \ “Hello, world!”\n\n让我们从经典的“Hello, world!”程序开始。\n\n```\n/* hello.c\n * 打印 hello。\n\
    \ */\n#include <stdio.h>\n\nint main() {\n    printf(\"Hello, world!\\n\");\n\
    \    return 0;\n}\n```\n\n该程序的输出是：\n\nHello, world!\n\n# hello.c 详解\n\n```\n/*\
    \ hello.c\n * 打印 hello。\n */\n```\n\n这是一个注释，就像 Java 中一样。大多数 C 编译器也允许 // 单行注释样式。\n\
    \n```c\n#include <stdio.h>\n```\n\n其的作用与 Java 中的 import 类似；但其效果有所不同。include 语句告诉编译器去哪里查找额外的类。`#include`\
    \ 被称为编译器指令。它告诉编译器在编译的主阶段之前，将命名文件（在本例中为 std.h）的内容直接插入程序。\n\n```c\nint main()\n\
    ```\n\n这一行声明 main() 为一个返回 int 且没有参数的函数。许多程序员倾向于以下替代声明：\n\n```c\nint main(void)\n\
    ```\n\n关键字 `void` 是可选的；它用于强调没有预期参数。但正如我们在第 6 章中看到的，也可以声明带有参数的 `main()`。\n\n# 1.2\
    \ 内置类型、局部变量、循环和条件判断\n\nJava 的基本类型在 C 中有对应的类型。唯一的例外是 Java 的 `boolean` 类型。C 没有布尔类型。相反，C\
    \ 使用整数来表示布尔值，将整数零解释为假，将任何其他整数值解释为真。\n\n难点：\n\nC 没有布尔类型。使用 int 代替，将非零视为真，零视为假。\n\
    \n"
