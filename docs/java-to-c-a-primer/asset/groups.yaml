    Precision — Precision is specified by a period followed by a non-negative integer.
    The precision is interpreted differently for different conversion characters,
    as shown in the following table.


    | Conversion characters | Effect of precision specification |

    |---|--|

    | d, i, o, u, x, X | The precision specifies the minimum number of digits that
    will be printed. Leading zeros will be printed as necessary. |

    | e, E, f | The precision specifies the number of digits that will be printed
    to the right of the decimal point. |

    | g, G | The precision specifies the maximum number of significant digits that
    will be printed. |

    | s | The precision specifies the maximum number of characters that will be printed
    from the string. |


    Length Modifier — An l1 (that is, the letter l) placed just before d, i, o, u,
    x or X conversion character indicates that the corresponding argument to be converted
    is a long int. Similarly an h placed before those same conversion characters indicates
    that the argument is a short int. An L placed before an e, E, f, or G indicates
    that the argument is a long double.


    To summarize, if we f stand for flags, w for width of the field, p for precision,
    1 for length modifier, and c for conversion character, we see that a conversion
    string has the general form:


    ```

    %fw.plc

    ```


    where only the % and the conversion character represented by c are required. The
    following program and its output demonstrates a few of the many formatting possibilities.'
