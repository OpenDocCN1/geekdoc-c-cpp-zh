  - '[PAGE 21]


    # Introduction 21


    Flags — There are several optional flags that can be used to control left/right
    justification, fill character, and related formatting information. They are described
    in the following table.


    | Flag | Description |

    | - | - |

    | - | The output string will be left-justified in the field. The default is right-justification
    |

    | + | For conversions that might generate a minus sign for negative values, the
    + is normally omitted for positive values. With this flag, the + is included.
    |

    | space | Inserts a space in front of non-negative numeric output when using a
    conversion that might generate a minus sign. This is similar to the + flag. The
    space flag is used to align the first digit when the output includes both negative
    and positive values. If both the + and space flags are included the space flag
    is ignored. |

    | # | The effect of this flag depends upon the conversion character. With conversion
    character o, a zero is printed at the front of the output string. The leading
    zero indicates to the reader that this is in octal format. With conversion characters
    x or X, the string 0x or OX is printed at the front of the output string indicating
    hexadecimal to the reader. With conversion characters g or G, trailing zeros are
    printed. With conversion characters e, E, f, g, or G, a decimal point is always
    printed. |

    | 0 | Numeric conversions will use zeros instead of spaces to pad the output to
    fill the specified field. |


    Field Width — Each converted argument is printed in a field. By default, the field
    is just wide enough to hold the converted value. When a field width is specified,
    the output is padded on the left with zeros or spaces, or on the right with spaces,
    depending on the flags. If the field width is too small, it is extended to the
    width of the converted argument.'
- md: "\nPrecision — Precision is specified by a period followed by a non-negative\
    \ integer. The precision is interpreted differently for different conversion characters,\
    \ as shown in the following table.\n\n| Conversion characters | Effect of precision\
    \ specification |\n|---|---|\n| d, i, o, u, x, X | The precision specifies the\
    \ minimum number of digits that will be printed. Leading zeros will be printed\
    \ as necessary. |\n| e, E, f | The precision specifies the number of digits that\
    \ will be printed to the right of the decimal point. |\n| g, G | The precision\
    \ specifies the maximum number of significant digits that will be printed. |\n\
    | s | The precision specifies the maximum number of characters that will be printed\
    \ from the string. |\n\nLength Modifier — An l1 (that is, the letter l) placed\
    \ just before d, i, o, u, x or X conversion character indicates that the corresponding\
    \ argument to be converted is a long int. Similarly an h placed before those same\
    \ conversion characters indicates that the argument is a short int. An L placed\
    \ before an e, E, f, or G indicates that the argument is a long double.\n\nTo\
    \ summarize, if f stand for flags, w for width of the field, p for precision,\
    \ 1 for length modifier, and c for conversion character, we see that a conversion\
    \ string has the general form:\n\n```\n%fw.plc\n```\n\nwhere only the % and the\
    \ conversion character represented by c are required. The following program and\
    \ its output demonstrates a few of the many formatting possibilities.\n\n# Introduction\
    \ 23\n\n```\n/* printf.c\n * Demonstrate a few formatting possibilities.\n */\n\
    #include <stdio.h>\n\nint main() {\n    int anInt = 123;\n    float aFloat = 1.234567;\n\
    \n    printf(\"%1234567890,1234567890\\n\");\n    printf(\"%-10.4d,%%10.4d\\n\"\
    , anInt, anInt);\n    printf(\"%010d,%%#x\\n\", anInt, anInt);\n    printf(\"\
    %-10.4f,%%10.7f\\n\", aFloat, aFloat);\n    return 0;\n}\n```\n\n1234567890,1234567890\n\
    +0123,+0123\n000000123,0x7b\n1.2346,+1.2345670\n\n# 1.4. Input with scanf()\n\n\
    The function scanf() is similar in form to printf() but it is used for input instead\
    \ of output. Here is a simple example that uses scanf() to read an integer and\
    \ a floating-point value from the standard input device, usually the keyboard.\n\
    \n```\n/* scanfExample.c\n * Simple use of scanf().\n */\n#include <stdio.h>\n\
    ```\n\n# 24\n\n```\nint main() {\n    int intVal;\n    float floatVal;\n\n   \
    \ scanf(\"%d\", &intVal);\n    scanf(\"%f\", &floatVal);\n\n    printf(\"%d, floatVal\
    \ = %f\\n\",\n           intVal, floatVal);\n\n    return 0;\n}\n```\n\nThe strings\
    \ for scanf() are very similar to those for printf(). In the example we use %d\
    \ to indicate that an int is to be read from the standard input device and %f\
    \ to indicate that a float is to be read. These input strings will automatically\
    \ skip over any white space characters. The white space characters are newline,\
    \ space, and tab. Notice the variables into which the data is to be stored are\
    \ preceded by the &. The & is the \"address of\" operator. It will be explained\
    \ in more detail. It must always be used when reading built-in types into variables.\
    \ The function scanf() needs to know where to store the values variables; hence\
    \ the function is passed the \"address of\" the variables where the values are\
    \ to be stored. It is not possible in Java to write a function like scanf with\
    \ multiple output parameters that are primitive types.\n\n# Trouble spot\n\nIf\
    \ you get the & in front of one of the parameters to scanf(), your program will\
    \ most likely abort with some obscure message.\n\nThe & in front of a variable\
    \ or expression of type T changes the type of the expression from type T to type\
    \ T*. The type T* is a pointer to a value of type T. We will explain this in chapter\
    \ 2. In the following table when you see the argument must be type T*, then it\
    \ is an indication that you can place a variable of type T, preceded by & in the\
    \ corresponding argument for scanf(). The following table lists the conversion\
    \ characters for scanf().\n\n# Introduction 25\n\n| Conversion character | Argument\
    \ | Description |\n|---|---|---|\n| c | char* | Read a single character. |\n|\
    \ d | int* | Read a decimal integer. |\n| i | int* | Read an integer in decimal,\
    \ octal, or hexadecimal. Octal is indicated by a leading 0, and hexadecimal by\
    \ a leading 0x. |\n| u | unsigned* | Read an unsigned decimal integer. |\n| o\
    \ | unsigned* | Read an octal integer. No leading 0 is required. |\n| x, X | int*\
    \ | Read a hexadecimal integer. No leading-0x or 0X is required. |\n| e, f, g,\
    \ G | float* | Read a floating point number. |\n| s | char* | Read a sequence\
    \ of non-white characters. (Do not use this with &c, where c is a simple char\
    \ variable. See chapter-4.) |\n| p | void** | Read a pointer's value in the same\
    \ format as that created with p in printf(). |\n| n | int* | Store into the argument\
    \ the number of characters read so far. |\n| % | none | Skip a single % in the\
    \ input. |\n| [...] | char* | Read characters as in conversion character xs, except\
    \ that only characters specified by the scan set between the brackets are read.\
    \ Any others terminate the input for this argument. The scan set is discussed\
    \ further in chapter 4. |\n\n26\n\nAs with printf(), the basic formatting specified\
    \ by the conversion characters shown in the previous table can be modified with\
    \ additional formatting characters inserted between the % signaling a format string\
    \ and the conversion character that ends the format string. This additional formatting\
    \ information may include the following flags, in order: assignment (*), field\
    \ width (an integer), and length modifier (of h, 1, or L), as described below.\n\
    \n| Flag | Description |\n|---|---|\n| * | The read value is discarded. There\
    \ is no corresponding argument. |\n| an integer | This specifies the maximum number\
    \ of characters that will be scanned for the current argument. |\n| h | The length\
    \ modifier h can precede a, i, o, u, x, or X conversion character. It indicates\
    \ that the corresponding argument is a short int*, or unsigned short int*. |\n\
    | 1 | Same as h but the corresponding argument is a long int*, or unsigned long\
    \ int*. In addition, 1 can precede e, E, f, g, or G, in which case the argument\
    \ is a double*. |\n| L | The length modifier L can precede e, E, f, g, or G. The\
    \ corresponding argument should be a long double*. |\n\n# Chapter Summary\n\n\
    - A C program is a collection of functions. Functions are very similar to static\
    \ methods in Java. C program execution begins in the function main().\n\n- Comments\
    \ are indicated with // or /* ... */, just as in Java.\n\n- The standard C types\
    \ include the Java primitive types except for non-zero is interpreted as true.\n\
    \n- C represents boolean values as integers. Zero is interpreted as false; non-zero\
    \ is interpreted as true.\n\n- In general, the built-in operators for the standard\
    \ C types are the same as those for the corresponding Java primitive types.\n\n\
    - Expressions involving relational operators evaluate to one for true and zero\
    \ for false. The boolean operators operate on integers treating any non-zero value\
    \ as true.\n\n- The syntax of both for and while loops is the same as in Java.\n\
    \n- The syntax of if-else statements is the same, except that any integer expression\
    \ can be used as the conditional expression.\n\n- The standard C print function\
    \ is printf().\n\n- The standard C input function is scanf().\n\n# Passing Parameters\
    \ to Functions 29\n\n# 2. Passing Parameters to Functions\n\nJava and C both pass\
    \ parameters using call-by-value. This means that the value of the actual parameter\
    \ is copied and stored in the corresponding formal parameter. Because the value\
    \ of the actual parameter is copied, the value stored in the actual parameter\
    \ cannot be modified by the function.\n\nIn Java you can get several results from\
    \ a function by passing references to several objects and then modifying the objects\
    \ in the function. In C the same thing is accomplished by passing pointers.\n\n\
    # 2.1. Declaring functions\n\nBelow is a simple example of parameter passing and\
    \ a program with two functions, main() and min().\n\n```\n/* min.c\n * Simple\
    \ function definition/call.\n */\n#include <stdio.h>\n\nint min(int x, int y)\
    \ {\n if (x < y)\n    return x;\nelse\n    return y;\n}\n\nint main() {\n int\
    \ num1, num2;\n\nprintf(\"Enter two integers.\\n\");\nscanf(\"%d%d\", &num1, &num2);\n\
    }\n```\n"
  mdcn: "\n精度 — 精度由一个点号后跟一个非负整数指定。对于不同的转换字符，精度的解释也不同，如下表所示。\n\n| 转换字符 | 精度规范的影响 |\n\
