    # 0.1. C standards


    The C programming language was developed in the early 1970s, originally as a system
    implementation language, and Brian Kernighan and Dennis Ritchie published the
    first edition of “The C Programming Language” in 1978. It is known to C programmers
    as “K&R” and the second edition of the book covers the ANSI C standard from 1989.


    The ISO standard, known as C90, was published in 1990 as ISO/IEC 9899:1990. It
    is technically identical to the ANSI C standard. A new edition of the ISO C standard,
    known as C99, was published in 1999 as ISO/IEC 9899:1999. Yet another edition
    of the ISO C standard, known as C11, was published in 2011 as ISO/IEC 9899:2011.


    As of February 2013 the default for the GNU Compiler Collection (GCC) is C90 with
    certain GNU extensions, like the // single line comment style, which is allowed
    in C99 and C11. The programs in this book have been tested using the gcc command
    without any options. The current default, if no C language dialect options are
    given, is the option -std=gnu90.'
