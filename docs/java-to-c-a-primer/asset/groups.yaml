    | u | unsigned* | Read an unsigned decimal integer. |

    | o | unsigned* | Read an octal integer. No leading 0 is required. |

    | x, X | int* | Read a hexadecimal integer. No leading-0x or 0X is required. |

    | e, f, g, G | float* | Read a floating point number. |

    | s | char* | Read a sequence of non-white characters. (Do not use this with &c,
    where c is a simple char variable. See chapter-4.) |

    | p | void** | Read a pointer''s value in the same format as that created with
    p in printf(). |

    | n | int* | Store into the argument the number of characters read so far. |

    | % | none | Skip a single % in the input. |

    | [...] | char* | Read characters as in conversion character xs, except that only
    characters specified by the scan set between the brackets are read. Any others
    terminate the input for this argument. The scan set is discussed further in chapter
