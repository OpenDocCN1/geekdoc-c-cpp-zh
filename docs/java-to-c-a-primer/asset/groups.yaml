    # Chapter Summary


    +   - In C, although parameters are always passed call-by-value, be the value
    that is passed can be an address, C can get the effect of call-by-reference.


    +   - Function syntax is essentially the same as a static method in Java.


    +   - C requires a function prototype if a function call appears in a file before
    the definition of the function.


    +   - The expression &x is the address of x; a reference to the location containing
    the value of x. In Java variables of non-primitive types are references (references)
    to both built-in types such as int, and user-defined types.


    +   - The expression *x evaluates not to the value in variable x but to the value
    in the memory location whose address is variable x. In this case, x is like a
    Java reference variable.


    +   - Using the address of operator (&) and the indirection operator (*), C can
    get the effect of call-by-reference for built-in types such as int. This makes
    it possible to have multiple output parameters that are values of built-in types.
    This is not possible in Java without using wrapper classes.'
