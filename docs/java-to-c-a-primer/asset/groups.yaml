  mdcn: "\n所有可能的警告信息。我们强烈建议你始终使用此标志。`scanf()` 稍微不同，是因为 `scanf()` 使用了一种特殊的 C 语言表示法，表示除了第一个参数（格式字符串）外，它实际上并不知道将传递什么种类型的参数。格式字符串的内容决定了其他参数的适用类型。\n\
    \n## 章节总结\n\n- 在 C 中，虽然参数始终是通过值传递（call-by-value）的，但如果传递的值可以是一个地址，C 就可以实现引用传递的效果。\n\
    - 函数语法本质上与 Java 中的静态方法相同。\n- 如果函数调用在函数定义之前出现在某个文件中，C 需要一个函数原型声明。\n- 表达式 `&x` 是\
    \ `x` 的地址；指向包含 `x` 值的内存引用。在 Java 中，非基本类型变量是指向内置类型（如 `int`）和用户定义类型的引用（references）。\n\
    - 表达式 `*x` 求值结果不是变量 `x` 中的值，而是变量 `x` 所代表地址的内存位置中的值。在这种情况下，`x` 类似于 Java 的引用变量。\n\
    - 通过使用地址运算符 (`&`) 和间接引用运算符 (`*`)，C 可以实现对 `int` 等基本类型实现引用传递的效果。这使得拥有多个作为基本类型值的输出参数成为可能。这在\
    \ Java 中如果不使用包装类是无法实现的。\n\n## 3. 数组\n\n从语法上上看，C 语言中的数组看起来与 Java 中的数组非常相似；然而，它们实际上非常不同。在\
    \ Java 中，所有数组都是使用 `new` 操作符动态创建的。在 C 中，数组既可以动态创建也可以静态创建。\n\n### 3.1. 一维数组\n\n\
    让我们先看看静态分配的数组。以下语句声明并分配了一个包含 10 个整数的数组。注意括号位于变量名之后，而不是元素类型 `int` 之后。\n\n```\n\
    int smallArray[10];\n```\n\n可以使用数组索引来访问此数组的元素，就像在 Java 中一样。例如，以下代码段将打印上述数组的元素。\n\
    \n```\nint i;\n\nfor (i = 0; i < 10; i++)\n    printf(\"%d\\n\", smallArray[i]);\n\
    ```\n\n上述 C 示例与其 Java 对应示例之间存在几点重要区别。首先，C 不检查数组索引是否在数组边界内。以下代码将编译并运行，但产生不可预测的结果。\n\
    \n```c\n/* arrayBounds.c\n * 在不报错的情况下越数组边界。\n */\n#include <stdio.h>\n```\n\n\
    ```\nint main() {\n    int smallArray[10];\n    int i;\n\n    for (i = 0; i <\
    \ 10; i++)\n        smallArray[i] = i*10;\n\n    for (i = 0; i <= 10; i++)\n \
    \       printf(\"%d\\n\", smallArray[i]);\n\n    return 0;\n}\n```\n\n注意，第二个循环执行了\
    \ 11 次，`i` 的范围从 0 到 10（包含），但数组的边界是 0 到 9（包含）。C 语言中的数组不像 Java 那样随身携带长度。\n\nC 语言数组与\
    \ Java 数组的另一个区别是，你不能将数组变量重新赋值以指向新数组。这意味着你不能更改数组的大小。在示例中，没有方法在初始声明后改变 `smallArray`\
    \ 以指向一个更大的数组。正如我们将在下文所示，你可以动态创建数组并使用变量引用它们，但这些变量实际上是指针。\n\nC 语言中静态分配的数组也可以使用数组初始化器创建，其语法与\
    \ Java 的数组初始化器完全相同。以下语句创建了一个包含五个整数的静态数组，并初始化为从 100 到 500 的值。\n\n```c\nint x[]\
    \ = { 100, 200, 300, 400, 500 };\n```\n\n该语句在 C 和 Java 中都是合法的。尽管 Java 的首选语法将括号放在类型\
    \ `int` 之后，例如：\n\n```java\n// 非合法的 C 代码\nint[] x = { 100, 200, 300, 400, 500 };\n\
    ```\n\n### 3.2. 多维数组\n\n多维数组使用多对括号创建。以下代码创建了一个整数型二维数组：\n\n```c\nint matrix[10][20];\n\
    ```\n\n上述声明为 200 个整数分配了存储空间。该数组的元素可以像在 Java 中一样被访问。以下代码将整个数组初始化为 0。\n\n```c\n\
    for (i = 0; i < 10; i++)\n  for (j = 0; j < 20; j++)\n    matrix[i][j] = 0;\n\
    ```\n\n与 Java 不同，声明为局部变量的数组不会初始化为 0。\n\n## 难点\n\n大多数 C 编译器在没有初始化数组时不会给你任何提示。\n\
    \n由于这种结果，当你访问未初始化的数组时将得到不可预测的值。\n\n技术上，C 中的多维数组只是按行存储的数组。从左到右读取，第一个括号是行，第二个括号是列。多维数组通过增加更多的括号来创建。多维数组是按主序存储的。\n\
    \n```c\nint space[10][20][30];\n\nint i, j, k;\n\nfor i = 0; i < 10; i++)\n  for\
    \ (j = 0; j < 20; j++)\n    for (k = 0; k < 30; k++)\n      space[i][j][k] = 0;\n\
    ```\n\n### 3.3. 传递数组\n\n要将数组作为参数传递，使用数组名称。记住，C 总是使用值传递。在这种情况下，传递的值不是整个数组的值，而是第一个元素的地址。\n\
    \n```c\n/* arrayParams.c\n * 将数组作为传递。 */\n#include <stdio.h>\n\nvoid fillIt(int\
    \ someArray[]);\n\nint main() {\n  int smallArray[10];\n  int i;\n\n  fillIt(smallArray);\n\
    \n  for (i = 0; i < 10; i++)\n    printf(\"%d \", smallArray[i]);\n  printf(\"\
    \\n\");\n\n  return 0;\n}\n```\n\n```c\nvoid fillIt(int someArray[]) {\n  int\
    \ i;\n  for (i = 0; i < 10; i++)\n    someArray[i] = 100 + i;\n}\n```\n\n此程序的输出结果为：\n\
