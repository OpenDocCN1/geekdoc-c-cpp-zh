    \ 存储的地址被解释为指向存储整数位置的指针。增加地址会导致 `someArray` 指向内存位置。由于数组是连续分配的，也就是说数组元素放置在连续的内存位置上，增加指向元素的指针会导致该指针指向下一个数组元素。通过这种方式，随着循环的执行，变量\
    \ `someArray` 会指向 `smallArray` 的每一个元素。\n\n## 3.4. 动态分配数组\n\n除了上面讨论的静态分配数组外，C 语言允许对数组进行动态分配。使用动态分配数组时，数组变量伪装成指针以外的这种伪装被完全去除了。下面的示例根据用户指定的值动态创建一个数组。\n\
    \n```c\n/* dynamicArray.c\n * 动态创建一个数组。\n */\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nvoid fillIT(int *someArray);\n\nint main() {\n    int *array_p;\n    int size,\
    \ i;\n\n    printf(\"How many elements in the array?\\n\");\n    scanf(\"%d\"\
    , &size);\n\n    array_p = calloc(size, sizeof(int));\n\n    for (i = 0; i < size;\
    \ i++)\n        array_p[i] = 100 + i;\n\n    for (i = 0; i < size; i++)\n    \
    \    printf(\"%d \", array_p[i]);\n    printf(\"\\n\");\n\n    return 0;\n}\n\
    ```\n\n在上面的示例中，`array_p` 是“数组变量”，尽管正如你所看到的，它实际上是一个指向整数的指针。数组是通过调用 `calloc()` 函数创建的，该函数是标准\
    \ C 库的一部分。`calloc()` 的原型在 `stdlib.h` 中，在上面的程序开头被包含了。`calloc()` 函数接受两个参数。第一个是正在分配的数组元素的个数，第二个是每个元素的大小。\n\
    \n从上面的示例中可以看出，我们可以对指向 `int` 的指针使用方括号 `[]` 索引语法。事实上，以下两个语句在所有实际用途中都是等价的。\n\n```c\n\
    *array_p = x;\n```\n\n```c\narray_p[0] = x;\n```\n\n上面填充数组的循环可以写成：\n\n```c\ntemp_p\
    \ = array_p;\nfor (i = 0; i < size; i++) {\n*temp_p = 100 + i;\ntemp_p++;\n}\n\
    ```\n\n这假设 `temp_p` 在此之前已声明为指向整数的指针。\n\n在 Java 中，动态分配的内存（使用 `new` 创建）使用所谓的垃圾回收进行自动回收。在\
    \ C 语言中，动态分配的内存必须由程序员手动释放。如果像上面 `array_p` 这样的数组作为较大程序的一部分分配的，当数组的存储空间不再需要时，程序员必须使用\
    \ `free()` 释放内存。你如下所示释放从调用 `calloc()` 返回的指针：\n\n```c\narray_p = calloc(size, sizeof\
    \ (int));\n...\n// 当完成数组操作后\nfree(array_p);\n```\n\n未能释放内存会导致所谓的内存泄漏。这会产生一个长时间运行的程序，持续分配更多内存并最终将耗尽内存。另一方面，如果程序继续尝试使用已通过\
    \ `free()` 释放的内存，可能会导致不可预测的结果。指向已释放内存的指针变量被称为悬空指针。任何使用此类指针的尝试被称为悬空指针错误。这些内存分配内存问题说明了为什么\
    \ Java 等语言提供了带有垃圾回收的自动内存管理。\n\n## 章节总结\n\n- C 语言中的静态数组在 Java 中没有直接对应的类型。内存是隐式分配的，数组的大小是声明的一部分。例如，\
    \ `int x[10]` 创建了一个包含 10 个整数的静态数组。该变量 `x` 将始终引用这个包含 10 个整数的数组。\n- 数组元素的索引方式与 Java\
    \ 中的数组一样。\n- 动态分配数组使用 `calloc()` 分配。从 `calloc()` 返回的内存被初始化为全零。\n- 与 Java 不同，数组索引没有边界检查。\n\
    - 数组变量实际上只是指向第一个元素的指针。\n- C 语言中的字符串在 Java 中没有直接对应的类型。\n- 数组是以引用方式传递的。\n\n## 字符串\n\
    \nC 语言中的字符串本质上就是字符数组。\n\n### 4.1. 字符串：字符数组\n\nC 语言中的正形成字符串以空字符作为结束。正如 Java 一样，`\\\
    ` 是转义字符。考虑以下示例：\n\n```c\n/* strings.c\n# 显示字符数组显示。\n */\n#include <stdio.h>\n\n\
    int main() {\n    char strOne[] = {'s','t','r','i','n','g',' ','o','n','e','\\\
    0'};\n    char *char_p;\n    int i;\n\n    printf(\"%s\\n\", strOne);\n\n    for\
    \ (i = 0; strOne[i] != '\\0'; i++)\n        printf(\"%c,\", strOne[i]);\n    printf(\"\
    \\n\");\n\n    for (char_p = strOne;\n        *char_p != '\\0';\n        char_p++)\n\
    \        printf(\"%c,\", *char_p);\n    printf(\"\\n\");\n\n    return 0;\n}\n\
    ```\n\n该程序的输出为：\n\n```\nstring one\ns,t,r,i,n,g,,o,n,e,\n```\n\n## 解析 strings.c\n\
