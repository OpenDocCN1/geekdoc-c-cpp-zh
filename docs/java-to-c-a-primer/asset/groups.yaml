    |

    | s | char * | Print a string. |

    | p | void * | Print a pointer''s value in hexadecimal. |

    | n | int * | Nothing is printed; instead store into the argument the number of
    characters printed so far. |

    | % | none | Print a single %; there is no corresponding argument. |


    The basic formatting specified by the conversion characters shown in this table
