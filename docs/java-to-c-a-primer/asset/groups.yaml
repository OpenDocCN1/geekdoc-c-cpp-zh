    \ 标准 C 的输入函数是 scanf()。\n\n# 参数传递 29\n\n# 2. 传递参数\n\nJava 和 C 都通过值传递参数。这意味着实际参数的值被复制并存储在对应的形式参数中。因为实际参数的值被复制了，函数无法修改实际参数中存储的值。\n\
    \n在 Java 中，可以通过传递多个对象的引用从函数获取多个结果，并在函数内部修改对象。在 C 中，这通过指针来实现。\n\n# 2.1. 声明函数\n\n\
