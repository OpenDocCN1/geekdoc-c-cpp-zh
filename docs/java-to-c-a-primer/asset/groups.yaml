    26


    As with printf(), the basic formatting specified by the conversion characters
    shown in the previous table can be modified with additional formatting characters
    inserted between the % signaling a format string and the conversion character
    that ends the format string. This additional formatting information may include
    the following flags, in order: assignment (*), field width (an integer), and length
    modifier (of h, 1, or L), as described below.


    | Flag | Description |

    |---|---|\| * | The read value is discarded. There is no corresponding argument.
    |

    | an integer | This specifies the maximum number of characters that will be scanned
    for the current argument. |

    | h | The length modifier h can precede a, i, o, u, x, or X conversion character.
    It indicates that the corresponding argument is a short int*, or unsigned short
    int*. |

    | 1 | Same as h but the corresponding argument is a long int*, or unsigned long
    int*. In addition, 1 can precede e, E, f, g, or G, in which case the argument
    is a double*. |

    | L | The length modifier L can precede e, E, f, g, or G. The corresponding argument
    should be a long double*. |'
