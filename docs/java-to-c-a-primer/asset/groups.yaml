    \ the parameter is declared to be a pointer to student_t, not a simple student_t\
    \ value. Finally, we use the indirection operator to get to the actual student_t\
    \ value and then access the fields. The parentheses in statements such as\n\n\
    ```c\n(*student_p).gpa = 3.5;\n```\n\nare required. Both * and . are operators\
    \ in this statement. They have precedence, and the precedence for . is higher\
    \ than the precedence for *. Therefore, with the parentheses\n\n```c\n*student_p.gpa\
    \ = 3.5;\n```\n\nwould first try to access the field gpa of the pointer student_p.\
    \ But student_p is not a structure value that has fields; it is a pointer. Thus\
    \ the expression student_p.gpa is a syntax error. With the parentheses, the expression\
    \ (*student_p) is a student_t value that has a field gpa so that (*student_p).gpa\
    \ is a legal expression.\n\nBecause pointers to structures are frequently used\
    \ in C, probably more often than actual structure variables, C provides a special\
    \ syntax for accessing a field of using a pointer to the structure value. The\
    \ following is an equivalent way of writing readRecord() using the preferred syntax\
    \ for accessing fields, given pointer to a structure value.\n\n## 80\n\n```c\n\
    void readRecord(student_t *student_p) {\n    student_p->gpa = 3.5;\n    student_p->startYear\
    \ = 2000;\n    strncpy(student_p->first,\n      \"Jane\", NAME_SIZE);\n    strncpy(student_p->last,\n\
