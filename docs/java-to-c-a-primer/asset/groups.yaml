    \ 实际上是 C 中的字符串。我们可以使用 `printf()` 和转换字符串 `%s` 来打印它。\n\n```c\nfor (i = 0; strOne[i]\
    \ != '\\0'; i++)\n    printf(\"%c,\", strOne[i]);\n```\n\n我们也可以使用普通的数组表示法逐个打印字符串的字符。\n\
    \n```c\nfor (char_p = strOne;\n    *char_p != '\\0';\n    char_p++)\n    printf(\"\
    %c,\", *char_p);\n```\n\n正如我们在第 3 章对 `int` 数组所做的那样，也可以使用指针表示法打印字符串的字符。由于字符串非常频繁，可以使用字符串字面量表示来初始化字符串（字符数组）。以下两个语句是等价的（除了第一个语句中的指针在后续语句中可以指向另一个字符串）：\n\
