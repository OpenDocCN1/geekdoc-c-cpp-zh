  md: "# File I/O and Multiple Source Files\n\n```\nint pop(stack_t* stack_p) {\n\
    \    if (stack_p == NULL ||\n        stack_p->top_p == NULL) {\n        fprintf(stderr,\n\
    \            \"ERROR: pop empty stack\\n\");\n        exit(1); // abort the program\n\
    \    }\n    else {\n        int result;\n        stackElem_t result_elem;\n  \
    \      result_elem = stack_p->top_p;\n        result = result_elem->value;\n \
    \       stack_p->top_p = result_elem->next_p;\n        free(result_elem);\n  \
    \      return result;\n    }\n}\n```\n\nC does not have direct support for exception\
    \ handling. In a Java program we might throw an exception if an attempt was made\
    \ to pop an empty stack or a stack that had not been properly initialized. In\
    \ this example we simply abort the program printing an error message. If the stack\
    \ is not empty, we remove the top element, top_p to the next element in the stack,\
    \ and free the memory occupied by the popped stackElem_t value. Without the free(),\
    \ the memory for the popped stackElem_t would constitute a memory leak. A program\
    \ using this implementation would slowly consume more and more memory until it\
    \ ran out of memory. There are weaknesses with this implementation. There is nothing\
    \ in the language that prevents other parts of a program from pointing to stackElem_t\
    \ values from the stack and using them. However, if a program did this, then unpredictable\
    \ behavior would result when we free the memory, as we do here. There are ways\
    \ to implement a stack that provide increased data hiding, but those techniques\
    \ are beyond the scope of this brief book on C."
