    # Chapter Summary


    +   - C provides access to command line arguments by passing an array of strings
    and an argument count as parameters to main().

    - A file can be opened for reading or writing using the standard C function fopen().

    - The function fprintf() is like printf(), but it can be used to print to a specific
    file.

    - The function fscanf() is like scanf(), but it can be used to read from a specific
    file.

    - The functions of a C program can be grouped into multiple source files.

    - Header files (ending in .h by convention) are used to hold function prototypes,
    constant declarations, and type declarations. These header files can then be included
    in any source file needing those declarations.

    - Unlike a Java class name, the name defined by a typedef cannot be used as a
    type within the typedef. For struct types, the new type can be referred to using
    the notation struct name, even within the type definition. For example, in the
    declaration


    the name someType_t cannot be used to define a field in this struct type; however,
    the type struct someType can be used. The identifier someType is not required
    if this struct type is not recursive.'
