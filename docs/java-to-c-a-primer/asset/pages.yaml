  md: '# 16


    # Trouble spot


    Most C compilers will not normally warn you about uninitialized variables. Use
    gcc -Wall to generate all possible warning messages.


    The syntax for the for loop in C is nearly identical to that in Java. The one
    difference is the loop index variable cannot be declared as part of the loop.
    In Java, you could:


    ```

    for (int i = 1; i <= num1; i++) ...

    ```


    This is syntax error in C. As shown in this example, C includes the increment
    operator ++. It can be used postfix or prefix, and has the exact same behavior
    as in Java. The for loop above uses an additional feature of the printf() function.
    The string passed to a printf() can contain special characters that are always
    preceded by the percent character. The sequence %d says that the next parameter
    to the printf() should be converted from an integer to a string and inserted at
    this point. The space after the printf() simply prints a newline.


    The syntax for the while loop in C is identical to that in Java. As shown here,
    C also includes the decrement operator --, which can be used as either prefix
    or postfix, having the exact same behavior as in Java.'
  merge: -1
