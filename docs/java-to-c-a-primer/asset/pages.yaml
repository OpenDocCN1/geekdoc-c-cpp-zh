  md: "# 14\n\nLocal variables for the built-in types in C are declared just as in\
    \ Java. The same initialization syntax is also allowed. The one difference is\
    \ that variables must be declared at the beginning of a block or compound statement.\n\
    \n# Trouble spot\n\nAll variable declarations in a block must appear before the\
    \ first executable statement.\n\nC includes most of the same numeric, relational\
    \ and boolean operators as Java, summarized in the following table.\n\n| Description\
    \ | Operators |\n| --- | --- |\n| Arithmetic operators | +, -, *, /, % |\n| Relational\
    \ operators | <, <=, >=, ==, != |\n| Boolean operators | &&, || |\n| Bitwise operators\
    \ | &, |, ^, !, <<, >> |\n\nThe boolean operators operate on integer values, treating\
    \ zero as false and non-zero as true.\n\nA boolean operator always results in\
    \ a value of 0 or 1. The division operator, /, is the same as in Java. In particular,\
    \ integer division truncates towards zero without any warning. Also, as in Java,\
    \ the boolean operators are short-circuit operators, only evaluating their second\
    \ operand if necessary.\n\nThe syntax for if-else statements, for loops, and while\
    \ loops is identical to that of Java. The following program in C demonstrates\
    \ the substantial syntactic similarity between C and Java.\n\n```\n/* Syntax.c\n\
    \ * Demonstrate local variables, built-in types,\n * if-else and loops.\n */\n\
    #include <stdio.h>\n```"
