  md: '# Introduction 15


    # Dissection of basicSyntax.c


    ```

    int num1 = 4, num2 = 10, i;

    double ratio;

    ```


    Here we declare three integer variables of type int, and one floating-point variable
    of type double. Unlike Java, these types do not have a fixed size; however, in
    general they will be the same as the Java types. Two of the variables have been
    initialized, the others contain undefined data. Unlike Java, C will not give an
    error if you attempt to use a local variable that has not been initialized. The
    C program will simply use whatever value is stored in the memory location for
    the variable. That value could be anything.'
