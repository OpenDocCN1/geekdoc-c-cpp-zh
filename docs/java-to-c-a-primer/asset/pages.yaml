  md: "# File I/O and Multiple Source Files 91\n\nthe output file. The function fopen()\
    \ will return a pointer to the FILE structure used to manipulate the file, if\
    \ the file is opened successfully. If the open fails, the function returns NULL.\
    \ To make our program reasonably user friendly, we test the return value and print\
    \ an appropriate message if the open fails. The function fprintf() is the same\
    \ as printf() except that it takes an additional parameter that is a pointer of\
    \ an open FILE structure. This allows us to print any file. The variable stderr\
