    Failing to free memory can result in what is called a memory leak. This produces
    a long-running program that continues to allocate more memory and will eventually
    run out of memory. On the other hand, prematurely freeing memory can result in
    unpredictable results, if the program continues to try and use memory that has
    been deallocated using free(). A pointer variable that points to memory that has
    been deallocated is called a dangling pointer. Any attempt to use such a pointer
    is called a dangling pointer error. These types of problems with memory allocation
    illustrate why languages like Java provide automated memory management with garbage
    collection.'
