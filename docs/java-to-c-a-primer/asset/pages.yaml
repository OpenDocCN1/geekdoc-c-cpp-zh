  md: "# 1. Introduction\n\nFor the language features that are common to both C and\
    \ Java, the two languages usually have similar if not identical syntax. One of\
    \ the major differences between the two languages is that C is not object-oriented.\
    \ This means that a program is not a collection of classes. Instead, a C program\
    \ is a collection of functions. Functions in C are very similar to static methods\
    \ in Java. In this chapter we introduce the basic structure of a C program, including\
    \ built-in types, variable declarations, simple output, conditionals, and loops.\
    \ As you will see, most of these features are nearly identical to their counterparts\
    \ in Java.\n\n# 1.1. \"Hello, world!\"\n\nLet's begin with the classic \"Hello,\
    \ world!\" program.\n\n```\n/* hello.c\n * Print hello.\n */\n#include <stdio.h>\n\
    \nint main() {\n    printf(\"Hello, world!\\n\");\n    return 0;\n}\n```\n\nThe\
    \ output of this program is:\n\nHello, world!"
  merge: -1
