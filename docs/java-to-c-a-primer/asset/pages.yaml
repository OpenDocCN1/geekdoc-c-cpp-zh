    convention of appending _t to an identifier to indicate it is a type name. This
    particular structure type contains four fields. As you can see, fields can be
    simple types or arrays. Fields can even be other structures.


    ```

    student_t studentOne, studentTwo;

    ```


    In this example, we declare two variables of type student_t. The variables studentOne
    and studentTwo are not pointers to student_t values; they actually contain a student_t
    value in the same way that an int variable contains an int value. This is important
    because we do not need to create a student_t value with something like Java''s.
    Furthermore, we cannot change studentOne to later refer to a different student_t
    structure, although we can change the values of the fields.'
