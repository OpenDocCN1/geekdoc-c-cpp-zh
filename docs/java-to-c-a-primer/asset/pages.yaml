  md: '# Introduction 13


    ```

    printf("Hello, world!\n");

    ```


    Java also includes System.out.printf() with many of the same format features as
    those of printf() in C. We will discuss printf() in more detail later. As used
    here, printf() is similar to System.out.print() in Java.


    ```

    return 0;

    ```


    By convention, a return value of 0 from main() indicates normal completion to
    the operating system. If the program is terminating abnormally, a non-zero return
    value can be used by the operating system. To compile this program from a command
    line use:


    ```

    gcc hello.c -o hello

    ```


    Depending upon the configuration of your computer, instead of gcc, you may need
    to use cc or some other command to compile the program. This will create a file
    hello (possibly with an extension for the file type), which can be executed by
    simply typing the name of the file.


    # 1.2. Built-in types, local variables, loops, and conditionals


    Java primitive types have equivalent types in C. The only exception is the Java
    type boolean. C does not have a boolean type. Instead, C uses integers to represent
    boolean values, interpreting the integer value zero as false and any other integer
    value as true.


    Trouble spot


    C has no boolean type. Use int instead, interpreting non-zero as true and zero
    as false.'
