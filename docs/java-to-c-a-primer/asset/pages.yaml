  md: '# Structured Data Types 85


    # Chapter Summary


    +   - A struct in C is like a class with only data members, no methods.


    +   - Unlike Java, a struct value can be stored directly in a variable. C can
    also declare pointers to struct values. These pointers are like Java references.


    +   - To access a field of a struct value, if the variable contains the struct
    value, then you use the field selection operator — for example, studentOne.gpa.


    +   - To access a field of a pointer to a struct value, use the indirect field
    selection operator, ->, for example, student_p->gpa.


    +   - Although a pointer to a struct value behaves most like a reference to a
    Java object, syntactically, field access in C is most similar to Java when using
    actual struct values, not pointers.


    +   - Passing a struct value in C is not like passing a Java object. To get the
    same behavior as in Java, in C we must pass a pointer to a struct value.'
