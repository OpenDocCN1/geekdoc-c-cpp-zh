    # 6.2. Header files


    C, like Java, allows programs to be composed from multiple source files. As we
    saw in chapter 2, it is necessary to provide a function prototype for a function,
    if we call the function before defining the function. This same mechanism is used
    when calling a function that is defined in a different file. It is for this reason
    that we have included files like stdio.h #include directive. These files, called
    header files, include function prototypes, type definitions (using typedef) and
    constants (using #define). By placing this information in a header file, we can
    avoid having to retype the information in all of the files that may need it. All
    we need to type is the single line:


    ```

    #include <someHeader.h>

    ```


    Just as in Java, a C program must contain a function main(). And just as in Java,
    you can combine several files together to make a program. Because all functions
    in C share the same name space, that is, they are not grouped into classes, there
    can be only one in your program that contains a function main(). Recall that you
    can have several Java classes that contain a main() method. When you start the
    Java program, you indicate which class you want to use as the main class. In C,
    the compiler will combine all of the source files into a single output file, which
    must contain only one main()


    Both header files (ending in .h) and normal C source files (files ending in .c)
    are considered part of the C source code. As mentioned above, the header files
    will generally contain type definitions, constant definitions, and function prototypes.
    The other C source files will contain the function definitions. The following
    program is composed of three source files, two regular source files, and one header
    file. One source file will contain the main() function, and the other will contain
    functions to implement a simple stack.'
