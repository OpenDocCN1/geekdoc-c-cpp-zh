    #define compiler directive is used to create named constants. Constants such as
    this make the program easier to modify and understand. The program is also less
    likely to have errors. A minor typographical error in a literal constant, such
    as 90 instead of 80 will go undetected by the compiler. However, a minor typographical
    error in a named constant, such as NAME_SSIZE instead of NAME_SIZE, will generally
    result in a compiler error.


