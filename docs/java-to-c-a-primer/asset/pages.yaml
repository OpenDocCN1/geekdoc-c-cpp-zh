  md: '# Chapter Summary


    +   - A C program is a collection of functions. Functions are very similar to
    static methods in Java. C program execution begins in the function main().


    +   - Comments are indicated with // or /* ... */, just as in Java.


    +   - The standard C types include the Java primitive types except for non-zero
    is interpreted as true.


    +   - C represents boolean values as integers. Zero is interpreted as false; non-zero
    is interpreted as true.


    +   - In general, the built-in operators for the standard C types are the same
    as those for the corresponding Java primitive types.


    +   - Expressions involving relational operators evaluate to one for true and
    zero for false. The boolean operators operate on integers treating any non-zero
    value as true.


