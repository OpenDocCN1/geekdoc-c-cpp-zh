  md: '# Preface


    This book is designed to be used as a quick introduction to C for programmers
    already familiar with Java. It is not a replacement for a reference book on C,
    but is instead a supplement. For the programmer already familiar with Java, the
    typical book on C requires the reader to wade through many details of already-familiar
    material. In this book, we quickly present the main concepts needed to begin writing
    serious programs in C, highlighting the differences between C and Java.


    In general we follow the Java code conventions but only two spaces are used as
    the unit of indentation and braces are not used around single statements as part
    of a control structure.'
