  md: "```\nvoid push(stack_t* stack_p, int value) {\n    stackElem* temp =\n    malloc(sizeof(stackElem));\n\
    \    temp->value = value;\n    temp->next_p = stack_p->top_p;\n    stack_p->top_p\
    \ = temp;\n}\n```\n\nThis function assumes the stack_t value has been properly\
    \ initialized (i.e., the top_p field has a meaningful value). Because a C struct\
    \ does not have constructors, there is no guarantee that the value has been initialized.\
    \ If the stack value was created using the function newStack() the top_p field\
    \ will be valid. The function allocates memory for a new stackElem_t value and\
    \ links that value onto the top of the stack.\n\n```\nint top(stack_t* stack_p)\
    \ {\n    if (stack_p == NULL ||\n        stack_p->top_p == NULL) {\n        fprintf(stderr,\
    \ \n            \"ERROR: top empty stack\\n\");\n        exit(1); // abort the\
    \ program\n    }\n    else\n        return stack_p->top_p->value;\n}\n```\n\n\
    This function returns the same value as pop(), but it doesn't modify the stack.\n\
    \n```\nint empty(stack_t* stack_p) {\n    return (stack_p->top_p == NULL);\n}\n\
    ```\n\nThis function allows the user of a stack to check and see if there are\
    \ any elements remaining in the stack. Such a function is essential, given this\
    \ design where pop() aborts the program if you try to pop an element from an empty\
    \ stack."
