    # 1.3. Output with printf()


    The standard output function in C is printf(). The name printf is

    derived from the fact that this function allows for formatted printing. The

    function printf() can accept any number of arguments. This looks a

    bit like function overloading, but C does not support function overloading.

    Instead, the function printf() is designed to accept an arbitrary number

    of arguments.


    The first argument to printf() is always a format string. The format

    string is then followed by zero or more additional parameters that contain

    t values that are to be printed, as part of the output string.


    The format string contains both literal characters to be printed, and format-

    characters. A sequence of formatting characters always begins with

    the special character % and ends with a conversion character. Between the

    % and the conversion character can be additional formatting characters.

    The following example shows how literal characters and several conversion

    specifications can be combined in a single printf().'
  merge: -1
