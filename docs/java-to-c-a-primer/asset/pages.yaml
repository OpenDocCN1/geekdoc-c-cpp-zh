  md: '# Chapter Summary


    +   - Static arrays in C have no direct counterpart in Java. Memory is allocated
    implicitly and the size of the array is part of the declaration. For example,
    int x[10], creates a static array of 10 integers. This variable x will always
    refer to this array of 10 integers.


    +   - Array elements are indexed just like arrays in Java.


    +   - Dynamically allocated arrays are allocated using calloc(). The memory returned
    from calloc() is initialized to contain all zeros.


    +   - Unlike Java, there is no bounds checking on array indices.


    +   - Array variables are actually just pointers to the first element of the array.


    +   - There is no direct support for determining the length of an arbitrary array.


    +   - Arrays are passed to functions by reference. Only the address of the first
    element of the array is passed. This is essentially equivalent to how arrays are
    passed in Java.'
