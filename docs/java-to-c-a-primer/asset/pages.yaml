    \ the size of the buffer we will use for reading text from the input file.\n\n\
    ```\nvoid copy(FILE* in, FILE* out) {\n    char buffer[BUF_SIZE];\n\n    while\
    \ (fgets(buffer, BUF_SIZE, in) != NULL) {\n        fprintf(out, \"%s\", buffer);\n\
    \    }\n}\n```\n\nThe function fgets() is a standard C library function that reads\
    \ strings from a text file. Each call to fgets() transfers characters from the\
    \ input file into the char array indicated by the first parameter (buffer in our\
    \ example). The function continues to copy characters until BUF_SIZE-1 characters\
    \ (the second parameter minus 1) have been transferred, or a newline has been\
    \ transferred, or the end-of-file is encountered. In every case, the string is\
    \ terminated with a null character. Notice that by stopping at BUF_SIZE-1, there\
    \ will always be room for the null character to terminate the string. If the call\
    \ transfers any characters, the fgets() returns its first parameter; otherwise,\
