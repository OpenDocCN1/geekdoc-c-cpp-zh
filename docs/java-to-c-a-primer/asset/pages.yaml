    \ that point.\n\nAll of the rules about using braces to place blocks of statements\
    \ in the branches of an if-else statement are the same as in Java. Also, nesting\
    \ of if-else statements is the same in C as in Java.\n\n# Trouble spot\n\nIn Java\
    \ the following is a syntax error:\n\n```\nif (num1 = 0) ...\n```\n\nThe expression\
