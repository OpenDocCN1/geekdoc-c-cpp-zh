  md: "# 24\n\n```\nint main() {\n    int intVal;\n    float floatVal;\n\n    scanf(\"\
    %d\", &intVal);\n    scanf(\"%f\", &floatVal);\n\n    printf(\"%d, floatVal =\
    \ %f\\n\",\n           intVal, floatVal);\n\n    return 0;\n}\n```\n\nThe strings\
    \ for scanf() are very similar to those for printf(). In the example we use %d\
    \ to indicate that an int is to be read from the standard input device and %f\
    \ to indicate that a float is to be read. These input strings will automatically\
    \ skip over any white space characters. The white space characters are newline,\
    \ space, and tab. Notice the variables into which the data is to be stored are\
    \ preceded by the &. The & is the \"address of\" operator. It will be explained\
    \ in more detail. It must always be used when reading built-in types into variables.\
    \ The function scanf() needs to know where to store the values variables; hence\
    \ the function is passed the \"address of\" the variables where the values are\
    \ to be stored. It is not possible in Java to write a function like scanf with\
    \ multiple output parameters that are primitive types.\n\n# Trouble spot\n\nIf\
    \ you get the & in front of one of the parameters to scanf(),\ny program will\
    \ most likely abort with some obscure message.\n\nThe & in front of a variable\
    \ or expression of type T changes the type of the expression from type T to type\
    \ T*. The type T* is a pointer to a value of type T. We will explain this in chapter\
    \ 2. In the following table when you see the argument must be type T*, then is\
    \ an indication that you can place a variable of type T, preceded by & in the\
    \ corresponding argument for scanf(). The following table lists the conversion\
    \ characters for scanf()."
