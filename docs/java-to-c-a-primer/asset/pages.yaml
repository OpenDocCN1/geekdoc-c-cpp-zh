    ```


    When including header files from the standard Library, the name of the file is
    enclosed in <angle brackets>. When including header files that you create yourself,
    and that reside in the same directory as your other source files, the file name
    is enclosed in quotes. The choice of enclosing symbols affects where the C compiler
    to find the header file. The function prototype for printf() is in stdio.h, and
    the prototypes typedefs for our stack implementation are in stack.h, dissected
    later.


    ```

    stack_t* myStack = newStack();

    ```


    The stack_t is defined in the header file stack.h. The function newStack() is
    implemented in the file file stack.c, and a prototype for the function is in stack.h.
    At this point it is sufficient to know that newStack() returns a pointer to a
    stack_t value.


    ```

    push(myStack, 123);

    push(myStack, 99);

    push(myStack, 4444);

    ```


    To demonstrate our stack, we push three integer values onto the stack. The function
    push() is defined in stack.c, dissected later. Recall that in Java the first call
    would probably have been written:


    ```

    myStack.push(123);

    ```


    In C, functions are not part of the type, and there is no implicit first parameter.
    Therefore, we explicitly pass the stack as the first parameter to the function
    push().'
