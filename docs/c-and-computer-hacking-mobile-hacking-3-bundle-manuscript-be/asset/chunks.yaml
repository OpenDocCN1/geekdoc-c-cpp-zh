  trans: "\n\n你以为你可以直接读完这本书，而不需要通过任何测试来证明你是否在留心吗？也不要作弊！仅仅因为你可以偷看答案，并不意味着你应该这么做。你应该像对待普通测验一样对待它，以真正测试你的知识，这样你就可以判断是否需要回去重读某些内容。这是一个短测验，所以你没问题的。\n\
    \n1. 什么是空白符（whitespace）？\n2. 填空 `___ <<x=y+1_>>`\n3. 什么是三字符（trigraphs）？\n4. 谁发明了带类的\
    \ C 语言（C with Classes）？\n5. 大多数函数使用的头文件是什么？\n\n### 答案\n1. 编译器忽略的空格或注释\n2. `Cout\
    \ <<x=y+1;>>`\n3. 代表单个字符的三个字符序列\n4. Bjarne Stroustrup\n5. `<iostream>`\n\n恭喜你，如果你五个都答对了，那么就可以进入下一节了！但是，如果你错了一个以上，那么你可能应该回去重读这一节。如果你准备好了，请进入第\
    \ 3 章。\n\n# 第 3 章：深入学习程序注释、数据类型、行和字符\n\n现在我们已经涵盖了 C++ 的基础知识，是时候进入一些与程序相关的更深入的话题了。虽然这些内容更深入，但它们仍然是初学者需要学习的核心概念。\n\
    \n## 程序注释\n\n所以，会有某些时候你会在代码中编写一些注释。这些注释非常重要，因为它们允许你在代码中留下一小段信息，这样以后阅读代码的人就能清楚地看到你的代码是如何运行的，并对你在代码中正尝试实现的目标提供“参考”。此外，在代码行中留记笔记是提醒自己代码可能出现问题的地方的好方法。通过在代码中添加注释，你更有可能知道自己在哪里成功了，或者在何处错了。\n\
    \n这些注释可以根据你的需要变得简单或复杂。有些人可能只会放置一两个单词，如果这足以帮助其他用户，但在其他情况下，你可能需要将更多的行组合在一起，以确保一切运行正常，并让另一个人理解代码内部在发生什么。\n\
    \n在这门语言中，你只需要使用 `//` 符号来表示你正在编写注释。你可以写任意长度的内容，只需确保在注释结束时跳到下一行，这样程序就知道它应该重新开始读取。\n\
    \n程序在 `//` 之后会停止读取，它不会影响程序的运行方式。查看代码的其他程序员会看到你编写的注释，但当程序执行时，这些注释将被跳过。你可以在程序中添加任意数量的注释，但请尽量保持有限，因为过多的注释可能会堵塞代码，使其难以阅读和理解。\n\
    \n程序注释基本上是代码内部的语句。这些语句（或注释）的作用是帮助其他使用你代码的人士理解每个函数的用途。所有的编程语言都允许某种类型的注释，但它们并不允许存在的所有类型的注释。最常用的是单行注释。这是所有编程语言都允许的。这些注释是简单的解释性行，用简单的句子告诉下一位读者其目的。\n\
    \n还有多行注释。这是极少数编程语言允许的注释之一。C++ 就是其中这少数语言之一。有时你有一段更复杂的解释，它需要跨越多行。这在 C++ 中是可以实现的。\n\
    \n当你使用单行注释时，你会看到它在代码中用 `//` 编写，并且可以一直延伸到行尾。它的例子是：\n\n```cpp\n{\n    cout << “that's\
    \ great” >>;  //prints that's great\n    return 0\n}\n```\n\n最终输出将是“that's great”，没有没有。编译器忽略注释，因此你可以让其他程序员了解代码的用途，或者你需要对代码进行什么处理。\n\
    \n然而，如果你试图在某些代码上寻求帮助，你应该使用多行注释，这样你就能充分利用你复杂的代码。多行注释由这些符号 `/*-*/` 包围。像这样写出来看起来几乎像一个表情符号。例如\n\
    \n`/* I need help making the puppet dance*/` 仍然是一个单行注释。一个更好的例子是\n\n```cpp\n/*\
    \ I need help making the puppet dance\n*All he does at this point is sway from\
    \ side to side */\n```\n\n这就是多行注释。如你所见，当你开始新的一行时，你应该在开头放置星号，以指示程序你仍在编写注释，并且下一行确实是空白符。编译时，它将忽略注释并只显示你想让显示的内容。\n\
    \n虽然你可以混合使用注释风格，但在你掌握一切之前，最好将它们分开。\n\n## 数据类型\n\n在使用任何语言编写程序时，你都必须使用不同的变量。这些无非只是预留的内存值，存储在编译器内存中某些空间的位置。上面的保留关键字列表在这里也很有用。虽然有很多保留关键字，但有七种基础关键字定义了数据类型。\n\
    \n| 类型 | 关键字 |\n| :--- | :--- |\n| 宽字符 | `wchar_t` |\n| 空 | `Void` |\n| 双精度浮点\
    \ | `Double` |\n| 单精度浮点 | `Float` |\n| 整数 | `Int` |\n| 字符 | `Char` |\n| 布尔 | `bool`\
    \ |\n\n大多数数据类型可以使用以下修饰符进行修改：\n- Long（长型）\n- Short（短型）\n- Unsigned（无符号）\n- Signed（有符号）\n\
    \n### 变量类型\n\n当你在编程语言中使用变量时，你是在提供某种存储空间以便程序进行操作。这些类型决定了变量内存的布局和大小。它还决定了你能够存储的值范围。命名变量与命名标识符相似。你只能使用字母或下划线命名，并且是区分大小写的。在此之后，你可以使用任何类型的数字、字母和字符。\n\
    \n再次，你可以在这里更详细使用的基础变量包括：\n- `wchar_t`：这是宽字符类型。\n- `Void`：它表示类型的缺失。\n- `Double`：这是一个具有双精度的浮点值。\n\
    - `Float`：这是一个具有单精度的浮点。\n- `Int`：这是一个整数。\n- `Char`：它通常只有一个字节，是整数的一种类型。\n- `Bool`：它处理真或假的值。\n\
    \n你还可以定义其他类型的变量。这些变量包括指针、数组、引用、枚举、数据结构和类。\n\n创建新行\n\n现在你已经知道了数据类型和修饰符，以及关于在程序中编写注释的所有知识，是时候学习如何创建新行了。这是一个许多新程序员都会遇到的问题。他们的程序在输入中排版得非常漂亮，但输出仍然拥挤在一起，非常凌乱。这是因为他们没有正确创建新行。记住，空白符是被忽略的，所以你不能仅仅跳过一行并期望程序中也跳过一行。你必须指示编译器你想开始新行。\n\
    \n"
