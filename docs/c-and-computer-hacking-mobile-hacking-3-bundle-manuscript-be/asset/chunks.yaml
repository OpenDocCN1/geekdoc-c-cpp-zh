    If a hacker or agency were to get possession of the device, though, there is still
    one trick that gives opposition the upper hand.  Even phones with passcodes and
    encryption still readily show notifications on the lock screen by default.  Say,
    for instance, a hacker has possession of the phone and they attempt to login to
    your online banking.  Without the password, though, the attacker can still send
    a verification code to the phone and see it on the lock screen.  Nullify lock
    screen problems by disabling the notifications entirely.  On iDevices go through
    “settings”, “control center”, and then turn “Access to Lock Screen” off.  On an
    Android progress through “settings”, “sound and notifications”, then turn “while
    locked” to off.


    Say there is an app installed on your mobile device and you suspect that it may
    contain a Trojan horse or have malicious intent.  The app may have been installed
    from a 3rd party, or you may have your suspicions that Facebook is collecting
    data on you.  Luckily on both iPhone and Androids you can turn off specific app
    permissions to restrict the amount of access the app has.  Just as when you install
    an app it requests permission for, say, microphone, camera, and contacts, you
    can revoke those permissions at any time.


    Android phones edit permissions (in Marshmallow 6.0) in the settings app.  The
    “apps” tab shows all apps installed, and by clicking the settings button in the
    top right you can select “app permissions”.  The next screen shows every accessible
    part of your Android, such as camera, contacts, GPS, etc…  You can edit each category
    and change which apps have permission to use them.  It is always recommended that
    apps only be given the least amount of permissions necessary to perform their
    tasks, so disable anything that you don’t use or don’t need.


    iOS has debatably better app permission methods, as it only requests use of a
    peripheral when the app wants to use it.  Security-minded individuals can take
    the hint that a request for permissions at an odd time would obviously mean nefarious
    activity is taking place. Nonetheless app permissions can be taken away too, through
    the “privacy” tab in “settings”.  Just as with Android, tapping on a category
    shows all apps that use that function and give you the option to revoke the permissions.


    Malware and viruses still exist for mobile devices.  Phones and tablets can be
    secured by installing an antivirus app from a trusted source.  Some attackers
    like to disguise Trojan horses as antivirus apps, though; only download apps that
    seem reputable and have good reviews.  Don’t be against paid antivirus apps, either,
    because they are usually the ones that work best.


    Modding, Jailbreaking, and Rooting


    Contemporary devices are locked down, running proprietary software, and closed
    to customization. The act of modding a device to gain additional functionality
    has a slew of different names; on iPhones the modding process is commonly known
    as “Jailbreaking”, on Android phones it is known as “rooting”, and on video game
    consoles the action is referred to as just “modding”.'
