    ### Semicolons and Blocks

    The basic function commands are not the only things that you need to use. There
    are other things that are important when you are building a prompt as well, as
    they too instruct the program to do specific things. Some of these things are
    blocks and semicolons.


    You probably think a pause in a sentence when you think semicolon, however, they
    are complete stops in C++ programs. The semicolon indicates the termination of
    a statement. This means that each individual statement must be indicated by the
    use of a semicolon. The following are three different statements.


    ```

    x=y;

    y=y+1;

    add(x,y);

    ```


    Each one of those statements were separated by not only a line break, but also
    a semicolon. You could also do it this way.


    ```

    x=y; y=y+1; add(x,y);

    ```


    Each one of those will be recognized as separate statements simply because of
    the semicolon. It is kind of mind blowing how something so simple can have so
    much of an impact.


    In this coding language, a block is going to be a set of statements that you enclose
    with brackets. These statements are logical entities that the program puts on
    the screen due to the main command prompt. For example


    ```

    {

    cout << "I like Pizza"; //prints I like Pizza

    return 0

    }

    ```


    The end of a line is not a terminator, as was indicated above. The semicolon is
    the only thing that terminates the statement.


    ### Identifiers

    Now us move on to the identifiers in the program. These identifiers are used to
    identify multiple things, such as classes, modules, functions and variables within
    a block. An identifier is going to be a group of letters and numbers that you
    are able to name your program or your files and they must start with a letter,
    but can have any letter or number you want afterwards. There are no punctuation
    characters other than what you might see in a sentence that are allowed as identifiers.
    You will not see characters such as `@`, `&`, `%`, or `$`, and the programming
    is case sensitive. That means `YokoOno` is different than `Yokoono`, `yokoOno`,
    and `yokoono`. Make sure that you are capitalizing only the letters that you should
    be capitalizing in your programs.


    Though pretty much anything can be an identifier, there are some things that are
    reserved for keywords in C++, and can''t be used as identifiers. These words are
    as follows.


    | asm | | | |

    |---|---|---|---|

    | Break | Bool | Auto | |

    | Char | Catch | Case | |

    | Const cast | Const | Class | |

    | Delete | Default | Continue | |

    | Dynamic cast | Double | Do | |

    | Explicit | Enum | Else | |

    | False | Extern | Export | |

    | Friend | For | Float | |

    | Inline | If | Goto | |

    | Mutable | Long | Int | |

    | Protected | Private | Namespace | |

    | Reinterpret cast | Register | Public | |

    | Signed | Short | Return | |

    | Static cast | Static | Sizeof | |

    | Template | Switch | Struct | |

    | True | Throw | This | |

    | Typeid | Typedef | Try | |

    | Unsigned | Unlon | Typename | |

    | Void | Virtual | Using | |

    | While | Wchar t | Volatile | |


    Everything else is fair game when it comes to identifiers. Think of identifiers
    as usernames and passwords. Mix it up, but make sure that they are functional.


    ### Trigraphs

    Trigraphs are going to be sequences of three characters that will represent just
    one character. You will notice these because they are going to start out with
    two questions marks at the beginning. Seems a little redundant to use three characters
    when one will work, but the reason behind this is so you do not confuse the program
    with the meaning of the character, as many are similar.


    Here are some frequently used trigraphs to give you an example of what we mean.


    - `??=` `#`

    - `??/` `\`

    - `??''` `^`

    - `??(` `[`

    - `??)` `]`

    - `??!` `|`

    - `??<` `{`

    - `??>` `}`

    - `??-` `~`


    Not all compilers support trigraphs due to their confusing nature, and most people
    try to stay away from them, however, it has been found that when you memorize
    trigraphs, you are less likely to mess up by hitting the wrong symbol in your
    function.


    ### Whitespace

    Moving on to whitespace. This is the empty lines in a program. Sometimes they
    contain comments, and these are known as blank lines. The compilers completely
    ignore them. Whitespace describes blanks, new lines, tabs, characters and comments.
    It is merely used to make your program look more organized and readable.


    There should be at least one line of whitespace between the variable/identifier
    and the statement.


