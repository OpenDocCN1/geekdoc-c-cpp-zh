  trans: '


    破解芯片（modchip）是一种用途巧妙的硬件。在原始的 PlayStation 1 上，可以安装破解芯片来允许播放刻录的光盘。这意味着黑客可以从互联网下载游戏
    ROM，将其刻录到 CD 中，然后就能毫无问题地在原始硬件上运行它，而无需配置复杂的模拟器。破解芯片的工作原理是通过向主机中注入代码，欺骗它认为插入的光盘已成功通过了光盘复制保护。因此，破解芯片需要焊接在主板上。在
    PlayStation 上，这是一个相当于容易的过程。


    ### PS1 破解方法


    1. 你需要一个与你的 PS1 型号相对应的破解芯片。[`www.mod-chip.net/8wire.htm`](http://www.mod-chip.net/8wire.htm)
    包含了最流行的破解芯片——请确保你的 `SCPH` 编号与兼容型号匹配。（我们将使用 8 线的破解法。）

    2. 拆解 PS1，取出所有螺丝，拆下 CD 激光头，移除所有组件，将裸主板放在你的电烙台上。拍摄拆解过程的照片，以便提醒自己以后如何将所有东西装回去。

    3. 从此列表 [`www.mod-chip.net/8wiremodels.htm`](http://www.mod-chip.net/8wiremodels.htm)
    中选择型号，并将图片中的数字与破解芯片的线路对应并进行相应的焊接。你需要一个小烙铁头和稳定的手才能成功完成。


    尽管如此，破解芯片有点吓人，但幸运的是，有一种通过焊接来播放刻录光盘的方法。光盘交换法（disc-swap method）可以欺骗 PS1 在另一张光盘上验证复制保护，然后迅速将刻录的光盘放入主机中。以下是具体操作方法：


    1. 在传感器上贴一段胶带，这样光盘在光驱盒打开时也能旋转。在打开和关闭盖子时，你可以看到盖子按下的按钮，它告诉主机盖子已关闭。用胶带封住，让主机始终处于“关闭”状态。

    2. 将一张正版光盘放入光驱并启动主机。

    3. 光盘会快速旋转，然后减速到半速。在半速期间，迅速将正版光盘更换为刻录副本。这个过程非常快，必须在不到一秒内完成。

    4. 刻录光盘将全速旋转，然后减到半速以扫描复制保护。一旦它减速，立即将其换回正版 PS1 光盘。

    5. 观察屏幕，一旦屏幕变黑，再次切换回刻录光盘并关闭光驱盒。现在这张虚假光盘就可以播放了。


    这两种方法都是多年来破解的方法，但一种新产品进入市场，简化了 PS1 的破解。`PSIO` ([`ps-io.com/`](http://ps-io.com/))
    是一件允许 PS1 从 `SD card` 读取游戏的硬件。只需支付费用，创建者会将这个方便的设备安装到你的 PlayStation 上，并永远地简化播放盗版和备份游戏的过程。


    ### PS2


    在最后几款游戏制作后，PlayStation 2 在多年后一直是受欢迎的主机。尽管存在硬件破解和复杂的程序，但破解 PS2 主机简单的方法是购买一张内存卡。`FreeMCBoot`
    (`FMCB`) 是一种软件漏洞利用，它可以劫持“大版”PS2，并允许通过软解（softmod）执行自定义软件。你只需在网上购买一张 10 美元的 `FMCB`
    内存卡，也可以自己制作一个。你需要一台大版 PS2、一份 `AR Max EVO` 副本、一张空白内存卡和一个 U 盘。


    1. 下载 `FreeMCBoot` 安装程序 ([`psx-scene.com/forums/attachments/f153/14901d1228234527-official-free-mc-boot-releases-free_mcbootv1.8.rar`](http://psx-scene.com/forums/attachments/f153/14901d1228234527-official-free-mc-boot-releases-free_mcbootv1.8.rar))
    并将其放在 U 盘中。

    2. 启动 `AR MAX`，插上 U 盘和内存卡。

    3. 导航到媒体播放器并访问“next item”（下一项）以加载位于 U 盘上的 `FREE_MCBOOT.ELF`。按下播放。

    4. 按照说明操作，`FreeMCBoot` 将安装到内存卡上。


    现在，`FreeMCBoot` 将预装了许多很棒的软件——你只需插入修改过的内存卡并启动 PS2，`FreeMCBoot` 就会临时软解你的主机。播放备份游戏也简单。


    1. 在电脑上准备好你想运行的游戏的 `.iso` 文件。

    2. 下载 `ESR` 光盘补丁 ([www.psx-scene.com/forums/showthread.php?t=58441](http://www.psx-scene.com/forums/showthread.php?t=58441))，运行并对
    `.iso` 进行补丁。

    3. 使用修改后的 `.iso` 刻录一张空白 DVD。`ImgBurn` 是此项工作的极佳程序。

    4. 将光盘放入 PS2，启动 PS2，`FreeMCBoot` 将加载。在菜单中导航到 `ESR` 工具。启动它，游戏就会开始运行。


    ### PS3


    PlayStation 3 起初的功能允许安装如 `Linux` 等操作系统——将一台简单的游戏机变成了家用电脑。黑客利用了“OtherOS”功能并“越狱”（jailbroke）了
    PS3。破解后的设备能够播放备份/下载的游戏以及“自制”（homebrew）软件。尽管如此条件限制了可以破解的 PS3 主机数量。只有固件版本在 3.55
    及以下的 PS3 才能修改；你可以通过“设置”、“系统”，然后是“系统信息”来检查。如果你的 PS3 碰好更新过了此版本，那么你对降级做不了太多事情，而且
    eBay 上的 3.55 版本 PS3 非常昂贵。我们不会解释降级过程，但请研究 `E3 Flasher` 将你的版本号降回 3.55。


    如果你的版本号低于 3.55，软件必须更新到正确的版本。千万不要让 PS3 自动这样做，否则它会更新到 3.55 以上并破坏我们破解的机会。相反，你需要下载
    3.55 更新 ([`www.mediafire.com/download/dp6uhz4d15m3dll/ofw+3.55.rar`](http://www.mediafire.com/download/dp6uhz4d15m3dll/ofw+3.55.rar))，在空白
    U 盘上创建一个名为 `PS3` 的文件夹，在该文件夹内创建一个 `UPDATE` 文件夹。将 3.55 更新放入 `UPDATE` 文件夹并将其插入 PS3。按住电源按钮直到听到三声提示以进入恢复模式。你需要连接手柄进行操作。选择“更新”，按照屏幕指示操作，PS3
    将从 U 盘更新。


    按照以下步骤安装自定义固件：


    1. 将 U 盘格式化为 `FAT32` 以清理内容。

    2. 在磁盘上创建 `PS3` 文件夹，然后在其中创建一个 `UPDATE` 。

    3. 下载并解压包含自定义固件的 `.rar` ([`www.mediafire.com/download/qzpwvu3qyaw4/3.55+CFW+Kmeaw.rar`](http://www.mediafire.com/download/qzpwvu3qyaw4/3.55+CFW+Kmeaw.rar),
    可能会变化)) 到 `UPDATE` 文件夹中。

    4. 将更新文件放入 U 盘，进入恢复模式并安装 `PS3UPDAT.PUP`。你现在有了自定义固件。


    使用名为 `MultiMAN` 的工具在 PS3 上玩游戏非常简单。该程序运行在自定义固件上并允许备份和运行游戏。首先，获取 4.05 及以上版本的 `MultiMAN`
    ([`www.mediafire.com/download/16dbcwn51gtzu47/multiMAN_ver_04.78.02_STEALTH_%2820160328%29.zip`](http://www.mediafire.com/download/16dbcwn51gtzu47/multiMAN_ver_04.78.02_STEALTH_%2820160328%29.zip,
    可能会变化))，这些版本支持我们安装的 CFW。解压它并将文件放在 U 盘中，插入并启动修改过的 PS3。在“游戏”部分，选择“安装包文件”，然后安装 `MultiMAN`
    `pkg` 文件。应用程序将安装完成。


