- fmt: '

    3. Lastly, rip or download the PS1 rom you want to play on your device. See the
    section about emulating on iOS for tips on how to rip your own ROMs or obtain
    other backups online.


    4. Configure `ePSXe` by pointing it to your BIOS files. Then pick the graphics
    settings your device can handle. Navigate to the location of your ROM and launch
    it to begin enjoying PS1.


    Gaming on an Android is fun, if not difficult due to the onscreen buttons blocking
    your view of the games. Android has built-in functionality for wired Xbox controllers
    that are plugged in via USB port. If your Android device has a full size `USB`
    port, you can just plug the Xbox controller in directly and it will work. If you
    have a phone with an `OTG` (smaller) port, you will need to purchase an `OTG`
    to `USB` female adapter. With a rooted device the Bluetooth can be taken advantage
    of fully. The app “SixaxisPairTool” will pair a PS3 controller for for wireless
    gaming. You’ll just need the app on your phone, the PC version application on
    your computer, a PS3 controller, and a cable to connect it to the computer.


    1. Connect the controller to the computer via `USB` cable.

    2. Start the `SixaxisPairTool` program on the PC.

    3. On your Android device, navigate to “Settings”, “About Phone”, and then tap
    on “Status”.

    4. Copy the “Bluetooth address” from the phone to the “Current Master” box on
    the PC application. Click update.

    5. Unplug the PS3 controller and turn it on. It should search for a PS3 to sync
    to, but the address that is programmed will lead to your Android device. Enjoy
    the wireless gaming!


    Deep Android customization comes from the `Xposed Framework`. After installing
    (`http://repo.xposed.info/module/de.robv.android.xposed.installer`), you are free
    to customize your device through “modules” (`https://www.androidpit.com/best-xposed-framework-modules`)
    that edit the tiniest specifics of Android. This is the feature that makes Android
    much more customizable than iOS.


    If you can’t get the device to work perfectly to your liking, you can always flash
    a new operating system. This procedure is more dangerous than rooting, and each
    new `OS` might not be compatible with your device. As always, do some internet
    research to find out if your particular device is compatible with the operating
    system you are thinking about flashing. `CyanogenMod` (`http://www.cyanogenmod.org/`)
    is a popular Android variant developed by the original Android team. Some devices
    can even support a Linux distro, making for an extremely portable yet functional
    device. We won’t discuss the specifics of flashing here, but you can find plenty
    of tutorials and guides on the websites of the custom OS builds that you find.


    There are other great rooted apps, such as those that manage specific permissions
    (`PDroid`, `Permissions Denied`), and apps that remove ads (`AdAway`), but these
    apps are commonly taken down and blocked by federal governments. The only way
    to get one of these apps is to find it uploaded on an apk website, or to use a
    `VPN/Proxy` to fake your location as another country.


    Conclusively, rooting Android gives almost limitless possibilities. You can truly
    have complete control over your device after rooting or flashing a new `OS`. Be
    very careful when making modifications, because there is a great chance of voiding
    warranty or even bricking the technology. The benefits received, however, are
    almost too great for hackers and modders to give up.


    ## Risks of Mobile Hacking and Modification


    Hacking on or infiltrating another mobile device falls under the same legal dubiousness
    as PC and server hacking- some states and federal governments consider hacking
    illegal, regardless of whether a phone or computer is involved.


    Remember the hacker’s manifesto, though, where a hacker is benevolent because
    they are only curious. Some see carriers and phone manufacturers guilty of restricting
    access to a device, so hackers attempt to correct the situation through jailbreaking
    and modding- making the devices truly their own.


    An individual probably will never go to jail for simple modifications of their
    own devices. Hackers only void their warranties by jailbreaking and rooting. Bricking
    is a possibility too, but that is a personal consequence and not a legal one.


    Tampering with other people’s devices without permission could be dangerous and
    illegal, though, and many courts will consider it an invasion of privacy. Hackers
    must always protect themselves with the same strategies laid out in the previous
    book (`VPN`, proxies, hiding identity, using “burner” devices, `TOR`, etc…).


    Overall, so long as hackers are ethical and proceed with benevolent intent, there
    are not too many risks involved with experimentation. Large profile crimes will
    not go unnoticed, however. And no matter how skillfully a hacker can protect themselves,
    as seen by the San Bernardino incident, if the crime is large enough than governments
    will assign large amounts of resources to oppose the hacker. Hack with caution
    and always stay ethical.


    ## Modding Video Game Consoles


    Video game consoles have been modded since the beginning of living room entertainment.
    In the `NES` era, some unlicensed companies produced games by flashing their software
    onto empty cartridges and bypassing copy-protection. Modding became the norm for
    subsequent consoles as well, as many readers might remember tales of PlayStations
    that could play burned discs, or Wiis that could read games from `SD` cards. If
    the reader has never had the pleasure of seeing a hacked and modded console in
    person, I assure them that it is a marvel of hacking knowledge and skill. Just
    about every game console can be altered in some way that improves its function,
    and this chapter will go through some of the popular modifications and how to
    perform them. For reference there are two types of mods- hardmods and softmods.
    Hardmods are nearly irreversible physical changes to a console such as those that
    involve soldering modchips. Software are mods to the software of a console, such
    as `PS2`’s `FreeMCBoot` memory card hack.


    Most console hacks require additional components, soldering proficiency, or specific
    software. Note that a twitchy hand or missed instruction can break a very expensive
    console, so ensure that you can complete the modification without error before
    attempting. There are websites and people that can perform the mods for you for
    a fee just in case it seems too complex, so weigh your options and pick what you
    feel the most comfortable with.


    ### NES


    While most people grew up playing a `NES`, there is no doubt that the console
    is extremely difficult to play on modern LCD and LED televisions. Either the new
    televisions do not have the needed hookups, or the quality looks awful traveling
    through antiquated wires and inefficient graphics chips. Luckily there exists
    a mod to enable the `NES` to output video and audio through `HDMI`- a huge step
    up that increases the graphical quality of the old console.


    `https://www.game-tech.us/mods/original-nes/` contains a $120 kit (or $220 for
    installation too) that can be soldered to a working `NES`.


    Such is the case with most mods for the `NES` and other older consoles. Daughterboards
    or additional components have to be bought and soldered accordingly to increase
    functionality. Revitalizing older consoles with modding is a fun pastime that
    many hackers enjoy.


    ### PlayStation

