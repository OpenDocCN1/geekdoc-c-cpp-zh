  trans: "\n\n这个相当幽默、稚气的 GUI 隐藏了强大的工具，让毫无技术的初级黑客在与其他协作时也能具备 DDoS 能力。\n\n最熟练的攻击者使用僵尸网络来提高效率。一个编写良好的蠕虫可以感染具有高速网络的数据中心或大学，然后这些僵尸电脑就会在黑客的指挥下协同攻击一个单一目标。\n\
    \n## 进程炸弹 (Fork Bomb)\n\n进程炸弹是一种特定的恶意代码，其原理基本上类似于离线 DDoS。然而，炸弹并不是阻塞网络管道，而是阻塞处理管道。基本上，进程炸弹是一个递归运行自身的进程——即该进程不断复制自己，直到计算机的处理器无法跟上。如果黑客能够访问系统并运行代码，进程炸弹是非常致命的。实际上，炸弹是最容易编写程序之一。在命令提示符中输入\
    \ `start` 会打开另一个命令提示符。这可以通过下所示实现自动化。\n\n1. 打开记事本。（`Windows+R`，`notepad`，`确定`）\n\
    2. 第一行且唯一行输入 `start forkbomb.bat`。\n3. 打开“另存为”对话框。\n4. 将文件类型切换为“所有文件”。\n5. 命名为\
    \ `forkbomb.bat` 并保存文件。\n\n![](img/00008.jpeg)\n\n我们刚刚做的是使用命令提示符相同的编程语言创建了一个批文件。运行此文件（通过右键点击图标并点击“运行”）将启动进程炸弹，它将不断反复启动自己，直到计算机无法处理这种资源压力。**警告**：除非你准备好面对后果，否则不要运行此文件！\n\
    \n## 破解 (Cracking)\n\n破解是指破解软件/应用程序或密码。破解程序可以禁用付费软件上的数字权利管理（DRM，也称为复制保护），以便在不支付全价的情况下使用软件完整版。熟练的黑客通过代码逆向工程或寻找允许他们运行自定义代码的漏洞来实现这一点。加密也可以被破解，导致受保护的数据泄露，因为攻击者知道如何反转乱码。密码破解可以通过暴力破解和字典攻击来实现。\n\
    \n### 暴力破解 (Brute Force)\n\n暴力破解尝试通过尝试每种可能的字母和数字组合来猜测密码。在 DOS 时代，这并不困难，因为密码最多只有\
    \ 8 个字符。暴力破解攻击是漫长而辛苦的，但在时间足够的情况下，可以在强大的计算机上成功。在章节后面的部分，我们将讨论 Kali Linux 及其作为安全测试/黑客工具的使用。Hydra\
    \ 是一个尝试暴力破解密码的应用程序。\n\n### 字典攻击 (Dictionary Attack)\n\n字典攻击稍微复杂一些。它们与暴力破解的相似之处在于都会尝试大量的密码组合，但不同在于字典攻击使用来自中的单词数据库进行操作。这种方法对于猜测简单的密码（例如单单词密码）效果很好。辅助字典攻击的应用程序将从顶部开始遍历大型单词数据库，并尝试对每个单词进行细微变体以查看登录是否成功。最聪明的字典攻击会将用户的特定单词添加到数据库中，例如姓名、宠物、工作、生日等……大多数人使用个人信息作为密码，将这些信息添加到字典攻击中可以提高有效性。\n\
    \n## 在 Windows 上控制同事屏幕\n\n某些版本的 Windows 内置了“远程桌面”应用程序，旨在让 IT 人员快速远程连接到远处的计算机并进行控制和维护。\n\
    \n远程桌面可以（当然）被利用，这正是我们要做的。本教程是为同一网络上的两台计算机设计的，但聪明的用户可能会将其扩展到整个互联网。\n\n首先，需要在两台计算机上启用远程桌面。通过控制面板，点击“系统”，然后点击“远程设置”。确保勾选了“允许远程协助连接到此电脑”。应用设置。然后，你需要同事的\
    \ IP 地址；你可能记得这可以通过命令提示符中输入 `ipconfig` 并复制列出的“IPv4 地址”。\n\n![](img/00009.jpeg)\n\
    \n现在启动远程控制程序，等待时机给朋友一个惊喜，并在你的计算机上启动“远程桌面连接”应用程序（你可以在开始菜单中搜索它）。输入朋友的 IP 地址，看着当你移动他们的鼠标时他们惊讶的反应！\n\
    \n从技术上讲这并不是“黑客攻击”，但黑客可以使用远程桌面应用程序来监视目标。例如，一个毫无防备的用户在检查银行账户信息时，黑客正在暗中观察。这让黑客充分了解密码和个人信息，所以如果你的计算机上启用了远程桌面应用，请小心。\n\
    \n 使用其他操作系统\n\n由于多种原因，替代操作系统对黑客来说是非常价值的。在不覆盖当前系统的情况下尝试另一个系统的简单方法是将操作系统安装到可启动的\
    \ USB 驱动器上。我们将通过在 USB 驱动器上安装 Kali Linux（前称为 Backtrack Linux）来演示这一过程。\n\n1. 访问\
    \ [`www.kali.org`](http://www.kali.org) 下载 Kali Linux。你需要下载与你的处理器兼容的版本（32 位、64\
    \ 位或 ARM）。如果不确定，请下载 32 位处理器的 `.iso` 文件。\n2. 从 [`rufus.ie`](http://rufus.ie) 下载\
    \ Rufus，这是一个免费的 USB 写入软件。\n3. 插入任何足够空间存储镜像的 USB 盘。取决于你阅读时镜像的大小，你可能需要 8GB 或更多空间。\n\
    4. **警告**：确保 USB 盘不包含任何贵重文件——它们将被删除！将驱动器上的任何重要文件备份，否则你可能会丢失数据。\n5. 启动 Rufus，在“设备”选项卡中选择你的\
    \ USB 盘，并保持其他设置为默认值。参考下图我使用的设置。\n6. 在勾选的“使用...创建可启动磁盘”框旁边，从下拉菜单选择“ISO 镜像”。然后点击旁边的框并定位到\
    \ Kali `.iso` 文件。\n7. 三倍检查信息是否正确，并且你的 USB 盘没有任何文件。\n8. 点击“开始”。\n\n![](img/00010.jpeg)\n\
    \nRufus 需要一些时间来完成。一旦 Rufus 显示“完成”，它就已经将 Kali Linux 安装到 USB 上并使其变得可启动。完全完成后，你就可以关闭程序了。\n\
    \n在过程的下部分，你需要完全关闭计算机。我们需要访问计算机的 BIOS。继续阅读下一节，流程将继续。\n\n## BIOS/UEFI\n\n计算机的 BIOS（基本输入输出系统）或\
    \ UEFI（统一可扩展固件接口）是计算机首次上电时运行的固件部分。传统上默认使用 BIOS，但 UEFI 提供了增强的功能，并正在缓慢地取代计算机上的 BIOS。这种启动固件执行初始化、检查硬件，并为用户在“裸机”层面上与计算机交互提供选项。在计算机首次启动时，可以通过按下键盘上的按键访问\
    \ BIOS/UEFI 界面。\n\n"
