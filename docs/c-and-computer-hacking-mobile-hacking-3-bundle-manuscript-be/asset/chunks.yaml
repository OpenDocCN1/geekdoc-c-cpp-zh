    然而，代理确实有其缺点。权力足够的执法机构可以从代理服务器检索记录，并匹配你连接的“时间戳”，以凑出你的上网历史。使用多个代理只是推迟了不可避免的结果，因为如果侦探攻破了其中代理服务器，他们就可以从一个代理追踪到另一个代理，直到到达源地址。


    ## 使用 VPN


    在书的前面的部分，VPN 被解释为通过网络对数据进行“隧道传输”。这种服务通常供员工用于居家办公，但黑客可以利用 VPN 作为某种增强型代理。典型的 VPN
    会以这种方式修改数据包，将其加密并变得不可读。这些数据包看起来不像网络活动，因为它们是通过完全不同的端口发送的。这为数据包增加了复杂度，符合其安全用途的需求。例如，在公共开放网络上查看银行账单是危险的，因为数据包可以被黑客轻易拦截和解码。然而，使用
    VPN 可以隐藏数据，并允许不受加密风险的正常无限制使用。


    熟练的黑客会利用 VPN 的类代理特性来隐藏他们的真实位置。通常情况下，由于增加了模糊性和确定源点的难度，这些服务器对于政府机构来说也具有中等的安全性。网络海盗非常喜欢虚拟私人网络，因为它们可以将他们下载的非法数据伪装成普通的受保护数据。


    VPN 通常通过第三方软件创建。`VPN` 程序允许任何人连接到 VPN 服务器，但他们很可能需要用户名和密码。组织通常拥有仅作为公司内网中继的专用 VPN，这些中继需要公司提供的密码。想要使用
    VPN 的个人可能需要付费才能到 VPN 服务器，但黑客认为购买 VPN 是非常值得的。


    ## Tor 项目


    对于寻求最高水平保护的黑客和安全专家，Tor 项目 (`http://torproject.org`) 提供了一个解决方案。该公司提供了一个名为 `Tor`
    的免费软件，它作为一个超级 VPN/代理。Tor 将互联网流量跨越数千个中继进行跳转（每个中继都有大量的加密），以确保数据包的目标地和来源不明确。该软件可以被任何想要隐藏在线活动的个人使用，并且已被证明相当有效。


    ## 浏览器指纹


    浏览器指纹是一个高级话题，是一种复杂的防黑客技术，浏览器中包含的特定唯一信息（语言包、插件、操作系统版本等）会被网站保留并用于识别用户。大多数黑客使用带有广告拦截插件、IP
    隐藏软件和其他定义特征的独特配置。其讽刺之处，为了保护自己而获得的唯一性反而通过设备指纹变成了一个识别因素。


    基本上，在互联网上保持隐藏的最佳方法是“融入大众”，这样独特的配置就无法追溯到黑客。由于这是一个非常先进且新兴的话题，现在要说侦探和网络调查员是否正在通过这种方法抓住罪犯还为过早。可以通过在线测试器查看浏览器指纹，例如
    `https://amiunique.org`。


    ## 开源 vs 专有


    在本书中，某些软件被称为“免费”。该软件的实际正确术语是 `FOSS`（自由开源软件）。`FOSS` 程序不仅在金钱上是免费的，而且其代码是透明的。开源指的是程序代码在任何时候都是可见，而专有软件的代码是永远不可见的。这一事实很重要；如果代码不可见，就无法确切知道程序在做什么，或者它在向谁发送数据。专有软件，例如谷歌的网页浏览器
    `Chrome`，无疑会将数据传回谷歌。与之形成鲜明对比的是 Mozilla 的 `FOSS` `Firefox` 网页浏览器。`Firefox` 具有透明代码，因此程序员在任何时候都可以阅读源码，并确定
    `Firefox` 是否会将数据传回。


    黑客和具有安全意识的人倾向于选择 `FOSS`，因为其本质更安全。毕竟，没有人确切知道某些可疑专有程序内部到底在发生什么。闭源软件中可能存在为政府留的后门，这会暴露善意的黑客或内部举报人，因此最好的安全性始终是通过通过维护良好的自由开源软件来实现的。


    ## 丢弃设备（Throwaways）


    举报人和高级泄密者（参见：爱华·斯诺登）需要极高的隐私，完全无法将行动关联到个人。许多专业人士决定通过丢弃设备进行他们的私人活动。


    丢弃设备是指仅用于私人活动的计算机。它通常用现金购买的，不提及买者的姓名，从不用于登录与买者相关的账户，并在咖啡馆等公共场所使用。如果使用得当，不应该有任何指向买者的证据。


    用现金购买丢弃设备非常重要，因为带有姓名的买销售发据是不可否认的联系。正由于这些原因，黑客很少甚至从不使用信用卡进行购买。现金几乎无法追踪，但监控摄像头仍然可以识别出商店里的脸。购买二手设备或从庭院销售购买可以消除组织可能拥有的监控能力。


    登录个人账户会在设备上留下痕迹，使用个人网络连接将追溯到 ISP 注册给你的 `IP`。咖啡馆、麦当劳、图书馆和网吧通常提供无需注册的免费互联网——这些地方是匿名的首选地点。


    ## 比特币


    如果在网上必须购买东西，`bitcoin` 是一种匿名的方式。`bitcoin` 是一种不关联的虚拟货币。过去的犯罪分子使用 `bitcoin` 在“暗网”购买非法物质，这证明了
    `bitcoin` 有多么匿名。


    ## 结论


    黑客必须通过实践和学习来培养技能。要获得技能，你必须学习网络基础、安全概念、编程语言、密码学等。耐力和坚韧将把最聪明的人塑造为卓越的黑客，因此终身学习应该是任何黑客的追求。你的旅程将在充满希望和承诺中继续。


    再次感谢下载本书！


    希望这本书能够帮助你理解一些围绕安全、黑客和反黑客的核心概念。该主题的范围如此巨大，这本书永远无法涵盖所有内容。尽管在书中各个主题上花费的时间很短，但我鼓励你进一步研究。


    记住，安全和黑客技术在今天比以往任何时候都重要。这本书鼓励好奇的心灵激发灵感去遵循“黑客宣言”，除了好奇心之外，不犯下任何犯罪。本书不鼓励非法活动，它鼓励探索和娱乐。


    最后，如果你喜欢这本书，请花时间分享你的想法并在 Amazon 上发表评论。我将不胜感激！


    感谢并祝你好运！


    ## 黑客大学：大二版


    将你的黑客技能提升到新水平必备指南。破解移动设备、平板电脑、游戏机和应用程序。（解锁你的 Android 和 iPhone 设备）

