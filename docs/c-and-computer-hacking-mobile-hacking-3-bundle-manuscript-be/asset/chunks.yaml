    # Chapter 4: Getting Started Hacking


    Firstly, this book assumes that the aspiring hacker is using a Windows-based operating
    system. One of the best tools available on Windows is the command prompt, which
    can be accessed by following these directions:


    1. Press and hold the windows button and the “r” key. This brings up “Run”.

    2. In the “Open:” field, type `cmd` and click okay.

    3. The command prompt will open as a black terminal with white text.


    ![](images/00005.jpeg)


    The command prompt resembles old DOS prompts or Linux terminals in aesthetics
    and functionality. Essentially, the entire computer can be interfaced through
    the command prompt without ever using a mouse, and this is how older computers
    worked! It is an essential tool for hackers because there are commands and hacking
    methods that are only possible through typing commands into the prompt.


    `C:\Users\name\>` is the current directory (folder) in which you are located.
    You can type `dir` and press enter to view the contents of the directory. To change
    folders, you would type `cd foldername`. You can also go backwards by typing `cd
    ..`. More commands can be viewed by typing `help`. It is strongly encouraged that
    the aspiring hacker learn and master the command line, because `cmd` is a hacker’s
    best friend!


    Hacking is a broad term to describe a variety of methods to achieve an end goal
    of gaining access to a system. Although some hackers do it for fun, others do
    it for personal gain. No matter how it is achieved, it must come about through
    a variety of technical methods, which will be described below. A few might have
    a demonstration attached to them; feel free to start your hacking career by following
    along.


    ## Social Engineering


    Social engineering is a hacking technique that doesn’t actually involve technical
    skill. In this method, an attacker gains access to information “socially”.


    Here is a story as an example. A clever hacker finds out that a certain employee
    of a company has a broken computer that they sent to IT to repair. The hacker
    calls the employee impersonating a new IT member and says that they are nearly
    finished with the repair, but they need her password to continue. If the disguise
    works, the employee will freely give over her password and the hacker is successful.
    Social engineering is extremely popular due to the trusting nature of people and
    cunning tricks that hackers have gained through experience.


    ## Phishing


    Phishing is a type of social engineering involving moderate technical skill. Derived
    from fishing, phishing is the act of “luring” employees to give information through
    email. Phishing can employ malware to accomplish its goal as well. Another story
    follows.


    An accountant in the business office has finished payroll for the week, and they
    check their email to find an unread message. The subject: “URGENT: PAYROLL DECLINED”
    catches the accountant’s attention. The email comes from `payroll@adponline1.com`,
    which the accountant has never seen before, but then again this problem has never
    happened previously so they do not know what to expect. “Your time clock readings
    did not come through correctly due to an authorization error. Please reply with
    your password for confirmation” reads the body. The clock reads 4:57, and everyone
    is about to go home, so the accountant is eager to get along with their day. Replying
    to the message with their password, the employee goes home, not realizing they
    just gave their password away to a hacker who now has access to payroll information.


    Phishing is highly effective and usually the initial cause of data breaches. This
    fact comes about because of the general believability of phishing emails, which
    often use personal information to look legitimate. Additionally, most employees
    are not computer savvy enough to understand the difference between a fake password
    request and a real one.


    Recently, many companies have begun allocating funds to security training programs
    for employees. These courses specifically teach how to guard against phishing
    attempts. Despite this, the brightest hackers will always be able to con and socially
    engineer their way into sensitive information.


    ## DoS


    Denial of Service (DoS) is an attack where multiple network requests are sent
    to a website or server in order to overload and crash it. DoS attacks can bring
    down infrastructure not prepared to handle large volumes of requests all at once.
    A few hackers use DoS attacks as a distraction or added nuisance to cover up their
    actual attack as it happens. Hackers can send individual network requests through
    the Windows command prompt as seen below:


    ![](images/00006.jpeg)


    Here, just a few bytes of data are being sent to google.com, but you can specify
    how many by altering the command like so:


    ```

    ping –f –l 65500 websitename

    ```


    The `-f` makes sure the packet is not fragmented or broken up, and `-l` lets you
    input a packet size from 32-65500, thereby increasing the size of the packet and
    the number of resources it consumes.


    Now certainly the average hacker will never be able to take down a website such
    as google.com through ping requests on command prompt, so the above is for educational
    purposes only-real DoS attacks involve a powerful computer spamming the network
    with requests until the server slows to a crawl or crashes outright.


    Anti-hackers respond to a high volume of traffic coming from a single origin by
    blocking that IP from making further requests. They can also observe the type
    of traffic flooding the server and block packet-types that look like DoS spam.


    ## DDoS


    Much more dangerous, DDoS (distributed denial of service) attacks are exponentially
    stronger than simple denial of service attacks. DDoS attacks involve attacking
    a server with multiple DoS attacks concurrently, each originating from various
    different locations. These attacks are much harder to block, because the original
    IP addresses are constantly changing, or there are just too many to block effectively.


    One example of how devastating DDoS attacks can came from the Sony attack of December
    2014. Sony’s newest game console (at the time) had just come out, and kids were
    opening them on Christmas day anxious to begin having fun. After hooking them
    up to the internet though, the disappointed kids were met with error messages
    stating that the Sony Network was down. The hacker collective Lizard Squad had
    been DDoSing Sony and overloading their game servers just for fun. Additionally,
    millions of new players were trying to access the service to play games and inquire
    about the down-time as well, which flooded the infrastructure even more. This
    created an issue for Sony, as they could not just block all requests because some
    were legitimate customers. The issue was finally resolved when the DDoSing was
    stopped, but the situation proved just how easily a coordinated network attack
    can cripple large servers.


    Security Professionals have a few tools to prevent DDoS attacks from occurring.
    Load balancing hardware can spread out large requests among various servers, as
    to not bog down a single machine. They can also block the main sources of the
    attacks, pinging and DNS requests. Some companies, such as CloudFlare, offer web
    software that can actively identify and emergently block any traffic it believes
    is a DDoS attempt.


    Performing DDoS attacks is relatively easy. Open-source software exists by the
    name of LOIC (Low Orbit Ion Cannon) that allows ease-of-use for DDoSing. The software
    can be seen below:


    ![http://resources.infosecinstitute.com/wp-content/uploads/122011_2124_LOICLowOrbi1.jpg](images/00007.jpeg)

