    -   **网页**：许多网页是使用 `C++` 制作的。这是因为这种语言非常易于操作，能够快速快捷地构建出为用户提供大量交互功能的网站。你可能经常访问的某些由
    `C++` 创建的网站包括 Amazon 和 Ebay。如果你喜欢设计网页，你应该学习 `C++` 以提高效率，甚至可能在这个领域找到一份不错的工作。

    -   **手机应用**：如今似乎每个人都拥有一部智能手机，这意味着应用程序无处不在。市上有成千上万的 App，而且每天都有新的 App 生成。有些 App
    是免费的，有些需要付费，但很大一部分是使用 `C++` 制作的。这是因为这种语言的扩展性极强，可以用于简单的游戏，也可以用于复杂的购物应用。


    还有许多 `C++` 的其他次要用途，例如 VoIP 通话。它就是使用 `C++` 创建的。事实是，你会一次又一次被告诉 `C++` 是一门正在消失的语言，但实际上这只是
    `JAVA` 人为了恐吓人们切换语言以确保 `C++` 走向没而使用的一种诡计。


    ## 为什么使用它


    使用 `C++` 不仅是因为它的灵活性和速度，还因为它拥有许多组件，相当容易学习，而且如果你掌握了 `C++`，你就可以轻松地掌握其他语言。原因在于，当你先学习比其他任何东西都复杂一点的内容时，较容易的内容就会迎刃而解；然而，如果你习惯了容易学习的科目，你就会发现更困难的科目变得很难学习，因为你不习惯在正尝试学习的科目上投入那么多精力。


    如果你想学习一种可以在计算机技术领域内用于不同类型函数的语言，那么这门语言正适合你。你用它做几乎任何事情，一旦你对其有了足够的了解，你可能找到操纵这种语言来实现它通常无法做到的事情。


    在计算机编程领域，`C++` 是一门非常重要的语言，尽管由于布局方式它有很多变量，但它非常易读，也非常容易创建。这使其成为世界上最受欢迎的编程语言之一，因为没有人想苦苦于阅读代码。没有人想把所有时间都花在自己知道是正确的事情上，仅仅因为他们找不到自己哪里出错了。


    ## 职业前景


    是的，有很多工作仍然依赖 `C++` 来运行。你可以做许多不同的事情，而且所有这些事情都会影响社区中的其他人。视频游戏设计和网页设计是其中最著名的两个。你也可以成为一名白帽或蓝帽黑客。


    但根据 payscale.com`（搜索软件工程师），根据经验，拥有 `C++` 软件工程师背景的人士可以获得 $57,000 到 $120,000 的收入。中位数在
    $80,363 左右。拥有 `C++` 编程语言背景的人的其他头衔还包括计算机程序员、电气工程师和应用开发人员。


    然而，为了做到最好，你应该始终掌握两三门编程语言以保持市场竞争力。虽然这些语言不会包含在书中，但不要把自己束缚在一种语言上。相反，就像人类语言一样，开宽你的眼界并涉几种，但保留一门作为你的主语言。


    由于 `C++` 的多功能性，它应该是你依靠的备选主语言。也许可以使用 `JAVA` 或 `Linux` 作为你的其他语言，但 `C++` 是最好的主语言，而你只想要最好的作为你的主语言。


    `C++` 是一门静态编写的低级语言，这意味着它是一门简洁且扩展性强的语言。


    `C++` 是 `C` 的全功能超集，支持面向对象编程。这意味着它支持 `OOP` 的所有支柱，如封装、数据隐藏、继承和多态。


    要了解更多关于面向对象的知识，你可以在网上进行快速搜索并发现更多信息。最好获得一些它是什么的知识，但这对你的 `C++` 知识并不是至关重要的，因此它不会真正包含在书中，除了几处顺带的以及这里那里的一些零碎信息之外。


    ## C++ 的三个重要组件


    标准的 `C++` 由三个非常重要的概念组成。


    -   **核心语言**：它由所有的变量、数据类型、字面量和语言的其他重要方面组成，创建了通往下一阶段的构建基石。

    -   **C++ 标准库**：这允许你操作语言中的文件和其他工作，并按照你的意愿操纵它们。

    -   **STL**：代表标准模板库（Standard Template Library），它为你提供了操作数据结构、变量以及其他类似内容的函数。


    ## 为什么 C++ 被认为是世界上最好的语言？


    嗯，除了上述提到的灵活性、速度和简单性外，它是一门跨越了三十多年的语言，并在今天仍被广泛使用。在生活的任何领域，没有多少产品可以这样说。产品和公司来来去，但只有真正的完美会留存。好吧，话是这么说的。诚实地说，`C++`
    从那时以后有很多更新，但核心过程仍然一样。它问世时领先时代许多光年，由于保持其处于领先地位的更新，它今天仍然是一项非常先进的技术。


    还有许多关于 `C++` 被认为是最好的语言的观点。虽然许多人说 `C++` 不再具有相关性，但有更多的人证实它仍然是世界上最好的语言，并且是他们的备选语言。这是他们最了解的语言，也是他们深藏心底的语言。原因各异，但
    90% 的程序员默认使用 `C++` 这一事实表明它确实是当今最好的编程语言。


    `C++` 是少数完全遵循 ANSI 标准的语言之一，这就是为什么你玩过的最棒的游戏仍然是使用 `C++` 编写的。因为它们的编译器被设置为确保所有命令在编写和执行时都没有错误。它也可以用于许多不同类型的平台，无论你拥有
    Microsoft、Unix、Mac、Windows 还是 Alpha 设备，都可以使用 `C++`。这是一件很棒的事，因为许多程序员必须在许多不同的平台上操作，通用性使其变得易于使用和便携。只需将代码丢进闪存盘并上传到任何需要的地方即可。


    ## 使用 C++ 语言的优势


    在使用 `C++` 语言时，你将享受到许多好处。其中一些好处包括：


    -   **大型库**：由于 `C++` 已经存在了很久，他们拥有一个非常大的库。这供你使用，你可以从脚本中挑选你需要的代码，节省时间甚至学习一些新知识。如果你愿意，你也可以创建一些自己的代码，但这个库对于正在学习的初学者非常有帮助，并且可以让编写代码变得比以往任何时候都容易。

    -   **与其他语言协作的能力**：`C++` 是一种与其他一些编程语言一起使用的极佳语言。这让你投入你想要的项目变得更容易，因为你可以从不同的代码语言中添加你喜欢的部分并将它们结合起来，创造出真正惊人的东西。


