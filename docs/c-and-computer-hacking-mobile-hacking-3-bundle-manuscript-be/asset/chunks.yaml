    此函数允许你打印任何你想打印的内容，而不仅仅是“Try This”这些单词。


    现在，让我们详细分析一下上述程序的各个方面。这种语言有几个不同的方面需要你考虑。每个方面对于程序的运行都至关重要，如果你不完全执行它们。


    ### 头文件 (Headers)

    头文件- C++ 中有很多头文件，它们对于编程操作来说都是必需的，或者至少对你的编程操作是有用的。然而，对于大多数函数，你会看到位于 `<iostream>`
    之上的头文件。当你使用头文件时，请确保正确地包含它，并在前面加上 `#include` 以提示程序使用该头文件。


    ### 命名空间 (Namespace)

    命名空间是 C++ 中一个很新的特性，直到 2011 年的更新才出现。它们的作用不大，只是描述要使用哪个命名空间。虽然它们不是必须的，但它们可以减少你在程序函数方面的很多困惑。它们只是作为一种更系统的方式组织你的函数。


    ### 主函数 (Main)

    Main- 这里是主函数开始的地方。使用 `// main()` 行会指令程序开始执行程序的主函数，并开始输出过程。设置主函数命令是关重要的，否则你的程序将不知道它应该运行什么，也不知道它应该什么时候运行。这在程序内部被视为一个单行注释，它将告诉程序主函数正在开始。


    ### INT main

    INT main- 这是函数执行正式开始的地方。如果你不包含这个，整个过程将停止，因为你没有引入变量，而没有变量，程序就会迷失方向。


    ### Cout

    Cout- 这条指令程序在屏幕上显示你想显示的消息。如果你不放置 `cout`，你的程序很可能会失败，也可能不失败。问题在于你不知道自己是否成功了，所以如果你想确保一切运行得顺畅，请务必添加
    `cout`。


    ### Return (Return)

    Return- 这会将值返回给零并终止函数。它指令程序结束过程并回到开头。


    ### 如何编译和执行 (How to Compile and Execute)

    现在来编译并执行你的第一个正式 C++ 程序。


    首先，你必须知道如何保存文件。打开你选择的文本编辑器，并输入上方代码。完成后，点击“另存为”，并选择一个容易找到的文件位置。为了组织起见，最好为所有程序准备一个单独的文件夹。将文件保存为
    `hello.cpp`，保存后，你应该在进入文件保存的目录之前打开命令提示符。


    要让文件在编译器中打开，首先输入 `g++ hello.cpp`。然后你可以按回车键，代码将被正确打开。只要没有任何错误，提示符就会生成一个 `a.out`
    可执行文件。要运行程序，输入 `./a.out` 并观察编译器的运行。你从计算机编译器中从中获得的信息包括：


    ```

    $ g++ hello.cpp

    $ ./a.out

    ```


    试一试 (Try This)

    确保你以正确的方式输入所有变量，并记住，这些内容是**区分大小写**的。如果你不正确正确输入函数，你会发现事情往往会出错。编码的特点在于你必须精确。这种注重细节的个人特质适用于所有编程语言！然而，只要愿意注意，任何人都可以做到的。


    ### 分号和代码块 (Semicolons and Blocks)

    基本的函数命令并不是你唯一需要使用的。在构建提示符时，还有其他事情也是重要的，因为它们同样指令程序执行特定的事情。其中一些事情就是代码块和分号。


    当你想到分号时，你可能认为它是句子中的停顿，但在 C++ 程序中，它们是完全的停止。分号表示语句的结束。这意味着每一个单独语句必须通过使用分号来标记。以下是三个不同的语句。


    ```

    x=y;

    y=y+1;

    add(x,y);

    ```


    每一个语句之间不仅通过换行符分隔，还通过分号分隔。你也可以这样做：


    ```

    x=y; y=y+1; add(x,y);

    ```


    仅仅因为分号，其中每一个都会被识别为独立的语句。如此简单的事情竟然能产生如此大的影响，这确实令人惊叹。


    在这种编程语言中，代码块是一组被包含在括号中的语句。这些语句是逻辑实体，程序由于主命令提示符将它们显示在屏幕上。例如：


    ```

    {

    cout << "I like Pizza"; //打印 I like Pizza

    return 0

    }

    ```


    行尾并不是终止符，如上文所示。分号是终止语句的唯一东西。


    ### 标识符 (Identifiers)

    现在我们来看程序中的标识符。这些标识符用于标识多个事物，例如代码块内的类、模块、函数和变量。标识符是一组字母和数字，你可以用它们命名你的程序或文件，它们必须以字母开头，之后可以是任何你想要的字母或数字。除了你在句子中看到的标点符号外，不允许使用其他标点字符。你不会看到如
    `@`、`&`、`%` 或 `$` 这样的字符，并且编程是区分大小写的。这意味着 `YokoOno` 与 `Yokoono`、`yokoOno` 和 `yokoono`
    是不同的。确保你在程序中只大写应该大写的字母。


    虽然几乎任何东西都可以作为标识符，但 C++ 中有些内容是预留给**关键字**的，不能用作标识符。这些单词如下。


    | asm | | | |

    |---|---|---|---|

    | Break | Bool | Auto | |

    | Char | Catch | Case | |

    | Const cast | Const | Class | |

    | Delete | Default | Continue | |

    | Dynamic cast | Double | Do | |

    | Explicit | Enum | Else | |

    | False | Extern | Export | |

    | Friend | For | Float | |

    | Inline | If | Goto | |

    | Mutable | Long | Int | |

    | Protected | Private | Namespace | |

    | Reinterpret cast | Register | Public | |

    | Signed | Short | Return | |

    | Static cast | Static | Sizeof | |

    | Template | Switch | Struct | |

    | True | Throw | This | |

    | Typeid | Typedef | Try | |

    | Unsigned | Unlon | Typename | |

    | Void | Virtual | Using | |

    | While | Wchar t | Volatile | |


    在标识符方面，几乎任何东西都可以。把标识符视为用户名和密码。混合使用，但要确保它们是有效的。


    ### 三元组 (Trigraphs)

    三元组是一组代表单个字符的三个字符序列。你会注意到这些，因为它们将以两个问号开头。使用三个字符来代替一个字符似乎有点冗余，但背后的原因是为了不让程序混淆字符含义，因为许多字符很相似。


    是一些常用的三元组，让你了解我们表达的意思：


    - `??=` `#`

    - `??/` `\`

    - `??''` `^`

    - `??(` `[`

    - `??)` `]`

    - `??!` `|`

    - `??<` `{`

    - `??>` `}`

    - `??-` `~`


    由于其混淆的性质，并不是所有的编译器都支持三元组，大多数人都会尽量避开它们，然而发现当你记忆了三元组时，你在函数中按错符号的概率就会降低。


    ### 空格 (Whitespace)

    接下来是空白字符。这是程序中的空行。有时它们包含注释，这些被称为空白行。编译器会完全忽略它们。空白字符描述空格、换行、制表符、字符和注释。它仅仅是为了让你的程序看起来更有组织、更易读。


    变量/标识符与语句之间应该至少有一行空白。


