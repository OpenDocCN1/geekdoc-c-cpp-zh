- fmt: '

    On an iPhone you can factory reset with the following procedure:


    1. Shut off the phone, connect it to a computer with `iTunes`, and boot the iPhone
    into recovery mode (hold power button and home buttons at same time until recovery
    mode it shown).

    2. On `iTunes`, click the “restore” button that pops up to delete all data and
    claim the phone as your own.


    Every Android device has a different button combination to enter recovery mode,
    so research your phone’s model. We will demonstrate factory resetting an Android
    phone with the most common combination.


    1. Shut off the phone and boot it into recovery mode. The power button and volume
    down button held together is a common combination.

    2. Use the physical buttons (sometimes volume up and down) to navigate the menu.
    Select factory reset and confirm.


    ## Unlocking a Device from its Carrier


    Phones and other mobile devices are often “locked” to a specific carrier, meaning
    the device cannot have cell service from any other company. The locked phone is
    essentially held hostage by the carrier- unless you follow through with an unlocking
    process. Carriers can help you through the process, but you usually need a good
    reason to have the device unlocked (traveling to areas without coverage, military
    deployment, contract has expired and you are switching). Stolen devices cannot
    be unlocked. The cheapest phones you can find on `eBay` are sometimes stolen,
    and carriers may refuse to unlock if they have the device filed as lost or stolen.


    It is important to note that phones run on networks (`GSM` and `CDMA`) that limit
    the number of carriers a phone can operate on- a mobile device’s network cannot
    be changed at all, but the carrier that operates on the same network CAN be changed.


    Most unlocks require the phone to be fully payed off, have an account in good
    standing, and you must not exceed too many unlocks in one year. The process involves
    gathering all information about the phone (phone number, `IMEI`, account information,
    account holder information), proving you own it, and requesting the device be
    unlocked through phone call or internet form. Sadly, some carriers simply cannot
    be unlocked. The most popular cell carriers are listed here.


    ### Carrier Unlocking Chart


    | Carrier | Network | Alternative Carriers | Unlock Method | Notes |

    | :--- | :--- | :--- | :--- | :--- |

    | ATT | GSM | T-Mobile, Straight Talk, Net10 | Call `1-800-331-0500` or [submit
    form online.](https://www.att.com/deviceunlock/?partner=LinkShare&siteId=TnL5HPStwNw-0w3siF60h.h45d7DZrjCbw#/)
    | N/A |

    | Sprint (Virgin/Boost) | CMDA | Voyager, Sprint Prepaid | Call `1-888-211-4727`
    or participate in an [online chat.](http://sprintworldwide.custhelp.com/app/chat/chat_launch/?ECID=vanity:swwsupport)
    | It is extremely difficult to unlock a Sprint phone, and most devices cannot
    be unlocked at all. |

    | T-Mobile | GSM | ATT, Straight Talk, Net10 | Call `1-877-746-0909` or participate
    in an [online chat.](https://support.t-mobile.com/community/contact-us) | N/A
    |

    | Verizon | CDMA | Newer ones can operate on GSM, others can switch to PagePlus
    | Call `1-800-711-8300`. | Some Verizon phones aren’t actually locked. |


    The networks that different phones operate on actually vary, so you’ll need to
    do a little research to find out what networks a phone can run on. The networks
    listed above are the most popular ones that are used on different carrier’s devices.
    The unlock process may prove difficult, but phone unlocking stores exist that
    can go through the process for you.


    ## Securing your Devices


    As previously explained, older versions of operating systems retain many bugs
    and exploits. Especially with phones always install the latest updates as soon
    as possible.


    One of the reasons that the San Bernardino phone was so hard to crack was because
    of Apple’s inherent encryption that is enabled when there is a passcode present.
    What this means for the security-minded iPhone owner is that having a passcode
    ensures fantastic protection. So long as a passcode is enabled, the phone is also
    encrypted. Simple hacks cannot extract data that is encrypted, and that is why
    the FBI had to pay for an alternative exploit.


    Readers of the previous book will remember that encryption is the scrambling of
    data to dissuade access. Only people with the correct password can decode the
    jumbled text. Just as with desktops, encrypting your mobile phone will protect
    it from unauthorized access. All iPhones (with newer updates) automatically encrypt
    when passcode is enabled. Android phones running `OS 6.0` and above are encrypted
    automatically, but those running older operating systems must enable the feature
    manually (`settings`, `security`, `encrypt phone`). Encrypted phones will run
    slower, but they will be more secure. Even some text messaging apps (`WhatsApp`)
    can encrypt text messages that are sent.


    If a hacker or agency were to get possession of the device, though, there is still
    one trick that gives opposition the upper hand. Even phones with passcodes and
    encryption still readily show notifications on the lock screen by default. Say,
    for instance, a hacker has possession of the phone and they attempt to login to
    your online banking. Without the password, though, the attacker can still send
    a verification code to the phone and see it on the lock screen. Nullify lock screen
    problems by disabling the notifications entirely. On `iDevices` go through `settings`,
    `control center`, and then turn `Access to Lock Screen` off. On an Android progress
    through `settings`, `sound and notifications`, then turn `while locked` to off.


    Say there is an app installed on your mobile device and you suspect that it may
    contain a Trojan horse or have malicious intent. The app may have been installed
    from a 3rd party, or you may have your suspicions that Facebook is collecting
    data on you. Luckily on both iPhone and Androids you can turn off specific app
    permissions to restrict the amount of access the app has. Just as when you install
    an app it requests permission for, say, microphone, camera, and contacts, you
    can revoke those permissions at any time.


    Android phones edit permissions (in `Marshmallow 6.0`) in the settings app. The
    `apps` tab shows all apps installed, and by clicking the settings button in the
    top right you can select `app permissions`. The next screen shows every accessible
    part of your Android, such as camera, contacts, `GPS`, etc… You can edit each
    category and change which apps have permission to use them.


    iOS has debatably better app permission methods, as it only requests use of a
    peripheral when the app wants to use it. Security-minded individuals can take
    the hint that a request for permissions at an odd time would obviously mean nefarious
    activity is taking place. Nonetheless app permissions can be taken away too, through
    the `privacy` tab in `settings`. Just as with Android, tapping on a category shows
    all apps that use that function and give you the option to revoke the permissions.


    Malware and viruses still exist for mobile devices. Phones and tablets can be
    secured by installing an antivirus app from a trusted source. Some attackers like
    to disguise Trojan horses as antivirus apps, though; only download apps that seem
    reputable and have good reviews. Don’t be against paid antivirus apps, either,
    because they are usually the ones that work best.


    ## Modding, Jailbreaking, and Rooting


    Contemporary devices are locked down, running proprietary software, and closed
    to customization. The act of modding a device to gain additional functionality
    has a slew of different names; on iPhones the modding process is commonly known
    as `Jailbreaking`, on Android phones it is known as `rooting`, and on video game
    consoles the action is referred to as just `modding`.

