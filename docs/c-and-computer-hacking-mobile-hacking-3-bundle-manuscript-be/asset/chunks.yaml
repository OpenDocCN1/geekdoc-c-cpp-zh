    \ C++ 语言代码时如何让它们充分发挥作用。\n\n## 逻辑运算符\n\n我们在本指南中使用的第一种运算符是逻辑运算符。它们将帮助你比较输入到中的某些部分。你可以使用的逻辑运算符包括：\n\
    \n*   `||`: 这被称为逻辑或（OR）。如果你的其中一个操作数不为零，则条件将为真。\n*   `&&`: 这被称为逻辑与（AND）。如果你有两个操作数且它们都不为零，你的条件就为真。\n\
    *   `!`: 这是逻辑非（NOT）。你可以用它来反转操作数的状态。所以，如果条件结果为假，这个符号将使其变为真。\n\n## 算术运算符\n\n你可以使用的另一种运算符是算术运算符。这与在学校学习数学几乎一样。你将告诉程序根据你提供的信息进行加、减和其他等式运算。你可以使用的的一些算术运算符包括：\n\
    \n*   `+`: 这是加法运算符，会将你选择的两个操作数相加。\n*   `-`: 这是减法运算符。它将右侧的操作数减去左侧的操作数。\n*   `*`:\
    \ 这是一个让你能够在 C++ 语言中进行乘法的运算符。\n*   `/`: 这个运算符帮助你在 C++ 中进行除法运算。\n*   `++`: 这是自增运算符。它会将你的操作数的值加\
    \ 1。\n*   `--`: 这是自减运算符。它会将操作数的值减 1。\n\n## 赋值运算符\n\n赋值运算符将帮助你更方便地为变量命名，并帮助对你正在编写的代码不同部分进行搜索、保存等操作。你可以在\
    \ C++ 中使用的某些赋值运算符包括：\n\n*   `=`: 这个运算符是简单的赋值运算符。它将右侧操作数的值赋值给左侧的操作数。\n*   `+=`:\
    \ 这被称为加赋值运算符（Add AND）。它会将两个操作数的值相加，然后将它们的和赋值给左侧的操作数。\n*   `*=`: 这是乘赋值运算符（Multiply\
    \ AND）。它会将两个操作数相乘，然后将结果交给左侧的操作数。\n*   `-=`: 这会将右侧操作数的值从左侧减去，然后将差值交给左侧操作数。\n* \
    \  `/=`: 这是除赋值运算符。它将左侧的值除以右侧的值，然后将结果赋值给左侧。\n\n还有其他一些赋值运算符，但它们更高级，所以我们只坚持这些基础运算符，以保持条理！\n\
    \n## 关系运算符\n\n当你在 C++ 语言内部工作时，关系运算符会非常有帮助。你可以使用的一些运算符包括：\n\n*   `==`: 这是检查你两个操作数是否相等的运算符。如果它们相等，条件将为真。\n\
    *   `>`: 这个运算符检查你操作数的值。如果左侧的操作数大于右侧的，则条件将为真。\n*   `<`: 这个运算符基本上与上面的一个相反。如果你发现左侧操作数的值大于右侧的值，则条件将为真。\n\
    *   `!=`: 这个将检查你两个操作数是否相等，如果值不相等，你的条件就为真。\n*   `<=`: 这个运算符检查左侧操作数是否小于或等于右侧操作数。如果符合此标准，则条件为真。\n\
    *   `>=`: 这个将检查左侧操作数的值是否大于或等于右侧的值。如果是，则条件为真。\n\n# 第 6 章：帮助 C++ 做出决策\n\n有时你需要程序为你为你做决定。你可以根据用户输入电脑的信息以及你决定的满足什么条件以使条件为真，来设置它以特定的方式运行。在这个系统内部，决策判断要高级一些，但你会发现它很容易学习，并且会在你在\
    \ C++ 系统中可以开展的很多想法。让我们来看看你可以做什么来帮助系统自己做出决策。\n\n## Switch 语句\n\n我们在系统内部要处理的第一种决策是\
    \ switch 语句。这些语句很好，因为它们允许你检查变量与一组值（或情况，cases）是否相等。你正尝试检查的变量将与每个 case 进行比较。你可以使用的语法良好示例包括：\n\
    \n```cpp\nSwitch(expression){\n    case constant-expression:\n        statement(s);\n\
    \        break; // 可选\n    case constant-expression:\n        statement(s);\n\
    \        break; // 可选\n    //你可以根据需要添加任意数量的这些 case 语句\n    Default: // 可选\n  \
    \      statement(s);\n}\n```\n\n在这些语句内部工作，有几个规则你应该牢记在心。首先，switch 语句的表达式应该是整数或枚举类类型。此外，它也可以属于一个具有转换函数的类。在\
    \ C++ 中，你向语法中添加的 case 语句数量没有限制，你可以根据需要让它们变长或变短。只需记住每个 case 中都需要一个冒号和一个值。\n\n一旦变量找到了与它相等的值，它将继续运行，直到找到一个\
    \ break 语句。系统找到 break 语句后，switch 将停止。然后控制流将继续传递。你不需要在 case 中放入 break 语句。如果你最终没有这些语句，控制流将继续传递。\n\
    \n## if 语句\n\n你在程序中可以做的最基础的事情之一就是创建一个 if 语句。这些基于系统内部的真和假思想。如果系统认为根据你设置的条件输入为真，那么程序将运行你要求执行的任何内容。例如，你设置系统为\
    \ `2 + 2` 的答案是什么。如果用户输入的答案是 `4`，你可以弹出一个显示“正确！干得好！”的消息。\n\n"
