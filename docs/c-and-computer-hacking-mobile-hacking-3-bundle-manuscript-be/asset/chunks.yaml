    密码学是对加密和解密的研究与实践。加密文件涉及通过各种算法对数据内容进行混乱。算法越复杂，加密的逆转（即解密）就越困难。重要文件几乎总是经过加密的，因此在没有解密所需的密码的情况下就无法读取。加密也可以通过其他各种手段撤销，例如密码分析（对数据模式进行密集的评估和研究，可能借此发现密码）或攻击。


    ## 密码

    密码是用于验证用户身份的关键短语，允许其访问通常未经授权人员无法访问的信息。我们在计算机的几乎各个方面都使用密码，而破解密码是大多数黑客的梦以目标。密码可以通过许多不同的方式被泄露，但主要是通过数据库泄露、社会工程学或弱密码。


    ## 硬件

    使计算机运行起来的物理组件。这里有一个安全小常识：美国政府有时担心来自中国的硬件在设计上允许中国黑客入侵美国政府的计算机。


    ## 软件

    软件是任何执行任务的编写代码程序。软件的示例从文字处理器到网络浏览器再到操作系统等。软件也可以称为程序、应用程序和 App。


    ## 脚本

    实现简单任务的小段代码可以被称为脚本。通常不是完整的程序或软件，因为它们太小了。


    ## 操作系统

    计算机上作为其他较小应用程序框架的大型软件被称为操作系统或 OS。大多数计算机运行微软操作系统的变体，但也有一些计算机使用 Apple OSX 或基于 GNU+Linux
    的操作系统。


    ### Linux

    简单来说，Linux 是一个促进复杂操作系统的 `kernel`（`kernel = 底层操作系统代码`）。虽然 Windows 使用 `NT` 内核作为核心，但
    Ubuntu 和 Debian 等操作系统使用 `Linux` 内核作为核心。Linux 操作系统与我们习惯的非常不同，因为它们不运行 `.exe` 文件，也没有熟悉的界面。事实上，某些
    Linux 操作系统完全是基于文本的。尽管如此，Linux 对黑客来说是非常强大的，因为它可以运行 Windows 无法运行的软件，其中某些软件是专门为安全和黑客攻击而设计的。我们将在后面的章节中看到如何利用
    Linux 我们的优势。


    ## 计算机病毒

    这是一个广义术语，通常涵盖各种威胁。它可以指病毒、蠕虫、特洛马、恶意软件或任何其他恶意程序。具体来说，病毒是一种自我复制的有害程序。病毒将自己复制到其他计算机上并继续像感冒一样传播感染。某些病毒是为了骚扰用户，另一些是为了破坏系统，有些甚至会隐藏并在幕后造成看不见的损害。奇怪的计算机活动或一般的运行缓慢有时可能是病毒。


    ### 蠕虫

    蠕虫是不需要宿主机的恶意代码。蠕虫在网络中“爬行”，并具有深远的影响力。


    ### 特洛伊木马

    命名源自古代的“特洛伊木马”，特洛伊木马是伪装成有用程序的坏软件。如果你曾经从互联网上下载程序而导致感染，那么你就中中了特洛伊木马。特洛伊木马通常捆绑在软件安装中，并与真正有用的程序一起复制。


    ### 恶意软件

    恶意软件是恶作程序的通用泛义术语，例如脚本、勒索软件以及上述所有程序。


    ### 勒索软件

    勒索软件是一种特定的恶意软件，它能巧妙地加密用户文件并要求支付解密密码。这种方式非常有效，因为要求数据始终可用的的大型企业（医院、学校等）通常必须支付费用以继续业务。


    ### 僵尸网络

    蠕虫和其他类型的恶意软件有时会出于更大的目的感染计算机。僵尸网络是相互连接的受感染计算机网络，响应黑客的。受感染的“僵尸”可以被成组运行并汇集资源进行大规模的
    DDoS 攻击，从而关闭公司和政府网站。某些僵尸网络组使用庞大的组合计算力暴力破解密码并解密数据。成为恶意僵尸网络的一部分永远无无益处。


    ### 代理

    为黑客和关注隐私的个人存在有用的工具。代理是将你的互联网内容路由到另一个地方的服务，以隐藏你的真实位置。例如，如果你通过位于瑞典的代理在线发布帖子，该帖子看起来就像最初是在瑞典创建的，而不是你实际居住的地方。黑客使用代理来隐藏他们的真实位置以防被发现。关注安全的人使用代理来躲避侵入性的监控。


    ### VPN

    虚拟专用网络（VPN）是一种“隧道”互联网流量的服务/程序。它的工作方式与代理非常相似，但除了加密数据包外，还可以隐藏各种其他信息。VPN 通常由不在办公室工作的业务员工使用。员工可以连接到他们的
    VPN，他们将通过公司服务器隧道，并像坐在办公室办公椅上一样访问数据。黑客可以使用 VPN 来隐藏位置和数据信息，或创建到其目标的直接链接。到办公室服务器的
    VPN 链接无疑比普通的互联网连接提供更多权限。


    ## 渗透测试

    渗透测试（或 pen testing）是寻找安全漏洞的良性行为，黑客可能会利用这些漏洞为其有利。安全专家可以将渗透测试作为一份全职工作，并获得公司付费以在“坏人”之前发现漏洞。


    ### 漏洞

    程序或网络内部可用于获取额外访问的利用程序或问题被称为漏洞（漏洞）。热门索尼视频游戏机 Playstation 3 中的一个漏洞让黑客能够免费安装盗版游戏，而不是付费。发现利用程序或漏洞是黑客的另一个大目标。


    ### Bug

    程序内部产生意外结果的故障或问题。Bug 有时可以用来制造漏洞，因此黑客总是检查程序中的 Bug，而安全专家总是试图修复 Bug。


    ## 互联网

    互联网是一个可以相互通信的连接计算机网络。通过与网络服务器通信可以使用网站，并在连接到游戏服务器后可以玩游戏。最终，取决于计算机的安全设置，互联网上的每台计算机都可以与任何其他计算机通信。


    ### 内网

    相比之下，内网是由少数几台计算机组成的本地网络。公司可能使用内网安全地共享文件，而无需通过可能被拦截的整个互联网。VPN 通常用于连接到私有内网。


    ### IP

    `IP`（互联网协议）地址是分配给网络上设备的数字标识符。互联网上的每台计算机都有一个公共 `IP`，即可以地理定位计算机的 `IP`。我们使用 `IP`
    地址连接网站，但不是输入类似 `192.168.1.0` 的数字，而是输入域名（`google.com`），它通过 DNS 服务器翻译成数字 `IP`。


    你可以在 Windows 命令提示符中输入 `ipconfig` 来获取你的本地/私有 `IP` 地址。某些网站（例如 `http://whatismyipaddress.com/`）可以显示你的公共
    `IP` 地址。


    ![](img/00004.jpeg)


