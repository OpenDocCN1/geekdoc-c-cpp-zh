    Continuing the demonstration of booting into an OS contained on a USB stick, the
    user now needs to set USB drives to boot before hard drives. Every motherboard
    manufacturer will use their own custom interface, so this book cannot explain
    the specific steps for each motherboard model. Basically, the goal is to find
    the “boot order”, which is the order in which the computer checks for bootable
    operating systems. Under normal conditions, the computer will boot from the internal
    hard drive first, which is the probably operating system you are reading this
    from now. We need to make sure the computer checks the USB drive for an OS before
    it checks internally. In the image below the hard drive is checked first, then
    the CD-ROM Drive is checked. Thirdly any removable devices are checked, but this
    specific computer would probably only get as far as the internal hard drive before
    finding the primary OS and booting. To boot into our image on the USB drive, move
    “Removable Devices” to the top of the list. Finally, ensure that the USB is plugged
    in, save changes to BIOS/UEFI, and reboot. The computer should begin loading Kali
    Linux.


    ![http://f.tqn.com/y/pcsupport/1/S/f/c/-/-/boot-options-hard-drive-first.png](images/00011.jpeg)


    Any problems with booting will give an error message that the user can internet
    search to troubleshoot, but more than likely the computer will boot into Kali
    successfully. The user can now use a whole new operating system!


    Kali Linux was chosen because of the tools that are available to it by default.
    Kali is often the go-to OS for hackers due to the software included. Hackers and
    security professionals alike chose Kali, so it is encouraged that aspiring minds
    experiment with the OS.


    ## Using another OS to steal data


    Here is an interesting point: through the bootable Kali USB you can also load
    your primary internal hard drive and view the contents. This means that you can
    access the files on your disk without booting into Windows. Try opening up your
    internal hard drive and viewing your personal files. Sometimes it is shocking
    to realize how easy it is to view personal data without really turning on Windows.
    Now admittedly there are a few restrictions on accessing protected data, but this
    technique can be used to recover secret information from a computer that does
    not belong to a hacker. Remember, if a computer is accessible physically, hackers
    have a significant advantage. They could always load up their favorite bootable
    OS, copy all data in the hard drive, and leave without ever logging into Windows.
    Even password protected or encrypted data is vulnerable to be copied. Since the
    attacker has a copy of the locked data, they can spend unlimited time trying to
    crack the password.


    We will take a look at some of the other hacking tools present in Kali Linux below.


    ## Port Scanning


    Hacking is made easier with knowledge of the target infrastructure. One of the
    best ways to map out networks is through port scanning. Scanning ports reveals
    open points in a network. Having certain ports open can offer unique exploits
    for hackers, so hackers usually port scan prior to deciding a point-of-entry.
    On Kali Linux the best tool to do this is `nmap`. By loading Kali Linux onto a
    networked computer and running a terminal (Linux version of command prompt, open
    with `ctrl+alt+T`), the hacker can enter this command to scan a computer for open
    ports:


    ```

    nmap -sV IPADDRESS -A –v

    ```


    The terminal will run the `nmap` program with the specified parameters and begin
    scanning the specified IP address for open ports.


    ## Packet Capture


    Traffic through the network is sent as little pieces of data called packets. Each
    packet contains various bits, such as where it is coming from, where it is going,
    and whatever information is being sent. An unsecure network might be sending important
    information as plain, unencrypted text. Data sent this way is open for interception,
    and that is done through packet capture. Kali Linux has a built in application
    that does this- `Wireshark`. `Wireshark` is also available on Windows, for those
    that haven’t seen the benefits of Kali. Packet capture is done by starting the
    application, changing your network card’s mode to “promiscuous”, and starting
    the packet capture.


    Knowledgeable hackers can then view the packets that are captured and study them
    for information. Plain text will be visible if it is being sent that way, but
    encrypted text will be obscured.


    ## SQL injection


    SQL is a programming language mostly used on web servers; an example of typical
    code is below. SQL injections exploit poor coding on a website’s login script
    through a clever “injection” of hacker-written code. This is a difficult process
    to explain, but it can be viewed through YouTube videos and website demos ([http://www.codebashing.com/sql_demo](http://www.codebashing.com/sql_demo)).


    ![http://i.stack.imgur.com/tHnZs.png](images/00012.jpeg)


    ## Destroying a Linux-based System


    Linux-based operating systems are generally more secure than their Windows counterparts,
    but the design philosophy behind UNIX-like kernels is that superusers (administrators)
    have total control with no questions asked. Windows administrators generally have
    full control as well, but the operating system prevents the user from accidentally
    damaging their system! One very malicious attack involves exploiting the superuser’s
    permissions to delete the entire Linux operating system.


    While experimenting with the terminal in Kali Linux, you might have noticed that
    some commands require `sudo` as a preface. `sudo` invokes superuser permissions
    and allows system-changing commands to run after the root password is input. Since
    the Linux kernel gives full controls to superusers, entering the following command
    will completely delete the operating system even while it is running.


    ```

    sudo rm –rf /

    ```


    Under no circumstance should this command ever be run without permission. This
    command will break the operating system! Even when testing this command on yourself,
    be prepared to face the consequences. You cannot blame this guide if something
    goes wrong. The anatomy of the command is as follows:


    `sudo` invokes superuser and gives complete control, `rm` signifies remove, `-rf`
    tells `rm` to remove nested folders and files, and `/` starts the deletion process
    at the very first folder. Thusly the entire system is deleted. If the computer
    doesn’t immediately crash, it certainly will not boot after a shutdown.


    # Chapter 5: Building Skill and Protecting Oneself


    ## Programming


    Learning to code is what separates “script kiddies” from actual elite hackers.
    Any aspiring hacker should take the time and learn the basics of programming in
    a variety of languages. A good beginner language is the classic `C++`. Based on
    original `C`, `C++` is basic high-level programming language that is powerful
    and easy enough for first time learners. A variety of books exist on learning
    the language, and it is recommended for novices.


    Programming is essential skill because most exploits involve using programming
    code to alter or bypass a system. Viruses and other malware are written with code
    also, and competent hacker-coders can write awe-inspiring applications such as
    ransomware.


    ## Mastering Terminal and Command Prompt


    Ultimately the terminal is an application that can parse programming code one
    line at a time. Skillful hackers have mastered moving around the command prompt
    and terminal. As previously stated, typing `help` into command prompt provides
    a list of commands. In Linux’s `bash` terminal a user can type `man` (for manual)
    to learn about commands. Manual pages are long and extremely detailed.


    ## Routers and WEP

