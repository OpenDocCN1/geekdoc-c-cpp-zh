  trans: '

    了解 Wi-Fi 路由器/访问点使用的密码保护措施可能会帮助黑客破解密码。在 Wi-Fi 早期，`WEP` 被用于密码安全。`WEP` 是一种缺乏复杂性的算法，在
    2004 年被 `WPA` 取代。然而，许多路由器仍无意中或默认使用 `WEP`。这为黑客提供了一个通用的漏洞，因为 `WEP` 密钥可以在短时间内被破解。要在
    `Kali Linux` 上实现这一操作，黑客必须在位于 `WEP` 访问点范围内的带有无线功能的笔记本电脑上启动操作系统。然后，他们会打开终端并使用 `airmon-ng`
    应用。


    由于复杂性增加，破解 `WPA` 密钥需要花费更多时间，但 `WEP` 密钥是黑客练习其新兴技能的简单目标。


    # 作为黑客的自我保护


    学习本书中提到的技能的好奇黑客必须留心保护自己。任何严肃的渗透尝试都应该在个人已获得许可进行实验和渗透测试的网络上进行。根据读者所在州法律或联邦法律，在没有明确许可的情况下执行书中的演示，个人可能会面临各种警方行动；精明的黑客早已对此保持警惕。


    抛开这一切，对于渴望成为黑客的人来说，学习各种让自己不被识别的方法是有益的。此外，许多试图揭露其工作公司非法活动的黑客行动主义（吹哨者）正受到不断的监控。只有通过我们下面讨论的某些主题，这些人才能免受雇主施加的压迫性本质。通用安全不仅是一种良好的做法，安全还可以保护那些试图保护他人的人。对于黑客来说，安全保障可以防止“反黑”并保持领域的进步。


    # 密码安全


    普通电脑用户与安全专家之间最大的区别在于密码的复杂性。普通员工可能会使用 `fido82` 作为其身份验证密钥，而安全专家可能会使用更难猜的内容，如 `Fsdf3@3`。精明的黑客在对密码进行字典攻击时会利用这一事实。此外，某些密码和基础设施受保护极好，任何初学者都无法破解。随着技能的提高，黑客变得越来越明智。像智者一样的黑客似乎可以凭空产生新的漏洞，而且可以肯定，只要练习足够，任何人都能达到这一水平。


    通过自我反省，攻击者和黑客行动主义者必须符合安全专家所遵循的标准。强个人密码几乎可以保证黑客不会被“反黑”。正如我们在接下来的几节中读到的，大多数黑客受到迫害是因为他们的设备被没收，并很容易被反破解以揭露非法活动。复杂的密码能够抵御联邦政府强大的超级计算机。


    还建议永远不要将密码写下来或将其保存到某个文件中。最好的密码是随机的、记忆的且保密的。


    ## 密码泄露


    此外，安全专家很少重复密码。令人震惊的是，许多用户确实这样做——普通人在银行、社交媒体、论坛和在线购物时使用同一个密码！2015 年的 Ashley Madison
    泄露导致了电子邮件地址的公开；2013 年的 Tumblr 泄露导致密码在“暗网”（黑市互联网）上出售。由于用户很少更改密码，精明的黑客可以搜索这些数据库并定位用户信息。密码很可能保持不变，因此黑客轻而易举地获得了访问权限。密码泄露很常见，在互联网上也很容易，只需访问
    `https://haveibeenpwned.com/` 即可检查密码是否被泄露！结论是，这些泄露不会伤害经常更改密码并为每个账户保持不同密码的用户。


    ## 加密


    使用专业版/企业版的 Windows 用户默认可以使用加密功能。否则，想要加密文件的用户将不得不下载第三方应用程序，如 `TrueCrypt` (`http://www.truecrypt.org`)。对于希望保护任何数据的用户来说，加密是至关重要的。无论是糟糕的诗、商业秘密还是成功的黑客日志，如果你想保证绝对没有人能读取它，文件就需要被加密。因此，爱管的室友在没有你明确许可的情况下无法访问文件内容，执法人员在没收电脑时，遇到解密密码提示将步入死胡同。


    在 Windows 上，完成该过程是：右键点击文件，访问属性，点击“属性”部分中的高级属性按钮，然后勾选“加密内容以便保护数据”复选框。下方可见截图：


    ![](img/00013.jpeg)


    之前提供的关于密码的所有建议在选择解密密钥时都适用。记住，如果一个新手黑客都能破解加密，那么政府的集体智慧力量也可能破解密钥。


    # 历史


    尽管显而易见，但没有多少初学者意识到电脑历史会损害行动。对于外行来说，浏览器历史是一份存储在计算机上的访问过的网站日志。此列表通常没有加密，因此，包含近期搜索“如何黑客”的泄露列表在提交法庭时可能成为定罪证据。大多数电脑用户出于隐私原因会完全禁用浏览器历史，而且过程并不困难。例如，在
    `Firefox` 中，可以在“选项”的“隐私”标签下找到该选项。禁用历史是有用的，但可能需要清除之前的历史。再次，方法各异，但通常过程是访问最近查看的网站列表，并通过按钮或命令将其清除。


    历史并不总是仅存储在本地。某些 ISP（互联网服务提供商，为用户提供接入服务的组织）保留他们自己的互联网历史日志。警察传票将要求他们交出这些历史，这基本上使得删除互联网历史时所付出的努力无效。然而，有方法可以绕过这一事实，将在后续章节中详细说明。


    # 使用代理


    ISP 知道互联网历史的原因与黑客拦截数据包查看信息有关。普通的、未加密的网页流量在外观上是可以预测的，因此可以被捕获。互联网服务提供商有时出于习惯或法律保留这些信息，因此消除这种干扰的唯一方法是将数据包伪装成完全不同的东西。代理允许用户这样做。普通数据包将清晰标记源地址和目的地址，而通过代理发送的数据包不会显示初始发送者，只有中继数据包的代理机器。在
    ISP 端，看起来计算机正在与一个地址通信，而它们实际上在与另一个地址通信。当法院向 ISP 调取信息时，源（黑客）和最终目的地（目标）之间没有联系。


    代理可以通过浏览器（`hide.me`、`whoer.net`、`proxysite.com` 等）或作为第三方软件使用。代理最著名的用法是在校园网络中以规避内容过滤——如果你看起来在连接到完全不同的东西，没有人能阻止你的游戏网站。

    '
- fmt: '

    Proxies do have their downsides, though. Law agencies with enough power can retrieve
    records from a proxy server and match up “timestamps” of your connections to piece
    together your internet history. Using multiple proxies only delays the inevitable,
    because if detectives have one proxy server compromised then they can just keep
    tracing them from proxy to proxy until the origin address is reached.


    ## Using a VPN


    Earlier in the book VPNs were explained to “tunnel” data through a network. This
    service is usually used by employees to work from home, but hackers can exploit
    VPNs to work as an enhanced proxy of sorts. A typical VPN alters packets in such
    a way as to encrypt them and make them unreadable. The packets will not look like
    web activity, because they are sent through a different port entirely. This adds
    a layer of complexity to the packets that suits their use for security. For example,
    a public, open network is dangerous to check your bank statements on, because
    the packets can be readily intercepted and decoded by hackers. Using a VPN, though,
    hides the data and allows normal, unrestricted use that is not in danger of being
    decrypted.


    Competent hackers will use the proxy-like qualities of a VPN to hide their true
    location. Usually these servers are moderately more secure from government agencies
    as well due to the added obscurity and difficulty of determining origin points.
    Internet pirates are quite fond of virtual private networks because they can conceal
    the illegal data they download as regular, protected data.


    VPNs are usually created through 3rd party software. The program `VPN` allows
    anybody to connect to a VPN server, but they will most likely need a username
    and password. Organizations typically have private VPNs that act as relays only
    to company intranets, and these relays need company provided passwords. Individuals
    that wish to use a VPN might have to pay money for the ability to connect to a
    VPN server, but hackers agree VPNs are money well spent.


    ## Tor Project


    For hackers and security experts seeking the highest level of protection, the
    Tor Project (`http://torproject.org`) offers a solution. The company offers a
    piece of free software called `Tor`, which acts as a super-VPN/proxy. Tor bounces
    internet traffic across thousands of relays (each with substantial encryption)
    to ensure that the destination and origin of the packets are not clear. This software
    can be used by any individual wishing to hide their online activities, and it
    has proved decently effective.


    ## Browser Fingerprint


    Somewhat of an advanced topic, browser fingerprinting is an elaborate anti-hacking
    technique where specific unique information contained in your web browser (language
    packs, ad-ons, OS version, etc…) is retained by websites and used to identify
    users. Most hackers use unique configurations with adblocking plugins, IP obscuring
    software, and other defining characteristics. The irony of this is that the uniqueness
    gained from protecting oneself becomes an identifying factor through device fingerprinting.


    Basically, the best way to stay hidden on the internet is to “blend in” with the
    crowd, so a unique configuration cannot be traced back to a hacker. Since this
    is such an advanced and emerging topic, it is too early to say whether detectives
    and cyber investigators are catching criminals with this methodology. A browser
    fingerprint can be viewed through online testers, such as `https://amiunique.org`.


    ## Open Source vs. Proprietary


    Throughout this book some software has been referred to as “free”. The actual
    correct term for the software is `FOSS` (free and open source software). Programs
    that are `FOSS` are not only monetarily free, they are also transparent in their
    coding. Open-source refers to the fact that the coding of the program is visible
    at any time, whereas proprietary software’s code is not visible ever. This fact
    is important; if code is not visible, there is no way to know exactly what the
    program is doing or who it is sending data to. Proprietary software, such as Google’s
    web browser `Chrome`, unquestionably sends data back to Google. Contrasting starkly
    is Mozilla’s `FOSS` `Firefox` web browser. `Firefox` has transparent code, so
    at any time programmers can read through the source and know for certain whether
    `Firefox` sends data back.


    Hackers and security-minded people tend to gravitate towards `FOSS` because of
    its more safe nature. After all, nobody knows exactly what is going on under the
    hood of some dubious proprietary programs. There might exist backdoors for governments
    that would expose good-natured hackers or whistleblowers within closed-source
    software, so the best security is always done through well maintained free and
    open source software.


    ## Throwaways


    Whistleblowers and other high level leakers (see: Edward Snowden) require the
    utmost privacy with zero chance of linking an action to a person. Many professionals
    decide to do their private doings through throwaway devices.


    A throwaway is a computer that is only used for the private doings. It is usually
    bought with cash, has no mention of the buyer’s name, is never used to log into
    accounts associated with the buyer, and is used in a public place such as a coffee
    shop. If used correctly, there should not be a single shred of evidence pointing
    back to the buyer.


    It is important that throwaways be bought with cash because a bill of sale with
    a name on it is an undeniable link. It is for these reasons that hackers rarely,
    if ever, use credit cards for purchases. Cash is virtually untraceable, but security
    cameras can still pick out a face in a store. Buying used or from yard sales removes
    any monitoring capabilities an organization might have had.


    Signing into personal accounts leaves traces on the device, and using personal
    internet connections will lead back to the `IP` registered to you by the ISP.
    Coffee Shops, McDonalds, libraries, and internet cafes usually offer free internet
    without signing up—these places are the locations of choice for anonymity.


    ## Bitcoin


    If something must be bought online, `bitcoin` is an anonymous way to do so. `bitcoin`
    is a virtual currency that isn’t attached to a name. Criminals in the past have
    used `bitcoin` to purchase illegal substances on the “darknet”, which proves how
    anonymous `bitcoin` can be.


    ## Conclusion


    The demonstrations in this book are admittedly basic, for they were provided to
    stimulate an interest in security/hacking. Hackers must cultivate their skill
    through practice and studying. To gain skill, you must study networking basics,
    security concepts, programming languages, cryptography, and much more. Endurance
    and tenacity mold the brightest into outstanding hackers, so lifelong learning
    should be an aspiration for any hacker. Your journey continues with great hope
    and promise.


    Thank you again for downloading this book!


    I hope this book was able to help you understand some of the core concepts revolving
    around security, hacking, and counter-hacking. The scope of the subject is so
    large that this book could not ever hope to cover everything. Even though the
    time spent on various subjects in this book was brief, I encourage you to research
    them further.


    Remember that security and hacking are relevant today more than ever. This book
    encourages curious minds to inspire to adhere to the “hacker’s manifesto” and
    be guilty of no crime save curiosity. This book does not encourage illegal activity,
    it encourages exploration and entertainment.


    Finally, if you enjoyed this book, please take the time to share your thoughts
    and post a review on Amazon. It’d be greatly appreciated!


    Thank you and good luck!


    ## Hacking University: Sophomore Edition


    Essential Guide to Take Your Hacking Skills to the Next Level. Hacking Mobile
    Devices, Tablets, Game Consoles, and Apps. (Unlock your Android and iPhone devices)

