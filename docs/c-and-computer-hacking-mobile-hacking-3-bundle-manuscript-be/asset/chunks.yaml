    黑客喜欢通过改装硬件来增加设备赋予他们的自由度。例如，iPhone 只有一种布局、图标集、一组铃声，且自定义设置非常少。Android 手机具有相当的自定义功能，但某些设置是固定的且无法更改的。Root
    化（Rooting）提供了更多自定义选项，并允许应用与核心文件系统交互以实现独特的功能。人们通常通过 Root 和越狱（Jailbreak）来获取额外的应用和游戏。改装游戏机则允许它们运行完整的操作系统，甚至播放来自刻录光盘的备份游戏。下面我们将讨论几款流行设备改装的优点、缺点和功能。再次强调重要一点是：更改设备可能会导致保修失效。此外，改装有永久损坏硬件的小小风险（变砖）；这将导致设备无法使用。我们对任何损坏不承担责任，请在自担风险的情况下进行演示并谨慎操作。


    # 越狱 iOS


    由于苹果实施的有限自定义和严格的 App Store 准则，iPhone 可能是被“破解”频率最高的设备。尽管如此，有些群体喜欢 iPhone 在这方面的简单性，而精通技术的实验者更倾向于拥有完全控制权。如果有人越狱了他们的
    iPhone，他们就可以访问通常被锁定且无法更改的微小细节。突然，他们可以更改图标上的图片、一行显示多少个图标、动画、锁屏界面布局等。此外，越狱后的 iPhone
    不局限于“Apple Store”，还有其他免费的应用商店可以让越狱后的 iPhone 从中下载应用程序。这些新增和“被禁”应用带给你的功能范围绝对让越狱变得值得。


    不过也存在一些限制，因为苹果正试图通过修补 iOS 来震慑越狱。要查看你的 iDevice 是否可以越狱，你需要知道正在运行哪个版本的 iOS。在`Settings`设置设置应用中，点击`General`通用，然后点击`About`关于。注意版本号并检查
    `https://canijailbreak.com`，这是一个列出可越狱 iOS 版本的流行网站。每个版本的 iOS 都会有一个指向可以帮助越狱 iDevice
    工具的链接。


    “有线式”（Tethered）越狱是一种条件性越狱，需要你在电脑的帮助下启动 iDevice。如果在没有 PC 帮助的情况下启动有线越狱，可能会损坏你的手机；如果电池在出门时耗尽了，即使在充电后手机基本上也无法使用。这显然不是最佳解决方案，因此请考虑“有线式”越狱对你来说是否值得。不过，某些版本的
    iOS 可以实现“无线式”（untethered），这在几乎所有情况下都是理想的。


    在开始任何越狱之前，请备份你的手机数据，以防发生意外情况或你希望回到正常的、未越狱的手机。


    ## Pangu / Evasi0n


    1. 将你需要的应用程序下载到电脑上。

    2. 通过设置菜单禁用 iDevice 上的密码。

    3. 开启飞行模式。

    4. 关闭“查找我的 iPhone”。

    5. 使用 USB 数据线将你的 iDevice 连接到电脑。

    6. 在你正在使用的任何应用程序上点击`Start`按钮。

    7. 遵循屏幕上的任何提示。你需要遵循应用程序给出的任何指令，包括在桌面电脑或 iDevice 上操作。

    8. 你的 iDevice 将完成越狱。


    每个 iDevice 可能可以越狱也可能不可以，但通常只要它们没有运行最新的 iOS 更新，大多数 iPhone 和 iPad 都可以被利用。但尝试越狱一个明确无法无法的设备可能会导致设备完全变砖。


    越狱 iPhone 的好朋友是 `Cydia`，一个“被破解”的应用商店。`Cydia` 允许你添加仓库（repositories）并下载应用程序。仓库是一个包含应用程序和修改内容的下载存储。为了下载几个特定的应用，你必须将仓库添加到
    `Cydia` 中。每个版本的 `Cydia` 默认仓库可能略有不同，以下过程是你检查已安装仓库并添加新仓库的方法：


    1. 打开 `Cydia` 并导航到`Sources`标签页。

    2. 屏幕上的列表是所有已安装的源。

    3. 添加新源，点击`add`按钮。

    4. 输入源并将其添加到列表。


    仓库通常是 URL，你可以在很多地方找到。你可以在网上搜索“best Cydia repos”或只需找一个字母列表并搜索好的源。不过要小心添加过多的源，因为
    `Cydia` 会尝试定期连接每个服务器并获取应用列表，这会减慢应用程序的速度。一些最好的源包括：


    * BigBoss

    * ModMyI

    * iSpazio

    * Telesphoreo Tangelo

    * Ste

    * ZodTTD


    之前的源通常是默认的，但这里是你可能需要手动添加的一些：


    * iHacksRepo (`http://ihacksrepo.com`)

    * SiNful (`http://sinfuliphonerepo.com`)

    * iF0rce (`http://apt.if0rce.com`)

    * InsanelyiRepo (`http://repo.insanelyi.com`)

    * BiteYourApple (`http://repo.biteyourapple.net`)


    自定义 iOS 的图标和颜色可能是越狱后 iOS 最常用的功能。更改 iOS 部分内容的两个最佳应用是 `Winterboard` 和 `Anemone`。在
    `Cydia` 中搜索这两个应用并安装它们。现在你可以在仓库中搜索你想应用的主题。特别是 `Winterboard` 主题可以进行整个外观的改变，用新的颜色、内容和图标替换
    iOS 的每一个部分。如果只需要一套新图标，只需搜索图标包即可。


    改变 iOS 外观的应用具有美感，但它们经常会冲突并在操作系统中产生漏洞。某些主题和图标集可能会导致应用崩溃或导致手机偶尔重启。这是兼容性以及代码较差的新开发者带来的遗憾副作用，因此请根据自己的情况自行决定主题。


    `Cydia` 应用多到数不完，这里列出了几个流行的应用短列表以及你认为应该考虑下载它们的原因：


    * `iCaughtU` 在你的设备输入错误密码时拍摄快照。抓住偷窥者和小偷。

    * `iFile` 允许你实际上与 iDevice 上的文件进行交互。这是 Android 内置的功能，但在 iOS 中神秘地缺失。

    * `T/Zephyr` 是两个允许自定义多任务手势的应用。你可以让比如通过圆圈滑动来启动短信以节省时间。`T` 是最新的应用，但旧设备可能需要运行 `Zephyr`。

    * `Activator` 允许你通过三击 Home 键或按住音量等按钮启动应用或 iOS 功能。

    * `TetherMe` 在无需向运营商付费的情况下创建一个无线热点。


    应用的可能性是无限的。你可以花费几个小时在 `Cydia` 中搜索寻找你最喜欢的调优和修改。再次警告，安装过多可能会让 iOS 缓慢并导致崩溃，因此请少量安装。


    越狱的另一个益处来自于可以玩的游戏。虽然通过 `Cydia` 可以下载一些游戏“应用”，但对游戏玩家主要的吸引力无疑是模拟器。模拟器是模仿游戏主机的应用，以便它们的游戏可以在
    iOS 上运行，通常是免费的。运行模拟游戏的过程有些困难，但下面将解释主要步骤。请注意，步骤将根据模拟器、游戏和设备而异。


    1. 首先，我们需要下载一个模拟器。我们想玩索尼 Playstation 1 游戏，所以我们将从 `Cydia` 下载 `RetroArch`。


    '
- fmt: '

    2. The source may or may not be included on your specific device, so search for
    “RetroArch”. If it does not show, add the source `http://buildbot.libretro.com/repo/cydia`
    or possibly `http://www.libretro.com/cydia`, restart the app and search again.


    3. Download and install `RetroArch`.


    4. Launch the app, navigate to “Online Updater”, and update every entry starting
    from the bottom.


    5. When you get to “Core Updater”, update “Playstation (PCSX ReARMed) [Interpreter]”.
    `RetroArch` is downloading the actual emulator that you will use to play PS1 games
    here.


    6. Go back to the main menu, “Load Core”, then select the Playstation entry that
    we just downloaded.


    Now we need to obtain a ROM (game file). ROMs are digital backups of the games
    we play. There is nothing illegal about putting your PS1 game CD into your computer
    and making an `.iso` backup with a tool like `PowerISO` (`http://poweriso.com`)
    or `IMGBurn` (`http://www.imgburn.com`). Basically you install one of the aforementioned
    programs, launch it, insert your PS1 disc into the CD drive, and then create an
    `.iso` file with the program. Finally, with a PC program such as `iFunBox` (`http://www.i-funbox.com/`),
    you can transfer that `.iso` onto your iOS device.


    The above process is fairly confusing, and hackers usually want to emulate games
    they don’t already own. An astute hacker can download a ROM straight from the
    internet to their iOS device, but the legality of this action varies depending
    on country and state. We do not condone illegally downloading ROMs, but the process
    must be explained for educational purposes. Some websites such as `CoolROM` (`http://coolrom.com`),
    `romhustler` (`http://romhustler.com`), and `EmuParadise` (`http://emuparadise.me`)
    offer PS1 rom downloads for free, and a curious individual can search there for
    just about any ROM game they want. After downloading the file, another app such
    as `iFile` is needed to place the downloaded ROM in the correct folder. Install
    `iFile` from Cydia, navigate to where your browser downloads files (it varies
    based on browser, but try looking in `var/mobile/containers/data/application`
    to find your browser’s download path). Copy the file, then navigate to `/var/mobile/documents`
    and paste it there.


    Lastly after the long process restart `RetroArch`, tap “Load Content”, “Select
    File”, and then tap the game’s `.iso`. You will now be playing the game.


    iPhone emulation is difficult. There is no easy way to download ROMs and put them
    where they need to be. You must also be careful while searching for ROMs on the
    internet, because many websites exist solely to give out viruses to unsuspecting
    downloaders. Also, the emulators on iPhone are poor compared to Android, so the
    above process may not even work well for you. In this case, consider downloading
    another PS1 emulator from Cydia. `RetroArch` is capable of playing a few other
    systems too, just replace Playstation steps above with your console of choice.
    Ultimately, though, if your game crashes or fails to start there is not much you
    can do. Consider looking into PC emulation, as it is much easier to emulate old
    console games on Windows.


    Overall, jailbreaking iOS is a great hacking experience with many new options
    for iOS devices. Consider jailbreaking, but be wary of voiding warranties.


    # Rooting Android


    Rooting an Android phone involves mostly the same process as jailbreaking, however
    since Android OS runs on a plethora of different phones, tablets, and mini-computers,
    there is a lot of research involved in determining if your device is rootable.
    Generally, older devices have been out longer and are therefore usually rootable
    since developers and hackers have had the chance to exploit the technology more.
    It is extremely important that you figure out if your device is even rootable
    to begin with or there is a great chance of bricking it. One tool we will discuss
    for rooting is “Kingo Root”, and at the moment you can check the compatibility
    list (`http://www.kingoapp.com/android-root/devices.htm`) to see if your device
    is specifically mentioned.


    ### Why might you want to root your Android device? Just as with jailbreaking,
    rooting grants access to the intricacies of the operating system. Some apps in
    the Play store require rooted phones because parts of the app interact with locked
    settings in the OS. A few cell phone carriers also block access to features of
    Android, and hackers like to root their phones to have the freedom to use their
    device as it was intended. The default apps installed on Android devices take
    up too much room, and they often bog down a device; a rooted Android can remove
    default apps. Finally, many hackers are distraught with a Google-based operating
    system and the amount of data it collects on the user, so the tech-savvy rooter
    can “flash” a new operating system that is free from spyware and Google’s prying
    eyes.


    Once again, make a backup of your device and be prepared to follow directions
    exactly as to not brick it. Make doubly sure that you can root your specific device.
    We’re going to follow the steps for `KingoRoot` (`https://www.kingoapp.com/`),
    but follow your specific app’s procedure.


    1. Download `KingoRoot` for PC, install and run the application.

    2. Plug in your phone via USB cable

    3. Press the “Root Button”.

    4. Follow any on-screen or on-device prompts. Your phone may restart multiple
    times.


    After rooting, there are a few interesting things you can now do. Firstly, you
    can delete that obnoxious and space-hogging bloatware that comes preinstalled
    on Android. Second, you are now free to use whatever features of the device that
    you like. For example, newer Galaxy phones have Wi-Fi hotspot tethering built-in,
    but some carriers lock the feature behind a price that you must pay monthly. With
    a rooted Galaxy, you are free to download apps (`Barnacle Wi-Fi Tether` on Play
    Store) that do the tethering for you and without asking the carrier for permission.


    There is no “Cydia” equivalent for Android rooting, because you can download and
    install `.apk` files from anywhere. By just searching on the internet for Android
    `.apk` files, you can find whole websites (`https://apkpure.com/region-free-apk-download`)
    dedicated to providing apps for Android. The only change you need to make to your
    device to enable installation of `.apk` files is to enter the “settings” and tap
    the “security” tab. Check the box “allow installation of apps from sources other
    than the Play Store” and close settings. Now you can download any `.apk` and install
    it, most of which you might not need to be rooted for.


    Rooting provides apps with additional control over the operating system, any many
    apps that you may have tried to download form the Play Store claim that root is
    required in order for full functionality- those apps are usable now.


    Emulation on Android devices is somewhat easier due to removable SD cards. If
    you own an SD card reader, you can transfer `.iso` files easily with Windows.
    Emulating games is a great way to play older console titles, and here is the easiest
    way on Android OS.


    1. Download the `ePSXe` app. It may not be available in the Play Store, so search
    on the internet for an `.apk` file, then install it.

    2. You will also need PS1 BIOS files. You can rip them from your Playstation console
    yourself (`http://ngemu.com/threads/psx-bios-dumping-guide.93161/`(http://ngemu.com/threads/psx-bios-dumping-guide.93161/))
    or find them on the internet (`http://www.emuparadise.me/biosfiles/bios.html`(http://www.emuparadise.me/biosfiles/bios.html)).
    The legality of downloading BIOS is confusing, so make sure that it is legal to
    download BIOS instead of ripping them from your console.

