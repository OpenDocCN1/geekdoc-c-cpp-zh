- fmt: '

    A modchip is a piece of hardware with a clever use. In the original PlayStation
    1, a modchip can be installed that allows you to play burned discs. This means
    that a hacker can download a ROM of a game off of the internet, burn it to a CD,
    and then be able to play it on the original hardware without trouble and without
    configuring difficult emulators. Modchips work by injecting code into the console
    that fools it into thinking that the inserted disc has successfully passed disc
    copy protection. Thus a modchip needs to be soldered to the motherboard. On the
    PlayStation it is a fairly easy process.


    ### PS1 Modding Methods


    1. You will need a modchip corresponding to your PS1 model number. [http://www.mod-chip.net/8wire.htm](http://www.mod-chip.net/8wire.htm)
    contains the most popular modchip- make sure your `SCPH` matches the compatible
    models. (We will be using the 8 wire mod.)

    2. Disassemble the PS1, take out all the screws, remove the CD laser, remove everything
    and get the bare motherboard onto your soldering station. Take pictures of the
    deconstruction process to remind yourself how to put everything back together
    later.

    3. Choose the model number from this list [http://www.mod-chip.net/8wiremodels.htm](http://www.mod-chip.net/8wiremodels.htm)
    and correspond the number from the image to the modchip’s wire and solder accordingly.
    You will need a small tip and a steady hand to pull it off successfully.


    Modchips are a little scary though, luckily there is a way to play burned discs
    with soldering. The disc-swap method fools PS1s into verifying the copy protection
    on a different disc, and then the burned disc is quickly put into the console
    instead. Here is how it is done.


    1. Place a piece of tape over the sensor so discs can spin while the tray is open.
    While opening and closing the tray you can see the button that the lid pushes
    to tell the console it is closed. Tape it up so the console is always “closed”.

    2. Put a legitimate disc into the tray and start the console.

    3. The disc will spin fast, and then slow down to half speed. While it is halved,
    quickly swap the legitimate disc for the burned copy. The process is quick and
    must be done in less than a second.

    4. The burned disc will spin at full speed and then slow down to half to scan
    for copy protection. As soon as it slows, swap it back for the real PS1 disc.

    5. Watch the screen, and as soon as it goes black switch back again to the burned
    disc and close the tray. The fake disc will now play.


    Both of these methods are how mods were done for years, but a new product entered
    the market which simplifies PS1 hacking. The `PSIO` ([http://ps-io.com/](http://ps-io.com/))
    is a piece of hardware that allows the PS1 to read games from an `SD card`. For
    a fee the creator will install the handy device onto your PlayStation and simplify
    playing bootleg and backup games forevermore.


    ### PS2


    The PlayStation 2 remained a popular console for years after the last games were
    produced. Although there exist hardware mods and complicated procedures, the easiest
    way to hack the PS2 console is to buy a memory card. `FreeMCBoot` (`FMCB`) is
    a software exploit that hijacks the “fat” PS2 and allows custom software to execute
    through a softmod. You can simply buy a `FMCB` memory card online for 10 dollars,
    or you can create one yourself. You’ll need a fat PS2, a copy of `AR Max EVO`,
    a blank memory card, and a USB flash drive.


    1. Download a `FreeMCBoot` installer ([http://psx-scene.com/forums/attachments/f153/14901d1228234527-official-free-mc-boot-releases-free_mcbootv1.8.rar](http://psx-scene.com/forums/attachments/f153/14901d1228234527-official-free-mc-boot-releases-free_mcbootv1.8.rar))
    and put it on the flash drive.

    2. Start `AR MAX`, plug in the flash drive and memory card.

    3. Navigate to the media player and access “next item” to load `FREE_MCBOOT.ELF`
    on the flash drive. Press play.

    4. Follow the instructions and `FreeMCBoot` will install on the memory card.


    Now `FreeMCBoot` will have tons of great software preinstalled- all you have to
    do start the PS2 with the modded memory card inserted and `FreeMCBoot` will temporary
    softmod your console. Playing backup games is fairly easy as well.


    1. Have the `.iso` file of the game you want to play on the computer.

    2. Download the `ESR` disc patcher ([www.psx-scene.com/forums/showthread.php?t=58441](http://www.psx-scene.com/forums/showthread.php?t=58441)),
    run it and patch the `.iso`.

    3. Burn a blank DVD with the modified `.iso`. `ImgBurn` is a great program for
    this.

    4. Put the disc into the PS2, start the PS2, `FreeMCBoot` will load. Navigate
    to the `ESR` utility on the menu. Launch it and the game will start.


    ### PS3


    The Playstsation 3 started out with functionality that allowed operating systems
    such as `Linux` to be installed- turning a simple game console into a home computer.
    Hackers exploited “OtherOS” and “jailbroke” the PS3. A modded device is capable
    of playing backup/downloaded games and “homebrew” (indie) software. There are
    conditions that restrict the number of PS3 consoles that can be modded though.
    Only PS3s with a firmware version 3.55 and below can be modified; you can check
    this through “Settings”, “System”, and then “System Information”. If your PS3
    happens to be updated beyond this point there is not much that you can do to downgrade,
    and 3.55 PS3s are very expensive on eBay. We won’t explain the downgrade process,
    but do research on the `E3 Flasher` to bring your version number to 3.55.


    If your version number is below 3.55 the software must be updated to the correct
    version. DO NOT let the PS3 do this automatically, or it will update past 3.55
    and ruin our chances of modding. Instead you will need to download the 3.55 update
    ([http://www.mediafire.com/download/dp6uhz4d15m3dll/ofw+3.55.rar](http://www.mediafire.com/download/dp6uhz4d15m3dll/ofw+3.55.rar,
    but the link may change), create a folder on a blank flash drive called `PS3`.
    Inside that folder create an `UPDATE` folder. Extract the 3.55 update into the
    `UPDATE` folder and plug it into your PS3. Start PS3 recovery mode by holding
    down the power button until you hear 3 total beeps. Recovery mode will start,
    and you will need to plug in a controller to interact with the menu. Choose “update”,
    follow onscreen directions, and the PS3 will update from the USB drive. You’ve
    now upgraded to 3.55.


    To install custom firmware on your 3.55 PlayStation 3, follow the process below.


    1. Reformat your USB drive to `FAT32` to clear it off.

    2. Create a `PS3` folder on the drive, then an `UPDATE` file within it.

    3. Download and extract the `.rar` containing custom firmware (http://www.mediafire.com/download/qzpwvu3qyawep4/3.55+CFW+Kmeaw.rar,
    link may change) into the `UPDATE` folder.

    4. Put the update files onto the flash drive, boot into recovery mode, and install
    `PS3UPDAT.PUP`. You now have custom firmware.


    Playing games on a custom PS3 is a straightforward process using a tool called
    `MultiMAN`. The application runs on the custom firmware and allows backing up
    and playing games. First, obtain a copy of `MultiMAN` version 4.05 and up ([http://www.mediafire.com/download/16dbcwn51gtzu47/multiMAN_ver_04.78.02_STEALTH_%2820160328%29.zip](http://www.mediafire.com/download/16dbcwn51gtzu47/multiMAN_ver_04.78.02_STEALTH_%2820160328%29.zip,
    link may change), as these versions support the CFW that we installed. Extract
    it and put the files on a USB drive, plug it in and start the modded PS3. In the
    “Game” section, select “Install Packages Files”, then install the `MultiMAN` `pkg`
    file. The application will be installed.

