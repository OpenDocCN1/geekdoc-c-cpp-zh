    ### Namespace

    Namespaces are a fairly new addition to C++, only coming about in the 2011 update.
    They do not do much, other than describe which namespace to use. While they are
    not necessary, they save you a lot of confusion on functions of a program. It
    simply act as a way to organize your functions more systematically.


    ### Main

    Main- Here is where the main function begins. Using the line `// main()` instructs
    the program to start executing the main function of the program, and start the
    out put process. It is essential that you set up the main function command, otherwise
    your program will not know what it is supposed to be running, nor will it know
    when it is supposed to run. This will be seen as a single line comment inside
    the program and it is going to tell the program that the main function is beginning.


    ### INT main

    INT main- This is where the function execution officially begins. If you do not
    include this, the entire process will stop, because you did not introduce the
    variables, and without the variables, the program is lost.


    ### Cout

    Cout- This instructs the program to display the message that you want on the screen.
    If you do not put `cout`, chances are your program will may or may not fail. The
    problem is you don’t know if you succeed or not so if you want to make sure that
    everything runs smoothly, be sure to add cout.


    ### Return

    Return- This returns the value back to zero, and terminates the function. It instructs
    the program to end the process, and go back to the beginning.


