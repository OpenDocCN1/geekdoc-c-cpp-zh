- fmt: '

    One great feature of `MultiMAN` is making backups of discs right on the PS3. Rent
    a game or borrow one from a friend, start `MultiMAN`, put a disc in the system,
    and the application will show you the game. Access the options, and choose to
    “copy”. The game will be copied to the internal HDD and be playable through `MultiMAN`
    without the disc. If you have downloaded copies of games, then `MultiMAN` will
    also recognize them when they are plugged in via external hard drive, and you
    will be able to play them.


    Overall there are limitless possibilities on PlayStation 3 custom firmware, and
    this book can never hope to document them all. Be careful when flashing, and always
    triple check the procedures and research. `http://www.ps3hax.net/archive/index.php/t-18606.html
    contains a great guide for installing custom firmware and playing backup games;
    check the website before following through with installing CFW. There are a few
    other things to worry about, such as connecting to the internet on a CFW PS3.
    Sony servers collect information on internet connected PS3s, and they could have
    the ability to remotely disable a PS3 that they detect running CFW. All of that
    aside, enjoy the hacking process and congratulate yourself for attempting something
    particularly difficult and dangerous.


    # Xbox


    The original Xbox is a popular console to hack because of the easy method and
    multiple features gained from modification. You will need a flash drive, the `Xplorer360`
    program (`http://www.xbox-hq.com/html/article2895.html`), the hack files (`http://www.1337upload.net/files/SID.zip`,
    link may change- if it does search for XBOX softmod files), a [controller with
    a USB port](http://www.instructables.com/id/Original-XBox-Controller-Memory-Card-Slot-USB-Conv/),
    and a game that can exploit. `Splinter Cell` works with the above files. Here
    is the softmod guide.


    1. Start Xbox with USB drive plugged in. It will be formatted.

    2. Plug USB into PC, extract the downloaded softmod files, and open `Xplorer360`.

    3. Click “drive”, “open”, “hard drive or memory card”. `Partition 0` will be the
    USB.

    4. Drag the extracted softmod files into the 360 program and they will be put
    onto the USB.

    5. Plug the USB into the Xbox and move the files over onto the internal HDD.

    6. Start the game and load the save data (the softmod). Follow the onscreen prompts
    to hack the Xbox.


    With the softmodded Xbox you can do plenty of neat media center things, such as
    play video and audio, or even use emulators. Check online for all possibilities.


    # Xbox 360


    Xboxes with a dashboard before 7371 (kernel `2.0.7371.0`) are hackable, those
    with a later version must use the [“RGH” method.](http://www.instructables.com/id/How-to-hackRHG-your-Xbox-360/?ALLSTEPS).
    Exploited 360s can run backup games and homebrew applications. [The process (known
    as JTAG)](http://www.instructables.com/id/How-to-JTAG-your-Xbox-360-and-run-homebrew/?ALLSTEPS)
    is too difficult and varied to cover completely here, so we’ll only go over a
    brief overview. The motherboard that your 360 has determines which process to
    follow, so pay close attention.


    1. Assemble necessary parts (1 `DB-25` connector, 1 `DB-25` wire, a `1n4148` diode,
    3 330 ohm resistors (xenon motherboards)).

    2. Wire resistors to motherboard to create a custom cable to plug into computer.

    3. Plug `DB-25` connector into computer and dump the `nand` using software in
    the link.

    4. Test `CB` in `nand` to ensure specific model is exploitable.

    5. Select the correct file for flashing and flash the motherboard. Copy the `CPU
    key` after booting back up. Your 360 will be modded but thoroughly useless on
    its own. Use separate programs such as `X360GameHack` to play backup and downloaded
    games.


    [Here is a great video of the 360 hacking process](https://www.youtube.com/watch?v=5t0gX4V2CYQ).
    Be careful, because this 360 and the PS3 hack are very dangerous and could brick
    the consoles.


    # What to do with a Bricked Device


    Sometimes a modification fails. Even though a device may seem lost, they are not
    always totally bricked. Once you’ve given up on a device and are ready to throw
    it in the trash, consider the following options.


    * Try flashing again. Maybe the process will complete fully this time and make
    the device usable again.

    * If a jailbreak failed, boot into recovery mode and try restoring from a computer
    with `iTunes`.

    * Research the problem and exactly where it went wrong. Maybe other people have
    had the same situation and resolved it.

    * If the device is under warranty you can make a plausible excuse for why it isn’t
    working. (iPhone got overheated so now it doesn’t boot!)

    * Scrap the device for parts. Just because one part is broken doesn’t mean everything
    else is.

    * Sell it on eBay. People pay a decent amount of money for parts.


    Bricked devices are not useless, so never just throw one away without at least
    attempting to revive it.


    # PC Emulators


    If you don’t have a console or are too nervous to mod them, you could always use
    your PC to play console games. Emulators on PC are great for any hacker with a
    strong computer. Computers and their high powered graphics processing capabilities
    open up emulation of more modern systems, such as PlayStation 2, Dreamcast, or
    even something as new as the Xbox 360. Refer to the table below for a few of the
    best PC emulator programs that you can download.


    | Emulators for Windows 7, 8, and 10 |


    | Console | Recommended Emulator | Alternative |

    | :--- | :--- | :--- |

    | NES | Mednafen | FCEUX |

    | SNES | Higan/bsnes | ZSnes |

    | Arcade Games | MAME | N/A |

    | Gameboy | VisualBoy Advance M | NO$GBA |

    | DS | DeSmuME | NO$GBA |

    | Genesis/Game Gear/Sega CD | Fusion | Genesis Plus GX |

    | Saturn | SSF | Yabause |

    | N64 | Project64 | Mupen64Plus |

    | Gamecube/Wii | Dolphin | N/A |

    | PS1 | ePSXe | PCSX |

    | PS2 | PCSX2 | Play! |

    | PSP | PPSSPP | PSP1 |

    | PS3 | ESX | RPCS3 |

    | Xbox | XQEMU | Xeon |

    | Xbox 360 | Xenia | N/A |

    | Wii-U | CEMU | Decaf |


    Some of the above emulators might be depreciated or gone when you read this, but
    at the current date these are the best programs that you can download for Windows
    in terms of emulation. Certainly the more modern consoles, such as Xbox 360, require
    the equivalent of a supercomputer to run well; older consoles like the N64 are
    emulated perfectly on more basic hardware.


    # Conclusion


    The world of mobile hacking, jailbreaking, rooting, console modding, and emulation
    is a peculiar one. Customization and freedom are available to those that can achieve
    it, but hacking is always a dangerous task with serious consequences. Only warranties
    and contracts are at stake with personal hacking, but hacking others can catch
    the attention of authorities.


    Always remember to hack ethically, or at least stay hidden and protect yourself
    for more fiendish actions. Ultimately though, aren’t mobile carriers and console
    makers the despicable ones for locking away true ownership of the devices that
    we buy? Thank you for purchasing and reading this book. Be sure to leave feedback
    if you’d like to see more hacking guides.


    # Related Titles


    [Hacking University: Freshman Edition Essential Beginner''s Guide on How to Become
    an Amateur Hacker](https://www.amazon.com/Hacking-University-Essential-Beginner%E2%80%99s-Beginners-ebook/dp/B01J023VTU/keywords=hacking)


    [![](images/00015.jpeg)](https://www.amazon.com/Hacking-University-Essential-Beginner%E2%80%99s-Beginners-ebook/dp/B01J023VTU/keywords=hacking)


    [Hacking University: Sophomore Edition. Essential Guide to Take Your Hacking Skills
    to the Next Level. Hacking Mobile Devices, Tablets, Game Consoles, and Apps](https://www.amazon.com/Hacking-University-Sophomore-Essential-Consoles-ebook/dp/B01KVZ9KM2/keywords=hacking)

