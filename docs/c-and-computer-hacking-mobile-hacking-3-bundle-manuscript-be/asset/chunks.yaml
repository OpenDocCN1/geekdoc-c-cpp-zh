    每当用户输入的内容根据你设定的条件为真（true）时，你选定的语句就会显示。相反，如果用户输入了错误的答案会发生什么呢？如果他们对上面的问题回答为 `5`，那将是不正确的，系统会检测到该答案为假（false）。


    由于 `if` 语句非常基础，你会发现当用户输入错误答案时，它并不会做好任何准备。在这个阶段，如果他们在上面的示例中输入除 `4` 以外的任何数字，屏幕将变为空白，什么都不会发生。下一种语句将更深入，并向你展示如何根据用户输入系统的内容来获取答案。


    ## if else 语句


    现在正如我们上面稍微讨论的，在使用 `if` 语句时可能会出现一些局限性。如果用户输入了错误答案，屏幕就会变为空，这在系统操作中可能会很麻烦。此外，有时用户需要输入各种答案，例如当他们输入年龄而你想将这些区分开时。他们的年龄并不一定是错误的，但如果你只想筛选大于
    `21` 岁的人，你希望确保在这个过程中能正确显示答案。


    用于 `if else` 语句的良好语法包括：


    ```cpp

    if(boolean_expresion)

    {

    // 如果布尔表达式为真，则执行语句(s)

    }


    Else

    {

    // 如果布尔表达式为假，则执行语句(s)

    }

    ```


    你可以根据需要向你的语句中添加任意数量的此类结构。因此，如果你想让程序将人们分为五个不同的年龄组，你可以根据语法中更多的 `else` 来进行设置。这使得添加其他选项变得更加容易。


    所以让我们保持简单。假设系统中有 `2 + 2` 题目。如果人猜答案是 `4`，你可以在第一部分将其设置为真语句，然后屏幕上就会出现 `That’s Right!
    Good Job!`（正确！做得好！）的消息。但如果用户输入的答案是 `5`（或任何非 `4` 的答案），你可以让屏幕显示 `Sorry, that is
    not the right answer`（抱歉，答案不对）的消息。这在你在处理代码中想要执行的操作时提供了很大的自由。你能够向过程中添加一些不同的内容，并真正扩展你正在编写的代码。


    在处理这些内容时可以记住的另一点是，你可以在每个语句内部嵌套一些 `if` 语句和 `if else` 语句。对于初学者来说，这可能会有点复杂，但通过练习，你会发现这将为整个过程增加很多力量，并让你在这门编程语言中更容易实现你想做的某些事情。


    使用 `if` 语句和 `if else` 语句可以让你的编程体验变得好得多。它允许系统根据用户输入的内容来做决策，而不是由你亲自在场完成。务必尝试这些不同类型的语句，看看它们在你的代码以及你想要实现的功能中是如何工作的。


    ## 第 6 章：常量与各种字面量（Literals）


    这种语言是复杂的，尽管你上面所学的知识足够运行一些简单的函数，但这种语言还有许多部分，如果不在这里提供更深入的知识来帮助你过渡到下一个阶段，那将是一种缺憾。


    如果你想在这门语言上取得成功，就要准备好投入大量的时间苦学。虽然它对于初学者来说是一门很好的语言，因为它有多个难度的级别，但你必须通过努力才能进入下一个水平。你越尝试学习，新增加的效果就越困难。


    编程本身是一个漫长而艰的过程，但绝对值得的，因为有许多需要 `C++` 知识的职业你可以从事。从游戏设计到与机器人工作等等。只要涉及技术，很可能就会 `C++`。


    以下你可以学习的更多步骤，以及为了开始掌握这门语言需要了解的一些重要函数。


    ### 常量与字面量


    常量和字面量是学习 `C++` 必不可的一部分。它们指的是数据类型以及这些数据类型中的变量。它们是常量，不能更改。


    它们的作用与其他任何变量一样，不同之处它们是静态的，你无法改变它们。你使用的整数被称为字面整数（literal integers）。它们可以带有如 `U`
    或 `L` 之类的后缀，代表无符号（unsigned）和长型（long）。这些变量用于大写和小写，并可以很好地辅助你的进程。


    要理解整数字面量，请看以下示例：


    ```text

    032uu//非法：不能重复后缀

    078//非法：8 不被视为八进制位

    Ox_Fell//这个是合法的

    215//这个是合法的

    212//这个是合法的

    85//这是一个十进制

    30ul//这是一个无符号长型

    3ol//这个是长型

    3ou//这是一个无符号型

    3o//这是一个整型

    Ox4b//这是一个十六进制

    0213//这是一个八进制

    ```


    ### 浮点数字面量


    这些是代码中的部分，包含一个整数、一个小数点、小数部分和一个指数部分。它们可以通过指数形式或十进制形式显示。


    当你选择使用小数点来表示这些字面量时，你需要确保至少添加了小数，尽管加上指数也是好的。当你通过指数形式表示时，你应该包含小数部分、整数部分或两者兼有。你使用的带符号指数也应该以
    `E` 或 `e` 开头。


    你在编写代码时可以使用的一些浮点数字面量包括：


    ```text

    .e55//这些是非法的，因为缺少小数部分或整数部分

    21of://这些是非法的，因为它们没有指数或小数点

    51oE//这些是非法的，因为指数不完整

    314159E-5L//这些是合法的

    3.15159//这些是合法的

    ```


    ### 布尔字面量


    我们可以讨论的下一种字面量是布尔字面量。在你的 `C++` 代码中可以使用两种类型。基本上布尔值将显示为 `true`（真）或 `false`（假）。如果你设定的条件为真，布尔表达式将输出为
    `true`。相反，如果你设定的条件不满足，你将得到一个为假的条件。所有布尔形式的答案都将输出 `true` 或 `false`。


    ### 字符字面量


    当你在代码中看到字符字面量时，你会发现它们是用单引号括起来。它们可以是简单的，使用类似 `''x''` 的字符告诉命令，也可以长得多。这些是你能够添加到代码中的基础内容，并能使处理变得容易得多。


    ### 字符串字面量


    另一种你可以处理的字面量是字符串字面量。这些是用双引号括起来的。字符串将包含类似于字符字面量的字符，包括通用字符、转义序列和普通字符等选项。你可以以多种方式使用字符串字面量，包括将某一行拆分为两行，以及将内容分开以便于阅读。你可以使用的字符串示例包括：


    ```text

    "hello, Mother"

    "hello, \

    Mother"

    "hello, " "M" "other"

    ```

