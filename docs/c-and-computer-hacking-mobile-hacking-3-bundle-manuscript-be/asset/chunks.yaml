    also be referred to as programs, applications, and apps.


    Scripts


    A small piece of code that achieves a simple task can be called a script.  Usually
    not a full-fledged program or software because it is just too small.


    Operating Systems


    The large piece of software on a computer that is used as a framework for other
    smaller applications is called an operating system or OS.  Most computers run
    a variant of Microsoft operating systems, but some use Apple OSX or GNU+Linux-based
    operating systems.


    Linux


    Simply put, Linux is a kernel (kernel = underlying OS code) that facilitates complex
    operating systems.  While Windows uses the NT kernel as a core, operating systems
    such as Ubuntu and Debian use the Linux kernel as a core.  Linux operating systems
    are very different from the ones we are used to, because they do not run .exe
    files or have a familiar interface.  In fact, some Linux operating systems are
    purely text-based.  Linux, though, is very powerful to a hacker because it can
    run software that Windows cannot, and some of this software is designed with security
    and hacking specifically in mind. We will see in later chapters how Linux can
    be used to our advantage.


    Computer Viruses


    A broad term that usually encompasses a variety of threats.  It can mean virus,
    worm, Trojan, malware, or any other malicious piece of software.  Specifically,
    a virus in particular is a self-replicating harmful program.  Viruses copy themselves
    to other computers and continue to infect like the common cold.  Some viruses
    are meant to annoy the user, others are meant to destroy a system, and some even
    hide and cause unseen damage behind the scenes.  Strange computer activity or
    general slowness can sometimes be a virus.


    Worms


    Worms are malicious pieces of code that do not need a host computer.  Worms “crawl”
    through networks and have far reaching infections. 


    Trojans


    Named from the ancient “Trojan Horse”, Trojans are bad software that are disguised
    as helpful programs.  If you’ve ever got an infection from downloading a program
    on the internet, then you were hit by a Trojan.  Trojans are often bundled in
    software installations and copied alongside actually helpful programs. 


    Malware


    Malware is a general and generic term for mischievous programs, such as scripts,
    ransomware, and all those mentioned above.


    Ransomware


    Ransomware is a specific type of malware that cleverly encrypts user’s files and
    demands payment for the decryption password.  Highly effective, as large businesses
    that require their data be always available (hospitals, schools, etc…) usually
    have to pay the fee to continue business.


    Botnet


    Worms and other types of malware sometimes infect computers with a larger purpose. 
    Botnets are interconnected networks of infected computers that respond to a hacker’s
    bidding.  Infected “zombies” can be made to run as a group and pool resources
    for massive DDoS attacks that shut down corporate and government websites.  Some
    botnet groups use the massive combined computing power to brute-force passwords
    and decrypt data.  Being part of a malicious botnet is never beneficial.


    Proxy


    There exist helpful tools for hackers and individuals concerned with privacy. 
    Proxies are services that route your internet content to another place as to hide
    your true location.  For example, if you were to post online though a proxy located
    in Sweden, the post would look as though it was initially created in Sweden, rather
    than where you actually live.  Hackers use proxies to hide their true location
    should they ever be found out.  Security-concerned people use proxies to throw
    off obtrusive surveillance.


    VPN


    A Virtual Private Network is a service/program that “tunnels” internet traffic. 
    It works very much like a proxy, but can hide various other information in addition
    to encryption of the internet packets.  VPNs are typically used by business employees
    that work away from the office.  An employee can connect to their VPN and they
    will be tunneled through to the corporate server and can access data as if they
    were sitting in an office work chair.  VPNs can be used by hackers to hide location
    and data information, or to create a direct link to their target.  A VPN link
    to an office server will certainly give more privilege than an average internet
    connection would. 


    Penetration Testing


    Penetration testing, or pen testing, is the benevolent act of searching for vulnerabilities
    in security that a hacker might use to their advantage.  Security experts can
    do pen testing as a full time job and get paid by companies to discover exploits
    before the “bad guys” do.


    Vulnerability


    An exploit or problem within a program or network that can be used to gain extra
    access is referred to as a vulnerability.  An exploit in the popular Sony video
    game console Playstation 3 let hackers install pirated games for free instead
    of paying for them.  Finding an exploit or vulnerability is another large goal
    for hackers.


    Bug


    A glitch or problem within a program that produces unexpected results.  Bugs can
    sometimes be used to make an exploit, so hackers are always checking for bugs
    in program, and security experts are always trying to resolve bugs.


    Internet


    The internet is a network of connected computers that can communicate with each
    other.  Websites are available by communicating with web servers, and games can
    be played after connecting to a game server.  Ultimately every computer on the
    internet can be communicated with by every other computer depending on the computer’s
    security settings.


    Intranet


    By comparison, an INTRAnet is a local network consisting of only a few computers. 
    Companies might use intranets to share files securely and without putting them
    through the entire internet where they could be intercepted.  VPNs are usually
    used to connect to private intranets. 


    IP


    An IP (Internet Protocol) address is the numerical identifier given to a device
    on a network.  Every computer on the internet has a public IP, which is the IP
    that can geographically pinpoint a computer.  We use IP addresses to connect to
    websites, but instead of typing a number such as 192.168.1.0, we type the domain
    name (google.com) which uses a DNS server to translate into the numerical IP.


    You can learn your local/private IP address by typing ipconfig into a Windows
    command prompt.  Some websites, such as [http://whatismyipaddress.com/](http://whatismyipaddress.com/)
    can reveal your public IP address.


