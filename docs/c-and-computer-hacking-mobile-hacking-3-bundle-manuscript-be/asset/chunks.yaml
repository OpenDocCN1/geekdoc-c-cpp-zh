    ## C++


    * Works on many projects: most other programming languages are going to focus
    on just one or two little projects. For example, using `JavaScript` means that
    you are just going to be working on websites. But with `C++`, you are able to
    use it to help with a lot of different projects. Whether you are looking to work
    on a website, looking to create a new program, or do something else with programming,
    you will be able to do it with the help of `C++`.

    * Fast and reliable: if you have used some of the other coding languages that
    are popular in the past, you will find that sometimes they aren’t the most reliable.
    Information may slip through or they won’t start working the way that you would
    like. If you want something that works the first time and is reliable, then it
    is a good idea to go with `C++`.

    * Offers a lot of power: those who like to work in programming and want to have
    a lot of power in the work that they are doing will find that `C++` is the right
    option for them to choose. It has some of the best power for the programming languages
    that are out there.


    These are just a few of the benefit that you can enjoy when you are using the
    `C++` programming language. It may seem a bit more difficult to use than some
    of the others, such as `Python`, but it has a lot of the power that you need and
    can work well with other programming languages. With a bit of practice, you are
    going to get all the basics of this language down and really enjoy what you are
    able to do with this programming language.


    ## Chapter 2: Let''s Begin


    Let’s begin! There are a lot of places we can start, but let''s talk about environments
    first. While you do not really need to set up your own environment, as there are
    many online. An environment is a compiler of your choice that takes your code,
    and does all of the functions for you. In the old days, you would have to open
    your command prompts and create an environment to use, but those days are over.
    A simple mistake back in the day could do some serious damage to their computers.
    Now you can practice some risky prompts without any risk to your device whatsoever.


    There are many examples to try out and use on the internet. To try them out, the
    easiest place to go is `http://www.compileonline.com` Choose the “Learn C++” option
    down at the bottom, and it will take you to where you need to go.


    Here is an example to try. The output should be the words “Try This”.


    ```cpp

    #include <iostream>


    using namespace std;


    int main ()

    {


    cout << “Use This One!”;


    return 0;

    }

    ```


    Now you can choose to type these codes into the compiler directly, or you can
    write several, and save them to your computer, and access them whenever, so that
    you don''t have to retype them every time you want to mess with them. You can
    use several different types of text editors. However, some of them are device
    type specific. This means they only work on the type of device that you create
    them on.


    The text editors that you can use are `os edit`, `Brief`, `EMACS`, `epsilon`,
    `Windows Notepad`, `vlm` or `vl`. However, only `vlm` and `vl` are multi platform
    usable. Make sure to save the files with the extension `.c` or `.cpp`.


    You should start in a text editor to get the rough draft going on your program
    before you even think of moving to a compiler. This is because once you get to
    a compiler, it is a lot easier to mess up on your program, and not catch it. However,
    if you have it laid out in a nice, clean-cut fashion in a text editor, then you
    should have no problems with getting things going in the compiler.


    ### C++ Compilers


    There are many different compilers out there, and a lot of them are pretty expensive.
    Those compilers are for the elite programmers who have mastered the lower level
    compilers already. Beginners only need a basic compiler, and most of those are
    free. However, just like with anything that is free, you have to be careful of
    what you are getting. There are more bad cheap compliers than good ones out there
    so on the pretense of being free, I would suggest you paying additional functions
    past the start up page. These additional functions are usually very cheap anyways
    so you won’t have to break the bank to get them.


    One of the most popular compilers available is the `GNU C/C++ compiler`. It is
    used most commonly in `UNIX` and `Linux` installations. To see if you already
    have the compiler, pull up the command line in your `UNIX/Linux` application and
    type in the following:


    ```

    $ g++ -v

    ```


    If the compiler is installed, then you should see this message on the screen:


    ```

    Using built-in specs.

    Target: i386-redhat-linux

    Configured with: ../configure –prefix=/usr …...

    Thread model: posix

    gcc version 4.1.2 20080704 (Red Hat 4.1.2-46)

    ```


    If this message does not come up on your screen, the compiler either isn’t on
    the computer or you installed it incorrectly and you will need to go through and
    get it properly installed.


    In this book, we will go over how to install using the `Windows` platform. If
    you have a different platform, then you should go to `http://gcc.gnu.org/install/`
    and read the instructions on how to download it onto your platform.


    To install this compiler on your `Windows` computer, you will need to first install
    `MinGW`. This is the software that makes the compiler compatible with your computer,
    and it is very important that you have this software, otherwise you will not even
    be able to download the compiler at all.


    To install this software, you can go to the homepage of the software at `www.mingw.org`
    and allow it to direct you to where you need to go. `gcc`, `g++`, `MinGW`, `runtime`,
    `Command line`, `Windows`.


    ### Basic Syntax


    `C++` can be defined as not only the program, but objects that collectively communicate
    by invoking other methods. When you are working with `C++` you should know what
    four things mean all else.


    Class: This is a template or a blueprint that states the object and describes
    the behaviors of an object. This means that objects are sorted by their behaviors
    into classes.


    Object: Objects have behaviors and states. For example, if you look at a dog,
    it has states. These states could be classified as color, breed, name, standard
    of breed (AKC/AKA/APC registries). “Dogs” also show behaviors as well. They wag
    their tails, they bark, they pant, they eat dry kibble, and they go to the bathroom
    outside in the yard. These things make dogs a unique object. These objects are
    classified into groups know as, classes.


    Method: This is another term for behavior. There can be as many or as few you
    choose in your classes. This is where all of the data is manipulated, and actions
    are played out, along with the place that all of the logic is written. Methods
    are especially important because without them, your program would not know what
    it is supposed to do with the variable that you give it. It would just sit there
    like a dud and do nothing.


    Instant Variables: These refer to each individual object. Each object is classified
    with a unique set of these variables that act as a fingerprint for an object.
    These variables are assigned to the object by using values that occur whenever
    the object is created.


    ```cpp

    #include <iostream>


    using namespace std;


    // main() [this is when the program will begin to execute.]


    int main()

    {


    cout << “Try This”; // [Prints Try This]


    return 0;

    }

    ```

