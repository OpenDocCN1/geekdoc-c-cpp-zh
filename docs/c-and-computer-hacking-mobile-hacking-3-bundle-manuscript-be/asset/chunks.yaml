    ## 第 1 章：C++ 的基本背景、历史与成果


    在我们开始学习如何使用 `C++` 之前，你必须了解它是什么以及它是如何产生的。其原因很简单：要真正了解某件事，你必须掌握关于该主题可能学到的一切，尤其是当涉及到计算机编程这样具有技术性的内容时。


    `C++` 是计算机和互联网历史上非常重要的一部分。它简单地交织在我们今天所知的科技世界历史之中。此外，如果没有 `C++`，智能手机上的应用和其他功能将不复存在。


    当你学习 `C++` 时，你会对一种编程语言能对我们的日常生活产生如此巨大的影响而感到惊。几乎每一台制造出来的计算机都可以归因于可以追溯到 `C++` 语言的特定方面。学习这种语言的优点之一是可以轻松学习其他语言。学习
    `C++` 的能力将增强你对其他编程语言的理解，这就是为什么许多人将其视为编程的“教父”。此外，许多大公司仍然需要精通 `C++` 的程序员，因为他们依赖这种编程语言来运行其中央计算机系统。所以当遇到困难时，请记住从长远来看它对你有益，要保持强大并进入编程状态！


    ### C++ 的历史


    比雅恩·斯特鲁完（Bjarne Stroustrup）在写博士论文时，决定使用一种名为 Simula 的编程语言。这种语言是计算机时代最早的编程语言之一，但它非常慢而且充满了漏洞。


    斯特鲁完提出了“带类的 C 语言”（C with Classes）的想法。这是一种比 Simula 快得多的编程语言。“带类的 C 语言”后来变成了 `Cfront`，加速了语言创建的过程。然而，当
    `C++` 出现时，`Cfront` 被甩在了身后，因为它在语言中加入了编译器，使其比当时的任何其他项目语言都更容易、更快使用。


    从那时起，出现了许多注释参考指南和语言更新，使其变得更好、更快、甚至更容易使用。《C++ 傻规划》是该语言的一本流行指南。


    `C++` 是目前最流行的语言之一。这种语言对于许多行业都是最佳的，因此，与其花费大量时间开发新语言，不如将 `C++` 适应许多不同的变，因为它本质上是多功能的。


    ### 到底什么是 C++


    `C++` 不仅仅是任何编程语言，它是面向对象的。面向对象编程简称 `OOP` 是围绕对象而非动作的编程。这就像是一次观察整个画面，而不是每一个独立的拼图碎片。


    这种编程语言的设计考虑了灵活性和速度，因为当时的其他语言太慢了，只能做一件事，所以每当你创建一个新东西时，都需要一种新语言。


    你可以用这种语言做很多事情，尽管市面上的语言多得惊人，但它们今天仍然非常受欢迎。


    - **预包装脚本**：这些脚本爱好者和新黑客用来练习编程技巧的。由于现在有许多人想走捷径，预先准备好的脚本是大多数黑客寻找的，因此这些包需要改进，他们使用
    `C++` 实现了这一点。

    - **视频游戏**：面对现实吧，每个人在生活的某个阶段都玩过视频游戏。无论是长大还是你有孩子了，你都会陷入视频游戏的世界，并且永远无法逃。那些游戏可以归因于某种形式的
    `C++` 语言的使用。


    '
