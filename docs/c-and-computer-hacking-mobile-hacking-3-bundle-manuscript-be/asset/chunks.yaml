    \n# Introduction\n\nThank you for downloading the book “Hacking University: Sophomore\
    \ Edition”. If you are reading this, than either you have already completed “Hacking\
    \ University: Freshman Edition” or you believe that you already have the hacking\
    \ skills necessary to start at level 2. This eBook is the definitive guide for\
    \ building your hacking skill through a variety of exercises and studies.\n\n\
    As explained in the previous book, hacking is not a malicious activity. Hacking\
    \ is exploring the technology around us and having fun while doing so. This book’s\
    \ demonstrations will mainly focus on “unlocking” or “jailbreaking” a variety\
    \ of devices, which is in no way illegal. However, performing unintended servicing\
    \ or alterations of software and hardware may possibly void any warranties that\
    \ you have. Continue at your own risk, as we hold no fault for damage that you\
    \ cause. However, if you wish to gain real control over the phones and game consoles\
    \ that you own, continue reading to see how top hackers employ their trade.\n\n\
    # History of Mobile Hacking\n\nPhone hacking, also known as Phreaking, has a peculiar\
    \ history dating back to the 1950’s. Phreaking was discussed at length in the\
    \ 1st book, so it will only be briefly recalled here. After phone companies transitioned\
    \ from human operators to automatic switchboards, a dedicated group of experimental\
