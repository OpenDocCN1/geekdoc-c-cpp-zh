    The information herein is offered for informational purposes solely, and is universal
    as so. The presentation of the information is without contract or any type of
    guarantee assurance.


    The trademarks that are used are without any consent, and the publication of the
    trademark is without permission or backing by the trademark owner. All trademarks
    and brands within this book are for clarifying purposes only and are the owned
    by the owners themselves, not affiliated with this document.


    # Disclaimer


    All rights reserved. No part of this publication may be reproduced, distributed,
    or transmitted in any form or by any means, including photocopying, recording,
    or other electronic or mechanical methods, without the prior written permission
    of the publisher, except in the case of brief quotations embodied in critical
    reviews and certain other noncommercial uses permitted by copyright law.


    Table of Contents


    [Introduction](XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX)


    [History of Mobile Hacking](#part0000_split_033.html_History_of_mobile_hacking)


    [Security Flaws in Mobile Devices](#part0000_split_034.html_Security_Flaws_in_Mobile_devices)


    [Unlocking a Device from its Carrier](#part0000_split_035.html_Unlocking_a_device_from_its_carrier)


    [Securing your Devices](#part0000_split_036.html_Securing_your_devices)


    [Modding Jailbreaking and Rooting](#part0000_split_037.html_ModdingJailbreakingRooting)


    [Jailbreaking iOS](#part0000_split_038.html_JailbreakingIOS)


    [Rooting Android](#part0000_split_039.html_RootingAndroid)


    [Risks of Mobile Hacking and Modification](#part0000_split_040.html_RisksofMobileHackingandModifacion)


    [Modding Video Game Consoles](#part0000_split_041.html_ModdingVideoGameConsoles)


    [NES](#part0000_split_041.html_NES)


    [PlayStation](#part0000_split_041.html_Playstation)


    [PS2](#part0000_split_041.html_PS2)


    [PS3](#part0000_split_041.html_PS3)


    [Xbox](#part0000_split_041.html_Xbox)


    [Xbox 360](#part0000_split_041.html_Xbox360)


    [What to do with a Bricked Device](#part0000_split_042.html_WhattodowithaBrick)


    [PC Emulators](#part0000_split_043.html_PCEmulators)


    [Conclusion](#part0000_split_044.html_Conclusion2)


    Introduction


    Thank you for downloading the book “Hacking University: Sophomore Edition”.  If
    you are reading this, than either you have already completed “Hacking University:
    Freshman Edition” or you believe that you already have the hacking skills necessary
    to start at level 2.  This eBook is the definitive guide for building your hacking
    skill through a variety of exercises and studies.


    As explained in the previous book, hacking is not a malicious activity.  Hacking
    is exploring the technology around us and having fun while doing so.  This book’s
    demonstrations will mainly focus on “unlocking” or “jailbreaking” a variety of
    devices, which is in no way illegal.  However, performing unintended servicing
    or alterations of software and hardware may possibly void any warranties that
    you have.  Continue at your own risk, as we hold no fault for damage that you
    cause.  However, if you wish to gain real control over the phones and game consoles
    that you own, continue reading to see how top hackers employ their trade.


    History of Mobile Hacking


    Phone hacking, also known as Phreaking, has a peculiar history dating back to
    the 1950’s.  Phreaking was discussed at length in the 1st book, so it will only
    be briefly recalled here.  After phone companies transitioned from human operators
    to automatic switchboards, a dedicated group of experimental “phreakers” found
    the exact frequencies and tones that can “hack” the switchboards.  The act grew
    into a hobby and culture of individuals who could make long distance calls for
    free or eavesdrop on phone lines.  When landlines became more complicated and
    cell phones took over, phreaking died out to be replaced by computer hacking.


    The first cellphone hackers simply guessed the passwords for voicemail-boxes because
    the cell phone owners rarely ever changed their PIN from the default.  With a
    simple number such as “0000” or “1234” as a passcode, hackers can effortlessly
    gain access to the voicemail-box and can listen in on any message.


    Another technique, known as [“spoofing”,](http://www.spooftel.com/freecall/) allows
    an attacker to change the number that shows on the caller-ID.  By impersonating
    a different number, various attack strategies with social engineering possibilities
    are available.


    With the advent of flip-phones mobile devices became smaller and more efficient. 
    Although some dedicated hackers could flash new ROMs onto stolen phones or read
    text messages with complicated equipment, the early cell phones did not have too
    much sensitive data to steal.  It wasn’t until phones became more advanced and
    permanently tied to our online life that cell phone hacking became a lucrative
    field.


    With the early 2000’s Blackberry phones and the later 2000’s iPhones advancing
    cellular technology to be on par with personal computers, more of our information
    was accessible from within our pockets.  Security is often sacrificed for freedom
    and ease-of-use, so hackers were able to exploit the weak link of mobile technology
    fairly easily.


    How are hackers able to break into the mini-computers in our pockets?  Through
    mostly the same techniques that hackers use to break into regular desktop PCs-
    software vulnerabilities, bugs, social engineering, and password attacks. 


    Most mobile hacks are low-level stories of celebrities getting their private pictures
    stolen or risqué messages being leaked.  Typically these attacks and hacks come
    about because of the technological ineptitude of celebrities and their less-than-best
    security habits.  Every once in a while, though, the spotlight will shine upon
    big-name jobs, such as Hillary Clinton’s email server leaks, or Edward Snowden
    and his disclosure of classified government information.  Events like these show
    just how critical security is in all facets of digital life- and a person’s phone
    should never be the device that facilitates a hacking attack on them.'
