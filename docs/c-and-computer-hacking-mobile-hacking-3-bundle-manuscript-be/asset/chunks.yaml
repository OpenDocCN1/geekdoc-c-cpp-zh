    继续演示从 USB 闪盘启动包含操作系统，用户现在需要将 USB 驱动器设为在硬盘之前启动。每种主板制造商都会使用自己的自定义界面，因此此书无法解释每个主板型号的特定步骤。基本上，目标是找到“启动顺序”，即计算机检查可启动操作系统的顺序。在正常情况下，计算机会从内部硬盘启动，这很可能就是你现在阅读此内容时所使用的操作系统。我们需要确保计算机在检查内部设备之前先检查
    USB 驱动器是否有操作系统。在下面的图像中，首先检查硬盘，然后检查 CD-ROM 驱动器。第三是检查任何可移动设备，但这台特定的计算机可能在找到主操作系统并启动之前只检查到内部硬盘了。要启动
    USB 闪盘上的镜像，请将“可移动设备”（Removable Devices）移动到列表顶端。最后，确保 USB 已插入，保存 BIOS/UEFI 更改并重启。计算机应该开始加载
    Kali Linux。


    ![`f.tqn.com/y/pcsupport/1/S/f/c/-/-/boot-options-hard-drive-first.png`](img/00011.jpeg)


    启动过程中的任何问题都会给出错误信息，用户可以在互联网上搜索以进行故障排除，但更有可能计算机会成功进入 Kali Linux。用户现在可以使用一个全新的操作系统了！


    选择 Kali Linux 是因为它默认提供了许多工具。由于包含的软件，Kali 经常是黑客的首选操作系统。黑客和安全专业人员都选择 Kali，因此鼓励有志的人士对该操作系统进行实验。


    ## 使用其他操作系统窃取数据


    这里有一个有趣的点：通过可启动的 Kali USB 闪盘，你还可以加载你的主内部硬盘并查看其内容。这意味着你可以在不进入 Windows 的情况下访问磁盘上的文件。尝试打开你的内部硬盘并查看你的个人文件。有时，发现在不真正开启
    Windows 的情况下查看个人数据是如此简单，这是令人震惊的。诚然，访问受保护的数据存在一些限制，但这种技术可以用于从不属于黑客的计算机中恢复秘密信息。记住，如果计算机在物理上是可以访问的，黑客就拥有巨大的优势。他们始终可以加载自己喜的可启动操作系统，复制硬盘中的所有数据，并在从不登录
    Windows 的情况下离开。即使是受密码保护或加密的数据也容易被复制。由于攻击者拥有锁定数据的副本，他们可以花费无限的时间尝试破解密码。


    我们将在下方查看 Kali Linux 中存在的其他一些黑客工具。


    ## 端口扫描


    了解目标基础设施会使黑客攻击变得更容易。映射网络最好的方法之一是通过端口扫描。扫描端口可以揭示网络中的开放点。某些端口的开放可以为黑客提供独特的漏洞利用，因此黑客通常在决定切入点之前进行端口扫描。在
    Kali Linux 上，执行此操作的最佳工具是 `nmap`。通过将 Kali Linux 加载到连接网络的计算机上并运行终端（Linux 版本的命令提示符，通过
    `ctrl+alt+T` 打开），黑客可以输入此命令扫描计算机的开放端口：


    ```

    nmap -sV IPADDRESS -A –v

    ```


    终端将带有指定的参数运行 `nmap` 程序，并开始扫描指定 IP 地址的开放端口。


    ## 封包捕获


    通过网络的流量以称为“数据包”的小数据片段发送。每个数据包包含各种位信息，例如它来自哪里、去向哪里以及正在的任何信息。不安全的网络可能会以明文（未加密文本）发送重要信息。这样发送的数据很容易被截获，这是通过封包捕获实现的。Kali
    Linux 内置了一个可以实现此功能的应用程序——`Wireshark`。对于那些尚未看到 Kali 优势的人，Windows 上也有可用版本。封包捕获是通过启动应用程序、将网卡模式更改为“混杂模式”（promiscuous）并开始捕获数据包完成的。


    丰富的黑客可以查看捕获的数据包并研究它们获取信息。如果是以明文发送，明文将可见，但加密的文本将被掩盖。


    ## SQL 注入


    SQL 是一种主要用于 Web 服务器的编程语言；典型的代码示例所示。SQL 注入通过对黑客编写的代码进行精巧的“注入”，利用网站登录脚本中糟糕的编码来实施攻击。这是一个很难解释的过程，但可以通过
    YouTube 视频和网站演示查看（[`www.codebashing.com/sql_demo`](http://www.codebashing.com/sql_demo））。


    ![http://i.stack.imgur.com/tHnZs.png](img/00012.jpeg)


    ## 破坏 Linux 系统


    Linux 操作系统通常比其 Windows 对应品更安全，但类 Unix 内核背后的设计哲学是超级用户（管理员）拥有完全控制权且无需质问。Windows
    管理员通常也拥有完全控制权，但操作系统防止用户意外损坏系统！一种非常有恶意的攻击涉及利用超级用户的权限删除整个 Linux 操作系统。


    在 Kali Linux 中尝试终端时，你可能会注意到某些命令需要以 `sudo` 作为前缀。`sudo` 调用超级用户权限，并允许在输入 root 密码后运行更改系统的命令。由于
    Linux 内核赋予超级用户完全控制权，输入以下命令将即使在系统运行时也会完全删除操作系统。


    ```

    sudo rm –rf /

    ```


    在任何情况下，都不应在没有许可的情况下运行此命令。此命令将破坏操作系统！即使在对自己测试此命令，也要做好面对后果的准备。如果发生任何故障，你不能怪罪本指南。该命令的构造如下：


    `sudo` 调用超级用户并赋予完全控制权，`rm` 表示删除（remove），`-rf` 告诉 `rm` 删除嵌套文件夹和文件，而 `/` 从第一个文件夹开始删除过程。因此，整个系统被删除了。如果计算机没有立即崩溃，它在关机后也无法启动。


    # 第 5 章：建立技能与自我保护


    ## 编程


    学习编程是区分“脚本小子”与真正的精英黑客的标准。任何有志的黑客都应该花时间学习各种语言编程的基础。一种很好的初学者语言是经典的 `C++`。`C++` 基于原始的
    `C`，是一种基础高级编程语言，对于初学者来说既强大又简单。有很多关于学习这种语言的书，推荐新手阅读。


    编程是基本技能，因为大多数漏洞利用涉及使用编程代码来更改或绕过系统。病毒和其他恶意软件也是用代码编写的，合格黑客程序员可以编写出令人惊叹的应用程序，例如勒索软件。


    ## 精通终端和命令提示符


    终端是一个可以逐行解析编程代码的应用程序。技术黑客已经精通在命令提示符和终端中移动。如前所述，在命令提示符中输入 `help` 可以提供命令列表。在 Linux
    的 `bash` 终端中，用户可以输入 `man`（manual）来学习命令。手册页很且非常详细。


    ## 路由器和 WEP


    '
- fmt: '

    Understanding what password protection is used for a Wi-Fi router/access point
    could potentially help a hacker crack the password. In the early days of Wi-Fi,
    `WEP` was used for password security. `WEP` is an algorithm that lacked complexity
    and was replaced by `WPA` in 2004. However, many routers still use `WEP` by accident
    or default. This gives hackers a common exploit, because `WEP` keys are crackable
    in a short amount of time. To do this on `Kali Linux` a hacker must start the
    OS on a laptop with wireless within range of the `WEP` access point. Then, they
    would open a terminal and use the `airmon-ng` application.


    Cracking `WPA` keys is much more time consuming due to the increased complexity,
    but `WEP` keys are easy targets for hackers to practice their emerging skills.


    # Protecting Oneself as a Hacker


    Curious hackers that are learning skills mentioned in this book must take care
    to protect themselves. Any serious infiltration attempt should only be attempted
    on a network in which the individual has permission to experiment and penetration
    test. Depending on the state or federal laws of the reader, various police action
    could be taken against an individual without explicit permission to perform this
    book’s demonstrations; astute hackers would already be wary of this.


    All of this aside, it is beneficial for aspiring hackers to learn various methods
    to keep themselves safe from identification. Additionally, many hacktivists attempting
    to reveal the illegal activities of the company (whistleblowing) in which they
    work are monitored constantly. Only through some of the subjects we talk about
    below are these people safe from the oppressive nature that employers can inflict.
    General security is not only a decent practice, security can protect those trying
    to protect others. For hackers, security safeguards against “counter-hacks” and
    keeps the field advancing.


    # Password Security


    The largest difference between the average computer user and a security expert
    would be password complexity. While the average employee might use `fido82` for
    their authentication key, security experts might use something less guessable
    such as `Fsdf3@3`. Sharp hackers will take advantage of this fact when dictionary
    attacking passwords. Furthermore, some passwords and infrastructures will be too
    well-protected for any beginner to break. As skill increases, hackers become wiser.
    Sage-like hackers can produce new exploits seemingly out of thin-air, and it is
    assured that any person can achieve this level with enough practice.


    With self-introspection, attackers and hactivists alike must live up to the standards
    that security experts live by. A strong personal password will nearly guarantee
    that a hacker cannot be “counter-hacked”. As we will read in the next few sections,
    most hackers are persecuted because their devices are seized and easily counter-hacked
    to reveal nefarious activity. Complex passwords will stand up to the robust supercomputers
    of federal governments.


    It is also recommended to never write passwords down or save them to a file somewhere.
    The best passwords are random, memorized, and secret.


    ## Password Leaks


    Furthermore, security experts will rarely repeat passwords. Shockingly, plenty
    of users do just that- the average person uses the same password for banking,
    social media, forums, and online shopping! 2015’s Ashley Madison leak saw the
    online publication of email addresses; 2013’s Tumblr leak had passwords going
    up for sale on the “darknet” (black market internet). Since users rarely change
    passwords, savvy hackers can search these databases and locate user information.
    The passwords have most likely stayed the same, so the hacker has effortlessly
    gained access to an account. Password leaks are common and readily searchable
    on the internet too, just access `https://haveibeenpwned.com/` to check if a password
    is compromised! Conclusively, these leaks do not hurt users that change passwords
    regularly and keep them different for each account.


    ## Encryption


    Encryption is available to Windows users that are on a Professional/Enterprise
    version by default. Otherwise, a user wishing to encrypt files will have to download
    a 3rd party application such as `TrueCrypt` (`http://www.truecrypt.org`). Encryption
    is essential for users wishing to protect any kind of data. Whether it is bad
    poetry, trade secrets, or a log of successful hacks, the files need to be encrypted
    if you want to guarantee that absolutely nobody should be able to read it. Snoopy
    roommates will therefore not be able to access the contents of the file without
    your expressed permission, and law enforcement officials that seize a computer
    reach a dead end when greeted with the prompt for a decryption password.


    The process is done on Windows by right clicking a file, accessing the properties,
    clicking the advanced properties button in the “Attributes” section, then checking
    the “Encrypt contents to secure data” checkbox. A screenshot is visible below:


    ![](images/00013.jpeg)


    Every tip previously offered about passwords applies when choosing a decryption
    key. It is essential to remember that if a beginner hacker could break the encryption,
    then certainly the combined intelligence power of a government could crack the
    key as well.


    # History


    Although obvious, not many novices realize that computer history can compromise
    an operation. For the uninitiated, browser history is a log of visited websites
    that is stored on a computer. This list if often not encrypted, so a compromised
    list with “how to hack” on recent searches could be incriminating evidence when
    brought before a court. Most computer users disable browser history altogether
    for privacy reasons, and the process is not difficult. In `Firefox`, for example,
    the option is found under the “Privacy” tab of “Options”. Disabling history is
    useful, but clearing out previous history might be needed as well. Once again
    the methodology varies, but the general process is to access the list of recently
    viewed websites and clear it through a button or command.


    History is not always exclusively stored locally. Some ISPs (Internet Service
    Providers, the organizations that provide users with internet access) keep their
    own log of internet history. Police subpoenas would require them to hand over
    this history, which basically voids the care put into deleting internet history.
    There are ways around this fact however, which will be explicated in the following
    sections.


    # Using a Proxy


    The reason that ISPs know internet history is related to how hackers intercept
    packets to view information. Regular, unencrypted webpage traffic is predicable
    in how it looks and can therefore be captured. Internet service providers sometimes
    keep this information by habit or law, so the only way to remove this annoyance
    is to disguise the data packets as something else entirely. Proxies allow users
    to do this. Normal packets will have the source and destination address clearly
    marked, while a packet sent through a proxy will not show the initial sender,
    only the proxy machine that relayed the packets. On the ISP’s end, it seems as
    though the computer is communicating with one address while they are really communicating
    with another. When a court subpoenas the ISP for information, there is no link
    between the source (hacker) and the ultimate destination (target).


    Proxies can be used through a web browser (`hide.me`, `whoer.net`, `proxysite.com`,
    etc…) or as a 3rd party piece of software. Proxies are most famously used in college
    networks to evade content filtering- nobody can block your gaming websites if
    it looks like you are connecting to something else entirely.

    '
