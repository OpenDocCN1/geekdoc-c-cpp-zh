    ## 移动设备破解与修改的风险


    破解或侵入另一个移动设备在法律上与 PC 和服务器破解具有相同的法律模糊性——某些州和联邦政府认为破解是违法的，无论涉及的是手机还是电脑。


    尽管如此，请记住黑客宣言，黑客是仁慈的，因为他们只是好奇。一些人认为运营商和手机制造商限制对设备的访问是有罪的，因此黑客试图通过越狱和调制来纠正这种局面——让设备真正属于他们自己。


    个人可能永远不会因为对自己的设备进行简单修改而入狱。黑客只会通过越狱和 root 导致保修失效。变“砖”也是一种可能，但那是个人后果而非法律后果。


    然而，未经许可动他人的设备可能是危险且违法的，许多法院将此视为侵犯隐私。黑客必须始终使用在前书中列出的策略来保护自己（`VPN`、代理、隐藏身份、使用“一次性”设备、`TOR`
    等……）。


    总体而言，只要黑客遵守伦理并出于善意行事，实验所涉及的风险并不多。然而，大规模的犯罪不会不被注意到。而且，无论黑客能多巧妙地保护自己（正如圣地伯纳底事件所示），如果犯罪足够大，政府将分配大量资源来反对该黑客。谨慎破解，并始终保持伦理道德。


    ## 调制视频游戏主机


    视频游戏机自客厅娱乐之初就开始被调制（modded）。在 `NES` 时代，一些未经许可的公司通过将软件烧录到空卡带中并绕过复制保护来制作游戏。对于随后的主机机，调制也成了常态，许多读者可能还记得那些可以播放刻录光盘的
    PlayStation 故事，或者可以从 `SD` 卡读取游戏的 Wii 故事。如果读者从未有幸亲眼看到被破解和调过的控制机，我向他们保证，那是黑客知识和技巧的奇迹。几乎每个游戏主机都可以通过某种方式进行修改来改进其功能，本章将介绍一些流行的修改以及如何执行。作为参考，调制有两种类型——硬改（hardmods）和软改（softmods）。硬改是对主机机近乎不可逆的物理改变，例如涉及焊接调制芯片的修改。软改是对主机机软件的修改，例如
    `PS2` 的 `FreeMCBoot` 内存卡破解。


    大多数主机机破解需要额外的组件、焊接技巧或特定的软件。注意，手抖或漏掉指令可能会损坏非常昂贵的主机机，因此在尝试之前确保你可以无误地完成修改。如果看起来太复杂，也有网站和人员可以付费为你执行这些修改，所以请权衡你的选择并挑选你觉得最舒适的。


    ### NES


    虽然大多数人都是玩着 `NES` 长大的，但毫无疑问，这台主机在现代 LCD 和 LED 电视上玩起来非常困难。要么是新电视没有所需的接口，要么是由于过时的线缆和低效率图形芯片，画质看起来非常糟糕。幸运的是，存在一种调制可以让
    `NES` 通过 `HDMI` 输出视频和音频——这是一个巨大的提升，提高了旧主主机的图形质量。


    `https://www.game-tech.us/mods/original-nes/` 包含一个 120 美元的套件（包含安装也为 220 美元），可以焊接到正常的
    `NES` 上。


    `NES` 和其他旧主机的多数调制都是如此。必须购买并相应焊接子主板或额外组件以增加功能。通过调制复兴旧主机是许多黑客享受的乐趣爱好。


    ### PlayStation


