    Any time that the user puts in an input that ends up being true based on the conditions
    that you are setting out, you are going to get the statement to show up that you
    picked out. On the other hand, what is going to happen if your person puts in
    the wrong answer. If they put the answer as `5` to the question above, it is not
    going to be right and the system is going to see that the answer is false.


    Since the `if` statement is pretty basic, you are going to find that it is not
    going to be prepared if the person puts in the wrong answer. At this stage, if
    they put in any number other than `4` for the example above, the screen is just
    going to go blank and nothing is going to happen. The next type of statement will
    go more in depth and show you how to get answers based on what the person puts
    into the system.


    ## The if else statement


    Now as we discussed a bit above, there are some limitations that can come up when
    you are using the `if` statement. If the person puts in the wrong answer, the
    screen is just going to go blank and this can be a pain with the system. Plus,
    there are times when the user will need to put in a variety of answers, such as
    when they will put in their age and you want to separate those out. Their age
    is not necessarily wrong, but if you just want people who are older than `21`,
    you want to make sure that an answer comes up correctly along the way.


    A good syntax to use in order to work with the `if else` statements include:


    ```cpp

    if(boolean_expresion)

    {

    //statement(s) will execute if the boolean expression is true

    }


    Else

    {

    // statement(s) will execute if the boolean expression is false

    }

    ```


    You are able to add in as many of these into your statement as you would like.
    So if you would like to have a program that set apart people in five different
    age groups, you could set that up based on more of the `else` in your syntax.
    This makes it easier to add in some other choices.


    So let’s keep it simple. Let’s say that you have `2 + 2` on the system. If the
    person guesses that `4` is the answer, you can set that up in the first part to
    be the true statement and then the message `That’s Right! Good Job!` will come
    up on the screen. But if the user puts in the answer `5` (or any other answer
    than `4`), you can have a message like `Sorry, that is not the right answer` come
    up on the screen.


    This gives you a lot of freedom when it comes to taking care of what you want
    to do inside of your code. You are going to be able to add in some different things
    to the process and you can really expand the code that you are working on.


    Another thing that you can keep in mind when working on these, is that you are
    able to add some `if` statements and some `if else` statements inside of each
    other. This can get a bit complex as a beginner, but with some practice, you will
    find that it is going to add a lot of power to the whole process and can make
    it easier to do some of the things that you want within this coding language.


    Working with the `if` statements and the `if else` statements can make your coding
    experience so much better. It allows the system to make decisions based on what
    the user is putting into the system rather than having to be there and do it themselves.
    Make sure to try out a few of these different types of statements and see how
    they are going to work within your code and with what you want to do.


    ## Chapter 6: Constants and the various types of Literals


    This language is complex, and even though what you have learned above is enough
    to run some simple functions, there are so many more parts to this language that
    it would be a crime to not put more in depth knowledge in here to help you transition
    to the next step.


    If you want to be successful with this language, be prepared to spend long hours
    working hard on it. While it is a good language for beginners as it has multiple
    levels of difficulties, it is also something that you have to work hard at to
    make it to the next level. The added effects are more difficult the more you try
    to learn.


    Programming itself is a long and difficult process, but it is definitely worth
    it, as there are so many professions that you can go into that require the knowledge
    of `C++`. From game designing, to working with robots and more. If it involves
    technology, chances are it involves `C++`.


    So here are some more steps that you can learn, and some more important functions
    that you need to know to begin to master this language.


    ### Constants and Literals


    Constants and literals are an imperative part of learning `C++`. They refer to
    data types and variables in those data types. They are constant, and cannot be
    changed.


    They act just like any other variable, other than the fact that they are stagnant
    and you cannot change them. The integers that you use are known as literal integers.
    They can have a suffix such as `U` or `L`, and they stand for unassigned, and
    long. These variables are used as uppercase and lowercase and can help your processes
    along well.


    To understand the integer literals, look at some of these examples:


    ```text

    032uu//illegal: can’t repeat your suffix

    078//illegal: 8 isn’t considered an octal digit

    Ox_Fell//this one is legal

    215//this one is legal

    212//this one is legal

    85//this one is a decimal

    30ul//this one is an unsigned long

    3ol//this one is long

    3ou//this one is an unsigned int

    3o//tis one is an int

    Ox4b//this one is a hexadecimal

    0213//this one is an octal

    ```


    ### Floating Point Literals


    These are parts of the code that will contain an integer, a decimal point, a fractional
    part, and an exponent part. These can be shown either through the exponential
    form or the decimal form.


    When you choose to use the decimal point to represent these literals, you need
    to make sure that you are adding in at least the decimal, although adding in the
    exponent is good as well. When you are representing through the exponential form,
    you should include either the fractional part, the integer part, or both of them.
    The signed exponent that you are using should also be started with either `E`
    or `e`.


    Some of the floating point literals that you are able to use in your code writing
    include:


    ```text

    .e55//these are illegal because they are missing the fraction or the integer

    21of://these are illegal because they don’t have the exponent or the decimal

    51oE//these are illegal because they have an incomplete exponent

    314159E-5L//these are legal

    3.15159//these are legal

    ```


    ### Boolean Literals


    The next type of literal that we can discuss are the Boolean literals. There are
    two types that you will be able to use inside of your `C++` code. Basically the
    Boolean values are going to be shown as either `true` or `false`. If the conditions
    that you set out are true, the Boolean expression is going to come out as `true`.
    On the other hand, if the conditions that you set out are not met, you are going
    to end up with a condition that is false. All of the answers when they are Boolean
    will come out either `true` or `false`.


    ### Character Literals


    When you see a character literal in your code, you will notice that they are closed
    off with single quotes. These can be simple and use something like `''x''` to
    tell the command or they can be much longer in length as well. These are basic
    things that you are able to add into your code and can make things much easier
    to handle.


    ### String Literals


    Another type of literal that you are able to work with are the string literals.
    These are the ones that will be closed off using a double quote. The string is
    going to contain characters that are like the character literals, including options
    like universal, escape sequence, and plain characters. You can use the string
    literal in many ways including to break up one of your lines into two, and separating
    out things to make it easier to read. Some of the examples of the strings that
    you can use include:


    ```text

    "hello, Mother"

    "hello, \

    Mother"

    "hello, " "M" "other"

    ```

