- fmt: "\nCryptography is the study and practice of encryption and decryption. Encrypting\
    \ a file involves scrambling the data contents around through a variety of algorithms.\
    \ The more complex the algorithm, the harder the encryption is to reverse, or\
    \ decrypt. Important files are almost always encrypted so they cannot be read\
    \ without the password that begins the decryption. Encryption can be undone through\
    \ various other means, too, such as cryptoanalysis (intense evaluation and study\
    \ of data patterns that might lead to discovering the password) or attacks.\n\n\
    ## Passwords\nPasswords are a key phrases that authenticates a user to access\
    \ information not usually accessible to those not authorized. We use passwords\
    \ for just about everything in computers, and cracking passwords is a prize for\
    \ most hackers. Passwords can be compromised many different ways, but mostly through\
    \ database leaks, social engineering, or weak passwords.\n\n## Hardware\nThe physical\
    \ components of a computer that make them work. Here’s a small security tidbit:\
    \ the US government is sometimes worried that hardware coming from China is engineered\
    \ in such a way that would allow China to hack into US government computers.\n\
    \n## Software\nSoftware is any program of written code that performs a task. Software\
    \ examples range from word processors to web browsers to operating systems. Software\
    \ can also be referred to as programs, applications, and apps.\n\n## Scripts\n\
    A small piece of code that achieves a simple task can be called a script. Usually\
    \ not a full-fledged program or software because it is just too small.\n\n## Operating\
    \ Systems\nThe large piece of software on a computer that is used as a framework\
    \ for other smaller applications is called an operating system or OS. Most computers\
    \ run a variant of Microsoft operating systems, but some use Apple OSX or GNU+Linux-based\
    \ operating systems.\n\n### Linux\nSimply put, Linux is a `kernel` (`kernel =\
    \ underlying OS code`) that facilitates complex operating systems. While Windows\
    \ uses the `NT` kernel as a core, operating systems such as Ubuntu and Debian\
    \ use the `Linux` kernel as a core. Linux operating systems are very different\
    \ from the ones we are used to, because they do not run `.exe` files or have a\
    \ familiar interface. In fact, some Linux operating systems are purely text-based.\
    \ Linux, though, is very powerful to a hacker because it can run software that\
    \ Windows cannot, and some of this software is designed with security and hacking\
    \ specifically in mind. We will see in later chapters how Linux can be used to\
    \ our advantage.\n\n## Computer Viruses\nA broad term that usually encompasses\
    \ a variety of threats. It can mean virus, worm, Trojan, malware, or any other\
    \ malicious piece of software. Specifically, a virus in particular is a self-replicating\
    \ harmful program. Viruses copy themselves to other computers and continue to\
    \ infect like the common cold. Some viruses are meant to annoy the user, others\
    \ are meant to destroy a system, and some even hide and cause unseen damage behind\
    \ the scenes. Strange computer activity or general slowness can sometimes be a\
    \ virus.\n\n### Worms\nWorms are malicious pieces of code that do not need a host\
    \ computer. Worms “crawl” through networks and have far reaching infections.\n\
    \n### Trojans\nNamed from the ancient “Trojan Horse”, Trojans are bad software\
    \ that are disguised as helpful programs. If you’ve ever got an infection from\
    \ downloading a program on the internet, then you were hit by a Trojan. Trojans\
    \ are often bundled in software installations and copied alongside actually helpful\
    \ programs. \n\n### Malware\nMalware is a general and generic term for mischievous\
    \ programs, such as scripts, ransomware, and all those mentioned above.\n\n###\
    \ Ransomware\nRansomware is a specific type of malware that cleverly encrypts\
    \ user’s files and demands payment for the decryption password. Highly effective,\
    \ as large businesses that require their data be always available (hospitals,\
    \ schools, etc…) usually have to pay the fee to continue business.\n\n### Botnet\n\
    Worms and other types of malware sometimes infect computers with a larger purpose.\
    \ Botnets are interconnected networks of infected computers that respond to a\
    \ hacker’s bidding. Infected “zombies” can be made to run as a group and pool\
    \ resources for massive DDoS attacks that shut down corporate and government websites.\
    \ Some botnet groups use the massive combined computing power to brute-force passwords\
    \ and decrypt data. Being part of a malicious botnet is never beneficial.\n\n\
    ### Proxy\nThere exist helpful tools for hackers and individuals concerned with\
    \ privacy. Proxies are services that route your internet content to another place\
    \ as to hide your true location. For example, if you were to post online though\
    \ a proxy located in Sweden, the post would look as though it was initially created\
    \ in Sweden, rather than where you actually live. Hackers use proxies to hide\
    \ their true location should they ever be found out. Security-concerned people\
    \ use proxies to throw off obtrusive surveillance.\n\n### VPN\nA Virtual Private\
    \ Network is a service/program that “tunnels” internet traffic. It works very\
    \ much like a proxy, but can hide various other information in addition to encryption\
    \ of the internet packets. VPNs are typically used by business employees that\
    \ work away from the office. An employee can connect to their VPN and they will\
    \ be tunneled through the corporate server and can access data as if they were\
    \ sitting in an office work chair. VPNs can be used by hackers to hide location\
    \ and data information, or to create a direct link to their target. A VPN link\
    \ to an office server will certainly give more privilege than an average internet\
    \ connection would.\n\n## Penetration Testing\nPenetration testing, or pen testing,\
    \ is the benevolent act of searching for vulnerabilities in security that a hacker\
    \ might use to their advantage. Security experts can do pen testing as a full\
    \ time job and get paid by companies to discover exploits before the “bad guys”\
    \ do.\n\n### Vulnerability\nAn exploit or problem within a program or network\
    \ that can be used to gain extra access is referred to as a vulnerability. An\
    \ exploit in the popular Sony video game console Playstation 3 let hackers install\
    \ pirated games for free instead of paying for them. Finding an exploit or vulnerability\
    \ is another large goal for hackers.\n\n### Bug\nA glitch or problem within a\
    \ program that produces unexpected results. Bugs can sometimes be used to make\
    \ an exploit, so hackers are always checking for bugs in program, and security\
    \ experts are always trying to resolve bugs.\n\n## Internet\nThe internet is a\
    \ network of connected computers that can communicate with each other. Websites\
    \ are available by communicating with web servers, and games can be played after\
    \ connecting to a game server. Ultimately every computer on the internet can be\
    \ communicated with by every other computer depending on the computer’s security\
    \ settings.\n\n### Intranet\nBy comparison, an INTRAnet is a local network consisting\
    \ of only a few computers. Companies might use intranets to share files securely\
    \ and without putting them through the entire internet where they could be intercepted.\
    \ VPNs are usually used to connect to private intranets.\n\n### IP\nAn `IP` (Internet\
    \ Protocol) address is the numerical identifier given to a device on a network.\
    \ Every computer on the internet has a public `IP`, which is the `IP` that can\
    \ geographically pinpoint a computer. We use `IP` addresses to connect to websites,\
    \ but instead of typing a number such as `192.168.1.0`, we type the domain name\
    \ (`google.com`) which uses a DNS server to translate into the numerical `IP`.\n\
    \nYou can learn your local/private `IP` address by typing `ipconfig` into a Windows\
    \ command prompt. Some websites, such as `http://whatismyipaddress.com/` can reveal\
    \ your public `IP` address.\n\n![](images/00004.jpeg)\n"
