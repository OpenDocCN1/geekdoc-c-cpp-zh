    `MultiMAN` 的一个强大功能是直接在 PS3 上对光盘进行备份。租一个游戏或向朋友借一个游戏，启动 `MultiMAN`，在系统中插入光盘，应用程序就会显示该游戏。进入选项并选择“复制”。游戏将被复制到内部硬盘中，并且可以在不插光盘的情况下通过
    `MultiMAN` 运行。如果你下载了游戏副本，那么当你通过外部硬盘连接它们时，`MultiMAN` 也会识别它们，你就可以玩它们。


    总的来说，PlayStation 3 自定义固件拥有无限可能，这本书永远无法希望记录所有的可能性。在刷机时要小心，并且务必反复检查操作步骤和研究。`http://www.ps3hax.net/archive/index.php/t-18606.html`
    包含一个关于安装自定义固件和玩备份游戏的极佳指南；在执行安装 CFW 之前请查看该网站。还有其他需要担心的事情，例如在运行 CFW 的 PS3 上连接互联网。索尼服务器会收集连接互联网的
    PS3 的信息，它们可能有能力远程禁用检测到正在运行 CFW 的 PS3。抛开这一切不谈，享受破解过程，并祝贺自己尝试了这种特别困难且危险的事情。


    # Xbox


    原始 Xbox 是一款非常流行的破解主机，因为其方法简单，而且通过修改可以获得多种功能。你需要一个 U 盘、`Xplorer360` 程序（`http://www.xbox-hq.com/html/article2895.html`）、破解文件（`http://www.1337upload.net/files/SID.zip`，链接可能会变化——如果变化了，请搜索
    XBOX softmod 文件）、一个[带 USB 端口的控制器](http://www.instructables.com/id/Original-XBox-Controller-Memory-Card-Slot-USB-Conv/)以及一个可以利用漏洞的游戏。《Splinter
    Cell》 可以与上述文件配合使用。以下是软破解（softmod）指南。


    1. 在插好 U 盘的情况下启动 Xbox。它会被格式化。

    2. 将 U 盘插入电脑，解压下载的软破解文件，并打开 `Xplorer360`。

    3. 点击“drive（驱动器）”、“open（打开）”、“hard drive or memory card（硬盘或内存卡）”。`Partition 0`
    就是 U 盘。

    4. 将解压的软破解文件拖入 360 程序，它们将会被放入 U 盘中。

    5. 将 U 盘插入 Xbox 并文件移动到内部硬盘中。

    6. 启动游戏并加载存档（即软破解程序）。按照屏幕提示破解 Xbox。


    使用软破解后的 Xbox，你可以进行很多很酷的媒体中心操作，例如播放视频和音频，甚至使用模拟器。在网上查看所有可能的玩法。


    # Xbox 360


    仪表板版本在 7371（内核 `2.0.7371.0`）之前的 Xbox 是可以破解的，而更高版本的则必须使用[“RGH”方法。](http://www.instructables.com/id/How-to-hackRHG-your-Xbox-360/?ALLSTEPS)被利用漏洞的
    360 可以运行备份游戏和自制程序。[该过程（被称为 JTAG）](http://www.instructables.com/id/How-to-JTAG-your-Xbox-360-and-run-homebrew/?ALLSTEPS)过于复杂且多样，无法在这里完全涵盖，因此我们只进行简要概述。你的
    360 主板决定了要遵循哪种流程，所以请密切注意。


    1. 组装必要的零件（1 个 `DB-25` 接口、1 条 `DB-25` 线、1 个 `1n4148` 二极管、3 个 330 欧姆电阻（适用于 xenon
    主板）。

    2. 将电阻焊接到主板上，以创建一个插入电脑的定制线缆。

    3. 将 `DB-25` 接口插入电脑并使用链接中的软件转储 `nand`。

    4. 测试 `nand` 中的 `CB` 以确保特定型号可以被利用。

    5. 选择正确的文件进行刷机并刷写主板。重启后复制 `CPU key`。你的 360 将被破解，但单机本身将变得完全没用。使用独立的程序（如 `X360GameHack`）来玩备份和下载的游戏。


    [这里有一个关于 360 破解过程的精彩视频](https://www.youtube.com/watch?v=5t0gX4V2CYQ)。要小心，因为这种
    360 和 PS3 破解非常危险，可能会导致主机变砖。


    # 设备变砖了该怎么办


    有时修改会失败。尽管设备看起来可能丢失了，但它们并不总是完全变砖。当你放弃了一台设备并准备将其扔进垃圾桶时，请考虑以下选项。


    *   尝试重新刷机。也许这次过程会完全完成并让设备再次可用。

    *   如果越狱失败，进入恢复模式并尝试使用 `iTunes` 从电脑恢复。

    *   研究问题以及确切的错误发生之处。也许其他人也遇到过相同的情况并解决了它。

    *   如果设备在保期内，你可以为它不工作找一个合理的借口。（iPhone 过热了，所以现在无法启动了！）

    *   拆解设备当零件。仅仅一个部分坏了并不意味着其他所有部分都坏了。

    *   在 eBay 上卖掉。人们会为了零件支付不菲的钱。


    砖机并不是没用，所以在在至少尝试救活之前，永远不要直接把它扔掉。


    # PC 模拟器


    如果你没有主机或太紧张不敢去破解它们，你始终可以使用 PC 来玩主机游戏。PC 上的模拟器对于任何拥有强大电脑的黑客来说都是棒。电脑及其强大的图形处理能力开启了对更现代系统的模拟，例如
    PlayStation 2、Dreamcast，甚至是像 Xbox 360 这样新的系统。参考下表获取你可以下载的一些最佳 PC 模拟器程序。


    | 适用于 Windows 7、8 和 10 的模拟器 |


    | 主机 | 推荐模拟器 | 备选方案 |

    | :--- | :--- | :--- |

    | NES | Mednafen | FCEUX |

    | SNES | Higan/bsnes | ZSnes |

    | 街游戏 | MAME | 无 |

    | Gameboy | VisualBoy Advance M | NO$GBA |

    | DS | DeSmuME | NO$GBA |

    | Genesis/Game Gear/Sega CD | Fusion | Genesis Plus GX |

    | Saturn | SSF | Yabause |

    | N64 | Project64 | Mupen64Plus |

    | Gamecube/Wii | Dolphin | 无 |

    | PS1 | ePSXe | PCSX |

    | PS2 | PCSX2 | Play! |

    | PSP | PPSSPP | PSP1 |

    | PS3 | ESX | RPCS3 |

    | Xbox | XQEMU | Xeon |

    | Xbox 360 | Xenia | 无 |

    | Wii-U | CEMU | Decaf |


    上述某些模拟器在你阅读本文时可能过时或消失，但就目前而言，它们是你下载的最好的程序。无疑，更现代的主机（如 Xbox 360）需要超级计算机才能运行；而像
    N64 这样较旧的主机在基础硬件上就能完美模拟。


    # 结论


    移动破解、越狱、Root、主机修改和模拟的世界是一个奇妙的世界。那些实现这些的人可以获得定制化的自由，但破解始终是一项具有风险的任务。个人破解只涉及保修和合同，但破解他人可能会引起当局的注意。


    始终要记住以道德的方式破解，或者至少保护自己以防更险恶的行为。归结底，难道移动运营商和主机制造商锁定我们购买的设备的真实所有权才是卑劣的吗？感谢购买并阅读本书。如果你想看到更多破解指南，请务必留下反馈。


