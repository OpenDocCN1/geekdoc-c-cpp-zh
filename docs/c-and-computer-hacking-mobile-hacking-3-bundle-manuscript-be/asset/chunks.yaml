    你可能更愿意看这种：


    今天尝试这个


    今天我吃了披萨并做了数学题


    `6=(7-1)`


    这就是我今天学到的


    为了区分它们，你必须使用正确的函数，因为编程正是依赖于此——使用正确的函数。


    要创建换行，你必须使用函数 `endl`；这表示你想换行，而且如果你不想加空格，甚至不需要添加空格，尽管建议这样做，因为这能让你的程序更易于人类阅读。


    例如，像这个：


    ```cpp

    {

    cout << Try This;>> endl;

    <<Today I ate Pizza and did Math;>> endl;

    <<6=(7-1);>> endl;

    << That is what I learned today;>> endl;

    return 0

    }

    ```


    看起来比这个好得多：


    ```cpp

    {

    cout << Try This;>> endl; << Today I  ate Pizza and did Math;>> endl; <<6=(7-1);>>
    endl; << That is what I learned today;>> endl;

    return 0

    }

    ```


    你能看到这对于读代码的人来说会变得多么困惑吗？你希望你的代码文件易于阅读，这样如果其他人必须修复某些问题，他们就能轻松找到错误发生的地方。如果所有东西都混在一起，他们就无法很容易地找到任何东西，不是吗？


    你也可以使用 `\n` 来表示换行。这与 `endl;` 相同，但输入速度快得多。你可以使用任何想要的方法，但要选择一种并坚持下去。


    ## C++ 基础知识的重要性


    我知道你在想什么，为什么在刚开始时就必须知道这些毫无意义的碎片信息。原因在于，如果你现在不学习它们，你以后就不会认为自己需要它们；那么当你以后阅读别人写的程序时，你会疑惑所有这些额外字符是什么意思，以及为什么有这么多空格。养成这些简单但又有些枯燥任务的习惯，对于掌握更复杂的编程方法至关重要。就像精通任何语言一样，你必须掌握基础，才能掌握专家级概念。


    ## 变量定义


    变量定义指示编译器如何以及在何处存储创建变量。它指定了数据类型，并列出了一个或多个该类型的变量。例如


    `type variable_list;`


    你必须在上方列出一个有效的数据类型。它们可以包含一个或多个标识符，只要它们用逗号分隔即可，例如


    `int ---- j,k,l;`


    `char----c,ch;`


    `float---- f, salary;`


    `double--- d;`


    这些缩写每一个指示编译器创建具有相应名称的类型变量。变量可以赋予初始值，通过等号来指示这一点。例如


    ```cpp

    #include <iostream>


    using namespace std;


    int. main ()


    int j=10;

    int k=5;

    int l=j+k


    {

    cout <<l>> endl;

    return 0

    }

    ```


    你应该得到答案 15。


    你也可以在程序中声明并定义变量，但那是高级别的内容，如果你想了解，可以在 Google 上搜索这方面的教程。


    ## 测验


    这是设置。你应该有一个短语、一个数学题，然后使用上述整数给出该数学题的答案。你可以自己编写所有的变量，随你意愿。


    ```cpp

    #using <header>


    using namespace std;


    int main ()


    int _=_

    int _=_

    int _=_+_


    {

    cout < “”;> /n

    < “”;> /n

    cout  < “int_”;> /n

    return 0

    }

    ```


    简单地输入你的数字并确保你的数字相加正确。完成后后，在不依赖复制粘贴不带整数代码的情况下重新运行代码。通过这种方式，你对变量有了基础的理解，并在 C++ 中练习基础整数运算。


    ## 第 4 章：数组、循环和条件


    信不信由，你已经学习了这么多。基础知识其实并不难，现在只需要学习更多事情，并将一个接一个的概念结合起来，以确保你正在成为一名更好的 C++ 程序员。让我们继续吧。


    ### 数组


    数组是 C++ 中的一种数据结构，能够存储基本相同类型且大小固定的元素。基本上是相同类型变量的集合。与其使用单个变量，你将声明一个变量数组，例如数字。为了做到，你使用数字
    `0 到 99`并通过数组的索引来访问每一个。


    数组将是连续的内存位置。最低的总是第一个元素，然后最高的元素将是最后一个。


    ### 初始化数组


    你可以逐个初始化数组，也可以使用单个语句。例如


    `double balance [5]= {1000.0, 2.0, 3.4, 17.0, 50.0};`


    括号之间找到的不能高于你使用的元素数量。这意味着当你的数组标题只指定了五个时，你不能有六组数字。然而，如果你不指定大小，就会创建一个恰好合适的数组。你如下所示输入：


    `double balance [] {1000.0, 2.0, 3.4, 17.0, 50.0};`


    现在你知道了数组的大小，是时候将它放入程序了。这是给你的公式。


    ```cpp

    #include <iostream>


    using namespace std;


    #include <iomanip>


    using std::setw;


    int main ()


    {

    int n[10 ]; //初始化数组 n 为 0

    for ( int i=0; i <10; i++)

    {

    n[i] =i+100; //将位置 I 语句设置为 i+100

    }


    cout << element << setw(13) << value: //输出每个元素的值

    for (int j=0; j<10; j++)

    {

    cout << setw(7)<< j << setw(13) <<n[j] << endl;

    }


    return 0

    }

    ```


    当你想取一种代码并反复执行它时，就会使用类型。这些语句将一个接一个地执行。循环语句将让你更容易按照你所需的次数执行这些语句。


    ## 循环类型


    有四种循环。这些循环处理不同的需求。


    ### While 循环


    While 循环只要满足特定条件就会继续重复循环。它会在每次重启循环周期时测试此条件，并一直直到条件不再为真。


    写法如下：


    ```cpp

    while (condition)

    {

    statement(s);

    }

    ```


    ### For 循环


    此循环反复执行一个语句序列，同时缩短了管理循环变量的代码。


    写法如下：


    ```cpp

    for ( init; condition; increment)

    {

    statement(s);

    }

    ```


    ### Do.. while 循环


    Do…while 循环与 while 语句类似，但它在你到达语句末尾时测试条件，而不是在开始。


    写法如下：


    ```cpp

    do

    {

    statement(s);

    }while (condition);

    ```


    ### 嵌套循环


    嵌套循环将有一个循环在另一个循环内部运行，创建一个连续的循环。这一段时间后可能会变得困惑。


    写法如下：


    ```cpp

    while (condition)

    {

    while (condition)

    {

    statement(s)

    }

    statement(s) //你可以放置更多语句

    }

    ```'
