    Try This Today I ate Pizza and I did math. `6= (7-1)` that what I learned today.


    You would probably rather see this.


    Try This


    today I ate pizza and I did math


    `6=(7-1)`


    that is what I learned today


    To make the distinction, you have to have the right function, as that is what
    programming relies on, having the correct function.


    To create a line break, you have to use the function `endl`; this will indicate
    that you want a line break, and you do not even have to add whitespace if you
    do not want to, though it is recommended because it makes your program easier
    to read for a human.


    For example, this:


    ```cpp

    {

    cout << Try This;>> endl;

    <<Today I ate Pizza and did Math;>> endl;

    <<6=(7-1);>> endl;

    << That is what I learned today;>> endl;

    return 0

    }

    ```


    Looks way better than this:


    ```cpp

    {

    cout << Try This;>> endl; << Today I  ate Pizza and did Math;>> endl; <<6=(7-1);>>
    endl; << That is what I learned today;>> endl;

    return 0

    }

    ```


    Can you see how confusing that would get for someone reading the code? You want
    your code file to be easy to read, so that if someone else has to fix something,
    they can easily find where the mistake has been made. If everything is all jumbled
    together, then they would not be able to find anything very easily, now would
    they?


    You can also indicate line breaks by using `\n` This is the same thing as `endl;`
    but is a lot faster to type. You can use whichever method you want but choose
    one and stick with it.


    ## The importance of the basics of C++


    I know what you are thinking, why must you know all these nonsense tidbits of
    information when you are just beginning, and the reason is, if you don''t learn
    them now, you won''t think that you will need them in the future, and then when
    you are reading a program that someone else wrote, you will be wondering what
    all of those extra characters mean, and why there is so much whitespace. Creating
    a habit of these simple yet somewhat tedious tasks is paramount if mastering more
    complicated programming methods. Just like mastering any sort of language, you
    have to master the basics to master the expert level concepts.


    ## Variable definitions


    A variable definitions instructs the compiler how much and where to store and
    create the variable. It specifies the data type and lists one or more of the variables
    of the type. For example


    `type variable_list;`


    You have to have a valid data type that is listed above. They may contain one
    or more identifier names as long as they are separated by commas, such as


    `int ---- j,k,l;`


    `char----c,ch;`


    `float---- f, salary;`


    `double--- d;`


    Each of these abbreviations instructs the compiler to create variables of that
    type with those names. Variables can be assigned with an initial value, by indicating
    such with an equal sign. For example


    ```cpp

    #include <iostream>


    using namespace std;


    int. main ()


    int j=10;

    int k=5;

    int l=j+k


    {

    cout <<l>> endl;

    return 0

    }

    ```


    You should get the answer 15


    You can also declare and define the variables in your program, but that is some
    higher level stuff, so if you would like to look into it you can google search
    a tutorial on that.


    ## QUIZ


    Here is the set up. You should have one phrase, a math problem, and then the answer
    to the math problem using said integers. You can make up all of the variables
    yourself, whatever you want them to be.


    ```cpp

    #using <header>


    using namespace std;


    int main ()


    int _=_

    int _=_

    int _=_+_


    {

    cout < “”;> /n

    < “”;> /n

    cout  < “int_”;> /n

    return 0

    }

    ```


    Simply enter your digits in and make sure your numbers add up. After you’ve done
    so, rerun the code without relying on copying and pasting the code without the
    intergers. This way, you’ll have a basic understanding of variables and playing
    with the basic integers operations within C++.


    ## Chapter 4: Arrays, Loops, and Conditions


    Believe it or not, you’ve learned so much already. The basics are really not that
    hard and now it’s just about learning about a few more things and putting concept
    after concept together to make sure you’re becoming a better C++ programmer. Let’s
    keep going.


    ### Arrays


    Arrays are a data structure in C++ that will be able to store elements that are
    basically the same type and also a fixed size. Basically a collection of same
    type variables. Instead of using the individual variables, you would declare one
    array of variables such as numbers. To do this you use the numbers `0 to 99` and
    access each one by an index of the array.


    Arrays are going to be memory locations that are continuous. The lowest is always
    the first element and then the highest element is going to be the last.


    ### Initializing arrays


    You can initialize arrays one by one or using a single statement. Example


    `double balance [5]= {1000.0, 2.0, 3.4, 17.0, 50.0};`


    The numbers that are found between the bracket can’t end up higher than the amount
    of elements that you are using. This means that you cannot have six sets of numbers
    when your array title only specified five. However, if you do not specify the
    size, then an array of just the right size is created. You would type it as follows


    `double balance [] {1000.0, 2.0, 3.4, 17.0, 50.0};`


    Now that you know the array size it is time to move on to putting it into the
    program. Here is the formula for you.


    ```cpp

    #include <iostream>


    using namespace std;


    #include <iomanip>


    using std::setw;


    int main ()


    {

    int n[10 ]; //initialize array n to 0

    for ( int i=0; i <10; i++)

    {

    n[i] =i+100; // setement at location I to i+100

    }


    cout << element << setw(13) << value: //output each element''s value

    for (int j=0; j<10; j++)

    {

    cout << setw(7)<< j << setw(13) <<n[j] << endl;

    }


    return 0

    }

    ``` types are used any time that you would like to take one type of code and execute
    it over and over. These statements are going to be done one after the other. The
    loop statement will make it easier to execute these statements as many times as
    you like.


    ## Loop Types


    There are four types of loops. These loops handle different requirements.


    ### While loop


    The While loop is going to continue repeating the loop as long as a certain condition
    is met. It is going to test this condition each time it restarts the loop cycle
    and will do this until the condition is no longer true.


    Written like this


    ```cpp

    while (condition)

    {

    statement(s);

    }

    ```


    ### For Loop


    This loop executes a statement sequence over over again while abbreviating the
    code that manages the loop variables.


    Written like this


    ```cpp

    for ( init; condition; increment)

    {

    statement(s);

    }

    ```


    ### Do.. while loop


    The Do…while loop is going to be similar to the while statement, but it is going
    to test the condition when you reach the end of your statement, rather than the
    beginning.


    Written like this


    ```cpp

    do

    {

    statement(s);

    }while (condition);

    ```


    ### Nested loops


    The nested loop is going to have a loop that works inside of another loop, to
    create a continuous loop of loops. This one can get confusing after awhile.


    Written like this


    ```cpp

    while (condition)

    {

    while (condition)

    {

    statement(s)

    }

    statement(s) // you can put more statements

    }

    ```

