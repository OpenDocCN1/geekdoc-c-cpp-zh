    - **Web pages**: A lot of web pages are made using `C++`. The reason for this
    is because the language is so easy to manipulate, it makes for a quick and easy
    website that has plenty of interactive features for people. Some websites you
    may visit often that are created with `C++` are Amazon and Ebay. If you like designing
    web pages you should learn `C++` to be efficient and maybe even land a decent
    job in this field.

    - **Phone Apps**: Nowadays it seems everyone has a smart phone, and that means
    apps galore. There are thousands of apps out there, and more are being made every
    day. Some apps are free, some apps cost money, but a good chunk were made using
    `C++`. That is because this language is so scalable that it can be used for simple
    games and more intricate shopping apps.


    There are a lot of other minor things that `C++` is used for, such as VoIP calling.
    That was created using `C++`. The fact of the matter is, you will get told time
    and time again that `C++` is a dying language when in reality that is just a ruse
    that `JAVA` people uses to scare people into switching languages to ensure that
    `C++` is a dying language.


    ## Why It’s used


    `C++` is used not only for its flexibility and speed, but because it has a lot
    of components, it is fairly easy to learn, and if you master `C++`, you can master
    the other languages with ease. The reason for this is that when you learn something
    that is a little more complex than everything else first, the easier stuff will
    fall right into place, however, if you get used to easy to learn subjects, then
    you will find that the more difficult stuff is hard to learn because you are not
    used to putting in that much effort into the subject that you are trying to learn.


    If you want to learn a language that you can use for different types of functions
    within the realm of computer technology, then this is the language for you. You
    can do almost anything with it, and once you learn enough about it, you may be
    able to figure ways to manipulate the language to do things that it generally
    cannot do.


    `C++` is a very important language when it comes to computer programming, and
    though it has a lot of variables from the way that it is laid out, it is very
    easy to read, and very easy to create. This makes it one of the most desired programming
    languages that are out there, because no one wants to struggle to read code. No
    one wants to have to spend all of their time out there working on what they know
    is right just because they cannot find where they went wrong.


    ## Job Outlook


    Yes, there are a lot of jobs out there that still rely on `C++` to operate. There
    are so many different things that you could do, and all of them affect other people
    in the community. Video game designing, and web page designing are two of the
    most prominent things that are out there. You could also become a white hat or
    blue hat hacker.


    But according to payscale.com` (search software engineer), a person with `C++`
    Software engineer background can earn up to $57,000 to $120,000 based on experience.
    The median is around $80,363\. Some other titles that people with `C++` programming
    language have is Computer Programmer, Electrical Engineer, and Application Developer.


    However, to be the best that you can be, you should always know two or three programming
    languages to be marketable. Though those languages will not be included in this
    book, do not marry yourself to a single language. Instead, just like with human
    language, broaden your horizons and dabble in a few, but keep one as your main
    language.


    `C++` should be the main language that you fall back on due to its versatility.
    Maybe use `JAVA` or `Linux` as your other languages, but `C++` is the best main
    language to have, and you only want the best as your main.


    `C++` is a statically written lower level language which means that it is a clean
    cut expansive language.


    `C++` is a fully functional super set of `C` that supports object oriented programming.
    This means that it supports all the pillars of `OOP`, such as encapsulation, data
    hiding, inheritance and polymorphism.


    To learn more about object oriented programming, you can do a quick search online,
    and find out more about it. It is best to get some knowledge about what it is,
    but it is not quintessential to your knowledge of `C++`, so it will not really
    be included in this book, except for a few mentions in passing, and some tidbits
    of information here and there.


    ## Three Important Components of C++


    The standard `C++` is made up of three very important concepts.


    - **Core Language**: This is made up of all the variables, data types, literals,
