    6. 返回主菜单，选择“Load Core”（加载核心），然后选择我们刚刚下载的 Playstation 项目。


    现在我们需要获取一个 ROM（游戏文件）。ROM 是我们所玩游戏的数字备份。将你的 PS1 游戏光盘插入电脑并使用如 `PowerISO` (`http://poweriso.com`)
    或 `IMGBurn` (`http://www.imgburn.com`) 等工具制作 `.iso` 备份并不违法。基本上，你安装上述程序之一，启动它，将你的
    PS1 光盘插入 CD 驱动器，然后用程序创建一个 `.iso` 文件。最后，通过 PC 程序如 `iFunBox` (`http://www.i-funbox.com/`)，你可以将该
    `.iso` 传输到你的 iOS 设备。


    上述过程相当复杂，而且黑客通常想要模拟他们尚未拥有的游戏。聪明的黑客可以直接从互联网下载 ROM 到他们的 iOS 设备上，但此行为的合法性取决于国家和州。我们不赞许非法下载
    ROM，但出于教育目的，必须解释这一过程。诸如 `CoolROM` (`http://coolrom.com`)、`romhustler` (`http://romhustler.com`)
    和 `EmuParadise` (`http://emuparadise.me`) 等网站提供免费 PS1 rom 下载，好奇的个人可以在那里搜索几乎任何他们想要的
    ROM 游戏。下载文件后，需要另一个应用（如 `iFile`）将下载的 ROM 正确的文件夹中。从 Cydia 安装 `iFile`，导航到浏览器下载文件的地方（根据浏览器而异，但可以尝试查看
    `var/mobile/containers/data/application` 来找到浏览器的下载路径）。复制文件，然后导航到 `/var/mobile/documents`
    并将其粘贴到那里。


    最后，在漫长的结束后重启 `RetroArch`，点击“Load Content”（加载内容），“Select File”（选择文件），然后点击游戏的 `.iso`。你现在就可以玩游戏了。


    iPhone 模拟非常困难。没有简单的方法下载 ROM 并将其放在需要的地方。在互联网上搜索 ROM 时也必须小心，因为许多网站仅仅是为了向毫无防备的下载者发送病毒。此外，iPhone
    上的模拟器与 Android 相比很糟糕，因此上述过程对你来说可能并不适用。在这种情况下，考虑从 Cydia 下载另一个 PS1 模拟器。`RetroArch`
    也能运行其他几个系统，只需将上述 Playstation 的步骤替换为你选择的主机即可。但最终，如果你的游戏崩溃或无法启动，你也没什么能做。考虑研究 PC
    模拟，因为在 Windows 上模拟旧主机游戏要容易得多。


    总的来说，越狱 iOS 是一种很棒的客体验，为 iOS 设备提供了许多新选择。考虑越狱，但要注意这会导致保修失效。


    # Android Root 设备（Rooting Android）


    Android 手机的 Root 与越狱的过程大部分相同，但由于 Android 系统运行在许多不同的手机、平板电脑和微型电脑上，因此确定你的设备是否可以
    Root 需要涉及大量的研究。通常，旧设备上市时间较长，因此通常是可以 Root 的，因为开发者和黑客已经有机会进一步利用这项技术。确定你的设备最初是否可以
    Root 是极其关重要的，否则极有概率导致其变成“砖头”。我们将讨论的一种用于 Root 的工具是“Kingo Root”，目前你可以检查兼容性列表 (`http://www.kingoapp.com/android-root/devices.htm`)
    来查看你的设备是否被特别提及。


    ### 为什么你可能想 Root  Android 设备？与越狱一样，Root 允许访问操作系统的细节。Play 商店中的某些应用需要 Root 过的手机，因为应用的部分内容与操作系统中的锁定设置进行交互。一些手机运营商还阻止了对
    Android 功能的访问，黑客喜欢 Root 手机，以便自由地按照意图使用他们的设备。Android 设备上安装的默认应用占用了太多空间，而且通常会拖慢设备；Root
    过的 Android 可以删除默认应用。最后，许多黑客对基于 Google 的操作系统及其收集的用户数据量感到沮丧，因此精通技术的 Root 用户可以“刷入”一个新的没有间谍软件和
    Google 窥视的操作系统。


    再次提醒，对你的设备进行备份，并准备好完全按照指示操作以防变砖。务必确保你可以 Root 你的特定设备。我们将遵循 `KingoRoot` (`https://www.kingoapp.com/`)
    的步骤，但请遵循你特定应用的程序操作。


    1. 下载 PC 版 `KingoRoot`，安装并运行该程序。

    2. 通过 USB 线连接手机。

    3. 点击“Root Button”（Root 按钮）。

    4. 遵循屏幕或设备上的提示。你的手机可能会重启多次。


    Root 之后，你现在可以做一些有趣的事情。首先，你可以删除那些随设备自带的讨厌且占用空间的臃肿软件。其次，你现在自由可以使用你喜欢的设备功能。例如，较新的
    Galaxy 手机内置了 WiFi 热点，但某些运营商将其锁定在需要支付的月费之后。通过 Root 过的 Galaxy，你可以下载应用（Play 商店中的
    `Barnacle Tether`）来为你提供热点，而无需请求运营商。


    Android Root 没有等同于“Cydia”，因为你可以从任何地方下载并安装 `.apk` 文件。只需在互联网上搜索 Android `.apk` 文件，就能找到专门提供
    Android 应用的网站 (`https://apkpure.com/region-free-apk-download`)。为了启用安装 `.apk` 文件，你对设备进行的唯一更改是进入“设置”，点击“安全”。勾选“允许安装来自未知来源的应用”。现在你可以下载并安装任何
    `.apk`，其中大多数应用可能不需要 Root 即可。


