    始终连接的互联网让几乎每台计算机都变得脆弱。网络安全现在是每个政府、公司和个人的主要关注点。无论被用于“善意”还是“恶意”，黑客行为都是现代世界中不可或缺的存在。由于计算机无处不在并与典型功能交织在一起，专业安全岗位将持续需要黑客技术。然而，只有通过研究过去，我们才能了解现代黑客所处的这种独特状况。


    # 第 2 章：现代安全


    如今的 IT 专业人员通常不会在公司中担任“全才型”职位。虽然小企业可能仍雇佣一个对大多数技术领域都比较熟悉的人员，但联网的大型企业面临的巨大需求意味着必须有多位
    IT 专家同时在。低级帮助台人员向 IT 经理汇报，经理向管理员汇报，管理员再向 `CTO`（首席技术官）汇报。此外，有时还有更细的专业分工，安全员工与管理员协商并向
    `CIO`（首席信息官）或 `CSO`（首席安全官）汇报。总的来说，安全工作必须以全职、第三方外包或系统管理员的双重专长形式存在于公司中。每年，由于数据泄露、网络盗窃、DDOS
    攻击和勒索软件会导致大量的收入损失。黑客维持了对安全的持续需求，而反黑客则在拼命追赶以保护资产。


    安全专业人员的作用是尽其所能确认组织所有安全的完整性。以下是对安全专业人员保护免受威胁的各种研究领域的简单解释。其中一些“领域”也是 `CISSP`（注册信息系统安全专家）证书持有者的关键研究领域，该证书是安全熟练的证明。CISSP
    有时被认为是反黑客人员，因为他们利用自己的知识在问题发生之前阻止黑客攻击。


    ## 网络安全


    网络安全包括保护网络化服务器免受外部入侵。这意味着不能让任何好奇的人获得访问的切入点。通过网络发送的数据不应能被截获或读取，有时需要加密以确保受损的数据对黑客来说没有用处。


    ## 访问控制


    复杂的安全基础设施需要能够识别并验证授权人员。安全专业人员使用密码、生物识别和双因素身份验证等方法，确保计算机用户确实是他们所称的。黑客试图通过盗取密码或寻找漏洞来伪装成其他用户。


    ## 软件应用安全


    黑客迅速利用软件中隐藏的 Bug 和漏洞，这些漏洞可能会提升他们的权限并允许他们秘密数据。由于大多数公司和政府运行自己的内部专有软件，安全专业人员不能总是对软件进行完全测试。这是黑客利用的热门领域，因为
    Bug 和漏洞可能有很多。


    ## 灾难恢复


    有时黑客会成功。一个熟练的破坏者可以渗透远程服务器并造成巨大破坏或盗取大量信息；灾难恢复是安全专业人员应对的方式。通常，文档会对大多数常见灾难情况有特定的计划。自动识别系统可以告知何时发生了入侵或数据何时被盗取，最优秀的
    CISSP 可以关闭攻击，甚至追溯罪犯以揭露其真实身份。然而，灾难恢复并不总是对攻击的响应。自然灾害也是，而且没有比被淹水的机房更糟糕的。专业人员必须拥有灾难计划使业务恢复运行，否则业务可能会面临巨大的资金损失。


    ## 加密与密码学


    正如我们通过历史学到的，数据加密是保护最有价值信息的有效工具。然而，对于每种加密方法，都有黑客/破解者利用他们的才华来破解它。安全人员使用密码学来加密敏感文件，而黑客则破解这些加密。干练的黑客可以通过强大的计算机（可以进行快速数学计算）或寻找加密算法中的缺陷来破解弱加密。


    ## 风险管理


    值得吗？计算机基础设施的每一次增加都伴随着风险。网络化打印机对业务非常有帮助，但黑客以通过利用打印机软件中的漏洞进入网络而闻名。当进行任何更改时，IT 必须权衡风险与收益，以得出更改是否是一个安全主意。毕竟，增加那个带
    Wi-Fi 的咖啡壶可能会给黑客提供他们所需的入口。


    ## 物理安全


    赛博朋克小说（一种关于黑客的文学分支）中的常见主题涉及晚上进入建筑并从内部破坏网络。这是一个真实的威胁，因为任何拥有计算机物理访问权限的人在攻击方面都有显著优势。物理安全涉及限制对建筑某些部分的身体接触或锁门，以防黑客有机会溜进去并带走
    `HDD`。


    ## 运营


    许多著名的攻击是由拥有过多权限的员工实施的。利用他们被授予的信息和访问权限，这些黑客实施了“内部鬼”行为并带走了目标。安全团队试图通过只给每个人完成工作所需的足够访问权限来防止这种情况。这说明，安全人员甚至不能信任他们的同事。


    这些并不是所有的 CISSP 领域，但它们是最著名的。有趣的是，这些领域洞察了安全 IT 在保护数据时采用的方法和哲学，以及黑客必须如何警惕 CISSP 的运作方式。


    然而，对黑客来说，关于现代安全最有用的知识是对业务如何运营的深入理解。了解大多数业务将数据存储在服务器上并通过 Windows 域验证身份是良好的第一步，但需要现实经验才能真正理解计算机基础设施是如何运作的。


    # 第 3 章：常用术


    攻击的一个重要方面涉及对大量计算概念的深入理解。在本章中，我们将广泛介绍几个重要的概念。


    ## 编程


    为计算机编写指令代码的被称为编程。原始的编程只使用二进制的 1 和 0。现在的编程是用高级编程语言完成的，这些语言非常接近英语，并混杂了特殊字符。程序必须经过编译，这意味着在运行之前要翻译成机器码。理解编程基础让黑客对他们试图利用的应用程序如何工作有深入的见解，这可能给他们带来优势。


    ## 算法


    算法是导致结果的重复任务。例如，乘法问题可以通过重复加数字的算法解决。`5 x 3` 等同于 `5 + 5 + 5`。算法是加密的基础——对数据进行重复扰乱以混淆它。


    ## 密码学


