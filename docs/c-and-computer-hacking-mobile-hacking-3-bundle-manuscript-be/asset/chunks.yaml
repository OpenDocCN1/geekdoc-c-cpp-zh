    \n# 目录\n\n- 引言\n- 手机破解的历史\n- 移动设备的安全漏洞\n- 从运营商处解锁设备\n- 保护你的设备\n- 修改、越狱与 Root 化\n\
    - iOS 越狱\n- Android Root 化\n- 手机破解与修改的风险\n- 破解视频游戏机\n    - NES\n    - PlayStation\n\
