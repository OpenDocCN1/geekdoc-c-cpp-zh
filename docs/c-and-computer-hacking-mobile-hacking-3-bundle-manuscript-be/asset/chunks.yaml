  raw: 'Hacking has a rich a varied history beginning far back in ancient times. 
    Cryptography and encryption (passwords) were used by Roman armies.  A commander
    would need to send orders across the battlefield and would do so by writing instructions
    on a piece of paper.  Foot-soldiers could run the papers back and forth and thus
    one side would gain an advantage with increased knowledge. 


    Undoubtedly the soldiers would sometimes be captured and the secret orders would
    fall into the wrong hands.  To combat this, commanders began obscuring the text
    by transforming and moving around the letters.  This process, known as encryption,
    succeeded in confusing enemy commanders until they were forced to attempt to break
    the encryption. Employing mathematical methods and clever tricks to un-obfuscate
    the orders, the enemy would sometimes be able to decode the text.  Therefore,
    ancient people were hacking long before computers were even conceived! 


    However, when most people imagine early hacking, they are usually drawn to the
    wildly interesting story of the Enigma Machine.  The Enigma machine was a device
    used famously in Nazi Germany during the 2nd World War to encrypt and decrypt
    war messages.  Much like the ancient Romans, the German messages were obfuscated
    and transformed before sending so that if the message might be intercepted, the
    opposition would be unable to read the highly secretive text.  Besides a brief
    moment in the 1930’s where the encryption method was discovered, the Enigma machine
    was very successful for much of its existence.  Polish cryptologists were the
    ones to initially break the code, but Germany countered later in the decade by
    improving on the design and making Enigma far more complicated.


    The rein of Enigma continued throughout the war.  An American professor by the
    name of Alan Turing used his studies and extensive knowledge of mathematics to
    provide key research that broke the Enigma code again in 1939.  As it usually
    is with encryption methods though, Enigma was improved again and made unbreakable
    until 1943 when Turing assisted the Navy and produced a faster decryption machine. 


    “Bombes”, as they were called, were the decryption machines the facilitated cracking
    the Enigma code.  Bombe machines used rotating drums and electrical signals to
    analyze the scrambled messages and output the correct configuration of dials and
    plugs that would result in a decoded text.  Bombes could almost be considered
    some of the earliest computers due to their mechanical and electrical complexity. 
    Despite the highly advanced technology put forth from both sides, Enigma’s final
    demise actually came about from the allied capture of the secret keys, or codes,
    used in the machine.  With the encryption method clear, Enigma became mostly useless
    baring another redesign.  A redesign couldn’t come soon enough, as the war soon
    ended.  The allied ability to decode Enigma messages definitely played a large
    part in their success.


    After World War II, an immense amount of research and calculations went into developing
    projectile missiles and nuclear weapons. The Cold War essentially facilitated
    the development of modern electrical computers because electronic devices could
    perform mathematics at a speedy pace.  Advanced devices such as Colossus, ENIAC,
    and EDSAC paved the way for faster electronics throughout the 1950s and 1960s.
    Supercomputers were used in universities and corporations around the world, and
    these early devices were susceptible to intrusion and hacking as well.  However,
    the most notable 20th century hacking movement was known as Phreaking, and it
    involved “hacking” through telephones.


    Phreaking began after phone companies switched from human operators to automated
    switches.  Automated switches determined where to route a phone call based on
    the tonal frequency generated by telephones when numbers were dialed.  The pitched
    beeps heard when pressing buttons on cell phones is reminiscent of this, as each
    button produces a differently pitched tone.  Tones in succession dialed numbers
    with automatic switches, and the phone user would have their call connected to
    the number dialed.


    Certain other tones translated to different actions, though- phreakers discovered
    that by imitating the special tones they could control the automated switches
    and get free long-distance phone calls across the world.  Phreaking then evolved
    into a culture of individuals who would explore and experiment with phone systems,
    often delving into illegal methods to have fun and evade fees.  Skilled phreakers
    could even eavesdrop on phone calls and manipulate phone company employees by
    impersonating technical staff.


    A few phreakers became famous within the community for discovering new techniques
    and furthering the phreaking study.  Joseph Engressia was the first to discover
    the tone needed to make long distance calls, and John “Captain Crunch” Draper
    found that a prize whistle within a cereal box produced that exact tone, and he
    gained his nickname from that finding.  Interviews of prominent phreakers inspired
    later generations- Steve Jobs himself liked to partake in the hobby. 


    Networked computers and the invention of BBS brought the culture to even more
    people, so the pastime grew tremendously.  No longer a small movement, the government
    took notice in 1990 when phreaking communities were targeted by the United States
    Secret Service through Operation Sundevil. The operation saw a few phreaking groups
    shut down for illegal activity.  As time progressed, landlines became increasingly
    less popular having to compete with cell phones, so phreaking mostly died in the
    1990s. Mostly, phreaking culture sidestepped and got absorbed into hacking culture
    when personal computers became affordable to most families. 


    By the mid-1980s, corporations and government facilities were being hacked into
    regularly by hobbyists and “white-hat” professionals who report computer vulnerabilities. 
    Loyd Blankenship wrote the “Hacker Manifesto” on an online magazine viewed by
    hackers and phreakers in 1986; the document later became a key piece in the philosophy
    of hackers as it attributes them as curious individuals who are not guilty of
    crime.  Hacking continued to develop and in 1988 Robert Morris created a computer
    worm that crashed Cornell University’s computer system.  Although likely not malicious,
    this situation marked a division in computer hacking.  Some individuals continued
    to have fun as “white-hats” and others sought illegal personal gain as “black-hat”
    hackers.


    The most popular hacker group today is most definitely Anonymous.  The aptly-named
    group is essentially hidden and member-less because it performs “operations” that
    any person can join, usually by voluntarily joining a botnet and DDoSing (these
    terms will be discussed further in subsequent chapters).  Anonymous is most popular
    for their “raids” on Habbo Hotel, scientology, and Paypal.  While some actions
    the group take seem contradictory to past action or counter-intuitive, these facts
    make sense because Anonymous does not have a defined membership and actions are
    taken by individuals claiming to be part of the group- there are no core members. 
    Many news outlets label Anonymous as a terrorist group, and constant hacking operations
    keep the group in the public eye today. 


    Edward Snowden became a household name in 2013 when he leaked sensitive documents
    from the National Security Agency that revealed the US government’s domestic and
    worldwide surveillance programs.  Snowden is hailed as a hero by those that believe
    the surveillance was unwarranted, obtrusive, and an invasion of privacy.  Opponents
    of Snowden claim he is a terrorist who leaked private data of the government. 
    No matter which way the situation is viewed, it becomes clear that hacking and
    cybersecurity are grand-scale issues in the modern world.'
