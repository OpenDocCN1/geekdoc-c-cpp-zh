  trans: "\n\n在 iPhone 上，你可以按照以下步骤进行出厂重置：\n\n1. 关闭手机，通过 `iTunes` 将其连接到电脑，并将 iPhone\
    \ 进入恢复模式（同时按住电源键和主屏幕键，直到显示恢复模式）。\n2. 在 `iTunes` 中，点击弹出的“恢复”按钮以删除所有数据，并将手机归你个人所有。\n\
    \n每台 Android 设备进入恢复模式的按键组合都不同，因此请研究你的手机型号。我们将演示如何使用最常用的组合对 Android 手机进行出厂重置。\n\
    \n1. 关闭手机并将其启动恢复模式。同时按住电源键和音量减键是一种常用组合。\n2. 使用物理按钮（有时是音量加和减键）导航菜单。选择“出厂重置”并确认。\n\
    \n## 从运营商处解锁设备\n\n手机和其他移动设备通常被“锁定”在特定的运营商，这意味着设备无法使用任何其他公司的蜂窝网络。锁定的手机实际上被运营商“质质”——除非你完成解锁流程。运营商可以帮助你完成这一过程，但你通常需要一个合理的理由来解锁设备（例如前往没有覆盖的地区、军事部署、合同已到且你正在切换运营商）。被盗的设备无法解锁。你在\
    \ `eBay` 上找到的最便宜的手机有时是盗品，如果运营商将该设备记录为丢失或被盗，他们可能会拒绝解锁。\n\n注意的是，手机运行在网络（`GSM` 和\
    \ `CDMA`）上，这些网络限制了手机可以运行的运营商数量——移动设备的网络无法完全更改，但运行相同网络上的运营商是可以更改的。\n\n大多数解锁要求手机已全额付清、账户状态良好，且你一年内的解锁次数不能过多。该过程涉及收集有关手机的所有信息（手机号、`IMEI`、账户信息、账户持有者信息）、证明你拥有它，并通过电话或网络表单请求解锁。遗憾的是，某些运营商根本无法解锁。这里列出了最常用的移动运营商。\n\
    \n### 运营商解锁图表\n\n| 运营商 | 网络 | 替代运营商 | 解锁方法 | 备注 |\n| :--- | :--- | :--- | :---\
    \ | :--- |\n| ATT | GSM | T-Mobile, Straight Talk, Net10 | 拨打 `1-800-331-0500`\
    \ 或 [在线提交表单。](https://www.att.com/deviceunlock/?partner=LinkShare&siteId=TnL5HPStwNw-0w3siF60h.h45d7DZrjCbw#/)\
    \ | 无 |\n| Sprint (Virgin/Boost) | CMDA | Voyager, Sprint Prepaid | 拨打 `1-888-211-4727`\
    \ 或参与[在线聊天。](http://sprintworldwide.custhelp.com/app/chat/chat_launch/?ECID=vanity:swwsupport)\
    \ | 解锁 Sprint 手机极其困难，大多数设备根本无法解锁。 |\n| T-Mobile | GSM | ATT, Straight Talk, Net10\
    \ | 拨打 `1-877-746-0909` 或参与[在线聊天。](https://support.t-mobile.com/community/contact-us)\
    \ | 无 |\n| Verizon | CDMA | 较新的机型可以在 GSM 上运行，其他的可以切换到 PagePlus | 拨打 `1-800-711-8300`。\
    \ | 某些 Verizon 手机实际上并没有锁定。 |\n\n不同手机运行的网络实际上有所不同，因此你将进行一些研究以找出手机可以在哪些网络上运行。上述列出的网络是不同运营商设备上最常用的网络。解锁过程可能很困难，但也有专门的手机解锁商店可以为你完成该过程。\n\
    \n## 确保设备安全\n\n如前所述，旧版本的操作系统保留了许多漏洞和利用程序。特别是手机，请务必尽快安装最新的更新。\n\n圣贝纳迪诺手机之所以如此难以破解，原因之一是\
    \ Apple 在存在密码时会启用其内置加密。对于注重安全的 iPhone 所有者来说，这意味着设置密码可以确保获得极佳的保护。只要启用了密码，手机就会被加密。简单的破解手段无法提取已加密的数据，这就是为什么\
    \ FBI 必须付费获取替代性的利用程序。\n\n读过上本书的读者会记得，加密是对数据进行混乱以防止访问。只有拥有正确密码的人才能解码这些乱码。就像桌面电脑一样，加密你的手机手机将保护它免受未经授权的访问。所有\
    \ iPhone（带有较新更新的）在启用密码时会自动加密。运行 `OS 6.0` 及以上的 Android 手机会自动加密，但运行旧操作系统的手机必须手动启用该功能（`settings`、`security`、`encrypt\
    \ phone`）。加密后的手机运行速度较慢，但更安全。即使某些短信应用（如 `WhatsApp`）也可以加密发送的短信。\n\n然而，如果黑客或机构获取了设备，仍然有一个技巧可以让对手占据优势。即使是带有密码和加密的手机，默认情况下锁屏上仍然会显示通知。例如，假设一个黑客拥有你的手机并尝试登录你的在线银行。尽管没有密码，攻击者仍然可以向手机发送验证码并在锁屏上看到它。通过完全禁用通知来消除锁屏问题。在\
    \ `iDevices` 上，进入 `settings`、`control center`，然后关闭 `Access to Lock Screen`。在 Android\
    \ 上进入 `settings`、`sound and notifications`，然后将 `while locked` 设置为关闭。\n\n假设移动设备上安装了一个应用，你怀疑它可能包含木马或有恶意意。该应用可能是从第三方安装的，或者你怀疑\
    \ Facebook 正在收集你的数据。幸运的是，在 iPhone 和 Android 上，你都可以关闭特定的应用权限，以限制应用访问的范围。就像当你安装应用时它会请求权限（例如麦克风、摄像头和联系人）一样，你可以随时撤销这些权限。\n\
    \nAndroid 手机在设置应用（`Marshmallow 6.0`）中编辑权限。`apps` 标签显示所有已安装的应用，通过点击右上角的设置按钮，你可以选择\
    \ `app permissions`。下一个屏幕显示 Android 的每个访问部分，如摄像头、联系人、`GPS` 等……你可以编辑每个类别并更改哪些应用有权限使用它们。\n\
    \niOS 的应用权限方法被认为可能更好，因为它只在应用想要使用外设时才请求使用。注重安全的个人可以领会这一点：在异常时间请求权限显然意味着正在发生不法活动。尽管如此，仍然可以通过\
    \ `settings` 中的 `privacy` 标签撤销应用权限。与 Android 一样，点击类别会显示使用该功能的所有应用并提供撤销权限的选项。\n\
    \n移动设备仍然存在恶意软件和病毒。可以通过从信誉来源安装防病毒软件来保护手机和平板电脑。不过，某些攻击者喜欢将木马伪装成防病毒软件；请只下载声誉良好且评价高的应用。不要反对付费的防病毒软件，因为它们通常是效果最好的。\n\
    \n## 模组化、越狱和 Root \n\n现代设备被锁定，运行专有软件，并且对定制化关闭。通过修改设备以获得额外功能的行为有许多不同的名称；在 iPhone\
    \ 上，模组化过程通常被称为 `Jailbreaking`（越狱），在 Android 手机上被称为 `rooting`（获取 Root），在视频游戏机上，该行为被称为简单的\
    \ `modding`（模组化）。\n\n"
- fmt: '

    Hackers enjoy modding their hardware to increase the amount of freedom it gives
    them. For example, iPhones only have one layout, icon set, set of ringtones, and
    very few customization settings. Android phones have decent customization, but
    some settings are set in stone and unchangeable. Rooting adds more customization
    and allows apps to interact with the core filesystem for unique features. Commonly
    people root and jailbreak for extra apps and games. Modding game consoles allows
    them to run full- fledged operating systems or even play backup games from burned
    discs. Below we will discuss the benefits, downsides, and features of modding
    a few popular devices. Once again it is important to note that you may void a
    warranty by altering your gadgets. Also, modding has a small risk of ruining the
    hardware permanently (bricking); this makes the technology unusable. We are not
    responsible for damages, so do the demonstrations at your own risk and proceed
    cautiously.


    # Jailbreaking iOS


    The iPhone is conceivably the most “hacked” device because of the limited customizability
    and strict app store guidelines that Apple imposes. Some groups love the simplicity
    of the iPhone in that regard, though, while adept technological experimenters
    would rather have full control. If one jailbreaks their iPhone, they gain access
    to the minute details usually locked away and unchangeable. Suddenly they can
    change the pictures on the icons, how many icons are in a row, animations, what
    the lockscreen layout looks like and much more. Furthermore, a jailbroken iPhone
    is not restricted to just the “Apple Store”, there are other free app stores that
    Jailbroken iPhones can download applications from. The range of functions that
    these new and “banned” apps bring to you certainly make jailbreaking worth it.


    There are a few restrictions though, as Apple tries to deter jailbreaking through
    patching their iOS. To see if your iDevice is able to be jailbroken, you will
    need to know which version of iOS you are running. From the `Settings` app, tap
    `General` and then `About`. Note the version number and check `https://canijailbreak.com`,
    a popular website that lists the jailbreakable versions of iOS. Each version of
    iOS will have a link to the tool that will help jailbreak the iDevice.


    “Tethered” jailbreaks are conditional jailbreaks that require you to boot the
    iDevice with the help of a computer. A tethered jailbreak could possibly damage
    your phone if started without the aid of a PC, and if your battery dies away from
    home than the phone is basically unusable even after a charge. This is obviously
    not the best solution, so consider if a “tethered” jailbreak is worth the trouble
    to you. Some versions of iOS are able to be untethered, though, which is ideal
    in nearly all situations.


    Before starting any jailbreak, make a backup of your phone data just in case something
    goes wrong or you wish to return to a normal, unjailbroken phone.


    ## Pangu / Evasi0n


    1. Download the application you need to your computer.

    2. Disable the password on your iDevice through the settings menu.

    3. Start airplane mode.

    4. Turn off “Find my iPhone”.

    5. Plug your iDevice into the computer with a USB cable.

    6. Press the `Start` button on whichever application you are using.

    7. Follow any on-screen prompts. You will need to follow any instructions the
    application gives you, including taking action on the desktop computer or iDevice.

    8. Your iDevice will be jailbroken.


    Each iDevice may or may not be jailbreakable, but generally most iPhones and iPads
    can be exploited so long as they are not running the newest iOS update. But attempting
    to jailbreak a device which is definitely known to not work may result in a totally
    bricked device.


    A jailbroken iPhone’s best friend is `Cydia`, the “hacked” appstore. `Cydia` allows
    you to add repositories and download applications. A repository is a download
    storage that contains applications and modifications. In order to download a few
    specific apps, you will have to add the repository to `Cydia`. Each version of
    `Cydia` may have slightly different default repositories, this process below is
    how you check the installed repos and add new ones:


    1. Open `Cydia` and navigate to the `Sources` tab.

    2. The list on the screen is all installed sources.

    3. To add a new source, click the `add` button.

    4. Type in the source and add it to the list.


    Repositories are typically URLs, and you can find them in a variety of places.
    You can internet search for “best Cydia repos” or just find an alphabetical list
    and search for good ones. Be careful of adding too many sources, though, because
    that will slow down the `Cydia` app as it tries to contact each server and get
    the app lists regularly. Some of the best sources include:


    * BigBoss

    * ModMyI

    * iSpazio

    * Telesphoreo Tangelo

    * Ste

    * ZodTTD


    The previous sources are usually default, but here are some that you might have
    to add manually:


    * iHacksRepo (`http://ihacksrepo.com`)

    * SiNful (`http://sinfuliphonerepo.com`)

    * iF0rce (`http://apt.if0rce.com`)

    * InsanelyiRepo (`http://repo.insanelyi.com`)

    * BiteYourApple (`http://repo.biteyourapple.net`)


    Customizing the icons and colors of iOS is possibly the most used feature of a
    jailbroken iOS. The two best apps to change out parts of iOS are `Winterboard`
    and `Anemone`. Search for these two apps within `Cydia` and install them. Now
    you can search through the repositories for a theme you want to apply. `Winterboard`
    themes in particular can be entire cosmetic changes that replace every bit of
    the iOS with new colors, content, and icons. For a new set of icons only, just
    search for icon packs.


    Apps that change the look of iOS are aesthetically pleasing, but they can often
    conflict and cause bugs within the operating system. Some themes and icon sets
    may crash apps or cause the phone to restart occasionally. This is an unfortunate
    side effect of compatibility and newer developers with poor code, so use themes
    at your discretion.


    There are too many `Cydia` apps to count, so here is a short list of a few popular
    ones and why you should consider downloading them:


    * `iCaughtU` takes a snapshot when your device’s passcode is entered incorrectly.
    Catch snoopers and thieves in the act.

    * `iFile` allows you to actually interact with the files on your iDevice. This
    is a feature built into Android that is mysteriously missing in iOS.

    * `T/Zephyr` are two apps that allow customization of multitasking gestures. You
    can make, say, swiping in a circle launch your text messages to save time. `T`
    is the newest app, but older devices may need to run `Zephyr`.

    * `Activator` allows you to launch apps or start iOS features with buttons such
    as triple tapping home or holding volume down.

    * `TetherMe` creates a wireless hotspot without having to pay your carrier’s fee
    for doing so.


    The app possibilities are endless. You can take hours just searching through `Cydia`
    to find your favorite tweaks and modifications. Once again be warned that installing
    too many may bog down iOS and cause it to crash, so install sparingly.


    Another benefit to jailbreaking comes about through the games that can be played.
    While there are a few game “apps” that are available for download through `Cydia`,
    the main attraction for gamers are certainly emulators. Emulators are apps that
    imitate game consoles so their games can be played on iOS, usually for free. The
    process to play emulated games is somewhat difficult, but major steps will be
    explained below. Please note that the steps will vary as per emulator, game, and
    device.


    1. Firstly, we will need to download an emulator. We want to play a Sony Playstation
    1 game so we are going to download `RetroArch` from `Cydia`.

    '
