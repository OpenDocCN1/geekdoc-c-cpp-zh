    storage space that makes it easier to for the program to manipulate. All of the
    variables that you use will be attached to a different type and these types are
    going to determine the layout and the size of the memory of the variable. It is
    also going to set a range of values that you are able to store on this memory
    space.


    Naming the variable is going to be similar to naming the identifier. You will
    only be able to name it with a letter or an underscore and the letters are going
    to be case sensitive. But after that, you are able to use any type of digit, letter,
    and character that you would like.


    Again, the basic variables that you will be able to use here in more detail include:


    •Wchart_t: this is the wide character type.


    •Void: this is going to represent the absence of a type


    •Double: this is a floating value that will have double precision.


    •Float: this is a floating point that is going to have single precision.


    •Int: this is an integer


    •Char: this is often going to be just one byte and is a type of integer.


    •Bool: this is going to work with values that are either true or false.


    You can also define other types of variables. These variables are things line
    pointer, array, reference, enumeration, data structures, and classes.


    Creating a new line


    Now that you know the data types and modifiers, and all about making a comment
    in your program, it is time to learn about how to create a new line. This is a
    problem that a lot of new programmers run into. They have their program all nice
    and laid out in the input, but the output is still really mashed together and
    really unkempt. This is because they did not properly create a new line. Remember
    that whitespace is ignored, so you cannot just skip a line, and expect to have
    a line skipped in your program. You have to indicate to the compiler that you
    want to start a new line. This is really important, as when you play out your
    program, you want it to run smoothly. You do not want to see something like this.'
