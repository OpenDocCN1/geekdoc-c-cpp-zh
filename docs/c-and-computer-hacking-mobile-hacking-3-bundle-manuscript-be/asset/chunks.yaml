- fmt: '

    Having always-connected internet has exposed almost every computer as vulnerable.
    Cybersecurity is now a major concern for every government, corporation, and individual.
    Hacking is a necessary entity in the modern world, no matter if it is used for
    “good” or “evil”. As computers are so prevalent and interweaved with typical function,
    hackers will be needed constantly for professional security positions. It is only
    through studying the past, though, that we can learn about the unique situation
    that modern hacking is in.


    # Chapter 2: Modern Security


    IT professionals today usually do not fill “jack-of-all-trades” positions in corporations.
    While a small business may still employ a single person who is moderately proficient
    in most areas of technology, the huge demands imposed on internet connected big
    businesses means that several IT specialists must be present concurrently. Low-level
    help-desk personnel report to IT managers who report to administrators who report
    to the `CTO` (Chief Technology Officer). Additionally, sometimes there are even
    further specializations where security employees confer with administrators and
    report to a `CIO` (Chief Information Officer) or `CSO` (Chief Security Officer).
    Overall, security must be present in companies either full-time, contracted through
    a 3rd party, or through dual specialization of a system administrator. Annually
    a large amount of revenue is lost due to data breaches, cyber-theft, DDOS attacks,
    and ransomware. Hackers perpetuate the constant need for security while anti-hackers
    play catch-up to protect assets.


    The role of a security professional is to confirm to the best of their ability
    the integrity of all the security of an organization. Below are a few explanations
    of the various areas of study that security professionals protect from threats.
    Some of these “domains” are also the key areas of study for `CISSP` (Certified
    Information System Security Professional) certificate holders, which is a proof
    of proficiency in security. CISSPs are sometimes considered anti-hackers because
    they employ their knowledge to stop hackers before the problem can even occur.


    ## Network Security


    Network security includes protecting a networked server from outside intrusion.
    This means that there cannot be any entry point for curious individuals to gain
    access. Data sent through the network should not be able to be intercepted or
    read, and sometimes encryption is needed to ensure compromised data is not useful
    to a hacker.


    ## Access Control


    A sophisticated security infrastructure needs to be able to identify and authenticate
    authorized individuals. Security professionals use methods such as passwords,
    biometrics, and two-factor authentication to make sure that a computer user really
    is who they say they are. Hackers attempt to disguise themselves as another user
    by stealing their password or finding loopholes.


    ## Software Application Security


    Hackers are quick to exploit hidden bugs and loopholes in software that could
    elevate their privilege and give them access to secret data. Since most corporations
    and governments run their own in-house proprietary software, security professionals
    cannot always fully test software for problems. This is a popular areas for hackers
    to exploit, because bugs and loopholes are potentially numerous.


    ## Disaster Recovery


    Sometimes the hacker is successful. A skilled troublemaker can infiltrate remote
    servers and deal great damage or steal a plethora of information; disaster recovery
    is how security professionals respond. Often, there are documents that have a
    specific plan for most common disaster situations. Automated recognition systems
    can tell when an intrusion has occurred or when data has been stolen, and the
    best CISSPs can shut down the hack or even reverse-track the culprit to reveal
    their true identity. Disaster recovery is not always a response to attacks, though.
    Natural disasters count too, and there is nothing worse than a flooded server
    room. Professionals must have a disaster plan to get their business back up and
    running or else the business could face a substantial loss of money.


    ## Encryption and Cryptography


    As we’ve learned by looking at history, the encryption of data is a valuable tool
    that can protect the most valuable information. For every encryption method, though,
    there is a hacker/cracker using their talents to break it. Security personnel
    use cryptography to encrypt sensitive files, and hackers break that encryption.
    Competent hackers can break weak encryption by having a strong computer (that
    can perform fast math), or by finding flaws in the encryption algorithms.


    ## Risk Management


    Is it worth it? Every addition to computer infrastructure comes with a risk. Networked
    printers are extremely helpful to businesses, but hackers have a reputation for
    gaining access to a network by exploiting vulnerabilities in the printer software.
    When anything is going to be changed, IT staff must weigh the risk versus the
    benefit to conclude whether change is a safe idea. After all, adding that Wi-Fi-enabled
    coffee pot may just give a hacker the entry point they need.


    ## Physical Security


    A common theme in cyberpunk novels (a literary subgenre about hackers) involves
    breaking into a building at night and compromising the network from within. This
    is a real threat, because any person that has physical access to a computer has
    a significant advantage when it comes to hacking. Physical security involves restricting
    actual bodily access to parts of a building or locking doors so a hacker doesn’t
    have the chance to slip by and walk off with an `HDD`.


    ## Operations


    Many, many notable hacks were performed by employees of the organization that
    had too many access permissions. Using the information and access that they are
    granted, these hackers commit an “inside job” and make off with their goals. Security
    teams attempt to prevent this by only giving just enough access to everyone that
    they need to do their job. It just goes to show, security staff cannot even trust
    their coworkers.


    These are not all of the CISSP domains, but they are the most notable. Interestingly,
    the domains give an insight into the methodology and philosophy that security
    IT have when protecting data, and how hackers have to be wary of exactly how CISSPs
    operate.


    The most useful knowledge about modern security for hackers, though, is an intimate
    idea of how businesses conduct operations. Understanding that most businesses
    store data on a server and authenticate themselves through Windows domains is
    a decent first step, but real-world experience is needed to actually understand
    what makes computer infrastructure tick.


    # Chapter 3: Common Terms


    One important aspect of hacking involves a deep understanding of a multitude of
    computing concepts. In this chapter, we will broadly cover a few important ones.


    ## Programming


    The skill of writing instructional code for a computer is known as programming.
    Original programming was done with only binary 1s and 0s. Programming nowadays
    is done with high-level programming languages that are decently close to plain
    English with special characters mixed in. Programs must be compiled, which means
    translated into machine code before they can run. Understanding the basics of
    programming gives a hacker much insight into how the applications they are trying
    to exploit work, which might just give them an edge.


    ## Algorithms


    Algorithms are repeated tasks that lead to a result. For example, multiplication
    problems can be solved through an algorithm that repeatedly adds numbers. `5 x
    3` is the same as `5 + 5 + 5`. Algorithms are the basis of encryption- repeated
    scrambling is done to data to obfuscate it.


    ## Cryptography

