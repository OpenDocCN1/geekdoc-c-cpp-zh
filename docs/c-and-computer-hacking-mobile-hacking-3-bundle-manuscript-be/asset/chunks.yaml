- fmt: '

    Rather humorous, the childish gui hides powerful tools that allow unskilled, beginner
    hackers to have DDoS capabilities when coordinating with others.


    The most skilled attackers use botnets to increase their effectiveness. A well-written
    worm can infect data centers or universities with fast internet connections, and
    then these zombie computers all coordinate under the will of the hacker to attack
    a single target.


    ## Fork Bomb


    Fork bombs are a specific type of malicious code that works essentially like an
    offline DDoS. Instead of clogging network pipes, though, fork bombs clog processing
    pipes. Basically, a fork bomb is a process that runs itself recursively- that
    is the process copies itself over and over until the processor of a computer cannot
    keep up. If a hacker has access to a system and can run code, fork bombs are fairly
    deadly. Actually, fork bombs are one of the simplest programs to write. Typing
    `start` into a command prompt will open up another command prompt. This can be
    automated as demonstrated and pictured below.


    1. Open notepad. (`Windows+R`, `notepad`, `okay`)

    2. Type `start forkbomb.bat` as the first and only line.

    3. Open the “save as” dialog.

    4. Switch the file-type to “all files”.

    5. Name the file `forkbomb.bat`, and then save the file.


    ![](images/00008.jpeg)


    What we have just done is create a batch file in the same programming language
    that command prompt uses. Running this file (by right clicking its icon and then
    clicking “run”) initiates the fork bomb, and it will continuously launch itself
    over and over until the computer cannot handle the resource strain. **WARNING**:
    Do not run this file unless you are prepared to face the consequences!


    ## Cracking


    Cracking is breaking into software/applications or passwords. Cracks can disable
    Digital Rights Management (DRM, also known as copy protection) on paid software
    so that full versions of software can be used without paying the full price. Skillful
    hackers achieve this by reverse-engineering code or finding exploits that let
    them run their own code. Encryption can be cracked as well, which leads to protected
    data being compromised since the attacker knows how to reverse the scrambling.
    Password cracking can be achieved through brute force cracking and dictionary
    attacks.


    ### Brute Force


    Brute force attacks attempt to guess a password by attempting every conceivable
    combination of letters and numbers. This was not terribly difficult in the days
    of DOS, where a password could only be 8 characters max. Brute force attacks are
    long and arduous, but can be successful on a powerful computer given enough time.
    Later in the chapter, we will talk about Kali Linux and its use as a security
    testing/hacking tool. Hydra is an application that can attempt to brute force
    passwords.


    ### Dictionary Attack


    Dictionary attacks are slightly more sophisticated. They are similar to brute
    force attacks in that they try a large combination of passwords, but they differ
    in the fact that dictionary attacks use a database of words from a dictionary
    to operate. This method works well at guessing passwords that are simple, such
    as one-word passwords. The application facilitating the dictionary attack will
    go through a large database of words starting at the top and try every one with
    slight variations to see if login is successful. The most clever dictionary attacks
    add words specific to the user to the database, such as their name, pets, work,
    birthday, etc… Most people use personal information as a password, and adding
    this information to a dictionary attack increases effectiveness.


    ## Controlling a Colleague’s Screen on Windows


    Certain versions of Windows contain the “Remote Desktop” application built in,
    which is designed for IT personnel to quickly and remotely connect to a faraway
    computer to control and perform maintenance on it.


    Remote desktop can be exploited (of course) and that is what we will do. This
    tutorial is designed for two computers on the same network, but clever users may
    be able to expand this to the entire internet.


    Firstly, remote desktop needs to be enabled on both computers. Through control
    panel, click on “System” and then “Remote settings”. Ensure “Allow Remote Assistance
    connections to this computer” is checked. Apply settings. Then, you will need
    your colleagues IP address; you may recall this can be done by typing `ipconfig`
    into a command prompt and copying the “IPv4 Address” listed.


    ![](images/00009.jpeg)


    Now to initiate the remote control procedure, wait for the right time to surprise
    your friends and start the “Remote Desktop Connection” application on your computer
    (you can search for it in the start menu). Type in the friend’s IP address and
    watch their surprised reaction when you move their mouse around!


    Not technically a “hack”, the remote desktop application CAN be used by hackers
    to spy on their targets. For example, an unsuspecting user may check bank account
    information while the hacker watches silently. This gives the hacker a good idea
    of passwords and personal information, so be wary if the remote desktop application
    is enabled on your computer.


    ## Using another OS


    Alternate operating systems are invaluable to a hacker for a variety of reasons.
    An easy way to try another operating system without overwriting the current one
    is to install the OS onto a bootable USB drive. We will demonstrate this process
    by installing Kali Linux (formally Backtrack Linux) onto a USB drive.


    1. Download Kali Linux by visiting [http://www.kali.org](http://www.kali.org).
    You will need to download the version that is compatible with your processor (32
    bit, 64 bit, or ARM). If in doubt, download the `.iso` file for 32 bit processors.

    2. Download Rufus, the free USB writing software from [http://rufus.ie](http://rufus.ie).

    3. Plug in any USB stick with enough space for the image. You might need 8GB or
    more depending on how big the image is at your time of reading.

    4. **WARNING**: make sure the USB does not contain any valuable- they will be
    deleted! Copy anything important off the drive or you risk losing the data.

    5. Start Rufus, select your USB stick from the “Device” tab, and keep the rest
    of the settings default. Refer to the image below for the settings I have used.

    6. Beside the checked “Create a bootable disk using” box, select “ISO Image” from
    the dropdown. Then click the box beside it and locate the Kali `.iso`.

    7. Triple check that the information is correct, and that your USB has no files
    on.

    8. Click `Start`.


    ![](images/00010.jpeg)


    Rufus will take its time to finish. Once Rufus replies with “Done”, it will have
    installed Kali Linux onto the USB and made it bootable. After finishing completely
    you are free to close out of the program.


    For the next part of the process, you will need to shut your computer completely.
    We need to access the BIOS of your computer. Continue reading on the next section
    and the process will continue.


    ## BIOS/UEFI


    The BIOS (Basic Input Output System) or UEFI (Unified Extensible Firmware Interface)
    of a computer is the piece of firmware that runs when the computer first powers
    on. Traditionally BIOS was used by default, but UEFI offers enhanced features
    and it is slowly replacing BIOS on computers. This startup firmware performs initialization,
    checks hardware, and provides options for the user to interact with their computer
    on the “bare metal” level. BIOS/UEFI interfaces can be accessed by pressing a
    key on the keyboard when the computer first starts up.

    '
