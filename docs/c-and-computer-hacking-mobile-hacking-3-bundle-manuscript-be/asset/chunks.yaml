    # 黑客的历史


    黑客拥有一丰富且多样的历史，可以追溯到古代。密码学和加密（密码）被罗马军队使用。指挥官需要在战场上发送指令，他们通过在纸上写下指令来实现。士兵可以来回传送这些纸条，从而使一方通过获取更多信息来获得优势。


    无疑，士兵有时会被俘虏，秘密指令会落入敌人之手。为了应对这一点，指挥官开始通过变换和移动字母来模糊文本。这一过程被称为`encryption`（加密），它成功地困扰了敌人指挥官，直到他们被迫尝试破解。通过采用数学方法和巧妙的技巧来消除模糊化，敌人有时能够解码文本。因此，在计算机被发明之前，古代人就已经在当黑客了！


    ## 恩尼格玛机


    然而，当大多数人想象早期的黑客时，他们通常会被`Enigma Machine` 极其有趣的故事所吸引。`Enigma` 机是第二次世界大战期间纳粹德国著名的用于加密和解密军事信息的设备。与古罗马人类似，德国的消息在发送前会经过模糊化和变换，这样即使信息被截获，对手也无法读取这些高度机密的文本。除了在
    20 世纪 30 年代加密方法被发现的短暂时刻外，`Enigma` 机在其存在的大部分时间里非常成功。波兰密码学家是最初破解代码的人，但德国在那个年代后期通过改进设计并使
    `Enigma` 变得更加复杂来进行了反击。


    `Enigma` 的统治持续了整个战争。一位名为`Alan Turing`的美国教授利用他的研究和对数学的广泛知识提供了关键研究，在 1939 年再次破解了
    `Enigma` 代码。然而，正如加密方法的通常情况，`Enigma` 再次得到了改进并变得不可破解，直到 1943 年图灵协助海军并生产了一台速度更快的解密机。


    这些解密机被称为`Bombes`，它们为破解 `Enigma` 代码提供了便利的设备。`Bombe` 机器使用旋转鼓和电信号来分析错乱的消息，并输出拨盘和插头的正确配置，从而生成解码后的文本。由于其机械和电气复杂性，`Bombes`
    几乎可以被认为是最早的计算机之一。尽管双方都投入了先进的技术，但 `Enigma` 的最终终结实际上是因为盟军捕获了机器中使用的密钥或代码。随着加密方法的变得透明，`Enigma`
    变得基本毫无用，除非进行重新设计。重新设计迫不容缓，因为战争很快结束了。盟军解码 `Enigma` 消息的能力对他们的成功起了巨大的作用。


    ## 电话黑客的兴起


    第二次世界大战后，大量的研究和计算投入到了弹道导弹和核武器的发展。冷战本质上促进了现代电子计算机的发展，因为电子设备可以快速地进行数学运算。`Colossus`、`ENIAC`
    和 `EDSAC` 等先进设备为 20 世纪 50 年代和 60 年代更快的电子设备铺平了道路。超级计算机被全球大学和公司使用，这些早期设备也容易受到入侵和黑客攻击。然而，20
    世纪最著名的黑客运动被称为`Phreaking`（电话黑客），涉及通过电话进行“黑客”。


    `Phreaking` 开始于电话公司从人工操作员切换到自动交换机之后。自动交换机根据拨号号码时电话产生的音调频率决定路由的路由。在手机上按按钮时听到的哔哔声让人联想到这一点，因为每个按钮都会产生不同频率的音调。连续的音调通过自动交换机拨打号码，电话用户的通话就会连接到拨打的号码。


    尽管如此，其他音调对应不同的动作——`phreakers`（电话黑客）发现通过模仿特殊的音调，他们可以控制自动交换机并获得全球范围内免费的长途电话。`Phreaking`
    随后演变成一种个人文化，这些人会探索和实验电话系统，经常深入非法手段以寻求乐趣并逃避费用。熟练的 `phreakers` 甚至可以窃听电话并通过冒充技术人员来操纵电话公司员工。


    少数 `phreakers` 因发现新技术和推进 `phreaking` 研究而在社区内闻名。`Joseph Engressia` 是第一个发现拨打长途电话所需音调的人，而
    `John “Captain Crunch” Draper` 发现麦片盒里的奖金哨产生的正是那种音调，他根据这一发现获得了他的绰号。对著名 `phreakers`
    的采访启发了后辈——`Steve Jobs` 本人也喜欢参与这项爱好。


    网络计算机和 `BBS` 的发明将这种文化带给了更多人，因此这项爱好急剧增长。这不再是一个小运动，政府在 1990 年注意到了这一点，当时美国特勤局通过“Sundevil
    行动”对 `phreaking` 社区进行了打击。该行动导致几个 `phreaking` 小组因非法活动而被关闭。随着时间的推移，由于手机的竞争，电话变得不再流行，因此
    `phreaking` 大多在 20 世纪 90 年代消失了。当个人电脑对大多数家庭都能负担起同时，`phreaking` 文化大多回避并被黑客文化吸收。


    ## 现代黑客文化


    到 2 世纪 80 年代中期，公司和政府设施经常被爱好者和报告计算机漏洞的“白帽”专业人士攻击。`Loyd Blankenship` 在 1986 年在一份黑客和
    `phreakers` 阅读的在线杂志上写了《黑客宣言》；该文件后来成为黑客哲学的核心部分，因为它将其归类为无罪的好奇好奇之士。黑客行为继续发展，1988
    年 `Robert Morris` 创建了一个导致康奈大学计算机系统崩溃的蠕虫。尽管可能没有恶意，这种情况标志着计算机黑客的分化。一些人继续作为“白帽”寻找乐趣，而另一些人则作为“黑帽”黑客寻求非法利益。


