- pgno: 203
  md: '# Wireless Fidelity (WiFi)


    WiFi, or Wireless Fidelity, has become a ubiquitous technology powering our modern
    world''s connectivity. Its architecture is built around a simple yet effective
    model that allows devices to connect wirelessly to a network, typically the internet,
    within a certain range. The primary components of a WiFi network are Wireless
    Access Points (WAPs), Wireless Network Interface Cards (WNICs), and a network
    infrastructure, which typically involves routers and switches.


    The Wireless Access Point, or WAP, is a device that serves as the central transmitter
    and receiver of wireless signals. It communicates with the Wireless Network Interface
    Cards (WNICs) present in devices like laptops, smartphones, and tablets. The WAP
    is typically connected to a wired network, often the internet, and bridges the
    gap between the wireless devices and the internet. WiFi operates by using radio
    waves to transmit and receive data. The data to be sent is first transformed into
    a radio signal by the WNIC in the sending device. This signal is transmitted over
    the air and received by the WAP, which decodes the radio'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'signal back into data and sends it across the wired network. The process also
    works in reverse for incoming data.


    Regarding the use of C++ for WiFi setup and administration, there are several
    libraries that can facilitate these tasks. Libraries such as WinPcap and WpdPack
    for Windows, or libpcap for Linux, can be used for capturing and sending network
    packets, thus allowing the analysis and manipulation of WiFi traffic. For instance,
    an administrator can use C++ to create a network scanner, which can discover all
    devices connected to a WiFi network. This can be achieved by sending probe requests
    and then capturing and analyzing the probe responses to retrieve information about
    the connected devices. Also, WiFi security can be programmed and tested using
    C++, by setting up authentication and encryption mechanisms for network communication.
    For instance, using cryptographic libraries in C++, a network administrator could
    implement protocols like WPA2 or WPA3 in a custom network setup.


    Note that these tasks require an understanding of lower-level network protocols,
    and the use of C++ for these purposes is not as straightforward as with high-level'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'languages such as Python. However, C++ offers great performance benefits and
    the ability to work at a low level with network interfaces, which can be useful
    for advanced network administration and cybersecurity tasks. In the following
    chapters, we''ll dive deeper into these aspects of C++ network programming.


    # WiFi Programming using C++


    Given the operating system restrictions and the complexities involved in directly
    interacting with WiFi hardware using C++, it''s often a better practice to use
    high-level libraries, APIs or command-line tools for such tasks, and then integrate
    these with your C++ program using system calls or process execution. Let us look
    at an example of how you can use C++ to execute command-line instructions for
    managing WiFi networks on a Linux system.


    The "iw" command-line utility is commonly used in Linux to manage wireless devices
    and their configuration. You can execute commands from within your C++ program
    using the system() function, which is available in the cstdlib library. Below
    is an example of scanning for WiFi networks using this method:'
  merge: -1
  img_proc: true
