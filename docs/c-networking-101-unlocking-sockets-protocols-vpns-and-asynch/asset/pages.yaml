- pgno: 74
  md: '# Comparing TCP and UDP – When to use Which?


    TCP and UDP, as we''ve learned, are two core protocols used in network communication,
    but they offer very different services, each suited to particular types of applications
    and network scenarios.


    Let us compare the two and understand when it is more appropriate to use one over
    the other.


    # Connection Orientation


    TCP is a connection-oriented protocol, meaning a connection must be established
    between the sender and receiver before data transfer begins. This connection ensures
    that the network path and the required system resources are ready for communication.


    In contrast, UDP is connectionless, allowing data packets, or datagrams, to be
    sent without establishing a connection. This makes UDP faster and more efficient
    for small, stateless exchanges.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Reliability


    TCP is considered a reliable protocol because it ensures that all data sent arrives
    at the destination in the correct order. It achieves this by using sequence numbers
    and acknowledgments, retransmitting any packets that are lost or arrive out of
    order.


    UDP, on the other hand, doesn''t provide these mechanisms. It sends datagrams
    independently of each other, with no guarantee of delivery or correct sequencing.
    This lack of reliability is why UDP is often referred to as an "unreliable" protocol.


    # Flow Control and Congestion Control


    TCP provides flow control, ensuring that a sender doesn''t overwhelm a receiver
    by sending more data than it can handle. It also has congestion control to prevent
    network congestion by adjusting the data transmission rate based on network conditions.


    UDP lacks both flow control and congestion control. It continually sends datagrams
    at the speed desired by'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'the application, regardless of network conditions or the receiver''s capacity.


    # Speed


    Given its connection setup, reliability mechanisms, flow control, and congestion
    control, TCP is slower than UDP. It''s best suited for applications where data
    integrity is more critical than speed.


    UDP is faster due to its connectionless nature and lack of reliability, flow control,
    or congestion control. It''s ideal for real-time applications where speed is crucial,
    and some data loss or out-of-order arrival is acceptable.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# When to use TCP or UDP


    The choice between TCP and UDP depends on the requirements of the application
    in question.


    # Use TCP when


    +   - Data must be delivered in order and without errors.

    +   - The network application can tolerate comparatively slower data delivery.

    +   - The application does not need to manage the complexities of control mechanisms.

    +   - Common uses include web browsing (HTTP/HTTPS), email (SMTP/POP/IMAP), and
    file transfers (FTP).


    # Use UDP when'
