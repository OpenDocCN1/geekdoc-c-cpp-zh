  md: '# DNS Deep Dive


    The Domain Name System (DNS) operates as the internet''s equivalent of a phone
    book. It''s a service designed to translate easily understood domain names, such
    as "www.google.com," into numerical IP addresses which computers use to locate
    each other on the network. This translation process facilitates human-computer
    interaction, making it easier for users to navigate the web without having to
    remember complex numerical addresses.


    DNS primarily operates using both TCP and UDP port 53, which provides flexibility
    and reliability to handle various types of requests. The system comprises four
    key components. DNS clients, also known as "resolvers," initiate the DNS lookup
    process. DNS servers then process these lookups, translating the domain names
    into IP addresses. DNS zones are administrative spaces for managing the domains
    under a single or multiple DNS servers. Lastly, DNS records, stored in zones,
    hold key information about the domain, such as IP addresses (A records), mail
    servers (MX records), or aliases'
  merge: -1
  img_proc: true
- pgno: 162
  md: '(CNAME records). This system ensures seamless internet navigation.


    # Types of DNS Queries


    There are several types of DNS queries:


    Recursive query: In a recursive query, the DNS client demands a complete answer
    to the query, and the DNS server must return the IP address or an error message.


    Iterative query: In an iterative query, the DNS server returns the best answer
    it can using its local DNS database. If it doesn''t have a match, it returns a
    referral to a DNS server authoritative for a lower level of the domain namespace.


    Non-recursive query: Non-recursive queries are usually sent by DNS servers to
    other DNS servers, rather than by clients.


    The Boost ASIO library in C++ provides functionality for performing asynchronous
    DNS queries.


    # Perform DNS Query using Boost ASIO'
