    defines where Nagios should look for object definition

    files, which contain configurations for hosts, services,

    contacts, and so on.


    # Define Hosts and Services


    You need to define the hosts (devices, servers, etc.) and

    services (HTTP, FTP, SMTP, etc.) that you want Nagios to

    monitor. You do this by creating object definitions in the

    configuration files. Each host and service definition will

    include the check command that Nagios will execute to

    determine the status of that host or service.


    # Setting Alerts


    Nagios allows you to set alerts that will notify you when

    a particular host or service goes down or behaves

    anomalously. Alerts can be sent via email, SMS, or any

    other method supported by the Nagios plugins you have

    installed.


