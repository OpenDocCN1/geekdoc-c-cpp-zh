- pgno: 65
  md: '# Deep into Transmission Control Protocol (TCP)


    The Transmission Control Protocol (TCP) is one of the fundamental protocols of
    the internet, providing reliable, ordered, and error-checked delivery of a stream
    of bytes. It is a part of the TCP/IP protocol suite and operates at the transport
    layer. Let us dive into the aspects of TCP in detail.


    # Basic Structure of TCP


    In TCP, data is transmitted in the form of packets, specifically called "segments".
    Each TCP segment contains a header and data. The header, which is 20 to 60 bytes
    long, contains information needed for the proper delivery of data, including source
    and destination port numbers, sequence number, acknowledgement number, data offset,
    reserved, control flags, window, checksum, and urgent pointer as below:


    Source and Destination Port Numbers: These are 16-bit fields that identify the
    ports on the source and destination machines.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Sequence Number: This 32-bit field represents the number assigned to the first
    byte of data in the current message.


    Acknowledgement Number: Also 32-bits, this field indicates the value of the next
    sequence number that the sender of the segment is expecting to receive.


    Data Offset: This field indicates where the data begins in the segment.


    Control Flags: These are used to control the flow of data. They include SYN, ACK,
    FIN, RST, PSH, and URG flags.


    Window: This field specifies the size of the sender''s receive window (the buffer
    space available for incoming data).


    7)     This is used for error-checking of the header and data.


    Urgent Pointer: When the URG flag is set, this field points to the sequence number
    of the byte following the urgent data.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# TCP Handshake and Connection


    Before any data transfer can occur between two devices using TCP, a connection
    must be established. This is done using a process known as the "three-way handshake".
    The purpose of the handshake is to synchronize the sequence and acknowledgment
    numbers of both sender and receiver, and to exchange TCP window sizes as below:


    SYN: The initiating device sends a SYN segment to the server, with an arbitrary
    sequence number (let''s call it X).


    SYN-ACK: Upon receiving the SYN, the server responds with a SYN-ACK segment. The
    acknowledgement number is set to X+1, and the sequence number is another arbitrary
    number (let''s call it Y).


    ACK: Finally, the initiating device sends an ACK segment back to the server with
    the acknowledgment number set to Y+1. This completes the handshake, and the connection
    is established.


    # TCP Data Transfer'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'When a connection is initiated between two computing systems, it enables the
    process of data transfer. This connection, established over a network, facilitates
    the movement of data packets from one system to another. Each segment or piece
    of data dispatched is labeled with a distinct sequence number, serving as an identifier
    for tracking and maintaining the order of transmission. The receiving system,
    upon successfully acquiring a data segment, dispatches an acknowledgment signal
    back to the sender. This acknowledgment confirms the reception of the specific
    data segment, thus ensuring the integrity and accuracy of the data transfer. This
    iterative process of sending, acknowledging, and confirming creates a reliable
    and effective communication protocol, vital for ensuring efficient and error-free
    data transfers.


    # TCP Connection Termination


    The termination of a TCP connection involves another handshake process:


    FIN: When a device is ready to end the connection, it sends a FIN segment, indicating
    that it has no more data to send.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'ACK: Upon receiving the FIN, the other device sends an ACK for the FIN. At
    this point, the connection is half-closed.


    FIN: Eventually, when the other device is also ready to end the connection, it
    sends its own FIN.


    ACK: The first device sends an ACK for the received FIN, and the connection is
    fully closed.


    Understanding the intricacies of TCP is vital for any network administrator or
    network programmer, as it forms the backbone of many internet communications.
    When writing network programs in C++, knowing the inner workings of TCP allows
    for the creation of reliable and efficient applications'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Deep Dive into User Datagram Protocol (UDP)


    The User Datagram Protocol (UDP) is another crucial protocol in the TCP/IP suite,
    operating alongside TCP at the transport layer. However, unlike TCP, which is
    connection-oriented and reliable, UDP is connectionless and does not guarantee
    delivery of data. This makes it simpler and faster than TCP, which is advantageous
    in certain scenarios. Let us explore the details of UDP.


    # Basic Structure of UDP


    Like TCP, UDP also transmits data in packets, known as "datagrams". Each UDP datagram
    comprises a header and data. The header is much simpler than a TCP header, consisting
    of only four fields each of 16 bits - source port, destination port, length, and
    checksum as below:


    Source and Destination Port Numbers: These identify the sending and receiving
    applications.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Length: This field specifies the length of the entire datagram (header and
    data).


    Checksum: This is used for error-checking of the header and data. It''s optional
    in IPv4 but mandatory in IPv6.


    # ## UDP Operation


    Given its connectionless nature, UDP doesn''t require a handshake to establish
    a connection before data transfer. Instead, a device can start sending datagrams
    to another device as long as it knows the IP address and port number. Each datagram
    is independent of others – hence UDP is often referred to as an "unreliable" protocol.


    # ## UDP Data Transfer


    During data transfer, each UDP datagram is sent independently and can arrive at
    the destination in any order. Unlike TCP, UDP doesn''t provide sequence numbers
    to order the received datagrams. If ordering is required, it must be managed by
    the application layer.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Furthermore, UDP does not provide flow control or congestion control. There''s
    no mechanism to manage the rate of data sent or to adjust it based on network
    congestion. Any necessary flow or congestion control must be implemented at the
    application level.


    # Error Checking and Recovery


    UDP provides a checksum for error checking, but it doesn''t have any mechanism
    for error recovery. If a datagram is found to have an error (indicated by the
    checksum), it''s simply discarded. UDP doesn''t provide acknowledgments of successful
    data receipt or retries for failed transmissions.


    Despite its apparent lack of features, UDP is useful in situations where speed
    is more important than reliability or where the application itself provides reliability.
    Real-time applications like video streaming, VoIP, and online gaming often use
    UDP to reduce latency. DNS queries and network discovery protocols also use UDP
    due to its simplicity and the small size of data being transferred. While UDP
    may not offer the reliability and ordered delivery of TCP, its simplicity and
    speed make it a valuable tool in the network protocol toolkit. In the later part
    of this chapter, we will explore how to implement UDP communication in C++.'
  merge: -1
  img_proc: true
