    # 总结


    本章首先深入探讨了互联网协议，讨论了它们在当代网络中的重要性，以及它们在高效通信中所发挥的作用。随后，重点转向 TCP，介绍了其结构，并探讨了握手、连接和终止等基本要素。通过对
    TCP 的全面讲解，读者能够理解其可靠性，以及它对于确保数据在网络中成功传输的重要意义。


    在详细了解 TCP 之后，我们转向 UDP。与 TCP 类似，我们剖析了 UDP 的结构和功能，重点强调了它的优势和潜在用途。这让读者能够更细致地理解 UDP
    的工作方式：它是一种轻量且快速的协议，无法提供与 TCP 同等程度的可靠性保证，但在优先考虑速度的应用场景中表现出色。随后，本章对 TCP 和 UDP 进行了比较研究。比较旨在突出两者之间的差异，并引导读者根据具体需求，就这些协议的使用做出明智决策。通过对比，可以确定某一种协议优于另一种协议的应用场景，从而确保两种协议得到高效利用。本章后半部分介绍了套接字以及
    C++ 中的套接字编程，为 TCP 客户端—服务器套接字编程的实践环节做了铺垫，使读者能够亲手使用第 1 章中讨论的 C++ 库创建一个简单的 TCP 服务器和客户端。


    最后，本章以 TCP 和 UDP 套接字编程的最佳实践作为结尾。这些指导原则旨在确保读者能够创建健壮、高效且安全的网络应用程序。本章是互联网协议和套接字编程的综合指南，为后续章节中更加复杂的网络任务奠定了坚实基础。


    # 第 3 章：网络接口与寻址


    ## 网络接口与寻址概述


    计算机网络是一组相互连接、共享数据和资源的设备。在网络中，设备使用数字信号系统彼此通信。设备要参与网络，就需要网络接口和地址。网络接口是计算机与私有网络或公共网络之间的连接点。网络接口通常是带有软件驱动程序的网络接口卡（NIC）。NIC
    提供与网络的物理连接。它通常具有用于有线连接的以太网端口，以及用于无线连接的天线。软件驱动程序使操作系统和网络协议能够与硬件协同工作。


    所有 NIC 都具有一个唯一标识符，称为媒体访问控制（MAC）地址。MAC 地址在 NIC 制造时分配，并存储在其硬件中。


    网络中的地址是分配给网络中每台设备的唯一标识符。它使设备能够向特定设备发送信息，并从特定设备接收信息。


    地址方案有两种类型：


    - IP 寻址：互联网协议（IP）地址是分配给参与计算机网络通信的每台设备的数字标签，这些网络使用互联网协议进行通信。它主要有两个功能：主机或网络接口标识，以及位置寻址。

    - MAC 寻址：如前所述，每个网络接口卡都有一个唯一的 MAC 地址，它在网络协议的物理层标识该网卡。


    目前使用的 IP 地址有两个版本：IPv4 和 IPv6。IPv4 地址长度为 32 位，IPv6 地址长度为 128 位。IP 地址的长度会影响可能的地址总数。IPv4
    寻址系统按照类别（A、B、C、D、E）进行组织，以适应不同类型的网络，从小型网络（地址较少，例如 C 类）到大型网络（地址较多，例如 A 类）。然而，随着
    CIDR（无类别域间路由）的出现，类别这一概念已不再使用。寻址这一主题还与子网划分的概念相关。子网划分是一种将网络划分为两个或更多较小网络段（称为子网）的技术，每个子网都作为一个较小的独立网络运行。这可以改善网络性能并提供安全性。


    在接下来的章节中，我们将深入探讨子网划分、IP 配置和网络接口编程，这些内容对于网络管理员来说至关重要。这些主题将帮助您理解设备如何被分配地址、网络流量如何高效路由，以及如何使用
    C++ 以编程方式与网络接口进行交互。


    ## 了解网络接口


    网络接口充当计算机与网络之间的通信桥梁，使设备能够与网络或互联网中的其他设备进行数据传输。在本节中，我们将了解两种常见操作系统环境中的网络接口：Windows
    和 Linux。


    ### Windows 中的网络接口


    Windows 在“网络和共享中心”中组织网络接口，该中心提供图形界面，用于管理连接和查看网络信息。您可以通过控制面板访问“网络和共享中心”。


    每个网络接口，无论是物理以太网端口、Wi-Fi 适配器，还是虚拟适配器（例如 VPN 使用的适配器），都会以网络连接的形式表示。右键单击某个网络连接并选择“属性”，即可查看和更改包括
    IP 寻址信息、DNS 服务器信息等在内的属性。


    此外，Windows 还提供了一个功能强大的命令行工具，用于网络故障排除和接口管理，该工具称为“`netsh`”（网络 Shell）。使用 `netsh`，您可以查看接口设置、更改
    IP 地址，以及执行各种其他网络相关任务。


    ### Linux 中的网络接口


    在 Linux 中，网络接口传统上使用命令行工具进行管理。具体工具可能因 Linux 发行版和版本而有所不同。传统上使用 `ifconfig` 命令显示系统中网络接口的信息，并对其进行配置。但是，许多
    Linux 发行版现在已弃用 `ifconfig`。如今，在现代 Linux 系统中，`ip` 命令是首选的网络接口管理工具。它可以显示网络接口信息，也可以对网络接口进行配置。


    Linux 中的网络接口通常命名为“`eth0`”“`eth1`”等，用于表示以太网连接；无线连接则通常命名为“`wlan0`”“`wlan1`”等。Linux
    还支持广泛的虚拟网络接口，


