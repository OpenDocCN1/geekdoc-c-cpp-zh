  md: '

    ## C++ Libraries for Networking


    As we delve further into the realms of C++ networking, it''s essential to familiarize
    ourselves with some crucial libraries that will be our primary tools for the job.
    C++ comes equipped with a plethora of libraries, each designed to address different
    aspects of networking. However, for the sake of brevity and focus, we will concentrate
    on three libraries that are popular and widely preferred by network professionals:
    Boost.Asio, POCO C++, and cURLpp.


    ### Boost.Asio


    Boost.Asio is a cross-platform C++ library used for network and low-level I/O
    programming. It provides developers with a consistent and efficient model for
    asynchronous programming, which is incredibly beneficial for networking applications
    that often involve waiting for responses from a network.


    ### Key Features


    - Asynchronous Programming Model: Boost.Asio offers asynchronous operations for
    networking, timers, serial I/O, and more. This allows for high performance and
    scalability in network applications, as it reduces the time wasted while waiting
    for network responses.

    - Support for IPv4 and IPv6: Boost.Asio supports both IPv4 and IPv6 protocols.
    As more networks are transitioning to IPv6, this feature is highly beneficial.

    - SSL Support: Boost.Asio provides support for the SSL (Secure Sockets Layer)
    protocol, ensuring secure communication over the network.

    - Timer Support: It offers timer functionality, allowing you to schedule and handle
    operations after a certain time period.

    - Multithreading Support: Boost.Asio can run handlers in multiple threads, which
    makes it suitable for multi-core processors.


    ### POCO C++ Libraries


    POCO C++ Libraries, standing for Portable Components, are a collection of open-source
    C++ class libraries that simplify and accelerate the development of network-centric
    applications. POCO is excellent for producing modular and efficient code and is
    especially useful for systems that need to be portable across different platforms.


    ### Key Features


    - Platform Independence: POCO C++ libraries are highly portable and can be compiled
    and run on multiple platforms.

    - Network Protocols: POCO supports a wide range of network protocols, including
    HTTP, FTP, SMTP, POP3, and more. It also provides support for handling URIs and
    HTTP-based web services.

    - Database Access: It offers classes for database access, which is beneficial
    for network applications that need to interact with databases.

    - File System Access: POCO provides classes for handling files, directories, and
    paths in a platform-independent way.

    - Multithreading and Synchronization: POCO offers powerful multithreading capabilities
    and synchronization classes like Mutex, Semaphore, Event, etc.


    ### cURLpp


    cURLpp is a C++ wrapper for libCURL. cURL is a command-line tool for transferring
    data using various network protocols, and cURLpp brings this power and flexibility
    to C++ applications. This library is widely used for HTTP requests, which form
    a significant part of modern network administration tasks.


    ### Key Features


    - Multiple Protocol Support: cURLpp supports a wide array of protocols, including
    HTTP, HTTPS, FTP, FTPS, SCP, SFTP, TFTP, LDAP, and more.

    - SSL and TLS Support: It supports secure communication using SSL and TLS protocols.

    - Cookie Handling: cURLpp provides functionalities for handling HTTP cookies,
    useful for web-based network applications.

    - File Transfer: cURLpp can be used to transfer files to and from servers using
    the supported protocols.

    - HTTP POST and Form Uploads: It supports HTTP POST operations and multipart form
    uploads.


    The above libraries make your journey into C++ networking more efficient and manageable.
    Each library offers its unique capabilities, and understanding when and how to
    utilize them is key to becoming a proficient network administrator with C++. In
    the upcoming chapters, we''ll delve deeper into each of these libraries and explore
    their functionalities with hands-on examples and exercises.


    ## Setting up C++ Environment


    Establishing your C++ programming environment involves a series of vital steps.
    You''ll need to install a C++ compiler, such as GCC or Clang, for translating
    your code. Also, installing an Integrated Development Environment (IDE) like Visual
    Studio or Code::Blocks is essential for efficient coding. Lastly, download and
    set up libraries that you''ll utilize in your projects. These may range from standard
    libraries to more specialized ones, depending on the nature of your work.


    Below is how to do it:


    ### Install C++ Compiler


    The first thing you need is a C++ compiler. We''ll use MinGW (Minimalist GNU for
    Windows), which is a port of the popular GCC compiler for Windows.


    Visit the MinGW project''s website.


    Click the "Download" button or go directly to the download page.


    Download the MinGW installer (mingw-get-setup.exe).


    Run the installer and choose your settings. You can install MinGW to any directory,
    but for simplicity, we recommend C:\MinGW.


    In the installer, choose the basic setup on the left and mark mingw32-base for
    installation.


    Apply the changes and wait for the installation to finish.


    After installation, add C:\MinGW\bin to your PATH environment variable.


    Press Win + X and choose "System".


    Click "Advanced system settings".


    In the "System Properties" window, click "Environment Variables".


    In "System variables", find and select "Path", then click "Edit".


    Click "New" and add C:\MinGW\bin.


    You can test the installation by opening a new command prompt and typing g++ --version.
    It should print the installed version of GCC.


    ### Install IDE


    Next, you''ll need an Integrated Development Environment (IDE). An IDE helps you
    write and organize your code, and it often comes with features like code completion,
    debugging tools, and more. For C++, we recommend Visual Studio Code (VS Code).


    Go to the VS Code download page.


    Download the installer for Windows.


    Run the installer, accept the agreement, and click "Next" until the installation
    starts.


    Open VS Code after the installation is complete.


    You''ll also need to install the C++ extension for VS Code.


    Open VS Code and click on the Extensions view icon on the Sidebar (or press Ctrl+Shift+X).


    Search for ''c++''.


    Click Install on the "C/C++" extension provided by Microsoft.


    ### Install Networking Libraries


    Finally, let us install the networking libraries.


    ### Boost.Asio


    Download the latest version of Boost from the official website.


    Extract the downloaded file to a directory, e.g., C:\boost.


    Open a command prompt in the directory where you extracted Boost and run these
    commands:


    ```

    bootstrap.bat

    ```


    ```

    .\b2.exe

    ```


    This will build and install Boost, which may take a while. After it''s done, add
    C:\boost\boost_1_xx_0 to your include path and C:\boost\boost_1_xx_0\stage\lib
    to your library path.


    ### POCO C++


    Download the latest POCO C++ Libraries from the official website.


    Extract the downloaded file to a directory, e.g., C:\poco.


    Open a command prompt in the directory where you extracted POCO and run these
    commands:


    ```

    buildwin.cmd 141

    ```


    Replace 141 with your Visual Studio version number.


    This will build POCO. After it''s done, add C:\poco\include to your include path
    and C:\poco\lib to your library path.


    ### cURLpp


    cURLpp is a wrapper for libCURL, so you need to install libCURL first.


    Download the latest version of libCURL from the official website.


    Extract the downloaded file to a directory, e.g., C:\curl.


    Open a command prompt in the directory where you extracted libCURL and run these
    commands:


    ```

    buildconf.bat

    ```


    ```

    nmake /f Makefile.vc mode=dll VC=15

    ```


    Replace 15 with your Visual Studio version number.


    This will build libCURL. After it''s done, add C:\curl\include to your include
    path and C:\curl\lib to your library path.


    Then, download the latest version of cURLpp from the official GitHub.


    Extract the downloaded file to a directory, e.g., C:\curlpp.


    Open a command prompt in the directory where you extracted cURLpp and run these
    commands:


    ```

    cmake . -G "Visual Studio 15 2017" -DCURLPP_BUILD_EXAMPLES=OFF -DCURLPP_BUILD_TESTS=OFF

    ```


    Replace "Visual Studio 15 2017" with your version of Visual Studio.


    This will generate a Visual Studio solution file. Open this file in Visual Studio
    and build the solution.


    After it''s done, add C:\curlpp\include to your include path and C:\curlpp\lib
    to your library path.


    Now, you''re all set to explore the exciting world of C++ networking!

    '
  mdcn: '

    ## 用于网络的 C++ 库


    随着我们进一步深入 C++ 网络编程领域，熟悉一些关键库是必不可少的，它们将成为我们完成工作的主要工具。C++ 自带大量库，每个库都旨在处理网络的不同方面。然而，为了简洁和聚焦，我们将集中介绍三个网络专业人士普遍青睐且广泛使用的库：Boost.Asio、POCO
    C++ 和 cURLpp。


    ### Boost.Asio


    Boost.Asio 是一个跨平台 C++ 库，用于网络和底层 I/O 编程。它为开发者提供了一致且高效的异步编程模型，这对经常需要等待网络响应的网络应用极为有益。


    ### 关键特性


    - 异步编程模型：Boost.Asio 为网络、定时器、串行 I/O 等提供异步操作。这可以减少等待网络响应所浪费的时间，从而在网络应用中实现高性能和高可扩展性。

    - 支持 IPv4 和 IPv6：Boost.Asio 同时支持 IPv4 和 IPv6 协议。随着更多网络向 IPv6 过渡，这一特性非常有益。

    - SSL 支持：Boost.Asio 提供对 SSL（安全套接层）协议的支持，确保网络通信安全。

    - 定时器支持：它提供定时器功能，允许你在特定时间段后安排和处理操作。

    - 多线程支持：Boost.Asio 可以在多个线程中运行处理程序，因此适用于多核处理器。


    ### POCO C++ 库


    POCO C++ 库（Portable Components 的缩写）是一组开源 C++ 类库，可简化和加速以网络为中心的应用开发。POCO 非常适合生成模块化且高效的代码，尤其适用于需要跨不同平台移植的系统。


    ### 关键特性


    - 平台无关性：POCO C++ 库具有高度可移植性，可以在多个平台上编译和运行。

    - 网络协议：POCO 支持广泛的网络协议，包括 HTTP、FTP、SMTP、POP3 等。它还支持处理 URI 和基于 HTTP 的 Web 服务。

    - 数据库访问：它提供用于数据库访问的类，这对需要与数据库交互的网络应用很有益。

    - 文件系统访问：POCO 提供以平台无关方式处理文件、目录和路径的类。

    - 多线程与同步：POCO 提供强大的多线程能力以及 Mutex、Semaphore、Event 等同步类。


    ### cURLpp


    cURLpp 是 libCURL 的 C++ 封装。cURL 是一个使用各种网络协议传输数据的命令行工具，而 cURLpp 将这种能力和灵活性带入 C++
    应用。该库广泛用于 HTTP 请求，而 HTTP 请求构成了现代网络管理任务的重要部分。


    ### 关键特性


    - 多协议支持：cURLpp 支持多种协议，包括 HTTP、HTTPS、FTP、FTPS、SCP、SFTP、TFTP、LDAP 等。

    - SSL 和 TLS 支持：它支持使用 SSL 和 TLS 协议进行安全通信。

    - Cookie 处理：cURLpp 提供处理 HTTP Cookie 的功能，对基于 Web 的网络应用很有用。

    - 文件传输：cURLpp 可用于使用受支持的协议与服务器之间传输文件。

    - HTTP POST 和表单上传：它支持 HTTP POST 操作和多部分表单上传。


    上述库将使你进入 C++ 网络编程的旅程更加高效和可控。每个库都提供独特的能力，理解何时以及如何利用它们是成为熟练的 C++ 网络管理员的关键。在接下来的章节中，我们将更深入地研究这些库，并通过动手示例和练习探索其功能。


    ## 搭建 C++ 环境


    建立 C++ 编程环境涉及一系列关键步骤。你需要安装 C++ 编译器，例如 GCC 或 Clang，用于转换代码。此外，安装集成开发环境（IDE），如 Visual
    Studio 或 Code::Blocks，对于高效编码至关重要。最后，下载并设置你将在项目中使用的库。根据工作性质，这些库可能从标准库到更专用的库不等。


    以下是具体做法：


    ### 安装 C++ 编译器


    你首先需要的是 C++ 编译器。我们将使用 MinGW（Minimalist GNU for Windows），它是流行的 GCC 编译器面向 Windows
    的移植版本。


    访问 MinGW 项目网站。


    点击“下载”按钮，或直接进入下载页面。


    下载 MinGW 安装程序（mingw-get-setup.exe）。


    运行安装程序并选择你的设置。你可以将 MinGW 安装到任意目录，但为简单起见，我们推荐 C:\MinGW。


    在安装程序中，选择左侧的基本设置，并勾选 mingw32-base 进行安装。


    应用更改并等待安装完成。


    安装完成后，将 C:\MinGW\bin 添加到你的 PATH 环境变量中。


    按 Win + X，然后选择“系统”。


    点击“高级系统设置”。


    在“系统属性”窗口中，点击“环境变量”。


    在“系统变量”中，找到并选择“Path”，然后点击“编辑”。


    点击“新建”，添加 C:\MinGW\bin。


    你可以打开新的命令提示符并输入 g++ --version 来测试安装。它应打印已安装的 GCC 版本。


    ### 安装 IDE


    接下来，你需要一个集成开发环境（IDE）。IDE 可帮助你编写和组织代码，并且通常附带代码补全、调试工具等功能。对于 C++，我们推荐 Visual Studio
    Code（VS Code）。


    前往 VS Code 下载页面。


    下载适用于 Windows 的安装程序。


    运行安装程序，接受协议，然后点击“下一步”直到安装开始。


    安装完成后打开 VS Code。


    你还需要为 VS Code 安装 C++ 扩展。


    打开 VS Code，点击侧边栏上的扩展视图图标（或按 Ctrl+Shift+X）。


    搜索“c++”。


    在 Microsoft 提供的“C/C++”扩展上点击“安装”。


    ### 安装网络库


    最后，让我们安装网络库。


    ### Boost.Asio


    从官方网站下载最新版本的 Boost。


    将下载的文件解压到一个目录，例如 C:\boost。


    在解压 Boost 的目录中打开命令提示符，并运行以下命令：


    ```

    bootstrap.bat

    ```


    ```

    .\b2.exe

    ```


    这将构建并安装 Boost，可能需要一段时间。完成后，将 C:\boost\boost_1_xx_0 添加到包含路径，将 C:\boost\boost_1_xx_0\stage\lib
    添加到库路径。


    ### POCO C++


    从官方网站下载最新的 POCO C++ 库。


    将下载的文件解压到一个目录，例如 C:\poco。


    在解压 POCO 的目录中打开命令提示符，并运行以下命令：


    ```

    buildwin.cmd 141

    ```


    将 141 替换为你的 Visual Studio 版本号。


    这将构建 POCO。完成后，将 C:\poco\include 添加到包含路径，将 C:\poco\lib 添加到库路径。


    ### cURLpp


    cURLpp 是 libCURL 的封装，因此你需要先安装 libCURL。


    从官方网站下载最新版本的 libCURL。


    将下载的文件解压到一个目录，例如 C:\curl。


    在解压 libCURL 的目录中打开命令提示符，并运行以下命令：


    ```

    buildconf.bat

    ```


    ```

    nmake /f Makefile.vc mode=dll VC=15

    ```


    将 15 替换为你的 Visual Studio 版本号。


    这将构建 libCURL。完成后，将 C:\curl\include 添加到包含路径，将 C:\curl\lib 添加到库路径。


    然后，从官方 GitHub 下载最新版本的 cURLpp。


    将下载的文件解压到一个目录，例如 C:\curlpp。


    在解压 cURLpp 的目录中打开命令提示符，并运行以下命令：


    ```

    cmake . -G "Visual Studio 15 2017" -DCURLPP_BUILD_EXAMPLES=OFF -DCURLPP_BUILD_TESTS=OFF

    ```


    将“Visual Studio 15 2017”替换为你的 Visual Studio 版本。


    这将生成一个 Visual Studio 解决方案文件。在 Visual Studio 中打开此文件并构建解决方案。


    完成后，将 C:\curlpp\include 添加到包含路径，将 C:\curlpp\lib 添加到库路径。


    现在，你已经准备好探索激动人心的 C++ 网络编程世界了！


    '
