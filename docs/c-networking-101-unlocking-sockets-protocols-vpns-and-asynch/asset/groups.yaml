    ## Using Netstat


    The netstat command (network statistics) is a command-line tool that displays
    network connections (both incoming and outgoing), routing tables, and a number
    of network interface and network protocol statistics. It is useful for checking
    your network''s overall health, finding out how well your firewall is working,
    and spotting suspicious network activity.


    To use netstat, you open your command-line interface and type netstat, possibly
    followed by some options. By default, it shows a list of active sockets for each
    protocol it supports. Now, let us look at a few examples:


    ### Example 1: Basic Netstat


    In your terminal, type netstat. This will list all current network connections,
    along with the protocol used, local and foreign addresses, and the state of the
    connection.


    ### Example 2: Displaying Only Listening Sockets


    You can use netstat to display only sockets that are listening for incoming connections.
    To do this, you would type netstat -l. This is useful to quickly check what services
    are waiting for connections on your machine.


    ### Example 3: Displaying Statistics


    Netstat can also display statistics for each network protocol. To do this, you
    would type netstat -s. This will print detailed statistics for each protocol,
    like the number of packets received, transmitted, discarded, etc.


    ### Example 4: Continuously Display Network Status


    To make netstat continuously refresh network status, you can use the `-c` option,
    as in netstat -c. This will refresh the information every second, allowing you
    to monitor real-time changes to your network.


    ## Exploring Wireshark


    ## About Wireshark


    Wireshark is a potent, open-source tool that enables deep inspection of network
    traffic, making it invaluable for network troubleshooting and protocol analysis.
    Its functionality encompasses various areas, such as software and communications
    protocol development, effectively serving as a diagnostic microscope for network
    health. Wireshark captures and displays data packets transmitted within a network,
    thereby offering a granular view of traffic details. This detailed insight makes
    it possible to identify anomalies, bottlenecks, and potential security threats
    in real time. Furthermore, it can decode and analyze data from different network
    protocols, providing a versatile tool for IT professionals, network administrators,
    and developers to optimize and secure their networks.


    ## Features


    Wireshark has several features that make it a powerful tool for network analysis:


    - Deep inspection of hundreds of protocols.

    - Live capture and offline analysis.

    - Ability to read/write many different capture file formats.

    - Filtering and coloring rules can be applied for more effective analysis.

    - Rich VoIP (Voice over IP) analysis.


    ## Installation of Wireshark


    Begin by updating your system''s package list using the following command:


    ```bash

    sudo apt update

    ```


    After updating the system, install Wireshark using the command:


    ```bash

    sudo apt install wireshark

    ```


    During the installation, a popup window will appear asking whether non-superusers
    should be able to capture packets. Choose “Yes” if you want to allow this.


    After the installation process completes, you can verify it by typing:


    ```bash

    wireshark --version

    ```


    This will display the version of Wireshark that you installed.


    ## Wireshark Configuration


    Start Wireshark from the terminal by just typing wireshark and pressing Enter.
    Alternatively, it should also appear in your system''s application menu.


    When Wireshark opens, you will see a list of the network interfaces on your system.
    Click the name of the interface that you want to capture data from. This will
    start the capture process.


    You can filter the traffic using the “Apply a display filter” field. For example,
    typing http will only display HTTP traffic.


    Click the Stop button to stop capturing traffic. Now you can analyze the traffic
    in detail.


    ## Exploring Tcpdump


    ## About Tcpdump


    Tcpdump is a versatile command-line packet analyzer tool prevalent in Unix and
    Linux distributions. Essentially, it''s a network monitoring tool that allows
    users to capture or “sniff” TCP/IP packets and other types of data packets in
    real time, flowing in and out of network interfaces. By capturing these packets,
    users can diagnose network issues, analyze network performance, or scrutinize
    the data traffic on a network. Its command-line interface ensures a lightweight
    footprint, making it an efficient and powerful tool for network analysis and troubleshooting,
    whether it''s for understanding network protocols, crafting security policies,
    or investigating network anomalies.


    ## Features


    - **Versatile:** tcpdump can capture or “sniff” traffic on any network to which
    the computer is attached.

    - **Expressive:** Its filtering capability allows users to zero in on traffic
    based on specific criteria.


    This command reads packets from filename.pcap.


    Capture ICMP packets using a filter:


    ```bash

    sudo tcpdump icmp

    ```


    ## Summary


    In this chapter, we deeply delved into the vital area of network troubleshooting.
    We started by understanding the network troubleshooting methodology, a systematic
    approach often used by network administrators to identify, diagnose, propose solutions,
    test, and document network problems. This methodology is crucial to avoid recurrent
    issues and maintain a reliable network infrastructure.


    Next, we explored essential network troubleshooting tools, beginning with “ping”,
    a simple yet effective tool used to verify network host reachability and network
    latency. We then covered “tracert” (traceroute), a powerful command-line tool
    used to track the path that a packet takes from the source system to the destination
    system. Moving on, we discussed “nslookup”, a command-line tool used for querying
    the DNS (Domain Name System) to obtain domain name or IP address mappings, and
    other DNS records. We also went through “netstat”, a versatile tool that provides
    information and statistics about protocols in use and current TCP/IP network connections.

