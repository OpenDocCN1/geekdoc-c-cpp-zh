    ### 总结


    总而言之，我们深入探讨了网络接口，并阐述了对 IP 地址和子网的概念性理解。我们全面概述了 Windows 和 Linux 平台上的网络接口，帮助你掌握这些接口在网络环境中的功能和作用。我们还介绍了
    IP 地址和子网划分相关的重要概念，为更好地理解网络基础设施奠定基础。


    随后，我们转向执行子网划分和 IP 配置的实践方面。虽然 C++ 本身并不提供用于 IP 配置或子网划分的工具，但我们演示了它如何与系统工具以及 ASIO
    和 POCO 等库进行接口交互。内容涵盖从检索和处理 IP 地址到调用特定于系统的命令来修改网络设置等各个方面。我们还提醒注意直接从 C++ 程序更改网络设置可能带来的安全隐患。


    ## 第 4 章：应用层协议


    ### 应用层


    应用层是开放系统互连（OSI）模型和互联网协议套件（TCP/IP 模型）中的最高层，这些概念模型描述了不同网络协议如何交互并协同工作以提供网络服务。网络应用和用户进程位于这一层，人与网络的交互也发生在这里。应用层的主要目的是为应用提供一组接口，以获取网络服务；这些服务可以简单到文件传输，也可以复杂到电子商务。它提供协议和服务以促进应用之间的通信，并抽象掉其下方网络栈的复杂性。


    应用层中的协议最接近最终用户，并使用户能够与网络交互。这些协议旨在提供用户友好的界面，并为用户提供多种服务，例如电子邮件（SMTP、IMAP）、文件传输（FTP）、网页浏览（HTTP、HTTPS）和域名解析（DNS）等。应用层的一个重要特征是它承载与网络无关的协议。这些协议可以运行在任何传输层协议之上，例如传输控制协议（TCP）或用户数据报协议（UDP）。


    作为网络管理员或面向网络的开发者，理解应用层协议至关重要，因为它们直接影响网络服务的功能和性能。正确理解这些协议有助于排查网络问题、优化网络性能以及开发新的网络应用或服务。


    既然已经介绍了应用层，我们就可以深入探讨 HTTP、HTTPS、FTP、SMTP、IMAP 和 DNS 等具体协议。


    ### HTTP（超文本传输协议）


    超文本传输协议（HTTP）是一种基础的无状态协议，主要用于万维网中，以促进客户端系统与服务器之间的通信。这种客户端-服务器协议通过处理客户端发送给服务器的请求，然后由服务器作出适当响应来运作。这种请求-响应模型在交换
    HTML 文档以及大量其他基于 Web 的资源方面发挥着重要作用。


    在底层，HTTP 利用传输控制协议（TCP）作为其骨干传输协议。这种组合可确保数据包在网络上的可靠且有序交付。HTTP 协议包含多种方法，例如 GET、POST、DELETE
    和 PUT，每种方法在请求和检索不同类型的 Web 资源时都有独特用途。然而，HTTP 的一个重大缺点是不具备加密。缺少加密意味着数据（包括可能敏感的信息）以明文形式通过网络传输，这使其容易遭受窃听和数据窃取。因此，HTTP
    通常需要额外的安全机制来保护传输中的数据。


    ### HTTPS（安全超文本传输协议）


    HTTPS 代表安全超文本传输协议，本质上是 HTTP 的增强安全版本，用于互联网上的数据通信。其主要目的是通过加密客户端（通常是 Web 浏览器）与服务器之间传输的数据，为信息交换提供安全环境。这种加密通过名为传输层安全（TLS）的协议实现，以前则通过其前身安全套接层（SSL）实现。


    通过使用 HTTPS，交换的信息几乎不可能被第三方截获或篡改，从而确保数据完整性和机密性。在处理信用卡详细信息、社会安全号码和登录凭据等敏感信息时，这种加密尤其关键，使
    HTTPS 成为处理此类数据的网站的标准要求。此外，HTTPS 的使用已扩展到敏感网站之外，成为所有网站与用户建立信任并提高搜索引擎排名的最佳实践。


    ### FTP（文件传输协议）


    文件传输协议（FTP）是一种久经考验的方法，用于在互联网上的系统之间移动文件。它是一种标准网络协议，基于客户端-服务器模型运行。在该模型中，客户端向服务器发起连接，之后便可开始文件传输。FTP
    的一个决定性特征是使用两条独立连接分别进行控制 and 数据传输。控制连接用于发送命令和接收响应，而实际数据通过数据连接传输。


    FTP 的一个显著特征是其明文认证系统，通常需要用户名和密码。然而，这可能带来安全风险，因为登录详细信息以未加密形式发送，容易受到网络嗅探。尽管出现了更安全的替代方案，FTP
    仍因其简单性和广泛支持而在全球范围内被广泛使用。尽管存在漏洞，FTP 仍然是互联网基础设施的关键组成部分。


    ### SMTP（简单邮件传输协议）


    简单邮件传输协议（通常称为 SMTP）是一种成熟的标准协议，专门用于在网络中的服务器之间传输电子邮件消息。它主要在互联网上运行，通过促进服务器系统之间的电子邮件传输，充当任何电子邮件投递系统的骨干。无论邮件系统的规模或复杂程度如何，大多数（即使不是全部）都使用
    SMTP 来处理出站邮件传输。


    该协议具有双重用途：它还用于从电子邮件客户端（如 Outlook 或 Thunderbird）向邮件服务器发送邮件，以便进一步路由。一旦邮件成功传输并存储在收件人的邮件服务器上，就可以使用电子邮件客户端获取并阅读。这种检索通常使用邮局协议（POP）或互联网消息访问协议（IMAP）执行，它们负责访问和管理服务器上存储的邮件。因此，SMTP
    在整个电子邮件通信过程中起着至关重要的作用。


    ### IMAP（互联网消息访问协议）


    互联网消息访问协议（IMAP）是一种重要的互联网标准协议，在管理和从邮件服务器检索电子邮件方面起着关键作用。与其前身 POP3 不同（POP3 需要将电子邮件下载到本地系统），IMAP
    允许用户直接在服务器上访问其电子邮件消息。这一显著特性为用户提供了便利，只要具备互联网连接，就可以从任何设备访问电子邮件。此外，IMAP 支持从多个客户端或客户端“会话”同时访问，从而促进稳健的多设备可访问性。用户可以从各种


    '
