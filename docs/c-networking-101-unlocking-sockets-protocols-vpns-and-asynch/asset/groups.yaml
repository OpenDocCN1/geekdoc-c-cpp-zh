    \ Channels in NS-3 simulate the medium through which packets travel, such as wireless\
    \ radio frequency spectrum or wired cables. The channel you choose depends on\
    \ the type of network being simulated.\n\n#### Install the network stack\n\nNext,\
    \ you'll need to install the network stack on each node. The network stack includes\
    \ the protocols that enable network communication, such as Internet Protocol (IP),\
    \ Transmission Control Protocol (TCP), or User Datagram Protocol (UDP). These\
    \ protocol stacks dictate how data is sent and received across the network.\n\n\
    #### Assign IP addresses\n\nOnce the network stack is installed, assign unique\
    \ IP addresses to each network device. This process is similar to how devices\
    \ on an actual network are assigned unique identifiers to facilitate communication.\n\
    \n#### Create and install applications\n\nFinally, create and install applications\
    \ on the nodes. Applications in NS-3 generate network traffic, simulating the\
    \ real-world data that flows over the network. Examples could include a simple\
    \ ping application that sends ICMP echo requests, or more complex applications\
    \ simulating voice over IP or video streaming.\n\nNS-3 simulations are very flexible\
    \ and can range from simple examples with just a few nodes to complex simulations\
    \ of large networks with hundreds or thousands of nodes. By providing a controlled,\
    \ reproducible environment for network experiments, NS-3 is a valuable tool for\
    \ network professionals and researchers.\n\n## Setting up Network Simulation using\
    \ NS-3\n\nLet us simulate a simple network with two nodes connected by a point-to-point\
    \ link.\n\n#### Install NS-3\n\nBefore we begin, ensure that NS-3 is installed\
    \ on your system. You can download it from the official NS-3 website and follow\
    \ the installation instructions for your specific operating system.\n\n#### Create\
    \ a new simulation script\n\nCreate a new C++ file for your simulation. Let us\
    \ call it simple-network.cc. This script will be where we configure our network\
    \ and run our simulation.\n\n#### Include necessary header files\n\nWe need to\
    \ include the necessary NS-3 header files. For our simple simulation, we'll need\
    \ the following:\n\n```cpp\n#include \"ns3/core-module.h\"\n#include \"ns3/network-module.h\"\
    \n#include \"ns3/internet-module.h\"\n#include \"ns3/point-to-point-module.h\"\
    \n#include \"ns3/applications-module.h\"\n```\n\n#### Set up the main function\n\
    \nAll NS-3 simulations start with a main function, which looks like this:\n\n\
    ```cpp\nint main (int argc, char *argv[])\n{\n    // Simulation code here\n  \
    \  return 0;\n}\n```\n\n#### Create nodes\n\nCreate two nodes and install the\
    \ Internet stack on them:\n\n```cpp\nns3::NodeContainer nodes;\nnodes.Create (2);\n\
    \nns3::InternetStackHelper stack;\nstack.Install (nodes);\n```\n\n#### Create\
    \ a point-to-point link\n\nWe'll connect our nodes using a point-to-point link:\n\
    \n```cpp\nns3::PointToPointHelper pointToPoint;\npointToPoint.SetDeviceAttribute\
    \ (\"DataRate\", StringValue (\"5Mbps\"));\npointToPoint.SetChannelAttribute (\"\
    Delay\", StringValue (\"2ms\"));\n\nNetDeviceContainer devices;\ndevices = pointToPoint.Install\
    \ (nodes);\n```\n\n#### Assign IP addresses\n\nWe'll assign IP addresses to the\
    \ nodes:\n\n```cpp\nns3::Ipv4AddressHelper address;\naddress.SetBase (\"10.1.1.0\"\
    , \"255.255.255.0\");\nns3::Ipv4InterfaceContainer interfaces = address.Assign\
    \ (devices);\n```\n\n#### Set up applications\n\nLet us set up a simple UDP echo\
    \ server and client. The server will be on the first node, and the client on the\
    \ second:\n\n```cpp\nUdpEchoServerHelper echoServer (9);\nApplicationContainer\
    \ serverApps = echoServer.Install (nodes.Get (0));\nserverApps.Start (Seconds\
    \ (1.0));\nserverApps.Stop (Seconds (10.0));\n\nUdpEchoClientHelper echoClient\
    \ (interfaces.GetAddress (0), 9);\nechoClient.SetAttribute (\"MaxPackets\", UintegerValue\
    \ (1));\nechoClient.SetAttribute (\"Interval\", TimeValue (Seconds (1.0)));\n\
    echoClient.SetAttribute (\"PacketSize\", UintegerValue (1024));\n\nApplicationContainer\
    \ clientApps = echoClient.Install (nodes.Get (1));\nclientApps.Start (Seconds\
    \ (2.0));\nclientApps.Stop (Seconds (10.0));\n```\n\n### Run the simulation\n\n\
    Finally, we run the simulation:\n\n```cpp\nns3::Simulator::Run ();\nns3::Simulator::Destroy\
    \ ();\n```\n\n### Build and run\n\nTo build and run your simulation, use the `./waf`\
    \ command in the NS-3 directory:\n\n```\n./waf --run simple-network\n```\n\nAnd\
    \ we are done. This is easily doable network simulation with two nodes communicating\
    \ over a point-to-point link. The NS-3 framework is incredibly flexible and powerful,\
    \ and you can create far more complex simulations by adding more nodes, different\
    \ types of links, different applications, and much more.\n\n## Summary\n\nThis\
    \ chapter dove into the realm of network testing and simulation, critical tools\
    \ in the network administrator's arsenal for ensuring the reliability, efficiency,\
    \ and robustness of network systems. We began with an overview of network testing\
    \ methodologies and the essential role they play in maintaining the health of\
    \ our networks. We further identified how using C++ libraries contributes to network\
    \ performance enhancement, stress testing, and security testing.\n\nWe discussed\
    \ and practically demonstrated two crucial testing methodologies: Functional and\
    \ Performance testing. We learned how Functional Testing ensures the correct operation\
    \ of the network's individual components, providing a robust foundation. Performance\
    \ Testing, on the other hand, evaluates the network's efficiency under various\
    \ loads and conditions, providing insights for optimization. We learned how to\
    \ apply these methods practically, using tools and techniques available in C++.\n"
  mdcn: "\n一种用于设计和测试新网络协议、架构或修改的有效工具。\n\n- 真实环境测试：NS-3 可以与真实网络对接，从而支持“混合”仿真，即网络的一部分是仿真出来的，另一部分是真实运行的网络。这对于在将新协议或配置部署到真实网络之前进行测试非常有价值。\n\
    - C++ 和 Python API：NS-3 同时提供 C++ 和 Python 接口。这为设计仿真提供了灵活性，并允许你使用最适合自身需求的语言。对于大量使用\
    \ C++ 的网络专业人员来说，NS-3 提供了利用其现有技能和知识的机会。\n- 模块：NS-3 中的功能按模块组织。每个模块封装网络功能的某个特定领域或某种特定网络协议。例如，有用于\
    \ TCP、UDP、以太网、WiFi、Internet 路由协议等的模块。\n- 与其他工具集成：NS-3 可以与其他工具集成以进行进一步分析。例如，它可以生成\
    \ PCAP 文件，以便在 Wireshark 中进行数据包级分析。它还可以与可视化工具对接，以图形方式表示网络仿真。\n\n## 使用 NS-3 进行网络仿真\n\
    \n### 网络仿真的流程\n\n要在 C++ 中使用 NS-3 搭建网络仿真，通常需要遵循以下步骤：\n\n#### 创建节点\n\n首先，创建节点。在\
    \ NS-3 中，节点是能够在网络中发送或接收数据包的实体，充当终端系统或路由器。每个节点都是网络中一台计算机主机的抽象，能够运行网络协议。\n\n####\
    \ 创建并配置网络设备\n\n其次，创建并配置网络设备。网络设备（例如 Wi-Fi 设备、以太网设备或点对点设备）会连接到节点。这些设备使节点能够发送和接收数据包。根据你所建模网络的复杂程度，每个节点可以有一个或多个网络设备。\n\
    \n#### 创建并配置信道\n\n第三步是创建并配置信道。NS-3 中的信道模拟数据包传输所经过的介质，例如无线射频频谱或有线电缆。你选择的信道取决于所仿真的网络类型。\n\
    \n#### 安装网络协议栈\n\n接下来，你需要在每个节点上安装网络协议栈。网络协议栈包含支持网络通信的协议，例如 Internet 协议（IP）、传输控制协议（TCP）或用户数据报协议（UDP）。这些协议栈决定了数据在网络中如何发送和接收。\n\
    \n#### 分配 IP 地址\n\n安装网络协议栈后，为每个网络设备分配唯一的 IP 地址。这个过程类似于实际网络中的设备被分配唯一标识符以促进通信。\n\
    \n#### 创建并安装应用\n\n最后，在节点上创建并安装应用。NS-3 中的应用会生成网络流量，模拟网络中流动的真实数据。示例包括发送 ICMP 回显请求的简单\
    \ ping 应用，或模拟 VoIP 或视频流的更复杂应用。\n\nNS-3 仿真非常灵活，既可以是只有几个节点的简单示例，也可以是对包含数百或数千个节点的大型网络进行复杂仿真。NS-3\
    \ 为网络实验提供了受控、可复现的环境，是网络专业人员和研究人员的宝贵工具。\n\n## 使用 NS-3 搭建网络仿真\n\n让我们仿真一个由点对点链路连接两个节点的简单网络。\n\
    \n#### 安装 NS-3\n\n在开始之前，请确保你的系统上已安装 NS-3。你可以从 NS-3 官方网站下载，并按照针对你所用操作系统的安装说明进行操作。\n\
    \n#### 创建新的仿真脚本\n\n为你的仿真创建一个新的 C++ 文件。我们将其命名为 simple-network.cc。这个脚本将用于配置网络并运行仿真。\n\
    \n#### 包含必要的头文件\n\n我们需要包含必要的 NS-3 头文件。对于这个简单仿真，我们需要以下内容：\n\n```cpp\n#include \"\
    ns3/core-module.h\"\n#include \"ns3/network-module.h\"\n#include \"ns3/internet-module.h\"\
    \n#include \"ns3/point-to-point-module.h\"\n#include \"ns3/applications-module.h\"\
    \n```\n\n#### 设置主函数\n\n所有 NS-3 仿真都从 main 函数开始，其形式如下：\n\n```cpp\nint main (int\
    \ argc, char *argv[])\n{\n    // Simulation code here\n    return 0;\n}\n```\n\
    \n#### 创建节点\n\n创建两个节点，并在它们上面安装 Internet 协议栈：\n\n```cpp\nns3::NodeContainer nodes;\n\
    nodes.Create (2);\n\nns3::InternetStackHelper stack;\nstack.Install (nodes);\n\
    ```\n\n#### 创建点对点链路\n\n我们将使用点对点链路连接节点：\n\n```cpp\nns3::PointToPointHelper pointToPoint;\n\
    pointToPoint.SetDeviceAttribute (\"DataRate\", StringValue (\"5Mbps\"));\npointToPoint.SetChannelAttribute\
    \ (\"Delay\", StringValue (\"2ms\"));\n\nNetDeviceContainer devices;\ndevices\
    \ = pointToPoint.Install (nodes);\n```\n\n#### 分配 IP 地址\n\n我们将为节点分配 IP 地址：\n\n\
    ```cpp\nns3::Ipv4AddressHelper address;\naddress.SetBase (\"10.1.1.0\", \"255.255.255.0\"\
    );\nns3::Ipv4InterfaceContainer interfaces = address.Assign (devices);\n```\n\n\
    #### 设置应用\n\n让我们设置一个简单的 UDP 回显服务器和客户端。服务器位于第一个节点上，客户端位于第二个节点上：\n\n```cpp\nUdpEchoServerHelper\
    \ echoServer (9);\nApplicationContainer serverApps = echoServer.Install (nodes.Get\
    \ (0));\nserverApps.Start (Seconds (1.0));\nserverApps.Stop (Seconds (10.0));\n\
    \nUdpEchoClientHelper echoClient (interfaces.GetAddress (0), 9);\nechoClient.SetAttribute\
    \ (\"MaxPackets\", UintegerValue (1));\nechoClient.SetAttribute (\"Interval\"\
    , TimeValue (Seconds (1.0)));\nechoClient.SetAttribute (\"PacketSize\", UintegerValue\
    \ (1024));\n\nApplicationContainer clientApps = echoClient.Install (nodes.Get\
    \ (1));\nclientApps.Start (Seconds (2.0));\nclientApps.Stop (Seconds (10.0));\n\
    ```\n\n### 运行仿真\n\n最后，我们运行仿真：\n\n```cpp\nns3::Simulator::Run ();\nns3::Simulator::Destroy\
    \ ();\n```\n\n### 构建并运行\n\n要构建并运行仿真，请在 NS-3 目录中使用 `./waf` 命令：\n\n```\n./waf --run\
    \ simple-network\n```\n\n至此完成。这是一个简单易行的网络仿真：两个节点通过点对点链路通信。NS-3 框架极其灵活且强大，你可以通过添加更多节点、不同类型的链路、不同的应用等来创建复杂得多的仿真。\n\
    \n## 总结\n\n本章深入探讨了网络测试与仿真领域，这些是网络管理员工具库中的关键工具，用于确保网络系统的可靠性、效率和稳健性。我们首先概述了网络测试方法及其在维护网络健康状况中的重要作用。我们进一步明确了使用\
    \ C++ 库如何有助于网络性能增强、压力测试和安全测试。\n\n我们讨论并实际演示了两种关键测试方法：功能性测试和性能测试。我们学习了功能性测试如何确保网络各组件正确运行，从而提供坚实的基础。另一方面，性能测试评估网络在各种负载和条件下的效率，为优化提供洞见。我们学习了如何使用\
    \ C++ 中可用的工具和技术，实际应用这些方法。\n\n"
