    \ DNS 记录保存着域的关键信息，如 IP 地址（A 记录）、邮件服务器（MX 记录）或别名（CNAME 记录）。该系统确保了无缝的互联网导航。\n\n\
    ### DNS 查询的类型\n\nDNS 查询有几种类型：\n\n- 递归查询：在递归查询中，DNS 客户端要求查询得到完整的答案，DNS 服务器必须返回\
    \ IP 地址或错误消息。\n- 迭代查询：在迭代查询中，DNS 服务器使用其本地 DNS 数据库返回其所能提供的最佳答案。如果没有匹配项，它会返回一个指向域命名空间较低级别权威\
    \ DNS 服务器的引用。\n- 非递归查询：非递归查询通常由 DNS 服务器发送给其他 DNS 服务器，而不是由客户端发送。\n\nC++ 中的 Boost\
