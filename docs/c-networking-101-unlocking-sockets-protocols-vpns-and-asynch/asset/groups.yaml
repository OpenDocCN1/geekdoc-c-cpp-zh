  mdcn: "\n## 前言\n\n本书对于有志于深化网络概念理解、同时强化 C++ 编程技能的网络管理员来说，是一份宝贵的资源。本书共十一章，弥合了网络管理与编程之间的鸿沟，为读者提供了一种掌握网络运营的整体方法。读者首先深入探讨\
    \ TCP/IP 模型、套接字和协议等网络基础知识。随后进入实践编程，使用 C++ 建立 TCP/UDP 客户端-服务器连接、处理网络错误，并应对 HTTP/HTTPS、FTP、SMTP、IMAP\
    \ 和 DNS 等应用层协议。\n\n接着，本书引导读者了解虚拟专用网络（VPN），详细说明其重要性、工作原理以及不同类型的 VPN。本书探讨无线网络和异步编程，清晰展示使用\
    \ C++ 设置 WiFi、蓝牙和 Zigbee 的方法。内容涵盖关键无线标准和安全协议。为了帮助读者全面理解，本书演示如何使用 C++ 进行网络配置管理，以自动化关键网络运营任务，从而凸显编程在网络管理中的力量。\n\
    \n高级主题包括网络测试与仿真，帮助读者深入了解性能提升和网络稳健性。对网络监控的详细探讨增强了读者的技能，教授进行故障、性能、安全和账户监控的方法。最后，本书以网络故障排除收尾，阐明若干重要的网络故障排除工具和方法。\n\
    \n通过本书，你将学会如何：\n\n- 通过动手 C++ 编程理解 TCP/IP 模型和协议。\n- 掌握 TCP/UDP 客户端-服务器连接和错误处理。\n\
    - 掌握 HTTP/HTTPS、FTP、SMTP、IMAP 和 DNS 等应用层协议。\n- 了解 VPN 的重要性与用途，以及如何设置 VPN。\n- 学习无线网络和异步编程。\n\
    - 深入了解网络配置管理。\n- 理解网络测试方法和仿真。\n- 学习使用 Nagios 监控网络的各个方面。\n- 了解重要的网络故障排除工具和方法。\n\
    - 通过 C++ 编程提升网络性能和可靠性。\n\n本书的精髓在于其实践方法。本书配有大量插图、代码片段和 C++ 动手练习，是任何希望成为合格网络管理员并掌握编程力量之人的权威指南。\n\
    \n## 序言\n\n在浩瀚的数字宇宙中，有一种力量使人们能够轻松导航、时刻保持连接并进行机密对话。网络是现代数字通信背后的驱动力，并充当其支点。由于在可预见的未来，世界将继续高度依赖数字互动，因此对训练有素、能够担任计算机网络管理员的人才需求将持续增长。然而，对熟练网络管理员不断增长的需求与现有此类管理员的供给之间存在差距。《C++\
    \ 网络编程 101》的作者希望填补这一空白。\n\n这项名为《C++ 网络编程 101》的计划不仅仅是一本书；它是一项培养新一代网络管理员的努力，使他们准备好应对当前和可预见未来的数字通信挑战。本书的编排方式能够逐步向读者传授该工作所需的知识和实践技能。有志成为网络管理员的读者将从本书中受益，因为它将帮助他们全面理解各种网络概念，同时提升\
    \ C++ 编程能力。首先，我们介绍网络基础知识，包括协议和 TCP/IP 模型。然后，我们逐步进入更高级的主题，包括虚拟专用网络（VPN）、无线网络、异步编程、网络配置管理和网络测试。\n\
    \n每一章都经过精心编写，以确保你理解当前网络主题、看到其在 C++ 中的实现，并最终见证其实际演示。这样做是为了为你提供尽可能最佳的学习体验。真实示例与深入案例研究为教学过程增添了趣味性和相关性。读完本书后，你不仅会理解网络管理员的职责，还将具备使用\
    \ C++ 履行这些职责所需的技能。\n\n我想鼓励你与我一起踏上这段旅程，去发现网络的迷人世界。利用 C++ 的力量破解网络管理的复杂性，将使我们找到成为熟练网络管理员的道路。让我们开始旅程吧！\n\
    \n## C++ 网络编程 101\n\n### 借助 75+ 个示例程序解锁套接字、协议、VPN 和异步 I/O\n\nAnaïs Sutherland\n\
