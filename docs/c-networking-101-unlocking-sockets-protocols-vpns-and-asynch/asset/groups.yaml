    ### 使用 C++ 的 NETCONF


    NETCONF 采用客户端-服务器模型运行，其中网络设备是服务器，网络管理系统是客户端。客户端与服务器之间的通信通过可靠、面向连接的协议（如 SSH）进行。客户端与服务器之间交换的消息采用
    XML 编码，并遵循远程过程调用（RPC）范式。


    这意味着客户端发送执行某项操作的请求（一个 RPC），服务器则返回应答。NETCONF 中的操作包括 get、edit-config、delete-config、copy-config、lock
    和 unlock。这些命令允许检索、修改以及锁定/解锁配置数据。


    ### NETCONF 流程


    通过 SSH 建立和管理 NETCONF 会话是一个多步骤过程，涉及客户端与服务器之间的一系列交互。它包括建立 SSH 连接、初始化 NETCONF 会话、发送
    NETCONF 请求、处理响应，以及最终关闭会话。该过程是网络管理任务的基础，使网络设备的配置和监控成为可能。


    让我们分解使用 C++ 设置 NETCONF 客户端的过程。


    ### 建立 SSH 连接


    第一阶段是建立 SSH 连接。由于大多数 NETCONF 实现使用 SSH 作为传输协议，建立 SSH 连接构成了 NETCONF 会话的基础。为此，使用
    libssh 之类的 SSH 库来设置 SSH 会话、认证客户端，并打开用于客户端与服务器之间通信的通道。认证可以使用用户名/密码或公钥方法完成。


    ### 初始化 NETCONF 会话


    在 SSH 连接之后，下一步是初始化 NETCONF 会话。这涉及客户端与服务器之间交换 hello 消息，以协商 NETCONF 能力。客户端发送一条包含其支持的
    NETCONF 能力的 hello 消息，服务器则用自己的 hello 消息响应，概述其能力。这种交换使双方能够理解并适应彼此的能力，为后续通信奠定基础。


    ### 发送 NETCONF 请求


    NETCONF 会话启动后，客户端可以开始发送 NETCONF 请求。这些请求本质上是采用 XML 格式并通过 SSH 通道发送的远程过程调用（RPC）消息。可以使用
    libxml2 等库生成这些 XML 消息。这些消息可用于各种操作，如检索配置数据、修改配置数据或调用特定操作。


    ### 处理 NETCONF 响应


    发送请求后，客户端必须处理服务器返回的相应响应。这涉及从 SSH 通道读取数据、解析 XML 响应，然后处理结果。

