    # Example 3: Increasing the Timeout


    You can also increase the timeout period (the time that ping waits for a reply
    before giving up) with the -W option on Linux/macOS or -w on Windows. The timeout
    value is in seconds.


    On Linux/macOS:


    ```

    `ping -c 3 -W 10 www.google.com (wait for up to 10 seconds for a reply)`

    ```


    On Windows:


    ```

    `ping -n 3 -w 10000 www.google.com (wait for up to 10000 milliseconds, or 10 seconds,
    for a reply)`

