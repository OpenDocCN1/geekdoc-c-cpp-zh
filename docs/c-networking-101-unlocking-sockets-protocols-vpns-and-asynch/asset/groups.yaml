    ## 使用 Tracert/Traceroute


    tracert 命令（在 Linux 和 macOS 上称为 traceroute）是一个命令行工具，用于跟踪并显示数据包在网络中到达目的地所经过的路由。它显示数据包到达目的地所经过的一系列
    IP 地址。该工具在排查网络问题时特别有用，因为它有助于确定问题发生在路径上的哪个位置。


    下面是其详细工作原理：


    要使用 tracert 或 traceroute，请打开命令行界面，输入 tracert（在 Windows 上）或 traceroute（在 Linux
    或 macOS 上），后面跟上目标主机的 IP 地址或域名。例如，tracert www.google.com 或 traceroute www.google.com。


    然后，该工具会向目的地发送数据包，并列出沿途的每个路由器或跳。每一行代表一跳，并显示该跳路由器的 IP 地址（通常还有域名）。现在，让我们看几个示例：


    ## 示例 1：基本 Traceroute


    在终端中，输入 tracert www.google.com（在 Windows 上）或 traceroute www.google.com（在 Linux
    或 macOS 上）。这将开始跟踪数据包从你的机器到 Google 服务器所经过的路由。每一行代表路由上的一跳。


    ## 示例 2：指定跳数


    有时，你可能希望限制 traceroute 在放弃前尝试的跳数。为此，可以使用 `-h` 选项，后面跟上最大跳数。例如：


    在 Linux/macOS 上：


    ```bash

    traceroute -m 5 www.google.com

    ```


    （跟踪到 Google 服务器的路由，但在 5 跳后放弃。）


    在 Windows 上，你可以像这样使用 `-h` 选项：


    ```bash

    tracert -h 5 www.google.com

    ```


    ## 使用 Nslookup


    nslookup 命令是一种网络管理工具，用于查询域名系统（DNS），以获取域名或 IP 地址映射，或其他特定的 DNS 记录。它代表“名称服务器查找”。该工具可从命令行界面使用，并且大多数联网计算机系统都提供该工具。


    下面是其详细工作原理：


    要使用 nslookup，请打开命令行界面，输入 nslookup，后面跟上你要查询的域名或 IP 地址。例如，nslookup www.google.com。


    然后，该工具将返回与该域名关联的域名或 IP 地址，以及提供该信息的名称服务器。


    现在，让我们看几个示例：


    ### 示例 1：基本 Nslookup


    ## 使用 Netstat


    netstat 命令（网络统计）是一种命令行工具，用于显示网络连接（传入和传出）、路由表，以及许多网络接口和网络协议统计信息。它可用于检查网络的整体健康状况、了解防火墙的工作效果，并发现可疑的网络活动。


    要使用 netstat，请打开命令行界面并输入 netstat，后面可能跟一些选项。默认情况下，它会显示其支持的每种协议的活动套接字列表。现在，让我们看几个示例：


    ### 示例 1：基本 Netstat


    在终端中，输入 netstat。这将列出所有当前网络连接，以及所使用的协议、本地和外部地址，以及连接状态。


    ### 示例 2：仅显示监听套接字


    你可以使用 netstat 仅显示正在监听传入连接的套接字。为此，你可以输入 netstat -l。这对于快速检查你的机器上有哪些服务正在等待连接很有用。


    ### 示例 3：显示统计信息


    Netstat 还可以显示每种网络协议的统计信息。为此，你可以输入 netstat -s。这将打印每种协议的详细统计信息，例如接收、发送、丢弃的数据包数量等。


    ### 示例 4：持续显示网络状态


    要让 netstat 持续刷新网络状态，可以使用 `-c` 选项，例如 netstat -c。这将每秒刷新一次信息，使你能够实时监控网络变化。


    ## 探索 Wireshark


    ## Wireshark 简介


    Wireshark 是一款强大的开源工具，可对网络流量进行深入检查，因此对于网络故障排查和协议分析非常宝贵。其功能涵盖多个领域，例如软件和通信协议开发，实际上可作为网络健康状况的诊断显微镜。Wireshark
    捕获并显示网络中传输的数据包，从而提供流量细节的细粒度视图。这种详细洞察使实时识别异常、瓶颈和潜在安全威胁成为可能。此外，它还可以解码和分析来自不同网络协议的数据，为
    IT 专业人员、网络管理员和开发人员提供多功能工具，以优化并保护其网络。


    ## 功能


    Wireshark 具有多项功能，使其成为网络分析的强大工具：


    - 对数百种协议进行深入检查。

    - 实时捕获和离线分析。

    - 能够读取/写入多种不同的捕获文件格式。

    - 可以应用过滤和着色规则，以进行更有效的分析。

    - 丰富的 VoIP（IP 语音）分析。


    ## Wireshark 的安装


    首先，使用以下命令更新系统的软件包列表：


    ```bash

    sudo apt update

    ```


    更新系统后，使用以下命令安装 Wireshark：


    ```bash

    sudo apt install wireshark

    ```


    安装过程中会出现一个弹出窗口，询问非超级用户是否应能够捕获数据包。如果希望允许此操作，请选择“是”。


    安装过程完成后，你可以通过输入以下命令进行验证：


    ```bash

    wireshark --version

    ```


    这将显示你安装的 Wireshark 版本。


    ## Wireshark 配置


    在终端中只需输入 wireshark 并按 Enter 即可启动 Wireshark。或者，它也应该出现在系统的应用程序菜单中。


    打开 Wireshark 后，你将看到系统上的网络接口列表。单击要从中捕获数据的接口名称。这将启动捕获过程。


    你可以使用“应用显示过滤器”字段过滤流量。例如，输入 http 将仅显示 HTTP 流量。


    单击“停止”按钮停止捕获流量。现在你可以详细分析流量。


    ## 探索 Tcpdump


    ## Tcpdump 简介


    Tcpdump 是一种多功能的命令行数据包分析工具，常见于 Unix 和 Linux 发行版中。本质上，它是一种网络监控工具，允许用户实时捕获或“嗅探”流经网络接口的
    TCP/IP 数据包及其他类型的数据包。通过捕获这些数据包，用户可以诊断网络问题、分析网络性能，或审查网络上的数据流量。其命令行界面确保了轻量级占用，使其成为网络分析和故障排查的高效而强大的工具，无论是用于理解网络协议、制定安全策略，还是调查网络异常。


    ## 功能


    - **多功能：** tcpdump 可以捕获或“嗅探”计算机所连接的任何网络上的流量。

    - **表达力强：** 其过滤功能允许用户根据特定条件聚焦于流量。


    此命令从 filename.pcap 读取数据包。


    使用过滤器捕获 ICMP 数据包：


    ```bash

    sudo tcpdump icmp

    ```


    ## 总结


    在本章中，我们深入探讨了网络故障排查这一重要领域。我们首先了解了网络故障排查方法，这是网络管理员常用的一种系统化方法，用于识别、诊断、提出解决方案、测试并记录网络问题。该方法对于避免问题反复出现和维持可靠的网络基础设施至关重要。


    接下来，我们探索了基本的网络故障排查工具，首先从“ping”开始，这是一个简单但有效的工具，用于验证网络主机的可达性和网络延迟。然后我们介绍了“tracert”（traceroute），这是一个强大的命令行工具，用于跟踪数据包从源系统到目标系统所经过的路径。接着，我们讨论了“nslookup”，这是一个用于查询
    DNS（域名系统）以获取域名或 IP 地址映射及其他 DNS 记录的命令行工具。我们还介绍了“netstat”，这是一个多功能工具，可提供有关正在使用的协议和当前
    TCP/IP 网络连接的信息与统计信息。


