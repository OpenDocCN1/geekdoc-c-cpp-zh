  mdcn: "\n以及使用第 1 章中讨论的库在 C++ 中进行 UDP 编程，提供动手示例和练习以帮助更好地理解。理解套接字和套接字编程对任何网络管理员来说都是基础，因为它构成了许多网络操作和应用程序的基础。\n\
    \n## TCP 客户端-服务器套接字编程\n\n让我们通过在 C++ 中创建一个简单的 TCP 客户端-服务器应用程序，将前几节/章学到的理论付诸实践。对于这个示例，我们将使用\
    \ Boost.Asio 库，它为网络编程提供了强大、一致且富有表现力的 C++ 接口。\n\n### 设置 Boost.Asio\n\n在开始之前，请确保你已在开发环境中安装并配置好\
    \ Boost.Asio 库。如果你需要复习如何操作，请回看第 1 章。\n\n### 服务器应用程序\n\n下面是一个基本的 TCP 回显服务器，它从客户端接收数据，并将相同的数据发送回客户端。\n\
    \n```cpp\n#include\nusing boost::asio::ip::tcp;\n\nint main() {\n  try {\n   \
    \ boost::asio::io_service io_service;\n    tcp::acceptor acceptor(io_service,\
    \ tcp::endpoint(tcp::v4(), 12345));\n\n    for (;;) {\n      tcp::socket socket(io_service);\n\
    \      acceptor.accept(socket);\n      std::array<char, 128> buf;\n      boost::system::error_code\
    \ error;\n\n      while (true) {\n        size_t len = socket.read_some(boost::asio::buffer(buf),\
    \ error);\n        if (error == boost::asio::error::eof)\n          break;\n \
    \       else if (error)\n          throw boost::system::system_error(error);\n\
    \        boost::asio::write(socket, boost::asio::buffer(buf, len));\n      }\n\
    \    }\n  }\n  catch (std::exception& e) {\n    std::cerr << e.what() << std::endl;\n\
    \  }\n  return 0;\n}\n```\n\n服务器在端口 12345 上监听新连接。当客户端连接时，服务器进入一个循环，从客户端读取数据并将相同的数据写回客户端。\n\
    \n### 客户端应用程序\n\n接下来，我们创建相应的 TCP 客户端，它连接到服务器、发送一些数据并接收响应。\n\n```cpp\n#include\n\
    \n#include\n\nusing boost::asio::ip::tcp;\n\nint main() {\n  try {\n    boost::asio::io_service\
    \ io_service;\n    tcp::resolver resolver(io_service);\n    tcp::resolver::query\
    \ query(tcp::v4(), \"localhost\", \"12345\");\n    tcp::resolver::iterator endpoint_iterator\
    \ = resolver.resolve(query);\n    tcp::socket socket(io_service);\n    boost::asio::connect(socket,\
    \ endpoint_iterator);\n    const std::string msg = \"Hello, World!\\n\";\n   \
    \ boost::asio::write(socket, boost::asio::buffer(msg, msg.size()));\n    std::array<char,\
    \ 128> buf;\n    boost::system::error_code error;\n\n    while (true) {\n    \
    \  size_t len = socket.read_some(boost::asio::buffer(buf), error);\n      if (error\
    \ == boost::asio::error::eof)\n        break;\n      else if (error)\n       \
    \ throw boost::system::system_error(error);\n      std::cout.write(buf.data(),\
    \ len);\n    }\n  }\n  catch (std::exception& e) {\n    std::cerr << e.what()\
    \ << std::endl;\n  }\n  return 0;\n}\n```\n\n客户端连接到运行在 localhost、端口 12345 上的服务器，发送一条“Hello,\
    \ World!\\n”消息，然后读取并打印服务器的响应。\n\n上述程序使用 Boost.Asio 库说明了 C++ 中基于套接字的 TCP 客户端-服务器编程基础。在接下来的章节中，我们将进一步增强这些程序，加入更复杂的交互和更高级的网络概念。\n\
    \n## UDP 客户端-服务器套接字编程\n\nUDP（用户数据报协议）是一种无连接协议，用于速度和效率很重要且可以接受少量数据丢失的应用。基于 UDP\
    \ 的应用示例包括 DNS 查询、视频流和在线多人游戏。现在，让我们使用 C++ 中的 Boost.Asio 库创建一个简单的 UDP 回显服务器和客户端。\n\
    \n### 服务器应用程序\n\n服务器将从客户端接收数据报，并将相同的数据发送回客户端。下面是 UDP 回显服务器的基本代码：\n\n```cpp\n#include\n\
