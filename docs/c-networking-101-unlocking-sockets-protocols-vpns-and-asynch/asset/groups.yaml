  mdcn: "\n定义了 operator() 方法的类的实例。\n函数指针和仿函数都是在 C++ 中定义和处理回调的有效手段，\n它们提供了灵活性，并增强了复杂软件系统的结构。\n\
    \n下面是一个使用函数指针的回调简单示例：\n\n```cpp\nvoid execute(void (*callbackFunc)(int), int value)\
    \ {\n    callbackFunc(value);\n}\n\nvoid printValue(int value) {\n    std::cout\
    \ << \"Value: \" << value << std::endl;\n}\n\nint main() {\n    execute(printValue,\
    \ 5);\n    return 0;\n}\n```\n\n在上面的示例程序中，printValue 函数就是在 execute 函数内部被调用的回调。\n\
    \n## Future 与 Promise\n\nC++ 标准库中的 promise 和 future 是管理异步操作的基本组件，尤其是在多线程编程中。promise\
    \ 对象本质上是一种数据结构，它持有某种类型的值，该值不会立即可用，而会在稍后计算或获取。随后，关联的 future 对象会访问这个值。\n\n另一方面，future\
    \ 对象提供了一种访问 promise 结果的机制。它会“等待” promise 兑现，并提供所承诺的值。重要的一点是，当 promise 和 future\
    \ 对象从不同线程被访问时，future 能确保适当的同步，从而防止任何数据竞争条件。这种 promise 与 future 机制使编写并发代码更加容易，确保\
    \ C++ 中线程之间的安全同步通信。\n\n下面是一个 promise 和 future 的简单示例：\n\n```cpp\n#include <future>\n\
    #include <thread>\n#include <iostream>\n\nvoid calculate(std::promise<int> intPromise)\
    \ {\n    intPromise.set_value(10);  // Fulfill promise (this happens in a different\
    \ thread)\n}\n\nint main() {\n    std::promise<int> prom;\n    std::future<int>\
    \ fut = prom.get_future();\n    std::thread t(calculate, std::move(prom));\n\n\
    \    std::cout << fut.get() << std::endl; // Get result (potentially in yet another\
    \ thread)\n    t.join();\n    return 0;\n}\n```\n\n在上面的示例程序中，calculate 函数承诺提供一个值，随后该值由\
    \ fut.get() 获取。\n\n### 异步/等待\n\n与 JavaScript 或 Python 等语言不同，C++ 本身并不支持 async/await\
    \ 语法。尽管如此，你可以通过其标准库特性（具体是 std::async 和 std::future）实现异步功能。C++ 中的 std::async 函数模板允许你启动一个异步任务。该函数将独立于主线程运行，并发执行指定任务。\n\
    \n同时，std::future 是 C++ 标准库中的一项特性，用于从异步任务中获取值。它表示一个 future（尚待计算）值，允许在 std::async\
    \ 操作的结果就绪时访问该结果。std::async 与 std::future 的这种组合提供了一种与其他编程语言中的 async/await 语法相仿（尽管可以说更复杂）的机制。这使开发者能够在\
    \ C++ 中编写异步代码，利用并发执行来提升应用程序性能。\n\n下面是一个示例：\n\n```cpp\n#include <iostream>\n#include\
    \ <future>\n\nint calculate() {\n    return 10;\n}\n\nint main() {\n    std::future<int>\
    \ fut = std::async(calculate);\n    std::cout << fut.get() << std::endl;\n   \
    \ return 0;\n}\n```\n\n在上面的示例程序中，calculate 函数被异步执行，其返回值可以通过 fut.get() 获取。这模拟了其他语言中\
    \ async/await 的功能。\n\n## 使用回调编写异步代码\n\n让我们使用 Boost.Asio 库创建一个简单的服务器-客户端模型来说明这些概念。我们将使用\
    \ Boost.Asio 提供的异步函数，这些函数允许我们以更简单的方式编写异步代码。\n\n下面是一个使用回调的简单回显服务器示例。\n\n```cpp\n\
    #include <iostream>\n#include <boost/asio.hpp>\n#include <memory>\n\nusing boost::asio::ip::tcp;\n\
    \nclass Session : public std::enable_shared_from_this<Session> {\npublic:\n  \
    \  Session(tcp::socket socket) : socket_(std::move(socket)) {}\n\n    void Start()\
    \ {\n        DoRead();\n    }\n\nprivate:\n    void DoRead() {\n        auto self(shared_from_this());\n\
    \        socket_.async_read_some(boost::asio::buffer(data_, max_length),\n   \
    \         [this, self](boost::system::error_code ec, std::size_t length) {\n \
    \               if (!ec) {\n                    DoWrite(length);\n           \
    \     }\n            });\n    }\n\n    void DoWrite(std::size_t length) {\n  \
    \      auto self(shared_from_this());\n        boost::asio::async_write(socket_,\n\
    \            boost::asio::buffer(data_, length),\n            [this, self](boost::system::error_code\
    \ ec, std::size_t /*length*/) {\n                if (!ec) {\n                \
    \    DoRead();\n                }\n            });\n    }\n\n    tcp::socket socket_;\n\
    \    enum { max_length = 1024 };\n    char data_[max_length];\n};\n\nclass Server\
    \ {\npublic:\n    Server(boost::asio::io_context& io_context, short port)\n  \
    \      : acceptor_(io_context, tcp::endpoint(tcp::v4(), port)) {\n        DoAccept();\n\
    \    }\n\nprivate:\n    void DoAccept() {\n        acceptor_.async_accept(\n \
    \           [this](boost::system::error_code ec, tcp::socket socket) {\n     \
    \           if (!ec) {\n                    std::make_shared<Session>(std::move(socket))->Start();\n\
    \                }\n                DoAccept();\n            });\n    }\n\n  \
    \  tcp::acceptor acceptor_;\n};\n\nint main(int argc, char* argv[]) {\n    try\
    \ {\n        boost::asio::io_context io_context;\n        Server s(io_context,\
    \ std::atoi(argv[1]));\n        io_context.run();\n    } catch (std::exception&\
    \ e) {\n        std::cerr << \"Exception: \" << e.what() << \"\\n\";\n    }\n\
    \    return 0;\n}\n```\n\n这个示例使用了 Boost.Asio 库的异步 API。async_read_some 和 async_write\
    \ 函数是非阻塞的，并将回调（此处为 lambda）作为参数。这些回调将在操作完成时被调用。\n\n## 多线程与并发\n\n多线程和并发是 C++ 中编写高效、快速且响应式应用程序的基本概念。\n\
    \n### 探索多线程\n\n多线程是一种执行模型，其中主程序（进程）生成多个线程，以在同一共享内存空间中并发执行不同任务。每个线程独立运行，并且可以同时执行不同任务。操作系统不仅在多个应用程序之间分配处理时间，还会在应用程序内的各个线程之间分配处理时间。\n\
    \n### 理解并发\n\n编程中的并发是一个与任务执行相关的关键概念。具体而言，它涉及系统同时管理多个任务的能力。然而，“同时”一词可能具有误导性。在并发中，任务不一定以严格的并行方式执行。相反，它们在重叠的时间间隔内启动、运行和完成。这可能意味着单个任务被分解为独立执行的子任务，或者多个任务交织在一起，造成同时执行的假象。这种机制提高了系统效率、改善了性能并优化了资源利用率，使其成为现代计算环境中的关键概念。\n\
    \nC++ 为多线程和并发提供了多种工具：\n\n- std::thread：这是 C++ 中处理线程的主要类。你创建一个新线程，并提供一个该线程应执行的函数。\n\
    - std::async 与 std::future：std::async 异步启动一个函数（可能在新线程中），并返回一个最终会持有该函数结果的 std::future。这是一种更高层、通常更易用的并发管理方式。\n\
    - std::mutex 和 std::lock_guard：它们用于保护共享数据免受并发访问。Mutex\n"
