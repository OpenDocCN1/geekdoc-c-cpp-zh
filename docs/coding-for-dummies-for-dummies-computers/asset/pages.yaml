  md: "# Defining What Code Is\n\nComputer code is not a cryptic activity reserved\
    \ for geniuses and oracles. In fact, in a few minutes you will be writing some\
    \ computer code yourself! Most computer code performs a range of tasks in our\
    \ lives from the mundane to the extraordinary. Code runs our traffic lights and\
    \ pedestrian signals, the elevators in our buildings, the cell phone towers that\
    \ transmit our phone signals, and the spaceships headed for outer space. We also\
    \ interact with code on a more personal level, on our phones and computers, and\
    \ usually to check email or the weather.\n\n# Following instructions\n\nComputer\
    \ code is a set of statements, like sentences in English, and each statement directs\
    \ the computer to perform a single step or instruction. Each of these steps is\
    \ very precise, and followed to the letter. For example, if you are in a restaurant\
    \ and ask a waiter to direct you to the restroom, he might say, “head to the back,\
    \ and try the middle door.” To a computer, these directions are so vague as to\
    \ be unusable. Instead, if the waiter gave instructions to you as if you were\
    \ a computer program he might say, “From this table, walk northeast for 40 paces.\
    \ Then turn right 90 degrees, walk 5 paces, turn left 90 degrees, and walk 5 paces.\
    \ Open the door directly in front of you, and enter the restroom.” Figure 1-1\
    \ shows lines of code from the popular game, Pong. Do not worry about trying to\
    \ understand what every single line does, or feel intimated. You will soon be\
    \ reading and writing your own code.\n\n```\n```javascript\nlaunchPong(function\
    \ () {\n    function colour_sq_random() {\n        var num = Math.floor(Math.random()\
    \ * 4).pow(2, 4);\n        return \"#\" + (\"0000\" + num.toString(16)).substr(-6);\n\
    \    }\n\n    pongSettings.ball.size = 15;\n    pongSettings.ball.color = colour_sq_random();\n\
    \    pongSettings.ball.velocity[0] = 5;\n    pongSettings.ball.velocity[1] = 5;\n\
    \n});\n```\n```\n\n**Figure 1-1:** Computer code from the game Pong.\n\nOne rough\
    \ way to measure a program’s complexity is to count its statements or lines of\
    \ code. Basic applications like the game Pong have 5,000 lines of code, while\
    \ more complex applications like Facebook currently have over"
