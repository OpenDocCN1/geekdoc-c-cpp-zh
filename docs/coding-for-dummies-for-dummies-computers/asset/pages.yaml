    # Alerting users and prompting them for input


    Displaying messages to the user and collecting input are the beginnings of the
    interactivity that JavaScript provides. Although more sophisticated techniques
    exist today, the alert() method and prompt() method are easy ways to show a pop-up
    box with a message, and prompt the user for input.


    The syntax for creating an alert or a prompt is to write the method with text
    in quotes placed inside the parentheses like so:


    ```

    alert("You have mail!");

    prompt("What do you want for dinner?");

    ```


    Figure 9-6 shows the alert pop-up box created by the alert() method, and the prompt
    for user input created by the prompt() method.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_159_1.png)


    **Figure 9-6:** A JavaScript alert pop-up box and a user prompt.


    # Naming code with functions


    Functions are a way of grouping JavaScript statements, and naming that group of
    statements for easy reference with a function name. These statements are typically
    grouped together because they achieve a specific coding goal. You can use the
    statements repeatedly by just writing the function name instead of having to write
    the statements over and over again. Functions prevent repetition and make your
    code easier to maintain.


    When I was younger every Saturday morning my mother would tell me to brush my
    teeth, fold the laundry, vacuum my room, and mow the lawn. Eventually, my mother
    tired of repeating the same list over and over again, wrote the list of chores
    on paper, titled it “Saturday chores,” and put it on the fridge. A function names
    a group of statements, just like “Saturday chores” was the name for my list of
    chores.'
  merge: -1
  img_proc: true
- pgno: 160
  md: "Functions are defined once using the word `function`, followed by a function\
    \ name, and then a set of statements inside curly brackets. This is called a *function\
    \ declaration*. The statements in the function are executed only when the function\
    \ is called by name. In the following example, I have declared a function called\
    \ `greeting` that asks for your name using the `prompt()` method, returns the\
    \ name you entered storing it in a variable called `name`, and displays a message\
    \ with the name variable using the `alert()` method:\n\n```\n```javascript\nfunction\
    \ greeting() {\n    var name=prompt(\"What is your name?\");\n    alert(\"Welcome\
    \ to this website \" + name);\n}\n\ngreeting();\ngreeting();\n```\n```\n\nBeneath\
    \ the function declaration, I have called the function twice, and so I will trigger\
    \ two prompts for my name, which are stored in the variable name, and two messages\
    \ welcoming the value in the variable name to this website.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_160_0.png)\n\
    \nThe “+” operator is used to concatenate (combine) strings with other strings,\
    \ values, or variables.\n\nFunctions can take inputs, called *parameters*, to\
    \ help the function run, and can return a value when the function is complete.\
    \ After writing my list of chores, each Saturday morning my mother would say “Nik,\
    \ do the Saturday chores,” and when my brother was old enough she would say “Neel,\
    \ do the Saturday chores.” If the list of chores is the function declaration,\
    \ and “Saturday chores” is the function name, then “Nik” and “Neel” are the parameters.\
    \ Finally, after I was finished, I would let my mom know the chores were complete,\
    \ much as a function returns values.\n\nIn the following example, I have declared\
    \ a function called amountdue, which takes price and quantity as parameters. The\
    \ function, when called, calculates the subtotal, adds the tax due, and then returns\
    \ the total. The function amountdue(10,3) returns 31.5.\n\n```\n```javascript\n\
    function amountdue(price, quantity) {\n    var subtotal=price * quantity;\n\n\
    \    var tax = 1.05;\n    var total = subtotal + tax;\n    return total;\n}\n\n\
    alert(\"The amount due is $\" + amountdue(10,3));\n```\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_160_1.png)\n\
    \nEvery opening parenthesis has a closing parenthesis, every opening curly bracket\
    \ has a closing curly bracket, and every opening double quote has a closing double\
    \ quote. Can you find all the opening and closing pairs in the example above?"
  merge: -1
