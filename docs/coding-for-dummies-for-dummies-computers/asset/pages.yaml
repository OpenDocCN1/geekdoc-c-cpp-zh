- pgno: 101
  md: "# Adding background images and  \nstyling foreground images\n\nYou can use\
    \ CSS to add background images behind HTML elements. Most commonly, the background-image\
    \ property is used to add background images to individual HTML elements such as\
    \ div, table, and p, or (when applied to the body element) to entire web pages.\n\
    \n![](img/5a907eb39993e80f28c82efc2e4632b3_101_0.png)\n\nBackground images with\
    \ smaller file sizes load more quickly than larger images. This is especially\
    \ important if your visitors commonly browse your website using a mobile phone,\
    \ which typically has a slower data connection.\n\nThe properties and values in\
    \ Table 6-3 show the options for adding background images.\n\n| Property name\
    \ | Possible values | Description |\n|---|---|---|\n| `background-image` | `url(\"\
    URL\")` | Adds a background image from the image link specified at URL. |\n| `background-size`\
    \ | `auto`<br>`contain`<br>`cover`<br>`width`<br>`height`<br>`(#px, %)` | Sets\
    \ background size according to the value:<br><br>`auto` (default value) displays\
    \ the image as originally sized.<br><br>`contain` scales the image's width and\
    \ height so that it fits inside element.<br><br>`cover` scales the image so entire\
    \ background is not visible.<br><br>Background size can also be set by specifying\
    \ width and height in pixels or as a percentage. |\n| `background-position` |\
    \ `keywords`<br><br>`position`<br>(#px, %) | Positions the background in the element\
    \ using keywords or exact position. `Keywords` are comprised of horizontal keywords\
    \ (`left`, `right`, `center`), and vertical keywords (`top`, `center`, and `bottom`).\
    \ The placement of the background can also be exactly defined using pixels or\
    \ a percentage to describe the horizontal and vertical position relative to the\
    \ element. |"
  merge: -1
  img_proc: true
- pgno: 102
  md: "| Property name | Possible values | Description |\n|---|---|---|\n| `background-repeat`\
    \ | `repeat`<br>`repeat-x`<br>`repeat-y`<br>`no-repeat` | Sets the background\
