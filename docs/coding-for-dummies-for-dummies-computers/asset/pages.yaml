    # Working with APIs


    Although APIs (*application programming interfaces*) have existed for decades,
    the term has become popular over the last few years as we hear more conversation
    and promoted around their use. *Use the Facebook API! Why doesn''t Craigslist
    have an API?* Stripe''s entire business is to allow developers to accept payments
    online using its payments API.


    Many people use the term API, but few understand its meaning. This section will
    help clarify what APIs do and how they can be used.'
  merge: -1
  img_proc: true
- pgno: 163
  md: "# What do APIs do?\n\nAn API allows Program A to access select functions of\
    \ another separate Program B. Program B grants access by allowing Program A to\
    \ make a data request in a structured, predictable, documented way, and Program\
    \ B responds to this data request with a structured, predictable, documented response,\
    \ as follows (see Figure 9-7):\n\n+   - **It’s structured** because the fields\
    \ in the request and the data in the response follow an easy-to-read standardized\
    \ format. For example, the Yahoo Weather API data response includes these selected\
    \ structured data fields:\n\n```\n```json\n\"location\": {\n    \"city\": \"New\
    \ York\",\n    \"region\": \"NY\"\n},\n\"units\": {\n    \"temperature\": \"F\"\
    \n},\n\"forecast\": [\n    {\n        \"date\": \"29 Oct 2014\",\n        \"high\"\
    : \"68\",\n        \"low\": \"48\",\n        \"text\": \"PM Showers\"\n    }\n\
    ]\n```\n```\n\nSee the full Yahoo Weather API response by visiting `http://developer.yahoo.com/weather/`.\n\
    \n+   - **It’s predictable** because the fields that must be included and can\
    \ be included in the request are pre-specified, and the response to a successful\
    \ request will always include the same field types.\n\n+   - **It’s documented**\
    \ because the API is explained in detail. Any changes usually are communicated\
    \ through the website, social media, email, and even after the API changes, there\
    \ is often a period of backward compatibility when the old API requests will receive\
    \ a response. For example, when Google Maps issued version 3 of their API, version\
    \ 2 still operated for a certain grace period.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_163_0.png)\n\
    \n**Figure 9-7:** An API allows two separate programs to talk to each other."
  merge: -1
  img_proc: true
