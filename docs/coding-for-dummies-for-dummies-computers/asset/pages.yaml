- pgno: 214
  md: 'HTML, and Ruby is no different with conventions of its own. The design principles
    in Ruby explain how Ruby tries to be different from the programming language that
    came before it. With these design principles in mind you will then see what Ruby
    code looks like, understand Ruby’s style, and learn the special keywords and syntax
    that allow the computer to recognize what you are trying to do. Unlike HTML and
    CSS, and similar to JavaScript, Ruby can be particular about syntax and misspelling
    a keyword or forgetting a necessary character will result in the program not running.


    # Understanding the principles of Ruby


    Ruby has a few design principles to make programming in the language less stressful
    and more fun for programmers of other programming languages. These design principles
    are:


    +   - **Principle of conciseness:** In general, short and concise code is needed
    to create programs. The initial set of steps to run a program written in English
    is often referred to as pseudo-code. Ruby is designed so as little additional
    effort is needed to translate pseudo-code into actual code. Even existing Ruby
    commands can be made more concise. For example, Ruby’s `if` statement can be written
    in three lines or just one.


    +   - **Principle of consistency:** A small set of rules governs the entire language.
    Sometimes this principle is referred to as the principle of least astonishment
    or principle of least surprise. In general, if you are familiar with another programming
    language, the way Ruby behaves should feel intuitive for you. For example, in
    JavaScript when working with string methods, you can chain them together like
    so


    ```

    ```javascript

    "alphabet".toUpperCase().concat("Soup")

    ```

    ```


    This JavaScript statement returns “ALPHABETSoup” by first making the string “alphabet”
    uppercase using the `.toUpperCase()` method, and then concatenating “soup” to
    “ALPHABET”. Similarly, the Ruby statement below chains together methods just as
    you would expect, also returning “ALPHABETSoup”.


    ```

    ```ruby

    "alphabet".upcase.concat("Soup")

    ```

    ```


    +   - **Principle of flexibility:** There are multiple ways to accomplish the
    same thing, and even built-in commands can be changed. For example, when writing
    an `if-else` statement you can use the words `if` and `else`, but you can also
    accomplish the task with a single “?”. The following code both perform the same
    task.'
  merge: -1
  img_proc: true
- pgno: 215
  md: "Version 1:\n\n```\n```ruby\nif 3>4\n  puts \"the condition is true\"\nelse\n\
    \  puts \"the condition is false\"\nend\n```\n```\n\nVersion 2:\n\n```\n```ruby\n\
    puts 3>4 ? \"the condition is false\" : \"the condition is true\"\n```\n```\n\n\
    # Styling and spacing\n\nRuby generally uses less punctuation than other programming\
    \ languages you may have previously tried. Some sample code is included below.\n\
    \n```\n```ruby\nprint \"What's your first name?\"\nfirst_name = gets.chomp\nfirst_name.upcase!\n\
    \nif first_name==\"NIK\"\n  print \"You may enter!\"\nelse\n  print \"Nothing\
    \ to see here.\"\nend\n```\n```\n\nIf you ran this code it would do the following:\n\
    \n+   - Print a line asking for your first name.\n+   - Take user input (`gets.chomp`)\
    \ and save it to the `first_name` variable.\n+   - Test the user input. If it\
    \ equals \"NIK\" then print \"You may enter!\" otherwise print \"Nothing to see\
    \ here.\"\n\nEach of these statement types is covered in more detail later in\
    \ this chapter. For now, as you look at the code, notice some of its styling characteristics\n\
    \n+   - Less punctuation: unlike JavaScript there are no curly braces, and unlike\
    \ HTML there are no angle brackets.\n+   - Spaces, tabs, and indentation are ignored:\
    \ unless within a text string whitespace characters do not matter.\n+   - Newlines\
    \ indicate the end of statements: although you can use semicolons to put more\
    \ than one statement on a line, the preferred and more common method is to put\
    \ each statement on its own line."
