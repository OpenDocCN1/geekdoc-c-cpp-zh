- pgno: 71
  md: '+   6. After you have finished completing the instructions, click the **Save
    and Submit Code** button.


    If you have followed the instructions correctly, a green checkmark appears, and
    you proceed to the next exercise. If an error exists in your code a warning appears
    with a suggested fix. If you run into a problem, or have a bug you cannot fix,
    click on the hint, use the Q&A Forums, or tweet me at @nikhilgabraham and include
    hashtag #codingFD.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_71_0.png)


    **Figure 4-12:** Codecademy in-browser exercises.


    # # History of HTML


    A computer engineer, Tim Berners-Lee, wanted academics to easily access academic
    papers and collaborate with each other. To accomplish this goal, in 1989 Mr. Berners-Lee
    created the first version of HTML, which had the same hyperlink elements you learned
    in this chapter, and hosted the first website in 1991. Unlike most other computer
    software, Mr. Berners-Lee made HTML available royalty-free, allowing widespread
    adoption and use around the world. Shortly after creating the first iteration
    of HTML, Mr. Berners-Lee formed the W3C ("World Wide


    Web Consortium"), which is a group of people from academic institutions and corporations
    who define and maintain the HTML language. The W3C continues to develop the HTML
    language, and has defined more than 100 HTML elements, far more than the 18 Mr.
    Berners-Lee originally created. The latest version of HTML is HTML5, and it has
    considerable new functionality. In addition to supporting elements from previous
    HTML versions, HTML5 allows browsers to play audio and video files, easily locate
    a user''s physical location, and build charts and graphs.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Getting More Out of HTML


    # *In This Chapter*


    +   - Organizing content in a web page

    +   - Writing HTML lists

    +   - Creating HTML tables

    +   - Filling out HTML forms


    > > I’m controlling, and I want everything orderly, and I need lists.

    > >

    > > — Sandra Bullock


    Even your best content needs structure to increase readability for your users.
    This book is no exception. Consider the “In This Chapter” bulleted list of items
    at the top of this page, or the table of contents at the beginning of the book.
    Lists and tables make things easier for you to understand at a glance. By mirroring
    the structure you find in a book or magazine, web elements let you precisely define
    how content, such as text and images, appear on the web.


    In this chapter, you learn how to use HTML elements such as lists, tables, and
    forms, and how to know when these elements are appropriate for your content.


    # Organizing Content on the Page


    Readability is the most important principle for organizing and displaying content
    on your web page. Your web page should allow visitors to easily read, understand,
    and act on your content. The desired action you have in mind for your visitors
    may be to click on and read additional content, share the content with others,
    or perhaps make a purchase. Poorly organized content will lead users to leave
    your website before engaging with your content for long enough to complete the
    desired action.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Figures 5-1 and 5-2 show two examples of website readability. In Figure 5-1,
    I searched Craigslist.org for an apartment in New York. The search results are
    structured like a list, and you can limit the content displayed using the filters
    and search forms. Each listing has multiple attributes, such as a description,
    the number of bedrooms, the neighborhood, and, most importantly, the price. Comparing
    similar attributes from different listings takes some effort — notice the jagged
    line your eye must follow.


    Figure 5-2 shows the results of a search I conducted at Hipmunk.com for flights
    from New York to London. As with the Craigslist search results, you can limit
    the content displayed using the filters and search forms. Additionally, each flight
    listing has multiple attributes, including price, carrier, departure time, landing
    time, and duration, which are similar to the attributes of the apartment listings.
    Comparing similar attributes from different flights is much easier with the Hipmunk
    layout, however. Notice how the content, in contrast to Craigslist’s, has a layout
    that allows your eye to follow a straight line down the page, so you can easily
    rank and compare different options.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_73_0.png)


    Figure 5-1: A Craigslist.org listing of apartments in New York (2014).


    ![](img/5a907eb39993e80f28c82efc2e4632b3_73_1.png)


    Don’t underestimate the power of simplicity when displaying content. Although
    Craigslist’s content layout may look almost too simple, the site is one of the
    top 50 most visited websites in the world. Reddit.com is another example of a
    top 50 website with a simple layout.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_74_0.png)


    **Figure 5-2:** A Hipmunk.com listing of flights from New York to London (2014).


    Before displaying your content, ask yourself a few questions first:


    +   - **Does your content have one attribute with related data, or does it follow
    sequential steps?** If so, consider using lists.

    +   - **Does your content have multiple attributes suitable for comparison?**
    If so, consider using tables.

    +   - **Do you need to collect input from the visitor?** If so, consider using
    forms.


    **TIP**


    Don''t let these choices overwhelm you. Pick one, see how your visitors react,
    and if necessary change how you display the content. The process of evaluating
    one version against another version of the same web page is called *A/B testing*.


    # ## Listing Data


    Websites have used lists for decades to convey related or hierarchical information.
    In Figure 5-3, you can see an older version of Yahoo.com that uses bulleted lists
    to display various categories and today''s Allrecipes.com recipe page, which uses
    lists to display various ingredients.'
  merge: -1
  img_proc: true
- pgno: 75
  md: "![](img/5a907eb39993e80f28c82efc2e4632b3_75_0.png)\n\n**Figure 5-3:** Yahoo’s\
    \ 1997 homepage using an unordered list (left) and Allrecipes.com’s 2014 recipe\
    \ using an ordered list (right).\n\nLists begin with a symbol, an indentation,\
    \ and then the list item. The symbol used can be a number, letter, bullet, or\
    \ no symbol at all.\n\n# Creating ordered and unordered lists\n\nThe two most\
    \ popular types of lists are:\n\n+   - **Ordered:** Ordered lists are numerical\
    \ or alphabetical lists in which the sequence of list items is important.\n+ \
    \  - **Unordered:** These lists are usually bulleted lists in which the sequence\
    \ of list items has no importance.\n\nYou create lists by specifying the type\
    \ of list as ordered or unordered, and then adding each list item using the `li`\
    \ tag, as shown in the following steps:\n\n+   1. **Specify the type of list.**\n\
    +   \n+      Add opening and closing list tags that specify either an ordered\
    \ (`ol`) or unordered (`ul`) list, as follows:\n+   \n+      - `ol` to specify\
    \ the beginning and end of an ordered list.\n+      - `ul` to specify the beginning\
    \ and end of an unordered list.\n+   \n+   2. **Add an opening and closing tag\
    \ (that is, `<li>` and `</li>`) for each item in the list.**\n\nFor example, here’s\
    \ an ordered list:\n\n```\n```html\n<ol>\n    <li>List item #1</li>\n    <li>List\
    \ item #2</li>\n    <li>List item #3</li>\n</ol>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 76
  md: "# Nesting lists\n\nAdditionally, you can nest lists within lists. A list of\
    \ any type can be nested inside another list; to nest a list, replace the list\
    \ item tag `<li>` with a list type tag, either `<ol>` or `<ul>`.\n\nThe example\
    \ code in Figure 5-4 shows various lists types including a nested list. (See Figures\
    \ 5-4 and 5-5.)\n\n```\n```html\n<!--Ordinary list-->\n<h1>Tasks for today</h1>\n\
    <ol>\n  <li>Schedule a product meeting</li>\n  <li>Have lunch with Arun</li>\n\
    \  <li>Draft client presentation</li>\n</ol>\n\n<!--Nested list-->\n<h1>Tasks\
    \ for tomorrow</h1>\n<ul>\n  <li>Send sketches to London office</li>\n  <li>File\
    \ expense reports\n    <ol>\n      <li>Trip to San Francisco</li>\n      <li>Trip\
    \ to Los Angeles</li>\n    </ol>\n  </li>\n</ul>\n```\n```\n\nFigure 5-4: Coding\
    \ an ordered list and a nested list.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_76_0.png)\n\
    \nFigure 5-5: The page produced by the code in Figure 5-4."
  merge: -1
