- pgno: 233
  md: '# Using strings and special characters


    Along with numbers, variables in Python can also store strings. To assign a value
    to a string you can use single or double quotation marks, as follows:


    ```

    ```python

    firstname = "Travis"

    lastname = ''Kalanick''

    ```

    ```


    ![](img/5a907eb39993e80f28c82efc2e4632b3_233_0.png)


    Variables can also store numbers as strings instead of numbers. However, even
    though the string looks like a number, Python will not be able to add, subtract,
    or divide strings and numbers. For example, consider amountdue = "18" + 24 — running
    this code as is would result in an error. Python does multiplication strings but
    in an interesting way—print ''Ha'' * 3 results in ''HaHaHa''.


    Including a single or double quote in your string can be problematic because the
    quotes inside your string will terminate the string definition prematurely. For
    example, if I want to store a string with the value ‘I''m on my way home’ Python
    will assume the ‘ after the first letter I is the end of the variable assignment,
    and the remaining characters will cause an error. The solution is to use special
    characters called escape sequences to indicate when you want to use characters
    like quotation marks, which normally signal the beginning or end of a string,
    or other non-printable characters like tabs. Table 14-3 shows some examples of
    escape sequences.


    | Table 14-3 | Common Python Escape Sequences |  |  |

    |---|---|---|---|

    | **Special character** | **Description** | **Example** | **Result** |

    | `\''` or `\"` | Quotation marks | `print "You had me at \"Hello\""` | `You had
    me at "Hello"` |

    | `\t` | Tab | `print "Item\tUnits\tPrice"` | `Item Units`<br>`Price` |

    | `\n` | Newline | `print "Anheuser?\nBusch?\nBueller?"` | `Anheuser?`<br>`Busch?`<br>`Bueller?`
    |'
  merge: -1
  img_proc: true
- pgno: 234
  md: "![](img/5a907eb39993e80f28c82efc2e4632b3_234_0.png)\n\nEscape sequences are\
    \ interpreted only for strings with double quotation marks. For a full list of\
    \ escape sequences see the table under Section 2.4 “Literals” at http://docs.python.org/2/reference/lexical_analysis.html.\n\
    \n# ### Deciding with conditionals: If, elif, else\n\nWith data stored in a variable,\
    \ one common task is to compare the variable's value to a fixed value or another\
    \ variable's value, and then make a decision based on the comparison. If you previously\
    \ read the chapters on JavaScript or Ruby, the discussion and concepts here are\
    \ very similar. The general syntax for an if-elif-else statement is as follows:\n\
    \n```\n~~~\nif conditional1:\n    statement1 to execute if conditional1 is true\n\
    elif conditional2:\n    statement2 to execute if conditional2 is true\nelse:\n\
    \    statement3 to run if all previous conditional are false\n~~~\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_234_1.png)\n\
    \nNotice there are no curly brackets or semi-colons, but don't forget the colons\
    \ and to indent your statements!\n\nThe initial if statement will evaluate to\
    \ true or false. When conditional1 is true, then statement1 is executed. This\
    \ is the minimum necessary syntax needed for an if-statement, and the elif and\
    \ else are optional. When present, the elif tests for an additional condition\
    \ when conditional1 is false. You can test for as many conditions as you like\
    \ using elif. Specifying every condition to test for can become tedious, so having\
    \ a \"catch-all\" is useful. When present, the else serves as the \"catch-all\"\
    , and executes when all previous conditionals are false.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_234_2.png)\n\
    \nYou cannot have an elif or an else by itself, without a preceding if statement.\
    \ You can include many elif statements, but one and only one else statement.\n\
    \nThe conditional in an if statement compares values using comparison operators,\
    \ and common comparison operators are described in Table 14-4."
  merge: -1
