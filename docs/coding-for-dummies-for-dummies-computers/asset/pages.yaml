    # ## Planning Your First Web Application


    You or your client has a web app idea, and planning is the process of putting
    those ideas down on paper. Documenting all the features that will go into the
    app is so important, because as the cartoon in Figure 10-2 shows for web development,
    and in computer science generally, it can be difficult to understand upfront what
    features are technically easy versus difficult to implement.


    The planning phase also facilitates an upfront conversation around time, project
    scope, and budget, where a common saying is to "pick two out of the three." In
    some situations, such as with projects for finance companies, timelines and project
    scope may be legally mandated or tied to a big client, and cannot be changed,
    and so additional budget may need to set aside to meet both. In other situations,
    such as projects for small startups, resources are scarce so it''s more common
    to adjust the project scope or extend the timeline than to increase the project''s
    budget. Before writing any code, it will be helpful to understand which dimensions
    can be flexed and which are fixed.


    Finally, although you will likely play multiple roles in the creation of this
    web app, in real life teams of people help bring to life the web apps you use
    every day. You will see the roles people play, and how everyone works together.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_176_0.png)


    Figure 10-2: It can be difficult to separate technically easy and difficult projects.


    # ## Exploring the Overall Process


    The purpose of the planning phase is to:


    +   - **Understand the client goals:** Some clients may want to be the first to
    enter an industry with an app, even if it means sacrificing quality. Other clients
    may require the highest standards of quality, reliability, and stability. Similarly,
    some others may prioritize retaining existing customers, while others want to
    attract new customers. All these motivations affect the product design and implementation
    in big and small ways.


    > > **TIP**

    > > If you are a developer in a large company, your client is usually not the
    end user but whoever in your internal team must greenlight the app before it is
    released to the public. At many companies, such as Google, Yahoo, and Facebook,
    most projects do not pass internal review and are never released to the public.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '+   - **Document product and feature requests:** Clients usually have an overall
    product vision, a list of tasks the user must be able to complete with the app.
    Often, clients have features in mind that would help accomplish those tasks.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_177_0.png)


    +   - **Agree on deliverables and a timeline:** Almost every client will imagine
    a much bigger product than you have time to build. For a developer, it is extremely
    important to understand what features are absolutely necessary and must be built,
    and what features are “nice to have” if there is time remaining at the end of
    the project. If every feature is a “must have” you need to either push the client
    to prioritize something, or make sure you have given yourself enough time.


    Estimating the time to complete software projects is one of the most difficult
    project management tasks. There is greater variability and uncertainty than physical
    construction projects, like building a house, or intellectual projects, like writing
    a memo. The most experienced developers at the world’s best software companies
    routinely miss estimates, so don’t feel bad if completion takes longer than you
    think. Your estimation skill will improve with time and practice.


    After separating the necessary features from the “nice to have,” you should decide
    which features are easy and which are complex. Without previous experience this
    might seem difficulty, but think about whether other applications have similar
    functionality. You should also try searching the web for forum posts, or products
    that have the feature. If no product implements the feature, and all online discussion
    people task as difficult it would be worthwhile agreeing up-front on an alternative.


    +   - **Discuss tools and software you will use to complete the project, and your
    users will use to consume the project:** Take the time to understand your client
    and user’s workflow to avoid surprises from incompatible software. Web software
    usually works across a variety of devices, but older operating systems and browsers
    can cause problems. Defining at the start of the project exactly which browser
    versions you will support (such as Internet Explorer 9 and later), and which devices
    (such as desktop and iPhone only) will save development and testing time. Usually,
    these decisions are based on how many existing users are on those platforms, and
    many organizations will support a browser version if used by a substantial amount
    of the user base — usually at least five percent.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_177_1.png)


    Browser incompatibilities are decreasing as the latest desktop and mobile browsers
    updates themselves, and are now easier to keep up-to-date.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Meeting the People Who Bring a Web App to Life


    You will be able to complete the app in this book by yourself, but the apps you
    build at work or use every day, like Google Maps or Instagram, are created by
    teams of people. Teams for a single product can vary in size, reaching upwards
    of 50 people, and each person plays a specific role across areas like design,
    development, product management, and testing. In smaller companies, the same person
    may perform multiple roles, while at larger companies the roles become more specialized
    and individual people perform each role.


    # Creating with designers


    Before any code has been written, designers work to create the site look and feel
    through layout, visuals, and interactions. Designers answer simple questions like
    “should the navigational menu be at the top of the page or the bottom?” to more
    complex questions like “how can we convey a sense of simplicity, creativity, and
    playfulness?” In general, designers answer these types of questions by interviewing
    users, creating many designs of the same product idea, and then making a final
    decision by choosing one design. Good design can greatly increase adoption of
    a product or use of site, and products like Apple’s iPhone and Airbnb.com. (See
    Figure 10-3.)


    When building a website or app, you may decide you need a designer, but keep in
    mind within design there are multiple roles that designers play. The following
    roles are complementary, and may all be done by one person or by separate people:


    +   - **User interface (UI) and user experience (UX) designers** deal primarily
    with “look and feel” and with layout. When you browse a website, for example Amazon,
    you may notice that across all pages the navigation menus, and content are in
    the same place, and use identical or very similar font, buttons, input boxes,
    and images. The UI/UX designer thinks about the order in which screens are displayed
    to the user, along with where and how the user clicks, enters text, and otherwise
    interacts with the website. If you eavesdropped on UI/UX designers, you may hear
    conversation like, “his page is too busy with too many call to actions. Our users
    don’t make this many decisions anywhere else on the site. Let’s simplify the layout
    by having just a single Buy button so anyone can order in just one click.”

    +   - **Visual designers** deal primarily with creating the final graphics used
    on a website, and are the role most closely associated with “designer.” The visual
    designer creates final versions of icons, logos, buttons, typography, images.
    For example, look at your Internet browser—the browser icon, the Back, Reload,
    and Bookmark buttons are all created by a visual'
  merge: -1
  img_proc: true
- pgno: 179
  md: '> > designer, and anyone using the browser for the first time will know what
    the icons mean without explanation. If you eavesdropped on visual designers, you
    may hear conversation like, “The color contrast on these icons is too light to
    be readable, and if including text with the icon, let’s center-align the text
    below the icon instead of above it.”

    > >

    > > **Interaction designers** deal primarily with interactions and animations
    based on user input and situation. Initially, interaction design was limited to
    keyboard and mouse interactions, but today tech sensors on mobile devices have
    created many more potential user interactions. The interaction designer thinks
    about how to use the best interaction so the user is able to complete a task as
    easily as possible. For example, think about how you check your email on your
    mobile phone. For many years, the traditional interaction was to see a list of
    messages, click on a message, and then click on a button to reply, flag, folder,
    or delete the message. In 2013, interaction designers rethought the email app
    interaction, and created an interaction so users could swipe their finger left
    or right to delete or reply to email messages instead of having to click through
    multiple menus. If you eavesdropped on interaction designers, you may hear conversation
    like, “While users are navigating with our maps app, instead of letting us know
    they are lost by clicking or swiping, maybe they can shake the phone and we instantly
    have a location specialist call them.”


    ![](img/5a907eb39993e80f28c82efc2e4632b3_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_180_0.png)


    If creating an app was like making a movie, designers would be screenwriters.


    # Coding with front- and back-end developers


    After the design is complete, the front-end and back-end developers make those
    designs a reality. Front-end developers, such as Mark Otto and Jacob Thornton
    (see Figure 10-4), code in HTML, CSS, and JavaScript, and convert the design into
    a user interface. These developers write the same code that you have been learning
    throughout this book, and ensure the website looks consistent across devices (desktop,
    laptop, and mobile), browsers (Chrome, Firefox, Safari, and so on), and operating
    systems (Windows, Mac, and so on). All these factors, especially increased adoption
    of mobile device, result in thousands of combinations that must be coded for and
    tested because every device, browser, and operating system renders HTML and CSS
    differently.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_180_1.png)


    **Figure 10-4:** Mark Otto and Jacob Thornton created Bootstrap, the most popular
    front-end framework.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_180_2.png)


    If creating an app was like making a movie, front-end developers would be the
    starring actors.


    Back-end developers such as Yukihiro Matsumoto (see Figure 10-5) add functionality
    to the user interface created by the front-end developers. Back-end developers
    ensure everything that’s notable to the user and behind the scenes is in place
    for the product to work as expected. Back-end developers use server-side languages
    like Python, PHP, and Ruby to add logic around what content to show, when, and
    to whom. In addition, they use databases to store user data, and create servers
    to serve all of this code to the users.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_181_0.png)


    If creating an app was like making a movie, back-end developers would be the cinematographers,
    stunt coordinators, makeup artists, and set designers.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_181_1.png)


    **Figure 10-5:** Yukihiro Matsumoto created Ruby, a popular server-side language
    used to create websites.


    # Managing with product managers


    Product managers help define the product to be built, and manage the product development
    process. When engineering teams are small (such as fifteen people or less) communication,
    roles, and accountability are easily managed internally without much formal oversight.
    As engineering teams grow, the overhead of everyone communicating with each other
    also grows, and without some process can become unmanageable, leading to miscommunication
    and missed deadlines. Product managers serve to lessen the communication overhead,
    and when issues arise as products are being built decide whether to extend timelines,
    cut scope, or add more resources to the team. Product managers are often former
    engineers, who have a natural advantage in helping solve technical challenges
    that arise, but non-technical people are also assuming the role with success.
    Usually, no engineers report to the product manager, causing some to comment that
    product managers have “all of the responsibility, and none of the authority.”
    One product manager wielding great responsibility and authority is Sundar Pichai,
    who originally was a product manager for the Google toolbar, and recently was
    appointed to oversee many of Google’s products, including search, Android, Chrome,
    maps, ads, and Google+. (See Figure 10-6.)'
  merge: -1
  img_proc: true
- pgno: 182
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_182_0.png)


    **Figure 10-6:** Sundar Pichai oversees almost every major Google product.


    # Testing with quality assurance


    Testing is the final step of the journey after an app or website has been built.
    As a result of the many hands that helped with production, the newly created product
    will inevitably have bugs. Lists are made of all the core app user tasks and flows,
    and human testers along with automated programs go through the list over and over
    again on different browsers, devices, and operating systems to find errors. Testers
    compile the newly discovered bugs, and send them back to the developers, who prioritize
    which bugs to squash first. Trade-offs are always made between how many users
    are affected by a bug, the time it takes to fix the bug, and the time left until
    the product must be released. The most important bugs are fixed immediately, and
    minor bugs are scheduled to be fixed with updates or later released. Today, companies
    also rely on feedback systems and collect error reports from users, with feedback
    forms and in some cases through automated reporting.'
  merge: -1
  img_proc: true
