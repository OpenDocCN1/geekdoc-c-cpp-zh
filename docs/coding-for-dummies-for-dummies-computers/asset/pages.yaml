- pgno: 58
  md: '# Identifying elements


    HTML uses special text keywords called elements to structure and style a website.
    The browser recognizes an element and applies its effect if the following three
    conditions exist:


    +   - The element is a letter, word, or phrase with special meaning. For example,
    `h1` is an element recognized by the browser to apply a header effect, with bold
    text and an enlarged font size.

    +   - The element is enclosed with a left-angle bracket (`<`) and right-angle
    bracket (`>`). An element enclosed in this way is called a tag (such as, for example,
    `<h1>`).

    +   - An opening tag (`<element>`) is followed by a closing tag (`</element>`).
    Note that the closing tag differs from the opening tag by the addition of a forward
    slash after the first left bracket and before the element (such as, for example,
    `</h1>`).


    Some HTML tags are self-closing, and don’t need separate closing tags, only a
    forward slash in the opening tag. For more about this, see the section, “Getting
    Familiar with Common HTML Tasks and Tags,” later in this chapter.


    When all three conditions are met, the text between the opening and closing tags
    is styled with the tag’s defined effect. If even one of these conditions is not
    met, the browser just displays plain text.


    For a better understanding of these three conditions, see the example code below:


    ```

    ```html

    <h1>This is a big heading with all three conditions</h1>

    <h1>This is text without the < and > sign surrounding the tag /h1

    <rockstar>This is text with a tag that has no meaning to the browser</rockstar>

    This is a regular text

    ```

    ```


    You can see how a browser would display this code in Figure 4-2.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_58_0.png)


    Figure 4-2: The example code displayed in a browser.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_58_1.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'The browser applies a header effect to “This is a big heading with all three
    conditions” because h1 is a header tag and all three conditions for a valid HTML
    tag exist:


    +   - The browser recognizes the h1 element.

    +   - The h1 element is surrounded with a left (<) and right angle bracket (>).

    +   - The opening tag (<h1>) is followed by text and then a closing tag (</h1>).


    ![](img/5a907eb39993e80f28c82efc2e4632b3_59_0.png)


    Notice how the h1 tag itself does not display in the heading. The browser will
    never display the actual text of an element in a properly formatted HTML tag.


    The remaining lines of code display as plain text because they each are missing
    one of the conditions. On the second line of code, the <h1> tag is missing the
    left and right brackets, which violates the second condition. The third line of
    code violates the first condition because rockstar is not a recognized HTML element.
    (Once you finish this chapter, however, you may feel like a rockstar!) Finally,
    the fourth line of code displays as plain text because it has no opening tag preceding
    the text, and no closing tag following the text, which violates the third condition.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_59_1.png)


    Every left angle-bracket must be followed after the element with a right angle-bracket.
    In addition, every opening HTML tag must be followed with a closing HTML tag.


    Over 100 HTML elements exist, and we cover the most important elements in the
    following sections. For now, don’t worry about memorizing individual element names.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_59_2.png)


    HTML is a forgiving language, and may properly apply an effect even if you’re
    missing pieces of code, like a closing tag. However, if you leave in too many
    errors, your page won’t display correctly.


    # Featuring your best attribute


    Attributes provide additional ways to modify the behavior of an element or specify
    additional information. Usually, but not always, you set an attribute equal to
    a value enclosed in quotes. Here’s an example using the title attribute and the
    hidden attribute:


    ```

    <h1 title="United States of America">USA</h1>

    <h1 hidden>New York City</h1>

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'The `title` attribute provides advisory information about the element that
    appears when the mouse cursor hovers over the affected text (in other words, a
    `tooltip`). In this example, the word USA is styled as a header using the `<h1>`
    tag with a `title` attribute set equal to "United States of America". In a browser,
    then, when you place your mouse cursor over the word USA, the text United States
    of America displays as a tooltip. (See Figure 4-3.)


    ![](img/5a907eb39993e80f28c82efc2e4632b3_60_0.png)


    Figure 4-3: A heading with `title` attribute has a tooltip.


    The `hidden` attribute indicates that the element is not relevant, so the browser
    won''t render any elements with this attribute. In this example, the words New
    York City never appear in the browser window because the `hidden` attribute is
    in the opening `<h1>` tag. More practically, `hidden` attributes are often used
    to hide fields from users so they can''t edit them. For example, an RSVP website
    may want to include but hide from user view a date and time field.


    The `hidden` attribute is new in HTML5, which means it may not work on some older
    browsers.


    You don''t have to use one attribute at a time. You can include multiple attributes
    in the opening HTML tag, like this:


    ```

    ```html

    <h1 title="United States of America" lang="en">USA</h1>

    ```

    ```


    In this example, I used the `title` attribute, and the `lang` attribute, setting
    it equal to `"en"` to specify that the content of the element is in the English
    language.


    When including multiple attributes, separate each attribute with one space.'
  merge: -1
  img_proc: true
- pgno: 61
  md: "# Part II: Building the Silent and Interactive Web Page\n\nKeep the following\
    \ rules in mind when using attributes:\n\n+   - If using an attribute, always\
    \ include the attribute in the opening HTML tag.\n+   - Multiple attributes can\
    \ modify a single element.\n+   - If the attribute has a value, then use the equal\
    \ sign (=) and enclose the value in quotes.\n\n# Standing head, title, and body\
    \ above the rest\n\nHTML files are structured in a specific way so browsers can\
    \ correctly interpret the file’s information. Every HTML file has the same five\
    \ elements: four whose opening and closing tags appear once and only once, and\
    \ one that appears once and doesn’t need a closing tag. These are as follows:\n\
    \n+   - `<!DOCTYPE html>` must appear first in your HTML file, and it appears\
    \ only once. This tag lets browsers know which version of HTML you are using.\
    \ In this case, it’s the latest version, HTML5. No closing tag is necessary for\
    \ this element.\n\nFor HTML4 websites, the first line in the HTML file would read\n\
    `<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01//EN\" \"http://www.w3.org/TR/html4/strict.dtd\"\
    >`\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_61_0.png)\n\n+   - `html` represents\
    \ the root or beginning of an HTML document. The `<html>` tag is followed by first\
    \ an opening and closing `<head>` tag, and then an opening and closing `<body>`\
    \ tag.\n+   - `head` contains other elements, which specify general information\
    \ about the page, including the title.\n+   - `title` defines the title in the\
    \ browser’s title bar or page tab. Search engines like Google use `title` to rank\
    \ websites in search results.\n+   - `body` contains the main content of an HTML\
    \ document. Text, images, and other content listed between the opening and closing\
    \ body tag is displayed by the browser.\n\nHere is an example of a properly structured\
    \ HTML file with these five tags (see Figure 4-4):\n\n```\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title>Favorite Movie Quotes</title>\n</head>\n<body>\n\
    \    <h1>\"I'm going to make him an offer he can't refuse\"</h1>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 62
  md: "```\n```html\n<h1>\"Houston, we have a problem\"</h1>\n<h1>\"May the Force\
    \ be with you\"</h1>\n<h1>\"You talking to me?\"</h1>\n</body>\n</html>\n```\n\
    ```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_62_0.png)\n\n**Figure 4-4:** A\
    \ web page created with basic HTML elements.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_62_1.png)\n\
    \nUsing spaces to indent and separate your tags is highly recommended. It helps\
    \ you and others read and understand your code. These spaces are only for you\
    \ and any other human that reads the code, however. Your browser won’t care. As\
    \ far as your browser is concerned, you could run all your tags together on one\
    \ line. (Don’t do this, though. The next person that reads your code will be most\
    \ unhappy.) HTML does recognize and display the first whitespace character in\
    \ text between opening and closing HTML tags.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_62_2.png)\n\
    \nOur example had many h1 tags but only one opening and closing html, head, title,\
    \ and body tag.\n\n# Getting Familiar with Common  \nHTML Tasks and Tags\n\nYour\
    \ browser can interpret over a hundred HTML tags, but most websites use just a\
    \ few tags to do most of the work within the browser. To understand this, let’s\
    \ try a little exercise: Think of your favorite news website. Have one in mind?\
    \ Now connect to the Internet, open your browser, and type in the address of that\
    \ website. Bring this book with you, and take your time — I can wait!\n\nIn the\
    \ event you can’t access the Internet right now, take a look at the article from\
    \ my favorite news website, *The New York Times*, found in Figure 4-5."
  merge: -1
  img_proc: true
- pgno: 63
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_63_0.png)


    *Figure 4-5: A New York Times article with headline, paragraphs, hyperlinks, and
    images.*


    Look closely at the news website on your screen (or look at mine). Four HTML elements
    are used to create the majority of the page:


    +   - **Headlines:** Headlines are displayed in bold and have a larger font size
    than the surrounding text.

    +   - **Paragraphs:** Each story is organized into paragraphs with white space
    dividing each paragraph.

    +   - **Hyperlinks:** The site’s homepage and article pages have links to other
    stories, and links to share the story on social networks like Facebook, Twitter,
    and Google+.

    +   - **Images:** Writers place images throughout the story, but also look for
    site images like icons and logos.


    In the following sections I explain how to write code to create these common HTML
    features.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# # Writing headlines


    Use headlines to describe a section of your page. HTML has six levels of headings
    (see Figure 4-6):


    +   - h1, which is used for the most important headings

    +   - h2, which is used for subheadings

    +   - h3 to h6, which are used for less important headings


    The browser renders h1 headings with a font size larger than h2''s, which in turn
    is larger than h3''s. Headings start with an opening heading tag, the heading
    text, and then the closing heading tag, as follows:


    ```

    `<h1>Heading text here</h1>`

    ```


    Here are some additional code examples showing various headings:


    ```

    ```html

    <h1>Heading 1: "I''m going to make him an offer he can''t refuse"</h1>

    <h2>Heading 2: "Houston, we have a problem"</h2>

    <h3>Heading 3: "May the Force be with you"</h3>

    <h4>Heading 4: "You talking to me?"</h4>

    <h5>Heading 5: "I''ll be back"</h5>

    <h6>Heading 6: "My precious"</h6>

    ```

    ```


    ![](img/5a907eb39993e80f28c82efc2e4632b3_64_0.png)


    Figure 4-6: Headings created using elements h1 through h6.


    > Always close what you open. With headings, remember to include a closing heading
    tag, such as </h1>.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "![](img/5a907eb39993e80f28c82efc2e4632b3_65_0.png)\n\n# Organizing text in\
    \ paragraphs\n\nTo display text in paragraphs you can use the p element: Place\
    \ an opening `<p>` tag before the paragraph, and a closing tag after it. The p\
    \ element takes text and inserts a line break after the closing tag.\n\nTo insert\
    \ a single line break after any element, use the `<br>` tag. The `<br>` tag is\
    \ self-closing so no closing tag is needed, and `</br>` is not used.\n\nParagraphs\
    \ start with an opening paragraph tag, the paragraph text, and then the closing\
    \ paragraph tag:\n\n```\n```html\n<p>Paragraph text here</p>\n```\n```\n\nSome\
    \ additional examples of coding a paragraph (see Figure 4-7):\n\n```\n```html\n\
    <p>Armstrong: Okay. I’m going to step off the LM now.</p>\n<p>Armstrong: That’s\
    \ one small step for man; one giant leap for mankind.</p>\n<p>Armstrong: Yes,\
    \ the surface is fine and powdery. I can kick it up loosely\n             with\
    \ my toe. It does adhere in fine layers, like powdered\n             charcoal,\
    \ to the sole and sides of my boots.</p>\n```\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_65_1.png)\n\
    \n**Figure 4-7:** Text displayed in paragraphs using the p element.\n\n# Linking\
    \ to your (heart’s) content\n\nHyperlinks are one of HTML’s most valuable features.\
    \ Web pages that include hyperlinked references to other sources allow the reader\
    \ to access those sources with just a click, a big advantage over printed pages."
  merge: -1
  img_proc: true
- pgno: 66
  md: "Hyperlinks have two parts:\n\n+   - **Link destination:** The web page the\
    \ browser visits once the link is clicked.\n+   \n+     To define the link destination\
    \ in HTML, start with an opening anchor tag (`<a>`) that has an `href` attribute.\
    \ Then, add the value of the `href` attribute, which is the website the browser\
    \ will go to once the link is clicked.\n+   \n+   - **Link description:** The\
    \ words used to describe the link.\n+   \n+     To do this, add text to describe\
    \ the link after the opening anchor tag, and then add the closing anchor tag.\n\
    \nThe resulting HTML should look something like this:\n\n```\n```html\n<a href=\"\
    website url\">Link description</a>\n```\n```\n\nThree more examples of coding\
    \ a hyperlink (see Figure 4-8):\n\n```\n```html\n<a href=\"http://www.amazon.com\"\
    >Purchase anything</a>\n<a href=\"http://www.airbnb.com\">Rent a place to stay\
    \ from a local host</a>\n<a href=\"http://www.techcrunch.com\">Tech industry blog</a>\n\
    ```\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_66_0.png)\n\n**Figure 4-8:**\
    \ Three hyperlinks created using the `a` element.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_66_1.png)\n\
    \nWhen rendering hyperlinks, the browser, by default, will underline the link\
    \ and color the link blue. To change these default properties, see Chapter 6.\n\
    \nThe `<a>` tag does not include a line break after the link.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_66_2.png)\n\
    \nGoogle’s search engine ranks web pages based on the words used to describe a\
    \ web page when the opening and closing `<a>` tags. This improved on search results\
    \ from previous methods, which relied primarily on analyzing page content."
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Adding images


    Images support otherwise plain HTML text pages. To include an image on your web
    page — your own or someone else’s — you must obtain the image’s web address. Websites
    like Google Images (images.google.com) and Flickr (www.flickr.com) allow you to
    search for online images based on keywords. When you find an image you like, right-click
    on the image, and select Copy Image URL.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_67_0.png)


    Make sure you have permission to use an online image. Flickr has tools that allow
    you to search for images with few to no license restrictions. Additionally, websites
    pay to host images, and incur charges when a website directly links to an image.
    For this reason, some websites do not allow hotlinking, or linking directly from
    third-party websites (like you) to an image.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_67_1.png)


    If you want to use an image that has not already been uploaded to the Internet,
    you can use a site like www.imgur.com to upload the image. After uploading, you
    will be able to copy the image URL and use it in your HTML.


    To include an image, start with an opening image tag `<img>`, define the source
    of the image using the src attribute, and include a forward slash at the end of
    the opening tag to close the tag (see Figure 4-9):


    ```

    ```html

    <img src="http://upload.wikimedia.org/wikipedia/commons/5/55/Grace_Hopper.jpg"/>

    <img src="http://upload.wikimedia.org/wikipedia/commons/b/b/d/Bill_Gates_wikipedia.JPG"/>

    ```

    ```


    ![](img/5a907eb39993e80f28c82efc2e4632b3_67_2.png)


    **Figure 4-3:** Images of Grace Hopper, a US Navy rear admiral, and Bill Gates,
    the co-founder of Microsoft, rendered using `<img>`.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_67_3.png)


    The image tag is self-closing, which means a separate `</img>` closing image tag
    is not used. The image tag is one of the exceptions to the always-close-what-you-open
    rule!'
  merge: -1
  img_proc: true
- pgno: 68
  md: "# # Styling Me Pretty\n\nNow that you know how to display basic text and images\
    \ in a browser, you should understand how to further customize and style them.\
    \ HTML has basic capabilities to style content, and later chapters show you how\
    \ to use CSS to style and position your content down to the last pixel. Here,\
    \ however, I explain how to do some basic text formatting in HTML, and then you'll\
    \ build your first web page.\n\n# ## Highlighting with bold, italics, underline,\
    \ and strikethrough\n\nHTML allows for basic text styling using the following\
    \ elements:\n\n+   - `strong` marks important text, which the browser displays\
    \ as bold.\n+   - `em` marks emphasized text, which the browser displays as italicized.\n\
    +   - `u` marks text as underlined.\n+   - `del` marks deleted text, which the\
    \ browser displays as strikethrough.\n\nThe underline element is not typically\
    \ used for text because it can lead to confusion. Hyperlinks, after all, are underlined\
    \ by default.\n\nTo use these elements, start with the element's opening tag,\
    \ followed by the affected text, and then a closing tag, as follows:\n\n```\n\
    ```html\n<element name>Affected text</element name>\n```\n```\n\nSome examples\
    \ (see Figure 4-10):\n\n```\n```html\nGrace Hopper, <strong> a US Navy rear admiral\
    \ </strong>, popularized the term\n    \"debugging\".\nBill Gates co-founded a\
    \ company called <em>Microsoft</em>.\nStuart Russell and Peter Norvig wrote a\
    \ book called <u>Artificial Intelligence:\n    A Modern Approach</u>.\nMark Zuckerberg\
    \ created a website called <del>Nosebook</del> Facebook.\nSteve Jobs co-founded\
    \ a company called <del><em>Pearch</em></del> <em>Apple</em>.\n```\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_68_0.png)\n\
    \n**Figure 4-10:** Sentences formatted using bold, italics, underline, and strikethrough."
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_69_0.png)


    You can apply multiple effects to text by using multiple HTML tags. Always close
    the most recently opened tag first and then the next most recently used tag. For
    an example, look at the last line of code in Figure 4-10, and the tags applied
    to the word Peach.


    # Raising and lowering text with superscript and subscript


    Reference works like Wikipedia, and technical papers often use superscript for
    footnotes and subscript for chemical names. To apply these styles, use the elements


    +   - `sup` for text marked as superscript

    +   - `sub` for text marked as subscript


    To use these elements, start with the element’s opening tag, followed by the affected
    text, and then a closing tag as follows:


    ```

    `<element name>Affected text</element name>`

    ```


    Two examples (see Figure 4-11):


    ```

    ```html

    <p>The University of Pennsylvania announced to the public the first electronic
    general-purpose computer, named ENIAC, on February 14, 1946.<sup>1</sup></p>


    <p>The Centers for Disease Control and Prevention recommends drinking several
    glasses of H<sub>2</sub>O per day.</p>

    ```

    ```


    When using the superscript element to mark footnotes, use an `<a>` anchor tag
    to link directly to the footnote so the reader can view the footnote easily.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_69_1.png)


    **Figure 4-11:** Text formatted to show superscript and subscript effects.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_69_2.png)'
  merge: -1
  img_proc: true
- pgno: 70
  md: "# Building Your First Website Using HTML\n\nNow that you have learned the basics,\
    \ you can put that knowledge to use. You can practice directly on your computer\
    \ by following these steps:\n\n+   1. **Open any text editor, such as Notepad\
    \ (on a PC) or TextEdit (on a Mac).**\n+   \n+      On a PC running Microsoft\
    \ Windows, you can access Notepad by clicking the Start button and selecting Run;\
    \ in the search box, type `Notepad`. On a Macintosh, select the Spotlight Search\
    \ (hourglass icon on the top-right corner of the toolbar), and type `TextEdit`.\n\
    \n+   2. **Enter into the text editor any of the code samples you have seen in\
    \ this chapter, or create your own combination of the code.**\n\n+   3. **Once\
    \ you have finished, save the file and make sure to include “.html” at the end\
    \ of the filename.**\n\n+   4. **Double-click on the file, which should open in\
    \ your default browser.**\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_70_0.png)\n\
    \nYou can download at no cost specialized text editors that have been created\
    \ specifically for writing code. For PCs, you can download Notepad++ at `www.notepad-plus-plus.org`.\
    \ For Mac computers, you can download TextMate at `http://macromates.com/download`.\n\
    \nIf you would like to practice your HTML online, you can use the Codecademy website.\
    \ Codecademy is a free website created in 2011 to allow anyone to learn how to\
    \ code right in the browser, without installing or downloading any software. (See\
    \ Figure 4-12.) Practice all of the tags (and a few more) that you learned in\
    \ this chapter by following these steps:\n\n+   1. **Open your browser, go to**\
    \ `www.dummies.com/go/coding` **and click on the Codecademy link.**\n\n+   2.\
    \ **Sign up for a Codecademy account or sign in if you already have an account.\
    \ Creating an account allows you to save your progress as you work, but it’s optional.**\n\
    \n+   3. **Navigate to and click on HTML Basics.**\n\n+   4. **Background information\
    \ is presented in the upper-left portion of the site, and instructions are presented\
    \ in the lower-left portion of the site.**\n\n+   5. **Complete the instructions\
    \ in the main coding window. As you type, a live preview of your code is generated.**"
