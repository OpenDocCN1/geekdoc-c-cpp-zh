- pgno: 128
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_128_0.png)


    Figure 7-15: Padding and margin added to separate each div.


    | Property Name | Possible Values | Description |

    |---|---|---|

    | `float` | `left`<br>`right`<br>`none` | Sends an element to the left or right
    of the container it is in. The `none` value specifies the element should not float.
    |

    | `clear` | `left`<br>`right`<br>`both`<br>`none` | Specifies which side of an
    element to not have other floating elements. |


    If the width of an element is specified, the float property allows elements that
    would normally appear on separate lines to appear next to each other, such as
    navigation toolbars and a main content window. The clear property is used to prevent
    any other elements from floating on one or both sides of current element, and
    the property is commonly set to both to place web page footers below other elements.'
  merge: -1
  img_proc: true
- pgno: 129
  md: "The following example code uses <div> tags, float, and clear to create a simple\
    \ left navigation layout. (See Figure 7-16) Typically, after grouping your content\
    \ using <div> tags, you name each <div> tag using class or id attributes, and\
    \ then style the div in CSS. There is a lot of code below, so let's break it down\
    \ into pieces:\n\n+   - The CSS is embedded between the opening and closing <style>\
    \ tag, and the HTML is between the opening and closing <body> tag.\n+   - Between\
    \ the opening and closing <body> tag, using <div> tags, the page is divided into\
    \ four parts with header, navigation bar, content, and footer.\n+   - The navigation\
    \ menu is created with an unordered list, which is left-aligned, with no marker.\n\
    +   - CSS styles size, color, and align each <div> tag.\n+   - CSS properties,\
    \ float, and clear, are used to place the left navigation layout to the left,\
    \ and the footer below the other elements.\n\n```\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Figure 7-14: Layout</title>\n<style>\n  #header{\n    background-color:\
    \ #FF8C8C;\n    border: 1px solid black;\n    padding: 5px;\n    margin: 5px;\n\
    \    text-align: center;\n  }\n\n  #navbar {\n    background-color: #00B0FF;\n\
    \    height: 200px;\n    width: 100px;\n    float: left;\n    border: 1px solid\
    \ black;\n    padding: 5px;\n    margin: 5px;\n    text-align: left;\n  }\n```\n\
    ```"
