- pgno: 132
  md: "# # Working Faster with Twitter Bootstrap\n\n+   **In This Chapter**\n+   \n\
    +   - Understand what Twitter Bootstrap does\n+   - Viewing layouts created with\
    \ Twitter Bootstrap\n+   - Creating web page elements using Twitter Bootstrap\n\
    \n> > *Speed, it seems to me, provides the one genuinely modern pleasure.*\n>\
    \ >\n> > —Aldous Huxley\n\nTwitter Bootstrap is a free toolkit that allows users\
    \ to create web pages quickly and with great consistency. In 2011, two Twitter\
    \ developers, Mark Otto and Jacob Thornton, created the toolkit for internal use\
    \ at Twitter, and soon after released it to the general public. Before Bootstrap,\
    \ developers would create common web page features over and over again and each\
    \ time slightly differently, leading to increased time spent on maintenance. Bootstrap\
    \ has become one of the most popular tools used in creating websites, and is used\
    \ by NASA and Newsweek for their websites. With a basic understanding of HTML\
    \ and CSS, you can use and customize Bootstrap layouts and elements for your own\
    \ projects.\n\nIn this chapter, you discover what Bootstrap does and how to use\
    \ it. You also discover the various layouts and elements that you can quickly\
    \ and easily create when using Bootstrap.\n\n# ## Figuring Out What Bootstrap\
    \ Does\n\nImagine you are the online layout developer for *The Washington Post*,\
    \ responsible for coding the front page of the print newspaper (see Figure 8-1)\
    \ into a digital website version. The newspaper consistently uses the same font\
    \ size"
  merge: -1
  img_proc: true
- pgno: 133
  md: 'and typeface for the main headline, captions, and bylines. Similarly, there
    are a set number of layouts to choose from, usually with the main headline at
    the top of the page accompanied by a photo.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_133_0.png)


    Figure 8-1: The front page of *The Washington Post* (June 7, 2013).


    Every day you could write your CSS code from scratch, defining font typeface,
    sizes, paragraph layouts, and the like. However, given that the newspaper follows
    a largely defined format, it would be easier to define this styling ahead of time
    in your CSS file with class names, and when necessary refer to the styling you
    want by name. At its core, this is how Bootstrap functions.


    Bootstrap is a collection of standardized prewritten HTML, CSS, and JavaScript
    code that you can reference using class names (for a refresher, see Chapter 7)
    and then further customize. Bootstrap allows you to create and gives you:


    +   - **Layouts:** Define your web page content and elements in a grid pattern.

    +   - **Components:** Use existing buttons, menus, and icons that have been tested
    on hundreds of millions of users.'
  merge: -1
  img_proc: true
- pgno: 134
  md: "**Responsiveness:** A fancy word for whether your site will work on mobile\
    \ phones and tablets in addition to desktop computers. Ordinarily, you would write\
    \ additional code so your website appears properly on these different screen sizes,\
    \ but Bootstrap code is already optimized to do this for you, as shown in Figure\
    \ 8-2.\n\n**Cross-browser compatibility:** Chrome, Firefox, Safari, Internet Explorer,\
    \ and other browsers all vary in the way they render certain HTML elements and\
    \ CSS properties. Bootstrap code is optimized so your web page appears consistently\
    \ no matter the browser used.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_134_0.png)\n\
    \n*Figure 8-2:* The Angry Birds Star Wars page optimized for desktop, tablet,\
    \ and mobile using Bootstrap.\n\n# Installing Bootstrap\n\nInstall and add Bootstrap\
    \ to your HTML file by following these two steps:\n\n+   1. **Include this line\
    \ of code between your opening and closing `<head>` tag:**\n\n```\n```html\n<link\
    \ rel=\"stylesheet\" href=\"http://maxcdn.bootstrapcdn.com/\n              bootstrap/3.2.0/css/bootstrap.min.css\"\
    >\n```\n```\n\nThe `<link>` tag refers to version 3.2.0 of the Bootstrap CSS file\
    \ hosted on the Internet, so you must be connected to the Internet for this method\
    \ to work.\n\n+   2. **Include both these lines of code immediately before your\
    \ closing HTML/body> tag.**\n\n```\n```html\n<!-- jQuery (needed for Bootstrap's\
    \ JavaScript plugins) -->\n<script src=\"http://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js\"\
    ></script>\n<!-- Bootstrap JavaScript plugin file -->\n<script src=\"http://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js\"\
    ></script>\n```\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_134_1.png)"
  merge: -1
  img_proc: true
- pgno: 135
  md: 'The first `<script>` tag references a JavaScript library called jQuery. JavaScript
    is covered in Chapter 9. Although jQuery is not covered in this book, at a high
    level, jQuery simplifies tasks performed using JavaScript. The second `<script>`
    tag references Bootstrap JavaScript plugins, including animated effects such as
    drop-down menus. If your website does not use any animated effects or Bootstrap
    JavaScript plugins, you don''t need to include this file.


    Bootstrap is free to use for personal and commercial purposes, but does require
    including the Bootstrap license and copyright notice.


    If you will not have reliable access to an Internet connection, you can also download
    and locally host the Bootstrap CSS and JavaScript files. To do this, after unzipping
    the Bootstrap file, use the `<link>` and `<script>` tags to link to the local
    version of your file. Visit www.getbootstrap.com/getting-started/ to download
    the files, and to access additional instructions and examples.


    # Understanding the Layout Options


    Bootstrap allows you to quickly and easily lay out content on the page using a
    grid system. You have three options when using this grid system:


    +   - **Code yourself:** After you learn how the grid is organized, you can write
    code to create any layout you wish.

    +   - **Code with a Bootstrap editor:** Instead of writing code in a text editor,
    drag and drop components and elements to generate Bootstrap code. You can then
    download and use this code.

    +   - **Code with a prebuilt theme:** Download free Bootstrap themes or buy a
    theme where the website has already been created, and you fill in your own content.


    # Lining up on the grid system


    Bootstrap divides the screen into a grid system of 12 equally-sized columns. These
    columns follow a few rules:


    +   - **Columns must sum to a width of 12 columns.** You can use one column that
    is 12 columns wide, 12 columns that are each one column wide, or anything in between.

    +   - **Columns can contain content or spaces.** For example, you could have a
    4-column-wide column, a space of 4 columns, and another 4-column-wide column.

    +   - **Unless you specify otherwise, these columns will automatically stack into
    a single column on smaller browser sizes or screens like mobile devices, and expand
    horizontally on larger browser sizes or screens like laptop and desktop screens.**
    See Figure 8-3.'
  merge: -1
  img_proc: true
- pgno: 136
  md: "![](img/5a907eb39993e80f28c82efc2e4632b3_136_0.png)\n\nFigure 8-3: Sample Bootstrap\
    \ layouts.\n\nNow that you have a sense for how these layouts appear on the screen,\
    \ let us take a look at example code used to generate these layouts. To create\
    \ any layout, follow these steps:\n\n+   1. Create a `<div>` tag with the attribute\
    \ `class=\"container\"`.\n+   2. Inside the first `<div>` tag, create another\
    \ nested `<div>` tag with the attribute `class=\"row\"`.\n+   3. For each row\
    \ you want to create, create another `<div>` tag with the attribute `class=\"\
    col-md-X\"`. Set X equal to the number of columns you want the row to span.\n\n\
    For example, to have a row span 4 columns, write `<div class=\"col-md-4\">`. The\
    \ md targets the column width for desktops, and I show you how to target other\
    \ devices later in this section.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_136_1.png)\n\
    \nYou must include `<div class=\"container\">` at the beginning of your page,\
    \ and have a closing `</div>` tag or your page will not render properly.\n\nThe\
    \ following code, as shown in Figure 8-4, creates a simple three-column centered\
    \ layout:\n\n```\n```html\n<div class=\"container\">\n  <!-- Example row of columns\
    \ -->\n  <div class=\"row\">\n    <div class=\"col-md-4\">\n      <h2>Heading</h2>\n\
    \      <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit, sed do eiusmod\n\
    \                 tempor incididunt ut labore et dolore magna aliqua. Ut enim\
    \ ad\n                 minim veniam, quis nostrud exercitation ullamco laboris\
    \ nisi ut\n                 aliquip ex ea commodo consequat\n      </p>\n    </div>\n\
    \    <div class=\"col-md-4\">\n      <h2>Heading</h2>\n```\n```"
  merge: -1
  img_proc: true
