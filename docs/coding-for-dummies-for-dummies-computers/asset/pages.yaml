    # ## Putting Data in Tables


    Tables help further organize text and tabular data on the page. (See Figure 5-6.)
    The table format is especially appropriate when displaying pricing information,
    comparing features across products, or in any situation where the columns or rows
    share a common attribute. Tables act as containers, and can hold and display any
    type of content, including text, such as heading and lists, and images. For example,
    the table in Figure 5-6 includes additional content and styling like icons at
    the top of each column, gray background shading, and rounded buttons. This content
    and styling can make tables you see online differ from tables you ordinarily see
    in books.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_77_0.png)


    **Figure 5-6:** Box.net uses tables to display pricing information.


    **TIP**


    Avoid using tables to create page layouts. In the past, developers created multi-column
    layouts using tables, but today developers use CSS (see Chapter 7) for layout-related
    tasks.'
  merge: -1
  img_proc: true
- pgno: 78
  md: "# Basic table structuring\n\nTables are comprised of several parts, like the\
    \ one shown in Figure 5-7.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_78_0.png)\n\
    \n**Figure 5-7:** The different parts of a table.\n\nYou create a table by using\
    \ the following basic steps:\n\n+   1. **Define a table with the `table` element.**\n\
    +      To do this, add the opening and closing `<table>` tags.\n+   \n+   2. **Divide\
    \ the table into rows with the `tr` element.**\n+      Between the opening and\
    \ closing table tags, create opening `<tr>` tags and closing `</tr>` tags for\
    \ each row of your table.\n+   \n+   3. **Divide rows into cells using the `td`\
    \ element.**\n+      Between the opening and closing `tr` tags, create opening\
    \ and closing `td` tags for each cell in the row.\n+   \n+   4. **Highlight cells\
    \ that are headers using the `th` element.**\n+      Finally, specify any cells\
    \ that are headers by replacing the `td` element with a `th` element.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_78_1.png)\n\
    \nYour table will have only one opening and closing `<table>` tag; however, you\
    \ can have one or more table rows (`tr`) and cells (`td`)."
  merge: -1
  img_proc: true
- pgno: 79
  md: "The following example code shows the syntax for creating the table shown in\
    \ Figure 5-7.\n\n```\n```html\n<table>\n    <tr>\n        <th>Table header 1</th>\n\
    \        <th>Table header 2</th>\n    </tr>\n    <tr>\n        <td>Row #1, Cell\
    \ #1</td>\n        <td>Row #1, Cell #2</td>\n    </tr>\n    <tr>\n        <td>Row\
    \ #2, Cell #1</td>\n        <td>Row #2, Cell #2</td>\n    </tr>\n</table>\n```\n\
    ```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_79_0.png)\n\nAfter you've decided\
    \ how many rows and columns your table will have, make sure to use an opening\
    \ and closing `<tr>` tag for each row, and an opening and closing `<td>` tag for\
    \ each cell in the row.\n\n# Stretching table columns and rows\n\nTake a look\
    \ at the table describing Facebook’s income statement in Figure 5-8. Data for\
    \ 2011, 2012, and 2013 appears in individual columns of equal-sized width. Now\
    \ look at Total Revenue, which appears in a cell that stretches or spans across\
    \ several columns.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_79_1.png)\n\n**Figure\
    \ 5-8:** An income statement in a table with columns of different sizes."
