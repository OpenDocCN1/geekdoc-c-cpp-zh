- pgno: 184
  md: '# 11


    # Researching Your First

    Web Application


    # In This Chapter


    +   - Dividing an app into smaller pieces, or steps

    +   - Using code from various sources to perform those steps

    +   - Creating app designs by reviewing and improving upon existing solutions


    > > If we knew what it was we were doing, it would not be called research.

    > >

    > > —Albert Einstein


    With the basic requirements defined, the next step is researching how to build
    the application. Apps consist of two main parts: functionality and form (design).
    For each of these parts, you must:


    +   - **Divide the app into steps:** Although it’s good practice to divide anything
    you are going to build into steps, diving apps into manageable pieces is an absolute
    necessity for large software projects with many people working across multiple
    teams.

    +   - **Research each step:** When doing your research, the first question to
    ask is whether you must build a solution yourself or use an existing solution
    built by someone else. Building your own solution usually is the best way to directly
    address your need, but it takes time, whereas implementing someone else’s solution
    is fast but may only meet part of your needs.

    +   - **Choose a solution for each step:** You should have all the solutions selected
    before writing any code. For each step, decide whether you are writing your own
    code, or using pre-built code. If you are not writing the code yourself, compare
    a few options so you can pick one with confidence.'
  merge: -1
  img_proc: true
- pgno: 185
  md: "# ### Dividing the App into Steps\n\nThe biggest challenge with dividing an\
    \ app into steps is knowing how big or small to make each step. The key is to\
    \ make sure each step is discrete and independent. To test whether you have the\
    \ right number of steps, ask yourself if someone else could solve and complete\
    \ the step with minimal guidance.\n\n# ### Finding your app's functionality\n\n\
    Recall that McDuck's wants to promote restaurant visits by using a web application\
    \ that sends customers an offer or coupon if they're close to a restaurant. To\
    \ make this job easier, you are to create the app for customers visiting just\
    \ one store.\n\nYour first move is to break down this app into steps needed for\
    \ the app to function. These steps should not be too specific: Think of them in\
    \ broad terms, as if you were explaining the process to a kindergartner. With\
    \ a pen and paper, write down these steps in order. Don't worry about whether\
    \ each step is correct, as your skill will improve with practice and time. To\
    \ help you start, here are some clues:\n\n+   - Assume the McDuck's app activates\
    \ when the customer presses a button in the app to check-in to a store.\n+   -\
    \ When the button is pressed, what are the two locations that the app must be\
    \ aware of?\n+   - When the app is aware of these two locations, what calculation\
    \ involving these two locations must the computer make?\n+   - After computing\
    \ this calculation, what effect will the computer show?\n\nFill out your list\
    \ now, and don't continue reading until you've completed it.\n\n# ### Finding\
    \ your app's functionality: My version\n\nThe following is my version of the steps\
    \ needed to make the app function according to McDuck's specifications. My steps\
    \ may differ from yours, of course, and this variation is completely fine. The\
    \ important lesson here is that you understand why each of these steps is necessary\
    \ for the app to work:\n\n+   1. **The customer presses a button on the app.**\n\
    +   \n+       The instructions above said to initiate the app with the press of\
    \ a button. That being said, there are two other options for launching the app:\n\
    +   \n+       - *Executing the steps continuously in the background, regularly\
    \ checking the customer's location.* Currently, this technique places a heavy\
    \ drain on the battery, and is not usually recommended.\n+       - *Executing\
    \ the steps only when the customer opens the app.*"
  merge: -1
  img_proc: true
- pgno: 186
  md: "+   2. **After the button is pressed, find the customer’s current location.**\n\
    +   \n+   The customer’s location is one of the two locations you need to identify.\
    \ The customer’s current location is not fixed, and it changes, for example, when\
    \ the customer is walking or driving.\n\n+   3. **Find the fixed location of a\
    \ McDuck’s store.**\n+   \n+   The McDuck’s restaurant location is the other location\
    \ you need to identify. Because this is a pilot, you only need to identify the\
    \ location for one McDuck’s restaurant, a fixed location that will not change.\
    \ Hypothetically, assuming that the pilot is successful and that McDuck’s wants\
    \ to implement this app for users visiting all 35,000 restaurants, you’d have\
    \ to track many more restaurant locations. Additionally, in a larger rollout the\
    \ locations would need to be updated regularly, as new restaurants open, and as\
    \ existing restaurants move or close.\n\n+   4. **Calculate the distance between\
    \ the customer’s current location and the McDuck’s restaurant, and name this distance\
    \ _Customer Distance_.**\n+   \n+   This step calculates how far away the customer\
    \ is from the McDuck’s restaurant. Consequently to be aware of — but not to worry\
    \ about right now — is the direction in which the customer is moving. Although\
    \ McDuck’s did not specify whether they want to display offers to customers heading\
    \ both toward and away from their store, this may be a question worth asking anyway.\n\
    \n+   5. **Convert five to ten minutes of customer travel into a distance called\
    \ _Threshold Distance_.**\n+   \n+   McDuck’s CEO Curd Colleone wants to target\
    \ customers who are five to ten minutes away from the store. Distance, in this\
    \ sense, can be measured in both time and in units of distance such as miles.\
    \ For consistency, however, plan to convert time into distance — translate those\
    \ five to ten minutes into miles. The number of miles traveled in this time will\
    \ vary by common mode of transportation and by location, because five to ten minutes\
    \ of travel in New York City won’t get you as far as five to ten minutes of travel\
    \ in Houston, Texas.\n\n+   6. **If the Customer Distance is less than the Threshold\
    \ Distance, then show an offer to the customer.**\n+   \n+   Following McDuck’s\
    \ specifications, the app should attract customers to come to the store, and so\
    \ the app only shows offers to customers who are close to the restaurant. Another\
    \ complexity to be aware of — but not to worry about right now — is that the Customer\
    \ Distance can change quickly. Customers traveling by car could easily be outside\
    \ the Threshold Distance one minute and inside it the next. Figure 11-1 shows\
    \ the customers we want to target, relative to a fixed restaurant location."
  merge: -1
  img_proc: true
- pgno: 187
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_187_0.png)


    **Figure 11-1:** Customers we want to target based on a fixed restaurant location.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_187_1.png)


    Many software logic mistakes happen at this stage, because the programmer forgets
    to include a step. Take your time reviewing these steps and understanding why
    each step is essential, and why this list of steps is the minimum necessary to
    operate the app.


    # Finding your app’s form


    After you settle on what the app will do, you must find the best way to present
    this functionality to users. There are many ways that users can interact with
    your app’s functionality, so picking out the right approach can be tricky. Designing
    an app can be fun and rewarding, but it’s hard work. After the first iteration
    of an app’s design, developers are often disappointed. Users will rarely use the
    product as intended and will find many parts of the app confusing. This is natural
    — especially because at this stage you’re often creating something or having the
    user do something that hasn’t been done before. Your only choice is to keep trying,
    to keep testing, modifying, and creating new designs until your app is easy for
    everyone to use. Although the iPod is a hardware product, the approach Apple took
    to perfect it is basically the same. Figure 11-2 shows how the design can change
    over time, with the button layout changing from the original click-wheel to individual
    horizontal buttons, and finally back to the click-wheel again.'
  merge: -1
  img_proc: true
- pgno: 188
  md: "![](img/5a907eb39993e80f28c82efc2e4632b3_188_0.png)\n\nFigure 11-2: Apple’s\
    \ iPod design changes over multiple product releases.\n\nThe following list describes\
    \ a basic design process to create the look and feel of your app:\n\n+   1. **Define\
    \ the main goals of your app.**\n+   \n+      If you were at a party, and you\
    \ had to explain what your app did in one sentence, what would it be? Some apps\
    \ help you hail a taxi, reserve a table at a restaurant, or book a flight. Famously,\
    \ the goal for the iPod was 1,000 songs in your pocket accessible within three\
    \ clicks, which helped create an easy to use user interface. An explicitly defined\
    \ goal will serve as your north star, helping you to resolve questions and forcing\
    \ you to keep trying.\n+   \n+   2. **Break these goals into tasks.**\n+   \n\
    +      Each goal is the sum of many tasks, and listing them will help you design\
    \ the shortest path to completing each task and ultimately the goal. For instance,\
    \ if your app's goal is for a user to book a flight, then the app will likely\
    \ need to record desired flying times and destinations, search and select flights\
    \ departing during those times, record personal and payment information, present\
    \ seats for selection, and confirm payment of the flight. Sometimes designers\
    \ will segment tasks by user persona, another name"
  merge: -1
  img_proc: true
- pgno: 189
  md: 'for the person completing the task. For example, this app may be used by business
    and leisure travelers. Leisure travelers may need to do heavy searching and pick
    flights based on price, while business travelers mostly rebook completed flights
    and pick flights based on schedule.


    +   3. **Research the flows and interactions necessary to accomplish these tasks.**


    For example, our flight app requires the user to select dates and times. One immediate
    question is whether the date and time should be two separate fields or one field,
    and on a different or same screen as the destination. Try to sketch what feels
    intuitive for you, and research how others have solved this problem. You can use
    Google to find other travel apps, list all the various designs, and either pick
    or improve upon the design you like best. Figure 11-3 shows two different approaches
    to flight search. Similarly, you can also use design-centric sites, such as www.dribbble.com,
    to search designer portfolios for features and commentary.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_189_0.png)


    Figure 11-3: Different designs for flight reservation from Hipmunk.com and United
    Airlines.


    +   4. **Create basic designs, called *wireframes*, and collect feedback.**


    Wireframes, as shown in Figure 11-4, are low fidelity website drawings which show
    structurally how site content and interface interact. Wireframes are simple to
    create, but should have enough detail to elicit feedback from others. Many wireframe
    tools use a simple almost pencil-like drawing to help anyone providing comments
    to focus on the structural and bigger picture design, instead of smaller details
    like button colors or border thicknesses. Feedback at this stage to refine design
    is so important because the first wireframe likely does not address users'' main
    concerns and overcomplicates the tasks a user needs to do.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_190_0.png)


    With mobile devices increasing in popularity relative to desktop devices, remember
    to create mobile and desktop versions of your wireframes.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_190_1.png)


    **Figure 11-4** A wireframe for an email client.


    # 5. Create mock-ups and collect more feedback. (See Figure 11-5.)


    After you have finished talking to your client and to users, it is time to create
    mock-ups, which are high fidelity website previews. These designs have all the
    details a developer needs to create the website including final layout, colors,
    images, logos, and sequences of screens to show when the user interacts with the
    web page. After creating a mock-up, plan to collect more feedback.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_190_2.png)


    **Figure 11-5** A mock-up for an email client.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_190_3.png)


    Collecting feedback at every stage of the design process might seem unnecessary,
    but it is much easier to explore different designs and make changes before any
    code has been written.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '+   6. Send the final file to the developers.


    After the mock-up has been created and approved, you typically send a final image
    file to the developer. Although this file could be in any image file format like
    PNG or JPG, the most popular file format used by designers is PSD, created using
    Adobe Photoshop.


    # Finding your app''s form: The McDuck''s Offer App design


    In this section you follow the design process described in the previous section
    to create a simple design for the McDuck''s Offer app. As part of the design,
    you should do the following things:


    +   1. Define the main goals of your app.


    The main goal for McDuck''s is to use offers to attract customers to restaurants.


    +   2. Break these goals into tasks.


    Customers need to view the offer, navigate to the store, and use the offer.


    +   3. Research the flows and interactions needed to accomplish these tasks.


    Because this is the first iteration of the app, let''s focus on just allowing
    the customer to view the offer.


    One function that McDuck''s did not specify is the ability to save single-use
    coupons and to share general-use coupons. However, when looking at other apps,
    like the ones in Figure 11-6, the need for this becomes more obvious. Also, some
    similar apps allow the customer to spend money to buy coupons — maybe this functionality
    should be added as well. These questions would be great to present to McDuck''s
    later.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_191_0.png)


    Figure 11-6: Example flow from deals and offer apps currently in the market.


    The apps in Figure 11-6 also all display various “call to action” buttons to the
    user before displaying the deal. Some apps ask the user to check-in to a location,
    other apps ask the user to purchase the coupon, and still others show a collection
    of new or trending coupons today.'
  merge: -1
  img_proc: true
- pgno: 192
  md: <!-- no content -->
  merge: -1
