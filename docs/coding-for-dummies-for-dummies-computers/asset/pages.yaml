- pgno: 161
  md: "# Adding JavaScript to the web page\n\nThe two ways to add JavaScript to the\
    \ web page are:\n\n+   - Embed JavaScript code in an HTML file using the script\
    \ tag.\n+   - Link to a separate JavaScript file from the HTML file using the\
    \ script tag.\n\nTo embed JavaScript code in an HTML file, use an opening and\
    \ closing <script> tag, and write your JavaScript statements between the two tags,\
    \ as shown in the following example:\n\n```\n```html\n<!DOCTYPE html>\n<html>\n\
    \  <head>\n    <title>Embedded JavaScript</title>\n    <script>\n      alert(\"\
    This is embedded JavaScript\");\n    </script>\n  </head>\n  <body>\n    <h1>Example\
    \ of embedded JavaScript</h1>\n  </body>\n</html>\n```\n```\n\nThe <script> tag\
    \ can be placed inside the opening and closing <head> tag, as shown above, or\
    \ inside the opening and closing <body> tag. There are some performance advantages\
    \ when choosing one approach over the other, and you can read more at http://stackoverflow.com/questions/436411/where-is-the-best-place-to-put-script-tags-in-html-markup.\n\
    \nThe <script> tag is also used when linking to a separate JavaScript file, which\
    \ is the recommended approach. The <script> tag includes:\n\n+   - A type attribute,\
    \ which for JavaScript is always set equal to \"text/javascript\"\n+   - A src\
    \ attribute, which is set equal to the location of the JavaScript file.\n\n```\n\
    ```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Linking to a separate JavaScript\
    \ file</title>\n    <script type=\"text/javascript\" src=\"script.js\"></script>\n\
    \  </head>\n  <body>\n    <h1>Linking to a separate JavaScript file</h1>\n  </body>\n\
    </html>\n```\n```"
  merge: -1
  img_proc: true
