    ul a {\n    color: blue;\n    text-decoration: line-through;\n}\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_120_0.png)\n\
    \nFigure 7-8: Child selector used to style the Parody Tech Twitter accounts.\n\
    \n**Tip:** Interested in styling just the first anchor tag within a list, like\
