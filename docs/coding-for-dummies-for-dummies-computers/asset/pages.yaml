- pgno: 172
  md: '# # Building Your Own App


    # ### In This Chapter


    +   - Completing a case study using an app

    +   - Understanding the process of creating an app to solve a problem

    +   - Discovering the various people that help create an app


    > > If you have a dream, you can spend a lifetime . . . getting ready for it.
    What you should be doing is getting started.

    > >

    > > —Drew Houston


    If you have read (or skimmed) the previous chapters you now have enough HTML,
    CSS, and JavaScript knowledge to write your own web application. To review, HTML
    puts content on the web page, CSS styles that content, and JavaScript allows for
    interaction with that content.


    You may feel like you don’t have enough coding knowledge to create an app, but
    I promise that you do. Besides, the only way to know for certain is to get started
    and try. In this chapter, you come to better understand the app you are going
    to build, and the basic steps to create that app. Developers often begin with
    just the information presented in this chapter and are expected to create a prototype.
    After reading this chapter think about how you would build the app, and then refer
    to chapters that follow for more details on each step.


    # ## Building a Location-Based Offer App


    Technology can provide developers (like you) one of the most valuable pieces of
    information about your users — their current location. With mobile devices, such
    as cell phones and tablets, you can even find a user’s location when they are
    on-the-go. Although you likely have used an app to retrieve'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'the time, weather, or even driving directions, you may never have received
    an offer on your phone to come into a store while walking down the street or driving
    in a car. Imagine passing by a Mexican restaurant during lunch time and receiving
    an offer for a free taco. I’m hungry, so let’s get started!


    # Understanding the situation


    *The following is a fictitious case study. Any resemblance to real companies or
    events is coincidental.*


    The McDuck’s Corporation is one of the largest fast food restaurants in the world,
    specializing in selling hamburgers in a restaurant called McDuck’s. The company
    has 35,000 of these restaurants which serve 6.5 million burgers every day to 70
    million people in over 100 countries. In September 2014, McDuck’s experienced
    its worst sales decline in over a decade. After many meetings, the executive team
    decided that they key to improving sales would be increasing restaurant foot traffic.
    “Our restaurant experience, with burger visuals and french-fry aromas, is the
    best in the industry—once a customer comes in it is a guaranteed sale,” says McDuck’s
    CEO Ducklone. To promote restaurant visits, McDuck’s wants a web application so
    customers can check-in to their favorite store, and receive an offer or coupon
    if they are close to a restaurant. “Giving customers who are 5 or 10 minutes away
    from a restaurant an extra nugget may result in a visit. Even if customers use
    this app while at the restaurant, this will allow us to maintain a relationship
    with them long after they have left,” says Corleone.


    The McDuck Corporation wants to run a pilot to better understand whether location
    based offers will increase sales. Your task is to:


    +   - Create an app which will prove whether location based offers are effective.

    +   - Limit the app to work on just one McDuck’s store of your choice.

    +   - Obtain the location of customers using the app.

    +   - Show offers to those customers who are five or ten minutes from the store.


    McDuck’s currently has a website and a mobile app, but both only show menu and
    store location information. If this pilot is successful, McDuck’s will incorporate
    your code into its website and mobile app.


    # Plotting your next steps


    Now that you understand McDuck’s request, you likely have many questions:


    +   - What will the app look like?

    +   - What programming languages will I use to create the app?'
  merge: -1
  img_proc: true
- pgno: 174
  md: '+   - How will I write code to locate a user’s present location?

    +   - What offer will I show to a user who is 5 to 10 minutes away?


    These are natural questions to ask, and to make sure you are asking all the necessary
    questions upfront in an organized way you will follow a standard development process.


    # Following an App Development Process


    Building an app can take as little time as an hour or as long as decades. For
    most startups, the development processes for the initial product prototype averages
    one or two months to complete, whereas enterprise development processes for commercial
    grade software takes six months to a few years to complete, depending on the industry
    and the project’s complexity. A brief overview of the entire process is described
    here, and then each step is covered in additional detail as you build the app
    for McDuck’s.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_174_0.png)


    An app can be a software program that runs on desktop or mobile devices.


    The four steps you will follow when building your app are:


    +   - Planning and discovery of app requirements

    +   - Researching of technology needed to build the app, and designing the app
    look and feel

    +   - Coding your app using a programming language

    +   - Debugging and testing your code when it behaves differently than you intended


    In total, you should plan to spend between two to five hours building this app.
    As shown in Figure 10-1, planning and research alone will take more than half
    your time, especially if this is the first time you are building an app. You might
    be surprised to learn that actually writing code will take a relatively small
    amount of time, with the rest of your time spent debugging your code to correct
    syntax and logic errors.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_174_1.png)


    App development processes have different names, and the two biggest processes
    are called *waterfall* and *agile*. Waterfall is a set of sequential steps followed
    to create a program, whereas agile is a set of iterative steps followed to create
    a program. Additional discussion can be found in Chapter 3.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_175_0.png)


    **Figure 10-1:** Time allocated to complete the four steps in the app development
