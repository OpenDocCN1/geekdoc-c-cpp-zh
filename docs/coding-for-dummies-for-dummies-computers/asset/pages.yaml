  md: "+   - Styling specific HTML elements based on position to other elements.\n\
    +   - Naming HTML elements, and only styling elements by name.\n\n# ### Styling\
    \ specific elements\n\nWhen styling specific elements, it is helpful to visualize\
    \ the HTML code as a family tree with parents, children, and siblings. In the\
    \ following code example (also shown in Figure 7-4), the tree starts with the\
    \ html element, which has two children head and body. The head has a child element\
    \ called title. The body has h1, ul, and p elements as children. Finally, the\
    \ ul element has li elements as children, and the p element has a elements as\
    \ children. Figure 7-5 shows how the following code appears in the browser, and\
    \ Figure 7-6 shows a depiction of the following code using the tree metaphor.\
    \ Note that Figure 7-6 shows each relationship once. For example, in the code\
    \ below there is an a element inside each of three li elements, and Figure 7-6\
    \ shows this ul li a relationship once.\n\n```\n```html\n<html>\n  <head>\n  \
    \  <title>Figure 7-3: DOM</title>\n  </head>\n  <body>\n\n  <h1>Parody Tech Twitter\
    \ Accounts</h1>\n  <ul>\n    <li>\n      <a href=\"http://twitter.com/BoredElonMusk\"\
    >Bored Elon Musk</a>\n    </li>\n    <li>\n      <a href=\"http://twitter.com/VinodColeslaw\"\
    >Vinod Coleslaw</a>\n    </li>\n    <li>\n      <a href=\"http://twitter.com/Horse_ebooks\"\
    >Horse ebooks</a>\n    </li>\n  </ul>\n\n  <h1>Parody Non-Tech Twitter Accounts</h1>\n\
