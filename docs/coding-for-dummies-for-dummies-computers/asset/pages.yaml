  md: '+   - **auto:** This value maintains the original dimensions of an image.

    +   - **cover:** This value scales an image so all dimensions are greater than
    or equal to the size of the container or HTML element.

    +   - **contain:** This value scales an image so all dimensions are less than
    or equal to the size of the container or HTML element.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_103_0.png)


    **Figure 6-7:** Setting the background size to three different values.


    # Setting the background-position


    The background-position sets the initial position of the background image. The
    default initial position is in the top left corner of the web page or specific
    element. You can change the default position by specifying a pair of keyword or
    position values, as follows:


    +   - **Keywords:** The first keyword *(left, center, or right)* represents the
    horizontal position, and the second keyword *(top, center, or bottom)* represents
    the vertical position.

    +   - **Position:** The first position value represents the horizontal position,
    and the second value represents the vertical position. Each value is defined using
    pixels or percentages, representing the distance from the top-left of the browser
    or the specified element. For example, `background-position: center center` is
    equal to `background-position: 50% 50%`. (See Figure 6-8.)


    # Setting the background-repeat


    The background-repeat property sets the direction the background will tile as
    follows:


    +   - **repeat:** This value (the default) repeats the background image both horizontally
    and vertically.

    +   - **repeat-x:** This value repeats the background image only horizontally.

    +   - **repeat-y:** This value repeats the background image only vertically.

    +   - **no-repeat:** This value prevents the background from repeating at all.'
  merge: -1
  img_proc: true
