- pgno: 25
  md: '# ## *Coding on the job*


    Coding can be useful in the workplace as well. Outside the technology sector,
    coding in the workplace is common for some professions like financial traders,
    economists, and scientists. However, for most professionals outside the technology
    sector, coding is just beginning to penetrate the workplace, and gradually starting
    to increase in relevance. Here are areas where coding is playing a larger role
    on the job:


    ![](img/5a907eb39993e80f28c82efc2e4632b3_25_0.png)


    +   - **Advertising:** Spend is shifting from print and TV to digital campaigns,
    and search engine advertising and optimization relies on keywords to bring visitors
    to websites. Advertisers who understand code see successful keywords used by competitors,
    and use that data to create more effective campaigns.


    +   - **Marketing:** When promoting products, personalizing communication is one
    strategy that often increases results. Marketers who code can query customer databases
    and create personalized communications that include customer names and products
    tailored to specific interests.


    +   - **Sales:** The sales process always starts with leads. Salespeople who code
    retrieve their own leads from web pages and directories, and then sort and qualify
    those leads.


    Retrieving information by copying text on web pages and in directories is referred
    to as *scraping*.


    +   - **Design:** After creating a web page or a digital design, designers must
    persuade other designers and eventually developers to actually program their drawings
    into the product. Designers who code can more easily bring their designs to life,
    and can more effectively advocate for specific designs by creating working prototypes
    that others can interact with.


    +   - **Public relations:** Companies constantly measure how customers and the
    public react to announcements and news. For instance, if a celebrity spokesperson
    for a company does or says something offensive, should the company dump the celebrity?
    Public relations people who code query social media networks like Twitter or Facebook,
    and analyze hundreds of thousands of individual messages to understand market
    sentiment.


    +   - **Operations:** Additional profit can be generated, in part, by analyzing
    a company’s costs. Operations people who code write programs to try millions of
    combinations to optimize packaging methods, loading routines, and delivery routes.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# ## Scratching your own itch (and becoming rich and famous)


    Using code built by others and coding in the workplace may cause you to think
    of problems you personally face that you could solve with code of your own. You
    may have an idea for a social network website, a better fitness app, or something
    new altogether. The path from idea to functioning prototype used by others involves
    a good amount of time and work, but might be more achievable than you think. For
    example, take Coffitivity, a productivity website that streams ambient coffee
    shop sounds to create white noise. The website was created by two people who had
    just learned how to program a few months prior. Shortly after Coffitivity launched,
    Time Magazine named the website one of 50 Best Websites of 2013, and the Wall
    Street Journal also reviewed the website. While not every startup or app will
    initially receive this much media coverage, it can be helpful to know what is
    possible when a solution really solves a problem.


    Having a goal, like a website or app you want to build, is one of the best ways
    to learn how to code. When facing a difficult bug or a hard concept, the idea
    of bringing your website to life will provide the motivation you need to keep
    going. Just as important, do not learn how to code to become rich and famous,
    as the probability of your website or app becoming successful is largely due to
    factors out of your control.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_26_0.png)


    The characteristics that make a website or app addictive are described using the
    Hook Model here http://techcrunch.com/2012/03/04/how-to-manufacture-desire. Products
    are usually made by companies, and the characteristics of an enduring company
    are described here http://www.sequoiacap.com/grove/posts/yal6/elements-of-enduring-companies,
    based on a review of companies funded by Sequoia, one of the most successful venture
    capital firms in the world and early investors in Apple, Google, and PayPal.


    # ## Surveying the Types of Programming Languages


    Code comes in different flavors called programming languages. Some popular programing
    languages are shown in Figure 1-4.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_27_0.png)


    *Figure 1-4: Some popular programming languages.*


    You can think of programming languages just like spoken languages, as they both
    share many of the same characteristics, such as:


    +   - **Functionality across languages:** Programming languages can all create
    the same functionality similar to how spoken languages can all express the same
    objects, phrases, and emotions.

    +   - **Syntax and structure:** Commands in programming languages can overlap
    just like words in spoken languages overlap. To output text to screen in Python
    or Ruby you use the `print` command, just like you use the verb “to print” in
    English and `imprimer` and `imprimir` are the verbs for “print” in French and
    Spanish.

    +   - **Natural lifespan:** Programming languages are born when a programmer thinks
    of a new or easier way to express a computational concept. If other programmers
    agree, they adopt the language for their own programs and the programming language
    spreads. However, just like Latin or Aramaic, if the programming language is not
    adopted by other programmers or a better language comes along, then the programming
    language slowly dies from lack of use.


    Despite these similarities, programming languages also differ from spoken languages
    in a few key ways:


    +   - **One creator:** Unlike spoken languages, programming languages can be created
    by one person in a short period of time, sometimes in just a few days. Popular
    languages with a single creator include JavaScript (Brendan Eich), Python (Guido
    van Rossum), and Ruby (Yukihiro Matsumoto).'
  merge: -1
  img_proc: true
- pgno: 28
  md: '**Written in English:** Unlike spoken languages (except, of course, English),
    almost all programming languages are written in English. Whether they''re programming
    in HTML, JavaScript, Python, or Ruby, Brazilian, French, or Chinese programmers
    all use the same English keywords and syntax in their code. Some non-English programming
    languages exist, such as languages in Hindi or Arabic, but none of these languages
    are widespread or mainstream.


    # Comparing low-level and high-level programming languages


    One way to classify programming languages is either as low-level languages or
    high-level languages. Low-level languages interact directly with the computer
    processor or CPU, are capable of performing very basic commands, and are generally
    hard to read. Machine code, one example of a low-level language, uses code that
    consists of just two numbers — 0 and 1. Figure 1-5 shows an example of machine
    code. Assembly language, another low-level language, uses keywords to perform
    basic commands like read data, move data, and store data.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_28_0.png)


    **Figure 1-5:** Machine code consists of 0s and 1s.


    By contrast, high-level languages use natural language so it is easier for people
    to read and write. Once code is written in a high-level language, like C++, Python,
    or Ruby, an interpreter or compiler translates this high-level language into low-level
    code a computer can understand.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Contrasting compiled code and interpreted code


    High-level programming languages must be converted to low-level programming languages
    using an interpreter or compiler, depending on the language. Interpreted languages
    are considered more portable than compiled languages, while compiled languages
    execute faster than interpreted languages. However, the speed advantage compiled
    languages have is starting to fade in importance as improving processor speeds
    make performance differences between interpreted and compiled languages negligible.


    High-level programming languages like JavaScript, Python, and Ruby are interpreted.
    For these languages the interpreter executes the program directly, translating
    each statement *one line at a time* into machine code. High-level programming
    languages like C++, COBOL, and Visual Basic are compiled. For these languages,
    after the code is written a compiler translates *all* the code into machine code,
    and an executable file is created. This executable file is then distributed via
    the internet, CD-ROMs, or other media and run. Software you install on your computer,
    like Microsoft Windows or Mac OS X, are coded using compiled languages, usually
    C or C++.


    # Programming for the web


    Software accessible on websites is gradually starting to take over installed software.
    Think of the last time you downloaded and installed software for your computer
    — you may not even remember! Installed software like Windows Media Player and
    Winamp that play music and movies have been replaced with websites like YouTube
    and Netflix. Traditional installed word processor and spreadsheet software like
    Microsoft Word and Excel are starting to see competition from web software like
    Google Docs and Sheets. Google is even selling laptops called Chromebooks that
    contain no installed software, and instead rely exclusively on web software to
    provide functionality.


    The remainder of this book will focus on developing and creating web software,
    not just because web software is growing rapidly, but also because programs for
    the web are easier to learn and launch than traditional installed software.


    # Taking a Tour of a Web App Built with Code


    With all this talk of programming, let us actually take a look at a web application
    built with code. Yelp.com is a website that allows you to search and find crowd-sourced
    reviews for local businesses like restaurants, nightlife, and shopping. As shown
    in Figure 1-6, Yelp did not always look as polished as it does today, but its
    purpose has stayed relatively constant over the years.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_30_0.png)


    Figure 1-6: Yelp’s website in 2004 and in 2014.


    # Defining the app’s purpose and scope


    Once you understand an app’s purpose, you can identify a few actionable tasks
    a user should be able to perform to achieve that purpose. Regardless of the design,
    the Yelp’s website has always allowed users to


    +   - Search local listings based on venue type and location.

    +   - Browse listing results for address, hours, reviews, photos, and location
    on a map.


    Successful web applications generally allow for completing only a few key tasks
    when using the app. Adding too many features to an app is called scope creep,
    dilutes the strength of the existing features, and so is avoided by most developers.
    For example, it took Yelp, which has 30,000 restaurant reviews, exactly one decade
    after its founding to allow users to make reservations at those restaurants directly
    on its website. Whether you are using or building an app, have a clear sense of
    the app’s purpose.


    # Standing on the shoulders of giants


    Developers make strategic choices and decide which parts of the app to code themselves,
    and which parts of the app to use code built by others. Developers often turn
    to 3rd party providers for functionality that is either not core to the business
    or not an area of strength. In this way, apps stand on the shoulders of others,
    and benefit from others who have come before and solved challenging problems.


    Yelp, for instance, displays local listing reviews and places every listing on
    a map. While Yelp solicits the reviews, and writes the code to display basic listing
    data, it is Google, as shown in Figure 1-7, which develops the maps used on Yelp’s
    website. By using Google’s map application instead of building its own, Yelp created
    the first version of the app with fewer engineers than otherwise would have been
    required.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_31_0.png)


    **Figure 1-7:** Google maps used for the Yelp web application.'
  merge: -1
