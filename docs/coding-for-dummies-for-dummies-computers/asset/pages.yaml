- pgno: 99
  md: '# Customizing links


    In general, browsers display links as blue underlined text. Originally, this default
    behavior minimized the confusion between content on the page and an interactive
    link. Today, almost every website styles links in its own way. Some websites don’t
    underline links; others retain the underlining but style links in colors other
    than blue, and so on.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_99_0.png)


    The HTML anchor element (a) is used to create links. The text between the opening
    and closing anchor tag is the link description, and the URL set in the `href`
    attribute is the address the browser visits when the link is clicked.


    The anchor tag has evolved over time and today has four states:


    +   - **link:** A link that a user has not clicked or visited.

    +   - **visited:** A link that a user has clicked or visited.

    +   - **hover:** A link that the user hovers the mouse cursor over without clicking.

    +   - **active:** A link the user has begun to click but hasn’t yet released the
    mouse button.


    CSS can style each of these four states, most often by using the properties and
    values shown in Table 6-2.


    **Table 6-2. Common CSS Properties and Values for Styling Links**


    | Property name | Possible values | Description |

    |---|---|---|

    | `color` | `name` | Link color specified using names (`color: blue;`), hexadecimal
    code (`color: #0000FF;`), or RGB value (`color: rgb(0,0,255);`). |

    |  | `hex code` |  |

    |  | `rgb value` |  |

    | `text-decoration` | `none` | Sets link to have and underline (or not). |

    |  | `underline` |  |


    The following example styles links in a way that’s similar to the way they’re
    styled in articles at Wikipedia, where links appear blue by default, underlined
    on mouse hover, and orange when active. As shown in Figure 6-6, the first link
    to Chief Technology Officer of the United States appears underlined as it would
    if my mouse was hovering over it. Also, the link to Google appears orange as it
    would if active and my mouse was clicking it.'
  merge: -1
  img_proc: true
- pgno: 100
  md: "```\n```css\na:link{\n    color: rgb(6,69,173);\n    text-decoration: none;\n\
    }\na:visited {\n    color: rgb(11,0,128)\n}\na:hover {\n    text-decoration: underline\n\
    }\na:active {\n    color: rgb(250,167,0)\n}\n```\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_100_0.png)\n\
    \nRemember to include the colon between the a selector and the link state.\n\n\
    ![](img/5a907eb39993e80f28c82efc2e4632b3_100_1.png)\n\nAlthough explaining why\
    \ is out of the scope of this book, CSS specifications insist that you define\
    \ the various link states in the order shown here — link, visited, hover, and\
    \ then active. However, it is acceptable to not define a link state, as long as\
    \ this order is preserved.\n\nThe various link states are known as *pseudo-class\
    \ selectors*. Pseudo-class selectors add a keyword to CSS selectors and allow\
    \ you to style a special state of the selected element.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_100_2.png)\n\
    \n**Figure 6-6:** Wikipedia.org page showing link, visited, hover, and active\
    \ states."
