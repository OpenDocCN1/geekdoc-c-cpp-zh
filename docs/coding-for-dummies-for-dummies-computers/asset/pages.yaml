- pgno: 84
  md: '# Understanding how forms work


    Forms pass information entered by a user to a server by using the following process:


    +   1. The browser displays a form on the client machine.

    +   2. The user completes the form and presses the submit button.

    +   3. The browser submits the data collected from the form to a server.

    +   4. The server processes and stores the data and sends a response to the client
    machine.

    +   5. The browser displays the response, usually indicating whether the submission
    was successful.


    See Chapter 2 for an additional discussion about the relationship between the
    client and server.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_84_0.png)


    A full description of how the server receives and stores data (Steps 3 to 5) is
    beyond the scope of this book. For now, all you need to know is that server-side
    programming languages such as Python, PHP, and Ruby are used to write scripts
    that receive and store form submissions.


    Forms are very flexible, and can record a variety of user inputs. Input fields
    used in forms can include free text fields, radio buttons, checkboxes, drop-down
    menus, range sliders, dates, phone numbers, and more. (See Table 5-4.) Additionally,
    input fields can be set to initial default values without any user input.


    **Table 5-4 Selected form attributes**


    | Attribute name | Possible values | Description |

    |---|---|---|

    | type | checkbox<br>email<br>submit<br>text<br>password<br>radio<br>(a complete
    list of values has been omitted here for brevity) | Defines the type of input
    field to display in the form. For example, text is used for free text fields,
    and submit is used to create a submit button. |

    | value | text | The initial value of the input control. |'
  merge: -1
  img_proc: true
- pgno: 85
  md: "View the entire list of form input types and example code at www.w3schools.com/tags/att_input_type.asp.\n\
    \n![](img/5a907eb39993e80f28c82efc2e4632b3_85_0.png)\n\n# Creating basic forms\n\
    \nYou create a basic form by\n\n+   1. **Defining a form with the form element.**\n\
    +   \n+      Start by adding an opening `<form>` tag and closing `</form>` tag.\n\
    +   \n+   2. **Using the action attribute, specify in the form element where to\
    \ send form data.**\n+   \n+      Add an action attribute to your opening `<form>`\
    \ tag and set it equal to the URL of a script that will process and store the\
    \ user input.\n+   \n+   3. **Using the method attribute, specify in the form\
    \ element how to send form data.**\n+   \n+      Add a method attribute to your\
    \ opening `<form>` tag and set it equal to POST.\n+   \n+      The method attribute\
    \ is set equal to GET or POST. The technicalities of each are beyond the scope\
    \ of this book, but, in general, POST is used for storing sensitive information\
    \ (such as credit card numbers), whereas GET is used to allow users to bookmark\
    \ or share with others the results of a submitted form (such as, for example,\
    \ airline flight listings).\n+   \n+   4. **Providing a way for users to input\
    \ and submit responses with the input element.**\n+   \n+      Between the opening\
    \ `<form>` and closing `</form>` tags, create one `<input>` tag.\n+   \n+    \
    \  Your form will have only one opening and closing `<form>` tag; however, you\
    \ will have at least two `<input>` tags to collect and submit user data.\n+  \
    \ \n+   5. **Specify input types using the type attribute in the input element.**\n\
    +   \n+      For this example, set the type attribute equal to `\"text\"`.\n+\
    \   \n+      The `<input>` tag does not have a closing tag, which is an exception\
    \ to the “close every tag you open” rule. These tags are called self-closing tags,\
    \ and you can see more examples in Chapter 4.\n+   \n+   6. **Finally, create\
    \ another `<input>` tag and set the type attribute equal to submit.**\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_85_1.png)\n\
    \n![](img/5a907eb39993e80f28c82efc2e4632b3_85_2.png)\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_85_3.png)\n\
    \nThe following example code shows the syntax for creating the form shown in Figure\
    \ 5-11."
  merge: -1
  img_proc: true
