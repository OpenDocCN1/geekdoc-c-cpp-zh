    # Coding Basic Web Page Elements


    In addition to pure layouts, Bootstrap can also create web page components found
    on almost every website. The thought here is the same as when working with layouts—instead
    of recreating the wheel every time by designing your own button or toolbar, it
    would be better to use pre-built code, which has already been tested across multiple
    browsers and devices.


    The following examples show how to quickly create common web components.


    # Designing buttons


    Buttons are a basic element on many web pages, but usually can be difficult to
    set up and style. As shown in Table 8-2, buttons can have various types and sizes.'
