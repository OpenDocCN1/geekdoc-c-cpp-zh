    # Writing More Advanced CSS


    Practice your CSS online using the Codecademy website. Codecademy is a free website
    created in 2011 to allow anyone to learn how to code right in the browser, without
    installing or downloading any software. Practice all of the tags (and a few more)
    that you learned in this chapter by following these steps:


    +   1. **Open your browser, go to** `www.dummies.com/go/codingfd`, **and click
    on the Codecademy link.**

    +   2. **Sign in to your Codecademy account.**

    +      Signing up is discussed in Chapter 3. Creating an account allows you to
    save your progress as you work, but it’s optional.

    +   3. **Navigate to and click on CSS: An Overview, CSS Selectors, and CSS Positioning
    to practice CSS styling and positioning.**

    +   4. **Background information is presented in the upper left portion of the
    site, and instructions are presented in the lower left portion of the site.**

    +   5. **Complete the instructions in the main coding window. As you type, a live
    preview of your code is generated.**

    +   6. **After you have finished completing the instructions, click the Save and
    Submit Code button.**


    If you have followed the instructions correctly, a green checkmark appears, and
    you proceed to the next exercise. If an error exists in your code a warning appears
    with a suggested fix. If you run into a problem, or have a bug you cannot fix,
    click on the hint, use the Q&A Forums, or tweet me at @nikhilgabraham and include
    hashtag #codingFD.'
