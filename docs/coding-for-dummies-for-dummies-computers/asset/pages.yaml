- pgno: 93
  md: '+   2. Place your mouse pointer over a headline, right-click, and from the
    menu that appears select **Inspect Element**.


    A window opens at the bottom of your browser.


    +   3. Click the **Style** tab on the right side of this window to see the CSS
    rules being applied to HTML elements. (See Figure 6-4.)


    ![](img/5a907eb39993e80f28c82efc2e4632b3_93_0.png)


    **Figure 6-3:** The Huffington Post website before modification.


    +   4. Change the color of the headline using CSS. To do this, first find the
    `color` property in the `element.style` section; note the square color box within
    that property that displays a sample of the current color. Click on this box and
    change the value by selecting a new color from the pop-up menu, and then press
    Enter.


    Your headline now appears in the color you picked. (See Figure 6-5.)


    If the `element.style` section is blank and no color property appears, you can
    still add it manually. To do so, click once in the `element.style` section, and
    when blinking cursor appears, type `color: purple`. The headline changes to purple.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_93_1.png)


    As with HTML, you can modify a website’s CSS using Chrome’s Inspect Element feature,
    also known as Developer Tools. Most modern browsers, including Firefox, Safari,
    and Opera, have a similar feature.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_93_2.png)'
