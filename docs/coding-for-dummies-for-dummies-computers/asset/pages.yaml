- pgno: 88
  md: '# 6


    # Getting Stylish with CSS


    # In This Chapter


    +   - Understanding CSS and its structure

    +   - Formatting text, color, and style

    +   - Styling images

    +   - Using CSS in three different contexts


    > > Create your own style . . . let it be unique for yourself and yet identifiable
    for others.

    > >

    > > —Anna Wintour


    The website code examples I have shown you in the preceding chapters resemble
    websites you may have seen from a previous era. Websites you browse today are
    different, and have a more polished look and feel. Numerous factors enabled this
    change. Twenty years ago you might have browsed the Internet with a dial-up modem,
    but today you likely use a very fast Internet connection and a more powerful computer.
    Programmers have used this extra bandwidth and speed to write code to further
    customize and style websites.


    In this chapter you learn modern techniques to style websites using Cascading
    Style Sheets (CSS). First, I discuss basic CSS structure, and then the CSS rules
    to style your content. Finally, I show you how to apply these rules to your websites.


    # What Does CSS Do?


    CSS styles HTML elements with greater control than just using HTML. Take a look
    at Figure 6-1. On the left, Facebook appears as it currently exists; on the right,
    however, the same Facebook page is shown without all the CSS styling. Without
    the CSS, all the images and text appear left-justified, borders and shading disappear,
    and text has minimal formatting.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_89_0.png)


    CSS can style almost any HTML tag that creates a visible element on the page,
    including all the HTML tags used to create headings, paragraphs, links, images,
    lists, and tables that I showed you in previous chapters. Specifically, CSS allows
    you to style:


    +   - Text size, color, style, typeface, and alignment

    +   - Link color and style

    +   - Image size and alignment

    +   - List bullet styles and indentation

    +   - Table size, shading, borders, and alignment


    ![](img/5a907eb39993e80f28c82efc2e4632b3_89_1.png)


    CSS styles and positions the HTML elements that appear on a web page. However,
    some HTML elements (such as, for example, <head>) are not visible on the page
    and are not styled using CSS.


    You may wonder why creating a separate language like CSS to handle styling was
    considered a better approach than expanding the capabilities of HTML. There are
    three reasons:


    +   - **History:** CSS was created four years after HTML as an experiment to see
    whether developers and consumers wanted extra styling effects. At the time, it
    was unclear whether CSS would be useful, and only some major browsers supported
    it. As a result, CSS was created separately from HTML to allow developers to build
    sites using just HTML.

    +   - **Code management:** Initially, some CSS functionality overlapped with existing
    HTML functionality. However, specifying styling effects in HTML results in cluttered
    and messy code. For example, specifying a particular font typeface in HTML requires
    that you include the font typeface'
  merge: -1
  img_proc: true
- pgno: 90
  md: "attribute in every paragraph (`<p>`) tag. Styling a single paragraph this way\
    \ is easy, but applying the `<p>` tag to a series of paragraphs (or an entire\
    \ page or website) quickly becomes tedious. By contrast, CSS requires the typeface\
    \ to be specified only once, and it automatically applies to all paragraphs. This\
    \ feature makes it easier for developers to write and maintain code. In addition,\
    \ separating the styling of the content from the actual content itself has allowed\
    \ search engines and other automated website agents to more easily process the\
    \ content on web pages.\n\n+   - **Inertia:** Currently millions of web pages\
    \ use HTML and CSS separately, and every day that number grows. CSS started as\
    \ a separate language for reasons stated above, and it remains a separate language\
    \ because its popularity continues to grow.\n\n# CSS Structure\n\nCSS follows\
    \ a set of rules to ensure that websites will be displayed in the same way no\
    \ matter the browser or computer used. Sometimes, because of varying support of\
    \ the CSS standard, browsers can and do display web pages differently. Nevertheless,\
    \ generally speaking, CSS ensures that users have a consistent experience across\
    \ all browsers.\n\nYou can use any browser to see CSS you write style your HTML\
    \ files, though I strongly recommend you download, install, and use Chrome or\
    \ Firefox.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_90_0.png)\n\n# Choosing\
    \ the element to style\n\nCSS continues to evolve and support increased functionality,\
    \ but the basic syntax for defining CSS rules remains the same. CSS modifies HTML\
    \ elements with rules that apply to each element. These rules are written as follows:\n\
    \n```\nselector {\n  property: value;\n}\n```\n\nA CSS rule is comprised of three\
    \ parts:\n\n+   - **Selector:** The HTML element you want to style.\n+   - **Property:**\
    \ The feature of the HTML element you want to style, such as, for example, font\
    \ typeface, image height, or color.\n+   - **Value:** The options for the property\
    \ that the CSS rule sets. For example, if color was the property, the value could\
    \ be red."
  merge: -1
  img_proc: true
- pgno: 91
  md: "The selector identifies which HTML element you want to style. In HTML, an element\
    \ is surrounded by angle brackets, but in CSS the selector stands alone. The selector\
    \ is followed by a space, an opening left curly bracket ({), property with a value,\
    \ and then a closing right curly bracket (}). The line break after the opening\
    \ curly bracket, and before the closing curly bracket is not required by CSS —\
    \ in fact, you could put all your code on one line with no line breaks or spaces.\
    \ Using line breaks is convention followed by developers to make CSS easier to\
    \ modify and read.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_91_0.png)\n\nYou\
    \ can find curly brackets on most keyboards to the right of the P key.\n\nThe\
    \ following code shows you an example of CSS modifying a specific HTML element.\
    \ The CSS code appears first, followed by the HTML code that it modifies:\n\n\
    The CSS:\n\n```\n```css\nh1 {\n    font-family: cursive;\n}\n```\n```\n\nAnd now\
    \ the HTML:\n\n```\n```html\n<h1>\n    Largest IPOs in US History\n</h1>\n<ul>\n\
    \    <li>2014: Alibaba - $20B</li>\n    <li>2008: Visa - $18B</li>\n</ul>\n```\n\
    ```\n\nThe CSS selector targets and styles the HTML element with the same name\
    \ (in this case, `<h1>` tags). For example, in Figure 6-2, the heading “Largest\
    \ IPOs in US History,” featured using the opening and closing `<h1>` tags is styled\
    \ using the h1 selector, and the `font-family` property with cursive value.\n\n\
    CSS uses a colon instead of the equals sign (=) to set values against properties.\n\
    \n![](img/5a907eb39993e80f28c82efc2e4632b3_91_1.png)\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_91_2.png)\n\
    \nThe font in Figure 6-2 likely does not appear to be cursive, as defined in the\
    \ code above, because cursive is the name of a generic font family, and not a\
    \ specific font. Generic font families are described later in this chapter.\n\n\
    # My property has value\n\nCSS syntax requires that a CSS property and its value\
    \ appear within opening and closing curly brackets. After each property is a colon,\
    \ and after each value is a semi-colon. This combination of property and value\
    \ together is"
  merge: -1
  img_proc: true
- pgno: 92
  md: "called a *declaration*, and a group of properties and values is called a *declara-tion\
    \ block*.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_92_0.png)\n\n**Figure 6-2:**\
    \ CSS targeting the heading h1 element.\n\nLet us look at a specific example with\
    \ multiple properties and values:\n\n```\nh1 {\n    font-size: 15px;\n    color:\
    \ blue;\n}\n```\n\nIn this example, CSS styles the h1 element, changing the `font-size`\
    \ property to 15px, and the `color` property to blue.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_92_1.png)\n\
    \nYou can improve the readability of your code by putting each declaration (each\
    \ property/value combination) on its own line. Additionally, adding spaces or\
    \ tabs to indent the declarations also improves the readability. Adding these\
    \ line breaks and indentions doesn’t affect browser performance in any way, but\
    \ it will make it easier for you and others to read your code.\n\n# Hacking the\
    \ CSS on your favorite website\n\nIn Chapter 2, you modified a news website’s\
    \ HTML code. In this chapter, you modify its CSS. Let’s take a look at some CSS\
    \ rules in the wild. In this example, you change the CSS on huffingpost.com (or\
    \ your news website of choice) using the Chrome browser. Just follow these steps:\n\
    \n+   1. Using a Chrome browser, navigate to your favorite news website, ideally\
    \ one with many headlines. (See Figure 6-3.)"
