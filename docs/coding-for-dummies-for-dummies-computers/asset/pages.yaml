- pgno: 235
  md: "| Type | Operator | Description | Example |\n|---|---|---|---|\n| **Table 14-4\
    \ — Common Python Comparison Operators** |  |  |  |\n| Less than | `<` | Evaluates\
    \ whether one value is less than another value | `x < 55` |\n| Greater than |\
    \ `>` | Evaluates whether one value is greater than another value | `x > 55` |\n\
    | Equality | `==` | Evaluates whether two values are equal | `x == 55` |\n| Less\
    \ than or equal to | `<=` | Evaluates whether one value is less than or equal\
    \ to another value | `x <= 55` |\n| Greater than or equal to | `>=` | Evaluates\
    \ whether one value is greater than or equal to another value | `x >= 55` |\n\
    | Inequality | `!=` | Evaluates whether two values are not equal | `x != 55` |\n\
    \nHere is an example if statement.\n\n```\ncarSpeed=55\nif carSpeed > 55:\n  \
    \  print \"You are over the speed limit!\"\nelif carSpeed == 55:\n    print \"\
    You are at the speed limit!\"\nelse:\n    print \"You are under the speed limit!\"\
    \n```\n\nAs the diagram in Figure 14-1 shows, there are two conditions, each signaled\
    \ by the diamond, which are evaluated in sequence. In this example, carSpeed is\
    \ equal to 55, so the first condition (carSpeed > 55) is false, and then the second\
    \ condition (carSpeed==55) is true and the statement executes printing “You are\
    \ at the speed limit!” When a conditional is true, the if statement stops executing,\
    \ and the else is never reached.\n\n# Input and output\n\nPython can collect input\
    \ from the user, and display output to the user. To collect user input use the\
    \ raw_input(\"Prompt\") method, which stores the user input as a string. In the\
    \ example below, the user enters his full name which is stored in a variable called\
    \ full_name.\n\n```\nfull_name = raw_input(\"What’s your full name?\")\n```"
