  md: "![](img/5a907eb39993e80f28c82efc2e4632b3_80_0.png)\n\nStretching a cell across\
    \ columns or rows is called *spanning*.\n\nThe colspan attribute spans a column\
    \ over subsequent vertical columns. The value of the colspan attribute is set\
    \ equal to the number of columns you want to span. You always span a column from\
    \ left to right. Similarly, the rowspan attribute spans a row over subsequent\
    \ horizontal rows. Set rowspan equal to the number of rows you want to span.\n\
    \nThe following code generates a part of the table shown in Figure 5-8. You can\
    \ see the colspan attribute spans the Total Revenue cell across two columns. As\
    \ described in Chapter 4, the <strong> tag is used to mark important text, and\
    \ is shown as bold by the browser.\n\n```\n```html\n<tr>\n    <td colspan=\"2\"\
    >\n        <strong>Total Revenue</strong>\n    </td>\n    <td>\n        <strong>7,872,000</strong>\n\
    \    </td>\n    <td>\n        <strong>5,089,000</strong>\n    </td>\n    <td>\n\
    \        <strong>3,711,000</strong>\n    </td>\n</tr>\n```\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_80_1.png)\n\
    \nIf you set a column or row to span by more columns or rows than are actually\
    \ present in the table, the browser will insert additional columns or rows, changing\
    \ your table layout.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_80_2.png)\n\n\
    CSS helps size individual columns and rows, as well as entire tables. See Chapter\
    \ 7.\n\n# Aligning tables and cells\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_80_3.png)\n\
    \nThe latest version of HTML does not support the tags and attributes in this\
    \ section. Although your browser may correctly render this code, there is no guarantee\
    \ your browser will correctly render it in the future. I include these attributes\
    \ because as of this writing, HTML code on the Internet, including the Yahoo Finance\
    \ site in the previous examples, still use these deprecated (older) attributes\
    \ in tables. This code is similar to expletives — recognize them but try not to\
    \ use them. Refer to Chapter 6 to see modern techniques using Cascading Style\
    \ Sheets (CSS) for achieving the identical effects.\n\nThe table element has three\
    \ deprecated attributes to know — align, width, and border. These attributes are\
    \ described in Table 5-1."
