    \ (repeat-y)<br>horizontally and vertically (repeat)<br>don't repeat at all (no-repeat).\
    \ |\n| `background-attachment` | `scroll`<br>`fixed` | Sets the background to\
    \ scroll with other content (scroll), or to remain fixed (fixed). |\n\n# Setting\
    \ the background-image\n\nAs shown in the following example, the background-image\
    \ property can set the background image for the entire web page or a specific\
    \ element.\n\n```\nbody {\n    background-image:\n        url(\"http://upload.wikimedia.org/wikipedia/commons/e/e5/Chrysler_Building_\n\
