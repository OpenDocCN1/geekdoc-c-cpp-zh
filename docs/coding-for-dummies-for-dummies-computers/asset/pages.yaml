    # ## *Working with string and number methods*


    The most basic data types, usually stored in variables, are strings and numbers.
    Programmers often need to manipulate strings and numbers to perform basic tasks
    such as the following:


    +   - Determining the *length* of a string, as for a password.

    +   - Selecting part (or *substring*) of a string, as when choosing the first
    name in a string that includes the first and last name.

    +   - Rounding a number to *fixed* numbers of decimal points, as when taking a
    subtotal in an online shopping cart, calculating the tax, rounding the tax to
    two decimal points, and adding the tax to the subtotal.


    These tasks are so common that JavaScript includes shortcuts called *methods*
    (italicized above) that make performing tasks like these easier. The general syntax
    to perform these tasks is to follow the affected variable''s name or value with
    a period and the name of the method, as follows for values and variables:


    ```

    ```

    value.method;

    variable.method;

    ```

    ```


    *Table 9-3* shows examples of JavaScript methods for the basic tasks discussed
    above. Examples include methods applied to values, such as strings, and to variables.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '**Table 9-3 — Common JavaScript Methods**


    | Method | Description | Example | Result |

    |---|---|---|---|

    | `.toFixed(n)` | Rounds a number to *n* decimal places | `var jenny = 8.675309;`<br>`jenny.toFixed(2);`
    | `8.68` |

    | `.length` | Represents the number of characters in a string | `"Nik".length;`
    | `3` |

    | `.substring(start, end)` | Extracts portion of the string beginning from position
    start to end. Position refers to the location between each character, and starts
    before the first character with zero. | `var name = "Inbox";`<br>`name.substring(2,5);`
    | `box` |


    ![](img/5a907eb39993e80f28c82efc2e4632b3_158_0.png)


    When using a string, or assigning a variable to a value that is a string, always
    enclose the string in quotes.


    The `.toFixed` and `.length` methods are relatively straightforward, but the `.substring`
    method can be a little confusing. The starting and ending positions used in `.substring(start,
    end)` do not reference actual characters, but instead reference the space between
    each character. Figure 9-5 shows how the start and end position works. The statement
    `"Inbox".substring(2,5)` starts at position 2, which is between "n" and "b", and
    ends at position 5 which is after the "x".


    ![](img/5a907eb39993e80f28c82efc2e4632b3_158_1.png)


    *Figure 9-5.* The `.substring` method references positions that are between characters
    in a string.'
