- pgno: 193
  md: "+   - **Building code from scratch:** This is the best option if the functionality\
    \ in a particular step is unique or strategically important, an area of strength\
    \ for the app, and existing solutions are expensive or non-existent. With this\
    \ option, you and developers within the company write the code.\n+   - **Buying\
    \ or using a pre-existing solution:** This is the best option if the functionality\
    \ in a particular step is common, non-core technical area for the app, and existing\
    \ solutions are competitively priced. With this option, you and developers working\
