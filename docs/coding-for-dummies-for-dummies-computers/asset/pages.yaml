    \ <p><a href=\"http://twitter.com/Lord_Voldemort\">Lord Voldemort</a></p>\n\n\
    \  </body>\n</html>\n```\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_117_0.png)\n\
    \nBored Elon Musk is a parody of Elon Musk, the founder of PayPal, Tesla, and\
