- pgno: 98
  md: "the `font-family` property displays your specified font only if that font is\
    \ already installed on their system.\n\nThe `font-family` property can be set\
    \ equal to two types of values:\n\n+   - **Font name:** Specific font names such\
    \ as Times New Roman, Arial, and Courier.\n+   - **Generic font family:** Modern\
    \ browsers usually define one installed font for each generic font family. These\
    \ five generic font families include:\n+     - `serif` (Times New Roman, Palatino)\n\
    +     - `sans-serif` (Helvetica, Verdana)\n+     - `monospace` (Courier, Andale\
    \ Mono)\n+     - `cursive` (Comic Sans, Florence)\n+     - `fantasy` (Impact,\
    \ Oldtown)\n\nWhen using `font-family` it’s best to define two or three specific\
    \ fonts followed by a generic font family as a fallback in case the fonts you\
    \ specify aren’t installed, as in the following example:\n\n```\n```css\np {\n\
    \    font-family: \"Times New Roman\", Helvetica, serif;\n}\n```\n```\n\nIn this\
    \ example, the paragraph’s font family is defined as Times New Roman. If Times\
    \ New Roman isn’t installed on the user’s computer, the browser then uses Helvetica.\
    \ If Helvetica is not installed, the browser will use any available font in the\
    \ generic serif font family.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_98_0.png)\n\
    \nWhen using a font name with multiple words (such as Times New Roman) enclose\
    \ the font name in quotes.\n\n# Setting the text-decoration\n\nThe `text-decoration`\
    \ property sets any font underlining or strikethrough. By default, the property\
    \ is equal to none, which does not have to be specified. In the following example,\
    \ any text with an h1 heading is underlined whereas any text inside a paragraph\
    \ tag is made strikethrough:\n\n```\n```css\nh1 {\n    text-decoration: underline;\n\
    }\np {\n    text-decoration: line-through;\n}\n```\n```"
