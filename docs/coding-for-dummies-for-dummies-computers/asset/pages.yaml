- pgno: 97
  md: "+   - **Hex code:** Colors can be defined by component parts of red, green,\
    \ and blue, and when using hexadecimal code over 16 million colors can be referenced.\
    \ In the code example, I set the `h1` color equal to `#FF0000`. After the hashtag,\
    \ the first two digits (`FF`) refers to the red in the color, the next two digits\
    \ (`00`) refers to the green in the color, and the final two digits (`00`) refers\
    \ to the blue in the color.\n+   - **RGB value:** Just like hex codes, RGB values\
    \ specify the red, green, and blue component parts for over 16 million colors.\
    \ RGB values are the decimal equivalent to hexadecimal values.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_97_0.png)\n\
    \nDon’t worry about trying to remember hex codes or RGB values. You can easily\
    \ identify colors using an online color picker such as the one at www.w3schools.com/tags/ref_colorpicker.asp.\n\
    \nThe following example shows all three types of color changes:\n\n```\n```css\n\
    p {\n  color: red\n}\nh1 {\n  color: #FF0000\n}\nli {\n  color: rgb(255,0,0)\n\
    }\n```\n```\n\n`li` is the element name for a list item in ordered or unordered\
    \ lists.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_97_1.png)\n\nAll three colors\
    \ in the code example above reference the same shade of red. For the full list\
    \ of colors that can be referenced by name see here: www.w3.org/TR/css3-color/#svg-color.\n\
    \n![](img/5a907eb39993e80f28c82efc2e4632b3_97_2.png)\n\n# ### Setting the font-style\
    \ and font-weight\n\nThe `font-style` property can set text to italics, and the\
    \ `font-weight` property can set text to bold. For each of these properties, the\
    \ default is normal, which doesn’t need to be specified. In the example below,\
    \ the paragraph is styled so the font appears italicized and bold. Here’s an example\
    \ of each:\n\n```\n```css\np {\n  font-style: italics;\n  font-weight: bold;\n\
    }\n```\n```\n\n# ### Setting the font-family\n\nThe `font-family` property sets\
    \ the typeface used for text. The property is set equal to one font, or to a list\
    \ of fonts separated by commas. Your website visitors will have a variety of different\
    \ fonts installed on their computers, but"
  merge: -1
