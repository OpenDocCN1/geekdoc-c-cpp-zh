- pgno: 282
  md: '# Author’s Acknowledgments


    This book was possible with help from a number of people.


    Thanks to all the people at Wiley, including Steven Hayes, for keeping an open
    mind to as many ideas as can fit in one phone call, and Christopher Morris for
    edits and helpful advice. Also, thank you to all the technical editorial, layout,
    and graphics folks for turning text of variable quality into text of outstanding
    quality.


    Thanks to those of you who helped shape the content in this book and online. For
    everyone at Codecademy, including Zach and Ryan, thank you for the feedback on
    the chapters and for answering my questions. Thanks to Douglas Rushkoff, for starting
    a national conversation on whether we as a society should program or be programmed,
    and for bringing this message to schools, universities, and non-profits. Thanks
    to Susan Kish, for being the only executive I can find who has spoken publicly
    about her journey learning how to code (check out her TED Talk), and for seeing
    the future of coding in corporations. Thanks to Alia Shafir and Joshua Slusarz
    for all the coding sessions you helped organize, leaders you wrangled, rooms you
    reserved, and laptops you rebooted. Thanks to Melissa Fresholtz and her leadership
    team for supporting a culture of code, and bringing code education even to places
    where it’s used every day. Thanks to alumni at Cornell University, Northwestern
    University, University of Virginia, and Yale University for testing early versions
    of content, and helping make it better. Thanks to the people at Donorschoose.org,
    including Charles Best and Ali Aluselitz, at Google.org for shining a bright light
    on coding for women and girls. Thanks to Code.org for making coding accessible
    and cool for tens of millions of kids in the United States and abroad.


    Finally, thanks to Molly, who ordered more take-out, brewed more tea, and cleaned
    the apartment more times than I can count.'
  merge: -1
  img_proc: true
