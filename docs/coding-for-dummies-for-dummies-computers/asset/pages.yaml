- pgno: 237
  md: "# Dot notation with upper(), lower(), capitalize(), and strip()\n\nStandardizing\
    \ user input to have proper case and remove extra white space characters is often\
    \ necessary to easily sort the data later. For example, imagine you are designing\
    \ a website for the New York Knicks so fans can meet players after the game. The\
    \ page asks for fans to enter their name, so that team security can later check\
    \ fan names against this list before entry. Reviewing past fan entries you see\
    \ that fans enter the same name several ways like “Mark”, “mark”, “marK “ and\
    \ other similar variants that cause issues when the list is sorted alphabetically.\
    \ To make the input and these names consistent you could use the string functions\
    \ described in Table 14-5.\n\n**Table 14-5: Select Python String Functions**\n\
    \n| Function name | Description | Example | Result |\n|---|---|---|---|\n| `string.upper()`\
    \ | Returns all upper-case characters | `\"nY\".upper()` | `\"NY\"` |\n| `string.lower()`\
    \ | Returns all lower-case characters | `\"Hi\".lower()` | `\"hi\"` |\n| `string.capitalize()`\
    \ | Capitalizes first letter, lowercases remaining letters | `\"wake UP\".capitalize()`\
    \ | `\"Wake up\"` |\n| `string.strip()` | Removes leading and trailing whitespaces\
    \ | `\" Ny \".strip()` | `\"Ny\"` |\n\n# String formatting with %\n\nTo insert\
    \ variable values into strings shown to the user, you can use the string format\
    \ operator %. Inserted into the string definition, %d is used to specify integers,\
    \ %s is used to specify strings, and the variables to format (mapping key) are\
    \ specified in parenthesis after the string is defined. See the example code and\
    \ result below:\n\nCode:\n\n```\nyearofbirth = 1990\npplinroom = 20\nname = \"\
    Mary\"\nprint \"Your year of birth is %d. Is this correct?\" % (yearofbirth)\n\
    print \"Your year of birth is %d. Is this correct?\" % (yearofbirth)\nprint \"\
    There are %d women in the room born in %d and %s is one of them.\" %\n      (pplinroom/2,\
    \ yearofbirth, name)\n```"
  merge: -1
