    \nMany text website navigation bars are created using unordered bulleted lists\
    \ with the marker set to none. You can see an example in the Codecademy CSS Positioning\
    \ course starting with exercise 21.\n\nCSS properties and values apply to a CSS\
    \ selector and modify an HTML element. In the following example, embedded CSS\
    \ (between the opening and closing `<style>` tags) and in-line CSS (defined with\
    \ the style attribute in the HTML) is used to:\n\n+   - Change the marker in an\
    \ unordered list to a square using `list-style-type`\n+   - Change the marker\
