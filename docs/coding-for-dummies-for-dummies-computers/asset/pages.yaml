  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_122_0.png)


    Proactively use a search engine, such as Google, to search for additional CSS
    effects. For example, if you wanted to increase the spacing between each list
    item, open your browser and search for *list item spacing css*. Links appearing
    in the top ten results should include:


    +   - `www.w3schools.com`: A beginner tutorial site.

    +   - `www.stackoverflow.com`: A discussion board for experienced developers.

    +   - `www.mozilla.org`: A reference guide initially created by the foundation
    that maintains the Firefox browser, and now maintained by a community of developers.


    Each of these sites is a good first place to start, and you should look for answers
    that include example code.


    # Aligning and Laying Out Your Elements


    CSS not only allows control over the formatting of HTML elements, it also allows
    control over the placement of these elements on the page, known as page layout.
    Historically, developers used HTML tables to create page layouts. HTML table page
    layouts were tedious to create, and required that developers write a great deal
    of code to ensure consistency across browsers. CSS eliminated the need to use
    tables to create layouts, helped reduce code bloat, and increased control of page
    layouts.


    # Organizing data on the page


    Before diving in to any code, let’s review in Figure 7-9 some of the basic ways
    we can structure the page and the content on it. Layouts have evolved over time,
    with some layouts working well on desktop computers but not displaying optimally
    on tablet or mobile devices.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_122_1.png)


    Always ask yourself how your intended layout will appear on desktop, tablet, and
    mobile devices.


    Hundreds of different layouts exist, and a few selected page layouts appear here
    along with examples of each.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_122_2.png)


    Left and right navigation toolbars are not usually seen on mobile devices. Top
    navigation toolbars are used both on desktop and mobile devices, and bottom navigation
    toolbars are most common on mobile devices.'
