  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_126_0.png)


    Figure 7-13: Two boxes created with HTML `<div>` tag and styled using CSS.


    # Understanding the box model


    Just as we created boxes with the `<div>` tags above, CSS creates a box around
    each and every single element on the page, even text. Figure 7-14 shows the box
    model for an image that says “This is an element.” These boxes may not always
    be visible, but are comprised of four parts:


    +   - **content:** HTML tag that is rendered in the browser

    +   - **padding:** Optional spacing between the content and the border

    +   - **border:** Marks the edge of the padding, and varies in width and visibility

    +   - **margin:** Transparent optional spacing surrounding the border'
  merge: -1
  img_proc: true
- pgno: 127
  md: "![](img/5a907eb39993e80f28c82efc2e4632b3_127_0.png)\n\n**Figure 7-14:** Box\
    \ model for *img* element.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_127_1.png)\n\
    \nUsing the Chrome browser, navigate to your favorite news website, then right-click\
    \ an image and in the context menu choose Inspect Element. On the right side of\
    \ the screen you see three tabs; click the Computed tab. The box model is displayed\
    \ for the image you right-clicked, showing the content dimensions, and then dimensions\
    \ for the padding, border, and margin.\n\nThe padding, border, and margin are\
    \ CSS properties, and the value is usually expressed in pixels. In the following\
    \ code, shown in Figure 7-15, padding and margins are added to separate each div.\n\
    \n```\n```css\ndiv {\n    height: 100px;\n    width: 100px;\n    border: 1px solid\
    \ black;\n    padding: 10px;\n    margin: 10px;\n}\n```\n```\n\n# Positioning\
    \ the boxes\n\nNow that you understand how to group elements using HTML, and how\
    \ CSS views elements, the final piece is to position those elements on the page.\
    \ Various techniques can be used for page layouts, and a comprehensive overview\
    \ of each technique is out of the scope of this book. However, one technique to\
    \ create the layouts shown in Figure 7-16 is to use the float and clear properties\
    \ (as described in Table 7-3)."
