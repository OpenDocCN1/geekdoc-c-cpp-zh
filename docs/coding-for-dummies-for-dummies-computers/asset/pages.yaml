  md: 'There are three ways to apply CSS — inline CSS using the style attribute, embedded
    CSS using an opening and closing `<style>` tag, and in a separate CSS style sheet.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_114_0.png)


    ![](img/5a907eb39993e80f28c82efc2e4632b3_114_1.png)


    **Figure 7-2:** Ordered and unordered lists modified to change the marker type.


    # Designing tables


    In Chapter 5, you found out how to create basic tables. By default, the width
    of these tables expands to fit content inside the table, content in individual
    cells is left aligned, and no borders are displayed.


    These defaults may not be appropriate for all circumstances. Deprecated (unsupported)
    HTML attributes can modify these defaults, but at any time browsers could stop
    recognizing these attributes, and any tables created with these attributes would
    display incorrectly. As a safer alternative, CSS can style tables with greater
    control. Three common tasks CSS can perform for tables include the following:


    +   - Setting the width of a table, table row, or individual table cell with the
    `width` property.

    +   - Aligning text within the table with the `text-align` property.

    +   - Displaying borders within the table with the `border` property. (See Table
    7-2.)'
  merge: -1
  img_proc: true
