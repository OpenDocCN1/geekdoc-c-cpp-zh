- pgno: 95
  md: 'on a live website, you changed the heading color — a common task in CSS. Other
    common tasks performed with CSS include:


    +   - Changing font size, style, font family, and decoration

    +   - Customizing links including color, background color, and link state

    +   - Adding background images and formatting foreground images


    # Font gymnastics: size, color, style, family, and decoration


    CSS lets you control text in many HTML elements. The most common text-related
    CSS properties and values are shown in Table 6-1. I describe these properties
    and values more fully in the sections that follow.


    **Table 6-1. Common CSS Properties and Values for Styling Text**


    | Property name | Possible values | Description |

    |---|---|---|

    | `font-size` | `pixels (#px)`<br>`%`<br>`em (#em)` | Specifies the size of text
    measured either in pixels, as a percentage of the containing element’s font size,
    or with an em value which is calculated by desired pixel value divided by containing
    element font size in pixels. Example: `font-size: 16px;` |

    | `color` | `name`<br>`hex code`<br>`rgb value` | Changes the color of the text
    specified using names (`color: blue;`), hexadecimal code (`color: #0000FF;`),
    or RGB (red, green, and blue) value (`color: rgb(0,0,255);`). |

    | `font-style` | `normal`<br>`italic` | Sets font to appear in italics (or not).
    |

    | `font-weight` | `normal`<br>`bold` | Sets font to appear as bold (or not). |

    | `font-family` | `font name` | Sets the font typeface. Example: `font-family:
    "serif";` |

    | `text-decoration` | `none`<br>`underline`<br>`line-through` | Sets font to have
    an underline or strikethrough (or not). |'
