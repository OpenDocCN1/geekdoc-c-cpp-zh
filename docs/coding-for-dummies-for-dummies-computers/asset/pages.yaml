- pgno: 216
  md: '+   - Dot-notation is frequently used: the period (as in `.chomp` or `.upcase`)
    signals the use of a method, which is common in Ruby. A method is a set of instructions
    that carry out a particular task. In this code example, `.chomp` removes carriage
    returns from the user input, and `.upcase` transforms the user input to all upper
    case.

    +   - Exclamation points signal danger; methods applied to variables, like `first_name.upcase`,
    by default do not change the variable’s value and only transform a copy of the
    variable’s value. Exclamation points signal a permanent change, so `first_name.upcase!`
    permanently changes the value of the variable `first_name`.


    # Coding Common Ruby Tasks and Commands


    Ruby can perform many tasks from simple text manipulation to complex login and
    password user authentication. The following basic tasks, while explained within
    a Ruby context, are core programming concepts applicable to any programming language.
    If you have read about other programming language in this book, the following
    will look familiar. These tasks all take place in the Ruby shell, which looks
    like a command line interface. Ruby can also generate HTML to create interactive
    web pages, but that is slightly more complex and not covered here.


    Instructions on how to do these basic tasks are below, but you can also practice
    these skills right away by jumping ahead to the “Building a Simple Form-Text Formatter
    Using Ruby” section, later in this chapter.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_216_0.png)


    Programming languages can do the same set of tasks, and understanding the set
    of tasks in one language makes it easier to understand the next language.


    # Defining data types and variables


    Variables, like in algebra, are keywords used to store data values for later use.
    Though the data stored in a variable may change, the variable name will always
    be the same. Think of a variable like a gym locker — what you store in the locker
    changes, but the locker number always stays the same.


    Variables in Ruby are named using alphanumeric characters and the underscore (`_`)
    character, and cannot begin with a number or capital letter. Table 13-1 lists
    some of the data types that Ruby can store.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '| Data Type | Description | Example |

    |---|---|---|

    | Numbers | Positive or negative numbers with or without decimals | 156--101.96
    |

    | Strings | Printable characters | Holly<br>NovakSeñor |

    | Boolean | Value can either be true or false | truefalse |


    To initially set or change a variable’s value, write the variable name and use
    one equals sign, as shown in the following example:


    ```

    myName = "Nick"

    pizzaCost = 1

    totalCost = pizzaCost * 2

    ```


    ![](img/5a907eb39993e80f28c82efc2e4632b3_217_0.png)


    Unlike JavaScript, Ruby does not require you to use the var keyword to declare
    a variable, or to set its value the first time.


    Variable names are case sensitive, so when referring to a variable in your program
    remember that MyName is a different variable from myName. In general, give your
    variable a name that describes the data being stored.


    # Computing simple and advanced math


    After you create variables, you may want to do some math on the numerical values
    stored in those variables. Simple math like addition, subtraction, multiplication,
    and division is done using operators you already know. One difference is exponentiation
    (such as, for example, 2 to the power of 3) is done using two asterisks. Examples
    are shown below, and in Table 13-2.


    ```

    sum1 = 1+1  [equals 2]

    sum1 = 5-1  [equals 4]

    sum1 = 3*4  [equals 12]

    sum1 = 9 / 3  [equals 3]

    sum1 = 2**3  [equals 8]

    ```


    Advanced math like absolute value, rounding to the nearest decimal, rounding up,
    or rounding down can be performed using number methods, which are shortcuts to
    make performing certain tasks easier. The general syntax is to follow the variable
    name or value with a period, and the name of the method as follows for values
    and variables


    ```

    value.method

    variable.method

    ```'
  merge: -1
  img_proc: true
- pgno: 218
  md: '![](img/5a907eb39993e80f28c82efc2e4632b3_218_0.png)


    The values and variables that methods act upon are called objects. If you compared
    Ruby to the English language, think of objects like nouns and methods like verbs.


    | Method Name | Description | Example | Result |

    |---|---|---|---|

    | `.abs` | Returns the absolute value of a number | `-99.abs` | `99` |

    | `.round(ndigits)` | Rounds a number to n digits | `3.1415.round(2)` | `3.14`
    |

    | `.floor` | Rounds down to the nearest integer | `4.7.floor` | `4` |

    | `.ceil` | Rounds up to the nearest integer | `7.3.ceil` | `8` |


    # Using strings and special characters


    Along with numbers, variables in Ruby can also store strings. To assign a value
    to a string use single or double quotation marks.


    ```

    firstname = ''Jack''

    lastname = ''Dorsey''

    ```


    To display these variable values, you can puts or print the variable value to
    the screen. The difference between the two is puts adds a newline (i.e., carriage
    return) after displaying the value, while print does not.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_218_1.png)


    Variables can also store numbers as strings instead of numbers. Even though the
    string looks like a number, Ruby will not be able to perform any operations on
    it. For example, Ruby cannot evaluate this code as is: `amountdue = "18" + 24`.


    One issue arises with strings and variables — what if your string itself includes
    a single or double quote? For example, if I want to store a string with the value
    “I’m on my way home” or “Carrie said she was leaving for “just a minute””. As
    is, the double or single quotes within the string would cause problems with variable
    assignment. The solution is to use special characters called escape sequences
    to indicate when you want to use characters like quotation marks, which normally
    signal the beginning or end of a string, or other non-printable characters like
    tabs. Table 13-3 shows some examples of escape sequences.'
  merge: -1
  img_proc: true
