- pgno: 278
  md: '# # About the Author


    **Nikhil Abraham** has worked at Codecademy.com for the last two years. At Codecademy,
    he helps technology, finance, media, and advertising companies teach their employees
    how to code. With his help, thousands of marketing, sales, and recruiting professionals
    have written their first lines of code and built functional applications. In addition
    to teaching, he manages partnerships and business development for Codecademy,
    and has helped bring coding to schools in the United States, Brazil, Argentina,
    France, and the United Kingdom.


    Prior to Codecademy, Nikhil worked in a variety of fields, including management
    consulting, investment banking, and law, and founded a Y-Combinator-backed technology
    education startup. He received a JD and MBA from the University of Chicago, and
    a BA in quantitative economics from Tufts University.


    Nikhil lives in Manhattan, New York.'
  merge: -1
