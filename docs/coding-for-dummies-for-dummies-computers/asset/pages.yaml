    +   - Spotify for internal data analysis.

    +   - Dropbox for its desktop client software.

    +   - Reddit for generating crowd-sourced news.

    +   - Industrial Light & Magic and Disney Animation for creating film special
    effects.


    From websites to software to special effects, Python is an extremely versatile
