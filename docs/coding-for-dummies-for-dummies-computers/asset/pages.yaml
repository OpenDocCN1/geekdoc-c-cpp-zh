- pgno: 121
  md: "# Naming your code using the id attribute\n\nUse the id attribute to style\
    \ one specific element on your web page. The id attribute can name any HTML element,\
    \ and is always placed in the opening HTML tag. Additionally, each element can\
    \ have only one id attribute value, and the attribute value must appear only once\
    \ within the HTML file. After you define the attribute in the HTML file, you refer\
    \ to the HTML element in your CSS by writing a hashtag (#) followed by the attribute\
    \ value. Using the id attribute, the following code styles the Modern Seinfeld\
    \ Twitter link the color red with a yellow background:\n\nHTML:\n\n```\n<p><a\
    \ href=\"http://twitter.com/SeinfeldToday\" id=\"jerry\">Modern Seinfeld</a></p>\n\
    ```\n\nCSS:\n\n```\n#jerry {\n    color: red;\n    background-color: yellow;\n\
    }\n```\n\n# Naming your code using the class attribute\n\nUse the class attribute\
    \ to style multiple elements on your web page. The class attribute can name any\
    \ HTML element, and is always placed in the opening HTML tag. The attribute value\
    \ need not be unique within the HTML file. After you define the attribute in the\
    \ HTML file, you refer to the HTML element by writing a period (.) followed by\
    \ the attribute value. Using the class attribute, the following code styles all\
    \ the Parody Tweet Twitter account links the color red with no underline:\n\n\
    HTML:\n\n```\n<ul>\n    <li>\n    <a href=\"http://twitter.com/BoredElonMusk\"\
    \ class=\"tech\">Bored Elon Musk</a>\n    </li>\n    <li>\n    <a href=\"http://twitter.com/VinodColeslaw\"\
    \ class=\"tech\">Vinod Coleslaw</a>\n    </li>\n    <li>\n    <a href=\"http://twitter.com/Horse_ebooks\"\
    \ class=\"tech\">Horse ebooks</a>\n    </li>\n</ul>\n```\n\nCSS:\n\n```\n.tech\
    \ {\n    color: red;\n    text-decoration: none;\n}\n```"
