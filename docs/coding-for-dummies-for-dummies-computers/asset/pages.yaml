- pgno: 23
  md: '# Understanding What Coding Can Do for You


    Coding can be used to perform tasks and solve problems that you experience every
    day. The “everyday” situations in which programs or apps can provide assistance
    continues to grow at an exponential pace, but this was not always the case. The
    rise of web applications, internet connectivity, and mobile phones have inserted
    software programs into daily life, and lowered the barrier for you to become a
    creator, solving personal and professional problems with code.


    # Eating the world with software


    In 2011, Marc Andreessen, creator of Netscape Navigator and now venture capitalist,
    noted that “software is eating the world.” He predicted that software companies
    would disrupt existing companies at a rapid pace. Traditionally, code powered
    software used on desktops and laptops. The software had to first be installed,
    and then you had to supply data to the program. Three trends have dramatically
    increased the use of code in everyday life:


    +   - **Web-based software:** This software operates in the browser without requiring
    installation. For example, if you wanted to check your email, you previously had
    to install an email client either by downloading the software or from a CD-ROM.
    Sometimes, issues arose when the software was not available for your operating
    system, or conflicted with your operating system version. Hotmail, a web-based
    email client, rose to popularity, in part, because it allowed users visiting www.hotmail.com
    to instantly check their email without worrying about installation or software
    compatibility. Web applications increased consumer appetite to try more applications,
    and developers in turn were incentivized to write more applications.

    +   - **Internet broadband connectivity:** Broadband connectivity has increased,
    providing a fast Internet connection to more people in the last few years than
    in the previous decade. Today, more than two billion people can access web-based
    software, up from approximately 50 million only a decade ago.

    +   - **Mobile phones:** Today’s smartphones bring programs with you wherever
    you go, and help supply data to programs. Many software programs became more useful
    when accessed on-the-go than when limited to a desktop computer. For instance,
    use of maps applications greatly increased thanks to mobile phones because users
    need directions the most when lost, not just when planning a trip at home on the
    computer. In addition, mobile phones are equipped with sensors that measure and
    supply data to programs like orientation, acceleration, and current'
  merge: -1
  img_proc: true
