- pgno: 165
  md: '*scraping or web scraping.* These processes, which vary in sophistication from
    simple to complex, include:


    +   - **People manually copying and pasting data from websites into a database:**
    Crowdsourced websites, such as `www.retailmenot.com` recently listed on the NASDAQ
    stock exchange, obtain some data in this way.

    +   - **Code snippets written to find and copy data that match pre-set patterns:**
    The pre-set patterns are also called regular expressions, which match character
    and string combinations, and can be written using web languages like JavaScript
    or Python.

    +   - **Automated software tools which allow you to point and click the fields
    you want to retrieve from a website:** For example, `www.kinomlabs.com` is one
    point-and-click solution, and when FIFA World Cup 2014 lacked a structured API,
    `kinomlabs.com` extracted data, such as scores, and made it easily accessible.


    The advantage of screen scraping is that the data is likely to be available and
    with less restrictions because it is content that regular users see. If an API
    fails, it may go unnoticed and depending on the site take time to fix. By contrast,
    the main website failing is usually a top priority item, and fixed as soon as
    possible. Additionally, companies may enforce limits on data retrieved from the
    API that are rarely seen and harder to enforce when screen scraping.


    The disadvantage of screen scraping is that the code written to capture data from
    a website must be precise and can break easily. For example, a stock price is
    on a web page in the second paragraph, on the third line, and is the fourth word.
    The screen scraping code is programmed to extract the stock price from that location,
    but unexpectedly the website changes its layout so the stock price is now in the
    fifth paragraph. Suddenly, the data is inaccurate. Additionally, there may be
    legal concerns with extracting data in this way, especially if the website terms
    and conditions prohibit screen scraping. In one example, Craigslist terms and
    conditions prohibited data extraction through screen scraping, and after litigation
    a court banned a company which accessed Craigslist data using this technique.


    # Researching and choosing an API


    For any particular task there are many APIs that can provide you with the data
    you seek. The following are some factors to consider when selecting an API for
    use in your programs:


    +   - **Data availability:** Make a wish list of fields you want to use with the
    API, and compare it to fields actually offered by various API providers.

    +   - **Data quality:** Benchmark how various API providers gather data, and the
    frequency with which the data is refreshed.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '+   - **Site reliability:** Measure site uptime because regardless of how good
    the data may be, the website needs to stay online to provide API data. Site reliability
    is a major factor in industries like finance and healthcare.

    +   - **Documentation:** Review the API documentation for reading ease and detail
    so you can easily understand the API features and limitations before you begin.

    +   - **Support:** Call support to see response times and customer support knowledgeability.
    Something will go wrong and when it does you want to be well supported to quickly
    diagnose and solve any issues.

    +   - **Cost:** Many APIs provide free access below a certain request threshold.
    Investigate cost structures if you access those levels so you can properly budget
    for access to your API.


    # Using JavaScript Libraries


    A JavaScript library is pre-written JavaScript code that makes the development
    process easier. The library includes code for common tasks that has already been
    tested and implemented by others. To use the code for these common tasks, you
    only need to call the function or method as defined in the library. Two of the
    most popular JavaScript libraries are jQuery and D3.js.


    # jQuery


    jQuery uses JavaScript code to animate web pages by modifying CSS on the page,
    and to provide a library of commonly used functions. Although you could write
    JavaScript code to accomplish any jQuery effect, jQuery’s biggest advantage is
    completing tasks by writing fewer lines of code. As the most popular JavaScript
    library today, jQuery is used on the majority of top 10,000 most visited websites.
    Figure 9-8 shows a photo gallery with jQuery transition image effects.


    # D3.js


    D3.js is a JavaScript library for visualizing data. Just like with jQuery, similar
    effects could be achieved using JavaScript, but only after writing many more lines
    of code. The library is particularly adept at showing data across multiple dimensions,
    and creating interactive visualizations of datasets. The creator of D3.js is currently
    employed at The New York Times, which extensively uses D3.js to create charts
    and graphs for online articles. Figure 9-9 is an interactive chart showing technology
    company IPO value and performance over time.'
