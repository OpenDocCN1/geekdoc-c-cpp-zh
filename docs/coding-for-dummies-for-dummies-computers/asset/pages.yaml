  md: "tags in HTML. Python is no different, and we will cover both design principles\
    \ and conventions so you can understand what Python code looks like, understand\
    \ Python’s style, and learn the special keywords and syntax that allow the computer\
    \ to recognize what you are trying to do. Python, like Ruby and JavaScript, can\
    \ be very particular about syntax, and misspelling a keyword or forgetting a necessary\
    \ character will result in the program not running.\n\n# Understanding the Zen\
    \ of Python\n\nThere are nineteen design principles that describe how the Python\
    \ language is organized. Some of the most important principles include\n\n+  \
    \ - **Readability counts:** This is possibly Python’s most important design principle.\
    \ Python code looks almost like English, and even enforces certain formatting,\
    \ such as indenting, to make the code easier to read. Highly readable code means\
    \ that six months from now when you revisit your code to fix a bug or add a feature,\
    \ you will be able to jump in without trying too hard to remember what you did.\
    \ Readable code also means others can use your code or help debug your code with\
    \ ease.\n+   \n+     Reddit.com is a top-10-most-visited website in the US, and\
    \ a top-50-most-visited website in the world. Its co-founder, Steve Huffman, initially\
    \ coded the website in Lisp and switched to Python because Python is “extremely\
    \ readable, and extremely writeable”.\n+   \n+   - **There should be one — and\
    \ preferably only one — obvious way to do it:** This principle is directly opposite\
    \ to Perl’s motto, “There’s more than one way to do it.” In Python, two different\
    \ programmers may approach the same problem and write two different programs,\
    \ but the ideal is that the code will be similar and easy to read, adopt, and\
    \ understand. Although Python does allow multiple ways to do a task — as, for\
    \ example, when combining two strings — if an obvious and common option exists,\
    \ it should be used.\n+   \n+   - **If the implementation is hard to explain,\
    \ it’s a bad idea:** Historically, programmers were known to write esoteric code\
    \ to increase performance. However, Python was designed not to be the fastest\
    \ language, and this principle reminds programmers that easy-to-understand implementations\
    \ are preferable over faster but harder-to-explain code.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_228_0.png)\n\
    \nAccess the full list by design principles, which is in the form of a poem, by\
    \ typing `import this;` into any Python interpreter, or by visiting `https://www.python.org/dev/peps/pep-0020`.\
    \ These principles, written by Tim Peters, a Python community member, were meant\
    \ to describe the intentions of Python’s creator, Van Rossum, who is also referred\
    \ to as the Benevolent Dictator for Life (BDFL).\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_228_1.png)"
