  md: '# 13


    # Getting Familiar with Ruby


    # *In This Chapter*


    +   - Understanding Ruby principles and style

    +   - Assigning variables and using if statements

    +   - Manipulating strings for consistency and formatting


    > > I hope Ruby helps every programmer be productive, enjoy programming,

    > > and be happy. That is the primary purpose of Ruby language.

    > >

    > > —Yukihiro Matsumoto, creator of Ruby


    Ruby is a server-side language created by Yukihiro “Matz” Matsumoto, developer
    who was looking for an easy-to-use scripting language. Matsumoto had experience
    programming in other languages like Perl and Python, and, unsatisfied with both,
    created Ruby. When designing Ruby, Matsumoto’s explicit goal was to “make programmers
    happy”, and he created the language so programmers could easily learn it and use
    it. It worked. Today Ruby, and particularly Ruby working with a Ruby framework
    called Rails, is the most popular way for startups and companies to quickly create
    prototypes and launch websites on the Internet.


    In this chapter, you learn Ruby basics, including its design philosophy; how to
    write Ruby code to perform basic tasks; and steps to create your first Ruby program.


    # What Does Ruby Do?


    Ruby is a general purpose programming language typically used for web development.
    Until now, the HTML, CSS, and JavaScript you have learned in the previous chapters
    has not allowed for storing data after the user has navigated away from the page
    or closed the browser. Ruby makes it easy to'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'store this data, and create, update, store, and retrieve it in a database.
    For example, imagine I wanted to create a social networking website like Twitter.
    The content I write in a tweet is stored in a central database. I can exit my
    browser, and turn off my computer, but if I come back to the website later my
    tweets are still accessible to me. Additionally, if others search for me or keywords
    in the tweets I have written, this same central database is queried, and any matches
    are displayed. Ruby developers frequently perform tasks like storing information
    in a database, and a Ruby framework called Rails speeds up development by including
    pre-built code, templates, and easy ways to perform these tasks. For these reasons,
    websites frequently use Ruby and Rails together.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_213_0.png)


    A website using the Rails framework is referred to as being built with Rails or
    “Ruby on Rails”.


    Twitter’s website was one of the most trafficked websites to use Ruby on Rails,
    and until 2010 used Ruby code for its search and messaging products. Other websites
    currently using Ruby on Rails include:


    +   - E-commerce websites such as those on the www.shopify.com platform, including
    The Chivery and Black Milk Clothing.

    +   - Music websites such as www.soundcloud.com.

    +   - Social networking sites such as www.yammer.com.

    +   - News websites such as www.bloomberg.com.


    As shown above, Ruby and Rails can create a variety of websites. While Rails emphasizes
    productivity, allowing developers to quickly write code and test prototypes, some
    developers criticize Ruby and Rails for not being scalable, and use as evidence
    Twitter rewriting their code to stop using Rails for many core features. While
    I cannot resolve the productivity-scalability debate for you here, I can say that
    Rails can adequately handle millions of visitors per month, and no matter the
    language used, significant work must be done to scale a website to properly handle
    tens or hundreds of millions of visitors a month.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_213_1.png)


    Confirm the programming language used by these or any major website with BuiltWith
    available at www.builtwith.com. After entering the website address in the search
    bar, look under the Frameworks section for Ruby on Rails.


    # Defining Ruby Structure


    Ruby has its own set of design principles that guide how the rest of the language
    is structured. All the languages you have learned so far have their own conventions,
    like the curly braces in JavaScript or opening and closing tags in'
