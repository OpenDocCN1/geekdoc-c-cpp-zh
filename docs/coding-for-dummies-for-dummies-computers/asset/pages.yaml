    \nYou can find background images at sites such as images.google.com, www.flickr.com,\
    \ or publicdomainarchive.com.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_102_1.png)\n\
    \nCheck image copyright information to see if you have permission to use the image,\
    \ and comply with image’s licensing terms, which can include attributing or identifying\
    \ the author. Additionally, directly linking to images on other servers is called\
