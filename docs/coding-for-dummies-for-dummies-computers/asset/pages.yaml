- pgno: 148
  md: '# # Adding in JavaScript


    # ## In This Chapter


    +   - Understanding JavaScript basics and structure

    +   - Coding with variables, conditional statements, and functions

    +   - Learning about API basics and structure

    +   - Viewing an API request and response


    > > The best teacher is very interactive.

    > >

    > > —Bill Gates


    JavaScript, one of the most popular and versatile programming languages on the
    Internet, adds interactivity to websites. You have probably seen JavaScript in
    action and not even realized it, perhaps while clicking buttons that change color,
    viewing image galleries with thumbnail previews, or analyzing charts that display
    customized data based on your input. These website features and more can be created
    and customized using JavaScript.


    JavaScript is an extremely powerful programming language, and this entire book
    could have been devoted to the topic. In this chapter, you learn JavaScript basics,
    including how to write JavaScript code to perform basic tasks, access data using
    an API, and program faster using a framework.


    # ## What Does JavaScript Do?


    JavaScript creates and modifies web page elements, and works with the existing
    web page HTML and CSS to achieve these effects. When you visit a web page with
    JavaScript, your browser downloads the JavaScript code and runs it client-side,
    on your machine. JavaScript can perform tasks to do any of the following:


    +   - Control web page appearance and layout by changing HTML attributes and CSS
    styles.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '+   - Easily create web page elements like date pickers, as shown in Figure
    9-1, and drop-down menus.

    +   - Take user input in forms, and check for errors before submission.

    +   - Display and visualize data using complex charts and graphs.

    +   - Import and analyze data from other websites.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_149_0.png)


    **Figure 9-1:** JavaScript can create the date picker found on every travel website.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_149_1.png)


    JavaScript is different from another programming language called Java. In 1996,
    Brendan Eich, at the time a Netscape engineer, created JavaScript, which was originally
    called LiveScript. As part of a marketing decision, LiveScript was renamed to
    JavaScript to try and benefit from the reputation of then-popular Java.


    JavaScript was created almost 20 years ago, and the language has continued to
    evolve since then. In the last decade, its most important innovation has allowed
    developers to add content to web pages without requiring the user to reload the
    page. This technique, called AJAX (asynchronous JavaScript), probably sounds trivial,
    but has led to the creation of cutting-edge browser experiences such as Gmail
    (shown in Figure 9-2).


    Before AJAX, the browser would display new data on a web page only after waiting
    for the entire web page to reload. However, this slowed down the user experience,
    especially when viewing web pages which had frequent real time updates like web
    pages with news stories, sports updates, and stock'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'information. JavaScript, specifically AJAX, created a way for your browser
    to communicate with a server in the background, and to update your current web
    page with this new information.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_150_0.png)


    **Figure 9-2:** Gmail uses AJAX, which lets users read new emails without reloading
    the web page.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_150_1.png)


    Here is an easy way to think about AJAX: Imagine you are at a coffee shop, and
    just ordered a coffee after waiting in a really long line. Before asynchronous
    JavaScript, you had to wait patiently at the coffee bar until you received your
    coffee before doing anything else. With asynchronous JavaScript, you can read
    the newspaper, find a table, phone a friend, and do multiple other tasks until
    the barista calls your name alerting you that your coffee is ready.


    # Understanding JavaScript Structure


    JavaScript has a different structure and format from HTML and CSS. JavaScript
    allows you to do more than position and style text on a web page—with JavaScript,
    you can store numbers and text for later use, decide what code to run based on
    conditions within your program, and even name pieces of your code so you can easily
    reference them later. As with HTML and CSS, JavaScript has special keywords and
    syntax that allow the computer to recognize what you are trying to do. Unlike
    HTML and CSS, however, JavaScript is intolerant of syntax mistakes. If you forget
    to close an HTML tag,'
  merge: -1
  img_proc: true
- pgno: 151
  md: "or to include a closing curly brace in CSS, your code may still run and your\
    \ browser will try its best to display your code. When coding in JavaScript, on\
    \ the other hand, forgetting a single quote or parenthesis can cause your entire\
    \ program to fail to run at all.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_151_0.png)\n\
    \nHTML applies an effect between opening and closing tags — `<h1>This is a header</h1>`.\
    \ CSS uses the same HTML element and has properties and values between opening\
    \ and closing curly braces — `h1 { color: red; }`.\n\n# ## Using Semicolons, Quotes,\
    \ Parentheses, and Braces\n\nThe code below illustrates the common punctuation\
    \ used in JavaScript — semicolons, quotes, parentheses, and braces (also called\
    \ curly brackets):\n\n```\n```javascript\nvar age=22;\nvar planet=\"Earth\";\n\
    if (age>=18)\n{\n  console.log(\"You are an adult\");\n  console.log(\"You are\
    \ over 18\");\n\n}\nelse\n{\n  console.log(\"You are not an adult\");\n  console.log(\"\
    You are not over 18\");\n}\n```\n```\n\nGeneral rules of thumb to know while programming\
    \ in JavaScript include:\n\n+   - Semicolons separate JavaScript statements.\n\
    +   - Quotes enclose text characters or *strings* (sequences of characters). Any\
    \ opening quote must have a closing quote.\n+   - Parentheses are used to modify\
    \ commands with additional information called *arguments*. Any opening parenthesis\
    \ must have a closing parenthesis.\n+   - Braces group JavaScript statements into\
    \ blocks so they execute together. Any opening brace must have a closing brace.\n\
    \n![](img/5a907eb39993e80f28c82efc2e4632b3_151_1.png)\n\nThese syntax rules can\
    \ feel arbitrary, and may be difficult to remember initially. With some practice,\
    \ however, these rules will feel like second nature to you."
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Coding Common JavaScript Tasks


    JavaScript can be used to perform many tasks, from simple variable assignments
    to complex data visualizations. The following tasks, here explained within a JavaScript
    context, are core programming concepts that haven’t changed in the last twenty
    years and won’t change in the next twenty. They’re applicable to any programming
    language. Finally, I’ve listed instructions on how to perform these tasks, but
    if you prefer you can also practice these skills right away by jumping ahead to
    the “Writing Your First JavaScript Program” section, later in this chapter.


    # Storing data with variables


    Variables, like those in algebra, are keywords used to store data values for later
    use. Though the data stored in a variable may change, the variable name remains
    the same. Think of a variable like a gym locker — what you store in the locker
    changes, but the locker number always stays the same. The variable name usually
    starts with a letter, and Table 9-1 lists some types of data JavaScript variables
    can store.


    For a list of rules on variable names see the “JavaScript Variables” section at
    www.w3schools.com/js/js_variables.asp


    ![](img/5a907eb39993e80f28c82efc2e4632b3_152_0.png)


    **Table 9-1: Data Stored by a Variable**


    | Data Type | Description | Examples |

    |---|---|---|

    | Numbers | Positive or negative numbers with or without decimals | 156–101.96
    |

    | Strings | Printable characters | Holly<br>NovakSenior |

    | Boolean | Value can either be true or false. | truefalse |


    The first time you use a variable name, you use the word var to declare the variable
    name. You can optionally assign a value to variable using the equals sign. In
    the following code example, I declare three variables and assign values to those
    variables:


    ```

    ```javascript

    var myName="Nik";

    var pizzaCost=10;

    var totalCost=pizzaCost * 2;

    ```

    ```'
  merge: -1
  img_proc: true
