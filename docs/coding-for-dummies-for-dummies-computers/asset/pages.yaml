  md: "![](img/5a907eb39993e80f28c82efc2e4632b3_198_0.png)\n\n> > **“After the button\
    \ is pressed, find the customer’s current location”:**  \n> > The HTML syntax\
    \ for your button code is:\n\n```\n```html\n<button onclick=\"getLocation()\"\
    >McDuck's Check-in</button>\n```\n```\n\nThe syntax for calling a JavaScript function\
    \ by pressing a button is available here: w3schools.com/jsref/event_onclick.asp.\n\
    \n> > **“Find the fixed location of a McDuck’s store”:** I picked a McDonald’s\
    \ store in New York City near Madison Square Park whose latitude is 40.7410344\
    \ and longitude is −73.9880763. The latitude and longitude for your restaurant,\
    \ of course, will likely differ.\n\n> > **“Calculate the distance between the\
    \ customer’s current location and the McDuck’s restaurant, and name this distance\
    \ Customer Distance”:** The following is the actual code for the Haversine formula,\
    \ used to calculate the distance between two location coordinates, found on Stackoverflow\
    \ at stackoverflow.com/questions/27928/how-do-i-calculate-distance-between-two-latitude-longitude-points.\
    \ I modified this code slightly so that it returned miles instead of kilometers:\n\
    \n```\n```javascript\nfunction getDistanceFromLatLonInKm(lat1,lon1,lat2,lon2)\
    \ {\n    var R = 6371; // Radius of the earth in km\n    var dLat = deg2rad(lat2-lat1);\
    \ // deg2rad below\n    var dLon = deg2rad(lon2-lon1);\n    var a =\n        Math.sin(dLat/2)\
    \ * Math.sin(dLat/2) +\n        Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2))\
    \ *\n        Math.sin(dLon/2) * Math.sin(dLon/2)\n        ;\n    var c = 2 * Math.atan2(Math.sqrt(a),\
    \ Math.sqrt(1-a));\n    var d = R * c * 0.621371; // Distance in miles\n    return\
    \ d;\n}\n\nfunction deg2rad(deg) {\n    return deg * (Math.PI/180);\n}\n```\n\
    ```\n\nAn explanation of how this formula works is outside the scope of this book,\
    \ but make sure you understand the formula’s inputs (latitude and longitude) and\
    \ the output (distance between two points in miles).\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_198_1.png)\n\
    \n> > **“Convert five to ten minutes of customer travel into a distance called\
    \ Threshold Distance”:** In New York City, people usually walk, so traveling for\
    \ five to ten minutes would take you 0.5 miles, which is my Threshold Distance."
