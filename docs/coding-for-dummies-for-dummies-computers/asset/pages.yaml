  md: "Based on Table 8-1, if you wanted your website to have two equal sized columns\
    \ on tablets, desktops, and large desktops you would use the `col-sm` class name\
    \ as follows:\n\n```\n```html\n<div class=\"container\">\n    <div class=\"row\"\
    >\n        <div class=\"col-sm-6\">Column 1</div>\n        <div class=\"col-sm-6\"\
    >Column 2</div>\n    </div>\n</div>\n```\n```\n\nAfter viewing your code on all\
    \ three devices, you decide that on desktops you prefer unequal instead of equal\
    \ columns such that the left column is half the size of the right column. You\
    \ target desktop devices using the `col-md-` class name and add it to the class\
    \ name immediately after `col-sm-`:\n\n```\n```html\n<div class=\"container\"\
    >\n    <div class=\"row\">\n        <div class=\"col-sm-6 col-md-4\">Column 1</div>\n\
    \        <div class=\"col-sm-6 col-md-8\">Column 2</div>\n    </div>\n</div>\n\
    ```\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_140_0.png)\n\nSome elements,\
    \ such as the `<div>` tag above, can have multiple classes. This allows you to\
    \ add multiple effects, such as changing the way a column is displayed, to the\
    \ element. To define multiple classes, use the class attribute and set it equal\
    \ to each class; separate each class with a space. For an example, refer to the\
    \ preceding code: The third `<div>` element has two classes, `col-sm-6` and `col-md-4`.\n\
    \nFinally, you decide that on large desktop screens you want the left column to\
    \ be two columns wide. You target large desktop screens using the `col-lg-` class\
    \ name, as shown in Figure 8-7, and add to your existing class attribute values:\n\
    \n```\n```html\n<div class=\"container\">\n    <div class=\"row\">\n        <div\
    \ class=\"col-sm-6 col-md-4 col-lg-2\">Column 1</div>\n        <div class=\"col-sm-6\
    \ col-md-8 col-lg-10\">Column 2</div>\n    </div>\n</div>\n```\n```"
