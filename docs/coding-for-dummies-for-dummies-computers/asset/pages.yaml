  md: "The Geolocation API is the product of billions of dollars of research and is\
    \ available to you for free. The most recent browsers support geolocation, though\
    \ some older browsers do not. At a basic level, code is written to ask whether\
    \ the browser supports the Geolocation API, and, if yes, to return the current\
    \ location of the user. When called, the Geolocation API balances a number of\
    \ data inputs to determine the user’s current location. These data inputs include\
    \ GPS, wireless network connection strength, cell tower and signal strength, and\
    \ IP address.\n\nWith this in mind, let’s look at the JavaScript code. The JavaScript\
    \ code includes two functions, as follows:\n\n+   - *The `getLocation()` function:*\
    \ This function determines whether the browser supports geolocation. It does this\
    \ by using an `if` statement and `navigator.geolocation`, which is recognized\
    \ by the browser as part of the Geolocation API and which returns a true value\
    \ if geolocation is supported.\n\nHere is the `getLocation()` function:\n\n```\n\
    function getLocation() {\n    if (navigator.geolocation){\n        navigator.geolocation.getCurrentPosition(showLocation);\n\
    \    }\n}\n```\n\n+   - *The `showLocation()` function:* When the browser supports\
    \ geolocation, the next step is to call the `showLocation` function, which calculates\
    \ and displays the user’s location.\n\nAnd here is the `showLocation()` function:\n\
    \n```\nfunction showLocation(position){\n// 2. Hardcode your store location on\
    \ line 12 and 13, and update\n//    comment to reflect your McDuck’s restaurant\
    \ address\n// Nick's at Perry & W 4th St (change to your restaurant location)\n\
    \nvar mcduckslat=40.735383;\nvar mcduckslon=-74.002994;\n\n// current location\n\
    var currentpositionlat=position.coords.latitude;\nvar currentpositionlon=position.coords.longitude;\n\
    \n// calculate the distance between your current location and McDuck's location\n\
    var distance=getDistanceFromLatLonInMiles(mcduckslat, mcduckslon,currentpositionlat,currentpositionlon);\n\
    \n// Displays the location using .innerHTML property and the lat & long\n//  \
    \               coordinates for your current location\n```"
