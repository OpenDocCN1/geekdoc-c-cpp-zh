- pgno: 124
  md: 'Vertical navigation aids reader understanding when hierarchy or relationship
    exists between navigational topics. In the w3schools.com example, HTML, JavaScript,
    Server Side, and XML relate to one another, and underneath each topic heading
    are related sub-topics.


    Horizontal or menu navigation, as shown in Figure 7-11, helps reader navigation
    with weak or disparate relationships between navigational topics. In the eBay
    example, the Motors, Fashion, and Electronics menu items have different products
    and appeal to different audiences.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_124_0.png)


    **Figure 7-11:** Use of top and bottom navigation toolbar on ebay.com (left) and
    moma.org (right).


    ![](img/5a907eb39993e80f28c82efc2e4632b3_124_1.png)


    Don’t spend too much time worrying about what layout to pick. You can always pick
    one, observe whether your visitors can navigate your website quickly and easily,
    and change the layout if necessary.


    # Shaping the div


    The page layouts above are collections of elements grouped together. These elements
    are grouped together using rectangular containers created with an opening and
    closing `<div>` tag, and all of the layouts above can be created with these `<div>`
    tags. By itself, the `<div>` tag does not render anything on the screen, but instead
    serves as a container for content of any type like HTML headings, lists, tables,
    or images. To see the `<div>` tag in action, take a look at the Codeacademy.com
    home page in Figure 7-12.


    Notice how the web page can be divided into three parts—the navigation header,
    the middle video testimonial, and then additional text user testimonials. `<div>`
    tags are used to outline these major content areas, and additional nested `<div>`
    tags within each part are used to group content like images and text.'
