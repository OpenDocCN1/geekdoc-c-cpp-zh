  md: "The HTML tree is called the *DOM* or *document object model*.\n\n# ### Child\
    \ selector\n\nThe Parody Non-Tech Twitter account anchor tags are immediate children\
    \ of the paragraph tags. If you wanted to style just the Parody Non-Tech Twitter\
    \ accounts, you can use the *child selector*, which selects the immediate children\
    \ of a specified element. A child selector is created by first listing the parent\
    \ selector, then a greater-than sign (>), and finally the child selector.\n\n\
    In the following example, the anchor tags that are immediate children of the paragraph\
    \ tags are selected, and those hyperlinks are styled with a red font color and\
    \ without any underline. The Parody Tech Twitter accounts are not styled because\
    \ they are direct children of the list item tag. (See Figure 7-7.)\n\n```\n~~~css\n\
    p > a {\n  color: red;\n  text-decoration: none;\n}\n~~~\n```\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_119_0.png)\n\
    \n**Figure 7-7:** Child selector used to style the Parody Non-Tech Twitter accounts.\n\
    \nIf you use just the *a* selector here, all the links on the page would be styled\
    \ instead of just a selection.\n\n# ### Descendant selector\n\nThe Parody Tech\
    \ Twitter account anchor tags are descendants, or located within, the unordered\
    \ list. If you wanted to style just the Parody Tech Twitter accounts, you can\
    \ use the *descendant selector*, which selects not just immediate children of\
    \ a specified element but all elements nested within the"
  merge: -1
  img_proc: true
- pgno: 120
  md: "specified element. A descendant selector is created by first listing the parent\
    \ selector, a space, and finally the descendant selector you want to target.\n\
    \nIn the following example, as shown in Figure 7-8, the anchor tags which are\
    \ descendants of the unordered list are selected, and those hyperlinks are styled\
    \ with a blue font color and are crossed out. The Parody Non-Tech Twitter accounts\
