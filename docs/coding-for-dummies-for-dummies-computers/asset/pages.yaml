- pgno: 110
  md: '# 7


    # Next Steps with CSS


    # In This Chapter


    +   - Formatting lists and tables

    +   - Styling web pages using parent and child selectors

    +   - Naming pieces of code using `id` and `class`

    +   - Using the box model to position HTML elements on the page


    > > *Design is not just what it looks like and feels like. Design is how it works.*

    > >

    > > —Steve Jobs


    In this chapter, you continue building on the CSS you learned in the previous
    chapter. So far, the CSS rules you’ve seen applied to the entire web page, but
    now they get more specific. You learn how to style several more HTML elements,
    including lists, tables, and forms, and how to select and style specific parts
    of a web page, such as the first paragraph in a story or the last row of a table.
    Finally, you learn how professional web developers use CSS and the box model to
    control down to the pixel the positioning of elements on the page. Understanding
    the box model is not necessary to build our app in Chapter 10.


    Before diving in, remember the big picture: HTML puts content on the web page,
    and CSS further styles and positions that content. Instead of trying to memorize
    every rule, use this chapter to understand CSS basics. CSS selectors have properties
    and values that modify HTML elements. There is no better way to learn than by
    doing, so feel free to skip ahead to the Codecademy practice lessons at the end
    of the chapter. Then, use this chapter as a reference when you have questions
    about specific elements you are trying to style.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Styling (More) Elements on Your Page


    In this section, you discover common ways to style lists and tables. In the previous
    chapter, the CSS properties and values you learned like color and font-family
    can apply to any HTML element containing text. By contrast, some of the CSS shown
    here is used only to style lists, tables, and forms.


    # Styling lists


    In Chapter 5 you learned how to create ordered lists, which start with markers
    like letters or numbers, and unordered lists, which start with markers like bullet
    points. By default, list items in an ordered list use numbers (for example, 1,
    2, 3), whereas list items in unordered lists use a solid-black-circle (●).


    These defaults may not be appropriate for all circumstances. In fact, the two
    most common tasks when styling a list include:


    +   - **Changing the marker used to create a list:** For unordered lists, like
    this one, you can use a solid disc, empty circle, or square bullet point. For
    ordered lists, you can use numbers, roman numerals (upper or lower case), or case
    letters (upper or lower).

    +   - **Specifying an image to use as the bullet point:** You can create your
    own marker for ordered and unordered lists instead of using the default option.
    For example, if you created an unordered bulleted list for a burger restaurant,
    instead of using a solid circle as a bullet point you could use a color hamburger
    icon image.


    You can accomplish either of these tasks by using the properties in Table 7-1
    with an ol or ul selector to modify the list type.


    CSS selectors using properties and rules modify HTML elements by the same name.
    For example, Figure 7-1 has the HTML <ul> tags that are referred to in CSS with
    the ul selector, and styled using the properties and rules in Table 7-1.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_111_0.png)


    | Table 7-1 | Common CSS Properties and Values for Styling Lists | |

    |---|---|---|

    | **Property Name** | **Possible Values** | **Description** |

    | list-style-type (unordered list) | disc<br>circle<br>square<br>none | Sets the
    markers used to create list items in an unordered list to disc (●), circle (○),
    square (■), or none. |'
  merge: -1
  img_proc: true
