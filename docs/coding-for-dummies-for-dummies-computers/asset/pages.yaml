- pgno: 138
  md: 'Bootstrap editors you can use include the following:


    +   - **LayoutIt.com:** Free online Bootstrap editor (as shown in Figure 8-5)
    that allows you to drag and drop components and then download the source code.

    +   - **Jetstrap.com:** Paid online drag and drop Bootstrap editor.

    +   - **Pingendo.com:** Free downloadable drag and drop Bootstrap editor.

    +   - **Bootply.com:** Free online Bootstrap editor with built-in templates to
    modify.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_138_0.png)


    These sites are free, and may stop working without notice. You can find additional
    options by using any search engine to search for Bootstrap editors.


    ![](img/5a907eb39993e80f28c82efc2e4632b3_138_1.png)


    **Figure 8-5:** Layoutit.com interface with drag and drop Bootstrap components.


    # Using predefined templates


    Sites exist that provide ready-to-use Bootstrap themes; all you need to do is
    add your own content. Of course, you can also modify the theme if you wish. Some
    of these Bootstrap themes are:


    +   - **Blacktie.co:** Free Bootstrap themes (shown in Figure 8-6), all created
    by one designer.

    +   - **Bootstrapzero.com:** Collection of free, open-source Bootstrap templates.

    +   - **Bootswatch.com and bootsnipp.com:** Includes pre-built Bootstrap components
    that you can assemble for your own site.

    +   - **Wrapbootstrap.com:** Bootstrap templates available for purchase.'
