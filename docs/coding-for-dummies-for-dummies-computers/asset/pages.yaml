    Python is a server-side language created by Guido van Rossum, a developer who
    was bored during the winter of 1989 and looking for a project to do. At the time,
    Van Rossum had already helped create one language, called ABC, and the experience
    had given him many ideas that he thought would appeal to programmers. He executed
    upon these ideas when he created Python. Although ABC never achieved popularity
    with programmers, Python was a runaway success. Python is one of the world''s
    most popular programming languages, used by beginners just starting out and professionals
    building heavy-duty applications.


    In this chapter, you learn Python basics, including the design philosophy behind
    Python, how to write Python code to perform basic tasks, and steps to create your
    first Python program.


