- pgno: 154
  md: "| Table 9-2 | Common JavaScript Operators |  |  |\n|---|---|---|---|\n| **Type**\
    \ | **Operator** | **Description** | **Example** |\n| Less than | `<` | Evaluates\
    \ whether one value is less than another value | `(x < 55)` |\n| Greater than\
    \ | `>` | Evaluates whether one value is greater than another value | `(x > 55)`\
    \ |\n| Equality | `===` | Evaluates whether the two values are equal | `(x ===\
    \ 55)` |\n| Less than or equal to | `<=` | Evaluates whether one value is less\
    \ than or equal to another value | `(x <= 55)` |\n| Greater than or equal to |\
    \ `>=` | Evaluates whether one value is greater than or equal to another value\
    \ | `(x >= 55)` |\n| Inequality | `!=` | Evaluates whether two values are not\
    \ equal | `(x != 55)` |\n\nHere is a simple if statement, without the else:\n\n\
    ```\nvar carSpeed=70;\nif (carSpeed > 55) {\n    alert(\"You are over the speed\
    \ limit!\");\n}\n```\n\nIn this statement I declare a variable called carSpeed\
    \ and set it equal to 70. Then an if statement with a condition compares whether\
    \ the value in the variable carSpeed is greater than 55. If the condition is true,\
    \ an alert, which is a pop-up box, states “You are over the speed limit!” (See\
    \ Figure 9-3.) In this case, the value of carSpeed is 70, which is greater than\
    \ 55, so the condition is true and the alert is displayed. If the first line of\
    \ code is instead var carSpeed=40; then the condition is false because 40 is less\
    \ than 55, and no alert would be displayed.\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_154_0.png)\n\
    \n**Figure 9-3:** The alert pop-up box."
  merge: -1
  img_proc: true
- pgno: 155
  md: "Let us expand the `if` statement by adding `else` to create an `if-else`, as\
    \ shown in this code:\n\n```\nvar carSpeed=40;\nif (carSpeed > 55) {\n    alert\
    \ (\"You are over the speed limit!\");\n}\nelse {\n    alert (\"You are under\
    \ the speed limit!\");\n}\n```\n\nIn addition to the `else`, I added an `alert`\
    \ statement inside the curly brackets following the `else`, and set `carSpeed`\
    \ equal to 40. When this `if-else` statement executes, `carSpeed` is equal to\
    \ 40, which is less than 55, so the condition is false, and because the `else`\
    \ has been added, an alert appears stating “You are under the speed limit!” If\
    \ the first line of code instead was `var carSpeed=70;`, as before, then the condition\
    \ is true, because 70 is greater than 55, and the first alert would be displayed.\n\
    \nOur current `if-else` statement allows us to test for one condition, and to\
    \ show different results depending on whether the condition is true or false.\
    \ To test for two or more conditions, you can add one or more `else if` statements\
    \ after the original `if` statement. The general syntax for this is as follows:\n\
    \n```\nif (condition1) {\n    statement1 to execute if condition1 is true\n}\n\
    else if (condition2) {\n    statement2 to execute if condition2 is true\n}\nelse\
    \ {\n    statement3 to execute if all previous conditions are false\n}\n```\n\n\
    The `if-else` is written as before, and the `else if` is followed by a space,\
    \ and then a condition enclosed in parentheses that evaluates to either true or\
    \ false. If `condition1` is true, then `statement1`, located between the first\
    \ set of curly brackets, is executed. If the `condition1` is false, then `condition2`\
    \ is evaluated and is found to be either true or false. If `condition2` is true,\
    \ then `statement2`, located between the second set of curly brackets, is executed.\
    \ At this point, additional `else if` statements could be added to test additional\
    \ conditions. Only when all `if` and `else if` conditions are false, and an `else`\
    \ is included, is `statement3` executed. Only one statement is executed in a block\
    \ of code, after which the remaining statements are ignored and the next block\
    \ of code is executed."
  merge: -1
  img_proc: true
- pgno: 156
  md: "![](img/5a907eb39993e80f28c82efc2e4632b3_156_0.png)\n\nWhen writing the `if-else`,\
    \ you must have one and only one `if` statement, and, if you choose, one and only\
    \ one `else` statement. The `else if` is optional, can be used multiple times\
    \ within a single `if-else` statement, and must come after the original `if` statement\
    \ and before the `else`. You cannot have an `else if` or an `else` by itself,\
    \ without a preceding `if` statement.\n\nHere is another example `else if` statement:\n\
    \n```\n```javascript\nvar carSpeed=40;\nif (carSpeed > 55) {\n    alert(\"You\
    \ are over the speed limit!\");\n}\nelse if (carSpeed === 55) {\n    alert(\"\
    You are at the speed limit!\");\n}\n```\n```\n\nWhen this `if` statement executes,\
    \ carSpeed is equal to 40, which is less than 55, so the condition is true, and\
    \ then the `else if` condition is evaluated. The value of carSpeed is not exactly\
    \ equal to 55 so this condition is also false, and no alert of any kind is shown,\
    \ and the statement ends. If the first line of code were instead `var carSpeed=55;`\
    \ then the first condition is false, because 55 is not greater than 55. Then the\
    \ `else if` condition is evaluated, and because 55 is exactly equal to 55, the\
    \ second alert is displayed, stating “You are at the speed limit!”\n\n![](img/5a907eb39993e80f28c82efc2e4632b3_156_1.png)\n\
    \nLook carefully at the code above — when setting the value of a variable, one\
    \ equals sign is used, but when comparing whether two values are equal, then three\
    \ equals signs (`===`) are used.\n\nAs a final example, here is an `if-else` statement\
    \ with an `else if` statement:\n\n```\n```javascript\nvar carSpeed=40;\nif (carSpeed\
    \ > 55) {\n    alert(\"You are over the speed limit!\");\n}\nelse if (carSpeed\
    \ === 55) {\n    alert(\"You are at the speed limit!\");\n}\nelse {\n    alert(\"\
    You are under the speed limit!\");\n}\n```\n```\n\nAs the diagram in Figure 9-4\
    \ shows, two conditions, which appear in the figure as diamonds, are evaluated\
    \ in sequence. In this example, the carSpeed is equal to 40, so the two conditions\
    \ are false, and the statement after the `else` is executed, showing an alert\
    \ that says “You are under the speed limit!” Here carSpeed is initially set to\
    \ 40, but depending on the initial carSpeed variable value, any one of the three\
    \ alerts could be displayed."
