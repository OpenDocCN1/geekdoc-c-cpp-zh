  md: "# C++ Maths\n\nSTEP 5 The interesting math content comes when you can call\
    \ upon the C++ Math Library. Within this header are dozens of mathematical functions\
    \ with further operations. From computing cosine to tangent without further parameters,\
    \ to the value of Pi. You can call the header with:\n\nSTEP 8 Calculating powers\
    \ of numbers can be done with:\n\n```\n#include <iostream>\n#include <cmath>\n\
    using namespace std;\nint main() {\n\n}\n```\n\n```\n#include <iostream>\n#include\
    \ <cmath>\nusing namespace std;\nint main() {\n    float number = 12;\n    cout\
    \ << \"to the power of 2 is \" << pow(number, 2) << \"\\n\";\n    cout << \"to\
    \ the power of 3 is \" << pow(number, 3) << \"\\n\";\n    cout << \"to the power\
    \ of 0.8 is \" << pow(number, 0.8) << \"\\n\";\n}\n```\n\n```\nStartfile Maths.cpp\n\
    Files =\n1 #include <iostream>\n2 using namespace std;\n3\n4 int main() {\n5\n\
    6\n7\n8\n9\n10\n```\n\n```\n#include <iostream>\nusing namespace std;\nint main()\
    \ {\n    float number = 12;\n    cout << \"to the power of 2 is \" << pow(number,\
    \ 2) << \"\\n\";\n    cout << \"to the power of 3 is \" << pow(number, 3) << \"\
    \\n\";\n    cout << \"to the power of 0.8 is \" << pow(number, 0.8) << \"\\n\"\
    ;\n}\n```\n\nSTEP 6 Start by getting the square root of a number:\n\nSTEP 9 Here\
    \ we created a float called number with the value of 12, and power calculation\
    \ happens. Of course, you can calculate powers and square roots without variables.\
    \ For example, use (12) as the first value in the code below:\n\n```\n#include\
    \ <iostream>\n#include <cmath>\nusing namespace std;\nint main() {\n    float\
    \ number = 134;\n    cout << \"the square root of \" << number << \" is: \" <<\
    \ sqrt(number) << \"\\n\";n}\n```\n\n```\nStartfile Maths.cpp\nFiles =\n1 #include\
    \ <iostream>\n2 using namespace std;\n3\n4 int main() {\n5\n6 float number = 134;\n\
    7\n8 cout << \"the square root of \" << number << \" is: \" << sqrt(number) <<\
    \ \"\\n\";\n9\n10\n```\n\nSTEP 7 We here created a new float called number and\
    \ used the sqrt() function to display the square root of 13, the value of number.\
    \ Build and run the code, and you will get 11.5758.\n\nThe value of PI is stored\
    \ in the cmath header. It can be called with the M_PI function; and you get 3.14159\
    \ or use it to calculate:\n\n```\n#include <iostream>\n#include <cmath>\nusing\
    \ namespace std;\nint main() {\n    double area, radius = 1.5;\n    area = M_PI\
    \ * radius * radius;\n    cout << \"area is \" << area << \"\\n\";\n}\n```\n\n\
