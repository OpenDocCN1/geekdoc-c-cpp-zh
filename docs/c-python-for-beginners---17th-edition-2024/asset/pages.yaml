    \ int length, which stores the result of string.size() and outputs it to the screen:\n\
    \n```\n#include <iostream>\nusing namespace std;\nint main() {\n    int length;\n\
    \    string greet1 = \"Hello\";\n    string greet2 = \" world!\";\n    string\
    \ greet3 = greet1 + greet2;\n    length = greet3.size();\n    cout << \"The length\
    \ of the combined strings is: \" << length << \"\\n\";\n}\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_72_0.png)\n\
    \n# STEP 6\n\nYou can see that string::get() to output the length, number of characters\
    \ there are, of the contents of the string. Naturally, if you call your string\
    \ other than greet, you will need to change the method to reflect this. It is\
    \ always stringname. Build and run the code to see the result:\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_72_1.png)\n\
    \n# STEP 9\n\nUsing the available operations that come with the string. function,\
    \ you can remove characters from a string you could use:\n\n```\n#include <iostream>\n\
    using namespace std;\nint main() {\n\n    string str = \"Here is a long sentence\
    \ in a string.\";\n    cout << str << \"\\n\";\n    str.erase(10,5);\n    cout\
    \ << str << \"\\n\";\n    str.erase(str.begin(0)+9, str.end()-9);\n    cout <<\
    \ str << \"\\n\";\n}\n```\n\n# STEP 7\n\nYou can add de strings together, or combine\
    \ them to form strings:\n\n```\n#include <iostream>\nusing namespace std;\nint\
    \ main() {\n\n    string greet1 = \"Hello\";\n    string greet2 = \" world!\"\
    ;\n    string greet3 = greet1 + greet2;\n\n    cout << greet3 << \"\\n\"\n}\n\
    ```\n\n# STEP 10\n\nIt's worth spending some time playing with numbers, which\
