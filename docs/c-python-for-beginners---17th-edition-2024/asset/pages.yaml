  md: '# VISUAL STUDIO


    Microsoft''s Visual Studio is a mammoth C++ IDE that allows you to create applications
    for Windows, Android, iOS and the web. The Community version is free to download
    and install but the other versions offer a free trial period. Go to visualstudio.com
    to see what it can do.


    # ANJUTA


    The AnjutaDevStudio is a Linux-only IDE that features some of the advanced features
    you would normally find in a paid software development studio. There''s a GUI
    designer, source editor, app wizard, interactive debugger and much more. Go to
    www.anjuta.org/ for more information.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_56_0.png)


    # QT CREATOR


    This cross-platform IDE is designed to create C++ applications for desktop and
    mobile environments. It comes with a code editor and integrated tools for testing
    and debugging, as well as support for many chosen platforms. It is free but there
    is a trial period on offer requiring much: qt.io/qt-libraries-apis-tools-and-ide.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_56_1.png)


    # MONODEVEL


    This excellent# IDE allows you to write desktop and web applications across all
    the major platforms. It''s an advanced editor, integrated debugger and configuration
    workbench to help you create your code. It''s available for Windows, Mac and Linux
    and is free to download: www.monodevelop.com/


    ![](img/bb949c7c28c27d6124a761521ffcfb43_56_2.png)


    # DEV C++


    Bloodshed Dev C++, despite its colourful name, is an IDE for Windows systems only.
    However, many users praise its clean interface and unique way of coding and compilation.
    Although has not been much updating for time, it''s certainly one if you want
    something different: bloodshed.net/devcpp.


    # U++


    Ultimate++ is a cross-platform C++ IDE that boosts a rapid development of code
    with the smart and elegant features. For the novice, it''s a bit of an IDE but
    behind its complexity is a beauty that would make a developer''s knees wobbly.
    Find out more at www.ultimatepp/index.html.


