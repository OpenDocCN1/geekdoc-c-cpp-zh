  md: '# # How to Set Up Python in Windows


    Windows users can easily install the latest version of Python via the main Python
    Downloads. Whilst most seasoned Python developers may shun Windows as the platform
    of choice for their code, it''s an ideal starting point for beginners.


    # ## INSTALLING PYTHON 3.X


    Microsoft Windows doesn''t come with Python preinstalled as standard, so you''re
    going to install it manually. Frankly, it''s an easy process to follow:


    +   **STEP 1** Start by opening your web browser to www.python.org/downloads/;
    Look for the button download link for Python 3.x (in this case it 3.6.2 but as
    you may see later versions of 3).


    +   **STEP 3** Choosing the Custom option allows you to specify certain parameters,
    and whilst you may stay with the defaults, a good habit to avoid (sometimes with
    Python, thankfully) installers can include unwanted features. On the next page,
    ensure, all boxes are checked and click the Next.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_13_0.png)


    Wondering which version to use? Here''s more about the difference between Python
    2 and 3.

    Looking for Python with a different OS? Python for Windows, Linux, Unix, Mac OS,
    Other\Want to help develop versions of Python? Pre-releases


    ![](img/bb949c7c28c27d6124a761521ffcfb43_13_1.png)


    +   **STEP 2** Click the download button for version 3.x, and save the file to
    your Downloads Folder. When the file is downloaded, double-click to execute and
    the Python installer will launch. From here you have two choices: Install Now
    or Custom. We recommend using the Custom installation link,


    +   **STEP 4** The next page includes some interesting additions to Python. Ensure
    the Associate file with Python, Create Shortcuts, Add Python to Environment Variables,
    Precompiled Standard Library and for All Users options if you''re ready. These
    make using Python much later easier. Click Install when you''re ready.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_13_2.png)


    ![](img/bb949c7c28c27d6124a761521ffcfb43_13_3.png)


