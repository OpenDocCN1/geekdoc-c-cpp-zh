  md: '# HIGH-LEVEL LANGUAGES


    Computer languages that are easy to read are known as "high-level". This is because
    they fly high above the hardware (also referred to as "the metal"). Languages
    that "fly to the metal," like Assembly, are known as "low-level". Low-level languages
    commands read with msg de - len equ $ - mid -


    ![](img/bb949c7c28c27d6124a761521ffcfb43_12_0.png)


    # ZEN OF PYTHON


    ![](img/bb949c7c28c27d6124a761521ffcfb43_12_1.png)


    # PYTHON 3 VS PYTHON 2


    In a typical computing scenario, Python is complicated by the existence of two
    versions of the language: Python 2 and Python 3.


    # WORLD OF PYTHON


    When you visit the Python Download page you''ll notice there are two options:
    one for Python 3.6.2 and the other for Python 2.7; correct at the time of writing
    (remember Python 2 is frequently updated so you may see different version numbers).


    # Download the latest version for Windows


    +   - Download Python 3.7.3 Download Python 2.7.18


    Wondering which one to use? Here means the difference between Python 2 and 3.

    Looking for a different OS? Python for Windows, Linux, macOS or other.

    Want to help test new versions of Python? Pre releases


    # PYTHON 3.X


    In 2008 Python arrived with several new and enhanced features. These features
    provide a stable, efficient and powerful programming environment (most if not
    all of these features are not popular). Not at first, Python 3 has become the
    leading edge of Python programming.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_12_2.png)


    ```

    python 3.6.1 [v3.6.1:06a6b1af4, Clang Dec 17 2017, 17:54:57) (MSC v1900 32 bit
    (Intel))

    Intel x86 on linux

    >>> print(''credit'' or ''license'') for more information.

    >>> The Zen of Python, by Tim Peters

    >>> Beautiful

    ```


    # 3.X WINS


    Python 3''s popularity has matured that it''s now prudent to start development
    with the new features and begin to phase out previous version. Many development
    companies, such as SpaceX and NASA use Python 3 for snippets of important code.


    # PYTHON 2.X


    So why two? Python 2 was launched in 2000 and has since adopted a large collection
    of modules, scripts, tutorials and so on. Over the years, Python 2 has become
    the first one of so good programming languages for Beginners and experts to code
    in, which makes it an extremely valuable resource.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_12_3.png)


    ```

    python 3.7.13 [v3.7.13:a654b1af,, Oct 16 2018, 20:41:59) (MSC v1900 32 bit (Intel)

    Intel x86 on linux

    >>> print(''copyright'', ''credit'' or ''license'') for more information.)

    ```'
