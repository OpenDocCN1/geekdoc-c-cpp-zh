  md: "# C++ Fundamentals\n\n# C++ Maths\n\nProgramming is mathematical in nature\
    \ and as you might expect, there is plenty of built-in scope for some quite intense\
    \ maths. C++ has a lot to offer someone who's implementing mathematical models\
    \ into their code. It can be extremely complex or relatively simple.\n\n# C++\
    \ = MC²\n\nThe basic mathematical symbols apply in C++ as they do in most other\
    \ programming languages. However, by using the C++ Library, you can also calculate\
    \ square roots, powers, trig and more.\n\n+   STEP 1 C++ mathematical operations\
    \ follow the same patterns as taught in school, in that multiplication and division\
    \ take precedence over addition and subtraction. You can alter that however. For\
    \ now, create a new file and enter:\n\n```\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    float numbers = 100;\n    numbers = numbers + 10;\
    \ // This adds 10 to the initial 100\n    cout << \"\\n\";\n    numbers = numbers\
    \ - 10; // This subtracts 10 from the new 110\n    cout << \"\\n\"\n}\n```\n\n\
    +   STEP 3 Multiplication and division can be applied as such:\n\n```\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n    float numbers = 100;\n\
    \    numbers = numbers * 10; // This multiplies 100 by 10\n    cout << \"\\n\"\
    ;\n    numbers = numbers / 10; // This divides 1000 by 10\n    cout << \"\\n\"\
    \n}\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_73_0.png)\n\nSTEP 2 While\
    \ simple, does the code really warmed up? While we used a float for variables,\
    \ you can also use an integer, if you suddenly started to delete, you would need\
    \ to change it to a float or decimal, depending on the accuracy. Run the code\
    \ and see the results.\n\n```\n#include <iostream>\nusing namespace std;\n\nint\
    \ main() {\n    float numbers = 100;\n    numbers = numbers + 10; // This adds\
    \ 10 to the initial 100\n    cout << \"\\n\";\n    numbers = numbers - 10; //\
    \ This subtracts 10 from the new 110\n    cout << \"\\n\"\n}\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_73_1.png)\n\
    \nSTEP 4 Again, execute the simple code and see the results. While not particularly\
    \ interesting, it's a start into C++ maths. We used a float, but here you can\
    \ play around with the code as well as divide, add and subtract.\n\n```\nProcess\
    \ returned (00) execution time : 0.043 s\nPress any key to continue.\n```\n\n\
    ```\nProcess returned (00) execution time : 0.050 s\nPress any key to continue.\n\
