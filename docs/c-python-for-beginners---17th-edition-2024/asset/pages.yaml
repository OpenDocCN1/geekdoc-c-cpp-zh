  md: "# How to Set Up C++ in Linux\n\nLinux is a great C++ coding environment. Most\
    \ Linux distros already have the essential components preinstalled, such as a\
    \ compiler and the text editors are excellent for entering code into, including\
    \ colour coding; and there's tons of extra software to help you get out.\n\n#\
    \ LINUX++\n\nIf you're not familiar with Linux, we recommend taking a look at\
    \ one of our Linux titles from the BDM Publications range. If you have the Raspberry\
    \ Pi, the commands below work just fine and for this example we're using Linux\
    \ Mint.\n\n+   STEP 1 The first step is to ensure Linux is ready for your C++\
    \ code, check the system and software are up to date. Open a terminal and: sudo\
    \ apt-get update && sudo apt upgrade. Press Return and enter your password. These\
    \ commands update the entire system and any installed software.\n\n+   STEP 3\
    \ Amazingly, that's it. Everything is already ready for you to start coding. Here's\
    \ how to get your first C++ program up and running. In Linux the main text editor\
    \ is Xed, which you launch by clicking on the Menu and typing Xed into the search\
    \ bar. Click on the Text Editor in the right-hand panel to open it.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_53_0.png)\n\
    \n+   STEP 2 Most Linux distros come preinstalled with all C++; the necessary\
    \ components to start coding; however, it's worth checking to see if everything\
    \ is present. Still within the terminal: sudo apt-install build-essential and\
    \ press Return. If you have the right components nothing is installed; if you're\
    \ missing them they are installed by the command.\n\n+   STEP 4 In Xed, or any\
    \ other text editor you may use, to enter the lines of code that make your C++\
    \ Hello World program. It's a little different from what the Mac produced:\n\n\
    ```\n#include <iostream>\n\nint main()\n{\n    // My first C++ program\n    std::cout\
    \ << \"Hello World!\\n\";\n}\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_53_1.png)"
