  md: '# Say Hello to Python


    # Getting to Know Python


    Python is the greatest computer programming language ever created. It enables
    you to fully harness the power of a computer, in a language that is clean and
    easy to understand.


    # WHAT IS PROGRAMMING?


    It helps to understand what a programming language is before you try to learn
    one, and Let''s take a look at how Python can help and how it relates to other
    languages.


    # PROGRAMMING RECIPES


    Recipes are like programs for computers.


    Put 100 grams of self-raising flour in a bowl. Add 100 grams of butter to the
    bowl. Bake for half an hour.


    # CODE


    Just like a recipe, a program consists of instructions that you follow in order.
    A program that describes a cake might run like this:


    ```

    bowl = []

    flour = 100

    butter = 50

    milk = 100

    bowl.append([flour,butter,milk])

    cake(bowl)

    ```


    A programming language is a list of instructions that a computer follows. These
    instructions can be as simple as a recipe or playing a music file, or as complex
    as building a whole world. Python is a language conceived in the 1980s by Guido
    van Rossum at Centrum University & Research in the Netherlands as a successor
    to the ABC language.


    Guido van Rossum, the father of Python.


    # PROGRAM COMMANDS


    You might not understand some of the Python commands, like bowl.append and cake(bowl).
    The first is list, the second; we''ll look at both in this book. The main thing
    to know is it''s easy to read commands in Python. Once you learn the commands,
    you can figure out how a program works.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_11_0.png)'
