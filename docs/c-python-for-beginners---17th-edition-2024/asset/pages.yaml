  md: "# # Creating Functions\n\nNow that you have mastered the use of variables and\
    \ input, the next step is to tackle functions. You've already used a few functions,\
    \ such as the print command but Python enables you to define your own functions.\n\
    \n# ## FUNKY FUNCTIONS\n\nA function is a command that you enter into Python to\
    \ do something. It's a little piece of self-contained code that takes data, works\
    \ on it and returns the result.\n\n+   * STEP 1 Its not just data that a function\
    \ works on. They can do all manner of using things in Python, such as sort data,\
    \ change items from one format to another and check the length or type of items.\
    \ Basically, a function is a short word that follows by brackets. len(), list())\
    \ or type().\n\n```\nPython 3.4.2 Shell Edit Config Options window help\n>>> Python\
    \ 3.4.2 (default, Oct 19 2014, 12:31:11)\n>>> (4.4.9) on linux\n>>> print('copyright',\
    \ 'credits' or 'license') for more information.\n>>> \n```\n\n+   * STEP 2 A function\
    \ takes data, usually a variable, works on it depending on how the function is\
    \ programmed to do and return the end. The value worked on inside the brackets,\
    \ so if you wanted to know how many letters are in the word antidisestablishmentarianism,\
    \ then you'd need: len('antidisestablishmentarianism') and the number 28 would.\n\
    \n```\nPython 3.4.2 Shell Edit Config Options window help\n>>> Python 3.4.2 (default,\
    \ Oct 19 2014, 12:31:11)\n>>> type('copyright', 'credits' or 'license') for more\
    \ information.\n>>> len('antidisestablishmentarianism')\n28\n>>> \n```\n\n+  \
    \ * STEP 3 You can pass variables through functions in much the same manner. Let's\
    \ assume you want the number of letters in a person's surname, you could use the\
    \ following code (the text editor for this example):\n\n```\nname_input = input(\"\
    Enter your surname: \")\nprint(\"Your surname has\", len(name_input), \"letters\
    \ in.\")\n```\n\nPress F5 and save the code to execute it.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_37_0.png)\n\
    \n+   * STEP 4 Python has tens of functions built into it, far too to get into\
    \ the limited space available. However, to view the list of built-in functions\
    \ available to Python 3, navigate to docs.python.org/3/library/functions.html.\
    \ These are the predefined functions, but users have created many more, they're\
    \ not the ones available\n\n```\nPython 3.4.2 Shell Edit Config Options window\
    \ help\n>>> Python 3.4.2 (default, Oct 19 2014, 12:31:11)\n>>> type('copyright',\
    \ 'credits' or 'license') for more information.\n>>> input(\"Enter your surname:\
    \ \")\nHayward\n>>> print(\"Your surname has\", len('Hayward'), \"letters in it.\"\
