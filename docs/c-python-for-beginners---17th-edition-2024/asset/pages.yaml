  md: "# Structure of a C++ Program\n\n# COMMENTS\n\nLines begin with a double slash\
    \ are comments. This means they won't be executed in the code and are ignored\
    \ by the compiler. Comments are designed to help you, or another programmer looking\
    \ at your code, explain what's going on. There are two types of comment: /* covers\
    \ multiple lines, // this means they will not begin with a double slash comments\
    \ and are ignored by the compiler. Comments are designed to help you, or another\
    \ programmer looking at your code, explain what's going on. There are two types\
    \ of comment: /* covers multiple lines, // this\n\n<<\nthe chevrons used here\
    \ are insertion operators. This means that whatever follows the chevrons is to\
    \ be inserted into the std::cout statement. In this case they're 'hello', 'world',\
    \ which are to be displayed on the screen when you compile and execute\n\n```\n\
    // helloworld.cpp\n#include <iostream>\n\nint main() {\n    // My first C++ program\n\
    \    std::cout << \"Hello, world!\\n\";\n    return 0;\n}\n```\n\n# STD\n\nwild\
    \ stands for standard. It's part of the Standard Namespace in C++, which covers\
    \ a different number of statements and commands. You can leave the std:: part\
    \ of the code but it must be declared at the start: by using namespace std; not\
    \ both for.\n\n```\n#<iostream>\nusing namespace std;\n```\n\n# OUTPUTS\n\nLeading\
    \ on, \"Hello, world!\" is what we want to appear on the screen when the code\
    \ is executed. You can enter whatever you like, as long as it is inside the quotation\
    \ marks. The brackets aren't needed but some insist on them. The \\n part indicates\
    \ a new line is to be.\n\n```\n// My first C++ program\ncout << \"Hello, world!\\\
    n\"\n```\n\n# COUT\n\nIn this example we're using cout, which is part of the Standard\
    \ Namespace, hence why it's there, as you're asking C++ to use it from that particular\
    \ namespace. Cout means Output, which displays or prints, something to the screen.\
    \ If we use std:: we have to declare it at the start of the code, as mentioned\
    \ previously.\n\n# ; AND\n\nFinally you can see that lines within a function code\
    \ block (except comments) end with a semicolon. This marks the end of the statement\
    \ and all statements in C++ must have at least one end or the compiler fails to\
    \ build the code. The very last line has the closing brace to indicate the end\
    \ of the function.\n\n```\n* helloworld.cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    // My first C++ program\n    cout << \"Hello, world!\\\
    n\";n    return 0;\n}\n```\n\nwww.pcbpublications.com 63"
