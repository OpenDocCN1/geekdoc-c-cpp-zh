  md: "# Why C++?\n\nC++ is one of the most popular programming languages available\
    \ today. Originally called C with Classes, the language was renamed C++ in 1983.\
    \ It's an extension of the original C language and is a general purpose object-oriented\
    \ OOP environment.\n\n# EVERYTHING\n\nDue to how complex the language can be,\
    \ and its power and performance, C++ is often used to develop games, programs,\
    \ device drivers and even operating systems.\n\nDating back to 1979, the start\
    \ of the era of home computing, C++, or rather with Classes, was the brainchild\
    \ of Danish scientist Bjarne Stroustrup while on his PhD thesis. Stroustrup's\
    \ plan was to further enhance the original C language, which was widely used since\
    \ the early seventies.\n\ncomputing labs and by regular people who didn't have\
    \ access to the mainframes and large computing centres.\n\nC++ impact in the digital\
    \ world is immense. Many of the programs, applications, games and even operating\
    \ systems, such as Photoshop, are coded using C++. For example, all of Adobe's\
    \ major applications, InDesign and are developed in C++. You will find that the\
    \ browser you surf the internet is written in C++, as Windows 10, Microsoft Office\
    \ and the backbone to Google's search engine. Apple's macOS is written largely\
    \ in C++ (with some\n\nC++ proved to be popular among the developers of the '80s,\
    \ since it was a much easier environment to get grips with and more importantly,\
    \ it was 99% compatible with the original C language. It meant that it could be\
    \ used beyond the mainstream\n\n+   C++ code is much faster than that of Python.\n\
    \n```\n#include <iostream>\nusing namespace std;\nvoid main() {\n    char ch;\n\
    \    cout<<\"Enter a character to check if it is vowel or not\";\n    switch (ch)\
