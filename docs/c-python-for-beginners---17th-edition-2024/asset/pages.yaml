    up you want to start Code:Blocks, now yes.


    ### STEP 8 Before you start Code:Blocks it''s worth explaining why you needed
    the compiler. A compiler is a separate program that reads through C++ code and
    checks it against the latest programming standards; this is why you need the most
    recently available compiler. This is C++1 for now.


    ```

    Code shortcut: C:\Users\David\AppData\Roaming\Microsoft\Windows\Start Menu\

    ```


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_0.png)


    ### STEP 6 The first time Code:Blocks runs it will auto-detect any C++ compilers
    you may have installed on your system. If you don''t, have the first detected
    option, GCC Compiler, and click the Default to set it as your system C++ compiler.
    Click OK when you''re ready to continue.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_1.png)


    ### STEP 9 Essentially, computers work and understand binary, and zeros, or Machine
    Language. Programming isn''t efficient for human beings. For example, to output
    your "Hello World" to the screen C would appear in binary:


    ```

    01101000 01100111 01110101 01100100 00100000

    01100110 01100111 01110100 00100111 00100000

    01101101 01100111 01110111 01100100 00100000

    01100101 01100110 01110101 01100110 01100110

    01100101 01100111 01110111 01101111 01100100

    01110101 01110110 01100001 01110100 00100000

    01100011 01101111 01110100 01110100 01101110

    01101110 01101110 01110110 01110110 01110110

    01110110 01110110 01100110 01100110 01101111

    ```


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_2.png)


    ### STEP 7 When the program starts another message appears, showing you that Code:Blocks
    is currently not the default C++ compiler. You have a couple of: to leave everything
    as it is or allow to associate C++ file types. Again, we recommend you opt for
    the last choice to associate Code:Blocks with every supported file type.


    ### STEP 10 The compiler takes whatever you want to enter as C++ code and translates
    it into machine code ''builds'' the code, checking for errors, then runs it through
    the check standardization and it uses zeros and ones for the computer to act upon.
    It''s rather clever stuff, when you stop to think about it.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_3.png)'
