  md: '# How to Set Up Python on a Mac


    If you''re running an Apple Mac, then setting up Python is incredibly easy. In
    fact a version of Python **2.5.1** is already installed. However, you should make
    sure you''re running the latest version.


    # INSTALLING PYTHON


    Apple''s operating system comes with Python installed, so you don''t need to install
    it separately. However, Apple doesn''t update Python very often and you''re probably
    running an older version. It makes sense to check and update first.


    +   **STEP 1** Open a new Terminal window by clicking Go > Utilities, double-click
    the Terminal icon. Now enter: `--version`. You should see Python and even later,
    if Apple has updated the OS and Python installation. Either way, it''s best to
    check for the latest.


    +   **STEP 3** Click on the latest version of Python 3.x, in our case this is
    the download button for Python 3.6.2 and depending on how you''ve got your Mac
    configured, it automatically starts the installation


    ![](img/bb949c7c28c27d6124a761521ffcfb43_15_0.png)


    +   **STEP 2** Open Safari and head over to **www.python.org/downloads**. As with
    Windows setup on the previous pages, you can see two download buttons: for Python
    3.6.2, and the other for Python 2.7.13. Note, that version may be different due
    to the frequent releases of Python.


    +   **STEP 4** With the Python installation window open, click on the Continue
    to begin the the. In this section, there are references that apply to your version
    of macOS. When ready, continue again.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_15_1.png)


    ![](img/bb949c7c28c27d6124a761521ffcfb43_15_2.png)


    Wondering which version to use? [Here''s about the difference Between Python 2
    and 3.](https://www.python.org/doc/python-3/)


    Looking for Python with a different OS? For [Windows](https://www.python.org/downloads/windows/),
    [Mac](https://www.python.org/downloads/macos/), or [pre-releases](https://www.python.org/downloads/source/).'
