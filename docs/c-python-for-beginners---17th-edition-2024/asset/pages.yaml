  md: '# C++ Fundamentals


    # Using Comments


    While comments may seem like a minor to the many lines of code that combine to
    make a game, an application or even an operating system, in fact that they''re
    probably one of the most important factors.


    # THE IMPORTANCE OF COMMENTING


    Comments inside code are human readable descriptions that detail what the code
    is doing at that particular point. They don''t seem important but without code
    comments is one of the many frustrating areas of unless you''re a professional
    or just starting out.


    In short, code should be commented in a manner to effectively describe the purpose
    of a line, section, or individual elements. You should get in the habit of commenting
    as much as possible so that someone who doesn''t know anything about programming
    can understand it by going to read your code.


    In a professional environment, comments are vital to the success of the code and
    the company. In an organisation, programmers work in teams alongside engineers,
    other developers and analysts. And if you''re part of the team that maintains
    software, your comments help save the team when something goes wrong, and another
    team member has to pick up and follow the trail


    Place yourself in the shoes of someone whose job is to find out what''s wrong
    with your program. With over 800,000 lines of code, you might scan across different
    modules and need a little help from the original programmers in the form of a
    good comment.


    > The best comments always connect and link the code, detailing what happens when
    the program hits its line or section. You don''t need to comment on every line.
    Something along the lines if x=0 does not require you to comment that if x equals
    zero then do something:


    that''s going to be obvious to the reader. However, if equaling zero is something
    that drastically changes the program for the user, as if you''re out of lines,
    then it certainly needs to be commented.


    Even if it is you are going to be publicly sharing it with others. This way you
    can remember and always understand what you did or where you went wrong or what
    worked brilliantly.


    Comments are good practice once you understand how to add a comment when you need
    some, so if it''s your secret.


