    \n![](img/bb949c7c28c27d6124a761521ffcfb43_40_1.png)\n\n# LOOPS\n\nA loop looks\
    \ quite similar to a condition but they are somewhat different in their operation.\
    \ A loop will run through the same block of code many times, usually with the\
    \ support of a condition.\n\nSTEP 1 Let's start with a simple While Statement.\
    \ If, this will check if something is TRUE, then the indented code:\n\n```\nx\
    \ = 0\nwhile x < 10:\n    print(x)\n    x = x + 1\n```\n\nSTEP 3 The For loop\
    \ is another example. For is used to loop over a range of data, a list stored\
    \ as variables inside square brackets. For example:\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_40_2.png)\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_40_3.png)\n\nSTEP 2 The difference\
    \ between If and while is when gets to the end of the indented code, it goes back\
    \ and checks the statement is still true. In an example x is less than 10. With\
    \ each loop it prints the current value of x, then adds one to value. When x equals\
    \ 10 it stops.\n\nSTEP 4 The For loop can also be used in the countdown example\
    \ using the range function:\n\n```\nfor x in range (1, 10):\n    print(x)\n```\n\
