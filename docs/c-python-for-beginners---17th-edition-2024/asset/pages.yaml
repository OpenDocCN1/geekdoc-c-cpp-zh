    \ (name + \" is\")\nDavid Howard is\n>>> type(age)\nclass 'int'\n>>> age = \"\
    Descended from Vikings\"\n>>> print (name + age)\nTraceback (most recent call\
    \ last):\n  File \"<input>\", line 1, in <module>\nTypeError: Can't convert 'int'\
    \ object to str\n```\n\n# STEP 8\n\nThis presents a bit of a problem when you\
    \ want to work with a number that's been inputted as a string variable and an\
    \ integer. Instead, you need to:\n\n```\nint(age) + 10\n```\n\nThis will cast\
    \ the age into an integer that can be worked.\n\n```\nEdit Shell Debug Options\
    \ Windows help\nPython 3.2 (default, Oct 19 2014, 13:01:11)\nGCC 4.9.0 on linux\n\
    >>> name = \"David Howard\"\n>>> age = 44\n>>> type(\"credits\" or \"license\"\
    ) for more information.\n>>> age = input(\"how old are you ?\")\n44\n>>> type(age)\n\
    class 'str'\n>>> int(age) + 10\nTraceback (most recent call last):\n  File \"\
    <input>\", line 1, in <module>\nTypeError: Can't convert 'str' object to int\n\
    ```\n\n# STEP 6\n\nThis is a process called Type Casting. The Python code is:\n\
    \n```\nprint (character, \" is \" + str(age) + \" years old.\")\n```\n\nor you\
    \ can use:\n\n```\nprint (character, \"is,\" age, \"years old.\")\n```\n\nNotice\
    \ that in the latter, you don't need space between the words and commas as the\
    \ comma treats each argument separately.\n\n```\n>>> print (name, age)\nTraceback\
    \ (most recent call last):\n  File \"<input>\", line 1, in <module>\nTypeError:\
    \ Can't convert 'int' object to str\n>>> print (name, \" is \" + str(age) + \"\
    \ years old.\")\nDavid Howard is 44 years old.\nDavid Howard Descended from Vikings\n\
    >>> print (name, \"is,\" age, \"years old.\")\nDavid Howard,44 years old.\n```\n\
    \nThe use of TypeC is also important when dealing with floating arithmetic; numbers\
    \ that have a decimal point. For example:\n\n```\n19.99\n```\n\nNow enter (float)\
    \ and you'll see that Python has allocated the number as a 'float', which contains\
    \ a decimal point.\n\n```\nEdit Shell Debug Options Windows help\nPython 3.2 (default,\
    \ Oct 19 2014, 13:01:11)\nGCC 4.9.0 on linux\n>>> type(\"credits\" or \"license\"\
    ) for more information.\n>>> age = input(\"how old are you ?\")\n19.99\n>>> type(age)\n\
    class 'str'\n>>> float(age)\nclass 'float'\n```\n\n# STEP 7\n\nAnother example\
    \ of TypeCasting is when you input from the user, such as for example:\n\n```\n\
    enter:\nage = float(input(\"how old are you ?\"))\"\n```\n\nAll data stored from\
    \ the input is a string variable.\n\n# STEP 10\n\nWhen combining integers and\
    \ a float, Python usually converts the float tos worth returning the Python result.\
    \ When combining two integers, Python will always round down to the nearest integer,\
