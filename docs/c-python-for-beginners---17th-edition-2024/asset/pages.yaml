  md: "# C++ COMMENTS\n\nCommenting in C++ involves using a double forward slash '/',\
    \ or a forward slash and an asterisk, '/*'. You've already seen brief examples\
    \ but this is how they work.\n\nSTEP 1 Using the Hello World code as an example,\
    \ you can easily comment on different sections of the code using the double forward\
    \ slash:\n\n```\n// My first C++ program\ncout << \"Hello, world!\\n\";n\n#include\
    \ <iostream>\nusing namespace std;\n\nint main() {\n\n    // My first C++ program\n\
    \    cout << \"Hello, world!\\n\";n\n}\n```\n\nSTEP 4 Be careful when commenting,\
    \ especially with block comments. It's very easy to forget to add the closing\
    \ slash and thus not negate any code that falls inside the comment block.\n\n\
    ```\n// HelloWorld.cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n\n    cout << \"Hello, world!\\n\"\n    cout << \"And greetings from C++\"\
    \n\n    // several lines\n\n    // This line is now being ignored by the compiler!/\n\
    }\n```\n\nSTEP 2 You can also add comments to the end of a line, to describe in\
    \ a better way what's going on:\n\ncout << \"Hello, world!\\n\"; //This line outputs\
    \ the words 'Hello, world!'. The \\n denotes a new line.\n\nNote, you don't have\
    \ to put a semicolon at the end of a comment. This's because the line it's ignored\
    \ by the compiler.\n\n```\n// HelloWorld.cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n\n    cout << \"Hello, world!\\n\"; //This line compares\
    \ the world, with the the.\n\n    // This comment can\n    // several lines\n\
    \    // Without the need to add more lines /\n\n    // This line is now being\
    \ ignored by the compiler!/\n```\n\nSTEP 5 If you try and add code out of place,\
    \ a missing bracket ']' off the block of code if you made a few errors, then it\
    \ can be time to go back and rectify. Frankly, the colouring in Code::Blocks helps\
    \ identify them comments.\n\n```\n// HelloWorld.cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n\n    cout << \"Hello, world!\\n\"\n    cout\
    \ << \"And greetings from C++\"\n\n    // This comment can\n    // several lines\n\
    \    // Without the need to add more lines /\n\n    // This line is now being\
    \ ignored by the compiler!/\n```\n\nSTEP 6 If you're writing comments, it's good\
    \ practice in C++ to add an asterisk to each new line of the comment block. This\
    \ also helps you to remember the comment block before continuing the code.\n\n\
    > /* This comment canncover several lines\nwithout the need to add more lines\
    \ */\n\nJust remember to finish the comment block with the opposite asterisk and\
    \ forward slash.\n\n```\nint main() {\n\n    // This comment can\n    cout <<\
    \ \"Hello, world!\\n\"\n    cout << \"And greetings from C++\"\n\n    // This\
    \ comment can\n    // several lines\n    // Without the need to add more lines\
    \ /\n\n    // This line is now being ignored by the compiler!/\n```\n\n> /* This\
    \ comment canncover several lines\nwithout the need to add more lines */\n\n```\n\
    int main() {\n\n    cout << \"Hello, world!\\n\"\n    cout << \"And greetings\
    \ from C++\"\n\n    // This comment can\n    // several lines\n    // Without\
    \ the need to add more lines /\\n\n    // This line is now being ignored by the\
    \ compiler!/\n```"
