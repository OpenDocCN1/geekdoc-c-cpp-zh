  md: "# STEP 5\n\nYou can also use an operation to use the remainder left over from\
    \ division. For example:\n\n10/3\n\nWill display 3.333333333, which is of 3.3-recurring.\
    \ If you now enter:\n\n10%3\n\nThis will display 1, which is the remainder left\
    \ over dividing 10 into 3.\n\n```\n37390231201175024\n** 2/2\n1\n 3/2\n** 2*3\n\
    6\n** (1+2)*(3)\n9\n** 11/2\n5\n** 10/3\n3\n** 3.3333333333333335\n3\n** 2*10\n\
    20\n1000000000\n** 10%3\n```\n\n# STEP 6\n\nNext we may use the power operator,\
    \ or exponentiation if you want to be technical. To work out the power of something\
    \ you can use a double multiplication symbol or decaret on the keyboard:\n\n2**3\n\
    10**10\n\nEssentially, it's 2x2 but here we already know the basics math operators.\
    \ This is how you would work it in Python:\n\n```\n6/2\n** 2*3\n6\n** (1+2)*(3)\n\
    9\n** 11/2\n5\n** 10/3\n3\n** 3.3333333333333335\n3\n** 10%3\n3\n** 2*10\n20\n\
    1000000000\n```\n\n# STEP 7\n\nNumbers and expressions have built-in functions\
    \ to work out stuff of absolute values, complex numbers and half of mathematical\
    \ expressions and Pythagorean tongues. To convert to a binary, use:\n\nbin(3)\n\
    \n```\n6/2\n** 2*3\n6\n** (1+2)*(3)\n9\n** 11/2\n5\n** 10/3\n3\n** 3.3333333333333335\n\
    3\n** 10%3\n3\n** 2*10\n20\n1000000000\n** bin(3)\n```\n\n# STEP 8\n\nThis will\
