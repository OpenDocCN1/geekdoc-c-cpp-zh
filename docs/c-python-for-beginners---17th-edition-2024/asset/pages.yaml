  md: "# C++ Fundamentals\n\n# Variables\n\nVariables differ slightly when using C++\
    \ as opposed to Python. You can simply state that 'a' equals 10 and a variable\
    \ is assigned. However, in C++ a variable has to be declared with its type before\
    \ it can be used.\n\n# THE DECLARATION OF VARIABLES\n\nYou can declare a C++ variable\
    \ by using statements within the code. There are several distinct types of variables\
    \ you can declare. Here is how it works.\n\n+   STEP 1 Open a new, blank C++ file\
    \ and enter the usual code headers:\n\n+   STEP 3 You can build and run the code\
    \ but it won't much, other than store the values 10 and 5 to integers and b. To\
    \ output the contents of the variables, add:\n\n```\n#include <iostream>\nusing\
    \ namespace std;\nint main()\n{\n}\n```\n\n```\ncout << a;\ncout << \"\\n\";\n\
    cout << b;\n\nThe cout << \"\\n\"; simply places a new line between the output\
    \ of 10 and 5.\n```\n\n```\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n    int a;\n    int b;\n\n    a = 10;\n    b = 5;\n\n    cout << a;\n    cout\
    \ << \"\\n\";\n    cout << b;\n}\n```\n\n+   STEP 2 Start simple by creating two\
    \ variables, a and b, with having one value of 10 and the other 5. You can use\
    \ data type to declare these variables. In the curly brackets, enter:\n\n+   STEP\
    \ 4 Naturally you can declare a new variable, call it result and output some simple\
    \ arithmetic:\n\n```\nint a;\nint b;\na = 10;\nb = 5;\n```\n\n```\nresult = a\
    \ + b;\ncout << result;\n```\n\n```\n#include <iostream>\nusing namespace std;\n\
    int main()\n{\n    int a;\n    int b;\n    int result;\n    a = 10;\n    b = 5;\n\
    \    result = a + b;\n    cout << result;\n}\n```\n\nInsert the code as the screenshot."
