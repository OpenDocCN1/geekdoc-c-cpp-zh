    # C++ Fundamentals


    Within this section you can begin to understand the structure of C++ code and
    how to compile and execute that code. These are the fundamentals of C++, which
    teach you the basics such as using comments, variables, data types, strings and
    how to use C++ mathematics.


    These are the building blocks of a C++ program. With them, you can form your own
    code, produce an output to the screen and store and retrieve data.'
- md: "\n# Your First C++ Program\n\nYou may have followed the Mac and Linux examples\
    \ previously but you're going to be working exclusively in Windows and Code::Blocks\
    \ from here on. Let's begin by writing your first C++ program and taking the first\
    \ step into a larger coding world.\n\n## HELLO, WORLD!\n\nit's traditional in\
    \ programming for the first code to be entered into the words 'Hello, World!'\
    \ to the screen. Interestingly, this dates back to 1968 using a language called\
    \ BCPL.\n\n- **STEP 1** As mentioned, we're using Windows 10 and the latest version\
    \ of Code::Blocks for the rest of the C++. Begin by launching Code::Blocks. When\
    \ open, click on File -> New -> Empty File or press Ctrl+SHIFT+N on the keyboard.\n\
    \n- **STEP 2** You can now see a blank screen, with the labelled 'Untitled1',\
    \ and the number in the top left of the main window: Code::Blocks. Begin by clicking\
    \ in the main window, the cursor is next to the next one, and entering:\n`#include\
    \ <iostream>`\n\n- **STEP 3** At the moment it doesn't look like much, and it\
    \ even makes less sense, but we'll get to that in course. Now click on File ->\
    \ Save As. Create or find a suitable location on your hard drive and find in the\
    \ Name box, call it hell.cpp. Click the Save as type box and select C/C++ files.\
    \ Click the Save button.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_59_0.png)\n\
    \n- **STEP 4** You can see that Code::Blocks has now changed the colour coding,\
    \ recognising that the file is C++ code. This means that code can be auto-selected\
    \ from the Code::Blocks repository. Delete the #include <iostream> line and re-enter\
    \ it. You can see the auto-select boxes appearing.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_59_1.png)\n\
    \n- **STEP 5** Auto-selection of commands is extremely handy and cuts out potential\
    \ mistyping. Press Return to get to line, then enter:\n\n- **STEP 6** On the next\
    \ line below int main(), enter a curly bracket:\n\n- **STEP 8** Note again the\
    \ colour coding change. Press Return at the end of the previous step, and then\
    \ enter:\n\n```cpp\nint main()\n```\n\nNote: there's no space between the brackets.\n\
    \n```cpp\nstd::cout << \"Hello, world!\\n\";\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_60_0.png)\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_60_1.png)\n\n- **STEP 9** Just as before,\
    \ Code::Blocks auto-completes the code you're entering including placing a speech\
    \ mark at the semicolon of the line. This is one of the de-facto important elements\
    \ to a C++ program and we will tell you why in the next section. Now, move the\
    \ cursor to the closing bracket and press Return.\n\nThis can be done by pressing\
    \ Shift and the key to the right of P on an English UK keyboard layout.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_60_2.png)\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_60_3.png)\n\n- **STEP 7** Notice that\
    \ Code::Blocks has automatically created a closing bracket a couple of lines below\
    \ linking the pair, as well as a slight indent. This is due to the structure of\
    \ C++ and it is where the meat of the code is entered.\n\nNow enter:\n\n- **STEP\
    \ 10** That's all you need to do for the moment. it may not look terribly amazing\
    \ but C++ in small chunks. Don't execute the code at the moment as you need to\
    \ look at how a C++ program is structured first then you can build and run it.\
    \ Now, click Save, the single floppy disk icon.\n\n```cpp\n//My first: C++ program\n\
    ```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_60_4.png)\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_60_5.png)\n\
    \n# C++ Fundamentals\n\n# Structure of a C++ Program\n\nC++ has a very defined\
    \ structure and way of doing things. Miss something out, even as small as a semicolon,\
    \ and your entire program will fail to be compiled and executed. Many a professional\
    \ programmer has fallen foul of sloppy structure.\n\n## INCLUDE <C++ STRUCTURE>\n\
    \nLearning the basics of programming, you begin to understand the structure of\
    \ a program. The commands may be different from one language to the next, but\
    \ you will start to see how the code works.\n\n| Start here | *helloworld.cpp\
    \ |\n|---|---|\n| 1 | #include <iostream> |\n| 2 | |\n| 3 | |\n| 4 | |\n| 5 |\
    \ |\n| 6 | |\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_61_0.png)\n\nBjarne Stroustrup,\
    \ inventor of C++.\n\n## INT MAIN()\n\nint main() initiates the declaration of\
    \ a function, which is group of code statements under the name 'main'. All C++\
    \ code begins at the main function, regardless of where it lies within the code.\n\
    \n| Start here | *helloworld.cpp |\n|---|---|\n| 1 | #include <iostream> |\n|\
    \ 2 | |\n| 3 | int main() |\n| 4 | |\n| 5 | |\n| 6 | |\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_61_1.png)\n\
    \n## BRACES\n\nThe open brace (curly brackets) is something you may not have before,\
    \ especially if you used to Python. The open brace indicates the beginning of\
    \ the main function and contains all the code that belongs to that function.\n\
    \n| #include <iostream> | |\n|---|---|\n| 1 | |\n| 2 | int main() |\n| 3 | |\n\
    | 4 | { |\n| 5 | |\n| 6 | } |\n\n# Structure of a C++ Program\n\n## COMMENTS\n\
    \nLines begin with a double slash are comments. This means they won't be executed\
    \ in the code and are ignored by the compiler. Comments are designed to help you,\
    \ or another programmer looking at your code, explain what's on. There are two\
    \ types of comment: /* multiple lines, // this the chevrons used here are insertion\
    \ operators. This means that whatever follows the chevrons is to be inserted into\
    \ the std::cout statement. In this case they're 'hello', 'world', which are to\
    \ be displayed on the screen when you compile and execute\n\n```cpp\n//helloworld.cpp\n\
    #include <iostream>\n\nint main() {\n    // My first C++ program\n    std::cout\
    \ << \"Hello, world!\\n\";\n    return 0;\n}\n```\n\n## STD\n\nstands for standard.\
    \ It's part of the Standard Namespace in C++, which covers different number of\
    \ statements and commands. You can leave the std:: part of the code but it must\
    \ be declared at the start: by namespace std; not for.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n```\n\n## OUTPUTS\n\nLeading on, \"Hello, world!\" is what\
    \ we want to appear on the screen when the code is executed. You can enter whatever\
    \ you like, as long as it is inside the quotation marks. The brackets aren't needed\
    \ but some insist on them. The \\n part indicates a new line is to.\n\n```cpp\n\
    // My first C++ program\ncout << \"Hello, world!\\n\"\n```\n\n## COUT\n\nIn this\
    \ example we're using cout, which is part of the Standard Namespace, hence why\
    \ it's there, as you're asking C++ to use it from that particular namespace. Cout\
    \ means Output, which displays or prints something to the screen. If we use std\
    \ have to declare it at the start of the code, as mentioned previously.\n\n##\
    \ ; AND\n\nFinally you can see that lines within a function code block (except\
    \ comments) end with a semicolon. This marks the end of the statement and all\
    \ statements in C++ must have at least one or the compiler fails to build the\
    \ code. The very last line has the closing brace to indicate the end of the function.\n\
    \n```cpp\n* helloworld.cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    // My first C++ program\n    cout << \"Hello, world!\\n\";\n    return\
    \ 0;\n}\n```\n\n# C++ Fundamentals\n\n# Compile and Execute\n\nYou've created\
    \ your first C++ program and you now understand the basics behind the structure\
    \ of one. Let's actually get things moving and compile and execute, or run if\
    \ you prefer, the program and see how it looks.\n\nCompiling and executing C++\
    \ code from Code::Blocks is extraordinarily easy; just a matter of clicking an\
    \ icon and seeing the result. Here's how it's done.\n\n- Open Code::Blocks, if\
    \ you haven't already, and load up the previously saved Hello World code you created.\
    \ Ensure there are no visible errors, such as missing semicolons at the end of\
    \ std::cout line.\n\n- Start by clicking on the Build icon, the yellow cog. At\
    \ this point, your code has now been run through the Code::Blocks compiler and\
    \ checked for any errors. You can see the results of the Build by looking to the\
    \ bottom window pane. Any messages regarding the quality of the code are displayed\
    \ here.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_63_0.png)\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    std::cout << \"Hello, world!\";\n    return\
    \ 0;\n}\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_63_1.png)\n\nin \"no\
    \ project\" (compiler: unknown) = 0 error(s), 0 warning(s) (0 minute(s)\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_63_2.png)\n\
    \n- If your code is looking like the one in our screenshot, look to the menu bar\
    \ at the top of the screen. Use the Entry in the topmost menu you can see a group\
    \ of icons: a yellow cog, green play button and a cog/play button. These are Build,\
    \ Run, and Restart functions.\n\n- Now click on the Run icon, the green play button,\
    \ displaying the words: Hello, world!, followed by the time it's to execute the\
    \ code, and asking you to press key to continue. Well you just compiled and executed\
    \ your first C++ program.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_63_3.png)\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_63_4.png)\n"
  mdcn: "\n\n# 你的第一个 C++ 程序\n\n你之前可能已经参考了 Mac 和 Linux 的示例，但从现在开始，你将专门在 Windows 和 Code::Blocks\
    \ 中工作。让我们从编写你的第一个 C++ 程序开始，迈向更大编程世界的第一步。\n\n## HELLO, WORLD!\n\n在编程中，传统的第一个代码通常是在屏幕上输入“Hello,\
    \ World!”字样。有趣的是，这可以追溯到 1968 年的一种名为 BCPL 的语言。\n\n- **步骤 1** 如前所述，接下来的 C++ 学习我们将使用\
    \ Windows 10 和最新版本的 Code::Blocks。开始启动 Code::Blocks。打开后，点击 File（文件）-> New（新建）->\
    \ Empty File（空文件），或在键盘上按 Ctrl+SHIFT+N。\n\n- **步骤 2** 现在你可以看到一个标记为“Untitled1”的空白屏幕，主窗口左上角有数字：Code::Blocks。点击主窗口，光标出现在下一个光标旁边，然后输入：\n\
    `#include <iostream>`\n\n- **步骤 3** 目前这看起来没什么特别的，甚至不太理解，但我们稍后会解释。现在点击 File（文件）->\
    \ Save As（另存为）。在你的硬盘上创建或找到合适的位置，在 Name（文件名）框中将其命名为 hell.cpp。点击 Save as type（保存类型）框并选择\
    \ C/C++ files。点击 Save（保存）按钮。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_59_0.png)\n\
    \n- **步骤 4** 你可以看到 Code::Blocks 现在更改了颜色编码，识别出文件是 C++ 代码。这意味着可以从 Code::Blocks 仓库中自动选择代码。删除\
    \ `#include <iostream>` 行并重新输入。你可以看到出现了自动选择框。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_59_1.png)\n\
    \n- **步骤 5** 自动选择命令非常有用，可以避免潜在的拼写错误。按 Return（回车键）到下一行，然后输入：\n\n- **步骤 6** 在 `int\
    \ main()` 下的下一行，输入一个大括号 `{`：\n\n- **步骤 8** 再次注意颜色编码的变化。在上一个步骤的末尾按 Return，然后输入：\n\
    \n```cpp\nint main()\n```\n\n注意：括号之间没有空格。\n\n```cpp\nstd::cout << \"Hello, world!\\\
    n\";\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_60_0.png)\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_60_1.png)\n\
    \n- **步骤 9** 和之前一样，Code::Blocks 会自动完成你输入的代码，包括在行的分号处放置引号。这是 C++ 程序中非常重要的元素之一，我们将在下一节告诉你原因。现在，将光标移动到右括号处并按\
    \ Return。\n\n在英式键盘布局下，可以通过 Shift 键和 P 右侧的键来实现。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_60_2.png)\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_60_3.png)\n\n- **步骤 7** 注意到 Code::Blocks\
    \ 自动在几行下方创建了一个右括号将这对连接起来，并带有微小的缩进。这是由于 C++ 的结构决定的，也是输入代码主体的地方。\n\n现在输入：\n\n- **步骤\
    \ 10** 这就是你目前需要做的一切。它看起来可能并不神奇，但 C++ 是分小块学习的。目前先不要执行代码，因为你需要先观察 C++ 程序的结构，然后才能编译并运行它。现在，点击单磁盘图标进行\
    \ Save（保存）。\n\n```cpp\n// 我的第一个：C++ 程序\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_60_4.png)\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_60_5.png)\n\n# C++ 基础\n\n# C++ 程序结构\n\
    \nC++ 有非常明确的结构和处理方式。漏掉任何内容，即使是一个微小的分号，你的整个程序将无法编译和执行。许多专业程序员都曾在结构疏松上吃过亏。\n\n##\
    \ INCLUDE <C++ 结构>\n\n学习编程基础后，你开始理解程序的结构。命令在不同语言之间可能不同，但你将开始看到代码是如何工作的。\n\n| 从这里开始\
    \ | *helloworld.cpp |\n|---|---|\n| 1 | #include <iostream> |\n| 2 | |\n| 3 |\
    \ |\n| 4 | |\n| 5 | |\n| 6 | |\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_61_0.png)\n\
    \nBjarne Stroustrup，C++ 的发明者。\n\n## INT MAIN()\n\n`int main()` 初始化一个函数，即位于 'main'\
    \ 名称下的代码语句组。所有 C++ 代码都从 main 函数开始，无论它位于代码的何处。\n\n| 从这里开始 | *helloworld.cpp |\n\
    |---|---|\n| 1 | #include <iostream> |\n| 2 | |\n| 3 | int main() |\n| 4 | |\n\
    | 5 | |\n| 6 | |\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_61_1.png)\n\n## BRACES\n\
    \n左括号（大括号）是你可能以前没有过的，特别是如果你用过 Python 的话。左括号表示 main 函数的开始，包含了该函数的所有代码。\n\n| #include\
    \ <iostream> | |\n|---|---|\n| 1 | |\n| 2 | int main() |\n| 3 | |\n| 4 | { |\n\
    | 5 | |\n| 6 | } |\n\n# C++ 程序结构\n\n## COMMENTS\n\n以双斜开头的行是注释。这意味着它们不会在代码中执行，会被编译器忽略。注释帮助你或查看代码的程序员解释内容。有两种注释：`/*\
    \ */` 多行注释，`//` 这里的尖括号是插入运算符。这意味着尖括号后的任何内容都要插入到 `std::cout` 语句中。在这种情况下，'hello',\
    \ 'world' 将编译和执行时显示在屏幕上。\n\n```cpp\n//helloworld.cpp\n#include <iostream>\n\n\
    int main() {\n    // 我的第一个 C++ 程序\n    return 0;\n}\n```\n\n## STD\n\n代表 standard（标准）。它是\
    \ C++ 标准命名空间的一部分，涵盖了许多不同的语句和命令。你可以省略 `std::` 部分，但必须在开头声明 `namespace std`。\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n```\n\n## OUTPUTS\n\n前面的 \"\
    Hello, world!\" 是我们希望在代码执行时出现在屏幕上的内容。只要在引号内，你可以输入任何内容。括号不是必须的，但有些人坚持。`\\n` 部分表示换行。\n\
    \n```cpp\n// 我的第一个 C++ 程序\ncout << \"Hello, world!\\n\"\n```\n\n## COUT\n\n在这个示例中我们使用了\
    \ `cout`，它是标准命名空间的一部分，这就是为什么它在那里，因为你在要求 C++ 使用那个特定的命名空间。`cout` 代表 Output（输出），它在屏幕上显示或打印某些内容。如之前提到的，我们需要在代码开头声明它。\n\
    \n## ; AND\n\n最后你可以看到函数代码块内的行（注释除外）以分号结尾。这标记了语句的结束，C++ 中的语句必须至少有一个分号，否则编译器将无法构建代码。最后一行有右括号表示函数的结束。\n\
    \n```cpp\n* hell.cpp\n#include <iostream>\nusing namespace std;\n\nint main()\
    \ {\n    cout << \"Hello, world!\\n\";\n    return 0;\n}\n```\n\n# C++ 基础\n\n\
    # 编译与执行\n\n你已经创建了第一个 C++ 程序，现在理解了其结构基础。让我们实际行动起来，编译并执行（或如果你愿意，运行）程序，看看它的样子。\n\n\
    在 Code::Blocks 中编译和执行 C++ 代码非常简单；只需点击图标并查看结果。操作如下：\n\n- 打开 Code::Blocks（如果还没有打开），加载你之前保存的\
    \ Hello World 代码。确保没有可见错误，例如 `std::cout` 行末尾缺少分号。\n\n- 开始点击 Build（构建）图标（黄色齿轮）。此时，你的代码已经通过了\
    \ Code::Blocks 编译并检查了任何错误。你可以通过底部窗口面板查看 Build 结果。任何关于代码质量的消息都会在这里显示。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_63_0.png)\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    std::cout << \"Hello, world!\"\
    ;\n    return 0;\n}\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_63_1.png)\n\
    \nin \"no project\" (compiler: unknown) = 0 error(s), 0 warning(s) (0 minute(s)\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_63_2.png)\n\n- 如果你的代码看起来和我们的截图一样，查看屏幕顶部的菜单栏。使用顶部菜单中的，你可以看到一组图标：黄色齿轮、绿色播放按钮和齿轮/播放按钮。这些是\
    \ Build（构建）、Run（运行）和 Restart（重启）功能。\n\n- 现在点击 Run（运行）图标（绿色播放按钮），显示文字：Hello, world!，随后是执行代码的时间，并要求你按键继续。很好，你刚刚编译并执行了你的第一个\
    \ C++ 程序。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_63_3.png)\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_63_4.png)\n\
    \n"
