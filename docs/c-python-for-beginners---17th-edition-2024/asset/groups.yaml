    \ help\nPython 3.2 (default, Oct 19 2014, 13:01:11)\nGCC 4.9.0 on linux\n>>> name\
    \ = \"David Howard\"\n>>> age = 44\n>>> type(name)\nclass 'str'\n>>> print(name\
    \ + \" is\")\nDavid Howard is\n>>> type(age)\nclass 'int'\n>>> age = \"Descended\
    \ from Vikings\"\n>>> print(name + age)\nTraceback (most recent last):\n  File\
    \ \"<input>\", line 1, in <module>\nTypeError: Can't convert 'int' object to str\n\
