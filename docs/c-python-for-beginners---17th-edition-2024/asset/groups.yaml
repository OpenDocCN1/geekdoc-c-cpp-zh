  mdcn: "\n\n## 条件与循环\n\n条件和循环让程序变得有趣；它们可以非常简单，也可以相当复杂。你通常根据程序试图实现的目标来如何使用它们；它们可能是游戏中剩余的生命值，或者仅仅是显示倒计时。\n\
    \n## 真条件\n\n开始时保持条件简单可以让学习编程成为一种更有趣的体验。让我们从检查某个内容是否为**真**开始，如果不是，则执行其他操作。\n\n\
    - 步骤 1 让我们创建一个新的 Python 程序，要求用户输入一个单词，然后检查它是否为四字母单词。从“文件 -> 新建文件”开始，并输入以下代码：\n\
    \n```python\nword_input=input(\"Please enter a four-letter word: \")\n```\n\n\
    ![](img/bb949c7c28c27d6124a761521ffcfb43_39_0.png)\n\n- 步骤 2 现在我们可以创建一个新变量，然后使用函数并将单词传递通过以获取用户输入的字母总数：\n\
    \n```python\nword_input=input(\"Please enter a four-letter word: \")\nword_length=len(word_input)\n\
    ```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_39_1.png)\n\n- 步骤 4 `if` 结尾的冒号告诉\
    \ Python，如果这个缩进语句为真，则执行冒号后的每一行。接下来，将光标移回编辑器的开头：\n\n```python\nword_input=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word_input)\nif word_length\
    \ == 4:\n    print(word_input, \"is a four-letter word. Well done.\")\nelse:\n\
    \    print(word_input, \"is not a four-letter word.\")\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_39_2.png)\n\
    \n- 步骤 5 按 F5 保存代码并执行。首先在 Shell 中输入一个四字母单词，你应该会收到该单词是四个字母的消息。现在再次按 F5 重新运行程序，这次输入一个五字母单词。Shell\
    \ 将显示它不是四字母单词。\n\n- 步骤 6 扩展代码以包含另一个条件。最终，它可能会变得非常复杂。我们添加了一个三字母单词的条件：\n\n```python\n\
    word=input(\"Please enter a four-letter word: \")\nif len(word) == 4:\n    print(\"\
    is a four-letter word. Well done.\")\nelif len(word) == 3:\n    print(\"is a three-letter\
    \ word. Try again.\")\nelse:\n    print(\"is not a four-letter word.\")\n```\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_40_0.png)\n![](img/bb949c7c28c27d6124a761521ffcfb43_40_1.png)\n\
    \n## 循环\n\n循环看起来和条件相似，但它们的操作方式有所不同。循环会多次运行同一个代码块，通常在条件的支持下运行。\n\n- 步骤 1 让我们从简单的\
    \ `While` 语句开始。如果是，它将检查某个内容是否为真，然后执行缩进的代码：\n\n```python\nx = 0\nwhile x < 10:\n\
    \    print(x)\n    x = x + 1\n```\n\n- 步骤 3 `For` 循环是另一个例子。`For` 用于遍历数据范围，即存储在方括号内变量中的列表。例如：\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_40_2.png)\n![](img/bb949c7c28c27d6124a761521ffcfb43_40_3.png)\n\
    \n- 步骤 2 `If` 和 `while` 的区别在于当到达缩进代码的结尾时，它会返回检查语句是否仍然成立。在示例中 `x` 小于 10。每次循环中，它都会打印\
    \ `x` 的当前值，然后将值加1。当 `x` 等于 10 时，它停止。\n\n- 步骤 4 `For` 循环也可以使用 `range` 函数用于倒计时示例：\n\
    \n```python\nfor x in range(1, 10):\n    print(x)\n```\n\n`range` 函数在第一个和最后一个数字之间创建一个列表。\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_40_4.png)\n![](img/bb949c7c28c27d6124a761521ffcfb43_40_5.png)\n\
    \n## Python 模块\n\n我们之前提到过模块（如 `Math` 模块），但由于模块是充分利用 Python 的大部分，值得花更多时间来研究它们。例如，我们正在使用的是\
    \ Python 3 版本。\n\n将模块想象为导入到你的 Python 代码中的扩展，以扩展其功能。有无数可用的模块，正如我们看到的。\n\n## 掌握模块\n\
    \n模块是导入到你的 Python 代码中的扩展，以扩展其功能。有无数可用的模块。\n\n步骤 1：如果是，它将检查某个内容是否为真，然后执行缩进的代码：\n\
    \n步骤 2：`If` 和 `while` 的区别在于当到达缩进代码的结尾时，它会返回检查语句是否仍然成立。\n\n步骤 3：`For` 循环是另一个例子。\n\
    \n步骤 4：`For` 循环也可以使用 `range` 函数用于倒计时示例。\n\n步骤 5：按 F5 保存代码并执行它。\n\n步骤 6：扩展代码以包含另一个条件。\n\
    \n"
