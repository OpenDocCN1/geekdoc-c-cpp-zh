    # # Starting Python for the First Time


    We''re going to be using the Raspberry Pi as our Python 3 hardware platform. The
    latest version of Raspian preinstalled with Python 3, version 3.4.2 to be exact,
    so as long as you have a version 3 Shell, all our code will work.


    # STARTING PYTHON


    We''re not going to into the details of the Raspberry Pi up and running, there''s
    plenty of material available on that subject. However, once you''re ready, fire
    up your Pi and get ready for coding.


    **STEP 1** With the Debian desktop loaded, click on the Menu button followed by
    Programming > Python 3 IDLE. This opens the Python 3 Shell. Windows and Mac users
    can find the Python 3 IDLE Shell within the Windows Start menu or via Finder.


    **STEP 3** For example, in the Shell: **2+2** After pressing Enter, the next line
    displays the answer: **4**. Basically, Python has taken the ''code'' and produced
    the relevant output.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_21_0.png)


    **STEP 2** The Shell is where you can enter code and see the responses and output
    of code you generated. This is a kind of sandbox, where you''re able to try out
    simple code and projects.


    **STEP 4** The Python Shell acts very much like a calculator, since code is basically
    a series of mathematical operations. Integers, which are the infinite sequence
    of numbers can be added, subtracted, multiplied and so on.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_21_1.png)


