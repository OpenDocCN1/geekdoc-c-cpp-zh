- md: "\n## C++ Fundamentals\n\n## Variables\n\nVariables differ slightly when using\
    \ C++ as opposed to Python. You can simply state that 'a' equals 10 and a variable\
    \ is assigned. However, in C++ a variable has to be declared with its type before\
    \ it can be used.\n\n## THE DECLARATION OF VARIABLES\n\nYou can declare a C++\
    \ variable by using statements within the code. There are several distinct types\
    \ of variables you can declare. Here is how it works.\n\n- STEP 1: Open a new,\
    \ blank C++ file and enter the usual code headers:\n- STEP 2: Start simple by\
    \ creating two variables, a and b, with having one value of 10 and the other 5.\
    \ You can use data type to declare these variables. In the curly brackets, enter:\n\
    - STEP 3: You can build and run the code but it won't do much, other than store\
    \ the values 10 and 5 to integers a and b. To output the contents of the variables,\
    \ add:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n{\n}\n\
    ```\n\n```cpp\ncout << a;\ncout << \"\\n\";\ncout << b;\n\n// The cout << \"\\\
    n\"; simply places a new line between the output of 10 and 5.\n```\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main()\n{\n    int a;\n    int\
    \ b;\n\n    a = 10;\n    b = 5;\n\n    cout << a;\n    cout << \"\\n\";\n    cout\
    \ << b;\n}\n```\n\n- STEP 4: Naturally you can declare a new variable, call it\
    \ result and output some simple arithmetic:\n\n```cpp\nint a;\nint b;\na = 10;\n\
    b = 5;\n```\n\n```cpp\nresult = a + b;\ncout << result;\n```\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\nint main()\n{\n    int a;\n    int b;\n  \
    \  int result;\n    a = 10;\n    b = 5;\n    result = a + b;\n    cout << result;\n\
    }\n```\n\nInsert the code as the screenshot.\n\n## STEP 5\n\nYou can assign a\
    \ value to a variable as soon as you declare it. The code you've typed in could\
    \ look like\n\n```cpp\nint a = 10;\nint b = 5;\nint result = a + b;\n\ncout <<\
    \ result;\n```\n\n## STEP 8\n\nThe previous steps create the variable StartLives,\
    \ which is a global variable. In a game, for example, a player's lives go up or\
    \ down depending on how well or bad they're doing. When the player restarts, the\
    \ StartLives returns to its default 3. Here we assigned 3 lives, subtracted 1,\
    \ leaving lives left:\n\n```\nC:\\User\\david\\Document\\C:\\Variables.cpp\nProcess\
    \ returned (0)  execution time : 0:00\nPress any key to continue.\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_68_0.png)\n\
    \n## STEP 9\n\nThe modern C++ compiler is far more intelligent than most programmers\
    \ give credit to. While there are numerous data types you can declare for variables,\
    \ you can also use the following feature:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nauto pi = 3.14159;\nint main()\n```\n\n## STEP 6\n\nSpecific\
    \ to C++, you can also use the following to assign values to a variable as soon\
    \ as you\n\n```cpp\nint a (10);\nint b (5);\n```\n\nThen, the C++2011 standard,\
    \ using curly braces:\n\n```cpp\n{a=b};\n```\n\n```cpp\ndouble area, radius =\
    \ 1.5;\narea = pi * radius;\ncout << area;\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_68_1.png)\n\
    \n## STEP 7\n\nYou can create global variables, which are variables that are declared\
    \ outside any function and used within the entire code. The code you've used so\
    \ far are local: variables used inside the function. For example:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint StartLives = 3;\n```\n\n```cpp\n\
    int main() {\n    StartLives = StartLives - 1;\n    cout << StartLives;\n}\n```\n\
    \n## STEP 10\n\nA couple of new elements here; first, one works until you go to\
    \ Settings -> Compiler and tick the box labeled 'C++11 Language Standard'. Then,\
    \ the new data type, double, which means double-precision point variable, C++11\
    \ will build and run the code. The result is 7.06858.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_68_2.png)\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_68_3.png)\n\n## C++ Fundamentals\n\n\
    ## Data Types\n\nVariables, as we've seen, store information that the programmer\
    \ can then call up, and manipulate if required. Variables are simply reserved\
    \ locations that store the values the programmer assigns, depending on the data\
    \ type used.\n\nThere are many different data types available for the programmer\
    \ in C++, such as integer, floating point, Boolean, character and so on. It is\
    \ widely accepted that there are seven basic types, often called Built-in Types;\
    \ however, you can create your own data types within the code. The seven basic\
    \ data types are incredibly accurate but those numbers are only accurate up to\
    \ the decimal place. There's also the problem when displaying such numbers in\
    \ C++ using the cout function, which by default outputs the first five decimal\
    \ places. You can combat this by adding cout.precision but you're still limited\
    \ by the accuracy of the double type. For example, try this:\n\n| TYPE | COMMAND\
    \ |\n| :--- | :--- |\n| Integer | int |\n| Floating Point | float |\n| Character\
    \ | char |\n| Boolean | bool |\n| Double Floating Point | double |\n| Wide Character\
    \ | wchar_t |\n| No Value | void |\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\ndouble PI = 3.1415926535897932386;\nint main() {\n    cout << PI;\n}\n\
    ```\n\n```cpp\n#include <iostream>\nusing namespace std;\ndouble PI = 3.1415926535897932386;\n\
    int main() {\n    cout << PI;\n}\n```\n\nThese basic types can also be extended\
    \ using the following modifiers: Long, Short, and Signed. This mostly means you\
    \ can expand the minimum and maximum range for each data type. For example, int\
    \ data type has a value range of -2147483648 to 2147483647, fair value would you\
    \ agree? Now, if you use one of the modifiers, the range alters:\n\n- unsigned\
    \ int = 0 to 4294967295\n- signed int = -2147483648 to 2147483647\n- unsigned\
    \ short = 0 to 65535\n- signed short = -32768 to 32767\n- unsigned long = -2147483648\
    \ to 2147483647\n- unsigned long = 0 to 4294967295\n\nNaturally, you can get away\
    \ with the basic type without the modifier, as there's plenty of range provided\
    \ with each data type. Considering programming practice to use C++ might help\
    \ you. There are issues when using these types though a double-floating point\
    \ value, which you can use for build the code and can see the result of 3.14159,\
    \ representing cout's limits in this example.\n\n```\nC:\\Users\\david\\Documents\\\
    C+-DataTypes.cpp\nProcess returned (0) execution time : 0.05s\nPress any key to\
    \ continue...\n```\n\nYou can also use the aforementioned cout.precision for greater\
    \ accuracy. Take precision the way up to 22 decimal places with the following\
    \ code:\n\n```cpp\n#include <iostream>\nusing namespace std;\ndouble PI = 3.1415926535897932386;\n\
    int main() {\n    cout.precision(22);\n    cout << PI;\n}\n```\n\nThis is mainly\
    \ due to the conversion from binary in the compiler and that the IEEE 754 double\
    \ precision standard occupies 64-bits of data, of which 52-bits are dedicated\
    \ to the significant digits in a floating-point number and roughly 3.5-bits are\
    \ taken values of 0 to 9, if you divide 53 by 3.5, then you arrive at 15.142857,\
    \ which is 15-digits. To be honest, if you are writing code that needs to be accurate\
    \ to more than fifteen decimal places, then you would not use C++, you would use\
    \ some scientific language with C++ as the connective tissue between the two languages.\n\
    \nYou can create any data types using an alias-like system called typedef.\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\ntypedef double PI = 3.1415926535897932386;\n\
    int main() {\n    cout.precision(22);\n    cout << PI;\n}\n```\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\ntypedef int metres;\n\nint main() {\n    metres\
    \ distance;\n    distance = 15;\n    cout << \"distance in metres: \" << distance;\n\
    }\n```\n\nAgain, build and run the code; as you can see from the command line\
    \ window, the number represented by PI is different when you use C++ as the variable.\
    \ The output reads the value of PI as 3.1428571428571285711, with the numbers\
    \ going away from the fifteenth decimal place.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_70_0.png)\n\
    \n## Scientific\n\n15.4285714285714285714288571\n\n```cpp\n#include <iostream>\n\
    using namespace std;\ntypedef int metres;\n\nint main() {\n    metres distance;\n\
    \    distance = 15;\n    cout << \"distance in metres: \" << distance;\n}\n```\n\
    \n| | HYP | F-E |\n| MC | MR | M+ | M- | MS |\n| x² | x³ | sin | cos | tan |\n\
