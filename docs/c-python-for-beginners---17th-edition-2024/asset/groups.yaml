  - '[PAGE 9]


    # Equipment You Will Need


    You can learn Python with very little hardware or initial financial investment.
    You don''t need an incredibly powerful computer and any software that''s required
    is freely available.


    # WHAT WE''RE USING


    Thankfully, Python is a multi-platform programming language available for Windows,
    macOS, Linux, Raspberry Pi and more. If you have one of those systems, then you
    can easily start using Python.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_9_0.png)


    # COMPUTER


    Obviously you''re going to need a computer in order to learn how to program in
    Python and test your code. You can use Windows (from XP onward) on either a 32
    or 64-bit processor, an Apple Mac or Linux installed PC.


    # AN IDE


    An IDE (Integrated Developer Environment) is used to enter and execute Python
    code. It enables you to inspect your program code and the values within the code,
    as well as offering features. There are many different IDEs available, so find
    the one that works for you and gives the best results.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_9_1.png)


    # PYTHON SOFTWARE


    macOS and Linux already come with Python preinstalled as part of the operating
    system, as does the Raspberry Pi. However, you need to ensure that you''re running
    the latest version of Python. Windows users need to download and install Python,
    we''ll cover shortly.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_9_2.png)


    # TEXT EDITOR


    Whilst a text editor is an ideal environment to enter code into, it''s not an
    absolute necessity. You can enter and edit code directly from the IDE but using
    a text editor, such as Sublime Text or Notepad++, offers more advanced features
    and colour coding when entering code.


    # INTERNET ACCESS


    Python is an ever evolving environment and as new versions often introduce new
    concepts or change existing and code structure to make it a more efficient language.
    Having access to the Internet will keep you up-to-date, help you when you get
    stuck and get access to Python''s immense number of modules.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_9_3.png)


    Despite what other books may lead you to believe, you won''t be a programmer in
    24-Hours. Learning to code Python takes time, and patience. You may become stuck
    at times and other times the code will flow like water. Understand you''re learning
    something entirely new, and yes you will get there.'
  - '[PAGE 10]


    # THE RASPBERRY PI


    Why use a Raspberry Pi? The Raspberry Pi is a tiny computer that''s very cheap
    to purchase but offers the user a fantastic learning platform. Its main operating
    system, Raspian, comes preinstalled with the latest Python with many Modules and
    extras.


    # RASPBERRY PI


    The Raspberry Pi 5 is the latest version, incorporating a more powerful CPU, more
    memory, Wi-Fi and Bluetooth support. You can pick up a Pi 5 for around £59 or
    as part of a kit depending on the Pi model you''re interested in.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_10_0.png)


    # FUZE PROJECT


    The FUZE is a learning environment built on the latest model of the Raspberry
    Pi. You can purchase the workstations that come with an electronics kit and even
    a robot arm for you to build and program. You can find more information on the
    FUZE at www.fuze.co.uk.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_10_1.png)


    # BOOKS


    We have several great coding titles available via www.pcplublications.com. Our
    books cover how to buy your first Raspberry Pi, how to set up and use it; there
    are also some step-by-step examples and guides to get the most from the Raspberry
    Pi too.


    # RASPBIAN


    The Raspberry Pi''s main operating system is a Debian-based Linux distribution
    that comes with everything you need in a simple to use package. It''s streamlined
    for the Pi and an ideal platform for hardware and software projects, Python programming
    and even as a desktop computer.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_10_2.png)


    ![](img/bb949c7c28c27d6124a761521ffcfb43_10_3.png)


    ![](img/bb949c7c28c27d6124a761521ffcfb43_10_4.png)'
  - '[PAGE 11]


    # Say Hello to Python


    # Getting to Know Python


    Python is the greatest computer programming language ever created. It enables
    you to fully harness the power of a computer, in a language that is clean and
    easy to understand.


    # WHAT IS PROGRAMMING?


    It helps to understand what a programming language is before you try to learn
    one, and Let''s take a look at how Python can help and how it relates to other
    languages.


    # PROGRAMMING RECIPES


    Recipes are like programs for computers.


    Put 100 grams of self-raising flour in a bowl. Add 100 grams of butter to the
    bowl. Bake for half an hour.


    # CODE


    Just like a recipe, a program consists of instructions that you follow in order.
    A program that describes a cake might run like this:


    ```

    bowl = []

    flour = 100

    butter = 50

    milk = 100

    bowl.append([flour,butter,milk])

    cake(bowl)

    ```


    A programming language is a list of instructions that a computer follows. These
    instructions can be as simple as a recipe or playing a music file, or as complex
    as building a whole world. Python is a language conceived in the 1980s by Guido
    van Rossum at Centrum University & Research in the Netherlands as a successor
    to the ABC language.


    Guido van Rossum, the father of Python.


    # PROGRAM COMMANDS


    You might not understand some of the Python commands, like bowl.append and cake(bowl).
    The first is list, the second; we''ll look at both in this book. The main thing
    to know is it''s easy to read commands in Python. Once you learn the commands,
    you can figure out how a program works.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_11_0.png)'
  - '[PAGE 12]


    # HIGH-LEVEL LANGUAGES


    Computer languages that are easy to read are known as "high-level". This is because
    they fly high above the hardware (also referred to as "the metal"). Languages
    that "fly to the metal," like Assembly, are known as "low-level". Low-level languages
    commands read with msg de - len equ $ - mid -


    ![](img/bb949c7c28c27d6124a761521ffcfb43_12_0.png)


    # ZEN OF PYTHON


    ![](img/bb949c7c28c27d6124a761521ffcfb43_12_1.png)


    # PYTHON 3 VS PYTHON 2


    In a typical computing scenario, Python is complicated by the existence of two
    versions of the language: Python 2 and Python 3.


    # WORLD OF PYTHON


    When you visit the Python Download page you''ll notice there are two options:
    one for Python 3.6.2 and the other for Python 2.7; correct at the time of writing
    (remember Python 2 is frequently updated so you may see different version numbers).


    # Download the latest version for Windows


    +   - Download Python 3.7.3 Download Python 2.7.18


    Wondering which one to use? Here means the difference between Python 2 and 3.

    Looking for a different OS? Python for Windows, Linux, macOS or other.

    Want to help test new versions of Python? Pre releases


    # PYTHON 3.X


    In 2008 Python arrived with several new and enhanced features. These features
    provide a stable, efficient and powerful programming environment (most if not
    all of these features are not popular). Not at first, Python 3 has become the
    leading edge of Python programming.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_12_2.png)


    ```

    python 3.6.1 [v3.6.1:06a6b1af4, Clang Dec 17 2017, 17:54:57) (MSC v1900 32 bit
    (Intel))

    Intel x86 on linux

    >>> print(''credit'' or ''license'') for more information.

    >>> The Zen of Python, by Tim Peters

    >>> Beautiful

    ```


    # 3.X WINS


    Python 3''s popularity has matured that it''s now prudent to start development
    with the new features and begin to phase out previous version. Many development
    companies, such as SpaceX and NASA use Python 3 for snippets of important code.


    # PYTHON 2.X


    So why two? Python 2 was launched in 2000 and has since adopted a large collection
    of modules, scripts, tutorials and so on. Over the years, Python 2 has become
    the first one of so good programming languages for Beginners and experts to code
    in, which makes it an extremely valuable resource.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_12_3.png)


    ```

    python 3.7.13 [v3.7.13:a654b1af,, Oct 16 2018, 20:41:59) (MSC v1900 32 bit (Intel)

    Intel x86 on linux

    >>> print(''copyright'', ''credit'' or ''license'') for more information.)

    ```'
