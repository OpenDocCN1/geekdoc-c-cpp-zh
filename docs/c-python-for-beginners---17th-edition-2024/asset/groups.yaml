    \n## LINUX++\n\n如果你不熟悉 Linux，我们建议查看我们 BDM Publications 系列中的 Linux 相关书目。如果你有树莓派，下面的命令完全适用，在本示例中我们使用的是\
    \ Linux Mint。\n\n- 第 1 步：第一步是确保 Linux 已为你的 C++ 代码准备就绪，检查系统和软件是否为最新。打开终端并输入：`sudo\
    \ apt-get update && sudo apt upgrade`。按回车并输入密码。这些命令将更新整个系统和任何已安装软件。\n\n- 第 2 步：大多数\
    \ Linux 发行版都预装了 C++ 开发所需的所有必要组件；不过，值得检查是否所有组件都齐全。在终端中输入：`sudo apt-install build-essential`\
    \ 并按回车。如果你已经拥有正确的组件，则不会安装任何内容；如果你缺少它们，该命令将为你安装。\n\n- 第 3 步：令人惊讶的是，就是这样。一切都已准备好让你开始编码了。这里是运行你的首个\
    \ C++ 程序的方法。在 Linux 中，主文本编辑器是 Xed，你可以通过点击菜单并在搜索栏输入 Xed 来启动它。点击右面板中的“文本编辑器”打开它。\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_53_0.png)\n\n- 第 4 步：在 Xed 或你可能使用的任何其他文本编辑器中，输入构成\
