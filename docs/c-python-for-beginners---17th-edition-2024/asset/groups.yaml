    \n## 第 8 步\n\n在执行 C++ 文件之前，你需要对它进行编译。Linux 附带了 g++，如果你现在与 C++ 文件在同一个文件夹中，在终端中输入：`g++\
    \ helloworld.cpp` 并按回车。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_54_1.png)\n\
    \n## 第 6 步\n\n首先注意到的是，Xed 会自动识别出这是一个 C++ 文件，因为文件扩展名现在已设置为 .cpp。代码中出现了高亮，如果你打开文件管理器，还可以看到它上面盖有\
    \ C++ 图标。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_54_2.png)\n\n## 第 9 步\n\n\
    g++ 编译代码需要很短的时间，但只要你创建的代码没有错误或异常，你就创建了一个新文件。如果你将其输入终端，你可以看到它在你的 C++ 文件旁边生成了。\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_54_3.png)\n\n## 第 7 步\n\n当你输入代码后，在你的\
    \ C++ 文件旁边你可以看到它生成了。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_54_4)\n\n## 第\
    \ 10 步\n\n通过 g++ 编译你的输出文件。在终端中使用 C++  编译：`g++ helloworld.cpp`。屏幕上出现了“Hello World”。\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_54_5.png)\n\n## 其他需要安装的 C++ IDE\n\n\
    如果你想尝试一种不同的 C++ 工作方法，有很多选项供你选择。\n\n## 开发 C++\n\n这里有十种值得关注的 C++ IDE。你可以安装其中一个或全部，找到适合你的那一个。\n\
    \n- ECLIPSE：Eclipse 是 Windows、Mac 和 Linux 上非常流行的 IDE。它功能丰富且易于使用。\n\n- CODELITE：CodeLite\
    \ 是一个适用于 Windows、Mac 和 Linux 的轻量级 IDE。它界面简洁并定期更新。\n\n- GNAT：GNAT 是一个适用于 Windows、Mac\
    \ 和 Linux 的强大 IDE。它配备了高级编辑器和调试器。\n\n- NETBEANS：NetBeans 是 Windows、Mac 和 Linux\
    \ 上非常流行的 IDE。它提供了许多功能且免费使用。\n\n- VISUAL STUDIO：微软的 Visual Studio 是一个适用于 Windows\
    \ 的强大 IDE。社区版对个人开发者免费。\n\n- ANJUTA：Anjuta 是一个仅限 Linux 的 IDE，具有 GUI 设计器、源码编辑器和集成调试器。\n\
    \n- QT CREATOR：Qt Creator 是一个为桌面和移动环境设计的跨平台 IDE。它带有高级编辑器和集成工具。\n\n- MONODEVEL：Monodevel\
    \ 是一个适用于所有主要平台的桌面和 Web 应用的优秀 IDE。它具有高级编辑器和调试器。\n\n- DEV C++：Bloodshed Dev++ 是一个\
    \ Windows 系统的 IDE。许多用户对其简洁界面和独特的编码方式推誉有加。\n\n- U++：Ultimate++ 是一个跨平台 IDE，通过智能且优雅的功能加速代码开发。对于初学者来说，它有点复杂，但其复杂性背后是美感。\n\
    \n"
