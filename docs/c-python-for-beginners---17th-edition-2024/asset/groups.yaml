    # # Your First C++ Program


    You may have Followed the Mac and Linux examples previously but you''re going
    to be working exclusively in Windows and Code::Blocks from here on. Let''s begin
    by writing your first C++ program and taking the first step into a larger coding
    world.


    # ## HELLO, WORLD!


    it''s traditional in programming for the first code to be entered into the words
    ''Hello, World!'' to the screen. Interestingly, this dates back to 1968 using
    a language called BCPL.


    +   **STEP 1** As mentioned, we''re using Windows 10 and the latest version of
    Code::Blocks for the rest of the C++. Begin by launching Code::Blocks. When open,
    click on File -> New -> Empty File or press Ctrl+SHIFT+N on the keyboard.


    +   **STEP 3** At the moment it doesn''t look like much, and it even makes less
    sense, but we''ll get to that in course. Now click on File -> Save As. Create
    or find a suitable location on your hard drive and find in the Name box, call
    it hell.cpp. Click the Save as type box and select C/C++ files. Click the Save
    button.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_59_0.png)


    +   **STEP 2** You can now see a blank screen, with the labelled ''Untitled1'',
    and the number in the top left of the main window: Code::Blocks. Begin by clicking
    in the main window, the cursor is next to the next one, and entering:

