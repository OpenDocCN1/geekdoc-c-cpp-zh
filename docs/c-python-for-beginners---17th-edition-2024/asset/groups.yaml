    \ \" is \" + str(age))\nDavid Howard is 44 years old.\nDavid Howard Descended\
    \ from Vikings\n>>> print(name, \"is,\" age, \"years old.\")\nDavid Howard,44\
    \ years old.\n```\n\n类型的使用在处理浮点运算（带有小数点的数字）时也非常重要。例如：\n\n```\n19.99\n```\n\n现在输入\
    \ (float) 你会发现 Python 将该数字分配为 'float'，它包含小数点。\n\n```\nEdit Shell Debug Options\
    \ help\nPython 3.2 (default, Oct 19 2014, 13:01:11)\nGCC 4.9.0 on linux\n>>> type(\"\
    credits\" or \"license\") for more information.\n>>> age = input(\"how old are\
    \ you?\")\n19.99\n>>> type(age)\nclass 'str'\n>>> float(age)\nclass 'float'\n\
    ```\n\n第 7 步 类型转换的另一个例子是你从用户那里输入，例如：\n\n```\nenter:\nage = float(input(\"how old\
    \ are you?\"))\n```\n\n所有输入数据都是字符串变量。\n\n第 10 步 当组合整数和浮点数时，Python 通常会将浮点转换为返回\
    \ 结果。当组合两个整数时，Python 将总是向下取整到最近的整数，称为截断（truncated）；在我们的情况下，19.99 变成了 20。\n\n```\n\
    Edit Shell Debug Options help\nPython 3.2 (default, Oct 19 2014, 13:01:11)\nGCC\
