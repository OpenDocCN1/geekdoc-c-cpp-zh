  - '[PAGE 48]


    # OS SPECIFIC NEEDS


    C++ will work in any operating system but getting all the necessary pieces together
    can be confusing to a newcomer. Here are some OS specifics for C++.


    # LINUX


    Linux users are lucky in that they already have a compiler and text editor built
    into their operating system. Any text editor allows you to type out C++ code,
    when it is saved with a .cpp extension, use g++ to compile it.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_0.png)


    # WINDOWS


    We have mentioned previously that a good IDE is Microsoft''s Visual Studio. However,
    a better IDE and compiler is Code::Blocks, which is regularly kept up to date
    with a new release every year. Otherwise Windows users can enter their code in
    Notepad++, then compile it with MinGW as used by Code::Blocks.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_1.png)


    # RASPBERRY PI


    The Raspberry Pi''s operating system is Raspberry, which is Linux based. Therefore,
    you''ll be able to write your code out using a text editor, then compile it with
    g++ as you would in any other Linux distro.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_2.png)


    # MAC


    Mac owners will need to download and install XCode to be able to compile their
    C++ code natively. Other options for the MAC include Netbeans, Eclipse or Code::Blocks.
    Note: the latest Code::Blocks isn''t available for Mac due to a lack of Mac developers.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_3.png)


    www.pclpublications.com 49'
