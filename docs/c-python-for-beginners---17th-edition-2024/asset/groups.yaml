    ```\n#include <iostream>\n\nint main()\n{\n    // My first C++ program\n    std::cout\
    \ << \"Hello World!\\n\";\n}\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_53_1.png)"
