    # 操作系统特定需求


    C++ 可以在任何操作系统上运行，但对于初学者来说，将所有必要的组件整合在一起可能会令人困惑。以下是 C++ 的操作系统特定说明。


    ## LINUX


    Linux 用户是幸运的，因为他们的操作系统中已经内置了编译器和文本编辑器。任何文本编辑器都可以让你编写 C++ 代码，当将其保存为 .cpp 扩展名时，使用
    g++ 进行编译即可。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_0.png)


    ## WINDOWS


    我们之前提到过，一个很好的 IDE 是微软的 Visual Studio。然而，更好的 IDE 和编译器是 Code::Blocks，它每年都会发布新版本以保持更新。否则，Windows
    用户可以在 Notepad++ 中输入他们的代码，然后像 Code::Blocks 那样使用 MinGW 对进行编译。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_1.png)


    ## RASPBERRY PI (树莓派)


    树莓派的操作系统是 Raspberry，它是基于 Linux 的。因此，你将可以使用文本编辑器编写代码，然后像在其他 Linux 发行版中一样使用 g++
    进行编译。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_2.png)


    ## MAC


    Mac 所有者需要下载并安装 XCode 才能原生编译他们的 C++ 代码。MAC 的其他选项包括 Netbeans、Eclipse 或 Code::Blocks。注意：由于缺乏
    Mac 开发人员，最新的 Code::Blocks 不适用于 Mac。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_3.png)


    ## 如何在 Windows 中设置 C++


    在 C++ 编程方面，Windows 用户有丰富的选择。有许多 IDE 和编译器可用，包括微软的 Visual Studio。然而，在我们看来，开始学习的最佳
    C++ IDE 是 Code::Blocks。


    ### CODE::BLOCKS


    Code:Blocks 是一个免费的 C++ 和 Fortran IDE，功能丰富且易于通过插件扩展。它易于使用，自带编译器，并且背后有一个活跃的社区。


    - **第 1 步** 访问 Code:Blocks 下载网站：www.codeblocks.org/downloads。从那里，点击“Download the
    binary releases”链接获取 Windows 的最新可下载版本。

    - **第 2 步** 你可以看到有几个版本可用。人们可能想要下载当前版本号“mingw-setup.exe”。在编写本文时版本为：code::blocks-17.12-mingw-setup.exe。区别在于
    mingw-setup 包含了 GCC（一个编译器套件）的 C++ 编译器和调试器。

    - **第 3 步** 找到文件后，点击行末的 Sourceforge.net 链接，会出现下载通知窗口；点击 Save File 开始下载并将执行文件保存到你的
    PC 上。找到下载好的 Code::Blocks Installer 并双击启动。按照屏幕上的指示开始安装。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_49_0.png)


    - **第 4 步** 一旦你同意许可条款，就有多种安装选项可供。你可以选择较小的安装，缺少一些组件，但我们建议你默认选择 Full（完整）选项。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_49_1.png)


    ### 第 5 步

    为 Code:Blocks 文件选择安装位置。这是你的选择，但通常默认值就了，除非你有任何特殊要求。当你点击 Next 时，安装程序开始；如果弹出完成通知且你想现在启动
    Code:Blocks，现在就点是。


    ### 第 8 步

    在启动 Code:Blocks 之前，有必要解释一下为什么你需要编译器。编译器是一个独立的程序，它读取 C++ 代码并根据最新的编程标准对其进行检查；这就是为什么你需要最新可用的编译器。目前是
    C++11。


    ```

    Code shortcut: C:\Users\David\AppData\Roaming\Microsoft\Windows\Start Menu\

    ```


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_0.png)


    ### 第 6 步

    Code:Blocks 第一次运行时将自动检测你系统中可能安装的任何 C++ 编译器。如果没有，选择第一个检测到的选项 GCC Compiler，并点击 Default
    将其设置为你的系统编译器。准备好后点击 OK。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_1.png)


    ### 第 9 步

    本质上，计算机工作并理解的是二进制。机器语言对人类来说并不高效。例如，要在屏幕上输出你的 "Hello"，将以二进制形式出现：

    ```

    01001000 01101001 01101100 01101100 01101111 00100000

    01100111 01101111 01110010 01101100 00100000

    01111111 01101111 01110010 01101100 01100100

    01100101 01101111 01110100 01100100 00100000

    01100101 01101110 01110101 01101110 01100000

    01100111 01101111 01110100 01100100 00100000

    01100111 01101111 01110100 01101100 00100000

    01100111 01101111 01110010 01101100 00100000

    01110101 01101110 01110101 01101110 01100000

    01110101 01101111 01110100 01101100 00100000

    01110111 01101111 01110100 01101101 00100000

    01110111 01101111 01110100 01101101 00100000

    01110111 01101111 01110100 01101101 00100000

    01110111 01101111 01110101 01101100 00100000

    ```

    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_2.png)


    ### 第 7 步

    当程序启动时会出现另一个消息，显示 Code:Blocks 目前不是默认 C++ 编译器。你有几个选项保持原样或允许关联。我们再次建议选择最后一项以将 Code:Blocks
    关联到支持的类型。


    ### 第 10 步

    编译器将你输入的任何内容视为 C++ 代码并将其翻译成机器码，“构建”代码，检查错误，然后通过标准化并使用 0 和 1 让计算机执行。当你停止思考它时，它是相当聪明的。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_3.png)


    ## 如何在 Mac 上设置 C++


    要在 Mac 上编写 C++ 代码，首先需要安装 Xcode。这是一个免费的全功能 IDE，设计用于创建原生应用。然而，你也可以轻松地使用它来创建 C++
    代码。


    ### Xcode


    Apple 的 Xcode 主要设计供用户使用 Swift 和 Objective-C 开发 macOS、iOS、tvOS 和 watchOS 应用，但你也可以使用它。


    - **第 1 步** 通过打开 Mac 上的 App Store：苹果菜单 -> App Store。在搜索框中输入“Xcode”并回车。App Store
    窗口中有很多建议，但你需要点击第一个选项 Xcode。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_51_0.png)


    - **第 2 步** 花一点时间浏览应用程序的信息，包括兼容性，确保你拥有正确的 macOS 版本。Xcode 需要 macOS 10.12.6 或更高版本才能安装和运行。


    - **第 3 步** 准备好后，点击 Get 按钮，然后变为 Install App。输入你的 Apple ID，Xcode 开始下载并安装。这取决于你互联网连接的速度。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_51_1.png)


    - **第 4 步** 安装完成后，点击 Open 按钮启动 Xcode。点击 Agree 同意许可条款并输入密码允许 Xcode 更改系统。完成后，Xcode
    开始安装额外组件。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_51_2.png)


    ![](img/bb949c7c28c27d6124a761521ffcfb43_51_3.png)


    - **第 5 步** 所有内容（包括额外组件）安装完成后，Xcode 启动，显示版本号以及三个选项和你你工作过的任何项目；但对于全新安装，这里是空白。


    - **第 6 步** 从点击 New Xcode Project 开始；这将打开一个窗口选择你正在开发代码的项目。点击 macOS 标签页，然后点击 Command
    Line Tool 选项。点击 Next 继续。


    - **第 7 步** 填写各种字段，但确保底部的 Language 选项设置为 C++；从下拉列表中选择它。当你填完字段并确保 C++ 是所选语言时，点击
    Next 按钮继续。


    - **第 8 步** 下一步要求为所有未来的操作创建一个 Git 仓库。在 Mac 上选择一个位置或网络位置，并点击 Create。完成所有这些后，你就可以开始代码了。左侧面板列出了你编写的
    C++ 程序使用的文件。点击列表中的 main.cpp 文件。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_2.png)


    - **第 9 步** 你可以看到 Xcode 为你完成了一个基础的 Hello World 项目。虽然现在可能还没有意义，但随着你的学习你会发现更多，这些只是
    Xcode 在 Mac 上的利用。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_52_1.png)


    - **第 10 步** 当你想运行代码时，点击 Product > Run on Mac。你可以启用开发者模式，无需每次会话都需要密码。当程序执行时，输出将显示在
    Xcode 窗口的底部。


    ![](img/bb949c7c28c27d6124a761521ffcfb43_52_2.png)


    ![](img/bb949c7c28c27d6124a761521ffcfb43_52_3.png)


