    .cpp the extension), Click Save to continue.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_54_0.png)


    # STEP 8


    Before you execute the C++ file you need to compile it. In Linux it''s come with
    g+, and if you''re now in the same folder as the C++ file, enter: g helloworld.cpp
    in the Terminal and press Return.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_54_1.png)


    # STEP 6


    The first thing to notice is that Xed automatically recognises this as a C++ file,
    since the file extension is now set to .cpp. The colouring is present in the code
    and if you open the file manager you can also see that there''s icon C stamped
    on it.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_54_2.png)


    # STEP 9


    It takes a short time while the code is compiled by g+ but providing there are
    no mistakes or errors in the code you have created a new file. If you enter it
    into the Terminal you can see alongside your C++ file it is out.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_54_3.png)


    # STEP 7


    With your code now saved, drop into the Terminal again. You need to navigate to
    the folder of the C++ file you''ve just saved. Our example is in the Documents
    folder, so we can go to it by entering cd Documents. Remember, the Linux Terminal
    is case sensitive, so any commands must be entered correctly.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_54_4.png)


    # STEP 10


    A out is compiled C++. To run the code: ./a and press Return. The words ''Hello
    World'' appear on the screen. However, a out isn''t very friendly. To name something
    else, you can recompile with: g helloworld.cpp -o helloworld. This creates an
    output file which can be run by: ./helloworld.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_54_5.png)'
  - '[PAGE 55]


    # Other C++ IDEs to Install


    If you want to try a different approach to working with your C++ code, there are
    plenty of options available to you. Windows is the most prolific platform for
    C++ IDEs but there are plenty for Mac and Linux users too.


    # DEVELOPING C++


    Here are ten C++ IDEs that are worth looking into. You can install one or all
    of them if you like, but find the one that works for you.


    ECLIPSE is a hugely popular C++ IDE that offers the programmer a wealth of features.
    It has a great, clean interface, is easy to use and available for Windows, Linux
    and Mac. Head over to www.eclipse.org/downloads/ to download the latest version.
    If you''re stuck, click the Help link for more information.


    CODELITE is free and open source IDE''s regularly updated and available for Windows,
    Linux and macOS; it is lightweight, uncomplicated and extremely powerful. You
    can find more information as well as how to download and install it at www.codelite.org/


    ![](img/bb949c7c28c27d6124a761521ffcfb43_55_0.png)


    GNAT The GNAT Programming Studio is a powerful and intuitive IDE that supports
    developing, debugging and code analysis. The Community Edition is free, whereas
    the Pro version costs; the Community Edition is available for Windows, Mac Linux
    and the Raspberry Pi. You can find it at www.adatore.com/download.


    NETBEANS Another popular choice is NetBeans. This is another excellent IDE that''s
    packed with features and plenty to use. NetBeans IDE includes project based features
    for C++ that gives you the ability to build applications with dynamic and static
    libraries. Find out more at www.netbeans.org/features/cpp/index.html.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_55_1.png)'
  - '[PAGE 56]


    # VISUAL STUDIO


    Microsoft''s Visual Studio is a mammoth C++ IDE that allows you to create applications
    for Windows, Android, iOS and the web. The Community version is free to download
    and install but the other versions offer a free trial period. Go to visualstudio.com
    to see what it can do.


    # ANJUTA


    The AnjutaDevStudio is a Linux-only IDE that features some of the advanced features
    you would normally find in a paid software development studio. There''s a GUI
    designer, source editor, app wizard, interactive debugger and much more. Go to
    www.anjuta.org/ for more information.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_56_0.png)


    # QT CREATOR


    This cross-platform IDE is designed to create C++ applications for desktop and
    mobile environments. It comes with a code editor and integrated tools for testing
    and debugging, as well as support for many chosen platforms. It is free but there
    is a trial period on offer requiring much: qt.io/qt-libraries-apis-tools-and-ide.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_56_1.png)


    # MONODEVEL


    This excellent# IDE allows you to write desktop and web applications across all
