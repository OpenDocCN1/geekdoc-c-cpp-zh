    \ 添加到环境变量”、“预编译标准库以及为所有用户选项。这将让以后使用 Python 变得简单得多。准备好后点击“安装”。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_13_2.png)\n\
    ![](img/bb949c7c28c27d6124a761521ffcfb43_13_3.png)\n![](img/bb949c7c28c27d6124a761521ffcfb43_13_4.png)\n\
