    \ bar. Click on the Text Editor in the right-hand panel to open it.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_53_0.png)\n\
    \n+   STEP 2 Most Linux distros come preinstalled with all C++; the necessary\
    \ components to start coding; however, it's worth checking to see if everything\
    \ is present. Still within the terminal: sudo apt-install build-essential and\
    \ press Return. If you have the right components nothing is installed; if you're\
    \ missing them they are installed by the command.\n\n+   STEP 4 In Xed, or any\
    \ other text editor you may use, to enter the lines of code that make your C++\
