    - **STEP 1**: First, open the IDLE Shell and when it''s up, click File > New File.
    This will open a new window with Untitled as its name. This is the IDLE editor
    and within it you can enter the code you need to create future programs.

    - **STEP 2**: The IDLE Editor is, for all intents and purposes, a simple text
