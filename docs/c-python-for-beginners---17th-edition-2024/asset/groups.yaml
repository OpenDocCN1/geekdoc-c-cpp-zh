    # 向 Python 问好


    有许多不同的编程语言可以学习和使用。有些复杂且极其强大，而有些则非常基础，用作操作系统的微型工具。Python 处于两者之间，结合了易用性与强大的功能支持，允许用户创建微型工具、一系列出色的游戏以及性能密集型的计算任务。


    然而，Python 的意义远不仅仅是作为另一种编程语言。它的背后有一个充满活力且极其活跃的社区，他们分享知识、代码和项目想法，以及为未来的版本修复漏洞。正是有了这个社区，这门语言才成长并繁荣，现在轮到你投身其中学习如何用
    Python 编程了。本书的前半部分帮助你从最新版本的 Python 开始，并从此指导你如何使用该语言最常用且有趣的特性。不久之后，你就能编写自己的实用工具、文字冒险游戏，甚至控制字符在屏幕上移动。


    # 为什么选择 Python？


