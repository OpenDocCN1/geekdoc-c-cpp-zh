    \n# 第 10 步\n\n替换 cout 行下的分号，在你的代码中添加新行：\n\n```cpp\ncout << \"And greetings from\
    \ C++\\n\";\n```\n\n`\\n` 会在输出文本的最后一行下方添加新行。构建并运行代码，显示你的硬件输出。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_64_3.png)\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_64_4.png)\n\n# C++ 基础\n\n# 使用注释\n\n\
    虽然对于构成游戏、应用程序甚至操作系统的数万行代码来说，注释似乎是微不足道的，但实际上，它们可能是最重要的因素之一。\n\n# 注释的重要性\n\n代码内部的注释是人类可读的描述，详细说明了代码在特定点正在执行的操作。它们看起来并不重要，但如果没有代码注释，它将成为许多令人沮丧的领域之一，除非你是专业人士或是初学者。\n\
    \n简而言之，对代码的注释方式应该能够有效地描述某行、某个部分或单个元素的用途。你应该养成尽可能多注释的习惯，这样一个完全不懂编程的人也可以通过阅读你的代码来理解它。\n\
    \n在专业环境中，注释对于代码和公司的成功至关重要。在组织中，程序员与工程师、其他开发者和分析师团队一起工作。如果你是维护软件团队的一员，你的注释可以在出现问题时帮助团队，让另一个团队成员能够接手并追溯线索。\n\
    \n把自己置于某人的立地，他的工作是找出你的程序出了什么问题。对于超过 800,000 行代码，你可能扫描不同的模块，并需要原始程序员通过良好的注释提供一点帮助。\n\
    \n> 最好的注释总是能够连接并关联代码，详细说明程序运行到某行或某部分时发生了什么。你不需要对每一行进行注释。类似 `x=0` 这样的代码不需要你注释“如果\
    \ x 等于零则执行某些操作”：这对读者来说是显而易见的。然而，如果等于零是会给用户程序带来剧变的事情，就像你用尽了行数，那么它确实需要注释。\n\n即使是你打算与他人公开分享它。这样你就可以记住并始终理解你做了什么，在哪里犯了错，或者哪些部分运行得非常出色。\n\
    \n一旦你理解了在需要时添加注释，注释就是一种良好的实践，即使它是你的秘密。\n\n- 游戏起点\n\n```text\nDEFS 2C0,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z,2B0a,2B0b,2B0c,2B0d,2B0e,2B0f,2B0g,2B0h,2B0i,2B0j,2B0k,2B0l,2B0m,2B0n,2B0o,2B0p,2B0q,2B0r,2B0s,2B0t,2B0u,2B0v,2B0w,2B0x,2B0y,2B0z\n\
