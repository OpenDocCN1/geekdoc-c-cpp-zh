    # # How to Set Up C++ in Windows


    Windows users have a wealth of choice when it comes to programming in C++. There
    are plenty of IDEs and compilers available, including Visual Studio from Microsoft.
    However, in our opinion, the best C++ IDE to begin with is Code::Blocks.


    # ## CODE::BLOCKS


    Code:Blocks is a free C++, and Fortran IDE that feature rich and easily extensible
    with plug-ins. It''s easy to use, comes with a compiler and a vibrant community
    behind it.


    +   **STEP 1** By visiting the Code:Blocks download site, at www.codeblocks.org/downloads.
    From there, click on the ''Download the binary releases'' link to be to the latest
    downloadable version for Windows.


    +   **STEP 3** When you have located the file, click on Sourceforge.net link at
    the end of the line and a download notification window appears; click Save File
    to start the download and save the executable to your PC. Locate the downloaded
