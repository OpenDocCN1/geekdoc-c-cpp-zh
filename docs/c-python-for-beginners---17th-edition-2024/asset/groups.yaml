    \n## C++ 基础\n\n## 数据类型\n\n正如我们所见，变量存储了程序员随后可以调用并在需要时处理的信息。变量仅仅是预留的位置，根据所使用的数据类型来存储程序员分配的值。\n\
    \nC++ 中为程序员提供了许多不同的数据类型，例如整数、浮点数、布尔值、字符等。人们广泛认为有七种基础类型，通常称为内置类型；但你可以在代码中创建自己的数据类型。这七种基础类型非常精确，但仅到小数点后五位。当\
    \ C++ 中使用 `cout` 函数显示此类数字时也存在问题，因为它默认输出前五位。你可以通过添加 `cout.precision` 来解决这个问题，但仍然受限于\
    \ `double` 类型的精度。尝试这个：\n\n| 类型 | 命令 |\n| :--- | :--- |\n| 整数 | int |\n| 浮点数 |\
    \ float |\n| 字符 | char |\n| 布尔值 | bool |\n| 双精度浮点 | double |\n| 宽字符 | wchar_t\
    \ |\n| 空类型 | void |\n\n```cpp\n#include <iostream>\nusing namespace std;\ndouble\
    \ PI = 3.141592653589732386;\nint main() {\n    cout << PI;\n}\n```\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\ndouble PI = 3.141592653589732386;\n\
    int main() {\n    cout << PI;\n}\n```\n\n这些基础类型可以使用以下修饰符 Long、Short 和 Signed 进行扩展。这意味着你可以扩展每个数据类型的最小值范围。例如，int\
    \ 类型的范围是 -2147483648 到 2147483647，如果你使用修饰符，范围变为：\n\n- unsigned int = 0 到 4294967295\n\
    - signed int = -2147483648 到 2147483647\n- unsigned short = 0 到 65535\n- signed\
