    \ age, \"years old.\")\n```\n\nNotice that in the latter, you don't need space\
    \ between the words and commas as the comma treats each argument separately.\n\
    \n```\n>>> print(name, age)\nTraceback (most recent last):\n  File \"<input>\"\
    , line 1, in <module>\nTypeError: Can't convert 'int' object to str\n>>> print(name,\
    \ \" is \" + str(age) + \" years old.\")\nDavid Howard is 44 years old.\nDavid\
    \ Howard Descended from Vikings\n>>> print(name, \"is,\" age, \"years old.\")\n\
    David Howard,44 years old.\n```\n\nThe use of TypeC is also important when dealing\
    \ with floating arithmetic; numbers that have a decimal point. For example:\n\n\
    ```\n19.99\n```\n\nNow enter (float) and you'll see that Python has allocated\
    \ the number as a 'float', which contains a decimal point.\n\n```\nEdit Shell\
    \ Debug Options Windows help\nPython 3.2 (default, Oct 19 2014, 13:01:11)\nGCC\
    \ 4.9.0 on linux\n>>> type(\"credits\" or \"license\") for more information.\n\
    >>> age = input(\"how old are you?\")\n19.99\n>>> type(age)\nclass 'str'\n>>>\
    \ float(age)\nclass 'float'\n```\n\nSTEP 7 Another example of TypeCasting is when\
    \ you input from the user, such as for example:\n\n```\nenter:\nage = float(input(\"\
    how old are you?\"))\n```\n\nAll data stored from the input is a string variable.\n\
    \nSTEP 10 When combining integers and a float, Python usually converts the float\
    \ tos worth returning the Python result. When combining two integers, Python will\
    \ always round down to the nearest integer, called truncated; in our case of 19.99\
    \ it becomes 20.\n\n```\nEdit Shell Debug Options Windows help\nPython 3.2 (default,\
    \ Oct 19 2014, 13:01:11)\nGCC 4.9.0 on linux\n>>> type(\"credits\" or \"license\"\
    ) for more information.\n>>> age = 44\n>>> age + 19.99\n63.99\n```\n[/content]\n"
  mdcn: "\n# 使用注释\n\n当你编写代码时，代码的流程、每个变量将操作什么以及对什么操作都在你的脑海中。另一个程序员可以逐行阅读代码，但随着时间的推移，它可能会变得难以阅读。\n\
