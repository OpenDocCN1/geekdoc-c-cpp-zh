  mdcn: "\n\n# 如何在 Windows 上安装 Python\n\nWindows 用户可以通过 Python 官方下载页面轻松安装最新版本的 Python。虽然大多数经验丰富的\
    \ Python 开发者可能不会将 Windows 作为其代码的首选平台，但对于初学者来说，这是一个理想的起点。\n\n## 安装 Python 3.X\n\
    \nMicrosoft Windows 默认不预装 Python，因此你需要手动安装。坦率说，这个过程非常简单：\n\n- **步骤 1** 首先打开网页浏览器访问\
    \ www.python.org/downloads/；寻找 Python 3.x 的下载按钮（在此例为 3.6.2，但你稍后可能会看到更高版本）。\n-\
    \ **步骤 2** 点击 3.x 版本的下载按钮，并将文件保存到你的“下载”文件夹中。文件下载完成后，双击执行文件，Python 安装程序将启动。从这里你有两个选择：立即安装\
    \ (Install Now) 或自定义 (Custom)。我们建议使用“自定义”安装链接。\n- **步骤 3** 选择“自定义”选项允许你指定某些参数，虽然你可以保持默认设置，但养成一个好习惯是（尽管有时\
    \ Python 并不如此）避免安装程序包含不需要的功能。在下一页上，确保勾选了所有选项框并点击“下一步”。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_13_0.png)\n\
    \n- **步骤 4** 下一页包含 Python 的一些有趣新增。如果你准备就绪，请勾选关联文件到 Python”、“创建快捷方式”、“将 Python\
    \ 添加到环境变量”、“预编译标准库以及为所有用户选项。这将让以后使用 Python 变得简单得多。准备好后点击“安装”。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_13_2.png)\n\
    ![](img/bb949c7c28c27d6124a761521ffcfb43_13_3.png)\n![](img/bb949c7c28c27d6124a761521ffcfb43_13_4.png)\n\
    \n想知道用哪个版本吗？这里有更多关于 Python 2 和 3 区别的信息。\n寻找其他操作系统的 Python？Windows 版、Linux、Unix、Mac\
    \ OS、其他版本。想帮助开发 Python 版本吗？预发布版。\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_13_1.png)\n\
    \n### 步骤 5\n你可能需要通过 Windows 验证通知确认安装。只需点击“是”，Windows 就会开始安装。安装完成后，最后的窗口页面将允许你查看发行说明并遵循一些在线教程。\n\
    \n### 步骤 6\n然而，在关闭安装窗口之前，最好点击详细的安全路径长度 (Safe Path Length)链接。这将允许你绕过 260 个字符的限制，从而执行存储在深层文件夹中的\
    \ Python 程序。再次点击“是”激活该过程，然后就可以关闭安装窗口。\n\n### 步骤 7\nWindows 10 用户将在“开始”按钮的“最近添加”部分找到安装好的\
    \ Python 3.x。点击第一个链接“Python 3.6 (32位)”将打开命令行版本的 Python（稍后会详细说明）。要打开 IDLE，在 Windows\
    \ 中输入 IDLE。\n\n### 步骤 8\n点击 IDLE (Python 3.6 32位) 链接将启动 Python Shell，你可以在其中开始编程。如果你的版本较新，也不担心，因为\
    \ Python 3.x 代码会在你的 Python 3 界面中运行。\n\n### 步骤 9\n如果你现在点击 Windows“开始”按钮，这次输入 CMD，你将看到命令提示符环境。点击它进入\
    \ Windows 命令行，要在命令行中进入 Python，你需要输入：`python` 并按回车。\n\n### 步骤 10\nWindows 中命令行版本的\
    \ Python 看起来可能和你 IDLE 步骤 8 中看到的一样；注意那三个向左的箭头 (>>>)。虽然这是一个非常完美的环境，但它并不用户友好，所以先离开命令行。输入：`exit`\
    \ 并关闭命令提示符。\n\n#### 安装成功\n特别感谢 Mark Hammond，他多年免费分享的经验使得 Windows 版 Python 不会仅仅留在\
    \ DOS 时代。\n\nPython 新手？点击链接查看下一步的在线文档。\n\n查看此版本中的新特性。\n\n- 安全路径长度限制\n  更改你的机器配置以允许程序（Python）绕过\
