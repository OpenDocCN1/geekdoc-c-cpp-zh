    # Your First Code


    ## PLAYING WITH PYTHON


    With most languages, computer or human, it''s all about remembering and applying
    the right words to the right situation. You''re not born knowing these words,
    so you need to learn them.


    If you''ve closed Python 3 IDLE, reopen it in the Shell, whichever operating system
    you prefer, and try the following:


    ```

    print("Hello")

    ```


    ```

    Python 3.4.2 Shell

    Edit Shell Debug Options Windows help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> CPython 3.4.2 build on Windows

    >>> Type "credits" or "license" for more information.

    >>> print("Hello")

    Hello

    >>>

    ```


    You can see that instead of the number 4, the output is 2+2 you asked to be printed
    to the screen. The question marks are defining what''s being output to the IDLE
    Shell: print the total of 2+2 you need to remove


    ```

    print(2+2)

    ```


    ```

    Python 3.4.2 Shell

    Edit Shell Debug Options Windows help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> CPython 3.4.2 build on Windows

    >>> Type "credits" or "license" for more information.

    >>> print("Hello")

    Hello

    >>> print(2+2)

    4

    >>>

    ```


    Just as predicted, the word Hello appears in the Shell as text, indicating output
    from a string. It''s fairly straightforward and doesn''t require too much explanation.
    Now try:


    ```

    print("2+2")

    ```


    You can continue as such, printing 2+2, 464+2343 and so on to the Shell. An easier
    way is to use a variable, which is something we will cover in more depth later.
    For now:


    ```

    a=2

    b=2

    ```


    ```

    Python 3.4.2 Shell

    Edit Shell Debug Options Windows help

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> CPython 3.4.2 build on Windows

    >>> Type "credits" or "license" for more information.

    >>> print("Hello")

    Hello

    >>> print(2+2)

    4

    >>> a=2

    >>> b=2

    >>> print(a+b)

    4

    >>> print(a*b)

    4

    >>> print(a-b)

    0

    >>> print(a/b)

    1

    >>>

    ```


    # STEP 5


    What you have done here assigns the letters a and b and two values: 2 and 2. These
    are now variables, which can be called upon Python to output, add, subtract, divide
    so on for long as their numbers stay the same. Try this:


    ```

    print(a)

    print(b)

    ```


    ```

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "credits" or "license" for more information.

    name="David"

    print(name)

    David

    a=2

    b=2

    print(a+b)

    print(a-b)

    print(a*b)

    print(a/b)

    1

    ```


    # STEP 8


    Now let''s add a surname:

    surname="Howard"

    print(surname)


    You have two variables containing a first name and a surname so you can print
    them independently.


    ```

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "credits" or "license" for more information.

    name="David"

    surname="Howard"

    print(name)

    print(surname)

    David

    howard

    ```


    # STEP 6


    The output of the last steps clearly shows values of a and b individually, as
    you''ve asked to be printed. If you want to add them up, you can use the following:


    ```python

    print(a+b)

    ```


    This code simply adds the values of a and b, them together and outputs the result.


    ```

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "credits" or "license" for more information.

    name="David"

    a=2

    b=2

    print(a+b)

    4

    ```


    # STEP 9


    If we were to apply the same routine before, using the + symbol, the name wouldn''t
    appear correctly in the Shell. Try it:


    ```python

    print(name+surname)

    ```


    You need a space between the two, defining them as separate names and not mathematically
    so you play around.


    ```

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "credits" or "license" for more information.

    name="David"

    surname="Howard"

    print(name+surname)

