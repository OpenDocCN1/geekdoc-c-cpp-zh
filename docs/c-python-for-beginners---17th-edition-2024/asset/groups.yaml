    \ unless you're a professional or just starting out.\n\nIn short, code should\
    \ be commented in a manner to effectively describe the purpose of a line, section,\
    \ or individual elements. You should get in the habit of commenting as much as\
    \ possible so that someone who doesn't know anything about programming can understand\
    \ it by going to read your code.\n\nIn a professional environment, comments are\
    \ vital to the success of the code and the company. In an organization, programmers\
    \ work in teams alongside engineers, other developers and analysts. And if you're\
    \ part of the team that maintains software, your comments help save the team when\
    \ something goes wrong, and another team member has to pick up and follow the\
    \ trail\n\nPlace yourself in the shoes of someone whose job is to find out what's\
    \ wrong with your program. With over 800,000 lines of code, you might scan across\
    \ different modules and need a little help from the original programmers in the\
    \ form of a good comment.\n\n> The best comments always connect and link the code,\
    \ detailing what happens when the program hits its line or section. You don't\
    \ need to comment on every line. Something along the lines if x=0 does not require\
    \ you to comment that if x equals zero then do something: that's going to be obvious\
    \ to the reader. However, if equaling zero is something that drastically changes\
    \ the program for the user, as if you're out of lines, then it certainly needs\
    \ to be commented.\n\nEven if it is you are going to be publicly sharing it with\
    \ others. This way you can remember and always understand what you did or where\
    \ you went wrong or what worked brilliantly.\n\nComments are good practice once\
    \ you understand how to add a comment when you need some, so if it's your secret.\n\
