- md: "\n![](img/bb949c7c28c27d6124a761521ffcfb43_43_0.png)\n\n# Say Hello to C++\n\
    \nC++ is a high level programming language that's used in a multitude of technologies.\
    \ Everything from your favourite mobile app, console and PC game to entire operating\
    \ systems, all are developed using C++ and a collection of software development\
    \ kits and custom libraries.\n\nC++ is the driving force behind most of what you\
    \ use on a daily basis, which makes it a complex and extraordinarily powerful\
    \ language to get to grips with. In this section, we look at how to install a\
    \ C++ IDE and compiler on your computer.\n\n# Why C++?\n\nC++ is one of the most\
    \ popular programming languages available today. Originally called C with Classes,\
    \ the language was renamed C++ in 1983. It's an extension of the original C language\
    \ and is a general purpose object-oriented OOP environment.\n\n# EVERYTHING\n\n\
    Due to how complex the language can be, and its power and performance, C++ is\
    \ often used to develop games, programs, device drivers and even operating systems.\n\
    \nDating back to 1979, the start of the era of home computing, C++, or rather\
    \ with Classes, was the brainchild of Danish scientist Bjarne Stroustrup while\
    \ on his PhD thesis. Stroustrup's plan was to further enhance the original C language,\
    \ which was widely used since the early seventies.\n\ncomputing labs and by regular\
    \ people who didn't have access to the mainframes and large computing centres.\n\
    \nC++ impact in the digital world is immense. Many of the programs, applications,\
    \ games and even operating systems, such as Photoshop, are coded using C++. For\
    \ example, all of Adobe's major applications, InDesign and are developed in C++.\
    \ You will find that the browser you surf the internet is written in C++, as Windows\
    \ 10, Microsoft Office and the backbone to Google's search engine. Apple's macOS\
    \ is written largely in C++ (with some other languages mix (depending on the function)\
    \ and the likes of NASA, SpaceX and CERN use C++ for various applications, programs,\
    \ controls and other computing tasks.\n\nC++ proved to be popular among the developers\
    \ of the '80s, since it was a much easier environment to get grips with and more\
    \ importantly, it was 99% compatible with the original C language. It meant that\
    \ it could be used beyond the mainstream.\n\n- C++ code is much faster than that\
    \ of Python.\n\n```cpp\n#include <iostream>\nusing namespace std;\nvoid main()\
    \ {\n    char ch;\n    cout<<\"Enter a character to check if it is vowel or not\"\
    ;\n    switch (ch) {\n        case 'a': case 'A':\n            cout<<\"is a Vowel\"\
    \n            break;\n        case 'e': case 'E':\n            cout<<\"is a Vowel\"\
    \n            break;\n        case 'i': case 'I':\n            cout<<\"is a Vowel\"\
    \n            break;\n        case 'o': case 'O':\n            cout<<\"is a Vowel\"\
    \n            break;\n        case 'u': case 'U':\n            cout<<\"is a Vowel\"\
    \n            break;\n    }\n}\n```\n\n# Why C++?\n\n# Installing - Visual Studio\
    \ Community 2017 (15.0.26223.1), an asynchronous\n\n# Workloads\n\n# Individual\
    \ components\n\n# Language packs\n\nWindows (5)\n\n| Universal Platform Development\
    \ |\n| :--- |\n| Create applications for the Universal Platform with C#, VB, JavaScript,\
    \ or asynchronous C++ |\n| .NET development |\n| Build Windows Forms and console\
    \ applications using the .NET Framework. |\n| Development with C++ |\n| Build\
    \ classic Windows-based applications using the power of the Visual C++ booster,\
    \ ATL, and other features like MFC. |\n\n# Summary\n\n# Development with C++...\n\
    \n- C++ core features\n- C++ 17 tools (x86, x64)\n- Windows SDK (10.0.14393.0)\n\
    - Visual C++ ATL tools\n- Visual C++ MFC tools\n- Windows XP support for C++\n\
    - C++ libraries\n- Standard Libraries\n\n# Web & Cloud (4)\n\n| ASP.NET web development\
    \ |\n| :--- |\n| Build web applications using ASP.NET Core, HTML, JavaScript,\
    \ and CSS. |\n| Azure development |\n| Create, deploy, and manage projects for\
    \ cloud apps and creating resources. |\n| Node.js development |\n| Build scalable\
    \ applications using Node.js, an asynchronous event-driven runtime. |\n| Data\
    \ storage and processing |\n| Connect and test data solutions using SQL Server,\
    \ Azure Lake, or Azure MS. |\n\nMicrosoft Visual Studio is a great, free environment\
    \ to learn C++ in.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_46_0.png)\n![](img/bb949c7c28c27d6124a761521ffcfb43_46_1.png)\n\
    ![](img/bb949c7c28c27d6124a761521ffcfb43_46_2.png)\n![](img/bb949c7c28c27d6124a761521ffcfb43_46_3.png)\n\
    \n# Say Hello to C++\n\n# # Equipment Needed\n\nYou don't need to invest a huge\
    \ amount of money in order to learn C++ you don't need an entire computer lab.\
    \ Providing you have a fairly modern computer, everything else is freely available.\n\
    \n## C++ SETUPS\n\nMost, if not all, operating systems have C++ in their code,\
    \ so it stands to reason that you can learn no matter what you're currently using.\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_47_0.png)\n\n### COMPUTER\n\nUnless\
    \ you are writing your C++ code by hand on a sheet of paper (which is something\
    \ older coders used to do), a computer is absolute have. PC users can have any\
    \ Linux distro or Windows OS, Mac users use the latest macOS.\n\n### AN IDE\n\n\
    Just as with Python, an IDE is used to enter and execute your C++ code. Many IDEs\
    \ come with extensions and plugins that help it work better, or add an extra level\
    \ of functionality. Often, an IDE provides enhancements depending on the core\
    \ OS being used, such as being enhanced for Windows 10.\n\n### COMPILER\n\nA compiler\
    \ is a program that converts the C++ language into binary, so that the computer\
    \ can understand. While some IDEs come with a compiler built-in, others don't.\
    \ Code:Blocks is our favourite IDE that comes with a C++ compiler as part of the\
    \ package. On this later on.\n\n### TEXT EDITOR\n\nSome programmers prefer to\
    \ use a text editor to assemble their C++ code before running it through a compiler.\
    \ Essentially you can use any text editor to write code, just save it with a .cpp\
    \ extension. However, Notepad++ is one of the best code editors available.\n\n\
    ### INTERNET ACCESS\n\nWhile it's entirely possible to learn how to code C++ on\
    \ a computer that's not attached to the Internet, it is extraordinarily difficult.\
    \ You need to install relevant software, keep it up to date, install any extras\
    \ and extensions for help when coding. All of these require access to the Internet.\n\
    \n### TIME AND PACE\n\nYes, with Python, you're going to need aside significant\
    \ time to spend on learning how to code in C++. Sadly, unless you're a genius,\
    \ it's not going to happen overnight, or even a week. A good C++ coder has spent\
    \ many years honing their craft, so be patient, start small and keep learning.\n"
  mdcn: "\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_43_0.png)\n\n# 向 C++ 问好\n\n\
    C++ 是一种高级编程语言，广泛应用于各种技术中。从你喜爱的移动应用、控制台和 PC 游戏到整个操作系统，全部都是使用 C++ 以及一系列软件开发工具包（SDK）和自定义库开发的。\n\
    \nC++ 是你日常使用的大部分内容背后的驱动力，这使其成为一门复杂且极其强大的语言。在本节中，我们将介绍如何在你的计算机上安装 C++ 的 IDE 和编译器。\n\
    \n# 为什么选择 C++？\n\nC++ 是当今最流行的编程语言之一。它最初被称为“带类的C语言”（C with Classes），在 1983 年被重命名为\
    \ C++。它是原始 C 语言的扩展，是一个通用的面向对象（OOP）环境。\n\n# 一切一切\n\n由于该语言的复杂性以及其强大的功能和性能，C++ 通常用于开发游戏、程序、设备驱动程序甚至是操作系统。\n\
    \nC++ 追溯到 1979 年（家用计算时代的开始），C++ 或者确切地说“带类的 C”，是丹麦科学家比雅尼·斯特劳斯特普（Bjarne Stroustrup）在写博士论文期间的心脑结晶。斯特劳斯特普的计划是进一步增强自\
    \ 70 年代初以来被广泛使用的原始 C 语言。\n\n它让计算实验室以及无法访问大型主机和大型计算中心的普通人能够使用。\n\nC++ 对数字世界的影响是巨大的。许多程序、应用程序、游戏甚至操作系统（如\
    \ Photoshop）都是使用 C++ 编写的。例如，Adobe 的所有主要应用 InDesign 和其他都是用 C++ 开发的。你会发现你上网的浏览器是用\
    \ C++ 编写的，Windows 10、Microsoft Office 以及 Google 搜索引擎的骨干也是。Apple 的 macOS 大部分由 C++\
    \ 编写（混杂了一些其他语言，取决于功能），NASA、SpaceX 和 CERN 等机构使用 C++ 进行各种应用、程序、控制和其他计算任务。\n\nC++\
    \ 证明了在 80 年代的开发者中非常受欢迎，因为它是一个更容易上手的环境，更重要的是，它与原始 C 语言有 99% 的兼容性。这意味着它可以用于主流领域之外。\n\
    \n- C++ 代码比 Python 代码快得多。\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    void main() {\n    char ch;\n    cout<<\"Enter a character to check if it is vowel\
    \ or not\";\n    switch (ch) {\n        case 'a': case 'A':\n            cout<<\"\
    is a Vowel\"\n            break;\n        case 'e': case 'E':\n            cout<<\"\
    is a Vowel\"\n            break;\n        case 'i': case 'I':\n            cout<<\"\
    is a Vowel\"\n            break;\n        case 'o': case 'O':\n            cout<<\"\
    is a Vowel\"\n            break;\n        case 'u': case 'U':\n            cout<<\"\
    is a Vowel\"\n            break;\n    }\n}\n```\n\n# 为什么选择 C++？\n\n# 安装 - Visual\
