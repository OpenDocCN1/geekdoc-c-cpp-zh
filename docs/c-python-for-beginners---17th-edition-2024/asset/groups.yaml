- md: "\n# How to Set Up C++ in Linux\n\nLinux is a great C++ coding environment.\
    \ Most Linux distros already have the essential components preinstalled, such\
    \ as a compiler and the text editors are excellent for entering code into, including\
    \ colour coding; and there's tons of extra software to help you get out.\n\n##\
    \ LINUX++\n\nIf you're not familiar with Linux, we recommend taking a look at\
    \ one of our Linux titles from the BDM Publications range. If you have the Raspberry\
    \ Pi, the commands below work just fine and for this example we're using Linux\
    \ Mint.\n\n- STEP 1: The first step is to ensure Linux is ready for your C++ code,\
    \ check the system and software are up to date. Open a terminal and: `sudo apt-get\
    \ update && sudo apt upgrade`. Press Return and enter your password. These commands\
    \ update the entire system and any installed software.\n\n- STEP 2: Most Linux\
    \ distros come preinstalled with all C++; the necessary components to start coding;\
    \ however, it's worth checking to see if everything is present. Still within the\
    \ terminal: `sudo apt-install build-essential` and press Return. If you have the\
    \ right components nothing is installed; if you're missing them they are installed\
    \ by the command.\n\n- STEP 3: Amazingly, that's it. Everything is already ready\
    \ for you to start coding. Here's how to get your first C++ program up and running.\
    \ In Linux the main text editor is Xed, which you launch by clicking on the Menu\
    \ and typing Xed into the search bar. Click on the Text Editor in the right-hand\
    \ panel to open it.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_53_0.png)\n\n\
    - STEP 4: In Xed, or any other text editor you may use, to enter the lines of\
    \ code that make your C++ Hello World program. It's a little different from what\
    \ the Mac produced:\n\n```cpp\n#include <iostream>\n\nint main()\n{\n    // My\
    \ first C++ program\n    std::cout << \"Hello World!\\n\";\n}\n```\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_53_1.png)\n\
    \n## STEP 5\n\nWhen you've entered your code, click > Save As and choose a folder\
    \ to save your program. Name the file as helloworld.cpp (it can be any name as\
    \ long as it has .cpp the extension), Click Save to continue.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_54_0.png)\n\
    \n## STEP 8\n\nBefore you execute the C++ file you need to compile it. In Linux\
    \ it's come with g++, and if you're now in the same folder as the C++ file, enter:\
    \ `g++ helloworld.cpp` in the Terminal and press Return.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_54_1.png)\n\
    \n## STEP 6\n\nThe first thing to notice is that Xed automatically recognises\
    \ this as a C++ file, since the file extension is now set to .cpp. The colouring\
    \ is present in the code and if you open the file manager you can also see that\
    \ there's icon C stamped on it.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_54_2.png)\n\
    \n## STEP 9\n\nIt takes a short time while the code is compiled by g++ but providing\
    \ there are no mistakes or errors in the code you have created a new file. If\
    \ you enter it into the Terminal you can see alongside your C++ file it is out.\n\
    \n![](img/bb949c7c28c27d6124a761521ffcfb43_54_3.png)\n\n## STEP 7\n\nWith your\
    \ code now saved, drop into the Terminal again. You need to navigate to the folder\
    \ of the C++ file you've just saved. Our example is in the Documents folder, so\
    \ we can go to it by entering `cd Documents`. Remember, the Linux Terminal is\
    \ case sensitive, so any commands must be entered correctly.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_54_4.png)\n\
    \n## STEP 10\n\nA out is compiled C++. To run the code: `./a.out` and press Return.\
    \ The words 'Hello World' appear on the screen. However, a.out isn't very friendly.\
    \ To name something else, you can recompile with: `g++ helloworld.cpp -o helloworld`.\
    \ This creates an output file which can be run by: `./helloworld`.\n\n![](img/bb949c7c28c27d6124a761521ffcfb43_54_5.png)\n\
    \n## Other C++ IDEs to Install\n\nIf you want to try a different approach to working\
    \ with your C++ code, there are plenty of options available to you. Windows is\
    \ the most prolific platform for C++ IDEs but there are plenty for Mac and Linux\
    \ users too.\n\n## DEVELOPING C++\n\nHere are ten C++ IDEs that are worth looking\
    \ into. You can install one or all of them if you like, but find the one that\
    \ works for you.\n\n- ECLIPSE: ECLIPSE is a popular IDE for Windows, Mac and Linux.\
    \ It offers a wealth of features and is easy to use. You can find out more at\
    \ eclipse.org.\n\n- CODELITE: CodeLite is a lightweight IDE for Windows, Mac and\
    \ Linux. It has a clean interface and is regularly updated. You can find out more\
    \ at codelite.org.\n\n- GNAT: GNAT is a powerful IDE for Windows, Mac and Linux.\
    \ It comes with an advanced editor and debugger. You can find out more at gnat.com.\n\
    \n- NETBEANS: NetBeans is a popular IDE for Windows, Mac and Linux. It offers\
    \ many features and is free to use. You can find out more atnetbeans.org.\n\n\
    - VISUAL STUDIO: Microsoft's Visual Studio is a powerful IDE for Windows. The\
    \ Community version is free for individual developers. You can find out more at\
    \ visualstudio.com.\n\n- ANJUTA: Anjuta is a Linux-only IDE that features a GUI\
    \ designer, source editor and integrated debugger. You can find out more at anjuta.org.\n\
    \n- QT CREATOR: Qt Creator is a cross-platform IDE designed for desktop and mobile\
    \ environments. It comes with an advanced editor and integrated tools. You can\
    \ find out more at qt.io.\n\n- MONODEVEL: Monodevel is an excellent IDE for desktop\
    \ and web applications across all major platforms. It features an advanced editor\
    \ and debugger. You can find out more at monodevel.com.\n\n- DEV C++: Bloodshed\
    \ Dev++ is an IDE for Windows systems. Many users praise its clean interface and\
    \ unique way of coding. It is available at bloodshed.net/devcpp.\n\n- U++: Ultimate++\
    \ is a cross-platform IDE that boosts rapid development of code with smart and\
    \ elegant features. For the novice, it's a bit of an IDE but behind its complexity\
    \ is a beauty. You can find out more at ultimatepp.\n"
