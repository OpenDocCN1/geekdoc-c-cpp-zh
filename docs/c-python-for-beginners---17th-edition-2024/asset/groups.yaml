    # OS SPECIFIC NEEDS


    C++ will work in any operating system but getting all the necessary pieces together
    can be confusing to a newcomer. Here are some OS specifics for C++.


    ## LINUX


    Linux users are lucky in that they already have a compiler and text editor built
    into their operating system. Any text editor allows you to type out C++ code,
    when it is saved with a .cpp extension, use g++ to compile it.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_0.png)


    ## WINDOWS


    We have mentioned previously that a good IDE is Microsoft''s Visual Studio. However,
    a better IDE and compiler is Code::Blocks, which is regularly kept up to date
    with a new release every year. Otherwise Windows users can enter their code in
    Notepad++, then compile it with MinGW as used by Code::Blocks.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_1.png)


    ## RASPBERRY PI


    The Raspberry Pi''s operating system is Raspberry, which is Linux based. Therefore,
    you''ll be able to write your code out using a text editor, then compile it with
    g++ as you would in any other Linux distro.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_2.png)


    ## MAC


    Mac owners will need to download and install XCode to be able to compile their
    C++ code natively. Other options for the MAC include Netbeans, Eclipse or Code::Blocks.
    Note: the latest Code::Blocks isn''t available for Mac due to a lack of Mac developers.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_48_3.png)


    ## How to Set Up C++ in Windows


    Windows users have a wealth of choice when it comes to programming in C++. There
    are plenty of IDEs and compilers available, including Visual Studio from Microsoft.
    However, in our opinion, the best C++ IDE to begin with is Code::Blocks.


    ### CODE::BLOCKS


    Code:Blocks is a free C++, and Fortran IDE that feature rich and easily extensible
    with plug-ins. It''s easy to use, comes with a compiler and a vibrant community
    behind it.


    - **STEP 1** By visiting the Code:Blocks download site, at www.codeblocks.org/downloads.
    From there, click on the ''Download the binary releases'' link to be to the latest
    downloadable version for Windows.

    - **STEP 2** You can see that there are several versions available. One may want
    to download ''mingw-setup.exe'' at the current version number. At the time of
    writing this is: code::blocks-17.12-mingw-setup.exe. The difference is that the
    mingw-setup includes a C++ compiler and debugger from GCC (a compiler suite).

    - **STEP 3** When you have located the file, click on Sourceforge.net link at
    the end of the line and a download notification window appears; click Save File
    to start the download and save the executable to your PC. Locate the downloaded
    Code::Blocks Installer and double-click to start. Follow the on-screen instructions
    to begin the installation.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_49_0.png)


    - **STEP 4** Once you''ve agreed to the licensing terms, there is a choice of
    installation options available. You can opt for a smaller install, missing out
    on some of the components but we recommend you opt for the Full option as default.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_49_1.png)


    ### STEP 5

    Choose an install location for Code:Blocks files. It''s your choice, but the default
    will generally suffice, unless you have any special requirements. When you click
    Next, the installer begins; if it''s a finished notification popping up you want
    to start Code:Blocks, now yes.


    ### STEP 8

    Before you start Code:Blocks it''s worth explaining why you needed the compiler.
    A compiler is a separate program that reads through C++ code and checks it against
    the latest programming standards; this is why you need the most recently available
    compiler. This is C++11 for now.


    ```

    Code shortcut: C:\Users\David\AppData\Roaming\Microsoft\Windows\Start Menu\

    ```


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_0.png)


    ### STEP 6

    The first time Code:Blocks runs it will auto-detect any C++ compilers you may
    have installed on your system. If you don''t, have the first detected option,
    GCC Compiler, and click the Default to set it as your system C++ compiler. Click
    OK when you''re ready to continue.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_1.png)


    ### STEP 9

    Essentially, computers work and understand binary, and zeros, ones. Machine Language
    isn''t efficient for human beings. For example, to output your "Hello World" to
    the screen C would appear in binary:

    ```

    01001000 01101001 01101100 01101100 01101111 00100000

    01100111 01101111 01110010 01101100 01100100

    01100101 01101111 01110100 01100100 00100000

    01100101 01101110 01110101 01101110 01100000

    01100111 01100111 01110100 01100100 01100000

    01100111 01101111 01110100 01100100 01100000

    01100111 01101111 01110010 01101100 01100100

    01110101 01101110 01110111 01100111 01100110

    01110101 01101111 01110100 01100101 01100000

    01110111 01101111 01110100 01100101 01100000

    01110101 01101111 01110100 01100101 01110000

    01110101 01101111 01110100 01100101 01100000

    ```

    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_2.png)


    ### STEP 7

    When the program starts another message appears, showing you that Code:Blocks
    is currently not the default C++ compiler. You have a couple of to leave everything
    as is or allow to associate file types. Again we recommend you opt for the last
    choice to associate Code:Blocks with every supported type.


    ### STEP 10

    The compiler takes whatever you want to enter as C++ code and translates it into
    machine code ''builds'' the code, checking for errors, then runs it through the
    standardization and uses zeros and ones for the computer to act upon. It''s rather
    clever stuff, when you stop to think about it.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_50_3.png)


    ## How to Set Up C++ on Mac


    To begin C++ coding on a Mac you first need to install Xcode. This is a free,
    full featured IDE that''s designed to create native apps. However, you can also
    use it to create C++ code relatively easily.


    ### Xcode


    Apple’s Xcode is primarily designed for users to develop apps for macOS, iOS,
    tvOS and watchOS in Swift and Objective-C but you can use it too.


    - **STEP 1** By opening the App Store on your Mac, Apple Menu -> App Store. In
    the Search box enter ‘Xcode’ and press Return. There are many suggestions filling
    the App Store window but it’s the first option, Xcode, that you need to click
    on.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_51_0.png)


    - **STEP 2** Take a moment to browse through the app’s information, including
    the compatibility, to ensure you have the correct version of macOS. Xcode requires
    macOS 10.12.6 or later to install and work.


    - **STEP 3** When you’re ready, click on the Get button then turns into Install
    App. Enter your Apple ID and Xcode begins to download and install. It may take
    some depending on the speed of your internet connection.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_51_1.png)


    - **STEP 4** When the installation is complete, click on the Open button to launch
    Xcode. Click Agree to the license terms and enter your password to Xcode to make
    changes to the system. When that is done, Xcode begins to install additional components.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_51_2.png)


    ![](img/bb949c7c28c27d6124a761521ffcfb43_51_3.png)


    - **STEP 5** With everything installed, including the additional components, Xcode
    launches, displaying the version number along with three choices and any recent
    projects you''ve worked on; with a fresh install though, this is blank.


    - **STEP 6** Start by clicking on New Xcode Project; this opens a window to choose
    which project you''re developing code. Click the macOS tab, then click the Command
    Line Tool option. Click Next to continue.


    - **STEP 7** Fill in the various fields but ensure that the Language option at
    the bottom is set to C++; choose it from the drop-down list. When you''ve filled
    the fields, and made sure that C++ is the chosen language, click the Next button
    to continue.


    - **STEP 8** The next step asks to create a Git Repository for all future future.
    Choose a location on Mac, or a network location, and click Create. When you''ve
    done all that, you can start to code. The left-hand pane details the files used
    in the C++ program you''re coding. Click on the main.cpp file in the list.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_52_0.png)


    - **STEP 9** You can see that Xcode automatically completes a basic Hello World
    Project for you. While it may not make sense at present, you will discover more
    as you progress, the content is just Xcode utilising on the Mac.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_52_1.png)


    - **STEP 10** When you want to run the code, click on Product > Run on Mac. You
    may be able to enable Developer Mode to perform functions without needing your
    password every session. When the program executes, the output is displayed at
    the bottom of the Xcode window.


    ![](img/bb949c7c28c27d6124a761521ffcfb43_52_2.png)


    ![](img/bb949c7c28c27d6124a761521ffcfb43_52_3.png)

