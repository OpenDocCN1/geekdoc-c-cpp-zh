    # 5.4 CIRCULAR LINKED LIST


    A singly linked list in which the link field of the last node is assigned with
    the address of the first node is known as a circular linked list or a circular
    list. Figure 5.12 illustrates the representation of a circular linked list.


    ![](img/45784b9f0334626143002ec0d63692fd_166_0.png)


    Figure 5.12 Circular linked list'
  merge: -1
