    # 3.2.1 Pseudo Code


    Algorithm shows the detailed instructional procedure. When detailed instruction
    is not needed, then the algorithms can be represented with partial code segments.
    These segments of the code can be called pseudo code.


    # 3.3 TYPES OF ALGORITHMS


    All the algorithms try to solve a given problem. Based on approaches of solving
    the problem, the algorithms can be classified into the following categories:


    +   Brute Force Algorithms


    +   Divide and Conquer Algorithms


    +   Dynamic Programming Algorithms


    +   Greedy Algorithms


    +   Branch and Bound Algorithms


    +   Recursive Algorithms


    +   Back Tracking Algorithms'
