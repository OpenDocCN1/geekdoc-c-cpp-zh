    **Quadratic probing:** Quadratic probing is another method for resolving collisions
    in hash tables. It operates by taking the original hash value and adding successive
    values of a quadratic polynomial to the starting value. Quadratic probing avoids
    the clustering problem that occurs with linear probing and may also result in
    probing the same set of alternate cells.


    In this method when a collision occurs at location 1, probes bucket 1+1, 1+4,
    ..., +9 whereas in linear probing probes bucket at locations 1+1, 1+2, 1+3, etc.
    In general this method probes buckets at locations (1+i^2) mod n, i=1, 2, ....
    where 1 is the location of home buckets and n is the number of buckets.'
