  md: '# 12.6 APPLICATIONS


    A self-balancing binary search tree has numerous applications. Its basic characteristic
    is to maintain the elements in order. So, it is applied in all the environment
    where the order of elements is required:


    +   1. Priority queues

    +   2. Associative array based on the order of elements the key-value pairs are
    inserted

    +   3. Binary tree sort

    +   4. Many algorithms in computational geometry such as line segment, intersection
    problem and point location problem

    +   5. Internet routers


    # SUMMARY


    +   • A non-empty binary search tree should satisfy the following properties:

    +     1. All the elements must have a key and it must be distinct.

    +     2. All the keys (if any) in the left subtree of the tree.

    +     3. All the keys (if any) in the right subtree of the tree must be greater
    than the root element.

    +     4. The left and right subtrees of the tree must also be the binary search
    trees.

    +   • The inorder traversal of a binary search tree produces the sorted list of
    the given elements in ascending order.

    +   • The operations on binary search tree are searching, insertion and deletion.

    +   • BST is highly efficient in performing all the operations with a time complexity
    of O(log n) over a sequential list.

    +   • Binary search trees suffers from the drawback of becoming skewed.

    +   • An empty binary tree is an AVL tree. A non-empty binary tree T is an AVL
    tree if and only if

    +     1. the left subtree TL and the right subtree TR of T are also AVL trees
    and

    +     2. |h(TL) - h(TR)| <= 1 where h(TL) and h(TR) are the heights of left and
    right subtrees of T, respectively.

    +   • The balancing factor of node u, bf(u) can be defined as bf(u)=h(UL)-h(UR),
    where, h(UL) is the height of the left subtree of u and h(UR) is the height of
    the right subtree of u.

    +   • Representation of AVL tree and AVL search trees are very similar to that
    of binary trees and binary search trees using a linked representation.

    +   • Searching, insertion and deletion are the common operations on AVL trees.

    +   • The insertion operation on AVL trees is similar to BST but leads to imbalance.
    The rotations LL, LR, RL, RR are used to rebalance the tree.

    +   • A deletion operation on AVL trees also performs some rotations.


    # EXERCISES


    # FILL IN THE BLANKS


    +   1. The path from the root to an external node is known as an _______.

    +   2. Linked representation of a binary search tree with a collection of internal
    nodes that represent the keys and external nodes that represent null pointers
    is known as _______.

    +   3. The skewed binary search trees have the time complexity of _______.'
  merge: -1
