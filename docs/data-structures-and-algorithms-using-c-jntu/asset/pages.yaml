    # Figure 6.8 Recursive calls to function fact()


    When the function fact(5) is called and executed, the variable p gets the value
    4 and calls the function fact(4) as shown in Figure 6.8(b), still the call to
    fact(5) is not yet finished. Every new function call pushes the current values
    of the parameter into the stack. Figure 6.8(d) illustrates the stack contents
    during call to fact(4) and subsequent calls. Call to fact(0) in Figure 6.8(f)
    satisfies the condition in step 1 and gets terminated yielding the value for 0!
    as 1 and returns it to the variable q. In Step 4 of the algorithm the calculating
    fact = n * q = 1 * 1 = 1. Then, the function (1) terminates yielding the value
    1 to Step 3 for the previous call to fact(2) and computes fact = n * q = 2 * 1
    = 2 and terminates by returning the result to q and so on.


    Stack structure increases in size due to push operation during the function calls
    and decreases itself in size by pop operation until the first call to fact( )
    is reached, i.e. fact(5). During the execution of fact(5), the first and the oldest
    call in Step 3 computes the q value as 24 and proceeds to get the fact = n * q
    = 5 * 24 = 120, which is the required value.


    Generally in the implementation of recursive calls using stack, all the local
    variables are pushed on to the stack when the call is made and popped out from
    the stack when the recursive call is terminated and their original values are
    restored.


    # 6.4.4 BALANCING OF THE MATCHING PARENTHESIS


    Given an expression of ''('' and '')'' parenthesis. A ''('' must match with a
    '')'', else else it is invalid. For example, (()), (((())), (((()))) are valid
    sets of parenthesis, while ((( ) ) ) ( are all illegal.


    Obviously, counting the numbers of ''('' and '')'' in the expression is not enough.
    By convention, the expression is reading from left to right. A '')'' is matched
    with the closest, unmatched ''('' on its left. For example, (((()))) is.


    Suppose to find which is closest and unmatched for '')'', read the expression
    from left to right; the most recently unmatched ''('' is cancelled with '')''.
    To keep track, the most recently read ''('' (assuming that there are many pending
