    When the new element 40 is to be added, it is inserted at the top. Now Top is
    pointing to the element 40 as in Figure 6.1(a). When deletion of an element is
    to be performed, the element pointed by the top is removed first, i.e 40 is removed
    first as shown in Figure 6.1(b).


