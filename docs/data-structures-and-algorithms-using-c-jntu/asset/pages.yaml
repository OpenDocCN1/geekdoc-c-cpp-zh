  md: '# 7.2 REPRESENTATION OF A QUEUE


    Queues can be represented in two ways:


    +   - Static representation using arrays

    +   - Dynamic representation using linked list


    # 7.2.1 Array Representation


    A one-dimensional array is used to represent a queue. Consider a queue QUE [1:N],
    two pointers FRONT and REAR represent two ends of the QUE. To insert an element,
    the REAR pointer is used and to delete an element, the FRONT pointer is used (Figure
    7.1).


    ![](img/45784b9f0334626143002ec0d63692fd_216_0.png)


    Figure 7.1 Array representation of queue QUE [1:N]


    A queue QUE [1:N] cannot hold more than N elements, and every insertion of an
    element must check the condition whether the QUE is full, and deletion of an element
    must ensure that QUE is not empty.


    # 7.2.2 LINKED REPRESENTATION


    Using linked list, queue is created dynamically by which the size of the queue
    can be increased as per the necessity in the application or program, whereas using
    arrays the size of the queue is fixed.


    Figure 7.2 shows the single linked list representation of a queue. The pointer
    FRONT points to the first node, and REAR to the last node in the list.


    ![](img/45784b9f0334626143002ec0d63692fd_216_1.png)


    Figure 7.2 Linked representation of a queue


    When FRONT=REAR the queue is said to be empty.


    # 7.3 OPERATIONS ON A QUEUE


    The two basic operations on queues are:


    +   1. Insertion (Enqueue)—adds an element into the queue

    +   2. Deletion (Deque)—removes an element from the queue'
