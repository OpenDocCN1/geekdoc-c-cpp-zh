    # Figure 7.10 Operations on deque


    In the example in Figure 7.10, observe that insertion at the front end decrements
    FRONT by 1(mod)N and insertion at the rear end increments REAR by 1(mod)N. Deletion
    at the front end increments FRONT by 1(mod)N and deletion at the rear end decrements
    REAR by 1(mod)N, where N is the size of the deque.


    # 7.6 APPLICATIONS OF QUEUES


    In general, queues are often used as “waiting lines.” A few examples where queues
    would be used are as follows:


    +   (1) In operating systems for controlling access to shared system resources
    such as printers, files, communication lines, disks and tapes.


    +   (2) Operating systems often maintain a queue of processes that are ready to
    execute or that are waiting for a particular event to occur.'
