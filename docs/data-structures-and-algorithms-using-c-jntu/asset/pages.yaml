    # 6.4.4.1 The ADT Stack


    A stack is collection of elements or items, for which the following operations
    are defined:


    +   - create(S) creates an empty stack S.

    +   - isEmpty(S) is a predicate that returns “true” if S exists and is empty,
    and “false” otherwise.

    +   - push(S,item) adds the given item to the stack S.

    +   - pop(S) removes the most recently added item from the stack S and returns
    it as the value of the function.


    The primitive isempty is needed to avoid calling pop on an empty stack, which
    may cause an error. An additional operation called top(S) is sometimes defined,
    which simply returns the last item to be added to the stack, without removing
    it.


    # SUMMARY


    +   - Stack is a non-primitive linear data structure into which elements are inserted
    and deleted from the same end called Top.

    +   - Stack supports two basic operations, Push and Pop.

    +   - There are many applications of stacks like recursion elimination, evaluation
    of expressions, etc.

    +   - Stack can be implemented using arrays or linked lists.


