  md: '# 14.5 APPLICATIONS


    In all the applications in which binary search trees are used, red-black trees
    can also be used because they are derived from B trees of order 4, a variant of
    binary search trees. In Java and C++, the library map structures are implemented
    with a red-black tree.


    Splay trees are the self-adjusting binary search trees. Due to caching effect
    of the splay trees the recently accessed elements have better access times than
    that of the less frequently accessed elements. They are best suitable for the
    applications in which the recently accessed information is very likely to be accessed
    in the near future. The splay trees are typically used in caches and memory allocators.
    Other applications include a hospital management system, university information
    system, dynamic Hoffman coding and data compression.


    # SUMMARY


    +   - A red-black tree is an extended binary search tree in which all the nodes
    and edges are coloured either red or black.

    +   - A red-black tree should satisfy the following properties:

    +       - The root node and all the external nodes are always coloured black.

    +       - In every root node to an external node path no two consecutive red nodes
    should appear.

    +       - The number of black nodes in all root node to the external node path
    must be the same.

    +   - Insertion of an element into a red-black tree is the same as that of into
    a binary search tree. Only difference is that the new node either black or red
    colour must be set.

    +   - If the tree was empty then black colour may be set to the new node as it
    becomes the root.

    +   - Deletion of an element from a red-black tree follows the same procedure
    as that of from a binary search tree. If the deleted node is red it will not violate
    the properties of red-black tree. So, no imbalance occurs and the tree is still
    a red-black tree.

    +   - If the deleted node is black then it violates the third property of the
    red-black trees. So, the tree is unbalanced.

    +   - The height of the red-black tree is maximum 2log2(n+1). So, the operations
    search, insert and deletion will have a time complexity of O(log n).

    +   - Splay trees are binary search trees with a wonderful property that can be
    adapted optimally to a sequence of tree operations.

    +   - When any operation is performed on a node, it is moved towards the root
    node. In the due course the inactive elements are moved far away from the root
    node.

    +   - Splay trees do not require balance or height information and hence are easier
    to implement and are cheaper than AVL trees over long sequences of retrievals.

    +   - All the operations performed on splay trees are the same as that of on a
    binary search tree. But after performing the operation the tree is splayed with
    respect to the referred node.

    +   - Splaying tree is aimed to make the referred or accessed node as the root
    node

    +   - An amortized analysis analyzes a sequence of operations to show that though
    a single operation within the sequence may be expensive the average cost per operation
    is small.'
