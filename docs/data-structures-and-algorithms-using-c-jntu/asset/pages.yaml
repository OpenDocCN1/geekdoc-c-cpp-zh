    a given key in the tree. If it is found then the search is successful and if it
    is not found in it is a unsuccessful search.

    +   - Insert: Insertion is an operation that is performed on a binary tree to
    include an element in an existing binary tree. A new element can be inserted at
    any position in a binary tree. To insert an element along with the element the
    node or element to which the new element is inserted a child must be specified.
    The new element either to be inserted as a left child or as a right child can
    also be mentioned.

    +   - Delete: Deletion is an operation that is performed on a binary tree to remove
    an element from a non-empty binary tree.

    +   - Merge: Merge is an operation that is performed on a binary tree to merge
    or combine two binary trees into one.

    +   - Display: Display is an operation that is performed on a binary tree to output
    or show the elements of a binary tree.


