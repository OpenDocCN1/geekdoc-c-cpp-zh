  md: '# ## 2.2 CONSTRUCTORS AND DESTRUCTORS


    Constructors and Destructors are the special member functions that have the same
    name as that of the class through which they differ from other functions; the
    only difference with the destructors is they are preceded by ~ (tilde) operator.
    Whenever an object of a class is created, the constructor is invoked automatically.
    The destructor is used to destroy the objects when they are of no use. When constructors
    and destructors are not defined, the compiler executes the default constructor
    and destructor.


    # ### 2.2.1 Constructors


    Constructors are used to create and initialize the objects. For example,


    ```

    ```cpp

    class Rectangle

    {

    Rectangle() { --- } //constructor

    -----

    }

    ```

    ```


    Here the class Rectangle has the constructor Rectangle(). Whenever an object is
    created for this class, the constructor is invoked automatically and initializes
    the object; no need to call it explicitly.


    # #### 2.2.1.1 Properties of Constructors


    +   1. Constructor name must be the same as the class name.

    +   2. It should not have a return type not even void.

    +   3. Constructors can be overloaded.

    +   4. They also can be invoked explicitly.

    +   5. Constructors can have default arguments.


    # #### 2.2.1.2 Types of Constructors


    Constructors are of three types:


    +   - Default constructors

    +   - Parameterized constructors

    +   - Copy constructors


    **Default constructors:** The constructor without arguments is called a default
    constructor.


    **Parameterized constructors:** Constructors that are created with arguments are
    called parameterized constructors. When an object is created for such constructors,
    values must be passed to the constructors.


    ```

    ```cpp

    class Area

    {

    int l,b,h;

    public:

    Area(int x,int y,int z); //declaration of parameterized constructor

    -----

    Area() { --- } //default constructor

    };

    Area::Area(int i,int j,int k) //definition of parameterized constructor

    ```

    ```'
