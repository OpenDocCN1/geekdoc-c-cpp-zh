  md: '![](img/45784b9f0334626143002ec0d63692fd_366_0.png)


    Tapes 1, 2 and 3 are source tapes, whereas tape 4 is an object tape (output tape).

    On the first merge pass the initial runs on each of the source tapes 1, 2 and
    3 are merged (i.e. records 5, 11, 9), and the run <5, 9, 11> is placed on the
    initially empty tape 4 (Figure 11.22(d)).

    The second merge places the run <8,13,15> on the tape 4 (Figure 11.21(d)). This
    now leaves tape 1 with no more runs left to be read. It is therefore rewound in
    preparation for its new role as the object tape (output tape) in the next merge
    phase. Tape 4 is also rewound so that it can play as the source tape (input tape).

    The next phase begins by merging runs from tapes 2, 3 and 4 which results in run
    <1,5,9,11,18> and placed on tape 1.

    At this stage, tape 2 is empty. Now this acts as the object tape, whereas tapes
    1, 3 and 4 act as source tapes.

    After merging runs from tapes 1, 3 and 4 result in run <1,5,8,9,11,13,15,18,20>
    and placed on tape 2.

    At this stage, all the other three tapes 1, 3 and 4 are empty. Hence, the run
    on tape 2 is in sorted form (Figure 11.22(f)).


    The number of records to sort may not always agree exactly with a perfect Fibonacci
    distribution. In this situation null or dummy records need to be assumed on the
    tapes. Enough dummy records should be included to bring the total number of runs
    up to the next perfect Fibonacci distribution. It is worth noting that a major
    portion of time in the sort is used in the rewinding of tapes so that they can
    be read. In fact, at the completion of every pass two of the tapes must be rewound.
    This time can be reduced if tapes are readable backwards also.


    # 11.5.2 Multiway Merge


    The capability to access a particular record directly on a magnetic disk is very
    important when considering the sorting of records in external memory. With direct
    record access the problems of setting up initial runs according to certain merge
    patterns and having to rewind working tapes can be ignored. Specifically, it is
    simple to use a k-way merge strategy that allows ignoring these two problems and
