    # 12.3.2 INSERTION


    To perform an insertion operation, initially the search operation is to be performed.
    The place where a null pointer or failure node is found, a new node with key is
    inserted. So, insertion is an extension of search operation. Its time complexity
    is O(log n).


    # Algorithm 12.2 BST-INSERT


    This algorithm inserts ITEM into the binary search tree if it doesn''t exist before.
    Let PTR and NPTR be the two pointer variables.


    +   1. Start from the root node

    +      Set PTR to root node pointer

    +   2. Loop until PTR is not equal to NULL.

    +   3. CASE 1:Check whether ITEM is less than DATA of PTR, then proceed to left
    subtree.

    +      Set NPTR to PTR.

    +      CASE 2:Check whether ITEM is equal to DATA of PTR, then write“ITEM already
    exists”.

    +      CASE 3:Check whether ITEM is greater than DATA of PTR, then

    +      Set NPTR to PTR

    +      Proceed to right subtree.

    +   4. End case

    +   5. End loop

    +   6. When PTR is equal to NULL then

    +   7. Call GETNODE(N) /*to create a new node*/

    +   8. Set DATA of N to ITEM.

    +   9. Set LCHILD of N to NULL.

    +   10. Set RCHILD of N to NULL.

    +   11. Check for DATA of NPTR to NULL, then

    +   12. Set RCHILD of NPTR to N /*insert as right child*/

    +   13. Else

    +      Set LCHILD of NPTR

    +      /*insert as left child*/

    +   14. End


