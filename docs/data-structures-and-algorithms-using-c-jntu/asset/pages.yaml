- pgno: 551
  md: "A metal pointer is used to select only one of the 80 columns. For sorting numerical\
    \ data, there are 10 packets corresponding to 10 decimal digits, and the sort\
    \ places all the cards for a given data in an appropriate pocket.\n\nThe operator\
    \ of the sorter combines all the decks of cards in the order from the 10 packets,\
    \ i.e. the resulting deck contains packet 0 on the bottom and packet 9 on the\
    \ top. Generally with more than one digit are sorted; in such a case the numbers\
    \ are sorted on the least-significant digit first, followed by the second-least\
    \ significant digit and so on till the most significant digit. Each column in\
    \ the card is sorted by starting from the lowest-order column and moves towards\
    \ the other column from right to left.\n\nEach pass through the array takes O(n)\
    \ time. If the maximum magnitude of a number in the array is 'p', and if entries\
    \ are treated as base 'q' numbers, then 1+floor(log(q) (p)) passes are needed.\
    \ If 'p' is a constant, radix sort takes linear time, O(n). However, if all the\
    \ numbers in the array are different then m is at least O(n), so O(n(log n)) passes\
    \ are needed, O(nlog(n)) is the total time complexity.\n\n# Algorithm 16.7: FIND\
    \ (DATA)\n\n```\n//This algorithm finds the single digit places in the array of\
    \ elements\n1. Set max=0\n2. Loop for i=1 to n\n3. Check whether DATA[i]>max then\n\
    \   i. Set max=DATA[i]\n   ii. Set max1=i\n4. Loop while max1=0 do\n   i. max=max/10\n\
    \   ii. max1++\n5. End loop\n6. RADIX SORT (DATA,max1,n)\n```\n\n# Algorithm 16.8:\
    \ RADIX SORT (DATA, m,n)\n\n```\n//Places the elements in appropriate pockets\
    \ and recollects them in order.\n1. Set y=0\n2. Loop for i=1 to m\n3. Set q=1\n\
    4. Set p= pow(10,y)\n5. Set y=y+1\n6. Loop for j=0 to 9\n7. Loop for k=1 to n\n\
    8. Set digit= (DATA[k]/p)%10\n9. Check whether digit is equal to j then\n10. Set\
    \ b[q++]=DATA[k]\n11. End step6 loop\n12. End step5 loop\n13. Loop for temp=1\
    \ to n\n14. Set DATA[temp]=b[temp]\n15. End step13 loop\n16. End step2 loop\n\
    ```"
