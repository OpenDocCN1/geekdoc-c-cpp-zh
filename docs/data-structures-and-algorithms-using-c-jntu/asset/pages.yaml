    # 15.6.2 Compressed Tries


    Compressed tries or Patricia tries are similar to the standard tries and are like
    the tree structure, but the shape of the node depends on the data it holds. But
    a node in the standard trie will have only one character, but a compressed trie
    can have multiple characters. Compressed tries will have at least two children
    at each of its internal nodes.


    Let a standard trie ''T'' have an internal node ''v'' and ''v'' is not a root
    node, and ''v'' has not only one branch. Then all the child nodes of the node
    ''v'' are transformed or compressed as a single node.


    Let ''v'' have a single branch with ''k'' number of child nodes and each child
    node does not have more than one child, then all the child nodes will be compressed
    as a single node.


    If V = (v0,v1) (v1,v2)(v2,v3)(v3,v4).....(vk-1, vk ), where v1 has a child v2,
    v2 has a child v3, v3 has a child v4 .... vk-1 has a child vk then vi is redundant
    for i =1,2,3,4 ... k-1, v0 and vk are not redundant. The node vk is compressed
    with the concatenation of labels of v1...vk (Figure 15.7).


    # Properties of compressed tries:


    Let S be a set of strings with an alphabet set of size d, which will have the
    following properties:


    +   - All the internal nodes in the compressed trie should have at least two children
    and at most d children.

    +   - If all the strings of the set ''S'' do not have the same start suffix character
    then the compressed trie should have ''s'' number of external nodes where ''s''
    is the number of strings in the ''S''.

    +   - The number of nodes of ''T'' is O(s).


    # Disadvantages of compressed tries:


    +   - Inefficient when too many duplicates are present in the patterns.

    +   - Each node occupies at least one byte

    +   - Updating the node is difficult'
