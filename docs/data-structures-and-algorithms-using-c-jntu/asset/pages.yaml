    # 13.3 OPERATIONS ON m-WAY SEARCH TREES


    Binary search tree is an m-way search tree of order two. Operations on m-way search
    tree are the extensions of operations on binary search trees. Some of the very
    frequently used operations are discussed.


    # 13.3.1 SEARCHING


    Searching begins with a root node. The element k for which the search is carried
    out is compared with each element of the root node sequentially. If the required
    element matches with any of the root elements then the search is successful. If
    k<x1 and k<xr, for some value of i then the search continues with the respective
    subtree Ti. Similarly the search proceeds till the required element is found and
    the search is successful or an external node or null pointer is found where the
    search is unsuccessful.


    The 4-way search tree depicted in Figure 13.2 is considered. Searching for an
    element 15 compares it with the first element of the root 30. As 15 is less than
    (<) 30 search moves to the first subtree of the root [12, 27]. As 15 is greater
    than (>) 12, the first element of the node, it again moves down to the subtree
    with the elements [14, 21, 25]. As 15>14 and 15<21 search moves to the next subtree
    which is an external node. So, searching is terminated as an unsuccessful search.
    From the same tree for 42 is the element that is to be searched then 42 is compared
    with the root node [30, 64, 79]. As 42>30 and 42<64 search moves to the second
    subtree [36, 42, 54]. Now, 42 is compared with 36 which does not match, proceeds
    to 42 the next element of the node where match is found. So, the search is successful.


    # 13.3.2 INSERTION


    Inserting an element into the m-way search tree begins with the search operation.
    The place where the search operation terminates is where the insertion takes place.
    The new element may be inserted into an existing node if it is able to accommodate,
    otherwise it may be inserted as a new node in the next level.


    In the 4-way search tree from Figure 13.2 if an element 29 is to be inserted then
    search for 29 falls off at the node [12, 27]. This node is able to accommodate
    one more element. So, insert 29 as the last element in the node then the node
    is [12, 27, 29]. The corresponding pointer field can also be observed.


    If another element 50 is to be inserted then the search falls off at the third
    external node of the node [36, 42, 54]. As the node is full of its capacity it
    cannot accommodate 50 in it. So, the new node with the element 50 and its pointer
    field appears as the third child of [36, 42, 54]. This is illustrated in Figure
    13.3.


    # 13.3.3 DELETION


    Deleting an element from an m-way search tree also follows the search operation.
    When an element k with its left subtree pointer CL and its right subtree pointer
    CR is to be deleted it can be done in any of the following four cases.


    Case I: CL = CR = Nil, i.e. if the left and right subtrees of k are Nil then k
    is deleted and the number of pointer fields of the node is adjusted.'
