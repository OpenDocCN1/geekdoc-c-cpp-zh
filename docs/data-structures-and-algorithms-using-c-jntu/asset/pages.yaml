    The level of the node is known by the number of forward pointers it has. A node
    with k forward pointers is called a level k node. The levels of nodes can be distributed
    when every (2^i) node points to 2^i nodes ahead in the list, as 50% of the nodes
    are at level 1, 25% of the nodes are at level 2, 12.5% of the nodes are at level
    3 and so on (Figure 8.4). Levels of the nodes may be chosen randomly but with
    same proportions as shown in Figure 8.5. That is, the number of nodes at different
    levels must be considered irrespective of their positions. The i^th forward pointer
    of a node points to the next node of level i or higher instead of pointing to
    2^(i-1) nodes ahead. Now insertion or deletion does not require restructuring
    but requires only the local modifications. So, the level of the node chosen during
    its insertion need not be changed.


    # 8.3.1 Operations


    A dictionary or a symbol table can be efficiently represented as a skip list.
    Basic operations performed on them are searching, insertion and deletion. Other
    additional operations like finding the minimum key, finding the next key, etc.
    can also be easily supported by the skip list.


    A node at level 1 has i forward pointers, indexed from 1 to i. Level of the list
    is the maximum level existing in the list. When the list is empty the maximum
    level is 1. The header of the list holds forward pointers at levels 1 through
    the maximum level.


    Initially, an element NIL is allocated with a value, i.e. greater than any legal
    value. All the levels of all the skip lists terminate at NIL. A new list is initialized
    with level as 1, and all the forward pointers of the corresponding list header
    node point to NIL.'
