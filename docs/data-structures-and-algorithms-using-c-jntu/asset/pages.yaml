    \ the objects. When the destructor is invoked, the object first created will be\
    \ the last one to be released and the last one is released first.\n\n# 2.3 OPERATOR\
    \ OVERLOADING\n\nOperator overloading is a procedure to change the meaning of\
    \ the predefined operators to perform certain operations on the objects. The plus\
    \ (+) operator is a predefined operator and can be used to add two or more values\
    \ or variables. However, the same + operator cannot be used to add the variables\
    \ of two or more similar objects. C++ provides the facility to modify the meaning\
    \ of the operator (allows to redefine the predefined operators). After overloading\
