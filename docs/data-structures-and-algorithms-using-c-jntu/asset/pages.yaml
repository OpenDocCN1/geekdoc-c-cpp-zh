  md: '# 10.5.2 Depth First Traversal


    The depth first traversal arbitrarily chooses vertex V to begin the traversal
    and visits the vertex. All the adjacent vertices of V, ai are considered but only
    the first adjacent vertex ai is visited leaving the other vertices. The difference
    between the breadth first and depth first traversal can be best observed from
    this point onwards. Unlike breadth first traversal only one of the adjacent vertices
    is picked, traversed and continues to traverse from its adjacent vertex till all
    the vertices are visited. Now among the adjacent vertices of a, b1, only the first
    adjacent vertex b1 is visited and proceeds in the same manner till no more vertices
    remain unvisited. Stack is used to keep track the vertices whose adjacent vertices
    are to be visited.


    ```

    Algorithm 10.9

    depthfirsttraversal(G)

    This algorithm performs depth first traversal. V is the starting vertex of graph
    G.

    1. Set VISIT(V) to 1

    2. Display the visited vertex V

    3. Loop for each adjacent vertex A of V

    4. Check whether VISIT(A) is zero then call DFT(A)

    5. End Loop

    6. End

    ```


    The graph G21 in Figure 10.29 is used to discuss the traversal.


    ![](img/45784b9f0334626143002ec0d63692fd_329_0.png)


    # Figure 10.29 Result of DST


    The vertex ''a'' is chosen arbitrarily to begin the traversal and it is visited.
    Its three adjacent vertices ''b'', ''c'' and ''d'' are considered, but only ''b'',
    the first adjacent vertex, is selected and visited. The output of the traversal
    is ab. The output of the traversal is ab. The vertex adjacent to ''b'' is ''e''
    is visited and the output is abe. The adjacent vertex of ''e'', ''f'' is visited
    and the output of the traversal is abef. After visiting ''e'', the adjacent vertex
    of ''f'', the output of the traversal is abefi. Now, visit ''g'', the adjacent
    vertex of ''c'' to obtain the output the traversal as abefig. The adjacent vertex
    ''j'' of ''g'' is visited and the output of the traversal is abefigj. The vertex
    ''h'' adjacent to ''j'' is visited and the output is abefigjh. The vertex ''d''
    adjacent to ''h'' is visited; at this stage all the vertices are visited. So,
    the final output of the traversal is abefigjhd.


    The time complexity of depth first traversal() in case of adjacency matrix implementation
    is O(n2) and in case of adjacency list implementation is O(e). The result of the
    depth first traversal is shown in Figure 10.29.'
