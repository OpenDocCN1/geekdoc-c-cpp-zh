  md: 'Apriori analysis of Big oh notation: In this analysis, the maximum frequent
    items will be selected. In this approach, the maximum possible upper limit of
    the function constant value will be selected to represent the function as a Big
    oh notation.


    | f(x) | g(x) | |

    | :--- | :--- | :--- |

    | 10n^2 + 3n + 2 | n^2 | f(n) = O(11n^2) |

    | 4n+2 | n | f(n) = O(5n) |

    | 5 | 1 | f(n) = O(1) |


    # 3.7.1.1 Finding g(x), c and n_o Values


    # Example 1


    Let f(n) = 3n+2 for an algorithm. Computation of c, n_o, and g(n) can be performed
    as f(n) = 3n+2. The function can be written in terms of g(n) as


    ```

    f(n) <= c*g(n)

    3n+2 <= c*g(n) because the function value is more than 3n, consider c=4, then

    3n+2 <= 4*g(n) define g(x)=n

    3n+2 <= 4n find n_o.

    Put n=1      3.1+2 <= 4.1 (condition failed)

    So put n=2   3*2+2 <= 4*2 (true)

    Put n=3      3*3+2 <= 4*3 (true)

    Put n=4      3*4+2 <= 4*4 (true)

    ```


    So, as per the mathematical induction, the function f(x) can be written in terms
    of g(x), and is true from n_o=2 to all positive integers. The function f(x) can
    be defined as f(x)<=4n where n>=2


    # Example 2


    Let f(n) = 3n^4 + 2n^2 for an algorithm. Computation of c, n_o, and g(n) can be
    performed as f(n) = 3n^4 + 2n^2


    ```

    f(n) <= c*g(n) (Big oh notation)

    3n^4 + 2n^2 <= c*g(n)

    3n^4 + 2n^4 <= 4*g(n)

    3n^4 + 2n^4 <= 4*g(n)   Let g(n) = n^4

    3n^4 + 2n^4 <= 4*n^4

    for n=1   5 <= 4*1 (Failed)

    for n=2   56 <= 64 (True)

    for n=3   261 <= 324 (True)

    So, for all n>=2 f(x) = 3x^4 can be written as 4*n^4.

    ```


    # 3.7.2 Omega Notation (Ω)


    Definition: f(n) = Ω(g(n)) if there exists positive constants c and n_o, such
    that f(n)>=c*g(n) or all n>=n_o. In this case, the maximum possible lower bound
    will be selected.'
