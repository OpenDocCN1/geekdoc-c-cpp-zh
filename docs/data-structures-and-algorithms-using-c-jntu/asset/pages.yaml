    # 16.1.4 Quick Sort


    Quick sort belongs to the family of sorting by exchange where the elements which
    are out of order are exchanged themselves in order to obtain a sorted list.


    Quick sort performs sorting based on the principle of partitioning the list into
    two sublists taking any one of the elements in the list as the key element which
    is called the pivot element. Two sublists occur left and right of the pivot element,
    i.e. the pivot element will be placed in its appropriate position. Again the sublists
    are further partitioned against their respective pivot elements until there is
    no possibility to partition. At this stage all the elements in the list will be
    in sorted order. The following is the procedure for quick sort.


    Let L be an unordered list with elements [A1, A2, ..., An]


    +   1. Step 1: Suppose A1 is chosen as the pivot element, now compare A1 with
    all the elements in the list moving A1 left to right until the first occurrence
    of a greatest number Ai that is greater than or equal to A1, i.e. Ai>=A1.

    +   2. Step 2: Again A1 is compared with the elements moving right to left until
    the first occurrence of smallest number Aj, Aj<=A1 is found.

    +   3. Step 3: If i<j then Ai and Aj are exchanged.


    If i>j, then A1 is exchanged with Aj, i.e. A1 will be smaller than Aj and greater
    than Ai. At this stage partition takes place. The list will be divided into two
    sublists based on the pivot element. Algorithm 16.4 is the algorithm for quick
    sort.'
