    B, trace back by one node to A. Traversal of the left subtree of A is completed;
    as A has the right subtree it must be traversed. Move to C, the right subtree
    of A. Node C does not have any left subtree but it has the right subtree so move
    to F. Node F has the left subtree so move to H. Node H does not have both left
    and right subtrees so visit H. Trace back by one node to F. Node F does not have
    any right subtree, so visit F, trace back by one node to C. As its right subtree
    is traversed, now visit C and trace back by one node to A, the root node. Now,
    traversal of left and right subtrees is completed so visit A. Finally, the output
    of the postorder traversal of the binary tree is GDBEHFCA.


