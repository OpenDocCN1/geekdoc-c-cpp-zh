    **Column major order:** A[i,j] = all the elements in the first (j-1)th column
    + number of element from the j th column to i th row = (j-1) * r + i


    # 4.4 INITIALIZING ARRAYS


    When declaring a regular array of local scope (within a function, for example),
    no default initialization is done to the elements. So they should be initialized,
    whereas the elements of global and static arrays are automatically initialized
    with that default value, that is zero. In both the cases of local and global,
    while declaring an array, there is a possibility of assigning initial values to
    each one of its elements by enclosing the values in braces { }. For example:


