    # 11.5 EXTERNAL SORTING


    External sorting is required if the data to be sorted are large enough, which
    cannot be loaded at once in memory, and common sorting algorithms are not applicable.
    Larger files may be too large to fit in memory simultaneously and require external
    sorting. External sorting uses secondary devices (magnetic tapes or magnetic disks).
    The criteria for evaluating external sorting algorithms are different from internal
    sorts. Internal sort comparison criteria are: number of comparisons required,
    number of swaps made and memory requirement, whereas external sort comparison
    criteria are dominated by I/O time (transfers between secondary storage and main
    memory). External sorting which uses magnetic tapes is known as tape sorting.


    Runlists: External sorting is the process of sorting small groups of records from
    a file in memory. These groups are called runlists. The size of these runlists
    depends upon the internal memory used for internal sorting. These runlists are
    stored in a target file from which they are retrieved and merged together to form
    large runlists. This process is continued until a single runlist is generated,
    which is the required sorted file.


    Assume that there is a buffer enough to hold p records and a file with q records;
    always p is less than q. Sorting involves generation of runlists which are used
    to read q records into an internal buffer, sort them using internal sorting and
    write them onto a target file of size q. If the value of q is smaller than 15
    then selection sort can be used and for larger values of q heap sort can be used.
    This process of generating runlists is continued until all q records are performed.


    # 11.5.1 POLYPHASE MERGE


    Magnetic tape is a sequential storage medium used for data collection and back
    up. The main disadvantage of tape sorting is that huge amounts of tape rewinding
    takes place. Polyphase sort is one of the best method for performing external
    sorting on tapes.


    A process of distributing ordered runlists of predetermined size on to the tapes
    and continuously merging these runlists in multiple phases is the polyphase merge.
    Each phase has a fixed number of merges before a new tape is selected. The initial
    distribution of runlists on the working tapes affects the performance of sorting.
    However, it is found that the Fibonacci distribution of initial runlists produces
    better Polyphase merge is also known Polyphase sort.


    Consider sorting of 9 records using 4 tapes. Originally all the records are on
    tape 4 as shown in Figure 11.22.(a). Record is represented by its key. The nth
    order Fibonacci series is used to determine the number of runs on each tape where
    n=r-1, where T is the number of tapes. This series is defined as follows:


    ```

    F^n = F^n_{s-1} + F^n_{s-2} + ... + F^n_{s-n}

    F^n_s = 0 for 0 <= s <= n-2

    ```'
