  md: '# 13.4 B TREES


    A data structure which is a height balanced version of m-way search tree is known
    as a B tree of order m. When the growth of an m-way search tree is left uncontrolled
    then in the worst case it yields a complexity of O(n). This shows deterioration
    in performance. So, there is a need to have balanced m-way search trees which
    guarantees a complexity of O(log n) for search, insert and delete operations.


    **Definition:** A B tree of order m is an m-way search tree and it may be empty.
    If not empty then the following properties to be satisfied by the extended trees:


    +   (i) The root node should have a minimum of two children and a maximum of m
    children.

    +   (ii) All the internal nodes except the root node should have a minimum of
    [m/2] non-empty children and a maximum of m non-empty children.

    +   (iii) All the external nodes are at the same level.

    +   (iv) A leaf node must have minimum [m/2 - 1] and maximum m-1 elements.


    The 4-way search tree shown in Figure 13.2 is not a B tree because all the external
    nodes are not at the same level. All the internal nodes except the root child
    be with a minimum [4/2] = 2 children. But, the node [12, 27] is a non-root internal
    node with only one child.


    ![](img/45784b9f0334626143002ec0d63692fd_427_0.png)


    Figure 13.5 B Tree of order 3 (2-3 trees)


    B trees with order 3 are also referred to as 2-3 trees as their internal nodes
    can have only two or three children. Figure 13.5 shows a B tree of order 3. B
    trees of order 4 are also referred to as 2-3-4 or 2-4 trees.


    A B tree of order 5 is shown in Figure 13.6. In this tree the root [40, 82] has
    minimum two children. All the internal nodes except the root have minimum [m/2]
    = [5/2] = 3 children and hence two elements in corresponding order 5. All the
    external nodes are at the same level. As all the properties are satisfied, it
    is a B tree of order 5.'
  merge: -1
  img_proc: true
- pgno: 428
  md: '![](img/45784b9f0334626143002ec0d63692fd_428_0.png)


    # 13.5 OPERATIONS ON B TREES


    B tree grows in a bottom up manner. Various operations can be performed on B trees
    of order m but the most frequently used are search, insert and delete operations.


    # 13.5.1 SEARCHING


    The search operation on a B tree of order m is exactly the same as that performed
    on m-way search trees. If h is the height of the B tree of order m then the search
    operation yields a complexity of O(h).


    # 13.5.2 INSERTION


    Inserting an element into a B tree of order m is followed by the search operation
    for the same element. The place where search falls off, the element is inserted
    by following either of the cases. Case 1: In a B tree of order m, if node X in
    which the element is to be inserted can accommodate the element then it is inserted
    in the same node and the number of child pointer fields are adjusted accordingly.
    Case 2: In a B tree of order m if a node x in which the element is to be inserted
    is full, then first insert the element into its list of elements. This list is
    split into two at the median. The elements that are less than the median becomes
    the left node and that greater than the median becomes the right node. The median
    element is shifted up into the parent node of X. Accommodating the median element
    into the parent node may once again invoke either of the insertion cases. Insertion
    of element 64 into the B tree of order 5 shown in Figure 13.6 initiates search
    operation for 64. This falls at node [58, 74]. As it is not full the node is able
    to accommodate 64 and the node now appears as [58, 64, 74]. This is illustrated
    in Figure 13.7(a). To insert element 99 into the B tree the search operation for
    99 falls off at node [86, 89, 93, 97]. This node is full and cannot accommodate
    99. So, insert 99 into the list of elements, the list appears as 86, 89, 93, 97,
    99. Here the median element is 93. So, split the node at the median into two as
    [86, 89] and [97, 99]. Now the median element 93 is shifted up into the parent,
    i.e. root. Again Case 1 is invoked to insert 93 into the root. This is illustrated
    in Figure 13.7(b).'
