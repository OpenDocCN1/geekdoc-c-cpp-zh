  md: "# 16.1.8 Heap Sort\n\nThe heap sort combines the best of both merge sort and\
    \ insertion sort. Like merge sort, the worst case time of heap sort is O(n log\
    \ n) and like insertion sort, heap sort sorts by inserting the element in its\
    \ appropriate position (in-place). The heap sort algorithm starts by using procedure\
    \ BUILD-HEAP to build a heap on the input array A[1:n]. Since the maximum element\
    \ of the array stored at the root is A[1], it can be put into its correct final\
    \ position by exchanging it with A[n] (the last element in A). Now discard node\
    \ n from the heap then the remaining elements can be made into a heap. Note that\
    \ the new element at the root may violate the heap property. All that is needed\
    \ is to restore the heap property.\n\n```\nAlgorithm 16.8: HEAPSORT (A)\n1. BUILD-HEAP\
    \ (A)\n2. Loop for i=length (A) down to 2 do\n   exchange A[1] and A[i]\n   Set\
    \ heap-size [A] to heap-size [A] -1\n   HEAP (A, 1)\n3. End\n```\n\nThe HEAPSORT\
    \ procedure takes O(n log n) since the call to BUILD-HEAP takes time O(n) and\
    \ each of the n-1 calls to Heap takes time O(log n).\n\nBuilding a heap: Using\
    \ the algorithm HEAP in bottom-up order the array A[1:n] is converted into a heap.\
    \ Since the elements in the subarray A [n/2 +1: n] are all leaves, the algorithm\
    \ BUILD-HEAP goes through the remaining nodes of the tree and runs the algorithm\
    \ HEAP on each one. The bottom-up order of processing node guarantees that the\
    \ subtree rooted at the children are heap before HEAP is run at their parent.\n\
    \n```\nAlgorithm 16.8.1: BUILD-HEAP (A)\n1. Set heap-size=A )length[A]\n2. Loop\
    \ for i=floor (length[A] /2) to 1 do\n3. HEAP (A, i)\n4. End\n```\n\nHeap: The\
    \ algorithm HEAP picks the largest child node and compares it to the parent node.\
    \ If the parent node is larger than the child node then the heap process terminates,\
    \ otherwise it swaps the parent node with the largest child node so that the parent\
    \ now becomes larger than its children. It is important to note that swap may\
    \ destroy the heap property of the subtree rooted at the largest child. If this\
    \ is the case, HEAP calls itself again using the largest child node as the new\
