  img_proc: true
- pgno: 150
  md: '# ## 5.2 REPRESENTATION OF LINKED LIST IN MEMORY


    Linked lists can be represented in two ways:


    +   1. Static representation using arrays

    +   2. Dynamic representation using free storage list


    # ### 5.2.1 Static Representation


    The linked list is maintained by two linear arrays—one is used for data and the
    other for links. Let DATA and LINK be the two arrays, DATA contains the information
    part, and their corresponding pointers to the next node are stored in the array
    LINK. A pointer variable HEAD is used to store the first location of the linked
    list, and a Null pointer is used to denote the end of the list. Since array subscripts
    are positive integers, Null is represented by ''0''. Figure 5.2 Illustrates the
    static representation of a linked list.


    ![](img/45784b9f0334626143002ec0d63692fd_150_0.png)


    Figure 5.2 Static representation


    In Figure 5.2, each node of the list contains a single character. The required
    string can be obtained as follows:


    +   HEAD = 5, so DATA[5] = L is the first character. The corresponding link of
    DATA[5] is stored in LINK[5].

    +   LINK[5] = 8 shows that 8th element of DATA that holds the next element, I,
    i.e. DATA[8] = I, the second character of the string.

    +   LINK[8] = 2 shows that 2nd element of DATA that holds element I, i.e. DATA[2]
    = S, the third character of the string.

    +   LINK[2] = 1 shows that 11th element of DATA will hold element T, i.e. DATA[11]
    = T, the fourth character of the string.

    +   LIST is the required string.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 5.2.2 Dynamic Representation


    In this representation, a memory bank that is a collection of free memory space
    and memory manager program is used. When a new node to be created, the memory
    management searches the memory bank for the required memory and if it is found,
    allocates memory to the new node and whenever a node is of no use, a program called
    garbage collector is invoked to return the unused node to the memory bank. This
    type of memory management is called Dynamic Memory Management. To represent linked
    list dynamically, a special list called AVAIL, a list of available memory spaces
    that has its own pointer, is maintained. Figures 5.3(a) and (b) illustrate the
    dynamic representation of a linked list.


    ![](img/45784b9f0334626143002ec0d63692fd_151_0.png)


    (a) Allocating a new node to the list


    ![](img/45784b9f0334626143002ec0d63692fd_151_1.png)


    (b) Node returned to the memory bank


    # Figure 5.3 Dynamic representation


    In Figure 5.3(a), a new node is taken from the AVAIL and temporarily holds the
    address of the new node in the variable. The new node is then added to the existing
    list. The dotted arrow shows the insertion of the new node to the list and the
    symbol ''Φ'' is used to represent the deletion of links. The head node in the
    list does not contain any data. In Figure 5.3(b), deletion of the new node from
    the existing list is done and it is returned to the memory bank, i.e. AVAIL. The
    LINK field of the last node in the AVAIL will be pointing to the deleted node.


    Linked lists are classified into three types regardless of the number of data
    fields:


    +   * Singly linked list

    +   * Doubly linked list

    +   * Circular linked list'
