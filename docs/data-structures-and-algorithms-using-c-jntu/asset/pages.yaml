    # # 5.5 DOUBLY LINKED LISTS


    In a singly linked list, moving from one node to another node is done in only
    one direction and it is known as a one-way list.


    A doubly linked list is the one in which each node of it contains two links pointing
    to either side of the nodes. The movement in the doubly linked list is either
    of the direction i.e. either from left to right or right to left. Figure 5.16
    shows the structure of a node in a doubly linked list.


    ![](img/45784b9f0334626143002ec0d63692fd_169_0.png)


    Figure 5.16 Structure of the node


    # ## 5.5.1 REPRESENTATION OF DOUBLY LINKED LIST


    A doubly linked list is a linear data structure in which each node has two links
    called the left link (LLINK) and the right link (RLINK).


    The LLINK field of a node points to the node to its left, and the RLINK points
    to the node to its right. A doubly linked list can also be a circular list and
    it is known as a circular doubly linked list.


    ![](img/45784b9f0334626143002ec0d63692fd_169_1.png)


    (a) Doubly linked list


    ![](img/45784b9f0334626143002ec0d63692fd_169_2.png)


    (b) Circular doubly linked list


    Figure 5.17 Types of a doubly linked list


    In Figure 5.17(a), each node has two links, except the first and the last node.
    The RLINK of the last node is NULL and LLINK of the head node is NULL.


    Figure 5.17(b) shows a circular doubly linked list. Here, the RLINK of the last
    node points to the head node and LLINK of the head node points to the last node.


    # ## 5.5.2 OPERATIONS


    All the operations performed on a singly linked list can be implemented efficiently
    using a doubly linked list.'
