  md: '(3) Computer systems must often provide a “holding area” for messages between
    two processes, two programs or even two systems. This holding area is usually
    called a “buffer” and is often implemented as a queue.


    (4) In the situation where there are multiple users or in a networked computer
    system, a printer is shared among all users. When a file is requested to be printed,
    the request is added to the print queue. When the request reaches the front of
    the print queue, the file is printed. This ensures that only one person at a time
    has access to the printer and it is given on a first-come-first-served basis.


    (5) A file server in a computer network handles file access request from many
    clients throughout the network. Servers have a limited capacity to service requests
    from clients. When that capacity is exceeded, client requests wait in queues.


    (6) Most computers have only one processor, so only one user at a time can be
    served. Entries for the other users are placed in a queue. Each entry gradually
    advances to the front of the queues as the users receive service. The entry at
    the front of the queue is the next to receive service.


    +   For example:

    +   i. Modeling computer network

    +   ii. Each device is connected to the network by a ‘controller’.

    +   iii. Before each controller sends a message it checks whether the network
    is busy or not. If busy, it waits otherwise it sends a message.

    +   iv. When two controllers attempt to send a message at the same time the messages
    collide and the receiving controllers ignore it. Similarly, the sending controllers
    recognize the problem and resend their messages.


    (7) For simulation of real-world situations. For instance, a new bank may want
    to know how many tellers to install. The goal is to service each customer within
    a reasonable wait time, but not have too many tellers for the number of customers.
    To find out a good number of tellers, they can run a computer simulation of typical
    customer transactions using queues to represent the waiting customers.


    (8) When placed on hold for telephone operators. For example, when a toll-free
    number for a bank is dialed, a recording that says, Thank you for calling A-I
    Bank. Your call will be answered by the next available operator. Please wait,
    may be heard. This is a queueing system.


    # 7.6.1 SIMULATION OF TIME-SHARING SYSTEM


    In time-sharing system, various users will share a single computer simultaneously.
    Since, there is only one CPU it is shared among n users. The processor is shared
    by allowing one user program to execute for a shorter period of time and then
    another user program is allowed to execute and followed by another, etc. until
    it is returned to the point of execution in the initial user program. This cycle
    is continued repeatedly on all active user programs. This technique of sharing
    the processor among various users is known as time sharing. The following example
    illustrates the working of a time-sharing system.


    Suppose three user programs U1, U2, U3 start their on-line session at their terminals,
    which are connected to single system. The table below shows the time periods of
    the three user programs:


    | Session start | Program ID | Requested CPU time period |

    |---|---|---|

    | 0 | U1 | 3, 7, 2 |

    | 1 | U2 | 1, 2, 1, 1 |

    | 2 | U1 | 3, 5, 1 |'
