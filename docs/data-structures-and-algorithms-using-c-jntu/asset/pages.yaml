    To store the value 75 in the third element of A, the statement is written as A[2]=75;
    to pass the value of the third element of A to any variable then the statement
    is a = A[2]. Notice that the third element of A is specified as A[2], since the
    array index starts from zero, i.e. the first one is A[0], the second one is A[1],
    so the third one is A[2] and the last element is A[4]. Therefore, A[5] refers
    to the sixth element of A and this exceeds the size of the array.


    In C++ it is syntactically correct to exceed the valid range of indices for an
    array. This will create problems, since accessing out-of-range elements do not
    cause compilation errors but can cause run-time errors. At this point it is important
    to clearly distinguish between the two uses of subscripts [ ] related to arrays.
    They perform two different tasks: one is to specify the size of arrays when they
    are declared, and the second one is to specify indices for concrete array elements.


    ```

    int A[5];        //declaration of a new array

    A[2];            //access to an element of the array

    ```


    The data type always precedes a variable or array declaration, while it never
