  md: "# 3.5 SPACE COMPLEXITY\n\nThe number of units of space the algorithm requires\
    \ is called a space complexity of the algorithm. Each vector variable is allocated\
    \ with one unit of space in the space complexity of the algorithm. But in the\
    \ programs, space complexity depends on the data types used and number of data\
    \ items used.\n\nSpace complexity of a program is the total memory space required\
    \ at the execution time. Each and every executable program will have the following\
    \ sections and occupies memory:\n\n+   - Text section\n+   - Data section\n+ \
    \  - Bss section\n+   - Rodata section\n+   - Stack section\n+   - Heap section\n\
    \n# 3.5.1 Instruction Space\n\nThe total memory space occupied by all the instructions\
    \ at the runtime is called as instruction space. The instruction space can be\
    \ calculated based on the static or dynamic libraries that the program uses. During\
    \ execution, dynamic libraries (DLLs) can be loaded into the memory based on the\
    \ runtime and on the conditional requirements. If any dynamic libraries are not\
    \ introduced in the program, then the total space occupied by all the instructions\
    \ will be called as instruction space.\n\n# 3.5.2 Text Section of a Program\n\n\
    Text section of an executable program contains the processor instructions of the\
    \ program. Memory size of each instruction depends on the word length and is platform\
    \ dependant (processor and the operating system). Total memory space occupied\
    \ by all the instructions will be called Instruction space.\n\n# 3.5.3 Data Space\n\
    \nTotal memory space required by all the initialized variables, uninitialized\
    \ variables, static and constant variables is called data space of a program.\n\
    \n+   i. Data section of the executable program\n+   Data section contains all\
    \ the initialized global variables and static variables.\n+   \n+   ii. Rodata\
    \ section\n+   Rodata is nothing but read only data. Rodata section consists of\
    \ all the constants of a program. The user cannot modify the data of this section.\n\
    +   \n+   iii. Bss section\n+   Bss section contains all the uninitialized global\
    \ variables and static variables.\n+   \n+   iv. Heap section\n+   Heap section\
    \ contains all the dynamically created data of the program. This section will\
    \ occupy memory only when the program is in executed.\n\nThe data space is nothing\
    \ but the total memory space occupied by all the data, Bss, rodata and heap sections."
