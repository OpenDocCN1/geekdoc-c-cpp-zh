    The major differences between a tree and a binary tree are:


    +   - A tree can never be empty whereas a binary tree can be empty with no nodes.

    +   - There may be any number of subtrees for a node in a tree. There must be
    either zero or one or two subtrees for a node in a binary tree.

    +   - There is no ordering of subtrees in a tree, but the ordering of left and
    right subtrees of all nodes is clearly maintained in a binary tree.


    A binary tree is very similar to a tree in its structure and terminology. The
    additional features with respect to binary tree are:


    +   1. A binary tree with n elements will have n-1 number of edges, where n>0.

    +   2. At level i a binary tree can have at most 2^(i-1) number of nodes, where
    i>=1.

    +   3. A binary tree of height h can have minimum h and maximum 2^h -1 number
    of nodes, here h>=0.

    +   4. For a binary tree with n elements, height is minimum [log2(n+1)] and maximum
    n.

    +   5. In a binary tree the number of non-terminal nodes will be one less than
    that of the number of terminal nodes.


    A binary tree of height h that consists of maximum permissible number of children
    to all nodes, i.e. 2^h-1 nodes is known as a full binary tree. Figure 9.5 illustrates
    a full binary tree of height 4. The nodes of a full binary tree are numbered 1
    through 2^(h-1) starting from root at level 1 to nodes at level h and from left
    to right.


    A binary tree that has maximum permissible number of nodes at all the levels except
    at the last level and if all the nodes at the last level as far as left as possible
    is known as a complete binary tree.


    The nodes of a complete binary tree are also numbered in the same way as a full
    binary tree. Using this numbering, it is easy to find the parent, the left and
    the right children of a node.


