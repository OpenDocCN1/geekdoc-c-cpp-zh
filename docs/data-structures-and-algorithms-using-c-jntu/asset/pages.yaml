  md: '# 10.3.2 LINKED REPRESENTATION OF GRAPHS


    The linked representation of a graph G=(V, E) with n vertices and e edges creates
    n head nodes with respect to n vertices. Each of these head nodes refers to a
    singly linked list that holds the adjacent vertices of the vertex corresponding
    to the head node.


    This representation is also known as an adjacent list representation. This is
    also referred to as a star representation when implemented as a table.


    The linked representation is considered to be efficient over its counterpart of
    sequential representation with a time complexity of O(n+e) for directed and O(n+2e)
    for undirected graphs. Figure 10.20 shows the adjacency list representation of
    graph G25.


    ![](img/45784b9f0334626143002ec0d63692fd_312_0.png)


    Figure 10.20 The adjacency list representation of graph G25.


    # 10.4 OPERATIONS ON GRAPHS


    Several operations can be performed on graphs. The primitive operations that are
    required to maintain a graph are:


    +   1. Create a graph

    +   2. Insertion of a vertex

    +   3. Deletion of a vertex

    +   4. Insertion of an edge

    +   5. Deletion of an edge

    +   6. Search for a vertex

    +   7. Traversal of a graph

    +   8. Deletion or destroy a graph


    Other operations such as vertex count, vertex''s indegree, vertex''s outdegree,
    etc. are application dependent.


    Data structure of a graph: Adjacency list representation can be used to store
    the graph. A head structure can be added to hold the metadata regarding the list.
    Here only count of vertex in a graph is stored along with the pointer to first
    vertex. Vertex node holds the data about the vertex. The node structure of the
    vertex is chosen to contain six fields. In addition to the data, pointers to next
    vertex and first edge, it also contains indegree,'
