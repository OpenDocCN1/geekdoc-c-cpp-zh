  md: '# # Chapter 10


    # # Graphs


    This chapter provides a brief introduction to the concept of graphs and discusses
    the basic terminology of graphs. Various popular and widely used representations
    of graphs are explained along with examples. Different operations that are frequently
    applied on graphs are explained with algorithms, examples and their implementations.
    Breadth and Depth first traversals of a graph are also exemplified. The chapter
    also includes the detailed discussion of the Prim''s algorithm regarding the minimal
    cost spanning tree of a graph among the listed applications, followed by the Abstract
    Data Type of graph.


    # ## 10.1 INTRODUCTION


    Graph theory is applied in diverse areas such as social sciences, physical sciences,
    communication engineering and others. Graph theory also plays an important role
    in several areas of computer science such as Artificial Intelligence, Formal Languages,
    Computer Graphics, Operating Systems and Compiler Design. Graphs are widely used
    in the representation of data structures.


    # ## 10.2 BASIC TERMINOLOGY


    Graphs have various terms that one has to know before discussing other related
    aspects.


    **Graph:** A graph G = (V, E) consists of two sets. A set V called the set of
    all vertices or nodes and a set E called the set of all edges or links or arcs.
    The set E is the set of pair of elements from V.


    ![](img/45784b9f0334626143002ec0d63692fd_301_0.png)


    Figure 10.1 Graph G1'
