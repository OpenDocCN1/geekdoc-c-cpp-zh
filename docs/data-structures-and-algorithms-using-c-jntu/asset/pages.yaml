  md: 'consider only the right subtree of T to search the key u. If the key u is equal
    to the key at the root then the search is successful. If the root is null then
    it is an unsuccessful search. In the same way the search is continued in the subtrees
    also till the key u is either found or not. If the key u is found then it is a
    successful search, else it is an unsuccessful search.


    All external searches end at corresponding internal nodes, whereas all unsuccessful
    searches end at corresponding external nodes of a binary search tree. External
    nodes can also be termed as failure nodes. As specified in Section 11.1 the inorder
    traversal of a binary search tree produces the elements in ascending order such
    as x1, x2, x3, ..., xn. Same is the case with external nodes e1, e2, ..., en.
    Here e1 catches all the unsuccessful searches of the keys that are less than x1,
    e2 catches all unsuccessful searches of keys between x1 and x2 and so on, i.e.
    e1 catches all the unsuccessful searches of keys that are greater than x1 and
    less than xn.


    While searching for a key, in binary search tree by comparing the key with the
    root element, search operation proceeds in only one of its subtrees. Hence, binary
    search tree is advantageous over sequential list and efficient in performing searching
    in a faster manner.


    In case of successful search if the key is found at the root itself then it is
    considered to be the best case and its time complexity is O(1). If the key is
    found as one of the leaf nodes at a level equal to the height h of the binary
    search tree then the time complexity is O(n). In still worst cases the height
    h may be equal to the number of elements n, then the time complexity is O(n).
    In an average case where frequent insertions and/or deletions are assumed, the
    height h of the binary search tree is O(log n) and the time complexity is O(log
    n).


    # Algorithm 12.1 BST-SEARCH


    This algorithm is used to search an ITEM in a binary search tree. Let PTR be the
    pointer to the node containing ITEM.


    +   1. Check whether tree is empty.

    +   2. Set PTR to root node pointer.

    +   3. Loop until PTR is not equal to NULL.

    +   4. CASE 1: check whether ITEM is less than the root node value, then proceed
    to left subtree.

    +      CASE 2: check whether ITEM is equal to root node value, then write “ITEM
    found at,” PTR.

    +      CASE 3: check whether ITEM is greater than the root node value, then proceed
    to right subtree.

    +   5. End case

    +   6. End loop

    +   7. Write “ITEM not found”, when PTR=NULL.


    ![](img/45784b9f0334626143002ec0d63692fd_381_0.png)


    Figure 12.3 A binary search tree'
