    # Figure 6.5 Pop operation


    Push and Pop are the two important operations that are performed on the stack.
    In addition, Show and Size operations can also be performed on a stack. Show operation
    displays all the elements of the stack if it already has some elements. If not
    (i.e., if the stack is empty) it displays a message that the stack is empty. Size
    operation returns the number of elements in the stack.


    # 6.3.1 ARRAY IMPLEMENTATION OF A STACK


    Suppose STACK [1 : N] is a linear array that represents a stack. Top is a pointer
    variable that holds the location of the top element of the stack and N is the
    number of elements that can be stored in a stack. Top = 0 or NULL represents that
    the stack is empty, and Top = N represents that the stack is full. The following
    are the algorithms for Push and Pop operations using arrays.


    # Algorithm 6.1: PUSH (STACK, N, TOP, ITEM)


    This algorithm pushes an ITEM into a STACK; N is the maximum size of a stack.


    +   1. [check for stack overflow]

    +      If Top=N then write:"stack overflow" and return

    +   2. Set Top=Top+1 //increment Top by 1

    +   3. Set STACK[Top] = ITEM //insert item in new Top position

    +   4. End


    # Algorithm 6.2: POP (STACK, TOP, ITEM)


    This algorithm deletes the top element of the STACK and assigns it to the variable
    ITEM.


    +   1. [check for stack underflow]

    +      If Top=0 then write:stack underflow and return

    +   2. Set ITEM=STACK[Top] //initializing Item with Top element

    +   3. Set Top=Top-1 //Decrementing top by 1

    +   4. End


    Consider a stack with five elements called NUMBERS [1:5] of numerical values.
    The insertion of values 10,20, 30,40,50 and deletion are shown in Figure 6.6.'
