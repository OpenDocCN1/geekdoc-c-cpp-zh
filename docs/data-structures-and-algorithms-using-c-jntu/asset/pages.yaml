  md: '# # Chapter 14


    # # Red–Black Trees and Splay Trees


    This chapter introduces the data structures, red-black trees and splay trees.
    It describes how red-black trees exist with the reason behind them along with
    its definition and representation. Most popular operations on red-black trees
    are exemplified. Splay trees, splay rotations and amortized analysis with respect
    to splay trees are also explained in the chapter. This chapter also includes the
    applications of red-black trees and splay trees.


    # ## 14.1 INTRODUCTION


    B trees of order m discussed in the earlier chapter have a number of applications
    as they minimize disk accesses. To implement its node, sequential data structures
    like arrays may be invoked. So, in a B-tree of order m every node requires two
    arrays of maximum size m–1 and m for elements and child pointers, respectively.
    This leads to the wastage of space in the worst case. The elements of each of
    the nodes in the B tree can be maintained as a binary search tree and this would
    be an effective solution when the order of the B tree is small. But, branches
    that link the nodes of binary search tree must be different from the branches
    that link the nodes of a B tree. This yields a special type of binary search tree
    called red–black tree. A 2–4 tree shown in Figure 14.1(a) is considered. Each
    node is represented as a binary search tree as shown in Figure 14.1(b). Here,
    the thin lines represent branches that link the nodes of binary search tree, whereas
    the thick lines show the same in between the nodes of the original B–tree. The
    resulting red–black tree shown in Figure 14.1(c) is formed when a light shade
    (red) is given to the thin lines and nodes hanging from them and grey shade (black)
    is given to the thick lines and nodes hanging from them. The root node is always
    shaded black.


    **Definition:** A red-black tree is an extended binary search tree in which all
    the nodes and edges are coloured either red or black. It should satisfy the following
    properties:


    +   1. The root node and all the external nodes are coloured black.

    +   2. In every root node to an external node path no two consecutive red nodes
    should appear.

    +   3. The number of black nodes in all root node to the external node path must
    be same.


    From a parent, a black child is connected with the black edge and a red child
    must be connected with the red edge. Based on the colours of the pointers or edges
    the above definition can have the following additional properties:'
