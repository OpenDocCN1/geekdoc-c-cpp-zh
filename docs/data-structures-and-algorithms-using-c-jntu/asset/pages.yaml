  md: '# # Pattern Matching and Tries


    Pattern matching and Tries are introduced along with terminology. The chapter
    discusses about Brute Force Algorithm, Boyer–Moore Algorithm and Knuth–Morris–Pratt
    Algorithm in detail along with examples and their applications. Categories of
    Tries namely standard tries, compressed tries and suffix tries and operations
    on them are explained clearly with applications.


    # ## 15.1 INTRODUCTION


    In the day-to-day life of a computer user string matching has greater importance.
    During text editing, the user processes the text, organizes the text into sections
    and paragraphs and reorganizes the text very frequently. The text text searched
    to find a substring or pattern and replace it with some other text. Efficiency
    of the search algorithm is very important when searching for larger text unlike
    in the case of a dictionary. The algorithm does not depend only on the alphabetical
    order of words. For instance, in molecular biology the importance of string searching
    algorithms is increasing day-by-day. Its usage is in locating some pattern in
    the string, comparing the sequences with usual subsequences and extracting information
    from DNA. With the assumption that a perfect match cannot be expected, sort of
    processing should be done very often. Stringology handles this type of problems
    and its major area of interest is pattern matching.


    A tree-based data structure that supports keys with varying sizes is known as
    a Trie. In search operation tries uses some parts of the key. Trie belongs to
    the category of multi-way trees.


    # ## 15.2 TERMINOLOGY


    A pattern is a set of elements or recurring events. Elements can be a template
    or model which can be used to generate things or parts of a thing. A pattern is
    a uniquely identifiable event.


    A word in the given text document is a pattern, and the pattern (word) is framed
    by means of putting alphabets in an order.


    A sentence can be called as a pattern, and the pattern (sentence) is framed by
    means of putting words in an order.


    An image of a human face from a photo can be called as a pattern, and the pattern
    (face of a human) is framed by means of putting pixels in an order.


    So, the pattern is an ordered set of events like alphabets, words, pixels, etc.
    in the natural word.'
