  md: 'Consider node 1 as the root node, it has two incident edges with 4 and 6 as
    their costs. The edge with minimum cost 4 is selected and used to connect 1 with
    2. Node 2 has only one edge with cost 8; this is used to connect nodes 2 and 3.
