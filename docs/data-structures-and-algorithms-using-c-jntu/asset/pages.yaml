    # SUMMARY


    +   - The bubble sort works by iterating down an array to be sorted from the first
    element to the last, comparing each pair of elements and switching their positions
    if necessary.

    +   - Insertion sort inserts each element of the array into its proper position
    leaving progressively larger stretches of the array sorted.

    +   - Quicksort is a relatively simple sorting technique using the divide-and-conquer
    recursive procedure.

    +   - Merge sort is a fast, stable sorting routine with guaranteed O(n log n)
    efficiency.

    +   - The idea of Shell sort is to arrange the data sequence in a two-dimensional
    array and sort the columns of the array.

    +   - Radix sort keeps the elements in order by comparing the digits of the numbers.

    +   - Heap sort is a relatively simple technique built upon the heap data structure.

    +   - Searching is the process of finding the location of a given element in a
    set of elements.

    +   - Linear is the technique of searching a given item in the list by comparing
    each and every element in the list sequentially.

    +   - Binary search is a technique of searching an item in the ordered list by
    dividing the list into two halves with each comparison until the item is found
    or not.

    +   - The Fibonacci search is a technique of searching a sorted array using the
    divide and conquer principle.

    +   - Fibonacci search determines the next element for comparison based on the
    sequence of the Fibonacci number and it performs a search technique only on the
    ordered list.'
  merge: -1
  img_proc: true
