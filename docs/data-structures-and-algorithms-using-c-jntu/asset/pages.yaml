  md: '# # Linked List


    Chapter 5 discusses and exemplifies the data structure called linked list. The
    static and dynamic representations of linked list are clearly explained. A rigorous
    discussion of singly linked lists, circular linked lists and doubly linked lists
    along with their representation and operations is given. The chapter also compares
    various types of linked list along with arrays. This chapter continues with advantages,
    disadvantages, applications and ADT, i.e. Abstract Data Type of Linked Lists.


    # ## 5.1 INTRODUCTION


    Arrays are linear data structure for which memory should be allocated in advance
    to maintain the adjacency of the data elements. Once the memory is allocated,
    it cannot be extended as per the need. So, arrays are static data structures.


    The implementation of insertion and deletion operations and storage of memory
    are not efficiently performed using arrays.


    Linked list overcomes the pitfalls of arrays; linked lists are also known as dynamic
    data structures because allocation of memory will be done at the runtime, which
    can be extended as per the need. A linked list is also a linear collection of
    data elements called nodes, and the adjacency of elements is provided by the links
    or pointers. The general structure of the node is shown in Figure 5.1.


    | Data Item 1 | Data Item 2 | ... | Data Item n | Link 1 | Link 2 | ... | Link
    n |

    |---|---|---|---|---|---|---|---|

    | \multicolumn{4}{c}{Data part} | \multicolumn{4}{c}{Link part} |


    Figure 5.1 General structure of a node


    Linked list does not store the nodes in contiguous locations as do the arrays,
    whereas the link field in the node maintains the address of its neighbour.'
