    in Figure 13.6


    # 13.5.3 DELETION


    Deleting an element from a B Tree of an order m may be performed according to
    one of the four cases.


    Case 1: This deletion is the simplest of all the cases. An element belongs to
    a leaf node and deleting it does not make the node with the number of elements
    less than its minimum number of elements. In this case the element is deleted
    from the leaf node and the child pointers are adjusted accordingly.


    Case 2: When an element x from a non-leaf node is to be deleted, replace x with
    the largest element from its left subtree or the smallest element from its right
    subtree. The replaced element must be deleted from the node and as it happens
    to be from a leaf node; Case 1 is followed to delete it.'
