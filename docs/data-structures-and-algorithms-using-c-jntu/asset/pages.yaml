    # 9.8 CONVERSION OF A TREE INTO A BINARY TREE


    Representation of a binary tree in programs is easier to that of a tree. Therefore,
    a general tree should be converted into a binary tree. This can be done using
    the following procedure:


    +   1. Identify the branch from the parent to its first child and these branches
    become left branch or subtree in the binary tree.

    +   2. From the leftmost child use a branch to connect the node with a node to
    its right of the same parent if any, which are at the same level. These become
    the right branch or subtree in the binary tree.

    +   3. Remove all branches that are not required from the parent to its children.


    Consider a tree shown in Figure.9.11(a). According to the first step of the procedure,
    node 1 is the root node, its first child is node 2. Similarly, node 6 is the first
    child of 2, node 9 is the first child of node 3 and node 10 is the first child
    of node 5. So, 2, 6, 9 and 10 become the left branches to their parents. These
    are shown by the pointed links in Figure 9.11(b).


    According to the second step of the procedure from the leftmost child, node 2
    connects nodes 3, 4, 5 that are right to it, children of the same parent and at
    the same level. Similarly, from node 6 connect nodes 7, 8 and from node 10 connect
    nodes 11 and 12. These are shown by the pointed horizontal links in Figure 9.11(c).
    These become the right branches of the binary tree.'
