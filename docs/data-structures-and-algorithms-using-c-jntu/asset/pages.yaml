    # ## 6.2 REPRESENTATION OF A STACK


    The representation of a stack in the memory can be done in two ways. They are
    as follows:


    +   - Static representation using arrays

    +   - Dynamic representation using linked lists


    # ### 6.2.1 ARRAY REPRESENTATION OF A STACK


    Stack can be represented using a one-dimensional array. Allocate a block of memory
    required to accommodate the full capacity of the stack, and the items of a stack
    are stored in a sequential manner from the first location of the memory block.


    ![](img/45784b9f0334626143002ec0d63692fd_192_1.png)


    Figure 6.2 Stack and its array representation


    In Figure 6.2(a), stack is a one-dimensional array. Top is a pointer that points
    to the top element in the stack.'
