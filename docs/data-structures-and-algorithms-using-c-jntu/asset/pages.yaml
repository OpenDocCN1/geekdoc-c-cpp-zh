    +   - Step 1: A loop designed to distribute the runs on the tapes. The distribution
    is a Fibonacci distribution.

    +   - Step 2: Rewind tapes to allow them to be read.

    +   - Step 3: Merge and sort: During merging runs from the source tapes are compared
    and sorted and written on object (output tape). When the source tape becomes empty
    it takes on the role of an object tape. The earlier object tape becomes the source
    tape.


    To keep the example simple all initial runs are assumed to be of length 1 (one
    record in each run). In practice these runs should be made as large as possible.
    Nine initial runs are available on tape 4. The initial run distribution on tapes
