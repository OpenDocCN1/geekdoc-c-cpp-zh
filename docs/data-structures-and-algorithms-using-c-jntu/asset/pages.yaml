    The transformations that are performed to solve the LL and RR type imbalances
    are known as single rotations, and that of LR or RL type imbalances are known
    as double rotations. The transformation of LR type imbalance can be considered
    as the sequence of an RR rotation followed by an LL rotation, and that of RL type
    imbalance can be considered as an LL rotation followed by RR rotation.


    # Algorithm 12.4 Insertion into an AVL tree


    +   1. GETNODE (X)

    +   2. DATA(X) = element

    +   3. LCHILD(X) = RCHILD(X) = NULL and bf(x) = 0

    +   4. If the tree T is empty then

    +      (a) Set T to X.

    +      (b) Exit.

    +      //when AVL search tree T is non empty.

    +   5. Starting from the root search the place to insert the new element.

    +   6. Identify the most recently seen node with balance factor of either -1 or
    +1 as the ancestor node A.

    +   7. If the element already exists

    +      (i) Print "Insertion not possible as the element already exists".

    +      (ii) Exit.

    +   8. If no ancestor node A exists then update the balance factors in the path
    from root and exit.

    +   9. If ancestor node A is found then

    +      (a) If (bf(A) == +1 and the new node is inserted in the right subtree of
    A) or (bf(A) == -1 and the new node is inserted in the left subtree of A) then

    +          (i) bf(A) = 0.

    +          (ii) Update the balance factors of all the nodes on the path from A
    to the newly inserted node.

    +          (iii) Exit.

    +      (b) Else

    +          (i) Recognize the type of imbalance at A and execute the appropriate
    rotation.'
