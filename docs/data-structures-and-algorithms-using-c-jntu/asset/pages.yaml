    # 8.4 HASH TABLE


    Hash table is an efficient method of implementing dictionaries. A hash function
    is used to map dictionary pairs into the positions of a hash table. A bucket array
    is used for a hash table. It is an array of size n. Each and every cell in the
    array is treated as a bucket and it is used to hold the key-value pairs. When
    an item is looked up, its key is hashed to find the appropriate bucket. Then,
    the bucket is searched for the right key-value pair. If a bucket can store only
    one element and when two keys are mapped to the same bucket then collision occurs.
    Efficiency of a hash function lies in avoiding collisions. Using the hash function
    all the operations on the hash table such as searching for a key-value pair, inserting
    a key-value pair or deleting a key-value pair are performed.


    # 8.4.1 Hash Functions


    When a table with n elements and m positions, where n<=m is considered then to
    assign positions to the elements n number of hash functions can be used.


    Some of the methods that are used for creating a hash function are as follows:


    +   1. The division method

    +   2. The multiplication method

    +   3. Truncation

    +   4. Folding

    +   5. Extraction


    1. The division method: Map a key k into one of m slots by taking the remainder
    of k divided by m. That is, the hash function is

    h(k)=k mod m.

    Example: If table size m = 12, key k = 100 then

    h(100) = 100 mod 12

    = 4


    Values of m such as m = 2^b should be avoided. Good values for m are primes, and
    are not too close to exact powers of 2.


    2. Truncation: Ignore some digits of the key and use the rest as the array index.
    When the keys are alphabets, then their numerical equivalents can be considered.
    The problem with this approach is that there may not always be an even distribution
    throughout the table.

    Example: If student ID''s are the key 928324312 then from the 9-digit number select
    just the 4th and 8th position digits as the index, i.e. 31 as the index.


    3. Folding: Partition the key into several pieces, i.e. two or three or more parts.
    Each of the individual parts is combined using any of the basic arithmetic operations
    such as addition or multiplication. The resultant'
