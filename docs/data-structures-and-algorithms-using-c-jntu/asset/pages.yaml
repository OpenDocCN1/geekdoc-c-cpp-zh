  md: '# # Chapter 7


    # # Queues


    Chapter 7 discusses about queues and its variants such as circular queues and
    doubly ended queues. The static, dynamic representation and operations of all
    the types of queues are explained and exemplified. Various applications of the
    queues are listed, and one of the applications called Simulation of Time-Sharing
    System is explained in detail.


    # ## 7.1 INTRODUCTION


    Queue is a linear data structure in which insertions are made at one end called
    rear, and deletions are made at the other end called front. A queue is also known
    as a structure that models the first-come first-serve order or equivalently the
    first-in first-out (FIFO) order. That is, the element that is inserted first into
    the queue will be the element to be deleted first, and the element that is inserted
    last is deleted last. The insertion operation in the queue is also known as enqueue,
    and deletion is also referred as dequeue. The main difference between a queue
    and a stack is that elements in a queue are put at the bottom and taken off from
    the top whereas in a stack, elements put at the top and taken off from the top.


    # ### Examples


    +   - An electronic mailbox

    +   - A waiting line in a store, at a service counter, on a one-lane road, at
    a bank, at a bus stop, playlist for jukebox, etc.

    +   - Equal-priority processes waiting to run on a processor in a computer system

    +   - Printer jobs

    +   - CPU processes


    Queues are more difficult to implement than stacks, because operations are performed
    at both the ends. The simplest implementation uses an array, adds elements at
    one end and moves all the elements when one of the elements is taken out of the
    queue.'
