    # 12.5 OPERATION OF AVL SEARCH TREES


    The following are the common operations that are performed on AVL search trees.


    # 12.5.1 SEARCHING


    Searching for an element in an AVL search tree is quite similar to the search
    operation on a BST. Algorithm 12.1 and its implementation in Program 12.1 can
    also be used to search an element from an AVL search tree also. The height of
    an AVL search tree of n elements is O(log n) and, hence, the time complexity of
    a search operation on it is also O(log n).


    # 12.5.2 INSERTION


    Inserting an element into an AVL search tree follows the same procedure as the
    insertion of an element into a binary search tree. But, the insertion may lead
    to a situation where the balance factors of any of the nodes may be other than
    –1, 0 and +1 and the tree is unbalanced.


    In order to rebalance the tree, i.e. to acquire all balance factors as –1 or 0
    or 1, some of the subtree of the unbalanced trees are to be shifted is also known
    as rotations. This can be shown in Figure 12.9.


    The following observations can be made regarding an unbalanced tree due to insertion:


    +   1. The balance factor of an unbalanced tree can only be among –2, –1, 0, 1
    and +2.


    +   2. After insertion, for the nodes whose balance factor is either +2 or –2
    their corresponding balance factors before insertion would have been +1 or –1,
    respectively.'
