    \ if not used correctly leads a program to be more complicated.\n+   - As Vtables\
    \ grow the performance of the program decreases.\n\n# ## 2.4.6 DELEGATION\n\n\
    In object-oriented programming, two classes can be joined either by using inheritance\
    \ or delegation. Delegation is a mechanism in which the object of one class is\
    \ used as a member of another class. The kind of relationship in inheritance is\
    \ IS KIND OF whereas in delegation HAS-A relationship.\n\n```\nclass x\n{\n};\n\
    class y\n{\n};\nclass z\n{\n  x a; //object of class x\n  y b; //object of class\
    \ y\n}\n```\n\nHere class z has two data members a, b which are objects of other\
