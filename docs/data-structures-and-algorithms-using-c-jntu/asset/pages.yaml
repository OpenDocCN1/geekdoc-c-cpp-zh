  md: 'Splay trees do not require balance or height information and hence are easier
    to implement. Splay trees are cheaper to AVL trees over long sequences of retrievals.
    This is shown using the techniques of amortized analysis. It is an analysis over
    a sequence of operations, among them the expensive operations are averaged over
    less expensive operations. If O(n) is the time complexity of one access then for
    the sequence of m operations the amortized analysis of access in a splay tree
    is O(mlog n).


    # 14.4.1 Splay Rotations


    All the operations performed on a splay tree are the same as that of on a binary
    search tree. But after performing the operation the tree is splayed with respect
    to the referred node. That is the node is moved up towards the root node using
    the mechanism called splay rotations. They are similar to AVL tree rotations and
    follow the bottom up method from the node to the root node.


    Splaying tree is aimed to make the referred or accessed node as the root node.
    In this regard the accessed node x and its parent node px and its grandparent
    node gx are affected. To perform splaying x should be moved two levels up in every
    step. When the parent node px became the root node then splaying remains with
    the last step. i.e. x is one step down the root and single rotation is required
    for x to become the root. To do so the path from the root to the referred node
    x is to be tracked. When the path turns left it is termed as zig and when it turns
    right it is termed as zag.


    So, in the case when x is a single step down the tree the path would be either
    a zig or zag. When two steps are to be considered, the path would be four rotations,
    one among zig-zig, zig-zag, zag-zig or zag-zag. In the case of even length of
    the path from root node to the referred node x, corresponding two step series
    of rotations are used. In case of odd length, the final rotation will be one of
    the corresponding single step series. The single step and the two step series
    are as shown in Figure 14.19.


