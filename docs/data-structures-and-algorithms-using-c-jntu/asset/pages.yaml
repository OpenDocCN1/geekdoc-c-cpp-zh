    # 10.6 APPLICATIONS


    The following are the some of the applications of graphs:


    +   * Minimum cost spanning tree

    +   * Single-source shortest path

    +   * Union-find problem

    +   * Connectivity of components


    Minimum cost spanning tree can be found using either Prim''s or Krushkal''s algorithms.
    The following is the illustration of Prim''s algorithm to find the minimum cost
    spanning tree.


    A graph G of n vertices is considered, its spanning tree with minimum cost is
    to be found. Using Prim''s algorithm an arbitrary vertex is considered as a root
    node. Among various incident edges, a minimum cost edge is selected to connect
    the root node with other nodes b, similarly this node is connected with another
    node. This process is continued till all the nodes are connected. Finally a minimum
    cost spanning tree of a given graph is obtained.'
