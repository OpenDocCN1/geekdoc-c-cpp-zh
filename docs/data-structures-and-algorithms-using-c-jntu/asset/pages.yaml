  md: '# Arrays


    From this chapter the study of data structure starts with the definition of data
    structure and classifying them as linear and non-linear data structures. Array,
    linear data structure, is considered in this chapter. Here, a clear explanation
    about what array is, array types and array representation is given. This chapter
    also discusses the initialization of arrays, accessing values of an array, array
    operations and how arrays are passed as parameters. The character sequences, applications
    and ADT of arrays are also covered in depth.


    # 4.1 INTRODUCTION


    Data structure is the logical or mathematical model of representing data. The
    data which comprise the data structure and its fundamental operations is known
    as Abstract Data Type (ADT).


    Abstract data type is a conceptual specification of a data type which includes
    description of objects and operations but not implementation in order to fulfill
    the following:


    +   - Maximize reuse

    +   - Promote object-oriented techniques

    +   - Make the code easier to maintain


    Abstract Data Type:


    An ADT contains:


    +   - Various attributes

    +   - May have maximum size

    +   - Operations


    In order to create an actual instance of the ADT in a program, the real data that
    needs to be manipulated is added to it, but the ADT manipulation need not change.


    Data structures are classified in two ways:


    +   - Linear data structures

    +   - Non-linear data structures


    In linear data structures, all the elements are arranged in sequence. Examples
    for linear data structures are arrays, linked lists, stacks and queues.'
