  md: '# 11.5.2.1 2-Way Merge Sort


    # Algorithm 1.2


    +   **Pass 0:**

    +   * Read each of the N pages page-by-page

    +   * Sort the records on each page individually

    +   * Write the sorted pages to disk (the sorted page is referred to as a run)
    (Pass 0 writes N=2^0 sorted runs to disk, only one page of buffer space is used)


    +   **Pass 1:**

    +   * Select and read two runs written in Pass 0,

    +   * Merge their records

    +   * Write the new two-page run to disk (page-by-page) (Pass 1 writes 2^7/2^2+1
    runs to disk, three pages of buffer space are used)


    +   **Pass n:**

    +   * Select and read two runs written in Pass n-1,

    +   * Merge their records

    +   * Write the new 2^n-page run to disk (page-by-page)

    +   * Pass n writes 2^n-2 runs to disk, three pages of buffer space is used)


    +   **Pass s:**

    +   * Pass s writes a single sorted run (i.e. the complete sorted file) of size
    2^s=N to disk.


    The storage requirements to perform 2-way merge sort are two input buffers and
    one output buffer (Figure 11.23). More generally, for a k-way merge k + 1 buffers
    are required.


    ![](img/45784b9f0334626143002ec0d63692fd_367_0.png)


    # Figure 11.23 Required buffers for 2-way merge sort


    During pass 0 only one buffer is used. In pass 0 the pages are sorted using some
    sorting algorithm. In subsequent passes merging is done and during these passes
    two buffers for input and one buffer for output are used. A typical tree view
    that emerges for sorting 8 pages using the 2-way merge sort is shown in Figure
    11.24.


    A file with 8 pages using 2-way merge sort is given in Figure 11.25. It took 4
    passes to sort the file. In pass 0 the initial single pages are sorted. The sorted
    pages are the output of pass 0. They are known as single page runs. In pass 1
    two single page runs are merged. The output of this pass 1 is a 2-page run. Similarly,
    the output of pass 2 is a 4-page run and the output of pass 3 is an 8-page run.
    It took total four passes by 2-way merge sort using 3 buffers.'
