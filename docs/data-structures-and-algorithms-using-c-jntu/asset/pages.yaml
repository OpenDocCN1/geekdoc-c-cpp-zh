  md: '# Priority queue can be implemented using:


    +   1. Unsorted list: Store all elements in an unordered list. The element is
    added at the end of the list. An element with min/max priority is removed by searching
    the list. The problem with this approach is that it is expensive to search. The
    time required for inserting an element is O(1), whereas the time required to delete
    an element with minimum/maximum priority is O(N) where N is the number of elements.

    +   2. Sorted list: Keep the list always sorted. The cost for inserting an element
    is O(N) and for deleting an element with min/max priority is O(1).

    +   3. Binary search tree: A third alternative is the binary search tree. This
    gives a O(log N) average running time for insertion and deletion operations. The
    problem is that the tree could be unbalanced on non-random input.

    +   4. Heap: A heap is a complete binary tree, where the element at each node
    is greater than or less than or equal to the element in its children. To add an
    element to a heap, place the new element at the next available spot and perform
    a reheapification. To remove the element, move the last node onto the root and
    perform a reheapification. The time for insertion could be as much as O(log N)
    and for deletion an average running time is O(log N), where N is the number of
    elements (nodes) in the tree.


    # 11.2 PRIORITY QUEUE ADT


    The abstract data type for a min priority queue is given in Figure 11.2.


    ```

    empty() : return true iff the queue is empty

    full() : return true iff the queue is full

    minEleRet() : returns element with minimum priority, but element is not deleted

    insertEle() : insert an element into the queue

    deleteMinEle() : remove/delete the element with min priority from the queue

    ```


    Figure 11.2 Abstract data type specification of a min priority queue with basic
    operations


    The abstract data type for a max priority queue is given in Figure 11.3.


    ```

    empty() : return true iff the queue is empty

    full() : return true iff the queue is full

    maxEleRet() : returns element with maximum priority, but element is not deleted

    insertEle() : insert an element into the queue

    deleteMaxEle() : remove/delete the element with max priority from the queue

    ```


    Figure 11.3 Abstract data type specification of a max priority queue with basic
    operations


    # 11.3 PRIORITY QUEUE IMPLEMENTATION USING HEAPS


    A priority queue is effectively implemented using heap data structure, which is
    a complete binary tree that is most efficiently stored by using the array representation.
    A heap is a binary tree that is completely filled with the possible exception
    of the bottom level, which is filled from left to right. Such a tree is known
    as a complete binary tree. A complete binary tree of height h has between 2^h
    and 2^(h+1) - 1 nodes. This implies that the height'
