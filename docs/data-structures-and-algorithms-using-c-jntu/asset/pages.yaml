  md: '# # Priority Queues


    The chapter defines priority queues and its abstract data type. It discusses about
    various implementations of priority queues in detail regarding heaps, insertions
    and deletions of min and max heaps. This chapter details external sorting using
    multiway merge and polyphase merge.


    # ## 11.1 INTRODUCTION


    Queues are FIFO structures in which the elements are deleted in the order in which
    they arrive in the queue. The order of insertion and deletion from a priority
    queue is determined by the element priority. The elements are removed in the decreasing
    or increasing order of priority of elements. A priority queue which is a data
    structure allows at least two operations: insert and delete. The operation insert
    inserts an element into the priority queue and the operation delete deletes an
    element from the priority queue based on priority. It is possible to add other
    operations to this data structure.


    +   Basically, priority queues are of two types. They are.

    +   1. Ascending priority queue (Min Priority Queue)

    +      - Removal of minimum-priority element

    +   2. Descending priority queue (Max Priority Queue)

    +      - Removal of maximum-priority element


    The specification view of priority queue is given in Figure 11.1(a). This view
    elides the implementation strategy of a priority queue.


    ![](img/45784b9f0334626143002ec0d63692fd_337_0.png)


    Figure 11.1 Abstract model of a priority queue'
