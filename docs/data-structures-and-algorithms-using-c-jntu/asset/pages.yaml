    # 16.1.7 Radix Sort


    Radix sort was originally used to sort punched cards in several passes. A computer
    algorithm was invented for radix sort in 1954 by Harold H. Seward. This sort is
    performed on a mechanical card sorter. Each card contains 80 columns, and each
    column may contain a character of alphabet. When sorting is performed on this
    type of card sorter, only one column is examined at a time.'
