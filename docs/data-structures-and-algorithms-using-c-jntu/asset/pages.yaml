  md: '# 13.6 HEIGHT OF B TREES


    Let T be a B tree of order m and height h with n elements. Since a B tree with
    order m is an m-way tree, then m satisfies n ≤ m^h–1. Now the upper bound of n
    is known, then what is its lower bound? That is what is the minimum number of
    elements that a B tree of order m and height h can hold. First find the minimum
    number of nodes in levels 1, 2, 3 ... (h+1), where h+1 is the level at which external
    nodes exist, let t = ⌈m/2⌉. The minimum number of nodes on the levels 1, 2, 3
    ... (h+1) is given by 1, 2, 2t, 2t^2, ... , 2t^(h-1), so the lower bound of n
    is given by n ≥ 2t^(h-1).


    Since the number of external nodes is 1 more than the number of internal nodes,
    the lower bound of n is n ≥ 2t^(h-1)-1. Hence, the lower and upper bound of n
    is 2t^(h-1)-1 ≤ n ≤ m^h–1. From this it can be represented in logarithms very
    easily as log_m((n+1)) ≤ h ≤ log_t((n+1)/2) + 1 which determines the best and
    worst case complexities of operations on B trees, which is given by O(h), the
    height of the B tree.


    # 13.7 VARIATIONS OF B TREE


    B* tree and B+ tree are the two popular variations of the B trees.


    # 13.7.1 B* Tree


    In a B tree with huge number of elements, space requirements may become excessive.
    This is because nearly half of the elements will be empty. The first variation,
    B* tree, discusses the space usage of large trees. Instead of each node containing
    a minimum of half of the maximum entries, the minimum is reduced to two-thirds.


    In case of node overflows, instead of immediately splitting, the data are redistributed
    among the siblings of the node. This delays the creation of a new node. Splitting
    occurs only in the case when all of its siblings are full. When the nodes are
    split, data from the two full siblings are distributed among the two full nodes
    and the new node resulting in two-thirds full in all the three nodes. Figure 13.10
    shows the redistribution when 99 is inserted in the B tree of order 5 shown in
    Figure 13.6. Its counterpart B tree with splitting is shown in Figure 13.7(b).


    ![](img/45784b9f0334626143002ec0d63692fd_442_0.png)'
