    # 3.5.6 CALCULATING THE DATA SPACE


    The data space is the total space occupied by the data, rodata, bss and heap sections
    of the executable program. So, let the space occupied by each of the said section
    is found. Because there is no dynamic memory allocation, the heap section will
    not be created at the runtime.


    | Idx | Name | Size |

    |---|---|---|

    | 1. | .data | 00000000 |

    | 2. | .bss | 00000000 |

    | 3. | .rodata | 00000010 |


    From the disassembled program object dump, Table 3.1 shows the size occupied by
    each of the program sections in hexadecimal.


    # 3.5.7 SIZE OF DATA SECTION


    This section holds all the initialized global variables. In the program, there
    are no initialized variables. So, the size will be zero. In Table 3.1, the first
    row shows the size occupied by the data section 00000000 is nothing but zero.


    # 3.5.8 SIZE OF RODATA SECTION


    Rodata section consists of constant values, because the section itself is a read-only
    section. In the above program, a constant is declared with 3.141. The constant
    value has taken 00000010 of hexadecimal or 16 bytes in decimal.


    # 3.5.9 SIZE OF BSS SECTION


    This section consists of uninitialized global data because there are no uninitialized
    variables. So, the size of the bss section should be zero. As shown in Table 3.1,
    the bss section taking 00000000 is nothing but zero.


    So, the total data space is


    Data space = size (data section) + size (rodata) +size (bss section)

    Data space = 0 + 16 + 0= 16 bytes


    The total space complexity of the program is


    Space complexity = Instruction space + data space + stack space

    Space complexity = 48 + 16 + 0 = 64 bytes


    So, the space complexity of the given program is 64 bytes.'
