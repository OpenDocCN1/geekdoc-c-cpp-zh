  md: '# 6.2.2 LINKED REPRESENTATION OF A STACK


    Representing a stack using arrays is easy and convenient. However, it is useful
    for fixed sized stacks. Sometimes in a program, the size of a stack may be required
    to increase during execution, i.e. dynamic creation of a stack. Using a linked
    list, a stack can be dynamically created. A singly linked list is used to represent
    a stack. Figure 6.3 shows the linked representation of the stack. Here, the node
    consists of data and link fields. Data field is to store the items and data link
    field is to point to the next field.


    ![](img/45784b9f0334626143002ec0d63692fd_193_0.png)


    Figure 6.3 Linked representation of a stack


    The item in the first node is the top of the stack and the item in the last node
    is the bottom of the stack.


    # 6.3 OPERATIONS ON STACK


    The basic operations on stacks are:


    +   (i) PUSH—insertion of the elements into a stack

    +   (ii) POP—deletion of the elements from the stack


    Push operation: Inserting an element into the stack is called push operation.
    Check for Stack Overflow condition i.e. whether the stack is full of elements
    or not before performing Push operation. Every time an element is pushed into
    the stack, the top must be incremented. In Figure 6.4, the stack has 2 elements
    10, 5.


    ![](img/45784b9f0334626143002ec0d63692fd_193_1.png)


    Figure 6.4 Push operation


    Pop operation: Deleting an element from the stack is called Pop operation. Check
    for the Stack Underflow condition before performing Pop operation, i.e. whether
    the stack is empty or not. Every time an element from the stack is deleted, the
    top must be decremented by one. Now, the top points to the current top element
    of the stack. In Figure 6.5, the stack is empty after popping all the elements.'
