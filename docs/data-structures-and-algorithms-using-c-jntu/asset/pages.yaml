- pgno: 120
  md: 'When a problem is considered, the apriori approach is performed as a function
    of a parameter that is related to instances of the problem. The size of input
    instances is often used as a parameter. For different classes of problems there
    are algorithms that consider the number of basic operations or element comparisons
    or multiplications as a parameter in order to find out the efficiency.


    Apriori analysis is totally machine, language and program independent. In apriori
    analysis, algorithm efficiency can be studied on any input instances of any size.


    For a given program, a apriori analysis computes its efficiency by considering
    the frequency count of the statement as a function of the total frequency count
    of the statements in the program. Here, the frequency count is the number of times
    the statement is getting executed in the program.


    Consider the statement c=a+b that is appearing in the following three program
    segments. The frequency count is estimated as


    | Program Segment 1 | Frequency Count |

    | :--- | :--- |

    | . . . | . . . |

    | c=a+b; | 1 |

    | . . . | . . . |

    | **Total Frequency Count is 1** | |


    | Program Segment 2 | Frequency Count |

    | :--- | :--- |

    | . . . | . . . |

    | for i=1 to n do | n+1 |

    | c=a+b; | n |

    | end | n |

    | . . . | . . . |

    | **Total Frequency Count is 3n+1** | |


    | Program Segment 3 | Frequency Count |

    | :--- | :--- |

    | . . . | . . . |

    | for j=1 to n do | n+1 |

    | for i=1 to n do | \sum ... |

    | c=a+b; | n^2 |

    | end | \sum ... |

    | **Total Frequency Count is 3n^2+3n+1** | |


    In Program segment 1, the frequency count of the statement is 1. In Program segment
    2 it is n as its for loop executes for n times. In Program segment 3 it is n^2
    because it is embedded in a nested for loop where each of them are executed for
    n times.


    In the three program segments, the total frequency counts are 1, (3n+1) and 3n^2+3n+1,
    respectively. The order of magnitude of the total frequency counts is proportional
    to 1, n and n^2. The notation O is explained in the Section 3.7.'
  merge: -1
