    # 12.4 AVL TREES


    In 1962, Adelson-Velskii and Landis proposed balanced or height balanced trees
    known as AVL trees. An AVL tree is one among the balanced trees and the height
    of the tree will be O(log n) in the worst case. AVL trees are height balanced
    versions of binary search trees.


    Definition: An empty binary tree is an AVL tree. A non-empty binary tree T is
    an AVL tree if and only if (i) the left subtree T<sub>L</sub> and right subtree
    T<sub>R</sub> of T are also AVL trees (ii) |h(T<sub>L</sub>) - h(T<sub>R</sub>)|
    <= 1 where h(T<sub>L</sub>) and h(T<sub>R</sub>) are the heights of left and right
    subtrees of T, respectively.


    The balancing factor of a node u, denoted as bf(u), can be defined as bf(u) =
    h(u<sub>L</sub>) - h(u<sub>R</sub>), where h(u<sub>L</sub>) is the height of the
    left subtree of u and h(u<sub>R</sub>) is the height of the right subtree of u.


    Every node u of an AVL tree is allowed to have a balancing factor bf(u) of -1
    or 0 or +1.


    A binary search tree which is (also possesses the quality of) an AVL tree is known
    as an AVL search tree. Figure 12.8 gives a clear view of the above-discussed terms.
    The balancing factors of the corresponding nodes are shown within parentheses
    adjacent to the nodes. Observe how the balance factors are either -1 or 0 or 1.


    Representation of AVL tree and AVL search trees are very similar to that of binary
    trees and BTSs using a linked representation. In order to facilitate insertion
    and deletion operation efficiently an additional field called balance factor bf
    can be added with the node structure to hold the balance factor of a particular
    node.'
