  md: '# Object Oriented Concepts


    In Chapter 1, a review of some important features of C++ have been covered. This
    chapter starts with Object- oriented Goals and Principles. It proceeds with the
    discussion about constructors, destructors, overloading of constructors and operators.
    It also concentrates on other important concepts of C++ such as inheritance, polymorphism,
    abstract classes, generic programming with function and class templates. Finally
    it covers recursion.


    # 2.1 GOALS AND PRINCIPLES


    Object - Oriented design has some goals that are to be achieved in developing
    a modern software. The object- oriented principles are to be followed in the design
    to facilitate the goals.


    # 2.1.1 OBJECT ORIENTED DESIGN GOALS


    The software implementation should achieve the following important design goals:


    +   - Robustness

    +   - Adaptability

    +   - Reusability


    # 2.1.1.1 Robustness


    Developers want to produce robust software, which gives right output for all the
    inputs, and the software must be robust, which is capable of handling unexpected
    inputs.


    Robustness of software not only handles unexpected inputs but also yields accurate
    solutions. For example, if a user tries to store more elements in a data structure
    than expected then the software should have the capacity to expand this structure
    to take more elements. This feature is available in C++. The vector class of C++
    standard template library defines a dynamically growing array.


    Software should also achieve correctness for all its possible inputs including
    boundary cases such as when an integer value is 0 or 1 or the maximum or minimum
    possible values. However, robustness and correctness do not come automatically,
    they must be designed right from the beginning.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 2.1.1.2 Adaptability


    Adaptability is also called evolvability or portability. This is the ability that
    the software can work with minimal changes on all different hardware and open
    system platforms.


    # 2.1.1.3 Reusability


    Reusability is a process of reusing the existing code wherever it is required.
    As components of different systems are used in multiple applications, the software
    is reused. Developing quality software is very expensive. By re-using, the software
    cost can be reduced. If proper care is not taken when reusing the software, it
    leads to several software errors. Reusability of software saves cost and time.


    # 2.1.2 Object Oriented Design Principles


    The important principles of the object-oriented approach that serves the above
    goals are as follows:


    +   - Abstraction

    +   - Encapsulation

    +   - Modularity


    # 2.1.2.1 Abstraction


    Abstraction is a mechanism to present only the essential features without including
    their background details. Consider Yahoo mail, when a user submits the username
    and password it opens the mail, when the user clicks on the compose button, it
    opens the compose box. However, the user does not know what are the actions performed
    internally to open the compose box. Just opening the compose box is an essential
    feature and internal actions performed to open the compose box is not an essential
    feature for the user. Thus, using abstraction what is to be performed is known
    but not how.


    Abstract data types (ADT) have evolved by applying abstraction in the design of
    data structure. An ADT of data structure specifies the data that are stored, the
    fundamental operations performed on them along with arguments and their types.


    An ADT is an interface that deals with the performance of operations. However,
    not how they are performed. An ADT is represented as a class in C++.


    # 2.1.2.2 Encapsulation


    Wrapping of data and code into one single unit is known as encapsulation. It is
    also known as data hiding. The data are not accessible to the outside world. Combining
    code and data creates an object. Data hiding allows the users to use the object
    without knowing the internal working of it.


    With encapsulation, the programmers can freely implement the details of a system
    but the only thing is that an abstract interface is to be maintained. Encapsulation
    supports adaptability by allowing only part of the program to be changed without
    affecting other parts of the program.


    # 2.1.2.3 Modularity


    A large modular system can be divided into a number of components or modules that
    can be implemented independent of each other. Every module implements a set of
    related data structures and functions. Modern programming languages including
    C++ supports modularity.


    Modular software design makes software maintenance easier and provides reusability.
    Modularity makes Object-oriented Programming (OOP) an effective programming method.'
