    Figure 13.1 Node structure in an m-way search tree


    A 4-way search tree is depicted in Figure 13.2. Nodes have a maximum of 4 child
    nodes out of which some are external nodes.


    ![](img/45784b9f0334626143002ec0d63692fd_422_1.png)


    Figure 13.2 A 4-way search tree'
