    # ## 15.6 TRIES


    A trie pronounced as ''try'' is a tree-based data structure, stores the large
    text string as a tree for fast pattern matching. The word "trie" came from the
    word "retrieval". When multiple patterns are to be searched over a large text
    string, the tries are best suitable.


    Unlike binary trees, the tries can have any number of children. The pattern matching
    starts by matching the prefix of the text string to be compared. Trie is a tree-like
    structure, the shape of the trie depends on the data nodes that the trie holds.


    **Different types of tries:**


    +   * Standard Tries

    +   * Compressed Tries

    +   * Suffix Tries


    # ## 15.6.1 STANDARD TRIES


    In the standard tries, each character is represented as a node in the tree. Standard
    trie starts with a node called root node. If a set of strings (say ''S'') is to
    be processed for the pattern matching with multiple patterns, then the standard
    trie preprocesses (stores the strings) as a tree. If all the sets of strings of
    ''S'' do not have the different prefix characters, then the tree becomes an ordered
    tree.


    This approach avoids the multitime character matching. The procedure returns the
    index occurrences of the pattern by a single time match. It uses less storage
    space and a fast pattern search. Standard tries are suitable for the application
    like search for a word in a document.


    Let a set of strings S = {ant, animal, blew, blue} is to be searched for the specified
    pattern, in the preprocessing step the set ''S'' is arranged as a tree as shown
    in Figure 15.3.'
