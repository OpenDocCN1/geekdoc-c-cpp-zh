    # Figure 12.4 Insertion of an element 20 in the BST shown in Figure 12.3


    # 12.3.3 DELETION


    The three different cases in which a node is deleted from a BST are when it


    +   i. is a leaf node

    +    ii. has only one subtree (either left subtree or right subtree)

    +    iii. has both left and right subtrees


    Case i: When the node to be deleted is a leaf node then the deletion is simple
    because only the link field of its parent node should be set to NIL. This is illustrated
    in Figure 12.5(a).


    Case ii: When the node to be deleted has either a left or right subtree then the
    link field of its parent node should be set to point the corresponding subtree.
    This is illustrated in Figure 12.5(b).


    Case iii: When the node to be deleted has both left and right subtrees then it
    is replaced either with the largest element in the left subtree or with the smallest
    element in the right subtree. After the replacement, the replacing element is
    deleted from its original position in the tree by using the appropriate deletion
    methods discussed in Case i or Case ii. It is assured that the replacing element
    has either empty subtrees or any one non-empty subtree. The right subtree holds
    the elements that are greater than u.


