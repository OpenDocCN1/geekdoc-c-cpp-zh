    # SUMMARY


    +   - A tree whose nodes have more than two branches are termed as *multiway*
    trees.

    +   - Binary search tree is a two-way search tree. An m-way search tree is an
    extended binary search tree.

    +   - B trees are the height balanced versions of m-way search trees.

    +   - Operations on an m-way search tree are the extensions of operations on binary
    search trees.

    +   - The search, insert and deletion operations on an m-way search tree of height
    h have the complexity as O(h). An m-way search tree of height h will have a minimum
    of h and a maximum of m^h-1.

    +   - B* tree and B+ tree are the two popular variations of the B trees.

    +   - B* tree discusses the space usage of large trees. Instead of each node containing
    a minimum of half of the maximum entries, the minimum is reduced to two-thirds.

    +   - In B+ tree though elements are found in the internal nodes their corresponding
    data entry is found at the leaf level. As the internal nodes are used only for
    searching, they do not hold data.

    +   - In B+ tree every leaf node is with an additional pointer and is used to
    proceed to the next leaf node in sequence.


