    # 10.5 GRAPH TRAVERSALS


    Similar to the case of trees, traversal visits elements of the nodes in a particular
    manner. Graphs can be traversed in two ways. They are:


    +   - Breadth first traversal

    +   - Depth first traversal


    # 10.5.1 BREADTH FIRST TRAVERSAL


    An arbitrary vertex V is selected to begin the traversal, visit the vertex. All
    the adjacent vertices of V, a, are visited. Now, the unvisited adjacent vertices
    of each a1,b1 are visited. This process continues till all the vertices of the
    graph are visited. The vertices whose adjacent vertices are to be visited are
    kept in queue.'
