    # ### 3.3.1 BRUTE FORCE ALGORITHMS


    The brute force algorithm tries to find all the possible cases until the satisfactory
    solution is found.

    Example: Finding the best path for the travelling salesman problem.


    # ### 3.3.2 DIVIDE AND CONQUER ALGORITHMS


    The divide and conquer algorithm tries to divide the solution of a problem into
    smaller sub-problems of the same type and tries to solve the problems recursively.
    Finally, all the smaller sub-problem solutions will be combined to get the full
    solution. These algorithms will always contain recursive calls to the sub-algorithms
    or sub-routines.

    Example: Quick sort, merge sort.


    # ### 3.3.3 DYNAMIC PROGRAMMING ALGORITHMS


    The dynamic programming algorithm remembers the past results and uses them to
    find the results. These algorithms are used for optimization problems. Here, programming
    refers to finding the new results in combination with the old results.


    # ### 3.3.4 GREEDY ALGORITHMS


    The greedy algorithms are also used to solve the optimization problems. At each
    step, the greedy algorithm tries to get the best solution without considering
    the future consequences. Finally, all the best local solutions will be combined
    to get the global optimal solution.

    Example: Suppose a bus ticket collector wants to take 5 rupees from his bag:


    +   - First he searches for the 5 rupees coins.

    +   - If it is not found, he tries to take 2 two rupee coins and 1 one rupee coin
    to make 5 rupees.

    +   - If this is not found, he tries to take 1 two rupee coin and 3 one rupee
    coins to make 5 rupees.

    +   - If this is also not found, he collects 5 one rupee coins to make 5 rupees.


    # ### 3.3.5 BRANCH AND BOUND ALGORITHMS


    The branch and bound algorithms are used to solve the optimization problems in
    miss-classified problems such as decision trees. As the algorithm process proceeds,
    it tries to form sub-problems, apply upper and lower bounds. If the bound matches,
    that will be the feasible solution or else a new partition will be created. This
    process continues until the best solution is found.


    # ### 3.3.6 RECURSIVE ALGORITHMS


    The simple recursive algorithm uses recursive procedures or repetitive steps to
    get the solution.

    Example: Reversing an ''n''-digit number.'
