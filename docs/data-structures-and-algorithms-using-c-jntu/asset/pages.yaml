  md: '# 13.7.2 B+ Tree


    In large file systems, both random and sequential processing of data are required.
    For such systems most of the popular file organization methods prefer and use
    the B tree to process the data randomly. But, when the data are to be processed
    sequentially the B trees take much processing time in moving up and down the tree
    structure. This inefficiency leads to the second variant of the B tree, B+ tree.

    B+ tree differ from B tree in two points. They are:


    +   1. Though elements are found in the internal nodes their corresponding data
    entry must be represented at the leaf level. As the internal nodes are used only
    for searching, they do not hold data.

    +   2. Every leaf node is with an additional pointer and is used to proceed to
    the next leaf node in sequence.


    A B+ tree is illustrated in Figure 13.11.


    ![](img/45784b9f0334626143002ec0d63692fd_443_0.png)


    To find the required data, search is performed only at the leaf level when the
    data are processed randomly. Thus, the search time is slightly increased. To process
    the data sequentially the far left entry is identified and then proceed to process
    the data similar to the way of processing a linked list in which every node is
    an array;


    # 13.8 APPLICATIONS


    Various data structures along with search trees like binary search trees and AVL
    search trees support search and retrievals on small amounts of data that can be
    stored in the internal memory of the computer. The large amount of data that are
    to be stored in external storage devices must also have efficient techniques for
    storage and retrievals. Efficient retrievals are based on indexes. Though indexes
    are just lookup tables, they are required to be represented using efficient data
    structures to provide the essential services in an efficient manner. B trees provide
    solutions for this.


    # 13.8.1 DATABASES


    A database is a collection of data organized in an order and allows updating,
    retrieving and managing the data. Data are not restricted to a particular type.
    Database may contain voluminous data with millions of records that require many
    gigabytes of storage. A database to be useful and useable should allow one to
    perform some desired operations such as storage and retrieval at a faster rate.
    These databases cannot be stored entirely in internal memory. To index the data
    and for faster access B trees are useful. The worst case runtime to search an
    unsorted and unindexed database with n elements is O(n). It will be O(log n) when
    the same data are indexed using a B tree. Indexing huge amounts of data significantly
    increases search performance. B trees ideally suit to store indexes, its internal
    node stores <key, address> pair. During retrieval fewer accesses are called because
    of'
