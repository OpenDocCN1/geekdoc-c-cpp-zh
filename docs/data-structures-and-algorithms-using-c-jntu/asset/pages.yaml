    # (b) Implementation view


    # Figure 11.1 Continued


    The implementation view of a priority queue is given in Figure 11.1(b). In this
    view the implementation strategy of a priority queue is given.


    Assume Pqueue is a priority queue with elements A, B, C, D whose priorities are
    given as 3, 2, 1, respectively.


    Here the element A has the highest priority, i.e. 3. When the new element with
    the highest priority as 4 is to be inserted, it is added at the front of the queue.
    When elements with the same priority are to be inserted then the priority queue
    acts like a normal queue with FIFO principle.


    Let task be the queue of tasks (t). Assume that 0, 1, 2 ... n are the priorities
    given to t tasks. Let t_i(n) be the i^th task with priority n. The implementation
    of priority queue to process these tasks is discussed for a set of tasks, insertion
    and task completion which is as follows:


    +   Initially task is with t_1, t_2, t_3 tasks with priorities 1,1,0, respectively.


    | t1 | t2 | t3 |

    |---|---|---|

    | Front | | Rear |


    Highest priority task t_1(1) is at the front, and the lowest priority t_1(0) is
    at the rear.


    +   The task t_1(2) with priority 2 comes, it is inserted at front


    | t4 | t1 | t2 | t3 |

    |---|---|---|---|

    | Front | | | Rear |


    +   When task t_1(2) is to be inserted, t_4 and t_5 both have the same priority
    based on the FIFO property t_5 that is inserted.


    | t4 | t5 | t1 | t2 | t3 |

    |---|---|---|---|---|

    | Front | | | | Rear |


    The elements are removed in the decreasing or increasing order of priority of
    elements.


    | t4 | t5 | t1 | t2 | t3 |

    |---|---|---|---|---|

    | Front | | | | Rear |


    When the decreasing order of elements is considered, task t_4 with highest priority
    is deleted first.


    | t5 | t1 | t2 | t3 |

    |---|---|---|---|

    | Front | | | Rear |


    Task t_5 is deleted and then t_1, t_2, t_3 are deleted, respectively, based on
    the priority.


    | t1 | t2 | t3 |

    |---|---|---|

    | Front | | Rear |'
