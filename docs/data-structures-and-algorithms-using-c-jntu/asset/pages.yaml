  md: 'the base class is specified with the access specifier. If no access specifier
    is specified, then the default specifier will be private if the derived class
    is a Class. If the derived class is a structure, then the default specifier will
    be public.


    # ## 2.4.1 Base Class Access Control


    The derived class will have the members of the base class based on the declaration
    type such as private, public or protected and the access specifier at the time
    of inheriting the base class.


    The members of the base class will be protected from the derived class based on
    the access specifier. All the private members of the base class will not be inherited
    by the derived class irrespective of the access specifier.


    In case the derived class is a class, the following cases will be based on the
    access specifier:


    +   Case 1: Access specifier is public:

    +   a. All the public members of the base class will become the public members
    of the derived class.

    +   b. All the protected members of the base class will become the protected members
    of the derived class.

    +   c. All the private members of the base class will not be inherited to the
    derived class.


    +   Case 2: Access specifier is protected:

    +   a. All the public members of the base class will become the protected members
    of the derived class.

    +   b. All the protected members of the base class will become the protected members
    of the derived class.

    +   c. All the private members of the base class will not be inherited to the
    derived class.


    +   Case 3: Access-Specifier is private

    +   a. All the public members of the base class will become the private members
    of the derived class.

    +   b. All the protected members of the base class will become the private members
    of the derived class.

    +   c. All the private members of the base class will not be inherited to the
    derived class.


    # ## 2.4.2 Types of Inheritance


    There are two basic classifications of inheritance


    +   - Single inheritance

    +   - Multiple inheritance


    Based on the above existing classifications, inheritance can be further divided
    into various types that are as follows:


    +   1. Hierarchical inheritance

    +   2. Single-level inheritance

    +   3. Multi-level inheritance

    +   4. Hybrid inheritance

    +   5. Multipath inheritance


    # ## 2.4.2.1 Single Inheritance


    If a class is derived from a single base class, this type of inheritance is called
    single inheritance. The new class is called the derived class, and the old class
    is called the base class.


    Example


    Class B is derived from a single Class A; here Class A is the base class and Class
    B is the derived class.'
