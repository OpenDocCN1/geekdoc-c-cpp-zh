  md: '# Multiway Trees and B Trees


    This chapter is dedicated to the discussion of multiway trees and B trees. The
    structure of a node in m-way trees and operations on them are explained in detail.
    Stating the drawbacks of m-way search trees, the need for B trees is explained
    along with its definition. Regarding B trees operation performed on them and its
    height are discussed. This also includes variations of B trees and database as
    an application of B trees.


    # 13.1 INTRODUCTION


    The tree data structures in which a node has more than two branches are termed
    as multiway trees. Data structures m-way search trees and B trees come under this
    category. In some applications like Database very large index entries may be found.
    Such index can be maintained as m-way search trees than AVL search trees which
    are just balanced binary search trees. A binary search tree is a two-way search
    tree. An m-way search tree is an extended binary search tree and supports more
    efficient retrievals. B trees are the height balanced versions of m-way search
    trees.


    Definition: An m-way search tree T may be an empty tree. If T is a non-empty m-way
    search tree then the following properties can be observed from it:


    +   1. Every node can have a maximum of m subtrees, where m is some integer and
    known as the order of the tree.

    +   2. A node with k subtrees will have k–1 elements where k<=m.

    +   3. All the elements of a node will be in ascending order when a node with
    k subtrees is considered then k1, k2, k3, ..., kk-1 are the elements of the node
    in the order k1<k2<k3<...<kk-1. The subtrees will be C1, C2, ..., Ck.

    +   4. The subtree with root C0 will have the elements that are less than k1 and
    that of Ck will have elements that are greater than kk-1. The subtree with root
    Ci will have the elements that are greater than ki and less than ki+1. 1<=i<=k.

    +   5. All the subtrees are once again m-way trees.'
  merge: -1
  img_proc: true
