- pgno: 8
  md: '# # Preface


    The study of data structures is a basic component of Computer Science and Engineering.
    People who work in any phase of a software system require a bare minimum knowledge
    of data structures. So, all Computer Science, Engineering and other allied disciplines
    offer courses on this subject. The hand-in-hand relationship between data structures
    and their algorithms and their complexity analysis is also a point of discussion.


    Data Structures and Algorithms Using C++ helps one to master data structures,
    their algorithms and analysis of complexities of these algorithms.


    This book meets the requirements of the course curricula of almost all the universities.
    Every chapter of the book includes the Abstract Data Type (ADT) and applications
    along with a detailed explanation of the topics. We present an implementation
    vehicle for these data structure concepts using C++ programming language known
    for its power, reusability and portability.


    The first two chapters of the book are dedicated to reviewing C++ programming
    concepts and object-oriented concepts. Those who are familiar with programming
    in C can cope with C++ by going through Chapters 1 and 2.


    Chapter 1 discusses about the class, defining class members and object declaration.
    It covers I/O streams, access control, class scope and static class members. It
    also includes functions, this pointer, dynamic memory allocations and exception
    handling.


    Chapter 2 explains object-oriented goals and principles, constructors, destructors,
    overloading of constructors and operators. It also covers inheritance, polymorphism,
    abstract classes, generic programming with function, class templates and recursion.


    Chapter 3 provides an extensive study of algorithms. Starting with basic notations,
    types of algorithms and performance analysis are covered. A very detailed explanation
    of space complexity—the instruction space, data space and stack space—is discussed
    in depth. It also includes apriori analysis, asymptotic notations (Big oh, omega,
    theta and little oh) and time complexity.


    Basic and linear data structures are covered in Chapters 4–7. Chapter 4 defines
    and classifies the data structures into linear and non-linear data structures.
    It provides a detailed of a linear data structure—array, its types and representation.
    Array initialization, accessing values of an array, array operations, arrays passed
    as parameters and character arrays are also explained.


    Chapter 5 discusses and exemplifies the linked list. The static and dynamic representations
    of a linked list are explained. It covers singly linked lists, circular linked
    lists and doubly linked lists along with representations and operations.


    Stacks and queues are exclusively dealt with in Chapters 6 and 7. The representation
    and implementation of these data structures are explained along with examples.
    Various operations of stacks are discussed in Chapter 6. Circular queues and doubly
    ended queues are explained in Chapter 7.


    Chapter 8 covers dictionaries and linear lists, skip lists and hash table representations
    of dictionaries. It includes collision occurrences, techniques to overcome the
    collisions and comparisons of chaining and open addressing.


    The study of non-linear data structures is considered from Chapter 9 onwards.
    Chapter 9 defines the tree, its related terminology and representations. It covers
    binary tree—its representation, operations, traversals and threaded binary tree.
    It also includes the conversion of a general tree into a binary tree.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Chapter 10 discusses graphs, the basic terminology of graphs, its representations
    and operations. Breadth and depth first traversals of a graph are also exemplified.
    It also includes Prims Algorithm in finding the minimal cost spanning tree of
    a graph.


    Chapter 11 defines priority queues, implementations of priority queues and operations
    on min and max heaps. It includes external sorting using multiway merge and polyphase
    merge. Chapter 12 deals with the definitions of binary search trees and AVL trees
    along with their representations. It lists the drawbacks of binary search trees
    and states the need of AVL trees as a remedy. Chapter 13 is dedicated to the discussion
    of multiway trees and B trees. It includes the node structure of an m-way tree,
    its operations, drawbacks and the need for B trees. It also covers B tree operations
    and other variations of B trees.


    Chapter 14 introduces red-black trees and splay trees. It also discusses the popular
    operations on red-black trees. Splay trees, splay rotations and amortized analysis
    with respect to splay trees are also explained. Pattern matching and tries are
    introduced along with terminology in Chapter 15. It includes the Brute Force Algorithm,
    the Boyer-Moore Algorithm and the Knuth-Morris-Pratt Algorithm in detail. Categories
    of tries namely standard tries, compressed tries and suffix tries and their operations
    are also explained in detail.


    The last chapter, Chapter 16, is about sorting and searching. It covers bubble
    sort, insertion sort, selection sort, quick sort, merge sort, shell sort, radix
    sort and heap sort. It also includes popular and frequently used searching techniques
    like linear search, binary search and Fibonacci search.


    Every chapter discusses the topics clearly in depth illustrated with examples,
    appropriate diagrams and tables. From Chapter 4 onwards, each chapter is provided
    with Abstract Data Type (ADT) of the corresponding data structures and several
    real-world applications explained clearly.


    The concepts and techniques regarding each data structure, their representation,
    implementation and applications are clearly exemplified. Each chapter includes
    clear and detailed codes of programs with sample data and outputs, which help
    a student with minimum knowledge of programming in understanding and extending
    them to other operations also. The technical content of the chapter is summarized
    at the end of each chapter. The exercise part of the chapter helps the students
    in self-testing their skills theoretically and practically (laboratory sessions).


    An overall emphasis of concepts, programs, applications and exercises makes a
    student know, understand, implement and feel comfortable to work with data structures.
    This book can help a student to start with the introduction of data structures
    and to end by mastering even the advanced concepts of data structures.


    This book can be used as a text book for undergraduate, graduate and research
    programmes that offer data structures as a course. The book aims to serve as a
    course material for use in the classroom. It can also be used in laboratory sessions
    as a companion guide.


    This book is one among very few books that include widely used data structures,
    pattern matching and tries explained simply and clearly along with examples and
    programs.


    Utmost care has been taken in writing this book to make it free from errors. However,
    should you come across any error, please do not hesitate to contact us. Your suggestions
    and feedback may be sent to akepogu@gmail.com.


    Ananda Rao Akepogu Radhika Raju Palagiri'
  merge: -1
  img_proc: true
