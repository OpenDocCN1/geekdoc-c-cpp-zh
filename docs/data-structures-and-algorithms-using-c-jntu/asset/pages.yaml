  md: 'For example, to search for the pattern ''a word followed with a space and followed
    with a number, then the regular expression becomes “w+\s\d+”.


    Here, the regular expression \w matches a word character, because the regular
    expression is with + symbol. So, \w+ matches with one or more number characters.
    Then \s matches with a space character, and the \d+ matches with one or more number
    of digits.


    # 15.4 FIXED PATTERN MATCHING ALGORITHMS


    Various algorithms that are used to match a given pattern with the available patterns
    are discussed. Here, the pattern that is to be matched is stable all through the
    search process.


    # 15.4.1 Brute Force Pattern Matching Algorithm


    Brute force pattern matching algorithm is a good and simple algorithm for pattern
    matching. This algorithm finds all the possible substrings over the given large
    string, and checks for the given pattern on all the possible substrings.


    If the pattern is with length 5, then the first substring from the text will be
    from the first character to the 5th character. The first substring will be cross
    checked with the pattern. If the substring and the pattern match, then the brute
    force algorithm returns with TRUE. If the substring and the pattern do not match,
    then the second substring will be from second character of the text to the 6th
    character of the text. The second substring will be cross checked with the pattern,
    if matches return TRUE or else the same process will be continued until the start
    index of the substring reaches n-length(P).


    ```

    Algorithm 15.1: BruteForceMatch(Text, Pattern)

    //n = length of Text and m = length of Pattern

    Step 1: for i=0 to n-m do /*For each character of text, loop continues*/

    Step 2: for j=0 to m do

    /*For each character of pattern, loop continues, used to frame text sub

    string with the length of the pattern*/

    /*If any character of text substring is not equal to the character

    sequence of pattern, Second for loop exits and first for loop continues

    with the next possible text substring*/

    Step 3: if (Pattern[j] !=Text[i+j]) break;

    done

    Step 4: if (j==m) then return TRUE

    /*If any text substring pattern characters fully matches with the pattern,

    Function returns true as matched*/

    done

    Step 5: Return FALSE

    /*If all the text substring pattern characters fully match with the

    pattern, Function returns false as not-matched*/

    ```


    Here, n is length of the text string (T) and m is length of the pattern string
    (P). In the first step, the algorithm estimates the possible number substrings
    with the length of pattern string over the text string, i.e. (n-m). The second
    step or loop identifies all the possible strings. If all the characters of the
    pattern string match with the substring characters, then the algorithm returns
    TRUE and exits else continues to check the next substring and is cross checked
    against the pattern string. This process continues for all the substrings. If
    the given pattern matches with any of the substrings the algorithm exits by returning
    TRUE, i.e. pattern match message.'
