- pgno: 307
  md: '**Path:** In an undirected graph G, a sequence P of zero or more edges of the
    form {v,v1}, {v1,v2}, ..., {vn-1,vn} or v0-v1-...-vn is called a path from v0
    to vn where v0 is the initial vertex and vn is the terminal vertex of the path
    P.

    In the definition of path, vertices and edges may be repeated.

    If v0=vn, then P is called a closed path.

    If v0 != vn, then P is called an open path.


    **Circuit:** A path of length ≥ 1 with no other repeated vertices or edges except
    its starting and ending vertices is called a circuit.


    **Length of the path:** The number of edges appearing in the sequence of the path
    P is called the length of the path.

    If the length of the path P is zero, i.e. path P has no edges at all, it contains
    only a single vertex and is called a trivial path.


    ![](img/45784b9f0334626143002ec0d63692fd_307_0.png)


    Figure 10.13 Graph G16


    From the graph G16 shown in Figure 10.13, the following observations can be made.

    Consider the path v1-v2-v4-v3-v5-v6-v7-v10-v9-v8-v6. Here, the length of the path
    is 7 as it has 7 edges involved in the path. Though the length of the path is
    more than 1, as v6 is repeated it is not a circuit. As the end vertices are same
    it is a closed path.


    **Isomorphism:** Two graphs G and G'' are said to be isomorphic, there is a one-to-one
    correspondence between their vertices and between their edges such that the incident
    relationship is preserved.

    In other words, if vi and vj are the vertices in graph G, v''i and v''j are the
    corresponding vertices in graph G'', then for an edge having vi and vj as the
    end vertices in G, there is a corresponding edge in G'' with v''i and v''j as
    the end vertices. Then G and G'' are said to be isomorphic.


    +   Conditions for isomorphism:

    +   1. Both graphs should have the same number of vertices.

    +   2. Both graphs should have same number of edges.

    +   3. Both graphs should have an equal number of vertices with the same degree.

    +   4. Both graphs should have the same cycle vector (c1, c2, ..., ck), where
    ci = number of cycles of length i.'
