    representation of a binary tree. These two fields act as flags that indicate whether
    the LCHILD and RCHILD fields represent a thread or a link. If the LEFT THREAD
    TAG or RIGHT THREAD TAG fields are true then the corresponding LCHILD or RCHILD
    fields represent threads, else they represent links to the children. The problem
    dangling threads can also be handled in this representation, because it has a
    head node to which dangling threads point to. By convention, the head node has
    its LCHILD pointing to the root node of the threaded binary tree. So the LEFT
    THREAD TAG is set to false but the RCHILD link points to the head node itself.
