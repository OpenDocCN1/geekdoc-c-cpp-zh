    \ means “one can have many forms”. Operator overloading and function overloading\
    \ are the types of polymorphism.\n\nC++ supports two types of binding—static and\
    \ dynamic. Choosing a function call at the compile time is called static binding.\
    \ Choosing a function call at the run-time is called dynamic binding. Static binding\
