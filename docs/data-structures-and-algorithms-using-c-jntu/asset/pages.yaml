  md: '# Chapter 8


    # Dictionaries


    This chapter discusses dictionaries and their representations in various methods
    such as linear list representation, skip list representation and hash table representation.
    In this chapter the reasons and situations of collision occurrences and techniques
    to overcome the collisions are explained. Comparisons of chaining and open addressing,
    applications and ADT of dictionary are also explained in detail.


    # 8.1 DICTIONARIES


    Dictionary contains data elements as pairs of the form (k, v), where k is the
    key and v is the value. The field key must be unique and is used to identify the
    data elements uniquely. No two pairs are allowed to have the same key.


    A dictionary with duplicates is a dictionary which allows two or more (key, value)
    pairs with the same key. To solve the ambiguity while performing operations on
    elements with duplicate keys, dictionaries should frame some rules.


    A dictionary can either be ordered or unordered. In ordered dictionaries, all
    the data elements are placed either in ascending or descending order of the keys.
    Here sequential access of (key, value) pairs are allowed.


    In an unordered dictionary, no particular order of data elements is maintained.
    Here, data elements or (key, value) pairs are accessed randomly.


    # Examples


    +   - A dictionary that stores student records

    +   - A general dictionary of words

    +   - A computer dictionary similar to dictionary of words

    +   - Symbol table is a dictionary with duplicates which is used by a compiler


    # 8.2 LINEAR LIST REPRESENTATION


    An ordered dictionary can be represented as an ordered linear list. In this every
    element or node is a (key, value) dictionary pair stored generally in ascending
    order of the keys. Sorted array list and sorted chain are used for this representation.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'This representation uses binary search method and hence the time complexity
    of search operation is O(log n). Insertion and deletion operations perform search
    operation internally before either inserting an element or deleting an element.
    Insertion requires additional O(n) time to shift O(n) pairs to make room for the
    new (key, value) pair. Similarly, the deletion also requires additional O(n) time
    to shift O(n) pairs forward to fill the gap left by the deleted pair. Sequential
    access allows O(1) time to access every (key, value) pair, which are stored in
    ascending order.


    # 8.3 SKIP LISTS REPRESENTATION


    William Pugh developed skip lists in 1990. Skips are probabilistic alternatives
    to balanced trees like AVL trees or splay trees. Skip lists are balanced by considering
    a random number generator.


    The balanced trees perform very efficiently, O(log n) for the operations such
    as search, insert and delete over random input data. But, for the ordered input
    data they are less efficient, O(n). To balance the tree and to assure good performance,
    the trees are rearranged by the balanced tree algorithms. Random input data is
    impractical in many cases where queries are to be answered on-line.


    When a sorted list is considered, the performance of search, insert and delete
    operations is poor, O(n). Because, to find a relevant node the list must be scanned
    node-by-node starting from the head. The basic idea behind the skip lists is to
    allow the list to be scanned in bigger steps. Skip lists are sorted linked lists
    but differ in two points. They are


    +   * In a skip list, nodes have many ''next'' references known as forward references,
    whereas in an ordinary list, nodes have only one ''next'' reference.

    +   * For a given node the number of forward references is probabilistically determined.


    In a linked list shown in Figure 8.1 to find an element every node might be examined.
    In a sorted ordered list, every second node of the list also points to a node
    two positions ahead to it in the list as shown in Figure 8.2. A maximum of n/2+1
    nodes are to be searched where n is the length of the list. When every fourth
    node also points to a node two position ahead to it as shown in Figure 8.3. Then
    it requires a maximum of n/4+2 nodes to be searched. Similarly, if every (2^i)th
    node also points to 2 nodes ahead to it as shown in Figure 8.4. Then the number
    of nodes to be searched can be reduced to log n. n. Skip lists are very efficient
    for search operations, but for insertion and deletion this would be inefficient.
    Maximum level (M level) will be log1/p n where p is the probability and p=1/2.


    ![](img/45784b9f0334626143002ec0d63692fd_250_0.png)


    Figure 8.1 Linked list'
