- pgno: 304
  md: '**Multigraph:** Any graph which contains some parallel edges and loops is called
    a multigraph.

    **Trivial graph:** A finite graph with one vertex and no edges, i.e. single vertex,
    is called a trivial graph.

    **Isolated vertex:** In any graph, a vertex which is not adjacent to any other
    vertex is called an isolated vertex.

    **Null graph:** A graph with no vertices or with only isolated vertices is called
    a null graph. The set of edges in a null graph is empty.

    **Weighted graph:** A graph in which weights are assigned to every edge is called
    a weighted graph.

    **Finite graph and infinite graph:** If the number of vertices and edges in a
    graph are finite, then it is called a finite graph otherwise it is called an infinite
    graph.


    **Order and size of a graph:** Let G be a graph, then V(G) or V denotes the set
    of vertices, and E(G) or E denotes the set of edges in graph G. |V(G)| or |V|
    denotes the number of vertices in G and is called order of G. Similarly, |E(G)|
    or |E| denotes the number of edges in G and is called size of G.


    **Incidence:** If a vertex vi is an end vertex of an edge ej, then vi and ej are
    said to be incident with one another.


    ![](img/45784b9f0334626143002ec0d63692fd_304_0.png)


    Figure 10.8 Graphs G9


    In Figure 10.8, edges e1, e4 and e5 are incident on vertex v1. Edges e2, e3 and
    e8 are incident on vertex v5 and so on.


    **Degree of a vertex:** The number of edges incident on vertex vi, where self-loop
    is counted twice, is called the degree of a vertex vi. It is denoted by deg(vi).
    In Figure 10.8, deg(v1)=4; deg(v2)=3.


    **Indegree of a directed graph:** The number of edges incident to a vertex vi
    is called the indegree of the vertex vi.

    **Outdegree of a directed graph:** The number of edges incident from a vertex
    vi is called the outdegree of the vertex vi. If the degree of a vertex is one
    then the vertex is called a pendant vertex.

    maximum degree δ(G)=0

    minimum degree Δ(G)=4


    **Subgraph:** A graph G''=(V'', E'') is a subgraph of a graph G=(V, E) if V''
    ⊆ V and E'' ⊆ E. Figure 10.9 illustrates a subgraph.'
