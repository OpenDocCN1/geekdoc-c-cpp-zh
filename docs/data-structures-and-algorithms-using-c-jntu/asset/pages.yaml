    # 6.1 DEFINITION


    A stack is a linear data structure in which insertion and deletion of elements
    are done at only one end, which is termed as Top of stack. The last element that
    is inserted will be the first element to be deleted. Therefore, this is referred
    to as a Last In First Out (LIFO) structure.


    +   **Examples**

    +   1. The stack of trays in a cafeteria

    +   2. A stack of plates in a cupboard


