    +   - A priority queue is a queue in which insertion and deletion of items are
    performed based on priority.

    +   - Priority queue can be implemented using unsorted list, sorted list, binary
    search tree and heap.

    +   - A min heap is a complete binary tree in which the value in each node is
    less than or equal to those in its children.

    +   - A max heap is a complete binary tree in which the value in each node is
    greater than or equal to those in its children.

    +   - External sorting is used for sorting files or lists that are large enough
    to store into the internal memory. So, external storage devices like tapes and
    disks are used for storing the files.

    +   - Groups of records from files in memory are called runlists.

    +   - A process of distributing ordered runlists of predetermined size on to the
    tapes and continuously merging these runlists in multiple phases is called the
    polyphase merge.


