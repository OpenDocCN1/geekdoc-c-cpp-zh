    # 7.3.2.1 Disadvantages of a Linear Queue


    Consider the example discussed in Section 7.3.1, enqueue and dequeue using arrays.
    The insertion of element 50 fails because the REAR value is equal to the maximum
    size of the queue, i.e. REAR=4, but positions [1], [2] and [3] are still empty.
    This leads to the limitation of linear queue. When REAR=N the queue overflow condition
    is true but this doesn''t mean that the queue is full, i.e. locations [1], [2]
    and [3] are empty. Therefore, some space is available to insert a new element
    in the place of deleted elements. This limitation can be prevailed over by a circular
    queue.


    # 7.4 CIRCULAR QUEUES


    In a circular queue the insertion of an element can be done even when rear is
    equal to the maximum size of a queue when the space is available at front in the
    queue, which is not possible in a linear queue. Both FRONT and REAR pointers move
    in a clockwise direction over the queue. The array representation of a circular
    queue is the same as a normal queue physically. But, logically in a circular queue
    the front element comes after the last element. Figure 7.5 shows the physical
    and logical view of a circular queue.


    ![](img/45784b9f0334626143002ec0d63692fd_232_0.png)


    (a) Logical view of a circular queue


    (b) Physical view of a circular queue


    Figure 7.5 Circular queue


    The representation of a circular queue is the same as a normal queue with the
    only difference being that the REAR pointer is not the end of the queue and will
    again be pointing towards the starting position.'
