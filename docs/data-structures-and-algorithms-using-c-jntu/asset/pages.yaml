- pgno: 246
  md: 'After logging on the system at time 0, initially user program U is allotted
    3 sec of CPU time before it receives a message at its terminal. While receiving
    the message, the user thinks for some time and then gives a new input for the
    program. Further 7 secs of CPU time is required before another message is printed
    on the user U terminal. Again user thinks for some time and gives a new input
    for the program. Let the time period for thinking and giving input be the delay
    time. Finally, user program U uses 2 secs of CPU time and then logs off the session.


    In the above discussions, ignore the fact that the other two user programs U2
    and U1 logged on at time 1 and 2, respectively, and they ignore the processor
    immediately. Since there is only one CPU, the user programs U2 and U1 will be
    waiting until U1 finishes its first requested CPU time period of 2 secs. To indicate
    that the user programs U2 and U1 are waiting for the processor, place the program
    ID of U1 and U1 in a queue after Ur. Hence the queue at time 2 will look as in
    Figure 7.11.


    ![](img/45784b9f0334626143002ec0d63692fd_246_0.png)


    When U1 completes its first requested CPU time period, a scheduling strategy must
    be used to allocate U2 to CPU while U1 is thinking during delay time. When U1
    finishes its CPU time period U1 should be allocated to execute. This type of scheduling
    technique is often called as first-come-first-serve (FCFS) scheduling.


    The rules for FCFS scheduling for these applications are as follows:


    +   1. When a program requests the CPU time period, it is placed into the queue.

    +   2. The program pointed by the front pointer is the one that is currently executing.
    It remains at the front of the queue for its entire CPU time period.

    +   3. When a program completes its requested CPU time, it is removed from the
    queue and is not placed again into the queue until further request is made.


    Following the above rules three user programs can be scheduled. The problem here
    is to simulate the activity of such a time-sharing system. The simulation must
    place users in the queue according to rule 1 and remove them as in rule 3.


    The purpose of such a simulation is to obtain the information about the efficiency
    of the time-sharing system. The data related to this is as below:


    ```

    CPU utilization (for each user) = Total CPU time / Total session time *100

    ```


    Total user waiting time (for each user) = total time - total CPU time - total
    delay time


    Total delay time (for each user) = time delay period*(number of CPU request -
    1)


