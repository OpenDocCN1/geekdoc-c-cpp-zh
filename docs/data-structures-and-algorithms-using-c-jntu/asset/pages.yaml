- pgno: 167
  md: 'Here, the LINK field of the last node is pointing to the first node. Using
    the circular linked list any node from any position can be accessed without the
    need of starting from the first node. List based implementations such as concatenation
    of lists, splitting of lists and so on can be efficiently performed with circular
    lists.


    One disadvantage with circular lists is that while processing, the list makes
    sure that it does not form an infinite loop since the direction of pointers in
    the list is circular. This can be solved with the HEAD node, which is the header
    node in the list. It helps us to point out the end of the list and terminate the
    loop.


    The operations insertion into and deletion from the circular linked lists are
    the same as in a singly linked list except that the last node points to the first
    node. So, while inserting the first node, update the head node pointer and LINK
    field of it to point to the first node. When deleting the last node, update the
    previous node of the last node to point to the head node.


    ![](img/45784b9f0334626143002ec0d63692fd_167_0.png)


    ![](img/45784b9f0334626143002ec0d63692fd_167_1.png)


    # Figure 5.13 Insertion in a circular linked list


    In Figure 5.13(b), the node A is inserted between the head node and node B. First
    obtain the value of the head node LINK field and make the new node pointer to
    the node B. Now assign the head node pointer with the address of the new node,
    i.e. head node pointing to the new node.


    ![](img/45784b9f0334626143002ec0d63692fd_167_2.png)


    ![](img/45784b9f0334626143002ec0d63692fd_167_3.png)


