    **Extendible hashing:** Extendible hashing makes hashing dynamic. With this technique,
    access to data from the buckets is done indirectly through an index which is adjusted
    dynamically in order to reflect the changes in a table. The main feature of extendible
    is to organize the index which is an expandable table.


    Whenever a hash function is applied for a key, the value returned by it gives
    the position in the index—not the table of keys and these values are known as
    pseudo keys. Using extendible hashing there is no need to reorganize the table
    when insertion and deletion take place.


    A single hash function h is used but depending on the size of the index a portion
    of address of h(x) is used. The address of h(x) is represented as a string of
    bits and only the i left-most bits are used. Here i is called the depth of the
    directory.


    Consider an example where the hash function h returns patterns of five bits. Suppose
    a pattern is a string 01101 and the depth is two, then the left-most bits 01 are
    used to represent the location in the directory which contains the pointer to
    a bucket where the required key can be $ found or the one where the required key
    can be inserted.


    In Figure 8.12 the values of hash functions h1 are shown in buckets and these
    values represent the keys that are actually stored in the buckets.


    Each bucket will have its own depth called local depth which indicates the number
    of leftmost bits of h(x). Each bucket holds all the keys whose local depth is
    same. In Figure 8.12, the local depth of a bucket is shown on top of it. The bucket
    b0 contains the keys for which h(k) starts with 00 bits. The use of local depth
    is to determine whether the bucket can be accessed from only one location or at
    least two.


