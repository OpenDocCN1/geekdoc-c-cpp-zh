    # 1.6 STATIC CLASS MEMBERS


    Every variable in C++ program is associated with a unit of storage in memory.
    C++ has two kinds of storage classes: automatic and static. Static members will
    be accessed using .(dot) or -> operators. Unlike normal class members, static
    members may be directly accessed by applying :: scope access operator to the class
    name. It is not necessary to create objects for accessing the static members.


    # 1.6.1 Static Member Variables


    When objects are created for a class, each object will have its own copy of members
    of class. The member functions are created ones, and all the objects will share
    them. There is no separate copy of every function of each object. Like member
    functions, the member variables can also be made common by using the keyword static.
    It makes the variables persist from the point of execution in which they are created
    until the program is terminated.


    By declaring the member variables as static, only one copy of the variables is
    created and it is shared by all the objects of that class. Every static variable
    must be initialized to zero, the scope of the static variables is within the class.
    A static variable may be global to a particular transaction unit or global to
    a class. The general form is as follows:


    ```

    static variable-declaration;

    static function-definition;

    ```


