    **Making the inherited private members as its original access specification in
    the inheritance:** There may be a situation where some of the inherited private
    members have to be with its original access specification. In this case C++ allows
    the developers to restore its original access specification in the derived class.


    When the access specifier of the base class is *private*, then all the public
    and protected members of the base class become private members of the derived
    class. The said mechanism allows one to restore some of the inherited public and
    protected members, which become private in the derived class and can restore their
    original access specification as public or protected.


    The general form of access specification is as follows:


    Base-class::member; //by this statement the original access specification of the
    member will be restored.


