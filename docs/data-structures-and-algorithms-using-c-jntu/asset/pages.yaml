    +   3. Insertion may affect the balance factors of only those nodes that appear
    on the path from the root to the new node that is inserted.


    +   4. The nearest ancestor A of the newly inserted node whose balance factor
    is either +2 or –2 initiates the rotation.


    In an AVL search tree, prior to the insertion, if the balance factor of all the
    nodes on the path from the root node to the currently inserted node was 0, then
    the tree will not become unbalanced even after insertion. Because the insertion
    will make the balance factor to change by –1, 0 or 1.


    If the insertion makes an AVL search tree unbalanced, the height of the subtree
    must be adjusted by rotating them approximately with respect to the closest ancestor
    so that it is balanced.


    Based on the place where the new node is inserted, that causes the imbalance rotations
    are classified into four types such as


    +   1. LL rotation—new node inserted as the left subtree (L) of the left subtree
    (L) of A.

    +   2. LR rotation—new node inserted as the right subtree (R) of the left subtree
    (L) of A.

    +   3. RR rotation—new node inserted as the right subtree (R) of the right subtree
    (R) of A.

    +   4. RL rotation—new node inserted as the left subtree (L) of the right subtree
    (R) of A.


