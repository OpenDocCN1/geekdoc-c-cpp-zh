    # 3.8 TIME COMPLEXITY


    Time complexity of a program can be defined as the total time taken for compilation
    and execution. The program has to be compiled before running it. Once the compilation
    process creates the executable binary file, to run the program, compilation is
    not required as long as there are no changes in the code. An executable binary
    file is required to run a program. Hence, consider only the execution time for
    calculating the time complexity.


    The time complexity depends on the space complexity that the program uses, time
    taken to load the program, total number of executable instructions in the binary
    file, number of control loops present, number of function calls made, number of
    arithmetic operations used, number of console input/output operations, number
    of read/write locks and finally the input values of the program.


    Consider a program to display natural numbers from 1 to n. If n=2, then the print
    function will be called only 2 times. If the n value is very high, then the print
    function will be called for n number of times.


    If a program requires more memory than the available physical memory, then the
    processor makes use of virtual memory, which is placed in secondary storage devices
    such as a hard disk. Otherwise, the processor waits till sufficient physical memory
    is available. So, the runtime of a program depends on the space complexity. When
    the space complexity of the program is more than the available physical memory,
    then the runtime will be more. So, the time complexity of a simple program is
    very less than the complex huge program.


    As the time complexity depends on so many factors, there is no exact procedure
    to find the time complexity of a program. But, by considering the basic operations
    and the number of times the operations are called, the time complexity can be
    estimated. The time complexity can be calculated by estimating the total number
    of instructions executed.'
