- pgno: 11
  md: '# # Introduction to C++


    The study of structures and algorithms using programs for solving day-to-day problems
    requires a very effective method of representing both data and algorithm. Before
    moving towards the data structures and algorithms, it is essential to have efficient
    C++ programming skills.


    Chapter 1 provides a review of required skills that are well known to the readers.
    This chapter describes about some of the features of C++ language. It gives an
    introduction to C++, class overview that covers how a class and the class member
    are defined, and its objects declared. Also I/O streams, access control, class
    scope, and static class members are covered. This provides a detailed discussion
    about functions, this pointer, and dynamic memory allocations—the new and delete
    operators along with exception handling.


    # ## 1.1 INTRODUCTION


    C++ was first invented by Bjarne Stroustrup in 1979 at Bell Laboratories, Murray
    Hill, New Jersey (USA). Features of SIMULA 67 and C are incorporated into C++,
    which could support the features of object-oriented programming. Initially the
    new language was called C with classes, later in 1983, this was named C++ by Dick
    Mascitti. The name C++ originated from the increment operator ++ of C, so that
    C++ was called an extension of C. The name of C++ can be read as “one more than
    C,” “next C,” or “successor to C.” It is pronounced as “see plus plus.”


    The standardization of C++ began in 1990 under the American National Standards
    Institute (ANSI) and the International Standard Organization (ISO) and underwent
    various revisions. Finally in 1998, C++ was standardized and was referred to as
    “Standard C++.”


    # ## 1.2 CLASS OVERVIEW


    Class overview deals in detail with class, members of a class, i.e. both member
    variables and member functions. It also discusses the objects of a class.'
