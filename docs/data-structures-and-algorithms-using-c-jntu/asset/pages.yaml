    This information, collectively, is referred to as a stack frame. The stack frame
    for each method call will be different. For example, the stack frame for a parameterless
    or no local variable method will contain just a return address. The compiler will
    take care of the entire above required stack maintenance when a call to a recursive
    method is made.


    The following strategy can be used to remove the recursion from a recursive routine,
    although not elegantly. There might be a far more pleasing method for a particular
    routine, but this technique is very instructional. It allows one to simulate the
    stack by deciding user''s own stack structure and manage the recursion. This is
    accomplished as follows:


    +   i. Each time a recursive call is made in the algorithm, push the necessary
    information onto the stack.

    +   ii. When the process is completed at this deeper level, pop the simulated
    stack frame and continue processing in the higher level at the point indicated
    by the return address popped from the stack.

    +   iii. Use an iterative control structure that loops until there are no return
    addresses left to pop from the stack.


