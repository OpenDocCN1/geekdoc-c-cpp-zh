  md: 'In summary, a max/min heap is a complete binary tree, where the element at
    each node is greater/smaller than or equal to the element in its children. To
    add an element to a heap, place the new element at the next available spot and
    perform a reheapification upward. To remove the element, delete the root element
    and find the proper place for the last element using reheapification downward
    starting from the root index. The worst case running time for the insertion (which
    includes reheapification) is O(log N). The worst case and average running time
    for deletion (which includes reheapification) is O(log N).


    # 11.4 APPLICATIONS


    The main applications of priority queue are:


    +   - Job scheduling

    +   - Allocating CPU resources to the most urgent task

    +   - Communications

    +   - Send the most urgent message first

    +   - Event-driven simulation

    +   - Printer queue

    +   - Sorting—heap sort

    +   - Shortest path graph algorithms (Greedy algorithms)


    # 11.4.1 Job Scheduling


    Suppose there are n jobs and m machines. Processing these n jobs on m machines
    and processing the time of each job is represented by tj. The jobs are processed
    on machines in such a way that


    +   - Each machine can process only one job at any time

    +   - Each job must be processed by only one machine at any time


    Each machine is available at time 1 and the total elapsed time is the total time
    taken to process all the jobs.


    Machines: In Figure 11.121, there are three machines m1, m2, m3, and six jobs
    j1, j2, j3, j4, j5, and j6, with processing times as (1,8,3,9,5,2). Job j1 is
    processed on machine m1 from 1 to 9 time units, job j3 is processed on machine
    m1 from 1 to 8 and then do job j6 from 8 to 10 time units. Machine m3 processes
    job j1 from 1 to 5 and then job j5 from 5 to 9 and then job j2 from 9 to 10 time
    units. The total time required to process all the jobs is 10 units. In Figure
    11.21, the jobs are assigned based on the minimum finish time of the jobs. The
    task is to assign the jobs based on the minimum finish time of m machines for
    a set of n jobs. This is done by considering the Highest Processing Time strategy.
    Using this strategy, jobs are assigned to machines in the descending order of
    their processing times tj. When a job is assigned to a machine, it is given to
    the machine that becomes idle first.


