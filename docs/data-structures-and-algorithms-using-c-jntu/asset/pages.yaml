    # 2.5.2 Pure Virtual Functions


    A pure virtual function is a virtual function declared in the base class, but
    there is no definition for the virtual function, so that it can be overridden
    by the derived class. The pure virtual function must be defined by the derived
    class. When a function is declared as pure virtual function in a class, then that
    class cannot be used to declare any object because it becomes an abstract class.


    A pure virtual function can be declared as


    ```

    virtual return-type function-name(args)=0;

    ```'
