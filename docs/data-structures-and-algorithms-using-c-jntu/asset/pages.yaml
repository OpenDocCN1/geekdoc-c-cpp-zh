    # Figure 7.8 Comparison of stack, queue, deque


    Deque''s are of two types input restricted deque and output restricted deque.
    When insertion of elements into the deque is restricted to only one end and deletion
    can be done in both directions, such a deque is called input restricted deque.
    In an output restricted deque, insertion of elements can be done in both directions,
    but deletions can be done at only one end. Commonly deques are implemented using
    circular arrays. Figure 7.9 shows the different types of deques.


