    and 16, the edge with cost 1 is used to connect node 5 with 7. Node 5 has only
    one edge with cost 3 to proceed to an unvisited node 6. So, it is used to connect
    6 with 5. Now, all the nodes are connected using minimum possible edge costs resulting
    in a minimum cost spanning tree T of graph G_s, such that T \subseteq G is a subgraph
    where G=(V, E) and T=(V'', E'') (Figure 10.31). The time complexity of Prim''s
    algorithm is O(n^2).


    # 10.7 GRAPH ADT


    A graph G consisting of vertices and edges:


    +   - `is_empty (G)` Check whether graph G is empty

    +   - `INSERT (G,V)` Insert vertex V into graph G

    +   - `INSERT (G,U,V)` Insert an edge connecting vertices U and V

    +   - `DELETE(G,V)` Delete vertex V from graph G and all the edges belonging to
    V

    +   - `DELETE(G,U,V)` Delete an edge from the graph G connecting vertices u and
    v

    +   - `ADD-DATA(G,V,ITEM)` Add ITEM into vertex V of graph G

    +   - `RETRIEVE (G,V,ITEM)` Retrieve data of a vertex V in the graph G and store
    it in ITEM

    +   - `BREADTH-FIRST(G)` Implements breadth first traversal of a graph G

    +   - `DEPTH-FIRST(G)` Implement depth first traversal of a graph G


    # SUMMARY


    +   - A graph G=(V,E) consists of a set of vertices G and a set of edges E.

    +   - A graph in which every edge is directed is called a directed graph or simply
    a digraph.

    +   - A graph in which every edge has no direction (undirected) is called an undirected
    graph.

    +   - Two graphs G and G_1 are said to be isomorphic, if there is a one-to-one
    correspondence between their vertices and between their edges.

    +   - A circuit is called an Eulerian circuit; if every edge of Graph G appears
    exactly once, it is called an Eulerian circuit.

    +   - Hamiltonian path in a connected graph is defined as a path that traverses
    each vertex of the graph exactly once.

    +   - Hamiltonian circuit is a circuit that passes through all the vertices in
    a graph exactly once except the starting vertex.'
