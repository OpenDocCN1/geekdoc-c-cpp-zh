    # 12.2 REPRESENTATION OF A BINARY SEARCH TREE


    Similar to the representation of a binary tree, a binary search tree is also represented
    in a linked representation manner. To illustrate the representation, consider
    the binary search tree depicted in Figure 12.1(a); its node structure and linked
    representation are given in Figure 12.2.


    | LCHILD | DATA | RCHILD |


    (a) Node structure of a binary search tree


    ![](img/45784b9f0334626143002ec0d63692fd_380_0.png)


    (b) Linked representation of a binary search tree of Figure 12.1(a)


    Figure 12.2 Linked representation of a binary search tree


    The null pointers of the nodes are not represented physically but are only fictitious
    and are known as external nodes. The external nodes depicted with solid circles
    are specified as e1. The path from the root to an external node is known as an
    external path. Thus, the linked representation of a binary search tree is a collection
    of internal nodes that represent the keys and external nodes that represent null
    pointers. This kind of binary tree is known as an extended binary tree.


    # 12.3 OPERATIONS ON BINARY SEARCH TREES


    Various operations can be performed on binary search trees but the most frequently
    used are search, insert and delete operations.


    # 12.3.1 SEARCHING


    In a binary search tree T searching for a key u is initiated at the root. If the
    key u is less than the key at the root then consider only the left subtree of
    T to search the key u. If the key u is greater than the key at the root then'
