  md: 'Step n: In the (n-1)th pass excluding the first two elements in the list repeat
    the sorting process by finding the next smallest element and swap it with an appropriate
    element until the entire list is sorted. The entire sorting takes (n-1) passes.


    To find the smallest element among all the elements in the list, first the variable
    SMALL is set to the first element of the list and the variable POS is set to the
    position of the first element and then traversing the list comparing SMALL with
    every other element of DATA[i] as follows:


    +   1. If SMALL < DATA[i], then move to the next element

    +   2. If SMALL > DATA[i], then update SMALL and POS as SMALL=DATA[i] and POS=i


    After comparing all the elements SMALL contains the smallest among all the elements
    and POS contains its location.


    Selection sort can also sort the elements in descending order by selecting the
    largest element instead of the smallest element and swapping it with the element
    at the last position in the list. Algorithm 16.3 is the algorithm for selection
    sort. The algorithm FINDMIN finds the smallest element in the list and returns
    it to the algorithm SELECTION-SORT, which places the smallest element in its appropriate
    position.


    ```

    Algorithm 16.3: SELECTION-SORT (DATA, N)

    1. Repeat for k=1 to N-1

    2. Call FINDMIN(DATA, K, N, POS)

    3. Set temp=DATA[K]

    4. DATA[K]=DATA[POS]

    5. DATA[POS]=temp

    6. End loop

    7. End

    ```


    ```

    Algorithm 16.3.1: FINDMIN(DATA, K, N, POS)

    /*This algorithm is used to find the smallest element among DATA[K] , DATA[K+1]
    ,..., DATA[N] */

    1. Set SMALL=DATA[K] and POS=K

    2. Loop for i=K+1 to N

    (i) Check whether SMALL is greater than DATA[i] then

    (ii) Set SMALL=DATA[i] and POS=i

    3. End loop

    4. End

    ```


