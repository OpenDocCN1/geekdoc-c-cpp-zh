  md: "# 2.5.1 Virtual Functions\n\nVirtual keyword is used to avoid ambiguous situations\
    \ in the multipath inheritance. In the multipath inheritance, an object can inherit\
    \ the properties of the derived objects, which are inherited from the same base\
    \ class objects. This kind of situations leads to ambiguity. To avoid ambiguity\
    \ while calling the inherited members, virtual functions are introduced. Using\
    \ the keyword virtual ambiguous situation can be resolved. Ambiguity is a compiler\
    \ error.\n\nProgram with ambiguity:\n\n```\n#include<iostream.h>\n#include<conio.h>\n\
    class Base\n{\n public:\n int base_var;\n};\nclass derived1:public Base\n{\n public:\n\
    \ int derived1_var;\n};\nclass derived2:public Base\n{\n public:\n int derived2_var;\n\
    };\nclass derived3:public derived1, public derived2\n{\n public:\n int derived3_var;\n\
    };\nvoid main()\n{\n derived3 obj;\n obj.base_var=20; /*derived1 and derived2\
    \ instances are inherited\nto the obj, compiler cannot address which\nmember has\
    \ to be called*/\n}\n```\n\nIn the above program when the object obj is created,\
    \ the object obj) will inherit the public properties of derived1 and derived2\
    \ classes. Because both the derived1 and derived2 classes are inherited from the\
    \ base class, both the instances of the derived1 and derived2 classes will have\
    \ a base_var member. Because derived3 is inherited from derived1 and derived2\
    \ classes, two copies of the base_var variable will be present in the obj object.\
    \ The compiler will be in ambiguous state to decide which member has to be addressed\
    \ when obj.base_var is called.\n\nIf the access specifier of the base class is\
    \ defined as virtual, then compiler avoids multiple instance copies of the same\
    \ base class and keeps only one base class instance in the multipath inheritance.\
    \ The below example avoids ambiguity by using the virtual keyword:"
