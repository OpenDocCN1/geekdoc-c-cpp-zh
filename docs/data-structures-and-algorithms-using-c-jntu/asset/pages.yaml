    # 3.9 WORST CASE, AVERAGE CASE AND BEST CASE COMPLEXITY


    The number of steps an algorithm takes can be known when it is executed on the
    given input instance. To check the correctness of the algorithm, execute it for
    all instances. An algorithm when executed on all possible instances of data, the
    best, worst and average case complexities can be estimated. Suppose for the problem
    of sorting, the possible instances are the possible arrangements of all the possible
    keys. There is a need for differentiating at least three cases for which the efficiency
    of algorithm has to be determined.


    # 3.9.1 Worst Case


    The worst case complexity of an algorithm is when the algorithm takes maximum
    number of steps on any instance of size n. The Big oh notation tells the maximum
    upper bounds of the running time complexity. The Big oh time complexity can be
    called as worst case, because at any cost the maximum boundary will be O (Big
    oh) notation expression.


    # 3.9.2 Average Case


    The average case complexity of an algorithm is when the algorithm takes the average
    number of steps on any instance of size n. The Theta notation tells the time complexity
    that lies in between the maximum lower bounds and minimum upper bounds of the
    running time complexity. The Theta time complexity can be called as average case
    because at any cost the time complexity will not exceed Big O and Omega minimum
    boundary.


    # 3.9.3 Best Case


    The best case complexity of an algorithm is when the algorithm takes the minimum
    number of steps on any instance of size n. The Omega notation tells the time complexity,
    i.e., maximum possible lower bounds of the given function.


    Consider the linear search performed on an unsorted array to find an element.
    If the element is found in the first cell then it is a best case. If the element
    is found in the last cell or not found in the array, then it is a worst case.
    In the worst case, all the elements will be checked. Then what is the average
    case? It is assumed that the chance of finding the element is equal all through
    the array. In this case, the probability that the element is found at the first
    cell is 1/n, the probability of finding the element in the second cell is 1/n
    and so on. Therefore, averaging all these probabilities gives the average number
    of steps taken to find the element. But, if the probability differs, then the
    average case complexity differs. The probability of finding an element in a particular
    cell has no effect on the best and worst cases.


    # SUMMARY


