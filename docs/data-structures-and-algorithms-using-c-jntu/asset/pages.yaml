    # 13.3.4 DRAWBACKS OF M-WAY SEARCH TREES


    The search, insert and delete operations on an m-way search tree of height h(without
    external nodes) have the complexity as O(h). An m-way search tree of height h
    will have a minimum of h and a maximum of m^h -1 number of elements. Minimum of
    h is as one element per node at every level and maximum as at every level, each
    node has m child nodes and m -1 elements. This says that the maximum number of
    nodes at level i is given by m^(i-1). As in an m-way search tree of height h,
    the total number of nodes is


    $$\sum_{i=1}^{h} m^{i-1} = \frac{(m^h - 1)}{(m - 1)}$$


    and each of these nodes will have m-1 elements, the maximum number of elements
    is


    $$\frac{(m^h - 1)}{(m - 1)}(m - 1) = (m^h - 1)$$


    Because the number of elements in an m-way search tree with a height h will be
    from h to m^h -1, when a tree with n elements is considered its height will be
    a minimum of log (n+1) and a maximum of n. In the worst case the height of an
    m-way search tree with n elements may be O(n) which yields a poor performance.
    So, it is required to maintain the balanced heights in m-way search trees.'
  merge: -1
  img_proc: true
