    # 1.3 I/O STREAMS


    Stream is a logical entity of an Input/Output (I/O) device. A stream can produce
    or consume information, and it is directly linked with the I/O subsystem. A stream
    is directly connected to the physical device. Whenever read or write operations
    are performed on the streams, they are reflected on the physical I/O device. C++
    provides a rich set of I/O library.


    Two different template classes are available in C++. One is for 8-bit streams
    and the other is for 16-bit streams (wide characters). The class ios is the base
    class for I/O streams. When a C++ program is loaded into the memory the standard
    input stream (cin), the standard output stream (cout), the standard error output
    stream (cerr) and the buffered version of standard error output streams will be
    automatically opened. When anything is typed through the keyboard, the input stream
    can be gathered by using the cin stream. When anything is written on to the standard
    output stream using cout, the character stream will be displayed on the standard
    output (screen). If any error is identified at the time of execution or at the
    compile time, then those messages will be passed on to the screen using cerr.


    # Formatting Input/Output: C++ provides two ways to define the input or output:


    +   1. By formatting the ios class members (flags)

    +   2. By making the use of I/O manipulators


    The ios class consists of different status flags for the formatted I/O. The ios
    flags can be set or unset. When the flag is set, the following operations will
    be performed during the I/O transaction.


    # Different flags in the ios class:


    +   - adjustfield: left, right and internal fields are collectively called adjustfield.

    +   - basefield: oct, hex and dec fields are collectively called basefield.

    +   - boolalpha: boolean values will be accepted by the keywords true or false.

    +   - dec: I/O numeric system will be set to decimal.

    +   - fixed: Floating point numbers will be displayed in the normal notation.

    +   - floatfield: Scientific and fixed fields are collectively called floatfield.

    +   - hex: I/O numeric system will be set to hexadecimal.

    +   - internal: The numeric values will be padded by inserting spaces between
    any sign and the base character.

    +   - left: Output is left justified.

    +   - oct: I/O numeric system will be set to octal.

    +   - right: Output is right justified.

    +   - scientific: Floating point numbers will be displayed in the scientific notation.

    +   - showbase: Numeric base system will be displayed while showing the output.

    +   - showpoint: The decimal point will be displayed for the floating point values.

    +   - showpos: Displays the positive or negative sign before the value.

    +   - skipws: is used to skip the white spaces while performing the input operations
    on a stream.

    +   - unitbuf: I/O buffer is flushed after the insertion operation.

    +   - uppercase: Characters will be displayed in the uppercase.'
