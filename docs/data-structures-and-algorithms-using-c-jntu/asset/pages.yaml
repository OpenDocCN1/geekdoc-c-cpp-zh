  md: '# 3.8.1 Time Complexity Analysis of Bubble Sort


    # Program 3.1


    ```

    //Program for Bubble Sort

    #include<iostream.h>

    #define MAX 256

    void bubble(int a[], int n)

    {

    int i,j,temp;

    //Start of Bubble Sort

    for(i=0;i<n;i++)

    {

    for(j=0;j<(n-1);j++)

    {

    if(a[j]>a[j+1])

    {

    temp=a[j];

    a[j]=a[j+1];

    a[j+1]=temp;

    }

    }

    }

    // End of Bubble Sort

    cout<<"nSorted Array:";

    for(i=0;i<n;i++)

    {

    cout<<"n"<<a[i];

    }

    }

    void main()

    {

    int i,n,a[256];

    cout<<"nEnter size:";

    cin>>n;

    for(i=0;i<n;i++)

    {

    cout<<"nEnter Element:";

    cin>>a[i];

    }

    bubble(a,n);

    }

    ```


    In Program 3.1, the bubble sort program accepts an array and size of the array
    as input arguments. The first for loop continues to execute for n times, the inner
    for loop executes for n-1 times and each time, three statements will be executed.
    So, the total number of executable statements in the program is n+(n-1)x3=3n²-3n.
    Therefore, time complexity of the program is O(n²).'
