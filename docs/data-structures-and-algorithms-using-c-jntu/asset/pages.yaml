    An amortized analysis analyzes a sequence of operations to show that though a\
    \ single operation within the sequence may be expensive the average cost per operation\
    \ is less. Even when averages are taken no probability is involved. The average\
    \ performance of each operation in the worst case is guaranteed by an amortized\
    \ analysis. However, an amortized analysis is not an average case analysis. Over\
    \ a set of independent input instances the work done by the algorithm is handled\
    \ by the average case analysis. But, the amortized analysis does the same over\
    \ related or associated instances.\n\nSplay trees give an amortized time complexity\
    \ as O(log n). The individual operation may not have O(log n) but the amortized\
    \ complexity of m operations in a splay tree will be O(m log n).\n\nAn amortized\
    \ analysis is used to establish efficiency in retrieving a node in a binary search\
