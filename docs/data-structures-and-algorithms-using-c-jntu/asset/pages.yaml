  md: '**Complexity:** The number of comparisons in bubble sort can be easily calculated.
    In the first pass, n-1 comparisons are there and in the second pass n-2 comparisons
    and so on. The number of comparisons can be calculated as follows:


    f(n) = (n-1) + (n-2) + ... + 2 + 1

    = n(n-1)/2 = O(n^2)


    The time complexity of the bubble sort algorithm is o(n^2).


    # Program 16.1


    ```

