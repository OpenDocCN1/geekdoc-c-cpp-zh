    # 9.9 THREADED BINARY TREES


    The linked representation of a binary tree of Section 9.5 says that a binary tree
    with n nodes uses 2n pointers of which (n+1) are null pointers. These (n+1) null
    pointers can be used to point some valuable information of the binary tree. To
    do this A. J. Perlis and C. Thornton introduced the concept of threads. Threads
    are also pointers or links. For a node NODE if CHILD(NODE) is NIL, then the null
    pointer is replaced by a thread that is replaced by a thread that points to a
    node that occurs often, NODE, when the binary tree is traversed in-order. If LCHILD(NODE)
    is NIL then this null pointer is replaced by a thread that points to a node that
    precedes NODE when the binary tree is traversed in inorder. Thus, threads are
    pointers to the predecessor and successor of the node corresponding to an inorder
    traversal, and trees whose nodes use threads are called threaded trees. Threaded
    trees can be used for all the traversals of a binary tree. A threaded binary tree
    is illustrated in Figure 9.12. The threads are indicated by the dotted lines.


    ![](img/45784b9f0334626143002ec0d63692fd_293_0.png)


    Figure 9.12 Threaded binary tree


    As nodes G and C have no predecessor and successor, respectively, the left child
    of G and the right child of C have threads that are left dangling. Threading can
    be represented in two ways. They are one-way threading and two-way threading.
    One-way threading: It is a representation in which a thread appears only on the
    RCHILD field of the node, when it is null, pointing to the inorder successor of
    a node. Two-way threading: It is a representation in which threads appear on both
    LCHILD and RCHILD fields of the node, when they are null, pointing to the inorder
    predecessor and successor of the node. The first and last nodes of the inorder
    traversal hold dangling threads. All the traversals of a binary tree, either recursive
    or non-recursive, use a stack to keep track of the nodes whose processing is yet
    to be completed. This requires additional time and space. It is still worse in
    the case of skewed binary trees where the stack needs to hold the information
    regarding almost all the nodes of a tree, a severe concern for very large trees.
    It would be very efficient if a stack can be incorporated as a part of a tree;
    this can be done by using threads.'
