    # ## 10.3 REPRESENTATION OF GRAPHS


    Graphs can be represented in two ways:


    +   1. Sequential representation

    +   2. Linked representation


    All the methods of sequential representation use matrices. So, arrays are used
    for implementing them. In the linked representation, a singly linked list is used
    as a basic data structure.


    # ### 10.3.1 SEQUENTIAL REPRESENTATION OF GRAPHS


    Some of the popular sequential representation methods are:


    +   - Adjacency matrix representation

    +   - Incidence matrix Representation


    **Adjacency matrix representation:** For a graph G=(V,E) of n vertices the adjacency
    matrix is an n×n symmetric binary matrix, and every entry of this matrix is defined
    as


    ```

    a_ij = 1, if there is an edge between vi and vj

    a_ij = 0, if there is no edge between vi and vj

    ```


    i.e. it only shows the direct paths between the vertices.'
