    # 5.7.1 The List ADT


    A linked list is fundamental data type, which can be considered almost as basic
    as the array.

    A list is a finite sequence of storage cells, for which the following operations
    are defined:


    create() creates an empty list l;

    insert(item, i, list) calls the list from the form (a1,... ai - 1, ai, an) by
    inserting an item between

    ai-1, and ai; it is an error to call this unless the list has at least i - 1 items
    before the call.

    delete(i, list) deletes the item at position i from the list, returning list containing
    one fewer item; and

    read(i, list) returns the item at position i in the list, without changing the
    list.


    Other operations on the list are search(), traverse(), merge(), search() is used
    to search a node in a list; traverse() is used to visit each node of the list
    and merge() is to combine two lists. It is often convenient to speak

    of the first item as the head of the list.


    # SUMMARY


    +   - Linked list is a data structure, which is a collection of zero or more nodes,
    where each node contains

    +   two fields. The first field contains data, and the second field is a pointer
    field containing the address of

    +   the next node.

    +   - Linked list basically supports insert and delete operations.

    +   - Types of linked lists are singly linked list, doubly linked list, circular
    singly linked list and circular

    +   doubly linked list.

    +   - A singly linked list is a linear data structure in which each node contains
    only one link field.

    +   - A singly linked list in which the link field of the last node is assigned
    with the address of the first node

    +   is known as a circular linked list or circular list'
