  md: '# 15.7 APPLICATIONS OF TRIES


    Tries find numerous applications. Some of them are explained as follows:


    +   1. Tries in the Web search engines: Tries can be used to store and maintain
    the index words and the relevant Web site address. In the Web search process the
    users query the index words, the search engine has to fetch the appropriate links
    as results. In this process the search engines maintain the table of index words
    to the Web link or Web site address. To maintain a sequence of words as the index,
    the search engines follow the tries procedure for quick retrieval of appropriate
    information.


    +   2. Symbol table maintenance: A symbol table is a data structure used in the
    language translators such as compilers or interpreters. A symbol table consists
    of the address location, syntax and semantic information of the identifier, type
    and scope of the identifier. To maintain all the identifiers’ information, the
    compilers or interpreters use tries procedure in the form of hash tables.


    +   3. Domain Name Servers: The Domain Name Servers (DNS) provide a facility to
    map the IP address to the domain name. The users of the DNS query the DNS with
    IP address or domain name, the DNS servers respond with its corresponding domain
    name or IP address, respectively. The DNS servers maintain a trie with each bit
    of the IP address as a node.


    +   4. Indexing a book: The index of a book contains the index words associated
    with page numbers. To prepare the index word associated with its page, numbers
    can be achieved by using the tries.


    +   5. Document similarity check: If two or more documents are given, to find
    the similarity between the documents tries can be used.


    +   6. Tries in the Internet routers: In the Internet, the routers will have many
    incoming lines and many outgoing lines. If the router receives any packet, the
    router has to send the packet through the appropriate outgoing link. The router
    should work with good speed to find the appropriate link for the destination IP
    address, the router maintains the IP domain with its corresponding link as a trie.


    # SUMMARY


    +   Pattern matching algorithms are of two types, one is fixed pattern matching
    where the pattern is fixed and the second is regular expression pattern matching
    where the pattern is framed with a regular expression.


    +   The fixed pattern matching algorithms are Brute Force Algorithm, Boyer–Moore
    Algorithm, Knuth–Morris–Pratt Algorithm and Tries.


    +   The Brute Force Algorithm searches for the pattern in the linear fashion.
    It finds the possible patterns over the given large string and checks for the
    existence of the pattern.


    +   The Boyer–Moore Algorithm and the Knuth–Morris–Pratt Algorithm avoid the unnecessary
    pattern searches.


    +   The Boyer–Moore Algorithm works with two stages, it prepares the shift table.
    Using the shift table the search string will be moved forward to avoid the unnecessary
    checks. But the algorithm does not guarantee the pattern match. This is the drawback
    of this algorithm.


    +   The Knuth–Morris–Pratt Algorithm works with the failure function, this algorithm
    is somewhat better than that of the Boyer–Moore Algorithm.


    +   Tries are the most common techniques where quick information retrieval is
    needed.


    +   Simple tries or standard tries will have more number of nodes than other tries,
    such as compressed tries and suffix tries.'
