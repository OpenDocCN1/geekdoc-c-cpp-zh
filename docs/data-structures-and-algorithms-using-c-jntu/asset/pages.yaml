  md: 'Ambiguity in function overloading: The compiler performs implicit conversion
    when it is unable to match the function. For example, char is converted to int
    and float is converted to double. Therefore, no two functions are overloaded when
    they seem to be the same after typecasting is done.


    Ambiguity is a situation where the compiler is unable to select the appropriate
    function when two or more functions are overloaded based on the arguments passed
    to the function. This situation occurs because of automatic typecasting done at
    the runtime when one data type is compatible with two or more data types. For
    example consider the following functions:


    ```

    long area(long)

    double area(double)

    ```


    and if this function is called with an integer value as area(20), then the compiler
    will be in confusion to decide which version of area() is to be invoked.


    Ambiguity may also occur when constant values are passed to the functions directly
    instead of variables. When int area(int,int) and float area(float,float) are overloaded,
    calling function area() with constant values such as area(2,4) and area(4.5,5.4)
    leaves the compiler in confussion to decide which version of area() is to be invoked.
    After internal conversion the integer version of area() will be invoked for both
    of the above calls.


    Finding the address of an overloaded function: To know the address of overloaded
    functions, they can be called through function pointers. If the method is not
    overloaded, by simply assigning the method address to the function pointer the
    method can be called.


    If the method is not overloaded, the method can be called with the following generic
    form:


    ```

    Function-pointer=method-name;

    Ex: p=myfunction;

    ```


    If the method is overloaded, the compiler does not know which function address
    should be considered. To avoid this ambiguity p should be declared with the method
    arguments.


    ```

    Ex: p=myfunction(arguments)

    ```


