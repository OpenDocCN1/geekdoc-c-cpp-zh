    # Figure 4.16 Sparse matrices


    In Figure 4.16(a), all the entries above the main diagonal are zero or equivalent
    and all non-zero entries can occur only on or below the diagonal. This is known
    as the lower matrix or triangular matrix.


    In Figure 4.16(b), all the non-zero entries occur on the diagonal or on the elements
    above the diagonal. This is known as the tridiagonal matrix.


    A matrix requires lot of space in memory. A two-dimensional array is used to represent
    matrices. Thus, a 1000x1000 matrix requires huge storage locations in memory.
    If it is a sparse, to store non-zero elements a huge amount of memory will be
    wasted. A two-dimensional array may not be suitable for sparse matrices.


    Suppose to store a triangular matrix in memory, it is clear that storing all entries
    above the diagonal wastes the memory since they are all zeros. In such a case
    using a triple representation (i,j,value) can save the memory to represent non-zero
    elements of sparse matrix.


