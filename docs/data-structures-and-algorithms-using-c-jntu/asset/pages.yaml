  md: '# 13.2 REPRESENTATION OF A NODE STRUCTURE


    An m-way search tree is an extended tree where the null pointers are represented
    by external nodes. In defining an m-way search tree and while discussing its operations
    external nodes are very helpful. Similar to the case of a tree external nodes
    are not physically represented but are only fictitious.


    The general node structure in an m-way search tree is shown in Figure 13.1. The
    node is with m-1 elements and m child pointers pointing to the roots of m subtrees.
    Pointers to empty subtrees are shown by external nodes represented with filled
    circles as shown in Figure 13.2.


