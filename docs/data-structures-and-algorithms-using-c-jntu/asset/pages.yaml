  md: '**Pattern matching:** Pattern matching is a problem of checking for the presence
    of the given pattern in the given set of paragraphs. Suppose, to search for a
    pattern (word ‘the’) in the given document by looking at all the words in the
    document. It can be concluded that the pattern ‘the’ is present in the document
    or not. To state that the pattern ‘the’ is found or not, the words which starts
    with an alphabet ‘t’ followed with ‘h’ and followed with ‘e’ must be observed.
    If such a structure is found in the document, then it can be said that the pattern
    ‘the’ exists in the document.


    **Pattern recognition:** Pattern recognition is the detected pattern over the
    set of paragraphs. If the pattern which is being searched for is found in the
    given document, then the pattern is recognized or else pattern is not recognized.
    If a human photo is given and asked to locate ‘head’ of the human from the photo,
    as the pattern ‘head’ is known and how the head will be, it is possible to locate
    that shape from the photo. If head is found in the photo, then the pattern head
    is recognized from the photo else the pattern is not recognized from the photo.


    # 15.3 PATTERN MATCHING ALGORITHMS


    Pattern matching algorithms are the procedures for matching or finding the given
    pattern on a set of patterns. Pattern matching algorithms are of two types:


    +   - Fixed pattern matching algorithms

    +   - Regular expression pattern matching algorithms


    # 15.3.1 Fixed Pattern Matching Algorithms


    If the given pattern for searching is constant until the search is complete, then
    the given search pattern is called a fixed pattern, and the algorithms used for
    pattern matching are called fixed pattern matching algorithms.


    Example: Search for the number “21” over the set of patterns (12, 21, 23, 45,
    56, 546, 58). The pattern that is to be searched is 21 and is fixed.


    # 15.3.2 Regular Expression Pattern Matching


    Consider a problem of searching for the number which starts with the digit “1”
    or “2” over the set of patterns (12, 21, 23, 45, 56, 546, 58). In this problem
    the search pattern varies, the recognized patterns in the set are 12, 21 and 23.
    In this problem the first character of the substring can be 1 or 2, which means
    that the first pattern is varying. In the fixed pattern search, the pattern characters
    will not vary in the entire search.


    The regular expressions can be written with some special symbols. Every symbol
    in the regular expression will have a special meaning. A few important regular
    expression symbols are as follows:


    | Symbol | Description |

    | :--- | :--- |

    | \d | Matches with a single digit |

    | \w | Matches with a single character |

    | \W | Matches with a single non-word character |

    | \s | Matches with a single space character |

    | \S | Matches with a single non-space character |

    | r* | Regular expression occurrence for zero or more number of times |

    | r+ | Regular expression occurrence for one or more number of times |'
