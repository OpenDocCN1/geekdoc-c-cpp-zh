    | v3 | 0 | 1 | 1 | 0 | 1 | 0 | 0 |

    | v4 | 0 | 0 | 0 | 1 | 1 | 1 | 0 |

    | v5 | 0 | 0 | 0 | 0 | 0 | 1 | 1 |

