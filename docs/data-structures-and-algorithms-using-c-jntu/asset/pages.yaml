    In all the above examples the rebalanced red–black trees after rotations satisfy
    the properties of the red–black trees. Except colour change LLb, LRb, RRb and
    RLB rotations are the same as LL, LR, RR and RL rotations of AVL search trees.


    # 14.3.3 DELETION


    Deletion of an element from a red–black tree follows the same procedure as that
    of a binary search tree. The three cases of deleting an element from a binary
    search tree, the element as a leaf node, element with one sub-tree (either left
    subtree or right subtree only) and elements with two subtrees.


    The deletion may lead to the imbalance of the red–black tree that may propagate
    toward the root node and it may be solved either by colour change or by appropriate
    rotations.


    If the deleted node is red it will not violate the properties of a red–black tree.
    So, no imbalance occurs and the tree is still a red–black tree. If the deleted
    node is black then it violates the third property of the red–black trees as the
    number of black nodes in the path from the root node to the external node passing
    through the deleted node is decreased by 1. So, the tree is imbalanced.


    The type of imbalance left (L) or right (R) is determined by the location of the
    deleted node with respect to its parent (py). Here, y refers to the node that
    replaces the deleted node. If the sibling of the deleted node s is a black node
    then the imbalance type is further categorized as LB or RB. If s is a red node
    then the imbalances are Lr or Rr.


    If s is black then Lb or Rb is further classified as Lb0, Lb1 and Lb2 and Rb0,
    Rb1 and Rb2, respectively, based on whether s has 0 or 1 or 2 red children. If
    s is red then Lr or Rr is further classified as Lr0, Lr1 and Lr2 and Rr0, Rr1
    and Rr2 based on 0 or 1 or 2 grandchildren of s.


    These imbalances are handled by corresponding rotations. During rotations swap
    only the elements but not the colours. The imbalances are explained based on their
    category along with the general representations and examples. In the representation
    the hatched node indicate either red or black colour of the node.


    **Rb0, Rb1 and Rz2 imbalances:** The general representation of Rb0, Rb1 and Rb2
    imbalances and their corresponding rotations are depicted in Figure 14.13. The
    notations R, b and 0 or 1 or 2 specified on the edges of the red–black tree indicate
    the classification of the imbalance.


    The two possible cases of R0 are shown in Figure 14.13. The rebalancing merely
    calls for colour change of nodes. This may send the imbalance up to the root of
    the subtree where appropriate rebalancing steps must be taken. Rb1 imbalance is
    again of two types and specified as Rb1 (type 1) and Rb1 (type 2). In these two
    cases, s has a single red child either in sL or wR respectively. The Rb2 imbalance
    occurs when s has two red children in sL and w.'
