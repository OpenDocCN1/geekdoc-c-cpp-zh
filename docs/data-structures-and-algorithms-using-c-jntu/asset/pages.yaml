    # 5.6 COMPARISON OF VARIOUS LINKED LISTS


    This section deals with a comparison of various types of linked lists.


    # 5.6.1 Linked Lists Versus Arrays


    Linked lists have several advantages over arrays. The insertion of an element
    at a specific point of a list is a constant time operation, whereas the insertion
    in an array requires half of the elements or more to be moved downwards. While
    deletion of an element from an array requires constant time by somehow marking
    its slot as "vacant", an algorithm that iterates over the elements may have to
    skip a large number of vacant slots.


    Moreover, arbitrarily many elements may be inserted into a linked list, limited
    only by the total memory available, while an array will eventually fill up, and
    then have to be resized—an expensive operation that may not even be possible if
    the memory is fragmented. Similarly, an array from which many elements are removed
    may have to be resized in order to avoid wasting too much space.


    On the other hand, arrays allow random access, while linked lists allow only sequential
    access to elements. Singly linked lists, in fact, can only be traversed in one
    direction. This makes linked lists unsuitable for applications where it is useful
    to look up an element by its index quickly, such as heap sort. Sequential access
    on arrays is also faster than linked lists because they have greater locality
    of reference and thus profit more from processor caching.


    Another disadvantage of linked lists is the additional storage needed for references,
    especially for lists of small data items such as characters or Boolean values.
    It can also be slow, and with a naïve allocator, wasteful, to allocate memory
    separately for each new element, a problem generally solved using memory pools.


    Some hybrid solutions try to combine the advantages of the two representations.
    Unrolled linked lists store several elements in each list node, increasing cache
    performance while decreasing memory overhead for references.


    A good example that highlights the pros and cons of using arrays versus linked
    lists is by implementing a program that resolves the Josephus problem. The Josephus
    problem is an election method that works by having a group of people stand in
    a circle. Starting at a predetermined person, you count around the circle n times.
    Once the mth person is reached, take them out of the circle and have the members
    close the circle. Then count around the circle the same n times and repeat the
    process, until only one person is left. That person wins the election. This shows
    the strengths and weaknesses of a linked list over an array, because people are
    in a circular linked list; it shows how easily the linked list is able to delete
    nodes as it only has to rearrange the links to the different nodes. However, the
    linked list will be poor at finding the next person to remove and will need to
    recur through the list until it finds that person. An array, on the other hand,
    will be poor at deleting nodes (or elements) as it cannot remove one node without
    individually shifting all the elements up the list by one. However, it is exceptionally
    easy to find the nth person in the circle by directly referencing them by their
    position in the array.


    The list ranking problem concerns the efficient conversion of a linked list representation
    into an array. Although trivial for a conventional computer, solving this problem
    by a parallel algorithm is complicated.'
