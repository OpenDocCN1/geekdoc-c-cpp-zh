    ALGORITHM 8.6:

    1. Find the location at which item is to be stored, L=H(key{Item})

    2. If location L is not OCCUPIED then insert Item.

    3. If location L is OCCUPIED find another location using some probe sequence.

    4. Set Location L to ITEM and repeat steps 2 and 3

    End

    ```


    The following are the well-known probe sequences:


    +   - Linear probing: in which the interval between probes will be fixed usually
    to 1.

    +   - Quadratic probing: in which interval between probes is increased by adding
    the successive outputs of a quadratic polynomial to the starting value given by
    the hash function.

    +   - Double hashing: in which the interval between probes is obtained by using
    another hash function.'
