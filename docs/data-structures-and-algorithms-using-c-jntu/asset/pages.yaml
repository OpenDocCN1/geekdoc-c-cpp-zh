  md: '# Sorting and Searching


    This chapter provides an exclusive discussion regarding sorting and searching.
    In this chapter, a number of sorting techniques namely bubble sort, insertion
    sort, selection sort, quick sort, merge sort, shell sort, radix sort and heap
    sort are detailed. The chapter also gives a clear explanation about the very popular
    and frequently used searching techniques namely linear search, binary search and
    Fibonacci search.


    # 16.1 SORTING


    Sorting is a technique to arrange a set of items in some order. One reason that
    it is so useful is that it is much easier to search for something in a sorted
    list than an unsorted one. Among the sorting algorithms, bubble sort, insertion
    sort and selection sort are good enough for most of the small tasks. To process
    a large amount of data, choose one among the sorting algorithms such as quick
    sort, merge sort, shell sort, radix sort, heap sort, etc.


    # 16.1.1 BUBBLE SORT


    The simplest sorting algorithm is bubble sort. The bubble sort works by iterating
    down an array to be sorted from the first element to the last, comparing each
    pair of elements and swapping their positions if necessary. This process is repeated
    as many times as necessary until array is sorted. Let L be an unordered list with
    elements A1, A2, A3, ..., An. Bubble sorted these elements in their increasing
    order, that is L=[A1, A2, A3, ..., An], where A1<=A2<=A3...<=An.


    +   Step 1: A1 and A2 are compared and if they are out of order, then interchange
    so that A1<=A2. Then compare A2 and A3 and interchange so that A2<=A3. This process
    is repeated for all n elements. When this step is completed observe that the largest
    element is “bubbled up” to the rth position, i.e. An contains the largest element.
    Here n-1 comparisons take place.


    +   Step 2: Repeating Step 1 with one fewer comparison, i.e. up to n-2 elements.
    After this step the second largest element is stored in the n-1th location.'
