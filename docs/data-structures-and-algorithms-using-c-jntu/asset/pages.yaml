  md: '+   - Visiting a node of a binary tree is known as traversal. Various traversal
    techniques are inorder, preorder, postorder and level order.

    +   - The inorder traversal starts with root node and traverses the left subtree
    and then the right subtree.

    +   - The preorder traversal visits a node first then traverses its left subtree
    and then traverses its right subtree.

    +   - The postorder traversal of a binary tree traverses the left subtree of a
    node first and traverses its right subtree and finally visits the node.

    +   - The level-order traversal of a binary tree traverses the nodes in a level-by-level
    manner from top to bottom and among the nodes of the same level they are traversed
    from left to right.

    +   - Threads are pointers or links. Threaded trees are the trees whose nodes
    use threads.


