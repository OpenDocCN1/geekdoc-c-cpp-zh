    # 2.4.3 REASONS FOR THE USAGE OF INHERITANCE


    Specialization: A new class is derived from the base class and this class may
    just add something more to the base class or it may slightly differ from the base
    class.


    Generalization: When two or more classes have similar properties, then this similarity
    can be combined together into a common base class.


    Interface: Used by the base class to define interface, but doesn''t implement
    some or all parts of it.


