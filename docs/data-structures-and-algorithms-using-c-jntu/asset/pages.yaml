  md: '# 5.6.1.1 Singly Linked Lists Versus Other Lists


    While doubly linked and/or circular lists have advantages over singly linked linear
    lists, the linear lists offer some advantages that make them preferable in some
    situations.


    Many operations on singly linked linear lists (such as merging two lists or enumerating
    the elements in reverse order) often have very simple recursive algorithms, much
    simpler than any solution using iterative commands. While one can adapt those
    recursive solutions for doubly linked and circularly linked lists, the procedures
    generally need extra arguments and more complicated base cases.


    Linear singly linked lists also allow tail-sharing, the use of a common final
    portion of sub-list as the terminal portion of two different lists. In particular,
    if a new node is added at the beginning of a list, the former list remains available
    as the tail of the new one—a simple example of a persistent data structure. Again,
    this is not true with the other variants: a node may never belong to two different
    linked lists.


    In particular, end-sentinel nodes can be shared among singly linked non-circular
    lists. One may even use the same end-sentinel node for every such list. Indeed,
    the advantages of the fancy variants are often limited to the complexity of the
    algorithms, not in their efficiency. A circular list, in particular, can usually
    be emulated by a linear list together with two variables that point to the first
    and last nodes at no extra cost.


    # 5.6.1.2 Doubly Linked Versus Singly Linked Lists


    Doubly linked lists require more space per node (unless one uses xor-linking),
    and their elementary operations are more expensive; but they are often easier
    to manipulate because they allow sequential access to the list in both directions.
    In particular, one can insert or delete a node in a constant number of operations
    given only that node''s address. To do the same in a singly linked list, one must
    have the previous node''s address. On the other hand, they do not allow tail-sharing,
    and cannot be used as persistent data structures.


    # 5.6.1.3 Circularly Versus Linear I-Lists


    A circularly linked list may be a natural option to represent arrays that are
    naturally circular, e.g. for the corners of a polygon, for a pool of buffers that
    are used and released in FIFO (FIRST-IN-FIRST-OUT) order, or for a set of processes
    that should be time-shared in round-robin order. In these applications, a pointer
    to any node serves as a handle to the whole list.


    With a circular list, a pointer to the last node gives easy access also to the
    first node by following one link. Thus, in applications that require access to
    both ends of the list (e.g. in the implementation of a queue), a circular structure
    allows one to handle the structure by a single pointer instead of two.


    A circular list can be split into two circular lists, in constant time, by giving
    the addresses of the last node of each piece. The operation consists in swapping
    the contents of the link fields of those two nodes. Applying the same operation
    to any two nodes, nodes in two distinct lists, joins the two lists into one. This
    property greatly simplifies some algorithms and data structures, such as the quad-edge
    and face-edge.


