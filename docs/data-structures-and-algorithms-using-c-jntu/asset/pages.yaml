  md: "```\nCalling DerivedC Class Destructor\nCalling DerivedB Class Destructor\n\
    Calling Base Class Destructor\n```\n\nIn case of multi-level inheritance, three\
    \ or more constructors are to be called. In Program 2.24, Class C is derived from\
    \ derived Class B. In this case, the constructors of base Class A, Class B and\
    \ Class C are called, respectively. In the reverse order the destructors are called.\n\
    \n# Arguments passing to the base class constructor:\n\nInheritance allows the\
    \ classes to have constructors, the constructors can be with and without arguments.\
    \ The problem here is that an object can be created to a derived class. If that\
    \ is the case “how to pass the arguments to the base class constructor while creating\
    \ an object to the derived class”. To solve this problem, C++ allows the developers\
    \ to pass the arguments to the base class constructor by using colon ( : ) operator\
    \ in the declaration of the derived class, and the arguments can be passed in\
    \ the order of derived class object arguments, base class argument list.\nSuppose\
    \ the derived class constructors have one integer argument and two float arguments\
    \ to the base class constructor. Then the developer can pass the derived class\
    \ argument followed with the base class arguments.\nThe general form of declaration\
    \ of the derived class constructors is as follows:\n\n```\nDerived-class-constructor\
    \ ( args ) : base-class1-constructor ( args ) ,\nbase-class2-constructor( args\
    \ )\n..... ....\nbase-classN-constructor(args)\n{\n    // definition of the derived\
    \ class\n}\n```\n\nThe general form of passing the arguments to the derived class\
    \ constructors is as follows:\n\n```\nDerived-class object-name(list of derived-class-args,\
    \ list-of-base-class-args) ;\n```\n\nProgram to demonstrate the arguments passing\
    \ to the base class constructors:\n\n# Program 2.25\n\n```\n#include<iostream.h>\n\
    #include<conio.h>\nclass Base{\npublic:\nBase(int x)\n{\ncout<<\"\\nCalling Base\
    \ Class Constructor\";\ncout<<\"\\nArgument Value Received by the Base Class:\"\
    <<x;\n}\n~Base()\n{\ncout<<\"\\nCalling Base Class Destructor\";\n}\n};\n```"
