  md: "# 16.1.6 Shell Sort\n\nShell sort is a sorting algorithm that is a generalization\
    \ of insertion sort with two observations:\n\n+   - Insertion sort is efficient\
    \ if the input is “almost sorted”.\n+   - Insertion sort is typically inefficient\
    \ because it moves values just one position at a time.\n\nThe shell sort is named\
    \ after its inventor DL Shell in 1959. It is fast, easy to understand and easy\
    \ to implement. However, its complexity analysis is more complicated. The idea\
    \ of shell sort is to arrange the data sequence in a two-dimensional array and\
    \ sort the columns of the array. The effect is that the data sequence is partially\
    \ sorted. The process above is repeated, but each time with a narrower array,\
    \ i.e. with a smaller number of columns. In the last step, the array consists\
    \ of only one column. In each step, the sortedness of the sequence is increased\
    \ until the last step is completely sorted. However, the number of sorting operations\
    \ necessary in each step is limited due to the presortedness of the sequence obtained\
    \ in the preceding steps.\n\nConsider a small value that is initially stored in\
    \ the incorrect position of the array which makes the array out of order. Using\
    \ an O(n^2) sort such as bubble sort or insertion sort, it will take roughly n\
    \ comparisons and exchanges to move this value all the way to the other end of\
    \ the array. Shell sort first moves values using huge step sizes, so a small value\
    \ will move a long way towards its final position with just a few comparisons\
    \ and exchanges\n\nActually, the data sequence is not arranged in a two-dimensional\
    \ array, but held in a one-dimensional array that is indexed appropriately. For\
    \ instance, data elements at positions 0, 5, 10, 15, etc. would form the first\
    \ column of an array with five columns. The “columns” obtained by indexing in\
    \ this way are sorted with insertion sort since this method has a good performance\
    \ with presorted sequences.\n\nAlgorithm 16.6 is the algorithm for shell sort.\n\
    \n# Algorithm 16.6: SHELL-SORT\n\n```\n// An array DATA of length n with array\
    \ elements numbered 0 to n-1\n// Set inc=round(n/2)\n1. Repeat while inc>0 do\n\
    \   1. Repeat for i=inc to n-1 do\n      2. temp=DATA[i]\n      3. j=i\n     \
    \ 4. Repeat while j>=inc and DATA[j-inc]>temp do\n         5. DATA[j]=DATA[j-inc]\n\
    \         6. j=j-inc\n      7. DATA[j]=temp\n   8. End step 4 loop\n   9. inc=round(inc/2.2)\n\
    \  10. End step2 loop\n3. End loop\n4. End\n```\n\n# Example 16.7\n\nLet 3 7 9\
    \ 0 5 1 6 8 4 2 0 6 1 5 7 3 4 9 8 2 be the data sequence to be sorted. First,\
    \ it is arranged in an array with seven columns (left) and then the columns are\
    \ sorted (right) (Figure 16.7)\n\n| 3 | 7 | 9 | 0 | 5 | 1 | 6 | | 3 | 3 | 2 |\
    \ 0 | 5 | 1 | 5 |\n| 8 | 4 | 2 | 0 | 6 | 1 | 5 | | 7 | 4 | 4 | 0 | 6 | 1 | 6 |\n\
    | 7 | 3 | 4 | 9 | 8 | 2 | | | 8 | 7 | 9 | 9 | 8 | 2 |\n(a) Array as 7 columns\
    \ (b) Sorted columns\n\nFigure 16.7 Sorted array with seven columns"
