    # 12.5.3 Deletion


    Deletion of an element from an AVL search tree may also cause imbalance similar
    to insertion, rotations are invoked to rebalance the tree after deletion. Major
    classification of rotations are as L and R which can be further categorized as
    L0, L1, L-1 regarding L rotations and R0, R1, R-1 regarding R rotations.


    Let p be the parent of the node that was deleted. Due to deletion the balance
    factors of some or all of the nodes on the path from the root to p might be changed.
    It is required to update the balance factors from node p to the root in the upward
    direction. All the deletions may not call the rotations. They are referred to
    as rotation free deletions.


    The following observations can be made regarding deletion:


    +   1) If the node was deleted from the right subtree of p then bf(p) increases
    by 1 and if it was from the left subtree of p then bf(p) decreases by 1.

    +   2) The height of the tree is decreased by 1 when the new bf(p) = 0. It is
    required to update the balance factor of its parent and/or its ancestors.

    +   3) The height of the tree remains the same when the new bf(p) = +1 or -1 and
    there will be no change in the balance factors of its ancestor nodes.

    +   4) The tree is imbalanced at node p when the new bf(p) = +2 or -2, and hence
    corresponding rotations are to be invoked.


    In this process the balance factors of some nodes may become +2 or -2. In the
    path from p to the root the first node among them is A, the ancestor node. At
    node A the balance has to be restored, so the imbalance can be classified as type
    L when the deletion is from the left subtree of A and it is of type R when the
    deletion is from the right subtree of A.


    Regarding type L, the bf(A) would have been -1 prior to deletion when it is now
    -2; bf(A)==2. Ancestor node A might have a right subtree with root B. With respect
    to the bf(B) the L type rotations are further classified as L0 if bf(B)=0, L1
    if bf(B)=+1 and L-1 if bf(B)=-1.


    Regarding type R, the bf(A) would have been +1 prior to the deletion when it is
    now +2; bf(A)=+2. Ancestor node A might have a left subtree with root B. With
    respect to the bf(B) the R type rotations are further classified as R0 if bf(B)=0,
    R1 if bf(B)=+1 and R-1 if bf(B)=-1.


    # R category rotations:


    The following are the three types of R category rotations. They are explained
    along with representation and example.


    # R0 rotation:


    General representation of R0 rotation is illustrated in Figure 12.20. Some node
    X is to be deleted from right subtree of C, i.e. C''R. After deleting it, the
    balance factor of C changed from +1 to +2. Node B the left subtree of C has a
    balance factor of 0. So, R0 rotation is to be used to rebalance the tree. It pushes
    B into the place of C along with its left subtree Bn and C is shifted down into
    the place of its right subtree along with the C''n and Bn as its left subtree,
    the earlier right subtree of B. Here C''n is the right subtree of C after deletion.'
