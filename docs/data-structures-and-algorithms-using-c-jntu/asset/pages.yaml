    # Figure 4.5 General indexing formula


    Like a regular variable, an array must be declared before it is used. A typical
    declaration for an array in C++ is:


    ```

    data type Array-name[elements];

    ```


    where data type is a valid type like int, float, etc. Array-name is a valid identifier
    and the elements field specifies the maximum number of elements the array can
    hold. Therefore, an array A of integer type can be declared as:


    ```

    int A[5];

    ```


    **Representation of two-dimensional arrays:** A two-dimensional array can be represented
    in two different ways in the memory:


    +   * Row major order

    +   * Column major order


    The elements are stored on a row-by-row order, that is, the first row elements
    followed by the second row elements and so on in the row major order. Elements
    are stored column by column, that is, the first column elements followed by the
    second column and so on in the column major order. Consider the array A[R,C] in
    Figure 4.6.


