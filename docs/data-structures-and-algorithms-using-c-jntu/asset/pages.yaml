- pgno: 577
  md: '# # Data Structures and Algorithms Using C++


    # Ananda Rao Akepogu | Radhika Raju Palagiri


    Data Structures and Algorithms Using C++ helps students to master data structures,
    their algorithms and the analysis of complexities of these algorithms. Each chapter
    includes an Abstract Data Type (ADT) and applications along with a detailed explanation
    of the topics. This book meets the requirements of the course curricula of all
    Indian universities.


    # Salient Features


    +   * Pattern matching and tries, tournament trees and red-black trees are extensively
    discussed by providing suitable examples.

    +   * Extensive visual figures help in understanding data structures and their
    operations.

    +   * The book has a large number of programs, multiple-choice questions, fill
    in the blanks and other exercises to help students in their course and also in
    competitive exams.


    ![](img/45784b9f0334626143002ec0d63692fd_577_0.png)


    Ananda Rao Akepogu is Professor and Head of the Computer Science and Engineering
    Department, and Vice Principal of Jawaharlal Nehru Technological University, Anantapur
    College of Engineering Anantapur, Andhra Pradesh.


    ![](img/45784b9f0334626143002ec0d63692fd_577_1.png)


    Radhika Raju Palagiri is Ad Hoc Lecturer in the Computer Science and Engineering
    Department, Jawaharlal Nehru Technological University, Anantapur College of Engineering
    Anantapur, Andhra Pradesh.'
