    # ## 3.7.2 Finding g(x), c, and n0 Values


    # ### Example 1


    Let f(n) = 3n + 2 for an algorithm. Computation of c, n0, and g(n) can be performed
    as f(n) = 3n + 2. The function can be written in terms of g(n) as


    f(n) >= c*g(n)

    3n + 2 >= c*g(n), let function value nearest minimum be 3n, consider c=3, then

    3n + 2 >= 3*g(n) define g(x) = n

    3n + 2 >= 3n find n0


    +   - put n=1 ... 5 >= 3 (True)

    +   - put n=2 ... 3*2+2 >= 3*2 (true)

    +   - put n=3 ... 3*3+2 >= 3*3 (true)

    +   - put n=4 ... 3*4+2 >= 3*4 (true)


    So, as per the mathematical induction, the function f(x) can be written in terms
    of g(x), and is true for all n0 positive integers.


    The function f(x) can be defined as f(x) >= 3n where n >= 1.


    # ### Example 2


    Let f(n) = 3n^4 + 2n^2 for an algorithm. Computation of c, n0, and g(n) can be
    performed as f(n) = 3n^4 + 2n^2.


    f(n) >= c*g(n) (Omega notation)

    3n^4 + 2n^2 >= c*g(n)

    3n^4 + 2n^4 >= 3*g(n)

    3n^4 + 2n^4 >= 3*g(n) Let g(n) = n^4

    3n^4 + 2n^4 >= 3*n^4


    +   - for n=1 ... 5 >= 3 (True)

    +   - for n=2 ... 56 >= 48 (True)

    +   - for n=3 ... 261 >= 243 (True)


    So, for all n >= 1 function f(x) can be written as 3*n^4.


    # ## 3.7.3 Theta Notation (θ)


    **Definition:** f(n) = θ(g(n)) iff there exists positive constants c1 and c2 and
    n0 such that c1*g(n) <= f(n) <= c2*g(n) for all n >= n0,

    In this notation, the value that lies in between the upper bound and maximum possible
    lower bounds will be selected.'
