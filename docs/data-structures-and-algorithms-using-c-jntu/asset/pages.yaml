    # 8.6 COMPARISON OF CHAINING AND OPEN ADDRESSING


    +   • Chained hash tables are simple to implement and require only basic data
    structures.

    +   • Chained hash tables are insensitive to clustering while writing suitable
    hash functions.

    +   • Open addressing depends upon better hash functions to avoid clustering.

    +   • Chains grow longer as the table fills, and a chained hash table cannot fill
    up and does not exhibit the sudden increases in lookup times that occur in a near-full
    table with open addressing.

    +   • When hash tables are used to store large records, chaining uses less memory
    than open addressing.

    +   • For small record sizes, open addressing is more space-efficient than chaining
    since they do not need to store any pointers or allocate any additional space
    outside the hash table.

    +   • Open addressing avoids the extra indirection required for changing external
    storage because it uses internal storage. It also has better locality of reference,
    particularly with linear probing. They can be easier to serialize because they
    don''t use pointers.

    +   • If the open addressing table only stores references to elements (external
    storage), it uses space comparable to chaining even for large records but loses
    its speed advantage. On the other hand, normal open addressing is a poor choice
    for large elements, since these elements fill entire cache lines, and a large
    amount of space is wasted on large empty table slots.

    +   • Generally open addressing is better used for hash tables with small records
    that can be stored within the table and fit in a cache line. They are particularly
    suitable for elements of one word or less. In cases where the tables have high
    load factors, the records are large, or the data are variable-sized, chained hash
    tables often perform better as well.


