- pgno: 3
  md: '# # About the Authors


    **Ananda Rao Akepogu** is Professor and Head of the Computer Science and Engineering
    Department and Vice Principal of Jawaharlal Nehru Technological University Anantapur
    College of Engineering Anantapur. He is an alumnus of IIT Madras, Chennai. He
    received his B.Tech. (CSE) and M.Tech. (AI and Robotics) degrees from the University
    of Hyderabad, Andhra Pradesh, and his Ph.D. degree from IIT Madras, Chennai. He
    has 18 years of teaching experience in JNT University. He has published around
    50 papers in various international and national journals and conferences. He has
    also worked on Programming in C and Data Structures by J. R. Hanly, E. B. Koffman
    and A. Kamthane and Database Management Systems by Peter Rob and Carlos Coronel.
    His research interests include Artificial Intelligence, Software Engineering,
    Cloud Computing and Object-oriented Databases.


    **Radhika Raju Palagiri** is presently working as an ad hoc lecturer in the Computer
    Science and Engineering Department, Jawaharlal Nehru Technological University
    Anantapur College of Engineering Anantapur. She received her M.Tech. in Computer
    Science from JNTU Anantapur. She has 13 years of teaching experience at the undergraduate
    and postgraduate levels. Her areas of interest lie in Software Engineering and
    Expert Systems.'
