    Enter your option:5\n```\n\nTime complexity of operations: The search operation\
    \ on a red-black tree is exactly the same as is on a binary search tree with the\
    \ time complexity of O(log n). Insertion and/or deletion operations may invoke\
    \ colour change which may spread in the upward direction till the root node and\
    \ may also invoke the rotations to rebalance the tree. The rotations and colour\
    \ change require only a constant time O(1). In the worst case the insertion or\
    \ deletion operation will have the time complexity of O(log n). The maximum height\
    \ of the red-black tree is 2log2(n+1). So, the operations search, insert and delete\
    \ that require O(h) will have a time complexity of O(log n).\n\n# 14.4 Splay Trees\n\
    \nThe worst case time complexity of either binary search trees or AVL trees or\
    \ red-black tree is O(n). A binary search tree is used to store a set of records\
    \ or elements. If one of them is retrieved for m number of times then the worst\
    \ case time complexity of this operation sequence will be O(m.n). In many day-to-day\
    \ applications such as dictionary, once an element is accessed, the likelihood\
    \ to access the same element frequently is more than to an unaccessed element.\n\
    \nIf the accessed element is in a leaf node then its time complexity is O(n).\
    \ As the same element may be accessed for many times in the near future, if it\
    \ is available in the root node for further accesses its time complexity will\
    \ be O(1). Though adjusting the tree in this manner is expensive, it makes further\
    \ accesses faster and cheaper. In this process of adjustment other elements which\
    \ are deep down in the tree may come up and allows their accesses to be relatively\
    \ cheaper.\n\nDaniel Dominic Sleator and Robert Endre Tarjan invented a data structure\
    \ called a splay tree, which provides the above-discussed mechanism. Splay trees\
    \ are binary search trees and they are with a wonderful property that can be adapted\
    \ optimally to a sequence of tree operations. When any operation (such as search,\
    \ insert and delete) performed on a node, it is moved towards the root node. In\
    \ due course, the inactive elements are moved far away from the root node."
