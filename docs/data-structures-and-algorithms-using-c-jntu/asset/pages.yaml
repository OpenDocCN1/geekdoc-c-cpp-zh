    # 16.2 SEARCHING


    Searching is the process of finding the location of a given element in a set of
    elements. The search is said to be successful if the given element is found, i.e.
    the element does exist in the collection (such as an array); otherwise wise it
    is unsuccessful. In this section various classical algorithms for searching are
    discussed in detail.


    # 16.2.1 LINEAR SEARCH OR SEQUENTIAL SEARCH


    Linear search is the technique of searching a given item in the list by comparing
    each and every element in the list sequentially. If the item is found then the
    search is said to be successful, if not, it is considered to be unsuccessful.


    Suppose DATA is an array with N elements, let ITEM be the element to be searched
    in DATA. Traverse the array DATA sequentially and search for the ITEM by comparing
    each element of it with ITEM, i.e. first compare DATA[1] with ITEM and then DATA[2]
    with ITEM and so on until ITEM is found. If item is not found the search is said
    to be unsuccessful.


    Algorithm 16.9 is the algorithm for Linear Search.


    ```

    Algorithm 16.9: LINEAR_SEARCH (DATA, N, ITEM, LOC)

    1. Set LOC=1 //initialize the counter variable

    2. Repeat while(LOC<=N) and DATA[LOC] !=ITEM

    3. Set LOC=LOC+1

    4. End loop

    5. Check whether DATA[LOC] =ITEM hen

    Print "unsuccessful search"

    6. Else

    Print "successful search at location LOC"

    7. End

    ```


    # Example 16.11


    Let DATA be an array of elements [35, 20, 33, 45, 60, 55, 60]. Suppose ITEM=60
    is to be searched. Search proceeds down the array comparing each element with
    ITEM until it finds the last element in the array. Initially assign DATA[N+1]=60.


    First it checks with DATA[1], i.e. 35=60 which is false, then it checks with DATA[2],
    i.e. 65=60 again false, then it checks with DATA[3], i.e. 20=60 is also false.
    Continuing in this way at LOC=6, the element 60 matches with the ITEM. So, the
    search is said to be successful. If the ITEM is not found, then the search is
    said to be unsuccessful.


    The time complexity of linear search in best case is O(1), worst case is O(n)
    and in average case is also O(n).'
