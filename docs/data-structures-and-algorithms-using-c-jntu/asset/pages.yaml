    # 8.5 COLLISIONS


    When a hash function maps two different keys to same location then collision occurs.
    Thus the corresponding records cannot be stored in the same location. An array
    with four records, each with two fields, one for the key and one to hold data
    is considered. Let the hashing function be a simple modulus operation, i.e. array
    index is computed by finding the reminder of dividing the key by 4:


    ```

    Array Index: = key MOD 4

    ```


    Then key values 9, 13, 17 will all hash to the same index. When two (or more)
    keys hash to the same value, a collision is said to occur (Figure 8.8).


    ![](img/45784b9f0334626143002ec0d63692fd_255_0.png)


    Figure 8.8 Collision


    Collision resolution techniques: The two most popular techniques for collision
    resolution are:


    +   1. Separate chaining—An array of linked list implementation

    +   2. Open addressing (or closed hashing)—Uses an array based implementation


    # 8.5.1 SEPARATE CHAINING


    The hash table is implemented as an array of linked lists. To insert an item into
    the table, it is appended to the corresponding linked lists. The linked list to
    which it is to be appended is determined by hashing the inserting item. This technique
    is known as chaining or separate chaining or open hashing because each hash table
    element is a separate chain (linked list). Its data field contains either keys
    or references to keys. This technique allows one to perform all operations easily
    without any collision. Separate chaining is depicted in Figure 8.9:'
