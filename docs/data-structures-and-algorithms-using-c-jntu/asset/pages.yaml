    # 16.1.3 SELECTION SORT


    Selection sort is the most conceptually simple of all the sorting algorithms.
    It works by selecting the smallest (or largest, if it is to sort in descending
    order) element of the array and placing it at the head of the array. Then the
    process is repeated for the remainder of the array; the next largest element is
    selected and put into the next slot, and so on down the array. Selection sort
    technique selects an element and places it into appropriate position. Because
    a selection sort looks at gradually smaller parts of the array each time, a selection
    sort is slightly faster than the bubble sort. The following are the steps involved
    in the sorting process. Let L be an unordered list of elements A1, A2, .... An.


    +   - Step 1: In the first pass find the position POS of the smallest element
    in the list of n elements. Then swap POS with the first element of the list so
    that the first smallest element acquires its right position, i.e. first position
    in the list.

    +   - Step 2: In the second pass find the position POS of the second smallest
    element in the list of n-1 elements. Swap POS with second element of the list.'
