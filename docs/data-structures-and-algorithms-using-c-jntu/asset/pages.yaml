  md: '# 6.4.2 Postfix Evaluation


    The postfix expression can be easily evaluated using a stack. Scan the expression
    from left to right and if any operand is found, push them into the stack. If any
    operator is found, pop the required number of operands from the stack and then
    perform the operation. Push the result again into the stack. Finally, the evaluated
    expression is placed into the stack.


    In postfix notation the order of the operations is determined by the precedence
    hierarchy and associativity of the operators and operands in the expressions.
    Algorithm 6.6 explains the postfix evaluation.


    # Algorithm 6.6: POST-EVAL (EXP)


    +   1. Scan EXP from left to right and repeat step 2 and step 1 for each element
    of EXP.

    +   2. If operand is found, push it on to the stack.

    +      1. If operator is found then

    +         1. Pop the required number of operands from the stack

    +         2. Evaluate the operator

    +         3. Push the result back into the stack.

    +      End if

    +   3. end if

    +   4. End of step1 loop

    +   5. Pop out the result from stack

    +   6. End


    Consider the following expression in postfix form and evaluate the expression:


    | Scan | Operation | Postfix | Stack |

    |---|---|---|---|

    | 2 | PUSH(2) | | 2 |

    | 3 | PUSH(3) | | 2,3 |

    | 4 | PUSH(4) | | 2,3,4 |

    | + | POP(4),POP(3),PUSH(7) | | 2,7 |

    | * | POP(7),POP(2),PUSH(14) | | 14 |

    | 21 | PUSH(21) | | 14,21 |

    | 7 | PUSH(7) | | 14,21,7 |

    | / | POP(7),POP(14),PUSH(2) | | 14,3 |

    | - | POP(2),POP(14),PUSH(12) | | 11 |


    Finally the value of the expression is 11.


    # 6.4.3 Recursion


    A function calling itself or a call to another function, which in turn calls the
    first function is called a recursive function. These recursive functions are executed
    using stacks. Return address and all local variables and formal parameters of
    the called method will be stored into the stack. Whenever any method is called
    all the elements stored in the stack will be restored after a return is executed.


    Recursion is implemented using the data structure stack. Each recursive call to
    a method requires that the following information to be pushed onto the system
    stack:'
