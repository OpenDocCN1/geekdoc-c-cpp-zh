  md: '# # Chapter 3


    # # Algorithms


    Chapter 3 provides an exclusive study of algorithms. It discusses the basic notations
    used in the algorithms, various types of algorithms that exist and the performance
    analysis of algorithms. A detailed explanation regarding space complexity, apriori
    analysis and asymptotic notations is given. This chapter also elucidates the time
    complexity and worst, average and best case time complexities.


    # ## 3.1 INTRODUCTION


    An algorithm is a step-by-step process of solving a problem. It is a mathematical
    procedure or notation to represent the solution of a problem. It should be clear
    and unambiguous. Algorithm specifies the behaviour of the program to be implemented.
    It includes data structures used, comments on the usage of the data structures,
    process statements and subroutines used by the algorithm if any.


    Many algorithms may be designed as a solution for a given problem. Among them,
    the best is selected based on the amount of space and execution time it requires.


    # ## 3.2 BASIC NOTATIONS


    +   - An algorithm starts with the string "Algorithm" followed by the algorithm
    name

    +   - List of input values

    +   - List of output values

    +   - Assignment of values to a variable will be represented as "←" or "="

    +     - Example: Set radius ← 3 (here the value ''3'' will be assigned to the
    variable radius)

    +   - All the variables in the algorithms are scalars (any value can fit into
    the variable, irrespective of their data types)

    +     - Example: SET radius ← 3

    +     - Example: SET pi ← 3.141

    +     - Example: SET str ← "Welcome to Algorithms"

    +     - Example: SET array ← [0,0]'
