  md: "The implementation of stack using arrays and linked list is discussed. In the\
    \ following section a detailed explanation is given on the areas where stack is\
    \ applied.\n\n# 6.4 APPLICATIONS OF STACKS\n\nStacks have a wide range of applications.\
    \ The following are some of the applications of stack:\n\n+   - Expression evaluation\n\
    +   - Recursion\n+   - Balancing of the matching parenthesis\n\n# 6.4.1 EXPRESSION\
    \ EVALUATION\n\nAn arithmetic expression can be represented in three ways:\n\n\
    +   1. Infix: An operator between two operands is a infix expression.\n+     \
    \ <operand><operator><operand>\n+      Ex: a+b\n+   \n+   2. Postfix: An operator\
    \ that follows two operands is a postfix expression.\n+      <operand><operator><operator>\n\
    +      Ex: a b+\n+   \n+   3. Prefix: An operator that is followed by two operands\
    \ is a prefix expression.\n+      <operator><operand><operand>\n+      Ex: +ab\n\
    \nStacks can be used to evaluate expressions and also to convert expressions from\
    \ one form to another.\n\nInfix to postfix conversion: In algebra the infix notation\
    \ is like a+b.c. The corresponding postfix notation is abc.+. Algorithm 6.5 shows\
    \ the conversion.\n\n# Algorithm 6.5:\n\n+   1. Scan the Infix string from left\
    \ to right.\n+   2. Create an empty stack.\n+   3. If the scanned character is\
    \ an operand, add it to the Postfix string. If the scanned character is an operator\
    \ and if the stack is empty, Push the character to stack.\n+   4. If the scanned\
    \ character is an operator and the stack is not empty, compare the precedence\
    \ of the character with the element on top of the stack (here after top of the\
    \ stack is referred as topStack). If topStack has higher precedence over the scanned\
    \ character then pop the stack, else push the scanned character into the stack.\
    \ Repeat this step as long as the stack is not empty and topStack has precedence\
    \ over the scanned character. Continue this step till all the characters are scanned.\n\
    +   5. Return the postfix string.\n\nConsider the infix string: a+b*c-d. Initially,\
    \ the stack is empty and the postfix string has no characters. Now, the first\
    \ character scanned is 'a'. The character 'a' is added to the postfix string.\
    \ The next character scanned is '+', being an operator it is pushed into the stack."
