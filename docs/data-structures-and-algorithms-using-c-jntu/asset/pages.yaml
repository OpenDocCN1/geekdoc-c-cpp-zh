    # 4.6.3 Deletion


    Deletion is an operation that is used to remove an element from the array. The
    deletion of an element at the end of the array can easily be done, whereas the
    deletion of the element in the middle of the array or at specified locations makes
    the data elements to move one location upwards to fill the array.


    Algorithm 4.3 deletes element from array ARR with N elements at a specified location
    POS where POS<=N and assigns it to the variable ITEM.


    # Algorithm 4.3


    ```

    DELETE (ARR, N, POS, ITEM)

    1. Set ITEM=ARR [POS]

    2. Repeat for i=POS to N-1

    3. Set ARR [i] =ARR [i+1] //move elements upward

    4. Set N=N-1

    5. End

    ```


    Example: Consider an array ARR of size 10 and with 6 data elements. Deleting the
    element at A[2] makes the other element to move one location upward as shown in
    Figure 4.12.'
