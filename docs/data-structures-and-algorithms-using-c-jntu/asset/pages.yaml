  md: '# SUMMARY


    +   - A class is a collection of member variables and member functions.

    +   - An object is an instance of a class. It holds data as well as the methods
    that operate on data.

    +   - Stream is a logical entity of an I/O device. A stream can produce or consume
    information, and is directly linked with the I/O subsystem. The class ios is the
    base class for I/O streams.

    +   - The access specifier provides access rights for the class members from outside
    the class. The private members of a class can be accessed through the public members
    of the same class. The member variables and functions that are declared as public
    can be accessed by the members outside the class. The access specifier protected
    works similar to the keyword private and are very useful in inheritance.

    +   - Scope determines the lifetime and visibility of an identifier. Local scope,
    function scope, file scope, class scope and prototype scope are the different
    types of scopes.

    +   - All the objects of the class share a single copy of the static members.
    Every static variable must be initialized to zero.

    +   - Static functions can only access static member variables and the functions,
    its scope is global within the class.

    +   - Inline function copies the function definition when it is accessed.

    +   - The friend function allows access to private members of a class.

    +   - Function overloading defines more than one function with the same name but
    with different operations.

    +   - The this pointer refers to current invoking object.

    +   - The new operator allocates memory dynamically, and the delete operator deallocates
    memory at runtime.

    +   - Exceptions are runtime errors. try, catch and throw are used to handle exceptions.

    +   - Re-throwing exception is throwing an exception from the catch block.


