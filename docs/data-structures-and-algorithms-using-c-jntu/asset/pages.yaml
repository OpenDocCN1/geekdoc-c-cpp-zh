- pgno: 114
  md: '# 3.3.7 Back Tracking Algorithms


    The back tracking algorithms are completely based on the depth-first-recursive
    search approach. At each step, the algorithm tries to verify whether the solution
    is found or not. If the solution is found, it exits, otherwise it moves to the
    previous step (back) and tries to move the move to the possible case. If no more
    choices are found and the solution is not found, then it returns a failure.


    Example: 8-Queen Problem.


    # 3.3.8 Randomized Algorithms


    The randomized algorithms make a random choice for at least once to make the decision.


    Example: Quick sort uses a random number to select the pivot element.


    # 3.3.9 Hill Climbing Algorithms


    The complete solution of the problem starts from the poor solution. By repeatedly
    applying optimizations, an optimal solution will finally be obtained.


    # 3.4 Performance Analysis


    An algorithm is a step-by-step process of solving a problem. However, a problem
    can be solved in many ways. Among all the feasible solutions or algorithms, very
    few algorithms will give a good approach to the solution with minimum amount of
    time and hardware requirements. These feasible solutions or algorithms are best
    suited for the implementations.


    # 3.4.1 Properties of the Best Algorithms


    Suppose there are a set of algorithms to a problem. Among all the algorithms,
    the best algorithm will have the following properties:


    +   - Takes less time for the complete execution (time complexity)

    +   - Takes less memory space (space complexity)

    +   - Correctness of the solution

    +   - Modularity

    +   - Maintainability

    +   - Robustness

    +   - Reliability

    +   - Scalability

    +   - Functionality

    +   - Extensibility

    +   - Security

    +   - Simplicity

    +   - User-friendliness

    +   - Programmer time


    The algorithms will give a blueprint of software. The algorithms will allow the
    analysts to find the time it requires to develop the software and it tells the
    execution time and memory space it requires.'
