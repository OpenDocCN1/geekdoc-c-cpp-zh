  md: '# 9.10 APPLICATIONS OF BINARY TREES


    Binary trees have a number of applications. Representing arithmetic, logical or
    relational expressions without any ambiguity is one among important applications.
    In an expression tree operands appear as leaf or external or terminal nodes and
    the operators appear as internal or non-terminal nodes. The operand may be either
    an identifier or a number.


    A Polish logician, Jan Lukasiewicz, invention in early 1920s regarding a special
    notation for propositional logic allows the removal of all parentheses from formulas.
    This is known as the Polish notation. This leads to less readability of formulas,
    but is very useful in computers, specially in writing compilers and interpreters.
    In order to provide both readability and unambiguity in the formulas, additional
    symbols like parentheses must be used. But, if avoiding ambiguity is the only
    goal then these symbols can be eliminated and this results change in the order
    of symbols in the formulas. A compiler does the same, i.e. it rejects the things
    that are not important in getting the proper meaning of formulas.


    # 9.10.1 TRAVERSAL OF AN EXPRESSION TREE


    Traversing an expression tree being a binary tree is the same as the traversal
    of a binary tree. Inorder traversal of an expression tree gives infix notation,
    preorder traversal gives prefix notation and postorder traversal gives postfix
    notation of an expression.


    The expressions are represented in three ways, they are infix, prefix and postfix.
    A commonly used representation of an expression is infix, it appears as


    ```

    <operator1><operator2><operand2>

    for instance A+R, P*Q

    The prefix expression appears as <operator><operand1><operand2>

    for instance +AR, *PQ

    The postfix expression appears as <operand1><operand2><operator>

    for instance AR+, PQ+

    ```


    Generally, infix notation is put but some programming languages use Polish notation.
    For instance, LISP and to a large extent LOGO use prefix notation. Forth and Postscript
    use postfix notation.


    # 9.10.2 OPERATIONS ON EXPRESSION TREES


    Binary trees can be created either in top-down or bottom-up manner. Top-down approach
    is used for implementing insertions. Bottom-up approach is used in creating expression
    trees and scanning infix expressions from left to right.


    While constructing an expression tree, it is a must to retain the precedence of
    operators and their associativity as they are in the expression for which an expression
    tree is constructed.


    Let algebraic expression 8+2+3-7 be considered. Its result is based on the order
    of evaluating the operations. If multiplication is done first followed by addition
    and subtraction, the result will be 7. If addition is done first followed by subtraction
    and multiplication as (8+2)-(3-7) the result will be -40. If addition is done
    after multiplication and subtraction as 8+ (2+3)-7 the result will be 7.


    The compiler generates an assembly code where only one operation is preformed
    at once and its result is retained for further operations. So, all the expressions
    must be broken down unambiguously into individual operations and kept in their
    proper order. Here Polish notation is useful. This allows one to create an expression
    tree which imposes an order in executing the operations. For example, the expression
    8+2+3-7, which is the same as 8+ (2+3)-7 is represented by the tree in Figure
    9.15(a). The second and third expressions are represented by the trees shown in
    Figures 9.15(b) and (c), respectively.'
