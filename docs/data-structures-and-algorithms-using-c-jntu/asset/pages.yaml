    # 15.6.3 Suffix Tries


    Suffix trie is a tree which has the suffix symbols of each string from a branch.
    Suffix trie can be called a position tree or a suffix tree. This procedure is
    better suited for finding the largest repetitive substring from the given large
    pattern string. This procedure completely avoids the unnecessary comparisons.


    # Example 1: Construction of suffix trie with an example


    Let the Pattern P = “banana”


    +   Step 1: Find the all possible substrings

    +   T1 = banana

    +   T2 = anana

    +   T3 = nana

    +   T4 = ana

    +   T5 = na

    +   T6 = a


    +   Step 2: Sort all the substrings alphabetically.

    +   T6 = a

    +   T4 = ana

    +   T2 = anana

    +   T1 = banana

    +   T5 = na

    +   T3 = nana


    Step 3: Find the prefixes shared by the substrings.

    Here the prefix of T2 is shared by T6 and T4. T1 is the only node that starts
    with the prefix, and finally the prefix of T3 is shared by T5.

    So, the found major possible strings are T2, T1 and T3. So, the tree will be as
    shown in Figure 15.8.


    Step 4: Construct the tree'
