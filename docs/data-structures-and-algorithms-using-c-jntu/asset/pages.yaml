    This representation is the best and widely used representation. Its time complexity
    is O(n^2) because minimum n^2 entries, excluding diagonal elements, must be examined.


    # Incidence matrix representation:


    For a graph G=(V,E) of n vertices and e edges the incidence matrix, is an n×e
    matrix, and every entry of this matrix is defined as


    ```

    a_{ij} = 1, if an edge e_j is incident on vertex v_i

    a_{ij} = 0, otherwise

    ```


    | | e1 | e2 | e3 | e4 | e5 | e6 | e7 |

    |---|---|---|---|---|---|---|---|

    | v1 | 1 | 1 | 0 | 0 | 0 | 0 | 0 |

