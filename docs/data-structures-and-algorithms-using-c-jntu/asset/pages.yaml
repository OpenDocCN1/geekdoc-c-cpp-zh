  md: 'In contrast to the linear data structures, in non-linear data structures the
    elements do not have a sequence. Examples for such structures are trees, graphs
    and tables.


    # 4.1.1 Array


    An array is a finite set of homogenous elements stored in contiguous memory locations
    which are referenced, respectively, by adding an index as a unique identifier.
    The number of data elements in an array can be obtained by the index using the
    following formula:


    Size of array = UB-LB+1


    where UB is the upper boundary value and LB is the lower boundary value. The size
    of array is UB when LB = 1.


    The elements of an array can be valued by using subscripts or brackets such as
    A[1], A[2], A[3], ..., A[N] or A(1), A(2), A(3), ..., A(N). Let A be an array
    of 5 integers such that A[0]=3, A[1]=4, A[2]=5, and A[4]=8.


    # 4.2 ARRAY TYPES


    The number of subscripts of an array decides the dimension of an array. Based
    on the dimensions, arrays can be classified as single-dimensional arrays and multi-dimensional
    arrays.


    # 4.2.1 SINGLE-DIMENSIONAL ARRAY


    When the elements in an array are referenced by a single subscript, then the array
    is called a one-dimensional array.


    # 4.2.2 MULTI-DIMENSIONAL ARRAY


    Multi-dimensional arrays can be defined as “array of arrays”. Elements of multi-dimensional
    arrays are represented using more than one subscript. For example, a two-dimensional
    array can be imagined as a table with elements, which are of the same data type
