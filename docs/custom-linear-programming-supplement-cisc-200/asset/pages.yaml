    solved with computer packages. Some of the leading commercial packages include
    CPLEX, LINGO, MOSEK, Gurobi, and Xpress-MP.


    ²In Section 7.6 we show that two special cases (infeasibility and unboundedness)
    in linear programming have no optimal solution. The observation stated does not
    apply to these cases.'
