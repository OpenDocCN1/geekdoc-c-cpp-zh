    # Appendix 7.2 Solving Linear Programs with LINGO


    In this appendix we describe how to use LINGO to solve the RMC problem. When you
    start LINGO, two windows are immediately displayed. The outer, or mainframe, window
    contains all the command menus and the command toolbar. The smaller window is
    the model window; this window is used to enter and edit your linear programming
    model you want to solve. As with any model, it is good to document your LINGO
    model with comments. A comment in a LINGO model begins with an exclamation point
    and ends with a semicolon. If desired, a comment can span multiple lines.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'The first item we enter is a comment describing the objective function. Recall
    that the objective function for the RMC problem is to maximize profit. Hence we
    enter the following comment:


    ```

    ! MAXIMIZE PROFIT;

    ```


    Next we press the Enter key and then type the objective function. The objective
    function for the RMC problem is Max 40F + 30S. Thus, in the second line of the
    LINGO model window, we enter the following expression:


    ```

    MAX = 40*F + 30*S;

    ```


    Note that in LINGO the symbol * is used to denote multiplication and that the
    objective function, like a comment, ends with a semicolon. In general, each mathematical
    expression (objective function and constraints) in LINGO is terminated with a
    semicolon.


    Next, we press the Enter key to move to a new line. The first constraint in the
    RMC problem is 0.4F + 0.5S <= 20, for material 1. Thus, in the third and fourth
    lines of the LINGO model window, we enter the following expressions:


    ```

    !MATERIAL 1 CONSTRAINT;

    0.4*F + 0.5*S <= 20;

    ```


    Note that LINGO interprets the <= symbol as <=. Alternatively, we could enter
    < instead of <=. As was the case when entering the objective function, a semicolon
    is required at the end of the first constraint. Pressing the Enter key moves us
    to a new line, and we continue the process by entering the remaining comments
    and constraints as shown here:


    ```

    !MATERIAL 2 CONSTRAINT;

    0.2*S <= 5;

    !MATERIAL 3 CONSTRAINT;

    0.6*F + 0.3*S <= 21;

    ```


    The model window will now appear as follows:


    ```

    !MAXIMIZE PROFIT;

    MAX = 40*F + 30*S;

    !MATERIAL 1 CONSTRAINT;

    0.4*F + 0.5*S <= 20;

    !MATERIAL 2 CONSTRAINT;

    0.2*S <= 5;

    !MATERIAL 3 CONSTRAINT;

    0.6*F + 0.3*S <= 21;

    ```


    If you make an error in entering the model, you can correct it at any time by
    simply positioning the cursor where you made the error and entering the necessary
    correction.


    To solve the model, select the Solve command from the LINGO menu or press the
    Solve button on the toolbar at the top of the mainframe window. LINGO will begin
    the solution process by determining whether the model conforms to all syntax requirements.
    If the LINGO model doesn''t pass these tests, you will be informed by an error
    message. If LINGO does not find any errors in the model input, it will begin to
    solve the model. As part of the solution process, LINGO displays a Solver Status
    window that allows you to monitor the progress of the solver. LINGO displays the
    solution in a new window titled "Solution Report". The output that appears in
    the Solution Report window for the RMC problem is shown in Figure 7.28.'
  merge: -1
  img_proc: true
