  md: '# Appendix 7.1 Solving Linear Programs with Excel 2010


    In this appendix we will use an Excel worksheet to solve the RMC linear programming
    problem. We will enter the problem data for the RMC problem in the top part of
    the worksheet and develop the linear programming model in the bottom part of the
    worksheet. Note that Appendix A contains much more detail on how to formulate
    models in Excel.


    # Formulation


    Whenever we formulate a worksheet model of a linear program, we perform the following
    steps:


    +   Step 1. Enter the problem data in the top part of the worksheet

    +   Step 2. Specify cell locations for the decision variables

    +   Step 3. Select a cell and enter a formula for computing the value of the objective
    function

    +   Step 4. Select a cell and enter a formula for computing the left-hand side
    of each constraint

    +   Step 5. Select a cell and enter a formula for computing the right-hand side
    of each constraint


    The formula worksheet that we developed for the RMC problem using these five steps
    is shown in Figure 7.25. Let us review each of the preceding steps as they apply
    to the RMC problem.


    # FIGURE 7.25 EXCEL FORMULA WORKSHEET FOR THE RMC PROBLEM


    ![](img/e2cb94e77057728e7ce105fa1f79ad61_57_0.png)'
  merge: -1
  img_proc: true
