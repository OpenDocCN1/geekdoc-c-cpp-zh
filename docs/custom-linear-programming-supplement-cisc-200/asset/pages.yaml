  md: '# ACTION


    # THE U.S. NAVY USES LINEAR PROGRAMMING FOR FUEL CONSERVATION*


    The U.S. Navy spends approximately one billion dollars per year on fuel for its
    ships. The major determinant of fuel consumption for a ship is speed. A ship can
    be operated in a number of different modes. For example, a naval destroyer ship,
    with four engines available to run two shafts for propelling the ship, may operate
    in three different modes: trail-shaft, split-plant, and full-power. In trail-shaft
    mode, one of the four engines runs a single shaft. In split-plant mode, two engines
    run, each driving its own shaft. Full-power mode has all four engines running,
    two on each shaft. Full-power has the highest full consumption rate as measured
    in gallons per hour. Depending on the mode, a ship may consume between 600 to
    7000 gallons of fuel per hour.


    The captain of a ship which needs to get from point A to point B in a certain
    amount of time has mode options, each of which consumes different amounts of fuel.
    The ship can run at a steady speed or at variable speeds. For example, a ship
    can operate in a faster mode during first portion of the trip and in a slower
    mode during the remaining portion of the trip and still arrive at the same time
    as a vessel running at the required constant speed. The U.S. Navy uses a spreadsheet-based
    linear programming model to determine the most fuel efficient way to make a trip
    in a required amount of time.


    The decision variables of the linear program are the amount of time (in hours)
    to run at a given speed. The objective is to minimize fuel consumption subject
    to constraints that the required distance must be covered within a specified amount
    of time. The solution to the linear program specifies the amount of time to run
    at each speed, but the order in which the speeds are implemented is flexible.
    Compared to the fuel consumption when operating in a single mode, fuel savings
    ranging from 2% to 54% have been realized by implementing the variable modes recommended
    by the linear programming model.


    *Based on G. Brown, J. Kline, R. Rosenthal, and A. Washburn, "Steaming on Convex
    Hulls," Interfaces 37, no. 4 (July–August 2007): 342–352.


    # Glossary


    +   - **Constraint** An equation or inequality that rules out certain combinations
    of decision variables as feasible solutions.

    +   - **Problem formulation** The process of translating a verbal statement of
    a problem into a mathematical statement called the *mathematical model*.

    +   - **Mathematical model** A representation of a problem where the objective
    and all constraint conditions are described by mathematical expressions.

    +   - **Decision variable** A controllable input for a linear programming model.

    +   - **Objective function** The expression that defines the quantity to be maximized
    or minimized in a linear programming model.

    +   - **Nonnegativity constraints** A set of constraints that requires all variables
    to be nonnegative.

    +   - **Linear program** A mathematical model with a linear objective function,
    a set of linear constraints, and nonnegative variables.

    +   - **Linear functions** Mathematical expressions in which the variables appear
    in separate terms and are raised to the first power.

    +   - **Feasible solution** A solution that satisfies all the constraints simultaneously.

    +   - **Feasible region** The set of all feasible solutions.'
