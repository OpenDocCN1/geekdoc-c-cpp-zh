    Recognizing redundant constraints is easy with the graphical solution method.
    In problems with more than two decision variables, redundant constraints usually
    will not be apparent.


    Finally, some linear programs may have one or more constraints that do not affect
    the feasible region; that is, the feasible region remains the same whether or
    not the constraint is included in the problem. Because such a constraint does
    not affect the feasible region and thus cannot affect the optimal solution, it
    is called a redundant constraint. Redundant constraints can be dropped from the
    problem without having any effect on the optimal solution. However, in most linear
    programming problems redundant constraints are not discarded because they are
    not immediately recognizable as being redundant. The RMC problem had no redundant
    constraints because each constraint had an effect on the feasible region.


    # NOTES AND COMMENTS


    +   1. In the standard form representation of a linear program, the objective
    function coefficients for the slack variables are zero. This condition implies
    that slack variables, which represent unused resources, do not affect the value
    of the objective function. However, in some applications, some or all of the unused
    resources can be sold and contribute to profit. In such cases the corresponding
    slack variables become decision variables representing the amount of resources
    to be sold. For each of these variables, a nonzero coefficient in the objective
    function would


    +   reflect the profit associated with selling a unit of the corresponding resource.


    +   2. Redundant constraints do not affect the feasible region; as a result they
    can be removed from a linear programming model without affecting the optimal solution.
    However, if the linear programming model is to be resolved later, changes in some
    of the data might change a previously redundant constraint into a binding constraint.
    Thus, we recommend keeping all constraints in the linear programming model even
    though one or more of the constraints may be redundant.'
