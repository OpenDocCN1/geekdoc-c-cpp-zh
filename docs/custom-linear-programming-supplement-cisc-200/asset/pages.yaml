- pgno: 5
  md: "Linear programming is a problem-solving approach developed to help managers\
    \ make decisions. Numerous applications of linear programming can be found in\
    \ today's competitive business environment. For instance, IBM uses linear programming\
    \ to perform capacity planning and to make capacity investment decisions for its\
    \ semiconductor manufacturing operations. GE Capital uses linear programming to\
    \ help determine optimal lease structuring. Marathon Oil Company uses linear programming\
    \ for gasoline blending and to evaluate the economics of a new terminal or pipeline.\
    \ The Q.M. in Action, Timber Harvesting Model at MeadWestvaco Corporation, provides\
    \ another example of the use of linear programming. Later in the chapter another\
    \ Q.M. in Action illustrates how the United States Navy uses linear programming\
    \ to reduce fuel consumption for its ships.\n\nTo illustrate some of the properties\
    \ that all linear programming problems have in common, consider the following\
    \ typical applications:\n\n+   1. A manufacturer wants to develop a production\
    \ schedule and an inventory policy that will satisfy sales demand in future periods.\
    \ Ideally, the schedule and policy will enable the company to satisfy demand and\
    \ at the same time minimize the total production and inventory costs.\n+   \n\
    +   2. A financial analyst must select an investment portfolio from a variety\
    \ of stock and bond investment alternatives. The analyst would like to establish\
    \ the portfolio that maximizes the return on investment.\n+   \n+   3. A marketing\
    \ manager wants to determine how best to allocate a fixed advertising budget among\
    \ alternative advertising media such as radio, television, newspaper, and magazine.\
    \ The manager would like to determine the media mix that maximizes advertising\
    \ effectiveness.\n+   \n+   4. A company has warehouses in a number of locations.\
    \ Given specific customer demands, the company would like to determine how much\
    \ each warehouse should ship to each customer so that total transportation costs\
    \ are minimized.\n\nThese examples are only a few of the situations in which linear\
    \ programming has been used successfully, but they illustrate the diversity of\
    \ linear programming applications. A close scrutiny reveals one basic property\
    \ they all have in common. In each example, we were concerned with maximizing\
    \ or minimizing some quantity. In example 1, the manufacturer wanted to minimize\
    \ costs; in example 2, the financial analyst wanted to maximize return on investment;\
    \ in example 3, the marketing manager wanted to maximize advertising effectiveness;\
    \ and in example 4, the company wanted to minimize total transportation costs.\
    \ In all linear programming problems, the maximization or minimization of some\
    \ quantity is the objective.\n\n# Q.M. in ACTION\n\n# TIMBER HARVESTING MODEL\
    \ AT MEADWESTVACO CORPORATION*\n\nMeadWestvaco Corporation is a major producer\
    \ of coated papers for periodicals, books, commercial printing, and business forms.\
    \ The company also produces pulp and lumber, designs and manufactures packaging\
    \ systems for beverage and other consumables markets,\n\nand is a world leader\
    \ in the production of coated board and shipping containers. Quantitative analyses\
    \ at MeadWestvaco are developed and implemented by the company's Decision Analysis\
    \ Department. The department assists decision makers by providing them with analytical\
    \ tools of quantitative methods as well as personal analysis and recommendations.\n\
    \n*Based on information provided by Dr. Edward P. Winkofsky of MeadWestvaco Corporation.\n\
    \n(continued)"
  merge: -1
  img_proc: true
- pgno: 6
  md: 'MeadWestvaco uses quantitative models to assist with the long-range management
    of the company''s timberland. Through the use of large-scale linear programs,
    timber harvesting plans are developed to cover a substantial time horizon. These
    models consider wood market conditions, mill pulpwood requirements, harvesting
    capacities, and general forest management principles. Within these constraints,
    the model arrives at an optimal harvesting and purchasing schedule based on discounted
    cash flow. Alternative schedules reflect


    changes in the various assumptions concerning forest growth, wood availability,
    and general economic conditions. Quantitative methods are also used in the development
    of the inputs for the linear programming models. Timber prices and supplies as
    well as mill requirements must be forecast over the time horizon, and advanced
    sampling techniques are used to evaluate land holdings and to project forest growth.
    The harvest schedule is then developed using quantitative methods.


    Linear programming was initially referred to as “programming in a linear structure.”
    In 1948 Tjalling Koopmans suggested to George Dantzig that the name was much too
    long; Koopman’s suggestion was to shorten it to linear programming. George Dantzig
    agreed and the field we now know as linear programming was named.


    All linear programming problems also have a second property: restrictions or constraints
    that limit the degree to which the objective can be pursued. In the first example,
    the manufacturer is restricted by constraints requiring product demand to be satisfied
    and by constraints limiting production capacity. The financial analyst’s portfolio
    problem is constrained by the total amount of investment funds available and the
    maximum amounts that can be invested in each stock or bond. The marketing manager’s
    media selection decision is constrained by a fixed advertising budget and the
    availability of the various media. In the transportation problem, the minimum-cost
    shipping schedule is constrained by the supply of product available at each warehouse.
    Thus, constraints are another general feature of every linear programming problem.


    # 7.1 A Simple Maximization Problem


    RMC, Inc., is a small firm that produces a variety of chemical-based products.
    In a particular production process, three raw materials are used to produce two
    products: a fuel additive and a solvent base. The fuel additive is sold to oil
    companies and is used in the production of gasoline and related fuels. The solvent
    base is sold to a variety of chemical firms and is used in both home and industrial
    cleaning products. The three raw materials are blended to form the fuel additive
    and solvent base as indicated in Table 7.1, which shows that a ton of fuel additive
    is a mixture of 0.4 tons of material 1 and 0.6 tons of material 3. A ton of solvent
    base is a mixture of 0.5 tons of material 1, 0.2 tons of material 2, and 0.3 tons
    of material 3.


    | | Fuel Additive | Solvent Base |

    |---|---|---|

    | Material 1 | 0.4 | 0.5 |

    | Material 2 | | 0.2 |

    | Material 3 | 0.6 | 0.3 |'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'RMC''s production is constrained by a limited availability of the three raw
    materials. For the current production period, RMC has available the following
    quantities of each raw material:


    | Material | Amount Available for Production |

    |---|---|

    | Material 1 | 20 tons |

    | Material 2 | 5 tons |

    | Material 3 | 21 tons |


    It is important to understand that we are maximizing profit contribution, not
    profit. Overhead and other shared costs cannot be deducted before arriving at
    a profit figure.


    Because of spoilage and the nature of the production process, any materials not
    used for current production are useless and must be discarded.


    The accounting department analyzed the production figures, assigned all relevant
    costs, and arrived at prices for both products that will result in a profit contribution
    of $40 for every ton of fuel additive produced and $30 for every ton of solvent
    base produced. Let us now use linear programming to determine the number of tons
    of fuel additive and the number of tons of solvent base to produce in order to
    maximize total profit contribution.


    # Problem Formulation


    Problem formulation is the process of translating a verbal statement of a problem
    into a mathematical statement. The mathematical statement of the problem is referred
    to as a mathematical model. Developing an appropriate mathematical model is an
    art that can only be mastered with practice and experience. Even though every
    problem has at least some unique features, most problems also have many common
    or similar features. As a result, some general guidelines for developing a mathematical
    model can be helpful. We will illustrate these guidelines by developing a mathematical
    model for the RMC problem.


    # Understand the Problem Thoroughly


    The RMC problem is relatively easy to understand. RMC wants to determine how much
    of each product to produce in order to maximize the total contribution to profit.
    The number of tons available for the three materials that are required to produce
    the two products will limit the number of tons of each product that can be produced.
    More complex problems will require more work in order to understand the problem.
    However, understanding the problem thoroughly is the first step in developing
    any mathematical model.


    # Describe the Objective


    RMC''s objective is to maximize the total contribution to profit.


    # Describe Each Constraint


    Three constraints limit the number of tons of fuel additive and the number of
    tons of solvent base that can be produced.


    # Constraint 1: The number of tons of material 1 used must be less than or equal
    to the 20 tons available.


    # Constraint 2: The number of tons of material 2 used must be less than or equal
    to the 5 tons available.


    # Constraint 3: The number of tons of material 3 used must be less than or equal
    to the 21 tons available.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Define the Decision Variables The decision variables are the controllable inputs
    in the problem. For the RMC problem the two decision variables are (1) the number
    of tons of fuel additive produced, and (2) the number of tons of solvent base
    produced. In developing the mathematical model for the RMC problem, we will use
    the following notation for the decision variables:


    F = number of tons of fuel additive

    S = number of tons of solvent base


    # Write the Objective in Terms of the Decision Variables


    RMC''s profit contribution comes from the production of F tons of fuel additive
    and S tons of solvent base. Because RMC makes $40 for every ton of fuel additive
    produced and $30 for every ton of solvent base produced, the company will make
    $40F from the production of the fuel additive and $30S from the production of
    the solvent base. Thus,


    Total profit contribution = 40F + 30S


    Because the objective—maximize total profit contribution—is a function of the
    decision variables F and S, we refer to 40F + 30S as the objective function. Using
    “Max” as an abbreviation for maximize, we can write RMC’s objective function as
    follows:


    Max 40F + 30S (7.1)


    # Write the Constraints in Terms of the Decision Variables


    # Constraint 1:


    Tons of material 1 used ≤ Tons of material 1 available


    Every ton of fuel additive that RMC produces will use 0.4 tons of material 1.
    Thus, 0.4F tons of material 1 is used to produce F tons of fuel additive. Similarly,
    every ton of solvent base that RMC produces will use 0.5 tons of material 1. Thus,
    0.5S tons of material 1 is used to produce S tons of solvent base. Therefore,
    the number of tons of material 1 used to produce F tons of fuel additive and S
    tons of solvent base is


    Tons of material 1 used = 0.4F + 0.5S


    Because 20 tons of material 1 are available for use in production, the mathematical
    statement of constraint 1 is


    0.4F + 0.5S ≤ 20 (7.2)


    # Constraint 2:


    Tons of material 2 used ≤ Tons of material 2 available


    Fuel additive does not use material 2. However, every ton of solvent base that
    RMC produces will use 0.2 tons of material 2. Thus, 0.2S tons of material 2 is
    used to produce S tons of solvent base. Therefore, the number of tons of material
    2 used to produce F tons of fuel additive and S tons of solvent base is


    Tons of material 2 used = 0.2S'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'Because 5 tons of material 2 are available for production, the mathematical
    statement of constraint 2 is


    ```

    0.2S ≤ 5

    ```


    # Constraint 3:


    Tons of material 3 used ≤ Tons of material 3 available


    Every ton of fuel additive RMC produces will use 0.6 tons of material 3. Thus,
    0.6F tons of material 1 is used to produce F tons of fuel additive. Similarly,
    every ton of solvent base RMC produces will use 0.3 tons of material 3. Thus,
    0.3S tons of material 1 is used to produce S tons of solvent base. Therefore,
    the number of tons of material 3 used to produce F tons of fuel additive and S
    tons of solvent base is


    ```

    Tons of material 3 used = 0.6F + 0.3S

    ```


    Because 21 tons of material 3 are available for production, the mathematical statement
    of constraint 3 is


    ```

    0.6F + 0.3S ≤ 21

    ```


    # Add the Nonnegativity Constraints


    RMC cannot produce a negative number of tons of fuel additive or a negative number
    of tons of solvent base. Therefore, nonnegativity constraints must be added to
    prevent the decision variables F and S from having negative values. These nonnegativity
    constraints are


    ```

    F ≥ 0 and S ≥ 0

    ```


    Nonnegativity constraints are a general feature of many linear programming problems
    and may be written in the abbreviated form:


    ```

    F, S ≥ 0

    ```


    # Mathematical Model for the RMC Problem


    Problem formulation is now complete. We have succeeded in translating the verbal
    statement of the RMC problem into the following mathematical model:


    ```

    Max 40F + 30S

    Subject to (s.t.)

    0.4F + 0.55S ≤ 20 Material 1

    0.2S ≤ 5 Material 2

    0.6F + 0.3S ≤ 21 Material 3

    F, S ≥ 0

    ```


    Our job now is to find the product mix (i.e., the combination of F and S) that
    satisfies all the constraints and, at the same time, yields a maximum value for
    the objective function. Once these values of F and S are calculated, we will have
    found the optimal solution to the problem. This mathematical model of the RMC
    problem is a linear program. The RMC problem has an objective and constraints
    that, as we said earlier, are common properties of all'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'linear programs. But what is the special feature of this mathematical model
    that makes it a linear program? The special feature that makes it a linear program
    is that the objective function and all constraint functions (the left-hand sides
    of the constraint inequalities) are linear functions of the decision variables.


    Mathematical functions in which each variable appears in a separate term and is
    raised to the first power are called linear functions. The objective function
    (40F + 30S) is linear because each decision variable appears in a separate term
    and has an exponent of 1. The amount of material 1 used (0.4F + 0.5S) is also
    a linear function of the decision variables for the same reason. Similarly, the
    functions on the left-hand side of the material 2 and material 3 constraint inequalities
    (the constraint functions) are also linear functions. Thus, the mathematical formulation
    is referred to as a linear program.


    Linear programming has nothing to do with computer programming. The use of the
    word programming here means “choosing a course of action.” Linear programming
    involves choosing a course of action when the mathematical model of the problem
    contains only linear functions.


    Try Problem 1 to test your ability to recognize the types of mathematical relationships
    that can be found in a linear program.


    # NOTES AND COMMENTS


    +   1. The three assumptions necessary for a linear programming model to be appropriate
    are proportionality, additivity, and divisibility. Proportionality means that
    the contribution to the objective function and the amount of resources used in
    each constraint are proportional to the value of each decision variable. Additivity
    means that the value of the objective function and the total resources used could
    be found by summing the objective function contribution and the resources used
    for all decision variables. Divisibility means that the decision variables are
    continuous. The divisibility assumption plus the nonnegativity constraints mean
    that decision variables can take on any value greater than or equal to zero.


    +   2. Quantitative analysts formulate and solve a variety of mathematical models
    that contain an objective function and a set of constraints. Models of this type
    are referred to as mathematical programming models. Linear programming models
    are a special type of mathematical programming model in that the objective function
    and all constraint functions are linear.


    # 7.2 Graphical Solution Procedure


    A linear programming problem involving only two decision variables can be solved
    using a graphical solution procedure. Let us begin the graphical solution procedure
    by developing a graph that displays the possible solutions (F and S values) for
    the RMC problem. The graph in Figure 7.1 has values of F on the horizontal axis
    and values of S on the vertical axis. Any point on the graph can be identified
    by its F and S values, which indicate the position of the point along the horizontal
    and vertical axes, respectively. Thus, every point on the graph corresponds to
    a possible solution. The solution of F = 0 and S = 0 is referred to as the origin.
    Because both F and S must be nonnegative, the graph in Figure 7.1 only displays
    solutions where F ≥ 0 and S ≥ 0.


    Earlier we determined that the inequality representing the material 1 constraint
    was


    ```

    0.4F + 0.5S ≤ 20

    ```


    To show all solutions that satisfy this relationship, we start by graphing the
    line corresponding to the equation


    ```

    0.4F + 0.5S = 20

    ```'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# FIGURE 7.1 GRAPH SHOWING TWO SOLUTIONS FOR THE TWO-VARIABLE RMC PROBLEM


    ![](img/e2cb94e77057728e7ce105fa1f79ad61_11_0.png)


    We graph this equation by identifying two points that satisfy this equation and
    then drawing a line through the points. Setting F = 0 and solving for S gives
    0.5S = 20, or S = 40; hence the solution (F = 0, S = 40) satisfies the preceding
    equation. To find a second solution satisfying this equation, we set S = 0 and
    solve for F. Doing so, we obtain 0.4F = 20, or F = 50. Thus, a second solution
    satisfying the equation is (F = 50, S = 0). With these two points, we can now
    graph the line. This line, called the material 1 constraint line, is shown in
    Figure 7.2.


    Recall that the inequality representing the material 1 constraint is 0.4F + 0.5S
    <= 20


    Can you identify all the solutions that satisfy this constraint? First, note that
    any point on the line 0.4F + 0.5S = 20 must satisfy the constraint. But where
    are the solutions satisfying 0.4F + 0.5S < 20? Consider two solutions (F = 10,
    S = 10) and (F = 40, S = 30). Figure 7.2 shows that the first solution is on the
    same side of the constraint line as the origin while the second solution is on
    the side of the constraint line opposite of the origin. Which of these solutions
    satisfies the material 1 constraint? For (F = 10, S = 10) we have


    0.4F + 0.5S = 0.4(10) + 0.5(10) = 9


    Because 9 tons is less than the 20 tons of material 1 available, the F = 10, S
    = 10 solution satisfies the constraint. For F = 40 and S = 30 we have


    0.4F + 0.5S = 0.4(40) + 0.5(30) = 31'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# FIGURE 7.2 MATERIAL 1 CONSTRAINT LINE


    ![](img/e2cb94e77057728e7ce105fa1f79ad61_12_0.png)


    The 31 tons is greater than the 20 tons available, so the F = 40, S = 30 solution
    does not satisfy the constraint.


    You should now be able to graph a constraint line and find the solution points
    that satisfy the constraint. Try Problem 2.


    If a particular solution satisfies the constraint, all other solutions on the
    same side of the constraint line will also satisfy the constraint. If a particular
    solution does not satisfy the constraint, all other solutions on the same side
    of the constraint line will not satisfy the constraint. Thus, you need to evaluate
    only one solution to determine which side of a constraint line provides solutions
    that will satisfy the constraint. The shaded area in Figure 7.3 shows all the
    solutions that satisfy the material 1 constraint.


    Next let us identify all solutions that satisfy the material 2 constraint:


    0.2S <= 5


    We start by drawing the constraint line corresponding to the equation 0.2S = 5.
    Because this equation is equivalent to the equation S = 25, we simply draw a line
    whose S value is 25 for every value of F; this line is parallel to and 25 units
    above the horizontal axis. Figure 7.4 shows the line corresponding to the material
    2 constraint. Following the approach we used for the material 1 constraint, we
    realize that only solutions on or below the line will satisfy the material 2 constraint.
    Thus, in Figure 7.4 the shaded area corresponds to the solutions that satisfy
    the material 2 constraint.


    Similarly, we can determine the solutions that satisfy the material 3 constraint.
    Figure 7.5 shows the result. For practice, try to graph the feasible solutions
    that satisfy the material 3 constraint and determine whether your result agrees
    with that shown in Figure 7.5.


    We now have three separate graphs showing the solutions that satisfy each of the
    three constraints. In a linear programming problem, we need to identify the solutions
    that satisfy'
