- pgno: 17
  md: 'The objective is to find the feasible solution yielding the highest profit
    contribution, so we proceed by selecting higher profit contributions and finding
    the solutions that yield the stated values. For example, what solutions provide
    a profit contribution of $720? What solutions provide a profit contribution of
    $1200? To answer these questions, we must find the F and S values that are on
    the profit lines:


    40F + 30S = 720 and 40F + 30S = 1200


    Using the previous procedure for graphing profit and constraint lines, we graphed
    the $720 and $1200 profit lines presented in Figure 7.9. Not all solution points
    on the $1200 profit line are in the feasible region, but at least some points
    on the line are; thus, we can obtain a feasible solution that provides a $1200
    profit contribution.


    Can we find a feasible solution yielding an even higher profit contribution? Look
