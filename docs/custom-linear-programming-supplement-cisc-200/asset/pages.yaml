    +   Step 4. Select a cell and enter a formula for computing the left-hand side
    of each con-

    +   straint. With three constraints, we have

    +   Cell B20: =B5*B15+C5*C15

    +   Cell B21: =C6*C15

    +   Cell B22: =B7*B15+C7*C15


    +   Step 5. Select a cell and enter a formula for computing the right-hand side
    of each con-

    +   straint. With three constraints, we have

    +   Cell D20: =D5

    +   Cell D21: =D6

    +   Cell D22: =D7


    Note that descriptive labels make the model section of the worksheet easier to
    read and under-

    stand. For example, we added “Fuel Additive,” “Solvent Base,” and “Tons Produced”
    in

    rows 14 and 15 so that the values of the decision variables appearing in Cells
    B15 and C15

    can be easily interpreted. In addition, we entered “Maximize Total Profit” in
    Cell A17 to in-

    dicate that the value of the objective function appearing in Cell B17 is the maximum
    profit

    contribution. In the constraint section of the worksheet we added the constraint
    names as

    well as the “<=” symbols to show the relationship that exists between the left-hand
    side

    and the right-hand side of each constraint. Although these descriptive labels
    are not neces-

    sary to use Excel Solver to find a solution to the RMC problem, the labels make
    it easier

    for the user to understand and interpret the optimal solution.


    # Excel Solution


    Excel 2010 contains an updated Solver capability that incorporates much of what
    was pre-

    viously available as Premium Solver. Excel Solver, developed by Frontline Systems,
    can be

    used to solve all of the linear programming problems presented in this text.


    The following steps describe how Excel Solver can be used to obtain the optimal
    solu-

    tion to the RMC problem:


    +   Step 1. Select the Data tab from the Ribbon


    +   Step 2. Select Solver from the Analysis Group (see Figure 7.25, where the
    Analysis

    +   Group and Data tab are displayed in the Ribbon)


    +   Step 3. When the Solver Parameters dialog box appears (see Figure 7.26):

    +   Enter B17 into the Set Objective box

    +   Select the To: Max option

    +   Enter B15:C15 into the By Changing Variable Cells box

    +   Select Add


    +   Step 4. When the Add Constraint dialog box appears:

    +   Enter B20:B22 in the Cell Reference box'
