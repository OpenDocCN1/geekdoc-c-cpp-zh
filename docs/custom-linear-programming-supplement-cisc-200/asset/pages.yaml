    # Case Problem 1 Workload Balancing


    Digital Imaging (DI) produces photo printers for both the professional and consumer
    markets. The DI consumer division recently introduced two photo printers that
    provide color prints rivaling those produced by a professional processing lab.
    The DI-910 model can produce a 4" × 6" borderless print in approximately 37 seconds.
    The more sophisticated and faster DI-950 can even produce a 13" × 19" borderless
    print. Financial projections show profit contributions of $42 for each DI-910
    and $87 for each DI-950.


    The printers are assembled, tested, and packaged at DI''s plant located in New
    Bern, North Carolina. This plant is highly automated and uses two manufacturing
    lines to produce the printers. Line 1 performs the assembly operation with times
    of 3 minutes per DI-910 printer and 6 minutes per DI-950 printer. Line 2 performs
    both the testing and packaging operations. Times are 4 minutes per DI-910 printer
    and 2 minutes per DI-950 printer. The shorter time for the DI-950 printer is a
    result of its faster print speed. Both manufacturing lines are in operation one
    8-hour shift per day.


    # Managerial Report


    Perform an analysis for Digital Imaging in order to determine how many units of
    each printer to produce. Prepare a report to DI''s president presenting your findings
    and recommendations. Include (but do not limit your discussion to) a consideration
    of the following:


    +   1. The recommended number of units of each printer to produce to maximize
    the total contribution to profit for an 8-hour shift. What reasons might management
    have for not implementing your recommendation?

    +   2. Suppose that management also states that the number of DI-910 printers
    produced must be at least as great as the number of DI-950 units produced. Assuming
    that the objective is to maximize the total contribution to profit for an 8-hour
    shift, how many units of each printer should be produced?

    +   3. Does the solution you developed in part (2) balance the total time spent
    on line 1 and the total time spent on line 2? Why might this balance or lack of
    it be a concern to management?

    +   4. Management requested an expansion of the model in part (2) that would provide
    a better balance between the total time on line 1 and the total time on line 2.
    Management wants to limit the difference between the total time on line 1 and
    the total time on line 2 to 30 minutes or less. If the objective is still to maximize
    the total contribution to profit, how many units of each printer should be produced?
    What effect does this workload balancing have on total profit in part (2)?

    +   5. Suppose that in part (1) management specified the objective of maximizing
    the total number of printers produced each shift rather than total profit contribution.
    With this objective, how many units of each printer should be produced per shift?
    What effect does this objective have on total profit and workload balancing?


    For each solution that you develop, include a copy of your linear programming
    model and graphical solution in the appendix to your report.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Case Problem 2 Production Strategy


    Better Fitness, Inc. (BFI) manufactures exercise equipment at its plant in Freeport,
    Long Island. It recently designed two universal weight machines for the home exercise
    market. Both machines use BFI-patented technology that provides the user with
    an extremely wide range of motion capability for each type of exercise performed.
    Until now, such capabilities have been available only on expensive weight machines
    used primarily by physical therapists.


    At a recent trade show, demonstrations of the machines resulted in significant
    dealer interest. In fact, the number of orders that BFI received at the trade
    show far exceeded its manufacturing capabilities for the current production period.
    As a result, management decided to begin production of the two machines. The two
    machines, which BFI named the BodyPlus 100 and the BodyPlus 200, require different
    amounts of resources to produce.


    The BodyPlus 100 consists of a frame unit, a press station, and a pec-dec station.
    Each frame produced uses 4 hours of machining and welding time and 2 hours of
    painting and finishing time. Each press station requires 2 hours of machining
    and welding time and 1 hour of painting and finishing time, and each pec-dec station
    uses 2 hours of machining and welding time and 2 hours of painting and finishing
    time. In addition, 2 hours are spent assembling, testing, and packaging each BodyPlus
    100. The raw material costs are $450 for each frame, $300 for each press station,
    and $250 for each pec-dec station; packaging costs are estimated to be $50 per
    unit.


    The BodyPlus 200 consists of a frame unit, a press station, and a leg-press station.
    Each frame produced uses 5 hours of machining and welding time and 4 hours of
    painting and finishing time. Each press station requires 3 hours machining and
    welding time and 2 hours of painting and finishing time, each pec-dec station
    uses 2 hours of machining and welding time and 2 hours of painting and finishing
    time, and each leg-press station requires 2 hours of machining and welding time
    and 2 hours of painting and finishing time. In addition, 2 hours are spent assembling,
    testing, and packaging each BodyPlus 200. The raw material costs are $650 for
    each frame, $400 for each press station, $250 for each pec-dec station, and $200
    for each leg-press station; packaging costs are estimated to be $75 per unit.


    For the next production period, management estimates that 600 hours of machining
    and welding time; 450 hours of painting and finishing time; and 140 hours of assembly,
    testing, and packaging time will be available. Current labor costs are $20 per
    hour for machining and welding time; $15 per hour for painting and finishing time;
    and $12 per hour for assembly, testing, and packaging time. The market in which
    the two machines must compete suggests a retail price of $2400 for the BodyPlus
    100 and $3500 for the BodyPlus 200, although some flexibility may be available
    for BFI because of the unique capabilities of the new machines. Authorized BFI
    dealers can purchase machines for 70% of the suggested retail price.


    BFI''s president believes that the unique capabilities of the BodyPlus 200 can
    help position BFI as one of the leaders in high-end exercise equipment. Consequently,
    she states that the number of units of the BodyPlus 200 produced must be at least
    25% of the total production.


    # Managerial Report


    Analyze the production problem at Better Fitness, Inc., and prepare a report for
    BFI''s president presenting your findings and recommendations. Include (but do
    not limit your discussion to) a consideration of the following items:


    +   1. The recommended number of BodyPlus 100 and BodyPlus 200 machines to produce'
