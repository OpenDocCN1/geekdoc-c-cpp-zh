    ```

    Min 2G + 2H

    s.t.

    1G + 3H <= 12

    3G + 1H >= 13

    1G - 1H = 3

    G, H >= 0

    ```


    The standard-form representation of this problem is


    ```

    Min 2G + 2H + 0S1 + 0S2

    s.t.

    1G + 3H + 1S1 = 12

    3G + 1H - 1S2 = 13

    1G - 1H = 3

    G, H, S1, S2 >= 0

    ```


    The standard form requires a slack variable for the <= constraint and a surplus
    variable for the >= constraint. However, neither a slack nor a surplus variable
    is required for the third constraint because it is already in equality form.


    When solving linear programs graphically, it is not necessary to write the problem
    in its standard form. Nevertheless, it is helpful to be able to compute the values
    of the slack and surplus variables and understand what they mean. A final point:
    The standard form of the linear programming problem is equivalent to the original
    formulation of the problem. That is, the optimal solution to any linear programming
    problem is the same as the optimal solution to the standard form of the problem.
    The standard form does not change the basic problem; it only changes how we write
    the constraints for the problem.


