  md: '+   Step 1. Enter the problem data in the top part of the worksheet

    +   Cells B5 to C7 show the material requirements per ton of each product.

    +   Cells B8 and C8 show the profit contribution per ton for the two products.

    +   Cells D5 to D7 show the maximum amounts available for each of the three materials.


    +   Step 2. Specify cell locations for the decision variables

    +   Cell B15 will contain the number of tons of fuel additive produced, and Cell

    +   C15 will contain the number of tons of solvent base produced.


    +   Step 3. Select a cell and enter a formula for computing the value of the objective

