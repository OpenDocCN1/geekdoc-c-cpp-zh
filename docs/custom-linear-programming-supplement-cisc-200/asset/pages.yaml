- pgno: 14
  md: '# FIGURE 7.5 SOLUTIONS THAT SATISFY THE MATERIAL 3 CONSTRAINT


    ![](img/e2cb94e77057728e7ce105fa1f79ad61_14_0.png)


    all the constraints simultaneously. To find these solutions, we can draw the three
    constraints on one graph and observe the region containing the points that do
    in fact satisfy all the constraints simultaneously.


    The graphs in Figures 7.3, 7.4, and 7.5 can be superimposed to obtain one graph
    with all three constraints. Figure 7.6 shows this combined constraint graph. The
    shaded region in this figure includes every solution point that satisfies all
    the constraints simultaneously. Because solutions that satisfy all the constraints
    simultaneously are termed feasible solutions, the shaded region is called the
    feasible solution region, or simply the feasible region. Any point on the boundary
    of the feasible region, or within the feasible region, is a feasible solution
    point for the linear programming problem.


    Can you now find the feasible region given several constraints? Try Problem 7.


    Now that we have identified the feasible region, we are ready to proceed with
    the graphical solution method and find the optimal solution to the RMC problem.
    Recall that the optimal solution for a linear programming problem is the feasible
    solution that provides the best possible value of the objective function. Let
    us start the optimizing step of the graphical solution procedure by redrawing
    the feasible region on a separate graph. Figure 7.7 shows the graph.


    One approach to finding the optimal solution would be to evaluate the objective
    function for each feasible solution; the optimal solution would then be the one
    yielding the'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# FIGURE 7.6 FEASIBLE REGION FOR THE RMC PROBLEM


    ![](img/e2cb94e77057728e7ce105fa1f79ad61_15_0.png)


    largest value. The difficulty with this approach is that the infinite number of
    feasible solutions makes evaluating all feasible solutions impossible. Hence,
    this trial-and-error procedure cannot be used to identify the optimal solution.


    Rather than trying to compute the profit contribution for each feasible solution,
    we select an arbitrary value for profit contribution and identify all the feasible
    solutions that yield the selected value. For example, what feasible solutions
    provide a profit contribution of $240? These values are given by the values of
    F and S in the feasible region that will make the objective function


    ```

    40F + 30S = 240

    ```


    This expression is simply the equation of a line. Thus all feasible solutions
    (F, S) yielding a profit contribution of $240 must be on the line. We learned
    earlier in this section how to graph a constraint line. The procedure for graphing
    the profit or objective function line is the same. Letting F = 0, we see that
    S must be 8; thus the solution point (F = 0, S = 8) is on the line. Similarly,
    by letting S = 0 we see that the solution point (F = 6, S = 0) is also on the
    line. Drawing the line through these two points identifies all the solutions that
    have a profit contribution of $240. A graph of this profit line is presented in
    Figure 7.8. The graph shows that an infinite number of feasible production combinations
    will provide a $240 profit contribution.'
  merge: -1
  img_proc: true
