    # A Note on Graphing Lines


    An important aspect of the graphical method is the ability to graph lines showing
    the constraints and the objective function of the linear program. The procedure
    we used for graphing the equation of a line is to find any two points satisfying
    the equation and then draw the line through the two points. For the RMC constraints,
    the two points were easily found by setting F = 0 and solving the constraint equation
    for S. Then we set S = 0 and solved for F. For the material 1 constraint line


    ```

    0.4F + 0.5S = 20

    ```


    Try Problem 10 to test your ability to use the graphical solution procedure to
    identify the optimal solution and find the exact values of the decision variables
    at the optimal solution.


    this procedure identified the two points (F = 0, S = 40) and (F = 50, S = 0).
    The material 1 constraint line was then graphed by drawing a line through these
    two points.


    All constraints and objective function lines in two-variable linear programs can
    be graphed if two points on the line can be identified. However, finding the two
    points on the line is not always as easy as shown in the RMC problem. For example,
    suppose a company manufactures two models of a small hand-held computer: the Professional
    (P) and the Assistant (A). Management needs 50 units of the Professional model
    for its own sales force and expects sales of the remaining Professionals to be
    less than or equal to 50% of the sales of the Assistant. A constraint enforcing
    this requirement is


    ```

    P - 50 <= 0.5A

    ```


    or


    ```

    P - 0.5A <= 50

    ```


    Using the equality form of the constraint and setting P = 0, we find that the
    point (P = 0, A = -100) is on the constraint line. Setting A = 0, we find a second
    point (P = 50, A = 0) on the constraint line. If we have drawn only the nonnegative
    (P >= 0, A >= 0) portion of the graph, the first point (P = 0, A = -100) cannot
    be plotted because A = -100 is not on the graph. Whenever we have two points on
    the line, but one or both of the points cannot be plotted in the nonnegative portion
    of the graph, the simplest approach is to enlarge the graph. In this example,
    the point (P = 0, A = -100) can be plotted by extending the graph to include the
    negative A axis. Once both points satisfying the constraint equation have been
    located, the line can be drawn. The constraint line and the solutions that satisfy
    the constraint P - 0.5A <= 50 are shown in Figure 7.11.'
