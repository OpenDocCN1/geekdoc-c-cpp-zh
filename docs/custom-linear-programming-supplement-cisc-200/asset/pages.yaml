    # Summary


    We formulated linear programming models for the RMC maximization problem and the
    M&D Chemicals minimization problem. For both problems we showed how a graphical
    solution procedure and Excel Solver can be used to identify an optimal solution.
    In formulating a linear programming model of these problems, we developed a general
    definition of a linear program.


    A linear program is a mathematical model with the following qualities:


    +   1. A linear objective function that is to be maximized or minimized

    +   2. A set of linear constraints

    +   3. Variables restricted to nonnegative values


    Slack variables may be used to write less-than-or-equal-to constraints in equality
    form, and surplus variables may be used to write greater-than-or-equal-to constraints
    in equality form. The value of a slack variable can usually be interpreted as
    the amount of unused resource, whereas the value of a surplus variable indicates
    the amount over and above some stated minimum requirement. When all constraints
    have been written as equalities, the linear program has been written in its standard
    form.


    If the solution to a linear program is infeasible or unbounded, no optimal solution
    to the problem can be found. In the case of infeasibility, no feasible solutions
    are possible. In the case of an unbounded solution, the objective function can
    be made infinitely large for a maximization problem and infinitely small for a
    minimization problem. In the case of alternative optimal solutions, two or more
    optimal extreme points exist, and all the points on the line segment connecting
    them are also optimal.


    The chapter concluded with a section showing how to write a mathematical model
    using general linear programming notation. The Q.M. in Action, The U.S. Navy Uses
    Linear Programming for Fuel Conservation, provides just one of many examples of
    the widespread use of linear programming. In the next two chapters we will see
    many more applications of linear programming.'
