    Each standard-size racket uses 10 minutes of manufacturing time and each oversize
    racket uses 12 minutes. The profit contributions are $10 for each standard-size
    racket and $15 for each oversize racket, and 40 hours of manufacturing time are
    available each week. Management specified that at least 20% of the total production
    must be the standard-size racket. How many rackets of each type should CSD manufacture
    over the next two weeks to maximize the total profit contribution? Assume that
    because of the unique nature of its products, CSD can sell as many rackets as
    it can produce.


    53. Management of High Tech Services (HTS) would like to develop a model that
    will help allocate its technicians'' time between service calls to regular contract
    customers and new customers. A maximum of 80 hours of technician time is available
    over the two-week planning period. To satisfy cash flow requirements, at least
    $800 in revenue (per technician) must be generated during the two-week period.
    Technician time for regular customers generates $25 per hour. However, technician
    time for new customers only generates an average of $8 per hour because in many
    cases a new customer contact does not provide billable services. To ensure that
    new customer contacts are being maintained, the technician time spent on new customer
    contacts must be at least 60% of the time spent on regular customer contacts.
    Given these revenue and policy requirements, HTS would like to determine how to
    allocate technician time between regular customers and new customers so that the
    total number of customers contacted during the two-week period will be maximized.
    Technicians require an average of 50 minutes for each regular customer contact
    and 1 hour for each new customer contact. a. Develop a linear programming model
    that will enable HTS to allocate technician time between regular customers and
    new customers. b. Find the optimal solution.


    54. Jackson Hole Manufacturing is a small manufacturer of plastic products used
    in the automotive and computer industries. One of its major contracts is with
    a large computer company and involves the production of plastic printer cases
    for the computer company''s portable printers. The production cases are produced
    on two injection molding machines. The M-100 machine has a production capacity
    of 25 printer cases per hour, and the M-200 machine has a production capacity
    of 40 cases per hour. Both machines use the same chemical material to produce
    the printer cases; the M-100 uses 40 pounds of the raw material per hour and the
    M-200 uses 50 pounds per hour. The computer company asked Jackson Hole to produce
    as many of the cases during the upcoming week as possible; it will pay $18 for
    each case Jackson Hole can deliver. However, next week is a regularly scheduled
    vacation period for most of Jackson Hole''s production employees; during this
    time, annual maintenance is performed for all equipment in the plant. Because
    of the downtime for maintenance, the M-100 will be available for no more than
    15 hours, and the M-200 will be available for no more than 10 hours. However,
    because of the high set-up cost involved with both machines, management requires
    that, if production is scheduled on either machine, the machine must be operated
    for at least 5 hours. The supplier of the chemical material used in the production
    process informed Jackson Hole that a maximum of 1000 pounds of the chemical material
    will be available for next week''s production; the cost for this raw material
    is $6 per pound. In addition to the raw material cost, Jackson Hole estimates
    that the hourly costs of operating the M-100 and the M-200 are $50 and $75, respectively.'
