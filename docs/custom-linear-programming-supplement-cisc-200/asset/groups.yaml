    \ www.cengage.com。\n\n## 线性规划导论\n\n## 目录\n\n- 7.1 一个简单的最大化问题\n  - 问题制定\n  - RMC问题的数学模型\n\
    - 7.2 图解法\n  - 关于绘制直线的说明\n  - 最大化问题图解法总结\n  - 松弛变量\n- 7.3 极点与最优解\n- 7.4 RMC问题的计算机求解\n\
    \  - 答案报告解读\n- 7.5 一个简单的最小化问题\n  - 最小化问题图解法总结\n  - 剩余变量\n  - M&D化学品问题的计算机求解\n\
    - 7.6 特殊情况\n  - 替代最优解\n  - 无可行解\n  - 无界解\n- 7.7 一般线性规划符号\n\n线性规划是一种为帮助管理者决策而开发的问题求解方法。在当今竞争激烈的商业环境中，可以找到大量线性规划的应用。例如，IBM使用线性规划进行产能规划，并为其半导体制造运营做出产能投资决策。GE\
    \ Capital使用线性规划来帮助确定最佳租赁结构。马拉松石油公司使用线性规划进行汽油调和，并评估新终端或管道的经济性。MeadWestvaco公司的“定量方法在行动：木材采伐模型”提供了线性规划应用的另一个示例。本章后面的另一个“定量方法在行动”说明了美国海军如何使用线性规划来减少其船舶的燃料消耗。\n\
    \n为了说明所有线性规划问题共有的一些属性，请考虑以下典型应用：\n\n- 制造商希望制定生产计划和库存政策，以满足未来期间的销售需求。理想情况下，该计划和政策将使公司能够在满足需求的同时，尽量降低总生产和库存成本。\n\
    - 金融分析师必须从各种股票和债券投资替代方案中选择投资组合。分析师希望建立能够最大化投资回报率的投资组合。\n- 市场经理希望确定如何在广播、电视、报纸和杂志等替代性广告媒体之间最佳分配固定的广告预算。经理希望确定能够最大化广告效果的媒体组合。\n\
    - 一家公司在多个地点设有仓库。在给定特定客户需求的情况下，公司希望确定每个仓库应向每个客户运送多少货物，以便将总运输成本降至最低。\n\n这些只是线性规划成功应用的少数情况，但它们说明了线性规划应用的多样性。仔细审视会发现，它们都具有一个共同的基本属性。在每个示例中，我们关注的是最大化或最小化某个数量。在示例1中，制造商希望最小化成本；在示例2中，金融分析师希望最大化投资回报率；在示例3中，市场经理希望最大化广告效果；在示例4中，公司希望最小化总运输成本。在所有线性规划问题中，最大化或最小化某个数量都是目标。\n\
    \n## 定量方法在行动\n\n### MeadWestvaco公司的木材采伐模型*\n\nMeadWestvaco公司是期刊、书籍、商业印刷和商业表格用涂布纸的主要生产商。该公司还生产木浆和木材，为饮料及其他消费品市场设计和制造包装系统，并且是涂布纸板和运输集装箱生产领域的世界领导者。MeadWestvaco的定量分析由公司的决策分析部开发和实施。该部门通过提供定量方法的分析工具以及个人分析和建议，协助决策者。\n\
    \n*基于MeadWestvaco公司Edward P. Winkofsky博士提供的信息。\n\nMeadWestvaco使用定量模型来协助公司林地的长期管理。通过使用大规模线性规划，制定木材采伐计划以覆盖相当长的时间范围。这些模型考虑木材市场状况、造纸厂木浆需求、采伐能力以及一般森林管理原则。在这些约束条件下，模型基于现金流折现得出最优采伐和采购计划。替代计划反映了关于森林生长、木材供应以及一般经济状况的各种假设的变化。定量方法也用于开发线性规划模型的输入数据。必须对时间范围内的木材价格和供应以及造纸厂需求进行预测，并使用先进的抽样技术来评估土地持有量并预测森林生长。然后使用定量方法制定采伐计划。\n\
    \n线性规划最初被称为“线性结构中的规划”。1948年，Tjalling Koopmans向George Dantzig建议该名称太长；Koopmans的建议是将其缩短为线性规划。George\
    \ Dantzig同意，我们现在所知的线性规划领域因此得名。\n\n所有线性规划问题还具有第二个属性：限制或约束，这些约束限制了目标的追求程度。在第一个示例中，制造商受到要求满足产品需求以及限制生产能力的约束条件的限制。金融分析师的投资组合问题受到可用投资资金总额以及每只股票或债券可投资最大金额的约束。市场经理的媒体选择决策受到固定广告预算和各种媒体可用性的约束。在运输问题中，最低成本运输计划受到每个仓库可用产品供应量的约束。因此，约束是每个线性规划问题的另一个一般特征。\n\
    \n### 7.1 一个简单的最大化问题\n\nRMC, Inc.是一家生产多种化学产品的小型公司。在某个特定的生产过程中，使用三种原材料生产两种产品：燃油添加剂和溶剂基。燃油添加剂销售给石油公司，用于汽油及相关燃料的生产。溶剂基销售给各种化工公司，用于家用和工业清洁产品。三种原材料按表7.1所示的比例混合形成燃油添加剂和溶剂基，表7.1显示一吨燃油添加剂是0.4吨原材料1和0.6吨原材料3的混合物。一吨溶剂基是0.5吨原材料1、0.2吨原材料2和0.3吨原材料3的混合物。\n\
    \n| | 燃油添加剂 | 溶剂基 |\n|---|---|---|\n| 原材料1 | 0.4 | 0.5 |\n| 原材料2 | | 0.2 |\n|\
    \ 原材料3 | 0.6 | 0.3 |\n\n"
