    ## 附录 7.2 使用 LINGO 求解线性规划


    在本附录中，我们将说明如何使用 LINGO 求解 RMC 问题。启动 LINGO 时，会立即显示两个窗口。外部（或主框架）窗口包含所有命令菜单和命令工具栏。较小的窗口是模型窗口；此窗口用于输入和编辑您要求解的线性规划模型。与任何模型一样，最好使用注释来记录您的
    LINGO 模型。LINGO 模型中的注释以感叹号开头，以分号结尾。如果需要，注释可以跨多行。


    我们输入的第一项是描述目标函数的注释。请回顾，RMC 问题的目标函数是最大化利润。因此，我们输入以下注释：


    ```

    ! MAXIMIZE PROFIT;

    ```


    接下来，我们按 Enter 键，然后键入目标函数。RMC 问题的目标函数是 Max 40F + 30S。因此，在 LINGO 模型窗口的第二行中，我们输入以下表达式：


    ```

    MAX = 40*F + 30*S;

    ```


    请注意，在 LINGO 中，符号 * 用于表示乘法，且目标函数（如同注释一样）以分号结尾。一般来说，LINGO 中的每个数学表达式（目标函数和约束）都以分号结束。


    接下来，我们按 Enter 键移至新行。RMC 问题中的第一个约束是 0.4F + 0.5S <= 20，适用于材料 1。因此，在 LINGO 模型窗口的第三行和第四行中，我们输入以下表达式：


    ```

    !MATERIAL 1 CONSTRAINT;

    0.4*F + 0.5*S <= 20;

    ```


    请注意，LINGO 将 <= 符号解释为 <=。或者，我们可以输入 < 来代替 <=。与输入目标函数时的情况一样，第一个约束末尾需要分号。按 Enter 键移至新行，然后继续输入其余注释和约束，如下所示：


    ```

    !MATERIAL 2 CONSTRAINT;

    0.2*S <= 5;

    !MATERIAL 3 CONSTRAINT;

    0.6*F + 0.3*S <= 21;

    ```


    模型窗口现在将显示如下：


    ```

    !MAXIMIZE PROFIT;

    MAX = 40*F + 30*S;

    !MATERIAL 1 CONSTRAINT;

    0.4*F + 0.5*S <= 20;

    !MATERIAL 2 CONSTRAINT;

    0.2*S <= 5;

    !MATERIAL 3 CONSTRAINT;

    0.6*F + 0.3*S <= 21;

    ```


    如果在输入模型时出错，您可以随时将光标定位到出错位置并进行必要的更正来纠正它。


    要求解模型，请从 LINGO 菜单中选择“求解”命令，或单击主框架窗口顶部工具栏上的“求解”按钮。LINGO 将通过确定模型是否符合所有语法要求来开始求解过程。如果
    LINGO 模型未通过这些测试，您将收到一条错误消息。如果 LINGO 在模型输入中未发现任何错误，它将开始求解模型。作为求解过程的一部分，LINGO 会显示一个“求解器状态”窗口，允许您监控求解器的进度。LINGO
    会在标题为“解决方案报告”的新窗口中显示解决方案。RMC 问题在“解决方案报告”窗口中显示的输出如图 7.28 所示。


