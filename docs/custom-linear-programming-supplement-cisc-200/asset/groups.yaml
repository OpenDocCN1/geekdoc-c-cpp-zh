    Max 1A + 1B

    s.t.

    5A + 3B ≤ 15

    3A + 5B ≤ 15

    A, B ≥ 0


    +   a. What is the optimal solution for this problem?

    +   b. Suppose that the objective function is changed to 1A + 2B. Find the new
    optimal solution.


    45. Consider the following linear program:


    Max 1A - 2B

    s.t.

    -4A + 3B ≤ 3

    1A - 1B ≤ 3

    A, B ≥ 0


    +   a. Graph the feasible region for the problem.

    +   b. Is the feasible region unbounded? Explain.

    +   c. Find the optimal solution.

    +   d. Does an unbounded feasible region imply that the optimal solution to the
    linear program will be unbounded?


    46. The manager of a small independent grocery store is trying to determine the
    best use of her shelf space for soft drinks. The store carries national and generic
    brands and currently has 200 square feet of shelf space available. The manager
    wants to allocate at least 60% of the space to the national brands and, regardless
    of the profitability, allocate at least 10% of the space to the generic brands.
    How many square feet of space should the manager allocate to the national brands
    and the generic brands under the following circumstances?


    +   a. The national brands are more profitable than the generic brands.

    +   b. Both brands are equally profitable.

    +   c. The generic brand is more profitable than the national brand.


    47. Discuss what happens to the M&D Chemicals problem (see Section 7.5) if the
    cost per gallon for product A is increased to $3.00 per gallon. What would you
    recommend? Explain.


    48. For the M&D Chemicals problem in Section 7.5, discuss the effect of management''s
    requiring total production of 500 gallons for the two products. List two or three
    actions M&D should consider to correct the situation you encounter.


    49. PharmaPlus operates a chain of 30 pharmacies. The pharmacies are staffed by
    licensed pharmacists and pharmacy technicians. The company currently employs 85
    full-time-equivalent'
  - '[PAGE 52]


    pharmacists (combination of full time and part time) and 175 full-time-equivalent
    technicians. Each spring management reviews current staffing levels and makes
    hiring plans for the year. A recent forecast of the prescription load for the
    next year shows that at least 250 full-time-equivalent employees (pharmacists
    and technicians) will be required to staff the pharmacies. The personnel department
    expects 10 pharmacists and 30 technicians to leave over the next year. To accommodate
    the expected attrition and prepare for future growth, management states that at
    least 15 new pharmacists must be hired. In addition, PharmaPlus''s new service
    quality guidelines specify no more than two technicians per licensed pharmacist.
    The average salary for licensed pharmacists is $40 per hour and the average salary
    for technicians is $10 per hour.

    a. Determine a minimum-cost staffing plan for PharmaPlus. How many pharmacists
    and technicians are needed?

    b. Given current staffing levels and expected attrition, how many new hires (if
    any) must be made to reach the level recommended in part (a)? What will the impact
    on the payroll?


    50. Expedition Outfitters manufactures a variety of specialty clothing for hiking,
    skiing, and mountain climbing. The company has decided to begin production on
    two new parkas designed for use in extremely cold weather: the Mount Everest parka
    and the Rocky Mountain Parka. Expedition''s manufacturing plant has 120 hours
    of cutting time and 120 hours of sewing time available for producing these two
    parkas. Each Mount Everest Parka requires 30 minutes of cutting time and 45 minutes
    of sewing time, and each Rocky Mountain Parka requires 20 minutes of cutting time
    and 15 minutes of sewing time. The labor and material cost is $150 for each Mount
    Everest Parka and $50 for each Rocky Mountain Parka, and the retail prices through
    the firm''s mail order catalog are $250 for the Mount Everest Parka and $200 for
    the Rocky Mountain Parka. Because management believes that the Mount Everest Parka
    is a unique coat that will enhance the image of the firm, management specified
    that at least 20% of the total production must consist of this model. Assuming
    that Expedition Outfitters can sell as many coats of each type as it can produce,
    how many units of each model should it manufacture to maximize the total profit
    contribution?


    51. English Motors, Ltd. (EML), developed a new all-wheel-drive sports utility
    vehicle. As part of the marketing campaign, EML produced a digitally recorded
    sales presentation to send to both owners of current EML four-wheel-drive vehicles
    as well as to owners of four-wheel-drive sports utility vehicles offered by competitors;
    EML refers to these two target markets as the current customer market and the
    new customer market. Individuals who request the new promotion will also receive
    a coupon for a test drive of the new EML model for one weekend. A key factor in
    the success of the new promotion is the response rate, the percentage of individuals
    who receive the new promotion and test drive the new model. EML estimates that
    the response rate for the current customer market is 25% and the response rate
    for the new customer market is 20%. For the customers who test drive the new model,
    the sales rate is the percentage of individuals who make a purchase. Marketing
    research studies indicate that the sales rate is 12% for the current customer
    market and 20% for the new customer market. The cost for each promotion, excluding
    the test drive costs, is $4 for each promotion sent to the current customer market
    and $6 for each promotion sent to the new customer market. Management also specified
    that a minimum of 30,000 current customers should test drive the new model and
    a minimum of 10,000 new customers should test drive the new model. In addition,
    the number of current customers who test drive the new vehicle must be at least
    twice the number of new customers who test drive the new vehicle. If the marketing
    budget, excluding test drive costs, is $1.2 million, how many promotions should
    be sent to each group of customers in order to maximize total sales?'
