    ## 7.3 Extreme Points and the Optimal Solution


    Suppose that the profit contribution for 1 ton of solvent base increases from
    $30 to $60 while the profit contribution for 1 ton of fuel additive and all the
    constraints remain unchanged. The complete linear programming model of this new
    problem is identical to the mathematical model in Section 7.2, except for the
    revised objective function:


    Max 40F + 60S


    How does this change in the objective function affect the optimal solution to
    the RMC problem? Figure 7.13 shows the graphical solution of the RMC problem with
    the revised objective function. Note that because the constraints do not change,
    the feasible region remains unchanged. However, the profit lines must be altered
    to reflect the new objective function.


    By moving the profit line in a parallel manner away from the origin, we find the
    optimal solution as shown in Figure 7.13. The values of the decision variables
    at this point are F = 18.75 and S = 25. The increased profit for the solvent base
    caused a change in the optimal solution. In fact, as you might suspect, we cut
    back the production of the lower profit fuel additive and increase the production
    of the higher profit solvent base.


    What do you notice about the location of the optimal solutions in the linear programming
    problems that we solved thus far? Look closely at the graphical solutions in Figures
    7.10 and 7.13. An important observation that you should be able to make is that
    the optimal solutions occur at one of the vertices, or “corners,” of the feasible
    region. In linear programming terminology these vertices are referred to as the
    extreme points of the feasible region. Thus, the RMC has five vertices or five
    extreme points (Figure 7.14). We can now state our observation about the location
    of optimal solutions:²


    The optimal solution to a linear programming problem can be found at an extreme
    point of the feasible region for the problem.


    This property means that, if you are looking for the optimal solution to a linear
    programming problem, you do not have to evaluate all feasible solution points.
    In fact, you have to consider only the feasible solutions that occur at the extreme
    points of the feasible region. Thus, for the RMC problem, instead of computing
    and comparing the profit for all feasible solutions, we can find the optimal solution
    by evaluating the five extreme-point solutions and selecting the one that provides
    the highest profit. Actually, the graphical solution procedure is nothing more
    than a convenient way of identifying an optimal extreme point for two-variable
    problems.


    For additional practice in identifying the extreme points of the feasible region
    and determining the optimal solution, try computing and comparing the objective
