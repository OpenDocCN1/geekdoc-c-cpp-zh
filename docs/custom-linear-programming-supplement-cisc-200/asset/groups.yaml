    fund. Each unit of the stock fund costs $50 and provides an annual rate of return
    of 10%; each unit of the money market fund costs $100 and provides an annual rate
    of return of 4%. The client wants to minimize risk subject to the requirement
    that the annual income from the investment be at least $60,000. According to Innis’s
    risk measurement system, each unit invested in the stock fund has a risk index
    of 8, and each unit invested in the money market fund has a risk index of 3; the
    higher risk index associated with the stock fund simply indicates that it is the
    riskier investment. Innis’s client also specifies that at least $300,000 be invested
    in the money market fund.

    a. Determine how many units of each fund Innis should purchase for the client
    to minimize the total risk index for the portfolio.

    b. How much annual income will this investment strategy generate?

    c. Suppose the client desires to maximize annual return. How should the funds
    be invested?


    40. Eastern Chemicals produces two types of lubricating fluids used in industrial
    manufacturing. Both products cost Eastern Chemicals $1 per gallon to produce.
    Based on an analysis of current inventory levels and outstanding orders for the
    next month, Eastern Chemicals’ management specified that at least 30 gallons of
    product 1 and at least 20 gallons of product 2 must be produced during the next
    two weeks. Management also stated that an existing inventory of highly perishable
    raw material required in the production of both fluids must be used within the
    next two weeks. The current inventory of the perishable raw material is 80 pounds.
    Although more of this raw material can be ordered if necessary, any of the current
    inventory that is not used within the next two weeks will spoil—hence, the management
    requirement that at least 80 pounds be used in the next two weeks. Furthermore,
    it is known that product 1 requires 1 pound of this perishable raw material per
    gallon and product 2 requires 2 pounds of the raw material per gallon. Because
    Eastern Chemicals’ objective is to keep its production costs at the minimum possible
    level, the firm’s management is looking for a minimum-cost production plan that
    uses all the 80 pounds of perishable raw material and provides at least 30 gallons
    of product 1 and at least 20 gallons of product 2. What is the minimum-cost solution?


    41. Southern Oil Company produces two grades of gasoline: regular and premium.
    The profit contributions are $0.30 per gallon for regular gasoline and $0.50 per
    gallon for premium gasoline. Each gallon of regular gasoline contains 0.3 gallons
    of grade A crude oil and each gallon of premium gasoline contains 0.6 gallons
    of grade A crude oil. For the next production period, Southern has 18,000 gallons
    of grade A crude oil available. The refinery used to produce the gasolines has
    a production capacity of 50,000 gallons for the next production period. Southern
    Oil’s distributors have indicated that demand for the premium gasoline for the
    next production period will be at most 20,000 gallons.

    a. Formulate a linear programming model that can be used to determine the number
    of gallons of regular gasoline and the number of gallons of premium gasoline that
    should be produced in order to maximize total profit contribution.

    b. What is the optimal solution?

    c. What are the values and interpretations of the slack variables?

    d. What are the binding constraints?


    42. Does the following linear program involve infeasibility, unbounded, and/or
    alternative optimal solutions? Explain.


    Max 4A + 8B

    s.t.

    2A + 2B <= 10

    -1A + 1B >= 8

    A, B >= 0'
