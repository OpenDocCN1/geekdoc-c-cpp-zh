    point (P = 0, A = -100) is on the constraint line. Setting A = 0, we find a second
    point (P = 50, A = 0) on the constraint line. If we have drawn only the nonnegative
    (P >= 0, A >= 0) portion of the graph, the first point (P = 0, A = -100) cannot
