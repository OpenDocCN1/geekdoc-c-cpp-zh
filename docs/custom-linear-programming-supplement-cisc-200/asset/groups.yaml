    Can you recognize whether a linear program involves alternative optimal solutions,
    infeasibility, or is unbounded? Try Problems 42 and 43.


    Whenever you attempt to solve a problem that is unbounded using Excel Solver,
    you will obtain a message that says, “The Objective Cell values do not converge.”
    Because unbounded solutions cannot occur in real problems, the first thing you
    should do is to review your model to determine whether you have incorrectly formulated
    the problem.


    ## NOTES AND COMMENTS


    - 1. Infeasibility is independent of the objective function. It exists because
    the constraints are so restrictive that they allow no feasible region for the
    linear programming model. Thus, when you encounter infeasibility, making changes
    in the coefficients of the objective function will not help. The problem will
    remain infeasible.


    - 2. The occurrence of an unbounded solution is often the result of a missing
    constraint. However, a change in the objective function may cause a previously
    unbounded problem to become bounded with an optimal solution. For example, the
    graph in Figure 7.21 shows an unbounded solution for the objective function Max
    20X + 10Y. However, changing the objective function to Max 20X – 10Y will provide
    the optimal solution X = 2 and Y = 0 even though no changes have been made in
    the constraints.


    ## 7.7 General Linear Programming Notation


    In this chapter we showed how to formulate mathematical models for the RMC and
    M&D Chemicals linear programming problems. To formulate a mathematical model of
    the RMC problem, we began by defining two decision variables: F = number of tons
    of fuel additive, and S = number of tons of solvent base. In the M&D Chemicals
    problem, the two decision variables were defined as A = number of gallons of product
    A, and B = number of gallons of product B. We selected decision variable names
    of F and S in the RMC problem and A and B in the M&D Chemicals problem to make
    it easier to recall what these decision variables represented in the problem.
    Although this approach works well for linear programs involving a small number
    of decision variables, it can become difficult when dealing with problems involving
    a large number of decision variables.


    A more general notation that is often used for linear programs uses the letter
    x with a subscript. For instance, in the RMC problem, we could have defined the
    decision variables as follows:


    ```

    x1 = number of tons of fuel additive

    x2 = number of tons of solvent base

    ```


    In the M&D Chemicals problem, the same variable names would be used, but their
    definitions would change:


    ```

    x1 = number of gallons of product A

    x2 = number of gallons of product B

    ```


    A disadvantage of using general notation for decision variables is that we are
    no longer able to easily identify what the decision variables actually represent
    in the mathematical model. However, the advantage of general notation is that
    formulating a mathematical model for a problem that involves a large number of
    decision variables is much easier. For instance, for a linear programming problem
    with three decision variables, we would use variable names of x1, x2, and x3;
    for a problem with four decision variables, we would use variable names of x1,
    x2, x3, x4 and so on. Clearly, if a problem involved 1000 decision variables,
    trying to identify 1000 unique names would be difficult. However, using the general
    linear programming notation, the decision variables would be defined as x1, x2,
    x3, ..., x1000.


    To illustrate the graphical solution procedure for a linear program written using
    general linear programming notation, consider the following mathematical model
    for a maximization problem involving two decision variables:


    ```

    Max 3x1 + 2x2

    s.t.

    2x1 + 2x2 ≤ 8

    1x1 + 0.5x2 ≤ 3

    x1, x2 ≥ 0

    ```


    We must first develop a graph that displays the possible solutions (x1 and x2
    values) for the problem. The usual convention is to plot values of x1 along the
    horizontal axis and values of x2 along the vertical axis. Figure 7.22 shows the
    graphical solution for this two-variable problem. Note that for this problem the
    optimal solution is x1 = 2 and x2 = 2, with an objective function value of 10.


    ### FIGURE 7.22 GRAPHICAL SOLUTION OF A TWO-VARIABLE LINEAR PROGRAM WITH GENERAL
    NOTATION


    ![](img/e2cb94e77057728e7ce105fa1f79ad61_36_0.png)


    Using general linear programming notation, we can write the standard form of the
    preceding problem as follows:


    ```

    Max 3x1 + 2x2 + 0s1 + 0s2

    s.t.

    2x1 + 2x2 + 1s1 = 8

    1x1 + 0.5x2 + 1s2 = 3

    x1, x2, s1, s2 >= 0

    ```


    Thus, at the optimal solution x1 = 2 and x2 = 2, the values of the slack variables
    are s1 = s2 = 0.


    ## Summary


    We formulated linear programming models for the RMC maximization problem and the
    M&D Chemicals minimization problem. For both problems we showed how a graphical
    solution procedure and Excel Solver can be used to identify an optimal solution.
    In formulating a linear programming model of these problems, we developed a general
    definition of a linear program.


    A linear program is a mathematical model with the following qualities:


    - 1. A linear objective function that is to be maximized or minimized

    - 2. A set of linear constraints

    - 3. Variables restricted to nonnegative values


    Slack variables may be used to write less-than-or-equal-to constraints in equality
    form, and surplus variables may be used to write greater-than-or-equal-to constraints
    in equality form. The value of a slack variable can usually be interpreted as
    the amount of unused resource, whereas the value of a surplus variable indicates
    the amount over and above some stated minimum requirement. When all constraints
    have been written as equalities, the linear program has been written in its standard
    form.


    If the solution to a linear program is infeasible or unbounded, no optimal solution
    to the problem can be found. In the case of infeasibility, no feasible solutions
    are possible. In the case of an unbounded solution, the objective function can
    be made infinitely large for a maximization problem and infinitely small for a
    minimization problem. In the case of alternative optimal solutions, two or more
