    RMC 问题开发数学模型来说明这些准则。


    ## 彻底理解问题


    RMC 问题相对容易理解。RMC 希望确定生产多少每种产品，以最大化总利润贡献。生产这两种产品所需的三种材料的可用吨数将限制每种产品可生产的吨数。更复杂的问题需要更多工作才能理解问题。然而，彻底理解问题是开发任何数学模型的第一步。


    ## 描述目标


    RMC 的目标是最大化总利润贡献。


    ## 描述每个约束


    三个约束限制了可生产的燃油添加剂吨数和溶剂基吨数。


    ### 约束 1：使用的材料 1 吨数必须小于或等于可用的 20 吨。


    ### 约束 2：使用的材料 2 吨数必须小于或等于可用的 5 吨。


    ### 约束 3：使用的材料 3 吨数必须小于或等于可用的 21 吨。


    ## 定义决策变量


    决策变量是问题中的可控输入。对于 RMC 问题，两个决策变量是 (1) 生产的燃油添加剂吨数，和 (2) 生产的溶剂基吨数。在为 RMC 问题开发数学模型时，我们将使用以下决策变量表示法：


    F = 燃油添加剂吨数

    S = 溶剂基吨数


    ## 用决策变量表示目标


    RMC 的利润贡献来自生产 F 吨燃油添加剂和 S 吨溶剂基。因为 RMC 每生产一吨燃油添加剂赚取 40 美元，每生产一吨溶剂基赚取 30 美元，因此公司从生产燃油添加剂中获得
    40F 美元，从生产溶剂基中获得 30S 美元。因此，


    总利润贡献 = 40F + 30S


    因为目标——最大化总利润贡献——是决策变量 F 和 S 的函数，我们将 40F + 30S 称为目标函数。使用“Max”作为 maximize 的缩写，我们可以将
    RMC 的目标函数写为：


    Max 40F + 30S (7.1)


    ## 用决策变量表示约束


    ### 约束 1：


    使用的材料 1 吨数 ≤ 可用的材料 1 吨数


    RMC 生产的每吨燃油添加剂将使用 0.4 吨材料 1。因此，生产 F 吨燃油添加剂使用 0.4F 吨材料 1。同样，RMC 生产的每吨溶剂基将使用 0.5
    吨材料 1。因此，生产 S 吨溶剂基使用 0.5S 吨材料 1。因此，生产 F 吨燃油添加剂和 S 吨溶剂基所使用的材料 1 吨数为


    使用的材料 1 吨数 = 0.4F + 0.5S


    因为有 20 吨材料 1 可用于生产，约束 1 的数学表述为


    0.4F + 0.5S ≤ 20 (7.2)


    ### 约束 2：


    使用的材料 2 吨数 ≤ 可用的材料 2 吨数


    燃油添加剂不使用材料 2。然而，RMC 生产的每吨溶剂基将使用 0.2 吨材料 2。因此，生产 S 吨溶剂基使用 0.2S 吨材料 2。因此，生产 F 吨燃油添加剂和
    S 吨溶剂基所使用的材料 2 吨数为


    使用的材料 2 吨数 = 0.2S。因为有 5 吨材料 2 可用于生产，约束 2 的数学表述为


    0.2S ≤ 5


    ### 约束 3：


    使用的材料 3 吨数 ≤ 可用的材料 3 吨数


    RMC 生产的每吨燃油添加剂将使用 0.6 吨材料 3。因此，生产 F 吨燃油添加剂使用 0.6F 吨材料 3。同样，RMC 生产的每吨溶剂基将使用 0.3
    吨材料 3。因此，生产 S 吨溶剂基使用 0.3S 吨材料 3。因此，生产 F 吨燃油添加剂和 S 吨溶剂基所使用的材料 3 吨数为


    使用的材料 3 吨数 = 0.6F + 0.3S


    因为有 21 吨材料 3 可用于生产，约束 3 的数学表述为


    0.6F + 0.3S ≤ 21


    ## 添加非负约束


    RMC 不能生产负吨数的燃油添加剂或负吨数的溶剂基。因此，必须添加非负约束，以防止决策变量 F 和 S 取负值。这些非负约束为


    F ≥ 0 and S ≥ 0


    非负约束是许多线性规划问题的一般特征，可以写成缩写形式：


    F, S ≥ 0


    ## RMC 问题的数学模型


    问题表述现已完成。我们已成功将 RMC 问题的口头陈述转化为以下数学模型：


    ```

    Max 40F + 30S

    Subject to (s.t.)

    0.4F + 0.5S ≤ 20 Material 1

    0.2S ≤ 5 Material 2

    0.6F + 0.3S ≤ 21 Material 3

    F, S ≥ 0

    ```


    我们现在的任务是找到产品组合（即 F 和 S 的组合），该组合满足所有约束，同时使目标函数取得最大值。一旦计算出这些 F 和 S 的值，我们就找到了问题的最优解。RMC
    问题的这个数学模型是一个线性规划。RMC 问题具有一个目标和约束，如前所述，这是所有线性规划的共同属性。但是，这个数学模型的什么特征使其成为线性规划？使其成为线性规划的特殊特征是，目标函数和所有约束函数（约束不等式的左侧）都是决策变量的线性函数。


    每个变量以单独项出现且仅以一次方出现的数学函数称为线性函数。目标函数 (40F + 30S) 是线性的，因为每个决策变量以单独项出现且指数为 1。使用的材料
    1 数量 (0.4F + 0.5S) 出于同样的原因也是决策变量的线性函数。同样，材料 2 和材料 3 约束不等式左侧的函数（约束函数）也是线性函数。因此，这种数学表述称为线性规划。


    线性规划与计算机编程无关。此处使用的 programming 一词意为“选择行动方案”。当问题的数学模型仅包含线性函数时，线性规划涉及选择行动方案。


    尝试问题 1，以测试你识别线性规划中可能出现的数学关系类型的能力。


    ## 注释和评论


    - 1. 线性规划模型适用所需的三个假设是比例性、可加性和可分性。比例性意味着对目标函数的贡献和每个约束中使用的资源量与每个决策变量的值成正比。可加性意味着目标函数的值和使用的总资源可以通过对所有决策变量的目标函数贡献和使用的资源求和来找到。可分性意味着决策变量是连续的。可分性假设加上非负约束意味着决策变量可以取任何大于或等于零的值。


    - 2. 定量分析人员制定和求解包含目标函数和一组约束的各种数学模型。此类模型称为数学规划模型。线性规划模型是数学规划模型的一种特殊类型，其目标函数和所有约束函数均为线性。


    ## 7.2 图解法


    涉及仅两个决策变量的线性规划问题可以使用图解法求解。让我们首先通过开发一个显示 RMC 问题可能解（F 和 S 值）的图表来开始图解法。图 7.1 中的图表在水平轴上有
    F 的值，在垂直轴上有 S 的值。图表上的任何点都可以通过其 F 和 S 值来识别，这些值分别指示点沿水平轴和垂直轴的位置。因此，图表上的每个点都对应一个可能的解。F
    = 0 和 S = 0 的解称为原点。因为 F 和 S 都必须是非负的，图 7.1 中的图表仅显示 F ≥ 0 和 S ≥ 0 的解。


    此前我们确定，表示材料 1 约束的不等式为


    0.4F + 0.5S ≤ 20


    为了显示满足此关系的所有解，我们首先绘制与以下方程对应的直线


    0.4F + 0.5S = 20


    '
