    # 7.6 Special Cases


    In this section we discuss three special situations that can arise when we attempt
    to solve linear programming problems.


    # Alternative Optimal Solutions


    From our discussion of the graphical solution procedure, we know that optimal
    solutions can be found at the extreme points of the feasible region. Now let us
    consider the special case where the optimal objective function line coincides
    with one of the binding constraint lines. It can lead to alternative optimal solutions,
    whereby more than one solution provides the optimal value for the objective function.


    To illustrate the case of alternative optimal solutions, we return to the RMC
    problem. However, let us assume that the profit contribution for the solvent base
    (S) has increased to $50. The revised objective function is 40F + 50S. Figure
    7.19 shows the graphical solution to this problem. Note that the optimal solution
    still occurs at an extreme point. In fact, it occurs at two extreme points: extreme
    point 3 (F = 25, S = 20) and extreme point 4 (F = 18.75, S = 25).


    The objective function values at these two extreme points are identical; that
    is, 40F + 50S = 40(25) + 50(20) = 2000


    and


    40F + 50S = 40(18.75) + 50(25) = 2000


    Furthermore, any point on the line connecting the two optimal extreme points also
    provides an optimal solution. For example, the solution point (F = 21.875, S =
    22.5), which is halfway between the two extreme points, also provides the optimal
    objective function value of


    40F + 50S = 40(21.875) + 50(22.5) = 2000


    A linear programming problem with alternative optimal solutions is generally a
    good situation for the manager or decision maker. It means that several combinations
    of the decision variables are optimal and that the manager can select the most
    desirable optimal solution. Unfortunately, determining whether a problem has alternative
    optimal solutions is not a simple matter.


