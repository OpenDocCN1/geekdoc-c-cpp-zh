    T. Suppose that the number of units of R produced has to be at least equal to
    the number of units of T produced. A constraint enforcing this requirement is
    R ≥ T or R - T ≥ 0


    Can you graph a constraint line when the origin is on the constraint line? Try
    Problem 5.


    To find all solutions satisfying the constraint as an equality, we first set R
    = 0 and solve for T. This result shows that the origin (T = 0, R = 0) is on the
    constraint line. Setting T = 0 and solving for R provides the same point. However,
    we can obtain a second point on the line by setting T equal to any value other
    than zero and then solving for R. For instance, setting T = 100 and solving for
    R, we find that the point (T = 100, R = 100) is on the line. With the two points
    (R = 0, T = 0) and (R = 100, T = 100), the constraint line R - T = 0 and the solutions
    that satisfy the constraint R - T ≥ 0 can be plotted as shown in Figure 7.12.


    ## Summary of the Graphical Solution Procedure for Maximization Problems


    As we have seen, the graphical solution procedure is a method for solving two-variable
    linear programming problems such as the RMC problem. The steps of the graphical
    solution procedure for a maximization problem are summarized here:


    For additional practice in using the graphical solution procedure, try Problem
    24.


    - 1. Prepare a graph for each constraint that shows the solutions that satisfy
    the constraint.

    - 2. Determine the feasible region by identifying the solutions that satisfy all
    the constraints simultaneously.


    ### FIGURE 7.12 FEASIBLE SOLUTIONS FOR THE CONSTRAINT R - T ≥ 0


    ![](img/e2cb94e77057728e7ce105fa1f79ad61_21_0.png)


    - 3. Draw an objective function line showing the values of the decision variables
    that yield a specified value of the objective function.

    - 4. Move parallel objective function lines toward larger objective function values
    until further movement would take the line completely outside the feasible region.

    - 5. Any feasible solution on the objective function line with the largest value
    is an optimal solution.


    ## Slack Variables


    In addition to the optimal solution and its associated profit contribution, the
    RMC managers will want information about the production requirements for the three
    materials. We can determine this information by substituting the optimal solution
    values (F = 25, S = 20) into the constraints of the linear program.


    | Constraint | Tons Required for F = 25, S = 20 Tons | Tons Available | Unused
    Tons |

    | :--- | :--- | :--- | :--- |

    | Material 1 | 0.4(25) + 0.5(20) = 20 | 20 | 0 |

    | Material 2 | 0.2(20) = 4 | 5 | 1 |

    | Material 3 | 0.6(25) + 0.3(20) = 21 | 21 | 0 |


    Can you identify the slack associated with a constraint? Try Problem 24, part
    (e).


    Thus, the optimal solution tells management that the production of 25 tons of
    fuel additive and 20 tons of solvent base will require all available material
    1 and material 3 but only 4 of the 5 tons of material 2. The 1 ton of unused material
    2 is referred to as slack. In linear programming terminology, any unused or idle
    capacity for a ≤ constraint is referred to as the slack associated with the constraint.
    Thus, the material 2 constraint has a slack of 1 ton.


    Often variables, called slack variables, are added to the formulation of a linear
    programming problem to represent the slack, or unused capacity, associated with
    a constraint. Unused capacity makes no contribution to profit, so slack variables
    have coefficients of zero in the objective function. More generally, slack variables
    represent the difference between


    Can you write a linear program in standard form? Try Problem 18.


    the right-hand side and the left-hand side of a <= constraint. After the addition
    of three slack variables, denoted S1, S2, and S3, the mathematical model of the
    RMC problem becomes


    Max 40F + 30S + 0S1 + 0S2 + 0S3

    s.t.

    0.4F + 0.5S + 1S1 = 20

    0.2S + 1S2 = 5

    0.6F + 0.3S + 1S3 = 21

    F, S, S1, S2, S3 >= 0


    Whenever a linear program is written in a form with all the constraints expressed
    as equalities, it is said to be written in standard form.


    Referring to the standard form of the RMC problem, we see that at the optimal
    solution (F = 25, S = 20) the values for the slack variables are


    | Constraint | Value of Slack Variable |

    |---|---|

    | Material 1 | S1 = 0 |

    | Material 2 | S2 = 1 |

    | Material 3 | S3 = 0 |


    Could we have used the graphical analysis to provide some of the previous information?
    The answer is yes. By finding the optimal solution in Figure 7.6, we see that
    the material 1 constraint and the material 3 constraint restrict, or bind, the
    feasible region at this point. Thus, the optimal solution requires the use of
    all of these two resources. In other words, the graph shows that at the optimal
    solution material 1 and material 3 will have zero slack. But, because material
    2 constraint is not binding the feasible region at the optimal solution, we can
    expect some slack for this resource.


    Recognizing redundant constraints is easy with the graphical solution method.
    In problems with more than two decision variables, redundant constraints usually
    will not be apparent.


    Finally, some linear programs may have one or more constraints that do not affect
    the feasible region; that is, the feasible region remains the same whether or
    not the constraint is included in the problem. Because such a constraint does
    not affect the feasible region and thus cannot affect the optimal solution, it
    is called a redundant constraint. Redundant constraints can be dropped from the
    problem without having any effect on the optimal solution. However, in most linear
    programming problems redundant constraints are not discarded because they are
    not immediately recognizable as being redundant. The RMC problem had no redundant
    constraints because each constraint had an effect on the feasible region.


    ## NOTES AND COMMENTS


    - 1. In the standard form representation of a linear program, the objective function
    coefficients for the slack variables are zero. This condition implies that slack
    variables, which represent unused resources, do not affect the value of the objective
    function. However, in some applications, some or all of the unused resources can
    be sold and contribute to profit. In such cases the corresponding slack variables
    become decision variables representing the amount of resources to be sold. For
    each of these variables, a nonzero coefficient in the objective function would
    reflect the profit associated with selling a unit of the corresponding resource.


    - 2. Redundant constraints do not affect the feasible region; as a result they
    can be removed from a linear programming model without affecting the optimal solution.
    However, if the linear programming model is to be resolved later, changes in some
    of the data might change a previously redundant constraint into a binding constraint.
    Thus, we recommend keeping all constraints in the linear programming model even
    though one or more of the constraints may be redundant.

