    the line, but one or both of the points cannot be plotted in the nonnegative portion
    of the graph, the simplest approach is to enlarge the graph. In this example,
    the point (P = 0, A = -100) can be plotted by extending the graph to include the
    negative A axis. Once both points satisfying the constraint equation have been
