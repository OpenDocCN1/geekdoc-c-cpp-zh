    # Summary of the Graphical Solution Procedure for Minimization Problems


    The steps of the graphical solution procedure for a minimization problem are summarized
    here:


    +   1. Prepare a graph for each constraint that shows the solutions that satisfy
    the constraint.


    +   2. Determine the feasible region by identifying the solutions that satisfy
    all the constraints simultaneously.'
  - '[PAGE 29]


    +   3. Draw an objective function line showing the values of the decision variables
    that yield a specified value of the objective function.

    +   4. Move parallel objective function lines toward smaller objective function
    values until further movement would take the line completely outside the feasible
    region.

    +   5. Any feasible solution on the objective function line with the smallest
    value is an optimal solution.


    # ## Surplus Variables


    The optimal solution to the M&D Chemicals problem shows that the desired total
    production of A + B = 350 gallons is achieved by using all available processing
    time of 2A + 1B = 2(250) + 1(100) = 600 hours. In addition, note that the constraint
    requiring that product A demand be met is satisfied with A = 250 gallons. In fact,
    the production of product A exceeds its minimum level by 250 – 125 = 125 gallons.
    This excess production for product A is referred to as surplus. In linear programming
    terminology, any excess quantity corresponding to a ≥ constraint is referred to
    as surplus.


    > Excel Solver refers to all nonbinding constraints as having positive slack values
