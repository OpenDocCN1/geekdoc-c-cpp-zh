    # THE U.S. NAVY USES LINEAR PROGRAMMING FOR FUEL CONSERVATION*


    The U.S. Navy spends approximately one billion dollars per year on fuel for its
    ships. The major determinant of fuel consumption for a ship is speed. A ship can
