  - "[PAGE 5]\n\nLinear programming is a problem-solving approach developed to help\
    \ managers make decisions. Numerous applications of linear programming can be\
    \ found in today's competitive business environment. For instance, IBM uses linear\
    \ programming to perform capacity planning and to make capacity investment decisions\
    \ for its semiconductor manufacturing operations. GE Capital uses linear programming\
    \ to help determine optimal lease structuring. Marathon Oil Company uses linear\
    \ programming for gasoline blending and to evaluate the economics of a new terminal\
    \ or pipeline. The Q.M. in Action, Timber Harvesting Model at MeadWestvaco Corporation,\
    \ provides another example of the use of linear programming. Later in the chapter\
    \ another Q.M. in Action illustrates how the United States Navy uses linear programming\
    \ to reduce fuel consumption for its ships.\n\nTo illustrate some of the properties\
    \ that all linear programming problems have in common, consider the following\
    \ typical applications:\n\n+   1. A manufacturer wants to develop a production\
    \ schedule and an inventory policy that will satisfy sales demand in future periods.\
    \ Ideally, the schedule and policy will enable the company to satisfy demand and\
    \ at the same time minimize the total production and inventory costs.\n+   \n\
    +   2. A financial analyst must select an investment portfolio from a variety\
    \ of stock and bond investment alternatives. The analyst would like to establish\
    \ the portfolio that maximizes the return on investment.\n+   \n+   3. A marketing\
    \ manager wants to determine how best to allocate a fixed advertising budget among\
    \ alternative advertising media such as radio, television, newspaper, and magazine.\
    \ The manager would like to determine the media mix that maximizes advertising\
    \ effectiveness.\n+   \n+   4. A company has warehouses in a number of locations.\
    \ Given specific customer demands, the company would like to determine how much\
    \ each warehouse should ship to each customer so that total transportation costs\
    \ are minimized.\n\nThese examples are only a few of the situations in which linear\
    \ programming has been used successfully, but they illustrate the diversity of\
    \ linear programming applications. A close scrutiny reveals one basic property\
    \ they all have in common. In each example, we were concerned with maximizing\
    \ or minimizing some quantity. In example 1, the manufacturer wanted to minimize\
    \ costs; in example 2, the financial analyst wanted to maximize return on investment;\
    \ in example 3, the marketing manager wanted to maximize advertising effectiveness;\
    \ and in example 4, the company wanted to minimize total transportation costs.\
    \ In all linear programming problems, the maximization or minimization of some\
    \ quantity is the objective.\n\n# Q.M. in ACTION\n\n# TIMBER HARVESTING MODEL\
    \ AT MEADWESTVACO CORPORATION*\n\nMeadWestvaco Corporation is a major producer\
    \ of coated papers for periodicals, books, commercial printing, and business forms.\
    \ The company also produces pulp and lumber, designs and manufactures packaging\
    \ systems for beverage and other consumables markets,\n\nand is a world leader\
    \ in the production of coated board and shipping containers. Quantitative analyses\
    \ at MeadWestvaco are developed and implemented by the company's Decision Analysis\
    \ Department. The department assists decision makers by providing them with analytical\
    \ tools of quantitative methods as well as personal analysis and recommendations.\n\
    \n*Based on information provided by Dr. Edward P. Winkofsky of MeadWestvaco Corporation.\n\
    \n(continued)"
  - '[PAGE 6]


    MeadWestvaco uses quantitative models to assist with the long-range management
    of the company''s timberland. Through the use of large-scale linear programs,
    timber harvesting plans are developed to cover a substantial time horizon. These
    models consider wood market conditions, mill pulpwood requirements, harvesting
    capacities, and general forest management principles. Within these constraints,
    the model arrives at an optimal harvesting and purchasing schedule based on discounted
    cash flow. Alternative schedules reflect


    changes in the various assumptions concerning forest growth, wood availability,
    and general economic conditions. Quantitative methods are also used in the development
    of the inputs for the linear programming models. Timber prices and supplies as
    well as mill requirements must be forecast over the time horizon, and advanced
    sampling techniques are used to evaluate land holdings and to project forest growth.
    The harvest schedule is then developed using quantitative methods.


    Linear programming was initially referred to as “programming in a linear structure.”
    In 1948 Tjalling Koopmans suggested to George Dantzig that the name was much too
    long; Koopman’s suggestion was to shorten it to linear programming. George Dantzig
    agreed and the field we now know as linear programming was named.


    All linear programming problems also have a second property: restrictions or constraints
    that limit the degree to which the objective can be pursued. In the first example,
    the manufacturer is restricted by constraints requiring product demand to be satisfied
    and by constraints limiting production capacity. The financial analyst’s portfolio
    problem is constrained by the total amount of investment funds available and the
    maximum amounts that can be invested in each stock or bond. The marketing manager’s
    media selection decision is constrained by a fixed advertising budget and the
    availability of the various media. In the transportation problem, the minimum-cost
    shipping schedule is constrained by the supply of product available at each warehouse.
    Thus, constraints are another general feature of every linear programming problem.


    # 7.1 A Simple Maximization Problem


    RMC, Inc., is a small firm that produces a variety of chemical-based products.
    In a particular production process, three raw materials are used to produce two
    products: a fuel additive and a solvent base. The fuel additive is sold to oil
    companies and is used in the production of gasoline and related fuels. The solvent
    base is sold to a variety of chemical firms and is used in both home and industrial
    cleaning products. The three raw materials are blended to form the fuel additive
    and solvent base as indicated in Table 7.1, which shows that a ton of fuel additive
    is a mixture of 0.4 tons of material 1 and 0.6 tons of material 3. A ton of solvent
    base is a mixture of 0.5 tons of material 1, 0.2 tons of material 2, and 0.3 tons
    of material 3.


    | | Fuel Additive | Solvent Base |

    |---|---|---|

    | Material 1 | 0.4 | 0.5 |

    | Material 2 | | 0.2 |

    | Material 3 | 0.6 | 0.3 |'
