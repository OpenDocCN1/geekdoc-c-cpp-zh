    Slack variable A variable added to the left-hand side of a less-than-or-equal-to
    constraint to convert the constraint into an equality. The value of this variable
    can usually be interpreted as the amount of unused resource.


    Standard form A linear program in which all the constraints are written as equalities.
    The optimal solution of the standard form of a linear program is the same as the
    optimal solution of the original formulation of the linear program.


    Redundant constraint A constraint that does not affect the feasible region. If
    a constraint is redundant, it can be removed from the problem without affecting
    the feasible region.


    Extreme point Graphically speaking, extreme points are the feasible solution points
    occurring at the vertices, or “corners,” of the feasible region. With two-variable
    problems, extreme points are determined by the intersection of the constraint
    lines.


    Surplus variable A variable subtracted from the left-hand side of a greater-than-or-equal-to
    constraint to convert the constraint into an equality. The value of this variable
    can usually be interpreted as the amount over and above some required minimum
    level.


    Alternative optimal solutions The case in which more than one solution provides
    the optimal value for the objective function.


    Infeasibility The situation in which no solution to the linear programming problem
    satisfies all the constraints.


    Unbounded The situation in which the value of the solution may be made infinitely
    large in a maximization linear programming problem or infinitely small in a minimization
    problem without violating any of the constraints.


