    # FIGURE 7.14 THE FIVE EXTREME POINTS OF THE FEASIBLE REGION FOR THE RMC PROBLEM


    ![](img/e2cb94e77057728e7ce105fa1f79ad61_24_0.png)


    the RMC has five vertices or five extreme points (Figure 7.14). We can now state
    our observation about the location of optimal solutions:²


    The optimal solution to a linear programming problem can be found at an extreme
    point of the feasible region for the problem.


    This property means that, if you are looking for the optimal solution to a linear
    programming problem, you do not have to evaluate all feasible solution points.
    In fact, you have to consider only the feasible solutions that occur at the extreme
    points of the feasible region. Thus, for the RMC problem, instead of computing
    and comparing the profit for all feasible solutions, we can find the optimal solution
    by evaluating the five extreme-point solutions and selecting the one that provides
    the highest profit. Actually, the graphical solution procedure is nothing more
    than a convenient way of identifying an optimal extreme point for two-variable
    problems.


    For additional practice in identifying the extreme points of the feasible region
    and determining the optimal solution, try computing and comparing the objective
    function value at each extreme point, try Problem 13.


    # 7.4 Computer Solution of the RMC Problem


    Computer programs designed to solve linear programming problems are widely available.
    After a short period of familiarization with the specific features of the program,
    most users can solve linear programming problems with few difficulties. Problems
    involving thousands of variables and thousands of constraints are now routinely
    solved with computer packages. Some of the leading commercial packages include
    CPLEX, LINGO, MOSEK, Gurobi, and Xpress-MP.


    ²In Section 7.6 we show that two special cases (infeasibility and unboundedness)
    in linear programming have no optimal solution. The observation stated does not
    apply to these cases.'
