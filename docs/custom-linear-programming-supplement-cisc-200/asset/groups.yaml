    Regular 售价为 $1.95，每容器 Zesty 售价为 $2.20，新英格兰奶酪公司应生产多少容器的 Regular 和 Zesty？


    38. 应用技术公司（ATI）使用两种玻璃纤维材料生产自行车车架，以提高车架的强度重量比。标准级材料的成本为每码 $7.50，专业级材料的成本为每码 $9.00。标准级和专业级材料含有不同数量的玻璃纤维、碳纤维和凯夫拉，如下表所示：


    | | 标准级 | 专业级 |

    |---|---|---|

    | 玻璃纤维 | 84% | 58% |

    | 碳纤维 | 10% | 30% |

    | 凯夫拉 | 6% | 12% |


    ATI 与一家自行车制造商签订合同，生产一种碳纤维含量至少为 20% 且凯夫拉含量不大于 10% 的新车架。为满足所需重量规格，每个车架必须总共使用 30
    码材料。


    - a. 制定一个线性规划，以确定 ATI 应在每个车架中使用多少码每种等级的纤维材料，以最小化总成本。定义决策变量并说明每个约束的目的。

    - b. 使用图解法确定可行域。极点的坐标是什么？

    - c. 计算每个极点的总成本。最优解是什么？

    - d. 玻璃纤维材料的分销商目前专业级材料库存过剩。为减少库存，分销商向 ATI 提供以每码 $8 的价格购买专业级材料的机会。最优解会改变吗？

    - e. 假设分销商进一步将专业级材料的价格降至每码 $7.40。最优解会改变吗？专业级材料价格更低会对最优解产生什么影响？请解释。


    39. Innis Investments 为许多公司和富有的客户管理资金。投资策略根据每个客户的需求量身定制。对于一位新客户，Innis 已获授权在两个投资基金中最多投资
    120 万美元：一个股票基金和一个货币市场

    '
