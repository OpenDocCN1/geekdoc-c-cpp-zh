    be able to identify the following properties: (1) The profit lines are parallel
    to each other, and (2) profit lines with higher profit contributions are farther
    from the origin.


    Because the profit lines are parallel and higher profit lines are farther from
    the origin, we can obtain solutions that yield increasingly higher values for
    the objective function by continuing to move the profit line farther from the
    origin but keeping it parallel to the other profit lines. However, at some point
    any further outward movement will place the profit line entirely outside the feasible
    region. Because points outside the feasible region are unacceptable, the point
    in the feasible region that lies on the highest profit line is an optimal solution
    to the linear program.


    You should now be able to identify the optimal solution point for the RMC problem.
    Use a ruler and move the profit line as far from the origin as you can. What is
    the last point in the feasible region? This point, which is the optimal solution,
    is shown graphically in Figure 7.10. The optimal values for the decision variables
    are the F and S values at this point.


