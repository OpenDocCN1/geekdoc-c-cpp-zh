- pgno: 44
  md: '# Chapter IV


    # Screen measurements


    In this lesson in the Xamarin mobile application programming series, we will talk
    about an important topic that often causes some confusion for mobile app developers,
    which is dealing with measurements and sizes on the screen. We will first start
    with a quick historical overview, moving on to understanding the units of measurements
    used in Xamarin.Forms.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Historical overview


    Any projector consists of a rectangular array of Pixels. Any object displayed
    on the screen will have a pixel area. From the outset, programmers treated pixels
    as a standard measurement to draw different objects and shapes on the screen.
    Although the programmer should not usually rely on fixed measurements of the visual
    elements in the applications he writes, it is often necessary to do so as required
    by the application. With different screen sizes and different pixel density per
    screen due to technical advances in this field, it is becoming a major challenge
    for programmers to have the same shape on different displays.


    Desktop monitors have a wide range of pixel measurements, from the old 640x480
    (640 pixels wide, 480 pixels tall) to these days reaching a few thousand per dimension.
    The monitors also have a physical measurement, usually in inches, the diagonal
    distance of the screen rectangle. By measuring and physically measuring any pixel
    of a screen, we can calculate the resolution of pixels per inch (PPI), often called
    DPI (Dots Per Inch).


    For example, for an old 800x600 pixel screen, we can simply conclude that according
    to Pythagoras''s theorem in the existing triangle, this screen is 1000 pixels
    in diameter.


    ![](img/affff2e3b09de80cc0ffe811bbf63f5d_45_0.png)


    In contrast, for the same 13-inch screen, we can now find pixel measurements such
    as 2560x1600, which gives the DPI of this screen an approximate 230. This means
    that any object on the new screen, say, 100 square pixels, for example, will occupy
    a third of the virtual space occupied by the body itself'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'but on the old screen, which will lead to a significant difference in the forms
    of applications on different monitors.

    Practical solutions are beginning to emerge with the development of desktop operating
    systems, which were later adapted to mobile devices. Companies like Microsoft
    and Apple have devised measurement systems based on non-device-independent units
    rather than pixels. It is incumbent upon the operating system to convert these
    measurements designed with the new measurement system to suitable pixel measurements.
    Thus, programmers can write applications based on an independent measurement system,
    so that their applications appear almost uniformly on different types of screens.

    Google in Android followed the same behavior to ensure that formats with specified
    sizes would appear uniformly on all Android screens of various genres.


    # The solution provided by Xamarin.Forms:


    Xamarin.Forms provided a good solution to this issue with the following simple
    hypothesis: every 160 units (device independent) correspond to one inch. This
    is equivalent to 64 units of measurement per centimeter. The above hypothesis
    is valid for any application running on Android, iOS or Windows Phone.

    Any visible object that appears on the screen inherits from the VisualElement
    class. This category has two useful features: Width and Height. These properties
    express the width of the Width and the height of any visible element on the screen
    in units independent of the device as we agreed. The initial value of each is
    -1 at the beginning, and gives us valid values only when the layout that appears
    on the screen is processed and each element takes its place.

    The VisualElement class also defines an event named SizeChanged that occurs when
    the value of one of the Width or Height properties changes. These values may change
    for a variety of reasons, such as rotating the screen. It is possible to install
    a handler for the SizeChanged event for any visual element that appears on the
    page, including the page itself. In the following'
  merge: -1
  img_proc: true
