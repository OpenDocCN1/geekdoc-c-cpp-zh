  md: 'TextAlignment.End value to the HorizontalTextAlignment property, which we will
    do shortly. Another thing to note from the previous figure is that the text is
    so close to the edges of the screen that it almost sticks to it. The solution
    to this topic is simple: adding padding to the edges of the screen, a small area
    that can be programmatically assigned to the screen, from which we can control
    the margin space on its four sides. Now look at the ParagraphPage class builder
