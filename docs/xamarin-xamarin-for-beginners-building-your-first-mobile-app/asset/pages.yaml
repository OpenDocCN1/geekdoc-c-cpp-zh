    {

    Text = "Glory",

    BackgroundColor = Color.Yellow,

    ForegroundColor = Color.Blue,

    });

    ```


    This time we coordinated the text "Glory" so that we assigned yellow as the background
    color for BackgroundColor, and blue for the text color ForegroundColor. See also
    the text portion we added in lines 34 to 39:


    ```

    formattedString.Spans.Add (new Span

    {

    Text = "You will not attain glory until you lick patience.",

    ForegroundColor = Color.Aqua,

    FontSize = Device.GetNamedSize (NamedSize.Large, typeof (Label))

    });

    ```


    This time the font color Aqua and font size Large. Notice how we assigned the
    font size value to the FontSize property. The following expression was used for
    this purpose:


    **Device.GetNamedSize (NamedSize.Large, typeof (Label))**


    Device represents the current device on which our application works, and contains
    many useful static functions. From these functions we used the GetNamedSize function,
    which returns the font size required by the arguments passed to it. The first
    argument is NamedSize.Large, so we want a large font size (NamedSize is numbered),
    and the second argument is the type of element to apply this font to. In this
    case we want to apply this line to the Label so we passed typeof (Label) as the
    second argument where the Type of Label returns. This is the preferred method
