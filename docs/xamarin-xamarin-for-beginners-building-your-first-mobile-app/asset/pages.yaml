    {

    VerticalOptions = LayoutOptions.Center,

    Text = "Xamarin is currently one of the most important mobile app development
    platforms available," +

    "Which seems to stay on the front for not too long," +

    "Especially after Microsoft acquired the company that also has the same name."
    +

    "Through this series we will learn to write practical applications through the
    use of this promising technology.",


    HorizontalTextAlignment = TextAlignment.End

    };


    Padding = new Thickness (5, 5, 5, 5);

    }

    ```


    We first added the HorizontalTextAlignment property to the Label and assigned
    the TextAlignment.End value to align the text within the label to the right (note
    that the regular comma separates properties). We also added the Padding property
    (from the ParagraphPage class) and assigned it a new object of the Thickness class.
    Thickness is subject to overloading as it has more than one shape. I used the
    last figure that accepts four arguments representing padding amounts from left,
    top, right and bottom, respectively. You may wonder about one analogy used here,
    but I will postpone the discussion'
