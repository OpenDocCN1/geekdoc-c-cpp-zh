    In this lesson we dealt with images in Xamarin.Forms. We discussed the issue from
    two different sides. The first aspect is to download the image from the Internet
    (and possibly from a local network), while the second aspect is to download the
    image from a local source. There is more to talk about in this topic, especially
    with regard to the acquisition of images through the sources of images associated
