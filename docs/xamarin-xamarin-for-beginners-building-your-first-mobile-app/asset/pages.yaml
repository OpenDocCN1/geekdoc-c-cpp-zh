    \ (Contact contactToUpdate)\n{\n    return await Task.Factory.StartNew (() =>\n\
    \    {\n        Contact result = (from contact in contacts\n                 \
    \         where contact.Id == contactToUpdate.Id\n                          select\
    \ contact) .FirstOrDefault ();\n        if (result! = null)\n        {\n     \
    \       contactToUpdate.FirstName = result.FirstName;\n            contactToUpdate.LastName\
    \ = result.LastName;\n            contactToUpdate.EMail = result.EMail;\n    \
    \        contactToUpdate.Tel = result.Tel;\n            contactToUpdate.Hobbies\
    \ = result.Hobbies;\n            return true;\n        }\n        else\n     \
    \   {\n            return false;\n        }\n    });\n}\n```\n\nThis code is subject\
    \ to the same principle: The LINQ to Objects query searches for the required contact\
    \ within the contacts within the contacts variable according to the value of the\
    \ contact's Id property, and after obtaining it, the values of the other properties\
    \ are updated as is clear."
