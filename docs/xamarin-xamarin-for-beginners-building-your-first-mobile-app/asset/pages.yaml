- pgno: 109
  md: "# Continue with DeleteContactAsync\n\nThe DeleteContactAsync function requires\
    \ only one Contact argument and returns a Task <bool> object to indicate the success\
    \ of the deletion:\n\n```\n```csharp\npublic async Task <bool> DeleteContactAsync\
    \ (Contact contactToDelete)\n{\n return await Task.Factory.StartNew (() =>\n {\n\
    \ var result = (from contact in contacts where contact.Id! = contactToDelete.Id\
    \ select contact);\n if (result! = null)\n {\n contacts = new ObservableCollection\
    \ <Contact> (result);\n contactToDelete = null;\n return true;\n }\n else\n {\n\
    \ return false;\n }\n });\n}\n```\n```\n\nThe preceding code actually filters\
    \ the contact to be deleted, which simply means that the LINQ to Objects query\
    \ will return all contacts except those whose Id value has a value of Id for the\
    \ contact we want to delete. Then the result is attributed to the contacts variable,\
    \ which means that we have actually deleted this contact from memory."
  merge: -1
  img_proc: true
