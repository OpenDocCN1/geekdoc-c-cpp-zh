  md: 'This way, the warehouse template is ready for use. Where it will deal with
    all components of the application to perform four different types of operations
    on the data: search, add, modify, and delete.


    # ## Conclusion


    In this lesson, we examined how to build the repository model represented by the
    MemoryContactsRepository class, which is achieved as we know the IContactsRepository
    interface, where we got to know the four functions within it that allow the application
    components to deal with data without paying attention to the location of these
    data. We also learned how to use the LINQ to Objects query technology within the
    four dependencies to perform the tasks required from this warehouse. In the next
    lesson, we''ll start with building the application interfaces.


    # 3


    This lesson is the third and final part of the lessons on how to build a simple
    practical application for managing contacts with preliminary data. You will need
    to read the first and second parts before you can continue in this lesson.


    +   - The main interface through which you can search for contacts by name and
    nickname, and also add a new contact.

    +   - The interface for viewing the contact details chosen from the main interface,
    and then the ability to modify their data or even delete it.


    In addition to modifying the class App to make the application workable.'
