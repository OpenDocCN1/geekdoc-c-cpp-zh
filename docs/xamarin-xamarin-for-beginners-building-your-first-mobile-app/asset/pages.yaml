- pgno: 32
  md: 'In the previous lessons, we dealt with only one element that appears on the
    screen. This element was a Label that we assigned to the Content property of a
    content page. In real programs as is known, we will definitely need many elements
    that will appear on the screen to meet the requirements of the program. The problem
    here is that the Content property of a content page only accepts one element that
    inherits from the View class.

    Xamarin has found a simple solution to this problem using layouts. A chart can
    accommodate any number of items that each inherits from the View class. In fact,
    the chart itself inherits from the Layout <View> class and this class inherits
    indirectly from the View class. Any content schema can be directly assigned. Xamarin
    supports four types of charts:


    +   AbsoluteLayout

    +   - GridLayout

    +   - RelativeLayout

    +   - StackLayout stack layout.


    We will look at three schemes in this series: Mutlaq, Reticular and Stacked. In
    this chapter we will begin with the StackLayout stack diagram.


    # StackLayout stack layout:


    Any number of items can be added to this chart. The reason for this name is because
    it arranges stacked elements. The StackLayout class has two additional properties
    from the rest of the charts: Orientation, which expresses the direction (horizontal
    or vertical) and Spacing, and represents the spacing between the elements added
    to the chart and has a default value of 6.0. Let us'
  merge: -1
