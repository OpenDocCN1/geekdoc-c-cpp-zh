- pgno: 7
  md: '# Introduction


    The Xamarin platform is currently one of the most important mobile application
    development platforms available, which seems to remain on the forefront of time,
    especially after the acquisition of Microsoft company, which also has the same
    name (Xamarin). You may be motivated to enter the mobile app development world
    (as when you first got acquainted with Xamarin) and ready to write code directly,
    but to be patient a little, and to understand the beginnings, and the principle
    of Xamarin working better within this article, which is the first in a series
    that will guide you to How to develop applications using Xamarin platform and
    create practical applications through them.


    Xamarin (read Zamarin) was founded in 2011 by the same engineers who designed
    the Mono project. The Mono Brothers project like Mono for android and Mono Touch
    are platforms to run applications written in C # on the operating systems: Linux,
    Android and iOS respectively. With Xamarin, you can create native Native Apps
    for Android, iOS, Mac and Windows in a programming language that isn''t officially
    supported. In this series, we''ll focus on building Android apps.


    # Whose series?


    If you have a good familiarity with C Sharp and BCL within the DotNet framework,
    as well as a basic knowledge of how to use the Visual Studio'
  merge: -1
  img_proc: true
- pgno: 8
  md: '2015 development environment, and are passionate about learning how to program
    mobile apps using Xamarin, this series is definitely for you. Here at the Hassoub
    Academy we have a C-Sharp educational series that can be used.


    # Need for Xamarin


    The need for Xamarin has arisen because of the nature of mobile applications and
    their work on different operating systems from competing companies. There are
    currently three different operating systems dominating the market: iOS for Apple,
    Android for Google, and Windows Phone for Microsoft. These systems differ in many
    respects, which we will discuss below.


    # User experience


    For the user experience there is a similarity in these systems in terms of providing
    the graphical user interfaces and interacting with the device through touch or
    multi-touch, but there are differences in the details. Each operating system has
    different ways of navigating application pages, presenting data, working with
    menus, and other details that require a developer to take a different approach
    for each operating system.


    # Development environments and different programming languages


    For programming languages and development environments, this is another matter.
    Each operating system has its own requirements, which I quickly summarize as follows:


    +   - To create applications on iOS you need to master the Objective-C programming
    language or the Swift programming language. And own a MacBook (any version) with
    the Xcode development environment.

    +   - To create applications on Android you will need Java with the Android Studio
    development environment running on many operating systems.

    +   - To create applications running on Windows Phone or Windows 10 Mobile, you
    need the C # programming language with a computer running Windows,'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'and the Visual Studio development environment.


    # Different programming interfaces


    All previous operating systems rely on different APIs. However, there are some
    similarities for user-interface objects. For example, all previous systems provide
    a way for the user to choose a Boolean logical state that can be represented as
    True or False. In iOS, this object is classified as a view named UISwitch, in
    Android it is a widget called Switch, and in Windows it is called ToggleSwitch.


    # The solution provided by Xamarin


    All of the above points can be bypassed by Xamarin because it provides a single
    programming language, C-Sharp, that can be used to write applications on any operating
    system. It also provides a single advanced development environment, Visual Studio
    2015, for writing these applications (the Xamarin Studio development environment
    can also be used for Mac). In addition, it unified the various APIs into a single
    developer interface.


    The C-Sharp language is defenseless. It is a strong, flexible, very rich and enduring
    language. It has truly become one of the most advanced and modern programming
    languages. We are not here to prefer a programming language over another, but
    in my personal experience, and to know many other programming languages, you can
    say that Sea Sharp occupies a prominent position among them.


    For a specific application, developers can write one common code for all previous
    operating systems without any modifications to them in terms of business logic
    within the application and the software operations that are not related to the
    type of mobile device or operating system it is running on. We call this code
    independent of platform independent. If the application is required to handle
    the hard hardware of the device it is working on (such as a camera or a GPS sensor),
    then you can write parts of the code that take into account the specificity of
    each operating system, we call such code as the code associated with the platform
    dependent operating system.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# The main components of the platform Xamarin


    Since its inception, Xamarin has focused on the technology of compilers. The company
    has released three core sets of .NET libraries: Xamarin.Mac, Xamarin.iOS and Xamarin.Andorid,
    which together make up the Xamarin platform. These libraries allow developers
    to write native apps for each of the supported operating systems.


    # Xamarin models


    In 2014, Xamarin created what is known as Xamarin or Xamarin Forms. This platform
    allows developers to write user interface code so that it can be converted directly
    into applications running on Android, iOS and Windows. In fact, Xamarin Forms
    now supports generic Universal Windows Platform applications on devices running
    different Windows versions such as Windows Phone, Windows 10, Windows 10 Mobile,
    Windows 8.1, and Windows 8.1 Phone.


    The solution architecture in Visual Studio will not change much, except that the
    separate projects for previous operating systems will be remarkably small due
    to the small amount of code in them. In this case, the PCL or SAP project will
    include the shared code, independent of the operating systems as agreed earlier,
    as well as the code responsible for displaying and handling the user interface.
    In other words, Xamarin Forms allows us to write a single code that works directly
    on different operating systems. See the following figure to understand how Xamarin
    Forms applications work.


    Applications written for different operating systems in this case rely entirely
    on the PCL or SAP project to communicate with the APIs. Thus in many applications
    it is possible to write only one code that works on all devices! Except where
    it is necessary to write custom code for a specific operating system. In the future
    this may change, it may be possible to write only one code that works on all devices
    of any kind. In this series we will talk about'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Xamarin Forms mainly.


    # How Xamarin works


    For iOS applications, Xamarin''s C-Sharp translator translates the code into MSIL,
    and then Apple''s Mac translator is used to generate native native code running
    on iOS as if it were an object-C application.


    For Android applications, the compiler will also generate the MSIL language, which
    in this case will create a common CLR for Android. The resulting applications
    in this case will also be very similar to those created using the Java language
    and Android Studio development environment for Android.


    Finally, for apps running on Windows Phone and Windows 10 Mobile, apps are clearly
    supported, and will work like native apps created with Visual Studio without Xamarin.


    # Conclusion


    The Xamarin platform is promising, and has a long history and rich experiences
    before Xamarin emerged. Microsoft may have realized its importance, and the acquisition
    was completed. I recommend that you take the initiative to learn Xamarin, especially
    if you are a C Sharp programmer, or have preliminary information about it. The
    coming days may bring more support and surprises to the Xamarin platform, the
    first of which was to make it free for personal use or small software teams. Starting
    with the next lesson in this tutorial, we will install Visual Studio 2015 and
    start working with Xamarin.'
  merge: -1
  img_proc: true
