    # Engineering Transformations


    Transforms are essential mathematical concepts in the world of graphic programming.
    There are three types of engineering conversions:


    +   - **Withdrawal**

    +   - **Rotation**

    +   - **Emulating Scale**


    Geometric conversions are based primarily on matrices. They are important mathematical
    structures that are the backbone of any geometric transformation. Fortunately,
    Xamarin simplifies it and makes it easy to use'
