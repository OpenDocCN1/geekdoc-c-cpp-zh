    \ ModelessPage());\n};\n```\n\n我们首先创建一个 Button 对象并将其分配给 gotoModelessButton 变量，然后分配一个\
    \ clicked 事件处理程序，一个简单的 lambda 表达式，表示需要 sender 和 e 参数的函数，并在前面加上保留字 async，如上一个代码所示。async\
    \ 存在的原因是我们将在此事件处理程序中使用异步调用：\n\n```csharp\nawait Navigation.PushAsync(new ModelessPage());\n\
