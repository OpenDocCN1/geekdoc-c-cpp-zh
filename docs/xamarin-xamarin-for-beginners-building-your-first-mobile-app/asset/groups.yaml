    \n### 在页面之间移动\n\n移动应用程序通常由用户导航以利用应用程序提供的功能的单独页面组成。对于 Android 应用程序，Back 按钮在此导航中至关重要。在本教程的\
    \ Xamarin.Forms Android 应用程序编程学习系列中，我们学习如何在应用程序页面之间导航。首先我们将讨论单个应用程序中页面导航的概念，然后我们将通过一个简单的实际示例讨论导航中使用的内容页类型。\n\
    \n### 在应用程序页面之间导航的概念\n\n在应用程序页面之间导航与堆栈的工作原理非常相似。堆栈是一种支持 LIFO（后进先出）概念的数据结构。当你从页面\
    \ A 移动到页面 B 时，页面 B 被推到堆栈顶部，导致它显示给用户。同样，当你从页面 B 移动到页面 C 时，页面 C 被推到堆栈以显示给用户。当我们想要返回到原始页面\
    \ A 时，页面 C 被弹出并从堆栈中移除，页面 B 将位于堆栈顶部（即它将显示给用户），页面 B 将从堆栈中移除，页面 A 将位于堆栈顶部。请参阅以下图示来说明这个想法：\n\
    \n![](img/affff2e3b09de80cc0ffe811bbf63f5d_74_0.png)\n\n### 模态和非模态页面\n\n"
