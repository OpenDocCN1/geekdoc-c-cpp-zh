    \        new ColorInfo { Color = Color.Maroon, Name = \"Maroon\" },\n        \
    \        new ColorInfo { Color = Color.Yellow, Name = \"Yellow\" },\n        \
    \        new ColorInfo { Color = Color.Olive, Name = \"Olive\" },\n          \
    \      new ColorInfo { Color = Color.Lime, Name = \"Lime\" },\n              \
    \  new ColorInfo { Color = Color.Green, Name = \"Green\" },\n                new\
    \ ColorInfo { Color = Color.Navy, Name = \"Navy\" },\n                new ColorInfo\
    \ { Color = Color.Teal, Name = \"Teal\" },\n                new ColorInfo { Color\
    \ = Color.Pink, Name = \"Pink\" },\n                new ColorInfo { Color = Color.Fuchsia,\
    \ Name = \"Fuchsia\" },\n                new ColorInfo { Color = Color.Purple,\
    \ Name = \"Purple\" }\n            };\n\n            StackLayout stackLayout =\
    \ new StackLayout();\n\n            for (int i = 0; i < colors.Length; i++)\n\
    \            {\n                stackLayout.Children.Add(new Label\n         \
    \       {\n                    Text = colors[i].Name,\n                    TextColor\
    \ = colors[i].Color,\n                    BackgroundColor = GetSuitableBackgroundColor(colors[i].Color),\n\
    \                    FontSize = Device.GetNamedSize(NamedSize.Large, typeof(Label))\n\
    \                });\n            }\n\n            Padding = new Thickness(5,\
    \ 5, 5, 5);\n\n            Content = new ScrollView\n            {\n         \
    \       Content = stackLayout\n            };\n        }\n\n        private Color\
    \ GetSuitableBackgroundColor(Color color)\n        {\n            double luminance\
    \ = 0.30 * color.R +\n                0.59 * color.G +\n                0.11 *\
    \ color.B;\n\n            return luminance > 0.5 ? Color.Black : Color.White;\n\
    \        }\n    }\n}\n```\n\n仔细思考上面的代码，确保你完全理解。然后按 F5 运行程序，效果大致如下。我使用了新的滚动功能来显示之前未能显示出的其余元素：\n\
    \n- 银色\n- 红色\n- 栗色\n- 黄色\n- 橄榄色\n- 青柠色\n- 绿色\n- 海军蓝\n- 蓝绿色\n- 粉色\n- 紫红色\n- 紫色\n\
    \n你会注意到，此列表中显示的每种颜色都有一个适合它的背景颜色，以达到最佳显示效果。\n\n## *注意*\n\n你可以使用 StackLayout 的 `Spacing`\
    \ 属性来增加或减少屏幕上标签之间的间距。如前所述，`Spacing` 的默认值为 6.0。例如，尝试将该值设为 0，看看会发生什么。你可以通过添加下面这一行为之前的程序设置此属性：\n\
    \n```csharp\nstackLayout.Spacing = 0;\n```\n\n紧接在下一行之后：\n\n```csharp\nStackLayout\
    \ stackLayout = new StackLayout();\n```\n\n## 结论\n\n在本课中，我们学习了如何处理 StackLayout\
    \ 堆栈布局的原理，这种布局在 Xamarin 应用中广泛使用，用于将屏幕上的可视元素按堆叠方式排列。我们还学习了如何让堆栈布局滚动，以便显示屏幕上未出现的项目。在下一课中，我们将继续使用\
    \ StackLayout，并讨论这种布局所具有的更重要优势。\n\n## 第四章\n\n### 屏幕测量\n\n在 Xamarin 移动应用编程系列的这一课中，我们将讨论一个经常让移动应用开发者感到困惑的重要主题，即如何处理屏幕上的测量值和尺寸。我们首先快速回顾一下历史，然后继续理解\
    \ Xamarin.Forms 中使用的测量单位。\n\n### 历史概述\n\n任何屏幕都由矩形像素阵列组成。屏幕上显示的任何对象都有一个像素区域。从一开始，程序员就把像素视为在屏幕上绘制不同对象和形状的标准度量单位。虽然程序员通常不应依赖他所编写应用中可视元素的固定尺寸，但经常会因为应用需求而不得不这样做。由于该领域的技术进步，屏幕尺寸各异、每块屏幕的像素密度也各不相同，要让程序员在不同显示器上保持相同的界面形态已成为一项重大挑战。\n\
    \n台式机显示器的像素测量范围很广，从旧的 640x480（640 像素宽，480 像素高）到如今每个维度数千像素。显示器还有一个物理尺寸，通常以英寸为单位——即屏幕矩形的对角线距离。通过测量屏幕上任意像素的物理大小，我们可以将分辨率计算为每英寸像素数（PPI），通常也称为\
    \ DPI（每英寸点数）。\n\n例如，对于一个旧的 800x600 像素屏幕，根据勾股定理，我们可以直接得出该屏幕的对角线为 1000 像素。\n\n![](img/affff2e3b09de80cc0ffe811bbf63f5d_45_0.png)\n\
    \n相比之下，对于同样的 13 英寸屏幕，我们现在可以找到诸如 2560x1600 的像素尺寸，这使得该屏幕的 DPI 约为 230。这意味着新屏幕上的任何对象（例如一个\
    \ 100 平方像素的对象）所占的空间，将只有旧屏幕上同一对象所占空间的三分之一，这将导致应用在不同显示器上的外观产生显著差异。\n\n随着桌面操作系统的发展，实用的解决方案开始出现，这些方案后来也被用于移动设备。微软和苹果等公司设计出了基于设备无关单位的测量系统，而不是基于像素。操作系统负责将这些使用新测量系统设计的尺寸转换为合适的像素尺寸。这样，程序员就可以基于一种独立的测量系统来编写应用，使他们的应用在不同类型的屏幕上几乎一致地显示。\n\
    \nGoogle 在 Android 系统中也采用了同样的做法，以确保具有指定尺寸的格式能够统一地显示在各种类型的 Android 屏幕上。\n\n###\
    \ Xamarin.Forms 提供的解决方案\n\nXamarin.Forms 基于以下简单的假设为这个问题提供了良好的解决方案：每 160 个（设备无关）单位对应一英寸。这相当于每厘米\
    \ 64 个测量单位。上述假设适用于运行在 Android、iOS 或 Windows Phone 上的任何应用。\n\n屏幕上出现的任何可见对象都继承自\
    \ `VisualElement` 类。该类有两个有用的属性：`Width` 和 `Height`。如我们之前所约定的，这两个属性以设备无关单位表示屏幕上任何可见元素的宽度和高度。它们的初始值都是\
    \ -1，只有当屏幕上的布局被处理且每个元素各就其位时，才会给出有效的值。\n\n`VisualElement` 类还定义了一个名为 `SizeChanged`\
    \ 的事件，当 `Width` 或 `Height` 属性之一的值发生变化时，该事件就会发生。这些值可能会因多种原因而改变，例如旋转屏幕。可以为页面上出现的任何可视元素（包括页面本身）安装\
    \ `SizeChanged` 事件的处理程序。在以下\n"
