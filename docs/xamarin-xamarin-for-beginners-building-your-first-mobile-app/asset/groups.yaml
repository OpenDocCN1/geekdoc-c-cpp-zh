    the Mono project. The Mono Brothers project like Mono for android and Mono Touch
    are platforms to run applications written in C # on the operating systems: Linux,
    Android and iOS respectively. With Xamarin, you can create native Native Apps
    for Android, iOS, Mac and Windows in a programming language that isn''t officially
