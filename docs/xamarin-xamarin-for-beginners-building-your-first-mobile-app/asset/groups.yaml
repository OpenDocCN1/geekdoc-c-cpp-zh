    \   Content = goBackButton;\n        }\n    }\n}\n```\n\nThen navigate to the\
    \ ModelessPage.cs file and make sure its contents are as follows:\n\n```csharp\n\
    using Xamarin.Forms;\n\nnamespace ModelessAndModal\n{\n    public class ModelessPage\
    \ : ContentPage\n    {\n        public ModelessPage()\n        {\n           \
    \ Title = \"Modeless Page\";\n            Button goBackButton = new Button\n \
    \           {\n                Text = \"Back to Main\",\n                HorizontalOptions\
    \ = LayoutOptions.Center,\n                VerticalOptions = LayoutOptions.Center\n\
    \            };\n\n            goBackButton.Clicked += async (sender, args) =>\n\
    \            {\n                await Navigation.PopAsync();\n            };\n\
    \n            Content = goBackButton;\n        }\n    }\n}\n```\n\nThe contents\
    \ of each of the previous two pages are identical. Each has a button called goBackButton\
    \ that is intended to return to the previous page (which caused the current page\
    \ to appear). There is only one slight difference between the two click event\
    \ handlers on the previous two pages. For the modal page, the Navigation.PopModalAsync\
    \ call was used to return to the previous page. For the modeless page, Navigation.PopAsync\
    \ was used to return to the previous page. Another difference when executing the\
    \ program is that if you move from the home page to the ModelessPage page, the\
    \ page title will appear at the top with a small arrow that allows us to return\
    \ to the previous page. When you go from the home page to the ModalPage page,\
    \ the title of the page will never appear (although the Title property is set\
    \ to it). The only way to return to the previous page is by clicking the back\
    \ button on the page or by clicking the back button provided by the operating\
    \ system. Experiment with the app and see the difference between the two pages.\n\
    \n## Conclusion\n\nIn this lesson we discussed how to navigate between pages in\
    \ Android apps, which is of course an important topic. We've identified the difference\
    \ between modal and modeless pages. We also learned how to create the master page,\
    \ which is the main building block in the transition between pages, by creating\
    \ the master page as a NavigationPage.\n\n## Chapter VIII\n\n### Engineering Transformations\n\
    \nTransforms are essential mathematical concepts in the world of graphics programming.\
    \ There are three types of engineering transformations:\n\n- **Translation**\n\
    - **Rotation**\n- **Scaling**\n\nGeometric transformations are based primarily\
    \ on matrices. They are important mathematical structures that are the backbone\
    \ of any geometric transformation. Fortunately, Xamarin simplifies this and makes\
    \ it easy to use.\n"
  mdcn: "\n\n每个应用程序都包含一个主页面（它将属于 NavigationPage 类别），它是所有其他页面的主节点，无论其数量和层级如何，都可以通过它访问。Xamarin\
    \ 还区分了两种在这种导航结构中使用的内容页面类型：Modal Pages 和 Modeless Pages。对于 Android 应用而言，这两种类型之间的区别很简单。即，在\
