    > “ The strength of the repository model will be evident when we want to change
    the location where data is saved, as we will only need to change the repository
    class (not the interface) while the rest of the application components remain
    unchanged. More precisely, the change will be in only one place and it is within
    the class of the App class, where we will change the type from which we will create
    the object that we assign to the ContactsRepository property”


