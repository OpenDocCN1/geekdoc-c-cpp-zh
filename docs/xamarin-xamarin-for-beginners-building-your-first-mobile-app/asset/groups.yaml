    As we know, images are essential elements of any application, they add aesthetic
    touch and give an explanatory impression of the basic functions of the application.
    We will continue our work in this series by explaining how to use images in Xamarin.Forms.
    Xamarin deals with bitmaps that may differ slightly for Android, iOS, and Windows,
    but if you rely on formats like JPEG, PNG and BMP, you won''t have any problems.


    Xamarin.Forms handles images in two main styles. The first method relies on platform-independent
    images, and the second method relies on platform-specific images or, more precisely,
    the operating system. You will address the first method in our lesson through
    two simple applications that illustrate this. The second method will be postponed
    to another lesson.


    Images within Xamarin applications can be viewed by a visual element represented
    by the Image class. As with other visual elements that inherit from the VisualElement
    class, this element has many properties in common with any other visual element,
    such as the Label. In addition to other features that distinguish it, such as
    the Source property, which reflects the source of the image that will be displayed
    within it. This feature will be our focus in this lesson. Device independent images
    can be obtained in two different styles. In each method, you need to assign an
    object of the ImageSource class to the Image property of the Image object.


    The first method is to get images directly from the Internet, by calling the'
