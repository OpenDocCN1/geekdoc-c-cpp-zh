    # Xamarin models


    In 2014, Xamarin created what is known as Xamarin or Xamarin Forms. This platform
    allows developers to write user interface code so that it can be converted directly
    into applications running on Android, iOS and Windows. In fact, Xamarin Forms
    now supports generic Universal Windows Platform applications on devices running
    different Windows versions such as Windows Phone, Windows 10, Windows 10 Mobile,
