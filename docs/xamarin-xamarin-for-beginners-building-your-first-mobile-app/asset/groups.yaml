  mdcn: "\n未来的应用中，并非所有项目都会同时出现在屏幕上。实际上，我们需要像其他 Android 应用一样的滚动机制。下面我们将同时解决这两个问题。\n\
    \n## 增强版 ColorsApp 实现\n\n我们首先来解决颜色变化的问题，方法是在 `ColorsListPage` 类中添加一个新函数 `GetSuitableBackgroundColor`。该函数的目的是根据公认理想的数值常量来计算亮度值。如果要显示的颜色亮度大于\
    \ 0.5，则背景为黑色；如果小于或等于 0.5，则背景为白色。这样可以为屏幕上显示的颜色提供合适的对比度。请查看此函数的代码：\n\n```csharp\n\
    private Color GetSuitableBackgroundColor(Color color)\n{\n    double luminance\
    \ = 0.30 * color.R +\n            0.59 * color.G +\n            0.11 * color.B;\n\
    \n    return luminance > 0.5 ? Color.Black : Color.White;\n}\n```\n\n`color.R`、`color.G`\
    \ 和 `color.B` 属性分别表示传入此函数的颜色的红、绿、蓝分量，该函数用于查找合适的背景颜色。0.30、0.59 和 0.11 这些常量是计算颜色亮度的理想值，如果你愿意，也可以修改它们。\n\
    \n至于屏幕滚动，使用 ScrollView 很简单：我们创建一个新对象，将 `stackLayout` 变量赋给该对象的 `Content` 属性，然后将这个新对象赋给\
    \ `ColorsListPage` 的 `Content` 属性，而不是像上一个程序那样直接将 `stackLayout` 赋给它。请看下面的代码：\n\n\
    ```csharp\nContent = new ScrollView\n{\n    Content = stackLayout\n};\n```\n\n\
    现在看一下完成上述修改后的完整代码：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Reflection.Emit;\nusing System.Text;\n\nusing\
    \ Xamarin.Forms;\n\nnamespace ColorsApp\n{\n    public class ColorInfo\n    {\n\
