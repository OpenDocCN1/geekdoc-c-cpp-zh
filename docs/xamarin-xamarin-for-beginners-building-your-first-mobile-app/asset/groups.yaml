  mdcn: "\n\n## Xamarin 的工作原理\n\n对于 iOS 应用，Xamarin 的 C-Sharp 翻译器会将代码翻译成 MSIL，然后使用苹果的\
    \ Mac 翻译器生成在 iOS 上运行的原生代码，就像它是 Objective-C 应用一样。\n\n对于 Android 应用，编译器也会生成 MSIL\
    \ 语言，在这种情况下会为 Android 创建一个通用的 CLR。在这种情况下生成的应用程序也将与使用 Java 语言和 Android Studio 开发环境为\
    \ Android 创建的应用程序非常相似。\n\n最后，对于在 Windows Phone 和 Windows 10 Mobile 上运行的应用，应用显然是受支持的，并且将像使用\
    \ Visual Studio 在没有 Xamarin 的情况下创建的原生应用一样工作。\n\n## 结论\n\nXamarin 平台很有前景，并且在 Xamarin\
    \ 出现之前已有悠久的历史和丰富的经验。微软可能已经意识到其重要性，并完成了收购。我建议你主动学习 Xamarin，特别是如果你是 C Sharp 程序员，或者对其有初步了解。未来的日子可能会为\
    \ Xamarin 平台带来更多支持和惊喜，其中第一个就是使其对个人使用或小型软件团队免费。从本教程的下一课开始，我们将安装 Visual Studio 2015\
    \ 并开始使用 Xamarin。\n\n## 第一章\n\n## 应用架构\n\n### 使用 Xamarin 创建的应用的结构\n\n运行 Visual\
    \ Studio 2015，在主窗口出现后转到文件菜单，然后转到新建并从出现的子菜单中选择项目选项。如我们在上一课中所做的那样，从出现的窗口左侧选择跨平台，然后从窗口中间部分选择空白应用（Xamarin.Forms\
    \ 便携式）。将此项目命名为 SimpleTextApp 并单击确定按钮。\n\n我们将构建一个简单的应用程序，展示如何在基于 Xamarin 的应用程序中使用单个\
    \ Label 显示文本。从解决方案资源管理器中，通常位于 Visual Studio 开发环境窗口右侧，只保留 SimpleTextApp.Droid 和\
    \ SimpleTextApp（便携式）项目，因为我们将只处理 Android 应用程序（正如我们在上一课中商定的那样）。你会得到一个类似以下形状的界面：\n\
    \n![](img/affff2e3b09de80cc0ffe811bbf63f5d_13_0.png)\n\nSimpleTextApp（便携式）包含大部分代码，这是\
    \ PCL 风格项目中的常见行为。项目内的代码（便携式部分加上其名称）对在任何操作系统上运行的任何类型应用程序都是通用的，包括 Android。基本的 .cs\
    \ 将存在于我们之前谈到的任何 Xamarin 应用程序中，我们看到了它如何包含从 Application 类继承的 App 类，以及该类的构建器如何负责创建应用程序的主页。你会注意到有几个引起我们兴趣的库，包括：Xamarin.Forms.Core、Xamarin.Forms.Platform、Xamarin.Forms.Xaml\
    \ 这些\n\n是为 Xamarin.Forms 形成的核心库。\n\nSimpleTextApp.Droid 项目包含两个文件夹：Assets 和 Resources。Resources\
    \ 文件夹包含图像文件、布局描述和其他文件，这些是你的应用的资源。发布 Resources 文件夹以查看其结构。至于 Assets 文件夹，其他你想要包含在应用程序中的公共文件都包含在其中。该项目还包含\
    \ MainActivity.cs 文件，其中包含与 MainActivity 名称相同的类别，它是 Android 应用程序的主要活动。打开此文件可发现该类包含在启动\
    \ Android 应用时执行的 OnCreate 函数。注意此函数内的以下代码语句：\n\n```\nLoadApplication (new App ());\n\
    ```\n\n显然，它从 SimpleTextApp（便携式）项目中的 App 类创建一个新对象，然后将其直接传递给 LoadApplication 函数以加载应用程序并向用户显示。创建\
    \ App 类的新对象会执行其结构并负责创建应用程序的主页，正如我们提到的那样，然而在我们开始编写代码后，这个想法将被很好地阐明。\n\n## 编写代码\n\
    \n在解决方案资源管理器中右键单击 SimpleTextApp（便携式）以显示上下文菜单，选择添加然后从子菜单中选择类。将出现添加新类的窗口。Visual\
    \ Studio 将向项目添加一个名为 MainPage.cs 的新文件，其中包含同名类和内容如下：\n\n```\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
    ```\n\n```\nnamespace SimpleTextApp\n{\nclass MainPage\n{\n}\n}\n```\n\n我们不需要上一代码中大部分的名称范围，在此程序中我们目前需要的是命名空间\
    \ Xamarin.Forms。我们将使 MainPage 类继承自 ContentPage 类并向其添加构建器。修改上一代码使其读取如下：\n\n```\n\
    using Xamarin.Forms;\n```\n\n```\nnamespace SimpleTextApp\n{\nclass MainPage:\
    \ ContentPage\n{\npublic MainPage ()\n{\n}\n}\n}\n```\n\n请注意我摆脱了所有不必要的名称范围（然而在\
    \ Visual Studio 2015 开发环境中，任何未使用的名称范围都会以淡色显示在代码中）。MainPage 类将充当 SimpleTextApp\
    \ 应用程序的简单内容页。我们将在此类别中包含创建单个 Label 包含简单文本所需的代码。然后我们将对该标签进行一些简单实验。此程序实际上很简单，其任务是让你更熟悉\
    \ Xamarin。\n\n我们将从在 MainPage 类构建器内从 Label 类创建标签开始。标签通常用于向用户显示文本。看以下简单代码：\n\n```\n\
    Label lblMain = new Label ();\n lblMain.Text = \"Welcome to moaml Academy!\";\n\
    ```\n\n我们创建一个标签并创建一个类的任何对象。我们在上一对象中设置新代码的类和 Label 到变量 lblMain。然后将文本 \"Welcome\
    \ to Hsoub Academy!\" 分配给变量 lblMain 的 Text 属性。Text 属性用于设置和读取标签的文本内容。\n\n为了让我们可以在应用程序的主页上查看之前的标签，我们将变量\
    \ lblMain 分配给类 ContentPage 的 Content 属性。由于 MainPage 类继承自 ContentPage，Content 属性会自动包含在其中。归属过程将如下所示：\n\
    \n```\nthis.Content = lblMain;\n```\n\n之前的归属过程是可能的，因为该类继承自 Label 类 View，它代表一个通用视图显示接口概念。由于\
    \ Content 属性也是 View 类型，因此此归属是可能的。MainPage.cs 文件的内容将类似于以下内容：\n\n```\nusing Xamarin.Forms;\n\
    \nnamespace SimpleTextApp\n{\n    class MainPage: ContentPage\n    {\n    public\
    \ MainPage ()\n        {\n    Label lblMain = new Label ();\n    lblMain.Text\
    \ = \"Welcome to moaml Academy!\";\n\n    this.Content = lblMain;\n        }\n\
    \    }\n}\n```\n\n就这样！现在我们必须做最后的一个小步骤，即让我们的应用程序作为 MainPage 文件 App.cs 的一部分创建我们类的一个新对象。导航到此文件（位于项目\
    \ SimpleTextApp（便携式）内并确保是类 App 的构建器在以下图上：\n\n```\npublic App ()\n{\n// The root\
    \ page of your application\nMainPage = new MainPage ();\n}\n```\n\n现在按 F5 键执行应用程序，以获得类似以下形状的界面：\n\
    \n**Welcome to moaml Academy!**\n\n## 小\n\n大家好！\n\n插入的内容要能正常显示才是比较好的。\n\n这是第二行内容。\n\
    \n请注意我删除了 lblMain 变量，因为我们直接将 Label 对象分配给 Content 属性。\n\n### 应用的额外优势：\n\n你会注意到从之前的应用程序中，贴纸出现在窗口左上角。我们将使其出现在屏幕中央。为此应设置两个形容词属性：\n\
    HorizontalOptions（用于水平对齐选项）和 VerticalOptions（用于垂直对齐选项）。这两个属性的类型均为 LayoutOptions，这是一个存在于命名空间\
    \ Xamarin.Forms 内的结构体结构。该结构包含几个现成的字段，对标签的水平和垂直定位选项非常有用，这些选项非常重要，我们将在本系列的后面看到。让我们现在对\
    \ MainPage 类构建器内的标签进行必要的修改。MainPage.cs 文件的内容将如下所示：\n\n```\nusing Xamarin.Forms;\n\
    \nnamespace SimpleTextApp\n{\nclass MainPage: ContentPage\n{\npublic MainPage\
    \ ()\n{\nthis.Content = new Label {\nText = \"Welcome to Hsoub Academy!\",\nHorizontalOptions\
    \ = LayoutOptions.Center,\nVerticalOptions = LayoutOptions.Center\n};\n}\n}\n\
    }\n```\n\n"
