    \            Title = \"Modal Page\";\n            Button goBackButton = new Button\n\
    \            {\n                Text = \"Back to Main\",\n                HorizontalOptions\
    \ = LayoutOptions.Center,\n                VerticalOptions = LayoutOptions.Center\n\
    \            };\n\n            goBackButton.Clicked += async (sender, args) =>\n\
    \            {\n                await Navigation.PopModalAsync();\n          \
    \  };\n\n            Content = goBackButton;\n        }\n    }\n}\n```\n\n然后导航到\
    \ ModelessPage.cs 文件并确保其内容如下：\n\n```csharp\nusing Xamarin.Forms;\n\nnamespace\
    \ ModelessAndModal\n{\n    public class ModelessPage : ContentPage\n    {\n  \
    \      public ModelessPage()\n        {\n            Title = \"Modeless Page\"\
    ;\n            Button goBackButton = new Button\n            {\n             \
    \   Text = \"Back to Main\",\n                HorizontalOptions = LayoutOptions.Center,\n\
    \                VerticalOptions = LayoutOptions.Center\n            };\n\n  \
    \          goBackButton.Clicked += async (sender, args) =>\n            {\n  \
    \              await Navigation.PopAsync();\n            };\n\n            Content\
    \ = goBackButton;\n        }\n    }\n}\n```\n\n前面两个页面的内容是相同的。每个页面都有一个名为 goBackButton\
    \ 的按钮，旨在返回到上一个页面（导致当前页面出现）。前两个页面上的两个点击事件处理程序之间只有一个细微差别。对于 modal 页面，使用了 Navigation.PopModalAsync\
    \ 调用返回到上一个页面。对于 modeless 页面，使用了 Navigation.PopAsync 返回到上一个页面。执行程序时的另一个区别是，如果你从主页移动到\
    \ ModelessPage 页面，页面标题将出现在顶部，并带有允许我们返回到上一个页面的小箭头。当你从主页转到 ModalPage 页面时，页面的标题将永远不会出现（尽管\
    \ Title 属性已设置为它）。返回到上一个页面的唯一方法是通过点击页面上的返回按钮或点击操作系统提供的返回按钮。尝试该应用并查看两个页面之间的差异。\n\
    \n## Conclusion\n\n在本课中，我们讨论了如何在 Android 应用中在页面之间导航，这当然是一个重要主题。我们确定了 modal 和 modeless\
    \ 页面之间的区别。我们还学习了如何通过将主页面创建为 NavigationPage 来创建主页面，这是页面之间转换中的主要构建块。\n\n## Chapter\
    \ VIII\n\n### Engineering Transformations\n\nTransforms 是图形编程世界中必不可少的数学概念。有三种工程变换类型：\n\
    \n- **Translation**\n- **Rotation**\n- **Scaling**\n\n几何变换主要基于矩阵。它们是任何几何变换的支柱的重要数学结构。幸运的是，Xamarin\
    \ 简化了这一点，使其易于使用。\n\n"
