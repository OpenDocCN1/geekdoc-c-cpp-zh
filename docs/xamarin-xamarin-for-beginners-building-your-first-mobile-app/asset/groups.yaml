    接口通常用于当我们想要提取抽象并将其公开时，这极大地有益于使软件代码更易于理解和重用。这就是为什么这个接口被添加到 Abstract 文件夹中。接口不包含任何软件代码，如我们所知，它包含的只是任何希望实现该接口的类必须满足的依赖契约。这个接口简要包含我们的应用完成任务所需的基本操作：按姓名和昵称获取联系人\
