    \ lambdas。MainPage 类中另一个值得注意的是 Title 属性被设置（第 9 行）。事实上，在我们迄今为止在本系列中创建的所有程序中，此功能都没有任何意义。设置此属性与否不会有任何区别！这里的新内容是如何创建\
