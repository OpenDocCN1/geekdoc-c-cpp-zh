    Aspect specifies how the image is displayed within the Image element. They accept
    values from the Aspect of the same name. This number has three elements: AspectFit,
    AspectFill and Fill. In this application we used the AspectFit value which is
    the default value. Here''s what the three previous values mean:


    +   * AspectFit: means that the image will appear within the element so that it
    is consistent with the space allocated to it, while respecting the aspect ratio
    of the image appearance.

    +   * AspectFill: In this case the image will appear within the element so that
    the aspect ratio of the image will be respected, but it will not take care of
    the space allocated to this element. Therefore, the image may appear truncated
    if it is larger than the element.

    +   * Fill: This value means that the image will appear to occupy the entire area
    allocated to the object without regard to the aspect ratio of the image. So just
    the image appears stretched horizontally or vertically. You have assigned Color.Accent
    to the BackgroundColor property of the image element in order to see the actual
    space occupied by that element. Run the previous program using F5 to get a look
    similar to the following, noting that I''m testing on a device with a 4.5-inch
    screen, so the results you get on your device may vary if you have a larger screen.
    If so, I recommend deleting the "? Width = 800" section of the image''s Uri title
    from the Source property:'
