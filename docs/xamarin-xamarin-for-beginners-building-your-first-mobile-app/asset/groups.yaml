    2015 development environment, and are passionate about learning how to program
    mobile apps using Xamarin, this series is definitely for you. Here at the Hassoub
    Academy we have a C-Sharp educational series that can be used.


    # Need for Xamarin


    The need for Xamarin has arisen because of the nature of mobile applications and
    their work on different operating systems from competing companies. There are
    currently three different operating systems dominating the market: iOS for Apple,
    Android for Google, and Windows Phone for Microsoft. These systems differ in many
    respects, which we will discuss below.


    # User experience


    For the user experience there is a similarity in these systems in terms of providing
    the graphical user interfaces and interacting with the device through touch or
    multi-touch, but there are differences in the details. Each operating system has
    different ways of navigating application pages, presenting data, working with
    menus, and other details that require a developer to take a different approach
    for each operating system.


    # Development environments and different programming languages


    For programming languages and development environments, this is another matter.
    Each operating system has its own requirements, which I quickly summarize as follows:


    +   - To create applications on iOS you need to master the Objective-C programming
    language or the Swift programming language. And own a MacBook (any version) with
    the Xcode development environment.

    +   - To create applications on Android you will need Java with the Android Studio
    development environment running on many operating systems.

    +   - To create applications running on Windows Phone or Windows 10 Mobile, you
    need the C # programming language with a computer running Windows,'
  - '[PAGE 9]


    and the Visual Studio development environment.


    # Different programming interfaces


    All previous operating systems rely on different APIs. However, there are some
    similarities for user-interface objects. For example, all previous systems provide
    a way for the user to choose a Boolean logical state that can be represented as
    True or False. In iOS, this object is classified as a view named UISwitch, in
    Android it is a widget called Switch, and in Windows it is called ToggleSwitch.


    # The solution provided by Xamarin


    All of the above points can be bypassed by Xamarin because it provides a single
    programming language, C-Sharp, that can be used to write applications on any operating
    system. It also provides a single advanced development environment, Visual Studio
    2015, for writing these applications (the Xamarin Studio development environment
    can also be used for Mac). In addition, it unified the various APIs into a single
    developer interface.


    The C-Sharp language is defenseless. It is a strong, flexible, very rich and enduring
    language. It has truly become one of the most advanced and modern programming
    languages. We are not here to prefer a programming language over another, but
    in my personal experience, and to know many other programming languages, you can
    say that Sea Sharp occupies a prominent position among them.


    For a specific application, developers can write one common code for all previous
    operating systems without any modifications to them in terms of business logic
    within the application and the software operations that are not related to the
    type of mobile device or operating system it is running on. We call this code
    independent of platform independent. If the application is required to handle
    the hard hardware of the device it is working on (such as a camera or a GPS sensor),
    then you can write parts of the code that take into account the specificity of
    each operating system, we call such code as the code associated with the platform
    dependent operating system.'
