    > "Programming isn''t about what you know; it''s about what you can figure out."
    - *Chris Pine*


    ## Introduction


    Xamarin 平台目前是可用的最重要的移动应用程序开发平台之一，似乎始终保持在时代前沿，尤其是在微软公司收购之后，该公司也拥有相同的名称 Xamarin。你可能有动力进入移动应用开发世界
    并且准备直接编写代码，但请稍有耐心，了解入门知识，以及 Xamarin 的工作原理，在本文中会更好地解释，这篇文章是系列的第一篇，将指导你如何使用 Xamarin
    平台开发应用程序并通过它们创建实用应用程序。


    Xamarin 发音为 Zamarin，于 2011 年由设计 Mono 项目的同一批工程师创立。Mono Brothers 项目如 Mono for android
    和 Mono Touch 是在 Linux、Android 和 iOS 操作系统上分别运行用 C# 编写的应用程序的平台。有了 Xamarin，你可以用一种非官方支持的编程语言为
    Android、iOS、Mac 和 Windows 创建原生 Native Apps。在本系列中，我们将专注于构建 Android 应用。


    ## Whose series?


    如果你对 C Sharp 和 DotNet 框架中的 BCL 有很好的熟悉度，以及对如何使用 Visual Studio 2015 开发环境的基本知识，并且热衷于学习如何使用
    Xamarin 编程移动应用，那么本系列绝对适合你。在 Hassoub Academy，我们有一个 C-Sharp 教育系列可以使用。


    ## Need for Xamarin


    Xamarin 的需求出现是因为移动应用程序的性质及其在不同竞争公司操作系统的运行。目前有三种不同的操作系统主导市场：Apple 的 iOS、Google
    的 Android，以及 Microsoft 的 Windows Phone。这些系统在许多方面存在差异，我们将在下面讨论。


    ## User experience


    对于用户体验而言，这些系统在提供图形用户界面和通过触摸或多点触控与设备交互方面具有相似性，但在细节上存在差异。每个操作系统都有不同的方式来导航应用程序页面、呈现数据、处理菜单以及其他细节，这要求开发人员针对每个操作系统采取不同的方法。


    ## Development environments and different programming languages


    对于编程语言和开发环境，这是另一回事。每个操作系统都有自己的要求，我简要总结如下：


    - 要在 iOS 上创建应用程序，你需要掌握 Objective-C 编程语言或 Swift 编程语言。并且拥有一台 MacBook 任何版本 以及 Xcode
    开发环境。

    - 要在 Android 上创建应用程序，你需要 Java 以及可在许多操作系统上运行的 Android Studio 开发环境。

    - 要创建在 Windows Phone 或 Windows 10 Mobile 上运行的应用程序，你需要 C# 编程语言、运行 Windows 的计算机，以及
    Visual Studio 开发环境。


    ## Different programming interfaces


    所有先前的操作系统都依赖于不同的 API。然而，对于用户界面对象存在一些相似性。例如，所有先前的系统都为用户提供选择布尔逻辑状态的方式，可表示为 True
    或 False。在 iOS 中，该对象被归类为名为 UISwitch 的视图，在 Android 中它是名为 Switch 的小部件，在 Windows 中它被称为
    ToggleSwitch。


    ## The solution provided by Xamarin


    上述所有要点都可以通过 Xamarin 来绕过，因为它提供了一种单一的编程语言 C-Sharp，可用于在任何操作系统上编写应用程序。它还提供了一个单一的高级开发环境
    Visual Studio 2015 来编写这些应用程序 也可使用 Xamarin Studio 开发环境用于 Mac。此外，它将各种 API 统一为单一的开发者接口。


    C-Sharp 语言是无防御的。它是一种强大、灵活、非常丰富且持久的语言。它已真正成为最先进和现代的编程语言之一。我们并非在这里偏爱一种编程语言胜过另一种，但在我个人经验中，以及了解许多其他编程语言，你可以说
    Sea Sharp 在其中占据了突出地位。


    对于特定应用程序，开发人员可以为所有先前的操作系统编写一个通用代码，无需对它们进行任何修改，涉及应用程序内的业务逻辑以及与移动设备类型或其运行的操作系统无关的软件操作。我们称此代码为独立于平台
    independent。如果应用程序需要处理其工作设备的硬硬件 例如相机或 GPS 传感器，那么你可以编写考虑每个操作系统特性的代码部分，我们称这种代码为与平台
    dependent 操作系统相关联的代码。


    ## The main components of the platform Xamarin


    自成立以来，Xamarin 一直专注于编译器技术。该公司发布了三个核心的 .NET 库集合：Xamarin.Mac、Xamarin.iOS 和 Xamarin.Andorid，它们共同构成了
    Xamarin 平台。这些库允许开发人员为每个受支持的操作系统编写原生应用。


    ## Xamarin models


    在 2014 年，Xamarin 创建了被称为 Xamarin 或 Xamarin Forms 的东西。该平台允许开发人员编写用户界面代码，以便将其直接转换为在
    Android、iOS 和 Windows 上运行的应用程序。事实上，Xamarin Forms 现在支持在运行不同 Windows 版本的设备上通用的通用
    Windows 平台应用程序，如 Windows Phone、Windows 10、Windows 10 Mobile、Windows 8.1 和 Windows
    8.1 Phone。


    在 Visual Studio 中的解决方案架构不会有太大变化，只是先前操作系统的单独项目会显著变小，因为其中代码量很少。在这种情况下，PCL 或 SAP
    项目将包含共享代码，独立于操作系统，如前所述，以及负责显示和处理用户界面的代码。换句话说，Xamarin Forms 允许我们编写一个在不同操作系统上直接工作的单一代码。参见以下图表以了解
    Xamarin Forms 应用程序的工作方式。


    在此情况下，为不同操作系统编写的应用程序完全依赖于 PCL 或 SAP 项目与 API 通信。因此在许多应用程序中，只需编写一个在所有设备上工作的代码即可！除非有必要为特定操作系统编写自定义代码。将来这可能会改变，可能可以编写一个在任何类型的所有设备上工作的单一代码。在本系列中我们将讨论


    '
