    \ to use good methods that contribute to the arrangement and organization of this\
    \ code significantly, many developers prefer to use the other method in the development\
    \ of applications using Xamarin.Forms, which is the use of XAML (code-like XML),\
    \ which allows to separate the user interface from the software code. We will,\
    \ of course, deal with this in future lessons.\n\n## Conclusion\n\nIn this lesson\
    \ we dealt with images in Xamarin.Forms. We discussed the issue from two different\
    \ sides. The first aspect is to download the image from the Internet (and possibly\
    \ from a local network), while the second aspect is to download the image from\
    \ a local source. There is more to talk about in this topic, especially with regard\
    \ to the acquisition of images through the sources of images associated with the\
    \ device platform-specific or more precisely associated with the operating system\
    \ running on the device, which is the Android system in our case. This is similar\
    \ to the method used when working with image sources through Android Studio. We\
    \ will cover this topic later in this book.\n\n## Chapter VII\n\n### Move between\
    \ pages\n\nMobile apps typically consist of separate pages that the user navigates\
    \ to take advantage of the capabilities the app offers. For Android apps, the\
    \ Back button is essential in this navigation. In this tutorial from the Xamarin.Forms\
    \ Android Application Programming Learning Series, we learn how to navigate between\
    \ application pages. First we will talk about the concept of page navigation in\
    \ a single application, and then we will talk about the types of content pages\
    \ used in navigation through a simple practical example.\n\n### The concept of\
    \ navigating between application pages\n\nNavigating between application pages\
    \ is very similar to the principle on which a Stack works. The stack is known\
    \ as a data structure that supports the concept of LIFO (Last In, First Out).\
    \ When you move from page A to page B, page B is pushed to the top of the stack,\
    \ resulting in it appearing to the user. Similarly, when you move from page B\
    \ to page C, page C is pushed to the stack to be shown to the user. When we want\
    \ to return to the original page A, page C is popped and removed from the stack,\
    \ page B will be at the top of the stack (i.e. it will appear to the user), and\
    \ page B will be removed from the stack and page A will be at the top of the stack.\
    \ See the following figure to illustrate this idea:\n\n![](img/affff2e3b09de80cc0ffe811bbf63f5d_74_0.png)\n\
    \n### Modal and Modeless Pages\n"
