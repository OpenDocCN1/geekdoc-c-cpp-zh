    > “当我们想要更改数据保存的位置时，仓库模型的优势将变得明显，因为我们只需要更改仓库类（而不是接口），而应用程序的其他组件保持不变。更准确地说，更改将只在一个地方进行，即在
    App 类内部，我们将更改用来创建分配给 ContactsRepository 属性的对象的类型。”


    ## 结论


