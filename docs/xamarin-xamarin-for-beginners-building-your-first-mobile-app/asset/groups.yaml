  mdcn: "\n\n请注意，LayoutOptions.Center 被分别赋给 HorizontalOptions 和 VerticalOptions，以实现水平和垂直居中。再次运行程序，你会注意到，标签位于屏幕中央，如下图所示：\n\
    \n![](img/affff2e3b09de80cc0ffe811bbf63f5d_20_0.png)\n\n如果你希望标签中的文本使用不同的颜色，比如红色，在这种情况下，请将\
    \ Color.Red 值赋给标签对象的 TextColor 属性。Color 也是 Xamarin.Forms 命名空间中的一个结构。\n\n## 处理文本片段\n\
    \n我们经常需要在屏幕上显示一段文本。这段文本可能来自文档、Web 服务或其他来源。应用程序应该能够处理这种大小的文本。与上一课一样，我们创建了一个名为 TextManipulationApp\
    \ 的新 Blank App（Xamarin.Forms Portable）项目。只保留 TextManipulationApp（Portable）和 TextManipulationApp.Droid\
    \ 项目。\n\n现在我们添加一个新的内容页，但采用与上一课不同且更简洁的方式。右键单击项目（TextManipulationApp（Portable）），选择“添加”，然后在出现的子菜单中选择“新建项”。在出现的窗口左侧选择“跨平台”节点，更新窗口中间部分的内容后，选择文件类型，在底部的“名称”框中，单击“添加”。\n\
    \n![](img/affff2e3b09de80cc0ffe811bbf63f5d_22_0.png)\n\n在 Visual Studio 添加此文件后，其内容将如下所示：\n\
    \n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Reflection.Emit;\nusing System.Text;\n\nusing Xamarin.Forms;\nnamespace\
    \ TextManipulationApp\n{\npublic class ParagraphPage: ContentPage\n{\npublic ParagraphPage\
    \ ()\n{\nContent = new StackLayout\n{\nChildren = {\nnew Label {Text = \"Hello\
    \ ContentPage\"}\n}\n};\n}\n}\n}\n```\n\n这里有一些不必要的命名空间，但目前没什么问题。请注意，ParagraphPage\
    \ 类默认继承自 ContentPage 类，并且 ParagraphPage 类构造函数已就绪，其中包含一个简单的示例。删除该构造函数的内容，让我们开始处理我们的应用程序。我们将创建一个\
    \ Label，其中包含一段阿拉伯语文本片段。将以下代码输入到 ParagraphPage 类构造函数中：\n\n```\nContent = new Label\n\
    {\n```\n\n```\nVerticalOptions = LayoutOptions.Center,\n    Text = \"Xamarin is\
    \ currently one of the most important mobile app development platforms available,\"\
    \ +\n    \"Which seems to stay on the front for not too long,\" +\n    \"Especially\
    \ after Microsoft acquired the company that also has the same name.\" +\n    \"\
    Through this series we will learn to write practical applications by using this\
    \ promising technology.\"\n};\n```\n\n转到 TextManipulationApp（Portable）项目中的 App.cs\
    \ 文件，确保应用类构造函数如下所示：\n\n```\npublic App ()\n{\n// The root page of your application\n\
    MainPage = new ParagraphPage ();\n}\n```\n\n### 使用 F5 运行程序\n\n请注意，所有文本在垂直方向上居中显示。这是因为将\
    \ LayoutOptions.Center 值分配给了 Label 的 VerticalOptions 属性。另请注意，上图中的文本向左对齐，而不是像阿拉伯语文本那样向右对齐。这是因为\
    \ Label 类的 HorizontalTextAlignment 属性（负责标签内文本的水平对齐）在运行程序时会具有默认值 TextAlignment.Start。TextAlignment\
    \ 是一个枚举，包含三个值：Start、Center 和 End。由于移动设备的屏幕在水平方向上分为三个主要区域：Start 对应左侧区域，Center 对应中间（中央）区域，End\
    \ 对应屏幕右侧区域，因此文本将向左对齐而不是向右对齐。如果我们想要将文本向右对齐，只需将 TextAlignment.End 值赋给 HorizontalTextAlignment\
    \ 属性即可，我们稍后将这样做。从上图中还要注意的另一件事是，文本离屏幕边缘太近，几乎贴在了边缘上。解决这个问题很简单：为屏幕边缘添加内边距（Padding），这是一个可以通过编程方式分配给屏幕的小区域，通过它我们可以控制四边的边距空间。现在看看经过所需修改的\
