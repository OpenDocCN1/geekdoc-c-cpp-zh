    # Repository repository form


    As applications grow in size and the tasks required of them are varied, a way
    to organize work within the application is needed. In fact, there are many models
    supported by Xamarin for this purpose, such as the MVVM model that is used effectively
    within Xamarin to organize and separate the parts responsible for the interfaces
    for the parts responsible for the business logic from those responsible for dealing
    with remote or local data servers of various types.


    One of my models that I personally prefer is the Repository which I use extensively
    in all kinds of applications I am working on. It is a beautiful and rational method
    that allows the application to develop smoothly and quickly to work in various
    types of environments, and it is compatible to work with the MVVM model.


    The repository model allows isolating the code responsible for handling data from
    business logic. There are several benefits in this matter, the most important
    of which are:


    +   Organizing the program, and making it more understandable and development.

    +   Development of the data-handling method, without making any changes to the
    program''s logic.

    +   The ability to radically change the type of service we use to store data without
    negligible change in business logic.


