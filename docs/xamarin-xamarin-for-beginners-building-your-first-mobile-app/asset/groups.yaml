    # Conclusion


    In this lesson we discussed how to navigate between pages in Android apps, which
    is of course an important topic. We’ve identified the difference between modal
    and modeless pages. We also learned how to create the master page, which is the
    main building block in the transition between pages, by creating the master page
    to be NavigationPage.


    # Chapter VIII


    # Engineering Transformations


    Transforms are essential mathematical concepts in the world of graphic programming.
    There are three types of engineering conversions:


    +   - **Withdrawal**

    +   - **Rotation**

    +   - **Emulating Scale**


    Geometric conversions are based primarily on matrices. They are important mathematical
    structures that are the backbone of any geometric transformation. Fortunately,
    Xamarin simplifies it and makes it easy to use'
