    # Garbage Collection


    Suppose some memory space becomes reusable because a node is deleted from a list
    or an entire list is deleted from a program. Clearly, we want the space to be
    available for future use. One way to bring this about is to immediately reinsert
    the space into the free-storage list. This is what we will do when we implement
    linked lists by means of linear arrays. However, this method may be too time-consuming
    for the operating system of a computer, which may choose an alternative method,
    as follows.


    The operating system of a computer may periodically collect all the deleted space
    onto the free-storage list. Any technique which does this collection is called
    garbage collection. Garbage collection usually takes place in two steps. First
    the computer runs through all lists, tagging those cells which are currently in
    use, and then the computer runs through the memory, collecting all untagged space
    onto the free-storage list. The garbage collection may take place when there is
    only some minimum amount of space or no space at all left in the free-storage
    list, or when the CPU is idle and has time to do the collection. Generally speaking,
    the garbage collection is invisible to the programmer. Any further discussion
    about this topic of garbage collection lies beyond the scope of this text.


    # Overflow and Underflow


