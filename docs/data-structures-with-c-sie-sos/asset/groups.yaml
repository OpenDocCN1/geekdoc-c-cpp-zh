    ## 2.7 Suppose Module A requires M units of time to be executed, where M is a
    constant. Find the complexity C(n) of each algorithm, where n is the size of the
    input data and b is a positive integer greater than 1.


    ### (a) Algorithm P2.7A:


    1. Repeat for I = 1 to N:

    2. Repeat for J = 1 to N:

    3. Repeat for K = I to N:

    4. Module A.


    [End of Step 3 loop.]

    [End of Step 2 loop.]

    [End of Step 1 loop.]

    5. Exit.


    ### (b) Algorithm P2.7B:


    1. Set J := 1.

    2. Repeat Steps 3 and 4 while J <= N:

    3. Module A.

    4. Set J := B x J.

    [End of Step 2 loop.]

    5. Exit.


    Observe that the algorithms use N for n and B for b.


    (a) Here \( C(n) = \sum_{i=1}^n \sum_{j=1}^n \sum_{k=1}^n M \)


    The number of times \( M \) occurs in the sum is equal to the number of triplets
    \( (i, j, k) \), where \( i, j, k \) are integers from 1 to \( n \) inclusive.
    There are \( n^3 \) such triplets. Hence


    \( C(n) = Mn^3 = O(n^3) \)


    (b) Observe that the values of the loop index J are the powers of \( b \):


    \( 1, b, b^2, b^3, b^4, ... \)


    Therefore, Module A will be repeated exactly \( T \) times, where \( T \) is the
    first exponent such that


    \( b^T > n \)


    Hence, \( T = \lfloor \log_b n \rfloor + 1 \)


    Accordingly, \( C(n) = MT = O(\log_b n) \)


