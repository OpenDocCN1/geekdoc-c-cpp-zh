    ## 局部变量和全局变量


    将计算机程序组织为主程序和各种子程序，从而产生了局部变量和全局变量的概念。通常，每个程序模块包含其自己的变量列表，称为局部变量，只能由给定的程序模块访问。此外，子程序模块可能包含参数，即在子程序及其调用程序之间传输数据的变量。


    ## 示例 2.12


    考虑示例 2.10 中的过程 SWITCH(AAA, BBB)。变量 AAA 和 BBB 是参数；它们用于在过程和调用算法之间传输数据。另一方面，过程中的变量
    TEMP 是局部变量。它仅在过程中“生存”；即，其值只能在过程执行期间被访问和更改。事实上，名称 TEMP 可用于任何其他模块中的变量，使用该名称不会干扰过程
    SWITCH 的执行。


    ## 程序 2.7


    ```c

    /* C implementation of the SWITCH procedure */

    #include <stdio.h>

    #include <conio.h>


    int AAA=10;

    int BBB=20;

    void SWITCH(void);


    void main()

    {

    clrscr();


    printf("AAA = %d BBB = %d",AAA,BBB);

    SWITCH();

    printf("\nAfter calling SWITCH procedure, AAA = %d BBB = %d",AAA,BBB);

    getch();

    }


    void SWITCH(void)

    {

    int TEMP;

    TEMP=AAA;

    AAA=BBB;

    BBB=TEMP;

    return;

    }

    ```


    输出：

    AAA = 10 BBB = 20

    调用 SWITCH 过程后，AAA = 20 BBB = 10


    语言设计者意识到，拥有一些可以被计算机程序中某些甚至所有程序模块访问的变量将很方便。可以被所有程序模块访问的变量称为全局变量，可以被某些程序模块访问的变量称为非局部变量。每种编程语言都有自己声明此类变量的语法。例如，FORTRAN
    使用 COMMON 语句声明全局变量，而 Pascal 使用作用域规则声明全局和非局部变量。


    因此，模块之间相互通信有两种基本方式：


    - 1. 直接，通过定义良好的参数

    - 2. 间接，通过非局部变量和全局变量


    一个模块对另一个模块中变量值的间接更改称为副作用。读者在使用非局部变量和全局变量时应非常小心，因为由副作用引起的错误可能难以检测。


