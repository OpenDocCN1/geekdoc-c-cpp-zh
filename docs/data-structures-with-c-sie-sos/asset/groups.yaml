  mdcn: "\n\nRemark: 假设一个文件按社会安全号码数值排序。当新记录插入文件时，数据必须不断移动到新位置，以保持排序顺序。最大限度减少数据移动的一种简单方法是让社会安全号码充当每条记录的地址。不仅在插入记录时不会移动数据，而且可以即时访问任何记录。然而，这种数据存储方法对于仅几百或可能几千条记录，需要十亿（10^9）个内存位置。显然，这种以空间换时间的权衡不值得花费。另一种方法是定义一个从键值集合\
    \ K（社会安全号码）到内存单元地址集合 L 的函数 H。这样的函数 H 称为 *哈希函数*。哈希函数及其属性将在第 9 章中介绍。\n\n## 已解例题\n\
    \n### 基本术语\n\n- 1.1 一位教授保存一份班级名单，包含每位学生的以下数据：\n  - 姓名、专业、学号、考试成绩、最终成绩\n  - (a)\
    \ 列出该名单的实体、属性和实体集。\n  - (b) 描述字段值、记录和文件。\n  - (c) 哪些属性可以作为该名单的主键？\n\n  (a) 每个学生是一个实体，学生的集合是实体集。学生的属性（如姓名、专业等）是属性。\n\
    \n  (b) 字段值是分配给属性的值，即实际的姓名、考试成绩等。每个学生的字段值构成一条记录，所有学生记录的集合构成文件。\n\n  (c) 姓名或学号均可作为主键，因为每个都能唯一确定学生的记录。通常教授使用姓名作为主键，但注册处可能使用学号。\n\
    \n- 1.2 一家医院维护一个患者文件，其中每条记录包含以下数据：\n  - 姓名、入院日期、社会安全号码、房间、床号、医生\n  - (a) 哪些项目可以作为主键？\n\
    \  - (b) 哪一对项目可以作为主键？\n  - (c) 哪些项目可以是组项目？\n\n  (a) 姓名和社会安全号码可以作为主键。（假设没有两名患者姓名相同。）\n\
    \n  (b) 房间和床号的组合也能唯一确定给定的患者。\n\n  (c) 姓名、入院日期和医生可能是组项目。\n\n- 1.3 以下哪些数据项作为记录中的项目包含时，可能导致可变长度记录：(a)\
    \ 年龄，(b) 性别，(c) 配偶姓名，(d) 子女姓名，(e) 教育程度。(f) 前雇主？\n\n由于 (d) 和 (f) 可能包含少量或大量项目，它们可能导致可变长度记录。此外，(e)\
    \ 可能包含许多项目，除非它只询问获得的最高级别。\n\n- 1.4 本教材将仅简要介绍数据库系统。为什么？\n\n“数据库系统”指的是存储在计算机二级存储器中的数据。二级存储器中数据结构的实现和分析与主内存中的非常不同。本教材主要关注主内存中的数据结构，而非二级存储器。\n\
