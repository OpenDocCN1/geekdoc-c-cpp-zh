    ## 弹出栈（Pop Stack）\n\n栈顶数据由 Pop 栈操作返回。随后在调整计数并将其减 1 后删除并回收该节点，函数返回给调用者。注意下溢的报告方式。在语句\
    \ ‘dataOutPtr = NULL’ 中，我们将数据指针设置为 NULL。如果栈为空，则在语句 ‘return dataOutPtr’ 中将数据指针作为\
    \ NULL 返回。代码如下所示：\n\n```\nProgram 6.5\n\nPop Stack: This function is used to pop\
    \ an item on top of stack. STACK is a pointer to a stack. The program is used\
    \ for returning a pointer to the user's data when it is successful. It returns\
    \ a NULL when there is an underflow.\nvoid* popStack (STACK* newstack)\n{\n  \
    \  void* dataOutPtr;\n    STACK_NODE* temp;\n    if (newstack->count == 0)\n \
    \       dataOutPtr = NULL;\n    else\n    {\n        temp = newstack->top;\n \
    \       dataOutPtr = newstack->top->dataPtr;\n        newstack->top = newstack->top->link;\n\
    \        free(temp);\n        (newstack->count)--;\n    }\n    return dataOutPtr;\n\
    }\n```\n\n在这种情况下，需要两个局部指针——一个用于返回给调用者的数据指针，另一个用于释放已删除的节点。它唯一关注的是确保遵循跟踪最后一个节点何时被删除的过程，从而导致栈为空。没有使用特殊逻辑，只是因为最后一个节点有一个空指针，将其赋值给栈顶即表示栈为空，从而自动创建了一个空栈。\n\
    \n因为空指针为假，而带有地址的指针为真，所以我们不需要单独的成功标志——只需返回由新函数分配地址的指针即可。如果内存分配成功，它包含一个地址，即为真。如果分配失败，它包含一个空指针，即为假。\n\
    \n请注意，访问顶部节点的 link 字段需要两级间接寻址。在从栈中删除节点时，pop stack 会释放其内存。\n\n```\nint TOP, AVAIL;\n\
    void PUSH(int);\nint POP(void);\n```\n\n```\nvoid main()\n{\nint i,num,A,B,RESULT;\n\
