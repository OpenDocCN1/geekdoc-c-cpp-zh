    \ 的开头附近，因此 f(n) 会很小。另一方面，如果 W 是 3 字母单词“zoo”，那么 W 可能根本不会出现在 TEXT 中，因此 f(n) 会很大。\n\
    \n上述讨论引出了为特定情况找到复杂性函数 f(n) 的问题。复杂性理论中通常研究的两种情况如下：\n\n- 1. 最坏情况：任何可能输入下 f(n) 的最大值\n\
    - 2. 平均情况：f(n) 的期望值\n\n有时我们也会考虑 f(n) 的最小可能值，称为最佳情况。\n\n平均情况分析假设输入数据具有一定的概率分布；这种假设的一个例子是，输入数据集的所有可能排列都同样可能。平均情况还使用概率论中的以下概念。假设数字\
    \ n1, n2, ..., nk 分别以概率 p1, p2, ..., pk 出现。那么期望或平均值 E 由以下公式给出\n\nE = n1p1 + n2p2\
