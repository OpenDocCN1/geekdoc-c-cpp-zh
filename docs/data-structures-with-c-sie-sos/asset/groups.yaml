    The complexity of this pattern matching algorithm is measured by the number C
    of comparisons between characters in the pattern P and characters of the text
    T. In order to find C, we let Nk denote the number of comparisons that take place
    in the inner loop when P is compared with WK. Then


    C = N1 + N2 + ... + NL


    where L is the position L in T where P first appears or L = MAX if P does not
    appear in T. The next example computes C for some specific P and T where LENGTH(P)
    = 4 and LENGTH(T) = 20 and so MAX = 20 - 4 + 1 = 17.


    # Example 3.11


    +   (a) Suppose P = aaba and T = cdcd ... cd = (cd)10. Clearly P does not occur
    in T. Also, for each of the 17 cycles, Nk = 1, since the first character of P
    does not match Wk, Hence


    C = 1 + 1 + 1 + ... + 1 = 17


    +   (b) Suppose P = aaba and T = ababaaba.... Observe that P is a substring of
    T. In fact, P = W5 and so N5 = 4. Also, comparing P with W1 = abab, we see that
    N1 = 2, since the first letters do match; but comparing P with W2 = baba, we see
    that N2 = 1, since the first letters do not match. Similarly, N3 = 2 and N4 =
    1. Accordingly,


    C = 2 + 1 + 2 + 1 + 4 = 10


    +   (c) Suppose P = aabab and T = aa ... a = a20. Here P does not appear in T.
    Also, every Wk = aaaa; hence every Nk = 4, since the first three letters of P
    do match. Accordingly,


    C = 4 + 4 + ... + 4 = 17 . 4 = 68


    In general, when P is an r-character string and T is an s-character string, the
    data size for the algorithm is


    n = r + s


    The worst case occurs when every character of P except the last matches every
    substring WK, as in Example 3.10(c). In this case, C(n) = r(s - r + 1). For fixed
    n, we have s = n - r, so that


    C(n) = r(n - 2r + 1)


    The maximum value of C(n) occurs when r = (n + 1)/4. (See Problem 3.19.) Accordingly,
    substituting this value for r in the formula for C(n) yields


    C(n) = (n + 1)^2 / 8 = O(n^2)


    The complexity of the average case in any actual situation depends on certain
    probabilities which are usually unknown. When the characters of P and T are randomly
    selected from some finite alphabet, the complexity of the average case is still
    not easy to analyze, but the complexity of the average case is still a factor
    of the worst case. Accordingly, we shall state the following: The complexity of
    this pattern matching algorithm is equal to O(n^2). In other words, the time required
    to execute this algorithm is proportional to n^2. (Compare this result with the
    one on page 3.28.)


    # Second Pattern Matching Algorithm


    The second pattern matching algorithm uses a table which is derived from a particular
    pattern P but is independent of the text T. For definiteness, suppose'
