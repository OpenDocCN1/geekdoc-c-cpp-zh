    is an algorithmic solution with complexity equal to O(n^m) for some m, and it
    is said to be solvable in linear time if there is an algorithmic solution with
    complexity equal to O(n), where n is the size of the data. Thus the second of
    the two pattern matching algorithms described in this section is solvable in linear
