    \sqrt[3]{30} \rceil, \lceil \pi \rceil$。


    (a) 按定义，$\lfloor x \rfloor$ 表示不超过 $x$ 的最大整数，称为 $x$ 的下取整（floor）。因此，

    \(\lfloor 7.5 \rfloor = 7 \quad \lfloor -7.5 \rfloor = -8 \quad \lfloor -18 \rfloor
    = -18\)

    \(\lfloor \sqrt{30} \rfloor = 5 \quad \lfloor \sqrt[3]{30} \rfloor = 3 \quad \lfloor
    \pi \rfloor = 3\)


    (b) 按定义，$\lceil x \rceil$ 表示不小于 $x$ 的最小整数，称为 $x$ 的上取整（ceiling）。因此，

    \(\lceil 7.5 \rceil = 8 \quad \lceil -7.5 \rceil = -7 \quad \lceil -18 \rceil
    = -18\)

    \(\lceil \sqrt{30} \rceil = 6 \quad \lceil \sqrt[3]{30} \rceil = 4 \quad \lceil
    \pi \rceil = 4\)


