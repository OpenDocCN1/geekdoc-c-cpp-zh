    ![](img/f1df4c31f1795198a6843c842acc2216_18_0.png)


    (b) Queue: A queue, also called a first-in first-out (FIFO) system, is a linear
    list in which deletions can take place only at one end of the list, the “front”
    of the list, and insertions can take place only at the other end of the list,
    the “rear” of the list. This structure operates in much the same way as a line
