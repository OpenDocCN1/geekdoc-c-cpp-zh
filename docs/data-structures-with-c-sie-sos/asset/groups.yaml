    \ %d and address is %16lu\\n\",x[i],&x[i]);\n    }\n}\n}\n```\n\nIn the above\
    \ program, the function ‘printarray’ is used to print values of each element in\
    \ the array ‘array’. To print the value and address of all the elements and its\
