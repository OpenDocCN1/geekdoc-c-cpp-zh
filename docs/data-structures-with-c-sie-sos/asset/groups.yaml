    # ## Mathematical Notations and Functions


    2.1 Find (a) $\lfloor 7.5 \rfloor, \lfloor -7.5 \rfloor, \lfloor -18 \rfloor,
    \lfloor \sqrt{30} \rfloor, \lfloor \sqrt[3]{30} \rfloor, \lfloor \pi \rfloor$;
    and (b) $\lceil 7.5 \rceil, \lceil -7.5 \rceil, \lceil -18 \rceil, \lceil \sqrt{30}
    \rceil, \lceil \sqrt[3]{30} \rceil, \lceil \pi \rceil$.


    (a) By definition, $\lfloor x \rfloor$ denotes the greatest integer that does
    not exceed $x$, called the floor of $x$. Hence,

    \(\lfloor 7.5 \rfloor = 7 \quad \lfloor -7.5 \rfloor = -8 \quad \lfloor -18 \rfloor
    = -18\)

    \(\lfloor \sqrt{30} \rfloor = 5 \quad \lfloor \sqrt[3]{30} \rfloor = 3 \quad \lfloor
    \pi \rfloor = 3\)


    (b) By definition, $\lceil x \rceil$ denotes the least integer that is not less
    than $x$, called the ceiling of $x$. Hence,

    \(\lceil 7.5 \rceil = 8 \quad \lceil -7.5 \rceil = -7 \quad \lceil -18 \rceil
    = -18\)

    \(\lceil \sqrt{30} \rceil = 6 \quad \lceil \sqrt[3]{30} \rceil = 4 \quad \lceil
    \pi \rceil = 4\)


    2.2 (a) Find $26 \pmod 7, 34 \pmod 8, 2345 \pmod 6, 495 \pmod 11$.

    (b) Find $-26 \pmod 7, -2345 \pmod 6, -371 \pmod 8, -39 \pmod 3$.

    (c) Using arithmetic modulo 15, evaluate $9 + 13, 7 + 11, 4 - 9, 2 - 10$.


    (a) Since $k$ is positive, simply divide $k$ by the modulus $M$ to obtain the
    remainder $r$. Then $r = k \pmod M$

    Thus

    \(5 = 26 \pmod 7 \quad 2 = 34 \pmod 8 \quad 5 = 2345 \pmod 6 \quad 0 = 495 \pmod
    11\)


    (b) When $k$ is negative, divide $|k|$ by the modulus to obtain the remainder
    $r''$. Then $k \equiv -r'' \pmod M$. Hence $k \pmod M = M - r''$ when $r'' \neq
    0$. Thus

    \(-26 \pmod 7 = 7 - 5 = 2 \quad -371 \pmod 8 = 8 - 3 = 5\)

    \(-2345 \pmod 6 = 6 - 5 = 1 \quad -39 \pmod 3 = 0\)


    (c) Use $a \pm M \equiv a \pmod M$:

    \(9 + 13 = 22 \equiv 22 - 15 = 7 \quad 7 + 11 = 18 \equiv 18 - 15 = 3\)

    \(4 - 9 = -5 \equiv -5 + 15 = 10 \quad 2 - 10 = -8 \equiv -8 + 15 = 7\)


