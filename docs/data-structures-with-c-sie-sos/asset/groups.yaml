    in line is the first person to board the bus. Another analogy is with automobiles
    waiting to pass through an intersection—the first car in line is the first car
    through.


    (c) Graph: Data sometimes contain a relationship between pairs of elements which
    is not necessarily hierarchical in nature. For example, suppose an airline flies
    only between the cities connected by lines in Fig. 1.10(c). The data structure
