    \ First\n    03 Middle Initial\n  02 Address\n    03 Street\n    03 Area\n   \
    \   04 City\n      04 State\n      04 ZIP\n  02 Age\n  02 Salary\n  02 Dependents\n\
    ```\n\n图 1.8\n\n### 示例 1.5 代数表达式\n\n考虑代数表达式\n\n$(2x + y)(a - 7b)^3$\n\n使用垂直箭头（↑）表示乘方，使用星号（*）表示乘法，我们可以用图\
    \ 1.9 中的树来表示该表达式。请注意，图中反映了运算执行的顺序：乘方必须在减法之后进行，树顶部的乘法必须最后执行。\n\n除了数组、链表和树之外，还有我们将学习的其他数据结构。下面简要描述其中一些结构。\n\
    \n- (a) 栈：栈，也称为后进先出（LIFO）系统，是一个线性列表，其中插入和删除只能在一端进行，称为栈顶。该结构的操作类似于弹簧系统上的一叠盘子，如图\
    \ 1.10(a) 所示。请注意，新盘子只能插入到栈顶，盘子只能从栈顶删除。\n\n![](img/f1df4c31f1795198a6843c842acc2216_18_0.png)\n\
    \n- (b) 队列：队列，也称为先进先出（FIFO）系统，是一个线性列表，其中删除只能在列表的一端进行，即列表的“前端”，而插入只能在列表的另一端进行，即列表的“后端”。该结构的操作方式与公交车站等待上车的人排队非常相似，如图\
    \ 1.10(b) 所示：排队的第一个人是第一个上车的人。另一个类比是等待通过路口的汽车——排队的第一辆车是第一辆通过的车。\n\n- (c) 图：数据有时包含元素对之间的关系，这种关系不一定是层次性的。例如，假设一家航空公司只在图\
    \ 1.10(c) 中线条连接的城市之间飞行。反映这种关系的数据结构称为图。图将在第 8 章中正式定义和研究。\n\n![](img/f1df4c31f1795198a6843c842acc2216_18_1.png)\n\
    \n![](img/f1df4c31f1795198a6843c842acc2216_18_2.png)\n\n![](img/f1df4c31f1795198a6843c842acc2216_18_3.png)\n\
    \n图 1.10\n\n备注：数据结构的元素有许多不同的名称。一些常用的名称有“数据元素”（data element）、“数据项”（data item）、“项集合”（item\
    \ aggregate）、“记录”（record）、“节点”（node）和“数据对象”（data object）。使用的特定名称取决于数据结构的类型、结构使用的上下文以及使用名称的人。我们将偏好使用“数据元素”术语，但在讨论文件时将使用“记录”术语，在讨论链表、树和图时将使用“节点”术语。\n\
    \n## 1.4 数据结构操作\n\n我们的数据结构中的数据通过某些操作进行处理。事实上，为给定情况选择的特定数据结构很大程度上取决于执行特定操作的频率。本节向读者介绍其中一些最常用的操作。\n\
    \n以下四项操作在本文中起着主要作用：\n\n- 1. 遍历：恰好访问每条记录一次，以便可以处理记录中的某些项目。（这种访问和处理有时称为“访问”记录。）\n\
    - 2. 搜索：查找具有给定键值的记录的位置，或查找满足一个或多个条件的所有记录的位置。\n- 3. 插入：向结构中添加新记录。\n- 4. 删除：从结构中删除记录。\n\
    \n有时在给定情况下可能会使用两个或多个操作；例如，我们可能想要删除具有给定键的记录，这可能意味着我们首先需要搜索记录的位置。\n\n还将考虑以下两项在特殊情况下使用的操作：\n\
    \n- 1. 排序：将记录按某种逻辑顺序排列（例如，按某个 NAME 键的字母顺序，或按某个 NUMBER 键的数值顺序，如社会安全号码或账户号码）\n-\
    \ 2. 合并：将两个不同排序文件中的记录合并为一个排序文件\n\n其他操作，例如复制和连接，将在本文后面讨论。\n\n### 示例 1.6\n\n一个组织包含一个会员文件，其中每条记录包含给定会员的以下数据：\n\
    姓名、地址、电话号码、年龄、性别\n\n- (a) 假设组织希望通过邮件宣布一次会议。那么将遍历文件以获取每个会员的姓名和地址。\n- (b) 假设有人想查找居住在某个区域的所有会员的姓名。同样，将遍历文件以获取数据。\n\
    - (c) 假设有人想获取给定姓名的地址。那么将搜索文件以查找包含该姓名的记录。\n- (d) 假设有新人加入组织。那么将插入其记录到文件中。\n- (e)\
    \ 假设一名会员去世。那么将从文件中删除其记录。\n- (f) 假设一名会员搬家并有了新地址和电话号码。给定会员的姓名，首先需要在文件中搜索该记录。然后执行“更新”——即，用新数据更改记录中的项目。\n\
    - (g) 假设有人想查找年龄在 65 岁或以上的会员人数。同样，将遍历文件，统计此类会员。\n\n"
