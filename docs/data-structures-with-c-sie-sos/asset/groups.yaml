    # Complexity; Space-Time Tradeoffs


    1.13 Briefly describe the notions of (a) the complexity of an algorithm and (b)
    the space-time tradeoff of algorithms.


    (a) The complexity of an algorithm is a function f(n) which measures the time
    and/or space used by an algorithm in terms of the input size n.


    (b) The space-time tradeoff refers to a choice between algorithmic solutions of
    a data processing problem that allows one to decrease the running time of an algorithmic
    solution by increasing the space to store the data and vice versa.


    1.14 Suppose a data set S contains n elements.


    (a) Compare the running time T1 of the linear search algorithm with the running
    time T2 of the binary search algorithm when (i) n = 1000 and (ii) n = 10 000.


    (b) Discuss searching for a given item in S when S is stored as a linked list.


    (a) Recall (Sec. 1.5) that the expected running of the linear search algorithm
    is f(n) = n/2 and that the binary search algorithm is f(n) = log2 n. Accordingly,
    (i) for n = 1000, T1 = 500 but T2 = log2 1000 ≈ 10; and (ii) for n = 10 000, T1
    = 5000 but T2 = log2 10 000 ≈ 14.


    (b) The binary search algorithm assumes that one can directly access the middle
    element in the set S. But one cannot directly access the middle element in a linked
    list. Hence one may have to use a linear search algorithm when S is stored as
    a linked list.


    1.15 Consider the data in Fig. 1.19, which gives the different flights of an airline.
    Discuss different ways of storing the data so as to decrease the time in executing
    the following:


    (a) Find the origin and destination of a flight, given the flight number.


    (b) Given city A and city B, find whether there is a flight from A to B, and if
    there is, find its flight number.'
