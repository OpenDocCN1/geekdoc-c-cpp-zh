    \ as P and beginning with the Kth character of T. First we compare P, character\
    \ by character, with the first substring, W_1. If all the characters are the same,\
    \ then P = W_1 and so P appears in T and INDEX(T, P) = 1. On the other hand, suppose\
    \ we find that some character of P is not the same as the corresponding character\
    \ of W_1. Then P != W_1 and we can immediately move on to the next substring,\
    \ W_2. That is, we next compare P with W_2. If P != W_2, then we compare P with\
    \ W_3, and so on. The process stops (a) when we find a match of P with some substring\
    \ W_K and so P appears in T and INDEX(T, P) = K, or (b) when we exhaust all the\
    \ W_K's with no match and hence P does not appear in T. The maximum value MAX\
    \ of the subscript K is equal to LENGTH(T) - LENGTH(P) + 1.\n\nLet us assume,\
    \ as an illustration, that P is a 4-character string and that T is a 20-character\
    \ string, and that P and T appear in memory as linear arrays with one character\
    \ per element. That is,\n\nP = P[1]P[2]P[3]P[4] and T = T[1]T[2]T[3] ... T[19]T[20]\n\
