    # ## 2.2 MATHEMATICAL NOTATIONS AND FUNCTIONS


    This section gives various mathematical functions which appear very often in the
    analysis of algorithms and in computer science in general, together with their
    notation.


    # ### Floor and Ceiling Functions


    Let x be any real number. Then x lies between two integers called the floor and
    the ceiling of x. Specifically,


    ⌊x⌋, called the _floor_ of x, denotes the greatest integer that does not exceed
    x.

    ⌈x⌉, called the _ceiling_ of x, denotes the least integer that is not less than
    x.

    If x is itself an integer, then ⌊x⌋ = ⌈x⌉; otherwise ⌊x⌋ + 1 = ⌈x⌉.


    **Example 2.1**


    ⌊3.14⌋ = 3, ⌊√5⌋ = 2, ⌊-8.5⌋ = -9, ⌊7⌋ = 7

    ⌈3.14⌉ = 4, ⌈√5⌉ = 3, ⌈-8.5⌉ = -8, ⌈7⌉ = 7


    # ### Remainder Function; Modular Arithmetic


    Let k be any integer and let M be a positive integer. Then

    k (mod M)

    (read k _modulo_ M) will denote the integer remainder when k is divided by M.
    More exactly,

    k (mod M) is the unique integer r such that'
  - '[PAGE 33]


    k = Mq + r \quad \text{where} \quad 0 \le r < M


    When k is positive, simply divide k by M to obtain the remainder r. Thus


    25 (mod 7) = 4, \quad 25 (mod 5) = 0, \quad 35 (mod 11) = 2, \quad 3 (mod 8) =
    3


    Problem 2.2(b) shows a method to obtain k (mod M) when k is negative.


    The term “mod” is also used for the mathematical congruence relation, which is
    denoted and defined as follows:


    a \equiv b (mod M) \quad \text{if and only if} \quad M \text{ divides } b - a


    M is called the *modulus*, and a \equiv b (mod M) is read “a is congruent to b
    modulo M.” The following aspects of the congruence relation are frequently useful:


    0 \equiv M (mod M) \quad \text{and} \quad a \pm M \equiv a (mod M)


    *Arithmetic modulo M* refers to the arithmetic operations of addition, multiplication
    and subtraction where the arithmetic value is replaced by its equivalent value
    in the set


    {0, 1, 2, ..., M - 1}


    or in the set


    {1, 2, 3, ..., M}


    For example, in arithmetic modulo 12, sometimes called “clock” arithmetic,


    6 + 9 \equiv 3, \quad 7 \times 5 \equiv 11, \quad 1 - 5 \equiv 8, \quad 2 + 10
    \equiv 0 \equiv 12


    (The use of 0 or M depends on the application.)


    # **Integer and Absolute Value Functions**


    Let x be any real number. The *integer value* of x, written INT(x), converts x
    into an integer by deleting (truncating) the fractional part of the number. Thus


    INT(3.14) = 3, \quad INT (\sqrt{5} ) = 2, \quad INT( -8.5) = -8, \quad INT(7)
    = 7


    Observe that INT(x) = \lfloor x \rfloor or INT(x) = \lceil x \rceil according
    to whether x is positive or negative.


    The *absolute value* of the real number x, written ABS(x) or |x|, is defined as
    the greater of x or -x. Hence ABS(0) = 0, and, for x \neq 0, ABS(x) = x or ABS(x)
    = -x, depending on whether x is positive or negative. Thus


    |-15| = 15, \quad |7| = 7, \quad |-3.33| = 3.33, \quad |4.44| = 4.44, \quad |-0.075|
    = 0.075


    We note that |x| = |-x| and, for x \neq 0, |x| is positive.


    # **Summation Symbol; Sums**


    Here we introduce the summation symbol \Sigma (the Greek letter sigma). Consider
    a sequence a_1, a_2, a_3, .... Then the sums


    a_1 + a_2 + \cdots + a_n \quad \text{and} \quad a_m + a_{m+1} + \cdots + a_n


    will be denoted, respectively, by


    \sum_{j=1}^n a_j \quad \text{and} \quad \sum_{j=m}^n a_j'
  - '[PAGE 34]


    The letter j in the above expressions is called a dummy index or dummy variable.
    Other letters frequently used as dummy variables are i, k, s and t.


    # Example 2.2


    \sum_{i=1}^{n} a_i b_j = a_1 b_1 + a_2 b_2 + \cdots + a_n b_n


    \sum_{j=2}^{5} j^2 = 2^2 + 3^2 + 4^2 + 5^2 = 4 + 9 + 16 + 25 = 54


    \sum_{j=1}^{n} j = 1 + 2 + \cdots + n


    The last sum in Example 2.2 will appear very often. It has the value n(n + 1)/2.
    That is,


    1 + 2 + 3 + \cdots + n = \frac{n(n+1)}{2}


    Thus, for example,


    1 + 2 + \cdots + 50 = \frac{50(51)}{2} = 1275


    # Factorial Function


    The product of the positive integers from 1 to n, inclusive, is denoted by n!
    (read “n factorial”). That is,


    n! = 1 \cdot 2 \cdot 3 \cdots (n-2)(n-1)n


    It is also convenient to define 0! = 1.


    # Example 2.3


    (a) 2! = 1 \cdot 2 = 2; 3! = 1 \cdot 2 \cdot 3 = 6; 4! = 1 \cdot 2 \cdot 3 \cdot
    4 = 24


    (b) For n > 1, we have n! = n \cdot (n − 1)! Hence

    5! = 5 \cdot 4! = 5 \cdot 24 = 120; 6! = 6 \cdot 5! = 6 \cdot 120 = 720


    # Permutations


    A permutation of a set of n elements is an arrangement of the elements in a given
    order. For example, the permutations of the set consisting of the elements a,
    b, c are as follows:


    abc, acb, bac, bca, cab, cba


    One can prove: There are n! permutations of a set of n elements. Accordingly,
    there are 4! = 24 permutations of a set with 4 elements, 5! = 120 permutations
    of a set with 5 elements, and so on.'
  - '[PAGE 35]


    # Exponents and Logarithms


    Recall the following definitions for integer exponents (where m is a positive
    integer):


    ```

    a^m = a \cdot a \cdots a (m \text{ times}), \quad a^0 = 1, \quad a^{-m} = \frac{1}{a^m}

    ```


    Exponents are extended to include all rational numbers by defining, for any rational
    number m/n,


    ```

    a^{m/n} = \sqrt[n]{a^m} = (\sqrt[n]{a})^m

    ```


    For example,


    ```

    2^4 = 16, \quad 2^{-4} = \frac{1}{2^4} = \frac{1}{16}, \quad 125^{2/3} = 5^2 =
    25

    ```


    In fact, exponents are extended to include all real numbers by defining, for any
    real number x,


    ```

    a^x = \lim_{r \to x} a^r \quad \text{where } r \text{ is a rational number}

    ```


    Accordingly, the exponential function f(x) = a^x is defined for all real numbers.


    Logarithms are related to exponents as follows. Let b be a positive number. The
    logarithm of any positive number x to the base b, written


    ```

    log_b x

    ```


    represents the exponent to which b must be raised to obtain x. That is,


    ```

    y = log_b x \quad \text{and} \quad b^y = x

    ```


    are equivalent statements. Accordingly,


    ```

    log_2 8 = 3 \text{ since } 2^3 = 8; \quad log_{10} 100 = 2 \text{ since } 10^2
    = 100 \\ log_2 64 = 6 \text{ since } 2^6 = 64; \quad log_{10} 0.001 = -3 \text{
    since } 10^{-3} = 0.001

    ```


    Furthermore, for any base b,


    ```

    log_b 1 = 0 \text{ since } b^0 = 1 \\ log_b b = 1 \text{ since } b^1 = b

    ```


    The logarithm of a negative number and the logarithm of 0 are not defined.


    One may also view the exponential and logarithmic functions


    ```

    f(x) = b^x \quad \text{and} \quad g(x) = log_b x

    ```


    as inverse functions of each other. Accordingly, the graphs of these two functions
    are related. (See Solved Problem 2.5.)


    Frequently, logarithms are expressed using approximate values. For example, using
    tables or calculators, one obtains


    ```

    log_{10} 300 = 2.4771 \quad \text{and} \quad log_e 40 = 3.6889

    ```


    as approximate answers. (Here e = 2.718281 ... .)'
  - '[PAGE 36]


    Logarithms to the base 10 (called common logarithms), logarithms to the base e
    (called natural logarithms) and logarithms to the base 2 (called binary logarithms)
    are of special importance. Some texts write:


    | ln x | instead of | log_e x |

    | lg x or Log x | instead of | log_2 x |


    This text on data structures is mainly concerned with binary logarithms. Accordingly,


    > The term log x shall mean log_2 x unless otherwise specified.


    Frequently, we will require only the floor or the ceiling of a binary logarithm.
    This can be obtained by looking at the powers of 2. For example,


    ```

    ⌊log_2 100⌋ = 6 since 2^6 = 64 2^7 = 128

    ⌈log_2 1000⌉ = 10 since 2^9 = 512 and 2^10 = 1024

    ```


    and so on.


    # 2.3 ALGORITHMIC NOTATIONS


    An algorithm, intuitively speaking, is a finite step-by-step list of well-defined
    instructions for solving a particular problem. The formal definition of an algorithm,
    which uses the notion of a Turing machine or its equivalent, is very sophisticated
    and lies beyond the scope of this text. This section describes the format that
    is used to present algorithms throughout the text. This algorithmic notation is
    best described by means of examples.


    # Example 2.4


    An array DATA of numerical values is in memory. We want to find the location LOC
    and the value MAX of the largest element of DATA. Given no other information about
    DATA, one way to solve the problem is as follows:


    Initially begin with LOC = 1 and MAX = DATA[1]. Then compare MAX with each successive
    element DATA[K] of DATA. If DATA[K] exceeds MAX, then update LOC and MAX so that
    LOC = K and MAX = DATA[K]. The final values appearing in LOC and MAX give the
    location and value of the largest element of DATA.


    A formal presentation of this algorithm, whose flow chart appears in Fig. 2.2,
    follows.


    ```

    Algorithm 2.1: (Largest Element in Array) A nonempty array DATA with N numerical
    values is given. This algorithm finds the location LOC and the value MAX of the
    largest element of DATA. The variable K is used as a counter.

    Step 1. [Initialize.] Set K := 1, LOC := 1 and MAX := DATA[1].

    Step 2. [Increment counter.] Set K := K + 1.

    Step 3. [Test counter.] If K > N, then:

    Write: LOC, MAX, and Exit.

    Step 4. [Compare and update.] If MAX < DATA[K], then:

    Set LOC := K and MAX := DATA[K].

    Step 5. [Repeat loop.] Go to Step 2.

    ```'
