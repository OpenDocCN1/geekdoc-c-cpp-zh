    Remark: In C, an array begins with an index value of 0 instead of 1. For instance,
    an array A[10] will have index values 0, 1, 2,....8, 9.


    The format for the formal presentation of an algorithm consists of two parts.
    The first part is a paragraph which tells the purpose of the algorithm, identifies
    the variables which occur in the algorithm and lists the input data. The second
    part of the algorithm consists of the list of steps that is to be executed.


    The following summarizes certain conventions that we will use in presenting our
    algorithms. Some control structures will be covered in the next section.


    # Identifying Number


    Each algorithm is assigned an identifying number as follows: Algorithm 4.3 refers
    to the third algorithm in Chapter 4; Algorithm P5.3 refers to the algorithm in
    Solved Problem 5.3 in Chapter 5. Note that the letter “P” indicates that the algorithm
    appears in a problem.


    # Steps, Control, Exit


    The steps of the algorithm are executed one after the other, beginning with Step
    1, unless indicated otherwise. Control may be transferred to Step n of the algorithm
    by the statement “Go to Step n.” For example, Step 5 transfers control back to
    Step 2 in Algorithm 2.1. Generally speaking, these Go to statements may be practically
    eliminated by using certain control structures discussed in the next section.


    ```

    Set K := 1, LOC := 1 and MAX := DATA[1].

    ```


    then they are executed from left to right.


    The algorithm is completed when the statement

    Exit.

    is encountered. This statement is similar to the STOP statement used in FORTRAN
    and in flowcharts.'
  - '[PAGE 39]


    # Comments


    Each step may contain a comment in brackets which indicates the main purpose of
    the step. The comment will usually appear at the beginning or the end of the step.


    # Variable Names


    Variable names will use capital letters, as in MAX and DATA. Single-letter names
    of variables used as counters or subscripts will also be capitalized in the algorithms
    (K and N, for example), even though lowercase may be used for these same variables
    (k and n) in the accompanying mathematical description and analysis. (Recall the
    discussion of italic and lowercase symbols in Sec. 1.3 of Chapter 1, under “Arrays.”)


    # Assignment Statement


    Our assignment statements will use the dots-equal notation := that is used in
    Pascal. For example,


    ```

    Max := DATA[I]

    ```


    assigns the value in DATA[I] to MAX. In C language, we use the equal sign = for
    this operation.


    # Input and Output


    Data may be input and assigned to variables by means of a Read stateme:. with
    the following form:


    ```

    Read: Variables names.

    ```


    Similarly, messages, placed in quotation marks, and data in variables may be output
    by means of a Write or Print statement with the following form:


    ```

    Write: Messages and/or variable names.

    ```


    # Procedures


    The term “procedure” will be used for an independent algorithmic module which
    solves a particular problem. The use of the word “procedure” or “module” rather
    than “algorithm” for a given problem is simply a matter of taste. Generally speaking,
    the word “algorithm” will be reserved for the solution of general problems. The
    term “procedure” will also be used to describe a certain type of subalgorithm
    which is discussed in Sec. 2.6.


    # 2.4 CONTROL STRUCTURES


    Algorithms and their equivalent computer programs are more easily understood if
    they mainly use self-contained modules and three types of logic, or flow of control,
    called


    +   1. Sequence logic, or sequential flow

    +   2. Selection logic, or conditional flow

    +   3. Iteration logic, or repetitive flow


    These three types of logic are discussed below, and in each case we show the equivalent
    flowchart.'
  - '[PAGE 40]


    # Sequence Logic (Sequential Flow)


    Sequence logic has already been discussed. Unless instructions are given to the
    contrary, the modules are executed in the obvious sequence. The sequence may be
    presented explicitly, by means of numbered steps, or implicitly, by the order
    in which the modules are written. (See Fig. 2.3.) Most processing, even of complex
    problems, will generally follow this elementary flow pattern.


    ![](img/f1df4c31f1795198a6843c842acc2216_40_0.png)


    # Selection Logic (Conditional Flow)


    Selection logic employs a number of conditions which lead to a selection of one
    out of several alternative modules. The structures which implement this logic
    are called conditional structures or If structures. For clarity, we will frequently
    indicate the end of such a structure by the statement


    > [End of If structure.]


    or some equivalent.


    These conditional structures fall into three types, which are discussed separately.


    +   1. Single Alternative. This structure has the form


    ```

    If condition, then:

    [Module A]

    [End of If structure.]

    ```


    The logic of this structure is pictured in Fig. 2.4(a). If the condition holds,
    then Module A, which may consist of one or more statements, is executed; otherwise
    Module A is skipped and control transfers to the next step of the algorithm.


