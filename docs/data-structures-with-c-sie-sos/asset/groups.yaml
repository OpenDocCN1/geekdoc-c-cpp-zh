    # Chapter 1


    # Introduction and Overview


    # 1.1 INTRODUCTION


    This chapter introduces the subject of data structures and presents an overview
    of the content of the text. Basic terminology and concepts will be defined and
    relevant examples provided. An overview of data organization and certain data
    structures will be covered along with a discussion of the different operations
    which are applied to these data structures. Last, we will introduce the notion
    of an algorithm and its complexity, and we will discuss the time-space tradeoff
    that may occur in choosing a particular algorithm and data structure for a given
    problem.


    # 1.2 BASIC TERMINOLOGY; ELEMENTARY DATA ORGANIZATION


    Data are simply values or sets of values. A data item refers to a single unit
    of values. Data items that are divided into subitems are called group items; those
    that are not are called elementary items. For example, an employee''s name may
    be divided into three subitems—first name, middle initial and last name—but the
    social security number would normally be treated as a single item.


    Collections of data are frequently organized into a hierarchy of fields, records
    and files. In order to make these terms more precise, we introduce some additional
    terminology.


    An entity is something that has certain attributes or properties which may be
    assigned values. The values themselves may be either numeric or nonnumeric. For
    example, the following are possible attributes and their corresponding values
    for an entity, an employee of a given organization:


    | Attributes: | Name | Age | Sex | Social Security Number |

    |---|---|---|---|---|

    | Values: | ROHLAND, GAIL | 34 | F | 134-24-5533 |


    Entities with similar attributes (e.g., all the employees in an organization)
    form an entity set. Each attribute of an entity set has a range of values, the
    set of all possible values that could be assigned to the particular attribute.'
  - '[PAGE 12]


    The term “information” is sometimes used for data with given attributes, or, in
    other words, meaningful or processed data.


    The way that data are organized into the hierarchy of fields, records and files
    reflects the relationship between attributes, entities and entity sets. That is,
    a field is a single elementary unit of information representing an attribute of
    an entity, a record is the collection of field values of a given entity and a
    file is the collection of records of the entities in a given entity set.


    Each record in a file may contain many field items, but the value in a certain
    field may uniquely determine the record in the file. Such a field K is called
    a primary key, and the values k1, k2, ... in such a field are called keys or key
    values.


    **Example 1.1**


    (a) Suppose an automobile dealership maintains an inventory file where each record
    contains the following data:


    Serial Number, Type, Year, Price, Accessories


    The Serial Number field can serve as a primary key for the file, since each automobile
    has a unique serial number.


    (b) Suppose an organization maintains a membership file where each record contains
    the following data:


    Name, Address, Telephone Number, Dues Owed


    Although there are four data items, Name and Address may be group items. Here
    the Name field is a primary key. Note that the Address and Telephone Number fields
    may not serve as primary keys, since some members may belong to the same family
    and have the same address and telephone number.


    Records may also be classified according to length. A file can have fixed-length
    records or variable-length records. In fixed-length records, all the records contain
    the same data items with the same amount of space assigned to each data item.
    In variable-length records, file records may contain different lengths. For example,
    student records usually have variable lengths, since different students take different
    numbers of courses. Usually, variable-length records have a minimum and a maximum
    length.


    The above organization of data into fields, records and files may not be complex
    enough to maintain and efficiently process certain collections of data. For this
    reason, data are also organized into more complex types of structures. The study
    of such data structures, which forms the subject matter of this text, includes
    the following three steps:


    +   1. Logical or mathematical description of the structure

    +   2. Implementation of the structure on a computer

    +   3. Quantitative analysis of the structure, which includes determining the
    amount of memory needed to store the structure and the time required to process
    the structure.


    The next section introduces us to some of these data structures.


    Remark: The second and third of the steps in the study of data structures depend
    on whether the data are stored (a) in the main (primary) memory of the computer
    or (b) in a secondary (external) storage unit. This text will mainly cover the
    first case. This means that, given the address of a memory location, the time
    required to access the content of the memory cell does not depend on'
  - '[PAGE 13]


    the particular cell or upon the previous cell accessed. The second case, called
    file management or data base management, is a subject unto itself and lies beyond
    the scope of this text.


    # 1.3 DATA STRUCTURES


    Data may be organized in many different ways; the logical or mathematical model
    of a particular organization of data is called a data structure. The choice of
    a particular data model depends on two considerations. First, it must be rich
    enough in structure to mirror the actual relationships of the data in the real
    world. On the other hand, the structure should be simple enough that one can effectively
    process the data when necessary. This section will introduce us to some of the
    data structures which will be discussed in detail later in the text.


    # Classification of Data Structures


    Data structures are generally classified into primitive and non-primitive data
    structures. Basic data types such as integer, real, character and boolean are
    known as primitive data structures. These data types consist of characters that
    cannot be divided, and hence they are also called simple data types.


    The simplest example of non-primitive data structure is the processing of complex
    numbers. Very few computers are capable of doing arithmetic on complex numbers.
    Linked-lists, stacks, queues, trees and graphs are examples of non-primitive data
    structures. Figure 1.1 shows the classification of data structures.


    ![](img/f1df4c31f1795198a6843c842acc2216_13_0.png)


    Fig. 1.1 Classification of Data Structures


    Based on the structure and arrangement of data, non-primitive data structures
    are further classified into linear and non-linear.


    A data structure is said to be linear if its elements form a sequence or a linear
    list. In linear data structures, the data is arranged in a linear fashion although
    the way they are stored in memory need not be sequential. Arrays, linked lists,
    stacks and queues are examples of linear data structures.


    Conversely, a data structure is said to be non-linear if the data is not arranged
    in sequence. The insertion and deletion of data is therefore not possible in a
    linear fashion. Trees and graphs are examples of non-linear data structures.'
  - '[PAGE 14]


    # Arrays


    The simplest type of data structure is a *linear* (or *one-dimensional*) array.
    By a *linear array*, we mean a list of a finite number $n$ of similar data elements
    referenced respectively by a set of $n$ consecutive numbers, usually 1, 2, 3,
    ..., $n$. If we choose the name $A$ for the array, then the elements of $A$ are
    denoted by subscript notation


    ```

    $a_1, a_2, a_3, ..., a_n$

    ```


    or by the parenthesis notation


    ```

    $A(1), A(2), A(3), ..., A(N)$

    ```


    or by the bracket notation


    ```

    $A[1], A[2], A[3], ..., A[N]$

    ```


    Regardless of the notation, the number $K$ in $A[K]$ is called a *subscript* and
    $A[K]$ is called a *subscripted variable*.


    *Remark:* The parentheses notation and the bracket notation are frequently used
    when the array name consists of more than one letter or when the array name appears
    in an algorithm. When using this notation we will use ordinary uppercase letters
    for the name and subscripts as indicated above by the $A$ and $N$. Otherwise,
    we may use the usual subscript notation of italics for the name and subscripts
    and lowercase letters for the subscripts as indicated above by the $a$ and $n$.
    The former notation follows the practice of computer-oriented texts whereas the
    latter notation follows the practice of mathematics in print.


    # Example 1.2


    A linear array STUDENT consisting of the names of six students is pictured in
    Fig. 1.2. Here STUDENT[1] denotes John Brown, STUDENT[2] denotes Sandra Gold,
    and so on.

    Linear arrays are called one-dimensional arrays because each element in such an
    array is referenced by one subscript. A *two-dimensional array* is a collection
    of similar data elements where each element is referenced by two subscripts. (Such
    arrays are called *matrices* in mathematics, and *tables* in business applications.)
    Multidimensional arrays are defined analogously. Arrays will be covered in detail
    in Chapter 4.


    | | STUDENT |

    |---|---|

    | 1 | John Brown |

    | 2 | Sandra Gold |

    | 3 | Tom Jones |

    | 4 | June Kelly |

    | 5 | Mary Reed |

    | 6 | Alan Smith |


    Fig. 1.2


    # Example 1.3


    A chain of 28 stores, each store having 4 departments, may list its weekly sales
    (to the nearest dollar) as in Fig. 1.3. Such data can be stored in the computer
    using a two-dimensional array in which the first subscript denotes the store and
    the second subscript the department. If SALES is the name given to the array,
    then


    ```

    SALES[1, 1] = 2872, SALES[1, 2] = 805, SALES[1, 3] = 3211, ..., SALES[28, 4] =
    982

    ```'
