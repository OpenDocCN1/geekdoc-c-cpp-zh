    # # Preliminaries


    # ## 2.1 INTRODUCTION


    The development of algorithms for the creation and processing of data structures
    is a major feature of this text. This chapter describes, by means of simple examples,
    the format that will be used to present our algorithms. The format we have selected
    is similar to the format used by Knuth in his well-known text Fundamental Algorithms.
    Although our format is language-free, the algorithms will be sufficiently well
    structured and detailed so that they can be easily translated into some programming
    language such as Pascal, C, etc. In fact going forward, the algorithms will be
    implemented using the C language throughout the text.


    Algorithms may be quite complex. The computer programs implementing the more complex
    algorithms can be more easily understood if these programs are organized into
    hierarchies of modules similar to the one in Fig. 2.1. In such an organization,
    each program contains first a main module, which gives a general description of
    the algorithm; this main module refers to certain submodules, which contain more
    detailed information than the main module; each of the submodules may refer to
    more detailed submodules; and so on. The organization of a program into such a
    hierarchy of modules normally requires the use of certain basic flow patterns
    and logical structures which are usually associated with the notion of structured
    programming. These flow patterns and logical structures will be reviewed in this
    chapter.


    The chapter begins with a brief outline and discussion of various mathematical
    functions which occur in the study of algorithms and in computer science in general,
    and the chapter ends with a discussion of the different kinds of variables that
    can appear in our algorithms and programs.


    The notion of the complexity of an algorithm is also covered in this chapter.
    This important measurement of algorithms gives us a tool to compare different
    algorithmic solutions to a particular problem such as searching or sorting. The
    concept of an algorithm and its complexity is fundamental not only to data structures
    but also to almost all areas of computer science.'
