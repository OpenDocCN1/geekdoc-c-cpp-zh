    \ indicates that linear arrays can be indexed. This is very important property\
    \ of linear arrays. In fact, linked lists, which are covered in the next chapter,\
    \ do not have this property.\n\n## 4.5 TRAVERSING LINEAR ARRAYS\n\nLet A be a\
    \ collection of data elements stored in the memory of the computer. Suppose we\
    \ want to print the contents of each element of A or suppose we want to count\
    \ the number of elements of A with a given property. This can be accomplished\
    \ by traversing A, that is, by accessing and processing (frequently called visiting)\
    \ each element of A exactly once.\n\nThe following algorithm traverses a linear\
    \ array LA. The simplicity of the algorithm comes from the fact that LA is a linear\
