    First we give the reason for the table entries and how they are used. Suppose
    T = T1T2T3 ..., where T1 denotes the ith character of T; and suppose the first
    two characters of T match those of P; i.e., suppose T = aa.... Then T has one
    of the following three forms:


    +   - (i) T = aab....

    +   - (ii) T = aaa....

    +   - (iii) T = aax


    where x is any character different from a or b. Suppose we read T3 and find that
    T3 = b. Then we next read T4 to see if T4 = a, which will give a match of P with
    W1. On the other hand, suppose T3 = a. Then we know that P != W1; but we also
    know that W2 = aa...., i.e., that the first two characters of the substring W2
    match those of P. Hence we next read T4 to see if T4 = b. Last, suppose T3 = x.
    Then we know that P != W1, but we also know that P != W2 and P != W3, since x
    does not appear in P. Hence we next read T4 to see if T4 = a, i.e., to see if
    the first character of W4 matches the first character of P.


    There are two important points to the above procedure. First, when we read T3
    we need only compare T3 with those characters which appear in P. If none of these
    match, then we are in the last case, of a character x which does not appear in
    P. Second, after reading and checking T3, we next read T4; we do not have to go
    back again in the text T.


