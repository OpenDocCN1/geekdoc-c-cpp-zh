    \nW_1 = T[1]T[2]T[3]T[4], W_2 = T[2]T[3]T[4]T[5], ..., W_17 = T[17]T[18]T[19]T[20]\n\
    \nNote that there are MAX = 20 - 4 + 1 = 17 such substrings of T.\n\nA formal\
    \ presentation of our algorithm, where P is an r-character string and T is an\
