    \ traversed. On the other hand, the traversal of nonlinear structures, such as\
    \ trees and graphs, is considerably more complicated.\n\n![](img/f1df4c31f1795198a6843c842acc2216_118_0.png)\n\
    \nYou have either reached a page that is unavailable for viewing or reached your\
    \ viewing limit for this book.\n\n## Example 4.5\n\nConsider the array AUTO in\
    \ Example 4.1(b), which records the number of automobiles sold each year from\
    \ 1932 through 1984. Each of the following modules, which carry out the given\
    \ operation, involves traversing AUTO.\n\n- (a) Find the number NUM of years during\
    \ which more than 300 automobiles were sold.\n  - 1. [Initialization step.] Set\
    \ NUM := 0.\n  - 2. Repeat for K = 1932 to 1984: If AUTO[K] > 300, then: Set NUM\
    \ := NUM + 1. [End of loop.]\n  - 3. Return.\n\n- (b) Print each year and the\
    \ number of automobiles sold in that year.\n  - 1. Repeat for K = 1932 to 1984:\
    \ Write: K, AUTO[K]. [End of loop.]\n  - 2. Return.\n\n(Observe that (a) requires\
    \ an initialization step for the variable NUM before traversing the array AUTO.)\n\
    \n## 4.6 INSERTING AND DELETING\n\nLet A be a collection of data elements in the\
    \ memory of the computer. “Inserting” refers to the operation of adding another\
    \ element to the collection A, and “deleting” refers to the operation of removing\
    \ one of the elements from A. This section discusses inserting and deleting when\
    \ A is a linear array.\n\nInserting an element at the “end” of a linear array\
    \ can be easily done provided the memory space allocated for the array is large\
    \ enough to accommodate the additional element. On the other hand, suppose we\
    \ need to insert an element in the middle of the array. Then, on the average,\
    \ half of the elements must be moved downward to new locations to accommodate\
    \ the new element and keep the order of the other elements.\n\nSimilarly, deleting\
    \ an element at the “end” of an array presents no difficulties, but deleting an\
    \ element somewhere in the middle of the array would require that each subsequent\
    \ element be moved one location upward in order to “fill up” the array.\n\nRemark:\
    \ Since linear arrays are usually pictured extending downward, as in Fig. 4.1,\
    \ the term “downward” refers to locations with larger subscripts, and the term\
    \ “upward” refers to locations with smaller subscripts.\n\n## Example 4.6\n\n\
    Suppose TEST has been declared to be a 5-element array but data have been recorded\
    \ only for TEST[1], TEST[2] and TEST[3]. If X is the value of the next test, then\
    \ one simply assigns\n\n```\nTEST[4] := X\n```\n\nto add X to the list. Similarly,\
    \ if Y is the value of the subsequent test, then we simply assign\n\n```\nTEST[5]\
    \ := Y\n```\n\nto add Y to the list. Now, however, we cannot add any new test\
    \ scores to the list.\n\n## Example 4.7\n\nSuppose NAME is an 8-element linear\
    \ array, and suppose five names are in the array, as in Fig. 4.5(a). Observe that\
    \ the names are listed alphabetically, and suppose we want to keep the array names\
