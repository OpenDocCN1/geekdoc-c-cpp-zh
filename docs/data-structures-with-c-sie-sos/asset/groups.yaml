    $D$ is negative, then there are no real solutions. If $D = 0$, then there is only
    one (double) real solution, $x = -b/2a$. If $D$ is positive, the formula gives
    the two distinct real solutions. The following algorithm finds the solutions of
    a quadratic equation.


    ```

    Algorithm 2.2: (Quadratic Equation) This algorithm inputs the coefficients A,
    B, C of a quadratic equation and outputs the real solutions, if any.

