    # Example 4.26


    (a) Suppose


    \( A = \begin{pmatrix} 1 & -2 & 3 \\ 0 & 4 & 5 \end{pmatrix} \quad \text{and}
    \quad B = \begin{pmatrix} 3 & 0 & -6 \\ 2 & -3 & 1 \end{pmatrix} \)


    Then:


    \( A + B = \begin{pmatrix} 1+3 & -2+0 & 3+(-6) \\ 0+2 & 4+(-3) & 5+1 \end{pmatrix}
    = \begin{pmatrix} 4 & -2 & -3 \\ 2 & 1 & 6 \end{pmatrix} \)


    \( 3A = \begin{pmatrix} 3 \cdot 1 & 3 \cdot (-2) & 3 \cdot 3 \\ 3 \cdot 0 & 3
    \cdot 4 & 3 \cdot 5 \end{pmatrix} = \begin{pmatrix} 3 & -6 & 9 \\ 0 & 12 & 15
    \end{pmatrix} \)


    (b) Suppose \( U = (1, -3, 4, 5) \), \( V = (2, -3, -6, 0) \) and \( W = (3, -5,
    2, -1) \). Then:


    \( U \cdot V = 1 \cdot 2 + (-3) \cdot (-3) + 4 \cdot (-6) + 5 \cdot 0 = 2 + 9
    - 24 + 0 = -13 \)


    \( U \cdot W = 1 \cdot 3 + (-3) \cdot (-5) + 4 \cdot 2 + 5 \cdot (-1) = 3 + 15
    + 8 - 5 = 21 \)


    (c) Suppose


    \( A = \begin{pmatrix} 1 & 3 \\ 2 & 4 \end{pmatrix} \quad \text{and} \quad B =
    \begin{pmatrix} 2 & 0 & -4 \\ 3 & 2 & 6 \end{pmatrix} \)


    The product matrix \( AB \) is defined and is a \( 2 \times 3 \) matrix. The elements
    in the first row of \( AB \) are obtained, respectively, by multiplying the first
    row of \( A \) by each of the columns of \( B \):


    \( \begin{pmatrix} 1 & 3 \\ 2 & 4 \end{pmatrix} \begin{pmatrix} 2 & 0 & -4 \\
    3 & 2 & 6 \end{pmatrix} = \begin{pmatrix} 1 \cdot 2 + 3 \cdot 3 & 1 \cdot 0 +
    3 \cdot 2 & 1 \cdot (-4) + 3 \cdot 6 \end{pmatrix} = \begin{pmatrix} 11 & 6 &
    14 \end{pmatrix} \)


    Similarly, the elements in the second row of \( AB \) are obtained, respectively,
    by multiplying the second row of \( A \) by each of the columns of \( B \):


    \( \begin{pmatrix} 1 & 3 \\ 2 & 4 \end{pmatrix} \begin{pmatrix} 2 & 0 & -4 \\
    3 & 2 & 6 \end{pmatrix} = \begin{pmatrix} 11 & 6 & 14 \\ 2 \cdot 2 + 4 \cdot 3
    & 2 \cdot 0 + 4 \cdot 2 & 2 \cdot (-4) + 4 \cdot 6 \end{pmatrix} = \begin{pmatrix}
    11 & 6 & 14 \\ 16 & 8 & 16 \end{pmatrix} \)


    That is,


    \( AB = \begin{pmatrix} 11 & 6 & 14 \\ 16 & 8 & 16 \end{pmatrix} \)


    The following algorithm finds the product \( AB \) of matrices \( A \) and \(
    B \), which are stored as two-dimensional arrays. (Algorithms for matrix addition
    and matrix scalar multiplication, which are very similar to algorithms for vector
    addition and scalar multiplication, are left as exercises for the reader.)


    # Algorithm 4.8: (Matrix Multiplication) MATMUL(A, B, C, M, P, N)


    Let A be an M × P matrix array, and let B be a P × N matrix array. This algorithm
