    Length(COMPUTER) = 8\nLength(MARC) = 4\n\n## 3.7 WORD/TEXT PROCESSING\n\nIn earlier\
    \ times, character data processed by the computer consisted mainly of data items,\
    \ such as\nnames and addresses. Today the computer also processes printed matter,\
    \ such as letters, articles\nand reports. It is in this latter context that we\
    \ use the term “word processing.”\n\nGiven some printed text, the operations usually\
    \ associated with word processing are the following:\n\n- (a) Replacement. Replacing\
    \ one string in the text by another.\n- (b) Insertion. Inserting a string in the\
    \ middle of the text.\n- (c) Deletion. Deleting a string from the text.\n\nThe\
    \ above operations can be executed by using the string operations discussed in\
    \ the preceding section. This we show below when we discuss each operation separately.\
    \ Many of these operations are built into or can easily be defined in most of\
    \ the programming languages.\n\n### Insertion\n\nSuppose in a given text T we\
    \ want to insert a string S so that S begins in position K. We denote this operation\
    \ by\n\n```\nINSERT(text, position, string)\n```\n\nFor example,\n\n```\nINSERT\
    \ ('ABCDEFG', 3, 'XYZ') = 'ABXYZCDEFG'\nINSERT ('ABCDEFG', 6, 'XYZ') = 'ABCDEXYZFG'\n\
    ```\n\nThis INSERT function can be implemented by using the string operation defined\
    \ in the previous section as follows:\n\n```\nINSERT(T, K, S) = SUBSTRING(T, 1,\
    \ K – 1) /// SUBSTRING(T, K, LENGTH(T) – K + 1)\n```\n\nThat is, the initial substring\
    \ of T before the position K, which has length K – 1, is concatenated with the\
    \ string S, and the result is concatenated with the remaining part of T, which\
    \ begins in position K and has length LENGTH(T) – (K – 1) = Length (T) – K + 1.\
    \ (We are assuming implicitly that T is a dynamic variable and that the size of\
    \ T will not become too large.)\n\n### Deletion\n\nSuppose in a given text T we\
    \ want to delete the substring which begins at position K and has length L. We\
    \ denote this operation by\n\n```\nDELETE(text, position, length)\n```\n\nFor\
