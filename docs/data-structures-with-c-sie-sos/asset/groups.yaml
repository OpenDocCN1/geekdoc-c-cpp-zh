    If $n > 1$ is not prime, i.e., if $n$ is composite, then $n$ must have a divisor
    $k \neq 1$ such that $k \le \sqrt{n}$ or, in other words, $k^2 \le n$.


    Suppose we want to find all the prime numbers less than a given number $m$, such
