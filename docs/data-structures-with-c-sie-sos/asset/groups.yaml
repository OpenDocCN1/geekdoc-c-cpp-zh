    \n任何其他新的记号或约定要么不言自明，要么将在出现时加以解释。\n\n## 2.5 算法的复杂性\n\n算法分析是计算机科学的一项主要任务。为了比较算法，我们必须有一些标准来衡量算法的效率。本节讨论这一重要主题。\n\
    \n假设 M 是一个算法，n 是输入数据的大小。算法 M 使用的时间和空间是衡量 M 效率的两个主要指标。时间通过计算关键操作的次数来衡量——例如，在排序和搜索算法中，是比较的次数。这是因为关键操作的定义使得其他操作的时间远小于或最多与关键操作的时间成正比。空间通过计算算法所需的最大内存来衡量。\n\
    \n算法 M 的复杂性是函数 f(n)，它以输入数据的大小 n 为参数，给出算法的运行时间和/或存储空间需求。通常，算法所需的存储空间仅仅是数据大小 n 的倍数。因此，除非另有说明或暗示，否则术语“复杂性”应指算法的运行时间。\n\
    \n以下示例说明，给出算法运行时间的函数 f(n) 不仅取决于输入数据的大小 n，还取决于特定的数据。\n\n### 示例 2.7\n\n假设我们有一个英文短篇故事\
