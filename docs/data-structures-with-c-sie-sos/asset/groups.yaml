    \ Smith and Wagner must each be moved downward one location, as in Fig. 4.5(b).\
    \ Next suppose Taylor is added to the array; then Wagner must be moved, as in\
    \ Fig. 4.5(c). Last, suppose Davis is removed from the array. Then the five names\
    \ Ford, Johnson, Smith, Taylor and Wagner must each be moved upward one location,\
    \ as in Fig. 4.5(d). Clearly such movement of data would be very expensive if\
    \ thousands of names were in the array.\n\n### (a)\n| | NAME |\n|---|---|\n| 1\
    \ | Brown |\n| 2 | Davis |\n| 3 | Johnson |\n| 4 | Smith |\n| 5 | Wagner |\n|\
    \ 6 | |\n| 7 | |\n| 8 | |\n\n### (b)\n| | NAME |\n|---|---|\n| 1 | Brown |\n|\
    \ 2 | Davis |\n| 3 | Ford |\n| 4 | Johnson |\n| 5 | Smith |\n| 6 | Wagner |\n\
    | 7 | |\n| 8 | |\n\n### (c)\n| | NAME |\n|---|---|\n| 1 | Brown |\n| 2 | Davis\
    \ |\n| 3 | Ford |\n| 4 | Johnson |\n| 5 | Smith |\n| 6 | Taylor |\n| 7 | Wagner\
    \ |\n| 8 | |\n\n### (d)\n| | NAME |\n|---|---|\n| 1 | Brown |\n| 2 | Ford |\n\
    | 3 | Johnson |\n| 4 | Smith |\n| 5 | Taylor |\n| 6 | Wagner |\n| 7 | |\n| 8 |\
    \ |\n\nFig. 4.5\n\nThe following algorithm inserts a data element ITEM into the\
    \ Kth position in a linear array LA with N elements. The first four steps create\
    \ space in LA by moving downward one location each element from the Kth position\
    \ on. We emphasize that these elements are moved in reverse order—i.e., first\
    \ LA[N], then LA[N – 1], ..., and last LA[K]; otherwise data might be erased.\
    \ (See Solved Problem 4.3) In more detail, we first set J := N and then, using\
    \ J as a counter, decrease J each time the loop is executed until J reaches K.\
    \ The next step, Step 5, inserts ITEM into the array in the space just created.\
    \ Before the exit from the algorithm, the number N of elements in LA is increased\
    \ by 1 to account for the new element.\n\n```\n**Algorithm 4.2:** (Inserting into\
    \ a Linear Array) INSERT (LA, N, K, ITEM)\nHere LA is a linear array with N elements\
    \ and K is a positive integer such that K ≤ N. This algorithm inserts an element\
    \ ITEM into the Kth position in LA.\n1. [Initialize counter.] Set J := N.\n2.\
    \ Repeat Steps 3 and 4 while J ≥ K.\n3. [Move Jth element downward.] Set LA[J\
    \ + 1] := LA[J].\n4. [Decrease counter.] Set J := J – 1.\n[End of Step 2 loop.]\n\
    5. [Insert element.] Set LA[K] := ITEM.\n6. [Reset N.] Set N := N + 1.\n7. Exit.\n\
    ```\n"
