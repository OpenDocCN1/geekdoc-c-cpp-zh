    the size should be known. Subscripts are used to refer the elements of the array
    where 0 is considered to be the lowest subscript always and the highest subscript
    is (size –1), which is 9 in this case. We can refer to any element as a[0], a[1],
    a[2], etc.


    An array can also be processed using a for loop. The consecutive memory locations
    of the array are allocated and the element size is the same. We should always
    keep in mind that among all the operators used the subscript of this array must
    have the highest precedence.


    Each programming language has its own rules for declaring arrays. Each such declaration
    must give, implicitly or explicitly, three items of information: (1) the name
    of the array, (2) the data type of the array and (3) the index set of the array.


