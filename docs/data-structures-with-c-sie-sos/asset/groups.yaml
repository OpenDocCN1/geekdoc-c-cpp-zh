    (a) Describe and find C(n) for the worst case.

    (b) Describe and find C(n) for the best case.

    (c) Find C(n) for the average case when n = 3, assuming all arrangements of the
    elements in DATA are equally likely.


    (a) The worst case occurs when the elements of DATA are in increasing order, where
    each comparison of MAX with DATA[K] forces LOC and MAX to be updated. In this
    case, C(n) = n - 1.


    (b) The best case occurs when the largest element appears first and so when the
    comparison of MAX with DATA[K] never forces LOC and MAX to be updated. Accordingly,
    in this case, C(n) = 0.


    (c) Let 1, 2 and 3 denote, respectively, the largest, second largest and smallest
    elements of DATA. There are six possible ways the elements can appear in DATA,
    which correspond to the 3! = 6 permutations of 1, 2, 3. For each permutation p,
    let np denote the number of times LOC and MAX are updated when the algorithm is
    executed with input p. The six permutations p and the corresponding values np
    follow:


    | Permutation p: | 123 | 132 | 213 | 231 | 312 | 321 |

    | Value of np: | 0 | 0 | 1 | 1 | 1 | 2 |


    Assuming all permutations p are equally likely,


    ```

    C(3) = \frac{0 + 0 + 1 + 1 + 1 + 2}{6} = \frac{5}{6}

