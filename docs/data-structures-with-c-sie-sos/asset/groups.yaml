    # Polynomials


    Header linked lists are frequently used for maintaining polynomials in memory.
    The header node plays an important part in this representation, since it is needed
    to represent the zero polynomial. This representation of polynomials will be presented
    in the context of a specific example.


    Example 5.20

    Let p(x) denote the following polynomial in one variable (containing four nonzero
    terms):

    p(x) = 2x^8 - 5x^7 - 3x^2 + 4

    Then p(x) may be represented by the header list pictured in Fig. 5.35(a), where
    each node corresponds to a nonzero term of p(x). Specifically, the information
    part of the node is divided into two fields representing, respectively, the coefficient
    and the exponent of the corresponding term, and the nodes are linked according
    to decreasing degree.

    Observe that the list pointer variable POLY points to the header node, whose exponent
    field is assigned a negative number, in this case -1. Here the array representation
    of the list will require three linear arrays, which we will call COEF, EXP and
    LINK. One such representation appears in Fig. 5.35(b).


    # Representation of Polynomials Using Linked Lists


    We can represent a polynomial using array or a linked list. This is done by simply
    storing the coefficient and exponent of all the terms. The linked list representation
    is easy for operations like polynomial addition or subtraction, and polynomial
    multiplication. We should also keep in mind that in a polynomial, all the terms
    might not be present, especially for polynomials with a higher order. Look at
    the following example.


    8x^13 + 5x^6 + 2x^8 + x^5 + x^10 + 17x


    This 13th order polynomial does not have all the 14 terms (including the constant
    term). Thus, it is very easy to represent the polynomial with the help of a linked
    list structure. Here every node can retain information pertaining to a single
    term of the polynomial. All the nodes store three things:


    +   - variable x

    +   - exponent

    +   - coefficient for each term


    Whatever be the equation, it does not matter if the polynomial is in x or y. This
    is a very important information that needs to be kept in mind when performing
    operations on polynomials. Thus it is better if we define a node structure which
    holds 2 integers— exp and coff.


    Let us compare this representation with an array structure storing the same polynomials.
