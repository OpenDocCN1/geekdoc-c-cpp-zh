    );\n    printf(\"\\nKey\\tAddress\");\n    for(i=2000;i<=2020;i++)\n        printf(\"\
    \\n%d\\t %d\",i,HASH(i));\n\n    getch();\n}\n\nint HASH(int k)\n{\n    return(k-2000);\n\
    }\n```\n\n### 输出：\n\nPress any key to generate the Hash Table for Employee Code\
    \ (keys) 2000-2020\n\n******HASH TABLE******\n\n| Key | Address |\n|---|---|\n\
    | 2000 | 0 |\n| 2001 | 1 |\n| 2002 | 2 |\n| 2003 | 3 |\n| 2004 | 4 |\n| 2005 |\
    \ 5 |\n| 2006 | 6 |\n| 2007 | 7 |\n| 2008 | 8 |\n\n![](img/f1df4c31f1795198a6843c842acc2216_539_0.png)\n\
    \n你要么访问了不可用的页面，要么已达到查看此书的限制。\n\n![](img/f1df4c31f1795198a6843c842acc2216_540_0.png)\n\
    \n你要么访问了不可用的页面，要么已达到查看此书的限制。\n\n![](img/f1df4c31f1795198a6843c842acc2216_541_0.png)\n\
    \n你要么访问了不可用的页面，要么已达到查看此书的限制。\n\nkey \\( k \\)。效率主要取决于负载因子 \\( \\lambda \\)。具体来说，我们关注以下两个量：\n\
    \n\\( S(\\lambda) = \\text{成功查找的平均探测次数} \\)\n\n\\( U(\\lambda) = \\text{不成功查找的平均探测次数}\
    \ \\)\n\n这些量将在我们的冲突处理过程中讨论。\n\n## 冲突解决技术\n\n冲突解决主要有两种方式：\n\n- (i) 开放寻址，基于数组实现。\n\
    - (ii) 链地址法，基于链表数组实现。\n\n开放寻址包括：\n\n- 线性探测（线性搜索）\n- 二次探测（非线性搜索），以及\n- 双重哈希（使用两个哈希函数）。\n\
    \n### (i) 开放寻址：线性探测及其修改\n\n假设要向内存表 \\( T \\) 添加一个带键 \\( k \\) 的新记录 \\( R \\)，但哈希地址\
    \ \\( H(k) = h \\) 的内存位置已被占用。解决冲突的一种自然方法是将 \\( R \\) 分配给 \\( T[h] \\) 之后的第一个可用位置。（我们假设具有\
    \ \\( m \\) 个位置的表 \\( T \\) 是循环的，因此 \\( T[1] \\) 在 \\( T[m] \\) 之后。）因此，采用这种冲突处理过程时，我们将通过线性搜索位置\
    \ \\( T[h] \\)、\\( T[h+1] \\)、\\( T[h+2] \\) ... 来在表 \\( T \\) 中查找记录 \\( R \\\
    )，直到找到 \\( R \\) 或遇到空位置，后者表示查找不成功。\n\n上述冲突解决方法称为 _线性探测_。成功查找和不成功查找的平均探测次数已知为以下各自量值：\n\
    \n```\n\\( S(\\lambda) = \\frac{1}{2}\\left(1 + \\frac{1}{1-\\lambda}\\right)\
    \ \\quad \\text{and} \\quad U(\\lambda) = \\frac{1}{2}\\left(1 + \\frac{1}{(1-\\\
    lambda)^2}\\right) \\)\n```\n\n（此处 \\( \\lambda = n/m \\) 为负载因子。）\n\n下表总结了各种开放寻址探测序列的特性。\n\
    \n| 探测序列 | 主聚集 | 容量限制 | 大小限制 |\n|---|---|---|---|\n| 线性探测 | 是 | 无 | 无 |\n| 二次探测\
    \ | 否 | \\(\\lambda < \\frac{1}{2}\\) | M 必须是素数 |\n| 双重哈希 | 否 | 无 | M 必须是素数 |\n\
    \n"
