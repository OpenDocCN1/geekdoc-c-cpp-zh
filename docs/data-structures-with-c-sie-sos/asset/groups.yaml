    INSERT ('ABCDEFG', 6, 'XYZ') = 'ABCDEXYZFG'\n```\n\n此INSERT函数可以使用前一节定义的字符串操作实现，如下所示：\n\
    \n```\nINSERT(T, K, S) = SUBSTRING(T, 1, K – 1) /// SUBSTRING(T, K, LENGTH(T)\
    \ – K + 1)\n```\n\n也就是说，位置K之前的T的初始子字符串（长度为K – 1）与字符串S连接，然后结果与T的其余部分连接，该部分从位置K开始，长度为LENGTH(T)\
    \ – (K – 1) = Length(T) – K + 1。（我们隐含地假设T是动态变量，且T的大小不会变得过大。）\n\n### 删除\n\n假设在给定文本T中，我们想要删除从位置K开始且长度为L的子字符串。我们用以下方式表示此操作：\n\
