    \ 由于 85 > 55，BEG 的值更改为 BEG = MID + 1 = 8。因此 MID = INT[(8 + 13)/2] = 10，所以 DATA[MID]\
    \ = 77\n- 3. 由于 85 > 77，BEG 的值更改为 BEG = MID + 1 = 11。因此 MID = INT[(11 + 13)/2]\
    \ = 12，所以 DATA[MID] = 88\n- 4. 由于 85 < 88，END 的值更改为 END = MID - 1 = 11。因此 MID\
    \ = INT[(11 + 11)/2] = 11，所以 DATA[MID] = 80\n\n（请注意，现在 BEG = END = MID = 11。）\n\
    \n由于 85 > 80，BEG 的值更改为 BEG = MID + 1 = 12。但现在 BEG > END。因此 ITEM 不属于 DATA。\n\n\
    ![](img/f1df4c31f1795198a6843c842acc2216_135_0.png)\n\n### 二分搜索算法的复杂度\n\n复杂度按在包含\
    \ n 个元素的 DATA 中定位 ITEM 所需的比较次数 f(n) 来衡量。请注意，每次比较都将样本大小减半。因此，我们最多需要 f(n) 次比较来定位\
    \ ITEM，其中\n\n```\n2^{f(n)} > n or equivalently f(n) = \\lfloor \\log_2 n \\rfloor\
    \ + 1\n```\n\n也就是说，最坏情况下的运行时间大约等于 log2 n。还可以证明，平均情况下的运行时间大约等于最坏情况下的运行时间。\n\n###\
    \ 示例 4.11\n\n假设 DATA 包含 1 000 000 个元素。请注意，2^{10} = 1024 > 1000，因此 2^{20} > 1000^2\
    \ = 1 000 000。相应地，使用二分搜索算法，只需大约 20 次比较即可找到包含 1 000 000 个元素的数据数组中某个元素的位置。\n\n###\
    \ 二分搜索算法的局限性\n\n由于二分搜索算法非常高效（例如，对于初始包含 1 000 000 个元素的列表，它只需要大约 20 次比较），为什么还要使用任何其他搜索算法呢？\n\
    \n"
