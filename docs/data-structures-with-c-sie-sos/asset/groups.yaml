    # 1.4 DATA STRUCTURE OPERATIONS


    The data appearing in our data structures are processed by means of certain operations.
    In fact, the particular data structure that one chooses for a given situation
    depends largely on the frequency with which specific operations are performed.
    This section introduces the reader to some of the most frequently used of these
    operations.


    The following four operations play a major role in this text:


    +   1. Traversing: Accessing each record exactly once so that certain items in
    the record may be processed. (This accessing and processing is sometimes called
    “visiting” the record.)

    +   2. Searching: Finding the location of the record with a given key value, or
    finding the locations of all records which satisfy one or more conditions.

    +   3. Inserting: Adding a new record to the structure.

    +   4. Deleting: Removing a record from the structure.


    Sometimes two or more of the operations may be used in a given situation; e.g.,
    we may want to delete the record with a given key, which may mean we first need
    to search for the location of the record.


    The following two operations, which are used in special situations, will also
    be considered:


    +   1. Sorting: Arranging the records in some logical order (e.g., alphabetically
    according to some NAME key, or in numerical order according to some NUMBER key,
    such as social security number or account number)

    +   2. Merging: Combining the records in two different sorted files into a single
    sorted file


    Other operations, e.g. copying and concatenation, will be discussed later in the
    text.


    # Example 1.6


    An organization contains a membership file in which each record contains the following
    data for a given member:

    Name, Address, Telephone Number, Age, Sex


    +   (a) Suppose the organization wants to announce a meeting through a mailing.
    Then one would traverse the file to obtain Name and Address for each member.

    +   (b) Suppose one wants to find the names of all members living in a certain
    area. Again one would traverse the file to obtain the data.

    +   (c) Suppose one wants to obtain Address for a given Name. Then one would search
    the file for the record containing Name.

    +   (d) Suppose a new person joins the organization. Then one would insert his
    or her record into the file.

    +   (e) Suppose a member dies. Then one would delete his or her record from the
    file.

    +   (f) Suppose a member has moved and has a new address and telephone number.
    Given the name of the member, one would first need to search for the record in
    the file. Then one would perform the “update”—i.e., change items in the record
    with the new data.

    +   (g) Suppose one wants to find the number of members 65 or older. Again one
    would traverse the file, counting such members.'
