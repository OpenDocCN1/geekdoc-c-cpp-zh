    \  \n  (b) Suppose T = 'ABCDEFG' and P = 'DC'. Then INDEX(T, P) = 0 and LENGTH(P)\
    \ = 2. Hence, by the \"zero case,\"\n  \n  DELETE('ABCDEFG ', 0, 2) = ' ABCDEFG\
    \ '\n  \n  as expected.\n\nSuppose after reading into the computer a text T and\
