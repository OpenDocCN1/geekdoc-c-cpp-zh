  - '[PAGE 24]


    Remark: Suppose a file is sorted numerically by social security number. As new
    records are inserted into the file, data must be constantly moved to new locations
    in order to maintain the sorted order. One simple way to minimize the movement
    of data is to have the social security number serve as the address of each record.
    Not only would there be no movement of data when records are inserted, but there
    would be instant access to any record. However, this method of storing data would
    require one billion (10^9) memory locations for only hundreds or possibly thousands
    of records. Clearly, this tradeoff of space for time is not worth the expense.
    An alternative method is to define a function H from the set K of key values—social
    security numbers—into the set L of addresses of memory cells. Such a function
    H is called a *hashing function*. Hashing functions and their properties will
    be covered in Chapter 9.


    # SOLVED PROBLEMS


    # Basic Terminology


    +   1.1 A professor keeps a class list containing the following data for each
    student:

    +   Name, Major, Student Number, Test Scores, Final Grade

    +   (a) State the entities, attributes and entity set of the list.

    +   (b) Describe the field values, records and file.

    +   (c) Which attributes can serve as primary keys for the list?


    +   (a) Each student is an entity, and the collection of students is the entity
    set. The properties, name, major, and so on, of the students are the attributes.

    +   (b) The field values are the values assigned to the attributes, i.e., the
    actual names, test scores, and so on. The field values for each student constitute
    a record, and the collection of all the student records is the file.

    +   (c) Either Name or Student Number can serve as a primary key, since each uniquely
    determines the student''s record. Normally the professor uses Name as the primary
    key, but the registrar may use Student Number.


    +   1.2 A hospital maintains a patient file in which each record contains the
    following data:

    +   Name, Admission Date, Social Security Number, Room, Bed Number, Doctor

    +   (a) Which items can serve as primary keys?

    +   (b) Which pair of items can serve as a primary key?

    +   (c) Which items can be group items?


    +   (a) Name and Social Security Number can serve as primary keys. (We assume
    that no two patients have the same name.)

    +   (b) Room and Bed Number in combination also uniquely determine a given patient.

    +   (c) Name, Admission Date and Doctor may be group items.


    +   1.3 Which of the following data items may lead to variable-length records
    when included as items in the record: (a) age, (b) sex, (c) name of spouse, (d)
    names of children, (e) education. (f) previous employers?'
  - '[PAGE 25]


    Since (d) and (f) may contain a few or many items, they may lead to variable-length
    records. Also, (e) may contain many items, unless it asks only for the highest
    level obtained.


    # 1.4 Data base systems will be only briefly covered in this text. Why?


    "Data base systems" refers to data stored in the secondary memory of the computer.
    The implementation and analysis of data structures in the secondary memory are
    very different from those in the main memory of the computer. This text is primarily
    concerned with data structures in main memory, not secondary memory.


    # Data Structures and Operations


    # 1.5 Give a brief description of (a) traversing, (b) sorting and (c) searching.


    +   (a) Accessing and processing each record exactly once

    +   (b) Arranging the data in some given order

    +   (c) Finding the location of the record with a given key or keys


    # 1.6 Give a brief description of (a) inserting and (b) deleting.


    +   (a) Adding a new record to the data structure, usually keeping a particular
    ordering

    +   (b) Removing a particular record from the data structure


    # 1.7 Consider the linear array NAME in Fig. 1.15, which is sorted alphabetically.


    +   (a) Find NAME[2], NAME[4] and NAME[7].

    +   (b) Suppose Davis is to be inserted into the array. How many names must be
    moved to new locations.

    +   (c) Suppose Gupta is to be deleted from the array. How many names must be
    moved to new locations?


    ![](img/f1df4c31f1795198a6843c842acc2216_25_0.png)


    +   (a) Here NAME[K] is the kth name in the list. Hence,

    +   NAME[2] = Clark, NAME[4] = Gupta, NAME[7] = Pace

    +   (b) Since Davis will be assigned to NAME[3], the names Evans through Smith
    must be moved. Hence six names are moved.

    +   (c) The names Jones through Smith must be moved up the array. Hence four names
    must be moved.


    # 1.8 Consider the linear array NAME in Fig. 1.16. The values of FIRST and LINK[K]
    in the figure determine a linear ordering of the names as follows. FIRST gives
    the location of the first name in the list, and LINK[K] gives the location of
    the name following NAME[K], with 0 denoting the end of the list. Find the linear
    ordering of the names.'
  - '[PAGE 26]


    | | NAME | LINK |

    |---|---|---|

    | 1 | Rogers | 7 |

    | 2 | Clark | 8 |

    | 3 | | |

    | 4 | Hansen | 10 |

    | 5 | Brooks | 2 |

    | 6 | Pitt | 1 |

    | 7 | Walker | 0 |

    | 8 | Fisher | 4 |

    | 9 | | |

    | 10 | Leary | 6 |


    ![](img/f1df4c31f1795198a6843c842acc2216_26_0.png)


    The ordering is obtained as follows:

    FIRST = 5, so the first name in the list is NAME[5], which is Brooks.

    LINK[5] = 2, so the next name is NAME[2], which is Clark.

    LINK[2] = 8, so the next name is NAME[8], which is Fisher.

    LINK[8] = 4, so the next name is NAME[4], which is Hansen.

    LINK[4] = 10, so the next name is NAME[10], which is Leary.

    LINK[10] = 6, so the next name is NAME[6], which is Pitt.

    LINK[6] = 1, so the next name is NAME[1], which is Rogers.

    LINK[1] = 7, so the next name is NAME[7], which is Walker.

    LINK[7] = 0, which indicates the end of the list.

    Thus the linear ordering of the names is Brooks, Clark, Fisher, Hansen, Leary,
    Pitt, Rogers, Walker. Note that this is the alphabetical ordering of the names.


    1.9 Consider the algebraic expression (7x + y)(5a - b)^3. (a) Draw the corresponding
    tree diagram as in Example 1.5. (b) Find the scope of the exponential operation.
    (The scope of a node v in a tree is the subtree consisting of v and the nodes
    following v.)


    (a) Use a vertical arrow (↑) for exponentiation and an asterisk (*) for multiplication
    to obtain the tree in Fig. 1.17.


    ![](img/f1df4c31f1795198a6843c842acc2216_26_1.png)'
  - '[PAGE 27]


    (b) The scope of the exponentiation operation ↑ is the subtree circled in the
    diagram. It corresponds to the expression (5a − b)³.


    1.10 The following is a tree structure given by means of level numbers as discussed
    in Example 1.4:


    01 Employee 02 Name 02 Number 02 Hours 03 Regular 03 Overtime 02 Rate


    Draw the corresponding tree diagram.


    The tree diagram appears in Fig. 1.18. Here each node v is the successor of the
    node which precedes v and has a lower level number than v.


    ![](img/f1df4c31f1795198a6843c842acc2216_27_0.png)


    1.11 Discuss whether a stack or a queue is the appropriate structure for determining
    the order in which elements are processed in each of the following situations.


    +   (a) Batch computer programs are submitted to the computer center.

    +   (b) Program A calls subprogram B which calls subprogram C, and so on.

    +   (c) Employees have a contract which calls for a seniority system for hiring
    and firing.


    +   (a) Queue. Excluding priority cases, programs are executed on a first come,
    first served basis.

    +   (b) Stack. The last subprogram is executed first, and its results are transferred
    to the next-to-last program, which is then executed, and so on, until the original
    calling program is executed.

    +   (c) Stack. In a seniority system, the last to be hired is the first to be
    discharged.


    1.12 The daily flights of an airline company appear in Fig. 1.19. CITY lists the
    cities, and ORIG[K] and DEST[K] denote the cities of origin and destination, respectively.
    of the flight NUMBER[K]. Draw the corresponding directed graph of the data. (The
    graph is directed because the flight numbers represent flights from one city to
    another but not returning.)


    The nodes of the graph are the five cities. Draw an arrow from city A to city
    B if there is a flight from A to B, and label the arrow with the flight number.
    The directed graph appears in Fig. 1.20.'
