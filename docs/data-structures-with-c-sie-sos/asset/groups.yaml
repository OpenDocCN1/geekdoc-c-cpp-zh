    \n## 反馈\n\n有益的建议和建设性的批评始终能大大促进任何事业的发展。我们请求所有读者将宝贵的评论/意见/反馈发送至tmh.csefeedback@gmail.com，以改进本书，并在邮件主题行中注明书名和作者姓名。此外，如发现本书有任何盗版行为，请随时举报。\n\
    \n## 前言\n\n数据结构的研究是计算机科学几乎所有本科和研究生课程中不可或缺的一部分。本教材在呈现更重要的材料时，可用作数据结构正式课程的教科书，也可作为几乎所有当前标准教材的补充。\n\
    \n各章节主要按复杂度递增的顺序组织。**第1章**是材料的介绍和概述，**第2章**介绍了用于呈现和分析我们算法的数学背景和记号。**第3章**关于模式匹配，与正文相对独立且属于切题，因此在初次阅读时可以推迟或省略。**第4至第8章**包含任何数据结构课程的核心材料。具体来说，第4章讨论数组和记录，**第5章**关于链表，**第6章**涵盖栈和队列并包含递归，**第7章**关于二叉树，**第8章**关于图及其应用。尽管排序和搜索在全文中在特定数据结构的上下文中进行讨论（例如，线性数组上的二分查找、使用栈和队列的快速排序、使用二叉树的堆排序），但**第9章**，即最后一章，介绍了归并排序和哈希等额外的排序和搜索算法。\n\
    \n算法以与机器和语言无关的形式呈现。此外，它们主要使用IF-THEN-ELSE和REPEAT-WHILE模块进行控制流，并使用缩进模式以便于阅读和理解。因此，我们的每个算法都可以轻松翻译成几乎任何标准编程语言。\n\
    \n本书采用故意初级的方法来阐述主题，配有大量示例和图表，应能吸引广泛的读者群，并特别适合作为有效的自学指南。每一章都包含定义和原则的清晰陈述，并附有说明性和其他描述性材料。随后是分级的解答题和补充题集。解答题说明和扩展了材料，补充题则对章节材料进行了完整的复习。\n\
    \n我要感谢许多朋友和同事对手稿提出的宝贵建议和关键审阅。我也要向McGraw-Hill沙姆大纲系列的工作人员表示感谢，特别是Jeffrey McCartney，感谢他们的热心合作。最后，我与许多其他作者一起，明确向Donald\
