    space, i.e., the free-storage list is empty. This situation is usually called
    overflow. The programmer may handle overflow by printing the message OVERFLOW.
    In such a case, the programmer may then modify the program by adding space to
    the underlying arrays. Observe that overflow will occur with our linked lists
    when AVAIL = NULL and there is an insertion.


    Analogously, the term underflow refers to the situation where one wants to delete
    data from a data structure that is empty. The programmer may handle underflow
    by printing the message UNDERFLOW. Observe that underflow will occur with our
    linked lists when START = NULL and there is a deletion.'
