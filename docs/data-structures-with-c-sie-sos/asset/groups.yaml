    # 1.5 ABSTRACT DATA TYPES (ADT)


    An abstract data type (ADT) refers to a set of data values and associated operations
    that are specified accurately, independent of any particular implementation. With
    an ADT, we know what a specific data type can do, but how it actually does it
    is hidden. In broader terms, the ADT consists of a set of definitions that allow
    us to use the functions while hiding the implementation.


    The properties of an abstract data type are emphasized through the following examples.


    # Example 1.7 List Representation


    Consider a list L consisting of data items—1, 2, 3, 4, 5, 6, 7, 8, 9 as shown
    in Fig. 1.11(a). We can use any of four data structures to support L—a linear
    list, a matrix, a tree, or a graph, as given in Fig. 1.11(b), (c) and (d) respectively.


    ![](img/f1df4c31f1795198a6843c842acc2216_20_0.png)


    Fig. 1.11 Data structures which support a list


    Assume that we place the list on an ADT. The users should not be aware of the
    structure that we use, i.e., whether it is a tree, or graph or something else.
    As long as they are able to insert and retrieve data, it does not make a difference
    as to how we store the data.'
  - '[PAGE 21]


    # Example 1.8


    A shop maintains the list of customers, sales assistants and the average transactions
    on a day as given in Fig. 1.12.


    Suppose we need to write a program, which will help determine the number of sales
    assistants required to serve customers efficiently. Here, we will need to simulate
    the waiting line in the shop. This analysis will require the simulation of a queue.
    However, queues are not generally available in programming languages. Therefore,
    even if the queue type is available, we need some basic queue operations such
    as enqueuing and dequeuing, which are basically insertion and deletion operations,
    for the simulation.


    +   Here is what we can do in this situation:

    +   1. Write a program that simulates the queue, or

    +   2. Write a queue ADT that can solve any queue problem.


    If we choose the second option, we still need to write a program to simulate the
    shop application. However, doing that will actually be simpler and faster because
    we can concentrate on the application rather than the queue.


    | | Customers |

    |---|---|

    | 1 | Customers |

    | 2 | Customers |

    | 3 | Customers |


    | | Sales Assistant |

    |---|---|

    | 1 | Ray |

    | 2 | Reed |

    | 3 | Kelly |


    Fig. 1.12


    An abstract data type can thus be further defined as a data declaration packaged
    together with the operations that are meaningful for the data type. In other words,
    we encapsulate the data and the operations on the data, and then we hide them
    from the user.


    The user need not know the data structure to use the ADT. Considering Example
    1.8, the application program should have no knowledge of the data structure. All
    references to and manipulation of the data in the queue must be handled through
    defined interfaces in the structure. Allowing the application program to directly
    reference the data structure is a common fault in many implementations. This prevents
    the ADT from being fully portable to other applications.


    # Abstract Data Type Model


    A representation of the ADT model is shown in Fig. 1.13. Notice that there are
    two different parts of the ADT model—functions (public and private) and data structures.
    Both are contained within the ADT model itself, and do not come within the scope
    of the application program. On the other hand, data structures are available to
    all of the ADTs functions as required, and a function may call on any other function
    to accomplish its task. This means that data structures and functions are within
    the scope of each other.


    Data are entered, accessed, modified and deleted through the external


    ![](img/f1df4c31f1795198a6843c842acc2216_21_0.png)'
  - '[PAGE 22]


    application programming interface. This interface can only access the public functions.
    For each ADT operation, there is an algorithm that performs its specific task.
    The operation name and parameters are available to the application, and they provide
    the only interface to the application.

    When a list is controlled entirely by the program, it is implemented using simple
    structures. Note that it is not enough if we just encapsulate the structure in
    an ADT, it is also necessary for multiple versions of the structure to coexist.
    Therefore, we must hide the implementation from the user, while being able to
    store different data at the same time.

    Two basic structures, namely array and linked list, can be used to implement an
    ADT list.


    # 1.6 ALGORITHMS: COMPLEXITY, TIME-SPACE TRADEOFF


    An algorithm is a well-defined list of steps for solving a particular problem.
    One major purpose of this text is to develop efficient algorithms for the processing
    of our data. The time and space it uses are two major measures of the efficiency
    of an algorithm. The complexity of an algorithm is the function which gives the
    running time and/or space in terms of the input size. (The notion of complexity
    will be treated in Chapter 2.)


    Each of our algorithms will involve a particular data structure. Accordingly,
    we may not always be able to use the most efficient algorithm, since the choice
    of data structure depends on many things, including the type of data and the frequency
    with which various data operations are applied. Sometimes the choice of data structure
    involves a time-space tradeoff: by increasing the amount of space for storing
    the data, one may be able to reduce the time needed for processing the data, or
    vice versa. We illustrate these ideas with two examples.


    # Searching Algorithms


    Consider a membership file, as in Example 1.6, in which each record contains,
    among other data, the name and telephone number of its member. Suppose we are
    given the name of a member and we want to find his or her telephone number. One
    way to do this is to linearly search through the file, i.e., to apply the following
    algorithm:


    # Linear Search


    Search each record of the file, one at a time, until finding the given Name and
    hence the corresponding telephone number.


    First of all, it is clear that the time required to execute the algorithm is proportional
    to the number of comparisons. Also, assuming that each name in the file is equally
    likely to be picked, it is intuitively clear that the average number of comparisons
    for a file with n records is equal to n/2; that is, the complexity of the linear
    search algorithm is given by C(n) = n/2.


    The above algorithm would be impossible in practice if we were searching through
    a list consisting of thousands of names, as in a telephone book. However, if the
    names are sorted alphabetically, as in telephone books, then we can use an efficient
    algorithm called binary search. This algorithm is discussed in detail in Chapter
    4, but we briefly describe its general idea below.


    # Binary Search


    Compare the given Name with the name in the middle of the list; this tells which
    half of the list contains Name. Then compare Name with the name in the middle
    of the correct half to determine which quarter of the list contains Name. Continue
    the process until finding Name in the list.


    One can show that the complexity of the binary search algorithm is given by'
  - '[PAGE 23]


    C(n) = log2 n


    Thus, for example, one will not require more than 15 comparisons to find a given
    Name in a list containing 25 000 names.


    Although the binary search algorithm is a very efficient algorithm, it has some
    major drawbacks. Specifically, the algorithm assumes that one has direct access
    to the middle name in the list or a sublist. This means that the list must be
    stored in some type of array. Unfortunately, inserting an element in an array
    requires elements to be moved down the list, and deleting an element from an array
    requires element to be moved up the list.


    The telephone company solves the above problem by printing a new directory every
    year while keeping a separate temporary file for new telephone customers. That
    is, the telephone company updates its files every year. On the other hand, a bank
    may want to insert a new customer in its file almost instantaneously. Accordingly,
    a linearly sorted list may not be the best data structure for a bank.


    # An Example of Time-Space Tradeoff


    Suppose a file of records contains names, social security numbers and much additional
    information among its fields. Sorting the file alphabetically and running a binary
    search is a very efficient way to find the record for a given name. On the other
    hand, suppose we are given only the social security number of the person. Then
    we would have to do a linear search for the record, which is extremely time-consuming
    for a very large number of records. How can we solve such a problem? One way is
    to have another file which is sorted numerically according to social security
    number. This, however, would double the space required for storing the data. Another
    way, pictured in Fig. 1.14, is to have the main file sorted numerically by social
    security number and to have an auxiliary array with only two columns, the first
    column containing an alphabetized list of the names and the second column containing
    pointers which give the locations of the corresponding records in the main file.
    This is one way of solving the problem that is used frequently, since the additional
    space, containing only two columns, is minimal for the amount of extra information
    it provides.


