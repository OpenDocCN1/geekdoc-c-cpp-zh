    # 2.10 Suppose P(n) = a0 + a1n + a2n^2 + ... + amn^m; that is, suppose degree
    P(n) = m. Prove that P(n) = O(n^m).


    Let b0 = |a0|, b1 = |a1|, ..., bm = |am|. Then, for n >= 1,

    P(n) <= b0 + b1n + b2n^2 + ... + bm n^m

    = (b0/n^m + b1/n^(m-1) + ... + bm) n^m

    <= (b0 + b1 + ... + bm)n^m = M n^m

    where M = |a0| + |a1| + ... + |am|. Hence P(n) = O(n^m).

    For example, 5x^3 + 3x = O(x^3) and x^5 - 4 000 000x^2 = O(x^5).


    # 2.11 Suppose that T1(n) and T2(n) are the time complexities of two program fragments
    P1 and P2 where T1(n) = O(f(n)) and T2(n) = O(g(n)), what is the time complexity
    of program fragment P1 followed by P2?


    The time complexity of program fragment P1 followed by P2 is given by T1(n) +
    T2(n). To obtain T1(n) + T2(n), we have

    T1(n) <= c * f(n) for some positive number c and positive integer n1, such that
    n >= n1 and

    T2(n) <= d * g(n) for some positive number d and positive integer n2, such that
    n >= n2

    Let n0 = max(n1, n2). Then,

    T1(n) + T2(n) <= c * f(n) + d * g(n), for n > n0

    (i.e.) T1(n) + T2(n) <= (c + d) max(f(n), g(n)) for n > n0

    Hence T1(n) + T2(n) = O(max(f(n), g(n))). (This result is referred to as Rule
    of Sums of O notation)'
