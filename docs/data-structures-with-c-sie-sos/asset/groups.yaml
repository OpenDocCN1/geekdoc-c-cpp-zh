    \ then P does not appear in T and so INDEX = 0.\n\n- Algorithm 3.3: (Pattern Matching)\
    \ P and T are strings with lengths R and S, respectively, and are stored as arrays\
    \ with one character per element. This algorithm finds the INDEX of P in T.\n\
    - 1. [Initialize.] Set K := 1 and MAX := S - R + 1.\n- 2. Repeat Steps 3 to 5\
    \ while K <= MAX:\n- 3. Repeat for L = 1 to R: [Tests each character of P.] If\
    \ P[L] != T[K + L - 1], then: Go to Step 5. [End of inner loop.]\n- 4. [Success.]\
    \ Set INDEX = K, and Exit.\n- 5. Set K := K + 1. [End of Step 2 outer loop.]\n\
    - 6. [Failure.] Set INDEX = 0.\n- 7. Exit.\n"
