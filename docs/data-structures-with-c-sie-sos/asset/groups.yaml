    \n## Collision Resolution Techniques\n\nThere are two broad ways of collision\
    \ resolution:\n\n- (i) Open Addressing, where an array-based implemented.\n- (ii)\
    \ Separate Chaining, where an array of linked list implemented.\n\nOpen Addressing\
    \ includes:\n\n- Linear probing (linear search)\n- Quadratic probing (nonlinear\
    \ search), and\n- Double hashing (uses two hash functions).\n\n### (i) Open Addressing:\
    \ Linear Probing and Modifications\n\nSuppose that a new record \\( R \\) with\
    \ key \\( k \\) is to be added to the memory table \\( T \\), but that the memory\
    \ location with hash address \\( H(k) = h \\) is already filled. One natural way\
    \ to resolve the collision is to assign \\( R \\) to the first available location\
    \ following \\( T[h] \\). (We assume that the table \\( T \\) with \\( m \\) locations\
    \ is circular, so that \\( T[1] \\) comes after \\( T[m] \\).) Accordingly, with\
    \ such a collision procedure, we will search for the record \\( R \\) in the table\
    \ \\( T \\) by linearly searching the locations \\( T[h] \\), \\( T[h+1] \\),\
    \ \\( T[h+2] \\), ... until finding \\( R \\) or meeting an empty location, which\
    \ indicates an unsuccessful search.\n\nThe above collision resolution is called\
    \ _linear probing_. The average numbers of probes for a successful search and\
    \ for an unsuccessful search are known to be the following respective quantities:\n\
    \n```\n\\( S(\\lambda) = \\frac{1}{2}\\left(1 + \\frac{1}{1-\\lambda}\\right)\
    \ \\quad \\text{and} \\quad U(\\lambda) = \\frac{1}{2}\\left(1 + \\frac{1}{(1-\\\
    lambda)^2}\\right) \\)\n```\n\n(Here \\( \\lambda = n/m \\) is the load factor.)\n\
    \nThe table below summarizes the characteristics of the various open addressing\
    \ probing sequences.\n\n| probing sequence | primary clustering | capacity limit\
    \ | size restriction |\n|---|---|---|---|\n| linear probing | yes | none | none\
    \ |\n| quadratic probing | no | \\(\\lambda < \\frac{1}{2}\\) | M must be prime\
    \ |\n| double hashing | no | none | M must be prime |\n"
