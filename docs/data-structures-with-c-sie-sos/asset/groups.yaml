    \ 7 章中详细定义和讨论。这里我们通过两个示例说明它们的一些基本属性。\n\n### 示例 1.4 记录结构\n\n虽然文件可以通过一个或多个数组来维护，但记录（其中指示组项目和基本项目）最好通过树结构来描述。例如，员工人事记录可能包含以下数据项：\n\
    \n社会安全号码、姓名、地址、年龄、薪水、受赡养人\n\n但是，姓名可能是一个组项目，包含子项目 Last、First 和 MI（中间缩写）。另外，地址可能是一个组项目，包含子项目街道地址和区域地址，其中区域本身可能是一个包含子项目城市、州和邮政编码的组项目。这种层次结构在图\
