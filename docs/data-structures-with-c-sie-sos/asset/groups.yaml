    # 4.4 REPRESENTATION OF LINEAR ARRAYS IN MEMORY


    Let LA be a linear array in the memory of the computer. Recall that the memory
    of the computer is simply a sequence of addressed locations as pictured in Fig.
    4.3. Let us use the notation


    LOC(LA[K]) = address of the element LA[K] of the array LA


    ![](img/f1df4c31f1795198a6843c842acc2216_115_0.png)


    Fig. 4.3 Computer Memory


    As previously noted, the elements of LA are stored in successive memory cells.
    Accordingly, the computer does not need to keep track of the address of every
    element of LA, but needs to keep track only of the address of the first element
    of LA, denoted by


    Base(LA)


    and called the base address of LA. Using this address Base(LA), the computer calculates
    the address of any element of LA by the following formula:


    ```

    LOC (LA[K]) = Base(LA) + w(K – lower bound) (4.2)

    ```


    where w is the number of words per memory cell for the array LA. Observe that
    the time to calculate LOC(LA[K]) is essentially the same for any value of K. Furthermore,
    given any subscript K, one can locate and access the content of LA[K] without
    scanning any other element of LA.'
