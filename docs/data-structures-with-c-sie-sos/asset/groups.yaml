  mdcn: "\n\n## 1.5 抽象数据类型 (ADT)\n\n抽象数据类型（ADT）是指一组数据值及其相关操作，这些操作被准确地指定，与任何特定实现无关。使用ADT，我们知道特定数据类型可以做什么，但它实际如何做是隐藏的。更广义地说，ADT由一组定义组成，允许我们使用函数同时隐藏实现。\n\
    \n抽象数据类型的属性通过以下示例强调。\n\n### 示例 1.7 列表表示\n\n考虑一个由数据项1、2、3、4、5、6、7、8、9组成的列表L，如图1.11(a)所示。我们可以使用四种数据结构中的任何一种来支持L——线性列表、矩阵、树或图，分别如图1.11(b)、(c)和(d)所示。\n\
    \n![](img/f1df4c31f1795198a6843c842acc2216_20_0.png)\n\n图 1.11 支持列表的数据结构\n\n假设我们将列表放在ADT上。用户不应意识到我们使用的结构，即它是树、图还是其他东西。只要他们能够插入和检索数据，我们如何存储数据就无关紧要。\n\
    \n### 示例 1.8\n\n一家商店维护着客户、销售助理和一天平均交易的列表，如图1.12所示。\n\n假设我们需要编写一个程序，帮助确定为高效服务客户所需的销售助理数量。在这里，我们需要模拟商店中的等待队列。此分析将需要模拟队列。然而，队列在编程语言中通常不可用。因此，即使队列类型可用，我们也需要一些基本的队列操作，例如入队和出队，它们基本上是插入和删除操作，用于模拟。\n\
    \n- 在这种情况下，我们可以做以下事情：\n  1. 编写一个模拟队列的程序，或\n  2. 编写一个可以解决任何队列问题的队列ADT。\n\n如果我们选择第二个选项，我们仍然需要编写一个程序来模拟商店应用程序。然而，这样做实际上会更简单、更快，因为我们可以专注于应用程序而不是队列。\n\
    \n| | 客户 |\n|---|---|\n| 1 | 客户 |\n| 2 | 客户 |\n| 3 | 客户 |\n\n| | 销售助理 |\n|---|---|\n\
    | 1 | Ray |\n| 2 | Reed |\n| 3 | Kelly |\n\n图 1.12\n\n因此，抽象数据类型可以进一步定义为与对数据类型有意义的操作一起打包的数据声明。换句话说，我们将数据和对数据的操作封装起来，然后对用户隐藏它们。\n\
    \n用户无需了解数据结构即可使用ADT。考虑示例1.8，应用程序不应了解数据结构。对队列中数据的所有引用和操作必须通过结构中的定义接口来处理。允许应用程序直接引用数据结构是许多实现中的常见错误。这阻止了ADT完全可移植到其他应用程序。\n\
    \n### 抽象数据类型模型\n\nADT模型的表示如图1.13所示。请注意，ADT模型有两个不同的部分——函数（公共和私有）和数据结构。两者都包含在ADT模型本身内，不属于应用程序的范围。另一方面，数据结构根据需要可用于ADT的所有函数，并且一个函数可以调用任何其他函数来完成其任务。这意味着数据结构和函数在彼此的范围内。\n\
    \n数据通过外部应用程序编程接口输入、访问、修改和删除。该接口只能访问公共函数。对于每个ADT操作，都有一个执行其特定任务的算法。操作名称和参数可供应用程序使用，它们为应用程序提供了唯一的接口。\n\
    \n![](img/f1df4c31f1795198a6843c842acc2216_21_0.png)\n\n当列表完全由程序控制时，它使用简单结构实现。请注意，仅将结构封装在ADT中是不够的，还需要多个版本的结构能够共存。因此，我们必须对用户隐藏实现，同时能够同时存储不同的数据。\n\
    \n两种基本结构，即数组和链表，可用于实现ADT列表。\n\n## 1.6 算法：复杂度、时空权衡\n\n算法是解决特定问题的一组明确定义的步骤。本文的主要目的之一是为数据处理开发高效算法。算法使用的时间和空间是衡量算法效率的两个主要指标。算法的复杂度是一个函数，它以输入规模为参数给出运行时间和/或空间。（复杂度的概念将在第2章中讨论。）\n\
    \n我们的每个算法都将涉及特定的数据结构。因此，我们可能并不总能使用最高效的算法，因为数据结构的选择取决于许多因素，包括数据类型以及各种数据操作应用的频率。有时，数据结构的选择涉及时空权衡：通过增加存储数据的空间量，可以减少处理数据所需的时间，或者反之亦然。我们用两个例子来说明这些想法。\n\
    \n### 搜索算法\n\n考虑一个会员文件，如示例1.6所示，其中每条记录包含成员姓名和电话号码等数据。假设我们已知某个成员的姓名，想要查找其电话号码。一种方法是线性搜索文件，即应用以下算法：\n\
    \n### 线性搜索\n\n逐条搜索文件中的每条记录，一次一条，直到找到给定的姓名及其对应的电话号码。\n\n首先，很明显，执行算法所需的时间与比较次数成正比。此外，假设文件中的每个名字被选中的可能性相同，可以直观地看出，包含n条记录的文件的平均比较次数等于n/2；也就是说，线性搜索算法的复杂度由C(n)\
    \ = n/2给出。\n\n如果我们要搜索包含成千上万个姓名的列表（如电话簿），上述算法在实践中是不可能的。但是，如果姓名按字母顺序排序（如电话簿），则可以使用一种称为二分查找的高效算法。该算法在第4章中详细讨论，但我们下面简要描述其一般思想。\n\
    \n### 二分查找\n\n将给定的姓名与列表中间的姓名进行比较；这告诉我们列表的哪一半包含姓名。然后将姓名与正确一半中间的姓名进行比较，以确定列表的哪一部分包含姓名。继续此过程，直到在列表中找到姓名。\n\
    \n可以证明，二分查找算法的复杂度由以下公式给出：\n\nC(n) = log₂ n\n\n例如，在包含25,000个姓名的列表中查找给定姓名，所需的比较次数不会超过15次。\n\
    \n尽管二分查找算法是一种非常高效的算法，但它有一些主要缺点。具体来说，该算法假设可以直接访问列表或子列表中的中间姓名。这意味着列表必须存储在某种类型的数组中。不幸的是，在数组中插入元素需要将元素向下移动，从数组中删除元素需要将元素向上移动。\n\
    \n电话公司通过每年印刷新目录，同时为新电话客户保存单独的临时文件来解决上述问题。也就是说，电话公司每年更新其文件。另一方面，银行可能希望几乎即时地在其文件中插入新客户。因此，线性排序列表可能不是银行的最佳数据结构。\n\
    \n### 时空权衡示例\n\n假设记录文件包含姓名、社会安全号码及其字段中的许多其他信息。按字母顺序对文件进行排序并运行二分查找是查找给定姓名记录的一种非常高效的方法。另一方面，假设我们只知道该人的社会安全号码。那么我们将不得不对记录进行线性搜索，对于非常大量的记录来说，这极其耗时。如何解决此类问题？一种方法是拥有另一个按社会安全号码数值排序的文件。然而，这将使存储数据所需的空间翻倍。另一种方法（如图1.14所示）是将主文件按社会安全号码数值排序，并拥有一个仅包含两列的辅助数组，第一列包含按字母顺序排列的姓名列表，第二列包含指针，指示主文件中相应记录的位置。这是一种经常使用的解决问题的方法，因为额外的空间仅包含两列，对于它提供的额外信息量来说是微乎其微的。\n\
    \n![](img/f1df4c31f1795198a6843c842acc2216_23_0.png)\n\n"
