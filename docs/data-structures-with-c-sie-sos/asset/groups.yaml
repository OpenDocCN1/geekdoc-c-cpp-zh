    LOC1 of the largest element and the location LOC2 of the second largest element
    in an array DATA with \( n > 1 \) elements.


    (b) Why not let FIND also find the values of the largest and second largest elements?


    (a) The elements of DATA are examined one by one. During the execution of the
    procedure, FIRST and SECOND will denote, respectively, the values of the largest
    and second largest elements that have already been examined. Each new element
    DATA[K] is tested as follows. If


    SECOND <= FIRST < DATA[K]


    then FIRST becomes the new SECOND element and DATA[K] becomes the new FIRST element.
    On the other hand, if


    SECOND < DATA[K] <= FIRST


    then DATA[K] becomes the new SECOND element. Initially, set FIRST := DATA[1] and
    SECOND := DATA[2], and check whether or not they are in the right order. A formal
    presentation of the procedure follows:


    ### Procedure P2.8: FIND(DATA, N, LOC1, LOC2)


    1. Set FIRST := DATA[1], SECOND := DATA[2], LOC1 := 1, LOC2 := 2.

    2. [Are FIRST and SECOND initially correct?]

    If FIRST < SECOND, then:

    (a) Interchange FIRST and SECOND,

    (b) Set LOC1 := 2 and LOC2 := 1.

    [End of If structure.]

    3. Repeat for K = 3 to N:

    If FIRST < DATA[K], then:

    (a) Set SECOND := FIRST and FIRST := DATA[K].

    (b) Set LOC2 := LOC1 and LOC1 := K.

    Else if SECOND < DATA[K], then:

    Set SECOND := DATA[K] and LOC2 := K.

    [End of If structure.]

    [End of loop.]

    4. Return.


