    ### 3.1 INTRODUCTION


    Historically, computers were first used for processing numerical data. Today,
    computers are frequently used for processing nonnumerical data, called character
    data. This chapter discusses how such data are stored and processed by the computer.


    One of the primary applications of computers today is in the field of word processing.
    Such processing usually involves some type of pattern matching, as in checking
    to see if a particular word S appears in a given text T. We discuss this pattern
    matching problem in detail and, moreover, present two different pattern matching
    algorithms. The complexity of these algorithms is also investigated.


    Computer terminology usually uses the term “string” for a sequence of characters
    rather than the term “word,” since “word” has another meaning in computer science.
    For this reason, many texts sometimes use the expression “string processing,”
    “string manipulation” or “text editing” instead of the expression “word processing.”


    The material in this chapter is essentially tangential and independent of the
    rest of the text. Accordingly, the reader or instructor may choose to omit this
    chapter on a first reading or cover this chapter at a later time.


