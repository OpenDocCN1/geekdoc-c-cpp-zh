  mdcn: "\n\n## 致特别印度版读者的话\n\n数据结构是计算机科学与工程学科中至关重要的一门学科。它是计算机中以特定方式存储和组织数据的逻辑与数学模型，用于设计和实现高效算法及程序开发。\n\
    \n不同种类的数据结构（如数组、链表、栈、队列等）适用于不同类型的应用。某些特定的数据结构是许多高效算法的重要组成部分，并使管理海量数据成为可能，例如大型数据库和互联网索引服务。例如，B树特别适合用于数据库的实现，而编译器实现通常使用哈希表来查找标识符。\n\
    \n如今，C、C++和Java等多种编程语言被用于实现数据结构的概念，其中C语言仍然是全球程序员的首选语言。本书在每一章中都使用C语言提供算法和伪代码的实现，从而使读者更容易理解理论。文中包含的选择题旨在帮助学生练习所学概念。因此，我们希望本书能成为初学者优秀的自学和考试准备材料。\n\
    \n## 主要特点\n\n- 使用C编程语言演示与数据结构概念相关的算法和过程的实现\n- 对重要主题提供简化的呈现——数组、递归、链表、队列、树、图、排序和搜索方法、哈希\n\
    - 数组、字符串、链表、栈和队列的ADT表示\n- 对算法复杂度表示法、使用数组和链表表示多项式、动态内存管理、约瑟夫问题、链表和队列操作、栈、队列和树的应用、生成树、AVL树、m路树、B树、B+树、红黑树、排序算法、哈希表等提供恰当的讨论\n\
    - 出色的教学特性：\n  - 180个解答示例\n  - 86个C程序\n  - 175个解答问题\n  - 160个补充问题（未解答）\n  - 100个编程问题\n\
    \  - 135道选择题\n\n## 章节亮点\n\n第1章概述了数据结构，并讨论了数据结构的分类、抽象数据类型（ADT）、算法复杂度，而第2章则涵盖了数学和算法表示法、控制结构、子算法、变量和数据类型。\n\
    \n第3章讨论了字符串处理、字符串操作以及作为ADT的字符串。本章还讨论了单词或文本处理。\n\n第4章解释了数组、记录和指针。本章涵盖了作为ADT的数组、存储表示、使用数组表示多项式、多项式加法、动态内存管理指针、记录和矩阵等主题。\n\
    \n第5章关于链表。它包括作为ADT的链表、使用链表的操作、带头链表、双向链表、循环链表、垃圾压缩、约瑟夫问题及其解、使用链表表示和操作多项式以及伙伴系统（简要介绍）。\n\
    \n第6章讨论了栈、队列和递归及其应用。本章涉及栈和队列的数组、链表和ADT表示、使用栈的波兰表示法、队列操作、循环队列、双端队列、优先队列、迷宫问题、队列模拟、数据分类以及十进制到二进制的转换。\n\
    \n第7章关于二叉树。它提供了关于二叉树遍历、线索二叉树、二叉搜索树、平衡二叉树、AVL搜索树、m路搜索树、B树、B+树、红黑树以及树的应用（表达式树；游戏树）的信息。\n\
    \n第8章介绍了图及其应用的概念。这里涵盖了生成树、最小生成树算法——Prim算法和Kruskal算法、有向图和双连通图。\n\n最后，第9章讨论了希尔排序、K路归并排序、平衡归并排序、多相归并排序、两路归并排序等排序算法，以及搜索和排序中的效率考虑。本章还涵盖了有序和无序文件的合并、排序顺序和排序稳定性、哈希表和哈希函数等主题。\n\
    \n## 沙姆大纲系列的优势\n\n作为一本高效学习指南，沙姆大纲系列帮助你缩短学习时间、提升解题技巧并在考试中发挥个人最佳水平。它们以便捷且简洁的格式提供老师期望你掌握的信息——而不会用不必要的细节让你感到压力过大。你将获得学科的完整概述，并配有大量练习题来测试你的技能。沙姆大纲系列非常适合按自己的节奏进行自学，使你具备理解和回忆所有需要记住的重要事实的能力。\n\
