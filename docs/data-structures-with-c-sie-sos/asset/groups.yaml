    那么我们可以写


    ```

    f(n) = O(g(n))

    ```


    读作“f(n) 是 g(n) 阶”。对于任何次数为 m 的多项式 P(n)，我们在解答问题 2.10 中表明 P(n) = O(n^m)；例如，


    ```

    8n^3 - 576n^2 + 832n - 248 = O(n^3)

    ```


    我们也可以写


    ```

    f(n) = h(n) + O(g(n))   when   f(n) - h(n) = O(g(n))

    ```


    （这被称为“大 O”表示法，因为 f(n) = o(g(n)) 有完全不同的含义。）


    为了说明这种表示法的便利性，我们给出一些著名搜索和排序算法的复杂度：


    - (a) 线性搜索：O(n)

    - (b) 二分搜索：O(log n)

    - (c) 冒泡排序：O(n²)

    - (d) 归并排序：O(n log n)


    这些结果将在第 9 章（排序与搜索）中讨论。


    ## 2.6 算法复杂度的其他渐近表示法 Ω、Θ、o


    “大 O”表示法为 f(n) 定义了一个上界函数 g(n)，该函数表示算法在输入特征 n 上的时间/空间复杂度。还有其他渐近表示法，如 Ω、Θ、o，它们也用于为函数
    f(n) 提供界限。


    ### Omega 表示法（Ω）


    当函数 g(n) 为函数 f(n) 定义一个下界时，使用 Omega 表示法。


    ### 定义


    f(n) = Ω(g(n))（读作 f of n is omega of g of n），当且仅当存在一个正整数 n₀ 和一个正数 M，使得对所有 n ≥
    n₀ 都有 |f(n)| ≥ M|g(n)|。


    对于 f(n) = 18n + 9，对所有 n 都有 f(n) > 18n，因此 f(n) = Ω(n)。同样，对于 f(n) = 90n² + 18n +
    6，当 n ≥ 0 时 f(n) > 90n²，因此 f(n) = Ω(n²)。


    对于 f(n) = Ω(g(n))，g(n) 是一个下界函数，可能存在多个这样的函数，但应选择一个尽可能大的关于 n 的函数（使 Ω 的定义成立）作为 g(n)。因此，例如，f(n)
    = 5n + 1 既可得出 f(n) = Ω(n) 也可得出 f(n) = Ω(1)。然而，我们从不认为后者是正确的，因为 f(n) = Ω(n) 表示满足
    Ω 定义的最大可能的关于 n 的函数，因此信息量更大。


    ### Theta 表示法（Θ）


    当函数 f(n) 同时被函数 g(n) 从上方和下方界定时，使用 Theta 表示法。


    ### 定义


    f(n) = Θ(g(n))（读作 f of n is theta of g of n），当且仅当存在两个正常数 c₁ 和 c₂，以及一个正整数 n₀，使得对所有
    n ≥ n₀ 都有 c₁|g(n)| ≤ |f(n)| ≤ c₂|g(n)|。


    由定义可知，对于所有 n（n ≥ n₀），函数 g(n) 既是 f(n) 的上界也是下界。换句话说，f(n) 满足 f(n) = O(g(n)) 和 f(n)
    = Ω(g(n))。


    对于 f(n) = 18n + 9，由于 f(n) > 18n 且当 n ≥ 1 时 f(n) ≤ 27n，我们分别得到 f(n) = Ω(n) 和 f(n)
    = O(n)（n ≥ 1）。因此 f(n) = Θ(n)。同样，16n² + 30n – 90 = Θ(n²) 且 7·2ⁿ + 30n = Θ(2ⁿ)。


    ### Little Oh 表示法（o）


    ### 定义


    f(n) = o(g(n))（读作 f of n is little oh of g of n），当且仅当 f(n) = O(g(n)) 且 f(n) ≠
    Ω(g(n))。


    对于 f(n) = 18n + 9，我们有 f(n) = O(n²) 但 f(n) ≠ Ω(n²)。因此 f(n) = o(n²)。然而，f(n) ≠ o(n)。


    ## 2.7 子算法


    子算法是一个完整且独立定义的算法模块，由某个主算法或其他子算法使用（或调用）。子算法从源（调用）算法接收称为参数的值；执行计算；然后将结果返回给调用算法。子算法被独立定义，以便它可以被许多不同的算法调用，或在同一算法的不同时间被调用。算法与子算法之间的关系类似于编程语言中主程序与子程序之间的关系。


    子算法格式与算法格式的主要区别在于，子算法通常具有如下形式的标题


    ```

    NAME(PAR₁, PAR₂, ..., PARₖ)

    ```


    这里 NAME 是子算法的名称，在调用子算法时使用；PAR₁, PAR₂, ..., PARₖ 是用于在子算法和调用算法之间传输数据的参数。


    另一个区别是，子算法将有一个 Return 语句而不是 Exit 语句；这强调当子算法执行完成时，控制权会转移回调用程序。


    子算法分为两大类：函数子算法和过程子算法。下面将通过示例考察这两种子算法的相似之处和区别。子算法之间的一个主要区别是，函数子算法只向调用算法返回一个值，而过程子算法可以返回多个值。


    ### 示例 2.9


    以下函数子算法 MEAN 求三个数 A、B 和 C 的平均值 AVE。


    ```

    Function 2.5: MEAN(A, B, C)

    1. Set AVE := (A + B + C)/3.

    2. Return(AVE).

    ```


    请注意，MEAN 是子算法的名称，A、B 和 C 是参数。Return 语句在括号中包含变量 AVE，其值将返回给调用程序。


    子算法 MEAN 的调用方式与函数子程序被调用程序调用的方式相同。例如，假设一个算法包含语句


    ```

    Set TEST := MEAN(T₁, T₂, T₃)

    ```


    其中 T₁、T₂ 和 T₃ 是测试分数。参数值 T₁、T₂ 和 T₃ 传递给子算法中的参数 A、B、C，执行子算法 MEAN，然后将 AVE 的值返回给程序，并在语句中替换
    MEAN(T₁, T₂, T₃)。因此，T₁、T₂ 和 T₃ 的平均值被赋给 TEST。


    以下 C 程序使用 MEAN 函数计算三个数 A、B 和 C 的平均值 AVE：


    ### 程序 2.5


    ```

    #include <stdio.h>

    #include <conio.h>

    void main()

    {

    int A,B,C;

    float MEAN(int,int,int);

    clrscr();

    printf("Enter the values of A, B and C: ");

    scanf("%d %d %d",&A,&B,&C);

    printf("The average of %d, %d and %d is: %.2f",A,B,C,MEAN(A,B,C));

    getch();

    }

    float MEAN(int T1,int T2,int T3)

    {

    float AVE;

    AVE=(T1+T2+T3)/3;

    return(AVE);

    }

    Output:

    Enter the values of A, B and C: 22

    36

    8

    The average of 22, 36 and 8 is: 22.00

    ```


