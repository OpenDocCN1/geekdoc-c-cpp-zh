    # A Word to the Readers of the Special Indian Edition


    Data Structures is a subject of primary importance to the discipline of Computer
    Science and Engineering. It is a logical and mathematical model of storing and
    organizing data in a particular way in a computer, required for designing and
    implementing efficient algorithms and program development.


    Different kinds of data structures like arrays, linked lists, stacks, queues,
    etc., are suited to different kinds of applications. Some specific data structures
    are essential ingredients of many efficient algorithms, and make possible the
    management of huge amounts of data, such as large databases and Internet indexing
    services. For example, B-trees are particularly well-suited for implementation
    of databases, while compiler implementations usually use hash tables to look up
    identifiers.


    Nowadays, various programming languages like C, C++ and Java are used to implement
    the concepts of Data Structures, of which C remains the language of choice for
    programmers across the world. This book provides the implementation of algorithms
    and pseudocodes using C in every chapter, thereby, making it easier for the readers
    to comprehend the theory. Multiple-Choice Questions included in the text are aimed
    to help students practice the learnt concepts. Thus, we hope that this book will
    be an excellent self-teach and test-preparation material for beginners.


    # Salient Features


    +   - Demonstrates the implementation of algorithms and procedures related to
    data-structure concepts using the C programming language

    +   - Offers simplified presentation for important topics—Arrays, Recursion, Linked
    Lists, Queues, Trees, Graphs, Sorting and Searching Methods, Hashing

    +   - ADT representation of Arrays, Strings, Linked Lists, Stacks and Queues

    +   - Provide apt discussions on notations of Algorithm complexity, Representation
    of polynomials using arrays, and linked lists, Dynamic memory management, Josephus
    problem, Linked list and queue operations, Application of stacks, queues and trees,
    Spanning trees. AVL-trees, m-way trees, B-trees, B+-trees, Red-black trees, Sorting
    algorithm, Hash table

    +   - Excellent pedagogical features:

    +     - 180 Solved Examples

    +     - 86 C Programs

    +     - 175 Solved Problems

    +     - 160 Supplementary Problems (unsolved)

    +     - 100 Programming Problems

    +     - 135 Multiple-Choice Questions'
  - '[PAGE 7]


    # Chapter Highlights


    Chapter 1 gives an overview of data structures and discusses classification of
    data structures, Abstract Data types (ADT), algorithm complexity while mathematical
    and algorithmic notations, control structures, subalgorithms, variables and datatypes
    are covered in Chapter 2.


    String processing, string operations and strings as ADT are taken up in Chapter
    3. Word or text processing are also discussed in this chapter.


    Chapter 4 explains arrays, records and pointers. Topics like arrays as ADT, storage
    representations, representation of polynomials using arrays, addition of polynomials,
    dynamic memory management pointers, records and matrices are covered in this chapter.


    Chapter 5 is on linked lists. It includes linked lists as ADT, operations using
    linked lists, header linked lists, doubly linked lists, circularly linked lists,
    garbage compaction, Josephus problem and its solution, representation and manipulations
    polynomials using linked lists and buddy systems (in brief).


    Stacks, queues and recursion and their applications are discussed in Chapter 6.
    Array, linked list and ADT representation of stacks and queues, polish notations
    using stacks, queue operations, circular queues, deques, priority queues, maze
    problem, simulation of queues, categorizing data and decimal to binary conversion
    are dealt in this chapter.


    Chapter 7 is on binary trees. It provides information on traversal of binary trees,
    threaded binary trees, binary search trees, balanced binary trees, AVL search
    trees, m-way search trees, B-trees, B+-trees, red-black trees and applications
    of trees (expression Trees; game Trees).


    Chapter 8 presents the concepts of graphs and their applications. Spanning trees,
    Minimum spanning tree algorithms—Prim’s and Kruskal’s algorithms, Directed and
    bi-connected graphs are covered here.


    Finally, sorting algorithms such as shell sort, K-way merge sort, balanced merge
    sort, polyphase merge sort, two-way merge sort, and efficiency considerations
    in searching and sorting are discussed in Chapter 9. Topics such as merging ordered
    and unordered files, sort order and sort stability, hash table and hash functions
    are also covered in this chapter.


    # The Schaum''s Outlines Advantage


    A high-performance study guide, Schaum’s Outlines help you cut study time, hone
    problem-solving skills and achieve your personal best in exams. They give you
    the information your teachers expect you to know in a handy and succinct format—without
    overwhelming you with unnecessary details. You get a complete overview of the
    subject, plus plenty of practice exercises to test your skills. Schaum’s is ideal
    for self-study at your own pace, equipping you to understand and recall all important
    facts that you need to remember.


    # Acknowledgements


    A number of experts have taken out time from their busy schedules to provide valuable
    feedback about the book. Our heartfelt gratitude goes out to those whose names
    are given in the next page.'
