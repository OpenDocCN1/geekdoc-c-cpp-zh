    # 3.8 PATTERN MATCHING ALGORITHMS


    Pattern matching is the problem of deciding whether or not a given string pattern
    P appears in a string text T. We assume that the length of P does not exceed the
    length of T. This section discusses two pattern matching algorithms. We also discuss
    the complexity of the algorithms so we can compare their efficiencies.


    Remark: During the discussion of pattern matching algorithms, characters are sometimes
    denoted by lowercase letters (a, b, c, ...) and exponents may be used to denote
    repetition; e.g.,


    ```

    $a^2b^3ab^2$ for $aabbbabb$ and $(cd)^3$ for $cdcdcd$

    ```


    In addition, the empty string may be denoted by $\Lambda$, the Greek letter lambda,
    and the concatenation of strings X and Y may be denoted by X $\cdot$ Y or, simply,
    XY.


    # First Pattern Matching Algorithm


    The first pattern matching algorithm is the obvious one in which we compare a
    given pattern P with each of the substrings of T, moving from left to right, until
    we get a match. In detail, let


    ```

    $W_K = SUBSTRING(T, K, LENGTH(P))$

    ```'
