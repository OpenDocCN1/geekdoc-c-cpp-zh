    # Replacement


    Suppose in a given text T we want to replace the first occurrence of a pattern
    P1 by a pattern P2. We will denote this operation by


    ```

    REPLACE(text, pattern1, pattern2)

    ```


    For example


    ```

    REPLACE(''XABYABZ'', ''AB'', ''C'') = ''XCYABZ''

    REPLACE(''XABYABZ'' , ''BA'', ''C'') = ''XABYABZ''

    ```


    In the second case, the pattern BA does not occur, and hence there is no change.


    We note that this REPLACE function can be expressed as a deletion followed by
    an insertion if we use the preceding DELETE and INSERT functions. Specifically,
    the REPLACE function can be executed by using the following three steps:


    ```

    K := INDEX(T, P1)

    T := DELETE(T, K, LENGTH(P1))

    INSERT(T, K, P2)

    ```


    The first two steps delete P1 from T, and the third step inserts P2 in the position
    K from which P1 was deleted.


    Suppose a text T and patterns P and Q are in the memory of a computer. Suppose
    we want to replace every occurrence of the pattern P in T by the pattern Q. This
    might be accomplished by repeatedly applying


    ```

    REPLACE(T, P, Q)

    ```'
