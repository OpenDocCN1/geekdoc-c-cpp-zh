    (b) Suppose ITEM = 85. The binary search for ITEM is pictured in Fig. 4.8. Here
    BEG, END and MID will have the following successive values:


    +   1. Again initially, BEG = 1, END = 13, MID = 7 and DATA[MID] = 55.

    +   2. Since 85 > 55, BEG has its value changed by BEG = MID + 1 = 8. Hence MID
    = INT[(8 + 13)/2] = 10 and so DATA[MID] = 77

    +   3. Since 85 > 77, BEG has its value changed by BEG = MID + 1 = 11. Hence MID
    = INT[(11 + 13)/2] = 12 and so DATA[MID] = 88

    +   4. Since 85 < 88, END has its value changed by END = MID - 1 = 11. Hence MID
    = INT[(11 + 11)/2] = 11 and so DATA[MID] = 80


    (Observe that now BEG = END = MID = 11.)


    Since 85 > 80, BEG has its value changed by BEG = MID + 1 = 12. But now BEG >
    END. Hence ITEM does not belong to DATA.


    ![](img/f1df4c31f1795198a6843c842acc2216_135_0.png)


    # Complexity of the Binary Search Algorithm


    The complexity is measured by the number f(n) of comparisons to locate ITEM in
    DATA where DATA contains n elements. Observe that each comparison reduces the
    sample size in half. Hence we require at most f(n) comparisons to locate ITEM
    where


    ```

    2^{f(n)} > n or equivalently f(n) = \lfloor \log_2 n \rfloor + 1

    ```


    That is, the running time for the worst case is approximately equal to log2 n.
    One can also show that the running time for the average case is approximately
    equal to the running time for the worst case.


    # Example 4.11


    Suppose DATA contains 1 000 000 elements. Observe that 2^{10} = 1024 > 1000 and
    hence 2^{20} > 1000^2 = 1 000 000 Accordingly, using the binary search algorithm,
    one requires only about 20 comparisons to find the location of an item in a data
    array with 1 000 000 elements.


    # Limitations of the Binary Search Algorithm


    Since the binary search algorithm is very efficient (e.g., it requires only about
    20 comparisons with an initial list of 1 000 000 elements), why would one want
    to use any other search algorithm?'
