    \ to the particular attribute.\n\nThe term “information” is sometimes used for\
    \ data with given attributes, or, in other words, meaningful or processed data.\n\
    \nThe way that data are organized into the hierarchy of fields, records and files\
    \ reflects the relationship between attributes, entities and entity sets. That\
    \ is, a field is a single elementary unit of information representing an attribute\
    \ of an entity, a record is the collection of field values of a given entity and\
    \ a file is the collection of records of the entities in a given entity set.\n\
    \nEach record in a file may contain many field items, but the value in a certain\
    \ field may uniquely determine the record in the file. Such a field K is called\
    \ a primary key, and the values k1, k2, ... in such a field are called keys or\
    \ key values.\n\n### Example 1.1\n\n- (a) Suppose an automobile dealership maintains\
    \ an inventory file where each record contains the following data:\n\n  Serial\
    \ Number, Type, Year, Price, Accessories\n\n  The Serial Number field can serve\
    \ as a primary key for the file, since each automobile has a unique serial number.\n\
    \n- (b) Suppose an organization maintains a membership file where each record\
    \ contains the following data:\n\n  Name, Address, Telephone Number, Dues Owed\n\
    \n  Although there are four data items, Name and Address may be group items. Here\
    \ the Name field is a primary key. Note that the Address and Telephone Number\
    \ fields may not serve as primary keys, since some members may belong to the same\
    \ family and have the same address and telephone number.\n\nRecords may also be\
    \ classified according to length. A file can have fixed-length records or variable-length\
    \ records. In fixed-length records, all the records contain the same data items\
    \ with the same amount of space assigned to each data item. In variable-length\
    \ records, file records may contain different lengths. For example, student records\
    \ usually have variable lengths, since different students take different numbers\
    \ of courses. Usually, variable-length records have a minimum and a maximum length.\n\
    \nThe above organization of data into fields, records and files may not be complex\
    \ enough to maintain and efficiently process certain collections of data. For\
    \ this reason, data are also organized into more complex types of structures.\
    \ The study of such data structures, which forms the subject matter of this text,\
    \ includes the following three steps:\n\n- 1. Logical or mathematical description\
    \ of the structure\n- 2. Implementation of the structure on a computer\n- 3. Quantitative\
    \ analysis of the structure, which includes determining the amount of memory needed\
    \ to store the structure and the time required to process the structure.\n\nThe\
    \ next section introduces us to some of these data structures.\n\nRemark: The\
    \ second and third of the steps in the study of data structures depend on whether\
    \ the data are stored (a) in the main (primary) memory of the computer or (b)\
    \ in a secondary (external) storage unit. This text will mainly cover the first\
    \ case. This means that, given the address of a memory location, the time required\
    \ to access the content of the memory cell does not depend on the particular cell\
    \ or upon the previous cell accessed. The second case, called file management\
    \ or data base management, is a subject unto itself and lies beyond the scope\
    \ of this text.\n\n### 1.3 DATA STRUCTURES\n\nData may be organized in many different\
    \ ways; the logical or mathematical model of a particular organization of data\
    \ is called a data structure. The choice of a particular data model depends on\
    \ two considerations. First, it must be rich enough in structure to mirror the\
    \ actual relationships of the data in the real world. On the other hand, the structure\
    \ should be simple enough that one can effectively process the data when necessary.\
    \ This section will introduce us to some of the data structures which will be\
    \ discussed in detail later in the text.\n\n### Classification of Data Structures\n\
    \nData structures are generally classified into primitive and non-primitive data\
    \ structures. Basic data types such as integer, real, character and boolean are\
    \ known as primitive data structures. These data types consist of characters that\
    \ cannot be divided, and hence they are also called simple data types.\n\nThe\
    \ simplest example of non-primitive data structure is the processing of complex\
    \ numbers. Very few computers are capable of doing arithmetic on complex numbers.\
    \ Linked-lists, stacks, queues, trees and graphs are examples of non-primitive\
    \ data structures. Figure 1.1 shows the classification of data structures.\n\n\
    ![](img/f1df4c31f1795198a6843c842acc2216_13_0.png)\n\nFig. 1.1 Classification\
    \ of Data Structures\n\nBased on the structure and arrangement of data, non-primitive\
    \ data structures are further classified into linear and non-linear.\n\nA data\
    \ structure is said to be linear if its elements form a sequence or a linear list.\
    \ In linear data structures, the data is arranged in a linear fashion although\
    \ the way they are stored in memory need not be sequential. Arrays, linked lists,\
    \ stacks and queues are examples of linear data structures.\n\nConversely, a data\
    \ structure is said to be non-linear if the data is not arranged in sequence.\
    \ The insertion and deletion of data is therefore not possible in a linear fashion.\
    \ Trees and graphs are examples of non-linear data structures.\n\n### Arrays\n\
    \nThe simplest type of data structure is a *linear* (or *one-dimensional*) array.\
    \ By a *linear array*, we mean a list of a finite number $n$ of similar data elements\
    \ referenced respectively by a set of $n$ consecutive numbers, usually 1, 2, 3,\
    \ ..., $n$. If we choose the name $A$ for the array, then the elements of $A$\
    \ are denoted by subscript notation\n\n```\n$a_1, a_2, a_3, ..., a_n$\n```\n\n\
    or by the parenthesis notation\n\n```\n$A(1), A(2), A(3), ..., A(N)$\n```\n\n\
    or by the bracket notation\n\n```\n$A[1], A[2], A[3], ..., A[N]$\n```\n\nRegardless\
    \ of the notation, the number $K$ in $A[K]$ is called a *subscript* and $A[K]$\
    \ is called a *subscripted variable*.\n\n*Remark:* The parentheses notation and\
    \ the bracket notation are frequently used when the array name consists of more\
    \ than one letter or when the array name appears in an algorithm. When using this\
    \ notation we will use ordinary uppercase letters for the name and subscripts\
    \ as indicated above by the $A$ and $N$. Otherwise, we may use the usual subscript\
    \ notation of italics for the name and subscripts and lowercase letters for the\
    \ subscripts as indicated above by the $a$ and $n$. The former notation follows\
    \ the practice of computer-oriented texts whereas the latter notation follows\
    \ the practice of mathematics in print.\n\n### Example 1.2\n\nA linear array STUDENT\
    \ consisting of the names of six students is pictured in Fig. 1.2. Here STUDENT[1]\
    \ denotes John Brown, STUDENT[2] denotes Sandra Gold, and so on.\nLinear arrays\
    \ are called one-dimensional arrays because each element in such an array is referenced\
    \ by one subscript. A *two-dimensional array* is a collection of similar data\
    \ elements where each element is referenced by two subscripts. (Such arrays are\
    \ called *matrices* in mathematics, and *tables* in business applications.) Multidimensional\
    \ arrays are defined analogously. Arrays will be covered in detail in Chapter\
    \ 4.\n\n| | STUDENT |\n|---|---|\n| 1 | John Brown |\n| 2 | Sandra Gold |\n| 3\
    \ | Tom Jones |\n| 4 | June Kelly |\n| 5 | Mary Reed |\n| 6 | Alan Smith |\n\n\
    Fig. 1.2\n\n### Example 1.3\n\nA chain of 28 stores, each store having 4 departments,\
    \ may list its weekly sales (to the nearest dollar) as in Fig. 1.3. Such data\
    \ can be stored in the computer using a two-dimensional array in which the first\
    \ subscript denotes the store and the second subscript the department. If SALES\
    \ is the name given to the array, then\n\n```\nSALES[1, 1] = 2872, SALES[1, 2]\
    \ = 805, SALES[1, 3] = 3211, ..., SALES[28, 4] = 982\n```\n"
  mdcn: "\n\n## 第 1 章\n\n## 简介与概述\n\n### 1.1 简介\n\n本章介绍数据结构的主题，并概述本文的内容。将定义基本术语和概念，并提供相关示例。将介绍数据组织和某些数据结构的概述，并讨论应用于这些数据结构的不同操作。最后，我们将介绍算法及其复杂性的概念，并讨论为特定问题选择特定算法和数据结构时可能出现的时间-空间权衡。\n\
    \n### 1.2 基本术语；基本数据组织\n\n数据仅仅是值或值的集合。数据项是指值的单个单元。被划分为子项的数据项称为组项；未被划分的称为基本项。例如，员工的姓名可以分为三个子项——名、中间名首字母和姓，但社会安全号码通常被视为单个项目。\n\
    \n数据集合通常组织为字段、记录和文件的层次结构。为了使这些术语更加精确，我们引入一些额外的术语。\n\n实体是具有某些属性或特征的事物，这些属性或特征可以赋予值。值本身可以是数值或非数值。例如，以下是给定组织中员工实体的可能属性及其对应的值：\n\
    \n| 属性： | 姓名 | 年龄 | 性别 | 社会安全号码 |\n|---|---|---|---|---|\n| 值： | ROHLAND, GAIL\
    \ | 34 | F | 134-24-5533 |\n\n具有相似属性（例如，组织中的所有员工）的实体构成实体集。实体集的每个属性都有一个值域，即可以分配给该特定属性的所有可能值的集合。\n\
    \n术语“信息”有时用于指代具有给定属性的数据，换句话说，是有意义的或经过处理的数据。\n\n数据组织为字段、记录和文件的层次结构的方式反映了属性、实体和实体集之间的关系。也就是说，字段是表示实体属性的单个基本信息单元，记录是给定实体的字段值集合，文件是给定实体集中实体的记录集合。\n\
    \n文件中的每个记录可能包含许多字段项，但某个字段中的值可以唯一确定文件中的记录。这样的字段 K 称为主键，该字段中的值 k1、k2、... 称为键或键值。\n\
    \n### 示例 1.1\n\n- (a) 假设一家汽车经销商维护一个库存文件，其中每条记录包含以下数据：\n\n  序列号，类型，年份，价格，配件\n\n\
    \  序列号字段可以作为文件的主键，因为每辆汽车都有唯一的序列号。\n\n- (b) 假设一个组织维护一个会员文件，其中每条记录包含以下数据：\n\n  姓名，地址，电话号码，应缴会费\n\
    \n  虽然有四个数据项，但姓名和地址可能是组项。这里姓名字段是主键。请注意，地址和电话号码字段可能不能作为主键，因为一些成员可能属于同一家庭并拥有相同的地址和电话号码。\n\
    \n记录也可以按长度分类。文件可以具有固定长度记录或可变长度记录。在固定长度记录中，所有记录包含相同的数据项，并且每个数据项分配相同的空间。在可变长度记录中，文件记录可能具有不同的长度。例如，学生记录通常具有可变长度，因为不同的学生选修不同数量的课程。通常，可变长度记录具有最小长度和最大长度。\n\
    \n将数据组织为字段、记录和文件的上述方式可能不足以维护和高效处理某些数据集合。出于此原因，数据也被组织为更复杂的结构类型。对这种数据结构的研究（构成本文的主题）包括以下三个步骤：\n\
    \n- 1. 结构的逻辑或数学描述\n- 2. 在计算机上实现结构\n- 3. 结构的定量分析，包括确定存储结构所需的内存量和处理结构所需的时间。\n\n\
    下一节将向我们介绍其中一些数据结构。\n\n注：数据结构研究中的第二步和第三步取决于数据是存储在（a）计算机的主（主）内存中，还是（b）次级（外部）存储单元中。本文主要介绍第一种情况。这意味着，给定内存位置的地址，访问内存单元内容所需的时间不取决于特定单元或先前访问的单元。第二种情况，称为文件管理或数据库管理，是一个独立的主题，超出了本文的范围。\n\
    \n### 1.3 数据结构\n\n数据可以以多种不同的方式组织；特定数据组织的逻辑或数学模型称为数据结构。特定数据模型的选择取决于两个考虑因素。首先，它在结构上必须足够丰富，以反映现实世界中数据的实际关系。另一方面，结构应足够简单，以便在必要时能有效处理数据。本节将向我们介绍将在本文后面详细讨论的一些数据结构。\n\
    \n### 数据结构的分类\n\n数据结构通常分为原始数据结构和非原始数据结构。整数、实数、字符和布尔值等基本数据类型称为原始数据结构。这些数据类型由不可分割的字符组成，因此也称为简单数据类型。\n\
    \n非原始数据结构的最简单示例是复数的处理。很少有计算机能够对复数进行算术运算。链表、栈、队列、树和图是非原始数据结构的示例。图 1.1 显示了数据结构的分类。\n\
    \n![](img/f1df4c31f1795198a6843c842acc2216_13_0.png)\n\n图 1.1 数据结构分类\n\n根据数据的结构和排列，非原始数据结构进一步分为线性和非线性。\n\
    \n如果数据结构的元素形成序列或线性列表，则称为线性数据结构。在线性数据结构中，数据以线性方式排列，尽管它们在内存中的存储方式不必是顺序的。数组、链表、栈和队列是线性数据结构的示例。\n\
    \n相反，如果数据不是按序列排列，则数据结构被称为非线性。因此，数据的插入和删除无法以线性方式进行。树和图是非线性数据结构的示例。\n\n### 数组\n\n\
    最简单的数据结构类型是 *线性*（或 *一维*）数组。所谓 *线性数组*，是指由有限个 $n$ 个相似数据元素组成的列表，分别由一组 $n$ 个连续数引用，通常为\
    \ 1、2、3、...、$n$。如果为数组选择名称 $A$，则 $A$ 的元素用下标表示法表示\n\n```\n$a_1, a_2, a_3, ..., a_n$\n\
    ```\n\n或用括号表示法\n\n```\n$A(1), A(2), A(3), ..., A(N)$\n```\n\n或用方括号表示法\n\n```\n\
    $A[1], A[2], A[3], ..., A[N]$\n```\n\n无论使用哪种表示法，$A[K]$ 中的数字 $K$ 称为 *下标*，$A[K]$\
    \ 称为 *下标变量*。\n\n*注：* 当数组名称由多个字母组成或数组名称出现在算法中时，经常使用括号表示法和方括号表示法。使用此表示法时，我们将像上面的\
    \ $A$ 和 $N$ 所示，对名称和下标使用普通大写字母。否则，我们可以像上面的 $a$ 和 $n$ 所示，对名称和下标使用斜体的常规下标表示法，对下标使用小写字母。前一种表示法遵循面向计算机的文本的惯例，而后一种表示法遵循印刷数学的惯例。\n\
    \n### 示例 1.2\n\n图 1.2 展示了一个由六名学生姓名组成的线性数组 STUDENT。这里 STUDENT[1] 表示 John Brown，STUDENT[2]\
    \ 表示 Sandra Gold，依此类推。\n线性数组称为一维数组，因为该数组中的每个元素由一个下标引用。*二维数组* 是相似数据元素的集合，其中每个元素由两个下标引用。（此类数组在数学中称为\
    \ *矩阵*，在商业应用中称为 *表*。）多维数组的定义类似。数组将在第 4 章中详细介绍。\n\n| | STUDENT |\n|---|---|\n|\
    \ 1 | John Brown |\n| 2 | Sandra Gold |\n| 3 | Tom Jones |\n| 4 | June Kelly |\n\
    | 5 | Mary Reed |\n| 6 | Alan Smith |\n\n图 1.2\n\n### 示例 1.3\n\n一家拥有 28 家门店的连锁店，每家门店有\
    \ 4 个部门，可能会如图 1.3 所示列出其每周销售额（精确到美元）。此类数据可以使用二维数组存储在计算机中，其中第一个下标表示门店，第二个下标表示部门。如果给数组命名为\
    \ SALES，则\n\n```\nSALES[1, 1] = 2872, SALES[1, 2] = 805, SALES[1, 3] = 3211, ...,\
    \ SALES[28, 4] = 982\n```\n\n"
