- pgno: 119
  md: '# Example 4.5


    Consider the array AUTO in Example 4.1(b), which records the number of automobiles
    sold each year from 1932 through 1984. Each of the following modules, which carry
    out the given operation, involves traversing AUTO.


    +   (a) Find the number NUM of years during which more than 300 automobiles were
    sold.


    +   1. [Initialization step.] Set NUM := 0.


    +   2. Repeat for K = 1932 to 1984: If AUTO[K] > 300, then: Set NUM := NUM + 1.
    [End of loop.]


    +   3. Return.


    +   (b) Print each year and the number of automobiles sold in that year.


    +   1. Repeat for K = 1932 to 1984: Write: K, AUTO[K]. [End of loop.]


    +   2. Return.


    (Observe that (a) requires an initialization step for the variable NUM before
    traversing the array AUTO.)


    # 4.6 INSERTING AND DELETING


    Let A be a collection of data elements in the memory of the computer. “Inserting”
    refers to the operation of adding another element to the collection A, and “deleting”
    refers to the operation of removing one of the elements from A. This section discusses
    inserting and deleting when A is a linear array.


    Inserting an element at the “end” of a linear array can be easily done provided
    the memory space allocated for the array is large enough to accommodate the additional
    element. On the other hand, suppose we need to insert an element in the middle
    of the array. Then, on the average, half of the elements must be moved downward
    to new locations to accommodate the new element and keep the order of the other
    elements.


    Similarly, deleting an element at the “end” of an array presents no difficulties,
    but deleting an element somewhere in the middle of the array would require that
    each subsequent element be moved one location upward in order to “fill up” the
    array.


    Remark: Since linear arrays are usually pictured extending downward, as in Fig.
    4.1, the term “downward” refers to locations with larger subscripts, and the term
    “upward” refers to locations with smaller subscripts.


    # Example 4.6


    Suppose TEST has been declared to be a 5-element array but data have been recorded
    only for TEST[1], TEST[2] and TEST[3]. If X is the value of the next test, then
    one simply assigns


    ```

    TEST[4] := X

    ```


    to add X to the list. Similarly, if Y is the value of the subsequent test, then
    we simply assign


    ```

    TEST[5] := Y

    ```


    to add Y to the list. Now, however, we cannot add any new test scores to the list.'
