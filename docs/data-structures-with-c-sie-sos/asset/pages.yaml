    # Rate of Growth; Big O Notation


    Suppose M is an algorithm, and suppose n is the size of the input data. Clearly
    the complexity f(n) of M increases as n increases. It is usually the rate of increase
    of f(n) that we want to examine. This is usually done by comparing f(n) with some
    standard function, such as


    log2 n, n log2 n, n^2, n^3, 2^n


    The rates of growth for these standard functions are indicated in Fig. 2.6, which
    gives their approximate values for certain values of n. Observe that the functions
    are listed in the order of their rates of growth: the logarithmic function log2
    n grows most slowly, the exponential function 2^n grows most rapidly, and the
    polynomial functions n^c grow according to the exponent c. One way to compare
    the function f(n) with these standard functions is to use the functional O notation
    defined as follows:


    | n\g(n) | log n | n | n log n | n^2 | n^3 | 2^n |

    |---|---|---|---|---|---|---|

    | 5 | 3 | 5 | 15 | 25 | 125 | 32 |

    | 10 | 4 | 10 | 40 | 100 | 10^3 | 10^3 |

    | 100 | 7 | 100 | 700 | 10^4 | 10^6 | 10^30 |

    | 1000 | 10 | 10^3 | 10^4 | 10^6 | 10^9 | 10^300 |


    Fig. 2.6 Rate of Growth of Standard Functions


    Suppose f(n) and g(n) are functions defined on the positive integers with the
    property that f(n) is bounded by some multiple of g(n) for almost all n. That
    is, suppose there exist a positive integer n0 and a positive number M such that,
    for all n > n0, we have


    ```

    |f(n)| <= M|g(n)|

    ```


    Then we may write


    ```

    f(n) = O(g(n))

    ```


    which is read “f(n) is of order g(n).” For any polynomial P(n) of degree m, we
    show in Solved Problem 2.10 that P(n) = O(n^m); e.g.,


    ```

    8n^3 - 576n^2 + 832n - 248 = O(n^3)

    ```'
