- pgno: 259
  md: 'Generally, on giving the address of a size 2k node which needs to be returned,
    there is a change in its (k + 1)th bit from 1 to 0 or vice versa and the output
    is its buddy''s address. We can come to know if a node is in use by making use
    of the tag field.


    # Example 5.26


    Suppose m is 6 and requests are made for nodes of size 8, 16, 4, and 6. We will
    see how the buddy system responds.


    ![](img/f1df4c31f1795198a6843c842acc2216_259_0.png)


    # Fig. 5.43 Sequence of Memory Configurations


    Figure 5.43(a) shows the sequence of memory configurations. If the node of length
    16 is returned, the configuration becomes as shown in Fig. 5.43(b).


    A[4] has two nodes and is the head of the list, the nodes are of length 16 each.
    The node which is released had a length 16 which starts at the address 16 having
    a node of length 16 which starts at the address 0 as its buddy. It cannot merge
    together as it is not free. It also can''t merge with the node having a length
    4 beginning with the address 12 because it is not its buddy.


    Buddies are usually the successor nodes of the same parent. Hence we can come
    to a conclusion that [12, 15] and [16, 31] cannot be considered as buddies even
    though they have an adjacent memory space. And hence we can also say that they
    cannot be merged either.'
