  md: '# Arrays, Records and Pointers


    # 4.1 INTRODUCTION


    Data structures are classified as either linear or nonlinear. A data structure
    is said to be linear if its elements form a sequence, or, in other words, a linear
    list. There are two basic ways of representing such linear structures in memory.
    One way is to have the linear relationship between the elements represented by
    means of sequential memory locations. These linear structures are called arrays
    and form the main subject matter of this chapter. The other way is to have the
    linear relationship between the elements represented by means of pointers or links.
    These linear structures are called linked lists; they form the main content of
    Chapter 5. Nonlinear structures such as trees and graphs are treated in later
    chapters.


    The operations one normally performs on any linear structure, whether it be an
    array or a linked list, include the following:


    +   (a) Traversal. Processing each element in the list.

    +   (b) Search. Finding the location of the element with a given value or the
    record with a given key.

    +   (c) Insertion. Adding a new element to the list.

    +   (d) Deletion. Removing an element from the list.

    +   (e) Sorting. Arranging the elements in some type of order.

    +   (f) Merging. Combining two lists into a single list.


    The particular linear structure that one chooses for a given situation depends
    on the relative frequency with which one performs these different operations on
    the structure.


    This chapter discusses a very common linear structure called an array. Since arrays
    are usually easy to traverse, search and sort, they are frequently used to store
    relatively permanent collections of data. On the other hand, if the size of the
    structure and the data in the structure are constantly changing, then the array
    may not be as useful a structure as the linked list, discussed in Chapter 5.'
