- pgno: 71
  md: 'The main disadvantages are:


    +   1. Time is wasted reading an entire record if most of the storage consists
    of inessential blank spaces.

    +   2. Certain records may require more space than available.

    +   3. When the correction consists of more or fewer characters than the original
    text, changing a misspelled word requires the entire record to be changed.


    Remark: Suppose we wanted to insert a new record in Example 3.1. This would require
    that all succeeding records be moved to new memory locations. However, this disadvantage
    can be easily remedied as indicated in Fig. 3.3. That is, one can use a linear
    array POINT which gives the address of each successive record, so that the records
    need not be stored in consecutive locations in memory. Accordingly, inserting
    a new record will require only an updating of the array POINT.


    ![](img/f1df4c31f1795198a6843c842acc2216_71_0.png)


    # Variable-Length Storage with Fixed Maximum


    Although strings may be stored in fixed-length memory locations as above, there
    are advantages in knowing the actual length of each string. For example, one then
    does not have to read the entire record when the string occupies only the beginning
    part of the memory location. Also, certain string operations (discussed in Sec.
    3.4) depend on having such variable-length strings.


    The storage of variable-length strings in memory cells with fixed lengths can
    be done in two general ways:


    +   1. One can use a marker, such as two dollar signs ($$), to signal the end
    of the string.

    +   2. One can list the length of the string—as an additional item in the pointer
    array, for example.'
