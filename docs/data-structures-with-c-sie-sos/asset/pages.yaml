    (a) Here \( C(n) = \sum_{i=1}^n \sum_{j=1}^n \sum_{k=1}^n M \)


    The number of times \( M \) occurs in the sum is equal to the number of triplets
    \( (i, j, k) \), where \( i, j, k \) are integers from 1 to \( n \) inclusive.
    There are \( n^3 \) such triplets. Hence


    \( C(n) = M''n^3 = O(n^3) \)


    (b) Observe that the values of the loop index J are the powers of \( b \):


    \( 1, b, b^2, b^3, b^4, ... \)


    Therefore, Module A will be repeated exactly \( T \) times, where \( T \) is the
    first exponent such that


    \( b^T > n \)


    Hence, \( T = \lfloor \log_b n \rfloor + 1 \)


    Accordingly, \( C(n) = MT = O(\log_b n) \)


