  md: '# Arrays


    The simplest type of data structure is a *linear* (or *one-dimensional*) array.
    By a *linear array*, we mean a list of a finite number $n$ of similar data elements
    referenced respectively by a set of $n$ consecutive numbers, usually 1, 2, 3,
    ..., $n$. If we choose the name $A$ for the array, then the elements of $A$ are
    denoted by subscript notation


    ```

    $a_1, a_2, a_3, ..., a_n$

    ```


    or by the parenthesis notation


    ```

    $A(1), A(2), A(3), ..., A(N)$

    ```


    or by the bracket notation


    ```

    $A[1], A[2], A[3], ..., A[N]$

    ```


    Regardless of the notation, the number $K$ in $A[K]$ is called a *subscript* and
    $A[K]$ is called a *subscripted variable*.


    *Remark:* The parentheses notation and the bracket notation are frequently used
    when the array name consists of more than one letter or when the array name appears
    in an algorithm. When using this notation we will use ordinary uppercase letters
    for the name and subscripts as indicated above by the $A$ and $N$. Otherwise,
    we may use the usual subscript notation of italics for the name and subscripts
    and lowercase letters for the subscripts as indicated above by the $a$ and $n$.
    The former notation follows the practice of computer-oriented texts whereas the
    latter notation follows the practice of mathematics in print.


    # Example 1.2


    A linear array STUDENT consisting of the names of six students is pictured in
    Fig. 1.2. Here STUDENT[1] denotes John Brown, STUDENT[2] denotes Sandra Gold,
    and so on.

    Linear arrays are called one-dimensional arrays because each element in such an
    array is referenced by one subscript. A *two-dimensional array* is a collection
    of similar data elements where each element is referenced by two subscripts. (Such
    arrays are called *matrices* in mathematics, and *tables* in business applications.)
    Multidimensional arrays are defined analogously. Arrays will be covered in detail
    in Chapter 4.


    | | STUDENT |

    |---|---|

    | 1 | John Brown |

    | 2 | Sandra Gold |

    | 3 | Tom Jones |

    | 4 | June Kelly |

    | 5 | Mary Reed |

    | 6 | Alan Smith |


    Fig. 1.2


    # Example 1.3


    A chain of 28 stores, each store having 4 departments, may list its weekly sales
    (to the nearest dollar) as in Fig. 1.3. Such data can be stored in the computer
    using a two-dimensional array in which the first subscript denotes the store and
    the second subscript the department. If SALES is the name given to the array,
    then


    ```

    SALES[1, 1] = 2872, SALES[1, 2] = 805, SALES[1, 3] = 3211, ..., SALES[28, 4] =
    982

    ```'
