    Although the binary search algorithm is a very efficient algorithm, it has some
    major drawbacks. Specifically, the algorithm assumes that one has direct access
    to the middle name in the list or a sublist. This means that the list must be
    stored in some type of array. Unfortunately, inserting an element in an array
    requires elements to be moved down the list, and deleting an element from an array
    requires element to be moved up the list.


    The telephone company solves the above problem by printing a new directory every
    year while keeping a separate temporary file for new telephone customers. That
    is, the telephone company updates its files every year. On the other hand, a bank
    may want to insert a new customer in its file almost instantaneously. Accordingly,
    a linearly sorted list may not be the best data structure for a bank.


    # An Example of Time-Space Tradeoff


    Suppose a file of records contains names, social security numbers and much additional
    information among its fields. Sorting the file alphabetically and running a binary
    search is a very efficient way to find the record for a given name. On the other
    hand, suppose we are given only the social security number of the person. Then
    we would have to do a linear search for the record, which is extremely time-consuming
    for a very large number of records. How can we solve such a problem? One way is
    to have another file which is sorted numerically according to social security
    number. This, however, would double the space required for storing the data. Another
    way, pictured in Fig. 1.14, is to have the main file sorted numerically by social
    security number and to have an auxiliary array with only two columns, the first
    column containing an alphabetized list of the names and the second column containing
    pointers which give the locations of the corresponding records in the main file.
    This is one way of solving the problem that is used frequently, since the additional
    space, containing only two columns, is minimal for the amount of extra information
    it provides.


