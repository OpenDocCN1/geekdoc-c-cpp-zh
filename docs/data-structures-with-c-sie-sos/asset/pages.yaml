    +   (b) Variable-length storage with fixed maximums. Here strings are also stored
    in memory cells all of the same length; however, one also knows the actual length
    of the string in the cell.


    +   (c) Linked-list storage. Here each cell is divided into two parts; the first
    part stores a single character (or a fixed small number of characters), and the
    second part contains the address of the cell containing the next character.'
