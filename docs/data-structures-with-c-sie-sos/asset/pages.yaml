  md: '# Sequence Logic (Sequential Flow)


    Sequence logic has already been discussed. Unless instructions are given to the
    contrary, the modules are executed in the obvious sequence. The sequence may be
    presented explicitly, by means of numbered steps, or implicitly, by the order
    in which the modules are written. (See Fig. 2.3.) Most processing, even of complex
    problems, will generally follow this elementary flow pattern.


    ![](img/f1df4c31f1795198a6843c842acc2216_40_0.png)


    # Selection Logic (Conditional Flow)


    Selection logic employs a number of conditions which lead to a selection of one
    out of several alternative modules. The structures which implement this logic
    are called conditional structures or If structures. For clarity, we will frequently
    indicate the end of such a structure by the statement


    > [End of If structure.]


    or some equivalent.


    These conditional structures fall into three types, which are discussed separately.


    +   1. Single Alternative. This structure has the form


    ```

    If condition, then:

    [Module A]

    [End of If structure.]

    ```


    The logic of this structure is pictured in Fig. 2.4(a). If the condition holds,
    then Module A, which may consist of one or more statements, is executed; otherwise
    Module A is skipped and control transfers to the next step of the algorithm.


    ![](img/f1df4c31f1795198a6843c842acc2216_40_1.png)'
