    Fig. 4.5


    The following algorithm inserts a data element ITEM into the Kth position in a
    linear array LA with N elements. The first four steps create space in LA by moving
    downward one location each element from the Kth position on. We emphasize that
    these elements are moved in reverse order—i.e., first LA[N], then LA[N – 1], ...,
    and last LA[K]; otherwise data might be erased. (See Solved Problem 4.3) In more
    detail, we first set J := N and then, using J as a counter, decrease J each time
    the loop is executed until J reaches K. The next step, Step 5, inserts ITEM into
    the array in the space just created. Before the exit from the algorithm, the number
    N of elements in LA is increased by 1 to account for the new element.


    ```

    **Algorithm 4.2:** (Inserting into a Linear Array) INSERT (LA, N, K, ITEM)

    Here LA is a linear array with N elements and K is a positive integer such that
    K ≤ N. This algorithm inserts an element ITEM into the Kth position in LA.

    1. [Initialize counter.] Set J := N.

    2. Repeat Steps 3 and 4 while J ≥ K.

    3. [Move Jth element downward.] Set LA[J + 1] := LA[J].

    4. [Decrease counter.] Set J := J – 1.

    [End of Step 2 loop.]

    5. [Insert element.] Set LA[K] := ITEM.

    6. [Reset N.] Set N := N + 1.

    7. Exit.

    ```'
