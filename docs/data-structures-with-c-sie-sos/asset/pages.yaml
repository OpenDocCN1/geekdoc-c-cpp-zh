- pgno: 74
  md: '# Constants


    Many programming languages denote string constants by placing the string in either
    single or double quotation marks. For example, ''THE END'' and ''TO BE OR NOT
    TO BE'' are string constants of lengths 7 and 18 characters respectively. Our
    algorithms will also define character constants in this way.


    # Variables


    Each programming language has its own rules for forming character variables. However,
    such variables fall into one of three categories: static, semistatic and dynamic.
    By a static character variable, we mean a variable whose length is defined before
    the program is executed and cannot change throughout the program. By a semistatic
    character variable, we mean a variable whose length may vary during the execution
    of the program as long as the length does not exceed a maximum value determined
    by the program before the program is executed. By a dynamic character variable,
    we mean a variable whose length can change during the execution of the program.
    These three categories correspond, respectively, to the ways the strings are stored
    in the memory of the computer as discussed in the preceding section.


    # Example 3.2


    In C, variables are declared using alphanumeric characters. The only special character
    that is allowed inside a variable name is an underscore (_). Further, a variable
    name must comply with certain rules; for instance:


    +   - A variable name must always begin with a letter

    +   - A variable name can not be same as a system keyword

    +   - No white spaces are allowed inside a variable name


    Following are some examples of character variable declaration in C:


    ```

    char a; //declares a single character variable a

    char str[20]; //declares a character array (string) of length 20

    ```


    # 3.5 STRINGS AS ADT


    Most languages have strings as a built-in data type or a standard library, and
    a set of operations defined on that type. Therefore, there is actually no need
    for us to create our own string ADT. However, we can implement our own string
    data type, if required. The use of a data type in string processing applications
    should not depend on how it is implemented, or whether it is built-in or user
    defined. We only need to know what operations are allowed on the string.


    A string data type typically should have operations to:


    +   - Return the nth character in a string.

    +   - Set the nth character in a string to c.

    +   - Find the length of a string.

    +   - Concatenate two strings.

    +   - Copy a string.'
