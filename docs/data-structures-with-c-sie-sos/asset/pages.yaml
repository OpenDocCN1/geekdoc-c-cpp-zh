    # Pointer Arrays


    The two space-efficient data structures in Fig. 4.20 can be easily modified so
    that the individual groups can be indexed. This is accomplished by using a pointer
    array (here, GROUP) which contains the locations of the different groups or, more
    specifically, the locations of the first elements in the different groups. Figure
    4.21 shows how Fig. 4.20(a) is modified. Observe that GROUP[L] and GROUP[L + 1]
    – 1 contain, respectively, the first and last elements in group L. (Observe that
    GROUP[5] points to the sentinel of the list and that GROUP[5] – 1 gives us the
    location of the last element in Group 4.)'
