    # 2.6 OTHER ASYMPTOTIC NOTATIONS FOR COMPLEXITY OF ALGORITHMS Ω, Θ, o


    The “big O” notation defines an upper bound function g(n) for f(n) which represents
    the time/space complexity of the algorithm on an input characteristic n. There
    are other asymptotic notations such as Ω, Θ, o which also serve to provide bounds
    for the function f(n).


    # Omega Notation (Ω)


    The omega notation is used when the function g(n) defines a lower bound for the
    function f(n).


    # Definition


    f(n) = Ω(g(n)) (read as f of n is omega of g of n), iff there exists a positive
    integer n₀ and a positive number M such that |f(n)| ≥ M|g(n)|, for all n ≥ n₀.


    For f(n) = 18n + 9, f(n) > 18n for all n, hence f(n) = Ω(n). Also, for f(n) =
    90n² + 18n + 6, f(n) > 90n² for n ≥ 0 and therefore f(n) = Ω(n²).


    For f(n) = Ω(g(n)), g(n) is a lower bound function and there may be several such
    functions, but it is appropriate that the function which is almost as large a
    function of n as possible such that the definition of Ω is satisfied, is chosen
    as g(n). Thus for example, f(n) = 5n + 1 leads to both f(n) = Ω(n) and f(n) =
    Ω(1). However, we never consider the latter to be correct, since f(n)= Ω(n) represents
    the largest possible function of n satisfying the definition of Ω and hence is
    more informative.


    # Theta Notation (Θ)


    The theta notation is used when the function f(n) is bounded both from above and
    below by the function g(n).


    # Definition


    f(n) = Θ(g(n)) (read as f on n is theta of g of n) iff there exist two positive
    constants c₁ and c₂, and a positive integer n₀ such that c₁|g(n)| ≤ |f(n)| ≤ c₂|g(n)|
    for all n ≥ n₀.


    From the definition it implies that the function g(n) is both an upper bound and
    a lower bound for the function f(n) for all values of n, n ≥ n₀. In other words,
    f(n) is such that, f(n) = O(g(n)) and f(n) = Ω(g(n)).


    For f(n) = 18n + 9, since f(n) > 18n and f(n) ≤ 27n for n ≥ 1, we have f(n) =
    Ω(n) and f(n) = O(n) respectively, for n ≥ 1. Hence f(n) = Θ(n). Again, 16n² +
    30n – 90 = Θ(n²) and 7.2ⁿ + 30n = Θ(2ⁿ).'
