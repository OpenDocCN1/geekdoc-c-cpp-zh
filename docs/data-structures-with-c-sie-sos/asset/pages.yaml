    10 digits and a minimum of 12 special characters—give the minimum number and the
    usual number of bits to represent a character in the memory of the computer.


    Since 2^5 < 48 < 2^6, one requires at least a 6-bit code to represent 48 characters.
    Usually a computer uses a 7-bit code, such as ASCII, or an 8-bit code, such as
    EBCDIC, to represent characters. This allows many more special characters to be
    represented and processed by the computer.


    +   3.3 Describe briefly the three types of structures used for storing strings.


