    # Inserting at the Beginning of a List


    Suppose our linked list is not necessarily sorted and there is no reason to insert
    a new node in any special place in the list. Then the easiest place to insert
    the node is at the beginning of the list. An algorithm that does so follows.


    +   **Algorithm 5.4:** INSFFIRST(INFO, LINK, START, AVAIL, ITEM)

    +   This algorithm inserts ITEM as the first node in the list.

    +   1. [OVERFLOW]? If AVAIL = NULL, then: Write: OVERFLOW, and Exit.

    +   2. [Remove first node from AVAIL list.] Set NEW := AVAIL and AVAIL := LINK[AVAIL].

    +   3. Set INFO[NEW] := ITEM. [Copies new data into new node]

    +   4. Set LINK[NEW] := START. [New node now points to original first node.]

    +   5. Set START := NEW. [Changes START so it points to the new node.]

    +   6. Exit.


    Steps 1 to 3 have already been discussed, and the schematic diagram of Steps 2
    and 3 appears in Fig. 5.18. The schematic diagram of Steps 4 and 5 appears in
    Fig. 5.19.


    ![](img/f1df4c31f1795198a6843c842acc2216_218_1.png)'
