    # 2.5 COMPLEXITY OF ALGORITHMS


    The analysis of algorithms is a major task in computer science. In order to compare
    algorithms, we must have some criteria to measure the efficiency of our algorithms.
    This section discusses this important topic.


    Suppose M is an algorithm, and suppose n is the size of the input data. The time
    and space used by the algorithm M are the two main measures for the efficiency
    of M. The time is measured by counting the number of key operations—in sorting
    and searching algorithms, for example, the number of comparisons. That is because
    key operations are so defined that the time for the other operations is much less
    than or at most proportional to the time for the key operations. The space is
    measured by counting the maximum of memory needed by the algorithm.


    The complexity of an algorithm M is the function f(n) which gives the running
    time and/or storage space requirement of the algorithm in terms of the size n
    of the input data. Frequently, the storage space required by an algorithm is simply
    a multiple of the data size n. Accordingly, unless otherwise stated or implied,
    the term “complexity” shall refer to the running time of the algorithm.


    The following example illustrates that the function f(n), which gives the running
    time of an algorithm, depends not only on the size n of the input data but also
    on the particular data.


    **Example 2.7**


    Suppose we are given an English short story TEXT, and suppose we want to search
    through TEXT for the first occurrence of a given 3-letter word W. If W is the
    3-letter word “the,” then it is likely that W occurs near the beginning of TEXT,
    so f(n) will be small. On the other hand, if W is the 3-letter word “zoo,” then
    W may not appear in TEXT at all, so f(n) will be large.'
