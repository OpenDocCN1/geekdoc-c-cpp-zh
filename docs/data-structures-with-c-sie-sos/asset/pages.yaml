  md: 'Figure 5.23 does not take into account the fact that, when a node N is deleted
    from our list, we will immediately return its memory space to the AVAIL list.
    Specifically, for easier processing, it will be returned to the beginning of the
    AVAIL list. Thus a more exact schematic diagram of such a deletion is the one
    in Fig. 5.24. Observe that three pointer fields are changed as follows:


    +   1. The nextpointer field of node A now points to node B, where node N previously
    pointed.

    +   2. The nextpointer field of N now points to the original first node in the
    free pool, where AVAIL previously pointed.

    +   3. AVAIL now points to the deleted node N.


    ![](img/f1df4c31f1795198a6843c842acc2216_226_0.png)


    There are also two special cases. If the deleted node N is the first node in the
    list, then START will point to node B; and if the deleted node N is the last node
    in the list, then node A will contain the NULL pointer.


    # Example 5.16


    +   (a) Consider Fig. 5.22, the list of patients in the hospital ward. Suppose
    Green is discharged, so that BED[8] is now empty. Then, in order to maintain the
    linked list, the following three changes in the pointer fields must be executed:


    ```

    LINK[11] = 10   LINK[8] = 2   AVAIL = 8

    ```


    By the first change, Fields, who originally preceded Green, now points to Jones,
    who originally followed Green. The second and third changes add the new empty
    bed to the AVAIL list. We emphasize that, before making the deletion, we had to
    find the node BED[11], which originally pointed to the deleted node BED[8].


    +   (b) Consider Fig. 5.13, the list of brokers and their customers. Suppose Teller,
    the first customer of Nelson, is deleted from the list of customers. Then, in
    order to maintain the linked lists, the following three changes in the pointer
    fields must be executed:


    ```

    POINT[4] = 10   LINK[9] = 11   AVAIL = 9

    ```


    By the first change, Nelson now points to his original second customer, Jones.
    The second and third changes add the new empty node to the AVAIL list.'
