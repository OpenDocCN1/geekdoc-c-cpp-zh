    Language designers realized that it would be convenient to have certain variables
    which can be accessed by some or even all the program modules in a computer program.
    Variables that can be accessed by all program modules are called global variables,
    and variables that can be accessed by some program modules are called nonlocal
    variables. Each programming language has its own syntax for declaring such variables.
    For example, FORTRAN uses a COMMON statement to declare global variables, and
    Pascal uses scope rules to declare global and nonlocal variables.


    Accordingly, there are two basic ways for modules to communicate with each other:


    +   1. Directly, by means of well-defined parameters

    +   2. Indirectly, by means of non local and global variables


    The indirect change of the value of a variable in one module by another module
    is called a side effect. Readers should be very careful when using nonlocal and
    global variables, since errors caused by side effects may be difficult to detect.'
