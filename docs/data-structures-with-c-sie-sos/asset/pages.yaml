    1.13 Briefly describe the notions of (a) the complexity of an algorithm and (b)
    the space-time tradeoff of algorithms.


    (a) The complexity of an algorithm is a function f(n) which measures the time
    and/or space used by an algorithm in terms of the input size n.


    (b) The space-time tradeoff refers to a choice between algorithmic solutions of
    a data processing problem that allows one to decrease the running time of an algorithmic
    solution by increasing the space to store the data and vice versa.


