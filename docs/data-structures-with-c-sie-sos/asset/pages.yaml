  md: 'Remark: Some programmers use a bubble sort algorithm that contains a 1-bit
    variable FLAG (or a logical variable FLAG) to signal when no interchange takes
    place during a pass. If FLAG = 0 after any pass, then the list is already sorted
    and there is no need to continue. This may cut down on the number of passes. However,
    when using such a flag, one must initialize, change and test the variable FLAG
    during each pass. Hence the use of the flag is efficient only when the list originally
    is “almost” in sorted order.


    # 4.8 SEARCHING; LINEAR SEARCH


    Let DATA be a collection of data elements in memory, and suppose a specific ITEM
    of information is given. Searching refers to the operation of finding the location
    LOC of ITEM in DATA, or printing some message that ITEM does not appear there.
    The search is said to be successful if ITEM does appear in DATA and unsuccessful
    otherwise.


    Frequently, one may want to add the element ITEM to DATA after an unsuccessful
    search for ITEM in DATA. One then uses a search and insertion algorithm, rather
    than simply a search algorithm; such search and insertion algorithms are discussed
    in the problem sections.


    There are many different searching algorithms. The algorithm that one chooses
    generally depends on the way the information in DATA is organized. Searching is
    discussed in detail in Chapter 9. This section discusses a simple algorithm called
    linear search, and the next section discusses the well-known algorithm called
    binary search.


    The complexity of searching algorithms is measured in terms of the number f(n)
    of comparisons required to find ITEM in DATA where DATA contains n elements. We
    shall show that linear search is a linear time algorithm, but that binary search
    is a much more efficient algorithm, proportional in time to log2 n. On the other
    hand, we also discuss the drawback of relying only on the binary search algorithm.


    # Linear Search


    Suppose DATA is a linear array with n elements. Given no other information about
    DATA, the most intuitive way to search for a given ITEM in DATA is to compare
    ITEM with each element of DATA one by one. That is, first we test whether DATA[1]
    = ITEM, and then we test whether DATA[2] = ITEM, and so on. This method, which
    traverses DATA sequentially to locate ITEM, is called linear search or sequential
    search.


    To simplify the matter, we first assign ITEM to DATA[N + 1], the position following
    the last element of DATA. Then the outcome


    LOC = N + 1


    where LOC denotes the location where ITEM first occurs in DATA, signifies the
    search is unsuccessful. The purpose of this initial assignment is to avoid repeatedly
    testing whether or not we have reached the end of the array DATA. This way, the
    search must eventually “succeed.”


    A formal presentation of linear search is shown in Algorithm 4.5.


