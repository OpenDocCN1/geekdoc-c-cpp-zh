    # Local and Global Variables


    The organization of a computer program into a main program and various subprograms
    has led to the notion of local and global variables. Normally, each program module
    contains its own list of variables, called local variables, which can be accessed
    only by the given program module. Also, subprogram modules may contain parameters,
    variables which transfer data between a subprogram and its calling program.


    # Example 2.12


    Consider the procedure SWITCH(AAA, BBB) in Example 2.10. The variables AAA and
    BBB are parameters; they are used to transfer data between the procedure and a
    calling algorithm. On the other hand, the variable TEMP in the procedure is a
    local variable. It “lives” only in the procedure; i.e., its value can be accessed
    and changed only during the execution of the procedure. In fact, the name TEMP
    may be used for a variable in any other module and the use of the name will not
    interfere with the execution of the procedure SWITCH.'
