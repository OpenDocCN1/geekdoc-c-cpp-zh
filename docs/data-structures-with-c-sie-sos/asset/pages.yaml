  md: "Analogously, the age of the father of the sixth newborn may be referenced by\
    \ writing Newborn.Father.Age[6] or simply Father.Age[6]\n\n(c) Consider the record\
    \ structure Student in Example 4.18. Since Student is declared to be a file with\
    \ 20 students, all items automatically become 20-element arrays. Furthermore,\
    \ Test becomes a two-dimensional array. In particular, the second test of the\
    \ sixth student may be referenced by writing Student.Test[6, 2] or simply Test[6,2]\n\
    \nThe order of the subscripts corresponds to the order of the qualifying identifiers.\
    \ For example, Test[3, 1] does not refer to the third test of the first student,\
    \ but to the first test of the third student.\n\nRemark: Texts sometimes use functional\
    \ notation instead of the dot notation to denote qualifying identifiers. For example,\
    \ one writes Age(Father(Newborn)) instead of Newborn.Father.Age and First(Name(Student[8]))\
    \ instead of Student.Name.First[8]\n\nObserve that the order of the qualifying\
    \ identifiers in the functional notation is the reverse of the order in the dot\
    \ notation.\n\n# 4.15 REPRESENTATION OF RECORDS IN MEMORY; PARALLEL ARRAYS\n\n\
    Since records may contain nonhomogeneous data, the elements of a record cannot\
    \ be stored in an array. C language allows the storage of such nonhomogeneous\
    \ data records with the help of structures.\n\n# Example 4.23\n\nConsider the\
    \ record structure Newborn in Example 4.20. One can store such a record in C by\
    \ the following declaration, which defines a data aggregate called a structure:\n\
    \n```\nstruct NEWBORN\n{\n   char NAME[20];\n   char SEX[1];\n   struct BIRTHDAY\n\
    \   {\n      int MONTH;\n      int DAY;\n      int YEAR;\n   }B;\n   struct FATHER\n\
    \   {\n      char NAME[20];\n      int AGE;\n```"
