    The format for the formal presentation of an algorithm consists of two parts.
    The first part is a paragraph which tells the purpose of the algorithm, identifies
    the variables which occur in the algorithm and lists the input data. The second
    part of the algorithm consists of the list of steps that is to be executed.


    The following summarizes certain conventions that we will use in presenting our
    algorithms. Some control structures will be covered in the next section.


    # Identifying Number


    Each algorithm is assigned an identifying number as follows: Algorithm 4.3 refers
    to the third algorithm in Chapter 4; Algorithm P5.3 refers to the algorithm in
    Solved Problem 5.3 in Chapter 5. Note that the letter “P” indicates that the algorithm
    appears in a problem.


    # Steps, Control, Exit


    The steps of the algorithm are executed one after the other, beginning with Step
    1, unless indicated otherwise. Control may be transferred to Step n of the algorithm
    by the statement “Go to Step n.” For example, Step 5 transfers control back to
    Step 2 in Algorithm 2.1. Generally speaking, these Go to statements may be practically
