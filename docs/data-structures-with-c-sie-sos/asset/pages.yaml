    # 5.6 MEMORY ALLOCATION; GARBAGE COLLECTION


    The maintenance of linked lists in memory assumes the possibility of inserting
    new nodes into the lists and hence requires some mechanism which provides unused
    memory space for the new nodes. Analogously, some mechanism is required whereby
    the memory space of deleted nodes becomes available for future use. These matters
    are discussed in this section, while the general discussion of the inserting and
    deleting of nodes is postponed until later sections.


    Together with the linked lists in memory, a special list is maintained which consists
    of unused memory cells. This list, which has its own pointer, is called the list
    of available space or the free-storage list or the free pool.


    Suppose our linked lists are implemented by parallel arrays as described in the
    preceding sections, and suppose insertions and deletions are to be performed on
    our linked lists. Then the unused memory cells in the arrays will also be linked
    together to form a linked list using AVAIL as its list pointer variable. (Hence
    this free-storage list will also be called the AVAIL list.) Such a data structure
    will frequently be denoted by writing


    LIST(INFO, LINK, START, AVAIL)'
