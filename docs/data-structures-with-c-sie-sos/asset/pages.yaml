    # 1.6 ALGORITHMS: COMPLEXITY, TIME-SPACE TRADEOFF


    An algorithm is a well-defined list of steps for solving a particular problem.
    One major purpose of this text is to develop efficient algorithms for the processing
    of our data. The time and space it uses are two major measures of the efficiency
    of an algorithm. The complexity of an algorithm is the function which gives the
    running time and/or space in terms of the input size. (The notion of complexity
    will be treated in Chapter 2.)


    Each of our algorithms will involve a particular data structure. Accordingly,
    we may not always be able to use the most efficient algorithm, since the choice
    of data structure depends on many things, including the type of data and the frequency
    with which various data operations are applied. Sometimes the choice of data structure
    involves a time-space tradeoff: by increasing the amount of space for storing
    the data, one may be able to reduce the time needed for processing the data, or
    vice versa. We illustrate these ideas with two examples.


    # Searching Algorithms


    Consider a membership file, as in Example 1.6, in which each record contains,
    among other data, the name and telephone number of its member. Suppose we are
    given the name of a member and we want to find his or her telephone number. One
    way to do this is to linearly search through the file, i.e., to apply the following
    algorithm:


    # Linear Search


    Search each record of the file, one at a time, until finding the given Name and
    hence the corresponding telephone number.


    First of all, it is clear that the time required to execute the algorithm is proportional
    to the number of comparisons. Also, assuming that each name in the file is equally
    likely to be picked, it is intuitively clear that the average number of comparisons
    for a file with n records is equal to n/2; that is, the complexity of the linear
    search algorithm is given by C(n) = n/2.


    The above algorithm would be impossible in practice if we were searching through
    a list consisting of thousands of names, as in a telephone book. However, if the
    names are sorted alphabetically, as in telephone books, then we can use an efficient
    algorithm called binary search. This algorithm is discussed in detail in Chapter
    4, but we briefly describe its general idea below.


    # Binary Search


    Compare the given Name with the name in the middle of the list; this tells which
    half of the list contains Name. Then compare Name with the name in the middle
    of the correct half to determine which quarter of the list contains Name. Continue
    the process until finding Name in the list.


    One can show that the complexity of the binary search algorithm is given by'
