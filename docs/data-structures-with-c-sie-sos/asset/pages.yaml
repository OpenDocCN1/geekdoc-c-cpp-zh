  img_proc: true
- pgno: 7
  md: '# Chapter Highlights


    Chapter 1 gives an overview of data structures and discusses classification of
    data structures, Abstract Data types (ADT), algorithm complexity while mathematical
    and algorithmic notations, control structures, subalgorithms, variables and datatypes
    are covered in Chapter 2.


    String processing, string operations and strings as ADT are taken up in Chapter
    3. Word or text processing are also discussed in this chapter.


    Chapter 4 explains arrays, records and pointers. Topics like arrays as ADT, storage
    representations, representation of polynomials using arrays, addition of polynomials,
    dynamic memory management pointers, records and matrices are covered in this chapter.


    Chapter 5 is on linked lists. It includes linked lists as ADT, operations using
    linked lists, header linked lists, doubly linked lists, circularly linked lists,
    garbage compaction, Josephus problem and its solution, representation and manipulations
    polynomials using linked lists and buddy systems (in brief).


    Stacks, queues and recursion and their applications are discussed in Chapter 6.
    Array, linked list and ADT representation of stacks and queues, polish notations
    using stacks, queue operations, circular queues, deques, priority queues, maze
    problem, simulation of queues, categorizing data and decimal to binary conversion
    are dealt in this chapter.


    Chapter 7 is on binary trees. It provides information on traversal of binary trees,
    threaded binary trees, binary search trees, balanced binary trees, AVL search
    trees, m-way search trees, B-trees, B+-trees, red-black trees and applications
    of trees (expression Trees; game Trees).


    Chapter 8 presents the concepts of graphs and their applications. Spanning trees,
    Minimum spanning tree algorithms—Prim’s and Kruskal’s algorithms, Directed and
    bi-connected graphs are covered here.


    Finally, sorting algorithms such as shell sort, K-way merge sort, balanced merge
    sort, polyphase merge sort, two-way merge sort, and efficiency considerations
    in searching and sorting are discussed in Chapter 9. Topics such as merging ordered
    and unordered files, sort order and sort stability, hash table and hash functions
    are also covered in this chapter.


    # The Schaum''s Outlines Advantage


    A high-performance study guide, Schaum’s Outlines help you cut study time, hone
    problem-solving skills and achieve your personal best in exams. They give you
    the information your teachers expect you to know in a handy and succinct format—without
