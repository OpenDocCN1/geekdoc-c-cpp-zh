    The term “mod” is also used for the mathematical congruence relation, which is
    denoted and defined as follows:


    a \equiv b (mod M) \quad \text{if and only if} \quad M \text{ divides } b - a


    M is called the *modulus*, and a \equiv b (mod M) is read “a is congruent to b
    modulo M.” The following aspects of the congruence relation are frequently useful:


    0 \equiv M (mod M) \quad \text{and} \quad a \pm M \equiv a (mod M)


    *Arithmetic modulo M* refers to the arithmetic operations of addition, multiplication
    and subtraction where the arithmetic value is replaced by its equivalent value
    in the set


    {0, 1, 2, ..., M - 1}


    or in the set


    {1, 2, 3, ..., M}


    For example, in arithmetic modulo 12, sometimes called “clock” arithmetic,


    6 + 9 \equiv 3, \quad 7 \times 5 \equiv 11, \quad 1 - 5 \equiv 8, \quad 2 + 10
    \equiv 0 \equiv 12


    (The use of 0 or M depends on the application.)


    # **Integer and Absolute Value Functions**


    Let x be any real number. The *integer value* of x, written INT(x), converts x
    into an integer by deleting (truncating) the fractional part of the number. Thus


    INT(3.14) = 3, \quad INT (\sqrt{5} ) = 2, \quad INT( -8.5) = -8, \quad INT(7)
    = 7


    Observe that INT(x) = \lfloor x \rfloor or INT(x) = \lceil x \rceil according
    to whether x is positive or negative.


    The *absolute value* of the real number x, written ABS(x) or |x|, is defined as
    the greater of x or -x. Hence ABS(0) = 0, and, for x \neq 0, ABS(x) = x or ABS(x)
    = -x, depending on whether x is positive or negative. Thus


    |-15| = 15, \quad |7| = 7, \quad |-3.33| = 3.33, \quad |4.44| = 4.44, \quad |-0.075|
    = 0.075


    We note that |x| = |-x| and, for x \neq 0, |x| is positive.


