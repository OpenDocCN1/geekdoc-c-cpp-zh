    # Trees


    Data frequently contain a hierarchical relationship between various elements.
    The data structure which reflects this relationship is called a _rooted tree graph_
    or, simply, a _tree_. Trees will be defined and discussed in detail in Chapter
    7. Here we indicate some of their basic properties by means of two examples.


    # Example 1.4 Record Structure


    Although a file may be maintained by means of one or more arrays, a record, where
    one indicates both the group items and the elementary items, can best be described
    by means of a tree structure. For example, an employee personnel record may contain
    the following data items:


    Social Security Number, Name, Address, Age, Salary, Dependents


    However, Name may be a group item with the subitems Last, First and MI (middle
    initial). Also, Address may be a group item with the subitems Street address and
    Area address, where Area itself may be a group item having subitems City, State
    and ZIP code number. This hierarchical structure is pictured in Fig. 1.8(a). Another
    way of picturing such a tree structure is in terms of levels, as in Fig. 1.8(b).'
