    # 2.8 VARIABLES, DATA TYPES


    Each variable in any of our algorithms or programs has a data type which determines
    the code that is used for storing its value. Four such data types follow:


    +   1. Character. Here data are coded using some character code such as EBCDIC
    or ASCII. The 8-bit EBCDIC code of some characters appears in Fig. 2.7. A single
    character is normally stored in a byte.

    +   2. Real (or floating point). Here numerical data are coded using the exponential
    form of the data.

    +   3. Integer (or fixed point). Here positive integers are coded using binary
    representation, and negative integers by some binary variation such as 2''s complement.

    +   4. Logical. Here the variable can have only the value true or false; hence
    it may be coded using only one bit, 1 for true and 0 for false. (Sometimes the
    bytes 1111 1111 and 0000 0000 may be used for true and false, respectively.)


    The data types of variables in our algorithms will not be explicitly stated as
    with computer programs but will usually be implied by the context.


