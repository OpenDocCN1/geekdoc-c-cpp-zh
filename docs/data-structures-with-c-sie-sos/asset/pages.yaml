  md: '# 2.12 Given: \( T_1(n) = O(f(n)) \) and \( T_2(n) = O(g(n)) \). Find \( T_1(n)
    \cdot T_2(n) \).


    \( T_1(n) \le c \cdot f(n) \) for some positive number \( c \) and positive integer
    \( n_1 \), such that \( n \ge n_1 \) and \( T_2(n) \le d \cdot g(n) \) for some
    positive number \( d \) and positive integer \( n_2 \) such that \( n \ge n_2
    \).

    Hence, \( T_1(n) \cdot T_2(n) \le c \cdot f(n) \cdot d \cdot g(n) \)

    \( \le k \cdot f(n) \cdot g(n) \)


    Therefore \( T_1(n) \cdot T_2(n) = O(f(n) \cdot g(n)) \) (This result is referred
    to as Rule of Products of \( O \) notation)


    # Variables, Data Types


    # 2.13 Describe briefly the difference between local variables, parameters and
    global variables.


    Local variables are variables which can be accessed only within a particular program
    or subprogram. Parameters are variables which are used to transfer data between
    a subprogram and its calling program. Global variables are variables which can
    be accessed by all of the program modules in a computer program. Each programming
    language which allows global variables has its own syntax for declaring them.


    # 2.14 Suppose NUM denotes the number of records in a file. Describe the advantages
    in defining NUM to be a global variable. Describe the disadvantages in using global
    variables in general.


    Many of the procedures will process all the records in the file using some type
    of loop. Since NUM will be the same for all these procedures, it would be advantageous
    to have NUM declared a global variable. Generally speaking, global and nonlocal
    variables may lead to errors caused by side effects, which may be difficult to
    detect.


    # 2.15 Suppose a 32 bit memory location AAA contains the following sequence of
    bits:

    0100 1101 1100 0001 1110 1001 0101 1101

    Determine the data stored in AAA.


    There is no way of knowing the data stored in AAA unless one knows the data type
    of AAA. If AAA is a character variable and the EBCDIC code is used for storing
    data, then (AZ) is stored in AAA. If AAA is an integer variable, then the integer
    with the above binary representation is stored in AAA.


    # 2.16 Mathematically speaking, integers may also be viewed as real numbers. Give
    some reasons for having two different data types.


    The arithmetic for integers, which are stored using some type of binary representation,
    is much simpler than the arithmetic for real numbers, which are stored using some
    type of exponential form. Also, certain round-off errors occurring in real arithmetic
    do not occur in integer arithmetic.'
