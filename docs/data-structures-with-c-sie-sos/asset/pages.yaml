    );\n    printf(\"\\nKey\\tAddress\");\n    for(i=2000;i<=2020;i++)\n        printf(\"\
    \\n%d\\t %d\",i,HASH(i));\n\n    getch();\n}\n\nint HASH(int k)\n{\n    return(k-2000);\n\
