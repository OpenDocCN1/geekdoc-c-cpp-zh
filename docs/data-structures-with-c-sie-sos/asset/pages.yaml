  md: "to be a success which is shown by returning true. If the heap is full, we report\
    \ that the push failed by returning false. It is then the calling function's responsibility\
    \ to detect and respond to an overflow.\n\n# Pop Stack\n\nThe data at the top\
    \ of the stack is returned by the Pop stack operation. The node is then deleted\
    \ and recycled after adjusting the count and subtracting it by 1, the function\
    \ returns to the caller. Note the way underflow is reported. In statement ‘dataOutPtr\
    \ = NULL’, we set the data pointer to NULL. If the stack is empty, when we return\
    \ the data pointer in statement ‘return dataOutPtr’ as NULL. The code is shown\
    \ below:\n\n```\nProgram 6.5\n\nPop Stack: This function is used to pop an item\
    \ on on top of stack.STACK is a pointer to a stack. The program is used for returning\
    \ a pointer to the user's data when it is successful. It returns a NULL when there\
    \ is an underflow.\nvoid* popStack (STACK* newstack)\n{\n    void* dataOutPtr;\n\
    \    STACK_NODE* temp;\n    if (newstack->count == 0)\n        dataOutPtr = NULL;\n\
    \    else\n    {\n        temp = newstack->top;\n        dataOutPtr = newstack->top->dataPtr;\n\
    \        newstack->top = newstack->top->link;\n        free(temp);\n        (newstack->count)--;\n\
    \    }\n    return dataOutPtr\n}\n```\n\nIn this case, two local pointers are\
    \ required—one for the data pointer to be returned to the caller, and one that\
    \ is used to free the deleted node. Its only concern is to ensure that is follows\
    \ the procedure to keep a track of when the last node is deleted, thus resulting\
    \ in an empty stack. There is no special logic which is made use of, except that\
    \ an automatic creation of an empty stack since the last node has a null pointer,\
    \ which on assigning to the top shows that the stack is empty.\n\nBecause a null\
    \ pointer is false and a pointer with an address is true, we don’t need a separate\
    \ success flag—we just return the pointer with the address allocated by the new\
    \ function. If memory was allocated successfully, it contains an address, which\
    \ is true. If the allocation failed, it contains a null pointer, which is false.\n\
    \nNote that it takes two levels of indirection to access the link field of the\
    \ top node. On deleting a node from the stack, the pop stack releases its memory."
