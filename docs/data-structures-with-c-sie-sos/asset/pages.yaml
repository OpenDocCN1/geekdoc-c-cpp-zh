  md: 'The above discussion leads us to the question of finding the complexity function
    f(n) for certain cases. The two cases one usually investigates in complexity theory
    are as follows:


    +   1. Worst case: the maximum value of f(n) for any possible input

    +   2. Average case: the expected value of f(n)


    Sometimes we also consider the minimum possible value of f(n), called the best
    case.


    The analysis of the average case assumes a certain probabilistic distribution
    for the input data; one such assumption might be that all possible permutations
    of an input data set are equally likely. The average case also uses the following
    concept in probability theory. Suppose the numbers n1, n2, ..., nk occur with
    respective probabilities p1, p2, ..., pk. Then the expectation or average value
    E is given by


    E = n1p1 + n2p2 + ... + nkpk


