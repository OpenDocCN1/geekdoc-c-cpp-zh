  md: 'sometimes used in secondary memory when records are relatively permanent and
    require little change. However, such methods of storage are usually inefficient
    when the strings and their lengths are frequently being changed.


    # Linked Storage


    Computers are being used very frequently today for word processing, i.e., for
    inputting, processing and outputting printed matter. Therefore, the computer must
    be able to correct and modify the printed matter, which usually means deleting,
    changing and inserting words, phrases, sentences and even paragraphs in the text.
    However, the fixed-length memory cells discussed above do not easily lend themselves
    to these operations. Accordingly, for most extensive word processing applications,
    strings are stored by means of linked lists. Such linked lists, and the way data
    are inserted and deleted in them, are discussed in detail in Chapter 5. Here we
    simply look at the way strings appear in these data structures.


    By a (one-way) linked list, we mean a linearly ordered sequence of memory cells,
    called nodes, where each node contains an item, called a link, which points to
    the next node in the list (i.e., which contains the address of the next node).
    Figure 3.6 is a schematic diagram of such a linked list.


    ![](img/f1df4c31f1795198a6843c842acc2216_73_0.png)


    Fig. 3.6 Linked List


    Strings may be stored in linked lists as follows. Each memory cell is assigned
    one character or a fixed number of characters, and a link contained in the cell
    gives the address of the cell containing the next character or group of characters
    in the string. For example, consider this famous quotation:


    > To be or not to be, that is the question.


    Figure 3.7(a) shows how the string would appear in memory with one character per
    node, and Fig. 3.7(b) shows how it would appear with four characters per node.


    ![](img/f1df4c31f1795198a6843c842acc2216_73_1.png)


    (a) One character per node.


    ![](img/f1df4c31f1795198a6843c842acc2216_73_2.png)


    (b) Four characters per node.


    Fig. 3.7


    # 3.4 CHARACTER DATA TYPE


    This section gives an overview of the way various programming languages handle
    the character data type. As noted in the preceding chapter (in Sec. 2.7), each
    data type has its own formula for decoding a sequence of bits in memory.'
