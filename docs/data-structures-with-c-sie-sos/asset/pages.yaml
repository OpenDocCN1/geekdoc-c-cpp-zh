- pgno: 542
  md: 'key \( k \). The efficiency depends mainly on the load factor \( \lambda \).
    Specifically, we are interested in the following two quantities:


    \( S(\lambda) = \text{average number of probes for a successful search} \)


    \( U(\lambda) = \text{average number of probes for an unsuccessful search} \)


    These quantities will be discussed for our collision procedures.


    # Collision Resolution Techniques


    There are two broad ways of collision resolution:


    +   (i) Open Addressing, where an array-based implemented.

    +   (ii) Separate Chaining, where an array of linked list implemented.


    Open Addressing includes:


    +   • Linear probing (linear search)

    +   • Quadratic probing (nonlinear search), and

    +   • Double hashing (uses two hash functions).


    # (i) Open Addressing: Linear Probing and Modifications


    Suppose that a new record \( R \) with key \( k \) is to be added to the memory
    table \( T \), but that the memory location with hash address \( H(k) = h \) is
    already filled. One natural way to resolve the collision is to assign \( R \)
    to the first available location following \( T[h] \). (We assume that the table
    \( T \) with \( m \) locations is circular, so that \( T[1] \) comes after \(
    T[m] \).) Accordingly, with such a collision procedure, we will search for the
    record \( R \) in the table \( T \) by linearly searching the locations \( T[h]
    \), \( T[h+1] \), \( T[h+2] \), ... until finding \( R \) or meeting an empty
    location, which indicates an unsuccessful search.


    The above collision resolution is called _linear probing_. The average numbers
    of probes for a successful search and for an unsuccessful search are known to
    be the following respective quantities:


    ```

    \( S(\lambda) = \frac{1}{2}\left(1 + \frac{1}{1-\lambda}\right) \quad \text{and}
    \quad U(\lambda) = \frac{1}{2}\left(1 + \frac{1}{(1-\lambda)^2}\right) \)

    ```


    (Here \( \lambda = n/m \) is the load factor.)


    The table below summarizes the characteristics of the various open addressing
    probing sequences.


    | probing sequence | primary clustering | capacity limit | size restriction |

    |---|---|---|---|

    | linear probing | yes | none | none |

    | quadratic probing | no | \(\lambda < \frac{1}{2}\) | M must be prime |

    | double hashing | no | none | M must be prime |'
