    following: the unexecuted lines of code, the conditions that must be met to cause
    these lines to be executed, and the required input values to meet these conditions.


    In this example, from Figure 5.2, we can identify the unexecuted statements: line
    38.


    By a careful examination of the source code, we can identify the condition that
    will cause line 37 to execute - bonusPoints == 43 be true on line 37, which means
    that bonusPoints must have the value 43 at this point in the code execution.


    As bonusPoints is an input parameter, it is easy to identify the required input:
    bonusPoints must have the value 43. When the condition is the result of a calculation
    in the code, more detailed analysis is required. These results are summarised
    in Table 5.1.


