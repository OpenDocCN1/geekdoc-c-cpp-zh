  md: "# 5.6 Evaluation\n\nDeveloping test cases to execute the statements in the\
    \ source code is challenging. The test data values are often based on reviewing\
    \ already executed statements, and identifying changes to the input parameters\
    \ that will cause additional statements to execute. These data values can be identified\
    \ during analysis, as shown in the example, or identified during development of\
    \ the test cases.\n\nFinally, using the specification, and never the source code,\
    \ we can work out the expected results for each set of input values. It is worth\
    \ repeating that the expected results must come from the specification. It is\
    \ all too easy to make the mistake of reading the expected results from the code\
    \ – and the tester must be careful to avoid doing this.\n\n# 5.6 Evaluation\n\n\
    Statement coverage has uncovered Fault 4 inserted into the method giveDiscount\
    \ ().\n\n# 5.6.1 Limitations\n\nThis chapter has already shown how statement coverage\
    \ detects faults related to unexpected statements, using Fault 4. Some benefits\
    \ and limitations of statement coverage are now explored by inserting a new fault\
    \ into the original code.\n\n# Fault 5\n\nA new fault is inserted on line 31 to\
    \ demonstrate some limitations of testing with statement coverage. This fault\
