    # 1.2.1 Mistakes


    Mistakes can be made in a number of different ways. For example:


    +   1. A misunderstanding in communication, such as confusing metric with imperial
    measurements.


    +   2. A misinterpretation or misreading of the specification by a software developer,
    such as swapping the order of parameters by mistake.


    +   3. Assuming defaults: for example, in Java integers have a default value of
    0, but in C++ there is no default value.


    # 1.2.2 Software Faults


    It is helpful to have a classification of the types of faults. The classification
    is used for a number of purposes:


    +   1. When analysing, designing, or coding software: as a checklist of faults
    to avoid.


    +   2. When developing software: as a guide to likely faults.


    +   3. When undergoing software process evaluation or improvement: as input data.


    There are a number of different ways to categorise these software faults, but
    no single, accepted standards exist. The significance of faults can vary depending
    on the circumstances. One representative categorisation⁵ identifies the following
    10 fault types:


    Algorithmic A of the software does not produce an output corresponding to the
    given input under the designated algorithm.


    Syntax Source code is not in conformance with the programming language specification.


    Computation and precision The calculated result using the chosen formula does
    not conform to the expected accuracy or precision.


    Documentation Incomplete or incorrect documentation.


    Stress or overload The system fails to operate correctly when the applied load
    exceeds the specified maximum for the system.'
