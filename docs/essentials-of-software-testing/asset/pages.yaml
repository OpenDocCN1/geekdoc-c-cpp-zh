  md: '# # 6 Branch Coverage


    In this chapter, the next strongest form of white-box testing, branch coverage,
    is introduced.


    # ## 6.1 Testing with Branch Coverage


    This ensures that every branch in the code is taken during testing, or more formally,
    the coverage criteria during testing is *branch coverage*. Testing with branch
    coverage ensures that every branch is taken during tests, as well as verifying
    that the output is correct.


    > **Definition:** a branch is a transition from one line to another in the source
    code during execution. The lines may directly follow each other, or there may
    be a jump.


    # ### 6.1.1 Branch Coverage Measurement


    As for coverage, branch coverage can also be measured automatically for Java programs.
    The JaCoCo tool, previously used for statement coverage, can also be used to measure
    branch coverage. Note that different tools may measure branches in different ways
    – in this chapter we use the JaCoCo branch report as the basis for testing.¹


