  md: '# 1.14 Using this Book


    +   * The introduction describes the motivation for testing, discusses exhaustive
    and random testing, and describes the basic steps required to test software.

    * Six fundamental test techniques, covering black-box and white-box testing, are
    introduced by examples of unit testing. Each is fully worked from analysis of
    the problem through automated test implementation. Following the worked example,
    the principles of each technique are then addressed in more detail.

    * The fundamental elements of testing of object-oriented software are introduced.
    This is a very substantial topic, and this book addresses some of the underlying
    principles and provides a number of examples.

    * Unit testing is introduced before application testing as user interfaces tend
    to be more complex to analyse than programming interfaces; this distracts from
    learning the principles of test techniques and test automation. Application testing
    is introduced through the example of testing a web-based software system over
    its user interface.

    * The book ends with a more detailed look at software testing automation, random
    testing, and a discussion on the role of software testing in the software development-process.


    # 1.14.2 Order of Testing


    Usually, unit testing is followed by integration testing, and by system testing.
    Within unit testing, black-box testing is invariably used first, followed by white-box
    testing, in order to selectively increase coverage measures, such as the percentage
    of statements executed. This approach maximises test coverage, while reducing
    the duplication of tests.


    This book follows the same ordering with one exception: integration testing is
    not detailed in this book.


    # 1.14.3 Document Test Design


    In practice, most testers will not document their tests to the degree of detail
    shown in this book, except in situations in which software quality is required.
    However, the tester must do the same mental work to develop tests systematically,
    and while learning to test it is good practice to write down all the intermediate
    results as shown in this book.


    # 1.14.4 The Programming Language


    The Java programming language (Java 11) has been used for all examples. The principles
    shown and the approach used for Java serves as an example for testing in other
    procedural or object-oriented languages.


    > ² System testing for user applications is often referred to as application testing.'
