- img_proc: true
  md: '# Application Testing


    can fill a tank completely. High-volatility fuels require expansion space to be
    left for safety reasons. The tank capacity is 1200 litres without the expansion
    space, and 800 litres with it. All loads are considered to the nearest litre (decimal
    points) in the fuel loads are not to be supported.


    Following conversations with the user, the following story has been developed:


    > Story S1: As a fuel depot dispatcher, I want to check if a fuel load fits in
    a tank so I can decide whether to accept it or not.


    The following detailed acceptance criteria have been agreed with the customer:


    +   - S11 Check a low-volatility fuel load that fits in a tank.

    - S12 Check a high-volatility fuel load that fits in a tank.

    - S13 Check a low-volatility fuel load that does not fit in a tank.

    - S14 Check a high-volatility fuel load that does not fit in a tank.

    - S15 List tank capacities.

    - S16 Exit when done (this is a general requirement of all software used in the
    depot company).

    - S17 Identify a user input data error – this criterion was suggested to the customer
    by the development team, based on their experience on web application design.


    This means we have one user story with seven acceptance criteria.


    # 10.2.1 Analysis


    To develop the tests, we need to identify:


    +   - 1. the different screens that the application presents;

    - 2. the user interface on each screen we need to interact with;

    - 3. how input and output data is represented on the screen.


    # Trial Runs


    The user interface can be most easily investigated by using trial runs of the
    software to determine how each story is achieved. An example of this follows for
    the Fuel Checker application described above. Each screen is shown in Figures
    10.1–10.4, along with a brief explanation.


    +   - Figure 10.1(a): at startup, the Enter Data screen is displayed.

    - Figure 10.1(b): after clicking on Information the Information screen is displayed.

    - Figure 10.2(a): after clicking on Continue the Enter Data screen is displayed,
    and the user enters 1000 for litres and selects High Safety Required.

    - Figure 10.2(b): after clicking on Enter the Results screen is displayed, with
    the message ‘Fuel does not fit in tank.’'
