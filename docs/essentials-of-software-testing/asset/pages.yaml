    # 10.4 Application Testing in More Detail


    Applications are a type of computer-based system with a user interface. It is
    useful to first consider system testing in general to better understand the role
    of application testing.

    System testing verifying that a system as a whole works correctly, and is almost
    invariably done using black-box testing (statement and branch) may be measured,
    and these results are used to develop further tests. There are many types of system,
    and each has its own unique testing challenges. However, all systems are tested
    over their system interface, and the principles of black-box and white-box apply
    when generating test data.


