  md: '+   If a subclass is not fully substitutable, then only a subset (and maybe
    none) of the superclass tests can be reused in the subclass inheritance test.
    Analysis must be performed to select the applicable tests. This analysis is more
    difficult as the standard UML class diagram does not specify whether a subclass
    is fully substitutable or not.


    +   In both cases, additional tests must be written to verify the subclass.


    Once the tests to run have been selected, inheritance testing is primarily a test
    automation question – see Section 11.9 for an example.


    # 9.4.11 State-Based Testing


    This form of state-based testing addresses the class encapsulation/state fault
    model. The purpose of state-based testing is to verify that the class behaves
    correctly with regards to its state specification (e.g. UML state machine diagram).
    A state diagram contains states and transitions between states. State-based testing
    verifies that the software transitions correctly between the states. There are
    three simple test strategies:


    +   all transitions – every transition is verified at least once;


    +   all end-to-end paths – every path from the start to the end state is verified
    at least once. If there is no state, which is common in state software diagrams,
    then every path from the state to every terminal state¹⁴ can be used;


    +   all circuits – every path that starts and ends in the same state is verified.


    Each transition is verified by an event that causes the transition, and an accompanying
    action which would occur (an *event–activity pair*). The correct operation of
    a transition is verified by:


    +   checking that the software is in the start state (this may have already been
    done by the verification of the previous transition);


    +   raising the event (i.e. call the method with the correct parameter values);


    +   checking that the specified activity has taken place correctly;


    +   checking that the software is in the correct state.


    It is not possible to fully check that an object is in the correct state, or that
    the correct action has taken place.¹⁵ In this case a partial check can be done.


    A diagram for SpaceOrder is shown in Figure 9.5. There are two states and three
    transitions explicitly specified in the diagram. There are also four transitions
    that are implied by the diagram, but not explicitly stated. implicitly specified
    transitions are method calls not shown on the state diagram – they would cause
    a transition back to the state, and have no associated action. In this example,
    the effect of calling `getSpecial()` and `getAccept()` in each of the


    > ¹⁴ A terminal state is one with no transitions to another state.


    > ¹⁵ This is a design for testability (DFT) issue – a class with state-based behaviour
    is easier to test if the designer takes testability into account.'
