    # 1.9.2 Program Proving


    Research has developed mathematical techniques, known as formal methods or formal
    verification, heavily based on set theory, that can be used to prove that a program
    meets its specifications. It can be done manually, though it is very time-consuming
    and requires a high level of expertise. It can be semi-automated, where a tool
    evaluates the code and provides proof obligations to be manually proven. Or, due
    to recent research advances, the proof can be fully automated. The programmer
    (or designer) produces formal requirements for the code, using mathematical notation,
    and the finished code is then run through a program prover to prove that the code
    matches its requirements (or to find counterexamples that it fails to do). The
    programmer will also be required to produce internal specifications in the code,
    and one of the most challenging of these are loop invariants. This requires less
    skill and experience than manual proofs, but is significantly more challenging
    than dynamic testing.


    The benefits of a proof are very significant: a program can be proven to work
    in all circumstances. The low-level program proof can also be incorporated with
    higher-level design proofs (such as model checking), providing an integrated proof
    framework for a full computer-based system.


    There are many languages and tools for program proving in development at the moment
    – however, it is argue whether any of them are quite ready for industrial use.
    For example, JML¹⁶ provides support for Java programs. See Section 14.3 for suggested
    further reading on this topic.


    # 1.10 Testing in the Software Development Process


    Having discussed why software needs testing, and summarised how testing might
    be done, it is useful to consider how testing fits into the software development
    process. Software of any degree of complexity has three key characteristics:


    +   1. user requirements, stating the needs of the software users;

    2. a functional specification, stating what the software must do to meet needs;
    and

    3. a number of modules that are integrated together to form the final system.


    ¹6 www.openjml.org'
