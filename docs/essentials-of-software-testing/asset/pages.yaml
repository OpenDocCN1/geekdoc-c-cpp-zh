  md: "# Organising Automated Test Code\n\nThe best way to organise your test class\
    \ files, and to ensure that all the code is tested, is to have a test class for\
    \ every demo class. For example, class Demo in file Demo.java would have a test\
    \ class DemoTest in file Demo.java. You can use any naming convention you like;\
    \ however, in this book we use the convention of adding the word Test after the\
    \ class name.\n\nIn the test classes, individual tests are implemented as methods.\
    \ In TestNG, each test method must be public and identified as a test method by\
    \ using the Java annotation (@Test). It is recommended that each test method implement\
    \ an individual test for two reasons:\n\n+   1. The method terminates as soon\
    \ as a test fails. This means that any subsequent tests, in the same method, will\
    \ not be executed. So, if you put multiple tests into a single method, the test\
    \ results cannot indicate whether one failed, or a number of tests failed.\n2.\
    \ It is easier to find a fault if you know which test failed.\n\nThe way to group\
    \ multiple tests together is to put one test per method, and group the test methods\
    \ into suites of tests, sometimes referred to as test sets. To increase flexibility,\
    \ test suites themselves be grouped into larger test suites. Note that parametrized\
    \ tests can contain more than one test per test method (see Section 11.5).\n\n\
    # Organising TestNG with an XML File\n\nAn XML file can be passed as a parameter\
    \ to the TestNG runner. This can organise the test methods into suites and tests\
    \ with test classes and test methods. An example is shown in Listing 11.2.\n\n\
    Listing 11.2 Sample XML file/example.xml.\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<!DOCTYPE suite SYSTEM \"http://testng.org/testng-1.0.dtd\">\n<suite\
    \ name=\"Suite1\">\n  <test name=\"standardTest\">\n    <classes>\n      <class\
    \ name=\"example.DemoTest\">\n      <methods>\n        <include name=\"test1\"\
    \ />\n      </methods>\n      </class>\n    </classes>\n  </test>\n  <test name=\"\
    extraTest\">\n    <classes>\n      <class name=\"example.DemoTestExtra\">\n```\n\
    \n> ^5 The TestNG terminology is slightly different from the standard IEEE terminology\
    \ that is used elsewhere in the book."
