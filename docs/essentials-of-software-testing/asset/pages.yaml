    # 6.5.2 Strengths and Weaknesses


    Branch coverage ensures that each output path from each Boolean condition (each
    decision at source level) is taken at least once during testing. Note that 100%
    branch coverage guarantees 100% statement coverage – but the test data is harder
    to generate. Branch coverage is a stronger form of testing than statement coverage,
    but it still does not exercise all the reasons for taking each branch, or combinations
    of different branches.


    # Strengths


    +   - It resolves the NULL else problem – branch coverage testing makes sure both
    the true and false outcomes are covered in testing.


    # Weaknesses


    +   - It can be difficult to determine the required input parameter values.

    - If the tool only counts decisions as branches, or if a control-flow graph has
    been manually developed, then it is underwhelming of compound conditions. In these
    cases it does not explore all the different reasons (i.e. the Boolean conditions)
    for the decision evaluating as true or false.


    Branch coverage, like statement coverage, is usually used as a supplementary measure
    of black-box testing – mainly because it is easy to measure automatically.'
