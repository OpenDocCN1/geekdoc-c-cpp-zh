    # 8.3.2 Condition Coverage


    So far, we have considered the use of control-flow path and dataflow paths as
    coverage criteria.


    For white-box testing, another recognized criteria is the Boolean conditions that
    cause each decision to be evaluated as true or false. A complex decision is formed
    from multiple Boolean conditions. Condition coverage (often abbreviated as CC)
    extends decision coverage by ensuring that, for complex decisions, each Boolean
    condition within the decision is tested for its true or false values. For this
    technique, it is not required that the decision itself takes on true or false
