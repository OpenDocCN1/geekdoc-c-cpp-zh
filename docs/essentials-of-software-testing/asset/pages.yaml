    # 10.4.9 Interacting with HTML Elements


    Each HTML element has its own attributes and behaviour¹⁶ and these need to be
    understood to develop effective tests. In this chapter we use the following Selenium
    methods for interacting with HTML elements:


    +   - anchor.click()

    - button.click()

    - checkbox.isSelected()

    - div.getAttribute("InnerHTML")

    - element.id

    - input, type=text, element.getAttribute("value")

    - input, type=text, element.sendKeys()

    - page.title


    In practice, reference to the HTML document object model and HTML specifications¹⁷
    and the Selenium API documentation¹⁸ is needed to find the necessary API calls,
    and to ensure that HTML elements are accessed correctly.


    Sometimes a tester may need to perform trials with different Selenium calls or
    different attributes to make sure the test is working correctly. When developing,
    it can be useful to print different attributes of an element, or the results of
    different Selenium methods, to the console for inspection.


