  md: '# Statement Coverage


    # 5.7 Key Points


    +   - Statement coverage is used to augment black-box testing by ensuring that
    every statement is executed.

    - Test coverage items are based on unexecuted statements.

    - Input values for the test cases are selected by analysis of the decisions in
    the code (and therefore are dependent on the specific version of the code being
    tested).

    - Statement coverage can be used in unit testing as shown, and it can also be
    used when testing object-oriented software exactly the same way. It can also be
    used in application testing, although for web applications, when the application
    is running on a remote server, setting up the server to produce coverage results
    and accessing those results can be challenging.


    # 5.8 Notes for Experienced Testers


    An experienced tester will perform black-box tests first and measure their coverage.
    Then, by reviewing the coverage results, additional tests can be developed to
    ensure full statement coverage. Working out the correct input values can be complex,
    and the experienced tester will often use the debugger to assist in doing this.
    One useful technique for complex decisions is to set a breakpoint at the line
    of code directly before the first unexecuted line, and then examine the value
    of the relevant variables. An experienced tester will probably develop the statement
    test cases directly from the coverage results, without documenting the analysis
    or TCIs. Unlike black-box testing, the test design work can be effectively reviewed
    by examining the coverage statistics generated by the test, without access to
    this documentation.'
