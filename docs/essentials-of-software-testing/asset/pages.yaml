  md: "# Inheritance Testing\n\nWhen a subclass inherits from a superclass, it inherits\
    \ the responsibilities of the subclass. This means that to test the subclass,\
    \ it must be run not only against the subclass tests, but also against the superclass\
    \ tests. Running against the superclass tests is referred to as inheritance testing\
    \ and ensures that the inheritance has been correctly implemented.\n\nThe key\
    \ problem with inheritance testing is running a set of tests designed for one\
    \ class against a different class. Obviously the different class must be compatible\
    \ (i.e. inherited).\n\nIn the standard template we have used (see Snippet 11.2)\
    \ this is not possible. The class to be tested is hard-coded into the test class.\n\
    \nSnippet 11.2 Test code for class XXX\n\n```\n// Test for class XXX\n@Test\n\
    public void test() {\n    XXX x = new XXX();\n    x.doSomething(input0, input1,\
    \ input2);\n    assertEquals(x.getResult(), expectedResult);\n}\n```\n\nOn line\
    \ 4 the test item is created inside the test class: the test can only be run against\
    \ an object of class XXX.\n\nIf we have a new class to test, which inherits from\
    \ this class, we need to run these tests against the new class (assuming that\
    \ it is a true subclass fully supports all the superclass behaviour¹⁰). A cut-and-paste\
    \ approach is shown in Snippet 11.3.\n\nSnippet 11.3 Running XXX tests against\
    \ YYY using cut-and-paste\n\n```\n// Inheritance test for class YYY\n@Test\npublic\
    \ void test() {\n    XXX x = new YYY();\n    x.doSomething(input0, input1, input2);\n\
    \    assertEquals(x.getResult(), expectedResult);\n}\n```\n\nThis works, but has\
    \ a number of serious limitations:\n\n+   - The obvious problem, with all cut-and-paste\
    \ approaches, is that any changes to the XXX test code do not automatically get\
    \ propagated to the YYY test code.\n\n> ¹⁰ The Liskov Substitution Principle defines\
    \ this as a strong relationship: the subclass is fully substitutable for the superclass."
  merge: -1
  pgno: 266
- img_proc: true
  md: "Also, it is probably in a different Java file. This is a particular problem\
    \ in modern development methods, where classes are refactored and added to a regular\
    \ basis.\n\n+   There is a second, less obvious problem. If a third class ZZZ\
    \ inherits from YYY, then you need to copy the XXX and YYY tests to the ZZZ test\
    \ class. This results in an explosion of copied code, and is very likely lead\
    \ to mistakes and untested code.\n\nHowever, there are some strengths in this\
    \ approach, which we need to consider when designing alternate approaches:\n\n\
    +   1. It is very clear what tests are being run against which class in the class\
    \ hierarchy\n2. It is possible to select which tests are to run for inheritance\
    \ testing. The tester may wish to not run some cases either for performance reasons,\
    \ or because the subclass is not fully Liskov substitutable and the tests are\
    \ not applicable.\n3. If theYY constructor takes parameters from the XXX constructor,\
    \ it is easy to handle – the correct parameters can just be passed to the YYY\
    \ constructor.\n\nWe will use two classes, Shape (Listing 11.12) and Circle (Listing\
    \ 11.13), to demonstrate two possible approaches to inheritance testing: passing\
    \ the class name as a parameter to the test, and inheriting it.\n\nListing 11.12\
    \ Source code for class Shape.\n\n```\nclass Shape {\n  String name = \"unknown\"\
    ;\n  String getName() { return name; }\n  void setName(String name) { this.name\
    \ = name; }\n}\n```\n\nListing 11.13 Source code for class Circle.\n\n```\nclass\
    \ Circle extends Shape {\n  int radius = 0;\n  int getRadius() { return radius;\
    \ }\n  void setRadius(int radius) { this.radius = radius; }\n}\n```\n\nThe inheritance\
    \ hierarchy is shown in Figure 11.12.\n\n# 11.9.1 Using the Class Name\n\nA test\
    \ for class Shape is shown in Listing 11.14 – instead of hard-coding the class\
    \ to be tested, the class name is passed as a parameter, and a factory method¹¹\
    \ is used to create the object to test.\n\n> ¹¹ A factory method can be used instead\
    \ of a constructor to create an object. The factory method must call a suitable\
    \ constructor."
