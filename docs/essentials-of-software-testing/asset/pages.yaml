  md: '# # Random Testing


    # ## 12.1 Introduction to Random Testing


    Fully automated random testing with no manual input is a goal of the software
    industry, and is a key research area. However, as discussed in the introduction
    in Chapter 1, there are three key issues with automated random testing:


    +   1. the oracle problem – how to tell if the result is correct;

    2. the test data problem – how to generate representative random data; and

    3. the test completion problem – how to know to stop generating tests.


    This is an active research area, and a discussion of all the up-to-date solutions
    to these problems is beyond the scope of this book. We will, however, present
    an introduction to the topic: a simple form of automated random testing using
    random data in conjunction with manually generated black-box or white-box test
    coverage items is presented in this chapter.


    # ## 12.2 Random Data Selection


    In this chapter, the same techniques that were covered previously (see Chapters
    2–9), but instead of creating the test coverage items (TCIs) with specific test
    data values, more general test criteria are developed. This allows the selection
    of random values that meet those criteria at runtime. This approach addresses
    the automated random test problems as follows:


    +   - Manual development of the test coverage items addresses the oracle problem
    by including the tester in the process.

    - Using test criteria and random number generators addresses the test data problem
    as these allow the generation of good data.

    - Limiting the test execution time addresses the test completion problem by offering
    a strategy for stopping.


    The technique is demonstrated through two examples: (1) unit testing and (2) application
    testing.'
