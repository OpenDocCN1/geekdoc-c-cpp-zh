  md: '# 8.4 Repair-Based Testing


    Following the discovery of faults at any stage in the software development process,
    the faults are prioritised and repaired. Following this repair, additional tests
    are often developed to thoroughly verify that the fault has been correctly repaired.
    These are often a combination of black-box tests and white-box tests.


    There are three different levels of such tests that can be developed: specific,
    generic, and abstracted.


    # 8.4.1 Specific Repair Test


    The specific repair test verifies that the software now operates correctly the
    specific data inputs that caused the failure. This will often consist of a white-box
    test that ensures that executing the new/modified code provides the correct output.


    # 8.4.2 Generic Repair Test


    To ensure that the repair works for other data values, and not just those that
    caused the failure, the conditions that caused the failure should be analysed,
    and black-box tests developed that exercise these conditions. The generic repair
    test verifies that the repair works for these different data values.


    # 8.4.3 Abstracted Repair Test


    In order to broaden the value of finding a fault, it is useful to abstract the
    fault as far as possible. Then additional black-box tests can be developed that
    attempt to find other places in the code where the same mistake may have been
    made by the programmer, leading to similar faults. If the fault has a characteristic
    signature (often caused by cut-and-paste operations), this can be searched for
    the code.


    # 8.4.4 Example


    Consider a program that at some point has to search a list of data for a particular
    entry. The data is kept in a linked list, and due to a mistake by the programmer
    never finds the penultimate entries in the list (i.e. entries that are secondfromlast).
    This fault eventually causes a failure, which is reported by a customer. The fault
    is then located by replicating the customer''s conditions and debugging the code.
    Subsequently the fault is repaired by rewriting a line of code in the method that
    handles traversing the list.


    To verify the repair, a white-box unit test is developed that exercises the new
    line of code. This verifies that the method now produces the correct result for
    the data that previously caused a failure. A black-box unit test is then developed
    that ensures that, for different sets of data, the second-last entry can be found
    in this list. A system test'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'may be developed to verify that the entire system now behaves correctly in
    situations when the second-last entry is important.


    Finally, additional unit tests or system tests are developed that check that,
    for any other lists or collections of data in the program, the second-to-last
    entry is located correctly.


    # 8.4.5 Using Repair-Based Tests


    These additional tests are run immediately after the repair to verify it. They
    can also be added to the standard tests for the method, to ensure that the fault
    is not repeated – and that a developer does not mistake revert to a previous version
    of the code.


    Prior to release of a software product, the risk of repaired faults having been
    reintroduced can be reduced by re-running all the repair-based tests separately.'
