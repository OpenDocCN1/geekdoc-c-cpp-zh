    # Normal Cases


    Normal cases are more difficult to categorise. Rather than selecting one value
    from each equivalence partition, a number of different values may be selected.

    For boundary values, the length of the data structure and of the data it contains
    should be considered.

    For combinations, a number of tests may be generated from each, selecting a number
    of values to represent each case rather than just one.

    The complexity of the data will depend on the complexity of the specification.
    It may be useful to select one data that includes the same value in each location
    in the string or array, if this is allowed. For strings representing contact information
    (such as names, addresses, or phone numbers), one might use a telephone directory
    to discover very short, very long, and a number of typical values. For arrays
    representing ints, such as a list of numbers to statistical tests, one might select
    a few data sets and one large set with known characteristics. And always, it is
    important to ensure that the output cases are all – these often provide additional
    guidance on selecting input values.


