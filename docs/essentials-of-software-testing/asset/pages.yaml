  md: '# Statement Coverage


    # 5.5 Statement Coverage Testing in More Detail


    # 5.5.1 Fault Model


    The statement coverage fault model is where code that has not been executed in
    previous tests may contain a fault. These unexecuted statements tend to be associated
    with edge cases, or other unusual circumstances.


    Statement coverage tests use carefully selected input values to ensure that every
    statement is executed. These tests attempt to find faults associated with individual
    lines in the source code.


    # 5.5.2 Description


    Tests are developed to cause all statements in the source code to be executed.
    The level of statement coverage achieved during testing is usually shown as a
    percentage – for example, 100% statement coverage means that every statement has
    been executed, 50% means only half the statements have been executed.


    Statement coverage is the weakest form of white-box testing. However, 100% statement
    coverage will probably not cover the logic of a program, or cause all the possible
    output values to be generated!


    An additional benefit of statement coverage is that unreachable code is identified
    during the analysis stage (this code should be reviewed and probably deleted).


    # 5.5.3 Analysis: Identifying Unexecuted Statements


    Based on the coverage results from previous tests (usually black-box tests), the
    unexecuted statements can be easily identified.


    For complex code, a control-flow graph (CFG) may be developed first to help with
    understanding the code flow at a more abstract level, but these are seldom required
    for statement coverage; CFGs are explained in Chapter 7. Statement coverage may
    also be developed before black-box tests, though this is not usual practice. In
    this case, CFGs are traditionally used to assist in developing the tests, though
    the experienced tester will probably not use them.


    # 5.5.4 Test Coverage Items


    Each statement in the source code is a TCI. Normally, a single line of source
    is regarded as being a statement. As in other forms of testing, using unique identifiers
    for the TCI makes the task of reviewing the test design easier.


    # 5.5.5 Test Cases


    Test data is selected to ensure that every statement, or node in the program,
    is executed. This selection requires the tester to review the code and select
    input parameter values that cause the required statements to be executed.


    > 5 All other forms of white-box structural testing ensure at'
