  md: '# 10.4 Application Testing in More Detail


    In top-down testing, the top layer of software (level 1 in Figure 10.14) is tested
    first with the underlying layer (level 2) replaced by stubs. At the next stage
    of testing, the level 2 stubs are replaced by the next layer of software (level
    2), and the new underlying layer (level 3) is replaced by stubs. This continues
    until all the stubs have been replaced by the operational software. All tests
    use the top-level interface (which may be an API or a user interface) as presented
    by level 1. Only one test driver is required, though it may require additions
    to make sure that the progressive integration with the underlying software is
    thoroughly tested.


    Bottom-up testing is the opposite: with the level 3 test driver testing the lowest
    layer of software (level 3). Then the next layer is introduced (level 2), and
    a new test driver written to test it (L2 test driver). This continues until all
    levels of the software have been integrated and tested. In contrast to top-down
    testing, the L3 test driver will use the L3 API, but the final L1 test driver
    will use the level 1 API. No stubs are required, but multiple test drivers must
    be written.


    A hybrid approach, sandwich testing, reduces the number of stubs required by testing
    three layers at a time: the focus of testing in this case is the middle layer.
    As an alternative to these layered approaches, most modern development processes
    focus on developing increments of end-to-end user functionality – for example,
    each deliverable feature in the product backlog (see Chapter 13). The order of
    testing these features are added incrementally is shown in Figure 10.15.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_230_0.png)


    Figure 10.15 Feature integration.


    In practice, system tests (or application tests) are often used to as integration
    tests, with mocks used to verify the integration. Developing tests that thoroughly
    exercise each interface is still time-consuming, and techniques for developing
    TCIs for integration testing are still being researched – see Chapter 14.


