    The output equivalence partitions, identified from the specification in Chapter
    2, are repeated in Table 4.2 for convenience.


    Table 4.2 Output equivalence partitions for giveDiscount().


    | Parameter | Equivalence partition |

    |---|---|

    | return value | FULLPRICE DISCOUNT ERROR |


    Working through the output partitions in order allow the non-error effects for
    bonusPoints to be systematically developed:'
