  md: '# 14.3 Further Reading 293


    +   - Part 4 defines specific test techniques.

    - Part 5 covers keyword-driven testing.


    Not every technique in the standard is covered in this book, and not every technique
    in this book is included in the standard. Three particular topics not covered
    in the current standard is integration testing, the testing of object-oriented
    software, and all paths testing. The standard defines a very detailed and rigorous
    approach to software testing – it is likely that only large organisations with
    a requirement for high-quality software will use the full standard. There are
    a number of related IEEE standards on particular aspects of testing.


    The other key standard is the ISO 25000 family of standards. These provide guidelines
    for software requirements and evaluation, and are essentially process related.


    # 14.3.3 Software Testing Techniques


    The classic books on software testing techniques are *Software Testing (Roper)*
    and *The Art of Software Testing (Myers)*. The ideas in Roper''s book are still
    relevant today, and this book provides an excellent description of how to actually
    apply test techniques. Myers presents many interesting ideas, but they often require
    interpretation by the reader to apply in practice.


    The modern classic on the topic is *Introduction to Software Testing*, 2nd edition
    (Ammann and Offutt). This provides an excellent mathematical foundation for software
    testing. It is a book best suited to expanding the understanding of the experienced
    tester.


    # 14.3.4 Testing Object-Oriented Software


    There are many books on the subject, but in our opinion by the far best is *Testing
    Object-Oriented Systems: Models, Patterns, and Tools* (Binder). This has detailed
    coverage on the topic, and is treated as a reference book rather than an introductory
    textbook. It probably provides the best discussion on using fault models in any
    software testing book. It also includes a detailed, slightly out of date, treatment
    of UML diagrams and how to use them as the source of test data.


    # 14.3.5 Integration Testing


    For such an important topic in the modern development environment, there is a
    disappointing of focus on systematic techniques for integration testing. In particular,
    there is little detailed definition of fault models and how to identify test coverage
    items and test data. In an Agile process, software is produced in a series of
    increments, and as each is added (software integration) it should be tested to
    make'
