  md: '# Testing in the Software Process


    ![](img/6a3e28417c651af2c9c33c1aa588b582_301_0.png)


    The advantages of the V-model are that it is simple and easy to manage due to
    the rigidity of the model, and it encourages verification and validation at all
    phases: each phase has specific deliverables and a review process. Unlike the
    waterfall model, it gives equal weight to testing rather than treating it as an
    afterthought.


    # 13.5 Incremental and Agile Development


    In many software projects it is impossible to arrive at a stable, consistent set
    of user requirements at the beginning of the project. The waterfall model and
    the V-model of development do not provide an adequate framework for this situation,
    and an approach based on incremental or Agile models can provide much better results.
    Agile software development is associated with the Agile Manifesto,⁵ which outlines
    four key components:


    +   1. individuals and interactions over processes and tools;

    2. working software over comprehensive documentation;

    3. customer collaboration over contract negotiation; and

    4. responding to change over following a plan.


    Like other incremental development methods, Agile methods emphasise releasable
    software quickly in short time frames. Unlike other incremental methods, Agile
    development measures these time frame in days or weeks rather than


    > ⁵ K. Beck, M. Beedle, A. van Bennekum, et al. Manifesto for Agile Software Development.
    The Agile Alliance, 2001.'
