  md: 'sure it works correctly with the existing code (integration testing). Integration
    testing is currently addressed as an ad-hoc approach, and is best learned through
    experience in large systems.


    Two representative books we have selected that address the topic are Integration
    Testing from the Tranches (Frankel) and Continuous Integration (Duvall). Frankel
    has a number of examples, and shows how to use a number of tools, and contains
    an interesting discussion on integration with external software systems. From
    a testing viewpoint, Duvall is more focused on how to automate tests (unit, system,
    functional). Both books contain useful coverage of stubs/mocks and the tools used
    to test with.


    We suggest this topic to the reader as an important and fruitful area for future
    research.


    # Random Testing


    There is no up-to-date, comprehensive textbook covering the principles of random
    software testing.


    A detailed introduction to the research can be found in New Strategies for Automated
    Random Testing (Ahmad). The specific technique of DART referenced in the book
    is discussed in DART: Directed Automated Random Testing (Godefroid). An up-to-date
    survey of adaptive random testing can be found in A Survey on Adaptive Random
    Testing (Huang) – adaptive random testing adapts the test input based on the behaviour
    of various processes.


    There are many tools for random stability testing for android applications, often
    be referred to as monkey testing, and a number of papers evaluate these – for
    example, An Empirical Comparison between Monkey Testing and Human Testing (Mohammed).
    Of particular interest to the reader might be the use of this approach by Facebook,
    as discussed in Sapienz: Multi-objective Automated Testing for Android Applications
    (Mao).


    # Testing for Language-Specific Hazards


    Most programming languages are a compromise between simplicity and features. This
    leads to programming mistakes that are language-specific as the designers of every
    language make different decisions about these compromises. For example, a programmer
    moving to a new language is likely to make mistakes. The tester should understand
    these hazards in order to write language-specific tests.


    There are many books written on the topic. For the Java programmer, the most detailed
    book to be More Java Pitfalls (Daconta et al.). This book is very useful for the
    tester, as they identifying constructs that are likely to cause faults in the
    code.


    The tester should know the term anti-pattern, which is used to refer to practices
    that are not recommended. If an anti-pattern has been used in software, it is
