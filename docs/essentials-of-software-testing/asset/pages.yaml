    We discussed this detail in Chapter 1.


    Some factors to consider deciding what test techniques to use, and when to use
    them in the development process:


    +   - Black-tests can be written before, or in parallel with, the code (as they
    are based on the specifications).

    It normally serves no purpose to execute white-box tests before black-box tests.

    White-box testing *never* can be used as a substitute for black-box testing (see
    Section 8.1.3 for details).

    Black-box tests must be reviewed, and probably changed, every time the code is
