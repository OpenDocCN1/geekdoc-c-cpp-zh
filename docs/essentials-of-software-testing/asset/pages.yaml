    # 5.6.2 Strengths and Weaknesses


    # Strengths


    +   - Statement coverage provides a minimum level of coverage by executing all
    the statements in the code at least once. There is a significant risk in releasing
    software before every statement has been executed at least once during testing
    – its behaviour has not been verified, and may well be faulty.

    - Statement coverage can generally be achieved using only a small number of extra
    tests.


    # Weaknesses


    +   - It can be difficult to determine the required input values.

    - It may be hard to test code that can only be executed in unusual or abnormal
    circumstances.

    - It does not provide coverage for the NULL else. For example, in the code:


    ```

    if (number < 3 ) number++;


    statement coverage forces a test case for number ≥ 3

    it is not demanding of compound decisions. In the code:


    if ( a > 1 ) || ( b == 0 ) ) x = x/a;

    ```


    there are no test cases for each value of each individual Boolean condition in
    the decision, or for the possible combinations of the Boolean conditions.


    Statement coverage is generally used to supplement black-box testing – because
    it is easy to measure the coverage automatically. If black-box testing does not
    result in the required coverage (normally 100%) then this white-box technique
    can be used to increase the coverage to the required level.


    > 8 A decision is a Boolean expression that is used to alter the flow of control
    in the code. These are used, for example, in if and while statements. Each Boolean
    sub-clause in a Boolean expression is referred to as a Boolean expression. In
    this example, (a > 1) || (b == 0) are Boolean conditions in the decision ((a >
    1) || (b == 0)). Simple decisions have a single Boolean condition, as shown above,
    where (number < 3) is both a decision and also the single Boolean condition in
    that.'
