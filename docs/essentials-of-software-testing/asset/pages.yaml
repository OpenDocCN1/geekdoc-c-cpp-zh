    # 9.4.5 Analysis for OO Testing


    There are three parts to the analysis. The first is deciding which methods will
    be tested. The second is analysing the class and its interface. The third is,
    as for conventional unit testing, analysing the test specifications (and possibly
    code) by applying the test design technique(s) selected in order to identify the
    TCIs.


    # 9.4.6 Test Coverage Items


    The TCIs are identified for the test design technique(s) selected using the results
    of the analysis.


    # 9.4.7 Test Cases


    Not only the data values to be used, but the sequence of method calls, must be
    decided on. This can be left until the implementation phase, but it is important
    at implementation time to know which method to be called (as different methods
    may have the same parameter name for different purposes), and sequence may have
    an impact on the data values.


    As for the worked example in Section 9.2.2, test cases should be developed for
    the following:


    +   1. Static methods – these are not dependent on the constructor. Usually they
    are independent, if they interact through static attributes then they should be
    considered in class context along with static methods.

    2. The constructor(s) – including the default constructor. Note that the constructor
    is called after the other object initialisation has taken place.

    3. Simple methods that do not use the class attributes.

    4. Accessor methods (getters and setters) – if they are to be tested.

    5. The other methods, which use the class attributes.


    It is recommended to limit each primary method call tested to one test case, though
    this may require a number of supporting method calls, as we have seen. This makes
    reviewing the test cases for correct ordering and completeness easier.¹

    It is not always necessary to use separate tests for each input error case (unlike
    in equivalence partition testing), as long as the input error values are inputs
    to different methods and do not cause error hiding.'
