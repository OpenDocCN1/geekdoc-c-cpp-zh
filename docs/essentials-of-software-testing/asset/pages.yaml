  md: '# Test Automation


    Manual testing is slow, error-prone, and hard to repeat. Software testing needs
    to be fast, accurate, and repeatable. The solution is test automation. This chapter
    provides insight into the process of automated testing and relates to the test
    design techniques discussed in previous chapters.


    # 11.1 Introduction


    Software testing needs to be *fast*, so that it can be performed frequently without
    a time penalty. It needs to be *accurate*, so that the test results can be relied
    on as a quality indicator. And it needs to be *repeatable* to allow for regression
    testing, where the same tests may run many times for different software versions.

    This is particularly true for modern *agile* development approaches, where small
    increments of functionality are added and tested in a rapid cycle.

    Some of the testing tasks that can be automated relatively easily:


    +   - execution of tests;

    - collection of test results;

    - evaluation of test results;

    - generation of test reports; and

    - measurement of simple white-box test coverage.


    Some of the testing tasks that are more difficult to automate:


    +   - generation of test case items and the data for test cases;

    - measurement of black-box test coverage; and

    - measurement of complex white-box test coverage;


    Unit test execution is invariably automated. This is implemented by writing code
    that calls the required methods with the specified test input data, and compares
    the actual results with the expected results.

    Application tests are more *difficult* to automate. In manual testing, the correctness
    of the output on the screen can be left to the tester''s judgement. Automated
    testing requires the details of how the expected results are displayed to be known.

    Application tests are also more *complex* to automate, as they depend on the details
    of the system interface: inputs are provided and results collected via the system'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# 11.1 Introduction


    interface. It generally takes extra time to develop automated application tests.
    Not only do the tests themselves to be implemented, but there is an additional
    and complex program interface library to be used. In general there is a shift
    from manual to automated application testing. A rule-of-thumb is that if a test
    is to be executed more than twice, it is worthwhile referred to as test sets or
    test suites.


    Automated tests can be grouped into collections (which are also referred to as
    test suites), and the results automatically collated into a report. The report
    includes an overall summary of the test result (pass or fail). It may also include
    statistics on the tests that have run. It will also include a test incident report
    on each failure, providing exact details on why the test failed to operate in
    order to locate the fault.


    In this chapter, automated unit testing is examined in more detail, using TestNG
    an example test framework (as used in Chapters 2-6). Automated application testing
    is also examined in more detail, based on TestNG to manage the tests, and Selenium
    to interface the tests with web-based applications. It must be emphasised that
    all are just test tools, representative of the typical features to be found in
    test automation tools.


    # 11.1.1 Interpreting Test Results


    Automated testing may generate a number of different test results:


    +   - passed – the test has passed;

    - failed – the test has failed;

    - skipped – the test was not run (for example if some setup failed to execute
    properly prior to the test); and

    - not selected – the test was in the test collection, but deselected for execution.


    It is important to differentiate between tests that failed and those that were
    skipped. Tests are usually skipped because the test setup failed: perhaps the
    class for the code being tested was not in the expected location, or the web driver
    was the wrong version for the web browser in use. Skipped tests generally require
    a response by the tester to rerun them.


    # 11.1.2 Documenting Automated Tests


    When designing tests, the test documentation produced includes analysis results,
    the test coverage items (TCIs), and the test case/test data. The test case identifiers
    should be referenced in the test method name or in the data fields for parametrised
    tests.


    When automating software tests, there are two choices for where to store the test
    documentation: in separate files (perhaps using word processing and spreadsheet
    tools, or in a database in a larger organisation), or to store it as comments
    in the test programs.


    > See https://testng.org.


    > See www.selenium.dev.'
