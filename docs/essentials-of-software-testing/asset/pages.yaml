  md: '# 8.1 Comparison of Black-Box and White-Box Testing


    # 8.1.1 Black-Box Testing


    Black-box testing can be expressed in a number of different ways:


    +   - testing against the specification;

    - using test coverage criteria based on the specification;

    - developing test cases derived from the specification; and

    - exercising the specification.


    They all reflect the idea of testing the function of the software using the specification
    as a source of test cases.

    Regarding software as a mapping from input values to output values, the purpose
    of black-box testing is to ensure that every value in the input domain maps to
    the correct value in the output domain (Figure 8.2). This is ideally achieved
    by exercising all the mappings in the specification. As discussed in Section 1.6,
    exhaustive testing is seldom feasible, and so a subset of possible inputs must
    be selected to cover key mappings between the input and output domains.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_162_0.png)


    Figure 8.2 Specification model of testing.


    # Measurement


    It is difficult to automatically measure the degree of coverage of the specification
    that black-box testing has achieved. Correct implementation of black-box tests
    therefore relies heavily on the quality of the tester''s work.


    # 8.1.2 White-Box Testing


    Likewise, white-box testing can be expressed in a number of different ways:


    +   - testing against the implementation;

    - using test coverage criteria based on the implementation;

    - developing test cases derived from the implementation; and

    - exercising the implementation.


    They all reflect the idea of testing the correction of the software using the
    structure of the implementation as a source of test cases.

    Regarding software as a set of components that create output values from input
    values, the purpose of white-box testing is to'
