  md: 'The CFG is language-independent, provides a simplified model of the source
    code. This allows sequential blocks of code, branches, and paths to be easily
    identified.


    # Development of the CFG


    The CFG is developed systematically, starting at the beginning of the code and
    working down until all the code has been incorporated into the CFG. Where possible,
    maintain consistency, `true` branches are placed on the right and `false` branches
    on the left. The steps in the development of the CFG for this example are shown
    below:


    +   1. The CFG starts with the entry point (line 22). From here, the code executes
    to line 28. Lines 22–28 form a block of indivisible statements; so this is represented
    by a single node, labelled (22..28) (Figure 7.1). It is recommended that you label
    the nodes with the line numbers they contain — it is much more informative than
    just numbering the nodes 1, 2, 3, etc. Remember that each node must represent
    an indivisible block of code (containing no branches).


    ![](img/6a3e28417c651af2c9c33c1aa588b582_134_0.png)


    Figure 7.1 CFG stage 0.


    +   2. On line 28, if the decision (`bonusPoints > 0`) is true, then control branches
    to line 29. If not, the control branches to line 38. This is shown in Figure 7.2.
    A quick inspection of the code shows that there are no jumps between lines 38–41,
    so this node is labelled 38.41. The expression `bonusPoints > 0` shows the expression
    that must be to take the right-hand branch.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_134_1.png)


    Figure 7.2 CFG stage 1.


    +   3. On line 29, if the decision (`bonusPoints < thresholdJump`) is true, then
    control branches to line 30. Otherwise, control branches to line 31. After line
    30, control always goes to line 31 (Figure 7.3).


    +   4. At the source-code level, the ternary conditional operator (`?:`), often
    referred to as the question-mark-colon operator, is regarded as a single line
    of code.'
