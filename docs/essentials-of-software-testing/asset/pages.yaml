  md: '# # Introduction to Software Testing


    This chapter discusses the motivations for testing software, and also discusses
    why exhaustive testing is not generally feasible, and thus various test heuristics
    must be used. These test heuristics, and the lack of a standard software specification¹
    language, are what make software testing as much an an art as a science.


    # ## 1.1 The Software Industry


    The software industry has come a long way since its beginnings in the 1950s. In
    1969 when IBM announced the independent software industry was essentially born
    it would stop treating its software as a free add-on to its computers, and instead
    would sell software and hardware as separate products. This opened up the market
    to external companies that could produce and sell software for IBM machines.


    Software products for mass consumption arrived with the launch of PC-based software
    packages. In 1981 Another dramatic boost came in the 1990s with the arrival of
    the Wide Web, and in the 2000s with mobile devices. In 2010 the top 500 companies
    in the global software industry had revenues of $492 billion, and by 2018 this
    had risen to $868 billion². The industry is extremely dynamic and continually
    undergoing rapid change as new innovations appear. For example transportation,
    it is still in many ways an immature industry. It does not, in general, have a
    quality of standards that have been gained through years of experience.


    Numerous examples exist of the results of failures in software quality and the
    costs it can incur. Well-published incidents include the failure of the European
    Space Agency''s Ariane 5 rocket, the Therac-25 radiation therapy machine, and
    the loss of the Mars Orbiter in 1999. A study by the US Department of Commerce''s
    National Institute of Standards and Technology (NIST) in 2002 estimated that the
    annual cost of inadequate software testing to the US economy is up to $59.5 billion
    per year.³.


    +   ¹ A software specification defines clearly and unambiguously what the software
    must do.


    +   ² Software Magazine. 2018 Software 500 Companies. Available at: http://rcpbysersguide.com/top-companies.php.


    +   ³ NIST. The Economic Impacts of Inadequate Infrastructure for Software Testing.
    NIST, 2002.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction to Software Testing


    However, many participants in the industry do quality models and measures to the
    processes through which their software is produced. Software testing is an important
    part of the software quality assurance process, and is an important discipline
    within software engineering. It has an important role to play throughout the software
    development life cycle, while being used in a *verification* and *validation*
    context, or as part of a test-driven software development process such as *Xtreme
    Programming*.


    Software engineering as a discipline grew out of the *software crisis*. This term
    was first used at the end of the 1960s, but it really had gone meaning through
    the 1970s as the software industry was growing. This reflected the increasing
    size and complexity of software projects combined with the lak of formal procedures
    for managing such projects. This resulted in a number of problems:


    +   - projects running over budget;

    - projects running over time;

    - the software products were of low quality;

    - the software products often did not meet requirements;

    - projects were chaotic;

    - software maintenance was increasingly difficult.


    If the software industry was to keep growing, and the use of was to become widespread,
    this situation could not continue. The solution was to formalise the roles and
    responsibilities of software engineering personnel. These software engineers would
    plan and detail in the goals of each software project and how it was to be carried
    out; they would manage the process through which the software code could be created;
    and they would ensure that the end result had attributes that showed it was a
    quality product. This relationship between quality management and software engineering
    meant that software testing would be integrated into its field of influence. Moreover,
    the field of software testing was also going to have to change if the industry
    wanted to get over the software crisis.


    While the difference between debugging a program and testing a program was recognised
    by the 1970s, it was only from this time that testing began to take a significant
    role in the production of software. It was to change from being an activity that
    happened at the end of the product cycle, to check that the product worked, to
    an activity that takes place throughout each stage of development, catching faults
    as early as possible. A number of studies comparing the relative costs of early
    and late defect detection have all reached the same conclusion: the earlier the
    defect is caught, the lower the cost of fixing it.


    The progressive improvement of software engineering practices has led to significant
    improvement in software quality. The short-term benefits of software testing to
    the business include improving the performance, interoperability and conformance
