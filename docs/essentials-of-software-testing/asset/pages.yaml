  md: '# Testing in the Software Process


    users are more committed to the system because they have watched it grow. Thus,
    another advantage of the incremental approach is an accelerated delivery of customer
    services: important new functionality has to be included with every iteration
    that the customer can monitor and evaluate the progress of the product. Two primary
    disadvantages are that it can be difficult to manage because the lack of documentation,
    in comparison to other models, and continual changes to the software can make
    it difficult to maintain as it grows in size.


    # 13.5.2 Extreme Programming


    Extreme Programming (XP) was an early approach to Agile software development,
    which emphasizes code reviews, continuous integration, and automated testing in
    iterations. It favours ongoing design refinement (or refactoring) in place of
    a large initial design phase, in order to keep the implementation as simple as
    possible. It favours real-time communication, preferably face-to-face, over written
    documents, leading to less documentation compared to the waterfall method. Working
    software is seen as the primary measure of progress. The methodology also emphasises
    work: managers, customers, and developers are all part of a team dedicated delivering
    quality. Programmers are responsible for testing their own work; testers are focused
    on helping the customer select and write functional tests, and on running these
    on a regular basis.


    The XP process encourages developers to:


    +   - continuously communicate with customers and fellow programmers;

    - keep their design simple and clean;

    - get feedback from early software testing; and

    - deliver a system to customers as early as possible and implement changes as
    suggested, so developers respond with courage to changing requirements and technology.


    Figure 13.5 presents a test-centric diagram of the XP process that highlights
    the testing activities.


    User stories are written by the customers, providing the user requirements specifications.
    They are in the format of about three sentences of text written by the customer
    using non-technical language. The user stories are the base for the software requirements,
    which are used to plan releases of the software. They are also used to produce
    test scenarios that drive the acceptance testing for each release. A release of
    the software consists of multiple iterations, each of which lasts 1–3 weeks. Each
    iteration can be considered as containing pre-testing, testing, and post-testing
    activities.'
