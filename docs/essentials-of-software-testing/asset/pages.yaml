  md: '# Application Testing


    +   - Locating the inputs:


    +   - In unit testing, the inputs are located by their position in the method/function
    call (though some other languages also support parameters). The inputs may be
    class attributes, or accessed from an external resource such as a file, database,
    or physical device.

    - In application testing, the inputs are located elements on the screen, and may
    be presented using various analogues (such as a slider for a number). Trial runs
    of the application are used to identify these. In a well-designed application,
    they have unique identifiers, with least regards to each screen, but otherwise
    the absolute or relative position on the screen may be the only way to locate
    them. For unit testing, the input may also come from external sources.


    +   - Locating the outputs:


    +   - In unit testing, the outputs may be returned by the method/function call,
    or may be side-effects (i.e. class attribute changes, or sent to an external resource).

    - In application testing, the outputs are represented in the same way as the inputs
    as elements on the screen, and may be presented over many screens. The same issues
    as for the application testing in terms of locating them. As for unit testing,
    the outputs may also be sent to external resources (for example, a database).


    +   - Automating the tests:


    +   - In unit testing, automated implementation is usually straightforward: locate
    a set of input values, call the method/functions, get the return value (actual
    results), and check against the expected results.

    - In application testing, each input element must be located separately, possibly
    on different screens, and manipulated correctly to represent the input value.
    The application functionality must be triggered, sometimes via a simple button
    but often requiring more manipulation of screen elements. The output must then
    be located and extracted from the screen, and then interpreted to generate the
    actual result before the task of comparing against the expected results can be
    performed.


    # 10.8 Notes for Experienced Testers


    The experienced tester will usually develop the test code directly from the user
    stories and acceptance criteria. They will run the application at the same time
    in order to find the HTML ids and element types as required, and mentally determine
    the typical data values to use. However, it will be essentially impossible to
    review the tester''s work without the reviewers redoing all the analysis. In order
    to alleviate this, the'
