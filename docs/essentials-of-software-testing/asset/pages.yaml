    When the software being tested requires another software component that has not
    been implemented, temporary software (referred to as stubs) is written. This stub
    software has limited functionality – often it will provide just enough support
    for the tests to execute. Stubs may also be used to speed up tests by avoiding
    slow networking calls, or to prevent actual actions taking place (such as sending
    emails or modifying an active database).


    Stubs may include instrumentation (e.g. counters added to the stub code) to measure
    how much of the test code has been called, or ''assertions'' to verify correct
    operation. Testing with these instrumented stubs is often referred to as *mocks*.
    Testing with mocks is referred to as *mock testing* or *monitoring*, which is
    supported by many tools.⁸


    If the lower layer of the software is produced first, top-down integration testing
    is used, as shown in Figure 10.14(a). If the bottom layer of the software is produced,
    first-bottom integration testing is used, as shown in Figure 10.14(b).


