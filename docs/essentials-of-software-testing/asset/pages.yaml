  md: '# # Appendix: Running the Examples


    All the examples shown in the book are available online at https://www.cambridge.org/bierig.
    They can be run on Windows or Linux, and have been verified on Windows 10 and
    Ubuntu 18.04. Some small changes may be required to run the examples on MacOS.


    Before running any of the examples, you must have the Java JDK installed. All
    the examples have been verified using the latest LTS (long-term support) version
    of Java at the time of publication: JDK 11. You must also have TestNG installed.
    Chapters 5 and 6 require the JaCoCo coverage libraries, and Chapters 10–12 require
    Selenium. Details of the versions required, and where they were downloaded, are
    provided in the file readme.txt in the top-level folder. All the dependencies
    should be placed in the ''libraries'' folder before running the examples.


    For simplicity, the examples have been developed to run from the command line.
    For this, you must the JDK bin folder on your PATH (you can verify this by typing
    the commands `javac -version` and `java -version`). Both command should complete
    successfully, and should show the same Java version. You can also run the examples
    from an IDE (such as Eclipse), but no instructions are included for this.


    The top-level folder contains utility scripts (windows batch files) to build and
    run the examples:


    +   - **readme.txt** provides a complete list explaining each file for that chapter;

    - **check-dependencies.bat** checks that the Java compiler is on PATH, and that
    the .jar files are needed in the libraries folder;

    - **compile-all.bat** compiles all the java files required for the book;

    - **run-menu.bat** allows you to run all of the examples; select the chapter and
    then the figure number.


    Each chapter has its own folder, and in each folder there are scripts to compile
    and run the associated examples. See how these are called from run-menu.bat.


    Every Windows batch file (xxx.bat) has a corresponding bash script for use on
    Linux (xxx.sh).'
