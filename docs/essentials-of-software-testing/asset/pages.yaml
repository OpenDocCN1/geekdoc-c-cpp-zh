  md: 'Where the effect is for an output (here the return value) to take on one of
    the input values, it is important to list all the possibilities, as they are not
    mutually exclusive. In this case, when x is equal to y, the output is equal to
    both x and y.


    **Example D** Consider the method boolean inRange(int x, int low, int high), which
    returns true when low <= x <= high. Note that the return value is undefined if
    high < low, and we cannot test in this condition.


    It is not optimal, but it would be possible to create three cases as follows:


    +   1. x < low

    2. low <= x <= high

    3. x > high


    However, mutually exclusive rules (where only one can be true) make for large
    decision tables, which are difficult to handle. A preferred set of causes is as
    follows:


    +   1. x < low

    2. x <= high


    These cases can be interpreted as shown in Table 4.17.


    **Table 4.17** Interpretation of combinations.


    | x < low | x <= high | Interpretation |

    |---|---||

    | T | T | x out of range, x < low not possible, x cannot be smaller than low and
    greater than high |

    | F | T | x in range, x >= low and x <= high |

    | F | F | x out of range, x > high |


    This reduces the number of causes and allows for better use of combinations of
    causes (as they are no longer completely mutually exclusive).

    There is only one *effect* for the Boolean return value (which can be *true* or
    false):


    +   1. return value


    Please note:


    +   * It is redundant to use the effect return value == true. The expression return
    value is a Boolean expression, and the T and F in the decision table indicates
    when it is true or false.

    * For a Boolean *return* value, it is also redundant to use two effects:


    +   1. return value

    2. ! (return value)'
