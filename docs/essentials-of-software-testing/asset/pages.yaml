    # Handling Large Tables


    When the number of rules exceeds 16, the tables become too large to handle easily.
    Two techniques⁷ for reducing the size of large tables are presented here:


    +   - sub-tables

    - pairwise testing


    # Sub-Tables


    Table 4.24 can be reduced in size by splitting the problem into two separate tables:
    one with flag always true, and one with flag always false. Each table will be
    half the size of the original – see Table 4.26 and 4.27.


    | | 1 | 2 | 3 |

    |---|---|---|---|n| Causes | | | |

    | x < low | T | F | F |

    | x ≤ high | T | T | F |

    | Effects | | | |

    | return value | F | T | F |


