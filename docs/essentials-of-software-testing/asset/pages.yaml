    # Black-Box and White-Box Testing


    These are two general categories of heuristic for selecting a subset of the input
    parameters. One is to generate input values based on exercising the specification.
    This is referred to as black-box testing (or specification-based testing). The
    other is to generate input values based on exercising the implementation (most
    techniques use the source code). This is referred to as white-box testing (or
    structure-based testing).


    Exercising the specification means to have generated enough tests to ensure that
    every different type of processing, contained in the specification, has been performed.
    This not only means that every different category of output has been generated,
    but also that every different category of output has been generated for every
    different input


    Exercising the implementation means to have enough tests so that every component
    that makes up the implementation has demonstrated to produce a valid result when
    executed. At its simplest, each line of source code is regarded as a separate
    component. But, as you will see in the following chapters, there are sophisticated
    ways of identifying components that provide for full coverage of a program’s possible
    behaviours.


    In all tests, exercising the code or the specification is not enough. A test must
    not only do this, but must also verify that the actual results match the expected
    results. The test result is a pass if and only if this verification is sufficient.


    This book introduces a number of essential techniques for selecting test data
    and demonstrates their use in unit testing (testing a single method), object-oriented
    testing (testing an entire class), and application testing (testing an entire
    application). Once'
