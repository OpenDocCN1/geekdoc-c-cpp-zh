  md: '# # Boundary Value Analysis


    Equivalence partition testing uses representative values from each range of values
    for which the specification states equivalent processing. Programmers often make
    mistakes at the boundary values of these ranges, which will not be caught by equivalence
    partition testing, as has been demonstrated in Chapter 2. This chapter introduces
    the black-box testing technique of boundary value analysis (BVA), with a worked
    example and concluding with a more detailed examination of the topic.


    # ## 3.1 Testing with Boundary Value Analysis


    Boundary values are the minimum and maximum values for each equivalence partition.
    Having identified the partitions, identifying the boundary values is straightforward.
    The goal is to verify that the software works correctly at these boundaries.


    > **Definition:** a boundary value is the value at the boundary (or edge) of an
    equivalence partition. Each equivalence partition has exactly two boundary values.


    # ## 3.2 Example


    Testing of the method `OpenSales.giveDiscount(bonusPoints, goldCustomer)` continues
    in this chapter. To summarise, this method returns:


    ```

    FULLPRICE if bonusPoints <= 120 and not a goldCustomer

    FULLPRICE if bonusPoints <= 80 and a goldCustomer

    DISCOUNT if bonusPoints > 120

    DISCOUNT if bonusPoints > 80 and a goldCustomer

    ERROR if any inputs are invalid (bonusPoints < 1)

    ```


    # ### 3.2.1 Analysis: Identifying the Boundary Values


    Boundary value analysis uses the equivalence partitions previously identified
    in `giveDiscount()` in Chapter 2. These are repeated here in Figures 3.1–3.3.'
