    # Strengths


    +   - Limited or no manual intervention is required to run the tests. This holds
    the potential for a significant improvement in software quality.

    - A large number of tests can be run in a limited time.

    - Stability testing has proven very successful in finding situations in which
    software hangs or crashes, and has been an important element in improving this
    aspect of software quality.


    # Weaknesses


    +   - Most existing tools only perform stability testing, and therefore do not
    verify the correct operation of the software, which must be tested separately.

    - The test oracle, data selection, and test completion problems are still largely
    unresolved.

    - Effective techniques require full software specifications. These are time-consuming
    to develop, and many developers are not experienced in producing these using during
    formal languages (e.g. OCL).


    # 12.7 Key Points


    +   - There are three key problems with fully automated random testing: the test
    oracle problem, the test data problem, and the test completion problem.


