  md: '# Wrap Up


    Except for software with high quality requirements, it is unusual to document
    the outputs of the test design process to the level of detail shown in this book.
    Normally, much of the work is done in the tester''s mind. It is, however, almost
    impossible to review a test to ensure it is correct without documentation of the
    analysis, TCIs, test cases, and test data. Whether the outputs are written down
    or not, the tester must perform the same work. While learning how to test, it
    is excellent to write down the output of every activity in the process.


    # 14.3 Further Reading


    In this book, we have focused on what we regard as the absolutely essential techniques
    the software tester must understand. There are therefore many topics that are
    covered only briefly, or not at all. This section provides some suggested works
    providing a deeper understanding of topics covered in the book, and also suggests
    that cover additional topics not covered in the books. The focus is on works that
    describes specific testing techniques and how to apply them in practice – many
    books that cover software testing at a higher level, or that are focused on specific
    tools or environments, are not included.


    There are many books and papers on software testing. In this section we provide
    an annotated list of recommended works, which we have found useful in preparing
    the book. The list starts with more general works that discuss the software process
    and how testing fits into this, and ends with more specific works that address
    particular techniques or aspects of testing. We only provide a small number of
    selected, key texts in each area; this is not a comprehensive survey of the software-testing
    literature. Full details to all these readings are provided in the Bibliography.


    # 14.3.1 Testing in the Software Process


    The standard software engineering textbooks include Software Engineering a Practitioners
    Approach (Pressman) and Software Engineering (Sommerville). These books all describe
    the process of software engineering, and provide an overview of software testing
    and how it fits into the process.


    # 14.3.2 Standards on Software Testing


    The most prominent international standard is IEEE/ISO/IEC 29119. This provides
    a detailed look at software testing from five viewpoints.


    +   - Part 1 defines concepts and definitions.

    - Part 2 describes test processes.

    - Part 3 discusses test documentation.'
