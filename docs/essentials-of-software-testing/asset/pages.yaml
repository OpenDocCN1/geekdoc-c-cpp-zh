  md: '+   - Random data selection can be used with any of the black-box and white-box
    test techniques by selecting test criteria rather than test data values, and then
    selecting test data values at runtime that match the criteria. In this case the
    test oracle is manual.


    +   - Fully random data selection can be used with a simple test oracle (the software
    does not crash) for stability testing.


    +   - There are a number of approaches for determining test completion: simple
    and pragmatic approaches consist of specifying a fixed number of loops, or a fixed
    amount of time for test execution. More advanced techniques include measuring
    code at runtime.


    # Notes for the Experienced Tester


    Generating random tests is probably one of the most effective ways for the experienced
    tester to create large numbers of tests quickly. The stability of an application
    can be tested by generating random input actions and checking that the application
    does not crash. The tests created using equivalence partitions, BVA, decision
    tables, statement coverage, and branch coverage for unit testing, OO testing,
    or application testing can be used to expand the breadth of data values used.
    By using input data which is statistically representative of real-world data,
    collected from execution of the application by real customers, an estimate of
    the mean time between failures (MTBF) can be derived. Safety tests can often be
    developed by adding *invariants* to represent the safety criteria for an application
    or a class, writing code to check for these (periodically or after every method
    call), and simulating random inputs. Instead of checking that the output of each
    method is correct, this form of testing verifies that the effect of the method
    is correct with respect to the safety criteria.'
