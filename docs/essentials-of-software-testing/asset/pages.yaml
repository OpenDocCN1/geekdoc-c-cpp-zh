  md: '# 12.3 Unit Test Example


    # 12.3.2 Test Cases


    When developing the test cases, instead of selecting actual data to represent
    each equivalence partition, criteria that define equivalence partition are used
    instead. These allow specific data values to be selected at random at runtime,
    based on the criteria. In simple partitions, the criteria will state the minimum
    and maximum values in the partition. In this example, these criteria are based
    on the partition boundaries for each TCI, as shown in Table 12.2.


    Table 12.2 Equivalence partition.


    | Parameter | Equivalence partition | Criteria |

    |---|---|---|

    | bonusPoints | Long.MIN_VALUE..0 | (Long.MIN_VALUE<bonusPoints) && (bonusPoints<=0)
    |

    | | ..80 | (1<=bonusPoints) && (bonusPoints<=80) |

    | | ..120 | (81<=bonusPoints) && (bonusPoints<=120) |

    | | 121..Long.MAX_VALUE | (121<=bonusPoints) && (bonusPoints<=Long.MAX_VALUE)
    |

    | goldCustomer | true | goldCustomer |

    | | false | !goldCustomer |

    | Return Value | FULLPRICE | Return Value=FULLPRICE |

    | | DISCOUNT | Return Value=DISCOUNT |

    | | ERROR | Return Value=ERROR |


    Using these criteria, random test data can be specified for each test case, as
    shown in Table 12.3. This is essentially the same as Table 12.9 in Chapter 2 as
    developed for equivalence partition testing, but for each test actual data values
    are replaced by the criteria for generating random values.


    Table 12.3 Random equivalence partition test cases for giveDiscount().


    | ID | Inputs | bonusPoints | Exp. results |

    |---|---|---|---|

    | | | goldCustomer return value |

    | T12.1 | EP2,5 | rand(1,80) | true | FULLPRICE |

    | T12.2 | EP3[6,7] | rand(81,120) | false | FULLPRICE |

    | T12.3 | EP4[6,8] | rand(121,Long.MAX_VALUE) | false | DISCOUNT |

    | T12.4* | EP1*,9 | rand(Long.MIN_VALUE,0) | false | ERROR |


    Some important features are:


    +   The shorthand (l, h) is used to represent a random number between the low-bound
    (l), and high-bound (h) – inclusive of both values.


    +   By specific error test case(s), the problem of almost all inputs being in
    error is avoided.'
