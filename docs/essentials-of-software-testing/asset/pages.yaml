    | ID | Line number | Condition |

    |---|---|---|n| | 38 | bonusPoints == 43 |


    # 5.3.2 Test Coverage Items


    Each executed line of source code (or statement) is a test coverage item (TCI),
    as shown in Table 5.2. Lines that cannot be executed are ignored (for example,
    comments and blank lines). This shows that only one extra TCI is to provide full
    source code coverage (when executed along the full set of black-box tests). There
    is little value in identifying all the previously executed statements and which
    tests them, especially for large numbers of statements.


    The TCIs and test cases are all marked as being extra to indicate that on their
    they do not provide full statement coverage. The complementary required to provide
