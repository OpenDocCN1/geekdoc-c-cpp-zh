    To show the broad applicability of random testing, a random application test example
    is shown here, based on the Fuel Checker system described in Chapter 10. As a
    reminder, the specification for Fuel Checker is reproduced here:


    +   A fuel dept wants a well-based system to enable the dispatcher to determine
    whether a load of fuel will fit in a tank or not. Some fuels can fill the tank;
    others require extra space for safety reasons. The tank capacity is 1200 litres
    without the extra safety space, and 800 litres with it.


    # 12.4.1 Analysis


    The data criteria for randomising the input are derived from the acceptance criteria
    shown in Section 10.2:


    +   S1A requires a value for litres that fits in a tank without extra safety.
    The range of values is from 1 to 1200.

    S1A requires a value for litres that fits in a tank with extra safety. The range
    of values is from 1 to 800.

    S1A requires a value for litres that does not fit in a tank without extra safety.
    The range of values is from 1201 to some unspecified maximum value.

    S1A requires a value for litres that does not fit in a tank with extra safety.
    The range of values is from 801 to some unspecified maximum value.


    As for the random unit testing, instead of selecting individual values to represent
    each equivalence partition (shown in Table 10.3), criteria are used for selecting
    random values at runtime, as shown in Table 12.4.


    The random values generated will have course to be converted to strings to be
    used as inputs to the application.'
