  md: '# 13.5 Incremental and Agile Development


    Agile development encourages a high degree of collaboration between the software
    engineers. There are a number of guidelines to provide control over an Agile project:


    +   - Testers should participate in the requirement ''negotiation'' process that
    usually occurs between developers and customers. This includes asking questions,
    identifying requirements are unstable, and other issues.

    - Testers should immediately translate requirements into test cases serving as
    documentation for the upcoming iteration. Testers and developers should collaborate
    in automating those test cases.

    - Testers should be informed immediately when requirements change so that they
    can modify their test cases.


    # 13.5.1 Incremental Development


    The incremental model begins with a simple implementation of a part of the software
    system. Each increment enhances the product until the final version is reached.
    A test-centric illustration of the process is shown in Figure 13.4.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_302_0.png)


    Figure 13.4 A tester''s view of incremental development.


    In this diagram, each increment is considered from the viewpoint of three phases:
    pre-testing, testing, and post-testing. In each increment, the testing consists
    of regression testing (to ensure the new increment has not any previously working
    software), and the testing of the new features. The progressive release of tested
    software means interim versions of the software become much earlier in the development
    process. The quality of the final product is expected to be higher due to increased
    testing and the opportunity for a customer to view early releases of the product.


    A major advantage of the incremental model is that the product is written and
    tested in smaller pieces. This reduces risks associated with the product and also
    allows for changes to be included easily along the way. Additionally, by adopting
    an incremental model the customer or the users of the product have to be involved
    in the development from the beginning. This means the system is more likely to
    meet their needs and'
  merge: -1
