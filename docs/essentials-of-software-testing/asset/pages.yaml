    # 10.4.3 System Testing and Integration Testing


    System testing and integration testing often take place over the same interface
    (the system interface). But it is important to note that the purpose of each is
    different. System tests verify that the system as a whole is working correctly.
    Integration tests verify that some components (or subsystems) of a system are
    working correctly together.


    # Integration Testing


    Integration testing takes a number of forms, depending on producing layers of
    software, integration takes places between these integration tests. Depending
    on the process, this may take the form of top-down integration testing, bottom-up
    integration testing, or feature testing, which are explained below. In a modern
    Agile process, adding new user features typically involves changes to all the
    layers. Integration testing in this type of process involves making sure that
    the old and new features integrate correctly – this is sometimes referred to as
    testing end-to-end functionality.


    Integration testing may also take place in a way similar to unit testing, where
    the purpose of the testing is to verify that two software components (usually
    represented by classes) work correctly together.


    # Drivers, Stubs, and Mocks


    When doing integration testing, the software is often incomplete. This may require
    the tester to write temporary code to take the place of not-yet-written software.
    It is a goal to minimise the volume of this temporary software – but it may be
    necessary'
