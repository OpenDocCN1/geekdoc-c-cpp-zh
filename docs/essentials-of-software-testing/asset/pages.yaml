    # 11.11 Interfacing to Desktop Applications


    Java GUI desktop applications are usually developed using Java AWT, Swing, JavaFX,
    or other libraries. As for web applications, the key issues are: (a) how to find
    the GUI elements to interact with, and (b) how to interact with them.

    A typical desktop application test will:


    +   * call the main() method in the application to start running;

    * call Window.getWindows() to find the application or call java.swing.FocusManager.getCurrentManager().

    getActiveWindow() to find the active window after the application;

    * place all that interact with the GUI on the GUI event thread (Swing.InvokeAndWait
    for a Swing application);

    * call JFrame.getTitle() to get the title of a window;

    * call Container.getComponents() recursively to find a component (window, textbox,
    etc.) used by Component.getName to find name (instead of using the id as HTML);

    * interact with the components: e.g.JButton.doClick(), JTextBox.setText(), JTextBox.setText().


    The difference when compared to web applications is that the application has full
    control of the application screen, in the URL or browser page the user can return
    to a stale window by typing in the URL or using the browser back button. The tester
    should reference the API for the GUI library in full details.^{15}


    There are a number of frameworks for Java GUI application testing: these are built
    on top of the underlying AWT/Swing/JavaFX libraries. There are also many OS-dependent
    and language-independent frameworks for GUI application testing frameworks. Both
    proprietary and open-source tools are available. A review of these tools is beyond
    the scope of this book.


    # 11.12 Interfacing to Mobile Applications


    Developing tests for mobile applications is similar to developing tests for web
    applications.


    > 15 The AWT, Swing, and JavaFX APIs are published by Oracle at https://docs.oracle.com.'
