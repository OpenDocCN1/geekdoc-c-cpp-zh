    # 9.4.2 Testing Object-Oriented Software


    Object-oriented testing is a large and complex area⁹ – see Section 14.3 for suggested
    additional readings in the topic.


    This chapter covers the essential test technique that underlies all OO testing:
    testing in class context. This is used to test code in a class where the data
    is protected from outside access and methods interact with each other through
    attributes.


    # 9.4.3 Fault Models


    The features of object orientation are intended to improve code quality and support
    code reuse. But the concepts are complex and introduce their own fault models
    in addition to those associated with software more generally:


    **Classes**: objects retain the values of their attributes (referred to formally
    as their state) through method calls. In many cases, the order in which these
    methods are called is important for correct operation. The code that ensures this
    ordering is distributed over many methods. This provides many opportunities for
    what are referred to as state control faults, where an object does not behave
    correctly in a particular state (see Section 8.2.7).


    > ⁸ It is unusual to use public attributes in Java.


    > ⁹ Binder, Testing Object Oriented Systems is probably the most thorough reference
    book.'
