  md: '# Test Automation


    Note that all the tests within a file must have unique identifiers (in this book
    they are numbered using a simple hierarchy). Each test can then be uniquely identified
    using the test item and the test identifier: for example giveDiscount () test
    T1.3. This allows a specific test to be rerun in order to replicate the fault
    as part of the debugging process, and also for it to be re-executed to verify
    that a fault has been correctly fixed.


    It is useful to maintain an edit history of the test file (this could be automated
    under a version control system, such as Git). There is no need to limit it to
    one particular type of test: a test file might include tests derived using multiple
    techniques (e.g. equivalence partition, boundary value analysis (BVA), decision
    tables). Or, alternatively, each be put into its own file. Often, black-box and
    white-box tests are separated into different files, as the black-box tests remain
    even if the implementation changes, but the white-box tests do not. Test runners,
    such as TestNG, generally provide a number of ways to select different test methods
    for execution from different classes.


    # 11.1.3 Software Test Automation and Version Control


    It is critical that reports include an identifier that uniquely states the software
    being tested (its name, version, variant, etc.). This means that the report can
    be interpreted in the correct context, and any debugging and fixes applied to
    the correct version (or variant) of the software. It also enables the verification
    that the fixes have been made to that specific version (or variant).


    For a class, the identifier is generally the version number from the version control
    system. For complex systems, this is generally the build number from the build
    procedure (or it may be the release tag, or the date for revision control systems
    similar to Git).


    # 11.2 Test Frameworks: TestNG


    In this book, TestNG is used as a representative unit test automation framework.
    Other frameworks have similar features – this book does not provide a full description
    of TestNG, but rather uses TestNG to introduce and explain typical features required
    for automated testing. Only a limited subset of the TestNG features are described
    in this book. Refer to the TestNG documentation online for full details.


    TestNG consists of a set of Java classes that automate the execution of software
    tests, collect and evaluate the test results, and generate test reports. TestNG
    tests are executing using a test runner.


    > 3 https://testng.org.'
