  md: '# Wrap Up


    # 14.3.10 Going Off-Piste


    This book presents a systematic introduction to software testing – we believe
    that it is important to understand the essential elements of testing before going
    off-piste. In practice, a software tester may need to exhibit significant innovation
    to effectively test software systems. We present here a short selection of books
    that may stimulate ideas that can be used to augment the more structured approaches
    presented in the book, and provide an insight into the broader role of the software
    tester.


    +   - Black-Box Testing (Bezier) and The Complete Guide to Software Testing (Hetzel)
    are other classic books on software testing. Their approach is somewhat less structured
    than the other classic books, and we recommend them as useful for considering
    software testing from a more holistic viewpoint.

    - Testing Computer Software (Kaner et al.) addresses issues which are supplementary
    to those covered in this book. It is divided into three sections: fundamentals,
    specific skills testing, and managing testing projects and groups. We recommend
    it for its breadth of coverage.

    - The Software Engineering''s Handbook (Bath and McKay) is a study guide for the
    ISTQB Test Analyst and Test Analyst Advanced Level Certification. We recommend
    both in preparation for this certification, and for the previous book, for its
    breadth of coverage.

    - How Google Software (Whittaker et al.) gives an excellent idea of the roles
    of the software tester in an industrial setting. We recommend it for the insights
    it gives to the reader.


    # 14.4 Research Directions


    As in many areas of software engineering, research into software testing is a
    wide and varied field. This section gives some indications to the reader on where
    to go for more information.


    # 14.4.1 Conferences


    The following list of conferences, while not complete, gives a starting point
    to the reader for exploring the topic further, and gaining knowledge of the state-of-the-art:


    +   - AITEST International Conference on Artificial Intelligence Testing

    - CAST Conference of the Association for Software Testing

    - EUROSTAR European Software Testing Annual Conference

    - ICSTPP International Conference on Software Testing, Types and Process

    - ICSE International Conference on Software Engineering

    - ICSQ International Conference on Software Quality

    - ICST International Conference on Software Testing, Verification and Validation

    - ISSTA International Symposium on Software Testing and Analysis'
