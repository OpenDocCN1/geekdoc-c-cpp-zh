  md: '# Black-Box and White-Box Testing


    Dynamic testing confirms the correct operation of a program, which is referred
    to as the *test item*, by executing it. As shown in Figure 8.1, the test process
    can be modelled as the comparison of the outputs of a real system with those of
    an ideal system. The ideal system represents the specification. The real system
    represents the software being tested.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_160_0.png)


    **Figure 8.1** Software testing procedure.


    Test conditions are developed, according to the test design technique selected,
    which guides the selection of suitable test input data. The test input data is
    then used as an input to the ideal system in order to determine the correct output
    (referred to as expected results). The test input data is provided as inputs to
    the real system. The real system executes, and the actual results are collected
    and compared with the expected results. If they are identical, or equivalent,
    then the test result is a pass. Otherwise the test result is a fail. As we have
    seen in the previous chapters, the test is usually executed by an automated tool.


    The test data is derived from the set of test conditions, each of which has been
    chosen to validate particular features or aspects of the system. The result of
    the test is to be a pass or fail. However, for a test to be useful it does not
    have to produce a pass result. Even a failed test gives us new knowledge about
    the system: it tells us for which inputs the software is not working as specified.'
