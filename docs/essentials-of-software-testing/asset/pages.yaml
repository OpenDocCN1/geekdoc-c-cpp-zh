    # 7.52 Strengths and Weaknesses


    All paths testing matches the flow of control through a program, but can be difficult
    to realise for complex programs, in particular as each path has to be carefully
    analysed to determine if it is executable, and if so to develop the criteria that
    causes its execution.


    # Strengths


    +   - All paths testing covers all possible paths, which may have not been exercised
    using other methods.

    - All paths testing is guaranteed to achieve statement coverage and branch coverage.


    # Weaknesses


    +   - Developing the CFG and identifying all the paths in complex code can be
    difficult and time-consuming.

    - When code contains loops, decisions must be made as to how to limit their execution.
    This is necessary to limit the number of paths to a reasonable number, but as
    a result weakens the testing.

    - All paths not explicitly evaluate the Boolean conditions in each decision (the
    individual Boolean sub-expressions that make up a compound Boolean expression).

    - It does not explore faults related to incorrect data processing (e.g. bitwise
    manipulation or arithmetic errors).

    - It does not explore non-code faults (for example, faults in a lookup table).


    # 7.6 Key Points


    +   - All paths testing is used to augment black-box and white-box testing, ensuring
    every end-to-end path is executed. It is the strongest form of testing based on
    a program''s structure.⁷


    > 7 There are other forms of path testing than end-to-end paths, which are weaker,
    but may be easier to design tests for. However, all paths testing is the strongest
    form of path testing: it is a superset of all the other forms of path testing.'
