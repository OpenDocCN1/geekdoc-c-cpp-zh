    Test data is selected from arbitrary values within the equivalence partitions:
    for short ranges, a central value is selected. For longer ranges, a convenient
    value is selected, but not the start or end. It is important that boundary values
    are not selected: picking a value from the centre is more likely to expose faults
    due to incorrect processing of the entire partition, which is the goal of equivalence
    partition testing.³ This makes debugging of any faults easier, as the causes of
    failures are easier to identify if they are a good match for the fault model or
    the test technique.

