  md: "# 11.2 Test Frameworks: TestNG\n\n# 11.2.1 A Detailed Look at a TestNG Example\n\
    \nThe source code for a sample TestNG test class is shown in Listing 11.1.\n\n\
    +   - The test class imports the required support from the TestNG libraries (the\
    \ import statements referring to org.testng in the code), and uses the @Test annotation\
    \ before each test method.\n- Each test method must have one or more assertions\
    \ - if an assertion fails, the test fails and halts execution immediately. Otherwise,\
    \ the test passes.\n- The class Demo has the methods setValue(int), add(int),\
    \ and getValue(). The methods getValue() and setValue() are getters and setters\
    \ for the attribute value; add() adds the passed parameter to the attribute value.\n\
    \nListing 11.1 Example Test source code/DemoTest.java.\n\n```\n1 package example;\n\
    2 import static org.testng.Assert.*;\n3 import org.testng.annotations.*;\n4 \n\
    5 public class DemoTest {\n6 \n7 @Test\n8 public void test1() {\n9 Demo d = new\
    \ DemoTest();\n10 d.setValue(56);\n11 d.add(44);\n12 assertEquals( d.getValue(),\
    \ 100 );\n13 }\n14 \n15 \n```\n\nThe key features of a TestNG test method, as\
    \ shown in test1() in the example, are as follows:\n\n+   - An object to be created.\
    \ In our example, an instance of the class Demo- line 10.\n- The object is initialized,\
    \ or put into the right state for testing. In our example by initialising the\
    \ test with the value 56 – line 11.\n- The method under test is now called. In\
    \ our example, we call the method add() with the input data value 44 – line 12.\n\
    - The output data is now collected. In our example by calling getValue() line\
    \ 13.\n- Finally, the actual result (output value) is compared with the expected\
    \ result by using the TestNG assertEquals() method. In our example the expected\
    \ result is the value 100 – line 13."
