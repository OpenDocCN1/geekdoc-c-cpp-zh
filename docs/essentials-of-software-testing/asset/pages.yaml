    # 10.4.6 Test Coverage Items


    In basic user story testing, each acceptance criterion is a TCI (as we discussed
    earlier in the chapter). User applications and their interfaces can be specified
    using a number of other standard techniques, such as UML cases³ and IEEE scenarios.¹⁴
    In UML case testing, each scenario is a TCI; IEEE scenario testing, and alternative
    scenarios are all TCIs.


    User story testing is easily extended by considering not only the acceptance criteria
    but also the equivalence partitions, boundary values, or combinations of the input
    values as TCIs. Typically this leads to a few additional normal test cases, and
    a large number of additional error test cases (as we have seen above, for example,
    there are many ways of misrepresenting an input integer). A wide range of error
    test cases is often added to user story testing on an ad-hoc basis - a systematic
    approach is likely to provide more rigorous testing.


    If unit testing has not been performed, application testing using partition/BVA/decision
    tables may be used as a substitute. This is not as rigorous as testing individual
    modules or classes via their programming interface. If this form of testing is
    used, the equivalence partition/BVA/decision tables technique identify the TCIs
    (rather than the user stories/acceptance criteria).


    Important note: in addition to the user stories agreed with the customer, the
    tester will possibly identify a large number of extra TCIs using the equivalence
    partition, BVA, decision tables, and object-oriented (OO) techniques, and experience-testing,
    as previously discussed.


    Suggested further readings are presented in Section 14.3.


    # 10.4.7 Test Cases


    Each TCI is a test case. Additional test cases may be added to provide a broader
    range of input values, especially for errors (as seen in the discussion on data
    representation).


