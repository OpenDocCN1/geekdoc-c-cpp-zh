  md: '# 4.7 Notes for Experienced Testers


    # 4.5.2 Strengths and Weaknesses


    Strengths


    +   * Decision tables exercise combinations of input data values.

    * The expected results are created as part of the analysis process.


    Weaknesses


    +   * The decision tables can sometimes be very large. Different approaches exist
    to reduce the tables.

    * A more detailed specification may lead to increased causes and effects, and
    consequently large and complex tables.


    Decision table testing is complementary to equivalence partition and BVA testing.
    There is little published evidence as to the effectiveness of decision table testing,
    but experience in programming indicates that this is likely to cover different
    errors of input equivalence partitions and boundary values.


    # 4.6 Key Points


    +   * Decision table testing ensures the software works correctly with combinations
    of input values.

    * Test coverage items and test cases are based on rules in the decision table.

    * The data for the test cases is selected from the equivalence partition test
    values.


    # 4.7 Notes for Experienced Testers


    Experienced testers may produce the causes and effects in their mind and create
    decision tables directly with support from the specification. They may also implement
    tests directly from the decision table. However, in cases where high quality is
    required (embedded systems, life-critical systems, etc.), even an experienced
    tester may need to document these steps for quality review, or in the case of
    a legal challenge to the quality of the software.'
