  md: '# Introduction to Software Testing


    # 1.11.2 Test Coverage Items


    Test coverage items are particular items to be *covered* by a test. They are generated
    by reviewing the results of the analysis using the test design technique that
    has been selected.¹¹⁹


    Some examples of test coverage items are:


    +   - a particular value, or range of values, for a parameter to take;

    - a particular relationship between two parameters to be achieved;

    - a particular line of code to be executed; and

    - a particular path in the code to be taken.


    A test case may cover multiple test coverage items. A goal of most test techniques
    is to reduce the number of test cases by covering as many coverage items as possible
    in each. This is for the simple reason of reducing the time it takes to execute
    the tests. For a small number of tests this is not important, but large software
    systems may have tens of thousands of tests, and the execution time may run into
    multiple days.


    Any values used in defining a test coverage item should be as generic as possible,
    representing constants by name, and stating relationships rather than actual values
    where possible. This allows maximum flexibility in designing the test cases, allowing
    a single test to cover as many coverage items as possible.


    Each test coverage item requires an identifier


    In simple testing, all the inputs are passed as arguments to the code, and the
    output is returned as a value. In practice, it is not unusual for there to be
    both explicit arguments (passed in the call to the code) and implicit inputs (for
    example, in Java, class attributes read by the code; or in C global variables).
    Many have an *explicit* return value and other *implicit* outputs (such as, in
    Java, class attributes modified by the code). These should all be included in
    the test coverage items.


    # Error Handling


    Test cases are generally divided into two categories: *normal* and *error* cases.
    It is important to separate these as multiple input normal cases may be incorporated
    into the same test case; multiple input error cases may not be. This is because
    of *error handling*. Most software does not clearly differentiate between all
    the possible error causes; therefore, in order to test that each input error is
    identified and handled correctly, only one such error be tested at a time. In
    this book, an asterisk (*) is used to signify input error coverage items and error
    test cases.


    > Not every test clearly clarifies what is being tested for (the test coverage
    items*), what values are needed to perform the test (the *test data*), and the
    tests themselves (*test cases*). However, the distinction is important, and this
    book clearly'
