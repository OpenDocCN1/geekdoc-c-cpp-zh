  md: '# Equivalence Partitions


    # Equivalence Partitions in More Detail


    # Fault Model


    The equivalence partition fault model is where entire ranges of values are not
    processed. These faults can be associated with incorrect decisions in the code,
    or missing sections of functionality.

    nBy testing with at least one value from every equivalence partition, where every
    value should be processed in the same way, equivalence partition testing attempts
    to find these faults.


    # Description


    Equivalence partitions are based on selecting representative values of each parameter
    from the equivalence partitions. Each equivalence partition for each of the parameters
    is a TCI. Both the inputs and the output should be considered. The technique invariably
    generating as few test cases as possible; each new test case should select data
    as many uncovered partitions as possible. Test coverage for errors should be treated
    separately to avoid error hiding. The goal is to achieve 100% coverage of the
    equivalence partitions.


    # Analysis: Identifying Equivalence Partitions


    # Parameters


    Methods (functions) have explicit and implicit parameters. Explicit parameters
    are passed in the method call. Implicit parameters are not: for example, in a
    C program they may be global variables; in a Java program they may be attributes.
    Both types of parameter must be considered in testing. A complete specification
    should include all inputs and outputs.


    # Value Ranges


    All inputs and outputs have both natural ranges of values and specification-based
    ranges of values. The natural range is based on the type. The specification-based
    ranges, or partitions, are based on the specified processing. It often helps in
    analysing ranges to use a diagram – see Figure 2.14. This figure shows a Java
    int, which is a 32-bit value, having a minimum value of -2³ and a maximum value
    of 2³–1 (Integer.MIN_VALUE and Integer.MAX_VALUE), giving the natural range:


    +   * int [Integer.MIN_VALUE .. Integer.MAX_VALUE]


    | Integer.MIN_VALUE | Integer.MAX_VALUE |


    ![](img/6a3e28417c651af2c9c33c1aa588b582_59_0.png)'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# 2.4 Equivalence Partitions in More Detail


    Natural ranges for a number of other common types are:


    +   - byte [Byte.MIN_VALUE..Byte.MAX_VALUE]

    - short [Short.MIN_VALUE..Short.MAX_VALUE]

    - long [Long.MIN_VALUE..Long.MAX_VALUE]

    - char [Character.MIN_VALUE..Character.MAX_VALUE]


    Natural ranges for types with no ordering are treated slightly differently – each
    value is a separate range containing one value:


    +   - boolean [true][false]

    - enum Colour {Red, Blue, Green} [Red][Blue][Green]


    Compound types, such as arrays and classes are more complicated to analyse, though
    the principles are the same.


    # Equivalence Partitions


    An equivalence partition is a range of values for a parameter for which the specification
    states equivalent processing.

    Consider a method, boolean isNegative(int x), which accepts a single Java int
    as its input parameter. The method returns true if x is negative, otherwise false.
    From this specification, two equivalence partitions for the parameter x can be
    identified:


    +   - Integer.MIN_VALUE..-1

    - 0..Integer.MAX_VALUE


    These specified-ranges are called equivalence partitions. According to the specification,
    any value in the partition is processed equivalently to any other value. See Figure
    2.15.


    | Integer.MIN_VALUE | -1 | Integer.MAX_VALUE |


    Figure 2.15 Equivalence partitions.


    Both input and output parameters have natural ranges and equivalence partitions.
    A Java boolean is an enumerated type with the values true and false. Each enumerated
    value is a separate range. In this example, the two different values are produced
    by different processing, and so the return value has two equivalence partitions:


    +   - true

    - false


    # Selecting Equivalence Partitions


    Some guidelines for identifying equivalence partitions are as follows:


    +   - Every value for every parameter must be in one equivalence partition.'
