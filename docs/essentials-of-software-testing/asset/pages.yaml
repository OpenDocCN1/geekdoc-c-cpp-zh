  md: "Where different methods require different code, inline test data may be used\
    \ without incurring the disadvantages of code duplication. This is shown in Listing\
    \ 11.4, where the test method test2() is slightly different from test3(). This\
    \ is often the case for system tests, where different tests require unique sequences\
    \ of actions. Most test frameworks have facilities for parameterised tests. This\
    \ is invariably used for unit tests, where the same method needs to be repeatedly\
    \ called with different test data. In TestNG the dataProvider parameter is used\
    \ for this, as shown in Listing 11.5.\n\n# Listing 11.5 Parameterised tests.\n\
    \n```\npublic class DemoTestParam {\n    private static Object[][] testData =\
    \ new Object[][][] {\\n        \"test1\", 56, 44, 100,\n        \"test2\", 0,\
    \ 0, 0,\n        \"test3\", -1000, -1234, -2234\n    };\n    @DataProvider(name\
    \ = \"testset1\")\n    public Object[][] getDataData() {\n        return testData;\n\
    \    }\n    @Test(name = \"testset1\")\n    public void test(String id, int x,\
    \ int y, int er) {\n        Demo d = new Demo();\n        d.setValue(x);\n   \
    \     d.add(y);\n        assertEquals(d.getValue(), er);\n    }\n```\n\nWith a\
    \ data provider, the method test() is called sequentially with each row of test\
