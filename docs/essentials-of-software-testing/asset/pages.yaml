  md: "# 3.4 Boundary Value Analysis in More Detail\n\nSome rules for picking boundary\
    \ values:\n\n+   - Every parameter has a boundary value at the top and bottom\
    \ of every partition.\n- For a contiguous data type, the successor to the value\
    \ at the top of one partition must be the value at the bottom of the next. In\
    \ the example above, the value -1 from the first partition is directly followed\
    \ by the lower value 0 from the next partition.\n The natural range of the parameter\
    \ provides the ultimate maximum and minimum values.\n\nBoundary values do not\
    \ overlap, and there must be no gap between partitions. A convenient shorthand\
    \ for specifying partitions and boundary values is for each follows:\n\n```\n\
    x: [Integer.MIN_VALUE..-1] [0..Integer.MAX_VALUE]\nreturn value: [true][false]\n\
    ```\n\n# 3.4.4 Test Coverage Items\n\nEach boundary value for each partition for\
    \ each input and output is a TCI. It is good practice to give each TCI for each\
    \ test item a unique identifier. It is often useful to use the prefix 'BV' (for\
    \ boundary value) for the TCIs. In equivalence testing, the tester has decide\
    \ on representative values from each partition: in BVA testing, the tester uses\
    \ the already identified upper and lower values for each partition.\n\n# 3.4.5\
    \ Test Cases\n\nInput test data is selected based TCIs that are not yet covered.\
    \ Ideally, each normal test case will include as many additional TCIs as possible.\
    \ Each error test case must only include one error TCI.\nExpected return values\
    \ are derived from the specification. However, the tester must ensure that all\
    \ TCIs related to the output parameters are covered. It may be necessary to read\
    \ the specification backwards to determine input values that will result in a\
    \ return value having the required boundary value.\nHint: it is usually easier\
    \ to identify test cases by going through the TCIs in order, and selecting the\
    \ next uncovered boundary value for each parameter.\n\n# 3.4.6 Pitfalls\n\nAs\
    \ equivalence partitioning testing, BVA should use a minimum of tests. Do not\
    \ provide test cases for every combination of input boundary values, and do not\
    \ provide a separate test case for each TCI."
