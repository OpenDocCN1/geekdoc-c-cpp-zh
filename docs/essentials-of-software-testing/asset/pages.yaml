    are shown here.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_173_0.png)


    Figure 8.8 State diagram for lamp.


    State-based testing raises the events that cause the software to transition between
    different states by calling the methods on the state diagram. The tests can check
    that the correct state transitions have taken place, and the correct actions have
    occurred.


    Well-established test design strategies for selecting test coverage criteria for
    state-based testing are:


    +   - piecewise (test some transitions);

    - all transitions (test every transition at least once);

    - all round-trip paths (test all paths starting and ending at the same state);

    - M-length signatures (often it is impossible to directly access the state in
    order to verify that a transition has taken place correctly. In these cases of
    events produce a unique set of outputs are used to verify that the software is
    in the expected state. These are called signatures. The outputs will return values
    either from the methods which cause state transitions, or from other methods,
    not on the state diagram, which do not. This strategy tests all signatures of
    to M transitions, for some value of M. The disadvantage of using signatures is
    that they change the state of the software is, and the test must take this into
    account;

    - all n-event transition sequences (test all sequences of transitions for a particular
    value of n);

    - exhaustive testing (test all possible sequences of transitions).


    ⁵ A state table may also be, providing the same information in tabular form.

    ⁶ Exactly how this happens is not part of the state diagram. In this case, a hardware
    sensor would detect the lamp has been touched, and software would then call the
