  md: '# 9.4 A More Detailed Look at Testing Object-Oriented Software


    # 9.4.8 Test Implementation


    There are two categories of OO test methods: those that can run in any order,
    and those that require other methods to be run first. In the example shown, the
    test methods create a new instance of the class for each test, and thus can run
    in any order (see Chapter 11 for how priority or test dependencies can be used
    to enforce a particular ordering). If one test relies on one another to be run
    first, they must either be included in the same test in the required order, or
    test dependencies must be used.


    Once the test cases have been defined, implementation is usually very straight-forward.


    # 9.4.9 Overview of Advanced OO Testing


    There are a large number of OO testing techniques, and the following sections
    summarise a number of these. Additional reading on these techniques is recommended
    for the OO tester, and further readings are presented in Section 14.3.


    The form of testing demonstrated in the example at the start of this chapter can
    be conventional testing in class context. Matching the fault models, there are
    two forms of OO testing that are summarised in this section: inheritance testing
    and state-based testing. Inheritance testing is primarily a test automation—running
    tests designed for one class against a different class (subclass). Issue is addressed
    in Chapter 11. State-based testing verifies the behaviour of sequences of inputs,
    specifically using the UML state diagram.


    # 9.4.10 Inheritance Testing


    This form of testing specifically addresses the inheritance fault model. The purpose
    of inheritance testing is to verify that the classes within an inheritance hierarchy
    behave correctly. A simple form of inheritance testing verifies that inherited
    superclass methods continue to work correctly in the context of the subclass.
    This can be extended to ensure that all the methods in an inheritance tree continue
    to operate correctly.


    # The Liskov Substitution Principle


    However, not all subclasses are designed to fully support their superclass behaviour.
    Such subclasses are referred to as not being Liskov substitutable.¹¹³ For inheritance
    testing:


    +   If a subclass is fully substitutable, then whatever functionality its superclass
    has, it also supports. It may of course have additional features. To verify inheritance,
    the superclass tests are executed against each subclass. This verifies that the
    subclasses work in superclass context.


    > 13 See B.H. Liskov and J.M. Wing. A behavioral notion of subtyping. ACM Transactions
    on Programming Languages and Systems, Vol. 16, No. 6, 1994.'
