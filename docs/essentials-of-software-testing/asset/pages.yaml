  md: '# Equivalence Partitions


    +   - There are no values between partitions.

    - The normal range of the parameter provides the upper and lower limits for partitions
    where not specified otherwise.


    Equivalence partitions are used in testing as, according to the specification,
    any value value can be selected to represent any other value. So, instead of having
    a separate test for every value in the partition, a single test can be executed
    using a single value from the partition. It is equivalent to any other value,
    and can be picked from anywhere in the partition. Traditionally a value in the
    middle of the partition is picked. Equivalence partitions are useful for testing
    the fundamental operation of the software; if the software fails using equivalence
    partition values, then it is not worth testing with more sophisticated techniques
    until the faults have been fixed.


    # 2.4.4 Test Coverage Items


    Each partition for each input and output is a TCI. It is good practice to give
    each TCI for each test item a unique identifier. It is often useful to use the
    prefix ''EP'' for equivalence partition TCIs. Note that the values selected from
    the partition are part of test cases, as we have shown in the test case table
    – for example, see Table 2.9.


    # 2.4.5 Test Cases


    Input test cases are selected based on TCIs that are not yet covered. Ideally,
    each normal test cases will include as many additional normal TCIs as possible.
    Each test case that represents an error must include only one error T.


    Values of expected are derived from the specification. However, the tester must
    ensure that all the TCIs related to the output parameters are covered. It is necessary
    to read the specification backwards to determine input values that will result
    in an input value being in the required equivalence partition.


    Hint: it is usually easier to identify test cases by going through the TCIs in
    order, selecting the next uncovered TCI for each parameter, and then selecting
    an equivalence partition value for the test data. There is no reason to use different
    values from the same partition – in fact it is easier to review the test case
    for correctness if one particular value is chosen from each partition and then
    used throughout.


    # 2.4.6 Pitfalls


    The technique calls for a minimal number of test cases. Do not provide tests for
    every combination of inputs. Do not provide a separate test case for each TCI.


    After completing the test, check whether there are any unnecessary test cases.
    Also, check whether a reorganisation can reduce the number of test cases. Table
