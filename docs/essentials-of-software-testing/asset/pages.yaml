    | | 1 | 2 | 3 |

    |---|---|---|---|n| Causes | | | |

    | x < low | T | F | F |

    | x ≤ high | T | T | F |

    | Effects | | | |

    | return value | F | F | F |


    Recall that we have already used this technique to remove error rules. If there
    are interesting combinations of causes that produce errors, these can be presented
    in a separate table (with error rules only).


    > ⁷ The other standard technique of using don''t-care conditions is not covered
    in this book. It is considered advanced technique and is difficult to implement
