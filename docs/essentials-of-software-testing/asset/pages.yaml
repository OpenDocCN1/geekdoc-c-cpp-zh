  md: '# #9 Testing Object-Oriented Software


    The black-box and white-box unit test techniques described in Chapters 2–7 have
    been applied to a single static method. This allows key concepts of the test design
    techniques to be introduced without the additional complexities introduced by
    classes and objects. The same techniques can be applied to testing the instance
    methods¹ of a class — this is unit testing where the unit is a class.


    # ## 9.1 Testing in Class Context


    In general, methods interact with each other and cannot be tested independently:
    they need to be tested in the context of their class hierarchy. Methods interact
    with other methods via class attributes. Testing in class context refers to testing
    methods not individually, but in the wider context of their class.


    Typically, setter methods must be called to initialise any attributes used by
    the method being tested. The method itself is called, passing required inputs
    as parameters. The method return value must be verified, and then changes the
    method has to the attributes must be verified by calling getter methods. Thus
