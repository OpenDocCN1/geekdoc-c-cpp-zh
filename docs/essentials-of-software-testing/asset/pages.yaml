  md: '# Testing in the Software Process


    The activity of testing can be approached in two ways. The first is to wait until
    all the code has been written and then to test the finished product all at once.
    This is referred to as ‘Big Bang’ development. On the surface, it is an attractive
    option to developers because ‘Testing activities do not hold back the progress
    towards completing the product. However, it is a risky strategy as the likelihood
    that the product will work, or even close to working, can be very low, and is
    particularly dependent on program complexity and program size. Additionally, if
    tests reveal faults in the program, it is much more difficult to identify their
    source.


    A more modern approach is to test the software while it is being developed. This
    is referred to as ‘incremental’ development. Individual modules, or software features,
    are tested as they are written. This process continues as additional software
    increments are produced until the product is completed. While this may delay the
    release of the final product, it is produce one with higher quality, and allows
    interim versions to be produced earlier. Also, incremental development is more
    responsive to changing user requirements.


    The incremental approach thus includes testing as part of the development process.
    Every stage of development relates to a specific stage of testing as shown from
    left in Figure 13.1.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_297_0.png)


    Figure 13.1 The stages of incremental testing.


    In unit testing, individual components are tested. In integration testing, the
    interaction between these components is tested. In system testing, a complete
    system is tested against its specification. In acceptance testing, a user validates
    the system meets its needs.


    This chapter describes the activities required to plan software testing, and examines
    how software testing fits into different models of the software development process.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# 13.2 Software Development Life Cycle


    279


    # 13.1 Test Planning


    The time and resources required for software testing can be of a scale similar
    to those required for developing the software. The testing activity therefore
    needs to be planned and managed in a similar way. A typical test plan would include
    such information as:


    +   - items to be tested;

    - tasks to be performed;

    - responsibilities;

    - schedules; and;

    - required resources.


    IEEE standard 29119 provides a framework within which a test plan can be prepared
    and executed. It defines three levels of test documentation:


    +   1. Organisational test documentation: these documents define the organisational
    test policy and test strategy.

    2. Management documentation: these documents define the pre-test and post-test
    management documents consisting of test plans and test completion reports.

    3. Dynamic test documentation: Prior to the test running, this documentation defines
    the test environment and the test data. After the test runs, this defines the
    test execution documentation, including incident reports and test status reports.


    In reality, a large or mission-critical project would use the full standard: most
    projects would use a subset, tailored for the project.


    # 13.2 Software Development Life Cycle


    The software development life cycle is a structured plan for organising the development
    of a software product. There are several models for such processes, whereas approaches
    to a variety of tasks or activities that take place during the process. The need
    for such planning arose with the growth in size and complexity of software projects.
    Unstructured approaches were found to result in cost overruns, late deliveries,
    and uncertainties regarding quality. By adopting a plan for the development, it
    was intended to create a repeatable and predictable software development process
    that automatically improve productivity and quality.


    All models for development include software testing as part of the process, but
    differ on the emphasis it is given. The next sections discuss some of the models
    and the role software testing has within them.


    > 1 ISO/IEC/IEEE 29119-3:2013 Software and systems engineering – Software testing
    – Part 3: Test documentation.


    > 2 See I. Somerville. Software Engineering, 10th ed. Pearson, 2016. for a more
    detailed discussion on software engineering and process models.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# Testing in the Software Process


    # 13.3 The Waterfall Model


    This model visualises the software development process as a linear sequence of
    software development activities: requirements, design, implementation, verification,
    and maintenance. The idea behind the waterfall model is to spend time early on
    making sure that requirements and design are correct, saving time and effort.
    Thus, no time will be wasted creating a design from inaccurate requirements or
    writing code based on faulty design. Furthermore, there is an emphasis on documentation
    that keeps all knowledge in a central repository and can be referenced easily
    by new members joining the team. The model is often criticised for showing no
    visible progress until the very end, and for not being flexible to changes.


    Figure 13.2 a simplified model¹ centred around the testing activity.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_299_0.png)


    **Figure 13.2** A tester''s view of the waterfall model.


    This is categorised into three groups of activity: pre-test activities, testing,
    and post-test activities.


    +   - Pre-test activities consist of analysis of the user requirements, followed
    by the design of the system, and coding.

    - Testing consists of unit testing, integration testing, system testing, and acceptance
    testing of the system.

    - Post-test activities consist of release of the software/product, and the subsequent
    maintenance after the software has been deployed.


    The planning is done at the beginning, and once created it is not to be changed.
    There is no overlap between any of the subsequent phases. Often, anyone''s first
    chance to ''see'' the program is at the very end once the testing is complete
    and the software is released.


    > ¹ This is a simplification of the standard waterfall diagram, as it focuses
    on the testing activity.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# 13.4 The V-Model 281


    For example, the requirements may need to change during the project or a better
    approach to the design may become obvious during the coding phase. Additionally,
    it can be time-consuming to produce all the associated documentation. From a testing
    viewpoint, all the tests are carried out once the software is completed. This
    can cause a number of problems. First, budgetary or time pressure on the project
    at this stage could result in insufficient or incomplete testing being carried
    out. This could be further exacerbated by much testing being done on the program
    as a whole rather than systematically progressing from unit testing to system
    testing. If testing exposes design faults in the program, it is too late to redesign
    in this process, and the only option is to try to fix the problems in the code,
    which is followed by more testing. If some faults are difficult to trace, it could
    result in many iterations back and forth between fixing and testing. Lastly, customers
    may change requests once they have received the product, which may lead to a long
    maintenance phase.


    # 13.4 The V-Model


    The V-Model visualises the software development process as a relationship between
    the specification and associated testing activities of software development. The
    idea behind the V-model is to increase the focus on testing. Each activity leads
    to two outputs: a specification of the next activity, and the criteria for the
    testing has been correctly executed later in the process. It is called the V-model
    for two reasons: the focus on the verification and validation of the software
    product, and the shape of the process.


    Figure 13.3 shows a viewpoint of the V-model⁴ groups the pre-coding and post-coding
    activities, to emphasise these relationships.


    This diagram is categorised into three groups of activity: pre-testing software
    requirements, coding, and software testing. Pre-testing software requirements
    includes requirements gathering, analysis, high-level design and detailed design
    activities, each which produces the documentation shown in the diagram. After
    coding, software testing begins, based on this document. Each document is associated
    with a pair of matching phases in the model, representing the created and testing
    activities:


    +   - Requirements gathers the user requirements specification, which is both
    the input to the analysis and the basis for acceptance testing.

    - Analysis produces the software requirements specification, which is both the
    input for the high-level design of the software and the basis for system testing.

    - High-level design produces the software design specification, which is both
    the input for the detailed design of the software and the basis for integration
    testing.

    - The detailed design activity produces the detailed design specification. This
    is used to write the code, and is also the basis for unit testing.


    > ⁴ This is a particular viewpoint of the standard V-model diagram, emphasising
    the relationships.'
  merge: -1
  pgno: 300
