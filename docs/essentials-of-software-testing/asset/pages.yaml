  md: "# 11.5 Inline Tests vs Parameterised Tests\n\n+   - @BeforeSuite/@AfterSuite\
    \ – called before/after a defined suite of tests.\n- @BeforeClass/@AfterClass\
    \ – called before the execution of the first test method in a test class/after\
    \ the execution of the last test method in a test class.\n- @BeforeGroups/@AfterGroups\
    \ – called before/after a defined group of tests.\n- @BeforeMethod/@AfterMethod\
    \ – called before/after the execution of every test method.\n\n# 11.5 Inline Tests\
    \ vs Parameterised Tests\n\nAll test frameworks support the ability to define\
    \ tests with inline test data (included constants inside the method). In TestNG,\
    \ the @Test annotation is used as shown in Listing 11.4.\n\nListing 11.4 Inline\
    \ tests.\n\n```\npublic class DemoTestInline {\n    @Test void test1() {\n   \
    \     Demo d = new Demo();\n        d.setValue(56);\n        d.add(44);\n    \
    \    assertEquals(d.getValue(), 100 );\n    }\n    @Test\n    public void test2()\
