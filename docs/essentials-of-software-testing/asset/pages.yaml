    item must be covered (sometimes impossible test coverage may be created, which
    must be clearly identified).


    # 11.1.4 Test Design Verification


    The process of performing the analysis, defining test coverage items, and developing
    test cases and data is referred to as test design.


    During test design, when developing the test data, it is good practice to document
    both the test cases that are covered by each test case, and the test cases that
    cover each test coverage item. This allows the test design to be easily reviewed,
    ensuring that every test coverage item is efficiently covered.


    Formal reviews can be used to ensure the quality of the test designs. For a test
    review to be effective, the reviewer needs to see the outputs of the previous
    steps: analysis, test coverage, and test cases. However, in practice, much of
    this work is frequently done mentally and not documented in detail.


    # 11.1.5 Test Implementation


    Tests may be implemented as code (for automated testing), or as procedures (for
    manual testing).


    Recent trends are to automate as many tests as possible. However, there is still
    a place for manual testing. This requires a test procedure to be documented for
    the test. The documentation must describe how to set up the correct environment,
    how to execute the code, the inputs to be provided, and the expected results.


    Unit tests are invariably automated; integration tests are usually are; systems
    tests are where possible. Implementing an automated test involves writing code
