  md: '# Boundary Value Analysis


    # 3.4 Boundary Value Analysis in More Detail


    # 3.4.1 Fault Model


    The BVA fault model is where the boundary values of ranges of values are not identified.
    This leads to incorrect processing near the boundary or edge of the equivalence
    partition. These faults tend to be associated with minor types in the source code,
    where the wrong comparison operator has been used. By testing with two values
    from every equivalence partition – the minimum and the maximum values – BVA tests
    are able to find these kinds of faults.


    # 3.4.2 Description


    Programming faults are often related to the incorrect processing of boundary conditions,
    so is an obvious extension to equivalence partitions to select two values from
    each partition: the bottom and the top. This doubles the number of tests, but
    is more likely to find boundary-related programming faults. Each boundary value
    for each parameter is a TCI. For equivalence partitions, the number of cases is
    minimized by selecting data that includes as uncovered TCIs as possible in each
    new test case. Error test cases are always considered separately – only one boundary
    value is included per error test case. The goal is to achieve 100% coverage of
    the boundary values.


    # 3.4.3 Analysis: Identifying Boundary Values


    Each equivalence partition has an upper and a lower boundary value. Experience
    has shown that many software failures are due to the incorrect handling of limits.
    Boundary values therefore increase the sophistication over using equivalence partitions,
    but at the cost of doubling the number of test cases and tests that need to run.


    For the method isNegative(int x), the boundary values for x are as follows:


    +   - Integer.MIN_VALUE

    - -1

    - 0

    - Integer.MAX_VALUE


    The boundary values for the return value are the same as the equivalence partitions
    as it is a Boolean type – each equivalence partition is a range with only one
    data value:


    +   - true

    - false'
