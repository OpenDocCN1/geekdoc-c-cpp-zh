  md: '# Wrap Up


    +   - Boundary value analysis involves selecting the lower and upper edge values
    from these ranges. It can be considered testing with extreme values.

    - Decision tables involves selecting combinations of input values that should
    cause processing or different outputs. It can be considered testing for all possible
    situations.


    A description of three white-box test techniques: statement coverage, branch coverage,
    and all paths coverage (Chapters 5, 6, and 7, respectively):


    +   - Statement coverage involves selecting input values to ensure all states
    in the test code are executed. It is the simplest form of white-box testing.

    - Branch coverage involves selecting input values to ensure that all branches
    in the test code are taken. It is a stronger form of testing than statement coverage.

    - All paths testing selecting input values to ensure that all the end-to-end paths
    through the code being tested are taken.


    An overview of unit testing and application testing (Chapters 8 and 10).


    +   - Unit testing calling a method or function with selected input values, and
    comparing the output (the actual results) to the expected results.

    - Application testing involves emulating a user interacting with an application
    and making sure that every user story meets its acceptance criteria.


    An introduction to testing object-oriented software (Chapter 9). Three essential
    techniques are discussed:


    +   - Testing in class context: how to test methods and attributes that interact
    with each other in a class.

    - Inheritance testing: testing that inherited behaviours function correctly.

    - State-based testing: testing the state-based behaviour of a class.


    An introduction to random testing (Chapter 12). Random testing poses three key
    challenges:


    +   - The test data problem: how to generate valuable random data.

    - The test oracle problem: how to calculate the expected output for random inputs.

    - The test completion problem: how to know when to end random testing.


    An overview of key test automation topics, with representative examples (Chapter
    11).


    +   - Unit testing, using TestNG;

    - Test coverage measurement, using JaCoCo;

    - Automated application testing, using Selenium.'
