- img_proc: true
  md: 'A consistent approach to developing the Boolean expressions reduces mistakes,
    and eases their review; in our example, we use the &le; operator to generate such
    a consistent logical style.


    In a similar way, the causes for goldCustomer are derived:


    +   - The partition true is a normal partition, and can be identified by the expression
    goldCustomer being true.

    - The partition false is a normal partition, and can be identified by the expression
    goldCustomer being false.


    Please note:


    +   - goldCustomer is already a Boolean expression, so it is redundant to state
    goldCustomer == true and goldCustomer == false as separate causes.

    - Avoid double negatives: it is much easier to work with positive expressions.
    The expression goldCustomer being true is much easier to understand than the expression
    not goldCustomer being false.


    Handling Boolean and enum types is generally very straightforward


    To summarise, the analysis has lead to the following non-error caused:


    +   - bonusPoints &le; 80

    - bonusPoints &le; 120

    - goldCustomer


    We recommend following our approach, as this will lead to similar results every
    time. Other approaches may lead to develop causes that are easy to use and review.
    It is in general bad practice to include logical operators in the causes.


