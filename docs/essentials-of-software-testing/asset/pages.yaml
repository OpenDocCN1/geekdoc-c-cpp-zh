    # 1.1.1 Software Testing and Quality


    Proper software testing procedures reduce the risks associated with software development.
    Modern programs are very complex, having millions of lines of code and multiple
    interactions with other software systems. And they often implement a solution
    that has been defined in very abstract terms, described as a vague set of requirements
    lacking in exactness and detail. Quality problems are further compounded by external
    pressures on developers from business owners, imposing deadlines and budgets to
    reduce both the time to market and associated production costs. These pressures
    can result in inadequate software testing, leading to reduced quality. Poor quality
    leads to increased software failures, increased development costs, and increased
    delays in releasing software. Some outcomes for a business can be a loss of reputation,
    leading to reduced market share, or even to legal claims.


    The international standard ISO/IEC 25010⁴ defines a quality model with eight quality
    characteristics (Table 1).


    Table 1.1 Software quality attributes in ISO/IEC 25010.


    | Attribute | Characteristics |

    | --- | --- |

    | Functional suitability | Functional completeness, functional correctness, functional
    appropriateness |

    | Performance efficiency | Time behaviour, resource utilisation, capacity |

    | Compatibility | Coexistence, interoperability |

    | Usability | Appropriateness, recognizability, learnability, operability, user
    error protection, user interface aesthetics, accessibility |

    | Reliability | Maturity, availability, fault tolerance, recoverability |

    | Security | Confidentiality, integrity, non-repudiation, authenticity, accountability
    |

    | Maintainability | Modularity, reusability, modifiability, testability |

    | Portability | Adaptability, installability, conformance, replaceability


    Attributes that can be measured objectively, such as performance and functionality,
    are easier to test than those that require a subjective opinion, such as learnability
    and instability.


    # 1.1.2 Software Testing and Risk Management


    Software testing can be viewed as a risk-management activity. The more resources
    are spent on testing, the lower the probability of a software failure, but the


