    # 8.2.7 Testing Sequences of Inputs/State-Based Testing


    Many software systems are state-based – their behaviour is based not only on the
    current inputs, but also on their current state (essentially defined by the history
    of previous inputs). When the system reaches a particular state, this is based
    on the sequence of inputs to data.


    A simple example would be software for a touch-controlled lamp. When it is off,
    a touch toggles the lamp to on; when it is on, a touch toggles the off. The lamp
    has two states, ON and OFF. Which the system is in based on how many times it
    has been toggled, and the behaviour of a toggle depends on which state the system
    is in.


    The fault model of state-based testing is to find faults in the software associated
    with these different states. Typically this will mean that the software fails
    to reach a particular state correctly, or when the software is in that state,
    it fails to function correctly.'
