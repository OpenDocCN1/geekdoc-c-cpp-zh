    In this chapter only one type of random testing is shown as an introduction to
    the topic: random input data selection with testing cases. Ideally the entire
    testing process would be random and automated, and provide full coverage of the
    software specification and implementation. This would lead to more comprehensive
    and low-cost testing. However, there are many barriers to this:


    # 12.5.1 Barriers to Full Automation


    Three barriers to fully automated random'
