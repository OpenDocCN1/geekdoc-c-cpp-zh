    # 8.2.5 Handling Relative Values


    Another problem related to input (and output) parameters, is that not all partitions
    are defined by absolute values. Some partitions may be defined relative to another
    input, or by a relationship between inputs.

    Consider the method largest(int x, int y). There are three different-cases to
    consider for x:


    +   - x is less than y: x < y

    - x is equal to y: x = y

    - x is greater than y: x > y


    First we consider the input x. The approach is to treat y as though it had a fixed
    value. Working along the value line for x, starting at Integer.MIN_VALUE, the
    processing is identical until we reach the value y. The first partition contains
    the values from Integer.MIN_VALUE up to the value y - 1, for any value of y.

    If y has the value Integer.MIN_VALUE, then we treat this as an empty partition.
    And if y has the value Integer.MIN_VALUE-1, then we treat this as a single-valued
