  md: '# 12.5 Random Testing in More Detail


    # 12.5.2 Overview of Other Types of Random Testing


    There are a number of other approaches to random automated testing that are not
    addressed in detail in this book, including:


    +   - Stability testing – there are various forms that test a system to ensure
    that it does not hang or crash, for any input. These test techniques (support
    tools) do not use the specification to determine if the output is correct, but
    rather verify the stability of the system to randomly selected inputs.

    - Undirected random testing – the user interface is scanned for components, one
    is selected at random, and then an interaction is selected at random (such as
    a click, text entry, swipe, and so on) and executed. The test attempts to cause
    the system to crash. Normally, the completion criteria are based on time.

    - Directed random testing – white-box coverage criteria, as state or branch coverage,
    are measured dynamically during testing. Once random tests stop adding coverage,
    then analysis of the code takes place to identify input data that will increase
    the coverage may take the form of symbolic execution, or may be based on statistical
    or machine learning approaches. The goal is typically to maximise coverage, maximise
    the number of crashes, and minimise the length of the input sequences. It can
    be used for desktop, mobile, and web-based applications, though whether a web-based
    application has crashed can be challenging. The completion criteria are usually
    correct and/or time-based, as it may take a long time to achieve the required
    coverage, if it is even possible.

    - Fuzz testing – existing data is corrupted at random, and provided input to the
    system. The goal is to crash the system with invalid input. The completion criteria
    is usually time. This technique may be used in conjunction with directed random
    testing.


    Stress testing – the goal is to ensure the system continues to operate correctly
    when overloaded with inputs. Existing tests may be chosen at random and executed
    at the highest rate achievable, often running a large number of tests in parallel
    to maximise the load. This ensures that the system operates correctly, even when
    overloaded. Alternatively any random tests may be used as input, ensuring the
    system does not hang or crash when overloaded. Special test


    > 6 For example: Android Monkey (https://developer.android.com/studio/test/monkey)
    and Sapien, which is described in K. Mao, M. Harman, and Y. Jia. Multi-objective
    automated testing for Android applications. In Proc. 25th Int Sym. Software Testing
    and Analysis. ACM, 2016.'
