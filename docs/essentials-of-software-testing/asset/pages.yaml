    \ the application using other interface elements (such as keyboard shortcuts,\
    \ buttons, links, etc.).\n\nDesigning automated tests for an application involves\
    \ finding a way to (a) locate the required interface elements, and (b) extract/insert\
    \ data in a way that is compatible with the data representation used. For example,\
