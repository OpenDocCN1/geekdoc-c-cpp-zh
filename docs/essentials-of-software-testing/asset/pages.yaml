    \ Iterator over a static collection) and dynamic data providers return a customised\
    \ Iterator, which can generate data on-the-fly.\n\nDynamic data providers can\
    \ be written to test data that changes based on the test progress, or to support\
    \ very large data sets. An example is shown in Listing 11.6. Instead of returning\
    \ an array, the @DataProvider returns an iterator.\n\n# Listing 11.6 @DataProvider\
    \ with iterator.\n\n```\nprivate static Object[][] testData = new Object[][][]\
    \ {\n    \"test1\", 56, 44, 100,\n    \"test2\", 0, 0, 0,\n    \"test3\", -1000,\
    \ -1234, -2234,\n}\n\n@DataProvider(name = \"test1\")\npublic Iterator<Object>\
    \ getData() {\n    return new DataGenerator(testData);\n}\n\n@Test\npublic void\
    \ test(String id, int x, int y, int er) {\n    Demo d = new Demo();\n    d.setValue(x);\n\
    \    d.add(y);\n    assertEquals(d.getValue(), er);\n}\n```\n\nEach time the iterator\
    \ next() method is called, it returns the next row of data. In the example, the\
    \ pre-initialised array is used, but the data could be dynamically generated within\
    \ the next method. This is particularly useful for random testing where data may\
    \ be generated on demand. The supporting DataGenerator class is shown in Listing\
    \ 11.7.\n\n# Listing 11.7 DataGenerator implements Iterator<Object[]>>\n\n```\n\
    static class DataGenerator implements Iterator<Object[]> {\n    private int index\
    \ = 0;\n    private Object[] data;\n\n    DataGenerator(Object[] testData) {\n\
    \        data = testData;\n    }\n\n    @Override\n    public boolean hasNext()\
    \ {\n        return index < data.length;\n    }\n\n    @Override\n    public Object\
    \ next() {\n        if (index < data.length) {\n            return data[index++];\n\
    \        }\n        else\n```"
