  md: '# A More Detailed Look at Testing Object-Oriented Software


    In this section we will first examine OO programming and the environment in which
    OO software runs. There follows a description of the fault models for OO testing,
    and some more discussion on the activities shown in the test example in Section
    9.2. Finally, a number of OO test techniques are summarised.


    # Object-Oriented Programming


    Object-orientation can be defined as programming with classes, inheritance, and
    messages. Classes provide a wrapper to encapsulate data (attributes) and associated
    code (methods). Inheritance provides a mechanism for code reuse, especially useful
    for implementing common features. Messages (or method calls) provide the interface
    to an object.


    Classes are the foundation of OO programming, and contain a collection of attributes
    and methods. The attributes are usually hidden from external access, and can only
    be accessed via methods: this is referred to as data encapsulation. Classes have
    relationships with other classes: they can inherit attributes and methods from
    other classes, and can invoke methods on objects of other classes.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_195_0.png)


    **Figure 9.4** Object-oriented execution model.


    Figure 9.4 summarises the environment in which methods execute. The inputs labelled
    are the explicit inputs or parameters passed by the method call, and the outputs
    are the explicit outputs or values returned by the method call.


    7 R. Binder. Testing Object Oriented Systems: Models, Patterns, and Tools. Addison-Wesley,
    2010.'
