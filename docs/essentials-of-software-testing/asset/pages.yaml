  md: '# The Test Data Problem


    The automated generation of test data that thoroughly tests software (be it a
    unit, a class, or an entire system) is a complex problem. It requires data generation
    goals to be defined and software libraries that generate data that meets those
    goals. A stepping stone on the road to full automation is the provision of random
    object generators, given a goal will generate a random object for use in unit,
    OO, or system testing. This can be used in conjunction with manually developed
    test cases (e.g. equivalence partitioning), where a goal is selected and data
    is generated to match that goal. This can also be used to address the oracle problem
    if the goal allows the expected results to be easily determined.


    Purely random selection of data values is unlikely to cover all of the implementation.
    Research into directed random data generation has focused mainly on white-box
    coverage, tools to measure this coverage exist for many languages (for example
    Directed Automated Random Testing).


    For application testing, data generation is often based on statistics of typical
    input data. This allows to mimic actual software usage. as well as helping to
    find faults, this type of data generation allows the mean time to fail (MTTF)
    to be estimated in advance of software release. Whereas in principle this can
    be used for unit testing, it itself: the focus on unit testing tends to be towards
    complete coverage than only coverage of typical inputs.


    # The Test Completion Problem


    Ideally, automated random tests would cover all of the specification and all of
    the implementation, achieving 100% black-box and 100% white-box coverage. However,
    as we have seen previously, few tools to measure black-box coverage, and not all
    white-box coverage metrics can be easily measured (as all-paths coverage). Approaches
    to solving this problem tend to be based on pragmatism:


    +   Number of loops is the simplest completion criterion. Run a number of random
    tests, selecting this number to suit the development process. This can be an iterative
    process, and may sometimes result either in a lost opportunity to run more tests
    in the time available, or the need to terminate the random testing run midway
    in order to meet a project''s deadlines.

    The is a more sophisticated metric. Allow random tests to run for a specific length
    of time that suits the development process. This may lead to variations in coverage.

    Existing white-box coverage tools. For example, run random tests until 100% statement
    and branch coverage have been achieved. This will often result in non-terminating
    tests, and is usually used in conjunction with time as a completion measure.


    > 5 Refer to P. Godefroid, N. Klarlund, and K. Sen. DART: Directed Automated Random
    Testing. In Proc. ACM SIGPLAN Conf. Programming Language Design and Implementation.
    ACM, 2005, for details.'
  merge: -1
