    this diagram as they are not strictly testing-related. The selected features are
    also used to create acceptance tests, which are used to verify the tested product
    increment for each sprint.


    This approach has proven successful, as the testing team collaborates closely
    with the developers from the start of the project.


    # 13.6 Process-Related Quality Standards and Models


    There are a number of other models and quality-related testing standards that
    the tester should be aware of. In general, they address testing as a part of the
    larger quality assurance (QA) process. A key model is the ISO 9000/25000 series
    of standards. The ISO 9000/25000 series of standards are a significant concern
    for companies developing software and systems for public tender – they provide
    state bodies with an assurance that the software is being developed in a professional
    manner.'
