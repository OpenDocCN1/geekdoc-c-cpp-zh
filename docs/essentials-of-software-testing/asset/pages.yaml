    ```


    ¹JaCoCo measures the outcome of every Boolean condition in a decision as a separate
    branch. Each may take a different approach, seen in many textbooks, of measuring
    the outcomes of the decision as branches, and not of the individual Boolean conditions
    within the decision.'
