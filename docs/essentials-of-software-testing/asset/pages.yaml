    There is extensive debate about the effectiveness of pairwise testing. While the
    method may not find N-way faults (associated with a combination of N different),
    some research suggests that the additions of higher-order (threeway, four-way,
    N-way) combinations may not be cost-effective. The obvious benefit is in reducing
    the number of test cases. Pairwise testing also reduces the time for test design
    (fewer tests to design), implementation (fewer tests to code), and execution (fewer
    tests to run).


    # 4.4.4 Test Coverage Items


    Each rule in the decision table is a TCI. If a test item includes multiple decision
    tables (for example, in a class) then it is useful to signify each rule/TCI with
    a unique identifier (i.e. a different name).'
