    # 4.4.2 Description


    The previous two techniques (equivalence partitioning and BVA) reduce the number
    of tests by not considering combinations. Decision table provides additional coverage
    by identifying tests as possible to cover all the possible combinations that have
    an impact on the output.

    The objective is to achieve 100% coverage of the rules in the decision table (representing
    combinations).


    # 4.4.3 Analysis: Developing Decision Tables


    Some programs do data processing based on individual input values. Other programs
    exhibit different behaviour based on the combinations of input values. Handling
    complex combinations incorrectly can be a source of faults that leads to testing.

    The analysis of combinations involves all the different combinations of inputs
    to the software and their associated output effects. The causes and effects are
    described as logical statements (or predicates), based on the specification. These
    expressions specify the conditions for a particular variable to cause a particular
    effect.


    To identify a minimum subset of combinations that will all the different behaviours
    of the program, a decision table is created. The inputs (causes) and outputs (effects)
    are specified as Boolean expressions (using predicate logic). Combinations of
    the causes are the inputs that will generate a particular response from the program.
    These causes and effects are combined in a decision table that describes their
    relationship. Test coverage items are constructed that will cover all feasible
    combinations of cause and effect. For N independent causes, there are 2^N'
