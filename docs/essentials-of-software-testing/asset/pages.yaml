  md: '# # 5 Statement Coverage


    In this chapter, white-box testing is introduced, and its most basic form, statement
    coverage, is presented.


    # ##5.1 Introduction to White-Box Testing


    In the previous chapters, basic black-box test techniques have been described.
    These provide a basic level of testing against the specification. However, faults
    may remain in unexecuted components of the code. In order to find these, tests
    based on the implementation (code) instead of the specification are used – these
    techniques are referred to as white-box testing or structure-based testing. These
    techniques identify particular parts of the code, and test that the correct result
    is produced when these are exercised. Test coverage items are derived from the
    implementation, but the specification is used to provide the expected results
    for each test case.


    The expected results must always be derived from the specification and not from
    the source code. It is easy to make the mistake of using the source code when
    it is in front of you, and the output is obvious from the code. However, using
    the source code to derive the expected results only verifies that you have understood
    the code properly, and not that the code works.


    In practice, the coverage of the code components achieved by executing the black-box
    tests is usually measured automatically, and white-box tests are developed only
    for components not already covered. This is the approach taken in this book.

    Refer to Chapter 8 for a more detailed discussion on white-box testing, and how
    it completes black-box testing.


    # ##5.2 Testing with Statement Coverage


    Statement coverage testing (or more formally testing with statement coverage criteria)
    ensures that every line, or statement, of the source code is executed during tests,
    while verifying that the output is correct.


    **Definition:** a statement is a line in the source code that can be executed.¹


    ¹ Not all lines can be executed: blank lines, comments, opening and closing braces,
    etc.'
  merge: -1
