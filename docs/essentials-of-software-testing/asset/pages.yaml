    # 6.4 Branch Coverage in More Detail


    # 6.4.1 Fault Model


    The branch coverage fault model is where branches that have not been taken in
    previous tests (untaken branches) may contain a fault. As for statement coverage,
    these tend to be associated with edge cases or other unusual circumstances.


    Branch coverage tests with input values carefully selected to ensure that every
    branch is taken during test execution. These tests attempt to find faults associated
    with individual branches in the source code.


    # 6.4.2 Description


    As with many forms of testing, there is more than one approach. In this book we
    use a tool to measure the branch coverage of the previously developed tests, and
    only develop new tests to complete the branch coverage. This is the most commonly
    used in practice.


    However, there are alternative approaches:


    +   * As we have JaCoCo counts the outcome of each Boolean condition as a branch.
    The tester might select a different tool that counts the outcomes of each decision
    as branches instead. This would reduce the number of branches, which leads to
    slightly reduced effectiveness. However, the tester must work with the tools that
    are available. See the discussion on decision coverage and condition coverage
    in Sections 8.3.2 and 8.3.3.

    * The branches in the code may be identified from scratch without considering
    any of the previously written tests. This involves developing a control flow graph⁴
    of the program, and then identifying all the edges in the graph as branches. In
    this approach, the decisions themselves (and not the Boolean expressions) are
    invariably used. Many books demonstrate this approach, but it is seldom used in
    practice for two decades. First, it is very time-consuming to develop the control
    graph for code of any significant length. Second, if the code is changed, either
    to fix a fault or add new features, the control graph will be reviewed and possibly
    re-done, and the associated test implementation redeveloped. The rapid change
    of code in modern, Agile development environment makes this approach less realistic
    than the approach shown in this book.


    > ⁴ Chapter 7 shows how to do this.'
