  md: '# Application Testing


    +   - User requirements faults: this occurs where the actual responses from the
    application do not match the expected responses as specified in the associated
    user story.


    However, it is unusual for the user stories to cover the full functionality of
    the interface. There is a second level of the design hierarchy to be considered
    in testing an application. When using an application, a user will navigate between
    different screens, each screen contains multiple interface elements, and these
    elements interact with underlying software features. In an MVC (model-view-controller)
    design, navigation may be associated with the controller, screen contents with
    the view, and the underlying-software features with the model. This leads to three
    functional fault models for an application.


    +   - Navigation faults: this occurs where the navigation between the different
    components (in the form of windows, screens, pages, etc.) does not work correctly.
    The application may display the wrong screen, or ignore the user action and do
    nothing.


    +   - Screen element faults: each interactive interface component of the system,
    with its corresponding inputs and outputs, has expected behaviour. For example,
    a button should perform some action when clicked, a text input box should accept
    typing, and a hyperlink should navigate to another page. It is an element behaviour
    fault when an element does not exhibit the expected behaviour. In the case of
    a web application, much of the expected behaviour may be implicit and not documented.
    For example, the designer might assume that a user will type their name into a
    textbox with the prompt `Username` and not specify exactly how the textbox is
    to behave in detail.


    +   - Software feature faults: where the software features of the system are documented,
    these can be tested independently of the user stories. Typically a user story
    typically involves several interactions with the system that result in a particular
    output. A feature can be regarded as a method or class, and the black-box techniques
    of equivalence partition, BVA, and decision tables applied to testing each.


    Some of these fault models may overlap: for example, if an HTML anchor link is
    not implemented correctly, it will not behave correctly when clicked (element
    behaviour fault), leading to the next screen not being displayed (navigation fault),
    which may cause the feature to not display its outputs (feature fault), and thus
    the application will not satisfy the acceptance criteria for the associated user
    story (user requirements fault). User stories attempt to catch most of these faults
    by testing that the user can complete the required tasks.


    > There are a wide range of appearance- and performance-related fault models which
    are not included here.'
