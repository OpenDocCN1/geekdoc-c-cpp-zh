  md: '# Black-Box and White-Box Testing


    # 8.1 Comparison of Black-Box and White-Box Testing


    Black-box testing (also referred to as specification-based or functional testing)
    is based entirely on the program specification, and uses no knowledge of the inner
    workings of the program code. Black-box testing aims to verify that the program
    meets the specified requirements, without any knowledge of the program implementation.


    The principles of black-box and white-box testing can be applied to testing at
    different stages of development: from *unit testing* as the code is progressively
    developed, to *application testing* for each release of the overall system.


    Black-box testing techniques are practised by a subset of the possible combinations
    of input values has been selected. For example, *boundary value analysis* means
    to select all the possible boundary values for every input and output parameter.


    **Key point: black-box test cases and test data are derived solely from the functional
    specifications.


    White-box testing (also referred as implementation-based or structural testing)
    uses the *implementation* of the software to derive tests. The tests are designed
    to exercise a particular aspect of the program code, as the statements or the
    decisions it contains. By examining how the program works, and selecting test
    data to cause specific components of the program to be executed, the tests can
    expose errors in the program structure or logic.


    White-box testing techniques are practised by their *coverage criteria*. This
    refers to the percentage of the components that have been exercised by the test.
    For example, 100% *statement coverage* means that all the lines of source code
    in a program have been executed at least once during the test.


    **Key point: white-box test cases are derived from the code; the test data is
    derived from both the code and the functional specifications.


    Table 8.1 Comparison of some of the key characteristics of black-box and white-box
    testing.


    | Black-box testing | White-box testing |

    | :--- | :--- |

    | Tests are only dependent on the specification. | Tests are dependent on both
    the implementation and the specification. |

    | Tests can be reused if the code is updated, which may be to to fix a fault or
    add new features. | Tests are generally invalidated by any changes to the code,
    and cannot be reused. |

    | Tests can be developed before the code is written as they only require the specification.
    | Tests can only be developed after the code is written as they require both the
    specification and the executable code. |

    | Tests do not ensure that all of the code has been executed. They may miss *errors
    of commission* (see Section 8.1.3). | Tests do not ensure that the code fully
    implements the specification. They miss of omission. |

    | Few tools provide automated coverage measurement of any black-box tests. | Many
    tools provide automated coverage measurement of white-box tests. |'
  merge: -1
