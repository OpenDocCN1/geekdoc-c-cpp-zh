    # Decision Tables


    A decision table⁶ is used to map the cases and effects through rules. Each rule
    states that under a particular combination of input causes, a particular set of
    output effects should result. Only one rule may be active at a time: the decision
    table is invalid if any input matches more than one rule.


    To generate the decision table, each case is listed in a separate row, and each
    combination of causes listed in a separate column creates a different effect.
    Each column is referred to as a rule in the table – each rule is a different TCI
    (and a different test case).


    The decision tables for the three previous examples are shown in the following.
    Letter ''T'' is used as shorthand for true and ''F'' for false.


    Table 4.20 shows the decision table for isNegative():


    +   - Rule 1 states if x < 0, then the return value is true.

    - Rule 2 states if ! (x < 0), then the return value is false.


    | | 1 | 2 |

    |---|---|---|

    | Rules | | |

    | | | |

    | Causes | | |

    | | x < 0 | T | F |

    | Effects | | |

    | | return value | T | F |


    Table 4.21 shows the decision table for isZero():


    +   - Rule 1 states if x == 0, then the return value is true.

    - Rule 2 states if ! (x == 0), then the return value is false.


    | | 1 | 2 |

    |---|---|---|

    | Rules | | |

    | | | |

    | Causes | | |

    | | x == 0 | T | F |

    | Effects | | |

    | | return value | T | F |


    ⁶ In mathematics, these tables are referred to as truth tables, as they only contain
    the values true and false, but the term decision table is widely used in software
    testing to define the decisions to be made by the software. Cause–effect graphs
    can also be used here.'
