  md: "# 178 Testing Object-Oriented Software\n\n**Inheritance:** inheritance leads\
    \ to a binding between objects and different classes and interfaces.¹10 Dynamic\
    \ binding occurs at runtime, where a decision is made by the Java VM to which\
    \ overridden method to use. Complex inheritance structures, or a poor understanding\
    \ of inheritance in Java, may provide many opportunities for faults due to unanticipated\
    \ bindings or misinterpretation of correct usage.\n\n**Messages:** programming\
    \ mistakes when making calls, where the wrong parameters are passed or the correct\
    \ parameters are passed but mixed up are a leading cause of faults in procedural\
    \ languages. Object-oriented programs typically have many short methods, and therefore\
    \ provide an increased risk of these interface faults.¹¹\n\n# 9.4.4 Testing in\
    \ Class Context\n\nThe methods in a class must be tested in the context of the\
    \ other methods defined in the class. This is an essential element of all tests\
    \ for OO software, as all methods execute in class context. The early chapters\
    \ examine conventional methods of testing using static methods, which accept all\
    \ their inputs as arguments to the method, and return the result.\n\nA conventional\
    \ unit test has the structure shown in Snippet 9.1.\n\n# Snippet 9.1 A conventional\
    \ test\n\n```\n1 actual_result = Classname.method( p1, p2, p3 );\n2 check_equals(\
    \ actual_result, expected_results );\n```\n\nThe operation of the test is straightforward:\n\
    \n+   - On line 1, the method being tested is called with the test input values\
    \ – here p1, p2, and p3 are used as examples. The return value is stored in a\
    \ temporary variable: actual_result.\n- Subsequently, line 2, the actual results\
    \ returned by the method call are compared with the expected results as specified\
    \ for the test. If they are the same, then the test passes. Otherwise the test\
    \ fails.\n\nIn practice, this is usually used in a single line, as shown in Snippet\
    \ 9.2.\n\n# Snippet 9.2 A conventional test on one line\n\n```\n1 check_equals(\
    \ Classname.method( p1, p2, p3 ),\n   expected_results );\n```\n\n¹⁰ This refers\
    \ to a Java Interface, or an abstract class in more general terms.\n¹¹ Interface\
