    8.3). The specification is still needed to ensure that the output values are correct.


    ![](img/6a3e28417c651af2c9c33c1aa588b582_163_0.png)


    Figure 8.3 Implementation model of testing.


    This is ideally achieved by exercising all the components (including combinations
    and sequences of components) in the implementation. As discussed already, exhaustive
    testing is seldom feasible, and so a subset of possible inputs must be selected
    to execute key sets of components.


    # Measurement


    Many programming languages and test environments provide tools that can measure
    what was executed during code testing. They do this by recording which instructions
    have been executed. This is referred to as instrumenting the code. Using these
    tools, we can calculate simple figures, such as percentage of lines executed,
    or percentage of branches taken during the tests. We have seen examples of this
    in Chapters 5 and 6. Achieving 100% coverage of this test criteria does not necessarily
    indicate complete testing – there may be complex end-to-paths, as is discussed
    in Chapter 7. However, achieving less than 100% coverage clearly indicates that
    there is untested code or untested branches.


    These measurement tools are often used to determine the coverage provided by black-box
    testing. Following this, white-box testing can then be used to augment the black-box
    testing and improve the test quality.


    It can be argued that any goal less than 100% coverage does not assure quality.
    A lot of effort may be expended to achieve this. The same effort might better
    spent using a different test approach (for example: static testing instead of
    dynamic testing). Using coverage-based white-box techniques, such as statement
    testing or branch testing, a typical goal is to attain 80–90% coverage or more
    before releasing.1


    However, these recommendations are not absolute and safety-critical software may
    require more testing. One strategy that usually increases coverage is to first
    attain a baseline level coverage throughout the entire test program before striving
    for higher coverage in critical.


    1 R.B. Grady, Practical Software Metrics for Project Management and Process Improvement.
    Prentice-Hall, 1992. O. Vinter and P. Poulsen. Experience-driven software process
    improvement. In Proc. Conf. Software Process Improvement (SPI 96). International
    Software Consulting Network, 1996.'
