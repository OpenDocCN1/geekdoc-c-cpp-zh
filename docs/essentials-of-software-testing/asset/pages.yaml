  md: '# Black-Box and White-Box Testing


    State behaviour can be defined using a state diagram.⁵ This shows all the states,
    the transitions between the states, the input events that cause these transitions,
    and the actions to be taken on each state transition. Figure 8.8 shows the state
    diagram for the touch-controlled lamp. The boxes represent states. The arrows
    represent transitions between states. The initial arrow to the OFF state indicates
    that the system starts in state. And the label toggle() indicates an event, or
