    In Figure 7.12, considering the flow of execution in the code, lines 1-4 are executed
    as a sequence. If the decision on line 4 is true, then line 5 is executed next.
    After line 5, lines 6 and 7 then execute 7. If the decision on line 4 is false,
    then lines 6 and 7 then execute 7.


    Considering the CFG, node (1.4) executes first. If the decision (a > 10) at the
    end of node (1.4) is true, then control moves to node (5), and then to node (6.7).
    If the decision at the end of node (1.4) is false, then control moves to node
    (6.7).


    This demonstrates how each node in the CFG represents a sequence of one or more
    lines of code, and how the edges in the CFG reflect the decisions and subsequent
    branches in the code. Be consistent: always keep the false branch on the left
    and the true branch on the right.


    If the decisions are included next to the true branch, then the CFGs can be used
    for subsequent analysis without the need to refer back to the source code.


    The edges may be annotated, using different symbols to prevent any confusion with
    either the node identifiers or the decoders. Here, the Greek characters α, β,
    and γ are used. The edges are not used for any of the techniques included in this
    book, and will be omitted from future CFG diagrams.


    The edge β from node (1.4) to node (6.7) is referred to as a null-else statement.
    This branch is taken if the decision is false, but contains no executable code
    (hence null).'
