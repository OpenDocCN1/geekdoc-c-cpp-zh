  md: '# Decision Table Testing


    Usually a decision table will not include error situations, due to the number
    of rules required to describe all of these. Errors would only be included in a
    separate table for clarity, and only when different combinations of causes result
    in different-errors.


    # 4.4.5 Test Cases


    Input test data for the test cases is selected on rules not yet covered. Each
    test case will cover exactly one TCI (or rule). The expected results values are
    derived from the specification (using the decision table).

    Hint: it is easily to identify test data by going through the rules in order,
    and selecting a value for each parameter that matches the required causes. It
    is easier to remove duplicates and review the test design for correctness if you
    use as few different values as each parameter. So it is recommended to reuse the
    equivalence partition values.


    # 4.4.6 Pitfalls


    Decision table testing can go wrong in a number of ways:


    +   - Ensure the causes are complete and do not overlap, otherwise the table may
    be incomplete or inconsistent.

    - Use simple logical expressions for causes (i.e. with Boolean operators, such
    as the && or || operators). Otherwise it is difficult to ensure all the combinations
    are created by the table.

    - The rules must be unique, you must ensure that no two rules be true at the same
    time (i.e. every rule must have a different combination of causes). Otherwise
    the table is invalid and cannot be used to derive test cases.

    - Ensure that there are no possible combinations of input values that cause no
    rules to be matched.


    # 4.5 Evaluation


    Decision table testing approaches black-box testing from a slightly different
    viewpoint compared to equivalence partition and BVA testing. Instead of considering
    each input individually, it considers combinations of input values that are expected
    to have an effect on the processing or the output. This provides increased coverage
    of decisions in the code relating to categorising the inputs, and deciding what
    action to take based on a combination of input values.


    This is important, as complex decisions are a frequent source of mistakes in the
    code. These decisions generally reflect the correct identification of a complex
    situation, and if not correctly implemented can result in the wrong processing
    taking place.'
