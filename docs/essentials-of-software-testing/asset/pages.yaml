    values of the partition below 0.0 and the partition above 1.0? For the partition
    below, is -0.1, -0.00001, or -0.00000000001? And for the partition above is 1.01,
    1.001, or 1.00000000001? If the programming language or libraries supports it,
    then you can use these features to find floating numbers just below and just above
    a value. For example, in Java, the methods Java.lang.Math.nextUp() and .nextAfter()
    can be used to do this.

    - Handling cumulative errors. Because not every number can be represented, and
    values can get lost when subtracting or adding a very small number from a very
    large one, errors tend to accumulate in software that uses floating point. In
    order to handle this, the maximum allowable error needs to be specified for such
    software, and as comparing to a constant, this provides the upper and lower bounds
    on a correct output.

    - Input and output conversion. It is easy to make a mistake when reading or writing
    floating point numbers. For example, the visible format of the number may change
    depending on its value (0.00001 vs 1.0000E-5). It is therefore important to understand
    where these changes take place, and to test software input and output with very
