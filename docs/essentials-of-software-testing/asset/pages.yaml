  md: '# 9.4 A More Detailed Look at Testing Object-Oriented Software


    To test software in an OO environment, an object (an instance of the class being
    tested) must be created first. When a method is called, some or all of the inputs
    and outputs for the method may be attributes rather than explicitly parameters
    and return values. In this example, other methods need to be called beforehand
    to set some of the input values (setters) and afterwards to fetch some of the
    output values (getters).


    The structure of a typical OO unit test is shown in Snippet 9.3. This test structure
    is referred to as testing in class context. Note how this contrasts with a conventional
    test as shown in Snippet 9.1.


    # Snippet 9.3 Testing in class context


    ```

    object = new Classname( p1 );

    object.setParameter( p2 );

    actual_status = object.method_under_test( p3 );

