    # Causes and Effects


    Causes and effects are expressed as Boolean expressions, as shown in the examples
    below.


    Example A Consider the method boolean isNegative(int x) as described previously.


    There is a single cause:


    +   1. x < 0 (which can be true or false)


    and a single effect:


    Please note:


    +   * For mutually exclusive expressions, such as x < 0 and x >= 0, only one form
    of the expression is needed, as it can take the true value or false.


    +   * For Boolean variables, the two expressions variable == true and false are
    not needed. The single expression (in this example, it is the return value) can
    take the value true or false.


    Example B Consider the method isZero(int x), which returns true if x is zero,
    and otherwise returns false.


    There is a single cause:


    +   1. x==0


    and a single effect:


    +   1. the return value.


    Example C. Consider the method int(int x, int y), which returns the sum of the
    two input values.


    The causes are:


    +   1. x > y


    +   2. x < y


    and the effects are:


    +   1. return value == x


    +   2. return value == y


    Please note:


    +   * Where are three possible situations (here, x < y, x == y, and x > y) you
    need at least two expressions to cover them:


    +   1. If x > y, then x < y is false.


    +   2. If x < y, then x > y is false.


    +   3. If x == y, then x > y and x < y are both false.'
