- img_proc: true
  md: '# Testing Object-Oriented Software


    The conventional tests may find state-based and inheritance faults, but they are
    more likely to be found by systematic testing against those fault models.


    # 9.6 Key Points


    +   - Methods need to be tested in class context, using setter and getter methods
    to assist in the tests.

    - All black-box and white-box test techniques can be used to perform conventional
    testing in class context.

    - Object-oriented programs have special features that require testing: two key
    ones are state-based behaviour and inheritance.

    - As the test code not have access to private attributes, built-in testing can
    be a useful technique. It is particularly useful for verifying state invariants.

    - There are many other aspects of testing OO programs not shown: every UML diagram
    is a specification, and therefore a potential source of test cases and test data.


    # 9.7 Notes for Experienced Testers


    The experienced tester often do all the test design work in their mind, and code
    the tests directly from the class specifications, especially for a small class.
    This includes:


    +   - selecting the methods to test (in particular, whether to test the getters
    and setters);

    - for conventional testing: one or more of equivalence partition, deciding on
    the test design technique (for example: one or more of equivalence partition,
    BVA, decision tables, state-coverage, branch coverage, all paths);

    - identifying the test coverage items based on the test design technique;

    - designing the test cases;

    - writing the test code.


    Especially in an agile development environment, an experienced tester may use
    the user stories and acceptance criteria as the basis of OO tests. This is relatively
    straightforward when the model that the classes implement the user problem closely.
    In this case particular user actions can be easily matched to method calls, and
    the sequence of interactions linked in an acceptance criteria for a user story
    can be easily mapped to a sequence of method calls.


    The experienced tester will also probably code tests directly from the state diagram
    or inheritance tree, having made sure that the tests are designed to allow inheritance
    testing.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# 10 Application Testing


    In this chapter we present the essential elements of testing a user application
    based on the example of a web application. The testing of desktop and mobile applications
    is very similar – the key difference is the test automation tools, a topic we
    discuss in Chapter 11.


    Application testing has additional complexities in comparison to unit testing.
    The key differences are: how to locate the inputs on the screen, how to locate
    the outputs on the screen, and how to automate the tests over the user interface.


    # 10.1 Testing Web Applications with User Stories


    Many different elements of an application’s specification can be used as the test
    basis for application testing. Modern, Agile development process focus on the
    user requirements expressed in the form of user stories. Large systems contain
    a number of stories which can be grouped into collections *epics*.


    **Definition:** *a user story* is a way for a *stakeholder* to state their requirements.


    User stories utilize the form:


    *As a <role>, I want <to do something> so that I <achieve a goal>.*


    A stakeholder may be an end-user, the sponsor of the project, a representative
    from sales or marketing, etc. The role refers to the stakeholder who is playing
    for that story.


    Each user story is detailed with *acceptance criteria* (also called *confirmations*)
    which the stakeholders will use to verify that the system has been designed and
    implemented correctly. These acceptance criteria provide the basis for test cases
    for automated tests for.


    As in previous chapters, we will first consider a small example, and then discuss
    of the underlying principles and issues in more detail.


    # 10.2 Example


    A fuel depot wants a web-based system to enable the dispatcher to determine whether
    a load of fuel to be received at the depot will fit in a single tank. Low-volatility
    fuels'
  merge: -1
