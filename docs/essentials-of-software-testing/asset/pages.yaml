    # 11.10 Interfacing to Web Applications


    Selenium is a program tool for automating web-based applications. In this book,
    it is used as a representative example of a library enabling automated web-based
    application testing. Key features of Selenium driver for testing are presented
    in the following examples.


    # WebDriver


    WebDriver is a library which can be used with different programming languages
    such as Java, PHP, Python, Rugby, and C#. Test code (e.g. Selenium-based tests)
    can use the WebDriver API to open a browser such as Chrome or Firefox, and then
    launch a web application (i.e. open a URL). The test code simulates user interactions
    with the application. Suitable assertions are inserted into the program to verify
    that the actual behaviour or output matches the expected behaviour/output. In
    this book, the Chrome WebDriver is used (of writing, it was the most up to date).
    For ease of use, it can be imported into an Eclipse/Java project. A minimal set
    of the Selenium WebDriver API, which are required to perform basic tests using
    the Chrome WebDriver.14 include the following:


    14 See https://sites.google.com/a/chromium.org/chromedriver/downloads.'
