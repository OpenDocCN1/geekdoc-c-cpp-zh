  md: '# 7 All Paths Coverage


    This chapter introduces all paths coverage testing, which is the strongest form
    of white-box testing based on the program structure.¹ All the paths, from entry
    to exit of a block of code (usually a method, the test item), are executed during
    testing.


    Developing all paths tests is complex and time-consuming. It is seldom used and
    would only be considered for critical software. However, as the strongest form
    of testing based on program structure, it is of theoretical importance, and is
    an important element in the body of knowledge for software testing.


    In statement and branch testing, control-flow graphs (CFGs) are seldom used in
    practice. Tests can be more efficiently developed to supplement black-box tests,
    as shown in the previous chapters, using automated tools to measure the coverage.
    However, in all paths testing, CFGs are essential. This chapter provides an understanding
    of how to develop and use them.


    # 7.1 Testing with All Paths Coverage


    A path is a sequence of the statements executed during a single run of a block
    of code. All paths coverage refers to execution of all the paths that start on
    the first statement and end on the last statement of the block of code, also referred
    to as an end-to-end path. The paths are usually identified at the source-code
    level.


    In order to identify these paths, a graph is produced and provides a simplified
    representation of the code. This is referred to as CFG. Once the CFG has been
    developed, then all the end-to-end paths are identified and test data developed
    to cause these paths to be executed. Identifying the paths directly from the source
    code takes experience, and is usually achievable for smaller sections of code.


    **Definition:** an end-to-end path is a single flow of execution from the start
    to the end of a section of code. This path may include multiple executions of
    any loops on the path.


    > ¹If all paths have been achieved, then coverage has also been achieved for all
    other forms, including statement and branch coverage. Both are discussed in previous
    chapters.'
