    tester may note down reasons for picking the typical values as comments in the
    test code. Additional tests will usually be written to cover potential data representation
    problems, especially for input data errors. Additional tests will also be developed
    based on the tester''s experience (see Section 1.7.3) in order to try to overcome
    some of the weaknesses in basic user story testing.


    The time spent on developing and executing tests is usually closely related to
    the value of the application. This is based on the risk of failure as discussed
    in Chapter 1. On an e-commerce website for a small company selling low-value items
    to a few customers, adding them to a shopping cart, checking out, and viewing
    the order status probably will not be tested. The basic user stories of listing
    the items, probably be tested manually with no formal documentation. At the other
    extreme, a website for a bank will probably have all the code unit tested. And
    there will probably be extensive automated application testing (including user
    story testing, and some of the other approaches discussed) to make sure that the
    bank’s customers are unlikely to have experience problems.'
