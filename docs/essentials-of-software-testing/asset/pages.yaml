    # Fault Models


    Exhaustive testing is not feasible, every test approach is a compromise, designed
    to find particular classes of faults. These are referred to as *fault models*.
    Each type of testing is designed around a particular fault model. The initial
    types shown in the book have simple fault models, and the later ones address progressively
    complex fault models. An understanding of the classes of faults *introduced* by
    the software developers into the code can lead to a more effective emphasis on
    those tests most likely to find the faults.


    # Using this Book


    This book is intended for an introductory audience and can be used for a number
    of undergraduate and postgraduate courses. It is also suitable as an introduction
    to testing for researchers and professionals. This book should be read in: later
    chapters make use of material presented earlier in the book.


    # Book Structure


    This book introduces the essential elements of software testing, providing the
    reader with the knowledge required to perform basic unit testing, *object-oriented
    testing*, and *system testing* in an automated test environment. Both the practice
    and the principles of systematic software testing are covered. Further reading
    for advanced techniques is provided in Section 14.3.'
