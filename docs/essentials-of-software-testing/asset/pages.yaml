  md: '# 14.4 Research Directions


    +   * QUEST Quality Engineered Software & Testing Conference

    * SoCRATEs International Conference for Software Craft and Testing

    * STAREAST and STARWEST Software Testing Analysis & Review Conference

    * STPCON Software Professionals Conference

    * VALID International Conference on Advances in System Testing and Validation
    Lifecycle


    # 14.4.2 Research Topics


    A number of indicative research fields, selected from the conferences listed,
    are outlined-below:


    +   * **Search-based software testing.** Random testing is often used to achieve
    white-box coverage criteria, such as code coverage. Research is directed at search-based
    techniques to achieve particular criteria.

    * **Mutation analysis.** The idea of mutation testing has mainly been applied
    at the source-code level. Recently, the idea has been applied to test different
    artefacts, including research into the notation used.

    * **Regression test reduction.** Running regression tests are often the most-consuming
    testing activity. When software is changed or extended, checking that the existing
    functionality works correctly is at least as important as checking that the new
    functionality works correctly. Research is directed at finding the optimal set
    of tests to re-run.

    * **Model-based testing.** Recent years have seen increasing interest in the use
    of models for software testing, for example UML. Research includes formal verification
    of model transformations into code, adding debug support for model-based testing,
    automatic test data generation based on the models.

    * **Automated software verification.** Formal specifications provide the basis
    for automating testing, either at runtime or statically. These usually take the
    form of assertions stating pre-conditions, post-conditions, and invariants that
    hold for the software to match its specification. Research has started to providing
    tools that do both static and dynamic evaluation of software against its specification.

    * **New technologies.** New software technologies and architectures require the
    application of test principles in new ways. Examples include research effective
    testing SOA (service oriented architecture), virtualisation, dynamic software
    systems, GUI (graphical user interface), cloud computing, and artificial intelligence.

    * **Software process and tools.** Testing is a key part of the software process,
    and tools are critical to its support. Research is active in the relationship
    between testing and the other process activities, the development of test-driven
    development processes, and the effectiveness of testing as a quality measure.
    Good examples of new directions include automated tools for testing Android applications
    and autonomous vehicles.'
