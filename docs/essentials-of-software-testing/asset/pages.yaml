    ![](img/6a3e28417c651af2c9c33c1aa588b582_28_0.png)


    For software products, in addition to checking that each individual step has been
    done correctly, it has been found in practice that a second form of checking is
    necessary: making sure that the implementation meets users’ needs. The first form
    is referred to as verification, the second as validation.


    # 1.3 The Role of Specifications


    A software specification identifies the precise and detailed behaviour that the
    software is required to do. It gives a model of what the software is supposed
    to do. These specifications play a key role in testing. In order to test, the
    correct behaviour of software must be known. This implies the need for detailed
    specifications (or software requirements(10)).


    To support testing of the code, specifications must describe both normal and error
    behaviour. Normal behaviour is the expected behaviour (or output) of the software
    when the inputs are not in error. Error behaviour is the expected results of the
    software when one or more inputs are in error, or will cause an error in processing.


    Attempts have been made to develop test approaches based on reasonable behaviour
    of software – often deduced from the method. This fails as not every developer
    and tester will have the same expectations of reasonable behaviour, especially
    for error cases. Some examples include the following:


    +   * If an input is provided, should the method ignore it, return an invalid
    value, raise an exception, or write to an error log?

    * If a temperature is calculated, should it be returned in degrees Celsius (°C),
    kelvin (K), or degrees Fahrenheit (°F)?


    10 Note the difference between software requirements and user requirements. Software
    requirements state what the software must do. User requirements state what the
    user wants to be able to do.'
