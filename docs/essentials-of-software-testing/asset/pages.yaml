  md: '# Pairwise Testing


    Large decision tables can be reduced by limiting the number of rules. Instead
    of including every combination of causes, we can instead include just the combinations
    for every pair of causes. The technique identifies every possible pair of combinations,
    and then combining these pairs into as few rules as possible.

    To demonstrate pairwise testing, we can reduce Table 4.24 into Table 4.28.


    Table 4.28 \u2013 Pairwise decision table for condInRange ()


    | | 1 | 2 | 3 | 4 | 5 |

    |---|---|---|---|---|---|n| | flag | T | T | T | F | F |

    | x < low | T | F | F | T | F |

    | x <= high | T | T | F | T | F |

    | Effects return value | F | T | F | F | F |


    +   All the possible pairs of causes are included at least once in the decision
    table:

    * flag and x < low – Rule 1

    * flag! (x < low) – Rule 2

    * !flag and x < low – Rule 4

    * !flag! (x < low) – Rule 5

    * flag and x >= high – Rule 1

    * flag! (x <= high) – Rule 3

    * !flag and x <= high – Rule 4

    * !flag! (x <= high) – Rule 5

    * x < low and x >= high – Rule 2

    * !(x < low) and ! (x <= high) – Rule 3


    Pairs of causes where (x < low) and (x <= high) are not possible and are therefore
    not included in the pairwise decision table (as they were not included in the
    all-combinations decision).

    The larger original table, the larger the potential reduction with this technique.
    For example, the 16 rules of Table 4.29 can be reduced to 6 rules, as shown in
    Table 4.30.

    Each row represents a cause. For each pair of causes, every possible combination
    of {T,T},{T,F},{F,T},{F,F} occurs at least once.\^8 For example:


    \^8 Software tools can help to automatically produce the required sets of pairs.'
