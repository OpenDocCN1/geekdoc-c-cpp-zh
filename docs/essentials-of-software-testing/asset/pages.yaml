    The test case specifications define the tests to be implemented.

    It is crucial that every test case for a particular test item has a unique identifier.²
    A particular test case may cover test coverage items derived using different techniques,
    so it is not useful to include the name as a prefix to the test identifiers. One
    possible approach, used in this book, is to number the tests for a test item in
