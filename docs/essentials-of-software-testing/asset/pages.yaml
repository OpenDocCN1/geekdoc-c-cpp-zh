  md: '# # 4 Decision Table Testing


    The techniques presented previously have not considered different combinations
    of input values that can lead to undetected faults in the code. This chapter introduces
    the black-box technique of decision table testing.


    # ## 4.1 Testing Combinations with Decision Tables


    There are a number of techniques for identifying combinations of inputs for testing
    software. Decision tables provide a systematic approach for identifying all possible
    combinations of inputs based on equivalence partitions. The chapter starts with
    a worked example and ends with a more detailed examination of the topic.


    > Definition: a decision table is a model of the functional requirements that
    maps combinations of input values (causes) to their matching output values (effects)
    through rules.


    # ## 4.2 Example


    Testing of the method OnlineSales.giveDiscount(bonusPoints, goldCustomer) continues
    in this chapter. To summarise the specification, the method returns:


    ```

    FULLPRICE if bonusPoints <= 120 and not a goldCustomer

    FULLPRICE if bonusPoints <= 80 and a goldCustomer

    DISCOUNT if bonusPoints > 120

    DISCOUNT if bonusPoints > 80 and a goldCustomer

    ERROR if any inputs are invalid (bonusPoints < 1)

    ```


    This specification forms the test basis.


    # ## 4.2.1 Analysis


    The first step in the analysis is to restate the specification in terms of causes
    and effects. These are Boolean expressions relating to possible values, or ranges
    of values, of the inputs and outputs associated with different'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# 4.2 Example


    These causes and effects are then used to generate a decision table that relates
    the causes (inputs) to the effects (outputs) through rules. This provides a systematic
    way of identifying all the combinations, which are the test coverage items (TCIs)
    for testing.


    This example only considers normal inputs and not error inputs. If different combinations
    of error inputs result in different outputs, then we use a separate table.


    # Causes


    Non-error causes can be derived from the input equivalence partitions, identified
    from the specification in Chapter 2, and shown in Table 4.1.


    Table 4.1 Input equivalence partitions for giveDiscount ().


    | Parameter | Equivalence partition |

    | --- | --- |

    | bonusPoints | (*) Long.MIN_VALUE..0 81..120 121..Long.MAX_VALUE |

    | goldCustomer | true false |


    The next step is to develop Boolean expressions that define the non-error causes.
    We develop these causes by working through the input parameters in order, and
    examining the partitions for each one from left to right (i.e. increasing values).
    This provides a systematic approach and limits mistakes.


    Non-error partitions for bonusPoints can be turned into the following causes¹:


    +   - The partition Long.MIN_VALUE..0 is an error partition, and is not used.
    The partition 1..80 is a normal partition, and can be identified by the Boolean
    expression bonusPoints ≤ 80 being true (as error values less than 1 are not being
    considered).

    - The partition 81..120 is also a normal partition, and can be identified by the
    previously derived expression bonusPoints ≤ 80 being false, and the expression
    bonusPoints ≤ 120 being true.

    - The partition 121..Long.MAX_VALUE is a normal partition, and can be identified
    by the previously derived expressions bonusPoints ≤ 80 being false and bonusPoints
    ≤ 120 being false.


    Having fewer causes is better as this reduces the size of the decision table.
    N partitions should lead to no more than log(N) expressions – for example, 10
    partitions could realistically be turned into three or four expressions. For the
    example above, a third expression bonusPoints > 120 is not required as the negation
    of bonusPoints ≤ 120 carries for this situation.


    > Refer to Chapter 2 for details of how the partitions are derived.'
  merge: -1
