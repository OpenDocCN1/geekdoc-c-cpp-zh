  md: '# Software Testing Activities


    Independent of the type of software testing being performed, there are a number
    of activities that need to be undertaken. This book uses the following seven-step
    approach$^{18}$:


    +   - **Analysis** – the specification and the software implementation are analysed
    to extract the information required for designing tests.

    - **Test coverage items** – these are the criteria that the tests are required
    to address (or cover), and are derived using the results of the analysis.

    - **Test cases** – these specify the data required to address the test coverage
    items.

    - **Test design verification** – the tests are reviewed to ensure that every coverage
    item has been included.

    - **Test implementation** – tests are usually implemented using automated test
    libraries, though in some cases a manual test procedure may be defined.

    - **Test execution** – the tests are executed: the code being tested is called,
    using the selected input data values, and it is checked that the results are correct.

    - **Test results** – the results are examined to determine whether any of the
    tests failed. In a formal test process, this may result in the production of incident
    reports.


    The worked examples throughout the book demonstrate the application of these activities.
    In practice, an experienced tester may define many of the steps mentally without
    documenting the results. Software in mission-critical or safety-critical systems
    requires a high level of quality, and the test processes for these would usually
    generate significant amounts of documentation. This documentation supports detailed
    reviews of the test activities as part of the overall software quality assurance
    process. In this book, all the results are fully documented as a learning guide.


    # Analysis


    All test designs require form of analysis to be undertaken. This may either be
    analysis of the source code, or analysis of the specification – including both
    the user requirements and the software specifications. These sources of test information
    are referred to as the test basis, and are used to determine test coverage items.
    In practice, the analysis results may not be fully documented, if at all – but
    there is value in doing so, as it allows the test coverage items to be reviewed
    more accurately for completeness.


    > $^{18}$ Many software processes may define their own specific set of activities.'
