  md: "# 6.4.3 Goal\n\nThe goal of branch coverage is to make sure that every branch\
    \ in the source code has been taken during testing. The ideal test completion\
    \ criteria is 100% branch coverage.\n\nNote that a branch is based on the evaluation\
    \ of a Boolean expression, which can evaluate to true or false. A decision may\
    \ be simple or compound. A decision contains a single Boolean expression, or Boolean\
    \ condition, with no Boolean operators. A compound decision contains multiple\
    \ Boolean conditions connected by Boolean operators. An example of each is shown\
    \ in Snippet 6.1.\n\nSnippet 6.1 Decisions and Boolean conditions\n\n```\nint\
    \ f(int x, boolean special) {\n  int z = x;\n  if (x < 0) {\n    z = -1;\n  }\
    \ else if (x > 100 || (x > 50 && special) ) {\n    z = 100;\n  }\n  return z;\n\
    }\n```\n\nLine 3 contains a single decision, with a single Boolean condition:\n\
    \n+   - (x< 0)\n\nThere are two associated branches:\n\n+   - from line 3 to 4\
    \ when x is less than 0;\n- from line 3 to 5 when x is not less than 0.\n\nLine\
    \ 5 contains a compound decision, with three Boolean conditions:\n\n+   - x >\
    \ 100\n- x > 50\n- special\n\nThere are six associated branches:\n\n+   - the\
    \ true outcome of (x > 100): branch from line 5 to 6 (short-circuit evaluation);\n\
    - the false outcome of (x > 100): branch to the next Boolean decision (x > 50);\n\
    - the true outcome of (x > 50): branch to the next Boolean decision (special);\n\
    - the false outcome of (x > 50): branch from line 5 to line 7 (short-circuit evaluation);\n\
    \n> 5 Short-circuit or lazy evaluation occurs when the evaluation of one Boolean\
    \ condition means that subsequent Boolean conditions do not need to be evaluated\
    \ — the result can be short-circuited."
