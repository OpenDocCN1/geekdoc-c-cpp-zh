    The causes and effects form test the conditions.


    # Feasible Combinations of Causes


    In order build the decision table, all the combinations of causes must be identified.
    Often, the combinations of the causes are not logically possible. In this example,
    it is not possible for bonusPoints ≤ 80 to be true and bonusPoints ≤ 120 to be
    false at the same time.


    You can build the table in many ways, but our advice is to identify all possible
    combinations of causes through an intermediate table. Here, all combinations can
    be listed; all those that infeasible can then be removed. All remaining combinations
    can be moved to a final table. With enough practise, the need for such an intermediary
    step will eventually fade.


    Start with an empty table and list all the cases in the first column. It helps
    to order the causes based on the variables they address, for the two cases about
    bonusPoints are next to each other. Next, create 2^N columns for the combinations,
    where there are N cases. In our example, we have three cases, and therefore create
    space for eight combinations (see Table 4.3). It is good practice to document
    the error condition in the table title– here it is bonusPoints > 0 as a reminder
    that error cases are excluded.


    Table 4.3 Empty combinations table, bonusPoints > 0.


    | Causes | Combinations |

    |---|---|

    | bonusPoints ≤ 80 | |

    | bonusPoints ≤ 120 | |

    | goldCustomer | |


    > The alternative syntax getDiscount() == FULLPRICE can also be used.'
