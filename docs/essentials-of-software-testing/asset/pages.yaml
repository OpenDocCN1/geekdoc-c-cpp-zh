    # Static and Dynamic Testing


    The previous examples have all used dynamic testing, where the code has been first
    executed and then the output verified. An alternative approach is static verification
    (also known as static analysis or static testing), where the code is verified
    without executing it.


    There are two approaches to static verification: review-based techniques and reviewing
    programs mathematically. Both of these may be manual, semi-automated, or fully
    automated.


    # Review-Based Techniques


    Code may be reviewed with different levels of formality. The least formal is pair
    programming, where two programmers work in tandem, with one writing the code while
    the other continuously reviews their work. This has been shown to be very effective,
    and is a core element of modern software engineering processes (e.g. Agile). The
    most formal is a code review or a walkthrough, where a review team is presented
    with the specifications (product requirements, design documents, software requirements,
    etc.) and the code in advance. This is followed up by a formal meeting at which
    a code walkthrough is performed, checking that the code meets its requirements.
    Typically a code checklist is used and a formal report produced


