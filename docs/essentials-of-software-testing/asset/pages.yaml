  md: '# Introduction to Software Testing


    # 1.14.5 Level of Detail


    This book focuses on the principles of software functional testing and how to
    apply them in practice. Some topics (e.g. object-oriented testing, system testing)
    are not covered in as much detail as other topics due to their extensive scope.
    Non-functional testing techniques, such as performance testing (e.g. load testing,
    stress testing, stability), are not covered in any detail in this book.


    # 1.14.6 Examples


    A number of examples are presented, both of software to be tested and used of
    automated tests. These examples are intended to show how testing principles are,
    and should not be taken as an example of good coding practice. In many cases comments
    and Javadoc specifications have been omitted in the interests of space.


    # 1.14.7 Software Test Tools


    The key goal of the book is that the reader should understand the principles of
    software testing, and be to apply them in practice. The software test tools used
    in this book have been selected as the most popular or up-to-date examples of
    each, and they may not been selected as the best examples for demonstrating test
    automation. They may or not be the best tools to use in particular real-world
    testing situations. This book does not endorse or recommend any particular tool.
    Only an essential subset of the tool features are covered in this book: the reader
    should refer to the tool-specific documentation for more details.


    # 1.15 Notes on Terminology


    There is little consistent use of the terms associated with software testing.
    The reader will find many books, research papers, test automation documentation,
    and web pages that use different or even conflicting terms. This book is consistent
    with the terminology used in the ISO International Standard 29119.23 In particular,
    in this book the terms test coverage item, test case, and test implementation
    are used to distinguish between the test goals, the data needed to achieve those
    goals, and the code which implements the test, respectively.'
