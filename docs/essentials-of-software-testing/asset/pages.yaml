  md: '# Introduction to Software Testing


    Verifying each of these leads to different levels of testing:


    **Unit testing** An individual unit of software is tested to make sure it works
    correctly. This unit may be a single component or a compound component formed
    from multiple individual components. For example, a component might be a function
    or method, a class, or a subsystem. The unit may also be a single graphical user
    interface (GUI) component (such as a button), or a collection of them (e.g. a
    window). Unit testing almost invariably makes the programming interface of the
    unit. Test data is selected to ensure that the unit satisfies its specification.


    **Regression testing** When a new unit has been added, the tests for the previous
    version of the software are executed to ensure that nothing has been broken. This
    may be done for individual units, a subsystem, or for the full system testing.


    **Integration testing** Two or more units (or subsystems) are tested to make sure
    they interoperate correctly. The testing may make use of the programming interface
    (typically for components), or the system interface (for subsystems). Test data
    is selected to exercise the interactions between the integrated units.


    **Subsystem testing** Where a large system is constructed from multiple subsystems,
    each subsystem may be tested individually to make sure it works correctly. The
    testing uses the subsystem interface: this may be a GUI for an application, web
    interface for a web-server, network interface for a network server, etc. Test
    data is selected to ensure the subsystem satisfies its specification.


    **System testing** The entire software system is tested as a whole to make sure
    it works correctly.¹⁷ The testing uses the system interface: this may be a GUI
    for an application, web interface for a web-server, network interface for a network
    server, etc. Test data is selected to ensure the system satisfies the specification.
    Desktop, mobile, and web-based application testing are all forms of system testing
    that are tested via the user interface.


    **Acceptance testing** The entire software system is tested as a whole to make
    sure it meets users'' or solves users'' problems, or passes a set of tests developed
    by users. This is frequently used before payment when software is developed under
    contract.


    Each of these test activities can use black-box or white-box techniques to develop
    tests; white-box techniques are seldom except except unit testing.


    The focus of this book is on dynamic software verification, with a particular
    emphasis on the essential test design techniques for unit testing (including object-oriented
    testing) and application testing. Recommendations for further reading are provided
    in Chapter 14.


    > ¹⁷ A simple form of system testing is called smoke testing, coming from hardware
    development where the first step in testing is to turn it on and see if it produces
    any smoke.'
