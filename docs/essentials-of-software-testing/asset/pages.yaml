  md: '# 8.2 Black-Box Testing: Additional Matters


    The best way to handle discontinuous ranges for input parameters is to separate
    out the contiguous ranges of values. So, in this example, x should be treated
    as having the three equivalence partitions:


    +   - x.EP 1 Integer.MIN_VALUE..1

    - x.EP 2 0

    - x.EP 3 1..Integer.MAX_VALUE


    and the associated boundary values:


    +   - x.BVA 1 Integer.MIN_VALUE

    - x.BVA 2 -1

    - x.BVA 3 0

    - x.BVA 4 1

    - x.BVA 5 Integer.MAX_VALUE


    The reason behind this is that the values -1 and +1 are special: they are immediate
    predecessors and successors to the value 0, which is treated differently. The
    software must correctly identify these as boundary values. They are values that
    are likely to be associated with faults in the software.


    # 8.2.3 Overlapping Partitions


    Consider an example with overlapping ranges for the return value. The method int(int
    x, boolean fixed) calculates the tax payable on an amount specified by the parameter
    x. The tax may be a fixed amount with a variable amount at 1% (or x/100). The
    return value is one of the following:


    +   - 1 indicating an error, if amount < 0;

    - 56, if fixed is true (fixed tax); and

    - x/100, which is 1% of the amount if fixed is false (variable tax).


    Considering the non-error case, the variable tax can therefore have a value from
    0 to Integer.MAX_VALUE/100, and the fixed tax can only have a single value, 56.
    This gives the return value two partitions with overlapping values:


    +   - 1. A partition containing all the values from 0 to Integer.MAX_VALUE/100.

    - 2. The value 56, which is in a single-valued partition of its.


    The values for these partitions are shown in Figure 8.5. The overlap is indicated
    by the dashed lines in Partition 1.


    There is a third partition not shown in the figure, with the single value -1.
    The values from Integer.MIN_VALUE to -2, and above Integer.MAX_VALUE/100, are
    not possible return values so need not be considered – there are no inputs that
    should cause any of these values to be returned.'
