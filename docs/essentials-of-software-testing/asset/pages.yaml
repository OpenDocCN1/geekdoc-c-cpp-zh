    # 10.7 Key Differences between Unit Testing and Application Testing


    As this chapter demonstrates, application testing is a far more complex activity
    than unit testing. Essentially, the user interface interfaces an additional translation
    layer between the user and the code, and the complexities are associated with
    manipulating this correctly to simulate the actions of a user. The key differences
    in testing are follows:'
