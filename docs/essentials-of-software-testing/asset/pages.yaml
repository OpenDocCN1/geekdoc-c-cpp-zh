  md: "# Test Automation\n\n- Line 26 (yellow) shows a popup with the text:\n| 1 of\
    \ 2 branches missed |\n\nThe coverage results are also summarised in the coverage\
    \ summary report, as shown in Figure 11.9.\n\n![](img/6a3e28417c651af2c9c33c1aa588b582_263_0.png)\n\
    \nFigure 11.9 Example JaCoCo coverage results.\n\nThe keys figured here are the\
    \ missed instructions and branches for the method being tested: giveDiscount().\
    \ This shows that 5 out of 2 executable instances have not been executed, and\
    \ 1 of the branches has not been taken.\n\nNote that there are two completely\
    \ different issues: one is whether the tests have passed or not, and the second\
    \ is full coverage has been achieved.\n\n# Lazy Evaluation\n\nInterpreting the\
    \ statement code results when a line of source code is only partially executed\
    \ require some thought. An optimisation feature called lazy evaluation may cause\
    \ only one of the Boolean in a certain decision to be executed.\n\nIn Java, the\
