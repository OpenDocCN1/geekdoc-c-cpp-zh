    # 7.4 All Paths Coverage Testing in More Detail


    # 7.4.1 Fault Model


    The all paths fault model is where a particular sequence of operations, reflected
    by a particular path through the code, does not produce the correct result. The
    faults are often associated with complex or deeply nested code structures, where
    the wrong functionality is executed for a specific situation.


    By testing every end-to-end path at least once, all paths testing attempts to
    find these faults.


    # 7.4.2 Description


    All paths testing causes every possible path from entry to exit of the program
    to be taken during test execution. By inspection of the code, input data is selected
    to cause execution of every path. Expected results are derived from the specification.


    # 7.4.3 Analysis: Developing Control-Flow Graphs


    A CFG is a directed graph, used to model a block of code. The nodes represent
    lines of code, and the edges represent branches between these lines. They are
    an essential tool in identifying end-to-end paths in a block of code. They display
    the fundamental structure of the code, allowing paths to be identified independently
    from the details within the code.


    Control-flow graphs for the basic programming constructs of sequences, selection
    (if), selection (if-then-else), and iteration (while and do-while) are shown in
    Figure 7.11–7.17.⁴


    # Sequence


    In Figure 7.11 the code in lines 1–7 is always executed as a sequence, as there
    are no branches, this choice of code is represented as a single node. The node
    is referenced by its identifier (1.7).


    There is no standard convention for including braces ‘{ and ’} and non-executable
    source code notation, not to be consistent. The benefit of including the braces
    is that it is much easier to review CFGs and that no lines have left out.


    > ³ This might be achieved by tracing the execution of the method giveDiscount()
    using the debugger. Most textbooks recommend numbering the nodes sequentially
    and placing the line numbers outside the node. This makes using the CFGs more
    difficult, requiring frequent references between different diagrams. In this book,
    we use the line number(s) as the node identifier.'
