    Figure 11.1 Test results for DemoTest.


    The standard output from TestNG includes the following:


    +   * The test result for each method run.

    * The result for each set of tests run together – in this book we are using the
    command line to run the tests, and TestNG reports these under Command line test.
    Here we show the number of tests that were run, and the number of tests that failed,
    and the number of tests that were skipped.

    * A summary of the entire test suite – multiple sets of tests are collected into
    a suite, as we will see later in the chapter. As the tests are run from the command
    suite, the default suite name is Command line suite. Previously in the book, for
    simplicity, only these test suite results have been shown.


    Elsewhere in the book, only the entire test suite results are shown. TestNG supports
    a number of assertion methods – the most commonly used are assertEquals(), assertTrue(),
    and assertFalse().nIf the assertion passes, then execution continues to the next
    line in the method. If the assertion fails, then the test terminates with an exception,
    causing the test to fail. This is why it is not a good idea to have multiple tests
    in a single test method: if one fails, the subsequent tests are not run. This
    does not apply to parametrised tests – see Section 11.5.


    The methods are identified by a TestNG Runner, which uses Java Reflection to find
    all the methods in the class with the @Test annotation, and then them in turn,
    trapping exceptions and keeping counters for the number of tests run, tests passed,
    and tests failed. TestNG comes with a default command-line runner, but TestNG
    tests can also run within an IDE such as Eclipse. TestNG test execution can also
    be managed using an XML file, which is passed to the test runner – see Section
    11.3.1.


