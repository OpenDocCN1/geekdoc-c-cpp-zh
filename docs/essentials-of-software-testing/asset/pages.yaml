    - Raise the event (call a function or method) that should cause the transition.

    - Check that the software is now in the expected state for the test.

    - Check that any required actions have occurred.


    State-based testing applies to all software that maintains state between calls.
    This is particularly important for object-oriented software, where all the attributes
    represent states (see Chapter 9).


    # 8.2.8 Floating Point Numbers


    All the examples here are based on integer numbers: floating point is significantly
    more difficult to handle. Floating point in Java (and most languages) uses the
    IEEE 754 representation – this is also supported by most modern hardware. Unlike
    integers, there is a sign bit, and also the values do not wrap around. Floating
    point is best regarded as an approximation: if a small value is added to a large
    value it may have no impact, and the difference between two large values may be
    returned as 0.0 even if they are not equal. Many fractions and decimals (such
    as 1/3 or 0.1) cannot be represented exactly in floating point. For example, the
    Java system `System.out.printf("%19.17f",0.1f")` produces the output 0.1000000014901612
    when executed, not 0.10000000000000000 you might expect!


    The following lists a few problems that the software tester may experience with
    floating point, and suggests remedies for these.


    +   - Comparing to a constant. A returned floating point return value with a constant
    floating point value is likely to fail. Instead it needs to be compared to a range
    of values, representing the minimum and maximum allowable values. For example,
    if the answer must be correct to six decimal places, then allowable limits would
    be the expected value ±0.0000005. If the software is'
