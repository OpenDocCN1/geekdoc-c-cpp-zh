  md: '# Black-Box and White-Box Testing


    +   - White-box testing provides coverage of the implementation, but not of the
    specification. That is, there may be behaviour stated in the specification for
    which there is no code in the implementation.


    It is for reasons that black-box testing is done first, to make sure the code
    is complete. This is then augmented by white-box testing, to make sure the code
    does not add anything extra.


    # 8.1.4 Usage


    Black-box and white-box testing techniques are generally used in succession to
    mimic coverage. The degree of coverage is usually based on the quality requirements
    of the test item. For example, software that decides whether to sound an alarm
    for a hospital patient will have higher quality requirements than software that
    recommends movies to watch. Based on these quality requirements, the tester can
    decide whether to stop testing early, as Section 1.8.


    Black-box testing is used initially to verify that the software satisfies the
    specification:


    +   - Use equivalence partitions to verify the basic operation of the software
    by ensuring that one representative of each partition is executed (see Chapter
    2).


    +   - If the specification contains boundary values, BVA to verify correct operation
    at the edges (see Chapter 3).


    +   - If the specification states different processing for different combinations
    of inputs, decision tables to verify correct behaviour for each combination (see
    Chapter 4).


    These black-box test techniques can be further enhanced:


    +   - If the specification states state-based behaviour, or different behaviour
    for sequences of inputs, then use state-based/sequential testing to verify this
    behaviour (see Section 8.2.7 in this chapter).


    +   - If there are reasons to suspect that faults are in the code, perhaps based
    on past experience, use error guessing/expert opinion to expose them (see Section
    14.3.3).


    +   - If the typical usage of the software is known, or to have a large number
    of tests, use random test data to verify the correct operation under these usage
    patterns (see Chapter 12).


    We measure the statement and branch coverage for each of these black-box tests.
    If the required coverage has not been achieved, we can add white-box techniques
    to further enhance the quality of the testing:


    +   - Use statement coverage to ensure that 100% of the statements have been executed.
    Investigate the uncovered statements and identify test coverage items (TCIs) and
    test cases specifically for these (see Chapter 5).'
