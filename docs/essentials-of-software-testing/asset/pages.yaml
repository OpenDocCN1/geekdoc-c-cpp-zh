  md: '# 8.1 Comparison of Black-Box and White-Box Testing


    # 8.1.3 Errors of Omission and Commission


    Both black-box and white-box testing approaches have weaknesses:


    +   * White-box testing does not typically find faults relating to missing functionality
    (referred to as errors of omission); there is no implementation for these as a
    basis to develop tests.

    * Black-box testing does not typically find faults relating to extra functionality
    (referred to as errors of commission); there is no specification for these as
    a basis from which to develop tests.


    Consider the example boolean isZero(int x), that should return true if x is zero
    and false otherwise. Example source code is given in Snippet 8.1.


    # Snippet 8.1 Errors of omission and commission


    ```

    1 public static boolean isZero(int x)

    2 {

    3     if ((x + 1) / 15 > 56) return true;

    4     return false;

    5 }

    ```


    This snippet contains two errors:


    +   * Error of omission: there is no functionality in the code to return true
    when x is equal to 0. This is required by the specification.

    * Error of commission: there is extra functionality in the code, line 3, which
    returns true when the expression (x + 1)/15 > 56 evaluates to true. This is not
    in the specification.


    This is a simple example, and it is easy to see that the code is not correct with
    respect to the specification. In longer or more complex code, it is generally
    much difficult to identify these faults. In this case, what appears to be a single
    mistake by the developer has led to types of error: changing the decision in line
    3 (x=0) would fix faults. Errors of omission lead to matching errors of commission,
    and vice-versa.


    Error handling is often a source of omission faults in complex code, where incorrect
    input data is not identified correctly. Understanding the specification is often
    a source of faults of commission, where extra input conditions are identified
    by the programmer that were not in the specification.


    Another way of looking at this is the coverage viewpoint:


    +   * Black-box testing provides for coverage of the specification, but not full
    coverage of the implementation. That is, there may be code in the implementation
    that incorrectly produces results not stated in the specification.'
