  md: '# 10.4 Application Testing in More Detail 215


    Writing a test program to interact automatically with this application is complex:


    +   - Interacting based purely on the absolute (x,y) location of each element
    on the screen can prove problematic. This fails if the layout changes, which is
    a particular problem for responsive interface design.¹10

    - Using the prompt convention, can also prove problematic. The prompt is usually
    located by various conventions – for example, the prompt for a dial may be within
    the element, the prompt for a text box may be to the left of or above the textbox,
    or even in the textbox in a grey font. It may also prove difficult to locate non-text
    elements by prompt – for example, a warning message may pop upon an icon, such
    as a warning flag.


    These user interface elements may be easy for a user to locate and interpret,
    based on prompts, convention, or just experience. But locating and interpreting
    the data representation, provide significant challenges for test automation. Unless
    there is detailed documentation available, specifying the interface in detail,
    this requires further investigation before black-box techniques can be used to
    select test data.


    An application may use a wide range of on-screen elements (pull-down menu, popups
    menus, sliders, drag-and-drop, keypad gestures, etc.), and even off-screen interfaces
    such as audio, visual, and haptic interfaces; these are significantly harder to
    test!


    # Interacting with HTML Elements


    The tester must find a way to locate these elements, and for a web application
    this is best (if they are well designed) by using the HTML title for each page,
    and the HTML id for each element. If these are not available, it is a more challenging
    issue: elements may be identified by their contents (e.g. the text on a button),
    or in the worst case by their relative or absolute location on the page (or more
    accurately, in the currently loaded object model).


    The Selenium library is representative of other web automation tools in that it
    provides a number of methods to find HTML elements and interact with them.


    +   1. A By is used to represent search criteria. HTML elements may be identified
    by a number of characteristics: id, className, css selector, anchor link text,
    anchor partial link text, name, tag or xpath.¹¹¹


    > ¹⁰ Responsive interfaces will dynamically after the screen layout to suit the
    size and orientation of a screen. For example, as a mobile phone is rotated, the
    position of the screen elements may be modified to suit the new orientation. Sophisticated
    views may also affect the contents of the screen, for example removing large logos
    or summarising text and prompts when displayed on a small screen.


    > ¹¹ ByXPath() is very useful where HTML id''s are not defined, elements can be
    found by their content. However, its use is far straightforward. Refer to the
    Selenium documentation at www.selenium.io/doc/org/seleniumhq.html/selenium-api/2.50.1/org/openqa/selenium/By.html
    for details.'
