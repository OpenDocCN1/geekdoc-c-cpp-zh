  md: '# 12.5 Random Testing in More Detail


    # The Test Oracle Problem


    Once random data has been automatically selected, and the software executed with
    this data, the problem is to verify that the output from the software is correct.
    For unit tests, this may be the return value. When testing object-oriented (OO)
    software, this may also include output attributes. For application testing, this
    includes all the output from the software, which may be delivered to the screen,
    to databases, to files, as inputs to another system, etc. There are four fundamental
    approaches to handling the oracle problem:


    +   * Ignore the issue by only requiring that the test completes without crashing
    the software being tested – this is referred as stability testing. The test oracle
    becomes a generic software utility to verify that the software keeps running after
    any test unit. In principle, this can be applied to any types of testing, For
    unit or OO testing, this would imply checking that no unexpected exceptions are
    raised – which may not always be to determine.


    +   * Write a program in a higher-level, more abstract language to specify the
    software requirements, and use that to generate the expected results. This can
    also be described as an executable specification. In a higher-level language the
    requirements can be stated as what is to happen rather than how it is to be achieved,
    and will be slow. A similar solution is to use a second programmer implementing
    the algorithm separately and use that code as a test oracle.


    +   * Use constraints in a logic-based specification language (such as Object
    Constraint Language (OCL)), which is part of UML). Instead of calculating the
    expected results, this approach verifies the actual result against the specification.
    This technique, however, requires a formal specification for each method implemented
    in unit testing, or a formal specification of the correct result. It also requires
    software tools to provide the automated verification. The software industry has
    not placed emphasis on this, resulting in a lack of skills and a lack of tools.
    Examples of research-based solutions are the specification language Java Markup
    Language (JML) and the OpenAPI toolset for Runtime Assertion Checking (RAC).


    +   * Use one of the manual test design techniques in order to develop criteria
    instead of values, as shown in the worked examples in this chapter. Any of the
    equivalence partition, BVA, decision tables, statement coverage, and branch coverage
    techniques can be used. Random values can then be selected to match the criteria
    at runtime.


    3 See www.openjml.org.

    4 Alternatively, a decision tree can be built, selecting the output first, and
