    # Extracting Information from the Trial Runs


    The page titles can be seen in the web browser; they are usually displayed in
    the tab name and can be read easily from screen.


    A well-designed web page uses unique HTML id to identify each element. These trial
    runs allow the tester to discover the ids required to interact with the input
    and output elements on each page. Without these, automated testing is much more
    difficult.


    > In a test driven design (TDD) environment, tests may be developed as soon as
    the screen layout has been designed, using ids selected by the graphical user
    interface (GUI) designer or the tester. The code would use these ids in order
    to pass the tests.'
