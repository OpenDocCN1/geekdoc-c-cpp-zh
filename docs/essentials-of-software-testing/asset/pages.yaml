  md: '# #2 Equivalence Partitions


    This chapter introduces the simplest black-box testing technique of equivalence
    partitions (often referred to as EPs), using a worked unit test example. The tests
    are developed the steps identified previously: analysis, test coverage items (TCIs),
    test cases, test design verification, test implementation, test execution, and
    examination of test results.


    # ##2.1 Testing with Equivalence Partitions


    The goal of this technique is to verify that the software works correctly by using
    at least one representative input value for each different type of processing.
    This technique should also ensure that at least one representative output value
    for each different type of processing is produced. To identify these values, equivalence
    partitions are used. The chapter starts with a fully worked example and concludes
    with a more detailed examination of the topic.


    > **Definition:** an equivalence partition is a range of discrete values for an
    input or output for which the specification states equivalent processing.


    # ##2.2 Example


    The program check as described in Section 1.4 uses a class OnlineSales to implement
    its core functionality. This class contains a static method giveDiscount(), which
    is defined below. Test techniques will be introduced using static methods that
    do not require an object to be instantiated through a constructor. Once the basic
    techniques have been described, the chapter on testing object-oriented software
    (Chapter 9) examines using these techniques to test test instance methods.


    1 Javadoc is used for specifications in this book.'
