    # 9.4.12 UML-Based Testing


    The UML (Unified Modelling Language) is the main analysis and design tool for
    OO software. There are a large number of diagrams in UML 2.5. Each of these is
    a potential source of information and test coverage items for the tester. Method
    testing in class context and inheritance testing make use of the class diagrams.
    State-based testing makes use of the state machine diagrams, but all of the other
    diagrams can also be used to generate tests.


    Each item on diagram has a meaning, and therefore represents a testable property
    of the software system. For example, the relationships between classes and any
    associated multiplicities are useful sources of tests in the class diagram, and
    the interaction between classes and methods are useful sources of tests in the
    sequence diagram, activity diagram, and interaction diagram.


    # 9.4.13 Built-In Testing


    Encapsulation can make testing difficult, especially when trying to access the
    class attributes in order to verify the actual results match the expected results.
    There are a number of solutions to this, such as using Java reflection to access
    private attributes at runtime. Another solution, which is available in many languages,
    is the use of assertions for built-in testing or BIT. The assertions are referred
    to as built-in because they are built into the code, rather than located in an
    external test class.


    This can be very effective for ensuring that assertions that the programmer has
    made in fact are required in the code. They can also be effective in verifying
    that class invariants are maintained by every method, by asserting them at the
    end of every method. In Java, assertions can be turned on at runtime, so during
    testing they are enabled, and in deployment they are disabled.


    However, they are less effective in replacing the unit tests, as they need to
    refer not only the current value of the method variables (attributes, parameters,
    and local variables) but also the original values when the method started execution.
    Having the code kept for these tests can be very inefficient in terms of memory
    space and execution time. It also increases the effort to code each method, and
    increases the chances of making a mistake.


    An example of BIT is shown in Listing 9.4, where an extra acceptedSpace has been
    added to the class.


    16 There are both official and unofficial diagrams – www.uml-diagrams for details.


