    # Test Coverage Items


    Each path from start to finish is a TCI. Remember that the standard technique
    for each loop to be in two paths: one with zero times through the loop, and one
    with at least one through the loop.

    Each TCI should be given a unique identifier (for example: AP1 for path 1). It
    is useful, in order to ensure that no paths are missed, to list the edges in the
    CFG covered by each path.


    # Test Cases


    Data values are selected to ensure that every path is followed. This selection
    requires the tester to review the code carefully, and select input parameter values
    that cause these paths to be executed.

    The expected results must come from the specification. It is very easy to make
    the mistake of reading the output from the code and using this as the expected
    results - the tester must be careful to avoiding this.

    Hint: it is usually easier to begin with the simplest path from entry to exit,
    and by reading the source code work out the required input values required to
    cause it to be executed. Examine the source code and see what changes to the inputs
    are required to cause similar paths to be executed. There should one test per
    path.


    # Evaluation


    Achieving full paths coverage can be a very tedious exercice. Note that even every
    path has been executed, every reason for taking every decision has not.


    # Limitations


    The source code shown in Listing 7.4 contains three types of fault not found (except
    by chance) by the standard black-box and white-box unit test techniques. The basic
    algorithm is quite different to that used previously: it uses a lookup table,
    and searches for a matching entry to determine the return value.'
