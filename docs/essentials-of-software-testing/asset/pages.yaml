  md: '# Testing in the Software Process


    ![](img/6a3e28417c651af2c9c33c1aa588b582_305_0.png)


    Figure 1.3 Testing in the Scrum process.


    The diagram starts with the product backlog, which is a prioritised list of all
    the required product features. Scrum teams take on much of the product backlog
    as they think they can turn into an increment of product functionality within
    a 30-day iteration or sprint, forming the sprint backlog. A sprint consists of
    the pre-testing, testing, and post-testing activities for each selected feature
    in the sprint backlog. The testing approach depends on the team, and is not strictly
    prescribed as in XP, but will usually consist of unit testing, regression testing,
