  md: '# Evaluation


    Boundary value analysis enhances the testing provided by equivalence partitions.
    Experience indicates that this is likely to find significantly more errors than
    equivalence partitions.

    Boundary value analysis tests two additional values from every input and output
    partition, the minimum and maximum. These tests provide some basic assurance that
    the correct decisions are made in the code. Boundary value analysis provides exactly
    the same TCIs as equivalence partitions for Boolean and for enumerated parameters.

    Snippet 3.1 shows a simple example of a boundary value fault. Line 3 contains
    a fault in the statement. Instead of the expression (!(x <= 100), which is what
    the developer intended, the expression (!(x < 100)) has been used.


    # Snippet 3.1 Fault in boundary value handling


    ```

    1 // Return true if x is greater than 100

    2 public void greater(int x) {

    3 if (!(x < 100)) return true;

    4 else return false;

    5 }

    ```


    Boundary value analysis does not explore the decisions in detail, and in particular
    it does not explore decisions associated with different combinations of inputs.
    Combinations of inputs will be addressed in the next chapter.


    # Limitations


    The software has passed all the equivalence partition and BVA tests – so is it
    correct? As discussed earlier, only exhaustive testing can answer this question,
    and faults may remain.

    We will now explore the limitations of BVA testing by deliberately injecting faults
    into the source code.


    # BVA Testing against Fault 2


    The results of running the equivalence partition and BVA tests against the code
    with Fault 2 are shown in Figure 3.5.

    The fault is found by one of the BVA tests. This is expected as the fault was
    inserted at the processing of a boundary value. All the tests are run, even though
    one of them has failed.


