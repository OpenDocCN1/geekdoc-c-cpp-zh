    failure causes a loss of function and data and there is no workaround. |

    | 2 | Failure causes a loss of function or data but there is a manual workaround
    to temporarily accomplish the tasks. |

    | 3 | Failure causes a partial loss of function or data where the user can accomplish
    most of the tasks with a small amount of workaround. |

    | 4 (least severe) | Failure causes cosmetic and minor inconveniences where all
    the user tasks can still be accomplished. |


