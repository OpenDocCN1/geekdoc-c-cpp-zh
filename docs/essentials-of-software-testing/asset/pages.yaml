  md: 'If black-box testing does not result in the required coverage – normally 100%
    – then this white-box technique can be used to increase the coverage to the required
    level.


    # 6.6 Key Points


    +   - Branch coverage is used to augment black-box and statement coverage testing,
    by ensuring every branch is taken.

    - Test cases are based on untaken branches.

    - Input values for the test data are selected by analysis of the decisions/Boolean
    conditions in the code.


    # 6.7 Notes for Experienced Testers


    The experienced tester will use the type of branch coverage as measured by the
    tools they use (at the decision level or at the Boolean condition level). Analysis
    of the code to determine the values needed to cause each branch to execute will
    usually be done in the tester’s mind. Perhaps a comment will also be added to
    the test code to identify branches that cannot be taken. As discussed previously,
    if an audit trail is not maintained by the tester, then the design process cannot
    be easily reviewed.


    In advanced testing, exception coverage can be regarded as a form of branch coverage.
    Each exception raised and caught is regarded as a branch.


    As with white-box testing, tests that achieve full branch coverage will often
    become outdated by changes to the code. The experienced tester may, leave these
    tests in the code as extra tests.


    Developing tests to achieve full branch coverage is practically impossible in
    code of any significant size. The experienced tester will focus these tests just
    on the critical code.'
