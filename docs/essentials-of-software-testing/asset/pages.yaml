    # 1.5 The Theory of Software Testing


    A test consists of executing the software under test with the selected input values,
    gathering the output values, and verifying that these output values are correct
    (i.e. as specified).

    The goal of developing a theory of software testing is to be able to identify
    the ideas tests—that is the minimum set of test data to ensure that software works
    correctly for all inputs. The fundamental result in this area¹³ can be summarised
    as follows:


    +   - For a test to be successful, all test data within the test set must produce
    the results as defined by the specification.

    - The test selection criterion is reliable if it consistently produces test sets
    that are successful, or it consistently produces test sets that are not successful.

    - If a set of test data is chosen using a criterion is reliable and valid, then
    the successful execution of that data implies that the program will produce correct
    results over its entire input domain.

    - Leading to the result: the only criterion that can be guaranteed to be reliable
    and valid is one that selects each and every value in the program domain (i.e.
    exhaustively tests the program).


    # 1.6 Exhaustive Testing


    Based on this theory result, the most obvious form of testing is to test for every
    possible input and output. This is referred to as exhaustive testing, and is explored
    next.


