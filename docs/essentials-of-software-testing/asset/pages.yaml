  md: '# 4.2 Example


    +   - The partition FULLPRICE is a normal partition, and can be identified by
    the expression return value == FULLPRICE² being true.

    - The partition DISCOUNT is a normal partition, and can be identified by the expression
    return value == DISCOUNT being true.

    - The partition ERROR is an error partition, and can be discounted.


    For output enum valid it is clearer to identify explicitly, as shown here. It
