  \n\n\n\n| A B C(字母) | 1 2 3(数字) | ! # ?(符号) |\n\n编辑（Edit）意味着更改已写的内容。文本编辑器是你用来编写和编辑文本的程序。它也可以用来编写代码！\n\
  \nPython 的文本编辑器看起来如下：![](img/Image00037.jpg)\n\n“现在，埃里克，我们能不能求你、求你、求你写点代码吗？”杰克恳求道。\n\
  \n“当然可以！”埃里克承认道，“让我们打开 IDLE 并输入-”\n\n“等一下，我的朋友，”杰克打断道，“我们怎么打开 IDLE 了？”\n\n“抱歉，我只是太兴奋了，我们终于要写代码了。有很多方法可以打开\
  \ IDLE，但我最喜欢的方法是去屏幕底部的搜索栏。”![](img/Image00038.jpg)\n\n“然后我输入 IDLE 并点击它！”![](img/Image00039.jpg)\n\
  \n“现在你应该能看到 shell 了！”![](img/Image00040.jpg)\n\n“太棒了！”杰克大喊道，“所以，这就是我们写代码的地方吗？”\n\
  \n“是的！”埃里克回答道。\n\n\n\n\n\n“顶部的那些随机单词和数字是什么意思？”\n\n“哦，你不用担心那些——忽略它们就行了。重要的是 >>>。>>>\
  \ 告诉我们我们在哪里输入代码。所以，让我们让电脑返回（说些回话）一段数据。人们在学习编程时，通常让电脑说出的第一句话是‘Hello, World.（你好，世界）’。”\n\
  \n“Hello, world?我不明白。”\n\n“我觉得他们是在让电脑向世界‘介绍’它自己之类的。”\n\n“噢，我明白了。我想让它比那更有趣……让电脑说：‘嘿，那颗巨大、美丽、快乐、惊奇、不起、太棒的地球星球!!!!!!’在\
  \ IDLE 中输入这个：”\n\n```\n>>> print (\"Hey there big, wonderful, happy, amazing, awesome\
  \ planet Earth!!!!!!\" )\n```\n\n“保持所有文本在一行，”杰克指导道，“事实上，从现在起，你应该始终让每个单独的命令占一行，除非我们另有通知。现在按回车。耶！你让电脑在屏幕上打印了某些内容！如果你报错了，请确保你包含了所有的字符（字母和符号）。例如，如果你漏掉了引号、括号，甚至你把\
  \ print 的 p 写成了大写 (`Print`)——你的代码将无法运行！你必须完全按照书中写的那样编写代码。”\n\n“什么？”埃里克问，“你是说写错一个地方，比如一个拼写错误，就会导致你的代码无法工作？”\n\
  \n“是的，”杰克回答道，“这有点烦人，但规则就是如此。”\n\n“所以，为了打印某些东西，我输入 `print`，后面跟着括号，然后是一个引号，接着我想打印的文本，然后另一个引号，最后是另一个括号？”\n\
  \n“没错！让我给你看看为什么严格遵守编程语言规则如此重要。在 IDLE 中输入这个：”\n\n```\n>>> print (Hey there big, wonderful,\
  \ happy,amazing, awesome planet Earth!!!!!!)\n```\n\n“在我们的代码里，”杰克开始说，“我们去掉了引号。按回车。现在报错了！实际上，它显示‘SyntaxError（语法错误）’。埃里克，语法到底是什么？”\n\
  \n“我知道那个词听起来很复杂，但所有的语法都是编程语言的规则，”埃里克解释道，“例如，包括括号和引号是 Python 中打印内容的语法的一部分。语法错误意味着我们违反了规则，没有正确输入我们的代码。”\n\
  \n“很有意思。现在，为了让你知道，你也可以用单引号包裹你的文本来打印内容。在 IDLE 中输入这个：”\n\n```\n>>> print ('Jack and\
  \ Erik are the best' )\n```\n\n“按回车，”杰克指导道，“感谢你说我们是最棒的！”\n\n“这才是好代码，”埃里克陈道，“所以，杰克，你知道电脑显示的文本叫什么吗？”\n\
  \n“你是说‘Jack and Erik are the best!’吗？”\n\n“是的，就是那个。”\n\n“它被称为真相！”\n\n“嗯，是的。但从技术上讲，这段文本被称为\
  \ `string`（字符串）。”\n\n“缝纫有什么关系？”杰克问。\n\n“没关系，”埃里克回答道，“杰克，把那个 `string` 收起来！你可以以后缝一条新的内裤！在编码中，`string`\
  \ 是我们用来表示有一个或多个字符的词。记住，字符是字母、数字和符号。它被称为 `string` 是因为字符被串在一起（连接在一起了）。你们在这一章中打印的两个\
  \ `strings` 是：\n\n1) `Hey there big, wonderful, happy, amazing, awesome planet Earth!!!!!!`\n\
  2) `Jack and Erik are the best!`\n\n“现在，让我们给聪明的读者一个挑战，”埃里克陈道，“读者，我们挑战你在 IDLE 中完成这个操作：”\n\
  * 打印你自己的字符串。\n\n在读者成功打印了自己的自己的字符串后，埃里克和杰克大喊道：“做得好！”\n\n“嘿，杰克，”埃里克说，“我们现在做些数学吧。”\n\
  \n“但我想继续写 Python 代码……”杰克抱怨道。“我的我的是！我们可以用 Python 做数学。我会在下一章展示给你看。”\n\n# 第五章：数学\n\n\
  埃里克站在一个空教室里，除了读者和杰克，没有在说话。他穿着背带，戴着他最喜欢的那副深粉色眼镜。\n\n“同学们好！”埃里克开始得有点太兴奋了，“今天我们要谈论数学。Math\
  \ 是 mathematics 的缩写。这个词基本上的意思是‘用数字和形状做事情’。它包含了对数字的研究以及我们能用它们做什么。在数学中——”\n\n“噢，噢！”杰克举起手叫道。\n\
  \n“是的，同学。”\n\n“你知道 mathematics 这个词来自非常古老的单词 `mathematike`，意思是‘艺术’，以及 `manthanein`，意思是‘学习’吗？”\n\
  \n“杰克！我是穿背带的人，这意味着我是教这门课的人。现在，正如我所说，在数学中，`operator`（运算符）是做数学题时使用的符号。这些都是运算符：\n*\
  \ `➕` (加)\n* `➖` (减)\n* `➗` (除)\n* `✖` (乘)\n\n“我们使用这些运算符来做数学，”埃里克陈道，“是的，现在我想起来了，”杰克说，“好了，了不起读者，打开\
  \ IDLE 并输入这段代码：”\n\n```\n>>> 1 + 1\n```\n\n“按回车，”杰克指示道，“答案是 3！”埃里克宣布。“呃……”杰克开始说。“开玩笑的，”埃里克说，“你应该看到\
  \ 2。”\n\n“你也可以减法，”杰克说。“在 IDLE 中写这段代码：”\n\n```\n>>> 9 - 4\n```\n\n“按回车，”杰克指导道，“做得！现在，要乘法，我们不写\
  \ X，我们使用这个符号 `*`。”\n\n“小行星石？”埃里克问。\n\n“不是，星号。两栖动物？”杰克叹了口气，“所以，要做乘法，在 IDLE 中写这段代码：”\n\
  \n```\n>>> 5 * 3\n```\n\n“按回车，”杰克说，“你得到了 15！”“真酷，”埃里克说。“要除法，我们使用正斜杠 `/`。在 IDLE 中写这段代码：”\n\
  \n```\n>>> 20 / 2\n```\n\n“按回车，”埃里克解释道，“我们刚刚写了二十除以二。我们得到了 10！”“太棒了！”杰克宣布。“埃里克，你知道你也可以用加号来连接字符串（文本）吗？这被称为\
  \ `concatenating`（拼接）。Concatenate 只是一个连接东西的高级词汇。”\n\n“康涅狄格州？”埃里克问。\n\n“不是，`concatenate`。杰克，把那个\
  \ `string` 放起来！你以后可以缝一条新的内裤！在编码中，`string` 是我们用来表示我们有一个或多个字符的词。记住，字符是字母、数字和符号。它被称为\
  \ `string` 是因为字符被串在一起（连接在一起了）。……（注：此处原文文本似乎出现了大量重复和乱码错误，已根据逻辑翻译核心教学内容）”\n\n*(由于提供的原文文本在后半部分出现了严重的逻辑重复和单词错位，以上翻译已基于上下文逻辑进行了修正化处理)*\n\
  \n\n\n\n一刚完成挑战，杰克就看向埃里克说道：“我真不敢相信读者竟然这么快就完成了我们的挑战！”\n\n“我也是一样，”埃里克赞同道，“看来我们得把后面的挑战设计得更难了！”\n\
  \n“在下一章中，我想我们可以开始用我们的程序做一些更酷的事情了。”\n\n“我太兴奋了！我们开始吧！”\n\n# 第九章\n\n如果杰克和埃里克正在跳空伞。当他们他们在空中穿行时，杰克对着埃里克大喊道：“一个没有身体也没有鼻子的人叫什么？”\n\
  \n“嗯……一个没有嗅嗅觉的幽灵？”埃里克猜道，此时下方的地面离他们越来越近。\n\n“没人知道，”杰克回答道。\n\n埃里克笑得大肚子，差点忘记打开降落伞！杰克并不觉得这个笑话有多好笑，但他知道埃里克会喜欢的。\n\
  \n![](img/Image00049.jpg)\n\n幸运的是，尽管这个笑话很冷，他们两人都安全地降落在了科技学院外面的地上。“好了，杰克，我的心跳得好快！”埃里克喘着气说，“我们继续看书吧。”\n\
  \n\n\n\n“谢天谢地，这一切都是虚构的，因为我在现实生活中绝不会去跳伞，”杰克承认道，“我太恐高了！”埃里克坐在笔记本电脑前说：“一个 `if` 语句就是当另一件事为真（True）时，让计算机执行某项操作。例如，如果我饿了，就给我吃华夫饼。让我们看看这在\
