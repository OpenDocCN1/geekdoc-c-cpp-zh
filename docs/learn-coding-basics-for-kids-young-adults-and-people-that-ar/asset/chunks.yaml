    ## Dedication


    Jack Stanley here. Before I wrote this book, I looked through several existing
    “Kids Coding books.” I found two common problems with them:

    1) They were too difficult. Many of the explanations contained words that many
    kids (and adults) don’t know. And,

    2) They were boring.


    Then it hit me – what if I wrote a coding book for kids as a story?! Meaning,
    it would contain characters and dialogue (spoken conversations). This would allow
    me to be quite imaginative. I then wrote this book and my genius business partner
    (Erik Gross) reviewed, edited and added his charm to it. It is Erik’s and my dream
    that this book will end up in schools all over the world.


    Even though I am technically a grown up, I never really grew up. I am the father
    of two wonderful children, and I have nieces and nephews. They are the primary
    source of my motivation. This book is dedicated to them. ![](Image00002.jpg)


    Jack C. Stanley, July 2020 ![](Image00003.jpg) ®


    # LEARN CODING BASICS FOR KIDS, YOUNG ADULTS AND PEOPLE WHO ARE YOUNG AT HEART
    WITH ![](Image00004.jpg)


    Written by: Jack C. Stanley and Erik D. Gross

    Illustrations by: Afra Amin Orony, based on sketches by Jack C. Stanley ![](Image00005.jpg)![](Image00006.jpg)


    ## CHAPTER ONE: WELCOME


    “Erik!” Jack yelled in excitement. “Someone is reading our book!”


    “Well, that was our reason for writing it,” Erik responded. “Let’s introduce ourselves.
    I am Erik and-”


    “And I am Jack!” Jack interrupted. “It’s nice to meet you! Erik and I have a school
    called The Tech Academy.”![](Image00007.jpg)


    “Tech is short for technology,” Jack continued, “and Academy is just another word
    for school. Technology means to use the things you know to solve problems and
    to make life easier.”


    “So, you’re saying toilet paper is technology?” Erik asked.


    “Well, not exactly. I mean, kind of, it-”


    “Because it certainly makes my life easier!”


    “Very funny, Erik. What I was trying to tell our wonderful reader is that the
    things that we use to do work for us are technology.”


    “Like toilet paper!”![](Image00008.jpg)


    “Enough with the toilet paper,” Jack demanded. “What I mean is that technology
    is machines and the things we tell machines to do.”


    “Ah, and machines are things made by people to get work done,” Erik explained.
    “Machines do actions for people to save them time and to get things done faster.
    They’re usually made out of wood, plastic or metal. Normally they have some parts
    that move and some parts that don’t – sometimes they have no moving parts at all!
    Machines receive some kind of energy (like electricity or gas) that they use to
    do their work. One of the things that makes people different from animals is their
    ability to create powerful machines.”


    “So, cars, ovens and televisions are machines?” Jack wondered.![](Image00009.jpg)


    “Yep!” Erik replied. “The most popular machine in the world right now is computers.”


    “Okay, Erik, don’t be a nerd,” Jack teased. “I am proud to be a nerd!”


    “Okay, okay. I take it back. Now why are you saying computers are more popular
    than any other machines? Don’t more people have cars or refrigerators?”


    “Well, actually, nowadays almost every machine has a computer inside it – most
    phones, televisions, airplanes, cars and refrigerators included! Oh, I just realized,
    we haven’t really said what a computer is exactly.”


    “That’s easy. A computer is a machine that computes. Just like a baker is someone
    who bakes, a gamer is someone who plays games-”


    “Jack! What does compute mean?”


    “It’s very, very, very difficult to understand. So, get ready… Compute means figuring
    out the answer to a problem.”


    “Wait, that’s it?”


    “Well, technically it’s solving problems with numbers.”


    “So, math is computing?”


    “Yep!”![](Image00010.jpg)


    “So,” Erik began, “computers are machines that compute. They do things with numbers.”


    “Yes,” Jack agreed, “they are machines that work with data. Data is just another
    word for information – facts and knowledge about things. Erik, why don’t you tell
    our amazing reader how computers work?”


    “I thought you’d never ask!” Erik responded excitedly. “It could take a whole
    book to describe that exactly. In fact, that’s why we wrote a different book called
    You Are Not Stupid – Computers and Technology Simplified – available now for purchase
    on Amazon!”![](Image00011.jpg) “Erik!” Jack butted in. “Stop trying to sell books!”


    “Sorry, it’s an old habit,” Erik apologized. “Did you know I used to sell sunglasses
    around the world?” Jack tapped his foot. “So, as I was saying,” Erik chuckled,
    “computers are machines that use electricity to operate (do things). They deal
    with data (information). Computers have several parts that electricity passes
    through. Computers are not alive – they are just a tool, like a lawnower or a
    hammer. We use them to do things for us. Computers simply follow instructions
    – which are commands that tell them what to do.”![](Image00012.jpg) “Erik!” Jack
    shouted. “Take those sunglasses off! We are inside!” With a sly smile, Erik removed
    his sunglasses and put his glasses back. “Now,” Jack continued, “there are a couple
    other things about computers that I would like to add:


    1. Automatic means that a machine can do something by itself. Automate means to
    make something automatic. Machines that automate do those things on their own.
    Meaning, they can do things without being involved. For example, your computer
    automatically says what time it is and automatically turns the screen off when
    hasn’t been used for a while. Keep in mind that these automatic actions were originally
    (created) by a person.


    2. Computers process data. Process means to handle something according to rules.
    When a computer displays the word ‘processing,’ it is saying, ‘Hold on while I
    perform some actions according to rules and steps built into me.’ Processing refers
    to ‘doing things with data.’ Loading up and showing a video on your computer is
    an example of ‘processing.’ When data is being processed by a computer, you sometimes
    see ‘progress bar’ (a picture that shows how far something is):![](Image00013.jpg)
    “Took you long to explain that,” Erik yawned. “Want to hear a fun fact?” “I’m
    pretty sure you’re going to tell it no matter what,” Jack replied. “Okay! Have
    you ever seen this?”![](Image00014.jpg) “Yeah,” Jack answered. “It’s like a spinning
    circle that shows up when data is processed.” “Yep!” Erik acknowledged. “When
    information is being handled by a computer the spinny circle is shown but do you
    know what it’s called?” “Ummmm… a spinny thing?” “Good guess, but no. It’s called
    throbber because when they came out, they would go between getting bigger and
    smaller. They throbbed!” “Erik, you''re making my head throb. Let’s move on…”
    “Alright, do you know what it’s called when we put data to a computer?” “Is this
    a game or a book? It’s called input – when you input data, you’re putting data
    inside the computer.” “Exactly! What about you take information out of the computer?”
    “Ummmm… takeout? Just kidding, it’s called output. But why does all matter, Erik?”
    “I’m getting there. Input has two meanings:


    1. As a thing, it is the data put into a computer,

    2. As an action, it means to put data into a computer. Output means the opposite.”
    “Yeah, yeah, we get it. So, what’s the point?” “The point is that computers work
    this way:


    1) They take data in. Meaning, information or instructions is input into the computer
    – usually by a person.

    2) They process that data. This means they perform actions with the data that
    was input.

    3) Then they send data out. Such as by displaying (showing) the data on your computer
    screen or printing the data with a printer. Meaning, the output is what you see
    on the screen or paper.”![](Image00015.jpg)


    INPUT PROCESS OUTPUT


    “That’s pretty cool,” Jack admitted. “When you put it that simply, I guess computers
    are pretty basic. So, remember how I was talking about technology earlier – things
    you use to complete work faster and make life easier? Well, computers are technology.
    In fact, the subjects are so similar that the two words (‘computers’ and ‘tech’)
    sometimes mean the same thing! For example, because of the fact that many machines
    contain computers, most ‘tech news’ is really ‘computer news.’ Now, Erik, I have
    a serious question. What do spiders do on computers?” “I’t know,” Erik answered,
    “what?” “Make websites!”![](Image00016.jpg) Erik laughed so loud that Jack had
    to plug his ears. “Jack,” Erik began, “I think this chapter is getting a little
    long.” “I agree,” Jack responded. “Let’s end this chapter and then talk about
    what coding is!”


    ## CHAPTER TWO: WHAT IS CODING?


    Jack and Erik stood inside The Tech Academy, wishing they were as cool as the
    person reading this book. “Okay, Jack,” Erik started, “what is coding?” “I am
    glad you asked,” Jack responded, “coding just means to put instructions (commands)
    into a computer.” “So, when I tell my computer to play a video, I’m coding?” “Well,
    no. I guess to explain this, I will need to say what a program is.” “Allow me!”
    Erik cut in. “Programs are instructions, typed into a computer by people, that
    make the computer do things. Behind every action a computer can take, there’s
    a program.” “Totally,” Jack agreed, “here are some examples of programs:


    * Microsoft Word – which is a program that allows you to type things.

    * Google Chrome – a program that helps you search the internet.

    * Minecraft – a program you’ve probably played!


    “That’s right, computer games are programs! And when you install a program on
    your computer, it just means you’re putting the program on the computer so it
    can be used. Just like if you say, ‘I installed door,’ you mean you put door on
    house.” “I have another fun fact!” Erik blurted out. “Programs are also called
    applications (apps for short) and software. Guess what the opposite of software
    (programs) is?” Jack guessed. “Nope! Hardware! Get it? Soft and hard are opposites.”
    “Hardware is the physical parts of a computer – the parts you can touch. Hard
    means solid or able to be touched. Ware is something created that can be sold
    or used. For example, software refers to everything you can use for drinking –
    like cups, pots and bags. The computer screen, mouse and keyboard are all examples
    of hardware![](Image00017.jpg) “So, again,” Erik stated as he stood in front of
    Jack, “software is computer programs – instructions that tell a computer what
    to do. Software is made by people to make the computer do certain things and give
    output (information put out). The software is the instructions, while hardware
    follows the instructions![](Image00018.jpg) “Back to what this has do with coding,”
    Jack said, pushing Erik of the way, “coding means to create programs. People that
    create programs (software and apps) are called coders. They’re also called software
    developers or computer programmers. A developer is someone who makes something![](Image00019.jpg)
    “I’m confused…” Erik whined. “So many of these words mean the same thing. An app
    is a program and is software. A computer programmer, is a coder, is a software
    developer, is- Oh my dear Erik, it’s not confusing,” Jack explained. “Having lots
    of names for the same thing is very common in English. For example, huge, giant
    and gigantic mean the same thing.” “Hey! Stop talking about my belly!” Erik covered
    his stomach with both hands. “Moving on… Code can be an action – making computer
    programs by writing special instructions into a computer. It can also be a thing.
    Code is the actual instructions. For example, this code:


    ```

    print("Hello!")

    ```![](Image00022.jpg) “And it could make your computer show a picture of a cat![](Image00020.jpg)
    “Now that is a cute cat,” Jack stated. “You would write this code inside a special
    program called- Erik started. “Hold on,” Jack cut in, “you’re about to say three
    really big words.” “I know, I know. But I didn’t choose the name for this thing!
    The reader needs to know what it’s called.” Jack thought about it and then nodded
    in agreement. The program that coders use to write their code in is called an
    Integrated Environment.” Jack yawned. “Integrate means to combine things together,”
    Erik went on. “For example, if you integrate red and blue, you get purple. The
    program you use to write your code in is integrated because there are many different
    things it can do that are brought together in one place.” “Okay, I guess that
    makes sense,” Jack admitted. “And the development part refers to making programs
    – like software development.” “That’s right. An environment refers to a combination
    of hardware and software that work together. And so, when we put it all together,
    an Integrated Development Environment is simply the program that you write your
    code in. It is software that helps you make software.” “I don’t like saying Integrated
    Development Environment – it’s too complicated. Can I just call it an IDE?” “Sure
    thing. In fact, that''s what most professionals call it.”![](Image00021.jpg)


    IDE


    So, the IDE is the program where we type the instructions that make programs,”
    Jack repeated. “These programs are written using programming languages.” “Wait,”
    Erik interrupted, “computers speak languages? Like Spanish or Chinese?” “First
    off, Chinese people mostly speak Mandarin, not ‘Chinese.’ Second of all, to answer
    your question, yes, just like people speak lots of languages, computers have their
    own languages that they can ‘understand.’ These programming languages are the
    words we use to write our programs. There are many different programming languages.
    Just like hammers and ladders have different uses, each programming language has
    a different use. For example, some programming languages were designed mainly
    to improve websites, while others were made for creating computer games. The instructions
    used in programming languages are code. For example, to have a computer show the
    word ‘Hello!’ using Python (the very popular programming language you will learn
    in this book), the code is written as:


    ```

    print("Hello!")

    ```![](Image00022.jpg) “When someone says ‘program a computer’ or ‘do some coding,’”
    Jack continued, “they’re saying, ‘Write a set of instructions into a computer,
    using a programming language, that will result in specific actions being performed
    when that set of instructions is done.’ Again, a computer programmer is a person
    that does programming (writes code that makes programs).”Image00023.jpg) “So,”
    Erik started, “do you know what it’s called when you make it go?” “Go?” Jack asked.
    “I mean you type some code and then make it do what you wanted it to. When computers
    perform actions, like they do, we call this ‘executing’ or ‘running.’” “Executing
    your! Why would we kill it?” “No, again, execute means to make the computer do
    things. Like you could execute instruction by pressing Enter on your keyboard.
    Okay, but what is our running away from?” “Huh?” “You said that code can run?”
    “Oh, it doesn’t mean that. Run means the same thing as execute. For example, you
    can run on the internet by clicking search. Ah, now I remember. Inside IDE (the
    program we will use to write our code) there is a button we can press to run (execute)
    our code – this makes the code go!”Image00024.jpg “Erik,” Jack began, “I hate
    it when chapters go on and on. Can we talk about snake now?” Erik asked. “Python.
    See, I’m holding one right now. You said this book was about pythons.”Image00025.jpg
    “Jack!” squealed Erik. “Weren’t you paying attention earlier when I said Python
    was a popular computer language? Get rid of that!” “Oops!” Jack said, embarrassed.
    “Okay, let’s talk about what Python is in the next chapter but we need to hurry.”


    ## CHAPTER THREE: WHAT DO SNAKES HAVE DO WITH THIS?


    “Erik, who is this guy?” Jack said while holding a picture.Image00026.jpg “That’s
    Guido van Rossum,” Erik answered, “the guy that created the programming language.”
    “Oh man, he must be a really smart guy if he created an entire programming language!”
    Jack announced. “So, why did he call it Python? Does he love snakes?” “Actually,
    it’s named after an old television show from 1960s and 1970s. The show was called
    Monty Python and it was really funny. Guido was a big fan!”Image00027.jpg(Monty
    Python actors) “Erik, you’re so old...” Jack said. “So, why are we using Python
    in this book?” “Simple,” Erik started, “because many of the words used in Python
    are English words! For example, to add numbers in Python we write this:


    1 + 2


    3 “Python will return (give back to us): Just like we would write it in English!”
    “That’s right,” Jack remembered. “Python is a great way to learn coding because
    it is so similar to what we’re used to! So, to use Python we have to download
    it. Do you know what downloading means?”Yes, but why don’t you say it?” Erik looked
    a little nervous and uncertain. “Download means you’re taking something online
    (from the internet) and putting it on your computer. The internet is just a way
    to share information between computers. For example, if you download a video,
    you are having your computer pull the video’s data from the internet (from other
    computers) and save that data on your computer so you can watch it later. So,
    Erik, what’s the opposite of download?”Highload?”Close, but no. The opposite of
    download is upload. When you upload something, you are moving it from your computer
    to the internet. Like you could upload a video that you recorded to YouTube and
    then you could be famous! In the picture below, the large computers at the top
    are the ‘internet’ – powerful computers used to share information.”Image00028.jpg
    “Hold on,” Erik said in excitement, “I can upload my videos and become famous?”Well,
    I mean, it’s possible but not likely-Image00029.jpg Focus, Erik, focus,” Jack
    instructed, “you can upload your singing and dancing videos later. We have been
    talking for three chapters and the reader hasn’t been able to write any code yet.
    I say we started!”Yes! Erik agreed. “So, what’s the first step?”Well,” Jack began,
    “the first step is to download (take from the internet) and install (put on our
    computer) Python.”“That sounds hard.”Don’t worry Erik, we can get through it,
    together!”You’re right,” Erik agreed happily. “But can we do it in the next chapter?
    There’s a certain video of me singing Taylor Swift that I just have to upload.
    The world needs to see my new dance move! I call it ‘The Gross!’Just so the reader
    knows, Gross is Erik’s last name. But now that I’ve seen him dance, I think the
    name of his dance might have two meanings…”Image00030.jpg


    ## CHAPTER FOUR: DOWNLOADING AND INSTALLING PYTHON


    “Okay, Erik,” Jack started, “I watched your video and just finished washing my
    eyes. Let’s get to work.”Haters are going to hate,” Erik said, “and I’m just going
    to shake it off!”The first step to adding Python to your computer is to go here
    on the internet:python.orgImage00031.jpg “Then click Downloads and select the
    newest version (type) of Python (the one with the highest number).”Image00032.jpg
    “After you click on the newest version of Python, you should see a little rectangle
    in the bottom of your screen that looks something like:”Image00033.jpg “If you
    don’t see it there, check in your computer’s Downloads.”Image00034.jpg “Click
    on the rectangle that says ‘python...’ on the bottom of your screen or the file
    named ‘python...’ inside your Downloads folder. When it opens, click ‘Install
    Now.’”Image00035.jpgWhen it asks you, ‘Are you sure?’ click Yes. Then when you
    see ‘Setup was successful,’ you can click ‘Close.’ Now don’t worry if the pictures
    you see and the names on your screen are slightly different than our pictures
    – technology changes all the time. All that’s important here is that you successfully
    download and install Python, which I am sure you did!”We made it!”Erik cheered.Yes,
    we did!”Jack agreed. “So, how do we write code?”Well, remember that long name
    ‘Integrated Development Environment’ – the program you use to write programs in?”Ah,
    yes. The I-D-E.”Yep! We need to open Python’s IDE. The Python IDE is named ‘IDLE.’
    This stands for ‘Integrated Development and Learning Environment.’ Remember how
    I told you that the creator of Python, Guido van Rossum, named Python after the
    TV show Monty Python? Well, I think the name IDLE was probably chosen partly to
    honor Eric Idle, one of the actors from the Monty Python show.”Erik, you certainly
    love your random facts! So, IDLE is what we will use to write our Python code.
    There are two parts to IDLE:1) Shell. This is a program that lets you control
    your computer by writing commands. It is called a shell because it is the part
    in between the coder and their computer – like a crab shell is the part between
    the crab and the outside world. The Python shell looks something like this:Image00036.jpg“2)
    Text editor. Text is characters (letters, numbers and symbols).

