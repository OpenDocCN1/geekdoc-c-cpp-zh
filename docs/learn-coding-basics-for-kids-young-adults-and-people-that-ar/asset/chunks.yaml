    # CHAPTER NINE


    IF Jack and Erik were skydiving. As they flew through the air, Jack yelled over
    to Erik, “What do you call someone who has no body and no nose?”


    “Ummm… A ghost with no sense of smell?” Erik guessed as the ground below them
