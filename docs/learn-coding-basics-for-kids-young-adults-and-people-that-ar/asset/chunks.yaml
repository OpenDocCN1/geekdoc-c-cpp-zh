    screen or printing the data with a printer. Meaning, the output is what you see
    on the screen or paper.”![](Image00015.jpg)INPUT​ ​       PROCESS​ ​    OUTPUT​
    “That’s pretty cool,” Jack admitted. “When you put it that simply, I guess computers
    are pretty basic. So, remember how I was talking about technology earlier – things
    you use to complete work faster and make life easier? Well, computers are technology.
    In fact, the subjects are so similar that the two words (‘computers’ and ‘tech’)
    sometimes mean the same thing! For example, because of the fact that many machines
    contain computers, most ‘tech news’ is really ‘computer news.’ Now, Erik, I have
    a serious question. What do spiders do on computers?”​ “I don’t know,” Erik answered,
    “what?”​ “Make websites!”![](Image00016.jpg)Erik laughed so loud that Jack had
    to plug his ears. “Jack,” Erik began, “I think this chapter is getting a little
    long.”“I agree,” Jack responded. “Let’s end this chapter and then talk about what
    coding is!”CHAPTER TWOWHAT IS CODING?​ Jack and Erik stood inside the The Tech
    Academy, wishing they were as cool as the person reading this book.​ “Okay, Jack,”
    Erik started, “what is coding?”​ “I am glad you asked,” Jack responded, “coding
    just means to put instructions (commands) into a computer.”​ “So, when I tell
    my computer to play a video, I’m coding?”​ “Well, no. I guess to explain this,
    I will need to say what a program is.”​ “Allow me!” Erik cut in. “Programs are
    instructions, typed into a computer by people, that make the computer do certain
    things. Behind every action a computer can take, there’s a program.”​ “Totally,”
    Jack agreed, “here are some examples of programs:●         “Microsoft Word – which
    is a program that allows you to type things.●         “Google Chrome – a program
    that helps you search the internet.●         “Minecraft – a program that you’ve
    probably played!​ “That’s right, computer games are programs! And when you install
    a program on your computer, that just means you’re putting the program on the
    computer so it can be used. Just like if you say, ‘I installed a door,’ you mean
    that you put a door on your house.”​ “I have another fun fact!” Erik blurted out.​
    Jack rolled his eyes.​ “Programs are also called applications (apps for short)
    and software,” Erik explained. “Guess what the opposite of software (programs)
    is?”​ “Toughware?” Jack guessed.​ Erik giggled. “Nope! Hardware! Get it? Soft
    ware and hard ware are opposites.”“I get it! Hardware is the physical parts of
    a computer – the parts that you can touch. Hard literally means solid or able
    to be touched . Ware is something created that can be sold or used . For example,
    teaware refers to everything you can use for drinking tea – like tea cups, teapots
    and bags of tea. The computer screen, mouse, printer and keyboard are all examples
    of hardware.”![](Image00017.jpg)​ “So, again,” Erik stated as he stood in front
    of Jack, “software is computer programs – instructions that tell a computer what
    to do. Software is made by people to make the computer do certain things and to
    give certain output (information put out). The software is the instructions, while
    hardware follows the instructions.”![](Image00018.jpg)​ “Back to what this has
    to do with coding,” Jack said, pushing Erik out of the way, “coding means to create
    computer programs. People that create programs (software and apps) are called
    coders. They’re also called software developers or computer programmers. A developer
    is someone who makes something.”![](Image00019.jpg)​ “I’m confused…” Erik whined.
    “So many of these words mean the same thing. An app is a program and is software.
    A computer programmer, is a coder, is a software developer, is a-”​ “Oh my dear
    silly Erik, it’s not confusing,” Jack explained. “Having lots of names for the
    same thing is very common in English. For example, huge , giant and gigantic all
    mean the same thing.”​ “Hey! Stop talking about my belly!” Erik covered his stomach
    with both hands. “Moving on… Code can be an action – making computer programs
    by writing special instructions into a computer. It can also be a thing. Code
    is the actual instructions. For example, this code:Show Picture (Cat)​ “And it
    could make your computer show a picture of a cat.”![](Image00020.jpg)​ “Now that
    is a cute cat,” Jack stated.“You would write this code inside a special program
    called an-” Erik started.​ “Hold on,” Jack cut in, “you’re about to say three
    really big words.”​ “I know, I know. But I didn’t choose the name for this thing!
    The reader needs to know what it’s called.”​ Jack thought about it and then nodded
    in agreement.“The program that coders use to write their code in is called an
    Integrated Development Environment .”​ Jack yawned.​ “Integrate means to combine
    things together,” Erik went on. “For example, if you integrate red and blue, you
    get purple. The program you use to write your code in is integrated because there
    are many different things it can do that are brought together in one place.”“Okay,
    I guess that makes sense,” Jack admitted. “And the development part refers to
    making programs – like software development.”“That’s right. An environment refers
    to a combination of hardware and software that work together. And so, when we
    put it all together, an Integrated Development Environment is simply the program
    that you write your code in. It is software that helps you make software.”“I don’t
    like saying Integrated Development Environment – it’s too complicated. Can I just
    call it an IDE?”“Sure thing. In fact, that''s what most professionals call it.”![](Image00021.jpg)This
    is an IDE“So, the IDE is the program where we type the instructions that make
    programs,” Jack repeated. “These programs are written using programming languages.”​
    “Wait,” Erik interrupted, “computers speak languages? Like Spanish or Chinese?”​
    “First off, Chinese people mostly speak Mandarin, not ‘Chinese.’ Second of all,
    to answer your question, yes, just like people speak lots of languages, computers
    have their own languages that they can ‘understand.’ These programming languages
    are the words we use to write our programs. There are many different programming
    languages. Just like hammers and ladders have different uses, each programming
    language has a different use. For example, some programming languages were designed
    mainly to improve websites, while others were made for creating computer games.
    The instructions used in programming languages are code. For example, to have
    a computer show the word ‘Hello!’ using Python (the very popular programming language
    you will learn in this book), the code is written as:”print("Hello!")![](Image00022.jpg)​
