- fmt: "\n“Thank goodness this is all fictional because I would never skydive in real\
    \ life,” Jack admitted. “I’m too afraid of heights!” Erik sat in front of a laptop\
    \ and said, “An `if` statement is when you have the computer do something if another\
    \ thing is True. For example, if I am hungry, then feed me waffles. Let’s see\
    \ how this works in Python. Write this code in IDLE and press enter three times:”\n\
    \n```python\nif 5 > 3:\n    print(\"Five is larger than three\")\n```\n\n“Good\
    \ job!” Erik acknowledged. “We just told the computer, ‘If it is True that the\
    \ number 5 is larger than the number 3, show the string (words) ‘Five is larger\
    \ than three’). Let’s see what happens when we type something false. Write this\
    \ code in IDLE and press enter three times:”\n\n```python\nif 10 > 20:\n    print(\"\
    Ten is larger than twenty\")\n```\n\n“Nothing happens because it isn’t True!”\
    \ Erik announced. “I see how that works, Erik,” Jack said. “Write this code in\
    \ IDLE and press enter after each line:”\n\n```python\nJack = 34\nErik = 51\n\
    if Erik > Jack:\n    print(\"Erik is older than Jack\")\n```\n\n“That’s pretty\
    \ cool, Jack,” Erik said. “You used variables within an `if` statement! What do\
    \ we do if we want more than one choice?”\n\n“We can use the `elif` statement,”\
    \ Jack replied, “which literally just gives another thing to check for.”\n\n“There’s\
    \ an elf in Python?!” Erik cried out.\n\n“No, Erik. `Elif`. It’s short for `else/if`.\
    \ Something like, ‘if happy then laugh, elif sad then cry,’ would say that you\
    \ should laugh if you’re happy or cry if you’re sad.”\n\n“Ummm… How about we change\
    \ cry to dance?! That always cheers me up!” Erik started dancing. “Everybody do\
    \ The Gross!” Jack had to look away.\n\n“Let’s try this out,” Jack said, as he\
    \ tried to focus on something other than Erik’s dance moves. “Write this code\
    \ in IDLE, pressing enter after each line:”\n\n```python\nHappy = 50\nSad = 100\n\
    if Happy > Sad:\n    print(\"Laugh\")\nelif Sad > Happy:\n    print(\"Shake your\
    \ booty!\")\n```\n\n“Oh, no!” Jack cried. “We got an error!”\n\n“That’s because\
    \ we didn’t indent the code correctly,” Erik explained.\n\n“Indent?”\n\n“You see\
    \ the `TAB` key on your keyboard? That pushes the cursor (that small black line\
    \ that flashes up and down on your screen that shows you where to type) over several\
    \ spaces to the right. When you move text over like that, especially when pressing\
    \ the `TAB` key, that’s called indenting. If you noticed, Python was automatically\
    \ indenting some of our code. Meaning, it was moving it to the right a little.\
    \ The problem is that the `elif` statement shouldn’t be indented. To fix this\
    \ we need to press backspace (a key that moves text to the left and can delete\
    \ things) on the line that has the `elif` statement to get rid of the indent.\
    \ I’ll show you. Write this code in IDLE and press enter after each line:”\n\n\
    ```python\nif Happy > Sad:\n    print(\"Laugh!\")\nelif Sad > Happy:\n    print(\"\
    Shake your booty!\")\n```\n\n“Now it should work!” Erik stated.\n\n“Wow, that\
    \ seems really silly,” Jack stated.\n\n“Well, it’s all part of the rules on how\
    \ to write Python,” Erik explained. “Remember, we call these rules syntax. Now,\
    \ Jack, what if we want three or more choices?”\n\n“Thank you for asking. We can\
    \ also use the `else` statement. What this does is say, ‘Alright computer, when\
    \ I wrote my `if` statement and `elif` statement, I told you what to do, but for\
    \ anything else that happens, do this other thing. For example, if sleepy then\
    \ go to bed, if dirty then take a shower, else then read this book. This basically\
    \ says to sleep if you’re tired, bathe if you’re dirty, and to otherwise spend\
    \ all your time reading this life-changing book! Write this code in IDLE, pressing\
    \ enter after each line (and don’t forget to move `elif` and `else` to the left\
    \ with the backspace key!):”\n\n```python\nColor = \"Blue\"\nif Color is \"Red\"\
    :\n    print(\"The color is red!\")\nelif Color is \"White\":\n    print(\"The\
    \ color is white!\")\nelse:\n    print(\"The color is blue!\")\n```\n\n“What happened\
    \ here is that the computer first checked to see if the color was Red (`if` statement),\
    \ found it was False so moved to the next step, checked to see if the color was\
    \ White (`elif` statement), found it was also False, then it said, ‘If the Color\
    \ is anything else besides Red or White, print ‘The color is blue!’ (`else` statement),”\
    \ Jack explained.\n\n“Whoa,” Erik said, “that seems kind of complicated.”\n\n\
    “I understand,” Jack comforted. “It will get easier the more we play around with\
    \ it. Let’s try another one.”\n\n“Okay,” Erik said. “Write this code in IDLE,\
    \ pressing enter after each line:”\n\n```python\nif 1 + 1 == 3:\n    print(\"\
    one plus one is three!\")\nelif 2 + 2 == 4:\n    print(\"two plus two is four!\"\
    )\nelse:\n    print(\"I can't math right now...\")\n```\n\n“In this code, `elif`\
    \ was True and so that was the one that printed!” Erik explained. “Now, it’s time\
    \ for a challenge! Perform the following actions in IDLE:”\n\n- Write your own\
    \ `if` statement,\n- Write your own `elif` statement,\n- Write your own `else`\
    \ statement.\n"
