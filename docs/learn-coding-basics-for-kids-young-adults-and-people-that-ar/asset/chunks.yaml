    ## 献辞


    我是杰克·斯坦利（Jack Stanley）。在我写这封书之前，我翻阅了几本现有的“儿童编程书籍”。我发现它们有两个共同的问题：

    1) 它们太难了。很多解释都包含了许多孩子（以及大人）都不认识的词汇。而且，

    2) 它们很无聊。


    这时我灵光一闪——如果我用故事的形式给孩子们写一本编程书呢？！这意味着它将包含角色和对话（口语交流）。这能让我充分发挥想象力。然后我写了这本书，我天才的业务伙伴（埃里克·格罗斯
    Erik Gross）对其进行了审阅、编辑，并注入了他的魅力。埃里克和我梦想是，这本书最终能出现在世界各地的学校里。


    尽管我在技术上已经是个成年人，但我从未真正长大过。我是两个优秀孩子的父亲，还有侄子和外甥。他们是我动力的主要来源。这本书献给他们。![](img/Image00002.jpg)


    杰克·C·斯坦利（Jack C. Stanley），2020 年 7 月 ![](img/Image00003.jpg) ®


    # 为儿童、青少年和心未老的人们学习编程基础 ![](img/Image00004.jpg)


    作者：Jack C. Stanley 和 Erik D. Gross

    插图：Afra Amin Orony，基于 Jack C. Stanley 的草图绘制![](img/Image00005.jpg)![](img/Image00006.jpg)


    ## 第一章：欢迎


    “埃里克！”杰克兴奋地喊道，“有人在读我们的书了！”


    “嗯，那正是我们写它的理由，”埃里克回答道，“让我们自我介绍一下吧。我是埃里克——”


    “我是杰克！”杰克打断道，“很高兴见到你！埃里克和我有一所叫作科技学院（The Tech Academy）的学校。”![](img/Image00007.jpg)


    “Tech 是科技的缩写，”杰克继续道，“Academy 就是学校的另一个说法。技术的意思就是使用你知道的东西来解决问题并让生活变得更容易。”


    “所以，你的意思是卫生纸也是技术？”埃里克问。


    “嗯，不完全是。我的意思是，算是吧，它——


    “因为它确实让我的生活变得更容易了！”


    “很有幽默，埃里克。我想告诉我们优秀的读者的是，我们用来替我们完成工作的东西就是技术。”


    “就像卫生纸！”![](img/Image00008.jpg)


    “别提卫生纸了，”杰克要求道，“我的意思是技术是机器以及我们告诉机器去做的事情。”


    “啊，而机器是人们为了完成工作而制造的东西，”埃里克解释道，“机器为人类执行动作以节省时间并更快地完成任务。它们通常由木头、塑料或金属制成。通常它们有一些运动的部件和一些不动的部件——有时它们完全没有活动部件！机器接收某种能量（如电力或气体）并用它们来工作。人与动物的区别之一就在于他们创造强大机器的能力。”


    “所以，汽车、烤箱和电视都是机器吗？”杰克好奇道。![](img/Image00009.jpg)


    “没错！”埃里克回答道，“现在世界上最流行的机器是电脑。”


    “好了，埃里克，别当书呆了，”杰克调侃道，“我很自豪我是个书呆！”


    “好了，好了。我收回这句话。现在你为什么说电脑比任何其他机器都流行？难道没有更多人汽车或冰箱吗？”


    “嗯，实际上，现在几乎每台机器内部都有一台电脑——包括大多数手机、电视、飞机、汽车和冰箱！噢，我刚意识到，我们还没有真正说清楚到底什么是电脑。”


    “这很简单。电脑是一台进行计算的机器。就像面包师是烘焙面包的人，玩家是玩游戏的人——”


    “杰克！计算（compute）是什么意思？”


    “这非常、非常、非常难以理解。所以，准备好……计算意味着找出问题的答案。”


    “等等，就这？”


    “从技术上讲，它是用数字来解决问题。”


    “所以，数学就是计算？”


    “没错！”![](img/Image00010.jpg)


    “所以，”埃里克开始说道，“电脑是计算的机器。它们用数字处理事情。”


    “是的，”杰克同意道，“它们是处理数据的机器。数据就是信息的另一种说法——关于事物的实和知识。埃里克，你为什么不告诉我们了大的读者电脑是如何工作的呢？”


    “我以为你不会问的！”埃里克兴奋地回答道，“可能需要一整本书来准确描述。事实上，这就是为什么我们写了另一本叫《你并不笨——电脑与技术的简单化》的书，现在可以在亚马逊上购买！”![](img/Image00011.jpg)
    “埃里克！”杰克插话道，“别再推销书了！”


    “抱歉，老习惯了，”埃里克道歉道，“你知道我以前曾在世界卖太阳镜吗？”杰克敲了敲脚。“所以，正如我所说的，”埃里克笑道，“电脑是使用电力运行（做事情）的机器。它们处理数据（信息）。电脑有几个电流通过的部位。电脑不是活的——它们只是工具，就像割草机或锤子。我们用它们来替我们做事。电脑只是遵循指令——指令是告诉它们该做的命令。”![](img/Image00012.jpg)
    “埃里克！”杰克喊道，“摘掉那些太阳镜！我们在里面呢，”埃里克笑着摘下眼镜。“我的意思是技术是机器以及我们告诉机器去执行的事情。”![](img/Image00009.jpg)
    “啊，而机器是人们为了完成工作而制造的东西，”埃里克解释道，“机器为人类执行动作以节省时间并更快地完成任务。它们通常由木头、塑料或金属制成。通常它们有一些运动的部件和一些不动的部件——有时它们完全没有活动部件！机器接收某种能量（如电力或气体）并用它们来工作。人与动物的区别之一就在于他们创造强大机器的能力。”“所以，汽车、烤箱和电视都是机器吗？”杰克好奇道。![](img/Image00009.jpg)


    “没错！”埃里克回答道，“现在世界上最流行的机器是电脑。”


    “好了，埃里克，别当书呆了，”杰克调侃道，“我很自豪我是个书呆！”


    “好了，好了。我收回这句话。现在你为什么说电脑比任何其他机器都流行？难道没有更多人汽车或冰箱吗？”


    “嗯，实际上，现在几乎每台机器内部都有一台电脑——包括大多数手机、电视、飞机、汽车和冰箱！噢，我刚意识到，我们还没有真正说清楚到底什么是电脑。”


    “这很简单。电脑是一台进行计算的机器。就像面包师是烘焙面包的人，玩家是玩游戏的人——”


    “杰克！计算是什么意思？”


    “这非常、非常、非常难以理解。所以，准备好……计算意味着找出问题的答案。”


    “等等，就这？”


    “从技术上讲，它是用数字来解决问题。”


    “所以，数学就是计算？”


    “没错！”![](img/Image00010.jpg)


    “所以，”埃里克开始说道，“电脑是计算的机器。它们用数字处理事情。”


    “是的，”杰克同意道，“它们是处理数据的机器。数据就是信息的另一种说法——关于事物的实和知识。埃里克，你为什么不告诉我们了大的读者电脑是如何工作的呢？”


    “我以为你不会问的！”埃里克兴奋地回答道，“可能需要一整本书来准确描述。事实上，这就是为什么我们写了另一本叫《你并不笨——电脑与技术的简单化》的书，现在可以在亚马逊上购买！”![](img/Image00011.jpg)
    “埃里克！”杰克插话道，“别再推销书了！”


    “抱歉，老习惯了，”埃里克道歉道，“你知道我以前曾在世界卖太阳镜吗？”杰克敲了敲脚。“所以，正如我所说的，”埃里克笑道，“电脑是使用电力运行（做事情）的机器。它们处理数据（信息）。电脑有几个电流通过的部位。电脑不是活的——它们只是工具，就像割草机或锤子。我们用它们来替我们做事。电脑只是遵循指令——指令是告诉它们该做的命令。”![](img/Image00012.jpg)
    “埃里克！”杰克喊道，“摘掉那些太阳镜！我们在里面呢，”埃里克笑着摘下眼镜。“我的意思是技术是机器以及我们告诉机器去执行的事情。”


