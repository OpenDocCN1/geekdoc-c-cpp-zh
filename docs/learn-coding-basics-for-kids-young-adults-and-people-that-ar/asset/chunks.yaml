    “Okay, Erik,” Jack started, “I watched your video and just finished washing my
    eyes. Let’s get to work.”​ “Haters are going to hate,” Erik said, “and I’m just
    going to shake it off!”​ “The first step to adding Python to your computer is
    to go here on the internet:python.org![](Image00031.jpg)​ “Then click Downloads
    and select the newest version (type) of Python (the one with the highest number).”![](Image00032.jpg)​
    “After you click on the newest version of Python, you should see a little rectangle
    in the bottom of your screen that looks something like this:”![](Image00033.jpg)​
    “If you don’t see it there, check in your computer’s Downloads folder.”![](Image00034.jpg)​
    “Click on the rectangle that says ‘python...’ on the bottom of your screen or
    the file named ‘python...’ inside your Downloads folder. When it opens, click
    ‘Install Now.’”![](Image00035.jpg)“When it asks you, ‘Are you sure?’ click Yes.
    Then when you see ‘Setup was successful,’ you can click ‘Close.’ Now don’t worry
    if the pictures you see and the names and numbers on your screen are slightly
    different than our pictures – technology changes all the time. All that’s important
