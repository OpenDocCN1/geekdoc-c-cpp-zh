    TO DO WITH THIS?​ “Erik, who is this guy?” Jack said while holding a picture.![](Image00026.jpg)​
    “That’s Guido van Rossum,” Erik answered, “the guy that created the programming
    language Python.”​ “Oh man, he must be a really smart guy if he created an entire
    programming language!” Jack announced. “So, why did he call it Python? Does he
    love snakes?”​ “Actually, it’s named after an old television show from the 1960s
    and 1970s. The show was called ‘Monty Python’ and it was really funny. Guido was
    a big fan!”![](Image00027.jpg)(Monty Python actors)​ “Erik, you’re so old…” Jack
    said. “So, why are we using Python in this book?”​ “Simple,” Erik started, “because
