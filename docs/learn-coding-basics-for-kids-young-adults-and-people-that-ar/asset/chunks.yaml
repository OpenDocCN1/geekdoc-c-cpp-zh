    \n结束（目前如此……）\n\n结语你已经完成了我们的书！工作得出色！要开始的话，请访问学院的网站：learncodinganywhere.com 如果你是孩子或年轻人，我们建议在\
    \ Tech Academy 入读。以下是数千学生选择学院的一些原因：\n1. 我们的课程——它是现代的（随时间推移依然有效），涵盖了 1-2 种语言。我们全面的课程确保学生不会被局限（限制在特定类别）在小技能范围内。理解大量技术不仅为他们进入工作场做准备，而且对他们非常有帮助。\n\
    2. 我们的训练营价格合理。事实上，我们的学费低于全国训练营的平均成本。\n3. 我们不需要技术背景或经验。你不需要先知道编程就可以学习编程。只要学生会阅读、写作和进行基础数学计算，他们就能在学院取得成功。\n\
    4. 我们有极佳的在线声誉。我们在顶级网站上的平均评价评分在 4.5 到 4.9 星之间。我们连续多年获得 SwitchUp.Org 和 CourseReport.Com（两个顶级训练营评论网站）的“最佳训练营”奖，并被列入其他顶级训练营名单中。我们还被“世界之”电视节目选为“世界最佳代码学校”。所有的奖项和评价都是基于我们课程的学生和毕业生的反馈。\n\
    5. 我们非常灵活。学生可以选择自己的学习计划。他们可以在家里学习、在我们任何一个校区学习，或者两者兼顾。他们可以 24 小时访问他们的程序。这确保了学生无论情况如何都能入学。程序是自主进度的这是我们灵活性的方面——学生可以快速通过熟悉的内容，对新概念花时间。灵活性的另一个因素是我们提供开放注册，这意味着学生可以随时开始。\n\
    6. 我们的招生人员和流程透明且乐于帮助。我们回答问题并很有礼貌，从开始就给学生良好的体验。要开始的话，请访问学院的网站：learncodinganywhere.com\
