    ]>>> for Each_One in Fruits:print (Each_One)10.                    Define a function
    that returns a string variable.HINT:>>> def My_function():print("This is my function"
    )>>> My_function()11.                    Create a list of numbers and sort it.HINT:>>>
    Numbers = [80, 20, 50, 30, 90, 10, 100, 40, 70, 60]>>> Numbers.sort()>>> print
    (Numbers)12.                    Create a list of strings and alphabetize it.HINT:>>>
    Colors = [''Red'' , ''Yellow'' , ''Blue'' , ''Green'' , ''Black'' , ''Gray'' ,
    ''White'' ]>>> Colors.sort()>>> print (Colors)​ As the reader nailed the challenge,
    Erik climbed into a huge cannon. Jack lit the fuse and counted down from 10\.
    But the reader finished the challenge with 3 seconds left and the cannon exploded
    early! Erik flew across the sky and pulled out a skateboard. He then rode his
    skateboard down a rainbow and high-fived the reader!![](Image00070.jpg)​ “Cowabunga!”
    Jack yelled. “This reader is a coding master! So, Erik, this is all fine and dandy
    but what about making games and stuff with Python.”​ Erik set his skateboard down.
    Took off his kneepads and elbow pads, and stored it all in the closet with his
    helmet. Then he said, “Well, Jack, modern games have thousands and thousands of
    lines of code – some even have millions.”​ “You’re right. And there are hundreds
    to thousands of people that work on some of these games…”​ “But that doesn’t mean
    we can’t make very basic games in Python.”​ “That’s exactly what we are going
    to do in the next chapter!”CHAPTER SIXTEENROCK, PAPER, SCISSORS​ Jack and Erik
    played rock paper scissors. Jack played scissors, Eirk played paper. They played
    again – Erik played paper, Jack played scissors. Then they went another time,
    Jack played scissors and Erik played paper.​ “Erik,” Jack said, “I don’t think
    you’re understanding this. You always pick paper!”​ “I’ll get you someday,” Erik
    promised. “Some day, you’ll pick rock...”​ Jack shook his head and marked the
    score on the chalkboard.![](Image00071.jpg)​ “I know!” Jack announced. “Let’s
    make a rock, paper, scissors game in Python! Step one, create a new file in the
    text editor and save it as Rock_Paper_Scissors_Game.py on your desktop. Within
    this new file, write the following code:”def start():print (''This is my Rock
    Paper Scissors Game!'' )Player_One = ''Jack''Player_Two = ''Erik''def choices(Player_One_Choice,Player_Two_Choice):if
    Player_One_Choice == ''rock'' and Player_Two_Choice == ''paper'' :return (''Paper
    covers Rock! '' + Player_Two + '' wins!'' )elif Player_One_Choice == ''paper''
    andPlayer_Two_Choice == ''rock'' :return (''Paper covers Rock! '' + Player_One
    + '' wins!'' )elif Player_One_Choice == ''scissors'' andPlayer_Two_Choice == ''paper'':return
    (''Scissors cuts paper! '' +Play_One + '' wins!'' )elif Player_One_Choice == ''rock''
    andPlayer_Two_Choice == ''scissors'' :return (''Rock smashes Scissors! '' +Player_One
    + '' wins!'' )elif Player_One_Choice == ''paper'' andPlayer_Two_Choice == ''scissors''
    :return (''Scissors cuts paper '' +Player_Two + '' wins!'' )elif Player_One_Choice
    == ''scissors'' and Player_Two_Choice == ''rock'' :return (''Rock smashes Scissors!
    '' +Player_Two + '' wins!'' )elif Player_One_Choice == Player_Two_Choice:return
    (''Jack and Erik tied'' )else :return (''Please type Rock, Paper or Scissors!''
    )Player_One_Choose = input (''Does '' + Player_One + '' choose Rock, Paper orScissors?
    '' ).lower()Player_Two_Choose = input (''Does '' +Player_Two + '' choose Rock,
    Paper orScissors? '' ).lower()print (choices(Player_One_Choose, Player_Two_Choose))def
    Play_Again ():Again = input (''Would you like to play the game again? '' ).lower()if
    Again == ''No'' .lower():quit()if Again == ''Yes'' .lower():start()else :print
    (''Please enter Yes or No. Thankyou!!'' )Play_Again()Play_Again()start()“Save
    and run your code,” Jack instructed. “Play the game a few times. Well done! Now,
    read through your code again, line by line and figure out what each line does
    exactly. Everything in this code was data covered in this book!”“Well done!” Erik
    yelled. “You made a working game. Now here is your challenge:“1.       Change
    the Player_1 and Player_2 names from Jack and Erik to names of our choosing.“2.       
    Make the game Elephant, Cat, Mouse instead!”​ “Huh? Elephant, cat, mouse?” Jack
    asked.​ “Yeah,” Erik answered. “Elephant beats cat . Cat beats mouse . Mouse beats
    elephant .”​ “So, you want them to change their code so that rock is elephant
    , paper is mouse , and scissors is cat or something?”​ “Exactly.”​ “I’ve never
    heard of that game but it sounds like an interesting idea! Go for it!”As the reader
    customized their program, an elephant walked into The Tech Academy. Jack and Erik
    were terrified as the elephant stomped towards them. Then suddenly, just as the
    reader completed their challenge, a mouse ran out, jumped up and ate a piece of
    cheese that was stuck to Erik’s beard! The elephant trumpeted in terror and ran
    out of the room.A cat chased the mouse away and everything returned to normal.
    Well, as normal as things can be when Jack and Erik are involved.![](Image00072.jpg)“Well,
    Erik,” Jack began. “Our incredible reader has done it again. Another challenge
    completed successfully.”“I know!” Erik announced. “It’s so sad that the next chapter
    is the last coding assignment.”“There, there, Erik. We will have other books for
    the reader.”“You’re right. Now let’s make a hangman game in Python!”CHAPTER SEVENTEENHANGMAN​
    Erik stood alone on the top of Mount Everest. The sun was setting as he scratched
    behind the ears of an albino sasquatch. “Oh, Betty Sue,” Erik sighed, “I am going
    to miss the reader.”“Arrgghhh! Shhhraaaamuuuuk!” Betty Sue, the great white sasquatch,
    roared in agreement.Jack parachuted down and landed several feet away. He had
    never felt very comfortable around Betty Sue – even though she was a vegan.![](Image00073.jpg)“Erik,”
    Jack pleaded. “I know it’s sad but the book can’t go on forever. Besides, we are
    going to make another cool game in Python!”“Alright, alright,” Erik answered.
    “But first, Betty Sue and I need to finish dinner.”Erik and Betty Sue chewed on
    random plants – a tree, grass, and a bush that Erik sometimes liked to hide behind
    when he was feeling scared. Jack ate a pepperoni pizza that he had in his backpack.Once
    everyone was full, Betty Sue shouted, “Mooonnngeeeessoooo – kuuurrraaaakkkk!”
    and stomped off into her cave. Jack and Erik walked into a teleporter that was
    nearby and teleported back to The Tech Academy.​ “Well, dear reader,” Jack began,
    “we have grown close to you over these many chapters. And we’ve now come to the
    final program we will write in this book. It’s been a long and interesting journey
    and we want to thank you for putting up with us.”Erik said, “Let’s start our program
    by creating a New File in the text editor, and naming it hangman.py. Save hangman.py
    on your desktop. Then within the text editor, write the following code:”Name =
    input (''Please enter the name of the person who created this game: '' )print
    (''This game was made by the amazing '' +Name + ''!'' )print (''Welcome to my
    guessing game!'' )print (''In this program, you will try to guess aword that I
    chose.'' )print (''Good luck!'' )def start ():Player_Name = input (''What is the
    name of theplayer? '' )print (''Greetings, '' + Player_Name + ''! It istime to
    guess!'' )Secret_Word = ''ostrich''Guesses = ''''Turns_Left = 11while Turns_Left
    > 0:Wrong_Answers = 0for Letter in Secret_Word:if Letter in Guesses:print (Letter)else
    :print (''_'' )Wrong_Answers += 1if Wrong_Answers == 0:print(''YOU WIN! You guessed
    my word: '' + Secret_Word + ''!!!!!'' )[Toggle screen reader support](https://docs.google.com/document/d/1_Xdqm6tvTxvBuW8rG05lonL5pqLNQ9dvtN7XoSrHaFA/edit)Show
    side panelbreakGuess = input (''Guess a letter here: '' ) .lower()Guesses += Guessif
    Guess not in Secret_Word:Turns_Left -=1print (''Oops! This letter is not inmy
    word. Please try again.'' )print (''You have '' + str (Turns_Left)+ '' more guesses
    left. You can do it!'' )if Turns_Left == 0:print (''GAME OVER'' )def Play_Again
    ():Again = input (''Would you like to play again? '' ).lower()if Again == ''No''
    .lower():quit()if Again == ''Yes'' .lower():start()else :print (''Please enter
    Yes or No. Thank you!'' )Play_Again()Play_Again()start()“Save and run your code,”
    Erik instructed. “You should have a friend or family member play the game to try
    to guess your secret word!”​ “Now, it’s time for the final challenge,” Jack said.
    “Do the following:“1.        Change the secret word.“2.        Change the number
    of guesses allowed in your program.”​ Jack and Erik simply stared as the reader
    completed the challenge. “You know, Jack.” Erik said. “I thought I’d be used 
    to it by now, but the reader of this book continues to surprise me.”​ “They never
    cease to amaze,” Jack agreed.​ “I’m not good at long goodbyes.”​ “Me either. And
    let’s not say goodbye. Let’s say, ‘Until next time.’”​ “Yeah, we will see you
    again soon!”​ “Thank you, reader, for showing us what a true coder is like. You’re
    a special person!”​ Jack tied a saddle to the back of a giant turtle, while Erik
    sat on Sally the ostrich’s back. They looked at the reader one last time, gave
    a happy wave, and then rode their animals off into the sunset.![](Image00074.jpg)THE
    END(FOR NOW…)EPILOGUEYou have completed our book! Well done on your hard work
    and persistence!​ You should now have a basic understanding of Python and coding.​
    If you’re a kid or young adult, you can check out The Tech Academy’s products
