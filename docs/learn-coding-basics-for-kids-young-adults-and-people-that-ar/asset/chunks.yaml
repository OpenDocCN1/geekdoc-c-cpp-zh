    So, to use Python we have to download it. Do you know what downloading means?”“Yes,
    but why don’t you say it?” Erik looked a little nervous and uncertain.“Download
    just means you’re taking something online (from the internet) and putting it on
    your computer. The internet is just a way to share information between computers.
    For example, if you download a video, you are having your computer pull the video’s
    data from the internet (from other computers) and save that data on your computer
    so you can watch it later. So, Erik, what’s the opposite of download ?”“Highload?”“Close,
    but no. The opposite of down load is up load. When you upload something, you are
    moving it from your computer to the internet. Like you could upload a video that
    you recorded to YouTube and then you could be famous! In the picture below, the
    large computers at the top are the ‘internet’ – powerful computers used to share
    information.”![](Image00028.jpg)​ “Hold on,” Erik said in excitement, “I can upload
    my videos and become famous?”​ “Well, I mean, it’s possible but not likely-”![](Image00029.jpg)​
    “Focus, Erik, focus,” Jack instructed, “you can upload your singing and dancing
    videos later. We have been talking for three chapters and the reader hasn’t been
    able to write any code yet. I say we get started!”​ “Yes!” Erik agreed. “So, what’s
    the first step?”​ “Well,” Jack began, “the first step is to download (take from
    the internet) and install (put on our computer) Python.”​ “That sounds hard.”​
    “Don’t worry Erik, we can get through it, together!”​ “You’re right,” Erik agreed
    happily. “But can we do it in the next chapter? There’s a certain video of me
    singing Taylor Swift that I just have to upload. The world needs to see my new
    dance move! I call it ‘The Gross’!”​ “Just so the reader knows, Gross is Erik’s
