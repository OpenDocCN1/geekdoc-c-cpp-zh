    have to write code exactly like we have it in the book .”“What?” Erik asked. “You’re
    saying one wrong thing, like a typo, makes it so that your code won’t work?”“Yeah,”
    Jack replied. “It can be a little annoying but those are the rules.”“So, to print
    something, I type print, followed by parentheses, then a quotation mark, then
    the text I want to print, then another quotation mark, and finally another parenthesis?”“Yep!
    Let me show you why it’s important to follow the rules of programming language
    exactly. Type this inside of IDLE:”>>> print (Hey there big, wonderful, happy,amazing,
    awesome planet Earth!!!!!!)“In our code,” Jack began, “we took out the quotation
    marks. Press enter. Now there is an error! Actually, it says ‘SyntaxError.’ What
    the heck is syntax , Erik?”“I know that word sounds complicated, but all that
    syntax is is the rules for a programming language,” Erik explained. “For example,
    including parentheses and quotation marks is part of the syntax for printing things
    in Python. A syntax error means that we broke the rules and didn’t type our code
    correctly.”“Interesting. Now, just so you know, you can also print things by surrounding
    your text with apostrophes. Type this inside IDLE:”>>> print (''Jack and Erik
    are the best'' )“Press enter,” Jack directed. “And thank you for saying we are
    the best!”​ “Now that’s some good code,” Erik stated. “So, Jack, do you know what
    the text that the computer displays is called?”​ “You mean, ‘Jack and Erik are
    the best!’?”​ “Yes, that.”​ “It’s called the truth!”​ “Well, yes. But technically,
    that text is called a string .”​ “What does sewing have to do with this?” Jack
    asked.![](Image00041.jpg)​ “Nothing,” Erik answered. “Jack, put that string away!
    You can sew a new pair of underwear later! In coding, a string is the word we
    use to say that we have one or more characters. Remember, characters are letters,
    numbers and symbols. It’s called a string because the characters are strung together
    (connected). The two strings that you printed in this chapter were:“1)              
    Hey there big, wonderful, happy, amazing, awesome planet Earth!!!!!!And“2)            
    Jack and Erik are the best!“Now, let’s give our intelligent reader a challenge,”
    Erik stated. “Reader, we challenge you to do this in IDLE:”●       Print a string
    of your own.After the reader successfully printed their own string, Erik and Jack
    shouted, ”Good job!”“Hey, Jack,” Erik said, “let’s do some math now.”“But I want
    to keep writing code in Python…” Jack complained.“That’s what I mean! We can do
    math with Python. I’ll show you in the next chapter.”CHAPTER FIVEMATH​ Erik stood
    in front of an empty classroom talking to no one but the reader and Jack. He was
    wearing suspenders and his favorite pair of dark pink glasses.![](Image00042.jpg)​
    “Welcome class!” Erik began a little too excitedly. “Today we are going to talk
    about math. Math is short for mathematics . The word mathematics basically means
    ‘to do things with numbers and shapes.’ It includes the study of numbers and what
    we can do with them. In math-”​ “Ooh, ooh!” Jack cried out raising his hand.​
    “Yes, student.”​ “Did you know that the word mathematics comes from the very old
    words mathematike , which meant ‘art,’ and manthanein , which meant ‘learn’?”​
    “Jack! I’m the one wearing suspenders which means I’m the one teaching this class.
    Now, as I was saying, in math, an operator is a symbol used when doing a math
    problem. These are all operators:●         ➕ (add),●         ➖ (subtract),●        
    ➗ (divide), and●         ✖ (multiply)“We use these operators to do math,” Erik
    stated.​ “Yes, now I remember,” Jack said. “Alright, our incredible reader, open
    up IDLE and type this code:”>>> 1 + 1​ “Press enter,” Jack instructed.“The answer
    is 3!” Erik announced.​ “Uh, Erik…” Jack started.​ “Just kidding,” Erik said blushing.
    “You should see 2.”​ “You can also subtract,” Jack stated. “Write this code in
    IDLE:”>>> 9 - 4​ “Press enter,” Jack directed. “Good job! Now, to multiply, we
    don’t write X, we use this symbol *,” Jack explained. “This little star is called
    an asterisk.”​ “An asteroid?” Erik asked.​ “No, asterisk.”​ “An amphibian?”​ “Nevermind,”
    Jack sighed. “So, to do multiplication, write this code in IDLE:”>>> 5 * 3​ “Press
    enter,” Jack said. “You got 15!”​ “That’s cool,” Erik said. “To divide, we use
    a forward slash /. It’s called a forward slash because it is a mark that looks
    like it’s leaning forward. Write this code in IDLE:”>>> 20 / 2​ “We just wrote
    twenty divided by two,” Erik explained. “Press enter. We got 10!”​ “That’s awesome!”
    Jack announced. “Erik, did you know that you can also use the plus sign to connect
    strings (text)? This is called concatenating strings . Concatenate is just a fancy
    word for connecting things together.”“Connecticut?” Erik asked.“No, concatenate.”“Co-”“Erik,
    I’m not doing this again… If you concatenate your cell phone to the cell phone
    charger, it means you connect the cell phone to the charger and your cell phone
    is now charging. In coding, if you concatenate the string ‘like’ with the string
    ‘able,’ you would get the string ‘likeable.’ To see this, write this code in IDLE:”>>>
    print (''Jack '' + ''and Erik '' + ''are having fun!'' )“Press enter,” Jack instructed.
    “We concatenated three strings! Which, again, is a fancy way of saying that we
    joined together these three groups of words:“1.   Jack“2\. and Erik“3\. are having
    fun!”“And now, dear reader,” Erik said as he looked right at you with intensity,
    “it’s time for a challenge. Do this in IDLE:”●       Add two numbers,●       Subtract
    two numbers,●       Divide two numbers,●       Multiply two numbers, and●      
    Concatenate two strings.Once you completed the challenge, Erik and Jack both did
    backflips at the same time and shouted, “You did it!” Erik landed on his feet
    and Jack landed on his head.“I feel like my brain is bigger!” Erik yelled. “So,
    Jack, what’s next?”“Well, let’s turn the page and find out!” Jack answered while
    he rubbed the top of his head.CHAPTER SIXDATA IN PROGRAMS​ Erik and Jack sat on
    a bench, staring at the sunset and dreaming about what it would be like to be
    as smart as you.​ “Well, Erik,” Jack said, “I just don’t think we could ever be
    that intelligent.”​ “You’re right,” Erik agreed, “the reader is just too smart.
    Let’s go back to the school and write some code.” They happily skipped down the
    street and walked back into the best school in the world: The Tech Academy.​ “Okay,
    now it’s time to learn a new word,” Erik said. “The word is vary .”​ “Like, Jack
    is vary handsome?” Jack joked.​ “No, not very , vary . They sound the same but
    they’re not the same word. Vary means to change . When something varies, it becomes
    different. Like the weather – it varies depending on the season – sometimes it’s
    hot, sometimes it’s cold.”​ “I try not to vary very much.”​ “Vary funny… Now when
    you add the word ‘able’ to the end of something, it means that that thing is able
    to do something – it can be done. For example, if something is eatable, you can
    eat it – or if something is breakable, it can be broken.”​ “So what?”​ “When you
    combine (put together) the words vary and able , you get the word variable . When
    something is variable, it means it can change – it is able to change. And so,
    variables are just things that can change.”​ “So, like a person’s hair or the
    length of your fingernails? These are both variables?”​ “Sure, they can change.
    When we talk about variables in coding, we are talking about data we use in a
    program that can be changed. For example, a person’s name or a color could be
    variables. There are two parts of variables:“1.  The name. Also called an identifier
    – something used to identify (say what something is). The variable’s name is used
    to identify an exact piece of data.“2\. The value. Value means amount or type
    . The value part of a variable shows the data we need to keep track of.”​ “Erik,
    you’re confusing me.”​ “Okay, allow me to explain this more. We use an equal sign
    to assign (give) a value to the name of a variable, like this:”Cat = Brown​ “We
    are telling the computer that the cat (name) is brown (value). This is a variable.
    Now that I’ve explained that, let’s create a variable. Open up IDLE and write
    this code:”>>> Jack = ''Funny''​ “Press enter,” Erik directed.​ “Why, thank you,
    Erik,” Jack said. “But nothing happened.”​ “Oh, something happened. The computer
    stored (saved) that variable, you just can’t see it. The variable name is Jack
    , and its value is the string (connected characters) Funny . To see it, type this
    code in IDLE:”>>> print (Jack)​ “Press enter,” Erik instructed.​ “Whoa!” Jack
    exclaimed. “How does that work?”​ “Well,” Erik began, “The computer associates
    (connects) the name Jack with the value Funny – it kind of thinks these are the
    same thing in a way. But now let me show you why it’s called a variable (something
    that can change). Type this code in IDLE and press enter after each line:”>>>
    Jack = ''Silly''>>> print (Jack)​ “Hey!” Jack argued.“We changed the variable!”
    Erik explained. “It now prints Silly instead of Funny .”​ “Oh, so that’s why it’s
    a variable – it can vary (change),” Jack said.“Exactamundo!” Erik proclaimed.
    “Now, I want you to try something. Type this code in IDLE:”>>> print (jack)​ “Here
    we wrote Jack with a lowercase j,” Erik explained. “Now press enter. It didn’t
    work! This goes back to that earlier word we used, syntax (the rules of a programming
    language). One of the rules in Python is to use consistent (always the same) capitalization.”​
    “Makes sense!” Jack exclaimed. “We can also do math with variables. Write this
    code in IDLE and press enter after each line:”>>> Jack = 10>>> Erik = 20>>> Jack
    + Erik​ “Whoa!” Erik yelled. “You turned our names into numbers!”​ “Yep!” Jack
    agreed. “Technically, what we did here is assigned (created) two variables:“1. 
    Jack (the variable name), 10 (the variable value), and“2\. Erik (name), 20 (value).​
    “Then we added these variables together!” Jack explained.“Awesome!” Erik shouted.
    “Okay, our dearest friend, the reader of this book, the champion of the centuries,
    the mermaid in the sky, the-”​ “I think they get it, Erik.”​ “Okay, okay, here
    is your challenge. Open IDLE and do the following:”●       Create your own variable,●      
    Print your variable,●       Create two variables and add them together, and●      
    Create two variables and subtract one from the other.​ Jack and Erik stared in
    awe as the reader did a better job at this challenge than either of them could’ve
    ever hoped for. Once you finished, they hugged each other, crying.![](Image00043.jpg)Jack
    wiped the tears off of his eyes and said, “It’s just so amazing...”​ Erik blinked
    away his tears and said, “In the next chapter, we will go over how to compare
    things in Python.”CHAPTER SEVENCOMPARING NUMBERS​ Jack threw his phone down in
    frustration. “What is it, old friend?” Erik asked.“I just Googled how to become
    as good looking as the person reading this book,” Jack replied, “and it’s just
    not possible!”​ “Well, if you can’t do it, I certainly have no hope.”​ “Thanks,
    grandpa Erik.”​ “I’m not your grandpa!”​ “I know, but you are a grandpa – you
    have grandchildren.”​ “Ahem,” Erik cleared his throat nervously and then chuckled.
    “My age has nothing to do with this book. And if I am a grandpa (not saying I
    am) I am the coolest grandpa in the world. Now then, let’s look at how to compare
    numbers in Python. This is done by using these symbols:> which mean more than<
    which means less than”![](Image00044.jpg)​ “Those look like little mouths turned
    to the side,” Jack stated. “Like tiny pacmen, wanting to eat something.”![](Image00045.jpg)​
    “I mean, I guess you could look at it that way,” Erik answered. “The ‘mouth’ always
    points toward the bigger number. Like this:10 > 4 (this means ten is bigger than
    four) or 5 < 12 (this means five is smaller than twelve).”​ “Cool!” Jack announced.​
    “In Python,” Erik continued, “when we compare numbers, the computer either tells
    us True or False. For example, this is True:12 < 35 (twelve is less than thirtyfive)​
    “But this is False:16 > 32 (sixteen is not more than thirtytwo)​ “This is easier
    to understand by writing code. Write this code in IDLE:”>>> 195 > 57​ “Press enter,”
    Erik instructed. “That’s True! Because 195 is a bigger number than 57\. Now write
    this code in IDLE:”>>> 35 > 87​ “Press enter,” Erik said. “That’s False! Okay,
    now let’s try the lesser than sign (<). Write this code in IDLE:”>>> 45 < 70​
    “Press enter,” Erik commanded. “That’s True!>>> 311 < 182​ “Press enter,” Erik
    directed. “That’s False!”​ “Okay,” Jack said, “Now let’s get fancier. Write this
    code in IDLE and press enter after each line:”>>> Erik = 100>>> Jack = 50>>> Erik
    > Jack​ “Hey!” Erik yelled, “You just said ‘Erik is bigger than Jack!’ I’m on
    a diet!”​ “But you’re eating a doughnut right now!” Jack replied.​ “Yeah, I’m
    on the doughnut diet!”![](Image00046.jpg)​ “I don’t think that’s a thing…” Jack
    disagreed. “Anyways, did you know that < and > are actually operators (symbols
    or words used to perform actions on numbers or compare things)? Alright, for our
    genius reader, we have another challenge. Do the following in IDLE:”●       Get
    the computer to return True by using the > operator,●       Return False using
    the > operator,●       Get the computer to return True by using the < operator,●      
    Return False using the < operator, and●      Assign (create) two variables as
    numbers, and then compare them using either the < or > operator.​ As the reader
    worked on the challenge, Erik searched for Jack. He couldn’t find him anywhere.
    Erik looked through the whole school and, finally, decided to check the roof.
    When he climbed on the roof, he found Jack staring at a beautiful rainbow.​ “What’s
    wrong, Jack?” Erik asked.​ “Nothing, Erik the grandpa,” Jack answered. “Absolutely
    nothing. I was just looking at this rainbow – the most beautiful rainbow I have
    ever seen and I realized something. The way the reader of this book completed
    our challenge was more beautiful than the beautifulist rainbow. I am just… amazed…”​
    Erik stood next to Jack and gazed at the rainbow in total agreement.​ “In the
    next chapter,” Jack said, “we should go over other ways we can make comparisons
    with Python.”​ “Sounds good, Jack. Let’s head back down into the school.”![](Image00047.jpg)CHAPTER
    EIGHTDATA COMPARISONS“Hey, Jack,” Erik said. “Why did the computer wear glasses?”“Erik,”
    Jack responded, “computers don’t wear glasses.”“To fix its websight.”Jack shook
    his head. “Are you trying to get our reader to close the book?”“They love it!
    Okay, did you know that two equal signs (==) means something special in Python?”​
    “That’s right!” Jack answered. “Using two equal signs compares two pieces of data
    to see if they’re equal (the same).”![](Image00048.jpg)“This is easiest to show
    by putting it to use,” Jack explained. “Write this code in IDLE:”>>> 4 == 4“Press
    enter,” Jack instructed. “We get True because four is equal to four. To get False,
    write this code in IDLE:”>>> 4 == 5​ “Press enter,” Jack directed. “Four is not
    the same as 5.”​ “That’s cool, Jack!” Erik announced. “Did you know we can compare
    variables in the same way? Write this in IDLE and press enter after each line:”>>>
    Jack = 15>>> Erik = 15>>> Jack == Erik​ “We get True!” Erik proclaimed. “Now write
    this in IDLE, pressing enter after each line:”>>> Erik = 100>>> 100 == Erik​ “We
    get True again!” Erik yelled.​ “So, Erik, did you know you can also make comparisons
    using words?” Jack asked.​ “How does that work, Jack?”​ “Well, I’ll show you.
    The word AND can be used to see if two pieces of information are both True. Let’s
    see this in action. Write this code in IDLE and press enter after each line:”>>>
    Jack = 33>>> Erik = 51>>> Jack is 33 and Erik is 51“We get True!” Jack announced.
    “In addition to using and , we actually used is . In Python, is means the same
    thing as the double equal sign (==) we used earlier. Meaning, is and == both check
    to see if the data on both sides is the same. Let’s do another one. Write this
    code in IDLE:”>>> 5 > 3 and 9 < 10​ “It’s True!” Jack proclaimed. “Five is larger
    than three and nine is smaller than 10! To get False, write this code in IDLE,
    pressing enter after each line:”>>> Erik = 5>>> Erik is 5 and 4 > 10​ “Even though
    the variable name Erik was assigned the value 5 (meaning, it is True that Erik
    is 5), 4 is not bigger than 10,” Jack explained, “that’s why we get False. When
    we use and , both pieces of data must be True to return True.”​ “That’s awesome,
    Jack!” Erik announced. “And we can use the word OR in Python. OR checks to see
    if one or both pieces of data are True. Let’s see how this works by redoing the
    code we just wrote, using or instead of and . Write this code in IDLE, pressing
    enter after each line:”>>> Erik = 5>>> Erik is 5 or 4 > 10​ “Now we get True!”
    Erik announced. “That’s because at least one of the pieces of data is True. Remember,
    OR checks for one or both, but with AND both must be True. Let’s show this by
    seeing what happens when both pieces of data are True. Write this code in IDLE:”>>>
    5 == 5 or 10 is 10​ “Press enter,” Erik instructed. “This is True because five
    is five and ten is ten. Now write this code in IDLE and press enter after each
    line:”>>> Jack = "happy">>> Erik = "silly">>> Erik is "Silly" or Jack is "Happy"​
    “We got False!” Erik shouted. “Why? Because we capitalized Silly and Happy, which
    was incorrect because when we assigned the values to the variable, we wrote them
    in lowercase. The computer sees Silly and silly , as different things. Because
    both sides of or were False (not the same) we got False.”​ “I think I get it,”
    Jack stated. “Another one we can use is not . It’s easiest to explain by using
    it.”“Yeah,” Erik agreed, “So go ahead and write this code in IDLE:”>>> 5 is not
    10 and Jack is not "Hilarious"“And press enter,” Erik instructed, “We get True!
    That’s because 5 is not the same as 10, and Jack is not funny.”“Wow, Erik,” Jack
    responded. “Okay, my turn. But first, did you know that you can use an ! (exclamation
    point) to mean not ? Write this code in IDLE and press enter after each line:”>>>
    Erik = ''dork''>>> Erik != ''cool''​ “The != says, ‘Erik is not equal to cool,’”
    Jack explained.​ “Moving on…” Erik said. “We can also combine the < and > operators
    with =. For example, >= means ‘greater than or equal to’ and <= means ‘lesser
    than or equal to.’ Write this code in IDLE and press enter after each line:”>>>
    Jack = 20>>> 20 >= Jack​ “We get True!” Erik announced. “Because 20 is equal to
    Jack.“Now, write this code in IDLE and press enter after each line:”>>> Jack =
    25>>> Erik = 50>>> 50 >= Jack​ “We also get True!” Erik stated. “Because 50 is
    more than 25 (the value assigned to Jack).”​ “Well, Erik,” Jack said, “this has
    been one of our longest chapters, so I think we should end it with a challenge.
    To our friend, the reader, use the following operators in IDLE:”●       ==,●      
    is not,●       and,●       or,●       !=, and●         <=.'
