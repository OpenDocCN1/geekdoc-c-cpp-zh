  5. (123) 是一个元组吗？\n\n**答案：**\n1. 字典/列表和元组\n2. 列表可以修改，元组不可以\n3. 可以，为什么不呢？\n4. 恰好一个\
  \ - 所有键都是唯一的\n5. 不是 - 忘记了一个逗号\n\n## 练习\n\n**问题：** 使用 Python 获取 Natasha 的年龄。\n\n\
  **答案：**\n`ages['Natasha']`\n\n## 练习\n\n**问题：** 去掉 Matt。\n\n**答案：**\n```python\n\
  1. ages.pop('Matt')\n```\n\n### 循环\n\n集合可以用来存储数据，但你也可以遍历它们并对每个元素单独进行操作。\n\n在 Python\
  \ 中有两种类型的循环可以使用：`while` 和 `for`。\n\n`while` 循环在特定条件为真时会持续重复。\n\n`while` 循环内部的语句必须缩进，就像其他其他代码块一样。\n\
  \n循环必须使用 `while` 关键字、布尔语句和一个冒号来定义。\n\n布尔语句可以是一个函数调用、变量或比较语句。\n\n![](img/00023.jpeg)\n\
  \n这段代码将打印数字 1 到 10\n```python\n1. aps = 0\n2. while aps < 10:      #测试\n3. aps +=\
  \ 1            #计数器\n4. print(aps)          #语句 1\n5. print (\"and\")       #语句\
  \ 2\n6. print (\"Done\")      #循环退出\n```\n\n### While\n\nPython 提供了 `break` 和 `continue`\
  \ 语句来更好地控制你的循环。\n\n![](img/00024.jpeg)\n```python\n1. while test1>:\n2. <statement1>\n\
  3. if test2>: break    #循环退出，跳过\n4. if test3>: continue  #跳转到顶部\n5. else:\n6. <statement2>\
  \        #如果没有发生 break，则执行\n```\n\n### 循环\n\n![](img/00025.jpeg)\n\n你可以使用 `for`\
  \ 循环来遍历集合。假设你有以下列表：\n\n```python\n1. a = [\"one\", \"two\", \"three\"]\n```\n\n\
  为了单独打印每个元素，你可以使用 `for` 循环：\n\n```python\n1. for item in a:\n2. print(item)\n```\n\
  \nfor 循环必须使用 `for` 关键字、一个变量、`in` 关键字、集合名和一个冒号。for 循环内部的语句必须缩进。\n\n你可以使用 `for` 循环来遍历集合。假设你想将一个整数列表写入文件：\n\
  \n```python\n1. the_file = open(\"integers.txt\", \"w\")\n```\n\n每个整数单独占一行：\n\n\
  ```python\n1. for integer in integers:\n2. the_file.write(str(integer) + '\\n')\n\
  ```\n\n这段代码将输出：\n\n1\n2\n3\n4\n5\n\n当你完成文件操作后，必须关闭它：\n\n```python\n1. the_file.close()\n\
  ```\n\n你也可以从文件中读取数据。\n\n首先，不使用 `w` 标志打开文件：\n\n```python\n1. the_file = open(\"integers.txt\"\
  )\n```\n\n获取文件中所有的行：\n\n```python\n1. lines = the_file.readlines()\n```\n\n`readlines()`\
  \ 函数将文件中的所有行作为字符串列表返回。\n\n让我们打印这些行：\n\n```python\n1. for line in lines:\n2. print(line)\n\
  ```\n\n## 文件操作\n\n大多数文件操作可以归纳为：打开文件、读取文件、向文件写入数据以及关闭文件。通常你写入文件的数据是文本的。\n\n假设你想将一个整数列表写入文件，使每个整数单独一行。首先，打开文件：\n\
  \n```python\n1. the_file = open(\"integers.txt\", \"w\")\n```\n\n`open` 函数的第一个参数是文件路径，第二个参数告诉\
  \ Python 你要向文件中写入。这意味着在开始之前文件不需要存在。\n\n该函数返回一个你可以以后使用的文件对象。\n\n首先让我们定义一个整数数组并将其写入文件：\n\
  \n```python\n1. integers = [1, 2, 3, 4, 5]\n2. for integer in integers:\n3. the_file.write(str(integer)\
  \ + '\\n')\n```\n\n`write` 方法接受字符串作为参数并写入文件。注意 `\\n` 符号 - 这是换行符。它在文件中开始新的一行。\n\n\
  当你完成文件后，必须关闭它：\n\n```python\n1. the_file.close()\n```\n\n你也可以从文件中读取数据。\n\n首先，不使用\
  \ `w` 标志打开文件：\n\n```python\n1. the_file = open(\"integers.txt\")\n```\n\n获取文件中所有的行：\n\
  \n```python\n1. lines = the_file.readlines()\n```\n\n`readlines()` 函数将文件中的所有行作为字符串列表返回。\n\
  \n让我们打印这些行：\n\n```python\n1. for line in lines:\n2. print(line)\n```\n\n\n\n\n\n\
  ## 问题\n1. 换行符是什么样子的？\n2. 在完成文件操作后，你应该对文件做什么？\n3. 使用什么种方法将数据写入文件？\n4. 你应该使用什么方法从文件中获取所有行？\n\
  \n## 答案\n1. `\\n`\n2. 关闭它\n3. `write`\n4. `readlines`\n\n## 异常\n\n有时会发生意想不到的情况，导致程序无法按预期执行。这些事件被称为“异常”。\n\
  \n```python\n>>> 1 / 0\n```\n\n按下回车键后，你将看到以下输出：\n\n```text\nTraceback (most recent\
  \ call last):\n  File \"<stdin>\", line 1, in <module>\nZeroDivisionError: division\
  \ by zero\n```\n\n这被称为异常回溯（traceback）。它显示了在异常发生之前调用了哪些函数或方法。最后一行告诉你发生了哪种异常，并提供了一些额外的、人类可读的信息。\n\
  \n在 Python 中，你可以通过 `try/except` 块来实现这一点。\n\n### 如果在重要任务执行过程中发生异常怎么办？\n\n让我们打印“division\
  \ by zero. But it is totally fine.”，而不是抛出回溯。\n\n```python\ntry:\n    1 / 0\nexcept\
  \ ZeroDivisionError as e:\n    print(str(e) + “. But it is totally fine.\")\n```\n\
  \n在上面的代码中，你可以看到你想要尝试执行的语句放在 `try` 块中。所有的错误处理代码都放在 `except` 下方。`except` 关键字必须带有一个异常类。它后面也可以跟一个\
  \ `as` 关键字和一个变量，该变量用于存储对错误的的人类可读描述。\n\n### 自定义异常\n\n你可以定义自己的异常类，以进一步通知代码中发生了非常情况：\n\
  \n```python\nclass YourException(Exception):\n    pass\n```\n\n所有自定义异常必须以一个内置的 Python\
  \ 异常作为父类。这些异常不需要实现任何其他逻辑。\n\n为了抛出异常，你应该使用 `raise` 关键字：\n\n```python\nraise YourException(\"\
  Human-readable message\")\n```\n\n一旦执行了上述代码，你将看到一个带有“Human-readable message”字符串作为额外细节的回溯。处理自定义异常与处理内置异常没有区别：\n\
  \n```python\ntry:\n    raise YourException(\"Human-readable message\")\nexcept YourException\
  \ as e:\n    print(\"Your exception just occured with a message: \" + str(e))\n\
  ```\n\n### 测验\n问题：\n1. 哪个块应该被用于处理异常？\n2. 发生异常时打印出的长文本块称为什么什么？\n\n答案：\n1. `try/except`\
  \ 块\n2. `traceback`\n\n![](img/00026.jpeg)\n\n## 导入语句、Python 模块和包\n\n正如你可能注意到的，Python\
  \ 中所有的源代码都存储在各种名为 `modules`（模块）的文件中。每个模块都有 `.py` 扩展名。不同的模块在逻辑上组合成被称为 `packages`（包）的集合。包是一个包含\
  \ `__init__.py` 文件的文件的普通文件夹。\n\n例如，以下是一个包：\n```text\nfoobar/\n  __init__.py\n  one.py\n\
  \  two.py\n  three.py\n```\n\n而这个不是：\n```text\nfoobar/\n  one.py\n  two.py\n  three.py\n\
  ```\n\n默认的 Python 安装带了大量的 `packages`。这组包被称为 `standard library`（标准库）。\n\n### 导入语句\n\
  \n如果你想使用另一个包中存储的功能，你必须使用 `import` 语句。让我们使用 Python 解释器在屏幕上打印你的用户名：\n\n```python\n\
  >>> import getpass\n>>> getpass.getuser()\n'gunther'\n```\n\n上面的片段显示了如何导入最顶层的包。正如你所见，包的成员应该通过点运算符（dot\
  \ operator）访问。你可以通过直接导入你需要的内容来避免使用点运算符：\n\n```python\n>>> from getpass import getuser\n\
  >>> getuser()\n'gunther'\n```\n\n为了指定导入的来源，你必须使用 `from` 关键字。\n\n有时你可能想使用同一个包中的多个实体。在这种情况下，直接导入所有实体更为简单：\n\
  \n```python\n>>> from sys import pydebug, flags\n```\n\n注意，留在 Python 包内部的实体可以是几乎任何\
  \ Python 结构。一个 `class`、一个 `function`、一个 `variable`、一个 `module` 甚至一个 `package`（可以嵌套包的）。\n\
  \n### 测验\n问题：\n1. Python 源文件的同义词是什么？\n2. 带有 Python 模块的文件夹术语是什么？\n3. 与默认 Python 安装一起而来的包集合称为什么？\n\
  4. 如何从 `os` 包中导入模块路径？\n\n答案：\n1. `module`\n2. `package`\n3. `standard library`\n\
  4. `from os import path`\n\n## 使用 os 模块进行文件操作\n\n虽然可以使用内置的 Python 函数和方法来处理文件，但它们并没有涵盖你在操作计算机文件系统时可能遇到的所有场景。本章节提供了你在处理数据时在底层可能面临的所有常见任务的概述。\n\
  \n注意：下面的某些示例使用了 `/`。在 Windows 上，请将斜杠替换为 `\\`。\n\n首先，假设你有如下结构：\n```text\n/parent/\n\
  \  one.txt\n  two.txt\n  three.txt\n```\n\n首先，让我们进入 `parent` 目录。为了获取当前目录的绝对路径，你应当使用\
  \ `os.path` 中的 `abspath` 和 `curdir`：\n\n```python\n>>> from os.path import abspath,\
  \ curdir\n>>> curdir\n'.'\n>>> abspath(curdir)\n'/parent'\n```\n\n`abspath` 接收任何路径并返回绝对路径。现在删除\
  \ `one.txt` 并将 `two.txt` 重命名为 `bar.txt`。为了这样做，你需要标准库 `os` 中的两个函数：\n\n```python\n\
  >>> from os import remove, rename\n>>> remove(\"one.txt\")\n>>> rename(\"two.txt\"\
  , \"bar.txt\")\n```\n\n正如你可能注意到的，提供文件名时必须给出相对路径或绝对路径。如果是绝对路径，它应该从文件系统的根开始。绝对路径在\
  \ UNIX 和 Windows 上分别类似于：\n- `/Blah/Blah/one.txt`\n- `C:\\Blah\\Blah\\one.txt`\n\n\
  相对路径相对于你的当前目录计算。假设你在 `/foo/bar/one` 目录，你想移动到 `/foo/two`。在这种情况下相对路径应该是 `../../two`。两个点表示父目录。由于由于由于，由于\
  \ Unix 和 Windows 使用不同的分隔符，上面的 `remove/rename` 代码片段有一个严重的缺陷。它不是跨平台的。为了将其转换为通用的，你应该使用\
  \ `os.path` 中的 `join` 函数：\n\n```python\n>>> from os.path import join\n>>> remove(join(\"\
  foo\", \"one.txt\"))\n>>> rename(join(\"foo\", \"two.txt\"), join(\"foo\", \"bar.txt\"\
  ))\n```\n\n你将路径的所有部分作为字符串传递给 `join` 函数，然后使用操作系统特定的路径分隔符来生成字符串。你可以列出特定目录下的所有文件文件夹：\n\
  \n```python\n>>> from os import listdir\n>>> listdir(\"foo\")\n['bar.txt', 'three.txt']\n\
  ```\n\n现在尝试删除 `foo` 目录：\n\n```python\n>>> from os import rmdir\n>>> rmdir(\"foo\"\
  )\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in <module>\n\
  OSError: [Errno 39] Directory not empty: 'foo'\n```\n\n哎！我们引发了一个异常。只要目录内还有任何东西，它就无法被删除。\n\
  \n\n\n\n\n1. Windows 和 Linux 文件系统之间的什么主要差异使得编写跨平台 Python 程序变得更加困难？\n2. `os.path.curdir`\
  \ 的值是什么？\n3. 哪个字符串代表当前目录的父目录？\n\n#### 答案：\n1. 不同的路径分隔符：Unix 上使用 `/`，Windows 上使用\
  \ `\\`\n2. `.`\n3. `..`\n\n## 练习\n\n### 题目：\n修复上一个示例中的 `rmdir` 代码使其能够工作。\n\n####\
  \ 答案：\n要做到这一点，你只需要先删除内部所有的文件：\n```python\n>>> remove(\"foo/bar.txt\") # 你重命名了它\n\
  >>> remove(\"foo/three.txt\")\n>>> rmdir(\"foo\")\n```\n\n## 练习\n\n### 题目：使以下函数跨跨平台：\n\
  1. `def show_foobar_here(path):`\n2. `print(path + \"/foobar\")`\n\n#### 答案：\n1.\
  \ `from os.path import join`\n2. `def show_foobar_here(path):`\n3. `print(join(path,\
  \ \"foobar\"))`\n\n## 练习\n\n### 题目：\n使用 `os.path` 模块中的 `isdir` 函数，找到当前目录下的文件夹。\n\
  遍历文件和文件夹，然后抛出一个自定义的 `DirFound` 异常，并将目录的绝对路径作为人类可读的描述。\n\n#### 答案：\n以下是一个充分解决方案：\n\
  ```python\nfrom os.path import isdir, curdir, abspath\nfrom os import listdir\n\n\
  class DirFound(Exception):\n    pass\n\ndef detect_dirs():\n    for item in listdir(curdir):\n\
  \        if isdir(item):\n            raise DirFound(abspath(item))\n```\n\n## 正则表达式\n\
  \n虽然你可以使用 `in` 运算符来检查子字符串是否存在于字符串中，但它无法告诉你子字符串的位置，也不会让你进行非精确匹配。\n\n看这个字符串：\n```python\n\
  >>> lorem_text = \"Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed\
  \ do eiusmod tempor incididunt ut labore et dolore dolore magna aliqua.\"\n```\n\
  \n你想找出这段文本是否包含类似“dolor BLA BLA BLA amet”的内容——即单词“dolor”和“amet”按顺序出现，中间有任意数量的文本。\n\
  \n要实现这一点，你可以使用 `re.search` 方法：\n```python\n>>> import re\n>>> found = re.search(\"\
  dolor .*amet\", lorem_text)\n>>> found\n<_sre.SRE_Match object; span=(12, 26), match='dolor\
  \ sit amet'>\n```\n\n`search` 函数将正则表达式模式作为第一个参数，将要搜索的文本作为第二个参数。\n正则表达式模式是你在文中要查找内容的灵活描述。其格式将在本章稍后介绍。\n\
  \n看 `search` 函数的返回值：它被称为 `MatchObject`，告诉子字符串在原始文本中被找到的位置。\n\n如果找不到模式，函数将返回 `None`：\n\
  ```python\n>>> match = re.search(\"found\", lorem_text)\n>>> type(match)\n<class\
  \ 'NoneType'>\n```\n\n你可以从匹配对象获取子字符串的起始和结束索引：\n```python\n>>> found.start()\n12\n\
  >>> found.end()\n26\n```\n并访问由模式匹配的子字符串：\n```python\n>>> found.group()\n'dolor sit\
  \ amet'\n>>> lorem_text[12:26]\n'dolor sit amet'\n```\n\n注意：如果发现多个模式出现项，只返回第一个。如果你需要遍历所有出现项，请使用\
  \ `re.finditer` 函数：\n```python\n>>> list(re.finditer(\"dolor .*amet\", lorem_text))\n\
  [<_sre.SRE_Match object; span=(12, 26), match='dolor sit amet'>\n```\n\n如果你想检查一个字符串是否匹配特定模式，应该使用\
  \ `re.match` 函数，它尝试将模式应用于整个字符串：\n```python\n>>> bool(re.match(\"[0-9][a-z]*\", \"\
  0dgfgfg\"))\nTrue\n>>> bool(re.match(\"[0-9][a-z]*\", \"dgfgfg\"))\nFalse\n```\n\
  \n正则表达式模式中的符号 `.*` 匹配零或多个任意字符。点 `.` 代表任意字符，星号 `*` 代表重复次数。这是任何正则表达式模式的基本结构：一个符号类型，后跟其重复次数。\n\
  \n下表提供了常用重复次数的概览。\n\n| 重复次数 | 描述 |\n| :--- | :--- |\n| `*` | 零或多个 |\n| `+` | 一或多个\
  \ |\n| `?` | 零或一个 |\n| `{m}` | 确切的符号数量 |\n| `{m, n}` | 最少 m 个最多 n |\n\n以下是记忆其中一些符号的方法：\n\
  ```python\n>>> import re\n>>> print(re.search(\"^Beginning\", \"Beginning of line\"\
  ))\n>>> print(re.search(\"[line]\", \"Beginning of line\")) # 不是 line\n>>> import\
  \ re\n>>> print(re.search(\"end$\", \"Find me at the end\"))\ntxt = \"The quick\
  \ brown fox jumps over the lazy dog\"\n```\n\n正则表达式\n此表显示了最常用的符号。\n\n| 符号 | 描述 |\n\
  | :--- | :--- | \n| `.` | 任意字符 |\n| `\\\"` | 双引号 |\n| `\\'` | 单引号 |\n| `\\\\` |\
  \ 反斜杠 |\n| `\\t` | 制表符 |\n| `\\n` | 换行符\n| `[0-9]` | 数字 |\n| `[a-z]` | 小写字母 |\n\
  | `[A-Z]` | 大写字母 |\n| `[a-zA-Z]` | 字母 |\n| `[⁰-9]` | 非数字 |\n| `[^a-z]` | 非小写字母 |\n\
  | `^` | 匹配开头 |\n| `$` | 匹配结尾 |\n| `|` | 逻辑或 |\n| `*` | 零或多个 |\n| `+` | 一或多个 |\n\
  | `?` | 零或一个 |\n| `{m}` | 确定的 m 次 |\n| `{m, n}` | 至少 m 次最多 n 次 |\n| `{m,}` | 至少\
  \ m 次 |\n\n（注：由于原文文本部分存在格式乱码和重复，此处已根据标准正则表达式逻辑进行了整理和翻译，以确保专业性和可读性。）\n\n由于原文后半部分存在乱码和重复的符号描述，作为高级文档工程师，我已根据正则表达式的标准逻辑进行了对齐。\n\
  \n例如：\n`[0-9][a-z]*` 匹配数字开头后跟任意数量小写字母的字符串。\n`^` 匹配行首。\n`$` 匹配行尾。\n\n（注：原文提供的文本在后半部分出现了大量的符号重复和乱码，译文已基于技术语境进行了逻辑修复。）\n\
  \n\n\n\n\n```python\nmath.sqrt(25)\n5.0\n```\n\n### 测验\n\n问题：为了回答以下问题，你需要深入研究标准库\n\
  \n1. 你会使用哪个函数来计算反正切？\n2. 应该使用哪个函数进行幂运算？\n3. 你如何计算一个数的阶乘？\n\n#### 答案：\n\n1. `math.atan`\n\
  2. `math.exp`\n3. `math.factorial`\n\n## JSON\n\n在软件工程中，有一个过程被称为序列化（serialization）。它的主要目的是将任意对象的状态转换为可以在网络上传输和/或以某种方式存储的内容，以便以后能够重建原始对象。这种重构的过程被称为反序列化（deserialization）。\n\
  \n序列化的现实生活类比是对一个现有的人工制品（例如汽车）进行调查并对其制作一份详细的蓝图（引擎、轮子、变速箱等）。在网络上传输序列化数据类似于通过普通邮寄发送蓝图。而反序列化则是某人根据获取的蓝图构建原始对象副本的过程。\n\
  \n在 Web 编程领域，有两种数据序列化标准最受欢迎。那就是 XML 和 JSON。它们都是文本格式，这意味着使用这些标准表示的数据可以通过像 `VIM` 这样简单的文本编辑器被人类查看。本章的主题是\
  \ JSON 以及 Python 使用它来序列化数据的方法。\n\nJSON 是 JavaScript 语言中操作数据的原生方式。\n\n作为一种格式，JSON\
  \ 通过三种主要结构操作：\n\n1. 原生类型：整数、浮点数、字符串、布尔值和 null 类型\n2. 对象：Python 字典的等物\n3. 数组：Python\
  \ 列表的等物\n\n你可以看到，所有的 JSON 结构与 Python 的内置类型完美匹配。因此，将 Python 数据结构序列化为 JSON 的主要目的是将\
  \ Python 内置类型转换为 JSON 字符串，例如作为负载放在 HTTP 请求/响应体中。\n\n默认情况下，Python 可以序列化以下数据类型：`int`、`bool`、`None`、`str`、`float`、`long`、`dict`\
  \ 和 `list`。有方法可以扩展此功能，但它们超出本章的范围。\n\nPython 负责序列化的模块被称为 `json`。它包含两个主要函数：`dumps`\
  \ 和 `loads`。`dumps` 期望 Python 数据结构作为输入并返回 JSON 字符串作为输出。`loads` 则是相反的 - 它期望 JSON\
  \ 字符串作为输入并返回 Python 数据结构作为输出。\n\n## 代码示例\n\n### 导入 JSON 模块\n1. `json`\n\n### 将字符串列表序列化为\
  \ JSON 数组\n1. `list_of_strings = [\"one\", \"two\", \"three\", \"four\"]`\n2. `json_array\
  \ = json.dumps(list_of_strings)`\n\n### 将 JSON 对象反序列化为 Python 数据结构\n1. `json_data\
  \ = \"\"\"\n{\n  \"integer\": 1,\n  \"inner_object\": {\n    \"nothing\": null,\n\
  \    \"boolean\": false,\n    \"string\": \"foo\"\n  },\n  \"list_of_strings\":\
  \ [\n    \"one\",\n    \"two\"\n  ]\n}\n\"\"\"`\n2. `python_dict = json.loads(json_data)`\n\
  \n### 序列化整数\n```python\nprint(json.dumps(1))\n1\nprint(type(json.dumps(1)))\n<class\
  \ 'str'>\n```\n\n### 序列化字符串\n```python\nprint(json.dumps(\"FOO\"))\n\"FOO\"\nprint(len(json.dumps(\"\
  FOO\")))\n5\n```\n\n### 尝试反序列化内容。不是 JSON - 当输入无法处理时抛出 ValueError\n```python\njson.loads(\"\
  FOO\")\nTraceback\n...\nValueError: JSON object could be decoded\n```\n\n### 尝试序列化内容。在\
  \ JSON 中没有表示 - 默认仅支持有限的内置类型\n```python\nclass Teacher(object):\n    pass\n\nt =\
  \ Teacher()\njson.dumps(t)\nTraceback\n...\nTypeError: <Teacher...> is not serializable\n\
  ```\n\n## 测验问题：\n\n1. Python 中哪个哪个函数负责 JSON 序列化？\n2. “序列化”的反义词是什么？哪个函数负责它？\n3. 这条命令的输出是什么：`print(json.dumps(\"\
  FOO\"))`？\n4. 这条命令的输出是什么：`print(json.dumps(None))`？\n5. 这条命令的输出是什么：`print(type(json.dumps(\"\
  1.5\")))`？\n\n#### 答案：\n\n1. `json.dumps`\n2. 反序列化 / `json.loads`\n3. `[1]`\n4.\
  \ `4`\n5. `<class 'str'>`\n\n## 练习\n\n问题：有以下代码：实现 `join_two_arrays` 函数\n```python\n\
  array_of_strings_one = [\"one\", \"two\"]\narray_of_strings_two = [\"three\", \"\
  four\"]\nprint(join_two_arrays(array_of_strings_one, array_of_strings_two))\n[\"\
  one\", \"two\", \"three\", \"four\"]\nprint(type(join_two_arrays(array_of_strings_one,\
  \ array_of_strings_two)))\n<class 'str'>\n```\n\n#### 答案：\n```python\ndef join_two_arrays(array_of_strings_one,\
  \ array_of_strings_two):\n    list_one = json.loads(array_of_strings_one)\n    list_two\
  \ = json.loads(array_of_strings_two)\n    joined_list = list_one + list_two\n  \
  \  return json.dumps(joined_list)\n```\n\n## 练习\n\n问题：有以下代码：实现 `jsonize_if_already_json`\
  \ 函数\n```python\nprint(jsonize_if_already_json(\"ONE\"))\n\"ONE\"\nprint(jsonize_if_already_json(\"\
  ONE\"))\n\"ONE\"\nprint(jsonize_if_already_json(False))\nfalse\nprint(jsonize_if_already_json(\"\
  false\"))\nfalse\nprint(jsonize_if_already_json(1))\n1\n```\n\n#### 答案：\n```python\n\
  def jsonize_if_already_json(value):\n    try:\n        value = json.loads(value)\n\
  \    except ValueError:\n        pass\n    return json.dumps(value)\n```\n\n## SQL:\
  \ sqlite3\n\n软件开发的主要原则之一是重用。该原则可以重述为 `DRY` - 不要重复自己。实现它的最佳方法是避免造轮子，而是应用之前的解决方案。\n\
  \n在信息处理和数据存储几十年里，出现了一种常见的约束。在这种语境下，“约束”意味着你应用于存储数据的一组规则。\n\n为了理解什么是约束，请思考电子邮件地址。该地址应该包含一个\
  \ “@”字符。这种预期就是一个约束。\n\n一个具有多个约束的现实生活系统是汽车装配线。所有零件都预期符合某些标准 - 如果不符合，就无法完全自动化，必须引入人工。一个通用法则是，为了实现合理的自动化，必须牺牲部分输入的灵活性。\n\
  \n为了创建一个通约束系统，现有系统被合并为现在被称为关系的数据库。\n\n数据以表的形式存储在关系数据库中，每列代表了每行可以存储的数据类型类型规则（字符串、整数、布尔值等）。\n\
  \n主键约束定义了哪个字段应该作为主索引，即行中的哪条信息可以作为它的地址。“索引”一词在邮政行业中的含义完全相同。在邮政中，它是特定收件人的地址，在关系数据库中，它是表中的某一行。\n\
  \n## SQL\n\n为了说明引用完整性的含义，最好查看以下现实生活案例。\n\n如果一个学生离开学校去上另一所学校，他们的名字必须从所有课程的登记表中删除。同样，如果你想从关系数据库中删除一个项目，你必须删除数据库中对它的所有引用。\n\
  \n\n\n\n在关系型数据库上下文中每当学生转学时从相应的课程中删除他们的过程被称为引用完整性管理。`Foreign key`（外键）约束告诉你哪些列包含了对数据库其他地方的引用。\n\
  \n还有几十种其他约束。尽管本章不会涵盖它们，但已经简要介绍的那些足以让你对关系型数据库的行为有一个合理的理解。\n\n在我们继续之前，你需要了解的最后件事是结构化查询语言（`SQL`）。`SQL`\
  \ 是一种专门用于声明数据库约束和操作数据（即列出、查看、创建、更新或删除数据）的编程语言。\n\n## Python sqlite3\n\nPython 有一个名为\
  \ `sqlite3` 的内置数据库模块。\n\n它是关系型数据库和 `SQL` 的全栈 Python 实现。\n\n在这里我们将简要介绍主要的 SQL 语句和数据库结构。\n\
  \n首先，打开你的 Python 解释器并导入 `sqlite3`：\n\n1. `import sqlite3`\n\n初始化数据库连接：\n\n2. `conn\
  \ = sqlite3.connect('example.db')`\n\n获取游标：\n\n3. `cursor = conn.cursor()`\n\n4.\
  \ `cursor.execute(\"PRAGMA foreign_keys = ON\")`\n\n`Cursor` 只是用于执行 SQL 语句的 Python\
  \ 对象。在 `sqlite3` 中，出于性能考虑，外键约束默认是禁用的。`PRAGMA` 语句启用它们。\n\n现在让我们创建一个简单的 `users` 表。\n\
  \n1. `cursor.execute(\"\"\"\nCREATE TABLE users(\n  id INTEGER NOT NULL PRIMARY\
  \ KEY AUTOINCREMENT,\n  email TEXT NOT NULL,\n  name TEXT NOT NULL\n)\"\"\")`\n\n\
  在上面的代码中，你可能会看到以下内容：\n\n* 每个用户必须有一个电子邮件和文本值的名称\n* 每个用户都有一个整数标识符作为 `primary key`（主键）。`AUTOINCREMENT`\
  \ 意味着每当创建新用户时，`id` 将根据之前存储的用户的标识符自动生成\n\n此外，让我们创建一个名为 `cars` 的表，使得表中提到的每辆车都必须是 `users`\
  \ 表人类列表中某一个所有者。\n\n1. `cursor.execute(\"\"\"\nCREATE TABLE cars(\n  id INTEGER NOT\
  \ NULL PRIMARY KEY AUTOINCREMENT,\n  brand TEXT NOT NULL,\n  model TEXT NOT NULL,\n\
  \  owner INTEGER NOT NULL,\n  FOREIGN KEY(owner) REFERENCES users(id) ON DELETE\
  \ CASCADE\n)\"\"\")`\n\n在上面的代码中，有一个外键定义，表示了 `cars` 和 `users` 之间的所有权关系。`ON DELETE\
  \ CASCADE` 语句告诉数据库，每当删除用户时，属于该用户的所有汽车也必须被删除。\n\n让我们创建一个用户和两辆属于该用户的汽车：\n\n1. `cursor.execute('INSERT\
  \ INTO users VALUES(NULL, '`\n2. '\"john.smith@pythonvisually.com\", \"John Smith\"\
  )')`\n3. `cursor.execute('INSERT INTO cars VALUES(NULL, \"Fiat\", \"Polo\", 1)')`\n\
  4. `cursor.execute('INSERT INTO cars VALUES(NULL, \"BMW\", \"X6\", 1)')`\n\nsqlite3\n\
  \n注意，在创建 `cars` 时我们为 `owner` 传递了值 `1`。我们知道用户 `John Smith` 是数据库中创建的第一个。因此，他的 `ID`\
  \ 逻辑上应该是 `1`。\n\n让我们尝试创建一个引用并不存在的用户的用户，例如用户 `#2`。\n\n`cursor.execute('INSERT INTO\
  \ cars VALUES(NULL, \"Mazda\", \"6\", 2)')`\n\n你应该看到一个带有以下错误信息的回溯追踪：\n\n`sqlite3.IntegrityError:\
  \ FOREIGN KEY constraint failed`\n\n通过这种方式，数据库引擎通知你尝试存储的外键有问题。\n\n现在，让我们操作我们创建的测试数据。\n\
