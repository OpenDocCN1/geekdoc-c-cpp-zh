  ISBN-10: 1507727070\n\npythonvisually.com\n\n## 关于本书\n\n### 问题所在\n人们在第一次尝试时觉得编程很难，这不能怪。学习编程就像学习一门新语言。\n\
  \n有许多需要遵循的规则和语法指南。它还需要记忆每种语言的大量词汇表，除非一个人每天至少从事编程工作 8 小时，否则此人不太可能很快熟悉编程；至少直到现在，多年来一直是这样。\n\
  \n### 方法论\n我们的方法涉及通过简单的插图来教授编程概念。\n\n这种视觉化方法之所以有效，是因为它是最基本的学习方式之一。每个人作为婴儿和幼儿，在理解字母和意义产生理解之前，就已经通过视觉和听觉来学习周围的世界。\n\
  \n编程是以模块和构建块的形式工作的。当一个人学习了几个基础模块和步骤后，就可以学习在这些基础单元之上构建更复杂的模块。\n\n这是一种构建块方法，一旦掌握了基础模块，就可以编写出更大的结构。我从一组易于通过插图和比喻学习的基础构建块开始。\n\
  \n从那里，用户可以应用多种变体并进一步构建。然而，最初的构建块将成为某种“罗塞石”，允许用户在未来的任何情况下进行编程和构建。\n\n### 为什么选择 Python？\n\
  当你开始大学的计算机科学之旅时，你可能会从学习 Python 开始。\n\n那么为什么选择 Python 而不是其他编程语言呢？很简单：\n\n* 无论你的操作系统是什么，Python\
  \ 都易于设置。\n* Python 代码使用纯英语，易于理解。\n* Python 允许你运行错误的代码。\n  **为什么这是好事？**\n  当你学习时，难免会犯错。Python\
  \ 会在你运行代码后告诉你错误是什么，帮助你找到问题。\n* Python 是一个非常强大的工具，但也容易且快速地学习，这就是为什么大多数人偏于它的原因。\n\n\
  ### 安装\n已经有预编译的包，方便在多个操作系统上安装，例如 Windows、Linux、UNIX 和 Mac OS 等。\n\n如果你访问 `https://www.python.org/downloads/`，可以为你的操作系统选择正确的安装方法。大多数\
  \ Linux 系统都预装了 `Python`。\n\n本书使用的是 `Python` 版本 3。\n\n在 Windows 中，安装 `Python` 后，从开始菜单或屏幕选择\
  \ `Python IDLE` 或 `Python` 命令行/控制台。\n\n`IDLE` 和 `console` 之间的区别是 `IDLE` 有图形界面，看起来类似于文本编辑器。在\
  \ Linux、UNIX 和 OS X 中，你可以通过命令行输入 `Python` 来启动 `Python` 模拟器。\n\n要选择特定版本的 `Python`，输入\
  \ `PythonX`，其中 `X` 是版本号（例如，版本 3 输入“Python3”）。\n\n![](img/00002.jpeg)\n\n### Hello\
  \ World!\n在你编写 `Python` 代码的大多数时候，你会在 `IDLE` 或任何其他 IDE（如 `Eclipse`）或富文本编辑器（如 `Sublime\
  \ text` 或 `Notepad++`）中编写脚本。然而，你可以使用 `Python` 解释器来交互式地编写代码，因为它作用类似于一个 `UNIX shell`，\n\
  \n虽然可以使用仅用解释器来创建程序，但强烈建议不要这样做，因为很难将代码保存为脚本以便后续复用。\n\n\n\n\n\n```python\n>>> f\n\n\
  Hello World!\n```\n\nPython 变量名必须遵循以下规则：\n\n1. 必须以字母或下划线开头\n2. 它们只能包含字母、数字或下划线\n\
  \n几个非法变量名的示例：\n\n1. `2var`\n2. `var-bar`\n3. `foo.loo`\n4. `@var`\n5. `$var`\n\n\
  Python 还有一些不能作为变量名的特殊词：\n\n![](img/00009.jpeg)\n\n以及 `assert`, `break`, `class`,\
  \ `continue`, `def`, `del`, `elif`, `else`, `except`, `exec`, `finally`, `for`,\
  \ `from`, `global`, `if`, `import`, `in`, `is`, `lambda`, `not`, `or`, `pass`, `raise`,\
  \ `return`, `try`, `while`, `yield`\n\n## 练习\n\n问题：哪些语句是有效的？\n\n1. `$foo = “bar\"\
  `\n2. `lambda = “bar\"`\n3. `finally = “yes\"`\n4. `pass = “you shall not\"`\n5.\
  \ `___buga_wuga_ = “@@@h\"`\n6. `foo_bar = “bar\"`\n\n答案：最后两个。注意，倒数第二个之前的语句看起来是不正确的。实际上，它是一个具有适当字符串值的完全合变量。\n\
  \n## 练习\n\n问题：用一行为变量 `zen`、`foo` 和 `bar` 赋值值“blah”。\n\n答案：\n\n```\nfoo = bar = zen\
  \ = “blah”\n```\n\n### 数据类型\n\n![](img/00010.jpeg)\n\n下表提供了 Python 中最常用数据类型的概览。\n\
  \n| 变量类型 | 示例 | 用注释 |\n| --- | --- | --- |\n| `bool` | `life_is_good = True`, `hamsters_are_evil\
  \ = False` | 真/假值 |\n| `int, long` | `size_of_shoes = 42`, `earth_population = 7000000000`\
  \ | 各种整数 |\n| `float` | `pi = 3.14159265359` | 非整数 - 小数点后有一个或多个符号 |\n| `str` | `chinese_hi\
  \ = \"你好\"` | 任何文本 |\n| `None` | `my_new_book = None` | 没有任何意义值的空变量 |\n\n你可以使用赋值运算符\
  \ `=` 在变量中存储所有类型的数据。\n\n多行字符串可用于存储大型文本块。\n\n```python\nlong_text = \"\"\"\nLine\
  \ one\nLine two\nLine three\nLine Four\n\"\"\"\n```\n\n如你所见，多行字符串是用三引号括的普通字符串，而不是单引号。\n\
  \n在 Python 中，可以将字符串转换为整数，将整数转换为字符串：\n\n```python\n>>> str(100)\n‘100’\n>>> int(“234”)\n\
  234\n```\n\n### 测验\n\n问题：\n\n1. 这个 `=` 运算符的名称是什么？\n2. 如何将数字 `3.14` 转换为字符串 ‘3.14`？\n\
  \n答案：\n\n1. 赋值运算符\n2. `str(3.14)`\n\n### 基础数学\n\nPython 拥有许多内置算术运算符。下表提供了短形式与其等效长形式的简要比较。\n\
  \n假设初始以下情况成立：`a = 3`。\n\n| 操作名称 | 短形式 | 长形式 | a 的值 | 注释 |\n| --- | --- | --- | ---\
  \ | --- |\n| 加法 | `a += 1` | `a = a + 1` | 4 | |\n| 减法 | `a -= 1` | `a = a - 1`\
  \ | 2 | |\n| 乘法 | `a *= 2` | `a = a * 2` | 6 | |\n| 除法 | `a /= 2` | `a = a / 2`\
  \ | 1.5 | 返回小数值或浮点数 |\n| 取模 | `a %= 2` | `a = a % 2` | 1 | 返回除法的整数余 |\n| 幂 | `a\
  \ **= 2` | `a = a ** 2` | 9 | 类似于普通数学中的 `a²` |\n| 整除 | `a //= 2` | `a = a // 2`\
  \ | 1 | 仅返回整数（int）值 |\n| 否定 | `a = -a` | `a = 0 -a` | -3 | 返回相反符号相同的值 |\n\n在 Python\
  \ 中求数字的平方根也很容易，但它不是语言的内置功能。你将在书中后面了解到它！\n\n你可以使用 `abs()` 计算数字的绝对值（例如 `|-3|`）。例如，`abs(-3)`\
  \ 返回 `3`。\n\n### 运算符优先级\n\nPython 中数学运算的执行顺序与传统数学中使用的顺序相似。\n\n在数学中，有三个通用的运算符优先级：\n\
  \n1. 幂和根\n2. 乘法、除法和取模\n3. 加法和减法\n\n幂和根在 Python 中由标准库的函数表示，并在书中进一步介绍。\n\n![](img/00011.jpeg)\n\
  \n所有其他优先级都有它们内置的 Python 运算符。\n\n高阶操作在低阶操作之前执行。相同顺序的操作从左到右一个一个执行。\n\n例如，语句 `2 + 3\
  \ * 4` 乘法先于加法。为了影响运算符的执行顺序，应该使用括号 `()`。例如，`(3 + 6) * 2` 等于 `18` 且 `8 / (1)` 等于 `4`。\n\
  \n## 代码示例\n\n下面的代码片段显示了 解释器如何处理简单的数学运算。\n\n```python\n>>> 13 * 2\n26\n>>> 10 - 32\n\
  -22\n>>> 11 % 10\n1\n>>> 6 ** 2\n36\n>>> 12 / 8\n1.5\n>>> 12 % 8 + (12 // 8)\n12\n\
  >>> 6 - -16\n22\n>>> a = 16\n>>> a += 3\n>>> a\n19\n>>> a = 4\n>>> b = 6\n>>> a\
  \ *= b\n>>> a\n24\n```\n\n## 练习\n\n问题：在不使用 Python 的情况下回答以下问题，然后使用解释器验证你的答案：\n\n\
  1. 以下计算 `2 + 2 + 2 + 2 + 2 + 2 * 0` 的结果是多少？\n2. 这一个呢？`(2 + 2 + 2 + 2 + 2 + 2) *\
  \ 0`？\n\n\n\n\n\n```python\n>>> foo = \"one\"\n>>> bar = \"two\"\n>>> full = foo\
  \ + \" \" + bar\n>>> print(full)\none two\n```\n\n如果你想创建一个包含 N 个子字符串的字符串，可以使用 `*`\
  \ 运算符。\n\n```python\n>>> foo = \"foo \" * 3\n>>> print(foo)\nfoo foo foo\n```\n\n\
  ### 测验\n\n## 问题\n1. 在 Python 中，可以将多个字符串合并为一个字符串。这种操作的名称是什么？\n2. 有一个字符串 `value =\
  \ \"foobar\"`。你通过以下方式访问子字符串：`other_value = value[1:3]`。这种操作的名称是什么？`other_value`\
  \ 的长度是多少？\n3. 字符串第一个字符的索引是多少？\n\n## 答案\n1. 拼接 (Concatenation)\n2. 切片 (Slicing)。长度为\
  \ 2。切片操作定义的最后一个字符不包含在。\n3. 0\n\n## 练习\n\n## 问题\n有两个字符串：`one = \"John is strong\"\
  ` 和 `two = \"Tea is not warm\"`。编写 Python 代码，根据 `one` 和 `two` 产生字符串结果 `result =\
  \ \"John is not strong\"`：\n\n## 答案\n```python\nresult = one[0:8] + two[7:11] +\
  \ one[8:14]\n```\n\n## 问题\n找出这些字符串中不包含字母“B”的一个：“Foo”、“Bar”、“Zoo”、“Loo”。\n\n## 答案\n\
  ```python\n>>> \"B\" in \"Foo\"\nFalse\n>>> \"B\" in \"Bar\"\nTrue\n>>> \"B\" in\
  \ \"Zoo\"\nFalse\n>>> \"B\" in \"Loo\"\nFalse\n```\n\n## 问题\n使用 Python 解释器找到字符串“John\
  \ is strong”的长度\n\n## 答案\n```python\n>>> len(\"John is strong\")\n14\n```\n\n##\
  \ 注释\n\n在 Python 代码上编写注释非常简单。编写 Python 注释有两种方法：单行注释和多行注释。\n\n![](img/00014.jpeg)\n\
  \n注释旨在帮助用户理解代码，并会被解释器忽略。单行注释通过在开头添加 `#` 字符创建。它们适用于在函数开头添加简短的注释。\n\n1. `# 这是一个有效的单行注释。`\n\
  \n你也可以在代码行之后添加联注释，这对于解释语句很有用。\n\n1. `print(\"Hello there!\")      # 这在 Python 中是一个内联注释`\n\
  2. `# 这是另一个。`\n\n### 多行注释\n\n![](img/00015.jpeg)\n\n与其将多个单行注释连接在一起，对于较长的注释，你可以在第一行和最后行使用三个连续的引号。\n\
  \n```python\n\"\"\"  这是一种更好的注释方式，\n可以跨越多行使用注释，而不需要\n使用大量的井号。\n\"\"\"\n```\n\n这种类型的注释通常用于为阅读程序的人提供文档。毕竟，无论你的技术多纯熟，如果你得到一个没有注释的程序，除非你预先知道，否则将花时间检查代码以弄它是做什么的以及如何使用。\n\
  \n## 函数\n\n我们之前讨论过可重用性是软件工程的核心原则。一旦你写了一些代码，你就会想将其存储起来，以便在不需要复制粘贴的情况下再次使用。\n\n这就是函数的用途！函数是封装你的代码的一种，使其可以通过调用简单的快捷方式来重复使用。假设你想要连续打印三次“Hello\
  \ Mr. Jones! How are you today?”而没有任何代码重复。可以通过以下方式实现：\n\n```python\ndef hi():\n\
  \    print(\"Hello Mr. Jones! How are you today?\")\nhi()\nhi()\nhi()\n```\n\n###\
  \ 基础函数\n\n在上面的代码段中，你可以看到关键字 `def`。它定义了一个表示函数的代码块。函数名必须遵循与变量名相同的规则。这个函数名为 `hi`，后面跟着括号和冒号。括号内部是参数列表，在这种情况下，参数列表是完全空的。\n\
  \n在函数之后，代码块必须缩进以将其定义为嵌套块。你应该遵循两个 Python 惯例：使用四个空格缩进你的代码块，并且在函数名中仅使用小写字母和下划线。\n\n\
  这段代码将无法工作：\n`<未缩进示例>`\n```python\ndef hi():\nprint(\"Hello Mr. Jones! How are you\
  \ today?\")\n```\n\n这段代码将无法工作：\n`<缩进不一致示例>`\n```python\ndef hi():\n    print(\"\
  Hello Mr. Jones! How are you today?\")\nprint(\"foobar\")\n```\n\n在函数下方，你可能会看到三行调用它的。让我们来看一个特定的调用：调用只是一个函数名，后面跟着预期要作为参数传递的参数。参数预期放在括号内。在这种情况下，我们没有参数列表，因此括号是空的。\n\
  \n### 带参数的函数\n\n有时你可能希望函数在不同的条件下改变行为。为了做到这一点，可以使用函数参数。假设你不仅对 Jones 先生说 `hi`，还对任何名字的人说。你必须编辑原始的\
  \ `hi()` 函数使其看起来像这样：\n\n```python\ndef hi(name):\n    print(\"Hello \" + name +\
  \ \"! How are you today?\")\n```\n\n函数现在接受一个参数，这是一个名为 `name` 的变量。稍后，`name` 与原始字符串的部分拼接得到你的新问候。现在你可以对\
  \ John、James 和 Maggie 说 `hi` 了，例如：\n\n```python\nhi(\"John\")\nhi(\"James\")\nhi(\"\
  Maggie\")\n```\n\n[/content] (抱歉，由于你提供的文本在结尾处似乎中断了，我翻译了直到“以下是需要翻译的文本”之后的内容。根据你指令“输出应包含在[content]...\n\
  \n\n\n# 5. 无效：参数名称中的符号 $\n\n## 练习\n\n**问题：** 修改下面的函数，使其返回问候而不是打印它：\n\n```python\n\
  def hi():\n    greeting = “Hello world!!!\"\n    print(greeting)\n```\n\n**答案：**\n\
  \n```python\ndef hi():\n    greeting = “Hello world!!!\n    return greeting\n```\n\
  \n## If/Else 和条件语句\n\n在本书到目前为止，我们涵盖的简单语句和操作有许多用处。然而，任何编程的主要目的都是为了实现某种逻辑。\n\n`if/else`\
  \ 块是 Python 中的核心语法元素。它们允许你根据条件控制程序的执行流。\n\n在以下场景中，你想知道你的汽车行驶行驶得是否太快。如果你的速度超过了 100\
  \ km/h，函数将打印“Too fast!”。如果你行驶速度低于限速，函数将打印“You are driving below the speed limit.\
  \ Well done.”。\n\n代码看起来是这样：\n\n```python\ndef drive(car_speed):\n    if car_speed\
  \ > 100:\n        print(“Too fast!”)\n    else:\n        print(“You are driving\
  \ below the speed limit. Well done”)\n\n>>> drive(70)\nYou are driving below the\
  \ speed limit. Well done\n\n>>> drive(120)\nToo fast!\n```\n\n上面的代码中有几点需要注意。\n\n\
  首先，是 `>` 运算符。它是一个布尔比较运算符，与数学中使用的相同。如果第一个项目大于第二个项目，它返回 `True`，否则返回 `False`。\n\n其次，是\
  \ `if/else` 语法。如果 `is_too_fast` 为 `True`，则执行第一块代码。否则，则执行第二块代码。\n\n第三，是缩进。函数内部的语句被缩进，`if/else`\
  \ 块内部的语句进一步缩进。\n\n## 布尔表达式\n\n![](img/00016.jpeg)\n\n```python\ngreenApple = 100\n\
  redApple = 135\n\nprint(greenApple == redApple)      #测试 100 和 135 是否相等\n#False\n\
  \nprint(greenApple < redApple)      #测试 100 是否小于 135\n#True\n\nprint(greenApple\
  \ != redApple)      #测试是否不等\n#True\n```\n\n```python\n>>> bool(1)\nTrue\n>>> bool(\"\
  \")\nFalse\n>>> bool(None)\nFalse\n>>> bool(\"blah\")\nTrue\n>>> bool(0)\nFalse\n\
  >>> bool(True)\nTrue\n```\n\n在 Python 中，任何值都可以被解释为 `True` 或 `False`。在数据类型中，值 `0`、`\"\
  \"` - 空字符串、`None` 以及 `False` 本身都是 `False`。任何其他值都是 `True`。\n\n可以通过将值转换为布尔类型来检查该值是\
  \ `True` 还是 `False`：\n\n还有几个内置的比较运算符，如 `>`，在调用时会返回 `True` 或 `False`。下表提供了这些运算符的概述。\n\
  \n| 运算符 | 语句 | 语句的返回值 |\n| --- | --- | --- |\n| 小于 | `1 < 2` `4 < 3` | True False\
  \ |\n| 小于等于 | `2 <= 2` `4 <= 3` | True False |\n| 大于 | `2 > 1` `3 > 3` | True False\
  \ |\n| 大于等于 | `2 >= 2` `3 >= 4` | True False |\n| 等于 | `\"foo\" == \"foo\"` `0 ==\
  \ 1` | True False |\n| 不等于 | `\"foo\" != \"bar\"` `11 != (10 + 1)` | True False\
  \ |\n| 与 (两部分都为 True) | `3 and \"foo\"` `None and True` | True False |\n| 或 (部分中的之一必须为\
  \ True) | `1 or None` `None or False` | True False |\n| 非 (与目标表达式相反) | `not None`\
  \ `not True` | True False |\n\n注意，比较运算符的优先级高于逻辑运算符 `and`、`or` 和 `not`。所有数学运算符的优先级都高于比较运算符。这里有几个复合示例，说明了如何使用布尔运算符：\n\
  \n```python\n>>> 2 * 6 + 1 < 2 * (6 + 1)\nTrue\n>>> 2 * 6 + 1 == 2 * (6 + 1) - 1\n\
  True\n>>> 2 ** 3 == 8 and 2 ** 2 == 16\nFalse\n>>> (2 ** 2 == 4 and False) or (not\
  \ (16 < 15 or or == 3))\nTrue\n```\n\n## 备选分支\n\n在很多情况下，逻辑可以比两个条件更复杂。让我们修改创建的 `speed`\
  \ 函数，使其在速度超过 200 km/h 时打印“You are insane, man!!!”，并在速度于 70 到 80 km/h 之间时打印“The optimal\
  \ speed for your car.”。\n\n```python\ndef drive(car_speed):\n    if car_speed >\
  \ 200:\n        print(“You are insane, man!!!”)\n    elif car_speed > 100:\n   \
  \     print(“Too fast!”)\n    elif car_speed > 70 and car_speed < 80:\n        print(“The\
  \ optimal speed for your car.”)\n    else:\n        print(“You are driving below\
  \ the speed limit. Well done”)\n```\n\n\n\n\n在这里，我们用 Python 实现了一辆汽车：\n\n```python\n\
  class Car:\n    def turn_left(self):\n        pass\n    def turn_right(self):\n\
  \        pass\n    def accelerate(self):\n        pass\n    def slow_down(self):\n\
  \        pass\n    def open_a_window(self):\n        pass\n```\n\n在上面的代码中，我们创建了一个类。类是一个具有特定行为的实体。这些行为以方法的形式存在，它们与我们之前使用的函数相同，并且缩进方式相同。类的方法将类（`self`）作为它们的第一个参数。`pass`\
  \ 关键字告诉 Python 这段代码块什么都不操作。\n\n这个类可以代表各种不同的汽车 - 宝马、奔驰、奥迪、菲亚特、特斯拉等。让我们创建一个带有某些参数的汽车吧。\n\
  \n```python\nbmw_x6 = Car(model=\"BMW X6\", max_speed=230)\n```\n\n在上面的代码中，你可以看到汽车对象是用两个参数创建的：`model`\
  \ 和 `max_speed`。原始的汽车代码没有任何支持这些参数的内容。为了实现这种支持，你必须引入一个 `__init__` 方法：\n\n```python\n\
  class Car:\n    def __init__(self, model, max_speed):\n        self.model = model\n\
  \        self.max_speed = max_speed\n        self.speed = 0\n        ...\n```\n\n\
  上面的代码获取了你的新汽车对象（`self`），并使用点符号法为汽车的 `model` 和 `max_speed` 赋值。汽车的初始速度为零。\n\n`__init__`\
  \ 方法不应该包含返回语句 - 它仅用于构建你的对象。这个方法被称为“类构造函数”。\n\n加速和减速应该相应地减少和增加汽车的速度：\n\n```python\n\
  class Car:\n    ...\n    def accelerate(self, speed_difference):\n        self.speed\
  \ += abs(speed_difference)\n        self.speed = min(self.speed, self.max_speed)\n\
  \    def slow_down(self, speed_difference):\n        self.speed -= abs(speed_difference)\n\
  \        self.speed = max(self.speed, -5)\n        ....\n```\n\n使用点符号法改变对象的内部状态。使用\
  \ `min` 和 `max` 函数是为了保证汽车永远不会超过最高速度，也不会低于低于 -5 km/h（倒车档）。\n\n以下代码将汽车加速 30 km/h。\n\
  \n```python\nbmw_x6.accelerate(30)\n```\n\n当你创建多个类时，你可能希望其中一些类之间存在关系。例如，汽车是一辆 `Vehicle`（交通工具），而公交车也是一种\
  \ `Vehicle`。尽管它们有许多相似之处，但它们的内部结构非常不同。\n\n为了反映对象之间的相似性和差异，Python 有一个名为“继承”的特性。\n\n\
  在这个例子中，我们实现了一个 `Vehicle` 类，它像 `Car` 类一样拥有 `model` 和 `max_speed` 参数。\n\n```python\n\
  class Vehicle:\n    def __init__(self, model, max_speed):\n        self.model =\
  \ model\n        self.max_speed = max_speed\n        self.speed = 0\n    def accelerate(self,\
  \ speed_difference):\n        self.speed += abs(speed_difference)\n        self.speed\
  \ = min(self.speed, self.max_speed)\n    def slow_down(self, speed_difference):\n\
  \        self.speed -= abs(speed_difference)\n        self.speed = max(self.speed,\
  \ -5)\n        ...\n```\n\n现在我们想要创建 `Car` 和 `Bus` 类；`Car` 类是完全相同的，但 `Bus` 类没有倒车档。\n\
  \n```python\nclass Car(Vehicle):\n    pass\nclass Bus(Vehicle):\n    def slow_down(self,\
  \ speed_difference):\n        super().slow_down(speed_difference)\n        self.speed\
  \ = max(self.speed, 0)\n```\n\n类名后括号之间的单词 `Vehicle` 使得 `Car` 和 `Bus` 类继承自 `Vehicle`。在\
  \ `Bus` 类中，`slow_down` 方法覆盖了父类的行为。`super()`语句调用父类来查找新速度，然后确保该速度低于 0 km/h。\n\n###\
  \ 测验\n\n**问题：**\n1. 软件工程师如何称呼用户可以使用的行为集合？\n2. 类与类之间关系的名称是什么？\n3. Python 中用于创建对象的方法的通用术语是什么？例如：`__init__(name,\
  \ max_speed)`。\n4. 方法中缺少了什么？\n\n**答案：**\n1. 接口 (Interface)\n2. 继承 (Inheritance)\n\
  3. 类构造函数 (class constructor)\n4. 缺少 `self` 参数\n\n**问题：** 编写 Python 代码让 X6 加速 100\
  \ km/h\n**答案：**\n`bmw_x6.accelerate(100)`\n\n**问题：** 引入一个也是 `Vehicle` 的 `Bike` 类。自行车的主要特点是它的速度永远不会超过\
  \ 30 km/h。\n**答案：** 你需要确保在 `Bike` 的构造函数并将最大速度限制在 30 km/h。\n```python\nclass Bike(Vehicle):\n\
  \    def __init__(self, name, max_speed):\n        max_speed = min(max_speed, 30)\n\
  ```\n\n**问题：** 添加一个名为 `show_status` 的方法，它可以打印出“速度是...”。\n**答案：**\n```python\ndef\
  \ show_status(self):\n    print(\"The speed is \" + str(self.speed) + \" km/h\"\
  )\n```\n\n### 集合 (Collections)\n\n在许多情况下，你可能需要处理一组相关的数据。Python 提供了多种集合类型：列表（lists）、元组（tuples）、字典（dictionaries）和集合（sets）。本章将重点讨论前三种。\n\
  \n### 列表 (Lists)\n\n列表就像元组，你可以在创建它们后修改它们。让我们定义一个包含三个元素的简单列表：\n\n(images/020.jpeg)\n\
  \n```python\n>>> my_list = [\"apple\", \"pear\", \"banana\"]\n>>> my_list[1:] #\
  \ 从第二个到最后一个\n['pear', 'banana']\n>>> my_list[2][2] # 第 3 个元素的第 3 个字符\n'n'\n```\n\
  \n(images/021.jpeg)\n\n```python\n>>> my_list[2] = \"mango\" # 将 'banana' 修改为 'mango'\n\
  >>> my_list\n['apple', 'pear', 'mango']\n```\n\n### 元组 (Tuples)\n\n元组是不可变的数组。\n\n\
  (images/018.jpeg)\n\n你可以通过以下方式访问元组元素：\n\n```python\n>>> my_tuple = (\"apple\", \"\
  pear\", \"banana\")\n>>> my_tuple[1:] # 从第二个到最后一个\n('pear', 'banana')\n>>> my_tuple[2][2]\
  \ # 第 3 个元素的第 3 个字符\n'n'\n```\n\n“不可变”意味着一旦定义了元组，你就无法更改它。\n\n```python\n>>> my_tuple[2]\
  \ = \"mango\" # 尝试将 'banana' 修改为 'mango'\nTypeError: 'tuple' object does not support\
  \ item assignment\n>>> my_tuple[2][0] = \"B\" # 尝试将字符串中的 'b' 修改为 \"B\"（字符串也是不可变的）\n\
  ```\n\n```python\n>>> new_tuple = ('foo', 'bar', 'zoo', 'loo')\n>>> type(new_tuple)\n\
  <class 'tuple'>\n>>> new_tuple[0]\n'foo'\n>>> new_tuple[3]\n'loo'\n>>> new_tuple[1:3]\n\
  ('bar', 'zoo')\n>>> len(new_tuple)\n4\n>>> new_tuple * 2\n('foo', 'bar', 'zoo',\
  \ 'loo', 'foo', 'bar', 'zoo', 'loo')\n>>> new_tuple + ('blah', 'blah')\n('foo',\
  \ 'bar', 'zoo', 'loo', 'blah', 'blah')\n```\n\n从上面的代码可以看出，元组的行为与字符串相似——然而，字符串只是字符的数组，而元组可以包含任何类型的变量。你可以像处理字符串一样对元组进行切片、索引、拼接和乘法。在语法上，元组项必须由括号括起来并用逗号隔开。即使包含单个元素的元组也必须有一个逗号：`(1,)`\
  \ 是元组，而 `(1)` 不是。\n\n\n\n\n`['apple', 'pear', 'mango']`\n\n```python\n>>> my_list[2][0]\
  \ = \"B\"              #尝试将 ‘b’ 替换为 “B”，你\n                                    \
  \ #将会得到一个错误\nTypeError: ‘str’ object does not support item assignment\n```\n\n```python\n\
  >>> new_list = ['foo', 'bar', 'zoo', 'loo']\n```\n\n正如你可能注意到的，列表项应该被包含在方括号中。\n\n\
  现在让我们删除第 3 个元素，并将第一个元素改为 \"blah\"：\n\n```python\n>>> new_list.pop(2)\n>>> new_list[0]\
  \ = \"blah\"\n>>> new_list\n['blah', 'bar', 'loo']\n```\n\n你可以向列表末尾添加元素：\n\n```python\n\
  >>> new_list.append(\"new_item\")\n```\n\n并从列表末尾弹出元素：\n\n```python\n>>> new_list.pop()\n\
  'new_item'\n```\n\n你也可以也可以将元素插入到列表的特定位置：\n\n```python\n>>> new_list = ['foo', 'bar',\
  \ 'zoo', 'loo']\n>>> new_list.insert(1, 'John')\n>>> new_list\n['foo', 'John', 'bar',\
  \ 'zoo', 'loo']\n```\n\n当你向列表添加一个元素时，它会占据你指定的位置，并将后续的所有元素向右移动。\n\n## 字典\n\n字典是键值值对集合，其工作方式与列表或元组非常相似。字典的值不是通过整数索引，而是可以通过几乎任何类型的索引来访问。\n\
  \n让我们创建一个以人名为键、以年龄为值的字典：\n\n![](img/00022.jpeg)\n\n```python\n1. ages = {\n2. \"\
  John\": 34,\n3. \"Matt\": 23,\n4. \"Natasha\": 27,\n5. \"Gabriella\": 33\n6. }\n\
  ```\n\n键值对必须被包含在花括号中，并用逗号分隔。键和值之间必须用冒号分隔。\n\n字典中的键必须是唯一的，但值可以相同。键可以是几乎任何类型的变量。\n\
  \n以下也是一个有效的字典：\n\n```python\n1. class SomeClass:\n2. pass\n3. obj1 = SomeClass()\n\
  4. obj2 = SomeClass()\n5. a_dict = {\n6. obj1: 11,\n7. obj2: 23\n8. }\n```\n\n你可以通过以下方式获取\
  \ John 的年龄：\n\n```python\n1. johns_age = ages[\"John\"]\n```\n\n同样地，你可以通过键设置元素的值：\n\
  \n```python\n1. ages[\"John\"] = 999\n```\n\n上述语句要么更改现有键的值，要么在不存在该键时创建一个新的键值对。\n\
  \n你也可以从字典中删除一个键值对。\n\n```python\n1. ages.pop(\"John\")\n```\n\n### 测验\n\n**问题：**\n\
