  5. 200。不要被错误名称误骗。你没有做任何操作来改变状态码。\n\n## 练习题\n\n### 问题：\n\n想象你想为你的网站创建一个小型讨论页面，让用户可以发布和阅读消息。消息按降序排列，因此最新的消息将显示在最前面。\n\
  \n你的网站非常受欢迎，很快消息就多到无法显示完！你决定将每页的消息数限制在 50 条，并添加“下一页”和“上一页”按钮以便在页面之间导航。你能创建一个脚本来显示给定页面上的第一条和最后一条帖子吗？\n\
  \n### 示例答案\n\n```python\n...\n@app.route(\"/posts\")\n@app.route(\"/posts/<int:page_nb>\"\
  )\ndef show_posts(page_nb=1):\n    first_msg = 1 + 50 * page_nb\n    last_msg =\
  \ first_msg + 49\n    return \"Messages {} to {}\".format(first_msg, last_msg)\n\
  ...\n```\n\n**注意：**\n* 为变量 `page_nb` 设置默认值，使得路由 `/posts` 和 `/posts/1` 是效的。\n* 强制\
  \ `page_nb` 的类型为 `int`，这样路由 `/posts/something` 将返回 404 错误。\n\n## 文件与目录\n\n处理文件和目录可能会迅速变成一项枯燥且耗时的任务。Python\
  \ 提供了方便的方法帮助你遍历目录并对文件进行操作。\n\n以下代码将以自顶向下的方式扫描所有目录和子目录：\n\n```python\nimport os\n\
  for root, dirs, files in os.walk(\".\"):\n    print(root)\n    for name in files:\n\
