    \ assignment\n```\n\n```python\n>>> new_list = ['foo', 'bar', 'zoo', 'loo']\n\
    ```\n\nAs you may have noticed, list items are supposed to be enclosed by square\
    \ brackets. \n\nNow lets remove the 3rd item and change the first one to \"blah\"\
    :\n\n```python\n>>> new_list.pop(2)\n>>> new_list[0] = \"blah\"\n>>> new_list\n\
    ['blah', 'bar', 'loo']\n```\n\nYou can add items to the end of the list:\n\n```python\n\
    >>> new_list.append(\"new_item\")\n```\n\nAnd pop the items from the end of the\
    \ list:\n\n```python\n>>> new_list.pop()\n'new_item'\n```\n\nYou can also add\
    \ the item to a specific position in the list:\n\n```python\n>>> new_list = ['foo',\
    \ 'bar', 'zoo', 'loo']\n>>> new_list.insert(1, 'John')\n>>> new_list\n['foo',\
    \ 'John', 'bar', 'zoo', 'loo']\n```\n\nWhen you add an item to a list, it takes\
    \ the location you specify and shifts all the following items to the right.\n\n\
    # Dictionaries\n\nA dictionary is a collection of keys and values, which works\
    \ much the same as a list or a tuple. Instead of an integer index, dictionary\
    \ values can be addressed by indices of almost any type.\n\nLets create a dictionary\
    \ with people names as keys and their ages as values:\n\n![](images/00022.jpeg)\n\
    \n```python\n1. ages = {\n2. \"John\": 34,\n3. \"Matt\": 23,\n4. \"Natasha\":\
    \ 27,\n5. \"Gabriella\": 33\n6. }\n```\n\nThe key-value pairs must be enclosed\
    \ in curly brackets and separated by commas. Keys and values must be separated\
    \ by a colon.\n\nThe keys in the dictionary must be unique, but the values can\
    \ be the same. A key can be almost any type of variable.\n\nThe following is also\
    \ a valid dictionary:\n\n```python\n1. class SomeClass:\n2. pass\n3. obj1 = SomeClass()\n\
    4. obj2 = SomeClass()\n5. a_dict = {\n6. obj1: 11,\n7. obj2: 23\n8. }\n```\n\n\
    You may fetch John’s age the following way:\n\n```python\n1. johns_age = ages[\"\
    John\"]\n```\n\nIn the same way, you can set the value of elements by key:\n\n\
    ```python\n1. ages[\"John\"] = 999\n```\n\nThe above statement either changes\
    \ the value of an existing key or creates a new key-value pair if none exists.\n\
    \nYou can also remove a key-value pair from the dictionary.\n\n```python\n1. ages.pop(\"\
    John\")\n```\n\n# Quiz\n\n**Problem:**\n1. Which collection resembles a locker\
    \ room with name tags on the lockers? Which one resembles an anonymous locker?\n\
    2. What is the main difference between lists and tuples?\n3. Can a float be used\
    \ as a key in a dictionary?\n4. How many keys called “John” can you have in a\
    \ dictionary?\n5. Is this a tuple: (123)?\n\n**Answer:**\n1. dictionary/list and\
    \ tuple\n2. lists can be modified, tuples can’t\n3. yes, why not?\n4. exactly\
    \ one - all keys must be unique\n5. no - a comma was forgotten\n\n# Exercises\n\
    \n**Problem:** Using Python get Natasha’s age.\n\n**Answer:**\n`ages['Natasha']`\n\
    \n# Exercises\n\n**Problem:** Get rid of Matt.\n\n**Answer:**\n```python\n1. ages.pop('Matt')\n\
    ```\n\n# Loops\n\nCollections can be used to store data in, but you can also go\
    \ through them and do something to each item individually.\n\nIn Python there\
    \ are two types of loop that you can use: `while` and `for`.\n\nA `while` loop\
    \ carries on repeating as long as a certain condition is true.\n\nThe statements\
    \ inside a `while` loop must be indented, like any other code block.\n\nThe loop\
    \ must be defined using the `while` keyword, a Boolean statement, and a colon.\n\
    \nThe Boolean statement could be a function call, a variable, or a comparison\
    \ statement.\n\n![](images/00023.jpeg)\n\nThis code will print numbers 1 to 10\n\
    ```python\n1. aps = 0\n2. while aps < 10:      #test\n3. aps += 1            #counter\n\
    4. print(aps)          #statement1\n5. print (\"and\")       #statement2\n6. print\
    \ (\"Done\")      #loop exit\n```\n\n## While\n\nPython provides `break` and `continue`\
    \ statements to have better control on your loop.\n\n![](images/00024.jpeg)\n\
    ```python\n1. while test1>:\n2. <statement1>\n3. if test2>: break    #loop exit,\
    \ skip\n4. if test3>: continue  #go to the top\n5. else:\n6. <statement2>    \
    \    #run if break didn’t happen\n```\n\n## Loops\n\n![](images/00025.jpeg)\n\n\
    You can use a `for` loop to iterate though collection. Let’s say you have the\
    \ following list:\n\n```python\n1. a = [\"one\", \"two\", \"three\"]\n```\n\n\
    To print each string individually, you could use this loop:\n\n```python\n1. for\
    \ item in a:\n2. print(item)\n```\n\nThe loop must be defined using the `for`\
    \ keyword, the name of the new variable to hold each item, the `in` keyword, the\
    \ name of the collection, and a colon. The statements inside a `for` loop must\
    \ be indented.\n\nYou can escape from a loop using the `break` command:\n\n```python\n\
    1. numbers = [1, 2, 5, 6, 7, 8, 9]\n2. for number in numbers:\n3. print(\"Looking\
    \ at: \" + str(number))\n4. if number > 6:\n5. print(\"Too big: \" + str(number)\
    \ + \"!\")\n6. break\n```\n\nThe above code gives the following output:\nLooking\
    \ at: 1\nLooking at: 2\nLooking at: 5\nLooking at: 6\nLooking at: 7\nToo big:\
    \ 7!\n\nThe iteration stops after number 7, meaning that numbers 8 and 9 are not\
    \ included.\n\nYou can also skip particular items in a collection using the `continue`\
    \ keyword:\n\n```python\n1. numbers = [1, 6, 7, 8, 9, 2, 5]\n2. for number in\
    \ numbers:\n3. if number > 6:\n4. continue\n5. print(\"Looking at: \" + str(number))\n\
    ```\n\nThe above code gives the following output:\nLooking at: 1\nLooking at:\
    \ 6\nLooking at: 2\nLooking at: 5\n\nHere, we ignored numbers 7, 8, and 9.\n\n\
    Dictionaries can be iterated through the same way.\n\n```python\n1. ages = {\n\
    2. \"John\": 34,\n3. \"Matt\": 23,\n4. \"Natasha\": 27,\n5. \"Gabriella\": 33\n\
    6. }\n7. for name in ages:\n8. print(name)\n```\n\n# Quiz\n\n**Problem:**\n1.\
    \ If you wanted to write code that triggered an alarm every ten minutes, as long\
    \ as you were sleeping, should you use a `for` or a `while` loop?\n2. How do you\
    \ completely stop a `while` loop? Give two options.\n3. How do you skip a specific\
    \ item in a `for` loop? Give two options.\n\n**Answer:**\n1. `while`\n2. Change\
    \ `while` loop’s condition to evaluate to False or use a `break` keyword.\n3.\
    \ Isolate the code for item processing within an `if` statement or use a `continue`\
    \ keyword.\n\n# Exercises\n\n**Problem:** Write some code to print out the name\
    \ of the oldest person inside the `ages` dictionary. This will use knowledge from\
    \ earlier chapters in the book.\n\n**Answer:**\n```python\n1. ages = {\n2. \"\
    John\": 34,\n3. \"Matt\": 23,\n4. \"Natasha\": 27,\n5. \"Gabriella\": 33\n6. }\n\
    7. oldest_person = None\n8. current_biggest_age = 0\n9. for name in ages:\n10.\
    \ age = ages[name]\n11. if age > current_biggest_age:\n12. oldest_person = name\n\
    13. current_biggest_age = age\n14. print(oldest_person)\n```\n\n# File operations\n\
    \nMost file operations boil down to: opening files, reading files, writing data\
    \ into files, and closing files. Usually the data you write into a file will be\
    \ textual.\n\nLet’s say you want to write a list of integers into a file so that\
    \ every integer is on a separate line. First, open the file:\n\n```python\n1.\
    \ the_file = open(\"integers.txt\", \"w\")\n```\n\nThe first argument to the `open`\
    \ function is the path to the file, and the second argument tells Python that\
    \ you want to write data into the file. This means that the file doesn’t have\
    \ to exist before you begin.\n\nThe function returns a file object that you can\
    \ use later.\n\nFirst let s define an array of integers and write them to the\
    \ file as strings.\n\n```python\n1. integers = [1, 2, 3, 4, 5]\n2. for integer\
    \ in integers:\n3. the_file.write(str(integer) + '\\n')\n```\n\nThe `write` method\
    \ takes in a string as an argument and writes it to the file.\n\nNote the `\\\
    n` symbol - this is the newline character. It starts a new line in the file.\n\
    \nWhen you’re finished with the file, you have to close it:\n\n```python\n1. the_file.close()\n\
    ```\n\nYou can also read data from a file.\n\nFirst, open the file without using\
    \ the `w` flag:\n\n```python\n1. the_file = open(\"integers.txt\")\n```\n\nGet\
    \ all the lines from the file:\n\n```python\n1. lines = the_file.readlines()\n\
    ```\n\nThe `readlines()` functions returns all of the lines in the file as a list\
    \ of strings.\n\nLet’s print out the lines:\n\n```python\n1. for line in lines:\n\
    2. print(line)\n```\n\nAfter you execute the code above you shall see the following\
    \ on the screen:\n\n1\n2\n3\n4\n5\n\nAnd as with writing to a file - close it\
    \ when you are done:\n\n```python\n1. the_file.close()\n```\n"
