    ```python

    >>> f


    Hello World!

    ```


    Python variable names must follow the following rules:


    1. They must start with a letter or an underscore

    2. They must contain only letters, digits or underscores


    Several examples of illegal variable names:


    1. `2var`

    2. `var-bar`

    3. `foo.loo`

    4. `@var`

    5. `$var`


    Python also has some special words that can’t be used as variable names:


    ![](images/00009.jpeg)


    and `assert`, `break`, `class`, `continue`, `def`, `del`, `elif`, `else`, `except`,
    `exec`, `finally`, `for`, `from`, `global`, `if`, `import`, `in`, `is`, `lambda`,
    `not`, `or`, `pass`, `raise`, `return`, `try`, `while`, `yield`


    ### Exercises


    Problem: Which statements are valid?


    1. `$foo = “bar"`

    2. `lambda = “bar"`

    3. `finally = “yes"`

    4. `pass = “you shall not"`

    5. `___buga_wuga_ = “@@@huz"`

    6. `foo_bar = “bar"`


    Answer: The two last ones. Note, the statement before the last one just looks
    incorrect. In reality it is a completely legal variable with a proper string value.


    ### Exercises


    Problem: Assign value “blah” to variables `zen`, `foo` and `bar` in one line.


    Answer:


    ```

    foo = bar = zen = “blah”

    ```


    ### Data types


    ![](images/00010.jpeg)


    The following table provides an overview of the most frequently used data types
    in Python.


    | Variable type | Example | Usage comment |

    | --- | --- | --- |

    | `bool` | `life_is_good = True`, `hamsters_are_evil = False` | true/false values
    |

