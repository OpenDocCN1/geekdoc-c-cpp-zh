    Python 变量名必须遵循以下规则：


    1. 必须以字母或下划线开头

    2. 它们只能包含字母、数字或下划线


    几个非法变量名的示例：


    1. `2var`

    2. `var-bar`

    3. `foo.loo`

    4. `@var`

    5. `$var`


    Python 还有一些不能作为变量名的特殊词：


    ![](img/00009.jpeg)


    以及 `assert`, `break`, `class`, `continue`, `def`, `del`, `elif`, `else`, `except`,
    `exec`, `finally`, `for`, `from`, `global`, `if`, `import`, `in`, `is`, `lambda`,
    `not`, `or`, `pass`, `raise`, `return`, `try`, `while`, `yield`


    ### 练习


    问题：哪些语句是有效的？


    1. `$foo = “bar"`

    2. `lambda = “bar"`

    3. `finally = “yes"`

    4. `pass = “you shall not"`

    5. `___buga_wuga_ = “@@@h"`

    6. `foo_bar = “bar"`


    答案：最后两个。注意，倒数第二个之前的语句看起来是不正确的。实际上，它是一个具有适当字符串值的完全合变量。


    ### 练习


    问题：用一行为变量 `zen`、`foo` 和 `bar` 赋值值“blah”。


    答案：


    ```

    foo = bar = zen = “blah”

    ```


    ### 数据类型


    ![](img/00010.jpeg)


    下表提供了 Python 中最常用数据类型的概览。


    | 变量类型 | 示例 | 用注释 |

    | --- | --- | --- |

    | `bool` | `life_is_good = True`, `hamsters_are_evil = False` | 真/假值 |

    | `int, long` | `size_of_shoes = 42`, `earth_population = 7000000000` | 各种整数 |

    | `float` | `pi = 3.14159265359` | 非整数 - 小数点后有一个或多个符号 |

    | `str` | `chinese_hi = "你好"` | 任何文本 |

    | `None` | `my_new_book = None` | 没有任何意义值的空变量 |


    你可以使用赋值运算符 `=` 在变量中存储所有类型的数据。


    多行字符串可用于存储大型文本块。


    ```python

    long_text = """

    Line one

    Line two

    Line three

    Line Four

    """

    ```


    如你所见，多行字符串是用三引号括的普通字符串，而不是单引号。


    在 Python 中，可以将字符串转换为整数，将整数转换为字符串：


    ```python

    >>> str(100)

    ‘100’

    >>> int(“234”)

    234

    ```


    ### 测验


    问题：


    1. 这个 `=` 运算符的名称是什么？

    2. 如何将数字 `3.14` 转换为字符串 ‘3.14`？


    答案：


    1. 赋值运算符

    2. `str(3.14)`


    ### 基础数学


    Python 拥有许多内置算术运算符。下表提供了短形式与其等效长形式的简要比较。


    假设初始以下情况成立：`a = 3`。


    | 操作名称 | 短形式 | 长形式 | a 的值 | 注释 |

    | --- | --- | --- | --- | --- |

    | 加法 | `a += 1` | `a = a + 1` | 4 | |

    | 减法 | `a -= 1` | `a = a - 1` | 2 | |

    | 乘法 | `a *= 2` | `a = a * 2` | 6 | |

    | 除法 | `a /= 2` | `a = a / 2` | 1.5 | 返回小数值或浮点数 |

    | 取模 | `a %= 2` | `a = a % 2` | 1 | 返回除法的整数余 |

    | 幂 | `a **= 2` | `a = a ** 2` | 9 | 类似于普通数学中的 `a²` |

    | 整除 | `a //= 2` | `a = a // 2` | 1 | 仅返回整数（int）值 |

    | 否定 | `a = -a` | `a = 0 -a` | -3 | 返回相反符号相同的值 |


    在 Python 中求数字的平方根也很容易，但它不是语言的内置功能。你将在书中后面了解到它！


    你可以使用 `abs()` 计算数字的绝对值（例如 `|-3|`）。例如，`abs(-3)` 返回 `3`。


    ### 运算符优先级


    Python 中数学运算的执行顺序与传统数学中使用的顺序相似。


    在数学中，有三个通用的运算符优先级：


    1. 幂和根

    2. 乘法、除法和取模

    3. 加法和减法


    幂和根在 Python 中由标准库的函数表示，并在书中进一步介绍。


    ![](img/00011.jpeg)


    所有其他优先级都有它们内置的 Python 运算符。


    高阶操作在低阶操作之前执行。相同顺序的操作从左到右一个一个执行。


    例如，语句 `2 + 3 * 4` 乘法先于加法。为了影响运算符的执行顺序，应该使用括号 `()`。例如，`(3 + 6) * 2` 等于 `18` 且 `8
    / (1)` 等于 `4`。


    ### 代码示例


    下面的代码片段显示了 解释器如何处理简单的数学运算。


    ```python

    >>> 13 * 2

    26

    >>> 10 - 32

    -22

    >>> 11 % 10

    1

    >>> 6 ** 2

    36

    >>> 12 / 8

    1.5

    >>> 12 % 8 + (12 // 8)

    12

    >>> 6 - -16

    22

    >>> a = 16

    >>> a += 3

    >>> a

    19

    >>> a = 4

    >>> b = 6

    >>> a *= b

    >>> a

    24

    ```


    ### 练习


    问题：在不使用 Python 的情况下回答以下问题，然后使用解释器验证你的答案：


    1. 以下计算 `2 + 2 + 2 + 2 + 2 + 2 * 0` 的结果是多少？

    2. 这一个呢？`(2 + 2 + 2 + 2 + 2 + 2) * 0`？


