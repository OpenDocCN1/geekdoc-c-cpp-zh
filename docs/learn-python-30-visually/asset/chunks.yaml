  trans: "\n\n```python\n>>> foo = \"one\"\n>>> bar = \"two\"\n>>> full = foo + \"\
    \ \" + bar\n>>> print(full)\none two\n```\n\n如果你想创建一个包含 N 个子字符串的字符串，可以使用 `*` 运算符。\n\
    \n```python\n>>> foo = \"foo \" * 3\n>>> print(foo)\nfoo foo foo\n```\n\n# 测验\n\
    \n### 问题\n1. 在 Python 中，可以将多个字符串合并为一个字符串。这种操作的名称是什么？\n2. 有一个字符串 `value = \"foobar\"\
    `。你通过以下方式访问子字符串：`other_value = value[1:3]`。这种操作的名称是什么？`other_value` 的长度是多少？\n\
    3. 字符串第一个字符的索引是多少？\n\n### 答案\n1. 拼接 (Concatenation)\n2. 切片 (Slicing)。长度为 2。切片操作定义的最后一个字符不包含在。\n\
    3. 0\n\n# 练习\n\n### 问题\n有两个字符串：`one = \"John is strong\"` 和 `two = \"Tea is not\
    \ warm\"`。编写 Python 代码，根据 `one` 和 `two` 产生字符串结果 `result = \"John is not strong\"\
    `：\n\n### 答案\n```python\nresult = one[0:8] + two[7:11] + one[8:14]\n```\n\n###\
    \ 问题\n找出这些字符串中不包含字母“B”的一个：“Foo”、“Bar”、“Zoo”、“Loo”。\n\n### 答案\n```python\n>>> \"\
    B\" in \"Foo\"\nFalse\n>>> \"B\" in \"Bar\"\nTrue\n>>> \"B\" in \"Zoo\"\nFalse\n\
    >>> \"B\" in \"Loo\"\nFalse\n```\n\n### 问题\n使用 Python 解释器找到字符串“John is strong”的长度\n\
    \n### 答案\n```python\n>>> len(\"John is strong\")\n14\n```\n\n# 注释\n\n在 Python\
    \ 代码上编写注释非常简单。编写 Python 注释有两种方法：单行注释和多行注释。\n\n![](img/00014.jpeg)\n\n注释旨在帮助用户理解代码，并会被解释器忽略。单行注释通过在开头添加\
    \ `#` 字符创建。它们适用于在函数开头添加简短的注释。\n\n1. `# 这是一个有效的单行注释。`\n\n你也可以在代码行之后添加联注释，这对于解释语句很有用。\n\
    \n1. `print(\"Hello there!\")      # 这在 Python 中是一个内联注释`\n2. `# 这是另一个。`\n\n##\
    \ 多行注释\n\n![](img/00015.jpeg)\n\n与其将多个单行注释连接在一起，对于较长的注释，你可以在第一行和最后行使用三个连续的引号。\n\
    \n```python\n\"\"\"  这是一种更好的注释方式，\n可以跨越多行使用注释，而不需要\n使用大量的井号。\n\"\"\"\n```\n\n\
    这种类型的注释通常用于为阅读程序的人提供文档。毕竟，无论你的技术多纯熟，如果你得到一个没有注释的程序，除非你预先知道，否则将花时间检查代码以弄它是做什么的以及如何使用。\n\
    \n# 函数\n\n我们之前讨论过可重用性是软件工程的核心原则。一旦你写了一些代码，你就会想将其存储起来，以便在不需要复制粘贴的情况下再次使用。\n\n这就是函数的用途！函数是封装你的代码的一种，使其可以通过调用简单的快捷方式来重复使用。假设你想要连续打印三次“Hello\
    \ Mr. Jones! How are you today?”而没有任何代码重复。可以通过以下方式实现：\n\n```python\ndef hi():\n\
    \    print(\"Hello Mr. Jones! How are you today?\")\nhi()\nhi()\nhi()\n```\n\n\
    ## 基础函数\n\n在上面的代码段中，你可以看到关键字 `def`。它定义了一个表示函数的代码块。函数名必须遵循与变量名相同的规则。这个函数名为 `hi`，后面跟着括号和冒号。括号内部是参数列表，在这种情况下，参数列表是完全空的。\n\
    \n在函数之后，代码块必须缩进以将其定义为嵌套块。你应该遵循两个 Python 惯例：使用四个空格缩进你的代码块，并且在函数名中仅使用小写字母和下划线。\n\
    \n这段代码将无法工作：\n`<未缩进示例>`\n```python\ndef hi():\nprint(\"Hello Mr. Jones! How are\
    \ you today?\")\n```\n\n这段代码将无法工作：\n`<缩进不一致示例>`\n```python\ndef hi():\n    print(\"\
    Hello Mr. Jones! How are you today?\")\nprint(\"foobar\")\n```\n\n在函数下方，你可能会看到三行调用它的。让我们来看一个特定的调用：调用只是一个函数名，后面跟着预期要作为参数传递的参数。参数预期放在括号内。在这种情况下，我们没有参数列表，因此括号是空的。\n\
    \n## 带参数的函数\n\n有时你可能希望函数在不同的条件下改变行为。为了做到这一点，可以使用函数参数。假设你不仅对 Jones 先生说 `hi`，还对任何名字的人说。你必须编辑原始的\
    \ `hi()` 函数使其看起来像这样：\n\n```python\ndef hi(name):\n    print(\"Hello \" + name\
    \ + \"! How are you today?\")\n```\n\n函数现在接受一个参数，这是一个名为 `name` 的变量。稍后，`name` 与原始字符串的部分拼接得到你的新问候。现在你可以对\
    \ John、James 和 Maggie 说 `hi` 了，例如：\n\n```python\nhi(\"John\")\nhi(\"James\")\n\
    hi(\"Maggie\")\n```\n\n[/content] (抱歉，由于你提供的文本在结尾处似乎中断了，我翻译了直到“以下是需要翻译的文本”之后的内容。根据你指令“输出应包含在[content]..."
- fmt: "\n# 5. invalid: symbol $ in argument’s name\n\n## Exercises\n\n**Problem:**\
    \ Change the function below to return the greeting instead of printing it:\n\n\
    ```python\ndef hi():\n    greeting = “Hello world!!!\"\n    print(greeting)\n\
    ```\n\n**Answer:**\n\n```python\ndef hi():\n    greeting = “Hello world!!!\n \
    \   return greeting\n```\n\n## If/Else and conditional statements\n\nThere are\
    \ a lot of uses for the simple statements and operations we have covered so far\
    \ in this book. However, the main purpose of any programming is to implement some\
    \ kind of logic.\n\n`if/else` blocks are a core syntax element in Python. They\
    \ let you conditionally control the flow of the program.\n\nIn the following scenario,\
    \ you want to know if your car is travelling too quickly. If you are exceeding\
    \ 100 km/h, the function will print “Too fast!” If you drive below the speed limit,\
    \ the function will print “You are driving below the speed limit. Well done.”\n\
    \nThis is what that code would look like:\n\n```python\ndef drive(car_speed):\n\
    \    if car_speed > 100:\n        print(“Too fast!”)\n    else:\n        print(“You\
    \ are driving below the speed limit. Well done”)\n\n>>> drive(70)\nYou are driving\
    \ below the speed limit. Well done\n\n>>> drive(120)\nToo fast!\n```\n\nThere\
    \ are multiple things to note in the code above.\n\nFirst, the `>` operator. It’s\
    \ a Boolean comparison operator, the same as the one used in maths. It returns\
    \ `True` if the first item is larger than the second, and `False` otherwise.\n\
    \nSecond, the `if/else` syntax. If `is_too_fast` is `True`, the first block of\
    \ code is executed. If not, the second block of code is executed.\n\nThird, the\
    \ indentation. The statements inside the function are indented, and then the statements\
    \ inside the `if/else` block are further indented.\n\n## Boolean expressions\n\
    \n![](images/00016.jpeg)\n\n```python\ngreenApple = 100\nredApple = 135\n\nprint(greenApple\
    \ == redApple)      #test if 100 and 135 are equal\n#False\n\nprint(greenApple\
    \ < redApple)      #test if 100 is less than 135\n#True\n\nprint(greenApple !=\
    \ redApple)      #test if not equal\n#True\n```\n\n```python\n>>> bool(1)\nTrue\n\
    >>> bool(\"\")\nFalse\n>>> bool(None)\nFalse\n>>> bool(\"blah\")\nTrue\n>>> bool(0)\n\
    False\n>>> bool(True)\nTrue\n```\n\nIn Python any value can be interpreted as\
    \ `True` or `False`. Among the data types values `0`, `\"\"` - an empty string,\
    \ `None` and `False` itself are `False`. Any other value is `True`.\n\nYou may\
    \ check if the value is `True` or `False` by converting the value to a boolean\
    \ type:\n\nAlso there are several built-in comparison operators like `>` return\
    \ `True` or `False` when called. The table below provides an overview of these\
    \ operators.\n\n| Operator | Statement | Statement's return value |\n| --- | ---\
    \ | --- |\n| Less | `1 < 2` `4 < 3` | True False |\n| Less or equal | `2 <= 2`\
    \ `4 <= 3` | True False |\n| Greater | `2 > 1` `3 > 3` | True False |\n| Greater\
    \ or equal | `2 >= 2` `3 >= 4` | True False |\n| Equal | `\"foo\" == \"foo\"`\
    \ `0 == 1` | True False |\n| Not equal | `\"foo\" != \"bar\"` `11 != (10 + 1)`\
    \ | True False |\n| And (both parts must be True) | `3 and \"foo\"` `None and\
    \ True` | True False |\n| Or (one of parts must be True) | `1 or None` `None or\
    \ False` | True False |\n| Not (opposite to the target expression) | `not None`\
    \ `not True` | True False |\n\nNote, comparison operators have higher precedence\
    \ than the logical operators `and`, `or` and `not`. All maths operators have higher\
    \ precedence than comparison operators. Here are several compound examples to\
    \ illustrate how to use boolean operators:\n\n```python\n>>> 2 * 6 + 1 < 2 * (6\
    \ + 1)\nTrue\n>>> 2 * 6 + 1 == 2 * (6 + 1) - 1\nTrue\n>>> 2 ** 3 == 8 and 2 **\
    \ 2 == 16\nFalse\n>>> (2 ** 2 == 4 and False) or (not (16 < 15 or or == 3))\n\
    True\n```\n\n## Alternative branches\n\nIn many cases the logic can be more sophisticated\
    \ than two conditions. Let’s modify the `speed` function we created to respond\
    \ to speeds over 200 km/h by printing “You are insane, man!!!” and printing “The\
    \ optimal speed for your car.” when speed is between 70 and 80 km/h.\n\n```python\n\
    def drive(car_speed):\n    if car_speed > 200:\n        print(“You are insane,\
    \ man!!!”)\n    elif car_speed > 100:\n        print(“Too fast!”)\n    elif car_speed\
    \ > 70 and car_speed < 80:\n        print(“The optimal speed for your car.”)\n\
    \    else:\n        print(“You are driving below the speed limit. Well done”)\n\
    ```\n\nYou might notice that in the code above we don’t use a separate Boolean\
    \ variable. Instead, we place the comparison operator inline with the `if` statement.\
    \ The `and` statement links two operators together. We also use the keyword `elif`.\
    \ This defines an alternate branch. If more than one branch is True, only the\
    \ first one will be used. For example:\n\n```python\na = 10\nif a > 1:\n    print(“Big”)\n\
    elif a > 5:\n    print(“Really big”)\nelif a == 10:\n    print(“Approaching enormity”)\n\
    elif a > 10:\n    print(“Enormous!”)\n```\nThis code will only print “Big”, and\
    \ the other statements will be ignored.\n\n## Quiz\n\n to answer these questions\
    \ without using the interpreter.\n\n1. What are the boolean values `bool(a)` -\
    \ for the following variables:\n   - `a = False`\n   - `a = \"0\"`\n   - `a =\
    \ 0 * 18`\n   - `a = \"None\"`\n2. What is the output of the following statement:\
    \ `(2 ** 2 == 4 and False) or (not (16 < 15 or or == 3))`\n3. Name Python’s logical\
    \ operators\n4. What will be printed as a result of the following code?\n   ```python\n\
    \   x = 5\n   if x == 25:\n       print(“Quarter”)\n   elif x == 10:\n       print(“Dime”)\n\
    \   elif x == 5:\n       print(“Nickel”)\n   elif x == 1:\n       print(“Penny”)\n\
    \   else:\n       print(“Not a coin”)\n   ```\n5. Suppose `x=5`, `y=0`, and `z=1`.\
    \ Are the following expressions True or False?\n   - `x == 0`\n   - `x >= y`\n\
    \   - `2 + 3 == x and y < 1`\n   - `not (z == 0 or y == 0)`\n6. `x = 3`. What\
    \ does the following code print?\n   ```python\n   x = 0\n   if x != 0:\n    \
    \   print(“x is nonzero”)\n   ```\n\n**Answer:**\n\n1. a) `False`\n   b) `True`\
    \ - this is a string with a character 0 not an integer\n   c) `False` - `0 * 18`\
    \ is 0\n   d) `True` - again `\"None\"` is a string not the actual `None`\n2.\
    \ `False` - the expression inside the `not` statement is `True`, making that statement\
    \ `False`, and the first statement is also False.\n3. `and`, `or`, `not`\n4. `Nickel`.\
    \ `x == 25` and `x == 10` are False, so the first True statement is `x == 5`.\n\
    5. a) `False`. The operator `==` tests for equality, and 5 does not equal 0.\n\
    \   b) `True`. 5 is greater than or equal to 0.\n   c) `True`. Both `2 + 3 ==\
    \ x` and `y < 1` are True.\n   d) `False`. `y == 0` is True, so `z == 0 or y ==\
    \ 0` is True, and its negation is `False`.\n   c) `True`. The `=` operator assigns\
    \ the value 3 to `x`, and the value 3 evaluates to `True`.\n6. `Nothing`. The\
    \ expression is False, so the code is not executed.\n\n## Exercises\n\n**Problem:**\
    \ Write an expression that tests if a variable `x` is less than or equal to 100.\n\
    \n**Answer:** `x <= 100`\n\n## Exercises\n\n**Problem:** Write an expression that\
    \ tests if a variable `x` is between 3 and 10, inclusive.\n\n**Answer:** `x >=\
    \ 3 and x <= 10`\n\n## Exercises\n\n**Problem:** Write an expression that tests\
    \ if a variable ![](images/00017.jpeg) is even or a multiple of 5.\n\n**Answer:**\
    \ `(x % 2 == 0) or (x % 5 == 0)`\n\n## Exercises\n\n**Problem:**\n\nThere is a\
    \ function with the following declaration: `person_is_old(age)` which returns\
    \ `True` or `False` based on the incoming age as an integer.\n\nWrite a function\
    \ that uses the one above so that it prints “Go to work!” if the person is not\
    \ old and “You deserved to have a long vacation” otherwise. Your function must\
    \ also accept the age as its argument.\n\n**Answer:**\n\n```python\ndef tell_what_to_do(age):\n\
    \    if person_is_old(age):\n        print(“You deserved to have a long vacation”)\n\
    \    else:\n        print(“Go to work!”)\n```\n\n## Classes and objects\n\nOne\
    \ of the key principles of object-oriented programming is encapsulation - hiding\
    \ the details of the inner workings of the system, so that the user doesn’t need\
    \ to know how it works in order to use it. The part of the program that the user\
    \ interacts with is called the “interface”.\n\nJust as the driver of a car needs\
    \ tools like a steering wheel and a gas pedal to use the car’s capabilities, users\
    \ of your code need to use syntax constructs called methods.\n"
