  trans: "\n\n```bash\npip install flask\n```\n\n# Hello World\n\n创建一个名为 `hello.py`\
    \ 的文件并写入以下代码：\n\n```python\npip install flask\n\nfrom flask import Flask\n\napp\
    \ = Flask(__name__)\n\n@app.route(\"/\")\ndef hello():\n    return \"Hello World!\"\
    \n\nif __name__ == \"__main__\":\n    app.run(debug = True)\n```\n\n并运行它：\n\n\
    ```bash\npython hello.py\n```\n\n如果你打开浏览器并输入：\n\n`http://localhost:5000`\n\n你应该能看到“Hello\
    \ World!”温馨的欢迎界面。\n\n恭喜你，你刚刚使用 Flask 创建了你的第一个网站。\n\n让我们逐行查看 `hello.py`。\n\n1.\
    \ 首先，从 `flask` 模块中导入了 `Flask` 类。\n2. 然后，创建了一个名为 `app` 的 `Flask` 类实例。\n3. `@app.route(\"\
    /\")` 告诉 `Flask` 哪个 URL 将触发下方的方法。\n4. 定义了 `hello()` 方法，它返回字符串“Hello World!”。\n\
    5. `app.run()` 启动了 HTTP 服务器。\n\n创建一个名为 `test.py` 的新文件：\n\n```python\nfrom flask\
    \ import Flask\n\napp = Flask(__name__)\n\n@app.route(\"/\")\ndef root():\n  \
    \  return \"Request Path is: \" + request.path\n\n@app.route(\"/test/\")\ndef\
    \ test():\n    return \"Request Path is \" + request.path\n\nif __name__ == \"\
    __main__\":\n    app.run(debug = True)\n```\n\n你可以看到从 `flask` 中导入了 `request` 模块。这个对象代表由客户端发送并服务器接收的\
    \ HTTP 请求，它包含了请求页面的路径、请求类型以及关于客户端和传输数据的其他信息。\n\n在这种情况下，你使用了 `request` 对象来返回页面的路径。\n\
    \nFlask 提供了一种简单的方法来响应不同的 HTTP 方法：\n\n```python\n@app.route(\"/data\", methods=['GET'])\n\
    def show_data():\n    ....\n\n@app.route(\"/data\", methods=['POST'])\ndef handle_data():\n\
    \    ....\n\n@app.route(\"/user/<username>\")\ndef greet_user(username):\n   \
    \ return \"Hello \" + username\n```\n\n你可以将网页 URL 的部分作为函数中的变量。\n\n```python\n\
    import json\nfrom flask import make_response, Flask\n\napp = Flask(__name__)\n\
    \n@app.route(\"/json\")\ndef get_image():\n    # 创建响应\n    response = make_response(json.dumps({\"\
    foo\": \"bar\"}))\n    # 设置正确的 mimetype\n    response.mimetype = \"application/json\"\
    \n    return response\n\nif __name__ == \"__main__\":\n    app.run(debug = True)\n\
    ```\n\n到目前为止，所有的页面都会返回简单的文本。\n\nFlask 会自动将此字符串转换为 HTTP 响应，并赋予它 “text/html” 的 mimetype\
    \ 以及状态码 200。\n\n现在让我们修改这种行为。\n\n这段代码返回一个 JSON 对象。\n\n我们也可以更改错误代码：\n\n```python\n\
    ...\n@app.route(\"/error\")\ndef error_page():\n    response = make_response(\"\
    Error Page\")\n    response.status_code = 404\n    return response\n...\n```\n\
    \n## 测验\n\n### 问题：\n1. 什么是 Flask？你应该用它做什么？\n2. 为什么 Flask 被称为微框架（microframework）？\n\
    3. Flask 集成 HTTP 服务器的默认端口是多少？\n4. 你能列出最常用的 HTTP 方法吗？\n5. 考虑以下代码段：\n```python\n\
    @app.route(\"/error\")\ndef error_page():\n    return \"Error Page\"\n```\n\n\
    ### 答案：\n\n1. `Flask` 是一个用于创建 Web 应用的 Python 微框架。\n2. 它保持了核心的简单性。新功能必须通过扩展添加。\n\
    3. 5000\n4. `GET`, `POST`, `HEAD`, `PUT` 和 `DELETE`\n5. 200。不要被错误名称误骗。你没有做任何操作来改变状态码。\n\
    \n## 练习题\n\n### 问题：\n\n想象你想为你的网站创建一个小型讨论页面，让用户可以发布和阅读消息。消息按降序排列，因此最新的消息将显示在最前面。\n\
    \n你的网站非常受欢迎，很快消息就多到无法显示完！你决定将每页的消息数限制在 50 条，并添加“下一页”和“上一页”按钮以便在页面之间导航。你能创建一个脚本来显示给定页面上的第一条和最后一条帖子吗？\n\
    \n### 示例答案\n\n```python\n...\n@app.route(\"/posts\")\n@app.route(\"/posts/<int:page_nb>\"\
    )\ndef show_posts(page_nb=1):\n    first_msg = 1 + 50 * page_nb\n    last_msg\
    \ = first_msg + 49\n    return \"Messages {} to {}\".format(first_msg, last_msg)\n\
    ...\n```\n\n**注意：**\n* 为变量 `page_nb` 设置默认值，使得路由 `/posts` 和 `/posts/1` 是效的。\n*\
    \ 强制 `page_nb` 的类型为 `int`，这样路由 `/posts/something` 将返回 404 错误。\n\n### 文件与目录\n\n\
    处理文件和目录可能会迅速变成一项枯燥且耗时的任务。Python 提供了方便的方法帮助你遍历目录并对文件进行操作。\n\n以下代码将以自顶向下的方式扫描所有目录和子目录：\n\
    \n```python\nimport os\nfor root, dirs, files in os.walk(\".\"):\n    print(root)\n\
    \    for name in files:\n        print(os.path.join(root, name))\n```\n\n"
