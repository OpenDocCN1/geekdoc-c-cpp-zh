  trans: "\n\n# 5. 无效：参数名称中的符号 $\n\n## 练习\n\n**问题：** 修改下面的函数，使其返回问候而不是打印它：\n\n```python\n\
    def hi():\n    greeting = “Hello world!!!\"\n    print(greeting)\n```\n\n**答案：**\n\
    \n```python\ndef hi():\n    greeting = “Hello world!!!\n    return greeting\n\
    ```\n\n## If/Else 和条件语句\n\n在本书到目前为止，我们涵盖的简单语句和操作有许多用处。然而，任何编程的主要目的都是为了实现某种逻辑。\n\
    \n`if/else` 块是 Python 中的核心语法元素。它们允许你根据条件控制程序的执行流。\n\n在以下场景中，你想知道你的汽车行驶行驶得是否太快。如果你的速度超过了\
    \ 100 km/h，函数将打印“Too fast!”。如果你行驶速度低于限速，函数将打印“You are driving below the speed\
    \ limit. Well done.”。\n\n代码看起来是这样：\n\n```python\ndef drive(car_speed):\n    if\
    \ car_speed > 100:\n        print(“Too fast!”)\n    else:\n        print(“You\
    \ are driving below the speed limit. Well done”)\n\n>>> drive(70)\nYou are driving\
    \ below the speed limit. Well done\n\n>>> drive(120)\nToo fast!\n```\n\n上面的代码中有几点需要注意。\n\
    \n首先，是 `>` 运算符。它是一个布尔比较运算符，与数学中使用的相同。如果第一个项目大于第二个项目，它返回 `True`，否则返回 `False`。\n\
    \n其次，是 `if/else` 语法。如果 `is_too_fast` 为 `True`，则执行第一块代码。否则，则执行第二块代码。\n\n第三，是缩进。函数内部的语句被缩进，`if/else`\
    \ 块内部的语句进一步缩进。\n\n## 布尔表达式\n\n![](img/00016.jpeg)\n\n```python\ngreenApple = 100\n\
    redApple = 135\n\nprint(greenApple == redApple)      #测试 100 和 135 是否相等\n#False\n\
    \nprint(greenApple < redApple)      #测试 100 是否小于 135\n#True\n\nprint(greenApple\
    \ != redApple)      #测试是否不等\n#True\n```\n\n```python\n>>> bool(1)\nTrue\n>>> bool(\"\
    \")\nFalse\n>>> bool(None)\nFalse\n>>> bool(\"blah\")\nTrue\n>>> bool(0)\nFalse\n\
    >>> bool(True)\nTrue\n```\n\n在 Python 中，任何值都可以被解释为 `True` 或 `False`。在数据类型中，值 `0`、`\"\
    \"` - 空字符串、`None` 以及 `False` 本身都是 `False`。任何其他值都是 `True`。\n\n可以通过将值转换为布尔类型来检查该值是\
    \ `True` 还是 `False`：\n\n还有几个内置的比较运算符，如 `>`，在调用时会返回 `True` 或 `False`。下表提供了这些运算符的概述。\n\
    \n| 运算符 | 语句 | 语句的返回值 |\n| --- | --- | --- |\n| 小于 | `1 < 2` `4 < 3` | True False\
    \ |\n| 小于等于 | `2 <= 2` `4 <= 3` | True False |\n| 大于 | `2 > 1` `3 > 3` | True\
    \ False |\n| 大于等于 | `2 >= 2` `3 >= 4` | True False |\n| 等于 | `\"foo\" == \"foo\"\
    ` `0 == 1` | True False |\n| 不等于 | `\"foo\" != \"bar\"` `11 != (10 + 1)` | True\
    \ False |\n| 与 (两部分都为 True) | `3 and \"foo\"` `None and True` | True False |\n\
    | 或 (部分中的之一必须为 True) | `1 or None` `None or False` | True False |\n| 非 (与目标表达式相反)\
    \ | `not None` `not True` | True False |\n\n注意，比较运算符的优先级高于逻辑运算符 `and`、`or` 和 `not`。所有数学运算符的优先级都高于比较运算符。这里有几个复合示例，说明了如何使用布尔运算符：\n\
    \n```python\n>>> 2 * 6 + 1 < 2 * (6 + 1)\nTrue\n>>> 2 * 6 + 1 == 2 * (6 + 1) -\
    \ 1\nTrue\n>>> 2 ** 3 == 8 and 2 ** 2 == 16\nFalse\n>>> (2 ** 2 == 4 and False)\
    \ or (not (16 < 15 or or == 3))\nTrue\n```\n\n## 备选分支\n\n在很多情况下，逻辑可以比两个条件更复杂。让我们修改创建的\
    \ `speed` 函数，使其在速度超过 200 km/h 时打印“You are insane, man!!!”，并在速度于 70 到 80 km/h 之间时打印“The\
    \ optimal speed for your car.”。\n\n```python\ndef drive(car_speed):\n    if car_speed\
    \ > 200:\n        print(“You are insane, man!!!”)\n    elif car_speed > 100:\n\
    \        print(“Too fast!”)\n    elif car_speed > 70 and car_speed < 80:\n   \
    \     print(“The optimal speed for your car.”)\n    else:\n        print(“You\
    \ are driving below the speed limit. Well done”)\n```\n\n"
- fmt: "\nHere, we have implemented a car in Python:\n\n```python\nclass Car:\n  \
    \  def turn_left(self):\n        pass\n    def turn_right(self):\n        pass\n\
    \    def accelerate(self):\n        pass\n    def slow_down(self):\n        pass\n\
    \    def open_a_window(self):\n        pass\n```\n\nIn the code above, we have\
    \ created a class. A class is an entity that has specific behaviours. These behaviours\
    \ take the form of methods, which are the same as the functions we have used previously,\
    \ and are indented in the same way. The methods of a class are given the class\
    \ (`self`) as their first parameter. The `pass` keyword tells Python that this\
    \ code block does nothing.\n\nThere are a variety of different cars that this\
    \ class could represent - BMW, Mercedes, Audi, Fiat, Tesla, and many others. Let’s\
    \ create a car with some parameters.\n\n```python\nbmw_x6 = Car(model=\"BMW X6\"\
    , max_speed=230)\n```\n\nIn the code above you can see that the car object was\
    \ created with two parameters: `model` and `max_speed`. The original car code\
    \ has nothing that would support them. In order to implement this support you\
    \ must introduce an `__init__` method:\n\n```python\nclass Car:\n    def __init__(self,\
    \ model, max_speed):\n        self.model = model\n        self.max_speed = max_speed\n\
    \        self.speed = 0\n        ...\n```\n\nThe code above takes your new car\
    \ object (`self`) and uses the dot notation to assign the car’s `model` and `max_speed`.\
    \ The car begins with a speed of zero.\n\nThe `__init__` method shouldn’t contain\
    \ a return statement - it’s just used to build your object. This method is called\
    \ the “class constructor”.\n\nAccelerating and slowing down should decrease and\
    \ increase the car’s speed appropriately:\n\n```python\nclass Car:\n    ...\n\
    \    def accelerate(self, speed_difference):\n        self.speed += abs(speed_difference)\n\
    \        self.speed = min(self.speed, self.max_speed)\n    def slow_down(self,\
    \ speed_difference):\n        self.speed -= abs(speed_difference)\n        self.speed\
    \ = max(self.speed, -5)\n        ....\n```\n\nThe internal state of the object\
    \ is changed using the dot notation. The `min` and `max` functions are used to\
    \ guarantee that the car never exceeds the maximum speed, or travels below -5\
    \ km/h (reverse transmission).\n\nThe following code would accelerate the car\
    \ by 30 km/h.\n\n```python\nbmw_x6.accelerate(30)\n```\n\nWhen you’re creating\
    \ more than one class, you may want some of them to have relationship with each\
    \ other. For example, a Car is a `Vehicle`, and a Bus is also a `Vehicle`. Although\
    \ they share many similarities, they have very different internal structures.\n\
    \nTo reflect similarities and differences in objects, Python has a feature called\
    \ inheritance.\n\nIn this example, we implement a `Vehicle` class, which has `model`\
    \ and `max_speed` parameters like the `Car` class.\n\n```python\nclass Vehicle:\n\
    \    def __init__(self, model, max_speed):\n        self.model = model\n     \
    \   self.max_speed = max_speed\n        self.speed = 0\n    def accelerate(self,\
    \ speed_difference):\n        self.speed += abs(speed_difference)\n        self.speed\
    \ = min(self.speed, self.max_speed)\n    def slow_down(self, speed_difference):\n\
    \        self.speed -= abs(speed_difference)\n        self.speed = max(self.speed,\
    \ -5)\n        ...\n```\n\nNow we want to create `Car` and `Bus` classes; the\
    \ `Car` class is identical, but the `Bus` class doesn’t have a reverse transmission.\n\
    \n```python\nclass Car(Vehicle):\n    pass\nclass Bus(Vehicle):\n    def slow_down(self,\
    \ speed_difference):\n        super().slow_down(speed_difference)\n        self.speed\
    \ = max(self.speed, 0)\n```\n\nThe word `Vehicle` between the parentheses after\
    \ the class name makes the `Car` and `Bus` classes inherit from `Vehicle`. In\
    \ the `Bus` class, the `slow_down` method overrides the behavior of the parent\
    \ class. The `super()` statement makes a call to the parent class to find the\
    \ new speed, and then makes sure that this speed is not below 0 km/h.\n\n### Quiz\n\
    \n**Problem:**\n1. What would a software engineer call a collection of behaviors\
    \ that the user can use?\n2. What is the name of the relationship between classes?\n\
    3. What is the general term for methods used to create objects in Python? For\
    \ example: `__init__(name, max_speed)`.\n4. What is missing from the method?\n\
    \n**Answer:**\n1. Interface\n2. Inheritance\n3. class constructor.\n4. `self`\
    \ argument is missing\n\n**Problem:** Write Python code that would make X6 accelerate\
    \ by 100 km/h\n**Answer:**\n`bmw_x6.accelerate(100)`\n\n**Problem:** Introduce\
    \ a `Bike` class that is also a `Vehicle`. The main feature of a bike is that\
    \ it can never be faster than 30 km/h.\n**Answer:** You need to make sure that\
    \ max speed is capped by 30 km/h in `Bike`’s constructor\n```python\nclass Bike(Vehicle):\n\
    \    def __init__(self, name, max_speed):\n        max_speed = min(max_speed,\
    \ 30)\n        super().__init__(name, max_speed)\n```\n\n**Problem:** Add to your\
    \ code from previous exercise a new method called `show_status` that prints something\
    \ like “The bike, its speed is 27 km/h”\n**Answer:** Method’s implementation is\
    \ supposed to look like\n```python\ndef show_status(self):\n    print(\"The bike\
    \ is \" + self.name + \", its speed is \" + str(self.speed) + \" km/h\")\n```\n\
    \n### Collections\n\nIn many cases, you want to perform the same action on a lot\
    \ of similar objects. For example, in real life, you might want to iron your socks.\
    \ It’t make sense for you to consider each individually as a unique object requiring\
    \ special treatment. In programming, this is where collections come handy. A good\
    \ analogy for collections is a set of lockers.\n\nPython has two types of lockers:\
    \ ones with name tags, and anonymous ones indexed by number. To access items in\
    \ the anonymous locker room, you can either go through all the lockers one by\
    \ one, or access a specific one by an integer index. In Python, these lockers\
    \ are represented by `lists` and `tuples`. For lockers with name tags, you can\
    \ either go through each locker by one, or you can look at a specific name tag.\
    \ In Python, these lockers are represented by `dictionaries`. This chapter provides\
    \ an overview of built-in collections. (images/0018.jpeg)\n\n### Tuples\n\nTuples\
    \ are immutable arrays of variables.\n\n(images/0019.jpeg)\n\nYou can access the\
    \ elements of tuples in the following way:\n\n```python\n>>> my_tuple = (\"apple\"\
    , \"pear\", \"banana\")\n>>> my_tuple[1:] # second to the end\n('pear', 'banana')\n\
    >>> my_tuple[2][2] # 3rd character of 3rd item\n'n'\n```\n\n“Immutable” means\
    \ that once you define a tuple, you can’t change it.\n\n```python\n>>> my_tuple[2]\
    \ = \"mango\" # replace 'banana' with 'mango'\nTypeError: 'tuple' object does\
    \ not support item assignment\n['apple', 'pear', 'mango']\n>>> my_tuple[2][0]\
    \ = \"B\" # try to change the 'b' with \"B\" and you will get an error\nTypeError:\
    \ 'str' object does not support item assignment\n```\n\n```python\n>>> new_tuple\
    \ = ('foo', 'bar', 'zoo', 'loo')\n>>> type(new_tuple)\n<class 'tuple'>\n>>> new_tuple[0]\n\
    'foo'\n>>> new_tuple[3]\n'loo'\n>>> new_tuple[1:3]\n('bar', 'zoo')\n>>> len(new_tuple)\n\
    4\n>>> new_tuple * 2\n('foo', 'bar', 'zoo', 'loo', 'foo', 'bar', 'zoo', 'loo')\n\
    >>> new_tuple + ('blah', 'blah')\n('foo', 'bar', 'zoo', 'loo', 'blah', 'blah')\n\
    ```\n\nYou can see from the code above that tuples behave similarly to strings\
    \ - however, strings are arrays of just characters, whereas tuples can contain\
    \ any kind of variable. You can slice, index, concatenate, and multiply tuples\
    \ in the same way that you can with strings. Syntactically, tuple items must be\
    \ surrounded by parentheses, and separated by commas. Even tuples containing a\
    \ single item must have a comma: `(1,)` is a tuple, but `(1)` is not.\n\n### Lists\n\
    \nLists are like tuples that you can change after you’ve created them. Lets define\
    \ a simple list with three items:\n\n(images/0020.jpeg)\n\n```python\n>>> my_list\
    \ = [\"apple\", \"pear\", \"banana\"]\n>>> my_list[1:] # second to the end\n['pear',\
    \ 'banana']\n>>> my_list[2][2] # 3rd character of 3rd item\n'n'\n```\n\n(images/0021.jpeg)\n\
    \n```python\n>>> my_list[2] = \"mango\" # replace 'banana' with 'mango'\n>>> my_list\n\
    ['apple', 'pear', 'mango']\n```\n"
