    3.  self.model = model


    4.  self.max_speed = max_speed


    5.  self.speed = 0


    6.  def accelerate(self, speed_difference):


    7.  self.speed += abs(speed_difference)


    8.  self.speed = min(self.speed, self.max_speed)


    9.  def slow_down(self, speed_difference):


    10.  self.speed -= abs(speed_difference)


    11.  self.speed = max(self.speed, -5)


    12.  ...


    Now we want to create Car and Bus classes; the Car class is identical, but the
    Bus class doesn’t have a reverse transmission.


    1.  class Car(Vehicle):


    2.  pass


    3.  class Bus(Vehicle):


    4.  def slow_down(self, speed_difference):


    5.  super().slow_down(speed_difference)


    6.  self.speed = max(self.speed, 0)


    The word “Vehicle” between the perentheses after the class name makes the Car
    and Bus classes inherit from Vehicle.


    In the Bus class, the slow_down method overrides the behavior of the parent class.


    The super() statement makes a call to the parent class to find the new speed,
    and then makes sure that this speed is not below 0 km/h.


    Quiz


    Problem:


    1.  What would a software engineer call a collection of behaviors that the user
    can use?


    2.  What is the name of the relationship between classes?


    3.  What is the general term for methods used to create objects in Python? For
    example, the following method: __init__(name, max_speed).


    4.  What is missing from the method in the previous question?


    Answer:


    1.  Interface


    2.  Inheritance


    3.  class constructor.


    4.  self argument is missing


    Exercises


    Problem: Write Python code that would make BMW X6 accelerate by 100 km/h


    Answer:


    1.  bmw_x6.accelerate(100)


    Exercises


    Problem: Introduce a Bike class that is also a Vehicle. The main feature of a
    bike is that it can never ever be faster than 30 km/h.


    Answer: You just need to make sure that max speed is capped by 30 km/h in Bike’s
    constructor


    1.  class Bike(Vehicle):


    2.  def __init__(self, name, max_speed):


    3.  max_speed = min(max_speed, 30)


    4.  super().__init__(name, max_speed)


    Exercises


    Problem: Add to your code from the previous exercise a new method called show_status
    that prints something like “The bike is BMX, its speed is 27 km/h”


    Answer: Method’s implementation is supposed to look the following way:


    1.  def show_status(self):


    2.  print(“The bike is “ + self.name + “, its speed is “


    3.  str(self.speed) + “ km/h”)


    Collections


    In many cases, you want to perform the same action on a lot of very similar objects.
    For example, in real life, you might want to iron your socks. It wouldn’t make
    sense for you to consider each one individually as a unique object requiring special
    treatment.


    In programming, this is where Python collections come in handy. A good analogy
    for collections is a set of lockers.


    Python has two types of lockers: ones with name tags, and anonymous ones, indexed
    only by number.


    To access items in the anonymous locker room, you can either go through all the
    lockers one by one, or access a specific one by an integer index. In Python, these
    lockers are represented by lists and tuples.


    For lockers with name tags, you can either go through each locker one by one,
    or you can look at a specific name tag. In Python, these lockers are represented
    by dictionaries.


    This chapter provides an overview of built-in Python collections.


    ![](images/00018.jpeg)


    Tuples


    Tuples are immutable arrays of variables.


    ![](images/00019.jpeg)


    You can access the elements of tuples in the following way:


    >>> my_tuple = (“apple”, “pear”, “banana”)


    >>> my_tuple[1:]               # from second to the end


    ‘pear’, ‘banana’


    >>> my_tuple[2][2]             # 3rd character of 3rd item


    ‘n’


    “Immutable” means that once you define a tuple, you can’t change it.


    >>> my_tuple[2] = “mango”            # replace ‘banana’ with ‘mango’


    TypeError: ‘tuple’ object does not support item assignment


    [‘apple’, ‘pear’, ‘mango’]


    >>> my_tuple[2][0] = “B”               # try to change the ‘b’ with “B” and you


                                                                    # will get an error


    TypeError: ‘str’ object does not support item assignment


    >>> new_tuple = (‘foo’, ‘bar’, ‘zoo’, ‘loo’)


    >>> type(new_tuple)


    <class ‘tuple’>


    >>> new_tuple[0]


    ‘foo’


    >>> new_tuple[3]


    ‘loo’


    >>> new_tuple[1:3]


    (‘bar’, ‘zoo’)


    >>> len(new_tuple)


    4


    >>> new_tuple * 2


    (‘foo’, ‘bar’, ‘zoo’, ‘loo’, ‘foo’, ‘bar’, ‘zoo’, ‘loo’)


    >>> new_tuple + (‘blah’, ‘blah’)


    (‘foo’, ‘bar’, ‘zoo’, ‘loo’, ‘blah’, ‘blah’)


    You can see from the code snippet above that tuples behave similarly to Python
    strings - however, strings are arrays of just characters, whereas tuples can contain
    any kind of variable.


    You can slice, index, concatenate, and multiply tuples in the same way that you
    can with strings.


    Syntactically, tuple items must be surrounded by parentheses, and separated by
    commas. Even tuples containing a single item must have a comma: (1,) is a tuple,
    but (1) is not.


    Lists


    Lists are like tuples that you can change after you’ve created them.


    Lets define a simple list with three items:


    ![](images/00020.jpeg)


    >>> my_list[1:]                # from second to the end


    ‘pear’, ‘banana’


    >>> my_list[2][2]              # 3rd character of 3rd item


    ‘n’


    ![](images/00021.jpeg)


    >>> my_list[2] = “mango”             #replace ‘banana’ with ‘mango’


    >>> my_list'
