    \nSometimes, you’ll want functions to alter their behaviour in different conditions.\n\
    \nTo do this, you can use function arguments.\n\nLet’s say you want to say hi\
    \ not just to Mr. Jones, but to a person with any name.\n\nYou’ll have to edit\
    \ the original hi() function to look like this:\n\n1.  def hi(name):\n\n2.  print(“Hello “ + name + “! How are you today?”)\n\
    \nThe function now accepts a single argument, which is a variable called “name”.\
    \ Later, “name” is concatenated with two parts of the original string to give\
    \ your new greeting.\n\nNow you can say hi to John, James, and Maggie, like so:\n\
    \n1.  hi(“John”)\n\n2.  hi(“James”)\n\n3.  hi(“Maggie”)\n\nThis would sequentially\
    \ print:\n\nHello John! How are you today?\n\nHello James! How are you today?\n\
    \nHello Maggie! How are you today?\n\nNote, instead of passing a value directly\
    \ you can assign the value to a variable and pass the variable to the function.\n\
    \n1.  first_name = “John”\n\n2.  hi(first_name)\n\nOnce you’ve set up the function\
    \ to use an argument, trying to call it without supplying an argument will cause\
    \ an error.\n\nDefault values\n\nTo avoid these errors, you can give your arguments\
    \ default values, which can be overridden if needed.\n\n1.  def hi(name=”sir”):\n\
    \n2.  print(“Hello “ + name + “! How are you today?”)\n\nIn this case you can\
    \ call the function with and without the argument. Calling:\n\n1.  hi()\n\n2.\
    \  hi(“James”)\n\nwould print:\n\nHello sir! How are you today?\n\nHello James!\
    \ How are you today?\n\nFunctions can have a mixture of arguments with default\
    \ values and without. Those with default values have to come at the end of the\
    \ argument list.\n\n1.  def foo(bar, zoo=”blah”):\n\n2.  ...\n\nis valid. Meanwhile:\n\
    \n1.  def foo(bar=”blah”, zoo):\n\n2.  ...\n\nis not.\n\nReturn values\n\nLets\
    \ have a look at one of the code snippets that was covered previously in the exercises:\n\
    \n1.  N = 10\n\n2.  distance_in_kilometers = 100 * N\n\n3.  distance_in_meters = distance_in_kilometers * 1000\n\
    \nWhat if you want to encapsulate this logic in a function in such a manner that\
    \ you could pass time in hours and speed in km/h and somehow get back a distance\
    \ traveled in meters?\n\nThis logic could be implemented using the following function:\n\
    \n1.  def get_distance(speed, duration):\n\n2.  distance_in_kilometers = speed * duration\n\
    \n3.  distance_in_meters = distance_in_kilometers * 1000\n\n4.  return distance_in_meters\n\
    \nThe function’s last line contains a return statement. The best way to understand\
    \ what it does is to have a look at several invocations of the function:\n\n1.\
    \  speed = 100\n\n2.  initial_distance = get_distance(speed, 0)\n\n3.  distance_after_a_day = get_distance(speed, 24)           # day is 24 hours\n\
    \n4.  distance_after_a_week = get_distance(speed, 24 * 7)      # week is 7 days\n\
    \nAs you may have guessed, the return statement allows you to store the output\
    \ of the function in a variable. After executing the lines above the variables\
    \ shall have the following values:\n\n| variable | value |\n\n| --- | --- |\n\n\
    | initial_distance | 0 |\n\n| distance_after_a_day | 2400000 |\n\n| distance_after_a_week\
    \ | 16800000 |\n\nExercises\n\nProblem: There is a mathematical function f(x,y)\
    \ = x^y + 100.\n\nImplement the function in Python.\n\nAnswer:\n\n1.  def function(x, y):\n\
    \n2.  return x ** y + 100\n\nExercises\n\nProblem: Which function definitions\
    \ are valid?\n\n1.  @foo(bar):\n\n2.  _foo(bar = 1):\n\n3.  foo(bar = 2, bla = 1):\n\
    \n4.  foo(bar = 2, bla):\n\n5.  foo($bar, bla = 1):\n\nAnswer:\n\n1.  invalid: symbol  @  in function’s name\n\
    \n2.  valid\n\n3.  valid: there are several arguments with default values\n\n\
    4.  invalid: argument without default value"
