    \ returns None:\n\n>>> match = re.search(“found”, lorem_text)\n\n>>> type(match)\n\
    \n<class ‘NoneType’>\n\nYou may get start and end indices of the substring from\
    \ the match object:\n\n>>> found.start()\n\n12\n\n>>> found.end()\n\n26\n\nand\
    \ access the substring matched by the pattern:\n\n>>> found.group()\n\n‘dolor sit amet’\n\
    \n>>> lorem_text[12:26]\n\n‘dolor sit amet’\n\nNote: if multiple occurrences of\
    \ the patter are found, only the first one is returned. If you need to go through\
    \ all of the occurrences, use the re.finditer function:\n\n>>> list(re.finditer(“dolor .*amet”, lorem_text))\n\
    \n[<_sre.SRE_Match object; span=(12, 26), match=’dolor sit amet’>]\n\nIf you want\
    \ to see if a string matches a certain pattern, you should use the re.match function,\
    \ which tries to apply the pattern to the whole string:\n\n>>> bool(re.match(“[0-9][a-z]*”, “0dgfgfg”))\n\
    \nTrue\n\n>>> bool(re.match(“[0-9][a-z]*”, “dgfgfg”))\n\nFalse\n\nThe symbols\
