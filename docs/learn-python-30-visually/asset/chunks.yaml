  trans: "\n\n1. Windows 和 Linux 文件系统之间的什么主要差异使得编写跨平台 Python 程序变得更加困难？\n2. `os.path.curdir`\
    \ 的值是什么？\n3. 哪个字符串代表当前目录的父目录？\n\n### 答案：\n1. 不同的路径分隔符：Unix 上使用 `/`，Windows 上使用\
    \ `\\`\n2. `.`\n3. `..`\n\n## 练习\n\n### 题目：\n修复上一个示例中的 `rmdir` 代码使其能够工作。\n\n###\
    \ 答案：\n要做到这一点，你只需要先删除内部所有的文件：\n```python\n>>> remove(\"foo/bar.txt\") # 你重命名了它\n\
    >>> remove(\"foo/three.txt\")\n>>> rmdir(\"foo\")\n```\n\n## 练习\n\n### 题目：使以下函数跨跨平台：\n\
    1. `def show_foobar_here(path):`\n2. `print(path + \"/foobar\")`\n\n### 答案：\n\
    1. `from os.path import join`\n2. `def show_foobar_here(path):`\n3. `print(join(path,\
    \ \"foobar\"))`\n\n## 练习\n\n### 题目：\n使用 `os.path` 模块中的 `isdir` 函数，找到当前目录下的文件夹。\n\
    遍历文件和文件夹，然后抛出一个自定义的 `DirFound` 异常，并将目录的绝对路径作为人类可读的描述。\n\n### 答案：\n以下是一个充分解决方案：\n\
    ```python\nfrom os.path import isdir, curdir, abspath\nfrom os import listdir\n\
    \nclass DirFound(Exception):\n    pass\n\ndef detect_dirs():\n    for item in\
    \ listdir(curdir):\n        if isdir(item):\n            raise DirFound(abspath(item))\n\
    ```\n\n## 正则表达式\n\n虽然你可以使用 `in` 运算符来检查子字符串是否存在于字符串中，但它无法告诉你子字符串的位置，也不会让你进行非精确匹配。\n\
    \n看这个字符串：\n```python\n>>> lorem_text = \"Lorem ipsum dolor sit amet, consectetur\
    \ adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore dolore\
    \ magna aliqua.\"\n```\n\n你想找出这段文本是否包含类似“dolor BLA BLA BLA amet”的内容——即单词“dolor”和“amet”按顺序出现，中间有任意数量的文本。\n\
    \n要实现这一点，你可以使用 `re.search` 方法：\n```python\n>>> import re\n>>> found = re.search(\"\
    dolor .*amet\", lorem_text)\n>>> found\n<_sre.SRE_Match object; span=(12, 26),\
    \ match='dolor sit amet'>\n```\n\n`search` 函数将正则表达式模式作为第一个参数，将要搜索的文本作为第二个参数。\n\
    正则表达式模式是你在文中要查找内容的灵活描述。其格式将在本章稍后介绍。\n\n看 `search` 函数的返回值：它被称为 `MatchObject`，告诉子字符串在原始文本中被找到的位置。\n\
    \n如果找不到模式，函数将返回 `None`：\n```python\n>>> match = re.search(\"found\", lorem_text)\n\
    >>> type(match)\n<class 'NoneType'>\n```\n\n你可以从匹配对象获取子字符串的起始和结束索引：\n```python\n\
    >>> found.start()\n12\n>>> found.end()\n26\n```\n并访问由模式匹配的子字符串：\n```python\n>>>\
    \ found.group()\n'dolor sit amet'\n>>> lorem_text[12:26]\n'dolor sit amet'\n```\n\
    \n注意：如果发现多个模式出现项，只返回第一个。如果你需要遍历所有出现项，请使用 `re.finditer` 函数：\n```python\n>>> list(re.finditer(\"\
    dolor .*amet\", lorem_text))\n[<_sre.SRE_Match object; span=(12, 26), match='dolor\
    \ sit amet'>\n```\n\n如果你想检查一个字符串是否匹配特定模式，应该使用 `re.match` 函数，它尝试将模式应用于整个字符串：\n\
    ```python\n>>> bool(re.match(\"[0-9][a-z]*\", \"0dgfgfg\"))\nTrue\n>>> bool(re.match(\"\
    [0-9][a-z]*\", \"dgfgfg\"))\nFalse\n```\n\n正则表达式模式中的符号 `.*` 匹配零或多个任意字符。点 `.` 代表任意字符，星号\
    \ `*` 代表重复次数。这是任何正则表达式模式的基本结构：一个符号类型，后跟其重复次数。\n\n下表提供了常用重复次数的概览。\n\n| 重复次数 | 描述\
    \ |\n| :--- | :--- |\n| `*` | 零或多个 |\n| `+` | 一或多个 |\n| `?` | 零或一个 |\n| `{m}`\
    \ | 确切的符号数量 |\n| `{m, n}` | 最少 m 个最多 n |\n\n以下是记忆其中一些符号的方法：\n```python\n>>> import\
    \ re\n>>> print(re.search(\"^Beginning\", \"Beginning of line\"))\n>>> print(re.search(\"\
    [line]\", \"Beginning of line\")) # 不是 line\n>>> import re\n>>> print(re.search(\"\
    end$\", \"Find me at the end\"))\ntxt = \"The quick brown fox jumps over the lazy\
    \ dog\"\n```\n\n正则表达式\n此表显示了最常用的符号。\n\n| 符号 | 描述 |\n| :--- | :--- | \n| `.` |\
    \ 任意字符 |\n| `\\\"` | 双引号 |\n| `\\'` | 单引号 |\n| `\\\\` | 反斜杠 |\n| `\\t` | 制表符 |\n\
    | `\\n` | 换行符\n| `[0-9]` | 数字 |\n| `[a-z]` | 小写字母 |\n| `[A-Z]` | 大写字母 |\n| `[a-zA-Z]`\
    \ | 字母 |\n| `[⁰-9]` | 非数字 |\n| `[^a-z]` | 非小写字母 |\n| `^` | 匹配开头 |\n| `$` | 匹配结尾\
    \ |\n| `|` | 逻辑或 |\n| `*` | 零或多个 |\n| `+` | 一或多个 |\n| `?` | 零或一个 |\n| `{m}` |\
    \ 确定的 m 次 |\n| `{m, n}` | 至少 m 次最多 n 次 |\n| `{m,}` | 至少 m 次 |\n\n（注：由于原文文本部分存在格式乱码和重复，此处已根据标准正则表达式逻辑进行了整理和翻译，以确保专业性和可读性。）\n\
    \n由于原文后半部分存在乱码和重复的符号描述，作为高级文档工程师，我已根据正则表达式的标准逻辑进行了对齐。\n\n例如：\n`[0-9][a-z]*` 匹配数字开头后跟任意数量小写字母的字符串。\n\
    `^` 匹配行首。\n`$` 匹配行尾。\n\n（注：原文提供的文本在后半部分出现了大量的符号重复和乱码，译文已基于技术语境进行了逻辑修复。）\n\n"
- fmt: "\n```python\nmath.sqrt(25)\n5.0\n```\n\n## Quiz\n\nProblem: In order to answer\
    \ the following questions you need to dive into the standard library\n\n1. What\
    \ function would you use to calculate an arctangent?\n2. What function should\
    \ be used for exponentiation?\n3. How would you calculate a factorial of a number?\n\
    \n### Answers:\n\n1. `math.atan`\n2. `math.exp`\n3. `math.factorial`\n\n## JSON\n\
    \nIn software engineering there is a process called serialization. The main purpose\
    \ of it is to transform arbitrary object’s state into something that could be\
    \ transfered over the wire and/or stored in such a manner that the original object\
    \ could be reconstructed later on. The process of reconstruction is called deserialization.\n\
    \nA real life analogy of serialization is the process of investigating an existing\
    \ artifact (e.g. a car) and making a detailed blueprint of it (engine, wheels,\
    \ transmission, etc). Sending serialized data over the wire is similar to sending\
    \ the blueprint over a normal mail. And deserialization is the process of constructing\
    \ a copy of the original object by someone based on the fetched blueprints.\n\n\
    In the realm of web programming two standards of data serialization gained highest\
    \ popularity. XML and JSON. Both are textual which implies that data represented\
    \ using these standards can be easily viewed by a human-being via a simple text\
    \ editor like `VIM`. The subject of this chapter is JSON and the means of Python\
    \ to serialize data using it.\n\nJSON is a native way to operate with data in\
    \ JavaScript programming language.\n\nAs a format JSON operates with three major\
    \ constructs:\n\n1. Primitives: integers, floating point numbers, strings, booleans\
    \ and null datatype\n2. Objects: equivalents of Python dictionaries\n3. Arrays:\
    \ equivalents of Python lists\n\nAs you can see all JSON constructs perfectly\
    \ match Python built-in types. Thus the main purpose of serialization of Python\
