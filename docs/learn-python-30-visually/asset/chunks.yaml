    \n               ‘”subscribe@pythonvisually.com”, “Mike Stark”)’)\n\ncursor.execute(‘INSERT INTO cars VALUES(NULL, “Toyota”, “Prius”, 1)’)\n\
    \nExercises\n\nProblem: Write an SQL command that would let you remove any car\
    \ produced by Ford.\n\nAnswer:\n\n1.  DELETE FROM cars WHERE brand = “Ford”\n\n\
    Exercises\n\nProblem: Write an SQL command to remove every car owned by user #17.\n\
    \nAnswer:\n\n1.  DELETE FROM cars WHERE owner = 17\n\n![](images/00030.jpeg)\n\
    \n3rd party packages\n\nAside from the default Python packages, there are a variety\
    \ of 3rd party solutions.\n\nIn order to use them in a similar fashion as the\
    \ standard library they must be placed under PYTHONPATH.\n\nPYTHONPATH is an environment\
    \ variable that tells the interpreter where to look for Python source files.\n\
    \nThe standard way to install Python packages is to use “pip”, which has a simple\
    \ command line interface.This is how to install:\n\nhttps://pip.pypa.io/en/latest/installing.html\n\
    \nFind all packages that have a “nose” string in their name:\n\npip search nose\n\
    \nInstall a package named “nose”:\n\npip install nose\n\nShow information about\
    \ the “nose” package.\n\npip show nose\n\nGet rid of the nose package:\n\npip uninstall nose\n\
    \nWeb Development with Flask\n\nPython can be a great choice when it comes to\
    \ creating websites, and there are a lot of frameworks out there to help you with\
    \ this task. This chapter provides an overview of one of them, Flask ([http://flask.pocoo.org/](http://flask.pocoo.org/)),\
    \ which is very easy to get started with.\n\nFlask is a microframework, it keeps\
    \ its core simple but extensible. The base framework is intended to be very lightweight,\
    \ while new features can be added through extensions. Core features are:\n\n*\
    \   built in development server and debugger\n\n*   integrated unit testing support\n\
    \n*   heavily uses HTTP methods\n\n*   uses Jinja2 templating\n\n*   supports\
    \ secure cookies\n\n*   100% WSGI 1.0 compliant\n\n*   unicode based\n\n*   extensively\
    \ tested and documented\n\nTo begin with, install the framework:"
