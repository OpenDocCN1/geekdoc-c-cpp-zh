- fmt: "\n# Problem\n1. What does a newline character look like?\n2. What are you\
    \ supposed to do with the file once you are done working with it?\n3. Which method\
    \ is used to put data into the file?\n4. What method should you use to get all\
    \ the lines from the file?\n\n# Answer\n1. `\\n`\n2. Close it\n3. `write`\n4.\
    \ `readlines`\n\n## Exceptions\n\nSometimes something unexpected happens that\
    \ stops a program from executing as it should. These events are called “exceptions”.\n\
    \n```python\n>>> 1 / 0\n```\n\nAfter you hit enter, you’ll see the following output:\n\
    \n```text\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in\
    \ <module>\nZeroDivisionError: division by zero\n```\n\nThis is called an exception\
    \ traceback. It shows you which functions or methods were called before the exception\
    \ happened. The last line tells you which exception was raised and gives you some\
    \ additional, human-readable information.\n\nIn Python, you can achieve this via\
    \ a `try/except` block.\n\n### What if an exception happens in the middle of something\
    \ important?\n\nLet’s print “division by zero. But it is totally fine.” instead\
    \ of throwing a traceback.\n\n```python\ntry:\n    1 / 0\nexcept ZeroDivisionError\
    \ as e:\n    print(str(e) + “. But it is totally fine.\")\n```\n\nIn the code\
    \ above, you can see that the statements you want to make an attempt to execute\
    \ go into the `try` block. And all the error handling code goes under `except`.\
    \ The `except` keyword must be accompanied with a class of the exception. It also\
    \ can be followed by an `as` keyword and a variable which is supposed to store\
    \ a human-readable description of the error.\n\n### Custom exceptions\n\nYou can\
    \ define your own exception classes to further notify that something extraordinary\
    \ happened inside your code:\n\n```python\nclass YourException(Exception):\n \
    \   pass\n```\n\nAll custom exceptions must have a built-in Python exception as\
    \ a superclass. The exceptions do not have to implement any other logic.\n\nIn\
    \ order to throw an exception, you should use the `raise` keyword:\n\n```python\n\
    raise YourException(\"Human-readable message\")\n```\n\nOnce you execute the code\
    \ above, you shall see a traceback with “Human-readable message” string as an\
    \ extra detail. Handling custom exceptions is not different from handling the\
    \ built-in ones:\n\n```python\ntry:\n    raise YourException(\"Human-readable\
    \ message\")\nexcept YourException as e:\n    print(\"Your exception just occured\
    \ with a message: \" + str(e))\n```\n\n## Quiz\nProblem:\n1. Which block is supposed\
    \ to be used to handle exceptions?\n2. What is the name of the long text blob\
    \ that is printed once an exception takes place?\n\nAnswer:\n1. `try/except` block\n\
    2. `traceback`\n\n![](images/00026.jpeg)\n\n## Import statement and Python modules\
    \ and packages\n\nAll source code in Python, as you may have noticed, is stored\
    \ in various files called `modules`. Each module has a `.py` extension. Different\
    \ modules are logically combined together into collections called `packages`.\
    \ A package is a plain folder with an `__init__.py` file.\n\nE.g. the following\
    \ is a package:\n```text\nfoobar/\n  __init__.py\n  one.py\n  two.py\n  three.py\n\
    ```\n\nAnd this one is not:\n```text\nfoobar/\n  one.py\n  two.py\n  three.py\n\
    ```\n\nDefault Python installation comes with a significant amount of `packages`.\
    \ This set of packages is called a `standard library`.\n\n### Import statement\n\
    \nIf you want to use functionality stored in another package, you must use an\
    \ `import` statement. Let’s print your user name on the screen using Python interpreter:\n\
    \n```python\n>>> import getpass\n>>> getpass.getuser()\n'gunther'\n```\n\nThe\
    \ snippet above shows how to import the most top-level package. As you can see,\
    \ members of the package are supposed to be accessed via the dot operator. You\
    \ may avoid using the dot operator by importing the thing you need directly:\n\
    \n```python\n>>> from getpass import getuser\n>>> getuser()\n'gunther'\n```\n\n\
    To indicate the source of the import, you must use the `from` keyword.\n\nSometimes\
    \ you may want to use multiple entities from the same package. In this case it\
    \ is simpler to import all the entities straight away:\n\n```python\n>>> from\
    \ sys import pydebug, flags\n```\n\nNote, the entities kept inside Python packages\
    \ can be virtually any Python constructs. A `class`, a `function`, a `variable`,\
    \ a `module` or even a `package` (nested packages are possible).\n\n## Quiz\n\
    Problem:\n1. What is the synonym of Python source file?\n2. What is the term for\
    \ folders with Python modules?\n3. What is the name of a collection of Packages\
    \ that comes together with default Python installation?\n4. How to import module\
