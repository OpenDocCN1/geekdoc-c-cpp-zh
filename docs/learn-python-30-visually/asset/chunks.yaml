  trans: "\n\n![](img/cover.jpeg)\n\n# 感谢！\n\n一本书的诞生需要许多人的共同努力。因此，谨向所有帮助我完成这个项目的 Kickstarter\
    \ 资助者们表示以表示最诚挚的“感谢”，并希望我们未来能创造更多伟大的作品。\n\n![](img/00001.jpeg)\n\nAnthony Storms\
    \ Akins\nAlan Prak\nAlessandro\nAndy Lee\nBill Stull\nBrandon Thompson\nCharles\
    \ Rogers\nClément Labadie\nDemian Vonder Kuhlen\nEdgar Rodriguez\nGordon\nGreg_Vee\n\
    Gregory Pfrommer\nGregory R. Kinnicutt\nJ.T. O’Gara\nJanakan\nJeff\nJoe\nJoshua\
    \ Bauder\nMarco Randall\nMarshall Walker\nNeer Patel\nNigel J Allen\nPadrao\n\
    Perry Yap\nR.C. Lewis\nRandy Morris\nRowan Knight\nSebastian Lange\nShahid Ali\
    \ Shah\nShrawan\nStan Spears\n\n## 致谢与法律声明\n\n### 作者\nIvelin Demirov\n\n### 编辑\n\
    * Anton Berezin\n* Beth McMillan\n\n### 页面设计\nJordan Milev\n\n### 插画\nIvelin Demirov\n\
    \n### 校对\nBeth McMillan\n\n### 致谢\n我必须感谢在线 Python 社区的帮助，他们多年来一直辛勤工作，让 Python 成为如今这种令人兴奋的编程语言。\n\
    \n### 版权\n©2015 Ivelin Demirov\n\n### 权利声明\n保留所有权利。未经出版者或作者的书面许可，不得以任何形式、任何手段复制本书的任何部分。\n\
    \n### 商标\n所有商标均归其所有者所有。\n\n### 免责声明\n书中的信息按“原样”提供，不提供任何保证。虽然在编写本书时已采取一切预防措施，但对于由于书中指令或书中描述的计算机软件硬件产品直接或间接造成的任何损失或损害，作者和出版社均不对任何个人或实体承担任何责任。\n\
    \n### 平装版 ISBN\nISBN-13: 978-1507727072\nISBN-10: 1507727070\n\n### 联系方式\npythonvisually.com\n\
    \n## 关于本书\n\n### 问题所在\n人们在第一次尝试时觉得编程很难，这不能怪。学习编程就像学习一门新语言。\n\n有许多需要遵循的规则和语法指南。它还需要记忆每种语言的大量词汇表，除非一个人每天至少从事编程工作\
    \ 8 小时，否则此人不太可能很快熟悉编程；至少直到现在，多年来一直是这样。\n\n### 方法论\n我们的方法涉及通过简单的插图来教授编程概念。\n\n\
    这种视觉化方法之所以有效，是因为它是最基本的学习方式之一。每个人作为婴儿和幼儿，在理解字母和意义产生理解之前，就已经通过视觉和听觉来学习周围的世界。\n\n\
    编程是以模块和构建块的形式工作的。当一个人学习了几个基础模块和步骤后，就可以学习在这些基础单元之上构建更复杂的模块。\n\n这是一种构建块方法，一旦掌握了基础模块，就可以编写出更大的结构。我从一组易于通过插图和比喻学习的基础构建块开始。\n\
    \n从那里，用户可以应用多种变体并进一步构建。然而，最初的构建块将成为某种“罗塞石”，允许用户在未来的任何情况下进行编程和构建。\n\n### 为什么选择\
    \ Python？\n当你开始大学的计算机科学之旅时，你可能会从学习 Python 开始。\n\n那么为什么选择 Python 而不是其他编程语言呢？很简单：\n\
    \n* 无论你的操作系统是什么，Python 都易于设置。\n* Python 代码使用纯英语，易于理解。\n* Python 允许你运行错误的代码。\n\
    \  **为什么这是好事？**\n  当你学习时，难免会犯错。Python 会在你运行代码后告诉你错误是什么，帮助你找到问题。\n* Python 是一个非常强大的工具，但也容易且快速地学习，这就是为什么大多数人偏于它的原因。\n\
    \n### 安装\n已经有预编译的包，方便在多个操作系统上安装，例如 Windows、Linux、UNIX 和 Mac OS 等。\n\n如果你访问 `https://www.python.org/downloads/`，可以为你的操作系统选择正确的安装方法。大多数\
    \ Linux 系统都预装了 `Python`。\n\n本书使用的是 `Python` 版本 3。\n\n在 Windows 中，安装 `Python` 后，从开始菜单或屏幕选择\
    \ `Python IDLE` 或 `Python` 命令行/控制台。\n\n`IDLE` 和 `console` 之间的区别是 `IDLE` 有图形界面，看起来类似于文本编辑器。在\
    \ Linux、UNIX 和 OS X 中，你可以通过命令行输入 `Python` 来启动 `Python` 模拟器。\n\n要选择特定版本的 `Python`，输入\
    \ `PythonX`，其中 `X` 是版本号（例如，版本 3 输入“Python3”）。\n\n![](img/00002.jpeg)\n\n### Hello\
    \ World!\n在你编写 `Python` 代码的大多数时候，你会在 `IDLE` 或任何其他 IDE（如 `Eclipse`）或富文本编辑器（如 `Sublime\
    \ text` 或 `Notepad++`）中编写脚本。然而，你可以使用 `Python` 解释器来交互式地编写代码，因为它作用类似于一个 `UNIX shell`，\n\
    \n虽然可以使用仅用解释器来创建程序，但强烈建议不要这样做，因为很难将代码保存为脚本以便后续复用。\n\n"
