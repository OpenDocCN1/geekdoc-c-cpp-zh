    1.  0 - if you answer was something else you forgot that operations in brackets
    should be performed first - a product of the second expression in brackets - (4
    * 4 - (2 * 6 + 4)) is 0 and anything multiplied by 0 is 0 as well


    Exercises


    Problem: A car has a speed of 100 km/h. Write some code that calculates the distance
    in meters (not kilometers!) that the car would travel in N hours. Set N to 10.


    Answer:


    1.  N = 10


    2.  distance_in_kilometers = 100 * N


    3.  distance_in_meters = distance_in_kilometers * 1000


    Exercises


    Problem: Rewrite the code using short notations


    1.  N = N * J 


    2.  i = i + j * 18


    3.  f = f - k / 2


    Answer:


    1.  N *= J


    2.  i += j * 18


    3.  f -= k / 2


    Exercises


    Problem: Given that f(x) = |x^3 - 20|, find f(-3). Your answer should consist
    of two lines of code: one which initialises x to -3, and one that calculates the
    result.


    Answer: The following Python code shall do the job:


    >>> x = -3


    >>> abs(x ** 3 - 20)


    47


    Exercises


    Problem: Try to solve the previous problem using -3 inline, rather than using
    the x variable.


    Answer:


    Your solution should look like this:


    >>> abs((-3) ** 3 - 20)


    47


    If it looks like this:


    >>> abs(-3 ** 3 - 20)


    47


    it is wrong because negation (i.e. subtraction from zero) has lower precedence
    than the exponent and thus has to be enclosed in parentheses. Even though your
    solution gives the same result as the correct one, it is a pure coincidence. Try
    to find value of x for f(x) = |x^2 - 20| with and without parentheses around the
    negation to see the difference.


    Exercises


    Problem: How can you check if an integer is odd using Python?


    Answer: Use the modulo operator to find the remainder when you divide by 2.


    If the remainder is 1, the digit is odd.


    >>> 3 % 2


    1


    >>> 4 % 2


    0


    String operations


    Words and sentences are collections of characters, and so are Python strings.


    You can access any character in a Python string using its index, either counting
    from the beginning or the end of the string. When you start from the beginning,
    you count from 0.


    ![](images/00012.jpeg)


    In Python integer indices are zero based.


    >>> name = “My Name is Mike” 


    >>> name[0]


    ‘M’


    >>> name[1]


    ‘y’


    >>> name[9]


    ‘s’


    >>> name[-1]


    ‘e’


    >>> name[-15]


    ‘M’


    >>> name[7]


    ‘ ‘s


    Slicing


    You can take shorter substrings from inside a longer string.


    This operation is called ‘slicing’.


    >>> name[11:14]  # from 11th to 14th, 14th one is excluded


    ‘Mik’


    >>> name[11:15]  # from 11th to 15th, 15th one is excluded


    ‘Mike’


    If you want to check if a string contains a particular substring, you can use
    the ‘in’ operator.


    >>> “B” in “Foo”


    False


    >>> “B” not in “Foo”


    True


    >>> “G” in “Gohl”


    True


    >>> “James” in “James is tall”


    True


    The len function calculates the length of a string.


    >>> len(name)


    15


    Concatenation


    In Python it’s possible to combine two strings into one:


    The operation is called concatenation.


    ![](images/00013.jpeg)


    >>> boo = “cone” + “cat” + “ten” + “ate”


    >>> print(boo)


    conecattenate'
