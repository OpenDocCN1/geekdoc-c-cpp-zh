  trans: "\n在这里，我们用 Python 实现了一辆汽车：\n\n```python\nclass Car:\n    def turn_left(self):\n\
    \        pass\n    def turn_right(self):\n        pass\n    def accelerate(self):\n\
    \        pass\n    def slow_down(self):\n        pass\n    def open_a_window(self):\n\
    \        pass\n```\n\n在上面的代码中，我们创建了一个类。类是一个具有特定行为的实体。这些行为以方法的形式存在，它们与我们之前使用的函数相同，并且缩进方式相同。类的方法将类（`self`）作为它们的第一个参数。`pass`\
    \ 关键字告诉 Python 这段代码块什么都不操作。\n\n这个类可以代表各种不同的汽车 - 宝马、奔驰、奥迪、菲亚特、特斯拉等。让我们创建一个带有某些参数的汽车吧。\n\
    \n```python\nbmw_x6 = Car(model=\"BMW X6\", max_speed=230)\n```\n\n在上面的代码中，你可以看到汽车对象是用两个参数创建的：`model`\
    \ 和 `max_speed`。原始的汽车代码没有任何支持这些参数的内容。为了实现这种支持，你必须引入一个 `__init__` 方法：\n\n```python\n\
    class Car:\n    def __init__(self, model, max_speed):\n        self.model = model\n\
    \        self.max_speed = max_speed\n        self.speed = 0\n        ...\n```\n\
    \n上面的代码获取了你的新汽车对象（`self`），并使用点符号法为汽车的 `model` 和 `max_speed` 赋值。汽车的初始速度为零。\n\n\
    `__init__` 方法不应该包含返回语句 - 它仅用于构建你的对象。这个方法被称为“类构造函数”。\n\n加速和减速应该相应地减少和增加汽车的速度：\n\
    \n```python\nclass Car:\n    ...\n    def accelerate(self, speed_difference):\n\
    \        self.speed += abs(speed_difference)\n        self.speed = min(self.speed,\
    \ self.max_speed)\n    def slow_down(self, speed_difference):\n        self.speed\
    \ -= abs(speed_difference)\n        self.speed = max(self.speed, -5)\n       \
    \ ....\n```\n\n使用点符号法改变对象的内部状态。使用 `min` 和 `max` 函数是为了保证汽车永远不会超过最高速度，也不会低于低于 -5\
    \ km/h（倒车档）。\n\n以下代码将汽车加速 30 km/h。\n\n```python\nbmw_x6.accelerate(30)\n```\n\n\
    当你创建多个类时，你可能希望其中一些类之间存在关系。例如，汽车是一辆 `Vehicle`（交通工具），而公交车也是一种 `Vehicle`。尽管它们有许多相似之处，但它们的内部结构非常不同。\n\
    \n为了反映对象之间的相似性和差异，Python 有一个名为“继承”的特性。\n\n在这个例子中，我们实现了一个 `Vehicle` 类，它像 `Car`\
    \ 类一样拥有 `model` 和 `max_speed` 参数。\n\n```python\nclass Vehicle:\n    def __init__(self,\
    \ model, max_speed):\n        self.model = model\n        self.max_speed = max_speed\n\
    \        self.speed = 0\n    def accelerate(self, speed_difference):\n       \
    \ self.speed += abs(speed_difference)\n        self.speed = min(self.speed, self.max_speed)\n\
    \    def slow_down(self, speed_difference):\n        self.speed -= abs(speed_difference)\n\
    \        self.speed = max(self.speed, -5)\n        ...\n```\n\n现在我们想要创建 `Car`\
    \ 和 `Bus` 类；`Car` 类是完全相同的，但 `Bus` 类没有倒车档。\n\n```python\nclass Car(Vehicle):\n\
    \    pass\nclass Bus(Vehicle):\n    def slow_down(self, speed_difference):\n \
    \       super().slow_down(speed_difference)\n        self.speed = max(self.speed,\
    \ 0)\n```\n\n类名后括号之间的单词 `Vehicle` 使得 `Car` 和 `Bus` 类继承自 `Vehicle`。在 `Bus` 类中，`slow_down`\
    \ 方法覆盖了父类的行为。`super()`语句调用父类来查找新速度，然后确保该速度低于 0 km/h。\n\n### 测验\n\n**问题：**\n1.\
    \ 软件工程师如何称呼用户可以使用的行为集合？\n2. 类与类之间关系的名称是什么？\n3. Python 中用于创建对象的方法的通用术语是什么？例如：`__init__(name,\
    \ max_speed)`。\n4. 方法中缺少了什么？\n\n**答案：**\n1. 接口 (Interface)\n2. 继承 (Inheritance)\n\
    3. 类构造函数 (class constructor)\n4. 缺少 `self` 参数\n\n**问题：** 编写 Python 代码让 X6 加速 100\
    \ km/h\n**答案：**\n`bmw_x6.accelerate(100)`\n\n**问题：** 引入一个也是 `Vehicle` 的 `Bike`\
    \ 类。自行车的主要特点是它的速度永远不会超过 30 km/h。\n**答案：** 你需要确保在 `Bike` 的构造函数并将最大速度限制在 30 km/h。\n\
    ```python\nclass Bike(Vehicle):\n    def __init__(self, name, max_speed):\n  \
    \      max_speed = min(max_speed, 30)\n```\n\n**问题：** 添加一个名为 `show_status` 的方法，它可以打印出“速度是...”。\n\
    **答案：**\n```python\ndef show_status(self):\n    print(\"The speed is \" + str(self.speed)\
    \ + \" km/h\")\n```\n\n### 集合 (Collections)\n\n在许多情况下，你可能需要处理一组相关的数据。Python 提供了多种集合类型：列表（lists）、元组（tuples）、字典（dictionaries）和集合（sets）。本章将重点讨论前三种。\n\
    \n### 列表 (Lists)\n\n列表就像元组，你可以在创建它们后修改它们。让我们定义一个包含三个元素的简单列表：\n\n(images/020.jpeg)\n\
    \n```python\n>>> my_list = [\"apple\", \"pear\", \"banana\"]\n>>> my_list[1:]\
    \ # 从第二个到最后一个\n['pear', 'banana']\n>>> my_list[2][2] # 第 3 个元素的第 3 个字符\n'n'\n\
    ```\n\n(images/021.jpeg)\n\n```python\n>>> my_list[2] = \"mango\" # 将 'banana'\
    \ 修改为 'mango'\n>>> my_list\n['apple', 'pear', 'mango']\n```\n\n### 元组 (Tuples)\n\
    \n元组是不可变的数组。\n\n(images/018.jpeg)\n\n你可以通过以下方式访问元组元素：\n\n```python\n>>> my_tuple\
    \ = (\"apple\", \"pear\", \"banana\")\n>>> my_tuple[1:] # 从第二个到最后一个\n('pear',\
    \ 'banana')\n>>> my_tuple[2][2] # 第 3 个元素的第 3 个字符\n'n'\n```\n\n“不可变”意味着一旦定义了元组，你就无法更改它。\n\
    \n```python\n>>> my_tuple[2] = \"mango\" # 尝试将 'banana' 修改为 'mango'\nTypeError:\
    \ 'tuple' object does not support item assignment\n>>> my_tuple[2][0] = \"B\"\
    \ # 尝试将字符串中的 'b' 修改为 \"B\"（字符串也是不可变的）\n```\n\n```python\n>>> new_tuple = ('foo',\
    \ 'bar', 'zoo', 'loo')\n>>> type(new_tuple)\n<class 'tuple'>\n>>> new_tuple[0]\n\
    'foo'\n>>> new_tuple[3]\n'loo'\n>>> new_tuple[1:3]\n('bar', 'zoo')\n>>> len(new_tuple)\n\
    4\n>>> new_tuple * 2\n('foo', 'bar', 'zoo', 'loo', 'foo', 'bar', 'zoo', 'loo')\n\
    >>> new_tuple + ('blah', 'blah')\n('foo', 'bar', 'zoo', 'loo', 'blah', 'blah')\n\
    ```\n\n从上面的代码可以看出，元组的行为与字符串相似——然而，字符串只是字符的数组，而元组可以包含任何类型的变量。你可以像处理字符串一样对元组进行切片、索引、拼接和乘法。在语法上，元组项必须由括号括起来并用逗号隔开。即使包含单个元素的元组也必须有一个逗号：`(1,)`\
    \ 是元组，而 `(1)` 不是。\n"
