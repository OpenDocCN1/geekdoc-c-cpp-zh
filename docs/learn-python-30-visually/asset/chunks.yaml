    \ |\n\n| Not equal | \"foo\" != \"bar\" 11 != (10 + 1) | True False |\n\n| And\
    \ (both parts must be True) | 3 and \"foo\" None and True | True False |\n\n|\
    \ Or (one of parts must be True) | 1 or None None or False | True False |\n\n\
    | Not (opposite to the target expression) | not None not True | True False |\n\
    \nNote, comparison operators have higher precedence than the logical operators\
    \ “and”, “or” and “not”. All maths operators have higher precedence than comparison\
    \ operators. Here are several compound examples to illustrate how to use boolean\
    \ operators:\n\n>>> 2 * 6 + 1 < 2 * (6 + 1)\n\nTrue\n\n>>> 2 * 6 + 1 == 2 * (6 + 1) - 1\n\
    \nTrue\n\n>>> 2 ** 3 == 8 and 2 ** 2 == 16\n\nFalse\n\n>>> (2 ** 2 == 4 and False) or (not (16 < 15 or 1 == 3))\n\
    \nTrue\n\nAlternative branches\n\nIn many cases the logic can be more sophisticated\
    \ than just two conditions.\n\nLet’s modify the speed function we created before\
    \ to respond to speeds over 200 km/h by printing “You are insane, man!!!” and\
    \ printing “The optimal speed for your car.” when the speed is between 70 and\
    \ 80 km/h.\n\n1.  def drive(car_speed):\n\n2.  if car_speed > 200:\n\n3.  print(“You are insane, man!!!”)\n\
    \n4.  elif car_speed > 100:\n\n5.  print(“Too fast!”)\n\n6.  elif car_speed > 70 and car_speed < 80:\n\
    \n7.  print(“The optimal speed for your car.“)\n\n8.  else:\n\n9.  print(“You are driving below the speed limit. Well done”)\n\
    \nYou might notice that in the code above we don’t use a separate Boolean variable.\
    \ Instead, we place the comparison operator inline with the if statement. The\
    \ “and” statement links two comparison operators together.\n\nWe also use the\
    \ keyword “elif”. This defines an alternate branch. Be careful with the order\
    \ of branches! If more than one branch is True, only the first one will be used.\
    \ For example:\n\n1.  a = 10\n\n2.  if a > 1:\n\n3.  print(“Big”)\n\n4.  elif a > 5:\n\
    \n5.  print(“Really big”)\n\n6.  elif a == 10:\n\n7.  print(“Approaching enormity“)\n\
    \n8.  elif a > 10:\n\n9.  print(“Enormous!”)\n\nThis code will only ever print\
    \ “Big”, and the other statements will be ignored.\n\nQuiz\n\nTry to answer these\
    \ questions without using the interpreter.\n\n1.  What are the boolean values\
    \ - bool(a) - for the following variables:\n\n1.  a = False\n\n2.  a = “0”\n\n\
    3.  a = 0 * 18\n\n4.  a = “None”\n\n1.  What is the output of the following statement:\n\
    \n    (2 ** 2 == 4 and False) or (not (16 > 15 or 1 == 3))\n\n2.  Name Python’s\
    \ logical operators\n\n3.  What will be printed as a result of the following code?\n\
    \n1.  x = 5\n\n2.  if x == 25:\n\n3.  print (“Quarter”)\n\n4.  elif x == 10:\n\
    \n5.  print (“Dime”)\n\n6.  elif x == 5\n\n7.  print (“Nickel”)\n\n8.  elif x == 1:\n\
    \n9.  print (“Penny”)\n\n10.  else:\n\n11.  print (“Not a coin”)\n\n1.  Suppose\
    \ x=5, y=0, and z=1\\. Are the following expressions True or False?\n\n1.  x == 0\n\
    \n2.  x >= y\n\n3.  2 + 3 == x and y < 1\n\n4.  not (z == 0 or y == 0)\n\n5. \
    \ x = 3\n\n1.  What does the following code print?\n\n1.  x = 0\n\n2.  if x != 0:\n\
    \n3.  print(“x is nonzero”)\n\nAnswer:\n\n1.  a) False\n\n    b) True - this is\
    \ a string with a character 0 not an integer\n\n    c) False - 0 * 18 is 0\n\n\
    \    d) True - again “None” is a string not the actual None\n\n2.  False - the\
    \ expression inside the “not” statement is True, making that statement False,\
    \ and the first statement is also False.\n\n3.  and, or, not\n\n4.  Nickel. x\
    \ == 25 and x == 10 are False, so the first True statement is\n\n    x == 5.\n\
    \n5.  a) False. The operator == tests for equality, and 5 does not equal 0.\n\n\
    \    b) True. 5 is greater than or equal to 0.\n\n    c) True. Both 2 + 3 == x\
    \ and y < 1 are True.\n\n    d) False. y == 0 is True, so z == 0 or y == 0 is\
    \ True, and its negation is False.\n\n    c) True. The = operator assigns the\
    \ value 3 to x, and the value 3 evaluates to True.\n\n6.  Nothing. The expression\
    \ is False, so the code is not executed.\n\nExercises\n\nProblem: Write an expression\
    \ that tests if a variable x is less than or equal to 100.\n\nAnswer:\n\n1.  x <= 100\n\
    \nExercises\n\nProblem: Write an expression that tests if a variable x is between\
    \ 3 and 10, inclusive.\n\nAnswer:\n\nx >=  3  and x <=  10\n\nExercises\n\nProblem:\
    \ Write an expression that tests if a variable ![](images/00017.jpeg) is even\
    \ or a multiple of 5.\n\nAnswer:\n\n1.  (x % 2 == 0) or (x % 5 == 0)\n\nExercises\n\
    \nProblem:\n\nThere is a function with the following declaration: person_is_old(age)\
    \ which returns True or False based on the incoming age as an integer.\n\nWrite\
    \ a function that uses the one mentioned above so that it prints “Go to work!”\
    \ if the person is not old and “You deserved to have a long vacation” otherwise.\
    \ Your function must also accept the age as its argument.\n\nAnswer:\n\n1.  def tell_what_to_do(age):\n\
    \n2.  if person_is_old(age):\n\n3.  print(“You deserved to have a long vacation”)\n\
    \n4.  else:\n\n5.  print(“Go to work!”)\n\nClasses and objects\n\nOne of the key\
    \ principles of object-oriented programming is encapsulation - hiding the details\
    \ of the inner workings of the system, so that the user doesn’t need to know how\
    \ it works in order to use it. The part of the program that the user interacts\
    \ with is called the “interface”.\n\nJust as the driver of a car needs tools like\
    \ a steering wheel and a gas pedal to use the car’s capabilities, users of your\
    \ code need to use syntax constructs called methods."
