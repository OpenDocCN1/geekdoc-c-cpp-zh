    Answer:


    1.  \n


    2.  Close it


    3.  write


    4.  readlines


    Exceptions


    Sometimes something unexpected happens that stops a program from executing as
    it should. These events are called “exceptions”.


    >>> 1 / 0


    After you hit enter, you’ll see the following output:


    Traceback (most recent call last):


        File “<stdin>”, line 1, in <module>


    ZeroDivisionError: division by zero


    This is called an exception traceback. It shows you which functions or methods
    were called before the exception happened. The last line tells you which exception
    was raised and gives you some additional, human-readable information.


    In Python you can achieve this via a try/except block.


    What if an exception happens in the middle of something important?


    Lets print “division by zero. But it is totally fine.” instead of throwing a traceback.


    1.  try:


    2.  1 / 0


    3.  except ZeroDivisionError as e:


    4.  print(str(e) + “. But it is totally fine.”)


    In the code above you can see that the statements you want to make an attempt
    to execute go into the try block. And all the error handling code goes under except.


    except keyword must be accompanied with a class of the exception. It also can
    be followed by an as keyword and a variable which is supposed to store a human
    readable description of the error.


    Custom exceptions


    You can define your own exception classes to further on notify that something
    extraordinary happend inside your code:


    1.  class YourException(Exception):


    2.  pass


    All custom exceptions must have a built-in Python exception as a superclass. The
    exceptions do not have to implement any other logic.


    In order to throw an exception you should use the raise keyword:


    1.  raise YourException(“Human-readable message”)


    Once you execute the code above, you shall see a traceback with “Human-readable
    message” string as an extra detail.


    Handling custom exceptions is not different from handling the built-in ones:


    1.  try:


    2.  raise YourException(“Human-readable message”)


    3.  except YourException as e:


    4.  print(“Your exception just occured with a message: “ + str(e))


    Quiz


    Problem:


    1.  Which block is supposed to be used to handle exceptions?


    2.  What is the name of the long text blob that is printed once an exception takes
    place?


    Answer:


    1.  try/except block


    2.  traceback


    ![](images/00026.jpeg)


    Import statement and Python modules and packages


    All source code in Python, as you may have noticed, is stored in various files
    called modules. Each module has a .py extension. Different modules are logically
    combined together into collections called packages. A package is a plain folder
    with __init__.py file.


    E.g. the following is a package:


    1.  foobar/


    2.  __init__.py


    3.  one.py


    4.  two.py


    5.  three.py


    And this one is not:


    1.  foobar/


    2.  one.py


    3.  two.py


    4.  three.py


    Default Python installation comes with a significant amount of packages.


    This set of packages is called a standard library.


    Import statement


    If you want to use functionality stored in another package you must use an import
    statement.


    Lets print your user name on the screen using Python interpreter:


    >>> import getpass


    >>> getpass.getuser()


    ‘gunther’


    The snippet above shows how to import the most top level package. As you can see
    members of the package are supposed to be accessed via the dot operator.


    You may avoid using the dot operator by importing the thing you need directly:


    >>> from getpass import getuser


    >>> getuser()


    ‘gunther’


    To indicate the source of the import you must use from keyword.


    Sometimes you may want to use multiple entities from the same package. In this
    case it is simpler to import all the entities straight away:


    >>> from sys import pydebug, flags


    Note, the entities kept inside Python packages can be virtually any Python constructs.
    A class, a function, a variable, a module or even a package (nested packages are
    possible).


    Quiz


    Problem:


    1.  What is the synonym of Python source file?


    2.  What is the term for folders with Python modules?


    3.  What is the name of a collection of Packages that comes together with default
    Python installation?


    4.  How to import module path from os package?


    Answer:


    1.  module


    2.  package


    3.  standard library


    4.  from os import path


    File operations using os module


    Even though it is possible to work with files using builtin Python functions and
    methods they do not cover all the scenarios that you may face when manipulating
    computer file system.


    This chapter provides an overview of all the common tasks you may face on the
    lower level when processing the data and Python means of managing with these tasks.


    A quick note: some of the examples below use Linux’s path structure. To play with
    them on Windows replace a slash (/) with a backslash (\).


    To begin with lets say you have got the following folder structure (e.g. created
    using a plain file manager):


    /parent/


        foo/


           one.txt


           two.txt


           three.txt


    First navigate to the parent directory of foo using a plain terminal command:


    cd /parent


    Lets verify that directory’s path is what we expect it to be.


    To get the absolute path of the current directory you ought to employ abspath
    function and curdir property of os.path module:


    >>> from os.path import abspath, curdir


    >>> curdir


    ‘.’


    >>> abspath(curdir)


    ‘/parent’


    curdir variable holds a string pointing to the current directory - .. abspath
    expects any path as its argument and returns the absolute path.


    Now remove one.txt and rename two.txt into bar.txt. To do this you will need two
    functions from the standard library’s os module: remove and rename respectively.


    File operations using os module


    >>> from os import remove, rename


    >>> remove(“foo/one.txt”)


    >>> rename(“foo/two.txt”, “foo/bar.txt”)


    As you may have noticed, in order to get rid of the file you must pass its name
    to the function and in order to rename the file apart from supplying the original
    name you are also supposed to pass the string that will be assigned as the file’s
    new name.


    Note, when supplying the name of the file you must give either a relative or an
    absolute path to the file. In case of the absolute path everything is plain and
    simple - it should start with the root of your file system.


    The absolute path could look the following way on UNIX and Windows respectively:


    /Blah/Blah/foo/one.txt


    C:\Blah\Blah\foo\one.txt


    Relative paths are calculated with your current directory.


    Lets say you are in a directory /foo/bar/one and you want to move to /foo/blah/two.


    In this case the relative path shall be: ../../two. Two dots represent a parent
    directory.


    And since you need two navigate two levels above - a sequence of ../../ is required.


    Due to the fact that different delimiters are used on *nix and Windows the remove/rename
    code snippet above has a serious flaw. It is not multi-platform.


    In order to transform it into one you should use join function from os.path module:


    >>> from os import remove, rename


    >>> from os.path import join


    >>> remove(join(“foo”, “one.txt”))


    >>> rename(join(“foo”, “two.txt”), join(“foo”, “bar.txt”))


    You pass all the parts of the path to the join function as strings, and then the
    operating system-specific path delimiter is used to produce a string.


    You can list all the files and folders in a particular directory:


    >>> from os import listdir


    >>> listdir(“foo”)


    [“bar.txt”, “three.txt”]


    Now let’s try to remove the foo directory.


    >>> from os import rmdir


    >>> rmdir(“foo”)


    Traceback (most recent call last):


      File “<stdin>”, line 1, in <module>


    OSError: [Errno 39] Directory not empty: ‘foo’


    Oops! We’ve cause an exception. The directory can’t be deleted as long as it contains
    anything inside.


    Quiz


