    ### Serialize an integer\n```python\nprint(json.dumps(1))\n1\nprint(type(json.dumps(1)))\n\
    <class 'str'>\n```\n\n### Serialize a string\n```python\nprint(json.dumps(\"FOO\"\
    ))\n\"FOO\"\nprint(len(json.dumps(\"FOO\")))\n5\n```\n\n### Try to deserialize\
    \ something. is not JSON - ValueError is raised when the input’t be processed\n\
    ```python\njson.loads(\"FOO\")\nTraceback\n...\nValueError: JSON object could\
    \ be decoded\n```\n\n### Try to serialize something. does not have a representation\
    \ in JSON - only a limited set of built-in types is supported by default\n```python\n\
    class Teacher(object):\n    pass\n\nt = Teacher()\njson.dumps(t)\nTraceback\n\
    ...\nTypeError: <Teacher...> is not serializable\n```\n\n## Quiz Problem:\n\n\
    1. Which function is responsible for JSON serialization in Python?\n2. What is\
    \ the antonym of \"serialization\"? Which function is responsible for it?\n3.\
    \ What is the output of this command: `print(json.dumps(\"FOO\"))`?\n4. What is\
