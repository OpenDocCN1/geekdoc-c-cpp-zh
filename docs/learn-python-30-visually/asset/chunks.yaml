  trans: "\n在关系型数据库上下文中每当学生转学时从相应的课程中删除他们的过程被称为引用完整性管理。`Foreign key`（外键）约束告诉你哪些列包含了对数据库其他地方的引用。\n\
    \n还有几十种其他约束。尽管本章不会涵盖它们，但已经简要介绍的那些足以让你对关系型数据库的行为有一个合理的理解。\n\n在我们继续之前，你需要了解的最后件事是结构化查询语言（`SQL`）。`SQL`\
    \ 是一种专门用于声明数据库约束和操作数据（即列出、查看、创建、更新或删除数据）的编程语言。\n\n# Python sqlite3\n\nPython 有一个名为\
    \ `sqlite3` 的内置数据库模块。\n\n它是关系型数据库和 `SQL` 的全栈 Python 实现。\n\n在这里我们将简要介绍主要的 SQL 语句和数据库结构。\n\
    \n首先，打开你的 Python 解释器并导入 `sqlite3`：\n\n1. `import sqlite3`\n\n初始化数据库连接：\n\n2. `conn\
    \ = sqlite3.connect('example.db')`\n\n获取游标：\n\n3. `cursor = conn.cursor()`\n\n\
    4. `cursor.execute(\"PRAGMA foreign_keys = ON\")`\n\n`Cursor` 只是用于执行 SQL 语句的 Python\
    \ 对象。在 `sqlite3` 中，出于性能考虑，外键约束默认是禁用的。`PRAGMA` 语句启用它们。\n\n现在让我们创建一个简单的 `users`\
    \ 表。\n\n1. `cursor.execute(\"\"\"\nCREATE TABLE users(\n  id INTEGER NOT NULL\
    \ PRIMARY KEY AUTOINCREMENT,\n  email TEXT NOT NULL,\n  name TEXT NOT NULL\n)\"\
    \"\")`\n\n在上面的代码中，你可能会看到以下内容：\n\n* 每个用户必须有一个电子邮件和文本值的名称\n* 每个用户都有一个整数标识符作为 `primary\
    \ key`（主键）。`AUTOINCREMENT` 意味着每当创建新用户时，`id` 将根据之前存储的用户的标识符自动生成\n\n此外，让我们创建一个名为\
    \ `cars` 的表，使得表中提到的每辆车都必须是 `users` 表人类列表中某一个所有者。\n\n1. `cursor.execute(\"\"\"\n\
    CREATE TABLE cars(\n  id INTEGER NOT NULL PRIMARY KEY AUTOINCREMENT,\n  brand\
    \ TEXT NOT NULL,\n  model TEXT NOT NULL,\n  owner INTEGER NOT NULL,\n  FOREIGN\
    \ KEY(owner) REFERENCES users(id) ON DELETE CASCADE\n)\"\"\")`\n\n在上面的代码中，有一个外键定义，表示了\
    \ `cars` 和 `users` 之间的所有权关系。`ON DELETE CASCADE` 语句告诉数据库，每当删除用户时，属于该用户的所有汽车也必须被删除。\n\
    \n让我们创建一个用户和两辆属于该用户的汽车：\n\n1. `cursor.execute('INSERT INTO users VALUES(NULL,\
    \ '`\n2. '\"john.smith@pythonvisually.com\", \"John Smith\")')`\n3. `cursor.execute('INSERT\
    \ INTO cars VALUES(NULL, \"Fiat\", \"Polo\", 1)')`\n4. `cursor.execute('INSERT\
    \ INTO cars VALUES(NULL, \"BMW\", \"X6\", 1)')`\n\nsqlite3\n\n注意，在创建 `cars` 时我们为\
    \ `owner` 传递了值 `1`。我们知道用户 `John Smith` 是数据库中创建的第一个。因此，他的 `ID` 逻辑上应该是 `1`。\n\n\
    让我们尝试创建一个引用并不存在的用户的用户，例如用户 `#2`。\n\n`cursor.execute('INSERT INTO cars VALUES(NULL,\
    \ \"Mazda\", \"6\", 2)')`\n\n你应该看到一个带有以下错误信息的回溯追踪：\n\n`sqlite3.IntegrityError:\
    \ FOREIGN KEY constraint failed`\n\n通过这种方式，数据库引擎通知你尝试存储的外键有问题。\n\n现在，让我们操作我们创建的测试数据。\n\
    \n首先，让我们更改 John 的电子邮件：\n\n上面的代码使用了 `UPDATE` 命令和 `WHERE` 语句。结合使用，它们允许你更新所有符合搜索标准的值。\n\
    \n现在，让我们检查电子邮件是否真的更新了：\n\n`rows = list(cursor.execute('SELECT email FROM users\
    \ WHERE name=\"John Smith'))`\n`[(\"john.smith@pythonvisually.com\",)]`\n\n在选择检查哪个用户时，我们使用了\
    \ `SELECT` 命令。在选择过程中，我们声明只对用户的电子邮件感兴趣。在行选择的情况下，`cursor` 的 `execute` 方法返回了一个关于数据库行的迭代器，我们将其转换为列表并打印出来。\n\
    \n让我们删掉其中一种汽车，例如 BMW：\n\n1. `cursor.execute('DELETE FROM cars WHERE brand=\"BMW\"\
    ')`\n2. `rows = list(cursor.execute('SELECT * FROM cars'))`\n3. `len(rows) ==\
    \ 1`\n\n之后我们使用了 `DELETE` 命令。最后，也是最重要的一点，检查 `ON DELETE CASCADE` 如何工作。`cursor.execute('DELETE\
    \ FROM users WHERE name=\"John Smith\"')`\n\n现在检查我们还有哪些汽车：\n\n`rows = list(cursor.execute('SELECT\
    \ * FROM cars'))`\n"
- fmt: "\n```bash\npip install flask\n```\n\n# Hello World\n\nCreate a file name `hello.py`\
    \ with the following code:\n\n```python\npip install flask\n\nfrom flask import\
    \ Flask\n\napp = Flask(__name__)\n\n@app.route(\"/\")\ndef hello():\n    return\
    \ \"Hello World!\"\n\nif __name__ == \"__main__\":\n    app.run(debug = True)\n\
    ```\n\nand run it:\n\n```bash\npython hello.py\n```\n\nIf you open your web browser\
    \ and type:\n\n`http://localhost:5000`\n\nyou should be greeted with the warming\
    \ sight of “Hello World!”\n\nCongratulations, you have just created your first\
    \ website with Flask.\n\nLet’s walk through `hello.py` line by line.\n\n1. First,\
    \ the `Flask` class is imported from the `flask` module.\n2. Then, an instance\
    \ of the `Flask` class called `app` is created.\n3. `@app.route(\"/\")` tells\
    \ `Flask` the URL that will trigger the method below it.\n4. The `hello()` method\
    \ is defined, which returns the string “Hello World!”\n5. `app.run()` starts the\
    \ HTTP server.\n\nCreate a new file called `test.py`:\n\n```python\nfrom flask\
    \ import Flask\n\napp = Flask(__name__)\n\n@app.route(\"/\")\ndef root():\n  \
    \  return \"Request Path is: \" + request.path\n\n@app.route(\"/test/\")\ndef\
    \ test():\n    return \"Request Path is \" + request.path\n\nif __name__ == \"\
    __main__\":\n    app.run(debug = True)\n```\n\nYou can see that a `request` module\
    \ was imported from `flask`. This object represents an HTTP request sent by the\
    \ client and received by the server, which contains the path of the requested\
    \ page, the type of the request, and other information about the client and the\
    \ transmitted data.\n\nIn this case, you have used the `request` object to return\
    \ the path of the page.\n\nFlask offers an easy way to answer to different HTTP\
    \ methods:\n\n```python\n@app.route(\"/data\", methods=['GET'])\ndef show_data():\n\
    \    ....\n\n@app.route(\"/data\", methods=['POST'])\ndef handle_data():\n   \
    \ ....\n\n@app.route(\"/user/<username>\")\ndef greet_user(username):\n    return\
    \ \"Hello \" + username\n```\n\nYou can use sections of the webpage’s URL as a\
    \ variable in your function.\n\n```python\nimport json\nfrom flask import make_response,\
    \ Flask\n\napp = Flask(__name__)\n\n@app.route(\"/json\")\ndef get_image():\n\
    \    # Create response\n    response = make_response(json.dumps({\"foo\": \"bar\"\
    }))\n    # Set correct mimetype\n    response.mimetype = \"application/json\"\n\
    \    return response\n\nif __name__ == \"__main__\":\n    app.run(debug = True)\n\
    ```\n\nUntil now, all of the pages would return simple text.\n\nFlask would automatically\
    \ transform this string into an HTTP response, and would give it the mimetype\
    \ “text/html” along with a status code 200.\n\nNow let’s modify this behavior.\n\
    \nThis code returns a JSON object.\n\nWe can also change the error code:\n\n```python\n\
    ...\n@app.route(\"/error\")\ndef error_page():\n    response = make_response(\"\
    Error Page\")\n    response.status_code = 404\n    return response\n...\n```\n\
    \n## Quiz\n\n### Problem:\n1. What is Flask and what should you use it for?\n\
    2. Why is Flask called a microframework?\n3. What is the default port for the\
    \ Flask integrated HTTP server?\n4. Can you cite most frequently used HTTP methods?\n\
    5. Consider the following code snippet:\n```python\n@app.route(\"/error\")\ndef\
    \ error_page():\n    return \"Error Page\"\n```\n\n### Answer:\n\n1. `Flask` is\
    \ a microframework for Python used to create web applications.\n2. It keeps its\
    \ core simple. New functionality must be added via extensions.\n3. 5000\n4. `GET`,\
    \ `POST`, `HEAD`, `PUT` and `DELETE`\n5. 200. Do not be fooled by the error name.\
    \ You did nothing to change the status code.\n\n## Exercises\n\n### Problem:\n\
    \nImagine you want to create a small discussion page for your website to let your\
    \ users post and read messages. Messages are sorted in descending order, so the\
    \ most recent message is displayed first.\n\nYour website is so popular that soon\
    \ there are too many messages to be displayed! You decide to limit the number\
    \ of messages per page to 50, and add “next” and “previous” buttons to navigate\
    \ between pages. Can you create a script to display the first and last post on\
    \ a given page?\n\n### Sample Answer\n\n```python\n...\n@app.route(\"/posts\"\
    )\n@app.route(\"/posts/<int:page_nb>\")\ndef show_posts(page_nb=1):\n    first_msg\
    \ = 1 + 50 * page_nb\n    last_msg = first_msg + 49\n    return \"Messages {}\
    \ to {}\".format(first_msg, last_msg)\n...\n```\n\n**Notes:**\n* set a default\
    \ value for the variable `page_nb` so that routes `/posts` and `/posts/1` are\
    \ equivalent.\n* force `page_nb` to be of type `int` so that a route `/posts/something`\
    \ would return 404 error.\n\n### Files and Directories\n\nWorking with files and\
    \ directories can rapidly grow into a tedious and consuming task. Python offers\
    \ convenient methods to help you walk directories and perform operations on files.\n\
    \nThe following code will scan all directories and subdirectories in a top-down\
    \ manner:\n\n```python\nimport os\nfor root, dirs, files in os.walk(\".\", top_down=True):\n\
    \    for name in files:\n        print(os.path.join(root, name))\n    for name\
    \ in dirs:\n        print(os.path.join(root, name))\n```\n\n`slate` is a small\
    \ module you can use to easily extract text from PDF files. The following code\
    \ reads a PDF file and extracts all text from the document, presenting each page\
    \ as a string of text:\n\n```python\nimport slate\nf = open(\"doc.pdf\")\ndoc\
    \ = slate.PDF(f)\ndoc[1]\n```\n\nPython makes it easy to access remote resources\
    \ using `urllib`.\n\n```python\nfrom urllib.request import urlopen\nresponse =\
    \ urlopen(\"http://a/b/c\")\ndata = response.read()\n```\nNote that `response`\
    \ is a file-like object, which points at the remote resource.\n\n### Image Processing\n\
    \nThe Python Imaging Library (`PIL`) adds image processing capabilities to Python.\
    \ You can use this library to create thumbnails, convert between file formats,\
    \ print images, etc.\n\nLoad image from a file:\n```python\nimport Image\nim =\
    \ Image.open(\"Python.jpg\")\ndata = list(im.getdata())\n```\n\nGet a list of\
    \ pixels from the image opened above:\n\n```python\nfrom PIL import Image\nfrom\
    \ urllib.request import urlopen\nimport io\nresponse = urlopen(\"http://a/b/c.jpg\"\
    )\nim_file = io.BytesIO(response.read())\nim = Image.open(im_file)\nim = im.rotate(90)\n\
    im = im.resize((800, 600))\nim.save(\"downloaded_image.jpg\", \"JPEG\")\n```\n\
    The script below downloads a picture from a given url, rotates it, resizes it,\
    \ and saves it locally. Note, `io.BytesIO` is used to wrap the buffer into a proper\
    \ file-like object.\n\nThe following code creates a 128x128 thumbnail from a JPEG\
    \ image:\n\n```python\nfrom PIL import Image\nsize = (128, 128)\nfilename = \"\
    image.jpg\"\nim = Image.open(filename)\nim.thumbnail(size, Image.ANTIALIAS)\n\
    im.save(filename + \".thumbnail\", \"JPEG\")\n```\n\n### Directory cleanup\n\n\
    Let’s imagine that you need to clean up a directory and remove all files from\
    \ before 2002. Each file within this directory is a text document (.txt) whose\
    \ first line is a date (yyyy-mm-dd).\n\n```python\nimport os\nimport time\ncount\
    \ = 0\nkept = 0\ndeleted = 0\nfor (root, dirs, files) in os.walk('.'):\n    for\
    \ filename in files:\n        if filename.endswith('.txt'):\n            f = open(filename,\
    \ 'r')\n            sdate = f.readline()\n            f.close()\n            pdate\
    \ = time.strptime(sdate, '%Y-%m-%d\\n')\n            if pdate.tm_year > 2002:\n\
    \                kept += 1\n            else:\n                os.remove(filename)\n\
    \                deleted += 1\n            count += 1\nprint('Total files: ' +\
    \ str(count))\nprint('Kept: ' + str(kept))\nprint('Deleted: ' + str(deleted))\n\
    ```\n\nThe code above does the following 4 things:\n\n1. Imports the necessary\
    \ modules.\n2. Uses the “walk” method to navigate the current directory. For each\
    \ text file in our directory a. Open file b. Read date using `f.readline()` c.\
    \ Convert string date into Python object d. If date is before 2002 the file is\
    \ deleted\n"
