  \n## 寻找多个解决方案\n\n有时，找到同一个问题的多个解决方案是有价值的。然而，这不等同于找到所有解决方案（穷举搜索）。例如，考虑设计你的梦想豪园。你想绘制几个不同的平面图来帮助你决定最佳设计，但你不需要所有可能的房屋的草图。本质上，多个解决方案可以帮助你在实施某一个方案之前看到解决问题的多种方式。\n\
  \n生成多个解决方案有几种方法，但这里只检查了两种。第一是路径移除（path removal），第二是节点移除（node removal）。正如名称所示，生成不冗余的多个解决方案需要将已找到的解决方案从系统中移除。记住，这两种方法都没有尝试（也无法使用）找到所有解决方案。找到所有解决方案是一个不同的问题，通常不会尝试尝试，因为它意味着穷举搜索。\n\
  \n### 路径移除\n\n生成多个解决方案的`path-removal`方法会从数据库中移除形成当前解决方案的所有节点，然后尝试寻找另一个解决方案。本质上，路径移除是从树上剪掉分枝。\n\
