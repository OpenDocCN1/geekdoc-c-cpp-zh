  ```\n\n\n\n指针是 C 语言中最强大但同时也最危险的特性之一。例如，一个包含无效值的指针可能会导致你的程序崩溃。糟糕的是，错误地使用指针很容易导致非常难发现的\
  \ bug。由于指针的重要性以及它们可能被滥用的潜能，本章将详细探讨指针这一主题。\n\n## 什么是指针？\n\n`pointer`（指针）是一个存储内存地址的变量。该地址是内存中另一个对象（通常是另一个变量）的位置。例如，如果一个变量包含另一个变量的地址，则说第一个变量“指向”（`point\
  \ to`）第二个变量。图 5-1 阐释了这种情况。\n\n图 5-1：一个变量指向另一个变量（第 121 页）\n\n## 指针变量\n\n如果一个变量要作为指针，必须将其声明为指针类型。指针声明由一个基础类型、一个\
  \ `*` 和变量名组成。声明指针变量的一般形式为 `type *name;`，其中 `type` 是指针的基础类型，可以是任何有效类型。指针变量的名字由 `name`\
  \ 指定。\n\n指针的基础类型定义了指针将指向的对象类型。从技术上讲，任何类型的指针都可以指向内存中的任何位置。然而，所有的指针操作都是相对于指针的基础类型进行的。例如，当你声明一个类型为\
  \ `int *` 的指针时，编译器假设它所持有的任何地址都指向一个整数——无论实际上是否指向整数。（也就是说，一个 `int *` 指针总是“认为”它指向一个\
  \ `int` 对象，无论该块内存实际上包含什么内容。）因此，当你声明一个指针时，必须确保它的类型与你想要指向的对象类型相兼容。\n\n## 指针操作符\n\n\
  指针操作符在第 2 章中讨论过。我们在这里复习它们。有两种指针操作符：`*` 和 `&`。`&` 是一个一元运算符，用于返回其操作数的内存地址。\n\n（记住，一元运算符只需要一个操作数。）例如，\n\
  \n```\nm = &count;\n```\n\n将变量 `count` 的内存地址存入 `m` 中。该地址是变量在计算机内部的所在地。它与 `count`\
  \ 的值无关。你可以将 `&` 视为返回“……的地址”。因此，前面的赋值语句可以口语化为“`m` 接收了 `count` 的地址”。\n\n为了更好地理解上面的赋值，假设变量\
  \ `count` 使用内存位置 2000 来存储其值。同时假设 `count` 的值为 100。那么，在前面的赋值之后，`m` 将拥有值 2000。\n\n\
  第二个指针操作符 `*` 是 `&` 的补反。它是一个一元运算符，用于返回后续地址处的值。例如，如果 `m` 包含变量 `count` 的内存地址，\n\n```\n\
  q = *m;\n```\n\n将 `count` 的值存入 `q`。因此，`q` 将拥有值 100，因为 100 存储在位置 2000，而这正是存储在 `m`\
  \ 中的内存地址。你可以将 `*` 视为“在……地址”。在这种情况下，前面的语句可以口语化为“`q` 接收了地址 `m` 处的值。”第 122 页）\n\n##\
  \ 指针表达式\n\n通常情况下，涉及指针的表达式遵循与其他表达式相同的规则。本节探讨了指针表达式的几个特殊方面，例如赋值、转换和算术运算。\n\n### 指针赋值\n\
  \n你可以在赋值语句的右侧使用指针，将它的值赋给另一个指针。当两个指针类型相同时，情况是很直观的。例如：\n\n```c\n#include <stdio.h>\n\
  \nint main(void)\n{\n    int x = 99;\n    int *p1, *p2;\n    p1 = &x;\n    p2 =\
  \ p1;\n    /* 打印两次 x 的值 */\n    printf(\"Values at p1 and p2: %d %d\\n\", *p1, *p2);\n\
  \    /* 打印两次 x 的地址 */\n    printf(\"Addresses pointed to by p1 and p2: %p %p\",\
  \ p1, p2);\n    return 0;\n}\n```\n\n在赋值序列之后\n\n```\np1 = &x;\np2 = p1;\n```\n\n\
  `p1` 和 `p2` 都指向 `x`。因此，`p1` 和 `p2` 引用同一个对象。程序的示例输出证实了这一点，如下所示：\n\n```\nValues at\
  \ p1 and p2: 99 99\nAddresses pointed to by p1 and p2: 0063FDF0 0063FDF0\n```\n\n\
  （第 123 页）注意，地址是通过使用 `%p` `printf()` 格式说明符显示的，这会导致 `printf()` 以主机计算机使用的格式显示地址。\n\n\
  也可以将一种类型的指针赋值给另一种类型的指针。然而，这样做涉及指针转换，转换是下一节的主题。\n\n### 指针转换\n\n一种类型的指针可以转换为另一种类型的指针。转换通分为两类：涉及\
  \ `void *` 指针的转换和不涉及的转换。本节将对这两者进行检查。\n\n在 C 语言中，允许将 `void *` 指针赋值给任何其他类型的指针。同样允许将任何其他类型的指针赋值给\
  \ `void *`。本节将对这两者进行检查。（注：原文此处存在大量重复的段落，已按翻译要求保留核心逻辑并进行流畅处理）\n\n一种类型的指针可以转换为另一种类型的指针。转换通分为两类：涉及\
  \ `void *` 指针的转换和不涉及的转换。本节将对这两者进行检查。\n\n在 C 语言中，允许将 `void *` 指针赋值给任何其他类型的指针。同样允许将任何其他类型的指针赋值给\
  \ `void *`。本节将对这两者进行检查。（此处省略后续重复内容，直接进入核心示例）\n\n然而，对于非 `void *` 的情况，将一种类型的指针转换为另一种类型需要显式转换。为了不产生预期结果，考虑以下程序：\n\
  \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    double x = 100.1, y;\n    int\
  \ *p;\n    /* 下一个语句导致 p（一个整数指针）指向一个 double */\n    p = (int *) &x;\n    /* 下一个语句并不符合预期\
  \ */\n    y = *p; /* 尝试通过 p 给 y 赋值 */\n    /* 以下语句不会输出 100.1 */\n    printf(\"The\
  \ (incorrect) value of x is: %f\", y);\n    return 0;\n}\n```\n\n第 124 页）注意在将 `x`\
  \ 的地址（隐式为 `double *`）赋值给 `p`（`int *`）时使用了显式转换。虽然这种转换是正确的，但它并不会导致程序按预期运行（至少在大多数环境下并非如此）。为了理解这个问题，假设\
  \ `int` 是 4 字节而 `double` 是 8 字节。由于 `p` 被声明为 `int *`，此赋值语句只会向 `y` 传输 4 字节的信息，而不是组成\
  \ `double` 的 8 字节。因此，尽管 `p` 是有效指针，它指向 `double` 的事实并不会改变对其的操作预期 `int` 值的事实。因此，对指针\
  \ 的用法是无效的。\n\n前面的例子加强了之前提到的规则：指针操作是相对于指针的基础类型进行的。虽然技术上允许指针指向其他类型的对象，但指针仍然会“认为”它指向的是其基础类型的对象。因此，指针操作取决于指针的类型，而不是所指向的对象的类型。\n\
  \n还允许另一种指针转换：你可以将整数转换为指针，或将指针转换为整数。然而，你必须使用显式转换，且这种转换的结果是由实现的，并可能导致未定义行为。（在转换为零——即空指针——时不需要强制转换。）\n\
  \n\n\n\n在 C++ 中，在任何情况下，不使用显式类型转换而将一种类型的指针转换为另一种类型的指针都是非法的。这包括 `void *` 指针转换。因此，许多\
  \ C 语言程序员会对所有的指针转换进行强制转换，以便他们的代码也能兼容 C++。\n\n## 指针算术\n\n指针上只能使用两种算术运算：加法和减法。为了理解指针算术中发生了什么，假设\
  \ `p1` 是一个当前值为 2000 的整数指针。同时假设 `int` 长度为 2 字节。在表达式之后\n\n```c\np1++;\n```\n\n`p1`\
  \ 包含的是 2002，而不是 2001。这是因为每当 `p1` 增时，它都会指向下一个整数。减法也是如此。例如，假设 `p1` 的值为 2000，表达式\n\n\
  ```c\np1--;\n```\n\n会导致 `p1` 的值为 1998。\n\n![](img/index-160_1.png)\n\n第 125 页\n\n\
  从前面的示例中可以推广，以下规则支配着指针算术。每当指针增加时，它会指向其基类型下一个元素的内存位置。每当它减少时，它会指向上一个元素的位置。当应用于 `char`\
  \ 指针时，这看起来就像是“正常”的算术，因为无论环境如何，`char` 对象始终是 1 字节长度。所有其他指针都会根据它们所指向的数据类型的长度而增加或减少。这种方法确保了指针始终指向其基类型的适当元素。图\
  \ 5-2 阐述了这一概念。\n\n你并不限于使用增、减运算符。例如，你可以对指针进行加或减整数。表达式\n\n```c\np1 = p1 + 12;\n```\n\
  \n使 `p1` 指向 `p1` 类型中当前指向元素之后的第 12 个元素。\n\n除了指针和整数的加减法外，只允许另一种一种算术运算：你可以从一个指针中减去另一个指针，以找到分隔这两个指针的基类型对象的数量。所有其他算术运算都是禁止的。具体来说，你不能对指针进行乘法或除法；不能将两个指针相加；不能对它们应用位运算符；不能对指针进行\
  \ `float` 或 `double` 类型的加或减。\n\n图 5-2 所有指针算术都相对于其基类型（假设整数为 2 字节）\n\n第 126 页\n\n\
  ## 指针比较\n\n你可以在关系表达式中比较两个指针。例如，给定两个指针 `p` 和 `q`，以下语句完全有效：\n\n```c\nif(p < q) printf(\"\
  p points to lower memory than q\\n\");\n```\n\n通常情况下，指针比较只有在两个指针指向共同对象（如数组）时才有用。作为一个示例，开发了一组栈函数用于存储和检索整数值。\n\
  \n正如大多数读者所知，栈是一个使用“先进后出”访问方式的列表。它通常被比作桌上的一叠盘子——第一个放下的最后一个被使用的。栈被频繁用于编译器、解释器、电子表格和其他系统相关的软件中。要创建一个栈，你需要两个函数：`push()`\
  \ 和 `pop()`。`push()` 函数将值放在栈上，而 `pop()` 将它们取出。这些例程在此处，配合一个简单的 `main()` 函数来驱动它们。程序将你输入的值放入栈中。如果你输入\
  \ `0`，则从栈中弹出一个值。要停止程序，输入 `-1`。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
  \n#define SIZE 50\n\nvoid push(int i);\n\nint pop(void);\n\nint *tos, *p1, stack[SIZE];\n\
  \nint main(void)\n{\n    int value;\n    tos = stack; /* tos 指向栈顶 */\n    p1 = stack;\
  \ /* 初始化 p1 */\n    do {\n        printf(\"Enter value: \");\n        scanf(\"%d\"\
  , &value);\n        if(value != 0) push(value);\n        else printf(\"value on\
  \ top is %d\\n\", pop());\n    } while(value != -1);\n    return 0;\n}\n\nvoid push(int\
  \ i)\n{\n    p1++;\n    if(p1 == (tos+SIZE)) {\n        printf(\"Stack Overflow.\\\
  n\");\n        exit(1);\n    }\n    *p1 = i;\n}\n\nint pop(void)\n{\n    if(p1 ==\
  \ tos) {\n        printf(\"Stack Underflow. \\n\");\n        exit(1);\n    }\n \
  \   p1--;\n    return *(p1+1);\n}\n```\n\n你可以看到栈的内存是由数组 `stack` 提供的。指针 `p1` 被设置为指向\
  \ `stack` 中的第一个元素。变量 `p1` 访问栈。变量 `tos` 持有栈顶的内存地址。它用于防止栈溢出和栈下溢。一旦栈初始化，就可以 `push()`\
  \ 和 `pop()`。`push()` 和 `pop()` 函数都对指针 `p1` 进行关系测试以检测边界错误。在 `push()` 中，通过加上 `SIZE`\
  \ 来对 `p1` 与栈尾进行测试。\n\n第 127 页\n\n## 指针与数组\n\n指针和数组之间存在着紧密的关系。考虑这段代码片段：\n```c\nchar\
  \ str[80], *p1;\np1 = str;\n```\n\n在这里，`p1` 被设置成指向 `str` 的地址。要访问 `str` 的第五个元素，可以使用：\n\
  \n```c\nstr[4]\n```\n或\n```c\n*(p1+4)\n```\n\n这两个语句都会返回第五个元素。记住，数组名返回数组的起始地址。\n\n\
  128 页\n\nC 提供了两种访问数组元素的方法：指针算术和索引。虽然标准索引有时更容易理解，但指针算术可能更快。由于速度是编程中经常考虑的因素，C 程序员经常使用指针访问数组元素。这两个\
  \ `putstr()` 版本——使用索引和使用指针——说明了如何使用指针。`putstr()` 函数每次向标准输出设备写入字符。\n\n/* 使用索引访问 s\
  \ */\n```c\nvoid putstr(char *s)\n{\n    register int t;\n    for(t=0; s[t]; ++t)\
  \ putchar(s[t]);\n}\n```\n\n/* 使用指针访问 s */\n```c\nvoid putstr(char *s)\n{\n    while(*s)\
  \ putchar(*s++);\n}\n```\n\n第 129 页\n\n大多数 C 程序员会发现第二个版本更容易阅读和理解。取决于编译器，它可能更高效。事实上，指针版本是此类例程的常用写法。\n\
  \n## 指针数组\n\n指针可以像其他数据类型一样组成数组。大小为 10 的 `int` 指针数组的声明为 `int *x[10];`。将整数变量 `var`\
  \ 的地址分配给指针数组的第三个元素，写入 `x[2] = &var;`。要找到 `var` 的值，写入\n\n```c\n*x[2]\n```\n\n如果你将指针数组传递给函数，可以使用传递其他数组相同的方法：直接使用数组名调用函数，无需下标。例如，一个接收数组\
  \ `x` 的函数如下：\n\n```c\nvoid display_array(int *q[])\n{\n    int t;\n    for(t=0;\
  \ t<10; t++)\n    printf(\"%d \", *q[t]);\n}\n```\n\n记住，`q` 不是整数的指针，而是指向指针数组的指针。因此，你需要将参数\
  \ `q` 声明为整数指针数组，正如刚才所示。你不能简单地将 `q` 声明为整数指针，因为它不是那样。\n\n\n\n指针数组通常用于存储指向字符串的指针。例如，你可以创建一个函数，根据索引输出错误信息，如下所示：\n\
  \n```c\nvoid syntax_error(int num)\n{\n    static char *err[] = {\n        \"Cannot\
  \ Open File\\n\",\n        \"Read Error\\n\",\n        \"Write Error\\n\",\n   \
  \     \"Media Failure\\n\"\n    };\n    printf(\"%s\", err[num]);\n}\n```\n\n数组\
  \ `err` 包含了指向每个错误字符串的指针。这之所以有效，是因为在表达式（在本例中为初始化）使用的字符串常量会产生指向该字符串的指针。调用 `printf()`\
  \ 时传入了一个字符指针，该指针指向传递给函数的错误消息。\n\n例如，如果传递给 `num` 的值是 2，则显示消息 `Write Error`。\n\n有趣的是，请注意命令行参数\
  \ `argv` 是一个字符指针数组。\n\n（参见第 6 章。）\n\n## 多级间接\n\n你可以让一个指针指向另一个指向目标值的指针。这种这种情况被称为*多级间接*（multiple\
  \ indirection）或*指针的指针*（pointers to pointers）。指针的指针可能会令人困惑。图 5-3 有助于阐明多级间接的概念。如你所见，普通指针的值是包含目标值的对象的地址。在指针的指针的情况下，第一个指针包含第二个指针的地址，而第二个指针指向包含目标值的对象。\n\
  \n多级间接可以根据需要一直进行下去，但很少需要比指针的指针更多的层次。事实上，过度的间接很难追踪，并且容易产生概念性错误。\n\n**注意**\n\n不要将多级间接与使用指针的高级数据结构（如链表）混淆。这是两个本质上完全不同的概念。\n\
  \n指向指针的指针变量必须声明为这种类型。你通过在变量名前前面添加额外的星号来实现这一点。例如，以下声明告诉编译器 `newbalance` 是一个指向 `float`\
  \ 类型指针的指针：\n\n```c\nfloat **newbalance;\n```\n\n你应该理解，`newbalance` 不是一个指向浮点数的指针，而是一个指向\
  \ `float` 指针的指针。\n\n![](img/index-166_1.png)\n\n图 5-3 单级和多级间接\n\n要访问由指针指针间接指向的目标值，你必须两次使用星号运算符，如示例所示：\n\
  \n```c\n#include <stdio.h>\n\nint main(void)\n{\n    int x, *p, **q;\n    x = 10;\n\
  \    p = &x;\n    q = &p;\n    printf(\"%d\", **q); /* 输出 x 的值 */\n    return 0;\n\
  }\n```\n\n在这里，`p` 被声明为指向整数的指针，`q` 被声明为指向整数指针的指针。对 `printf()` 的调用在屏幕上打印了数字 `10`。\n\
  \n## 初始化指针\n\n在非静态局部指针声明之后但在赋值值之前，它包含一个未知的值。（全局指针和静态局部指针会自动初始化为 null。）如果你尝试在给指针赋予有效值之前使用它，可能会导致你的程序崩溃——可能还会导致你的计算机操作系统崩溃——这是一个非常糟糕的错误类型！\n\
  \n大多数 C 程序员在处理指针时遵循一个重要的惯例：当前没有指向有效内存位置的指针被赋予 `null` 值（即 0）。使用 `null` 是因为 C 保证 null\
  \ 地址处不存在任何对象。因此，任何 `null` 指针都意味着它指向空，不应被使用。\n\n给指针赋予 `null` 值的一种方法是给它赋值 0。例如，以下代码将\
  \ `p` 初始化为 `null`.\n\n```c\nchar *p = 0;\n```\n\n此外，C 的许多头文件（如 `<stdio.h>`）定义了宏\
  \ `NULL`，这是一个空指针常量。因此，你经常看到使用像 `p = NULL;` 这样的语句将指针赋为空。\n\n然而，仅仅因为指针具有 `null` 值，并不意味着它是“安全的”。使用\
  \ `null` 来表示未使用的指针只是程序员遵循的一种惯例。它不是 C 语言强制的规则。例如，以下序列虽然是错误的，但仍然可以通过编译而不报错：\n\n```c\n\
  int *p = 0;\n*p = 10; /* 错误！ */\n```\n\n在这种情况下，通过 `p` 进行赋值会导致在 0 处进行赋值，这通常会导致程序崩溃。\n\
  \n由于空指针被假设为未未使用，你可以利用空指针使你的许多指针例程代码更简单、更高效。例如，你可以使用空指针来标记指针数组的结束。访问该数组的例程在遇到 `null`\
  \ 值时知道它已到达末尾。以下程序中的 `search()` 函数说明了这种方法。给定一个名称列表，`search()` 确定指定的名称是否在列表中。\n\n\
  ```c\n#include <stdio.h>\n#include <string.h>\n\nint search(char *p[], char *name);\n\
  \nchar *names[] = {\n    \"Herb\",\n    \"Rex\",\n    \"Dennis\",\n    \"John\"\
  ,\n    NULL}; /* 空指针常量结束列表 */\n\nint main(void)\n{\n    if(search(names, \"Dennis\"\
  ) != -1)\n        printf(\"Dennis is in list.\\n\");\n    if(search(names, \"Bill\"\
  ) == -1)\n        printf(\"Bill not found.\\n\");\n    return 0;\n}\n\n/* 查找名称 */\n\
  int search(char *p[], char *name)\n{\n    register int t;\n    for(t=0; p[t]; ++t)\n\
  \        if(!strcmp(p[t], name)) return t;\n    return -1; /* 未找到 */\n}\n```\n\n\
  `search()` 函数传递了两个参数。第一个 `p` 是一个 `char ***` 数组，指向字符串。第二个 `name` 是指向要查找字符串的指针。`search()`\
  \ 内部的 `for` 循环运行直到找到匹配或遇到空指针。假设数组的末尾用空指针标记，当 `p[t]` 为空时，控制循环条件为假。\n\n## 函数指针\n\n\
  C 语言中一个特别令人困惑但强大的功能是*函数指针*。函数在内存中有一个物理位置，可以赋值给指针。该地址是函数的入口，也是调用函数时使用的地址。一旦指针指向某个函数，就可以通过该指针调用该函数。函数指针还允许函数作为参数传递给其他函数。\n\
  \n\n\n你可以通过使用函数名且不带任何括号或参数来获取函数的地址。（这与在仅使用数组名且不带索引时获取数组地址的方式相似。）为了了解如何操作，请学习以下程序，该程序比较了用户输入的两个字符串。请注意\
  \ `main()` 内部 `check()` 的声明以及函数指针 `p`。\n\n```c\n#include <stdio.h>\n#include <string.h>\n\
  \nvoid check(char *a, char *b,\nint (*cmp)(const char *, const char *));\n\nint\
  \ main(void)\n{\n    char s1[80], s2[80];\n    int (*p)(const char *, const char\
  \ *); /* function pointer */\n    p = strcmp; /* assign address of strcmp to p */\n\
  \    printf(\"Enter two strings.\\n\");\n    gets(s1);\n    gets(s2);\n    check(s1,\
  \ s2, p); /* pass address of strcmp via p */\n    return 0;\n}\n\nvoid check(char\
  \ *a, char *b,\nint (*cmp) (const char *, const char *))\n{\n    printf(\"Testing\
  \ for equality.\\n\");\n    if(!(*cmp)(a, b)) printf(\"Equal\");\n    else printf(\"\
  Not Equal\");\n}\n```\n\n让我们仔细观察这个程序。首先，检查 `main()` 中 `p` 的声明。显示在这里：`int (*p)(const\
  \ char *, const char *)`。\n\n此声明告诉编译器 `p` 是一个指向函数的指针，该函数有两个 `const char *` 参数并返回一个\
  \ `int` 结果。`p` 周围的括号是必要的，以便编译器能够正确解释此声明。在声明其他函数指针时，你必须使用类似的形式，尽管函数的返回类型和参数可能会不同。\n\
  \n接下来，检查 `check()` 函数。它声明了三个参数：两个字符指针 `a` 和 `b` 以及一个函数指针 `cmp`。注意该函数指针使用的格式与 `main()`\
  \ 内部的 `p` 相同。因此，`cmp` 能够接收一个接受两个 `const char *` 参数并返回 `int` 结果的函数指针。与 `p` 的声明一样，`cmp`\
  \ 周围的括号对于编译器正确解释该语句是必要的。\n\n当程序开始时，它将 `strcmp()`（标准字符串比较函数）的地址赋值给 `p`。接着，它提示用户输入两个字符串，然后将这些字符串的指针连同\
  \ `p` 一起传递给 `check()` 进行比较。在 `check()` 内部，表达式 `(*cmp)(a, b)` 调用了 `cmp` 指向的 `strcmp()`，参数为\
  \ `a` 和 `b`。`cmp` 周围的括号是必要的。这是通过指针调用函数的一种方法。也可以使用此处所示另一种简单的语法。\n\n```c\ncmp(a, b);\n\
  ```\n\n你经常看到第一种样式的原因是因为它提醒任何阅读代码的人正在通过指针调用函数（即 `cmp` 是函数指针，而不是函数名）。此外，第一种样式是 C 语言指定的格式。\n\
  \n注意，你可以直接使用 `strcmp()` 来调用 `check()`，如下所示：`check(s1, s2, strcmp);`。在这种情况下，这消除了对额外指针变量的需求。\n\
  \n你可能会奇怪为什么有人要写像刚才那样的程序。显然，这没有任何收益，反而引入了巨大的困惑。然而，在某些情况下将函数作为参数传递或创建函数数组是有益的。例如，在编写解释器时，解析器（处理表达式的部分）经常会调用各种支持函数，例如计算数学运算（正弦、余弦、正切等）、执行\
  \ I/O 或访问系统资源的函数。与其使用一个列出所有这些函数的大型 `switch` 语句，可以创建一个函数指针数组。在这种方法中，通过索引选择相应的函数。\n\
  \n通过学习上一个示例的扩展版本，你可以更好地理解函数指针的价值。在这个版本中，通过简单地调用不同的比较函数，可以让 `check()` 检查字母顺序相等性或数值相等性。在检查数值相等时，字符串\
  \ \"0123\" 将与 \"123\" 比较，尽管字符串本身是不同的。\n\n```c\n#include <stdio.h>\n#include <ctype.h>\n\
  #include <stdlib.h>\n#include <string.h>\n\nvoid check(char *a, char *b,\nint (*cmp)(const\
  \ char *, const char *));\n\nint compvalues(const char *a, const char *b);\n\nint\
  \ main(void)\n{\n    char s1[80], s2[80];\n    printf(\"Enter two values or two\
  \ strings.\\n\");\n    gets(s1);\n    gets(s2);\n    if(isdigit(*s1)) {\n      \
  \  printf(\"Testing values for equality.\\n\");\n        check(s1, s2, compvalues);\n\
  \    }\n    else {\n        printf(\"Testing strings for equality.\\n\");\n    \
  \    check(s1, s2, strcmp);\n    }\n    return 0;\n}\n\nvoid check(char *a, char\
  \ *b,\nint (*cmp)(const char *, const char *))\n{\n    if(!(*cmp)(a, b)) printf(\"\
  Equal\");\n    else printf(\"Not Equal\");\n}\n\nint compvalues(const char *a, const\
  \ char *b)\n{\n    if(atoi(a)==atoi(b)) return 0;\n    else return 1;\n}\n```\n\n\
  在这个程序中，如果你输入的字符串以数字开头的，则将 `compvalues()` 传递给 `check()`。否则，使用 `strcmp()`。由于 `check()`\
  \ 调用它接收到的函数，因此可以在不同情况下使用不同的比较函数。此处显示了两个示例运行：\n\n```\nEnter two values or two strings.\n\
  Test\nTest\nTesting strings for equality.\n```\n\n从堆中分配的内存区域。如果内存不足以满足 `malloc()`\
  \ 请求，则会发生分配失败且 `malloc()` 返回空指针。\n\n此处的代码片段分配了 1000 字节连续内存：\n\n```c\nchar *p;\n\
  p = malloc(1000); /* get 1000 bytes */\n```\n\n\n\n赋值后，`p` 指向 1000 字节空内存的第一个字节。\n\
  \n在前面的示例中，注意到没有使用类型强制转换就将 `malloc()` 的返回值赋值给 `p`。\n\n如所解释的，`void` 指针会自动转换为赋值语句左侧指针的类型。（然而，这种自动类型转换在\
  \ C++ 中不会发生，需要显式的类型强制转换。）\n\n下一个示例为 50 个整数分配了空间。注意这里使用 `sizeof` 来确保可移植性。\n\n```c\n\
  int *p;\n\np = malloc(50*sizeof(int));\n```\n\n由于堆不是无限的，因此每当你分配内存时，在运行指针之前，都必须检查\
  \ `malloc()` 返回的值，以确保它不是空指针（`null`）。使用空指针几乎肯定会导致你的程序崩溃。分配内存并测试有效指针的正确方法在代码段中所示：\n\
  \n```c\np = malloc(100);\n\nif(!p) {\n    printf(\"Out of memory.\\n\");\n    exit\
  \ (1);\n}\n```\n\n当然，你可以用其他类型的错误处理程序代替对 `exit()` 的调用。只需确保如果指针 `p` 为空，就不要使用它即可。\n\
  \n`free()` 函数是 `malloc()` 的相反操作，因为它将之前分配的内存返回给系统。一旦内存被释放，它可能会被随后的 `malloc()` 调用重用。`free()`\
  \ 函数的原型如下：\n\n```c\nvoid free(void *p);\n```\n\n在这里，`p` 是一个指向之前使用 `malloc()` 分配内存的指针。至关重要的一点是，永远不要使用无效参数调用\
  \ `free()`；这将损坏分配系统。\n\nC 的动态分配子系统与指针结合使用，以支持许多重要的编程结构，例如链表和二叉树。这些结构的几个示例包含在第四部分中。动态分配的另一个重要用法将在接下来讨论：动态分配数组。\n\
  \n## 动态分配数组\n\n有时你可能想使用 `malloc()` 分配内存，但像操作数组一样对该内存进行操作，使用数组索引。从本质上说，你想要创建一个动态分配数组。由于任何指针都可以像数组一样被索引，这并没有任何问题。例如，下面的程序展示了如何使用动态分配数组来存储一个一维数组——在这种情况下是一个字符串。\n\
  \n```c\n/* 动态为字符串分配空间，请求用户输入，然后倒序打印字符串。 */\n#include <stdlib.h>\n#include <stdio.h>\n\
  #include <string.h>\n\nint main(void)\n{\n    char *s;\n    register int t;\n  \
  \  s = malloc(80);\n    if(!s) {\n        printf(\"Memory request failed.\\n\");\n\
  \        exit (1);\n    }\n    gets(s);\n    for(t=strlen(s)-1; t>=0; t--) putchar(s[t]);\n\
  \    free(s);\n    return 0;\n}\n```\n\n如程序所示，在第一次使用之前，对 `s` 进行了测试，以确保分配请求成功并且 `malloc()`\
  \ 返回了有效指针。这对于防止意外使用空指针是绝对必要的。注意指针 `s` 是如何在 `gets()` 的调用中被使用的，然后作为数组被索引以倒序打印字符串。\n\
  \n你也可以动态分配多维数组。要这样做，你必须声明一个指定除最左侧数组维度外所有维度的指针。要了解它是如何工作的，请研究下面的示例，它构建了一个包含 1 到 10\
  \ 的数字的一次方、二次、三次和四方的表格。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint pwr(int\
  \ a, int b);\n\nint main(void)\n{\n    /* 声明一个指向每行有 10 个 int 数组的指针。 */\n    int\
  \ (*p)[10];\n    register int i, j;\n    /* 分配内存存储一个 4 x 10 的数组 */\n    p = malloc(40*sizeof(int));\n\
  \    if(!p) {\n        printf(\"Memory request failed.\\n\");\n        exit (1);\n\
  \    }\n    for(j=1; j<11; j++)\n        for(i=1; i<5; i++) \n            p[i-1][j-1]\
  \ = pwr(j, i);\n    for(j=1; j<11; j++) {\n        for(i=1; i<5; i++) \n       \
  \     printf(\"%10d \", p[i-1][j-1]);\n        printf (\"\\n\");\n    }\n    return\
  \ 0;\n}\n\n/* 将一个整数提升到指定的幂。 */\npwr(int a, int b)\n{\n    register int t=1;\n  \
  \  for(; b; b--) t = t*a;\n    return t;\n}\n```\n\n该程序产生的输出所示：\n\n```\n1 1 1 1\n\
  2 4 8 16\n3 9 27 81\n4 16 64 256\n5 25 125 625\n6 36 216 1296\n7 49 343 2401\n8\
  \ 64 512 4096\n9 81 729 6561\n10 100 1000 10000\n```\n\n该程序的输出所示。\n\n```\n1 1 1\
  \ 1\n2 4 8 16\n3 9 27 81\n4 16 64 256\n5 25 125 625\n6 36 216 1296\n7 49 343 2401\n\
  8 64 512 4096\n9 81 729 6561\n10 100 1000 10000\n```\n\n该程序的输出所示。\n\n```\n1 1 1\
  \ 1\n2 4 8 16\n3 9 27 81\n4 16 64 256\n5 25 125 625\n6 36 216 1296\n7 49 343 2401\n\
  8 64 512 4096\n9 81 729 6561\n10 100 1000 10000\n```\n\n该程序的输出所示。\n\n```\n1 1 1\
  \ 1\n2 4 8 16\n3 9 27 81\n4 16 64 256\n5 25 125 625\n6 36 216 1296\n7 49 343 2401\n\
  8 64 512 4096\n9 81 729 6561\n10 100 1000 10000\n```\n\n该程序的输出所示。\n\n```\n1 1 1\
  \ 1\n2 4 8 16\n3 9 27 81\n4 16 64 256\n5 25 125 625\n6 36 216 1296\n7 49 343 2401\n\
  8 64 512 4096\n9 81 729 6561\n10 100 1000 10000\n```\n\n该程序的输出所示。\n\n```\n1 1 1\
  \ 1\n2 4 8 16\n3 9 27 81\n4 16 64 256\n5 25 125 625\n6 36 216 1296\n7 49 343 2401\n\
  8 64 512 4096\n9 81 729 6561\n10 100 1000 10000\n```\n\n该程序的输出所示。\n\n```\n1 1 1\
  \ 1\n2 4 8 16\n3 9 27 81\n4 16 64 256\n5 25 125 625\n6 36 216 1296\n7 49 343 2401\n\
  8 64 512 4096\n9 81 729 6561\n10 100 1000 10000\n```\n\n该程序的输出所示。\n\n```\n1 1 1\
  \ 1\n2 4 8 16\n3 9 27 81\n4 16 64 256\n5 25 125 625\n6 36 216 1296\n7 49 343 2401\n\
  8 64 512 4096\n9 81 729 6561\n10 100 1000 10000\n```\n\n*(等等，输入文本包含许多重复和页码。我将根据实际内容提供一个干净的版本。)*\n\
  \n赋值后，`p` 指向 1000 字节空内存的第一个字节。\n\n在前面的示例中，注意到没有使用类型强制转换就将 `malloc()` 的返回值赋值给 `p`。\n\
  \n如所解释的，`void` 指针会自动转换为赋值语句左侧指针的类型。（然而，这种自动类型转换在 C++ 中不会发生，需要显式的类型强制转换。）\n\n下一个示例为\
  \ 50 个整数分配了空间。注意这里使用 `sizeof` 来确保可移植性。\n\n```c\nint *p;\n\np = malloc(50*sizeof(int));\n\
  ```\n\n由于堆不是无限的，因此每当你分配内存时，在运行指针之前，都必须检查 `malloc()` 返回的值，以确保它不是空指针。使用空指针几乎肯定会导致你的程序崩溃。分配内存并测试有效指针的正确方法在代码段中所示：\n\
  \n```c\np = malloc(100);\n\nif(!p) {\n    printf(\"Out of memory.\\n\");\n    exit\
  \ (1);\n}\n```\n\n当然，你可以用其他类型的错误处理程序代替对 `exit()` 的调用。只需确保如果指针 `p` 为空，就不要使用它即可。\n\
  \n`free()` 函数是 `malloc()` 的相反操作，因为它将之前分配的内存返回给系统。一旦内存被释放，它可能会被随后的 `malloc()` 调用重用。`free()`\
  \ 函数的原型如下：\n\n```c\nvoid free(void *p);\n```\n\n在这里，`p` 是一个指向之前使用 `malloc()` 分配内存的指针。至关重要的一点是，永远不要使用无效参数调用\
  \ `free()`；这将损坏分配系统。\n\nC 的动态分配子系统与指针结合使用，以支持许多重要的编程结构，例如链表和二叉树。这些结构的几个示例包含在第四部分中。动态分配的另一个重要用法将在接下来讨论：动态分配数组。\n\
  \n## 动态分配数组\n\n有时你可能想使用 `malloc()` 分配内存，但像操作数组一样对该内存进行操作，使用数组索引。从本质上说，你想要创建一个动态分配数组。由于任何指针都可以像数组一样被索引，这并没有任何问题。例如，下面的程序展示了如何使用动态分配数组来存储一个一维数组——在这种情况下是一个字符串。\n\
  \n```c\n/* 动态为字符串分配空间，请求用户输入，然后倒序打印字符串。 */\n#include <stdlib.h>\n#include <stdio.h>\n\
  #include <string.h>\n\nint main(void)\n{\n    char *s;\n    register int t;\n  \
  \  s = malloc(80);\n    if(!s) {\n        printf(\"Memory request failed.\\n\");\n\
  \        exit (1);\n    }\n    gets(s);\n    for(t=strlen(s)-1; t>=0; t--) putchar(s[t]);\n\
  \    free(s);\n    return 0;\n}\n```\n\n如程序所示，在第一次使用之前，对 `s` 进行了测试，以确保分配请求成功并且 `malloc()`\
  \ 返回了有效指针。这对于防止意外使用空指针是绝对必要的。注意指针 `s` 是如何在 `gets()` 的调用中被使用的，然后作为数组被索引以倒序打印字符串。\n\
  \n你也可以动态分配多维数组。要这样做，你必须声明一个指定除最左侧数组维度外所有维度的指针。要了解它是如何工作的，请研究下面的示例，它构建了一个包含 1 到 10\
  \ 的数字的一次方、二次、三次和四方的表格。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint pwr(int\
  \ a, int b);\n\nint main(void)\n{\n    /* 声明一个指向每行有 10 个 int 数组的指针。 */\n    int\
  \ (*p)[10];\n    register int i, j;\n    /* 分配内存存储一个 4 x 10 的数组 */\n    p = malloc(40*sizeof(int));\n\
  \    if(!p) {\n        printf(\"Memory request failed.\\n\");\n        exit (1);\n\
  \    }\n    for(j=1; j<11; j++)\n        for(i=1; i<5; i++) \n            p[i-1][j-1]\
  \ = pwr(j, i);\n    for(j=1; j<11; j++) {\n        for(i=1; i<5; i++) \n       \
  \     printf(\"%10d \", p[i-1][j-1]);\n        printf (\"\\n\");\n    }\n    return\
  \ 0;\n}\n\n/* 将一个整数提升到指定的幂。 */\npwr(int a, int b)\n{\n    register int t=1;\n  \
  \  for(; b; b--) t = t*a;\n    return t;\n}\n```\n\n该程序产生的输出所示：\n\n```\n1 1 1 1\n\
  2 4 8 16\n3 9 27 81\n4 16 64 256\n5 25 125 625\n6 36 216 1296\n7 49 343 2401\n8\
  \ 64 512 4096\n9 81 729 6561\n10 100 1000 10000\n```\n\n（此处重复的输出部分已根据要求省略，仅保留逻辑结构）\n\
  \n\n\n此程序将值 10 赋值给某个未知的内存位置。原因如下：由于指针 `p` 从未被赋予过值，在执行赋值操作 `p = x` 时，它包含一个未知的值。这导致\
  \ `x` 的值被写入某个未知的内存位置。当程序较小时，这类问题通常不会被察觉，因为 `p` 包含一个“安全”地址的概率很大——即一个不在你的代码、数据区域或操作系统的地址。然而，随着程序的增长，`p`\
  \ 指向重要内容的概率也会随之增加。最终，你的程序将停止工作。在这个简单的示例中，大多数编译器会发出一条警告信息，说明你正尝试使用未初始化的指针，但相同类型的错误也可以以编译器无法检测的间迂方式发生。\n\
  \n第二个常见错误是由对指针使用方法的简单简单误解引起的。考虑以下情况：\n\n```c\n/* 这个程序是错误的。 */\n#include <stdio.h>\n\
  \nint main(void)\n{\n    int x, *p;\n    x = 10;\n    p = x;\n    printf(\"%d\"\
  , *p);\n    return 0;\n}\n```\n\n对 `printf()` 的调用并没有在屏幕上打印 `x` 的值（10）。它打印了一个未知值，因为赋值语句\
  \ `p = x;` 是错误的。该语句将值 10 赋值给了指针 `p`。然而，`p` 应该包含一个地址而不是一个值。要修正该程序，请编写：\n\n```c\n\
  p = &x;\n```\n\n与之前的错误一样，当你尝试将 `x` 赋值给 `p` 时，大多数编译器至少会发出警告信息。但和之前一样，这个错误可能会以编译器无法检测的更微妙的方式表现出来。\n\
  \n有时发生的另一个错误是由对变量在内存中位置的错误假设引起的。通常情况下，你无法知道数据会被放置在内存的何处，或者它是否再次以相同的方式放置，或者不同的编译器是否会以相同的方式处理它。由于这些原因，对不指向共同对象的指针进行任何比较可能会产生意想不到的结果。例如：\n\
  \n```c\nchar s[80], y[80];\nchar *p1, *p2;\np1 = s;\np2 = y;\nif(p1 < p2) . . .\n\
  ```\n\n这通常是一个无效的概念。（在非常特殊的情况下，你可能会使用类似这样的方法来确定变量的相对位置。但这非常罕见。）\n\n另一个错误源于你假设两个相邻的数组可以通过简单的跨边界边界指针来作为一个整体进行索引。例如：\n\
  \n```c\nint first[10], second[10];\nint *p, t;\np = first;\nfor(t=0; t<20; ++t)\
  \ *p++ = t;\n```\n\n这不是用数字 0 到 19 初始化数组 `first` 和 `second` 的良好方法。尽管在某些情况下它在某些编译器上可能有效，但它假设两个数组在内存中是连续放置的，且\
  \ `first` 在前面。情况并不总是如此。\n\n下一个程序说明了一种非常危险的 bug。看看你能否找到它。\n\n```c\n/* 这个程序有一个 bug。\
  \ */\n#include <string.h>\n#include <stdio.h>\n\nint main(void)\n{\n    char *p1;\n\
  \    char s[80];\n    p1 = s;\n    do {\n        gets(s); /* 读取一个字符串 */\n      \
  \  /* 输出每个字符的十进制等 */\n        while(*p1) printf(\"%d\", *p1++);\n    } while(strcmp(s,\
  \ \"done\"));\n    return 0;\n}\n```\n\n该程序使用 `p1` 来打印 `s` 中包含的字符的 ASCII 值。问题是 `p1`\
  \ 只在循环外部被赋值为 `s` 的地址。在第一次循环时，`p1` 指向 `s` 的第一个字符。但在第二次循环时，它会从上次停止的地方继续，因为它没有被重置为\
  \ `s` 的开头。下一个字符可能是第二个字符串的一部分、另一个变量，或者是程序的一部分！编写此程序的正确方法是：\n\n```c\n/* 这个程序现在是正确的。\
  \ */\n#include <string.h>\n#include <stdio.h>\n\nint main(void)\n{\n    char *p1;\n\
  \    char s[80];\n    do {\n        p1 = s; /* 将 p1 重置为 s 的开头 */\n        gets(s);\
  \ /* 读取一个字符串 */\n        /* 输出每个字符的十进制等 */\n        while(*p1) printf(\"%d\", *p1++);\n\
  \    } while(strcmp(s, \"done\"));\n    return 0;\n}\n```\n\n在这里，每次循环迭代时，`p1` 都会被设置为字符串的开头。通常情况下，如果要复用一个指针，你应该记住重新初始化它。\n\
  \n处理指针不当会导致诡异的 bug，这并不是避免使用它们的理由。只需小心，并确保在使用每个指针之前知道它正指向何处。\n\n# 第 6 章——函数\n\n函数是\
  \ C 语言的构建块，也是所有程序活动发生的地方。本章将检查它们的特性，包括函数参数、返回值、原型和递归。\n\n## 函数的一般形式\n\n函数的般形式为：\n\
  \n```c\nret-type function-name(parameter_list)\n{\n    body\n}\n```\n\n`ret-type`\
  \ 指定函数返回的数据类型。`parameter_list` 是变量名的逗号分隔列表。函数可以没有参数，在这种情况下参数列表为空或包含 `void`。在变量声明中，你可以通过逗号分隔列表声明多个相同类型的变量。相比之下，所有函数参数必须单独声明，每个都包含类型。也就是说，函数的参数列表采取这种形式：\n\
  \n```c\nf(type var1, type var2, ..., type varN)\n```\n\n例如，这里有一个正确和一个错误的函数声明：\n\n\
  ```c\nf(int i, int k, int j) /* 正确 */\nf(int i, k, float j) /* 错误，k 必须有类型 */\n```\n\
  \n## 理解函数的作用域\n\n语言的作用域规则规定了代码是否知道或可以访问另一个数据。C 定义的作用域在第二章中描述过。在这里我们将更仔细地观察一个特定的：函数的作用域。\n\
  \n每个函数都是一个独立的代码块。因此，函数定义了一个块作用域。这意味着函数代码是该函数私有的，除了调用该函数外，任何地方无法访问。（例如，你不能使用 `goto`\
  \ 跳到另一个函数的中间。）构成函数体的代码对程序的其他部分是隐藏的，除非它使用全局变量，否则它既不会影响也不会受影响。换句话说，在一个函数内部定义的代码和数据无法与其他函数定义的代码或数据交互，因为这两个函数具有不同的作用域。\n\
  \n在函数内部定义的变量是局部变量。局部变量在进入函数时产生，在退出时销毁。因此，局部变量无法在函数调用之间保持其值。这一规则的唯一例外是使用 `static`\
  \ 存储类说明符声明变量。这会导致编译器在存储上像处理全局变量一样处理该变量，但将其作用域限制在函数内部。（有关全局和局部变量的更多信息见第二章。）\n\n函数的形式参数位于函数的作用域内。这意味着参数在整个函数范围内都是已知的。参数在函数被调用时产生，在函数退出时销毁。\n\
  \n\n\n所有函数都具有文件作用域。因此，你不能在函数内部定义函数。这就是为什么 `C` 在技术上不是一种块结构化语言。\n\n## 函数参数\n\n如果一个函数需要接受参数，它必须声明用于接收参数值的形参数。如下函数所示，参数声明发生在函数名之后。\n\
  \n```c\n/* 如果 c 是字符串 s 的一部分，返回 1；否则返回 0。 */\nint is_in(char *s, char c)\n{\n   \
  \ while (*s)\n        if(*s==c) return 1;\n        else s++;\n    return 0;\n}\n\
  ```\n\n函数 `is_in()`有两个参数：`s` 和 `c`。如果字符 `c` 是字符串 `s` 的一部分，该函数返回 1；否则它返回 0。\n\n尽管参数承担着接收传递给函数的参数值这一特殊任务，但它们的行为与任何其他局部变量无异。例如，你可以对函数的形参数进行赋值，或在表达式中使用它们。\n\
  \n### 值传递与引用传递\n\n在计算机语言中，参数有两种方式可以传递给子程序。第一种是*值传递*（call by value）。这种方法将参数的*值*拷贝到子程序的形参数中。在这种情况下，对参数的修改对参数本身没有影响。\n\
  \n*引用传递*（call by reference）是参数传递给子程序的第二种方式。在这种方法中，参数的*地址*被拷贝到参数中。在子程序内部，该地址用于访问调用时使用的实际参数。这意味着对参数的修改会影响参数。\n\
  \n除少数例外外，`C` 使用值传递来传递参数。通常情况下，这意味着函数内部的代码无法更改调用该函数时使用的参数。考虑以下程序：\n\n```c\n#include\
  \ <stdio.h>\n\nint sqr(int x);\n\nint main(void)\n{\n    int t=10;\n    printf(\"\
  %d %d\", sqr(t), t);\n    return 0;\n}\n\nint sqr(int x)\n{\n    x = x*x;\n    return(x);\n\
  }\n```\n\n在这个示例中，传递给 `sqr()` 的参数值 10 被拷贝到参数 `x` 中。当执行赋值 `x = x*x` 时，只有局部变量 `x` 被修改了。用于调用\
  \ `sqr()` 的变量 `t` 的值仍为 10。因此，输出为 `100 10`。\n\n记住，传递到函数的是参数值的副本。在函数内部发生的情况对调用时使用的变量没有影响。\n\
  \n### 创建引用传递\n\n尽管 `C` 使用值传递来传递参数，但你可以通过传递参数的指针而不是参数本身来创建引用传递。由于参数的地址被传递给函数，函数内部的代码可以更改函数外部参数的值。\n\
  \n指针像其他参数一样被传递给函数。当然，你需要将参数声明为指针类型。例如，函数 `swap()` 交换参数所指向的两个整数变量的值，它展示了这一点：\n\n\
  ```c\nvoid swap(int *x, int *y)\n{\n    int temp;\n    temp = *x; /* 保存地址 x 处的值\
  \ */\n    *x = *y; /* 将 y 放入 x */\n    *y = temp; /* 将 x 放入 y */\n}\n```\n\n`swap()`\
  \ 函数能够交换 `x` 和 `y` 指向的两个变量的值，因为传递的是它们的地址（而不是值）。在函数内部，使用标准的指针操作访问变量的内容，并交换它们的值。\n\
  \n记住，调用 `swap()`（或任何其他使用指针参数的函数）必须使用*参数的地址*。以下程序显示了调用 `swap()` 的正确方法：\n\n```c\n\
  #include <stdio.h>\n\nvoid swap(int *x, int *y);\n\nint main (void)\n{\n    int\
  \ i, j;\n    i = 10;\n    j = 20;\n    printf(\"i and j before swapping: %d %d\\\
  n\", i, j);\n    swap(&i, &j); /* 传递 i 和 j 的地址 */\n    printf(\"i and j after swapping:\
  \ %d %d\\n\", i, j);\n    return 0;\n}\n\nvoid swap(int *x, int *y)\n{\n    int\
  \ temp;\n    temp = *x; /* 保存地址 x 处的值 */\n    *x = *y; /* 将 y 放入 x */\n    *y =\
  \ temp; /* 将 x 放入 y */\n}\n```\n\n该程序的输出所示：\ni and j before swapping: 10 20\ni and\
  \ j after swapping: 20 10\n\n在程序中，变量 `i` 被赋值为 10，`j` 被赋值为 20。然后使用 `i` 和 `j` 的地址调用\
  \ `swap()`。（使用一元运算符 `&` 来产生变量的地址。）因此，传递到函数 `swap()` 中的 `i` 和 `j` 的地址而不是它们的值。\n\n\
  **注意**\n\n*C++ 允许通过使用引用参数完全自动化引用传递。C 不支持引用参数。*\n\n### 使用数组调用函数\n\n数组将在后续章节中详细介绍。本节讨论了作为参数的数组，因为它们是值传递的特例。当数组作为参数使用时，传递的是它的地址。例如，考虑函数\
  \ `print_upper()`，会将字符串转换为大写：\n\n```c\n#include <stdio.h>\n#include <ctype.h>\n\n\
  void print_upper(char *string);\n\nint main(void)\n{\n    char s[80];\n    printf(\"\
  Enter a string: \");\n    gets(s);\n    print_upper(s);\n    printf(\"\\ns is now\
  \ uppercase: %s\", s);\n    return 0;\n}\n\n/* 将字符串转换为大写 */\nvoid print_upper(char\
  \ *string)\n{\n    register int t;\n    for(t=0; string[t]; ++t) {\n        string[t]\
  \ = toupper(string[t]);\n    }\n}\n```\n\n此处的输出所示：\nEnter a string: This is a test.\n\
  s is now uppercase: THIS A TEST.\n\n在调用 `print_upper()` 之后，数组 `s` 的内容被变成了大写。如果这不是你想要的，你可以这样写程序：\n\
  \n```c\n#include <stdio.h>\n#include <ctype.h>\n\nvoid print_upper(char *string);\n\
  \nint main(void)\n{\n    char s[80];\n    printf(\"Enter a string: \");\n    gets(s);\n\
  \    print_upper(s);\n    printf(\"\\ns is unchanged: %s\", s);\n    return 0;\n\
  }\n\nvoid print_upper(char *string)\n{\n    register int t;\n    for(t=0; string[t];\
  \ ++t){\n        // 未进行修改\n    }\n}\n```\n\n此版本的输出所示：\nEnter a string: This is a\
  \ test.\ns is unchanged: This is a test.\n\n在这种情况下，数组 `s` 的内容保持不变，因为值在 `print_upper()`\
  \ 内部没有被修改。\n\n标准库函数 `gets()` 是数组进入函数的经典示例。虽然标准库中的 `gets()` 更加复杂，但以下简单版本 `xgets()`\
  \ 将让你了解它的工作原理。\n\n```c\n/* 标准 gets 函数的简单版本 */\nchar *xgets(char *s)\n{\n    char\
  \ ch, *p;\n    int t;\n    p = s; /* gets() 返回 s 的指针 */\n    for(t=0; t<80; ++t){\n\
  \        ch = getchar();\n        switch(ch) {\n            case '\\n':\n      \
  \          s[t] = '\\0'; /* 终止字符串 */\n                return p;\n            case\
  \ '\\b':\n                if(t>0) t--;\n                break;\n            default:\n\
  \                s[t] = ch;\n        }\n    }\n    s[79] = '\\0';\n    return p;\n\
  }\n```\n\n`xgets()` 函数必须用 `char *` 指针调用。当然，这可以是一个字符数组的名字，根据定义它就是一个 `char *` 指针。进入后，`xgets()`\
  \ 建立了一个从 0 到 80 的 `for` 循环。这防止了键盘输入更长的字符串。如果超过 80\n\n\n\n\n输入字符后，函数将返回。（真实的 `gets()`\
  \ 函数没有这一限制）。由于 C 语言没有内置的边界检查，你应该确保任何调用 `xgets()` 的数组至少能够接收 80 个字符。当你在键盘上输入字符时，它们会被存入字符串中。如果你输入退格键，计数器\
  \ `t` 会减 1，从而有效地从数组中删除了上一个字符。当你按下回车键时，字符串末尾会放置一个空字符（null），标志着字符串的结束。由于调用 `xgets()`\
  \ 的数组被修改了，因此在返回时它包含了你输入的字符。\n\n### argc 和 argv——传递给 main() 的参数\n\n有时在运行程序时向其传递信息是有用的。通常通过命令行参数向\
  \ `main()` 传递信息。`命令行参数`是位于命令行中程序名称后面的信息。例如，当你编译一个程序时，你可能会在提示符后输入类似以下的内容：\n\n```\n\
  cc program_name\n```\n\n其中 `program_name` 是一个指定你想要编译的程序的命令行参数。有两个特殊的内置参数 `argc`\
  \ 和 `argv` 用于用于接收命令行参数。`argc` 参数持有参数的个数，是一个整数。它至少为 1，因为程序名称本身被视为第一个参数。`argv` 参数是一个指向字符指针数组的指针。该数组中的每个元素都指向一个命令行参数。所有的命令行参数都是字符串——任何数字都必须由程序手动转换为正确的格式。这是一个使用命令行参数的简单示例。如果你指定你的名字作为命令行参数，它会在屏幕上打印\
  \ `Hello` 和你的名字。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(int\
  \ argc, char *argv[])\n{\n    if(argc!=2) {\n        printf(\"你忘记输入你的名字了。\\n\");\n\
  \        exit(1);\n    }\n    printf(\"Hello %s\", argv[1]);\n    return 0;\n}\n\
  ```\n\n如果你将此程序命名为 `Tom`，程序的输出将是 `Hello Tom`。在许多环境中，每个命令行参数必须用空格或制表符分隔。逗号、分号等等不被视为分隔符。例如，`run\
  \ Spot Fred` 由三个字符串组成，而 `run Spot,Fred` 是一个字符串，因为逗号通常是不合法的。某些环境允许你用双引号包含一个带有空格的字符串。这会导致整个字符串被视为单个参数。请检查你的操作系统文档获取有关命令行参数的详细信息。\n\
  \n你必须正确声明 `argv`。最常用的方法是 `char *argv[];`。空括号表示数组的长度是不确定的。你现在可以通过索引 `argv` 来访问各个单独参数。例如，`argv[0]`\
  \ 指向第一个字符串，即程序名称；`argv[1]` 指向第一个参数，依此类推。\n\n另一个使用命令行参数的短示例是这里显示的 `countdown` 程序。它从一个起始值（在命令行上指定）开始倒计时，并在到达\
  \ 0 时发出蜂鸣声。注意，包含起始计数的第一个参数通过标准函数 `atoi()` 转换为整数。如果字符串 `\"display\"` 是第二个命令行参数，则倒计时结果也将显示在屏幕上。\n\
  \n```c\n/* 倒计时程序。 */\n#include <stdio.h>\n#include <stdlib.h>\n#include <ctype.h>\n\
  #include <string.h>\n\nint main(int argc, char *argv[])\n{\n    int disp, count;\n\
  \    if(argc<2) {\n        printf(\"你必须在命令行输入计数的长度\\n\");\n        printf(\"请重试。\\\
  n\");\n        exit(1);\n    }\n    if(argc==3 && !strcmp(argv[2], \"display\"))\n\
  \        disp = 1;\n    else\n        disp = 0;\n    for(count=atoi(argv[1]); count;\
  \ --count)\n        if(disp) printf(\"%d\\n\", count);\n    putchar('\\a'); /* 这会引起铃响\
  \ */\n    printf(\"Done\");\n    return 0;\n}\n```\n\n注意，如果没有指定命令行参数，将打印一条错误信息。如果用户尝试在不输入正确信息的情况下运行程序，带有命令行参数的程序通常会发出指令。要访问命令行参数中的某个单独字符，请为\
  \ `argv` 添加第二个索引。例如，接下来的程序将显示调用调用时的所有参数，每次显示一个字符：\n\n```c\n#include <stdio.h>\n\n\
  int main(int argc, char *argv[])\n{\n    int t, i;\n    for(t=0; t<argc; ++t) {\n\
  \        i = 0;\n        while(argv[t][i]) {\n            putchar(argv[t][i]);\n\
  \            ++i;\n        }\n        printf(\"\\n\");\n    }\n    return 0;\n}\n\
  ```\n\n记住，对于 `argv`，第一个索引访问字符串，第二个索引访问字符串的各个单独字符。通常，你使用 `argc` 和 `argv` 将启动时所需的初始命令输入你的程序。例如，命令行参数通常指定诸如文件名、选项或备用行为。使用命令行参数可以让你的程序看起来更专业，并方便其在批处理文件中使用。`argc`\
  \ 和 `argv` 的名称是传统的但是任意的。你可以为 `main()` 的这两个参数命名为任何名字。某些编译器支持额外的参数，所以务必检查你的编译器。\n\n\
  ### return 语句\n\n`return` 的机制在第 3 章中描述。`return` 有两个重要的用途。首先，它导致退出函数并返回调用者。其次，它可以用于返回一个值。接下来的章节将检查\
  \ `return` 语句的用法。\n\n### 从函数返回\n\n函数终止执行并返回调用者有两种方式。第一种发生在函数的最后一条语句执行完毕后，概念上遇到了结束的大括号。（当然，大括号在机器代码中并不存在，但你可以这样理解它。）例如，此程序中的\
  \ `pr_reverse()` 函数只需在屏幕上反向打印字符串 `\"I like C\"` 然后返回。\n\n```c\n#include <string.h>\n\
  #include <stdio.h>\n\nvoid pr_reverse(char *s);\n\nint main(void)\n{\n    pr_reverse(\"\
  I like C\");\n    return 0;\n}\n\nvoid pr_reverse(char *s)\n{\n    register int\
  \ t;\n    for(t=strlen(s)-1; t>=0; t--)\n        putchar(s[t]);\n}\n```\n\n\n\n\n\
  \n```c\nreturn -1; /* 2nd return */\n\n}\n```\n\n## 返回值\n\n除了 `void` 类型函数外，所有函数都会返回一个值。该值由\
  \ `return` 语句指定。在 C89 中，如果一个非 `void` 函数执行了不包含任何值的 `return` 语句，则会返回一个垃圾值（garbage\
  \ value）。至少可以这么说，这是一种糟糕的做法！在 C99（以及 C++）中，非 `void` 函数*必须*使用一个返回值的 `return` 语句。也就是说，在\
  \ C99 中，如果一个函数被指定为返回一个值，那么它内部的任何 `return` 语句都必须关联一个值。然而，如果执行到了非 `void` 函数的末尾（即遇到了函数的闭合大括号），则会返回一个垃圾值。虽然这种情况并不是语法错误，但它仍然是一个基础性的缺陷，应该被避免。\n\
  \n只要函数没有被声明为 `void`，你就可以将其作为表达式中的操作数。\n\n因此，以下每个表达式都是有效的：\n\n```c\nx = power(y);\n\
  if(max(x,y) > 100) printf(\"greater\");\nfor(ch=getchar(); isdigit(ch); ) . . .\
  \ ;\n```\n\n通常情况下，函数调用不能位于赋值语句的左侧。像 `swap(x,y) = 100; /* incorrect statement */`\
  \ 这样的语句是错误的。C 编译器会将其标记为错误并且不会编译包含它的程序。\n\n当你编写程序时，你的函数将分为类型。第一类仅仅是计算型的。这些函数专门设计用于对其参数执行操作，并根据该操作返回一个值。计算型函数是一个“纯”函数。示例是标准库函数\
  \ `sqrt()` 和 `sin()`，它们计算参数的平方根和正弦值。\n\n第二类函数处理信息，并返回一个仅用于指示该操作是否成功或失败的值。例如，库函数\
  \ `fclose()`，它用于关闭文件。如果关闭操作成功，函数返回 `0`；如果发生错误，则返回 `EOF`。\n\n最后一种类型的函数没有显式的返回值。本质上，该函数是严格过程化的，不产生任何值。示例是\
  \ `exit()`，它会终止程序。所有不返回值的函数都应该声明为返回类型 `void`。通过将函数声明为 `void`，你可以防止它被用于表达式，从而防止意外误用。\n\
  \n有时，某些确实没有产生有趣结果的函数也会返回某些东西。例如，`printf()` 返回写入的字符数。然而，发现一个实际上检查这一点的程序并不寻见。换句话说，尽管除了\
  \ `void` 类型外所有函数都返回返回值，但你不需要对该返回值做任何事情。关于函数返回值的常见问题是：“既然返回了一个值，我难道不需要把这个值赋值给某个变量吗？”答案是不需要的。如果没有指定赋值，返回值将直接被丢弃。考虑以下程序，它使用了\
  \ `mul()` 函数：\n\n```c\n#include <stdio.h>\n\nint mul(int a, int b);\n\nint main(void)\n\
  {\n    int x, y, z;\n    x = 10; y = 20;\n    z = mul(x, y); /* 1 */\n    printf(\"\
  %d\", mul(x,y)); /* 2 */\n    mul(x, y); /* 3 */\n    return 0;\n}\n\nint mul(int\
  \ a, int b)\n{\n    return a*b;\n}\n```\n\n在第 1 行，`mul()` 的返回值被赋值给 `z`。在第 2 行，返回值并没有被实际赋值，但它被\
  \ `printf()` 函数使用了。最后，在第 3 行，返回值丢失了，因为它既没有赋值给另一个变量，也没有作为表达式的一部分。\n\n## 返回指针\n\n\
  虽然返回指针的函数处理方式与任何其他类型的函数一样，但回顾一些关键概念并查看示例是有帮助的。指针既不是整数也不是无符号整数。它们是特定类型数据的内存地址。这种区别的原因之一是，指针算术是相对于基类型的。例如，如果一个整数指针递增，它包含的值将比之前的值大\
  \ 4（假设整数为 4 字节）。通常，指针每增加一次（或减少一次），它都会指向其类型的下一个（或上一个）项目。由于不同数据类型的长度可能不同，编译器必须知道指针指向的是什么类型的数据。由于由于，返回指针的函数必须显式声明它返回的是什么类型的指针。例如，你不应该使用\
  \ `int` 返回类型来返回 `char *` 指针！在某些情况下，函数需要返回一个通用指针。在这种情况下，函数返回类型必须指定为 `void *`。\n\n\
  要返回指针，函数必须声明为具有指针返回类型。例如，以下函数返回指向字符串 `s` 中第一次出现的字符 `c` 的指针：如果没有找到匹配项，则返回一个指向空终止符的指针。\n\
  \n```c\n/* Return pointer of first occurrence of c in s. */\nchar *match(char c,\
  \ char *s)\n{\n    while(c!=*s && *s) s++;\n    return(s);\n}\n```\n\n这是一个使用 `match()`\
  \ 的短程序：\n\n```c\n#include <stdio.h>\n\nchar *match(char c, char *s); /* prototype\
  \ */\n\nint main(void)\n{\n    char s[80], *p, ch;\n    gets(s);\n    ch = getchar();\n\
  \    p = match(ch, s);\n    if(*p)\n        printf(\"%s\");\n    else\n        printf(\"\
  No match.\\n\");\n    return 0;\n}\n```\n\n## void 类型函数\n\nvoid 的用途之一是显式声明不返回值的函数。这防止了它们在表达式中的使用并有助于避免误用。例如，`print_vertical()`\
  \ 函数将其参数垂直打印在屏幕上。由于它没有返回值，因此被声明为 `void`。\n\n```c\nvoid print_vertical (char *str)\n\
  {\n    while (*str)\n        printf(\"%c\\n\", *str++);\n}\n```\n\n这是一个使用 `print_vertical()`\
  \ 的示例：\n\n```c\n#include <stdio.h>\n\nvoid print_vertical(char *str);\n\nint main(int\
  \ argc, char *argv[])\n{\n    if(argc > 1) print_vertical(argv[1]);\n    return\
  \ 0;\n}\n```\n\n一点：早期 C 版本没有定义 `void` 关键字。因此，在早期的 C 程序中，不返回值的函数默认是 `int`，即使没有返回值。\n\
  \n## main() 返回什么？\n\n`main()` 函数向调用进程（通常是操作系统）返回一个整数。从 `main()` 返回值等同于带相同的值调用 `exit()`。如果\
  \ `main()` 没有明确返回，传递给调用进程的值在技术上是未定义的。实际上，大多数 C 编译器会自动返回 0，但如果考虑到可移植性，请不要依赖此。\n\n\
  ## 递归\n\n在 C 中，函数可以调用自己。在这种情况下，该函数被称为是*递归的*。递归是根据自身定义某物的过程，有时被称为*循环定义*。\n\n递归的一个简单示例是\
  \ `factr()`，它计算整数的阶乘。一个数字 `n` 的阶乘是 1 到 `n` 之间所有整数的积。例如，3 的阶乘是 1 × 2 × 3，即 6。这里展示了\
  \ `factr()` 及其等迭代版本：\n\n```c\n/* recursive */\nint factr(int n) {\n    int answer;\n\
  \    if(n==1) return(1);\n    answer = factr(n-1)*n; /* recursive call */\n    return(answer);\n\
  }\n\n/* non-recursive */\nint fact(int n) {\n    int t, answer;\n}\n```\n\n\n\n\n\
  \n```c\nanswer = 1;\nfor(t=1; t<=n; t++) {\n    answer=answer*(t);\n}\nreturn(answer);\n\
  }\n```\n\n`fact()` 的非递归版本非常直观。它使用一个从 1 运行到 `n` 的循环，逐步将每个数字与当前的乘积相乘。\n\n递归版本 `factr()`\
  \ 的操作稍微复杂一些。当用参数 1 调用 `factr()` 时，该函数返回 1。否则，它返回 `factr(n-1)*n` 的乘积。为了计算这个表达式，会用参数\
  \ `n-1` 调用 `factr()`。这种情况会一直持续，直到 `n` 等于 1，函数调用开始返回。\n\n计算 2 的阶乘时，对 `factr()` 的第一次调用会导致第二次参数为\
  \ 1 的递归调用。这次调用返回 1，然后将其乘以 2（原始的 `n` 值）。答案即为 2。尝试自己自己计算一下 3 的阶乘。（你可能想在 `factr()`\
  \ 中插入 `printf()` 语句，以查看每次调用的层级以及中间结果是什么。）当函数调用其自身时，会在栈上分配一组新的局部变量和参数存储空间，并使用这些新变量从顶部开始执行函数代码。递归调用不会创建函数的新副本。只有被操作的值是新的。随着每次递归调用返回，旧的局部变量和参数会从栈中移除，执行将在函数内部的递归调用之后立即继续。递归函数可以被说是“向外延伸再回来”的。\n\
  \n尽管递归似乎提供了提高效率的可能性，但这种情况并不多见。\n\n通常，递归程序并不能显著减少代码大小或提高内存利用率。此外，由于重复函数调用的开销，大多数程序的递归版本执行速度可能比对应的迭代版本慢。事实上，对函数的多次递归调用会导致栈溢出（stack\
  \ overrun）。由于函数参数和局部变量的存储在栈上，且每次新调用都会创建这些变量的新副本，栈可能会耗尽。栈溢出通常是递归函数失控运行时导致程序崩溃的原因。\n\
  \n递归函数的主要优势在于你可以使用它们创建更清晰、更简单的算法版本。例如，快速排序算法（在第四部分所示）很难用迭代的方式实现。此外，某些问题（特别是与人工智能相关的问题）非常适合递归解决方案。最后，有些人似乎认为递归性思考比迭代性思考更容易。\n\
  \n在编写递归函数时，你必须在某处有一个条件语句（如 `if`），来强制函数在不执行递归调的情况下返回。如果不这样做，一旦调用该函数，它将永远不会返回。遗漏条件语句是编写递归函数时的常见错误。在程序开发期间多使用\
  \ `printf()`，这样你就可以观察发生的情况，并在发现错误时终止执行。\n\n### 函数原型 (Function Prototypes)\n\n在现代、编写良好的良好的\
  \ C 程序中，所有函数必须在使用它们之前进行声明。这通常通过使用函数原型来实现。函数原型不是原始 C 语言的一部分，而是由 C89 引入的。尽管在技术上并不强制要求使用原型，但强烈建议使用它们。（然而，C++\
  \ *确实是* 要求使用原型的。）在本书中，所有的示例都包含了完整的函数原型。原型使编译器能够提供更强的类型检查，有点类似于 Pascal 等语言所提供的检查。当你使用原型时，编译器可以发现并报告调用函数时使用的参数与函数参数类型之间任何可疑的类型转换。编译器还会捕捉调用函数时使用的参数数量与函数中参数数量之间的差异。\n\
  \n函数原型的通用形式如下：\n\n```c\n*type*\n*func_name*( *type* *parm_name1*,\n*type* *parm_name2*,\n\
  .\n.\n,\n*type* *parm_nameN*);\n```\n\n参数名称是可选的。然而，它们允许编译器在发生错误时通过名称识别任何类型不匹配，因此包含它们是一个好主意。\n\
  \n下面的程序说明了函数原型的价值。它产生了一条错误信息，因为它尝试用整数参数调用 `sqr_it()`，而不是它所所需的整数指针。\n\n```c\n/* 此程序使用函数原型来\n\
  强制执行强类型检查。 */\nvoid sqr_it(int *i); /*原型 */\n\nint main(void)\n{\n    int x;\n \
  \   x = 10;\n    sqr_it(x); /* 类型不匹配 */\n    return 0;\n}\n\nvoid sqr_it(int *i)\n\
  {\n    *i = *i * *i;\n}\n```\n\n如果函数的定义出现在程序中第一次使用该函数之前，那么函数的定义也可以作为它的原型。例如，这是一个有效程序：\n\
  \n```c\n#include <stdio.h>\n/* 此定义也将作为\n该程序内的原型。 */\nvoid f(int a, int b)\n{\n \
  \   printf(\"%d \", a % b);\n}\n\nint main (void)\n{\n    f(10,3);\n    return 0;\n\
  }\n```\n\n在这个示例中，由于 `f()` 在 `main()` 中使用之前就已经定义了，因此不需要单独的原型。\n\n虽然在小型程序中函数的定义可以作为其原型，但在大型程序中几乎是不可能的——尤其是当使用多个文件时。书中的程序为每个函数都包含一个单独的原型，因为这在实践中是\
  \ C 代码通常的编写方式。\n\n唯一不需要原型的函数是 `main()`，因为它是程序启动时第一个调用的函数。\n\nC 和 C++ 在处理没有参数的函数原型方面存在细微但重要的区别。在\
  \ C++ 中，空参数列表通过缺失任何参数来指示。例如：\n\n```cpp\nint f(); /* 无参数的函数的 C++ 原型 */\n```\n\n然而，在\
  \ C 中这条语句的含义不同。由于需要与原始版本的 C 兼容，空参数列表仅仅表示*没有给出参数信息*。对于编译器来说，该函数可以有几个参数，也可以没有参数。（这种语句被称为旧式函数声明，将在下一节介绍。）\n\
  \n在 C 中，当一个函数没有参数时，其原型在参数列表内部使用 `void`。例如，这里 `f()` 在 C 程序中的原型所示：\n\n```c\nfloat\
  \ f(void);\n```\n\n这告诉编译器该函数没有参数，任何带有参数的该函数调用都是错误。在 C++ 中，在空参数列表内部使用 `void` 仍然允许，但它是多余的。\n\
  \n函数原型帮助你在错误发生之前发现它们。此外，通过不允许使用不匹配的参数调用函数，它们有助于验证你的程序运行正常。\n\n\n\n\n\n在 C 语言早期，在函数原型（function\
  \ prototypes）创建之前，仍然需要提前告知编译器函数的返回类型，以便在调用函数时能够生成相应的代码。（由于不同数据类型的大小不同，在调用函数之前需要知道返回类型的大小。）这是通过不包含任何参数信息的函数声明来实现的。这种旧式方法按今天的标准来说是过时的。然而，在旧代码中仍然可以找到踪迹。因此，理解它的工作原理是非常重要的。\n\
  \n使用旧式方法，函数的返回类型和名称被声明在程序的开头处，如下所示：\n\n```c\n#include <stdio.h>\n\ndouble div();\
  \ /* 旧式函数声明 */\n\nint main(void)\n{\n    printf(\"%f\", div(10.2, 20.0));\n    return\
  \ 0;\n}\n\ndouble div(double num, double denom)\n{\n    return num / denom;\n}\n\
  ```\n\n旧式函数类型声明告诉编译器 `div()` 返回一个 `double` 类型的对象。\n\n这允许编译器为调用 `div()` 的操作生成正确的代码。然而，它并没有对\
  \ `div()` 的参数做任何说明。\n\n旧式函数声明语句具有以下通用形式：\n\n```c\ntype_specifier function_name();\n\
  ```\n\n注意参数列表是空的。即使函数接受参数，在它的类型声明中也没有列出任何参数。\n\n如所述，旧式函数声明是过时的，不应在新代码中使用。它也与 C++\
  \ 不兼容。\n\n### 标准库函数原型\n\n你的程序使用的任何标准库函数都必须有原型。要实现这一点，你必须为每个库函数包含相应的*头文件*（header）。所有必要的头文件由\
  \ C 编译器提供。在 C 中，库头文件（通常）使用 `.h` 扩展的文件。头文件包含两个主要元素：库函数使用的任何定义以及库函数的原型。例如，`<stdio.h>`\
  \ 被包含在书中几乎所有的程序，因为它包含了 `printf()` 的原型。标准库的头文件将在第二部分描述。\n\n### 声明变长参数列表\n\n你可以指定一个具有可变数量的函数。最常见的例子是\
  \ `printf()`。为了告诉编译器向函数传递未知数量的参数，你必须使用三个点来结束参数的声明。例如，此原型指定 `func()` 将至少有两个整数参数，之后是未知数量（包括\
  \ 0 个）的参数：\n\n```c\nint func(int a, int b, ...);\n```\n\n这种形式的形式也用于函数的定义。\n\n任何使用变长参数的函数必须至少有一个实际参数。例如，下面这种是不正确的：\n\
  \n```c\nint func(...); /* 非法 */\n```\n\n### “隐式 int”规则\n\nC 语言原始版本包含一个有时描述为“隐式 `int`”规则（也称为“默认\
  \ `int`”规则）的功能。该规则规定，在缺少显式类型说明符的情况下，假设类型为 `int`。该规则包含在 C89 标准中，但已被 C99 删除。\n\n（C++\
  \ 也不支持。）由于隐式 `int` 规则现在已经过时，本书不再使用它。然而，由于许多现有程序仍在使用它，简短的讨论是有必要的。\n\n隐式 `int` 规则最用法是在函数的返回类型中。年前，许多（可能是大部分）C\
  \ 程序员在创建返回 `int` 结果的函数时利用了这一规则。因此，多年前像这样的函数：\n\n```c\nint f(void) {\n    /* ...\
  \ */\n    return 0;\n}\n\nf(void) { /* 返回类型默认为 int */\n    /* ... */\n    return\
  \ 0;\n}\n```\n\n在第一个实例中，返回类型 `int` 是显式指定的。在第二个实例中，它是默认假设的。\n\n隐式 `int` 规则不仅适用于函数返回值（尽管它是最常见的用法）。例如，对于\
  \ C89 及更早版本，以下函数是正确的：\n\n```c\n/* 这里，返回类型默认为 int，a 和 b 的\n类型也是如此。 */\nf(register\
  \ a, register b) {\n    register c; /* c 也默认为 int */\n    c = a + b;\n    printf(\"\
  %d\", c);\n    return c;\n}\n```\n\n在这里，`f()` 的返回类型默认为 `int`；参数 `a`、`b` 以及局部变量 `c`\
  \ 的类型也是如此。\n\n请记住，隐式 `int` 规则不被 C99 或 C++ 支持。因此，不建议在兼容 C89 的程序中使用它。最好显式指定你程序中使用的每种类型。\n\
  \n### 旧式 vs 现代函数参数声明\n\nC 语言的早期版本使用的参数声明方法与现代 C 语言（包括 C89 和 C99（以及 C++））使用的不同。这种早期方法有时被称为*经典*（classic）形式。\n\
  \n本书使用一种称为*现代*（modern）形式的声明方法。标准 C 支持这两种形式，但强烈建议使用现代形式。（C++ 只支持现代参数声明方法。）然而，你应该了解旧式形式，因为许多旧的\
  \ C 程序仍然在使用它。\n\n旧式形式由两部分组成：参数列表，位于函数名后的圆括号内；以及参数声明，位于右括号和函数大括号之间。通用形式为：\n\n```c\n\
  type func_name(parm1, parm2, ..., parmN)\ntype parm1;\ntype parm2;\n...\ntype parmN;\n\
  { }\n```\n\n例如，这个现代声明\n\n```c\nfloat f(int a, int b, char ch) {\n    /* ... */\n\
  }\n```\n\n在它的旧式形式看起来像这样：\n\n```c\nfloat f(a, b, ch)\nint a, b;\nchar ch;\n{\n  \
  \  /* ... */\n}\n```\n\n注意，旧式形式允许在类型名后的列表中声明多个参数。旧式形式被指定为已废弃，且不被 C++ 支持。\n\n###\
  \ inline 关键字\n\nC99 增加了 `inline` 关键字，它适用于函数。它将在第二部分详细描述，但这里给出一个简短的描述。通过在函数声明前加上\
  \ `inline`，你是在告诉编译器优化该函数。通常，这意味着函数的代码将被内联展开，而不是调用。然而，`inline` 只是对编译器的请求，可以被忽略。\n\
  \n**注意**\n\n`inline` 修饰符也被 C++ 支持。\n\n\n\n\n结构（structure）是在一个名称下定义的变量集合，提供了一种将相关信息组合在一起的方便方法。`structure\
  \ declaration`（结构声明）形成了一个模板，用于创建结构对象（即结构的实例）。组成结构的变量被称为 `members`（成员）。（结构成员也常被称为\
  \ `elements` 元素或 `fields` 字段。）通常情况下，结构的成员在逻辑上是相关的。例如，邮寄列表中的姓名和地址信息通常用一个结构来表示。下面的代码段显示了如何声明一个定义姓名和地址字段的结构。关键字\
  \ `struct` 告诉编译器正在声明一个结构。\n\n```c\nstruct addr\n{\nchar name[30];\nchar street[40];\n\
  char city[20];\nchar state[3];\nunsigned long int zip;\n};\n```\n\n注意，声明以分号结束。这是因为结构声明是一个语句。此外，结构标签\
  \ `addr` 标识了这一特定的数据结构，并是它的类型指定符。\n\n此时，还没有任何变量实际被创建。仅仅定义了数据的格式。\n\n当你声明一个结构时，你定义的是聚合\
  \ `type`（类型），而不是一个变量。只有当你声明了该类型的变量后，它才真正存在。要声明一个类型为 `addr` 的变量（即物理对象），写入：\n\n```c\n\
  struct addr addr_info;\n```\n\n这声明了一个类型为 `addr` 名为 `addr_info` 的变量。因此，`addr` 描述结构的形状（其类型），而\
  \ `addr_info` 是该结构的实例（对象）。\n\n当声明结构变量（如 `addr_info`）时，编译器会自动分配足够的内存来容纳其所有的成员。图 7-1\
  \ 显示了假设 `long` 整数为 4 字节时 `addr_info` 在内存中的样子。\n\n你在声明结构时也可以声明一个或多个对象。例如：\n\n```c\n\
  struct addr {\nchar name[30];\nchar street[40];\nchar city[20];\nchar state[3];\n\
  unsigned long int zip;\n} addr_info, binfo, cinfo;\n```\n\n这定义了一个名为 `addr` 的结构类型，并声明了该类型的变量\
  \ `addr_info`、`binfo` 和 `cinfo`。\n\n重要的是要理解每个结构变量都包含其结构成员的副本。例如，`binfo` 的 `zip`\
  \ 字段与 `cinfo` 的 `zip` 字段是独立且不同的。例如，对 `binfo` 中 `zip` 的修改不会影响 `cinfo` 中的 `zip`。\n\
  \n如果你只需要一个结构变量，不需要结构标签。这意味着：\n\n```c\nstruct {\nchar name[30];\nchar street[40];\n\
  char city[20];\nchar state[3];\nunsigned long int zip;\n} addr_info;\n```\n\n这根据前面的结构定义声明了一个名为\
  \ `addr_info` 的变量。\n\n结构声明的一般形式为：\n\n```c\nstruct *tag\n{\n*type*\n*member-name;\n\
  *type*\n*member-name;\n*type*\n*member-name;\n.\n.\n.\n}\n*structure-variables;\n\
  ```\n\n其中 `tag` 或 `structure-variables` 可以省略，但不能两者都省略。\n\n### 访问结构成员\n\n结构的单个成员通过使用\
  \ `.` 操作符（通常称为 `dot operator`）来访问。例如，以下语句将邮政编码 `12345` 分配给先定义的结构变量 `addr_info` 的\
  \ `zip` 字段：\n\n```c\naddr_info.zip = 12345;\n```\n\n对象名（在此例为 `addr_info`）后跟一个点和成员名（在此例为\
  \ `zip`）指向该特定的成员。访问结构成员的一般形式为 `object-name.member-name`。\n\n因此，为了在屏幕上打印邮政编码，写入：\n\
  \n```c\nprintf(\"%lu\", addr_info.zip);\n```\n\n这打印出结构变量 `addr_info` 中 `zip` 成员包含的邮政编码。\n\
  \n同样，字符数组 `addr_info.name` 可以用于 `gets()` 的调用，如下所示：\n\n```c\ngets(addr_info.name);\n\
  ```\n\n这会将一个字符指针传递给 `name` 的起始位置。由于 `name` 是字符数组，你可以通过索引 `name` 来访问 `addr_info.name`\
  \ 的单个字符。例如，你可以使用以下代码逐个字符打印 `addr_info.name` 的内容：\n\n```c\nfor(t=0; addr_info.name[t];\
  \ ++t)\nputchar(addr_info.name[t]);\n```\n\n注意索引的是 `name`（而不是 `addr_info`）。记住，`addr_info`\
  \ 是整个结构对象的名称；`name` 是该结构的一个元素。因此，如果你想对结构的元素进行索引，必须将下标放在元素名之后。\n\n### 结构赋值\n\n一个结构中包含的信息可以使用单个赋值语句赋值给另一个相同类型的结构。你不需要单独为每个成员赋值。下面的程序说明了结构赋值：\n\
  \n```c\n#include <stdio.h>\n\nint main(void)\n{\nstruct {\nint a;\nint b;\n} x,\
  \ y;\n\nx.a = 10;\ny = x; // 将结构赋值给另一个\nprintf(\"%d\", y.a);\nreturn 0;\n}\n```\n\
  \n赋值后，`y.a` 将包含值。\n\n### 结构数组\n\n结构通常组织成数组。要声明结构数组，你必须先定义一个结构，然后声明该类型的数组。例如，声明类型为\
  \ `addr` 的 100 元素数组，写入：\n\n```c\nstruct addr addr_list[100];\n```\n\n这创建了按照 `addr`\
  \ 定义的变量。要访问特定的结构，索引数组名。例如，打印第 3 个结构的邮政编码：\n\n```c\nprintf(\"%lu\", addr_list[2].zip);\n\
  ```\n\n与所有数组一样，结构数组从 0 开始。当你想要引用数组中的特定结构时，索引结构名。例如，将 'X' 赋值给第三个结构的 **name**。\n\n\
  ### 示例\n\n为了说明结构和结构数组的使用，本节开发了一个简单的列表程序，使用结构数组来存储地址信息。在这个示例中，存储的信息包括姓名、城市、州和邮政编码。地址信息存储\
  \ `addr` 结构数组中，如下：\n\n```c\nstruct addr {\nchar name[30];\nchar street[40];\nchar\
  \ city[20];\nchar state[3];\nunsigned long int zip;\n} addr_list[MAX];\n```\n\n\
  注意 `zip` 字段是一个 `unsigned long` int。坦率地说，使用字符串存储邮政编码更为常见，因为它可以包含字母和数字（如加拿大和其他国家使用的）。然而，本示例使用整数存储邮政编码，以此说明数值结构元素。\n\
  \n程序需要的第一个函数是 `main()`，如下：\n\n```c\nint main(void)\n{\nchar choice;\ninit_list();\
  \ /* 初始化结构数组 */\nfor(;;) {\nchoice = menu_select();\nswitch(choice) {\ncase 1: enter();\n\
  break;\ncase 2: delete();\nbreak;\ncase 3: list();\nbreak;\ncase 4: exit(0);\n}\n\
  }\nreturn 0;\n}\n```\n\n该函数首先初始化结构数组，然后响应菜单选择。\n\n`init_list()` 函数通过在数组中每个结构的 `name`\
  \ 字段的首字节中放入一个空字符来准备结构数组。程序假设如果 `name` 为空，则数组元素未被使用。`init_list()` 函数所示：\n\n```c\n\
  /* 初始化列表。 */\nvoid init_list(void)\n{\nregister int t;\nfor(t=0; t<MAX; ++t) addr_list[t].name[0]\
  \ = '\\0';\n}\n```\n\n`menu_select()` 函数显示菜单并返回用户的选择。\n\n\n\n/* 获取菜单选择。 */\n\n```c\n\
  int menu_select(void)\n{\n  char s[80];\n  int c;\n  printf(\"1\\. 输入名称\\n\");\n\
  \  printf(''2\\. 删除名称\\n\");\n  printf(\"3\\. 列出文件\\n\");\n  printf(''4\\. 退出\\\
  n\");\n  do {\n    printf(\"\\nEnter 您的选择: \");\n    gets(s);\n    c = atoi(s);\n\
  \  } while(c<0 || c>4);\n  return c;\n}\n```\n\n`enter()` 函数提示用户输入并将信息存储在下一个空闲结构中。如果数组已满，将显示消息\
  \ `List Full`（列表满）。`find_free()` 在结构体数组中搜索未使用的元素。\n\n/* 将地址输入列表。 */\n```c\nvoid\
  \ enter(void)\n{\n  int slot;\n  char s[80];\n  slot = find_free();\n  if(slot==-1)\
  \ {\n    printf(\"\\nList Full\");\n    return;\n  }\n  printf(\"Enter name: \"\
  );\n  gets(addr_list[slot].name);\n  printf(\"Enter street: \");\n  gets(addr_list[slot].street);\n\
  \  printf(\"Enter city: \");\n  gets(addr_list[slot].city);\n  printf(\"Enter state:\
  \ \");\n  gets(addr_list[slot].state);\n  printf(\"Enter zip: \");\n  gets(s);\n\
  \  addr_list[slot].zip = strtoul(s, '\\0', 10);\n}\n```\n\n/* 查找未使用的结构。 */\n```c\n\
  int find_free(void)\n{\n  register int t;\n  for(t=0; addr_list[t].name[0] && t<MAX;\
  \ ++t) ;\n  if(t==MAX) return -1; /* 没有空闲位置 */\n  return t;\n}\n```\n\n注意，如果每个结构体数组变量都已使用，`find_free()`\
  \ 将返回 -1。这是一个安全的数字，因为数组中不存在为 -1 的元素。\n\n`delete()` 函数要求用户指定需要删除的地址索引。该函数随后在 `name`\
  \ 字段的第一个位置放置一个空字符。\n\n/* 删除一个地址。 */\n```c\nvoid delete(void)\n{\n  register int\
  \ slot;\n  char s[80];\n  printf(\"Enter record #: \");\n  gets(s);\n  slot = atoi(s);\n\
  \  if(slot>=0 && slot < MAX)\n    addr_list[slot].name[0] = '\\0';\n}\n```\n\n程序需要的最后一个函数是\
  \ `list()`，它在屏幕上打印整个邮件列表。\n\n由于计算环境之间的巨大差异，C 语言没有定义发送输出到打印机的标准函数。然而，所有的 C 编译器都提供了实现这一功能的方法。你可能想自己为邮件列表程序添加打印功能。\n\
  \n/* 在屏幕上显示列表。 */\n```c\nvoid list(void)\n{\n  register int t;\n  for(t=0; t<MAX;\
  \ ++t) {\n    if(addr_list[t].name[0]) {\n      printf(''%s\\n\", addr_list[t].name);\n\
  \      printf(\"%s\\n\", addr_list[t].street);\n      printf(\"%s\\n\", addr_list[t].city);\n\
  \      printf(\"%s\\n\", addr_list[t].state);\n      printf(\"%lu\\n\\n\", addr_list[t].zip);\n\
  \    }\n  }\n  printf(\"\\n\\n\");\n}\n```\n\n完整的邮件列表程序如所示。如果你对结构体仍有任何疑问，请将此程序输入你的计算机并研究其执行过程，进行修改并观察其效果。\n\
  \n/* 使用结构体数组的简单邮件列表示例。 */\n```c\n#include <stdio.h>\n#include <stdlib.h>\n#define\
  \ MAX 100\nstruct addr {\n  char name[30];\n  char street[40];\n  char city[20];\n\
  \  char state[3];\n  unsigned long int zip;\n} addr_list[MAX];\n\nvoid init_list\
  \ (void), enter(void);\nvoid delete(void), list(void);\nint menu_select(void), find_free(void);\n\
  \nint main(void)\n{\n  char choice;\n  init_list(); /* 初始化结构体数组 */\n  for(;;) {\n\
  \    choice = menu_select();\n    switch(choice) {\n      case 1: enter();\n   \
  \     break;\n      case 2: delete();\n        break;\n      case 3: list();\n \
  \       break;\n      case 4: exit(0);\n    }\n  }\n  return 0;\n}\n\n/* 初始化列表。\
  \ */\nvoid init_list(void)\n{\n  register int t;\n  for(t=0; t<MAX; ++t) addr_list[t].name[0]\
  \ = '\\0';\n}\n\n/* 获取菜单选择。 */\nint menu_select(void)\n{\n  char s[80];\n  int c;\n\
  \  printf(\"1\\. 输入名称\\n\");\n  printf(''2\\. 删除名称\\n\");\n  printf(\"3\\. 列出文件\\\
  n\");\n  printf(''4\\. 退出\\n\");\n  do {\n    printf(\"\\nEnter 您的选择: \");\n   \
  \ gets(s);\n    c = atoi(s);\n  } while(c<0 || c>4);\n  return c;\n}\n\n/* 将地址输入列表。\
  \ */\nvoid enter(void)\n{\n  int slot;\n  char s[80];\n  slot = find_free();\n \
  \ if(slot==-1) {\n    printf(\"\\nList Full\");\n    return;\n  }\n  printf(\"Enter\
  \ name: \");\n  gets(addr_list[slot].name);\n  printf(\"Enter street: \");\n  gets(addr_list[slot].street);\n\
  \  printf(\"Enter city: \");\n  gets(addr_list[slot].city);\n  printf(\"Enter state:\
  \ \");\n  gets(addr_list[slot].state);\n  printf(\"Enter zip: \");\n  gets(s);\n\
  \  addr_list[slot].zip = strtoul(s, '\\0', 10);\n}\n\n/* 查找未使用的结构。 */\nint find_free(void)\n\
