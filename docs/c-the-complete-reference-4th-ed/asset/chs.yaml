  \n### 最小字段宽度格式符\n\n放在 `%` 号和格式代码之间的整数充当 `最小字段宽度格式符`。\n\n这会在输出内容中填充空格，以确保其达到某个最小长度。如果字符串或数字大于该最小长度，它仍将完整打印。默认填充使用空格。如果你希望用\
