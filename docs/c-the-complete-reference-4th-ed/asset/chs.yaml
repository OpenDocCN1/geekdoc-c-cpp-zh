  \ /* 货币数值的小数点字符。 */\nchar *mon_thousands_sep; /* 货币数值的千位分隔符。 */\nchar *mon_grouping;\
  \ /* 指定货币数值的分组方式。 */\nchar *positive_sign; /* 货币的正值指示。 */\nchar *negative_sign;\
  \ /* 货币的负值。 */\nchar int_frac_digits; /* 使用国际格式显示的货币数值，小数点后显示的位数。 */\nchar frac_digits;\
  \ /* 使用本地格式显示的货币数值，小数点后显示的位数。 */\nchar p_cs_precedes; /* 1 如果货币符号在正值之前，0 如果货币符号在数值之后。\
  \ */\nchar p_sep_by_space; /* 1 如果货币符号与数值之间有空格，否则为 0。在 C99 中，包含一个表示分隔的值。 */\nchar\
  \ n_cs_precedes; /* 1 如果货币符号在负值之前，0 如果货币符号在数值之后。 */\nchar n_sep_by_space; /* 1 如果货币符号与负值之间有空格，0\
  \ 如果货币符号在数值之后。在 C99 中，包含一个表示分隔的值。 */\nchar p_sign_posn; /* 指明正值符号的位置。 */\nchar n_sign_posn;\
  \ /* 指明负值符号的位置。 */\n\n/* 以下成员由 C99 添加。 */\nchar p_cs_precedes; /* 1 如果货币符号在正值之前，0\
  \ 如果货币符号在数值之后。适用于国际格式化的数值。 */\nchar _p_sep_by_space; /* 指定货币符号、正号符号和正值之间的间隔。适用于国际格式化的数值。\
  \ */\nchar _n_cs_precedes; /* 1 如果货币符号在负值之前，0 如果货币符号在数值之后。适用于国际格式化的数值。 */\nchar\
  \ _n_sep_by_space; /* 指定货币符号、负号符号和负值之间的间隔。适用于国际格式化的数值。 */\nchar _p_sign_posn; /*\
  \ 指明正值符号的位置。适用于国际格式化的数值。 */\nchar _n_sign_posn; /* 指明负值符号的位置。适用于国际格式化的数值。 */\n```\n\
  \n`localeconv() ` 函数返回指向 `lconv` 结构的指针。你不应修改该结构的内容。有关 `lconv` 结构的特定实现信息，请参考您的编译器文档。\n\
  \n### 示例\n以下程序显示当前区域（locale）使用的数点字符：\n\n```c\n#include <stdio.h>\n#include <locale.h>\n\
  \nint main (void)\n{\n    struct lconv lc;\n    lc = *localeconv();\n    printf(\"\
  Decimal symbol is: %s\\n\", lc.decimal_point);\n    return 0;\n}\n```\n\n### 相关函数\n\
  `setlocale()`\n`localtime`\n\n```c\n#include <time.h>\nstruct tm *localtime(const\
  \ time_t *time);\n```\n\n`localtime() ` 函数返回以 `tm` 结构体形式表示的 `time` 拆解形式。时间以本地时间表示。`time`\
  \ 指针通常通过调用 `time()` 获取。\n\n`localtime()` 用于存储拆解时间的结构是静态分配的，并且每次调用该函数时都会被覆盖。如果你想保存结构体的内容，必须将其复制到其他地方。\n\
  \n### 示例\n此程序同时打印系统的本地时间协调协调世界时 (UTC)：\n\n```c\n#include <time.h>\n#include <stdio.h>\n\
  \n/* 打印本地时间和 UTC 时间。 */\nint main(void)\n{\n    struct tm *local;\n    time_t t;\n\
  \    t = time(NULL);\n    local = localtime(&t);\n    printf(\"Local time and date:\
  \ %s\\n\", asctime(local));\n    local = gmtime(&t);\n    printf(\"UTC time and\
  \ date: %s\\n\", asctime(local));\n    return 0;\n}\n```\n\n### 相关函数\n`gmtime()`,\
  \ `time()`, 和 `asctime() `\n`mktime`\n\n```c\n#include <time.h>\ntime_t mktime(struct\
  \ tm *time);\n```\n\n`mktime() ` 函数返回 `time` 指针指向的结构中拆解时间的等效日历时间。元素 `tm_wday` 和\
  \ `tm_yday` 由函数设置，因此在调用时不需要定义。\n\n如果 `mktime() ` 无法将信息表示为有效时间，则返回 -1。\n\n### 示例\n\
  此程序告诉你 2005 年 1 月的星期几：\n\n```c\n#include <time.h>\n#include <stdio.h>\n\nint main(void)\n\
  {\n    struct tm t;\n    time_t t_of_day;\n    t.tm_year = 2005-1900;\n    t.tm_mon\
  \ = 0;\n    t.tm_mday = 3;\n    t.tm_hour = 0;\n    t.tm_min = 0;\n    t.tm_sec\
  \ = 0;\n    t.tm_isdst = 0;\n    t_of_day = mktime(&t);\n    printf(ctime(&t_of_day));\n\
  \    return 0;\n}\n```\n\n### 相关函数\n`time()`, `gmtime()`, `asctime()`, 和 `ctime()\
  \ `\n`setlocale`\n\n```c\n#include <locale.h>\nchar *setlocale(int type, const char\
  \ *locale);\n```\n\n`setlocale() ` 函数允许对程序敏感的地缘环境参数进行查询或设置。如果 `locale` 为空，`setlocale()`\
  \ 返回当前区域字符串的指针。否则，`setlocale()` 尝试使用 `locale` 字符串来设置 `type` 参数。要指定标准 C 区域，使用字符串\
  \ \"C\"。要指定原生环境，使用空字符串 \"\"。参考您的编译器文档获取其支持的区域字符串。\n\n在调用时，`type` 必须是以下宏之一（定义在 `<locale.h>`\
  \ 中）：\n- `LC_ALL`\n- `LC_COLLATE`\n- `LC_CTYPE`\n- `LC_MONETARY`\n- `LC_NUMERIC`\n\
  - `LC_TIME`\n\n`LC_ALL` 指代所有区域类别。`LC_COLLATE` 影响 `strcoll()` 函数的操作。`LC_CTYPE` 改变字符函数的工作。`LC_MONETARY`\
  \ 决定货币格式。`LC_NUMERIC` 改变格式化输入输出函数的数字符。最后，`LC_TIME` 决定 `strftime()` 函数的行为。\n\n###\
  \ 示例\n此程序显示当前的区域设置：\n\n```c\n#include <locale.h>\n#include <stdio.h>\n\nint main(void)\n\
  {\n    printf(setlocale(LC_ALL, \"\"));\n    return 0;\n}\n```\n\n### 相关函数\n`localeconv()`,\
  \ `time()`, `strcoll()`, 和 `strftime() `\n\n### Strftime\n```c\n#include <time.h>\n\
  size_t strftime(char *str, size_t maxsize, const char *fmt, const struct tm *time);\n\
  ```\n\n`strftime() ` 函数根据 `fmt` 指向的字符串中的格式化命令，并使用 `time` 指向的拆解时间，将时间和日期以及其他信息存储到\
  \ `str` 指向的字符串中。最多将 *maxsize* 个字符放入 `str` 中。\n\n在 C99 中，`str`、`fmt` 和 `time` 经过\
  \ **restrict** 限定。\n\n\n\n\n\n`strftime()` 函数的工作原理与 `sprintf()` 类似，它能够识别一组以百分号（`%`）开头的格式命令，并将格式化后的输出存储到字符串中。格式命令用于指定各种时间和日期信息在\
  \ `str` 中的具体表示方式。格式字符串中发现任何其他字符都将原封不动地放入 `str` 中。显示的时间和日期为本地时间。格式命令见下表。请注意，许多命令是区分大小写的。\n\
  \n`strftime()` 函数返回 `str` 所指向字符串中存储的字符数，如果发生错误则返回 0。\n\n### 命令参考表\n\n| 命令 | 替换为\
  \ |\n| :--- | :--- |\n| %a | 缩写的星期几名称 |\n| %A | 完整的星期几名称 |\n| %b | 缩写的月份名称 |\n|\
  \ %B | 完整的月份名称 |\n| %c | 标准日期和时间字符串 |\n| %C | 年份的最后两位 |\n| %d | 十进制表示的几几（1–31） |\n\
  | %D | 月/日/年（C99 新增） |\n| %e | 两个字符字段中的十进制几几几（1–31）（C99 新增） |\n| %F | 年-月-日（C99\
  \ 新增） |\n| %g | 使用基于周的年份的最后两位（C99 新增） |\n| %G | 使用基于周的年份（C99 新增） |\n| %h | 缩写的月份名称（C99\
  \ 新增） |\n| %H | 小时（0–23） |\n| %I | 小时（1–12） |\n| %j | 十进制表示的一年中的（1–366） |\n| %m\
  \ | 十进制表示的月份（1–12） |\n| %M | 十进制表示的分钟（0–59） |\n| %n | 换行（C99 新增） |\n| %p | 本地语言对应的\
  \ AM 或 PM |\n| %r | 12 小时时间（C99 新增） |\n| %R | hh:mm（C99 新增） |\n| %S | 十进制表示的秒（0–60）\
  \ |\n| %t | 水平表（C99 新增） |\n| %T | hh:mm:ss（C99 新增） |\n| %u | 星期；星期一为周的第一天（0–53）（C99\
  \ 新增） |\n| %U | 年中的周，星期日为第一天（0–53） |\n| %V | 使用基于周的年份的中的周（C99 新增） |\n| %w | 十进制表示的星期（0–6，星期日为\
  \ 0） |\n| %W | 年中的周，星期一为第一天（0–53） |\n| %x | 标准日期字符串 |\n| %X | 标准时间字符串 |\n| %y |\
  \ 不含世纪的十进制年份（0–99） |\n| %Y | 含世纪的十进制年份 |\n| %z | 与 UTC 的偏移（C99 新增） |\n| %Z | 时区名称\
  \ |\n| %% | 百分号 |\n\nC99 允许某些 `strftime()` 格式命令通过 `E` 或 `O` 进行修改。`E` 可以修改 `C`, `x`,\
  \ `X`, `y`, `Y`, `d`, `e`, 和 `H`。`O` 可以修改 `I`, `m`, `M`, `S`, `u`, `U`, `V`, `w`,\
  \ `W`, 和 `y`。这些修饰符会导致显示时间和或日期的另一种表示形式。详情请参阅您的编译器文档。\n\n`%g`、`%G` 和 `%V` 格式命令使用基于周的年份。在这种表示下，星期一是是一的第一天，年的第一周必须包含\
  \ 1 月 4 日。\n\n### 示例\n\n假设 `ltime` 指向包含 10:00:00 AM 的结构体，以下程序将打印 `It is now 10 AM`：\n\
  \n```c\n#include <time.h>\n#include <stdio.h>\n\nint main(void)\n{\n    struct tm\
  \ *ptr;\n    time_t lt;\n    char str[80];\n    lt = time(NULL);\n    ptr = localtime(&lt);\n\
  \    strftime(str, 100, \"It is now %H %p.\", ptr);\n    printf(str);\n    return\
  \ 0;\n}\n```\n\n### 相关函数\n`time()`, `localtime()` 和 `gmtime()`\n\n## 时间\n\n```c\n\
  #include <time.h>\n\ntime_t time(time_t *time);\n```\n\n`time()` 函数返回系统的当前日历时间。如果系统没有时间，则返回\
  \ –1。\n\n`time()` 函数可以带空指针调用，也可以指向 `time_t` 类型变量的指针调用。如果使用后者，该变量将被赋值日历时间。\n\n###\
  \ 示例\n\n此程序显示系统定义的本地时间：\n\n```c\n#include <time.h>\n#include <stdio.h>\n\nint main(void)\n\
  {\n    struct tm *ptr;\n    time_t lt;\n    lt = time(NULL);\n    ptr = localtime(&lt);\n\
  \    printf(asctime(ptr));\n    return 0;\n}\n```\n\n### 相关函数\n`time()`, `localtime()`,\
  \ `gmtime()`\n\n\n\n\n`realloc()` 的精确操作在 C89 和 C99 之间略有不同，尽管最终效果是相同的。对于 C89，`realloc()`\
  \ 将 `ptr` 指向的先前分配的内存的大小更改为 `size` 指定的大小。`size` 的值可以大于也可以小于原始值。它会返回一个指向该内存块的指针，因为\
  \ `realloc()` 可能需要移动该块以更改其大小。如果发生这种情况，旧块的内容（多达 `size` 字节）将被复制到新块中。\n\n对于 C99，`ptr`\
  \ 指向的内存块被释放，并分配一个新的内存块。新块包含与原始块相同的内容（最多为 `size` 指定的长度）。返回一个指向新块的指针。然而，新块和旧块从相同的地址开始是允许的。也就是说，`realloc()`\
  \ 返回的指针可能与传入的 `ptr`相同。\n\n如果 `ptr` 为空，`realloc()` 仅分配 `size` 字节内存并返回指向它的指针。如果 `size`\
  \ 为零，则释放 `ptr` 指向的内存。\n\n如果堆中没有足够的空闲内存来分配 `size` 字节，则返回空指针，且原始块保持不变。\n\n### 示例\n\
  \n该程序首先分配了 17 个字符，将字符串 \"This is 16 chars\" 复制其中，然后使用 `realloc()` 将大小增加到 18，以便在结尾放置句号。\n\
  \n```c\n#include <stdlib.h>\n#include <stdio.h>\n#include <string.h>\n\nint main(void)\n\
  {\n    char *p;\n    p = malloc(17);\n    if(!p) {\n        printf(\"Allocation\
  \ Error\\n\");\n        exit(1);\n    }\n    strcpy(p, \"This is 16 chars\");\n\
  \    p = realloc(p, 18);\n    if(!p) {\n        printf(\"Allocation Error\\n\");\n\
  \        exit(1);\n    }\n    strcat(p, \".\");\n    printf(p);\n    free(p);\n\
  \    return 0;\n}\n```\n\n### 相关函数\n\n`free()`, `malloc()` 和 `calloc()`\n\n# 第 18\
  \ 章—实用函数\n\n标准函数库定义了多个实用函数。它们包括各种转换、可变参数处理、排序和搜索以及随机数生成。这里介绍的许多函数都需要使用头文件 `<stdlib.h>`。在该头文件中声明了类型\
  \ `div_t` 和 `ldiv_t`，它们分别是 `div()` 和 `ldiv()` 返回的值的类型。C99 增加了 `lldiv_t` 类型和 `lldiv()`\
  \ 函数。还声明了类型 `size_t` 和 `wchar_t`。此外还了以下宏：\n\n| 宏 | 含义 |\n| :--- | :--- |\n| `MB_CUR_MAX`\
  \ | 多字节字符的最大长度（字节数） |\n| `NULL` | 空指针 |\n| `RAND_MAX` | `rand()` 函数可以返回的最大值 |\n\
  | `EXIT_FAILURE` | 程序终止时不成功返回给调用进程的值 |\n| `EXIT_SUCCESS` | 程序终止成功时返回给调用进程的值 |\n\n\
  如果某个函数需要 `<stdlib.h>` 以外的头文件，则该函数的描述将对其进行讨论。\n\n## abort\n\n```c\n#include <stdlib.h>\n\
  void abort(void);\n```\n\n`abort()` 函数导致程序立即异常终止。通常情况下，没有文件会被刷新。在支持的环境中，`abort()`\
  \ 会向调用进程（通常是操作系统）返回一个由实现定义的值，以表示失败。\n\n### 示例\n\n在此程序中，如果用户输入 'A'，程序将终止：\n\n```c\n\
  #include <stdlib.h>\n#include <stdio.h>\n\nint main(void)\n{\n    for (;;)\n   \
  \     if(getchar()=='A') abort();\n    return 0;\n}\n```\n\n### 相关函数\n\n`exit()`\
  \ 和 `atexit()`\n\n## abs\n\n```c\n#include <stdlib.h>\nint abs(int *num);\n```\n\
  \n`abs()` 函数返回 `num` 的绝对值。\n\n### 示例\n\n此函数将用户输入的数字转换为其绝对值：\n\n```c\nint get_abs(void)\n\
  {\n    char num[80];\n    gets(num);\n    return abs(atoi(num));\n}\n```\n\n###\
  \ 相关函数\n\n`fabs()`\n\n## assert\n\n```c\n#include <assert.h>\nvoid assert(int *exp);\n\
  ```\n\n`assert()` 宏定义在其头文件 `<assert.h>` 中，如果表达式 `exp` 求值为零，则它会将错误信息写入 `stderr` 然后终止程序执行。否则，`assert()`\
  \ 什么都不做。\n\n尽管确切输出是由实现定义的，但许多编译器使用类似以下的消息：\nAssertion failed: `<expression>`, `file\
  \ `<file>`, `line `<linenum>`.\n\n对于 C99，消息还将包含包含 `assert()` 的函数名称。\n\n`assert()`\
  \ 宏通常用于帮助验证程序是否运行正常，表达式的设计方式是使其求值为零。（注：原文中此处存在大量重复的段落，此处已整合核心逻辑说明）。\n\n\n\n\n\n\
  `atol()` 函数将 `str` 指向的字符串转换为 `long int` 值。该字符串必须包含一个有效的整数。如果不是这样，则返回的值是未定义的。\n\n\
  该数字可以通过任何不能作为整数部分的字符终止。这包括空格、标点符号和字符。这意味着，如果调用 `atol()` 时传入 \"123.23\"，将返回长整型值 `123L`，并忽略\
  \ `\".23\"`。\n\n### 示例\n\n此程序读取两个长整型并显示它们的和：\n\n```c\n#include <stdlib.h>\n#include\
  \ <stdio.h>\n\nint main(void)\n{\n    char num1[80], num2[80];\n    printf(\"Enter\
  \ first: \");\n    gets(num1);\n    printf(\"Enter second: \");\n    gets(num2);\n\
  \    printf(\"The sum is: %ld.\", atol(num1)+atol(num2));\n    return 0;\n}\n```\n\
  \n### 相关函数\n\n`atof()`, `atoi()`, 和 `atoll()`\n\n## atoll\n\n```c\n#include <stdlib.h>\n\
  long long int atoll(const char *str);\n```\n\n`atoll()` 是 C99 添加的。`atoll()` 函数将\
  \ `str` 指向的字符串转换为 `long long int` 值。其他方面与 `atol()` 类似（注：此处原文应为 atol）。\n\n### 相关函数\n\
  \n`atof()`, `atoi()`, 和 `atol()`\n\n## bsearch\n\n```c\n#include <stdlib.h>\nvoid\
  \ *bsearch(const void *key, const void *buf, size_t *num, size_t *size, int (*compare)(const\
  \ void *, const void *));\n```\n\n`bsearch()` 函数对 `buf` 指向的有序数组进行二分查找，并返回指向与 `key`\
  \ 匹配的第一个成员的指针。数组元素数量由 `num` 指定，每个元素的大小（字节）由 `size` 。\n\n`compare` 指向的函数用于将数组中的元素与\
  \ key 进行比较。`compare` 函数的格式必须如下：\n\n```c\nint func_name(const void *arg1, const void\
  \ *arg2);\n```\n\n它必须按照下表描述返回返回值：\n\n| 比较 | 返回值 |\n| :--- | :--- |\n| `arg1` 小于\
  \ `arg2` | 小于零 |\n| `arg1` 等于 `arg2` | 零 |\n| `arg1` 大于 `arg2` | 大于零 |\n\n数组必须按升序排列，最低地址包含最小元素。如果数组不包含该\
  \ key，则返回空指针。\n\n### 示例\n\n以下程序读取从键盘输入的字符，并判断其是否属于字母表：\n\n```c\n#include <stdlib.h>\n\
  #include <ctype.h>\n#include <stdio.h>\n\nchar *alpha = \"abcdefghijklmnopqrstuvwxyz\"\
  ;\nint comp(const void *ch, const void *s);\n\nint main(void)\n{\n    char ch;\n\
  \    char *p;\n    printf(\"Enter a character: \");\n    ch = getchar();\n    ch\
  \ = tolower(ch);\n    p = (char *) bsearch(&ch, alpha, 26, 1, comp);\n    if(p)\
  \ printf(\" %c is in alphabet\\n\", *p);\n    else printf(\"is not in alphabet\\\
  n\");\n    return 0;\n}\n\n/* 比较两个字符。 */\nint comp(const void *ch, const void *s)\n\
  {\n    return *(char *)ch - *(char *)s;\n}\n```\n\n### 相关函数\n\n`qsort()`\n\n## div\n\
  \n```c\n#include <stdlib.h>\ndiv_t div(int numerator, int denominator);\n```\n\n\
