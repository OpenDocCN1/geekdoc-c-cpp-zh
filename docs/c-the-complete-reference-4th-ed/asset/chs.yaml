  | `<ctype.h>` | 字符处理 |\n| `<errno.h>` | 错误报告 |\n| `<float.h>` | 定义依赖于实现的浮点数限制 |\n\
  | `<limits.h>` | 定义各种依赖于实现的限制 |\n| `<locale.h>` | 支持本地化 |\n| `<math.h>` | 数学库用到的各种定义\
