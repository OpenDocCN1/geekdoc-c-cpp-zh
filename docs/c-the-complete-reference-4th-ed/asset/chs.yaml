  \n# 结构体指针\n\nC 允许指向结构体的指针，就像它允许指向任何其他类型的对象一样。然而，结构体指针有一些特殊之处，将在下文中描述。\n\n第 189 页\n\
  \n## 声明结构体指针\n\n与其他指针一样，结构体指针是通过在结构体变量名前放置 `*` 来声明的。例如，假设之前定义的结构 `addr`，以下代码将 `addr_pointer`\
  \ 声明为该类型数据的指针：\n\n```c\nstruct addr *addr_pointer;\n```\n\n## 使用结构体指针\n\n结构体指针有两个主要用途：使用引用传递将结构体传递给函数，以及创建依赖于动态分配的链表和其他动态数据结构。本章涵盖第一种用途。\n\
  \n将除最简单的结构体以外的所有结构体传递给函数有一个主要的缺点：在执行函数调用时，将结构体推入栈所需的开销。（回想一下，参数是通过栈传递给函数的。）对于成员较少的简单结构体，这种开销并不大。然而，如果结构体包含许多成员，或者其某些成员是数组，运行时性能可能会下降到不可接受的水平。解决此问题的方法是传递指向结构体的指针。\n\
  \n当指向结构体的指针传递给函数时，只有结构体的地址被推入栈中。这使得函数调用非常快。在某些情况下，第二个优点是传递指针使得函数能够修改作为参数的结构体的内容。\n\
  \n要找到结构体变量的地址，在结构体名称之前放置 `&` 运算符。例如，给定以下片段：\n\n```c\nstruct bal {\n    float balance;\n\
  \    char name[80];\n} person;\n\nstruct bal *p; /* 声明一个结构体指针 */\n```\n\n这将结构体 `person`\
  \ 的地址放入指针 `p` 中：\n\n```c\np = &person;\n```\n\n要使用指向该结构体的指针访问结构的成员，必须使用 `->` 运算符。例如，这引用了\
  \ `balance` 字段：\n\n```c\np->balance\n```\n\n第 190 页\n\n`->` 通常被称为*箭头运算符*，由减号后跟大于号组成。当你通过指向结构体的指针访问结构体成员时，箭头用于代替点运算符。\n\
