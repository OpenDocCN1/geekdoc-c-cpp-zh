  \ to);\nflight[f_pos].distance = dist;\nflight[f_pos].skip = 0;\nf_pos++;\n}\nelse\
  \ printf(\"Flight database full.\\n\");\n}\n```\n\n遵循 AI 的精神，将数据库想视为包含事实。要开发的程序将使用这些事实来得出解决方案。为此此，\n\
  \n第 615 页\n\n`char skip;` /* 用于回溯\n\nstruct FL flight[MAX]; /* 数据库结构数组\n\n`int f_pos\
  \ = 0;` /* 航班数据库中的项数\n\n`int find_pos = 0;` /* 搜索航班数据库的索引\n\n单个条目通过函数 `assert_flight()`\
  \ 被放入数据库，而 `setup()` 初始化了所有的航班信息。全局变量 `f_pos` 存储数据库中最后一个项的索引。\n\n这些例程显示在此：\n\n```c\n\
  void setup(void)\n{\nassert_flight(\"New York\", \"Chicago\", 1000);\nassert_flight(\"\
