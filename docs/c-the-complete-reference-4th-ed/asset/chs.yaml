  }\nreturn NULL; /* 未匹配 */\n}\n```\n\n从单向链表中删除项是直观的。与插入一样，有三种情况：删除第一个项、删除中间的项以及删除最后一个项。图\
  \ 22-4 显示了这些操作。\n\n接后的函数从 `address` 类型结构体的列表中删除给定的项：第 540 页\n\n```c\nvoid sldelete(\n\
  struct address *p, /* 前一个项 */\n```\n\n\n\n\n```c\nstruct address *i, /* item to\
