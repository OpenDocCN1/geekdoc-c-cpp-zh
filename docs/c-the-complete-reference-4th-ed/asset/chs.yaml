  \n要读取整数，使用 `%d` 或 `%i` 说明符。要读取以标准计数法或科学计数法表示的浮点数，使用 `%e`、`%f` 或 `%g`。（C99 还包含了 `%a`，它可以读取浮点数。）\n\
  \n你可以分别使用 `%o` 和 `%x` 格式命令通过 `scanf()` 读取八进制或十六进制形式的整数。`%x` 可以是大写或小写。无论如何，都可以输入\
  \ A 到 F 的字母。\n\n第 222 页\n\n| 代码 | 含义 |\n| :--- | :--- |\n| `%a` | 读取浮点值（仅 C99）。\
