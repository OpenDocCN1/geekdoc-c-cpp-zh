  \ 时传入空指针，且存在命令处理器，则它将返回非零值；否则，将返回零。（在非托管环境中执行的 C 代码将无法访问命令处理器。）`system()` 的返回值由实现定义，但通常情况下，如果命令成功执行则返回零，非零返回值表示错误。\n\
  \n### *示例*\n\n使用 Windows 操作系统，此程序将显示当前工作目录的内容：\n\n```c\n#include <stdlib.h>\n\n\
  int main(void)\n{\n    return system(\"dir\");\n}\n```\n\n### 相关函数\n\n`exit()`\n\
  \n### `va_arg, va_copy, va_start, and va_end`\n```c\n#include <stdarg.h>\n\ntype\
  \ va_arg(va_list *argptr, type);\nvoid va_copy(va_list *target, va_list *source);\n\
  void va_end(va_list *argptr);\nvoid va_start (va_list *argptr, *last_parm);\n```\n\
  `va_copy()` 由 C99 标准引入。\n\n`va_arg()`、`va_start()` 和 `va_end()` 宏共同工作，允许向函数传递变数量的参数。接受变数量参数的函数最常见的例子是\
  \ `printf()`。`va_list` 类型由 `<stdarg.h>` 定义。\n\n创建可以接收变数量参数的函数的通用步骤如下：该函数在变长参数列表之前至少有一个已知参数，但也可以有多个。位于最右侧的已知参数被称为\
  \ `last_parm`。在 `va_start()` 时，`last_parm` 的名称被用作调用 `va_start()` 的第二个参数。在访问任何变长参数之前，必须通过调用\
  \ `va_start()` 初始化参数指针 `argptr`。之后，通过调用 `va_arg()` 返回参数，其中 `type` 是下一个参数的类型。最后，一旦所有参数都已读取，在从函数返回之前，必须调用\
  \ `va_end()` 以确保栈被正确恢复。如果没有调用 `va_end()`，程序极可能会崩溃。\n\n`va_copy()` 宏将 `source` 中的参数列表拷贝到\
  \ `target` 中。\n\n### *示例*\n\n此程序使用 `sum_series()` 返回一系列数字之和。第一个参数包含后续参数的数量计数。在此例中，程序计算了级数中前五个元素之和：\n\
  \n1 + 1 + 1 + 1 + 1 + ... + 2 + 4 + 8 + 16 + 2N\n\n显示的输出为 **0.968750**。\n\n```c\n\
  #include <stdio.h>\n#include <stdarg.h>\n\ndouble sum_series(int num, ...);\n\n\
  /* 变长参数示例 - 计算级数之和。 */\nint main(void)\n{\n    double d;\n    d = sum_series(5,\
  \ 0.5, 0.25, 0.125, 0.0625, 0.03125);\n    printf(\"Sum of series is %f.\\n\", d);\n\
  \    return 0;\n}\n\ndouble sum_series(int num, ...)\n{\n    double sum=0.0, t;\n\
  \    va_list argptr;\n    /* 初始化 argptr */\n    va_start(argptr, num);\n    /* 计算级数\
  \ */\n    for( ; num; num--) {\n        /* 获取参数 */\n        t = va_arg(argptr, double);\n\
  \        sum += t;\n    }\n    /* 结束 */\n    va_end(argptr);\n    return sum;\n\
  }\n```\n\n### 相关函数\n\n`vprintf()`\n\n`wcstombs`\n```c\n#include <stdlib.h>\n\nsize_t\
  \ wcstombs(char *out, const wchar_t *in, size_t size);\n```\n`wcstombs()` 函数将 `in`\
  \ 指向的宽字符数组转换为多字节等效形式，并将结果放入 `out` 指向的数组中。仅转换 `size` 字节的 `in`。转换在遇到空终止符前停止。\n\n如果成功，`wcstombs()`\
  \ 返回写入的字节数。如果失败，返回 -1。\n\n### 相关函数\n\n`strtoull()`\n\n`wctomb`\n```c\n#include <stdlib.h>\n\
  \nint wctomb(char *out, wchar_t in);\n```\n`wctomb()` 函数将 `in` 转换为多字节等效形式，并将结果放入\
  \ `out` 指向的对象中。`out` 指向的数组至少长 `MB_CUR_MAX` 个字符。\n\n如果成功，`wctomb()` 返回多字节字符包含的字节数。如果失败，返回\
  \ -1。\n\n如果 `out` 为空，当该多字节字符具有状态相关编码时，`wctomb()` 返回非零；否则返回零。\n\n### 相关函数\n\n`mbstowc()`\n\
