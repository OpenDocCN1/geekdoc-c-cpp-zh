  \ 并运行。解决方案是：\n\n纽约到多伦多到洛杉矶\n距离为 2600。\n\n这是最优解决方案。图 25-6 显示了广度优先搜索的路径。\n\n***广度优先搜索分析***\n\
  \n在这个例子中，广度优先搜索通过不回溯就找到了第一个解决方案，其表现非常好。事实上，这也是最优解决方案。事实上，广度优先搜索找到的前三个解决方案都是最好的。然而，请记住，这个结果不能推广到其他情况，因为路径取决于信息在计算机中的物理组织。然而，这个例子说明了深度优先搜索和广度优先搜索有多巨大的差异。\n\
  \n![](img/index-657.jpg)\n\n// 第 627 页\n图 25-6：广度优先搜索的路径。\n\n**添加启发式**\n\n你可能已经猜到，深度优先和广度优先搜索程序都是盲目的。它们是完全依赖于以下寻找解决方案的方法：\n\
  \n例如，想象你在森林中迷路了，需要喝水。森林非常茂密，你看不清远方，树也太大，无法爬上去观察四周。\n\n// 第 628 页\n然而，你知道河流、溪流和池塘最可能位于谷地；动物经常会通往它们饮水点的小径；当你靠近水时，可以“闻”到它；而且你可以听到流水的声。\n\
  \n\n\n\n所以，你首先开始向下走，因为水不太可能向上流。接下，你遇到了一条同样向走的鹿小径。你知道这可能通往水源，于是你顺着它走。你开始听到左侧传来轻微的奔流声。你知道这可能是水，于是你谨慎地朝那个方向移动。随着你的移动，你开始感觉到空气中的湿度在增加；你闻到了水味。最后，你找到了一条小溪并喝了水。正如你所看到的，启发式信息虽然不精确也不保证成功，但它增加了搜索方法快速、最优或两者兼顾地找到目标的概率。简而言之，它增加了快速成功的机会。\n\
  \n你可能认为启发式信息可以很容易包含在为特定应用设计的程序中，但创建通用的启发式搜索是不可能的。事实并非如此。大多数情况下，启发式搜索方法基于最大化或最小化问题的某个方面。事实上，我们将看到的两种启发式方法使用了相反的启发式，并产生不同的结果。这两种搜索将建立在深度优先搜索例程的基础上。\n\
  \n## 爬山搜索 (The Hill-Climbing Search)\n\n在从纽约到洛杉矶的航班调度问题中，乘客可能想要最小化两个可能的限制。第一个是必须进行的转机次数。第二个是路线的长度。记住，最短路线并不意味着意味着转机最少。试图将转机次数最少的路线作为第一个解决方案的搜索算法使用了如下启发式方法：飞行长度越长，旅行者越接近目的地的可能性越大；因此，转机次数降至最低。\n\
  \n在人工智能的语言中，这被称为 `hill climbing`（爬山）。爬山算法的下一个步骤是选择看起来离目标最近的节点（即距离当前位置最远的节点）。它的名字源于一个比喻：一个登山者在半山腰的黑暗中迷路。假设登山者的营地在山顶，即使在黑暗中，登山者也知道向上的每一步都是朝着正确的方向走的。\n\
  \n仅利用航班调度知识库中包含的信息，以下是将爬山启发式方法整合到路由程序中的方法：选择距离当前位置尽可能远的转机航班，希望它能更接近目的地。要做到这一点，请如下所示修改\
  \ `find()` 例程：\n\n```c\n/* Given from, find the farthest away \"anywhere\". */\n\
  \nint find(char *from, char *anywhere)\n{\n    int pos, dist;\n    pos=dist = 0;\n\
  \    find_pos = 0;\n\n    while(find_pos < f_pos) {\n        if(!strcmp(flight[find_pos].from,\
