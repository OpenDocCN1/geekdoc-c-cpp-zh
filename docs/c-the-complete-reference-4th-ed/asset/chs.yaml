  \n`atom()` 函数查找整数常量或变量、函数或字符常数的值。源代码中可能存在两种函数：用户定义的或库。如果遇到用户定义的函数，解释器将按顺序执行其代码以确定返回值。（函数的调用将在下一节中讨论。）然而，如果该函数是库函数，首先通过\
  \ `internal_func()` 函数查找其地址，然后通过其接口函数进行访问。库函数及其接口函数的地址存储在所示的 `intern_func` 数组中：\n\
  \n```c\n/* “标准库”函数在这里声明，以便\n它们可以被放入随后的内部函数表中。\n*/\nint call_getche(void), call_putch(void);\n\
  int call_puts(void), print(void), getnum(void);\nstruct intern_func_type {\n  char\
  \ *f_name; /* 函数名 */\n  int (*p)(); /* 指向函数的指针 */\n} intern_func[] = {\n  \"getche\"\
  , call_getche,\n  \"putch\", call_putch,\n  \"puts\", call_puts,\n  \"print\", print,\n\
  \  \"getnum\", getnum,\n  \"\", 0 /* 空终止结束列表 */\n};\n```\n\n如你所见，Little C 只知道几个库函数，但你很快就会看到添加可能需要的任何其他函数是多么简单。（实际的接口函数包含在一个单独文件中，将在“Little\
  \ C 库函数”章节中讨论。）\n\n关于表达式解析器文件中例程的最后一点是：正确解析 C 语言有时需要所谓的*单 token 预视*（one-token lookahead）。例如，给定\n\
  \n```\nalpha = count();\n```\n\n为了让 Little C 知道 `count` 是一个函数而不是变量，它必须同时读取 `count`\
  \ 和下一个 token，在这种情况下是一个括号。然而，如果语句是\n\n```\nalpha = count * 10;\n```\n\n那么 `count`\
  \ 之后的下一个 token 就是 `*`，它需要返回到输入流以备稍后使用。由于这个原因，表达式解析器文件包含了 `putback()` 函数，该函数会将最后读取的\
  \ token 返回到输入流。\n\n表达式解析器文件中可能存在你现在无法完全理解的函数，但随着你对 Little C 的进一步了解，它们的操作将变得清晰明朗。\n\
  \n# Little C 解释器\n\n在本节中，将开发 Little C 解释器的核心。在直接跳到解释器的实际代码之前，理解解释器是如何运作的将会有帮助。在许多方面，解释器的代码比表达式解析器更容易理解，因为从概念上讲，解释\
  \ C 程序的行为可以归纳为以下算法：\n\n```\nwhile(tokens_present)\n{\n  get\n  next\n  token;\n\
  \  take\n  appropriate\n  action;\n}\n```\n\n与表达式解析器相比，这个算法看起来可能简单得不可置信，但这恰确实是所有解释器所做的事情！需要注意的是，“采取适当行动”这一步可能也涉及从输入流中读取额外的\
  \ token。为了理解该算法实际上如何工作，让我们手动解释以下 C 代码片段：\n\n```\nint a;\na = 10;\nif(a < 100) printf(\"\
  %d\", a);\n```\n\n按照算法，读取第一个 token，即 `int`。针对此 token 的适当行动是读取下一个 token，以确定正在声明的变量的名称（在本例中为\
  \ `a`），然后将其存储起来。下一个 token 是结束该行的分号。这里的适当行动是忽略它。接着，返回获取另一个 token。这个 token 是 `a`。由于该行不是以关键字开头，它必须是一个\
  \ C 表达式。因此，适当的行动是使用解析器求值表达式。这个过程消耗了该行所有的 token。最后，我们读取 `if`。这标志着 `if` 语句的开始。适当的行动是处理\
  \ `if`。带着这个基础算法，让我们构建解释器。\n\n## 解释器预处理\n\n在解释器实际执行程序之前，必须执行一些任务。\n\n设计为解释而非编译的语言的一个特点是，它们从源代码开始执行，并在到达源代码末尾时结束。这是\
  \ BASIC 的工作方式。然而，C（或任何其他结构化语言）并不适用于这种方法，原因有三：首先，所有 C 程序都从 `main()` 函数开始。并不要求 `main()`\
  \ 是第一个函数，因此需要知道 `main()` 函数在源代码中的位置以便从那里开始执行。（记住，全局变量可能在前面，所以即使它是第一个函数，也不一定是第一行代码。）必须设计某种方法允许执行从正确的地方开始。\n\
  \n另一个必须解决的问题是，所有的全局变量必须在 `main()` 开始执行之前已知并处理。全局变量声明语句永远由解释器执行，因为它们位于函数外部。（记住：一旦开始执行，C\
  \ 的可执行代码都位于函数内部内部。）\n\n最后，出于执行速度，知道程序中定义的每个函数的位置是重要的（尽管技术上并非必须），这样调用函数就可以尽可能快。如果不执行这一步，每次调用函数时都需要对源代码进行大量的顺序搜索以找到入口。\n\
  \n解决这些问题的方案是*解释器预处理*（interpreter prescan）。预处理器（有时也被称为，尽管它们与 C 编译器的预处理器并没有相似之处）被所有商业解释器使用，无论它们解释的是什么语言。预处理器在程序执行之前读取源代码，并执行在执行之前可以完成的任务。在我们的\
  \ Little C 解释器中，它执行重要的工作：首先，它找到并记录所有自定义函数的位置，包括 `main()`；其次，它找到并为所有全局变量分配空间。在 Little\
  \ C 解释器中，执行预处理的称为 `prescan()`。所示如下：\n\n```c\n/* 程序中所有函数的位置并存储全局变量。 */\nvoid prescan(void)\n\
  {\n  char *p, *tp;\n  char temp[32];\n  int datatype;\n  int brace = 0; /* 当为 0\
  \ 时，这个变量告诉我们\n\n当前源代码位置位于任何函数外部。 */\n}\n```\n\n\n\n\n\n```c\np = prog;\n\nfunc_index\
  \ = 0;\n\ndo {\n    while(brace) { /* 跳过函数内部的代码 */\n        get_token();\n     \
  \   if(*token == '{') brace++;\n        if(*token == '}') brace--;\n    }\n    tp\
  \ = prog; /* 保存当前位置 */\n    get_token();\n    /* 全局变量类型或函数返回值 */\n    if(tok==CHAR\
  \ || tok==INT) {\n        datatype = tok; /* 保存数据类型 */\n        get_token();\n \
  \       if(token_type == IDENTIFIER) {\n            strcpy(temp, token);\n     \
  \       get_token();\n            if(*token != '(') { /* 必须是全局变量 */\n          \
  \      prog = tp; /* 返回到声明处 */\n                decl_global();\n            }\n\
  \            else if(*token == '(') { /* 必须是函数 */\n                func_table[func_index].loc\
  \ = prog;\n                func_table[func_index].ret_type = datatype;\n       \
  \         strcpy(func_table[func_index].func_name, temp);\n                func_index++;\n\
  \                while(*prog != ')') prog++;\n                prog++;\n        \
  \        /* 现在 prog 指向函数的\n                左大括号 */\n            }\n            else\
  \ putback();\n        }\n    }\n    else if(*token == '{') brace++;\n} while(tok\
  \ != FINISHED);\nprog = p;\n}\n```\n\n### 第 747 页\n\n`prescan()` 函数的工作原理如下：每当遇到一个左大括号时，`brace`\
  \ 就会加 1。每当读取到一个右大括号时，`brace` 就会减 1。因此，只要 `brace` 大于零，当前标记就是从函数内部读取的。然而，如果在发现变量时\
  \ `brace` 等于零，预扫描器就知道它必须是一个全局变量。同样地，如果当 `brace` 等于零时遇到函数名，那么它必须是该函数的定义。（记住，Little\
  \ C 不支持函数原型。）\n\n全局变量由 `decl_global()` 存储在名为 `global_vars` 的全局变量表中，如下所示：\n\n```c\n\
  /* 一个包含这些结构体的数组将保存与\n全局变量相关的信息。\n*/\nstruct var_type {\n    char var__name[ID_LEN];\n\
  \    int v_type;\n    int value;\n} global_vars[NUM_GLOBAL_VARS] ;\nint gvar_index;\
  \ /* 全局变量表的索引 */\n/* 声明一个全局变量 */\nvoid decl_global(void)\n{\n    int vartype;\n\
  \    get_token(); /* 获取类型 */\n    vartype = tok; /* 保存变量类型 */\n    do { /* 处理逗号分隔的列表\
  \ */\n        global_vars[gvar_index].v_type = vartype;\n        global_vars[gvar_index].value\
  \ = 0; /* 初始化为 0 */\n        get_token(); /* 获取名称 */\n        strcpy(global_vars[gvar_index].var_name,\
  \ token);\n        get_token();\n        gvar_index++;\n    } while(*token == ',');\n\
  \    if(*token != ';') sntx_err(SEMI_EXPECTED);\n}\n```\n\n整数 `gvar_index` 持有数组中下一个空元素的位置。\n\
  \n### 第 748 页\n\n每个用户定义函数的位置都存入 `func_table` 数组中，如下：\n\n```c\nstruct func_type {\n\
  \    char func_name[ID_LEN];\n    int ret_type;\n    char *loc; /* 文件中入口点的位置 */\n\
  } func_table[NUM_FUNC];\nint func_index; /* 函数表的索引 */\n```\n\n`func_index` 变量持有表中下一个空位置的索引。\n\
  \n### main() 函数\n\nLittle C 解释器的 `main()` 函数如下所示，它负责加载源代码、初始化全局变量、调用 `prescan()`、为调用\
  \ `main()` 准备解释器状态（热身\"),然后执行 `call()`，从而开始程序的执行。`call()` 函数的操作将在稍后进行讨论。\n\n```c\n\
  int main(int argc, char *argv[])\n{\n    if(argc != 2) {\n        printf(\"Usage:\
  \ littlec <filename>\\n\");\n        exit(1);\n    }\n    /* 为程序分配内存 */\n    if((p_buf\
  \ = (char *) malloc(PROG_SIZE))==NULL) {\n        printf(\"Allocation Failure\"\
  );\n        exit(1);\n    }\n    /* 加载要执行的程序 */\n    if(!load_program(p_buf, argv[1]))\
  \ exit(1);\n    if(setjmp(e_buf)) exit(1); /* 初始化长跳转缓冲区 */\n    gvar_index = 0;\
  \ /* 初始化全局变量索引 */\n    /* 将程序指针指向程序缓冲区开头 */\n    prog = p_buf;\n    prescan(); /*\
  \ 查找程序中所有函数\n    第 749 页\n    和全局变量的位置 */\n    lvartos = 0; /* 初始化局部变量栈索引 */\n \
  \   functos = 0; /* 初始化 CALL 栈索引 */\n    /* 设置调用 main() */\n    prog = find_func(\"\
  main\"); /* 查找程序起点 */\n    if(!prog) { /* 程序中错误或缺失 main() 函数 */\n        printf(\"\
  main() not found.\\n\");\n        exit(1);\n    }\n    prog--; /* 回到左括号 ( */\n \
  \   strcpy(token, \"main\");\n    call(); /* 调用 main() 开始解释 */\n    return 0;\n\
  }\n```\n\n### interp_block() 函数\n\n`interp_block()` 函数是解释器的核心。它是根据输入流中的下一个标记来决定要采取的操作的函数。（此处重复）该函数的设计目的是根据输入流中的下一个标记来决定要采取的操作。\n\
  \n```c\nvoid interp_block(void)\n    int value;\n    char block = 0;\n    do {\n\
  \        token_type = get_token();\n        第 750 页\n        if(token_type == IDENTIFIER)\
  \ {\n            putback();\n            eval_exp(&value);\n        }\n        else\
  \ if(*token == '{') {\n            block = 1;\n        }\n        // ...\n    }\
  \ while (tok != FINISHED && block);\n```\n\n### 第 751 页\n\n除了调用 `exit()` 等函数外，C\
  \ 程序在遇到 `main()` 中的最后一个右大括号（或 `return`）时结束——而不一定是在源代码的最后一行。这就是为什么 `interp_block()`\
  \ 只执行语句或代码块，而不是整个程序的原因之一。此外，从概念上讲，C 是由代码块组成的。因此，每当遇到一个新的代码块时，`interp_block()` 都会被调用。这包括函数块以及由\
  \ `if` 等各种 C 语句开启的代码块。\n\n\n\n\n最后，如果 token 是一个关键字，则执行 `switch` 语句，调用相应的例程来处理该语句。`get_token()`\
