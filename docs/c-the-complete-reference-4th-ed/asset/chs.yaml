  \n### 输出对齐\n\n默认情况下，所有输出都是右对齐的。你可以通过在 `%` 之后直接放置负号来强制输出左对齐。例如，`%-10d` 在 10 个字符字段内左对齐。下面的程序演示了左对齐：\n\
