  \n`atexit()`, `atoll()`, 和 `atol()`\n\n\n\n\n`longjmp()` 函数导致程序执行恢复到上一次调用 `setjmp()`\
  \ 的点。因此，`longjmp()` 和 `setjmp()` 提供了一种在函数之间跳转的手段。注意这需要包含头文件 `<setjmp.h>`。\n\n`longjmp()`\
  \ 函数的运行机制是将堆栈重置为 `envbuf` 中描述的状态，而该状态必须在之前的调用 `setjmp()` 时被设置过。这会导致程序执行从 `setjmp()`\
  \ 调用之后的语句开始继续运行。也就是说，计算机被“欺骗”了，认为它从未离开过调用 `setjmp()` 的函数。（用一个比较形象的解释，`longjmp()`\
  \ 函数跨越了时间和以及（内存）空间，“扭跃”到程序中之前的某个点，而不需要执行正常的函数返回过程。）\n\n类型为 `jmp_buf` 的缓冲区 `evnbuf`\
  \ 定义在头文件 `<setjmp.h>` 中。再次，该缓冲区在调用 `longjmp()` 之前必须通过调用 `setjmp()` 进行设置。\n\n`status`\
  \ 的值将成为 `setjmp()` 的返回值，并用于确定长跳转的来源。唯一不允许的值是零。当 `setjmp()` 由你的程序直接调用时，它返回零，而不是通过执行\
  \ `longjmp()` 间接调用。\n\n第 454 页\n\n到目前，`longjmp()` 最常用的用法是在发生错误时从深度嵌套的例程返回。\n\n###\
  \ 示例\n\n此程序打印 1 2 3：\n\n```c\n#include <setjmp.h>\n#include <stdio.h>\n\njmp_buf\
  \ ebuf;\n\nvoid f2(void);\n\nint main(void)\n{\n    int i;\n    printf(\"1 \");\n\
  \    i = setjmp(ebuf);\n    if(i == 0) {\n        f2();\n        printf(\"This will\
  \ not be printed.\");\n    }\n    printf(\"%d\", i);\n    return 0;\n}\n\nvoid f2(void)\n\
  {\n    printf(\"2 \");\n    longjmp(ebuf, 3);\n}\n```\n\n### 相关函数\n\n`setjmp()`\n\
