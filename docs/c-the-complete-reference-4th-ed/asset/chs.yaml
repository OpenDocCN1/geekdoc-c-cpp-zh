  \    if(i==*last && p) *last = p;\n}\n```\n\nTeam-Fly®\n\n![](img/index-572_1.jpg)\n\
  \n第 541 页\n图 22-4：从单链表中删除一个项\n\n`delete()` 必须接收指向被删除项、链中该项的前一个项，以及列表第一个项和最后一个项的指针。如果要移除第一个项，则前一个指针必须为\
  \ `null`。当其中一个指针指向的项被删除时，该函数会自动更新 `start` 和 `last`。\n\n单链表有一个主要的缺点，限制了它的广泛使用：无法反向读取列表。由于这个原因，通常使用双向链表。\n\
  \n### 双向链表\n\n双向链表由以及指向下一个项目以及前一个项目的链接组成。图 22-5 显示了这些链接的排列方式。\n\n拥有两个链接而不是一个链接有几个优势。也许最重要的是列表可以向任一方向读取。这简化了列表管理，使得插入和删除变得更加容易。它还允许用户向任一方向扫描列表。另一个优势仅在发生某种故障时才有意义。由于可以使用正向链接或反向链接读取整个列表，如果其中一个链接失效，可以使用另一个链接来重建列表。\n\
  \n![](img/index-573_1.png)\n\n第 542 页\n图 22-5：双向链表。\n\n新元素可以通过三种方式插入到双向链表中：插入一个新的首元素、在中间插入、以及插入一个新的末尾元素。这些操作如图\
  \ 22-6 所示。\n\n构建双向链表与构建单链表相似，区别在于维护了两个链接。因此，结构体必须有容纳这两个链接的空间。再次使用邮件列表示例，你可以像这里所示修改\
  \ `address` 结构以适应两个链接：\n\n```c\nstruct address {\n    char name[40];\n    char street[40];\n\
  \    char city[20];\n    char state[3];\n    char zip[11];\n    struct address *next;\n\
  \    struct address *prior;\n} info;\n```\n\n使用 `address` 作为基本数据项，以下函数 `dlstore()`\
  \ 构建了一个双向链表：\n\n```c\nvoid dlstore(struct address *i, struct address **last)\n{\n\
  \    if(!*last) *last = i; /* 是列表中的第一个项 */\n    else (*last)->next = i;\n    i->next\
  \ = NULL;\n    i->prior = *last;\n    *last = i;\n}\n```\n\n![](img/index-574_1.jpg)\n\
  \n第 543 页\n图 22-6：双向链表的操作。\n\n`dlstore()` 函数将每个新条目放在列表的末尾。你必须调用它并传入指向要存储数据的指针以及指向列表末尾的指针，后者在第一次调用时必须为\
  \ `null`。\n\n第 544 页\n\n与单链表一样，双向链表可以通过一个函数构建，将每个元素存储在列表的特定位置，而不是总是将每个新项放在末尾。这里显示的函数\
  \ `dls_store()` 创建了一个按升序排列的列表：\n\n```c\n/* 按排序顺序创建一个双向链表。 */\nvoid dls_store(\n\
  \    struct address *i, /* 新元素 */\n    struct address **start, /* 列表中的第一个元素 */\n\
  \    struct address **last /* 列表中的最后一个元素 */\n)\n{\n    struct address *old, *p;\n\
  \    if(*last==NULL) { /* 列表中的第一个元素 */\n        i->next = NULL;\n        i->prior\
  \ = NULL;\n        *last = i;\n        *start = i;\n        return;\n    }\n   \
  \ p = *start; /* 从列表顶部开始 */\n    old = NULL;\n    while(p) {\n        if(strcmp(p->name,\
  \ i->name) < 0) {\n            old = p;\n            p = p->next;\n        }\n \
