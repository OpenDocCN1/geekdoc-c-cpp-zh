  assert_flight(\"New York\", \"Denver\", 1900);\nassert_flight(\"Toronto\", \"Calgary\"\
  , 1500);\nassert_flight(\"Toronto\", \"Los Angeles\", 1800);\nassert_flight(\"Toronto\"\
  , \"Chicago\", 500);\nassert_flight(\"Denver\", \"Urbana\", 1000);\nassert_flight(\"\
