  \ 0;\n}\nreturn *p;\n}\n```\n\n第 535 页\n\n## 链表\n\n队列和栈共享两个特征：它们对存储在其中的数据访问都有严格的规则，并且检索操作在本质上是消耗性的。换句话说，访问栈或队列中的项需要将其移除，除非该项被存储在其他地方，否则它会被销毁。此外，栈和队列都使用连续的内存区域。与栈或队列不同，`linked\
  \ list`（链表）可以以灵活的方式访问，因为每条信息都带有一个指向链中下一个数据项的链接。此外，链表的检索操作不会从列表中移除并销毁项。事实上，你需要添加一个特定的删除操作来实现这一点。\n\
  \n链表可以是单向链表，也可以是双向链表。单向链表包含一个指向下一个数据项的链接。双向链表则包含指向列表中后一个元素和前一个元素的链接。你将根据你的应用使用这两种链表类型中的一种。\n\
  \n### 单向链表\n\n单向链表要求每条信息项都包含一个指向列表中下一个元素的链接。每个数据项通常由一个结构体组成，其中包含信息字段和一个链接指针。\n\n\
  从概念上讲，单向链表看起来如图 22-2 所示。\n\n基本上，构建单向链表有两种方法。一种是简单地将每个新项放在列表末尾。另一种是将项插入列表的特定位置——例如，按升序排序。你构建列表的方式决定了存储函数的代码编写方式。让我们从在末尾添加项来创建链表的简单情况开始。\n\
  \n存储在链表中的项通常由结构体组成，因为每个项都必须携带一个指向列表中下一个项的链接以及数据本身。因此，我们需要定义一个将在后续示例中使用的结构体。由于邮件列表通常存储在链表中，因此地址结构是一个很好的选择。邮件列表中每个元素的数据结构在这里定义如下：\n\
  \n```c\nstruct address {\nchar name[40];\nchar street[40];\nchar city[20];\nchar\
  \ state[3];\nchar zip[11];\nstruct address *next; /* 指向下一个地址的链接 */\n} info;\n```\n\
  \n![](img/index-568_1.png)\n\n第 537 页\n\n图 22-2 单向链表\n\n接下来显示的 `slstore()` 函数通过将每个新元素放在末尾来构建单向链表。它必须传递一个指向\
  \ `address` 类型结构体的指针（该结构体包含新条目），以及一个指向列表最后一个元素的指针。如果列表为空，则指向列表最后一个元素的指针必须为空。\n\n\
  ```c\nvoid slstore(struct address *i,\nstruct address **last)\n{\nif(!*last) *last\
  \ = i; /* 列表中的第一个项 */\nelse (*last)->next = i;\ni->next = NULL;\n*last = i;\n}\n\
  ```\n\n虽然你可以将使用 `slstore()` 函数创建的列表作为一个单独的操作进行排序，但在构建列表的同时通过将每个新项插入链的正确顺序来排序会更简单。此外，如果列表已经排序，那么通过将新项插入到其适当的位置来保持其排序将是有益的。你通过按顺序扫描列表直到找到适当的位置，在该点插入新条目，并根据需要重新排列链接来做到这一点。\n\
  \n在单向链表中插入项时可能会发生三种可能的情况。第一，它可能成为新的第一个项；第二，它可以位于两个其他项之间；第三，它可能成为最后一个元素。图 22-3 展示了每种情况下链接是如何发生变化的。\n\
  \n![](img/index-569_1.jpg)\n\n第 538 页\n\n图 22-3 向单向链表插入项\n\n```c\n/* 按排序存储。 */\n\
  void sl_store(struct address *i, /* 要存储的项 */\nstruct address **start, /* 列表起始 */\n\
  struct address **last) /* 列表结束 */\n{\nstruct address *old, *p;\np = *start;\nif(!*last)\
  \ { /* 列表中的项 */\ni->next = NULL;\n*last = i;\n*start = i;\nreturn;\n}\nold = NULL;\n\
  while(p) {\nif(strcmp(p->name, i->name) < 0) {\nold = p;\np = p->next;\n}\nelse\
  \ {\nif(old) { /* 在中间 */\nold->next = i;\ni->next = p;\nreturn;\n}\n}\ni->next =\
  \ p; /* 新的第一元素 */\n*start = i;\nreturn;\n}\n(*last)->next = i; /* 在末尾 */\ni->next\
