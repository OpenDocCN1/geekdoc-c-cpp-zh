  \ 256 4096\n17 289 4913\n18 324 5832\n19 361 6859\n\n### 精度格式符\n\n`精度格式符` 紧随最小字段宽度格式符（如果有的话）。它由一个点加一个整数组成。其确切含义取决于应用的数据类型。\n\
