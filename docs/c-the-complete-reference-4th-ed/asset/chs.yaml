  \n```c\n/* Sort Driver */\n#include <string.h>\n#include <stdio.h>\n#include <stdlib.h>\n\
  \nvoid bubble(char *items, int count);\n\nint main (void)\n{\n    char s[255];\n\
  \    printf(\"Enter a string:\");\n    gets(s);\n    bubble(s, strlen(s));\n   \
  \ printf(\"The sorted string is: %s.\\n\", s);\n    return 0;\n}\n```\n\n为了查看冒泡排序的工作原理，假设要排序的数组是\
  \ `dcab`。每一轮的操作显示如下：\n\n初始\nd c a b\n\n第 1 轮\na d c b\n\n第 2 轮\na b d c\n\n第 3 轮\n\
  a b c d\n\n在分析任何排序算法时，了解最好、平均和最坏情况下将执行多少次比较和交换是非常有用的。因为编译器优化、处理器差异以及实现细节会影响可执行代码的特性，我们不必纠结这些数量的精确值。相反，我们将集中在每个算法的总体效率上。\n\
  \n在冒泡排序中，比较次数始终是相同的，因为无论列表初始是否有序，两个 `for` 循环都会重复指定的次数。这意味着冒泡排序总是会执行\n\n`1/2( *n*\
  \ 2 –n*)`\n\n次比较，其中 `n` 是待排序元素的数量。这个公式的推导基于：外层循环执行 `n`–1 次，而内层循环平均执行 `n/2` 次。\n\n\
  这两个数字相乘，就得到了上述公式。\n\n注意上述公式中的 `n2` 项。冒泡排序被称为 `n-squared`（n 平方）算法，因为它的执行时间与所排序的元素数量的平方成正比。\n\
  \n坦率地说，当 `n-squared` 算法应用于大量元素时是低效的，因为执行时间随排序元素数量呈指数级增长。图 21-1 显示了执行时间如何随数组大小而增加。\n\
  \n对于冒泡排序，最好情况——一个已经排序的列表的交换次数为零。\n\n然而，平均情况和最坏情况的交换次数也是 `n-squared` 级别的。\n\n图 21-1：n2\
  \ 排序执行时间与数组大小的关系\n\n你可以尝试对冒泡排序进行微改进以试图加速它。例如，冒泡排序有一个特性：位于大一端的无序元素（例如 `dcab` 示例中的\
  \ \"a\"）可以在一次遍历中到达其正确位置，但位于小一端的错误元素（例如 \"d\"）上升到正确位置非常缓慢。这暗示了冒泡排序的一种改进方法。与其总是以相同的方向读取数组，不如交替反转遍历方向。这样一来，偏离位置较大的元素就能快速移动到其正确位置。这种版本的冒泡排序被称为*抖动排序*（shaker\
  \ sort），因为它赋予了数组一种抖动的效果。下面的代码展示了如何实现抖动排序。\n\n```c\n/* The Shaker Sort. */\nvoid\
  \ shaker(char *items, int count)\n{\n    register int a;\n    int exchange;\n  \
  \  char t;\n    do {\n        exchange = 0;\n        for(a=count-1; a > 0; --a)\
  \ {\n            if(items[a-1] > items[a]) {\n                t = items[a-1];\n\
  \                items[a-1] = items[a];\n                items[a] = t;\n       \
  \         exchange = 1;\n            }\n        }\n        for(a=1; a < count; ++a)\
  \ {\n            if(items[a-l] > items[a]) {\n                t = items[a-l];\n\
  \                items[a-1] = items[a];\n                items[a] = t;\n       \
  \         exchange = 1;\n            }\n        }\n    } while(exchange); /* 直到不再发生交换\
  \ */\n}\n```\n\n尽管抖动排序改进了冒泡排序，但它的执行仍然属于 `n-squared` 算法级别。这是因为比较次数没有改变，而交换次数只减少了相对较小的常数。抖动排序比冒泡排序好，但存在更好的排序算法。\n\
  \n### 选择选择排序\n\n*选择排序*（selection sort）选择值最低的元素并将其与第一个元素交换。\n\n然后，从剩余的 `n`–1 个元素中找到键最小的元素并与第二个元素交换，依此类推。交换一直持续到最后两个元素。例如，如果对数组\
  \ `dcab` 使用选择排序法，每一轮看起来像这样：\n\n初始\nd c a b\n\n第 1 轮\na c d b\n\n第 2 轮\na b d c\n\
  \n第 3 轮\na b c d\n\n下面的代码展示了选择排序。\n\n```c\n/* The Selection Sort. */\nvoid select(char\
  \ *items, int count)\n{\n    for(a=0; a < count-1; ++a) {\n        c = a;\n    \
  \    for(b=a+1; b < count; ++b) {\n            if(items[b] < items[c])\n       \
  \         c = b;\n        }\n        t = items[a];\n        items[a] = items[c];\n\
  \        items[c] = t;\n    }\n}\n```\n*(注：由于用户提供的原文中 `select` 代码块内容存在乱码/错误，此处根据“不翻译代码块”原则，直接保留原文中的内容。)*\n\
  \n\n\n对于海量数据，这会导致排序变得非常慢。事实上，在某些情况下，排序速度会慢到无法使用。不幸的是，“耗时三天的排序”这类恐怖故事往往是真实发生的。当排序耗时过长时，通常是底层算法的错。然而，第一反应通常是“让我们手动优化”，也许是使用汇语言。虽然手动优化有时能让程序速度提高常数倍，但如果底层算法效率低下，无论代码多么优化，排序速度都会很慢。记住：当一个程序的运行时间相对于\
  \ `n²` 时，增加代码速度或计算机的速度只能带来微小的改进，因为运行时间的增长率是指数级的。（从本质上说，图 21-1 中的 `n²` 曲线向右稍微移动了，但其他部分保持不变。）经验法是，如果底层算法太慢，无论进行多少手动优化都无法使其变得足够快。解决方案是使用更好的排序算法。\n\
  \n这里描述了两种优秀的排序方法。第一种是`Shell sort`（插入排序）。第二种是`quicksort`（快速排序），它通常被认为是最好的排序程序。这两种改进排序的通用性能都优于之前展示的任何简单排序。\n\
  \n### Shell Sort\n\n`Shell sort` 以其发明者 D. L. Shell 命名。然而，这个名字之所以流传，是因为它的操作方法通常被描述为堆叠在一起的贝壳。这种通用排序方法源自`insertion\
  \ sort`（插入排序），并基于递减的增量。考虑图 21-2。首先，对所有间隔三个位置的元素进行排序。然后，对所有间隔两个位置的元素进行排序。最后，对所有相邻元素进行排序。\n\
  \n![](img/index-538_1.png)\n\n第 507 页 图 21-2 Shell 排序\n\n很难看出这种方法能产生良好的结果，或者事实上它甚至能对数组进行排序。但它确实可以。每次排序通过涉及的元素较少，或者元素已经处于合理的顺序中；因此`Shell\
  \ sort` 是高效的，且每次通过都会增加有序性。\n\n增量的精确序列可以更改。唯一的规则是最后一个增量必须是 1。例如，9, 5, 3, 2, 1 序列效果良好，并用于此处所示的`Shell\
  \ sort`。避免使用 2 的幂次序列——由于数学上的复杂原因，它们会降低排序算法的效率（但排序仍然有效）。\n\n```c\n/* The Shell Sort.\
  \ */\nvoid shell(char *items, int count)\n{\n  register int i, j, gap, k;\n  char\
  \ x, a[5];\n  a[0]=9; a[1]=5; a[2]=3; a[3]=2; a[4]=1;\n  for(k=0; k < 5; k++) {\n\
  \    gap = a[k];\n    for(i=gap; i < count; ++i) {\n      x = items[i];\n      for(j=i-gap;\
  \ (x < items[j]) && (j >= 0); j=j-gap)\n        items[j+gap] = items[j];\n     \
  \ items[j+gap] = x;\n    }\n  }\n}\n```\n\n你可能已经注意到内部 `for` 循环有两个测试条件。比较 `x<items[j]`\
  \ 对于排序过程显然是必要的。测试 `j>=0` 防止排序越越数组 `items` 的边界。这些额外的检查会在多大程度上降低`Shell sort` 的性能。\n\
  \n稍有不同的排序版本使用了称为 `sentinels`（哨兵）的特殊数组元素，它们实际上待排序数组的一部分。`sentinels` 持有特殊的终止值，指示最小和最大的元素。通过这种方式，边界检查是不必要的。然而，使用`sentinels`\
  \ 需要对数据的特定了解，这限制了排序函数的通用性。\n\n`Shell sort` 提出了非常困难的数学问题，远超本文讨论的范围。请相信排序 `n` 个元素的执行时间与\
  \ `n^{1.2}` 成比例。这对于 `n` 平方排序是一个巨大的改进。要理解这种改进有多大，请参见图 21-3，它同时绘制了 `n²` 和 `n^{1.2}`\
  \ 排序。然而，在对 `Shell sort` 感到兴奋之前，你应该知道`quicksort` 更好。\n\n### Quicksort\n\n`quicksort`\
  \ 由 C. A. R. Hoare 发明并命名，它优于书中的所有其他算法，通常被认为是目前可用最好的通用排序算法。它基于`exchange sort`（交换排序）——考虑到`bubble\
  \ sort`糟糕的性能，这令人惊讶！\n\n`quicksort`构建在分区（partitions）的思想之上。通用步骤是选择一个称为 `comparand`（比较数）的值，然后将数组划分为两个部分。所有大于或等于分区值的元素放在一侧，小于该值的元素放在另一侧。然后对每个剩余部分重复此过程，直到数组排序完毕。例如，给定数组\
  \ `fedacb` 并使用值 `d` 作为 `comparand`，`quicksort` 的第一次通过将重新排列数组如下：\n\nInitial f e d\
  \ a c b\nPass 1 b c a d e f\n\n![](img/index-540_1.png)\n\n第 509 页 图 21-3 $n²$ 和\
  \ $n^{1.2}$ 曲线\n\n\n\n每个程序员都应该有多种排序算法可供选择。尽管 `quicksort` 是平均情况下的最优排序算法，但它并不是所有情况下的最佳排序算法。例如，当只对非常小的列表进行排序（例如，少于\
  \ 100 个项目）时，`quicksort` 递归调用产生的开销可能会抵消其优越算法带来的益处。在这种罕少数情况下，更简单的排序算法——甚至是气泡排序——可能会更快。此外，如果你知道列表已经近乎有序，或者你你不希望相似的键（keys）发生交换，那么其他排序算法中的一种可能优于\
  \ `quicksort`。关键点在于，仅仅因为 `quicksort` 是最好的通用排序算法，并不意味着在特殊情况下你无法通过其他方法获得更好的效果。\n\n\
  ## 排序其他数据结构\n\n到目前为止，我们只对字符数组进行排序。显然，任何内置数据类型的数组都可以通过简单地更改排序函数参数和变量的数据类型来完成排序。然而，通常需要对复合数据类型（如字符串）或信息分组（如结构体）进行排序。大多数排序涉及一个键和一个与键关联的信息。为了适应键而修改算法，你需要更改比较部分、交换部分或或两者。算法本身保持不变。\n\
  \n由于 `quicksort` 是目前可用最好的通用程序之一，因此在下面的示例中使用了它。然而，相同的技术也适用于之前描述的任何排序算法。\n\n## 排序字符串\n\
  \n排序字符串是一项常见的编程任务。到目前为止，当字符串包含在字符串表中时最容易排序。*字符串表*（string table）简单来说就是一个字符串数组。而字符串数组是一个二维字符数组，其中表中字符串的数量由左维度的大小决定，而每个字符串的最大长度由右维度的大小决定。（有关字符串数组的信息，请参阅第\
  \ 4 章。）接下来的 `quicksort` 字符串版本接受一个字符串数组，其中每个字符串最多长十个字符。\n\n（如果你需要可以更改此长度。）此版本按字典顺序对字符串进行排序。\n\
  \n```c\n/* 用于字符串的快速排序。 */\n\nvoid quick_string(char items[][10], int count)\n{\n\
  \    qs_string(items, 0, count-1);\n}\n\nvoid qs_string(char items[][10], int left,\
  \ int right)\n{\n    register int i, j;\n    char *x;\n    char temp[10];\n    i\
  \ = left; j = right;\n    x = items[(left+right)/2];\n    do {\n        while((strcmp(items[i],x)\
  \ < 0) && (i < right)) i++;\n        while((strcmp(items[j],x) > 0) && (j > left))\
  \ j--;\n        if(i <= j) {\n            strcpy(temp, items[i]);\n            strcpy(items[i],\
  \ items[j]);\n            strcpy(items[j], temp);\n            i++; j--;\n     \
  \   }\n    } while(i <= j);\n    if(left < j) qs_string(items, left, j);\n    if(i\
  \ < right) qs_string(items, i, right);\n}\n```\n\n注意，比较步骤已更改为使用 `strcmp()` 函数。如果第一个字符串在字典序上小于第二个，该函数返回负数；如果两个字符串相等，则返回零；如果第一个字符串在字典序上大于第二个，则返回正数。还要注意，当必须交换两个字符串时，需要调用三次次\
  \ strcpy()`。\n\n请注意，`strcmp()` 因为两个原因会减慢排序速度。首先，它涉及到函数调用，这总是需要时间的。其次，`strcmp()`\
  \ 本身会执行多次比较来确定两个字符串之间的关系。在第一情况下，如果速度绝对至重要，可以通过复制 `strcmp()` 代码将其内联到程序中。在第二种情况下，没有办法避免对字符串进行比较，因为根据定义，这项任务本身就包含了这一点。同样的逻辑也适用于\
  \ `strcpy()` 函数。使用 `strcpy()` 交换两个字符串涉及函数调用和对两个字符串的逐字符交换——这两者都增加了时间。函数调用的开销可以通过使用内联代码来消除。\n\
  \n然而，交换两个字符串意味着交换它们的单个字符（一个接一个），这一事实是无法改变的。\n\n这里是一个简单的 `main()` 函数，演示了 `quick_string()`：\n\
  \n```c\n#include <stdio.h>\n#include <string.h>\n\nvoid quick_string(char items[][10],\
  \ int count);\nvoid qs_string(char items[][10], int left, int right);\n\nchar str[][10]\
  \ = { \"one\",\n    \"two\",\n    \"three\",\n    \"four\"\n};\n\nint main(void)\n\
  {\n    int i;\n    quick_string(str, 4);\n    for(i=0; i<4; i++) printf(\"%s \"\
  , str[i]);\n    return 0;\n}\n```\n\n## 排序结构体\n\n大多数需要排序的应用程序可能都需要对一组数据进行排序。例如，邮件列表、库存数据库和员工记录都包含数据集合。如你所知，在\
  \ C 程序中，数据集合通常存储在结构体中。虽然结构体通常包含几个成员，但它通常只根据其中一个成员进行排序，该成员被用作排序键。\n\n除了键的选择，适用于排序其他类型的技术也适用于排序结构体。\n\
  \n为了看到排序结构体的示例，让我们使用名为 `address` 的结构体，它可以容纳信息。如之前定义的邮件列表 `address` 结构体所示：\n\n```c\n\
  struct address {\n    char name[40];\n    char street[40];\n    char city[20];\n\
  \    char state[3];\n    char zip[11];\n};\n```\n\n由于 `address` 结构体可以作为数组排列，假设此示例将对\
  \ `address` 类型的数组进行排序。程序所示，它按邮政编码进行排序。\n\n```c\n/* 用于 address 结构体的快速排序。 */\n\nvoid\
  \ quick_struct(struct address items[], int count)\n{\n    qs_struct(items, 0, count-1);\n\
  }\n\nvoid qs_struct(struct address items[], int left, int right)\n{\n    register\
  \ int i, j;\n    char *x;\n    struct address temp;\n    i = left; j = right;\n\
  \    x = items[(left+right)/2];\n    do {\n        while((strcmp(items[i].zip,x)\
  \ < 0) && (i < right)) i++;\n        while((strcmp(items[j].zip,x) > 0) && (j >\
  \ left)) j--;\n        if(i <= j) {\n            temp = items[i];\n            items[i]\
  \ = items[j];\n            items[j] = temp;\n            i++; j--;\n        }\n\
  \    } while(i <= j);\n    if(left < j) qs_struct(items, left, j);\n    if(i < right)\
  \ qs_struct(items, i, right);\n}\n```\n\n## 排序随机访问磁盘文件\n\n磁盘文件有两种类型：*顺序*和*随机访问*。如果任何一种类型的磁盘文件足够小，可以将其读入内存，并且之前介绍的数组排序程序就可以对其排序。然而，许多磁盘文件太大，无法在内存中进行排序，需要特殊的技术。大多数数据库应用程序使用随机访问磁盘文件。本节展示了排序随机访问磁盘文件的一种方法。\n\
  \n将随机访问文件视为磁盘上的一个大数组，意味着你只需要少量的修改就可以使用快速排序。与其索引数组，磁盘版本的快速排序必须使用 `fseek()` 来定位磁盘上的相应记录。\n\
  \n在现实中，每种排序情况根据所排序的精确数据结构和所使用的键而异。然而，通过使用一个短程序排序 `address` 结构体（之前定义的邮件列表结构体），你可以学习排序随机访问磁盘文件的通用思路。\n\
  \n\n\n接下来的示例程序首先创建了一个包含未排序地址的磁盘文件。然后它对该文件进行排序。要排序的地址数量由 `NUM_ELEMENTS` 指定（在本程序中为\
  \ 4）。然而，在实际应用中，必须动态维护记录计数。你应该亲自尝试运行这个程序，尝试不同类型的结构以及包含不同类型的数据。\n\n```c\n/* Disk sort\
  \ for structures of type address. */\n\n#include <stdio.h>\n\n#include <stdlib.h>\n\
  \n#include <string.h>\n\n#define NUM_ELEMENTS 4 /* 这是一个任意数字\n\n它应该为每个列表\n\n动态地确定。\
  \ */\n\nPage 516\n\nstruct address {\n\nchar name[30];\nchar street[40];\nchar city[20];\n\
  char state[3];\nchar zip[11];\n} ainfo;\nstruct address addrs[NUM_ELEMENTS] = {\n\
  \n\"A. Alexander\", \"101 1st St\", \"Olney\", \"Ga\", \"55555\",\n\"B. Bertrand\"\
  , \"22 2nd Ave\", \"Oakland\", \"Pa\", \"34232\",\n\"C. Carlisle\", \"33 3rd Blvd\"\
  , \"Ava\", \"Or\", \"92000\",\n\"D. Dodger\", \"4 Fourth Dr\", \"Fresno\", \"Mi\"\
  , \"45678\"\n};\n\nvoid quick_disk(FILE *fp, int count);\nvoid qs_disk(FILE *fp,\
  \ int left, int right);\nvoid swap_all_fields(FILE *fp, long i, long j);\nchar *get_zip(FILE\
  \ *fp, long rec);\nint main(void)\n\n{\nFILE *fp;\n/* first, 创建一个用于排序的文件 */\n\n\
  if((fp=fopen(\"mlist\", \"wb\"))==NULL) {\nprintf(\"Cannot open file for write.\\\
  n\");\nexit(1);\n}\nprintf(\"Writing unsorted data to disk.\\n\");\nfwrite(addrs,\
  \ sizeof(addrs), 1, fp);\nfclose(fp);\n/* now, 排序文件 */\n\nif((fp=fopen(\"mlist\"\
  , \"rb+\"))==NULL) {\nprintf(\"Cannot open file for read/write.\\n\");\nexit(1);\n\
  }\nprintf(\"Sorting disk file.\\n\");\nquick_disk(fp, NUM_ELEMENTS);\nfclose(fp);\n\
  \nPage 517\n\nprintf(\"List sorted.\\n\");\nreturn 0;\n}\n/* A Quicksort for files.\
  \ */\nvoid quick_disk(FILE *fp, int count)\n\n{\nqs_disk(fp, 0, count-1);\n}\nvoid\
  \ qs_disk(FILE *fp, int left, int right)\n{\nlong int i, j;\nchar x[100];\ni = left;\
  \ j = right;\nstrcpy(x, get_zip(fp, (long)(i+j)/2)); /* 获取中间的 zip */\ndo {\nwhile((strcmp(get_zip(fp,i),x)\
  \ < 0) && (i < right)) i++;\nwhile((strcmp(get_zip(fp,j),x) > 0) && (j > left))\
  \ j--;\nif(i <= j) {\nswap_all_fields(fp, i, j);\ni++; j--;\n}\n} while(i <= j);\n\
  if(left < j) qs_disk(fp, left, (int) j);\nif(i < right) qs_disk(fp, (int) i, right);\n\
  }\nvoid swap_all_fields(FILE *fp, long i, long j)\n\n{\nchar a[sizeof(ainfo)], b[sizeof(ainfo)];\n\
  /* 首先读取记录 i 和 j */\nfseek(fp, sizeof(ainfo)*i, SEEK_SET);\nfread(a, sizeof(ainfo),\
  \ 1, fp);\n\nPage 518\n\nfseek(fp, sizeof(ainfo)*j, SEEK_SET);\nfread(b, sizeof(ainfo),\
  \ 1, fp);\n/* 然后将它们写回相反槽槽 */\nfseek(fp, sizeof(ainfo)*j, SEEK_SET);\nfwrite(a, sizeof(ainfo),\
  \ 1, fp);\nfseek(fp, sizeof(ainfo)*i, SEEK_SET);\nfwrite(b, sizeof(ainfo), 1, fp);\n\
  }\n/* 返回指向邮码的指针 */\nchar *get_zip(FILE *fp, long rec)\n\n{\nstruct address *p;\n\
  p = &ainfo;\nfseek(fp, rec*sizeof(ainfo), SEEK_SET);\nfread(p, sizeof(ainfo), 1,\
  \ fp);\nreturn ainfo.zip;\n}\n```\n\n如你所示，必须编写两个辅助函数来对地址记录进行排序。在排序的比较部分，使用 `get_zip()`\
  \ 函数返回被比较数和正在检查的记录的 `zip` 字段指针。`swap_all_fields()` 函数执行实际的数据交换。读取和写入顺序对这种排序的速度有很大影响。当发生交换时，如所示，代码会强制跳转到记录\
  \ `i`，然后到 `j`。当磁盘驱动器头部仍停留在 `j` 位置时，写入 `i` 的数据。这意味着头部不需要移动很远。如果代码写成写入 `i` 的数据……\n\
  \n### 搜索方法\n\n如果数据是经过排序的，你可以使用 `bsearch()` 函数。然而，如果数据是未排序的，你只能进行顺序搜索。\n\n### 顺序搜索\n\
  \n顺序搜索的代码实现非常简单。以下函数搜索一个已知长度的数组，直到找到匹配项为止。\n\n```c\nint sequential_search(char *items,\
  \ int count, char key)\n{\nregister int t;\nfor(t=0; t < count; ++t)\nif(key ==\
  \ items[t]) return t;\nreturn -1; /* 无匹配项 */\n}\n```\n\n很容易看出，顺序搜索平均会测试 `n/2` 个元素。在最好的情况下它只测试一个，而在最坏的情况下它测试\
  \ `n` 个元素。如果信息存储在磁盘上，搜索时间可能会很长。\n\n### 二分查找\n\n一种寻找匹配项的优越多的的方法。它使用了分治法。要使用这种方法，只需测试中间元素。如果它大于键，则测试前半部分的中间元素；否则，测试后半部分的中间元素。重复此过程，直到找到匹配项或没有更多元素可以测试。\n\
  \n例如，在给定数组中查找数字 4：\n\n1\n2\n3\n4\n5\n6\n7\n8\n9\n\n二分查找首先测试中间值，即 5。由于它大于 4，搜索在前半部分继续，即：\n\
  \n1\n2\n3\n4\n5\n\nPage 520\n\n现在的中间元素是 3。它小于 4，所以丢弃前半部分。搜索在以下部分继续：\n\n4\n\n这次找到了匹配项。\n\
  \n在二分查找中，最坏情况下的比较次数为 `log n`。在平均情况下，这个数字会低一些，而在最好的情况下比较次数为一次。\n\n下面是一个针对字符数组的二分查找函数。通过更改程序中的比较部分，你可以对任意数据结构进行这种搜索。\n\
  \n```c\n/* The Binary search. */\nint binary_search(char *items, int count, char\
  \ key)\n{\nint low, high, mid;\nlow = 0; high = count-1;\nwhile(low <= high) {\n\
  mid = (low+high)/2;\nif(key < items[mid]) high = mid-1;\nelse if(key > items[mid])\
  \ low = mid+1;\nelse return mid; /* 找到 */\n}\nreturn -1;\n}\n```\n\n\n\n数据类型与其机器表示之间的紧密程度与其抽象程度成反比关系。也就是说，随着数据类型变得越来越抽象，程序员对它们的思考方式与它们在内存中实际表示方式的相似性就越来越降低。简单类型（如\
  \ `char` 和 `int`）与其机器表示紧密结合。例如，整数值的机器表示非常接近程序员对该值的概念。随着数据类型变得越来越复杂，它们在概念上与其机器等价物的相似性就越小。例如，浮点值比整数更抽象。机器内部对\
  \ `float` 的实际表示与普通程序员对浮点数的构想并不相似。更抽象的是结构，它是一种聚合数据类型。\n\n下一层抽象通过增加访问这些数据的机制——即 `stored`（存储）和\
  \ `retrieved`（检索）——超越了数据的纯物理层面。本质上，物理数据与一个`data engine`相关联，该引擎控制了程序访问信息的方式。这些数据引擎正是本章的主题。\n\
  \n数据引擎有四种基本类型：\n\n- 队列 (queue)\n- 栈 (stack)\n- 链表 (linked list)\n- 二叉树 (binary tree)\n\
  \n这些方法中的每一种都一类问题提供了解决方案。这些方法本质上是设备，根据接收到的请求对提供的信息执行特定的存储和检索操作。它们都存储一个项目并检索一个项目，其中项目是一个信息单元。本章的其余部分将向你展示如何使用\
  \ C 语言构建这些数据引擎。在此过程中，将阐述几种常见的 C 编程技术，包括动态分配和指针操作。\n\n### 队列 (Queues)\n\n`queue`\
  \ 简单来说就是按照“先进先出”（first-in, first-out）顺序访问的信息列表，有时被称为 `FIFO`。也就是说，第一个放入队列的项是第一个检索的项，第二个放入的是第二个检索的，以此此类推。这是队列中存储和检索的唯一手段；不允许对任何特定项目进行随机访问。\n\
  \n队列在生活中非常常见。例如，银行或快餐店的排队就是队列。为了可视化队列的工作原理，请考虑两个函数：`qstore()` 和 `qretrieve()`。`qstore()`\
  \ 函数将项目放在队列末尾，而 `qretrieve()` 从队列中移除第一个项目并返回其值。表 22-1 显示了这一系列操作的效果。\n\n请记住，检索操作会从队列中移除一个项目，如果它没有存储在其他地方，就会被破坏。因此，在所有项目被移除后，队列将为空。\n\
  \n队列用于许多编程场景。最常见的之一是仿真。队列还用于操作系统的任务调度器和 I/O 缓冲。\n\n为了看到队列运行的示例，我们将使用一个简单的预约调度程序。该程序允许你输入若干个预约；当满足每个预约时，它就会从列表中移除。为了简单起见，每个预约描述限制在\
  \ 255 个字符以内，预约数量随机限制为 100 个。\n\n首先，简单的调度程序需要这里显示的 `qstore()` 和 `qretrieve()` 函数。它们将存储描述预约的字符串指针。\n\
  \n#### 操作 (Action)\n\n**队列内容 (Contents of Queue)**\n\n| 操作 | 队列状态 |\n| :--- | :---\
  \ |\n| `qstore(A)` | A |\n| `qstore(B)` | A B |\n| `qstore(C)` | A B C |\n| `qretrieve()`\
  \ 返回 `A` | B C |\n| `qstore(D)` | B C D |\n| `qretrieve()` 返回 `B` | C D |\n| `qretrieve()`\
  \ 返回 `C` | D |\n\n**表 22-1.** *队列演示 (A Queue in Action)*\n\n```c\n#define MAX 100\n\
  \nchar *p[MAX];\n\nint spos = 0;\nint rpos = 0;\n\n/* 存储一个预约。 */\nvoid qstore(char\
  \ *q)\n{\n    if(spos==MAX) {\n        printf(\"List Full\\n\");\n        return;\n\
  \    }\n    p[spos] = q;\n    spos++;\n}\n\n/* 检索一个预约。 */\nchar *qretrieve()\n{\n\
  \    if(rpos==spos) {\n        printf(\"No more appointments. \\n\");\n        return\
  \ '\\0';\n    }\n    rpos++;\n    return p[rpos-1];\n}\n```\n\n注意，这些函数需要两个全局变量：`spos`持有下一个空存储位置的索引）和\
  \ `rpos`持有下一个要检索的项目索引）。你可以通过简单更改它们操作的数组的基类型，使用这些函数维护其他数据类型的队列。\n\n`qstore()` 函数将新预约的指针放在列表末尾，并检查列表是否已满。`qretrieve()`\
  \ 函数在有事件需要处理时从队列中取出预约。每调度一个新预约，`spos` 就会加 1；每完成一个预约，`rpos` 就会加 1。从本质上说，`rpos` 在队列追逐\
  \ `spos`。图 22-1 显示了这可能出现的样子（由于原文未提供图，此处省略图片描述）。\n\n\n\n```c\nprintf(''List Full\\\
  n\");\n\nreturn;\n\n}\n\np[spos] = q;\n\nspos++;\n\nif(spos==MAX) spos = 0; /* loop\
  \ back */\n\n}\n\nchar *qretrieve(void)\n\n{\n\nif(rpos==MAX) rpos = 0; /* loop\
  \ back */\n\nif(rpos==spos) {\n\nprintf(\"No events to retrieve.\\n\");\n\nreturn\
  \ NULL;\n\n}\n\nrpos++;\n\nreturn p[rpos-1];\n\n}\n```\n\n## 第 529 页\n\n在这个版本中，当存储索引比检索索引少\
  \ 1 时，队列即满；否则，队列还有空间容纳另一个事件。当 `rpos` 等于 `spos` 时，队列为空。\n\n循环队列最常见的用法是在操作系统中，其中循环队列存储从磁盘文件或控制台读取和写入的信息。循环队列也用于实时应用程序，这些程序必须在缓冲\
  \ I/O 请求的同时继续处理信息。许多文字处理器在重新格式化段落或对齐行时都会这样做。正在输入的内容在另一个进程完成之前不会显示。为了实现这一点，应用程序程序在执行另一个进程期间检查键盘输入。如果输入了按键，它会被迅速放入队列中，然后另一个进程继续运行。一旦进程完成，字符就会从队列中检索出来。\n\
  \n为了感受循环队列的用法，请考虑一个包含两个进程的简单程序。\n\n程序中的第一个进程在屏幕上打印 1 到 32,000 的数字。第二个进程在你输入字符时将它们放入循环队列，而不将其回显到屏幕上，直到你按下回车键（ENTER）。你输入的字符不会显示，因为第一个进程拥有屏幕的优先级。一旦你按了回车键，队列中的字符就会被检索并打印。\n\
  \n为了让程序按照描述的方式运行，它必须使用两个标准 C 中未定义的函数：`_kbhit()` 和 `_getch()`。`_kbhit()` 函数在按了按键时返回真；否则返回假。`_getch()`\
  \ 函数读取按键但不会将字符回显到屏幕上。\n\n标准 C 并没有定义检查键盘状态或在不回显到显示器的情况下读取键盘字符的函数，因为这些函数高度依赖于操作系统。\n\
  \n尽管如此，大多数编译器都提供了执行这些操作的例程。这里显示的短程序可以在 Microsoft 编译器下运行：\n\n```c\n/* 使用键盘缓冲器的循环队列示例\
  \ */\n\n#include <stdio.h>\n\n#include <conio.h>\n\n#include <stdlib.h>\n\n#define\
  \ MAX 80\n\nchar buf[MAX+1];\n\nint spos = 0;\n\nint rpos = 0;\n\nvoid qstore(char\
  \ q);\n\nchar qretrieve(void);\n\nint main(void)\n\n{\n\n/* 第 530 页\n\nregister\
  \ char ch;\n\nint t;\n\nbuf[80] = '\\0';\n\n/* 输入字符直到输入了回车键。 */\n\nfor(ch=' ',t=0;\
  \ t<32000 && ch!='\\r'; ++t) {\n\nif(_kbhit()) {\n\nch = _getch();\n\nqstore(ch);\n\
  \n}\n\nprintf(''%d \", t);\n\nif(ch == '\\r') {\n\n/* 显示并清空键缓冲区。 */\n\nprintf(\"\
  \\n\");\n\nwhile((ch=qretrieve()) != '\\0') printf(\"%c\", ch);\n\nprintf(\"\\n\"\
  );\n\n}\n\n}\n\nreturn 0;\n\n}\n\n/* 将字符存储在队列中。 */\n\nvoid qstore(char q)\n\n{\n\
  \nif(spos+1==rpos || (spos+1==MAX && !rpos)) {\n\nprintf(\"List Full\\n\");\n\n\
  return;\n\n}\n\nbuf[spos] = q;\n\nspos++;\n\nif(spos==MAX) spos = 0; /* loop back\
  \ */\n\n}\n\n/* 检索字符。 */\n\nchar qretrieve(void)\n\n{\n\nif(rpos==MAX) rpos = 0;\
  \ /* loop back */\n\nif(rpos==spos) return '\\0';\n\nrpos++;\n\nreturn buf[rpos-1];\n\
  \n}\n```\n\n第 531 页\n\n## 栈 (Stacks)\n\n*栈*与队列是相反的，因为它使用的是*后进先出*（last-in, first-out）访问方式，有时被称为\
  \ LIFO。为了视觉化栈，只需想象一叠盘子。放在桌上的第一个盘子是最后一个使用的，而放在放在栈上的盘子是第一个使用的。栈被频繁用于系统软件，包括编译器和解释器。\n\
  \n在处理栈时，两个基本操作——存储和检索传统上分别称为 *push*（入栈）和 *pop*（出栈）。因此，为了实现栈你需要两个函数：`push()`，将一个值放在栈上；以及\
  \ `pop()`，从栈中检索一个值。你还需要一个内存区域作为栈。你可以使用数组为此目的，或者使用 C 的动态分配函数分配内存区域。与队列一样，检索函数会从列表中取下一个值，如果它没有存储在其他地方，则会被销毁。使用整数数组的\
  \ `push()` 和 `pop()` 的通用形式如下。你可以通过更改 `push()` 和 `pop()` 所操作的数组基基类型，来维护其他数据类型的栈。\n\
  \n```c\nint stack[MAX];\n\nint tos=0; /* 栈顶 */\n\n/* 将元素放在栈上。 */\n\nvoid push(int\
  \ i)\n\n{\n\nstack[tos++] = i;\n\n}\n\n/* 从栈中检索元素。 */\n\nint pop(void)\n\n{\n\n\
