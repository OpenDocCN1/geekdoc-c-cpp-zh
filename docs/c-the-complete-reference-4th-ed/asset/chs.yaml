  \ 应用于广泛的编程任务。在此过程中，将介绍许多说明 C 语言各个方面面的有用算法和应用程序。第四部分包含的许多示例可以作为你自己的 C 项目的起点。\n\n\
  # 第 21 章—排序与搜索\n\n在计算机世界中，排序和搜索是两个最基础且分析最广泛的任务。排序和搜索例程几乎用于所有的数据库程序，也用于编译器、解释器和操作系统。本章将介绍排序和搜索的基础知识。正如你将看到的，它们说明了若干项重要的\
  \ C 编程技术。由于排序数据的目的通常是为了让数据搜索变得更容易、更快，因此首先讨论排序。\n\n## 排序\n\n*排序*（Sorting）是将一组相似的信息按递增或递减排列的过程。排序是算法类别中最令人智力愉悦的之一，因为这个过程定义非常明确。排序算法也经过了大量的分析并被很好理解。\n\
  \n遗憾的是，因为排序非常容易理解，它有时被认为是理所当然。当需要排序数据时，许多程序员简单地使用 C 标准库提供的 `qsort()` 函数。然而，不同的排序方法具有不同的特性。虽然某些排序在平均情况下可能优于其他排序，但没有一种排序是完美适用于所有情况。因此，对任何程序员的工具箱来说，各种排序方法都是一种有用的补充。\n\
  \n在开始之前，简要解释一下为什么 `qsort()` 不是所有排序任务的答案会很有。\n\n首先，你不能将像 `qsort()` 这样的通用函数应用到每种情况。例如，它只能对内存中的数组进行排序。它不能排序存储在链表中的数据。其次，`qsort()`\
  \ 是参数化的，因此它可以处理多种数据，但这导致它的运行速度比仅针对一种类型数据操作的等排序要慢。最后，正如你将看到的，尽管 `qsort()` 使用的快速排序算法在通用情况下非常有效，但它对于特殊情况可能不是最好的排序方法。\n\
  \n排序算法分为两大类：对随机访问对象（如数组或随机访问磁盘文件）进行排序的算法，以及对顺序对象（如磁盘或磁带文件或链表）进行排序的算法。本章只关注第一类，因为它对普通程序员最相关。\n\
  \n通常在对信息进行排序时，只有一部分信息被用作排序键（key）。*键*是决定哪一项排在另一项之前的数据部分。因此，键被用于比较，但在进行交换时，整个数据结构会被交换。例如，在邮件列表中，邮政编码可能被用作键，但排序的是整个地址。简单起见，接下来的示例将对字符数组进行排序，其中键和数据是相同的。稍后你将看到如何调整这些方法来排序任何类型的数据结构。\n\
  \n## 排序算法的分类\n\n排序有三种通用方法：\n\n* 交换 (Exchange)\n* 选择 (Selection)\n* 插入 (Insertion)\n\
  \n为了理解这三种方法，想象一副扑牌。要使用*交换*对牌进行排序，将它们朝上铺在桌子上，然后交换顺序不对的牌，直到牌组有序为止。\n\n使用*选择*，将牌铺在桌子上，选择值最小的牌，将其从牌组中取出并握在手里。然后，从桌上剩下的牌中选择最小的牌，并把它放在手牌的后面。这个过程一直持续，直到所有的牌都在你手中。完成该过程后，你手中的牌就是有序的。要使用*插入*对牌进行排序，将所有牌都握在手里。一次放一张在桌子上，始终将其插入到正确的位置。当你手中没有牌时，牌组就排好了了。\n\
  \n## 判断排序算法\n\n有许多不同的排序算法。它们都有自己的优点，但判断排序算法的标准标准是：\n\n* 它在平均情况下能多快地排序信息？\n* 它的最好情况和最坏情况有多快？\n\
  * 它是否表现出自然或非自然的行为？\n* 它是否会重新排列键相等的元素？\n\n现在仔细观察这些标准。显然，某个算法排序的快慢是非常关注的。\n\n数组排序的速度与比较的次数和交换的次数直接相关，其中交换花费的时间更多。当一个数组元素与另一个元素比较时，就会发生*比较*；当两个元素交换位置时，就会发生*交换*。某些排序例程的运行时间随待排序数量呈指数级增长，而另一些相对于待排序数量呈对数增长。\n\
  \n如果你预计经常遇到这些情况之一，那么最好和最坏情况的运行时间就很重要。通常，一种排序有良好的平均情况，但有糟糕的最坏情况。如果一种排序表现出*自然*行为，如果它在列表已经有序时工作最少，随着列表变得越来越无序而工作越来越辛苦，并且当列表处于逆序时工作最辛苦。排序工作的忙碌程度取决于它所做的比较次数和交换次数。\n\
  \n为了理解为什么重新排列键相等的元素可能很重要，想象一个数据库（例如邮件列表），它是根据主键和子键排序的。主排序键是邮政编码，在邮政编码内部，姓氏是子键。当向列表添加新地址并重新排序列表时，你不希望子键（即邮政编码内的姓氏）发生重排。为了保证这种情况不发生，排序不能交换值相等的键。\n\
  \n## 冒泡排序\n\n最为人知（且臭名昭著）的排序是*冒泡排序*。它的流行源于其朗朗上口的名字和简单。然而，对于通用排序来说，它是构构想中最糟糕的排序之一。\n\
  \n冒泡排序是一种交换排序。它涉及对相邻元素的重复比较，并在必要时进行交换。元素就像水箱里的泡泡——每个泡泡寻找自己的深度。这里是冒泡排序的一种简单形式：\n\n\
  ```c\n/* 冒泡排序。 */\nvoid bubble(char *items, int count)\n{\n    register int a, b;\n\
  \    register char t;\n\n    for(a=1; a < count; ++a)\n        for(b=count-1; b\
  \ >= a; --b) {\n            if(items[b-1] > items[b]) {\n                /* exchange\
  \ elements */\n                t = items[b-1];\n                items[b-1] = items[b];\n\
  \                items[b] = t;\n            }\n        }\n}\n```\n\n在这里，`items`\
  \ 是指向要排序字符数组的指针，`count` 是数组元素的数量。接下来的讨论首先检查每一类中的代表性排序，然后分析每种排序的效率。\n\n\n\n\n外部循环导致数组被扫描\
  \ `count`–1 次。这确保了在最坏的情况下，当函数终止时，每个元素都处于其正确的位置。内层循环实际上执行比较和交换。（一种稍微改进的冒泡排序在没有发生交换时会终止，但这会在每次通过内层循环的遍历中额外增加一次次比较。）你可以使用这个版本的冒泡排序将字符数组按升序排序。例如，以下短程序可以对用户输入的字符串进行排序：\n\
  \n```c\n/* Sort Driver */\n#include <string.h>\n#include <stdio.h>\n#include <stdlib.h>\n\
  \nvoid bubble(char *items, int count);\n\nint main (void)\n{\n    char s[255];\n\
  \    printf(\"Enter a string:\");\n    gets(s);\n    bubble(s, strlen(s));\n   \
  \ printf(\"The sorted string is: %s.\\n\", s);\n    return 0;\n}\n```\n\n为了查看冒泡排序的工作原理，假设要排序的数组是\
  \ `dcab`。每一轮的操作显示如下：\n\n初始\nd c a b\n\n第 1 轮\na d c b\n\n第 2 轮\na b d c\n\n第 3 轮\n\
  a b c d\n\n在分析任何排序算法时，了解最好、平均和最坏情况下将执行多少次比较和交换是非常有用的。因为编译器优化、处理器差异以及实现细节会影响可执行代码的特性，我们不必纠结这些数量的精确值。相反，我们将集中在每个算法的总体效率上。\n\
  \n在冒泡排序中，比较次数始终是相同的，因为无论列表初始是否有序，两个 `for` 循环都会重复指定的次数。这意味着冒泡排序总是会执行\n\n`1/2( *n*\
  \ 2 –n*)`\n\n次比较，其中 `n` 是待排序元素的数量。这个公式的推导基于：外层循环执行 `n`–1 次，而内层循环平均执行 `n/2` 次。\n\n\
  这两个数字相乘，就得到了上述公式。\n\n注意上述公式中的 `n2` 项。冒泡排序被称为 `n-squared`（n 平方）算法，因为它的执行时间与所排序的元素数量的平方成正比。\n\
  \n坦率地说，当 `n-squared` 算法应用于大量元素时是低效的，因为执行时间随排序元素数量呈指数级增长。图 21-1 显示了执行时间如何随数组大小而增加。\n\
