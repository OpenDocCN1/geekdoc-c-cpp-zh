  \ 将这一数量增加了三倍以上。扩展 C 在数值处理方面的可用性是 C99 委员会的主要目标之一。可以说，他们成功了！\n\n所有的数学函数都需要包含 `<math.h>`\
  \ 头文件。除了声明数学函数外，该头文件还定义了一个或多个宏。对于 C89，`<math.h>` 定义的唯一宏是 `HUGE_VAL`，它是一个表示溢出的 `double`\
  \ 值。C99 定义了更多宏，包括：\n\n- `HUGE_VALF`: `HUGE_VAL` 的 `float` 版本。\n- `HUGE_VALL`: `HUGE_VAL`\
  \ 的 `long double` 版本。\n- `INFINITY`: 一个表示无穷大的值。\n- `math_errhandling`: 包含 `MATH_ERRNO`\
  \ 和/或 `MATH_ERREXCEPT`。\n    - `MATH_ERRNO`: 用于报告错误的 `errno`。\n    - `MATH_ERREXCEPT`:\
  \ 抛出以报告错误的浮点异常。\n- `NAN`: 非数字（Not a number）。\n\nC99 定义了几个对值进行分类的类函数宏。它们显示所示：\n\n\
  ```c\nint fpclassify( *fpval*)\n```\n根据 `fpval` 的值返回 `FP_INFINITE`、`FP_NAN`、`FP_NORMAL`、`FP_SUBNORMAL`\
  \ 或 `FP_ZERO`。这些宏由 `<math.h>` 定义。\n\n```c\nint isfinite( *fpval*)\n```\n如果 `fpval`\
  \ 是有限的，返回非零。\n\n```c\nint isinf( *fpval*)\n```\n如果 `fpval` 是无穷大的，返回非零。\n\n```c\n\
  int isnan( *fpval*)\n```\n如果 `fpval` 不是数字，返回非零。\n\n```c\nint isnormal( *fpval*)\n\
  ```\n如果 `fpval` 是正规值，返回非零。\n\n```c\nint signbit( *fpval*)\n```\n如果 `fpval` 为负数（即其符号位被设置），则返回非零。\n\
  \nC99 定义了以下比较宏。对于每个宏，`a` 和 `b` 必须是浮点类型：\n\n```c\nint isgreater( *a*, *b*)\n```\n\
  如果 `a` 大于 `b`，返回非零。\n\n```c\nint isgreaterequal( *a*, *b*)\n```\n如果 `a` 大于或等于 `b`，返回非零。\n\
  \n```c\nint isless( *a*, *b*)\n```\n如果 `a` 小于 `b`，返回非零。\n\n```c\nint islessequal(\
  \ *a*, *b)*\n```\n如果 `a` 小于或等于 `b`，返回非零。\n\n```c\nint islessgreater( *a*, *b)*\n\
  ```\n如果 `a` 大于或小于 `b`，返回非零。\n\n```c\nint isunordered( *a*, *b)*\n```\n如果 `a` 和 `b`\
  \ 之间无序，则返回 1；如果 `a` 和 `b` 有序，则返回 0。\n\n使用这些宏的原因是它们能够优雅地处理非数字值，而不会引起浮点异常。\n\n`EDOM`\
  \ 和 `ERANGE` 宏也被数学函数使用。这些宏定义在头文件 `<errno.h>` 中。\n\nC89 和 C99 处理错误的方式有些不同。对于 C89，如果数学函数的参数不在其定义的域内，则会返回一个实现定义的值，并将内置全局整数变量\
  \ `errno` 设置为 `EDOM`。对于 C99，域错误也会导致返回一个实现定义的值。然而，`math_errhandling` 的值决定了会采取哪些其他操作。如果\
  \ `math_errhandling` 包含 `MATH_ERRNO`，则内置全局整数变量 `errno` 被设置为 `EDOM`。如果 `math_errhandling`\
  \ 包含 `MATH_ERREXCEPT`，则抛出一个浮点异常。\n\n对于 C89，如果函数产生的结果大到无法表示，就会发生溢出。这导致函数返回 `HUGE_VAL`，并将\
  \ `errno` 设置为 `ERANGE`，表示范围错误。\n\n如果发生下溢，函数返回 0 并将 `errno` 设置为 `ERANGE`。对于 C99，溢出错误也会导致函数返回\
  \ `HUGE_VAL`，下溢也会导致函数返回 0。然后，如果 `math_errhandling` 包含 `MATH_ERRNO`，则 `errno` 被设置为\
  \ `ERANGE`，表示范围错误。如果 `math_errhandling` 包含 `MATH_ERREXCEPT`，则抛出一个浮点异常。\n\n在 C89\
  \ 中，数学函数被规定对 `double` 类型的值的操作并返回 `double` 值。C99 添加了这些函数的 `float` 和 `long double`\
