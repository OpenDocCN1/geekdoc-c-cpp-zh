  \ 格式说明符\n\n在输入十六进制数时，以下程序读取了一个八进制数和一个十六进制数：\n\n```c\n#include <stdio.h>\n\nint main(void)\n\
  {\n    int i, j;\n    scanf(\"%o%x\", &i, &j);\n    printf(\"%o %x\", i, j);\n \
  \   return 0;\n}\n```\n\n第 223 页\n\n`scanf()` 函数在遇到第一个非数字字符时停止读取数字。\n\n### 输入无符号整数\n\
  \n要输入无符号整数，使用 `%u` 格式说明符。例如，\n\n```c\nunsigned num;\nscanf(\"%u\", &num);\n```\n\
  \n读取一个无符号数并将其值放入 `num` 中。\n\n### 使用 scanf() 读取单个字符\n\n正如本章前面介绍的，你可以使用 `getchar()`\
  \ 或派生函数读取单个字符。如果你使用 `%c` 格式说明符，也可以用 `scanf()` 实现此目的。\n\n然而，与大多数 `getchar()` 的实现一样，当使用\
  \ `%c` 说明符时，`scanf()` 通常会对输入进行行缓冲。这在交互式环境中有些麻烦。\n\n虽然在读取其他类型的数据时使用空格、制表符和换行符作为字段分隔符，但在读取单个字符时，空白字符会像其他字符一样被读取。例如，对于输入流\
  \ \"x y\"，这段代码段：\n\n```c\nscanf(\"%c%c%c\", &a, &b, &c);\n```\n\n返回时，`a` 中为字符 `x`，`b`\
  \ 中为空格，`c` 中为字符 `y`。\n\n### 读取字符串\n\n`scanf()` 函数可以使用 `%s` 格式说明符从输入流中读取一个字符串。使用\
  \ `%s` 会导致 `scanf()` 读取字符直到遇到空白字符为止。\n\n读取的字符被放入对应参数指向的字符数组中，并且结果以空字符终止。对于 `scanf()`\
  \ 而言，空白字符可以是空格、换行符、制表符、垂直制表符或分页符。与 `gets()`（它读取字符串直到按下回车键）不同，`scanf()` 读取字符串直到输入第一个空格为止。这意味着你不能使用\
  \ `scanf()` 读取像 \"this is a test\" 这样的字符串，因为第一个空格就会终止读取过程。\n\n要查看 `%s` 说明符的效果，请使用字符串\
  \ \"hello there\" 测试此程序：\n\n```c\n#include <stdio.h>\n\nint main(void)\n{\n    char\
  \ str[80];\n    printf(\"Enter a string: \");\n    scanf(\"%s\", str);\n    printf(\"\
