  \ 是一个通用的控制台输入例程。它可以读取所有内置数据类型，并自动将数字转换为适当的内部格式。它非常像 `printf()` 的反向。`scanf()` 的原型是：\n\
  \n```c\nint scanf(const char *control_string, ., ...);\n```\n\n`scanf()` 函数返回成功赋值值的数据项个数。如果发生错误，`scanf()`\
  \ 返回 `EOF`。`control_string` 决定了如何将值读取到参数列表中所指的变量中。\n\n控制字符串由三类字符组成：\n\n- 格式说明符\n\
  - 空格字符\n- 非空格字符\n\n现在让我们逐一查看这些内容。\n\n### 格式说明符\n\n输入格式说明符以前跟的是一个 `%` 符号，它告诉 `scanf()`\
