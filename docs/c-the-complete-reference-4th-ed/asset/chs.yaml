  [content]\n前述方法的低效之处在于所有路径都被执行到了最后。改进的方法将停止继续跟踪。\n\n\n\nC 语言是 Windows 编程使用的主要语言之一。因此，在书中包含一个\
  \ Windows 编程的示例似乎是恰当的。然而，Windows 是一个大型且复杂的编程环境，显然，不可能在一个章节中描述编写 Windows 应用程序所需的所有细节。尽管如此，我们*可以*介绍所有应用程序都通用的基本元素。此外，这些元素可以组合成一个最小的\
  \ Windows 应用程序骨架，为你自己的自己的 Windows 应用程序奠定基础。\n\n自首次推出以来，Windows 经历了几次演变。在编写本文时，当前版本是\
  \ `Windows 2000`。本章的内容是专门为这一版本的 Windows 定制的。然而，如果你有的是更新或更旧版本的 Windows，大部分讨论仍然适用。\n\
  \n### 注意事项\n\n本章改编自我的书籍 `Windows 2000 Programming from the Ground Up`（`Berkeley`,\
  \ `CA: Osborne/McGraw-Hill`, `2000`）。如果你对学习更多关于 Windows 2000 编程感兴趣，你会发现这本书特别有用。\n\
  \n### Windows 2000 编程视角\n\n从最基础的层面来说，`Windows 2000`（以及泛指的 Windows）的目标是让对系统有基本了解的人能够坐下来并在无需预先训练的情况下运行几乎任何应用程序。为了这一目标，Windows\
  \ 为用户提供了一个一致的界面。理论上说，如果你能运行一个基于 Windows 的程序，你就可以运行所有的程序。当然，在实际上，大多数实用的程序仍然需要某种类型的训练才能有效使用，但至少这种训练可以限制在程序*做了什么*，而不是用户必须*如何*与程序进行*交互*。\n\
  \n事实上，Windows 应用程序中的许多代码只是为了支持用户界面。\n\n需要理解的是，并不是每个在 `Windows 2000` 下运行的程序都会自动向用户展示\
  \ Windows 风格的界面。Windows 定义了一个鼓励一致性的环境，但并没有强制执行。例如，可以编写出不利用标准 Windows 界面元素的 Windows\
  \ `TEAMFLY` 程序。要创建一个 Windows 风格的程序，你必须有刻意地这样做。只有那些为了利用 Windows 而编写的程序看起来和用起来才像 Windows\
  \ 程序。尽管你可以覆盖基本的 Windows 设计哲学，但你最好有一个充分的理由这样做，因为你的程序将违反 Windows 最基本的目标：一致的用户界面。通常情况下，如果你在为\
  \ `Windows 2000` 编写应用程序，它们应该符合标准的 Windows 风格指南和设计实践。\n\n让我们来看定义 `Windows 2000` 应用程序环境的一些基本元素。\n\
  \nTeam-Fly®\n第 661 页\n\n### 桌面模型\n\n在少数例外情况下，基于窗口的用户界面的意义是在屏幕上提供等于桌面的内容。在桌子上可能会发现几张不同的纸，一张叠在另一张，通常在顶部页面下方可以看到不同页面的碎片。`Windows\
  \ 2000` 中桌面的等物是屏幕。纸张的等物是屏幕上的窗口。在桌子上，你可以移动纸张，也许切换哪张纸在最上面，或者另一张纸暴露在视野中的多少。`Windows\
  \ 2000`允许在其窗口上进行相同类型的操作。通过选择窗口，你可以使其成为当前窗口，这意味着将其放在所有其他窗口之上。你可以放大或缩小窗口，或在屏幕上移动它。简而言之，Windows\
  \ 让你能够像控制桌面表面一样来控制屏幕表面。所有符合标准的程序必须允许这些类型的用户交互。\n\n### 鼠标\n\n与之前所有的 Windows 版本一样，`Windows\
  \ 2000` 使用鼠标进行几乎所有的控制、选择和绘制操作。当然，键盘也可以使用，但 Windows 是针对鼠标优化的。因此，Windows 尽可能支持鼠标。幸运的是，程序在很多地方都支持鼠标。\n\
  \n### 图标、位图和图形\n\n`Windows 2000`鼓励使用图标、位图和其他类型的图形。这些项目使用的背后有一个老谚语：一画胜于万言。图标是一个用于表示某些操作、资源的小符号。位图是用于向用户快速传递信息的方形图像。然而，位图也可以用作元素。`Windows\
  \ 2000` 支持完整的图形能力，包括绘制线条、矩形和圆形。\n\n### 菜单、控件和对话框\n\nWindows 提供了允许用户输入的标准项，这些菜单、控件和对话框。简而言之，菜单是用户从中进行选择。由于这些是\
  \ Windows 中的标准元素，你的程序不需要处理细节。\n\n第 662 页\n\n*控件*是一种允许特定类型交互的特殊窗口类型。例如推按钮、滚动条、编辑窗口和复选框。与菜单一样，Windows\
  \ 定义的控件几乎是自动化的。\n\n对话框是一种允许比菜单更复杂的应用程序交互的特殊窗口。例如，你的应用程序可能会使用允许输入文件名的对话框。对话框通常用于存放控件。\n\
  \n### Win32 编程接口\n\n从程序员的角度来看，`Windows 2000` 是通过与其交互的方式定义的。所有的应用程序都通过调用接口与 `Windows\
  \ 2000` 通信。`Windows 2000` 调用接口是提供访问系统功能的大量函数。这些函数统称为*应用程序编程接口*，简称 `API`。`API` 包含了应用程序程序用于执行所有必要的系统活动的函数，如分配内存、输出到屏幕、创建窗口等。API\
  \ 的一个子集称为 `GDI`（图形设备接口），它是 Windows 提供设备无关图形的部分。\n\n常用的 API 有两种基本版本：`Win16` 和 `Win32`。`Win16`\
  \ 是旧的 16 位版本。`Win32` 是现代的 32 位版本。`Win16` 被 `Windows 3.1` 使用。\n\n`Windows 2000` 程序使用\
  \ `Win32`。（`Win32` 也被 `Windows 95` 和 `Windows 98` 使用）。通常情况下，`Win32` 是 `Win16` 的超集。事实上，在大多数情况下，这些函数以相同的名称调用并以相同的方式使用。然而，尽管精神和目的上相似，这两个\
  \ API 在两个根本方面不同。首先，`Win32` 支持 32 位平坦寻址，而 `Win16` 仅支持 16 位分段内存模型。这种差异意味着 `Win32`\
  \ 在某些地方使用 32 位参数和返回值，而 `Win16` 则使用 16 位值。其次，`Win32`\n\n\n\n\n包含了支持基于线程的多任务、安全性以及\
  \ Win16 中不具备的其他增强功能的 API 函数。如果你是 Windows 编程新手，这些更改不会对你产生显著影响。然而，如果你将把 16 位代码移植到\
  \ Windows 2000，你需要仔细检查传递给每个 API 函数的参数。\n\n## 窗口的组件\n\n在讨论 Windows 2000 编程的具体方面之前，需要定义几个重要术语。图\
  \ 26-1 显示了一个标准窗口，并指出了每个元素。\n\n![](img/index-694_1.jpg)\n\n第 663 页\n\n图 26-1 标准窗口的元素\n\
  \n所有窗口都有边框，用于定义窗口的边界并调整窗口大小。\n\n窗口顶部有若干项。最左侧是系统菜单图标（也称为标题栏图标）。点击此框会显示系统菜单。系统菜单框的右侧是窗口标题。最右侧是最小化、最大化和关闭框。\n\
  \n客户区域是窗口中进行程序活动的部分。大多数窗口还有水平和垂直滚动条，用于在窗口中移动文本。\n\n## Windows 与你的程序如何交互\n\n当你为许多操作系统编写程序时，是你的程序发起的与操作系统的交互。例如，在\
  \ DOS 程序中，是程序请求输入和输出等内容。换句话说，以“传统”方式编写的程序调用操作系统；而操作系统不会调用你的程序。在很大程度上，Windows 的工作方式恰恰相反。是\
  \ Windows 调用你的程序。该过程如下：程序等待，直到 Windows 向其发送一条*消息*（message）。消息通过 Windows 调用的特殊函数传递给你的程序。一旦收到消息，你的程序应该采取适当的行动。虽然你的程序在响应消息时可能会一个或多个\
  \ API 函数，但仍然是 Windows 发起了该活动。比其他任何事情，基于消息的 Windows 交互决定了所有 Windows 程序的通用形式。\n\n\
  Windows 2000 可能向你的程序发送许多不同类型的消息。例如，每当你点击属于你程序的窗口时，都会发送一条鼠标点击消息。每当一个属于你程序的窗口必须重绘时，会发送另一种类型的消息。每当你的程序处于输入焦点时，用户按下按键，还会发送第三种消息。牢牢记住一个事实：对于你的程序而言，消息是随机到达的。这就是为什么\
  \ Windows 程序类似于中断驱动程序。\n\n你无法知道下一条消息是什么。\n\n## Windows Windows 2000 应用程序基础\n\n在开发\
  \ Windows 2000 应用程序骨架之前，需要讨论所有 Windows 程序共同的基础概念。\n\n### WinMain()\n\n所有 Windows\
  \ 2000 程序都通过调用 `WinMain()` 开始执行。（Windows 程序没有 `main()` 函数）。`WinMain()` 具有一些特殊属性，使其与应用程序中的其他函数区分开来。首先，它必须使用\
  \ `WINAPI` 调用约定进行编译。默认情况下，函数使用 C 调用约定，但可以编译函数以便其使用不同的调用约定。例如，一种常见的替代方案是使用 Pascal\
  \ 调用约定。由于各种技术原因，Windows 2000 调用 `WinMain()` 时使用的调用约定是 `WINAPI`。`WinMain()` 的返回类型必须是\
  \ `int`。\n\n### 窗口过程\n\n所有 Windows 程序必须包含一个特殊函数，该函数不由你的程序调用，而是由 Windows 调用。这个函数通常被称为*窗口过程*（window\
  \ procedure）或*窗口函数*（window function）。Windows 2000 通过此函数与你的程序进行通信。当 Windows 2000\
  \ 需要向你的程序传递消息时，它会调用窗口函数。窗口函数在它的参数中接收消息。所有窗口函数必须声明为返回类型 `LRESULT CALLBACK`。`LRESULT`\
  \ 类型是一个 32 位整数。`CALLBACK` 调用约定用于那些会被 Windows 调用的函数。在 Windows 术语中，任何由 Windows 调用的函数被称为*回调*（callback）函数。\n\
  \n第 665 页\n\n除了接收 Windows 2000 发送的消息外，窗口函数还必须启动消息指示的任何操作。通常，窗口函数的体由一个 `switch` 语句组成，将程序将响应的每条消息与特定的响应连接起来。你的程序不需要对收到的每条消息都响应。对于你的程序不感兴趣的消息，可以让\
  \ Windows 2000 提供默认处理。由于 Windows 可以生成数百种不同的消息，因此大多数消息由 Windows 而非你的程序处理是常见的现象。\n\
  \n所有消息都是 32 位整数值。此外，所有消息都附带有该消息所需的任何额外信息。\n\n### 窗口类\n\n当你的 Windows 2000 程序开始执行时，它需要定义并注册一个*窗口**类*（window\
  \ class），这意味着窗口的*样式*或*类型*。当你注册窗口类时，你是在告诉 Windows 窗口的形式和功能。然而，注册窗口类并不会导致窗口产生。要创建一个窗口需要额外的步骤。\n\
  \n### 消息循环\n\n正如之前解释，Windows 2000 通过发送消息与你的程序通信。所有 Windows 应用程序必须在 `WinMain()` 函数内部建立一个*消息循环*（message\
  \ loop）。该循环从应用程序的消息队列中读取任何等待的消息，然后将该消息发回 Windows，然后 Windows 调用你程序的窗口函数。这似乎是一种过度复杂的传递消息的方式，但它确实是所有\
  \ Windows 程序必须运行的方式。（部分原因是将控制权交还给 Windows，以便调度器可以根据自己的需要分配 CPU 时间，而不是等待你的应用程序的时间片结束。）\n\
  \n### Windows 数据类型\n\nWindows API 函数没有广泛使用标准数据类型，如 `int` 或 `char`。相反，Windows 使用的许多数据类型已经在\
  \ `WINDOWS.H` 文件和/或其相关文件中通过 `typedef` 定义。该文件由微软（以及任何其他制作基于 Windows 的 C 编译的公司）提供，并且包含在所有\
  \ Windows 程序中。最常见的类型是 `HANDLE`、`HWND`、`UINT`、`BYTE`、`WORD`、`DWORD`、`LONG`、`BOOL`、`LPSTR`\
  \ 和 `LPCSTR`。`HANDLE` 是作为句柄的 32 位整数。有很多句柄类型，但它们的大小与 `HANDLE` 相同。*句柄*（handle）简单来说是一个标识资源的值。例如，`HWND`\
  \ 是作为窗口句柄的 32 位整数。此外，所有句柄类型都以 H 开头。`BYTE` 是 8 位无符号字符。`WORD` 是 16 位无符号短整数。`DWORD`\
  \ 是无符号 32 位整数。`UINT` 是第 666 页无符号 32 位整数。`LONG` 是带符号 32 位整数。`BOOL` 是用于表示真或假值的整数类型。`LPSTR`\
  \ 是字符串指针，而 `LPCSTR` 是字符串的 `const` 指针。\n\n\n\n\n\n除了上述描述的基本类型外，Windows 2000 定义了几个结构。骨架程序需要的两个结构是\
  \ `MSG` 和 `WNDCLASSEX`。`MSG` 结构包含一个 Windows 2000get，而 `WNDCLASSEX` 是一个定义窗口类的结构。这些结构将在本章稍后进行讨论。\n\
  \n## Windows 2000 骨架\n\n既然已经涵盖了必要的背景信息，我们可以开发一个最小的 Windows 2000 应用程序。如所述，所有 Windows\
  \ 2000 程序都有某些共同点。\n\n这里开发的 Windows 2000 骨架提供了这些必要的功能。在 Windows 编程领域，应用程序骨架被广泛使用，因为创建一个\
  \ Windows 程序需要昂贵的“入场券”。例如，与 DOS 程序（最小程序大约 5 行长）不同，一个最小的 Windows 程序大约有 50 行长。\n\n\
  一个最小的 Windows 2000 程序包含两个函数：`WinMain()` 和窗口函数。\n\n`WinMain()` 函数必须执行以下通用步骤：\n\n\
  1. 定义窗口类。\n2. 将该类注册到 Windows 2000。\n3. 创建该类的窗口。\n4. 显示窗口。\n5. 开始运行消息循环。\n\n窗口函数必须响应所有相关消息。由于骨架程序除了显示窗口外什么都不做，因此它必须响应唯一消息是通知应用程序用户已终止程序的消息。\n\
  \n在我们进入细节之前，请检查下面的程序，这是一个最小的 Windows 2000 骨架。它创建了一个标准窗口，包含标题、系统菜单以及标准的最小化、最大化和关闭框。因此，该窗口能够被最小化、最大化、移动、调整大小和关闭。\n\
  \n```c\n/* A minimal Windows 2000 skeleton. */\n\n#include <windows.h>\n\nLRESULT\
  \ CALLBACK WindowFunc(HWND, UINT, WPARAM, LPARAM);\n\nchar szWinName[] = \"MyWin\"\
  ; /* name of window class */\n\nint WINAPI WinMain(HINSTANCE hThisInst, HINSTANCE\
  \ hPrevInst,\nLPSTR lpszArgs, int nWinMode)\n{\n    HWND hwnd;\n    MSG msg;\n \
  \   WNDCLASSEX wcl;\n\n    /* Define a window class. */\n    wcl.cbSize = sizeof(WNDCLASSEX);\n\
  \    wcl.hInstance = hThisInst; /* handle to this instance */\n    wcl.lpszClassName\
  \ = szWinName; /* window class name */\n    wcl.lpfnWndProc = WindowFunc; /* window\
  \ function */\n    wcl.style = 0; /* default style */\n    wcl.hIcon = LoadIcon(NULL,\
  \ IDI_APPLICATION); /* large icon */\n    wcl.hIconSm = NULL; /* use small version\
  \ of large icon */\n    wcl.hCursor = LoadCursor(NULL, IDC_ARROW); /* cursor style\
  \ */\n    wcl.lpszMenuName = NULL; /* no class menu */\n    wcl.cbClsExtra = 0;\
  \ /* no extra memory needed */\n    wcl.cbWndExtra = 0;\n\n    /* Make the window\
  \ background white. */\n    wcl.hbrBackground = (HBRUSH) GetStockObject(WHITE_BRUSH);\n\
  \n    /* Register the window class. */\n    if(!RegisterClassEx(&wcl)) return 0;\n\
  \n    /* Now that a window class has been registered, a window\n    can be created.\
  \ */\n    hwnd = CreateWindow(\n        szWinName, /* name of window class */\n\
  \        \"Windows 2000 Skeleton\", /* title */\n        WS_OVERLAPPEDWINDOW, /*\
  \ window style - normal */\n        CW_USEDEFAULT, /* X coordinate - let Windows\
  \ decide */\n        CW_USEDEFAULT, /* Y coordinate - let Windows decide */\n  \
  \      CW_USEDEFAULT, /* width - let Windows decide */\n        CW_USEDEFAULT, /*\
  \ height - let Windows decide */\n        NULL, /* no parent window */\n       \
  \ NULL, /* no menu */\n        hThisInst, /* instance handle */\n        NULL /*\
  \ no additional arguments */\n    );\n\n    /* Display the window. */\n    ShowWindow(hwnd,\
  \ nWinMode);\n    UpdateWindow(hwnd);\n\n    /* Create the message loop. */\n  \
  \  while(GetMessage(&msg, NULL, 0, 0))\n    {\n        TranslateMessage(&msg); /*\
  \ translate keyboard messages */\n        DispatchMessage(&msg); /* return control\
  \ to Windows 2000 */\n    }\n    return msg.wParam;\n}\n\n/* This function is called\
  \ by Windows 2000 and is passed\nmessages from the message queue. */\nLRESULT CALLBACK\
  \ WindowFunc(HWND hwnd, UINT message,\nWPARAM wParam, LPARAM lParam)\n{\n    switch(message)\
  \ {\n        case WM_DESTROY: /* terminate the program */\n            PostQuitMessage(0);\n\
  \            break;\n        default:\n            /* Let Windows 2000 process any\
  \ messages not specified in\n            the preceding switch statement. */\n  \
  \          return DefWindowProc(hwnd, message, wParam, lParam);\n    }\n    return\
  \ 0;\n}\n```\n\n让我们逐步分析这个程序。首先，所有 Windows 程序必须包含头文件 `WINDOWS.H`。如所述，该文件（及其辅助文件）包含了\
  \ Windows 使用的 API 函数原型、各种类型、宏和定义。例如，数据类型 `HWND` 和 `WNDCLASSEX` 定义在 `WINDOWS.H`（或其子文件）中。\n\
  \n\n\n\n\n一个 Windows 2000 应用程序有两个关联图标：一个大的图标和一个小的。小图标在应用程序最小化时使用，它也是系统菜单中使用的图标。当你移动或复制应用程序到桌面时，会显示大图标。通常情况下，大图标是\
  \ 32x32 像素位图，而小图标是 16x16 像素位图。大图标由 API 函数 `LoadIcon()` 加载，其原型所示：\n\n```c\nHICON\n\
  LoadIcon(HINSTANCE *hInst, LPCSTR *lpszName);\n```\n\n该函数返回图标的句柄，如果失败则返回 `NULL`。在这里，`hInst`\
  \ 指定包含图标的模块句柄，其名称在 `lpszName` 中指定。然而，要使用内置图标之一，必须对第一个参数使用 `NULL`，并对第二个参数指定以下宏之一：\n\
  \n| 图标宏定义 | 形状 |\n| :--- | :--- |\n| `IDI_APPLICATION` | 默认图标 |\n| `IDI_ERROR` |\
  \ 错误符号 |\n| `IDI_INFORMATION` | 信息 |\n| `IDI_QUESTION` | 问号 |\n| `IDI_WARNING` |\
  \ 叹号 |\n| `IDI_WINLOGO` | Windows 标志 |\n\n关于加载图标有两点点：\n1. 首先，如果你的应用程序没有指定小图标，则会检查大图标的资源文件。如果其中包含小图标，则使用该图标。否则，当需要小图标时，将将大图标缩小。如果你不想指定小图标，请为\
  \ `hIconSm` 赋值 `NULL`，正如骨架代码所示。\n2. 第二，通常 `LoadIcon()` 只能用于加载大图标。你可以使用 `LoadImage()`\
  \ 来加载不同尺寸的图标。\n\n要加载鼠标光标，使用 API `LoadCursor()` 函数。该函数的原型如下：\n\n```c\nHCURSOR\nLoadCursor(HINSTANCE\
  \ *hInst, LPCSTR *lpszName);\n```\n\n该函数返回光标资源的句柄，如果失败则返回 `NULL`。在这里，`hInst` 指定包含鼠标光标的模块句柄，其名称在\
  \ `lpszName` 中指定。要使用内置光标之一，必须对第一个参数使用 `NULL`，并在第二个参数中使用其宏指定一个内置光标。\n\n这里是几个内置光标：\n\
  \n| 光标宏定义 | 形状 |\n| :--- | :--- |\n| `IDC_ARROW` | 默认箭头指针 |\n| `IDC_CROSS` | 十字准\
  \ |\n| `IDC_HAND` | 手 |\n| `IDC_IBEAM` | 垂直 I 型束 |\n| `IDC_WAIT` | 沙漏 |\n\n骨架代码创建的窗口背景颜色被指定为白色，通过\
  \ API 函数 `GetStockObject()` 获取此 `brush` 的句柄。画刷是一种使用预定义尺寸、颜色和图案绘制屏幕的资源。`GetStockObject()`\
  \ 函数用于获取多个标准显示对象的句柄，包括画刷、画笔（用于绘制线条）和字符字体。它的原型如下：\n\n```c\nHGDIOBJ\nGetStockObject(int\
  \ *object);\n```\n\n该函数返回由 `object` 指定对象的句柄。如果失败则返回 `NULL`。（类型 `HGDIOBJ` 是一种 GDI\
  \ 句柄）。这里是你的程序可用的某些内置画刷：\n\n| 宏名称 | 背景类型 |\n| :--- | :--- |\n| `BLACK_BRUSH` | 黑色\
  \ |\n| `DKGRAY_BRUSH` | 深灰色 |\n| `HOLLOW_BRUSH` | 透明窗口 |\n| `LTGRAY_BRUSH` | 浅灰色\
  \ |\n| `WHITE_BRUSH` | 白色 |\n\n你可以使用这些宏作为 `GetStockObject()` 的参数来获取画刷。\n\n一旦窗口类已完全指定，就会使用\
  \ API 函数 `RegisterClassEx()` 向 Windows 2000 注册，原型所示：\n\n```c\nATOM\nRegisterClassEx(CONST\
  \ WNDCLASSEX *lpWClass);\n```\n\n该函数返回一个标识窗口类的值。`ATOM` 是一个意味着 `WORD` 的 `typedef`。每个窗口类都被赋予一个唯一的值。`lpWClass`\
  \ 必须是 `WNDCLASSEX` 结构的地址。\n\n### 创建窗口\n\n一旦定义并注册了窗口类，你的应用程序就可以使用 API 函数 `CreateWindow()`\
  \ 实际创建该类的窗口，其原型所示：\n\n```c\nHWND\nCreateWindow(\n    LPCSTR *lpszClassName,    /*\
  \ 窗口类名称 */\n    LPCSTR *lpszWinName,      /* 窗口标题 */\n    DWORD *dwStyle,      \
  \      /* 窗口类型 */\n    int *X, \n    int *Y,                   /* 左上角坐标 */\n   \
  \ int *Width,               \n    int *Height,              /* 窗口尺寸 */\n    HWND\
  \ *hParent,            /* 父窗口句柄 */\n    HMENU *hMenu,              /* 主菜单句柄 */\n\
  \    HINSTANCE *hThisInst,     /* 创建者句柄 */\n    LPVOID *lpszAdditional    /* 额外信息的指针\
  \ */\n);\n```\n\n如你观察骨架程序所示，`CreateWindow()` 的许多参数可能是默认的或被指定为 `NULL`。事实上，大多数情况下\
  \ `X`、`Y`、`Width` 和 `Height` 参数将简单地使用 `CW_USEDEFAULT`，告诉 Windows 2000 选择默认值。`hParent`\
  \ 可以指定为 `HWND_DESKTOP`。如果没有主菜单，`hMenu` 必须为 `NULL`。如果不需要额外信息，则 `lpszAdditional` 为\
  \ `NULL`。`lpszClassName` 必须指向窗口类的名称。窗口标题由 `lpszWinName` 。创建的样式由 `dwStyle` 决定。宏 `WS_OVERAPPEDWINDOW`\
  \ 指定一个具有系统菜单、边框以及最小化、最大化框的标准窗口。\n\n| 样式宏 | 窗口特性 |\n| :--- | :--- |\n| `WS_OVERAPPEDWINDOW`\
  \ | 带边框的窗口 |\n| `WS_MAXIMIZEBOX` | 最大化框 |\n| `WS_MINIMIZEBOX` | 最小化框 |\n| `WS_SYSMENU`\
  \ | 系统菜单 |\n| `WS_HSCROLL` | 水平滚动条 |\n| `WS_VSCROLL` | 垂直滚动条 |\n\n`CreateWindow()`\
  \ 函数返回它创建的窗口句柄，如果无法创建窗口则返回 `NULL`。\n\n一旦窗口被创建，它尚未在屏幕上显示。要显示窗口，调用 `ShowWindow()`\
  \ API 函数。该函数的原型如下：\n\n```c\nBOOL\nShowWindow(HWND *hwnd, int *nHow);\n```\n\n`hwnd`\
  \ 指定要显示的窗口。显示模式由 `nHow` 指定。第一次显示窗口时，你会希望将 `WinMain()` 的 `nWinMode` 传递给 `nHow` 参数。记住，`nWinMode`\
  \ 的值决定了程序开始执行时窗口显示的方式。随后的调用根据需要显示（或移除）窗口。`nHow` 的常用值所示：\n\n| 显示宏 | 效果 |\n| :---\
  \ | :--- |\n| `SW_HIDE` | 移除窗口 |\n| `SW_MINIMIZE` | 将窗口最小化为图标 |\n| `SW_MAXIMIZE`\
  \ | 将窗口最大化 |\n| `SW_RESTORE` | 将窗口恢复正常大小 |\n\n`ShowWindow()` 函数返回窗口之前的显示状态。如果窗口之前是显示的，则返回非零。如果窗口之前未显示，则返回零。\n\
  \n\n\n\n\n虽然对于骨架来说技术上并非必须，但包含了对 `UpdateWindow()` 的调用，因为你创建的几乎每个 Windows 2000 应用程序都需要它。它本质上告诉\
  \ Windows 2000 向你的应用程序发送消息，指示主窗口需要更新。\n\n### 消息循环\n\n骨架 `WinMain()` 的最后部分是*消息循环*（message\
  \ loop）。消息循环是所有 Windows 应用程序的一部分。它的作用是接收并处理由 Windows 2000 发送的消息。当应用程序运行时，它会不断收到消息。这些消息存储在应用程序的消息队列中，直到它们被读取和处理。每当你的应用程序准备读取另一条消息时，它必须调用\
  \ API 函数 `GetMessage()`，其原型定义如下：\n\n```c\nBOOL\nGetMessage(LPMSG *msg, HWND *hwnd,\
  \ UINT *min, UINT *max);\n```\n\n消息将由 `msg` 指向的结构接收。所有的 Windows 消息都是 `MSG` 类型结构，所示：\n\
  \n```c\n/* Message structure\ntypedef struct tagMSG\n{\nHWND hwnd; /* 消息的目标窗口 */\n\
  UINT message; /* 消息 */\nWPARAM wParam; /*取决于消息的信息 */\nLPARAM lParam; /* 更多取决于消息的信息\
  \ */\nDWORD time; /* 消息发布的时间 */\nPOINT pt; /* 鼠标的 X,Y 位置 */\n} MSG;\n```\n\n在 `MSG`\
  \ 中，消息目标窗口的句柄包含 `hwnd` 中。所有的 Windows 2000 消息都是 32 位整数，消息包含在 `message` 中。与每个消息相关的额外信息通过\
  \ `wParam` 和 `lParam` 传递。`WPARAM` 和 `LPARAM` 类型均为 32 位数值。\n\n消息发送（发布）的时间在 `time`\
  \ 字段中以毫秒为单位指定。\n\n`pt` 成员包含发送消息时的鼠标坐标。坐标存储在 `POINT` 结构中，定义如下：\n\n```c\ntypedef struct\
  \ tagPOINT {\nLONG x, y;\n} POINT;\n```\n\n如果应用程序的消息队列中没有消息，调用 `GetMessage()` 将控制权交还给\
  \ Windows 2000。\n\n`GetMessage()` 的 `hwnd` 参数指定要获取哪个窗口的消息。应用程序可能（甚至很可能）包含多个窗口，而你可能只想接收特定窗口的消息。如果你想接收发送给你应用程序的所有消息，此参数必须为\
  \ `NULL`。\n\n`GetMessage()` 的另外两个参数指定了将接收的消息范围。\n\n通常，你希望应用程序接收所有消息。为了实现这一点，像骨架程序那样，将\
  \ `min` 和 `max` 都指定为 0。\n\n当用户终止程序时，`GetMessage()` 返回零，导致消息循环终止。否则它返回非零。如果发生错误，它将返回\
  \ –1。错误只会在大多数程序不会涉及的异常情况下发生。\n\n消息循环内部调用了两个函数。第一个是 API 函数 `TranslateMessage()`。\n\
  \n此函数将 Windows 2000 生成的虚拟键码转换为字符消息。\n\n虽然并不是所有应用程序都需要，但大多数应用程序都会调用 `TranslateMessage()`，因为这是为了允许键盘完全集成到你的应用程序程序中。\n\
  \n一旦消息被读取并翻译，就会使用 `DispatchMessage()` API 函数分发回 Windows 2000。然后，Windows 2000 将持有此消息，直到可以将其传递给程序的窗口函数。\n\
  \n一旦消息循环终止，`WinMain()` 函数通过向 Windows 2000 返回 `msg.wParam` 的值而结束。该值包含了程序终止时生成的返回代码。\n\
  \n### 窗口函数\n\n应用程序骨架中的第二个函数是它的窗口函数。在这种情况下，该函数名为 `WindowFunc()`，但你可以给它起任何你喜欢的名称。Windows\
  \ 2000 向窗口函数传递消息。`MSG` 结构的前四个成员是它的参数。对于骨架来说，唯一使用的参数是消息本身。\n\n骨架的窗口函数显式地响应一种消息：`WM_DESTROY`。当用户终止程序时会发送此消息。当收到此消息时，你的程序必须执行对\
  \ API 函数 `PostQuitMessage()` 的调用。该函数的参数是在 `WinMain()` 的 `msg.wParam` 中返回的退出代码。调用\
  \ `PostQuitMessage()` 会向你的应用程序发送 `WM_QUIT` 消息，导致 `GetMessage()` 返回假，从而停止你的程序。\n\n\
  `WindowFunc()` 接收到的任何其他消息都会通过调用 `DefWindowProc()` 传递给 Windows 2000 进行默认处理。这一步是必要的，因为所有消息必须以某种方式进行处理。\n\
  \n每条消息都指定了窗口函数在处理消息后必须返回的值。大多数常用的处理消息要求返回零。但少数消息需要不同的返回值。\n\n### 定义文件不再需要\n\n如果你熟悉\
  \ 16 位 Windows 编程，那么你使用过*定义文件*（definition files）。对于 16 位版本的 Windows，所有程序都需要与其关联的定义文件。定义文件仅仅是一个文本文件，指定了\
  \ 16 位环境所需的某些信息和设置。由于 Windows 2000 的 32 位架构（以及其他改进），通常不需要定义文件。如果你是 Windows 新手，且不知道什么是定义文件，下面的讨论将给你一个简要概述。\n\
  \n所有定义文件都使用 `.DEF` 扩展名。例如，骨架程序的定义文件可以命名为 `SKEL.DEF`。这是一个你可以用于向 Windows 3.1 提供兼容性的定义文件：\n\
  \n```\nDESCRIPTION 'Skeleton Program'\nEXETYPE WINDOWS\nCODE PRELOAD MOVEABLE DISCARDABLE\n\
  DATA PRELOAD MOVEABLE MULTIPLE\nHEAPSIZE 8192\nSTACKSIZE 8192\nEXPORTS WindowFunc\n\
  ```\n\n导出允许 Windows 3.1 调用该函数。\n\n### 命名规范\n\n在结束本之前之前需要对函数和变量的命名进行简短说明。\n\n如果你是\
  \ Windows 编程新手，骨架程序及其描述中的几个变量和参数名可能看起来非常奇怪。这是因为它们遵循了微软为 Windows 编程发明的一套命名规范。对于函数，名称由一个动词加一个名词组成。动词和名词的首字母均大写。\n\
  \n\n\n\n\n对于变量名，微软选择了一套相当复杂的系统，将数据类型嵌入变量名中。为了实现这一点，在变量名的开头添加一个小写的类型前缀。名称本身以大写字母开头。类型前缀如表\
  \ 26-1 所示。类型前缀的使用具有争议，并没有被普遍接受。许多 Windows 程序员使用这种方法，许多人则不然。当然，你可以自由使用任何你喜欢的命名规范。\n\
  \n### 表 26-1：变量类型前缀字符\n\n| 前缀 | 数据类型 |\n| :--- | :--- |\n| b | 布尔型 (1 字节) |\n| c\
  \ | 字符 (1 字节) |\n| dw | 无符号长整数 |\n| f | 16 位位域 (标志位) |\n| fn | 函数 |\n| h | 句柄 |\n\
  | l | 长整数 |\n| lp | 长指针 |\n| n | 短整数 |\n| p | 指针 |\n| pt | 存储屏幕坐标的长整数 |\n| w | 无符号短整数\
  \ |\n| sz | 指向空终止字符串的指针 |\n| lpsz | 指向空终止字符串的长指针 |\n| rgb | 存储 RGB 值的长整数 |\n\n*第\
  \ 679 页*\n\n**第 27 章——使用 C 进行软件工程**\n\n*第 680 页*\n\n创建一个大型计算机程序就像设计一栋大型建筑。事实上，如今“建筑师”一词通常被用于软件设计人员。当然，让大型建筑成为可能的因素，与让大型程序成为可能的因素是相同的：即应用适当的工程方法。在本章中，将研究几种与\
  \ C 编程环境相关、且能够极大地简化程序创建和维护的技巧。\n\n本章主要为了那些编程初学者的利益而写。如果你是一个经验丰富的专业人士，将对本章中的大部分内容熟悉。\n\
  \n### 自顶向下设计\n\n毫无疑问，简化大型程序创建你所做的最重要的一件事就是应用可靠的方法。编写程序有三种通用方法：自顶向下、自底向上和临时方案（ad\
  \ hoc）。在自顶向下的方法中，你从顶层例程开始，向下移动到底层例程。自底向上的方法方向相反：你从特定的例程开始，逐步将其构建成更复杂的结构，最后到达顶部。临时方案没有预定的方法。\n\
  \n作为一种结构化语言，`C` 非常适合自顶向下的方法。自顶向下的方法可以产生整洁、易读且易于维护的代码。这种方法还帮助你在编写底层函数之前理清程序的整体结构，减少因错误开始而浪费的时间。\n\
  \n### 编写程序大纲\n\n就像大纲一样，自顶向下的方法从通性描述开始，向细节发展。事实上，设计程序的一种好方法是首先精确定义程序在顶层将做什么，然后填充与每个操作相关的细节。例如，假设你必须编写一个邮件列表程序。首先，你应该列出程序将执行的操作列表。\n\
  \n列表中的每个条目都应该只包含一个功能单元。（你可以将功能单元想象为一个执行单一任务的黑盒。）例如，你的列表可能像这样：`TEAMFLY`\n\n- 输入新地址。\n\
  - 删除地址。\n- 打印列表。\n- 搜索姓名。\n- 保存列表。\n- 载入列表。\n- 退出程序。\n\n*第 681 页*\n\n在你定义了程序的整体功能后，你可以勾勒每个功能单元的细节，从主循环开始。编写邮件列表程序主循环的一种方式如下：\n\
  \n```\nmain loop\n{\n    do {\n        display menu\n        get user selection\n\
  \        process the selection\n    } while selection does not equal quit\n}\n```\n\
  \n这种算法表示（有时称为*伪代码*）可以帮助你在坐在电脑前之前理清程序的整体结构。使用类 `C` 语法是因为它很熟悉，但你可以使用任何你喜欢的类型语法。\n\n\
  你应该对每个功能区域给出类似的定义。例如，你可以像这样定义将邮件列表写入磁盘文件的函数：\n\n```c\nsave to disk {\n    open disk\
  \ file\n    while data left to write {\n        write data to disk\n    }\n    close\
  \ disk file\n}\n```\n\n此时，`save-to-disk` 函数已经创建了新的、更具体的功能单元。这些单元执行了“打开磁盘文件”、“将数据写入磁盘”和“关闭磁盘文件”。你必须定义这些中的每一个一个。如果在定义的过程中创建了新的功能单元，它们也必须被定义，依此类推。\n\
  \n当不再创建新的功能单元时，该过程停止，剩下的工作就是实际编写实现该操作的 `C` 代码。例如，关闭磁盘文件的单元可能会翻译为对 `fclose()` 的调用。\n\
  \n注意，定义中没有提到数据结构或变量。这是刻意为之。到目前为止，你只想定义程序将做什么，而不是它将如何实现。这个定义过程将帮助你决定数据的实际结构。（当然，在编写功能单元代码之前，你需要先确定数据结构。）\n\
  \n*第 682 页*\n\n### 选择数据结构\n\n在你确定了程序的整体大纲后，必须决定数据将如何结构化。数据结构的选择及其实现至关重要，因为它们决定了程序的设计限制。\n\
  \n邮件列表处理的是信息集合：姓名、地址、城市、州和邮政编码。使用自顶向下的方法，这立即建议使用结构来存储这些信息。然而，这些结构将如何存储和操作？对于邮件列表程序，你可以使用固定大小结构数组。但固定大小数组有一个严重的缺点：数组的大小限制了邮件列表的长度。更好的解决方案是动态分配内存，将每个地址存储在动态数据结构（如链表）中，可以根据需要增长或缩小。这样列表就可以根据需要的大小。\n\
  \n虽然选择了动态分配而不是固定大小数组，但数据的确切形式尚未决定。有几种可能性：你可以使用单链表、双链表、二叉树，甚至是哈希方法。每种方法都有其优缺点。为了讨论，假设你的邮件列表应用需要特别快的搜索速度，因此你选择了二叉树。现在你可以定义存储列表中每个姓名和地址的结构，如下：\n\
  \n```c\nstruct addr {\n    char name[30];\n    char street[40];\n    char city[20];\n\
  \    char state[3];\n    char zip[11];\n    struct addr *left; /* 指向左子树的指针 */\n\
  \    struct addr *right; /* 指向右子树的指针 */\n}\n```\n\n一旦定义了数据结构，你就可以编写程序了。只需填充之前创建的伪代码大纲中描述的细节。如果你遵循自顶向下的方法，你的程序不仅更易读，而且开发时间更短，维护更容易。\n\
  \n### 防弹函数\n\n在大型程序中，特别是那些控制可能威胁生命的设备的，错误风险必须非常小。虽然小程序可以被验证为正确的，但大型程序并非如此。（经过验证的程序被证明没有错误且永远不会故障——至少在理论上如此。）例如，考虑一个\n\
  \n*第 683 页*\n\n\n\n\n这是一个控制现代喷气式飞机襟翼的程序。你无法对作用在飞机上的众多力量之间所有可能的交互进行测试。这意味着你无法对程序进行详尽测试。最理想的情况下，你只能说它在某些特定的特定情况下运行得是正确的。对于这种类型的程序，你（作为乘客或程序员）最不希望发生的事情就是崩溃（无论是程序崩溃还是飞机坠毁）！\n\
  \n在编程了几年后，你会发现大多数程序失败都可以归因于少数几种类型的程序员错误。例如，许多灾难性的程序错误是由这些相对常见的错误之一引起的：\n\n*   某些条件导致进入了无意的无限循环。\n\
  *   违反了数组边界，导致相邻代码或数据的损坏。\n*   数据类型意外溢出。\n\n在理论上，这些类型的错误可以通过细致、周全的设计和编程实践来避免。（事实上，专业编写的程序应该合理地避免这些类型的错误。）\n\
  \n然而，另一种类型的错误通常出现在程序的初始开发阶段之后，发生在最终的“微调”期间或程序的维护阶段。这种错误是由一个函数在无意中干扰了另一个函数的代码或数据引起的。这种错误特别难发现，因为两个函数的代码看起来可能都是正确的。\n\
  \n相反，是函数之间的交互导致了错误。因此，为了减少发生灾难性失败的概率，你希望你的函数及其数据尽可能是“防弹级”的。\n\n实现这一点的最佳方法是将与每个函数相关的代码和数据从程序的其他部分隐藏起来。\n\
  \n隐藏代码和数据类似于只向需要知道的人透露秘密。简单来说，如果一个函数不需要知道另一个函数或变量，不要让该函数访问它。你必须遵循以下四条规则来实现这一点：\n\
  \n1.  每个功能单元必须有一个入口点和一个出口点。\n2.  只要可能，将信息传递给函数，而不是使用全局变量。\n3.  当少数相关函数需要全局变量时，你应该将变量和函数都放在一个单独的文件。此外，全局变量必须声明为\
  \ `static`。\n4.  每个函数必须能够向调用者报告其预定操作的成功或失败。\n\n也就是说，调用函数的代码必须能够知道该函数是成功还是失败。\n\n\
  规则 1 规定每个功能区域只有一个入口点和一个出口点。这意味着尽管一个功能单元可能包含几个函数，程序的其他部分只通过其中一个函数进行通信。回想之前讨论过的邮件列表程序。![](img/index-715_1.jpg)\
  \ 第 684 页\n\n有七个功能区域。你可以将每个功能区域所需的所有函数放在它们自己的文件中并单独编译。如果操作正确，每个功能单元进入或退出的唯一途径就是通过它的顶层函数。在邮件列表程序中，这些顶层函数只被\
  \ `main()` 调用，从而防止一个功能单元意外损坏另一个功能单元。这种情况如图 27-1 所示。\n\n尽管在某些情况下会降低性能，但减少副作用可能性的最佳方法是始终将函数所需的所有信息传递给该函数。避免使用全局数据。这是规则\
  \ 2，如果你曾经用标准 BASIC 编写过大型程序——其中每个变量都是全局变量——你已经理解了它的重要性。\n\n规则 3 规定当必须使用全局数据时，应将全局数据和需要访问它的函数放在一个文件中并单独编译。关键是将全局数据声明为\
  \ `static`，从而防止其他文件获取其信息。此外，访问 `static` 数据的函数本身也可以声明为 `static`，防止它们被在同一文件中声明的其他函数调用。\n\
  \n简单来说，规则 4 通过允许函数的调用者以合理的方式对错误条件做出响应，确保程序获得第二次尝试的机会。例如，如果控制飞机襟翼的函数发生了超出范围的情况，你不希望整个程序崩溃（并导致飞机坠毁）。相反，你希望程序知道函数内部发生了错误。由于对于运行在实时数据的程序来说，超出范围的情况可能只是临时情况，程序可以通过简单地等待几个时钟周期并重试来响应此类错误。\n\
  \n图 27-1 每个功能单元只有一个入口点 第 685 页\n\n请记住，严格遵守这些规则并不适用于所有情况，但只要可能，你就应该遵循这些规则。这种方法的目标是创建一个极有可能从错误条件中完好无损地恢复的程序。\n\
  \n**注意**\n\n如果你对支持“防弹函数”的概念特别感兴趣，你可能想要探索 C++。C++ 提供了一种更强大的保护机制，称为“封装”，它进一步减少了一个函数损坏另一个函数的概率。\n\
  \n### 使用 MAKE\n\n另一种往往影响大型程序创建的错误主要发生在开发阶段，并可能导致项目几乎停滞。这种错误发生在在编译和链接程序时，一个或多个源文件与其对应的对象文件版本不一致。当发生这种情况时，程序的可执行形式将无法与源代码的当前状态保持一致。任何参与过大型软件项目创建或维护的人可能都经历过这个问题。为了帮助消除这种令人沮丧的错误，大多数\
  \ C 编译器包含一个名为 `MAKE` 的工具，有助于同步源文件和对象文件。（你的编译器中该 MAKE 工具的确切名称可能略有不同，请务必检查编译器的文档。）\n\
  \nMAKE 自动化了由多个文件组成的大程序的重新编译。在程序开发过程中，经常会对许多文件进行许多小更改。完成更改后，会对程序进行重新编译和测试。不幸的是，很容易忘记哪些文件需要重新编译。在这种情况下，你要么重新编译所有文件——这是浪费时间——要么意外漏掉应该重新编译的文件，可能会导致数小时令人沮丧的调试。`MAKE`\
  \ 程序通过自动重新编译那些已更改的文件来解决这个问题。\n\nMAKE 由 `make file` 驱动，该文件包含目标文件、依赖文件和命令的列表。`目标文件`需要其`依赖文件`来生成。例如，`T.C`\
  \ 是 `T.OBJ` 的依赖文件，因为生成 `T.OBJ` 需要 `T.C`。MAKE 通过比较依赖文件与其目标文件之间的日期来工作。（此处“date”一词的用法）第\
  \ 686 页\n\n\n\n\n（包含了日期和时间。）如果目标文件的日期比其依赖文件更旧（或者目标文件不存在），则执行指定的命令序列。如果该命令序列包含由其他依赖项定义的目标文件，那么这些依赖项也将根据需要进行更新。当\
  \ `MAKE` 过程结束后，所有目标文件都已完成更新。\n\n因此，在一个构造良好的 make 文件中，所有需要编译的源文件都会自动编译并链接，形成新的可执行文件。通过这种方式，源文件与对象文件保持同步。\n\
  \nmake 文件的通用形式为：\n\n`target_file1:`\n`dependent_file`\n`list`\n`command_sequence`\n\
  \n`target_file2:`\n`dependent_file`\n`list`\n`command_sequence`\n\n`target_file3:`\n\
  `dependent_file`\n`list`\n`command_sequence`\n\n·\n·\n·\n\n`target_fileN:`\n`dependent_file`\n\
  `list`\n`command_sequence`\n\n目标文件名必须从最左列开始，后面跟着一个冒号及其依赖文件列表。与每个目标相关的命令序列前面必须至少有一个空格或制表符。注释以\
  \ `#` 开头，可以跟在依赖文件列表和/或命令序列之后。它们也可以单独成行。每个目标文件规范与下一个之间必须至少有一个空行隔开。\n\n关于 make 文件你需要理解的最重要的一是：一旦第一个依赖项成功，make\
  \ 文件的执行就会停止。这意味着你设计 make 文件时，必须使依赖项关系是层次化的。记住，在与其相关的所有子依赖项都得到解决之前，任何依赖项都无法成功。\n\n\
  为了查看 `MAKE` 如何工作，考虑一个非常简单的程序。该程序分为四个名为 `TEST.H`、`TEST.C`、`TEST2.C` 和 `TEST3.C` 的文件。这种情况如图\
  \ 27-2 所示。（为了练习，请将程序的每个部分输入指定的文件。）\n\n第 687 页\n\n```c\nTEST.H:\nextern int count;\n\
  ```\n\n```c\nTEST.C:\n#include <stdio.h>\nvoid test2(void), test3(void);\nint count\
  \ = 0;\nint main(void)\n{\n    printf(\"count = %d\\n\", count);\n    test2();\n\
  \    printf(\"count = %d\\n\", count);\n    test3();\n    printf(\"count = %d\\\
  n\", count);\n    return 0;\n}\n```\n\n```c\nTEST2.C:\n#include <stdio.h>\n#include\
  \ \"test.h\"\nvoid test2(void)\n{\n    count = 30;\n}\n```\n\n```c\nTEST3.C:\n#include\
  \ <stdio.h>\n#include \"test.h\"\nvoid test3(void)\n{\n    count = -100;\n}\n```\n\
  \n图 27-2：一个简单的四文件程序\n\n第 688 页\n\n如果你正在使用 Visual C++，下面的 make 文件会在你做出更改时重新编译程序：\n\
  \n```make\ntest.exe: test.h test.obj test2.obj test3.obj\ncl test.obj test2.obj\
  \ test3.obj\ntest.obj: test.c test.h\ncl -c test.c\ntest2.obj: test2.c test.h\n\
  cl -c test2.c\ntest3.obj: test3.c test.h\ncl -c test3.c\n```\n\n默认情况下，`MAKE` 程序将使用包含在名为\
  \ `MAKEFILE` 文件中的指令。\n\n然而，你通常想为你的 make 文件使用另一个名称。当使用另一个 make 文件名称时，你必须在命令行上使用 `-f`\
  \ 选项。例如，如果前面的 make 文件名为 `TEST`，对于微软的 `NMAKE` 程序，你将在命令提示符输入类似 `nmake -f test` 的命令来编译必要的模块并创建可执行程序。（这适用于微软的\
  \ `NMAKE`。如果你使用不同的 `MAKE` 工具，可能需要不同的选项。）\n\n在 make 文件中，顺序非常重要，因为正如前面提到的，一旦第一个依赖项被满足，`MAKE`\
  \ 就会停止处理文件中包含的指令。例如，如果将前面的 make 文件更改如下：\n\n```make\n# 这是一个错误的 make 文件。\ntest.obj:\
  \ test.c test.h\ncl -c test.c\ntest2.obj: test2.c test.h\ncl -c test2.c\ntest3.obj:\
  \ test3.c test.h\ncl -c test3.c\ntest.exe: test.h test.obj test2.obj test3.obj\n\
  cl test.obj test2.obj test3.obj\n```\n\n第 689 页\n\n当文件 `TEST.H`（或任何其他源文件）被更改时，它将不再正常工作。这是因为最后的指令（创建新的\
  \ `TEST.EXE` 的指令）不再被执行。\n\n### 在 MAKE 中使用宏\n\nMAKE 允许在 make 文件定义宏。这些宏名称仅仅是信息的占位符，这些信息实际上将通过命令行规范或宏在\
  \ make 文件中的定义来确定。宏根据此通用形式定义：`macro_name` = `definition`\n\n如果宏定义中有任何空白字符，你必须将定义包含在双引号内。\n\
  \n一旦定义了宏，就可以像这样使用它：`$(macro_name)`\n\n每当遇到该语句时，宏的定义就会被替换。例如，这个 make 文件使用宏决定使用的库：`LIB\
  \ = graphics.lib`, `prog.exe: prog.obj prog2.obj prog3.obj`\n\n\n\n效率往往涉及权衡。例如，为了让程序运行更快，通常意味着使用内联代码（in-line\
  \ code）来消除函数调用的开销，从而增大程序体积。同样，通过用函数调用替换内联代码来缩小程序体积，有时会导致程序运行变慢。此外，更有效地利用磁盘空间可能意味着对数据压缩，这可能会因为额外的处理开销而导致访问数据的速度变慢。这些以及其他类型的效率权衡可能会非常令人沮丧——尤其是对于非程序员和终端用户来说，他们无法理解为什么一件事会影响另一件事。幸运的是，有一些技术可以同时提高速度并减小体积。\n\
  \n无论你是针对速度还是体积进行优化，C 都是一种让你能够有效实现优化的语言。以下章节介绍了几种最常用的技术，但有进取的程序员一定会发现更多方法。\n\n##\
  \ 自加和自减运算符\n\n对 C 语言高效使用的讨论几乎总是从自加和自减运算符开始。在某些情况下，使用这些运算符可能允许编译器创建更高效的对象代码。例如，考虑以下语句序列：\n\
  \n```\n/* 第一种方式 */\na = a + b;\nb = b + 1;\n\n/* 第二种方式 */\na = a + b++;\n```\n\n\
  这两个语句将 `a + b` 的值赋值给 `a`，然后将 `b` 的值加 1。然而，使用第二种方式通常更有效，因为编译器在访问 `b` 时可能避免使用冗余的加载和存储指令。也就是说，`b`\
  \ 不需要加载到寄存器两次——一次是为了加到 `a`，一次是为了增加它。尽管某些编译器会自动将这两种方式优化为相同的对象代码，但这并不能理所当然。通常情况下，仔细使用\
  \ `++` 和 `--` 运算符可以提高程序的执行速度，同时减小其体积。你应该寻找方法来使用它们。\n\n## 使用寄存器变量\n\n加速代码运行的最有效方法之一是使用\
  \ `register` 变量。\n\n尽管 `register` 变量在其他用处非常有效，但它们特别适用于循环控制。记住，任何指定为 `register` 的变量其存储方式都能产生最短的访问时间。对于整数类型，这通常意味着\
  \ CPU 的寄存器。这非常重要，因为程序中关键循环的执行速度决定了整个程序的运行速度。例如：\n\n```\nfor(i=0; i < MAX; i++) {\n\
  \    /* 执行操作 */\n}\n```\n\n在这里，`i` 被反复测试和设置。也就是说，循环每次迭代时都会对 `i` 的值进行测试，如果它还没有达到目标值，就会对其加\
  \ 1。由于这种操作反复发生，访问 `i` 的速度决定了整个循环的速度。\n\n除了循环控制变量，循环体内部使用的任何变量都是 `register` 修饰符的良候选对象。例如：\n\
  \n```\nfor(i=0; i < MAX; i++) {\n    sum = a + b;\n    /* . . .*/\n}\n```\n\n在这里，变量\
  \ `sum`、`a` 和 `b` 在每次循环时都会被访问。此外，`sum` 在每次迭代中都会被赋值。因此，访问这些变量的速度会影响循环的整体性能。\n\n尽管你可以使用\
  \ `register` 声明任意数量的变量，但实际上，在任何单个函数内部，大多数编译器只能优化少数变量的访问时间。通常，你可以预期任何时候至少有两个整数变量可以放在\
  \ CPU 寄存器中。其他类型的快速存储（如缓存内存）也可以使用，但它们也是受限的。由于可能无法对你修改的每个变量都使用 `register` 进行优化，C 允许编译器忽略\
  \ `register` 指定符并按正常方式处理变量。这一规定还允许为一个环境创建的代码在另一个快速访问存储位置较少的环境中编译。由于快速访问存储始终是有限的，最好的做法是仔细选择你想要针对快速访问进行优化的变量。\n\
  \n## 指针对比 数组索引\n\n在某些情况下，你可以用指针算术代替数组索引。这样做可能会产生更小、更快的代码。例如，以下两个代码段执行相同的操作：数组索引与指针算术\n\
  \n```\np = array;\nfor(;;) { \n    for(;;) { \n        a = array[t++]; \n      \
  \  a = *(p++);\n        } \n    }\n}\n```\n\n指针方法的优势在于，一旦 `p` 加载了 `array` 的地址，每次循环重复时只需执行一次递增。然而，数组索引版本必须根据\
  \ `t` 的值始终计算数组索引——这是一个更复杂的任务。\n\n*要小心*。当索引是通过复杂的公式得出的，且指针算术会模糊程序的含义时，你应该使用数组索引。通常情况下，稍微降低性能比牺牲清晰度要好。此外，数组索引和指针算术之间的差异对于高度优化的编译器，或者在所有处理器类型或所有环境中，可能并不显著。\n\
  \n## 函数的使用\n\n始终记住，使用带有局部变量的独立函数有助于形成结构化编程的基础。函数是 C 程序的构建块，也是 C 语言最强大的资产之一。不要让本节中讨论的任何内容被误解为其他。在收到警告后，在优化代码时，关于\
  \ C 函数及其对代码大小和速度的影响，有一些点值得考虑。当 C 编译器编译函数时，它使用栈来存放函数的参数（如果有）以及函数使用的局部变量。当函数被调用时，调用例的返回地址被放在栈上。当函数返回时，该地址和所有局部变量必须从栈中移除。\n\
  \n给定以下程序，\n\n```c\nint max(int a, int b);\n\nint main (void) {\n    int x;\n   \
  \ x = max(10, 20);\n    return 0;\n}\n\nint max(int a, int b) {\n    return a>b\
  \ ? a : b;\n}\n```\n\n\n\n以下是生成的汇编代码文件。调用和返回序列由作者添加的以星号开头的注释指示。如你所见，调用和返回序列占据了程序代码的相当一部分。\n\
  \n第 696 页\n\n标题 `test.c`\n\n```assembly\n.386P\n\ninclude listing.inc\n\nif @Version\
  \ gt 510\n\n.model FLAT\nelse\n_TEXT SEGMENT PARA USE32 PUBLIC 'CODE'\n_TEXT ENDS\n\
  \n_DATA SEGMENT DWORD USE32 PUBLIC 'DATA'\n_DATA ENDS\n\nCONST SEGMENT DWORD USE32\
  \ PUBLIC 'CONST'\nCONST ENDS\n\n_BSS SEGMENT DWORD USE32 PUBLIC 'BSS'\n_BSS ENDS\n\
  \n_TLS SEGMENT DWORD USE32 PUBLIC 'TLS'\n_TLS ENDS\n\nFLAT GROUP _DATA, CONST, _BSS\n\
  ASSUME CS: FLAT, DS: FLAT, SS: FLAT\nendif\n\nPUBLIC _max\nPUBLIC _main\n\n_TEXT\
  \ SEGMENT\n\n_x$ = –4\n\n_main PROC NEAR\n; File ex2.c\n; Line 4\npush ebp\nmov\
  \ ebp, esp\npush ecx\n; Line 7\n; **************************************************\n\
  ; 这是调用序列的开始。\n; **************************************************\npush 20 ; 00000014H\n\
  push 10 ; 0000000aH\ncall _max\n; **************************************************\n\
  ;\n; **************************************************\n; 下一行是返回序列的一部分。\n; **************************************************\n\
  add esp, 8\nmov DWORD PTR _x$[ebp], eax\n; Line 9\nxor eax, eax\n; Line 10\nmov\
  \ esp, ebp\npop ebp\nret 0\n_main ENDP\n\n_a$ = 8\n_b$ = 12\n\n_max PROC NEAR\n\
  ; Line 13\n; **************************************************\n; 更多调用序列的内容。\n\
  ; **************************************************\npush ebp\nmov ebp, esp\npush\
  \ ecx\n; **************************************************\n; Line 14\nmov eax,\
  \ DWORD PTR _a$[ebp]\ncmp eax, DWORD PTR _b$[ebp]\njle SHORT $L48\nmov ecx, DWORD\
  \ PTR _a$[ebp]\nmov DWORD PTR –4+[ebp], ecx\njmp SHORT $L49\n$L48:\nmov edx, DWORD\
  \ PTR _b$[ebp]\nmov DWORD PTR –4+[ebp], edx\n$L49:\n; **************************************************\n\
  ; 返回序列。\n; **************************************************\nmov eax, DWORD PTR\
  \ -4+[ebp]\n; Line 15\nmov esp, ebp\npop ebp\nret 0\n_max ENDP\n_TEXT ENDS\nEND\n\
  ```\n\n第 698 页\n\n实际生成的代码取决于编译器的实现方式以及所使用的处理器，但它通常与此相似。\n\n前面的讨论并不是建议你编写只包含几个非常大函数的程序以使其运行得更快。这样做是一种不好的做法。首先，在绝大多数情况下，避免函数调用所获得的细微时间差异是没有意义的，而且结构的丧失是严重的。但还有另一个问题。将被多个例程调用的函数替换为内联代码会导致你的程序变大，因为相同的代码被复制了多次。记住，子程序的发明在某种程度上是为了高效地利用内存。事实上，这就是为什么根据经验法则，让程序运行更快意味着让它变大，而让程序变更小意味着让它运行更慢。\n\
  \n如果你打算使用内联代码作为提高程序运行时性能的手段，并且你正在使用兼容 C99 的编译器，那么你应该使用 `inline` 关键字来创建内联函数，而不是手动复制源代码。如果你没有使用兼容\
  \ C99 的编译器，那么在可能的情况下，你应该使用类函数宏来来实现类似的结果。当然，类函数宏不具备 `inline` 函数的灵活性。\n\n## 迁移程序\n\
  \n将在一台机器上编写的程序迁移到另一台具有不同处理器、操作系统（或两者都有）的计算机上是常见现象。这一过程被称为*迁移*（*porting*），取决于程序最初的编写方式，它可以非常容易，也可能极其困难。可以轻松移植的程序被称为*可移植的*（*portable*）。当一个程序不可移植时，这通常是因为它包含许多*机器依赖*（*machine\
  \ dependencies*）——也就是说它拥有只能在一个特定操作系统或处理器上运行的代码片段。C 允许你创建可移植的代码，但实现这一目标需要细心和对细节的关注。本节检查了几个特定的问题领域并提供了一些。\n\
  \n### 使用 #define\n\n使程序具有可移植性最有效的方法是将每个依赖于系统或处理器的“魔数”都定义为 `#define` 宏。这些魔数包括磁盘访问的缓冲区大小、特殊的屏幕和键盘命令、内存分配信息——任何在程序迁移时可能变化的内容。这些\
  \ `#define` 不仅让执行迁移的人员对所有魔数一目了然，而且简化了工作，因为它们的值只需要在程序中更改一次，而不是到处修改。\n\n例如，这里有一个本质上不可移植的\
  \ `fread()` 语句：\n\n```c\nfread(buf, 128, 1, fp);\n```\n\n第 699 页\n\n问题是缓冲区大小 128\
  \ 被硬编码在 `fread()` 中。\n\n```c\n#define BUF_SIZE 128\nfread(buf, BUF_SIZE, 1, fp);\n\
  ```\n\n在这种情况下，当迁移到不同系统时只需修改 `#define`，所有的 `BUF_SIZE` 都会自动更新。这不仅使修改更容易，还避免了许多错误。可移植性的提升通常是巨大的。\n\
  \n### 操作系统依赖\n\n几乎所有商业程序都包含针对其运行操作系统的特定代码。例如，为 Windows 2000 编写的程序可以使用多线程，但为 16 位\
  \ Windows 3.1 编写的程序则不能。对于优秀的快速且商业化的程序来说，操作系统依赖是必要的。但这也使得程序难以移植。虽然没有固定规则可以遵循以减少操作系统依赖，但我提供一个建议：将程序中与应用程序的部分与接口的部分分开。这样，当你将程序迁移到新环境时，只需要更改接口模块。\n\
  \n### 数据大小差异\n\n如果你想编写可移植的代码，绝不能假设数据类型的大小。例如，考虑 16 位和 32 位环境的区别。16 位处理器的字大小是 16\
  \ 位；32 位处理器的字大小是 32 位。因为字通常是 `int` 数据类型的大小，例如，假设 `int` 为 16 位的代码在迁移到 32 位环境时将无法工作。当程序需要知道某个东西有多大字节时，使用\
  \ `sizeof` 来避免大小依赖。例如，此语句将 `int` 写入磁盘文件，并在任何环境中均有效：\n\n```c\nfwrite(&i, sizeof(int),\
  \ 1, stream);\n```\n\n第 700 页\n\n### 调试\n\n引用爱迪生的话，编程是 10% 的灵感和 90% 的调试。\n\n所有优秀的程序员都是出色的调试高手。为了帮助避免错误，回顾一些可能发生的常见方式是有用的。\n\
  \n### 求值顺序错误\n\n递增和递减运算符用于大多数 C 程序中，操作的顺序取决于这些运算符是在变量之前还是之后。考虑以下情况：\n\n```c\ny =\
  \ 10; y = 10;\nx = y++; x = ++y;\n```\n\n\n\n\n这两个序列是不相同的。左侧的序列将值 `10` 赋值给 `x`，然后增加\
  \ `y`。右侧的将 `y` 增加到 `11`，然后将值 `11` 赋值给 `x`。因此，在第一情况下 `x` 包含 `10`；在第二情况下，`x` 包含 `11`。在一般情况下，前缀递增（或递减）操作在获取操作数的值用于更大的表达式之前发生。后置递增（或递减）操作在获取操作数的值并用于更大的表达式之后发生。如果你忘记了这些规则，就会产生问题。\n\
  \n求值顺序错误通常是通过对现有语句序列的修改引起的。例如，在优化一段代码时，你可能会更改此序列：\n\n```c\n/* original code */\n\
  x = a + b;\na = a + 1;\n```\n\n改为如下内容：\n\n```c\n/* “改进”的代码 -- 错误！ */\nx = ++a +\
  \ b;\n```\n\n问题在于，这两个代码片段产生的结果不同。原因是第二种方法在将 `a` 加到 `b` 之前先增加了 `a`。这在原始代码中并非如此！\n\
  \n这样的错误可能很难发现。可能会有一些线索，例如运行不正确的循环或偏移了一个单位的例程。如果你对某条语句有任何疑问，请用你确定的方式重新重写它。\n\nTeam-Fly®\n\
  第 701 页\n\n# 指针问题\n\nC 程序中非常常见的错误是误用指针。指针问题通分为两类：对间接和指针操作符的误解，以及无意使用无效或未初始化的指针。第一个问题的解决方法很简单：只需清楚\
  \ `*` 和 `&` 运算符的含义即可！第二类指针问题稍微棘手一点。\n\n下面是一个说明两种类型指针错误的程序：\n\n```c\n/* 这个程序有一个错误。\
  \ */\n#include <stdlib.h>\n#include <stdio.h>\n\nint main(void)\n{\n    char *p;\n\
  \    *p = (char *) malloc(100); /* 这一行是错误的 */\n    gets(p);\n    printf (p);\n \
  \   return 0;\n}\n```\n\n这个程序极可能会崩溃。原因是 `malloc()` 返回的地址没有赋值给 `p`，而是赋值给了 `p` 所指向的内存位置，而在这种情况下该位置完全完全知的。这种错误代表了对\
  \ `*` 指针运算符的根本性误解。它通常由初级 C 程序员造成——有时甚至是经验丰富的专家也会犯下愚蠢的错误！要纠正这个程序，请将：\n\n```c\np =\
  \ (char *) malloc(100); /* 这是正确的 */\n```\n\n替换掉错误的那行。\n\n程序还包含第二个更隐蔽的错误。对 `malloc()`\
  \ 返回的地址没有运行时检查。记住，如果内存耗尽，`malloc()` 会返回 `NULL`，不应使用该指针。使用 `NULL` 指针是无效的，并且几乎会导致程序崩溃。这里是程序的更正版本，它包含了对指针有效性的检查：\n\
  \n```c\n/* 这个程序现在是正确的。 */\n第 702 页\n#include <stdio.h>\n#include <stdlib.h>\n\n\
  int main(void)\n{\n    char *p;\n    p = (char *) malloc(100); /* 这是正确的 */\n   \
  \ if(!p) {\n        printf(\"Out of memory.\\n\");\n        exit(1);\n    }\n  \
  \  gets(p);\n    printf(p);\n    return 0;\n}\n```\n\n另一个常见错误是忘记在使用指针之前对其进行初始化。考虑以下代码片段：\n\
  \n```c\nint *x;\n*x = 100;\n```\n\n这将导致错误，因为 `x` 并没有指向任何有效的内存地址。如果你对某条语句有任何疑问，请用你确定的方式重新重写它。\n\
  \n# 边界错误\n\n\n\n\n\nC 运行时环境和许多标准库函数几乎没有或没有任何运行时边界检查。例如，你可以很容易导致数组溢出。考虑以下程序，它本意是从键盘读取字符串并显示在屏幕上：\n\
  \n```c\n#include <stdio.h>\n\nint main (void)\n{\n    int var1;\n    char s[10];\n\
  \    int var2;\n    var1 = 10; var2 = 10;\n    gets(s);\n    printf(\"%s %d %d\"\
  , s, var1, var2);\n    return 0;\n}\n```\n\n在这里，并没有直接的编码错误。然而，间接地说，调用 `gets(s)`\
  \ 可能会导致一个错误。\n\n在程序中，`s` 被声明为 10 个字符长度，但如果用户输入了超过 10 个字符怎么办？这会导致 `s` 溢出，`var1`、`var2`\
  \ 或两者的值将被被覆盖。\n\n因此，`var1` 和/或 `var2` 将不包含正确的值。这是因为所有的 C 编译器都使用栈来存储局部变量。变量 `var1`、`var2`\
  \ 和 `s` 在内存中的位置如图 28-1 所示。（你的 C 编译器可能会交换 `var1`、`var2` 和 `s` 的顺序。）\n\n![](img/index-737_1.png)\n\
  \n图 28-1 内存中的变量 `var1`、`var2` 和 `s`，假设整数为 2 字节\n\n假设顺序如图 28-1 所示，当 `s` 溢出时，额外的信息会被放置在属于\
  \ `var2` 的区域，破坏之前的任何内容。因此，两个整数变量都没有打印数字 `10`，被 `s` 溢出破坏的变量会显示其他内容。这会导致你在错误的地方寻找问题。\n\
  \n在上述程序的情况下，可以使用 `fgets()` 函数代替 `gets()` 来消除潜在的边界错误。`fgets()` 函数允许指定读取的最大字符数。唯一的问题是\
  \ `fgets()` 也会读取并存储换行符，因此在大多数应用程序中你需要将其删除。\n\n### 函数原型遗漏\n\n在当今的编程环境中，未能使用完整的函数原型是一种不可原谅的判断失误。为了理解为什么，请考虑以下计算两个浮点数乘程序：\n\
  \n```c\n/* 这个程序是错误的。 */\n#include <stdio.h>\n\nint main(void)\n{\n    float x, y;\n\
  \    scanf(\"%f%f\", &x, &y);\n    printf(\"%f\", mul(x, y));\n    return 0;\n}\n\
  \ndouble mul(float a, float b)\n{\n    return a*b;\n}\n```\n\n在这里，由于没有使用 `mul()`\
  \ 的原型，`main()` 期望 `mul()` 返回一个整数值。但实际上，`mul()` 返回的是一个浮点数。假设整数为 4 字节 `double` 为 8\
  \ 字节，这意味着 8 字节的 `double` 只使用了 4 字节。这会导致你在错误的地方寻找问题。\n\n修正此问题的方法：\n\n```c\n/* 这个程序是正确的。\
  \ */\n#include <stdio.h>\n\nint main(void)\n{\n    float x, y;\n    scanf(\"%f%f\"\
  , &x, &y);\n    printf(\"%f\", mul(x, y));\n    return 0;\n}\n\ndouble mul(float\
  \ a, float b)\n{\n    return a*b;\n}\n```\n\n\n\n\n\n# 第六部分通过开发一个 C 解释器来结束本书。这完成了两个重要的目标：第一，它说明了大多数大型项目中常见的\
  \ C 编程的几个方面；第二，它让我们深入洞察 C 语言的本质和设计。\n\n## 第 29 章——C 解释器\n\n语言解释器是有趣的！对于 C 程序员来说，还有什么比一个\
  \ C 解释器更有趣的呢？\n\n为了结束本书，我想找一个几乎所有 C 程序员都感兴趣，同时又能展示 C 语言若干特性的主题。我希望这个主题是新鲜、有趣且实。在拒绝了许多想法后，我最终决定创建一个\
  \ `Little C` 解释器。\n\n原因如下。\n\n尽管编译器非常有用且重要，但创建一个编译器可能是一个困难且漫长的过程。事实上，仅仅创建一个编译器的运行时库本身就是一项巨大的工程。相比之下，创建一个语言解释器是一个更容易、更易管理的任务。此外，如果设计得当，解释器的运行机制可能比类似的编译器更容易理解。除了开发方便之外，语言解释器还提供了一个编译器所不具备的有趣特性——一个实际上执行程序的引擎。请记住，*编译器*只是将你的程序源代码*翻译*成计算机可以执行的形式。而*解释器*则实际上在*执行*程序。正是这种区别让解释器变得有趣。\n\
  \n如果你像大多数 C 程序员一样，使用 C 不仅是因为它的强大和灵活，还因为这种语言本身代表了一种几乎无法捉摸的形式美，可以为了其本身而欣赏。事实上，C 语言因其一致性和纯洁性经常被称为“优雅”。关于“从外向内”观察\
  \ C 语言的文字非常多，但很少从“内部”对其进行探索。因此，还有什么比创建一个能够解释 C 语言子集的 C 程序来结束本书更好的方式了呢？\n\n在本章中，我们将开发一个可以执行\
  \ C 语言子集的解释器。\n\n这个解释器不仅具有功能性，而且它的设计让你轻松地对其进行增强、扩展，甚至添加 C 语言中不包含的功能。如果你还没有考虑过 C\
  \ 到底是如何工作的，当你看到它是如此简单时，你会感到惊喜。C 语言是迄开发以来理论上最一致的计算机语言之一。读完本章后，你不仅拥有了一个可以使用并扩展的 C\
  \ 解释器，而且对 C 语言本身的结构有了深刻的理解。当然，如果你像我一样，你会发现这里介绍的 C 解释器简直非常好玩！\n\n**注意**\n\n本章介绍的\
  \ C 解释器源代码相当长，但不要被它吓到。如果你通读这些讨论，理解它并跟随它的执行过程将毫无问题。\n\n## 解释器的实际意义\n\n尽管 `Little\
  \ C` 解释器本身很有趣，但语言解释器在计算领域确实具有某些实际意义。如你所知，C 程序通常是经过编译的。主要原因是 C 是一门用于生产商业销售程序的语言。编译代码对于商业软件产品是理想的，因为它保护了源代码的隐私，防止用户修改源代码，并允许程序最有效地利用主机计算机，这只是几个原因之一。坦地说，编译器将一直主导基于\
  \ C 的软件开发，事实如此；但任何计算机语言都可以被编译或解释。事实上，近年来市场上出现了一些 C 解释器。\n\n解释器被使用的两个传统原因是：它们可以很容易地实现交互性，并且可以支持大量的调试辅助工具。然而，近年来，编译器开发者创建了集成开发环境（IDE），它们提供了与任何解释器一样丰富的交互和调试能力。因此，使用解释器的这两个传统理由在任何现实意义上都不再适用。然而，解释器有其用处。例如，大多数数据库查询语言是被解释的。此外，许多工业机器人控制语言也是解释的。\n\
  \n近年来，解释的另一个优势出现了：跨平台移植性。最典型的例子是 Java。Java 被设计为一种解释语言，因为它允许同一个 Java 程序在任何提供 Java\
  \ 解释器的环境中运行。当你希望在许多不同类型的计算机上运行同一个程序时（例如在像互联网这样的网络环境中），这种能力就非常有价值。Java 的诞生和互联网的成功引发了人们对广义解释器的新兴趣。\n\
  \n语言解释器有趣的另一个原因是：它们很容易被修改、更改或增强。这意味着如果你想创建、实验并控制你自己的语言，使用解释器比使用编译器更容易。解释器是极佳的语言原型环境，因为你可以快速地改变语言的工作方式并看到效果。\n\
  \n解释器（相对）容易创建、容易修改、容易理解，而且可能最重要的一点是非常好玩。例如，你可以重构本章介绍的解释器，让你的程序反向执行——即从 `main()`\
  \ 的右大括号开始执行并在遇到左大括号时终止！或者，你可以为 C 添加一个你一直想要的特殊功能。点在于，虽然商业软件开发需要编译器，但解释器让你能真正尽情玩转\
  \ C 语言。本章正是抱着这种精神编写的。我希望你阅读它时像我写它一样愉快！\n\n## Little C 规范\n\n尽管 C 只有几个关键字，但 C 是一门非常丰富且强大的语言。要完全描述并实现一个整个\
  \ C 语言的解释器所需的章节远超一个。相反，`Little C` 解释器理解的是语言中一个相当窄的子集。然而，这个特定的子集包含了 C 的许多重要方面。哪些内容包含在子集中主要取决于它们是否符合以下两个标准之一（或两者）：\n\
  \n- 该特性是否与 C 语言不可分割？\n- 该特性是否是演示语言重要方面的必要？\n\n例如，递归函数、全局和局部变量等特性符合这两个标准。`Little\
  \ C` 解释器支持所有的循环结构（不是因为第一个标准，而是因为第二个标准）。然而，并没有实现 `switch` 语句，因为它既不是必要的（很有用但不是必须），也没有演示任何\
  \ `if` 语句（已实现）无法演示的内容。（`switch` 的实现留给你供娱乐！）基于这些原因，我在 `Little C` 解释器中实现了以下功能：\n\n\
  - 带有局部变量的参数函数\n- 递归\n- `if` 语句\n- `do-while`、`while` 和 `for` 循环\n- `int` 和 `char`\
  \ 类型的局部和全局变量\n- `int` 和 `char` 类型的函数参数\n- 整数和字符常量\n- 字符串常量（有限实现）\n- 带值和不带值的 `return`\
  \ 语句\n- 有限数量的标准库函数\n- 这些运算符：`+`、`–`、`*`、`/`、`%`、 `<`, `>`, `<= `>=`, `==`、`!=`、单元\
  \ `–` 和单元 `+`\n- 返回整数的函数\n\n```\n/*\n\n.\n.\n```\n\n\n\n\n\n. /*-style comments\n\
  \n尽管这个列表看起来很短，但实现它需要相当大量的代码。其中一个原则是，在解释像 C 这样的结构化语言时，必须支付一笔不小的“入场券”。\n\n### Little\
  \ C 的一些限制\n\nLittle C 解释器的源代码相当长——事实上，它比我通常在书里写的代码要长。为了简化并缩短 Little C 的源代码，我对 C\
  \ 语法施加了几个小限制。第一点是 `if`、`while`、`do` 和 `for` 的目标必须是由起始括号和结束括号包围的代码块。你不能使用单个语句。例如，Little\
  \ C 将无法正确解释如下代码：\n\n```c\nfor(a=0; a < 10; a=a+1)\n\nfor(b=0; b < 10; b=b+1)\n\n\
  for(c=0; c < 10; c=c+1)\n\nputs (\"hi\");\n\nif(...)\n\nif(...) x = 10;\n```\n\n\
  相反，你必须像这样写代码：\n\n```c\nfor(a=0; a < 10; a=a+1) {\n\nfor(b=0; b < 10; b=b+1) {\n\n\
  for(c=0; c < 10; c=c+1) {\n\nputs(\"hi\");\n\n}\n\n}\n}\n\nif(...) {\n\nif( ...)\
  \ {\n\nx = 10;;\n\n}\n\n}\n```\n\n这一限制使得解释器更容易找到构成这些程序控制语句之一的目标代码的结尾。然而，由于程序控制语句的对象通常就是代码块，所以这个限制看起来并不太严苛。（如果你愿意，只需花一点精力就可以移除这个限制。）\n\
  \n另一个限制是不支持原型（prototypes）。所有函数都被假设返回整数类型（允许 `char` 返回类型，但会被提升 `int`），并且不进行参数类型检查。\n\
  \n所有局部变量必须在函数的开头声明，紧跟在起始括号之后。\n\n局部变量不能在任何其他块中声明。因此，以下函数是无效的：\n\n```c\nint myfunc()\n\
  {\n\nint i; /* 这是有效的 */\n\nif(1) {\n\nint i; /* 在 Little C 中不允许 */\n\n/* . . . */\n\
  \n}\n\n}\n```\n\n在这里，`if` 块中 `i` 的声明对于 Little C 来说是无效的。要求局部变量在函数开头开头使得实现解释器变得更容易。这是一个你可以花一点精力就移除的限制。\n\
  \n最后，所有函数都必须以 `int` 或 `char` 类型说明符开头。因此，Little C 解释器不支持旧的“默认 int”（或“隐式 `int`”）规则。因此，这个声明是有效的：\n\
  \n```c\nint main()\n{\n\n/* ... */\n}\n```\n\n但上一个就不行：\n\n```c\nmain ()\n{\n\n/*\
  \ . . . */\n}\n```\n\n在函数声明中放弃默认 `int` 使 Little C 与 C99/C++ 方法保持一致。\n\n### 解释结构化语言\n\
  \n如你所知，C 是结构化的：它允许带有局部变量的独立子程序。它还支持递归。你可能会发现的是，在某些领域，为结构化语言编写编译器比为它编写解释器要容易。例如，当编译器生成调用函数的代码时，它只需将调用参数推入系统栈，并执行指向该函数的机器语言\
  \ `CALL`。返回时，函数将返回值放在 CPU 的寄存器中，清空栈，并执行机器语言 `RET`。然而，当解释器必须“调用”函数时，它必须停止正在做的工作，保存当前状态，找到函数位置，执行函数，保存返回值并返回原点，恢复旧环境。（你将在接后的解释器中看到这个示例。）本质上，解释器必须模拟等同机器语言\
  \ `CALL` 和 `RET`。此外，虽然在编译语言中支持递归很容易，但在解释型语言中则需要一些精力。\n\n几年前，在我的书 *The Art of C*（Berkeley,\
  \ CA: Osborne/McGraw-Hill, 1991）中，我通过开发一个小型 BASIC 解释器引入了语言解释器的主题。在本书中，我提到像传统的 BASIC\
  \ 这样的语言比 C 更容易解释，因为 BASIC 设计就是为了被解释。让传统 BASIC 易解释的原因是它不是结构化的。所有变量都是全局的，而且没有独立的子程序。我仍然坚持这一观点；然而，一旦你创建了对函数、局部变量和递归的支持，C\
  \ 语言实际上比 BASIC 更容易解释。这是因为像 BASIC 这样的语言在理论层面充满了异常。例如，在 BASIC 中，等号在赋值语句中是赋值运算符，但在关系语句中是相等运算符。\n\
  \n**注意**\n\n对解释器感兴趣的会发现我对小型 BASIC 解释器的实现很有用。小型 BASIC 解释器的当前版本可以在 *The C/C++ Annotated\
  \ Archives*（Berkeley, CA: Osborne/McGraw-Hill, 1999）中找到。\n\n### C 的非正式理论\n\n在我们开始开发\
  \ C 解释器之前，有必要理解 C 语言是如何结构的。虽然你不需要成为语言专家就能实现和理解它，但你仍然需要对 C 有基础了解。对于我们的目的，下面的讨论已经足够了。想要更正式讨论的人可以参阅\
  \ ANSI ISO 标准。\n\n首先，所有的 C 程序由一个或多个函数组成，加上全局变量（如果有）。一个*函数*由函数名、参数列表和与其相关的代码块组成。一个*块*以\
  \ { 开始，随后是一个或多个语句，并以 } 结束。在 C 中，语句要么以 C 关键字开头，要么是一个表达式（我们将在下一节查看什么是表达式）。总结一下，我们可以写出以下转换规则（有时称为产生规则）：\n\
  \n所有 C 程序都从调用 `main( )` 开始，并在 `main( )` 中遇到最后一个 } 或 `return` 时结束——假设没有其他地方调用 `exit(\
  \ )` 或 `abort( )`。程序包含的任何其他函数必须被 `main( )` 直接或间接地调用；因此，要执行 C 程序，只需从 `main( )` 函数开始即可。\n\
  \n这正是 Little C 所做的。\n\n### C 表达式\n\nC 相许多其他计算机语言扩展了表达式的作用。泛而言，语句要么是 C 关键字语句（如 `while`\
  \ 或 `switch`），要么是一个表达式。为了讨论方便，我们将所有以 C 关键字开头的语句分类为*关键字语句*。\n\nC 中任何不是关键字语句的语句，根据定义都是*表达式语句*。\n\
  \n\n\n\n因此，在 C 语言中，以下语句都是表达式：\n\n```c\ncount = 100; /* line 1 */\nsample = i / 22\
  \ * (c-10); /* line 2 */\nprintf(''This is an expression.\"); /* line 3 */\n```\n\
  \n让我们更仔细地观察这些表达式语句。在 C 语言中，等号是一个 `assignment`（赋值）`operator`（运算符）。C 语言处理赋值操作的方式不像\
  \ `BASIC` 等语言。例如，在 `BASIC` 中，等号右侧产生的值被赋值给左侧的变量。但是（这一点很重要），在 `BASIC` 中，整个语句没有值。在\
  \ C 语言中，等号是一个赋值运算符，赋值操作产生的值等于于表达式右侧产生的值。因此，赋值语句在 C 中实际上是一个 `assignment expression`（赋值表达式）；因为因为它是一个表达式，所以它有一个值。这就是为什么编写如下的表达式是法的：\n\
  \n![](img/index-750_1.png)\n\n第 721 页\n\n```c\na = b = c =: 100;\nprintf(''%d\"\
  , a=4+5);\n```\n\n这些语句在 C 中有效的原因是，赋值是一个产生值的操作。\n\n示例表达式的第 2 行显示了一个更复杂的赋值。在第 3 行中，调用了\
  \ `printf()` 来输出字符串。在 C 语言中，所有非 `void` 函数都会返回值，无论是否显式指定。因此，一个非 `void` 函数调用是一个返回值的表达式——无论该值是否实际上被赋值给某个东西。调用\
  \ `void` 函数也构成一个表达式，只是该表达式的结果是 `void`。\n\n### 表达式的求值\n\n在我们开发能够正确求值 C 表达式的代码之前，你需要用更正式的术语理解表达式是如何定义的。在几乎所有的计算机语言中，表达式都是使用一组产生规则（production\
  \ rules）递归定义的。Little C 解释器支持以下操作：`+`、`–`、`*`、`/`、`%`、`=`、关系运算符（`<`, `>`, 等）以及括号。\n\
  \n因此，我们可以使用这些产生规则来定义 Little C 表达式：\n\n在这里，`rel-op` 指的是 C 的任何关系运算符。项 `lvalue` 和 `rvalue`\
  \ 分别指可以出现在赋值语句左侧和右侧的对象。你应该注意的一点是，运算符的优先级构建在产生规则中。优先级越高，运算符在列表中的位置越靠后。\n\n为了看到这些规则如何工作，让我们求值这个\
  \ C 表达式：\n\n```c\ncount = 10 - 5 * 3;\n```\n\n![](img/index-751_1.png)\n\n![](img/index-751_2.png)\n\
  \n第 722 页\n\n首先，我们应用规则 1，将表达式拆解为这三个部分：\n\n由于子表达式的 `rvalue` 部分没有关系运算符，因此调用了“term（项）”产生规则：\n\
  \n当然，第二个项由以下两个因子（factors）组成：`5` 和 `3`。这两个因子是常量，代表了产生规则的最低级别。\n\n接下来，我们必须开始回溯规则以计算表达式的值。首先，我们相乘\
  \ `5*3`，得到 `15`。接着，我们从 `10` 中减去该值，得到 `5`。最后，这个值被赋值给 `count`，并且也是整个表达式的值。\n\n创建 Little\
  \ C 解释器需要做的第一件事，就是构建我们刚刚在脑中执行的表达式求值的计算机等效实现。\n\n### 表达式解析器\n\n读取并分析表达式的代码段被称为 `expression\
  \ parser`（表达式解析器）。毫无疑问，表达式解析器是 Little C 解释器所需的最重要的子系统。由于 C 语言对表达式的定义比许多其他语言更广泛，构成\
  \ C 程序的大量代码实际上是由表达式解析器执行的。\n\n设计 C 的表达式解析器有多种不同的方法。许多商业编译器使用 `table-driven parser`（表驱动解析器），它通常由解析器生成器程序创建。虽然表驱动解析器通常比其他方法快，但它们很难通过手工创建。对于这里开发的\
  \ Little C 解释器，我们将使用 `recursive-descent parser`（递归下降解析器），它在逻辑上实现了上一节中讨论的产生规则。\n\n\
  递归下降解析器本质上是一组处理表达式的相互递归函数。如果解析器被用在编译器中，它会生成与源代码对应的正确目标代码。然而，在解释器中，解析器的目标是求值给定的表达式。在本节中，将开发\
  \ Little C 解析器。\n\n**注意**\n\n表达式解析在第 24 章介绍。本章使用的解析器在那个简单基础的基础上进行了扩展。\n\n### 将源代码还原为它的组件\n\
  \n所有解释器（以及编译器，同样如此）的基础都是一个特殊的函数，该函数读取源代码并返回其下一个逻辑符号。由于历史原因，这些逻辑符号通常被称为 `tokens`（标记）。通用的计算机语言，特别是\
  \ C 语言，是根据标记来定义程序的。你可以将一个标记视为一个不可分割的程序单元。例如，等价运算符 `==` 是一个标记。两个等号不能在不改变含义的情况下分开。同样，`if`\
  \ 是一个标记。单独的 `\"i\"` 或 `\"f\"` 本身对 C 语言来说都没有任何意义。\n\n在 C 语言中，标记被定义为属于以下组之一：\n\n-\
  \ 关键字（keywords）\n- 标识符（identifiers）\n- 常量（constants）\n- 字符串（strings）\n- 运算符（operators）\n\
  - 标点符号（punctuation）\n\n`keywords` 是构成 C 语言的标记，如 `while`。`identifiers` 是变量、函数名和类型（由\
  \ C 实现）。`Constants` 和 `strings` 是显而易见的，`operators` 也是。`Punctuation` 包括若干项，如分号、逗号、大括号和小括号。其中一些也是运算符，取决于它们的用法。给定语句\n\
  \n```c\nfor(x=0; x<10; x++) printf(\"%d\", x);\n```\n\n以下标记从左到右产生。为了让 C 的解释更容易，Little\
  \ C 将标记分类如下：\n\n| Token 类型 | 包含 |\n| :--- | :--- |\n| delimiter | 标点符号和运算符 |\n|\
  \ keyword | 引号字符串 |\n| identifier | 变量和函数名 |\n| number | 数字常量 |\n\n从源代码读取并返回标记的函数被称为\
  \ `get_token()`，它如下：\n\n```c\n/* 获取一个标记。 */\nint get_token(void)\n{\n    register\
  \ char *temp;\n    token_type = 0; tok = 0;\n    temp = token;\n    *temp = '\\\
  0';\n    /* 跳过空格 */\n    while(iswhite(*prog) && *prog) ++prog;\n    if(*prog ==\
  \ '\\r') {\n        ++prog;\n        ++prog;\n        /* 跳过空格 */\n        while(iswhite(*prog)\
  \ && *prog) ++prog;\n    }\n    if(*prog == '\\0') { /* 文件末尾 */\n        *token\
  \ = '\\0';\n        tok = FINISHED;\n        return (token_type = DELIMITER);\n\
  \    }\n    if(strchr(\"{}\", *prog)) { /* 块边界 */\n        *temp = *prog;\n    \
  \    temp++;\n        *temp = '\\0';\n        prog++;\n        return (token_type\
  \ = BLOCK);\n    }\n    /* 寻找注释 */\n    if(*prog == '/')\n    if(*(prog+1) == '*')\
  \ { /* 是注释 */\n        prog += 2;\n        do { /* 找到注释结束 */\n            while(*prog\
  \ != '*') prog++;\n            prog++;\n        } while (*prog != '/');\n      \
  \  prog++;\n    }\n```\n\n\n\n\n\n```c\ntemp++; *temp = NE; temp++;\n\n*temp = '\\\
  0';\n\n}\n\nbreak;\n\ncase '<': if(*(prog+1) == '=') {\n\nprog++; prog++;\n\n*temp\
  \ = LE; temp++; *temp = LE;\n\n}\n\nelse {\n\nprog++;\n\n*temp = LT;\n}\n\ntemp++;\n\
  \n*temp = '\\0';\n\nbreak;\n\ncase '>': if(*(prog+1) == '=') {\n\nprog++; prog++;\n\
  \n*temp = GE; temp++; *temp = GE;\n\n}\n\nelse {\n\nprog++;\n\n*temp = GT;\n\n}\n\
  \ntemp++;\n\nPage 727\n\n*temp = '\\0';\n\nbreak;\n\n}\n\nif(*token) return (token_type\
  \ = DELIMITER);\n\n}\n\nif(strchr(\"+-*^/%=;(),'\", *prog)){ /* 分隔符 */\n\n*temp\
  \ = *prog;\n\nprog++; /* 移动到下一个位置 */\n\ntemp++;\n\n*temp = '\\0';\n\nreturn (token_type\
