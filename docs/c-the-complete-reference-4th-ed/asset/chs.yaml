  assert_flight(\"Denver\", \"Los Angeles\", 1000);\n}\n```\n\n/* 将事实放入数据库。 */\n\n\
  ```c\nvoid assert_flight(char *from, char *to, int dist)\n{\nif(f_pos < MAX) {\n\
