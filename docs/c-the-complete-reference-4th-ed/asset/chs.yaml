  \ 12-2. C99 添加的头文件**\n\n### 头文件中的宏 (Macros in Headers)\n\n许多 C 标准函数既可以实现为实际函数，也可以实现为在头文件中定义的类函数宏。例如，`abs(\
  \ )` 返回其整数参数的绝对值，它可以被定义为宏，如下所示：\n\n```c\n#define abs(i) (i)<0 ? -(i) : (i)\n```\n\
  \n标准函数被定义为宏还是普通 C 函数通常没有影响。然而，在某些宏是不可接受的极少数情况下——例如，当需要最小化代码大小或参数不能被评估多次时——你必须创建一个真正的函数并替换该宏。有时\
  \ C 库本身也拥有一个可以用来替换宏的真实函数。（第 308 页）\n\n为了强制编译器使用真实函数，你需要防止编译器在遇到函数名时替换该宏。虽然有几种方法可以实现这一点，但到为止最好的方法是直接使用\
  \ `#undef` 取消宏定义。例如，为了强制编译器用真实定义的 `abs( )` 函数替换之前定义的宏，你可以在程序的开头处插入这行代码：\n\n```c\n\
  #undef abs\n```\n\n然后，由于 `abs` 不再被定义为宏，程序将使用函数版本。\n\n### 库函数的重定义 (Redefinition of\
  \ Library Functions)\n\n尽管链接器在不同实现之间可能略有不同，但它们的操作方式上是相同的。例如，如果你的程序由三个名为 `F1`、`F2`\
  \ 和 `F3` 的文件组成，链接器的命令行看起来如下：\n\n```\nLINK F1 F2 F3 LIBC\n```\n\n其中 `LIBC` 是标准库的。\n\
  \n**注意**\n\n*某些链接器会自动使用标准库，不需要显式指定。此外，集成程序开发环境通常会自动包含相应的库文件。*\n\n当链接过程开始时，链接器通常首先尝试仅通过文件\
  \ `F1`、`F2` 和 `F3` 来解析所有外部引用。一旦完成，如果仍然存在未解析的外部引用，则会搜索库。\n\n由于大多数链接器按照上述描述的顺序进行，因此你可以重新定义包含在标准库中的函数。例如，你可以创建自己的\
  \ `fwrite( )` 版本，以某种特殊方式处理文件输出。在这种情况下，当你链接一个包含你重定义的 `fwrite( )` 版本的程序时，该实现会被首先找到并被用于解析对它的所有引用。因此，当扫描库时，已经没有对\
  \ `fwrite( )` 函数的未解析引用了，它将不会从库中加载。\n\n在重定义库函数时必须非常小心，因为你可能会产生意想不到的副作用。程序的其他部分可能会使用你正在重定义的库函数。在这种情况下，其他部分将期望使用库函数，但得到的将是你的重定义的函数。例如，如果你重定义了\
  \ `fwrite( )` 并在程序的其他部分使用，可能会产生意外的结果。（第 309 页）\n\n\n\n\n/* 将一个文件复制到另一个文件 */\n\n\
  #include <stdio.h>\n#include <stdlib.h>\n\nint main(int argc, char *argv[])\n{\n\
  \    FILE *in, *out;\n    char ch;\n    if(argc!=3) {\n        printf(''You forgot\
  \ to enter a filename.\\n\");\n        exit(1);\n    }\n    if((in=fopen(argv[1],\
  \ \"rb\")) == NULL) {\n        printf(\"Cannot open input file.\\n\");\n       \
  \ exit:(1);\n    }\n    if((out=fopen(argv[2], \"wb\")) == NULL) {\n        printf(\"\
  Cannot open output file.\\n\");\n        exit(1);\n    }\n    while(!feof(in)) {\n\
  \        ch = getc(in);\n        if(ferror(in)) {\n            printf(\"Read Error\"\
  );\n            clearerr(in);\n            break;\n        } else {\n          \
  \  if(!feof(in)) putc(ch, out);\n            if(ferror(out)) {\n               \
  \ printf(\"Write Error\");\n                clearerr(out);\n                break;\n\
  \            }\n            TEAMFLY\n        }\n    }\n    fclose(in);\n    fclose(out);\n\
  \    return 0;\n}\n```\n\nTeam-Fly®\n\nPage 312\n\n### 相关函数\n`feof()`, `ferror()`,\
  \ 和 `perror()`\n\n`fclose`\n\n```c\n#include <stdio.h>\nint fclose(FILE * *stream*);\n\
  ```\n\n`fclose()` 函数关闭与 `stream` 关联的文件并刷新其缓冲区。调用 `fclose()` 之后，`stream` 不再与文件连接，任何自动分配的缓冲区都会被释放。\n\
  \n如果 `fclose()` 成功，则返回零；否则返回 `EOF`。尝试关闭一个已经关闭的文件是一个错误。在关闭文件之前移除存储介质也会产生错误，缺乏足够的可用磁盘空间也是如此。\n\
  \n### 示例\n以下代码打开并关闭一个文件：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint\
  \ main(void)\n{\n    FILE *fp;\n    if((fp=fopen(\"test\", \"rb\"))==NULL) {\n \
  \       printf(''Cannot open file.\\n\");\n        exit(1);\n    }\n    if(fclose(fp))\
  \ printf(\"File close error.\\n\");\n    return 0;\n}\n```\n\n### 相关函数\n`fopen()`,\
  \ `freopen()`, 和 `fflush()`\n\nPage 313\n\n`feof`\n\n```c\n#include <stdio.h>\n\
  int feof(FILE * *stream*);\n```\n\n`feof()` 函数判断与 `stream` 关联的文件是否已到达结束。\n\n如果文件位置指示器在文件末尾，则返回非零值；否则返回零。\n\
  \n一旦到达文件末尾，后续的读取操作将返回 `EOF`，直到调用 `rewind()` 或使用 `fseek()` 移动文件位置指示器。\n\n`feof()`\
  \ 函数在处理二进制文件时特别有用，因为文件结束标记也是一个有效的二进制整数。必须显式地调用 `feof()`，而不是简单地测试 `getc()` 的返回值，例如，为了确定何时到达二进制文件的末尾。\n\
  \n### 示例\n此代码段显示了读取文件末尾的一种方法：\n\n```c\n/*\n假设 fp 已经为了读操作而打开。\n*/\nwhile(!feof(fp))\
  \ getc(fp);\n```\n\n### 相关函数\n`clearerr()`, `ferror()`, `perror()`, `putc()`, 和\
  \ `getc()`\n\n`ferror`\n\n```c\n#include <stdio.h>\nint ferror(FILE * *stream*);\n\
  ```\n\n`ferror()` 函数检查给定 `stream` 上的文件错误。返回零表示没有发生错误，而非零值意味着发生了错误。\n\n要确定错误的确切性质，请使用\
  \ `perror()` 函数。\n\nPage 314\n\n### 示例\n以下代码段在发生文件错误时会中止程序执行：\n\n```c\n/*\n假设 fp\
  \ 指向一个为了写操作打开的流。\n*/\nwhile(!done) {\n    putc(info, fp);\n    if(ferror(fp)) {\n\
  \        printf(''File Error\\n\");\n        exit(1);\n    }\n}\n```\n\n### 相关函数\n\
  `clearerr()`, `feof()`, 和 `perror()`\n\n`fflush`\n\n```c\n#include <stdio.h>\nint\
  \ fflush(FILE * *stream*);\n```\n\n如果 `stream` 与一个为了写入打开的文件关联，调用 `fflush()` 会导致输出缓冲区的内容物理地写入文件。文件保持打开状态。\n\
  \n返回零表示成功；`EOF` 表示发生了写入错误。\n\n在程序正常终止或缓冲区满时，所有缓冲区都会自动刷新。\n\n此外，关闭文件会刷新其缓冲区。\n\n\
  ### 示例\n以下代码段在每次写入操作后刷新缓冲区：\n\n```c\n/*\n假设 fp 与一个输出文件关联。\n*/\nfor(i=0; i<MAX; i++)\
  \ {\n    fwrite(buf, sizeof(some_type), 1, fp);\n    fflush(fp);\n}\n```\n\n###\
  \ 相关函数\n`fclose()`, `fopen()`, `fread()`, `fwrite()`, `getc()`\n\n`getc`\n\n```c\n\
  #include <stdio.h>\nint getc(FILE * *stream*);\n```\n\n`getc()` 函数从指定的 `stream`\
  \ 获取下一个字符。如果文件位置指示器在文件末尾，则返回 `EOF`；否则返回非零。由于 `EOF` 是一个有效的二进制整数，在处理二进制文件时，必须显式地调用\
  \ `feof()` 而不是简单地测试 `getc()` 的返回值，例如，为了确定何时到达二进制文件的末尾。\n\n### 示例\n以下程序读取并显示文件的内容：\n\
  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(int argc, char *argv[])\n\
  {\n    FILE *fp;\n    char ch;\n    if((fp=fopen(argv[1], \"r\"))==NULL) {\n   \
  \     printf(''Cannot open file.\\n\");\n        exit(1);\n    }\n    while((ch=getc(fp))\
  \ != EOF) {\n        printf(\"%c\", ch);\n    }\n    fclose(fp);\n    return 0;\n\
  }\n```\n\n### 相关函数\n`fclose()`, `fopen()`, 和 `putc()`\n\n`fgetpos`\n\n```c\n#include\
  \ <stdio.h>\nint fgetpos(FILE * *stream*, fpos_t *position);\n```\n\n对于指定的流，`fgetpos()`\
  \ 函数将当前文件位置存储在 `position` 指向的对象中。`position` 的类型必须是 `fpos_t`。存储在那里的值在后续调用 `fsetpos()`\
  \ 时是有用的。在处理二进制文件时，必须使用 `feof()` 来判断是否到达末尾。\n\n如果发生错误，`fgetpos()` 返回非零；否则返回零。\n\n\
  ### 示例\n以下将当前文件位置存储在 `file_loc`：\n\n```c\nFILE *fp;\nfpos_t file_loc;\nfgetpos(fp,\
  \ &file_loc);\n```\n\n### 相关函数\n`fsetpos()`, `fseek()`, 和 `ftell()`\n\nPage 317\n\
  \n`fgets`\n\n```c\n#include <stdio.h>\nchar *fgets(char *str, int num, FILE *stream*);\n\
  ```\n\n`fgets()` 函数从 `stream` 读取最多 `num–1` 个字符并将它们存储在 `str` 指向的字符数组中。读取直到换行符、`EOF`\
  \ 或达到指定的限制。在读取字符后，在最后一个读取的字符之后存储一个空字符。换行符将被保留并成为 `str` 指向的数组的一部分。\n\n在 C99 中，*str*\
  \ 和 *stream* 被 `restrict` 限制。\n\n如果成功，`fgets()` 返回 *str*；失败时返回空指针。当发生错误或到达文件末尾时，由于函数都会返回空指针，因此你应该使用\
  \ `feof()` 或 `ferror()` 来确定实际发生了什么。\n\n### 示例\n此程序使用 `fgets()` 显示作为第一个命令行参数指定的文本文件的内容：\n\
  \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint main(int argc, char *argv[])\n\
  {\n    FILE *fp;\n    char str[128];\n    if((fp=fopen(argv[1], \"r\"))==NULL) {\n\
  \        printf(''Cannot open file.\\n\");\n        exit(1);\n    }\n    while(!feof(fp))\
  \ {\n        if(fgets(str, 126, fp)) printf(\"%s\", str);\n    }\n    fclose(fp);\n\
  \    return 0;\n}\n```\n\n\n\n\n\n`fopen( )` 函数打开一个由 `fname` 指向的文件，并返回与其关联的流。在文件上允许的操作类型由\
  \ `mode` 的值定义。`mode` 的合法值如表 13-1 所示。文件名必须是构成操作系统定义的有效文件名的字符字符串，如果环境支持，它还可以包含路径规范。\n\
  \n在 C99 中，`fname` 和 `mode` 由 `restrict` 限定符限定。\n\n如果 `fopen( )` 成功打开指定的文件，将返回一个\
  \ `FILE` 指针。如果无法打开文件，则返回一个空指针。\n\n### Mode (模式)\n\n| Mode | 含义 |\n| :--- | :---\
  \ |\n| \"r\" | 打开文本文件进行读取 |\n| \"w\" | 创建文本文件进行写入 |\n| \"a\" | 追加到文本文件 |\n| \"rb\"\
  \ | 打开二进制文件进行读取 |\n| \"wb\" | 创建二进制文件进行写入 |\n| \"ab\" | 追加到二进制文件 |\n| \"r+\" | 打开文本文件进行读写\
  \ |\n| \"w+\" | 创建文本文件进行读写 |\n| \"a+\" | 打开文本文件进行读写 |\n| \"rb+\" 或 \"r+b\" | 打开二进制文件进行读写\
  \ |\n| \"wb+\" 或 \"w+b\" | 创建二进制文件进行读写 |\n| \"ab+\" 或 \"a+b\" | 打开二进制文件进行读写 |\n\n\
  **表 13-1**。`fopen( )` 参数 `mode` 的合法值（第 319 页）\n\n如表所示，文件可以以文本或二进制模式打开。在文本模式下，可能会发生某些字符转换。例如，换行符可能会转换为回车/换行符序列。二进制文件不会发生此类转换。\n\
  \n此代码段说明了打开文件的正确方法：\n\n```c\nFILE *fp;\n\nif ((fp = fopen(\"test\", \"w\"))==NULL)\
  \ {\n    printf(\"Cannot open file.\\n\");\n    exit(1);\n}\n```\n\n此方法在尝试写入文件之前，会检测打开文件时的任何错误，例如写保护或磁盘满。\n\
  \n如果你使用 `fopen( )` 打开文件进行输出，任何同名的预存文件将被擦除并开始新文件。如果不存在同名文件，将将创建一个。为读取操作打开文件要求该文件存在。如果不存在，将返回错误。如果你想在文件末尾添加内容，必须使用模式\
  \ \"a\"。如果文件不存在，将创建它。\n\n在访问为读/写操作打开的文件时，在没有调用 `fflush( )`、`fseek( )`、`fsetpos(\
  \ )` 或 `rewind( )` 之前，不能在输出操作后跟随输入操作。同样，在没有调用上述函数之一之前，不能在输入操作后跟随输出操作，除非在输入过程中到达文件末尾。也就是说，输出可以在文件末尾直接跟随输入。\n\
  \n同时可以打开 `FOPEN_MAX` 个文件。`FOPEN_MAX` 定义在 `<stdio.h>` 中。\n\n### Example (示例)\n\n\
