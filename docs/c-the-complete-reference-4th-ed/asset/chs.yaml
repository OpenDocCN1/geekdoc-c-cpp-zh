  \ 和 `display()` 中，`systime` 的每个成员都是通过指针访问的。\n\n# 数组与结构体\n\n## 结构体中的数组\n\n结构体的成员可以是简单变量（如\
  \ `int` 或 `double`），也可以是聚合类型。在 C 语言中，聚合类型是数组和结构体。你已经见过一种聚合类型：数组。例如，考虑这个结构体：\n\n\
  ```c\nstruct x {\n    int a[10]; /* 10 个整数的数组 */\n    float b;\n} y;\n```\n\n等等，示例说是：\n\
  \n```c\nstruct emp {\n    struct address; /* 嵌套结构 */\n    float wage;\n} worker;\n\
  ```\n\n在这里，`emp` 结构体有两个成员。第一个是 `address` 结构，包含了员工地址。另一个是 `wage`，持有员工工资。以下代码将 93456\
  \ 赋值给 `address` 的 `zip` 元素：\n\n```c\nworker.address.zip = 93456;\n```\n\n 联合是一个由多个类型变量共享的内存位置。联合提供了一种以多种方式解释相同位模式的方法。声明**联合**与声明结构体相似。其通用形式为：\n\
  \n```c\nunion *tag* {\n    *type* *member-name*;\n    *type* *member-name*;\n  \
  \  *type* *member-name*;\n    .*\n    .*\n    .*\n} *union-variables*;\n```\n\n\
  例如：\n\n```c\nunion u_type {\n    int i;\n    char ch;\n};\n```\n\n此声明没有创建任何变量。你可以通过将名称放在声明的末尾或使用单独的语句来声明变量。要声明类型为\
  \ `u_type` 的联合变量 `cnvt`，编写 `union u_type cnvt;`。在 `cnvt` 中，整数 `i` 和字符 `ch` 共享同一个内存位置。当然，`i`\
  \ 占用 2 字节（假设整数为 2 字节），而 `ch` 只使用 1 字节。图 7-2 显示了 `i` 和 `ch` 共享相同的地址。\n\n图 7-2\n\n\
  `i` 和 `ch` 利用联合 `cnvt` 的方式（假设整数为 2 字节）\n\n\n\n\n当声明一个 `union` 变量时，编译器会自动分配足够的存储空间来容纳\
  \ `union` 中最大的成员。例如（假设整数为 2 字节），`cnvt` 的长度为 2 字节，因此它可以包含 `i`，即使 `ch` 只需要 1 字节。\n\
  \n访问 `union` 的成员时，使用与结构体相同的语法：点运算符和箭头运算符（运算符。如果你是直接对 `union` 进行操作，请使用点运算符。如果通过指针访问\
  \ `union`，请使用箭头运算符。例如，要将整数 10 赋值给 `cnvt` 的元素 `i`，写道：\n\n```c\ncnvt.i = 10;\n```\n\
  \n在下一个示例中，将 `cnvt` 的指针传递给一个函数：\n\n```c\nvoid func1(union u_type *un)\n{\n    un->i\
  \ = 10; /* 通过指针为 cnvt 赋值 10 */\n}\n```\n\n在需要特殊的类型转换时，`union` 被频繁使用，因为你可以从根本不同的方式来引用\
  \ `union` 中存储的数据。例如，你可能使用 `union` 来操作构成 `double` 的字节，以便更改其精度或执行某些不寻类型舍入。\n\n为了了解在需要非标准类型转换时\
  \ `union` 的用处，请考虑将 `short` 整数写入磁盘文件的问题。C 标准库没有定义专门用于向文件写入 `short` 整数的函数。虽然可以使用 `fwrite()`\
  \ 向文件写入任何类型的数据，但对于这种简单的操作，使用 `fwrite()` 会产生额外的开销。然而，使用 `union`，你可以轻松创建一个名为 `putw()`\
  \ 的函数，它可以逐字节地将 `short` 整数的二进制表示写入文件。（此示例假设 `short` 整数为 2 字节。）要查看如何操作，首先创建一个由一个 `short`\
  \ 整数和一个 2 字节字符数组组成的 `union`：\n\n```c\nunion pw {\n    short int i;\n    char ch[2];\n\
  };\n```\n\n现在，你可以使用 `pw` 来创建如下程序所示的 `putw()` 版本。\n\n```c\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n\nunion pw {\n    short int i;\n    char ch[2];\n};\n\nint putw(short\
  \ int num, FILE *fp);\n\nint main(void)\n{\n    FILE *fp;\n    fp = fopen(\"test.tmp\"\
  , \"wb+\");\n    if(fp == NULL) {\n        printf(\"Cannot open file.\\n\");\n \
  \       exit(1);\n    }\n    putw(1025, fp); /* 写入值 1025 */\n    fclose(fp);\n \
  \   return 0;\n}\n\nint putw(short int num, FILE *fp)\n{\n    union pw word;\n \
  \   word.i = num;\n    putc(word.ch[0], fp); /* 写入半部分 */\n    return putc(word.ch[1],\
  \ fp); /* 写入后半部分 */\n}\n```\n\n尽管调用 `putw()` 时使用的是 `short` 整数，但它仍然可以使用标准函数 `putc()`\
  \ 将整数中的每个字节逐字节写入磁盘文件。\n\n## 位域 (Bit-Fields)\n\n与某些其他计算机语言不同，C 语言有一种名为“位域”（bit-field）的内置功能，它允许你访问单个位。位域出于许多原因可能非常有用，例如：\n\
  \n-   如果存储空间有限，你可以在一个字节中存储多个布尔（真/假）变量。\n-   某些设备传输的状态信息被编码在字节内部中的一个或多个位中。\n-   某些加密例程需要访问字节内部的位。\n\
  \n虽然这些任务可以使用位运算符完成，但位域可以为你的代码增加更多的结构性（并可能提高效率）。\n\n位域必须是结构体或 union 的成员。它定义了字段的长度（以位为单位）。位域定义的通用形式为：\n\
  \n```c\ntype\nname:\nlength;\n```\n\n在这里，`type` 是位域的类型，`length` 是字段中的位数。位域的类型必须是\
  \ `int`、`signed` 或 `unsigned`。（C99 也允许位域的类型为 `_Bool`）。在分析来自硬件设备的输入时，经常使用位域。例如，串口通信适配器的状态端口可能会返回一个组织如下的状态字节：\n\
  \n| 位 | 设置时的含义 |\n| :--- | :--- |\n| 0 | 发送允许线 (clear-to-send line) 变化 |\n| 1 |\
  \ 数据准备就绪 (data-set-ready) 变化 |\n| 2 | 检测到下降沿 |\n| 3 | 接收线变化 |\n| 4 | 发送允许 (Clear-to-send)\
  \ |\n| 5 | 数据准备就绪 (Data-set-ready) |\n| 6 | 电话响铃 |\n| 7 | 接收信号 |\n\n你可以使用以下位域表示状态字节中的信息：\n\
  \n```c\nstruct status_type {\n    unsigned delta_cts: 1;\n    unsigned delta_dsr:\
  \ 1;\n    unsigned tr_edge: 1;\n    unsigned delta_rec: 1;\n    unsigned cts: 1;\n\
  \    unsigned dsr: 1;\n    unsigned ring: 1;\n    unsigned rec_line: 1;\n} status;\n\
  ```\n\n你可以使用像此处所示的语句使程序确定何时可以发送或接收数据：\n\n```c\nstatus = get_port_status();\nif(status.cts)\
  \ printf(\"clear to send\");\n```\n\n要使用初始化器进行赋值，只需在符号后紧跟等号和整数值即可。出现在初始化器之后的符号所分配的值将比前一个值大。\n\
  \n\n\n\n\n```c\nenum coin { penny, nickel, dime, quarter=100, half_dollar, dollar};\n\
  ```\n\n现在，这些符号的值为：\n`penny`: 0\n`nickel`: 1\n`dime`: 2\n`quarter`: 100\n`half_dollar`:\
  \ 101\n`dollar`: 102\n\n关于枚举，一个常见但错误的假设是符号可以被直接输入和输出。事实并非如此。例如，下这段代码片段将不会按预期方式运行：\n\
  \n```c\n/* 这将无法工作 */\nmoney = dollar;\nprintf(\"%s\", money);\n```\n\n请记住，`dollar`\
  \ 只是一个整数的名称；它不是一个字符串。因此，尝试将 `money` 作为字符串输出在本质上是无效的。出于相同的原因，你无法使用这段代码来实现预期结果：\n\n\
  ```c\n/* 这段代码是错误的 */\nstrcpy(money, \"dime\");\n```\n\n也就是说，包含符号名称的字符串不会自动转换为该符号。\n\
  \n实际上，编写用于输入和输出枚举符号是非常相当琐的（除非你乐于接受它们的整数值）。例如，你需要以下代码来用文字形式显示 `money` 包含的硬币：\n\n\
  ```c\nswitch(money) {\n    case penny: printf(\"penny\"); break;\n    case nickel:\
  \ printf(\"nickel\"); break;\n    case dime: printf(\"dime\"); break;\n    case\
  \ quarter: printf(\"quarter\"); break;\n    case half_dollar: printf(\"half_dollar\"\
  ); break;\n    case dollar: printf(\"dollar\");\n}\n```\n\n有时，你可以声明一个字符串数组，并使用枚举值作为索引，将该值翻译为相应的字符串。例如，这段代码也能输出正确的字符串：\n\
  \n```c\nchar name[][12]={\n    \"penny\",\n    \"nickel\",\n    \"dime\",\n    \"\
  quarter\",\n    \"half_dollar\",\n    \"dollar\"\n};\nprintf(\"%s\", name[money]);\n\
  ```\n\n当然，这只有在没有符号被初始化的情况下才有效，因为字符串数组的索引必须严格递增（增量为 1）并从 0 开始。\n\n由于枚举值必须手动转换为人类可读的字符串等效值才能进行\
  \ I/O 操作，它们在不进行此类转换的例程中最为有用。例如，枚举通常用于定义编译器的符号表。\n\n### C 和 C++ 之间的重要区别\n\nC 和 C++\
  \ 在结构体、联合体和枚举的类型名称之间存在着重要的区别。为了理解这种差异，请考虑以下结构声明：\n\n```c\nstruct MyStruct {\n  \
  \  int a;\n    int b;\n};\n```\n\n在 C 中，名称 `MyStruct` 被称为*tag*（标签）。要一个类型为 `MyStruct`\
  \ 的对象，你需要使用这样的语句：\n\n```c\nstruct MyStruct obj;\n```\n\n如你所示，标签名 `MyStruct` 之前有一个关键字\
  \ `struct`。然而，在 C++ 中，你可以使用这种更短的形式：\n\n```cpp\nMyStruct obj; /* 对 C++ OK，对 C 错误\
  \ */\n```\n\n在这里，不需要 `struct` 关键字。在 C++ 中，一旦声明了结构，你就可以仅使用标签来声明该类型的变量，而不需要在前面加上 `struct`\
  \ 关键字。这种差异的原因在于，在 C 中，结构的名称没有定义一个完整的类型名称。这就是为什么 C 将此名称称为标签。然而，在 C++ 中，结构体的名称是一个完整的类型名称，可以单独使用来定义变量。但请记住，在\
  \ C++ 程序中使用 C 风格的声明仍然是完全合。\n\n前面的讨论可以推广到联合体和枚举。因此，在 C 中，声明对象时，必须在标签名称之前加上 `struct`、`union`\
  \ 或 `enum` 关键字（取决于适用于哪种）。在 C++ 中，你不需要该关键字。\n\n由于 C++ 接受 C 风格的声明，在从 C 迁移到 C++ 时这个问题上不会产生麻烦。然而，如果你将\
  \ C++ 代码迁移到 C，你将需要进行相应的更改。\n\n### 使用 Sizeof 确保可移植性\n\n你已经看到结构体和联合体可以创建不同大小的变量，这些变量的实际大小可能会随机器而变化。`sizeof`\
  \ 运算符计算任何变量或类型的大小，并帮助消除程序中依赖于机器的代码。该运算符在涉及结构体或联合体时特别有用。\n\n对于后续讨论，假设一种实现具有此处所示数据类型的大小：\n\
  \n| 类型 | 字节（Bytes）大小 |\n| :--- | :--- |\n| char | 1 |\n| int | 4 |\n| double | 8\
  \ |\n\n因此，以下代码将在屏幕上打印 1, 4 和 8：\n\n```c\nchar ch;\nint i;\ndouble f;\nprintf(\"\
  %d\", sizeof(ch));\nprintf(\"%d\", sizeof(i));\nprintf(\"%d\", sizeof(f));\n```\n\
  \n结构体的大小大于或等于其成员的大小之和。例如：\n\n```c\nstruct s {\n    char ch;\n    int i;\n    double\
  \ f;\n} s_var;\n```\n\n在这里，`sizeof(s_var)` 至少是 13 (8+4+1)。然而，`s_var` 的可能会更大，因为编译器允许对结构进行填充以实现字字或段对齐。（一个段是\
  \ 16 字节）。由于结构体的大小可能大于其成员的大小之和，当你需要知道结构体大小时应始终使用 `sizeof`。例如，如果你想为 `s` 动态分配内存：\n\n\
  ```c\nstruct s *p;\np = malloc(sizeof(struct s));\n```\n\n由于 `sizeof` 是编译时运算符，计算大小所需的信息在编译时已知的。这对于**联合体**来说特别有意义，因为**联合体**的大小始终等于其最大的成员。例如，考虑\n\
  \n```c\nunion u {\n    char ch;\n    int i;\n    double f;\n} u_var;\n```\n\n###\
  \ typedef\n\n你可以通过 `typedef` 定义新的类型名称。你并没有实际上创建一个新类型，而是为现有类型定义一个新名称。这个过程可以使依赖机器的程序更具移植性。如果你为每个依赖机器的类型定义了自己的类型名称，那么在为新环境编译时只需更改\
  \ `typedef` 语句。`typedef` 还可以通过为标准数据类型提供描述性名称来辅助自说明。`typedef` 语句的通用形式是 `typedef *type*\
  \ *newname;`，其中 *type* 是任何有效数据类型，*newname* 是该类型的新名称。\n\n例如，你可以通过以下代码为 `float` 创建新名称：\n\
  \n```c\ntypedef float balance;\n```\n\n这条语句告诉编译器识别 `balance` 为 `float` 的另一个名称。接下来，你可以使用\
  \ `balance` 创建 `float` 变量：\n\n```c\nbalance over_due;\n```\n\n在这里，`over_due` 是类型为\
  \ `balance` 的浮点变量，而 `balance` 是 `float` 的另一个单词。\n\n现在 `balance` 已经定义，它可以用于另一个 `typedef`\
  \ 中。例如，\n\n```c\ntypedef balance overdraft;\n```\n\n告诉编译器识别 `overdraft` 为 `balance`\
  \ 的另一个名称，而 `balance` 是 `float` 的另一个名称。\n\n\n\n\n既有控制台 I/O 和文件 I/O 函数。从技术上讲，控制台 I/O\
  \ 和文件 I/O 之间没有区别。但在概念上，它们属于完全不同的世界。本章将详细检查控制台 I/O 函数。下一章将介绍文件 I/O 系统并描述这两个系统之间的关系。\n\
  \n除一个例外外，本章仅涵盖标准 C（Standard C）定义的控制台 I/O 函数。标准 C 没有定义任何执行各种屏幕控制操作（如光标定位）或显示图形的函数，因为这些操作在不同机器之间差异巨大。它也没有定义任何向\
  \ Windows 窗口或对话框写入内容的函数。相反，控制台 I/O 函数仅执行基于 TTY 的输出。然而，大多数编译器在它们的库中都包含了适用于编译器设计运行环境的屏幕控制和图形函数。当然，你可以用\
  \ C 语言编写 Windows 程序，只是 C 语言没有定义直接执行这些任务的函数。\n\n本章将控制台 I/O 函数称为从键盘输入和向屏幕输出。实际上，这些函数操作的对象是标准输入（stdin）和标准输出（stdout）。此外，标准输入和标准输出可以重定向到其他设备。因此，“控制台函数”并不一定在控制台上操作。I/O\
  \ 重定向将在第 9 章介绍。在本章中，假设标准输入和标准输出没有重定向。\n\n**注意**\n\n除了 I/O 函数外，C++ 还包含了 I/O 运算符。然而，这些运算符不支持\
  \ C 语言。\n\n## 读取和写入字符\n\n最简单的控制台 I/O 函数是 `getchar()`，它从键盘读取一个字符，以及 `putchar()`，它将一个字符写入屏幕。`getchar()`\
  \ 函数会等待按下按键，然后返回其值。按键也会自动回显（echo）到屏幕上。`putchar()` 函数在当前光标位置向屏幕写入一个字符。`getchar()`\
  \ 和 `putchar()` 的原型显示在此：\n\n```c\nint getchar(void);\nint putchar(int c);\n```\n\
  \n正如其原型所示，`getchar()` 被声明为返回一个整数。然而，你可以像通常的那样将此值赋值给 `char` 变量，因为字符包含在低位中（高位字节通常为\
  \ 0）。如果发生错误，`getchar()` 返回 `EOF`。\n\n（`EOF` 宏定义在 `<stdio.h>` 中，通常等于 –1。）在 `putchar()`\
  \ 的情况下，尽管它被声明为接受整数参数，但你通常会使用字符参数调用它。只有参数的低位字节会被输出到屏幕。`putchar()` 函数返回写入的字符，如果发生错误则返回\
  \ `EOF`。\n\n以下程序演示了 `getchar()` 和 `putchar()`。它从键盘输入字符并以反转的大小显示。也就是说，它将大写打印为小写，将小写打印为大写。要停止程序，请输入点。\n\
  \n```c\n#include <stdio.h>\n#include <ctype.h>\n\nint main(void)\n{\n    char ch;\n\
  \    printf(\"Enter some text (type a period to quit).\\n\");\n    do {\n      \
  \  ch = getchar();\n        if(islower(ch)) ch = toupper(ch);\n        else ch =\
  \ tolower(ch);\n        putchar(ch);\n    } while (ch != '.');\n    return 0;\n\
  }\n```\n\n### getchar() 的问题\n\n`getchar()` 有一些潜在的问题。对于许多编译器，`getchar()` 的实现方式是缓冲输入直到按下\
  \ ENTER 键。这被称为行缓冲（line-buffered）输入；你必须在返回字符之前按下 ENTER。此外，由于 `getchar()` 每次调用只输入一个字符，行缓冲可能会让一个或多个字符留在输入队列中等待，这在交互式环境中令人烦恼。尽管\
  \ `getchar()` 实现为交互式函数是允许的，但很少这样做。因此，如果前面的程序运行不符合你的预期，你现在知道原因了。\n\n### getchar()\
  \ 的替代方案\n\n由于你的编译器实现 `getchar()` 的方式可能使其在交互式环境中并不好用，你可能想使用不同的函数来从键盘读取字符。标准 C 没有定义任何保证提供交互式输入的函数，但实际上几乎所有的\
  \ C 编译器都提供了。尽管这些函数没有由标准 C 定义，但它们被广泛使用，因为 `getchar()` 不能满足大多数编译者的需求。\n\n两个最常见的替代函数\
  \ `getch()` 和 `getche()` 具有以下原型：\n\n```c\nint getch(void);\nint getche(void);\n\
  ```\n\n对于大多数编译器，这些函数的原型位于 `<conio.h>` 头文件中。对于某些编译器，这些函数开头有一个下划线。例如，在微软的 Visual C++\
  \ 中，它们被称为 `_getch()` 和 `_getche()`。\n\n`getch()` 函数等待按键按下后立即返回。它不会将字符回显到屏幕上。`getche()`\
  \ 函数与 `getch()` 相同，但按键会被回显。在交互式程序中需要从键盘读取字符时，你经常会看到使用 `getche()` 或 `getch()` 代替\
  \ `getchar()`。例如，之前的程序使用 `getch()` 代替 `getchar()` 的版本如下：\n\n```c\n#include <stdio.h>\n\
  #include <conio.h>\n#include <ctype.h>\n\nint main(void)\n{\n    char ch;\n    printf(\"\
  Enter some text (type a period to quit).\\n\");\n    do {\n        ch = getch();\n\
  \        if(islower(ch)) ch = toupper(ch);\n        else ch = tolower(ch);\n   \
  \     putchar(ch);\n    } while (ch != '.');\n    return 0;\n}\n```\n\n当你运行这个版本的程序时，每次按下按键，字符立即传输到程序并反转大小显示。输入不再是行缓冲。虽然书中的代码不会进一步使用\
  \ `getch()` 或 `getche()`，但它们在你编写的程序可能是很有用的。\n\n**注意**\n\n在本书期间，使用 Microsoft C++\
  \ 编译器时，`_getche()` 和 `_getch()` 与标准 C 函数（如 `scanf()` 或 `gets()`）不兼容。相反，你必须使用特殊版本的函数，如\
  \ `cscanf()` 或 `cgets()`。你需要查看详细信息。\n\n## 读取和写入字符串\n\n控制台 I/O 在复杂性和功能上的下一步是 `gets()`\
  \ 和 `puts()` 函数。它们允许你读取和写入字符字符串。\n\n`gets()` 函数读取从键盘输入的字符字符串，并将其存储在参数指向的位置。你可以在键盘上输入字符直到击击回车。回车不会成为字符串的一部分；相反，字符串末尾会放置一个空终止符，`gets()`\
  \ 返回。事实上，你无法使用 `gets()` 返回回车（尽管 `getchar()` 可以）。你可以在按下 ENTER 之前使用退格键纠正输入错误。`gets()`\
  \ 的原型为：\n\n```c\nchar *gets(char *str);\n```\n\n其中 *str* 是指向接收用户输入字符的数组的指针。`gets()`\
  \ 也返回 *str*。以下程序将字符串读入数组 `str` 并打印其长度：\n\n```c\n#include <stdio.h>\n#include <string.h>\n\
  \nint main (void)\n{\n    char str[80];\n    gets(str);\n    printf(\"Length is\
  \ %d\", strlen(str));\n    return 0;\n}\n```\n\n在使用 `gets()` 时你必须小心，因为它对接收输入的数组不进行任何边界检查。因此，用户可能会输入超过数组容量的字符。\n\
  \n\n\n\n虽然 `gets()` 对于仅供自己示例程序和简单的实用程序来说没有问题，但在商业代码中，你会避免使用它。另一种替代方案是下一章描述的 `fgets()`\
  \ 函数，它允许你防止数组越界。\n\n`puts()` 函数将其字符串参数写入屏幕，并在后面跟一个换行符。它的原型是 `int puts(const char\
  \ *str);`。\n\n`puts()` 识别与 `printf()` 相同的反斜杠转义序列，例如用于制表符的 `\\t`。调用 `puts()` 的开销远小于相同调用\
  \ `printf()`，因为 `puts()` 只能输出字符字符串——它不能输出数字或进行格式转换。因此，`puts()` 占用的空间比 `printf()`\
  \ 小，运行速度更快。由于这个原因，在不需要格式转换时，通常使用 `puts()` 函数。\n\n`puts()` 函数在成功时返回非负值，在发生错误时返回 `EOF`。然而，在写入控制台时，通常可以假设不会发生错误，因此很少监控\
  \ `puts()` 的返回值。以下语句显示了 **hello**：\n\n```c\nputs(\"hello\");\n```\n\n表 8-1 总结了基本的控制台\
  \ I/O 函数。\n\n| 函数 | 操作 |\n| :--- | :--- |\n| `getchar()` | 从键盘读取一个字符；通常等待回车。 |\n\
  | `getche()` | 带回显读取一个字符；不等待回车；标准 C 未定义，但是一种常见的扩展。 |\n| `getch()` | 不带回显读取一个字符；不等待回车；标准\
  \ C 未定义，但是一种常见的扩展。 |\n| `putchar()` | 将一个字符写入屏幕。 |\n| `gets()` | 从键盘读取一个字符串。 |\n\
