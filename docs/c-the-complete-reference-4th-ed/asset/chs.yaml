  {\n    int i, j;\n    for(i=0; i<3; i++)\n    for(j=0; j<3; j++) matrix[i][j] =\
  \ ' ';\n}\n\n/* 获取玩家移动 */\nvoid get_player_move(void)\n{\n    int x, y;\n    printf(\"\
  Enter X,Y coordinates for your move: \");\n    scanf(\"%d,%d\", &x, &y);\n    x--;\
