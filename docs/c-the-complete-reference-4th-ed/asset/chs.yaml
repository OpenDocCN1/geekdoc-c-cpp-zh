  \ `LCLIB.C` 中。\n\n\n\n本章介绍的 Little C 解释器设计时考虑了操作的透明性。目标是开发一个能够以最少精力被轻松理解的解释器。它的设计也便于扩展。因此，Little\
  \ C 运行并不特别快或高效；但解释器的基本结构是正确的，你可以通过本节描述的步骤来提高它的执行速度。\n\n几乎所有的商业解释器都扩展了预扫描器（prescanner）的作用。被解释的整个源程序都会从\
  \ ASCII 人类可读格式转换为内部形式。在这个内部形式中，除了引号字符串和常量外，所有内容都被转换成了单整数标记（tokens），这就像 Little C\
  \ 将 C 关键字转换为单整数标记的方式一样。你可能注意到 Little C 执行了许多字符串比较。例如，每当搜索变量或函数时，都会进行多次字符串比较。字符串比较在时间上是非常昂贵的的；然而，如果将源程序中的每个标记转换为整数，就可以使用速度得多的整数比较。将源程序转换为内部形式是你为了提高\
  \ Little C 效率所能做的**唯一最重要的改变**。坦率地说，速度的提升将是巨大的。\n\n另一个改进领域（主要对大型程序有意义）是变量和函数的查找例程。即使你将这些项转换为整数标记，目前的搜索方法仍然依赖于顺序搜索。然而，你可以替换为其他更快的方法，例如二叉树或某种哈希方法。\n\
  \n如前所述，Little C 相对于完整的 C 语法有一个限制，是：诸如 `if` 等语句的对象——即使是单条语句——必须是包含在大括号之间的代码块。原因在于这极大地简化了\
  \ `find_eob()` 函数，该函数用于在执行完一个控制语句后找到代码块的结尾。`find_eob()` 函数简单地寻找一个右大括号，以匹配开始代码块的左大括号。你可能会发现移除这个限制是一个有趣的练习。实现这一点的某种方法是重新设计\
  \ `find_eob()`，使其能够找到语句、表达式或块的结尾。但请记住，当将 `if`、`while`、`do-while` 和 `for` 语句作为单条语句使用时，你需要使用不同的方法来寻找它们的结尾。\n\
  \n### 扩展 Little C\n\n你可以从两个通用领域来扩展和增强 Little C 解释器：C 特性和辅助性功能。其中一些将在后续章节中简要讨论。\n\
  \n### 添加新的 C 特性\n\n你可以向 Little C 中添加两类基本的 C 语句。第一类是额外的动作语句，例如 `switch`、`goto` 以及\
  \ `break` 和 `continue` 语句。如果你仔细研究 Little C 已经解释的语句结构，那么添加其中任何一个都应该没有太大困难。\n\n第二类你可以添加的\
  \ C 语句是对新数据类型的支持。Little C 已经包含了额外数据类型的“钩子”。例如，`var_type` 结构已经包含一个用于变量类型的字段。要添加其他基本类型（例如\
  \ `float`、`double` 和 `long`），只需增加值字段的大小到你想要存储的最大元素的大小即可。\n\n支持指针并不比支持任何其他数据类型困难。然而，你需要为表达式解析器添加对指针运算符的支持。\n\
  \n一旦实现了指针，数组就会变得简单。数组的空间应该使用 `malloc()` 动态分配，并将数组指针存储在 `var_type` 的 `value` 字段中。\n\
  \n结构体（structs）和联合体（unions）的增加了一个稍微困难的问题。处理它们最简单的方法是使用 `malloc()` 为对象分配空间，然后将对象的指针存储在\
  \ `var_type` 结构的 `value` 字段中。（你还需要特殊代码来处理作为参数传递的结构和联合体。）\n\n为了处理函数的不同返回值，你需要利用 `func_type`\
  \ 结构中的 `ret_type` 字段。该字段定义了函数返回的数据类型。它目前已被设置，但尚未未使用。\n\n你可能还想尝试允许 Little C 接受 `//`\
  \ 式的注释。这一变化发生在 `get_token()` 内部，很容易实现。\n\n最后一点想法——如果你喜欢实验语言结构，不要害怕添加非 C 的扩展。到目前为止，我在语言解释器上获得的最趣的体验就是让它们执行语言未指定的任务。例如，如果你想添加一个类似\
  \ Pascal 的 `REPEAT-UNTIL` 结构，尽管去做吧！如果某些东西第一次不起作用，尝试通过打印处理的每个标记来寻找问题。\n\n### 添加辅助性功能\n\
  \n解释器赋予了你添加几个有趣且有用功能的机会。例如，你可以添加一个在执行时显示每个标记的跟踪设施。你还可以添加在程序执行时显示每个变量的内容。你可能想要添加的另一个功能是集成编辑器，这样你就可以“边编辑边运行”，而无需使用单独的编辑器来创建你的\
  \ C 程序。\n\n### 索引\n\n- `&` (位运算符), 49, 50\n- `&` (指针运算符), 53-55, 121, 186, 189\n\
