  ```\n\n### 相关函数\n（后续内容因原文重复，此处已按逻辑完成核心翻译）\n\n\n\n\n`scanf()` 函数是一个通用的输入例程，它读取输入流\
  \ `stdin`并将信息存储在其参数列表中指向的变量中。它可以读取所有内置数据类型，并自动将它们转换为适当的内部格式。\n\n在 C99 中，`format`\
  \ 被 `restrict` 修饰符限定。\n\n由 `format` 指向的控制字符串由三类字符组成：\n- 格式说明符\n- 空白字符\n- 非空白字符\n\
  \n（第 341 页）\n\n输入格式说明符以 `%` 符号开头，告诉 `scanf()` 下一个要读取什么类型的数据。\n\n格式说明符列表 13-3 所示。例如，`%s`\
  \ 读取字符串，而 `%d` 读取一个整数。格式字符串从左到右读取，格式说明符会与构成参数列表的参数顺序匹配。\n\n要读取一个长整数，请在格式说明符前面加一个\
  \ `l` (*ell*)。要读取一个短整数，请在格式说明符前面加一个 `h`。这些修饰符可以与 `d`、`i`、`o`、`u` 和 `x` 格式代码配合使用。\n\
  \n### 表 13-3. `scanf()` 格式说明符\n\n| 代码 | 含义 |\n| :--- | :--- |\n| `%a` | 读取浮点值（C99\
  \ 专用） |\n| `%A` | 与 `%a` 相同（C99 专用） |\n| `%c` | 读取单个字符 |\n| `%d` | 读取十进制整数 |\n|\
  \ `%i` | 读取十进制、八进制或十六进制整数 |\n| `%e` | 读取浮点数 |\n| `%E` | 与 `%e` 相同 |\n| `%f` | 读取浮点数\
  \ |\n| `%F` | 与 `%f` 相同（C99 专用） |\n| `%g` | 读取浮点数 |\n| `%G` | 与 `%g` 相同 |\n| `%o`\
  \ | 读取八进制数 |\n| `%s` | 读取字符串 |\n| `%x` | 读取十六进制数 |\n| `%X` | 与 `%x` 相同 |\n| `%p`\
  \ | 读取指针 |\n| `%n` | 接收一个等于已读取字符数的整数值 |\n| `%u` | 读取无符号十进制整数 |\n| `%[ ]` | 扫描字符集\
  \ |\n| `%%` | 读取百分号 |\n\n（第 342 页）\n\n默认情况下，`a`、`f`、`e` 和 `g` 告诉 `scanf()` 将数据赋值给\
  \ `float`。如果你在这些说明符之一前面加一个 `l` (*ell*)，`scanf()` 将数据赋值给 `double`。使用 `L` 则告诉 `scanf()`\
  \ 接收数据的变量是 `long double`。\n\n如果你正在使用支持 1995 年添加的宽字符特征的现代编译器，可以使用 `L` 修饰符（很可能是 `L`\
  \ 修饰符）配合 `c` 格式代码，以表示指向类型为 `whchar_t` 的宽字符的指针。你也可以在 `s` 格式代码上使用 `l` 修饰符来表示指向宽字符字符串的指针。\n\
  \n`l` 也可用于修饰扫描集以指示宽字符。\n\n格式字符串中的空白字符会导致 `scanf()` 跳过输入流中的一个或多个空白字符。空白字符可以是空格、制表符或换行符。本质上，控制字符串中的一个空白字符会导致\
  \ `scanf()` 读取但不存储直到遇到第一个非空白字符之前的任意数量（包括零）的空白字符。\n\n格式字符串中的非空白字符会导致 `scanf()` 读取并丢弃匹配的字符。例如，`%d,%d`\
  \ 会导致 `scanf()` 先读取一个整数，然后读取并丢弃逗号，最后读取另一个整数。如果未找到指定的字符，`scanf()` 将终止。\n\n所有通过 `scanf()`\
  \ 接收值的变量必须通过它们的地址传递。这意味着所有参数必须是指向指向变量的指针。\n\n在输入流中，项之间必须用空格、制表符或换行符分隔。逗号、分号等标点符号不视为分隔符。这意味着：\n\
  \n```\nscanf(\"%d%d\", &r, &c);\n```\n\n将接受输入 `10 20`，但在处理 `10,20` 时会失败。\n\n在 `%`\
  \ 之后、格式代码之前放置 `*` 将读取指定类型的数据但抑制其赋值。因此，以下命令：\n\n```\nscanf(\"%d%*c%d\", &x, &y);\n\
  ```\n\n给定输入 `10/20`，将值 10 放入 `x`，丢弃除号，并给 `y` 赋值 20。\n\n格式命令可以指定最大字段长度修饰符。这是一个放置在\
  \ `%` 和格式代码之间的整数，限制了为任何字段读取的字符数。\n\n例如，如果你希望向 `address` 中读取不少于 20 个字符，你会写道：\n```\n\
  scanf(\"%20s\", address);\n```\n\n（第 343 页）\n\n如果输入流大于 20 个字符，后续的输入调用将从该调用中断的地方开始。如果遇到空白字符，字段的输入可能会达到最大字段长度之前结束。在这种情况下，`scanf()`\
  \ 将移动到下一个字段。\n\n虽然空格、制表符和换行符被用作字段分隔，但在读取单个字符时，它们像其他字符一样被读取。例如：\n```\nscanf(\"%c%c%c\"\
  , &a, &b, &c);\n```\n\n将读取包括空格在内的三个字符。\n\n注意：除了格式命令外，控制字符串中的其他字符——包括空格、制表符和换行符——也将被用于匹配和丢弃。例如，给定输入流\
  \ `10t20`：\n\n```\nscanf(\"%dt%d\", &x, &y);\n```\n\n将在 `x` 中放入 10，在 `y` 中放入 20。由于控制字符串中的\
  \ `t`，`t` 被丢弃。\n\n`scanf()` 的另一个功能称为*扫描集*（scanset）。扫描集定义了一组将被 `scanf()` 读取并赋值给相应数组的字符。扫描集通过将要扫描的字符放在方括号内来定义。起始方括号必须以百分号开头。例如，此扫描集告诉\
  \ `scanf()` 只读取字符 A、B 和 C：\n\n```\n%[ABC]\n```\n\n使用扫描集时，`scanf()` 继续读取字符并将它们放入相应的数组，直到遇到不在扫描集中的字符。相应的变量必须是字符数组的指针。`scanf()`\
  \ 返回后，数组将包含一个空结尾的字符串。\n\n如果集的第一个字符是 `^`，则指定一个反集。当存在 `^` 时，它指示 `scanf()` 接受不在扫描集定义的任何字符。\n\
  \n对于许多实现，你可以使用连字符指定范围。例如，这告诉 `scanf()` 接受 A 到 Z 的字符：\n\n```\n%[A-Z]\n```\n\n一个需要记住的重要点是扫描集是对大小敏感的。因此，如果你想扫描大写和小字母，必须分别指定它们。\n\
  \n`scanf()` 函数返回的数值等于成功赋值的字段数量。此数字不包括由于使用了 `*` 修饰符而被读取但未赋值的字段。如果在第一个字段赋值之前发生错误，则返回\
  \ `EOF`。\n\n（第 344 页）\n\n### C99 添加的 scanf( ) 格式修饰符\n\nC99 为 `scanf()` 增加了几个格式修饰符：`hh`、`ll`、`j`、`z`\
  \ 和 `t`。`hh` 修饰符可以应用于 `d`、`i`、`o`、`u`、`x` 或 `n`。它指定相应的参数是指向 `signed` 或 `unsigned\
  \ char` 值的指针。`ll` 修饰符也可以应用于 `d`、`i`、`o`、`u`、`x` 或 `n`。它指定相应的参数是指向 `signed` 或 `unsigned\
