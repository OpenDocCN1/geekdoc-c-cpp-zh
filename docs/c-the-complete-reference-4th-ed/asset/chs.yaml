  \nprog++; *temp = '\\0';\n\nreturn (token_type = STRING);\n\n}\n\nif(isdigit(*prog))\
  \ { /* 数字 */\n\nwhile(!isdelim(*prog)) *temp++ = *prog++;\n\n*temp = '\\0';\n\n\
  return (token_type = NUMBER);\n\n}\n\nif(isalpha(*prog)) { /* 变量或命令 */\n\nwhile(!isdelim(*prog))\
