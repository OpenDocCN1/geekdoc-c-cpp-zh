  \ token_type;\n\n}\n```\n\nPage 728\n\n`get_token()` 函数使用了以下全局数据和枚举类型：`extern char\
  \ *prog;` /* 源代码中的当前位置 */\n\n`extern char *p_buf;` /* 指向程序缓冲区起始 */\n\n`extern char\
