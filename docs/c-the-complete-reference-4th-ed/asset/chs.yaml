  \ 25-8 显示了通往目标的最小成本路径。\n\n### 最小成本搜索的分析\n\n最小成本搜索和爬爬算法具有相同的优缺点，但方向相反。\n\n可能会出现伪山谷、低地和峡谷，但最小成本搜索通常运行得相当好。\n\
  \n然而，不要假设仅仅因为最小成本搜索在这个问题上的表现优于爬爬算法，就意味着它在一般情况下都更好。唯一能说，平均而言，它的表现会优于盲目搜索。\n\n## 选择搜索技术\n\
  \n正如你所看到的，启发式技术平均而言通常比盲目搜索更好。\n\n然而，并不总是可以使用启发式搜索，因为可能没有足够的信息来判断下一个节点位于通往目标路径上的概率。因此，选择搜索方法的规则分为两类：一类适用于可以使用启发式搜索的问题，另一类适用于不能使用的的问题。\n\
  \n如果你无法对问题应用启发式算法，深度优先搜索通常是最好的方法。唯一的例外是你知道某些信息，表明广度优先搜索会更好。\n\n在爬爬算法和最小成本搜索之间的选择，实际上是决定你试图最小化或最大化什么约束。通常情况下，爬爬算法产生一个访问节点最少的解决方案，而最小成本搜索找到一条精力最少的路径。\n\
