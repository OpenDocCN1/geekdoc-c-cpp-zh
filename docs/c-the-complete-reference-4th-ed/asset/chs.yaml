  n', start->name);\nstart = start->next;\n}\n}\n```\n\n当调用 `display()` 时，`start`\
  \ 必须是列表第一个元素的指针。之后，`next` 字段指向下一个项。过程在 `next` 为空时停止。\n\n从列表中检索项就像跟随链一样简单。基于 `name`\
