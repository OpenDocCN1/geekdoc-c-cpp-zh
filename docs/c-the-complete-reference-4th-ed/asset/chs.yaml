  \ |\n| `<stdint.h>` | 定义标准的、移植的整数类型。该头文件被 `<inttypes.h>` 。 |\n| `<tgmath.h>` | 类型泛型浮点宏。\
  \ |\n| `<wchar.h>` | 1995 年添加，支持多字节字符函数。 |\n| `<wctype.h>` | 1995 年添加，支持多字节字符分类函数。\
  \ |\n\n### `__func__` 预定义标识符\n\nC99 定义了 `__func__`，它指定出现 `__func__` 的函数名称（字符串字面量）。例如：\n\
  \n```c\nvoid StrUpper(char *str)\n{\n    static int i = 0;\n    i++;\n    printf(\"\
  %s has been called %d time(s).\\n\", __func__, i);\n    while(*str) {\n        *str\
  \ = toupper(*str);\n        str++;\n    }\n}\n```\n\n第一次调用时，`StrUpper()` 将显示如下输出：\n\
  \nStrUpper has been called 1 time(s).\n\n### 不再支持隐式 int\n\n\n\n\n\n几年前，C++ 删弃了隐式\
  \ `int` 规则，随着 C99 的出现，C 也紧随其后。在 C89 中，隐式 `int` 规则规定，在没有显式类型说明符的情况下，假设类型为 `int`。隐式\
  \ `int` 规则最常见的用法是函数的返回类型。在过去，C 程序员在声明返回 `int` 值的函数时，通常会省略 `int`。例如，在 C 的早期，`main()`\
  \ 经常是这样写的：\n\n```c\nmain ()\n{\n/* . . . */\n}\n```\n\n在这种方法中，返回类型被允许直接默认为 `int`。在\
  \ C99（以及 C++）中，这种默认情况不再发生，必须显式指定 `int`，正如本书中的所有程序那样。\n\n这里是另一个例子。在过去，像这样的函数\n\n\
  ```c\nint isEven(int val)\n{\n  return !(val%2);\n}\n```\n\n通常会被写成这样：\n\n```c\n\
  /* 使用整数默认值 */\nisEven (int val)\n{\n  return !(val%2);\n}\n```\n\n在第一种情况下，返回类型 `int`\
  \ 是显式指定的。在第二种情况下，它是被默认假设的。\n\n隐式 `int` 规则不仅适用于函数返回值（尽管这是它最常见的用法）。例如，对于 C89 及更早版本，`isEven()`\
  \ 函数也可以写成这样：\n\n```c\nisEven(const val)\n{\n  return ! (val%2);\n}\n```\n\n在这里，参数\
  \ `val` 也也默认为 `int`——在在这种情况下是 `const int`。同样，C99 不支持这种向 `int` 的默认值转换。\n\n### 注意\n\
  从技术上讲，兼容 C99 的编译器在报告警告错误后，可以接受包含隐式 `int` 的代码。这允许旧代码被编译。然而，并没有要求兼容 C99 的编译器必须接受此类代码。\n\
  \n### 隐式函数声明已被移除\n\n在 C89 中，如果一个函数在没有先进行显式声明的情况下被调用，则会创建该函数的隐式声明。该隐式声明具有如下形式：\n\n\
  ```c\nextern\nint *name*();\n```\n\nC99 不再支持隐式函数声明。\n\n### 注意\n从技术上讲，兼容 C99 的编译器在报告警告错误后，可以接受包含隐式函数声明的代码。这允许旧代码被编译。然而，并没有要求兼容\
  \ C99 的编译器必须接受此类代码。\n\n### 对返回的限制\n\n在 C89 中，具有非 `void` 返回类型的函数（即按理说返回值的函数）可以使用不包含句的\
  \ `return` 语句。尽管这会导致未定义行为，但在技术上讲它并不是非法的。在 C99 中，非 `void` 函数*必须*使用返回一个值的 `return`\
  \ 语句。也就是说，在 C99 中，如果一个函数被指定为返回值，则内部的任何 `return` 语句都必须关联一个值。因此，以下函数对于 C89 技术上是有效的，但对于\
  \ C99 是无效的：\n\n```c\nint f(void)\n{\n  /* . . . */\n  return ; // 在 C99 中，此语句必须返回一个值\n\
  }\n```\n\n### 扩展整数类型\n\nC99 在 `<stdint.h>` 中定义了若干扩展整数类型。扩展类型包括精确宽度、最小宽度、最大宽度以及最快整数类型。以下是示例：\n\
  \n| 扩展类型 | 含义 |\n| :--- | :--- |\n| int16_t | 正好包含 16 位的整数 |\n| int_least16_t |\
  \ 至少包含 16 位的整数 |\n| int_fast32_t | 至少 32 位的最快整数类型 |\n| intmax_t | 最大的整数类型 |\n| uintmax_t\
  \ | 最大的无符号整数类型 |\n\n扩展类型让你更容易编写可移植的代码。它们在第三部分有更详细的描述。\n\n### 整数提升规则的变更\n\nC99 增强了整数提升规则。在\
  \ C89 中，`char`、`short int` 或 `int` 位域字段的值可以在表达式中代替 `int` 或 `unsigned int`。如果提升后的值可以用\
  \ `int` 容纳，则提升为 `int`；否则，原始值被提升为 `unsigned int`。\n\n在 C99 中，每种整数类型都分配了一个*权级*（rank）。例如，`long\
  \ long int` 的权级大于 `int`，`int` 大于 `char`以此此类推。在表达式中，任何权级小于 `int` 或 `unsigned int`\
  \ 的整数类型都可以代替 `int` 或 `unsigned int`。\n\n# 第三部分——C 标准库\n\n本书的第三部分探讨了 C 标准库。第 12 章讨论了链接、库和头文件。第\
  \ 13 章到 20 章描述了标准库中的函数，每个章节都集中于特定的函数子系统。\n\n本书描述了由 C89 和 C99 定义的标准函数。C99 包含了 C89\
  \ 指定的所有函数。因此，如果你有一个兼容 C99 的编译器，你将能够使用第三部分描述的所有函数。如果你在使用兼容 C89 的编译器，[某些可能不可用]。\n\n\
  ## 第 12 章—链接、库和头文件\n\n在编写 C 编译器时，工作实际上有两个部分。首先，必须创建编译器本身。编译器将源代码翻译成目标代码。其次，必须实现标准库。令人惊讶的是，编译器的开发相对容易。通常，库函数需要更多的时间精力。原因之一是，许多函数（如\
  \ I/O 系统）必须与编写编译器的操作系统进行交互。\n\n此外，C 标准库定义了大量且化的函数。事实上，正是标准库的丰富性和灵活性使 C 与许多语言区别开。\n\
  \n### 链接器\n\n链接器有两个功能。第一个正如其名，是合并（链接）各种目标代码。第二个是解析它正在合并的文件中的调用和加载指令的地址。为了理解它的操作，让我们仔细查看独立编译的过程。\n\
  \n### 独立编译\n\n*独立编译是一项允许将程序分解两个或多个文件，分别编译，然后链接成最终的可执行程序。编译器的输出是目标文件，链接器的输出是可执行文件。链接器物理上将链接列表中指定的文件合并到一个程序文件中并解析外部引用。*\n\
  \n当一个文件的代码引用另一个文件的代码时，就会创建一个*外部引用*。这可以通过函数调用或对全局变量的引用来实现。例如，当这里显示的两个文件链接时，文件 2 对\
  \ `count`（在文件 1 中声明）的引用必须被解析。\n\n链接器告诉文件 2 中的代码 `count` 将何处找到。\n\n**文件 1**\n```c\n\
  int count;\nvoid display(void);\n```\n\n**文件 2**\n```c\n#include <stdio.h>\nvoid\
  \ display(void);\nextern int count;\n\nint main(void)\n{\n  count = 10;\n  printf(\"\
  %d\", count);\n  display();\n  return 0;\n}\n\nvoid display(void)\n{\n  /* 实现 */\n\
  }\n```\n\n\n\n\n\n类似地，链接器会告诉文件 1 函数 `display()` 所在的位置，以便进行调用。\n\n当编译器为 `display()`\
  \ 生成对象代码时，它会为 `count` 的地址替换一个占位符，因为编译器无法得知 `count` 在何处。编译 `main()` 时也会发生类似的情况。由于\
  \ `display()` 的地址是未知的，因此使用了占位符。当这两个文件链接在一起时，这些占位符会被替换为相应项目的地址。这些地址是绝对地址还是可重定位地址，取决于你的运行环境。\n\
  \n### 可重定位代码 vs. 绝对代码\n\n对于大多数现代环境，链接器的输出是*可重定位代码*（relocatable code）。这种对象代码可以在任何足够容纳它的可用内存区域中运行。在可重定位的对象文件中，每个调用指令或加载指令的地址不是固定的，而是相对的。因此，可重定位代码中的地址是相对于程序开头的偏移量。当程序被加载到内存中执行时，加载器会将相对地址转换为与程序加载内存相对应的物理地址。\n\
  \n对于某些环境，例如所有程序都使用相同地址空间的专用控制器，链接器的输出实际上包含了物理地址。在这种情况下，链接器的输出是*绝对代码*（absolute code）。\n\
  \n### 使用覆盖层（Overlays）进行链接\n\n尽管已不再常见，但某些环境的 C 编译器除了标准链接器外，还提供一个覆盖链接器。*覆盖链接器*的工作方式与普通链接器类似，但它还可以创建覆盖层。*覆盖*是一段存储在磁盘文件中、仅在需要时才加载并执行的对象代码。覆盖层加载到的内存位置被称为*覆盖区域*（overlay\
  \ region）。覆盖允许你创建并运行比可用内存更大的程序，因为内存中只保留正在使用的程序部分。\n\n为了理解覆盖层是如何工作的，假设你有一个程序由七个对象文件（名为\
  \ `F1` 到 `F7`）组成。同样假设，如果所有对象文件都以普通方式链接，可用内存将不足以运行该程序——在耗尽内存之前你只能链接前五个文件。为了解决这一问题，指示链接器创建由文件\
  \ `F5`、`F6` 和 `F7` 组成的覆盖层。每当这些文件中的任一个函数被调用时，*覆盖管理器*（由链接器提供）会找到适当的文件并将其放入覆盖区域，允许执行继续。文件\
  \ `F1` 到 `F4` 中的代码始终驻留在内存中。图 12-1 描述了这种情况。\n\n正如你所猜的，覆盖层的主要优势是它们允许你编写非常大的程序。主要的缺点——这也是覆盖层通常作为最后手段的原因——是加载过程需要时间，对整体执行速度有显著影响。出于这个原因，你应该将相关的函数分组。\n\
  \n![](img/index-334_1.png)\n\n第 304 页\n\n图 12-1 如果你必须使用覆盖层，请将它们在内存在一起，以减少覆盖加载的次数。例如，如果应用程序是一个邮件列表，将所有排序程序放在一个覆盖层中，将打印程序放在另一个中，以此此类推，是合理的。\n\
  \n如所述，在今天的现代计算环境中并不常用覆盖层。\n\n### 与 DLL 链接\n\nWindows 提供了另一种链接形式，称为*动态链接*（dynamic\
  \ linking）。动态链接是函数对象代码在调用它的程序执行之前保留在磁盘上独立文件中的过程。当程序执行时，程序所需的动态链接函数也会被加载。动态链接函数存在于一种特殊的库中，称为*动态链接库*（Dynamic\
  \ Link Library），简称 `DLL`。\n\n使用动态链接库的主要优势是可执行程序的大小大大减少，因为每个程序都不需要存储其所使用的库函数的冗余副本。此外，当\
  \ `DLL` 函数更新时，使用它们的程序将自动获得收益。\n\n尽管 C 标准库未包含在动态链接库中，但许多其他类型的函数包含了。例如，当你为 Windows\
  \ 编写程序时，整套 API（应用程序接口）函数都存储在 `DLLs` 中。幸运的是，相对于你的 C 程序，库函数是存储在 `DLL` 中还是在普通库文件中通常并不重要。\n\
  \n第 305 页\n\n### C 标准库\n\nANSI/ISO C 标准定义了 C 标准库的内容和形式。也就是说，C 标准规定了所有标准编译器必须支持的一组函数。然而，编译器可以自由提供标准未指定的额外函数。（事实上，大多数编译器都是如此。）例如，编译器拥有图形函数、鼠标处理程序等是常见现象，尽管这些函数中没有一个是被标准\
  \ C 定义。只要你不将程序迁移到新环境，就可以在不产生任何负面后果的情况下使用这些非标准函数。但是，如果你的代码必须具有可移植性，则必须限制这些函数的使用。从实际应用角度来看，几乎所有非复杂的\
  \ C 程序都会使用非标准函数，因此你不必仅仅因为它们不是标准函数库的一部分就回避使用它们。\n\n### 库文件 vs. 对象文件\n\n虽然库与对象文件相似，但它们有一个重要的区别。当你链接对象文件时，每个对象文件的全部内容都会成为最终可执行文件的一部分。无论代码是否被实际使用如此。库文件并非如此。\n\
  \n库是函数的集合。与对象文件不同，库文件单独存储每个函数。当你的程序使用库包含的函数时，链接器会查找该函数并将其代码添加到程序中。通过这种方式，只有你在程序中实际使用的函数——而不是整个库的内容——会被添加到可执行文件中。因为在使用库时是选择性地添加到程序，所以\
  \ C 标准函数包含在库而不是对象文件中。\n\n#### 头文件\n\nC 标准库中定义的每个函数都有与其相关的头文件。与程序中使用的函数相关的头文件通过 `#include`\
  \ 引入。头文件承担着两个重要工作。首先，标准库中的许多函数与其特定的数据类型一起工作，你的程序必须访问这些类型。这些数据类型定义在与每个函数相关的头文件中。最常见的例子之一是文件系统头\
  \ `<stdio.h>`，它提供了磁盘文件操作所需的 `FILE` 类型。\n\n引入头文件的第二个原因是获取标准库函数的原型。\n\n函数原型允许编译器执行更强的类型检查。虽然原型在技术上是可选的，但在实践中是必要的。而且，C++\
  \ 要求原型。本书中的所有程序都包含了完整的原型。\n\n第 306 页\n\n表 12-1 显示了 C89 定义的标准头文件。表 12-2 显示了 C99 添加的头文件。\n\
  \n标准 C 保留了以下划线开头并跟随下划线或大写字母的标识符名称供头文件使用。\n\n\n\n\n正如第一部分所述，头文件通常是文件，但它们并不一定是文件。编译器允许在内部预定义头文件的内容。然而，出于所有实际用途考虑，标准\
  \ C 头文件都包含在与其名称对应的文件中。\n\n第三部分的剩余章节将描述标准库中的每个函数，并指出对于每个函数来说，哪些头文件是必要的。\n\n### 头文件\
