  Figure 25-4\nA\ntree\nversion\nof\nXYZ's\nflight\n\n### 深度优先搜索\n\n`depth-first search`\
  \ 在尝试其他路径之前会探索每条可能的路径。为了准确理解它是如何工作的，考虑以下树。F 是目标。\n\n![](img/index-646_1.jpg)\n\n\
  Page 614\n深度优先搜索遍历图的顺序如下：ABDBACF。如果你熟悉树，你会识别出这种搜索是中序遍历的一种变体。也就是说，路径向左移动，直到到达终端节点或找到目标。如果到达终端节点，路径回溯一级，向右移动，然后向左移动，直到遇到目标或终端节点。重复此过程，直到找到目标或搜索空间中的最后一个节点被检查完毕。\n\
  \n正如你所看到的，深度优先搜索能够找到目标，因为在最坏的情况下它退化为穷举搜索。在这个例子中，如果目标是 G，则会导致穷举搜索。\n\n编写一个寻找纽约到洛杉矶路线的\
  \ C 程序需要一个包含 XYZ 航班信息的数据库。数据库中的每个条目必须包含出发和目的城市、它们之间的距离，以及有助于回溯的标记（你稍后就会看到）。以下结构包含了此类信息：\n\
  \n```c\n#define MAX 100\n\n/* 航班数据库的结构 */\nstruct FL {\n    char from[20];\n   \
  \ char to[20];\n    int distance;\n    char skip; /* 用于回溯 */\n};\n\nstruct FL flight\n\
  ```\n\n\n\n\n`[MAX];` /* 数据库结构数组\n\n`int f_pos = 0;` /* 航班数据库中的项数\n\n`int find_pos\
  \ = 0;` /* 搜索航班数据库的索引\n\n单个条目通过函数 `assert_flight()` 被放入数据库，而 `setup()` 初始化了所有的航班信息。全局变量\
  \ `f_pos` 存储数据库中最后一个项的索引。\n\n这些例程显示在此：\n\n```c\nvoid setup(void)\n{\nassert_flight(\"\
  New York\", \"Chicago\", 1000);\nassert_flight(\"Chicago\", \"Denver\", 1000);\n\
  assert_flight(\"New York\", \"Toronto\", 800);\nassert_flight(\"New York\", \"Denver\"\
  , 1900);\nassert_flight(\"Toronto\", \"Calgary\", 1500);\nassert_flight(\"Toronto\"\
  , \"Los Angeles\", 1800);\nassert_flight(\"Toronto\", \"Chicago\", 500);\nassert_flight(\"\
