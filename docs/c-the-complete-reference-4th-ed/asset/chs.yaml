  \ i >= call_stack[functos-1]; i--)\n\nif(!strcmp(local_var_stack[i].var_name, s))\n\
  \nreturn 1;\n\n/* 否则，尝试全局变量 */\n\nfor(i=0; i < NUM_GLOBAL_VARS; i++)\n\nif(!strcmp(global_vars[i].var_name,\
  \ s))\n\nreturn 1;\n\nreturn 0;\n}\n\n/* 执行 if 语句。 */\n\nvoid exec_if(void)\n\n\
  {\n\nint cond;\n\neval_exp(&cond); /* 获取 if 表达式 */\n\nif(cond) { /* 为真，跳转到 IF 目标\
  \ */\n\ninterp_block();\n\nelse { /* 否则跳过 IF 块并处理存在的 ELSE */\n\nfind_eob(); /* 找到下一行的起始位置\
  \ */\n\nget_token();\n\nif(tok != ELSE) {\n\nputback(); /* 如果没有 ELSE，则恢复 token */\n\
  \nreturn;\n\n}\n\ninterp_block();\n\n}\n\n/* 执行 while 循环。 */\n\nvoid exec_while(void)\n\
  \n{\n\nint cond;\n\nchar *temp;\n\nputback();\n\ntemp = prog; /* 保存 while 循环顶部的位置\
  \ */\n\nget_token();\n\neval_exp(&cond); /* 检查条件表达式 */\n\nif(cond) interp_block();\
  \ /* 如果为真，则解释执行 */\n\nelse { /* 否则，跳过循环 */\n\nfind_eob();\n\nreturn;\n\n}\n\nprog\
  \ = temp; /* 回到循环顶部 */\n\n}\n```\n\n\n\n\n\n```c\ndo { /* 处理逗号分隔列表 */\n    get_token();\
  \ /* 获取变量名 */\n    strcpy(i.var_name, token);\n    local_push(i);\n    get_token\
  \ ();\n} while(*token == ',');\n```\n\n```c\n/* 推入局部变量。 */\nvoid local_push(struct\
  \ var_type i)\n{\n    if(lvartos > NUM_LOCAL_VARS)\n        sntx_err(TOO_MANY_LVARS);\n\
  \    local_var_stack[lvartos] = i;\n    lvartos++;\n}\n```\n\n `decl_local()` 函数首先读取正在声明的变量或变量的类型，并将初始值设置为零。接下来，它进入一个循环，读取由逗号分隔的标识符列表。\n\
  \n在每次循环中，每个变量的信息都会推入局部变量栈中。在最后，会检查最后一个标记以确保它包含一个分号。\n\n### 调用用户定义函数\n\n实现 C 语言解释器最困难的部分可能是执行用户定义函数。解释器不仅需要从新位置开始读取源代码，并在函数结束后返回调用程序，而且必须处理这些任务：参数传递、参数分配以及函数的返回值。\n\
  \n所有函数调用（对 `main()` 的初始调用外）都是通过表达式解析器从 `atom()` 函数调用 `call()` 完成的。第 768 页的 `call()`\
  \ 函数实际上处理了调用函数的细节。这里展示了 `call()` 函数以及两个辅助函数。让我们仔细检查这些函数。\n\n```c\n/* 调用函数。 */\n\
  void call(void)\n{\n    char *loc, *temp;\n    int lvartemp;\n    loc = find_func(token);\
  \ /* 查找函数入口 */\n    if(loc == NULL)\n        sntx_err(FUNC_UNDEF); /* 函数未定义 */\n\
  \    else {\n        lvartemp = lvartos; /* 保存局部变量栈索引 */\n        get_args(); /*\
  \ 获取函数参数 */\n        temp = prog; /* 保存返回位置 */\n        func_push(lvartemp); /*\
  \ 保存局部变量栈索引 */\n        prog = loc; /* 将 prog 重置到函数起始 */\n        get_params();\
  \ /* 使用参数值加载函数参数 */\n        interp_block(); /* 解释函数 */\n        prog = temp; /*\
  \ 重置程序指针 */\n        lvartos = func_pop(); /* 重置局部变量栈 */\n    }\n}\n```\n\n```c\n\
  /* 将函数的参数推入局部变量栈。 */\nvoid get_args(void)\n{\n    int value, count, temp[NUM_PARAMS];\n\
  \    struct var_type i;\n    count = 0;\n    get_token();\n    if(*token != '(')\
  \ sntx_err(PAREN_EXPECTED);\n    /* 处理逗号分隔的值列表 */\n    do {\n        eval_exp(&value);\n\
  \        temp[count] = value; /* 临时保存 */\n        get_token();\n        Page 769\n\
  \        count++;\n    } while(*token == ',');\n    count--;\n    /* 现在，按反序推入 local_var_stack\
  \ */\n    for(; count>=0; count--) {\n        i.value = temp[count];\n        i.v_type\
  \ = ARG;\n        local_plush(i);\n    }\n}\n```\n\n```c\n/* 获取函数参数。 */\nvoid get_params(void)\n\
  {\n    struct var_type *p;\n    int i;\n    i = lvartos-1;\n    do { /* 处理逗号分隔的参数列表\
  \ */\n        get_token();\n        p = &local_var_stack[i];\n        if(*token\
  \ != ')' ) {\n            if(tok != INT && tok != CHAR)\n                sntx_err(TYPE_EXPECTED);\n\
  \            p->v_type = token_type;\n            get_token();\n            /* 将参数名与已经在局部变量栈上的参数关联\
  \ */\n            strcpy(p->var_name, token);\n            get_token();\n      \
  \      i--;\n        }\n        else break;\n    } while(*token == ',');\n    if(*token\
  \ != ')') sntx_err(PAREN_EXPECTED);\n}\n```\n\n`call()` 做的第一件事是通过调用 `find_func()`\
  \ 找到源代码中指定函数的入口位置。接下来，它将局部变量栈索引 `lvartos` 的当前值保存到 `lvartemp` 中；然后调用 `get_args()`\
  \ 处理第 770 页的任何函数参数。`get_args()` 函数读取逗号分隔的表达式列表，并按反序将其推入局部变量栈。（反序推入表达式是为了更容易地与其对应的参数进行匹配。）当值被推入时，它们还没有被命名。参数的名字由\
  \ `get_params()` 函数赋予它们，稍后我们将讨论讨论。\n\n一旦处理完函数参数，`prog` 的当前值就会保存在 `temp` 中。该位置是函数的返回点。接下来，`lvartemp`\
  \ 的值被推入函数调用栈。`func_push()` 和 `func_pop()` 例程维护该栈。它的作用是存储每次调用函数时 `lvartos` 的值。这个值代表了相对于被调用函数而言，变量（以及参数）在局部变量栈上的起始点。`func_push()`\
  \ 和 `func_pop()` 例程维护该栈。它的作用是存储每次调用函数时 `lvartos` 的值。这个值代表了相对于被调用函数而言，变量（以及参数）在局部变量栈上的起始点。`func_push()`\
  \ 和 `func_pop()` 例程维护该栈。它的作用是存储每次调用函数时 `lvartos` 的值。这个值代表了相对于被调用函数而言，变量（以及参数）在局部变量栈上的起始点。\n\
  \n等等，`assign_var()` 如何知道在每次赋值中哪个变量正在被赋予值？答案很简单：首先，在 C 语言中，局部变量优先于全局变量；其次，局部变量在自身的函数外部是不可知的。要查看我们如何使用这些规则来解决上述赋值，请查看此处\
  \ `assign_var()` 函数：\n\n```c\n/* 从函数返回。 */\nvoid func_ret(void)\n{\n    int value;\n\
  \    value = 0;\n    /* 获取返回值，如果有的话 */\n    eval_exp(&value);\n    ret_value = value;\n\
  }\n```\n\n实际上，让我们根据指令重新格式化提供的文本。\n\n### 给变量赋值\n\n让我们短暂回到表达式解析器。当遇到赋值语句时，表达式右侧的值会被计算，然后通过\
  \ `call()` 赋值给左侧的变量。然而，正如你所知，C 语言是有结构的并且支持全局和局部变量。因此，给定如下程序：\n\n```c\nint count;\n\
  int main()\n{\n    int count, i;\n    count = 100;\n    i = f();\n    return 0;\n\
  }\n\nint f()\n{\n    int count;\n    count = 99;\n    return;\n}\n```\n\n`assign_var()`\
  \ 如何知道在每次赋值中哪个变量正在被赋予值？答案很简单：首先，在 C 语言中，局部变量优先于全局变量；其次，局部变量在自身的函数外部是不可知的。要查看我们如何使用这些规则来解决上述赋值，请查看此处\
  \ `assign_var()` 函数：\n\n```c\n/* 给变量赋值。 */\nvoid assign_var(char *var_name, int\
  \ value)\n{\n    register int i;\n    /* 首先，检查它是否为局部变量 */\n    for(i=lvartos-1;\
  \ i >= call_stack[functos-1]; i--) {\n        if(!strcmp(local_var_stack[i].var_name,\
  \ var_name)) {\n            Page 772\n            local_var_stack[i].value = value;\n\
  \            return;\n        }\n    }\n    if(i < call_stack[functos-1])\n    /*\
  \ 如果不是局部，尝试全局变量表 */\n    for(i=0; i < NUM_GLOBAL_VARS; i++)\n        if(!strcmp(global_vars[i].var_name,\
  \ var_name)) {\n            global_vars[i].value = value;\n            return;\n\
  \        }\n    }\n    sntx_err(NOT_VAR); /* 未找到变量 */\n}\n```\n\n\n\n\n因此，`assign_var()`\
  \ 函数首先搜索 `local_var_stack`，从当前的栈顶值开始，并在索引达到由上一次函数调用保存的值时停止。这种机制确保了只有该函数的局部变量才会被检查。（这也有助于支持递归函数，因为每次调用函数时，都会保存\
  \ `lvartos` 的当前值。）因此，`main()` 中的行 `count = 100;` 会导致 `assign_var()` 在 `main()` 内部找到局部变量\
  \ `count`。在 `f()` 中，`assign_var()` 找到了它自己的 `count`，而没有找到 `main()` 中的那一个。\n\n如果没有局部变量与变量名匹配，则会搜索全局变量列表。\n\
  \n### 执行 if\n\n### 语句\n\n现在 Little C 解释器的基本结构已经就绪，是时候添加一些控制语句了。每当在 `interp_block()`\
  \ 内部遇到关键字语句时，都会调用相应的函数来处理该语句。其中最简单的是 `if`。`if` 语句由 `exec_if()` 处理，如下所示：\n\n```\n\
  /* 执行一个 if 语句 */\nvoid exec_if(void)\n{\n    int cond;\n    eval_exp(&cond); /*\
  \ 获取 if 表达式 */\n    if(cond) { /* 如果真，则处理 IF 的目标 */\n        interp_block();\n \
  \   }\n    else { /* 否则跳过 IF 块并\n        处理 ELSE，如果存在的话 */\n        find_eob();\
  \ /* 找到下一行的开始 */\n        get_token();\n        if(tok != ELSE) {\n            putback();\
  \ /* 如果没有 ELSE，则恢复标记 */\n            return;\n        }\n        interp_block();\n\
  \    }\n}\n```\n\n让我们仔细观察这个函数。该函数的第一要工作是通过调用 `eval_exp()` 计算条件表达式的值。如果条件（`cond`）为真（非零），函数将递归调用\
  \ `interp_block()`，允许 `if` 块执行。如果 `cond` 为假，则调用 `find_eob()`，它会将程序指针移动到 `if` 块结束之后的位置。如果存在\
  \ `else`，则由 `exec_if()` 处理 `else` 并执行 `else` 块。否则，执行将直接从下一行代码开始。\n\n如果 `if` 块执行且存在\
  \ `else` 块，那么必须有一种方法可以跳过 `else` 块。这在 `interp_block()` 中通过简单调用 `find_eob()` 在遇到 `else`\
  \ 时跳过该块来实现。记住，在（语法正确的程序）中，`interp_block()` 处理 `else` 的唯一时刻是在 `if` 块执行之后。当 `else`\
  \ 块执行时，`else` 将由 `exec_if()` 处理。\n\n### 处理 while 循环\n\n`while` 循环像 `if` 一样，很容易解释。实际执行此任务的函数\
  \ `exec_while()` 如下所示：\n\n```\n/* 执行一个 while 循环 */\nvoid exec_while(void)\n{\n \
  \   int cond;\n    char *temp;\n    putback();\n    temp = prog; /* 保存 while 循环顶的位置\
  \ */\n    get_token();\n    eval_exp(&cond); /* 检查条件表达式 */\n    if(cond) interp_block();\
  \ /* 如果真，则解释 */\n    else { /* 否则，跳过循环 */\n        find_eob();\n        return;\n\
  \    }\n    prog = temp; /* 回到顶部 */\n}\n```\n\n`exec_while()` 的工作原理如下：首先，将 `while`\
  \ 标记放回输入流，并将 `while` 的位置保存到 `temp` 中。该地址将用于允许解释器跳回 `while` 的顶部。接下来，重新读取 `while`\
  \ 以将其从输入流中移除，并调用 `eval_exp()` 来计算 `while` 条件表达式的值。如果条件表达式为真，则递归调用 `interp_block()`\
  \ 来解释 `while` 块。当 `interp_block()` 返回时，`prog`（程序指针）被加载为 `while` 循环开始的位置，控制返回到 `interp_block()`，并在那里重复整个过程。如果条件表达式为假，则找到\
  \ `while` 块的末尾，函数返回。\n\n### 处理 do-while 循环\n\n`do-while` 循环的处理方式与 `while` 很多相似。当\
  \ `interp_block()` 遇到 `do` 语句时，它会调用 `exec_do()`，如下所示：\n\n```\n/* 执行一个 do 循环 */\n\
  void exec_do(void)\n{\n    int cond;\n    char *temp;\n    putback();\n    temp\
  \ = prog; /* 保存 do 循环顶的位置 */\n    get_token(); /* 获取循环的开始 */\n    interp_block();\
  \ /* 解释循环 */\n    get_token();\n    if(tok != WHILE) sntx_err(WHILE_EXPECTED);\n\
  \    eval_exp(&cond); /* 检查循环条件 */\n    if(cond) prog = temp; /* 如果真则循环；否则\n   \
  \ 继续执行 */\n}\n```\n\n`do-while` 循环与 `while` 循环的主要区别在于 `do` 至少执行一次其块。因此，`exec_do()`\
  \ 首先保存循环顶部的位置，然后调用 `interp_block()` 解释块。当 `interp_block()` 返回时，会获取 `while` 标记并评估条件表达式。如果条件为真，`prog`\
  \ 重置为循环顶部；否则，继续执行。\n\n### for 循环\n\n`for` 循环的解释比其他结构更具挑战性。部分原因在于 `for` 的条件表达式必须在循环顶部检查，但增量部分发生在底部。然而，通过一些工作，`for`\
  \ 可以被正确解释。\n\n当 `interp_block()` 遇到 `for` 语句时，会调用 `exec_for()`。该函数如下：\n\n```\n/*\
  \ 执行一个 for 循环 */\nvoid exec_for(void)\n{\n    int cond;\n    char *temp, *temp2;\n\
  \    int brace;\n    get_token();\n    eval_exp(&cond); /* 初始化表达式 */\n    if(*token\
  \ != ';') sntx_err(SEMI_EXPECTED);\n    prog++; /* 跳过分号 */\n    temp = prog;\n \
  \   for(;;) {\n        eval_exp(&cond); /* 检查条件 */\n        if(*token != ';') sntx_err(SEMI_EXPECTED);\n\
  \        prog++; /* 跳过分号 */\n        temp2 = prog;\n        /* 找到 for 块的开始 */\n\
  \        brace = 1;\n        while(brace) {\n            get_token();\n        \
  \    if(*token == '(') brace++;\n            if(*token == ')') brace--;\n      \
  \  }\n        if(cond) interp_block(); /* 如果真，则解释 */\n        else { /* 否则，跳过循环\
  \ */\n            find_eob();\n            return;\n        }\n        prog = temp2;\n\
  \        eval_exp(&cond); /* 执行增量 */\n        prog = temp; /* 回到顶部 */\n    }\n}\n\
  ```\n\n该函数首先处理 `for` 中的初始化表达式。`for` 的初始化部分只执行一次且不构成循环的一部分。接下来，程序指针移动到初始化语句结束的分号之后的位置，并将其值赋值给\
  \ `temp`。然后建立一个循环，该循环检查 `for` 的条件部分，并将 `temp2` 指向增量部分的开始。找到循环代码的开头，最后，如果条件表达式为真，则解释循环块。\n\
  \n（否则，找到块的末尾，执行在 `for` 循环之后继续。）当递归调用 `interp_block()` 返回时，执行循环的增量部分，并重复整个过程。\n\n\
  \n\n由于 Little C 执行的 C 程序从不经过编译和链接，因此它们使用的任何库函数都必须由 Little C 直接处理。实现此点的最佳方法是创建一个接口函数，当\
  \ Little C 遇到库函数时会调用该函数。该接口函数会设置对库函数的调用并处理任何返回值。\n\n由于空间限制，Little C 仅包含五个“库”函数：`getche()`、`putch()`、`puts()`、`print()`\
  \ 和 `getnum()`。在这些函数中，只有向屏幕输出字符串 Page（第 777 页）的 `puts()` 是标准 C 的一部分。`getche()` 函数是\
  \ C 语言用于交互环境的常用扩展。它会等待并返回键盘上按下的按键。该函数在许多编译器中都可以找到。`putch()` 也由许多设计用于交互环境的编译器定义。它将一个单字符参数输出到控制台。它不进行输出缓冲。`getnum()`\
  \ 和 `print()` 函数是我个人的创作。`getnum()` 函数返回在键盘上输入的数字的等效整数。`print()` 函数是一个非常实用的函数，可以在屏幕上输出字符串或整数参数。这五个库函数以原型形式在此显示：\n\
  \n```c\nint getche(void); /* 从键盘读取一个字符并返回其值 */\nint putch(char ch); /* 向屏幕写入一个字符\
  \ */\nint puts(char *s); /* 向屏幕写入一个字符串 */\nint getnum(void); /* 从键盘读取一个整数并返回其值 */\n\
  int print(char *s); /* 向屏幕写入一个字符串 */\nor\nint print(int i); /* 向屏幕写入一个整数 */\n```\n\
  \n此处显示 Little C 库函数。你应该调用文件 `LCLIB.C`。\n\n```c\n/****** 库函数 *******/\n\n/* 在此处添加你自己的函数\
  \ */\n\n#include <conio.h> /* 如果你的编译器不支持此头文件，请将其删除 */\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n\nextern char *prog; /* 指向程序中的当前位置 */\nextern char token[80]; /* 存储\
  \ token 的字符串表示 */\nextern char token_type; /* 包含 token 的类型 */\nextern char tok;\
  \ /* 存储 token 的内部表示 */\n\nenum tok_types {DELIMITER, IDENTIFIER, NUMBER, KEYWORD,\
  \ TEMP, STRING, BLOCK};\n\n/* 这些是在发生语法错误时调用 sntx_err() 使用的常量。如果需要，可以添加更多。\n第 778\
  \ 页\n注意：SYNTAX 是当其他其他消息似乎都不合适时使用的通用错误消息。\n*/\n\nenum error_msg\n{{SYNTAX, UNBAL_PARENS,\
  \ NO_EXP, EQUALS_EXPECTED,\n  NOT_VAR, PARAM_ERR, SEMI_EXPECTED,\n  UNBAL_BRACES,\
  \ FUNC_UNDEF, TYPE_EXPECTED,\n  NEST_FUNC, RET_NOCALL, PAREN_EXPECTED,\n  WHILE_EXPECTED,\
  \ QUOTE_EXPECTED, NOT_STRING,\n  TOO_MANY_LVARS, DIV_BY_ZERO};\n\nint get_token(void);\n\
  void sntx_err(int error);\nvoid eval_exp(int *result);\nvoid putback(void);\n\n\
  /* 从控制台读取一个字符。（如果你的编译器不支持 _getche()，请使用 getchar()） */\nint call_getche()\n{\n  \
  \  char ch;\n    ch = _getche();\n    while(*prog != ')') prog++; /* 移动到行尾 */\n\
  \    return ch;\n}\n\n/* 将字符放入显示器 */\nint call_putch()\n{\n    int value;\n    eval_exp(&value);\n\
