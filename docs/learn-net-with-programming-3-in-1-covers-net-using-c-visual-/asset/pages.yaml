    # 3.13 Cross Page Posting In ASP.NET


    ASP.NET by default, submits the form to the same page. Cross page posting is submitting
    the form to a different page. This is usually required when you are creating a
    multi page form to collect information from the user on each page. When moving
    from the source to the target page, the values of controls in the source page
    can be accessed in the target page.


    To use cross-page posting, you have to use the postbackurl attribute to specify
    the page you want to post to.


    Follow these steps :


    Step 1: Create a new ASP.NET website called crosspageposting. By default, the
    website is created with'
