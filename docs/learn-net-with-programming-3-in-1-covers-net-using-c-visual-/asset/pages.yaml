  md: 'common application tasks such as reading and writing to the file system.


    # ASP.NET


    ASP.NET is a web framework designed and developed by Microsoft. It is used to
    develop websites, web applications, and web services. It provides a fantastic
    integration of HTML, CSS, and javascript. It was first released in January 2002.


    # ADO.NET


    ADO.NET is a module of .Net Framework, which is used to establish a connection
    between application and data sources. Data sources can be such as SQL Server and
    XML. ADO .NET consists of classes that can be used to connect, retrieve, insert,
    and delete data.


    # WPF (Windows Presentation Foundation)


    Windows Presentation Foundation (WPF) is a graphical subsystem by Microsoft for
    rendering user interfaces in Windows-based applications. WPF, previously known
    as "Avalon", was initially released as part of .NET Framework 3.0 in 2006. WPF
    uses directx.


    # WCF (Windows Communication Foundation)


    It is a framework for building service-oriented applications. Using WCF, you can
    send data as asynchronous messages from one service endpoint to another.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# WF (Workflow Foundation)


    Windows Workflow Foundation (WF) is a Microsoft technology that provides an API,
    an in-process workflow engine, and a rehostable designer to implement long-running
    processes as workflows within .NET applications.


    # LINQ (Language Integrated Query)


    It is a query language, introduced in .NET 3.5 framework. It is used to make the
    query for data sources with C# or Visual Basics programming languages.


    # Entity Framework


    It is an ORM based open source framework which is used to work with a database
    using .NET objects. It eliminates a lot of developers effort to handle the database.
    It is Microsoft''s recommended technology to deal with the database.


    # 1.6 Garbage collection


    +   - The garbage collector (GC) manages the allocation and release of memory.
    The garbage collector serves as an automatic memory manager.

    +   - You do not need to know how to allocate and release memory or manage the
    lifetime of the objects that use that memory.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   - An allocation is made any time you declare an object with a “new” keyword
    or a value type is boxed. Allocations are typically very fast.

    +   - When there isn’t enough memory to allocate an object, the GC must collect
    and dispose of garbage memory to make memory available for new allocations.


    This process is known as garbage collection.


    Garbage Collection in C# has the following advantages:


    +   - You don’t need to free memory manually while developing your application.

    +   - It also allocates objects on the managed heap efficiently.

    +   - When objects are no longer used then it will reclaim those objects by clearing
    their memory, and keeps the memory available for future allocations.

    +   - Managed objects automatically get clean content to start with, so their
    constructors do not have to initialize every data field.'
  merge: -1
  img_proc: true
