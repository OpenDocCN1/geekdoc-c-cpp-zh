- pgno: 170
  md: '# 3.14 Web Configuration and Machine Configuration Files


    There are two types of configuration files supported by ASP.Net. Configuration
    files are used to control and manage the behavior of a web application.


    +   1. Machine.config

    +   2. Web.config


    Difference between Machine.Config and Web.Config


    # Machine.Config


    +   1. This is automatically installed when you install Visual Studio. Net.

    +   2. This is also called machine level configuration file.

    +   3. Only one machine.config file exists on a server.

    +   4. This file is at the highest level in the configuration hierarchy.


    # Web.Config


    +   1. This is automatically created when you create an ASP.Net web application
    project.

    +   2. This is also called application level configuration file.

    +   3. This file inherits setting from the machine.config'
  merge: -1
  img_proc: true
