    An assembly is a collection of types and resources that are built to work together
    and form a logical unit of functionality.


    # Manifest:


    Manifest is the most important part of an Assembly. Manifest contains useful information,
    about an assembly which makes an assembly: self-describing,


    The specifications in an assembly are collectively referred to as the assembly''s
    the manifest contains:


    +   1. The name of the assembly.

    +   2. Version information for the assembly.

    +   3. Security information for the assembly.

    +   4. A list of all files that are part of the assembly.

    +   5. Type reference information for the types specified in the assembly.

    +   6. A list of other assemblies that are referenced by the assembly.


