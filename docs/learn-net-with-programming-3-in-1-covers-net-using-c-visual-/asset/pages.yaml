  md: '+   - The database connection is no longer required. If the application has
    finished all operations on a database, then the database connection may no longer
    be required.


    Working with Various programming languages –


    As noted in an earlier section, a developer can develop an application in a variety
    of .Net programming languages.


    **Language -** The first level is the programming language itself, the most common
    ones are VB.Net and C#.


    **Compiler –** There is a compiler which will be separate for each programming
    language. So underlying the VB.Net language, there will be a separate VB.Net compiler.
    Similarly, for C#, you will have another compiler.


    **Common Language Interpreter –** This is the final layer in .Net which would
    be used to run a .net program developed in any programming language. So the subsequent
    compiler will send the program to the CLI layer to run the .Net application.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/e7ca4af023a4148a909dd82c11f81893_20_0.png)


    # 1. Class Library


    The .NET Framework includes a set of standard class libraries. A class library
    is a collection of methods and functions that can be used for the core purpose.
    For Example:, there is a class library with methods to handle all file-level operations.
    So there is a method which can be used to read the text from a file. Similarly,
    there is a method to write text to a file.


    Most of the methods are split into either the System.* or Microsoft.* namespaces.
    (The asterisk * just means a reference to all of the methods that fall under the
    System or Microsoft namespace). A namespace is a logical separation of methods.
    We will learn these namespaces more in detail in the subsequent chapters.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 2. Languages


    The types of applications that can be built in the .Net framework is classified
    broadly into the following categories.


    Winforms – This is used for developing Forms-based applications, which would run
    on an end user machine. Notepad is an Example: of a client-based application.


    ASP.Net – This is used for developing web-based applications, which are made to
    run on any browser such as Internet Explorer, Chrome or Firefox.


    The Web application would be processed on a server, which would have Internet
    Information Services Installed.


    Internet Information Services or IIS is a Microsoft component which is used to
    execute an Asp.Net application. The result of the execution is then sent to the
    client machines, and the output is shown in the browse


    ADO.Net – This technology is used to develop applications to interact with Databases
    such as Oracle or Microsoft SQL Server.


    Microsoft always ensures that .Net frameworks are in compliance with all the supported
    Windows operating systems.'
