  md: 'Microsoft .NET (pronounced “dot net”) is a software component that runs on
    the Windows operating system...NET applications.


    # .Net Framework


    .NET is a framework to develop software applications. It is designed and developed
    by Microsoft and the first beta version released in 2000.


    It is used to develop applications for web, Windows, phone. Moreover, it provides
    a broad range of functionalities and support. This framework contains a large
    number of class libraries known as Framework Class Library (FCL). The software
    programs written in .NET are executed in the execution environment, which is executed
    in Language Runtime (CLR). These are the core and essential parts of the .NET
    framework.


    This framework provides various services like memory management, networking, security,
    memory management, and type-safety. The .Net Framework supports more than 60 programming
    languages such as C#, F#, VB.NET, J#, VC++, jscript.NET, APL, COBOL, Perl, Oberon,
    ML, Pascal, Eiffel, Smalltalk, Python, Cobra, ADA, etc.'
  merge: -1
  img_proc: true
