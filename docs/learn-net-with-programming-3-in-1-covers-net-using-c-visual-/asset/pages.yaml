    # 4.4 Web Services


    UDDI: UDDI stands for Universal Description, Discovery and Integration and built
    in to Microsoft .NET platform. It works as a directory which is used to publish
    and discover public web services. It communicates via SOAP (SOAP is a simple XML-based
    protocol that allows applications to exchange information over HTTP).


    WSDL: WSDL stands for Web Service Description Language and is a W3C specification
    which defines XML grammar for describing Web Services. Means it is written in
    XML and also specifies the location of the service and the operations (or methods)
    the service exposes.XML grammar describes details such as:-


    +   1. Where we can find the Web Service (its URI)?

    +   2. What are the methods and properties that service supports?

    +   3. Data type support.

    +   4. Supported protocols'
  merge: -1
  img_proc: true
- pgno: 209
  md: '**DISCO:** DISCO is the abbreviated form of Discovery; it is the file that
    helps .NET discovers local


    Services. Basically it is used to club or group common services together on a
    server and provides


    Links to the schema documents of the services it describes may require. It contains
    WSDL (Web


    Service Description Language) when one searches for the Web Services; it will
    go to the DISCO which gives actual information about the particular Webservices.


    # 4.5 ADO.NET Architecture


    In this article, I am going to discuss ADO.NET Architecture. Please read our previous
    article where we discussed ADO.NET Connection Pooling with Example:s.


    # What is ADO.NET?


    ADO stands for Active Data Objects. ADO is nothing but a component in .NET Framework
    that helps us to fetch data from different data sources to our C# and VB.NET code
    and probably you can send data from your C# or VB.NET code to different data sources.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '![](img/e7ca4af023a4148a909dd82c11f81893_210_0.png)


    # The architecture of ADO.NET:


    +   1. Connection

    +   2. Command

    +   3. Datareader

    +   4. Dataadapter

    +   5. Dataset

    +   6. Dataview


    From the above components, two components are compulsory. One is the command object
    and the other one is the connection object. Irrespective of the operations like
    Insert, Update, Delete and Select, the command and connection object you always
    need. For better understanding, please have a look at the following image.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/e7ca4af023a4148a909dd82c11f81893_211_0.png)


    Let us understand each of the components in detail.


    # Connection:


    The first important component is the connection object. The connection object
    is required to connect with your backend database which can be SQL Server, Oracle,
    mysql, etc. To create a connection object, you need at least two things. The first
    one is where is your database located i.e. The Machine name or IP Address or someplace
    where your database is located. And the second thing is the security credentials
