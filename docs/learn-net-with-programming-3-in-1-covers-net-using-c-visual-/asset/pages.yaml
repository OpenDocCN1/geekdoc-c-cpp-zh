    # Hidden Fields


    Hiddenfield Control


    Hidden fields are a common trick of the HTML web developer’s trade for carrying
    information within a page when you do not want that information to be visible
    to the user—that is, the hidden field provides a way to store state information
    in the page. For Example:, you might want to keep track of whether a form on the
    page has been completed, has been saved as a draft, or is being edited for the
    first time.


    Often, an easier and more elegant way to accomplish this task is to use one of
    the state mechanisms provided by the .NET Framework (see Chapter 6 for a complete
    discussion of state). However, sometimes this is impossible, perhaps for performance,
    bandwidth, or security reasons. (Performance and bandwidth are mostly two sides
    of the same coin.)'
