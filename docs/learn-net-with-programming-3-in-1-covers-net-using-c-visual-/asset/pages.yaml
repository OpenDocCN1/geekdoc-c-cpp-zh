  md: '# 3.2 C# - Multithreading


    A thread is defined as the execution path of a program. Each thread defines a
    unique flow of control. If your application involves complicated and time consuming
    operations, then it is often helpful to set different execution paths or threads,
    with each thread performing a particular job.


    Threads are lightweight processes. One common Example: of use of thread is implementation
    of concurrent programming by modern operating systems. Use of threads saves wastage
    of CPU cycle and increase efficiency of an application.


    So far we wrote the programs where a single thread runs as a single process which
    is the running instance of the application. However, this way the application
    can perform one job at a time. To make it execute more than one task at a time,
    it could be divided into smaller threads.


    # 3.3 Thread Life Cycle


    The life cycle of a thread starts when an object of the System.Threading.Thread
    class is created and ends when the thread is terminated or completes execution.


    Following are the various states in the life cycle of a thread:'
  merge: -1
