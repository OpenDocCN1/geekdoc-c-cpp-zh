    # WSDL Document


    Web Services are self-describing, which means ASP.Net itself provides us all the
    information required for the client to consume a web service in the form of the
    WSDL document. WSDL document tells the client about the methods which are present
    in the Web Service. And the what parameter and return value used by the method
    and how a client application can communicate with them. WSDL is an XML standard.


