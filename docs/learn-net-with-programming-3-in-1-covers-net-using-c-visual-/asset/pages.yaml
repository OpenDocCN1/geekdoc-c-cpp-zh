- pgno: 212
  md: '# Command:


    The second important component is the command object. When we talk about databases
    like SQL Server, Oracle, mysql, then understand SQL. The command object is the
    component where you go and write your SQL queries. Later you take the command
    object and execute it over the connection. Then you can fetch data or send data
    to the database using the command object and SQL queries.


    # Datareader:


    Datareader is a read-only connected recordset that helps us to read the records
    only in the forward mode. Here, you need to understand three things i.e. Read-only,
    connected, and forward mode.


    # Dataset:


    It is a disconnected recordset that can be browsed in both i.e. Forward and backward.
    It is also possible to update via dataset. Dataset gets filled by somebody called
    dataadapter.


    # Dataadapter:


    The dataadapter acts as a bridge between the command object and the dataset. What
    the dataadapter does, it takes the data from the command object and fills the
    data set.


    # Dataview Class'
