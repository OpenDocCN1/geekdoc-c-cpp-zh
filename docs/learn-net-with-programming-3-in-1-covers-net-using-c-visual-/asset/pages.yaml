- pgno: 239
  md: 'What this means is that C# can automatically populate the value of the textbox
    as per a particular field of the table.


    So, you can have 2 textboxes in a windows form. You can then link one text box
    to the tutorialid field and another textbox to the tutorialname field. This linking
    is done in the Visual Studio designer itself, and you don’t need to write extra
    code for this.


    Visual Studio will ensure that it writes the code for you to ensure the linkage
    works. Then when you run your application, the textbox controls will automatically
    connect to the database, fetch the data and display it in the textbox controls.
    No coding is required from the developer’s end to achieve this.


    Let’s look at a code Example: of how we can achieve binding of controls.


    In our Example:, we are going to create 2 textboxes on the windows form. They
    are going to represent the Tutorial ID and Tutorial Name respectively. They will
    be bound to the Tutorial ID and tutorialname fields of the database accordingly.


    Let’s follow the below-mentioned steps to achieve this.


    Step 1) Construct the basic form. In the form drag and drop 2 components- labels
    and textboxes. Then carry out the following substeps'
