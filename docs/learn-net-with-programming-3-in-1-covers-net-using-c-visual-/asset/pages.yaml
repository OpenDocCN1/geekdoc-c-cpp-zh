  md: '# System.Text.RegularExpressions:


    +   - The system.Text.regularexpressions namespace contains classes that provide
    access to the .NET frameworks regular expression engine.

    +   - In its simplest form a regular expression is a text string that represents
    a pattern that other strings may or may not match.


    # System.windows.forms:


    +   - This namespace is the mother of all namespaces and is used for creating
    windows applications.

    +   - The system.Window.Forms namespace contains classes for creating windows
    based applications that take full advantage of the rich user interface features
    available in the Microsoft windows operating system.

    +   - In this namespace you will find the form class and many other controls that
