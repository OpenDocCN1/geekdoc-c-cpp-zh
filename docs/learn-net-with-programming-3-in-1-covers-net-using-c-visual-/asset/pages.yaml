    # 4.7 Distributed Applications


    As described in the previous sections, processes as well as application domains
    provide a close, protected environment. As a result, objects in a process or an
    application domain cannot talk directly to objects in another process or another
    application domain.


    However, in the increasingly connected world, enterprises and users demand distributed
    applications. Distributed applications allow objects to talk across process boundaries.
    Often, distributed applications also meet the following objectives:


    +   - Establish communication between objects that run in different application
    domains and processes, whether on the same computer or across the Internet.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '+   - Enable enterprise application integration by establishing communication
    between objects that run on heterogeneous architectures.

    +   - Enable application availability by making sure that portions of an application
    run even if some components are busy or have failed.

    +   - Provide increased security and scalability by dividing the application into
    several layers (or tiers).


    # 4.7.1 Evolution of Distributed Applications


    A well-designed distributed application has the potential to be more connected,
    more available, more scalable, and more robust than an application where all components
    run on a single computer. This is a desirable model for an enterprise application.


    Traditionally, there have been several efforts to design frameworks for developing
    distributed applications. A few well-known frameworks are Distributed Computing
    Environment/Remote Procedure Calls (DEC/RPC), Microsoft Distributed Component
    Object Model (DCOM), Common Object Request Broker Architecture (CORBA), and Java
    Remote Method Invocation (RMI). Some of these implementations are widely deployed
    in enterprises.


    However, modern business requirements are different from those of earlier days.
    Today, businesses seek solutions that can be developed rapidly, that integrate'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'well with their legacy applications, and that interoperate well with their
    business partners. Each of the technologies already mentioned failed to satisfy
    one or more of these requirements.


    In 2000, Microsoft introduced the .NET Framework for designing next-generation
    distributed applications. As you''ll explore more in this book, the .NET Framework
    is specifically targeted to meet the needs of modern business, whether the need
    is rapid development or integration or interoperability.


    The .NET Framework provides various mechanisms to support distributed application
    development. Most of this functionality is present in the following three namespaces
    of the Framework Class Library (FCL):


    +   - The System.Net Namespace—This namespace includes classes to create standalone
    listeners and custom protocol handlers to start from scratch and create your own
    framework for developing a distributed application. Working with the System.Net
    namespace directly requires a good understanding of network programming.


    +   - The System.Runtime.Remoting Namespace—This namespace includes the classes
    that constitute the .NET remoting framework. The .NET remoting framework allows
    communication between objects living in different application domains, whether
    or not they are on the same computer. Remoting'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'provides an abstraction over the complex network programming and exposes a
    simple mechanism for inter-application domain communication. The key objectives
    of .NET remoting are flexibility and extensibility.


    +   - The System.Web.Services Namespace—This namespace includes the classes that
    constitutes the ASP.NET Web services framework. ASP.NET Web services allow objects
    living in different application domains to exchange messages through standard
    protocols such as HTTP and SOAP. ASP.NET Web services, when compared to remoting,
    provide a much higher level of abstraction and simplicity. The key objectives
    of ASP.NET Web services are the ease of use and interoperability with other systems.

    +   - Both .NET remoting and ASP.NET Web services provide a complete framework
    for designing distributed applications. Most programmers will use either .NET
    remoting or ASP.NET Web services rather than build a distributed programming framework
    from scratch with the System.Net namespace classes.

    +   - The functionality offered by .NET remoting and ASP.NET Web services appears
    very similar. In fact, ASP.NET Web services are actually built on the .NET remoting
    infrastructure. It is also possible to use .NET remoting to design Web services.
    Given'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'the amount of similarity, how do you choose one over the other in your project?
    Simply put, the decision depends on the type of application you want to create.
    You''ll use.NET Remoting when both the end points (client and server) of a distributed
    application are in your control. This might be a case when an application has
    been designed for use within a corporate network.


    +   - ASP.NET Web services when one end point of a distributed application is
    not in your control. This might be a case when your application is interoperating
    with your business partner''s application.


    # 4.8 What is Globalization?


    Globalization refers to any activity that brings the people, cultures and economies
    of different countries closer together. In business, "globalization" refers to
    practices by which organizations become better connected to their customers around
    the world. This includes any aspect of operating in different national markets,
    from product design to marketing.


    # Globalization Examples


    If that’s still a bit vague for you, here are a few Example:s of globalization
    in the world of business:


    Online marketplaces like ebay and Amazon make it easy to buy products from businesses
    or individuals on the'
  merge: -1
  img_proc: true
- pgno: 260
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 261
  md: 'The rise of globalization also means that there has arguably never been a better
    time to build a business into a global company. There are a huge range of opportunities
    available to companies looking to expand, from access to a global talent pool
    to an increased volume of information that can be used to position a business.
    As it gets easier to enter new markets, there are also more product niches to
    take advantage of—and new customers to attract.


    However, to truly go global takes a lot of preparation. Two of the most important
    steps in this process are to localize and internationalize your product. While
    both localization and internationalization fall under the banner of globalization,
    there are some differences between the two. We’ll explore these further in the
    following sections.


    # What is Internationalization?


    Internationalization is a corporate strategy that involves making products and
    services as adaptable as possible, so they can easily enter different national
    markets. This often requires the assistance of subject matter experts. Internationalization
    is sometimes shortened to "i18n", where 18 represents the number of characters
    in the word.


    Products intended for use by speakers of multiple languages typically undergo
    an internationalization process. For example, IKEA internationalizes the'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'assembly instructions for its furniture by using only diagrams and illustrations,
    without including any text that would need to be translated. Products with instructions
    that do require translation are still often written with the goal of being as
    culturally-neutral as possible. This, of course, is easier said than done.


    In the case of software products and electronics, internationalization involves
    a number of different concerns:


    Data encoding: The ASCII character encoding is sufficient for texts in most Western
    European languages. However, languages that use non-Latin alphabets, such as Russian,
    Chinese, Hindi and Korean, require larger character encodings like Unicode.


    Hardware support: Software designers must consider that certain hardware devices
    may not be available in all countries.


    User interface: If a software application will be translated into multiple languages,
    the user interface needs to include enough space for the text in all of these
    languages.


    According to most definitions, companies must first internationalize before they
    can localize a product. In the next section, we''ll discuss the difference between
    internationalization and localization.


    # What is Localization?'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'Localization is the process of adapting a product to a specific target market.
    This usually happens after internationalization has taken place. Where internationalization
    develops a product that’s easy to adapt for many audiences in many different countries,
    localization takes that product and makes it highly relevant for one specific
    market.


    As mentioned, mcdonald''s operates over 30,000 restaurants in 100 countries. Its
    worldwide expansion is an Example: of globalization. By design, the corporation
    creates a menu adaptable to various local tastes and customs. This policy is an
    Example: of internationalization.


    Many of the mcdonald''s restaurants in Israel serve kosher food and drink and
    close during the Sabbath and Jewish holidays. McDonald’s has also opened a meat-free
    restaurant in India, a country in which much of the population does not eat beef
    or pork. In both cases, mcdonald’s has maintained its global brand identity but
    tailored its products and services for local markets. These cases exemplify localization.


    # 4.9 Authentication in ASP.NET


    There are two closely interlinked concepts at the heart of security for distributed
    applications - authentication and authorization. Authentication is the process
    of obtaining some sort of credentials from the users and using those credentials
    to verify the user''s identity. Authorization is'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'the process of allowing an authenticated user access to resources. Authentication
    is always precedes to Authorization; even if your application lets anonymous users
    connect and use the application, it still authenticates them as being anonymous.


    ASP.net provides flexible set of alternatives for authentication. You can perform
    authentication yourself in code or delegate authentication to other authorities
    (such as Microsoft Passport). In fact sometimes it seems ASP.net authentication
    is a bit too flexible; it can be difficult for a new developer to know just where
    to start. In this article, we review the settings in ASP.net and Internet Information
    Services (IIS) that control authentication and authorization in ASP.net applications.


    An ASP.net application has two separate authentication layers. That is because
    ASP.net is not a standalone product. Rather it is a layer on top of IIS. All requests
    flow through IIS before they are handed to ASP.net. As a result, IIS can decide
    to deny access without the ASP.net process even knowing that someone requested
    a particular page. Here is an overview of the steps in the joint IIS and ASP.net
    authentication process.


    IIS first checks to make sure the incoming request comes from an IP address that
    is allowed access to the domain. If not it denies the request.


    Next IIS performs its own user authentication if it is configured to do so. By
    default IIS allows anonymous'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'access, so requests are automatically authenticated, but you can change this
    default on a per - application basis with in IIS.


    If the request is passed to ASP.net with an authenticated user, ASP.net checks
    to see whether impersonation is enabled. If impersonation is enabled, ASP.net
    acts as though it were the authenticated user. If not ASP.net acts with its own
    configured account.


    Finally the identity from step 3 is used to request resources from the operating
    system. If ASP.net authentication can obtain all the necessary resources it grants
    the users request otherwise it is denied. Resources can include much more than
    just the ASP.net page itself you can also use .Net''s code access security features
    to extend this authorization step to disk files, Registry keys and other resources.


    As you can see several security authorities interact when the user requests and
    ASP.net page. If things are not behaving the way you think they should, it can
    be helpful to review this list and make sure you have considered all the factors
    involved


    # Authentication Providers


    Assuming IIS passes a request to ASP.net, what happens next? The answer depends
    on the configuration of ASP.net itself. The ASP.net architecture includes the
    concept of and authentication provider a piece of code whose job is to verify
    credentials and decide whether a'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'particular request should be considered authenticated. Out of the box ASP.net
    gives you a choice of three different authentication providers.


    The windows Authentication provider lets you authenticates users based on their
    windows accounts. This provider uses IIS to perform the authentication and then
    passes the authenticated identity to your code. This is the default provided for
    ASP.net.


    The passport authentication provider uses Microsoft''s passport service to authenticate
    users.


    The forms authentication provider uses custom HTML forms to collect authentication
    information and lets you use your own logic to authenticate users. The user''s
    credentials are stored in a cookie for use during the session.


