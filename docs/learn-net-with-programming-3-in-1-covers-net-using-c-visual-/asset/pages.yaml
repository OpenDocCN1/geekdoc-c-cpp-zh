    # 3.12 ASP.NET Cookie


    ASP.NET Cookie is a small bit of text that is used to store user-specific information.
    This information can be read by the web application whenever user visits the site.


    When a user requests for a web page, web server sends not just a page, but also
    a cookie containing the date and time. This cookie stores in a folder on the user''s
    hard disk.


    When the user requests for the web page again, browser looks on the hard drive
    for the cookie associated with the web page. Browser stores separate cookie for
    each different sites user visited.


    There are two ways to store cookies in ASP.NET application.


    +   - Cookies collection

    +   - httpcookie


    We can add Cookie either to Cookies collection or by creating instance of httpcookie
    class. Both work same except that httpcookie require Cookie name as part of the
    constructor.


