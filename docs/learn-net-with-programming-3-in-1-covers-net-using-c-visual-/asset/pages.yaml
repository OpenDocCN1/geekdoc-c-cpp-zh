  md: '# CHAPTER 1


    # INTRODUCTION TO .NET FRAMEWORK


    .NET is a software framework which is designed and developed by Microsoft. The
    first version of the .Net framework was 1.0 which came in the year 2002. In easy
    words, it is a virtual machine for compiling and executing programs written in
    different languages like C#, VB.Net etc. It is used to develop Form-based applications,
    Web-based applications, and Web services. There is a variety of programming languages
    available on the .Net platform, VB.Net and C# being the most common ones. It is
    used to build applications for Windows, phone, web, etc. It provides a lot of
    functionalities and also supports industry standards..NET Framework supports more
    than 60 programming languages in which 11 programming languages are designed and
    developed by Microsoft. The remaining Non-Microsoft Languages which are supported
    by .NET Framework but not designed and developed by Microsoft.


    # 1.1 Common Language Runtime (CLR):


    CLR is the basic and Virtual Machine component of the NET Framework. It is the
    run-time environment in the .NET Framework that runs the codes and helps in making
    the development process easier by providing the various services such as'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'remoting, thread management, type-safety, memory management, robustness, etc.
    Basically, it is responsible for managing the execution of .NET programs regardless
    of any .NET programming language. It also helps in the management of code, as
    code that targets the runtime is known as the Managed Code and code doesn’t target
    to runtime is known as Unmanaged code. Framework Class Library(FCL): It is the
    collection of reusable, object-oriented class libraries and methods, etc that
    can be integrated with CLR. Also called the Assemblies. It is just like the header
    files in C/C++ and packages in the java. Installing .NET framework basically is
    the installation of CLR and FCL into the system. Below is the overview of .NET
    Framework.


