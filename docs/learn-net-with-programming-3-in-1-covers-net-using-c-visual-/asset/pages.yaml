  md: 'A dataview enables you to create different views of the data stored in a datatable,
    a capability that is often used in data-binding applications. Using a dataview,
    you can expose the data in a table with different sort orders, and you can filter
    the data by row state or based on a filter expression.


    # 4.5.1 C# Database Connection: How to connect SQL Server (Example:)


    Accessing Data from a database is one of the important aspects of any programming
    language. It is an absolute necessity for any programming language to have the
    ability to work with databases. C# is no different.


    It can work with different types of databases. It can work with the most common
    databases such as Oracle and Microsoft SQL Server.


    It also can work with new forms of databases such as mongodb and mysql.


    # Fundamentals of Database connectivity


    C# and .Net can work with a majority of databases, the most common being Oracle
    and Microsoft SQL Server. But with every database, the logic behind working with
    all of them is mostly the same.


    In our Examples, we will look at working the Microsoft SQL Server as our database.
    For learning purposes, one can download and use the Microsoft SQL Server Express'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Edition, which is a free database software provided by Microsoft.


    In working with databases, the following are the concepts which are common to
    all databases.


    +   1. **Connection** – To work with the data in a database, the first obvious
    step is the connection. The connection to a database normally consists of the
    below-mentioned parameters.


    +   2. **Database name or Data Source** – The first important parameter is the
    database name to which the connection needs to be established. Each connection
    can only work with one database at a time.


    +   3. **Credentials** – The next important aspect is the username and password
    which needs to be used to establish a connection to the database. It ensures that
    the username and password have the necessary privileges to connect to the database.


    +   4. **Optional parameters** – For each database type, you can specify optional
    parameters to provide more information on how .net should handle the connection
    to the database. For Example:, one can specify a parameter for how long the connection
    should stay active. If no operation is performed for a specific period of time,
    then the parameter would determine if the connection has to be closed.'
