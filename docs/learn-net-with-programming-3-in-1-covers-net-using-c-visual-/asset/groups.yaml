    read strings (characters) from different Streams like filestream, memorystream,
    etc.


    **Streamwriter:** streamwriter is a helper class for writing a string to a Stream
    by converting characters into bytes. It can be used to write strings to different
    Streams such as as filestream, memorystream, etc.


    **Binaryreader:** binaryreader is a helper class for reading primitive datatype
