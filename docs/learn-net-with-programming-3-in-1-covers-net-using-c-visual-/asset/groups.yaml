    # 3.6 .NET Assemblies


    An Assembly is a basic building block of .Net Framework applications. It is basically
    a compiled code that can be executed by the CLR. An assembly is a collection of
    types and resources that are built to work together and form a logical unit of
    functionality. An Assembly can be a DLL or exe depending upon the project that
    we choose.'
  - '[PAGE 140]


    Assemblies are basically the following two types:


    +   1. Private Assembly

    +   2. Shared Assembly


    # 1. Private Assembly


    It is an assembly that is being used by a single application only. Suppose we
    have a project in which we refer to a DLL so when we build that project that DLL
    will be copied to the bin folder of our project. That DLL becomes a private assembly
    within our project. Generally, the dlls that are meant for a specific project
    are private assemblies.


    # 2. Shared Assembly


    Assemblies that can be used in more than one project are known to be a shared
    assembly. Shared assemblies are generally installed in the GAC. Assemblies that
    are installed in the GAC are made available to all the .Net applications on that
    machine.


    However, there are two more types of assemblies in .Net, Satellite Assembly, and
    Shared Assembly.


    # 3.7 GAC (Global Assembly Cache)


    # Using Global Assembly Cache (GAC) Deployment


    Installing application components into the the Global Assembly Cache (GAC) can
    be useful if you are installing components that will be used by multiple applications
    on'
  - '[PAGE 141]


    the same machine, or if you need to run multiple versions of the same assembly
    on a single computer. By default when you install the Ultimate UI for ASP.NET
    toolset the control assemblies are installed into the GAC. If you would like to
    deploy the Infragistics components that are part of your application into the
    GAC of the client computer there are three primary methods.


    # Using Gacutil.exe to add components to the GAC


    The Gacutil.exe tool is a command line utility installed as part of the base .NET
    framework which can be used to add and remove application components to/from the
    GAC. The Gacutil.exe tool is located in the .NET Framework installation directory.
    The default location for this is:


    ```

    C:\Windows\Microsoft.NET\Framework\v4.0.30319.

    ```


    To use the Gacutil.exe tool:


    Open a Visual Studio command prompt


    ( Start > Programs > Microsoft Visual Studio .NET 2005 > Visual Studio .NET Tools
    > Visual Studio .NET 2005 Command Prompt )


    Enter the Gacutil.exe command. The following line demonstrates adding the Infragistics
    webchart component to the GAC from an application’s folder called myapplication.


    ```

    Gacutil -i

    ```'
  - '[PAGE 142]


    C:\Projects\myapplication\Infragistics4.webui.ultrawebchart.v21.2.dll


    Gacutil.exe command line include a number of commands that allow you spe specify
    the operation you want the tool to perform. The list below explain the available
    commands:


    +   - /i - Installs an assembly to the GAC

    +   - /il - Installs one or more assemblies to the GAC

    +   - /u - Uninstalls an assembly from the GAC

    +   - /ul - Uninstalls one or more assemblies from the GAC

    +   - /ungen - Uninstalls a native images installed via the NGEN utility

    +   - /l - List the GAC filtered by <assembly_name>

    +   - /lr - List the GAC with all traced references

    +   - /cdl - Deletes the contents of the download cache

    +   - /ldl - Lists the contents of the download cache


    Gacutil.exe also allows for several options to be specified on the command line:


    +   - /r - Specifies a traced reference to install or uninstall

    +   - /f - Forces reinstall of an assembly

    +   - /nologo - Suppresses the display of the logo banner'
