    \n## 3.12 ASP.NET Cookie\n\nASP.NET Cookie 是一小段文本，用于存储用户特定信息。当用户访问网站时，Web 应用程序可以读取这些信息。\n\
    \n当用户请求网页时，Web 服务器不仅发送页面，还会发送包含日期和时间的 cookie。该 cookie 存储在用户硬盘上的一个文件夹中。\n\n当用户再次请求该网页时，浏览器会在硬盘上查找与该网页关联的\
    \ cookie。浏览器会为用户访问过的每个不同网站存储单独的 cookie。\n\n在 ASP.NET 应用程序中，有两种存储 cookie 的方法。\n\
    \n- Cookies 集合\n- httpcookie\n\n我们可以将 Cookie 添加到 Cookies 集合中，也可以通过创建 httpcookie\
    \ 类的实例来添加。两者工作方式相同，只是 httpcookie 需要将 Cookie 名称作为构造函数的一部分。\n\n### Httpcookie 示例：\n\
    \n在以下示例中，我们借助 httpcookie 类创建并添加 cookie。\n\n```\n// cookieExample.aspx\n1. <%@\
