    ## 2.12 C# Operators


    Operators are used to perform operations on variables and values. In the example
    below, we use the `+` operator to add together two values:


    **Example:**


    ```csharp

    int x = 100 + 50;

    ```


    ### Arithmetic Operators


    Arithmetic operators are used to perform common mathematical operations:


    | Operator | Name | Description | Example | Try it |

    | --- | --- | --- | --- | --- |

    | `+` | Addition | Adds together two values | `x + y` | Try it * |

    | `-` | Subtraction | Subtracts one value from another | `x - y` | Try it * |

    | `*` | Multiplication | Multiplies two values | `x * y` | Try it * |

    | `/` | Division | Divides one value by another | `x / y` | Try it * |

    | `%` | Modulus | Returns the division remainder | `x % y` | Try it * |

    | `++` | Increment | Increases the value of a variable by 1 | `x++` | Try it *
    |

    | `--` | Decrement | Decreases the value of a variable by 1 | `x--` | Try it *
    |


    ### C# Assignment Operators


    Assignment operators are used to assign values to variables.


    In the example below, we use the assignment operator (`=`) to assign the value
    10 to a variable called x:


    **Example:**


    ```csharp

    int x = 10;

    ```


    The addition assignment operator (`+=`) adds a value to a variable:


    **Example:**


    ```csharp

    int x = 10;

    x += 5;

    ```


    | Operator | Example | Same As |

    | --- | --- | --- |

    | `=` | `x = 5` | `x = 5` |

    | `+=` | `x += 3` | `x = x + 3` |

    | `-=` | `x -= 3` | `x = x - 3` |

    | `*=` | `x *= 3` | `x = x * 3` |

    | `/=` | `x /= 3` | `x = x / 3` |

    | `%=` | `x %= 3` | `x = x % 3` |

    | `&=` | `x &= 3` | `x = x & 3` |

    | `\|=` | `x \|= 3` | `x = x \| 3` |

    | `^=` | `x ^= 3` | `x = x ^ 3` |

    | `>>=` | `x >>= 3` | `x = x >> 3` |

    | `<<=` | `x <<= 3` | `x = x << 3` |


    ### C# Comparison Operators


    Comparison operators are used to compare two values:


    | Operator | Name | Example |

    | --- | --- | --- |

    | `==` | Equal to | `x == y` |

    | `!=` | Not equal | `x != y` |

    | `>` | Greater than | `x > y` |

    | `<` | Less than | `x < y` |

    | `>=` | Greater than or equal to | `x >= y` |

    | `<=` | Less than or equal to | `x <= y` |


    ### C# Logical Operators


    Logical operators are used to determine the logic between variables or values:


    | Operator | Name | Description | Example |

    | --- | --- | --- | --- |

    | `&&` | Logical and | Returns true if both statements are true | `x < 5 && x
    < 10` |

    | `\|\|` | Logical or | Returns true if one of the statements is true | `x < 5
    \|\| x < 4` |

    | `!` | Logical not | Reverse the result, returns false if the result is true
    | `!(x < 5 && x < 10)` |


