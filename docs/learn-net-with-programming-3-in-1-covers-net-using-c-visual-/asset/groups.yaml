    # PREFACE


    The present book entitled “Learn .NET with Programming, ( 3-in-1 ) has been designed
    so as to cover the chapter-wise syllabus of Diploma/O-Level/btech/BCA/MCA of all
    Indian Universities. The book is dedicated to the description of the latest trends
    and happening in .NET. This book covers the basic programming fundamentals, professional
    programming logics and deep concepts of programming in .NET such as the flow control
    statements in C# and Visual Basic, the basic programming techniques, procedures
    and procedural programming concepts. This book provides fresh and relevant content
    to .NET Core in a succinct format that is enjoyable to read. It also delivers
    concepts, along with the implications, design decisions, and potential pitfalls.


    This book is divided into four chapters.


    Chapter 1: Which provides an overview of the language and the .NET platform. The
    first chapters deals with . NET basics.


    Chaptes 2: Introduces you to the C# language and the .NET platform.


    Chapter 3: Describes that Libraries and .Net Advance Features also.'
  - '[PAGE 7]


    Chapter 4: Covers Windows and Website Development. ASP.NET is the successor to
    “classic” ASP technology, the world’s leading web development tool. ASP.NET solves
    many of the problems associated with ASP and provides an integrated and consistent
    approach to software development that builds on the libraries and languages of
    the .NET platform.


    In this book concepts, command and syntax are explained in a simple language with
    a lot of Example:s. This will enable the students to gain basic as well as in-depth
    knowledge about the subject. The chapters have been written by various experts
    in the field. We believe that this book is well suited to self-learning. The concise
    and sequential nature of the book makes it easier to learn. Although we have made
    all efforts to make the text error free, yet errors may remain in the text. We
    shall be thankful to the students and teachers alike if they point these out to
    us. Any further comments and suggestions for future improvement are welcome and
    will be most gratefully acknowledged.


    By the end of the book, you will have built five solid projects using all the
    tools and support provided by the .NET Core 2.0 framework.'
