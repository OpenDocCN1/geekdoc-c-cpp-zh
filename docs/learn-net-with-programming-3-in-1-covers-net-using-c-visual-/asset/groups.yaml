    ### User Input and Numbers


    The `Console.ReadLine()` method returns a string. Therefore, you cannot get information
    from another data type, such as `int`. The following program will cause an error:


    **Example:**


    ```csharp

    Console.WriteLine("Enter your age:");

    int age = Console.ReadLine();

    Console.WriteLine("Your age is: " + age);

    ```


    The error message will be something like this:


    `Cannot implicitly convert type ''string'' to ''int''`


    Like the error message says, you cannot implicitly convert type `''string''` to
    `''int''`.


    Luckily, for you, you just learned from the previous chapter (Type Casting), that
    you can convert any type explicitly, by using one of the `Convert.To` methods:


