  mdcn: "\n\naccess, so requests are automatically authenticated, but you can change\
    \ this default on a per-application basis with in IIS.\n\nIf the request is passed\
    \ to ASP.net with an authenticated user, ASP.net checks to see whether impersonation\
    \ is enabled. If impersonation is enabled, ASP.net acts as though it were the\
    \ authenticated user. If not ASP.net acts with its own configured account.\n\n\
    Finally the identity from step 3 is used to request resources from the operating\
    \ system. If ASP.net authentication can obtain all the necessary resources it\
    \ grants the users request otherwise it is denied. Resources can include much\
    \ more than just the ASP.net page itself you can also use .Net's code access security\
    \ features to extend this authorization step to disk files, Registry keys and\
    \ other resources.\n\nAs you can see several security authorities interact when\
    \ the user requests and ASP.net page. If things are not behaving the way you think\
    \ they should, it can be helpful to review this list and make sure you have considered\
    \ all the factors involved\n\n## Authentication Providers\n\nAssuming IIS passes\
    \ a request to ASP.net, what happens next? The answer depends on the configuration\
    \ of ASP.net itself. The ASP.net architecture includes the concept of and authentication\
    \ provider a piece of code whose job is to verify credentials and decide whether\
    \ a\n\nparticular request should be considered authenticated. Out of the box ASP.net\
    \ gives you a choice of three different authentication providers.\n\nThe windows\
    \ Authentication provider lets you authenticates users based on their windows\
    \ accounts. This provider uses IIS to perform the authentication and then passes\
    \ the authenticated identity to your code. This is the default provided for ASP.net.\n\
    \nThe passport authentication provider uses Microsoft's passport service to authenticate\
    \ users.\n\nThe forms authentication provider uses custom HTML forms to collect\
    \ authentication information and lets you use your own logic to authenticate users.\
    \ The user's credentials are stored in a cookie for use during the session.\n\n\
