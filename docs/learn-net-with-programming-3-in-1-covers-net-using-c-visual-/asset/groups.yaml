    ## 2.4 C# 注释


    注释可用于解释 C# 代码，使其更易读。它也可以用于在测试替代代码时防止执行。


    ### 2.4.1 单行注释


    单行注释以两个正斜杠 (//) 开始。


    // 与行尾之间的任何文本都将被 C# 忽略（不会被执行）。


    此示例在代码行前使用单行注释：


    **示例：**


    ```

