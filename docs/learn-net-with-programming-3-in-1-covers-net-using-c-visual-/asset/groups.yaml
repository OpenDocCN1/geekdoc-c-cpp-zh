    ## 4.5 ADO.NET Architecture


    In this article, I am going to discuss ADO.NET Architecture. Please read our previous
    article where we discussed ADO.NET Connection Pooling with Examples.


    ### What is ADO.NET?


    ADO stands for Active Data Objects. ADO is nothing but a component in .NET Framework
    that helps us to fetch data from different data sources to our C# and VB.NET code
    and probably you can send data from your C# or VB.NET code to different data sources.


    ![](img/e7ca4af023a4148a909dd82c11f81893_210_0.png)


    ### The architecture of ADO.NET:


    - 1. Connection

    - 2. Command

    - 3. Datareader

    - 4. Dataadapter

    - 5. Dataset

    - 6. Dataview


    From the above components, two components are compulsory. One is the command object
    and the other one is the connection object. Irrespective of the operations like
    Insert, Update, Delete and Select, the command and connection object you always
    need. For better understanding, please have a look at the following image.


    ![](img/e7ca4af023a4148a909dd82c11f81893_211_0.png)


    Let us understand each of the components in detail.


    ### Connection:


    The first important component is the connection object. The connection object
    is required to connect with your backend database which can be SQL Server, Oracle,
    mysql, etc. To create a connection object, you need at least two things. The first
    one is where is your database located i.e. The Machine name or IP Address or someplace
    where your database is located. And the second thing is the security credentials
    i.e. Whether it is a windows authentication or user name and password-based authentication.
    So, the first is to create the connection object and the connection is required
    to connect to the backend data source.


    ### Command:


    The second important component is the command object. When we talk about databases
    like SQL Server, Oracle, mysql, then understand SQL. The command object is the
    component where you go and write your SQL queries. Later you take the command
    object and execute it over the connection. Then you can fetch data or send data
    to the database using the command object and SQL queries.


    ### Datareader:


    Datareader is a read-only connected recordset that helps us to read the records
    only in the forward mode. Here, you need to understand three things i.e. Read-only,
    connected, and forward mode.


    ### Dataset:


    It is a disconnected recordset that can be browsed in both i.e. Forward and backward.
    It is also possible to update via dataset. Dataset gets filled by somebody called
    dataadapter.


    ### Dataadapter:


    The dataadapter acts as a bridge between the command object and the dataset. What
    the dataadapter does, it takes the data from the command object and fills the
    data set.


    ### Dataview Class


    A dataview enables you to create different views of the data stored in a datatable,
    a capability that is often used in data-binding applications. Using a dataview,
    you can expose the data in a table with different sort orders, and you can filter
    the data by row state or based on a filter expression.


