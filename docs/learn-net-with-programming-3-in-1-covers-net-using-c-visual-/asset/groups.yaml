    \n## Implementation of Web Services in ASP.NET Applications.\n\n### Create Web\
    \ Service\n\nA simple .asmx page is known as Web Service. For the creation of\
    \ the Web Service, we will use Visual Studio 2017, which uses the .NET Framework\
    \ 4.8. For creating the Web Service, we will follow the following steps:\n\n**Step\
    \ 1:** Firstly, we will create a Web Application for creating the Web Service.\n\
    \nFor that, we will click on the File -> New -> Project as shown in the below\
    \ screenshot:\n\n![](img/e7ca4af023a4148a909dd82c11f81893_345_0.png)\n\nAfter\
    \ that the new window will open as shown in the below screenshot:\n\nFrom here,\
    \ **we will select the Web -> ASP.NET Web Application -> Name of the Web Application\
    \ -> Click on OK.**\n\n![](img/e7ca4af023a4148a909dd82c11f81893_346_0.png)\n\n\
    After this a new window will be shown to us as shown below:\n\n![](img/e7ca4af023a4148a909dd82c11f81893_346_1.png)\n\
    \nFor creating the Web Service, we will right-click on the project **Name -> Click\
    \ on Add -> Add New Item**. As shown in the below screenshot:\n\n![](img/e7ca4af023a4148a909dd82c11f81893_347_0.png)\n\
    \nAfter this, a new window will appear. From there, we have to click on Web ->\
    \ Select Web Service (.asmx page) -> Give a name to the Web Service as shown in\
    \ the below screenshot:\n\n![](img/e7ca4af023a4148a909dd82c11f81893_348_0.png)\n\
    \nAfter adding the Web Service to the application, a new window will appear, which\
    \ is shown below:\n\n![](img/e7ca4af023a4148a909dd82c11f81893_348_1.png)\n\nDirect\
    \ method overloading is not supported by the Web Service. To allow method overloading\
    \ in the Web Service, we have to add the MessageName property to differentiate\
    \ one method used in the Web Service from the other method, which has the same\
    \ name and uses parameters.\n\n`[WebServiceBinding(ConformsTo = WsiProfiles.BasicProfile1_1)]`\
    \ to `[WebServiceBinding(ConformsTo = WsiProfiles.None)]`\n\n```csharp\n[WebMethod]\n\
    public int sumofnums(int firstnumber, int secondnumber)\n{\n    return firstnumber\
    \ + secondnumber;\n}\n\n// Here we will use MessageName property to do the differentiation\
    \ between both of the methods.\n[WebMethod(MessageName = \"sumoffloats\")]\npublic\
    \ float sumofnums(float firstnumber, float secondnumber)\n{\n    return firstnumber\
    \ + secondnumber;\n}\n```\n\nIf we want to call the Web service from the Script,\
    \ we will use ASP.NET AJAX and uncomment the below line.\n\n```csharp\n[System.Web.Script.Services.ScriptService]\n\
    [WebMethod]\n```\n\nThis attribute is always used at the top of the method. We\
    \ write this attribute in the Web Service. The [WebMethod] attribute is used to\
    \ define that the method using this attribute is exposed to the user/client access.\n\
    \nIf we remove this attribute, in that case, the client will not be able to see\
    \ the details of the method; hence they cannot implement it.\n\n### Markup\n\n\
    Now we will see the markup.\n\nFor the markup, we have to right-click on the Service1.asmx\
    \ in the window of the Solution Explorer and select the View Markup as shown in\
    \ the below screenshot:\n\n![](img/e7ca4af023a4148a909dd82c11f81893_351_0.png)\n\
    \nIn the Service1.asmx, we will see that the Service uses the WebService directive\
    \ with the attribute. From here, this shows us that the application invokes the\
    \ Service, not the end-user. Hence the asmx page has no markup.\n\n### Service1.asmx\n\
    \n```aspx\n<%@ WebService Language=\"C#\" CodeBehind=\"Service1.asmx.cs\" Class=\"\
    webapplication7.Service1\" %>\n```\n\nHere are some points about the Service1.asmx.\n\
    \n- **\"Web Service\" directive:** This directive shows that the asmx page is\
    \ a web service.\n- **\"Language\"=\"C#\":** This indicates that the C# language\
    \ is used for the Service.\n- **\"codebehind\":** This property has no role with\
    \ the ASP.NET or web service. CodeBehind is a property of Visual Studio. This\
    \ property is used to map the asmx page with the code-behind page.\n- **\"Class\"\
    \ property:** It contains the qualified name of the class. This is the entry point\
    \ of the Service, just like the `main()` in C language.\n\nNow we will run this\
    \ application after pressing the F5 button. Here we will find a link for the Service\
