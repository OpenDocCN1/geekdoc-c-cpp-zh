    Microsoft .NET (pronounced “dot net”) is a software component that runs on the
    Windows operating system...NET applications.


    ## .Net Framework


    .NET is a framework to develop software applications. It is designed and developed
    by Microsoft and the first beta version released in 2000.


    It is used to develop applications for web, Windows, phone. Moreover, it provides
    a broad range of functionalities and support. This framework contains a large
    number of class libraries known as Framework Class Library (FCL). The software
    programs written in .NET are executed in the execution environment, which is executed
    in Language Runtime (CLR). These are the core and essential parts of the .NET
    framework.


    This framework provides various services like memory management, networking, security,
    memory management, and type-safety. The .Net Framework supports more than 60 programming
    languages such as C#, F#, VB.NET, J#, VC++, jscript.NET, APL, COBOL, Perl, Oberon,
    ML, Pascal, Eiffel, Smalltalk, Python, Cobra, ADA, etc.


    ## Following is the .NET framework Stack that shows the modules and components
    of the Framework.


    The .NET Framework is composed of four main components:


    Common Language Runtime (CLR) Framework Class Library (FCL), Core Languages (winforms,
    ASP.NET, and ADO.NET), and Other Modules (WCF, WPF, WF, Card Space, LINQ, Entity
    Framework, Parallel LINQ, Task Parallel Library, etc.)


    | .NET Framework Version | Components |

    |------------------------|-----------|

    | 2.0 | Common Language Runtime, Framework Class Library, WinForms, ASP.NET, ADO.NET
    |

    | 3.0 | WPF, WCF, WF, Card Space |

    | 3.5 | LINQ, Entity Framework |

    | 4.0 | Task Parallel Library, Parallel LINQ |

    | 4.5 | Task-Based Async Model, .NET APIs for Store/UWP apps |


    Figure 1.3: Architecture of .NET Framework


    ## CLR (Common Language Runtime)


    It is a program execution engine that loads and executes the program. It converts
    the program into native code. It acts as an interface between the framework and
    operating system. It does exception handling, memory management, and garbage collection.
    Moreover, it provides security, type-safety, interoperability, and portablility.
    A list of CLR components are given below:


    ### Common Language Runtime


    ![](img/e7ca4af023a4148a909dd82c11f81893_33_0.png)


    ## Figure 1.4 FCL (Framework Class Library)


    It is a standard library that is a collection of thousands of classes and used
    to build an application. The BCL (Base Class Library) is the core of the FCL and
    provides basic functionalities.


    ![](img/e7ca4af023a4148a909dd82c11f81893_34_0.png)


    ## Winforms


    Windows Forms is a smart client technology for the .NET Framework, a set of managed
    libraries that simplify


    common application tasks such as reading and writing to the file system.


    ## ASP.NET


    ASP.NET is a web framework designed and developed by Microsoft. It is used to
    develop websites, web applications, and web services. It provides a fantastic
    integration of HTML, CSS, and javascript. It was first released in January 2002.


    ## ADO.NET


    ADO.NET is a module of .Net Framework, which is used to establish a connection
    between application and data sources. Data sources can be such as SQL Server and
    XML. ADO .NET consists of classes that can be used to connect, retrieve, insert,
    and delete data.


    ## WPF (Windows Presentation Foundation)


    Windows Presentation Foundation (WPF) is a graphical subsystem by Microsoft for
    rendering user interfaces in Windows-based applications. WPF, previously known
    as "Avalon", was initially released as part of .NET Framework 3.0 in 2006. WPF
    uses directx.


    ## WCF (Windows Communication Foundation)


    It is a framework for building service-oriented applications. Using WCF, you can
    send data as asynchronous messages from one service endpoint to another.


    ## WF (Workflow Foundation)


    Windows Workflow Foundation (WF) is a Microsoft technology that provides an API,
    an in-process workflow engine, and a rehostable designer to implement long-running
    processes as workflows within .NET applications.


    ## LINQ (Language Integrated Query)


    It is a query language, introduced in .NET 3.5 framework. It is used to make the
    query for data sources with C# or Visual Basics programming languages.


    ## Entity Framework


    It is an ORM based open source framework which is used to work with a database
    using .NET objects. It eliminates a lot of developers effort to handle the database.
    It is Microsoft''s recommended technology to deal with the database.


    ## 1.6 Garbage collection


    - The garbage collector (GC) manages the allocation and release of memory. The
    garbage collector serves as an automatic memory manager.

    - You do not need to know how to allocate and release memory or manage the lifetime
    of the objects that use that memory.

    - An allocation is made any time you declare an object with a “new” keyword or
    a value type is boxed. Allocations are typically very fast.

    - When there isn’t enough memory to allocate an object, the GC must collect and
    dispose of garbage memory to make memory available for new allocations.


    This process is known as garbage collection.


    Garbage Collection in C# has the following advantages:


    - You don’t need to free memory manually while developing your application.

    - It also allocates objects on the managed heap efficiently.

    - When objects are no longer used then it will reclaim those objects by clearing
    their memory, and keeps the memory available for future allocations.

    - Managed objects automatically get clean content to start with, so their constructors
