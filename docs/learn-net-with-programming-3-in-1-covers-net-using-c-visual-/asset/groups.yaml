    ## C# DataGridView


    数据网格用于以网格状格式显示表中的数据。当用户查看表数据时，通常希望一眼看到所有表行。如果我们能在窗体上以网格形式显示数据，就可以实现这一点。


    C# 和 Visual Studio 内置了数据网格，可用于显示数据。让我们看一个示例。在我们的示例中，将有一个数据网格，用于显示 Demotb 表中的 Tutorial
    ID 和 Tutorial Name 值。


