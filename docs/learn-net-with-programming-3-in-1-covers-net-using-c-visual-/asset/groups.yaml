    # 3.1 Input output (Streams Classes)


    # C# - Stream


    C# includes following standard IO (Input/Output) classes to read/write from different
    sources like files, memory, network, isolated storage, etc.


    **Stream:** System.IO.Stream is an abstract class that provides standard methods
    to transfer bytes (read, write, etc.) To the source. It is like a wrapper class
    to transfer bytes. Classes that need to read/write bytes from a particular source
    must implement the Stream class. The following classes inherit Stream class to
    provide the functionality to Read/Write bytes from a particular source:


    **Filestream:** Reads or writes bytes from/to a physical file, whether it is a
    .txt, .exe, .jpg, or any other file. Filestream is derived from the Stream class.


    ** Memorystream:** memorystream reads or writes bytes that are stored in memory.'
  - '[PAGE 119]


    **Bufferedstream:** bufferedstream reads or writes bytes from other Streams to
    improve certain I/O operations'' performance.


    **Networkstream:** networkstream reads or writes bytes from a network socket.


    **Pipestream:** pipestream reads or writes bytes from different processes.


    **Cryptostream:** cryptostream is for linking data streams to cryptographic transformations.
    The following diagram shows the hierarchy of stream classes:


    ![](img/e7ca4af023a4148a909dd82c11f81893_119_0.png)


    Figure 3.1 Stream Classes Hierarchy


    # Stream Readers and Writers


    **Streamreader:** streamreader is a helper class for reading characters from a
    Stream by converting bytes into characters using an encoded value. It can be used
    to'
