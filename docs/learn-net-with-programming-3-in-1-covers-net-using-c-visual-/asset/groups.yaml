    \nSHRIHIND PUBLICATIONS\n\n# 关于出版社\n\n![](img/e7ca4af023a4148a909dd82c11f81893_4_0.png)\n\
    \nSHRIHIND PUBLICATIONS PVT. LTD. 是一家雄心勃勃的出版公司，也是众多新兴作家的联合体。我们相信应该给那些拥有出色文学才能、但由于种种原因未能出版其“艺术作品”的作家一个机会。\n\
    \n通过我们的不同项目，我们鼓励作家让其深藏的智力宝藏以写作的形式表达出来，并为其写作专长获得应有的赞赏。\n\n无论是书籍、诗歌、短篇小说、戏剧，甚至是文章，只要具有极高的造诣，都会得到\
    \ SHRIHIND PUBLICATIONS 的赞扬，我们会将其出版，因为我们的目标之一就是让那些才华被掩盖、却有能力成为优秀作家的可敬文学作品走进聚光灯下，他们值得因其令人称赞的文学和写作才华而被珍视。\n\
    \n因此，“让你的创造力与卓越一起蓬勃发展”，加入 SHRIHIND PUBLICATIONS 吧。\n\nEmail: *shrihindpublications@gmail.com*\
    \  \nWeb: *www.shrihindpublications.com*\n\n# 前言\n\n本书名为“Learn .NET with Programming,\
    \ ( 3-in-1 )”，旨在涵盖印度所有大学的文凭/O-Level/ btech/BCA/MCA 分章教学大纲。本书致力于描述 .NET 的最新趋势和发展。本书涵盖了基本的编程基础、专业的编程逻辑以及\
    \ .NET 中的深入编程概念，例如 C# 和 Visual Basic 中的流程控制语句、基本的编程技术、程序和过程式编程概念。本书以简洁易读的格式提供了关于\
    \ .NET Core 的新鲜且相关的内容。它还传递了概念，以及相关的含义、设计决策和潜在的陷阱。\n\n本书分为四章。\n\n第一章：提供语言和 .NET\
    \ 平台的概述。第一章涉及 .NET 基础。\n\n第二章：向您介绍 C# 语言和 .NET 平台。\n\n第三章：也描述了库和 .Net 高级功能。\n\n\
    第四章：涵盖 Windows 和网站开发。ASP.NET 是“经典”ASP 技术的继任者，是全球领先的 Web 开发工具。ASP.NET 解决了与 ASP\
    \ 相关的许多问题，并提供了一种集成且一致的软件开发方法，该方法建立在 .NET 平台的库和语言之上。\n\n本书以大量示例用简单语言解释了概念、命令和语法。这将使学生能够获得关于该主题的基础知识以及深入知识。各章由该领域的各专家撰写。我们相信本书非常适合自学。本书简洁且循序渐进的特性使其更容易学习。尽管我们已尽一切努力使文本无误，但文本中仍可能存在错误。我们将同样感谢学生和教师如果能指出这些错误给我们。任何进一步的评论和改进建议都欢迎，并将最感激地予以承认。\n\
