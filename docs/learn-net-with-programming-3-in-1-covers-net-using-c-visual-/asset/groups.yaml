    \ 的新 ASP.NET 网站。默认情况下，网站会创建\n\n一个单一网页 Default.aspx。在解决方案资源管理器中右键单击项目 > 添加新项 >\
    \ Web 表单。保持原始名称 Default2.aspx 并单击“添加”。网站现在将包含两个页面，Default.aspx 和 Default2.aspx。\n\
    \n## 步骤 2：在源页面 Default.aspx 上，在表单上放置一个按钮。将按钮的文本设置为“targetbutton”。将按钮的“postbackurl”属性设置为目标页面\
    \ Default2.aspx 的 URL。\n\n```\n<asp:Button ID=\"Button1\" runat=\"server\" postbackurl=\"\
    ~/Default2.aspx\" Text=\"targetbutton\" /> </div>\n```\n\n## 步骤 3：在目标页面 Default2.aspx\
    \ 上，从工具箱中放置一个标签。\n\n## 步骤 4：在 Default2.aspx 的 Page_Load() 中，您可以访问“previouspage”属性来检查页面是否作为跨页回发被访问。\n\
    \n```\nProtected void Page_Load(object sender, EventArgs e)\n{\n    If (Page.previouspage\
    \ != null)\n    {\n    }\n}\n```\n\n步骤 5：要从源页面检索值，您必须使用“previouspage”的 'findcontrol()'\
    \ 方法访问控件。我们将访问 Default.aspx 中放置的 Button 控件的 Text 属性。\n\n```\n```\nProtected void\
    \ Page_Load(object sender, EventArgs e)\n{\nIf (Page.previouspage != null)\n{\n\
    Button btn = (Button)(Page.previouspage.findcontrol(\"button1\"));\nLabel1.Text\
    \ = btn.Text;\n}\n}\n```\n```\n\n步骤 6：在解决方案资源管理器中，右键单击 Default.aspx >“设为启动页”。运行应用程序并单击按钮。正如您所观察到的，页面已发布到\
    \ Default2.aspx，并且包含按钮控件名称的值会显示在标签中。\n\n## 3.14 Web 配置和机器配置文件\n\nASP.Net 支持两种类型的配置文件。配置文件用于控制和管理\
    \ Web 应用程序的行为。\n\n-   1. Machine.config\n-   2. Web.config\n\nMachine.Config 与\
    \ Web.Config 的区别\n\n## Machine.Config\n\n-   1. 安装 Visual Studio 时会自动安装。\n-  \
    \ 2. 也称为机器级配置文件。\n-   3. 服务器上只有一个 machine.config 文件。\n-   4. 该文件在配置层次结构中处于最高级别。\n\
    \n## Web.Config\n\n-   1. 创建 ASP.Net Web 应用程序项目时会自动创建。\n-   2. 也称为应用程序级配置文件。\n\
    -   3. 该文件继承自 machine.config 的设置\n\n## 第 4 章\n\n## WINDOWS 和网站开发\n\nWindows 窗体应用程序是在桌面计算机上运行的应用程序。Windows\
    \ 窗体应用程序通常会有一组控件，例如标签、文本框、列表框等。\n\n下面是一个示例：一个简单的 Windows 窗体应用程序 C#。它显示了一个简单的登录屏幕，用户可以访问。用户将输入所需的凭据，然后单击登录按钮继续。\n\
    \n![](img/e7ca4af023a4148a909dd82c11f81893_171_0.png)\n\n因此，上述应用程序中可用的控件示例\n\n\
    -   1. 这是一组标签控件，通常用于描述相邻控件。因此，在我们的例子中，我们有 2 个文本框，标签用于告诉用户一个文本框用于输入用户名，另一个用于输入密码。\n\
    -   2. 这 2 个文本框用于保存用户输入的用户名和密码。\n-   3. 最后，我们有按钮控件。按钮控件通常会附加一些代码来执行特定的一组操作。例如，在上述情况下，我们可以让按钮执行验证用户输入的用户名和密码的操作。\n\
    \n## 4.1.1 C# Hello World\n\n现在让我们看一个示例，了解如何在 Visual Studio 中实现简单的“hello world”应用程序。为此，我们需要实现以下步骤\n\
    \n步骤 1) 第一步涉及在 Visual Studio 中创建新项目。启动 Visual Studio 后，您需要选择菜单选项 New->Project。\n\
    \n"
