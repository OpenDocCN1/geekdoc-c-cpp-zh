    \n**Stream：** System.IO.Stream 是一个抽象类，提供标准方法将字节（读取、写入等）传输到源。它就像一个用于传输字节的包装类。需要从特定源读取/写入字节的类必须实现\
    \ Stream 类。以下类继承 Stream 类以提供从特定源读取/写入字节的功能：\n\n**Filestream：** 从/向物理文件读取或写入字节，无论是\
    \ .txt、.exe、.jpg 还是其他文件。Filestream 派生自 Stream 类。\n\n**Memorystream：** memorystream\
    \ 读取或写入存储在内存中的字节。\n\n**Bufferedstream：** bufferedstream 从其他流读取或写入字节以提高某些 I/O 操作的性能。\n\
    \n**Networkstream：** networkstream 从网络套接字读取或写入字节。\n\n**Pipestream：** pipestream\
