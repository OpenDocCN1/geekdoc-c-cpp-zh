    `char -> int -> long -> float -> double`


    ### Explicit Casting (manually) - converting a larger type to a smaller size type


    `double -> float -> long -> int -> char`


    ### Implicit Casting


    Implicit casting is done automatically when passing a smaller size type to a larger
    size type:


    **Example:**


    ```csharp

    int myint = 9;

    double mydouble = myint;    // Automatic casting: int to double

    Console.WriteLine(myint);    // Outputs 9

    Console.WriteLine(mydouble); // Outputs 9

    ```


    ### Explicit Casting


    Explicit casting must be done manually by placing the type in parentheses in front
    of the value:


    **Example:**


    ```csharp

    double mydouble = 9.78;

    int myint = (int) mydouble;    // Manual casting: double to int

    Console.WriteLine(mydouble); // Outputs 9.78

    Console.WriteLine(myint); // Outputs 9

    ```


    ## 2.11 Type Conversion Methods


    It is also possible to convert data types explicitly by using built-in methods,
    such as `Convert.ToBoolean`, `Convert.ToDouble`, `Convert.ToString`, `Convert.ToInt32`
    (int) and `Convert.ToInt64` (long):


    **Example:**


    ```csharp

    int myint = 10;

    double mydouble = 5.25;

    bool mybool = true;


    Console.WriteLine(Convert.ToString(myint)); // convert int to string

    Console.WriteLine(Convert.ToDouble(myint)); // convert int to double

    Console.WriteLine(Convert.ToInt32(mydouble)); // convert double to int

    Console.WriteLine(Convert.ToString(mybool)); // convert bool to string

    ```


    ## Get User Input


    You have already learned that `Console.WriteLine()` is used to output (print)
    values. Now we will use `Console.ReadLine()` to get user input.


    In the following example, the user can input his or hers username, which is stored
    in the variable `username`. Then we print the value of `username`:


    **Example:**


    ```csharp

    // Type your username and press enter

    Console.WriteLine("Enter username:");


    // Create a string variable and get user input from the keyboard and store it
    in the variable

    string username = Console.ReadLine();


    // Print the value of the variable (username), which will display the input value

    Console.WriteLine("Username is: " + username);

    ```


