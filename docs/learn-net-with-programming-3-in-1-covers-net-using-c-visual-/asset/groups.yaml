    by events (mouse clicks, key presses), sensor outputs, or messages from other
    programs/threads.


    - In in fig a simple event driven programming paradigm where each and every event
    go through a scheduler. Scheduler passes the code written inside the events to
    a particular event handler.


    VB.net support event driven programming by following ways:


    - A Visual studio IDE provides toolbox which is a window that gives us access
    to all controls, components, etc. User can easily drag and drop controls or tools
    on forms.


    - A Visual studio IDE also provides editor which automatically generates codes
    for different events like click or press events. The programmer therefore concentrate
    on issues such as interface design, which involves adding controls such as command
    buttons, text boxes, and labels to standard forms


    - Once the user interface is substantially complete, the programmer can add event-handling
    code to each control as required.


    - Each event-handler is usually bound to a specific object or control on a form.
    Any additional


    subroutines, methods, or function procedures required are usually placed in a
    separate code module, and can be called from other parts of the program as and
    when needed.


    An assembly is a collection of types and resources that are built to work together
    and form a logical unit of functionality.


    ## Manifest:


    Manifest is the most important part of an Assembly. Manifest contains useful information,
    about an assembly which makes an assembly: self-describing,


    The specifications in an assembly are collectively referred to as the assembly''s
    the manifest contains:


    - 1. The name of the assembly.

    - 2. Version information for the assembly.

    - 3. Security information for the assembly.

    - 4. A list of all files that are part of the assembly.

    - 5. Type reference information for the types specified in the assembly.

    - 6. A list of other assemblies that are referenced by the assembly.


    ## System Namespaces:


    - Namespace plays a fundamental role in the .Net framework. You cannot build a
    vb.net application


    without using classes from the .net system namespace.


    - The .net framework class library consists of several thousand classes and other
    types, (such as interfaces, structures and enumerations) that are divided into
    several namespaces


    Most commonly used namespaces are as follows:


    ## System.Data:


    - System.Data and its nested namespaces, notably system.Data.oledb and system.data.sqlclient
    provide data access using ADO.NET

    - The oledb and sqlclient namespaces are responsible for defining data providers
    that can connect to a data source retrieve data from a data source, write data
    back to a data source and execute commands against the data source.

    - ADO.net is an entirely new model for data access that is based on the disconnected
    dataset.


    ## System.IO:


    The system.IO namespace contains classes that provide a variety of input/output
    functionality, such as


    - Manipulating directories and files

    - Monitoring changes in directories and files

    - Reading and writing single bytes, multi byte blocks or characters to and from
    streams.

    - Reading and writing characters to and from strings


    ## System.Text.RegularExpressions:


    - The system.Text.regularexpressions namespace contains classes that provide access
    to the .NET frameworks regular expression engine.

    - In its simplest form a regular expression is a text string that represents a
    pattern that other strings may or may not match.


    ## System.windows.forms:


    - This namespace is the mother of all namespaces and is used for creating windows
    applications.

    - The system.Window.Forms namespace contains classes for creating windows based
    applications that take full advantage of the rich user interface features available
    in the Microsoft windows operating system.

    - In this namespace you will find the form class and many other controls that
    can be added to forms to create user interfaces.

    - In fact each new form added to a vb.net Project contains the following line:
    Imports System.Window.Forms

    - Fortunately visual studio provides the functionality of the system.window.forms
    namespace to us as vb programmers, so we do not need to program directly against
    this namespace.


