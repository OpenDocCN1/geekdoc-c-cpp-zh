    Create a variable called name of type string and assign it the value "John":


    ```

    string name = "John";

    Console.WriteLine(name);

    ```


    To create a variable that should store a number, look at the following example:


    **Example:**


    Create a variable called mynum of type int and assign it the value 15:


    ```

    int mynum = 15;

    Console.WriteLine(mynum);

    ```


    ## 2.6 Constants


    However, you can add the const keyword if you don''t want others (or yourself)
    to overwrite existing values (this will declare the variable as "constant", which
    means unchangeable and read-only):


    **Example:**


    ```

    const int mynum = 15;

    mynum = 20; // error

    ```


    The const keyword is useful when you want a variable to always store the same
    value, so that others (or yourself) won''t mess up your code. An example that
    is often referred to as a constant is PI (3.14159...).


    Note: You cannot declare a constant variable without assigning the value. If you
    do, an error will occur: A const field requires a value to be provided.


    **Example:**


    ```

    string firstname = "John ";

    string lastname = "Doe";

    string fullname = firstname + lastname;

    Console.WriteLine(fullname);

    ```


    For numeric values, the + character works as a mathematical operator (notice that
    we use int (integer) variables here):


    **Example:**


    ```

    int x = 5;

    int y = 6;

    Console.WriteLine(x + y); // Print the value of x + y

    ```


    ## 2.7 Declare Many Variables


    To declare more than one variable of the same type, use a comma-separated list:


    **Example:**


    ```

    int x = 5, y = 6, z = 50;

    Console.WriteLine(x + y + z);

    ```


    **Example:**


    ```

    int x, y, z;

    x = y = z = 50;

    Console.WriteLine(x + y + z);

    ```


    ## 2.8 C# Identifiers


    All C# variables must be identified with unique names.


    These unique names are called identifiers.


    Identifiers can be short names (like x and y) or more descriptive names (age,
    sum, totalVolume).


    Note: It is recommended to use descriptive names in order to create understandable
    and maintainable code:


    **Example:**


    ```

    // Good

    int minutesPerHour = 60;


    // OK, but not so easy to understand what m actually is

    int m = 60;

    ```


    ## 2.9 C# Data Types


    As explained in the variables chapter, a variable in C# must be a specified data
    type:


    ```

    int mynum = 5; // Integer (whole number)

    double myDoubleNum = 5.99D; // Floating point number

    char myLetter = ''D''; // Character

    bool myBool = true; // Boolean

    string myText = "Hello"; // String

    ```


    A data type specifies the size and type of variable values. It is important to
    use the correct data type for the corresponding variable; to avoid errors, to
    save time and memory, but it will also make your code more maintainable and readable.
    The most common data types are:


    | Data Type | Size | Description |

    |-----------|------|-------------|

    | int | 4 bytes | Stores whole numbers from -2,147,483,648 to 2,147,483,647 |

    | long | 8 bytes | Stores whole numbers from -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807
    |

    | float | 4 bytes | Stores fractional numbers. Sufficient for storing 6 to 7 decimal
    digits |

    | double | 8 bytes | Stores fractional numbers. Sufficient for storing 15 decimal
    digits |

    | bool | 1 byte | Stores true or false values |

    | char | 2 bytes | Stores a single character/letter, surrounded by single quotes
    |

    | string | 2 bytes per character | Stores a sequence of characters, surrounded
    by double quotes |


    ### Numbers


    Number types are divided into two groups:


    Integer types stores whole numbers, positive or negative (such as 123 or -456),
    without decimals. Valid types are int and long. Which type you should use, depends
    on the numeric value.


    Floating point types represents numbers with a fractional part, containing one
    or more decimals. Valid types are float and double.


    ### Integer Types


    #### Int


    The int data type can store whole numbers from -2147483648 to 2147483647. In general,
    and in our tutorial, the int data type is the preferred data type when we create
    variables with a numeric value.


    **Example:**


    ```

    int mynum = 100000;

    Console.WriteLine(mynum);

    ```


    #### Long


    The long data type can store whole numbers from -9223372036854775808 to 9223372036854775807.
    This is used when int is not large enough to store the value. Note that you should
    end the value with an "L":


    **Example:**


    ```

    long mynum = 15000000000L;

    Console.WriteLine(mynum);

    ```


    ### Floating Point Types


    You should use a floating point type whenever you need a number with a decimal,
    such as 9.99 or 3.14515.


    #### Float


    The float data type can store fractional numbers from 3.4e-038 to 3.4e+038. Note
    that you should end the value with an "F":


    **Example:**


    ```

    float mynum = 5.75F;

    Console.WriteLine(mynum);

    ```


    #### Double


    The double data type can store fractional numbers from 1.7e-308 to 1.7e+308. Note
    that you can end the value with a "D" (although not required):


    **Example:**


    ```

    double mynum = 19.99D;

    Console.WriteLine(mynum);

    ```

