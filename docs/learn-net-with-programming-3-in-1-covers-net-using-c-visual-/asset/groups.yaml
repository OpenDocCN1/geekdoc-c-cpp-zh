    ## 4.7 Distributed Applications


    As described in the previous sections, processes as well as application domains
    provide a close, protected environment. As a result, objects in a process or an
    application domain cannot talk directly to objects in another process or another
    application domain.


    However, in the increasingly connected world, enterprises and users demand distributed
    applications. Distributed applications allow objects to talk across process boundaries.
    Often, distributed applications also meet the following objectives:


    - Establish communication between objects that run in different application domains
    and processes, whether on the same computer or across the Internet.

    - Enable enterprise application integration by establishing communication between
    objects that run on heterogeneous architectures.

    - Enable application availability by making sure that portions of an application
    run even if some components are busy or have failed.

    - Provide increased security and scalability by dividing the application into
    several layers (or tiers).


