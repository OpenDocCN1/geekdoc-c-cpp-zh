    ## 第 1 章


    ### .NET Framework 简介


    .NET 是由 Microsoft 设计和开发的软件框架。.NET Framework 的第一个版本是 1.0，于 2002 年发布。简单来说，它是一个虚拟机，用于编译和执行用不同语言（如
    C#、VB.NET 等）编写的程序。它用于开发基于窗体的应用程序、基于 Web 的应用程序和 Web 服务。.NET 平台上有多种编程语言，其中 VB.NET
    和 C# 是最常见的。它用于构建 Windows、手机、Web 等应用程序。它提供了许多功能，并支持行业标准。.NET Framework 支持 60 多种编程语言，其中
    11 种由 Microsoft 设计和开发。其余的由 .NET Framework 支持，但并非由 Microsoft 设计和开发的非 Microsoft
    语言。


    ### 1.1 公共语言运行时（CLR）：


    CLR 是 .NET Framework 的基本虚拟机组件。它是 .NET Framework 中的运行时环境，负责运行代码，并通过提供远程处理、线程管理、类型安全、内存管理、健壮性等各种服务来简化开发过程。基本上，它负责管理
    .NET 程序的执行，无论使用哪种 .NET 编程语言。它还帮助管理代码，因为面向运行时的代码称为托管代码，不面向运行时的代码称为非托管代码。


    Framework 类库（FCL）：它是可重用的、面向对象的类库和方法等的集合，可以与 CLR 集成。也称为程序集。它就像 C/C++ 中的头文件和 Java
    中的包。安装 .NET Framework 基本上就是将 CLR 和 FCL 安装到系统中。下面是 .NET Framework 的概述。


    .NET 应用程序是平台相关的还是平台无关的？


    ![](img/e7ca4af023a4148a909dd82c11f81893_15_0.png)

    图 1.1 框架


    操作系统架构和 CPU 架构的组合称为平台。平台相关意味着编程语言代码只能在特定的操作系统上运行。.NET 应用程序是平台相关的，因为 .NET Framework
    只能在基于 Windows 的操作系统上运行。同时，.NET 应用程序也是平台无关的，因为 Mono 框架。


    使用 Mono 框架，.NET 应用程序可以在包括 Windows 在内的任何操作系统上运行。Mono 框架是由 Novell 公司开发的第三方软件，现在已成为
    Micro Focus 公司的一部分。它是一个付费框架。


    事件驱动编程以事件为核心。最终，程序的流程取决于事件。到目前为止，我们处理的是顺序执行模型或并行执行模型，而具有事件驱动编程概念的模型称为异步模型。事件驱动编程依赖于一个始终监听新传入事件的事件循环。事件驱动编程的工作方式取决于事件。一旦事件循环运行，事件便会决定要执行的内容以及执行顺序。下面的流程图将帮助您理解其工作原理：


    ![](img/e7ca4af023a4148a909dd82c11f81893_17_0.png)

    图 1.2 .NET 架构


    .NET Framework 的基本架构如下所示：


    ![](img/e7ca4af023a4148a909dd82c11f81893_17_1.png)


    - 不再需要数据库连接。如果应用程序已完成对数据库的所有操作，则可能不再需要数据库连接。


    ### 使用各种编程语言 –


    如前文所述，开发人员可以使用各种 .NET 编程语言开发应用程序。


    - **语言 –** 第一层是编程语言本身，最常见的是 VB.NET 和 C#。

    - **编译器 –** 每种编程语言都有一个单独的编译器。因此，在 VB.NET 语言之下，会有一个单独的 VB.NET 编译器。同样，对于 C#，您会有另一个编译器。

    - **公共语言解释器 –** 这是 .NET 中的最后一层，用于运行以任何编程语言开发的 .NET 程序。因此，随后的编译器会将程序发送到 CLI 层以运行
    .NET 应用程序。


    ![](img/e7ca4af023a4148a909dd82c11f81893_20_0.png)


    ### 1. 类库


    .NET Framework 包含一组标准类库。类库是可用于核心目的的方法和函数的集合。例如，有一个类库包含处理所有文件级操作的方法。其中有一个方法可用于从文件读取文本。同样，也有一个方法用于向文件写入文本。


    大多数方法都划分在 System.\* 或 Microsoft.\* 命名空间中。（星号 \* 仅表示引用 System 或 Microsoft 命名空间下的所有方法。）命名空间是方法的逻辑分隔。我们将在后续章节中更详细地学习这些命名空间。

    '
