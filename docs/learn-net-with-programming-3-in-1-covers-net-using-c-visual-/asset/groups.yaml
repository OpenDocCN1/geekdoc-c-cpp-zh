    \n**Streamreader：** streamreader 是用于通过使用编码值将字节转换为字符从流读取字符的辅助类。它可用于\n\n从不同流如 filestream、memorystream\
    \ 等读取字符串（字符）。\n\n**Streamwriter：** streamwriter 是用于通过将字符转换为字节向流写入字符串的辅助类。它可用于向不同流写入字符串，例如\
    \ filestream、memorystream 等。\n\n**Binaryreader：** binaryreader 是用于从字节读取原始数据类型\
    \ 的辅助类。\n\n**Binarywriter：** binarywriter 以二进制形式写入原始类型。\n\n![](img/e7ca4af023a4148a909dd82c11f81893_120_0.png)\n\
