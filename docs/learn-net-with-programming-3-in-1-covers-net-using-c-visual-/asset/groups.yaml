    12. </form>\n13. </body>\n14. </html>\n```\n\n代码\n\n```\n// cookieExample.aspx.cs\n\
    1. Using System;\n2. Using System.Web;\n3. Namespace webformscontrols\n4. {\n\
    5. Public partial class cookieExample: : System.Web.UI.Page\n6. {\n7. Protected\
