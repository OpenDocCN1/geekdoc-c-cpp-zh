    # 3.6 Using PROC PRINT to List the Observations in a Data Set


    After you input, infile, or import a data set and define labels and formats, you
    typically want to look at the observations and variables of the data set that
    you constructed. PROC PRINT displays the observations in a SAS data set. This
    display can be modified to calculate simple statistics such as sums, and it can
    use variables to identify observations in the listing. The following partial SAS
    code prints the nitro_tox data set grouped by concentration (by conc), sums the
    total number of young produced in each concentration condition (sum total), and
    uses the animal ID to identify each observation (id animal):


    ```

    proc print data=nitro_tox;

    by conc;  * assumes input data sorted by this variable;

    sum total;

    id animal;* animal number used to ID case;

    run;

    ```


    This code produces the printout in Display 3.14. Even though cbrood3 is a numeric
    variable, it is displayed using the format that has been assigned to it.'
  merge: -1
  img_proc: true
