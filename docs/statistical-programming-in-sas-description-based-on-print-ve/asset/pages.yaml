  md: "Alternatives for producing a comma-separated values file containing a SAS data\
    \ set are shown in Display 2.20. ODS with a CSV destination is used with a PROC\
    \ PRINT to produce a *.csv data file containing a SAS data set. (For more information\
    \ about ODS, see Chapter 4.) A second alternative using File→Export→Data (or the\
    \ equivalent PROC EXPORT code) is shown.\n\n# Display 2.20 Alternatives for producing\
    \ *.csv data files containing SAS data sets\n\n```\nlibname myfiles \"C:\\Users\\\
    baileraj.IT\\BAILERAJ\\Classes\\Web-CLASSES\\sta402\\data\";\n\n/*\n  nitrofen\
    \ = SAS data set in this library\n*/\n\nproc contents data=myfiles.nitrofen;\n\
    run;\n\n/* Using ODS with CSV + PROC PRINT to produce *.csv file\n   Thanks to\
    \ Kathy Roggenkamp for suggesting this alternative!\n*/\nods csv file=\"C:\\Users\\\
    baileraj.IT\\Desktop\\nitrofen.csv\";\nproc print data=myfiles.nitrofen;\n  var\
