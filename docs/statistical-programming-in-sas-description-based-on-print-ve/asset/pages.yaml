  md: '# 2.5 Merging Data Sets and Adding Variables


    In addition to adding new observations to an analysis data set, you might need
    to combine variables from multiple data sources into a single analysis data set.
    In this situation, you have different variables for the same collections of observations.
    This section focuses on adding variables from multiple data sources to build a
    single analysis data set. This task is shown in Display 2.25. The key point is
    that a common variable—in this case, OBSERVATION ID—is available for gluing together
    these data sources. Display 2.25 shows the first data set with seven observations
    and three variables. The second data set has seven observations and two variables
    that are not in the first data set. Care must be taken when merging data sets
    that contain variables with the same names, or that contain observations that
    exist in one data set, but not in the other. This is not a problem, but you need
    to be aware of what might result from a merge. For example, you could overwrite
    the values of common variables when merging. One option is to rename common variables
    before you merge.


