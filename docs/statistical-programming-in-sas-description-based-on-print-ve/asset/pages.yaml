- pgno: 171
  md: '# 5.1 Overview of Modeling


    SAS provides many regression procedures. These include procedures for constructing
    linear models for normally distributed responses (e.g., REG, GLM, and MIXED),
    non-normal regression models (e.g., GENMOD, LOGISTIC, COUNTREG, and GLIMMIX),
    nonlinear regression models (e.g., NLIN and NLMIXED), failure time models (e.g.,
    LIFEREG and PHREG), and other regression methods (e.g., LOESS, ROBUSTREG, QUANTREG,
    and TRANSREG). Other procedures address problems in the analysis of time series
    data (e.g., TSCSREG or ARIMA) or structural equations (e.g., CALIS). Some general
    modeling procedures enable you to fit models defined by a set of differential
    equations (MODEL). Discussing the statistical methods in these procedures is beyond
    the scope of this chapter. (It is beyond the scope of a single statistics course,
    for that matter.) As a result, this chapter emphasizes linear models for responses
    that are assumed to be normally distributed. A little statistical background is
    given for linear regression and basic ANOVA models. Then, SAS procedures for addressing
    these tasks are introduced. Examples illustrate the features of PROC REG and PROC
    GLM. This chapter is not intended to be a substitute for a modeling introduction
    in a regression course. However, some basic statistical ideas are introduced as
    a context for describing model specification in SAS. A good regression or linear
    model book such as Kutner et al. (2004) is a great companion to this chapter.
    In addition, this chapter provides a flavor for how models are specified. You
    should be able to generalize when working with other procedures. Muller and Fetterman
    (2002) provide an extensive introduction to fitting linear models using SAS.


    # 5.2 Linear Regression Models


    One of the best graphical methods for displaying the relationship between two
    numeric variables is the scatter plot. (For illustrations of the scatter plot,
    see Chapter 3.) While a picture is worth a thousand words, you might need more
    than a picture if you want to generate predictions and do inference. So, what
    is the simplest relationship that might exist between two variables? A line is
    the answer. While the simple equation Y = m X + b is often used to introduce linear
    relationships in algebra, a simple equation isn''t readily available in statistical
    modeling, especially when you have more than one X variable. As a result, the
    linear model is rewritten Y = β0 + β1 X with the slope as β1 instead of m, and
    the y-intercept as β0 instead of b. To further complicate the statistical modeling
    of relationships, the Y value at each X value is not expected to be the same.
    In other words, responses are expected to be random instead of fixed. So, a term
    to allow for responses with the same X value to vary is added to the equation,
    Y = β0 + β1 X + ε. In this equation, ε represents the random error term. Y is
    the response variable (or dependent variable). X is the predictor variable (or
    independent variable or covariate). The response variable and predictor variable
    pairing is preferred because it better reflects the common'
  merge: -1
  img_proc: true
- pgno: 172
  md: "situation that variables are often simultaneously measured in observational\
    \ studies, and the assignment of one variable to Y and another to X can be arbitrary.\
    \ An index for each observation is often included in this equation (i.e., Yᵢ =\
    \ β₀ + β₁Xᵢ + εᵢ; i=1, ..., n). A distribution is assumed for the random error\
    \ term (εᵢ ~ independent N(0, σ²)). To find the best fitting line, select the\
    \ values of the slope and y-intercept that minimize some criteria. The estimated\
    \ regression coefficients that minimize the sum of squared errors (i.e., Σ(Yᵢ\
    \ − β₀ − β₁ Xᵢ)²) for a predictor variable can be found using PROC REG or PROC\
    \ GLM. These procedures can find weighted least squares criterion as well. Other\
    \ criteria are found in PROC ROBUSTREG. Enough background, let’s look at an example.\n\
    \n# 5.2.1 Motorboats and manatees—a look at simple linear regression\n\nFor manatees\
    \ that live in the Florida waterways, encounters with motorboats are a frequent\
    \ cause of scarring at a minimum, and mortality at worst.¹ Data on motorboat registration\
    \ and manatee deaths were recorded for years 1977 through 1990 and analyzed (Moore\
    \ and McCabe (2003)). In the following example, three variables are entered: observation\
    \ year (YEAR), number of motorboats registered in multiples of 1000 (NBOATS),\
    \ and number of manatee deaths (MANATEES). ODS creates an RTF file for the output\
    \ of the regression procedure. Additional ODS statements produce a high-quality\
    \ image and request ODS Statistical Graphics. (For more information about ODS,\
    \ see Chapter 6.) The code for entering the data and fitting a simple linear regression\
    \ model (MANATEES = β₀ + β₁ NBOATS + ε) follows:\n\n# Display 5.1 Linear regression\
    \ to predict manatee deaths as a function of motorboats registered\n\n```\ndata\
    \ manatee_deaths;\n    input year nboats manatees @@;\n    datalines;\n77  447\
    \  13  78 460  21  79 481  24  80 498  16\n81  513  24  82 512  20  83 526  15\
    \  84 559  34\n85  585  33  86 614  33  87 645  39  88 675  43\n89  711  50  90\
    \ 719  47\n;\nrun;\n\nODS RTF file=\"C:\\Users\\baileraj.IT\\Desktop\\linreg-output.rtf\"\
    \ bodytitle;\nods listing image dpi=300;\nods graphics / width=4.5in;\nproc reg\
    \ data=manatee_deaths;\n    model manatees = nboats / p r cli clm;\n    output\
    \ out=man_pred p=yhat r=resid;\nrun;\n```\n\n> ¹ Manatee data set usage based\
    \ on “Florida powerboats and manatee deaths, 1977 1990” data set from Moore, David\
    \ S., and George P. McCabe. 2003. Introduction to the Practice of Statistics.\
    \ 4th Ed. New York, NY: W. H. Freeman and Co."
