    \ to 49.27. The percentile-based bootstrap CI for the mean response is 46.19 to\
    \ 49.19. An alternative to using DATA step programming to generate resamples is\
    \ to use SAS procedures such as SURVEYSELECT (Wicklin 2008).\n\n# 8.10 Throw Out\
    \ Your Tables of Statistical Distributions\n\nIn statistical applications, you\
    \ might need to look up quantiles from reference distributions to define rejection\
    \ regions or to determine multipliers of standard errors for constructing CIs.\
    \ In addition, you might need to look up areas under distributions to construct\
    \ p-values. Tables of quantiles and probabilities are often in the inside pages\
    \ and appendices of introductory statistics books. The good news is that these\
    \ tables can be replaced with functions in SAS, namely CDF and QUANTILE. The CDF\
    \ function determines Pr(Y≤c), where Y is a random variable in a distribution.\
    \ Continuous"
