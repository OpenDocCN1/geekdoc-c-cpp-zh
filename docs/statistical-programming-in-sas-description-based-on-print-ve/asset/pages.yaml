  md: 'In the example, a graphical display of the responses in the four groups is
    created using side-by-side box plots produced by PROC SGPLOT with the VBOX statement.
    The VBOX statement identifies the response variable LOGCOUNT and the variable
    CONDITION identifying the different groups.


    # Display 5.17 Side-by-side box plots of log-bacterial growth for different packaging
    conditions


    ![](img/26474180ee55914c13fb9156a7678157_194_0.png)


    From this display, log-bacterial growth is lowest for the CO₂ packaging condition,
    followed by vacuum, with plastic and mixed being the worst. Arguably, a box plot
    isn’t very informative with only three observations per group. However, this box
    plot is good for providing an illustration that applies to experiments with larger
    replicate counts.


    PROC GLM requests the test of mean equality between the four groups, and also
    requests a series of related analyses. GLM is short for general linear model,
    which includes the regression analysis previously described and the ANOVA model.
    General linear models are often referred to as simply linear models. GLM might
    be a confusing procedure name if you are expecting a generalized linear model,
    which is implemented in SAS using PROC GENMOD. As part of the PROC GLM statement,
    a request for diagnostic plots is included using plot(unpack)=diagnostics. This
    is discussed in more detail in the next chapter. However, it is worth mentioning
    because the fit of the ANOVA model


    ```

    plot(unpack)=diagnostics

    ```'
