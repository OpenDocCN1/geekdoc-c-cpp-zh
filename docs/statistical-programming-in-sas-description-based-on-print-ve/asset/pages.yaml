- pgno: 101
  md: "Chapter 1 presented guidelines for writing easy-to-read programs with sensible\
    \ variable names and documentation. Chapter 2 described constructing a data set\
    \ for later analysis. In this chapter, SAS is used to analyze data. This chapter\
    \ describes SAS system options, statements that can be used anywhere in a SAS\
    \ program, and procedures for displaying the contents of SAS data sets and listing\
    \ the observations in a data set. The chapter describes the basic procedures for\
    \ constructing summary statistics for numeric variables and categorical variables.\
    \ It includes basic graphical displays for examining the distribution of variable\
    \ values, and the association between variables.\n\n# 3.1 SAS System Options\n\
    \nOptions can be set in SAS that apply for the duration of a program (or until\
    \ other options are set). Many of these options are used to control the output\
    \ produced by SAS procedures (e.g., centering output, controlling page separation,\
    \ or displaying the current date and page number), while other options are used\
    \ to request that certain information be written to the log file (e.g., macro\
    \ diagnostic options). The OPTIONS statement controls these system options.\n\n\
    Consider the default output produced by the SAS program in Display 3.1. The program\
    \ generates a simple regression data set (x_i, y_i), where x_i=i and y_i is normally\
    \ distributed with mean 3+2x_i and variance=0.25 for i=1, 2, ..., 10.\n\n# Display\
    \ 3.1 Generating and printing a regression data set\n\n```\n* generate a 10 observation\
    \ data set with Y~N(3+2x,0.5^2);\n* RECALL: variance=0.25 implies SD=0.5;\n* \
    \         If Z ~ N(0,1), then Y=mu + sigma*Z ~ N(mu, sigma^2);\n*          Here,\
    \ mu=3+2*X and sigma=0.5;\ndata test;\ncall streaminit(0);\ndo X=1 to 10;\n  \
    \  Y=3+2*X+0.5*RAND('NORMAL');\n    output;\nend;\nrun;\n\nproc print data=test;\n\
    run;\n```\n\nAs in Chapter 2, check to see whether the data set that is produced\
    \ meets expectations. For example, Display 3.2 should include a data set with\
    \ 10 observations and two variables."
  merge: -1
  img_proc: true
- pgno: 102
  md: "# Display 3.2 (Edited) Output produced by PROC PRINT\n\nThe SAS System    09:21\
    \ Sunday, November 8, 2009    1\nObs   X    Y\n1     1    5.7549\n2     2    6.5498\n\
    3     3    8.8338\n4     4    11.0139\n5     5    12.8750\n6     6    14.7235\n\
    7     7    16.8983\n8     8    18.6677\n9     9    20.8039\n10    10   22.0728\n\
    \nThe output is centered by default. In addition, the date and page number are\
    \ stamped in the upper right corner of this output. You can change this by adding\
    \ the following OPTIONS statement:\n\n```\noptions nocenter nodate;\n```\n\nThe\
    \ output is shown in Display 3.3.\n\n# Display 3.3 Modifying the output with NOCENTER\
    \ and NODATE options\n\n```\noptions nocenter nodate;\n* generate a 10 observation\
    \ data set with Y~N(3+2x,0.5^2);\ndata test;\ncall streaminit(0);\ndo X=1 to 10;\n\
    \    Y=3+2*X+0.5* RAND('NORMAL');\n    output;\nend;\nrun;\n\nproc print data=test;\n\
    run;\n```\n\nThe NOCENTER option left justifies the output as shown in Display\
    \ 3.4, while the NODATE option suppresses the printing of the date."
  merge: -1
  img_proc: true
- pgno: 103
  md: "# Display 3.4 Output produced by PROC PRINT with options set\n\n```\nThe SAS\
    \ System\n2\nObs    X        Y\n1      1        4.7546\n2      2        8.0486\n\
    3      3        8.3544\n4      4        10.5208\n5      5        12.7708\n6  \
    \    6        14.6989\n7      7        16.4467\n8      8        18.7713\n9   \
    \   9        21.1995\n10     10       23.9167\n```\n\nWhile the output is no longer\
    \ centered and the date is not displayed, the page number is on the far right\
    \ (and is now equal to 2). There is still a default title. In addition, a new\
    \ output page is produced by default. A few system options—LS, PAGENO, and FORMDLIM—and\
    \ a simple TITLE statement can address these issues. The FORMDLIM option suppresses\
    \ the default page break and requests that the equal sign be used to separate\
    \ output pages. LS=64 requests an output width of 64 characters. PAGENO=1 starts\
    \ page numbering at 1. The code in Display 3.5 produces the output shown in Display\
    \ 3.6.\n\n# Display 3.5 More output controls in an OPTIONS statement\n\n```\n\
    options nocenter nodate ls=64 pageno=1 formdlim='=';\ntitle \"Generate Regression\
    \ Data Set\";\n* generate a 10 observation data set with Y~N(3+2x,0.5^2);\ndata\
    \ test;\n  call streaminit(0);\n  do X=1 to 10;\n    Y=3+2*X+0.5*RAND('NORMAL');\n\
    \    output;\n  end;\nrun;\n\nproc print data=test;\nrun;\n```\n\nAs shown in\
    \ Display 3.6, new output pages are no longer displayed on separate pages. Instead,\
    \ equal signs separate the pages."
  merge: -1
  img_proc: true
