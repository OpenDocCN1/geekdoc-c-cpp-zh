    # 10.6 Debugging Macro Code and Programs


    The first thing to do with non-working macro code is to write out the values of
    the macro variables. You can write to the log the value of a macro variable that
    you have defined using the statement %PUT &MACRO-VAR-NAME. You can display SAS
    automatic macro variables (%PUT _AUTOMATIC_), user-defined macro variables (%PUT
    _USER_), or both types (%PUT _ALL_). To debug, specifying a particular macro variable
    or all user-defined macro variables is more useful. It might be interesting to
    determine what macro variables are defined by SAS. (You might even be interested
    in using some of these variables in your programs.) The SYSDATE, SYSDAY, and SYSTIME
    macro variables are useful for extracting date and time information. SYSLAST is
    useful for defining the use of a default data set in a macro. Display 10.13 includes
    a request to display the values of macro variables that are automatically defined.


    # Display 10.13 Requesting the display of SAS automatic macro variables


    ```

    656 %put _automatic ;

    AUTOMATIC SYSDATE 06JUL08

    AUTOMATIC SYSDATE9 06JUL2008

    AUTOMATIC SYSDAY Sunday

    AUTOMATIC SYSDSN WORK      TRAPPER2

    AUTOMATIC SYSERR 0

    AUTOMATIC SYSLAST WORK.TRAPPER2

    AUTOMATIC SYSPROCNAME GPLOT

    AUTOMATIC SYSTIME 09:25

    AUTOMATIC SYSVER 9.2

    ```


    There are three main options that are important when constructing and debugging
    macros. The SYMBOLGEN option shows the values of macro variables. It can be used
    to trace the resolution of complex macro variable names. The MPRINT option displays
    the SAS statements that are generated for execution by the macro processor. The
    MLOGIC option displays a trace of the macro processor’s execution of the macro
    program. It might be the most useful of all three. The next three displays show
    the output of these options.


