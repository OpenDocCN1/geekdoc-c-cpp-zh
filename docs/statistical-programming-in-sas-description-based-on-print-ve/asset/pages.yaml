  md: "# Display 8.39 Pseudocode and comments for the t-test simulation in a DATA\
    \ step\n\n```\n/* calculate the test statistic */\n* >>>> calculate sample means\
    \ and variances;\n* >>>> calculate pooled variance and t-test statistic;\n* >>>>\
    \ calculate p-value;\n```\n\nDATA step programming for “Case Study 1: Is the Two-Sample\
    \ t-Test Robust Enough for Heterogeneous Variances?” is shown in full in Display\
    \ 8.40.\n\n# Display 8.40 DATA step programming\n\n```\ndata simulate_2group_t;\n\
    \narray x{10} x1-x10;   * storage for sample from population 1;\narray y{10} y1-y10;\
    \   * storage for sample from population 2;\n\nNsims = 4000;   * number of simulated\
    \ experiments;\nMyseed = 65432;   * specify seed for random number sequence;\n\
    call streaminit(Myseed);\n\nN1 = 10;        * sample sizes from populations 1\
    \ and 2;\nN2 = 10;\nMu_1 = 0;       * mean/sd of population 1;\nSig_1 = 1;\nMu_2\
    \ = 0;       * mean/sd of population 2;\nSig_2 = 1;\n\ndo iexpt = 1 to Nsims;\n\
    \n* generate N1=10 observations ~ N(mu_1, sig_1^2);\ndo isample1 = 1 to N1;\n\
    \    x{isample1} = RAND('normal',mu_1,sig_1);\nend;\n\n* generate N2=10 observations\
    \ ~ N(mu_2, sig_2^2);\ndo isample2 = 1 to N2;\n    y{isample2} = RAND('normal',mu_2,sig_2);\n\
    end;\n\n/* calculate the test statistic */\n* >>>> calculate sample means and\
    \ variances;\nxbar = mean(of x1-x10);\nybar = mean(of y1-y10);\n```"
