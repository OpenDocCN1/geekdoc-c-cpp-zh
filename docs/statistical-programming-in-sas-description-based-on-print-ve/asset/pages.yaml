    \ -2**2;\n  x3b = (-2)**2;\n  put '--------------------------------';\n  put '\
    \ | Order of operations |';\n  put ' | illustrated |';\n  put '--------------------------------';\n\
    \  put '  3*2**2 = ' x1a;\n  put ' (3*2)**2 = ' x1b;\n  put '  3-2/2 = ' x2a;\n\
