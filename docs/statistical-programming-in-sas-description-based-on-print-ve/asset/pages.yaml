    # 2.7 Summary


    The chapter started with an emphasis on reading data into SAS from various sources.
    It then moved into strategies for modifying data sets to add observations or variables.
    The SQL procedure was introduced for manipulating tables using a structured query
    language. Consistent with the title of this book (the “Statistical Programming”
    part), the goal of these manipulations is to produce a data set for analysis.
    Believe it or not, there are a few more topics associated with processing data
    in SAS that you might need to master. (This observation is similar to the captain
    of the Titanic observing, “Gee, I bet there is even more ice below the surface
    associated with that berg.”)


    Remember how the special variable FIRST.CONC was used in PUT statements? There
    are many other special internal variables, such as those associated with sorting—FIRST
    and LAST—and variables associated with observations being in a data set—IN. There
    are many other procedures for updating (PROC UPDATE), managing data sets efficiently
    (PROC COPY, PROC DATASETS), or reshaping data sets (PROC TRANSPOSE). You are encouraged
    to explore all of these. The transporting of data sets between systems and applications
    is facilitated by PROC IMPORT and PROC EXPORT, while moving SAS'
