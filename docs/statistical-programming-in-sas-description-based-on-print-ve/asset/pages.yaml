    \ ODS_on=FALSE);\n\n/* -------------------------------------------------------------------------\n\
    Purpose: Estimate P(LOW<Z< HIGH) using the trapezoidal rule\nMacro variables:\n\
    LOW, HIGH: interval of interest\nNPTS_LO, NPTS_HI, NPTS_BY: # function values\
    \ evaluated in area calc.\nFOUT: output data file containing area estimate for\
    \ each NPTS value\nPRINT_EST: print area estimate\nPRINT_PTS: print points/nodes\
    \ {x1-xn} + function values {f(x1)-f(xn)}\nDISPLAY_GRAPH: generate PROC GPLOT\
    \ with function values\nODS_ON: generate ODS RTF output\n-------------------------------------------------------------------------\
