- pgno: 405
  md: 'SAS data sets are rectangular objects that can be manipulated using procedures.
    Simulations with data sets and procedures using macros were described in a previous
    chapter. Unfortunately, there is overhead when you repeatedly invoke DATA steps
    and procedures. And, looping over DATA steps and procedures can be very slow.
    So, what can you do? If you can think in terms of processing rows and columns
    from rectangular arrays of data, then you have an option. In this chapter, PROC
    IML is introduced and illustrated. The “IML” in SAS/IML stands for interactive
    matrix language. SAS/IML is a tool for manipulating matrices. (Ask a seasoned
    SAS programmer about life with PROC MATRIX, if you want a trip down memory lane.)


    The first eight sections of this chapter focus on the basics of programming with
    matrices in SAS/IML. The final section and the four case studies discuss SAS/IML
    Studio. SAS/IML Studio enables you to perform GUI-specified statistical and graphical
    analyses. More interesting, it provides a programming environment for analyzing
    and displaying dynamically linked data and graphics.


    # 11.1 Defining a Matrix and Subscripting


    Manipulating a matrix is at the heart of statistical computing. SAS/IML provides
    a convenient way to program statistical algorithms using matrices and vectors.
    If you are familiar with SAS, SAS/IML is a great tool for extending the functionality
    in SAS procedures. Many statistical researchers program their new methods in a
    matrix programming language such as SAS/IML. You can create modules in SAS/IML
    so that the resulting code can be shared with others and put into production.
    You can do the programming in a DATA step, but this type of computation is often
    clumsy. Instead, you can succinctly and efficiently create the program in a matrix
    programming language. In this chapter, the objective is not to provide comprehensive
    information about matrices, matrix manipulation, or matrix functions. If that
    is your objective, you should find a good linear algebra book or matrix book emphasizing
    statistical uses of matrices. Searle (1982) has one waiting for you.


    What is a matrix? A matrix can be thought of as a special data set. A matrix is
    a rectangular object in which all elements are the same data type (e.g., they
    are all numeric or all character). The following example is a matrix:


    ![](img/26474180ee55914c13fb9156a7678157_405_0.png)'
  merge: -1
  img_proc: true
- pgno: 406
  md: "The following example is not a matrix:\n\nB = [ 17  George  11\n 15  Jungle\
    \  15\n 18  June  17 ]\n\nMatrices have properties including dimension. Dimension\
    \ corresponds to the number of rows and the number of columns. Dimensions can\
    \ be extracted using the NROW and NCOL functions in SAS/IML. In the previous example\
    \ of a matrix, A has 3 rows and 3 columns, which means it has the dimension 3×3.\
    \ An element of a matrix is referenced by its row and column position. For example,\
    \ 11 is the (1,3) element of A, or A[1,3]=11. A matrix with one dimension equal\
    \ to 1 is called a vector. Here is a 3×1 matrix, which is called a column vector:\n\
    \nX = [ 17\n 15\n 18 ]\n\nHere is a 1×3 matrix, which is called a row vector:\n\
    \nY = [17  15  18]\n\nA 1×1 matrix with Z=[12] is called a scalar. A matrix name\
    \ in SAS/IML is a valid SAS name. This means that it is 1 to 32 characters in\
    \ length, can begin with a letter or underscore, and can contain letters, numbers,\
    \ or underscores. In the next example, matrices are defined in PROC IML and some\
    \ basic manipulations are performed (e.g., extracting a row or column and summing\
    \ rows or columns).\n\nIn Display 11.1, a 2×3 matrix is defined.\n\nC = [ 1  2\
    \  3\n 4  5  6 ]\n\nThe second row is extracted:\n\nC_r2 = [4 5 6]"
  merge: -1
  img_proc: true
- pgno: 407
  md: "The third column is extracted:\n\nC_c3 = [3\n6]\n\nThe (2,3) element of C is\
    \ C23=[6]. Matrix C is defined by the first row [1 2 3], followed by the second\
    \ row [4 5 6], with a comma separating the definition of the rows. The general\
    \ form of referencing matrices or parts of matrices in SAS/IML is the following:\n\
    \nmatrix-name[row, column]\n\nRows and columns are extracted from a matrix by\
    \ specifying the row or column of interest, and then leaving the other index blank.\
    \ For example, C[2,] selects the second row of C. Placing a + in a row or column\
    \ sums the entries in that row or column, which produces a vector containing the\
    \ sums. If a matrix has columns that are distinct variables and rows that are\
    \ observations, then a column’s sum divided by the number of rows produces the\
    \ arithmetic mean for that column or variable. You can select ranges of rows or\
    \ columns using a : operator. For example, C[,2:3] selects columns 2 and 3 of\
    \ matrix C.\n\n# Display 11.1 Basic matrix manipulations\n\n```\nods rtf bodytitle\
    \ file=\"ch-11-display01.rtf\";\nPROC IML;\n  reset noname;  * inhibit default\
    \ printing of matrix name;\n\n*make a 2x3 matrix;\n  C = {1 2 3,4 5 6};\n  print\
    \ '2x3 example matrix C = {1 2 3,4 5 6}' = C;\n\n*select 2nd row;\n  C_r2 = C[2,];\n\
    \  print '2nd row of C = C[2,]' = C_r2;\n\n*select 3rd column;\n  C_c3 = C[,3];\n\
    \  print '3rd column of C = C[,3]' = C_c3;\n\n*select last two columns;\n  Col23\
    \ = C[,2:3];\n  Print 'Columns 2 and 3 of C' = Col23;\n\n*select the (2,3) element\
    \ of C;\n  C23 = C[2,3];\n  print '(2,3) element of C = C[2,3]' = C23;\n```"
  merge: -1
  img_proc: true
