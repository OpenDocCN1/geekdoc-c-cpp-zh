    The distributional QUANTILE function shouldn’t go unnoticed. This function returns
    the value of a random variable associated with a lower-tail probability. In other
    words, given a cumulative distribution function F(), its associated parameters,
    and a lower-tail probability, this function returns the value of x such that F(x)
    probability. Here is the syntax of this function:


    ```

    QUANTILE(''distribution-name'', prob, parameter-list-sep-commas)

    ```


    The parameter list varies with the distribution. The program in Display 8.55 determines
    quantiles from a continuous random variable (normal) and from a discrete random
    variable (binomial).'
