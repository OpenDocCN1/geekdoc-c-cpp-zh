- pgno: 127
  md: "Let’s look at numeric summaries of January temperature data from the SMSA²\
    \ city data using PROC UNIVARIATE. (For more background, see Section 2.2.) Display\
    \ 3.29 includes the request for univariate statistics for the JANTEMP variable\
    \ and for the identification of cities associated with extreme low or high temperatures.\
    \ (This is a great way to check for outliers in a data set.)\n\n# Display 3.29\
