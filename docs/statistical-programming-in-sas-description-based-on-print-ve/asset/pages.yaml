    else density_cat=3;                         * (Q3, max];\nrun;\n* aside: could\
    \ hard code Q1/Q3 but the solution above is a bit slicker and\n        avoids\
    \ the possibility of transcription error, is robust to\n        underlying data\
    \ changes when program is rerun;\n\nproc freq data=country;  * check construction\
    \ of density category variable;\ntable density_cat;\nrun;\n\n* additional check\
    \ suggested by Kathy Roggenkamp;\nproc means data=country n nmiss min max;\nclass\
    \ density_cat / missing;\nvar density;\nrun;\n\nods rtf BODYTITLE file=\"&topdir\\\
    Display-4.6.rtf\";\nproc tabulate data=country;\nclass density_cat;\nvar lifemen\
    \ lifewom liter loggnp;\ntable (lifemen lifewom liter loggnp)*(n nmiss mean median\
    \ stddev), density_cat;\nrun;\nods rtf close;\n```\n\nThe program first reads\
    \ the country data set, and then defines additional variables including LOGGNP\
    \ and population density. The quartiles of DENSITY are determined using PROC UNIVARIATE,\
    \ and then a categorical variable is created that indicates whether a country\
    \ falls in the lowest 25%, middle 50%, or upper 25% of population density in this\
    \ collection of countries. The assignment of these categories is checked using\
    \ PROC FREQ. (Here, one fourth of the countries should be in the first category,\
    \ and one fourth should be in the third category. One half should be in the middle\
    \ category). A (not very attractive) table is produced and shown in Display 4.7."
