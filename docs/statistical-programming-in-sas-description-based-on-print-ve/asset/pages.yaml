  md: '# 1.6 Summary


    This chapter provides an introduction to SAS. But, more important, it suggests
    coding habits for structuring and documenting a program to make it easier to read,
    debug, maintain, and modify. In the chapters that follow, the use of SAS to address
    data analytic problems is discussed in detail. Chapter 2 discusses creating an
    analysis data set, which typically involves reading an external data source into
    SAS, and then processing the data set. Chapter 3 presents basic descriptive and
    graphical statistics, which is followed by creating fancier, more customized tables
    and output in Chapter 4. The first section of the book concludes with chapters
    addressing the specifications of statistical models in SAS, and the production
    of statistical graphics.


