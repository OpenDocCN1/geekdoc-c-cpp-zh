- pgno: 279
  md: 'In the first seven chapters, the focus of this book was on writing basic code
    to conduct a variety of analyses using SAS. By now, you should have a sense of
    good habits for writing programs (Chapter 1), constructing an analysis data set
    (Chapter 2), using procedures to generate simple descriptive statistics (Chapter
    3), constructing complex tables and controlling output (Chapter 4), using procedures
    to analyze simple linear models (Chapter 5), and producing high-quality graphical
    displays (Chapters 6 and 7). At this point, you are ready to move beyond the how-to
    descriptions and into more hands-on topics. In this chapter, how different formatted
    data are read into SAS is presented. How variables can be recoded and constructed
    in a DATA step is described. The order in which operations are executed is discussed.
    Controls for keeping variables and observations in a data set are provided. The
    information from the beginning of this chapter is used later in this chapter in
    a program where a customized solution is required. Three case studies are detailed
    to illustrate programming concepts. Manipulations involving statistical distributions
    and including pseudorandom number generation close out this chapter.


    # 8.1 Internal Representations and Output Displays


    Let’s start by discussing how to get data with formatted values into a SAS data
    set using informats, and how to display this data using formats. Data can be crudely
    classified into four types: character, numeric, date, and time. (Someone might
    argue that there are only two types because date and time are essentially numeric.
    However, it is necessary to make these distinctions when discussing formats.)
    Informats tell SAS how to read data and store an input variable. Formats tell
    SAS how to display the values of a variable.


    The most common informat for reading or storing character variables is $w. In
    this informat, w equals the number of columns, characters, or total width of the
    variable. The default informat for reading character variables is $8. (i.e., $w,
    where the default length is 8 bytes). In Chapter 5, a brain weight and body weight
    data set¹ is used to discuss multiple regression. This data set includes a character
    variable SPECIES. In this chapter, this variable is identified in the construction
    of the first data set using the $ following the variable name in the INPUT statement.
    (See Display 8.1.) In the second data set, SPECIES is declared to be a character
    variable with a length of 15 before it is specified in the INPUT statement.'
  merge: -1
  img_proc: true
