- pgno: 367
  md: '# 10.1 What Is a Macro and Why Would You Use It?


    The macro processor is a text processor that is built into SAS. You should familiarize
    yourself with the macro processor because with it, you can execute the same programs
    with minor modification. In this chapter, a DATA step programming exercise is
    included that constructs a numerical estimate of the area under a standard normal
    density. In this exercise, macro coding and logic are used. Macro variables are
    substituted for hardcoded variables, and a macro is wrapped around the code for
    general use. This chapter provides information about debugging macros, storing
    macros, and using general built-in macro functions. The intent of this chapter
    is to provide you with an idea of why macros should be included in your toolbox.
    To learn more about macros, see Burlew (2006), Carpenter (2004), or the SAS Certification
    Prep Guide: Advanced Programming for SAS®.


    # 10.2 Motivation for Macros: Numerical Integration to Determine P(0<Z<1.645)


    To motivate you to use macros, this section reviews a problem described in Section
    8.8. “Case Study 2: Monte Carlo Integration to Estimate an Integral.” Or, in other
    words, how do you estimate P(0<Z<1.645)? In Chapter 8, a Monte Carlo simulation
    strategy is used. In this section, a numerical integration technique—the trapezoidal
    rule—is used. The trapezoidal rule approximates the area under a curve, f(x),
    over specified limits of integrations (say, low and high), by summing the areas
    of a collection of adjacent trapezoids constructed for a collection of points.
    For example:


    [x₁,f(x₁)] [x₂,f(x₂)], ..., [xₖ,f(xₖ)]

    x₁=low<x₂<...<xₖ₋₁<xₖ=high


    For more information about numerical integration techniques, see Burden and Faires
    (1989). If xᵢ₊₁−xᵢ=h for i=1,...,k−1, then the estimated area can be written as
    the following:


    Â = {½ f(x₁) + f(x₂) + ... + f(xₖ₋₁) + ½ f(xₖ)} × h


    This area estimator is implemented in the program in Display 10.1, where the following
    is true:


    k=25, x₁=0, xₖ=1.645, h=(xₖ−x₁)/24=1.645/24

    f(x)=1/√2π exp(−x²/2)'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# Display 10.1 Estimating P(0<Z<1.645) using the trapezoidal rule


    ```

    /*

    Estimate P(0 < Z < 1.645) using the trapezoidal rule

    */

    data trapper;

    trapsum=0;

    array x_value(25) x1-x25;

    array f_value(25) y1-y25;

    low = 0;

    high = 1.645;

    incr = (high-low)/24;

    pi = arccos(-1);


    do i=1 to 25;

    x_value[i] = low + incr*(i-1);

    f_value[i] = (1/sqrt(2*pi))*exp(-x_value[i]*x_value[i]/2);

    if i=1 or i=25 then trapsum = trapsum + f_value[i]/2;

    else trapsum = trapsum + f_value[i];

    end;

    area_est = trapsum*incr;

    output;

    run;

    ```


    ```

    ods rtf bodytitle file = "c:\users\baileraJ.IT\Desktop\trap.rtf";

    proc print data=trapper;

    title "Trapezoidal Rule Area Estimate for P(0<Z<1.645)";

    var low high incr area_est;

    run;

    ```


    ```

    data trapper2;

    set trapper;

    array x_value(25) x1-x25;

    array f_value(25) y1-y25;

    do ii=1 to 25;

    xout = x_value[ii];

    yout = f_value[ii];

    output;

    end;

    run;

    ```


    ```

    proc print data=trapper2;

    title "Interpolation Points for Trapezoidal Rule";

    var ii low high incr area_est xout yout;

    run;

    ```


    ```

    ods graphics on;

    proc sgplot data=trapper2;

    title "Plot of function values vs. x-values";

    scatter x=xout y=yout;

    run;

    ods graphics off;

    ods rtf close;

    ```'
  merge: -1
  img_proc: true
