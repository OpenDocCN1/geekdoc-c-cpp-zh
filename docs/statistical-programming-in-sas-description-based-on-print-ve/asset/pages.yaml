    # 8.6 Structured Thinking about Writing Programs


    Homework problems are frequently simple, and if a computer program is required
    for analysis, then this program might need only a few lines of code to implement
    a solution. These small programs can be written on the fly without a great deal
    of planning. This strategy of short and quick program construction fails miserably
    when you are faced with larger problems and when alternative solutions are required.
    A basic strategy is advocated in this case: modularize your code and write pseudocode
    that is operationalized as functioning programming statements during implementation.
    This strategy is outlined in this section and illustrated in the case studies
    that follow.


    Modular programming is commonly introduced in computer science when basic programming
    skills are taught. The basic idea is a simple one—when faced with a large and
    complex task, subdivide this task into smaller components. These smaller components
    can be implemented and tested before they are combined in a larger program. Often,
    these'
  merge: -1
  img_proc: true
- pgno: 305
  md: 'components are separate modules that can be implemented as subroutines or functions.
    However, these components might represent discrete ideas that need to be implemented
    with a module as well. Variants of these subroutines or functions are encountered
    in SAS macro programs (in Chapter 10) or in SAS/IML modules (in Chapter 11).


    Pseudocoding involves writing in words or sentence fragments what should occur
    in a large programming task. In decades past, programming students learned about
    structured programming ideas with extensive discussions and formal flowcharts
    about how a program should work. This formal flowchart of the overall program
    execution might be further expanded into components or modules of an even larger
    program that could be described in additional formal flowcharts. All of this seems
    to be a lost skill with many of the students of today (as is the speedy use of
    slide rules). Pseudocode provides a way to expand tasks into modular pieces with
    textual descriptions of what these pieces do. The abstract descriptions in discussions
    and flowcharts don’t provide a real sense of how the code might work in practice.


    # 8.7 Case Study 1: Is the Two-Sample t-Test Robust Enough for Heterogeneous Variances?


    Statistical procedures are derived assuming certain underlying characteristics.
    For example, the pooled variance t-test of the equality of two population means
    (i.e., H₀: μ₁ = μ₂) assumes that the observations from the two populations are
    independent and that the two populations are normally distributed with a common
    variance. This test takes the following general form:


    $$t_{stat} = \frac{\bar{Y}_1 - \bar{Y}_2}{s_p \sqrt{\frac{1}{n_1} + \frac{1}{n_2}}}$$


    In this equation:


    $$s_p^2 = \frac{(n_1 - 1)s_1^2 + (n_2 - 1)s_2^2}{(n_1 + n_2 - 2)}$$


    $\bar{Y}_i$ and $s_i^2$ are the sample mean and sample variance of the $i^{th}$
    sample ($i = 1,2$). The impact of violating the assumption of equal variance on
    the test of mean equality is of interest to applied statisticians. This impact
    of unequal variance is smallest when the sample sizes from the two groups are
    similar (Miller 1986). In this case study, a Monte Carlo simulation'
  merge: -1
  img_proc: true
