- pgno: 235
  md: "# Display 6.16 Brood-specific scatter plots of young versus concentration with\
    \ superimposed LOESS smooth²\n\n```\ndata nitrophen;\n  infile 'C:\\Users\\baileraj.IT\\\
    Desktop\\ch2-dat.txt' firstobs=16 expandtabs missover pad;\n  input @9 animal\
    \ 2. @17 conc 3. @25 brood1 2. @33 brood2 2. @41 brood3 2. @49 total 2.;\nrun;\n\
    \ndata nitrophen2; set nitrophen;\n  brood = 1; young=brood1; output;\n  brood\
    \ = 2; young=brood2; output;\n  brood = 3; young=brood3; output;\n  keep conc\
    \ brood young;\nrun;\n\nods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\\
    nitrophen-plots.rtf\";\nproc sgpanel data=nitrophen2;\ntitle \"Brood-specific\
    \ LOESS fits\";\npanelby brood;\n  loess x=conc y=young;\nrun;\n\nods rtf close;\n\
    ```\n\nThe scatter plots are shown in Display 6.17."
  merge: -1
