    # 2.6 Database Processing with PROC SQL


    As an alternative to DATA step manipulation, the SAS implementation of a structured
    query language in PROC SQL might be a better alternative. (This is above and beyond
    the obvious applications of querying a data table and constructing summary tables.)
    In fact, programmers who come to SAS with a broad exposure to database programming'
  merge: -1
  img_proc: true
- pgno: 74
  md: "(say, via formal computer science or MIS training) might find SQL to be more\
    \ natural for data set manipulation than old-time SAS programmers. (Yeah, this\
    \ is a confession. One of my former students, Matt Wheeler, did a fair amount\
    \ of project work using PROC SQL that convinced me that I should learn more about\
    \ this procedure.) This section provides an overview of this procedure with an\
    \ emphasis on using PROC SQL to concatenate and merge data sets. Background references\
    \ that might be interesting include documentation about SAS Advanced Certification.\n\
    \nThe big idea is that PROC SQL looks at data sets as tables that can be manipulated,\
    \ processed, and displayed using command queries. Here is the basic syntax, excerpted\
    \ from SAS Help:\n\n```\nPROC SQL;\n    CREATE TABLE name;\n    SELECT variables\
    \ FROM list-of-tables/dataset\n        GROUP BY  /* optional */\n        HAVING\
    \    /* optional */\n    ;\n```\n\nDisplay 2.30 shows a simple query of a data\
    \ set.\n\n# Display 2.30 Running a simple query on a SAS data set containing the\
    \ highest nitrofen concentration data\n\n```\ndata conc_310;\n    input total\
    \ @@;\n    conc = 310;  * define a variable containing the value of the nitrofen\
    \ conc.;\n    datalines;\n6 6 7 0 15 5 6 4 6 5\n;\nrun;\n\nods rtf bodytitle file='C:\\\
    Users\\baileraj.IT\\Desktop\\ch2-fig2.30.rtf';\nproc sql;\n    select conc,total\
    \ from conc_310;\nquit;\nods rtf close;\n```\n\nThis query selects two variables\
    \ (or columns) from the conc_310 SAS data set (or table). The view produced from\
    \ this query is shown in Display 2.31. SELECT alone (with no CREATE) prints only\
    \ the selected table entries of interest."
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Display 2.31 Result of the simple query with the total number of young produced
    in the highest nitrofen concentration


    | conc | total |

