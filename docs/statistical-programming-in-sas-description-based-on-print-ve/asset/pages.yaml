- pgno: 315
  md: 'It is worth noting that you probably do not want to have to change hardcoded
    values each time you investigate other simulation conditions. Macro variables
    are a great solution to this quandary, and they are explored in greater detail
    in Chapter 10.


    # 8.7.1 Case Study 1: Is the Two-Sample t-Test Robust Enough for Heterogeneous
    Variances? (Revisited Using More DATA Step Programming)


    An alternative to the previous program is to calculate the test statistic as part
    of a DATA step. The structure for producing the data needs to change, however.
    If you want to do all of the calculation in the DATA step, then a separate data
    line for each observation is probably not the best way to proceed. You could use
    the code in Display 8.37.


    # Display 8.37 Generating data as one record per simulated experiment


    ```

    data simulate_2group_t;


    Nsims = 4000;      * number of simulated experiments;

    Myseed = 65432;   * specify seed for random number sequence;

    call streaminit(Myseed);


    N1 = 10;          * sample sizes from populations 1 and 2;

    N2 = 10;


    Mu_1 = 0;         * mean/sd of population 1;

    Sig_1 = 1;


    Mu_2 = 0;         * mean/sd of population 2;

    Sig_2 = 1;


    do iexpt = 1 to Nsims;


    * generate N1=10 observations ~ N(mu_1, sig_1^2);

    X1 = RAND(''normal'',mu_1,sig_1);

    X2 = RAND(''normal'',mu_1,sig_1);

    X3 = RAND(''normal'',mu_1,sig_1);

    X4 = RAND(''normal'',mu_1,sig_1);

    X5 = RAND(''normal'',mu_1,sig_1);

    X6 = RAND(''normal'',mu_1,sig_1);

    X7 = RAND(''normal'',mu_1,sig_1);

    X8 = RAND(''normal'',mu_1,sig_1);

    X9 = RAND(''normal'',mu_1,sig_1);

    X10 = RAND(''normal'',mu_1,sig_1);

    ```'
