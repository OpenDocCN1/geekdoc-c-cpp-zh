  md: "I believe that the all uppercase version of the code is the least readable\
    \ of these three samples. The preference between the other two samples with either\
    \ a mix of case or all lowercase is a matter of personal taste.\n\n# 1.2.4 Indent\
    \ program statements that naturally go together\n\nBy indenting program statements,\
    \ you highlight lines that accompany a procedure or statement. Or, you identify\
    \ blocks of code that are executed together in the case of loops or conditionally\
    \ executed statements. (There is more to come on this in the DO-END and IF-THEN\
    \ constructs in later chapters.) Compare the following two sections of code excerpted\
    \ from Display 1.1. In the first case, the code is written in all uppercase with\
    \ no indentation:\n\n```\nPROC PRINT DATA=COUNTRY; RUN;\nPROC REG DATA=COUNTRY;\n\
    TITLE \"LITER AND LOGGNP AS PREDICTORS OF LIFE EXPECTANCY OF WOMEN\";\nMODEL LIFEWOM\
    \ = LITER LOGGNP/ TOL VIF COLLINOINT;\nOUTPUT OUT=NEW P=YHAT R=RESID; RUN;\n```\n\
    \nHere is the second case:\n\n```\nproc print data=country;\nrun;\n\nproc reg\
    \ data=country;\n    title \"LITER and LOGGNP as predictors of Life expectancy\
    \ of women\";\n    model lifewom = liter loggnp/ tol vif collinoint;\n    output\
    \ out=new p=yhat r=resid;\nrun;\n```\n\nIt is clearer in the second case that\
    \ two procedures have been invoked: PROC PRINT and PROC REG (with a series of\
    \ statements and commands issued with PROC REG). I argue that the non-capitalized\
    \ version is cleaner to read and that the indenting and inserted blank lines enable\
    \ you to identify easily what accompanies each procedure.\n\n# 1.3 SAS Program\
    \ Structure\n\nNow that I have spent a little time on the aesthetics of programming\
    \ and teased you with an example SAS program, it is time to describe the basic\
    \ components of a SAS program. A SAS program is typically stored as a file with\
    \ a .sas extension. Running a SAS program in a batch environment generates two\
    \ additional files—a .log file (containing"
  merge: -1
  img_proc: true
- pgno: 25
  md: 'messages describing what happened during the execution of the SAS program)
    and a listing file (with a file extension of .listing, .lst, or .lis). If you
    run SAS interactively with a program editor (e.g., on Windows), then you have
    these corresponding windows—Editor (analogous to the .sas file), Log, and Output
    (analogous to the .listing file).


    A SAS program has a series of DATA steps and procedure steps (called PROCs). A
    DATA step begins with a DATA statement, followed by a collection of statements
    that define the source of the data, the variables to be read, formats that might
    be assigned, transformations, manipulations, etc. A procedure step begins with
    a PROC statement, followed by the procedure name. Procedures have statements and
    options, with the end of each statement punctuated with a semicolon. Each statement
    in the program ends with a semicolon. The semicolon is a reserved character in
    a SAS program, and the omission of a semicolon is probably the most common error
    committed in a SAS program that won’t run.


    A DATA step is used to name a data set, name the variables in the data set, identify
    variables as numeric or character, identify the source for the data input to SAS,
    and provide direction to the program for reading the input data file. As with
    variable names, data set names can be up to 32 characters in length with similar
    naming restrictions. Data might be input in the program using DATALINES, or input
    from an external file using an INFILE statement, or input from a permanently saved
    SAS data set (using the LIBNAME or SET statement).


    In Display 1.1, I defined a SAS data set named country that includes variables
    read from an external data file named country.data that is stored in one of two
    directories defined by macro variables. (For more information about macro variables,
    see Chapter 10.) This data set has the following variables—NAME, AREA, POPNSIZE,
    PCTURBAN, LANG, LITER, LIFEMEN, LIFEWOM, and PCGNP. Values of these variables
    are separated by space in the input data file. Two of the variables—NAME and LANG—are
    character variables denoted by a $ following their names in the INPUT statement.
    Variables can be transformed or new variables can be created in a DATA step. The
    assignment statement logarea=log10(area); creates a new variable that is the log
    base 10 of the AREA variable in the country data set. Chapter 2 discusses importing
    data in more detail. Chapter 8 discusses creating new variables or recoding variables
    as part of DATA step programming.


    Procedure steps are easily recognized by the PROC statement that precedes the
    name of the procedure. (If you are interested in the history of computing, look
    back at the PL/I programming structure. At one time, SAS was a product with internal
    programs in PL/I'
  merge: -1
  img_proc: true
- pgno: 26
  md: "and FORTRAN. Now it has C code at its core.) SAS procedures can be used to\
    \ generate descriptive statistics (e.g., UNIVARIATE, MEANS, FREQ), or fit models\
    \ (e.g., REG, GLM, GENMOD, PHREG), or generate graphical displays (e.g., SGPLOT,\
    \ GMAP), or manipulate and process data sets (e.g., IMPORT, CONTENTS).\n\nThe\
    \ general syntax for a SAS procedure is:\n\n```\nPROC name DATA=dsn;\n    statement\
    \ 1;  /* often like a subcommand */\n    statement 2;\nrun;\n```\n\n# Recommendation:\
    \ Explicitly name the SAS data set to be used in a PROC step.\n\nYou should explicitly\
    \ name the SAS data set that is being analyzed in a PROC step using the DATA=DSN\
    \ option. SAS uses the last created data set as a default when a PROC is invoked.\
    \ If you have long programs with data sets being input, created, merged, output\
    \ from PROCs, etc., then you will be glad you followed this recommendation.\n\n\
    # Recommendation: Insert a RUN statement after each DATA step and PROC step.\n\
    \nThe habit of always ending a DATA or PROC step with a RUN statement makes a\
    \ SAS log that is easier to read and facilitates debugging. It is helpful to indent\
    \ the RUN statement so that it aligns with the DATA or PROC step that it closes.\
    \ (A colleague, Kathy Roggenkamp, asserts that following these recommendations\
    \ makes you a careful and knowledgeable programmer, and I agree.) Some companies\
    \ require a quality assurance review of programming code that involves an analyst\
    \ checking your code. Careful compliance with these recommendations, along with\
    \ commenting, result in code that is more likely to meet review standards.\n\n\
    The example in Display 1.1 includes three PROC steps. The first procedure, PROC\
    \ PRINT, lists the information in the country data set, including the values of\
    \ the variables that were imported from the external data file and the new variables.\
    \ The second procedure, PROC REG, fits a multiple regression model. The third\
    \ procedure, PROC SGPLOT, produces a scatter plot with two fits superimposed.\n\
    \nAdditional statements are required in some procedures. For example, the SGPLOT\
    \ procedure needs to be accompanied by at least one plot statement (e.g., SCATTER,\
    \ REG, LOESS, HBAR):"
  merge: -1
  img_proc: true
- pgno: 27
  md: "```\nods rtf bodytitle\n    file \"C:\\Users\\baileraj\\Desktop\\ch1-display-1.1-fig.rtf\"\
    ;\nproc sgplot data country;\n    reg y=lifewom x=loggnp;\n    loess y=lifewom\
    \ x=loggnp;\nrun;\nods rtf close;\n```\n\nIn addition, the PROC SGPLOT block is\
    \ wrapped with a specified ODS output type or destination. The SGPLOT procedure\
    \ and related ODS graphics procedures require that an ODS destination be specified\
    \ to produce the requested statistical graphics. (For more information, see Chapter\
    \ 6.) For many other procedures, the default LISTING destination (which is an\
    \ output window in an interactive session in SAS) is sufficient for displaying\
    \ the output produced by a procedure. ODS destinations include Web pages (HTML\
    \ destination), rich text formatted documents (RTF destination), and the PDF destination,\
    \ to name a few. For more information, see Chapter 4.\n\nSome statements are optional.\
    \ For example, in the PRINT procedure, the VAR statement is not required, but\
    \ it enables you to specify which variables in the data set that you want to print.\
    \ Compare the two PROC PRINT steps:\n\n```\nproc print data=country;\n    var\
    \ LIFEWOM LOGGNP;  * print 2 variables from country data set;\nrun;\n\nproc print\
    \ data=country;\nrun;  * prints all variables in the country data set;\n```\n\n\
    Display 1.2 shows a small program that generates a linear regression data set,\
    \ fits a simple linear regression model, and prints the observations in the data\
    \ set. An X variable is defined to be an integer value between 1 and 10, with\
    \ a corresponding Y variable produced by adding a pseudorandom normal deviate\
    \ to the conditional mean, 3 + 2*X. (For more information, see the RAND function\
    \ in Chapter 8.) In addition to these tasks (in the DATA step), the program includes\
    \ PROC PRINT to print all of the observations in the DATA step, and PROC REG to\
    \ request the fit of a simple linear regression model. (For more information about\
    \ fitting models, see Chapter 5.) The REG procedure also produces a scatter plot\
    \ with a superimposed fitted regression line. The data set is first printed using\
    \ the standard output destination (not the ODS RTF destination). Finally, the\
    \ RTF destination is specified in the ODS statement to generate output for PROC\
    \ REG output that is more easily incorporated into a manuscript. In addition,\
    \ an output file location is specified in the ODS statement. While this program\
    \ layout is not required on all systems, it is viewed as a good programming practice."
  merge: -1
  img_proc: true
