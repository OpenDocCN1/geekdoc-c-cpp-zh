    ods rtf bodytitle file=\"reg-est.rtf\";\nproc reg;\n  model y = x;\nrun;\nods\
    \ rtf close;\n```\n\nThe output is shown in Display 4.20.\n\n# Display 4.20 Using\
    \ ODS SELECT to select ParameterEstimates\n\n| Parameter Estimates |\n| Variable\
