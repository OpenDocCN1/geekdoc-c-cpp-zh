- pgno: 173
  md: "# Display 5.1 (continued)\n\n```\nproc sgplot data=man_pred;    * Y vs. X plot\
    \ with;\n  reg x=nboats y=manatees;    *   pred. reg. line and;\n    loess x=nboats\
    \ y=manatees; *   loess fit superimposed;\nrun;\n\nproc sgplot data=man_pred;\
    \    * Y vs. X plot with;\n  reg x=nboats y=manatees/cli; * pred. reg. line and;\n\
    run;                         * and conf/pred limits;\n\nproc sgplot data=man_pred;\n\
    \  loess x=yhat y=resid;       * residuals vs. predicted;\n  refline 0 / axis=y;\
    \         * plot with e=0 reference;\nrun;\nproc sgplot data=man_pred;\n  histogram\
    \ resid;            * histogram of residuals;\n  density resid / type=normal;\
    \ * with normal density;\nrun;\nods graphics off;\nODS RTF CLOSE;\n```\n\nMultiple\
    \ years of data are entered on each input line. (Recall that @@ signifies to continue\
    \ reading a line of data even after all variables for an observation are read.)\
    \ Then, ODS is invoked to direct output, and PROC REG is called to fit the model.\
    \ With PROC REG, the MODEL statement is all that is required. The MODEL statement\
    \ (model manatees = nboats) translates the linear regression model MANATEES =\
    \ β₀ + β₁ NBOATS + ε into code, where the response variable is listed to the left\
    \ of the equal sign and the predictor variables are listed to the right. In SAS,\
    \ the default behavior is to always include an intercept in the model. If you\
    \ want to exclude the intercept, then you need to state so explicitly as an option\
    \ in the MODEL statement. (If you want to fit MANATEES = β₁ NBOATS + ε, then use\
    \ the MODEL statement model manatees = nboats/noint to exclude the intercept.)\
    \ The current MODEL statement (model manatees = nboats / p r cli clm) includes\
    \ four options. The p option stands for predicted and is the fitted model prediction\
    \ of manatee deaths for each NBOATS value in the data set. The r option stands\
    \ for residual and is the difference between the observed number of manatee deaths\
    \ and the predicted number of manatee deaths based on the fitted model. The cli\
    \ option is the prediction interval for a new observation. The clm option is the\
    \ confidence interval for the mean response.\n\nHint: The predicted values, confidence\
    \ intervals, and prediction intervals are generated for values of the predictor\
    \ variable in the data set. If you want them generated for X values not in the\
    \ data set, add a hypothetical observation to your data set with X equal to the\
    \ value of interest, and Y equal to missing (.). This observation does not contribute\
    \ to the estimated intercept and slope. However, a predicted value, confidence\
    \ interval for the mean, and prediction interval for a new observation are generated\
    \ for X."
