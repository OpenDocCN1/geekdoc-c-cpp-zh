    Whenever you read data into a SAS data set, you should build in checks to confirm
    that the input data were correctly processed. First, you should always check the
    SAS log for errors. After any errors are corrected, you should print the data
    set that is produced, and then compare it to the original data source. While this
    might seem obvious, it is still worth mentioning. Another easy check that is good
    to perform is to compare the number of observations in the original data source
    with the new SAS data set. Let’s check to see whether the attempt to read a subset
    of the SMSA data set was successful.'
