    From these fits, allowing dinosaurs to have a different intercept leads to better
    fits. In particular, the coefficient associated with this term is significantly
    different from zero. (See the test of IDINO.) The residual error is reduced from
    0.442 to 0.094. The coefficient of determination is increased from 0.61 to 0.92.
    The model suggests that for all non-dinosaurs, the predicted log10(brain weight)i
    = 0.93879 + 0.74855 log10(body weight)i. For dinosaurs, the predicted log10(brain
    weight)i = 0.93879 + 0.74855 log10(body weight)i - 2.26674. Or, for dinosaurs,
    the predicted log10(brain weight)i = -1.32795 + 0.74855 log10(body weight)i. The
    predicted log10(brain weight) for the common intercept and different intercept
    models is generated as part of the data set mreexample2 in Display 5.13. The data
    are plotted with the predictions from each of the models.'
