  md: "# Display 1.1 A SAS program that fits a multiple regression\n\n```\n/*    \
    \  mreg-country-20may09.sas\n\nDirectory:  C:\\baileraj\\Classes\\Spring09\\programs\\\
    regression-examples\n           [Laptop]\nAuthor:     John Bailer\nPurpose:  \
    \  multiple regression example where average life expectancy\n            of women\
    \ is modeled as a function of country characteristics\n\nInput data file - -------------------------------\n\
    \            country.data\n\nDirectories:\n            \\\\Casnov5\\MST\\MSTLab\\\
    Baileraj\n            C:\\Users\\baileraj\\BAILERAJ\\Classes\\Web-Classes\\sta402\\\
    data\n\nInput variables -------------------------------\nName = country name (Character\
    \ variable)\nArea = country area\nPopsize = population size\nPcturban = % residents\
    \ in urban setting\nLang = primary language\nLiter = % literate\nLifemen = average\
    \ life expectancy men\nLifewom = average life expectancy women\nPcGNP = per capita\
    \ gross national product\n\nCreated Variables -----------------------------\n\
    logarea = log10(area);\nlogpopn = log10(popsize);\nloggnp = log10(pcGNP);\nienglish\
    \ = (lang=\"English\");\n\nData Source: Extracted from World Almanac\n*/\n* setting\
    \ up macro variables for directories;\n%let DIR1 = C:\\Users\\baileraj\\BAILERAJ\\\
    Classes\\Web-Classes\\sta402\\data;\n%let DIR2 = \\\\Casnov5\\MST\\MSTLab\\Baileraj;\n\
    \ndata country;\ntitle \"country data analysis\";\ninfile \"&DIR1\\country.data\"\
    ;\n\ninput name $ area popsize pcturban lang $ liter lifemen\n      lifewom pcGNP;\n\
    logarea = log10(area);\nlogpopn = log10(popsize);\nloggnp = log10(pcGNP);\nienglish\
    \ = (lang=\"English\");\ndrop area popsize pcgnp;\nrun;\n\nproc print data=country;\n\
    run;\n\nproc reg data=country;\n    title \"LITER and LOGGNP as predictors of\
    \ Life expectancy of women\";\n    model lifewom = liter loggnp/ tol vif collinoint;\n\
    \    output out=new p=yhat r=resid;\nrun;\n```"
  merge: -1
  img_proc: true
- pgno: 22
  md: "# Display 1.1 *(continued)*\n\n```\n/* plot life expectancy of women vs. log(GNP)\
    \ with a linear regression\n   fit and LOESS fit superimposed\n*/\nods rtf bodytitle\n\
    \       title=\"C:\\Users\\bailera\\Desktop\\ch1-display-1_1-fig.rtf\";\ntitle\
    \ \"\";\nproc sgplot data=country;\n  reg y=lifewom x=loggnp;\n  loess y=lifewom\
    \ x=loggnp;\nrun;\nods rtf close;\n```\n\nIn the example, a block of comments\
    \ is found at the beginning of this program (all text between the /* and */ symbols).\
    \ The name of the program is the first line of the comment block. I use a convention\
    \ where I build in the date as part of the filename. This is a habit that I find\
    \ useful. The directory and author information follow in the next lines. I often\
    \ use multiple machines, and it is helpful to identify this information here.\
    \ Next, the purpose of the program is explained. After that, the name of the input\
    \ data file is provided. The directories of the external data files and the input\
    \ variables that they contain are identified next. The last two sections in the\
    \ block describe other variables that are created and the original source of the\
    \ data. The actual program statements follow. In this example, the comment block\
    \ is longer than the program. While some people might think this is overkill,\
    \ I have never regretted having too many comments, but I have regretted having\
    \ too few. By the way, a second comment style was used in this code—a statement\
    \ beginning with an asterisk and ending with a semicolon is a comment (in the\
    \ code, see * setting up macro variables for directories;). A more useful version\
    \ of this code might assign labels to variables in the data set. For example,\
    \ the following statement would enhance the output of many statistical procedures:\n\
    \n```\nlabel lenglish = \"Indicator that English is primary language\";\n```\n\
    \nIn addition, labels are attached to the variables in a SAS data set. This is\
    \ discussed in more detail in upcoming chapters.\n\n# 1.2.2 Use meaningful variable\
    \ names\n\nMy first programming experience was with a version of FORTRAN that\
    \ had an upper limit on variable names. You could use any variable name that included\
    \ up to four characters. Variable names like B1 and X27 were common. Even SAS,\
    \ earlier in its evolution, had a maximum of eight characters in variable names.\
    \ Now, variable names can be up to 32 characters long and can include a mix of\
    \ uppercase and lowercase letters and underscores. (This makes for easier reading\
    \ of programs, although SAS is not case sensitive.) Variable names can begin with\
    \ letters (a–z, A–Z) or an underscore (_ ) with"
  merge: -1
  img_proc: true
- pgno: 23
  md: "letters, numbers, or underscores following. Beware when you transfer data sets\
    \ between applications (e.g., SAS to and from Excel, or to and from R). Variable\
    \ names in one system might be invalid in another system and can lead to odd names\
    \ when importing data. Use a naming convention that is meaningful but not a nuisance\
    \ to type. For example, I believe that body_weight or BodyWeight is preferred\
    \ over X34, but I don’t think I would use body_weight_in_kilograms. In Display\
    \ 1.1, loggnp and pcturban are clear in meaning and relatively simple to type.\
    \ The key idea is that using sensible variable names can help make your programs\
    \ self-documenting.\n\n# 1.2.3 DON'T USE ONLY CAPITALS IN PROGRAM STATEMENTS (although\
    \ some judicious use is reasonable)\n\nThe use of all uppercase in an e-mail is\
    \ viewed as shouting. In a program, I believe that all uppercase makes it harder\
    \ to read and, consequently, to debug. Many programmers like to see variable names,\
    \ data set names, and specific SAS names such as formats. functions, etc. capitalized.\
    \ Look at the following code:\n\n```\nPROC REG DATA=COUNTRY;\n    TITLE \"LITER\
    \ AND LOGGNP AS PREDICTORS OF LIFE EXPECTANCY OF WOMEN\";\n    MODEL LIFEWOM =\
    \ LITER LOGGNP/ TOL VIF COLLINOINT;\n    OUTPUT OUT=NEW P=YHAT R=RESID;\nRUN;\n\
    ```\n\nNow, look at this code:\n\n```\nproc reg data=COUNTRY;\n    title \"LITER\
