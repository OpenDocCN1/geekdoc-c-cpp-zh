    # 8.4 Ordering How Tasks Are Done


    Before you start implementing programming solutions for problems, you need to
    know the order in which calculations are executed (the so-called order of operations
    or precedence of operations). Let’s take a quick look at a common source of headaches
    for beginning programmers. (If you already know this stuff, then skip ahead.)
    Computers do what you say, not what you mean. Thus, you should carefully code
    programs in general and code equations in particular. When coding an equation,
    remember that computers execute the parts of the equation in a particular order.
    If there are no parentheses, exponentiation is done first. Then, multiplication
    and division (equal precedence) are done second. And, addition and subtraction
    (equal precedence) are done last. Expressions in parentheses are processed before
    other expressions are processed. Evaluation occurs from left to right when processing
    an equation. AND operators are executed before OR operators, which can make a
    difference in complicated expressions when programs do not include parentheses.


    Let’s move from the abstract to the concrete. The next example illustrates some
    of the dangers of careless coding. In the example, pay special attention to the
    pairs of calculations:


    ```

    x1a=3×2² versus x1b=(3×2)²

    x2a=3−2/2 versus x2b=(3−2)/2

    x3a=−2² versus x3b=(−2)²

    ```


    You probably expect the pairs to yield different values because of the grouping
    imposed by the parentheses. However, this is not quite as clear when you look
    at the code. For example, if you naively thought that code is processed from left
    to right without considering the order of operations, then you might expect x2a=3−2/2
    and x2b=(3−2)/2 to yield the same answer. Display 8.24 includes test code that
    demonstrates that this is not the case.'
