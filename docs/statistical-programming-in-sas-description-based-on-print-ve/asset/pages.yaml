- pgno: 105
  md: "You might be interested in attaching formats to the values of variables. Assigning\
    \ formats is discussed in detail in Chapter 8, but a few basic uses of formats\
    \ are discussed in this chapter. Formats can be attached to variables using an\
    \ assignment in a DATA step. Or, they can be temporarily attached to a variable\
    \ using a statement in a PROC. Attaching formats to variables is shown in Display\
    \ 3.7.\n\nThe variable Y is defined with a FORMAT statement as part of the data\
    \ block. The assigned format —dollar6.2— displays the values of Y as currency\
    \ with a $ sign attached. The 6.2 in the format says that six total spaces are\
    \ allocated for the output (including the $ sign and decimal point) with two digits\
    \ to the right of the decimal point. (More discussion about formats follows in\
    \ later chapters. However, this chapter gives you a taste of using formats.) This\
    \ assigned format affects any procedure that references Y in this data set. In\
    \ contrast, an assigned format is defined for variable X in the second PROC PRINT.\
    \ When the format is assigned in the procedure, it operates for the duration of\
    \ that procedure and not beyond. Titles are placed in the output using the TITLE\
    \ and TITLE2 statements. Titles appear on every output page until they are reset.\
    \ Up to 10 titles can appear on an output page. While TITLE specifies the first\
    \ title line for the output, the statement TITLEn specifies the nth title line\
    \ (n=2,...,10). More than three title lines (give or take) might limit the actual\
    \ output on a page. Lines can be added to the bottom of each page of output by\
    \ using the FOOTNOTEn option. This parallels TITLEn, with the exception that you\
    \ are specifying text to include at the foot of each page.\n\n# Display 3.7 Code\
    \ with a few formatting options\n\n```\noptions formdlim='=' pageno=1 ls=64 nocenter\
    \ nodate;\ndata dl;\n  input x y @@;\n  format y dollar6.2;\n  datalines;\n1 2\
    \ 4 3 5 6 12345 123456\n;\nrun;\n\nproc print data=dl;\n  title \"Y formatted\
    \ in DATA\";\nrun;\n\nproc print data=dl;\n  title2 \"X now formatted in the 2nd\
    \ PROC PRINT\";\n  format x dollar12.2;\nrun;\n\nproc print data=dl;\n  title2;\n\
    run;\n```"
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The different impacts of setting formats in a DATA step versus in a PROC are
    shown in Display 3.8.


    # Display 3.8 Output from printing data with a few formatting options


    ```

    Y formatted in DATA                                                                 1


    Obs        x        Y

    1          1        $2.00

    2          4        $3.00

    3          5        $6.00

    4          12345    123456


    ================================================================================

    Y formatted in DATA                                                                 2

    X now formatted in the 2nd PROC PRINT


    Obs                 x        Y

    1                   $1.00    $2.00

    2                   $4.00    $3.00

    3                   $5.00    $6.00

    4                   $12,345.00 123456


    ================================================================================

    Y formatted in DATA                                                                 3


    Obs        x        Y

    1          1        $2.00

    2          4        $3.00

    3          5        $6.00

    4          12345    123456

    ```


    The output reflects the options requested in the OPTIONS statement. The second
    title as requested by TITLE2 in the second PROC is in the output. The TITLE requested
    in the first PROC PRINT applies to the next two PROCs. The format defined for
    Y in the DATA step applies to all PROCs, while the format defined for X in the
    second PROC applies to only the second PROC. Question: “What happened to the format
    of Y in the fourth observation?” The problem is that the width of the format—6
    for Y—does not accommodate the value of the variable. In this case, the output
    displays the value of the variable without the $ sign and decimals.


    # 3.3 Defining Your Own Formats for Variable Values


    In the previous example, some of the formats that are internally defined within
    SAS (e.g., the DOLLARW.D format) are used. Many other formats are internally defined
    within SAS, including formats for processing and displaying dates and times. There
    are times when you want to define your own formats to display variable values.
    In these cases, the FORMAT procedure provides this flexibility.'
