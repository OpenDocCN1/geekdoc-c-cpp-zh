  md: '# 8.5 What Goes and What Stays in a Data Set


    You have used DATA steps to read data into variables and to manipulate data such
    as defining new variables. After you have finished these tasks, you might want
    to simplify the data set by getting rid of extraneous variables. The options DROP
    and KEEP specify variables to be eliminated from or saved in a SAS data set. In
    addition to eliminating variables, you might want to keep observations that satisfy
    some criteria. The statements WHERE and IF enable you to specify values of variables
    that you want to keep in a SAS data set. For example, the following statement
    includes only observations of the numeric variable LITERACY that have missing
    values:


    ```

    if literacy EQ .;

    ```


    The IF statement can be used in a series of IF-THEN-ELSE expressions. The WHERE
    statement can do a similar job to the IF statement, but it has specific operators,
    BETWEEN-AND, CONTAINS, IS NULL, IS MISSING, LIKE, and SAME-AND, which are documented
    extensively in SAS Help.


    Programming statements in DATA steps are often needed for even routine analyses.
    In Chapter 2, the SET option placed the contents of multiple data sets into a
    newly created data set. The OUTPUT statement wrote a current specification of
    a collection of variables to a data set. The OUTPUT statement can be used to expand
    a data set so that multiple lines are created in the new data set for each observation
    in the current data set. This is demonstrated in Display 8.26, which illustrates
    the manipulation of variables and records. The code starts by reading the nitrofen
    data into a SAS data set named nitro. The contents of nitro are then set into
    the new SAS data set nitrofen A. A single record for each animal is expanded into
    separate lines for each brood. The data for the first four animals are printed
    by imposing a where restriction. Informal challenge: Can you think of an alternative
    way of incorporating this same print restriction? This type of data structure
    is commonly used for particular models in SAS such as the linear mixed effects
    model, which can be analyzed using PROC MIXED.'
