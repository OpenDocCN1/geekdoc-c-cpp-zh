    \ type $ @;\n  if type='O' then do;\n    input x1-x10 y1-y10;\n    obs_diff =\
    \ mean(of x1-x10) - mean(of y1-y10);\n    retain obs_diff x1-x10 y1-y10;\n  end;\n\
    \  else do;\n    input in1-in20;\n\n* permute observations according to indices\
    \ in the array 'ins';\n    do ii = 1 to 20;\n      perms{ii} = both{ ins[ii] };\n\
    \    end;\n\n/* calculate test statistic for the permuted data and\n   save an\
