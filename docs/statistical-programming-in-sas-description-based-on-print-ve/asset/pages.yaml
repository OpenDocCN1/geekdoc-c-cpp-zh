    in the displays of the output? Why did this happen? Hint: See the Help documentation
    for the random normal deviate function—RAND(''NORMAL'')—and for setting seeds
    for the generators with STREAMINIT. (See Chapter 8, Section 8.11.)


    # 3.2 Statements That Can Modify the Output of Most Procedures


    Many statements can appear throughout a SAS program. These statements enable you
    to annotate output (e.g., TITLE and FOOTNOTE) or expand variable names or values
    of variables (e.g., LABEL and FORMAT). Examples illustrate formats defined in
    a DATA step versus formats applied as part of a PROC step along with TITLE.


    The program presented in Display 3.7 sets up system options so that the output
    does not have a date stamp (NODATE), is not centered (NOCENTER), has a width of
    64 (LS=64), starts renumbering output at page number 1 (PAGENO=1), and uses an
    equal sign as a page separator (FORMDLIM=''=''). The data block enters three observations
    from DATALINES. (By the way, the data set name d1 isn''t a very exciting data
    set name, and after I preached about this in Chapter 1 I feel guilty. Oh well,
    this is a toy example for an illustration.) The @@ in the INPUT statement tells
    SAS to continue reading a data line even after values for the new variables X
    and Y are found. This allows multiple observations to be entered on each line.'
