    # 3.13 Summary


    The purpose of this chapter is to help you start working with SAS procedures.
    The chapter begins with a quick presentation of options that control the display
    of SAS output. The annotation of output using the TITLE and LABEL statements follows.
    The use of formats is introduced and illustrated. Data set properties are displayed
    using PROC CONTENTS. The values of variables in a data set are listed using the
    PRINT procedure. Basic statistical graphics are introduced (SGPLOT), with statistical
    summaries of categorical variables (FREQ) and numeric variables (MEANS, UNIVARIATE)
    following. The selection of a simple random sample (SURVEYSELECT) and the randomization
    of treatments to experiments units (PLAN) bring this chapter to its close.


