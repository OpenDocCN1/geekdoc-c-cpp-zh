- pgno: 341
  md: "In this chapter, you are presented with a data structure (the array) that is\
    \ available in DATA steps. The array can store a collection of similar type elements.\
    \ Manipulations involving these data structures are provided. A series of examples\
    \ illustrate the power and flexibility of arrays. By default, SAS processes data\
    \ one record at a time, forgetting the values of variables from previous records.\
    \ (Sorry for anthropomorphizing SAS. I know it doesn’t really forget values, but\
    \ it is a useful image, nonetheless.) However, it is often important to keep the\
    \ values for processing future records. The RETAIN statement addresses this need.\
    \ The descriptions and basic illustrations of ARRAY and RETAIN are supplemented\
    \ with case studies that emphasize their power.\n\n# 9.1 Storage Bins for Collections\
    \ of Values\n\nAn array is a temporary data structure that contains a collection\
    \ of variables or values. Arrays are often used to store lists of variables. An\
    \ array can be conceptualized as a box that has been partitioned into many chambers,\
    \ and each chamber contains information. There are many ways to define the variables\
    \ and the values of these variables in an array. So, how do you tell SAS that\
    \ you want to set up an array for storing values? Here is the basic syntax:\n\n\
    ```\nARRAY arrayname{number of array elements} variable-list;\n```\n\n(The symbols\
    \ { }, [ ], and ( ) can all be used in an array definition.) If you want to define\
    \ the values of the variables directly, you can define them following the variable\
    \ list.\n\n# 9.1.1 Defining values in the variable list\n\nIn this example, one\
    \ array (tempF) is initialized with four Fahrenheit temperatures. This array is\
    \ looped over an array of Celsius temperatures (tempC) to calculate the values\
    \ corresponding to the Fahrenheit values.\n\n# Display 9.1 Converting temperature\
    \ scales using arrays\n\n```\ndata temps;\n  array tempF(4) tempF1-tempF4 (32,50,68,86);\n\
    \  array tempC(4) tempC1-tempC4;\n\n  do itemp = 1 to 4;\n    tempC(itemp) = 5/9*(tempF(itemp)-32);\n\
    \  end;\n  drop itemp;\nend;\nrun;\n\nproc print data=temps;\nrun;\n```"
  merge: -1
  img_proc: true
- pgno: 342
  md: "The printout from Display 9.1 includes the following output lines:\n\n| Obs\
    \ | temp F1 | temp F2 | temp F3 | temp F4 | temp C1 | temp C2 | temp C3 | temp\
    \ C4 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | 32 | 50\
    \ | 68 | 86 | 0 | 10 | 20 | 30 |\n\n# 9.1.2 Inputting values in the variable list\n\
    \nYou can read variable values into an array from data lines or from an external\
    \ file. Suppose the number of activities of daily living (ADL) that each resident\
    \ of a nursing home could conduct is measured during seven consecutive quarters.\
    \ It makes sense to consider each resident’s data as being naturally grouped.\
    \ In the following figure, a seven-element array contains the data from a resident\
    \ whose first two ADL measurements are 6, followed by three ADL measurements of\
    \ 5, followed by an ADL measurement of 4, and a final ADL measurement of 3.\n\n\
    | ADL[1] | ADL[2] | ADL[3] | ADL[4] | ADL[5] | ADL[6] | ADL[7] |\n| --- | ---\
    \ | --- | --- | --- | --- | --- |\n| 6 | 6 | 5 | 5 | 5 | 4 | 3 |\n\nFor this example,\
    \ the following code can be used to read these data into an array:\n\n```\ndata\
    \ D1;\nARRAY ADL{7} ADL1-ADL7;\n    input ADL1-ADL7;\n    datalines;\n6 6 5 5\
    \ 5 4 3\n;\nrun;\n```\n\nIn this portion of code, the array is named ADL, and\
    \ the elements are named ADL1 through ADL7. The size of the array is explicitly\
    \ declared to be 7 elements long by the use of {7} following the declaration of\
    \ the array name ADL. You can define the size of the array without counting the\
    \ elements in the array by using an asterisk, as in {*}. This is illustrated in\
    \ the next portion of code:\n\n```\ndata D2;\nARRAY ADL{*} ADL1-ADL7;\n    input\
    \ ADL1-ADL7;\n    datalines;\n6 6 5 5 5 4 3\n;\nrun;\n```"
  merge: -1
