    # 10.9 Bonus Material: Processing Multiple Data Sets


    A common challenge in statistical programming is processing a large number of
    data sets. For example, you might have data from individual subjects that are
    stored in separate files such as spreadsheets. Or, you might have separate data
    files for different dates. While these examples require processing many files,
    let’s look at a simple example that captures the essence of the problem.


    In this example, the general problem is merging data sets that contain time and
    temperature data. A different data set is available for each date. The construction
    of three time and temperature data sets is shown in Display 10.20. The data sets
    are named AUG03, AUG05, and AUG17, which are three observation dates in the month
    of August. The temperature (TEMP) variable is assigned a value that increases
    until a late afternoon maximum, and then decreases from that point onward.'
  merge: -1
  img_proc: true
- pgno: 395
  md: "# Display 10.20 Constructing three data sets for later use\n\n```\n/*\n   \
    \ construct 3 example data sets with time and temperature data\n*/\ndata aug03;\n\
    \    call streaminit(9035768);\n    mydate='AUG03';\n    do time=1 to 24;\n  \
    \      temp = 74 - abs(time-16) + RAND('Normal',0,0.5);\n        output;\n   \
    \ end;\nrun;\n\ndata aug05;\n    mydate='AUG05';\n    do time=1 to 24;\n     \
    \   temp = 78 - abs(time-16) + RAND('Normal',0,0.5);\n        output;\n    end;\n\
    run;\n\ndata aug17;\n    mydate='AUG17';\n    do time=1 to 24;\n        temp =\
    \ 90 - abs(time-16) + RAND('Normal',0,0.5);\n        output;\n    end;\nrun;\n\
    \n/* DEBUGGING BLOCK TO CHECK DATA SET CONSTRUCTION\ndata tester; set aug03 aug05\
    \ aug17;\nproc print data=tester;\n    id time;\nrun;\n\nods rtf bodytitle file='C:\\\
    Users\\baileraj.IT\\Desktop\\ch10-fig10.20.rtf';\nods graphics on;\nproc sgplot\
    \ data=tester;\n    series x=time y=temp / group=mydate;\n    symbol interpol=join;\n\
    run;\nods graphics off;\nods rtf close;\n*/\n```\n\nIf you want to read an arbitrary\
    \ number of arbitrarily named data sets, then you need to make sure of a few things.\
    \ In Display 10.21, the names of the data sets that you want to merge are read.\
    \ These data set names are assigned as the values of the macro variables &DSN1,\
    \ &DSN2, and so on using SYMPUTX. This task is similar to constructing the broods\
    \ in the last example. A count of the number of data sets processed is stored\
    \ as a macro variable."
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Display 10.21 Reading data set names and constructing macro variables


    ```

    /*

    create macro variable names corresponding to each data set.

    */

    data _null_;

    * read data sets and create macro variable with name of each;

    retain counter 0;

    input times $ @;

    counter = counter + 1;

    put times counter;

    * create a macro variable with each data set name;

    * create macro variable name with total number of DSNs;

    call symputx(''dsn'' || LEFT(counter), times);

    call symputx(''num_data_sets'', counter);

    datalines;

    aug03 aug05 aug17

    ;

    run;

    %put _user_;

    ```


    The values of the user-defined macro variables after executing the code in Display
    10.21 are requested by %put _user_. The macro variables and values are the following:


    GLOBAL NUM_DATA_SETS 3

    GLOBAL DSN1 aug03

    GLOBAL DSN2 aug05

    GLOBAL DSN3 aug17


    These macro variables are global because they are defined in open code, not defined
    internally in a macro.


    Display 10.22 contains the macro program. The macro program builds a DATA step
    that concatenates the &num_data_sets data sets whose names are the values of the
    macro variables (for example, &dsn1, &dsn2, and &dsn&num_data_sets). This task
    occurs when you execute the code in Display 10.21. In Display 10.22, the macro
    program that names the combined data set is invoked, the combined data set is
    printed, and a plot of the data is generated.'
  merge: -1
  img_proc: true
- pgno: 397
  md: "# Display 10.22 Defining and running a macro program\n\n```\n/*\n    construct\
    \ macro to concatenate data sets\n*/\n\n%macro concatenator(combine);\n  data\
    \ &combine;\n    set\n      %do ii = 1 %to &num_data_sets;\n        &&ds&ii\n\
    \      %end;\n  ;\nrun;\n%mend concatenator;\n\n/*\n    concatenate the three\
    \ data sets and print results\n*/\noptions mprint mlogic;\n%concatenator(combine=all3)\n\
    \ntitle;\nods rtf bodytitle\n    file='C:\\Users\\baileraj.IT\\Desktop\\ch10-fig10.24.rtf';\n\
    proc print data=all3;\nrun;\n\nods graphics on;\nproc sgplot data=all3;\n  series\
    \ x=time y=temp / group = mydate;\n  yaxis label=\"Temperature (deg. F)\"\n  \
    \  values=(55 to 95 by 10);\n  xaxis label=\"Time (h) since midnight\"\n    values=(0\
    \ to 24 by 6);\nods graphics off;\nrun;\nods rtf close;\n```\n\nSetting the mlogic\
    \ and mprint options provides a trace of the execution of this macro program.\
    \ From this trace, you can see that the following code is the result of %concatenator(all3):\n\
    \n```\ndata all3;\n  set aug03 aug05 aug17;\nrun;\n```"
