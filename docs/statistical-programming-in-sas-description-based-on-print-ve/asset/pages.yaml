    data cubic;\n    call streaminit(8675309);\n    do nrep=1 to 3;\n        do x=1\
    \ to 10;\n            response=3+1*x-.5*x**2 +.05*x**3 + rand('normal',0,1.5);\n\
    \            output;\n        end;\n    end;\nrun;\n\nods rtf bodytitle file=\"\
    C:\\Users\\baileraj.IT\\Desktop\\hist-default.rtf\";\nods graphics on;\nproc reg\
    \ data=cubic plots(only)=RESIDUALHISTOGRAM;\n    model response = x;\nrun;\nods\
    \ graphics off;\nods rtf close;\n\nods rtf bodytitle style=STATISTICAL  file=\"\
    C:\\Users\\baileraj.IT\\Desktop\\hist-statistical.rtf\";\nods graphics on;\nproc\
    \ reg data=cubic plots(only)=RESIDUALHISTOGRAM;\n    model response = x;\nrun;\n\
    ods graphics off;\nods rtf close;\n\nods rtf bodytitle style=JOURNAL2 file=\"\
    C:\\Users\\baileraj.IT\\Desktop\\hist-journal2.rtf\";\nods graphics on;\nproc\
    \ reg data=cubic plots(only)=RESIDUALHISTOGRAM;\n    model response = x;\nrun;\n\
    ods graphics off;\nods rtf close;\n\nods rtf bodytitle style=ANALYSIS file=\"\
    C:\\Users\\baileraj.IT\\Desktop\\hist-analysis.rtf\";\nods graphics on;\nproc\
    \ reg data=cubic plots(only)=RESIDUALHISTOGRAM;\n    model response = x;\nrun;\n\
    ods graphics off;\nods rtf close;\n```\n\nThe four histograms are arrayed in Display\
