- pgno: 203
  md: '```

    contrast ''plastic vs. rest'' condition 3 -1 -1 -1;

    ```


    This statement specifies the coefficients of the contrast and provides a label
    for output. The ORDER=DATA option in the GLM statement guarantees that the first
    coefficient, 3, corresponds to plastic (the first condition in the data set).
    The second coefficient, −1, corresponds to vacuum, and so on. The results of this
    contrast test are the following:


    | Contrast | DF | Contrast SS | Mean Square | F Value | Pr > F |

    |---|---|---|---|---|---|

    | plastic vs. rest | 1 | 9.98560000 | 9.98560000 | 86.19 | <.0001 |


    These results suggest that the plastic mean log-bacterial count differs from the
    average of the other three conditions. The final statement constructs a data set
    (new) with residuals that can be analyzed for checking model assumptions (e.g.,
    homogeneity of variance):


    ```

    output out=new p=yhat r=resid stdr=eresid;

    ```


    The procedures following the GLM analysis—PROC SGPLOT and PROC UNIVARIATE—produce
    graphical displays that can be used for checking the model. (The output of these
    procedures is not included. Some of it isn’t very interesting when you have a
    total of only 12 observations.)


    # 5.4 ANOVA Models—PROC GLM for an ANOVA Model with Two or More Factors


    Multiple factors in a designed experiment are commonly analyzed using a factorial
    treatment structure. Suppose a three-factor study was conducted with each factor
    set at one of two levels (a 2x2x2 or 2³ design). These three factors in combination
    define eight treatments. Thus, the one-way ANOVA model from the previous section
    could be applied. It is more interesting to study the factor effects and their
    possible interactions. In a display of minimal imagination, label these factors
    A, B, and C. A model for the response of the lth replicate at the ith level of
    factor A, jth level of factor B, and kth level of factor C is Y_ijkl = μ + α_i
    + β_j + γ_k + αβ_ij + αγ_ik + βγ_jk + αβγ_ijk + ε_ijkl. To request the analysis
    of this model in PROC GLM, the following partial code can be used:


    ```

    proc glm data=DSN;

    class A B C;

    model Y = A B C A*B A*C B*C A*B*C;

    run;

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'The MODEL statement includes the main effects (A B C), the two-way interactions
    (A*B A*C B*C), and the three-way interaction (A*B*C). An alternative for requesting
    this model using a shorthand expression in SAS follows:


    ```

    model Y = A|B|C

    ```


    Simpler models can be fit using a variation of this shorthand. For example, suppose
    you want to fit a model without the three-way interaction. One of the following
    two model statements works:


    ```

    model Y = A B C A*B A*C B*C;

    ```


    ```

    model Y = (A|B|C)@2;

    ```


    The fitting of factorial models (or any model with multiple factors, including
    blocking and Latin square designs) might result in Type I tests and Type III tests
    that differ. This difference reflects an issue related to sequential versus partial
    tests when the data are non-orthogonal. (Data that are non-orthogonal typically
    result from unbalanced cells.) See design texts for more information.


    The specification of a two-factor model and the differences between MEANS and
    LSMEANS are illustrated with a toy example. Suppose you have an experiment with
    a response variable, RESPONSE, that is measured in combination with two two-level
    factors, FACTOR1 and FACTOR2. There are 11 observations in this 2x2 factorial
    experiment. There are three replicate observations in each factor-level combination,
    except the (1,1) combination, in which two replicate observations are evaluated.
    These data are given in the following table:


    Factor 2


    | Factor 1 | 1 | 2 |

    |---|---|---|

    | 1 | 5, 7 | 10, 11, 12 |

    | 2 | 8, 9, 10 | 13, 14, 15 |


    Summary statistics for each factor-level combination are produced by PROC MEANS.
    The tests of interactions and main effects are produced by PROC GLM. The statements
    to enter these data and conduct these analyses are shown in Display 5.24.'
  merge: -1
  img_proc: true
- pgno: 205
  md: "# Display 5.24 Interactions test, main effects test, and mean calculations\
    \ for a 2×2 experiment\n\n```\ndata twoway;\n    input response factor1 $ factor2\
    \ $ @@;\n    datalines;\n5 1 1   7 1 1\n10 1 2   11 1 2   12 1 2\n8 2 1    9 2\
    \ 1   10 2 1\n13 2 2   14 2 2   15 2 2\n;\nrun;\n\nods rtf bodytitle;\nproc means\
    \ data=twoway maxdec=1;\n    class factor1 factor2;      * calculate cell means;\n\
    \    var response;\nrun;\n\nproc means data=twoway maxdec=1;\n    class factor1;\
    \              * calculate factor 1 level means;\n    var response;          \
    \     * (pool over factor 2 levels);\nrun;\nproc means data=twoway maxdec=1;\n\
    \    class factor2;              * calculate factor 2 level means;\n    var response;\
    \               * (pool over factor 1 levels);\nrun;\n\nproc glm data=twoway;\n\
    \    class factor1 factor2;\n    model response = factor1 | factor2;\n    means\
    \ factor1 factor2;\n    lsmeans factor1 factor2;\nrun;\nods rtf close;\n```\n\n\
    The output from the three invocations of PROC MEANS is shown in Display 5.25.\
    \ The first table includes the four cell means. For example, the mean of the (1,1)\
    \ cell is 6=(5+7)/2. The mean of the (1,2) cell is 11=(10+11+12)/3. The second\
    \ table includes the means of all five observations in the first level of FACTOR1,\
