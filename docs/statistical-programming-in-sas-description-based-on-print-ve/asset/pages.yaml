  md: '# Display 4.14 Browser display of Web page with a frame, table of contents,
    and links to the output from three SAS procedures


    ![](img/26474180ee55914c13fb9156a7678157_154_0.png)


    # 4.4.3 What''s produced and how to select it


    There are going to be times when you want to grab only part of the results produced
    by a procedure. In this section, you learn how to determine what output objects
    are produced by a procedure, and how to select particular tables or output objects.
    In the following example, a data set with 20 observations is generated, with two
    observations at values of X=1, 2, ..., 10, where Y = 3 + 1.5 X + 2*ε, where ε
    ~ N(0,1). The pseudorandom normal deviate generator RAND is used with a seed specified
    using call streaminit (54321). (The specification of the seed enables you to run
    the same code and replicate the results. If SEED=0 was used, then a seed based
    on time since midnight would be the result, and each run of the code would generate
    a different set of data.)


    ```

    call streaminit (54321)

    ```'
  merge: -1
  img_proc: true
- pgno: 155
  md: "Data are generated using a little programming in the DATA step. (More of this\
    \ programming comes in later chapters, but it makes for a fun example here.) An\
    \ ODS RTF statement constructs the table with the results of PROC PRINT.\n\n#\
    \ Display 4.15 Program that produces a regression data set\n\n```\ndata simreg;\n\
    \  beta0 = 3; * Simulate Y ~ N( 3 + 1.5 X, sigma = 2 );\n  beta1 = 1.5;\n  sigma\
    \ = 2;\n  call streaminit(54321);\n    do nobs = 1 to 2;\n      do x = 1 to 10;\n\
    \        y = beta0 + beta1*x + sigma*RAND('Normal');\n        output;\n      end;\n\
    \    end;\nrun;\n\nods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\\
    Display-4.15.rtf\";\nproc print data=simreg;\nrun;\nods rtf close;\n```\n\nbeta0,\
    \ beta1, and sigma represent parameters underlying the regression relationship\
    \ that is simulated. The x values are design points, and the y values are sampled\
    \ from Y | X ~ N(3 + 1.5 X, 2). The data set produced by this program is shown\
    \ in Display 4.16."
  merge: -1
  img_proc: true
