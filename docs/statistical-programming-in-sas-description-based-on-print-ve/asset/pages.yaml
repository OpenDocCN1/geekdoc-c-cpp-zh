    # 9.1.5 Creating multiple observations from a single record


    Different procedures in SAS might expect data to have different structures. For
    example, some of the multivariate procedures expect all of the variables to be
    defined in a single record. In other cases, such as in mixed models applied to
    longitudinal data, different measurements are expected to be defined in different
    records. It is important to be able to program the expansion of a single record
    to multiple records, or to be able to condense multiple records into a single
    record. Suppose you have data in the following form:


    | Name | Sex | t1 | t2 | t3 | t4 | t5 | time6 | time_7 |

    |------|-----|----|----|----|----|----|-------|--------|

    | Smith | M | 6 | 6 | 5 | 5 | 5 | 4 | 3 |

    | Jones | F | 7 | 5 | 4 | 4 | 3 | 2 | 1 |

    | Fisher | M | 5 | 5 | 5 | 3 | 2 | 2 | 1 |'
