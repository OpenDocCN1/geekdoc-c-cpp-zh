- pgno: 79
  md: "The PROC SQL commands include the definition of an alias for each data set.\
    \ For example:\n\n```\nselect * from\n    SMSA_subset_weather w, SMSA_subset_demog\
    \ d,\n        SMSA_subset_pollution p\n```\n\nThis code allows w.city to reference\
    \ the variable CITY in the SMSA_subset_weather data set. In addition, a join criterion\
    \ is declared that matches rows of the combined data set when CITY is the same\
    \ in the three data sets. For example:\n\n```\nwhere w.city=d.city and d.city=p.city;\n\
    ```\n\nThe data set from the PROC SQL inner join is shown in Display 2.35.\n\n\
    # Display 2.35 Data set produced by the inner join of the three SMSA subset data\
    \ sets\n\n| Obs | City | JulyTemp | Education | S02Pot |\n|---|---|---|---|---|\n\
    | 1 | Akron, OH | 71 | 11.4 | 59 |\n| 2 | Albany-Schenectady-Troy, NY | 72 | 11.0\
    \ | 39 |\n| 3 | Baltimore, MD | 77 | 9.6 | 206 |\n| 4 | Allentown, Bethlehem,\
    \ PA-NJ | 74 | 9.8 | 33 |\n| 5 | Atlanta, GA | 79 | 11.1 | 24 |\n\nOne difference\
    \ between merging data sets using DATA step programming versus PROC SQL is that\
    \ the input data sets need to be sorted by some key variable before merging with\
    \ DATA step programming. Sorting is not required in PROC SQL.\n\nAn interesting\
    \ question is, “What happens if the data doesn’t have complete matches in the\
    \ data sets that are being combined?” In the next series of displays, this question\
    \ is answered. In Display 2.36, two of the SMSA subset data sets that have three\
    \ of the five cities are shown. In Display 2.37, the first table shows the results\
    \ of an inner join containing the three cities that are in common. The second\
    \ and third tables show the results of an outer join and the elements of the first\
    \ data set in the join (a left join). The fourth table shows the results of an\
    \ outer join and the elements of the second data set in the join (a right join).\
    \ The fifth table shows the results of an outer join and the union of elements\
    \ from both data sets (a full join). SAS documentation illustrates these joins\
    \ with shaded Venn diagrams, which is a nice model for conceptualizing these operations.\
    \ In this book, an empirical display is shown in Display 2.36. Output is shown\
    \ in Display 2.37.\n\n3 An outer join is the contents of an inner join (the intersection\
    \ of two tables) plus additional observations from the tables in the join."
