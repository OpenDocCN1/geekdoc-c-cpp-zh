    # 11.9.2 Case Study 2: Multiple-linked graphics windows


    The previous case study involved a single plot and a data object. You performed
    the actions using menu options or pointing and clicking. In this case study, it’s
    a bit more complicated. In particular, IMLPlus commands are used to read a previously
