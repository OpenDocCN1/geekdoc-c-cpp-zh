    end;\navgnncsr = sumnncsr/4;\n\n/* Accumulate counts of patterns consistent with\
    \ clustering */\nile = (avgnncsr <= avgnnobs);\nnumle = numle + ile;\n\n* ige\
    \ = (avgnncsr >= avgnnobs);\n* numge = numge + ige;\n\ndrop i j ii xobs1-xobs4\
    \ yobs1-yobs4 nnobs1-nnobs4\n      sumnnobs sumnncsr;\noutput;\nend;      * of\
    \ the isim - simulation loop;\n```"
  merge: -1
