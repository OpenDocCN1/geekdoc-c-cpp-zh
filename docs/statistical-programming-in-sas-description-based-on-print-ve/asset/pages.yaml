    # 6.6 Case Study: Using the SG Procedures


    Because these new SG procedures are sufficiently important to statistical programmers
    and data analysts, it is a worthwhile practice for you to produce graphs to explore
    a data set. In this section, you will conduct a quick graphical exploration of
    a subset of the variables in the SMSA data set from Chapter 2. An extensive code
    example is shown in Display 6.22 in which formats, labels, and SG procedures are
    used to examine key features of the data.'
  merge: -1
  img_proc: true
- pgno: 240
  md: "# **Display 6.22** SMSA data formatted, labeled, and graphically explored\n\
    \n```\noptions formdlim='~' nodate;\n\ndata SMSA_from_txt;  * from Display 2.8;\n\
    \  infile \"C:\\Users\\balleraj.T\\Desktop\\SMSA-DASL-2space-sep.txt\" firstobs=2;\n\
    \  length city $ 39;\n  input city & JanTemp JulyTemp RelHum Rain Mortality Education\
    \ PopDensity\n        pct_NonWhite pct_WC pop pop_per_house income HCPot NOxRot\
    \ SO2Pot NOx;\nrun;\n\n/* extract and save the 5 number summary for Jan. Temps\
    \ */\nproc univariate data=SMSA_from_txt;\n  var JanTemp;\n  output out=JanSumOut\
    \ min=Jmin Q1=JQ1 Median=JQ2 Q3=JQ3 max=Jmax;\nrun;\n\n/* assign the 5 number\
    \ summaries (min,Q1,M,Q3,max) to macro variables */\n/* (see Ch. 10 for more on\
    \ Macro magic) */\ndata _null_;\n  set JanSumOut;\n  call symputx('M_Jmin', Jmin);\n\
    \  call symputx('M_JQ1', JQ1);\n  call symputx('M_JQ2', JQ2);\n  call symputx('M_JQ3',\
    \ JQ3);\n  call symputx('M_Jmax', Jmax);\n  %put _user_;\nrun;\n\n/* create informative\
    \ formats for later displays */\nproc format;\n  value gt32F 0=\"below freezing\"\
    \n              1=\"above freezing\";\n  value JTemp 1 = \"&M_Jmin <= Jan. Temp.\
    \ (F) <= &M_JQ1\"\n              2 = \"&M_JQ1 < Jan. Temp. (F) <= &M_JQ2\"\n \
    \             3 = \"&M_JQ2 < Jan. Temp. (F) <= &M_JQ3\"\n              4 = \"\
    &M_JQ3 < Jan. Temp. (F) <= &M_Jmax\";\nrun;\n\n/* define and add a variable indicating\
    \ Jan. temps > 32 deg F and a variable */\n/* containing the Jan. temp quartile\
    \ category */\ndata SMSA_from_txt;\n  set SMSA_from_txt;\n\n  freezing = (JanTemp>32);\n\
    \  label freezing=\"Temp. in January\";\n  format freezing gt32F.;\n```"
  merge: -1
  img_proc: true
- pgno: 241
  md: "# Display 6.22 (continued)\n\n```\nif &M_Jmin < JanTemp <= &M_JQ1 then JanTemp_quart=1;\n\
    else if JanTemp <= &M_JQ2 then JanTemp_quart=2;\nelse if JanTemp <= &M_JQ3 then\
    \ JanTemp_quart=3;\nelse if JanTemp <= &M_Jmax then JanTemp_quart=4;\n\nlabel\
    \ JanTemp_quart=\"Interval:\";\nformat JanTemp_quart JTemp.;\nrun;\n\n/* debugging\
    \ check to see if variables correctly defined */\nproc print data=SMSA_from_txt;\n\
    \    var JanTemp JanTemp_quart freezing;\nrun;\n\n/* define set of graphics */\n\
    ods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\SMSA-plots.rtf\";\n\n\
    * Display 6.23: HISTOGRAM of Jan. Temp.;\nproc sgplot data=SMSA_from_txt;\n  \
    \  histogram JanTemp;\n    density JanTemp / type=kernel;\nrun;\n\n* Display 6.24:\
    \ Scatter plot of Mortality vs. Education;\nproc sgplot data=SMSA_from_txt;\n\
    \    scatter x=Education y=Mortality;\nrun;\n\n* Display 6.25: Scatter plots with\
    \ shared y-axis for comparison;\nproc sgscatter data=SMSA_from_txt;\n    compare\
    \ y=Mortality x=(Education income JanTemp) / loess;\nrun;\n\n* Display 6.26: Scatter\
    \ plot matrix;\nproc sgscatter data=SMSA_from_txt;\n    matrix Mortality Education\
    \ income JanTemp / diagonal=(histogram);\nrun;\n\n* Display 6.27: Separate scatter\
    \ plots for levels of other variables;\nproc sgpanel data=SMSA_from_txt noautolegend;\
    \  * to suppress legend;\n    panelby freezing;\n    loess x=Education y=Mortality;\n\
    run;\n\n* Display 6.28: Same plot with diff. symbols and line types for diff var\
    \ levels;\nproc sgplot data=SMSA_from_txt;\n    loess x=Education y=Mortality\
    \ / group=freezing;\nrun;\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: "# Display 6.22 (continued)\n\n```\n* Display 6.29: scatter plot paneled by\
