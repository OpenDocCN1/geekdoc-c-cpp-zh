- pgno: 209
  md: '# 5.5 Summary


    The purpose of this chapter is to describe the specification of regression and
    ANOVA models in SAS. The emphasis is on the specification of linear and multiple
    regression models and one-way and factorial ANOVA models. This discussion is intended
    to supplement your study of linear models (say, like an introductory course in
    regression or experimental design methods). In addition, this information gives
    you a sense of how the MODEL statement is used in SAS, and how categorical factors
    (using CLASS statements) and numeric predictor variables enter regression models.


    # 5.6 References


    +   - Kuehl, Robert O. 1994. *Statistical Principles of Research Design and Analysis*.
    Belmont, CA: Duxbury Press.

    +   - Kutner, Michael H., et al. 2004. *Applied Linear Statistical Models*. 5th
    Ed. Boston: McGraw-Hill/Irwin.

    +   - Lunneborg, Clifford E. 1994. *Modeling Experimental and Observational Data*.
    1st Ed. Belmont, CA: Duxbury Press.

    +   - Moore, David S., and George P. McCabe. 2003. *Introduction to the Practice
    of Statistics*. 4th Ed. New York, NY: W. H. Freeman and Co.

    +   - Muller, Keith E., and Bethel A. Fetterman. 2002. *Regression and ANOVA:
    An Integrated Approach Using SAS Software*. Cary, NC: SAS Institute and John Wiley
    & Sons, Inc.


    # 5.7 Exercises


