    */\n\ndata twogroup;\n\narray x{10} x1-x10;\narray y{10} y1-y10;\n\ncall streaminit(11223344);\n\
    \ndo isim = 1 to 10000;\n\n/* generate samples X~N(0,1)  Y~N(0,4) - normal case\
    \ */\ndo isample = 1 to 10;\n    x{isample} = RAND('normal',0,1);\n    y{isample}\
    \ = RAND('normal',0,2);\nend;\n\n/* calculate the t-statistic */\nxbar = mean(of\
    \ x1-x10);\nybar = mean(of y1-y10);\n\nxvar = var(of x1-x10);\nyvar = var(of y1-y10);\n\
    \ns2p = (9*xvar + 9*yvar)/18;\n\ntstat = (xbar-ybar)/sqrt(s2p*(2/10));\nPvalue\
