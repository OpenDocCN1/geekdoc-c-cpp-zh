    # 11.7 Case Study 3: Randomization Test Using Matrices Imported from PROC PLAN


    In Display 11.13, the two-group randomization test example from Chapter 9 is revisited.
    (You might want to look back at the Chapter 9 illustration to remind yourself
    about randomization test ideas and see the SAS code for generating permutations.)
    In this example, PROC PLAN is used to generate permutations of the indices 1:20
    (i.e., the labels 1 to n1+n2). The permutations are imported into SAS/IML to calculate
    the permutation test statistic. The actual data are imported into SAS/IML as the
    matrix nitro. The indices are in the matrix perm_index. The matrix perm_resp is
    the data in nitro rearranged based on the rows of indices in perm_index. The permutation
    test statistic is presented in the PERM_RESULTS matrix. The difference in sample
    means (which is equal to the difference in sample sums because the two groups
    have equal sample sizes (n1=n2=10)) is presented in the PERM_RESULTS matrix. And,
    an indicator of whether this difference is larger than the observed value of the
    test statistic is presented in the PERM_RESULTS matrix. The proportion of 1s in
    the second column of the PERM_RESULTS matrix defines the p-value.'
  merge: -1
  img_proc: true
- pgno: 422
  md: "# Display 11.13 SAS/IML code to implement randomization test\n\n```\noptions\
    \ nocenter nodate;\nlibname class 'folder-containing-nitrofen-data';\n\ntitle\
    \ \"Randomization test in IML - Nitrofen conc 0 vs. 160 compared\";\ndata test;\
    \ set class.nitrofen;\n    if conc=0 | conc=160;\nrun;\n\nproc plan;\n    factors\
    \ test=4000 ordered in=20;\n    output out=d_permut;\nrun;\n\nproc transpose data=d_permut\
    \ prefix=in\n                    out=out_permut(keep=in1-in20);\n    by test;\n\
    run;\n\nproc iml;\n/* read SAS data in IML */\nuse class.nitrofen;\nread all var\
    \ { total conc } where (conc=0|conc=160) into nitro;\n\n/* read the indices for\
    \ generating the permutations into IML */\nuse out_permut;\nread all into perm_index;\n\
    \nobs_vec = nitro[,1];\nobs_diff = sum(obs_vec[1:10]) - sum(obs_vec[11:20]); \
    \ * test statistic;\n\nPERM_RESULTS = J(nrow(perm_index),2,0);  * initialize results\
    \ matrix;\n\ndo iperm = 1 to nrow(perm_index);\n    ind = perm_index[iperm,];\
    \          * extract permutation index;\n    perm_resp = obs_vec[ind];       \
    \   * select corresponding obs;\n    perm_diff = sum(perm_resp[1:10]) - sum(perm_resp[11:20]);\n\
    \    PERM_RESULTS[iperm,1] = perm_diff; * store perm TS value/indicator;\n   \
    \ PERM_RESULTS[iperm,2] = abs(perm_diff) >= abs(obs_diff);\nend;\n\nperm_Pvalue\
    \ = PERM_RESULTS[+,2]/nrow(PERM_RESULTS);\nprint 'Permutation P-value = ' perm_Pvalue;\n\
    quit;\nrun;\n```\n\nExecuting this code produces a permutation p-value of 0.03575."
  merge: -1
  img_proc: true
- pgno: 423
  md: "# 11.8 Case Study 4: SAS/IML Module to Implement Monte Carlo Integration to\
    \ Estimate π\n\nIn all of the previous examples, SAS/IML code was specific to\
    \ one particular problem. However, you might want to produce code that can be\
    \ applied in other contexts. In Display 11.14, SAS/IML modules are constructed\
    \ using the techniques in “Case Study 1: Monte Carlo Integration to Estimate π.”\
    \ The beginning of a module is noted by start module-name (parm1, parm2, ...).\
    \ Its conclusion is noted by finish module-name. Modules are invoked by run module-name\
    \ (parm1, parm2, ...), where a value is substituted for parm in the run statement.\
    \ In the following example, a module is implemented. This module is for the Monte\
    \ Carlo estimation of π, which depends on a parameter corresponding to the number\
    \ of simulated points that are generated in the first quadrant (nsim). This module\
    \ is run with three values of nsim (400, 1600, and 4000). Not surprising, the\
    \ standard error and CI width decrease as the number of simulated points increases.\n\
    \n# Display 11.14 SAS/IML module to estimate π using Monte Carlo integration\n\
    \n```\noptions nocenter nodate;\nproc iml;\n\n/* MODULE TO ESTIMATE PI\n- Monte\
    \ Carlo integration used\n- Strategy:\n    Generate X~Unif(0,1) and Y~Unif(0,1)\n\
    \    Determine if Y <= sqrt(1-X*X)\n    PI/4 estimated by proportion of times\
    \ condition above is true\n- INPUT\n    nsim = # simulations\n    seed = seed\
    \ for RANDGEN\n- OUTPUT\n    estimate of PI along with SE and CI\n*/\n\nstart\
    \ MC_PI(nsim, seed);\n    temp_mat = J(nsim,2,0);\n\n    call randseed(seed);\n\
    \    call randgen(temp_mat,'uniform');\n\n    temp_mat=temp_mat||(temp_mat[,2]<=sqrt(J(nsim,1,1)-temp_mat[,1]##2));\n\
    \    pi_over4 = temp_mat[+,3]/nsim;\n```"
  merge: -1
  img_proc: true
