  md: '![](img/26474180ee55914c13fb9156a7678157_170_0.png)


    # Basic Models in SAS


    +   5.1 Overview of Modeling

    +   5.2 Linear Regression Models

    +   5.3 ANOVA Models—PROC GLM for a One-Way ANOVA

    +   5.4 ANOVA Models—PROC GLM for an ANOVA Model with Two or More Factors

    +   5.5 Summary

    +   5.6 References

    +   5.7 Exercises


    Chapter 3 presented SAS procedures for generating summaries for categorical and
    numeric variables. Chapter 4 addressed customizing output and creating fancy tables.
    In this chapter, you learn how to specify and fit models for the relationship
    between variables. SAS procedures that study the relationship between a single
    continuous variable and other variables are described in this chapter. SAS procedures
    for linear regression are introduced for predicting a continuous response variable
    as a linear function of one or more predictor variables. SAS procedures for ANOVA
    models are described. Basic descriptions of these statistical methods are presented.'
  merge: -1
