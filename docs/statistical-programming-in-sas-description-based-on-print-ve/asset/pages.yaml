- pgno: 113
  md: "# Display 3.15 Producing a horizontal bar chart using PROC SGPLOT\n\n```\n\
    %let DATA_DIR = C:\\Users\\baileraj.IT\\Desktop;\n%let OLD_DIR = M:\\public.www\\\
    classes\\sta402\\SAS-programs;\n\ndata nitro_tox;\n    infile \"&DATA_DIR\\ch2-dat.txt\"\
    \n          firstobs=16 expandtabs missover pad ;\n    input @9 animal 2. @17\
    \ conc 3. @25 brood1 2.\n          @33 brood2 2. @41 brood3 2. @49 total 2.;\n\
    run;\n\n* ods rtf bodytitle file=\"&DATA_DIR\\Display-3.15.rtf\";\nods listing\
    \ image dpi=300;\nods graphics / width=4.5in;\nproc sgplot data=nitro_tox;  *\
    \ Display 3.16;\n    hbar conc / response=total stat=mean limits=both limitstat=stddev\n\
    \                numstd=2;\nrun;\n\nproc sgplot data=nitro_tox; * Display 3.17;\n\
    \    dot animal / response=total group=conc;\nrun;\n\nods graphics off;\n* ods\
    \ rtf close;\n```\n\nThe bar lengths in Display 3.16 correspond to the mean number\
    \ of young produced (stat=mean) for each concentration (hbar conc). The limits\
    \ extend to reflect a multiple of the standard deviation from the mean in each\
    \ concentration (limitstat=stddev numstd=2). The limits could be modified to reflect\
    \ a confidence interval for each unknown mean (limitstat=clm) if you wanted that\
    \ information. So, when would you prefer which display? Hint: Do you want to describe\
    \ the distribution of responses in a sample? Or. do you want to reflect the uncertainty\
    \ when estimating an unknown population parameter?"
  merge: -1
  img_proc: true
