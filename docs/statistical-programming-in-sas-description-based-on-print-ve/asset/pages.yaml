    The real power of PROC SQL surfaces as you manipulate table relations. For example,
    five nitrofen concentration data sets are concatenated using UNION in Display
    2.32. In PROC SQL, the SAS data set all_sql is created as a result of the following
    command:


    ```

    create table all_sql as

    ```


    All variables are selected from each data set as a result of the following command:


    ```

    select * from conc 0

    ```


    The * is a wildcard representing the selection of all variables. UNION stacks
    the table into a final table. Then, all values are sorted by ID within CONC as
    a result of the following command:


    ```

