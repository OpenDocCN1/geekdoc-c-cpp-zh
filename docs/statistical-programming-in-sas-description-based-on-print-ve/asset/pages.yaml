- pgno: 319
  md: "# Display 8.40 (continued)\n\n```\nxvar = var(of x1-x10);\nyvar = var(of y1-y10);\n\
    \n* >>>> calculate pooled variance and t-test statistic;\ns2p = (9*xvar + 9*yvar)/18;\n\
    \ntstat = (xbar-ybar)/sqrt(s2p*(2/10));\n\n* >>>> calculate p-value ;\nPvalue\
    \ = 2*(1-CDF('t',abs(tstat),18));\nReject05 = (Pvalue <= 0.05);\n\noutput;\nend;\
    \  * of loop over simulated experiments;\nrun;\nods rtf bodytitle file=\"C:\\\
    Users\\baileraj.IT\\Desktop\\Display-8-41.rtf\";\nproc freq data=simulate_2group_t;\n\
    \    table Reject05;\nrun;\nods rtf close;\n```\n\nRunning this program results\
    \ in a table that shows that the null hypothesis of mean equality is rejected\
    \ in 4.98% of the 4000 simulated experiments when the null hypothesis of equal\
    \ means is true. Samples with the size of 10 are selected from normal populations\
    \ with common variances. A nominal 5% significance level is used. Question: Any\
    \ insight into why these are exactly the same results observed in the previous\
    \ implementation?\n\nLet’s close this case study with a few observations. The\
    \ functions MEAN and VAR are used to calculate the sample means and variances.\
    \ The function CDF is used to calculate the probability of a random variable t\
    \ with 18 degrees of freedom being less than or equal to the absolute value of\
    \ the observed value. This value is doubled to construct the two-tailed p-value.\
    \ How would you modify this code if you were interested in one-sided alternatives\
    \ such as Hₐ: μ₁ > μ₂? Do you see any inefficiency in this code? For example,\
    \ are you repeatedly calculating the same quantity within the loop over simulated\
    \ experiments? Also, this code is too difficult to generalize for other conditions.\
    \ This problem is discussed in Chapter 9."
