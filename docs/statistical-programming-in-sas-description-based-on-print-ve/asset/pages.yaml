    # 3.5 Displaying Data Set Properties and Observations


    The contents of a data set, including data set attributes, variable names, types
    (character, numeric), storage lengths, formats, and labels, can all be displayed
    using the CONTENTS procedure. These details for the nitro_tox data set can be
    generated and displayed using the following code, which is presented in Display
    3.13:


    ```

    proc contents data=nitro_tox;

    run;

    ```


