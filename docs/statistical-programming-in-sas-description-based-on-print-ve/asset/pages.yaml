- pgno: 465
  md: '# Solve your data analytic problems using SAS®!


    In Statistical Programming in SAS®, author A. John Bailer integrates SAS tools
    with interesting statistical applications and uses SAS 9.2 as a platform to introduce
    programming ideas for statistical analysis, data management, and data display
    and simulation. Written using a reader-friendly and narrative style, the book
    includes extensive examples and case studies to present a well-structured introduction
    to programming issues.


    This book has two parts. The first part addresses the nuts and bolts of programming,
    including fostering good programming habits, getting external data sets into SAS
    to construct an analysis data set, generating basic descriptive statistical summaries,
    producing customized tables, generating more attractive output, and producing
    high-quality graphical displays. The second part emphasizes programming in the
    context of a DATA step, in macros, and in SAS/IML® software.


    Examples of statistical methods and concepts not always encountered in basic statistics
    courses (for example, bootstrapping, randomization tests, and jittering) are used
    to illustrate programming ideas. This book provides extensive illustrations of
    the new ODS Statistical Graphics procedures in SAS, a description of the new ODS
    Graphics Editor, and a brief introduction to some of the capabilities of SAS/IML®
    Studio, such as producing dynamically linked data displays and invoking R from
    SAS.


    ![](img/26474180ee55914c13fb9156a7678157_465_0.png)


    A. John Bailer, PhD, is Distinguished Professor and Chair in the Department of
    Statistics at Miami University in Oxford, Ohio. He is an affiliate member of the
    Department of Sociology and Gerontology and the Department of Zoology, an affiliate
    member at the Institute of Environmental Sciences, and a Scripps Research Fellow
    at the Scripps Gerontology Center, which are all at Miami. He received his PhD
    in Biostatistics from the University of North Carolina at Chapel Hill. He is a
    Fellow of the American Statistical Association and the Society for Risk Analysis,
    and he is a member of the International Biometric Society and the International
    Statistical Institute. He has used SAS® software for approximately 30 years, and
    remembers a time when all you needed to know about SAS was contained in one user''s
    guide.


    Free Code on the Web! support.sas.com/authors


    > "For programmer-analysts tasked with statistics, statisticians tasked with programming,
    and for everyone in between—this book is a winner!" Christine Leonard Westgate
    Self-employed data analyst and SAS user for over 12 years


    > "This book has it all—a wealth of useful information for all levels of statistical
    programmers, from the beginner to the advanced." Brian Adams Sr. Business Performance
    Analyst Dominion Virginia Power'
