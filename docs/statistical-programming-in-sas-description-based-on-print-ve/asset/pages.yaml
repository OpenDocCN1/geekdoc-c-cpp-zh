    There is a lot more to regression modeling than obtaining a least squares fit.
    For example, checking model assumptions is presented at the end of this section.
    Suppose you want to report the results of your model fit to a decision maker.
    You need to make sure that you are aware of other potential explanations. For
    example, suppose the manatee population increased over the study period. In this
    case, the number of manatee deaths due to motorboats could increase as a result
    of more manatees being at risk, as opposed to how many registered motorboats there
    are. An alternative analysis might look at the rates of manatee deaths due to
    motorboats. In SAS, a Poisson regression model might be fit using PROC GENMOD
    with the number of manatee deaths as a response. In this case, the number of manatees
    is used to define an offset in the model, and the number of motorboats registered
    is still used as a predictor variable.


    Display 5.4 was produced as a result of the options specified with the MODEL statement.
    (Another display including a plot of residuals and Cook’s D statistics was omitted.)
    The Dep Var column identifies the Y (MANATEES) variable for each observation.
    The Predicted Value column is the model prediction for that value at the associated
    X (NBOATS) variable. The Residual column is the difference between these quantities.
    The CL Mean and CL Predict columns are produced by the CLM and CLI options, respectively,
    in the MODEL statement. The values correspond to the confidence interval for the
    mean response and the prediction interval for a new response, respectively. Information
    about these columns and the last two columns are beyond the scope of this book.
    For more information, see the regression documentation.'
