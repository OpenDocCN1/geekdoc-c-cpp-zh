- pgno: 291
  md: "Time needs to be stored as an elapsed number relative to a reference time.\
    \ In SAS, time is recorded as the number of seconds that have elapsed since midnight.\
    \ Display 8.14 includes code to define three variables using time and date constants\
    \ (the t and d in the character expressions define these variables as times and\
    \ dates). The code displays internal storage values and formatting of values.\n\
    \n# Display 8.14 Time and date formats\n\n```\nData NULL;\n time_date_origin =\
    \ 0;\n nowtime = '09:00't;\n today = '17jun2008'd;\n put time_date_origin @20\
    \ time_date_origin datetime13.;\n put nowtime @20 nowtime time9.;\n put today\
    \ @20 today date9.;\n run;\n```\n\nIn Display 8.15, 9:00:00 corresponds to 9*60*60=32400\
    \ seconds since midnight. And, 17JUN2008 corresponds to 17700 days since January\
    \ 1, 1960.\n\n# Display 8.15 Time and date values in SAS\n\n|  |  |\n|---|---|\
    \ \n| 0 | 01JAN60:00:00 |\n| 32400 | 9:00:00 |\n| 17700 | 17JUN2008 |\n\nThe last\
    \ example is a simple illustration of reading date, time, and currency data into\
    \ a SAS data set. The data values are printed. Suppose your data were in the following\
    \ format:\n\n```\n1       2       3       4\n1234567890123456789012345678901234567890\
    \ [column guides]\n01/01/1960      01:00:00 $100.22\n09/29/2003      09:49:59\
    \ $12693.79\n```\n\nData could be read and displayed using the program in Display\
    \ 8.16."
  merge: -1
  img_proc: true
