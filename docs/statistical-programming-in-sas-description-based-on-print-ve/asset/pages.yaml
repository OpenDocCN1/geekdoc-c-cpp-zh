    Each simulated sample leads to a model fit based on the two lines of the PARMEST
    data set that show the estimate associated with VARIABLE=''INTERCEPT'' as b0,
    and the estimate associated with VARIABLE=X as b1. This SAS log reports that 4000
    lines of output are associated with the 2000 model fits.


    ```

    NOTE: The data set WORK.PARMEST has 4000 observations and 9 variables.

    ```


    DATA step programming is needed to extract the intercept estimate from one line
    and pair it with the slope estimate from the next line for each model fit. This
    is accomplished using the following code:


    ```

    data ParmEst2; set ParmEst;

    retain b0;

    if variable="Intercept" then b0 = estimate;

    else do;

