    The difference in the values of CDF is used to calculate the probability of the
    five possible values of a binomial random variable when four trials are conducted.
    Calculating the probability mass function is unnecessary given other functions
    available in SAS. In fact, SAS provides a general function for obtaining the value
    of the probability density function (PDF) of a continuous random variable, or
    the value of the probability mass function (PMF) of a discrete random variable
    using the PDF function. Here is the general syntax of this function:


    ```

    PDF(''distribution-name'', value-of-random-variable, parameter-list-sep-commas)

    ```


    Many distributions can be used here. Display 8.51 shows a program that calculates
    Pr(Y=m) for m=0,1,2,3,4 for Y~binomial(n=4, π=0.5) and the value of the standard
    normal density at z=0 using the PDF function.


    # Display 8.51 PDF and PMF functions


    ```

    data pdf_examples;


    /* Pr(Y=m) for Y ~ binomial(p=prob of success=0.5, n=4 trials) */

    bin_0 = PDF(''binomial'', 0, 0.50, 4);

    bin_1 = PDF(''binomial'', 1, 0.50, 4);

    bin_2 = PDF(''binomial'', 2, 0.50, 4);

    bin_3 = PDF(''binomial'', 3, 0.50, 4);

    bin_4 = PDF(''binomial'', 4, 0.50, 4);


    /* Z ~ N(0,1) value of phi(0) */

    normal_density_0 = pdf("Normal", 0);

    run;

    ods rtf bodytitle file="C:\Users\baileraj.IT\Desktop\Display-8-52.rtf";

    proc print data=pdf_examples;

    run;

    ods rtf close;

    ```'
