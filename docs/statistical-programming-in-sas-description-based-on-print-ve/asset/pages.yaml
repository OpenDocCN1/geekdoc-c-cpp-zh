- pgno: 238
  md: "The SGSCATTER procedure produces a panel of scatter plots of various combinations\
    \ of variables. However, these panels can include independently specified variables.\
    \ Display 6.20 shows the code for requesting separate scatter plots for the three\
    \ brood counts and total count versus concentrations.\n\n# Display 6.20 Requesting\
    \ a panel of scatter plots of brood counts versus concentrations\n\n```\ndata\
    \ nitrof en;\n  infile 'C:\\Users\\baileraj.IT\\Desktop\\ch2-dat.txt' firstobs=16\
    \ expandtabs missover pad;\n  input @9 animal 2. @17 conc 3. @25 brood1 2. @33\
    \ brood2 2. @41 brood3 2. @49 total 2.;\nrun;\n\ntitle;\n\nods rtf bodytitle file=\"\
    C:\\Users\\baileraj.IT\\Desktop\\nitrofen-plots2.rtf\";\nproc sgscatter data=nitrofen;\n\
    \  plot (brood1 brood2 brood3 total)*conc / loess uniscale=ALL;\n  * UNISCALE\
    \ option ensures axis scales are uniform for better comparison;\nrun;\n\nods rtf\
    \ close;\n```\n\nIn addition, a LOESS smooth is added to each scatter plot as\
    \ shown in Display 6.21."
  merge: -1
