- pgno: 161
  md: "# Display 4.21 Generating a set of regression data, fitting the model, and\
    \ extracting and plotting coefficients\n\n```\ndata simreg;\n    beta0 = 3;  *\
    \ Simulate Y ~ N(3 + 1.5 X, sigma = 2);\n    beta1 = 1.5;\n    sigma = 2;\n  \
    \  call streaminit(54321);\n    do iexpt = 1 to 2000;  * generate 2000 samples/experiments\
    \ with 20 (x,y) observations;\n        do nobs = 1 to 2;  * with 2 replicates\
    \ at x=1 to 10 by 1;\n            do x = 1 to 10;\n                y = beta0 +\
    \ beta1*x + sigma* RAND('Normal');\n                output;\n            end;\n\
    \        end;\n    end;\nrun;\n\nproc print data=simreg;\ntitle \"first 2 experiments\
    \ from the SIMREG data set\";\n    where iexpt<=2;\nrun;\n\nods output ParameterEstimates=ParmEst;\n\
    proc sort data=simreg;\n    by iexpt;\nrun;\nproc reg data=simreg;\n    by iexpt;\n\
    \    model y = x;\nrun;\nods output close;\n\nproc print data=ParmEst;\ntitle\
    \ \"first 2 experiments from the PARMEST data set\";\n    where iexpt<=2;\n  \
    \  var iexpt Variable Estimate;\nrun;\n```"
  merge: -1
  img_proc: true
