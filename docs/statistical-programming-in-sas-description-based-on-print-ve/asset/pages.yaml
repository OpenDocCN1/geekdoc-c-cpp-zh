    # 6.4 Graphing with Styles and Templates


    ODS styles are used to “control the colors and general appearance of all graphs
    and tables” (Kuhfeld 2009). Default ODS styles can be used for most applications.
    The default styles produce a graph with varying colors, which might not be acceptable
    for some journal applications. The following statements compare four different
    styles for examining a residual histogram produced by PROC REG. (See Display 6.8.)
    Different styles are specified as options in the ODS RTF statement. The default
    RTF style, the STATISTICAL style, the JOURNAL2 style, and the ANALYSIS style are
    compared.'
