    4. The Central Limit Theorem (CLT) provides insight into the sampling distribution
    of the sample mean. Informally, the CLT states that the distribution of the sum
    of a sample of independent and identically distributed (i.i.d.) random variables
    from a distribution with a finite mean and variance will approach a normal distribution
    as the sample size increases. This is frequently summarized in the colloquial
    terms “the sample mean looks normal” as the sample size increases. Suppose you
    generate a large number of samples from a distribution (say, uniform). How might
