    ```\n\nThis method is useful for small data sets, but not for large data sets.\
    \ SAS data can be entered from an external file using the INFILE statement shown\
    \ in Display 1.1.\n\nA SAS library is a collection of SAS data sets (and possibly\
    \ other SAS objects) in a common location such as a directory or folder. SAS data\
    \ can be read from an existing SAS library using the LIBNAME or SET statement.\
    \ In the following code, a permanent library is created in a directory on a D\
    \ drive with the SUMMAR98 data set. This data set will be read and later analyzed.\n\
    \n```\nLibname insas \"D:\\baileraj\\grants\\odhs-oct98\\Datasets\";\n```\n\n\
    ```\ndata mds mar98; set insas.summar98;\n```\n\nIn this case, the permanent SAS\
    \ data set is a file named summar98.sas7bdat, located in the folder specified\
    \ by the path D:\\baileraj\\grants\\odhs-oct98\\Datasets. (The file extension\
    \ .sas7bdat is used in Windows and specifies a SAS data set.) This permanent SAS\
    \ data set is copied to a temporary data set named MDS MAR98 and is located in\
    \ the WORK library. The temporary data set will exist for the duration of this\
    \ SAS session.\n\nAs shown in Display 1.2, you can generate data in a DATA step\
    \ for later use. This is a common task in simulation studies. In the following\
    \ code, a linear regression data set is generated with Y ~ N(μ=3 + 2 X, σ=2):\n\
    \n```\ndata lin_reg_data;\n    call streaminit(32123);\n    do X = 1 to 10 by\
    \ 1;\n        Y = 3 + 2*X + 2*RAND('NORMAL');\n        output;\n    end;\nrun;\n\
    ```\n\nData can also be imported into SAS from other applications such as Microsoft\
    \ Excel (using the Import Wizard or PROC IMPORT) or Oracle (using PROC SQL). Selecting\
    \ Import Data from the File menu in Windows launches the Import Wizard. You can\
