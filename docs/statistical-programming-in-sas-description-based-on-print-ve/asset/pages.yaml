    # 11.9 Introducing SAS/IML Studio


    SAS/IML Studio provides a highly flexible programming environment in which you
    can run SAS/STAT or SAS/IML analyses, and then display the results with dynamically
    linked graphics and data tables. In addition, SAS/IML Studio provides a way to
    call R functions from SAS (R Development Core Team, 2008). Earlier in this chapter,
    you learned that SAS/IML is a programming language for high-level, matrix-vector
    computations. IMLPlus is an extension of SAS/IML that contains additional programming
    features that enhance SAS/IML. IMLPlus is the language of SAS/IML Studio 3.2,
    a new statistical software product in SAS 9.2 intended for data analysts who write
    SAS programs to solve statistical problems, but who need more versatility for
    data exploration and model building.


    IMLPlus enables techniques that are difficult or impossible to perform in SAS/IML,
    including calling SAS procedures without leaving SAS/IML, passing the value of
    a SAS/IML matrix directly to a SAS procedure, and creating and manipulating dynamically
    linked statistical graphics. Illustrations of many of the important features of
    SAS/IML Studio are provided in this section. However, a comprehensive review of
    these features is not. For more information, you can review the documentation
    for this product, which is available online at http://support.sas.com/documentation/onlinedoc/imlstudio/index.html.
    The SAS/IML Studio 3.2: User''s Guide is extensive and provides a good tour of
    the GUI interface. SAS/IML Studio 3.2 for SAS/STAT Users might be a better and
    more concise starting point. This book provides numerous examples that create
    a basis for some of the examples in this section.'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'Before looking at examples, you should learn some basic vocabulary. The definition
    of *class* in the next paragraph and most of the information in this paragraph
    is excerpted from Chapter 1 of *SAS/IML Studio 3.2 for SAS/STAT Users*. SAS/IML
    Studio is a program that allows access to servers running SAS. You run SAS/IML
    Studio on a client computer, while the computer running SAS is the SAS server.
    These are often the same computer, but that isn’t required. It is important to
    understand where data reside and how to move it between the client and the server.


    A key distinction between programming in SAS and programming in SAS/IML Studio
    is that SAS is a procedural programming language, and SAS/IML Studio is structured
    more like an object-oriented programming language. A *class* is defined as an
    “abstract package of data and functions that query, retrieve, or manipulate the
    data.” These functions are referred to as methods. An object is a particular instance
    of a class. Programmers coming to SAS from Java or C++ are excited to see this
    structure, whereas programmers from a FORTRAN or C background might find this
    a bit strange.


