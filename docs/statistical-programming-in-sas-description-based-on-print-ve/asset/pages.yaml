- pgno: 10
  md: '# About This Book


    # Purpose


    Statistical programming is necessary where data-based analyses or simulation studies
    are conducted. For example, Monte Carlo methods are used to generate *p*-values
    for complex statistics. And, manipulating large data sets is becoming commonplace.
    Many people experience computing exclusively through a graphical user interface.
    Therefore, they might not be prepared to deal with the challenges of constructing
    specialized programs to address their research problems. They might not be familiar
    with basic programming concepts (e.g., looping or conditional execution) or programming
    styles to keep programs easier to read and maintain (e.g., modular code with sensible
    commenting). In this book, SAS 9.2 is used as a platform to introduce programming
    ideas for statistical analysis, data management, and simulation. Examples of statistical
    methods and concepts not always encountered in basic statistics courses (e.g.,
    bootstrapping, randomization tests, and jittering) are used to illustrate these
    programming ideas.


    # Intended Audience


    Upper-level undergraduates, beginning graduate students, or professionals involved
    in data analysis, data management, or simulation studies. Some familiarity with
    basic statistical estimation and testing ideas is assumed.


    Recently, a new section for statistical programmers and analysts was added to
    the American Statistical Association. Members of this new ASA section and members
    of the International Association for Statistical Computing, which is a section
    of the International Statistical Institute, might be interested in this book as
    well.


    # Scope of This Book


    This book has two parts. The first part addresses the nuts and bolts that are
    associated with good programming habits, getting external data sets into SAS to
    construct an analysis data set, generating basic descriptive statistical summaries,
    producing customized tables, generating more attractive output, and producing
    statistical graphics that lead to data insight. The second part emphasizes programming
    in the context of a DATA step, in macros, and in SAS/IML.


    A good chunk of the topics included in the Base SAS Certification exam is included
    in this book, along with topics such as SQL and macros that are in the Advanced
    SAS'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Certification exam. Other topics are discussed such as high-quality graphical
    displays including one of the first descriptions of the new SAS 9.2 ODS Statistical
    Graphics procedures. Included in the book are extensive illustrations of the new
    ODS Statistical Graphics procedures in SAS, and a description of the new ODS Graphics
    Editor. Finally, an introduction to some of the capabilities of SAS/IML Studio,
    such as producing dynamically linked data displays and invoking R from SAS, is
    included in the last chapter.


    # Use in a Statistical Programming Class


    This book was developed as material for a semester-long class in statistical programming
    at Miami University (STA 402/502). Approximately 75% of a semester-long class
    is devoted to this material. Therefore, I believe this book could be used as a
    quarter-long introduction to statistical programming in SAS. This material has
    been successfully used by statistics students and by students from other disciplines
    including ecology, gerontology, marketing, microbiology, psychology, and economics.


    # Belief and Style


    You learn programming by doing it. And, you tend to learn a lot more from failing
    and fixing code than from getting it right the first time. So, you will get the
    most out of this book by trying the various code displays and the suggested exercises
    at the end of each chapter. The style of prose in this book is informal. I hope
    this makes the book a more entertaining read. This book is not written with a
    simple linear trajectory in which topics are not used until they are fully defined
    and developed. In programming, you might find that you need functions, procedures,
    etc., long before you learn about them in any formal way. Thus, I, unapologetically,
    brashly, and frustratingly (to some colleagues who prefer linear development and
    presentations) sometimes use ideas that are defined in later chapters if it helps
    tell a more interesting story earlier in the book. In addition, many of the exercises
    might require that you dig for additional programming information to successfully
    complete the exercise. When I teach this material, I assign the exercises early
    in class discussion, and then I serve as a consultant to the students throughout
    the following classes as they work on the exercises.


    # Software Used for This Book


    This book is based on SAS 9.2 software. Although every effort has been made to
    include the latest information available at the time of printing, new features
    will be made available in later releases. Be sure to check out the SAS Web site
    for current updates, and check the SAS OnlineDoc for enhancements and changes
    in new releases of SAS.'
  merge: -1
  img_proc: true
