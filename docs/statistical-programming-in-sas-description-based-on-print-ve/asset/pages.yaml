  md: "# 11.9.3 Case Study 3: SAS/IML matrix manipulations and invocations of SAS/STAT\
    \ procedures\n\nSAS/IML Studio enables you to interact with SAS/STAT. In Display\
    \ 11.25, a data object containing the SMSA data is created. A subset of the variables\
    \ is written to the SAS server for use with PROC REG, which then creates a data\
    \ set with residuals. The residuals are copied back to the SAS/IML Studio client\
    \ data object, and a scatter plot of Residuals versus the predictor variable Education\
    \ is produced. A horizontal reference line is added at zero. The submit and endsubmit\
    \ pair (also known as a submit block) in IMLPlus is required to process SAS/STAT\
    \ commands on the SAS server.\n\n# Display 11.25 Exporting a data object, fitting\
    \ a regression, adding residuals, and generating a plot\n\n```\ndeclare DataObject\
    \ dobj;\ndobj=DataObject.CreateFromFile(\"C:\\Users\\baileraj.IT\\DASL_SMSA.sas7bdat\"\
    );\nDataTable.Create(dobj);\n\n/* follows Ch 4-6 in SAS/IML Studio 3.2 for SAS/Stat\
    \ Users */\ndobj.WriteVarsToServerDataSet({\"Education\", \"Mortality\"},\n\"\
    work\", \"SMSA\", true);\n\nsubmit;\nproc reg data=SMSA;\n  model Mortality =\
    \ Education;\n  output out=resout r=residuals;\nrun;\nendsubmit;\n\nok = CopyServerDataToDataObject(\
    \ \"work\", \"resout\", dobj,\n(\"residuals\"),  /* name on SAS server */\n{\"\
    residuals\"),  /* name in DataObject */\n(\"Residuals\"),  /* label in DataObject\
    \ */\ntrue            /* replace if existing variable has this name */\n);\n\n\
    declare ScatterPlot resplot;\nresplot = ScatterPlot.Create(dobj, \"Education\"\
    , \"Residuals\");\nresplot.DrawUseDataCoordinates();\nresplot.DrawLine(0, 0, 1,\
    \ 0);\n```\n\nIn Display 11.26, PROC REG output is displayed in SAS/IML Studio.\
    \ Selecting points with relatively large or small residuals identifies New Orleans\
    \ as having a mortality rate appreciably higher than what a linear prediction\
    \ based on education would suggest (i.e., a large positive residual). Lancaster,\
    \ PA, and York, PA, have mortality rates appreciably lower than what a linear\
    \ prediction based on education would suggest. Dynamically linking the residual\
    \ plot with the data table enables you to quickly and easily evaluate"
