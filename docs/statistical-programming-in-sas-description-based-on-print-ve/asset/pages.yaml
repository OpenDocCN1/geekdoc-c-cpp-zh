    # 3.8 Using Scatter Plots to Display Relationships between Numeric Variables


    Scatter plots are preferred when looking at the relationship between two numeric
    variables. The SGPLOT procedure is the tool for this display. Are you seeing a
    pattern at this point? PROC SGPLOT is the statistical graphics procedure that
    accommodates most of the basic displays that you construct in a data analysis.
    More details about PROC SGPLOT and other statistical graphics procedures are provided
    in Chapter 6. Go ahead and jump to Chapter 6 if you are feeling a bit impatient.
    These procedures are a very cool addition to SAS 9.2 and it is well worth your
    time to explore their use.


    The simple example in Display 3.18 produces three plots. The first plot shows
    the total number of young produced in three broods (total) versus nitrofen concentration
    (conc) where the value of the cbrood variable is used as a group variable that
    yields a'
  merge: -1
  img_proc: true
- pgno: 116
  md: "different plotting symbol. (See Display 3.19.) The second plot shows the brood-specific\
    \ counts as a function of nitrofen concentration. (See Display 3.20.) The third\
    \ plot will be discussed in a moment.\n\n# Display 3.18 Generating the three scatter\
    \ plots\n\n```\n%let DATA_DIR = C:\\Users\\baileraj.IT\\Desktop;\nproc format;\n\
    value totfmt    0='none'\n                1-HIGH='some';\nrun;\n\ndata nitro_tox;\n\
    \    infile \"&DATA_DIR\\ch2-dat.txt\"\n        firstobs=16 expandtabs missover\
    \ pad ;\n    input @9 animal 2. @17 conc 3. @25 brood1 2.\n          @33 brood2\
    \ 2. @41 brood3 2. @49 total 2.;\n    cbrood3 = brood3;\n    format cbrood3 totfmt.;\n\
    run;\n\n* ods rtf bodytitle file=\"&DATA_DIR\\Display-3.18.rtf\";\nods listing\
    \ image_dpi=300;\nods graphics / width=4.5in;\n\nproc sgplot data=nitro_tox; \
    \   * Display 3.19;\n    scatter y=total x=conc  / group=cbrood3;\nrun;\n\nproc\
    \ sgplot data=nitro_tox;    * Display 3.20;\n    scatter y=brood1 x=conc;\n  \
    \  scatter y=brood2 x=conc;\n    scatter y=brood3 x=conc;\nrun;\n\n* add JITTER\
    \ to concentration to separate points in the plot;\ndata nitro_tox3; set nitro_tox;\n\
    \    jconc = conc + 20*RAND('uniform')- 10;\n                        * add jitter\
    \ to the concentration for plotting;\nrun;\n\nproc sgplot data=nitro_tox3;   \
    \ * Display 3.21;\nxaxis label = \"Nitrofen concentration (jittered)\";\nyaxis\
    \ label = \"Number of young\";\n    scatter y=brood1 x=jconc;\n    scatter y=brood2\
    \ x=jconc;\n    scatter y=brood3 x=jconc;\nrun;\n\nods graphics off;\n* ods rtf\
    \ close;\n```"
  merge: -1
  img_proc: true
