- pgno: 192
  md: "variable named GROUP, and a covariate named X, then the test of equal slopes\
    \ can be constructed using PROC GLM. The following statements conduct this test:\n\
    \n```\nproc glm data=DSN;\n    class GROUP;\n    model RESPONSE = X GROUP  X*GROUP;\n\
    run;\n```\n\n(See the test associated with the X*GROUP component.) In fact, the\
    \ PROC GLM step in Display 5.13 conducts this test with IDINO as the classification\
    \ variable. In the previous statements, adding an ODS Graphics statement produces\
    \ a figure similar to Display 5.15.\n\n# 5.3 ANOVA Models—PROC GLM for a One-Way\
    \ ANOVA\n\nIn experimental studies, comparing average responses between different\
    \ treatments or different populations is often the focus. Data analyzed in these\
    \ models stem from random samples from g distinct populations or from randomly\
    \ assigning one of the g treatments to experimental units in a sample. Assuming\
    \ comparable variability in the different groups, a test of the null hypothesis\
    \ of equal means in the g groups (i.e., H₀: μ₁ = ... = μ_g) can be tested using\
    \ an F test, which tests the ratio of variation between groups relative to variability\
    \ within groups. (See Kutner et al. (2004) for a discussion of ANOVA model tests\
    \ and related topics.) (Recall that g=2 corresponds to the familiar t-test, which,\
    \ in this case, is the pooled variance version.) A model for the response of the\
    \ jth observation in the ith group (i=1,2,...,g (treatments or populations), j=1,2,...,n_i\
    \ (replications), and Y_ij) is the cell means model (Y_ij = μ_i + ε_ij). This\
    \ model can be written in the form of an effects coding model as Y_ij = μ + α_i\
    \ + ε_ij, where the interpretation of μ can depend on the coding of α_i. For example,\
    \ if α_g =0, then μ corresponds to the mean in the gth group (reference cell coding).\
    \ If Σ α_i=0, then μ corresponds to an overall mean. (For more information, see\
    \ problem 3 in Section 5.7 “Exercises.”) As with regression models, ε_ij ~ independent\
    \ N(0, σ²).\n\n# 5.3.1 Comparing bacterial growth under different packaging conditions\
    \ using a one-way ANOVA model\n\nIt is easy to get consensus that bacterial growth\
    \ should be inhibited in packaged meats. It might be that different packaging\
    \ conditions provide different degrees of inhibiting bacterial growth. In the\
    \ example shown in Display 5.16, the data described and analyzed"
  merge: -1
  img_proc: true
- pgno: 193
  md: "by Kuehl (1994) are examined.¹ The mean log-bacterial growth for g=4 is described\
    \ for different packaging (plastic, vacuum, mixed, and CO₂), with nᵢ=3 replicates\
    \ for each type of packaging.\n\n# Display 5.16 Fitting a one-way ANOVA model\n\
    \n```\n/* Bacteria in meat under 4 different conditions */\noptions ls = 75;\n\
    data meat;\n    input condition $ logcount @@;\ndatalines;\nPlastic    7.66  \
    \  Plastic    6.98    Plastic    7.80\nVacuum     5.26    Vacuum     5.44    Vacuum\
    \     5.80\nMixed      7.41    Mixed      7.33    Mixed      7.04\nCo2       \
    \ 3.51    Co2        2.91    Co2        3.66\n;\nrun;\n\ntitle \"bacteria growth\
    \ under 4 packaging conditions\";\n\nODS RTF file='C:\\Users\\baileraj.IT\\Desktop\\\
    oneway-output.rtf';\nods listing image dpi=300;\nods graphics on / width=4.5in;\n\
    proc sgplot data=meat;          * graphical comparisons;\n    vbox logcount /\
    \ category=condition;\nrun;\n\nproc glm data=meat order=data plot(unpack)=diagnostics;\n\
    \    title2 \"fitting the one-way anova model via GLM\";\n    class condition;\n\
    \    model logcount = condition;\n    means condition / bon tukey scheffe cldiff\
    \ lines;\n    lsmeans condition / cl pdiff;\n    lsmeans condition / cl pdiff\
    \ adjust=Tukey;\n    contrast 'plastic vs. rest' condition 3 -1 -1 -1;\n    output\
    \ out=new p=yhat r=resid stdr=eresid;\nrun;\n\nproc sgplot data=new;         \
    \ * plots for model checking;\n    title2 \"residual analyses\";\n    scatter\
    \ x=yhat y=resid;\n    refline 0 / axis=y;\nrun;\n\nproc univariate data=new noprint;\n\
    \    histogram resid / normal;\n    qqplot resid / normal;\nrun;\nods graphics\
    \ off;\n\nODS RTF CLOSE;\n```\n\n³ Meat data set usage based on the \"Bacteria\
    \ growth in meat\" data set from Kuehl, R. O. Statistical Principles of Research\
    \ Design and Analysis. 1st Ed. © 1994. Brooks/Cole, a part of Cengage Learning,\
    \ Inc. ISBN: 9780534188047(0534188044)."
  merge: -1
  img_proc: true
