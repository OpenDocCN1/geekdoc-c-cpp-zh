    print 'Estimating PI using MC integration method with' nsim\n      'data points';\n\
    print pi_est se_est pi_LCL pi_UCL;\n\nfinish MC_PI;\n/*****************************************************************/\n\
    run MC_PI(400, 12345);\nrun MC_PI(1600, 12345);\nrun MC_PI(4000, 12345);\nquit;\n\
