    | Coeff Var | 14.53141 |  |  |


    The estimated regression coefficients are presented in the Parameter Estimates
    table in Display 5.3. The estimates of β₀ and β₁ are -41.4 and 0.12, respectively.
    This implies that the prediction equation for the number of manatee deaths is
    MANATEES = b₀ + b₁ NBOATS = -41.43 + 0.12 NBOATS. With each additional 1000 motorboats
    registered (NBOATS changes by 1), it is predicted that 0.12 additional manatee
    deaths would be observed. This is a case where you might consider interpreting
    change relative to a larger increase in the X direction. For example, with each
    additional 10000 motorboats registered (NBOATS changes by 10), it is predicted
    that 1 additional manatee death would be observed. The intercept does not make
    any sense here. It corresponds to a'
