    +      c. Fit the model MANATEES = β02 + β1 [NBOATS_i - average(NBOATS)] + ε_i


    Prepare a table summarizing the estimated regression coefficients, standard errors,
    and p-values for these three models. Hint: Use ODS output to manipulate the coefficient
    information. For each model, generate the predicted number of manatee deaths if
    the number of motorboats registered is 725,000. Do the predictions vary between
