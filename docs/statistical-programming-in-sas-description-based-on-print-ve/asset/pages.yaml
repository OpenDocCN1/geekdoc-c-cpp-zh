- pgno: 372
  md: '# 10.3 Processing Macros


    “You talkin’ to me? You talkin’ to me? You talkin’ to me?” says Travis Bickle
    in the film Taxi Driver.


    The macro processor is the Travis Bickle of SAS. To understand why, look at how
    SAS processes a program in the following short overview. If you want a more detailed
    description, see Introduction to SAS Programs and Macro Processing at support.sas.com,
    or Burlew (2006).


    When program statements are submitted, they are sent to the input stack, which
    is an area of computer memory. The word scanner processes these program statements
    by converting them to tokens. Tokens are directed to an appropriate location for
    additional processing. Appropriate locations include the DATA step compiler, command
    processor, and macro processor. If a program contains any macro statements, then
    SAS sets up a symbol table for the macro variables. (Actually, SAS defines certain
    macro variables every time you use it. For example, the day that you run SAS is
    a value stored in a macro variable named SYSDAY). SAS needs to resolve any macro
    requests that are part of a series of commands before these commands are processed.
    So, how does the word scanner know how to direct tokens to an appropriate location?
    Any non-blank text that is preceded by a percentage sign (%) or ampersand (&)
    is a macro trigger. When the word scanner encounters a macro trigger, it sends
    the tokens with % or & to the macro processor. (So, “you are talkin’” to the macro
    processor if you are text that contains a macro trigger.) The macro processor
    interacts with the symbol table to store or extract the values of macro variables.
    Or, more generally, the macro processor interacts with the word scanner to resolve
    any macro statements. The macro processor substitutes the text demanded of it
    from the macro statements into the input stack. This continues until the input
    stack has been completely processed. All of this will become clearer when you
    look at how code with macro statements and variables is resolved.


    # 10.4 Macro Variables, Parameters, and Functions


    A macro variable can be referenced anywhere in a SAS program. (The only exception
    is in data lines that are being read into SAS.) A macro variable can be assigned
    text values. The value of a variable is stored in either a local or global symbol
    table. A macro variable name must be a valid SAS name. (#$#% @#$%#! won’t work,
    even though you might feel this way about a programming project.) A macro variable
    is preceded by an & when it is referenced in a SAS program. When a macro variable
    is resolved in a program, it might be closely associated with text. If it follows
    text, then it is referenced as text&macro-variable. If it precedes text, then
    it is referenced with a period delimiting the'
  merge: -1
  img_proc: true
- pgno: 373
  md: "value from the text (&macro-variable.text). SAS can define certain macro variables\
    \ (automatic macro variables), while a program can define other macro variables\
    \ (user-defined macro variables.)\n\nWhen you first start macro programming in\
    \ SAS, you will most likely use macro variables to define simple substitutions\
    \ in a program. In Display 10.5, the trapezoidal numerical integration routine\
    \ is modified to address the previous questions.\n\n+   1. How hard is it to modify\
    \ this code if you want k=50 points versus k=25 points?\n+   2. Can you generalize\
    \ this code to specify different limits of integration?\n\nThe macro statement\
    \ %let assigns values to npts (the macro variable for k), and to low and high\
    \ (the macro variables that correspond to the limits of integration). In the following\
    \ code, every occurrence of 25 in the program is replaced with &npts. Every occurrence\
    \ of 24 is replaced with &npts-1. Because you can specify any arbitrary number\
    \ of points to be evaluated in this numerical integration, the first question\
    \ is answered. Including macro variables &LOW and &HIGH generalizes the code to\
    \ specify different limits of integration. As a result, the second question is\
    \ answered. These macro variables are incorporated into titles in this modified\
    \ program. Additional bells and whistles are added, including using a put statement\
