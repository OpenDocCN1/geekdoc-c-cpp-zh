- pgno: 174
  md: 'Let’s look at the fit of a linear relationship between the number of motorboats
    registered and the number of manatee deaths. ODS packages the regression results
    into tables—Analysis of Variance, Parameter Estimates, and Output Statistics—and
    into various plots. The Analysis of Variance table in Display 5.2 shows the analysis
    partitioning the total pool of variation into that which is explained by the regression
    model and that which is unexplained. Additional output in this table includes
    an estimate of the variance σ² (mean squared error=18.29), strength of linear
    association as measured by the coefficient of determination (R-square=0.89), and
    a hypothesis test for the significance of the predictor variables (F value for
    the test statistic and Pr>F for the p-value). Other output is given in this table,
    including the mean Y value for these data (Dependent Mean=29.43).


