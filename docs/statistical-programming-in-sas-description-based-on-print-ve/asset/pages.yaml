    \  %IF condition %upcase(&ODS_ON)=TRUE is FALSE\nMLOGIC(TRAP_AREA_Z):  %DO loop\
    \ index variable NPTS is now 10; loop will iterate again.\n...\n```\n\nEach of\
    \ these options is useful. Tip: You might not want all options on simultaneously\
    \ when debugging a macro. Setting all three options to on results in a SAS log\
    \ that is difficult to read.\n\n# 10.7 Saving Macros\n\nThe previous examples\
    \ used macros shortly after they were defined. You are often going to want to\
    \ save macros for future use. Introduction to Storing and Reusing Macros at support.sas.com\
    \ provides a good foundation for learning more about saving macros. Three general\
    \ strategies for using a previously defined macro include the following:\n\n+\
    \   1. Insert the macro code from an external file.\n+   2. Use the autocall facility\
    \ in SAS.\n+   3. Use a stored and compiled macro.\n\nFor the first strategy,\
    \ the %INCLUDE command inserts the contents of an external file into the location\
    \ from which the %INCLUDE command is issued. For the second strategy, the autocall\
    \ facility collects a set of macros as external text (.sas) files in a specified\
    \ directory. A macro in the autocall facility is stored with a filename that matches\
    \ the actual macro name. The macros called using the autocall facility are compiled\
    \ and stored in WORK.SASMACR when they are first called in a SAS session. The\
    \ option MAUTOSOURCE must be set to use the autocall facility, and the SASAUTOS\
    \ option must point to where the autocall facility macro is stored. For the third\
    \ strategy, compiled macros are stored in a SAS catalog. The options MSTORED and\
    \ SASMSTORE are used. In addition, the STORE option must be set in the macro definition.\
    \ This strategy is preferred if you have macros that are production quality and\
    \ are not frequently updated."
