    Both Display 5.21 and 5.22 show that the mean log-bacterial growth for the CO₂
    packaging condition is significantly lower than vacuum, which is significantly
    lower than plastic or mixed. This fact is shown in Display 5.21 because the mean
    comparisons yielding confidence intervals for the pairwise differences do not
    contain zero. In Display 5.22, this fact is shown because the lines have different
    letters (A, B, and C) associated with the different groups.


    Following the MEANS statement are two statements, lsmeans condition / cl pdiff
    and lsmeans condition / cl pdiff adjust=Tukey. These statements request the means
    for the different groups, request confidence intervals for the mean response in
    each group (using a pooled variance estimate) and for the mean differences, and
    request a matrix of p-values for the pairwise tests of mean equality. The second
    LSMEANS statement applies a Tukey multiple comparison adjustment to the comparisons.
    The output from these two statements is shown in Display 5.23. Not surprising,
    the Tukey adjusted p-values are larger, and the simultaneous confidence intervals
    for the mean differences are wider when compared to their unadjusted counterparts.
    Other adjustments such as Bonferroni can be specified. When analyzing one treatment,
    MEANS and LSMEANS lead to identical results. However, differences surface in multi-factor
    studies if the treatments (combinations of factor levels) are unequally replicated.
    This is discussed in Section 5.4, “ANOVA Models—PROC GLM for an ANOVA Model with
    Two or More Factors.”'
