    \       /* Output objects      */\n         contents = 'country-TOC.html'    /*\
    \ Table of contents   */\n         frame = 'country-frame.html'     /* organizes\
    \ display   */\n         newfile = NONE;                  /* all results to one\
    \ file*/\n\ntitle \"country data analysis\";\n\nproc univariate data=country;\
    \  * calculate %tiles of density;\n   var density;\n   id name;\nrun;\n\nproc\
    \ tabulate data=country format=4.1;\n   class density_cat;\n   var lifemen lifewomn\
