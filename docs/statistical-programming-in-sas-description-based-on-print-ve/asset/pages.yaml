    \ -999 with . before doing further any further analyses. The following code does\
    \ this by looping over an array.\n\n# Display 9.2 Recoding missing values in numeric\
    \ variables\n\n```\ndata D4;\nARRAY ADL{*} t1 t2 t3 t4 t5 time6 time_7;\ninput\
    \ t1 t2 t3 t4 t5 time6 time 7;\nDO ielement = 1 to /;\n    if ADL{ielement}=-999\
    \ then ADL{ielement}=.;\nEND;\ndatalines;\n6 6 5 5 5 4 3\n7 -999 4 4 3 -999 2\n\
    ;\nrun;\nproc print data=D4;\ntitle \"Recoding missing values using arrays and\
    \ DO loop\";\nrun;\n```"
