- pgno: 19
  md: '# 1.1 Statistical Computing versus Programming versus Managing Data


    The computer is the analytic instrument and experimental tool for data analysts
    and statisticians. Analogous to chemists needing proficiency with mass spectrometers,
    and geneticists needing competence with gene and protein expression technologies,
    statisticians need skills using the computer as a tool for structuring data sets,
    conducting analyses, fitting models, and simulating stochastic systems. In the
    chapters that follow, I hope that you develop an appreciation for some of the
    questions that can be answered with statistical programming, and how these questions
    can be answered using SAS. The emphasis of this book is statistical programming.
    There is some consideration of managing data, and to a lesser degree, statistical
    computing. Statistical programming can be viewed as the coding required to conduct
    an analysis of interest, which might include using existing procedures or customizing
    an analysis not possible in existing procedures. In contrast, statistical computing
    might be considered the efficient coding of statistical procedures (e.g., numerical
    methods, random number generation, etc.). Data management might be conceptualized
    as the structure, storage, and manipulation of data files. This book is intended
    as an introduction that could lead you to more computational books, such as Givens
    and Hoeting (2005). These statistical programming ideas are introduced using SAS.
    There are a number of books that provide excellent introductions to SAS (e.g.,
    Cody and Pass 1995, Delwiche and Slaughter 2008). I hope this book complements
    those other books by emphasizing the use of SAS to address statistical programming
    problems.


    # 1.2 Good Programming Practice


    I believe that good programming practice can go beyond "I know it when I see it."
    In this section, some guidelines for good practice are suggested. These guidelines
    are influenced by recommendations that I received in many programming classes
    over the years, and by regrets that I experienced when I looked at my own inadequately
    documented code years after it was constructed. As a final disclaimer, I usually
    follow these guidelines. However, in cases when I generate a quick program for
    a simple, single-use application, I might not follow these guidelines as closely.
    So, let’s start.'
  merge: -1
  img_proc: true
