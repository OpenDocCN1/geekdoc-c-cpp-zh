  md: "# **Display 4.13** Constructing a Web page with a frame, table of contents,\
    \ and output from three SAS procedures.\n\n```\n/* using the COUNTRY data set\
    \ constructed in DISPLAY 4.6 */\n\n/* set up formats for the density categories\
    \ */\nproc format;\n   value dfmt  1=\"Least Dense 25%\"\n               2=\"\
    Middle 50%\"\n               3=\"Most Dense 25%\";\nrun;\n\n%let outdir = C:\\\
