    # 8.9 Case Study 3: Simple Percentile-Based Bootstrap


    The bootstrap (see, e.g., Efron and Tibshirani 1994) is one of the most important
    tools to be added to the data analyst’s toolkit in recent memory. The key idea
    in a bootstrap is that if the sample distribution is a reasonable approximation
    of the population distribution, then you can approximate the sampling distribution
    of a statistic by sampling from the sample distribution. For each resample, you
    calculate the test statistic of interest. The distribution of this test statistic
    over bootstrap resamples can be used to construct quantities including standard
    error estimates and CIs. The simplest form of CI construction is to use appropriate
    quantiles of the bootstrap distribution to serve as the CI. For example, a 90%
    percentile-based CI is constructed from the 5th and 95th percentiles of the bootstrap
    distribution. (Other more complicated constructions of the bootstrap CI might
    be preferred. For example, a BCa (bias-corrected and accelerated) bootstrap can
    be constructed. You are encouraged to learn more about this.)'
  merge: -1
  img_proc: true
- pgno: 326
  md: "The general flow of the program to construct a percentile-based bootstrap CI\
    \ is described in Display 8.47.\n\n# Display 8.47 Constructing percentile-based\
    \ bootstrap CI\n\n```\n/* input the data */\n/* construct the t-based CI for the\
    \ mean response */\n/* calculate the bootstrap-based CI for the mean response\
    \ */\n* generate bootstrap resamples of the data vector\n* calculate the mean\
    \ for each resample\n* select the 5th and 95th percentiles from the bootstrap\
    \ distribution of the mean\n```\n\nThe implementation of this program is shown\
    \ in Display 8.48.\n\n# Display 8.48 Constructing percentile-based bootstrap CI\
    \ for a population mean\n\n```\n/* input the data */\n/* From the FITNESS data\
    \ set found in SAS Help\nHelp > Getting Started with SAS Software > Learning to\
    \ Use SAS > Sample SAS Programs > SAS/STAT > Sample and select Example 2 for PROC\
    \ REG\n\nNote: Only AGE data considered.\n*/\ndata in_data;\n    input age @@;\n\
    \    datalines;\n44 40 44 42 38 47 40 43 44 38 44 45 45 47 54 49 51 51 48 49 57\
