- pgno: 220
  md: "# Display 6.5 DFBETAS plots for the intercept and slope\n\n![](img/26474180ee55914c13fb9156a7678157_220_0.png)\n\
    \nTwo separate graphs with DFBETAS are produced if the plots are unpacked:\n\n\
    ```\nods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\fig6p1.rtf\";\n\
    ods graphics on;\nproc reg data=cubic plots(only)=DFBETAS(unpack);\n  model response\
    \ = x;\nrun;\nods graphics off;\nods rtf close;\n```\n\nYou can specify the name\
    \ of an ODS graph in ODS SELECT and ODS EXCLUDE statements. (See Display 6.4.)\
    \ Use the PLOTS= option to determine which plots you want to create. Use the ODS\
    \ SELECT and ODS EXCLUDE statements to control which plots go to your ODS destination.\
    \ The ODS SELECT and ODS EXCLUDE statements can be used to select output tables\
    \ and graphics. In the following code, the table with the parameter estimates\
    \ (ParameterEstimates) and the graphic with the predicted line and confidence\
