    \ | <.0001 |\n\nNote: The previous code has the same results as the following\
    \ ODS EXCLUDE statement.\n\n```\nods exclude NObs ANOVA FitStatistics;\nods rtf\
    \ bodytitle file=\"reg-est.rtf\";\nproc reg;\n  model y = x;\nrun;\nods rtf close;\n\
    ```\n\n# 4.4.4 Another destination that stat programmers should visit—OUTPUT\n\
    \nThe OUTPUT destination enables you to construct SAS data sets based on output\
    \ objects from a SAS procedure. The following program generates a set of simulated\
