- pgno: 43
  md: 'reading SAS permanent data sets is covered by the first section of this chapter,
    I won’t spend any more time discussing these topics here.


    It is worth noting that most data entry programs allow you to save data in different
    formats such as a text file (*.txt file), or, arguably the lingua franca of the
    data entry world, the comma-separated values file (*.csv file). A later section
    is devoted to reading the .csv file. SAS has an Import Wizard that provides a
    graphical user interface (GUI) for importing data files in different formats including
    .csv files, tab- or other character-delimited files, etc. (Select Import Data
    from the File menu in Windows the next time you start SAS. You can import text
    files and other PC file formats such as Excel spreadsheets if you have licensed
    SAS/ACCESS Interface to PC File Formats.)


    Observations from a long-time programmer and curmudgeon follow—I avoid solutions
    with GUIs in this book. These solutions can be quick and useful, but it is not
    easy to re-create the menu navigation. Programs that manipulate and manage data
    can be easily saved and rerun, while a sequence of GUI selections might not be
    easy to reproduce. One nice option with the SAS Import Wizard is that you can
    save the programming code generated by the wizard. I would encourage all GUI-loving
    users to take advantage of this feature so that there is a permanent record of
    the commands required to get your externally stored data into a SAS data set.


    In the sections that follow, I use a data set downloaded from the StatLib server.
    The data set SMSA is part of the Data and Story Library (DASL) and includes properties
    of 60 Standard Metropolitan Statistical Areas (SMSAs). The documentation and data
    set can be downloaded from http://lib.stat.cmu.edu/DASL/Datafiles/SMSA.html.²
    Each of the 60 SMSAs has 17 variables recorded for it. These include the following:


    +   1. city name

    +   2. mean January temperature (degrees F)

    +   3. mean July temperature (degrees F)

    +   4. relative humidity

    +   5. annual rainfall (inches)

    +   6. age-adjusted mortality

    +   7. median education

    +   8. population density

    +   9. percentage of nonwhites

    +   10. percentage of white-collar workers

    +   11. population

    +   12. population per household

    +   13. median income

    +   14. hazardous chemical pollution potential

    +   15. nitrous oxide pollution potential

    +   16. sulfer dioxide pollution potential

    +   17. nitrous oxide'
