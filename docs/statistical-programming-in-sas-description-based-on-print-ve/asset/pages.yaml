    \ expandtabs\n        missover pad;\n    input @9 animal 2. @17 conc 3. @25 brood1\
    \ 2. @33 brood2 2.\n          @41 brood3 2. @49 total 2.;\n    jconc = conc +\
    \ 15*ranuni(0) - 7.5;  * adding a little jitter to see points;\nrun;\n\nproc print\
    \ data=nit rofen;\nrun;\n\nproc means data=nit rofen;  * obtain means that are\
