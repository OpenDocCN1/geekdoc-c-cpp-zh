    # 11.5 Case Study 1: Monte Carlo Integration to Estimate π


    In the SAS/IML code in Display 11.9, π is estimated by the proportion of randomly
    generated points that are below a circle in the first quadrant. In Section 8.8,
    “Case Study 2: Monte Carlo Integration to Estimate an Integral,” loops are used
    in a DATA step program to calculate a Monte Carlo estimate of the area corresponding
    to Pr(0<Z<1.645) for Z~N(0,1). In Display 11.9, 4000 (X,Y) coordinate pairs are
    generated and uniformly distributed in the first quadrant. There is one invocation
    of the randgen routine where the seed is set with randseed. These data are stored
    in the temp_mat matrix. A third column is added using the || column binding operator.
    This third column is 1 if the randomly generated Y is less than or equal to √1−x²,
    which is coded as the following:


    ```

    (temp_mat[,2]<= sqrt(J(nsim,1,1)-temp_mat[,1]##2))

    ```


    The area of a circle of radius 1 centered at (0,0) in the first quadrant is π/4.
    (The area of the circle is π, and ¼ of the circle centered at (0,0) falls in the
    first quadrant.) Thus, the proportion of randomly generated points in the first
    quadrant that are less than the equation of the circle is an estimate of π/4.
    The rest of this code generates the estimate of π, places a bound on the error
    of estimation, and generates a confidence interval (CI) for estimating π using
    a normal approximation to the binomial. The J function.'
  merge: -1
  img_proc: true
- pgno: 418
  md: 'J(nsim,2,0). initializes the matrix temp_mat to have nsim rows, and for two
    columns to have all zeros.


    # Display 11.9 Using SAS/IML to estimate π using Monte Carlo integration (pts.
    in first quadrant)


    ```

    proc iml;

    nsim = 4000;

    temp_mat = J(nsim,2,0);


    /* Generate (X,Y) with single call using ''randgen'' */

    call randseed(21509);   * set seed for randgen;

    call randgen(temp_mat,''uniform'');


    temp_mat = temp_mat || (temp_mat[,2]<= sqrt(J(nsim,1,1)- temp_mat[,1]#2));


    pi_over4 = temp_mat[+,3]/nsim;


    pi_est = 4*pi_over4;

    se_est = 4*sqrt(pi_over4*(1-pi_over4)/nsim);

    pi_LCL = pi_est - 2*se_est;

    pi_UCL = pi_est + 2*se_est;


    * ------------------------------------------------------------;

    print ''Estimating PI using MC simulation methods with '' nsim ''data points'';

    print ''PI-estimate = '' pi_est se_est pi_LCL pi_UCL;

    quit;

    ```


    Executing this program generates the following output:


    PI EST      SE EST      PI LCL      PI_UCL

    PI-estimate =      3.161 0.0257492 3.1095017 3.2124983


    # 11.6 Case Study 2: Bisection Root Finder


    There are many problems in which you need to find the root of an equation. For
    example, you need to find x such that f(x)=0 when x is in some interval (say,
    [a,b] where f(a)<0<f(b) or f(a)>0>f(b). The following example solves √3 by finding
    the root of f(x)=x-√3. (This example is used by my colleague, Bob Noble, to illustrate
    SAS/IML coding in his class. It is included in this section.) The lower limit
    lo and upper limit hi are specified to be 0 and 3, respectively. The bisection
    method finds the midpoint of the current interval, mid=(lo+hi)/2, and checks to
    determine whether mid-√3>0, or, equivalently, whether mid²>3. If it is, then the
    guess for the solution, mid, is too high. Thus, hi is set to mid, and the process
    begins again. If it is not, then lo is set to mid,'
  merge: -1
  img_proc: true
- pgno: 419
  md: "and the process begins again. (Admitted, this is a lot of work to find a value\
    \ that is one keystroke on a calculator. However, this gives you the flavor of\
    \ the example and demonstrates the flexibility of SAS/IML.) This code saves a\
    \ matrix with the history of (lo, hi) intervals checked. The code executes until\
    \ the interval is sufficiently narrow. A convergence criterion of hi-lo<10⁻⁷ is\
    \ set. The SAS/IML code in Display 11.10 generates a data set process containing\
    \ the (lo, hi) pairs (the iteration history), which is then printed and plotted.\n\
    \n# Display 11.10 Using the method of bisection to estimate √3\n\n```\noptions\
    \ ls=78 formdlim='-' nodate pageno=1;\n\n/* find sqrt(x = 3) using bisection\n\
    \   Author: Robert Noble\n   Modified: John Bailer\n*/\n\nproc iml;\n x = 3;\n\
    \ hi = x;\n lo = 0;\n history = 0||lo||hi;\n iteration = -1;\n delta = hi - lo;\n\
    \ do while(delta > 1e-7);\n   mid = (hi + lo)/2;\n   check = mid*mid > x;\n  \
    \ if check\n     then hi = mid;\n     else lo = mid;\n   delta = hi - lo;\n  \
    \ history = history//(iteration||lo||hi);\n   iteration = iteration + 1;\n end;\n\
    \ print mid;\n create process var {iteration low high};\n append from history;\n\
    \ quit;\n\nproc print data=process;\nrun;\n\nods listing image dpi=300;\nods graphics;\n\
    proc sgplot data=process;\n  series x=iteration y=low;\n  series x=iteration y=high;\n\
    run;\nods graphics off;\nods listing close;\n```"
  merge: -1
  img_proc: true
