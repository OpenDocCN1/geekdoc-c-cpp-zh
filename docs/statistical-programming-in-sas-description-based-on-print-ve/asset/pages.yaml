  img_proc: true
- pgno: 107
  md: "An example data set from the StatLib server is used in the next example (and\
    \ throughout the rest of the book). The data set describes the results of an experiment\
    \ examining the toxicity of nitrofen. Nitrofen is an herbicide used on rice, and\
    \ the data examines the impact of nitrofen on *Ceriodaphnia dubia*, which are\
    \ water fleas.\n\nThe URL for the data set on the StatLib server—http://lib.stat.cmu.edu/datasets/csb—contains\
    \ a file describing the variables in the data set (ch2.txt), a file with the data\
    \ (ch2.dat), and a file with a SAS program for reading the data. The variables\
    \ include an animal ID, nitrofen concentration, the number of young produced in\
    \ each of the three broods, and a total number of young produced in the three\
    \ broods. Toxicity is suggested if reproductive output decreases with increasing\
    \ herbicide concentration. A discussion and analysis of these data can be found\
    \ in Bailer and Oris (1994). OK, enough background. The data set from the StatLib\
    \ server was saved to my desktop and renamed ch2-dat.txt.\n\nIn the program in\
    \ Display 3.9, a format is defined to map the values of a numeric variable to\
    \ **NONE** if the variable has VALUE=0, and to **SOME** if the variable has a\
    \ value of 1 or larger. The range of the variable, 1—HIGH, uses a keyword HIGH,\
    \ indicating the maximum value in a data set. This user-defined format TOTFMT\
    \ is then applied to a newly defined variable CBROOD3 in the DATA step. The data\
    \ for the conc=235 condition are displayed.\n\n# Display 3.9  User-defined format\
    \ using PROC FORMAT\n\n```\n```sas\nproc format;\n    value totfmt       0='none'\n\
    \                   1—HIGH='some';\nrun;\n\ndata nitro tox;\n    infile 'C:\\\
    Users\\bailera\\JT\\desktop\\DT-Book 3\\ch2-dat.txt'\n        firstobs=16 expandtabs\
    \ missover pad;\n    input @9 animal 2. @17 conc 3. @25 brood1 2.\n          @33\
    \ brood2 2. @41 brood3 2. @49 total 2.;\n\n    cbrood3 = brood3;\n    format cbrood3\
    \ totfmt.;\n    label animal = 'animal ID number';\n    label conc   = 'Nitrofen\
    \ concentration';\n    label brood1 = 'number of young in first brood';\n    label\
    \ brood2 = 'number of young in 2nd brood';\n    label brood3 = 'number of young\
    \ in 3rd brood';\n    label total  = 'total young produced in three broods';\n\
    run;\n\nproc print data=nitro; tox;\n    where conc=235;\nrun;\n```\n```\n\n>\
    \ Nitrofen data set from Bailer, A. John., and James T. Oris. 1994. “Assessing\
    \ Toxicity of Pollutants in Aquatic Systems.” Chapter 2 in *Case Studies in Biometry*.\
    \ Nicholas Lange, Louise Ryan, Lynne Billard, David Brillinger, Loveday Conquest,\
    \ Joel Greenhouse, eds. New Jersey: John Wiley & Sons, Inc. Reprinted with permission\
    \ of John Wiley & Sons, Inc."
  merge: -1
  img_proc: true
- pgno: 108
  md: "You can confirm the format of the new variable in Display 3.10.\n\n# Display\
    \ 3.10 Output produced by user-defined format\n\n| Obs | animal | conc | brood1\
    \ | brood2 | brood3 | total | cbrood3 |\n|---|---|---|---|---|---|---|---|\n|\
    \ 31 | 31 | 235 | 4 | 13 | 6 | 23 | some |\n| 32 | 32 | 235 | 6 | 10 | 5 | 21\
    \ | some |\n| 33 | 33 | 235 | 2 | 5 | 0 | 7 | none |\n| 34 | 34 | 235 | 6 | 0\
    \ | 6 | 12 | some |\n| 35 | 35 | 235 | 6 | 13 | 8 | 27 | some |\n| 36 | 36 | 235\
    \ | 6 | 0 | 10 | 16 | some |\n| 37 | 37 | 235 | 7 | 0 | 6 | 13 | some |\n| 38\
    \ | 38 | 235 | 4 | 2 | 9 | 15 | some |\n| 39 | 39 | 235 | 6 | 8 | 7 | 21 | some\
    \ |\n| 40 | 40 | 235 | 7 | 0 | 10 | 17 | some |\n\n# 3.4 Selecting or Stratifying\
    \ an Analysis by Values of a Variable\n\nThe BY statement is used to specify an\
    \ analysis of a data set stratified by levels of a variable. It is often used\
    \ with the SORT procedure. For example, the following code sorts the nitrofen\
    \ data set (nitro_tox) and produces an output data set (nitro_tox2) with the observations\
    \ sorted:\n\n```\nproc sort data=nitro_tox out=nitro_tox2;\n    by conc;\nrun;\n\
    proc print data=nitro_tox2;\n    by conc;\nrun;\n```\n\nYou can sort by more than\
    \ one variable. For example, suppose you want to sort by total within conc. The\
    \ following code performs the sort and prints the result in Display 3.11:\n\n\
    ```\nproc sort data=nitro_tox;\n    by conc total;\nrun;\nproc print data=nitro_tox;\n\
    \    id animal;\n    var conc total;\nrun;\n```"
  merge: -1
  img_proc: true
