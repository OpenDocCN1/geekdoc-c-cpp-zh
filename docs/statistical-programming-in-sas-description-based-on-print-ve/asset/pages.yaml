- pgno: 295
  md: "Another common transformation involves constructing indicator variables based\
    \ on the values of a variable. One of the easiest ways to define these indicator\
    \ variables is to conduct a Boolean comparison whose results are coerced into\
    \ numeric values. Here, if the statement is true, then the value 1 is assigned.\
    \ If the statement is false, then the value 0 is assigned. In Chapter 5, an indicator\
    \ variable was constructed to allow dinosaurs to have a body weight and brain\
    \ weight relationship that differed from other animals in the data set. The following\
    \ statements were used to construct the indicator variable:\n\n```\nidino = 0;\
    \                * define the indicator of dinosaurs;\nif (species=\"diplodoc\"\
    \ or species=\"tricerat\" or\n    species=\"brachios\") then\nidino=1;\n```\n\n\
    The indicator idino is initialized to 0 for all observations, and reassigned to\
    \ 1 if the condition (species=\"diplodoc\" or species=\"tricerat\" or species=\"\
    brachios\") is true. Here is an alternative statement that avoids the initialization\
    \ and condition checking:\n\n```\nidino = (species=\"diplodoc\" or species=\"\
    tricerat\" or\n    species=\"brachios\");\n```\n\nThis statement assigns idino\
    \ to 0 when the condition is false, and idino to 1 when the condition is true.\
    \ It is important to recognize that case matters in these comparisons. If Diplodoc\
    \ is the value of species, then idino is 0 because Diplodoc differs from diplodoc.\n\
    \nFor the next indicator variable example, the packaging and log-bacterial growth\
    \ data⁴ is used. Suppose you want to use linear regression with indicator variables\
    \ as an alternative to a one-way ANOVA model. In the data, there are four different\
    \ packaging conditions. An indicator variable is defined for each condition in\
    \ the code in Display 8.20. The CLASS statement in PROC GLM automatically produces\
    \ indicator variables for an ANOVA model."
  merge: -1
  img_proc: true
- pgno: 296
  md: "# Display 8.20 Defining indicator variables for different conditions to fit\
    \ an ANOVA model\n\n```\noptions nodate formdlim=\"-\";\ndata meat;\n    input\
    \ condition $ logcount @@;\n    iPlastic = (condition =\"Plastic\");\n    iVacuum\
    \ = (condition=\"Vacuum\");\n    iMixed  = (condition=\"Mixed\");\n    iCO2  \
    \  = (condition=\"Co2\");\n    datalines;\nPlastic    7.66  Plastic    6.98  Plastic\
    \    7.80\nVacuum     5.26  Vacuum     5.44  Vacuum     5.80\nMixed      7.41\
    \  Mixed      7.33  Mixed      7.04\nCo2        3.51  Co2        2.91  Co2   \
    \     3.66\n;\nrun;\n\ntitle \"bacteria growth under 4 packaging conditions\"\
    ;\n\nODS RTF bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\Display-8-20.rtf\"\
    ;\n\nproc print data=meat;\ntitle \"Print to check indicator variable construction\"\
    ;\nrun;\n\nproc reg data=meat;\ntitle \"Regression with indicator variables: alt.\
    \ to one-way anova model\";\n    model logcount = iPlastic iVacuum iMixed;\nrun;\n\
    \nproc glm data=meat;\ntitle \"One-way ANOVA model\";\n    class condition;\n\
    \    model logcount = condition;\nrun;\n\nods rtf close;\n```\n\nDisplay 8.21\
    \ contains the output from the PROC PRINT in Display 8.20. This output enables\
    \ you to check whether the recoding worked as expected. (The output from the other\
    \ procedures is omitted).\n\n# Display 8.21 Output from PROC PRINT\n\n| condition\
