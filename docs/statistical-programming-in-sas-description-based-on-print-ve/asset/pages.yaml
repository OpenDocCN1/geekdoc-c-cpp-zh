- pgno: 137
  md: "# 4.1 Introducing PROC TABULATE\n\nMore powerful than PROC FREQ for summaries...incredibly\
    \ more convoluted than PROC MEANS...able to present the most complicated table\
    \ structures...it’s PROC TABULATE. Tables specified with PROC TABULATE have dimensions\
    \ corresponding to pages, rows, and columns. In a page, row, or column, classification\
    \ variables can be crossed or nested. And, numeric analysis variables can be summarized\
    \ with a variety of descriptive statistics. Remember the nitrofen data from the\
    \ previous chapter? (Nitrofen, a rice herbicide, exhibited reproductive toxicity\
    \ in an experiment where Ceriodaphnia dubia were exposed to nitrofen.¹ The number\
    \ of young produced in three broods was recorded.) In the following code, PROC\
    \ TABULATE is used to produce a descriptive summary of the nitrofen data.\n\n\
    # Display 4.1 PROC TABULATE and nitrofen data\n\n```\n%let DATA_DIR=C:\\Users\\\
    baileraj\\BAILERAJ\\Classes\\Web-Classes\\STA402\\FALL-2007\\data;\n\ndata nitrofen;\n\
    \  infile \"&DATA_DIR\\ch2-dat.txt\" firstobs=16 expandtabs missover pad;\n  input\
    \ @9 animal 2.    @17 conc 3.    @25 brood1 2.\n        @33 brood2 2.  @41 brood3\
    \ 2.  @49 total 2.;\nrun;\n\nods rtf BODYTITLE file=\"&DATA_DIR\\Display-4.1.rtf\"\
    ;\nproc tabulate data=nitrofen format=3.;  * include default format for;\n  class\
    \ conc;                         *   numeric summaries;\n  var brood1 brood2 brood3\
    \ total;\n  table (brood1 brood2 brood3 total)*conc,\n        n min q1 median*f=4.1\
    \ q3 max;\nrun;\nods rtf close;\n```\n\nThe table in Display 4.2 presents a five-number\
    \ summary for each brood and the total number of young for each concentration\
    \ condition.\n\n¹ Nitrofen data set from Bailer, A. John., and James T. Oris.\
    \ 1994. \"Assessing Toxicity of Pollutants in Aquatic Systems.\" Chapter 2 in\
    \ Case Studies in Biometry: Nicholas Lange, Louise Ryan, Lynne Billard, David\
    \ Brillinger, Loveday Conquest, Joel Greenhouse, eds. New Jersey: John Wiley &\
    \ Sons, Inc. Reprinted with permission of John Wiley & Sons, Inc."
  merge: -1
  img_proc: true
