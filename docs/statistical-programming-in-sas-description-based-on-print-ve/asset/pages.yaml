- pgno: 313
  md: "# Display 8.36 ODS output version of the t-test simulation program\n\n```\n\
    /* Problem: Explore whether t-test really is robust to\n    violations of the\
    \ equal variance assumption\n\n    Strategy: See if the t-test operates at the\
    \ nominal\n              Type I error rate when the unequal variance\n       \
    \       assumption is violated\n*/\n\n/* specify the conditions to be generated\
    \ */\n\ndata simulate_2group_t;\nNsims = 4000;      * number of simulated experiments;\n\
    Myseed = 65432;    * specify seed for random number sequence;\ncall streaminit(Myseed);\n\
    \nN1 = 10;      * sample sizes from populations 1 and 2;\nN2 = 10;\n\nMu_1 = 0;\
    \     * mean/sd of population 1;\nSig_1 = 1;\n\nMu_2 = 0;     * mean/sd of population\
    \ 2;\nSig_2 = 1;\n\ndo iexpt = 1 to Nsims;\n\n/* generate data sets reflecting\
    \ these conditions */\n* generate N1 observations ~ N(mu_1, sig_1^2);\ndo ix =\
    \ 1 to N1;\n    group = 1;\n    Y = RAND('normal',mu_1,sig_1);\n    output;\n\
    end;\n\n* generate N2 observations ~ N(mu_2, sig_2^2);\ndo ix = 1 to N2;\n   \
    \ group = 2;\n    Y = RAND('normal',mu_2,sig_2);\n    output;\nend;\nend;  * of\
    \ the do-loop over simulated experiments;\nrun;\n/* calculate the test statistic\
    \ */\n/* Note: ODS TRACE was used to determine the output\n         object containing\
    \ the test statistics. This\n         included the pooled-variance t-test and\
    \ the\n         Satterthwaite df approximation for the t-test\n         allowing\
    \ for unequal variances */\nods output TTests=Out TTests;\n```"
  merge: -1
  img_proc: true
- pgno: 314
  md: "# Display 8.36 (continued)\n\n```\nproc ttest data= simulate 2group t;\n  by\
    \ iexpt;\n  class group;\n  var Y;\nrun;\nods output close;\n\n/* accumulate results\
    \ over numerous simulated data sets */\n\ndata out_ttests; set out_ttests;\nretain\
    \ Pooled_p;  * RETAIN explained in Section 8.3;\nif method=\"Pooled\" then Pooled_p\
    \ = Probt;\nelse do;\n  Satter_p = Probt;\n  Pooled_reject = (Pooled_p <= 0.05);\
    \ * Boolean trick again;\n  Satter_reject = (Satter_p <= 0.05);\n  keep iexpt\
    \ Pooled_p Satter_p Pooled_reject Satter_reject;\n  output;\nend;\nrun;\n\nods\
    \ rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\Display-8-37.rtf\";\n\
    proc freq;\n  table Pooled_reject Satter_reject;\nrun;\nods rtf close;\n```\n\n\
    The pooled variance t-test and the Satterthwaite adjustment reject 4.98% and 4.83%\
    \ of the time, respectively, when the null hypothesis is true and the data are\
    \ from normal populations with homogeneous variances. These rejection rates are\
    \ based on 4000 simulated experiments. The bound on the Monte Carlo error of estimation\
    \ is approximately the following:\n\n$B = 2\\sqrt{\\frac{(0.05)(0.95)}{4000}}\
    \ = 0.007$\n\nThis suggests that a procedure operating at α=0.05 would have an\
    \ observed Type I error rate between 0.043 and 0.057 in the case where 4000 simulated\
    \ experiments are considered.\n\nIf you repeat this program, but change SIG 2=2\
    \ and hold all other variables constant (i.e., the second population has a variance\
    \ that is four times greater than the first population), you observe 5.33% and\
    \ 4.83% Type I error rates in the pooled variance t-test and separate variance\
    \ t-test, respectively. Try this at home."
