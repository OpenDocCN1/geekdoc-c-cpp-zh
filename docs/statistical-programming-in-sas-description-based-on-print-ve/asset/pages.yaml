- pgno: 253
  md: "# 7.1 Traditional SAS Graphics\n\nThere are many traditional graphics procedures\
    \ in SAS. These include procedures for producing scatter plots (GPLOT), three-dimensional\
    \ plots (G3D), contour plots (GCONTOUR), charts (GCHART), and maps (GMAP). These\
    \ procedures share features such as using the GOPTIONS statement for control and\
    \ using annotate data sets for enhancements. In this chapter, the focus is on\
    \ a few applications that highlight the benefits of traditional SAS graphics.\n\
    \n# 7.2 Customizing Graphics\n\nWhen you invoke a graphics procedure, defaults\
    \ for symbols, line types, axis tick marks, and labels are set. To see all of\
    \ the defaults that are used, a scatter plot of the long-term relative frequency\
    \ concept of probability is provided. In Display 7.1, 1200 virtual tosses of a\
    \ fair digital coin are generated. A toss results in an OUTCOME=0 (tails) or OUTCOME=1\
    \ (heads). The number of heads (NUM HEADS) is accumulated and divided by the number\
    \ of tosses (ITOSS) to define the relative frequency of heads (PROBABILITY HEADS).\
    \ The relative frequency of heads is plotted versus the accumulated number of\
    \ heads. For more information about the use of the RAND function with seeds set\
    \ by STREAMINIT, see Section 8.11 or SAS Help.\n\n# Display 7.1 Toss a digital\
    \ coin–relative frequency of heads\n\n```\ndata cointoss;\nretain num_heads 0;\n\
    call streaminit(1234567);\ndo itoss = 1 to 1200;\n  outcome = RAND('Bernoulli',\
    \ 0.50);\n  num_heads = num_heads + (outcome=1);\n  probability_heads = num_heads\
    \ / itoss;\n  output;\nend;\ngoptions reset=global;\nods rtf bodytitle file=\"\
    C:\\Users\\baileraj.IT\\Desktop\\fig7p1.rtf\";\nproc gplot;\n  plot probability_heads*itoss;\n\
    run;\nods rtf close;\n```\n\nThe scatter plot is shown in Display 7.2."
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Display 7.2 Scatter plot of relative frequency of heads


    ![](img/26474180ee55914c13fb9156a7678157_254_0.png)


    The scatter plot illustrates that the long-term relative frequency of heads when
    tossing a fair digital coin is 0.5. This scatter plot can be enhanced with a few
    simple changes. The defaults in this graph include using variable names as the
    axis labels, using the plus sign as a plotting character, placing tick marks on
    the x-axis every 100 tosses, and placing tick marks on the y-axis every 0.10.
    The extremes of the y-axis are defined as 0.3 and 1.0. Simple changes that could
    enhance the scatter plot include:


    +   1. Provide more informative axis labels.

    +   2. Rotate the y-axis label so that you have more space for the plotting region.

    +   3. Restrict the range of values plotted on the y-axis and x-axis.

    +   4. Remove the minor axis tick marks.

    +   5. Connect the relative frequencies associated with the different number of
    tosses.


    This section addresses items 1 through 4 using the AXIS statement, and item 5
    using the SYMBOL statement.'
  merge: -1
  img_proc: true
- pgno: 255
  md: "Many of these simple changes can be implemented with ODS Graphics and PROC\
    \ SGPLOT. For example, items 1 and 2 can be addressed in the XAXIS and YAXIS statements\
    \ in PROC SGPLOT using the LABEL option. You can create irregular intervals in\
    \ PROC SGPLOT and PROC SGPANEL. In PROC GPLOT, to create irregular intervals,\
    \ you need an annotate data set. (For more information, see page 13 in “Secrets\
    \ of the SG Procedures,” at http://support.sas.com/resources/papers/proceedings09/324-2009.pdf.\
    \ The MIN, MAX, VALUES, and VALUESHINT options in the PROC SGPLOT AXIS and SERIES\
    \ statements might also be useful.)\n\nThe AXIS statement enables you to specify\
    \ tick mark values and labels. It enables you to rotate the axis label and much\
    \ more. The following statement defines a restricted range for the relative frequencies\
    \ (MIN=0.35, MAX=0.65), defines the spacing of the values (by 0.05), defines a\
    \ more expansive label for the axis, and rotates that axis by 90 degrees.\n\n\
    ```\naxis1 order=0.35 to 0.65 by 0.05\n    label=(angle=90 \"Estimated Pr(HEADS)\"\
    );\n```\n\nThe SYMBOL statement and AXIS statements are placed before the invocation\
    \ of PROC GPLOT. The PLOT statement associated with PROC GPLOT identifies which\
    \ axis in the plot (vertical axis=VAXIS or horizontal axis=HAXIS) is associated\
    \ with each AXIS statement. The SYMBOL statement requests an interpolation between\
    \ points—here, adjacent relative frequencies are connected with the JOIN option.\
    \ Other interpolation options include options that are useful for displaying stock\
    \ market data (HILOC for high-low-close data), for smoothing data (L1P, L3P, L5P,\
    \ SM, and SPLINE), for displaying polynomial regression fits (RL, RQ, and RC with\
    \ confidence intervals for mean responses CLM; or with prediction intervals for\
    \ new responses CLI), for plotting means ±1, 2, or 3 standard deviations (STD),\
    \ or for displaying step function patterns (STEP).\n\nThe revisions to the previous\
    \ scatter plot with axis, symbol, and label changes are provided in the code in\
    \ Display 7.3. This code produces the new scatter plot in Display 7.4. This scatter\
    \ plot is much better than its first incarnation. This is a common experience\
    \ in producing statistical graphics. You will rarely, if ever, be satisfied with\
    \ the first graphic that you produce. The norm is to iterate and tune a graphic\
    \ until you are happy with the results."
  merge: -1
  img_proc: true
- pgno: 256
  md: "# Display 7.3 Toss a digital coin–relative frequency of heads (for a better\
    \ scatter plot)\n\n```\ndata cointoss;\n    retain num_heads 0;\n    call streaminit(1234567);\n\
    \    do itoss = 1 to 1200;\n        outcome = RAND('Bernoulli', 0.50);\n     \
    \   num_heads = num_heads + (outcome=1);\n        probability_heads = num_heads\
    \ / itoss;\n        output;\n    end;\nrun;\n\ngoptions reset=global;\nsymbol\
    \ interpol=join;\naxis1 order=0.35 to 0.65 by 0.05\n    minor=NONE\n    label=(angle=90\
    \ \"Estimated Pr(HEADS)\");\naxis2 order=0 to 500 by 50\n    minor=NONE\n    label=(\"\
    Number of simulated data points\");\n\nods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\\
    Desktop\\cointoss-figs.rtf\";\nproc gplot data=cointoss;\n    plot probability_heads*itoss\
    \ / vaxis=axis1 haxis=axis2;\nrun;\nquit;\n\n/* SGPLOT alternatives suggested\
    \ by Dan Heath  */\n\nproc sgplot data=cointoss;\n    xaxis label=\"Number of\
    \ simulated data points\"\n        values=(0 to 500 by 50);\n    yaxis label=\"\
    Estimated Pr(HEADS)\"\n        values=(0.35 to 0.65 by 0.05);\n    series x=itoss\
    \ y=probability_heads;\nrun;\n\nproc sgplot data=cointoss;\n    xaxis label=\"\
    Number of simulated data points\"\n        values=(0 to 500 by 50);\n    yaxis\
    \ label=\"Estimated Pr(HEADS)\"\n        values=(0.35 to 0.65 by 0.05);\n    series\
    \ x=itoss y=probability_heads /\n        lineattrs=(color=black thickness=2);\n\
    run;\nods rtf close;\n```"
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/26474180ee55914c13fb9156a7678157_257_0.png)


    Additional modifications would make this scatter plot even more publication ready.
    Because publications often reduce figure sizes, you might want to make the plotted
    line wider so that it can be reduced successfully. The color (black), type of
    line (line=1 requests a solid line), and width of line (width=2 requests a thicker
    line than the default thickness) can be modified by the SYMBOL statement. The
    following SYMBOL statement was used in the previous code to produce Display 7.5:


    ```

    symbol interpol=join color=black line=1 width=2;

    ```'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Display 7.5 Even better and more publication-ready scatter plot of relative
    frequency of heads


    ![](img/26474180ee55914c13fb9156a7678157_258_0.png)


    The SYMBOL statement can explicitly specify what plotting character should be
    used in a scatter plot. For example, if you want a dot as the plotting character,
    specify:


    ```

    symbol1 value=dot cv=black;

    ```


    An analogous specification of the marker is in the MARKERCHAR option in PROC SGPLOT
    or PROC SGPANEL. The MARKERCHAR option references a column, and the value of that
    column (string or numeric) is used as a marker. You might have noticed the frequent
    use of GOPTIONS in the previous code.


    ```

    goptions reset=global;

    ```


    Resetting graphics options is a good idea. Once graphics options are set, they
    stay set until you reset them. As a result, the options set for one plot can unintentionally
    affect later plots. You might be surprised to know that SAS can cycle through
    particular options before recognizing other options. If you have graphics code
    that is not varying a particular SYMBOL option that you have set (e.g., plotting
    character), but another option is varying (e.g., color), you might try defining
    the features to be the same in each SYMBOL statement (e.g., set CV=BLACK in each
    SYMBOL statement).'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 7.3 Why You Need to Learn about Annotate Data Sets


    > ...they took twenty seven eight-by-ten color glossy photographs with circles
    and arrows and a paragraph on the back of each one explaining what each one was
    to be used as evidence against us.


    You might be interested in adding circles, arrows, and text to explain a figure.
    This is where annotate data sets enter the picture. At this point, you have constructed
    a figure with modifications to the SYMBOL and AXIS statements. Now, you want to
    add text, segments, and arrows to your figure. The method is to define a data
    set (the annotate data set) containing instructions for augmenting the figure.
    Then, you request the annotation of a traditional SAS graphic by pointing to this
    data set.


    Annotate data sets can be used to enhance graphs produced by procedures that use
    traditional SAS graphics. These include procedures that are not in SAS/GRAPH software.
    Annotate data sets consist of observations that each request an action on an existing
    graph. SAS/GRAPH documentation (2009) describes these as commands to “draw a graphic
    element or to perform an action.” In particular, you define a FUNCTION variable
    that has specific values that are associated with an action to the figure. The
    annotate data set has variables associated with positioning in the figure—X and
    Y. These variables can possibly be in reference to a system definition—XSYS and
    YSYS. Annotate data sets are essentially a series of graphics primitives that
    can be easily applied to an existing graph.


    Let’s start with a simple annotation of the coin toss figure in Display 7.4. (The
    code is in Display 7.3.) Suppose you want to add a horizontal reference line at
    PROBABILITY=0.5, and text noting that the long-term relative frequency of heads
    should be 0.5. It helps to break these actions into steps. A horizontal reference
    line at 0.5 is equivalent to drawing a line from (0, 0.50) to (500, 0.50) on this
    plot. Or it is equivalent to moving the cursor to the point (0, 0.50), and then
    drawing a segment to (500, 0.50). Adding text requires positioning text (say,
    just below the horizontal reference line at (350, 0.48)), and then defining the
    text to be added. The ANNOTATE functions MOVE, DRAW, and LABEL accomplish this
    in Display 7.6.'
  merge: -1
  img_proc: true
- pgno: 260
  md: "# Display 7.6 Annotating the figure illustrating the relative frequency of\
    \ heads\n\n```\ndata cointoss;\n    retain num_heads 0;\n    call streaminit(1234567);\n\
    \    do itoss = 1 to 1200;\n        outcome = RAND('Bernoulli', 0.50);\n     \
    \   num_heads = num_heads + (outcome=1);\n        probability_heads = num_heads\
    \ / itoss;\n        output;\n    end;\nrun;\n\ngoptions reset=global;\nsymbol\
    \ interpol=join;\naxis1 order=0.35 to 0.65 by 0.05\n    minor=NONE\n    label=(angle=90\
    \ \"Estimated Pr(HEADS)\");\naxis2 order=0 to 500 by 50\n    minor=NONE\n    label=(\"\
    Number of simulated data points\");\n\ndata myanno;\nlength function $ 8 text\
    \ $ 45;\nretain xsys \"2\" ysys \"2\";\nfunction=\"move\";  x=0;    y=0.50; output;\n\
    function=\"draw\";  x=500;  y=0.50; output;\nfunction=\"label\"; x=350; y=0.48;\n\
    \    text=\"Long-term relative frequency of HEADS=0.50\"; output;\nrun;\n\nods\
    \ rtf bodytitle\n    file=\"C:\\Users\\baileraj\\Desktop\\cointoss2-graph.rtf\"\
    ;\nproc print data=myanno;\nrun;\n\nproc gplot data=cointoss;\n    plot probability_heads*itoss\
    \ / annotate=myanno\n                                    vaxis=axis1 haxis=axis2;\n\
    run;\nquit;\nods rtf close;\n```"
  merge: -1
  img_proc: true
- pgno: 261
  md: "The data set myanno contains the commands for displaying the annotation. The\
    \ length declaration of 8 ensures that the function label will not be truncated\
    \ to four characters because the first value of function is the four-character\
    \ value move, while the declaration of the text length allows for a longer text\
    \ string to be displayed. (A length of 8 accommodates any of the possible function\
    \ arguments.) The retain statement does double-duty. It keeps the values of xsys\
    \ and ysys in place for all of the observations that are defined in subsequent\
    \ lines. And, it assigns the value 2 to these variables. The xsys and ysys variables\
    \ define the coordinate axis definition that is used by coordinate (x,y) pairs\
    \ in the annotate data set. A value of 2 is an absolute scale that corresponds\
    \ to the data value scale. The XSYS and YSYS values 1 through 6 correspond to\
    \ an absolute scale, while {7, 8, 9, A, B, C} correspond to a relative scale.\
    \ You might find 2 to be the most useful value for the annotation of statistical\
    \ figures or for the annotation of scales related to the percentage of the data\
    \ area (1, 7) or to the percentage of the graphics output area (3, 9). The first\
    \ observation moves the cursor to the (0, 0.50) position:\n\n```\nfunction=\"\
    move\"; x=0; y=0.50; output;\n```\n\nThe second observation draws from the current\
    \ location (0, 0.50) to the target location (500, 0.50):\n\n```\nfunction=\"draw\"\
    ; x=500; y=0.50; output;\n```\n\nThe third observation adds text centered at (350,\
    \ 0.48):\n\n```\nfunction=\"label\"; x=350; y=0.48;\n    text=\"Long-term relative\
    \ frequency of HEADS=0.50\"; output;\n```\n\nThe contents of the annotate data\
    \ set myanno are in Display 7.7.\n\n# Display 7.7 Contents of the annotate data\
    \ set\n\n| Obs | function | Text | xsys | ysys | x | y |\n|---|---|---|---|---|---|---|\n\
    | 1 | move |  | 2 | 2 | 0 | 0.50 |\n| 2 | draw |  | 2 | 2 | 500 | 0.50 |\n| 3\
    \ | label | Long-term relative frequency of HEADS=0.50 | 2 | 2 | 350 | 0.48 |\n\
    \nThe annotate data set is rendered as part of PROC GPLOT by an option to the\
    \ PLOT statement:\n\n```\nplot probability_heads*toss / annotate=myanno\n```"
  merge: -1
  img_proc: true
- pgno: 262
  md: 'The figure generated and the annotation are shown in Display 7.8.


    # Display 7.8 Scatter plot of relative frequency of heads with annotation


    ![](img/26474180ee55914c13fb9156a7678157_262_0.png)


    There are many graphics tasks accomplished by other functions (e.g., POLY, POINT,
    BAR, SYMBOL, DRAW2TXT, PIE, and FRAME).


    Let’s consider an example that is more complicated. The odds ratio (OR) is a common
    summary reported in logistic regression and for epidemiological investigations.
    It is not uncommon to see an approximate confidence interval (CI) produced by
    exponentiating a symmetric CI that is constructed for the log[OR]. Suppose an
    estimate OR=2 is observed with an estimated SE{log[OR]}=0.2. The approximate 95%
    CI for OR would be exp[log(2) ± 1.96*0.2]. Wouldn’t it be neat to construct a
    figure showing this? This figure would do the following:


    +   - Illustrate the (OR, log[OR]) relationship.

    +   - Map OR=2 to its corresponding log[OR] value.

    +   - Move ± 1.96 SE{log[OR]} from this value.

    +   - Move back to the OR-log[OR] trace.

    +   - Project back to the OR axis for the CI.'
  merge: -1
  img_proc: true
- pgno: 263
  md: "Display 7.9 provides the code to construct this figure. The figure is shown\
    \ in Display 7.10.\n\n# **Display 7.9** Constructing a CI for an OR based on exponentiating\
    \ a symmetric CI\n\n```\n/* generate a profile of [OR, log(OR)] values */\ndata\
    \ or stuff;\n   do or=0.01 to 5 by .01;\n      logor = log(or);\n      output;\n\
    \   end;\nrun;\n\ngoptions reset=global; * often a good idea, especially if doing\
    \ a lot of graphs;\n\n/* interpolate btwn [OR, log(OR)] values and set up axes\
    \ */\nsymbol interpol=join co=black; * always specify color in symbol stmt;\n\
    axis1 label=(\"Odds Ratio\");\naxis2 label=(angle=90 \"Log(Odds Ratio)\");\n\n\
    /* set up annotate data set with arrows and text to illustrate the CI idea */\n\
    data myanno;\nlength function $ 8 text $ 7; * good habit b/c max fcn length=8;\n\
    retain xsys \"2\" ysys \"2\" function SE;\nSE = .2;\nfunction=\"move\"; x=2; y=-5;\
    \ output;\nfunction=\"arrow\"; x=2; y=log(2); output; * from OR to logOR;\nfunction=\"\
    arrow\"; x=.01; y=log(2); output; * back to y-axis;\n\nfunction=\"draw\"; x=.01;\
    \ y=log(2) + 1.96*SE; line=2; output; * upper CI;\nfunction=\"arrow\"; x=exp(log(2)\
    \ + 1.96*SE); y=log(2) + 1.96*SE; output;\nfunction=\"arrow\"; x=exp(log(2) +\
    \ 1.96*SE); y=-4.5; output;\n\nfunction=\"move\"; x=.01; y=log(2); output; * lower\
    \ CI;\nfunction=\"draw\"; x=.01; y=log(2) - 1.96*SE; output;\nfunction=\"arrow\"\
    ; x=exp(log(2) - 1.96*SE); y=log(2) - 1.96*SE; output;\nfunction=\"arrow\"; x=exp(log(2)\
    \ - 1.96*SE); y=-4.5; output;\nfunction=\"label\";\n        x=exp(log(2) - 1.96*SE);\
    \ y=-4.75; text=\"LCL OR\"; output;\n        x=exp(log(2) + 1.96*SE); y=-4.5;\
    \ text=\"UCL OR\"; output;\n        x=2.2; y=-2; text=\"Step 1\"; output;\n  \
    \      x=1; y=log(2) + .25; text=\"Step 2\"; output;\n        x=0.5; y=log(2)\
    \ - 1.96*SE; text=\"Step 3a\"; output;\n        x=0.5; y=log(2) + 1.96*SE + .25;\
    \ text=\"Step 3b\"; output;\n        x=3.2; y=-2; text=\"Step 4a\"; output;\n\
    \        x=1.2; y=-2; text=\"Step 4b\"; position=\"\"; output; * right justify\
    \ text;\nrun;\n\n/* produce the graph with annotation */\nods rtf bodytitle file=\"\
    C:\\Users\\baileraj.IT\\Desktop\\fig7p9.rtf\";\nproc gplot data=or stuff;\n  \
    \ plot logor * or / annotate=myanno haxis=axis1 vaxis=axis2;\nrun;\nquit;\nods\
    \ rtf close;\n```"
  merge: -1
  img_proc: true
- pgno: 264
  md: 'New elements of the annotate data set include:


    +   1. Use of the `arrow` function.

    +   2. Use of `line=2` to request a dashed line in the `draw` function.

    +   3. Use of `position="<"` to request that the text be right-justified in the
    label.

    +   4. Use of `retain` to assign the `label` function to all annotate observations
    that follow.


    # Display 7.10 Conceptual steps for constructing a CI for an OR based on exponentiating
    a symmetric CI


    ![](img/26474180ee55914c13fb9156a7678157_264_0.png)


    What do you think? Isn’t it cool to be able to produce a display like this to
    explain CI constructions?


    Professional SAS programmers often use these methods to construct very specialized
    displays. However, for statistical users who want to create customized graphs,
    learning how to use the Graph Template Language (GTL) and PROC SGRENDER is a better
    investment of time than learning how to use annotate data sets. GTL is a powerful
    language with built-in statistical computing features, whereas annotate data sets
    are primitive.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 7.4 Case Study: Comparing Distributions of Responses


    In this section, many of the ideas described previously are applied to graphics
    to help you understand the differences in the distribution of responses between
    experimental conditions. You will use the nitrophen data set, which contains nitrophen-concentration-reproductive
    response data on water fleas Ceriodaphnia dubia-exposed to varying concentrations
    of nitrophen.² (Hey, you might be sick of these data, but you should now be familiar
    enough with the data that you can focus on the code!) This data set includes 10
    observations at each of the five concentrations. You want to construct graphs
    to display how the distribution of responses changes across concentration conditions.
    You want to present the data values and the appropriate summary statistics. In
    the first figure, you produce a scatter plot of the responses versus the concentration
    variable with reference segments at the mean responses. In the second figure,
    you produce a scatter plot with superimposed box plots for the responses at each
    concentration.


    Some of the key actions in the code in Display 7.11 that apply to both of the
    scatter plots include the following:


    +   1. Define a jitter so that all of the observations can be observed.

    +   2. Rotate the y-axis label using the AXIS statement.

    +   3. Define the label for the x-axis and the range of the values on the x-axis
    (the LABEL and ORDER parts of the AXIS2 statement).

    +   4. Suppress the tick marks and scale values on the x-axis (MINOR=NONE, MAJOR=NONE,
    and V=NONE in the AXIS2 statement).


    In the first scatter plot, an annotate data set is used to label concentration
    values above the x-axis, and to draw and superimpose segments at the mean response
    values. In the second scatter plot, SYMBOL1 selects the plotting character for
    the scatter plot, and SYMBOL2 selects a box plot interpolation and specifies the
    width of the boxes (bwidth=8). Again, an annotate data set is used to label the
    concentration values above the x-axis. Because jittering is used to modify values,
    annotate data sets are used to define the x-axis values in these two scatter plots.
    Try this at home: Can AXIS statements produce these scatter plots?


    > ² Nitrophen data set from Bailer, A. John., and James T. Oris. 1994. "Assessing
    Toxicity of Pollutants in Aquatic Systems." Chapter 2 in Case Studies in Biometry.
