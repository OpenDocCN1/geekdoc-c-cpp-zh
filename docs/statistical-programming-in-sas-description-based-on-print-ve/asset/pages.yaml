- pgno: 348
  md: 'The spatial distribution of a quantity of interest might be clustered or regularly
    spaced. Clustered observations tend to have less distance between observations
    than completely spatially random (CSR) observations. Regularly spaced observations
    tend to have more distance between observations than CSR observations. While more
    complicated test statistics should be considered in this context (Ripley 1981,
    Waller and Gotway 2004), a very simple statistic—average nearest-neighbor distance—is
    selected. Define the nearest-neighbor distance for observation i as the following:


    d(i)=min(d_i1, d_i2, ..., d_i(i-1), d_i(i+1), ..., d_in) where d_ij=Euclidean
    distance between observation i and observation j (i≠j).


    Assume that there are n observations in the data set. The average nearest-neighbor
    distance is Σd(i)/n.


    Let’s see what happens when there is a square plot of n=4 trees that are located
    at coordinate points (.25, .65), (.25, .75), (.35, .65), and (.35, .75). (Without
    giving away the punch line, you can see that these coordinate points are clustered
    in the unit square. The punch line was just given away! Determine whether the
    analysis confirms the interocular trauma test.)


    Here is the strategy for this analysis:


    +   1. Determine nearest-neighbor distances for the observed data.

    +   2. Calculate the average nearest-neighbor distance for the observed data.

    +   3. Assuming the null hypothesis of CSR observations is true, generate a sample
    of observations that are randomly distributed in the region of interest.

    +   4. Calculate the average nearest-neighbor distance for this simulated data.

    +   5. Repeat steps 3 and 4 many times.

    +   6. The Monte Carlo p-value is the proportion of generated samples that are
    more extreme than the observed data. To test for clustering, determine whether
    the average nearest-neighbor distance from the simulated data is less than the
    average nearest-neighbor distance from the observed data.


    These six steps can be thought of as pseudo-code for the program to calculate
    the Monte Carlo p-value for detecting clustering. The recommendation in the previous
    chapter is to flesh out the pseudo-code. In Display 9.5, these six steps are identified
    with comments in the program implementing this analysis.'
  merge: -1
  img_proc: true
- pgno: 349
  md: "# Display 9.5 Calculating a Monte Carlo p-value to detect clustering\n\n```\n\
    /* enter the observed data into data arrays  */\ndata plot_obs;\n    array xobs(4)\
    \ xobs1-xobs4;\n    array yobs(4) yobs1-yobs4;\n    do idat = 1 to 4;\n      \
    \  input xobs(idat) yobs(idat) @@;\n    end;\ndatalines;\n.25 .65 .25 .75 .35\
    \ .65 .35 .75\n;\nrun;\n\n/* STEP 1: Determine nearest-neighbor distances for\
    \ observed data  */\ndata plot1;  set plot_obs;\n    array xobs(4) xobs1-xobs4;\n\
    \    array yobs(4) yobs1-yobs4;\n    array nnobs(4) nnobs1-nnobs4;\n\n/* Determine\
    \ nearest-neighbor distance for each point  */\nsumnnobs = 0;\ndo i=1 to 4;  \
    \    * find nearest-neighbor distance for each point;\n    nnobs(i) = 100;  *\
    \ initialize distances to be large;\n\n/* calculate the Euclidean distance between\
    \ the ith tree and\n   all others - save the smallest value as the distance to\
    \ its\n   nearest neighbor and compare the ith point to all others.\n*/\n    do\
    \ j=1 to 4;\n        d=sqrt( (xobs(i)-xobs(j))**2 + (yobs(i) yobs(j))**2 );\n\
    \        if (d<nnobs(i)) and (d>0) then nnobs(i)=d;\n    end;\n/* Note: Each point\
    \ is also compared to itself - thus, d=0\n       omitted from updated of nearest\
    \ neighbor distance. */\n    sumnnobs=sumnnobs+nnobs(i);\nend;\n\n/* STEP 2: Calculate\
    \ average nearest-neighbor distance for observed data  */\navgnnobs = sumnnobs/4;\n\
    run;\n\n/* Simulate plots under CSR  */\ndata mccsr1; set plot1;\n    array xobs\
    \ xobs1-xobs4; * observed data;\n    array yobs yobs1-yobs4;\n    array xsim xsim1-xsim4;\
    \ * CSR simulated data;\n    array ysim ysim1-ysim4;\n```"
  merge: -1
  img_proc: true
- pgno: 350
  md: "# Display 9.5 (continued)\n\n```\narray nnobs nnobs1-nnobs4; * observed NN\
    \ distances;\narray nncsr nncsr1-nncsr4; * simulated NN distances;\n\n/* STEP\
    \ 3: Generate many CSR plots with four trees */\n\n* initialize counters of nn\
    \ avg dist le or ge than observed;\nnumle = 0;\n* numge = 0; * commented out since\
    \ focus on clustering here;\n\nnsim = 4000;      * user-specified option;\nseed1\
    \ = 12345;    * if =0, then uses time since midnight;\ncall streaminit(seed1);\n\
    \ndo isim = 1 to nsim;\n\n/* STEP 5: Repeat steps 3 and 4 many times */\ndo ii\
    \ = 1 to 4;\n    xsim(ii) = RAND('uniform');\n    ysim(ii) = RAND('uniform');\n\
    end;\n\n/* STEP 4: Calculate average nearest-neighbor distance for simulated data\
    \ */\n\nsumnncsr = 0;\ndo i=1 to 4;\n    nncsr(i) = 100;  * initialize;\n\n  \
    \  do j=1 to 4;\n        d=sqrt( (xsim(i)-xsim(j))**2 + (ysim(i)-ysim(j))**2 );\n\
