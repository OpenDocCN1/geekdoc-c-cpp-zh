  md: "Display 6.2B shows the graph of the ResidualPlot object. Display 6.2C shows\
    \ the graph of the FitPlot object.\n\n# Display 6.4 Partial listing of the graphs\
    \ produced by PROC REG\n\n| ODS Graph Name | Plot Description | PLOTS Option |\n\
    |---|---|---|\n| AdjrsqPlot | Adjusted R-square statistic for models examined\
    \ using variable selection | ADJRSQ |\n| AICPlot | AIC statistic for models examined\
    \ using variable selection | AIC |\n| BICPlot | BIC statistic for models examined\
    \ using variable selection | BIC |\n| CooksDPlot | Cook’s D statistic versus observation\
    \ number | COOKSD |\n| CPPlot | Cp statistic for models examined using variable\
    \ selection | CP |\n| DFFITSPlot | DFFITS statistic versus observation number\
    \ | DFFITS |\n| DFBETASPanel | Panel of DFBETAS statistics versus observation\
    \ number | DFBETAS |\n| DFBETASPlot | DFBETAS statistic versus observation number\
    \ | DFBETAS(UNPACK) |\n| ... | ... | ... |\n| VIFPlot | Plot of VIF traces | RIDGE(UNPACK)\
    \ |\n\nThe PLOTS option in the following PROC REG statement requests a panel of\
    \ DFBETAS plots. The following code selects only DFBETAS for this regression.\
    \ If only was omitted, then the three default graphics and the DFBETAS plots would\
    \ be produced.\n\n```\nods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\\
    fig6p1.rtf\";\nods graphics on;\nproc reg data=cubic plots(only)=DFBETAS;\n  model\
    \ response = x;\nrun;\nods graphics off;\nods rtf close;\n```\n\nIn Display 6.5,\
    \ a 1x2 graph with DFBETAS for the intercept and slope is shown."
