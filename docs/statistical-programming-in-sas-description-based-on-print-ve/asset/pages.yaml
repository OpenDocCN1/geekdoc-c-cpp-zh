  md: "# 4.3 Enhancing PROC TABULATE Output\n\nAt this point, you have probably had\
    \ enough of the nit rofen data set. The life expectancy data for different countries\
    \ is used for the next example. A table of sample sizes, means, and standard deviations\
    \ for the life expectancy of men and women is requested. In addition, the literacy\
    \ percentage and LOG10(GNP) are requested. The data represents countries that\
    \ are sparsely populated (in the first quartile of population density), moderately\
    \ populated (in the middle 50% of population density), and densely populated (in\
    \ the top 25% of population density). This program is shown in Display 4.6.\n\n\
    # Display 4.6 Constructing numeric statistical summaries of life expectancy, GNP,\
    \ and literacy percentage separately for the different quartiles of population\
    \ density\n\n```\n%let topdir = C:\\Users\\baileraj.IT\\BAILERAJ;      * go ahead\
    \ and check out;\n%let subdir = Classes\\Web-Classes\\sta402\\data\\;  * macro\
    \ variables in Ch 10;\ndata country;\ntitle 'country data analysis';\ninfile \"\
    &topdir.&subdir.country.data\";\ninput name $ area popnsize pcturban lang $ liter\
    \ lifemen\n      lifewom pcGNP;\nlogarca = log10(area);\nlogpopn = log10(popnsize);\n\
    loggnp  = log10(pcGNP);\ndensity = popnsize/area;      * construct density variable;\n\
    ien glish = (lang=\"English\");\ndrop area popnsize pcGNP;\nrun;\n\nproc univariate\
    \ data=country;  * calculate %tiles of density;\nvar density;\nid name;\noutput\
    \ out=cstats Q1=P_25 Q3=P_75;  * output to data set - cstats;\n* output out=cstats2\
    \ pctlpts=25 75 pctlpre=P ;  * equivalent;\nrun;\n\nproc print data=cstats;  *\
    \ check of summary stat data;\nrun;\n/* the CSTATS data set . . .\nObs      P_75\
    \      P_25\n1   0.40881   0.046858\n*/\n\ndata country;      * adding Q1 and\
    \ Q3 to each line of the country data set;\n```"
