    # 6.7 Summary


    The chapter began with a brief description of ODS Graphics. Customizing ODS Graphics
    using the ODS Graphics Editor and changing styles and templates were initially
    discussed. Next, the richness of SG procedures for data displays was explored.


    There are many features and benefits of ODS Graphics that are not covered in this
    chapter. For a general introduction to ODS Graphics, see Chapter 21, “Statistical
    Graphics Using ODS,” in the SAS/STAT User’s Guide, Second Edition, and Rodriguez
    (2009) for a brief, high-level introduction to ODS Graphics. To customize your
    ODS Graphics to the extreme, learn more about GTL and its connection to ODS Graphics
    and the SGRENDER procedure.'
  merge: -1
  img_proc: true
