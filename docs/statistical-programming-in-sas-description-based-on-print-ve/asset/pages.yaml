    # 11.4 Importing a Data Set into SAS/IML and Exporting Matrices from SAS/IML to
    a Data Set


    Up to now, you have entered matrices directly in PROC IML. You can imagine that
    it would be painful to enter and manipulate a large matrix in SAS. The SAS/IML
    functions USE and READ can be used to construct a matrix from a SAS data set.
    And, the SAS/IML functions CREATE and APPEND can be used to construct a SAS data
    set from a SAS/IML matrix.


    # 11.4.1 Creating matrices from SAS data sets and vice versa


    Suppose you have a SAS library containing a data set named nitrofen¹ that has
    a number of variables including total and conc. Display 11.7 illustrates importing
    these data into SAS/IML, and then adding three new columns. One column contains
    CONC², and the other two columns contain (CONC − C̄) and (CONC − C̄)², where C̄
    is the average concentration. A new data set n2 is exported from SAS/IML using
    the create and append commands. The create command opens a new data set. The append
