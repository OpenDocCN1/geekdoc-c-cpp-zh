- pgno: 237
  md: "# Display 6.18 Producing separate dot plots of the number of young for each\
    \ concentration\n\n```\ndata nitrofen;\n    infile 'C:\\Users\\baileraj.IT\\Desktop\\\
    ch2-dat.txt' firstobs=16 expandtabs missover pad;\n    input @9 animal 2. @17\
    \ conc 3. @25 brood1 2. @33 brood2 2. @41 brood3 2. @49 total 2.;\nrun;\n\nods\
    \ rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\nitrofen-dotplots.rtf\"\
    ;\nproc sgpanel data=nitrofen;\ntitle \"dot plots\";\npanelby conc / layout=panel\
    \ novarname columns=5;\ndot total;\nrun;\n\nods rtf close;\n```\n\nThe SGPANEL\
    \ procedure includes statements that identify the classification variable for\
    \ each panel (panelby conc) with five columns specified. Using the LATTICE option\
    \ in PROC SGPANEL is more relevant if you have two classification variables. With\
    \ the LATTICE option, the values of the first classification variable define the\
    \ rows, and the values of the second classification variable define the columns.\n\
    \n# Display 6.19 Separate dot plots of the number of young for each concentration\n\
    \n![](img/26474180ee55914c13fb9156a7678157_237_0.png)"
  merge: -1
