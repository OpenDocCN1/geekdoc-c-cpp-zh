    \ test.\nFisher's Exact Test\nTable Probability (P)\t2.677E-10\nPr <= P\t5.354E-09\n\
    Cochran-Armitage Trend Test\nStatistic (Z)\t5.0080\nOne-sided Pr > Z\t<.0001\n\
    Two-sided Pr > |Z|\t<.0001\nSample Size = 50\n\nThe probability of producing young\
    \ in the third brood appears to decrease in the highest nitrophen concentration.\
    \ For more details about the statistical tests in this example, see standard categorical\
    \ data references (e.g., Agresti 2002). Categorical data analysis methods in SAS\
    \ are nicely summarized by Stokes et al. (2009).\n\n# 3.10 Summarizing Numeric\
    \ Variables\n\nIf you were stuck on a desert island with access to only one SAS\
    \ procedure, PROC UNIVARIATE might be your choice (assuming you have an interest\
    \ in characterizing a numeric variable while stranded on a desert island). This\
    \ procedure can generate descriptive statistics of location (means, medians, percentiles)\
    \ and spread (standard deviation, variance, range, interquartile range). It can\
    \ identify extreme values in the data set. In addition, it can produce simple\
    \ graphics including histograms, normal quantile plots, stemplots, box plots,\
    \ etc. The following programming statements produce a"
  merge: -1
  img_proc: true
- pgno: 124
  md: "histogram of the total number of young with a nonparametric density estimate\
    \ (Display 3.25). The statements also produce a plot of the quantiles of the data\
    \ versus normal quantiles (Display 3.26):\n\n```\nproc univariate data=nitro_tox;\n\
    \    var total;\n    histogram / kernel;  * histogram with nonpar. Density est.;\n\
    \    qqplot;             * quantile-quantile plot vs. normal;\nrun;\n```\n\n#\
    \ Display 3.25 Histogram of the 50 observations of the total number of young in\
    \ the five nit rofen concentration conditions\n\n![](img/26474180ee55914c13fb9156a7678157_124_0.png)\n\
    \nThe multimodal pattern of this display is not surprising because it includes\
    \ data from five different concentration conditions including the condition of\
    \ many young produced (e.g., CONC=0, 80) and the condition of few young produced\
    \ (e.g., CONC=310). In Display 3.26, the nonlinearity of the Q-Q plot suggests\
    \ that the distribution of the total number of young produced is not normal. Again,\
    \ this is not a surprise because these data include responses from five different\
    \ concentration conditions."
  merge: -1
  img_proc: true
