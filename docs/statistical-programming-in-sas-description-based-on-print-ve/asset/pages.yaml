- pgno: 390
  md: '# 10.8 Functions and Routines for Macros


    In Display 10.11, %SYSEVALF evaluated the logical comparison &NPTS<1. %SYSEVALF
    is a general evaluation function. On the other hand, the %EVAL function handles
    integer arithmetic. Many other functions are available for macro programming.
    %INDEX finds the position of a string in a source string. %LENGTH returns the
    length of an argument and checks for valid arguments. %SCAN displays a particular
    word in an argument. %SUBSTR extracts a substring from an argument. In a previous
    example, %UPCASE converted an argument to all uppercase. Display 10.17 provides
    a short example to illustrate some of these functions.


    # Display 10.17 Illustrating macro functions with log results


    ```

    %let summer = June July August;

    %let pickmth = 3;

    %let mymonth = %scan(&summer, &pickmth);    * pickmth word of summer;

    %let mymonth3 = %substr(&summer, 11, 3);    * start @ position 11 and move 3;

    %let upper_month3 = %upcase(&mymonth3);


    %put Summer=&summer;

    %put Length of ''&summer'' = %length(&summer);

    %put Where is Aug in the ''&summer''? = %index(&summer, Aug);

    %put Month picked = &pickmth;

    %put Which month? = &mymonth;

    %put Which month (3 letters)? = &mymonth3;

    %put Upper case (3 letters)? = &upper_month3;


    From SAS LOG . . .

    Summer=June July August

    Length of ''&summer'' = 16

    Where is Aug in the ''&summer''? = 11

    Month picked = 3

    Which month? = August

    Which month (3 letters)? = Aug

    Upper case (3 letters)? = AUG

    ```'
