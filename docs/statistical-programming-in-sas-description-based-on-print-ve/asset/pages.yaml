    # 6.1 Graphics in SAS


    In previous chapters, statistical procedures were used to display data patterns
    and model summaries. Statistical procedures invoked ODS Graphics to produce many
    figures in Chapter 4 and Chapter 5. In this chapter, let’s take a closer look
    at producing graphics in SAS and customizing the graphics. Wonderful books that
    describe effective graphical'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'displays include Tufte (2001) and Robbins (2005), and you should review them
    as you think about depicting data. While these books are not explicitly discussed
    in this chapter, they have influenced the data displays in this chapter.


    Most, if not all, of the graphics in earlier chapters used the new ODS Statistical
    Graphics (ODS Graphics). In these graphics, an output destination (e.g., ODS RTF)
    is specified before the procedure is invoked (e.g., PROC SGPLOT) or before the
    graphics are requested (e.g., ODS graphics for regression analyses requested by
    PROC REG). This is not the only way to produce graphics. In fact, you can also
    produce graphics using traditional SAS graphics, which is discussed in Chapter
    7.


    # 6.2 ODS Statistical Graphics


    The power and utility of ODS was discussed in Chapter 4. Most of the output in
    this book is based on using the ODS RTF destination to package output from various
    procedures. ODS RTF invocations should include the FILE= specification to explicitly
    identify a file for permanently storing output. SAS recommends this in two SAS
    Notes— http://support.sas.com/kb/32/474.html and http://support.sas.com/kb/35/957.html.


    One aspect of ODS that has not been addressed in detail is the special use of
    ODS Graphics to produce automatically contextually relevant graphs for statistical
    procedures. Here, contextually relevant means that the statistical graphics associated
    with regression are not necessarily the same graphics for an ANOVA model or for
    a survival analysis. In this section, the graphics that can be produced using
    the ODS GRAPHICS statement and statistical procedures are explored. Essentially,
    ODS Graphics refers to the new functionality in SAS 9.2 for creating graphics.
    This functionality is broadly used by numerous statistical procedures in SAS/STAT
    software, SAS/ETS software, SAS/QC software, and Base SAS software, which automatically
    produce graphs as part of their output. It is also used by new procedures in SAS/GRAPH
    software that create stand-alone graphs. All of these products share the general
    features of ODS Graphics, such as styles for consistency of appearance, image
    formats, point-and-click editing with the ODS Graphics Editor, and so on.


    In Display 6.1, the statements for generating a data set that has a cubic mean
    response function with normal errors, and then fitting a linear regression model
    are given. Regression-relevant graphics are generated by nesting a proc reg statement
    between an ods graphics on statement and an ods graphics off statement. You can'
  merge: -1
  img_proc: true
- pgno: 214
  md: "put the ods graphics on statement at the beginning of your SAS program if you\
    \ want ODS Graphics to be produced by more than one procedure. Note: ODS Graphics\
    \ consume additional resources (time and memory), which is why it is not the default\
    \ way to produce graphics.\n\n# Display 6.1 Generating a cubic mean response data\
    \ set and fitting a linear regression model with ODS Graphics requested\n\n```\n\
    data cubic;\n    call streaminit(8675309);\n    do nrep=1 to 3;\n        do x=1\
    \ to 10;\n            response = 3 + 1*x - .5*x**2 + .05*x**3 + rand('normal',0,1.5);\n\
    \            output;\n        end;\n    end;\nrun;\n\nods rtf bodytitle file=\"\
    C:\\Users\\baileraj.IT\\Desktop\\fig6p1.rtf\";\nods trace on;\nods graphics on;\n\
    proc reg data=cubic;\n    model response = x;\nrun;\nods graphics off;\nods trace\
    \ off;\nods rtf close;\n```\n\nThe ODS Graphics produced by default with PROC\
    \ REG are shown in Displays 6.2A, 6.2B, and 6.2C. A fit diagnostics panel in Display\
    \ 6.2A, a plot of residuals versus the predictor variable in Display 6.2B, and\
    \ the fitted model with confidence and prediction intervals in Display 6.2C are\
    \ produced."
  merge: -1
  img_proc: true
