- pgno: 376
  md: "The macro program is invoked by a reference to %PROG-NAME. The semicolon is\
    \ not needed. %PROG-NAME is talking to the macro processor, not to other SAS components.\n\
    \nParameters can be passed to macro programs. (The word “parameter” has a technical\
    \ meaning to the statistical community, and a different meaning to the programming\
    \ community. Here, a “parameter” is an argument to a macro whose value might influence\
    \ what a macro does.) In this macro program example, complicated macro variable\
    \ constructions are explored. Consider the example in Display 10.8. Two macro\
    \ variables need to be resolved to define a third macro variable. Variables have\
    \ hypothetical values of weights (weight1 and weight2) measured on two separate\
    \ occasions (week1 and week2). Two macro parameters (variable and obs) identify\
    \ the variable and occasion of interest. This macro is designed to echo the input\
    \ to the log and print the value of the variable of interest.\n\n# Display 10.8\
    \ Resolving a complex macro variable\n\n```\n%let var1=week;\n%let var2=weight;\n\
    %let time1=1;\n%let time2=2;\n%let var1time1 = week1;\n%let var1time2 = week2;\n\
    %let var2time1 = weight1;\n%let var2time2 = weight2;\n\ndata tester;\n  input\
    \ week1 weight1 week2 weight2;\n  datalines;\n15 70 25 74\n;\nrun;\n\n%macro showvalue(variable,\
    \ obs); * positional parameter;\n  %put Value of '&variable' = &variable;\n  %put\
    \ Value of '&obs' = &obs;\n  %put Value of '&&&variable.&obs' = &&&variable.&obs;\n\
    \  proc print;\n    var &&&variable.&obs;\n  run;\n%mend showvalue;\n\n%showvalue(var1,\
    \ time1)\n\n%showvalue(var2, time2)\n```"
  merge: -1
  img_proc: true
- pgno: 377
  md: 'An interesting construct in this program is &&&variable.&obs. Macro variable
    names are resolved from left to right. && is resolved to & by the macro processor.
    In this example, when &variable=var1 (=week) and &obs=time1 (=1), &&&variable.&obs
    has the value var1time1 (=week1). The SAS log from invoking this macro is shown
    in Display 10.9.


