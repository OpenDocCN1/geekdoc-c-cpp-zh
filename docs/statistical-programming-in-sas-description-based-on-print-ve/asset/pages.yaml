- pgno: 283
  md: 'Numeric variables are read using informats and are displayed using formats.
    The specification of numeric informats and formats involves stating the name of
    the format, the width of the display, and the number of decimals to the right
    of the decimal point. For example, here is a specification:


    ```

    format-namew.d

    ```


    w is the total width including the decimal point and the number of decimals to
    the right of the decimal point). d is the number of decimals to the right of the
    decimal point.


    SAS uses an arguably best format when the BESTw. format is specified. Other numeric
    formats include Ew. for scientific notation, COMMAw.d for comma-separated values
    after each consecutive set of three digits, DOLLARw.d for currency (to add a $
    to the left of a numeric value), and w.d for the most common and default numeric
    format. Display 8.3 contains a simple program exploring some of these numeric
    formats.


    # # Display 8.3 DATA step displaying numeric formats


    ```

    ```sas

    data numeric_format_show;

    /* character formatting illustrated first */

    test_num = 1277695.384;

    put ''BEST6. / BEST9. / BEST12.'' ;

    put test_num BEST6.;

    put test_num BEST9.;

    put test_num BEST12.;

    put ''-------------------------------'';

    put ''COMMA7. / COMMA10.1 / COMMA11.3'';

    put test_num COMMA7.;

    put test_num COMMA10.1;

    put test_num COMMA11.3;

    put ''-------------------------------'';

    put ''E7.'';

    put test_num E7.;

    put ''-------- -- -- --------'';

    put ''7. / 10.1 / 11.3'';

    put test_num 7.;

    put test_num 10.1;

    put test_num 11.3;

    put ''-------------------------------'';

    put ''DOLLAR9. / DOLLAR12.2'';

    put test_num DOLLAR9.;

    put test_num DOLLAR12.2;

    run;

    ```

    ```


    The output in Display 8.4 is right on target. A number such as 1277695.384 needs
    w=11 and d=3 to fully display. If w=11 is specified, then rounding the value is
    necessary. It is interesting that the BEST format displays in scientific notation
    when w=6.'
  merge: -1
  img_proc: true
- pgno: 284
  md: "# Display 8.4 Output from SAS log with examples using numeric formats\n\n```\n\
    BEST6. / BEST9. / BEST12.\n    1.28E6\n    1277695.4\n    1277695.384\n    .....................\n\
    COMMA7. / COMMA10.1 / COMMA11.3\n    1,277,695\n    1,277,695.4\n    1,277,695.384\n\
    \    .....................\nE7.\n    1.3E+06\n    .....................\n7. /\
    \ 10.1 / 11.3\n    1277695\n    1277695.4\n    1277695.384\n    .....................\n\
    DOLLAR9. / DOLLAR12.2\n    $1277695\n    $1277695.38\n```\n\nFormats can be temporarily\
    \ associated with a variable by declaring the format as a statement accompanying\
    \ a procedure. Formats can be permanently associated with a variable by linking\
    \ the format to the variable in a DATA step. The next section describes a case\
    \ where a user-defined format is constructed, and then linked to a variable using\
    \ a declaration in a DATA step.\n\n# 8.1.1 Defining your own formats and informats\n\
    \nSometimes, SAS formats and informats might not be exactly what you need. In\
    \ addition, you might want to customize the display of the values of a variable.\
    \ In these cases, you need to define your own format. In Chapter 2, this task\
    \ was briefly introduced when reading the values of variables was discussed. In\
    \ Chapter 3, it was mentioned when enhancing the output of an analysis was presented.\
    \ SAS makes it relatively easy to define formats and informats using the FORMAT\
    \ procedure. For defining numeric formats, here is the general form of the statement:"
  merge: -1
  img_proc: true
- pgno: 285
  md: '```

    ```sas

    proc format

    <options: LIBRARY=SAS library/catalog to contain formats/informats.>;

    value name <value-range-set(s)>;

    run;

    ```

    ```


    For defining character formats, here is the general form of the statement:


    ```

    ```sas

    proc format

    <options: LIBRARY=SAS library/catalog to contain formats/informats.>;

    value $name <value-range-set(s)>;

    run;

    ```

    ```


    Informats are analogously defined except that the value statement is replaced
    by an invalue statement.


    The following example explores defining a user-defined format. Consider a simple
    data set with a variable that corresponds to the percentage of literate residents
    in an area. Valid responses need to be between 0% and 100%. Values outside this
    range are invalid, while missing values are identified as missing. The following
    code illustrates this format. (The cutpoints of the categories 53, 76, and 90
    are assumed.) The valid ranges and missing values are mapped to their formatted
    labels. All other entries are labeled invalid. The OTHER = ''Invalid'' statement
    in the literacyfmt format captures all values that are not yet categorized in
    the format declaration. (Ranges can start at the smallest nonmissing value of
    a variable, LOW-, and range up to the maximum value, -HIGH. Bilenas (2005) and
    Cody and Pass (1995) give good descriptions of these values and many other format
    features.) The format name literacyfmt has a period appended when it is linked
    to the LITERACY variable using the FORMAT statement in the definition of the toyexample2
    data set.'
  merge: -1
  img_proc: true
