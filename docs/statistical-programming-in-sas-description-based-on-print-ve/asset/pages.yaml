- pgno: 33
  md: "use this software, then the Import Wizard can still be used to import text\
    \ files or comma-separated, tab-delimited, or any type of delimited files. For\
    \ more information about importing data from external sources and manipulating\
    \ it to build an analysis data set, see Chapter 2.\n\n# 1.5 Internally Documenting\
    \ SAS Programs\n\nComments can be incorporated into SAS programs using several\
    \ strategies. Commenting throughout a program makes it easier to read.\n\n+  \
    \ 1. Comments can be statements beginning with an asterisk and ending with a semicolon.\
    \ For example:\n\n```\nproc glm data=health_data;\n* fit ancova model with covariate\
    \ x and\n  classification variable SMOKE;\n    class SMOKE;\n    model SBP = x\
    \ | SMOKE;\nrun;\n```\n\n+   2. A block of comments is often enclosed within /*\
    \ and */. For example:\n\n```\n/* fit ancova model\n   covariate: x\n   classification\
    \ variable: SMOKE\n*/\nproc glm data=health_data;\n    class SMOKE;\n    model\
    \ SBP = x | SMOKE;\nrun;\n```\n\nI use both strategies, although the /* <comment>\
    \ . . . */ strategy is nice for commenting out blocks of code and defining the\
    \ header information for a program.\n\n+   3. You can use TITLE statements to\
    \ annotate output and implicitly comment a program. For example:\n\n```\nproc\
    \ glm;\ntitle \"fit ancova model with covariate x\";\ntitle2 \" and classification\
    \ variable SMOKE\";\nclass SMOKE;\nmodel SBP = x | SMOKE;\nrun;\n```"
  merge: -1
  img_proc: true
