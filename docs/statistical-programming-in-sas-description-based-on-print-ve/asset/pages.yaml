    # 7.5 Descriptive Displays of Spatial Data


    Regional or geographical differences are often best depicted as maps. SAS provides
    a collection of maps and procedures to display data on these maps. The GMAP procedure
    is the basic procedure for producing maps in SAS. For an overview of producing
    maps in SAS, see Zdeb (2004). In Display 7.14, the code for producing a choropleth
    map of the 1990 population in Ohio counties is provided.'
  merge: -1
  img_proc: true
- pgno: 270
  md: "# Display 7.14 Producing a choropleth map of the 1990 population in Ohio counties\n\
    \n```\nproc gproject data=maps.counties out=OHIO_counties;\n    where state eq\
    \ 39;\n    id state;\nrun;\n\n/*\n(Subset of years from data set of) Ohio County\
    \ population sizes from 1900-1990\nhttp://www.census.gov/population/cencounts/oh190090.txt\n\
    */\ndata county_pop;\n    length char_county $ 10;\n    input county6 1-5 pop90\
    \ pop80 pop70 pop60 char_county &;\n    county = county6-39000;  * removing state\
    \ id from FIPS;\n    datalines;\n39001    25371    24328    18957    19982 Adams\n\
    39003    109755   112241   111144   103691 Allen\n... (see appendix for complete\
    \ data set) ...\n39175    22254    22651    21826    21648 Wyandot\n;\nrun;\n\
    proc gmap data=county_pop\n    map=OHIO_counties;\n    id county;\n    choro pop90;\n\
    \    note '1990 Population Size (Source: US Census)';\nrun;\nquit;\n```\n\nThis\
    \ code begins with an initial projection using GPROJECT to restructure the internal\
    \ SAS map data set coordinates in a familiar map orientation. The Ohio county\
    \ population data are then read into a data set. (See the Appendix for the complete\
    \ data set.) The map is constructed by linking the map data set (map=OHIO_counties)\
    \ to the population data (data=county_pop). A variable must link each map region\
    \ to a response associated with that region (id county). You need to identify\
    \ that you want a choropleth map with shading for each county proportional to\
    \ the county population values (choro pop90). The map produced by this code is\
    \ shown in Display 7.15."
  merge: -1
  img_proc: true
