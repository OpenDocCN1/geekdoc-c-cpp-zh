    The qualitative conclusions from comparing the packaging conditions are similar.
    The LSMEANS statement becomes more interesting for multifactor analyses. The CONTRAST
    statement allows for tests of specific contrasts (i.e., linear combinations whose
    coefficients sum to zero—H0: Σ ci μi = 0 for Σ ci = 0). To test whether the mean
    response in the plastic condition is equal to the average of the mean response
    in the other three conditions, test H0: μplastic = 1/3 (μvacuum + μmixed + μCo2)
    or H0: 3 μplastic - 1 μvacuum - 1 μmixed - 1 μCo2 =0. This is specified using
    the following statement:'
