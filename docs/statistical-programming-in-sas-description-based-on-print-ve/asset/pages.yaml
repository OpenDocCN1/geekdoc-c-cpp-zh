- pgno: 338
  md: "# 8.13 References\n\nBilenas, Jonas. 2005. *The Power of PROC FORMAT*. Cary,\
    \ NC: SAS Institute Inc.\n\nCody, Ron, and Ray Pass. 1995. *SAS Programming by\
    \ Example*. Cary, NC: SAS Institute Inc.\n\nEfron, Bradley, and Robert J. Tibshirani.\
    \ 1994. *An Introduction to the Bootstrap*. New York, NY: Chapman & Hall/CRC.\n\
    \nMiller, Rupert G. 1986. *Beyond ANOVA: Basics of Applied Statistics*. New York,\
    \ NY: John Wiley & Sons Inc.\n\nWicklin, Rick. 2008. “SAS Stat Studio: A Programming\
    \ Environment for High-End Data Analysts.” *Proceedings of the SAS Global Forum\
    \ 2008 Conference*. Cary, NC: SAS Institute Inc. Available at http://www2.sas.com/proceedings/forum2008/362-2008.pdf.\n\
    \n# 8.14 Exercises\n\n+   1. Conduct a Monte Carlo simulation to examine the behavior\
    \ of *t*-based CIs for the mean of a Poisson distribution. A Poisson random variable\
    \ can be used to model unbounded counts (0, 1, 2, 3, …). If Y ~ Poisson(μ), then\
    \ E(Y)=V(Y)=μ. Compare two CI procedures in terms of coverage and length.\n+ \
    \  \n+      a. $\\bar{Y} \\pm t_{1-\\alpha/2,n-1}\\dfrac{s_y}{\\sqrt{n}}$\n+ \
    \  \n+      b. $\\left\\{\\bar{X} \\pm t_{1-\\alpha/2,n-1}\\dfrac{s_x}{\\sqrt{n}}\\\
    right\\}^2$ where $X_i=\\sqrt{Y_i}$\n+   \n+      Select at least three values\
    \ of μ (say, 2, 10, and 25) and three values of n for this illustration (say,\
    \ n=15, 30, and 50).\n\n+   2. Construct a 95% BCa bootstrap CI for the mean AGE\
    \ variable from the FITNESS data set used in Display 8.49.\n\n+   3. Construct\
    \ a 95% CI for the variance of the AGE variable in the FITNESS data set used in\
    \ Display 8.49. Use percentile-based bootstrap methods to obtain this interval.\n\
    \n+   4. Estimate π using a Monte Carlo integration. Provide the appropriate error\
    \ bounds with this estimate."
