- pgno: 335
  md: "# 8.11 Generating Variables Using Random Number Generators\n\nIt’s time for\
    \ a confession. In this book, random number generators were used before they were\
    \ formally discussed. Arrays were used before they were defined, and other concepts\
    \ were probably slipped in here and there without appropriate explanation. However,\
    \ patience will be rewarded. Most of these concepts eventually will be discussed.\n\
    \nThe case studies in this chapter include random normal deviates and random uniform\
    \ deviates that are invoked by RAND ('Normal') or RAND ('Uniform'). These deviates\
    \ have the equivalent functions RANNOR/NORMAL and RANUNI/UNIFORM, respectively.\
    \ There are a number of random number functions and routines that take the form\
    \ RAN####, where #### denotes a distribution such as binomial (BIN), Cauchy (CAU),\
    \ exponential (EXP), Poisson (POI), and triangular (TRI), to name a few. In addition,\
    \ a random deviate can be generated from a probability distribution specified\
    \ as a table (RANTBL).\n\nSAS includes CDF and QUANTILE for obtaining cumulative\
    \ probabilities and quantiles from specified distributional arguments. You can\
    \ use an analogous function for random number generation. Here is the syntax of\
    \ this function:\n\n```\nRAND('distribution-name', parameter-list-sep-commas)\n\
    ```\n\nThe parameter list varies with the distribution. The seed for the RAND\
    \ invocation is set using the STREAMINIT routine. In Display 8.59, a random deviate\
    \ is generated from a triangular distribution.\n\n# Display 8.59 Generating and\
    \ displaying a triangular random deviate\n\n```\ndata triangular;\ncall streaminit(34567);\n\
    do inum = 1 to 1400;\n    mynum = RAND('Triangle', 0.70);\n        * h=0.70 is\
    \ a parameter of the triag. distn.;\n    output;\nend;\nrun;\nods rtf bodytitle\
    \ file=\"C:\\Users\\baileraj.IT\\Desktop\\Display-8-60.rtf\";\nods graphics on;\n\
    proc sgplot data=triangular;\nhistogram mynum;\nrun;\nods graphics off;\nods rtf\
    \ close;\n```"
  merge: -1
  img_proc: true
- pgno: 336
  md: "The histogram displaying a random sample of 1400 triangular deviates is shown\
    \ in Display 8.60.\n\n# Display 8.60 Histogram of 1400 random triangular deviates\n\
    \n![](img/26474180ee55914c13fb9156a7678157_336_0.png)\n\nAnother common (perhaps,\
    \ painfully common) example used in introductory statistics is rolling two dice.\
    \ In Display 8.61, the roll of two dice is simulated 6000 times. When the sum\
    \ of pips on the face of the dice is 7 or greater, the value is recorded. The\
    \ random die roll is implemented by generating an integer of 1 to 6. Each roll\
    \ has a probability of 1/6 using RAND('Table',...) with p(1)=p(2)=...=p(5)=1/6\
    \ specified. The probability of rolling a 6 is implicit from the specification\
    \ of the other five probabilities (i.e., p(6)=1-[p(1)+...+p(5)].\n\n# Display\
    \ 8.61 Simulating rolling a pair of dice\n\n```\ndata diceroll;    * rolling two\
    \ six-sided balanced dice;\n    call streaminit(34567);\n    do inum = 1 to 6000;\n\
    \        die1 = RAND('Table', 1/6, 1/6, 1/6, 1/6, 1/6);\n        die2 = RAND('Table',\
    \ 1/6, 1/6, 1/6, 1/6, 1/6);\n        sum7plus = (die1+die2)>=7;\n        output;\n\
    \    end;\nrun;\n\nods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\\
    Display-8-62.rtf\";\nproc freq data=diceroll;\n    table die1 / nocum testf=(1000,1000,1000,1000,1000,1000);\n\
    \    table sum7plus;\nrun;\nods rtf close;\n```"
  merge: -1
  img_proc: true
