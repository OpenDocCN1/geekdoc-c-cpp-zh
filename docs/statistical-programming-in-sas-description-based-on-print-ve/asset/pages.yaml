- pgno: 328
  md: "distributions such as uniform, beta, chi-square, F, gamma, normal, t, and log-normal\
    \ are included. Discrete distributions such as Bernoulli, binomial, Poisson, and\
    \ negative binomial are also included. Here is the general syntax of the CDF function:\n\
    \n```\nCDF('distribution-name', c, parameter-list-sep-commas)\n```\n\nwhere C\
    \ = the value of the random variable.\n\nThe CDF function is a general way of\
    \ requesting lower-tail probabilities. SAS has a number of different CDF-named\
    \ functions that still work in SAS 9.2. For example, CDF('NORMAL',C) is equivalent\
    \ to PROBNORM(C). CDF('T',C) is equivalent to PROBT(C). Display 8.50 shows the\
    \ use of the CDF function for a variety of calculations. Pr(Z≤-1.645), Pr{ t[df=6]\
    \ ≤ -1.645), Pr{ t[df=60] ≤ -1.645), and Pr{ t[df=600] ≤ -1.645) are calculated.\
    \ (Question: Does t→Z as the degrees of freedom increases?) Pr(Y≤m) is calculated\
    \ for m=0,1,2,3,4 when Y ~ binomial(n=trials=4 and prob of success=0.5). Pr(Y=m)\
    \ is constructed as Pr(Y≤m)-Pr(Y≤ m-1) for m=1,2,3,4 and Pr(Y=0)=Pr(Y≤0). Try\
    \ this at home: How would you determine P(0<Z<1.645) with these functions?\n\n\
    # Display 8.49 CDF function in SAS\n\n```\ndata cdf_examples;\n\n/* Z ~ N(0,1)\
    \ table values */\n norm_area_left = cdf(\"Normal\",-1.645);\n\n norm_area_right\
    \ = 1-cdf(\"Normal\",-1.645);  * area above -1.645 under N(0,1);\n\n/* T ~ t(df)\
    \ table values */\n t_area_left_06 = cdf(\"T\",-1.645, 6);    * area <= -1.645\
    \ for t(df=6);\n t_area_left_60 = cdf(\"T\",-1.645, 60);   * area <= -1.645 for\
    \ t(df=60);\n t_area_left_600 = cdf(\"T\",-1.645, 600); * area <= -1.645 for t(df=600);\n\
    \n/* Pr(Y<=m) for Y ~ binomial(m=successes, p=prob of success=0.5, n=4 trials)\
    \ */\n bin_cdf_0 = CDF('binomial', 0, 0.50, 4);\n bin_cdf_1 = CDF('binomial',\
    \ 1, 0.50, 4);\n bin_cdf_2 = CDF('binomial', 2, 0.50, 4);\n bin_cdf_3 = CDF('binomial',\
    \ 3, 0.50, 4);\n bin_cdf_4 = CDF('binomial', 4, 0.50, 4);\n\n p0 = bin_cdf_0;\
    \           /* Pr(Y=m) for Y ~ binomial(p=0.5, n=4) */\n p1 = bin_cdf_1 - bin_cdf_0;\n\
    \ p2 = bin_cdf_2 - bin_cdf_1;\n p3 = bin_cdf_3 - bin_cdf_2;\n p4 = bin_cdf_4 -\
    \ bin_cdf_3;\n run;\n ods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\\
    Display-8-50.rtf\";\n proc print data=cdf_examples;\n run;\n ods rtf close;\n\
    ```"
