- pgno: 139
  md: "This table includes the summaries of four different variables on the row dimension\
    \ (BROOD1, BROOD2, BROOD3, and TOTAL) with the summary of each variable stratified\
    \ by the value of another variable (CONC). The columns include the sample size\
    \ and the five-number summary (min, first quartile, median, third quartile, max)\
    \ associated with the brood, and the TOTAL variable stratified by the nitrofen\
    \ concentrations. For example, entries in the first row (BROOD1 and CONC=0) correspond\
    \ to the summary statistics of the number of young produced in the first brood\
    \ in organisms exposed to control conditions. Here, the median number of young\
    \ produced in the first brood by the control organisms is 5.5. Let’s explore the\
    \ statements that generated this table.\n\n```\nproc tabulate data=nitrofen format=3.;\n\
    \  class conc;\n  var brood1 brood2 brood3 total;\n  table (brood1 brood2 brood3\
    \ total)*conc,\n        n min q1 median*f=4.1 q3 max;\nrun;\n```\n\nThe class\
    \ conc statement identifies the concentration variable as a categorical variable\
    \ for the table to be constructed. The var brood1 brood2 brood3 total statement\
    \ identifies the four variables as numeric variables to be summarized. Here is\
    \ the general form of the table statement:\n\n```\ntable page dimension, row dimension,\
    \ column dimension;\n```\n\nPage, row, and column dimensions are separated by\
    \ commas. Not all page, row, and column dimensions are required. (In the previous\
    \ code example, only row and column specifications are given.) In the TABLE statement\
    \ generating this output, the rows are nested between the four numeric variables\
    \ and the categorical variable CONC. The columns include the sample size and five\
    \ descriptive statistics (minimum, 25th percentile, median, 75th percentile, and\
    \ maximum). There is a specification for formatting one of the table entries (median*f=4.1).\
    \ The other entries (e.g., n, min, q1, q3, and max) are formatted based on the\
    \ default format set in the proc tabulate data=nitrofen format=3. statement.\n\
    \n# 4.2 Building from Simple Specifications\n\nBuilding a complex final table\
    \ step by step is a good learning experience. Complex final tables are typically\
    \ built from a series of simple tables that culminate in the final table. This\
    \ series of simple tables is explored as you progress toward the table in Display\
    \ 4.2. Usually, you begin with a general idea of the variables to be displayed,\
    \ but you do not have the structure and format of the columns resolved before\
    \ you begin working with"
  merge: -1
  img_proc: true
- pgno: 140
  md: "the display. Simple sketches can help you draft a table to aim for. Suppose\
    \ you want to have the variables listed on the rows and the summary statistics\
    \ displayed on the columns. For example:\n\n| Variable | Sample Size | Min | Q1\
    \ | Median | Q3 | Max |\n|---|---|---|---|---|---|---|\n| Brood 1 |  |  |  | \
    \ |  |  |\n| Brood 2 |  |  |  |  |  |  |\n| Brood 3 |  |  |  |  |  |  |\n| Total\
    \ |  |  |  |  |  |  |\n\nTo implement this with PROC TABULATE, identify the numeric\
    \ variables that you want to summarize using descriptive statistics in the VAR\
    \ statement. Identify these variables in the row dimension. Identify the descriptive\
    \ statistics in the column dimension in the TABLE statement. Display 4.3 presents\
    \ the first pass at coding the commands.\n\n# Display 4.3 Code to produce a draft\
    \ table for the nitrophen data analysis\n\n```\n%let DATA_DIR=C:\\Users\\baileraj.IT\\\
    BAILERAJ\\Classes\\Web-Classes\\STA402\\data;\n\ndata nitrophen;\n  infile \"\
    &DATA_DIR\\ch2-dat.txt\" firstobs=16 expandtabs missover pad;\n  input @9 animal\
