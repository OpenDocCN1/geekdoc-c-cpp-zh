    # 11.9.4 Case Study 4: Generating bootstrap CIs for mean AGE using R


    SAS/IML Studio supports the ability to call R functions. This section does not
    cover all of the nuances of R, much less the data exchange options in SAS/IML
    Studio. If you are interested in learning more about R, see www.r-project.org.


    In this case study, you are working with the AGE variable from the FITNESS data
    from Chapter 8. In Display 11.27, familiar SAS/IML commands are used to define
    a matrix. The matrix is transposed before it is exported to R. ExportMatrixToR
    makes the matrix myAGEmat available for use in R as the data frame age.df. The
    commands between submit / R and endsubmit contain the R statements to perform
    the following functions:


    +   1. Echo the contents of the matrix exported to R.

    +   2. Define a mean function.

    +   3. Request the loading of the boot bootstrap package (Canty and Ripley, 2008).'
  merge: -1
  img_proc: true
- pgno: 435
  md: "+   4. Set the seed for the random number generator.\n+   5. Construct 90%\
    \ and 95% CIs. Construct percentile and bias-corrected and accelerated bootstrap\
    \ CIs (Davison and Hinkley, 1997).\n+   6. Produce a histogram of the bootstrap\
    \ means with superimposed 90% interval endpoints.\n\n(Author’s Note: I have now\
    \ doubled my chances for criticism. People who don’t like my SAS programming now\
    \ have the opportunity to dislike my R coding.)\n\n# Display 11.27 Calling R functions\
    \ to generate bootstrap CIs for mean AGE\n\n```\n* define SAS/IML matrix with\
    \ AGE data from Chapter 8;\nmyAGEmat = {\n44 40 44 42 38 47 40 43 44 38 44 45\
    \ 45 47 54 49 51 51 48 49 57 54 52 50\n51 54 51 57 49 48 52\n};\nmyAGEmat = t(myAGEmat);\n\
    matrib myAGEmat colname={AGE};\nprint myAGEmat;\n\n* Export matrix to R;\nrun\
    \ ExportMatrixToR(myAGEmat, \"age.df\");\n\nsubmit / R;\nage.df\nmymean <- function(x,ii)\
    \ mean(x[ii])\n\nlibrary(boot)\n\nset.seed(9035768)\nmyboots.mean <- boot(age.df,\
    \ mymean, R=4000)\nmyboots.mean.ci <- boot.ci(myboots.mean, type = c(\"perc\"\
    ,\"bca\"),\n    conf=c(0.90, 0.95))\nnames(myboots.mean)\nnames(myboots.mean.ci)\n\
    myboots.mean.ci\n\nhist(myboots.mean$t,xlab=\"Means\",\n    main=\"Histogram of\
    \ means from bootstrap samples\")\nabline(v=myboots.mean.ci$percent[1,4:5])  #\
    \ percentile limits\nabline(v=myboots.mean.ci$bca[1,4:5],lty=2) # bca limits\n\
    endsubmit;\n```\n\nIn Display 11.28, the 90% percentile CIs and 90% bias-corrected\
    \ and accelerated CIs are shown. The percentile and bias-corrected and accelerated\
    \ CIs are (46.13 to 49.10) and (46.03 to 49.03), respectively. These CIs are very\
    \ similar to the CIs (46.19 to 49.19) reported in the analysis in Display 8.49."
  merge: -1
  img_proc: true
