- pgno: 118
  md: '# Display 3.20 Scatter plot of total number of young versus nitrofen concentration
    in each brood


    ![](img/26474180ee55914c13fb9156a7678157_118_0.png)


    There should be 150 observations (50 animals each with three broods) in this plot.
    Obviously, some observations are not in this display. Can you do anything about
    this? The observations are hidden because more than one observation is at a coordinate
    plotting location. One trick is to add a little noise to the plotting location.
    For example, the last data set in Display 3.18—nitro_tox3—constructs a jittered
    concentration (JCONC) by generating a random uniform quantity—UNIF(−10, 10)—that
    is added to each concentration measurement. This is accomplished by first generating
    a random uniform variate—U(0,1)—and then multiplying by 20 to yield U(0, 20).
    Then, 10 is subtracted from this quantity, yielding a uniform deviate over the
    domain −10 to 10 (i.e., U(−10, 10)). This uniform deviate is added to each concentration
    measurement to produce a jittered concentration and is graphed in Display 3.21.
    Two statements are included with the final SGPLOT, XAXIS, and YAXIS to further
    customize the graph. (For more information about customizing graphs, see Chapter
    6.)'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Display 3.21 Scatter plot of total number of young versus nitrofen concentration
    in each brood with jittered concentration


    ![](img/26474180ee55914c13fb9156a7678157_119_0.png)


    Jittering in the x direction of the nitrofen concentration variable reduces the
    number of hidden observations. You can further reduce the number of hidden observations
    by jittering the TOTAL variable in the y direction. Try this at home: See whether
    you can produce a plot that is jittered in both the x and y directions.


    # 3.8.1 Comparing distributions of responses between multiple groups


    The bar chart in Display 3.16, the dot plot in Display 3.17, and the scatter plot
    in Display 3.19 give a sense of how the distribution of total young changes when
    the nitrofen concentration increases. Box plots might be easier to understand
    and are easy to construct. The minimum, first quartile (25th percentile), median,
    third quartile (75th percentile), and maximum (the so-called five-number summary)
    are graphically displayed in a box plot. To produce box plots using PROC SGPLOT,
    VBOX or HBOX statements can be used. To construct side-by-side box plots for the
    nitrofen data set, the following code is used:'
  merge: -1
  img_proc: true
- pgno: 120
  md: "```\nproc sgplot data=nitro_tox;\n ybox total / category=conc;\n xaxis label\
    \ = \"Nit rofen concentration\";\n yaxis label = \"Number of young (3 broods)\"\
    ;\n run;\n```\n\nThe results of this code are shown in Display 3.22. The box is\
    \ defined by the first quartile (25th percentile), median, and third quartile\
    \ (75th percentile) with whiskers extending from the third quartile to the maximum\
    \ value, and from the first quartile to the minimum value. (Variations of this\
    \ construction are available. See the Help documentation.) The diamond in the\
    \ center of the box indicates the location of the mean total number of young for\
    \ each nit rofen concentration.\n\n# Display 3.22 Side-by-side box plots for the\
    \ young produced in different nit rofen concentrations\n\n![](img/26474180ee55914c13fb9156a7678157_120_0.png)"
  merge: -1
  img_proc: true
- pgno: 121
  md: "# 3.9 Summarizing Categorical Variables\n\nCategorical data are often summarized\
    \ by frequency or relative frequency of responses for levels of each categorical\
    \ variable, or for combinations of levels of categorical variables. A table of\
    \ the frequency of one variable can be used to check the integrity of data entry.\
    \ For example, there should be 10 animals in the five concentration groups. The\
    \ following code to check data integrity uses PROC FREQ, which produces the table\
    \ in Display 3.23:\n\n```\nproc freq data=nitro_tox;\n    table conc;\nrun;\n\
    ```\n\nYou can see that the five levels of nitrofen concentration were entered\
    \ correctly (i.e., CONC=0, 80, 160, 235, and 310, as expected). There are 10 observations\
    \ recorded for each concentration.\n\n# Display 3.23 Number of observations in\
    \ each nitrofen concentration\n\n| conc | Frequency | Percent | Cumulative Frequency\
    \ | Cumulative Percent |\n|------|-----------|---------|----------------------|--------------------|\n\
    | 0    | 10        | 20.00   | 10                   | 20.00              |\n|\
    \ 80   | 10        | 20.00   | 20                   | 40.00              |\n|\
    \ 160  | 10        | 20.00   | 30                   | 60.00              |\n|\
    \ 235  | 10        | 20.00   | 40                   | 80.00              |\n|\
    \ 310  | 10        | 20.00   | 50                   | 100.00             |\n\n\
    The responses of individuals to two or more categorical variables are often displayed\
    \ in contingency tables. In the case of two categorical variables, one variable\
    \ labels the rows. The other variable labels the columns. The contingency table\
    \ displays the counts of observations at each combination of row and column values.\
    \ The following code requests a contingency table in which nitrofen levels are\
    \ displayed as rows (CONC) and the presence of young in a third brood (CBROOD3)\
    \ are displayed as columns (a two-level categorical variable). Table output is\
    \ modified to display only row percentages. (The NOCOL and NOPCT options suppress\
    \ the printing of column and joint percentages, respectively.) Statistical tests\
    \ are requested to see whether the probability of young being produced in the\
    \ third brood is the same for the other broods (CHISQ and EXACT options), and\
    \ whether a concentration-related trend exists in the probability (TREND option).\
    \ The following partial code produces the output in Display 3.24:"
  merge: -1
  img_proc: true
- pgno: 122
  md: "```\n```sas\nproc freq data=nitro_tox;\n  table conc*cbrood3 / noperct nocol\
    \ chisq trend exact;\nrun;\n```\n```\n\n# **Display 3.24** Contingency table displaying\
    \ nitrogen concentration and whether any young are produced in the third brood\n\
    \nThe FREQ Procedure\n\nTable of conc by cbrood3\n\nconc (Nitrofen concentration)\n\
    \n| Frequency / Row Pct | none | some | Total |\n|---|---:|---:|---:|\n| 0 | 0<br>0.00\
    \ | 10<br>100.00 | 10 |\n| 80 | 0<br>0.00 | 10<br>100.00 | 10 |\n| 160 | 0<br>0.00\
    \ | 10<br>100.00 | 10 |\n| 235 | 1<br>10.00 | 9<br>90.00 | 10 |\n| 310 | 10<br>100.00\
    \ | 0<br>0.00 | 10 |\n| Total | 11 | 39 | 50 |\n\n*(continued)*"
  merge: -1
  img_proc: true
- pgno: 123
  md: "# Display 3.24 (continued)\n\nStatistics for Table of conc by cbrood3\nStatistic\t\
    DF\tValue\tProb\nChi-Square\t4\t44.7552\t<.0001\nLikelihood Ratio Chi-Square\t\
    4\t46.1891\t<.0001\nMantel-Haenszel Chi-Square\t1\t24.5782\t<.0001\nPhi Coefficient\t\
    \t0.9461\nContingency Coefficient\t\t0.6873\nCramer's V\t\t0.9461\nWARNING: 50%\
