  md: "# 11.12 Exercises\n\n+   1. Use SAS/IML to perform a randomization test on\
    \ the packaging and log-bacterial growth data.³ In this problem, you have n₁=n₂=n₃=n₄=3.\
    \ Use a statistic that measures the difference in the four group means. For example:\n\
    +   \n+   $$CSS = \\sum_{i=1}^{4} (\\bar{Y}_i - \\bar{Y})^2$$\n+   \n+   $\\bar{Y}_i$\
    \ is the arithmetic mean of the iᵗʰ group. $\\bar{Y}$ is the mean of all of the\
    \ observations. Note: This is a redo of a Chapter 9 exercise.\n\n+   2. Write\
    \ a SAS/IML module to conduct a small Monte Carlo simulation that shows how the\
    \ CI for the mean performs (e.g. coverage probability properties) when estimating\
    \ the mean of an exponential distribution. Recall that the formula for a confidence\
    \ interval for a population mean is\n+   \n+   $$\\bar{Y} \\pm t(1-\\alpha/2,\\\
    ,n-1)\\, s/\\sqrt{n}$$\n+   \n+   Select at least three values of n for this illustration\
    \ (say, n=15, 30, and 50).\n+   \n+   Hint: You can generate exponential random\
    \ variables a few different ways in SAS/IML. You can use randgen with exponential\
    \ to specify a standard exponential (mean=1), and then multiply these deviates\
    \ by lambda to get a random exponential (mean=lambda). The following code generates\
    \ 20 random deviates from an exponential distribution with mean=6:\n\n```\nproc\
    \ iml;\n    lambda = 6;\n    mydevs = J(20,1,0);  * initialize vector to contain\
    \ deviates;\n    call randseed(9753);\n    call randgen(mydevs,'exponential');\n\
    \    mydevs = 6*mydevs;\n\n    mean_dev = sum(mydevs)/nrow(mydevs);\n\n    print\
    \ mean_dev;\nquit;\n```"
  merge: -1
