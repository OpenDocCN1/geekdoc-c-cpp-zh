  md: '# Acknowledgments


    As with any book, there are many people who deserve recognition for their influence.
    These folks are usually too numerous to mention by name, and there is always the
    danger of leaving one out. Even though I recognize this danger, I’m attempting
    to recognize a subset of these people. My sense of good programming style evolved
    through formal courses and the informal influence of seasoned programmers. I hope
    that my former programming mentors and instructors who helped me navigate early
    encounters with Fortran, Ratfor, Pascal, Speakeasy, … will be pleased to read
    that I did pay attention to some of their advice.


    Contributions to an external program review by Walter Piegorsch led to the introduction
    of the statistical programming course at Miami University and, consequently, to
    course notes and this book. Walter is an outstanding writer, and my experience
    working with him on two books was great background to have before writing this
    book. Maura Stokes encouraged me to pitch the idea of such a book to SAS Press,
    and, to my great surprise and delight, I was encouraged to work on this book.


    This book was subjected to an extensive review by technical reviewers at SAS,
    as well as external reviewers recruited by SAS Press. I thank the reviewers for
    their careful work. This review process was incredibly rigorous and exhaustive,
    and the book improved as a direct result. Bob Rodriguez at SAS helped shape the
    presentation of SAS ODS Graphics and traditional graphics, while Kathy Roggenkamp
    of the University of North Carolina at Chapel Hill provided invaluable suggestions
    on complete drafts of this book.


    My primary contact at SAS Press, John West, has been encouraging and supportive,
    and his help bringing this book to closure is much appreciated. Staff members
    from SAS Publications have done an outstanding job in translating a manuscript
    into a beautifully formatted final book. I appreciate the efforts of all including
    Amy Wolfe (copyediting), Candy Farrell (formatting the book and implementing corrections),
    Patrice Cherry (designing the front cover), Jennifer Dilley (designing the back
    cover), Mary Beth Steinbach (Managing Editor), Stacey Hamilton (Marketing), and
    Shelly Goodin (Marketing).


    I owe a debt of gratitude to multiple cohorts of STA 402/502 students at Miami
    University. They helped shape my thinking about what a good course in statistical
    programming should include and how it should flow. My colleagues at Miami University
    have been patient with my countless intrusions into their offices to describe
    the latest cool thing that I discovered. (It is amazing what you learn when writing
    a book or teaching a'
