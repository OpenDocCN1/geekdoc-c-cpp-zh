- pgno: 391
  md: "The functions SYMPUT, SYMPUTX, and SYMGET are useful. The SYMPUT and SYMPUTX\
    \ functions can be used to assign a SAS variable value to a macro variable. The\
    \ SYMGET function assigns a macro variable value to a SAS variable.\n\n+   SYMPUT:\
    \ SAS variable value→Macro variable\n+   SYMPUTX: SAS variable value→Macro variable\n\
    +   SYMGET: SAS variable←Macro variable value\n\nSYMPUTX is similar to SYMPUT,\
    \ although it also removes leading and trailing blanks. Display 10.18 provides\
    \ a program in which macro variables &MBROOD1, &MBROOD2, &MBROOD3, and &MTOTAL\
    \ are constructed from the variable BROOD and the index variable I. A %DO loop\
    \ over these variables generates separate plots of the number of young versus\
    \ concentration for each of the broods.\n\n# Display 10.18 SYMPUT function in\
    \ a macro\n\n```\ndata nitrofen;\n infile 'C:\\Users\\baileraJ.IT\\Desktop\\ch2-dat.txt'\
    \ firstobs=16\n expandtabs misssover pad;\n input @9 animal 2.\n @17 conc 3.\n\
    \ @25 brood1 2.\n @33 brood2 2.\n @41 brood3 2.\n @49 total 2.;\n run;\n\ndata\
    \ test; set nitrofen;\n brood=1; conc=conc; nyoung=brood1; output;\n brood=2;\
    \ conc=conc; nyoung=brood2; output;\n brood=3; conc=conc; nyoung=brood3; output;\n\
    \ run;\n\n%macro threeeqs;\n proc sort data=test out=test;\n by brood;\n run;\n\
    \ %do i=1 %to 3;\n data _null_;\n set test;\n if brood=&i then do;\n &MBROOD&i\
    \ = nyoung;\n &MTOTAL = total;\n end;\n end;\n run;\n %end;\n %do i=1 %to 3;\n\
    \ proc gplot data=test;\n plot nyoung*conc = brood;\n where brood=&i;\n run;\n\
    \ %end;\n%mend;\n%threeeqs;\n run;\n```\n\n> 1 Nitrofen data set from Bailer,\
    \ A. John., and James T. Oris. 1994. \"Assessing Toxicity of Pollutants in Aquatic\
    \ Systems.\" Chapter 2 in Case Studies in Biometry, Nicholas Lange, Louise Ryan,\
    \ Lynne Billard, David Brillinger, Loveday Conquest, Joel Greenhouse, eds. New\
    \ Jersey: John Wiley & Sons, Inc. Reprinted with permission of John Wiley & Sons,\
    \ Inc."
