- pgno: 83
  md: "# Display 2.38 Table comparing merges of data sets using the DATA step with\
    \ joins of data sets using PROC SQL\n\n| Location of CITY | DATA Step | PROC SQL\
    \ |\n|---|---|---|\n| Either in the weather or demography data set | data in_either;\n\
    merge\n  SMSA_subset_weather2 (in=in1)\n  SMSA_subset_demog2 (in=in2);\nby city;\n\
    weather2_in = in1;\ndemog2_in = in2;\nrun; | proc sql;\ntitle \"FULL OUTER JOIN\"\
    ;\nselect coalesce(w.city, d.city),\n  JanTemp, JulyTemp, Education, income\n\
    from\n  SMSA_subset_weather2 as w\nfull join\n  SMSA_subset_demog2 as d\non w.city=d.city;\n\
    quit; |\n| In both the weather and demography data sets | data in_both;\nset in_either;\n\
    if weather2_in=1 and demog2_in=1;\nrun; | proc sql;\ntitle \"INNER JOIN\";\nselect\n\
    \  w.city, JanTemp, JulyTemp, Education, income\nfrom\n  SMSA_subset_weather2\
    \ as w,\n  SMSA_subset_demog2 as d\nwhere\n  w.city=d.city;\nquit; |\n| In weather\
    \ data set | data in_weather;\nset in_either;\nif weather2_in=1;\nrun; | proc\
    \ sql;\ntitle \"LEFT OUTER JOIN\";\nselect coalesce(w.city, d.city),\n  JanTemp,\
    \ JulyTemp, Education, income\nfrom\n  SMSA_subset_weather2 as w\nleft join\n\
    \  SMSA_subset_demog2 as d\non w.city=d.city;\nquit; |\n| In demography data set\
    \ | data in_demog;\nset in_either;\nif demog2_in=1;\nrun; | proc sql;\ntitle \"\
    RIGHT OUTER JOIN\";\nselect coalesce(w.city, d.city),\n  JanTemp, JulyTemp, Education,\
    \ income\nfrom\n  SMSA_subset_weather2 as w\nright join\n  SMSA_subset_demog2\
    \ as d\non w.city=d.city;\nquit; |\n\nFrom this table, you can see that an inner\
    \ join is equivalent to a merge that requires observations to be in both data\
    \ sets. A full outer join is equivalent to the default merge in which observations\
    \ are included if they are in either or both of the data sets. The left or right\
    \ outer join is equivalent to a merge with specified restrictions about whether\
    \ an observation is included from the first or second data set in a merge.\n\n\
    There are times when you are interested in the complete Cartesian product of the\
    \ observations in two data sets (i.e., all rows from one data set paired with\
    \ all rows from another data set). Consider a toy example in which you want to\
    \ enumerate the sample"
