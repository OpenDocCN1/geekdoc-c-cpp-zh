    # 10.5 Conditional Execution, Looping, and Macros


    The %LET macro statement can be used anywhere in a program in open code. Other
    macro statements, such as %DO and %END and %IF and %THEN, can be used only in
    the context of a defined macro. A macro is a collection of commands that are evaluated
    by the macro processor. The general construction of a macro involves declaring
    the macro and any variables that might be passed to it, specifying the statements
    that are to be invoked in the macro, and closing with a statement that indicates
    the end of the macro. A macro program looks like the following:


    ```

    %macro prog-name;

    <text line1

    <text line2

    <text line3>

    <...>

    %mend prog-name;

    ```'
