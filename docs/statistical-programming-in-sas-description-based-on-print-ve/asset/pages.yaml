    # 2.2.6 Reading SPSS data files—the little SPSS engine that could


    The IMPORT procedure previously described can be used to read an SPSS data set
    using the DBMS=SPSS option. Or, you can specify a LIBNAME statement with the SPSS
    engine. Because this information parallels information in the previous section,
    the proof that this works is left to the reader. (I always wanted to write this
    in a paper or report.)


    # 2.3 Writing Out a File or Making a Simple Report


    This chapter started with an emphasis on getting data into SAS. The next section
    discusses producing an analysis data set and changing it by adding observations
    (concatenating data sets or adding rows to a data set) and adding variables (merging
    data sets or adding columns to a data set). This section talks about how some
    of the ideas used for creating a SAS data set from an external file can be inverted
    to write or create a data set for analysis by other programs or to construct a
    simple report.


    The PUT statement can be thought of as the output analog of the INPUT statement.
    It specifies how the values of variables, text, etc. should be written. If a filename
    is specified, then the PUT statement writes to this location. If it is not, then
    the PUT statement writes to the SAS log. The PUT statement is used to echo the
    values of all of the variables in a SAS data set. The _NULL_ data set is used
    to allow for DATA step programming without storing a data set. The _ALL_ specification
    selects all variables for display. Alternative specifications such as _NUMERIC_
    or _CHARACTER_ select all variables corresponding to the data type. The following
    statement writes the text string - 50 times:


    ```

    put 50*''-'';

    ```


    The code for echoing the contents of the nitrofen data set is shown in Display
    2.14. The SAS log messages are shown in Display 2.15.'
  merge: -1
  img_proc: true
- pgno: 55
  md: "# Display 2.14 Echoing the values of variables in a data set using a PUT statement\n\
    \n```\nlibname myfiles \"C:\\Users\\baileraj.IT\\BAILERAJ\\Classes\\Web-CLASSES\\\
    sta402\\data\";\n\nproc sort data=myfiles.nitrofen;\n  by conc;\nrun;\n\ndata\
    \ _null_; set myfiles.nitrofen; by conc;\n  if FIRST.CONC then do; * first observation\
    \ in concentration group;\n    put 50*\"-\";           * add separator line of\
    \ 50 dashes + column headings;\n    put \"Animal\" @10 \"Conc\" @20 \"Total\"\
    \ @30 \"First?\" @40 \"Last?\";\n  end;\n  put animal @10 conc @20 total @30 FIRST.CONC\
    \ @40 LAST.CONC;\n\n* put _all_;  /* useful to check values during input */\n\
    run;\n```\n\nIn addition to producing a report, Display 2.14 introduces two indicator\
    \ variables that are useful when manipulating sorted data sets—FIRST.VARNAME and\
    \ LAST.VARNAME, where VARNAME is the name of a SAS variable that is used to sort\
    \ a data set. These two indicator variables were defined when the contents of\
    \ the nitrofen data set were added to the _NULL_ data set using BY CONC (FIRST.CONC\
    \ and LAST.CONC). These variables indicate whether the current observation is\
    \ the first or last observation for each level of the BY variable CONC. As you\
    \ can see in Display 2.15, the first observation in the CONC=0 condition—animal\
    \ 1—has FIRST.CONC=1 (TRUE) and LAST.CONC=0 (FALSE). Animals 2 through 9 have\
    \ FIRST.CONC=0 and LAST.CONC=0. The last observation in the CONC=0 condition—animal\
    \ 10—has FIRST.CONC=0 and LAST.CONC=1. This program writes a separation line of\
    \ dashes and column headings if it is the first animal in a concentration group\
    \ (i.e., when FIRST.CONC=1). The @# specifies that the variable value or column\
    \ heading is to be printed starting at column #.\n\n# Display 2.15 SAS log with\
    \ the echo of the nitrofen variable values\n\nAnimal  Conc  Total  First?  Last?\n\
    1       0     77     1       0\n2       0     83     0       0\n...     ...  \
    \ ...    ...     ...\n9       0     74     0       0\n10      0     81     0 \
    \      1\n...\nAnimal  Conc  Total  First?  Last?\n41      310   6      1    \
    \   0\n42      310   6      0       0\n...     ...   ...    ...     ...\n49  \
    \    310   6      0       0\n50      310   5      0       1"
  merge: -1
  img_proc: true
- pgno: 56
  md: "The SAS log confirms that the folder containing nitrofen.sas7bdat was correctly\
    \ identified in the LIBNAME path:\n\n```\nNOTE: Libref MYFILES was successfully\
    \ assigned as follows:\nEngine:          V9\nPhysical Name: C:\\Users\\baileraj.IT\\\
    BAILERAJ\\Classes\\\n                 Web-CLASSES\\sta402\\data\n```\n\nThe PUT\
    \ statement can be used to create simple customized reports. In the program in\
    \ Display 2.16, the nitrofen data are read from an external source and written\
    \ to a text file with an annotation. The nitrofen data are first sorted by concentration,\
    \ and then added to the _NULL_ data set by concentration. From the previous example,\
    \ BY CONC creates internal SAS variables FIRST.CONC and LAST.CONC, which are true\
    \ when an observation is the first or last observation, respectively, within a\
    \ group. Thus, the statements in the DO-END block are executed when FIRST.CONC\
    \ is TRUE:\n\n```\nput 6*' +-----' '+';\nput 'Conc = ' conc /\n    @1 'Brood 1'\
    \  @10 'Brood 2'  @20 'Brood 3' @30 'TOTAL' /\n    @1 '-------'  @10 '-------'\
    \  @20 '-------' @30 '------';\n```\n\nIn the program, the condition is true if\
    \ the observation being processed corresponds to the first animal in a concentration\
    \ group. In this case, a divider of the form +-----+-----+-----+... +-----+ is\
    \ written, along with variable labels and underlines for the labels. Where values\
    \ are written is controlled by the @n specification, which moves the output pointer\
    \ to the nth column before writing. The values of the variables are written following\
    \ the specified format:\n\n```\nput @5 brood1 3. @14 brood2 3. @24 brood3 3. @32\
    \ total 3.;\n```\n\nThe value of BROOD1 is written starting at column 5 with a\
    \ fixed formatted width of 3 columns. Other output locations and formats are similarly\
    \ specified. A second DATA _NULL_ block is specified to write a note at the bottom\
    \ of the file. The FILE specification in this block includes the MOD option, which\
    \ declares that any PUT activity will be appended to the end of the text file.\
    \ If the MOD option had been omitted, then the entire text file would have been\
    \ overwritten with the last line."
