    While you know that 58.33% of independent rolls of two balanced six-sided dice
    should result in a sum of pips on the face of the dice that is 7 or greater (21/36
    rolls result in this event), you observe this event in 58.60% of the 6000 simulations.


    Other routines and functions worth exploring include the RANPERM routine for generating
    a permutation of arguments. This routine can be used for constructing randomization
    and permutation tests. Preview of coming attractions: Could you use the RANPERM
    routine to recode the randomization test example from Chapter 9?


    # 8.12 Summary


    This chapter is a transition from using built-in procedures to constructing your
    own customized solutions. Formatting and representing data values are discussed
    at the start. Using formulas and recoding variables follow. Pseudocoding and modules
    are used to describe writing user-defined programs. These programs are fleshed
    out in a series of case studies. SAS functions related to probability distributions
    are discussed to close out this chapter.'
