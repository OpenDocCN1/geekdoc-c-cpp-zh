    # 7.6 Summary


    This chapter emphasized traditional SAS graphics and customizing their graphical
    displays. Other manipulations were presented. The chapter closed with a glance
    into the SAS world of mapping. There is much more to be explored in graphical
    displays in SAS/GRAPH software. If you are interested in contour plots and three-dimensional
    plots, then you should explore GCONTOUR and G3D. If you are interested in learning
    more about map displays, then dig into the SAS mapping procedures, including SAS/GIS
    software.


    Overviews of ODS Graphics and traditional SAS graphics were presented in Chapters
    6 and 7, respectively. You can find additional information about traditional SAS
    graphics'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'and ODS Graphics in SAS/GRAPH 9.2: Reference. The appearance of traditional
    graphics is controlled by GOPTIONS, and graphs are displayed in graph windows
    and can be saved in SAS graphics catalogs. In contrast, the appearance of ODS
    Graphics is controlled by templates and options in the ODS GRAPHICS statement.
    ODS Graphics are displayed in ODS destinations and can be saved in a variety of
    file formats. Annotate data sets are used for customizing graphs produced by traditional
    SAS graphics. The ODS Graphics Editor is used for customizing graphs produced
    by ODS Graphics, and the GTL can be used for permanent modifications.


