- pgno: 227
  md: "A *template* is a program that contains the instructions for creating a graph.\
    \ These instructions are written in the Graph Template Language (GTL) and are\
    \ compiled with PROC TEMPLATE. For more information, see the *SAS/GRAPH: Graph\
    \ Template Language User’s Guide, Second Edition*, and Kuhfeld (2009). In addition,\
    \ Kuhfeld (2010) has a more recent book that addresses the richness of GTL and\
    \ statistical graphics procedures. A description of the extensive changes that\
    \ can be made to a template is beyond the scope of a statistical programming text.\
    \ However, this example should give you a taste.\n\nThe first step is to locate\
    \ the template that was used to produce the graph. You can use the ODS TRACE statement\
    \ as follows:\n\n```\nods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\Desktop\\\
    fig6p2.rtf\";\nods trace on;\nods graphics on;\nproc reg data=cubic plots(only)=RESIDUALHISTOGRAM;\n\
    \    model response = x;\nrun;\nods graphics off;\nods trace off;\nods rtf close;\n\
    ```\n\nThe output of this statement identifies the template for this residual\
    \ histogram.\n\n```\nOutput Added:\n------------\nName:        ResidualHistogram\n\
    Label:       Residual Histogram\nTemplate:    Stat.REG.Graphics.ResidualHistogram\n\
    Path:        Reg.MODEL1.ObswiseStats.response.DiagnosticPlots.ResidualHistogram\n\
    ------------\n357 ods graphics off;\n358 ods trace off;\n359 ods rtf close;\n\
    ```\n\nThis edited portion of the output in the SAS log indicates that **Stat.REG.Graphics.ResidualHistogram**\
    \ is the template.\n\nThe contents of this template can be displayed using the\
    \ following code:\n\n```\nproc template;\n    source Stat.REG.Graphics.ResidualHistogram;\n\
    run;\n```"
  merge: -1
  img_proc: true
- pgno: 228
  md: "The output is shown in Display 6.10.\n\n# Display 6.10 Stat.REG.Graphics.ResidualHistogram\
    \ template\n\n```\ndefine statgraph Stat.REG.Graphics.ResidualHistogram;\n   \
    \ notes \"Residual Histogram\";\n    dynamic _DEPName _MODELlabel;\n    BeginGraph;\n\
    \        entrytitle halign=left textattrs=GRAPHVALUETEXT _MODELlabel\n       \
    \     halign=center textattrs=GRAPHTITLETEXT\n            \"Distribution of Residuals\"\
    \ \" for \" _DEPName;\n        layout overlay /\n            xaxisopts=(label=\"\
    Residual\")\n            yaxisopts=(label=\"Percent\");\n            histogram\
    \ RESIDUAL / primary=true;\n            densityplot RESIDUAL / name=\"Normal\"\
    \ legendlabel=\"Normal\"\n                lineattrs=GRAPHFIT;\n            densityplot\
    \ RESIDUAL / kernel () name=\"Kernel\"\n                legendlabel=\"Kernel\"\
    \n                lineattrs=GRAPHFIT2;\n            discretelegend \"Normal\"\
    \ \"Kernel\" / across=1 location=inside\n                autoalign=(topright topleft\
    \ top);\n        endlayout;\n    EndGraph;\nend;\n```\n\nThe x-axis and y-axis\
    \ changes involve changing xaxisopts and yaxisopts, which are options of the layout\
    \ overlay statement. Using this template, modify the xaxisopts label. Add a range\
    \ of x-axis values (viewmin and viewmax) with three tick values specified (tickvaluelist)\
    \ and two variables to add some space on each end of the x-axis (offsetmin and\
    \ offsetmax). After you modify a template, you need to compile it with PROC TEMPLATE\
    \ as shown in Display 6.11. Then, you can produce the new graph by rerunning your\
    \ original program. The modified template is saved in Sasuser, and it is accessed\
    \ each time you run your program. For more information about managing templates,\
    \ see Chapter 21 of the SAS/STAT User's Guide. This example is simple to describe,\
    \ but hardcoding the axis tick values is not realistic in practice because tick\
    \ values are data-dependent in nature. More realistic examples of persistent modifications\
    \ include changing the title or removing the normal curve. Try this at home: Change\
    \ the template to remove the normal density curve and update the title."
  merge: -1
  img_proc: true
- pgno: 229
  md: "# Display 6.11 Modifications to Stat.REG.Graphics.ResidualHistogram template\n\
    \n```\nproc template;\ndefine statgraph Stat.REG.Graphics.ResidualHistogram;\n\
    \    notes \"Residual Histogram\";\n    dynamic _DEPNAME _MODELLABEL;\nBeginGraph;\n\
    \    entrytitle halign=left textattrs=GRAPHVALUETEXT _MODELLABEL\n        halign=center\
    \ textattrs=GRAPHTITLETEXT\n        \"Distribution of Residuals\" \" for \" _DEPNAME;\n\
    \    layout overlay / xaxisopts=(label=\"Residual\"\n                        linearoopts=(viewmin=-10\
    \ viewmax=10\n                                    tickvaluelist=(-10 0 10))\n\
    \                        offsetmin=0.1 offsetmax=0.1)\n                    yaxisopts=(label=\"\
    Relative Frequency (%)\");\n        referenceLine x=0;\n        histogram RESIDUAL\
    \ / primary=true;\n        densityplot RESIDUAL / name=\"Normal\" legendlabel=\"\
    Normal\"\n            lineattrs=GRAPHFIT;\n        densityplot RESIDUAL / kernel()\
    \ name=\"Kernel\"\n            legendlabel=\"Kernel\"\n            lineattrs=GRAPHFIT2;\n\
    \        discretelegend \"Normal\" \"Kernel\" / across=1 location=inside\n   \
    \         autoalign=(topright topleft top);\n    endlayout;\nEndGraph;\nend;\n\
    \nods rtf bodytitle style=SCIENCE file=\"C:\\users\\baileraj.IT\\Desktop\\fig6p11.rtf\"\
    ;\nods graphics on;\nproc reg data=cubic plots(only)= RESIDUALHISTOGRAM;\n   \
    \ model response = x;\nrun;\nods graphics off;\nods rtf close;\n```\n\nThe histogram\
    \ is shown in Display 6.12."
  merge: -1
  img_proc: true
- pgno: 230
  md: "# Display 6.12 Residual histogram based on the modified template\n\n![](img/26474180ee55914c13fb9156a7678157_230_0.png)\n\
    \nThis modified template is applied until it is altered. To restore the template\
    \ to its original settings, delete the template with PROC TEMPLATE.\n\n```\nproc\
    \ template;\n    delete Stat.REG.Graphics.ResidualHistogram;\nrun;\n```\n\nThis\
    \ introduction gives you a flavor of what is needed to modify templates. If you\
    \ want more, dig into the GTL documentation.\n\nThe information so far applies\
    \ to graphs produced automatically and in context by statistical procedures that\
    \ are enabled to use ODS Graphics. Let’s discuss ways to create stand-alone graphs\
    \ (either for data or for special customized statistical displays) with the new\
    \ Statistical Graphics (SG) procedures in SAS/GRAPH software. These procedures\
    \ use the same underlying ODS Graphics functionality."
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 6.5 Statistical Graphics—Entering the Land of SG Procedures


    SAS/GRAPH software in SAS 9.2 includes a set of new SG procedures including SGPLOT,
    SGPANEL, and SGSCATTER. With these new procedures, complex displays can be produced
    with a small number of statements. SG procedures require that the ODS destination
    be specified before you invoke the procedure. While you do not need to specify
    ODS GRAPHICS ON when you use SG procedures, there are options in the ODS GRAPHICS
    ON statement that do apply to SG procedures. These options are described in Chapter
    21 of the SAS/STAT User’s Guide. SAS documentation provides a fundamental reference
    for using SG procedures. Rodriguez (2009) and Schwartz (2009) provide nice overviews
    of these procedures and kick-start their use.


    The SGPLOT procedure enables you to construct one or more plots displayed on the
    same axis. As you might have inferred from previous chapters, the SGPLOT procedure
    is used for graphic displays of univariate and bivariate data. Displays include
    scatter plots with superimposed smooth fits (e.g., with LOESS), histograms with
    a superimposed density curve, time series plots, bar charts, box plots, and so
    on. Display 6.13 provides an analysis related to fitting a linear regression model
    to predict manatee deaths as a function of motorboats registered in Florida.¹
    Display 6.13 uses one PROC SGPLOT invocation to produce a scatter plot of manatee
    deaths versus number of motorboats registered with superimposed linear regression
    and LOESS fits. It uses a second PROC SGPLOT invocation to produce a scatter plot
    of the residuals versus the predictor variable with a superimposed LOESS smooth.'
  merge: -1
  img_proc: true
- pgno: 232
  md: "# Display 6.13 Using PROC SGPLOT to analyze the residuals from fitting linear\
    \ regression model\n\n```\ndata manatee_deaths;\n    input year nboats manatees\
    \ @@;\n    datalines;\n77 447 13  78 460 21   79 481 24   80 498 16\n81 513 24\
    \  82 512 20   83 526 15   84 559 34\n85 585 33  86 614 33   87 645 39   88 675\
    \ 43\n89 711 50  90 719 47\n;\n\nods rtf bodytitle file=\"C:\\Users\\baileraj.IT\\\
    Desktop\\manatee-plots.rtf\";\nproc reg data=manatee_deaths;\n    title '# Manatees\
    \ killed regressed on the number of boats registered (FL)';\n    model manatees\
    \ = nboats;\n    output out=regress r=resid;\nrun;\n\nproc sgplot data=manatee_deaths;\n\
    \    title2 \"residual plot from the linear model fit\";\n    regression x=nboats\
    \ y=manatees;\n    loess x=nboats y=manatees;\nrun;\n\nproc sgplot data=regress;\n\
    \    title2 \"plot residuals vs. predictor variable (loess fit)\";\n    loess\
    \ x=nboats y=resid;\nrun;\nods rtf close;\n```\n\nIn Display 6.14, the linear\
    \ regression fit and LOESS fit are very similar. Another key element of PROC SGPLOT\
    \ is in this display—the statements in PROC SGPLOT each produce a layer that is\
    \ combined in a single graph."
  merge: -1
  img_proc: true
