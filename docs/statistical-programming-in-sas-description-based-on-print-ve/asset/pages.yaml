- pgno: 158
  md: "ODS commands exist to enumerate all of the tables and output objects produced\
    \ by a procedure. And, ODS commands exist to select output objects. A list of\
    \ ODS table names is included as part of PROC REG in the SAS online documentation.\
    \ For example, in the SAS online documentation for PROC REG, the ODS tables produced\
    \ by PROC REG are listed with short descriptions and options.\n\n# Display 4.18\
    \ ODS tables produced by PROC REG\n\n| ODS Table Name | Description | Statement\
    \ | Option |\n|---|---|---|---|\n| ACovEst | Consistent covariance of estimates\
    \ matrix | MODEL | ALL, ACOV |\n| ACovTestANOVA | Test ANOVA using ACOV estimates\
    \ | TEST | ACOV (MODEL statement) |\n| ANOVA | Model ANOVA table | MODEL | default\
    \ |\n| FitStatistics | Model fit statistics | MODEL | default |\n| ... (deleted)\
    \ |  |  |  |\n| NObs | Number of observations |  | default |\n| ... (deleted)\
    \ |  |  |  |\n| OutputStatistics | Output statistics table | MODEL | ALL, CLI,\
    \ CLM, INFLUENCE, P, R |\n| PartialData | Partial regression leverage data | MODEL\
    \ | PARTIALDATA |\n| ParameterEstimates | Model parameter estimates | MODEL |\
    \ default |\n| ... (deleted) |  |  |  |\n\nThe ODS TRACE statement enables you\
    \ to see all of the names of the output objects produced. ODS SELECT and ODS EXCLUDE\
    \ enable you to select output objects. ODS TRACE lists all of the output objects\
    \ produced by statements in a particular program. By default, this information\
    \ is listed in the SAS log. Or, you can list output objects in the SAS Output\
    \ Window using ODS TRACE with the ON /LISTING option.\n\n```\nods trace on /listing;\n\
    proc reg;\n  model y = x;\nrun;\nods trace off;\n```\n\nThis code generates the\
    \ output shown in Display 4.19."
  merge: -1
  img_proc: true
