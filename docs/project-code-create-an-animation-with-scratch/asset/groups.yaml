    +   \n+   **真** 14, 17, 18, 19\n\n# 答案\n\n**第 5 页**  *《超级无敌掌门狗》*系列电影是使用一种叫“定格动画”的技术制作的。制作中会使用黏土模型，影片一帧（也就是一幅画面）一帧地拍摄。每帧之间模型只移动一点点，因此当这些帧连续播放时，模型看起来就像在动。\n\
    \n**第 6 页**  二进制卡片 0011 = 3\n\n**第 7 页**  鲨鱼障碍赛道中的错误是第三条指令（第二个向上箭头）。\n\n**第 24\
    \ 页**  输入姓名和滑动触摸屏都是输入。显示消息和打印图片都是输出。\n\n**第 29 页**  bug 出在第一个“面向方向”积木上。它应该是 90，而不是\
    \ 0。\n\n# 项目代码\n\n# 用 Scratch 创建动画\n\n你已经了解使用 Scratch 的基础知识了吗？\n本书将帮助你在这些技能的基础上进一步拓展，创作出酷炫的动画。利用现成的代码积木，尝试完成这些简单项目，以深化你的\
    \ Scratch 知识，并享受创作的乐趣。你可以直接使用这些代码，也可以随兴修改，或者把它当作灵感来源——一切由你决定！\n\n**项目代码**是一套系列丛书，支持国家课程中计算机编程这一重要的\
    \ STEAM 技能。\n\n![](img/0db0bd1c1343c511fdd2e24659c41ae8_39_0.png)\n\n![](img/0db0bd1c1343c511fdd2e24659c41ae8_39_1.png)\n\
