  - '[PAGE 21]


    # WHAT''S AN OPERATOR?


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_21_0.png)


    Data is any collection of information, such as numbers or measurements. Different
    types of operators control how the computer uses the data.


    Some maths operators are:

    add +, subtract -,

    multiply x and divide ÷

    Some comparison operators are:

    less than <, greater than >

    and equal to =

    Logic operators are:

    AND, OR and NOT.


    # Logic operators


    The answer to ‘am I hungry?’ is either ‘yes’ (true) or ‘no’ (false). What if you
    wanted to know ‘am I hungry and is it lunchtime?’. Logic operators are used in
    coding because they test for more than one thing at a time, using the words AND
    and OR.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_21_1.png)


    # AND logic


    AND logic tests to see if the answer to more than one question is true. For example:
    IF hungry AND lunchtime THEN eat.


    Each condition (question), is still either true or false, but the result of the
    combined test - whether we are hungry AND it is lunchtime - is also either true
    or false.


    The AND logic works like this:

    Hungry (true) AND lunchtime (true)

    = true (eat)

    Hungry (true) AND NOT lunchtime (false)

    = false (don’t eat)

    NOT hungry (false) AND lunchtime (true)

    = false (don’t eat)

    NOT hungry (false) AND NOT lunchtime (false)

    = false (don’t eat)'
