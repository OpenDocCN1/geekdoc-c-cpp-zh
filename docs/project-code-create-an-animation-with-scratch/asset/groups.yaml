  - '[PAGE 8]


    # Easy animation


    In a notebook, draw a stick man standing, then gradually bending his knees, then
    straightening them again, then rising into the air. Use a new page for each illustration.
    When the pages are flicked, it will look as if the stick man is crouching and
    then jumping into the air. That’s how animation works.


    # Starting from Scratch


    Scratch helps you create fun animations easily. Using already-written pieces of
    code that you can download, the projects in this book will let you play with the
    code and understand more about how coding works.


    You don’t need to be good at drawing to use Scratch. Sprites, backgrounds and
    costumes are all on the site, ready to use. This means you can create animations
    much faster on a computer than you can by hand, and you can change things more
    easily, too, with the click of a mouse!


    # Think about it


    Can you think of other ways that you could create an animation without using drawings
    or a computer? How do you think the Wallace and Gromit films were made?


    (answer on page 32)


    You can use the skills you’ll learn from interacting with the animation projects
    in this book to develop animations of your own. Once you’ve got the hang of the
    basics, the possibilities to be creative are endless!'
