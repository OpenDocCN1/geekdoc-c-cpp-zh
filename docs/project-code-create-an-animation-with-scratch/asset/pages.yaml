- pgno: 27
  md: "# PEOPLE POWER!\n\nSome computer programs need a user (you) to interact with\
    \ them, such as when you are playing a computer game. Other programs, such as\
    \ an operating system, run without a user having to do anything.\n\n![](img/0db0bd1c1343c511fdd2e24659c41ae8_27_0.png)\n\
    \n# Inputs and outputs\n\nMost programs do interact with a user – a game would\
    \ not be much fun if you couldn’t control what was going on! These interactions\
    \ fall into two main sections: input and output. Inputs are when the user gives\
    \ information or instruction to the code, and outputs are when the code responds\
    \ to the user in some way.\n\nThe most obvious inputs are the keyboard and mouse,\
    \ or the touch screen on a hand-held device. When you use them, you give the program\
    \ information.\n\nThe most obvious output is the display screen, where your code\
    \ displays messages, graphics or pictures, or plays a video or music.\n\n# Think\
    \ about it\n\n+   Do you think the following are inputs or outputs?\n+   \n+ \
    \  - typing your name\n+   - displaying a message on screen\n+   - printing a\
    \ picture\n+   - swiping a touchscreen\n+   \n+   (answers on page 32)\n\n![](img/0db0bd1c1343c511fdd2e24659c41ae8_27_1.png)"
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Interface


    The connection between a user and a computer is called a UI (User Interface) or
    GUI (Graphic User Interface). For most programs, user interaction is vital.


    # Events


    If your code needs information from a user, it will usually do one of two things.
    Either it may ask a question on screen and wait for an answer or the code will
    carry on running and respond when the user decides to interact with it. We call
    this being ‘event-driven’. An ‘event’ might be clicking a mouse or pressing a
    key.


    # Think like a computer


    Think of the things that you could do in an animation. How do you want your program
    to react to each of them? Maybe you could write some code like this:


    ```

    IF up arrow key pressed THEN

    (computer thinks: ‘Which key was pressed? Was it an arrow key? Do I need to move
    the sprite up?’)

    ```


