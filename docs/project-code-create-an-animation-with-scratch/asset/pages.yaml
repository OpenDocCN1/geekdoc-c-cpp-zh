- pgno: 11
  md: '# ALL ABOUT LOOPS


    A computer will run the instructions in a code, one after the other, from beginning
    to end and then stop. If you want a computer to repeat the same thing over and
    over again, you need to use a type of code called a loop.


    # Step to it


    If you wanted to tell your friend to take 10 steps across the room, you wouldn’t
    say ‘take a step, take a step, take a step …’ ten times! You would say ‘take 10
    steps’. You do exactly the same when you’re coding.


    # And repeat


    The repeat bit of the code is a loop. This is also called ‘going around the loop’
    or ‘an iteration’, which means that we run the code from top to bottom each time
    we go around the loop.


    It’s much easier and quicker to write a looping code, because it is shorter. It’s
    easier to make changes to it, too.


    Instead of writing the code:

    MOVE 1 step

    WAIT 0.5 seconds

    MOVE 1 step

    WAIT 0.5 seconds

    MOVE 1 step

    WAIT 0.5 seconds

    … and so on, seven more times …


    It is better to write the code:

    REPEAT 10 times:

    MOVE 1 step

    WAIT 0.5 secs


    # Think about it


    If you told your friend to ‘take a step, take a step’, ten times, it would take
    much longer for them to cross the room than if you’d said ‘take ten steps’, as
    they’d have to wait for each individual ‘take a step’ instruction.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Make coding quicker with sub-routines


    Code that is used more than once can be made into a sub-routine. You write some
    code and give it a name, then simply add this name to your main code each time
    you want to use the sub-routine.


    Scratch lets you make blocks of your own code. To make a simple sub-routine in
    Scratch, click on the ‘More Blocks’ tab and click ‘Make a Block’. Name the block:
    STEP Next, add these blocks from the coloured menu tabs:


    +   - MOVE 1 step

    +   - WAIT 0.5 secs


    To use the STEP sub-routine in your code, put your STEP block inside a repeat
    loop as shown.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_12_0.png)


    # Nested loops


    You can use a loop inside another loop. This is called a ‘nested loop’. Try acting
    out this nested loop. Face an object, and then turn 90 degrees to the right four
    times. You have performed a loop. Now clap each time your feet move. The clap
    is the nested loop.


    Try out your new loop skills in the Scratch project on the next page.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# PROJECT PAGE:

    GET LOOPING!


    For the animation project, we will start by creating a simple animation of a sprite,
    named Avery, walking. Open the Scratch project ‘animation1sb2’.


    1 Click on ‘Costumes’ to see four different images. Each shows Avery at a different
    stage of walking. Showing these images one after the other will animate Avery
    walking.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_13_0.png)


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_13_1.png)


    2 To do this, we have created a simple loop. A ‘forever’ loop does exactly what
    it says - it runs the code inside it over and over again, forever. This code changes
    to the next costume, moves forwards a little, waits for 0.2 seconds, and then
    repeats. But if you run this code by clicking on it, Avery will eventually walk
    off the screen.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_13_2.png)


    3 We can fix this by using repeat loops ‘nested’ inside a forever loop. The top
    repeat loop walks Avery halfway across the screen. The ‘point in direction’ block
    turns her around. The bottom repeat loop walks Avery back again and then turns
    her around. She will do this forever or until you stop her.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '4  As we are using the same code twice, we’ve created a ‘walk’ sub-routine.


    Note that a drumbeat has been added to the sub-routine. By putting a repeat loop
    inside a repeat loop, Avery’s costume changes twice for each drumbeat. This way
    you hear a drumbeat each time her foot touches the ground.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_14_0.png)


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_14_1.png)


    > Using a sub-routine not only saves space and time, it makes code much more readable!


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_14_2.png)


    5  Use the ‘Walk’ sub-routine block in your final code. Click on this piece of
    code in the project.


    Three more blocks set where Avery starts walking from. These blocks place her
    at a point to the bottom left of the screen, facing to the right, and also set
    the volume of the drumbeat sound.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_14_3.png)


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_14_4.png)'
  merge: -1
