- pgno: 15
  md: '# CREATE A CHARACTER


    You can have fun making a Scratch animation exactly how you want it. There are
    many different sprites to choose from as your main character. Open a new Scratch
    project by clicking on ‘File’, then ‘New’ in the dropdown menu. Choose sprites
    from the Scratch library by clicking on the sprite image next to the words ‘New
    sprite’.


    # Get creative


    If you don’t like any of those, you can create your own! Choose the paintbrush
    tool from the ‘New sprite’ menu and a blank page will appear. Use the paintbrush
    or shapes, such as the line, rectangle and circle, to create your sprite. Choose
    colours from the menu at the bottom and use the slider to change the size of your
    paintbrush. Create more than one costume (position) for your sprite by clicking
    on the ‘paint new costume’ paintbrush tool.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Snap!


    Click on the icon of a file and you can add any image you have saved on your computer
    as a sprite, too. Most picture formats can be used, such as JPEG and PNG files.


    If you prefer, you can add a photo of yourself! Click on the camera and if your
    computer has a camera you will see a picture of yourself come up on the screen!


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_16_0.png)


    # Storyboards


    Think of some animated films you have seen. What did you like about them? Was
    it the characters or the story, or both? Most good animations have interesting
    characters and an exciting storyline that makes you want to see what happens next.


    When animators start creating an animation, they first make a storyboard. This
    is a rough outline of what will happen to the characters in a film or animation.
    It is usually a series of drawings that map out the key moments or events in a
    story. It helps an animator to get a clear idea of the story''s beginning, middle
    and end before they start. Try it with a character you have created.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_16_1.png)'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# DECISIONS, DECISIONS!


    Decisions are an important part of coding. Decisions mean a computer can make
    choices based on what is happening. The computer''s ability to make decisions
    makes it seem intelligent, but in reality it is simply following a logical set
    of instructions.


    # How do decisions work?


    You can create many types of decision in coding, but they all follow the same
    basic format:


    DECISION   CONDITION   ACTION


    This may sound confusing, but it is easy really. You probably use the words IF,
    WHEN or WHILE every day and they have the same meaning in code as they do in real
    life. IF you are hungry, what should you do?


    In coding, the CONDITION is what you are testing for. The CONDITION must always
    be either true or false. So if you are testing to see IF you are hungry, then
    ...

    yes = true

    no = false


    The ACTION part is what you do if the CONDITION is true. So IF you are hungry,
    the ACTION is that you will eat.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# What else?


    The simplest of decisions is the IF statement. This usually includes a THEN part.

    For example, the coder can tell the computer, ‘IF this happens THEN do this.’

    Sometimes an ELSE part is also added. This allows the coder to tell the computer,
    ‘IF this happens THEN do this or ELSE do that,’ for example:


    IF hungry THEN eat or ELSE keep playing.


    # The IF-THEN-ELSE game


    Try this game with some friends.

    One person is the Coder, everyone else is a Computer. The Coder gives a command.

    ‘IF I _____ (do this),

    THEN you _____ (do this).’

    An example might be: ‘IF I pat my head, THEN you hop on one leg.’


    Now try an IF-THEN-ELSE statement.

    ‘IF I _____ (do this),

    THEN you _____ (do this),

    ELSE you _____ (do that).’

    An example might be: ‘IF I pat my head, THEN you hop on one leg, or ELSE stick
    your tongue out.’ If the Coder does nothing, the Computers should all stick their
    tongues out!


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# PROJECT PAGE:

    USING DECISIONS


    Adding decisions to our project will make it more intelligent. Open the Scratch
    project named ''animation2.sb2''.


    1 The first decision to add is a ‘when’ statement at the start of the code. This
    tells the computer: ‘When I click on the green flag, start the animation’. (The
    green start flag and red stop buttons are at the top right of the Scratch project
    screen.)


    2 The next decision adds a little more intelligence to Avery’s walking. At the
    moment she walks back and forth a set number of paces. We have made it more intelligent
    by sensing when Avery reaches the edge of the screen, using a block of IF code.


    This block makes Avery walk a few paces and then check if she has reached the
    edge. IF she has, the code turns her around.


    3 Make another sub-routine called JUMP.


    Changing the ‘Y’ value makes Avery move up and down. The first ‘change’ block
    moves her up 60 ‘steps’ and the second 60 steps back down again, with a small
    delay in between.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '4 Note that there is a red mark on the path. If the computer senses that Avery
    is touching the red mark, the CONDITION (IF touching colour red?) is met (true).
    The computer then runs the code for the IF-THEN statement with the JUMP sub-routine
    and Avery will jump in the air.


    5 We can also make Avery do something if the condition was not met, or false.
    This tells the computer, ‘IF Avery is touching the red, THEN think nothing and
    jump’, ELSE think “Hmmm”.


    6 Now, when you click the green flag, Avery walks across the screen, thinking
    ‘Hmmm’. She turns around at the edges of the screen. Whenever she touches the
    red mark, she thinks nothing and jumps up and down four times. This continues
    until you click on the stop symbol.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_20_0.png)


    IF/ELSE decisions are really useful. They mean you are not limited to making a
    decision to either do or not do something. You can do something ELSE, if the answer
    to your IF question is false.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_20_1.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# WHAT''S AN OPERATOR?


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_21_0.png)


    Data is any collection of information, such as numbers or measurements. Different
    types of operators control how the computer uses the data.


    Some maths operators are:

    add +, subtract -,

    multiply x and divide ÷

    Some comparison operators are:

    less than <, greater than >

    and equal to =

    Logic operators are:

    AND, OR and NOT.


    # Logic operators


    The answer to ‘am I hungry?’ is either ‘yes’ (true) or ‘no’ (false). What if you
    wanted to know ‘am I hungry and is it lunchtime?’. Logic operators are used in
    coding because they test for more than one thing at a time, using the words AND
    and OR.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_21_1.png)


    # AND logic


    AND logic tests to see if the answer to more than one question is true. For example:
    IF hungry AND lunchtime THEN eat.


    Each condition (question), is still either true or false, but the result of the
    combined test - whether we are hungry AND it is lunchtime - is also either true
    or false.


    The AND logic works like this:

    Hungry (true) AND lunchtime (true)

    = true (eat)

    Hungry (true) AND NOT lunchtime (false)

    = false (don’t eat)

    NOT hungry (false) AND lunchtime (true)

    = false (don’t eat)

    NOT hungry (false) AND NOT lunchtime (false)

    = false (don’t eat)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# OR logic


    OR logic tests to see if only *one* of the conditions is true. For example:


    IF I am Tired OR it is Dark THEN go indoors.


    The OR logic works like this:


    Tired (true) OR dark (true) = true (go indoors)

    Tired (true) OR NOT dark (false) = true (go indoors)

    NOT tired (false) OR dark (true) = true (go indoors)

    NOT tired (false) OR NOT dark (false) = false (don’t go indoors)


    So if *either* of our conditions is true, the whole test is true. The test would
    only be false if you are not tired and it is not dark.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_22_0.png)


    # Conditional operators


    Conditional operators let us ask more complicated questions. You may want to know
    *how hungry* you are. If you were a little hungry you would eat an apple. If you
    were very hungry you would eat a meal. For these questions, we use the > or <
    symbols, which show that one side is bigger than the other.


    4 > 2 means 4 is greater than 2

    2 < 4 means 2 is less than 4


    You can say how hungry you are using a scale of 1 to 10.


    If 1 = not hungry and 10 = starving, then you can say:

    IF hungry > 7 THEN eat lunch

    IF hungry < 3 THEN carry on playing

    IF hungry > 3 AND hungry < 7 THEN eat an apple


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_22_1.png)


    When someone next asks you if you are hungry, try to answer them using greater
    than or less than and a scale of 1 to 10.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_22_2.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# PROJECT PAGE:

    ADDING OPERATORS


    So far we have only asked simple questions in our code, such as ''are we touching
    the red spot?'' or ''have we reached the edge of the screen?''. When we need to
    ask more specific questions, we need to use operator blocks. Open the Scratch
    project named ''animation3.sb2''.


    1 Avery jumps when she walks past the red mark in either direction. If we only
    wanted her to jump when moving to the right, we need to use two operators, AND
    and =. Both of these conditions - touching the red mark and a travel direction
    of 90 (right) - must now be met before she will jump.


    ```

    if touching color ? and direction = 90 then

    jump

    ```


    2 A third decision uses =, > and <, and two AND operators. Remember ''>'' means
    greater than and ''<'' means less than. This time, when Avery is walking to the
    right AND her position on the screen is between 1 and 40, (just over half way),
    Avery will do a somersault. Like the jump, the somersault is a sub-routine.


    ```

    if direction = 90 and x position > 0 and x position < 41 then

    Somersault

    ```'
  merge: -1
  img_proc: true
