- pgno: 25
  md: '# MAKE FUN BACKDROPS


    Characters and action are important in animation, but the background plays a big
    part in bringing it all to life. As with the sprites (see pages 12-13) you can
    get creative making your own backgrounds. Either choose a background (called "Backdrops"
    in Scratch) from the Backdrop Library, paint your own background using the creative
    tools, select a background that you already have on file on your computer, or
    click on the camera and see what your computer is seeing.


    # It''s behind you!


    Different settings really change the mood of your animation. Think about what
    kind of background will fit with the story of your animation. An underwater background
    won''t fit with a story set in a forest. A really crazy animation might need you
    to make a funky background to go with it if there''s nothing suitable in the library.'
  merge: -1
  img_proc: true
