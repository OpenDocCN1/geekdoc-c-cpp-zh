- pgno: 30
  md: 'The IF-THEN block on page 26 asks the computer to test if a user interaction
    (up arrow key pressed) has occurred. If it has, it either runs the Somersault
    or Leap sub-routines, depending on which direction Avery is travelling.


    4 Click on the bat sprite to see how the code that makes it interact with Avery
    is made.


    ```

    If touching Avery Walking ? then

    say Ouch! for 0.25 secs

    play sound pop

    ```


    This IF-THEN block of code asks the computer to test if the bat touches Avery.
    If it does, it runs the code. But it also depends on user interaction to make
    it work. If the user mistimes hitting the space bar, the IF-THEN part of the code
    won’t run.


    5 Click the green flag to start the finished animation. Animate the bat by hitting
    the space bar. See if you can time animating the bat so it says ‘Ouch’. Try pressing
    combinations of keys to see all the animation in action.'
