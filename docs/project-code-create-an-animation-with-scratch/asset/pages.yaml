- pgno: 31
  md: '# DEBUGGING


    You might think that every time you use the coding blocks, they will do exactly
    what you wanted, in exactly the way you intended, the very first time. Unfortunately,
    this is rare!


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_31_0.png)


    # Stop bugging me!


    You will probably get something wrong, or the code won’t do exactly what you expected.
    It is not always your fault. Sometimes the program that we use to create the code
    has a problem, which means that it produces the wrong code.


    When code has a problem this is called a bug. Debugging is when you look through
    the code to see what is causing the bug, and fix it by removing the bug.


    Before you give code you have written to someone else to use, you should test
    it. Does it do everything correctly? What if the user does something unexpected?
    Does our code then have a problem, or does it still work?


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_31_1.png)


    Why ‘bug’? Some people think that the term was invented in 1947 when a butterfly
    was found in an early computer, called Mark II, at Harvard University, USA. The
    word had also been used by people working with electrical systems. It is said
    to be short for ‘bugbear’ or ‘bugaboo’, which are old words for an evil sprite.'
  merge: -1
  img_proc: true
- pgno: 32
  md: "# Bug hunt\n\nThe hardest part of debugging is finding the piece of code that\
    \ is wrong. You have to look through the code very carefully to see where the\
    \ bug is. You then have to be careful that any changes made do not cause another\
    \ bug.\n\nOnce the bug is fixed, test the code again until you are sure everything\
    \ works as it should. Only then is your code finished.\n\n![](img/0db0bd1c1343c511fdd2e24659c41ae8_32_0.png)\n\
    \n# Think about it\n\nLoad the project named ‘animation5.sb2’. Can you spot the\
    \ bug in this bit of code? Avery is supposed to walk backwards and forwards. Run\
    \ this code in Scratch and see what happens. Then try to debug the code and make\
    \ Avery walk across the screen, like she does in the first project on page 10.\n\
    \n(answer on page 32)\n\n```\ngo to x: -90 y: -60\npoint in direction 0°\nset\
    \ volume to 40%\nforever\n  repeat 5\n    Walk\n  repeat 5\n    Walk\n  point\
    \ in direction 90°\n```\n\n# Making mistakes\n\nRemember, debugging is part of\
    \ coding and making mistakes is an important part of learning new skills. Sometimes\
    \ mistakes make unexpected or fun things happen, which you might decide to keep\
    \ in another animation.\n\n> Now, use the skills you have learned to make an animation\
    \ of your own. The possibilities are endless!"
  merge: -1
  img_proc: true
- pgno: 33
  md: '# GLOSSARY


    animator A person who makes an animated cartoon.


    code A set of instructions for a computer.


    condition A condition is when a computer program examines whether a statement
    is true or false.


    costumes In Scratch, these are the different positions each sprite is drawn in,
    which give the illusion of animation when they are shown one after the other.


    iteration A process used by computers, in which a series of operations is repeated
    a number of times.


    logical Something that follows the rules of logic, or reasoning.


    operating system The main program in a computer that controls the way the computer
    works and makes it possible for other programs to function.


    program A set of step-by-step instructions that tell a computer to do something
    with data.


    rotate To turn or cause to turn about an axis or a centre.


    run To operate.


    sprite A simple, two-dimensional bitmap character that can be moved around within
    a larger scene.


    symbol A letter, character, or sign used instead of a word or group of words.


    translate To change words or other instructions from one language to another.


    user The person who is operating the computer program.


    ![](img/0db0bd1c1343c511fdd2e24659c41ae8_33_0.png)'
  merge: -1
