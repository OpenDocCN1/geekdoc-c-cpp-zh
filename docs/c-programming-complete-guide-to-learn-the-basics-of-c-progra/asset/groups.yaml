    # Chapter 5: Concept of “Arrays” in C++


    We have been using standard data types so far, such as integer, floating point
    number and character. No one can deny their importance but these data types can
    not handle large amount of data, they can only handle a limited data. To learn
    how we can handle large data in our programs, we should study the derived data
    types. We have to begin with array structures.


    With the introduction of arrays we can begin the study of data structures, as
    well. In this chapter, we will understand some of the basic concepts of data structures.
    In most cases, a collecting mechanism is required to organize the data. In the
    programming world, use of arrays is a common organizing technique with which we
    can process data as an individual element and as a group as well.


    Let’s say, we have a problem that requires us to read process and then print the
    data. Consider our data twenties integers. We must also keep the integers in memory
    for the duration of the program. In the beginning we will declare twenty variables,
    each variable with a different name. We know that having twenty names would create
    a problem. So, the point is how we can create and store twenty integers from the
    keyboard. For printing those twenty integers we will need twenty references to
    store them and twenty more references to print them.


    This approach may be acceptable to twenty or twenty five or twenty six integers
    but this is not acceptable for a larger data, i.e. let’s say 200 or 2,000 or 20,000
    integers. So, to process large amount of data we need a powerful structure. In
    this case we commonly use arrays. In C++, array is a fixed size collection of
    elements of the same data type.


    # 5.1 Using Arrays in C++


    In this section, we will learn how to declare and define arrays, in C++, and after
    that we will look at several typical applications of arrays including reading
    and writing values in arrays.'
