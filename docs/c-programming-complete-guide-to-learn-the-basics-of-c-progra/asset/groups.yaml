    \ not integral and we use else if in this scenario.\n\n+   * The Switch Statement\n\
    \nSwitch statement is composite statement used to make a decision between many\
    \ statements. In this case, the selection condition must be in integral type.\
    \ For this statement, any expression can be used but unary expression is the most\
    \ common.\n\nSwitch expression have conditions that we can evaluate for every\
    \ possible value that can be the result from this condition, separate case constants\
    \ are defined. With every case, there are one or more associated statements.\n\
    \nTo understand switch statement, we may see the following syntax\n\n```\nSwitch\
    \ (expression)\n{\ncase constant - 1 : statement\n......\n      statement\ncase\
    \ constant - 2 : statement\nn......\n```"
