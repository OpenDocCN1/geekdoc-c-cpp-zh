    With this code, we may understand how it works. By compiling this code, everytime
    allocated memory will be different but as we know that the variables will remain
    the same.


    Moving forward, whenever and operator is used as a prefix of a variable, it defines
    the address of variable and when it is used as a suffix it means reference parameter.
    Secondly, it is to be stated that a variable''s address is the address of the
    first byte occupied by the variable.


    +   - Pointer Variables


    We know that we have pointer values and pointer constants, we should remember
    that we can have pointer variables as well. Because of this, we can store the
    address of a specific variable to another variable. This is called pointer variable.


    For this, first of all, we should distinguish between a variable and its value.
    As variable''s location and name are constants, the variable''s value can change
    when the program executes. We can even store the address of a variable in two
    or more than two different pointer variables.


    Moving forward, if we consider a pointer value and we do not want it to be a pointer
    value anymore, what should we do! In C++, a programmer can use a null constant.
    This constant is represented as NULL and by using this, we can set a pointer to
    point towards nothing. In other words, we should use this when our pointer doesn''t
    contain an address.


    # 6.2 Accessing Variables through pointers


    Consider that we have a variable and we have a pointer as well, pointing to that
    variable. The question is, how we would use that pointer to relate it to our variable!


    In this scenario, C++ has another operator. This is known as indirection operators
    and represented as "*".'
- md: "\nIndirection operator is a unary operator and its operand should be a pointer\
    \ value. Every time, its result would be an expression, which we can use to access\
    \ the pointer value for alteration and inspection.\n\nFor example, if we have\
    \ to add 1 to the variable “n”, we will do this with one of these statements,\
    \ assuming that pointer “m” was correctly initialized, i.e. ( m = &n )\n\n- n++;\n\
    - n = n + 1;\n- *m = *m + 1\n- (*m)++;\n\nWe have to keep in mind that in the\
    \ last statement, i.e. (*p)++, parentheses are necessary.\n\n## 6.3 Pointer Declaration\n\
    \nWe know that we use indirection operator to declare and define the pointer variables.\
    \ Indirection operator is not a primary operator but it's a compiler syntactical\
    \ notation. To make it easier to remember, we should make it the same token as\
    \ the operator. For example:\n\n```cpp\n#include <iostream>\n#include <bits/stdc++.h>\n\
    using namespace std;\nvoid n()\n{\n    int variable = 69;\n    // Declaring our\
    \ pointer variable\n    int *pointer;\n    // The data type of pointer and variable\
    \ must be the same\n    pointer = &variable;\n    // Assigning the addresses of\
    \ a variable to its pointer\n    cout << \"Value at variable = \" << variable\
    \ << endl;\n    cout << \"Value at *pointer = \" << *pointer << endl;\n    cout\
    \ << \"Value at pointer = \" << pointer << endl;\n}\n// Our driver program\nint\
    \ main() {\n{\n  n();\n}\n```\n\n## 6.4 Initialization of a Pointer Variable\n\
    \nIn general, C++ does not initialize variables. So, whenever we start our program,\
    \ all the variables have some random values in them. The very same thing happens\
    \ in the case of pointers. Whenever a program is started, every pointer have some\
    \ random memory addresses in them. In other words, we can say that every pointer\
    \ have some values to allocate itself in memory. We will get a runtime error,\
    \ if the address is not properly allocated, in many cases, it is because of bad\
    \ programming skills.\n\nWe have to remember that we can initialize the pointers\
    \ only when the pointers are properly declared and defined. If we do not define\
    \ them properly, we would not be able to initialize them. For example, if we have\
    \ a variable \"n\" and a pointer \"m\", we will set \"m\" to point towards \"\
    n\" at the time of declaration, otherwise, the code would not work. For example:\n\
    \nAs we can see, initialization have two different steps. Firstly, we can declare\
    \ a variable. Secondly, we can use an assignment statement to initialize it. We\
    \ can understand this concept with the following example:\n\n### Problem-1\n\n\
    Change the value of variables in a C++ code, using pointers.\n\n### Solution:\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint variableN = 4000;\nint\
    \ variableM = 5000;\nvoid reference(int **n, int **m)\n{\n    *n = &variableN;\n\
    \    *m = &variableM;\n}\nvoid numberOutput()\n{\n    cout << \"N = \" << variableN\
    \ << endl;\n    cout << \"M = \" << variableM << endl;\n}\nint main()\n{\n   \
    \ int *testN = 0;\n    int *testM = 0;\n    reference(&testN, &testM);\n    *testN\
    \ = 69;\n    *testM = 96;\n    numberOutput();\n    return 0;\n}\n```\n\n### Problem-2\n\
    \nWrite a C++ code using the concept of pointers, to add two integers.\n\n###\
    \ Solution:\n\n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n\
    {\n    // Initializing Variables and Pointers\n    int *variableN=new int;\n \
    \   int *variableM=new int;\n    int *sum=new int;\n    // Reading Numbers from\
    \ the user\n    cout<<\"Enter first number: \";\n    cin>>(*variableN);\n    cout<<\"\
    Enter second number: \";\n    cin>>(*variableM);\n    // Calculating the Sum\n\
    \    *sum=*variableN+*variableM;\n    // Printing the Sum\n    cout<<\"Addition\
    \ is: \"<<sum<<endl;\n    // Returning Value\n    return 0;\n}\n```\n\n## 6.5\
    \ Pointers and Functions\n\nMost effectively, we can use pointers in a function.\
    \ We already know that C++ provides two possibilities to pass parameters through\
    \ a function, i.e.\n\n- Pass by Value\n- Pass by Reference\n\nWe have now studied\
    \ the concept of pointers, so we can use an alternative method to pass by reference.\
    \ It is simple as we have to pass a pointer and we may use it to change the value\
    \ of variable. The only difference among them is that when we do it by pointer,\
    \ an alias is created.\n\n- Pointers as Parameters\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n// Function prototypes\nvoid swap(int&, int&);\nint main()\n\
    {\n    int n = 69, m = 96;\n    cout << \"Before swapping\" << endl;\n    cout\
    \ << \"n = \" << n << endl;\n    cout << \"m = \" << m << endl;\n    swap(n, m);\n\
    \    cout << \"After swapping\" << endl;\n    cout << \"n = \" << n << endl;\n\
    \    cout << \"m = \" << m << endl;\n    return 0;\n}\nvoid swap(int& a1, int&\
    \ a2)\n{\n  int alpha;\n  alpha = a1;\n  a1 = a2;\n  a2 = alpha;\n}\n```\n\n-\
    \ Functions Return Pointers\n\nIn C++, nothing can stop a function from returning\
    \ a pointer. In fact, it's a common activity for functions to return pointers.\
    \ We can understand this phenomenon using the following code:\n\n```cpp\n#include\
    \ <iostream>\nusing namespace std;\n// Function having Pointer as Return type\n\
    int* alphaf(int);\nint main()\n{\n  int n = 23;\n  // Displaying the value of\
    \ n\n  cout << n << endl;\n  // Calling our function\n  cout << *alphaf(n) <<\
    \ endl;\n  return 0;\n}\n// Defining our function\nint* alphaf(int n1)\n{\n  //\
    \ Taking a Local Variable Inside our Function\n  int lv = n1;\n  // Returning\
    \ the address of local variable\n}\n```\n\n## 6.6 Arrays and Pointers\n\nIn the\
    \ concept of pointers, we should know that there is a very close relation between\
    \ arrays and pointers. We should keep in mind that the name of an array is always\
    \ a pointer constant, pointing to the first element of that array. Now, because\
    \ the array’s name is pointer constant, its value cannot be changed.\n\nMoving\
    \ forward, the name of the array and the address of the first element are both\
    \ pointer constants, representing the same location allocated in memory. Because\
    \ of this, we can use the array’s name wherever we need to use a pointer. The\
    \ only restriction is that we cannot use it specifically with the indirect operator.\
    \ The point to remember here is that the name of array is a pointer, only pointing\
    \ to the first element, not to the whole array. To understand this, we may take\
    \ a look at this code:\n\n```cpp\n{\nArray name is a Pointer Constant\nint n [69];\n\
    cout << \"Allocated Address of n[0] : \" << &n[0] << endl;\ncout << \"Array name\
    \ as a Pointer :\" << n << endl;\n}\n```\n\nAs we can see, to access an entire\
    \ array, a pointer to its first element may be used instead of using the name\
    \ of that array. For further understanding, we may read the following code:\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\nconst int ALPHA = 3;\nint main\
    \ () {\n    int array[ALPHA] = {69, 96, 69};\n    for (int n = 0; n < ALPHA; n++)\
    \ {\n        cout << \"Value of array[\" << n << \"] = \";\n        cout << array[n]\
    \ << endl;\n    }\n    return 0;\n}\n```\n\n## 6.7 Programming Examples\n\n###\
    \ Problem - 1\n\nWrite a C++ program to sort an array (selection sort), using\
    \ the concept of pointers.\n\n### Solution:\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\nvoid swap(int *n, int *m) {\n    int alpha;\n    alpha = *n;\n\
    \    *n = *m;\n    *m = alpha;\n}\nvoid sort(int *data, int size)\n{\n    int\
    \ beta;\n    for(beta = 0; beta < size - 1; beta++)\n    {\n        int charlie;\n\
    \        for(charlie = beta + 1; charlie < size; charlie++)\n            if(data[beta]\
    \ > data[charlie])\n                swap(&data[beta], &data[charlie]);\n    }\n\
    }\nconst int max_int = 10;\nint main()\n{\n    int integers[max_int];\n    int\
    \ o;\n    cout << \"Enter ten integers you want to sort :\" << endl;\n    for(o\
    \ = 0; o < max_int && cin >> integers[o]; o++);\n    int num = 0;\n    sort(integers,\
    \ num);\n    cout << \"Your Sorted data is\" << endl;\n}\n```\n"
