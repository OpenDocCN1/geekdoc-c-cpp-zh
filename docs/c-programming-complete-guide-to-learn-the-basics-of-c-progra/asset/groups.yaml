    # 引言


    C++ 是一种广泛用于通用编程的计算机编程语言。它是 C 语言的扩展。可以通过 C 语言获取对 C++ 的基础知识。这就是为什么这两种计算机语言都被表示为
    C/C++。Bjarne Stroustrup 在 1979 年开发了这种多范式语言。


    在今天世界上，许多操作系统使用 C++ 作为它们的基础语言。一些系统驱动程序、浏览器和游戏是基于 C++ 程序的。它是一种自由形式、编译型且静态类型的编程语言。许多专业人士认为
    C++ 是实现所需结果最高效的语言。


    在《7天学习 C++ 编程基础的完整指南》中，我涵盖了初学者所需的所有核心基础概念。这是一份循序渐进的指南，确保了所有人都能够了解 C++ 的结构和语法，以及基础表达式。然后，它指导了主要的“函数”，例如数学运算和标准库。此外，还对运算符的选择、逻辑数据以及
    C++ 中的数组、类、指针和字符串概念提供了完整的指导。


