    \n我们知道使用间接运算符来声明和定义指针变量。间接运算符不是一个基本运算符，但它是编译器的语法标记。为了方便记忆，我们应该让它与运算符具有相同的标记（token）形式。例如：\n\
    \n```cpp\n#include <iostream>\n#include <bits/stdc++.h>\nusing namespace std;\n\
    void n()\n{\n    int variable = 69;\n    // 声明我们的指针变量\n    int *pointer;\n   \
    \ // 指针和变量的数据类型必须相同\n    pointer = &variable;\n    // 将变量的地址赋值给它的指针\n    cout\
    \ << \"Value at variable = \" << variable << endl;\n    cout << \"Value at *pointer\
    \ = \" << *pointer << endl;\n    cout << \"Value at pointer = \" << pointer <<\
    \ endl;\n}\n// 我们的驱动程序\nint main() {\n{\n  n();\n}\n```\n\n## 6.4 指针变量的初始化\n\n\
    通常情况下，C++ 不初始化变量。因此，每当我们启动程序时，所有变量中都包含某些随机值。指针的情况也是如此。每当程序启动时，每个指针中都包含一些随机的内存地址。换句话说，我们可以说每个指针都有某些值来在内存中分配自己。如果地址没有被正确分配，我们将获得运行时错误，在很多情况下，这是由于编程技巧欠佳。\n\
    \n我们必须记住，只有当指针被正确声明和定义时，我们才能对其进行初始化。如果我们没有正确定义它们，就无法初始化它们。例如，如果我们有一个变量 \"n\" 和一个指针\
    \ \"m\"，我们将在声明时将 \"m\" 指向 \"n\"，否则代码无法运行。例如：\n\n正如我们看到的，初始化有两个不同的步骤。首先，我们可以声明一个变量。其次，我们可以使用赋值语句对其进行初始化。我们可以通过以下示例理解这个概念：\n\
    \n### 问题-1\n\n使用指针修改 C++ 代码中变量的值。\n\n### 解决方案：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint variableN = 4000;\nint variableM = 5000;\nvoid reference(int\
    \ **n, int **m)\n{\n    *n = &variableN;\n    *m = &variableM;\n}\nvoid numberOutput()\n\
    {\n    cout << \"N = \" << variableN << endl;\n    cout << \"M = \" << variableM\
    \ << endl;\n}\nint main()\n{\n    int *testN = 0;\n    int *testM = 0;\n    reference(&testN,\
    \ &testM);\n    *testN = 69;\n    *testM = 96;\n    numberOutput();\n    return\
    \ 0;\n}\n```\n\n### 问题-2\n\n使用指针的概念编写一个 C++ 代码来将两个整数相加。\n\n### 解决方案：\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main()\n{\n    // 初始化变量和指针\n  \
    \  int *variableN=new int;\n    int *variableM=new int;\n    int *sum=new int;\n\
    \    // 从用户处读取数字\n    cout<<\"Enter first number: \";\n    cin>>(*variableN);\n\
    \    cout<<\"Enter second number: \";\n    cin>>(*variableM);\n    // 计算和\n  \
    \  *sum=*variableN+*variableM;\n    // 打印和\n    cout<<\"Addition is: \"<<sum<<endl;\n\
    \    // 返回值\n    return 0;\n}\n```\n\n## 6.5 指针与函数\n\n最有效的方法是我们可以在函数中使用指针。我们已经知道\
    \ C++ 提供了两种通过函数传递参数的可能性，即：\n\n- 按值传递\n- 按引用传递\n\n我们现在已经学习了指针的概念，所以我们可以使用另一种方法来实现按引用传递。这很简单，因为我们只需要传递一个指针，并可以使用它来改变变量的值。它们之间唯一的区别是，当我们通过指针这样做时，会创建一个别名。\n\
    \n- 指针作为参数\n\n```cpp\n#include <iostream>\nusing namespace std;\n// 函数原型\nvoid\
    \ swap(int&, int&);\nint main()\n{\n    int n = 69, m = 96;\n    cout << \"Before\
    \ swapping\" << endl;\n    cout << \"n = \" << n << endl;\n    cout << \"m = \"\
    \ << m << endl;\n    swap(n, m);\n    cout << \"After swapping\" << endl;\n  \
    \  cout << \"n = \" << n << endl;\n    cout << \"m = \" << m << endl;\n}\nvoid\
    \ swap(int& a, int& b) {\n    int temp = a;\n    a = b;\n    b = temp;\n}\n```\n\
    *(注：原文示例中 swap 函数实现不完整，此处为保持逻辑一致性仅作翻译说明)*\n\n- 函数返回指针\n\n在 C++ 中，函数可以返回指针。我们可以通过以下代码理解这一点：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\n// 函数返回\nint* alphaf(int);\n\
    int main()\n{\n    int n = 69;\n    int* ptr = alphaf(n);\n    cout << *ptr <<\
    \ endl;\n    return 0;\n}\nint* alphaf(int n) {\n    static int x;\n    x = n;\n\
    \    return &x;\n}\n```\n\n## 6.6 数组与指针\n\n在指针的概念中，我们知道数组和指针之间存在紧密的关系。我们应该记住，数组名实际上是指向第一个元素的指针。例如：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main()\n{\n    int n[3]\
