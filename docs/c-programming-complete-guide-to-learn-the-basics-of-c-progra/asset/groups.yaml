    \n```cpp\nn[4] = 69;\n```\n\n我们必须记住，不能将一个数组赋值给另一个数组，即使它们的大小或类型完全匹配。我们必须在元素级别上复制数组。例如，要将一个包含二十个整数的数组复制到第二个二十个整数的数组中，可以使用以下语法\n\
