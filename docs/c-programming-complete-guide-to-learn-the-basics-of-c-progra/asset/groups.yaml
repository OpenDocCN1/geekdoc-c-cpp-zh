- md: "\nWe have to remember that:\n\n- Formal parameters are the variables which\
    \ are declared in the function header.\n- Formal parameters and actual parameters\
    \ should have the same data type, number and order. However, their names can differ.\n\
    - Actual parameters are the expressions in function body’s calling statements.\n\
    \nAn example for prototype declaration is:\n\n```cpp\nint add(int 1, int 2);\n\
    ```\n\n**Function Call** In C++, function call is always a postfix expression.\
    \ We have to remember that in primary expressions, postfix expressions are on\
    \ the highest level. So, if a function is used by a larger program, compiler will\
    \ calculate and execute it first, until we command it to perform some different\
    \ tasks first.\n\nIn a function call, operand is the function name, which consists\
    \ of actual parameters. These parameters evaluates and decides the values that\
    \ are to be sent to call our desired function.\n\nFor example:\n\n```cpp\n#include\
    \ <iostream>\n#include <cmath>\nusing namespace std;\nint main()\n{\n  double\
    \ n, m;\n  cout << \"Enter your desired number: \";\n  cin >> n;\n  // sqrt()\
    \ is a library function to calculate square root\n  m = sqrt(n);\n  cout << \"\
    Square root of \" << n << \" = \" << m;\n  return 0;\n}\n```\n\nin another example,\
    \ we can understand it clearly:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n// Prototype declaration of a function\nint add(int, int);\nint main()\n\
    {\n    int n, m, o;\n    cout<<\"Enters first number: \"; \n\n// Function definition\n\
    int add(int a, int b)\n{\n    int add;\n    add = a + b;\n    // Return statement\n\
    \    return add;\n} \n```\n\n### Void Functions with no Parameters\n\nAny function\
    \ without parameters should be called with empty parentheses. We have to remember\
    \ that these parentheses are the function call operators, as shown below\n\n```cpp\n\
    Hello();\n```\n\nIn the above mentioned example, the function hello receives nothing\
    \ and returns nothing as well. It has a side effect, that it displays a message.\
    \ This function is just called for that side effect. For example:\n\n```cpp\n\
    #include <iostream>\n// Function Declaration\nHello (void);\nint main (void)\n\
    {\n//Statements\n......\n// Function call\nHello();\nreturn;\n}\n// Function Definition\n\
    void Hello(void)\n{\n    cout<<\"Hello to C++\";\n    return;\n} // Greeting print\n\
    ```\n\n### Void Functions with Parameters\n\nNow there is another function that\
    \ can return void type and have parameters. In the example, given below, our function\
    \ Printints receives two parameters, in integer type. It returns nothing to main,\
    \ so its type is void. Typically, it is called stand alone postfix as it does\
