    # Chapter 4: Selection-Making


    In this chapter, we will study about “Selection”. Selection is the second fundamental
    of structured programming. Selection allows a user to select between two or more
    alternatives in any function. So, we may say that In C++, selection allows us
    to make decisions.


    In our daily life, we face many issues, when we have to make a decision, for example,
    we have to select between strawberry and chocolate ice cream, or maybe we have
    to select between black or brown shoes. Imagine our world, without selection,
    how boring it would be!


    So, moving towards the point, in this chapter, we will know about how the selection
    is made by a computer program. We have to remember that the choices made by a
    computer are really simple. Computer makes selection in binary form, i.e. 0 and
    1. Typically, 0 is used as false or off and 1 is used as true or on.


    # 4.1 Logical Data and Operators


    We may call any data logical, if it conveys the idea of true and false. Logical
    Data is a very important factor in programming as well as in real life.


    As far as our lives are concerned, sometimes, we have to make tough choices, based
    upon logical data, i.e. true or false. For example, let us say, if someone calls
    you and asks you, “Are you at home?”. You would have two choices, “Yes! I am home”
    or “No! I am not.” This would lie under 0 (false) and 1 (true), in programming.


    In programming, we may ask, if variable “n” is greater than “m”. The answer would
    be 0 (No) or 1 (yes).'
- md: "\n## Logical Data in C++\n\nIn C++, we may represent logical data in two manners.\
    \ Firstly, we may use boolean data (bool) with constant identifiers, true and\
    \ false. On the other hand, we may use other data types, such as integers (int)\
    \ and characters (char) to represent logical data. If an item is zero among the\
    \ data, it would be considered as false.\n\n## Logical Operators\n\nIn C++, we\
    \ usually have three logical operators. We can use them to combine and create\
    \ logical values such as not, or andand.These operators are shown in table below:\n\
    \n| Operator | Demonstration |\n| :--- | :--- |\n| ! | not |\n| && | Logical and\
    \ |\n| || | Logical or |\n\n## Not Operator\n\nIt is a unary operator. Not operator\
    \ \"!\" changes a 1 (true) value to 0 (false) or a 0 (false) to 1 (true).\n\n\
    ## And Operator\n\nIt is binary operator. And operator is a binary operator, so\
    \ that, it has four distinct possible combinations of values. In this operator,\
    \ the resulting value is true only if both operands are true.\n\n## Or Operator\n\
    \nOr Operator \"||\" is also a binary operator. Like and operator, or operator\
    \ also has four possibilities. But in this operator’s case, the result would be\
    \ false, only if both operands are false.\n\nTo understand these operators use\
    \ in C++, we may use these tables below\n\n### Not operator “!”\n\n### Logical\n\
    \n| n | !n |\n| :--- | :--- |\n| false | true |\n| true | false |\n\n### C++ Language\n\
    \n| n | !n |\n| :--- | :--- |\n| zero | non zero |\n| non zero | zero |\n\n###\
    \ And Operator (&&):\n\n### Logical\n\n| n | m | n && m |\n| :--- | :--- | :---\
    \ |\n| true | true | true |\n| true | false | false |\n| false | true | false\
    \ |\n| false | false | false |\n\n### C++ Language\n\n| n | m | n && m |\n| :---\
    \ | :--- | :--- |\n| non zero | non zero | non zero |\n| non zero | zero | zero\
    \ |\n| zero | non zero | zero |\n| zero | zero | zero |\n\n### Or Operator (||):\n\
    \n### Logical\n\n| n | m | n && m |\n| :--- | :--- | :--- |\n| true | true | true\
    \ |\n| true | false | true |\n| false | true | true |\n| false | false | false\
    \ |\n\n### C++ Language\n\n| n | m | n && m |\n| :--- | :--- | :--- |\n| non zero\
    \ | non zero | non zero |\n| non zero | zero | non zero |\n| zero | non zero |\
    \ non zero |\n\n## Evaluating Logical Expressions\n\nCompiler can evaluate binary\
    \ relationships, usually with two methods. The only difference in these methods\
    \ is about, if we need to evaluate the full expression or a part of it.\n\nIn\
    \ the first method, the compiler will evaluate the whole expression, even if there\
    \ is no need of it. For example, in the case of and operator, the entire statement\
    \ will be evaluated by the compiler, even if the first operand is false. Similarly,\
    \ in the case of Or operator, compiler will go for the full relation, if the first\
