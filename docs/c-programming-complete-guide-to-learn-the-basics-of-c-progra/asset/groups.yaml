    \ these classes prove to be more than just types because they provide a programmer\
    \ with the capability to develop high-quality software.\n\nIn this chapter, we\
    \ will study the basic concepts of classes. Furthermore, after studying the basic\
    \ principles of classes, we will get to know about defining the class object,\
    \ constructors and destructors.\n\n## 7.1 Classes\n\nWe have studied the concept\
    \ of types in chapter one. Type is a set of operations or values that can be applied\
    \ to another value. In programming, we have declared derived types but we have\
    \ not been able to define any operations that are unique to the type. Classes\
    \ allow us to define a type and to define the operations that are necessary to\
    \ manipulate it as well. Basically, the concept of classes is the one to give\
    \ C++ its uniqueness and strength.\n\nFor example, we should consider a class,\
    \ named as “Alpha”. Within “Fraction”, there is some data, especially an integer\
    \ called “numberN” and an integer called “numberM”. We can also add addition,\
    \ subtraction, multiplication or division in our class as well. We can define\
    \ these operations using functions, these functions are known as methods when\
    \ we define them in a class.\n\nWhen we combine data and operations into an object,\
    \ we use a very basic principle of data programming, i.e. data hiding. Data hiding\
    \ is important because whenever we create a data type, we need to make sure that\
    \ it is protected from any external threat that may destroy the integrity of our\
    \ data.\n\n### Access Specifiers\n\nIn C++, we have three types of access specifiers\
    \ that can be used with class member data or member functions. We will be the\
    \ first two types of access specifiers, i.e. private access specifiers and public\
    \ access specifiers.\n\n### Private Access Specifiers\n\nWhenever a data is declared\
    \ private, it can be accessed only by the functions that exist within the class;\
    \ it cannot be accessed by any non class function that exist in the program. We\
    \ just studied about the concept of data hiding. Data hiding is done by declaring\
    \ that the data in class is private. We have to remember that the data and functions\
    \ in a class are private by default. But it is recommended that we should declare\
    \ them.\n\n### Public Access Specifiers\n\nWhenever a data is declared public,\
    \ it can be accessed by any function that exists in the program. This is useful\
    \ when we want to provide access to the data from outside the class. In C++, public\
    \ access specifiers are used to define which members of the class are accessible\
    \ to external functions.\n\n```cpp\nclass fraction\n{\nprivate:\n    int numerator;\n\
    \    int denominator;\n\npublic:\n    void store(int numer, int denom);\n    void\
    \ print();\n};\n```\n\nThe example above shows a class named `fraction` with two\
    \ private integers `numerator` and `denominator`, and two public methods `store`\
    \ and `print`. When an object of this class is created, memory is allocated for\
    \ its members.\n"
