    # C++ 编程


    尽管有这么多优秀的编程语言，但 C++ 因其作为第一种面向对象编程语言的优势而最受欢迎。


    如今，有几种具有简单语法和用户友好选项的高级语言。尽管如此，程序员无法否 C++ 的重要性，因为它拥有海量的开源库、广泛的应用以及极快的运行时性能。


    本指南旨在为想在 7 天内学习 C++ 的初学者设计。你将在阅读这本书的同时通过编写程序来发现这种语言。


