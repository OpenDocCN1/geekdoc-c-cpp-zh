    \nIn this chapter, we are going to study about how strings are defined and stored.\
    \ After that we will explore the standard string functions that are available\
    \ in C++. Finally, we will get to know about the development of a string class.\n\
    \n## 8.1 Strings\n\nIn general, string is a series of characters treated as one\
    \ unit. Computer Science has long recognized the importance of string, but it\
    \ has not adopted a standard for their implementation.\n\nUsually, all string\
    \ implementations treat a string as a variable-length piece of data. For example,\
    \ one of the most common of all strings: a name, whether of a person, a book,\
    \ a car or whatever, their length varies according to their nature.\n\nIn a nutshell,\
    \ we have a data that may vary in size, how we may accommodate that data in our\
    \ program! For this, we have two options:\n\n- To store that data in fixed length\
    \ object\n- To store that data in variable length object\n\n### Fixed Length String\n\
    \nWhenever we are implementing a fixed length string format, we must first decide\
    \ what size is to make the variable. If we make the size too small, we would not\
    \ be able to store all the data. If we make it too large, we will waste the memory.\n\
    \nAnother possible problem associated with storing variable data in a fixed-length\
    \ data structure is how to differentiate data from non-data. We have to remember\
    \ that values of non-data can not be stored.\n\n### Variable Length String\n\n\
    A more preferred solution is to create a structure that can expand and contract\
    \ to accommodate the data. Thus, to store a person's name that consists of only\
    \ one letter, the structure would provide enough storage for storing one character.\
    \ To store a person's name that consists of thirty characters, the structure would\
    \ expand to provide storage for thirty characters.\n\nIn C++, we have two common\
    \ techniques to use such kind of strings:\n\n### Length-Controlled String\n\n\
    This kind of strings adds a count that specifies the number of characters in a\
    \ string. Typically, the count is a single byte, which provides for strings of\
    \ upto 255 characters. This count is further used by the string manipulation functions\
    \ to determine the actual length of the data.\n\n## Delimited Strings\n\nAnother\
    \ method to identify the end of the string is a delimiter. The main disadvantage\
    \ of the delimiter is that it eliminates one character for being used for the\
    \ data.\n\n## 8.2 C++ Strings\n\nIn C++, string is a variable-length array of\
    \ characters that is delimited by the null character. There is nothing in C++,\
    \ except that an ASCII character to be used in a string.\n\n### Storing Strings\n\
    \nA string is stored in an array of characters. It is terminated by the null character.\
    \ We have to remember the difference between the character stored in memory and\
