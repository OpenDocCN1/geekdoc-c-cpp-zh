    }\nvoid sort(int *data, int size)\n{\n    int beta;\n    for(beta = 0; beta <\
    \ size - 1; beta++)\n    {\n        int charlie;\n        for(charlie = beta +\
    \ 1; charlie < size; charlie++)\n            if(data[beta] > data[charlie])\n\
    \                swap(&data[beta], &data[charlie]);\n    }\n}\nconst int max_int\
    \ = 10;\nint main()\n{\n    int integers[max_int];\n    int o;\n    cout << \"\
    Enter ten integers you want to sort :\" << endl;\n    for(o = 0; o < max_int &&\
    \ cin >> integers[o]; o++);\n    int num = o;\n    sort(integers, num);\n    cout\
    \ << \"Your Sorted data is\" << endl;\n    for (int i = 0; i < num; i++) {\n \
    \       cout << \"Value of array[\" << i << \"] = \";\n        cout << integers[i]\
    \ << endl;\n    }\n    return 0;\n}\n```\n"
