    # Chapter 1: Introduction to C++


    In the following chapter, we will discuss about the evolution of computer programming
    languages and their evolution from machine languages.


    As we know C++ is a high-level language. We''ll discuss the concepts of C++, in
    this chapter. Moreover, you will be able to write your first program, after going
    through this chapter, i.e. "Hello World". Furthermore, you''ll understand the
    concepts of Constants, Variables, Data types and some of the operators that may
    help you writing and understanding a C++ program.


    # 1.1 Background of C++


    C++ is considered a properly structured programming language, that''s why this
    is so popular. C++, as you know, is a high level language because it allows a
    programmer to concentrate on the problem at his hand, without worrying about the
    system that the program may be using. There are many languages who claim to be
    system or machine independent but C++ is one of the best among them.


    Like many other languages, C++ is basically derived from ALGOL, which was the
    first language to have a structure. ALGOL was developed in the early 1960s and
    it made a path for structured programming and its concepts. Very first work in
    ALGOL was done by two scientists name as Guiseppe Jacop and Corrado Bohm. Both
    of them published a research in 1960 which defined a thorough idea of structured
    programming.


    In 1967, a computer scientist named as Martin Richards designed a language designed
    a programming language; named Basic Combined Programming Language aka. BCPL. In
    1970, Ken Thompson developed a language, known as "B". Following him, Dennis Ritchie,
    in 1972, developed the concept of language "C".'
- md: "\nFollowing all the concepts from the languages, ALGOL, BCPL, and C, Bjarne\
    \ Stroustrup, developed C++ in mid 1980s.\n\n## 1.2 C++ Programming\n\nNow, when\
    \ you know about the background of C++, i-guess, you'll be eager to write your\
    \ first program. This section will let you know the basic parts of a C++ program,\
    \ so that you'll be able to write your very first program.\n\n- How to write a\
    \ C++ program\n\nFirst of all, we need to understand, the “Global Declaration”.\
    \ Your program is considered a little world; a world of computer universe. So,\
    \ we may start our program with global declaration.\n\nSecondly, only one function,\
    \ in your program must be named as “main”. Main is the starting of the program,\
    \ after global declaration. Main can have two kinds of code:\n\n- Declaration\n\
    \nDeclaration is considered the data that you may use to justify or write your\
    \ program or function. If you declare something in a function, it'll be known\
    \ as “Local Declaration”. We call them local declarations because they are read,\
    \ only by the function itself.\n\n- Statements\n\nStatements are some commands\
    \ to the machine that is using the program. Statements cause the machine to perform\
    \ the actions, such as adding or subtracting numbers, multiply them, taking their\
    \ average etc.\n\n- Simple Program\n\nWe know that C++ allow us to make declarations\
    \ and statements at the same time, every time, we should write a program, which\
    \ should be well organized so that any other programmer or even the machine could\
    \ understand it fast. This is the reason, we follow the language C's concepts\
    \ of organization. The concept states that one should perform declaration first\
    \ and statements second. Moreover, most of the times, one should use comments\
    \ for the identification of the sections; Declarations and Statements.\n\nA C++\
    \ program is a mixture of two components main (Main) and fun (function). In other\
    \ words, function is called or used by main. Usually, we write the code for the\
    \ “main”, first. After that, we'll code the function and sub functions, in their\
    \ order.\n\nMoving forward, there is another concept; concept of preprocessor\
    \ directives or precompiler directives. These are some statements which give instructions\
    \ to a compiler or processor to execute the program in a unique pattern.\n\nA\
    \ statement which is globally used as a preprocessor directive is, “include”.\
    \ This allows the compiler to extract some data from global libraries, known as\
    \ header files. Without these header files or libraries, you will not be able\
    \ to write even a single program, because it'll be so complex to write the commands\
    \ even for your input or output. Even, you will need an “include” command, to\
    \ write your very first program. This will be used to instruct C++ that you will\
    \ be in need for the input and output libraries, so that you may print your desired\
    \ data to the console screen.\n\n- Hello C++ World\n\nYour first C++ program is\
    \ going to be very straightforward. It will include just one precompiler directive\
    \ and no global or local declaration would be made. It will just display a greeting\
    \ to the user on a console screen. Because this program is not so complex, it\
    \ will contain only two statements; first, to display a greeting, the second one\
    \ would be used to terminate our program.\n\nWe will write the precompiler directive\
    \ in the very beginning of our program. Precompiler directives must start with\
    \ a number sign i.e. “#”, in any C++ program. The syntax for our precompile directive\
    \ would be:\n\n#include <iostream.h>\n\nIn this precompiler directive, we may\
    \ write # first and there should be no space between “#” and “include”. Statement\
    \ “include” will include the concerned library in your program, which will be\
    \ mentioned in the pointed brackets “<>”.\n\nIn the following statement, “iostream”\
    \ is a short form for “input output stream” and “.h” is to represent header file.\n\
    \nMoreover, we’ll use another statement in our program which is:\n\n# using namespace\
    \ std;\n\nFor understanding this statement, we have to consider a classroom with\
    \ a boy and a girl; sharing the same name and class, but having different functions.\
    \ So, when you will call their name, both will respond. The very same confusion\
    \ can be a part of programming, as if there a function named as “poi()” and in\
    \ some other library there is another function named as “poi()”, your compiler\
    \ would not be able to identify your desired function. To overcome this difficulty\
    \ we usually use this statement.\n\nMoving forward, our program’s executable part\
    \ would be starting with a function header, such as:\n\n# int main (void)\n\n\
    For this statement, we have to understand that the “int” states that this specific\
    \ function will send back an integer value to the machine or operating system.\
    \ In the concerned statement, our function’s name is “main” and it has no specific\
    \ parameters, as we have voided the parameter list with “(void)”.\n\nNow, there\
    \ are two more statements, with first, we will be able to print our desired data.\
    \ And with the second, we will be able to terminate the program.\n\ncout << \"\
    Hello world\";\n\nThis statement is used to display or print the desired data,\
    \ in this case “Hello World”. This statement uses an operator “<<\", this operator\
    \ allows us to print or display data in our console. This statement contains inverted\
    \ commas “”. Whatever, you will be writing in these commas, will be displayed\
    \ in your console.\n\nFinally, the program will be terminated with a statement:\n\
    return 0;\n\nThis statement will simply end the program and will hand over the\
    \ control to operating system again.\nNow, if you need to write your program,\
    \ you'll need a compiler first. There are many compilers available, online and\
    \ offline, to execute your code in C++. If you need to compile, you are all set\
    \ to write your first program.\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n    cout << \"Hello world!\";\n    return 0;\n}\n```\n\
    \n## 1.3 Constants\n\nThe concept of constants in programming is very similar\
    \ to the concept of constant in Mathematics. Constants are the values or data\
    \ which remains unchanged during the execution of a code or program.\n\nIn this\
    \ section, we will define different types of constants in programming.\n\n- Integer\
    \ Constants\n\nFirst thing first, integers are stored in binary formation. You'll\
    \ code integers, as you use them in your daily routine, for example you will code\
    \ eight simply as 8.\n\nThe following table will show you different integers,\
    \ their values in programming and their data types\n\n| Value in programming |\
    \ Number | Data Type |\n|---|---|---|\n| 98 | +98 | int |\n| -865 | -865 | int\
    \ |\n| -68495L | -68495 | long int |\n| 984325LU | 984325 | unsigned long int\
    \ |\n\n- Character Constants\n\nWhenever, you'll find an integer, closed between\
    \ two single apostrophes, this would be character constant. Moreover, there is\
    \ a chance that you'll find a backslash \"\\\" between those apostrophes.\nFor\
    \ most machines, ASCII character set is used, i.e.\n\n| ASCII Characters | Symbolic\
    \ Display |\n|---|---|\n| Null character | \"\\0\" |\n| newline | \"\\n\" |\n\
    | horizontal tab | \"\\t\" |\n| alert (bell) | \"\\a\" |\n| backspace | \"\\b\"\
    \ |\n| form feed | \"\\f\" |\n| vertical tab | \"\\v\" |\n| single quote | \"\\\
    \"\" |\n| backslash | \"\\\\\" |\n| carriage return | \"\\r\" |\n"
  mdcn: "\n\n继承了 ALGOL、BCPL 和 C 语言的所有概念，Bjarne Stroustrup 在 20 世纪 80 年代中期开发了 C++。\n\
    \n## 1.2 C++ \n\n现在，当你了解了 C++ 的背景，我想你已经急于编写自己的第一个程序了。本节将让你了解 C++ 程序的基本部分，以便你能够编写出你的第一个程序。\n\
    \n- 如何编写一个 C++ 程序\n\n首先，我们需要理解什么是“全局声明（Global Declaration）”。你的程序被看作一个小世界；一个计算机宇宙。因此，我们可以从全局声明开始我们的程序。\n\
    \n其次，你的程序中必须有一个函数被命名为“main”。Main 是程序的起始点，位于全局声明之后。Main 可以包含两种代码：\n\n- 声明（Declaration）\n\
    \n声明被认为是你可能用于论证或编写你的程序或函数的数据。如果你在函数内部声明了某些内容，它被称为“局部声明（Local Declaration）”。我们称其为局部声明，是因为它们只由函数本身读取。\n\
    \n- 语句（Statements）\n\n语句是发送给运行程序的机器的一些指令。语句导致机器执行操作，例如数字的加减、乘法、取平均值等。\n\n- 简单程序（Simple\
    \ Program）\n\n我们知道 C++ 允许我们同时进行声明和语句。每当我们编写程序时，都应该使其组织得良好，以便任何其他程序员甚至机器都能快速理解它。这就是我们遵循\
    \ C 语言的组织概念的原因。该概念规定应该先执行声明，后执行语句。此外，在大多数情况下，应该使用注释来标识不同的区域：声明和语句。\n\n一个 C++ 程序是两个组成部分\
    \ main（主函数）和 fun（函数）的混合体。换句话说，函数由 main 调用或使用。通常，我们先编写“main”的代码。然后，我们按照顺序编写函数和子函数。\n\
    \n继续向前，还有另一个概念；预处理器指令（preprocessor directives）或预编译指令。这些是一些向编译器或处理器提供指令的语句，以以独特的模式执行程序。\n\
    \n一种被全局用作预处理器指令的语句是“include”。它允许编译器从全局库（称为头文件，header files）中提取某些数据。没有这些头文件或库，你甚至无法编写哪怕一个程序，因为即使是编写输入输出的命令也会变得非常复杂。甚至，你需要一个“include”命令来编写你的第一个程序。这将用于指示\
    \ C++ 你将需要输入输出库，以便你可以将所需的数据打印到控制台屏幕上。\n\n- Hello C++\n\n你的第一个 C++ 程序将非常简单。它将只包含一个预编译指令，且不会进行全局或局部声明。它只会在控制台屏幕上向用户显示问候语。因为这个程序并不复杂，它将只包含两个语句；第一个用于显示问候，第二个用于终止我们的程序。\n\
    \n我们将在程序的最开始编写预编译指令。在任何 C++ 程序中，预编译指令必须以井号即“#”开头。我们的预编译指令语法如下：\n\n#include <iostream.h>\n\
    \n在这一预编译指令中，我们可能先写 #，并且“#”和“include”之间不应该有空格。语句“include”会将相关的库引入你的程序，该库将在尖括号“<>”中注明。\n\
    \n在接下来的语句中，“iostream”是“input output stream”（输入输出流）的缩写，“.h”表示头文件。\n\n此外，我们将在程序中使用另一个语句：\n\
    \n# using namespace std;\n\n为了理解这条语句，我们必须想象一个有一个男孩和一个女孩的教室；他们拥有相同的名字和班级，但有不同的功能。所以，当你叫他们的名字时，两个都会回应。同样的困扰也可能是编程的一部分，例如如果有一个名为“poi()”的函数，而在另一个库中有另一个名为“poi()”的函数，你的编译器将无法识别你想要的函数。为了克服这个困难，我们通常使用这条语句。\n\
    \n继续向前，我们程序的执行部分将从函数头开始，例如：\n\n# int main (void)\n\n对于这条语句，我们必须理解“int”表示该特定函数将向机器或操作系统返回一个整数值。在相关的语句中，我们的函数名是“main”，它没有特定的参数，因为我们用“(void)”放空了参数列表。\n\
    \n现在，还有两条语句，通过第一条，我们能够打印所需的数据；通过第二条，我们能够终止程序。\n\ncout << \"Hello world\";\n\n\
    这条语句用于显示或打印所需的数据，在这种情况下是“Hello World”。这条语句使用了运算符“<<”，该运算符允许我们在控制台中打印或显示数据。这条语句包含双引号\"\
    \"”。你在这些引号内编写的任何内容将显示在你的控制台中。\n\n最后，程序将通过一条语句终止：\nreturn 0;\n\n这条语句将简单地结束程序并将控制权重新交给操作系统。\n\
    现在，如果你需要编写程序，首先需要一个编译器。有许多在线和离线的编译器可供你执行 C++ 代码。如果你需要编译，那么你已经准备好编写你的第一个程序了。\n\n\
    ```cpp\n#include <iostream>\nusing namespace std;\n\nint main() {\n    cout <<\
    \ \"Hello world!\";\n    return 0;\n}\n```\n\n## 1.3 常数（Constants）\n\n编程中的常量与数学中的常量概念非常相似。常量是在代码或执行过程中保持不变的值或数据。\n\
    \n在本节中，我们将定义编程中的不同常量。\n\n- 整数常量（Integer Constants）\n\n首先，整数以二进制形式存储。你会像日常生活中一样编写整数，例如你会将八简单地写为8。\n\
