  - "[PAGE 19]\n\n+   - Programming Constants\n\nIn this part, we are going to understand\
    \ different programming constants, and ways to write and define constants in a\
    \ C++ program. Usually, there are three types of programming constants.\n\n+ \
    \  - Defined Constants\n\nA way to define a constant in a C++ program is to use\
    \ a precompiler statement “define”. Like every other precompiler directive, it\
    \ starts with a “#”. For example, a traditional precompiler directive for “define”\
    \ would be:\n\n```\n#define TABLE_SIZE 150\n```\n\nDefine directives are usually\
    \ placed in the beginning of the program, so that anyone reading your program,\
    \ can find them easily.\n\n+   - Memory Constants\n\nAnother way to code constants\
    \ is by using a memory constant. These constants use a C++ type qualifier to remember\
    \ that the specified data can not be changed.\n\nC++ programming provides us with\
