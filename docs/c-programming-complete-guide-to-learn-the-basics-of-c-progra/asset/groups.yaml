    #  5.2 Arrays and Functions


    Processing arrays in a larger program requires you to be able to pass them to
    functions. We may do it by passing the whole array to a function or by passing
    an individual element.


    +   - Passing Individual Element


    In C++, any individual element can be passed to a function like every other ordinary
    variable. Elements of an array can be passed through a function as long as its
    parameter type matches the function''s parameter type.


    Let''s say we have a function, named as print_squareroot, which receives an integer
    and prints its square root on the console screen. Using array, we can loop array''s
    elements to pass through our function, one by one.


    +   - Passing the Whole Array


    In C++, if we want our desired function to apply on the whole array, we have to
    pass the whole array through function. It would be less efficient as it would
    take more time and a lot of memory.


    We have to remember that the name of an array is a primary expression, whose value
    is determined by the first element of our array. We have to remember these two
    rules, whenever we are passing the whole array to a function.


    +   - We have to call the function just by passing the name of the array.


    +   - In our function''s definition, the formal parameter must have the type,
    array. In this case, we don''t need to specify our array''s size.'
