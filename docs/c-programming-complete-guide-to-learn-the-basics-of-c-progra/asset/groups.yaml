    # Introduction


    C++ is a computer programming language widely used for general-purpose programming.
    It is an extension of C-language. The basic understanding of C++ can be acquired
    from C. That''s why both computer languages are represented as C/C++. Bjarne Stroustrup
    developed this multi-paradigm language in 1979.


    In today''s world, many operating systems use C++ as their basic language. Some
    system drivers, browsers, and games are based on C++ programs. It is a free-form,
    compiled, and statically-typed programming language. Many professionals believe
    that C++ is the most efficient language to achieve the desired results.


    In the “Complete guide to learn the basics of C++ programming in 7 days”, I have
    covered all the essential basic concepts for beginners. It is a step by step guide,
    which makes sure the understanding of all, there is a need to know the structure
    and syntax of C++, along with the basic expressions. Then, it guides the major
    “Functions” such as mathematical manipulation and Standard Library. Moreover,
    there are complete guidance about the selection making of operators and logical
    data, concepts of Arrays, Classes, Pointers, and Strings in C++.


    While there are so many great programming languages, C++ is the most favorite
    owing to have the privilege of the first Object-Oriented Programming language.
    Nowadays, there are several high-level languages with simple syntax.


    # Chapter 1: Introduction to C++


    In the following chapter, we will discuss about the evolution of computer languages
    and their evolution from machine languages.


    As we know C++ is a high-level language. We''ll discuss the concepts of C++, in
    this chapter. Moreover, you will be able to write your first program, after going
    through this chapter, i.e. "Hello World".

