  md: '+   Simple Program


    We know that C++ allow us to make declarations and statements at the same time,
    every time, we should write a program, which should be well organized so that
    any other programmer or even the machine could understand it fast. This is the
    reason, we follow the language C''s concepts of organization. The concept states
    that one should perform declaration first and statements second. Moreover, most
    of the times, one should use comments for the identification of the sections;
    Declarations and Statements.


    A C++ program is a mixture of two components main (Main) and fun (function). In
    other words, function is called or used by main. Usually, we write the code for
    the “main”, first. After that, we''ll code the function and sub functions, in
    their order.


    Moving forward, there is another concept; concept of preprocessor directives or
    precompiler directives. These are some statements which give instructions to a
    compiler or processor to execute the program in a unique pattern.


    A statement which is globally used as a preprocessor directive is, “include”.
    This allows the compiler to extract some data from global libraries, known as
    header files. Without these header files or libraries, you will not be able to
    write even a single program, because it''ll be so complex to write the commands
    even for your input or output. Even, you will need an “include” command, to write
    your very first program. This will be used to instruct C++ that you will be in
    need for the input and output libraries, so that you may print your desired data
    to the console screen.


    +   Hello C++ World


    Your first C++ program is going to be very straightforward. It will include just
    one precompiler directive and no global or local declaration would be made. It
    will just display a greeting to the user on a console screen. Because this program
    is not so complex, it will contain only two statements; first, to display a greeting,
    the second one would be used to terminate our program.'
