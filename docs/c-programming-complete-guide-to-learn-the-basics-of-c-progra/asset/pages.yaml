    # ## 7.1 Classes


    We have studied the concept of types in chapter one. Type is a set of operations
    or values that can be applied to another value. In programming, we have declared
    derived types but we have not been able to define any operations that are unique
    to the type. Classes allow us to define a type and to define the operations that
    are necessary to manipulate it as well. Basically, the concept of classes is the
