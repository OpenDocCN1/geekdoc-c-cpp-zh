  md: '# Chapter 6: Concept of “Pointers” in C++


    We know that every computer have some addressable memory locations. In the past
    chapters, we first assigned identifiers to our data and then manipulated data
    using the same identifiers.


    To overcome this, we may use our data to address directly, but that would mean
    giving up the ease of symbolic names. So, C++ provides you the capability to work
    with addresses symbolically. We can do it using pointers.


    Pointers have many uses in C++, they provides you a very efficient way for accessing
    data. Furthermore, pointers are helpful in manipulating data in arrays. Pointers
    are the basis for dynamic allocation of memory so they are used in functions as
    reference parameters.


    # 6.1 Pointers


    In C++, pointer is not a basic data type. We may call that pointer type is a derived
    data type. We have to keep in mind that a pointer''s value can be stored anywhere
    on available storage on your machine. For understanding and using the set of pointers
    in C++, we have to understand the basic concepts of pointers.


    +   - Pointer Constants


    We read the concept of character constants in chapter one. So, we know that any
    character can have a value and can be stored in our desired variable. We are familiar
    with this concept that the character constant doesn''t have a name but the variable
    has to be declared in our code, with a name.


    As compared to character constant, value of pointer constant cannot be changed.
    We have to keep in mind that we can only use pointer constants, as they are drawn
    from the set of addresses from a machine. Pointer constants exist by themselves.'
