  md: 'When we combine data and operations into an object, we use a very basic principle
    of data programming, i.e. data hiding. Data hiding is important because whenever
    we create a data type, we need to make sure that it is protected from any external
    threat that may destroy the integrity of our data.


    +   * Access Specifiers


    In C++, we have three types of access specifiers that can be used with class member
    data or member functions. We will be the first two types of access specifiers,
    i.e. private access specifiers and public access specifiers.


    +   * Private Access Specifiers


    Whenever a data is declared private, it can be accessed only by the functions
    that exist within the class; it cannot be accessed by any non class function that
    exist in the program. We just studied about the concept of data hiding. Data hiding
    is done by declaring that the data in class is private. We have to remember that
    the data and functions in a class are private by default. But it is recommended
    that we should declare it private by using private access specifiers, even in
    a case where declaration is not necessary. We may also declare a function private.
    Whenever a function is declared private, it can only be called by its own class
    object.


    +   * Public Access Specifier


    When we have to use our data or functions outside of the class, it is declared
    to keep in mind that while public access can technically be declared for both
    data and functions, the rule of data hiding states that we should use public access
    specifier only for functions.


    In general, data is declared private. Whenever, we may want to access that data,
    we can do it by using public functions. However, it is possible to make data public.
    We can do it by using the method of public access specifier and declaring data
    to be public.'
