  md: 'Usually, all string implementations treat a string as a variable-length piece
    of data. For example, one of the most common of all strings: a name, whether of
    a person, a book, a car or whatever, their length vary according to their nature.


    In a nutshell, we have a data that may vary in size, how we may accommodate that
    data in our program! For this, we have two options


    +   - To store that data in fixed length object

    - To store that data in variable length object


    Fixed Length String Whenever we are implementing a fixed length string format,
    we must first decide what size is to make the variable. If we make the size too
    small, we would not be able to store all the data. If we make it too large, we
    will waste the memory.


    Another possible problem associated with storing variable data in a fixed-length
    data structure is how to differentiate data from non-data. We have to remember
    that values of non data can not be stored.


    +   - Variable Length String


    A more preferred solution is to create a structure that can expand and contract
    to accommodate the data. Thus, to store a person''s name that consists of only
    one letter, the structure would provide enough storage for storing one character.
    To To store a person''s name that consists of thirty characters, the structure
    would expand to provide storage for thirty characters.


    In C++, we have two common techniques to use such kind of strings


    +   - Length-Controlled String


    This kind of strings adds a count that specifies the number of characters in a
    string. Typically, the count is a single byte, which provides for strings of upto
    255 characters. This count is further used by the string manipulation functions
    to determine the actual length of the data.'
