  md: '# Chapter 1: Introduction to C++


    In the following chapter, we will discuss about the evolution of computer programming
    languages and their evolution from machine languages.


    As we know C++ is a high-level language. We''ll discuss the concepts of C++, in
    this chapter. Moreover, you will be able to write your first program, after going
    through this chapter, i.e. "Hello World". Furthermore, you''ll understand the
    concepts of Constants, Variables, Data types and some of the operators that may
    help you writing and understanding a C++ program.


    # 1.1 Background of C++


    C++ is considered a properly structured programming language, that''s why this
    is so popular. C++, as you know, is a high level language because it allows a
    programmer to concentrate on the problem at his hand, without worrying about the
    system that the program may be using. There are many languages who claim to be
    system or machine independent but C++ is one of the best among them.


    Like many other languages, C++ is basically derived from ALGOL, which was the
    first language to have a structure. ALGOL was developed in the early 1960s and
    it made a path for structured programming and its concepts. Very first work in
    ALGOL was done by two scientists name as Guiseppe Jacop and Corrado Bohm. Both
    of them published a research in 1960 which defined a thorough idea of structured
    programming.


    In 1967, a computer scientist named as Martin Richards designed a language designed
    a programming language; named Basic Combined Programming Language aka. BCPL. In
    1970, Ken Thompson developed a language, known as "B". Following him, Dennis Ritchie,
    in 1972, developed the concept of language "C".'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Following all the concepts from the languages, ALGOL, BCPL, and C, Bjarne Stroustrup,
    developed C++ in mid 1980s.


    # 1.2 C++ Programming


    Now, when you know about the background of C++, i guess, you''ll be eager to write
    your first program. This section will let you know the basic parts of a C++ program,
    so that you''ll be able to write your very first program.


    +   - How to write a C++ program


    First of all, we need to understand, the “Global Declaration”. Your program is
    considered a little world; a world of computer universe. So, we may start our
    program with global declaration.


    Secondly, only one function, in your program must be named as “main”. Main is
    the starting of the program, after global declaration. Main can have two kinds
    of code:


    +   - Declaration


    Declaration is considered the data that you may use to justify or write your program
    or function. If you declare something in a function, it''ll be known as “Local
    Declaration”. We call them local declarations because they are read, only be the
    function itself.


    +   - Statements


    Statements are some commands to the machine that is using the program. Statements
    cause the machine to perform the actions, such as adding or subtracting numbers,
    multiply them, taking their average etc.'
