  md: '+   * Logical Data in C++


    In C++, we may represent logical data in two manners. Firstly, we may use boolean
    data (bool) with constant identifiers, true and false. On the other hand, we may
    use other data types, such as integers (int) and characters (char) to represent
    logical data. If an item is zero among the data, it would be considered as false.


    +   * Logical Operators


    In C++, we usually have three logical operators. We can use them to combine and
    create logical values such as not, or andand.These operators are shown in table
    below:


    | Operator | Demonstration |

    | ! | not |

    | && | Logical and |

    | || | Logical or |


    +   * Not Operator


    It is a unary operator. Not operator "!" changes a 1 (true) value to o (false)
    or a o (false) to 1 (true).


    +   * And Operator


    It is binary operator. And operator is a binary operator, so that, it has four
    distinct possible combinations of values. In this operator, the resulting value
    is true only if both operands are true.


    +   * Or Operator


    Or Operator "||" is also a binary operator. Like and operator, or operator also
    has four possibilities. But in this operator’s case, the result would be false,
    only if both operands are false.'
