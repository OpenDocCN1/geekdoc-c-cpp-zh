    So, moving towards the point, in this chapter, we will know about how the selection
    is made by a computer program. We have to remember that the choices made by a
    computer are really simple. Computer makes selection in binary form, i.e. 0 and
    1. Typically, 0 is used as false or off and 1 is used as true or on.


