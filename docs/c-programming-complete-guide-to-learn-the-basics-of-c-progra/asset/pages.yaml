  md: '# ## 1.4 Data Type


    A data type defines a set of operations and values that have the ability to apply
    on the concerned values. For example, a switch of a light bulb can be compared
    to a computer system as it has two different values; True as On, and False as
    Off. Since the bulb switch contains just these two values, we can consider its
    size as two. There are just two operations that can be done with a bulb switch:


    +   - We can turn it On

    - We can turn it Off


    In a C++ program, functions have their own unique types. Usually, a function''s
    type is specified by the data it returns. C++ usually contains five standard data
    types:


    +   - void (Void)

    - Int (Integer)

    - char (Character)

    - bool (Boolean)

    - float (Floating Point)


    +   - void (Void)


    In C++, void has no operations or no functions. In simpler words, both the set
    of operations and the set of values are empty. It is a very useful data type in
    programming although it seems unusual. Typically, it is a generic data type that
    can represent any other standard data types.


    +   - int (Integer)


    +   - short (Short Integer)'
