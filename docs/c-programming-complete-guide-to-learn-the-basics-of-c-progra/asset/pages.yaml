  md: 'We will write the precompiler directive in the very beginning of our program.
    Precompiler directives must start with a number sign i.e. “#”, in any C++ program.
    The syntax for our precompile directive would be:


    # #include <iostream.h>


    In this precompiler directive, we may write # first and there should be no space
    between “#” and “include”. Statement “include” will include the concerned library
    in your program, which will be mentioned in the pointed brackets “<>”.


    In the following statement, “iostream” is a short form for “input output stream”
    and “.h” is to represent header file.


    Moreover, we’ll use another statement in our program which is:


    # using namespace std;


    For understanding this statement, we have to consider a classroom with a boy and
    a girl; sharing the same name and class, but having different functions. So, when
    you will call their name, both will respond. The very same confusion can be a
    part of programming, as if there a function named as “poi()” and in some other
    library there is another function named as “poi()”, your compiler would not be
    able to identify your desired function. To overcome this difficulty we usually
    use this statement.


    Moving forward, our program’s executable part would be starting with a function
    header, such as:


    # Int main (void)


    For this statement, we have to understand that the “int” states that this specific
    function will send back an integer value to the machine or operating system.In
    the concerned statement, our function’s name is “main” and it has no specific
    parameters, as we have voided the parameter list with “(void)”.


    Now, there are two more statements, with first, we will be able to print our desired
    data. And with the second, we will be able to terminate the program.'
