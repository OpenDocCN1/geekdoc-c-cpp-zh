- pgno: 479
  md: 'SageMath, or Sage for short, is an open-source mathematical software system
    based on the Python language. Sage is developed by an international community
    of hundreds of teachers and researchers, whose aim is to provide an alternative
    to the commercial products Magma, Maple, Mathematica and Matlab. To reach this
    goal, Sage relies on many open-source programs, including GAP, Maxima, PARI and
    various scientific libraries for Python, to which thousands of new functions are
    added. Sage is freely available and is supported by all modern operating systems.


    For high school students, Sage provides a wonderful scientific and graphical calculator.
    It efficiently supports undergraduate students in their computations in analysis,
    linear algebra, calculus, etc. For graduate students, researchers and engineers,
    Sage provides the most recent algorithms and tools for many domains of mathematics.
    This is why several universities all around the world already use Sage at the
    undergraduate level, including for student internships.


    This book, written by researchers and teachers at different levels (high school,
    undergraduate, graduate) focuses on the underlying mathematics, which is necessary
    to efficiently use Sage. In such a way, it is more a mathematical book illustrated
    by concrete examples with Sage than a reference manual.


    The first part of the book is accessible to high school and undergraduate students.
    The content of the other parts is more suited for graduate students, teachers
    and researchers.


    This book is available under a Creative Commons license. It can be freely downloaded
    from


    http://sagebook.gforge.inria.fr/'
  merge: -1
  img_proc: true
