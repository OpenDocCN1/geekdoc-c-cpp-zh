    **Exercise 8 page 35.** *(Polynomial approximation of the sine function)* We provide
    the vector space \(C^\infty([-\pi,\pi])\) with the dot product \(\langle f|g\rangle=\int_{-\pi}^{\pi}
    f g\). The wanted polynomial is the orthogonal projection of the sine function
    on the vector subspace \(\mathbb{R}_5[X]\). Finding this polynomial reduces to
    the solution of a linear system: indeed, \(P\) is the projection of the sine function
    if and only if the function \((P-\sin)\) is orthogonal to every vector of the
    canonical basis of \(\mathbb{R}_5[X]\). Here is the Sage code:


    ```

    ~~~

    sage: x = var(''x''); ps = lambda f, g : integral(f * g, x, -pi, pi)

    sage: n = 5; a = var(''a0, a1, a2, a3, a4, a5'')

    sage: P = sum(a[k] * x^k for k in (0..n))

    sage: equ = [ps(P - sin(x), x^k) for k in (0..n)]

    sage: sol = solve(equ, a)

    ~~~

