    \ 3, 4], [3, 2, 4], [3, 3, 3]]\n```\n\nThe homogeneous lexicographic order first\
    \ compares terms according to their weight, where the weight is the sum of coefficients,\
    \ and only in the case of equal weights resorts to the lexicographic order:\n\n\
    $$P = (p_0, p_1, \\,\\ldots, p_{n-1}) \\prec_{\\mathrm{lexH}} Q = (q_0, q_1, \\\
    ,\\ldots, q_{n-1})$$\n$$\\Longleftrightarrow \\sum_{k=0}^{n-1} p_k < \\sum_{k=0}^{n-1}\
    \ q_k \\quad\\text{or}\\quad \\left(\\sum_{k=0}^{n-1} p_k = \\sum_{k=0}^{n-1}\
    \ q_k\\text{ and } P \\prec_{\\mathrm{lex}} Q\\right).$$\n\nThis function implements\
    \ the homogeneous lexicographic order:\n\n```\nsage: def homogLex (P, Q):\n....:\
    \     sp = sum (P) ; sq = sum (Q)\n....:     if sp < sq: return int(-1)\n....:\
    \     elif sp > sq: return int(1)\n....:     else: return alpha (P, Q)\n```\n\n\
    ```\nsage: homogLex ([2, 3, 4, 6, 4], [2, 3, 4, 5, 6])\n-1\n```\n\nThe Sage function\
    \ `sorted` is a function in the mathematical sense: it takes as first argument\
    \ a list and returns the corresponding sorted list, without modifying its argument,\
