    **Exercise 33.** Explain the behaviour of the test_poly function defined above.


    More generally, writing polynomials in canonical form requires choosing a way
    to order their monomials. Ordering them by degree is natural for univariate polynomials,
    however for multivariate polynomials, no monomial order is satisfactory in all
    cases. Therefore, Sage allows us to choose between several orders, thanks to the
    order option of PolynomialRing. For example, the deglex order first ranks monomials
    according to their total degree, then by lexicographic order of the degrees of
    indeterminates in case of same total degree:


    ```

    ```

    sage: test_poly(PolynomialRing(QQ, ''x,y'', order=''deglex''))

    x^3 + x^2*y + x*y^2 + y^3 + x^2 + x*y + y^2 + x + y + 1

    ```

    ```


    The main available orders are described in more detail in §9.3.1. We will see
    that the choice of the monomial order does not only determine the output, but
    also matters for some computations.


