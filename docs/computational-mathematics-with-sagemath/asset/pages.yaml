    # 7.3.4 Galois Group


    The Galois group of an irreducible polynomial \(p\in\mathbb{Q}[x]\) is an algebraic
    object which describes some of the “symmetries” of the roots of \(p\). It is a
    central object in the theory of algebraic equations. In particular, the equation
    \(p(x)=0\) is solvable by radicals — i.e., its roots can be expressed from coefficients
    of \(p\) using the four operations and the \(n\)th root — if and only if the Galois
    group of \(p\) is solvable.


    Sage allows the computation of the Galois group of polynomials with rational coefficients
    of moderate degree, and performs several operations on the obtained groups. Both
    Galois theory and the group theory functionalities of Sage go beyond the scope
    of this book. Let us simply apply without more explanations Galois’ theorem on
    the solvability by radicals. The following computation⁴ shows that the roots of
    \(x^5-x-1\) cannot be expressed using radicals:


    ```

    sage: x = polygen(QQ); G = (x^5 - x - 1).galois_group(); G

    Transitive group number 5 of degree 5

    sage: G.is_solvable()

    False

    ```


    It is one of the simplest examples of this situation, since polynomials of degree
    less than or equal to 4 are always solvable by radicals, as well as obviously
    those of the form \(x^5-a\). By looking at the generators of \(G\) seen as a permutation
    group, we recognise that \(G\simeq S_5\), which can be easily verified:


    ```

    sage: G.gens()

    [(1,2,3,4,5), (1,2)]

    sage: G.is_isomorphic(SymmetricGroup(5))

    True

    ```


