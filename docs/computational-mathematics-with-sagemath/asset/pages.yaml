    \ the Devil is Back\n\n**Continuous Version.** We would like to approximate the\
    \ function $f(x)$ by a polynomial $P(x)$ of degree ≤ $n$, on the interval [$\\\
    alpha, \\beta$]. We formulate the least squares problem:\n\n$$\\min_{a_0,\\ldots,a_n\\\
    in\\mathbb{R}} J(a_0,\\ldots,a_n) = \\int_\\alpha^\\beta \\left(f(x)-\\sum_{i=0}^n\
    \ a_i x^i\\right)^2\\,dx.$$\n\nBy differentiating $J(a_0,\\ldots,a_n)$ with respect\
    \ to the coefficients $a_i$, we find that $a_0,\\ldots,a_n$ are solutions of the\
    \ linear system $Ma = F$ where $M_{i,j}=\\int_\\alpha^\\beta x^{i+j}\\,dx$ and\
    \ $F_j=\\int_\\alpha^\\beta x^j f(x)\\,dx$. We immediately see by looking at the\
    \ case $\\alpha=0, \\beta=1$ that $M$ is a Hilbert matrix! However a remedy exists:\
    \ it suffices to use a basis of orthogonal polynomials (for example, for $\\alpha=-1$\
    \ and $\\beta=1$ we obtain Legendre polynomials); then $M$ becomes the identity\
    \ matrix.\n\n**Discrete Version.** We consider $m$ observations $y_1,\\ldots,y_m$\
    \ of a phenomenon at points $x_1,\\ldots,x_m$. We want to fit a polynomial $\\\
    sum_{i=0}^{n-1} a_i x^i$ of degree (at most) $n-1$ among those values, with $n\\\
    leq m$. We thus minimize the functional:\n\n$$J(a_0,\\ldots,a_{n-1}) = \\sum_{j=1}^m\
    \ \\left(\\sum_{i=0}^{n-1} a_i x_j^i-y_j\\right)^2.$$"
