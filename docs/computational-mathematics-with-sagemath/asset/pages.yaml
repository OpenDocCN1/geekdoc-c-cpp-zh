- pgno: 348
  md: 'Note: ybar is the name of the variable $y$ in the quotient ring; for more information
    on quotient rings, see §7.2.2. We continue the calculation of this fraction in
    $R$:


    ```

    ~~~sage

    sage: fraction = - R(Px) / R(Py); fraction

    (1/2*(x - 1/4))*ybar - 1/4/(x - 1/4)

    ~~~

    ```


    We lift the result to $\mathbb{Q}(x)[y]$ and then substitute $z$ and $C(z)$ to
    obtain an expression for $\frac{\partial}{\partial z}C(z)$:


    ```

    ~~~sage

    sage: fraction = fraction.lift(); fraction

    (1/2*(x - 1/4))*y - 1/4/(x - 1/4)

    sage: fraction(x=xz, y=C)

    2*C(z)/(4*z - 1) - 1/(4*z - 1)

    ~~~

    ```


    or, more legibly,


    $$\frac{\partial C(z)}{\partial z} = \frac{1}{1-4z} - \frac{2}{1-4z}C(z).$$


    In this simple case, we can directly deduce from this expression a linear differential
    equation with coefficients in $\mathbb{Q}[z]$:


    ```

    ~~~sage

    sage: eqdiff = diff(C,z) == fraction(x=xz, y=C); eqdiff

    diff(C(z), z) == 2*C(z)/(4*z - 1) - 1/(4*z - 1)

    sage: eqdiff = eqdiff.simplify_rational()

    sage: eqdiff = eqdiff * eqdiff.rhs().denominator()

    sage: eqdiff = eqdiff - eqdiff.rhs()

    sage: eqdiff

    (4*z - 1)*diff(C(z), z) - 2*C(z) + 1 == 0

    ~~~

    ```


    or, more legibly,


    $$\left(1-4z\right)\frac{\partial C(z)}{\partial z} + 2C(z) - 1 = 0.$$


    It is trivial to verify this equation on the closed form:


    ```

    ~~~sage

    sage: Cf = sage.symbolic.function_factory.function(''C'')

    sage: bool(eqdiff.substitute_function(Cf, lambda z: s0(z=z)))

    True

    ~~~

    ```


    In the general case, one continues to calculate successive derivatives of $C(z)$.
    These derivatives are *confined* to the quotient ring $\mathbb{Q}(z)[C]/(P)$,
    which is of finite dimension $\deg P$ over $\mathbb{Q}(z)$. Therefore, one will
    eventually find a linear relation among the first $\deg P$ derivatives of $C(z)$.
    Putting it over a single denominator, we obtain a linear differential equation
    of degree $\leq \deg P$ with coefficients in $\mathbb{Q}[z]$. By extracting the
    coefficient of $z^n$ in the differential equation, we obtain the desired recurrence
    relation on the coefficients; in this case we recover the relation we had already
    found, based on the closed form:


    $$c_{n+1} = \frac{4n-2}{n+1}c_n.$$


    After fixing the correct initial conditions, it becomes possible to calculate
    the coefficients of $C(z)$ recursively:'
