    # 7.1 Polynomial Rings


    # 7.1.1 Introduction


    We have seen in Chapter 2 how to perform computations on *symbolic expressions*,
    elements of the “symbolic ring” SR. Some methods available for these expressions,
    for example degree, are suited for polynomials:


    ```

    sage: x = var(''x''); p = (2*x+1)*(x+2)*(x^4-1)

    sage: print("{} is of degree {}".format(p, p.degree(x)))

    (x^4 - 1)*(2*x + 1)*(x + 2) is of degree 6

    ```


    In some computer algebra systems, like Maple or Maxima, representing polynomials
    as particular symbolic expressions is the usual way to play with them. Like Axiom,
    Magma or MuPAD, Sage also lets you manipulate polynomials in a more algebraic
    way, and “knows” how to compute in rings like \(\mathbb{Q}[x]\) or \(\mathbb{Z}[x,y,z]\).


    Hence, to reproduce the above example in a well-defined polynomial ring, we assign
    to the Python variable \(x\) the *unknown of the polynomial ring in \(x\) with
    rational coefficients*, given by `polygen(QQ, ''x'')`, instead of the *symbolic
    variable* \(x\) returned¹ by `var(''x'')`:


    ```

    sage: x = polygen(QQ, ''x''); p = (2*x+1)*(x+2)*(x^4-1)

    sage: print("{} is of degree {}".format(p, p.degree()))

    2*x^6 + 5*x^5 + 2*x^4 - 2*x^2 - 5*x - 2 is of degree 6

    ```


    We notice that the polynomial is automatically expanded. The “algebraic” polynomials
    are always represented in normal form. This is a crucial difference with respect
    to the polynomials in SR. In particular, when two algebraic polynomials are mathematically
    equal, their computer representation is the same, and a comparison coefficient
    by coefficient is enough to check their equality.


    The available functions on algebraic polynomials are much wider and more efficient
    that those on (polynomial) symbolic expressions.


