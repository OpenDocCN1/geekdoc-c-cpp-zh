    # 17.4 First Applications in Combinatorics


    Now that we have discussed the basics, let us consider a more interesting aspect:
    modelling. In this section we present several optimisation or existence problems:
    starting with their abstract definition, we continue to model each problem as
    a MILP, obtaining in a couple of lines of code an algorithm for an NP-complete
    problem.


    # 17.4.1 Knapsack


    The “knapsack problem” is the following: we have in front of us a collection of
    items having both a weight and a “utility” measured by a real number. We would
    like to choose some of those objects such that the total weight does not exceed
    a given constant C, the best way being to optimise the sum of utilities of the
    objects in the knapsack.


    To achieve this, to each object o of a list L we associate a binary variable taken[o],
    set to 1 if the object is chosen, and 0 otherwise. We are trying to solve the
    following MILP:


    $$\begin{aligned}

    \max\quad & \sum_{o\in L} \mathrm{utility}_o \times \mathrm{taken}_o \\

    \text{such that:}\quad & \sum_{o\in L} \mathrm{weight}_o \times \mathrm{taken}_o
    \leq C.

    \end{aligned}$$


