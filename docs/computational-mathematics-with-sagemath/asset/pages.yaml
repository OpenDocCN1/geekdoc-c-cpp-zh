- pgno: 120
  md: '# ### 5.3.2 Compound Domains


    From well-defined constants, some classes of symbolic objects with variables and
    having a normal form can be constructed. The most important such classes are matrices,
    polynomials, rational functions and truncated power series.


    The corresponding parents are parameterised by their coefficient domain. For example,
    matrices with integer coefficients differ from matrices with coefficients in Z/nZ,
    and the corresponding computation rules are automatically applied, without requiring
    an explicit call to a function reducing integers modulo n.


    Part II of this book is mainly dedicated to these objects.


    **Matrices.** The normal form⁴ of a matrix is obtained when all its coefficients
    are themselves in normal form. As a consequence, a matrix defined over a field
    or ring with normal form is automatically in normal form:


    ```

    sage: a = matrix(QQ, [[1,2,3],[2,4,8],[3,9,27]])

    sage: (a^2 + 1) * a^(-1)

    [ -5 13/2 7/3]

    [  7    1 25/3]

    [  2 19/2   27]

    ```


    The matrix function call is a shortcut. Internally, Sage builds the corresponding
    parent, here the space of 3 × 3 matrices with coefficients in Q (which has normal
    form), then uses it to construct the matrix:


    ```

    sage: M = MatrixSpace(QQ,3,3); M

    Full MatrixSpace of 3 by 3 dense matrices over Rational Field

    sage: a = M([[1,2,3],[2,4,8],[3,9,27]])

    sage: (a^2 + 1) * a^(-1)

    [ -5 13/2 7/3]

    [  7    1 25/3]

    [  2 19/2   27]

    ```


    The operations on symbolic matrices are described in Chapter 8, and on numerical
    matrices in Chapter 13.


    **Polynomials and Fractions.** Like matrices, polynomials in Sage “know” the type
    of their coefficients. Their parents are polynomial rings like Z[x] or C[x, y,
    z], presented in detail in Chapters 7 and 9, and which can be built as follows:


    ```

    sage: P = ZZ[''x'']; P

    Univariate Polynomial Ring in x over Integer Ring

    sage: F = P.fraction_field(); F

    Fraction Field of Univariate Polynomial Ring in x over Integer Ring

    sage: p = P(x+1) * P(x); p

    x^2 + x

    sage: p + 1/p

    ```


    ⁴Do not confuse this concept of normal form with the normal forms of a matrix
    viewed as a linear transformation, which will be discussed in Chapter 8.'
