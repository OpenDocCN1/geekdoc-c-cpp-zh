    \ cycle by the method of generating constraints.\n\n# 17.2  Integer Programming\n\
    \nThere are bad news coming along with this definition of linear programming:\
    \ a linear program (LP) can be solved in polynomial time. This is indeed bad news,\
    \ because this would mean that unless we define LP’s of exponential size, we cannot\
    \ expect to solve NP-complete problems with this method, which would be a disappointment.\
    \ On a brighter side, it becomes NP-complete to solve a linear program if we are\
    \ allowed to specify constraints of a different kind: requiring that all or some\
    \ components of $x$ be integers instead of real values. Such a LP is actually\
    \ called an integer linear program (ILP) or, if only certain components should\
    \ be integers, a Mixed Integer Linear Program (MILP).\n\nSolving ILP or MILP is\
    \ known to be NP-complete. Hence, we can expect to find in the MILP framework\
    \ a wide range of expressivity.\n\n# 17.3  In Practice\n\n# 17.3.1  The MixedIntegerLinearProgram\
