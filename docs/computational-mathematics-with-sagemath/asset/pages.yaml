    \ elements successively produced by the iterator. Technically, an *iterator* is\
    \ an object with a method `next` that returns a new value each time it is called,\
    \ until it is exhausted. For example, the following iterator it:\n\n```\n```\n\
    sage: it = (binomial(3, i) for i in range(4))\n```\n```\n\nreturns successively\
    \ the binomial coefficients $\\binom{3}{i}$ with $i=0,1,2,3$:\n\n```\n```\nsage:\
    \ it.next()\n1\nsage: it.next()\n3\nsage: it.next()\n3\nsage: it.next()\n1\n```\n\
    ```\n\nWhen the iterator is finally exhausted, an exception is raised:\n\n```\n\
    ```\nsage: it.next()\nTraceback (most recent call last):\n  ...\nStopIteration\n\
    ```\n```\n\nMore generally, an *iterable* is a Python object L (a list, a set,\
    \ ...) over whose elements it is possible to iterate. Technically, the iterator\
    \ is constructed by `iter(L)`. In practice, the commands `iter` and `next` are\
    \ used very rarely, since for loops and list comprehensions provide a much more\
    \ pleasant syntax:\n\n```\n```\nsage: for s in Subsets(3): s\n{}\n{1}\n{2}\n{3}\n\
