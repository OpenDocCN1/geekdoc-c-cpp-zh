    **Image and Kernel.** Viewed as a linear transformation Φ, an m × n matrix A defines
    two subspaces of K^m and K^n, respectively the image and the kernel of Φ.


    The image is the set of all vectors in K^m which are a linear combination of the
    columns of A. It is given by the method image, returning a vector space, with
    a basis in reduced echelon form.


    The kernel is the subspace of K^n formed by all vectors x satisfying Ax = 0. A
    basis of this subspace is useful for describing the set of solutions of an underdetermined
    linear system, having an infinite number of solutions: if x̄ is a solution of
    Ax = b and V is the kernel of A, then x̄ + V is the set of all solutions to the
    system. This set is computed by the method right_kernel returning a vector space
    with a basis in reduced echelon form. The left kernel is defined'
