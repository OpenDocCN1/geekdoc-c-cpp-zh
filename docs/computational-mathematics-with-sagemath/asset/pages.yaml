  md: '+   Given a set $\mathcal{F}$ of floating-point numbers, real interval (or
    inf-sup) arithmetic computes with intervals $\mathbf{a} = [a, \overline{a}] =
    \{x \in \mathbb{R}: a \leq x \leq \overline{a}\}$ (with $a$ and $\overline{a}
    \in \mathcal{F}$). In the following we use bold letters to define an interval,
    and use the convention that any number $x \in \mathcal{F}$ is represented by the
    singleton $\mathbf{x} = [x, x]$.


    +   Real ball arithmetic (or mid-rad interval arithmetic): here we consider numbers
    $x \in \mathcal{F}$ and an error bound attached to $x$; balls are sets of the
    form $\{y \in \mathbb{R}: x - \varepsilon \leq y \leq x + \varepsilon\}$. We will
    also use bold letters to denote them.


    As we will see later these families of sets can be extended to the complex plane.
    We just give here a very minimal introduction to this important field; the interested
    reader should consult [Tuc11] for example (from which we adopt the notations).


    Given real valued intervals (or real balls) $\mathbf{a}$ and $\mathbf{b}$, the
    four operations are defined in real valued intervals (or real balls) by:


    $\mathbf{a} * \mathbf{b} = [a * b \text{ for } a \in \mathbf{a} \text{ and } b
    \in \mathbf{b}]$,


    where $*$ stands for one of $+, -, \times, \div$.


    Observe that $\mathbf{a} \div \mathbf{b}$ is not yet defined if $0 \in \mathbf{b}$.
    To get around this, it is necessary to extend $\mathcal{F}$ with the infinite
    values $\pm\infty$, and to consider infinite intervals in one or both directions.
    The following table of examples shows the results for all cases where $0 \in \mathbf{b}$,
    when computing with a class of real intervals:


    | a | b | Remarks | a ÷ b |

    |---|---|---|---|

    | [−1, +1] | [−2, +3] | 0 ∈ a | [−infinity .. +infinity] |

    | [−2, −1] | [−1, 0] | a < 0 | [1.0000000000000000 .. +infinity] |

    | [−2, −1] | [0, +2] | a < 0 | [−infinity .. −0.5000000000000000] |

    | [+2, +3] | [−3, 0] | 0 < a | [−infinity .. −0.6666666666666662] |

    | [+2, +3] | [0, +4] | a > 0 | [0.5000000000000000 .. +infinity] |

    | [−2, −1] | [0] | 0 ∉ a | [−infinity .. +infinity] |

    | [0] | [0] |  | [.. NaN ..] |


    In the following, we always assume that $\mathcal{F}$ contains $+\infty$ and $-\infty$.
    Note that the rounding mode must be chosen so as to guarantee these results: thus,
    when doing arithmetic operations on intervals, one must always round outwards
    the resulting interval.


