  md: '# A.14  Numerical Integration


    Exercise 49 page 316. *(Computation of Newton-Cotes coefficients)*


    +   1. We remark that the degree of \(P_i\) is \(n-1\) (and thus, formula (14.1)
    can be applied) and that \(P_i(j)=0\) for \(j\in\{0,\ldots,n-1\}\) and \(j\ne
    i\), we deduce that


    \[\int_0^{n-1} P_i(x)\,dx=w_iP_i(i)\]


    that is


    \[w_i=\frac{\int_0^{n-1}P_i(x)\,dx}{P_i(i)}.\]


    +   2. Then it is easy to deduce how to compute the weights:


    ```

    ```python

    sage: x = var(''x'')

    sage: def NCRule(n):

    ....:     P = prod([x - j for j in xrange(n)])

    ....:     return [integrate(P / (x-i), x, 0, n-1) \\

    ....:             / (P/(x-i)).subs(x=i) for i in xrange(n)]

    ```

    ```


    +   3. With a simple change of variable, we get:


    \[\int_a^b f(x)\,dx=\frac{b-a}{n-1}\int_0^{n-1}f\!\left(a+\frac{b-a}{n-1}u\right)\,du.\]


    +   4. Applying the preceding formula, we find the following program:


    ```

    ```python

    sage: def QuadNC(f, a, b, n):

    ....:     W = NCRule(n)

    ....:     ret = 0

    ....:     for i in xrange(n):

    ....:         ret += f(a + (b-a)/(n-1)*i) * W[i]

    ....:     return (b-a)/(n-1)*ret

    ```

    ```


    Before comparing this method with others from the precision point of view, we
    can verify that it does not return inconsistent results:


    ```

    ```python

    sage: QuadNC(lambda u: 1, 0, 1, 12)

    1

    sage: N(QuadNC(sin, 0, pi, 10))

    1.99999989482634

    ```

