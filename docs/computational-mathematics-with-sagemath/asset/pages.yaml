    \ this is no surprise. The circle $\\{(x,y)\\in\\mathbb{R}^2\\mid x^2+y^2=1\\\
    }$ projects on $[-1,1]$; however it is clear that any value of $x$ can be “re-injected”\
    \ in the unique equation $x^2+y^2-1=0$, and the obtained equation in $y$ has complex\
    \ solutions. The elimination of $y$ in $C$ corresponds to the projection on the\
    \ first coordinate of the complex circle $\\{(x,y)\\in\\mathbb{C}^2\\mid x^2+y^2=1\\\
    }$, which is $\\mathbb{C}$ altogether.\nThe case of $H$ is a bit more intricate.\
    \ The equation $16x^2y^2=1$ has no solution, even complex, for $x=0$. We have\
    \ then\n\n$V_{\\mathbb{C}}(H\\cap\\mathbb{Q}[x])=\\mathbb{C}\\subseteq\\pi(V_{\\\
    mathbb{C}}(H))=\\mathbb{C}\\setminus\\{0\\}$.\n\nIndeed, the projection of the\
    \ hyperbola, $\\mathbb{C}\\setminus\\{0\\}$, is not an algebraic subvariety. Conclusion:\
