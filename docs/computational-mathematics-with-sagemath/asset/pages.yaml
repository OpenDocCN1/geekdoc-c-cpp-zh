  md: '# **SAGE, Sage, or SageMath?**


    ![](img/99840d73c45ee58b635c4eedc727fd9a_20_0.png)


    **FIGURE 1.1** - The first occurrence of the name Sage, on a handwritten note
    of W. Stein.


    At first, Sage was both an acronym and a reference to the “sage” medicinal plant.
    When the system later expanded to cover much of mathematics, the acronym part
    was dropped. As Sage came to be known in larger circles, and to avoid confusion
    with, for example, the business management software of the same name, the official
    name was changed to SageMath. When the context is unambiguous, for example in
    this book, it is traditional to just use Sage.


    # ## 1.2 Sage as a Calculator


    # ### 1.2.1 First Computations


    In the rest of the book, we present computations in the following form, which
    mimics a command line Sage session:


    ```

    ```

    sage: 1+1

    2

    ```

    ```


    The `sage:` text in the beginning of the first line is the command prompt of the
    system. The prompt (which does not appear in the notebook interface) means that
    Sage awaits a user command. The rest of the line is the command to execute, which
    is validated with the ⟨Enter⟩ key. The lines below are the system’s answer, which
    in general are the results of the computation. Some commands use several lines
    (see Chapter 3). The additional command lines can then be recognised by `...`
    at the beginning of the line. A multi-line command should follow the position
    of linebreaks and the indentation (spaces to align the line with respect to the
    previous one), without copying the initial `....`


    In the notebook, one directly enters the commands in a computation cell, and validates
    by clicking on *evaluate* or using the ⟨Shift⟩+⟨Enter⟩ key combination. The combination
    ⟨Alt⟩+⟨Enter⟩ not only executes the command of the current cell, but also creates
    a new cell just below. One can also create a new cell by clicking in the small
    space just above a given cell, or below the last cell.


    Sage interprets simple formulas like a scientific calculator. The operations +,
    ×, etc. have their usual precedence, and parentheses their common usage:'
