    \ the $x$-axis, thereby dividing the interval $[a,b]$ into two subintervals. As\
    \ in the bisection method, we identify the subinterval containing a solution by\
    \ computing the value of $f$ at the common point of the two subintervals.\n\n\
    The line through the points $(a, f(a))$ and $(b, f(b))$ has equation\n\n$$ y =\
    \ \\frac{f(b)-f(a)}{b-a}(x-a)+f(a). \\tag{12.1} $$\n\nSince $f(b) \\neq f(a)$,\
    \ this line intersects the $x$-axis in the point with $x$-coordinate\n\n$$ a -\
    \ f(a)\\frac{b-a}{f(b)-f(a)}. $$\n\nWe can therefore test this method as follows.\n\
    \n```\n    sage: phi(s, t) = s - f(s) * (t - s) / (f(t) - f(s))\n    sage: falsepos\
