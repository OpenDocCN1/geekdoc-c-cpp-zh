    = 5\), with \(p\) of minimal degree.


    # 7.5  Formal Power Series


    A formal power series is a power series considered as a simple sequence of coefficients,
    without considering convergence. More precisely, if \(A\) is a commutative ring,
    we call formal power series of indeterminate \(x\) with coefficients in \(A\)
    the formal sums \(\sum_{n=0}^{\infty} a_n x^n\) where \((a_n)\) is any sequence
    of elements of \(A\). Together with the natural addition and multiplication operations


    \[\sum_{n=0}^{\infty} a_n x^n + \sum_{n=0}^{\infty} b_n x^n = \sum_{n=0}^{\infty}
    (a_n+b_n)x^n,\]

    \[\left(\sum_{n=0}^{\infty} a_n x^n\right)\left(\sum_{n=0}^{\infty} b_n x^n\right)
    = \sum_{n=0}^{\infty}\left(\sum_{i+j=n} a_i b_j\right)x^n,\]


    the formal power series constitute a ring named \(A[[x]]\).


    In a computer algebra system, these series are useful to represent analytic functions
    for which we have no closed form. As always, the computer performs some computations,
    but it is the user’s responsibility to give them a mathematical meaning. In particular,
    she/he should make sure that the considered series are convergent (if needed).


    Formal power series also appear frequently in combinatorics, in the form of generating
    series. We will see such an example in §15.1.2.'
