    Failing to compute the Gröbner basis over the rational numbers, let us try to
    replace $\mathbb{Q}$ by a finite field $\mathbb{F}_p$. The idea, classical in
    computer algebra, is to limit the cost of operations on coefficients: those on
    elements of $\mathbb{F}_p$ take a constant cost, whereas the number of digits
    of rational numbers tends to increase quite rapidly during computations. We choose
    $p$ small enough such that computations in $\mathbb{F}_p$ can be done directly
    with machine integers. It must not however be too small, so that the Gröbner basis
    on $\mathbb{F}_p$ can share a large part of the structure of that on $\mathbb{Q}$.


    For example, with a convenient $p$, the Gröbner basis of $C_6(\mathbb{F}_p)$ has
    the same number of elements as that of $C_6(\mathbb{Q})$:


    ```

    ```text

    sage: p = previous_prime(2^30)

    sage: len(C(GF(p), 6).groebner_basis())

    45

    ```

    ```


    By increasing the size of the system to solve, we see that the influence of the
    coefficient field on the computing time is far from negligible: the cases $n =
    7$ and $n = 8$ become easy to solve.


