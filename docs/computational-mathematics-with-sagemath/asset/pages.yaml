    # ### 3.3.9 Dictionaries


    Last but not least, Python, and thus Sage, provides the notion of dictionary.
    Like a phone book, a dictionary associates a value to a given key.


    The keys of a dictionary might be of any immutable type: numbers, characters strings,
    tuples, etc. The syntax is like lists, using assignments from the empty dictionary
    dict() which can be written {} too:


    ```

    ```

    sage: D={}; D[''one'']=1; D[''two'']=2; D[''three'']=3; D[''ten'']=10

    sage: D[''two''] + D[''three'']

    5

    ```

    ```


    The above example shows how to add an entry (key,value) to a dictionary, and how
    to access the value associated to a given key via D[...].


    The operator in checks whether a key is in a dictionary, and the commands del
    D[x] or D.pop(x) erase the entry of key x in this dictionary.


    The following example demonstrates how a dictionary can be used to represent a
    function on a finite set:


    E = {a0, a1, a2, a3, a4, a5},    f(a0) = b0,  f(a1) = b1,  f(a2) = b2,

    f(a3) = b0,  f(a4) = b3,  f(a5) = b3.'
