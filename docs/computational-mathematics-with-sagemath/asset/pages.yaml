    # 9.1.2  Polynomials


    Just as univariate polynomials are in the class `Polynomial`, multivariate polynomials
    (in rings with a finite number of variables) are in the class `MPolynomial`¹.
    For the usual base rings (like \(\mathbb{Z}\), \(\mathbb{Q}\) or \(\mathbb{F}_q\)),
    Sage calls the Singular computer algebra system, which is specialised in fast
    polynomial computations. In the other cases, a generic and much slower implementation
    is used.


    Multivariate polynomials are always encoded in sparse representation². Why this
    choice? A dense polynomial with \(n\) variables of total degree \(d\) contains
    \(\binom{n+d}{d}\) monomials: for \(n=d=10\), it amounts to 184 756 coefficients
    to store! It is thus very difficult to manipulate large dense polynomials like
    we do with univariate ones. Besides, even when the polynomials are dense, the
    supports (the exponents of non-zero monomials) encountered in practice have various
    forms. If for example a polynomial with \(n\) variables, dense up to the total
    degree \(d-1\), is represented by a rectangular array \(d\times\cdots\times d\),
    for large \(d\), only about one coefficient over \(n!\) is non-zero. On the contrary,
    the sparse representation by dictionary is well adapted to the shape of the support,
    and also to the monomial order.


    ¹ Contrary to `Polynomial`, this class is not directly available from the command
    line: we have to use its full name. For example, we can check whether an object
    is of type “multivariate polynomial” by `isinstance(p, sage.rings.polynomial.multi_polynomial.MPolynomial)`.


    ² The recursive representation (see sidebar page 130) yields nevertheless partially
    dense polynomials. In the memory representation of a polynomial from \(A[x][y]\),
    each coefficient of \(y^k\) occupies (in general) a space proportional to its
    degree in \(x\), to which we should add a space proportional to the degree in
    \(y\) for the polynomial itself.'
