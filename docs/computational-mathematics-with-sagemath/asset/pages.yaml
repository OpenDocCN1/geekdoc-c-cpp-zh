  md: "The problem becomes harder if one solves the univariate equations numerically,\
    \ which is sometimes necessary due to the cost of operations on algebraic numbers:\n\
    \n```\n~~~\nsage: ys = CDF['y'](Jy.0).roots(); ys\n[(-0.8000000000000002, 1),\
    \ (0.0, 1), (0.8, 1)]\nsage: [CDF['x'](p[y][0]).roots() for p in J.gens()]\n[([(-0.9999999999999999\
    \ - 1.306289919905113e-16*I, 1),\n   (0.6000000000000001 + 1.306289919905113e-16*I,\
    \ 1)],\n  [(-0.6000000000000001 - 3.1350958058172247e-16*I, 1),\n   (2.6000000000000001\
    \ + 3.135095805817224e-16*I, 1)])]\n~~~\n```\n\nHere, by substituting y = -0.8\
    \ into the two generators of J, we find two values of x near ±0.6. How to ensure\
    \ they are approximations of the coordinate x of the same exact solution (x,y)\
    \ ≃ (0.6,−0.8), and not some spurious roots as in the preceding example? This\
    \ phenomenon gets trickier when the number of variables and equations grows. However,\
    \ when the system is triangular, only one equation has to be considered at each\
    \ substitution step, and since this equation is monic, the numerical approximations\
    \ do not change the number of solutions.\n\nLet us continue. For the following\
    \ system, J.variety() computes (exactly) a triangular decomposition of J, then\
    \ finds numerically the real solutions of the obtained system(s). This yields\
    \ a unique real solution:\n\n```\n~~~\nsage: R.<x,y> = QQ[]; J = ideal([ x^7-100*x^2,\
    \ y-x^7+1 ])\nsage: J.variety(RealField(51))\n[{y: 396340.890165545, x: -14.1660266425312}]\n\
    ~~~\n```\n\nYet, by performing the computation exactly until the end, we see there\
    \ are three real solutions, and the value of x in the above numerical solution\
    \ is completely wrong:\n\n```\n~~~\nsage: J.variety(AA)\n[{x: 0.009999999999999035?,\
    \ y: -0.9999999999999990?},\n {x: 0.010000000000000035?, y: -0.9999999999999990?},\n\
    \ {x: 6.305568996413857?, y: 396340.890165545?}]\n~~~\n```\n\nConclusion: the\
    \ triangular decomposition does not solve all problems, and we should be careful\
    \ in the interpretation of approximate computations.\n\nA large number of other\
    \ methods exist to parametrise and approximate the solutions of zero-dimensional\
    \ systems, more or less well suited to a given problem, which are not implemented\
    \ within Sage. Exercise 37 gives an overview of some ideas used.\n\n# ### Advanced\
    \ mathematics\n\n> > Sage also provides many functions for commutative algebra\
    \ and algebraic geometry, which go beyond the scope of this book. We invite the\
    \ interested reader to explore the documentation of the polynomial ideals, and\
    \ that of the `sage.schemes` module. Other functionalities are also available\
    \ through the interfaces of the specialised tools Singular, CoCoA and Macaulay2."
