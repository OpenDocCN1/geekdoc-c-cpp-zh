  md: 'to a linear system, the eigenspaces of a linear transformation or the dimension
    of a subspace all boil down to operations on the corresponding matrices that will
    reveal the property.


    These transformations most often correspond to changes of basis, which from the
    matrix point of view translate into equivalence transformations: B = PAQ^{-1},
    where P and Q are invertible matrices. Two matrices are equivalent if such a transformation
    from one to another exists. One can then form equivalence classes for this relation
    and define normal forms that characterise each equivalence class in a unique manner.
    In the following, we will present most matrix computations in Sage, from the viewpoint
    of two instances of these transformations:


    +   - The left equivalence transformations, of the form B = UA, revealing characteristic
    properties for families of vectors, such as their rank (the number of linearly
    independent vectors), the determinant (the volume of the parallelepiped formed
    by the family of vectors), the rank profile (the first set of vectors forming
    a basis of the space spanned by the family)... Gaussian elimination is the key
    tool for these transformations and the reduced echelon form is the corresponding
    normal form (or the Hermite form over Z).


    +   - Similarity transformations, of the form B = UAU^{-1}, which reveal characteristic
    properties of the matrices representing endomorphisms, like eigenvalues, eigenspaces,
    minimal and characteristic polynomials... The Jordan or Frobenius form, according
    to the underlying domain, will be normal forms for these transformations.


    The Gram-Schmidt orthogonalisation process leads to another decomposition based
    on left equivalence transformations, changing a matrix into a set of orthogonal
    vectors.


