    This chapter covers the numerical computation of integrals (§14.1) and the numerical
    resolution of ordinary differential equations (§14.2) with Sage. We recall the
    theoretical bases of integration methods, then we detail the available functions
    and their usage (§14.1.1).


    We have already seen in §2.3.8 how to compute an integral symbolically with Sage;
    this will only be briefly mentioned in this chapter. This “symbolic-numeric” approach,
    when it is possible, is one of the strengths of Sage, and should be preferred
    because the number of numerical computations performed — and thus the number of
    roundoff errors — is usually less than with purely numerical integration methods.


    For differential equations, we give a quick introduction to the classical resolution
    methods, and after an introductory example (§14.2.1), we describe the functionalities
    of Sage (§14.2.2).


