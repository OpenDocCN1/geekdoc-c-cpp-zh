  md: "In the same vein, we can use automatic completion to interactively “ask” an\
    \ object o which operations can be applied to it:\n\n```\nsage: o.<tab>\no.n\t\
    o.nbits\to.ndigits\no.next_prime\to.next_prime_power\to.next_probable_prime\n\
    o.nth_root\to.numerator\to.numerical_approx\n```\n\nOnce again, it is a form of\
    \ introspection.\n\n# ## 5.2 Elements, Parents, Categories\n\n# ### 5.2.1 Elements\
    \ and Parents\n\nIn the preceding section, we have seen the concept of *class*\
    \ of an object. In practice, it is enough to know that this notion exists; we\
    \ rarely have to explicitly look for the type of an object. However, Sage introduces\
    \ another concept closer to mathematics: the *parent* of an object, that we will\
    \ detail now.\n\nAssume for example that we want to know if an element *a* is\
    \ *invertible*. The answer does not only depend on the element itself, but also\
    \ on the mathematical set *A* it belongs to (and its potential inverse). For example,\
    \ the number 5 is not invertible in the set ℤ of integers, since its inverse 1/5\
    \ is not an integer:\n\n```\nsage: a = 5; a\n5\nsage: a.is_unit()\nFalse\n```\n\
    \nHowever, it is invertible in the set of rational numbers:\n\n```\nsage: a =\
    \ 5/1; a\n5\nsage: a.is_unit()\nTrue\n```\n\nSage gives two different answers\
    \ to that question since, as seen in the above section, the objects 5 and 5/1\
    \ have different classes.\n\nIn some object-oriented computer algebra systems,\
    \ like MuPAD or Axiom, the mathematical set *X* to which *x* belongs (here ℤ or\
    \ ℚ) is simply the class of *x*. Sage follows the approach of the Magma system,\
    \ and defines the set *X* by another object attached to *x*, called its *parent*:\n\
    \n```\nsage: parent(5)\nInteger Ring\nsage: parent(5/1)\nRational Field\n```\n\
    \nWe can obtain these two sets with the following shortcuts:\n\n```\nsage: ZZ\n\
    Integer Ring\n```"
