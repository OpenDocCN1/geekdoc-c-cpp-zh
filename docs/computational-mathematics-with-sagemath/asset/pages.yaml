    the computation of the whole matrix. Within SciPy, it is sufficient to define
    a “linear” operator as being the application \(V \to (F(x_n + hV) - F(x_n))/h\).
    This kind of method is quite often used to solve large non-linear systems. The
    “matrix” being non-symmetric, we will use for example the GMRES method.
