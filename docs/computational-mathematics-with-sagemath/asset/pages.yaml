    whereas the deepcopy function recursively duplicates Python objects at all levels:


    ```

    sage: La = [1, 2, 3] ; L1 = [1, La] ; L2 = deepcopy(L1)

    sage: L1[1][0] = 5; [L1 == L2, L1 is L2, L1[1] is L2[1]]

    [False, False, False]

    ```


    The inverse lexicographic order is defined from the lexicographic order on *n*-tuples
    by reversing the order on each element:


    $$P = (p_0, p_1, \ldots, p_{n-1}) <_{\mathrm{lex\,inv}} Q = (q_0, q_1, \ldots,
    q_{n-1})$$

    $$\Longleftrightarrow \exists r \in \{0, \ldots, n-1\},\quad (p_{r+1}, \ldots,
    p_{n-1}) = (q_{r+1}, \ldots, q_{n-1}) \text{ and } p_r > q_r.$$


    Programming this inverse lexicographic order might be done using the above-defined
    alpha function, which implements the lexicographic order. We have to copy the
    lists $P$ and $Q$ to perform the inversion without modifying the lists. More precisely
    the lexInverse function reverts the *n*-tuples by reverse, and returns the opposite
    of the Python integer corresponding to the wanted comparison: −(P₁ <ₗₑₓ Q₁):


    ```

    sage: def lexInverse (P, Q):

    ....:     P1 = copy(P) ; P1.reverse()

    ....:     Q1 = copy(Q) ; Q1.reverse()

    ....:     return - alpha (P1, Q1)

    ```


    The changes made on a list given as argument of a function are performed on the
    original list, since the functions do not copy arguments which are lists. Thus
    a function that would perform P.reverse(), in place of P1 = copy(P) and P1.reverse(),
    would modify definitively the list $P$; this side effect is usually not wanted.


    The variable $P$ is a local variable of the function, independent from any other
    global variable also called $P$, but this has nothing to do with modifications
    made to a list given as argument of the function.


    The lists in Python and Sage are implemented as dynamic tables, contrary to Lisp
    and OCaml where lists are defined by a head $t$ and a tail list $Q$. The Lisp
    command cons(t,Q) returns a list with head $t$ without modifying the list $Q$,
    whereas in Python, adding an element $e$ to a dynamic table $T$ via T.append(e)
    modifies the table $T$. Both representations have advantages and drawbacks, and
    switching from one to the other is possible, however the efficiency of a given
    algorithm might greatly vary from one representation to the other.


    # 3.3.7 Mutable and Immutable Data Structures


    Lists enable us to construct and manipulate elements that can be modified: they
    are called *mutable* data structures.


    Python also allows to define immutable objects. The immutable data structure corresponding
    to lists is called sequence or tuple, and is denoted with parentheses (...), instead
    of square brackets [...]. A tuple with only one element is defined by adding a
    comma after this element, to distinguish it from mathematical parentheses.'
