  md: '# **The rings A[(x_n, y_n, ...)_{n∈N}]**


    It happens that we do not know, at the beginning of a computation, how many variables
    will be necessary. This makes the use of PolynomialRing rather painful: we first
    have to compute in a first domain, then extend it and convert all elements each
    time we want to introduce a new variable.


    Polynomial rings with an infinite number of variables provide a more flexible
    data structure. Their elements can contain variables in one or several infinite
    families of indeterminates. Each generator of the ring corresponds not only to
    a single variable, but to a family of variables indexed by integers:


    ```

    ~~~

    sage: R.<x,y> = InfinitePolynomialRing(ZZ, order=''lex'')

    sage: p = mul(x[k] - y[k] for k in range(2)); p

    x_1*x_0 - x_1*y_0 - x_0*y_1 + y_1*y_0

    sage: p * x[100]

    x_100 + x_1*x_0 - x_1*y_0 - x_0*y_1 + y_1*y_0

    ~~~

    ```


    We get back to some usual polynomial ring PolynomialRing thanks to the polynomial
    method, which returns the image of an element from InfinitePolynomialRing in a
    sufficiently large ring to contain all elements of the ring with an infinite number
    of variables which have been produced so far. The obtained ring is generally not
    the smallest one with this property.


    As a counterpart of this facility, these rings are less efficient than the rings
    PolynomialRing. Also, their ideals cannot replace those of usual polynomial rings
    for computations on polynomial systems, which is the main topic of this chapter.


    # **9.1.3 Basic Operations**


    Let us fix the terminology. Let R = A[x_1, ..., x_n] be a polynomial ring. We
    call monomial an expression of the form x_1^{α_1} x_2^{α_2} ... x_n^{α_n}, i.e.,
    a product of indeterminates, and we note it x^α in short. The integer n-tuple
    α = (α_1, α_2, ..., α_n) is the exponent of the monomial x^α. A term is a monomial
    multiplied by an element of A, its coefficient.


    Since there is no unique way to order the terms, the elements of R do not have,
    as mathematical objects, a dominant coefficient. However, once an order has been
    chosen at the ring construction, it is possible and useful to define a leading
    monomial, the leftmost one in the writing order. The methods lm, lc and lt of
    a multivariate polynomial return respectively its leading monomial, its leading
    coefficient, and the term they form together:


    ```

    ~~~

    sage: R.<x,y,z> = QQ[]

    sage: p = 7*x*y^2*x^2 + 3*y*x*y^2 + 2*x*y*z + x^3 + 6

    sage: p.lt()

    7*x^2*y^2

    ~~~

    ```


    The arithmetic operations +, -, and *, as well as the methods coefficients, dict,
    and several others, work like their univariate variants. Among the small'
