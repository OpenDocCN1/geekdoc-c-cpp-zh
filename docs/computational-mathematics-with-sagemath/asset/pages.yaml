    \ on elements of these sets.\n\n# 5.3 Domains with a Normal Form\n\nLet us now\
    \ browse some of the parents we will encounter in Sage.\n\nWe have seen in §2.1\
    \ how important normal forms² can be in computer algebra, since they allow to\
    \ determine if two objects are mathematically equal in comparing their normal\
