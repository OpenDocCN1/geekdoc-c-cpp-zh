    # The Inverse Power Method.


    We assume a known approximation $\mu$ of an eigenvalue $\lambda_j$ (with $\mu,\lambda_j\in\mathbb{C}$).
    How can we determine an eigenvector associated to $\lambda_j$?


    We assume that $\forall k\ne j$, $0<|\mu-\lambda_j|<|\mu-\lambda_k|$, and thus,
    $\lambda_j$ is a simple eigenvalue. We then consider $(A-\mu I)^{-1}$, whose largest
    eigenvalue is $(\lambda_j-\mu)^{-1}$, and we apply the power method to this matrix.


    Let us take for example:


    ```

    ```python

    sage: A = matrix(RDF, [[1,3,2], [1,2,3], [0,5,2]])

    ```

    ```


    By calling the method `A.eigenvalues()`, we find the eigenvalues (rounded to 5
    significant digits) `6.3929, 0.56052, -1.9535`. We will search the eigenvector
    associated to the second eigenvalue, starting from an approximation:


    ```

    ```python

    sage: A = matrix(RDF, [[1,3,2], [1,2,3], [0,5,2]])

    sage: mu = 0.56

    sage: AT = A - mu*identity_matrix(RDF,3)

    sage: X = vector(RDF, [1 for i in range(0,A.nrows())])

    sage: lam_old = 0

    sage: for i in range(1,1000):

    .....:     Z = AT.solve_right(X)

    .....:     X = Z/Z.norm()

    .....:     lam = X.dot_product(A*X)

    .....:     s = abs(lam - lam_old)

    .....:     print("{i} s={s} lambda={lam}".format(i=i, s=s, lam=lam))

    .....:     lam_old = lam

    .....:     if s<1.e-10:

    .....:         break

