  md: 'We immediately see that the values u_0, . . . , u_N, approximating u at points
    ih, satisfy a linear system having only 3 non-zero terms per row (and whose matrix
    is symmetric positive definite).


    In dimension 2, we can stick a grid of step h on the unit square, and we obtain
    a pentadiagonal system (with 4/h^2 on the diagonal, and −1/h^2 on the first two
    subdiagonals and on the first two superdiagonals). In dimension 3, if we proceed
    similarly in a cube, we obtain a system where each row has 7 non-zero coefficients.
    We therefore indeed get very sparse matrices.


    **Random Walk on a Large Sparse Graph.** We consider a graph where each vertex
    is linked to a small number of vertices (small with respect to the total number
    of vertices). For example, we can figure out a graph where the vertices are the
    internet pages: each page only links to a small number of other pages (which defines
    the graph edges), but it is clearly a huge graph. A random walk on the graph is
    defined by a stochastic matrix, i.e., a matrix whose coefficients are reals between
    0 and 1, with the sum of coefficients being 1 on each line. We can show that such
    a matrix A has a dominant eigenvalue equal to 1. The stationary distribution of
    the random walk is the (left) eigenvector x associated to the dominant eigenvalue,
    i.e., the vector x satisfying xA = x. One of the most dramatic applications is
    the Pagerank algorithm from Google, where the vector x is used to balance the
    search results.


    # ### 13.3.2 Sparse Matrices in Sage


    Sage gives us the chance to work with sparse matrices, by adding `sparse = True`
    when creating the matrix. It corresponds to a representation as a dictionary (§3.3.9).
    In addition, computations on large sparse matrices with coefficients in `RDF`
    or `CDF` are performed by Sage using the SciPy library, which offers its own classes
    of sparse matrices. In the current situation, there is no interface between the
    sparse matrices of Sage and those of SciPy. We thus have to directly use the SciPy
    objects.


    The available SciPy classes for sparse matrices are:


    +   - a list-of-lists structure (different however from that used by Sage), which
    is quite handy to create and modify matrices, the `lil_matrix` class;

    +   - some immutable structures, which store only non-zero coefficients, and which
    are standard formats in sparse linear algebra (`csr` and `csc` formats).


