  md: 'Written like this, the problem will produce a matrix close to a Hilbert matrix
    and the system will be hard to solve accurately. Yet, we notice that ⟨P,Q⟩ = Σ_{j=1}^n
    P(x_j)·Q(x_j) defines a scalar product on polynomials of degree at most n−1. We
    can thus first construct n polynomials of increasing degrees, orthonormal for
    this scalar product, and then diagonalise the linear system. Remembering⁵ that
    the Gram-Schmidt process reduces to a 3-term recurrence for the computation of
    orthogonal polynomials, we are looking for the polynomial P_{n+1}(x) under the
    form P_{n+1}(x)= xP_n(x) − α_nP_{n−1}(x) − β_nP_{n−2}(x); the orthopoly procedure
    below performs this computation (we represent here polynomials by the list of
    their coefficients: for example [1,−2,3] corresponds to the polynomial 1−2x+3x²).
    Horner’s scheme to evaluate a polynomial yields the following program:


    ```

    ```

    sage: def eval(P,x):

    ....:     if len(P) == 0:

    ....:         return 0

    ....:     else:

    ....:         return P[0]*x*eval(P[1:],x)

    ```

    ```


    We can then encode the scalar product of two polynomials:


    ```

    ```

    sage: def pscal(P,Q,lx):

    ....:     return float(sum(eval(P,s)*eval(Q,s) for s in lx))

    ```

    ```


    and the operation P ← P + aQ for two polynomials P and Q:


    ```

    ```

    sage: def padd(P,a,Q):

    ....:     for i in range(0,len(Q)):

    ....:         P[i] += a*Q[i]

    ```

    ```


    A more careful program should raise an exception when wrongly used; in our case,
    we use the following exception when n > m:


    ```

    ```

    sage: class BadParamsForOrthop(Exception):

    ....:     def __init__(self, degreplusone, npoints):

    ....:         self.deg = degreplusone - 1

    ....:         self.np = npoints

    ....:     def __str__(self):

    ....:         return "degree: " + str(self.deg) + \

    ....:                " nb. points: " + repr(self.np)

    ```

    ```


    The following procedure computes the n orthogonal polynomials:


    ```

    ```

    sage: def orthopoly(n,x):

    ....:     if n > len(x):

    ....:         raise BadParamsForOrthop(n, len(x))

    ....:     orth = [[1./sqrt(float(len(x)))]]

    ....:     for p in range(1,n):

    ....:         nextp = copy(orth[p-1])

    ....:         nextp.insert(0,0)

    ```

