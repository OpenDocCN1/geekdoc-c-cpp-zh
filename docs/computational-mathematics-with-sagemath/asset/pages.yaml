    # ### 13.2.8 Eigenvalues, Eigenvectors


    So far, we have used some direct methods (LU, QR, or Cholesky decompositions),
    which give a solution in a finite number of operations (the four basic arithmetic
    operations, and the square root for the Cholesky decomposition). This *cannot
    hold* for the computation of eigenvalues: indeed (cf. page 294), we can associate
    to every polynomial a matrix whose eigenvalues are the roots of the polynomial,
    and we know there is no explicit formula for the roots of a polynomial of degree
    5 or more, a formula that a direct method would yield. Also, constructing the
    characteristic polynomial to compute its roots would be extremely costly (the
    Faddeev–Le Verrier algorithm allows us to compute the characteristic polynomial
    of a size-n matrix in O(n^4) operations, which is still considered too expensive).
    The numerical methods used to compute eigenvalues and eigenvectors are all iterative.
    Recall also that the singular values of a matrix A are the square roots of the
    eigenvalues of A^t A; consequently there is no direct method to compute the singular
    value decomposition.


    We will thus build sequences converging towards the eigenvalues (and eigenvectors),
    and stop the iterations when close enough to the solution¹.


    ¹In the examples below, we choose a fixed number of iterations, for simplicity.'
