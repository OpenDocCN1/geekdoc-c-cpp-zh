    # 14.2 Solving Ordinary Differential Equations Numerically


    In this section, we are interested in solving ordinary differential equations
    numerically. The available functions in Sage are able to deal with systems of
    the form:


    $\begin{cases}\frac{dy_1}{dt}(t)=f_1(t,y_1(t),y_2(t),\ldots,y_n(t))\\[2pt]\frac{dy_2}{dt}(t)=f_2(t,y_1(t),y_2(t),\ldots,y_n(t))\\\vdots\\\frac{dy_n}{dt}(t)=f_n(t,y_1(t),y_2(t),\ldots,y_n(t))\end{cases}$


    with known initial conditions $(y_1(0), y_2(0), \ldots, y_n(0))$.


    This setting enables us to solve also problems of order larger than 1, by introducing
    auxiliary variables (see the detailed example in §14.2.1). It does not, however,
    allow to represent the system of equations satisfied by Dickman’s $\rho$ function:


    $\begin{cases}u\rho''(u)+\rho(u-1)=0 & \text{for }u\geq 1,\\\rho(u)=1 & \text{for
    }0\leq u\leq 1.\end{cases}$


    Indeed, the tools to solve ordinary differential equations are not suited to such
    an equation (called *with delay*).


    The “one-step” numerical methods all use the same general principle: for a given
    step $h$ and known values of $y(t_0)$ and $y''(t_0)$, we compute an approximation
    of $y(t_0+h)$ from an estimate of $y''(t)$ taken on the interval $[t_0,t_0+h]$.
    The simplest method consists in the approximation:


    $\forall t\in[t_0,t_0+h],\quad y''(t)\approx y''(t_0),$


    $\int_{t_0}^{t_0+h}y''(t)\,dt\approx hy''(t_0),$


    $y(t_0+h)\approx y(t_0)+hy''(t_0).$


    The approximation of $y''$ by a constant on $[t_0,t_0+h]$ reminds us of the rectangle
    quadrature rule. The obtained method is of order 1, i.e., the error made after
    one computation step is $O(h^2)$, assuming $f$ is regular enough. In general a
    method is of order $p$ if the error made on a step of width $h$ is $O(h^{p+1})$.
    The value obtained in $t_1=t_0+h$ is thus used as starting point to make one further
    step, until the desired target.


    This order 1 method, called Euler’s method, is not renowned for its accuracy (as
    the rectangle rule for numerical integration), and some higher order methods'
  merge: -1
