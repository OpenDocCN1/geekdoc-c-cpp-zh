  md: 'with elements of these quotient rings. The ideal \(J_1\) associated to \((S_1)\)
    is built with:


    ```

    ```sage

    sage: R.<x,y> = QQ[]

    sage: J = R.ideal(x^2 + y^2 - 1, 16*x^2*y^2 - 1)

    ```

    ```


    We can then form the quotient of \(K[x]\) by \(J_1\), and project polynomials
    on it, compute with equivalence classes modulo \(J_1\), and “lift” them into representatives:


    ```

    ```sage

    sage: ybar2 = R.quo(J)(y^2)

    sage: [ybar2^i for i in range(3)]

    [1, ybar2, ybar2 - 1/16]

    sage: ((ybar2 + 1)^2).lift()

    3*y^2 + 15/16

    ```

    ```


    There is a theoretical issue here. The elements of \(K[x]/J\) are represented
    in normal form, which is necessary to be able to check the equality between two
    elements. However, this normal form is not easy to define, for the reason already
    mentioned in §9.1.4: the division of a representative of an equivalence class
    \(p + J\) by a principal generator of \(J\), used to compute in \(K[x]/J\), has
    no direct analogue in several variables. Let us admit for now that a normal form
    nevertheless exists, which depends on the order on the elements chosen at the
    ring construction, and builds on a particular system of generators of \(J\) called
    Gröbner basis. Section 9.3 at the end of this chapter defines Gröbner bases and
    shows how to use them in computations. Sage automatically computes Gröbner bases
    when required; however, these computations are sometimes very expensive, in particular
    when the number of variables is large, which might make computations in a quotient
    ring somewhat difficult.


    Let us go back to playing with Sage. When \(p \in J\), the command `p.lift(J)`
    rewrites \(p\) as a linear combination of generators of \(J\) with polynomial
    coefficients:


    ```

    ```sage

    sage: u = (16*y^4 - 16*x^2*y^2 + 1).lift(J); u

    [16*y^2, -1]

    sage: u[0]*J.0 + u[1]*J.1

    16*y^4 - 16*x^2*y^2 + 1

    ```

    ```


    For any polynomial \(p\), the expression `p.mod(J)` gives the normal form of \(p\)
    modulo \(J\), seen as element of \(K[x]\):


    ```

    ```sage

    sage: (y^4).mod(J)

    y^2 - 1/16

    ```

    ```


    Beware: while `J.reduce(p)` is equivalent to `p.mod(J)`, the variant `p.reduce([p1,
    p2, ...])` returns a representative of \(p + J\) which is not necessarily the
    normal form (see §9.3.2):


    ```

    ```sage

    sage: (y^4).reduce([x^2 + y^2 - 1, 16*x^2*y^2 - 1])

    y^4

    ```

    ```


    By combining `p.mod(J)` and `p.lift(J)`, we can decompose a polynomial \(p\) into
    a linear combination of generators of \(J\) with polynomial coefficients, plus
    a remainder which is zero if and only if \(p \in J\).


