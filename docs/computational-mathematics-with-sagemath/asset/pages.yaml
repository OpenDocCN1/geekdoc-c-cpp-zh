    # ### 15.4.3 Species, Decomposable Combinatorial Classes


    In §15.1.2, we showed how to use the recursive definition of binary trees to count
    them efficiently using generating functions. The techniques we used there are
    very general, and apply whenever the sets involved can be defined recursively
    (depending on who you ask, such a set is called a decomposable combinatorial class
    or, roughly speaking, a combinatorial species). This includes all types of trees,
    and also permutations, compositions, block diagrams, etc.


    Here, we illustrate just a few examples using the Sage library on combinatorial
    species:


    ```

    ```sage

    sage: from sage.combinat.species.library import *

    sage: o = var(''o'')

    ```

    ```


