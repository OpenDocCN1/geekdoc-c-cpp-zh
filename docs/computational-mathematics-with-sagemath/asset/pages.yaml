  md: 'Hence, the ideal $J$ is zero-dimensional if and only if the number of points
    under its staircase is finite, and this number of points is the dimension of the
    quotient $K[x]/J$. In this case, the basis returned by the method `normal_basis`
    described in §9.2.5 is simply the set of monomials under the staircase for the
    associated monomial order:


    ```

    ```

    sage: J_lex.normal_basis()

    [y^3, y^2, y, 1]

    sage: J_invlex.normal_basis()

    [x*y, y, x, 1]

    sage: J_drl.normal_basis()

    [y^2, y, x, 1]

    ```

    ```


    Let us notice that the number of monomials under the staircase is independent
    of the monomial order.


    # **Dimension.**


    We are now equipped to give a general definition of the dimension of an ideal:
    $J$ has dimension $d$ when the number of points under the staircase, corresponding
    to monomials of total degree at most $t$, is of order $t^d$ when $t → ∞$. For
    example, the ideal $(16x^2y^2 − 1)$ (Figure 9.6) has dimension 1:


    ```

    ```

    sage: ideal(16*x^2*y^2-1).dimension()

    1

    ```

    ```


    Indeed, the number of monomials $m$ under the staircase such that $deg_x m + deg_y
    m ≤ t$ equals $4t − 2$ for $t ≥ 3$. Likewise, the two ideals of Figure 9.5 have
    respectively dimension 1 and 2. We can show that the dimension does not depend
    on the monomial order, and corresponds — degeneracies excepted — to the “geometric”
    dimension of the associated variety.


    # **Reduced Bases.**


    A finite set of polynomials containing a Gröbner basis is itself a Gröbner basis,
    therefore a non-zero ideal has an infinite number of Gröbner bases. A Gröbner
    basis $G = {g_1, . . . , g_s}$ is called reduced when


    +   - the leading coefficients of $g_i$ are all 1 (and 0 ∉ G);

    +   - and no term of $g_i$ is reducible by the rest of the basis G ∖ {g_i} in
    the sense of the rules (9.10).


    With a fixed monomial order, each ideal has a unique reduced Gröbner basis. For
    example, the reduced Gröbner basis of the ideal (1) is the singleton {1}, whatever
    the monomial order. The reduced Gröbner bases therefore provide a normal form
    for all ideals of $K[x]$.


    A reduced Gröbner basis is minimal in the sense that, if we remove any element,
    what remains is no longer a system of generators of the ideal. Concretely, it
    contains exactly one polynomial per “corner” of the staircase. It can be computed
    from any Gröbner basis $G$ by replacing each element $g ∈ G$ by its remainder
    for the division by G ∖ {g}, and so on while possible. This is what the `interreduced_basis`
    method does. The polynomials reducing to zero are erased.'
