    # ## 11.4 Interval and Ball Arithmetic


    From what we explained above in this chapter, it should be clear that floating-point
    numbers only allow us to compute *approximations* of numerical results, and cannot
    provide proofs. But it turns out that we can compute rigorous *enclosures* of
    the sought quantities. For example, we generally cannot *prove*, computing with
    floating-point numbers, that a real number x_0 is the solution of some equation
    f(x) = 0 but we can *prove* that a solution exists in an interval I = [x, x̄]
    or prove that no solution exists in I.


    The tools for this are *interval arithmetic* and *ball arithmetic*.'
