- pgno: 412
  md: 'of $C$, which enter or leave $S$. If we denote by $\bar{S}$ the set of edges
    having exactly one end in $S$, then we obtain the following formulation (identifying
    the variables $b_{uv}$ and $b_{vu}$):


    max: no objective function


    such that: $\forall u \in V(G),\quad \sum_{uv\in E(G)} b_{uv}=2$


    $\forall S \subseteq V(G),\ \emptyset \ne S \ne V(G),\quad \sum_{e\in\bar{S}}
    v_e \geq 2$


    $b_{uv}$ is a binary variable.


    It would be unlikely that we can directly use the previous formulation to solve
    a Hamiltonian cycle problem, even for a small grid such as the one with $4 \times
    6 = 24$ elements: the constraints over the sets $S$ would be $2^{24}-2=16\,777\,214$.
    On the other hand, the *branch-and-bound* method (or *branch-and-cut*) used by
    linear inequality solvers is well adapted to generating constraints *during* the
    resolution of the linear program¹. Generating constraints for the Hamiltonian
    cycle problem corresponds to the following steps:


    +   - create a linear program — without objective function — having one binary
    variable per edge;

    +   - for each vertex add a constraint imposing a degree 2;

    +   - solve the linear program;

    +   - while the current solution is not a Hamiltonian cycle (it is then a subgraph
    having several connected components), let $S$ be one of its connected components,
    and add the constraint imposing that at least two edges leave $S$.


    Fortunately for us, it is algorithmically fast to verify that the current solution
    is invalid and to generate the corresponding constraint. Using the method of generating
    constraints with Sage, here is how we can solve the Hamiltonian cycle problem
    over our grid:


    ```

    sage: g = graphs.Grid2dGraph(4, 6)

    sage: p = MixedIntegerLinearProgram()

    sage: b = p.new_variable(binary = True)

    ```


    To avoid the difference between the variables $b[u,v]$ and $b[v,u]$, it is convenient
    to create a lambda-function replacing the pair $x,y$ with the set $\{x,y\}$:


    ```

    sage: B = lambda x,y : b[frozenset([x,y])]

    ```


    ¹ This means that it is possible, once the linear program is solved, to add an
    additional constraint and to solve the new linear program using some of the results
    obtained during the previous computation.'
