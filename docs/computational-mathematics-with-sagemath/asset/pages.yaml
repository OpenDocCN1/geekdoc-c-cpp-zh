    # **Exercise 19 page 100.** The floating-point numbers RealField(p), with a precision
    of p bits, all share the same type, but as their parent contains the information
    about precision, the parents of RealField(p) and RealField(q) differ:


    ```

    sage: a = Reals(17)(pi); b = Reals(42)(pi)

    sage: type(a) == type(b)

    True

    sage: parent(a), parent(b)

    (Real Field with 17 bits of precision, Real Field with 42 bits of precision)

    ```


    It is more difficult to find two objects with the same parent but different types.
    Here is an example:


    ```

    sage: a = 0.1; b = 0.1*1

    sage: type(a), type(b)

    (<type ''sage.rings.real_mpfr.RealLiteral''>, <type ''sage.rings.real_mpfr.RealNumber''>)

    sage: parent(a) == parent(b)

    True

    ```


    This example needs some explanation. The type RealLiteral shows that Sage keeps
    a in the form of a character string, not doing any floating-point number conversion
    which would lose its exact value, as 1/10 cannot be represented exactly in binary.
    On the contrary, as b is the result of a computation, it is converted into a floating-point
    number, with the default precision of 53 bits. One can observe the difference
    by computing a − 1/10 and b − 1/10 with a precision of 100 bits:


    ```

    sage: Reals(100)(a)-1/10

    0.0000000000000000000000000000

    sage: Reals(100)(b)-1/10

    5.5511151231257629805595278152e-18

    ```


    Here is a more advanced example where objects with the same parent have different
    possible implementations:


    ```

    sage: E = CombinatorialFreeModule(QQ, [1,2,3])

    sage: H = Hom(E,E); H.rename("H")

    sage: C = E.category(); C

    Category of finite dimensional vector spaces with basis over Rational Field

    sage: phi1 = E.module_morphism(on_basis=lambda i: E.term(i), codomain=E)

    sage: phi2 = E.module_morphism(on_basis=lambda i: E.term(i),

