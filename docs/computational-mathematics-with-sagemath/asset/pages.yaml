    # The Summation of Numerical Series.


    We consider a numerical series with a positive general term \(u_n\). The computation
    of partial sums \(\sum_{i=0}^m u_i\) in a set of floating-point numbers is perturbed
    by rounding errors. The reader can enjoy showing that, if \(u_n\) tends to 0 when
    \(n\) tends to infinity, and if the partial sums remain in the interval of representable
    numbers, then after a certain rank \(m\), the sequence \(\sum_{i=0}^m u_i\) computed
    with rounding is stationary. In short, in the world of floating-point numbers,
    life is simple: series with positive general terms tending to 0 converge, provided
    the partial sums do not grow too much!


    For example, let us look at the harmonic (diverging) series, with general term
    \(u_n=1/n\):


    ```

    ```sage

    sage: def sumharmo(p):

    ....:     RFP = RealField(p)

    ....:     y = RFP(1.); x = RFP(0.); n = 1

    ....:     while x <> y:

    ....:         y = x; x += 1/n; n += 1

    ....:     return p, n, x

    ```

    ```


    Let us test this function with different values for the precision \(p\):


    ```

    ```sage

    sage: sumharmo(2)

    (2, 5, 2.0)

    sage: sumharmo(20)

    (20, 131073, 12.631)

    ```

    ```


    The reader can verify using a sheet of paper and a pencil that, in our toy set
    \(\mathbb{R}_2\) of floating-point numbers, the function converges in 5 iterations
    to the value 2.0. Obviously, the result depends on the precision \(p\), and the
    reader can also verify (always with a pencil...) that for \(n > \beta^p\), the
    computed sum is stationary. However, be careful! With the default precision of
    53 bits and doing \(10^9\) operations per second, it might need \(2^{53}/10^9/3600\)
    hours, that is about 104 days, to reach the stationary value!


    # Improving the Computation of some Recurrences.


    With some care, it is possible to improve some results: here is a useful example.


    It is common to encounter recurrences of the form:


    \[y_{n+1}=y_n+\delta_n,\]'
