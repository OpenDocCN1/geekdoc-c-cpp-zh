    **Exercise 17** (Flow around a cylinder with Magnus effect). We combine a simple
    flow around a cylinder of radius $a$ to a vortex of parameter $\alpha$, which
    modifies the orthoradial velocity component. We work in a coordinate system centered
    on the cylinder, with cylindrical coordinates in the plane $z=0$, i.e., in polar
    coordinates. The velocity components are then:


    $$v_r=v_0\cos(\theta)\left(1-\frac{a^2}{r^2}\right)\qquad\text{and}\qquad v_\theta=-v_0\sin(\theta)\left(1+\frac{a^2}{r^2}\right)+\frac{2\alpha
    a v_0}{r}.$$


    The flow lines (which are identical to trajectories, since the flow is stationary)
    are parallel to the velocity. We search a parametric expression of the flow lines;
    we have thus to solve the differential system:


    $$\frac{dr}{dt}=v_r\qquad\text{and}\qquad\frac{d\theta}{dt}=\frac{v_\theta}{r}.$$


    By using coordinates scaled by the radius $a$ of the cylinder, we may assume $a=1$.
