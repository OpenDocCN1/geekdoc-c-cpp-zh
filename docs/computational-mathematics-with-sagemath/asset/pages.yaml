    To compute an indefinite or definite integral, we use `integrate` as a function
    or method (or its alias `integral`):


    ```

    ```

    sage: sin(x).integral(x, 0, pi/2)

    1

    sage: integrate(1/(1+x^2), x)

    arctan(x)

    ```

