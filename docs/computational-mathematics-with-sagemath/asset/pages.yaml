    |---|---|

    | Ring of integers modulo \(n\) | `IntegerModRing(n)` |

    | Finite field with \(q\) elements | `GF(q)` |

    | Pseudo-primality test | `is_pseudoprime(n)` |

    | Primality test | `is_prime(n)` |


    TABLE 6.1 – Review.


    There are two main classes of primality test. The most efficient are *pseudo-primality*
    tests, and are in general based on forms of Fermat’s Little Theorem, which says
    that if \(p\) is prime, then every integer \(a\) with \(0<a<p\) is an element
    of the multiplicative group \((\mathbb{Z}/p\mathbb{Z})^*\), and hence \(a^{p-1}\equiv
    1\mod p\). One uses small values of \(a\) (2, 3, …) to speed up the computation
    of \(a^{p-1}\mod p\). If \(a^{p-1}\not\equiv 1\mod p\), then \(p\) is certainly
    not prime. If \(a^{p-1}\equiv 1\mod p\), one cannot conclude either that \(p\)
    is or is not prime; we say that \(p\) is a (Fermat) *pseudo-prime to base a*.
    The intuition is that an integer \(p\) which is a pseudo-prime to many bases has
    a greater chance of being prime (but see below). Pseudo-primality tests share
    the property that when they return the verdict False, the number is certainly
    composite, whereas when they return True, no definite conclusion is possible.


    The second class consists of *true primality* tests. These tests always return
    a correct answer, but can be less efficient than pseudo-primality tests, especially
    for numbers that are pseudo-primes to many bases, and in particular for actual
    primes. Many software packages only provide pseudo-primality tests, despite the
    name of the corresponding function (isprime, for example) sometimes leading the
    user to believe that a true primality test is provided. Sage provides two different
    functions: `is_pseudoprime` for pseudo-primality, and `is_prime` for true primality:


    ```

    sage: p = previous_prime(2^400)

    sage: %timeit is_pseudoprime(p)

    625 loops, best of 3: 1.07 ms per loop

    sage: %timeit is_prime(p)

    5 loops, best of 3: 485 ms per loop

    ```


    We see in this example that the primality test is more costly; when possible,
    therefore, one prefers to use `is_pseudoprime`.


    Some primality testing algorithms provide a *certificate*, which allows an independent
    subsequent verification of the result, often more efficiently than the test itself.
    Sage does not provide such a certificate in the current release, but one can construct
    one using Pocklington’s Theorem:


    **THEOREM.** Let \(n>1\) be an odd integer such that \(n-1=FR\), with \(F\geq\sqrt{n}\).
    If for each prime factor \(p\) of \(F\), there exists a such that \(a^{n-1}\equiv
    1\mod n\) and \(a^{(n-1)/p}-1\) is coprime to \(n\), then \(n\) is prime.


    Consider for example \(n=2^{31}-1\). The factorisation of \(n-1\) is \(2\cdot
    3^2\cdot 7\cdot 11\cdot 31\cdot 151\cdot 331\). One can take \(F=151\cdot 331\),
    and \(a=3\) satisfies the condition for both'
