  md: '# Some Methods for Intervals and Balls.


    The following methods do not require further comment:


    ```

    ```sage

    sage: si = sin(RIF(pi))

    sage: si.contains_zero()

    True

    sage: sb = sin(RBF(pi))

    sage: sb.contains_zero()

    True

    ```

    ```


    The standard functions exp, sin, cos, arcsin, arccos, sinh, cosh . . . are all
    defined, and there exist methods to get the centre of an interval, the diameter
    of an interval or a ball, a bisection method which cuts an interval into two almost
    equal ones and so on. Note that the middle of an interval is not always in 𝓕,
    and thus it is not always possible to cut an interval into two equal ones. Here
    is an extreme case where the left sub-interval is a singleton, and the right one
    is identical to the original interval:


    ```

    ```sage

    sage: a = RealIntervalField(30)(1, RR(1).nextabove())

    sage: a.bisection()

    ([1.0000000000 .. 1.0000000000], [1.0000000000 .. 1.0000000019])

    ```

    ```


    For the same reason, the centre and diameter might be inexact:


    ```

    ```sage

    sage: b = RealIntervalField(2)(-1,6)

    sage: b.center(), b.diameter()

    (2.0, 8.0)

    ```

    ```


    It is also possible to build RealBallField() objects from RealIntervalField()
    intervals and conversely:


    ```

    ```sage

    sage: s = RIF(1,2)

    sage: b = RBF(s)

    sage: bpi = RBF(pi)

    sage: ipi = RIF(bpi)

    ```

    ```


    But beware:


    ```

    ```sage

    sage: RIF(RBF(RIF(1,2))) == RIF(1,2)

    False

    sage: RBF(RIF(RBF(pi))) == RBF(pi)

    False

    ```

    ```


    Why that? The reason lies in the different implementations of both classes:


    +   - As already said above, `RealIntervalField(n)` objects are represented by
    pairs of `RealField(n)` numbers, and rely on the MPFI library [RR05].

    +   - The implementation of `RealBallField(n)` objects is different: the ball
    midpoint and its radius are stored, but only the midpoint is stored in full-precision.
    The radius is represented by a floating-point number with fixed-precision significand
    and arbitrary-precision exponent. Generally, a few bits suffice for the radius.
    The implementation in Sage relies on the Arb library [Joh13].'
