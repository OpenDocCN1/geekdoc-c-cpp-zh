    An expanded form is not always optimal. For example, if we build the Vandermonde
    determinant $\prod_{1\leq i<j\leq n}(x_i-x_j)$:


    ```

    sage: prod( (a-b) for (a,b) in Subsets([x1,x2,x3,x4],2) )

    x1^3*x2^2*x3 - x1^2*x2^3*x3 - x1^3*x2*x3^2 + x1*x2^3*x3^2

    + x1^2*x2*x3^3 - x1*x2^2*x3^3 - x1^3*x2^2*x4 + x1^2*x2^3*x4

    + x1^3*x2*x4^2 - x2^3*x3^2*x4 - x1^2*x3^3*x4 + x2^2*x3^3*x4

    + x1^3*x2*x4^2 - x1*x2^3*x4^2 - x1^3*x3^3*x4^2 + x2^3*x3^3*x4^2

    + x1^3*x2*x4^2 - x1*x2^3*x4^2 - x1^3*x3^3*x4^2 + x2^3*x3^3*x4^2

    + x1*x3^3*x4^2 - x2*x3^3*x4^2 - x1^2*x2*x4^3 + x1*x2^2*x4^3

    + x1^2*x3*x4^3 - x2^2*x3*x4^3 - x1*x3^2*x4^3 + x2*x3^2*x4^3

    ```


    we obtain $4! = 24$ terms. The same construct with an expression from SR remains
    under factored form, and is much more compact and readable:


    ```

    sage: x1, x2, x3, x4 = SR.var(''x1, x2, x3, x4'')

    sage: prod( (a-b) for (a,b) in Subsets([x1,x2,x3,x4],2) )

    -(x1 - x2)*(x1 - x3)*(x1 - x4)*(x2 - x3)*(x2 - x4)*(x3 - x4)

    ```


    In addition, a factored representation allows faster gcd computations. However,
    it would be unwise to put automatically every polynomial into factored form, even
    if this is also a normal form, since the factorisation is computationally expensive,
    and makes additions costly.


    In general, depending on the kind of computation, the optimal representation of
    an element is not always its normal form (if it exists). This leads computer algebra
    systems to a compromise with expressions. Some basic simplifications, like the
    reduction of fractions or the multiplication by zero, are done automatically;
    the other transformations are left to the user with the provided specialised commands.


