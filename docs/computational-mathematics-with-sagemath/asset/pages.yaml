  md: '# ## A little bit of theory


    To get the best out of fast operations on polynomials, it is good to have an idea
    of their algorithmic complexity. We briefly discuss this for the reader with some
    algorithmic knowledge. We limit ourselves to the case of dense polynomials.


    Additions, subtractions and other direct operations on coefficients are performed
    in linear time with respect to the degrees of the considered polynomials. Their
    practical efficiency thus depends essentially on the easy access to the coefficients,
    and therefore on the internal data structure.


    The critical operation is multiplication. Indeed, not only is this a basic arithmetic
    operation, but other operations use algorithms whose complexity depends essentially
    on that of multiplication. For example, given two polynomials of degree at most
    n, we can compute their Euclidean division at the cost of O(1) multiplications,
    or their gcd at that of O(log n) multiplications.


    Good news: we know how to multiply polynomials in quasi-linear time. More precisely,
    the best known complexity over any ring is O(n log n log log n) operations in
    the base ring. It relies on generalisations of the famous Schönhage–Strassen algorithm,
    which attains the same complexity for integer multiplication. By comparison, the
    method used by hand to multiply polynomials requires of the order of n^2 operations.


    In practice, the fast multiplication algorithms are competitive for large enough
    degrees, as well as corresponding methods for the division. The libraries called
    by Sage for some kinds of coefficients use such advanced algorithms: this explains
    why Sage is able to efficiently work with polynomials of huge degree on some coefficient
    rings.


    (x + 1)^(10^10), once expanded, is dense, but it is not necessary (nor desirable!)
    to expand it in order to differentiate it or evaluate it numerically.


    Beware however: as opposed to algebraic polynomials, symbolic polynomials (in
    SR) are not attached to a particular polynomial ring, and are not put in canonical
    form. A given polynomial might have a lot of different forms, it is the user''s
    responsibility to perform the needed conversions between them. In the same vein,
    the SR domain groups together all symbolic expressions, without any distinction
    between polynomials and other expressions, but we can explicitly check whether
    a given symbolic expression f is polynomial in the variable x by `f.is_polynomial(x)`.'
