- pgno: 192
  md: '# # 9 Polynomial Systems


    This chapter completes the two preceding ones. The objects we consider are systems
    of equations in several variables, as in Chapter 8. These equations, as in Chapter
    7, are polynomial. Compared to univariate polynomials, those with several variables
    yield nice mathematical properties, but also new difficulties, related in particular
    to the fact that the ring $K[x_1,\ldots,x_n]$ is not principal. The theory of
    Gröbner bases provides tools to overcome this limitation. In the end, we have
    at our disposal powerful methods to study polynomial systems, with uncountable
    applications in various domains.


    A large part of the chapter only requires basic knowledge on multivariate polynomials.
    Some parts are however at the level of a commutative algebra course of third or
    fourth year at university. For more details, a very good and complete reference
    is the book of Cox, Little and O’Shea [CLO07].


    # ## 9.1 Polynomials in Several Variables


    # ### 9.1.1 The Rings $A[x_1,\ldots,x_n]$


    We consider here polynomials in several indeterminates or variables, also called
    multivariate polynomials.


    Similarly to other algebraic structures available in Sage, before being able to
    construct polynomials, we have to define a family of indeterminates living all
    in the same ring. The syntax is almost the same as with a single variable (cf.
    §7.1.1):


    ```

    ```sage

    R = PolynomialRing(QQ, ''x,y,z'')

    x,y,z = R.gens() # gives the tuples of indeterminates

    ```

    ```'
  merge: -1
