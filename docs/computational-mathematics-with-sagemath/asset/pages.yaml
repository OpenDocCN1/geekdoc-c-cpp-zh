    \ between polynomials and integers we have seen in preceding sections.\n\nLike\
    \ the irreducibility test, the factorisation is performed on the base ring. For\
    \ example, the factorisation of a polynomial over the integers contains a constant\
    \ part, itself split into prime factors, and a product of primitive polynomials,\
    \ i.e., whose coefficients are coprime:\n\n```\n    sage: x = polygen(ZZ); p =\
    \ 54*x^4+36*x^3-102*x^2-72*x-12\n    sage: p.factor()\n    2 * 3 * (3*x + 1)^2\
