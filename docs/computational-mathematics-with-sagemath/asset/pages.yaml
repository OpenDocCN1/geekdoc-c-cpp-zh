    Other constructions get trivial adaptations, for example, the derivative method
    takes as parameter the variable with respect to which we want to differentiate.


    # 9.1.4  Arithmetic


    Beyond syntactic and elementary arithmetic operations, available functions in
    Sage are in general limited to polynomials over a field, and sometimes over ℤ
    or ℤ/nℤ. For the rest of this chapter, unless otherwise noted, we will consider
    polynomials over a field.


    The Euclidean division of polynomials makes sense only in one variable. In Sage,
    the `quo_rem` method and the associated operators `//` and `%` remain nonetheless
    defined for multivariate polynomials. The “division with remainder” they compute
    satisfies


    (p//q)*q + (p%q) == p


    and matches the Euclidean division when p and q depend on one variable only, but
    it is not a Euclidean division and it is not canonical. It is however useful when
    the division is exact, or when the divisor is a monomial. In the other cases,
    we will prefer to use `quo_rem` and its variants the `mod` method, described in
    §9.2.3, which reduces a polynomial modulo an ideal while taking into account the
    monomial order of the ring:


    ```

    sage: R.<x,y> = QQ[]; p = x^2 + y^2; q = x + y

    sage: print("({quo})*({q}) + ({rem}) == {p}".format( \\

    .....:     quo=p//q, q=q, rem=p%q, p=p//q*q+p%q))

    (-x + y)*(x + y) + (2*x^2) == x^2 + y^2

    sage: p.mod(q)  # is NOT equivalent to p%q

    2*y^2

    ```'
