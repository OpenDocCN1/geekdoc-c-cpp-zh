    THEOREM. For any $m \times n$ matrix $A$ over a Euclidean ring, there is a unique
    $m \times n$ matrix $H$ in Hermite form and an $m \times n$ unimodular matrix
    $U$, such that $UA = H$.


    Over a field, the Hermite form coincides with the reduced echelon form. Indeed
    all pivots are then invertible, each non-zero row can be divided by its pivot,
    making this pivot equal to one. Then reducing the coefficients above each pivot
    modulo one, means setting them to zero, which produces a reduced echelon form.
    In Sage, there is therefore a unique method, `echelon_form`, which either returns
    the Hermite form or the reduced echelon form depending whether the coefficient
    domain is a Euclidean ring or a field.


    For instance, a matrix with integer coefficients yields the following two distinct
    reduced echelon forms depending on whether the base ring is $\mathbb{Z}$ or $\mathbb{Q}$.


