    Several methods exist in Sage to perform numerical integration, and even if their
    implementations differ technically, they all follow one of the two following principles:


    +   - a polynomial interpolation (in particular the Gauss-Kronrod method);

    +   - a function transformation (double exponential method).


    **Interpolation Methods.** In these methods, we evaluate the function $f$ to integrate
    at a given number $n$ of well-chosen points $x_1, x_2, \dots, x_n$, and we deduce
    an approximation of the integral of $f$ on $[a, b]$ by


    $$

    \int_a^b f(x)\,dx \approx \sum_{i=1}^n w_i f(x_i).

    $$


    The $w_i$ coefficients are the “weights” of the method, which are determined by
    the fact that the method should be exact for any polynomial $f$ of degree less
    or equal to $n - 1$. For fixed points $(x_i)$, the weights $(w_i)$ are uniquely
    determined by this condition. We define the *order* of the method as the maximal
    degree of'
