  md: "**Elimination.** The lexicographic monomial orders have the following fundamental\
    \ property: *if $G$ is a Gröbner basis for the lexicographic order of $J ⊂ K[x_1,\
    \ …, x_n]$, then the $G ∩ K[x_{k+1}, …, x_n]$ are Gröbner bases for the elimination\
    \ ideals*⁸ $J ∩ K[x_{k+1}, …, x_n]$. A lexicographic Gröbner basis splits into\
    \ blocks, the last one of which depends only on $x_n$, the penultimate on $x_n$\
    \ and $x_{n-1}$, and so on⁹.\n\n```\n~~~\nsage: R.<t,x,y,z> = PolynomialRing(QQ,\
    \ order='lex')\nsage: J = R.ideal(t*x*y*z-t, t^2-x^2-y^2-z^2-1, t-x*y)\nsage:\
    \ [u.polynomial(u.variable(0)) for u in J.groebner_basis()]\n[t + x + y + z -\
    \ 1,\n (y + 1)*x + y + z - 1,\n (z - 2)*x + y*z - 2*y - 2*z + 1,\n (z - 2)*y^2\
    \ + (-2*z + 1)*y - z^2 + z - 1]\n~~~\n```\n\nIn this example, the last polynomial\
    \ of the basis only depends on $y$ and $z$. It is preceded by a block of two polynomials\
    \ in $x$, $y$ and $z$, and the first polynomial contains all variables. The successive\
    \ elimination ideals can be seen immediately.\n\nWe have seen how §2.5 that the\
    \ elimination ideals do not provide a perfect description of the ideal. Here,\
    \ the block of polynomials in $z$ only is empty, thus any value of $z$, except\
    \ maybe a finite number, appears as last coordinate of a solution. We are tempted\
    \ to express the possible values of $y$ for each $z$ thanks to the last equation.\
    \ We get two values, except for $z = 2$, for which only $y = −1$ works. Only when\
    \ we get to the preceding equation do we notice that the choice $z = 2$ is contradictory.\
    \ Inversely, again from the last equation, $y = −1$ implies $z = 2$, and is thus\
    \ excluded. It finally occurs that none of the leading terms of the polynomials\
    \ (written in their respective main variable, as in the above Sage output) vanishes\
    \ for $z ≠ 2$.\n\n**Exercise 38** (Trigonometric relations). Write $sin(θ)^6$\
    \ as a polynomial in $u(θ) = sin θ + cos θ$ and $v(θ) = sin(2θ) + cos(2θ)$.\n\n\
    # ### 9.3.5 Computations\n\nWe refer the reader interested in algorithms computing\
    \ Gröbner bases to the reference [CLO07] mentioned in the introduction. In addition,\
    \ the module `sage.rings.polynomial.toy_buchberger` from Sage offers a “pedagogical”\
    \ implementation of Buchberger’s algorithm and various related algorithms, which\
    \ closely follows their theoretical description.\n\nLet us however keep in mind\
    \ that computing a Gröbner basis is expensive both in terms of time and memory,\
    \ and even very expensive in some unlucky cases. Besides, the `groebner_basis`\
    \ method has several options¹⁰ which allow\n\n> \\*For a given $k$, this is true\
    \ more generally for any order such that $i ≤ k < j ⇒ x_i > x_j$. Such an order\
    \ is called a “block order” (see also Table 9.5).\n\n> 9 We thus get a “triangular\
