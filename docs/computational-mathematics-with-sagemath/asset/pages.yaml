    .....: sum(1/k^4, k, 1, infinity),\\

    .....: sum(1/k^5, k, 1, infinity)

    (1/6 π², 1/90 π⁴, ζ(5))

    ```

    ```


    **Example.** (*A formula due to Ramanujan*) Using the first 12 terms of the following
    series, we give an approximation of π and we compare it with the value given by
    Sage.


    $$\frac{1}{\pi}=\frac{2\sqrt{2}}{9801}\sum_{k=0}^{\infty}\frac{(4k)!(1103+26390k)}{(k!)^4\cdot396^{4k}}.$$


    ```

    ```text

    sage: s = 2*sqrt(2)/9801*(sum((factorial(4*k)) * (1103+26390*k) /

    .....:     ((factorial(k))^4 * 396 ^ (4 * k)) for k in (0..11)))

    sage: (1/s).n(digits=100)

    3.141592653589793238462643383279502884197169399375105820974...

    sage: (pi-1/s).n(digits=100)

    -4.36415445739398e-96

    ```

    ```


    We notice that the partial sum of the first 12 terms already yields 95 significant
    digits of π!


    **Example.** (*Convergence of a series*) Let us study the convergence of the series


    $$\sum_{n\geq 0}\sin\left(\pi\sqrt{4n^2+1}\right).$$


    To get an asymptotic expansion of the general term, we use the 2π-periodicity
    of the sine function, so that the sine argument tends to 0:


    $$u_n=\sin\left(\pi\sqrt{4n^2+1}\right)=\sin\left[\pi\left(\sqrt{4n^2+1}-2n\right)\right].$$


    We can then apply the taylor function to this new expression of the general term:


    ```

    ```text

    sage: n = var(''n''); u = sin(pi*(sqrt(4*n^2+1)-2*n))

    sage: taylor(u, n, infinity, 3)

    π/(4 n) - 6π+π³/(384 n³)

    ```

    ```


    We deduce $u_n\sim\frac{\pi}{4n}$. Therefore, by comparison with the series defining
    the Riemann zeta function, the series $\sum_{n\geq0}u_n$ diverges.


    **Exercise 5** (*Asymptotic expansion of a sequence*). It is easy to show (for
    example, using a bijection) that for all $n\in\mathbb{N}$, the equation $\tan
    x=x$ has exactly one solution $x_n$ in the interval $[n\pi,n\pi+\frac{\pi}{2}]$.
    Give an asymptotic expansion of $x_n$ to order 6 in $+\infty$.'
