  md: "For example, it is not difficult to see that if \\((x,y,z)\\) is solution of\
    \ the system (9.1), then so is \\((|x|,|y|,|z|)\\). Let us build the set of \\\
    ((|x|,||y|,|z|)\\) for \\((x,y,z)\\) solution:\n\n```\nsage: Set(tuple(abs(pt[i])\
    \ for i in (xx,yy,zz)) for pt in V)\n{(3, 2, 1)}\n```\n\nAll the values of \\\
    (x\\) (resp. \\(y, z\\)) have thus the same modulus. Even more, we can check that\
    \ the substitution\n\n\\((x,y,z)\\mapsto(\\omega x,\\omega^9 y,\\omega^6 z)\\\
    qquad\\text{where}\\qquad \\omega=e^{2\\pi i/17}\\qquad (9.2)\\)\n\nleaves the\
    \ system invariant. In particular, the last coordinates of the solutions are exactly\
    \ the seventeenth roots of unity, which we check again thanks to the possibility\
    \ to compute exactly with algebraic numbers:\n\n```\nsage: w = QQbar.zeta(17);\
    \ w  # primitive root of 1\n0.93247222940435587 + 0.36124166618715303*I\nsage:\
    \ Set(pt[zz] for pt in V) == Set(w^i for i in range(17))\nTrue\n```\n\nThe solutions\
    \ of the system are therefore the triples \\((3\\omega, 2\\omega^9, \\omega^6)\\\
    ) for \\(\\omega^{17}=1\\). This is much more explicit!\n\n**Exercise 35.** Look\
    \ for real solutions (and not only rational ones) of (9.1), to check directly\
    \ there is only \\((x=3,y=2,z=1)\\). Find again the substitution (9.2), including\
    \ the value 17 for the order of \\(\\omega\\) as root of unity, by a computation\
    \ with Sage.\n\nWe could have reached the same result by examining the minimal\
    \ polynomials of the coordinates of points of \\(V\\). We see indeed that a given\
    \ coordinate has the same minimal polynomial for all solution points, apart from\
    \ \\((3,2,1)\\). The common minimal polynomial of the third coordinates is nothing\
    \ else than the cyclotomic polynomial \\(\\Phi_{17}\\):\n\n```\nsage: set(pt[zz].minpoly()\
    \ for pt in V[:-1])\n{x^16 + x^15 + x^14 + x^13 + x^12 + x^11 + x^10 + x^9 + x^8\
    \ + x^7 + x^6\n    + x^5 + x^4 + x^3 + x^2 + x + 1}\n```\n\nThose of the first\
    \ and second coordinate are respectively \\(3^{16}\\cdot\\Phi_{17}(x/3)\\) and\
    \ \\(2^{16}\\cdot\\Phi_{17}(x/2)\\).\n\n# Closed-Form Expressions.\n\nGetting\
    \ an explicit form of the solutions is thus possible using the exponential notation\
    \ of complex numbers:\n\n```\nsage: def polar_form(z):\n....:     rho = z.abs();\
    \ rho.simplify()\n....:     theta = 2 * pi * z.rational_argument()\n....:    \
    \ return (SR(rho) * exp(I*theta))\nsage: [tuple(polar_form(pt[i]) for i in (xx,yy,zz))\
    \ for pt in V[-3:]]\n[(3*e^(-6/17*I*pi), 2*e^(-14/17*I*pi), e^(-2/17*I*pi)),\n\
