    If $n$ is too large for the explicit calculation of $c_n$, a sequence asymptotically
    equivalent to the sequence of coefficients $c_n$ may be sought. Here again, there
    are generic techniques. The central tool is complex analysis, specifically, the
    study of the generating function around its singularities. In the present instance,
    the singularity is at $z_0 = 1/4$ and one would obtain $c_n \sim \frac{4^{n-1}}{n^{3/2}\sqrt{\pi}}$.


    **Summary.** We see here a general phenomenon of computer algebra: the best *data
    structure* to describe a complicated mathematical object (a real number, a sequence,
    a formal power series, a function, a set) is often an equation defining the object
    (or a system of equations, typically with some initial conditions). Attempting
    to find a closed-form solution to this equation is not necessarily of interest:
    on the one hand, such a closed form rarely exists (e.g., the problem of solving
    a polynomial by radicals), and on the other hand, the equation, in itself, contains
    all necessary information to calculate algorithmically the properties of the object
    under consideration (e.g., a numerical approximation, the initial terms or elements,
    an asymptotic equivalent), or to calculate with the object itself (e.g., performing
    arithmetic on power series). Therefore, instead of solving the equation, we look
    for the equation that describes the object and is best suited to the problem we
    want to solve; see also §2.2.2.


    As we saw in our example, confinement (for example, in a finite dimensional vector
    space) is a fundamental tool for studying such equations. This notion of confinement
    is widely applicable in elimination techniques (linear algebra, Gröbner bases,
    and their algebraic-differential generalisations). The same tool is central in
    algorithms for automatic summation and automatic verification of identities (Gosper''s
    algorithm, Zeilberger''s algorithm, and their generalisations [PWZ96]; see also
    the examples in §2.3.1 and Exercise 56).


    All these techniques and their many generalisations are at the heart of very active
    topics of research: automatic combinatorics and analytic combinatorics, with major
    applications in the analysis of algorithms [FS09]. It is likely, and desirable,
    that they will be progressively implemented in Sage.


    # ## 15.2 Common Enumerated Sets


    # ### 15.2.1 First Example: Subsets of a Set


    Fix a set $E$ of size $n$ and consider the subsets of $E$ of size $k$. We know
    that these subsets are counted by the binomial coefficients $\binom{n}{k}$. We
    can therefore calculate the number of subsets of size $k = 2$ of $E = \{1, 2,
    3, 4\}$ with the function binomial:


    ```

    ~~~

    sage: binomial(4, 2)

    6

    ~~~

    ```'
