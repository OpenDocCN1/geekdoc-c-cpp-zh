    Similarly, the intersection, the product and the quotient of ideals satisfy


    I ∩ J = {p | p ∈ I and p ∈ J}    V(I ∩ J) = V(I) ∪ V(J)

    I · J = {pq | p ∈ I, q ∈ J}    V(I · J) = V(I) ∪ V(J)

    I : J = {p | pJ ⊂ I}    V(I : J) = V(I) ∖ V(J)


    and are computed as indicated in Table 9.3. The notation X̄ designs here the Zariski
    closure of X, i.e., the smallest algebraic variety containing X. For example,
    the curve of Figure 9.1a is the set of zeros of polynomials from C ∩ H, and the
    quotient (C ∩ H) : (4xy − 1) corresponds to the union of the circle with one of
