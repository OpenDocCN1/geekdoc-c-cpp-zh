    aspect_ratio=1, xmin=-1, xmax=3, ymin=-1, ymax=3)`


    To include such a figure in a LaTeX document using the `includegraphics` command,
    one should use the `eps` suffix (encapsulated PostScript) if the document is to
    be compiled with `latex`, and the `pdf` suffix (to be preferred to `png`, to obtain
    a better resolution) if the document is to be compiled with `pdflatex`.


    Let us draw on the same graphics the sine function and its first Taylor polynomials
    at 0.


    ```

    ~~~sage

    sage: def p(x, n):

    ....:     return(taylor(sin(x), x, 0, n))

    sage: xmax = 15 ; n = 15

    sage: g = plot(sin(x), x, -xmax, xmax)

    sage: for d in range(n):

    ....:     g += plot(p(x, 2 * d + 1), x, -xmax, xmax,\

    ....:     color=(1.7*d/(2*n), 1.5*d/(2*n), 1-3*d/(4*n)))

    sage: g.show(ymin=-2, ymax=2)

    ~~~

    ```


    We can also create an animation, to see how the Taylor polynomials approximate
    better and better the sine function when their degree increases. To keep the animation,
