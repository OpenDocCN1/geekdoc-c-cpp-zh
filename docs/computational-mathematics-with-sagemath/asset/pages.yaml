    \ think for instance of the integration of the celestial mechanics ordinary differential\
    \ equations to simulate the solar system: large values (of the distances, of the\
    \ velocities) undergo very small perturbations in the long time [HLW02]. Even\
    \ if it is possible to compute precisely the $δ_n$ terms, rounding errors when\
    \ doing the additions $y_{n+1} = y_n + δ_n$ will introduce important errors.\n\
    \nAs an example, consider the sequence defined by $y_0 = 10^{13}$, $δ_0 = 1$ and\
    \ $δ_{n+1} = aδ_n$ with $a = 1 - 10^{-8}$. The standard, naive, programming way\
    \ to compute $y_n$ is:\n\n```\n    sage: def iter(y,delta,a,n):\n    ....:   \
    \  for i in range(0,n):\n    ....:         y += delta\n    ....:         delta\
    \ *= a\n    ....:     return y\n```\n\nAs we have chosen rational values for $y_0$,\
    \ $δ_0$ and $a$, we can compute the exact value of the iterates with Sage:\n\n\
    ```\n    sage: def exact(y,delta,a,n):\n    ....:     return y*delta*(1-a^n)/(1-a)\n\
    ```\n\nNow, let us compute again 100 000 iterates but with floating-point numbers\
    \ in RDF (for instance), and let us compare the result with the exact value:\n\
    \n```\n    sage: y0 = RDF(10^13); delta0 = RDF(1); a = RDF(1-10^(-8)); n = 100000\n\
    \    sage: ii = iter(y0,delta0,a,n)\n    sage: s = exact(10^13,1,1-10^(-8),n)\n\
    \    sage: print(\"exact - classical summation: %.1f\" % (s-ii))\n    exact -\
    \ classical summation: -45.5\n```\n\nNow, this is the *compensated summation*\
    \ algorithm:\n\n```\n    sage: def sumcomp(y,delta,e,n,a):\n    ....:     for\
