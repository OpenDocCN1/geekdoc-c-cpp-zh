    Recall that we have arbitrary precision real numbers in Sage (and that different
    rounding modes are available); then:


    +   `RealIntervalField(n)` is the set of real intervals with a precision of n
    bits. It is implemented using pairs of numbers from `RealField(n)`. In the default
    case (53 bits of precision) `RealIntervalField()` can be abbreviated by `RIF`.
    We can create a RIF (or a `RealIntervalField(n)`) object from a numeric expression:'
