    There is a traditional dichotomy in mathematics between the *discrete* and the\
    \ *continuous*. Numerical analysis bridges this gap to some extent: a major aspect\
    \ of numerical analysis is the study of questions about real numbers (firmly part\
    \ of the continuous domain) via an experimental point of view, often assisted\
    \ by a computer, which belongs to the discrete domain.\n\nRegarding the solution\
    \ of non-linear equations, numerous natural questions arise beyond the computation\
