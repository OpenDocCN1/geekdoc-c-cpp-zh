    \ each object has its own position, contrary to a set.\n\nA list is defined by\
    \ surrounding its elements with square brackets [...], separated by commas. Assigning\
    \ the triple (10, 20, 30) to the variable L is done as follows, and the empty\
    \ list is defined as:\n\n```\n```\nsage: L = [10, 20, 30]\nsage: L\n[10, 20, 30]\n\
    sage: []\n                          # [] is the empty list\n[]\n```\n```\n\nThe\
