    presence of perturbations such as those introduced by the inexact arithmetic of
    the floating-point numbers.


    Let us consider an algorithm F which, from some data d, computes x = F(d). This
    algorithm can only be used if it does not increase the errors on d too much: to
    a perturbation ε of d corresponds a perturbed solution xε = F(d + ε). It is absolutely
    necessary that the error xε − x introduced depends only moderately on ε (in a
    continuous way, does not grow too fast, ...); all numerical algorithms must have
    stability properties to be usable. In Chapter 13, we will explore the stability
    problems for the algorithms used in numerical linear algebra.


    Let us also remark that some computations are definitely not possible in finite
    precision, like for example the sequence given in Exercise 42: every perturbation,
    however small, will lead the sequence to converge to a wrong value. This is a
    typical instability for the solution of a problem: the experimental study of a
    sequence with floating-point numbers should be performed with great care.


    The reader might find that performing computations with floating-point numbers
    is hopeless, but this opinion should be moderated: an overwhelming part of available
    computing resources is used to perform computations in these sets of numbers:
    the approximate solution of partial differential equations, optimisation or signal
    processing, etc. Floating-point numbers should be used with care, but they did
    not prevent the development of computing and its applications: rounding errors
    do not limit the validity of numerical weather forecasts, to give only one obvious
    example.


    Interval arithmetic seems to appear first in the works of Ramon E. Moore in 1966
    [Moo66] (even if the idea appears before the computer era), but new software developments
    (such as MPFI and Arb used by Sage) as well as some spectacular applications draw
    attention to it: some famous old mathematical conjectures have proofs which rely
    at least partially on interval computations. For example, we may mention the Kepler
    conjecture in 1998 by Thomas C. Hales, or the ternary Goldbach problem by Harald
    A. Helfgott in 2013.'
