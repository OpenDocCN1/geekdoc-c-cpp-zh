    A^{d-1}u$. We can write this linear dependence relation as


    $$A^d u = \sum_{i=0}^{d-1} \alpha_i A^i u.$$


    The polynomial $\varphi_{A,u}(x) = x^d - \sum_{i=0}^{d-1} \alpha_i x^i$, satisfying
    the relation $\varphi_{A,u}(A)u = 0$ is therefore a monic polynomial annihilating
    the Krylov sequence, of minimal'
