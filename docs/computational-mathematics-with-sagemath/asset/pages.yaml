    ```sage

    sage: x, h, a = var(''x, h, a''); f = function(''f'')

    sage: g(x) = taylor(f(x), x, a, 3)

    sage: phi(h) = (g(a+3*h) - 3*g(a+2*h) + 3*g(a+h) - g(a)) / h^3; phi(h)

    diff(f(a), a, a, a)

    ```

    ```


    The function $g$ differs from $f$ by a rest which is negligible compared to $h^3$;
    thus the function $\phi$ differs from the quotient by $o(1)$; consequently $\phi$
    has the wanted limit at $0$. As a conclusion,


    $$\lim_{h\to 0}\frac{1}{h^3}\bigl(f(a+3h)-3f(a+2h)+3f(a+h)-f(a)\bigr)=f''''''(a).$$


    This formula allows an approximate computation of the third derivative of $f$
    without doing any derivation.


    We can conjecture that the formula can be generalised in the following form:


    $$\lim_{h\to 0}\frac{1}{h^n}\left(\sum_{k=0}^{n}(-1)^{n-k}\binom{n}{k}f(a+kh)\right)=f^{(n)}(a).$$


    To verify this formula for larger values of $n$, we can easily adapt the preceding
    computation:


    ```

    ```sage

    sage: n = 7; x, h, a = var(''x h a''); f = function(''f'')

    sage: g(x) = taylor(f(x), x, a, n)

    sage: sum((-1)^(n-k) * binomial(n,k) * g(a+k*h) for k in (0..n)) / h^n

    diff(f(a), a, a, a, a, a, a, a)

    ```

    ```


    # **Exercise 4 page 31.** *(A formula due to Gauss)*


    +   1. We use successively `trig_expand` and `trig_simplify`:


    ```

    ```sage

    sage: theta = 12*arctan(1/38) + 20*arctan(1/57) \

    ....:     + 7*arctan(1/239) + 24*arctan(1/268)

    sage: tan(theta).trig_expand().trig_simplify()

    1

    ```

    ```


    +   2. The arc-tangent function is concave on $[0,+\infty[$, thus $\forall x\ge
    0$, $\arctan x\le x$.


    ```

    ```sage

    sage: 12*(1/38) + 20*(1/57) + 7*(1/239) + 24*(1/268)

    37735/48039

    ```

    ```


    From this we deduce:


    $$\theta = 12\arctan\frac{1}{38}+20\arctan\frac{1}{57}+7\arctan\frac{1}{239}+24\arctan\frac{1}{268}$$

    $$\le 12\cdot\frac{1}{38}+20\cdot\frac{1}{57}+7\cdot\frac{1}{239}+24\cdot\frac{1}{268}$$

    $$=\frac{37735}{48039}<\frac{\pi}{2}.$$


    Thus $0<\theta<\pi/2$; also (cf. question 1) $\tan\theta=1=\tan\frac{\pi}{4}$
    and $\tan$ is injective on $[0,\pi/2]$. We deduce that $\theta=\frac{\pi}{4}$.'
