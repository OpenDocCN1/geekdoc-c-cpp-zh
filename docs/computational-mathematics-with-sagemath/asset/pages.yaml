    # 6.3  Factorisation and Discrete Logarithms


    One says that an integer $a$ is a square, or a quadratic residue, modulo $n$ if
    there exists $x$ such that $a \equiv x^2 \pmod n$. If not, one says that $a$ is
    a quadratic non-residue³ modulo $n$. When $n=p$ is prime, there is a test to decide
    efficiently whether $a$ is a quadratic residue, using the computation of the Jacobi
    symbol of $a$ and $p$, denoted $(a|p)$, which takes the values $\{-1,0,1\}$, where
    $(a|p)=0$ when $a$ is a multiple of $p$, and $(a|p)=1$ respectively $(a|p)=-1$
    when $a$ is (respectively, is not) a square modulo $p$. The complexity of computing
    the Jacobi symbol $(a|n)$ is essentially the same as that of computing the gcd
    of $a$ and $n$, namely $O(M(\ell)\log \ell)$ where $\ell$ is the size of $n$,
    and $M(\ell)$ is the cost of multiplying two integers of size $\ell$. However,
    implementations of Jacobi symbols — as of gcds — do not all have this complexity
    (here, `a.jacobi(n)` computes $(a|n)$):


    ```

    ```text

    sage: p = (2^42737+1)//3; a = 3^42737

    sage: %timeit a.gcd(p)

    125 loops, best of 3: 4.3 ms per loop

    sage: %timeit a.jacobi(p)

    25 loops, best of 3: 26.1 ms per loop

    ```

    ```


    When $n$ is composite, finding solutions to $x^2 \equiv a \pmod n$ is as hard
    as factorising $n$. Moreover, the Jacobi symbol, which is relatively simple to
    compute, only gives partial information: if $(a|n)=-1$ then there is no solution,
    since the existence of a solution implies $(a|p)=1$ for all prime factors $p$
    of $n$, hence $(a|n)=1$; but $(a|n)=+1$ does not imply that $a$ is a square modulo
    $n$ when $n$ is composite.


    ³This terminology is traditional, though “non-quadratic residue” would be more
    logical.'
