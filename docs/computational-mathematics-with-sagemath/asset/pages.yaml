  md: '# ### 11.3.2 Rounding


    How to approach a number which cannot be represented exactly in a set of floating-point
    numbers? There exist different possibilities to define rounding:


    +   - in the direction of the nearest representable number: this is what is done
    in the set `RDF`, and it is the default behaviour of the sets created by `RealField`.
    For a number exactly in the middle of two representable numbers, rounding is done
    at the nearest even significand;

    +   - in the direction of −∞: for this, use `RealField(p,rnd=''RNDD'')` to obtain
    this behaviour with a precision of p bits;

    +   - in the direction of zero: `RealField(p,rnd=''RNDZ'')`;

    +   - in the direction of +∞: `RealField(p,rnd=''RNDU'')`.


    # ### 11.3.3 Some Properties


    Rounding, which is necessary for the sets of floating-point numbers, gives rise
    to many unexpected effects. Let us explore some of them:


    **A Dangerous Phenomenon.** Known as *catastrophic cancellation* it is the loss
    of precision which results from the subtraction of two very close numbers; more
    exactly, it is an amplification of the errors:


    ```

    ```

    sage: a = 10000.0; b = 9999.5; c = 0.1; c

    0.100000000000000

    sage: a1 = a+c # add a small perturbation to a.

    sage: a1-b

    0.600000000000364

    ```

    ```


