    # ### 1.2.4 Python Variables


    To save the result of a computation, one *assigns* it to a *variable*:


    ```

    ```

    sage: y = 1 + 2

    ```

    ```


    to reuse it later on:


    ```

    ```

    sage: y

    3

    sage: (2 + y) * y

    15

    ```

    ```


    Note that the result of a computation is not automatically printed when it is
    assigned to a variable. Therefore, we will do the following to also print it,


    ```

    ```

    sage: y = 1 + 2; y

    3

    ```

    ```


    The `;` character separating several instructions on the same line. Since the
    computation of the result is done before the assignment, one can reuse the same
    variable:


    ```

    ```

    sage: y = 3 * y + 1; y

    10

    sage: y = 3 * y + 1; y

    31

    sage: y = 3 * y + 1; y

    94

    ```

    ```


    Additionally, Sage saves the last three results in the special variables `_`,
    `__` and `___`:


    ```

    ```

    sage: 1 + 1

    2

    sage: _ + 1

    3

    sage: __

    2

    ```

    ```


    The variables we have used above are Python variables; we will discuss them further
    in §1.3. Let us just mention that it is not recommended to redefine predefined
    constants and functions from Sage. While it does not influence the internal behaviour
    of Sage, it could yield surprising results:


    ```

    ```

    sage: pi = -1/2

    sage: exp(2*pi*pi)

    ```

