    **Technical Details.** It should be noted that the operations of addition and
    product create copies. This can be a source of overhead in terms of memory and
    time. As such, modifying P or C does not in turn cause U to be modified. Furthermore,
    these two operations result in two other losses of information:


    +   - the vertices of the final graph are re-labeled by integers {0,1,2,...};

    +   - the positions (in the layout) of the vertices are not preserved in U.


    The disjoint_union method behaves differently: if the graph g contains a vertex
    a, and the graph h a vertex b, the graph returned by g.disjoint_union(h) contains
    the vertices (0, a) and (1, b). In the case that a or b are not integers, but
    some other type of object (strings, tuples, ...), use of this method greatly simplifies
    traversal of the graph resulting from this union.


