  md: '**Simplifying the System.** A different approach is possible. Instead of looking
    for solutions, let us try to compute a simpler form of the system itself. The
    fundamental tools offered by Sage for this purpose are the triangular decomposition
    and Gröbner bases. We will see later exactly what they compute; let us first use
    them on this example:


    ```

    ```text

    sage: J.triangular_decomposition()

    [Ideal (z^17 - 1, y - 2*z^10, x - 3*z^3) of Multivariate

    Polynomial Ring in x, y, z over Rational Field]

    sage: J.transformed_basis()

    [z^17 - 1, -2*z^10 + y, -3/4*y^2 + x]

    ```

    ```


    We obtain in both cases the equivalent system


    $z^{17}=1\qquad y=2z^{10}\qquad x=3z^3,$


    or $x=3y^2/4$ for the last equation with transformed_basis, i.e., $V=\{((3\omega^3,2\omega^{10},\omega)\mid
    \omega^{17}=1\}$. This is an immediate parametrisation of the compact form of
    solutions found manually above.


    # 9.2.2 What Does Solving Mean?


    A polynomial system that has solutions often has an infinite number of solutions.
    The simple equation $x^2-y=0$ has an infinite number of solutions in $\mathbb{Q}^2$,
    not even considering $\mathbb{R}^2$ or $\mathbb{C}^2$. It is therefore not possible
    to enumerate them. The best we can do is to describe the set of solutions “as
    explicitly as possible”, i.e., compute a representation of it from which we can
    easily extract useful information. The situation is analogous to linear systems,
    for which (in the homogeneous case) a basis of the system kernel is a good description
    of the set of solutions.


    In the particular case where the number of solutions is finite, it becomes possible
    to “compute them”. However, even in that case, do we want to enumerate the solutions
    in $\mathbb{Q}$, or in a finite field $\mathbb{F}_q$? To find real or complex
    numerical approximations? Or even, as in the example of last section, to represent
    them using algebraic numbers, i.e., to compute for example minimal polynomials
    of their coordinates?


    This very example illustrates the fact that other representations of the set of
    solutions might be much more useful than a list of points, more so when the solutions
    are numerous. Therefore, enumerating the solutions is not always the best thing
    to do, even when possible. In the end, we do not really want to compute the solutions,
    but we want to compute *with* them, to deduce afterwards, according to the given
    problem, the information we are really interested in. The rest of this chapter
    investigates several useful tools for this purpose.


    # 9.2.3 Ideals and Systems


    If $s$ polynomials $p_1,\ldots,p_s\in K[x]$ vanish at a point $x$ with coordinates
    in $K$ or an extension of $K$, any element of the ideal they generate also vanishes
    at $x$. It is thus natural to associate to the polynomial system


    $p_1(x)=p_2(x)=\cdots=p_s(x)=0$'
