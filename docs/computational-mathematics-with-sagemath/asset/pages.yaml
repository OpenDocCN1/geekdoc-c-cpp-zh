  md: "$A[x]$, with $p_m,q_n\\ne 0$. The resultant of $p$ and $q$ is defined by\n\n\
    $\\operatorname{Res}(p,q)=\\begin{vmatrix} p_m & \\cdots & \\cdots & p_0 \\\\\
    \ & \\ddots & & \\\\ & p_m & \\cdots & p_0 \\\\ q_n & \\cdots & q_0 & \\\\ & \\\
    ddots & & \\\\ & & \\ddots & \\\\ & & q_n & \\cdots & q_0 \\end{vmatrix}.$ (7.1)\n\
    \nIt is the determinant, in suitable bases, of the linear map\n\n$A_{n-1}[x]\\\
    times A_{m-1}[x]\\ \\xrightarrow{u,v}\\ A_{m+n-1}[x]$  \n$\\qquad\\qquad\\qquad\\\
    qquad uv+vq$\n\nwhere $A_k[x]\\subset A[x]$ is the sub-module of polynomials of\
    \ degree at most $k$. If $p$ and $q$ split into linear factors, their resultant\
    \ may also be expressed in terms of differences of their roots:\n\n$\\operatorname{Res}(p,q)=p_m^n\
    \ q_n^m\\prod_{i,j}(\\alpha_i-\\beta_j),\\quad\\left\\{\\begin{aligned}p&=p_m(x-\\\
    alpha_1)\\cdots(x-\\alpha_m)\\\\q&=q_n(x-\\beta_1)\\cdots(x-\\beta_n).\\end{aligned}\\\
    right.$\n\nThe specialisation property mentioned above follows from the definition\
    \ (7.1): if $\\varphi:A\\to A'$ is a ring morphism, the application of which to\
    \ $p$ and $q$ keeps their degrees unchanged, i.e., such that $\\varphi(p_m)\\\
    ne 0$ and $\\varphi(q_n)\\ne 0$, then we have\n\n$\\operatorname{Res}(\\varphi(p),\\\
    varphi(q))=\\varphi(\\operatorname{Res}(p,q)).$\n\nAs a consequence, $\\varphi(\\\
    operatorname{Res}(p,q))$ vanishes when $\\varphi(p)$ and $\\varphi(q)$ share a\
    \ common factor. We have seen above an example of this phenomenon, with $\\varphi$\
    \ the canonical projection from $\\mathbb Z$ to $\\mathbb Z/n\\mathbb Z$.\n\n\
    The most common usage of the resultant concerns the case where the base ring itself\
    \ is a polynomial ring: $p,q\\in A[x]$ with $A=K[a_1,\\ldots,a_k]$. In particular,\
    \ given $\\alpha_1,\\ldots,\\alpha_k\\in K$, let us consider the specialisation\n\
    \n$\\varphi:B[a_1,\\ldots,a_k]\\longrightarrow K$  \n$\\qquad q(a_1,\\ldots,a_k)\\\
    longmapsto q(\\alpha_1,\\ldots,\\alpha_k).$\n\nWe see that the resultant $\\operatorname{Res}(p,q)$\
    \ vanishes at $(\\alpha_1,\\ldots,\\alpha_k)$ if and only if the specialisations\
    \ $\\varphi(p),\\varphi(q)\\in K[x]$ share a common factor, assuming that one\
    \ of the leading terms of $p$ and $q$ does not vanish in $(\\alpha_1,\\ldots,\\\
    alpha_k)$.\n\nFor example, the discriminant of $p\\in\\mathbb Q[x]$ of degree\
    \ $m$ is defined by\n\n$\\operatorname{disc}(p)=(-1)^{m(m-1)/2}\\operatorname{Res}(p,p')/p_m.$\n\
    \nThis definition generalises the classical discriminants of degree two and three\
    \ polynomials:"
