  md: '# # 13

    ## Numerical Linear Algebra


    We consider here the numerical side of linear algebra, the symbolic side being
    described in Chapter 8. The linear algebra numerical analysis and methods are
    discussed in [TBI97, Sch02]. The book of Golub and Van Loan [GVL12] is a major
    reference in this domain.


    Numerical linear algebra plays a key role in *scientific computing* including
    the numerical solution of ordinary and partial differential equations, optimisation
    problems, and signal processing problems.


    The numerical resolution of several of these problems, even linear ones, relies
    on algorithms made from nested loops; at the bottom of these loops, in most cases
    a linear system is solved. Non-linear algebraic systems are often solved using
    Newton''s method: here again, we have to deal with linear systems. Efficiency
    and robustness of numerical linear algebra methods are thus crucial.


    This chapter is split into three sections: in the first, we discuss the different
    sources of inexactness of numerical linear algebra computations; the second section
    (§13.2) discusses, without trying to be exhaustive, the more classical problems
    (linear system resolution, eigenvalue computation, least squares); in the third
    section (§13.3) we consider the case of sparse matrices. This last section is
    not only a guide for the user, but also an introduction to methods which are part
    of an active research domain.


    # ## 13.1 Inexact Computations


    We consider here classical linear algebra problems (linear system resolution,
    eigenvalue and eigenvector computation, etc.) which are solved using floating-point
    (i.e., inexact) computations. The different kinds of floating-point numbers available
    in Sage are detailed in Chapter 12.'
