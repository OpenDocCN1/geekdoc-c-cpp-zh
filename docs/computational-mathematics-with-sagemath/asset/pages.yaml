    # ### 12.1.3 The Fundamental Theorem of Algebra


    The splitting field of the polynomial with real coefficients $x^2 + 1$ is precisely
    the field of complex numbers. It is remarkable that every nonconstant polynomial
    with complex coefficients has at least one complex root: this is the content of
    the *Fundamental Theorem of Algebra*. Therefore, every nonconstant complex polynomial
    is a product of polynomials of degree 1. We noted above that the sum of the multiplicities
    of the roots of a polynomial $p$ is less than or equal to the degree of $p$. In
    other words, every polynomial equation of degree $n$ with complex coefficients
    has $n$ complex roots, counted with multiplicity.


    Let’s see how the method `Polynomial.roots()` can be used to illustrate this result.
    In the following example, we construct the ring of polynomials with real coefficients
    (represented by floating-point numbers with a precision of 53 bits). Then a polynomial
    of degree less than 15 is picked randomly from this ring. Finally we add the multiplicities
    of the complex roots computed with the method `Polynomial.roots()` and we compare
    this sum to the degree of the polynomial.


    ```

    ```sage

    sage: R.<x> = PolynomialRing(RR, ''x'')

    sage: d = ZZ.random_element(1,15)

    sage: p = R.random_element(d)

    sage: p.degree() == sum([r[1] for r in p.roots(CC)])

    True

    ```

    ```


    # ### 12.1.4 Distribution of the Roots


    We give a curious illustration of the power of the method `Polynomial.roots()`:
    we plot all points in the complex plane whose corresponding complex number is
    a root of a polynomial of degree 12 and with coefficients in the set {$-1, 1$}.
    The choice of degree is rather arbitrary, made in order to obtain a sufficiently
    detailed plot in a short amount of time. The usage of approximate values for the
    complex numbers is also motivated by performance reasons (see §13).


    ```

    ```sage

    sage: def build_complex_roots(degree):

    ....:     R.<x> = PolynomialRing(CDF, ''x'')

    ....:     v = []

    ....:     for c in cartesian_product([[-1, 1]] * (degree + 1)):

    ....:         v.extend(R(list(c)).roots(multiplicities=False))

    ....:     return v

    ```

    ```'
