- pgno: 4
  md: '# # Preface


    This book was written for those who want to efficiently use a computer algebra
    system, and Sage in particular. Symbolic computation systems offer plenty of functionality,
    and finding the right approach or command to solve a given problem is sometimes
    difficult. A reference manual provides a detailed analytic description of each
    function of the system; however, this is not very useful since usually we do not
    know in advance the name of the function we are looking for! This book provides
    another approach, by giving a global and synthetic point of view, while insisting
    on the underlying mathematics, the classes of problems we can solve and the corresponding
    algorithms.


    The first part, more specific to Sage, will help getting to grips with this system.
    This part is written to be understood by undergraduate students, and partly by
    high school students. The other parts cover more specialised topics encountered
    in undergraduate and graduate studies. Unlike in a reference manual, the mathematical
    concepts are clearly explained before illustrating them with Sage. This book is
    thus in the first place a book about mathematics.


    To illustrate this book, Sage was a natural choice, since it is an open-source
    system, that anybody can use, modify and redistribute at will. In particular the
    student who learns Sage in high school will be able to continue to use it at undergraduate
    or graduate levels, in a company, etc. Sage is still a relatively young system,
    and despite its already extensive capacities, it does contain some bugs. However,
    thanks to its very active community of developers, Sage evolves very quickly.
    Every Sage user can report a bug — maybe together with its solution — on trac.sagemath.org
    or via the sage-support list.


    In writing this book, we have used version 8.2 of Sage. Nevertheless, the examples
    should still work with later versions. However, some of the explanations may no
    longer hold, for example the fact that Sage relies on Maxima for numerical integrals.


    When in December 2009 I asked Alexandre Casamayou, Guillaume Connan, Thierry Dumont,
    Laurent Fousse, François Maltey, Matthias Meulien, Marc Mezzarobba, Clément Pernet
    and Nicolas Thiéry to write the first version (in French) of this book, all agreed
    with enthusiasm — including Nathan Cohen who joined us later on. Given the success
    of the French version, it was clear that an English version would be welcome.
    In March 2017, I decided to start working on the English version; I want to thank
    once again those of the “dream team” who helped me translating the text into English,
    updating the examples to the new version of Sage, and moreover improving the content
    of the book'
  merge: -1
  img_proc: true
