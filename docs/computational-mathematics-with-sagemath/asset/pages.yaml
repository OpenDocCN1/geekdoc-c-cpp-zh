    for a given step $h$, and truncating the sum to terms from $-N$ to $N$. The proposed
    transform is chosen to be


    $$\varphi(t)=\tanh\left(\frac{\pi}{2}\sinh t\right)$$


    which yields the formula


    $$I_h^N=h\sum_{k=-N}^{N} f\left(\tanh\left(\frac{\pi}{2}\sinh kh\right)\right)\frac{\frac{\pi}{2}\cosh
    kh}{\cosh^2\left(\frac{\pi}{2}\sinh kh\right)}.$$


    The name of the method comes from the doubly exponential decreasing of


    $$\varphi''(t)=\frac{\frac{\pi}{2}\cosh t}{\cosh^2\left(\frac{\pi}{2}\sinh t\right)}$$


    when $|t|\to\infty$ (see Figure 14.3). The main idea of the transform is to concentrate
    the contribution of the function to integrate around 0, which explains the huge
    decreasing of $\varphi''(t)$ when $|t|$ grows. A compromise should be found between
    the choice of parameters and of the transform $\varphi$: a decreasing more than
    doubly exponential decreases the truncation error but increases the discretization
    error.


    Since the discovery of the DE transform, this method is used alone or with other
    transforms, according to the nature of the integrand, of its singularities and
    of the integration domain. An example of other transform is the cardinal sine
    function “sinc”:


    $$f(x)\approx\sum_{k=-N}^{N} f(kh)S_{k,h}(x)$$


    where


    $$S_{k,h}(x)=\frac{\sin(\pi(x-kh)/h)}{\pi(x-kh)/h},$$


    used together with the double exponential method in [TSM05] to improve the previous
    methods which relied on a single exponential transform $\varphi(t)=\tanh(t/2)$.'
