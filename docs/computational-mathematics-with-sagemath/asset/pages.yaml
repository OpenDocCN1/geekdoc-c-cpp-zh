    \ of *x* are zero:\n\n$$ (xe^x)^{(n)} = \\sum_{k=0}^{n} \\binom{n}{k} x^{(k)}(e^x)^{(n-k)}\
    \ = (x+n)e^x. $$\n\n# ### 3.3.3 Main Methods on Lists\n\nThe `reverse` method\
    \ reverts the order of elements in a list, and the `sort` method transforms the\
