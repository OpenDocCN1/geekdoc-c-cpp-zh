    **Homogeneous Equations.** We want to solve the differential equation $x y'' =
    y + \sqrt{y^2+x^2}$ which is homogeneous since


    $$\frac{dy}{dx}=\frac{y+\sqrt{y^2+x^2}}{x}=\frac{N(y,x)}{M(y,x)},$$


    with $N(ky,kx)=kN(y,x)$ and $M(ky,kx)=kM(y,x)$.


    We just need to introduce the change of variables $y(x)=x\cdot u(x)$ for all real
    $x$ in order to get a separable equation.


    ```

    ```sage

    sage: u = function(''u'')(x)

    sage: y = x*u

    sage: DE = x*diff(y,x) == y + sqrt(x**2 + y**2)

    ```

    ```


    Let us change variables in the initial differential equation. The equation being
    undefined at 0, we solve it first on $]0,+\infty[$ and then on $]-\infty,0[$.


    ```

    ```sage

    sage: assume(x>0)

    sage: desolve(DE, u)

    x == -C*e^arcsinh(u(x))

    ```

    ```


    We do not get $u$ explicitly. We therefore use Maxima’s `ev` command (as in `evaluate`)
    with `logarc=True` in order to use the inverse hyperbolic functions as logarithms;
    $u$ will then be expressed thanks to the solve command:'
