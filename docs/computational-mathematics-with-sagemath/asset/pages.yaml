    \ + x^4 + 1)\nsage: roots = e.roots(); len(roots)\n9\nsage: roots\n[(0, 1),\n\
    \ (-1/2*(1/18*sqrt(23)*sqrt(3) - 1/2)^(1/3)*(I*sqrt(3) + 1) - 1/6*(-I*\n  sqrt(3)\
    \ + 1)/(1/18*sqrt(23)*sqrt(3) - 1/2)^(1/3),\n  1),\n (-1/2*(1/18*sqrt(23)*sqrt(3)\
    \ - 1/2)^(1/3)*(-I*sqrt(3) + 1) - 1/6*(I*\n  sqrt(3) + 1)/(1/18*sqrt(23)*sqrt(3)\
    \ - 1/2)^(1/3),\n  1),\n ((1/18*sqrt(23)*sqrt(3) - 1/2)^(1/3) + 1/3/(1/18*sqrt(23)*sqrt(3)\
    \ -\n  1/2)^(1/3),\n  1),\n (-1/2*I*sqrt(3) - 1/2, 1),\n (1/2*I*sqrt(3) - 1/2,\
    \ 1),\n (1/2*I*sqrt(3)*(-1)^(1/3) - 1/2*(-1)^(1/3), 1),\n (-1/2*I*sqrt(3)*(-1)^(1/3)\
    \ - 1/2*(-1)^(1/3), 1),\n ((-1)^(1/3), 1)]\n```\n```\n\nIf the parameter ring\
    \ is not specified, the method roots() of the class Expression delegates the computation\
    \ of the roots to Maxima, which tries to factor the expression, then solves in\
    \ radicals each factor of degree strictly less than 5. When the parameter ring\
    \ is specified, the expression is converted into an object of the class Polynomial\
    \ whose coefficients have as parent the object identified by the parameter ring;\
    \ then the result of the method Polynomial.roots() is returned. We will describe\
    \ the algorithm used in this case below (see §12.2.2).\n\nIt is also possible\
    \ to compute with implicit roots, which we can access via the objects QQbar and\
    \ AA representing the field of algebraic numbers (see §7.3.2).\n\n**Elimination\
    \ of Multiple Roots.** Given a polynomial p with multiple roots, it is possible\
    \ to construct a polynomial with simple roots (that is, of multiplicity 1), identical\
    \ to those of p. Hence, when computing the roots of a polynomial, we can assume\
    \ that those roots are simple. We first prove the existence of the polynomial\
    \ with simple roots and then show how to construct it. This will give a new illustration\
    \ of the method Expression.roots().\n\nLet α be a root of the polynomial p with\
    \ multiplicity m > 1. It is a root of the derivative p' with multiplicity m −\
    \ 1. In fact, if p = (x − α)^m q then p' = (x − α)^{m−1}(mq + (x − α)q')."
