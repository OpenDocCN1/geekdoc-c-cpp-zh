    ```


    The computed sequence is diverging! We can observe that this behaviour is natural,
    as it is a classical instability phenomenon: every error on \(u_0\) is multiplied
    by 4 at every iteration, and we know that floating-point arithmetic introduces
    rounding errors, which will be amplified at every iteration.


    Now, let us compute the recurrence \(u_{n+1}=3u_n-1\), with \(u_0=1/2\). We expect
    the same problem: the sequence is constant if computed exactly, but every error
    will be amplified at every iteration.


    ```

    sage: x = RDF(1/2)

    sage: for i in range(1,100): x = 3*x-1; print(x)

    0.5

    0.5

    0.5

    ⋮

    0.5

    ```


    Now, the computed sequence remains constant! How can we explain these two different
    behaviours? Let us look at the binary representation of \(u_0\) in both cases.


    For the first case (\(u_{n+1}=4u_n-1\), \(u_0=1/3\)), we have:


    \[\frac{1}{3}=\frac{1}{4}\sum_{i=0}^{\infty}\frac{1}{4^i}=\frac{1}{4}\sum_{i=0}^{\infty}\frac{1}{2^{2i}},\]


    and therefore \(1/3\) cannot be represented exactly in the set of floating-point
    numbers we have at our disposal. The reader of this book is invited to repeat
    the preceding computation in a large precision set like for example `RealField(1000)`
    to verify that the computed sequence is always diverging. Let us remark that if,
    in the first program, we replace the line


    ```

    sage: x = RDF(1/3)

    ```


    by


    ```

    sage: x = 1/3

    ```


    then the computations are carried out in the rational numbers and the iterates
    will remain equal to \(1/3\). In the second case (\(u_{n+1}=3u_n-1\), \(u_0=1/2\)),
    \(u_0\) and \(3/2\) in radix 2 are respectively 0.1 and 1.1; therefore the only
    exact value represented, without rounding, in the different sets of floating-point
    numbers: computation is exact, and the sequence remains constant.


    The following exercise shows that a sequence encoded in a set of floating-point
    numbers may converge to a wrong limit.


    **Exercise 42** (an example of Jean-Michel Muller). We consider the sequence (cf.
    [MBdD⁺10, p. 9]):


    \[u_n=111-\frac{1130}{u_{n-1}}+\frac{3000}{u_{n-1}u_{n-2}}.\]


    It is possible to show that the general solution is of the form:


    \[u_n=\frac{\alpha 100^{n+1}+\beta 6^{n+1}+\gamma 5^{n+1}}{\alpha 100^n+\beta
    6^n+\gamma 5^n}.\]'
