    # ### 16.2.5 NP-Complete Problems


    Sage contains algorithms for exact solutions of certain NP-complete problems.
    Of course, these problems may demand significant computational resources, but
    many real-world cases may be easier to solve than their theoretical counter-examples.
    For example, it is possible to solve the following optimisation problems.


    **Maximum Cliques and Independent Sets.** A maximum clique of a graph is a set
    of pair-wise adjacent vertices of maximum cardinality (or of non-adjacent vertices
    in the case of the independent set). One application of this type of problem is
    presented in §16.4.1. This is the algorithm used by the program Cliquer [NO].


    Methods: `clique_maximum`, `independent_set`


    **Vertex and Edge Colouring.** A proper vertex colouring of a graph is an assignment
    of colours to vertices such that any two adjacent vertices have different colours.
    Sage has several functions to compute exact colourings, mostly using linear programming
    or the *Dancing Links* algorithm. The reader will find in §16.3.1 an explanation
    of a simple, but non-optimal graph colouring algorithm.


    Methods: `chromatic_number`, `coloring`, `edge_coloring`¹, `grundy_coloring`¹.


    **Dominating Set.** A set *S* of vertices of a graph is called dominating if all
    vertices *v* in *G* are neighbours with an element of *S*—we call a vertex not
    in the set *S* *dominated* by elements of the set. The set of all vertices being
    trivially dominating, the problem is to minimise the size of the set *S*. This
    problem is solved by Sage with the help of linear programming.


    Method: `dominating_set`


    **Hamiltonian Cycle, Traveling Salesman.** A graph *G* is called *Hamiltonian*
    if it contains a cycle that passes once and only once through each of its vertices.
    Unlike the problem of the *Eulerian cycle* — the cycle that uses each *edge* of
    *G* once and only once — this problem is NP-complete, and is solved by Sage using
    linear programming, in the specific case of the *traveling salesman* problem.


    ¹These methods are not directly accessible through the `Graph` class. To access
    these and other colouring functions, see the `graph_coloring` module.'
