- pgno: 333
  md: 'A solver object enables us to register the definition and the parameters of
    the system we want to solve; it gives access to the numerical tools for solving
    differential equations from the GSL library, already mentioned for numerical quadrature.

    The system equations are given in the form of a function:


    ```

    ```python

    sage: def f_1(t,y,params): return [y[1],params[0]*(1-y[0]^2)*y[1]-y[0]]

    sage: T.function = f_1

    ```

    ```


    The parameter y represents the vector of unknown functions, and we should return
    the right-hand side vector of the system, in terms of t and an optional parameter
    (here params[0] which represents $\mu$).


    Some of the GSL algorithms require the system Jacobian as well (the matrix whose
    $(i, j)$ term is $\frac{\partial f_i}{\partial y_j}$, and whose last line contains
    $\frac{\partial f_i}{\partial t}$):


    ```

    ```python

    sage: def j_1(t,y,params):

    ....:     return [[0, 1],

    ....:             [-2*params[0]*y[0]*y[1]-1, params[0]*(1-y[0]^2)],

    ....:             [0,0]]

    sage: T.jacobian = j_1

    ```

    ```


    it is now possible to ask for a numerical solution. We choose the algorithm, the
    interval on which we want the solution, and the number of steps, which determines
    $h$:


    ```

    ```python

    sage: T.algorithm = "rk8pd"

    sage: T.ode_solve(y_0=[1,0], t_span=[0,100], params=[10],

    ....:           num_points=1000)

    sage: f = T.interpolate_solution()

    ```

    ```


    Here, we have chosen the Runge-Kutta Dormand-Prince algorithm to compute the solution
    on $[0,100]$; the initial conditions and the value of the parameters (here one
    only) are given too: $y\_0=[1,0]$ means $y_0(0) = 1, y_1(0) = 0$, i.e., $x(0)
    = 1, x''(0) = 0$.


    To show the graph of the solution (we might try `plot(f, 0, 2)` to see the zero
    derivative in $t = 0$ more clearly):


    ```

    ```python

    sage: plot(f, 0, 100)

    ```

    ```


    ![](img/99840d73c45ee58b635c4eedc727fd9a_333_0.png)'
