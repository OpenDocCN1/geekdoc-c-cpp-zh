- pgno: 210
  md: '# Inequalities


    Let us consider the triangle with vertices $A=(0,0)$, $B=(1,0)$ and $C=(x,y)$.
    Assume the angles $\widehat{BAC}$ and $\widehat{CBA}$ are equal, and let us try
    to prove computationally that we have an isosceles triangle. By introducing the
    parameter $t=\tan\widehat{A}=\tan\widehat{B}$, the problem is encoded by the equations
    $y=tx=t(1-x)$, and we have to show that they imply


    $$x^2+y^2=(1-x)^2+y^2.$$


    With Sage, we obtain:


    ```

    ```text

    sage: R.<x,y,t> = QQ[]

    sage: J = (y-t*x, y-t*(1-x))*R

    sage: (x^2+y^2) - ((1-x)^2+y^2) in J

    False

    ```

    ```


    This could have been expected: when $x=y=t=0$, the hypotheses are satisfied, but
    the conclusion is false! Geometrically, we have to exclude the case of flat triangles,
    which can have two equal angles without being isosceles.


    How to encode the constraint $t\ne 0$? The trick is to introduce an auxiliary
    variable $u$, and to force $tu=1$. The computation becomes:


    ```

    ```text

    sage: R.<x,y,t,u> = QQ[]

    sage: J = (y-t*x, y-t*(1-x), t*u-1)*R

    sage: (x^2+y^2) - ((1-x)^2+y^2) in J

    True

    ```

    ```


    and we now have the expected result. Let us remark by the way that we can simultaneously
    force several expressions to vanish with only one auxiliary variable, using an
    equation like $t_1t_2\cdots t_nu=1$.


    single variable $y$, with coefficients in $K[x_1,\ldots,x_n]$. We have seen in
    §7.3.3 that it is a polynomial from $K[x_1,\ldots,x_n]$, which vanishes at $u\in
    K^n$ if and only if $p(u_1,\ldots,u_n)$ and $q(u_1,\ldots,u_n)$ (which are two
    polynomials of $K[y]$) have a common zero, except maybe when the leading coefficients
    (in $y$) of $p$ and $q$ themselves vanish at $u$.


    Some of our elimination computations involving only two polynomials can be replaced
    by resultants. For example, the equation of the envelope of circles (9.7) is


    ```

    ```text

    sage: eq.derivative(t).resultant(eq, t)

    x^2 - y^2 - 1/2

    ```

    ```


    The resultant $\operatorname{Res}_y(p,q)$ is an element of the elimination ideal
    $(p,q)\cap K[x_1,\ldots,x_n]$. Even in the case $n=1$ (where the elimination ideal
    is principal), though, and even if the leading coefficients with respect to $y$
    of $p$ and $q$ are coprime, the resultant does not necessarily generate the elimination
    ideal:


    ```

    ```text

    sage: R.<x,y> = QQ[]

    ```

    ```'
