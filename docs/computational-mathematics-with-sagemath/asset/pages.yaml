    Table 7.3 – Polynomial arithmetic.


    # ## 7.2  Euclidean Arithmetic


    Apart from the sum and product, the most elementary operations on polynomials
    are the Euclidean division and the greatest common divisor computation. The corresponding
    operators and methods (Table 7.3) mimic those on integers. However, quite often,
    these operations are hidden by an additional abstraction layer: quotient of rings
    (§7.2.2) where each arithmetic operation involves an implicit Euclidean division,
    rational functions (§7.4) whose normalisation implies some gcd computations...


    # ### 7.2.1  Divisibility


    **Divisions.** The Euclidean division works in a field, and more generally in
    a commutative ring when the leading coefficient of the divisor is invertible,
    since this coefficient is the only one from the base ring by which it is required
    to divide:


    ```

    ```sage

    R.<t> = Integers(42)[]; (t^20-1) % (t^5+8*t+7)

    22*t^4 + 14*t^3 + 14*t + 6

    ```

    ```


    When the leading coefficient is not invertible, we can still define a *pseudo
    Euclidean division* (pseudo-division for short): let \(A\) be a commutative ring,
    \(p,d\in A[x]\), and \(a\) the leading coefficient of \(d\). Then there exists
    two polynomials \(q,r\in A[x]\), with \(\deg r<\deg d\), and an integer \(k\leq\deg
    p-\deg d+1\) such that


    \(a^k p=qd+r.\)


    The pseudo-division is given by the Sage `pseudodivrem` method.


    To perform an exact division, we also use the Euclidean quotient operator `//`.
    Indeed, dividing by a non-constant polynomial with `/` returns a result of type
    rational function (see §7.4), or fails when this makes no sense:


    ```

    ```sage

    ((t^2+2*t)//t).parent()

    ```

    ```'
