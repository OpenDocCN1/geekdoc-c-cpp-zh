    # ### 13.3.5 More Thoughts on Solving Large Non-Linear Systems


    The power method and the methods using the Krylov space share a key property:
    they only require the computation of matrix-vector products. We do not even need
    to know the matrix, we only need to know the action of the matrix on a vector.
    This is why these methods are also called “black box” methods. It is thus possible
    to perform some computations in cases where the matrix is not explicitly known,
    or when we are unable to compute it. The SciPy methods allow in fact *linear operators*
    as arguments. We invite the reader to consider the following application, and
    maybe implement it.


    Let $F : \mathbb{R}^n \to \mathbb{R}^n$. We want to solve $F(x) = 0$. We consider
    Newton''s method, where we compute iterates $x_{n+1} = x_n - J(x_n)^{-1} \cdot
    F(x_n)$, starting from $x_0$. The Jacobian matrix $J(x_n)$ is the matrix of partial
    derivatives of $F$ at $x_n$. In practice, one will successively solve $J(x_n)y_n
    = F(x_n)$, then compute $x_{n+1} = x_n - y_n$. We thus have to solve a linear
    system. If $F$ is somewhat hard to compute, then its partial derivatives are in
    general still harder to compute and to program, and this computation might be
    almost impossible. We therefore bring automatic differentiation to the rescue:
    if $e_j$ is the vector from $\mathbb{R}^n$ with all its components 0 except the
    $j$-th one equal to 1, then $(F(x + he_j) - F(x))/h$ yields a (good)'
