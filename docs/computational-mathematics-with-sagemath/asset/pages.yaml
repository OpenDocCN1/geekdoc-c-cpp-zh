  md: '**Recurrence Relation and Closed-Form Formula.** We now return to the closed
    form of $C(z)$:


    ```

    ```sage

    sage: z = var(''z''); C = s0; C

    -1/2*sqrt(-4*z + 1) + 1/2

    ```

    ```


    The $n$-th coefficient in the Taylor series for $C(z)$ being given by $\frac{1}{n!}C(z)^{(n)}(0)$,
    we look at the successive derivatives $C(z)^{(n)}(z)$:


    ```

    ```sage

    sage: derivative(C, z, 1)

    1/sqrt(-4*z + 1)

    sage: derivative(C, z, 2)

    2/(-4*z + 1)^(3/2)

    sage: derivative(C, z, 3)

    12/(-4*z + 1)^(5/2)

    ```

    ```


    This suggests the existence of a simple explicit formula, which we now seek. The
    following small function returns $d_n = n!c_n$:


    ```

    ```sage

    sage: def d(n): return derivative(C, n).subs(z=0)

    ```

    ```


    Taking successive quotients:


    ```

    ```sage

    sage: [ (d(n+1) / d(n)) for n in range(1,17) ]

    [2, 6, 10, 14, 18, 22, 26, 30, 34, 38, 42, 46, 50, 54, 58, 62]

    ```

    ```


    we observe that $d_n$ satisfies the recurrence relation $d_{n+1} = (4n-2)d_n$,
    from which we deduce that $c_n$ satisfies the recurrence relation $c_{n+1} = \frac{(4n-2)}{n+1}c_n$.
    Simplifying, we find that $c_n$ is the $(n-1)$-th Catalan number:


    $$c_n = \mathrm{Catalan}(n-1) = \frac{1}{n}\binom{2(n-1)}{n-1}.$$


    We check this:


    ```

    ```sage

    sage: def c(n): return 1/n*binomial(2*(n-1),n-1)

    sage: [c(k) for k in range(1, 11)]

    [1, 1, 2, 5, 14, 42, 132, 429, 1430, 4862]

    sage: [catalan_number(k-1) for k in range(1, 11)]

    [1, 1, 2, 5, 14, 42, 132, 429, 1430, 4862]

    ```

    ```


    We can now calculate coefficients much further; here we calculate $c_{100000}$
    which has more than 60000 digits:


    ```

