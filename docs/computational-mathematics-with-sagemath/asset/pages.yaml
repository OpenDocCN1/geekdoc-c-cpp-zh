    # ### 10.2.1 Recurrences $u_{n+1}=f(u_n)$


    **Definition.** Let $u_{n+1}=f(u_n)$ be a recurrence relation, with $u_0=a$. We
    can define the relation naturally by means of a recursive algorithm. Let us consider
    for instance the logistic map (defined by $x_{n+1}=r x_n(1-x_n)$):


    $$ f : x \mapsto 3.83 \cdot x \left(1 - \frac{x}{100000}\right) \quad \text{and}
    \quad u_0 = 20000. $$


    With Sage:


    ```

    ```sage

    sage: x = var(''x''); f = function(''f'')(x)

    sage: f(x) = 3.83*x*(1 - x/100000)

    sage: def u(n):

    ....:     if n==0: return(20000)

    ....:     else: return f(u(n-1))

    ```

    ```


    An iterative definition may be preferred:


    ```

    ```sage

    sage: def v(n):

    ....:     V = 20000;

    ....:     for k in [1..n]:

    ....:         V = f(V)

    ....:     return V

