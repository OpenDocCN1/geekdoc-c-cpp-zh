    \ empty list:\n\n```\n    sage: reduce (lambda x, y: 10*x+y, [9, 8, 7, 6], 1)\n\
    \    19876\n```\n\nThis third argument usually corresponds to the neutral element\
    \ of the operation\nthat is applied. The following example computes a product\
    \ of odd integers:\n\n```\n    sage: L = [2*n+1 for n in [0..9]]\n    sage: reduce\
