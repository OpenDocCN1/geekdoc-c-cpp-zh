    # ## 11.3 Some Properties of Floating-Point Numbers


    # ### 11.3.1 These Sets are Full of Gaps


    In every set of floating-point numbers, the ulp() method (*unit in the last place*)
    returns the distance from a representable number to the next representable one
    (in the opposite direction from zero):


    ```

    ```

    sage: x2 = R2(1.); x2.ulp()

    0.50

    sage: xx = 1.; xx.ulp()

    2.22044604925031e-16

    ```

    ```


    The reader can easily check the value given by x2.ulp().


    Table 11.1 gives the size of the interval which separates a given number x — or
    more exactly R(x) where R is the considered set — from its nearest neighbour (in
    the opposite direction from zero) for different sets of numbers (R100 is the set
    RealField(100)), and different values of x.


    As expected, the size of the gaps between two consecutive numbers grows with the
    magnitude of the numbers.


    Exercise 41 (a somewhat surprising value). Show that R100(10^30).ulp() is exactly
    1.000000000000000000000000000000.'
