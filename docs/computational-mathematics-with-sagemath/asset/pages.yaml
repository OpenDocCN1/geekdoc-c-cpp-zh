    # ### 17.4.3 Flow


    In this section we present yet another fundamental algorithm in graph theory:
    maximum flow! Given a pair of vertices $s$ and $t$ of a *directed graph* $G$ (that
    is, the edges have a direction, see Figure 17.1), this problem consists in sending
    from $s$ to $t$ a *maximum flow*, using the edges of $G$. Each one of these edges
    has an associated *maximal capacity* — i.e., the maximal flow which can go through
    it.


    The definition of this problem is almost its formulation as a linear program:
    we are looking for a real value associated to each edge, representing the intensity
    of flow going through it, under two types of constraints:


    +   - the amount of flow arriving at a vertex (different from $s$ or $t$) should
    equal the amount of flow leaving it;

    +   - the flow over an edge cannot exceed its capacity.'
