    \ ; L\n    [9, 2, 5, 8, 1]\n    sage: L.sort() ; L\n    [1, 2, 5, 8, 9]\n    sage:\
    \ L.sort(reverse = True) ; L\n    [9, 8, 5, 2, 1]\n\n```\n\nBoth methods modify\
    \ the list *L* in-place, the initial list being lost.\n\nA first optional argument\
    \ of `sort` enables us to choose the order relation, in form of a two-parameter\
    \ function `Order(x, y)`. The returned value of this function must have the type\
    \ `int` of the Python integers: it is negative, zero or positive, for example\
    \ −1, 0 or 1, when *x* < *y*, *x* = *y* or *x* > *y*, respectively. The transformed\
    \ list $(x_0, x_1, \\ldots, x_{n-1})$ satisfies $x_0 \\preccurlyeq x_1 \\preccurlyeq\
    \ \\cdots \\preccurlyeq x_{n-1}$.\n\nThe lexicographic order of two number lists\
    \ of same length is similar to the alphabetic order and is defined as follows,\
    \ ignoring the first equal terms:\n\n$$ P = (p_0, p_1, \\ldots, p_{n-1}) \\prec_{\\\
    text{lex}} Q = (q_0, q_1, \\ldots, q_{n-1}) $$\n$$ \\iff \\exists r \\in \\{0,\
    \ \\ldots, n-1\\} \\quad (p_0, p_1, \\ldots, p_{r-1}) = (q_0, q_1, \\ldots, q_{r-1})\
    \ \\text{ and } p_r < q_r. $$\n\nThe following function compares two lists of\
    \ equal lengths. Despite the *a priori* infinite loop `while True`, the `return`\
    \ commands ensure the termination, together with the finite length. The result\
    \ is −1, 0 or 1 according to $P \\prec_{\\mathrm{lex}} Q$, $P = Q$ or $P \\succ_{\\\
    mathrm{lex}} Q$:\n\n```\n\n    sage: def alpha (P, Q):        # len(P) = len(Q)\
    \ by hypothesis\n    ....:     i = 0\n    ....:     while True:\n    ....:   \
    \      if i == len(P): return int(0)\n    ....:         elif P[i] < Q[i]: return\
    \ int(-1)\n    ....:         elif P[i] > Q[i]: return int(1)\n    ....:      \
    \   else: i = i+1\n\n```"
