  md: '# 5.4 Expressions vs Computational Domains


    Several approaches are thus possible for manipulating objects like polynomials
    within Sage. We can consider them as particular symbolic expressions, as in the
    first chapters, or introduce a given ring of polynomials and compute with its
    elements. To conclude this chapter, we briefly describe the parent of symbolic
    expressions, the SR domain, then we demonstrate through several examples how important
    it is to control the domain of computations, and the differences between both
    approaches.


    # 5.4.1 Symbolic Expressions as a Computational Domain


    Symbolic expressions themselves form a computational domain. In Sage, their parent
    is the *symbolic ring*:


    ```

    ```text

    sage: parent(sin(x))

    Symbolic Ring

    ```

    ```


    that can also be obtained with:


    ```

    ```text

    sage: SR

    Symbolic Ring

    ```

    ```


    The properties of this ring are rather fuzzy; it is commutative:


    ```

    ```text

    sage: SR.category()

    Category of commutative rings

    ```

    ```


    and the computation rules assume roughly speaking that all symbolic variables
    are in ℂ.


    The form of expressions in SR (polynomials, fractions, trigonometric expressions)
    being not apparent in their class or parent, the result of a computation often
    requires some manual transformations to obtain the desired form (see §2.1), by
    using for example expand, combine, collect and simplify. To use these functions
    well we have to know which kind of transformation they perform, to which sub-classes⁵
    of symbolic expressions these transformations apply, and which of these sub-classes
    have a normal form. In particular, the blind use of the simplify command can yield
    wrong results. Some variants of simplify allow then to precisely describe the
    transformation to apply.


    # 5.4.2 Examples: Polynomials and Normal Forms


    Let us build the ring ℚ[x₁, x₂, x₃, x₄] of polynomials in 4 variables:


    ```

    ```text

    sage: R = QQ[''x1,x2,x3,x4'']; R

    Multivariate Polynomial Ring in x1, x2, x3, x4 over Rational Field

    sage: x1, x2, x3, x4 = R.gens()

    ```

    ```


    The elements of R are automatically put in expanded form:


    ⁵ In the sense of subset, and not of Python class.'
