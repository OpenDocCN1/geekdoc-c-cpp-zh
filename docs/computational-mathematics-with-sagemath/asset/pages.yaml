    sage: IntegerVectors(10, 3, min_part = 2, max_part = 5,

    ....:             inner = [2, 4, 2]).list()

    [[4, 4, 2], [3, 5, 2], [3, 4, 3], [2, 5, 3], [2, 4, 4]]

