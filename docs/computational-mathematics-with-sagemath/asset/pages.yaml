    # # 6


    Finite Fields and Elementary Number Theory


    This chapter describes the use of Sage for elementary number theory, for working
    with objects related to finite fields (§6.1), for primality testing (§6.2) and
    integer factorisation (§6.3); we will also discuss some applications (§6.4).


    # ## 6.1 Finite Fields and Rings


    Finite rings and fields are basic objects, both in number theory and throughout
    computer algebra. Indeed, many algorithms in computer algebra involve computations
    over finite fields, where one can exploit the information obtained using techniques
    such as Hensel lifting, or reconstruction using the Chinese Remainder Theorem.
    As an example, we can mention the Cantor-Zassenhaus algorithm for factoring univariate
    polynomials with integer coefficients, which begins by factoring the polynomial
    over a finite field.


    # ### 6.1.1 The Ring of Integers Modulo *n*


    In Sage, the ring ℤ/*n*ℤ of integers modulo *n* is defined using the constructor
    `IntegerModRing` (or, more simply, `Integers`). All objects constructed using
    this constructor and those derived from them are systematically reduced modulo
    *n*, and so have a canonical (or normal) form: that is to say, two variables representing
    the same value modulo *n* also have the same internal representation. In certain
    very special situations, it may be more efficient to delay these reductions modulo
    *n*; for example, if one multiplies matrices with such coefficients, one would
    then rather work with integers, and carry out the reductions modulo *n* “by hand”'
