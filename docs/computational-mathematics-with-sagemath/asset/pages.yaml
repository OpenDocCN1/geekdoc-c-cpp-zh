    \    [x^2 + y^2 - 1, y^4 - y^2 + 1/16]\n```\n\nThe leading monomials x^2 and y^4\
    \ appear as expected. Their presence explains the way the staircase closes itself\
    \ on the axes; we will see it is characteristic of zero-dimensional systems. For\
    \ the double hyperbola alone, we find:\n\n⁷We can see this result as an effective\
    \ version of the Hilbert Basis Theorem, which states that ideals from K[x] are\
    \ generated by a finite number of elements. A classical proof of this theorem\
    \ is very similar to the construction of a Gröbner basis for the lexicographic\
