    # Iterative and Recursive Methods.


    As we have seen above, a user-defined function is a sequence of instructions.
    A function is called recursive when during its evaluation, it calls itself with
    different parameters. The factorial sequence is a toy example of recursive sequence:


    0! = 1,  (n + 1)! = (n + 1)n! for all n ∈ ℕ.


    The two following functions yield the same result for a nonnegative integer argument
    n; the first function uses the iterative method with a `for` loop, while the second
    one is a word-by-word translation of the above recursive definition:


    ```

    sage: def fact1 (n):

    .....:     res = 1

    .....:     for k in [1..n]: res = res*k

    .....:     return res

    ```


    ```

    sage: def fact2 (n):

    .....:     if n == 0: return 1

    .....:     else: return n*fact2(n-1)

    ```


    The Fibonacci sequence is a recurrent relation of order 2 since uₙ₊₂ depends on
    uₙ and uₙ₊₁:


    u₀ = 0,  u₁ = 1,  uₙ₊₂ = uₙ₊₁ + uₙ for all n ∈ ℕ.


    The function `fib1` below applies an iterative scheme to compute terms of the
    Fibonacci sequence: the variables U and V store the two previous values before
    computing the next one:


    ```

    sage: def fib1 (n):

    .....:     if n == 0 or n == 1: return n

    .....:     else:

    .....:         U = 0 ; V = 1 # the initial terms u0 and u1

    .....:         for k in [2..n]: W = U+V ; U = V ; V = W

    .....:         return V

    sage: fib1(8)

    ```'
