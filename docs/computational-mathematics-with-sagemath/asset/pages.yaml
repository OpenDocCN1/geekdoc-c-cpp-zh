    One can also consider the case of several moduli $m_1, m_2, \ldots, m_k$. The
    Sage command for finding $x_0$, given $a, b, m, n$, is `crt(a,b,m,n)`:


    ```

    ```

    sage: a = 2; b = 3; m = 5; n = 7; lambda0 = (b-a)/m % n; a + lambda0 * m

    17

    sage: crt(2,3,5,7)

    17

    ```

    ```


    Let us return to the computation of $H_n$. We first compute $H_n \bmod m_i$ for
    $i = 1,2,\ldots,k$, and then obtain $H_n \bmod m_1 \cdots m_k$ by Chinese remaindering,
    finally recovering the value of $H_n$ by rational reconstruction:


    ```

    ```

    sage: def harmonic3(n):

    ....:     q = lcm(range(1,n+1))

    ....:     pmax = RR(q*(log(n)+1))

    ....:     B = ZZ(2*pmax^2)

    ....:     a = 0; m = 1; p = 2^63

    ....:     while m < B:

    ....:         p = next_prime(p)

    ....:         b = harmonic_mod(n,p)

    ....:         a = crt(a,b,m,p)

    ....:         m = m*p

    ....:     return rational_reconstruction(a,m)

    sage: harmonic(100) == harmonic3(100)

    True

    ```

    ```


    The Sage function `crt` may also be used when the moduli $m$ and $n$ are not coprime.
    If $g = \gcd(m,n)$, then a solution exists if and only if $a \equiv b \bmod g$:


    ```

    ```

    sage: crt(15,1,30,4)

    45

    sage: crt(15,2,30,4)

    Traceback (most recent call last):

    ...

    ValueError: No solution to crt problem since gcd(30,4) does not divide 15-2

    ```

