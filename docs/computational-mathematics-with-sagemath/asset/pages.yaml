- pgno: 23
  md: '# Computer algebra and numerical methods


    A computer algebra system is a program made to manipulate, simplify and compute
    mathematical formulas by applying only exact (i.e., symbolic) transformations.
    The term *symbolic* is opposed here to *numerical*; it means that computations
    are made using algebraic formulas, manipulating symbols only. This is why *symbolic
    computation* is sometimes used in place of *computer algebra*. In French, one
    says *calcul formel* or sometimes *calcul symbolique*.


    In general, pocket calculators manipulate integers exactly up to twelve digits;
    larger numbers are rounded, which induces errors. Thus a pocket calculator wrongly
    evaluates to 0 the following expression, whereas the correct result is 1:


    $$(1 + 10^{50}) - 10^{50}.$$


    Such errors are difficult to detect if they arise during an intermediate computation,
    without being anticipated by a theoretical analysis. On the contrary, computer
    algebra systems do not have these limitations, and perform all integer computations
    exactly: they answer 1 to the previous computation.


    Numerical methods approximate to a given precision (using the trapezoidal rule,
    Simpson’s rule, Gaussian quadrature, etc.) the definite integral $\int_0^\pi \cos
    t\,dt$ to obtain a numerical result near zero (with error $10^{-10}$ for example).
    However, they cannot tell the user if the result is exactly 0, or on the contrary
    is near zero but definitely not zero.


    A computer algebra system rewrites using symbolic mathematical transformations
    the integral $\int_0^\pi \cos t\,dt$ into the expression $\sin \pi - \sin 0$,
    which is then evaluated into $0 - 0 = 0$. This method proves whence $\int_0^\pi
    \cos t\,dt = 0$.


    However, algebraic transformations have limits too. Most expressions handled by
    symbolic computation systems are rational functions, and the expression $a/a$
    is automatically simplified into 1. This automatic simplification is not compatible
    with solving equations; indeed, the solution to the equation $ax = a$ is $x =
    a/a$, which is simplified into $x = 1$ without distinguishing the special case
    $a = 0$, for which any scalar $x$ is solution (see also §2.1.5).


    # 1.2.2  Elementary Functions and Usual Constants


    The usual functions and constants are available (see Tables 1.1 and 1.2), as well
    as for complex numbers. Here also, computations are exact:


    ```

    sage: sin(pi)

    0

    sage: tan(pi/3)

    sqrt(3)

    sage: arctan(1)

    1/4*pi

    sage: exp(2 * I * pi)

    1

    ```


    even if symbolic expressions are returned instead of numerical expressions:'
