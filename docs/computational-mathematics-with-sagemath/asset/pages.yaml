    The result suggests that the trees are counted by one of the most famous sequences,
    the Catalan numbers. Looking through the references supplied by the Encyclopedia,
    we see that this is really the case: the few numbers above form a digital fingerprint
    of our objects, which enables us to find, in a few seconds, a precise result from
    within an abundant literature.


    **Enumeration Using Generating Series.** Our next goal is to recover this result
    using Sage. Let $C_n$ be the set of trees with $n$ leaves, so that $c_n = |C_n|$;
    by convention, we will define $C_0 = \emptyset$ and $c_0 = 0$. The set of all
    trees is then the disjoint union of the sets $C_n$:


    $$C = \bigsqcup_{n\in\mathbb{N}} C_n.$$


    Having named the set $C$ of all trees, we can translate the recursive definition
    of trees into a set-theoretic equation:


    $$C \approx \{\mathrm{L}\} \uplus C \times C.$$


    In words: a tree $t$ (which is by definition in $C$) is either a leaf (so in $\{\mathrm{L}\}$)
    or a node to which two trees $t_1$ and $t_2$ have been attached, and which we
    can therefore identify with the pair $(t_1,t_2)$ (in the Cartesian product $C
    \times C$).


    The founding idea of algebraic combinatorics, introduced by Euler in a letter
    to Goldbach of 1751 to treat a similar problem, is to manipulate all numbers $c_n$
    simultaneously, by encoding them as coefficients in a formal power series, called
    the *generating function* of the $c_n$’s:


    $$C(z) = \sum_{n\in\mathbb{N}} c_n z^n,$$


    where $z$ is a formal variable (which means that we do not have to worry about
    questions of convergence). The beauty of this idea is that set-theoretic operations
    $(A \uplus B, A \times B)$ translate naturally into algebraic operations on the
    corresponding series $(A(z) + B(z), A(z) \cdot B(z))$, in such a way that the
    set-theoretic equation satisfied by $C$ can be translated directly into an algebraic
    equation satisfied by $C(z)$:


    $$C(z) = z + C(z) \cdot C(z).$$


    Now we can solve this equation with Sage. In order to do so, we introduce two
    variables, $C$ and $z$, and we define the equation:


    ```

    sage: C, z = var(''C, z''); sys = [ C == z + C*C ]

    ```


    There are two solutions, which happen to have closed forms:


    ```

    sage: sol = solve(sys, C, solution_dict=True); sol

    [{C: -1/2*sqrt(-4*z + 1) + 1/2}, {C: 1/2*sqrt(-4*z + 1) + 1/2}]

    sage: s0 = sol[0][C]; s1 = sol[1][C]

    ```'
