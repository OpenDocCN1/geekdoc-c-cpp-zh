  md: 'Consequently, ball arithmetic is less computationally expensive than inf-sup
    interval arithmetic and even, at high precision, it is not more expensive than
    plain floating-point arithmetic.


    # ### 11.4.2 Computing with Real Intervals and Real Balls


    Once we have defined sets of intervals or balls, we must define functions operating
    on them. For a given interval (or a ball) **x**, the range of a function *f* on
    **x** is given by *R(f, x)* = {*f(x)* for *x* ∈ **x**}. For a continuous function
    *f* we just define its interval extension **F(x)** as the smallest interval (or
    ball) included in *F* which contains *R(f, x)*.


    ```

    ```

    Examples:

    sage: E = RIF(-pi/4,pi)

    sage: sin(E)

    [-0.70710678118654769 .. 1.0000000000000000]

    sage: E = RIF(-1,2); exp(E)

    [0.36787944117144227 .. 7.3890560989306505]

    sage: E = RIF(0,1); log(E)

    [-infinity .. -0.0000000000000000]

    ```

    ```


    For a set of *standard functions* (exp, sin, cos, arcsin, arccos, sinh, cosh,
    . . . ), **F(x)** is computed as precisely as possible and is a tight approximation
    of *R(f, x)*.


    But things become less obvious when we compose standard functions and combine
    them with arithmetic operators. Example:


    ```

    ```

    sage: E=RIF(-pi,pi)

    sage: f = lambda x: sin(x)/x

    sage: f(E)

    [-infinity .. +infinity]

