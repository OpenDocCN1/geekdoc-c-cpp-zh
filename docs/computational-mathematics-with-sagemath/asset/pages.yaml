  md: '# # 4 Graphics


    Drawing a function of one or two variables, or a series of data, makes it easier
    to grasp a mathematical or physical phenomenon, and helps us make conjectures.
    In this chapter, we illustrate the graphical capabilities of Sage using several
    examples.


    # ## 4.1 2D Graphics


    Several definitions of a plane curve are possible: as the graph of a function,
    from a parametric system, using polar coordinates, or by an implicit equation.
    We detail these four cases, and give some examples of data visualisation.


    # ### 4.1.1 Graphical Representation of a Function


    To draw the graph of a symbolic or Python function on an interval $[a,b]$, we
    use `plot(f(x), a, b)` or the alternative syntax `plot(f(x), x, a, b)`.


    ```

    ```python

    sage: plot(x * sin(1/x), x, -2, 2, plot_points=500)

    ```

    ```


    Among the numerous options of the `plot` command, we mention the following:


    +   * `plot_points` (default value 200): minimal number of computed points;

    +   * `xmin` and `xmax`: interval bounds over which the function is displayed;

    +   * `color`: colour of the graph, either a RGB triple, a character string such
    as `''blue''`, or an HTML colour like `''#aaff0b''`;

    +   * `detect_poles` (default value False): enables to draw a vertical asymptote
    at poles of the function;'
