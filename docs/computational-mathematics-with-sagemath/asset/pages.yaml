    # 16.3.2  Generating Graphs Under Constraints


    Random graphs $G_{n,p}$ have very interesting connectivity properties. In particular,
    their minimal cuts are almost certainly the neighbourhood of a vertex: there are
    therefore cuts such that one of the two connected partitions consists of a single
    vertex. This may seem unsettling: every set of vertices then defines a cut of
    greater cardinality than the size of the minimum cut. However, it is possible,
    with great patience (for very large graphs) and a few lines of Sage to produce
    somewhat different random graphs. Here is the method we will implement.'
