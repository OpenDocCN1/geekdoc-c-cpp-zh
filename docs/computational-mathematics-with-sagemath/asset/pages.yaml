    ring, there exist unimodular matrices $U$ and $V$ of dimensions $m \times m$ and
    $n \times n$ respectively, and a unique $m \times n$ diagonal matrix $S$ such
    that $S = UAV$. The coefficients $s_i = S_{i,i}$ for $i \in \{1, \ldots, \min(m,
    n)\}$ are the elementary divisors of $A$ and satisfy $s_i \mid s_{i+1}, \forall
    i < \min(m, n)$.'
