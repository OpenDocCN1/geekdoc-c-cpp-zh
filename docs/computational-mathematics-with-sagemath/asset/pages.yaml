    **Linear System Solving.** A linear system of equations can be represented by
    a matrix A and a right-hand side or a left-hand side vector b for systems of the
    form Ax = b or x^T A = b^T respectively. The methods solve_right and solve_left
    solve these systems. One can alternatively use the operators A\b and b/A. When
    the system is given by a matrix over a ring, the resolution is systematically
    performed over the fraction field of this ring (e.g., Q for the ring Z or K(X)
    for K[X]). We will see later on how to solve the system over the base ring. The
    right-hand side in the system equality can be either a vector or a matrix (the
    latter corresponding to the resolution of several systems with the same matrix).


    The system''s matrix can be rectangular and the system may have a unique solution,
    no solution or an infinite number of solutions. In the latter case, the solve
    methods return one of these solutions, zeroing out the coefficients corresponding
    to linearly dependent columns in the system.


