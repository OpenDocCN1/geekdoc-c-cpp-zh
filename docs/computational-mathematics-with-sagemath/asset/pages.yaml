  md: '**Quotient Algebra.** The quotients by zero-dimensional ideals are much easier
    to manipulate than those by general ideals, since the computations in the quotient
    algebra reduce to linear algebra in finite dimension.


    If $J \subset K[x]$ is a zero-dimensional ideal, the dimension $\dim_K K[x]/J$
    of the quotient algebra as a $K$-vector space bounds the number of points of $V(J)$.
    (Indeed, for any $u \in V(J)$, there exists a polynomial with coefficients in
    $K$ which equals 1 at $u$ and 0 at any other point of $V(J)$. Two such polynomials
    cannot be equivalent modulo $J$.) We can consider this dimension as the number
    of solutions “with multiplicity” of the system over the algebraic closure of $K$.
    For example, we have noticed that the four solutions of system $(S_2)$ introduced
    in §9.2.3 are each one the “double” intersection of both curves. This explains
    the following:


    ```

    ```sage

    sage: len(J2.variety(QQbar)), J2.vector_space_dimension()

    (4, 8)

    ```

    ```


    The normal basis method computes a list of monomials whose projections on $K[x]/J$
    constitute a basis:


    ```

    ```sage

    sage: J2.normal_basis()

    [x*y^3, y^3, x*x^2*y^2, x^2*y, x*y, y, x, 1]

    ```

    ```


    The returned basis depends on the monomial order chosen at the construction of
    the polynomial ring; we will describe it more precisely in §9.3.3.


    **Exercise 37.** Let $J$ be a zero-dimensional ideal of $\mathbb{Q}[x,y]$. Let
    $\chi_z$ be the characteristic polynomial of the linear transformation


    $$\begin{aligned}m_z :\quad \mathbb{Q}[x,y]/J &\longrightarrow \mathbb{Q}[x,y]/J
    \\ p+J &\longmapsto xp+J.\end{aligned}$$


    Compute $\chi_z$ in the case $J=J_2=\langle x^2+y^2-1,\,4x^2y^2-1\rangle$. Show
    that every root of $\chi_z$ is the abscissa of a point of the variety $V_{\mathbb{C}}(J)$.


    # 9.3  Gröbner Bases


    So far, we have used as black boxes the functions provided by Sage for the algebraic
    elimination and the resolution of polynomial systems. This section introduces
    some of the underlying mathematical and algorithmic tools. The goal is both to
    be able to call directly these tools, and to make a wise use of the high-level
    functions seen before.


    The methods used by Sage for computation with ideals and elimination are based
    on the concept of Gröbner basis. We can consider a Gröbner basis as a multivariate
    extension of the representation by principal generator of ideals of $K[x]$. The
    main problem of this section is to define and compute a normal form for the elements
    of the quotient algebra from $K[x]$. Our point of view remains that of the user:
    we define Gröbner bases, we show how to obtain them with Sage and how they can
    be useful, but we do not discuss the algorithms used to compute them.'
  merge: -1
  img_proc: true
