- pgno: 248
  md: '# # 11


    # # Floating-Point Numbers


    In the next chapters, floating-point numbers are at the heart of all computations.
    It is necessary to study them, as their behaviour follows precise rules.


    How can we represent real numbers in a computer? In general, these numbers cannot
    be coded with a finite amount of information, and thus they cannot be exactly
    represented. It is necessary to approximate them using a finite amount of memory.


    A standard has appeared around an approximation of real numbers with a finite
    quantity of information: the floating-point representation.


    In this chapter, one will find: a basic description of the floating-point numbers
    and of the different kinds of these numbers available in Sage, and a demonstration
    of some of their properties. Examples will show some difficulties we encounter
    when computing with floating-point numbers and some tricks to get around them.
    We hope that the reader will develop a necessary careful approach. To conclude,
    we will try to describe some properties which must be fulfilled by numerical methods
    when they use these numbers.


    To go further, the reader should refer to [BZ10] and [Gol91] (available on the
    internet) or to the book [MBdD+10].


    # ## 11.1 Introduction


    # ### 11.1.1 Definition


    A set $F(\beta,r,m,M)$ of floating-point numbers is defined by four parameters:
    a radix $\beta \ge 2$, a number $r$ of digits and two signed integers $m$ and
    $M$. The elements of $F(\beta,r,m,M)$ are numbers of the form


    $$x = (-1)^s 0.d_1d_2\ldots d_r \cdot \beta^j,$$'
