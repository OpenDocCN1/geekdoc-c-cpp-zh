    # **Applications: Plane Geometry.**


    If $X\subset\mathbb{C}^k$ is given by a rational parametrisation


    $$X=\{(f_1(t),f_2(t),\ldots,f_k(t))\},\qquad f_1,\ldots,f_k\in\mathbb{Q}(t_1,\ldots,t_n),$$


    finding an implicit equation for $X$ consists of projecting the part of $\mathbb{C}^{k+n}$
    defined by the equations $x_i=f_i(t)$ on the subspace $(x_1,\ldots,x_k)\cong\mathbb{C}^k$.
    This is an elimination problem. Let us consider the classical parametrisation
    of the circle


    $$x=\frac{1-t^2}{1+t^2}\qquad y=\frac{2t}{1+t^2} \tag{9.6}$$


    associated to the expression of $(\sin\theta,\cos\theta)$ in terms of $\tan(\theta/2)$.
    It translates into polynomial relations defining an ideal of $\mathbb{Q}[x,y,t]$:


    ```

    sage: R.<x,y,t> = QQ[]

    sage: Param = R.ideal((1-t^2)-(1+t^2)*x, 2*t-(1+t^2)*y)

    ```


    Let us eliminate $t$:


    ```

    sage: Param.elimination_ideal(t).gens()

    [x^2 + y^2 - 1]

    ```


    We obtain an equation of the circle. We can notice that this equation vanishes
    at $(x,y)=(-1,0)$, although the parametrisation (9.6) does not hit that point,
    since the circle minus a point is not an algebraic subvariety.


    Another example: let us draw a few of the circles $(C_t)$ of equation


    $$C_t:\qquad x^2+(y-t)^2=\frac{t^2+1}{2} \tag{9.7}$$


    using Sage commands (see Figure 9.3):


    ```

    sage: R.<x,y,t> = QQ[]

    sage: eq = x^2 + (y-t)^2 - 1/2*(t^2+1)

    ```'
