- pgno: 334
  md: '# 14.2.2 Available Functions


    We have already mentioned for the solver objects from GSL the `rk8pd` method.
    Other methods are available:


    +   - `rkf45`: Runga-Kutta-Fehlberg, an adaptive method of orders 5 and 4;

    +   - `rk2`: adaptive Runge-Kutta of orders 3 and 2;

    +   - `rk4`: the classical Runge-Kutta method of order 4;

    +   - `rk2imp`: an implicit order 2 Runge-Kutta method with evaluation in the
    middle of the interval;

    +   - `rk4imp`: an implicit order 4 Runge-Kutta method with evaluation at “Gaussian
    points”⁴;

    +   - `bsimp`: the implicit Burlisch-Stoer method;

    +   - `gear1`: the implicit one-step Gear method;

    +   - `gear2`: the implicit two-step Gear method.


    For more details on all these methods, we refer the reader to [AP98].


    One should note that the GSL limitation to machine floating-point numbers — thus
    of fixed precision — that we mentioned for the numerical integration also holds
    for solving differential equations.


    Maxima also provides routines to solve differential equations numerically, with
    its own syntax:


    ```

    sage: t, y = var(''t, y'')

    sage: desolve_rk4(t*y*(2-y), y, ics=[0,1], end_points=[0, 1], step=0.5)

    [[0, 1], [0.5, 1.12419127424558], [1.0, 1.461590162288825]]

    ```


    The `desolve_rk4` function uses the order-4 Runge-Kutta method (the same as `rk4`
    for GSL) and takes as parameters:


    +   - the right-hand side of the equation \(y''(t) = f(t,y(t))\), here \(y'' =
    ty(2-y)\);

    +   - the name of the unknown function, here \(y\);

    +   - the initial conditions `ics`, here \(t = 0\) and \(y = 1\);

    +   - the resolution interval `end_points`, here \([0,1]\);

    +   - the resolution step, here 0.5.


    We omit the similar command `desolve_system_rk4`, already mentioned in Chapter
    4, and which applies to a differential system. Maxima is limited to machine precision
    too.


    If we want arbitrary precision solutions, we might use `odefun` from the `mpmath`
    package:


    ⁴The roots of the degree-2 Legendre polynomial, which are shifted on the interval
    \([t, t + h]\), and whose name makes reference to the Gauss-Legendre quadrature
    rule.'
