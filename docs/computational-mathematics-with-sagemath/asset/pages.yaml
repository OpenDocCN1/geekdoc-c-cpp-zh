- pgno: 250
  md: '# ## 11.2 The Floating-Point Numbers


    Sage provides two sorts of floating-point numbers:


    +   1. the "double-precision" numbers as described in §11.1.3: these numbers are
    provided by the computer''s processor; in Sage, they belong to the class RDF:


    ```

    ```

    sage: xrdf = RDF(3.0)

    ```

    ```


    +   2. floating-point numbers with an arbitrary precision: every instance of the
    class RealField — or Rels — defines a set of floating-point numbers with a given
    precision (and possibly with a given rounding mode: see §11.3.2). For example,
    to declare a number x100 with a precision on 100 binary digits, one writes:


    ```

    ```

    sage: R100 = RealField(100) # precision: 100 bits.

    sage: x100 = R100(3/8); x100

    0.375000000000000000000000000000

    ```

    ```


    In the set RealField(p) numbers are of the form


    \((-1)^s 0.d_1d_2 \ldots d_p \cdot 2^e,\)


    with s ∈ {0,1}; the significand has p binary digits and e might have 30 binary
    digits (or more on some computers). An implicit precision is available:


    ```

    ```

    sage: Rdefault = RealField() # default precision of 53 bits

    sage: xdefault = Rdefault(2/3)

    ```

    ```


    and it is possible to check the precision of all floating-point numbers using
    the prec() method:


    ```

    ```

    sage: xrdf.prec()

    53

    sage: x100.prec()

    100

    sage: xdefault.prec()

    53

    ```

    ```


    So, the numbers of the set RealField() and those of the set RDF have the same
    precision, but RealField() allows much larger exponents. The set RealField(),
    with a precision of 53 bits, is the default type of "real" numbers in Sage:


    ```

    ```

    sage: x = 1.0; type(x)

    <type ''sage.rings.real_mpfr.RealLiteral''>

    sage: x.prec()

    53

    ```

    ```


    Here, real_mpfr.RealLiteral means that the set of numbers to which x belongs is
    implemented by the GNU MPFR library. Let us recall that the type of a variable
    is automatically defined by the right-hand side in an assignment:'
  merge: -1
  img_proc: true
