- pgno: 347
  md: "# Systematic Treatment by Algebraic-Differential Equations.\n\nThe methods\
    \ that we have used generalise to all recursively defined objects: the system\
    \ of set-theoretic equations can be translated into a system of equations on the\
    \ generating function, which enables the recursive calculation of its coefficients.\
    \ If the set-theoretic equations are simple enough (for example, if they only\
    \ involve Cartesian products and disjoint unions), the equation for $C(z)$ is\
    \ algebraic. This equation has, in general, no closed-form solution. However,\
    \ using *confinement*, one can deduce a *linear* differential equation that $C(z)$\
    \ satisfies. This differential equation, in turn, can be translated into a recurrence\
    \ relation of fixed length on its coefficients $c_n$. In this case, the series\
    \ is called *D-finite*. After the initial calculation of this recurrence relation,\
    \ the calculation of coefficients is very fast. All these steps are purely algorithmic,\
    \ and it is planned to port into Sage the implementations that exist in Maple\
    \ (the gfun and combstruct packages) or MuPAD-Combinat (the decomposableObjects\
    \ library).\n\nFor the moment, we illustrate this general procedure in the case\
    \ of complete binary trees. The generating function $C(z)$ is a solution to an\
    \ algebraic equation $P(z,C(z))=0$, where $P=P(x,y)$ is a polynomial with coefficients\
    \ in $\\mathbb{Q}$. In the present case, $P=y^2-y+x$. We formally differentiate\
    \ this equation with respect to $z$:\n\n```\n```sage\nsage: x, y, z = var('x,\
    \ y, z')\nsage: P = function('P')(x, y); C = function('C')(z)\nsage: equation\
    \ = P(x=z, y=C) == 0\nsage: diff(equation, z)\ndiff(C(z), z)*D[1](P)(z, C(z))\
    \ + D[0](P)(z, C(z)) == 0\n```\n```\n\nor, in a more readable format,\n\n$$\\\
    frac{dC(z)}{dz}\\frac{\\partial P}{\\partial y}(z,C(z)) + \\frac{\\partial P}{\\\
    partial x}(z,C(z)) = 0.$$\n\nFrom this we deduce:\n\n$$\\frac{dC(z)}{dz}=-\\frac{\\\
    frac{\\partial P}{\\partial x}(z,C(z))}{\\frac{\\partial P}{\\partial y}(z,C(z))}.$$\n\
    \nIn the case of complete binary trees, this gives:\n\n```\n```sage\nsage: P =\
    \ y^2 - y + x; Px = diff(P, x); Py = diff(P, y)\nsage: - Px / Py\n-1/(2*y - 1)\n\
    ```\n```\n\nRecall that $P(z,C(z))=0$. Thus, we can calculate this fraction mod\
    \ $P$ and, in this way, express the derivative of $C(z)$ as a *polynomial in $C(z)$\
    \ with coefficients in $\\mathbb{Q}(z)$. In order to achieve this, we construct\
    \ the quotient ring $R=\\mathbb{Q}(x)[y]/(P)$:\n\n```\n```sage\nsage: Qx = QQ['x'].fraction_field();\
    \ Qxy = Qx['y']\nsage: R = Qxy.quo(P); R\nUnivariate Quotient Polynomial Ring\
    \ in ybar\n over Fraction Field of Univariate Polynomial Ring in x\n over Rational\
    \ Field with modulus y^2 - y + x\n```\n```"
