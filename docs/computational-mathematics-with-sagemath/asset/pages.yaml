- pgno: 332
  md: 'exist, for example the Runge-Kutta method of order 2 to solve the equation

    \(y'' = f(t,y)\):


    \[

    \begin{aligned}

    k_1 &= h f(t_n,y(t_n)) \\

    k_2 &= h f\left(t_n + \tfrac{1}{2}h, y(t_n) + \tfrac{1}{2}k_1\right) \\

    y(t_{n+1}) &\approx y(t_n) + k_2 + O(h^3).

    \end{aligned}

    \]


    In this method, we try to evaluate \(y''(t_n+h/2)\) to get a better estimate of
    \(y(t_n+h)\).


    Some multi-step methods also exist (for example Gear’s method): they consist in
    computing \(y(t_n)\) from the already computed values \(y(t_{n-1}), y(t_{n-2}),
    \ldots, y(t_{n-\ell})\), for a given number \(\ell\) of steps. These methods necessarily
    require an initial phase, before enough values are available.


    Similarly to the Gauss-Kronrod quadrature method, some hybrid methods exist for
    solving differential equations. For example, the Dormand-Prince method computes
    with the same approximation points a value at orders 4 and 5, the latter being
    used to estimate the error made for the former. We say it is an adaptive method.


    We also distinguish between explicit and implicit methods: in an explicit method,
    the value of \(y(t_{n+1})\) is given by a formula using known values only; for
    an implicit method we have to solve an equation. Let us consider for example Euler’s
    implicit method:


    \[

    y(t_{n+1}) = y(t_n) + h f(t_{n+1}, y(t_{n+1})).

    \]


    The wanted value \(y(t_{n+1})\) appears on both sides of the equation; if the
    function \(f\) is complex enough, we have to solve a non-linear algebraic system,
    typically using Newton’s method (see §12.2.2).


    A priori, we expect more accurate results if we decrease the integration step
    \(h\); in addition to the extra computations it implies, the expected accuracy
    gain is however counter-balanced by the increased roundoff errors which, at the
    end, might be significant with respect to the final result.


    # 14.2.1 An Example


    Let us consider the Van der Pol oscillator of parameter \(\mu\), satisfying the
    following differential equation:


    \[

    \frac{\mathrm{d}^2x}{\mathrm{d}t^2}(t) - \mu(1-x^2)\frac{\mathrm{d}x}{\mathrm{d}t}(t)
    + x(t) = 0.

    \]


    Writing \(y_0(t)=x(t)\) and \(y_1(t)=\frac{\mathrm{d}x}{\mathrm{d}t}\), we get
    the order 1 system:


    \[

    \begin{cases}

    \dfrac{\mathrm{d}y_0}{\mathrm{d}t} = y_1,\\

    \dfrac{\mathrm{d}y_1}{\mathrm{d}t} = \mu(1-y_0^2)y_1-y_0.

    \end{cases}

    \]


    To solve it, we will use a “solver” object provided by the ode_solver command:


    ```

    sage: T = ode_solver()

    ```'
