    These unavoidable operations remain expensive; one therefore tries to minimise
    the number of calls to them.


    The canonical representatives are chosen in such a way that, for each canonical
    labelled graph G, there is a canonical choice of an edge whose removal produces
    another canonical labelled graph, which is called the father of G. This property
    implies that it is possible to organise the canonical labelled graphs on a set
    V of vertices as the nodes of a tree: at the root, the graph with no edges; below
    it, its unique child, the graph with one edge; then the graphs with two edges,
    and so on. The set of children of a graph G can be constructed by *augmentation*,
    adding an edge in all possible ways to G, and then selecting, among those graphs,
    the ones that are still canonical^3. Recursively, one obtains all canonical graphs.


    In what sense is this algorithm generic? Consider for example planar graphs


    ^3 In practice, an efficient implementation would exploit the symmetries of G,
    i.e., its automorphism group, to reduce the number of children to explore, and
    to reduce the cost of each test of canonicity.'
