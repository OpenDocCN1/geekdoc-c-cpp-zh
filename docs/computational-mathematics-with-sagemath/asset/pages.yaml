- pgno: 117
  md: 'The Integer class is specific to Sage: by default, Python uses integers of

    type int. In general, the conversion from Integer to int — or vice versa — is

    automatic, but it might be necessary to convert explicitly by


    ```

    ```sage

    sage: int(5)

    5

    sage: type(int(5))

    <type ''int''>

    ```

    ```


    or conversely


    ```

    ```sage

    sage: Integer(5)

    5

    sage: type(Integer(5))

    <type ''sage.rings.integer.Integer''>

    ```

    ```


    **Rational Numbers.** The normal form property extends to rational numbers, elements
    of QQ, which are always represented in reduced form. Therefore, in the command


    ```

    ```sage

    sage: factorial(99) / factorial(100) - 1 / 50

    -1/100

    ```

    ```


    the factorials are first evaluated, then the obtained fraction 1/100 is put into
    reduced form. Sage then constructs the rational number 1/50, performs the subtraction,
    then reduces again the result (there is nothing to do here).


    **Floating-Point Numbers.** Real numbers cannot all be exactly represented in
    a finite format. Their numerical values are approximated by floating-point numbers,
    which will be discussed in more detail in Chapter 11.


    Within Sage, floating-point numbers are encoded in binary radix. As a consequence,
    the floating-point number corresponding to the input 0.1 slightly differs from
    1/10, since 1/10 is not exactly representable in binary! Each floating-point number
    has its own precision. The parent of floating-point numbers with p-bit significand
    is denoted RealField(p), which for the default precision (p = 53) is also denoted
    RR. As for integers, Sage floating-point numbers differ from their Python analogue.


