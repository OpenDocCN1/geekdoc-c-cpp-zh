    # **Some Difficulties.**


    We can rightfully wonder about the interest of the triangular decomposition to
    enumerate the solutions. After all, given a zero-dimensional system, it is always
    possible to find a univariate polynomial whose roots are exactly the first coordinates
    of the solutions, by computing some elimination ideal. By substituting its roots
    into the system, we decrease the number of variables, which allows to iterate
    the process, until we have completely solved the system.


    However, the “substitution” in the system by propagating the partial results might
    be intricate. Let us slightly modify the preceding system:


    ```

    ```sage

    sage: D = ideal((x+2*y-1)*(x+2*y+1)); J = C + D

    sage: J.variety()

    [{y: -4/5, x: 3/5}, {y: 0, x: -1}, {y: 0, x: 1}, {y: 4/5, x: -3/5}]

    sage: [T.gens() for T in J.triangular_decomposition()]

    [[y, x^2 - 1], [25*y^2 - 16, 4*x + 3*y]]

    ```

    ```


    The shape of the triangular decomposition remains the same: for each component,
    we have an equation involving $y$ only, and a second equation enabling to express
    $x$ in terms of $y$.


    Thus let us eliminate $x$, to get an equation in $y$ only, which is the product
    of the two above equations in $y$:


    ```

    ```sage

    sage: Jy = J.elimination_ideal(x); Jy.gens()

    [25*y^3 - 16*y]

    ```

    ```


    To find $x$, it now suffices to substitute the roots of this equation into the
    equations defining the ideal $J$. The first equation, $x^2 + y^2 - 1 = 0$, yields:


    ```

    ```sage

    sage: ys = QQ[''y''](Jy.0).roots(); ys

    [(4/5, 1), (0, 1), (-4/5, 1)]

    sage: QQ[''x''](J.1(y=ys[0][0])).roots()

    [(-3/5, 1), (-13/5, 1)]

    ```

    ```


    One of these two values is correct — we have $(-3/5, 4/5) ∈ V(J)$ — but the other
    one does not correspond to any solution: we have to check the found values using
    the second initial equation, $(x + 2y - 1)(x + 2y + 1)$, to eliminate it.'
