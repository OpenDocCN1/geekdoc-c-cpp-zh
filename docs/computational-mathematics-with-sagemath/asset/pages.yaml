    \ and for which values of `n` the ring `ℤ/nℤ` is integral:\n\n```\nsage: ZZ.is_subring(A)\n\
    True\nsage: [n for n in range(20)\n....:     if Integers(n)['x'].is_integral_domain()]\n\
    [0, 2, 3, 5, 7, 11, 13, 17, 19]\n```\n\nThese capabilities largely rely on the\
    \ Sage category system (see also §5.2.3). Polynomial rings belong to a number\
    \ of “categories”, like the category of sets, that of Euclidean rings, and many\
    \ more:\n\n```\nsage: R.categories()\n[Category of euclidean domains,\n Category\
    \ of principal ideal domains,\n ...\n Category of sets with partial maps, Category\
    \ of objects]\n```\n\nThis reflects that any polynomial ring is also a set, a\
    \ Euclidean domain, and so on. The system can thus automatically transfer to polynomial\
