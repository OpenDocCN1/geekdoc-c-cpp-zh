    The rank of the matrix $A$ being 2, the third singular value is necessarily 0.


    **EXAMPLE.** Among the marvelous applications of the singular value decomposition
    (SVD), here is a problem (known as the *orthogonal Procrustes problem*) which
    is hard to solve by another method: let $A$ and $B \in \mathbb{R}^{n \times m}$
    be the results of an experiment repeated twice. We wonder if $B$ can be *twisted*
    to $A$, i.e., if there exists an orthogonal matrix $Q$ such that $A = BQ$. Naturally,
    the measures $A$ and $B$ contain some noise, whence the problem has no solution
    in general. We therefore consider the corresponding least squares problem: we
    are looking for the orthogonal matrix $Q$ which minimises the square of the Frobenius
    norm:


    $$\|A - BQ\|_F^2.$$


    We remember that $\|A\|_F^2 = \operatorname{trace}(A^t A)$. Then


    $$\|A - BQ\|_F^2 = \operatorname{trace}(A^t A) + \operatorname{trace}(B^t B) -
    2 \operatorname{trace}(Q^t B^t A) \ge 0,$$


    and we have to maximise $\operatorname{trace}(Q^t B^t A)$. We then compute the
    SVD of $B^t A$: we have $U^t(B^t A)V = \Sigma$. Let us denote by $\sigma_i$ the
    singular values, and $Z = V^t Q^t U$. This matrix is orthogonal, and thus all
    its coefficients are less or equal to 1 in absolute value. Then:


    $$\operatorname{trace}(Q^t B^t A) = \operatorname{trace}(Q^t U \Sigma V^t) = \operatorname{trace}(Z\Sigma)
    = \sum_{i=1}^m Z_{ii}\sigma_i \le \sum_{i=1}^m \sigma_i,$$'
