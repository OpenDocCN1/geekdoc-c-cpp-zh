    group theory algorithms provided by GAP to reduce the calculation of the cycle
    indicator to a summation over conjugacy classes of the group. The following example
    counts in a few seconds the number of graphs on $n=10$ nodes; in that case, $G_n$
    contains $10!$ permutations acting on 45 edges:


