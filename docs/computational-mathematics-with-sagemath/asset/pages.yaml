  md: "In terms of ideals, the *Nullstellensatz* says that the set of polynomials\
    \ vanishing identically on the variety $V_K(J)$ associated to the ideal $J$ is\
    \ the *radical* of that ideal, defined by\n\n$$\\sqrt{J}=\\{p\\in K[\\mathbf{x}]\\\
    mid \\exists k\\in\\mathbb{N}, p^k\\in J\\}.$$\n\nWe have\n\n$$V_K(\\sqrt{J})=V_K(J)$$\n\
    \nbut intuitively, switching to the radical “forgets the multiplicities”. Therefore,\
    \ the ideal $J_1$ is its own radical (we say it is radical), whereas the ideal\
    \ $J_2$ associated to $(S_2)$ satisfies $J_2 \\subsetneq \\sqrt{J_2}$.\n\n```\n\
    \    sage: J1 = (x^2 + y^2 - 1, 16*x^2*y^2 - 1)*R\n    sage: J2 = (x^2 + y^2 -\
    \ 1,  4*x^2*y^2 - 1)*R\n    sage: J1.radical() == J1\n    True\n    sage: J2.radical()\n\
    \    Ideal (2*y^2 - 1, 2*x^2 - 1) of Multivariate Polynomial\n    Ring in x, y\
    \ over Rational Field\n    sage: 2*y^2 - 1 in J2\n    False\n```\n\n> > **Systems,\
    \ ideals and cryptography**\n> >\n> > Some specific modules, `sage.rings.polynomial.multi_polynomial_sequence`\
    \ and `sage.crypto.mq`, provide tools to manipulate polynomial systems by taking\
    \ into account the particular form of equations, and not only the ideal they generate.\
    \ This is useful to play with large structured systems, like those found in cryptography.\
    \ The module `sage.crypto` also defines several polynomial systems associated\
    \ to classical cryptographic constructions.\n\n**Operations on Ideals.** It is\
    \ also possible to compute with ideals themselves. Let us recall the definition\
    \ of the sum of two ideals:\n\n$$I+J=\\{p+q\\mid p\\in I \\text{ and } q\\in J\\\
    }=\\langle I\\cup J\\rangle.$$\n\nIt corresponds geometrically to the intersection\
    \ of varieties:\n\n$$V(I+J)=V(I)\\cap V(J).$$\n\nHence, the ideal $J_1$ associated\
    \ to $(S_1)$ is the sum of $C=\\langle x^2+y^2-1\\rangle$ and $H=\\langle 16x^2y^2-1\\\
    rangle$, which define respectively the circle and the double hyperbola. In Sage:\n\
    \n```\n    sage: C = ideal(x^2 + y^2 - 1); H = ideal(16*x^2*y^2 - 1)\n    sage:\
    \ C + H == J1\n    True\n```"
