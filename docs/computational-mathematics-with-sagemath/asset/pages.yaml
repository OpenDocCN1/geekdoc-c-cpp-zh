  md: 'from right to left, and *degle x* sorts the monomials first by total degree,
    then by lexicographic order. The definition of *degrevlex* is slightly more complex:
    the monomials are sorted by total degree, then by *decreasing* lexicographic order
    of the exponents *read from the right*. This strange order is nevertheless used
    by default when we omit the *order* option, since it is more efficient than other
    orders for some computations.


    We generally choose (but not always!) simultaneously the order of variables of
    the ring and that of monomials such that $x_1 > x_2 > \cdots > x_n$, and we then
    often speak, for example, of the “lex order such that $x > y > z$” instead of
    the “lex order on $K[x,y,z]$”. The predefined orders lex, deglex and degrevlex
    obey that convention; for the *invelx* order on $K[x,y,z]$, it is also the lex
    order such that $z > y > x$, i.e., the lex order on $K[z,y,x]$.


    # ### 9.3.2 Division by a Family of Polynomials


    A monomial order $\prec$ being fixed, let $G = \{g_1,g_2,\ldots,g_s\}$ be a finite
    set of polynomials from $K[x]$. We denote by $\langle G\rangle = \langle g_1,g_2,\ldots,g_s\rangle$
    the ideal of $K[x]$ generated by $G$.


    The division of a polynomial $p \in K[x]$ by $G$ is a multivariate analogue of
    the Euclidean division in $K[x]$. Like the latter, it associates to $p$ a remainder,
    given in Sage by the expression `p.reduce(G)`, which is a “smaller” polynomial
    belonging to the same equivalence class modulo $\langle G\rangle$:


    ```

    sage: (x+y+z)^2).reduce([x-t, y-t^2, z^2-t])

    2*z*t^2 + 2*z^2*t + t^4 + 2*t^3 + t^2 + t

    ```


    The remainder is obtained by subtracting from $p$, while possible, multiples of
    elements of $G$ whose leading term cancels a term of $p$ in the subtraction. Contrary
    to the univariate case, it might happen that one can thus cancel a term of $p$,
    but not the leading one: we then only require to cancel the largest term according
    to the monomial order.


    Formally, for $p \in K[x]$, let us denote by $\operatorname{lt}_G p$ the term
    of $p$ of maximal exponent, which is divisible by a leading term of an element
    of $G$. Let us call *elementary reduction* each transformation of the form


    $p \mapsto \tilde{p} = p - c x^\alpha g, \qquad \text{where } g \in G \text{ and
    } \operatorname{lt}_G p = c x^\alpha \operatorname{lt} g.$  (9.10)


    An elementary reduction leaves unchanged the equivalence class of $p$ modulo $\langle
    G\rangle$, and makes the largest cancelled monomial of $p$ disappear: we have


    $\tilde{p} - p \in \langle G\rangle \qquad\text{and}\qquad \operatorname{lt}_G
    \tilde{p} < \operatorname{lt}_G p.$


    Since $\prec$ is a well-order, it is not possible to apply to a polynomial an
    infinite number of successive elementary reductions. Each sequence of elementary
    reductions ends in a local order which is not well-orders in the sense of definition
    (9.9), and we do not use them in this book; however the curious reader will complete
    Table 9.5 by using the test_poly function defined in §9.1.1.'
