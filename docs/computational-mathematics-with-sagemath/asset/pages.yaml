  md: 'The error is due to the phenomenon known as *catastrophic cancellation* which
    appears when we add `-b` and `sqrt(delta)` to compute `y`. Here, we can try to
    find a better approximation for `y`:


    ```

    sage: y = (c/a)/x; y

    -0.00010000000000000000

    sage: x+y+b/a

    0.00000000000000000000

    sage: x*y-c/a

    -1.11022302462516e-16

    ```


    We can remark that, due to rounding, the sum of the roots remains correct, but
    the product is much closer to `c/a`. The reader can consider all different choices
    for `a`, `b` and `c` to be convinced that writing a numerically robust program
    to compute the roots of a quadratic trinomial is far from easy.


    **The Set of Floating-Point Numbers is not an Additive Group.** Actually, addition
    is not associative. Let us use the set R2 (with 2 bits of precision):


    ```

    sage: x1 = R2(1/2); x2 = R2(4); x3 = R2(-4)

    sage: x1, x2, x3

    (0.50, 4.0, -4.0)

    sage: x1+(x2+x3)

    0.50

    sage: (x1+x2)+x3

    0.00

    ```


    We can deduce that different orders of computations in a program have some importance
    on the result!


    **Recurrences and Sequences of Floating-Point Numbers.** Let us consider the recurrence
    \(u_{n+1}=4u_n-1\). If \(u_0=1/3\), the sequence is stationary: \(u_i=1/3\) for
    all \(i\).


    ```

    sage: x = RDF(1/3)

    sage: for i in range(1,100): x = 4*x-1; print(x)

    0.333333333333

    0.333333333333

    0.333333333333

    ...

    -1.0

    -5.0

    -21.0

    -85.0

    -341.0

    -1365.0

    -5461.0

    ```


    ²Thanks to Marc Délèglise (Institut Camille Jordan, Lyon, France) for this example.'
