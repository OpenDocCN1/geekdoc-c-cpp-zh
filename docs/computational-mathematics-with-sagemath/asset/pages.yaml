    \ complex (approximate), finite fields and number fields in particular:\n\n```\n\
    \    sage: for A in [QQ, ComplexField(16), GF(5), QQ[sqrt(2)]]:\n    ....:   \
    \  print(str(A) + \":\")\n    ....:     print(A['x'](p).factor())\n    Rational\
