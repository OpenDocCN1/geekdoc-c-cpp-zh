    **Exercise 66 page 395.** (Dominant set) The constraints of this linear program
    over the integers correspond to a covering problem: a set S of vertices of a graph
    is a dominant set if and only if, for any vertex v of the graph we have that ({v}
    ∪ N_G(v)) ∩ S ≠ ∅, where N_G(v) denotes the set of neighbours of v in G. We can
    write the following code:


