    # ## 12.1.2 Representation of Numbers


    We recall how to denote commonly-used rings with Sage (see §7.2). Integers are
    represented by objects of the class Integer; conversions are performed using the
    parent ZZ or the function IntegerRing(), which returns the object ZZ. Similarly,
    rational numbers are represented by objects of the class Rational; the parent
    of these objects is the object QQ, which is returned by the function RationalField().
    In both cases Sage uses the arbitrary precision library GMP. Without diving into
    the inner workings of this library, the integers used by Sage have arbitrary size,
    limited only by the available memory of the machine on which the software is run.


    Several approximate representations of real numbers are available (see Chapter
    11). There is RealField() — or Real() — for floating-point numbers with a given
    precision and, in particular, RR for 53-bit precision. Representations using machine
    double precision are afforded by RDF, short for RealDoubleField(). There is also
    the class RIF — short for RealIntervalField() — in which a real number is represented
    by an interval containing it; the endpoints of this interval are floating-point
    numbers.


    The analogous representations for complex numbers are: CC, CDF, and CIF. Again,
    to each object is associated a function, namely ComplexField(), ComplexDoubleField(),
    and ComplexIntervalField().


    The computations performed by Polynomial.roots() are exact or approximate depending
    on the representation of the polynomial''s coefficients and (if specified) the
    value of the parameter ring: for instance, given ZZ or QQ, the computation is
    exact; given RR it is approximate. In the second part of this chapter we describe
    the algorithm used for the computation of the roots and specify the role of the
    parameters ring and algorithm (see §12.2).


    Solving algebraic equations is intimately related to the notion of number. The
    splitting field of a nonconstant polynomial p is the smallest field extension
    of the coefficient field in which p is a product of polynomials of degree 1; one
    can prove that such an extension always exists. In Sage, we can construct the
    splitting field'
