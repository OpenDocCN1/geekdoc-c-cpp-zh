    |---|---|

    | `,` `;` | argument and instruction separators |

    | `:` | beginning of an instruction block |

    | `.` | decimal point, accessing an object field |

    | `=` | assignment of a value to a variable |

    | `+` `-` `*` `/` | basic arithmetic operations |

