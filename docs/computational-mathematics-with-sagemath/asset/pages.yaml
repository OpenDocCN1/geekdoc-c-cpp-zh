    The usual problem with this type of approach is to avoid bad decisions that lead
    to leaving the prefix tree and exploring dead branches, particularly problematic
    because the growth of the number of elements is exponential in the depth. It turns
    out that the constraints listed above are simple enough to guarantee the following
    property: given a prefix $\ell_0,\ldots,\ell_k$ of $S$, the set of $\ell_{k+1}$
    such that $\ell_0,\ldots,\ell_{k+1}$ is a prefix of $S$ is either empty or consists
    of an interval $[a,b]$, and the bounds $a$ and $b$ can be calculated in time linear
    in the length of the longest element of $S$ having $\ell_0,\ldots,\ell_k$ as a
    prefix.


    # 15.4.2 Integer Points in Polytopes


    Although the algorithm for iteration in `IntegerListsLex` is efficient, its counting
    algorithm is naive: it just iterates over all the elements.


    There is another approach to this problem: modelling the desired lists of integers
    as the set of integer points of a polytope, that is to say, the set of solutions
    with integer coordinates of a system of linear inequalities. This is a very general
    context in which there exist advanced counting algorithms (e.g., Barvinok), which
    are implemented in libraries like LattE. Iteration does not pose a hard problem
    in principle. However, there are two limitations that justify the existence of
    `IntegerListsLex`. The first is theoretical: lattice points in a polytope only
    allow modelling of problems of a fixed dimension (length). The second is practical:
    at the moment only the library `PALP` has a Sage interface, and though it offers
    multiple capabilities for the study of polytopes, in the present application it
    only produces a list of lattice points, without providing either an iterator or
    non-naive counting:


    ```

    ```sage

    sage: A = random_matrix(ZZ, 6, 3, x=7)

    sage: L = LatticePolytope(A.rows())

    sage: L.points()

    M(1, 4, 3),

    M(6, 4, 1),

    ...

    M(3, 5, 5)

    in 3-d lattice M

    ```

    ```'
