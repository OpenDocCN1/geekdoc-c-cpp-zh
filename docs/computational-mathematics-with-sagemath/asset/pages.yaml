  md: '# # 12

    Non-Linear Equations


    This chapter explains how to *solve* a non-linear equation using Sage. We first
    study polynomial equations and show the limitations of the search for exact solutions.
    We then describe some classical numerical solving methods, while indicating the
    numerical algorithms implemented in Sage.


    # ## 12.1 Algebraic Equations


    An algebraic equation is an equation of the form $p(x) = 0$, where $p$ is a polynomial
    in one variable with coefficients in an integral domain $A$. We say that an element
    $α ∈ A$ is a *root* of the polynomial $p$ if $p(α) = 0$.


    Let $α$ be an element of $A$. Polynomial long division of $p$ by $x − α$ yields
    a constant polynomial $r$ such that


    $p = (x − α)q + r.$


    Upon evaluating this equation at $x = α$, we get $r = p(α)$. So the polynomial
    $x − α$ divides $p$ if and only if $α$ is a root of $p$. This remark leads to
    the notion of *multiplicity* of a root $α$ of the polynomial $p$: it is the largest
    integer $m$ such that $(x − α)^m$ divides $p$. We note that the sum of the multiplicities
    of the roots of $p$ is less than or equal to the degree of $p$.


    # ### 12.1.1 The Method `Polynomial.roots()`


    To solve the algebraic equation $p(x) = 0$ means to identify the roots of the
    polynomial $p$ and their multiplicities. The method `Polynomial.roots()` finds
    the roots of a polynomial. It takes up to three parameters, all of them optional.
    The parameter `ring` indicates the ring in which to search for the roots. If we
    do not'
