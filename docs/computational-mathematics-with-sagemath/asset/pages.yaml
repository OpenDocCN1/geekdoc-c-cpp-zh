  md: "# # 2 Analysis and Algebra\n\nThis chapter uses simple examples to describe\
    \ the useful basic functions in analysis and algebra. Students will be able to\
    \ replace *pen and paper* by *keyboard and screen* while keeping the same intellectual\
    \ challenge of understanding mathematics.\n\nThis presentation of the main calculus\
    \ commands with Sage should be accessible to young students; some parts marked\
    \ with an asterisk are reserved for higher-level students. More details are available\
    \ in the other chapters.\n\n# ## 2.1 Symbolic Expressions and Simplification\n\
    \n# ### 2.1.1 Symbolic Expressions\n\nSage allows a wide range of analytic computations\
    \ on *symbolic expressions* formed with numbers, symbolic variables, the four\
    \ basic operations, and usual functions like `sqrt`, `exp`, `log`, `sin`, `cos`,\
    \ etc. A symbolic expression can be seen as a tree like in Figure 2.1. It is important\
    \ to understand that a symbolic expression is a *formula* and not a value or a\
    \ mathematical function. Thus, Sage does not recognise the two following expressions\
    \ as equal¹:\n\n```\n    sage: bool(arctan(1+abs(x)) == pi/2 - arctan(1/(1+abs(x))))\n\
    \    False\n```\n\nThanks to the commands presented in this chapter, the user\
    \ can transform expressions into the desired form.\n\n¹The equality test `==`\
    \ is not only a syntactic comparison: for example, the expressions `arctan(sqrt(2))`\
    \ and `pi/2-arctan(1/sqrt(2))` are considered equal. In fact, when one compares\
    \ two expressions with `bool(x==y)`, Sage tries to prove that their difference\
    \ is zero, and returns `True` if that succeeds."
