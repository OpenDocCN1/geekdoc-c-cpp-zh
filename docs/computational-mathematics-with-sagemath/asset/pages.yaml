    Once we have created the matrix as a `lil_matrix` (warning, this format requires
    indices of type int from Python), we have to convert it to the `csc` format. The
    above program is not very efficient: the construction of the `lil_matrix` is slow,
    the `lil_matrix` data structure being quite inefficient. However, the conversion
    to a `csc` matrix and its factorisation are fast; the following resolution is
    even faster.


    **Iterative Methods.** The main principle of these methods is to build a sequence
    converging towards the solution of the Ax = b system. Modern iterative methods
    rely on the Krylov space K_n, the vector space spanned by {b, Ab, ..., A^n b}.
    Among the most popular methods, let us mention:


    +   - the conjugate gradient method: it can only be used for systems whose matrix
    A is symmetric positive definite. In this case ||x||_A = √(xᵀAx) is a norm, and
    the iterate x_n is such that it minimises the error ||x − x_n||_A between the
    solution x and x_n for x_n ∈ K_n (some formulas exist which are easy to program,
    cf. for example [GVL12]);


    +   - the generalised minimal residual method (GMRES): it is designed for non-symmetric
    linear systems. At the n-th iteration, the Euclidean residual norm ||Ax_n − b||₂
    is minimised for x_n ∈ K_n. We notice that it is a least squares problem.


    In practice, these methods are only efficient with preconditioning: instead of
    solving Ax = b, we solve MAx = Mb where M is a matrix such that MA has a better
    condition number than A. The study and discovery of efficient preconditioners
    is an active branch of numerical analysis, with fruitful developments. As an example,
    here is the resolution of the system studied above by the conjugate gradient method,
    where the preconditioner M is the inverse of the diagonal of A. It is a simple
