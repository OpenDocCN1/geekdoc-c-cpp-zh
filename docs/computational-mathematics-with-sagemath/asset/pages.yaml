    # Carmichael numbers


    *Carmichael numbers* are composite integers \(n\) that are pseudo-primes to all
    bases coprime to \(n\). Fermat’s Little Theorem is insufficient to distinguish
    these from primes, however many bases are tested. The smallest Carmichael number
    is 561 = 3 · 11 · 17. A Carmichael number must have at least three prime factors:
    for suppose that \(n = pq\) is a Carmichael number, with \(p, q\) primes and \(p
    < q\); by definition of Carmichael numbers, if \(a\) is a primitive root modulo
    \(q\) then \(a^{n-1} \equiv 1\) modulo \(n\) implies that the same congruence
    also holds modulo \(q\), and hence that \(n - 1\) is a multiple of \(q - 1\).
    Then \(n\) must be of the form \(q + \lambda q(q - 1)\), since it is a multiple
    of \(q\) and \(n - 1\) is a multiple of \(q - 1\); now \(n = pq\) implies \(p
    = \lambda(q - 1) + 1\), which contradicts \(p < q\). If \(n = pqr\), then \(n\)
    is a Carmichael number if \(a^{n-1} \equiv 1\) mod \(p\), and similarly modulo
    \(q\) and \(r\), since then the Chinese Remainder Theorem implies that \(a^{n-1}
    \equiv 1\) mod \(n\). So a sufficient condition is that \(n - 1\) is divisible
    by each of \(p - 1\), \(q - 1\) and \(r - 1\).


    ```

    ```sage

    sage: [560 % (x-1) for x in [3,11,17]]

    [0, 0, 0]

    ```

    ```


    **Exercise 20.** Write a Sage function to count the Carmichael numbers \(n = pqr
    \leq N\), with \(p, q, r\) distinct odd primes. How many do you find for \(N =
    10^4, 10^5, 10^6, 10^7\)? [Richard Pinch has counted 20138200 Carmichael numbers
    less than \(10^{21}\).]


    Finally, in order to repeat an operation on all prime numbers in an interval,
    it is better to employ the construction `prime_range`, which constructs a table
    of primes using a sieve, than to simply use a loop with `next_probable_prime`
    or `next_prime`.


    ```

    ```sage

    sage: def count_primes1(n):

    .....:     return add([1 for p in range(n+1) if is_prime(p)])

    sage: %timeit count_primes1(10^5)

    5 loops, best of 3: 674 ms per loop

    ```

    ```


    The function is faster if one uses `is_pseudoprime` instead of `is_prime`:


    ```

    ```sage

    sage: def count_primes2(n):

    .....:     return add([1 for p in range(n+1) if is_pseudoprime(p)])

    sage: %timeit count_primes2(10^5)

    5 loops, best of 3: 256 ms per loop

    ```

    ```


