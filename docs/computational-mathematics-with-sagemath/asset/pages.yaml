  md: '**Padé Approximants.** The case $m = x^n$ is called Padé approximant. A Padé
    approximant of type $(k, n - k)$ of a formal power series $f \in K[[x]]$ is a
    rational function $p/q \in K(x)$ such that $\deg p \le k - 1$, $\deg q \le n -
    k$, $q(0) = 1$, and $p/q = f + O(x^n)$. We then have $p/q \equiv f \bmod x^n$.


    Let us start with a symbolic example. The following commands compute a Padé approximant
    of the series $f = \sum_{i=0}^{\infty} (i + 1)^2 x^i$ with coefficients in $\mathbb{Z}/101\mathbb{Z}$:


    ```

    ~~~

    sage: A = Integers(101); R.<x> = []

    sage: f6 = sum((i+1)^2 * x^i for i in (0..5)); f6

    36*x^5 + 25*x^4 + 16*x^3 + 9*x^2 + 4*x + 1

    sage: num, den = f6.rational_reconstruct(x^6, 1, 3); num/den

    (100*x + 100)/(x^3 + 98*x^2 + 3*x + 100)

    ~~~

    ```


    By expanding back into power series the rational function found, we see that not
    only the terms correspond up to the term in $x^5$, but even the next term “is
    correct”!


    ```

    ~~~

    sage: S = PowerSeriesRing(A, ''x'', 7); S(num)/S(den)

    1 + 4*x + 9*x^2 + 16*x^3 + 25*x^4 + 36*x^5 + 49*x^6 + O(x^7)

    ~~~

    ```


    Indeed, $f$ itself is a rational function: we have $f = (1 + x)/(1 - x)^3$. The
    truncated expansion $f_6$, together with bounds on the degrees of the numerator
    and denominator, is enough to represent it without any ambiguity. From this point
    of view, the computation of Padé approximants is the converse of the series expansion
    of power series: it allows us to go back from this alternative representation
    to the usual one as quotient of two polynomials.


    **An Analytic Example.** Historically, Padé approximants do not come from this
    kind of symbolic reasoning, but from the approximation theory of analytic functions.
    Indeed, the Padé approximants of the series expansion of an analytic function
    often approximate the function better than series truncations. When the degree
    of the denominator is large enough, Padé approximants can even give good approximations
    outside the convergence disc of the series. We sometimes say that they “swallow
    the poles”. Figure 7.1, which shows the convergence of the approximations of type
    $(2k, k)$ of the tangent function around $0$, illustrates this phenomenon.


    Although `rational_reconstruct` is restricted to polynomials on $\mathbb{Z}/n\mathbb{Z}$,
    it is possible to use it to compute Padé approximants with rational coefficients,
    and obtain that figure. The simplest way is to first perform the rational reconstruction
    modulo a large enough prime:


    ```

    ~~~

    sage: x = var(''x''); s = tan(x).taylor(x, 0, 20)

    sage: p = previous_prime(2^30); ZpZx = Integers(p)[''x'']

    sage: Qx = QQ[''x'']


    sage: num, den = ZpZx(s).rational_reconstruct(ZpZx(x)^10,4,5)

    sage: num/den

    (1073741779*x^3 + 105*x)/(x^4 + 1073741744*x^2 + 105)

    ~~~

    ```'
