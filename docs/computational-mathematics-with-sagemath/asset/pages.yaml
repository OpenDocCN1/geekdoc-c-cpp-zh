  md: '# 7


    Polynomials


    This chapter will discuss univariate polynomials and related objects, mainly rational
    functions and formal power series. We will first see how to perform with Sage
    some transformations like the Euclidean division of polynomials, factorisation
    into irreducible polynomials, root isolation, or partial fraction decomposition.
    All these transformations will take into account the ring or field where the polynomial
    coefficients live: Sage enables us to compute in polynomial rings $A[x]$, in their
    quotient $A[x]/(P(x))$, in fraction fields $K(x)$ or in formal power series rings
    $A[[x]]$ for a whole set of base rings.


    Operations on polynomials also have some unexpected applications. How would you
    automatically guess the next term of the sequence


    1, 1, 2, 3, 8, 11, 39...?


    For example, you could use the Padé approximation of rational functions, presented
    in Section 7.4.3! How could you get a series expansion of the solutions of the
    equation $e^{x f(x)} = f(x)$? An answer can be found in Section 7.5.3.


    We assume in general that the reader is used to playing with polynomials and rational
    functions at the first year university level. However, we will discuss more advanced
    subjects. How to prove that the solutions of the equation $x^5 - x - 1$ cannot
    be expressed by radicals? It suffices to compute its Galois group, as explained
    in Section 7.3.4. The corresponding parts are not used elsewhere in this book,
    and the reader may skip them. Finally, this chapter gives a few examples with
    algebraic and $p$-adic numbers.


    Here we will focus on polynomials with one variable, called univariate polynomials.
    Multivariate polynomials are discussed in Chapter 9.'
