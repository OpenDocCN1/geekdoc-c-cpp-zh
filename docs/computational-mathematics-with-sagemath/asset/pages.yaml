    # 16.3.1 Greedy Vertex Colouring of a Graph


    To colour the vertices of a graph means to assign to each vertex a colour (here
    we can agree that an integer will serve as a colour), so that each vertex has
    a different colour from that of its neighbours. This is of course always possible:
    it suffices to use as many colours as there are vertices; it is for this reason
    that the problem of colouring is a minimisation problem: to find, given a graph
    \(G\), the smallest number \(\chi(G)\) of colours that satisfies the aforementioned
    constraint.


