  md: '> > In order to solve this differential equation you look at it till a solution
    occurs to you.

    > >

    > > George Pólya (1887 - 1985)


    # # 10

    ## Differential Equations and Recurrences


    # 10.1  Differential Equations


    # 10.1.1  Introduction


    If George Pólya’s method does not seem very effective, one can appeal to Sage
    even if the domain of formal resolution of differential equations remains a weakness
    of many symbolic computation systems. Sage is evolving however by expanding its
    spectrum of resolution.


    One can, if desired, invoke Sage in order to obtain a qualitative study: indeed,
    its numerical and graphical tools will guide the intuition. This is the subject
    of Section 14.2 from the chapter on numerical integration. Tools for the graphical
    study of the solutions are given in Section 4.1.6. Solving methods using series
    can be found in Section 7.5.2.


    One may prefer to solve differential equations exactly. Sage can sometimes help
    by directly giving a formal answer as we will see in this chapter.


    In most cases, it will be necessary to go through a tricky manipulation of these
    equations to help Sage. It should be kept in mind that the expected solution of
    a differential equation is a *function* differentiable over a certain interval,
    but that Sage manipulates *expressions* without a definition domain. The machine
    will therefore require human intervention to move towards a rigorous solution.


    We shall first study generalities on ordinary differential equations of order
    1 and some special cases such as linear equations, separable equations, homogeneous
    equations, a parameter dependent equation (§10.1.2); then more briefly the equations
    of order 2 and an example of a partial differential equation (§10.1.3). We will
    end with the use of the Laplace transform (§10.1.4) and finally the resolution
    of some differential systems (§10.1.5).'
