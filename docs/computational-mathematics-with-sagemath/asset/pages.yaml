- pgno: 108
  md: '# # 5 Computational Domains


    Writing mathematics on paper or on the blackboard requires a compromise between
    ease of notations and rigour. The same holds for the day-to-day use of a computer
    algebra system. Sage tries to give this choice to the user, by letting her/him
    specify, more or less rigorously, the computational domains: what is the nature
    of the considered objects, in which sets do they live, which operations can be
    applied to them?


    # ## 5.1 Sage is Object-Oriented


    Python and Sage use heavily the object-oriented programming paradigm. Even though
    this remains relatively transparent in common use, it is useful to know a little
    about this paradigm, which is quite natural in a mathematical context.


    # ### 5.1.1 Objects, Classes and Methods


    The object-oriented programming paradigm consists in modelling each physical or
    abstract entity one wishes to manipulate by a programming language construction
    called an *object*. In most cases, as in Python, each object is an instance of
    a *class*. For example, the rational number 12/35 is represented by an object
    which is an instance of the `Rational` class:


    ```

    sage: o = 12/35

    sage: type(o)

    <type ''sage.rings.rational.Rational''>

    ```


    Note that this class is really associated to the object 12/35, and not to the
    variable o in which it is stored:'
  merge: -1
  img_proc: true
- pgno: 109
  md: '```

    ```

    sage: type(12/35)

    <type ''sage.rings.rational.Rational''>

    ```

    ```


    Let us be more precise. An *object* is a part of the computer memory which stores
    the required information to represent the corresponding entity. The *class* in
    turn defines two things:


    +   1. the *data structure* of an object, i.e., how the information is organised
    in memory. For example, the Rational class specifies that a rational number like
    12/35 is represented by two integers: its numerator and its denominator;

    +   2. its *behaviour*, in particular the available *operations* on this object:
    how to obtain the numerator of a rational number, how to compute its absolute
    value, how to multiply or add two rational numbers. Each of these operations is
    implemented by a *method* (here respectively `numerator`, `abs`, `__mul__`, `__add__`).


    To factor an integer, we will thus call the *factor* method with the following
    syntax:


    ```

    ```

    sage: o = 720

    sage: o.factor()

    2^4 * 3^2 * 5

    ```

    ```


    which we can read as follows: “take the value of `o` and apply to it the *factor*
    method, without any other argument”. Under the hood, Python performs the following
    computation:


    ```

    ```

    sage: type(o).factor(o)

    2^4 * 3^2 * 5

    ```

    ```


    From left to right: “request from the class of `o` (`type(o)`) the factorisation
    method (`type(o).factor`), and apply it to `o`”.


    Please note that we can apply this method not only to a variable, but also directly
    to a value:


    ```

    ```

    sage: 720.factor()

    2^4 * 3^2 * 5

    ```

    ```


    and thus we can chain the operations, from left to right. Here, we first take
    the numerator of a rational number, then we factor this numerator:


    ```

    ```

    sage: o = 720 / 133

    sage: o.numerator().factor()

    2^4 * 3^2 * 5

    ```

    ```


    To make the user’s life easier, Sage also provides a *function* `factor`, so that
    `factor(o)` is a shortcut for `o.factor()`. It is the case for several common
    functions, and it is possible to add our own shortcuts, as illustrated in the
    following exercise.


    **Exercise 18.** Build a shortcut `ndigits` so that `ndigits(o)` calls the `ndigits`
    method of the object `o`.'
