- pgno: 293
  md: 'Consider for example the system \(Ax=b\) to solve, where \(A\) is a matrix
    with real coefficients. How big error \(\delta x\) do we get if we modify \(A\)
    by \(\delta A\) or \(b\) by \(\delta b\)? We give some partial answers in this
    chapter.


    # ### 13.1.1 Matrix Norms and Condition Number


    Let \(A \in \mathbb{R}^{n \times n}\) (or \(\mathbb{C}^{n \times n}\)). We define
    on \(\mathbb{R}^n\) (or \(\mathbb{C}^n\)) a norm \(\|x\|\), for example the norm
    \(\|x\|_\infty = \max_i |x_i|\) or \(\|x\|_1 = \sum_{i=1}^n |x_i|\), or even the
    Euclidean norm \(\|x\|_2 = (\sum_{i=1}^n |x_i|^2)^{1/2}\); then the quantity


    \[\|A\| = \max_{\|x\|=1} \|A x\|\]


    defines a norm on the set of \(n \times n\) matrices. We say it is an *induced
    norm* with respect to the norm defined on \(\mathbb{R}^n\) (or \(\mathbb{C}^n\)).
    The *condition number* of a nonsingular matrix \(A\) is defined by \(\kappa(A)
    = \|A^{-1}\| \cdot \|A\|\). The fundamental result is that, if \(A\) is slightly
    modified by \(\delta A\) and \(b\) by \(\delta b\), then the solution \(x\) of
    the linear system \(Ax=b\) is modified by \(\delta x\) satisfying


    \[\frac{\|\delta x\|}{\|x\|} \le \frac{\kappa(A)}{1-\kappa(A)\|\delta A\|/\|A\|}\left(\frac{\|\delta
    A\|}{\|A\|}+\frac{\|\delta b\|}{\|b\|}\right).\]


    The norms \(\|\cdot\|_\infty\) and \(\|\cdot\|_1\) are easy to compute: \(\|A\|_\infty
    = \max_{1\le i\le n}(\sum_{j=1}^n |a_{ij}|)\) and \(\|A\|_1 = \max_{1\le j\le
    n}\sum_{i=1}^n |a_{ij}|)\). On the contrary, the norm \(\|\cdot\|_2\) is more
    difficult to compute, since \(\|A\|_2 = \sqrt{\rho(A^T A)}\), the spectral radius
    \(\rho\) of a matrix \(A\) being the largest modulus of its eigenvalues.


    The Frobenius norm is defined by


    \[\|A\|_F = \left(\sum_{i=1}^n \sum_{j=1}^n |a_{ij}|^2\right)^{1/2}.\]


    We easily check that \(\|A\|_F^2 = \mathrm{trace}(A^T A)\). Contrary to the above
    norms, it is not an induced norm.


    **Computing Matrix Norms in Sage.** The matrices in Sage have a `norm(p)` method.
    According to the value of the argument `p` it computes:


    +   - \(p=1\): \(\|A\|_1\), \(p=2\): \(\|A\|_2\)

    +   - \(p=\text{Infinity}\): \(\|A\|_\infty\), \(p=\text{''frob''}\): \(\|A\|_F\)


    This method only works when the matrix coefficients can be converted into complex
    floating-point numbers CDF. Please note that we write `A.norm(Infinity)` but `A.norm(''frob'')`.
    With `A.norm()` we obtain the default norm \(\|A\|_2\).'
