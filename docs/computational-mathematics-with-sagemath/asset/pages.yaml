  md: '# # 17

    ## Linear Programming


    This chapter is devoted to linear programming and mixed integer linear programming,
    presenting numerous problems that can be solved with these methods. The applications
    considered mainly come from graph theory, and the elementary ones should be easily
    understandable without any specific knowledge of this field. As a tool in combinatorics,
    applying linear programming amounts to understanding how to reformulate a problem
    of existence or optimisation in terms of linear constraints.


    # 17.1 Definition


    A *linear program* is a system of linear equations where the goal is to search
    for an optimal solution. Formally, it is defined by a matrix \(A : \mathbb{R}^m
    \to \mathbb{R}^n\) and two vectors \(b \in \mathbb{R}^n\) and \(c \in \mathbb{R}^m\).
    Solving a linear program here refers to find a vector \(x \in \mathbb{R}^m\) which
    maximises an *objective* function, while satisfying a system of linear constraints,
    i.e.,


    \[c^{t}x = \max_{y\ \text{s.t.}\ Ay\le b} c^{t}y\]


    where the relation \(u \le u''\) between two vectors indicates that the values
    of \(u\) are less than or equal to those of \(u''\), componentwise. We will also
    write:


    \[\text{maximise: } c^{t}x\]

    \[\text{such that: } Ax \le b.\]'
