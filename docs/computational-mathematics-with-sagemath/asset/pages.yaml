    of size greater than four as an induced subgraph. Equivalently, any chordal graph
    can be decomposed by sequentially removing those vertices whose neighbourhood
    is a complete graph (this decomposition order is called a *perfect elimination
    ordering*). Such graphs can be recognised using a *breadth-first search* (`lex_BFS`).


    Method: `is_chordal`


    **Interval Graphs.** Let I = {I₁,…,Iₙ} be a finite set of intervals of real numbers.
    From I, we define a graph G of n vertices {1,…,n}, where two vertices i and j
    are adjacent if and only if the corresponding intervals Iᵢ and Iⱼ have a non-empty
    intersection. Interval graphs are those that can be constructed in this fashion.
    They make up a sub-class of chordal graphs, recognisable in linear time thanks
    to the structure of PQ-trees.


    Method: `is_interval`


    **Perfect Graphs.** A graph G is said to be *perfect* if for all induced subgraphs
    G′ ⊆ G the chromatic number of G′ is equal to the maximum size of a clique (i.e.,
