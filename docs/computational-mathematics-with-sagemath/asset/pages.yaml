    ```text

    (x^4 + 2*x^3 + x^2 + 1)/(x^2 + x)

    sage: parent(p + 1/p)

    Fraction Field of Univariate Polynomial Ring in x over Integer Ring

    ```

    ```


    As we will see in §5.4.2, there is no optimal representation for polynomials and
    fractions. The elements of polynomial rings are represented in expanded form.
    These rings do therefore have a normal form as soon as the coefficients themselves
    belong to a domain with normal form.


    These polynomials differ from the polynomial expressions (Symbolic Ring) we have
    seen in Chapter 2, which do not have a well-defined coefficient type, neither
    a parent reflecting such a type. The latter give an alternative to “true” polynomials,
    which can be useful, for example, to mix polynomials and other mathematical expressions.
    However, contrary to polynomial rings, when we work with such expressions, we
    have to explicitly call a reduction command like expand to put them in normal
    form (if such a form exists).


    # **Power Series.**


    Truncated power series are objects of the form


    $$a_0 + a_1 x + a_2 x^2 + \cdots + a_n x^n + O(x^{n+1})$$


    used for example to represent Taylor expansions, and whose usage in Sage is described
    in §7.5. The parent of series in $x$, truncated at order $n$, and with coefficients
    in $A$, is the ring $A[[x]]$, build with **PowerSeriesRing(A, ’x’, n)**.


    Like polynomials, truncated power series have an analogue in the world SR of symbolic
    expressions. The corresponding command to reduce to normal form is series.


    ```

    ```text

    sage: f = cos(x).series(x == 0, 6); 1 / f

    ```

    ```


    $$\frac{1}{1+(-\frac{1}{2})x^2+\frac{1}{24}x^4+O(x^6)}$$


    ```

    ```text

    sage: (1 / f).series(x == 0, 6)

    ```

    ```


    $$1 + \frac{1}{2}x^2 + \frac{5}{24}x^4 + O(x^6)$$


    # **Algebraic Numbers.**


    An algebraic number is defined as root of a polynomial. When the polynomial degree
    is 5 or more, in general it is not possible to explicitly write its roots in terms
    of the operations $+,-,\times,/,$ $\sqrt{\ }$. However, many computations involving
    the roots can be performed successfully without any other information than the
    polynomial itself.


    ```

    ```text

    sage: k.<a> = NumberField(x^3 + x + 1); a^3; a^4+3*a

    -a - 1

    -a^2 + 2*a

    ```

    ```


    This book does not describe in detail how to play with algebraic numbers in Sage,
    however several examples can be found in Chapters 7 and 9.'
