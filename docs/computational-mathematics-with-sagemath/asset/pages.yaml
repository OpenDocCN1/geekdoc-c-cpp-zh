  md: "```\nsage: p = y^2 - x; q = y^2 + x\nsage: p.resultant(q, y)\n4*x^2\nsage:\
    \ ideal(p, q).elimination_ideal(y)\nIdeal (x) of Multivariate Polynomial Ring\
    \ in x, y over Rational Field\n```\n\n# 9.2.5 Zero-Dimensional Systems\n\nWe can\
    \ deal with many problems just with the computation of elimination ideals, and\
    \ Sage does not provide other “black-box” tools to solve general polynomial systems.\
    \ The situation is somewhat different for zero-dimensional systems.\n\nAn ideal\
    \ \\(J \\subset K[x]\\) is said to have dimension zero when the quotient \\(K[x]/J\\\
    ) is a vector space of finite dimension. Over an algebraically closed field, it\
    \ is equivalent to say that the variety \\(V(J)\\) contains a finite number of\
    \ points. For example, the systems (9.1) and (9.3) generate ideals of dimension\
    \ zero — we say they are themselves zero-dimensional. On the contrary, the ideal\
    \ \\(((x^2+y^2)(x^2+y^2+1))\\) of \\(\\mathbb{Q}[x,y]\\) is of dimension 1, despite\
    \ its only real solution being (0, 0):\n\n```\nsage: R.<x,y> = QQ[]\nsage: ((x^2\
    \ + y^2)*(x^2 + y^2 + 1)*R).dimension()\n1\n```\n\nZero-dimensional systems can\
    \ be solved more explicitly than what is possible with the general tools from\
    \ the previous section. We have already seen several of these methods in practice\
    \ on the example of §9.2.1.\n\n**Enumerating the Solutions.** First, having a\
    \ finite number of solutions enables us to enumerate them, exactly or approximately.\n\
    \nThe Sage expression `J.variety(L)` computes the variety \\(V_L(J)\\). It raises\
    \ an error if \\(J\\) is not zero-dimensional. By default, it looks for solutions\
    \ with coordinates in the base field of the polynomial ring over which the system\
    \ is defined. For example, the subvariety of \\(\\mathbb{Q}^n\\) defined by \\\
    (J_1\\) is empty:\n\n```\nsage: R.<x,y> = QQ[]\nsage: J1 = (x^2 + y^2 - 1, 16*x^2*y^2\
    \ - 1)*R\nsage: J1.variety()\n[]\n```\n\nBut, like the roots method for univariate\
    \ polynomials, `variety` works for any kind of domain \\(L\\). The most important\
    \ case for now is the field of algebraic numbers. We can indeed show that the\
    \ solutions of a zero-dimensional system with coefficients in \\(K\\) have coordinates\
    \ in the algebraic closure of \\(K\\). Therefore, it is possible to compute exactly\
    \ the complex variety \\(V_{\\mathbb{C}}(J)=V_{\\bar{\\mathbb{Q}}}(J)\\) associated\
    \ to an ideal \\(J \\subset \\mathbb{Q}[x]\\):\n\n```\nsage: J1.variety(QQbar)[0:2]\n\
    [{y: -0.9659258262890683?, x: -0.2588190451025208?},\n {y: -0.9659258262890683?,\
    \ x: 0.2588190451025208?}]\n```\n\n**Exercise 36.** Show that the solutions of\
    \ \\((S_1)\\) have coordinates in \\(\\mathbb{Q}[\\sqrt{2-\\sqrt{3}}]\\), and\
    \ give them in terms of radicals."
