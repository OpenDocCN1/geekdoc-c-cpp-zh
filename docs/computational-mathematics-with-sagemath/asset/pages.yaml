    \ + _K2*e^(-sqrt(k)*x)\n```\n```\n\nthat is $f(x)=k_1e^{\\sqrt{k}x}+k_2e^{-\\\
    sqrt{k}x}$.\n\n# 10.1.4 The Laplace Transform\n\nThe Laplace transform converts\
    \ a differential equation with initial conditions into an algebraic equation and\
    \ the inverse transform then makes it possible to get back to the solution of\
    \ the differential equation.\n\nIf $f$ is a function defined on $\\mathbb{R}$\
    \ and is identically zero on $]-\\infty,0[$, we call Laplace transform of $f$\
    \ the function $F$ defined, under certain conditions, by:\n\n$$\\mathcal{L}(f(x))=F(s)=\\\
    int_0^{+\\infty}e^{-sx}f(x)\\,dx.$$\n\nLaplace transforms are easily obtained\
    \ from polynomial, trigonometric, exponential functions, and so on. These transforms\
    \ have very interesting properties, especially concerning the transform of a derivative:\
    \ if $f'$ is a piecewise continuous function on $\\mathbb{R}_+$, then\n\n$$\\\
    mathcal{L}(f'(x))=s\\mathcal{L}(f(x))-f(0),$$\n\nand if $f'$ satisfies the conditions\
    \ imposed on $f$:\n\n$$\\mathcal{L}(f''(x))=s^2\\mathcal{L}(f(x))-sf(0)-f'(0).$$\n\
    \n**Example.** We want to solve the differential equation $y''-3y'-4y=\\sin(x)$\
    \ using the Laplace transform with the initial conditions: $y(0)=1$ and $y'(0)=-1$.\
    \ Thus:\n\n$$\\mathcal{L}(y''-3y'-4y)=\\mathcal{L}(\\sin(x)),$$\n\nthat is:\n\n\
    $$ (s^2-3s-4)\\mathcal{L}(y)-sy(0)-y'(0)+3y(0)=\\mathcal{L}(\\sin(x)).$$\n\nIn\
    \ case we forgot the Laplace transforms of the most common functions, we can use\
    \ Sage:\n\n```\n```text\nsage: x, s = var('x, s'); f = function('f')(x)\nsage:\
    \ f(x) = sin(x); f.laplace(x,s)\n```\n```"
