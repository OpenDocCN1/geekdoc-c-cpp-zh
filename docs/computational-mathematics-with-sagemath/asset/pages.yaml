  md: '# 10.2.2  Linear Recurrences with Rational Coefficients


    Sage deals with relations of the following kind:


    $$a_k u_{n+k} + a_{k-1}u_{n+k-1} + \cdots + a_1u_{n+1} + a_0u_n = 0,$$


    the $(a_i)_{0\le i\le k}$ being an indexed family of rational scalars.


    For instance, consider the following relation:


    $$u_0=-1,\quad u_1=1,\quad u_{n+2}=\frac{3}{2}u_{n+1}-\frac{1}{2}u_n.$$


    The well known function `rsolve` is not directly accessible. It must be picked
    up in SymPy, which causes some inconvenience such as syntax changes to declare
    variables. Here, for example, a preamble is necessary:


    ```

    ```sage

    sage: from sympy import Function

    sage: from sympy.abc import n

    sage: u = Function(''u'')

    ```

    ```


    The recurrence relation must then be defined as: $a_k u_{n+k}+\cdots+a_0u_n=0$.
    Here $u_{n+2}-\frac{3}{2}u_{n+1}+\frac{1}{2}u_n=0$:


    ```

    ```sage

    sage: f = u(n+2)-(3/2)*u(n+1)+(1/2)*u(n)

    ```

    ```


    Finally, we use `rsolve`, observing how the initial conditions are declared (`u(0):value`,
    `u(1):value`, etc.):


    ```

    ```sage

    sage: from sympy import rsolve

    sage: rsolve(f, u(n), {u(0):-1,u(1):1})

    3 - 4*2**(-n)

    ```

    ```


    that is $u_n=3-\frac{1}{2^{n-1}}$.


    # 10.2.3  Non-Homogeneous Linear Recurrence Relations


    Sage also deals with relations of the following kind:


    $$a_k(n)u_{n+k}+a_{k-1}(n)u_{n+k-1}+\cdots+a_1(n)u_{n+1}+a_0(n)u_n=f(n),$$


    the $(a_i)_{0\le i\le k}$ being an indexed family of polynomial, rational or hypergeometric
    functions of $n$.


    The command will depend on the nature of $f(n)$:


    +   - `rsolve_poly` if $f$ is polynomial;

    +   - `rsolve_ratio` if $f$ is rational;

    +   - `rsolve_hyper` if $f$ is hypergeometric.


    The coefficients $a_i(n)$ are given as a list $[a_0(n),\ldots,a_{k-1}(n),a_k(n)]$.
    For example, in order to study the complexity of merge sort, one has to study
    the following relation:


    $$u_{n+1}=2u_n+2^{n+2},\quad u_0=0.$$


    The computation yields:'
