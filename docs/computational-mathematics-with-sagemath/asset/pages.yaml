  md: 'The Magnus effect was proposed to build propulsion systems made from large
    vertical rotating cylinders able to produce a longitudinal thrust when the wind
    is perpendicular to the ship (this was the case of the Baden-Baden rotor ship
    built by Anton Flettner, which crossed the Atlantic in 1926).


    # ### 4.1.7 Evolute of a Curve


    We now give an example of drawing the evolute of a parametric arc (let us recall
    that the evolute is the envelope of the normals of a curve, or equivalently, the
    locus of centres of curvature).


    EXAMPLE. (*Evolute of the parabola*) Let us find the equation of the evolute of
    the parabola $\mathcal{P}$ of equation $y=x^2/4$, and show on the same graph the
    parabola $\mathcal{P}$, some normals to $\mathcal{P}$ and its evolute.


    To determine a system of parametric equations $(x(t),y(t))$ of the evolute of
    a family of lines $\Delta_t$ defined by cartesian equations of the form $\alpha(t)X+\beta(t)Y=\gamma(t)$,
    we express the fact that the line $\Delta_t$ is tangent to the envelope at $(x(t),y(t))$:


    \[ \alpha(t)x(t)+\beta(t)y(t)=\gamma(t), \quad (4.1) \]

    \[ \alpha(t)x''(t)+\beta(t)y''(t)=0. \quad (4.2) \]


    The derivative of Equation (4.1), combined with (4.2), yields the system:


    \[ \alpha(t)x(t)+\beta(t)y(t)=\gamma(t), \quad (4.1) \]

    \[ \alpha''(t)x(t)+\beta''(t)y(t)=\gamma''(t). \quad (4.3) \]


    In our case, the normal $(N_t)$ to the parabola $\mathcal{P}$ in $M(t,t^2/4)$
    has normal vector $\vec{v}=(1,t/2)$ (which is tangent to the parabola); it thus
    has for equation:


    \[ \begin{pmatrix} x-t \\ y-t^2/4 \end{pmatrix} \cdot \begin{pmatrix} 1 \\ t/2
    \end{pmatrix}=0 \quad\Longleftrightarrow\quad x+\frac{t}{2}y=t+\frac{t^3}{8},
    \]


    in other words, $(\alpha(t),\beta(t),\gamma(t))=(1,t/2,t+t^3/8)$. We can then
    solve the preceding system with the solve function:


    ```

    ```sage

    sage: x, y, t = var(''x, y, t'')

    sage: alpha(t) = 1; beta(t) = t / 2; gamma(t) = t + t^3 / 8

    sage: env = solve([alpha(t) * x + beta(t) * y == gamma(t),\

