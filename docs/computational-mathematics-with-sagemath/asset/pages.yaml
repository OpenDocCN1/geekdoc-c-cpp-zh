    sage: BT.define( Leaf + (BT*BT) )

    ```

    ```


    Now we can construct the set of trees with five nodes, list them, count them...:


    ```

    ```sage

    sage: BT5 = BT.isotypes([o]*5); BT5.cardinality()

    ```

