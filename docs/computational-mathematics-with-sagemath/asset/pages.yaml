    **Exercise 62** (*Circulant graphs*). A circulant graph parameterised by $n, d$
    is a graph of $n$ vertices numbered from 0 to $n - 1$ (which we can represent
    in shape of a circle), such that two vertices $u$ and $v$ are connected by an
    edge if $u \equiv v + c \bmod n$, with $-d \leq c \leq d$. Write a function which
    takes the parameters $n$ and $d$, and returns the associated graph.


