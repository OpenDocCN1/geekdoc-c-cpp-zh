  md: "# ### 7.5.1 Operations on Truncated Power Series\n\nThe ring Q[[x]] of formal\
    \ power series is constructed by\n\n```\n    sage: R.<x> = PowerSeriesRing(QQ)\n\
    ```\n\nor in short R.<x> = QQ[[]]^5. The elements of A[['x']] are truncated power\
    \ series, i.e., objects of the form\n\n$$f = f_0 + f_1 x + ... + f_{n-1} x^{n-1}\
    \ + O(x^n).$$\n\nThey play the role of approximations of infinite “mathematical”\
    \ series, much like elements of RR are approximations of real numbers. The A[['x']]\
    \ ring is thus an inexact ring.\n\nEach series has its own order of truncation^6\
    \ and the precision automatically follows through computations:\n\n```\n    sage:\
    \ R.<x> = QQ[[]]\n    sage: f = 1 + x + O(x^2); g = x + 2*x^2 + O(x^4)\n    sage:\
    \ f + g\n    1 + 2*x + O(x^2)\n    sage: f * g\n    x + 3*x^2 + O(x^3)\n```\n\n\
    Series with infinite precision do exist, they correspond exactly to polynomials:\n\
    \n```\n    sage: (1 + x^3).prec()\n    +Infinity\n```\n\nA default precision is\
    \ used when it is necessary to truncate an exact result. It is given at the ring\
    \ creation, or afterwards with the set_default_prec method:\n\n```\n    sage:\
    \ R.<x> = PowerSeriesRing(Reals(24), default_prec=4)\n    sage: 1/(1 + RR.pi()\
    \ * x)^2\n    1.00000 - 6.28319*x + 29.6088*x^2 - 124.025*x^3 + O(x^4)\n```\n\n\
    As a consequence of the above, it is not possible to test the mathematical equality\
    \ between two series. This is an important difference between these objects and\
    \ the other classes of objects seen in this chapter. Sage thus considers two elements\
    \ of A[['x']] as equal as soon as they match up to the smallest of their precisions:\n\
    \n```\n    sage: R.<x> = QQ[[]]\n    sage: 1 + x + O(x^2) == 1 + x + x^2 + O(x^3)\n\
    \    True\n```\n\nWarning: this implies that the test O(x^2) == 0 returns true.\n\
    The basic arithmetic operations on series work as for polynomials. We also have\
    \ some usual functions, for example f.exp() when f(0) = 0, as well as the\n\n\
    ^5 Or from Q[[x]], by QQ[['x']].completion('x').\n\n^6 In some sense, this is\
    \ the main difference between a polynomial modulo x^n and a series truncated at\
    \ order n: the operations on these two objects are analogous, but the elements\
    \ of A[[x]]/(x^n) have all the same \"precision\"."
