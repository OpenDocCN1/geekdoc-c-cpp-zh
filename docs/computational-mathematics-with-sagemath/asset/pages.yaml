  md: "**A Parametric Equation: The Verhulst Equation.** The relative rate of growth\
    \ of a population is a linearly decreasing function of the population. In order\
    \ to study this, one can attempt to solve an equation of the form:\n\n$$ y' =\
    \ ay - by^2 $$\n\nwith $a$ and $b$ being positive real parameters.\n\n```\n  \
    \  sage: x = var('x'); y = function('y')(x); a, b = var('a, b')\n    sage: DE\
    \ = diff(y,x) - a*y == -b*y**2\n    sage: sol = desolve(DE, [y,x]); sol\n    -(log(b*y(x)\
    \ - a) - log(y(x)))/a == _C + x\n```\n\nAs usual, we do not get $y$ explicitly.\
    \ Let us try to isolate it with solve:\n\n```\n    sage: Sol = solve(sol, y)[0];\
    \ Sol\n    log(y(x)) == _C*a + a*x + log(b*y(x) - a)\n```\n\nWe still do not have\
    \ an explicit solution. We group together the terms on the left-hand side and\
    \ simplify this expression using simplify_log():\n\n```\n    sage: Sol = Sol.lhs()\
    \ - Sol.rhs(); Sol(x)\n    -_C*a - a*x - log(b*y(x) - a) + log(y(x))\n    sage:\
    \ Sol = Sol.simplify_log(); Sol(x)\n    -_C*a - a*x + log(y(x)/(b*y(x) - a))\n\
    \    sage: solve(Sol, y)[0].simplify()\n    y(x) == a*e^(_C*a + a*x)/(b*e^(_C*a\
    \ + a*x) - 1)\n```\n\n# ### 10.1.3 Second-Order Equations\n\n**Linear Ordinary\
    \ Differential Equations with Constant Coefficients.** Let us solve now a second-order\
    \ linear ordinary differential equation with constant coefficients, for instance:\n\
    \n$$ y'' + 3y = x^2 - 7x + 31 $$\n\nHere we use the same syntax as for the first-order\
    \ equations, the second derivative of $y$ with respect to $x$ is obtained with\
    \ diff(y, x, 2).\n\n```\n    sage: x = var('x'); y = function('y')(x)\n    sage:\
    \ DE = diff(y,x,2)+3*y == x^2-7*x+31\n    sage: desolve(DE, y).expand()\n    1/3*x^2\
    \ + _K2*cos(sqrt(3)*x) + _K1*sin(sqrt(3)*x) - 7/3*x + 91/9\n```\n\nLet us add\
    \ initial conditions, for instance $y(0) = 1$ and $y'(0) = 2$:\n\n```\n    sage:\
    \ desolve(DE, y, ics=[0,1,2]).expand()\n    1/3*x^2 + 13/9*sqrt(3)*sin(sqrt(3)*x)\
    \ - 7/3*x - 82/9*cos(sqrt(3)*x) + 91/9\n```\n\nor $y(0) = 1$ and $y(-1) = 0$:\n\
    \n```\n    sage: desolve(DE, y, ics=[0,1,-1,0]).expand()\n```"
