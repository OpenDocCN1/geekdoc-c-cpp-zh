    # ### 13.3.4 Eigenvalues, Eigenvectors


    **The Power Method.** The power method is particularly well suited for huge sparse
    matrices; indeed, to implement the algorithm, it is enough to know how to perform
    matrix-vector and scalar products. As an example, let us come back to random walks
    on a sparse graph, and let us compute the stationary distribution using the power
    method:


