    **Invariant Factors and the Smith Normal Form.** When eliminating further the
    Hermite normal form, using unimodular right transformations (acting on columns)
    one can then reach a diagonal canonical form, named the Smith normal form. Its
    diagonal coefficients are the elementary divisors of the matrix. They are totally
    ordered under the divisibility relation: $s_i \mid s_{i+1}$.


