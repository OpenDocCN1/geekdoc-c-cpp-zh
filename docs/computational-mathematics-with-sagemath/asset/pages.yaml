    # ### 9.3.3 Gröbner Bases


    The limitations of multivariate division explain the difficulty mentioned in §9.2.3

    to obtain a normal form for the elements of the algebra K[x]/J: dividing by

    the generators of the ideal is not enough... At least in general! Indeed, some

    particular systems of generators exist for which the division is confluent, and

    computes a normal form. These systems are called *Gröbner bases*.


    **Staircases.** A pleasant way to grasp Gröbner bases goes through the notion

    of ideal staircase. Let us attach to each non-zero polynomial from K[x_1,...,x_n]

    a point of N^n given by its leading exponent, and let us draw the part E ⊂ N^n

    occupied by an ideal J (see Figures 9.5 to 9.7). The resulting graph (which depends

    on the monomial order) has a staircase shape: indeed, we have α + N^n ⊂ E for

    any α ∈ E. The elements of J ∖ {0} are in the grey zone, above the staircase or

    at its frontier. The points strictly "under the staircase" correspond exclusively
    to

    polynomials from K[x] ∖ J, but not all the polynomials from K[x] ∖ J are under

    the staircase.


    For example, in a polynomial of the ideal <x^3, xy^2 z, x^2>, each monomial,

    either a leading monomial or not, is multiple of one of the polynomials x^3, xy^2
    z'
