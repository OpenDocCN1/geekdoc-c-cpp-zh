  md: "**Triangular Decomposition.** Internally, *J.variety(L)* goes through a *triangular\
    \ decomposition* of the ideal *J*. This decomposition is interesting in itself,\
    \ since it sometimes gives a description of the *variety* *J* which is better\
    \ for the rest of the computation, or even easier to grasp than the output of\
    \ *variety* (see §8.2.1), particularly in case of numerous solutions.\n\nA polynomial\
    \ system is called *triangular* when of the following form\n\np1(x1) := x1^d1\
    \ + a1,d1−1 x1^(d1−1) + ⋯ + a1,0 = 0\np2(x1,x2) := x2^d2 + a2,d2−1(x1) x2^(d2−1)\
    \ + ⋯ + a2,0(x1) = 0\n⋮\npn(x1,...,xn) := xn^dn + an,dn−1(x1,...,xn−1) xn^(dn−1)\
    \ + ⋯ + 0 = 0\n\nor said otherwise, if each polynomial p_i only involves the variables\
    \ x_1,...,x_i, and is monic in the variable x_i. When a zero-dimensional system\
    \ has such a form, its resolution reduces to a finite number of univariate polynomial\
    \ equations to solve: it suffices to find the roots x_1 of p_1, to substitute\
    \ them into p_2, to then find the roots x_2 of the latter, and so on. This strategy\
    \ works both when looking for exact and approximate (numerical) solutions.\n\n\
    Not every system is equivalent to a triangular system. Consider for example the\
    \ ideal *J* defined by:\n\n```\n```sage\nsage: R.<x,y> = PolynomialRing(QQ, order='lex')\n\
    sage: C = ideal(x^2+y^2-1)\nsage: D = ideal((x+y-1)*(x+y+1))\nsage: J = C + D\n\
    ```\n```\n\nFor an image, see Figure 9.4 (left):\n\n```\n```sage\nsage: opts =\
    \ {'axes':True, 'gridlines':True, 'frame':False,\n....:    'aspect_ratio':1, 'axes_pad':0,\
    \ 'xmin':-1.3, 'xmax':1.3,\n....:    'ymin':-1.3, 'ymax':1.3, 'fontsize': 8}\n\
    sage: show(C.plot() + D.plot(), figsize=(2,2), **opts)\n```\n```\n\nThe variety\
    \ *V(J)* contains two points of abscissa 0 but only one point of abscissa −1,\
    \ and likewise, one point of ordinate −1 against two points of zero ordinate.\
    \ Hence the ideal *J* cannot be described by a triangular system.\n\nWe can however\
    \ show that any zero-dimensional ideal can be written as a finite intersection\
    \ of ideals generated by triangular systems. The *triangular decomposition* method\
    \ computes such a decomposition:\n\n```\n```sage\nsage: J.triangular_decomposition()\n\
    [Ideal (y, x^2 - 1) of Multivariate Polynomial Ring in x, y\nover Rational Field,\n\
    \ Ideal (y^2 - 1, x) of Multivariate Polynomial Ring in x, y\nover Rational Field]\n\
    ```\n```\n\nGeometrically, we obtain a representation of the variety *V(J)* as\
    \ a union of varieties associated to simpler systems, and often simple enough\
    \ to give a good description of the solutions."
