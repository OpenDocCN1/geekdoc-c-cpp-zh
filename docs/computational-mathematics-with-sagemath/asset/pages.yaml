  md: "and xz^2. The leading monomials are exactly the x^α y^β z^γ verifying one of\
    \ the inequalities (α, β, γ) ≥ (3, 0, 0), (α, β, γ) ≥ (1, 2, 1) or (α, β, γ) ≥\
    \ (1, 0, 2) component by component (Figure 9.5). A polynomial whose leading exponent\
    \ does not satisfy these conditions, for example x^2 + xz^2 if the monomial order\
    \ is the lexicographic one with x > y > z, cannot belong to that ideal. Some polynomials\
    \ like x^3 + x are not in the ideal either, despite a leading monomial above the\
    \ staircase. The situation is analogous for any ideal generated by monomials.\n\
    \nFor a random ideal, the staircase structure cannot be easily read on the generators.\
    \ For instance, by denoting δ_1,...,δ_s the leading exponents of the generators,\
    \ we have ⋃_{i=1}^s (δ_i + ℕ^n) ⊊ E in all examples of Figures 9.6 and 9.7 except\
    \ the second one. We can nevertheless show that E can always be written as a finite\
    \ union of sets of the form α + ℕ^n, i.e., intuitively, that the staircase has\
    \ a finite number of corners. This result is sometimes called Dickson's lemma.\n\
    \n# Gröbner Bases.\n\nA Gröbner basis is simply a family of generators that captures\
    \ the shape of the staircase, more precisely that contains a polynomial corresponding\
    \ to each corner.\n\n# Definition.\n\nA Gröbner basis of an ideal J ⊂ K[x] relative\
    \ to a monomial order < is a finite part G of J such that for any non-zero p ∈\
    \ J, there exists g ∈ G whose leading monomial lm g (for the order <) divides\
    \ lm p.\n\nChecking whether the generators defining an ideal form a Gröbner basis\
    \ is done in Sage with the **basis_is_groebner** method. We have already noticed\
    \ that any set of monomials is a Gröbner basis:\n\n```\n    sage: R.<x,y> = PolynomialRing(QQ,\
    \ order='lex')\n    sage: R.ideal(x*y^4, x^2*y^3, x^4*y, x^5).basis.is_groebner()\n\
    \    True\n```\n\nHowever, the system {x^2 + y^2 - 1, 16x^2y^2 - 1} which encodes\
    \ the intersection of the circle and the hyperbolas of Figure 9.1a is not a Gröbner\
    \ basis:\n\n```\n    sage: R.ideal(x^2+y^2-1, 16*x^2*y^2-1).basis.is_groebner()\n\
    \    False\n```\n\nAccording to the staircase shape (Figure 9.6), it lacks a polynomial\
    \ from J_1 of leading monomial y^4.\n\nThe reasoning based on Dickson's lemma,\
    \ mentioned above, shows that every ideal has Gröbner bases. Let us compute Gröbner\
