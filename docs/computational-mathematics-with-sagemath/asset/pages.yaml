  md: '# ### Change of order


    The most interesting Gröbner bases are not the easiest to compute: often, the
    `degrevlex` order is the cheapest, but more useful information can be read on
    a lexicographic Gröbner basis. Besides, we sometimes need Gröbner bases of the
    same ideal for different monomial orders.


    This motivates the introduction, in addition to general algorithms computing Gröbner
    bases, of algorithms of “change of order.” These algorithms compute a Gröbner
    basis for a given monomial order from a Gröbner basis of the same ideal for a
    different order. They are often more efficient than algorithms computing directly
    a basis for the target order. Thus, a strategy which often wins to compute a lexicographic
    Gröbner basis is the following: first compute a basis for the `degrevlex` order,
    then apply an algorithm of change of order. Sage does it automatically in some
    cases.


    The `transformed_basis` method allows us to compute “by hand” Gröbner bases by
    change of order, when the ideal is zero-dimensional, or when the target order
    is `lex`. If needed, it first computes a Gröbner basis for the monomial order
    attached to the polynomial ring.


    the expert user to manually choose a Gröbner basis algorithm according to the
    characteristics of the problem to solve.


    Let us consider the ideals C_n(K) ⊂ K[x_0, …, x_{n−1}] defined by:


    C₂(K) = ⟨x₀ + x₁, x₀x₁ − 1⟩

    C₃(K) = ⟨x₀ + x₁ + x₂, x₀x₁ + x₀x₂ + x₁x₂, x₀x₁x₂ − 1⟩

    ⋮

    C_n(K) = ⟨∑_{i∈ℤ/nℤ} ∏_{j=0}^{k} x_{i+j}⟩_{k=0}^{n−2} + ⟨x₀⋯x_{n−1} − 1⟩,    (9.11)


    and accessible in Sage by commands like:


    ```

    sage: from sage.rings.ideal import Cyclic

    sage: Cyclic(QQ[''x,y,z''])

    Ideal (x + y + z, x*y + x*z + y*z, x*y*z - 1) of

    Multivariate Polynomial Ring in x, y, z over Rational Field

    ```


    They are classical test problems to evaluate the efficiency of tools for solving
    polynomial systems. On a computer where Sage computes the reduced Gröbner basis
    of C₆(ℚ) in less than a second:


    ```

    sage: def C(R, n): return Cyclic(PolynomialRing(R, ''x'', n))


    sage: %time len(C(QQ, 6).groebner_basis())

    CPU times: user 136 ms, sys: 0 ns, total: 136 ms

    Wall time: 147 ms

    45

    ```'
