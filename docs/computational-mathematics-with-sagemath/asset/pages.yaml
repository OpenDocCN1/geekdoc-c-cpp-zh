  md: 'An *ordinary differential equation* (ODE) is an equation involving an (unknown)
    function of a single variable, as well as one or more derivatives, successive
    or not, of the function.


    In the equation $y''(x)+x·y(x)=sin(x)$ the unknown function $y$ is called the
    *dependent variable* and the variable $x$ (relative to which $y$ varies) is called
    the *independent variable*.


    A *partial differential equation* (referred to as PDE) involves several independent
    variables as well as the partial derivatives of the dependent variable with respect
    to these independent variables.


    Unless otherwise stated, we shall consider in this chapter functions of a real
    variable.


    # ## 10.1.2 First-Order Ordinary Differential Equations


    **Basic Commands.** We would like to solve a first-order ODE:


    $$F(x,y(x),y''(x))=0.$$


    We start by defining a variable $x$ and a function $y$ depending on this variable:


    ```

    ```

    sage: x = var(''x'')

    sage: y = function(''y'')(x)

    ```

    ```


    Then:


    ```

    ```

    sage: desolve(equation, variable, ics = ..., ivar = ...,

    ....:         show_method = ..., contrib_ode = ...)

    ```

    ```


    where:


    +   - `equation` is the differential equation. Equality is designated by `==`,
    for instance, the equation $y'' = 2y + x$ is written `diff(y,x) == 2*y+x`;

    +   - `variable` is the dependent variable, i.e., $y$ in $y'' = 2y + x$;

    +   - `ics` is optional and stands for initial conditions. For a first-order equation,
    write $[x_0,y_0]$ and for a second-order equation write $[x_0,y_0,x_1,y_1]$ or
    $[x_0,y_0,y_0'']$;

    +   - `ivar` is optional and stands for the independent variable, i.e., $x$ in
    $y'' = 2y+x$. It must be specified if there is more than one independent variable
    or parameters as in $y'' = ay + bx + c$;

    +   - `show_method` is an optional boolean set to false. If true, then Sage returns
    a pair $[solution, method]^4$, where method is the string describing the method
    which has been used to get a solution. The method can be one of the following:
    `linear`, `separable`, `exact`, `homogeneous`, `bernoulli`, `generalized homogeneous`.

    +   - `contrib_ode` is an optional boolean set to false. If true, `desolve` allows
    to solve Clairaut, Lagrange, Riccati and some other equations. This may take a
    long time and is thus turned off by default.'
