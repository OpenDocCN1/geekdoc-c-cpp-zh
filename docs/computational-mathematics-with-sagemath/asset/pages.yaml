    # ### 11.4.3 Some Examples of Applications


    **Finding Roots by Bisection.** Let f : I → ℝ be a continuous elementary function.
    We want to find all the zeros of f in I. More precisely, we want to find (tiny)
    intervals such that their union contains all the zeros of f in I (and with only
    one root by interval). Recall that for an interval x ⊂ I, we have R(f,x) ⊂ F(x).
    Conversely, y ∉ F(x) ⇒ y ∉ R(f,x). Then we get a simple algorithm: we recursively
    cut I into sub-intervals until a threshold size is attained; for any sub-interval
    s, if 0 ∉ F(s), we can throw away s as we know that it cannot contain any root.
    Moreover, when the bisection is finished, if we know the derivative of f and if
    it is continuous, we can check that f is monotonic on all the computed intervals,
    and so obtain a proof of the existence of only one root by interval.


    Example: find all the roots of sin(1/x) in the interval [1/64, 1/32], with a precision
    of 100 bits (here, we compute with intervals):


    ```

    ```sage

    sage: def bisect(funct,x,tol,zeros):

    ....:     if 0 in funct(x):

    ....:         if x.diameter()>tol:

    ....:             x1,x2 = x.bisection()

    ....:             bisect(funct,x1,tol,zeros)

    ....:             bisect(funct,x2,tol,zeros)

    ....:         else:

    ....:             zeros.append(x)

    sage: sage.rings.real_mpfi.printing_style = ''question''

    sage: fs = lambda x: sin(1/x)

