    easier:


    ```

    ```python

    sage: def fib2 (n):

    .....:     if 0 <= n <= 1: return n       # for n = 0 or n = 1

    .....:     else: return fib2(n-1) + fib2(n-2)

    ```

    ```


    The result of this function is the value returned by the conditional statement:
    either 0 or 1 respectively for \(n = 0\) and \(n = 1\), otherwise the sum `fib2(n-1)+fib2(n-2)`;
    each branch of the test consists of a return instruction.


    This method is however less efficient since several computations are duplicated.
    For example `fib2(5)` evaluates `fib2(3)` and `fib2(4)`, which are in turn evaluated
    in the same manner. Therefore, Sage computes twice `fib2(3)` and three times `fib2(2)`.
    This recursive process ends by the evaluation of either `fib2(0)` or `fib2(1)`,
    of value 0 or 1, and the evaluation of `fib2(n)` eventually consists in computing
    \(u_n\) by adding \(u_n\) ones, and \(u_{n-1}\) zeroes. The total number of additions
    performed to compute \(u_n\) is thus \(u_{n+1}-1\). This number grows very quickly,
    and no computer is able to compute \(u_{100}\) this way.


    Other methods are also possible, for example remembering the intermediate terms
    using the decorator `@cached_function`, or using properties of matrix powers:
    the following paragraph shows how to compute the millionth term of this sequence.
    For example, compare the efficiency of the function `fib2` defined above with
    the following one, for example on \(n = 30\):


    ```

    ```python

    sage: @cached_function

    sage: def fib2a (n):

    .....:     if 0 <= n <= 1: return n

    .....:     else: return fib2a(n-1) + fib2a(n-2)

    ```

    ```


    # 3.2.4 Example: Fast Exponentiation


    The naive method for computing \(a^n\) for \(n \in \mathbb{N}\) performs \(n\)
    multiplications by \(a\) using a for loop:


    ```

    ```python

    sage: a = 2; n = 6; res = 1       # 1 is the product neutral element

    sage: for k in [1..n]: res = res*a

    sage: res                          # the value of res is 2^6

    64

    ```

    ```'
