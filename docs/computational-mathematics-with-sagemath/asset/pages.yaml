    The sums or products admitting recurrence formulas are computed the same way:


    $$S_n = Σ_{k=0}^n (2k)(2k+1) = 2·3 + 4·5 + ⋯ + (2n)(2n+1),$$

    $$S_0 = 0,    S_n = S_{n-1} + (2n)(2n+1)   for n ∈ ℕ − {0}.$$


    The following programming method follows that of recurrent sequences: starting
    from 0, we add successive terms for $k = 1$, $k = 2$, ..., until $k = n$:


    ```

    ~~~

    sage: S = 0 ; n = 10

    sage: for k in [1..n]:

    ....:     S = S + (2*k) * (2*k+1)

    sage: S

    1650

    ~~~

    ```


    This example highlights a general method to compute a sum; however, in this simple
    case, a symbolic computation yields the general answer:


    ```

    ~~~

    sage: n, k = var(''n, k'') ; res = sum(2*k*(2*k+1), k, 1, n)

    sage: res, factor(res)        # result expanded, factorised

