    **Global View on Polynomial Operations.** The elements of a polynomial ring are
    represented by Python objects from the class `Polynomial`, or from derived classes.
    The main operations available for these objects are summarised in Tables 7.2 to
    7.5. For example, we query the degree of a polynomial with the `degree` method.
    Similarly, `p.subs(a)` or simply `p(a)` yields the value of \(p\) at the point
    \(a\), but also computes the composition \(p \circ a\) when \(a\) itself is a
    polynomial, and more generally evaluates a polynomial of \(A[x]\) at an element
    of an \(A\)-algebra:


    ```

    sage: p = R.random_element(degree=4) # a random polynomial

    sage: p

    -4*x^4 - 52*x^3 - 1/6*x^2 - 4/23*x + 1

    sage: p.subs(x^2)

    -4*x^8 - 52*x^6 - 1/6*x^4 - 4/23*x^2 + 1

    sage: p.subs(matrix([[1,2], [3,4]]))

    [-375407/138  -273931/69]

    [ -273931/46  -598600/69]

    ```


    We will come back to the content of the last two tables in Sections 7.2.1 and
    7.3.


    ²There are many other operations. Those tables omit functions which are too advanced,
    some specialised variants of methods we mention, and numerous methods common to
    all ring elements, and even to all Sage objects, which have no particular interest
    on polynomials. Note however that some specialised methods (for example `p.rescale(a)`,
    equivalent to `p(a*x)`) are often more efficient than more general methods that
