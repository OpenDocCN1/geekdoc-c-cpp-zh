    Most variants of the Gaussian elimination algorithm yield a matrix decomposition
    of great interest for computations: decompositions of the form $A = LU$ for generic
    matrices, $A = LSP, LQUP, PLUQ$ for matrices with arbitrary rank. In these decompositions,
    the $L$ matrices are lower triangular (with zeros above the main diagonal), with
    a diagonal of ones, the $U$ matrices are upper triangular (with zeros below the
    main diagonal) with a diagonal of invertible elements, and $P$ and $Q$ are permutation
    matrices. Although these decompositions are less expensive to compute than the
    reduced echelon form (nearly $\frac{2}{3}n^3$ against $2n^3$ for an $n \times
    n$ full rank matrix), they do not produce a normal form.


    # Echelon Form over a Euclidean Ring.


    Over a Euclidean ring, non-zero coefficients are not necessarily invertible while
    only the invertible ones can be chosen as pivots in the course of Gaussian elimination.
    Hence some non-zero columns may not contain any pivot, and elimination would no
    longer be possible. It is however still possible to define a unimodular transformation
    (whose determinant is invertible) eliminating the leading coefficient in a row
    with that of another row, thanks to the extended Euclidean algorithm. Let $A =
    \begin{bmatrix} a & * \\ b & * \end{bmatrix}$ and $g = \gcd(a,b)$. Let $u$ and
    $v$ be the Bézout coefficients computed with the extended Euclidean algorithm
    applied to $a$ and $b$ (such that $g = ua + vb$), and let $s = -b/g, t = a/g$
    such that


    $$\begin{bmatrix} u & v \\ s & t \end{bmatrix} \begin{bmatrix} a & * \\ b & *
    \end{bmatrix} = \begin{bmatrix} g & * \\ 0 & * \end{bmatrix}.$$


    This transformation is unimodular since $\det \begin{pmatrix} u & v \\ s & t \end{pmatrix}=1$.


    Moreover, as in the Gauss-Jordan elimination, it is also always possible to add
    multiples of the pivot row to the rows above it in order to reduce the coefficients
    in the pivot column modulo the pivot $g$. When iterated over all columns of the
    matrix, this operation produces the Hermite normal form.


    **Definition.** A matrix is in Hermite normal form if:


    +   - its zero rows are at the bottom,

    +   - the leading coefficient of each non-zero row, called the pivot, is to the
    right of the pivot of the preceding row,'
