  md: "**Rate of Convergence.** Consider a convergent sequence of numbers $u$ and\
    \ let $\\ell$ be its limit. We say that the rate of convergence of the sequence\
    \ $u$ is *linear* if there exists $K \\in (0,1)$ such that\n\n$$\\lim_{n\\to\\\
    infty} \\frac{|u_{n+1}-\\ell|}{|u_n-\\ell|}=K.$$\n\nThe rate of convergence of\
    \ the sequence $u$ is said to be *quadratic* if there exists $K>0$ such that\n\
    \n$$\\lim_{n\\to\\infty}\\frac{|u_{n+1}-\\ell|}{|u_n-\\ell|^2}=K.$$\n\nRecall\
    \ that Newton's method constructs a recursive sequence $u$ defined by $u_{n+1}=\\\
    varphi(u_n)$, where $\\varphi$ is the function $x\\mapsto x-f(x)/f'(x)$. If $f$\
    \ is twice differentiable, Taylor's formula for $\\varphi$ with $x$ in a neighbourhood\
    \ of the root $\\alpha$ is\n\n$$\\varphi(x)=\\varphi(\\alpha)+(x-\\alpha)\\varphi'(\\\
    alpha)+\\frac{(x-\\alpha)^2}{2}\\varphi''(\\alpha)+O_\\alpha((x-\\alpha)^3).$$\n\
    \nBut $\\varphi(\\alpha)=\\alpha$, $\\varphi'(\\alpha)=0$ and $\\varphi''(\\alpha)=f''(\\\
    alpha)/f'(\\alpha)$. By substituting in the previous formula and using the definition\
    \ of the sequence $u$, we get\n\n$$u_{n+1}-\\alpha=\\frac{(u_n-\\alpha)^2}{2}\\\
    frac{f''(\\alpha)}{f'(\\alpha)}+O_\\alpha((u_n-\\alpha)^3).$$\n\nTherefore, when\
    \ Newton's method converges, the convergence rate of the sequence is quadratic.\n\
    \n**Acceleration of Convergence.** Given a convergent sequence whose rate of convergence\
    \ is linear, it is possible to construct a sequence whose rate of convergence\
    \ is quadratic. The same technique, applied to Newton's method, is known as Steffensen's\
    \ method.\n\n```\n    sage: def steffensen(sequence):\n    ....:     assert isinstance(sequence,\
    \ GeneratorType)\n    ....:     values = deque(maxlen=3)\n    ....:     for i\
    \ in range(3):\n    ....:         values.append(sequence.next())\n    ....:  \
    \       yield values[1]\n    ....:     while True:\n    ....:         values.append(sequence.next())\n\
    \    ....:         u, v, w = values\n    ....:         yield u - (v - u)^2 / (w\
