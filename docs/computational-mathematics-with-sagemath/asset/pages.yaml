    \ wrong by at most ±1. The “brackets” style prints outward approximations of the\
    \ minimum and maximum of the interval (bounds are stored in binary: what is printed\
    \ are decimal values of the bounds rounded in the direction of −∞ and +∞ respectively).\n\
    \nWith the following instruction we fix the printing style to “brackets” (replace\
