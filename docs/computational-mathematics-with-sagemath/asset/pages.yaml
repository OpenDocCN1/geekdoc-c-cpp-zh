    # ## 13.3 Sparse Matrices


    Sparse matrices arise quite often in scientific computing: the sparsity is indeed
    a wanted property which enables us to solve problems of large size, out of reach
    with dense matrices.


    *An approximate definition: we will say that a sequence $M_n$ of matrices, with
    $M_n$ of size $n$, is a family of sparse matrices if the number of non-zero coefficients
    of $M_n$ is $O(n)$.*


    Clearly, those matrices are encoded in the computer using data structures where
    only the non-zero elements are stored. By taking into account the sparsity of
    the matrices, we want of course to save memory to be able to represent large matrices,
    but also heavily reduce the computation cost.


    # ### 13.3.1 Where do Sparse Systems Come From?


    **Boundary Problems.** The most common source of sparse linear systems is the
    discretisation of partial derivative equations. Let us consider for example the
    Poisson equation (stationary heat equation):


    $$-\Delta u = f$$


    where $u = u(x,y)$, $f = f(x,y)$,


    $$\Delta u := \frac{\partial^2 u}{\partial x^2} + \frac{\partial^2 u}{\partial
    y^2}.$$


    The equation is considered in the square $[0,1]^2$, with boundary conditions $u
    = 0$ on the square border. The one-dimensional analogue is the problem


    $$-\frac{\partial^2 u}{\partial x^2} = f, \qquad (13.1)$$


    with $u(0)=u(1)=0$.


    To approximate the solution of this equation, one of the simplest methods consists
    in using the finite difference method: we divide the range $[0,1]$ into a finite
    number $N$ of intervals of constant width $h$. We denote by $u_i$ the approximation
    of $u$ at the point $x_i = ih$. We approximate the derivative of $u$ by $(u_{i+1}
    - u_i)/h$, and its second derivative by


    $$\frac{(u_{i+1} - u_i)/h - (u_i - u_{i-1})/h}{h} = \frac{u_{i+1} - 2u_i + u_{i-1}}{h^2}.$$'
