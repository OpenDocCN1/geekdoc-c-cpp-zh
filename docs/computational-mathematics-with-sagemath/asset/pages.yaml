    \ staircase translates this rule. Similarly, the Gröbner basis for the invlex\
    \ order indicates that we can eliminate powers of y via the equality y^2 = -xy\
    \ - x - 1. We will come back to this at the end of next section.\n\n# ### 9.3.4\
    \ Gröbner Basis Properties\n\nGröbner bases are used to implement the operations\
    \ studied in Section 9.2. We use them in particular to compute normal forms for\
