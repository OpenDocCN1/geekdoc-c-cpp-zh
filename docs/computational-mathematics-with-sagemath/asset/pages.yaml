    # ### 9.3.1 Monomial Orders


    A monomial order or admissible order is a total order on the monomials x^α of
    a polynomial ring, which satisfies


    x^α ≺ x^β ⟹ x^{α+γ} ≺ x^{β+γ}      and      γ ≠ 0 ⟹ 1 ≺ x^γ      (9.9)


    for all exponents α, β, γ. Equivalently, we can consider ≺ as an order on the
    exponents α ∈ ℕ^n or on the terms c x^α. The leading monomial, leading coefficient
    and leading term of a polynomial p (see §1.1.3) for the current monomial order
    are those of largest exponent; we denote them respectively by lm p, lc p and lt
    p.


    The first condition in (9.9) states that the monomial order should be compatible
    with products: multiplying by a fixed monomial does not change the order. The
    second condition implies that ≺ is a well-order, i.e., an infinite sequence of
    decreasing monomials does not exist. Let us notice that the only monomial order
    on K[x] is the usual one x^n > x^{n−1} > ⋯ > 1.


    We have seen in §9.1.1 that Sage allows an order to be chosen when defining a
    polynomial ring via constructions like


    ```

    ```

    sage: R.<x,y,z,t> = PolynomialRing(QQ, order=''lex'')

    ```

    ```


    Table 9.5 lists the main predefined monomial orders; lex is the lexicographic
    order of the exponents, invlex is the lexicographic order of exponents read^a


    ^a Sage also allows orders called “local”) where 1 is the largest monomial instead
    of the smallest one. For example, in the order neglex on Q[x,y,z], we have 1 >
    z > z^2 > z^3 > y > ⋯'
