    **The Secant Method.**  The computation of the derivative in Newton''s method
    can be expensive. It is possible to replace it by a linear interpolation: given
    two approximations to the solution, hence two points on the graph of $f$, if the
    line through these two points intersects the $x$-axis, we take the $x$-coordinate
    of the intersection point as the new approximation. To start the construction,
    or when this line is parallel to the $x$-axis, we use Newton''s method.


    This gives rise to the same iterative formula as the false position method, but
    applied at different points. Contrary to the false position method, the secant
    method does not provide an interval that contains a solution.


    We define a Python generator that implements this method.


    ```

    ```python

    sage: def secantgen(f, a):

    ....:     yield a

    ....:     estimate = f.derivative()(a)

    ```

    ```'
