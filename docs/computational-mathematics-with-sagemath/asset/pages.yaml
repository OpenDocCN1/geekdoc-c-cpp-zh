    TABLE 9.4 – Solving polynomial systems.


    For example, we can eliminate \(x\) from the linear system


    $$

    \begin{cases}

    2x + y - 2z = 0\\

    2x + 2y + z = 1

    \end{cases}

    \qquad (9.4)

    $$


    by subtracting the first equation from the second one. It yields \(y + 3z = 1\),
    which shows that any solution triple \((x,y,z)\) of (9.4) is of the form \((x,1-3z,z)\).
    We can then check that every “partial solution” \((1-3z,z)\) lifts to a (unique)
    solution \(\left(\frac{5z-1}{2},1-3z,z\right)\) of (9.4). This illustrates that
    Gauss’ pivoting algorithm solves linear systems by elimination, as opposed to,
    for example, Cramer’s formulas.


    **Elimination Ideals.** In the context of polynomial systems, the “consequences”
    of equations \(p_1(x)=\cdots=p_s(x)=0\) are elements of the ideal \(\langle p_1,\ldots,p_s\rangle\).
    If \(J\) is an ideal of \(K[x_1,\ldots,x_n]\), we call the \(k\)-th *elimination
    ideal* of \(J\) the set


    $$

    J_k = J \cap K[x_{k+1},\ldots,x_n] \tag{9.5}

    $$


    of elements of \(J\) which only contain the \(n-k\) last variables. This is an
    ideal of \(K[x_{k+1},\ldots,x_n]\).


    In Sage, the method `elimination_ideal` takes as input the list of variables to
    eliminate. Beware: it does not return \(J_k \subset K[x_{k+1},\ldots,x_n]\), but
    the ideal \(\langle J_k\rangle\) of \(K[x_1,\ldots,x_n]\) it generates. In the
    case of the linear system (9.4), we find


    ```

    ```

    sage: R.<x,y,z> = QQ[]

    sage: J = ideal(2*x*y+2*z, 2*x+2*y+z-1)

    sage: J.elimination_ideal(x)

    Ideal (y + 3z - 1) of Multivariate Polynomial Ring in x, y, z

    over Rational Field

    sage: J.elimination_ideal(x,y)

    Ideal (0) of Multivariate Polynomial Ring in x, y, z over Rational Field

    ```

    ```


    Mathematically, we interpret these results as follows: We have \(J \cap \mathbb{Q}[y,z]
    = \langle y+3z-1\rangle \subseteq \mathbb{Q}[y,z]\) and \(J \cap \mathbb{Q}[z]
