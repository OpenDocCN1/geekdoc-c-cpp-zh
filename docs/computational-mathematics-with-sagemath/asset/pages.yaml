    # 17.4.2　Matching


    Finding a matching in a graph, amounts at detecting a set of edges which are pairwise
    disjoint. The empty set being a trivial matching, we focus our attention on maximum
    matchings: we seek to maximise the number of edges in a matching. Computing the
    maximum matching is a polynomial problem, which follows from a result of Jack
    Edmonds [Edm65]. Edmonds’ algorithm is based on local improvements and the proof
    that the algorithm does not halt until a maximum matching is found. This algorithm
    is not the hardest to implement among those graph theory can offer, though this
    problem can be modeled with a very simple MILP.


    For this task we will need, as in the previous problem, to associate a binary
    value to each of our objects — the edges of a graph — indicating if the edge belongs
    to our matching or not.


    It is then needed to ensure that two adjacent edges cannot be simultaneously in
    the matching. Indeed, this looks like a linear constraint: if x and y are two
    edges of the same graph, and if mₓ and mᵧ are their associated variables, it suffices
    to require that the inequality mₓ + mᵧ ≤ 1 is satisfied. Since these two edges
    will not be found simultaneously in our solution, we are able to write down a
    linear program which computes the maximum matching. Let us remark that if two
    edges cannot be in the matching simultaneously, it is because they both have a
    common vertex v of the graph. It is then simpler to say that at most one edge
    incident to each vertex v should be taken in the matching, which is again a linear
    constraint.'
