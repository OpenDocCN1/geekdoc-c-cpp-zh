    100000000000000000038

    ```


    An important operation on $\mathbb{Z}/n\mathbb{Z}$ is modular exponentiation,
    which means to calculate $a^e \bmod n$. The RSA crypto-system relies on this operation.
    To calculate $a^e \bmod n$, the most efficient algorithms require of the order
    of log $e$ multiplications or squarings modulo $n$. It is crucial to reduce all
    calculations modulo $n$ systematically, and not compute $a^e$ first as an integer,
    as the following example shows:


    ```

    sage: n = 3^100000; a = n-1; e = 100

    sage: %timeit (a^e) % n

    5 loops, best of 3: 387 ms per loop

    sage: %timeit power_mod(a,e,n)

    125 loops, best of 3: 3.46 ms per loop

    ```


    # 6.1.2 Finite Fields


    Finite fields² are defined using the constructor `FiniteField`, or more simply
    `GF`. As well as constructing prime fields $\mathrm{GF}(p)$ with $p$ prime, one
    can construct non-prime finite fields $\mathrm{GF}(q)$ with $q = p^k$, where $p$
    is prime and $k > 1$ an integer. As with rings, objects created in such a field
    have a canonical representation, and reduction is carried out at each arithmetic
    operation. Finite fields have the same properties as rings (§6.1.1), with in addition
    the possibility of inverting each non-zero element:


    ```

    sage: R = GF(17); [1/R(x) for x in range(1,17)]

    [1, 9, 6, 13, 7, 3, 5, 15, 2, 12, 14, 10, 4, 11, 8, 16]

    ```


    A non-prime finite field $\mathbb{F}_{p^k}$ with $p$ prime and $k > 1$ is isomorphic
    to the quotient ring of polynomials in $\mathbb{F}_p[x]$ modulo a monic irreducible
    polynomial $f$ of degree $k$. In this case, Sage will provide a name for the generator
    of the field, that is, the variable $x$, or the user can provide a name:


    ²The finite field with $q$ elements is either denoted $\mathbb{F}_q$, or $\mathrm{GF}(q)$
    (where “GF” stands for “Galois Field”). Here we will use the notation $\mathbb{F}_q$
    for the mathematical object, and the notation $\mathrm{GF}(q)$ in Sage code.'
