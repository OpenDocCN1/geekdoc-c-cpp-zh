  md: '# 16


    # Graph Theory


    This chapter presents the study of graph theory with Sage, starting with a description
    of the Graph class (§16.1) and its methods (§16.2), then how to use them to solve
    practical problems (§16.4) or verify theoretical results through experimentation
    (§16.3).


    # 16.1 Constructing Graphs


    # 16.1.1 Starting from Scratch


    We define a graph as a pair \((V, E)\), where \(V\) represents a set of vertices
    and \(E\) a set of edges, or unordered pairs of vertices. The graph shown in Figure
    16.1 is defined by the set of vertices \(\{0, 1, 2, 5, 9, \text{’Madrid’}, \text{’Edinburgh’}\}\)
    and has edges \((1, 2), (1, 5), (1, 9), (2, 5), (2, 9)\) as well as \((\text{’Madrid’},
    \text{’Edinburgh’})\).


    It should come as no surprise that graphs in Sage are represented by the class
    Graph:


    ```

    sage: g = Graph()

    ```


    By default, \(g\) is an empty graph. The next example demonstrates how to add
    vertices and edges: whenever an edge is created, the corresponding vertices —
    if they are not already present in the graph — are silently added. We can observe
    this process with methods whose purpose is easy to guess:


    ```

    sage: g.order(), g.size()

    (0, 0)

    sage: g.add_vertex(0)

    sage: g.order(), g.size()

    (1, 0)

    ```'
