    The derivative function (with alias `diff`) computes the derivative of a symbolic
    expression or function.


    ```

    ```

    sage: diff(sin(x^2), x)

    2*x*cos(x^2)

    sage: function(''f'')(x); function(''g'')(x); diff(f(g(x)), x)

    f(x)

    g(x)

    D[0](f)(g(x))*diff(g(x), x)

    sage: diff(ln(f(x)), x)

    diff(f(x), x)/f(x)

    ```

    ```


    # ### 2.3.7 Partial Derivatives (*)


    The derivative (or `diff`) command also computes iterated or partial derivatives.


    ```

    ```

    sage: f(x,y) = x*y + sin(x^2) + e^(-x); derivative(f, x)

    (x, y) |--> 2*x*cos(x^2) + y - e^(-x)

    sage: derivative(f, y)

    (x, y) |--> x

    ```

    ```


    EXAMPLE. Let us check that the following function is harmonic$^3$:


    $$f(x,y)=\frac{1}{2}\ln(x^2+y^2)\quad\text{for all }(x,y)\neq(0,0).$$


    ```

    ```

    sage: x, y = var(''x, y''); f = ln(x**2+y**2) / 2

    sage: delta = diff(f,x,2) + diff(f,y,2)

    sage: delta.simplify_rational()

    0

    ```

    ```


    **Exercise 6** (A counter-example due to Peano to Schwarz'' theorem). Let $f$
    be the function from $\mathbb{R}^2$ to $\mathbb{R}$ defined by:


    $$f(x,y)=\begin{cases} xy\frac{x^2-y^2}{x^2+y^2} & \text{if } (x,y)\neq(0,0),\\
    0 & \text{if } (x,y)=(0,0). \end{cases}$$


    Does $\partial_1\partial_2 f(0,0)=\partial_2\partial_1 f(0,0)$ hold?


