    \ 1], [3, 2], [2, 3], [1, 4]]\n```\n\nThe point of the model of `IntegerListsLex`\
    \ is in the good compromise between generality and efficiency in the iteration.\
    \ The main algorithm permits iteration through the elements of such a set `S`\
    \ in reverse lexicographic order, and in Constant Amortised Time (CAT), except\
    \ in very degenerate cases; roughly speaking, the time needed to iterate through\
    \ all elements is proportional to the number of elements, which is optimal. In\
    \ addition, the memory usage is proportional to the largest element found, which\
    \ is to say negligible in practice.\n\nThis algorithm is based on a very general\
    \ principle for traversing a decision tree, called *branch and bound*: at the\
    \ top level, we run through all possible choices for ℓ₀; for each of these choices,\
    \ we run through all possible choices for ℓ₁, and so on. Mathematically speaking,\
    \ we have put the structure of a prefix tree on the elements of `S`: a node of\
    \ the tree at depth `k` corresponds to a prefix ℓ₀, …, ℓₖ of one (or more) elements\
    \ of `S` (see Figure 15.4)."
