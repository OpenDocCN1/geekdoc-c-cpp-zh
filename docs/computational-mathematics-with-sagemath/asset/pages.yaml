    # ### 12.2.2 Iterative Approximation Methods


    In this section we illustrate various ways of approximating the solutions of a
    non-linear equation $f(x) = 0$. There are essentially two approaches to such approximations.
    The most efficient algorithm mixes the two approaches.


    The first approach constructs a sequence of nested intervals that contain a solution
    of the equation. We control the precision and convergence is guaranteed, but the
    convergence speed is not always good.


    The second approach starts with a given approximate value of one of the solutions
    of the equation. If the local behaviour of the function $f$ is sufficiently regular,
    we can compute a new, more accurate approximation to the solution. By recurrence,
    we get a sequence of approximate values. This approach assumes that we know a
    first approximation of the desired number. Moreover, its performance depends on
    a good local behaviour of the function $f$: we cannot dictate *a priori* the precision
    of the answer; worse, the convergence of the sequence of approximations is not
    necessarily guaranteed.'
