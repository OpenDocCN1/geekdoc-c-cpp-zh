    The edges of a graph are actually represented in Sage as triples, of which the
    last entry is a label. Most of the time it is filled with a numeric value — interpreted
    for example as capacities in flow or connectivity algorithms, or as weights in
    matching problems — though it may contain any immutable object. By default, the
    label is None.


