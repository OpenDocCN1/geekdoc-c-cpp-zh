  md: 'Throughout this section, we consider a non-linear equation $f(x)=0$ where $f$
    is a numerical function defined on the interval $[a,b]$ and continuous on this
    interval. We assume that the values of $f$ at the endpoints of the interval $[a,b]$
    are non-zero and of opposite signs: in other words, the product $f(a)f(b)$ is
    strictly negative. The continuity of $f$ guarantees the existence of at least
    one solution of the equation $f(x)=0$ in the interval $[a,b]$.


    For each of the methods we discuss, we experiment with the following function.


    ```

    sage: f(x) = 4 * sin(x) - exp(x) / 2 + 1

    sage: a, b = RR(-pi), RR(pi)

    sage: bool(f(a) * f(b) < 0)

    True

    ```


    We should note that, for this function, the command `solve` is not useful.


    ```

    sage: solve(f(x) == 0, x)

    [sin(x) == 1/8*e^x - 1/4]

    ```


    ```

    sage: f.roots()

    Traceback (most recent call last):

    ...

    RuntimeError: no explicit roots found

    ```


    The algorithms for solving non-linear equations can be very time-consuming: it
    is advisable to take certain precautions before proceeding. In particular, we
    should ensure that solutions exist by studying the continuity and differentiability
    of the function in question, as well as its sign changes; plotting the graph of
    the function can be useful here (see Chapter 4).


    **The Bisection Method.** This method is based on the first approach: construct
    a sequence of nested intervals, each of which containing a solution of the equation
    $f(x)=0$.


    We find the midpoint $c$ of the interval $[a,b]$. Suppose that $f(c) \ne 0$ (otherwise
    we have found a solution). Either $f(a)f(c)$ is negative, so that the interval
    $[a,c]$ must contain a solution of the equation; or $f(c)f(b)$ is negative, so
    that the interval $[c,b]$ contains a solution of the equation. Therefore, we can
    construct an interval containing a solution, and whose length is half the length
    of the interval $[a,b]$. By iterating this construction, we obtain a sequence
    of intervals with the expected properties. To implement this approach, we define
    a Python function `intervalgen` as follows.


    ```

    sage: def phi(s, t): return (s + t) / 2

    sage: def intervalgen(f, phi, s, t):

    ....:     msg = ''{0} wrong arguments: f({0})*f({1})>=0''.format(s, t)

    ....:     assert (f(s) * f(t) < 0), msg

    ....:     yield s

    ....:     yield t

    ....:     while True:

    ....:         u = phi(s, t)

    ```'
