  md: '# # 3 Programming and Data Structures


    The two preceding chapters introduced mathematical computations using one-line
    commands, but Sage also allows programs with sequences of instructions.


    The Sage computer algebra system is in fact an extension of the Python¹ computer
    language, and allows, with a few exceptions, to use the Python programming constructs.


    The commands described in the previous chapters show that it is not necessary
    to know the Python language to use Sage; this chapter explains how to use the
    Python programming structures within Sage. Since we only present basic programming,
    this chapter can be skipped by the reader fluent in Python; the examples are chosen
    among the most classical ones encountered in mathematics, so that the reader can
    quickly grasp the Python programming constructs, by analogy with known programming
    languages.


    This chapter presents in particular the paradigm of *structured programming* with
    loops and tests, then describes functions dealing with lists and other data structures.


    # ## 3.1 Syntax


    # ### 3.1.1 General Syntax


    The instructions are generally processed line by line. Python considers the sharp
    symbol “#” as the beginning of a comment, until the end of the line, The semi-colon
    “;” separates several instructions written on the same line:'
