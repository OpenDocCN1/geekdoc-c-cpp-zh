    \ (p₁,p₂) ⊂ R</td><td>R.ideal(p1, p2) or (p1, p2)*R</td></tr>\n<tr><td>sum, product,\
    \ power</td><td>I + J, I * J, I^k</td></tr>\n<tr><td>intersection I ∩ J</td><td>I.intersection(J)</td></tr>\n\
    <tr><td>quotient I : J = {p | pJ ⊂ I}</td><td>I.quotient(J)</td></tr>\n<tr><td>radical\
    \ √I</td><td>I.radical()</td></tr>\n<tr><td>reduction modulo I</td><td>I.reduce(p)\
    \ or p.mod(I)</td></tr>\n<tr><td>section of R → R/I</td><td>p.lift(I)</td></tr>\n\
    <tr><td>quotient ring R/I</td><td>R.quo(I) or R.quotient(I)</td></tr>\n<tr><td>homogenised\
    \ ideal</td><td>J.homogenize()</td></tr>\n<tr><th colspan=2>Some predefined ideals</th></tr>\n\
    <tr><td>irrelevant ideal (x₁,...,xₙ)</td><td>R.irrelevant_ideal()</td></tr>\n\
    <tr><td>Jacobian ideal (∂p/∂xᵢ)</td><td>p.jacobian_ideal()</td></tr>\n<tr><td>cyclic\
    \ roots (9.11)</td><td>sage.rings.ideal.Cyclic(R)</td></tr>\n<tr><td>field equations\
    \ xᵢ^q = xᵢ</td><td>sage.rings.ideal.FieldIdeal(GF(q)['x1,x2'])</td></tr>\n</tbody>\n\
    </table>\n\nTABLE 9.3 – Ideals.\n\n**Radical of an Ideal and Solutions.** The\
    \ main correspondence between ideals and varieties lies in Hilbert's theorem of\
    \ zeros, also known as *Nullstellensatz*. Let K̄ be an algebraic closure of K.\n\
    \n**THEOREM (Nullstellensatz).** Let p₁,...,pₛ ∈ K[x], and let Z ⊂ K̄ⁿ be the\
    \ set of common zeros to the pᵢ. A polynomial p ∈ K[x] vanishes identically on\
    \ Z if and only if there exists an integer k such that p^k ∈ ⟨p₁,...,pₛ⟩.\n\n\
    This result provides an algebraic criterion to check whether a polynomial system\
    \ has some solutions. The constant polynomial 1 vanishes identically on Z if and\
    \ only if Z is empty, thus the system p₁(x)=...=pₛ(x)=0 has solutions in K̄ if\
    \ and only if the ideal ⟨p₁,...,pₛ⟩ does not contain 1. For example, the circles\
    \ of radius 1 centered at (0,0) and (4,0) have a complex intersection:\n\n```\n\
    \    sage: 1 in ideal(x^2+y^2-1, (x-4)^2+y^2-1)\n    False\n```\n\nHowever, after\
    \ adding the condition x = y, the system does not have any solutions. We can give\
    \ a trivial proof that it is inconsistent by exhibiting as *certificate* a combination\
    \ of the equations that reduces to 1 = 0 if they are satisfied. The computation\n\
    \n```\n    sage: R(1).lift(ideal(x^2+y^2-1, (x-4)^2+y^2-1, x-y))\n    [-1/28*y\
    \ + 1/14, 1/28*y + 1/14, -1/7*x + 1/7*y + 4/7]\n```\n\nyields in our relation\n\
    \n$$\\frac{1}{28}\\left((-y+2)(x^2+y^2-1)+(y+2)\\left((x-4)^2+y^2-1\\right)\\\
    right)\n+(-4x+4y+16)(x-y)=1.$$"
