    The number of operations performed by this function is the same as a computation
    by hand using (3.2). In the case n is even, if the instructions `b = pow1(a, n//2);return
    b*b` would be replaced by `pow1(a, n//2)*pow1(a, n//2)`, Sage would perform much
    more computations because, like for the recursive function fib2 for the Fibonacci
    sequence, some calculations would be duplicated. We would then have of the order
    of n products, i.e., as many as with the naïve method.


    Note that instead of `b = pow1(a, n//2);return b*b`, we could write `return pow1(a*a,
    n/2)`.


    The program below performs the same computation of $a^n$ using an iterative method:


    ```

    ~~~sage

    sage: def pow2 (u, k):

    ....:     v = 1

    ....:     while k != 0:

    ....:         if k % 2 == 0: u = u*u ; k = k//2

    ....:         else: v = v*u ; k = k-1

    ....:     return v

    ~~~

    ```


    ```

    ~~~sage

    sage: pow2 (2, 10)                  # result is 2^10

    1024

    ~~~

    ```


    The fact that `pow2(a, n)` returns $a^n$ is shown by verifying that after each
    iteration the values of the variables u, v and k satisfy $v u^k = a^n$, for whatever
    parity of k. Before the first iteration v = 1, u = a and k = n; after the last
    one k = 0, thus v = $a^n$.


    The successive values of the integer variable k are nonnegative, and they form
    a decreasing sequence. Hence this variable can only take a finite number of values
    before being zero and terminating the loop.


    Despite their apparent differences — pow1 is recursive, while pow2 is iterative
    — those two functions express almost the same algorithm: the only difference is
    that $a^{2k}$ is evaluated as $(a^k)^2$ in pow1, and as $(a^2)^k$ in pow2, through
    the update of the variable u.


    The method presented here is not limited to the computation of $a^n$ where a is
    a number and n a positive integer, it applies to any associative law (which is
    needed to preserve usual properties of iterated products). For instance, by replacing
    the integer 1 by the $m \times m$ unit matrix $1_m$, the two above functions would
    evaluate powers of square matrices. Those functions show how to efficiently implement
    the power operator “**” upon multiplication, and are similar to the method implemented
    within Sage.


    For example, using powers of matrices enables us to compute much larger terms
    of the Fibonacci sequence:


    \[ A=\begin{pmatrix}0&1\\1&1\end{pmatrix},\qquad X_n=\begin{pmatrix}u_n\\u_{n+1}\end{pmatrix},\qquad
    AX_n=X_{n+1},\qquad A^nX_0=X_n. \]'
