    **Pólya Enumeration.** We now count graphs on $n$ vertices up to isomorphism,
    using Pólya enumeration. We remain voluntarily brief and informal; the reader
    is encouraged to focus on the examples to get an intuition of what is going on.
    Our purpose is indeed merely to point to this gem of algebraic combinatorics that
    connects enumerative combinatorics, group theory, symmetric functions, and in
    fact even some representation theory. For details on the theory behind it, we
    refer to https://en.wikipedia.org/wiki/Cycle_index.


    As above, we fix $V = \{1, 2, \ldots, n\}$ as the set of vertices. In the examples,
    we take $n = 4$. A labelled graph is now just a subset $E$ of the collection $F$
    of the $\binom{n}{2}$ pairs $\{i, j\}$ of vertices:


