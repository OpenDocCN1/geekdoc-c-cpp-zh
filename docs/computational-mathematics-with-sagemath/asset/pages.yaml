  md: '**Change of Ring.** The exact list of available operations, their meaning and
    their efficiency heavily depend on the base ring. For example, the polynomials
    in `GF(p)[''x'']` have a method `small_roots` which returns their small roots
    with respect to the characteristic p; those in `QQ[''x'']` do not have such a
    method, since it makes no sense. The `factor` method exists for all polynomials,
    but raises an exception `NotImplementedError` for polynomials with coefficients
    in `SR` or in `Z/4Z`. This exception means that this operation is not available
    in Sage for this kind of object, despite having a mathematical meaning.


    It is very useful to be able to juggle the different rings of coefficients on
    which we might consider a given polynomial. Applied to a polynomial in `A[x]`,
    the method `change_ring(B)` returns its image in `B[x]`, when a natural method
    to convert the coefficients exists. The conversion is often given by a canonical
    morphism from `A` to `B`; in particular, `change_ring` might be used to extend
    the base ring to gain additional algebraic properties. Here for example, the polynomial
    `p` is irreducible over the rationals, but it factors on ℝ:


    ```

    ```

    sage: x = polygen(QQ)

    sage: p = x^2 - 16*x + 3

    sage: p.factor()

    x^2 - 16*x + 3

    sage: p.change_ring(RDF).factor()

    (x - 15.810249675906654) * (x - 0.18975032409334563)

    ```

    ```


    The `RDF` domain is that of “machine floating-point numbers”, and is discussed
    in Chapter 11. The obtained factorisation is approximate; it is not enough to
    recover the original polynomial. To represent real roots of polynomials with integer
    coefficients in a way that enables exact computations, we use the domain `AA`
    of real algebraic numbers. We will see some examples in the following sections.


    The same method `change_ring` allows to reduce a polynomial in `Z[x]` modulo a
    prime number:


    ```

    ```

    sage: p.change_ring(GF(3))

    x^2 + 2*x

    ```

    ```


    Conversely, if `B ⊂ A` and if the coefficients of `p` are in fact in `B`, we also
    call `change_ring` to recover `p` in `B[x]`.


    **Iteration.** More generally, one often needs to apply a given transformation
    to all coefficients of a polynomial. The method `map_coefficients` is designed
    for this. Applied to a polynomial `p ∈ A[x]` with parameter a function `f`, it
    returns the polynomial obtained by applying `f` to all non-zero coefficients of
    `p`. In general, `f` is an anonymous function defined using the `lambda` construction
    (see §3.3.2). Here is for example how one can compute the conjugate of a polynomial
    with complex coefficients:


    ```

    ```

    sage: QQi.<myI> = QQ[I]        # myI is the i of QQi, I that of SR

    sage: R.<x> = QQi[]; p = (x + 2*myI)^3; p

    x^3 + 6*I*x^2 - 12*x - 8*I

    sage: p.map_coefficients(lambda z: z.conjugate())

    ```

    ```'
