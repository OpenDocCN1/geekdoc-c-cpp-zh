    ```sage

    sage: import mpmath

    sage: mpmath.mp.prec = 53

    sage: sol = mpmath.odefun(lambda t, y: y, 0, 1)

    sage: sol(1)

    mpf(''2.7182818284590451'')

    sage: mpmath.mp.prec = 100

    sage: sol(1)

    mpf(''2.7182818284590452353602874802307'')

    sage: N(exp(1), 100)

    2.7182818284590452353602874714

    ```

    ```


    The arguments of the `mpmath.odefun` function are:


    +   - the right-hand sides of the system of equations, in the form of a function
    \((t,y) \mapsto f(t,y(t))\), here \(y''=y\), like for the `ode_solver` function.
    The dimension of the system is automatically deduced from the dimension of the
    function return value;

    +   - the initial conditions \(t_0\) and \(y(t_0)\), here \(y(0)=1\).


    For example for this two-dimensional system


    $$\begin{cases} y_1'' &= -y_2 \\ y_2'' &= y_1 \end{cases}$$


    whose solutions are \((\cos(t),\sin(t))\), with initial conditions \(y_1(0)=1\)
    and \(y_2(0)=0\):


    ```

    ```sage

    sage: mpmath.mp.prec = 53

    sage: f = mpmath.odefun(lambda t, y: [-y[1], y[0]], 0, [1, 0])

    sage: f(3)

    [mpf(''-0.98999249660044542''), mpf(''0.14112000805986721'')]

    sage: (cos(3.), sin(3.))

    (-0.98999249660044505, 0.141120008059867)

    ```

    ```


    The `mpmath.odefun` function relies on Taylor’s method. For degree \(p\) it uses:


    $$y(t_{n+1}) = y(t_n) + h\frac{dy}{dt}(t_n) + \frac{h^2}{2!}\frac{d^2y}{dt^2}(t_n)
    + \ldots + \frac{h^p}{p!}\frac{d^py}{dt^p}(t_n) + O(h^{p+1}).$$


    The main question is the computation of the derivatives of \(y\). For this purpose,
    `odefun` computes approximate values


    $$[\widetilde y(t_n+h),\ldots,\widetilde y(t_n+ph)] \approx [y(t_n+h),\ldots,y(t_n+ph)]$$


    using \(p\) steps of the less precise method of Euler. We then compute


    $$\frac{dy}{dt}(t_n) \approx \frac{\widetilde y(t_n+h)-\widetilde y(t_n)}{h},
    \qquad \frac{dy}{dt}(t_n+h) \approx \frac{\widetilde y(t_n+2h)-\widetilde y(t_n+h)}{h}$$


    then


    $$\frac{d^2y}{dt^2}(t_n) \approx \frac{\frac{dy}{dt}(t_n+h)-\frac{dy}{dt}(t_n)}{h},$$'
