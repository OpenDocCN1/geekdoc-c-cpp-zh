    # ### 5.4.4 Synthesis


    In the preceding examples, we have shown how the user might control the level
    of rigour in her/his computations.

    On the one hand, she/he can use symbolic expressions. These expressions live in
    the ring $SR$. They offer several methods (presented in Chapter 2) which apply
    well to some sub-classes of expressions, like polynomial expressions. When we
    recognise to which classes a given expression belongs to, this helps to know which
    functions could be applied. The simplification of expressions is a particular
    problem where this recognition is crucial. The main classes of expression are
    defined to take into account this simplification issue, and we will prefer this
    approach in the rest of this book.


    On the other hand, the user can *construct* a parent which will explicitly define
    the computational domain. It is especially interesting when this parent has a
    *normal form*: i.e., when two objects are mathematically equal if and only if
    they have the same representation.


    As a summary, the main advantage of symbolic expressions ($SR$) is their ease
    of use: no explicit declaration of the computational domain, easy addition of
    new variables or functions, easy change of the computational domain (for example
    when one takes the sine of a polynomial expression), use of all possible calculus
    tools (integration, etc.). The advantages of explicitly defining the computational
    domain are in the first place pedagogical, more rigorous computations$^6$, the
    automatic normal form transformation (which can also be a drawback!), and the
    easy access to advanced constructions that would be difficult with symbolic expressions
    (computations in a finite field or an algebraic extension of $\mathbb{Q}$, in
    a non-commutative ring, etc.).'
