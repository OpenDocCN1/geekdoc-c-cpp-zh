    ```

    ~~~sage

    sage: CH = C.intersection(H).quotient(ideal(4*x*y-1)); CH

    Ideal (4*x^3*y + 4*x*y^3 + x^2 - 4*x*y + y^2 - 1) of

    Multivariate Polynomial Ring in x, y over Rational Field

    sage: CH.gen(0).factor()

    (4*x*y + 1) * (x^2 + y^2 - 1)

    ~~~

    ```


    However, the curve obtained by removing from V(H) a finite number of points is
    not an algebraic subvariety, so that:


    ```

    ~~~sage

    sage: H.quotient(C) == H

    True

    ~~~

    ```


    **Dimension.** To each ideal of J ⊂ K[x] is also associated a *dimension*, which
    intuitively corresponds to the maximal “dimension” of the “components” of the
    variety V(J) over an algebraically closed field⁵. We have for example:


    ```

    ~~~sage

    sage: [J.dimension() for J in [J1, J2, C, H, H+J2, J1+J2]]

    [0, 0, 1, 1, 1, -1]

    ~~~

    ```


    Indeed, V(J₁) and V(J₂) have a finite number of points, V(C) and V(H) are curves,
    V(H · J₂) is the union of curves and isolated points, and V(J₁ + J₂) is empty.
    The *zero-dimensional systems*, i.e., those that generate an ideal of dimension
    zero, or equivalently that have a finite number of solutions (over the algebraic
    closure of K), will be particularly studied in the rest of the chapter, since
    they are the systems we can “solve” the most explicitly.


    # 9.2.4 Elimination


    In a system of equations, *eliminating* a variable means finding “consequences”,
    or better “all consequences”, of the system which are independent of this variable.
    Said otherwise, we want to find equations satisfied by any solution, but which
    do not contain the eliminated variable, which makes them often easier to analyse.


    ⁵ We give in §9.3.3 a more rigorous (but not necessarily clearer) definition.
    We refer the reader to the reference given at the beginning of the chapter for
    better explanations.'
