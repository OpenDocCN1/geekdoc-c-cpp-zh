    ```


    The odeint function takes as argument the right-hand side $f$ of the differential
    equation $y'' = f$ (assumed to be in explicit form), one or more initial conditions,
    and the interval where a solution is sought; it returns an array of type `numpy.ndarray`
    that one converts using the `flatten` command¹ already seen in §3.3.2. The obtained
    list is then combined with the array $t$ using the `zip` command, and the approximate
    solution is displayed. To add the vector fields tangent to the integral curves,
    we have used the `plot_vector_field` command.


    EXAMPLE. (Lotka–Volterra predator-prey model) We wish to represent graphically
    the variation of a set of prey and predators evolving according to a system of
    Lotka–Volterra equations:


    $$

    \begin{cases}

    \dfrac{du}{dt} = au - buv,\\[4pt]

    \dfrac{dv}{dt} = -cv + dbuv,

    \end{cases}

    $$


    where $u$ is the number of preys (for example rabbits), $v$ is the number of predators
    (for example foxes). In addition, the parameters $a$, $b$, $c$, $d$ describe the
    evolution of the populations: $a$ is the natural growth of rabbits without foxes
    to eat them, $b$ is the decrease of rabbits when foxes kill them, $c$ is the decrease
    of foxes without any rabbit to eat, and finally $d$ indicates how many rabbits
    are needed for a new fox to appear.


    ```

    ```sage

    sage: import scipy; from scipy import integrate

    sage: a, b, c, d = 1, 0.1, 1.5, 0.75

    sage: def dX_dt(X, t=0):                      # returns the population variation

    ....:     return [a*X[0] - b*X[0]*X[1], -c*X[1] + d*b*X[0]*X[1]]

    sage: t = srange(0, 15, .01)                  # time scale

    sage: X0 = [10, 5]                            # initial conditions: 10 rabbits
    and 5 foxes

    sage: X = integrate.odeint(dX_dt, X0, t)      # numerical solution

    sage: rabbits, foxes = X.T                    # short cut for X.transpose()

    sage: p = line(zip(t, rabbits), color=''red'')  # number of rabbits graph

    sage: p += text("Rabbits", (12,37), fontsize=10, color=''red'')

    sage: p += line(zip(t, foxes), color=''blue'')  # idem for foxes

    sage: p += text("Foxes", (12,7), fontsize=10, color=''blue'')

    sage: p.axes_labels([''time'', ''population'']); p.show(gridlines=True)

    ```

    ```


