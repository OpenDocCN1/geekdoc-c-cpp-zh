    **Exercise 26 page 135.** A direct translation of the algorithm in Sage gives
    something like:


    ```

    sage: def mydiv(u, v, n):

    ....:     v0 = v.constant_coefficient()

    ....:     quo = 0; rem = u

    ....:     for k in xrange(n+1):

    ....:         c = rem[0] / v0

    ....:         rem = (rem - c*v) >> 1  # shifting the coefficients

    ....:         quo += c*x^k

    ....:     return quo, rem

    ```


    (One can apply this function to larger examples and measure the execution time
    and try to make the code more efficient, keeping the same algorithm.)


    But the division by increasing powers up to order \(n\) is the series expansion
    of the rational function \(u/v\) truncated at order \(n+1\). Using the division
    of formal power series (see §7.5), we can compute the division by increasing powers
    like in the following function.


    ```

    sage: def mydiv2(u, v, n):

    ....:     x = u.parent().gen()

    ....:     quo = (u / (v + O(x^(n+1)))).polynomial()

    ....:     rem = (u - quo*v) >> (n+1)

    ....:     return quo, rem

    ```


    The line `quo = ...` uses the fact that, if we add \(O(\) to a polynomial, it
    is converted into a truncated series and that the default precision used when
    dividing a polynomial by a series is that of the divisor.


