    \ cycle computed by generating constraints.\n\nLet us now add the degree constraints:\n\
    \n```\n    sage: for u in g:\n    ....:     p.add_constraint( p.sum( B(u,v) for\
    \ v in g.neighbors(u) ) == 2 )\n```\n\nIt is now time to compute the first solution\
    \ of our problem and to create the graph representing it,\n\n```\n    sage: p.solve()\n\
    \    0.0\n    sage: h = Graph()\n    sage: h.add_edges( [(u,v) for u, v in g.edges(labels\
    \ = False)\n    ....:     if p.get_values(B(u,v)) == 1.0 ] )\n```\n\nthen we begin\
    \ our iterations:\n\n```\n    sage: while not h.is_connected():\n    ....:   \
    \  S = h.connected_components()[0]\n    ....:     p.add_constraint(\n    ....:\
    \         p.sum( B(u,v) for u,v\n    ....:             in g.edge_boundary(S, labels\
    \ = False) )\n    ....:         >= 2)\n    ....:     zero = p.solve()\n    ....:\
    \     h = Graph()\n    ....:     h.add_edges( [(u,v) for u,v in\n    ....:   \
    \      g.edges(labels = False)\n    ....:         if p.get_values(B(u,v)) == 1.0\
    \ ] )\n```\n\nIn less than a dozen iterations (an interesting economy of computations\
    \ with respect to 2^24 - 2) we obtain an admissible solution (cf. Figure 17.4).\
    \ In terms of performance, this solution method exceeds that of Miller-Tucker-Zemlin's\
    \ formulation. When we implement both linear programs in Sage, for a random graph\
