  md: 'Sage objects might behave differently. The choice of representation impacts
    the possible operations, the exact form of their results, and particularly the
    efficiency of the computations.


    **Dense or Sparse Representation.**  Two principal ways exist for representing
    polynomials. In a *dense* representation, the coefficients of $p = Σ_{i=0}^d p_i
    x^i$ are stored in a table $[p_0, …, p_d]$ indexed by the exponents. A *sparse*
    representation only stores the non-zero coefficients: the polynomial is encoded
    by a set of pairs exponent-coefficient $(i, p_i)$, stored in a list, or better,
    in a dictionary indexed by the exponents (see §3.3.9).


    For polynomials that really are dense, i.e., whose coefficients are mostly non-zero,
    the dense representation uses less memory and enables faster computations. It
    saves the encoding of the exponents and of the internal data structures of the
    dictionary: it only stores what is strictly necessary, the coefficients. Moreover,
    accessing an element and iterating on elements is faster in a table than in a
    dictionary. Conversely, the sparse representation enables us to efficiently compute
    with polynomials that we could not even store in memory with a dense representation:


    ```

    ```

    sage: R = PolynomialRing(ZZ, ''x'', sparse=True)

    sage: p = R.cyclotomic_polynomial(2^50); p, p.derivative()

    (x^562949953421312 + 1, 562949953421312*x^562949953421311)

    ```

    ```


    As shown by the preceding example, the representation is a characteristic of the
    polynomial ring, chosen at its construction. The “dense” polynomial $x ∈ ℚ[x]$
    and the “sparse” polynomial $x ∈ ℚ[x]$ thus have different parents. The default
    representation of univariate polynomials is dense. The option `sparse=True` of
    `PolynomialRing` enables us to build a polynomial ring with sparse representation.


    In addition, some details of the representation vary according to the kind of
    coefficients. The same holds for the code used to perform basic operations. Indeed,
    Sage provides a *generic* polynomial implementation which works on any commutative
    ring, but also optimised variants for some particular types of coefficients. These
    variants bring some additional features, and above all are much more efficient
    than the generic version. They call for this purpose some specialised external
    libraries, like Flint or NTL in the case of ℤ[x].


    To complete huge computations successfully, it is very important to work whenever
    possible in polynomial rings with efficient implementations. The help page output
    by `p?` for a polynomial `p` indicates which implementation it uses. The choice
    of the implementation often depends on the base ring and the representation. The
    `implementation` option of `PolynomialRing` enables us to choose a particular
    implementation when several are possible.


    **Symbolic Expressions.**  The symbolic expressions discussed in Chapters 1 and
    2 (i.e., the elements of `SR`) provide a third representation of polynomials.
    They are a natural choice when a computation mixes polynomials and more diverse
    expressions, as it is often the case in analysis. The flexibility they offer is
    sometimes useful even in a fully algebraic context. For example, the polynomial'
