  md: 'It should be noted that it is not possible to easily know (without performing
    the Cholesky decomposition) whether a symmetric matrix is positive definite; if
    we apply the Cholesky method to a matrix that is not positive definite, the decomposition
    will fail and an exception `ValueError` will be raised.


    To solve a system $Ax = b$ with the Cholesky decomposition, we proceed as with
    the $LU$ decomposition. Once the Cholesky decomposition is computed, we call `A.solve_right(b)`.
    Here again, the decomposition is not recomputed.


    Why use the Cholesky decomposition instead of the $LU$ decomposition to solve
    linear systems with symmetric positive definite matrix? First, the memory necessary
    to store the factors is halved, due to symmetry, but the Cholesky method is especially
    interesting for its number of operations: indeed, for a size-$n$ matrix, the Cholesky
    factorisation costs $n$ square roots, $n(n-1)/2$ divisions, $(n^3-n)/6$ additions
    and as many multiplications. As a comparison, the $LU$ factorisation costs $n(n-1)/2$
    divisions as well, but $(n^3-n)/3$ additions and as many multiplications.


    # ### 13.2.5 The $QR$ Decomposition


    Let $A \in \mathbb{R}^{n\times m}$, with $n \ge m$. We want to find two matrices
    $Q$ and $R$ such that $A = QR$ where $Q \in \mathbb{R}^{n\times n}$ is orthogonal
    ($Q^t \cdot Q = I$) and $R \in \mathbb{R}^{n\times m}$ is upper triangular. Of
    course, once such a decomposition is computed, we can use it to solve linear systems
    if the matrix $A$ is square and invertible. However, as we will see, the $QR$
    decomposition is especially interesting to solve least squares problems, and to
    compute eigenvalues. We should note that $A$ is not necessarily square. The $QR$
    decomposition always exists. Example:


    ```

    ```sage

    A = random_matrix(RDF,6,5)

    Q, R = A.QR()

    ```

    ```


    **Exercise 47** (Perturbing a linear system). Let $A$ be an invertible square
    matrix, and assume we have computed a decomposition of $A$ ($LU$, $QR$, Cholesky,
    ...). Let $u$ and $v$ be two vectors. We consider the matrix $B = A + uv^t$, and
    we assume that $1 + v^t A^{-1}u \ne 0$. How to cheaply solve the $Bx = f$ system
    (i.e., without a factorisation of $B$)?


    Hint: We will use the Sherman and Morrison formula (that we will either prove
    or assume):


    $$(A + uv^t)^{-1} = A^{-1} - \frac{A^{-1}uv^tA^{-1}}{1 + v^tA^{-1}u}$$


    # ### 13.2.6 Singular Value Decomposition


    Let $A$ be an $n \times m$ matrix with real coefficients. Then two orthogonal
    matrices $U \in \mathbb{R}^{n\times n}$ and $V \in \mathbb{R}^{m\times m}$ exist,
    such that


    $$U^tAV = \Sigma = \operatorname{diag}(\sigma_1, \sigma_2, \ldots, \sigma_p),$$


    where $\sigma_1 \ge \sigma_2 \ge \ldots \ge \sigma_p \ge 0$ (with $p = \min(m,n)$).
    The numbers $\sigma_1, \ldots, \sigma_p$ are the *singular values* of $A$.'
