    **Summary.** To summarise, Sage provides a library of common enumerated sets,
    which can be combined via standard constructions, giving a toolbox that is flexible
    (but that could still be expanded). It is also possible to add new building blocks
    to Sage with a few lines (see the code in `Sets(). Enumerated(). Finite()`), This
    is made possible by the uniformity of the interfaces and the fact that Sage is
    based on an object-oriented language. Also, very large or even infinite sets can
    be manipulated thanks to lazy evaluation strategies (iterators, etc.).


    There is no magic to any of this: under the hood, Sage applies the usual rules
    (for example, that the cardinality of E × E is |E|²); the added value comes from
    the capacity to manipulate complicated constructions. The situation is comparable
    to Sage''s implementation of differential calculus: Sage applies the usual rules
    for differentiation of functions and their compositions, where the added value
    comes from the possibility of manipulating complicated formulas. In this sense,
    Sage implements a calculus of finite enumerated sets.


    # ## 15.4 Generic Algorithms


    # ### 15.4.1 Lexicographic Generation of Lists of Integers


    Among the classic enumerated sets, especially in algebraic combinatorics, a certain
    number are composed of lists of integers of fixed sum, such as partitions, compositions,
    or integer vectors. These examples can also have further constraints added to
    them. Here are some examples. We start with the integer vectors with sum 10 and
    length 3, with parts bounded below by 2, 4 and 2 respectively:


    ```

