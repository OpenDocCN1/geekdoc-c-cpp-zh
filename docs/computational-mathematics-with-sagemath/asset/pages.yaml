  md: 'Integer powers often arise in mathematics and computer science; this paragraph

    discusses a general method to compute $a^n$ in a much faster way than the naive

    method. The sequence $(u_n)_{n\in\mathbb{N}}$ below satisfies $u_n=a^n$; this
    follows by induction

    from the equalities $a^{2k}=(a^k)^2$ and $a^{k+1}=a a^k$:


    \[

    u_n = \begin{cases}

    1 & \text{if } n=0,\\

    u_{n/2}^2 & \text{if } n \text{ is even positive},\\

    a u_{n-1} & \text{if } n \text{ is odd}.

    \end{cases}

    \qquad (3.2)

    \]


    For example, for $n = 11$:


    \[

    u_{11}=a u_{10},\quad u_{10}=u_5^2,\quad u_5=a u_4,\quad u_4=u_2^2,\\

    u_2=u_1^2,\quad u_1=a u_0=a;

    \]


    therefore:


    \[

    u_2=a^2,\quad u_4=u_2^2=a^4,\quad u_5=a a^4=a^5,\\

    u_{10}=u_5^2=a^{10},\quad u_{11}=a u^{10}=a^{11}.

    \]


    The computation of $u_n$ only involves terms $u_k$ with $k\in\{0,\ldots,n-1\}$,
    and is thus

    well performed in a finite number of operations.


    This example also shows that $u_{11}$ is obtained after the evaluation of 6 terms
    $u_{10}$,

    $u_5$, $u_4$, $u_2$, $u_1$ and $u_0$, which performs 6 multiplications only. In
    general, the

    computation of $u_n$ requires between $\log n/\log 2$ and $2\log n/\log 2$ multiplications.

    Indeed, $u_n$ is obtained from $u_k$, $k\le n/2$, with one or two additional steps,

    according to the parity of $n$. This method is thus much faster than the naive
    one

    when $n$ is large: about twenty products for $n=10^4$ instead of $10^4$ products:


    | indices k: | 10000 | 5000 | 2500 | 1250 | 625 | 624 | 312 | 156 | 78 |

    |---|---|---|---|---|---|---|---|---|---|

    | | 39 | 38 | 19 | 18 | 9 | 8 | 4 | 2 | 1 |


    However, this method is not always the best one; the following operations using

    $b$, $c$, $d$ and $f$ perform 5 products to compute $a^{15}$, whereas the above
    method —

    using $u$, $v$, $w$, $x$ and $y$ — requires 6 products, without counting the initial
    product

    $a\cdot 1$:


    $b=a^2 \quad c=ab=a^3 \quad d=c^2=a^6 \quad f=cd=a^9 \quad df=a^{15}$ : 5 products;

    $u=a^2 \quad v=au=a^3 \quad w=v^2=a^6$

    $x=aw=a^7 \quad y=x^2=a^{14} \quad ay=a^{15}$ : 6 products.


    The recursive function pow1 uses the recurrent sequence (3.2) to compute $a^n$:


    ```

    ```sage

    sage: def pow1 (a, n):

    ....:     if n == 0: return 1

    ....:     elif n % 2 == 0: b = pow1 (a, n/2); return b*b

    ....:     else: return a * pow1(a, n-1)

    ```

    ```


    ```

    ```sage

    sage: pow1 (2, 11)               # result is 2^11

    ```

    ```'
