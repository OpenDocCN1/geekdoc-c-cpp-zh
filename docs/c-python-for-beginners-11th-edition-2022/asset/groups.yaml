- md: "\n# How to Set Up Python in Linux\n\nPython version 2.x is already installed\
    \ in most Linux distributions but we're going to be using Python 3.x, there's\
    \ a little work we need to do first to get hold of it. Frankly, it's not too difficult.\n\
    \n## PYTHON PREGEN\n\nLinux is such a versatile operating system that it's often\
    \ difficult to nail down one way of doing something. Different distributions about\
    \ installing software in different ways, we will still stick to Linux Mint 18.1\
    \ for this particular tutorial.\n\n- **STEP 1** First need to ascertain which\
    \ version of Python is currently installed in your Linux system; as mentioned,\
    \ we're going to use Linux Mint 18.1 for this section. As with macOS, drop into\
    \ a Terminal by pressing Ctrl+Alt+T.\n\n- **STEP 3** Some Linux distros will automatically\
    \ update the installation of Python to the latest versions whenever the system\
    \ is updated. To check, first do a system update and upgrade with: `sudo apt-get\
    \ update && sudo apt-get upgrade`\n\n```\nFile Edit View Search Terminal Help\n\
    david@david-mint ~ $\n```\n\nEnter your password and let the system do any updates.\n\
    \n```\nFile Edit View Search Terminal Help\ndavid@david-mint ~ -version\nPython\
    \ 2.7.12\ndavid@david-mint ~ $ sudo apt-get update && sudo apt-get upgrade\n[sudo]\
    \ password for david: \n```\n\n- **STEP 2** Next enter: `python --version` into\
    \ the Terminal. You should have the output relating to 2.x of Python in the display.\
    \ Or in this particular case is 2.7.12.\n\n- **STEP 4** Once the update upgrade\
    \ is complete, you may need to answer \"Y\" to authorise your changes, enter:\
    \ `python3 --version` to see if Python 3.x is updated or installed. In the case\
    \ of Linux Mint, the version has Python 3.5.2, which is fine for purposes.\n\n\
    ```\nFile Edit View Search Terminal Help\ndavid@david-mint ~ $ python --version\n\
    Python 2.7.12\ndavid@david-mint ~ $\n```\n\n```\nSetting up lib64 (2.1.0-ubuntu10.0.41)\n\
    Setting up lib386 (2.1.0-ubuntu10.0.41)\nSetting up libi386 (2.1.0-ubuntu10.0.41)\n\
    Setting up libstdc6 (2.1.0-ubuntu10.0.41)\nSetting up libncurses6 (2.1.0-ubuntu10.0.41)\n\
    Setting up libgcc-s1 (4.8.0-0ubuntu6)\nSetting up libc-dev-common (2.23.2-ubuntu8)\n\
    Setting up libx86-64-dev (4.8.0-ubuntu6)\nSetting up libi386-dev (4.8.0-ubuntu6)\n\
    Setting up linux-libc (2.23.2-ubuntu8)\nSetting up openssl (1.0.2-ubuntu2)\nSetting\
    \ up microcode (0-20160918-ubuntu4)\nSetting up kernel-generic (2.6.31-0-ubuntu114)\n\
    Setting up zlib1g-dev (0.2.11-6ubuntu5)\nSetting up python (2.7.5-2ubuntu2generic)\n\
    Setting up python3 (3.5.2-3ubuntu1)\nSetting up python3-distutils (3.5.2-3ubuntu1)\n\
    Setting up python3-minimal (3.5.2-3ubuntu1)\nSetting up python3-dev (3.5.2-3ubuntu1)\n\
    Setting up python3-stdlib (3.5.2-3ubuntu1)\nSetting up python3-venv (3.5.2-3ubuntu1)\n\
    Setting up python3-version (3.5.2-3ubuntu1)\ndavid@david-mint ~ $\n```\n\n**STEP\
    \ 5** However, if you want the latest version, 3.6.2 as build the Python website\
    \ at the time of writing, you need to start by entering these commands into the\
    \ Terminal:\n\n- **STEP 8** Within the Python folder, enter:\n\n```\nsudo apt-get\
    \ install build-essential checkinstall\nsudo apt-get install libreadline-dev libssl-dev\n\
    nss5-dev libsqlite3-dev tk-dev\nlibdbm-dev libbz22-dev\n```\n\n```\n./configure\n\
    sudo make altinstall\n```\n\nThis could take a little depending on the speed of\
    \ your computer. Once finished, run python3.6 --version to check the installed\
    \ version.\n\n![](img/a8d30135b233113405243b99e2d4c802_18_0.png)\n\n![](img/a8d30135b233113405243b99e2d4c802_18_1.png)\n\
    \n- **STEP 6** Open your Linux web browser and go to the Python download page:\
    \ www.python.org/ when it's loaded you click on the Download Python 3.6.2 or download\
    \ the Source-3.6.2.tar.xz\n\n- **STEP 9** For the GUI, you need to enter the command\
    \ into the Terminal: `sudo apt-get install idle3`. The IDE can then be started\
    \ with: `idle3`. Note, that IDE runs from a different version than the one installed.\n\
    \n- **STEP 7** In the Terminal, go download the contents of the Python source\
    \ using: `tar -xvf Python-3.6.2.tar.xz`. Now enter the unpacked folder\n\n- **STEP\
    \ 10** You also need Pip (Pip Packages) which is to help you install modules and\
    \ scripts. `sudo apt-get install python3-pip`. Check for the latest update: `pip\
    \ install --upgrade pip`. When complete, Python 3 will be available via the Programming\
    \ Environment in your distro's menu.\n\n![](img/a8d30135b233113405243b99e2d4c802_18_2.png)\n\
    \n![](img/a8d30135b233113405243b99e2d4c802_18_3.png)\n\n# Getting Started with\
    \ Python\n\nGetting started with Python may seem a little daunting at first but\
    \ the language has been designed with simplicity in mind. Like most things, you\
    \ need to start slowly, learn how to get a result and how to get what you want.\
    \ In this section, we cover variables, numbers and expressions, user input, conditions\
    \ and the types of errors you may well come across with time.\n\n![](img/a8d30135b233113405243b99e2d4c802_19_0.png)\n\
    \n# Starting Python for the First Time\n\nWe're going to be using the Raspberry\
    \ Pi as our Python 3 platform. The latest version of Raspbian comes preinstalled\
    \ with Python 3, version 3.4.2 so as long as you have a version 3 Shell, all our\
    \ code will work. We're not going to get into the details of getting the Raspberry\
    \ Pi up and running, there's plenty of material available on that subject. However,\
    \ once you're ready, fire up your Pi and get ready for coding.\n\n- **STEP 1**\
    \ With the Raspberry desktop loaded, click on the Menu by Programming > Python\
    \ 3 IDLE. This opens the Python 3 Shell. Windows and Mac users can find the Python\
    \ 3 IDLE from the Start menu via Finder.\n\n- **STEP 2** The Shell is where you\
    \ can enter code and see the responses and output you produce. This is a kind\
    \ of sandbox, where you're able to try out some simple code and processes.\n\n\
    - **STEP 3** For example, in the Shell: after pressing Enter, the next line displays\
    \ the answer. Basics, Python has taken your 'code' and produced the relevant output.\n\
    \n![](img/a8d30135b233113405243b99e2d4c802_21_0.png)\n\n- **STEP 4** The Shell\
    \ acts very much like a calculator, since code is a series of mathematical interactions\
    \ with the system. Integers, which are the infinite sequence of numbers can easily\
    \ be added, subtracted, multiplied and so on.\n\n```\nPython 3.4.2 (Default, Oct\
    \ 19 2014, 13:31:11)\nGCC 4.9.0 on Linux\n>>> type('copyright', 'credits' or 'license')\
    \ for more information.\n>>>\n>>> 4+4\n8\n>>> 23456*645452\n151329543412\n>>>\
    \ 977777*22884323-12343\n2239999999999991\n>>> 977777*43952\n4299999911044\n>>>\
    \ 50647292358\n```\n\n**STEP 5** while it's very interesting, it's not particularly\
    \ exciting. Instead, try this:\n\n```\nprint(\"Hello everyone!\")\n```\n\nJust\
    \ like the code we entered in Sublime Text Editor section. \n\n```\nPython 3.4.2\
    \ (Default, Oct 19 2014, 13:31:11)\nGCC 4.9.0 on Linux\n>>> type('copyright',\
    \ 'credits' or 'license') for more information.\n>>>\n>>> 4+4\n8\n>>> 23456*645452\n\
    151329543412\n>>> 977777*22884323-12343\n2239999999999991\n>>> 977777*43952\n\
    4299999911044\n>>> 50647292358\n```\n\n- **STEP 8** The Python IDE is a comfortable\
    \ environment, if you don't like the way the colors are represented, then you\
    \ can change them Options > Configure Highlighting. However, we recommend not\
    \ to, as you'll be seeing the same as screenshots.\n\n![](img/a8d30135b233113405243b99e2d4c802_22_1.png)\n\
    \n- **STEP 6** This is a little more like it, since you've just produced your\
    \ first bit of code. The command is fairly self-explanatory, it prints things\
    \ to the screen, in this case see the 'Hello everyone' result:\n\n- **STEP 9**\
    \ Just like most programs, regardless of the operating system, there are numerous\
    \ shortcut keys. We don't have room for all here but when you Options > Configure\
    \ IDE and under the keys, you can see a list of the current bindings.\n\n```\n\
    >>> print(\"Hello everyone!\")\nHello everyone!\n>>> \n```\n\n![](img/a8d30135b233113405243b99e2d4c802_22_2.png)\n\
    \n# IDLE Colour Coding\n\n| Color | Use | Examples |\n|---|---|---|\n| Black |\
    \ Data & variables | 23.4 area |\n| Green | Strings | \"Hello World\" |\n| Purple\
    \ | Functions | len() |\n| Blue | User functions | get_area() |\n| Dark | Comments\
    \ | #variable_VAR |\n| Light | Error messages | SyntaxError:\n\nwww.bdumpublic.com\
    \ 23\n"
  mdcn: "\n\n# 如何在 Linux 中安装 Python\n\n大多数 Linux 发行版已经预装了 Python 2.x，但我们将使用 Python\
    \ 3.x，因此我们需要先做一些工作来获取它。坦率地说，这并不困难。\n\n## PYTHON 准备工作\n\nLinux 是一个如此多功能的操作系统，因此很难规定某事的唯一方法。不同的发行版安装软件的方式各异，但在本教程中我们仍然坚持\
    \ Linux Mint 18.1。\n\n- **步骤 1** 首先，需要确定你的 Linux 系统当前安装了哪个版本的 Python；如前所述，本节我们将使用\
    \ Linux Mint 18.1。与 macOS 一样，按下 Ctrl+Alt+T 进入终端。\n\n- **步骤 3** 某些 Linux 发行版会在系统更新时自动将\
    \ Python 的安装更新到最新版本。要进行检查，请首先运行系统更新和升级：`sudo apt-get update && sudo apt-get upgrade`\n\
    \n```\nFile Edit View Search Terminal Help\ndavid@david-mint ~ $\n```\n\n输入你的密码并让系统执行任何更新。\n\
    \n```\nFile Edit View Search Terminal Help\ndavid@david-mint ~ -version\nPython\
    \ 2.7.12\ndavid@david-mint ~ $ sudo apt-get update && sudo apt-get upgrade\n[sudo]\
    \ password for david: \n```\n\n- **步骤 2** 接下来在终端中输入：`python --version`。你应该会在屏幕上看到与\
    \ Python 2.x 相关的输出。或者在这种特定情况下是 2.7.12。\n\n- **步骤 4** 一旦升级完成，你可能需要回答 \"Y\" 来授权你的更改，输入：`python3\
    \ --version` 查看 Python 3.x 是否已更新或安装。在 Linux Mint 中，该版本为 Python 3.5.2，这对于我们的来说足够了。\n\
    \n```\nFile Edit View Search Terminal Help\ndavid@david-mint ~ $ python --version\n\
    Python 2.7.12\ndavid@david-mint ~ $\n```\n\n```\nSetting up lib64 (2.1.0-ubuntu10.0.41)\n\
    Setting up lib386 (2.1.0-ubuntu10.0.41)\nSetting up libi386 (2.1.0-ubuntu10.0.41)\n\
    Setting up libstdc6 (2.1.0-ubuntu10.0.41)\nSetting up libncurses6 (2.1.0-ubuntu10.0.41)\n\
    Setting up libgcc-s1 (4.8.0-0ubuntu6)\nSetting up libc-dev-common (2.23.2-ubuntu8)\n\
    Setting up libx86-64-dev (4.8.0-ubuntu6)\nSetting up libi386-dev (4.8.0-ubuntu6)\n\
    Setting up linux-libc (2.23.2-ubuntu8)\nSetting up openssl (1.0.2-ubuntu2)\nSetting\
    \ up microcode (0-20160918-ubuntu4)\nSetting up kernel-generic (2.6.31-0-ubuntu114)\n\
    Setting up zlib1g-dev (0.2.11-6ubuntu5)\nSetting up python (2.7.5-2ubuntu2generic)\n\
    Setting up python3 (3.5.2-3ubuntu1)\nSetting up python3-distutils (3.5.2-3ubuntu1)\n\
    Setting up python3-minimal (3.5.2-3ubuntu1)\nSetting up python3-dev (3.5.2-3ubuntu1)\n\
    Setting up python3-stdlib (3.5.2-3ubuntu1)\nSetting up python3-venv (3.5.2-3ubuntu1)\n\
    Setting up python3-version (3.5.2-3ubuntu1)\ndavid@david-mint ~ $\n```\n\n**步骤\
    \ 5** 然而，如果你想获取最新版本（写作时 Python 网站上的版本为 3.6.2），你需要从在终端中输入这些命令开始：\n\n- **步骤 8**\
    \ 在 Python 文件夹内，输入：\n\n```\nsudo apt-get install build-essential checkinstall\n\
    sudo apt-get install libreadline-dev libssl-dev\nnss5-dev libsqlite3-dev tk-dev\n\
    libdbm-dev libbz22-dev\n```\n\n```\n./configure\nsudo make altinstall\n```\n\n\
    这取决于你电脑的速度。完成后，运行 `python3.6 --version` 来检查安装的版本。\n\n![](img/a8d30135b233113405243b99e2d4c802_18_0.png)\n\
    \n![](img/a8d30135b233113405243b99e2d4c802_18_1.png)\n\n- **步骤 6** 打开你的 Linux\
    \ 浏览器并访问 Python 下载页面：www.python.org/，加载后点击 \"Download Python 3.6.2\" 或下载 \"Source-3.6.2.tar.xz\"\
    。\n\n- **步骤 9** 对于 GUI，你需要在终端中输入命令：`sudo apt-get install idle3`。可以通过 `idle3` 启动\
    \ IDE。注意，IDE 运行的版本与安装的不同。\n\n- **步骤 7** 在终端中，下载 Python 源码：`tar -xvf Python-3.6.2.tar.xz`。现在进入解压文件夹\n\
    \n- **步骤 10** 你还需要 Pip（Pip 包）来帮助安装模块和脚本：`sudo apt-get install python3-pip`。检查最新更新：`pip\
    \ install --upgrade pip`。完成后，通过你发行版的菜单可以使用 Python 3。\n\n![](img/a8d30135b233113405243b99e2d4c802_18_2.png)\n\
    \n![](img/a8d30135b233113405243b99e2d4c802_18_3.png)\n\n# 入门 Python\n\n刚开始学习 Python\
    \ 可能看起来有些困难，但这种语言的设计初衷是简单。像大多数事情一样，你需要缓慢学习如何获得想要的结果。在本节中，我们将介绍变量、表达式、用户输入以及各种错误类型。\n\
    \n![](img/a8d30135b233113405243b99e2d4c802_19_0.png)\n\n# 首次 Python\n\n我们将树莓派作为我们的\
    \ Python 3 平台。最新的 Raspbian 预装了 Python 3，版本为 3.4.2，只要你有版本 3 Shell，我们的代码就可以运行。我们不会深入研究树莓派的细节，该主题有很多可用资料。然而，一旦你准备好了，启动树莓派并准备。\n\
    \n- **步骤 1** 树莓派桌面加载后，点击 Menu > Python 3。这将打开 Python 3 Shell。Windows 和 Mac 用户可以通过\
    \ Finder 找到 Python 3 IDE。\n\n- **步骤 2** Shell 是你可以输入代码并看到生成的输出的地方。这是一个沙箱，你可以在这里尝试一些代码。\n\
    \n- **步骤 3** 例如，在 Shell 中：按下回车后，下一行将显示答案。Python 处理了你的“代码”并产生了相应的输出。\n\n![](img/a8d30135b233113405243b99e2d4c802_21_0.png)\n\
    \n- **步骤 4** Shell 的作用非常像计算器，因为代码是与系统的系列交互。整数（无限数字序列）可以很容易地加、减、乘等。\n\n```\nPython\
    \ 3.4.2 (Default, Oct 19 2014, 13:31:11)\nGCC 4.9.0 on Linux\n>>> type('copyright',\
    \ 'credits' or 'license') for more information.\n>>>\n>>> 4+4\n8\n>>> 23456*64542\n\
    151329543412\n>>> 977777*2288433-12343\n223999999999991\n>>> 977777*43952\n429999911044\n\
    >>> 50647292358\n```\n\n**步骤 5** 虽然很有趣，但并不特别有趣。相反，尝试这个：\n\n```\nprint(\"Hello\
    \ everyone!\")\n```\n\n就像我们在 Sublime Text Editor 节输入的代码一样。\n\n```\nPython 3.4.2\
    \ (Default, Oct 19 2014, 13:31:11)\nGCC 4.9.0 on Linux\n>>> type('copyright',\
    \ 'credits' or 'license') for more information.\n>>>\n>>> 4+4\n8\n>>> 23456*64542\n\
    151329543412\n>>> 977777*2288433-12343\n223999999999991\n>>> 977777*43952\n429999911044\n\
    >>> 50647292358\n```\n\n- **步骤 8** Python IDE 是一个舒适的环境，如果你不喜欢颜色的表示方式，可以更改它们：Options\
    \ > Configure Highlighting。然而，我们建议不要这样做，因为你看到的将和截图一样。\n\n![](img/a8d30135b233113405243b99e2d4c802_22_1.png)\n\
    \n- **步骤 6** 这更像那么一点，因为你刚刚产生了第一段代码。该命令是自而易懂的，它将内容打印到屏幕上，在这种情况下查看“Hello everyone”的结果：\n\
    \n- **步骤 9** 就像大多数程序一样，无论操作系统如何，都有许多快捷键。这里没有空间列出所有的，但当你进入 Options > Configure\
