    \ 3.4.2 Shell\nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\nType \"copyright\"\
    : \"credits\" or \"license\" for more information.\n>>> print(\"Hello\")\nHello\n\
    >>> print(2+2)\n4\n>>> x=2\n>>> b=2\n>>> print(x*b)\n4\n>>> b=3\n>>> print(x*b)\n\
    6\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_23_1.png)\n\n## STEP 5\n\n\
    What you have done here is assigning the letters a and b values: 2 and 2. These\
