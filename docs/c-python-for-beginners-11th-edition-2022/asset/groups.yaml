    name="David"

    print(name)

    David Howard

    >>> title="Descended from Vikings"

    print(title)

    Descended from Vikings

    ```


    - STEP 2 You can check the type of variable in use by issuing the type( ) command,
    placing the name of the variable inside the brackets. In alike this would be:
    type(name). Add a new string variable: title="Descended from Vikings".


    - STEP 4 You can also combine variables within another variable. For example,
    to combine both and title into a new variable we use:


    ![](img/a8d30135b233113405243b99e2d4c802_33_1.png)


    ```python

