    # 向 Python 问好


    ## 如何在 Windows 中设置 Python


    Windows 用户可以通过 Python 主下载页面轻松安装最新版本的 Python。虽然大多数经验丰富的开发者可能并不会选择 Python 3.x 作为其代码的首选平台，但对于初学者来说，这是一个理想的起点。


    ### 安装 Python 3.X


    Microsoft Windows 默认不预装 Python，因此你必须手动安装它。坦率地说，这个过程非常简单。


    ![](img/a8d30135b233113405243b99e2d4c802_13_0.png)


    - **步骤 1** 首先打开网页浏览器访问 www.python.org/downloads/。寻找 Python 3.x 的下载按钮链接（在本例中是 Python
    3.6，但你可能会看到更高版本的 3）。


    - **步骤 2** 点击版本 3.x 版本的下载按钮，并将文件保存到你的“下载”（Downloads）文件夹中。文件下载完成后，双击执行文件即可启动安装向导。从这里你有两个选择：立即安装（Install
    Now）或自定义（Custom）。我们建议选择自定义安装。


    ![](img/a8d30135b233113405243b99e2d4c802_13_3.png)


    - **步骤 3** 选择自定义选项允许你指定某些参数，虽然你可以保持默认设置，但养成一个良好的习惯是避免（幸好 Python 有时并非如此）安装程序可能包含不需要的功能。如果你需要这些功能，请确保勾选所有框框并点击“下一步”按钮。


    下一页选项包含一些添加到 Python 的重要项：创建快捷方式（Create Shortcuts）、将 Python 添加到环境变量（Add Python
    to Environment Variables）、预编译标准库（Precompile Standard Library）以及为所有用户安装（Install
    for All Users）。这些设置会让以后使用 Python 变得更容易。准备就绪后点击“安装”（Install）。


    ![](img/a8d30135b233113405243b99e2d4c802_13_4.png)


    ## 下载 Windows 最新版本


    不知道该用哪个版本？这里有关于 Python 2 和 3 之间区别的更多信息。


    正在寻找其他系统的 Python 吗？Windows, Linux, Mac, OS X, 其他


    想帮助测试 Python 版本吗？预发布版（Pre-releases）


    ![](img/a8d30135b233113405243b99e2d4c802_13_1.png)


    | 可选功能 |

    | :--- |

    | 文档 (Documentation) | 安装 Python 文档文件。 |

    | pip | 安装 pip，它可以下载并安装其他 Python 包。 |

    | IDLE | 安装 IDE 环境。 |

    | Python test | 安装包含的测试库套件。 |

    | 启动器 (launcher) | 为所有用户安装（需要权限）安装全局启动器以便启动 Python。 |


    ![](img/a8d30135b233113405243b99e2d4c802_13_2.png)


    ### 高级选项


    - 为所有用户安装 (Install for all users)

    - 将文件与 Python 关联 (Associate files with Python) (需要 python)

    - 为应用程序创建快捷方式 (Create shortcuts for applications)

    - 将 Python 添加到环境变量 (Add Python to environment variables)

    - 预编译标准库 (Precompile standard library)

    - 禁用帮助程序 (Disable help programs)

    - 下载调试二进制文件 (Download debug binaries) (VS 2015 或更高版本)


    ![](img/a8d30135b233113405243b99e2d4c802_13_5.png)


    ## 如何在 Windows 中设置 Python


    步骤 5 你可能需要确认安装。Windows 授权通知只需点击“是”，安装将开始。安装完成后，最后的窗口页面将允许你查看最新的发布说明，并遵循一些在线教程。


    步骤 6 在点击安装窗口之前，最好点击带有盾牌的“禁用路径长度限制”（Disable Path Length Limit）。这将允许你绕过 260 个字符的限制，从而执行位于深层文件夹结构中的
    Python 程序。再次点击“是”激活该过程，然后你就可以关闭安装窗口了。


    步骤 7 绝大多数用户将会在“开始”按钮的“最近添加”部分找到已安装的 Python 3.x。第一个链接“Python 3.6 (32-bit)”在点击后将启动命令行版本的
    Python。要打开 IDLE，请在 Windows 开始菜单中输入 IDLE。


    步骤 8 点击 IDLE (Python 3.6 32-bit) 链接将开启 Python 编程之旅。在这里你可以加入世界。不用担心你的版本更高新，因为它是
    Python 3.x 代码，可以在你的 Python 3 接口中运行。


    步骤 9 如果你现在再次点击“开始”按钮，这次输入 CMD，你将看到命令提示符。点击它进入 Windows 命令行环境。在命令行输入 Python，输入 python
    并按回车。


    > 禁用路径长度限制

    > 修改你的机器配置，允许程序（包括 Python）绕过 260 个字符的“MAX_PATH”限制。


    - 禁用路径长度限制


    ![](img/a8d3013_14_0.png)

    ![](img/a8d30135b233113405243b99e2d4c802_14_1.png)


    步骤 10 命令行版本的 Python 工作方式与你在步骤 8 中打开的 Shell 相同；注意那三个向左的箭头 >>>。虽然这是一个完美的环境，但它不是那么用户友好，所以暂时先离开命令行。输入
    exit 关闭并离开命令提示符。


    ![](img/a8d30135b233113405243b99e2d4c802_14_2.png)


    | 最佳匹配 |

    | :--- |

    | IDLE (Python 3.6 32-bit) 桌面应用 |

    | IDLE - 查看结果 |


    ![](img/a8d30135b233113405243b99e2d4c802_14_3.png)


    安装成功

    特别感谢 Mark Hammond，他多年免费开发的 Windows 版本对 Python 仍然很有用。


    初学 Python 吗？从在线教程和文档开始。


    查看此发布版本的内容。


    ![](img/a8d30135b233113405243b99e2d4c802_14_4.png)


    '
