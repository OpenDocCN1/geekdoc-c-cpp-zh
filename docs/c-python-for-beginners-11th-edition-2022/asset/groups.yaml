    # Equipment Needed


    # C++ SETUPS


    Most, if not all, operating systems have C++ in their code, so it stands to reason
    that you can learn to program in C++ no matter what OS you''re currently using.


    ![](img/a8d30135b233113405243b99e2d4c802_47_0.png)


    +   - COMPUTER


    Unless you fancy writing your C++ code by hand on a sheet of paper (which is something
    many older coders used to do), a computer is an absolute must component. PC users
    have any recent Linux distro or Windows OS; Mac users have the latest macOS.


    +   - AN IDE


    Just as with Python, an IDE is used to enter and execute your C++. Many IDEs with
    extensions and plugins that help it work better, or add an extra level of functionality.
    Often, an IDE provides enhancements depending on the OS being used, such as being
    enhanced for Windows 10.


    +   - COMPILER


    A compiler is a program that converts the C++ language into binary, so that the
    computer can understand. Some IDEs have a compiler built in, others don''t. CodeBlocks
    is our favourite IDE that comes with a C++ compiler as part of the package. More
    on this later.


    +   - TEXT EDITOR


    Some programmers prefer to use a text editor to assemble their C++ code before
    running it through a compiler. Essentially you can use any text editor to write
    code, just save it with a cpp extension. However, Notepad++ is one of the best
    text editors available.


    ![](img/a8d30135b233113405243b99e2d4c802_47_1.png)


    +   - INTERNET ACCESS


    While it''s entirely possible to learn how to code on a computer that''s not attached
    to the Internet, it''s extraordinarily difficult. You need to install relevant
    software, keep it up to date, install any extras or extensions for help when coding.
    All of these require the Internet.


    +   - TIME AND PATIENCE


    Yes, with Python, you''re going to need to spend significant time on learning
    to code in C++. Sadly, unless you''re a genius, it''s not going to happen overnight,
    even a week. A good C++ coder has spent many years honing their craft, so be patient,
    start small and keep learning.'
