  - "[PAGE 39]\n\n# # Conditions and Loops\n\nConditions and loops are what makes\
    \ a program interesting; they can be simple or rather complex. How you use them\
    \ depends greatly on what the program is trying to achieve; they could be the\
    \ number of lives left in a game or just displaying a countdown.\n\n# ## TRUE\
    \ CONDITIONS\n\nKeeping conditions simple to begin with makes learning to program\
    \ a more enjoyable experience. Let's start then by checking if something is TRUE,\
    \ then doing something if it isn't.\n\n+   * STEP 1 We create a new Python program\
    \ that will ask the user to input a word, then check if it's a four-letter word\
    \ or not. Start with File -> New, and begin with the input:\n\n```\nword=input(\"\
    Please enter a four-letter word: \")\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_39_0.png)\n\
    \n+   * STEP 2 We now create a new variable, then use the function and pass the\
    \ word through it to get the total number of letters the user has entered:\n\n\
    ```\nword=input(\"Please enter a four-letter word: \")\nword_length=len(word)\n\
    ```\n\n![](img/a8d30135b233113405243b99e2d4c802_39_1.png)\n\n+   * STEP 4 The\
    \ colon at the end of if tells you that if the statement is true after the colon\
    \ indented. Next, move the cursor to the beginning of the Editor:\n\n```\nword=input(\"\
    Please enter a four-letter word: \")\nword_length=len(word)\nif word_length ==\
    \ 4:\n    print(\"is a four-letter word. Well done.\")\nelse:\n    print(\"is\
    \ not a four-letter word.\")\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_39_2.png)"
