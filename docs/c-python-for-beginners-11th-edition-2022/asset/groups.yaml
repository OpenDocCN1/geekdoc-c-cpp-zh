    - Errors are better than silence.

    - In the realm of doubt, it is better to ask than to guess.

    - Now is better than never.

    - Although is better than ugly.

    - If it''s hard to implement, it''s probably a bad idea.

    - If the implementation is not obvious, it''s probably a bad idea.

    - Don''t violate the great of Python.

