    ## Working with Variables


    STEP 5 However, you can''t combine strings and integer variables in the same command,
    as you need to convert one into the other or vice versa. When you try to combine
    both, you get an error message:


    print (name + age)


    ```python

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> Type "credits" or "license" for more information.

    >>> name="David"

    >>> age=44

    >>> type(name)

    ''str''

    >>> type(age)

    ''int''

    >>> print(name + age)

    TypeError: can only concatenate str (not "int") to str

    ```


    STEP 8 This presents a bit of problem when you want to work with a string and
    an integer. Instead, you need to convert it to:


    ```python

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    >>> Type "credits" or "license" for more information.

    >>> name="David"

    >>> age=44

    >>> type(name)

    ''str''

    >>> type(age)

    ''int''

    >>> print(name + age)

    TypeError: can only concatenate str (not "int") to str

    ```


    STEP 6 This is a process called typecasting.


    ```python

    print(name + str(age))

    ```


    STEP 9 This is also useful when dealing with floating point numbers. For:


    ```python

    >>> Type "credits" or "license" for more information.

    >>> name="David"

    >>> age=44

    >>> type(name)

    ''str''

    >>> type(age)

    ''int''

    >>> print(name + age)

    TypeError: can only concatenate str (not "int") to str

    ```


    STEP 7 Another example of typecasting is when you provide input from the user.


    ```python

    >>> float(input("How old are you "))

    ```


    STEP 10 This is worth noting that input always returns a string.


