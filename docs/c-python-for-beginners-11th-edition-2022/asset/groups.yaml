    \ coding is in place in the IDLE Editor as it is in the Shell, enabling you to\
    \ better understand what's on with your code. However, to execute the code you\
    \ need to first save it. Press F5 and you get a Save box.\n\n![](img/a8d30135b233113405243b99e2d4c802_25_0.png)\n\
    \n- **STEP 4**: Click on the OK button in the Save box and select a destination\
    \ where you'll save all your Python code. The destination can be a dedicated folder\
    \ called Python or you just dump it wherever like. Remember to keep a tidy drive\
    \ though, to help you out in the future.\n\n```python\nprint(\"Hello everyone!\"\
    )\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_25_1.png)\n\n## Saving and\
    \ Executing Your Code\n\nSTEP 5 Enter a name for your code, 'print hello' for\
    \ example, and click on the Save button. Once your Python is saved and executed\
    \ will be detailed in the IDLE Shell. In this case, the words 'Hello everyone!'\
    \ \n\nSTEP 8 Let's extend the code and enter a few examples from the previous\
    \ tutorial:\n\n```python\na=2\nb=2\nname=\"David\"\nsurname=\"Haywood\"\nprint(name,\
    \ surname)\nprint(a+b)\n```\n\nIf you press F5 now you'll be able to save the\
    \ file, again, as it's modified from before.\n\n![](img/a8d30135b233113405243b99e2d4c802_26_0.png)\n\
    \nSTEP 6 This is how the vast majority of your Python code will be conducted.\
    \ Enter it into the Editor, hit F5, save the code and look at the output in the\
    \ Shell. Sometimes times will differ, depending on whether you've requested a\
    \ separate window, but essentially this is the process that you will use throughout\
    \ this book, otherwise stated.\n\n![](img/a8d30135b233113405243b99e2d4c02_26_1.png)\n\
    \nSTEP 9 If you click the OK button, the file will be overwritten with the new\
    \ code entries, and executed with the output in the Shell. It's not a problem\
    \ with just these few lines, but if you edit a larger file, overwriting can become\
    \ an issue. Use File > Save As Within the Editor to create a copy.\n\n![](img/a8d30135b233113405243b99e2d4c802_26_2.png)\n\
    \nSTEP 7 If you open the file location of the saved Python code, you can see it\
    \ in a .py extension. Any code you create will be whatever and any code downloaded\
    \ from the network Python resources will be py. Just ensure that the code is written\
    \ for Python.\n\nSTEP 10 Create a new file. Close the Editor, and open a new instance\
    \ (File > New File from the Shell). Enter the following and save it hello:\n\n\
    ```python\na=\"Python\"\nb=\"15\"\nc=\"cool!\"\nprint(a, b, c)\n```\n\nYou will\
    \ use this in the next tutorial.\n\n![](img/a8d30135b233113405243b99e2d4c802_26_3.png)\n\
    \n# Executing Code from the Command Line\n\nAlthough we're working from the GUI\
    \ throughout this book, it's worth taking a look at Python's command line handling.\
    \ We already know there's a command line version of Python but it's also used\
    \ to execute code.\n\n## COMMAND THE CODE\n\nUsing the code in the previous tutorial,\
    \ the one we named hello.py, let's see how you can run code that was made in the\
    \ GUI at the command line level.\n\n- STEP 1: Python, in Linux, with two possible\
    \ ways of executing code via the command line. One of the ways is with Python\
    \ 2, whilst the others use the Python 3 libraries and so on. First though, drop\
