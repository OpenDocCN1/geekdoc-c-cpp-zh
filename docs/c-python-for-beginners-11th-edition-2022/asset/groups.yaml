    \ (default, Oct 19 2014, 13:31:11)\nType \"copyright\", \"credits\" or \"license\"\
    \ for more information.\nname=\"Hello\"\nHello\na=2\nprint(a*2)\nb=3\nprint(a+b)\n\
    5\n```\n\n## STEP 9\n\nIf we were to apply the same routine as before, using the\
