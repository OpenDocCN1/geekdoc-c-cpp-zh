    \n# STEP 9 The C++ compiler is far more intelligent than most programs give it\
    \ credit. While there are numerous data types you can declare for variables, you\
    \ in fact use the auto feature:\n\n```cpp\n#include <iostream>\nusing namespace\
    \ std;\nauto pi = 3.14159;\n```\n\n```cpp\nint main()\ndouble area, radius = 1.5;\n\
    area = pi * radius;\ncout << area;\n```\n\n# STEP 6 Specific to C++, you can also\
    \ use to assign values to a variable as soon as you declare\n\n```cpp\nint a =\
    \ 10;\nint b = 5;\n```\n\nThen, from C++11 standard, using curly brackets:\n\n\
    ```cpp\nint result = a+b;\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_68_2.png)\n\
    \nYou can create global variables, which are variables that are declared outside\
    \ any function and used within the entire code. What used so far are local variables:\
    \ variables used inside the function. For example:\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint StartLives = 3;\n```\n\n```cpp\nint main() {\nStartLives\
    \ = StartLives - 1;\ncout << StartLives;\n}\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_68_3.png)\n\
    \n# STEP 10 A couple of new here: first, auto work until you go to Settings >\
    \ Compiler and the tick box labeled 'Use C++11 Standard' is checked. Then the\
    \ new data type, double, which means double-precision floating point C++11, will\
    \ build and run code. The result will be 7.0658.\n\n![](img/a8d30135b233113405243b99e2d4c802_68_4.png)\n\
    ![](img/a8d30135b233113405243b99e2d4c802_68_5.png)\n\n# C++ Fundamentals\n\n##\
    \ Data Types\n\nVariables, as we've seen, store information that the programmer\
    \ can later call up, and manipulate if required. Variables are simply reserved\
    \ memory locations that store the values the programmer assigns, depending on\
    \ the data type used.\n\n## THE VALUE OF DATA\n\nThere are many data types available\
    \ for the programmer in C++, such as integer, floating, Boolean, character and\
    \ so on. It's widely accepted that there are seven basic data types, however you\
    \ can create your own Primitive Built-in Types arise within your code.\n\nThe\
    \ seven basic data types are incredibly accurate numbers but those numbers are\
    \ only accurate up the fifteenth decimal place. There's also the problem with\
    \ displaying such numbers in C++ using the cout function, in that cout by default\
    \ shows the first five decimal places. You can combat this by adding a cout.precision()\
    \ inside the brackets, but then you're still limited by the accuracy of the double\
    \ data type. For example, try this code:\n\n| TYPE | COMMAND |\n|---|---|\n| Integer\
    \ | Integer |\n| Floating Point | float |\n| Character | char |\n| Boolean | bool\
    \ |\n| Double Floating Point | double |\n| Wide Character | char_t |\n| No Value\
    \ | void |\n\n```cpp\n#include <iostream>\nusing namespace std;\ndouble PI = 3.14159265385973238463;\n\
    \nint main() {\n\tcout << PI;\n}\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_69_0.png)\n\
    \nThese basic types can also be extended using the following modifiers: Long,\
    \ Short and Unsigned. Basically these the modifiers can expand the minimum and\
    \ maximum range values for each data type. For example, the int data type has\
    \ a default range of -2147483648 to 2147483647, a fair value, you would use.\n\
    \nNow, if you were to use one of the modifiers, the range extends\nUnsigned int\
    \ = 0 to 4294967295\nLong int = -2147483648 to 2147483647\nShort int = -32768\
    \ to 32767\nLong int = -2147483648 to 2147483647\nSigned long = -2147483648 to\
    \ 2147483647\nUnsigned long = 0 to 4294967295\n\nNaturally you can get away with\
    \ any basic type without the modifier, as there's plenty of range width with each\
    \ data type. However, it's considered good C++ programming practice to use the\
    \ modifiers when possible.\n\nThere are issues when using modifiers double. Double\
    \ represents a double-floating point type, which you can use for\n\n70 | www.cppprogrammingpublications.com\
    \ | *\n"
  mdcn: "\n\n# C++ 注释\n\n在 C++ 中注释涉及使用双正斜杠 `//` 或正斜杠加星号 `/*`。你可能已经见过一些简短的示例，但下面是它们的工作原理。\n\
    \n- 步骤 1 以 Hello World 代码为例，你可以轻松地使用双正斜杠对代码的不同部分进行注释：\n\n```cpp\n// 我的第一个 C++\
    \ 程序\ncout << \"Hello, world!\\n\";\n\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    // 我的第一个 C++ 程序\n    cout << \"Hello, world!\\n\";\n}\n```\n\
    \n- 步骤 4 编写注释时要格外小心，尤其是使用块注释时。很容易忘记添加结束的星号，从而导致注释块内的任何代码都失效。\n\n```cpp\n// HelloWorld\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    cout << \"Hello,\
    \ world!\\n\";\n    cout << \"And greetings from C++\";\n    // 覆盖几行\n    cout\
    \ << \"This line is now being ignored by the compiler!\";\n}\n```\n\n- 步骤 2 你也可以注释掉代码行的末尾部分，以便更好地描述正在发生的情况：\n\
    \n```cpp\ncout << \"Hello, world!\\n\"; // 这行输出单词 'Hello, world!'。 // \\n 增加了一个换行。\n\
    ```\n\n注意，你不需要在注释末尾加分号。因为这是编译器会忽略的一行代码。\n\n- 步骤 5 如果你明显尝试并意图注释掉它，它会报错，由于代码末尾缺少闭合括号\
    \ `]`，如果你犯了几次这种错误，那么回去纠正将非常耗时。坦率地说，CodeBlocks 中的注释代码可以帮助你理解注释：\n\n```cpp\n// HelloWorld\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    // 修复\n    cout\
    \ << \"Hello, world!\\n\";\n    cout << \"And greetings from C++\";\n    // 这条注释可以覆盖几行\n\
    \    // 无需添加更多行\n    cout << \"This line is now being ignored by the compiler!\"\
    ;\n}\n```\n\n- 步骤 3 你也可以使用正斜杠和星号来注释几行：\n\n> /* 这条注释可以覆盖几行，而无需添加更多斜杠 */\n\n只需记住用相反星号和正斜杠来结束注释块即可。\n\
    \n- 步骤 6 如果你想要进行注释，在 C++ 中良好的做法是在注释块的每一行都添加一个星号。这也有助于你在继续后续操作之前记住该注释块：\n\n> /*\
    \ 这条注释可以覆盖几行，而无需添加更多斜杠 */\n\n```cpp\nint main() {\n    // 我的第一个 C++ 程序\n    cout\
    \ << \"Hello, world!\\n\";\n    cout << \"And greetings from C++\";\n    // 这条注释可以覆盖几行\n\
    \    // 无需添加更多斜杠 /\n    cout << \"This line is now being ignored by the compiler!\"\
    ;\n}\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_66_0.png)\n![](img/a8d30135b233113405243b99e2d4c802_66_1.png)\n\
    \n# C++ 基础\n\n## 变量\n\n与 Python 相比，使用 C++ 时变量略有不同，你可以简单地说 'a' 等于 10 并赋值一个变量。然而，在\
    \ C++ 中，变量在使用之前必须先用其类型进行声明。\n\n## 变量的声明\n\n你可以通过代码中的语句来声明 C++ 变量。你可以声明好几种不同类型的变量。以下是其工作原理。\n\
