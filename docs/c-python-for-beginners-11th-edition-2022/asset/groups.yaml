    # C++ Fundamentals


    # # Structure of a  C++ Program


    C++ has a very defined structure and way of doing things. Miss something out,
    even as small as a semicolon, and your entire program will fail to be compiled
    and executed. Many professional programmers have fallen foul of sloppy structure.


    # # INCLUDE <C++ STRUCTURE>


    Learning the basics of programming, begin to understand the structure of a program.
    The commands may be different from one language to the next, but you will start
    to see how the code works.


    | C++ | Start here | *helloworld.cpp |

    | --- | --- | --- |

    | C++ was invented by Danish student Bjarne Ststrup in 1979, as part of his Ph.D.
    thesis. Initially C++ was called C with Classes, which added features to the popular
    C programming language, while making it a more user-friendly environment through
    a structure. | 1 | #include <iostream> |

    | | 2 | |

    | | 3 | |

    | | 4 | |

    | | 5 | |


    Bjarne Ststrup, inventor of C++.


    # # INT MAIN()


    int main() initiates the declaration of a function, which is a group of code statements
    under the name ''main''. All C++ code begins at the main function, regardless
    of where it actually lies within the code.


    | Start here | *helloworld.cpp |

    | --- | --- |

    | 1 | #include <iostream> |

    | 2 | |

    | 3 | int main() { |

    | 4 | } |

    | 5 | |

    | 6 | |


    # # BRACES


    The open brace (curly brackets) is something that may not have come across before,
    especially if you''re used to Python. The open brace indicates the beginning of
    the main function and contains all the code that belongs to that function.


    | #include <iostream> |

    | --- |

    | int main() { |

    | } |


