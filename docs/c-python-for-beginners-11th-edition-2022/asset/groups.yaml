    We''ve seen some examples of variables in our Python code but it''s always worth
    going through the way they operate and how Python creates and assigns values to
    a variable.


    ### VARIOUS VARIABLES


    You''ll be working with the Python 3 IDLE Shell in this tutorial. If you haven''t
    already, open Python 3 or close down the previous IDLE Shell to clear up any code.


    - STEP 1 In some programming languages you''re required to use a dollar sign to
    denote a string, which is a variable made up of multiple characters, such as a
    name of person. In Python this is not necessary. For example, in the Shell enter:
    name="David" (or use your own name, unless you are David Howard).


    - STEP 3 You''ve seen previously that variables can be concatenated using the
    plus symbol between the variables names. In our example we can use: print(name
    + " " + title) to add a comma and a space, as variables are connected without
    spaces, so we need to add them manually.


    ![](img/a8d30135b233113405243b99e2d4c802_33_0.png)


    ```python

    Python 3.2 Shell

    Python 3.4 (default), Oct 19 2014, 13:21:11

