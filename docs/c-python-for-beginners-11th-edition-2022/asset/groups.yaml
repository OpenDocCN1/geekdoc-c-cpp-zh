    窗口中填充了许多建议，但你需要点击的是第一个，Xcode。


    - **步骤 3** 当你准备好时，点击“获取”（Get）按钮，然后将变为“安装应用”（Install App）。输入你的 Apple ID，Xcode 开始下载并安装。取决于你的网络连接速度，可能需要一些时间。


    ![](img/a8d30135b233113405243b99e2d4c802_51_0.png)


    - **步骤 2** 花些时间浏览应用的信息，包括兼容性，以确保你拥有正确的 macOS 版本。Xcode 需要 macOS 10.12.6 或更高版本才能安装和运行。


    ![](img/a8d30135b233113405243b99e2d4c802_51_1.png)


    - **步骤 4** 安装完成后，点击“打开”（Open）按钮启动 Xcode。点击“同意”（Agree）许可条款并输入你的密码允许 Xcode 更改系统。完成后，Xcode
    开始安装额外的组件。


