    Thankfully, Python is a multi-platform programming language available for Windows,
    macOS, Linux, Raspberry Pi and more. If you have one of those systems, then you
    can easily start using Python.


    ![](img/a8d30135b233113405243b99e2d4c802_9_0.png)


    # ### COMPUTER


    Obviously you''re going to need a computer in order to learn how to program in
    Python and test your code. You can use Windows (from XP onward) on either a 32
    or 64-bit processor, an Apple Mac or Linux installed.


    # ### IDE


    An IDE (Integrated Developer Environment) is used to enter and execute Python
    code. It enables you to inspect your program code and the values within the code,
    as well as offering advanced features. There are many different IDEs, so find
    the one that works for you and gives you the best results.


    # ### PYTHON SOFTWARE


    macOS and Linux already come with Python preinstalled as part of the operating
    system, as the Raspberry Pi. However, you need to ensure that you''re running
    the latest version of Python. Windows users need to download and install Python,
    which''ll come shortly.


    ![](img/a8d30135b233113405243b99e2d4c802_9_1.png)


    # ### TEXT EDITOR


    A text editor is an ideal environment to enter code into, it''s not an absolute
    necessity. You can enter and execute code directly from the IDLE but a text editor,
    such as Sublime Text or Notepad++, offers more advanced Features and color coding
    when you''re entering code.


    # ### INTERNET ACCESS


    Python is an ever evolving environment and as new versions often introduce new
    concepts or change existing methods and code structure to make it a more efficient
    learning. Access to the internet will help you update-to-date, help when you get
    stuck and get access to Python''s immense number of modules.


    # ### TIME AND PATIENCE


    Despite whatever books may lead you to there, you won''t be a programmer in 24-Hours.
    Learning to code in Python takes time, and patience. You may get stuck at times
    and then the code will flow like water. Understand that you''re learning entirely
    new, and yet you will get there.'
