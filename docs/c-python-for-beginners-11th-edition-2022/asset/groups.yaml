    ## 为什么选择 C++？


    安装 - Visual Studio Community 2017 (15.0.26223.1)，一个异步


    | 工作负载 | 独立组件 | 语言包 |

    | :--- | :--- | :--- |

    | Windows (3) | - 通用 平台 | 使用 C#、JavaScript 或可选 C++ 为通用平台创建应用程序 |

    | | - 使用 C++ 的桌面开发 | 使用 Visual C++、boost、ATL 以及 MFC 等功能构建经典的 Windows 应用程序 |

    | | - .NET 开发 | 使用 .NET Framework 构建 Windows Forms 和控制台应用程序 |

    | Web 与云 (4) | - ASP.NET 和 Web 开发 | 使用 ASP.NET Core、HTML、JavaScript 和 CSS 构建 Web
    应用程序 |

    | | - Azure 开发 | Azure SQL 以及用于部署云应用和创建资源的项目 |

    | | - Node.js 开发 | 使用 Node.js（一种事件驱动的 JavaScript 运行时）构建可扩展的网络应用程序 |

    | | - 数据存储和处理 | 使用 SQL Server、Azure Data Lake、HDInsight 或 Azure ML 连接、开发和测试数据
    |


    ## 总结


    - Visual C++ 核心开发功能

    - 可选

    - VC++ 2017 v14 工具集 (x86)

    - C++ 性能分析工具

    - Visual C++ for Mobile (10.0.14819.0)

    - Visual C++ for ATL

    - Windows XP 支持 C++

    - 通用 C++ URT SDK

    - C++/CLI 支持

    - 标准库

    - IntelliSense


    ![](img/a8d30135b233113405243b99e2d4c802_46_0.png)


    ## Visual Studio 是学习 C++ 的极佳且免费的环境。其他语言深度混合（在函数层面），NASA、SpaceX 和 CERN 等机构使用 C++
    用于各种应用程序、程序、控制和其他计算工具。


    C++ 也非常高效，作为核心语言更简单的替代方案，其性能出色。它优于 Python、BASIC 等语言的高性能，使其成为现代计算的理想开发环境，因此上述公司广泛使用它。


    虽然 Python 是一门很好的编程语言，但 C++ 带带你进入一个更广阔的编程世界。通过掌握 C++，你可以发现自己正在为微软、苹果等公司编写代码。通常情况下，由于多功能性，C++
    开发者的薪水比其他开发者高。C++ 程序员可以在语言和公司之间移动，而不需要重新思考任何特定内容。然而，如果你对 Python 编程感到不适，我们建议从 C++
    开始，花些时间熟悉编程结构以及通过编程解决问题的许多方法。一旦你让计算机“听话”并单手背在身后就能写出 Python 程序了，再转到 C++。当然，没有什么可以阻止你深入研究
    C++；如果你觉得能胜任这项任务，尽管去尝试。


    入门 C++ 和 Python 一样简单，但你需要一套正确的工具来用 C++ 与计算机通信，就可以开始你的旅程了。C++ IDE 是免费的，甚至下载和使用也免费。你可以从任何操作系统进入
    C++，无论是 macOS、Linux 还是 Windows 移动平台。


    就像 Python 一样，回答“为什么 C++ 是答案”这个问题：因为它速度快、高效，而且你经常使用的多数应用程序都是由它开发的。它是一门前沿的、非常值得掌握的语言。


    ![](img/a8d30135b233113405243b99e2d4c802_46_1.png)


    ## C++ 设置


    大多数（如果不是所有）操作系统代码中都包含 C++，因此理理，无论你目前使用什么操作系统，都可以学习用 C++ 。


    ![](img/a8d30135b233113405243b99e2d4c802_47_0.png)


    - 计算机

    除非你喜欢在纸上手写你的 C++ 代码（这是很多老程序员以前会做的事），否则计算机是绝对不可少的组件。PC 用户拥有任何最近的 Linux 发行版或 Windows
    操作系统；Mac 用户拥有最新的 macOS。


    - IDE

    就像 Python 一样，IDE 用于输入和执行你的 C++。许多 IDE 带有扩展和插件，可以帮助它运行得更好，或增加额外的功能层。通常，IDE 会根据所使用的操作系统提供增强，例如针对
    Windows 10 的增强。


    - 编译器

    编译器是一个将 C++ 语言转换为二进制文件的程序，以便计算机理解。一些 IDE 内置了编译器，另一些没有。CodeBlocks 是我们喜欢的 IDE，作为软件包的一部分带有一个
    C++ 编译器。稍后会介绍。


    - 文本编辑器

    有些程序员倾向于在通过编译器运行之前使用文本编辑器来汇编他们的 C++ 代码。本质上，你可以使用任何文本编辑器编写代码，只需将其保存为 .cpp 扩展名即可。然而，Notepad++
    是可用最佳文本编辑器之一。


    ![](img/a8d30135b233113405243b99e2d4c802_47_1.png)


    - 互联网

    虽然学习编程是完全可能的，但你需要访问互联网。


    - 时间和耐心

    是的，对于 C++，你将在上面花费大量时间。


    ## 特定操作系统的需求


    - LINUX

    Linux 用户很幸运，因为他们的操作系统中已经内置了编译器。


    - WINDOWS

    Windows 最佳的 IDE 是微软的 Visual Studio。


    - 树莓派

    树莓派操作系统是 Raspian。


    - MAC

    Mac 用户将需要安装 Xcode 才能能够。


    ## 在 Windows 中设置 C++


    用户在用 C++ 编程时有大量的选择。有许多 IDE 和编译器可用，包括微软的 Visual Studio。然而，在我们看来，最适合入门的 C++ IDE
    是 CodeBlocks。


    ## CODE::BLOCKS


    CodeBlocks 是一个免费的 C++、C 和 Fortran IDE，功能丰富且易于通过插件扩展。它易于使用，带有一个编译器，并且背后有一个活跃的社区。


    - 第一步

    首先访问 CodeBlocks 下载网站：www.codeblocks.org/downloads。从那里开始，点击“Download the binary
    releases”（下载二进制发布版）链接以下载适用于 Windows 的版本。


    - 第二步

    你可以看到有几个版本可用。需要下载位于当前版本号结尾的 ''mingw-setup.exe''。区别在于 mingw-setup 版本包含了 C++ 编译器和调试器
    TDM-GCC（套件）。


    - 第三步

    当你定位到文件时，点击行末尾的 Sourceforge.net 链接下载并保存可执行文件到你的 PC。找到已下载的 CodeBlocks 安装程序并双击开始。按照屏幕上的指令进行安装。


