    \ variables. The curly brackets, enter:\n\n- STEP 4 Naturally can you declare\
    \ a new variable, call it result and output some simple arithmetic.\n\n```cpp\n\
    int a;\nint b;\na = 10;\nb = 5;\n```\n\n```cpp\nresult = a + b;\ncout << result;\n\
    ```\n\nInsert the above into the code as per screenshot.\n\n```cpp\n#include <iostream>\n\
    using namespace std;\nint main() {\n\nint a;\nint b;\na = 10;\nb = 5;\nresult\
