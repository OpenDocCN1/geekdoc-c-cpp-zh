    # Other C++ IDEs to Install


    If you want to try a different approach to working with your C++ code, then there
    are plenty of options available to you. Windows is the most prolific platform
    for C++ IDEs but there are plenty for Mac and Linux users too.


    ## DEVELOPING C++


    Here are great C++ IDEs that are worth looking into. You can install one or all
    of them if you like, but find the one that works best for you.


    **ECLIPSE** Eclipse is a hugely popular C++ IDE that offers the programmer a wealth
    of features. It has a great, clean interface, is easy to use and available for
    Windows, Linux and Mac. Head over to www.eclipse.org/downloads/ to download the
    latest version. If you''re stuck, check the Help Link for more information.


    **CODELITE** CodeLite is a free and open source IDE''s regularly updated and available
    for Windows, Linux and mac. It''s lightweight, replicated and extremely powerful.
    You can find out more information as well as how to download and install it at
    www.codelite.org/


    ![](img/a8d30135b233113405243b99e2d4c802_55_0.png)


    ![](img/a8d30135b233113405243b99e2d4c802_55_1.png)


    **GNAT** The GNAT Programming Studio (GNPS) is a powerful and intuitive IDE that
    supports testing, debugging and code analysis. The Community Edition is free,
    whereas the Pro version is available for Windows, Mac, Linux and even for the
    Raspberry Pi. You can find it at www.adore.com/download.


    **NETBEANS** Another popular choice is NetBeans. This is another excellent IDE
    that''s packed with Features and a pleasure to use. NetBeans IDE includes project
    templates for C++ that give you the ability to build applications with dynamic
    and static libraries. Find out more at www.netbeans.org/features/cpp/index.html.


    ![](img/a8d30135b233113405243b99e2d4c802_55_2.png)


    ![](img/a8d30135b233113405243b99e2d4c802_55_3.png)


    ## VISUAL STUDIO


    Microsoft''s Visual Studio is a mammoth C++ IDE that allows you to create applications
    for Windows, Android, iOS and the web. The Community version is free to download
    and install but the other versions offer a free trial period. Go to www.visualstudio.com/
    to see what it can do.


    ## ANJUTA


    The Anjuta DevStudio is a Linux-only IDE that features some of the more advanced
    features found in paid software development tool. There''s a GUI designer, source
    editor, app wizard, interactive debugger and much more. Go to www.anjuta.org/
    for more information.


    ![](img/a8d30135b233113405243b99e2d4c802_56_0.png)


    ![](img/a8d30135b233113405243b99e2d4c802_56_1.png)


    ## QT CREATOR


    This cross-platform IDE is designed to create C++ applications for desktop and
    mobile environments. It comes with a code editor and integrated tools for testing
    and debugging, as well as a deployment platform. It is not free but there is a
    trial period on before requiring: www.qt.io/qt-libraries-apis-tools-and-ide/.


    ## MONODEVELOP


    This excellent IDE allows developers to write C++ for desktop and web applications
    across all the platforms. There''s an advanced text editor, integrated debugger,
    and a configuration tool to help you create your code. It is available for Windows,
    Mac and Linux and is free to download: www.monodevelop.com/


    ![](img/a8d30135b233113405243b99e2d4c802_56_2.png)


    ![](img/a8d30135b233113405243b99e2d4c802_56_3.png)


    ## DEV++


    Bloodes Dev C++, despite its colourful name, is an older IDE for Windows systems
    only. However, many praise its clean interface and unanticipated way of coding
    and compiling. Although not been updating for some time, it is one to consider
    if you want something different: www.blood.net/devcpp.


    ## U++


    Ultimate++ is a cross-platform C++ IDE that boasts a rapid development of code
    with the smart and elegant use of ++++. For the novice, it is a beast of an IDE
    but behind its complexity, its beauty would make a developer''s knees wobble.
