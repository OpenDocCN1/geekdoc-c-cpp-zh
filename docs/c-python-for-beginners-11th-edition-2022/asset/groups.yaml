    - Python is one tool.

    - There are many ways to do something, but one is better.

    - If you get confused, ask for forgiveness.

    - The only way to get over nested code is to refactor it flat.

    - Readable code is better than implicit code.

    - If you''re thinking about doing an optimization, do it first.


    ## HIGH-LEVEL LANGUAGES


    Computer languages that are easy to read are known as "high-level". This is because
