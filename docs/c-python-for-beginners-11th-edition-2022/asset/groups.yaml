    # 你需要的设备


    学习 Python 只需极少的硬件或初始资金投入。你不需要一台性能极其强大的计算机，而且所需的软件都是免费提供的。


    ## 我们正在使用的工具


    幸运的是，Python 是一种多平台编程语言，适用于 Windows、macOS、Linux、树莓派（Raspberry Pi）等。如果你拥有这些系统之一，就可以轻松地开始使用
    Python。


    ![](img/a8d30135b233113405243b99e2d4c802_9_0.png)


    ### 电脑


    显然，你需要一台电脑来学习如何用 Python 编程并测试你的代码。你可以使用 Windows（XP 及以后版本）的 32 位或 64 位处理器，或者是 Apple
    Mac 或安装了 Linux 的系统。


    ### IDE


    IDE（集成开发环境）用于输入和执行 Python 代码。它允许你检查程序代码以及代码中的值，并提供许多高级功能。有许多不同的 IDE，请找到最适合你并能给你带来最佳结果的那个。


    ### PYTHON 软件


    macOS 和 Linux（以及树莓派）已经作为操作系统的一部分预装了 Python。然而，你需要确保你运行的是最新版本的 Python。Windows 用户需要下载并安装
    Python，这很快就会提供。


    ![](img/a8d30135b233113405243b99e2d4c802_9_1.png)


    ### 文本编辑器


    文本编辑器是输入代码的理想环境，但并不是绝对必要的。你可以直接从 IDLE 输入并执行代码，但像 Sublime Text 或 Notepad++ 这样的文本编辑器在输入代码时提供了更高级的功能和颜色高亮。


    ### 互联网访问


    Python 是一个不断演进的环境，新版本经常引入新概念或更改现有的方法和代码结构，以使学习更高效。访问互联网将帮助你保持与同步，在你卡住时提供帮助，并访问
    Python 海量的模块。


    ### 时间与耐心


    无论这些书籍将你带向何方，你都不会在 24 小时内成为一名程序员。学习 Python 编程需要时间和耐心。你有时可能会遇到瓶颈，然后代码就会像水一样顺畅。请理解，你正在学习完全全新的知识，但你终会成功的。


    ## 树莓派


    为什么要用树莓派？树莓派是一种微型电脑，购买价格非常便宜，但为用户提供了一个极佳的学习平台。它的主操作系统 Raspbian 预装了最新的 Python 以及许多模块和附加功能。


    树莓派


    树莓派 3 是最新版本，包含了更强大的 CPU、更大的内存以及 Wi-Fi 和蓝牙支持。你可以根据感兴趣的套件，以 32 英镑购买一台树莓派，或者以 50
    英镑以上的套件购买。


    ![](img/a8d30135b233113405243b99e2d4c802_10_0.png)


    FUZE 项目


    FUZE 是建立在最新型号树莓派之上的学习环境。你可以购买带有电子套件的工作站，甚至还有一个机器人臂供你构建和编程。你可以在 www.fuze.com 找到更多关于
    FUZE 的信息。


    ![](img/a8d30135b233113405243b99e2d4c802_10_1.png)


    书籍


    ![](img/a8d30135b233113405243b99e2d4c802_10_2.png)


    我们通过 bdmpublications.com 提供了许多优秀的编程类书籍。我们的树莓派书籍涵盖了如何购买第一台树莓派、设置并使用它；还有一些优秀的分步骤项目示例和指南，帮助你充分利用树莓派的功能。


    ![](img/a8d30135b233113405243b99e2d4c802_10_3.png)


    RASPBIAN


    树莓派的主操作系统是一个 Debian-Linux 发行版，包含了今天你所需的一切且易于使用。它针对树莓派进行了优化，是硬件软件项目、Python 编程甚至作为桌面电脑的理想平台。


    ![](img/a8d30135b233113405243b99e2d4c802_10_4.png)


    # 向 Python 问好


    了解 Python


    Python 是有以来最伟大的计算机编程语言。它让你能够用简洁且易于理解的语言充分利用计算机的力量。


    ## 什么是编程？


    在尝试学习一种语言之前，了解什么是编程语言是有帮助的，看看 Python 是如何产生的以及它与其他语言的关系也是不错的。


    ## 编程食谱


    编程语言是计算机遵循的指令列表。这些指令可以像食谱一样简单，也可以像音乐文件或构建整个世界一样复杂。Python 是由 Guido van Rossum 在
    20 世纪 80 年代后期在荷兰数学与信息中心 (CWI) 构想的语言。


    为什么有两个？Python 2 于 2000 年发布，从以后吸收了大量的模块、脚本、教程等。多年来，Python 2 已成为初学者和专家编写代码的首选编程语言之一，使其成为一个极具价值的资源。


    树莓派的主操作系统是一个 Debian-Linux 发行版，包含了今天你所需的一切且易于使用。它针对树莓派进行了优化，是硬件软件项目、Python 编程甚至作为桌面电脑的理想平台。


    树莓派的主操作系统是一个 Debian-Linux 发行版...


    ## Python 之禅


    这背后是一种被称为“Python 之禅”的哲学。这是一个包含 20 条影响设计的原则的集合。这些原则包括：

    - 漂亮优于丑陋。

    - 简单优于复杂。

    - 显式优于隐式。

    - 可读性非常重要。

    - 扁平优于嵌套。

    - 稀疏优于密集。

    - 某事应该只有一种——最好只有一种——方法。

    - 如果可能出现特殊显而易见的情况，请显式地处理它们。

    - 简单优于复杂。

    - 复杂优于隐式。

    - 可读性优于晦涩。

    - 错误优于意外。

    - 在模糊时，请求许可比猜测要好。

    - 现在优于从不。

    - 尽管优于丑陋。

    - 如果实现困难，那可能是一个坏主意。

    - 如果实现不明显，那可能是一个坏主意。

    - 不要违反 Python 之则。

    - 即使你为了实现规则而违反它们，也请解释原因。

    - Python 是为了诗意。

    - 命名永远是错误的。

    - 命名应该。

    - 命名很重要。

    - 命名应该在命名空间内。

    - Python 是一种工具。

    - 某事有许多方法，但一种方法更好。

    - 如果你感到困惑，请求原谅。

    - 解决嵌套代码的唯一方法是将其扁平化。

    - 可读代码优于隐式代码。

    - 如果你正在考虑优化，请先重构。


    ## 高级语言


    易于阅读的计算机语言被称为“高级语言”。这是因为它们位于硬件之上，而汇编被视为“低级”。


    ## Python 3 VS Python 2


    在典型的计算场景中，Python 因为两个活跃版本的存在而变得复杂：Python 2 和 Python 3。


    为 Windows 下载最新版本


    不知道用哪一个？这里有关于 Python 2 和 3 之间的更多信息。

    寻找其他系统的 Python？Windows 版、Linux/Unix 版

    想帮助开发最新版本的 Python？预发布版


    2008 年，Python 引入了若干项新且增强的功能。这些功能提供了更稳定、有效且高效的编程环境，但说，大多数（如果不是全部）新功能最初并不受欢迎，自从
    Python 3 推出以来，情况一直在变化。


    ##3.X 的胜利


    Python 3 日益增长的普及使得现在开始学习使用新功能进行开发并逐步淘汰旧版本是明智之举。许多开发公司，如 SpaceX 和 NASA 使用 Python
    3 编写重要的代码片段。


