    ![](img/a8d30135b233113405243b99e2d4c802_64_3.png)\n\n# 使用注释\n\n虽然注释对于构成游戏、应用程序甚至操作系统的代码行似乎是一个微小的元素，但事实上它们可能是最重要的部分。\n\
    \n## 注释的重要性\n\n代码内部的注释是人类可读的描述，详细说明代码在特定点正在做什么。它们对执行没有特殊影响，但没有注释的代码是最令人沮丧区域之一。简而言之，代码应该以有效地描述行、部分或单个元素的方式进行注释。当你编写给一个完全不懂编程的人看时，他们可以通过阅读你的注释来获取代码并理解它将做什么。\n\
    \n在专业环境中，注释对代码成功至关重要。在组织中，许多程序员与工程师、其他开发者、硬件分析师和软件测试人员组成团队工作。如果你是编写软件的团队成员，当出现问题时，你的注释将帮助其他团队成员获取并追踪线索以定位问题。把自己想象成一个需要扫描超过\
    \ 6 万行代码、跨越不同模块的角色，你可以看到原始程序员通过良好的注释形式所提供的帮助。\n\n最好的注释是简洁的，并结合代码逻辑，详细说明程序遇到该行或部分时发生了什么。你不需要对每一行都进行注释。像\
    \ `if x=0` 这样的内容不需要注释“如果 x 等于零则执行某事”，因为这对读者来说显而易见。然而，如果等于零会极大地改变程序对用户的影响，那么它就确实需要被注释。\n\
    \n即使你是独自工作，也应该像与他人分享一样编写注释。这可以帮助你编写代码并始终理解你做了什么或哪里错了。\n\n注释是良好的习惯，一旦你学会如何将它们添加到代码中，如果它成为你的本能，你将会需要它。\n\
    \n"
