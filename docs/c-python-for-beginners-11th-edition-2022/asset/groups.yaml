  - "[PAGE 66]\n\n# C++ COMMENTS\n\nCommenting in C++ involves using a double forward\
    \ slash '/', or a forward slash and an asterisk, '/*'. You've already seen some\
    \ brief examples but this is how they work.\n\n+   STEP 1 Using the Hello World\
    \ code as an example, you can easily comment on different sections of the code\
    \ using the double forward slash:\n\n```\n// My first C++ program\ncout << \"\
