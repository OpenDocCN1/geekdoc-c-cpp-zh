- md: "\n# C++ COMMENTS\n\nCommenting in C++ involves using a double forward slash\
    \ '/', or a forward slash and an asterisk, '/*'. You've already seen some brief\
    \ examples but this is how they work.\n\n- STEP 1 Using the Hello World code as\
    \ an example, you can easily comment on different sections of the code using the\
    \ double forward slash:\n\n```cpp\n// My first C++ program\ncout << \"Hello, world!\\\
    n\";\n\n#include <iostream>\nusing namespace std;\n\nint main() {\n    // My first\
    \ C++ program\n    cout << \"Hello, world!\\n\";\n}\n```\n\n- STEP 4 Be careful\
    \ when commenting, especially with block comments. It's very easy to forget to\
    \ add the closing asterisk and thus negate any code that falls inside the comment\
    \ block.\n\n```cpp\n// HelloWorld\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n    cout << \"Hello, world!\\n\";\n    cout << \"And greetings\
    \ from C++\";\n    // cover several lines\n    cout << \"This line is now being\
    \ ignored by the compiler!\";\n}\n```\n\n- STEP 2 You can also comment out an\
    \ end part of a line of code, to describe in a better way what's going on:\n\n\
    ```cpp\ncout << \"Hello, world!\\n\"; // This line outputs the words 'Hello, world!'.\
    \ // The \\n adds a new line.\n```\n\nNote, you don't need to put a semicolon\
    \ at the end of a comment. This is because it's a line that the compiler ignores.\n\
    \n- STEP 5 If you obviously try and intend to comment out it errors, out of a\
    \ missing closing bracket ']' off the end of the code, if you made the error a\
    \ few times, then it can be consuming to go back and rectify. Frankly, the commenting\
    \ code in CodeBlocks helps you understand comments from:\n\n```cpp\n// HelloWorld\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n    // fix the\n  \
    \  cout << \"Hello, world!\\n\";\n    cout << \"And greetings from C++\";\n  \
    \  // This comment can cover several lines\n    // without the need to add more\
    \ lines\n    cout << \"This line is now being ignored by the compiler!\";\n}\n\
    ```\n\n- STEP 3 You can also comment several lines by using the forward slash\
    \ and asterisk:\n\n> /* This comment can cover several lines without the need\
    \ to add more slashes */\n\nJust remember to finish the comment block with the\
    \ opposite asterisk and forward slash.\n\n- STEP 6 If you're looking to comment,\
    \ it's good practice in C++ to add an asterisk to each line of the comment block.\
    \ This also helps you to remember the comment block before continuing with the\
    \ following:\n\n> /* This comment can cover several lines without the need to\
    \ add more slashes */\n\n```cpp\nint main() {\n    // My first C++ program\n \
    \   cout << \"Hello, world!\\n\";\n    cout << \"And greetings from C++\";\n \
