    print(b)\n```\n\n```\nPython 3.4.2\nPython 3.4.2 (default, Oct 19 2014, 13:31:11)\n\
    Type \"copyright\", \"credits\" or \"license\" for more information.\nname=\"\
    Hello\"\nprint(name)\na=2\nprint(a*2)\nb=3\nprint(a+b)\nprint(a-b)\nprint(a/b)\n\
    ```\n\n## STEP 8\n\nNow let's add a surname:\n\n```python\nsurname=\"Haywood\"\
    \nprint(surname)\n```\n\nYou have two variables now a first name and surname and\
