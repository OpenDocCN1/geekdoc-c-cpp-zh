    \ Oct 19 2014, 13:31:11)\nType \"copyright\": \"credits\" or \"license\" for more\
    \ information.\n>>> print(\"Hello\")\nHello\n```\n\n- STEP 2: Just as predicted,\
    \ the word Hello appears in the Shell as text, indicating output from a string.\
    \ It's fairly straightforward and doesn't require too much explanation. Now try:\n\
    \n```python\nprint(\"2*2\")\n```\n\n- STEP 3: You can see that instead of the\
    \ number 4, the output is the 2+2 you asked to be printed to the Shell. The question\
    \ marks are defining what's being outputted to the IDLE Shell; try:\n\n```python\n\
    print(2+2)\n4\n```\n\n```\nPython 3.4.2 Shell\nPython 3.4.2 (default, Oct 19 2014,\
    \ 13:31:11)\nType \"copyright\": \"credits\" or \"license\" for more information.\n\
    >>> print(2+2)\n4\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_23_0.png)\n\
    \n- STEP 4: You can continue as such, printing 2+2, 464*2344 and so on to the\
    \ Shell. An easier way is to use a variable, which is something we will cover\
