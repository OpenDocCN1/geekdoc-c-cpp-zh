    ![](img/a8d30135b233113405243b99e2d4c802_64_2.png)\n![](img/a8d30135b233113405243b99e2d4c802_64_3.png)\n\
    \n# Using Comments\n\nWhile comments may seem like a minor element to the lines\
    \ of code that combine to make a game, application or even an operating system,\
    \ in fact they are probably one of most important.\n\n## THE IMPORTANCE OF COMMENTING\n\
    \nComments inside code are human readable descriptions that detail what the code\
    \ is doing at that particular point. They don't especially impact but code without\
    \ comments is one of most frustrating areas unless you're professional or just\
    \ starting out. In short, code should be commented in a manner to effectively\
    \ describe the purpose of a line, section, or individual elements. When you get\
    \ to commenting as much as someone who doesn't know anything about programming\
    \ you can pick up your code and understand what it's going to do by reading your\
    \ comments.\n\nIn a professional environment, comments are vital to the success\
    \ of the code. In an organization, many programmers work in teams of engineers,\
    \ other developers, hardware analysts and software testers. If you're part of\
    \ the team that's writing software your comments help to tell if something goes\
    \ wrong, another team member has to pick up and follow the trail to pinpoint the\
    \ issue. Place yourself in the shoes of someone whose job is to find out what\
    \ your program has in excess of 600,000 lines of code, scan across different modules.\
    \ You can see the need for little help from the original programmers in the form\
    \ of a good comment.\n\nThe best comments are concise and link the code logic,\
    \ detailing what happens when the program hits its line or section. You dont to\
    \ comment on every line. Something along the lines if x=0 does not require you\
    \ to comment that if x equals zero to do something that's going to be obvious\
    \ to the reader. However, if equaling zero is something that drastically changes\
    \ the program for the user, as you run out of lines then it certainly needs to\
    \ be commented on.\n\nEven if you are alone you should write comments as if you\
    \ were sharing it with others. This can help you to code and always understand\
    \ what you did or where you went wrong what brilliantly.\n\nComments are good\
    \ practice and once you understand how to add them to your code, you will need\
    \ it if it becomes your second nature.\n"
  mdcn: "\n\n# C++ 程序结构\n\n## 注释\n\n以双斜杠开头的行是注释。这意味着它们不会在代码中被执行，并会被编译器忽略。注释的设计是为了帮助你，或者查看你代码的另一个程序员解释正在发生什么。注释有两种类型：//\
    \ 覆盖多行（此处如此），// 单行。以双斜杠开头的行是注释。这意味着它们不会被执行并会被编译器忽略。\n\n<<\n这里使用的尖括号（<<）是插入运算符。这意味着跟在尖括号后面的任何内容都将被插入到\
    \ `std::cout` 语句中，如果这些内容是 'Hello, world'，在编译和执行代码时将显示在屏幕上。\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\n\nint main() {\n\t// My first C++ program\n}\n```\n\n## STD\n\
    \nstd 代表标准（standard）。我们正在使用 `cout`，它是 C++ 标准命名空间（Standard Namespace）的一部分，它涵盖了许多不同的语句和命令。你可以省略代码中的\
    \ `std` 部分，但它必须在开头声明：`using namespace std;`，二者不可兼。例如：\n\n```cpp\n#include <iostream>\n\
    using namespace std;\n```\n\n```cpp\nhelloworld.cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main() {\n\tcout << \"Hello, world!\";\n}\n```\n\n## 输出\n\
    \n首先，“Hello, world!”是我们希望在代码执行时出现在屏幕上的内容。你可以输入任何想要的内容，只要不需要引号但某些编译器坚持要求使用。`\\\
    n` 表示插入新行。\n\n```cpp\n// My first C++ program\ncout << \"Hello\n```\n\n## ## COUT\n\
    \n在这个示例中，我们使用了 `cout`，它是标准命名空间的一部分，这就是为什么你要求 C++ 从那个特定的命名空间使用它。Cout 的意思是字符输出（Character\
    \ Output）、显示或屏幕，用于显示代码的开始。如果我们使用 `std;`，正如之前提到的，我们必须在开头声明它。\n\n## ; AND\n\n最后，你可以看到函数代码块内的行（注释除外）都以分号结尾。这标记了语句的结束，C++\
    \ 中的所有语句末尾必须有一个分号，否则编译器将无法解析代码。最后一行有闭括号，表示 `main` 函数的结束。\n\n```cpp\nhelloworld.cpp\n\
    #include <iostream>\nusing namespace std;\n\nint main() {\n\t// My first C++ program\n\
    \tcout << \"Hello, world!\\n\";\n}\n```\n\n# C++ 基础\n\n## 编译与执行\n\n你创建了第一个 C++\
    \ 程序，现在你了解了结构背后的基础。让我们实际行动起来，编译并执行（或者如果你愿意，运行）程序，看看它看起来是什么样。\n\n## 来自 C++ 的问候\n\
    \n在 Code::Blocks 中编译和执行 C++ 代码非常简单；只需点击图标并查看结果。以下是操作方法：\n\n- 步骤 1：打开 Code::Blocks（如果还没打开），并打开之前创建的\
    \ Hello world。确保没有可见的错误，例如 `std::cout` 行末尾缺少分号。\n- 步骤 2：如果你看到的与我们截图中的相似，请查看屏幕顶部的菜单栏。对于最顶部菜单中的\
