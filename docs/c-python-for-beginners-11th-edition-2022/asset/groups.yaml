    ## ZEN OF PYTHON


    Behind this is an ethos called "The Zen of Python." This is a collection of 20
    principles that influence the design. Principles include:

    - Beautiful is better than ugly.

    - Simple is better than complex.

    - Explicit is better than implicit.

    - Readability counts.

    - Flat is better than nested.

    - Sparse is better than dense.

    - Now there should be one—and preferably one—way to do it.

