    **步骤 8** 下一步要求你为你以后所有的代码创建一个 Git 仓库。在你的 Mac 上选择一个位置或网络位置，并点击“创建”（Create）按钮。完成后，你只需要开始编码。左侧窗格详细列出了你添加到
