    TypeError: Can''t concatenate str to object to int

    ```


    STEP 8 This presents a bit of a problem when you want to work with a number that''s
    been inputed by the user, as a string and an integer. Instead, you need to convert


    int(age) + 10


    This will cast the age string into an integer that can be worked


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    (C) (copyright) Python Software Foundation, on linux

    >>> Type "credits" or "license" for more information.

    ```


    STEP 6 This is a process called Typecasting. The Python code is:


    print (character + " is " + str(age) + " years old."


    or you can use:


    print (character,"is", "age", "years old.\nNotice that in the last example, you
    don''t need the spaces between the words in commas as the comma treats each argument
    separately.


    ```

    >>> print (name + age)

    Traceback (most recent call last):

    File "input.py", line 1, in <module>

    TypeError: Can''t concatenate str to object to int

    >>> print(character + " is " + str(age) + " years old.")

    David Howard Descended from Vikings is 44 years old.

    >>> print(name,"is", "age", "years old.")

    David Descended from Vikings is 44 years old.

    ```


    STEP 9 This type of Typecasting is also useful when dealing with floating point
    arithmetic; numbers that have a decimal point. In example, enter:


    shirt=19.99


    Now enter (shirt) and you will see that Python handles it as a ''float'', because
    float contains a decimal point.


    ```

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    (C) (copyright) Python Software Foundation, on linux

    >>> Type "credits" or "license" for more information.

    >>> type(shirt)

    <class ''float''>

    ```


    STEP 7 Another example of Typecasting is when you provide input from the user,
    such as for example,


    age= input ("How old are you")


    All data from the input is stored as a string variable.


    STEP 10 When combining integers and floats Python converts the integer to a float,
    but the reverse it''s worth noting that Python doesn''t return the value you expect.
    When converting float to integer, Python will always round down to the nearest
    integer, calling truncate; in case of 19.9 it becomes 19.


    ```

