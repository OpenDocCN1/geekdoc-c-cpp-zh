  md: '# STEP 5


    What you have done here is assigning the letters a and b values: 2 and 2. These
    are new variables, which can be called upon Python to output, add, subtract, and
    so on for long as their numbers stay the same. Try this:


    # print(b)


    ```

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "copyright", "credits" or "license" for more information.

    name="Hello"

    print(name)

    a=2

    print(a*2)

    b=3

    print(a+b)

    print(a-b)

    print(a/b)

    ```


    # STEP 8


    Now let''s add a surname:


    ```

    surname="Haywood"

    print(surname)

    ```


    You have two variables now a first name and surname and you can print them independently.


    ```

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

