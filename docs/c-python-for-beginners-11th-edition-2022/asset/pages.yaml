  md: "# Say Hello to Python\n\n# Getting to Know Python\n\nPython is the greatest\
    \ computer programming language ever created. It enables you to fully harness\
    \ the power of a computer, in a language that is clean and easy to understand.\n\
    \n# WHAT IS PROGRAMMING?\n\nIt helps to understand what a programming language\
    \ is before you try to learn one, and it's a take to look at how Python came about\
    \ and how it relates to other languages.\n\n# PROGRAMMING RECIPES\n\nA programming\
    \ language is a list of instructions that a computer follows. These instructions\
    \ can be as simple as a recipe or as complex as a music file or building a whole\
    \ world. Python is a language conceived in the late 1980s by Guido van Rossum\
    \ at Centrum Wiskund Informatica (CWI) in the Netherlands as a successor to the\
    \ ABC language.\n\nPrograms are like recipes for computers.\n\n+   Put 100 grams\
    \ of self-raising flour in a bowl.\nAdd 100 grams of butter to the bowl.\nAdd\
    \ 100 milliliters of milk.\nBake for half an hour.\n\n```\nbowl = []\nflour =\
    \ 100\nbutter = 50\nmilk = 100\nbowl.append([flour,butter,milk])\n```\n\nGuido\
    \ van Rossum, the Father of Python.\n\n# CODE\n\nJust like a recipe, a program\
    \ consists of instructions that you follow in order. A program that describes\
    \ a cake might run like this:\n\n```\nclass Cake(object):\n    def __init__(self,\
    \ ingredients):\n        self.ingredients = ingredients\n    def bake(self):\n\
    \        return \"Baking cake...\"\n\ncake = []\nflour = 100\nbutter = 50\nmilk\
    \ = 100\ncake.append([flour,butter,milk])\n```\n\n# PROGRAM COMMANDS\n\nYou might\
    \ not understand some of the commands, like bowl.append and cake(cake). The first\
    \ is a list, the second object we'll look at both in this book. The main thing\
    \ to know is that it's easy to read commands in Python. Once you learn the commands,\
    \ it's easy to figure out how a program works.\n\n![](img/a8d30135b233113405243b99e2d4c802_11_0.png)\n\
    \n```\nPython 3.2.4 Shell\n[1] Date: 2014-06-24, 23:21:17\n[2] type 'copyright',\
    \ 'credits' or 'license' for more information\n[3] >>> help()\n...\n[4] >>> cake\
    \ = []\n[5] >>> cake.append([100, 50, 100])\n[6] >>> print(type(cake))\n[7]<__main__.Cake\
    \ object at 0x...>\n```\n\nwww.bdmppublications.com"
