  md: '# # Your First Code


    Essentially, you''ve already written your first piece of code with the ''print("Hello
    everyone!")'' function from the previous tutorial. However, let''s expand and
    look at entering your code calling and playing around with some other Python examples.


    # ## PLAYING WITH PYTHON


    With most languages, computer or human, it''s all about remembering and applying
    the right words to the right situation. You''re not born knowing these words,
    so you need to learn them.


    +   * STEP 1: If you''ve closed Python IDLE, reopen it in the Shell, whichever
    operating system version you prefer. In Shell try typing the following:


