  md: "# # Creating Functions\n\nNow that you have mastered the use of variables and\
    \ user input, the next step is to tackle functions. You have already used a few\
    \ functions, such as the print command but by Python enables you to define your\
    \ own functions.\n\n# ## FUNKY FUNCTIONS\n\nA function is a command that you enter\
    \ into Python to do something. It's a little piece of self-contained code that\
    \ takes data, works on it and returns the result.\n\n+   **STEP 1** It is not\
    \ just a function that works. They can do all manner of useful things in Python,\
    \ such as sort data, change items from one format to another and check the length\
    \ or type of items. A function is a short word that follows by brackets. For example,\
    \ `len()`, `list()` or `type()`.\n\n+   **STEP 3** You can pass variables through\
    \ functions in much manner Let's assume you want the number of letters in a person's\
    \ surname, you could use the following code (enter the text editor for this example):\n\
