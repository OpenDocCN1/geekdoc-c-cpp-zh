    3.


    # MASTERING MODULES


    Think of modules as an extension that''s imported into your Python code to enhance
    and extend its capabilities. There are countless modules available and as we''ve
    seen, you can make your own.


    +   STEP 1 Although good, the built-in functions within Python are limited. The
    use of modules, allows us to make more sophisticated programs. As you are aware,
    modules are Python Scripts that are imported, such as import.


    +   STEP 3 The result is an error in the IDLE Shell, as the module isn''t recognised
    or installed in Python. To install a module we can use PIP (Pip Installed Packages).
    Close down the IDLE Shell and drop into a command prompt or Terminal. At an elevated
    command prompt, enter:


    ```

    pip install pygame

    ```


    +   STEP 2 Some modules, especially on the Raspberry Pi, are included by default,
