  md: '# # Using Comments


    While comments may seem like a minor element to the lines of code that combine
    to make a game, application or even an operating system, in actual fact they''re
    probably one of the most important factors.


    # ## THE IMPORTANCE OF COMMENTING


    Comments inside code are human readable descriptions that detail what the code
    is doing at that particular point. They don''t especially impact but code without
    comments is one of the most frustrating areas unless you''re a professional or
    just starting out.


    In short, code should be commented in a manner as to effectively describe the
    purpose of a line, section, or individual elements. When you get to the head of
    commenting as much as someone who doesn''t know anything about programming you
    can pick up your code and understand what it''s going to do by reading your comments.


    In a professional environment, comments are vital to the success of the code and
    the company. In an organisation, many programmers work in teams of engineers,
    other developers, hardware analysts and software testers. If you''re part of the
    team that''s writing software your comments help to tell if something goes wrong,
    another team member has to pick up and follow the trail to pinpoint the issue.


    Place yourself in the shoes of someone whose job is to find out what your program
    has in excess of 600,000 lines of code, scan across different modules. You can
    see the need for a little help from the original programmers in the form of a
    good comment.


    The best comments are concise and link the code logic, detailing what happens
    when the program hits its line or section. You dont need to comment on every line.
    Something along the lines if x=0 does not require you to comment that if x equals
    zero to do something:


    that''s going to be obvious to the reader. However, if equaling zero is something
    that drastically changes the program for the user, as you run out of lines then
    it certainly needs to be commented on.


    Even if you are alone you should write comments as if you were sharing it with
    others. This can help you to code and always understand what you did or where
    you went wrong what worked brilliantly.


    Comments are good practice and once you understand how to add them to your code,
    you will need it if it becomes your second nature.


