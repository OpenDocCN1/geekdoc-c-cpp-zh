    +   * STEP 3 Resave the code and execute. You can see that the output in the IDLE
    Shell is still the same as before, despite the lines being added. Simply put,
    the hash symbol (#) denotes a line of text that the programmer can insert to inform
    them, and others, of what''s going on without the user being aware.


    ![](img/a8d30135b233113405243b99e2d4c802_31_1.png)


    +   * STEP 2 Running the code will return the line: The value of A is, 10 to the
    IDLE Shell window, which is what we expected. Now, add some of the comments you''d
    normally see within code:


    > # Set the value of A to 10

    # Print the current value of A


    +   * STEP 4 Let''s assume that the variable that we created is the number of
    lives in a game. Every time the player dies, the variable is decreased by one.
    The programmer should insert a line among the following:


    ```

