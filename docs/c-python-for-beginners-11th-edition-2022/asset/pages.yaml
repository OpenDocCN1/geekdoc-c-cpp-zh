  md: '# Say Hello to Python


    # # How to Set Up Python in Windows


    Windows users can easily install the latest version of Python via the main Python
    Downloads page. Whilst most seasoned developers may shun Python 3.x as the platform
    of choice for their code, it''s an ideal starting point for beginners.


    # ## INSTALLING PYTHON 3.X


    Microsoft Windows doesn''t come with Python preinstalled as standard, so you''re
    going to have to install it manually. Frankly, it''s an easy process to follow.


    ![](img/a8d30135b233113405243b99e2d4c802_13_0.png)


    +   - **STEP 1** Start by opening your web browser to www.python.org/downloads/.
    Look for the button download link for Python 3.x (in this case it is Python 3.6
    but you may see later versions of 3).


    +   - **STEP 3** Choosing the Customise option allows you to specify certain parameters,
    and whilst you may stay with the defaults, a good habit to avoid as (sometimes
    not with Python, thankfully) installers can include unwanted features. If you
    prefer them, ensure all boxes are ticked and click the next button.


    # Download the latest version for Windows


    Wondering which version to use? Here''s more about the difference between Python
    2 and 3.


    Looking for Python with another OS? For Windows, Linux, Mac, OS X, Other


    Want to help test versions of Python? Pre-releases


    ![](img/a8d30135b233113405243b99e2d4c802_13_1.png)


    | Optional Features |

    | :--- |

    | Documentation Installs the Python documentation file. |

    | pip Installs pip which can download and install other Python packages. |

    | IDLE Installs the IDE development environment. |

    | Python test Installs the included test library suite. |

    | launcher Installs for all users (requires elevation) Installs the global launcher
    to make it easier to start Python. |


    ![](img/a8d30135b233113405243b99e2d4c802_13_2.png)


    +   - **STEP 2** Click the download button for version 3.x, and save the file
    to your Downloads Folder. When the file is downloaded, double-click the executable
    and the Installation wizard will launch. From here you have two choices: Install
    Now or Custom. We recommend opting for the Custom installation.


    ![](img/a8d30135b233113405243b99e2d4c802_13_3.png)


    The next page of options includes some important to add to Python. Create Shortcuts,
    Add Python to Environment Variables, Precompile Standard Library and Install for
    All Users. These are made using Python later much easier. Click Install when you''re
    ready to.


    ![](img/a8d30135b233113405243b99e2d4c802_13_4.png)


    # ## Advanced Options


    +   - Install for all users

    - Associate files with Python (requires the python)

    - Create shortcuts for applications

    - Add Python to environment variables

    - Precompile standard library

    - Disable help programs

    - Download debug binaries (VS 2015 or later)


    ![](img/a8d30135b233113405243b99e2d4c802_13_5.png)'
