  md: '# Using Comments


    When you write the code, the flow of it, what each variable does, and so on is
    all inside your head. Another programmer could follow the code line by line but
    over time, it can become difficult to read.


    # #COMMENTS!


    Programmers use a method of keeping their code readable by commenting on sections.
    If a variable is used, the programmer comments on what it''s supposed to do, for
    example. It''s just good practice.


    +   * STEP 1 Start creating a new instance of the IDLE Editor (> New File) and
    create a simple variable and print command:


    ```

    a=10

    print("The value of A is,", a)

    ```


