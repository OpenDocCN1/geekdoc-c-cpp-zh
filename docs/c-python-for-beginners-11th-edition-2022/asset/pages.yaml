  md: "# C++ Maths\n\nProgramming is mathematical in nature and as you might expect,\
    \ there's plenty of built-in scope for some intense maths. C++ has a lot to offer\
    \ someone who's implementing mathematical models into their code. It can be extremely\
    \ complex or relatively simple.\n\nC++ = MC²\nThe basic mathematical symbols apply\
    \ in C++ as they do in most other programming languages. However, by using the\
    \ C++ Math Library, you can also calculate square roots, powers, trig and more.\n\
