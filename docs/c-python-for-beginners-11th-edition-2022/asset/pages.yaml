  md: '# HIGH-LEVEL LANGUAGES


    Computer languages that are easy to read are known as "high-level".

    This is because they fly above the hardware (also referred to as "the metal").
    Languages that "close to the metal," like Assembly, are considered "low-level".
    Low-level languages commands read like this: `mov db, len equ = msg`


    # ZEN OF PYTHON


    Python lets access all the power of a computer in a language that humans can understand.
    Behind this is an ethos called "The Zen of Python." This is a collection of 20
    principles that influence the design of the language. Principles include "Beautiful
    is better than ugly" and "Simple is better than complex." `import this` and Python
    will display all princes.


    ![](img/a8d30135b233113405243b99e2d4c802_12_0.png)


    # PYTHON 3 VS PYTHON 2


    In a typical computing scenario, Python is complicated by the existence of two
    active versions of the language: Python 2 and Python 3.


    +   WORLD OF PYTHON

    There are two buttons available: one for Python 3.6.2 and the other for Python
    2.7; check at the time of writing (remember Python 2 is frequently updated so
    you may see different versions)


    When you visit Python

    Download the page you notice


    +   PYTHON 3.X

    In 2008 Python arrived with several new and enhanced features. These features
    provide a more stable, effective and efficient programming environment but said,
    most (if not all) of these new features are not popular at first, Python 3 has
    been since the editing of Python.


    # Download the latest version for Windows


    Wondering which one to use? Here''s more about the difference between Python 2
    and 3.

    Looking for Python with a different OS? Python for Windows, Linux/Unix OS Other

    Want to help develop latest versions of Python? Pre-releases


    # PYTHON 2.X


    So why two? Python 2 was launched in 2000 and has since adopted quite a large
    collection of modules, scripts, tutorials and so on. Over the years, Python 2
    has become the first of best to go programming languages for beginners and experts
    to code in, which makes it an extremely valuable resource.


    # 3.X WINS


    Python 3''s growing popularity has that it''s now prudent to start learning to
    develop with the new features and begin to phase out the previous version. Many
    development companies, such as SpaceX and NASA use Python 3 for snippets of important
    code.


    ![](img/a8d30135b233113405243b99e2d4c802_12_1.png)'
