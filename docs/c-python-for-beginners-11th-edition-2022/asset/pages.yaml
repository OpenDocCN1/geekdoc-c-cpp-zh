  md: "# How to Set Up C++ in Linux\n\nLinux is a great C++ coding environment. Most\
    \ Linux distros already have the essential components preinstalled, such as a\
    \ compiler and the text editors are excellent for entering code into, including\
    \ coding; and there's tons of extra software to help you out.\n\n# LINUX++\n\n\
    If you're not familiar with Linux, then we recommend taking a look at one of our\
    \ Linux titles from the BDM Publications. If you have the Raspberry Pi, the commands\
    \ used below work just fine and for this example we're using Linux Mint.\n\n+\
    \   STEP 1 The first step is to start coding in your C++ code, check the system\
    \ and software are up to date. Open a terminal and use sudo apt-get update &&\
    \ sudo apt-get upgrade. Press Return and enter your password. These commands update\
    \ the system and install any needed software.\n\n+   STEP 3 Amazingly, that's\
    \ already ready for you to start coding. Here's how to get your first C++ program\
    \ up and running. Linux the main text editor is Zed, which can launch by clicking\
    \ on the Menu and typing Zed into the search bar. Click on the Text editor in\
    \ the right-hand pane to open it.\n\n+   STEP 2 Most Linux distros come preinstalled\
    \ with all the necessary components to start coding in C++; however, it's worth\
    \ checking to see if everything is present. Still within the terminal, sudo apt-get\
    \ install build-essential and press Return. If you have the right components not\
    \ installed; if you're missing them then follow the command.\n\n+   STEP 4 In\
    \ Zed, or any other text editor you might be using, enter the lines of code that\
    \ make your C++ Hello World program. It's a little different to what the Mac produced:\n\
    \n#include <iostream>\n\n```\nint main() {\n    // My first C++ program\n    std::cout\
    \ << \"Hello World!\\n\";\n}\n```\n\n![](img/a8d30135b233113405243b99e2d4c802_53_0.png)\n\
