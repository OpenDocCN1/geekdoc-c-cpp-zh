  md: "# Structure of a C++ Program\n\n# COMMENTS\n\nLines begin with a double slash\
    \ as comments. This means they won't be executed in the code and ignored by the\
    \ compiler. Comments are designed to help you, or another programmer looking at\
    \ your code, explain what's going on. There are two types of comment: // covers\
    \ multiple lines, // a single line Lines begin with a double slash comments. These\
    \ means they won't be executed and are ignored by the compiler.\n\n<<\nThe chevrons\
    \ used here are insertion operators. This means that whatever follows the chevrons\
    \ will be inserted into the std::cout statement, in case they're the words 'Hello,\
    \ world', which are to be displayed on the screen when you compile and execute\
    \ the code.\n\n```\nhelloworld.cpp\n#include <iostream>\n\nint main() {\n\t//\
    \ My first C++ program\n}\n}\n```\n\n# STD\n\nwill stands for standard. We're\
    \ using cout, which is part of the Standard Namespace in C++, which covers a number\
    \ of different statements and commands. You can leave the std part of the code\
    \ but it must be declared at the start: using namespace std; not both. For example:\n\
    \n#include <iostream>\nusing namespace std;\n\n```\nhelloworld.cpp\n#include <iostream>\n\
    using namespace std;\n\nint main() {\n\tcout << \"Hello, world!\";\n\n}\n```\n\
    \n# OUTPUTS\n\nLeading-on, \"Hello, world! is what we want to appear on the screen\
    \ when the code executes. You can enter whatever you like, as long as its the\
    \ quote marks aren't needed but some compilers insist on them. The \\n indicates\
    \ a new line is to be inserted.\n\n```\n// My first C++ program\ncout << \"Hello\n\
    ```\n\n# COUT\n\nIn this example we're using cout, which is part of a Standard\
    \ Namespace, hence why it's, as you're asking C++ to use it from that particular\
    \ namespace. Cout means Character Output, displays, or screens, to show the start\
    \ of the code. if we use std; we have to declare it at the start, as mentioned\
    \ previously.\n\n# ;AND;\n\nFinally you can see that lines within a function code\
    \ block (except comments) end with a semicolon. This marks the end of the statement\
    \ and all statements in C++ must have one at the end or the compiler fails to\
    \ decode the code. The very last line has the closing brace to indicate the end\
    \ of the main function.\n\n```\nhelloworld.cpp\n#include <iostream>\nusing namespace\
    \ std;\n\nint main() {\n\t// My first C++ program\n\tcout << \"Hello, world!\\\
    n\";n\n}\n```\n\n```\nhelloworld.cpp\n#include <iostream>\nusing namespace std;\n\
    \nint main() {\n\t// My first C++ program\n\tcout << \"Hello, world!\\n\";n\n\
    }\n```\n\nwww.bdmppublications.com 63"
