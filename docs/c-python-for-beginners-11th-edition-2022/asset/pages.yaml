    # STEP 6


    The output of the last step displays values of a and b individually, as you''ve
    asked them to be printed separately. If you want to add them up, use the following:


    # print(a+b)


    This simple code takes the values of a and b, adds them and outputs the result:


    ```

    Python 3.4.2

    Python 3.4.2 (default, Oct 19 2014, 13:31:11)

    Type "copyright", "credits" or "license" for more information.

    name="Hello"

    Hello

    a=2

    print(a*2)

