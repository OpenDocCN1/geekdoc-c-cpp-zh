    Following are the macros defined in the header stdarg.h:


    | S.N. | Macro & Description |

    |------|---------------------|

    | 1 | `void va_start(va_list ap, last_arg)`

    This macro initializes **ap** variable to be used with the **va_arg** and **va_end**
    macros. The **last_arg** is the last known fixed argument being passed to the
    function i.e. the argument before the ellipsis. |

    | 2 | `type va_arg(va_list ap, type)`

    This macro retrieves the next argument in the parameter list of the function with
    type **type**. |

    | 3 | `void va_end(va_list ap)`

    This macro allows a function with variable arguments which used |'
