  md: '# # FILE \*freopen(const char \*filename, const char \*mode, FILE \*stream)


    # ## Description


    The C library function **FILE \*freopen(const char \*filename, const char \*mode,
    FILE \*stream)** associates a new **filename** with the given open stream and
    at the same time closes the old file in the stream.


    # ## Declaration


    Following is the declaration for freopen() function.


    ```

    ```c

    FILE *freopen(const char *filename, const char *mode, FILE *stream)

    ```

    ```


    # ## Parameters


    +   - **filename** -- This is the C string containing the name of the file to
    be opened.


    +   - **mode** -- This is the C string containing a file access mode. It includes:


    | mode | Description |

    | --- | --- |

    | "r" | Opens a file for reading. The file must exist. |

    | "w" | Creates an empty file for writing. If a file with the same name already
    exists then its content is erased and the file is considered as a new empty file.
    |

    | "a" | Appends to a file. Writing operations appends data at the end of the file.
    The file is created if it does not exist. |

    | "r+" | Opens a file to update both reading and writing. The file must exist.
    |

    | "w+" | Creates an empty file for both reading and writing. |

    | "a+" | Opens a file for reading and appending. |


    +   - **stream** -- This is the pointer to a FILE object that identifies the stream
    to be re-opened.


    # ## Return Value


    If the file was re-opened successfully, the function returns a pointer to an object
    identifying the stream or else, null pointer is returned.


    # ## Example


    The following example shows the usage of freopen() function.'
