- pgno: 8
  md: '# Introduction


    The **assert.h** header file of the C Standard Library provides a macro called
    **assert** which can be used to verify assumptions made by the program and print
    a diagnostic message if this assumption is false.


    The defined macro **assert** refers to another macro **NDEBUG** which is not a
    part of <assert.h>. If NDEBUG is defined as a macro name in the source file, at
    the point where <assert.h> is included, the **assert** macro is defined as follows:


    ```

    ```c

    #define assert(ignore) ((void)0)

    ```

    ```


    # Library Macros


    Following is the only function defined in the header assert.h:


    | S.N. | Function & Description |

    |------|------------------------|

    | 1 | void assert(int expression)


    This is actually a macro and not a function, which can be used to add diagnostics
    in your C program. |


    # void assert(int expression)


    # Description


    The C library macro **void assert(int expression)** allows diagnostic information
    to be written to the standard error file. In other words, it can be used to add
    diagnostics in your C program.


    # Declaration


    Following is the declaration for assert() Macro.


    ```

    ```c

    void assert(int expression);

    ```

    ```


    # Parameters


    +   - **expression** -- This can be a variable or any C expression. If **expression**
    evaluates to TRUE, assert() does nothing. If **expression** evaluates to FALSE,
    assert() displays an error message on'
