    \ **stream** -- This is the pointer to a FILE object that identifies an open stream.\n\
    +   - **buffer** -- This is the user allocated buffer. If set to NULL, the function\
    \ automatically allocates a buffer of the specified size.\n+   - **mode** -- This\
    \ specifies a mode for file buffering:\n\n| mode | Description |\n|------|-------------|\n\
    | _IOFBF | **Full buffering:** On output, data is written once the buffer is full.\
    \ On Input the buffer is filled when an input operation is requested and the buffer\
    \ is empty. |\n| _IOLBF | **Line buffering:** On output, data is written when\
    \ a newline character is inserted into the stream or when the buffer is full,\
    \ whatsoever happens first. On Input, the buffer is filled till the next newline\
    \ character when an input operation is requested and buffer is empty. |\n| _IONBF\
    \ | **No buffering:** No buffer is used. Each I/O operation is written as soon\
    \ as possible. The buffer and size parameters are ignored. |\n\n+   - **size**\
    \ -- This is the buffer size in bytes\n\n# Return Value\n\nThis function returns\
    \ zero on success else, non-zero value is returned.\n\n# Example\n\nThe following\
    \ example shows the usage of setvbuf() function.\n\n```\n#include <stdio.h>\n\n\
    int main()\n{\n    char buff[1024];\n\n    memset( buff, '\\0', sizeof( buff ));\n\
    \n```"
