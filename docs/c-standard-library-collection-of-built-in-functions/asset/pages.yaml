  md: '# # 2. `<CTYPE.H>`


    # ## Introduction


    The **ctype.h** header file of the C Standard Library declares several functions
    that are useful for testing and mapping characters.


    All the functions accepts **int** as a parameter, whose value must be EOF or representable
    as an unsigned char.


    All the functions return non-zero (true) if the argument c satisfies the condition
    described, and zero (false) if not.


    # ## Library Functions


    Following are the functions defined in the header ctype.h:


    | S.N. | Function & Description |

    |---|---|

    | 1 | `int isalnum(int c)`<br>This function checks whether the passed character
    is alphanumeric. |

    | 2 | `int isalpha(int c)`<br>This function checks whether the passed character
    is alphabetic. |

    | 3 | `int iscntrl(int c)`<br>This function checks whether the passed character
    is control character. |

    | 4 | `int isdigit(int c)`<br>This function checks whether the passed character
    is decimal digit. |

    | 5 | `int isgraph(int c)`<br>This function checks whether the passed character
    has graphical representation using locale. |

    | 6 | `int islower(int c)`<br>This function checks whether the passed character
    is lowercase letter. |'
