    # int isalnum(int c)


    **Description**


    The C library function **void isalnum(int c)** checks if the passed character
    is alphanumeric.


    **Declaration**


    Following is the declaration for isalnum() function.


    ```

    ```c

    int isalnum(int c);

    ```

    ```


    **Parameters**


    +   * **c** -- This is the character to be checked.


    **Return Value**


    This function returns non-zero value if c is a digit or a letter, else it returns
    0.


    **Example**


    The following example shows the usage of isalnum() function.


    ```

    ```c

    #include <stdio.h>

    #include <ctype.h>

    ```

