  md: "The C library function **double frexp(double x, int *exponent)** return value\
    \ is the mantissa, and the integer pointed to by **exponent** is the exponent.\
    \ The resultant value is **x = mantissa * 2 ^ exponent**.\n\n# Declaration\n\n\
    Following is the declaration for frexp() function.\n\n```\ndouble frexp(double\
    \ x, int *exponent)\n```\n\n# Parameters\n\n+   - **x** -- This is the floating\
    \ point value to be computed.\n+   - **exponent** -- This is the pointer to an\
    \ int object where the value of the exponent is to be stored.\n\n# Return Value\n\
    \nThis function returns the normalized fraction. If the argument x is not zero,\
    \ the normalized fraction is x times a power of two, and its absolute value is\
    \ always in the range 1/2 (inclusive) to 1 (exclusive). If x is zero, then the\
    \ normalized fraction is zero and zero is stored in exp.\n\n# Example\n\nThe following\
    \ example shows the usage of frexp() function.\n\n```\n#include <stdio.h>\n#include\
    \ <math.h>\n\nint main ()\n{\n    double x = 1024, fraction;\n    int e;\n\n \
    \   fraction = frexp(x, &e);\n    printf(\"x = %.2f = %.2f * 2^%d\\n\", x, fraction,\
    \ e);\n\n    return(0);\n}\n```\n\nLet us compile and run the above program to\
    \ produce the following result:\n\n```\nx = 1024.00 = 0.50 * 2^11\n```"
