  md: '# ## Introduction


    The **float.h** header file of the C Standard Library contains a set of various
    platform-dependent constants related to floating point values. These constants
    are proposed by ANSI C. They allow making more portable programs. Before checking
    all the constants, it is good to understand that floating-point number is composed
    of following four elements:


    | Component | Component Description |

    |---|---|

    | S | sign ( +/- ) |

    | b | base or radius of the exponent representation, 2 for binary, 10 for decimal,
    16 for hexadecimal, and so on... |

    | e | exponent, an integer between a minimum **e<sub>min</sub>** and a maximum
    **e<sub>max</sub>**. |

    | p | precision, the number of base-b digits in the significand |


    Based on the above 4 components, a floating point will have its value as follows:


    ```

    ~~~

    floating-point = ( S ) p x b^e


    or


    floating-point = (+/-) precision x base^exponent

    ~~~

    ```


