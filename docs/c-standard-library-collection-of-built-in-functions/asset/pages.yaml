  md: '# Introduction


    The **math.h** header defines various mathematical functions and one macro. All
    the functions available in this library take **double** as an argument and return
    **double** as the result.


    # Library Macros


    There is only one macro defined in this library:


    | S.N. | Macro & Description |

    |------|---------------------|

    | 1 | **HUGE_VAL** |

    | | This macro is used when the result of a function may not be representable
    as a floating point number. If magnitude of the correct result is too large to
    be represented, the function sets errno to ERANGE to indicate a range error, and
    returns a particular, very large value named by the macro HUGE_VAL or its negation
    (- HUGE_VAL). |

    | | If the magnitude of the result is too small, a value of zero is returned instead.
    In this case, errno might or might not be set to ERANGE. |


    # Library Functions


    Following are the functions defined in the header math.h:


    | S.N. | Function & Description |

    |------|------------------------|

    | 1 | `double acos(double x)` |

    | | Returns the arc cosine of x in radians. |

    | 2 | `double asin(double x)` |

    | | Returns the arc sine of x in radians. |

    | 3 | `double atan(double x)` |

    | | Returns the arc tangent of x in radians. |'
