  md: "# # clock_t clock(void)\n\n# ## Description\n\nThe C library function **clock_t\
    \ clock(void)** returns the number of clock ticks elapsed since the program was\
    \ launched. To get the number of seconds used by the CPU, you will need to divide\
    \ by CLOCKS_PER_SEC.\n\nOn a 32 bit system where CLOCKS_PER_SEC equals 1000000\
    \ this function will return the same value approximately every 72 minutes.\n\n\
    # ## Declaration\n\nFollowing is the declaration for clock() function.\n\n```\n\
    ```c\nclock_t clock(void)\n```\n```\n\n# ## Parameters\n\n+   - NA\n\n# ## Return\
    \ Value\n\nThis function returns the number of clock ticks elapsed since the start\
    \ of the program. On failure, the function returns a value of -1.\n\n# ## Example\n\
    \nThe following example shows the usage of clock() function.\n\n```\n```c\n#include\
    \ <time.h>\n#include <stdio.h>\n\nint main()\n{\n    clock_t start_t, end_t, total_t;\n\
    \    int i;\n\n    start_t = clock();\n    printf(\"Starting of the program, start_t\
    \ = %ld\\n\", start_t);\n\n    printf(\"Going to scan a big loop, start_t = %ld\\\
    n\", start_t);\n    for(i=0; i< 100000000; i++)\n    {\n    }\n    end_t = clock();\n\
    \    printf(\"End of the big loop, end_t = %ld\\n\", end_t);\n```\n```"
