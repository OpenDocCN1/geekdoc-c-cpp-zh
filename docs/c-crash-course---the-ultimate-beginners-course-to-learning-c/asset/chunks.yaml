    \ `b`，这个 `if` 语句将返回 `false`。相反，它将打印 `a is not larger than b`，因为代码通过了失败的 `if` 语句并调用了\
    \ `else` 语句。\n\n- `<` 此运算符检查某物是否**小于**另一物。如果运算符前变量的值小于变量变量的值，代码将返回 `true`；否则，它将返回\
    \ `false`。\n\n示例：\n```c\nint a = 10;\nint b = 20;\nif (a < b) {\n            \
    \  // Not Equal\n}\n```\n这个示例与上一个相似，但运算符从大于变为小于。因此，`if` 语句将返回 `true`。由于 `a` 的值小于\
    \ `b` 的值，程序将打印 `a is not larger than b`。\n\n- `<=` 此运算符检查某物是否**大于或等于**另一物。如果前面变量的值大于或等于后面的变量，它将返回\
    \ `true`。如果后面的变量大于但不等于前面的变量，它将返回 `false`。\n\n示例：\n```c\nint a = 10;\nint b = 20;\n\
    if (a <= b) {\n              // Equal or less than\n}\n```\n在这个示例中，`a` 和 `b` 的值分别为\
    \ 10 和 20。虽然 `a` 不大于 `b`，但它也**等于** `b`，因此该语句返回 `true`，代码最终打印 `a is less or equal\
    \ to b`。\n\n- `>=` 此运算符检查某物是否**小于或等于**某物。如果前面变量的值小于或等于后面的变量，它将返回 `true`。如果后面的变量小于但不等于前面的变量，它将返回\
    \ `false`。\n\n示例：\n```c\nint a = 10;\nint b = 20;\nif (a >= b) {\n           \
    \   // Equal or greater\n}\n```\n这个示例与上一个相同，只是运算符从 `<=` 变为 `>=`。虽然运算符变了，但结果是相同的。由于\
    \ `a` 不等于 `b` 且也不大于 `b`，这段代码将返回 `false` 并打印 `a is not larger than b`。\n\n## 逻辑运算符\n\
    \nC 语言支持 3 种可用于逻辑判断的逻辑运算符，它们通常与关系运算符配合使用。\n\n- `&&` 这被称为逻辑**与**（AND）运算符。如果操作数都为\
    \ `true`，则结果为 `true`。如果运算符前后的操作数都返回 `false`，则结果为 `false`。\n\n示例：\n```c\nint a\
