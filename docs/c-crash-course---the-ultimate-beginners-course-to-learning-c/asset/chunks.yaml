    # Enums and Generic Types


    ## Enums


    Enums are essentially presets. They can only have a limited number of possibilities.
    They are defined similar to classes and interfaces except using the enum keyword
    instead. They can have constructors and variables. Enums cannot be instantiated
    or be children (but they can implement interfaces). Be careful when accessing
    variables within an enum, because if you modify an enum’s variables, all instances
    of that enum will be modified. To fill an enum, you need a list of all presets.
    This list must be at the top of your enum block. If your enum does not have a
    constructor, you may simply write out the possible values as if it were a variable
    name. The rest would separate by commas, and end with a semicolon. If your enum
    does have a constructor, you must write the variable name, then the parameters
    of the constructor (meaning the values), separated by commas and ending with a
    semicolon. After the semicolon, you may go on to write your variable declarations,
    constructor(s) and any methods you wish. The constructor(s) cannot be public,
    only protected or private.


    #include <iostream>


    enum Color {


                  Red, Green, Blue


    };


    int main() {


                  Color c = Red;


                  if (c == Red) {


                                std::cout << "Color is red." << std::endl;


                  }


                  else {


                                std::cout << "Color is not red" << std::endl;


                  }


                  system("pause");


                  return 0;


    }


    ## Generic Types


    Generic types allow us to make classes that are generic, meaning they can act
    differently based on what type it is given. Generic types are given a list of
    classes by the programmer that will be used to define certain object types. Generic
    types are created by placing angled brackets ( < > ) after the class name and
    then a list of type identifiers. These work just as variable names, but the convention
    is to use capital letters, specifically T (for type) for one of them.


    These type identifiers can be used in place of data types. This allows you to
    keep certain variables a consistent type in order to prevent the need for casting.
    When you’re creating a variable with the data type of the class using generic
    types, the data type most also has angled brackets containing a list of types
    corresponding to the class’s list of types. The object you create will also need
    the same set of angled brackets before the parameters.


    In C, this generic programming is done using templates. You can create a template
    for a class or object and set a type to it. Then the developers can use different
    objects in those templates and consume them. For example, a vector object is a
    single container, but can contain objects of different type specified in their
    angled brackets.


