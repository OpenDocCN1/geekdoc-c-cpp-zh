    # Chapter 19


    # Final Words


    This is the start of your journey as a C programmer. You have barely scratched
    the surface with this guide as learning the syntax and conventions of a language
    is just the beginning. The most important part of programming is the logical aspect
    of it. Sure, you may know how to loop through an array of variables like a list
    of shopping items but if someone asks you to process an image using your knowledge
    of programming, and with the help of an API and some thinking, you can figure
    out how you are able to invert colors of an image, flip it, rotate it, scale it,
    etc.


    The real programming comes in the logical portion of the mind. It’s similar to
    when you’re learning any other language, like English for example. You may understand
    the grammar rules and the conventions like adding periods to the end of sentences,
    but to be able to write clean and logical thought-out and structured essays is
    where the true skill lies. The same concept applies to programming where the person
    writing the code, must know how to apply his knowledge of the rules in the considered
    language, like C, and use it to his advantage to come up with neat programs. More
    than that it totally depends on your imagination and concepts. The more imaginative
    mind you have the more creative work you would be able to accomplish.


    The knowledge and understanding of programming is truly great because it’s the
    closest thing to having a power. You can literally create something out of an
    empty notepad, from scratch and have it function to do things you want it to do.
    Whether it be a bot to analyze the stock market and come up with predictions or
    creating a game. That choice is yours.


    In this guide, you have learned the fundamentals of C, including structure of
    a C program, how you create your own programs in C, what are arrays, functions,
    loops and other similar things. You haven’t learned all the possible methods that
    can be used in the language, but that isn’t the point. The point of this guide
    was to set you on a journey to discover objects and methods that you need in order
    to help you to create programs that you desire. You have been given the optimum
    knowledge to understand reading an API and be able to understand what it is saying
    and adding to your code.


    Good luck as a new-born C programmer!


