    You can find it on Amazon, under our name, Eprogramy, or by following this link:


    [![](images/00008.jpeg)](http://www.amazon.com/Java-Ultimate-Beginners-Learning-Programming-ebook/dp/B00Y96U1D2)


    http://www.amazon.com/Java-Ultimate-Beginners-Learning-Programming-ebook/dp/B00Y96U1D2


    # Preview of JAVA CRASH COURSE - The Ultimate Beginner’s Course to Learning Java
    Programming in Under 12 Hours


    # Introduction


    # Welcome to Your New Programming Language


    So, you''ve decided to learn Java Programming? Well, congratulations and welcome
    to your new Programming Language! You''re going to love it!


    In Eprogramy we believe that the foundation of a good education is to provide
    the tools able to open the doors of the future. It is indisputable that the world
    has entered an era in which we all have everything at the fingertips. Social needs
    have changed. Thus, today communication has changed. Communication opens doors,
    so it is our challenge to learn how to communicate. In Eprogramy we want you to
    learn how to communicate with a new language: The programming language. This language
    allows us to use our PC or notebook to create.


    Maybe the road is difficult and hard, but we will give the reader the tools to
    make learning enjoyable and fruitful. We''ll show  all aspects necessary to learn
    how to program. From the installation of software to the solution of the most
    common programming problems and much, much more. Always with the help of numerous
    examples that will contribute to a better understanding


    We know what we do and believe that you are fully capable of incorporating our
    teachings.


    The doors of the future are here. Let''s go step by step together.


    Let´s get started!


    Eprogramy Team


    # Chapter 1


    # Java Programing Language


    ## History of Java


    Java is a programming language that was first publicly available in 1995, created
    by James Gosling from Sun Microsystems (Sun) in 1991\. Sun Microsystems was then
    inherited by Oracle, and is the corporation in charge of the programming language’s
    faith. Java then became open source available under the GNU General Public License
    (GPL).


    The language gets much of its syntax from C and C++ but isn’t as powerful because
    it requires less for the user to do (less customization but more simple). Something
    like garbage collection, the process of reducing memory being used from the program,
    is automated in Java.


    It was originally designed for interactive television but surpassed the technology
    and design of the digital cable television industry at the time. There were five
    principles that were used in the creation of the Java programming language:


    1.  It must be "simple, object-oriented and familiar"


    2.  It must be "robust and secure"


    3.  It must be "architecture-neutral and portable"


    4.  It must execute with "high performance"


    5.  It must be "interpreted, threaded, and dynamic"


    Another important design goal to note is portability, which is was a key factor
    in Java’s sudden popularity. The portability in this context means that the code
    written in the Java platform can be executed in any combination of hardware and
    operating system.


    Unfortunately, Java has a reputation for being a slower programming language (requiring
    more memory) than other languages like C++ but as time went, Java 1.1 was introduced
    and program execution times were significantly improved.'
