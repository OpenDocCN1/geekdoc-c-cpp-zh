    Java was built exclusively as an object-oriented programming language, which doesn’t
    mean much right now, but it will later in the guide. Object-Oriented programming
    allows for efficient, organized and powerful code to be created and will be seen
    throughout this guide.


    ## What is Java?


    Java is a programming language that has multi-platform capability, meaning that
    you can program Java for any type of device, whether it is an Android phone, a
    Windows computer or an Apple product. Due to the flexibility of Java, it has made
    it one of the most popular programming languages used through the globe by many
    programmers. Java can be used to create web applications, games, windows applications,
    database systems, Android apps and much more.


    Java is different from other programming languages because of its simplicity and
    powerful nature. That combination makes the Java programming language great to
    use. Java is a simple programming language because it doesn’t expect too much
    from the user in terms of memory management or dealing with a vast and complex
    hive of intricate classes extending from each other. Although this doesn’t make
    much sense right now, it will make sense when reaching the point of learning inheritance
    in Java.


    A Java program is run through a Java Virtual Machine (`JVM`) and is essentially
    a software implementation of an Operating System which is used as a way to execute
    Java programs. The compiler (process of converting code into readable instructions
    for the computer) analyzes the Java code and converts it in to byte code, allowing
    the computer to understand the instructions issued by the programmer and execute
    them accordingly.


    When downloading and installing Java, the distribution of the platform comes in
    two ways: the Java Runtime Environment (`JRE`) and the Java Development Kit (`JDK`).
    The `JRE` is essentially the Java Virtual Machine (`JVM`) where the Java programs
    will run on. `JDK` on the other hand is a fully featured Software Development
    kit for Java which includes the `JRE`, compilers, tools, etc.


    A casual user wanting to run Java programs on their machine would only need to
    install `JRE` as it contains the `JVM` which allows Java programs to be executed
    as explained before. On the other hand, a Java programmer must download `JDK`
    in order to actually program Java programs.


    # Chapter 2


    ## Installation of Java


    In order to install Java on to a machine, you must download the following:


    1. IDE for Java Developers

    2. Java `JDK`


    The download of these two tools will put you on your way to becoming a Java programmer.
    An IDE (integrated development environment) is a packaged application program
    used by programmers because it contains necessary tools in order to process and
    execute code. An IDE contains a code editor, a compiler, a debugger, and a graphical
    user interface (`GUI`). There are many different type of IDE’s but the most commonly
    used ones are:


    1. Netbeans

    2. Eclipse


    In this guide, it would be recommended to use `Eclipse` because of its simplistic
    nature. In order to download `Eclipse`, please use the following link:


    [https://eclipse.org/downloads/](https://eclipse.org/downloads/)


    Once you have reached this link, you will have to find this:


    ![https://lh5.googleusercontent.com/L1DhiS0lHF2Wt52-NpfmrM1VQ_f5E3Vsh6h3H123LeuAQWSLLYBowxzHwHVk-Knuma6wifwNVdut28HqFog19-10NB5ACPPLWtwgWgY-xygaV1XsQ3827mdNZEikpnLWPTwMu7g](images/00009.jpeg)


    Then, select either the Windows 32 Bit OS or Windows 64 depending on the type
    of OS / processor you have.


    Once the IDE has been installed, we’ll move on to downloading and installing the
    `JDK` which will allow us to interact with a coding editor in order to execute
    and create Java code.


    To download the `JDK`, go to the following link:


    [http://www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html)


    Upon entering this link, find this figure:


    ![e319d84467.png](images/00010.jpeg)


    Once you’ve installed the `JDK`, you are able to launch `Eclipse` accordingly.


    The folder that was extracted from the `Eclipse` download will contain an `eclipse.exe`
    that can be launched. Once this has been launched, you will be met with the following
    figure:


    ![https://lh3.googleusercontent.com/juAh1PmqbJFvvl4ZXFS1u-Cp7T6aD9nWkz0TwwivjzScPKy7E97FyCrUAU-2mj6wlMgbcGrSlSm5aJwOnb5n1IvxpkyTzf_NCgjhG604yFXhZCBsy3GfC1y_wg6v4gEp4uFNT80](images/00011.jpeg)


    All this prompt is asking for is where to set up the output directory for where
    all the code written by you is going to be saved. Once this has been selected
    accordingly, click “OK” to continue.


    You should now be on this screen (or something similar):


    ![https://lh4.googleusercontent.com/VGvC-jry3vINgfeT3wHIxCNknMZ42pgBwnuoQoVyeW2QyyeIcbrRPvsLebgE8ED5nQvKz4adYyc3smu1QDvifZxfKuu9kxPvBmbA3KOIx8oK5nfz7U5En8o0j_](images/00012.jpeg)


    ### Instructions:


    1. Click `File`

    2. Click `New` → `Java Project`

    ![https://lh4.googleusercontent.com/VGvC-jry3vINgfeT3wHIxCNknMZ42pgBwnuoQoVyeW2QyyeIcbrRPvsLebgE8ED5nQvKz4adYyc3smu1QDvifZxfKuu9kxPvBmbA3KOIx8oK5nfz7U5En8o0j_](images/00013.jpeg)

    3. Type a project name in the `Project name:` field

    4. Click `Finish`

    5. Now right click `src` → `New` → `Class`

    ![00014.jpeg](images/00014.jpeg)

    6. Fill in the `name` field to anything with letters and no special characters.
    Example: `ThisAClass`

    7. Click `Finish`

    8. You will now be presented with a screen that says:


    ```java

    public class ThisAClass {

    }

    ```


    You have successfully completed the installation of Java!


    # Check Out My Other Books


    Are you ready to exceed your limits? Then pick a book from the one below and start
    learning another craft. I can''t imagine anything more fun, fulfilling, and exciting!


    If you''d like to see the entire list of programming guides (there are a ton more!),
    go to:


    >>http://www.amazon.com/Eprogramy/e/B00Y9CTNTO <<


    ![00015.jpeg](images/00015.jpeg) ![00016.jpeg](images/00016.jpeg) ![00017.jpeg](images/00017.jpeg)


    ![00018.jpeg](images/00018.jpeg) ![00019.jpeg](images/00019.jpeg) ![00020.jpeg](images/00020.jpeg)


    ![00021.jpeg](images/00021.jpeg)


    # About the Author


    ![00022.jpeg](images/00022.jpeg)Eprogramy Academy was created by a group of professionals
    from various areas of IT with a single purpose: To provide knowledge in the 3.0
    era.


    Education is changing as well as social needs. Today, in the era of information,
    education should provide the tools to create and to solve problems in a 3.0 world.


    At Eprogramy we understand this and work to give people appropriate responses
    in this context.


    Keeping this objective in mind, we offer a wide variety of courses to teach the
    basics of many programming languages. We believe that anyone can learn a programming
    language and apply the lessons in order to solve problems.


    Possibilities and solutions are endless.


    In short, at Eprogramy we are committed to helping everybody to decodify the messages
    of the future.

