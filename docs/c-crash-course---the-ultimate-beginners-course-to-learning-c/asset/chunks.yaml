    In order to read the content of a file, you can use the same header file and then
    call some functions on it to read the buffer from it.


    You can use the fstream object, and then use the getline function of the object
    to get the lines of characters from the stream and store it in some sort of variable
    that can hold multiple characters; yes, an array of characters.


