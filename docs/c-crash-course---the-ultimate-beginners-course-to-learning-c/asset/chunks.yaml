    ## Recursion


    In programming, there is a technique called recursion which simply is the idea
    of calling a method within itself until a certain condition is met. So basically
    a loop through a method calling itself until it reaches a certain condition. Here
    are a few examples:


    ### Fibonacci


    1, 2, 3, 5, 8, 13…


    1 + 2 = 3


    3 + 2 = 5


    5 + 3 = 8


    8 + 5 = 13


    I will show you both the recursive way of doing this and also the iterative way.


    ### Recursive Way


    #include <iostream>


    int FibonacciT(int n) {


                  if (n == 0)


                                return 0;


                  else if (n == 1)


                                return 1;


                  else


                                return (FibonacciT(n - 1) + FibonacciT(n - 2));


    }


    int main() {


                  FibonacciT(10);


    }


    ### Iterative Way


    #include <iostream>


    int Fibonacci(int element) {


                  int sum = 0;


                  int f = 0;


                  int l = 1;


                  for (int e = 0; e < element; e++) {


                                sum = f + l;


                                l = f;


                                f = sum;


                  }


                  return sum;


    }


    int main() {


                  Fibonacci(10);


    }


    ### Whole Program


    #include <iostream>


    int Fibonacci(int element) {


                  int sum = 0;


                  int f = 0;


                  int l = 1;


                  for (int e = 0; e < element; e++) {


                                sum = f + l;


                                l = f;


                                f = sum;


                  }


                  return sum;


    }


    int FibonacciT(int n) {


                  if (n == 0)


                                return 0;


                  else if (n == 1)


                                return 1;


                  else


                                return (FibonacciT(n - 1) + FibonacciT(n - 2));


    }


