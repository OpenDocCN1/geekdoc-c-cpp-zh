    # Chapter 14


    # Debugging


    Sometimes when programming, your code may give wrong outputs. This is called a
    logic error. Your IDE will not tell you anything is wrong, because technically
    your code follows the rules of C language specification. It’s like writing in
    any language. You may follow the rules of the language, like grammar, structure,
    etc., but your paragraphs don’t necessarily have to make sense. The most common
    method of debugging is simply using std::cout and printing out variables to find
    where values stop making sense. Then you can find the lines that are causing the
    error and debug that. Another tool when debugging is breakpoints. These are points
    that act as “checkpoints”, where the code will stop executing until the programmer
    lets the code continue. In Eclipse, on the line you wish to put a breakpoint on,
    simply move your cursor to the left hand side, right click and press Toggle Breakpoint;
    this way you can slow down your code to find out where the error is occurring
    (or when, if you are doing lots of iterations in a loop).


    One thing that may or may not be considered debugging is optimization. Once you’ve
    written your code, it may be tempting to just leave it and continue on with other
    tasks, but this may not be what you want to do. If your program gets the desired
    results eventually, but it takes a long amount of time, then it is not very good.
    With that being said, there is no single strategy to make code more optimized.
    Sometimes your logic could simply be a long method of doing something, and sometimes
    it could be how you implement that logic. Be wary of creating unused variables,
    as they can take up processing time and memory. It goes through all the variables
    in your code and removes any ones that are no longer valid. For example, if you
    make a for loop, when it completes, that variable is no longer valid, so it should
    be deleted to save on memory. This takes up (small) amounts of processing time.


    Here is an optimization example. Say you want to find the distance from one point
    to another. Math class tells us to use Pythagorean Theorem. But this is rather
    slow. First the computer must square both sides (which is quite expensive performance-wise),
    then add them, and finally square root them. This calculates the accurate distance
    between two points. Another solution though, could be to use “Manhattan distance”.
    This will not get you accurate distances, but it could be good in situations where
    the exact value is not important, and speed is more important. To do Manhattan
    distance, simply absolute (which means to make a value positive, so -7 becomes
    7 and 8 becomes 8) both the x and y components and then add them. This gives you
    an inaccurate distance, but it is much faster than its more accurate counterpart.
    This is particularly good when you are guessing the fastest route. Rather than
    constantly calculating the distance accurately, Manhattan distance is a cheap
    alternative and will get you a near enough distance.


