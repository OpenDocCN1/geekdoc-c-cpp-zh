    # Chapter 1: C++ Programming Language


    ## History of C

    C programming language has been in the game since the early developments on UNIX
    operating systems. Although mostly know Dennis Ritchie for the development of
    C programming language but not just Dennis was involved. Other major names, such
    as Ken Thompson is also the team members, and the colleagues also helped them
    to develop a new language based on Assembly language on PDP-7. The developers
    wanted to re-write the operating system in `B` which was incapable of supporting
    a few features, thus this led the team to development of a new programming language
    `C`.


    Most developers and programmers say that it was `C` in which first compiler was
    written, which is not true at all. First compiler was written in `Assembly` language
    and Dennis used bootstrapping, to write basic compiler needs in `Assembly` then
    create another compiler in `C` language. Thus, the developers are also correct
    in their perspective; but it was `Assembly` language in which first compiler was
    written.


    `C` is a very low-level programming language and the first compiler of `C` was
    written in `assembly` language. Although `C` was written after `B` programming
    language (thus the name) but the first compiler for it was written in `Assembly`
    language. Some might say it was written in `C` itself but that is not the case
    as per what Dennis Ritchie has himself written. The name of the first compiler
    was “typesetter C”.


    Since then, most of the programming features and add-ons have been added to `C`
    to make it more robust and agile. Exceptions and other similar techniques have
    been added to the language to check when there are errors in the code execution.
    More efficiency has been added to overcome the load of the feature of `OOP` over
    `C` language.


    Dennis Ritchie himself co-published the “C Programming Language” book which served
    as the reference book for many years to the developers and programmers. Later
    version covers `ANSI C` standard of the language.


    I hope that introduction would guide you enough to understand the importance of
    `C` in programming languages. Now let us learn how to develop applications in
    `C`.


    ## What is C?

    `C` is a low-level programming language and was designed to be a platform-independent
    language. `C` programming language does not support Object-oriented programming
    approach, where as other similar and derivative languages such as `C++` and `C#`.
    `C` has mainly been used for developing operating systems, kernels and other low-level
    hardware drivers. Since `C` provides more access to hardware, it is favorite language
    of hardware driver manufacturers and device drivers.


    `C` does not support multiple inheritances from different parent classes. The
    reason for not including multiple inheritances was to avoid having messy code
    and making the language simpler to work with.


    `C` is different from other programming languages because of its simplicity and
    powerful nature. That combination makes `C` programming language great for personal,
    commercial and enterprise use. Since it is a low-level programming language, it
    provides more support for programming the software applications that require more
    access to hardware resources and allows working with memory-management. It is
    a great feature if you want to handle all of the objects in the memory to remove
    or access new memory locations and to remove the objects from the memory when
    they are no longer required. If you are a game developer, then you would know
    the importance of memory-management. High-level programming languages do not support
    such functionalities.


    Considering that `C#` and `C` are similar in some level and structures, and that
    `C#` and `Java` are similar in some structures to an extent, it is also worth
    noting that if you know some `C#` or `Java`, you will be able to easily pick up
    on how `C` works, apart from a few features only that are available only in low-level
    programming languages. If you are a beginner, this guide will help you get started
    so don’t worry.


    `C` is widely used as a programming language due to the following key notes:


    1. Compiler portability.

    2. Standard library concept; header files etc.

    3. Wide variety of operators for different functions.

    4. Intuitive syntax.

    5. Direct contact with hardware.


    Due to these important benefits, programmers have put their faith in `C` language
    since its very initial stages. Latest versions of `C` have been developed and
    released as per standards which fix most of the bug fixes in compiler and/or program
    structures and are released as `C89`, `C99`, and `C11` etc.


    Whether you have programmed before in another language, want to learn more about
