    让我们开始吧！


    Eprogramy 团队


    # 第 1 章：C++ 编程语言


    ## C 的历史

    C 编程语言自 UNIX 操作系统开发早期起就已历史舞台。虽然大多数人知道丹尼斯·里奇（Dennis Ritchie）开发了 C 编程语言，但参与的人不仅仅是丹尼斯。其他主要人物，如肯·汤普森（Ken
    Thompson）也是团队成员，同事们也帮助他们基于 PDP-7 汇编语言开发了一种新语言。开发者们想用 `B` 语言重写操作系统，但 `B` 无法支持某些功能，因此导致团队开发了新的编程语言
    `C`。


    大多数开发者和程序员说第一个编译器是用 `C` 语言编写的，但这完全不是事实。第一个编译器是用 `Assembly`（汇编）语言编写的，丹尼斯使用了自举技术，先用
    `Assembly` 编写基础编译器的需求，然后用 `C` 语言创建了另一个编译器。因此，开发者们的观点也是正确的；但第一个编译器确实是用 `Assembly`
    语言编写的。


    `C` 是一种非常底层的编程语言，`C` 的第一个编译器是用汇编语言编写的。虽然 `C` 是在 `B` 编程语言之后编写的（这也是名字的来源），但它的第一个编译器是用
    `Assembly` 语言编写的。有些人可能会说它是用 `C` 编写的，但根据丹尼斯·里奇本人的描述，事实如此。第一个编译器的名为“typesetter C”。


    从那时起，`C` 添加了许多编程功能和插件，使其变得更加健壮和灵活。语言中增加了异常或其他类似技术，以便在代码执行出现错误时进行检查。为了克服 `OOP`
    特性对 `C` 语言带来的负担，还增加了效率。


    丹尼斯·里奇本人合著了《C 程序语言》一书，多年来一直是开发者和程序员的参考书。后续版本涵盖了该语言的 `ANSI C` 标准。


    我希望这段介绍能足够引导你理解 `C` 在编程语言中的重要性。现在，让我们学习如何用 `C` 开发应用程序。


    ## 什么是 C？

    `C` 是一种底层编程语言，被设计为一种平台无关的语言。`C` 语言不支持面向对象的编程方法，而其他类似的派生语言如 `C++` 和 `C#` 则支持。`C`
    主要用于开发操作系统、内核和其他底层硬件驱动程序。由于 `C` 提供了对硬件的更多访问，它是硬件驱动程序制造商和设备驱动程序的最爱语言。


    `C` 不支持来自不同父类的多继承。不包含多继承的原因是为了避免代码混乱，并使语言更易于操作。


    `C` 与其他编程语言不同之处在于它的简单性和强大性。这种结合使得 `C` 编程语言非常适合个人、商业和企业使用。由于它是一种底层编程语言，它为需要更多硬件资源访问的软件应用程序编程提供了更多支持，并允许进行内存管理。如果你想处理内存中的所有对象，以移除或访问新的内存位置，并在对象不再需要时从内存中删除它们，这是一个强大的特性。如果你是一个游戏开发者，你就会知道内存管理的重要性。高层编程语言不支持此类功能。


    考虑到 `C#` 和 `C` 在某些层面和结构上相似，且 `C#` 和 `Java` 在某些结构上也有程度相似，值得注意的是，如果你熟悉一些 `C#` 或
    `Java`，你将能够轻松掌握 `C` 的工作原理，除了少数仅在底层编程语言中提供的特性之外。如果你是初学者，本指南将帮助你入门，所以不要担心。


    `C` 被广泛用作编程语言归因于以下关键要点：


    1. 编译器的移植性。

    2. 标准库概念；头文件等。

    3. 适用于不同函数的各种操作符。

    4. 直观的语法。

    5. 与硬件直接接触。


    由于这些重要的益处，程序员们从最初阶段起就对 `C` 语言充满了信任。`C` 的最新版本根据标准开发和发布，修复了编译器和/或程序结构中的大多数 Bug，并以
    `C89`、`C99` 和 `C11` 等格式发布。


    无论你以前是否用其他语言编写过程序、想了解更多关于 `C` 的知识，还是从 `C` 开始的初学者，本指南都能涵盖


    # 第 2 章：为 C 设置环境


    为了在机器上为 `C` 设置编程环境，你必须下载以下内容：


    - `Visual Studio 2015`（或 `Visual Studio 2013`）社区版，好处是它是免费提供的，并且包含了 Visual Studio
    专业版的所有功能。

    - `Microsoft Foundation Classes for C++`，你可以修改当前的安装并选择 `Microsoft Foundation Classes
    for C++` 然后更新产品。我们将使用一个 `C++` 项目作为 `C` 程序的核心项目。


