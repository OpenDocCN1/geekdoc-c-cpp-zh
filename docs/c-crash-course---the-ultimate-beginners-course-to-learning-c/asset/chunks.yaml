  trans: "\n\n• 点击 `New` → `Project`\n\n![](img/00004.jpeg)\n\n1. 在 `Templates Visual\
    \ C` 下选择 `Empty Project` 选项（因为我们需要理解代码是如何运行的，所以空项目会更容易操作）。\n2. 为了组织起见，请确保勾选了 `Create\
    \ directory for solution`（为解决方案创建目录）。\n3. 在 `Name:` 字段中输入项目名称，并为你的项目设置位置。（例如：`HelloWorld`）。我使用了\
    \ `CppProject`。\n4. 点击 `Ok` 继续。\n5. 现在你将看到此页面，如果你已经看到了，说明你完成了！否则，请按照步骤 1 到 4 重操作，以确保操作正确，或者联系\
    \ Visual Studio 团队获取有关你的产品和机器的支持。\n\n![](img/00005.jpeg)\n\n由于我们的项目是一个空项目，我们不会在项目中看到任何头文件或\
    \ C 文件。我们可以立即向项目添加新文件。\n\n到目前为止，你已经成功完成了 C 语言的安装并搭建了编写第一个 C 程序的环境！接下来我们将学习 C 语言的程序结构。\n\
    \n# 第 3 章\n\n# C 语言结构\n\n现在我们将通过示例源代码文件学习 C 作为一种编程语言的结构。要创建一个新的源代码文件，你应该右键点击项目名称并选择\
    \ `Add`。在 `Add` 菜单中，你应该选择 `New Item` 并选择 `C file (.cpp)`，按你喜欢的名称命名。我使用 `MainFile.cpp`\
    \ 作为文件名。\n\n![](img/00006.jpeg)\n\n该文件目前是空的，因为它不是模板文件（意味着它初初不包含任何功能）。\n\n我们可以向其中添加更多代码来使其运行。但首先，我们需要理解\
    \ C 程序的格式（结构）。\n\n```c\n#include <header.h>\n\nint main() {\n    // 语句\n    return\
    \ 0;\n}\n```\n\n上面的代码其实非常简单，但必须分享更具技术性的描述，以便你理解它是如何运作的。\n\n1. `Include` 指令用于向你的文件添加头文件（我将在单独的模块中讨论头文件）。\n\
    2. 接下来是 `main` 函数，它是代码的入口点。当代码执行时，它首先进入此函数，执行其中编写的语句，并在执行后终止。\n3. 大多数微软产品要求你的\
    \ C 程序为整数返回类型，并且必须包含 `return 0;`。\n4. C 中的双斜杠 (`//`) 表示注释块。注释是语言中编译器忽略的特殊类型行。因此，它们用于与其他开发者共享函数、语句或类似内容的描述。编译器不会读取它，简单地忽略这些行。\n\
    \n现在让我们写一段真正执行操作的代码，写一段输出“Hello world”的代码（确实是每个程序员的示例项目！）。\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nvoid main(void) {\n    printf(\"Hello world\\n\");\n  \
    \  system(\"pause\");\n}\n```\n\n上面的代码示例将并在屏幕上显示 Hello world，`printf` 是将对象（基于字符串的\
    \ Hello world）发送到输出流的命令。`stdio` 是执行此函数所需的头文件，它包含了当调用此函数时必须执行的函数声明和函数体。注意：`system(\"\
    pause\")` 仅用于停止执行并查看输出，否则不是必须的。\n\n![](img/00007.jpeg)\n\n第一行 `#include <stdio.h>`\
    \ 使用了特殊的关键字 `include`，它配合 `#`（预处理器指令）一起使用，允许程序员在 C 源文件中导入类和其他函数，而这些内容在创建 C 语言新程序时默认是不存在的。在关键字\
    \ `#include` 之后，程序员指定 C 库中的特定头文件。在这种情况下，我们指定了 `stdio` 头文件（代表标准输入输出），我们也可以轻松地在源文件中包含其他头文件，以便在应用程序中使用它们的函数或其他对象。\n\
    \n默认情况下，当启动 C 程序时，C 库提供的工具和函数对于任何需要创建的基础程序提供了最少限的支持。如果程序员出于某种原因想要使用比基本功能更多的功能，他们可以轻松地使用\
    \ `#include` 关键字来为自己在 C 环境中提供更多可工作的工具。\n\n你还会注意到，每个语句后面都有一个分号（`;`）的趋势。分号就像英语句子中的句号（例如“Tim\
    \ owned a dog.”）。当编译器遍历程序并为执行做准备工作时，它会检查分号，以便它知道一个特定语句何时结束，一个新语句何时开始。注意，在预处理器指令命令后不需要分号。此标记（`;`）被称为语句终止符，是每个语句后都要求的标记，否则编译器会在程序语法中引发错误。\n\
    \n代码中的下一个元素是函数调用。在 C 中，`main` 函数用于初始执行，你将所有代码写在这个函数中，代码执行后你终止程序或：\n\n1. 顺序\n2.\
    \ 选择\n3. 迭代\n4. 函数调用\n\n函数可以在另一个函数内部调用。注意命名空间周围有大括号。`namespace`（命名空间）通过使用 `namespace`\
    \ 来定义，我们很快会详细讨论这一点。现在让我们转换代码。\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    namespace sample {\n    // 命名空间内的代码\n}\nvoid main(void) {\n    printf(\"Hello\
    \ world\\n\");\n    system(\"pause\");\n}\n```\n\n我们的命名空间名称为 `sample`，并用于主函数。你可以将命名空间视为包含对象和函数的包。命名空间提供了基本的作用域。\n\
    \n# 第 4 章\n\n# C 中的结构体\n\n你在示例代码中需要的下一个内容是结构体（structs）。C 自带了开发者所需的大多数数据类型。但有时，你需要为每个用户、函数或其他程序封装数据类型。在这种状态，那些数据类型并不足够。对于此类对象你应该使用类（classes）。结构体使用\
    \ `struct` 关键字进行定义。\n\n让我们先写一个 C 中的类示例代码，看看它是什么样的，例如我们需要一个存储人员年龄和重量的结构体。\n\n```c\n\
    #include <stdio.h>\n#include <stdlib.h>\n\nstruct person {\npublic:\n    int age;\n\
    \    double weight;\n} identifier;\n\nvoid main(void) {\n    printf(\"%d\", identifier.age);\n\
    }\n```\n\n上面的类可以持有人的对象的详情，并可以存储年龄（整数类型）和重量（浮点值）。让我们理解上述代码块中的内容。\n\n`public` -\
    \ 定义类成员的作用域，以及其他类是否有权访问类成员。这现在可能没有意义，但学习“继承和多态”，你将更好地理解它的含义。\n\n`struct` - 结构体可以被认为是一种对象的“数据类型”。\n\
    \n`person` – 这个重要声明中的这个元素是 `person`，它仅仅是用户为数据类型自定义的名称。你可以称它为任何名称，因为它所做的只是给这个“部分”或“类”起名。\n\
    \n"
- fmt: "\nAnother thing you must be scratching your head looking at is the curly braces:\
    \ `{` and `}`` - all that the curly brace does is simply tells the compiler when\
    \ a specific scope ends and when it starts. This could be thought of as when someone\
    \ is writing an essay and they have to start their sentences with the appropriate\
    \ words or indent their paragraphs.\n\nOne thing to note is that the spacing in\
    \ code does not matter at all in terms of it working or not. However, it is conventional\
    \ and efficient to have properly spaced code so that you and other programmers\
    \ can properly read and understand it more easily. You will learn how to space\
    \ as you read more sample code. Eventually, you will start to notice the trend\
    \ in how conventional spacing works in programming.\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nstruct person {\npublic:\n    int age;\n    double weight;\n\
    } identifier;\n\nvoid main(void) {\n    printf(\"%d\", identifier.age);\n}\n```\n\
    \nAs shown in the above sample code, two curly braces are communicating with each\
    \ other depending on their occurrence. What-ever is in between them is the code\
    \ block of name `person`. The sample applies to the curly braces which are in\
    \ bold and underlined to indicate that they are separate section dividers for\
    \ the section within the parent section. The parent section is again, considered\
    \ a `struct`, where-as the section within the parent section, is considered a\
    \ sub-section, or a sub-class or the formal term, a member.\n\nA method is essentially\
    \ a code block which also has its own special elements, similar to a class but\
    \ more specific. This contains 3 elements: A return type, a name, and parameters.\
    \ The return type and the parameters are something you will understand when learning\
    \ about Methods, along with Inheritance and Polymorphism. An example of a function\
    \ can be read above.\n\nThe contents of this method will also be introduced when\
    \ learning about “ Variables later on in this guide.\n\nThe console is where the\
    \ program’s output is placed in order for the programmer to test his/her program.\
    \ So as a general guess you would say that a console is the application that is\
    \ the output for your source code. Basically it is the basic type of application\
    \ that a developer can create using the minimal use of 5-10 lines.\n\nA string\
    \ of text must be surrounded by quotation marks in order for the program to know\
    \ that it has to print out text, instead of an actual variable, like `x`. The\
    \ reason the user couldn’t just say: `printf(“The number is x”);` is because the\
    \ program won’t know if `x` is a variable or not because it is surrounded by quotation\
    \ marks, the program would read anything within quotation marks to be a piece\
    \ of text, and not actually a container holding a value. Therefore, the `x` must\
    \ be outside of the quotation marks like, `printf(“the number is %d”, x);`. Which\
    \ would not be formatted properly and then used as the output.\n\nThe final element\
    \ to understand in this code is `system(\"pause\")` – this line simply tells the\
    \ console not to close immediately and to wait for the user to press a key or\
    \ exit the console implicitly. If this line wasn’t there, the console would print\
    \ out the output properly but only for a split second before the console would\
    \ close itself down before terminating. You should also know that this command\
    \ is provided only on Windows-based operating systems and not on other systems.\
    \ For other use, you would use `getchar` to pause the console application; technically\
    \ to get the input from user.\n\n## Commenting\n\nThe final fundamental concept\
    \ to understand in a programming language, although not necessary, is commenting.\
    \ It can greatly help you and other programmers around you if you ever forget\
    \ how the program works.\n\nThis concept is used by programmers to take the chance\
    \ to explain themselves in their code, using simple-plain English text. When a\
    \ compiler is processing the code, it will always ignore comments as it isn’t\
    \ actually real source code for the program but just a description that a programmer\
    \ has added to the statements. It is simply explanation to code that was written\
    \ to help people understand what was programmed. In order to write a comment,\
    \ you must use `//` or `/*` and `*/` .\n\nThe `//` symbol is used to comment one\
    \ line. For example, if you were to make a variable and explain what the variable\
    \ was going to be used for, you would do the following:\n\n```c\nint x = 5; //\
    \ this variable is going to be used to find the total money\n```\n\nThe compiler\
    \ will ignore the commented line, but will process `int x = 5;`. You can’t use\
    \ the `//` symbol with the following:\n\n```c\nint x = 5; // this variable is\
    \ going to be\nused to find the total money\n```\n\nThis is because the `//` symbol\
    \ is only used for one line, and not two. You are able to do:\n\n```c\nint x =\
    \ 5;\n// this variable is going to be used to find the total money\n```\n\nAs\
    \ long as the comment is one line, it is fine. Anything after that symbol for\
    \ the line is commented.\n\nThe other technique which does the same thing as `//`\
    \ except it supports multi commenting use. You must start the comment with `/*`\
    \ and end it with `*/` .\n\nExample:\n\n```c\nint x = 5; /* this variable is going\
    \ to be\nused to find the total money */\n```\n\nUp to this stage the basics have\
    \ been covered and you are expected to have basic understanding of the programs\
    \ and their structures.\n\n# Chapter 5\n\n# C Variables\n\n## What is a Variable?\n\
    \nA variable is essentially a storage in memory (RAM) that holds a certain type\
    \ of data. It is named by an identifier, and is used. You can write information\
    \ to it, take information from it, and even copy the information to another.\n\
    \n## Variable Types\n\nIn C, a variable has a specific type, which would determine\
    \ what size it has. The language defines following types of variables:\n\n###\
    \ Global Variables\n\nInstance variables are declared within a class but outside\
    \ of any method. An instance variable is visible to all methods, constructors\
    \ and blocks, within the class it is declared in. By giving a variable the keyword\
    \ `public`, it can then be accessed by sub-classes. However, it is recommended\
    \ to set a variable’s access modifier to `private` when possible.\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nint num = 10;\n\nvoid main(void) {\n    printf(\"\
    %d\", num);\n    system(\"pause\");\n}\n```\n\nIn this example, we declare `num`\
    \ outside of any method, and can easily access it.\n\n### Static Variables\n\n\
    Static Variables are declared with the keyword `static`. If a variable is static,\
    \ only one instance of it will exist, regardless of how many instances of the\
    \ object are called. Static variables are rarely used except for constant values,\
    \ which are variables that are never changed or another object initialization\
    \ is not intended.\n\nExample:\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nint getnum() {\n    static int num = 0;\n    num++;\n    return num;\n}\n\n\
    void main(void) {\n    printf(\"%d\", getnum());\n    system(\"pause\");\n}\n\
    ```\n\nIn this example, we declare an int called `num` and set it to be static.\
    \ This means that it can be accessed from within sub-classes, only one instance\
    \ of it can ever exist, and the value can change. Notice that no matter how many\
    \ times you call the function, num would never have old value instead value would\
    \ be incremented all the times.\n\n### Local Variables\n\nLocal variables are\
    \ only declared within methods, blocks or constructors. They are only created\
    \ when the method, block or constructor is created, and then destroyed as soon\
    \ as the method ends. You can only access local variables within the method, block,\
    \ or constructor it is called, and are not visible outside of where it is called.\n\
    \nExample:\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n```\n"
