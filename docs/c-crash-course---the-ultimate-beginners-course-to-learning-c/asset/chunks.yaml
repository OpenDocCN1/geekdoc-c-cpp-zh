  trans: "\n另一个让你在看代码时一定感到困惑的东西是大括号：`{` 和 `}`——大括号的作用仅仅是告诉编译器特定作用范围何时结束以及何时开始。这可以被比作某人在写文章时，必须用恰当的词开头或者对段落进行缩进。\n\
    \n需要注意的是的一点是，代码中的空格对于程序的运行与否完全没有影响。然而，保持良好的间距是惯例且高效的，这样你和其他程序员就可以更方便地阅读和理解它。你将在阅读更多示例代码时学习如何处理间距。最终，你将开始注意到编程中惯例间距的趋势。\n\
    \n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nstruct person {\npublic:\n\
    \    int age;\n    double weight;\n} identifier;\n\nvoid main(void) {\n    printf(\"\
    %d\", identifier.age);\n}\n```\n\n如上面的示例代码所示，两个大括号根据它们出现的位置相互通信。它们之间的任何内容都是名为\
    \ `person` 的代码块。示例中使用了**加粗并带有下划线**的大括号，这表示它们是父部分内该部分的独立分隔符。父部分再次被视为 `struct`，而父部分内部的部分被视为子部分、子类，或者正式术语：成员。\n\
    \n方法（Method）本质上是一个代码块，它也有它自己的特殊元素，类似于类但更具体。它包含三个元素：返回类型、名称和参数。返回类型和参数你将在学习方法、继承和多态时理解。你可以在上文的示例中看到一个函数的示例。\n\
    \n此方法的内容将在指南稍后学习“变量（Variables）”时介绍。\n\n控制台（Console）是程序输出所在的地方，以便程序员测试其程序。所以从通俗的理解来说，你可以说控制台是作为你的源代码输出结果的应用程序。基本上，它是开发者使用最少\
    \ 5-10 行代码就能创建的基本类型应用程序。\n\n文本字符串必须包裹在引号中，以便程序知道它必须打印文本而不是实际的变量（如 `x`）。用户不能直接说：`printf(“The\
    \ number is x”);` 的原因是程序不知道 `x` 是否为变量，因为它被包裹在引号中，程序会将引号内的任何内容都视为文本，而不是存储数值的实际容器。因此，`x`\
    \ 必须在引号之外，例如 `printf(“the number is %d”, x);`。这样才能被正确格式化并作为输出。\n\n这段代码中需要理解的最后一个元素是\
    \ `system(\"pause\")`——这一行简单地告诉控制台不要立即关闭，而是等待用户按键或隐式退出控制台。如果没有这一行，控制台会正常打印输出，但在程序终止前只有一秒钟就会自动关闭。你应该知道，此命令仅在\
    \ Windows 操作系统上提供，而在其他系统上没有。对于其他用途，你会使用 `getchar` 来暂停控制台应用程序；技术上是从用户处获取输入。\n\n\
    ## 注释\n\n编程语言中理解的最后一个基础概念（尽管不是必须）是注释。如果你忘记了程序是如何工作的，注释对你以及周围的程序员将非常有帮助。\n\n程序员使用这个概念是为了利用机会在代码中使用简单的英文文本对自己进行说明。当编译器处理代码时，它总是忽略注释，因为注释实际上不是程序真实的源代码，只是程序员添加到语句中的描述。它仅仅是对代码的解释，旨在帮助人们理解编写了什么程序。要写注释，你必须使用\
    \ `//` 或 `/*` 和 `*/`。\n\n`//` 符号用于单行注释。例如，如果你创建一个变量并解释该变量的用途，你可以这样做：\n\n```c\n\
    int x = 5; // this variable is going to be used to find the total money\n```\n\
    \n编译器将忽略被注释的行，但会处理 `int x = 5;`。你不能在以下情况使用 `//` 符号：\n\n```c\nint x = 5; // this\
    \ variable is going to be\nused to find the total money\n```\n\n这是因为 `//` 符号只用于一行，而不是两行。你可以这样做：\n\
    \n```c\nint x = 5;\n// this variable is going to be used to find the total money\n\
    ```\n\n只要注释是单行的，就可以。该行中该符号后的任何内容都会被注释。\n\n另一种技术与 `//` 作用相同，但它支持多行注释。你必须以 `/*`\
    \ 开始注释，并以 `*/` 结束。\n\n示例：\n\n```c\nint x = 5; /* this variable is going to be\n\
    used to find the total money */\n```\n\n到目前为止，基础知识已经涵盖，你应该对程序及其结构有了基本的理解。\n\n\
    # 第 5 章\n\n# C 变量\n\n## 什么是变量？\n\n变量本质上是内存（RAM）中的存储空间，持有特定类型的数据。它由标识符命名并被使用。你可以向它写入信息，从它获取信息，甚至将其复制到另一个地方。\n\
    \n## 变量类型\n\n在 C 中，变量有特定的类型，这决定了它的尺寸。语言定义了以下类型的变量：\n\n### 全局变量\n\n实例变量在类内部但在方法之外声明。实例变量对于声明它的类的所有方法、构造函数和块都是可见的。通过给变量\
    \ `public` 关键字，它可以被子类访问。然而，尽可能将变量的访问修饰符设置为 `private`。\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nint num = 10;\n\nvoid main(void) {\n    printf(\"%d\",\
    \ num);\n    system(\"pause\");\n}\n```\n\n在这个示例中，我们在方法之外声明了 `num`，并轻松地访问它。\n\n\
    ### 静态变量\n\n静态变量使用 `static` 关键字声明。如果一个变量是静态的，无论调用多少个对象实例，只存在一个实例。静态变量很少使用，除非是常量（即不会改变的变量）或不打算进行对象初始化。\n\
    \n示例：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nint getnum() {\n   \
    \ static int num = 0;\n    num++;\n    return num;\n}\n\nvoid main(void) {\n \
    \   printf(\"%d\", getnum());\n    system(\"pause\");\n}\n```\n\n在这个示例中，我们声明了一个名为\
    \ `num` 的整数并将其设置为静态。这意味着它可以从子类内部访问，永远只有一个实例，且值可以改变。注意，无论你调用函数多少次，num 都不会有旧值，而是每次都会递增。\n\
    \n### 局部变量\n\n局部变量仅在方法、块或构造函数内部声明。它们只在方法、块或构造函数创建时创建，并在方法结束时立即销毁。你只能在调用它的方法、块或构造函数内部访问局部变量，在调用处之外是不可见的。\n\
    \n示例：\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n```\n"
- fmt: "\n```c\nvoid main(void) {\n    int num = 0;\n    printf(\"%d\", num);\n  \
    \  system(\"pause\");\n}\n```\n\nIn this example, a variable named `num` is called\
    \ and the object is removed as soon as the `main` function ends. That variable\
    \ only exists within the context of `main`, and cannot be called or accessed directly\
    \ outside of that method.\n\n## Data Types\n\nAs said above, variables are used\
    \ to store data. C has multiple built in variable data types that are used to\
    \ store predefined types of data. These data type are called primitive data types.\
    \ These data types are the most basic data types that are in the programming language.\
    \ You can also create your own data types, which we will go over later. C has\
    \ following primitive data types.\n\n- **short**: The `short` data type is a 16-bit\
    \ signed two’s complement integer. Its maximum range is 32,767 and its minimum\
    \ value is -32,768. A `short` is used to save memory, or to clarify your code.\n\
    Example:\n```\nshort s = 1; // has a value of one\n```\n\n- **int**: The `int`\
    \ data type is a 32-bit signed two’s complement integer. Its maximum value is\
    \ 2,147,483,647 (231 -1), and its minimum value is -2,147,483,648 (-231). `int`\
    \ is the most common used data type for integral numbers, unless memory is a concern.\n\
    Example:\n```\nint i = 1; // has a value of one\n```\n\n- **long**: The `long`\
    \ data type is a 64-bit signed two’s complement integer. Its maximum value is\
    \ 9,223,372,036,854,775,807 (2^63 -1), and its minimum value is -9,223,372,036,854,775,808\
    \ (-2^63). This data type is used when a larger number is required to work with\
    \ than would be possible with an `int`.\nExample:\n```\nlong l = 1L; // has a\
    \ value of one with the letter L\n```\n\n- **float**: The floating point data\
    \ type is a double-precision 64-bit IEEE 754 floating point. The min and max range\
    \ is too large to discuss here. A `float` is never to be used when precision is\
    \ necessary, such as currency.\nExample:\n```\nfloat f = 1200.5f; //value of one\
    \ thousand two hundred, and a half\n```\n\n- **double**: The double point data\
    \ type is a double-precision 64-bit IEEE 754 floating point. It is often the data\
    \ type of choice for decimal numbers. The min and max range is too large to discuss\
    \ here. A `float` is never to be used when precision is necessary, such as currency.\n\
    Example:\n```\ndouble d = 1200.5d; // value of one thousand two hundred, and a\
    \ half\n```\n\n- **bool**: A `bool` data type represents one bit of data. It can\
    \ contain two values: `true` or `false`. It is used for simple flags to track\
    \ true or false conditions.\nExample:\n```\nbool b = true; // has a value of true\n\
    ```\n\n- **char**: The `char` data type is a single 16-bit Unicode character.\
    \ Its minimum value is “\\u0000” (or 0) and its maximum value is “\\uffff” (or\
    \ 65,535 inclusive)\nExample:\n```\nchar c = 'w'; // returns the letter \"w\"\n\
    ```\n\nAnother commonly used data type is called `string`. `string` is not a primitive\
    \ data type, but is a very commonly used data type which stores strings of text.\
    \ Technically a string is an array of character type data.\nExample:\n```\nstring\
    \ cat = \"meow\"; // sets value of cat to \"meow\"\n```\nThis example gets a string\
    \ named `cat`, and sets it to the string of characters that spell out “meow”.\n\
    \n## Declaring a Variable\n\nThe declaration of a variable has three parts to\
    \ it: the data type, variable name, and the stored (or initial) value. Note that\
    \ there is a specific convention and set of rules to be used when naming variables.\
    \ A variable name can be any length (less than 30) of Unicode letters and numbers,\
    \ but it must start with a letter, the dollar sign `$` or an underscore `_`, else\
    \ it would return a syntax error.\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\
    \nvoid main(void) {\n    int $num = 0;\n    printf(\"%d\", $num);\n    system(\"\
    pause\");\n}\n```\n\nIt is also common naming convention to start the name with\
    \ a lowercase letter, followed with each word starting with a capital letter.\
    \ For example, if the variable name was `theNum`, the first word `the` starts\
    \ with a case, and each following word `Name` starts with a capital letter.\n\
    Example:\n```\nint theNum = 123; // value of 123\n```\nIn the example above, the\
    \ data type is `int`, the name of the variable is `theNum`, and the value stored\
    \ inside is 123. You can also declare a variable without storing a value in it.\n\
    Example:\n```\nint num; // no value\n```\nYou can do this if you choose to declare\
    \ it later.\n\n## Using a Variable\n\nAfter a variable is declared, you can then\
    \ read its value, or change it. After the variable was initially declared, you\
    \ can reference it only by its name; you only need to declare its data type when\
    \ you are declaring the variable.\nExample:\n```\nname = 2; // sets the \"name\"\
    \ to a value of 2\n```\nThe example above sets the value of `name` to 2. Notice\
    \ how I never restated the data type.\nExample:\n```\nprintf(\"%d\", name); //\
    \ prints the value of name to the console\n```\nThis example reads the value of\
    \ `name` and writes it to the console output. Variables can also be added together:\n\
    Example:\n```\nint a; // no value\nint b = 1; // value of one\nint c = 2; // value\
    \ of two\na = b + c; // sets a to the value of b + c\n```\nIn the example above,\
    \ we set the value of `a`, to equal the value of `b` and `c` added together. The\
    \ addition sign `+` is known as an operator, which we will go over in the following\
    \ section.\n\nIt is also possible to combine values of variables that are different\
    \ data types to a extent extent\nExample:\n```\nint a; // no value\nfloat b =\
    \ 1; // value of one\nint c = 2; // value of two\na = (int) (b + c); // sets the\
    \ \"a\" to a value of b + c\n```\nThis example is just like the one before it,\
    \ except that we changed the data type of `b` from `int` to `float`. The only\
    \ difference when adding them together is that we had to add something called\
    \ a “cast” to the equation. What a cast does is it simply lets the compiler know\
    \ that the value of `(b + c)` should be of the datatype `int`. Note that for this\
    \ example, if the value of `b + c` were to equal a decimal number (for example\
    \ 3.2), the value of `a` would not be 3.2 but rather 3, because `int` does not\
    \ support decimals.\n\n## Assignment\n\nUsing what we learned about variables,\
    \ we can now create a simple calculator to add numbers together for us. The first\
    \ thing we will want to do is declare 3 variables: one to store the value, one\
    \ to represent the first number we want to add, and one to represent the second\
    \ number we want to add. We will declare these variables as `double` so that we\
    \ can add decimal numbers:\n```c\ndouble a = 0; // stores value of addition\n\
    double b = 3.55; // first number to add\ndouble c = 52.6; // second number to\
    \ add\n```\nNext, we will simply set the value of `a`, to equal the value of `b`\
    \ and `c` combined, and then print out the value of `a`.\n```c\na = b + c;\nprintf(\"\
    %d\", a);\n```\nIf you run the program now, it should print out 56.15. You now\
    \ have just created a very simple calculator.\n\n## Pointer-Types\n\nIn C, a programmer\
    \ can use another type of data; objects. That is known as pointers (or pointer-types).\
    \ Pointers are special types of variables as they consume the same type and operations.\
    \ But, they are used to store the addresses of objects in the memory. You can\
    \ define your own pointers to any variable type, `int`, `char`, `float` etc. The\
    \ pointer-type variable doesn’t exist itself, instead is just a reference to the\
    \ other variable in the memory. That is why it is 32-bit in size.\n\nHave a look\
    \ at the following code:\n\n```c\n#include <stdio.h>\n```\n"
