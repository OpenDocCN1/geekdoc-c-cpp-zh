    在这个示例中，我们检查 `a` 是否等于 `b` 且 `a` 是否等于 10。如果这两个条件都返回 `true`，则结果为 `true`。如果其中一个为 `false`，则结果返回\
    \ `false`。\n\n- `||` 此运算符被称为逻辑**或**（OR）运算符。如果第一个操作数或第二个操作数为 `true`，则语句将返回 `true`。这意味着如果第一个操作数返回\
    \ `false` 而第二个为 `true`，语句将返回 `true`，反之亦然。如果两个操作数都为 `true`，语句也会返回 `true`。本质上，使用\
    \ OR 运算符时至少有一个操作数返回 `true`。\n\n示例：\n```c\nint a = 10;\nint b = 20;\nif (a == b\
    \ || a == 10) {\n              // Equal\n}\n```\n在这个示例中，我们检查 `a` 是否等于 `b` 或者 `a`\
    \ 是否等于 10。在这种情况下，`a` 等于 10 但 `a` 不等于 `b`。由于其中一个操作数为 `true`，整个语句将返回 `true`。因此程序将在控制台上打印\
    \ `a is equal to 10 or b`。\n\n- `!` 此运算符被称为逻辑**非**（NOT）运算符。它用于反转其操作数的逻辑状态。它可以与其他任何操作数配合使用以反转其输出。如果一个操作数返回\
    \ `true`，应用逻辑非运算符后，该操作数将返回 `false`。\n\n示例：\n```c\nint a = 10;\nint b = 20;\nif\
    \ (!(a == b)) {\n              // Condition met\n}\n```\n在这个示例中，我们检查 `a` 的值是否等于\
    \ `b`。由于 `a` 不等于 `b`，我们可以打印出 `a is not equal to b`；因为非运算符会改变布尔表达式的值。\n\n## 组合运算符\n\
    \n在 C 语言中，可以在一个语句中使用任意数量的运算符。\n\n示例：\n```c\nint a = 10;\nint b = 20;\nif (((a\
    \ == 20 && a > b) || (a != 20 && a < b))) {\n              // Condition met\n\
    }\n```\n\n"
