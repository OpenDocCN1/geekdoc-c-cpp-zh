    \    system(\"pause\");\n    return 0;\n}\n```\n\n# Chapter 14: Debugging\n\n\
    Sometimes when programming, your code may give wrong outputs. This is called a\
    \ logic error. Your IDE will not tell you anything is wrong because technically\
    \ your code follows the rules. You may follow the rules of language, like grammar,\
    \ etc., but your paragraphs don’t necessarily have make sense. The most common\
    \ method of debugging is simply `std::cout` and printing out variables to find\
    \ where values stop. Another tool when debugging is breakpoints. These are points\
    \ that act as checkpoints, where the code will stop until the programmer lets\
    \ it continue. In Eclipse, on the line you wish to put a breakpoint, simply move\
    \ your cursor to the left side, right click and press Toggle Breakpoint; this\
    \ way you can slow down your code to find out where the error is occurring (or\
    \ when you are doing lots of iterations in a loop).\n\nOne thing that may or not\
    \ be considered debugging is optimization. Once you’ve written your code, it may\
    \ be tempting to just leave it and continue with other tasks, but this may be\
    \ what you want to do. If your program gets the desired results but takes a long\
    \ amount of time, then it is not good. With that being said, there is no single\
    \ strategy to make code more optimized. Sometimes your logic could be a long method\
    \ of doing something, and sometimes it could be how you implement that. Be wary\
    \ of creating unused variables, as they can take up processing time and memory.\
    \ It goes through all variables in your code and removes any that are no longer\
    \ valid. For example, if you make a `for loop`, when it completes, that variable\
    \ is no longer valid, so it should be deleted to save on processing time.\n\n\
    Here is an optimization example. Say you want to find the distance from one point\
    \ to another. `Math` class tells us to use Pythagorean Theorem. But this is slow.\
    \ First the computer must square both sides (which is quite expensive performance-wise),\
    \ add them, and finally square root them. This calculates the accurate distance\
    \ between two points. Another solution though, could be to use Manhattan distance.\
    \ This will not get you accurate distances, but it could be good in situations\
    \ where the exact value is not important and speed is more important. To do Manhattan\
    \ distance, simply absolute (which means to make a value positive, so -7 becomes\
    \ 7 and 8 becomes 8) both the `x` and `y` components and add them. This gives\
    \ you an inaccurate distance, but it is much faster than its more accurate counterpart.\
    \ This is particularly good when you are guessing the fastest route. Rather than\
    \ constantly calculating the distance accurately, Manhattan distance is a cheap\
    \ alternative and will get you near enough distance.\n\n# Chapter 15: Enums and\
    \ Generic Types\n\n## Enums\n\nEnums are essentially presets. They can only have\
