    # Chapter 11


    # C Methods


    A method is a collection of code or statements that is grouped together to create
    a specific function or task. This section will teach you how to create and utilize
    methods to their fullest extent.


    ## Creating a Method


    The syntax to create a method is as follows:


                    modifier returnType methodName(datatype parameters){


                           //code


                    }


    modifier: Defines what has access to the method, and other properties. You can
    recall that public or private keywords from the above sections.


    returnType: The dataType that the method will return. Does not return anything
    if set to void.


    methodName: The name of the method. Same syntax as variables and uses the identifiers.


    ## Parameters


    Parameters are variables that you can give to the method to utilize when you call
    it. A method can take zero parameters as well or can take a number of parameters
    that you want to use inside the method body.


                             Example 1:


    #include <iostream>


    int samplemethod(int x) {


                  return x + 1;


    }


    int main() {


                  int x = 0;


                  x = samplemethod(x);


                  system("pause");


                  return 0;


    }


    We create here a method of type int called samplemethod which takes one parameter
    of the int data type. We also state that the method is public (by default) meaning
    it can be accessed from sub-classes. In the main method, we declare an int “x”.
    We then set the value of “x” to samplemethod(x). Since sample method has a return
    type of int, whenever the method is called, it will ALWAYS return an int value.
    We gave it the value of “x”, and the method adds one to that value and returns
    it. Therefore, “x” will now have a value of 1.


                             Example 2:


    #include <iostream>


    void average(double x, double y) {


                  std::cout << "Average is: " << (x + y) / 2;


    }


    int main() {


                  double a = 3.0;


                  double b = 6.0;


                  average(a, b);


                  system("pause");


                  return 0;


    }


    The example method above has a data type of void. This means that the method will
    not return any value. This is good if you need the method to just perform a specific
    function and don’t need to assign a value with it. In the example above, we create
    a method which calculates the average of two numbers. The method simply performs
    the function of calculating an average and prints it to the console. It will never
    return any values.


                             Example 3:


    #include <iostream>


    int a = 1;


    int b = 2;


    void sum(int x, int y) {


                  std::cout << "Sum is: " << a + b;


    }


    int main() {


                  sum();


                  system("pause");


                  return 0;


    }


    In this example, we create a method called sum() which takes no parameters. When
    a method takes no parameters it is called with empty brackets, but the brackets
    must still be there no matter what. This also shows that you can use public variables
    from the class within any method in that class. The variable does not have to
    be an argument in the parameters for it to be useable.


    ## Method Overloading


    Method overloading is when you have two methods with the same name, except different
    parameters.


