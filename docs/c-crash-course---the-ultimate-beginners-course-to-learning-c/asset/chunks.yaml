    \ is called string. string  is not a primitive data type, but is a very commonly\
    \ used data type which stores strings of text. Technically a string is an array\
    \ of character type data.\n\n                     Example:\n\n string cat = \"\
    meow\"; // sets value of cat to \"meow\"\n\nThis example gets a string named “cat”,\
    \ and sets it to the string of characters that spell out “meow”.\n\n## Declaring\
    \ a Variable\n\nThe declaration of a variable has three parts to it. The data\
    \ type, variable name, and the stored (or initial) value.  Note that there is\
    \ a specific convention and set of rules to be used when naming variables. A variable\
    \ name can be any length (less than 30) of Unicode letters and numbers, but it\
    \ must start with a letter, the dollar sign “$” or an underscore “_”, or else\
    \ it would return a syntax error.\n\n#include <stdio.h>\n\n#include <stdlib.h>\n\
    \nvoid main(void) {\n\n              int $num = 0;\n\n              printf(\"\
    %d\", $num);\n\n              system(\"pause\");\n\n}\n\nIt is also common naming\
    \ convention to start the name with a lowercase letter, followed with each following\
    \ word starting with a capital letter. For example, if the variable name was “theNum”,\
    \ the first word “the” starts with a lower case, and each following word, in this\
    \ case “Name”, starts with a capital letter.\n\n                     Example:\n\
    \n int theNum = 123; // value of 123\n\nIn the example above, the data type is\
    \ int, the name of the variable is theNum, and the value stored inside that is\
    \ 123. You can also declare a variable without storing a value in it.\n\nExample:\n\
    \n int num; // no value\n\nYou can do this if you choose to later declare it.\n\
    \n## Using a Variable\n\nAfter a variable is declared, you can then read its value,\
    \ or change it. After the variable was initially declared, you can reference it\
    \ only by its name; you only need to declare its data type when you are declaring\
    \ the variable.\n\n                     Example:\n\nname = 2; // sets the int\
    \ \"name\" to a value of 2\n\nThe example above sets the value of name to 2\\\
    . Notice how I never restated the data type.\n\n                     Example:\n\
    \n                       printf(“%d”, name); // prints the value of name to the\
    \ console\n\nThis example reads the value of “name” and writes it to the console\
    \ output stream.\n\nVariables can also be added together:\n\n                    \
    \ Example:\n\n int a; // no value\n\n     int b = 1; // value of one\n\n     int\
    \ c = 2; // value of two\n\na = b + c; // sets a to the value of b + c\n\nIn the\
    \ example above, we set the value of a, to equal the value of b and c added together.\
    \ The addition sign is known as an operator, which we will go over in the following\
    \ section.\n\nIt is also possible to combine values of variables that are different\
    \ data types to a certain extent.\n\n                     Example:\n\n int  a;\
    \ // no value\n\n     float b = 1; // value of one\n\n     int c = 2; // value\
    \ of two\n\n     a = (int) (b + c); // sets the int \"name\" to a value of b +\
    \ c\n\nThis example is just like the one before it, except for that we changed\
    \ the data type of b from int, to float. The only different when adding them together,\
    \ is that we had to add something called a “cast” to the equation. What a cast\
    \ does is it simply lets the compiler know that the value of (b + c) should be\
    \ of the datatype int. Note that for this example, if the value of  b + c were\
    \ to equal a decimal number (for example 3.2), the value of a would not be 3.2\
    \ but rather 3, because int does not support decimals.\n\n## Assignment\n\nUsing\
    \ what we learned about variables, we can now create a simple calculator to add\
    \ numbers together for us. The first thing we will want to do is declare 3 variables:\
    \ one to store the value, one to represent the first number we want to add, and\
    \ one to represent the second number we want to add. We will declare these variables\
    \ as double so that we can add decimal numbers:\n\n double a = 0; // stores value\
    \ of addition\n\n     double b = 3.55; // first number to add\n\n     double c\
    \ = 52.6; // second number to add\n\nNext, we will simply set the value of a,\
    \ to equal the value of b and c combined, and then print out the value of a.\n\
    \n                       a = b + c;\n\n     printf(“%d”, a);\n\nIf you run the\
    \ program now, it should print out 56.15\\. You now have just created a very simple\
    \ calculator. I highly encourage you to play around with this, and test things\
    \ for yourself. Change the data type of the variables, add more numbers together,\
    \ and experiment to understand how things work.\n\n## Pointer-Types\n\nIn C a\
    \ programmer can use another type of data; objects. That is known as pointers\
    \ (or pointer-types). Pointers are special types of variables as they consume\
    \ the same type and operations. But, they are used to store the addresses of objects\
    \ in the memory. You can think of a pointer-type to be just a directory. Actual\
    \ object exists in the memory, only its address is stored in the variable. That\
    \ is why it is 32-bit in size.\n\nYou can define your own pointers to any variable\
    \ type, int, char, float etc. The pointer-type variable doesn’t exist itself,\
    \ instead is just a reference to the other variable in the memory. Have a look\
    \ at the following code,\n\n#include <stdio.h>"
