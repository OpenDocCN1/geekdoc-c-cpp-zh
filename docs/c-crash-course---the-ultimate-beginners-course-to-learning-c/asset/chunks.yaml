    \n在本节的末尾结束时，你将完全理解 `if` 语句的工作原理。\n\n## 关系运算符\n\nC 语言支持不同类型的关系运算符，可用于比较变量的值。它们如下：\n\
    \n- `==` 此运算符检查两个整数的值是否相互相等。如果它们相等，运算符返回 `true`。如果不相等，则返回 `false`。\n\n示例：\n```c\n\
