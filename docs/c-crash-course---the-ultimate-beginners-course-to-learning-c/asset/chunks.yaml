    ![](images/00004.jpeg)


    1.  Select the “Empty Project” option under Templates Visual C (Because we need
    to understand how the code works, so empty project would be easy to work around
    with).


    2.  Make sure to have “Create directory for solution” for organization purposes


    3.  Type in a project name in the “Name:” field and set a location for your project.
    (Example: HelloWorld) I have used CppProject.


    4.  Click “Ok” to proceed


    5.  Now you will be presented with this page, and if you are, then you are done!
    Otherwise follow the steps from 1 to 4 to make sure you are doing it correctly
    or contact Visual Studio team for support with your product and machine.


    ![](images/00005.jpeg)


    Since our project is an empty project, we won’t see any header or C files in our
    project. We can add new files to the project right away.


    By now, you have successfully completed the installation of C and setting up the
    environment to write your first C program! Next we will learn the program structure
    of C language.


    # Chapter 3


    # C Language Structure


    Now we will learn how C as a programming language is structured through the sample
    source code file. To create a new source code file, you should Right click on
    project name and select Add. Inside Add menu, you should select New Item and choose
    C file (.cpp), name it what you want. I used MainFile.cpp as the name for the
    file.


    ![](images/00006.jpeg)


    This file would be empty as per now, because it is not template file (means, that
    it doesn’t have any functionality initially).


    We can add more code to it, to make it run. But first we need to understand the
    format (structure) of a C program.


    #include <header.h>


    int main() {


                  // statements


                  return 0;


    }


    There, the above code is pretty much simple but a little more technical description
    must be shared in order to make you understand how things work.


    1. Include directive is used to add header files (I would talk about header files
    in a separate module) to your file.


    2. Next comes a main function, which is the entry point for the code. When the
    code executes, it first of all enters this function and executes what is written
    as statements in it and terminates after execution.


    3. Most of the Microsoft products require your C program to be of integer return
    type, and must have return 0; in it.


    4. Double slash (//) in C means comments block. Comments are special type of lines
    in a language that compiler ignores. So they are used to share description of
    the function, statement or something similar to other developers. Compiler doesn’t
    read it, simply ignores the lines.


    Now something that actually does something, let us write a code that says, “Hello
    world”. (Indeed the sample project of every programmer!)


    #include <stdio.h>


    #include <stdlib.h>


    void main(void) {


                  printf("Hello world\n");


                  system("pause");


    }


    The above code sample would run and render Hello world on screen, printf is a
    command to send the object (string based Hello world) to the output stream. stdio
    is the header file that is used to execute this function and contains the declaration
    and the body of the function that has to be executed whenever this function is
    called. Note: system(“pause”) is just used to stop the execution and see the output.
    Otherwise it is not required.


    ![](images/00007.jpeg)


    The first line #include <stdio.h> is using a special keyword include used along
    with # (preprocessor directive) which allows the programmer to import classes
    and other functions in the C source file which aren’t present by default when
    creating a new program in C. After the keyword #include - the programmer specifies
    a specific header file that is within the C library. In this case, we specified
    the stdio header file (that stands for Standard Input/output), we can easily include
    other header files in our source code file to use their functions or other objects
    in our applications also.


    By default, when starting a C program, tools and functions from the C library
    are provided at a bare minimum for any basic program that needs to be created.
    If the programmer for any reason wants to use more than just the basic functionalities,
    they can use the “#include” keyword at ease to give themselves more tools to work
    with in the C environment.


    You can also start to notice that there is a trend with a semicolon “;” after
    each statement. The semicolon is like a period to a statement in English (“Tim
    owned a dog.”). When the compiler is going through the program, preparing it for
    its execution, it will check for semi-colons, so it knows when a specific statement
    ends and when a new one starts. Note that a semi-colon is not required after a
    preprocessor directive command. This token (“;”) is known as statement terminator
    and is a required token after every statement, otherwise compiler would raise
    an error in the syntax of the program.


    The next element in the code is a function call. In C main function is used to
    execute initially, you write all of your code in this function and the code executes
    and then you terminate the program or restart it. You can use different structures
    to write your applications,


    1. Sequential


    2. Selection


    3. Iteration


    4. Function call


    A function can be called from within another function; but ignore calling a function
    from within itself as it might throw Stack Overflow exception.


    The namespace is defined by using the keyword “namespace” and then the name. Notice
    how there are curly braces around the code sample within it – these are used to
    indicate the “scope” that it has authority over. We will go over this in more
    detail soon. Now let us convert out code in a namespace-contained sample code.


    #include <stdio.h>


    #include <stdlib.h>


    namespace sample {


                  // Code inside the namespace


    }


    void main(void) {


                  printf("Hello world\n");


                  system("pause");


    }


    Our namespace’s name is “sample” and can be used when referring to the functions
    that are present inside the namespace from other source codes; or from our main
    function. You can think of a namespace as a package containing our objects and
    functions. A namespace just provides the basic scope idea about a code function,
    object or other variable-like data structures.


    # Chapter 4


    # Structs in C


    The next thing you’ll need in the sample code is a structs. C comes shipped with
    most of the data types a developer would require to create his application. But
    there are sometimes, when you need to wrap the data types for each user, function,
    event or other program. In such states, those data types do not suffice. For such
    objects you use classes. A struct is defined similarly using a struct keyword
    as namespace.


    Let us first write the sample code for a class in C and see what it looks like,
    for example we need a struct that stores age and weight of that person.


    #include <stdio.h>


    #include <stdlib.h>


    struct person {


    public:


                  int age;


                  double weight;


    } identifier;


    void main(void) {


                  printf("%d", identifier.age);


    }


    Above class can hold the details of a person object, and can store the age (of
    integer type) and weight (of floating-point value). Let us understand what there
    are in the code block above.


    public - Defines the scope of the class members and whether or not other classes
    have access to the class member. This may not make sense now, but when learning
    “Inheritance and Polymorphism” - you will gain a better understanding of what
    this means.


    struct - A struct can be thought of as a “data type” of object.


    person – This element of this important declaration is “person” which simply is
    a custom name that the user can redefine for the data type. You can call this
    anything, as all it is doing is giving the “Section” or “Class” a name. You can
    think of it this way:'
