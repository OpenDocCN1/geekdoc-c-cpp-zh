- fmt: "\n• Click `New` → `Project`\n\n![](images/00004.jpeg)\n\n1. Select the `Empty\
    \ Project` option under `Templates Visual C` (Because we need to understand how\
    \ the code works, so empty project would be easy to work around with).\n2. Make\
    \ sure to have `Create directory for solution` for organization purposes\n3. Type\
    \ in a project name in the `Name:` field and set a location for your project.\
    \ (Example: `HelloWorld`) I have used `CppProject`. \n4. Click `Ok` to proceed\n\
    5. Now you will be presented with this page, and if you are, then you are done!\
    \ Otherwise follow the steps from 1 to 4 to make sure you are doing it correctly\
    \ or contact Visual Studio team for support with your product and machine.\n\n\
    ![](images/00005.jpeg)\n\nSince our project is an empty project, we won’t see\
    \ any header or C files in our project. We can add new files to the project right\
    \ away.\n\nBy now, you have successfully completed the installation of C and setting\
    \ up the environment to write your first C program! Next we will learn the program\
    \ structure of C language.\n\n# Chapter 3\n\n# C Language Structure\n\nNow we\
    \ will learn how C as a programming language is structured through the sample\
    \ source code file. To create a new source code file, you should Right click on\
    \ project name and select `Add`. Inside `Add` menu, you should select `New Item`\
    \ and choose `C file (.cpp)`, name it what you want. I used `MainFile.cpp` as\
    \ the name for the file.\n\n![](images/00006.jpeg)\n\nThis file would be empty\
    \ as per now, because it is not template file (means, that it doesn’t have any\
    \ functionality initially).\n\nWe can add more code to it, to make it run. But\
    \ first we need to understand the format (structure) of a C program.\n\n```c\n\
    #include <header.h>\n\nint main() {\n    // statements\n    return 0;\n}\n```\n\
    \nThere, the above code is pretty much simple but a little more technical description\
    \ must be shared in order to make you understand how things work.\n\n1. `Include`\
    \ directive is used to add header files (I would talk about header files in a\
    \ separate module) to your file.\n2. Next comes a `main` function, which is the\
    \ entry point for the code. When the code executes, it first of all enters this\
    \ function and executes what is written as statements in it and terminates after\
    \ execution.\n3. Most of the Microsoft products require your C program to be of\
    \ integer return type, and must have `return 0;` in it.\n4. Double slash (`//`)\
    \ in C means comments block. Comments are special type of lines in a language\
    \ that compiler ignores. So they are used to share description of the function,\
    \ statement or something similar to other developers. Compiler doesn’t read it,\
    \ simply ignores the lines.\n\nNow something that actually does something, let\
    \ us write a code that says, “Hello world”. (Indeed the sample project of every\
    \ programmer!)\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\nvoid main(void)\
    \ {\n    printf(\"Hello world\\n\");\n    system(\"pause\");\n}\n```\n\nThe above\
    \ code sample would run and render Hello world on screen, `printf` is a command\
    \ to send the object (string based Hello world) to the output stream. `stdio`\
    \ is the header file that is used to execute this function and contains the declaration\
    \ and the body of the function that has to be executed whenever this function\
    \ is called. Note: `system(\"pause\")` is just used to stop the execution and\
    \ see the output. Otherwise it is not required.\n\n![](images/00007.jpeg)\n\n\
    The first line `#include <stdio.h>` is using a special keyword `include` used\
    \ along with `#` (preprocessor directive) which allows the programmer to import\
    \ classes and other functions in the C source file which aren’t present by default\
    \ when creating a new program in C. After the keyword `#include` the programmer\
    \ specifies a specific header file that is within the C library. In this case,\
    \ we specified the `stdio` header file (that stands for Standard Input/output),\
    \ we can easily include other header files in our source code file to use their\
    \ functions or other objects in our applications also.\n\nBy default, when starting\
    \ a C program, tools and functions from the C library are provided at a bare minimum\
    \ for any basic program that needs to be created. If the programmer for any reason\
    \ wants to use more than just the basic functionalities, they can use the `#include`\
    \ keyword at ease to give themselves more tools to work with in the C environment.\n\
    \nYou can also start to notice that there is a trend with a semicolon (`;`) after\
    \ each statement. The semicolon is like a period to a statement in English (“Tim\
    \ owned a dog.”). When the compiler is going through the program, preparing it\
    \ for its execution, it will check for semi-colons, so it knows when a specific\
    \ statement ends and when a new one starts. Note that a semi-colon is not required\
    \ after a preprocessor directive command. This token (`;`) is known as statement\
    \ terminator and is a required token after every statement, otherwise compiler\
    \ would raise an error in the syntax of the program.\n\nThe next element in the\
    \ code is a function call. In C `main` function is used to execute initially,\
    \ you write all of your code in this function and the code executes and then you\
    \ terminate the program or\n\n1. Sequential\n2. Selection\n3. Iteration\n4. Function\
    \ call\n\nA function can be called within another. Notice there are curly braces\
    \ around the namespace. A `namespace` is defined by using `namespace` and then\
    \ the the.. will go over this more soon. Now let us convert out code.\n\n```c\n\
    #include <stdio.h>\n#include <stdlib.h>\nnamespace sample {\n    // Code inside\
    \ the namespace\n}\nvoid main(void) {\n    printf(\"Hello world\\n\");\n    system(\"\
    pause\");\n}\n```\n\nOur namespace’s name is `sample` and can be used our main\
    \ function. You can think of a namespace as a package containing our objects and\
    \ functions. A namespace just provides the basic scope.\n\n# Chapter 4\n\n# Structs\
    \ in C\n\nThe next thing you’ll need in the sample code is structs. C comes shipped\
    \ with most of the data types a developer would require. But there are sometimes,\
    \ when you need to wrap the data types for each user, function or other program.\
    \ In such states, those data types do not suffice. For such objects you use classes.\
    \ A struct is defined similarly using struct keyword.\n\nLet us first write the\
    \ sample code for a class in C and see what it looks like, for example we need\
    \ a struct that stores age and weight of that person.\n\n```c\n#include <stdio.h>\n\
    #include <stdlib.h>\n\nstruct person {\npublic:\n    int age;\n    double weight;\n\
    } identifier;\n\nvoid main(void) {\n    printf(\"%d\", identifier.age);\n}\n```\n\
    \nAbove class can hold the details of a person object, and can store the age (of\
    \ integer type) and weight (of floating-point value). Let us understand what there\
    \ are in the code block above.\n\n`public` - Defines the scope of the class members\
    \ and whether or not other classes have access to the class member. This may not\
    \ make sense now, but learning “Inheritance and Polymorphism” - you will gain\
    \ a better understanding of what this means.\n\n`struct` - A struct can be thought\
    \ of as a “data type” of object.\n\n`person` – This element of this important\
    \ declaration is `person` which simply is a custom name that the user can redefine\
    \ for the data type. You can call this anything, as all it is doing is giving\
    \ the “Section” or “Class” a name.\n"
