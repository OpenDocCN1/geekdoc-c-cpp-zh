    \ `true`。如果它们**相等**，它将返回 `false`。\n\n示例：\n```c\nint a = 10;\nint b = 20;\nif (a\
    \ != b) {\n              // Not Equal\n}\n```\n这段代码将检查 `a` 是否等于 `b`。由于 `a` 不等于\
    \ `b`，程序将在控制台上打印 `they are not the same`；如果代码中已实现该。\n\n- `>` 此运算符检查某物是否**大于**另一物。如果前面变量的值大于后面变量的值，它将返回\
    \ `true`。如果前面变量的值小于后面变量的值，它将返回 `false`。\n\n示例：\n```c\nint a = 10;\nint b = 20;\n\
