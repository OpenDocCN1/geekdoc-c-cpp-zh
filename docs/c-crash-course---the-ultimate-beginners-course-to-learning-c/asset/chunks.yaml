    # Chapter 8


    # Strings in C


    Strings are quite commonly used in C programming. A string is a sequence of characters,
    or a line of text, or putting it technically, it is an array of char type objects.
    A string in C is like an object, meaning that it has properties that can be used,
    and different functions or methods that can be executed on it.


    The way to declare a string variable is by doing the following:


    char name[] = “Your name”;


    Complete code example is following:


    #include <stdio.h>


    #include <stdlib.h>


    void main(void) {


                  char name[] = "Your name";


                  printf("Your name is: %s", name);


                  system("pause");


    }


    There are two ways to declare a string, one way is to use char array, other way
    is to use a type string; which is indeed a class object. It requires you to use
    a header file named string.h.


    #include <iostream>


    #include <string>


    int main() {


                  std::string name = "Name";


                  std::cout << name << std::endl;


                  system("pause");


                  return 0;


    }


    Now let’s go over the fundamental properties of a string object that can be used
    to gain extra information over the piece of text or string.


    ## String Length


    A way to receive information on the amount of characters in a String is by doing
    the following:


    #include <iostream>


    #include <string>


    int main() {


                  std::string name = "Name";


                  std::cout << name.length() << std::endl;


                  system("pause");


                  return 0;


    }


    The length function in a String object returns a value for the amount of characters
    within the String object and assigns the value to the integer amount. The output
    in this sample code would be 4 since “test” is 4 characters long.


    ## Concatenating Strings


    Concatenating is the idea of joining two strings together. Here is an example:


    #include <iostream>


    #include <string>


    int main() {


                  std::string name = "Name";


                  name = "Hello" + name;


                  std::cout << name.length() << std::endl;


                  system("pause");


                  return 0;


    }


    As shown in the example above, you are able to use the “+” operator to join two
    or more strings together.


    Here are various examples of utilizing the String object:


    ## Examples


    Example – string[int index]:


    #include <iostream>


    #include <string>


    int main() {


                  std::string name = "Name";


                  name = "Hello" + name;


                  std::cout << name[0] << std::endl;


                  system("pause");


                  return 0;


    }


    The value of “name” contains the letter “HelloName”. Console would show only H
    because the inputted index of the string is 0 which is the first letter of the
    string. The way the computer reads the string, is from 0 to the length of the
    string, not 1. To the computer, a string is a list of characters, so indicating
    a square bracket with an index is like referring to a specific index of a character
    in a list of characters when really it’s a string variable.


    Example – Equality check:


    #include <iostream>


    #include <string>


    int main() {


                  std::string name = "Name";


                  bool equals = (name == "Name");


                  std::cout << equals << std::endl;


                  system("pause");


                  return 0;


    }


    The value of equals is going to equal true in this case because the == operator
    returns a bool value (true or false) and the text does indeed equal to Name. Later
    on, you will learn about “if” statements, which can allow you to check whether
    or not something equals to something else. When comparing most other data types
    you will use “==”. You will learn more about this later on.


