    \ << \"Average is: \" << (x + y) / 2;\n}\n\nint main() {\n    double a = 3.0;\n\
    \    double b = 6.0;\n    average(a, b);\n    system(\"pause\");\n    return 0;\n\
    }\n```\n\nThe example method above has a data type of `void`. This means that\
    \ the method will not return any value. This is good if you need the method to\
    \ just perform a specific function and don’t need to assign a value with it. In\
    \ the example above, we create a method which calculates the average of two numbers.\
    \ The method simply performs the function of calculating an average and prints\
    \ it to the console. It will never return any values.\n\n### Example 3:\n\n```cpp\n\
    #include <iostream>\n\nint a = 1;\nint b = 2;\n\nvoid sum(int x, int y) {\n  \
    \  std::cout << \"Sum is: \" << a + b;\n}\n\nint main() {\n    sum();\n    system(\"\
    pause\");\n    return 0;\n}\n```\n\nIn this example, we create a method `sum()`\
    \ which takes no parameters. When a method takes no parameters it is called with\
