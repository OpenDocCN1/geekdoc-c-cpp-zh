    \n如果 `bob` = 20，`tom` = 10，且 `john` = 5，输出必须是：\n“bob 比 tom 富，而 tom 比 john 富”\n\
    \n但如果 `bob` = 20，`tom` = 20，且 `john` = 5，输出必须是：\n“bob 和 tom 一样富，他们都比 john 富”\n\
    \n程序需要适用于每种可能的结果。我强烈鼓励你自己尝试这个程序，并在查看答案之前尽可能努力解决。编程的很大一部分是解决问题和理解代码，所以我建议你先尝试自己解决，这将帮助你了解编程中哪些部分是你需要处理和学习的。\n\
    \n## 答案与解析\n\n注意程序将通过代码中的注释进行解释。\n\n```cpp\n#include <iostream>\n\nint main()\
    \ {\n    int tom = 10;\n    int bob = 20;\n    int john = 30;\n    /* 我们首先检查每个人的钱数是否相同\n\
    \     * 注意我从未检查 tom 是否等于 john，因为如果\n     * tom 等于 bob 且 bob 等于 john，那么 tom 显然\n\
    \     * 等于 john\n     */\n    if (tom == bob && bob == john) {\n        std::cout\
    \ << \"Everyone has the same amount of money\";\n    }\n    /*\n      如果第一个语句返回假\n\
    \     * 我检查 tom 和 bob 钱数相同但 john 不相同的这一个特殊情况\n     */\n    else if (tom == bob\
    \ && bob != john) {\n        /*\n         * 我现在检查 bob 大于还是小于 john\n         *\
    \ 然后输出正确的答案\n         */\n        if (bob > john) {\n            std::cout <<\
    \ \"tom is just as rich as bob, both are richer than john\";\n        }\n    \
    \    else if (bob < john) {\n            std::cout << \"tom is just as rich as\
    \ bob, both are more poor than john\";\n        }\n    }\n    /*\n     * 我对不同的人重复上一个语句相同的过程\n\
    \     */\n    else if (tom == john && john != bob) {\n        if (john > bob)\
    \ {\n            std::cout << \"tom is just as rich as john, both are richer than\
    \ bob\";\n        }\n        else if (john < bob) {\n            std::cout <<\
    \ \"tom is just as rich as john, both are more poor than bob\";\n        }\n \
    \   }\n    /*\n     * 名字的最后一种组合\n     * 检查方式与上一个语句相同\n     */\n    else if (john\
    \ == bob && bob != tom) {\n        if (bob > tom) {\n            std::cout <<\
    \ \"bob is just as rich as john, both are richer than tom\";\n        }\n    \
    \    else if (bob < tom) {\n            std::cout << \"bob is just as rich as\
    \ john, both are more poor than tom\";\n        }\n    }\n    /*\n      现在我检查最后可能的组合\n\
    \     * 即每个人的钱数都不同\n     * 接下来的 6 个语句涵盖了每种结果\n     */\n    else if (tom > bob\
    \ && bob > john) {\n        std::cout << \"tom is richest, followed by bob, followed\
    \ by john\";\n    }\n    else if (tom > john && john > bob) {\n        std::cout\
    \ << \"tom is richest, followed by john, followed by bob\";\n    }\n    else if\
    \ (bob > tom && tom > john) {\n        std::cout << \"bob is richest, followed\
    \ by tom, followed by john\";\n    }\n    else if (bob > john && john > tom) {\n\
    \        std::cout << \"bob is richest, followed by john, followed by tom\";\n\
    \    }\n    else if (john > bob && bob > tom) {\n        std::cout << \"john is\
    \ richest, followed by bob, followed by tom\";\n    }\n    else if (john > tom\
    \ && tom > bob) {\n        std::cout << \"john is richest, followed by tom, followed\
    \ by bob\";\n    }\n    system(\"pause\");\n    return 0;\n}\n```\n"
- fmt: "\nWhen programming, you might run into a situation where you will need to\
    \ loop through a large amount of numbers. If we used what we learned so far to\
    \ loop through 100 numbers, we would need 100 `if` statements. I think you would\
    \ agree that would get really messy and frustrating. This is why C supports multiple\
    \ type of loops. C has three types of loops that you can use, that all loop through\
    \ things in slightly different ways. Below is a quick explanation of each one\
    \ of them.\n\n### While Loop\n\nA `while` loop is a control structure that will\
    \ allow you to repeat a task as many times are you program it to. The syntax for\
    \ a `while` loop is as follows:\n\n```\nwhile (expression) {\n    // insert code\n\
    }\n```\n\nThis works in a similar way that `if` statements work, except `WHILE`\
    \ the `expression` is true, the code within the `while` loop will run until the\
    \ `expression` becomes false (if it ever does).\n\nExample:\n\n```cpp\n#include\
    \ <iostream>\n\nint main() {\n    int i = 0;\n    while (i < 10) {\n        std::cout\
    \ << i << std::endl;\n        i++;\n    }\n    system(\"pause\");\n    return\
    \ 0;\n}\n```\n\nThe Following code will print out the value of “x”, and then subtract\
    \ it by one, continuously, until the value of “x” is no longer greater than zero.\
    \ If you were to run this code, you would get an output of every number from 0\
    \ to 9. Once the value of “x” reaches 10, it no longer allows the `expression`\
    \ to return true, which is when the `while` loop finishes. Note that you should\
    \ watch out for infinite loops. This is where an error in your code causes the\
    \ loop to never end, essentially freezing the program. This would happen if there\
    \ is an error in your logic, and the statement never becomes false. It is pretty\
    \ much bad for your CPU, because `CPU` would execute and waste most of the cycles\
    \ in executing that infinite loop.\n\n### Do While Loop\n\nA `do while` loop works\
    \ in a very similar way to the `while` loop except for one major difference. The\
    \ `do`, as in, what happens when the `while` statement is true, is called before\
    \ the condition is asked. What that means is that a `do while` loop will always\
    \ run at least once, because it does something first and then asks questions later,\
    \ so to speak.\n\nExample:\n\n```cpp\n#include <iostream>\n\nint main() {\n  \
    \  int i = 0;\n    do {\n        std::cout << i << std::endl;\n        i++;\n\
    \    } while (i < 10);\n    system(\"pause\");\n    return 0;\n}\n```\n\nIn this\
    \ example, I directly transferred the logic from the `while` loop to the `do while`\
    \ loop. As you can see, the only difference is that the logic that gets run while\
    \ the statement is true, is above the `while` loop, instead of below it. For this\
    \ specific example, the output of the code is exactly the same. The output would\
    \ be different then a `while` loop. If this was a `while` loop, the code within\
    \ the loop would never run. However, in a `do while` loop, the `do` happens before\
    \ `while`, so the code will always run at least once. During the first run, it\
    \ never gets checked for a true statement until the block of code is processed.\
    \ This can be helpful for specific situations, but it is not used as often as\
    \ a normal `while` loop. A very common type of example would be when the program\
    \ needs the user to press Y to close the program. First time the program would\
    \ print “Press Y to end the program” and next time it would keep prompting the\
    \ user.\n\n### For Loops\n\n`For` loops allow you an easy way to loop or increment\
    \ through a specific range. The syntax for `for` loop is as follows:\n\n```\n\
    for (initialization; termination; increment) {\n    // statements\n}\n```\n\n\
    - **Initialization**: Initializes a counter variable, you can initialize multiple\
    \ variables in the block.\n- **Termination**: States the expression to evaluate\
    \ for true, you can enter any complex expression and it would be resolved to true.\n\
    - **Increment**: Increments the initialized counter variable, you can also decrement\
    \ the values in this block.\n\nExample:\n\n```cpp\n#include <iostream>\n\nint\
    \ main() {\n    for (int i = 0; i < 10; i++) {\n        std::cout << i << std::endl;\n\
    \    }\n    system(\"pause\");\n    return 0;\n}\n```\n\nIn this example, we start\
    \ by initializing the `for` loop. We create a new `int` named `x` and set it to\
    \ zero. We then state when it will terminate. We say that the loop will continue\
    \ as long as `x` is less than 10. We then set the increment to increase the value\
    \ of `x` by one. The initialization happens only once when the `for` loop is first\
    \ called. After the loop is initialized, it should run at least once (unless you\
    \ initialized it outside its bounds). Once it reaches the end of the code per\
    \ iteration, it will call the increment. After it increments, it will check whether\
    \ it should be terminated and if it does not get terminated, the content is called\
    \ again and the process repeats until termination. For the example above, the\
    \ output will be every number from zero to 9. You need to understand that you\
    \ can use any variable and the loop would continue until a condition is false.\
    \ You can evaluate the condition to be false using anything, any operator or expression.\
    \ You are not only required to increment the value by 1, you can write any code\
    \ in that section to reflect the changes for the next iteration control.\n\n##\
    \ Arrays\n\nArrays are data structures which store a fixed amount of variables\
    \ of the same element. What an array lets you do is, instead of having to create\
    \ 100 different integers to store 100 different number values, you can create\
    \ one integer array which can store 100 different integer values. This makes it\
    \ a lot easier to manage the integers, as well as making it a lot more organized\
    \ and simple.\n\n### Declaring Arrays\n\nDeclaring an array is similar to declaring\
    \ a regular variable. The syntax is as follows:\n\n```\ndataType arrayName[];\n\
    ```\n\nYou can also associate a length of the array in the parenthesis:\n\n```\n\
    dataType arrayName[10];\n```\n\nIn the above code, the length can have only 10\
    \ elements; 10 is the length. The Arrays currently hold no data. We declared the\
    \ array, but not the values in each index of the array:\n\nExample:\n\n```cpp\n\
    int intArray[] = { 1, 2, 3, 4, 5};\n```\n\nThe example above declares an integer\
    \ array with 5 available slots. What this means is that, `intArray` can hold 5\
    \ different integer numbers within it. Each of these numbers can be editing and\
    \ accessed independently in the following way:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n    int arr[5] = {1, 2, 3, 4, 5};\n    system(\"pause\");\n  \
    \  return 0;\n}\n```\n\nThe code above declares the `arr` with 5 data slots. We\
    \ can then access those slots by adding an `int` value inside the square brackets\
    \ beside the array name, which is known as index of the element in the array.\
    \ The moment that we declared the array with 5 values, we then created 5 slots\
    \ numbers 0-4. When it was first declared they contained the value zero. We then\
    \ can access each independently just like any normal variable. We can even read\
    \ the value of each index just like a normal variable.\n\n### Multidimensional\
    \ Arrays\n\nArrays can also be made much more complex by adding multiple dimensions\
    \ to them. In the above examples, the arrays consisted of only one dimension.\
    \ By adding more dimensions, it is essentially like adding arrays within our arrays.\
    \ It may sound complex, but it’s relatively easy to understand.\n\nExample:\n\n\
    ```cpp\nint[2][2] intArray;\n```\n"
