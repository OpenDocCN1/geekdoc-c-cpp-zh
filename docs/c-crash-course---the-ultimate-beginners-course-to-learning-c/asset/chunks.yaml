  trans: "\n\n```c\nvoid main(void) {\n    int num = 0;\n    printf(\"%d\", num);\n\
    \    system(\"pause\");\n}\n```\n\n在这个示例中，调用了一个名为 `num` 的变量，并且该对象在 `main` 函数结束时被移除。该变量只存在于\
    \ `main` 的上下文中，无法在 particular 方法之外直接调用或访问。\n\n## 数据类型\n\n如上所述，变量用于存储数据。C 语言有多种内置的变量数据类型，用于存储预定义类型的数据。这些数据类型被称为原始数据类型。这些数据类型是编程语言中最基础的数据类型。你也可以创建自己的数据类型，我们稍后会介绍。C\
    \ 语言具有以下原始数据类型。\n\n-   **short**: `short` 数据类型是 16 位有符号二进制补码整数。它的最大范围是 32,767，最小值为\
    \ -32,768。`short` 用于节省内存或使代码更清晰。\n示例：\n```\nshort s = 1; // 值为 1\n```\n\n-   **int**:\
    \ `int` 数据类型是 32 位有符号二进制补码整数。它的最大值为 2,147,483,647 (2³¹ -1)，最小值为 -2,147,483,648\
    \ (-2³¹)。除非考虑内存，否则 `int` 是整数最常用的数据类型。\n示例：\n```\nint i = 1; // 值为 1\n```\n\n-\
    \   **long**: `long` 数据类型是 64 位有符号二进制补码整数。它的最大值为 9,223,372,036,854,775,807 (2⁶³\
    \ -1)，最小值为 -9,223,372,036,854,775,808 (-2⁶³)。当需要处理比 `int` 更大的数字时，使用这种数据类型。\n示例：\n\
    ```\nlong l = 1L; // 带有字母 L 的值为 1\n```\n\n-   **float**: 浮点数据类型是双精度 64 位 IEEE\
    \ 754 浮点数。最小和最大范围太大，在此处不予讨论。在需要精度（如货币）时，永远不使用 `float`。\n示例：\n```\nfloat f = 1200.5f;\
    \ // 值为一千两百点五\n```\n\n-   **double**: 双浮点数据类型是双精度 64 位 IEEE 754 浮点数。它通常是小数的首选数据类型。最小和最大范围太大，在此处不予讨论。在需要精度（如货币）时，永远不使用\
    \ `float`。\n示例：\n```\ndouble d = 1200.5d; // 值为一千两百点五\n```\n\n-   **bool**: `bool`\
    \ 数据类型表示一个位的数据。它可以包含两个值：`true` 或 `false`。它用于简单的标志位来跟踪真或假条件。\n示例：\n```\nbool b\
    \ = true; // 值为 true\n```\n\n-   **char**: `char` 数据类型是单个 16 位 Unicode 字符。它的最小值为“\\\
    u0000”（或 0），最大值为“\\uffff”（或 65,535，包含在内）。\n示例：\n```\nchar c = 'w'; // 返回字母 \"\
    w\"\n```\n\n另一个常用的数据类型是 `string`。`string` 不是原始数据类型，但是一种非常常用的数据类型，用于存储文本字符串。从技术讲，字符串是字符类型数据的数组。\n\
    示例：\n```\nstring cat = \"meow\"; // 将 cat 的值设置为 \"meow\"\n```\n这个示例获取了一个名为 `cat`\
    \ 的字符串，并将其设置为拼出“meow”的字符字符串。\n\n## 声明变量\n\n变量的声明包含三个部分：数据类型、变量名和存储（或初始）值。注意，在命名变量时有一套特定的约定和规则。变量名可以是任意长度（小于\
    \ 30）的 Unicode 字母和数字，但必须以字母、美元符号 `$` 或下划线 `_` 开头，否则将返回语法错误。\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\nvoid main(void) {\n    int $num = 0;\n   \
    \ printf(\"%d\", $num);\n    system(\"pause\");\n}\n```\n\n常见的命名习惯也是以小写字母开头，后跟的每个单词首字母大写。例如，如果变量名为\
    \ `theNum`，第一个单词 `the` 以小写开头，随后的每个单词 `Name` 以大写开头。\n示例：\n```\nint theNum = 123;\
    \ // 值为 123\n```\n在上面的示例中，数据类型是 `int`，变量名是 `theNum`，存储内部的值是 123。你也可以声明变量但不向其中存储值。\n\
    示例：\n```\nint num; // 无值\n```\n如果你选择稍后声明，可以这样做。\n\n## 使用变量\n\n声明变量后，你就可以调用它，一旦\
    \ `main` 函数结束，该对象就会被移除。该变量只存在于 `main` 的上下文中，无法在该方法之外直接调用或访问。\n\n"
- fmt: "\n```c\n#include <stdlib.h>\n\nvoid main(void) {\n    int a;\n    int *ptr;\n\
    \    system(\"pause\");\n}\n```\n\nIn the above code sample, I have created two\
    \ variables. One is of integer type, other one is a pointer to integer-type variable.\
    \ There is a difference. What? The difference is that `a` is an actual object\
    \ that exists in the memory and is similar to what you have been taught. Whereas\
    \ `ptr` is not an actual object, but a reference to another integer type object\
    \ in the memory. You can set the reference of a variable as its value using ampersand\
    \ (`&`) operator that returns the address of a variable.\n\n```c\n#include <stdio.h>\n\
    \n#include <stdlib.h>\n\nvoid main(void) {\n    int a;\n    int *ptr;\n    ptr\
    \ = &a;\n    a = 5;\n    printf(\"%d\", *ptr);\n    system(\"pause\");\n}\n```\n\
    \nIn the above code we have created two objects, one as an object, and other as\
    \ an object to hold the address of other variable. We have then initialized a\
    \ variable with a value of 5 and then passed the reference of that variable to\
    \ the pointer-type variable. Thus, it now holds the handle to the variable in\
    \ the memory.\n\nFurther we would use the pointer resolver to get the value at\
    \ that location; remember pointer holds the address, not the value of the variable.\
    \ That is why we would append an asterisk (`*`) before it to resolve the value\
    \ at that location. Just as a side note, pointers can also point to other pointers\
    \ and this is called Pointer-to-pointer type. They are doubled in process, you\
    \ have to use double asterisk to get the actual value.\n\n# Chapter 6: C Operators\n\
    \nJust like in Math class, you learned about addition, subtraction, multiplication,\
    \ division, etc. These are all arithmetic operators that are used within programming\
    \ to intake numbers, process them, and calculate them accordingly. Let’s go over\
    \ these operators in programming, as they are one of the most important things\
    \ to understand and also one of the easiest to grasp.\n\n## The Arithmetic Operators\n\
    \n### Addition\n\n5+5 = 10\n\n```c\nint x = 5;\nint y = 5;\nint sum = 0;\nsum\
    \ = x + y;\n```\n\nIn the example above, a variable of `sum` is taking the addition\
    \ of two variables (`x` and `y`) and adding them together to produce a value of\
    \ 10.\n\n### Subtraction\n\n10-5 = 5\n\n```c\nint x = 10;\nint y = 5;\nint total\
    \ = 0;\ntotal = x - y;\n```\n\nIn the example above, a variable of `total` is\
    \ taking the subtraction of two variables (`x` and `y`) and subtracting them together\
    \ to produce a value of 5.\n\n### Multiplication\n\n5*4 = 20\n\n```c\nint x =\
    \ 5;\nint y = 4;\nint total = 0;\ntotal = x * y;\n```\n\nIn the example above,\
    \ a variable of `total` is taking the multiplication of two variables (`x` and\
    \ `y`) and multiplying them together to produce a value of 20.\n\n### Division\n\
    \n20/5 = 4\n\n```c\nint x = 20;\nint y = 5;\nint total = 0;\ntotal = x / y;\n\
    ```\n\nIn the example above, a variable of `total` is taking the division of two\
    \ variables (`x` and `y`) and dividing them together to produce a value of 20.\n\
    \n### Modulus\n\n7 % 2 = 1\n\n```c\nint x = 7;\nint y = 2;\nint total = 0;\ntotal\
    \ = x % y;\n```\n\nIn the example above, a variable of `total` is taking the remainder\
    \ of two variables (`x` and `y`) and by finding how many times 2 multiplies in\
    \ to 7 evenly before it can’t. After that processes, the remainder is the output.\
    \ For example:\n\nHow many times does 2 go into 7 evenly?\n3 times.\n2 * 3 = 6\n\
    7 - 6 = 1\n\nTherefore, 7 modules 2 is equal to 1 because 1 is the remainder of\
    \ the division.\n\n### Post-Incrementation\n\n5 + 1 = 6\n\n```c\nint x = 5;\n\
    x++;\nint y = 0;\ny = x++;\n```\n\nIn the example above, a variable of `x` is\
    \ being incremented by the value of 1. Therefore, the value of `x` must now be\
    \ 6 because `x + 1 = 6`, since `x = 5`. If you were to print out the value of\
    \ `x`, the output would be 6. You can do `x++` again and the value would then\
    \ become 7. The value of `y` on the other hand is 5.\n\n### Pre-Incrementation\n\
    \n5 + 1 = 6\n\n```c\nint x = 5;\n++x;\nint y = 0;\ny = ++x;\n```\n\nIn the example\
    \ above, a variable of `x` is being incremented by the value of 1.\n\n### Post-Decrementation\n\
    \n5 - 1 = 4\n\n```c\nint x = 5;\nx--;\nint y = 0;\ny = x--;\n```\n\nIn the example\
    \ above, a variable of `x` is being decremented by the value of 1.\n\n### Pre-Decrementation\n\
    \n5 - 1 = 4\n\n```c\nint x = 5;\n--x;\nint y = 0;\ny = --x;\n```\n\nIn the example\
    \ above, a variable of `x` is being decremented by the value of 1.\n\n## The Assignment\
    \ Operators\n\nThe assignment operators are used when assigning variables, the\
    \ most commonly used (`=`). Here are a list:\n\n### Equal Sign: `=`\n\n```c\n\
    int x = 5;\n```\n\nIn this example, if you were to print out `x`, the value would\
    \ be 5 because you assigned `x` equal to 5.\n\n### Add-Equal Sign: `+=`\n\n```c\n\
    int x = 5;\nx += 5;\n```\n\nIn this example, if you were to print out `x`, the\
    \ value would be 10 because you are adding the value of 5 onto `x`.\n\n### Subtract-Equal\
    \ Sign: `-=`\n\n```c\nint x = 5;\nx -= 5;\n```\n\nIn this example, if you were\
    \ to print out `x`, the value would be 0 because you are subtracting the value\
    \ of 5 from `x`.\n\n### Multiplication-Equal Sign: `*=`\n\n```c\nint x = 5;\n\
    x *= 5;\n```\n\nIn this example, if you were to print out `x`, the value would\
    \ be 25 because you are multiplying the value of 5 onto `x`.\n\n### Division-Equal\
    \ Sign: `/=`\n\n```c\nint x = 5;\nx /= 5;\n```\n\nIn this example, if you were\
    \ to print out `x`, the value would be 1 because you are dividing the value of\
    \ 5 onto `x`.\n\n### Modules-Equal Sign: `%=`\n\n```c\nint x = 5;\nx %= 5;\n```\n\
    \nIn this example, if you were to print out `x`, the value would be 0 because\
    \ you are finding the remainder in (5/5).\n\n# Chapter 7: User Input\n\nThe `scanf`\
    \ and `scanf_s` are the commands that will allow us to input information from\
    \ the console, so the program is able to process it and do something with it.\n\
    \nHow it works:\nInput → Process → Output\n\nThe first thing you want to do is\
    \ use the `stdio` header file by doing the following:\n\n```c\n#include <stdio.h>\n\
    ```\n\nYou can use the `scanf` or `scanf_s` to get the input from the user by\
    \ prompting him to enter some details about the input. Then we must set the skeleton\
    \ of our program. The next line you have to code, assuming your program, IDE and\
    \ main method are already set, is to set a variable equal to the user input. This\
    \ is going to wait for the user to type something and once you have, you must\
    \ press enter for it to be stored in the variable accordingly.\n\n```c\n#include\
    \ <stdio.h>\n\n#include <stdlib.h>\n\nvoid main(void) {\n    int num;\n}\n```\n"
