    ## If Statements


    For the following examples, I will use an if statement. An if statement, simply
    put, checks to see IF something is true, or false. To create an if statement,
    you simply write the word if followed by two rounded brackets. This will contain
    the logic to check IF something is true or not. if statements can also include
    else  if statements, and else statements. An else  if statement will run if the
    if statement returns false. However, it also contains its own parameter that must
    return true. An else statement also is called if the if statement returns false,
    the difference between an else statement, and an else  if statement, is that no
    parameters need to be true for an else statement to run.


                         Example:


    #include <iostream>


