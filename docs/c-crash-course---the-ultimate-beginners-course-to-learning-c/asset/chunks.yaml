    ## Exception Handling


    When you’re coding, you may land in situations where your code returns an exception
    when attempting to do something. For example, if an object requires an integer
    in its constructor, but you feed it null instead, the compiler will return an
    error indicating that the object didn’t receive the appropriate parameter.


    Another example would be when you’re working with file handling which will later
    be taught, and you’re trying to read a file in a directory that doesn’t exist.
    The compiler would then again return an exception such as “FileNotFoundException”
    - there are different exceptions but this type of exception is regularly found
    in File Handling.


    In order to regulate exceptions in your code, you can use the try-catch statements.
    What these statements do is check if a block of code returns an exception, and
    if it does, instead of halting the whole operation of the program, it will catch
    the exception and try to either fix it or do something alternatively depending
    on what the programmer codes. Here is a use of a try-catch statement:


    #include <iostream>


    int main() {


                  try {


                                // Code to try out


                  }


                  catch(std::exception e) {


                  }


                  system("pause");


                  return 0;


    }


    The try statement does not require parameters but the catch exception requires
    the parameter of an exception object, and when an exception does occur, the variable
    “e” of type Exception is given data, and the “e” variable can be manipulated to
    either print out the error or do various other things. A commonly used method
    for the e variable is: e.what();


