    There are also some special types of classes. Abstract classes are classes that
    cannot be instantiated—you cannot make an object of an abstract class. You can
    however make objects of children of the abstract class. This is useful when you
    want a group of classes to have a common set of variables or methods, but do not
    want to have an unspecific object. Abstract classes require the use of upcasting
    and downcasting. Abstract classes are defined by the virtual keyword before along
    with their functions; specifying the use of override before use. Such functions
    are not required to have a body, and can be a pure function. When a child inherits
    from the parent abstract class, it must override, or define abstract methods.
    Abstract classes can also contain normal methods, in order to add common functionality
    as in normal classes.


