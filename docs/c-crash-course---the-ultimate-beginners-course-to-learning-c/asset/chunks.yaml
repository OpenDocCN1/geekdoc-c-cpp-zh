    \ by quotation marks in order for the program to know that it has to print out\
    \ text, instead of an actual variable, like “x”. The reason the user couldn’t\
    \ just say: “printf(“The number is x”);” is because the program won’t know if\
    \ x is a variable or not because it is surrounded by quotation marks, the program\
    \ would read anything within quotation marks to be a piece of text, and not actually\
    \ a container holding a value. Therefore, the x must be outside of the quotation\
    \ marks like, “printf(“the number is %d”, x);”. Which would not be formatted properly\
    \ and then used as the output.\n\nThe final element to understand in this code\
    \ is system(“pause”) – this line simply tells the console not to close immediately\
    \ and to wait for the user to press a key or exit the console implicitly. If this\
    \ line wasn’t there, the console would print out the output properly but only\
    \ for a split second before the console would close itself down before terminating.\
    \ You should also know that this command is provided only on Windows-based operating\
    \ systems and not on other systems. For other use, you would use getchar to pause\
    \ the console application; technically to get the input from user.\n\n## Commenting\n\
    \nThe final fundamental concept to understand in a programming language, although\
    \ not necessary, is commenting. It can greatly help you and other programmers\
    \ around you if you ever forget how the program works\n\nThis concept is used\
    \ by programmers to take the chance to explain themselves in their code, using\
    \ simple-plain English text. When a compiler is processing the code, it will always\
    \ ignore comments as it isn’t actually real source code for the program but just\
    \ a description that a programmer has added to the statements. It is simply explanation\
    \ to code that was written to help people understand what was programmed. In order\
    \ to write a comment, you must use “//” or “/*” and “*/”.\n\nThe “//” symbol is\
    \ used to comment one line. For example, if you were to make a variable and explain\
    \ what the variable was going to be used for, you would do the following:\n\n\
    \ int x = 5; // this variable is going to be used to find the total money\n\n\
    The compiler will ignore the commented line, but will process int x = 5; You can’t\
    \ use the “//” symbol with the following:\n\nint x = 5; // this variable is going\
    \ to be\n\nused to find the total money\n\nThis is because the “//” symbol is\
    \ only used for one line, and not two. You are able to do:\n\nint x = 5;\n\n//\
    \ this variable is going to be used to find the total money\n\nAs long as the\
    \ comment is one line, it is fine. Anything after that symbol for the line is\
    \ commented.\n\nThe other technique which does the same thing as “//” except it\
    \ supports multi commenting use. You must start the comment with “/*” and end\
    \ it with “*/”.\n\nExample:\n\nint x = 5; /* this variable is going to be\n\n\
    used to find the total money */\n\nUp to this stage the basics have been covered\
    \ and you are expected to have basic understanding of the programs and their structures.\n\
    \n# Chapter 5\n\n# C Variables\n\n## What is a Variable?\n\nA variable is essentially\
    \ a storage in memory (RAM; Random access memory) that holds a certain type of\
    \ data. It is named by the programmer using an identifier, and is used to identify\
    \ the data it stores. A variable can usually be accessed or changed at any time.\
    \ You can write information to it, take information from it, and even copy the\
    \ information to store in another variable.\n\n## Variable Types\n\nIn C, a variable\
    \ has a specific type, which would determine what size it has in memory, and the\
    \ layout of its memory. The C language defines following types of variables:\n\
    \n### Global Variables\n\nInstance variables are declared within a class but outside\
    \ of any method, constructor or block. An instance variable is visible to all\
    \ methods, constructors and blocks, within the class that it is declared in. By\
    \ giving a variable the keyword “public”, it can then be accessed by sub-classes\
    \ within the class. However, it is recommended to set a variable’s access modifier\
    \ to “private” when possible.\n\nExample:\n\n#include <stdio.h>\n\n#include <stdlib.h>\n\
    \nint num = 10;\n\nvoid main(void) {\n\n              printf(\"%d\", num);\n\n\
                  system(\"pause\");\n\n}\n\nIn this example, we declare the integer\
    \ “num” outside of any method, and can easily access it within any method.\n\n\
    ### Static Variables\n\nStatic Variables are declared with the keyword “static”.\
    \ If a variable is static, only one instance of that variable will exist, regardless\
    \ of how many instances of the object are called. Static variables are rarely\
    \ used except for constant values, which are variables that are never changed\
    \ or another object initialization is not intended.\n\nExample:\n\n#include <stdio.h>\n\
    \n#include <stdlib.h>\n\nint getnum() {\n\n              static int num = 0;\n\
    \n              num++;\n\n              return num;\n\n}\n\nvoid main(void) {\n\
    \n              printf(\"%d\", getnum());\n\n              system(\"pause\");\n\
    \n}\n\nIn this example, we declare an int called “num” and set it to be static.\
    \ This means that it can be accessed from within sub-classes, only one instance\
    \ of it can ever exist, and the value can change. Notice that no matter how many\
    \ times you call the function, num would never have old value instead value would\
    \ be incremented all the times; static variable.\n\n### Local Variables\n\nLocal\
    \ variables are only declared within methods, blocks or constructors. They are\
    \ only created when the method, block or constructor is created, and then destroyed\
    \ as soon as the method ends. You can only access local variables within the method,\
    \ block, or constructor it is called, and are not visible outside of where it\
    \ is called.\n\nExample:\n\n#include <stdio.h>\n\n#include <stdlib.h>"
