  md: 'Ham radio operators will provide experienced input. We may be biased, however-we
    have found that people in the radio community tend to be friendly and generous
    with their time and knowledge. As you gain experience with radios, you will be
    able to quickly determine at least the manufacturer of a device with a quick glance.


    # Antennas


    A lot can be learned from the type of antennas on radio equipment. When looking
    at the radios used by the target organization, be sure to note the antennas length
    and type. Antenna types are described in greater detail in the Antenna section
    of Chapter 2, however it is good to know that as a general rule the shorter antennas,
    the higher the frequency (such as 460 MHz) and the longer-the antennas the lower
    frequency (such as 150 MHz) used by the radio (Figure 5.8). The main exceptions
    to this are compact antennas which are designed to be small in size, and still
    operate on lower frequency ranges. These antennas may be ½ or ¼ (or even smaller)
    wave antennas.


    Like everything else in this book, and penetration testing in general, the more
    experience you have the easier the identification of antennas and their probable
    ranges will be. Having a properly tuned antenna is far more important when transmitting,
    in fact, transmitting with an improperly tuned antenna can damage the transmitter.
    This is another place where being able to take a picture of the target radio is
    helpful, as it will allow for you to research the antenna at your convenience.
    Manufacturer web sites and catalogs will


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_71_0.png)


    **FIGURE 5.8** Two Antennas Used for Different Frequencies, Reprinted with Permission
    from Meagan Call'
  merge: -1
