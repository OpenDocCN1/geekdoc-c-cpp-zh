  md: '# Why Radio Profiling?


    Information is everywhere, if you know where to look. When performing penetration
    tests, uncovering the correct information during the reconnaissance phase can
    often mean the difference between a successful test and failure. While many of
    us are familiar with the often used data gathering methods employed by penetration
    testers, radio traffic can provide a great deal of valuable information. This
    rarely used reconnaissance method, when used effectively, can provide a wealth
    of data. The information gathered by the methods described in this book is useful
    for both physical and logical penetration tests.


    In addition, with any other methods used by penetration testers, understanding
    the methods that can be used by penetration testers and attackers is useful when
    securing networks and facilities. To protect against attackers, it is necessary
    to think like an attacker.


    Not everything in this book will work in every situation, which is of course not
    unique of this method of reconnaissance. However, as the included case


    Guard Radios, Wireless Headsets, Cordless Phones, Wireless Cameras, Building Control
    Systems .........3

    Case Study ..................5


    > NOTE This book assumes that you are familiar with the basic concepts of penetration
    testing. Physical penetration testing is the process of testing the physical security
    of an organization or facility, while logical penetration testing is the process
    of testing the network and computer security of an organization or facility. Often,
    physical and logical penetration tests are combined; for example, once a facility
    is penetrated, we will then use the physical access to plug into the network or
    physically accessing equipment.'
