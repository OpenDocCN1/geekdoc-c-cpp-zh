  md: '![](img/2e4b8b26cfbdeba5a5a91921492f98df_53_0.png)


    # NOTE


    The addresses in the search can be the licensee’s address or the location of the
    antenna tower licensed to use the frequency. Always try to use a database that
    shows the antenna tower when looking for the frequencies used at a specific site.
    This is especially helpful for multi-location businesses as often multiple transmitters
    over a 75mile area are covered with a single, variably placed license.


    All the events in this case study happened, however we drew from events from multiple
    penetration assessments to create this scenario.


    The penetration team’s goal was to gain access to the ship dock, specifically
    the high-security area where the ships docked, and deliver a special package to
    prove we were there—a loaf of bread. In addition to the usual gates at the perimeter,
    the actual docks had additional security controls: a second fence, gates, cameras,
    automated ID card readers, and guards, to prevent people from moving undetected
    between the ships and the mainland. We noted that the ID card readers had no controls
    in prevent tailgating, so it would be possible to sneak in if security without
    watching the guards.


    We began offsite profiling by Google searching the name of the company and common
    radio terms. This turned up nothing of interest. Next, we searched for'
