    referred to as "monitor channels." This feature is valuable for penetration testers,
    and is very helpful when looking for a signal in a set area. One option to take
    advantage of this feature is to set up the scanner overnight or while you are
    working on other things, and return to see what the scanner found. You can first
    scan the range and lockout birds or other signals that are not of interest. This
