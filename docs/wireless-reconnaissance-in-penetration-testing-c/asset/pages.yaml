    - Physical Security.

    - MHz.


    > In the United States, the top five commercial grade two-way radio manufacturers
    are Motorola, Midland, Kenwood, Icom, and Vertex.


    there for the taking. Announcing that large company has chosen a particular radio
    product is perhaps a useful marketing tool; when purchasing decision it is helpful
    to know that others have chosen the same product. If you own a smaller business,
    and can''t afford to spend the time of money researching multiple products, then
    choosing the same product as a larger company may make sense. This information,
    however, is valuable to the penetration tester or attacker. These press releases
    will often include specific information as to the type of gear purchased as well
    as any special features of the gear.


    Aside from press release aggregation sites, there are many other ways to find
    these press releases. Industry magazines, Web sites, and other publications will
    commonly print or post press releases. Many of the major equipment manufacturers
    will also post press releases on their corporate Web sites. Of course, with any
    other information that is sought, search engines are a great place to start. When
    a press release is discovered, it is essential to review the details. Be sure
    that the press release is not so old that new equipment has likely been purchased,
    and for target organizations with multiple sites, see if the press release is
    location specific. It won''t necessarily be helpful to know the radio equipment
    used in the organization''s west coast location if you are targeting the east
    coast facility.


    Keep in mind that much like other equipments, a large amount of radio hardware
    is sold by resellers. Find out if there are any resellers near the target organization
    and scour their Web sites for press releases related to the target.


    Social engineering, when performed in an effective manner, can also provide a
    wealth of useful information. Calling the target organization and posing as a'
