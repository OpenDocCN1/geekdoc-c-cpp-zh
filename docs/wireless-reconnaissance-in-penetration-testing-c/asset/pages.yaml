  md: '# Everything is Going Digital 129


    currently very difficult to find. Information on the DEDECT toolset can be found
    at https://dededect.org/.


    DECT supports encryption in the form of a proprietary algorithm called the DECT
    Standard Cipher (DSC). Through research by the security community, it has been
    discovered that the encryption was poorly implemented, due to poor random number
    generation and inadequate key length, and the security algorithm has been broken.


    In many cases, encryption can be disabled on DECT devices by injecting a spoofed
    data packet that appears to be from the other unit, saying that it does not support
    encryption. Failing back to cleartext transmission, it now broadcasts unencrypted,
    leaving the communication exposed. This can occur mid-call.


    DECT''s broken-by-design security model is a good example of a vulnerability that
    went unnoticed until people started investigating them. What problems have gone
    unnoticed in the protocols and systems because security researchers have not looked
    at them and security was not thought about the start?


    # IMPORTANCE OF ASSESSING WIRELESS PRODUCTS BEFORE ARE IMPLEMENTED


    This is why it is important to research new radio technology before implementing
    it. Without fail, proprietary encryption schemes are weaker than publicly tested
    and reviewed encryption, because the public systems can be peer-reviewed by encryption
    experts, and flaws that are openly publicly corrected, or at least avoided. Security
    assessments are key when implementing a security system. Do not trust that encryption
    is strong or even. If you''re engineering technology, involve security researchers
    and testers in the process from the beginning. If you''re starting a project,
    do doing a risk homework before you start an assessment to determine what your
    risks are, and what level of security is needed. If at all possible, perform a
    vulnerability assessment on products and systems you are considering before buying
    them, especially, if your application for the system is sensitive or mission critical.
    Different organizations have different security needs. If you do encryption, avoid
    proprietary algorithms, and demand open standards such as Triple DES or AES. Having
    the ability to apply firmware updates is a great feature that more systems should
    utilize to patch problems


    when they occur. We are seeing more devices starting to support this. Customers
    should keep in mind how easy or difficult the firmware updates are to apply, however.
    Many devices support firmware updates, but may need to be sent back to the vendor
    or manager in the worst cases. Even in the best cases, you must visit device and
    manually apply the update, which is very time consuming.


    The advanced two-way radio systems and smartphones allow for over the air, which
    satisfies the patch, but this also opens a new vulnerability: rogue firmware injection
    over the air. Rogue firmware injection is currently more of a concern with devices
    where physical access is needed to install firmware, but it is a theoretical exploit
    vector that should be assessed. It is important to look out how the device verifies
    the firmware that is loaded onto it, to prevent from loading malicious firmware.
    Again, a risk assessment will determine whether this is a threat to the specific
    organization. Creating and loading a custom firmware is a sophisticated attack
    that many companies probably don''t need to worry about, given other vulnerabilities
    in their environment.


    * WiMot*'
