  md: '# New Technology


    As our world gets smarter, it seems to also get more wireless. This means greater
    exposure to risk and more opportunities for the radio frequency security researcher.
    Looking to the future of RF security, two things will define the future of radio
    hacking and wireless reconnaissance:


    +   - Everything is going digital.

    - Software-defined radios (SDRs).


    # EVERYTHING IS GOING DIGITAL


    Currently, there is still a lot of radio transmission, and there will likely be
    for some time, but increasingly radios are moving to digital. Currently, some
    scanners support decoding P25 that''s really the extent of the digital formats
    they can decode. It is likely that in time, more scanners will support TDMA formats.
    TDMA is a general format used by older cellphones, and is also starting to be
    deployed by radio systems. Motorola has a standard built on TDMA called "P25 Motorola
    X-TDMA" which is the upgrade to the current P25 systems. Motorola''s X-TDMA was
    released before Phase 2 requirements were finalized and is largely based on Phase
    2. So far, one scanner supports this: GRE PRS800—currently support for X-TDMA
    is in the testing stage. MOTOTROB is another TDMA-based digital radio scanner
    made by Motorola. Currently, no scanner can decode this.


    The other standards are up in and. Many of them are closed and manufacturers do
    not want to license the ability to monitor their scanners. Many use the fact that
    scanners cannot monitor them in their marketing as a feature. This thing does
    work to keep the general public being able to casually listen—for now. Of course,
    projects like


