    We went to the cargo area, and found an unlocked trailer. This part of the property
    didn''t seem to have guard coverage at the moment. We entered through a side door
    in the trailer, which was fortuitous because door happened to have an interior
    handle allowed us to open the door from the inside. The rear cargo doors did not
    appear to have a way to unlock them from the inside.


    We hid out in the cargo area and waited. Around 90 min later, they started moving
