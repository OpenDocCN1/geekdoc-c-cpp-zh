    # GUARD RADIOS, WIRELESS HEADSETS, WIRELESS PHONES, WIRELESS CAMERAS. BUILDING
    CONTROL SYSTEMS


    The targets on the radio spectrum consist of those that have been around for decades,
    such as the two-way radios used by guards, and those that are just beginning to
    proliferate as wireless video cameras. Some of the target radio traffic may have
    an obvious use for a security professional, such as Bluetooth keyboards. The ability
    to capture keystrokes can be invaluable for clear reasons. Other traffic, however,
    may have less obvious advantages. Later chapters cover the details of on- and
    off-site reconnaissance, and how to use the appropriate equipment. It is, however,
    important to first gain a basic understanding of the types of information available
    to an attacker. If the target organization has a guard force, the guard''s radio
    transmissions provide a wealth of intelligence. From the guard''s names, to shift
    changes, to internal jargon, there is much to glean. When launching a social engineering
    assessment, or attack, knowing the guard''s names adds credibility to the penetration
    tester or attacker. Listening in guard traffic may also let the attacker know
    when the guards will not be at their posts, either because of scheduled rounds
    or unscheduled bathroom or smoke breaks. To take things further, in combination
    with a police scanner, an attacker can learn the response times to


