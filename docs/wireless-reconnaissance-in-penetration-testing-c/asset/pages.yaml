    # Analog Modulation


    While most people are familiar with Amplitude Modulation and Frequency Modulation
    (AM and FM), there are many other modes in which different radios operate. FM
    is the most common mode of modulation in the United States that is of interest
    to penetration testing, but it is good to know and understand the other modes.


    # Common Analog Modulation Types


    +   - AM—Amplitude Modulated: The strength (amplitude) of the radio wave is varied
    to encode the information into the carrier wave. With used between frequencies
    below 30MHz, for shortwave radio transmissions, in the commercial AM band, and
    for aircraft communications such aircraft-to-aircraft or aircraft-to-tower.

    - FM—Frequency Modulated: The frequency of the carrier wave is changed to encode
    information into the radio wave.

    - Narrow (FMN) is commonly used by two-way radio systems. It is designed to transmit
    low audio fidelity signals and takes up bandwidth than the FM Wide (FMW) modulation
    (see below), which is used by broadcast FM stations and is discussed next. FMN
    is the most popular format for the focus of this book. With the exception of AM
    being used by aircraft, FMN is used for all two-way voice traffic transmitted
    over frequencies over 30MHz.

    - FM Wide (FMW) is used by commercial FM Broadcasters because it can transmit
    a higher fidelity signal than FMN. This increase in audio fidelity comes at a
    price and FMW takes up more bandwidth than FMN.

    - SSB—Single Sideband: This type of modulation is generally only used with shortwave
    frequencies below 30MHz, because it makes better use of bandwidth. It is used
    for two-way communications, typically applications like radio and ship-to-ship
    communications. Broadcast shortwave and AM radio stations do not use SSB because
    it requires a more complex radio which can be more difficult for the end user
    to tune.'
