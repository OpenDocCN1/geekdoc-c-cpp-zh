  md: '# Common Scanner Controls and Features


    # Manual Button


    # Program


    Program can be either a button or process followed to program a frequency to a
    channel. The control is different for each radio but is often similar between
    radios by the same manufacturer. The best source of information for instructions
    on using the programming function is the radio owner''s manual.


    # Lockout Button


    The lockout button is used to lock out a channel that it is not scanned. This
    is especially helpful if a channel has a lot of static for reason, or if you wish
    to ignore a certain channel. A common reason for using the lockout during reconnaissance
    is when there is another user group nearby, such as maintenance, and you are only
    interested in listening to other group, such as the security force. Some radios
    have temporary lockouts which will lock out a channel until the unit is rebooted.


    # Search


    The search feature allows you to program in high and low frequency stops, and
    the scanner will scan the defined range and stop on activity. Some units store
    frequencies where they find activity into scratch memory, sometimes


