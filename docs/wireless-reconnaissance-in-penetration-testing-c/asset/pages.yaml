- img_proc: true
  md: 'Intermodulation, Intermod: Spurious or false signals. Occur when multiple signals
    mix in a receiver or repeater.

    Ionosphere: The region approximately 40 to 400 miles above the Earth''s surface.
    This electrically charged regions refract radio signals.


    # K


    Key Up: Slang term for pressing the push to talk (PTT) switch on the radio so
    items into the microphone will be transmitted.

    kHz, Kilohertz: 1000 Hertz


    # L


    Law of Inverse Squares: The signal strength of a radio wave is inversely proportional
    to the square of the distance from the source. Because of signal strength does
    no grow in a linear fashion the closer you get to a transmitter. Instead signal
    strength will dramatically increase the closer you get to a transmitter.

    Line of Sight: As the name implies communication between two stations that are
    within sight of each other.

    Lockout: A scanner allows for the exclusion of specified channels from the scanning
    sequence. Can also be applied to the search on a scanner to exclude specific frequencies
    from the search sequence.

    Low Pass Filter: Filter circuit that allows frequencies below a defined point,
    and rejects frequencies higher than the defined point. See also High Pass Filter.

    LSB, Lower Sideband: Lower frequency sideband and transmitter carrier. See Single
    Sideband of a radio.

    Low Threshold: How weak a signal is able to pick up. Used to determine the sensitivity
    of a receiver.

    Lowest Useful Frequency, LIF: The lowest frequency that can propagate between
    two points.

    LTR: Logic Trunked Radio, or LTR, uses a transmission protocol developed by the
    E.F. Johnson company. LTR is used primarily in site applications.


    # M


    Maximum Frequency, MUF: The highest frequency that can propagate between points.

    Medium Wave: Used to describe any AM signal (540 Hz to 1700 kHz) Medium wave is
    technically signals between 300 to 3000 kHz.

    MHz, Megahertz: 1,000,000 hertz, 1000 kilobytes.

    Modulation: Altering the carrier of a transmitter to encode information into a
    radio wave.

    Frequency Modulation (FM) is the most popular types of analog modulation used
    over 30 MHz.

    Monoband Antenna: Antenna designed to operate on one frequency band.

    Multiband Antenna: Antenna designed to operate on multiple frequency bands.

    Multiph: Describes a signal that is reflected multiple times between transmission
    and reception.

    Multipath: occurs when the signal from a transmitter is bounced around and it
    arrives at the receiver at different times; the signals arrive at different points
    in the phase. Also known as Ghosting.


    # N


    Notch Filter: Combines high and low pass filters and only allows a small section
    of the spectrum through.


    # O


    Omnidirectional Antenna: Describes an antenna that can transmit and receive in
    all directions.'
