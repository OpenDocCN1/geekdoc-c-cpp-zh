  md: '# Modulation 31


    > TIP

    If you are planning on obtaining a radio that covers shortwave bands, consider
    getting one that supports single sideband so you can listen to more than just
    commercial shortwave.


    # Digital Modulation


    Digital modulation types are becoming more and more common as people look for
    new ways to conserve bandwidth. Thanks to data compression algorithms, a digital
    signal carrying voice data can take up less RF bandwidth than an analog signal.
    Digital can be higher quality for voice traffic, as well. This is due to error
    checking, which keeps the 1s and 0s of the digital stream preserved and automatically
    corrected within limits. A distorted analog signal, by contrast, cannot be corrected
    this way at the receiving end, and therefore will sound distorted. However, this
    comes with a trade-off. A badly distorted analog signal may still be demodulated
    and less discernible, and a good ear can make intelligible speech through the
    static and distortion. With a digitally modulated signal, if the distortion is
    too great, the error correcting cannot restore the signal, and if a packet cannot
    be demodulated, it gets dropped, resulting in codecs of the voice. Once you get
    dropped packets, you lose all voice traffic.


    Currently, the great challenge with digital modulation is finding a radio or software
    that is able to decode it. The situation that exists today is similar to the "code
    hell" issue that drove users crazy number of years ago when trying to watch videos
    downloaded from the Internet. Each video file was encoded with one of dozens of
    custom codecs. In order to decode the video data, you need the right code to watch
    the video, which was not included with the video file itself, and had to be downloaded
    and installed separately. Without any automated means of finding and installing
    the codec, it could take times a great deal of searching to find a web site that
    offered the codec for free download. Until just a few years ago, many video codecs
    in use were open license—and/patent-encumbered, and had to be purchased in order
    to be used legally.


    With digital radio demodulation, it''s more a of proprietary modulation not being
    made for scanners. Many manufacturers have developed their own method of modulation
    and consider it a trade secret that confers an advantage if they keep it to themselves,
    forcing customers to buy from them. Oftimes, the only way to demodulate a signal,
    other than with the proprietary radio that supports the format, is a time-consuming
    reverse-engineering effort.'
