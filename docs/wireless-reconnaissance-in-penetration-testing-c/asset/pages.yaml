  md: '# Case Study: Offsite Profiling 63


    +   - Cameras and lighting. We noted on our map the locations and coverage of
    all the cameras and lights, and made recommendations to the Client to cover blind
    areas, particularly in the vicinity of the train yard, where the exposed perimeter
    allowed us to enter the site undetected.

    - Lax security posture. Security staff need to establish and follow procedures
    closely, particularly at gates and other checkpoints. This is a constant battle
    to keep people following process. Without external reinforcement of process, it
    is simply human nature to relax as the job becomes routine, and this leads to
    shortcuts. First, we recommend to automate the process, because machines are much
    more reliable than people when it comes to following a process exactly the way
    every time. When a person is required to follow a process repeatedly, it becomes
    routine, and soon the person stops thinking. We find it better for the human elements
    in the security chain to think, and we recommend reserving them for tasks that
    require thinking and judgment, which are domains currently better suited to human
    beings. To the extent that people do need to adhere to process, spot checks and
    audits are helpfull. For Clients who are concerned about this, we help them establish-recurring
    physical penetration tests every quarter or to test the security force. If they
    know they are being tested to maintain a more ready posture, we recommend regular
    training and drills. When we run into cases of a lax guard force the first thing
    we recommend is more training, and not firing the guards. Firing the guards and
    bringing in new ones who also not be trained doesn''t fix the problem.

    - Inadequate coverage. The mobile unit performing duty at the inner dock gate
    was a cost-saving measure that left the Client vulnerable. When the mobile unit
    needed to be at the gate, it let the train unguarded. Better coordination with
    the foot patrol potentially could have remedied this issue. Additional lighting
    and cameras could have provided additional layers of security, further strengthening
    the perimeter hole. We recommended a smart video system, which can detect humans
    over other items automatically, which eliminates the need for a human to monitor
    the cameras. Even the best trained person will tune out after watching a video
    screen for a while. This frees the human to perform more valuable duties. Wherever,
    we like to recommend replacing humans performing non-thinking tasks with technology
    that is more reliable, while allowing that person to do something more rewarding.'
