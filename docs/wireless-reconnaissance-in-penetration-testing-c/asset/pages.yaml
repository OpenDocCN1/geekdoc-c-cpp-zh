  md: '# Applying the Science: Radio Technology Basics


    RF spectrum into different bands, which are commonly used by different types of
    services. The FCC is responsible for coordinating and issuing radio operation
    licenses, which authorize organizations to transmit specific frequencies, at specific
    power levels, in geographical regions. The FCC manages the RF spectrum, and therefore
    is required to keep and maintain public records of who is licensed to use which
    frequencies. This makes them a valuable resource for profiling targets. How to
    access and use this license information from the FCC will be discussed in Chapter
    4. Additionally electronic circuit emits an RF field when needed. Electronics
    manufacturers are required to certify products with the FCC, to guarantee that
    they are properly shielded so that their incidental RF emissions are properly
    contained and will not interfere with the operation of legitimately licensed broadcasts.


    Other countries have similar organizations to the FCC which manage and access
    to the spectrum in that country. Europe, each country has its own governing body
    that manages the spectrum within their borders. The ITU (International Telecommunication
    Union) is a UN agency that coordinates shared global spectrum. This body covers
