  md: '# Onsite Radio Profiling


    Once we have gathered as much information as possible offsite, it is time to go
    onsite and perform additional reconnaissance. Remember, of course, that the techniques
    described here are for profiling a target for which you have explicit authorization.
    Hearing the chirp of a police radio while performing a penetrationion assessment
    is rarely, ever, positive.


    The goal of onsite profiling is to discover the frequencies used by the target
    organization, and to validate the frequency information obtained during onsite
    profiling. We are looking for the frequencies used by the guard radios, facilities
    used by janitors and maintenance staff, wireless headsets if in scope, and any
    other radio traffic that may emanate from the target organization. This profiling
    does not require a special trip; it should be included in the normal onsite profiling
    that is part of any physical penetration test.


    # INITIAL ONSITE RECONNAISSANCE


    With any reconnaissance, it is essential to have an idea of what to look for.
    There are several things that you should keep an eye out for on any reconnaissance
    mission. Be sure to determine the nature of guards possible. This may require
    some inference, as for every guard that is visited from the perimeter, there are
    likely several more in other locations. The frequencies used by the guard radios
    are discovered monitoring the guards'' radio traffic is another way to verify
    the nature of guards onsite. Online map profiles serve aerial views which are
    a great starting point when you need a sketch of the target site. A sketch of
    the facility will help to mark locations of guards, antennas, and any other useful
    information. Pay attention to any antenna size on the property or building. Note
    to determine the frequency range it operates on. Once look for cameras,


