    that solves the problem.


    # Rebanding


    Rebanding, also known as reconfiguration, refers to changes in the 800 MHz band
    to allow on the Nextel Network and users on public safety networks to coexist.
    If you monitoring rebanded trunked systems, you must have a scanner that supports
    rebanding. If you attempt to monitor rebanded trunked systems without a scanner
    that supports rebanding, the scanner will go to an incorrect channel and will
    not be able to monitor the transmission. While rebanding is not usually a major
    concern if you are monitoring private trunked systems in the 800 MHz range.


    # Continuous Tone-Coded Squel System (CTSS)


    Continuous Tone-Coded Squel System (CTSS), also known as tone squelch or remote
    squelch control, is designed to allow users on a shared frequency to hear only
    users in their user group. Theoretically, CTSS will allow a user to hear only
    transmissions by their user group, and not subjected to the transmissions of others
    on the same channel. CTSS equipped receivers generally operate in either CTSS
    mode or normal mode. While in CTSS mode, the receiver''s audio will only be activated
    if the transmitted signal was sent using the same CTSS tone. CTSS is also helpful
    in noisy environments where a scanner could pick spurious signals that break the
    squelch. By programming in a CTSS tone for the scanner will not stop scanning
    unless a signal is present which also has the correct CTSS tone.


    # Digital Code Squelch (DCS)


    Digital Code Squelch (DCS) is a newer version of CTSS that operates by sending
    digital data using subaudible tones. Some manufacturers refer to DCS and Digital
    Private Line (DPL).'
