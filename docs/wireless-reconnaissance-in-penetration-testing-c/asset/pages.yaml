  md: '# Case Study: Onsite Profiling 85


    # TIP


    Although the Max System 8HH is no longer in production it can still be found on
    eBay. Additionally discone antennas is a fairly easy one to make at home. Searching
    for "how to make a discone antenna" will turn up a number of tutorials explaining
    how to make and tune a discone antenna to a specific frequency.


    The microphones could pick up conversations beyond just the wearer at times, and
    we could hear conversations taking place in a small office. We discovered this
    another company, and used the "feature" to gain valuable information from an upcoming
    merger. The city, the only authorized to use the headsets were executives and
    their assistants. In essence, the company not accidentally bugged their most valuable
    target, they filtered out a great deal of less interesting chatter for us.


    Our Client was also interested in seeing how far away we could monitor the headsets.
    With the normal antenna, we could listen to the headsets from about 100 ft away,
    at this site mean we could eavesdrop from the parking lot and street around. Using
    antennas tuned for 900 MHz (the Max Systems 8HH 900MHz discone antenna, which
    sadly had been disconnected) could easily monitor the headsets from two blocks
    (about 500ft) away, showing how performance can be increased by using a good antenna
    that matches the target frequency.


    # Remediation and Lessons Learned


    As a result of the RF survey, we recommended the Client to upgrade the wireless
    headsets to encrypted models, or if those were too expensive, replace them with
    digital headsets that would be more difficult to monitor. The Client determined
    that the expense was warranted the use of the wireless feature of the headsets
    was not critical to operations. Most of the headsets were replaced by a wired
    model, which adequately remediated the vulnerability at a much lower cost. Supervisors
    and other workers who needed the mobility of the wireless headsets were upgraded
    to digital models.


    To prevent inadvertent exposure in the future, the Client also implemented a process
    to test and approve wireless devices before they can be purchased. Using this
    process they generated a list of approved wireless headsets which could be purchased.


    # Lessons:


    +   - Know your equipment: Most organizations tend to focus on the desired features
    that a device provides them in order to do something useful.'
