- img_proc: true
  md: '# CHAPTER 4: Offsite Profiling


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_55_0.png)


    FIGURE 4 Radio Reference Database Databases Listings


    For this Client, these basic searches did not turn up anything. This was so odd,
    because large sites with lots of logistical needs invariably employ a radio system
    to help coordinate activities.


    Unable to identify a relationship between the Client and the companies in the
    area, we used the map feature on Radio Reference. We used this feature to find
    transmitters in the area, and located a transmitter tower on the Client site.
    But the licence did not match the name of our Client. Doing further research turned
    up information that established the connection we were looking for: the FCC license
    was still in the original name of the company, which had changed as the result
    of the buyout. The parent company, our Client, had never bothered to change the
    name on the license. This is not an uncommon situation to run into.


    Once we had established the connections, we now had useful information that we
    could act on. Thanks to Radio Reference, we knew they had a conventional four-channel
    radio system. In the Radio Reference database, Channel 4 was labeled "Security".
    The other three channels were used for operations.


    Armed with this information, we arrived onsite and programmed four channels into
    our scanner and started. Before long, we were able to confirm that Channel 4 was
    in use by security. We monitored this channel. Radio chatter confirmed that there
    were guards stationed at the main gate, but we never heard any transmissions from
    the second gate.'
