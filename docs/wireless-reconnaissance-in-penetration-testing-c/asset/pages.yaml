    With technologies such as 802.11 Wi-Fi (2.4 and 5 GHz), multipathing actually
    becomes a useful property. A Wi-Fi signal indoors will reflect off of surfaces
    (walls, cabinets, etc.) and reach corners which would otherwise be in shadow if
    a line-of-sight frequency were used. Wi-Fi radios have specialized circuitry which
    allows them to combine these multiple paths, shifting the out-of-phase wave forms
    arriving from multiple paths back together into a reconstituted signal that is
    stronger than what would have been received, allowing Wi-Fi to work at longer
    ranges than it would otherwise. Wi-Fi signals are partially attenuated by most
    building materials, and completely blocked by some, this is an important factor
    in 2.4 GHz''s usefulness in 802.11 applications.


