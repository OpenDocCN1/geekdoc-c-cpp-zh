  md: '# Out in the Field


    Sheriffs deputies. Searching for the casino name, however, we came up empty handed.


    We scoured the Internet looking for press releases and other information could
    tell us what types and brands of radios were in use by the casino guard force.
    In this search, we were not lucky. This just meant we would need to perform a
    little more onsite reconnaissance


    # OUT IN THE FIELD


    After packing up our equipment, and making sure that we had “get out of jail letter”
    in hand, we hit the road in earnest.


    The drive was easy, clear roads, and a clear night. A few hours later, we were
    in the parking lot of the casino. We immediately began to monitor the enforcement
    frequencies that we found on RadioReference.com, and discovered that they were
    correct. Remember, even though you may have discovered the frequency prior to
    arriving, you must always verify that it is correct. Sometimes people make mistakes,
    and sometimes frequencies change. We sat in the parking lot for a few hours listening
    to the scanner. It quickly became apparent that the police dispatcher and the
    casino guard dispatcher enjoyed talking about everything, work related or not,
    the open frequency. We learned the names of several second and third shift guards,
    as well as many other random facts about. One guard had a daughter that recently
    graduated from high school, and was planning a party. Another guard was notorious
    for leaving his post unattended. As some of the information we gathered prove
    useful and relevant, while other information would prove to just be noise. We
    kept notes of everything we heard. Even though we knew we remember a lot of the
    information, we still wrote everything down. The casino was undergoing a renovation,
    nothing major, new carpet and new paint. As the went on, we noticed contractors
    driving up to the gate of the employee lot in pickups and vans, being waved. Clearly,
    they were working in the overnight hours when the casino was less crowded to make
    sure they disturbed as few patrons as possible.


    > NOTE “get out of jail letter” is a common term in the security industry for
    the letter target will give you to describe the scope of the penetration test.
    If, during the course of the assessment, you find yourself mistaken for a real
    criminal, you can give the letter to enforcement to prove that you are not a burglar.
    Of course, don’t be surprised if you end up in handcuffs while the police contact
    the target company and verify your information and mission.'
