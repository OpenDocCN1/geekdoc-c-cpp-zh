  md: '# Glossary


    Output Frequency: In the context of repeaters, the frequency on the repeater will
    retransmit received signals on.


    Overloading: Interference causing false signals. Caused by strong signals within
    the frequency range.


    # P


    Passband Tuning: A receiver feature allows the user to adjust bandpass to get
    the best reception based on interference.


    Path: Route a signal from the transmitter to the receiver.


    Phase Locked Loop (PLL): Circuit which generates a large range of frequencies
    in discrete intervals.


    Phase Modulation (PM): Much like FM, PM varies carrier frequency in proportion
    to strength and frequency of the modulating signal.


    Phonetic Alphabet: Words used to represent letters of the alphabet to prevent
    confusion/understanding.


    Polarization: Describes whether an antenna transmits or receives in a vertical
    or horizontal plane.


    POTS: Plain Old Telephone Service. Voice grade telephone service.


    Preamplifier, Preamp: Receiving weak signal. A preamp will often create great
    background noise and cause signal distortion.


    Priority Channel: In scanners, the priority channel is a user channel that the
    scanner will check for activity more frequently or immediately if a signal is
    present.


    Propagation: Describes the process of a signal traveling from transmitter to receiver.


    # Q


    Quad: A type of directional antenna made up of two squares, each wavelength, a
    quarter aperture.


    # R


    Repeater: a device that receives a signal and transmits it, usually at a higher
    strength, helping radio cover a larger geographical area.


    Resonance: when an electric signal can travel from one end of a band and back
    in the period of one cycle of the RF frequency


    Resonant Frequency: The frequency where an antenna best receives or radiates.


    RF Gain: Control that continuously varies receiver sensitivity.


    Rubber Duck (Rubber Duck): A type of antenna, the rubber duck is an electrically
    monopole antenna which is sealed in a rubber housing. There is debate as to how
    the rubber duck oriented.


    # S


    S-Meter: A graph that shows the relative strength of a signal at reception.


    Scanner: A receiver that switches between multiple channels or frequencies, stopping
    when there is activity on the channel or frequency.


    Scatter: When a signal scatters directly from the ionosphere.


    Search: A feature of scanners and other receivers that scan a frequency at intervals
    and stops when a signal is present. Useful for finding transmitters in a set frequency.


    Selectivity: The ability of the unit to pull a signal out of noisy environment,
    or in other words, the ability to select between two signals that are close together
    on the spectrum. Depends primarily on the phase noise of the synthesizer and associated
    circuitry


    Sensitivity: Describes how well a receiver can pick up weak signals, in microvolts.


    Shortwave: Commonly used to describe frequencies between 1.7 to 30 MHz, shortwave
    is technically 3 to 30 MHz.'
