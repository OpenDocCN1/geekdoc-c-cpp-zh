    # COMMON RANGES


    Not every target will broadcast on a common frequency, however they will generally
    broadcast in a common range. Some scanner models will have bands preprogrammed
    for businesses, police, fire, and other channels, which may be useful. If you
    are using a scanner which supports custom bands, enter the common ranges prior
    to going onsite so you can quickly scan the common ranges. With any penetration
    test, the more work you can do offsite, the quicker the onsite portion, and the
    lower the likelihood of being detected. Manually scanning ranges can be a very
    time-intensive process. You can often narrow the ranges to be searched using information
    gathered earlier in the onsite profiling such the types of radios used and antennas
    on the radios. For example, if the radios used by the guard force only support
    frequencies between 450 MHz and 470 MHz that would be the range you want to search
    first.


