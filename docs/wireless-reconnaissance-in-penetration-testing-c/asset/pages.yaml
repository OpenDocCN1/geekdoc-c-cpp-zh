  md: '# Alpha Numeric Memory


    Alpha numeric memory feature on a scanner allows the user name each channel with
    a text string. In the past all a scanner would show a channel number and maybe
    a frequency. On those types of scanners you needed to remember Channel 1 is the
    fire dispatch for Lakewood, Channel 2 is the dispatch for Rocky River, and so
    on. When you program 200 channels into a scanner, it quickly becomes impossible
    to remember them all. This feature is very helpful when performing wireless reconnaissance
    because you may be visiting multiple sites in a week which makes the task of memorizing
    channels even harder.


    # Computer Programmable


    It is wise to spend more up front and acquire a scanner that can be computer programmed.
    Being able to program the scanner with your computer will allow you to use your
    full size keyboard, copy, and paste frequencies from manuals and Web Sites, save
    significant time if you need to enter a large number of frequencies.


    # Voice Squelch


    Voice Squelch is a radio feature where the scanner will only stop when it has
    identified what seem to be voices. While this can be useful to skip over data
    traffic that you may encounter during reconnaissance, it will only work as the
    vendor has implemented it. It is wise to assess the scanner''s ability to accurately
    pick out voice transmissions before using this feature on an engagement. Similarly
    some manufactures have a Data Skip features that skips channels that need to carry
    data signals. This feature achieves the same results as Voice Squelch.


    # Attenuator


    Attenuation is a filter that decreases the power of signals entering into the
    radio. The attenuator is inline between the antenna and the front end of the radio.
    Various scanner models implement attenuation differently, where some allow the
    attenuator to be set on a per-channel basis, while others require


    > NOTE


    Recent model GRE and RadioShack scanners have a reputation of the front end of
    the radio easily being overloaded in environments with lots of signals, such as
    metropolitan areas. This results in distorted audio or hearing signals on the
    incorrect frequency. Enabling the Attenuation feature on the radio will help decrease
    the strength of these signals and prevent the radio front end from being overloaded.'
