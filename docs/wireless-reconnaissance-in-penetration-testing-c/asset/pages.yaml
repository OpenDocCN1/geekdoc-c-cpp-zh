  md: '# CHAPTER 9: New Technology


    Conclusions and Looking Forward ....150


    GNU Radio are working to reverse-engineer these systems and create tools to monitor
    them. Digital Speech Decoder (DSD) is an open source software package that works
    with GNU Radio, which can decode some of these formats. For more on this, see
    the section on GNU Radio later in this chapter. There are many digital formats
    to be aware of, however, among them: Terrestrial Trunked Radio (TETRA), Vector
    Sum Excited Linear Prediction (VSELP), OpenSky, iDEN, EDACS ProVoice, and DECT,
    as well as numerous proprietary standards.


    TETRA is popular in Europe (in fact it is known as Trans-European Trunked Radio),
    but if it''s used in the United States, we haven''t seen it. VSELP is an older
    standard for digital encoding of speech, which is close to being phased out.


    The undeniable trend in electronics over the last 20–30 years is that more and
    more is going wireless. These days, it is more than just the IEEE 802.11 (WiFi)
    protocols, which is what more penetration testers are currently focusing on. There
    are lots of other standards—and proprietary wireless formats as well. As these
    grow in marketshare and mature, it will be increasingly important to be aware
    of their presence or potential presence in the environment.


    # Beyond 802.11—Digital Wireless Protocols


    # Digital Electronic Cordless Telecommunications (DECT)


    DECT is a format mainly used by cordless phones and headsets, where it is becoming
    the de facto standard, but may be found in other applications as well, such as
    baby monitors. Toolsets like DECT were built to intercept and attack these systems.
    The current implementation of the DECT requires a Dos Amand COM-ON-AIR Type 2
    PCMCIA Card (Figure 9.1), which is


