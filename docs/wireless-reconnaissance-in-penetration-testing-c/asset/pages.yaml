- img_proc: true
  md: '![](img/2e4b8b26cfbdeba5a5a91921492f98df_108_0.png)


    # Camera


    As discussed in Chapter 5 Onsite Profiling having a camera can be helpful for
    taking pictures of the radio equipment and antennas used by the target organization
    so they can be analyzed later. A camera with a good optical zoom will be of the
    most benefit. Additionally binoculars can be helpful for similar reasons.'
