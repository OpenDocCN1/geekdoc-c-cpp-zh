    # Programmable Verse Pre-Programmed Scanners


    Scanners are available both as pre-programmed units or as programmable units.
    The pre-programmed units are not particularly useful for the purposes of this
    book, and are intended for hobbyists all well automobile racing fans and railroad
    enthusiasts. A pre-programmed scanner may make sense to have


