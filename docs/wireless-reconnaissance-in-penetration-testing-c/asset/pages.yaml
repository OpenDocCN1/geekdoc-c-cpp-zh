    Remediation and Lessons Learned................85


    # TIP


    Different online mapping sites often have different sources for their aerial photography.
    Thus, when generating a map of a site, it is often beneficial to check the aerial
    photography from multiple online mapping services such as Google Maps and Bing
    Maps. For example, Bing Maps aerial view and bird eye views often contain images
    from different sources, which can allow you to view the site at different times
    of year, or from different angles.


    and see if they appear to be wireless, most wireless cameras with an antenna on
    them or are attached to a transmitter with an antenna coming out of it.


    # THE GUARD FORCE


    If there are security guards, it is essential to learn as much about them as possible
    profiling. This can easily mean the difference between a successful and an unsuccessful
    penetration test. Security guard uniforms hold a great deal of information. Contracted
    guards will often wear the uniform of the contracting company, and knowing the
    name of the guard company allows you to use the techniques in the onsite profiling
    to search for the frequencies they use. It is also common that there will be a
    mix of contracted guards and guards employed by the target organization. This
    is common in both the government and private sectors, and it is likely that in
    this situation the contracted and employee guards will be dressed differently.
    The contracted guards will generally wear standard guard uniforms, and the employee
    guards will often wear ties and blazers or suits. The employee guards are usually
    in locations where they interact with other employees, such as at the reception
    desk or assigned to executive protection while the contract guards will generally
    be patrolling the perimeter or guarding remote locations. If contract guards are
    present, it can take a week or more of observation to determine their shift rotation.
    Also note if the guards are the same day. While it is uncommon,


    # TIME IS OF THE ESSENCE


    Start a Frequency Counter the Minute You Arrive Onsite Time is usually the essence
    of the onsite profiling phase, the longer you are onsite, the more likely you
    are to be discovered. The more tasks you can run concurrently the more efficient
    your reconnaissance will be. We recommend using the Scout frequency counter (Figure
    5.1) (described in detail in this chapter) upon or prior to arrival, and letting
    it run while you are performing visual reconnaissance. The longer the Scout is
    able to run, the more information it gathers.'
