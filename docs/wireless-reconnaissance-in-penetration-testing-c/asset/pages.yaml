    # Telescoping Whip Antennas


    Telescoping whip antennas (Figure 7.12) can be tuned to the desired frequency
    by shortening or lengthening them. They are generally very good for receiving
    signals; however they do several disadvantages. They are not particularly rugged,
    and are fairly easy to bend or break during use. Their larger size makes them
    generally more difficult to conceal, which is at cross purpose for our intended
    use. They are also rigid, making them a poor choice when wearing a radio on your
    belt. If not careful, rigid antennas can also place strain on the radio and cause
    the internal antenna connector to the circuit board. If you plan to use a telescopic
    whip with a portable radio, choose one with a joint so that it can be pointed
    upward when the radio is laying flat. This will be a great help if using the radio
    at a table, desk, or in your car.


    # Recommended Handheld Scanner Antennas


    If you can get one antenna, we recommend a high-quality rubber duck antenna such
    as the Austin Condor or Diamond RHF7CA. Both are good multi-band antennas. Beware
    of rubber duck antennas that are very short, around an inch in size. These have
    very poor performance and will cause you to miss everything except very strong
    signals. If you need a small antenna you can easily conceal the Diamond RHF10
    which is only 2.75 in. high, very flexible, and can receive 450 MHz, 800 MHz,
    and 900 MHz signals prisingly well for its small size.


    If possible we recommend getting at least two scanner antennas. The second antenna
    should be a telescopic whip. The algorithm discussed in the Theory section of
    Chapter 2 can be used to figure out how long or short a telescopic whip antenna
    should be to match the target frequency. If you need to listen to a specific frequency,
    investing in a frequency-specific antenna may be a good option.


