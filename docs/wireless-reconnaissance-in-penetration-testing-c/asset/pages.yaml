  md: '# WHAT IS AN FSK?


    FSK stands for Frequency-Shift Keying and is a common digital modulation used
    to transmit information wirelessly. To decode FSK signals you need an FSK decoder.
    Decoders come in two types: 2-level and 4-level. These decoders are also called
    slicers.

    A 2-level decoder is a fairly simple circuit to build in hardware (Figure 9b),
    and can decode traffic up to 2400 Baud, although 1200 Baud is a more realistic
    limit. A 4-level decoder is a more complicated circuit to build, but still possible
    for the hobbyist, and can decode faster data rates, and will also decode 2-level
    signals.

    A hardware FSK decoder takes the audio output from a radio and converts it to
    serial (i.e. RS-232, or RS-232 over USB), which can be fed into a computer so
    the program can process it. The decoder does not need to know what data it is
    decoding.

    FSK decoding with the appropriate software, can be used to decode POCSAG and Flex,
    which are popular protocols used by pagers, Trunking Control channels, and APCO-25
    traffic.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_131_0.png)


    FIGURE 9.6 Hardware 2-Level FSK Decoder. Reprinted with Meagan Call


    Unless you know exactly how to decode the signal, we recommend capturing the RF
    signal to process it later. If you know how to decode the RF signal to a usable
    audio format you can do that as well. If the RF capture is done right (capturing
    the entire signal) you have the raw signal with no processing. Once the original
    RF signal has been processed into an audio format, if the audio signal was processed
    wrong (AM versus FM for example) the data needs to decode the signal could be
    lost.


    Usually an SDR will interface with the host PC via a USB cable, but some high
    performances use high speed connections as Gigabit Ethernet.


    # Disadvantages of SDR


    +   - Depending on what you want to do, it may require both software programming
    abilities and a deep understanding of RF and electronics. This can even be a concern
    when customizing someone else''s code.

    - Data decoding features are either expensive (commercial products), or else rough
    around the edges (open source software still in early development).

    - Some SDR hardware can be very expensive.'
