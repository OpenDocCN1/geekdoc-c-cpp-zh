- img_proc: true
  md: 'a tool you can use and gain value from. For most targets you do not need a
    fancy or expensive scanner to gather valuable information. In addition to the
    features discussed earlier in this chapter here are some criteria to keep in mind
    when selecting a scanner for wireless reconnaissance.


    # Form Factor


    When selecting the scanner first is to figure out what form works best for your
    needs. There are variety of form scanners are available including handheld (Figure
    7.1), base scanners (Figure 7.2), and mobile scanners. Many mobile scanners can
    be used as bases, or can be mounted in a vehicle, either hardwired or powered
    by the car''s 12V power socket/lighter receptacle. Handheld scanners tend to be
    small and battery powered, and many can use adapters to power the unit and lower
    operating costs if you use the scanner often. For most wireless reconnaissance
    work, especially the first radio, we recommend handheld scanners because they
    are the most portable and easy to power.


