  md: '# Offsite Profiling


    # WHAT IS OFSITE PROFILING?


    Offsite profiling is, as the name suggests, gathering as much information as possible
    prior to visiting the target site. As many things, the more preparation that occurs
    prior to the project, the higher the likelihood of success. Much of the information
    that will be useful is whether intentionally or not, and the methods described
    in this chapter will help you find it. A few things to attempt to determine prior
    to going onsite include the lingo and codes used by any radio user within the
    target, the make, model, and type of equipment used by the target, the frequencies
    that they are likely to use, and whether the guard for, if there one, is contracted
    or employees of the target.


    +   What is Offsite Profiling?...............49

    What to Look For................................49

    UsingRadioReference.com for Offsite Profiling.......53

    Case Study: Offsite Profiling................65

    Remediation and Lessons Learned................62


    # What to Look For


    To start, simply search the Web for the company name and some keywords related
    to scanner and radios. During this process, pay special attention to search results
    from scanner hobbyist forums. It is not unusual to find a local hobbyist has mapped
    out a company’s radio system and even made notes about lingo, company culture,
    and other valuable information. Johnny Long’s Google Hacking for Penetration Testers
    has many great tips and techniques that will be helpful during the process.


    Press releases are often a useful resource for determining the details of a contract
    guard and the radio equipment in use. Often, marketing departments or outsourced
    guard company win a contract, they want the world to know. A few press release
    aggregates, and it becomes immediately clear that there is a great deal of valuable
    information


    49'
