    without widespread adoption. Most organizations will think to test 802.11/WiFi
    devices, but don''t think about things like wireless headsets, cordless phones,
    two-way radios, remote controls, and RFID tags.


    +   - Better security isn''t always more expensive. Sometimes a simple, cheap
    solution, such as switching to wired headsets, is better than an expensive technical
    solution.


    +   - Be aware of what your organization is saying over the air. Avoid broadcasting
    critical information. If you must broadcast sensitive on a routine basis, come
