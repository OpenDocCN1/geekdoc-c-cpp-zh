  md: '# Building You Kit: Helpful Accessories


    video cable. Some high-end scanners such as the Icom IC-R9500 (Figure 7.18) have
    the ability decode video signals. However radios like this are outside of most
    budgets. Other options include getting a used Icom IC-R3 which is a handheld scanner
    that can decode video signals. Although no longer in production used models can
    be readily found on eBay and other online sources. A dedicated video interception
    device such as the Optoelectronics Video Sweeper or AOR-STV (Figure 7.19) is another
    option. These are self-contained devices explicitly designed to scan for decode
    video signals. Note that most of the units will only decode analog video signals.
    In Chapter 10 we''ll touch on how the upcoming technology of software defined
    radios can also be used to decode both analog and digital signals.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_111_0.png)


    # RF Amplifiers


    In general the authors of this book do not recommend using RF amplifiers (Figure
    7.20), also known as antenna boosters or pre-amplifiers. An RF amplifier will
    amplify not only the signal you are trying to hear but also RF noise in the area.
    Generally use of an RF amplifier will overload the front end of the scanner and
    cause you to miss the signal you are searching for.


    # Voice Inversion Decoder


    Warning: Be sure to check applicable state, local, and federal laws before attempting
    to decode transmissions using voice inversion.


    Voice inversion is a simple way to scramble audio transmissions to make them difficult
    to understand. Voice inversion technology can be broken down into two types single
    point inversion and dual point


