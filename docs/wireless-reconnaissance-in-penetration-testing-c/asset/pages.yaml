- img_proc: true
  md: 'writing, most P-25 systems were Phase 1 systems. Currently, multiple scanners
    can decide P-25 Phase 1 traffic. In Chapter 7 we discuss how to select a scanner
    suitable for monitoring these systems.


    At the time of this writing, half dozen P-25 systems have migrated to Phase 2
    or Motorola''s X2-TDMA system. Motorola''s X2-TDMA system was released before
    the Phase 2 requirements were finalized and is largely based on the P-2 standard.
    Currently supports for Phase 2 systems is very limited. The GRE PRS-800 has experimental
    support for P-25 Phase 2 systems. These systems become more widespread, most likely
    additional scanners will be made that support this system.


    # Common Types of Spread Spectrum Modulation


    These modulation types all incorporate methods that spread a signal over a chunk
    of the spectrum to make better use of the bandwidth and avoid interference. Monitoring
    these systems can also be difficult, since the hopping pattern can be difficult
    to follow. Spread spectrum modulation enables sharing of the electromagnetic media,
    in other words more users in the same area can transmit in the same frequency
    range without interfering with each other. This is because digital modulation
    broadcasts data in packets, with other radios that may be operating in the same
    area. In some systems, the hopping pattern is specifically made to be hard to
    track as an added security mechanism. Direct-Sequence Spread Spectrum (DSSS) and
    Frequency Hopping Spread Spectrum (FHSS) are two common types of spread spectrum
    modulation.


    DSSS spreads the signal over the full bandwidth of the transmitter''s frequency
    range. This is done using a pseudorandom sequence to determine how data is spread
    throughout the frequency range. DSSS signals look much like white noise when looking
    at their RF graph. DSSS modulation is used by a variety of wireless systems such
    as GPS, CDMA-based cellular networks such as Verizon 800.11b.


    FHSS rapidly switches the carrier across many different channels in a pseudorandom
    sequence. FHSS is used by many consumer devices that operate in the 2.4 GHz band
    as baby monitors, cordless phones, and wireless video cameras.


    With both DSSS and FHSS the transmitter and receiver need to share the pseudorandom
    pattern if they are going to exchange data. This offers a level of security because
    an attacker would need to figure out the pseudorandom pattern to intercept the
    transmission.'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# RADIO SYSTEMS


    A single radio by itself is not much of use. In order to work, you need a system.
    The most basic system system consists of a transmitter and a receiver, using a
    common modulation type. More commonly in radio reconnaissance, we deal with two-way
    radios, from pairs of transceivers to complicated radio networks and trunked systems.
    Next, we''ll review the common types of systems and describe how they are structured.


    # Simplex and Duplex


    Two-way communication can be handled in a few different ways, depending on the
    sophistication of the radio system. This gives different systems capabilities.


    # Simplex


    Sometimes simplex is referred to as half-duplex. In simplex two-way radios, communications
    take place over a single frequency. This means that only one person can talk at
    a time. To prevent talking over each other, most users of simplex systems employ
    a spoken protocol to mark beginning and end of transmission (e.g. saying “Over”
    when speaking.) Monitoring the conversation on a simplex system is easier, because
    you only need to monitor frequency.


    # Two-Frequency Simplex


    Some call split-frequency simplex, or split-frequency half-duplex. Transmission
    and reception take place over different frequencies, but you can only transmit
    OR receive at the same time—you cannot do both. If listening in, in order to hear
    the entire conversation you will need to listen to both frequencies on your scanner.


    # Duplex


    Sometimes called duplex, to differentiate from half-duplex. With a duplex radio,
    two frequencies used—transmit and receive. The radio is able to transmit and receive
    simultaneously, allowing both parties to speak and listen at the same time like
    a telephone conversation. In fact, a common application for duplex radios is with
    cordless telephones. With duplex radios, it is necessary to monitor both frequencies
    to get the entire conversation. However, some systems retransmit both sides of
    the conversation over one of the frequencies. Transmitting both sides on one channel
    is common with cordless phones. So always beneficial to try to monitor both frequencies
    to see if one retransmits both sides. If one does, it saves the work of having
    to monitor the other.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Radio Systems 35


    If you are only hearing part of a conversation on your scanner you are probably
    listening to a two-frequency simplex or full duplex conversation, so this should
    be a clue that you have another frequency that you need to find. Once you''ve
    found both the send and receive channels, program both frequencies into your radio
    to monitor them.


    # Repeaters


    A repeater is exactly what the name sounds like. It is a device used to extend
    the range of a radio. When a signal is transmitted to a repeater, it boosts the
    signal and rebroadcasts it, extending the range of the original signal. It is
    essential to note that repeaters have separate input and output frequencies. If
    not for this, the retransmission would be picked up by the repeater, creating
    a feedback loop, and render the repeater useless. When listening to a repeater
    frequency; if you listen to the input frequency, you will only hear the traffic
    in your local area. For amateur repeaters there are repeat offsets depending on
    the band of the frequency. Commercial repeaters do not follow a standard. Instead
    the input and output frequency are depending on what frequency the FCC licenses
    for them to use.


    Repeaters may be fixed, or may be mobile. Fixed repeaters are (usually permanently)
    mounted in a fixed location, while mobile repeaters are attached to a mobile platform,
    such as a vehicle.


    Fixed repeaters are also often stationed in places to increase the broadcast area
    by extending the horizon and minimizing line-of-sight issues. They are commonly
    mounted on hill or mountain peaks, or the highest available areas of local geographical
    elevation, tall buildings, and purpose-built towers. For example, a handheld repeater
    is being used in a valley, a repeater positioned on high ground can catch the
    signal and retransmit it that other can receive it. Multiple repeaters can be
    linked so a signal is transmitted over multiple locations. In this way, short-range
    signals can be relayed across vast distances, even across a country or state.
    Mobile and fixed repeaters may be used in concert, augmenting each to create radio
    networks.


    Repeaters frequently use Digital-Coded Squelch (DCS) and Continuous Tone-Coded
    Squelch System (CTSS) for Media Access Control in Radio, below to prevent spurious
    signals from entering the repeater and being retransmitted. This can also function
    as a simple and inexpensive form of access control because someone wants to transmit
    using the repeater needs to know the CTSS or DCS code used by the repeater. However,
    keep in mind that many radios have a feature that will automatically determine
    the CTSS or DCS code in a received signal so this is also a fairly weak form of
    access control.'
  merge: -1
  pgno: 34
- img_proc: true
  md: '> NOTE

    Some police vehicles act as repeaters for handheld radios, repeating and amplifying
    the signal from the officer''s handheld, allowing the signal to reach the main
    dispatch center.


    # Media Access Control in Radio


    Media access control is any of the types of methods that enable multiple people
    to share the RF spectrum. A number of systems have been developed over the years
    to make better use of the spectrum.


    The radio spectrum is a finite commodity, and getting increasingly crowded. Because
    of these limited availability of open spectrum, it is expensive to get licenses
    for multiple channels. To deal with these limitations, different approaches, from
    techniques improved in the field, to increasingly sophisticated technological
    innovations have been developed to provide ways for multiple groups to share the
    same frequency of system.


    In its simplest form, operators simply listen to the channel and wait for it to
    be clear before transmitting provides access control consists of using CTCSS or
    Digitals Squel Tones (see below). In its most complex form, access control is
    accomplished with trunking.


    # CTCSS


    Continuous Tone-Coded Squelch System (CTCSS), also known as tone squel, is designed
    to allow users on a shared frequency to hear only users in their user group. Each
    group is assigned its own squel tone, and the radio only plays to the audio when
    the squel tone is transmitted. The transmitter adds a sub-audible code to the
    transmission. The receiver, if in CTCSS mode, lists for the transmission and the
    unique sub-audible code. The receiver''s audio will only activate if both the
    transmission and the sub-audible code are present. Theoretically, CTCSS will allow
    a user to hear only transmissions by those in their user group, and not be subjected
    to the transmissions of others on the same channel.


    CTCSS-equipped receivers generally can operate in either CTCSS mode or normal
    mode. While in CTCSS mode, the receiver''s audio will only be activated if the
    transmitted signal was sent using the same CTCSS tone. CTCSS tones are standardized
    by the Electronic Industries Alliance (EIA) in standard RS-220.


    One important caveat with CTCSS systems, from a user perspective, is that CTCSS
    does not somehow create extra bandwidth. There is still one channel in use, and
    it cannot carry more than one transmission without'
  merge: -1
  pgno: 35
- img_proc: true
  md: '# NOTE


    CTCSS does not provide any scrambling or privacy protection. Heeding the CTSS
    signal and ignoring the transmission from other groups is "voluntary" and a radio
    does not need to know the code tone in order to listen to the broadcast.


    # NOTE


    CTCSS has several different commercial names that vary by manufacturer.


    +   - Motorola—Private Line or PL Tone

    - GE and Bendix—Channel Guard (CG)

    - Icom—C-Tone

    - Kenwood—Quiet Talk (OT)

    - Johnson—ToneGuard (TG), CallGuard (CG)


    interference. However, because users in one group cannot hear the transmissions
    of the other group or, they may not know whether or not the channel is clear before
    attempting to transmit. Because of this, most radios using CTCSS are designed
    so automatically will not transmit when the channel is occupied. The radios in
    these systems are not capable of prioritizing traffic based off of user groups.
    So, if a high-priority user like a fighter needs to transmit while a dog catcher
    is talking, the fire fighter will need to wait for the dog catcher to finish before
    they can transmit. Obviously, for this reason, CTCSS may not be suitable for mission
    or life critical applications. As users, or in this case, groups of the same channel,
    congestion builds as traffic increases. The more often one is transmitting, the
    more likely there will be interference. There are some ways to mitigate this interference,
    including features that do not allow new transmissions when the channel is in
    use.


    # Reconnaissance of CTCSS Equipped Radios


    A receiver with the CTCSS turned off will hear all transmissions on the channel.
    Users of CTCSS may incorrectly believe that CTCSS provides some degree of security,
    and may be more likely to discuss non-public information. This can be of use to
    gain our advantage as penetration testers.


    # Digital Code System


    Digital Code System (DCS) is a digital version of CTCSS. Motorola called their
    version of this access control technology Digital Private Line (DPL).'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems


    > NOTE

    CTSS and DCS tones are also used by repeaters to prevent rebroadcasting spurious
    signals. In these instances the repeater will only broadcast signals that have
    a specific CTSS or DCS tone transmitted with the input signal.


    For DCS there are only up to 100 possible codes. With CTSS the presence of a DCS
    tone does not encrypt or scramble the signal, so it''s not really private. With
    DCS, a receiver with the DCS function turned off will hear all transmissions on
    the channel. Again, the false sense of security can provide opportunities for
    attackers and penetration testers should look for them.


    # Trunking


    During the early years when radio was still a new technology, and not widely deployed,
    efficient use of the spectrum was not a major concern. Those days are long gone,
    and the RF spectrum was a limited commodity. In the early days of radio, the RF
    spectrum was a frontier being settled, and the FCC was brought into existence
    to apportion the spectrum to avoid conflicts. Later, as radio became increasingly
    popular, this did not adequately apportion the band—it wasn''t enough to license
    one operator to use a particular frequency in a particular region at a particular
    power level, especially with bands of the spectrum that are not used for commercial
    broadcast, and thus are not in 24/7. For two-way radio systems with many users
    in the same general region, licensing in the old way was no longer adequate. It
    became necessary to devise better techniques of utilizing those parts of the band,
    in order to allow more efficient use of it by many operators. And this was what
    that trunking was devised to address. Where older systems allowed only a smaller
    number of operators to use two-way radios in a given region without constant channel
    making the system difficult to use, trunking systems made it possible to share
    in a narrower band of channels. Today, the radio spectrum is a finite resource,
    and are increased demands and competition for access to the RF spectrum. The RF
    bands used by two-way radio systems are in demand too much for underutil to be
    acceptable. With the FCC tightly controlling access to frequencies, and step sizes
    growing smaller to fit as much traffic as possible into frequency ranges, efficiency
    is a must. This is when trunked radio systems come in. A trunked system is designed
    to make better use of the spectrum to allow a greater number of users to share
    a small number of channels, in greater density than otherwise might be practical
    to achieve.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Trunked Radio Systems in Depth


    Trunked radio systems centrally manage a pool of channels, and intelligently switch
    users to whatever channel is open at a given time. This is often a difficult concept
    for scanner enthusiasts to understand, as represents a paradigm shift in design
    of the system. Trunked radio systems are one of the most complex types of radio
    systems in use today. Trunked radios use several channels or frequencies, and
    allows those channels to be shared by a large number of users, in talkgroups,
    without their conversations interfering with each other.


    Talkgroups are defined groups of users. For example, all police officers and dispatchers
    would belong to a police talkgroup; all fighters and fire employees would belong
    to a fire talkgroup, and all municipal waste collectors would be in a waste management
    talkgroup.


    Trunked systems use a control channel, called the trunk, which transmits data
    packets which allow a talkgroup to carry a conversation by telling members of
    a talkgroup which frequency to communicate on when they key up. This allows for
    a large number of users to communicate using only a small number of frequencies,
    and efficient use of those frequencies.


    Trunked radio systems operate on the assumption that not all talkgroups will be
    in use at once. This allows for the channels to be shared by multiple talkgroups,
    achieving a more efficient use of the band. Rather than requiring all radios to
    be set to the same frequency, thus monopolizing frequency whether or not it''s
    actively in use, trunked systems allow for many users to share multiple frequencies.
    This means that far fewer frequencies are required to support the radio traffic,
    and therefore greater efficiency of spectrum allocation.


    Talkgroups also allow for more granular assignment of groups. This keeps conversations
    relevant to the group that needs to hear. Consider a simple example of municipal
    refuse collection. In a traditional non-trunked system, the refuse collection
    department would be assigned a frequency, and all users would hear all transmissions.
    With talkgroups, several distinct groups can be created. There could be one talkgroup
    for all trash collectors, and another overlap for an overlapping subset of trash
    collectors as those who only pick up recycling. When a communication is only relevant
    for the recycling group, the recycling talkgroup can be used, sparing the wider
    refuse collection group from having to hear the communication.


    Trunked systems generally utilize a bank of channels for talking, and a control
    channel of some type. Depending on the type of system, the control channel may
    be fixed (dedicated), or a random channel which changes (dynamic). Regardless
    of the type of trunking system and the control channel type, all trunked systems
    need a way to let users know on which frequency they'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems


    talkgroup is on. The control computer sends a signal to all the radios which are
    part of the talkgroup, which instructs the radios assigned to that talkgroup to
    tune to a specific frequency.


    In many, if not most, trunked systems, the transmission and reception will remain
    active on the same frequency until the communication sequence is complete. With
    these types of systems, even without a trunk-capable radio at your disposal, you
    can at least follow the conversation if you could cross over one. Keep in mind,
    however, without trunking support, it won''t be possible to know which talkgroup
    you have found, and are in essence in the dark.


    Other systems will change the frequency used for communication each time a user
    keys up. In these types of systems, it is generally very difficult, if impossible,
    to follow a conversation unless you have a trunk-capable radio.


    An additional advantage of trunking systems is, the allotted frequency becomes
    saturated, the controller can prioritize traffic. This is especially useful in
    municipal systems where there is limited spectrum available for multiple services.
    For example, in a given city, the Fire Department may have priority over the Police
    Department, who may have priority over the Service Department, and so on.


    Many trunked systems also have a feature where the radios (mobile, handheld, and
    central dispatch) have an emergency button. When the emergency button is pressed,
    the system will drop lower priority users and traffic from the system to allow
    the emergency traffic to get through.


    # Manufacturers of Trunked Radio Systems


    There are five major types of trunked communication systems use in the United
    States: Logic Trunked Radio (LTR), developed by the E.F. Johnson Company; Enhanced
    Digital Access Control System (EDACs), developed by General Electric (GE); Motorola’s
    Type I and Type II systems and P-25 which is an open standard developed by Association
    of Public-Safety Communications Officials (APCO). With the exception of P-25 all
    of these trunking systems are made by competing companies so the trunked systems
    are proprietary and not compatible with each other. The most popular system is
    Motorola’s. LTR is used primarily in single-site applications. P-25 systems are
    gaining popularity because it is an open standard that ensures interoperability
    and the ability to use multiple manufacturers’ radios in the system.


    The larger and more complex the target is, the more likely it is that they would
    deployed advanced radio systems. Trunked systems are common in government, as
    they allow municipal services such as fire, police, and service departments to
    share an allotted spectrum. In the commercial sector, trunked'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'systems are deployed at large corporate campuses, amusement parks, and sporting
    arenas. Increasingly, companies are also lease space on an existing trunked system,
    instead of building out their own systems.


    # Monitoring Trunked Radio Systems


    Listening in trunked systems is more complex than listening to non-trunked systems.
    The penetration tester is likely familiar with packet switching in computer networks,
    and the operation of the trunked radio system is essentially that of a packet
    switching network. There are scanners specifically designed to listen to trunked
    conversations, and you will need one to effectively listen to trunked traffic.
    Without a trunked-capable scanner, you may be able to pick up bits of conversations;
    however it is nearly impossible to consistently get the entire conversation. The
    basics of using a trunked-capable scanner are covered in Chapter 7.


    Trunking systems that can cover a wide area or multiple sites can be made up of
    multiple repeaters. Many states have created trunked networks using repeaters
    that cover the entire site. In trunking each repeater or transmitter tower is
    referred to as a site. Multi-site trunked systems can be divided into two categories
    simulcast and SmartZone.


    In a multicast system a transmission that comes into the system is broadcast by
    every site in the system. In a SmartZone system each unit checks into the nearest
    site in so the sites have a list of all the units using them at any given moment.
    A SmartZone site only broadcast traffic if a user in the target talkgroup is using
    that specific site.


    An analogy for this to help users familiar with Ethernet networks is to imagine
    a multi-site trunked radio system as an Ethernet hub or switch where each port
    on the hub or switch is a trunking site. In this analogy a system would be an
    Ethernet hub because traffic comes into one port (site) is broadcast out to all
    the other ports (sites) in the system, it does not matter which talkgroup the
    traffic destined for. All ports (sites) still see the traffic. A SmartZone system
    can be thought of as an Ethernet switch where traffic comes from one port (site)
    destined for a specific talkgroup and is broadcast broadcast to the ports (sites)
    where members of that talkgroup are connected.


    > TIP

    Trunking capable scanner often has complicated programming functions. The best
    reference for programming your scanner to work with trunked systems is your scanner''s
    manual.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 42 CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems


    As you can image, multicast system make very poor use of valuable channels in
    large and complex systems. If you have a trunked system that spans over a state
    oftentimes there is no reason to broadcast police or fire traffic to all the cities
    in a state. SmartZone systems make much better use of the limited number of channels
    in a large trunked system but only transmitting information if a user is in the
    target talkgroup.


    From a wireless reconnaissance point of view, the types of system used will affect
    what traffic you can hear, based off of which sites you can hear traffic from
    and which end users are using those sites. In a multicast system you will hear
    all traffic in the trunked system no matter which tuner you can monitor. In a
    SmartZone you will miss traffic if there are no users of the talkgroup checked
    into a tower that is within range. The easiest way to avoid this is to be within
    range of the site that is closest to your target. Most likely the talkgroup you
    are interested in will be in near your target so units in that talkgroup will
    be checked into that site.


    # SUMMARY


    Fundamental concepts that we have explored in this chapter are essential knowledge
    for the penetration tester. Refer back to this chapter often to develop familiarity
    with these concepts. To review what we''ve covered:


    +   Radio Frequency (RF) is a large part of the electromagnetic spectrum, from
    3000kHz to 300,000MHz.

    All electromagnetic signals move through a vacuum at the speed of light. Because
    of this, frequency and wavelength are inversely related to each other. Low-frequency
    waves have a high wavelength, and high-frequency waves have a short wavelength.
    If you know the frequency, you can determine the wavelength and vice versa.

    nThe SuperHeterodyne design is the most common in modern radios. It consists of
    an antenna that feeds incoming signals into a “head end” (comprised of the RF
    Amplifier, Tuner, and Mixer), and from there is into the Demodulator for conversion,
    amplified by the audio amplifier, and finally output through a speaker.

    A good antenna is critical to radio performance. The antenna’s length determines
    what frequency it is tuned to; shorter antennas pick up higher frequency waves.
    The wave length is twice the length of the antenna. To know what length an antenna
    is tuned for what frequency, use the equation


    ```

    492 = 0.5 x wavelength = length of antenna (in feet Frequency (MHz)

    ```'
