    # THE ELECTROMAGNETIC SPECTRUM


    In the nineteenth century, electricity and magnetism were understood to be separate
    phenomena, until discoveries by Michael Faraday, James Maxwell, Heinrich Hertz,
    and others unified these two forces under a single theory of electromagnetism.
    Electromagnetism is concerned with the forces that occur between electrically
    charged particles, and today is considered one of four fundamental forces by modern
    physics. This paved the way for the inventions of Marconi and Tesla only a few
    years later, and an accelerating avalanche of innovation that continues to this
    day. In the twentieth century, a continuing trend of reductionism in the field
    of physics endeavors to unify forces (gravity, electromagnetism, weak, and strong
    nuclei) into one Unified Theory. However, all technological applications of radio
    that are of interest security reconnaissance do not depend on such advanced physics,
    and can be well understood using the groundwork provided by Maxwell and his contemporaries.


