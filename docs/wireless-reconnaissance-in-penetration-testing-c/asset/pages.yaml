    # CASE STUDY: ONSITE PROFILING


    Internal penetration test at a large insurance company located in a downtown of
    a large city.


    The following story is, well, mostly true. Because we are professional security
    people, we cannot disclose details of our clients'' systems nor their names. All
    the events in this case study happened, however we drew from events multiple penetration
    assessments to create this scenario.


    Initially, our scope included only the internal network, we were looking at attack
    vectors from someone who had already gained physical access to the building, or
    a rogue employee. During a walkthrough of the building, we noticed employees on
    the phone were using wireless headsets (Figure 5.9). People often assume wireless
    headsets have very short range and can''t be monitored outside the building. We
    talked to the Client to see if we could expand the penetration test to include
    monitoring the headsets. The Client agreed to include headsets, so we worked on
    changing the rules of engagement to include them. For this, we needed to engage
    our lawyer, the Client''s legal staff, and Human Resources, to make sure this
    was in a way that did not violate any laws or internal policies.


    We started the penetration test by gathering information. Using Yaesu VX-5r (Figure
    5.10) and Unid Bearcat BCD396XT (Figure 5.11) scanners we search for signals in
    the frequency ranges commonly used by wireless headsets, reference the Common
    Cordless Phone and Headset Ranges section earlier in this chapter.


    Our scans detected a number of signals of interest in the 900 MHz range. After
    completing the initial survey to see what signals we could detect, we needed to
    verify which ones were inside the target building. This was an important step'
