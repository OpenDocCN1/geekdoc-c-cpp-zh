    # VISUAL RECON


    As with other types of reconnaissance, a sharp eye is an essential tool in radio
    profiling. Being able to examine a radio used by the organization, whether from
    a distance or up close, can provide a wealth of information. Often, organizations
    will place stickers on the radios listing the channel assignments, for example
    channel one is security while channel 2 is maintenance. It is also common that
    these channel listings will be posted in stations or behind the reception desk,
    be sure to look around.


    Identifying the model of radios in use by the target organization is invaluable.
    Many radios have the manufacturer name prominently displayed on the outer housing,
    and some will have the model or series number. This is another place where having
    a camera can be helpful. A quick snapshot will allow you to take all the time
    you need to research and determine the radio and model once you are offsite.


    Once you have determined the type of radio in use by the target organization,
    there are a wealth of resources to enable you to gather a large amount of


    > TIP a camera with a zoom lens when using a penetration test, and taking pictures
    of equipment or frequency lists is one of them. If your frequency counter does
    not have a memory function you could also use the camera to take pictures of the
    frequencies displayed on your frequency counter for later review.'
