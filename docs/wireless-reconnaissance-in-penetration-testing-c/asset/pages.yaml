  md: '# CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems


    # WHY 10.7 MHz?


    The choice of 10.7MHz for the Intermediate Frequency is a convention that was
    settled upon for a number of practical reasons. The standardization came about
    when Superhet receivers were first being made for the broadcast FM band in the
    US. 10MHz was picked because any harmonics created by the mixer would fall outside
    the FM band (which is 20MHz wide). The 0.7 was picked because the frequency spacing
    in the US was 2MHz—since 0.7 is not a multiple of 0.2, any harmonic signal generated
    by the mixer would fall between channels, and thereby minimize their interference.
    From then on, 10.7MHz became the popular value for other FM receivers as scanners,
    most likely because there are lots of parts that are already designed and tuned
    to work with this IF, and using those parts is cheaper than designing new.


    Most scanners put the signal through 2–3 conversions. This is referred to as double
    and triple conversion. High-end radios have quadruple conversion. Generally, the
    more conversion, the more likely the radio is to filter out spurious signals.
    This will better in RF environments like urban areas. As radio emitters become
    increasingly commonplace, more and more places are becoming RF rich. Triple conversion
    but this needs to be watched more when purchasing a used radio. We recommend getting
    a triple conversion scanner if you can afford it.


    +   4. Local Oscillator: The local oscillator could be separated from the mixer,
    but it is a key component that makes the mixer work. The local oscillator creates
    radio waves at different frequencies, and is often referred to as a VFO (Variable
    Frequency Oscillator). The frequency created by the VFO changes in proportion
    to the frequency radio is tuned to. This occurs when radio waves from the local
    oscillator and tuner are combined they exit the mixer at the IF frequency. If
    the VFO did not change frequencies, the IF produced by the mixer would change
    the tuner changes.


    +   5. Demodulator: The demodulator extracts information carried by the radio
    wave, and (usually) converts it to an audio wave. For example, an FM radio uses
    an demodulator to extract the information needed to reconstruct the radio station
    is broadcasting. There are many types of modulation and demodulation. Other types
    will be covered later in this chapter.


    +   6. Audio amplifier: This component amplifies the audio signal out of the demodulator
    to a level the end user can hear it. This is almost always variable, in order
    to provide volume control. The audio amplifier often contains filters to clean
    up the signal. Although the filters make the'
