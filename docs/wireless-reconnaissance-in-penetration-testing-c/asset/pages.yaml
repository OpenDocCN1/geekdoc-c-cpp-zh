  md: '> TIP

    Suction cup window mounts (Figure 7.16) can be a great tool during reconnaissance.
    They allow you to mount antennas in hotel or office window, or inside a car. While
    generally people don''t notice antennas on vehicles, mounting the antenna inside
    can be a great option when you do not want extra attention.


    # Headphones or External Speakers


    Headphones are another must have accessory when performing wireless reconnaissance.
    They will allow you to discretely listen to radio traffic. The crackle of a police
    radio dispatcher will always gather attention in public. When working in a car
    an external speaker can help hear transmission over road and engine noise. When
    getting a speaker to use in a car you can also consider getting one with a build
    in audio amplifier so you can turn up the volume loud enough to clearly hear radio
    traffic.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_110_0.png)


    # Audio Recording Equipment


    Being able to record information that you are receiving is helpful if a transmission
    needs to be reviewed to gather additional information or if you want to record
    activity on a channel while you are away from the radio. Also recording and playing
    back the information leaked by a company can be a great way to illustrate the
    risks to upper management of the intercepted data. Many desktop and mobile scanners
    have a line out specifically for being hooked up to a recording device. If you
    have a handheld scanner you can connect the recording right into the headphone
    jack. When selecting an audio recorder pick on that has a build in VOX feature
    that will start recording only when audio is present. Finally select a recorder
    that will time stamp the audio files so you can look up with the transmission
    occurred. Note that some scanners such as the Uniden Home Patrol, GE PSR-800 and
    Icom R-20 (Figure 7.17) can come built with sound recording capabilities.


    # Video Decoder


    The ability to decode signals given by a target organization is immensely helpful.
    Many organizations will use wireless security cameras to monitor area where they
    cannot easily run a


    FIGURE 7.16 Suction Cup Windows Antenna Mount, Reprinted with Permission from
    Meagan Call'
