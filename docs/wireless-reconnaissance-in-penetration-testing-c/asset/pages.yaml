    # How Materials Affect Radio Waves


    When performing radio reconnaissance, it is obviously essential to be able to
    receive radio waves. Therefore, it is helpful to understand how certain materials
    attenuate, or block radio waves. Where radio waves are concerned, matter can do
    one of two: it can conduct radio waves and be a conductor, or insulate and be
    a dielectric. The majority of conductors are metals, and the majority of dielectrics
    are non-metallic. When a radio wave encounters a material, some quantity of power
    will be reflected by the surface, some quantity of power will pass through the
    material, and amount of power absorbed by the dielectric is the material''s attenuation
    coefficient. The quantity of energy that is able to pass through a dielectric
    is determined by the material'' attenuation coefficient and thickness. A low attenuation
    coefficient will allow radio waves to easily pass through the material.


    **FIGURE 2.4** Atmospheric Layers


    # Multipath


    Multipath occurs when the signal from a transmitter bounces around enough that
    it arrives at the receiver at different times (Figure 2.6). When this happens,
    signals arrive at different points in the phase, and interfere with each other.
    This is a common problem in urban environments where signals bounce off buildings
    and metal objects, and can cause deteriorated audio signals and "ghosting" in
    video images. One way to combat multipath is to have an antenna at the proper
    polarity. (See Antennas section of this chapter.)'
