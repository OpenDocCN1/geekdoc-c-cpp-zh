    Wavelength is equal to the speed of light divided by the frequency


    The entire radio spectrum is vast, a frequency band spanning almost 300,000 MHz.
    By comparison, the FM band, the one used in the US for commercial radio broadcast,
    is only a 20 MHz wide portion of that 300,000 MHz range. The RF portion of the
    electromagnetic spectrum covers the lower-end frequencies. Above 300 GHz, electromagnetic
    waves shift into near-infrared, infrared, visible light, ultraviolet light, X-rays,
    and gamma rays, where frequencies get into the terahertz range and beyond. At
    ultraviolet frequencies and higher, electromagnetic radiation becomes increasingly
    dangerous due to the energies involved in generating these waves and the ability
    of tiny wavelengths to penetrate solid matter, and requires special shielding
    and careful handling. Of course, even frequency electromagnetic waves can pose
    a danger at higher intensities and under the right conditions. 2.4 GHz waves are
    used in microwave ovens, infrared is used in heat lamps, and most lasers are in
    the visible spectrum.


    # Wavelength/Frequency Characteristics


    From our quick overview of the electromagnetic spectrum, it''s really obvious
    that electromagnetic waves behave very differently at different frequencies and
    wavelengths. Even within the RF portion of the electromagnetic spectrum, radio
    waves behave differently depending on their frequency as well. Understanding how
    radio waves behave at different frequencies is helpful for understanding how the
    target is likely to react, based on the frequency, material in the area, and atmospheric
    conditions.


    An important property of different frequency RF signals is the distances they
    are capable of travelling. Due to the different wavelengths of RF signals, they
    are absorbed and reflected by different types of material. The higher frequencies
    are "line-of-sight" frequencies, which tend to be absorbed and blocked by solid
    objects. Waves of RF frequencies in the shortwave band are of a length that causes
    them to bounce off the Earth''s ionosphere (Figure 2.3). The lower-frequency waves
    actually tend to follow the curvature of the Earth. Each of these frequencies
    is useful due to these unique properties which give them capabilities that make
    them applicable in specialized contexts.


    VHF and UHD frequencies travel line-of-sight, with a typical range of 20–30 miles.
    This distance varies greatly, depending on obstructions, as VHF and UHD are easily
    blocked by buildings or topography. Antenna height and transmitter'
