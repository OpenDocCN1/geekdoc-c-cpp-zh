    # Signal Strength


    There are three basic ways to increase signal strength when receiving a signal:
    amplification, antenna tuning, and antenna orientation. Using an amplifier will
    amplify noise as well, including those you may not want, and may simply result
    in a louder version of the same noisy signal. You can also tune the length of
    the antenna, which can be done by adjusting the length of the antenna, or changing
    to an antenna tuned for the range you are interested in. Finally, using a directional
    antenna that is designed to focus the signal energy can increase the signal strength.


    # Antenna Diagrams


    To understand the reception properties of a given antenna, refer to the antenna
    diagram for the type of antenna. An antenna diagram is a graph, showing the gain
    and radiation pattern an antenna has around it. This is useful for determining
    the characteristics of a directional antenna, or to see how an omnidirectional
    antenna is. No antenna is going to perfectly receive in all directions, so a diagram
    can help you understand the characteristics of the antenna. Antenna diagrams are
    useful for understanding the concept of directional antennas. By studying antenna
    diagrams, you can see the lobes generated by making an antenna directional. This
    is an important concept to understand if you plan to use antennas for direction
    finding.'
