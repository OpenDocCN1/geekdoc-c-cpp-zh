    # Antenna Theory


    +   A number of concepts are key to understanding antennas:

    1. *Resonance* occurs when an electric signal travels from one end of a wire to
    the other, and back in the same amount of time as the period of one cycle of the
    RF frequency. In other words, when the length of wire is equal to the wavelength,
    RF signals will resonate with lengths at multiples of the wavelength, as well,
    a phenomenon known as *harmonics*. Harmonics makes it easier for the antenna to
    pick up signals of resonance frequency. Full wavelength antenna can get very long
    which seems unlikely when mounted on a handheld radio or vehicle. Because of this
    people often use 1/2 and 5/8 waves function, it is essential to understand resonance.
    The more resonant an antenna is with respect to a given frequency, the less RF
    energy is required to excite the antenna and allow the antenna to pass a signal
    at that frequency through the radio. The *low threshold*, or how weak a signal
    is to pick up, determines the sensitivity of the radio. This is typically measured
    in microvolts (µV). RF energy passing over an antenna excites the antenna, generating
    a very small voltage, also measured in µV. Antennas can also act as filters. Tuning
    an antenna to resonate at specific frequencies will make it easier to hear signals
    on that frequency. Note, however, that tuning an antenna to resonate on specific
    frequencies will make it more difficult to hear other


