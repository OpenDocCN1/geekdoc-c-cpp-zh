    # Useful Scanner Feature


    In addition the criteria provided above there are a number of other features which
    will be useful when using a scanner for wireless reconnaissance. These features
    are explained in the next section so you have an understanding of what features
    do and what features to look for when purchasing a scanner for wireless reconnaissance.


    # Number Pad


    The authors prefer scanners with a full keyboard. Of course, units without keyboards
    are usually very small, often times the size of a standard deck of playing cards
    (Figure 7.4). While this can be great if you need to hide the scanner for covert
    listening, it can take a great deal of time should you need to enter additional
    frequencies, unless you are able to use a computer to program it. While these
    quality scanners without keyboards a great option for a secondary scanner, the
    advantages of a full keyboard scanner outweigh an engagement if you forget the
    software, your computer, or a programming cable and need to reprogram on the fly.
    Programming cables can be extremely difficult to find when traveling as they are
    specially items not generally carried by mainline retailers.


    > TIP

    If purchasing an older radio, be sure to determine if it has 900 MHz coverage.'
