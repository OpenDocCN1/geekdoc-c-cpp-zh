- img_proc: true
  md: 'often provide a description of the antenna, and in the best case, will provide
    the frequencies on which the antenna is designed to operate.


    While onsite, also look to see if all the radios in use are the same model, or
    if there is a mix of types. If there is a mix, then it is unlikely the organization
    is using any special or advanced features such as encryption. The nature of radio
    equipment makes that it is difficult, and often impossible, to get advanced features
    to work between equipment from multiple manufacturers. In fact, it can be complicated
    to get features such as digital transmission and encryption to work reliably between
    different model equipment by the same manufacturer. Additionally, if there is
    a mix of equipment manufacturers, it is unlikely that trunking is being used.


    # SEARCH COMMON FREQUENCY RANGES


    Searching common frequency ranges is labor intensive and time consuming, if signal
    counting and the methods described in the {cross reff profiling chapter, with
    page number} prove unsuccessful, this may be the only option. The concept is fairly
    simple. Listen on commonly used frequencies and look for traffic from the target.
    The good news is that if you are able to view the radios in use, you can generally
    narrow down the number of possible frequencies and save significant time. The
    following describes the common frequencies in use.


    # Family Radio Service (FRS)


    FRS was originally designed to provide a low cost option for families to use walkie-talkies.
    The idea of families using walkie-talkies may seem quaint with the proliferation
    of wireless phones, however it was of conceived prior to the cellular age. FRS
    is now commonly used by businesses to provide a cheap radio communication solution.
    Power is limited to a half watt (.5W).


