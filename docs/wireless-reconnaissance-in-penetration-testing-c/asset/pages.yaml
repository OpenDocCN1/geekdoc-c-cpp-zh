  md: '# Glossary


    A


    **Active Antenna**: Describes a high gain antenna that is short in length. These
    are useful where space is at a premium and commonly used on shortwave frequencies
    below 30 MHz.

    **ADC**: Analog to Digital Converter.

    **AGC**: Automatic gain control.

    **AM; Amplitude Modulation**: Varying, by modulation, the transmitter power output
    in line with the modulating audio signal variation.

    **Amplification**: The process by which the strength of a signal is increased.
    Both radio and audio signals can be amplified.

    **Attenuator**: Circuit that reduces sensitivity in fixed steps. These fixed steps
    are measured in decibels.

    **Attention**: Blocking radio waves.

    **Attenuation Coefficient**: The amount of power absorbed by a dielectric. A low
    attenuation coefficient will allow radio waves to pass through the material.


    B


    **Band Pass Filter**: Filter that allows specified ranges of frequencies through,
    rejecting those that are not within the specified range. Usually constructed by
    combining a high pass and low pass filter.

    **Bandwidth**: The frequency space which is occupied by a radio signal.

    **Bank**: A scanner is a way to organize channels. They allow for grouping of
    channels into logical banks.

    **Baud**: Measured in bits per second, the rate data transmitted.

    **Beam Antenna**: Antenna, used outdoors, that receives from a certain direction.

    **Beat Frequency Oscillator, BFO**: Circuit in a receiver that enables reception
    of SSB signals by generating a replacement carrier.

    **BCB**: See Broadcast Band.

    **Bird**: Birds are spurious signals created by the internal electronics in a
    scanner. These signals have no noise or static however will stop the scanner in
    its search mode. The scanner can have four or five birds.

    **BNC**: Common antenna connector which locks in place by being twisted.

    **Broadcast Band, BCB**: Also known as AM, BCB is the frequency range from 540
    and 1700 kHz.

    This is the AM band on your car radio.


    C


    **Carrier**: A radio transmitter''s unmodulated output.

    **Center Frequency**: In an FM transmitter, the unmodulated carrier frequency.


    153'
  merge: -1
  pgno: 155
- img_proc: true
  md: '# Glossary


    **Channel**: Frequency when radio transmission occurs. May also describe the input
    and output frequencies of a repeater or the location where a frequency is stored
    in a scanner''s memory.

    Coaxial cable**, **Coax**: An electrical cable specifically designed to transmit
    RF energy. In a coax the inner conductor surrounded by a flexible insulating layer
    is then surrounded by a tubular conducting shield. Invented in 1880.


    **Coherence Interference**: When frequencies adjacent to the signal cause undesired
    interference.

    **Communications Act of 1934**: The Communications Act of 1934 combined and organized
    federal regulation of telephone, radio, and communications. The Act created the
    Federal Communications Commission (FCC) to oversee and regulate these industries.
    As new technologies have been created, such as broadcast, cable, and satellite
    television, new provisions governing these communications have been added to the
    Act.


    **Conductor**: Matter that transfers electrical and radio waves.

    **Coordinated Universal Time**: Previously Known as Greenwich Mean time.


    **Counter**: Frequency Counter.

    **Critical Angle**: The angle at which radio signals reflect in the Earth''s ionosphere.
    Measured in reference to the Earth''s surface. Lower angles allow for greater
    distance of travel by of ionospheric refraction.


    **CTSS**: Continuous Tone-Doded Code System (CTSS) also known as tone squel, is
    designed to allow users on a shared frequency to hear only users in their group.
    Each group is assigned its tone squel, and the radio only plays to the audio when
    the tone squel is transmitted. The transmitter adds a unique sub-code to the tone
    squel

    **Cutoff Frequency**: The frequency at a filter rejects signals.


    D


    **D-layer**: Approximately 25 miles above Earth''s surface, the D-Layer is the
    lowest region of the Ionosphere. The D-Layer absorbs signals passing through it.
    The D-Layer disappears sooner after sunset, and on short days may not form.


    DAC: Analog to Digital Converter\dB: A measurement of sound defined by a logarithmic
    scale between power levels. 3 decibel is equivalent to double the power, while
    20 dB increase 100 times the power.


    **DCS**: Digital Coded Squelch. Digital version of CTSS.

    **Dead Zone**: Area where reception of a signal is not possible due to difficulties
    in propagation.

    **DECT**: Enhanced Coded Telecommunications is a digital standards used by cordless
    telephones.


    **Delay**: The time for which a scanner passes after a transmission ends moving
    on to the next channel.

    **Dielectric**: Matter that insulates radio waves.

    **Dipole**: Antenna made of two wires connected in a straight line. One wire connects
    to the radio and other wires connect to group.Used to operate on a specific frequency.
    Commonly used as base antenna.


    **Discone**: An omnidirectional, vertically polarized antenna with a disc shape.Discone
    antennas are broadband antennas (able to receive a wide range of frequencies)
    that are generally mounted.


    **Discriminator Output**: Provides access to the unfiltered audio signal from
    a radio. This is often required to decode data signals at 1200 Baud.

    **Direct Communication**: Communication between stations without using a repeater.

    **Direct Wave**: Radio signal propagated by line of sight.


    Drift: General frequency change in a transmitter or receiver. Commonly occurs
    when the temperature of a radio changes.'
