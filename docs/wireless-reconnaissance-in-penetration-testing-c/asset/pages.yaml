    locks. Keep in mind that some radios will store frequencies that you locked out
    between power and off cycles or searching. Be sure to clear the memory before
    performing a search in a new location, or you may find that you have locked out
    the frequency you are looking for. Some units allow selective memory deletion,
    meaning that you can leave birds in the list to locked out. The authors, have
    found that it is easier to clear memory and start fresh.


    # Priority


    With the priority feature, you can set a channel or group of channels as a priority.
    In some implementations, this channel or group of channels will then be checked
    more for activity, while in others, the priority channel(s) will be checked even
    while the scanner is listening to another channel, and switch to the priority
    channel if activity is detected. In some older implementations of the priority
    feature, the scanner would check the priority channel every second, causing an
    annoying cutout while listening to other channels. If buying an older scanner,
    it is a good idea to test this feature before making your purchase to be it implemented
    in a way you can live.


    # SELECTING A SCANNER


    The most important piece of equipment for radio reconnaissance is a scanner, and
    selecting the correct scanner can make things much easier. In fact, selecting
    the correct scanner can often times mean the difference between success and failure.
    Many folks are tempted to get a top of the line scanner with all the bells and
    whistles. Although this may be fun if you occasionally use your scanner these
    extra features often add confusion as you need to rele all the features each time
    you need to use the radio. Remember the point is to have'
