  md: '# Bluetooth


    Bluetooth is an extremely common technology, found in pretty much every cellphone,
    most laptops, many desktop-class personal computers, and in ever-growing number
    of cars. Bluetooth uses frequency-hopping spectrum in the 2.4 GHz ISM band, the
    same band used by WiFi, microwave waves, and most other 2.4 GHz consumer devices.
    Bluetooth devices form a piconet containing up to eight nodes—one master and seven
    slaves. Bluetooth is used for short-range communications between device peers,
    as well as to peripheral. The number and variety of peripherals communicate via
    Bluetooth is immense—wireless headsets for hands-free cell phone use, keyboards,
    mice, videogame controllers, audio speakers, you name it. Bluetooth is best known
    for transmitting audio, as in Bluetooth headsets. But it can also be used to connect
    HID devices such as keyboards and mice, and send data. Although not very popular,
    Bluetooth access points which function the same as WiFi access points connect
    multiple devices to a network.


    Attack tools against Bluetooth exist, such as Ubertooth (Figure 9.2), but still
    Bluetooth is not commonly targeted in penetration tests. Ubertooth is a custom
    made radio dongle that can attack radio systems in the 2.4 GHz range. Originally
    it was created to attack only Bluetooth, hence the name, but has since been expanded.
    The project''s home page is http://ubertooth.sourceforge.net/.


    Ubertooth can be used to monitor traffic, inject traffic, and do basic spectrum
    monitoring. It is very much a platform in development, so new features are being
    added all the time. It is one of the cheaper, if cheapest, ways to sniff Bluetooth,
    and the cheapest tool to inject custom packets. It has lowered the cost of entry
    to attack Bluetooth devices.


    The key with Ubertooth is it is very difficult to take a consumer Bluetooth dongle
    and have it sniff and inject custom frames. With WiFi, this was very easy to do.
    Nearly any WiFi adaptor can be used to sniff traffic, and today support injection
    as well. Once this was discovered, it became a lot cheaper to attack WiFi. To
    date, the only way we have seen to accomplish this on a Bluetooth dongle is to
    load a commercial firmware, with probable EULA


