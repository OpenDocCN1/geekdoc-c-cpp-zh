- img_proc: true
  md: 'Duplex: Transmission and reception on separate frequencies, functions like
    a telephone, allowing simultaneous talk on both ends.


    **Dynamic Range:** A description of a receiver’s ability to receive strong signals
    without being overloaded.


    # E


    **E-Layer:** 50 to 90 miles above the Earth, the E-Layer is a part of the Ionosphere.
    The E layer absorbs energy from signals that pass through it. After the sun sets,
    the E-Layer disappears. This is why AM broadcast stations use lower transmission
    power at night.


    **Effective Radiated Power, ERP:** Output of a transmitter by the gain of the
    attached antenna.


    # F


    **F-layer:** Responsible for most distance propagation below 30 MHz, the Ionosphere
    is the region of the Earth’s atmosphere approximately 30 to 400 miles above the
    surface. Solar heating can cause the F-layer to split into the F1 and F2 Layers.


    **Feedline:** Cable that connects the radio to the antenna.


    **Filter:** Commonly contains frequencies to pass and reject others. Frequency
    may be a device or a circuit.


    **Flutter **Frequency Modulation, FM:** Modulation that varies the frequency of
    the transmitter according to the modulating signal.


    **Frequency:** When used in the context of radio, the number of times that a wave
    occurs in an amount of time. Measured in Hertz.


    **Frequency Counter:** A device for measuring the frequency of a radio wave. Can
    be used to identify the frequency used by a transmitter.


    **Frequency Step:** The intervals of frequency that the tuner changes by.


    # G


    **Gain:** When an antenna increases the transmitted or received signal.


    **Ghz, Hertz:** Unit of measurement for radio waves equal 1000 megahertz or 1,000
    kilohertz or 1,000,000 Hertz.


    **Ground:** A wired connection, usually to the Earth, to a zero voltage point.


    **Ground wave:** A radio wave that propagates along the Earth’s surface.


    # H


    **Harmonic:** Frequencies that are multiple of a lower frequency.


    **HF, High Frequencies:** 3 to 30 MHz. HF is commonly used to refer to 1.7-30
    MHz High Pass Filter: A high pass filter allows frequencies above a specified
    point, and rejects those that fall below. See also Low Pass Filter.


    **Horizontal Polarization:** Antenna that receives or transmits broadcast waves
    with an electrical field parallel to Earth’s.


    **Hz, Hertz:** Frequency is measured in Hertz. Hertz denotes the number of cycles
    per second in radio frequency, with one Hertz denoting one cycle per second.


    # I


    **Image:** False signal produced by circuitry within the receiver.


    **Indirect FM:** *See phase modulation.*


    **Input:** When used in the context of repeats, describes the frequency repeater
    listens to and retransmits signals received on this frequency.'
