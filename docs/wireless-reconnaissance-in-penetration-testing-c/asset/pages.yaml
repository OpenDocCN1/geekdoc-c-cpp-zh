  merge: -1
  pgno: 58
- img_proc: true
  md: 'several minutes until it was quiet. Once we felt safe, we carefully opened
    the side door, looked around to make sure no one was in the area, and exited the
    trailer. At this point, we proceeded to obtain evidence that we were inside the
    target area by taking pictures. We also found a place to leave the loaf of bread.


    Having accomplished our objective, we exited the area. This was accomplished by
    simply walking out the gate. The guards assumed that we were dock hands, and did
    not check our IDs. We learned that they were supposed to perform an ID check,
    but had fallen out of this habit when the ship crew wasn''t present and only "trusted"
    dock hands were present. With the number of personnel employed at the dock, and
    turnover in the workforce, it was easy to pass without raising suspicion.


    # Remediation and Lessons Learned


    As a result of our successful penetration, the dock company became more diligent
    about using ID cards to get in and out of the area. The benefit that really sold
    them here is a matter of life safety in an emergency response situation. Knowing
    how many people are in an area, in the event an accident occurred very beneficial
    information. If you send first responders into a fire, it is great if you can
    tell them we have X number of people unaccount for, instead of "a few" people.


    We recommended the Client install turn styles or other anti-tail gating devices
    to prevent multiple persons from entering or exiting on one card swipe.


    The Client made changes so the mobile patrol remained mobile even when ships were
    in dock.


    The Client set up a video system that could monitor the secure dock entrance,
    so the mobile unit was no longer required to monitor that gate.


    Additionally, we recommended the Client install a smart video system to watch
    the train tracks and automatically notify the guards if the system sees people.
    This was also a life safety issue. In the past, there had been incidents with
    unauthorized persons wondering onto the tracks, and getting into the facility.
    While preventing their entry into the facility was desirable, it is also important
    to remove them from the train tracks as fast as possible to avoid being hit by
    a train.


    Lessons:


    +   - Perimeter security. If there is an area that is impractical to fence and
    gate, it diminishes the security provided by whatever perimeter fencing you do
    have. Unsecured perimeter areas should be subject to increased monitoring.'
