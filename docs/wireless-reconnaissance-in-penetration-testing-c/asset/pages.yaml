  md: '# DEVICES THAT USE RADIO FREQUENCIES


    Radio waves are of course invisible to the human eye. That is a good thing, otherwise
    our vision would be completely obscured by the multitude of radio waves passing
    by and through us at all times.


    Radio is everywhere and is commonly used by electronic devices. As a society,
    we have been "cutting the cord" in many aspects of our daily life and work. Cameras,
    headsets, phones, and many other devices use to require a cable to transmit their
    information. Now, of course, many, if not most, of these devices transmit wirelessly
    using radio frequencies.


    Ways to use the information gathered from these targets will be covered in later
    chapters.


    Walking into any organization, one of the first people you will encounter will
    be a receptionist, and receptionists often use wireless headsets. Of course, many
    employees aside from receptionists use wireless headsets. Headsets are common
    in many organizations.


    Cordless phones are another example of radio frequencies being used for communication.
    While older cordless phones were fairly simple to monitor with a scanner capable
    of receiving 900MHz, newer cordless phones often use more secure transmission
    methods. It is important to note that many newer cordless phones, especially those
    deployed in enterprises, often use encryption as well.


    Keep in mind that many of the benefits of monitoring cordless phone conversations
    are obvious, others are not. One great example of information that can be gathered
    from both wireless headsets and cordless phones is voicemail passwords. Using
    a DTMF decoder, you can capture the voicemail passwords entered on these wireless
    devices. Remember, however, that the government takes unauthorized monitoring
    of telephone communication very seriously, and it is essential to consult with
    counsel and ensure you have permission of the target and the affected staff members
    prior to monitoring telephone calls.


    # NOTE


    Don''t be fooled by dummy cameras. While dummy cameras often use the same housing
    as live cameras, they will of course not transmit any information. If you encounter
    a camera with an antenna, but cannot grab a signal, then assume it is a dummy
    camera and move on.'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'Closed Circuit Television (CCTV) cameras are another device that was previously
    tethered to a transmission cable. These days, it is common to come across CCTV
    cameras that transmit their signals wirelessly. Penetration testers may be used
    in attempting to monitor cameras by penetrating the management console, however
    it is often possible to grab the signal from the air. It is also another tool
    in the arsenal of professional penetration tester. It is usually fairly simple
    to determine if a camera is transmitting wirelessly, as the antenna is obviously
    obvious.


    Some of the most fascinating sources of radio signals within an organization are
    wireless microphones. Wireless microphones are fascinating because they are often
    used in boardrooms, conference rooms, auditoriums, and other places where important
    meetings are held. This means that if you are able to intercept these transmissions,
    the information is sensitive and of great value. Keep in mind that all of the
    radio reconnaissance targets, wireless microphones will usually have the weakest
    signal, meaning that you will need to be in close proximity to monitor them. This
    means that you will often have to physically penetrate the organization before
    you are able to monitor the wireless microphones. One notable exception is the
    offsite meeting. Board meetings and high level gatherings are often held in hotels
    or other quasi public places. If you are able to find out the location of a meeting
    whether through public media or by other reconnaissance, you may be amazed by
    what you hear. When in a quasi space, you will still need to attempt to look like
    you belong. Depending on the scope of the engagement, if an offsite meeting is
    held in a hotel, it may even make sense to get a room near it.


    IN THE REAL WORLD: The authors, tasked with securing a boardroom prior to a meeting
    about a highly secret merger, swept the room for bugs and other transmitters.
    Great effort and expense was taken by the organization to ensure what was said
    in the room, remained in the room. About 10 min before the meeting was to begin,
    an administrative assistant showed up with a wireless microphone. Upon further
    inspection, it was noted that the transmission of this wireless microphone was
    not encrypted. Had this been used, anyone outside of the boardroom with a scanner
    would have been able to listen to everything that was said. Keep this in mind
    when securing your organization.'
  merge: -1
