    type is generally only required if the license class for the band you are trying
    to monitor changed, which happens very infrequently, but having this option on
    a scanner is a good way to future proof it against future band plan changes.


    # APCO P-25 Decoding


    APCO P-25 is a common digital form of modulation that is gaining popularity in
    public sector radio systems. Although P-25 can be used with traditional radio
    systems it is mainly deployed on trunked radio systems. Currently P-25 is the
    only digital format that is decoded by consumer-grade scanners. At the time this
    book was published the authors have not seen any business using P-25 on their
    radio systems but as gets upgraded private sector systems will adapt this. Today
    this is not required for monitoring most radio systems. But this will likely change
    in the future. Additionally this feature is useful when monitoring some radio
    systems. If you can afford it the authors recommend purchasing a radio that can
    decode P-25 traffic so it is future proofed as this is rolled out in more locations.


    # Trunk Tracking


    The concept of trunking was first introduced in Chapter 2. In general most business
    do not have radio systems complex enough to justify the cost of a trunked radio
    system. However it is not unusual for larger business to deploy trunked radio
    systems and many cities are upgrading their multiple radio system scanners. For
    this reason we highly recommend selecting a scanner that supports trunking.


    When choosing a trunk capable scanner many things need to be kept in mind. Be
    sure to find out that can trunk in the bands you need to monitor. Keep in mind
    that every trunk capable scanner can trunk in all the frequency bands it can receive.
    Newer trunked systems are beginning to operate in the 300 MHz and 700 MHz band,
    which may not be covered by older radios. New scanners that support trunking generally
    support trunking in all the bands the radio can receive.


    Second not all trunked systems are currently supported. It seems like every year
    scanner manufactures are adding support for more trunked systems to their trunking
    scanners. Because of this research the trunking systems supported by the scanners
    on the market and pick which one supports the most number of trunking systems.


    Third if you purchase a trunking capable scanner be sure it is running the latest
    firmware. Many scanners now allow the end user to upgrade the firmware in'
