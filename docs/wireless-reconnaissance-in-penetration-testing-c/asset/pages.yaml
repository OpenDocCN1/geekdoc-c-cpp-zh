  md: '# What is Offsite Profiling? 51


    > TIP

    > When posing as a salesperson for purposes of social engineering, let the target
    do the talking.

    Ask open-ended questions such as:


    +   - How many radio users does your organization have?

    - What type of special features do you use or are you considering?

    - Do you currently use encryption or trunking?


    The answers to these questions and others are helpful when selling radio equipment,
    and are also helpful when profiling a target organization.


    radio salesperson can result in release of valuable information. Commonly the
    facilities department will manage radio equipment. If the target has a physical
    security department, they may be tasked with radio procurement. Remember, before
    calling, you must gather as much information as possible. If you aren''t able
    to speak intelligently about the equipment you purport to sell, the ruse will
    be discovered.


    With rare exception, legally broadcasting on a frequency when the United States
    requires a license from the Federal Communications Commission (FCC). In addition
    to many other functions, the FCC ensures that the radio spectrum is used in the
    most efficient manner, and multiple organizations or stations do not fight over
    the same frequency. It should come as no surprise to keep everything organized,
    the FCC maintains a database of the licenses issued to use specific frequencies.
    This database includes information such as the frequency information and well
    as the license, including their location and contact information. What may, however,
    come as a surprise, is that this FCC database is available to the public. The
    catch is, and of course there is a catch, that the database is cumbersome to search
    and retrieve specific information.


    The private sector has come along with resources to access to the information
    contained in the FCC database. Radiioreference.com (Figure 4.2) and nationalradiodata.com
    (Figure 4.3) have two such resources.


    Radio Reference, when a paid site, has many free areas which contain a wealth
    of information. National Radio Data offers a hobbyist rate at the time of this
    writing is $29 per year.


    There are a few things to keep in mind when searching for the frequencies use
    by an organization. As discussed earlier, there are many radio equipment resellers.
    A large number of these resellers also provide maintenance for the equipment,
    and at times offer to provide frequencies to their Clients. In these cases, the
    frequency is licensed to the reseller and leased to an organization.'
