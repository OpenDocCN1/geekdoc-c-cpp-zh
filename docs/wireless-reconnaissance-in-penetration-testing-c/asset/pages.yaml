  md: '# Targets


    As with any other type of reconnaissance or penetration test, it is vital to the
    success of radio reconnaissance to define the targets prior to beginning. The
    end goal of radio reconnaissance, for the purposes of this book, is to gather
    information that will enable either physical or logical penetration.


    There are two basic types of targets. The first is two-way radios used for verbal
    communication, and the second type of targets is devices that use radio frequencies
    to transmit audio or video information.


    | CONTENTS |

    | Two-Way Radios Used for Verbal Communication... 45 |

    | Devices that Use Radio Frequencies........... 46 |


    # TWO-WAY RADIOS USED FOR VERBAL COMMUNICATION


    Radios used for verbal communication have obvious applications for the penetration
    tester. The best example of these types of radios is the walkie-talkies. Monitoring
    the guard radios or other radios used by the target organization''s staff will
    allow the penetration tester to know where guards and staff are physically located,
    and help the penetration tester avoid detection. Monitoring these communications
    can also give you insight into company lingo, employee names, and culture. Be
    aware that it isn''t just guards who use radios to communicate with each other.
    When out and about, look around for radios. You may be surprised to see employees
    of retail establishments, restaurants, and other places frequently using radios
    to communicate. This is in addition to maintenance staff as well as others. Remember,
    it isn''t just guards who can provide you with valuable reconnaissance information
    to discover or call the police during a physical penetration test.


    45


