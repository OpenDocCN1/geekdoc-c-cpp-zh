- img_proc: true
  md: '# 116 CHAPTER 7: Basic Overview of Equipment and How it Works


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_112_0.png)


    FIGURE 7.18 Icom R-9500 Has a Build In Video Decoder, Reprinted with Permission
    Icom America Inc.©2012 Icom America Inc. The Icom Logo is a Registered Trademark
    of Icom Inc. The Use of Icom Product Images has been Approved for Tutorial Purposes


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_112_1.png)


    FIGURE 7.19 AOR AR-STV, Reprinted with Permission from AOR USA Inc.


    inversion. Single point inversion flips the audio at a set point. Dual point flips
    the audio at a set point and flips it again at a different point. Breaking a single
    point voice inversion system is fairly simple because only one value needs to
    be brute forced. Breaking dual point inversion is more difficult, but still not
    impossible, because both inversion points need to be discovered.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '![](img/2e4b8b26cfbdeba5a5a91921492f98df_113_0.png)


    It''s important to note that neither dual point nor single point conversion

    are actually encryption. They are simply ways to scramble the signal.

    Voice inverted transmissions are pretty easy to spot because they sound like

    Donald Duck gibberish.


    Some older scanner had voice inversion decoders built into them such as the

    Alalco DJ-X2 and DJ-X2000E. These units could only decode single point voice

    inversion traffic and are generally very difficult to find on the used market.

    As discussed the earlier AOAR 8200 MKIII is capable of decoding single point

    voice inversion with the optional VI8200 Voice Inverter Card installed. Ramsey

    Electronics makes very Speech/Descrambler Kits which can

    decode single point voice inversion traffic. If you search the web you

    also find a number of programs that claim to decode voice inversion traffic.

    Overall the authors of this book have found these programs to be unreliable

    and high suspect, use them with caution.


    In general few organizations use voice inversion technology to protect

    tir transmissions. If the organization has a strong need to protect their

    radio traffic they have moved to either digital systems with a custom vocoder

    or implemented a true encryption technology. However the ability to decode

    voice inverted traffic is still helpful if you encounter a target using this feature.'
