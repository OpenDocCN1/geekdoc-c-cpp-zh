  md: '# CHAPTER 5: Onsite Radio Profiling


    be a huge time-saver, as reading frequencies from a frequency counter screen and
    entering them into a computer can be a real headache. The Scout also offers reaction
    tuning, which means that it can automatically tune a compatible scanner to a frequency
    seen by the Scout. While this has usefulness, we have found that in some situations
    it can be helpful and save time. For example, if once onsite there is not enough
    time for profiling, and reaction tuning may allow you to quickly monitor signals
    in the area. This is no substitute for profiling, it is a good had hack if needed.
    Additionally, if the budget allows it, an extra scanner doing reaction tuning
    during an assessment can be a great way to catch frequencies missing during the
    onsite and offsite profiling.


    What is most useful as far the Scout, however, its small size and portability.
    The Scout can be in a backpack or worn on a belt under a coat, which is helpful
    in situations where discretion is necessary. Being removed and replacing a frequency
    counter from a backpack or coat is suspicious and can draw unwanted attention
    during a penetration assessment.


    The Optoelectronic Scout comes in both analog (Figure 5.4) versions. The digital
    version, as you might suspect, is designed to find the frequencies of a radio
    operating in a digital mode, which we have found to be of limited use during penetration
    assessments. Additionally, the digital mode tends to be finicky outside of a lab
    environment. The analog version, is a great piece of equipment and we highly recommend
    it.


    If you choose to get a frequency counter other than the Scout, be sure to get
    one with a hold function which will continue to display the frequency after the
    counter is out of range of frequency. The hold function will save in its memory
    the first frequency counter locks onto, which saves you from having to write down
    the frequency with pen and paper. Of course, there is a caveat that even with
    a hold feature, the benefit is limited as there generally a good chance that there
    will be a lot of trial and error as the frequency counter will lock onto the first
    strong signal it detects in the area which not be the signal you are ultimately
    looking for. This is another reason to


