    It’s important to have a firm understanding of the underlying science and the
    terminology used to describe it. The following concepts are fundamental to understanding
    radio, and it is critical that you become familiar with them.


    **1. Frequency:** Frequency is the measure of how many times the radio wave oscillates
    in a unit of time. Looking at the graph of a sinusoidal wave (Figure 2.1), frequency
    can be understood as the time between portions of a wave (such as the peak or
    the trough) as the wave passes over a stationary point in space.


    Frequency is measured in Hertz. It is a measurement of frequency, regardless of
    the magnitude–Hertz is not only for measuring the frequency of electromagnetic
    waves, but in other contexts such as acoustic waves and seismic waves. In every
    case, 1Hz=1 cycle per second. In the electromagnetic spectrum, the band known
    as radio waves ranges from 3kHz to 300MHz. After German Heinrich Hertz, Hertz
    was established as a term in 1930, officially adopted as an SI unit in 1960, and
    widely replaced the phrase “cycles per second” by Hertz (Hz). When SI is spelled
    out in English, it should always be with a lower case letter (ertz), except where
    at the beginning of a sentence or in capitalized material such as a title. As
    part of the SI system of measurement, the typical prefixes kilo–(1,000), mega–(1,000,000),
    giga–(1, or billion) are used in the customary fashion to create the derived units
    kilohertz (kHz), megahertz (MHz) and gigahertz (GHz). The first two should be
    familiar to anyone who has used an AM/FM radio. In the last decade, 802.11 (Wi-Fi)
    operates in the 2 and 5 GHz band.


    **2. Wavelength:** Wavelength is the linear distance between two parts of the
    wave form, typically the peak or trough of the wave (Figure 2.1). Because all
    electromagnetic waves travel at the speed of light, an inverse relationship exists
    between wavelength and frequency. The longer the wavelength, the lower the frequency,
    and vice versa. This is because a higher frequency moves through its cycle in
    less time (creating more cycles per second), and all electromagnetic waves completing
    a single oscillation in line the same speed, but with high-frequency wave travel
    a shorter distance, resulting in a shorter wavelength.


    **3. Amplitude:** Amplitude is a measure of the energy in the wave (Figure 2.1).
    Amplitude is directly related to the strength of the signal and the amount of
    energy in it. A strong signal has a high amplitude, while a weak signal has a
    low amplitude. When a signal is amplified, its amplitude is multiplied.


    The radio spectrum is a vast band of the electromagnetic spectrum which includes
    frequencies from 3kHz to 300GHz. This is a huge chunk of the spectrum, and is
    commonly divided into different bands.


    # Summary................................42


    # Further Learning.........................42'
