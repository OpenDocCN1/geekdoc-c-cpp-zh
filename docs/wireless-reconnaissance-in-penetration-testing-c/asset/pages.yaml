    People tend to want help, it is human nature. Combine this with the fact that
    most people love to talk about their jobs, and it can be simple to capture a frequency.
    There have been times we simply started a conversation with a guard about radio
    technology, and asked the guard to see their radio. From there, it is simply a
    matter of using a single memory frequency counter to grab the target signal.'
