    # CASE STUDY


    Perhaps the best way to understand the true value of radio reconnaissance is with
    a case study. While this case study includes a fictionalized version of events,
    the authors on actual engagements have used successfully all the techniques described
    in the following paragraphs.


    We knew we were lucky that the power company''s fence was not electrified. Bad
    jokes aside, when attempting to enter a fenced power company facility, the tools
    that could come to mind might be cutters and carpet to throw over barbed wire
    rendering it useless. In this case, we had those with us, but it turned out our
    radios were also valuable. The first thought we have information security is probably
    not a couple guys dressed in black tactical gear in the woods up to their ankles
    in cold mold. In today''s global economy, the stakes are high and competitors
    and criminals will often stop to gain the upper hand or sabotage information and
    equipment. As networks become hardened and information more protected, many attacks
    have moved to the physical realm. It is often cheaper for nefarious corporations
    or overseas criminals to send operatives to facilities and attempt to steal information
    than it is to hack through the network. The goal of a penetration test is to find
    vulnerabilities and help to mitigate them before attackers can take advantage.
    On this dark night, that put us in the woods.


    The irony is that our target was an energy company, a fact not lost on us as we
    shivered through the cold. The main gate was guarded, so we followed the fence
    through the woods, and w through a cold creek. Our reward was discovering a break
    in the fence. The scraps of carpet we had in our bags remained there. It is an
    old trick, a well-known one, placing a scrap of carpet over barbed wire making
    the fence breach. Twenty yards away, a small building stood alone on the property.
    The door swung open with just a twist of the handle—it was not locked. Inside
    we found a few company shirts, and a breaker panel. We left the panel alone, because
    we are the good guys, and didn''t know what dangers could cause by flipping the
    main switch. We discovered later that it controlled all the parking lot and perimeter
    lights—very useful for a malicious attacker. We moved toward the main facility
    unimpeded, and reached a locked door. The lock was one knew'
