    ## 122 CHAPTER 8: The House Doesn''t Always Win: A Wireless Reconnaissance


    ## NOTE


    It is a good idea to periodically remind personnel who use radios that everything
    they say on the radio can be heard by anyone with a scanner. In fact, you often
    don''t need a scanner to listen to emergency dispatch frequencies. Smartphone
    applications such as 5-0 Radio and similar allow users to listen to scanner channels
    worldwide. While monitoring public channels we have often heard discussions that
    could prove embarrassing for those using radios, and of course, we have a lot
    of information leaking. Of course radio traffic can be encrypted to protect the
    privacy of the communications, however in reality very few agencies or businesses
    encrypt their radio traffic.


    As it got later, and the crowds in the casino began to disperse, we decided it
    was a day and retire to our hotel. Without the crowds, we began to start in the
    parking lot, and didn''t want to get caught before we even started. Of course,
    we would have been concerned about being detected while the casino parking lot,
    we could have found a less conspicuous place to park, such as one of the businesses
    or hotels nearby. In the hotel we made notes and discussed our plan for the next
    day. Rifle with anticipation, we bedded down for the night.


    ## GLITZ AND GLAMOUR


    The night before, we took note of how the casino patrons tended to dress. Most
    seemed casual, so we were sure to mirror this. Had we been in an upscale casino
    we would likely have dressed like rollers. Remember, it is better fitting and
    not seeming out of place. We parked the car, walked through the lot, and through
    the front door. We took note of the guard stations as emergency exits and doors
    marked "employees". We settled in front of a few penny slot machines, and placed
    our backpack containing a Scout on the floor next to us and started pulling the
    lever. We didn''t win big on the slots, but when a guard walked past and we noticed
    that he is carrying a Motorola HT Pro Series radio, most likely a GP-338. These
    radios operate in 29.7–42, 136–174, and 403–407 MHz, and do not support encryption
    or trunking. With this information, we smiled knowing that we could monitor these
    radios if we could find their frequency. The radios used by the guards had a 4-in.
    antenna, which suggested they operated in the 136–174 or possibly the 403–407
    MHz range. We left the slot machines and wandered through the casino, our Scout
    in the backpack doing its work. We spent a good hour in the casino buffet, getting
    every penny''s worth from $14.95 all you can eat. Just another perk of the job.


    With full stomachs, we returned to the car and began to pull the frequencies from
    the Scout. We focused on the 136–174 and 403–407 MHz range we believed they operated
    in. We programmed this small group of frequencies into our scanner and began to
    monitor. It wasn''t long before we found the frequencies used by the casino guards.


    ## Time to Gamble


    ## NOTE


    While not necessarily as portrayed in Hollywood, casinos don''t mess around. They
    are constantly on the lookout for cheaters and thieves, and any time you are in
    a casino, you can safely assume that you are on closed circuit television. The
    night before, we noticed that many goons carried backpacks, and thus knew we could
    carry one without drawing too much suspicion. The job had required, we could have
    used a fanny pack or other method to conceal our Scout. Just know that if you
    are caught in a casino with an electronic device, you will have some explanation
    to do. Like any other penetration assessment, know what will allow you to fit
    in and what will arouse suspicion.


    ## LEARNING THE LOCAL LINGO


    Over the next few hours we learned a great deal about the casino and how it was
    protected. In addition to chatter (the coffee is cold, my team lost the softball
    game), we heard the guards beginning and ending their shifts. We learned the names
    and nicknames of the guards, their schedules and post locations, as well as sorts
    of lingo used by the casino. It was early afternoon, and we had what we would
    need, as far as radio reconnaissance goes. We headed back to our hotel to rest
    and regroup.


    ## TIME TO Gamble


    We put our plan together, deciding that we would impersonate construction contractors
    and attempt to enter the employee entrance. We knew we had to look the part, and
    brand new clothes wouldn''t work. We found a local thrift shop and purchased some
    looking workpants and shirts marked with the stains of construction. After a light
    dinner and a quick nap, we let the hotel and drove to the casino parking lot just
    after 2 AM, we noticed that the contractors were showing up for work. We sat in
    the car, sipping coffee, waiting for our opening. It wasn''t long before we heard
    the guard at the employee lot pleading with the dispatcher to leave post so he
    could use the restroom. As the guard''s requests became more desperate, and there
    was no replacement available at the time, the dispatcher finally relented. She
    told him to be quick, and that no replacement was necessary as he "only a minute."
    A minute was all we needed. We quickly drove through the unattended gate and into
    the employee lot. We knew that the gate was covered by a surveillance camera,
    however we decided to take a chance. We had a trunk full.


