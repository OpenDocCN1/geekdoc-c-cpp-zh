    # 应用科学：无线电技术基础


    ## 干扰信号 (BIRDIES)


    “鸟”（Birds）是由无线电电路产生的虚假信号和谐波。这是由无线电本身产生的内部射频（RF）噪声。干扰信号会让你在没有信号的地方看起来存在信号。干扰信号可能是静音信号，或者听起来像静杂声：要判断你是否是调到了你的扫描器，请取掉天线。如果信号仍然存在，那么它就是一个干扰信号。


    大多数扫描器都会列出其无线电的干扰信号频率。核实此列表仍然很有必要，因为根据制造工艺的细微差异，可能会出现新的干扰信号。要找到这些干扰信号，取下扫描器的天线并搜索它能接收的所有频率。


    如果你不确定，请装回天线。如果连接天线后引入了强信号（例如本地寻呼塔、FM 广播站或电视电台），那么它不是干扰信号——只是在没有天线的情况下也能识别的强信号。


    既然你正在识别它们，请保留一份这些干扰信号的列表备后参考。


    当你为新信号设置扫描器时（在现场剖析章节中），你可以咨询该列表以查看你获得的信号是否为干扰信号。有些人会在搜索时锁定掉他们忽略的干扰信号。真实的信号完全可能在恰好是你扫描器干扰信号频率的频率上传输！如果信号位于该频率，屏蔽干扰信号将导致你错过该信号。因此，在确定信号确实源自你的扫描器之前，我们不建议锁定这些干扰信号。


    得益于设备技术的进步，现在不再那么需要寻找干扰信号列表了。如果你有一台三次转换扫描器，干扰信号的数量将非常少。在较旧的双次转换无线电上，这一点虽然重要，但仍然至关重要。


    ## 提示


    从射频放大器处理接收到的信号到第一个中频（Intermediate Frequency）的组件被称为无线电的前端。


    虽然音频听起来更好，但如果你尝试通过将扫描器的音频输出接入计算机来解码数据信号，它们可能会引起问题。有时这些滤波器会操纵信号，导致数据信号（特别是超过 1200
    波特的信号）无法恢复。


    为了解决这个问题，有必要在音频被清理之前获取信号，即从鉴别器输出（discriminator output）获取音频输出。鉴别器输出提供了对未滤波音频信号的访问。某些扫描器内置了鉴别器输出端口，这使得访问未滤波信号变得简单。


    ## DIY 无线电改装：鉴别器输出


    没有此便利特征的扫描器可以通过打开无线电并在电路板的特定点焊接音频线来改装。这是一种相对简单的改装，可以由业余爱好者或发烧友在几分钟内完成，零件可以在 Radio
    Shack 或类似的商店购买，花费不到 5 美元，所需工具包括电焊台、用于钻孔的电磨机（Dremel tool）和螺丝刀。


    详细的说明超出了本书的范围，因为操作过程取决于型号。在 Google 上搜索通常可以找到如何为你的扫描器添加鉴别器输出的说明。图 2.8 显示了添加了鉴别器输出的扫描器内部。

    当然，适用于通常免责声明。这将使你的保修失效，如果你弄坏了无线电，我们不负责！


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_19_0.png)


    **图 2.8** 添加了 DIY 鉴别器输出的扫描器内部，经 Megan Call 许可转载


    ## 滤波器


    滤波器是一种允许某些频率通过并拒绝其他频率的设备。滤波器用于无线电内部以清理射频信号和音频信号。每个滤波器都有一个截止频率，该频率是滤波器减小（调谐）通过其传输的信号的频率，以及一个分贝（dB）额值，它告诉我们滤波器减少了多少信号。如果输入信号强于滤波器的分贝额值，滤波器可能无法完全消除信号。滤波器还可以具有固定截止频率或可变截止频率。传统上讲，滤波器是电子电路。然而，随着越来越多的无线电变得基于软件，越来越多的滤波器正在通过软件实现。


    滤波器有两种两种基本类型：高通滤波器和低通滤波器。高通滤波器允许截止频率以上的频率通过（图 2.9）。低通滤波器允许截止频率以下的频率通过滤波器（图 2.10）。


    带通滤波器和陷波滤波器（Notch filters）也是无线电中常用的滤波器。带通滤波器允许一组频率通过，它是通过通过组合一个移除目标频段以下信号的低通滤波器和一个移除目标频段以上信号的高通滤波器而创建的（图
    2.11）。带通滤波器对于消除目标频段外的强非常有帮助。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_20_0.png)


