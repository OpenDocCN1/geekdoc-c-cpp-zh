    ## 新技术


    随着我们的世界变得越来越智能化，它似乎也变得越来越无线化。这意味着风险的增加，也为射频（RF）安全研究人员提供了更多机会。展望 RF 安全的未来，两件事将定义无线黑客和无线侦察的未来：


    - 一切都在数字化。

    - 软件定义无线电 (SDR)。


    ## 一切都在数字化


    目前，仍然有大量的无线电传输，而且在未来一段时间内可能如此，但无线电正日益转向数字化。目前，某些扫描器支持解码 P25——这已经是它们能够解码的数字格式的全部了。未来可能会会有更多扫描器支持
    TDMA 格式。TDMA 是旧式手机使用的一种通用格式，也开始被无线电系统部署。摩托罗拉（Motorola）拥有一种基于 TDMA 的标准，称为“P25 Motorola
    X-TDMA”，这是对当前 P25 系统的升级。


    摩托罗拉的 X-TDMA 在阶段 2 要求最终确定之前发布，并且在很大程度上基于阶段 2。到目前，只有一台扫描器支持它：GRE PRS800——目前对 X-TDMA
    的支持处于测试阶段。MOTOTROB 是摩托罗拉制造的另一种基于 TDMA 的数字无线电扫描器。目前，没有扫描器可以解码它。


    其他标准层出不穷。其中许多是封闭的，制造商不希望许可监控其扫描器的功能。许多人将“扫描器无法监控它们”这一事实作为营销中的卖点。这种做法目前确实起到了防止普通公众随意收听的作用——目前是这样。当然，像
    GNU Radio 这样的项目正在对这些系统进行逆向工程，并创建监控它们的工具。数字语音解码器 (DSD) 是一个与 GNU Radio 配合使用的开源软件包，它可以解码其中一些格式。关于更多信息，请参阅本章后面关于
    GNU Radio 的章节。然而，有很多需要注意的数字格式，其中包括：地面干网无线电 (TETRA)、矢量和激励线性预测 (VSELP)、OpenSky、iDEN、EDACS
    ProVoice 和 DECT，以及许多专有标准。


    TETRA 在欧洲很流行（事实上它被称为跨欧洲干网无线电），但如果在美国在美国，我们还没有见过。VSELP 是一种较旧的数字数字编码标准，即将被淘汰。


    在过去的 20-30 年中，电子领域不可否认的趋势是越来越多的事物变得无线化。如今，这不仅仅是 IEEE 802.11 (WiFi) 协议，这也是目前更多渗透测试人员的重点。还有许多其他标准——以及专有的无线格式。随着这些格式市场份额的增长和成熟，意识到它们在环境中的存在或潜在存在将变得越来越重要。


