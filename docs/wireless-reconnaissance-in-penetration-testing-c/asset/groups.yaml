    图 7.1 手持扫描仪，经 Meagan Call 许可转载


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_93_0.png)


    **图 7.2** 基站扫描仪，经 Meagan Call 许可转载


    ## 有用的扫描仪功能


    除了上述提供的标准外，还有许多其他功能在用扫描仪进行无线侦察时非常有用。这些功能将在下一节中进行解释，以便你了解哪些功能的作用，以及在购买无线侦察扫描仪时应该寻找哪些功能。


    ## 数字键区


    作者更倾向于带有全键盘的扫描仪。当然，没有键盘的设备通常非常小，通常只有标准扑克牌的大小（图 7.4）。如果你需要隐藏扫描仪进行隐蔽收听，这可能很棒，但如果你需要输入额外的频率，可能会花费大量时间，除非你能够使用计算机对其进行编程。虽然这些没有键盘的高质量扫描仪作为辅助扫描仪是一个很棒的选择，但如果你忘记了软件、电脑或编程线并需要现场重新编程，那么全键盘扫描仪的优势将远超这种不便。在旅行时，编程线可能很难找到，因为它们是特殊物品，主流零售商通常不携带。


    > 提示

    > 如果购买旧无线电台，务必确定它是否具有 900 MHz 覆盖。


    # 98 第 7 章：设备基本概述及其工作原理


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_94_0.png)


    图 7.3 扫描仪数字键区


    ## 发光屏幕和键盘


    发光屏幕和键盘在夜间行动以及你可能遇到的任何低光情况下都是有帮助。即使你不计划进行任何夜间行动，也要记住，即使在白天，渗透测试人员经常发现自己躲在衣柜和其他黑暗的地方。选择扫描仪时，请记住有些设备有发光屏幕但键盘不亮。带有发光屏幕和键盘的设备最好。


    ## 通道间距/步进


    步进（Step size）是调谐频率时的调整量。与调制类似，扫描仪的设计旨在自动为当前频段选择合适的步进。作为一个一般原则，为了让扫描仪找到它调谐的系统，其粗度不应比被扫描的任何通信系统中使用的频率更粗。


    > 为了更有效地利用频谱，美国的步进正在发生。如果你正在查看旧设备，记住这一点很重要，而且对较新设备进行“面向未来”的考虑也很重要。许多较新的、现代设备支持固件更新，可以在这些步进发生时解决这些问题。当然，这假设制造商仍会支持该设备，并在多年后继续发布更新。


    ## 选择扫描仪


    选择一个频带外的步进是很重要的，以免你错掉任何感兴趣的传输。步进大小对特定频段的搜索速度有很大影响。步进越小，搜索时间越长，因为扫描仪必须监控更多的频率。反之亦然；较大的步进将缩短搜索时间。大多数无线电台将自动为频段选择正确的步进，但某些高端无线电台可能会自动选择步进，而你需要记忆它们或准备一个可以参考的资源。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_95_0.png)


    当使用搜索功能时，选择正确的步进至关重要。如果你使用的步进过大，你可能会错过某个信号且完全不知道。相反，如果步进太小，你可能会触发一个不在频率中心上的信号，导致信号微弱或失真。请记住，小的步进可以显著提高搜索速度。选择
    5kHz 频段将导致扫描仪花费五倍的时间。如果不确定在扫描仪默认选择的步进之外应该选择哪种步进。


    ## 扫描速度


    扫描速度是指设备在扫描时切换通道快慢。扫描速度通常以每秒可以扫描的通道数来衡量。每秒 10 个通道和 100 个通道是常见速度。扫描速度最终影响设备扫描频谱部分频谱的速度，通常越快越好。


    ## 调制


    在第 2 章中我们讨论了各种无线电信号可以通过调制将数据编码到其中。扫描仪支持的常见调制类型有 AM、NFM 和 NMW。单边带（SSB）调制对渗透测试人员不感兴趣，因为它主要用于短波频率。然而，值得注意的是，如果你获得了一台可以低于
    30 MHz 的高端扫描仪，SSB 支持将允许你收听短波上的所有活动。


    大多数扫描仪被设计为已知频率上通常发生什么调制。这意味着如果你调谐到 146.xxx，设备将自动切换到 FM，如果你调谐到 108.xxx（航空频段），它将切换到
    AM。高端无线电台可能会自动选择步进，由于你需要记忆它们或准备一个可以参考的资源，某些情况下允许覆盖默认。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_95_1.png)


    > 图 7.4 Icom R-6 是一个没有全键盘的扫描仪示例，经 Icom America 许可转载 ©2012 Icom Inc. 标志是 Icom Inc
    的注册商标。Icom 产品图像已批准用于教学目的


    # 96 第 7 章：设备基本概述及其工作原理


    监听在非标准情况下。覆盖默认调制类型通常只需要在频率发生变化时，这种情况并不常见，但在扫描仪上拥有这个功能是一个很好的方法。


    ## APCO P25 解码


    中网的概念在第 2 章中首次介绍。通常大多数业务没有足够复杂的无线电系统来证明中网无线电系统的成本。然而，大型业务部署中网无线电系统并不常见，许多城市正在升级他们的多无线系统扫描仪。因此，我们强烈建议选择支持中网扫描仪。


    APCO P25 是一种在公共部门无线系统中日益流行的数字调制形式。虽然 P-25 可用于传统的无线电系统，但主要部署在中网无线电系统中。目前 P25 是消费级扫描仪解码的唯一数字格式。在本书出版时，作者还没有看到任何业务在无线电系统中使用
    P25，但随着升级这可能会改变。此外，此功能对于监控某些无线系统很有用。如果你负担得起，作者建议购买可以解码 P25 的无线电台。


