    SDR 设备中，其前端的射频（RF）放大器是在硬件中实现的，而不是软件。然而，在更高级的收电机上，更多的前端是作为 SDR 实现的；更多的读者将从中获得这些先进的优势。

    - 调制器/解调器：这是软件实现的最常见部分之一。此列表中的其他组件在许多 SDR 型号中通常采用硬件实现。在软件中添加新的解调器要容易得多。同样，让终端用户根据信号手动或自动调整调制器的能力也变得容易得多。构建一个具有相同灵活性和控制能力的硬件解调器相当复杂，因此是一项昂贵的开销。


    ## SDR 的优势


    - 成本：通过仿真昂贵的硬件组件，制造商能够使用更少、更廉价的非专用组件制造收电机。

    - 快速开发：SDR 的巨大优势在于通过更改代码而不是重新布线硬件来更改收电机，这允许快速原型。如果存在问题，你几乎不需要重新布线硬件；只需要修补软件。一旦生成并分发代码，任何人都可以下载并运行。对于物理收电机，制作能够解码信号的设备需要技能，有些人已经摸索出了如何做了。

    - 可升级性：对于大多数过时的硬件，你通常能做的就是更换。许多收电机硬件仍然运行完美，但缺乏新机型提供的功能或改进。对于过时的软件，你可以对其进行升级，获得新的功能和特性。

    - 灵活性：SDR 提供的功能和配置选项比单个收电机硬件能容纳的得多。

    - 设备整合：一个制作良好且多功能的 SDR 硬件可以通过加载新代码来适应多项任务。事实上，过去需要构建多个特定用途的收电机——这些设备变得庞大且昂贵。今天，你可以根据正在运行的代码修改单个
    SDR 来执行多种功能。SDR 的灵活性意味着我们可以通过编写新程序，获得解码视频和其他数据格式（如 POCSAG 传呼机）的能力。例如，在开源 SDR（如
    GNU Radio）中，已存在解码二级和四级 FSK 信号的源代码。这种功能在商业 SDR 产品中通常需要额外付费。

    - 信号捕获与高级分析：最后，SDR 的最大优势之一是 RF 信号很容易记录并捕获到文件中。这非常棒，因为你对录制信号进行的分析比对实时信号进行的分析要深入。传统收电机需要信号存在才能对其进行分析，但对于录制信号，你可以反复地以不同的方式对其进行分析。这在分析未知信号时非常有帮助。传统收电机充其量只能记录收电机的音频输出并在稍后进行分析。


    ## 录制原始 RF 信号的力量


    ### 未知数据信号的离线分析


    由于专业摄影师喜欢用 RAW 格式显示照片，只要可能，捕获原始的、未处理的 RF 信号总是值得的。对于分析信号，录制极其有用，你不再需要分析整个系统（这涉及到花费大量时间等待信号）。一旦捕获了传输，你就可以将其取下并尽情地分析。能够多次播放样本非常有益。


    在一个项目中，我们需要对控制 PLC（可编程逻辑控制器）的收电机信号进行反向工程。当我们找到信号频率时，调到该通道时听到了数据，并将其解码为 FM 信号。当我们将此信号输入可视化工具时，我们看到它看起来像一个方波。我们可能可以直接在那里解码二进制信号。然而，在当时我们不确定控制信号在空中是如何编码的，是
    FM 编码，还是只是恰好看起来像 FM 信号。我们捕获了原始 RF 信号，并解码了 FM 音频信号。


    当我们分析 RF 信号时，发现它是一个 FSK 编码信号，只能从 RF 捕获中进行解码。如果我们尝试仅将信号作为 FM 进行捕获，我们将浪费时间，并被迫重新捕获信号（如果还有机会的话）。


    原始捕获在分析频率跳频系统时也很有帮助。当发生跳频时，要实时猜测跳频模式并与其同步是非常困难的。然而，如果你捕获了原始 RF 信号，离线分析跳频模式就会更容易。此外，如果你确定了跳频模式，始终可以将原始
    RF 捕获数据传回 GNU Radio 并解码流量。注意，在这样做时，你需要确保捕获了所有信号。例如，如果跳频系统分析 5 MHz 范围内的跳频，你希望确保原始捕获宽度至少为
    5 MHz。


    ## 什么是 FSK？


    FSK 代表频移键控（Frequency-Shift Keying），是一种用于无线传输信息的常用数字调制方式。要解码 FSK 信号，你需要一个 FSK 解调器。解调器有两种类型：二级和四级。这些解调器也被切片器（slicers）。


    二级解调器是一个在硬件中构建的非常简单的电路（图 9b），并且可以从 RF 捕获中解码。四级解调器更复杂，但允许更高的数据密度。如果我们尝试仅将信号作为 FM
    进行捕获，我们将浪费时间，并被迫重新捕获信号（如果还有机会的话）。


    ## 第 9 章：新科技


    ### GNU Radio


    GNU Radio 是用于构建软件定义收电机的开源工具包。它根据 GPL 许可证发布，具有使用 C++ 构建的强大信号处理块，并通过 Python 编写的胶水代码连接，称为图表。它包含许多预定义的块和图形，用于解码从广播
    FM 到 GSM 手机的各种内容。图 9.7 是宽带 FM 收电机的图形表示。


    GNU Radio 与硬件基本无关。Ettus Research 的通用软件无线电外设（USRP）可能是与之配合最受欢迎的收电机。一套完整的 USRP 加上板卡的成本大约为
    800-1000 美元。价格范围主要取决于你获得的哪种型号板卡。要设置 Ettus，有一个支持板卡的主机，允许收电机在不同频率上发射和接收。有不同的 USRP
    模型可用，设计用于处理不同数量的带宽，提供板处理能力，并提供 USB 或以太网接口。USRP（图 9.8）是目前爱好者和渗透人员最流行的型号。它使用 USB
    2.0 接口，最多支持四个板卡。到主机的速度高达 8 MS/s。根据板卡，它可以在很宽的频率范围内接收和发射。


