    # 注意


    CTCSS 有几个不同的商业名称，随制造商而异。


    - 摩托罗拉（Motorola)—Private Line 或 PL Tone

    - 通用电气（GE）和 Bendix—Channel Guard (CG)

    - 立讯（Icom）—C-Tone

    - 国得（Kenwood)—Quiet Talk (OT)

    - Johnson—ToneGuard (TG), CallGuard (CG)


    干扰。然而，由于一个小组的用户无法听到另一个小组的传输，或者说，他们在尝试传输之前可能不知道信道是否空闲。由于如此，大多数使用 CTCSS 的自动无线音机设计为在信道被占用时不进行传输。这些系统中的无线音机无法根据用户组对流量进行排序。因此，如果一个像消防员这样的高优先级用户在捕狗员说话时需要传输，消防员将需要等待捕狗员结束通话后才能进行传输。显然，由于这个原因，CTCSS
    可能不适用于任务或生命至关重要的应用。作为用户，或者在这种情况下，同一信道的小组，随着流量的增加，拥堵也会增加。传输得越频繁，发生干扰的可能性就越大。有一些减轻这种干扰的方法，包括在信道使用时不允许新的传输的功能。


    # 备有 CTCSS 的无线音机侦察


    关闭 CTCSS 的接收机将听到信道上的所有传输。CTCSS 的用户可能会错误地认为 CTCSS 提供了某种程度的安全性，并可能更容易讨论非公开信息。这对于我们作为渗透测试人员获取优势很有用。


    # 数字代码系统


    数字代码系统（DCS）是 CTCSS 的数字版本。摩托罗拉将其这种访问控制技术称为数字私有信道（DPL）。


    # 第 2 章：基础无线电理论与无线系统介绍


    > 注意

    CTSS 和 DCS 亚调也被用于中继台以防止重播虚假信号。在这些情况下，中继台只会广播输入信号中带有特定 CTCSS 或 DCS 亚调的信号。


    对于 DCS，最多只有 100 种可能的代码。对于 CTCSS，DCS 亚调的存在不会加密或干扰信号，因此它并不真正私密。对于 DCS，关闭了 DCS 功能的接收机将听到信道上的所有传输。再次，这种虚假的安全感可以为攻击者提供机会，渗透测试人员应该寻找这些机会。


    # 中继（Trunking）


    在无线电仍是一项新技术且未广泛部署的早期，频谱的有效利用并不是主要关注的问题。那些日子一去不返，射频（RF）频谱是一种有限的资源。在无线电的早期，RF 频谱是一个正在被拓辟的边疆，FCC
    的建立是为了分配频谱以避免冲突。后来，无线电变得越来越流行，这种方法并不能充分分配频段——仅许可一个运营商在特定区域以特定功率水平使用特定频率是不够的，特别是对于那些未用于商业广播的频谱频段，它们不是
    24/7 小时运行的。对于在同一大区域内有许多用户的双向无线电系统，旧的许可方式已不再适用。有必要设计更好的技术来利用这些频段部分，以便许多运营商能够更有效地使用它。这就是中继技术要解决的问题。旧系统仅允许较少的运营商在给定区域使用双向无线电，而无需持续的信道（这会导致系统难以使用），中继系统使得在更窄的信道带内共享成为可能。今天，无线电频谱是有限的资源，对
    RF 频谱访问的需求和竞争日益增加。双向无线电系统使用的 RF 频段需求过大，以至于低利用率是不可接受的。随着 FCC 对频率访问的严格控制，以及步进频率变得越来越小以尽可能将流量挤入频率范围内，效率是必不可少的。这时中继无线电系统大显身手了。中继系统的设计是为了更好地利用频谱，允许更多用户以比实际可行实现的更高的密度共享少数的信道。


    # 深度解析中继无线电系统


    中继无线电系统集中管理一个信道池，并智能地将用户切换到给定时间任何空闲的信道。这对于扫描接收机爱好者来说通常是一个难以理解的概念，因为这代表了系统设计的范式转变。中继无线电系统是目前使用的最复杂的无线电系统之一。中继无线音机使用多个信道或频率，允许大量用户通过会话组（talkgroups）共享这些信道，而他们的对话不会相互干扰。


    会话组是定义的用户组。例如，所有警察人员和调度员将属于一个警察会话组；所有消防员和消防员工将属于一个消防会话组，而所有市政垃圾收集员将属于废物管理会话组。


    中继系统使用一个控制信道，称为“干线”（trunk），它传输数据包，允许会话组通过告诉会话组成员在按下发射键（key up）时在哪个频率上进行通信，来携带对话。这允许大量用户仅使用少数频率进行通信，并高效利用了这些频率。


    中继无线电系统的运行假设是，并不是所有会话组都会同时使用。这允许多个会话组共享信道，实现对频段更有效的利用。中继系统不需要要求所有无线音机设置到相同频率（从而无论频率是否在使用中都会垄占频率），而是允许许多用户共享多个频率。这意味着支持无线电流量所需的频率要少得多。


