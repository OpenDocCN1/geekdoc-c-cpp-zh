    > TIP Regardless of or not you are using radios for reconnaissance of the target,
    a scanner tuned to police frequencies is great to have during any physical penetration
    test. Monitoring the police frequencies should allow you to quickly know if you
    have been detected, and the police have been summoned. This way, you can immediately
    call your point of contact at the target, and be prepared to meet the police.
    Of course, laws and regulations differ to the legality of monitoring police frequencies,
    so be sure to consult legal counsel before monitoring police frequencies.


    towards the end of your shift, presenting another advantage for the penetration
    tester.


    While monitoring traffic on the radio, write down guards'' and dispatchers'' names,
    and make not of the guards'' lingo. This information is useful for social engineering.
    Knowing people'' s names gives the appearance that you belong, and allows you
    to claim that a guard directed you to a restricted area. Saying “the guard told
    me to go here” will not be as effective as saying “Bill smith to go here.” (Assuming,
    of course, that there a a guard names Bill Smith.) Peppering your conversations
    with guard and other organizational lingo will also give the appearance that you
    belong, and will help you gain the trust of people within the organization.


    # MONITORING PHONE CALLS


    Keep in mind that legally monitoring telephone communications can be a difficult,
    so prior to monitoring any telephone traffic, be sure that it is legal and that
    you have the proper authorization. For more sensitive information is spoken over
    the phone than on two-way radios, and if you are able to grab telephone traffic
    you will likely learn a great deal about the operations of the target organization,
    including names, client information, and financial data. Credit card, banking
    information, social security, health information, and other highly sensitive information
    are commonly relayed by phone. Testing whether this traffic is secure should be
    a priority during a physical penetration test if scope.


    For the penetration tester, being able to monitor the telephones at a help desk
    or call center can be the Holy Grail, especially if the help desk is involved
    in password resets. Gathering usernames and passwords as well as the names of
    people within the organization can make a penetration test fairly simply. Listening
    to help desk calls will give valuable insight into it and how the help


    > Remember, criminals, by definition, do not follow the law. This means they have
    tools and methods at their disposal that we, as professional security practitioners,
    do not. While there are many criminal methods that we cannot test without breaking
    the law ourselves, it is still of the utmost importance to understand the methods
    and techniques used by the criminals. Thinking like a criminal is the best way
    to learn to defend against criminals.


    desk verifies the identity of the caller, as well as organization specific technical
    terminology.


    A DTMF decoder, described in more detail in Chapter 7 is a device that decodes
    the sound of telephone touch tones and displays them numerically. This is a great
    tool while monitoring phone traffic as it makes it easy to grab voicemail passwords.
    Additionally, some radio equipment uses DTMF codes to transmit coded messages.


    # WIRELESS CAMERAS


    Wireless cameras are commonly found in areas where it would be difficult or expensive
    to run cables. Areas to look for wireless cameras include stairways, the parts
    of the parking lot furthest from the main building, and around the perimeter of
    a large property.


    While the advantages of being able to capture the camera feed and view are obvious,
    there is also a large amount of information that can be gathered by studying the
    cameras themselves. For fixed position cameras, it should be simple to determine
    what they are monitoring. A camera high on a light pole over a parking lot is
    there to provide a panoramic view, and a camera pointed towards a door is obviously
    monitoring that door.


    Once you have gained access to the wireless camera feed, you will know what the
    guards can see. Note the camera coverage and look for blind spots to exploit during
    a physical penetration test.


    # Pan Tilt Zoom (PTZ) Cameras


    PTZ cameras are becoming more common, and allow a user or program to physically
    move the camera remotely.


    Follow the movement of the camera to determine if the camera is being controlled
    by a human or by software. If software is controlling the camera, you will see
    controlled and consistent movements, while if a human is controlling


    > While it is easy to zone out while watching camera feeds, there are many smart
    video systems on the market that detect movement or changes in the feed and alert
    a human, allowing them to investigate. As all types of technology smart video
    systems have also gotten cheaper. Being able to alert on motion is a feature now
    found in many low- to mid-level video systems.


    it, you will see more spontaneous movement. If the camera is controlled by software,
    then it is possible that the camera feed is not being actively monitored. Conversely,
    if a human is controlling the camera it can almost be guaranteed that the image
    is being carefully watched.


    View the feed at night to determine if the cameras are night vision capable, and
    any times of day that glare makes the camera. Note the focal length of the camera,
    and if it is wide or narrow lens. See if the image provides usable detail. In
    general, cameras are a poor detective control. It is easy to lose focus while
    watching the television feed from an empty parking lot. Cameras, however, are
    one of the best ways to determine what happened and gather evidence after a crime
    has occurred. As a preventative control, cameras can be useful as they may send
    an attacker on a softer target.


    # Basic Overview of Equipment and How it Works


    In Chapter 2 the basic concept of a scanner was introduced. To review a scanner
    is a radio that stores multiple frequencies in channels, quickly switches between
    the channels, and stops scanning when a channel is active. This chapter will take
    a deeper dive into scanner features and operations, how to select a scanner for
    radio reconnaissance, and accessories that are helpful when performing radio reconnaissance.


    # COMMON CONTROLS AND FEATURES


    The best source of information for operating a particular scanner is the owner''s
    manual. That by being said, there are controls and features that are common to
    all scanners available on the new and used market.


    # Channels and Banks


    Channels store the frequencies the scanner searches when it is scanning for radio
    traffic. Most scanners organize channels into banks. For example, a 200-channel
    scanner may have 10 banks of 20 channels each. This can be helpful when you need
    to group services together. A hobbyist may put police in and frustration if you
    program the few bands with common frequencies. For example, the authors use bank
    10 for Family Radio Service Channels, bank 9 for different frequencies, and so
    on. Lower bands are then used for specific engagements and targets. This saves
    the need to reprogram the higher bands.


