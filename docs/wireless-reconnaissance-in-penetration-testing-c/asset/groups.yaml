  - '[PAGE 157]


    Duplex: Transmission and reception on separate frequencies, functions like a telephone,
    allowing simultaneous talk on both ends.


    **Dynamic Range:** A description of a receiver’s ability to receive strong signals
    without being overloaded.


    # E


    **E-Layer:** 50 to 90 miles above the Earth, the E-Layer is a part of the Ionosphere.
    The E layer absorbs energy from signals that pass through it. After the sun sets,
    the E-Layer disappears. This is why AM broadcast stations use lower transmission
    power at night.


    **Effective Radiated Power, ERP:** Output of a transmitter by the gain of the
    attached antenna.


    # F


    **F-layer:** Responsible for most distance propagation below 30 MHz, the Ionosphere
    is the region of the Earth’s atmosphere approximately 30 to 400 miles above the
    surface. Solar heating can cause the F-layer to split into the F1 and F2 Layers.


    **Feedline:** Cable that connects the radio to the antenna.


    **Filter:** Commonly contains frequencies to pass and reject others. Frequency
    may be a device or a circuit.


    **Flutter **Frequency Modulation, FM:** Modulation that varies the frequency of
    the transmitter according to the modulating signal.


    **Frequency:** When used in the context of radio, the number of times that a wave
    occurs in an amount of time. Measured in Hertz.


    **Frequency Counter:** A device for measuring the frequency of a radio wave. Can
    be used to identify the frequency used by a transmitter.


    **Frequency Step:** The intervals of frequency that the tuner changes by.


    # G


    **Gain:** When an antenna increases the transmitted or received signal.


    **Ghz, Hertz:** Unit of measurement for radio waves equal 1000 megahertz or 1,000
    kilohertz or 1,000,000 Hertz.


    **Ground:** A wired connection, usually to the Earth, to a zero voltage point.


    **Ground wave:** A radio wave that propagates along the Earth’s surface.


    # H


    **Harmonic:** Frequencies that are multiple of a lower frequency.


    **HF, High Frequencies:** 3 to 30 MHz. HF is commonly used to refer to 1.7-30
    MHz High Pass Filter: A high pass filter allows frequencies above a specified
    point, and rejects those that fall below. See also Low Pass Filter.


    **Horizontal Polarization:** Antenna that receives or transmits broadcast waves
    with an electrical field parallel to Earth’s.


    **Hz, Hertz:** Frequency is measured in Hertz. Hertz denotes the number of cycles
    per second in radio frequency, with one Hertz denoting one cycle per second.


    # I


    **Image:** False signal produced by circuitry within the receiver.


    **Indirect FM:** *See phase modulation.*


    **Input:** When used in the context of repeats, describes the frequency repeater
    listens to and retransmits signals received on this frequency.'
  - '[PAGE 158]


    Intermodulation, Intermod: Spurious or false signals. Occur when multiple signals
    mix in a receiver or repeater.

    Ionosphere: The region approximately 40 to 400 miles above the Earth''s surface.
    This electrically charged regions refract radio signals.


    # K


    Key Up: Slang term for pressing the push to talk (PTT) switch on the radio so
    items into the microphone will be transmitted.

    kHz, Kilohertz: 1000 Hertz


    # L


    Law of Inverse Squares: The signal strength of a radio wave is inversely proportional
    to the square of the distance from the source. Because of signal strength does
    no grow in a linear fashion the closer you get to a transmitter. Instead signal
    strength will dramatically increase the closer you get to a transmitter.

    Line of Sight: As the name implies communication between two stations that are
    within sight of each other.

    Lockout: A scanner allows for the exclusion of specified channels from the scanning
    sequence. Can also be applied to the search on a scanner to exclude specific frequencies
    from the search sequence.

    Low Pass Filter: Filter circuit that allows frequencies below a defined point,
    and rejects frequencies higher than the defined point. See also High Pass Filter.

    LSB, Lower Sideband: Lower frequency sideband and transmitter carrier. See Single
    Sideband of a radio.

    Low Threshold: How weak a signal is able to pick up. Used to determine the sensitivity
    of a receiver.

    Lowest Useful Frequency, LIF: The lowest frequency that can propagate between
    two points.

    LTR: Logic Trunked Radio, or LTR, uses a transmission protocol developed by the
    E.F. Johnson company. LTR is used primarily in site applications.


    # M


    Maximum Frequency, MUF: The highest frequency that can propagate between points.

    Medium Wave: Used to describe any AM signal (540 Hz to 1700 kHz) Medium wave is
    technically signals between 300 to 3000 kHz.

    MHz, Megahertz: 1,000,000 hertz, 1000 kilobytes.

    Modulation: Altering the carrier of a transmitter to encode information into a
    radio wave.

    Frequency Modulation (FM) is the most popular types of analog modulation used
    over 30 MHz.

    Monoband Antenna: Antenna designed to operate on one frequency band.

    Multiband Antenna: Antenna designed to operate on multiple frequency bands.

    Multiph: Describes a signal that is reflected multiple times between transmission
    and reception.

    Multipath: occurs when the signal from a transmitter is bounced around and it
    arrives at the receiver at different times; the signals arrive at different points
    in the phase. Also known as Ghosting.


    # N


    Notch Filter: Combines high and low pass filters and only allows a small section
    of the spectrum through.


    # O


    Omnidirectional Antenna: Describes an antenna that can transmit and receive in
    all directions.'
  - '[PAGE 159]


    # Glossary


    Output Frequency: In the context of repeaters, the frequency on the repeater will
    retransmit received signals on.


    Overloading: Interference causing false signals. Caused by strong signals within
    the frequency range.


    # P


    Passband Tuning: A receiver feature allows the user to adjust bandpass to get
    the best reception based on interference.


    Path: Route a signal from the transmitter to the receiver.


    Phase Locked Loop (PLL): Circuit which generates a large range of frequencies
    in discrete intervals.


    Phase Modulation (PM): Much like FM, PM varies carrier frequency in proportion
    to strength and frequency of the modulating signal.


    Phonetic Alphabet: Words used to represent letters of the alphabet to prevent
    confusion/understanding.


    Polarization: Describes whether an antenna transmits or receives in a vertical
    or horizontal plane.


    POTS: Plain Old Telephone Service. Voice grade telephone service.


    Preamplifier, Preamp: Receiving weak signal. A preamp will often create great
    background noise and cause signal distortion.


    Priority Channel: In scanners, the priority channel is a user channel that the
    scanner will check for activity more frequently or immediately if a signal is
    present.


    Propagation: Describes the process of a signal traveling from transmitter to receiver.


    # Q


    Quad: A type of directional antenna made up of two squares, each wavelength, a
    quarter aperture.


    # R


    Repeater: a device that receives a signal and transmits it, usually at a higher
    strength, helping radio cover a larger geographical area.


    Resonance: when an electric signal can travel from one end of a band and back
    in the period of one cycle of the RF frequency


    Resonant Frequency: The frequency where an antenna best receives or radiates.


    RF Gain: Control that continuously varies receiver sensitivity.


    Rubber Duck (Rubber Duck): A type of antenna, the rubber duck is an electrically
    monopole antenna which is sealed in a rubber housing. There is debate as to how
    the rubber duck oriented.


    # S


    S-Meter: A graph that shows the relative strength of a signal at reception.


    Scanner: A receiver that switches between multiple channels or frequencies, stopping
    when there is activity on the channel or frequency.


    Scatter: When a signal scatters directly from the ionosphere.


    Search: A feature of scanners and other receivers that scan a frequency at intervals
    and stops when a signal is present. Useful for finding transmitters in a set frequency.


    Selectivity: The ability of the unit to pull a signal out of noisy environment,
    or in other words, the ability to select between two signals that are close together
    on the spectrum. Depends primarily on the phase noise of the synthesizer and associated
    circuitry


    Sensitivity: Describes how well a receiver can pick up weak signals, in microvolts.


    Shortwave: Commonly used to describe frequencies between 1.7 to 30 MHz, shortwave
    is technically 3 to 30 MHz.'
