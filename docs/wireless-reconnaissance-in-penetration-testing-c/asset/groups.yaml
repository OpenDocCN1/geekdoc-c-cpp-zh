    # VISUAL RECON


    As with other types of reconnaissance, a sharp eye is an essential tool in radio
    profiling. Being able to examine a radio used by the organization, whether from
    a distance or up close, can provide a wealth of information. Often, organizations
    will place stickers on the radios listing the channel assignments, for example
    channel one is security while channel 2 is maintenance. It is also common that
    these channel listings will be posted in stations or behind the reception desk,
    be sure to look around.


    Identifying the model of radios in use by the target organization is invaluable.
    Many radios have the manufacturer name prominently displayed on the outer housing,
    and some will have the model or series number. This is another place where having
    a camera can be helpful. A quick snapshot will allow you to take all the time
    you need to research and determine the radio and model once you are offsite.


    Once you have determined the type of radio in use by the target organization,
    there are a wealth of resources to enable you to gather a large amount of information.
    Internet search engines and web sites (Figure 5.7) are obvious choice, however
    there are also people who will likely be willing to help you.


    > TIP

    a camera with a zoom lens when using a penetration test, and taking pictures of
    equipment or frequency lists is one of them. If your frequency counter does not
    have a memory function you could also use the camera to take pictures of the frequencies
    displayed on your frequency counter for later review.


    # CHAPTER 5: Onsite Radio Profiling


    > TIP

    In the United States, the top five commercial grade two-way radio manufacturers
    are Motorola, Midland, Kenwood, Icom, and Vertex.


    > NOTE

    It should go without saying that we do not encourage condone forming relationships
    with people in the radio community solely to gather information. Once you have
    determined the model, or models, of radio in by the target organization, it is
    time to get back to research. Knowing the model of the equipment will let you
    learn what frequency ranges are supported by the radios, and if it has any special
    features such as encryption, trunking, or is digital.


    Developing a positive relationship with local radio equipment dealers and Ham
    radio operators will provide experienced input. We may be biased, however-we have
    found that people in the radio community tend to be friendly and generous with
    their time and knowledge. As you gain experience with radios, you will be able
    to quickly determine at least the manufacturer of a device with a quick glance.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_70_0.png)


    FIGURE 5.7 Batlabs (www.batlabs.com) A Great Resource for Researching Motorola
    Radios, Although it is Not Updated as it is Used to Be


    # Antennas


    A lot can be learned from the type of antennas on radio equipment. When looking
    at the radios used by the target organization, be sure to note the antennas length
    and type. Antenna types are described in greater detail in the Antenna section
    of Chapter 2, however it is good to know that as a general rule the shorter antennas,
    the higher the frequency (such as 460 MHz) and the longer-the antennas the lower
    frequency (such as 150 MHz) used by the radio (Figure 5.8). The main exceptions
    to this are compact antennas which are designed to be small in size, and still
    operate on lower frequency ranges. These antennas may be ½ or ¼ (or even smaller)
    wave antennas.


    Like everything else in this book, and penetration testing in general, the more
    experience you have the easier the identification of antennas and their probable
    ranges will be. Having a properly tuned antenna is far more important when transmitting,
    in fact, transmitting with an improperly tuned antenna can damage the transmitter.
    This is another place where being able to take a picture of the target radio is
    helpful, as it will allow for you to research the antenna at your convenience.
    Manufacturer web sites and catalogs will


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_71_0.png)


    **FIGURE 5.8** Two Antennas Used for Different Frequencies, Reprinted with Permission
    from Meagan Call


    often provide a description of the antenna, and in the best case, will provide
    the frequencies on which the antenna is designed to operate.


    While onsite, also look to see if all the radios in use are the same model, or
    if there is a mix of types. If there is a mix, then it is unlikely the organization
    is using any special or advanced features such as encryption. The nature of radio
    equipment makes that it is difficult, and often impossible, to get advanced features
    to work between multiple manufacturers. In fact, it can be complicated to get
    features such as digital transmission and encryption to work reliably between
    different model equipment by the same manufacturer. Additionally, if there is
    a mix of equipment, it is unlikely that trunking is being used.


    # SEARCH COMMON FREQUENCY RANGES


    Searching common frequency ranges is labor intensive and time consuming, if signal
    counting and the methods described in the {cross reff chapter} prove unsuccessful,
    this may be the only option. The concept is fairly simple. Listen on commonly
    used frequencies and look for traffic from the target. The good news is that if
    you are able to view the radios in use, you can generally narrow down the number
    of possible frequencies and save significant time. The following describes the
    common frequencies in use.


    # Family Radio Service (FRS)


    FRS was originally designed to provide a low cost option for families to use walkie-talkies.
    The idea of families using walkie-talkies may seem quaint with the proliferation
    of wireless phones, however it was of conceived prior to the cellular age. FRS
    is now commonly used by businesses to provide a cheap radio communication solution.
    Power is limited to a half watt (.5W).


    Family Radio Service Frequencies (Note: These are United States Frequencies)


