    # TIP


    Sweeping for bugs? A common trick used when sweeping bugs is to take a footprint
    of the frequencies that are present in a room or around 100ft from the area to
    be swept for bugs, and then take a footprint of the frequencies in the area to
    be swept for bugs. Anything that is actually transmitting in the area you are
    sweeping, if transmitting at very low power, will appear much stronger due to
    the law of inverse squares.


    dispatch towers must have the power to broadcast over a geographically large area,
    while only the two-way radio transmitters used by many organizations must only
    blanket a comparatively small area. The law of inverse squares means the closer
    you are to a signal, the stronger the signal will be. It should, of course, be
    obvious that a handheld frequency counter will generally allow you to get fairly
    close to the signal source. This is especially true when you have access to the
    interior of the facility that is being targeted.


