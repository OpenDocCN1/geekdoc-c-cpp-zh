    ## Lighted Screens and Keyboards


    Lighted Screens and keyboards are of course helpful in night operations and also
    in any low light situation you may encounter. Even if you do not plan to perform
    any night operations, keep in mind that even during the day, penetration testers
    often find themselves hiding in closets and other dark places. When selecting
    a scanner, keep in mind that some units have lit screens and not lit keyboards.
    A unit with a lit screen and keyboard is best.


    ## Channel Spacing/Steps


    Step size is the amount of adjustment when tuning to frequencies. Similar to modulation,
    the scanners are designed to automatically select the appropriate step size for
    the current band. As a general rule, for a scanner to find it tune in systems
    no more coarse than those used in any of the communication systems to be scanned.


    > In order for more efficient use of the spectrum, steps in the US are changing.
    It is important to keep this in mind if you are looking at older units, and also
    important to "future proof" a newer unit. Many newer, modern units support firmware
    updates that can address these steps as they occur. This does, of course, assume
    that the manufacturer will still support the unit and releasing updates years
    into the future.


    ## Selecting a Scanner


    It is important to select a step size that out of the band so that you don''t
    miss any desired transmissions. Step sizes can greatly impact search speed on
    a particular band. The smaller the step size, the longer the search will take,
    as the scanner must monitor more frequencies. The reverse is also true; larger
    step size will reduce search time. Most radios will automatically select the correct
    step size for the band, however, some higher-end radios may select step sizes
    automatically, and as you will need to memorize them or have a resource available
    where you can refer.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_95_0.png)


    When using a search function, selecting the correct step size is critical. If
    you use too large of a step size, you may miss a signal and never even know it.
    Conversely, if the step size is too small you may trigger on a signal that is
    not at the center of the frequency, leading to a weak or distorted signal. Keep
    in mind that small step sizes can dramatically increase search speed. Selecting
    5kHz band will cause the scanner to take five times as long. If unsure which step
    size to select with the default selected by the scanner.


    ## Scan Speed


    Scanning speed refers to how quickly a unit can switch channels while scanning.
    Scanning speed is generally measured in terms of how many channels per second
    it can scan. Ten channels and 100 channels per second are common speeds. The scanning
    speed ultimately affects how quickly a unit can scan or section of the spectrum,
    generally faster the better.


    ## Modulation


    In Chapter 2 we discussed various radio signals can be modulated to encode data
    into them. Common modulation types supported by scanners are AM, NFM, and NMW.
    Single Side Band (SSB) modulation is not of interest to penetration testers as
    it is mainly used on shortwave frequencies. It is good to note, however, that
    if you get a high-end scanner that goes below 30 MHz, SSB support will allow you
    to listen to all the activity on shortwave.


    Most scanners are designed to know which modulation commonly occurs on frequency.
    This mean that if you tune to 146.xxx, the unit will automatically switch to FM,
    and if you tune to 108.xxx, the air band, will switch to AM. Higher-end scanners
