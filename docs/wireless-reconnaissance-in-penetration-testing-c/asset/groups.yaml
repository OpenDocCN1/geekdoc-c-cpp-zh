    rtl 是两个构建这些驱动程序的项目。


    ## WinRADIO


    WinRADIO 是受欢迎的消费级 SDR 之一。它是一个商业开发的 SDR 组，由接收器组成。它们是预装好的，不需要组装，价格从 700 美元起。图 9.11
    是 WinRADIO G305e 接收器。这些无线电自带的 WinRADIO 软件提供了解码所有模拟格式（AM, FM, SSB）的能力。增加解码数字格式的能力需要额外的软件，需要额外费用。WinRADIO
    拥有完善的 GUI 界面（图 9.12），特别是与 GNU Radio 的界面相比。大多数 WinRADIO 软件是为 Windows ，但对 Mac OS
    和 Linux 有一些支持。


    WinRADIO 提供售价 200 美元的专业解调器（Professional Demodulator）选项，这可以轻松看到信号是如何被解调为其支持的各种格式的，并调整在解调过程中应用的滤波器和处理。


