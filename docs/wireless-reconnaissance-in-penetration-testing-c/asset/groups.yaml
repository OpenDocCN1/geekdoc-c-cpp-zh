    # General Mobile Radio Service (GMRS)


    GMRS is less common than PRS as it requires a license to use the service. The
    license is not challenging to obtain, as there is no required exam and at the
    time of writing the cost is $85 and a single license can be used by an entire
    family. A main advantage is that GMRS allows the use of repeaters and more transmission
    power than PRS.


    The names of the channels in GMRS often vary by manufacturer, however the frequency
    is what important for our purposes so they can be programmed into a scanner to
    determine whether the target is broadcasting on. As with other frequencies, if
    possible, program these frequencies into the scanner prior to going onsite. The
    8 GMRS frequencies in the GMRS Frequencies table are in addition to the PRS table
    listed as being shared with GMRS.


