    the facility. We waited for a ship to come into port. By listening to their radio
    chatter, we could hear them preparing for the arrival of a ship several hours
    in advance. Initial chatter would begin to happen about 12–24h before a ship''s
    arrival in port. Chatter on the operations increased the time of arrival draw
    had. We needed, we could have learned everything about their procedures for loading
    and unloading this, as well as kept taps on where they were. Anticipating the
    ship''s arrival, the guard in the mobile unit had a habit of parking in a position
    where they could observe the inner gate a short before the ship docked. In this
    position, we were not able to monitor the perimeter at the train tracks. This
    was the time we would be able to penetrate the perimeter by following the rail
    lines. Once inside the perimeter, we found a hiding spot where we could watch
    traffic going in out of the higher security area, and waited for an opportunity
    to enter ourselves.


    Given the attention on our area we felt a technical attack (lock picking, fencing
    climbing, etc.) would be the best way to go. So we decided to try and use a stealth
    approach, augmented with social engineering (our costumes and equipment, allowing
    us to blend in and look like employees, and knowledge of their processes and terminology
    that we had gained through radio surveillance) in case we were detected or needed
    to reveal ourselves. We had head on the operations channel that they were going
    to bring the cargo onto the ship in an hour. From listening, we learned the cargo
    was a mix of shipping containers and smaller items semi-trailers.


    We went to the cargo area, and found an unlocked trailer. This part of the property
    didn''t seem to have guard coverage at the moment. We entered through a side door
    in the trailer, which was fortuitous because door happened to have an interior
    handle allowed us to open the door from the inside. The rear cargo doors did not
    appear to have a way to unlock them from the inside.


    We hid out in the cargo area and waited. Around 90 min later, they started moving
    the cargo.


    We could verify this by the radio traffic (using headphones to keep our noise
    down) and noises heard in the cargo waiting area. After a while, our truck started
    up. It drove for about 5 min, then stopped. Once it stopped we waited'
- md: '

    several minutes until it was quiet. Once we felt safe, we carefully opened the
    side door, looked around to make sure no one was in the area, and exited the trailer.
    At this point, we proceeded to obtain evidence that we were inside the target
    area by taking pictures. We also found a place to leave the loaf of bread.


    Having accomplished our objective, we exited the area. This was accomplished by
    simply walking out the gate. The guards assumed that we were dock hands, and did
    not check our IDs. We learned that they were supposed to perform an ID check,
    but had fallen out of this habit when the ship crew wasn''t present and only "trusted"
    dock hands were present. With the number of personnel employed at the dock, and
    turnover in the workforce, it was easy to pass without raising suspicion.


    # Remediation and Lessons Learned


    As a result of our successful penetration, the dock company became more diligent
    about using ID cards to get in and out of the area. The benefit that really sold
    them here is a matter of life safety in an emergency response situation. Knowing
    how many people are in an area, in the event an accident occurred is very beneficial
    information. If you send first responders into a fire, it is great if you can
    tell them we have X number of people unaccount for, instead of "a few" people.


    We recommended the Client install turn styles or other anti-tail gating devices
    to prevent multiple persons from entering or exiting on one card swipe.


    The Client made changes so the mobile patrol remained mobile even when ships were
    in dock.


    The Client set up a video system that could monitor the secure dock entrance,
    so the mobile unit was no longer required to monitor that gate.


    Additionally, we recommended the Client install a smart video system to watch
    the train tracks and automatically notify the guards if the system sees people.
    This was also a life safety issue. In the past, there had been incidents with
    unauthorized persons wandering onto the tracks, and getting into the facility.
    While preventing their entry into the facility was desirable, it is also important
    to remove them from the train tracks as fast as possible to avoid being hit by
    a train.


    Lessons:


    - Perimeter security. If there is an area that is impractical to fence and gate,
    it diminishes the security provided by whatever perimeter fencing you do have.
    Unsecured perimeter areas should be subject to increased monitoring.


    # Case Study: Offsite Profiling 63


    - Cameras and lighting. We noted on our map the locations and coverage of all
    the cameras and lights, and made recommendations to the Client to cover blind
    areas, particularly in the vicinity of the train yard, where the exposed perimeter
    allowed us to enter the site undetected.

    - Lax security posture. Security staff need to establish and follow procedures
    closely, particularly at gates and other checkpoints. This is a constant battle
    to keep people following process. Without external reinforcement of process, it
    is simply human nature to relax as the job becomes routine, and this leads to
    shortcuts. First, we recommend to automate the process, because machines are much
    more reliable than people when it comes to following a process exactly the way
    every time. When a person is required to follow a process repeatedly, it becomes
    routine, and soon the person stops thinking. We find it better for the human elements
    in the security chain to think, and we recommend reserving them for tasks that
    require thinking and judgment, which are domains currently better suited to human
    beings. To the extent that people do need to adhere to process, spot checks and
    audits are helpful. For Clients who are concerned about this, we help them establish
    recurring physical penetration tests every quarter or to test the security force.
    If they know they are being tested to maintain a more ready posture, we recommend
    regular training and drills. When we run into cases of a lax guard force the first
    thing we recommend is more training, and not firing the guards. Firing the guards
