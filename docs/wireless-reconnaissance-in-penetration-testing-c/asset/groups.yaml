    > TIP

    > When posing as a salesperson for purposes of social engineering, let the target
    do the talking.

    Ask open-ended questions such as:


    - How many radio users does your organization have?

    - What type of special features do you use or are you considering?

    - Do you currently use encryption or trunking?


    The answers to these questions and others are helpful when selling radio equipment,
    and are also helpful when profiling a target organization.


    Posing as a radio salesperson can result in release of valuable information. Commonly
    the facilities department will manage radio equipment. If the target has a physical
    security department, they may be tasked with radio procurement. Remember, before
    calling, you must gather as much information as possible. If you aren''t able
    to speak intelligently about the equipment you purport to sell, the ruse will
