    虽然当我们听到“无线电”一词时，脑海中都有一个形象——无论是收音机钟、汽车音响还是对讲机——但所有无线电台都做三件基本工作：


    - 调谐：无线电台可以调到所需的频率。

    - 放大：无线电台可以放大无线电波通过天线时接收到的微弱信号。当无线电波通过天线时引入的能量非常微弱。信号通常需要被放大到无线电台其他部分可以处理的水平。

    - 解调：无线电台必须从背景噪声中检测信号，并将信号解调为可用的形式。在大多数情况下，这意味着将信号转换为终端用户可以听到的声波。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_15_0.png)


    图 2.7 无线电框图


    为了实现这些功能，无线电台具有不同的专用部分。图 2.7 是超外差接收机（也称为 Superhet）的框图，它是目前最流行的接收机类型，通常用于现代扫描仪。


    理解这一点至少在高层面上是重要的：超外差接收机（也称为 Superhet）是目前最流行的接收机类型，通常用于现代扫描仪。


    （注：由于原文存在大量重复句子，此处译文已进行去重处理以符合文档规范。）

