    若要获得英寸为单位的长度，请乘以12。若要米为单位的长度，请使用以下公式：


    ```

    Frequency (MHz) = 0.5 × wavelength = length of antenna (in meters)

    ```


    将此结果乘以100（或简单地除以3/f）即可得到厘米为单位的长度。


    - 极性：天线的极性决定了其在哪个空间轴上最敏感。极性有两种类型：水平极化和垂直极化。理解你正在使用的天线的极性将帮助你正确放置它，以获得最大增益，并指向发射源（天线的设计如此如此）。水平极化的天线在水平面内敏感，如果部署得当，天线看起来应该是平放的，就像你可能仍然在屋顶看到的旧式电视定向天线（图
    2.13）。垂直极化的天线应该垂直直立，就像FM无线电或CB无线电上的鞭形天线一样。这些也是射频扫描仪最常用的天线。


    为了从天线获得最佳性能，你希望发射天线和接收天线的极性匹配。对于书中的大多数系统，接收机天线应保持垂直放置以获得性能。


    - 天线增益：天线增加信号强度的程度称为增益，以分贝（dB）测量。分贝尺度是对数性的而非线性的，正因如此，仅仅几dB的增益就能产生显著差异。例如，50W灯泡和100W灯泡之间的信号强度差异为3
    dB。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_24_0.png)


    # 信号强度


    接收信号时增加信号强度的三种基本方法：放大、天线调谐和天线定向。使用放大器也会同时放大噪声，包括你可能不想要的噪声，结果可能只是得到了相同嘈杂信号的响亮版本。你也可以调节天线的长度，这可以通过调整天线长度或更换为针对你感兴趣范围调谐的天线来完成。最后，使用旨在聚焦信号能量的定向天线可以增加信号强度。


    # 天线图


    若要理解特定天线的接收特性，请参考该天线类型的天线图。天线图是一个图形，显示了天线周围的增益和辐射图。这对于确定定向天线的特性，或查看全向天线的状况非常有用。没有任何天线能完美接收所有方向的信号，因此图表可以帮助理解天线的特性。天线图对于理解定向天线的概念很有用。通过研究天线图，你可以看到由于使天线具有方向而产生的波束。如果你计划使用天线进行测向，这是一个重要的概念。


