  - '[PAGE 160]


    # Glossary


    Single Sideband Modulation, SSB: Analog modulation types popular below 30 MHz.
    An AM signal is generated it twice the bandwidth of the input (baseband) signals.
    SSB cuts this AM signal in half by removing one of the side bands and transmits
    only one side of the signal, because of the way AM signals are generated the single
    signal can be reproduced with only side band. Depending on the side band transmitted
    it can either be a USB (Upper Sideband) and LSB (Lower Sideband).


    Simulcast: In a multi-site trunked system all traffic is repeated across all sites
    in a trunked system regardless of which groups are using at the same time.


    Simplex: Transmission and reception occur on the same frequency.


    Skip: Describes wave propagation that occurs by Ionospheric refraction.n Sky Wave:
    Describes when radio waves are refracted by the ionosphere. This allows all AM
    signals to be heard far away.


    SMA: A type of standard antenna connector used for coaxial connections.


    SmartZone: In a multi-site trunked system traffic to specific groups are only
    broadcast by site where that group is present.


    Spectrum: Electromagnetic spectrum from 3 kilohertz to 300000 megahertz.

    Spectrum Analyzer: A device that analyzes frequency, distortion and noise of radio
    frequencies


    Spread Spectrum: Modulation types that incorporate methods that spread a signal
    over a chunk of the spectrum to make better use of the bandwidth and avoid interference.

    Spurious: False signals that occur by overmultiplying a signal, overloading part
    of the radio or are generated by the internal circuits of the radio. Birds are
    examples of spurious signals generated by the internal circuits in a radio.


    Squelch: A feature in scanners and radios that silences the receiver until received
    signal strength exceeds a predetermined threshold.

    SSB: Single Sideband Modulation.

    Super High Frequencies, SHF: Frequency range over 3000 MHz.

    Surface Wave: See Ground Wave.


    T


    Terminal Node Controller, TNC: TNC converts digital signals from a computer to
    analog signals for radio transmission, and vice versa.


    Tone Activation: Activation of a receiver with a predetermined tone or tone sequence.
    The tone must be repeated before the repeater relays all transmissions.

    Trap Dipole: A type of dipole antenna which has multiple coils, also known as
    traps, that allow the antenna to be effective on multiple bands.


    Troposospheric: occurs when cold and warm air streams meet about 2 kilometers,
    or approximately 1.2 miles above the Earth. This phenomenon, which is often seen
    during the summer and lasts about an hour at a time, creates a “pipe” that allows
    signals to travel great distances.

    Trunking: Radio system using several channels or frequencies, and allows those
    to be used by a large number of users, in multiple talkgroups, whose conversations
    interfering with each other. Trunked systems use a control channel, called the
    trunk, which transmits data packets which allow members of a talk group to carry
    on a conversation by frequency to communicate when they key up.


    Tuner: Part of a receiver where the antenna is selected at a specific frequency
    from other radio wave.


    U


    UHF: Ultra High Frequency. UHF is the frequency range from 300 MHz and 3 GHz (3,000
    MHz)'
