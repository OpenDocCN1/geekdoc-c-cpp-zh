    ## SCANNERS RECOMMENDED FOR WIRELESS RECONNAISSANCE


    Even with laying out criteria to select a good scanner for wireless reconnaissance
    some individuals may prefer specific recommendations on which radio to buy. The
    next section contains these recommendation on currently produced scanners that
    would work well for radio reconnaissance. Note that new scanners come out yearly
    so quickly this could be out of date. Also if a radio is not listed in this section
    it does not mean it''s a poor fit.


    ### Uniden Bearcat BCD-396XT


    Currently the top scanner we recommend for wireless reconnaissance is the Uniden
    Bearcat BCD-396XT (Figure 7.6). This is the scanner most frequently used by the
    authors and during most of the case studies in this book. The scanner covers the
    frequency range that encompasses all commonly encountered during wireless reconnaissance.
    The scanner can follow trunked systems and decode P25 digital audio traffic so
    it is as future proof as you get with current production scanners. The B396XT
    comes with Uniden''s Close feature which can be helpful when trying to identify
    unknown frequencies. The scanner is also programmable and controllable. Current
    the BCD-395XT retails for $450.


    ### GRE PSR-310


    If you don''t want to decode P25 digital traffic or if the price of the BCD-395XT
    is outside your budget the next model to look at is the GRE PSR-310 (Figure 7.7).
    The PSR-310 frequency coverage is almost identical to the BCD-395XT and will also
    track trunked systems. GRE''s spectrum feature which can be used to find the frequency
    of unknown close transmitters. The scanner is also computer programmable and controllable.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_101_0.png)


    > Figure 7.6 Uniden Bearcat BCD-396XT, Reprinted with Permission from Meagan Call


    ## CHAPTER 7: Basic Overview of Equipment and How it Works


    > Remember, you don''t always need the latest or most expensive scanner to gather
    valuable information during a penetration assessment. While there are many great
    top of the line units available, sometimes a cheap unit will do the job just as
    well.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_102_0.png)


    At time of publication the PRS-310 is selling for around $150.


    ### AOR 8200MKIII


    The AOR 8200 MKIII (Figure 7.8) is a high-end continual coverage scanner that
    has a number of unique features which can be helpful to individuals performing
    wireless reconnaissance. The big shortcomings of the AOR 8200 MKIII are it lacks
    the ability to track tracked radio systems and cannot decode P25. Although it
    cannot decode-25 digital signals it can demodulate all popular analog signals.
    A unique accessory this scanner is the ability to decode voice inverted traffic
    using the AOR V18200 Voice Inverter Card. Using this card the radio can decode
    single point voice inversion transformations. The radio is also very easy to control
    using a computer. AOR has published the full specifications on how to control
    the radio so someone with programming ability can write simple programs to control
    the scanner. The case study at the end of Chapter X used an computer controlled
    AOR 8200 MKIII to determine which wireless readings from multiple locations were
    inside the target building. The computer control port on this scanner also allows
    you to access the discriminator for the radio which is helpful if you need to
    decode or analyze data transmission on frequency. The 8200 MKIII can also be paired
    with an Optoelectronic Scout to perform Reaction Tuning where the radio automatically
    tunes into the frequency Scout detects. This can be a valuable feature to quickly
    determine if the frequency belongs to the target organization. With all these
    features comes one of the biggest disadvantages of the 8200 MKIII. It is a complicated
    complicated that has a steep learning curve. If you do get one for wireless reconnaissance
    work be to acquaint yourself with the radio and its features before you take it
    out in the field. Also be sure to bring along the owners manual in case you need
    to look something up.


