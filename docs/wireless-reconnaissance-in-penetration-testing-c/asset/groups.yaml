    我们的客户对我们能监控耳机多远也感兴趣。使用普通天线，我们可以从约 100 英尺外监听耳机，这意味着我们可以从停车场和周围街道窃听。使用针对 900 MHz
    调制的天线（Max Systems 8HH 900MHz 伞锥形天线，遗憾的是已断开）可以轻松从两个街（约 500 英尺）外监控耳机，展示了使用匹配目标频率的良好天线如何提高性能。


