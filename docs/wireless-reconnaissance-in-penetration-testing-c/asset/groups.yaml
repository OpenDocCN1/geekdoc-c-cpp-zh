    # 前言


    无线电波环绕着我们，越来越多的设备正在变得无线化。大多数渗透测试人员只关注使用 802.11 和蓝牙设备的极小部分无线频谱。物理渗透测试往往会错过安保对讲机、无线耳机、无线摄像头以及现代企业常用的许多其他无线电设备。这些系统传输了攻击者在针对性攻击中获得的丰富信息。


    后续章节旨在教育渗透测试人员如何发现和利用这些系统。这本书对于需要系统的人来说也是一个极佳的资源。


    # 本书的组织结构


    阅读本书的最佳方式是按照其顺序，但章节结构也便于读者无序阅读。当提到之前章节涵盖的关键概念时，页面将进行引用。书末还包含了一个术语表，以帮助理解陌生词汇。


    ## 第一章：为什么要进行无线侦测？


    在本书的第一章中，读者将学习什么是无线侦测以及它在渗透测试中的作用。本章以一个在电力公司渗透测试期间使用的无线侦测案例研究结束。


    ## 第二章：基础无线理论与无线系统介绍


    在第二章中，读者将学习无线电工作背后的理论，并对执行无线侦测时遇到的各种无线系统进行介绍。本章从讨论基础无线理论开始。作者涵盖了理解基础概念所需的术语，概述了频谱并讨论了无线电波在不同频率下的行为。接下来，他们介绍了无线电如何工作以及接收机中的不同组件。在读者了解无线电如何工作后，她将阅读无线电最重要的部分：天线。这部分从涵盖天线理论开始，总结了在渗透测试执行无线侦测时最常见的天线类型。在讨论天线之后，章节进入无线电编码数据的不同方式（调制类型）。该部分涵盖了模拟、数字和扩频调制类型。接下来是对常用无线系统的梳理，从讨论简单的双工无线系统开始，扩展到中继器，最后以分组无线系统的解释结束。本章结束于关于如何学习无线电和无线理论的建议。


    ## 第三章：目标


    在第三章中，读者将学习一些可以在无线侦测中搜索的不同目标类型。重点目标包括安保对讲机、无线电话和摄像头。


    ## 第四章：场外侦测


    场外侦测章节涵盖了在到达现场之前如何尽可能收集有关客户无线系统的信息。作者建议了在线搜索中使用的词汇、如何搜索 FCC 许可数据库，以及可以用于收集更多客户信息的专业网站。本章以一个案例研究结束，涵盖了在对码头进行物理渗透测试之前进行的场外侦测，以及这些信息在攻击期间是如何使用的。


