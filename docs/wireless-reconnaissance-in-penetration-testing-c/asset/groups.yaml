    # Frequency Coverage


    Scanners are generally divided into two basic categories as far as frequency coverage
    is concerned; Full Coverage and Band Coverage.


    Full Coverage is generally found on higher-end units, and often includes shortest
    coverage. While shortest coverage is particularly useful for penetration testers,
    it can be fun to have if you are interested in becoming a radio hobbyist. Unless
    you get a special, even a Full Coverage radio will still block old analog telephone
    frequencies. While this may seem odd that analog frequencies are no longer used,
    it is still illegal to sell a radio that can receive these frequencies. There
    are exception to this law and unlocked radios can be legally obtained if you are
    willing to cut through a good deal of red tape. Contact a dealer that sells unlocked
    scanners and can provide the requirements and the paperwork needed to purchase
    an unblocked scanner.


    Band Coverage scanners cannot tune to any frequency, rather they provide access
    to popular bands or groups of frequencies. These are sufficient for most users,
    the frequencies you want to listen to are generally included in the Band Coverage.


    It was used to be there were three basic types of radios: those banded to 30 MHz
    to roughly 500 MHz, those banded to 30–900 MHz and Continuous Coverage. These
    days, or less expensive scanner covers 900 MHz where 900 MHz coverage used to
    be a differentiator, today the common-differentator is in the trunking and digital
    capabilities of the unit. For reconnaissance purposely a scanner will not need
    to receive signals below 30 MHz Having a scanner that can receive over 1.8 GHz
    is usually of limited value. If you are performing an assessment that requires
    receiving traffic over 1.8 GHz scanner is probably not the best tool to use because
    most traffic in this range is digital. Chapter 11 will discuss specialized tools
    that are more appropriate to this task.


