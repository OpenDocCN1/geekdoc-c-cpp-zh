    At the time of this writing, half dozen P-25 systems have migrated to Phase 2
    or Motorola''s X2-TDMA system. Motorola''s X2-TDMA system was released before
    the Phase 2 requirements were finalized and is largely based on the P-2 standard.
    Currently, support for Phase 2 systems is very limited. The GRE PRS-800 has experimental
    support for P-25 Phase 2 systems. As these systems become more widespread, most
    likely additional scanners will be made that support this system.


    ## Common Types of Spread Spectrum Modulation


    These modulation types all incorporate methods that spread a signal over a chunk
    of the spectrum to make better use of the bandwidth and avoid interference. Monitoring
    these systems can also be difficult, since the hopping pattern can be difficult
    to follow. Spread spectrum modulation enables sharing of the electromagnetic media,
    in other words more users in the same area can transmit in the same frequency
    range without interfering with each other. This is because digital modulation
    broadcasts data in packets, with other radios that may be operating in the same
    area. In some systems, the hopping pattern is specifically made to be hard to
    track as an added security mechanism. Direct-Sequence Spread Spectrum (DSSS) and
    Frequency Hopping Spread Spectrum (FHSS) are two common types of spread spectrum
    modulation.


    DSSS spreads the signal over the full bandwidth of the transmitter''s frequency
    range. This is done using a pseudorandom sequence to determine how data is spread
    throughout the frequency range. DSSS signals look much like white noise when looking
    at their RF graph. DSSS modulation is used by a variety of wireless systems such
    as GPS, CDMA-based cellular networks such as Verizon 802.11b.


    FHSS rapidly switches the carrier across many different channels in a pseudorandom
    sequence. FHSS is used by many consumer devices that operate in the 2.4 GHz band
    as baby monitors, cordless phones, and wireless video cameras.


    With both DSSS and FHSS the transmitter and receiver need to share the pseudorandom
    pattern if they are going to exchange data. This offers a level of security because
    an attacker would need to figure out the pseudorandom pattern to intercept the
    transmission.


    ## RADIO SYSTEMS


    A single radio by itself is not much of use. In order to work, you need a system.
    The most basic system consists of a transmitter and a receiver, using a common
    modulation type. More commonly in radio reconnaissance, we deal with two-way radios,
    from pairs of transceivers to complicated radio networks and trunked systems.
    Next, we''ll review the common types of systems and describe how they are structured.


    ## Simplex and Duplex


    Two-way communication can be handled in a few different ways, depending on the
    sophistication of the radio system. This gives different systems capabilities.


    ### Simplex


    Sometimes simplex is referred to as half-duplex. In simplex two-way radios, communications
    take place over a single frequency. This means that only one person can talk at
    a time. To prevent talking over each other, most users of simplex systems employ
    a spoken protocol to mark beginning and end of transmission (e.g. saying “Over”
    when speaking.) Monitoring the conversation on a simplex system is easier, because
    you only need to monitor frequency.


    ### Two-Frequency Simplex


    Some call split-frequency simplex, or split-frequency half-duplex. Transmission
    and reception take place over different frequencies, but you can only transmit
    OR receive at the same time—you cannot do both. If listening in, in order to hear
    the entire conversation you will need to listen to both frequencies on your scanner.


    ### Duplex


    Sometimes called duplex, to differentiate from half-duplex. With a duplex radio,
    two frequencies used—transmit and receive. The radio is able to transmit and receive
    simultaneously, allowing both parties to speak and listen at the same time like
    a telephone conversation. In fact, a common application for duplex radios is with
    cordless telephones. With duplex radios, it is necessary to monitor both frequencies
    to get the entire conversation. However, some systems retransmit both sides of
    the conversation over one of the frequencies. Transmitting both sides on one channel
    is common with cordless phones. So always beneficial to try to monitor both frequencies
    to see if one retransmits both sides. If one does, it saves the work of having
    to monitor the other.


    ## Radio Systems 35


    If you are only hearing part of a conversation on your scanner you are probably
    listening to a two-frequency simplex or full duplex conversation, so this should
    be a clue that you have another frequency that you need to find. Once you''ve
    found both the send and receive channels, program both frequencies into your radio
    to monitor them.


    ## Repeaters


    A repeater is exactly what the name sounds like. It is a device used to extend
    the range of a radio. When a signal is transmitted to a repeater, it boosts the
    signal and rebroadcasts it, extending the range of the original signal. It is
    essential to note that repeaters have separate input and output frequencies. If
    not for this, the retransmission would be picked up by the repeater, creating
    a feedback loop, and render the repeater useless. When listening to a repeater
    frequency; if you listen to the input frequency, you will only hear the traffic
    in your local area. For amateur repeaters there are repeat offsets depending on
    the band of the frequency. Commercial repeaters do not follow a standard. Instead
    the input and output frequency are depending on what frequency the FCC licenses
    for them to use.


    Repeaters may be fixed, or may be mobile. Fixed repeaters are (usually permanently)
    mounted in a fixed location, while mobile repeaters are attached to a mobile platform,
    such as a vehicle.


    Fixed repeaters are also often stationed in places to increase the broadcast area
    by extending the horizon and minimizing line-of-sight issues. They are commonly
    mounted on hill or mountain peaks, or the highest available areas of local geographical
    elevation, tall buildings, and purpose-built towers. For example, a handheld repeater
    is being used in a valley, a repeater positioned on high ground can catch the
    signal and retransmit it that other can receive it. Multiple repeaters can be
    linked so a signal is transmitted over multiple locations. In this way, short-range
    signals can be relayed across vast distances, even across a country or state.
    Mobile and fixed repeaters may be used in concert, augmenting each to create radio
    networks.


    Repeaters frequently use Digital-Coded Squelch (DCS) and Continuous Tone-Coded
    Squelch System (CTSS) for Media Access Control in Radio, below to prevent spurious
    signals from entering the repeater and being retransmitted. This can also function
    as a simple and inexpensive form of access control because someone wants to transmit
    using the repeater needs to know the CTSS or DCS code used by the repeater. However,
    keep in mind that many radios have a feature that will automatically determine
    the CTSS or DCS code in a received signal so this is also a fairly weak form of
    access control.


    > NOTE

    Some police vehicles act as repeaters for handheld radios, repeating and amplifying
    the signal from the officer''s handheld, allowing the signal to reach the dispatch
    center.


    ## Media Access Control in Radio


    Media access control is any of the types of methods that enable multiple people
    to share the RF spectrum. A number of systems have been developed over the years
    to make better use of the spectrum.


    The radio spectrum is a finite commodity, and increasingly crowded. Because of
    these limited availability of open spectrum, it is expensive to get licenses for
    multiple channels. To deal with these limitations, different approaches, from
    techniques improved in the field, to increasingly sophisticated technological
    innovations have been developed to provide ways for multiple groups to share the
    same frequency of system.


    In its simplest form, operators simply listen to the channel and wait for it to
    be clear before transmitting provides access control consists of using CTCSS or
    Digital tones. In its most complex form, access control is accomplished with trunking.


    ### CTCSS


    Continuous Tone-Coded Squelch System (CTCSS), also known as tone squel, is designed
    to allow users on a shared frequency to hear only users in their user group. Each
    group is assigned its own squel tone, and the radio only plays to the audio when
    the squel tone is transmitted. The transmitter adds a sub-audible code to the
    transmission. The receiver, if in CTCSS mode, lists for the transmission and the
    unique sub-audible code. The receiver''s audio will only activate if both the
    transmission and the sub-audible code are present.


    CTCSS-equipped receivers generally can operate in either CTCSS mode or normal
    mode. While in CTCSS mode, the receiver''s audio will only be activated if the
    transmitted signal was sent using the same CTCSS tone. CTCSS tones are standardized
    by the Electronic Industries Alliance (EIA) in standard RS-220.


    One important caveat with CTCSS systems, from a user perspective, is that CTCSS
    does not somehow create extra bandwidth. There is still one channel in use, and
    it cannot carry more than one transmission without'
