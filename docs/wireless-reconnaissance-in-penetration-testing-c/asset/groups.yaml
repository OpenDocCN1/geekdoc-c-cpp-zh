    # 一切都在数字化


    违规行为的影响。用于嗅探和注入蓝牙数据包的商业工具花费数千美元。Ubertooth 将攻击蓝牙的设备成本降低到了 120 美元。


    # Zigbee


    Zigbee 是一种基于 IEEE 802.15.4 标准的个人域网规范，通常用于短距离和低功耗无线设备。通常，Zigbee 设备用于网状网络（mesh networks），通过在网格中的中间设备进行中继来扩展其范围。它广泛应用于从智能电表、恒温器到无线灯开关的各种产品。当你寻找
    Zigbee 时，你会发现它出现在许多意意想不到的地方，但极少数的渗透测试人员在寻找它。Zigbee 系统被设计到各种应用程序中。


    KillerBee 框架由 Josh Wright 开发，用于攻击 Zigbee。该项目的主页为：http://code.google/p/killerbee/。它是一个开源软件。KillerBee
    是一个用于评估和利用 Zigbee 及 IEEE 802.15.4 网络漏洞的框架。它可以用于嗅探数据包、重放数据包进行攻击，以及攻击 Zigbee 使用的加密系统。图
    9.3 显示了如何使用 Scapy 注入自定义构造的数据包。


    KillerBee 可以配合几种不同的 Zigbee 射电器使用。最流行的是 Atmel RZUSBSTICK（图 9.4）。当使用原始固件配合此射电器时，KillerBee
    的功能有限。通过加载自定义固件，可以使用更多功能。注意，加载自定义固件会去-


    > 劫持无线连接以获取内部系统的访问权限


    在所有情况下，无线链路都是潜在的攻击点，渗透测试人员应该考虑这一点。通过攻击链路或设备，攻击者大多数时候是在操纵他们控制的系统。例如，你可能让它看起来像消耗了更多功率。或者攻击端点（如恒温器）并调整建筑内的温度。这看起来可能不是什么大问题，但对于制造业和医疗保健行业，温度控制是至关重要的。


    如果你渗透了一个设备，可能可以利用它进一步渗透企业后端网络。例如，在最近对一个智能电网系统进行渗透测试时，我们成功劫持了智能电表和电力公司之间的无线链路。电力公司认为这是一个安全的链路，导致其网络其余部分比应有的要暴露得多。因此，一旦我们进入，我们就有了其后端系统的完全访问权限，可以执行更传统的渗透测试，并攻击智能电表负责的系统。我们发现了漏洞，允许我们接管这些系统，并将它们作为进入更大网络的跳板。


    # 第 9 章：新技术


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_126_0.png)


    图 9.3 使用 KillerBee 注入自定义构造的数据包。经 Spencer “zeroSteiner” McIntyre 许可打印。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_126_1.png)


    图 9.4 KillerBee 使用的 Atmel RZUSBSTICK。经 Meagan Call 许可转载。


    ATMEL 编程工具（200 美元）。但总的来说，创建一个自定义攻击工具仍然很便宜的。KillerBee 的巨大优势在于它创建了一个廉价的平台，通过嗅探和注入数据包来攻击
    Zigbee。在过去，执行此操作的测试设备非常昂贵。有了 KillerBee，你可以拿一个 40 美元的 Atmel RZUSBSTICK 并将其变成攻击工具。


    # 数字化意味着不仅仅是 WiFi


    显然，数字无线电的世界远比 802.11 (WiFi) 多得多。非 WiFi 无线技术的某些应用包括：


    - 家庭/建筑自动化系统：常见品牌有 Crestron、Control-4 和 X10。它们被用于连接照明、暖空调（HVAC）、运动和温度传感器、电动窗帘和其他电器，以便建筑和家庭能够实现自动化并更节能。例如，自动化系统可以编程根据房间的占用情况和当天的天气预报来调整暖空调系统的开启和关闭。所有这些灯开关、传感器、恒温器等通常都是无线连接的。其中一些使用
    Zigbee 或 802.15.4 的自定义实现，另一些则使用专利 RF 技术。这些系统不仅环保，还能省钱，因此它们将变得越来越流行，特别是随着技术价格下降和能源成本上升。


    - 智能电网：目前最流行的智能电网应用在电力领域，但也可以适用于燃气和水务分配网络。该技术用于创建一个能够实时适应变化的电网。在基础实现中，智能电表仅实时或近实时将用量数据报告回中央办公室，但缺乏控制能力。要变得“智能”，电网必须能够利用其收集的信息并做出改变/反应以更好地管理负载。智能电网可以与家电交互以调整能量消耗。例如，当电网负载过重时，它们可以与恒温器交互，设置夏季的空调温度。或者，它们可以调用智能电器（如洗衣机和洗碗机），安排它们在能源成本最低或有剩余时运行，并避免在能源需求高涨时运行。电表以及支持此点的基础设施通常使用各种协议无线连接，从专利网状网络到
    Zigbee 再到蜂窝网络。


    - 数字信号、广告牌等的专利链路：通常，具有全彩显示的广告牌通过蜂窝网络更新，这样速度更快。9600 波特很慢，但不需要太多数据。这里没有标准。由公司 A
    的通常无法由公司 B 控制。


    # 软件无线电 (SDR)


    我们习惯于将无线电视为由晶体管、电路和天线组成的硬件。然而，通过软件模拟任何类型的电子硬件是可能的。因此，软件无线电 (SDR) 诞生了。SDR 的通用设计是一个射频前端，它馈连接到模数转换器
    (ADC)。如图 9.5 所示，某些设计


    img/2e4b8b26cfbdeba5a5a91921492f98df_128_0.png 数字信号处理器 (DSP) 置于 ADC 和通用计算机之间，以辅助处理
    ADC 的输出。SDR 不是一个新概念，但随着 FPGA 和其他电子技术的进步，现在在软件中实现以前由于性能原因需要硬件的功能是可行的。随着廉价 SDR 的出现，我们正在进入无线破解的新黄金时代。SDR
    将成为拦截、解码和破解新系统的关键。


    # SDR 与传统无线电有什么区别？


    软件模拟传统在硬件中实现的功能。传统无线电中通常在硬件中实现的组件在 SDR 中通过软件实现。软件和处理可以在通用计算机（个人电脑或嵌入式系统）上运行。某些使用现场可编程门阵列
    (FPGA) 来辅助处理。通常使用 FPGA 和通用 CPU 的组合。


    软件中实现的无线电常见部分：


    - 过滤器：在硬件中制作适应信号变化的过滤器非常复杂，需要大量组件。这在软件中要简单得多，因为可以根据信号特征轻松更改。因此，过滤器通常在软件中实现。许多时候
    RF 过滤器也在 SDR 中实现。


    '
