    that is able to decode it. The situation that exists today is similar to the "code
    hell" issue that drove users crazy number of years ago when trying to watch videos
    downloaded from the Internet. Each video file was encoded with one of dozens of
    custom codecs. In order to decode the video data, you need the right code to watch
    the video, which was not included with the video file itself, and had to be downloaded
    and installed separately. Without any automated means of finding and installing
    the codec, it could take times a great deal of searching to find a web site that
    offered the codec for free download. Until just a few years ago, many video codecs
    in use were open license—and/patent-encumbered, and had to be purchased in order
    to be used legally.


    With digital radio demodulation, it''s more a of proprietary modulation not being
    made for scanners. Many manufacturers have developed their own method of modulation
    and consider it a trade secret that confers an advantage if they keep it to themselves,
    forcing customers to buy from them. Oftimes, the only way to demodulate a signal,
    other than with the proprietary radio that supports the format, is a time-consuming
    reverse-engineering effort.'
