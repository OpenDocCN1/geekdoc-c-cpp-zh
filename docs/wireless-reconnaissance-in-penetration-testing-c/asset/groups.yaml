    ### WHY 10.7 MHz?


    The choice of 10.7MHz for the Intermediate Frequency is a convention that was
    settled upon for a number of practical reasons. The standardization came about
    when Superhet receivers were first made for the broadcast FM. 10MHz was picked
    because any harmonics created by the mixer would fall outside the FM band (which
    is 20MHz wide). The 0.7 was picked because the frequency spacing in the US was
    2MHz.


