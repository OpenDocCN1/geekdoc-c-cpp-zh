    **图 5.9** 现场观察到的无线耳机


    出于法律责任考虑，我们需要确保没有监控到任何耳机，因此没有监控该区域其他业务的电话通话。


    为了实现这一点，我们切换到了定向天线，并通过在多个位置使用天线，确定了哪些信号源自目标建筑内部。一旦我们识别出来自客户现场内部的信号，我们就开始监控这些信号。


    > 请记住，每当你准备监控电话通话时，以合法且不违反任何窃听法的方式进行至关重要。窃听法非常复杂且因州而异。例如，某些州只需要一方同意即可监控，而另一些州则要求双方（双方）同意。请务必咨询您的法律顾问，以确保这种做法没有违反任何法律。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_79_0.png)


