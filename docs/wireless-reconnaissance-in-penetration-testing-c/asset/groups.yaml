    # Additional Considerations When Buying Used or Older Model Scanners


    There are many arguments to be made for purchasing used or older model equipment,
    price being chief amongst them. Used units are also great for


    > NOTE

    Ham radios are usually a great place to purchase used equipment. Often times,
    they will offer some form of warranty, and if something goes wrong you will be
    able to contact the person who sold the equipment. Additionally, Hams are passionate
    about radio, and generous with their knowledge.


    > TIP

    If allow, it is best to have two scanners. One can be used to monitor dispatch
    and the other can be used to scan. On reconnaissance engagements, you will almost
