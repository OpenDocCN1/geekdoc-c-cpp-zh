    # 连续辅调静音系统 (CTSS)


    连续辅调静音系统 (CTSS)，也称为色调静音或远程静音控制，设计用于让共享频率上的用户只能听到其用户组内用户的信号。从理论上讲，CTSS 将允许用户只听到其用户组的传输，而不受到同一通道上其他人传输的影响。配备
    CTSS 的接收机通常在 CTSS 模式或普通模式下运行。在 CTSS 模式下，只有当传输信号使用相同的 CTSS 音调发送时，接收机的音频才会被激活。CTSS
    在噪声环境中也有帮助，因为扫描接收器可能会拾到打破静音杂信号。在扫描接收器中编程 CTSS 音调，除非出现具有正确 CTSS 音调的信号，否则不会停止扫描。


    # 数字码静音 (DCS)


    数字码静音 (DCS) 是 CTSS 的较新版本，通过使用次听音调发送数字数据来工作。某些制造商将 DCS 称为数字私有线 (DPL)。


    # 字母数字内存


    扫描接收器的字母数字内存功能允许用户使用文本字符串为每个通道命名。过去，扫描接收器只会显示通道号可能可能是频率。在那些类型的扫描接收器上，你需要记住通道 1
    是 Lakewood 的火灾调度，通道 2 是 Rocky River 的调度，以此此类推。当你向扫描接收器中程序化 200 个通道时，很快就无法记住所有通道了。在执行无线侦察时，此功能非常有帮助，因为你在一周内可能会访问多个站点，使得记忆通道的任务变得更加困难。


    # 计算机编程


    投入更多资金购买一个可以通过计算机编程的扫描接收器是明智的。能够用计算机编程扫描接收器将允许你使用全尺寸键盘，从手册和网站复制并粘贴频率，如果你需要输入大量频率，这将节省大量时间。


    # 语音静音 (Voice Squelch)


    语音静音是一种无线功能，扫描接收器只有在识别出似乎是声音时才会停止。虽然这对于跳过你在侦察期间可能遇到的数据流量有用，但它仅取决于供应商的实现。在执行任务中使用此功能之前，评估扫描接收器准确拾取语音传输的能力是明智的。同样，某些制造商具有“数据跳过”(Data
    Skip) 功能，可以跳过需要携带数据信号的通道。该功能的效果与语音静音相同。


    # 衰减器 (Attenuator)


    衰减是一种减小进入无线电信号功率的滤波器。衰减器位于天线和无线电前端之间。不同的扫描接收器模型以不同的方式实现衰减，某些允许按通道设置衰减器，而另一些则要求


    > 注意

    最近型号的 GRE 和 RadioShack 扫描接收器有种声，即在信号很多的环境中（如大都市地区），无线电前端很容易被过载。这会导致音频失真或在错误的频率上听到信号。在无线电上启用衰减功能将有助于降低这些信号的强度，并防止无线电前端过载。


    # 选择扫描接收器


    衰减器用于所有通道或均不使用。在区域存在强信号淹没其他信号的环境中，衰减可能很有帮助。呼机发射器因过载周围信号而闻名。在射电频率丰富的城市环境中使用敏感型扫描接收器时，衰减也可能有用。


    # 近场频率计数功能


    “现场分析”(On Site Profiling) 第 6 章涵盖了如何使用如 Optoelectronics Scout 等频率计来寻找目标无线电系统使用的未知频率。其他扫描接收器内置了近场功能。Uniden
    将此技术命名为“Close Call”，而 GREL 标记为“Signal Stalker”。其他制造商可能有不同名称的类似系统。回顾一下，近场接收机的工作原理是寻找区域内最强的发射器，其强度足够高于噪声底，以便接收机检测到。通常意味着这些功能在射电噪声低且我们离目标发射器近的环境效果最好。这些系统的可用性和有用性在不同型号、制造商和运行环境之间存在很大差异。总体来说，作者对这些内置功能的结果参差不齐，更倾向于使用如
    Optoelectronic Scout 类的专用设备。如果你的扫描接收器具有这些功能，学习如何使用它们并在任务中使用它们是值得的。极少数情况下，扫描接收器中的近场频率计检测到了
    Scout 无法检测到的信号。在分析目标时收集的信息越多，目标分析就越清晰。


    # 分频器输出 (Discriminator Out)


    当扫描接收器接收到信号时，它会经过多个过滤器和处理以便在你听到之前清理音频。在听音频流量时，这是好事，可以让你获得清晰净的声音。但在清理过程中，会丢失解码数字信号所需的信息。高端扫描接收器具有在清理之前的分频器输出，以便解码数字信号。解码这些数字信号超出了本书的范围，但对于计划或希望拦截和解码信号的人员可能感兴趣。这也是终端用户可以添加到扫描接收器的功能。但通常涉及打开无线电并在电路板上焊接连接器。不用说，这不适合胆小的人，并且会使保失效。如果你尝试，风险自负，本书作者对你对无线电造成的任何损坏不负责。图
    7.5 显示了添加了手工分频器的无线电内部。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_100_0.png)


    **图 7.5** 添加了自制分频器的扫描，经转载


    # 购买二手或旧型号扫描接收器的额外考虑


    购买二手或旧型号设备有很多理由，价格是其中首要因素。二手设备也适合


    > 注意

    业火无线电通常是购买二手设备的好地方。通常它们会提供某种形式的保修，如果出现问题你可以联系销售设备的人。此外，业火爱好者对无线电充满热情，并且对知识非常慷慨。


    > 提示

    如果允许，最好有两个扫描接收器。一个可以用于监控调度，另一个可以用于扫描。在侦察任务中，你几乎总是会发现至少两个想要监控的事。


