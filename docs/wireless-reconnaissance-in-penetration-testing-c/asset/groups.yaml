    settled upon for a number of practical reasons. The standardization came about
    when Superhet receivers were first being made for the broadcast FM band in the
    US. 10MHz was picked because any harmonics created by the mixer would fall outside
    the FM band (which is 20MHz wide). The 0.7 was picked because the frequency spacing
