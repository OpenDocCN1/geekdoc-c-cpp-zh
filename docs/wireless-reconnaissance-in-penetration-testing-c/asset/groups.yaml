    Frequency (MHz) = 0.5 × wavelength = length of antenna (in meters)

    ```


    Multiply this result by 100 (or simply divide 3/f) to obtain the length in centimeters.


    +   - Polarity: An antenna''s polarity determines which spatial axis the antenna
    is most responsive in. There are two types of polarity: horizontal and vertical.
    Understanding the polarity of the antenna you are using will help you position
    it properly, to get the maximum gain, and aim it (the design of the antenna necessitates)
    at the transmission source. Antennas with horizontal polarity are sensitive in
    a horizontal plane, and properly deployed the antenna should look like it is laying
    down, like the old style television directional antennas (Figure 2.13) you may
    still see on rooftops. Antennas with vertical polarity should stand vertically,
    as a whip antenna on a FM radio or CB radio. These are also the most common antenna
    for RF scanners.


    To get the best performance from your antenna, you want to match the polarity
    of the transmitting and receiving antenna. For most systems in this book the antenna
    on the receiver should be held vertically to get the performance.


    +   - Antenna gain: The amount that an antenna increases the signal strength is
    called gain, which is measured in decibels (dB). The decibel scale is logarithmic
    rather than linear, and due to this, just a few dB of gain can make a significant
    difference. As example, the difference in signal strength between a 50W light
    bulb and a 100W light bulb is 3 dB.'
