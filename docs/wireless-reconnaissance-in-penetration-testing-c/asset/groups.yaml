    - 八角角（Yagi）：这是用于电视接收的熟悉的屋顶天线（图 2.15），在 NTSC 广播黄金时代是常见的景象，在电缆和卫星电视流行并最终取代它之前。它由一根中心脊和许多不同长度的侧向伸出的“肋”组成。


