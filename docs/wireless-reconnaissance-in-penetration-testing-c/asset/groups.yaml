    由于公司通常会被分配一组特定的合同安保人员，如果承包商的流动率很高，可能会更容易伪装安保人员并获得访问。发现安保人员的名字（无论是名牌、胸章还是办公桌牌）都可能证明非常有价值。记住，你对目标环境了解越深，成功渗透测试的机会就越大。


    ## 使用频率计


    便携式频率计（图 5.2 所示）是现场分析最有价值的设备之一。它们的工作原理是计算一段时间内空气电波中的脉冲数或振荡次数，从而给出这些振荡的频率，并得出传输频率。一个重要的注意事项是，如果附近存在多个传输频率，频率计将给出错误数据，因为它可能会将振荡合并，并给出一个不准确的频率计数。频率计在低噪声环境中测量单个信号的效果最好，因为它们需要的信号强度足够高于噪声底，以便频率计能够将该信号从背景噪声中分离出来并仅计算该信号。频率计将显示“近场”信号，该信号必须大约是该区域其他信号的
    10–15 倍，且频率计物理上距离信号越近，其有效的概率就越大。寻找一个单信号处于低噪声区域的地方变得越来越困难，因为当今的世界是一个极其富频（RF）的环境。随着无线手机和无线网络塔的普及，频率计锁定信号可能是一项挑战。这在信号密集的城市地区或单座塔上有有多个发射器的地方尤为困难。此外，商业广播、呼机器、电视和应急调度塔可能会给频率计带来混乱。这是合理的，因为无线、电视和应急调度塔必须有覆盖大地理区域的功率，而许多机构使用的双向无线电发射器只需要覆盖相对较小的区域。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_63_0.png


    反平方定律意味着你离信号越近，信号就越强。当然，显而易见的是，手持频率计通常能让你非常接近信号源。当你能够进入目标设施的内部时，情况尤其如此。


    对于渗透测试人员，我们推荐使用 Optoelectronic Scout 频率计（图 5.4 所示）。Scout 相比普通频率计具有许多优势，这些额外功能对渗透测试人员非常有用。Scout
    可以存储多个频率以及每个频率的命中次数，并可以将频率下载到计算机中以便于分析。这可以节省大量时间，因为从频率计屏幕上读取频率并输入计算机是一件非常头疼的事。Scout
    还提供反应调谐（reaction tuning），这意味着它可以自动将兼容的扫描仪调谐到 Scout 看到的频率。虽然这很有用处，但我们发现某些某些情况下它可以很有帮助并节省时间。例如，一旦到达现场，如果没有足够的时间进行分析，反应调谐可能允许你快速监控该区域的信号。这并不是分析的替代品，但在需要时是一个很好的权宜之计（hack）。此外，如果预算允许，在评估期间使用额外的扫描仪进行反应调谐，是捕捉现场和场外分析中缺失频率的极佳方法。


    然而，Scout 最有用的地方在于其小小的尺寸和便携性。Scout 可以放在背包里，或系在外套下的腰带上，这在需要谨慎行动的情况下非常有帮助。从背包或外套中取出并更换频率计是可疑的，可能会在渗透测试期间引起不必要的注意。


    Optoelectronic Scout 同时有模拟版（图 5.4 所示）和数字版。正如你所料的，数字版旨在寻找以数字模式运行的无线电频率，而我们发现这在渗透测试中的作用有限。此外，数字模式在实验室环境之外往往很不稳定。模拟版是一个非常棒的设备，我们强烈推荐它。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_64_0.png


