    > 提示：尝试确定信号源的方向时，改变天线的方向，直到找到能让你清晰、强烈地接收信号的方向为止。在此过程中，你可能会看到天线增益场中的副波束出现微小跳变，这可能会产生已经找到方向的假象，导致你徒劳无功。了解你正在使用的天线的图将帮助你避免被欺骗。在将天线指向信号源时，始终寻找最大增益处。


    # 常见天线类型


    广义上，天线分为两类：定向和全向。有很多不同的天线——取决于你如何分类，多几十甚至数百种。本节将关注渗透测试人员无线侦察感兴趣的类型。


    # 全向与定向天线


    全向天线从所有方向相等地接收信号。定向天线能从一个方向更好地提取信号。在这个方向上，它们可以检测到比等效全向天线更弱或更远的信号。代价是，它们通过降低从其他方向接收信号的能力来实现这一点。


    > 注意：全向性如何？虽然前缀 omn— 意味着天线能够从任何方向接收信号，但技术上说，全向天线通常只在单个平面内是全向的。例如，取决于它的方向，全向天线可能检测到来自北、南、东、西信号，而不是上方或下方。


    > 注意：天线实现的信号强度差异称为增益，以分贝（dB）测量。定向天线调整增益模式以更好地接收来自特定方向的信号。设计良好的全向天线也可以在所调谐的特定频率上提供增益。


    定向天线既有正增益也有负增益，取决于观察天线的方向。这在天线图中有所体现。


    # 全向天线的类型


    - 伞型天线（Discone）：伞型天线是宽带天线（能够接收宽范围频率），通常底座安装。有针对手持无线电的商业伞型天线，最流行的是针对手机频率的。天线可以设计在比其他类型天线更宽的频率范围内敏感。

    - 鞭形（Whip）：一种常见的全向天线是鞭形天线（图 2.14）。典型的扫描仪配有鞭形天线。这些天线通常效率低下，没有增益，然而这种


