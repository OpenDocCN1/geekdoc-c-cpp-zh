    编程可以是一个按钮，也可以是为频率编程到通道的过程。每台无线电台的控制方式不同，但同一制造商的电台之间通常相似。使用编程功能指令的最佳信息来源是无线电台的用户手册。


    # 锁定按钮 (Lockout Button)


    锁定按钮用于锁定某个通道使其不被扫描。如果某个通道由于原因产生大量杂音，或者你希望忽略某个通道，这特别有帮助。在侦察期间使用锁定的常见原因是附近有其他用户组（例如维护人员），而你只感兴趣于听其他小组（例如安全部队）。某些无线电台具有临时锁定功能，在设备重启之前都会锁定该通道。


    # 搜索 (Search)


    搜索功能允许你设置高频和低频停止点，扫描器将扫描定义的范围并在活动处停止。某些单元有时会将发现活动时的频率存储在临时内存中。


    > 提示

    > 如果你为一个渗透测试团队工作，且在任务期间或任务之间共享扫描器，你应该使用标准的通道/频组布局，以便多个团队成员可以轻松使用同一台设备。这将节省在两次任务之间设置扫描器的时间，并减少执行任务时的困惑。


    > 提示

    > 准备在新的任务中使用扫描器时，务必确保所有锁定的通道都已解锁。这将确保在在上一次任务中锁定的通道在新站点不会被跳过。


    ## 第 7 章：设备概述及其工作原理


    > 提示

    > 目标站点有一个用于与警察通信的频率，将其设置为优先级通道是一个好主意。在渗透测试期间，你希望尽快知道是否已经叫了警，以便做好解释的准备。这被称为“监控通道（monitor
    channels）”。这一功能对于渗透测试人员来说非常有价值，而且在特定区域寻找信号时非常有帮助。利用此功能的一种方法是在午夜或你处理其他事情时让扫描器运行运行，然后回来查看扫描器发现了什么。你可以先扫描范围，并锁定不感兴趣的鸟类或其他信号。这比使用搜索要简单。


    # 优先级 (Priority)


    通过优先级功能，你可以设置一个优先级通道。在某些扫描器上，这将是一个按钮。在其他设备上，它可能是一个菜单项。


    ## 选择扫描器


    扫描器是侦察最重要的设备，选择正确的扫描器可以让事情变得简单得多。事实上，选择正确的扫描器往往意味着成功与失败的区别。许多人倾向于购买带有所有功能的顶级扫描器。虽然这可能很有趣，但在你需要使用时，额外的功能往往增加困惑。


    ### 外形 (Form Factor)


    选择扫描器的首先是确定什么种形式适合你的需求。有多种形式，手持式（图 7.1）、基座式（图 7.2）和移动式。许多移动扫描器可以作为基座使用，也可以安装在车辆中，通过硬线或汽车的
    12V 电源供电。手持扫描器通常较小并由电池供电，如果你经常使用，许多可以使用适配器供电以降低运行成本。对于大多数侦察工作，尤其是第一台无线电，我们推荐使用手持扫描器，因为它们最便携且易供电。


    第四种开始变得流行的因素是只能通过计算机控制的扫描器。这些扫描器除了电源开关和偶尔的音量控制外，没有任何其他控制装置。这些无线电通常只是一个简单的金属盒，也被称为黑箱无线电。由于这些扫描器需要计算机才能工作，它们不是侦察工作的理想首选无线电。


    # 可编程扫描器与预编程扫描器 (Programmable Verse Pre-Programmed Scanners)


    扫描器有预编程和可编程两种形式。预编程单元对于本书的目的来说并不是特别有用，它们适用于爱好者、赛车迷和铁路爱好者。拥有一个预编程扫描器是有意义的


    > 提示

    > 始终务必带上充足的电池。即使你使用充电电池，也要准备一些非充电电池，以防充电电池没电。到达现场才发现没有电量将是糟糕的一天。此外，请注意某些扫描器有一个开关，可以在充电电池和非充电电池之间切换操作。确保该开关设置正确。


