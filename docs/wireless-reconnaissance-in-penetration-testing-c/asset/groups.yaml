    Security appeared to have one mobile unit, which used an SUV to cover the grounds.
    This unit did rounds when ships were not at the dock. However, when a ship was
    at the dock, we were able to refer to the radio chatter that we parked and watched
    the “high-security gate” leading to the dock. Additionally, we heard two or three
    guards on foot, depending on the time of day.


    From the map, we knew that the property also had a number of train tracks leading
    into it. From what we could tell, the rail yard area was patrolled by the mobile
    unit when it was doing. So, when a ship was docked, the train track entrance was
    not patrolled. Furthermore, while we were at the site, we could see that the train
    tracks were not gated. Our reconnaissance found that the mobile unit patrolled
    this area as part of its rounds. This meant that when a ship was docked, the train
    tracks were not patrolled. Although the dockyard had a fence around it, most of
    the dock was open over the train entrance, which did not have a fence or gate.


    While onsite reconnaissance, we saw security cameras, and the area was lit with
    flood lights and street lights, but coverage appeared to be mainly focused on
    the gates and water. On our map, we noted the areas that had coverage, as well
    as blind spots, for later debriefing with our Client. After the test, we would
    provide the Client with recommendations on where to place additional cameras to
    fill these gaps.


    By monitoring the other channels, we could also hear the operations side of the
    dock and learn when ships were coming and going. We could also learn when ship
    crew were leaving for shore, and when they were supposed to report back. All of
    these activities were coordinated, so usually we started hearing chatter well
    before the ship crews go ashore. By monitoring the guards at the perimeter gate,
    we could learn when ships were coming back. Once the guards would notify the mobile
    unit of the inbound arrivals heading to the docks, so that there would be someone
    at the inner gate to get them through.


    We also observed the type of equipment and outfits being worn by the workers and
    dock hands so we could get similar gear. The company we were working for is very
    concerned about safety, so before we arrived onsite we required'
  - '[PAGE 58]


    to purchase extra gear and required to wear it while on property. Coincidentally,
    we had been required to wear this same type of gear while doing a physical penetration
    test at another site it was already dirty and broken. This helped us to blend
    in. We would have purchased similar looking gear locally had we needed.


