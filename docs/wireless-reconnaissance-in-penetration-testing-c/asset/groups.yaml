    # CHAPTER 8: The House Doesn''t Always Win: A Wireless Reconnaissance


    > NOTE

    Social Engineering is one of the most effective tools in the arsenal of the penetration
    tester. Whether social engineering on the phone to get a network password,どうか
    infected USB sticks in a lobby, or working your way past a guard, trust is key.
    Radio reconnaissance, as we have shown in this case study, is a great way to gather
    information that can be used to gain trust.


    of equipment. Wire cutters for the fence, carpet to throw over the barbed wire
    if we had to scale it, but it would remain in the trunk, all because the guard
    had to use the restroom, and we were listening to scanner. We parked the car,
    grabbed our bags, and walked right in the employee entrance. We informed the guard
    at the desk by the employee entrance that we were there to complete a job. We
    dropped the name of the dispatcher, asking how she was, and asked her daughter
    Riley was doing. All information we had learned by monitoring the guard channel
    in the scanner. The guard smiled, and handed us visitor badges after we signed
    the visitor log. As we clipped our visitor badges to our shirts, we made the transformation
    from trespasser to authorized visitors, with the credentials to prove it.


    We enjoy picking locks and scaling fences as much as anyone in the security industry,
    but it is much easier to have an authorized person open the gate and unlock the
    door for you. We didn''t have to pick locks or break any doors, we just had to
    take advantage of the knowledge we gathered during reconnaissance. People are
    helpful, no one wants to give a hard working contractor a hard time. Give them
    a reason to trust you, and they will. We walked in.


    # INSIDE


    While inside the casino, we made sure to use an earpiece and monitor the guard
    and local police channels so we would know if we had been detected. It is always
    better to know when the police are coming, so you could be prepared to give them
    your get out of jail free card, and ensure that your hands are clearly visible.
    We wouldn''t need that night, however. What follows isn''t so much about radio
    reconnaissance as it is penetration testing, but demonstrates the rich reward
    that awaited us.


    We found a conference room and sat down. We installed a wireless access point,
    hidden in the ceiling tiles, so we could continue to attack the network from outside.
    We unrolled a length of CAT-5 and plugged our laptop into a wall jack. We knew
    what we were looking for. We targeted the gaming network, security systems, credit
    card processing systems, and the data warehouse-***'
  - '[PAGE 120]


    containing customer information. This casino was ahead of the curve. We knew all
    about convergence, all their physical security devices were on the corporate network.
    Instead of sneaking around, ducking cameras, and hiding in shadows, we just needed
    our laptop on their network.


    We wandered around the limited access areas of the casino, saying hello to other
    contractors and guards as we passed. We tried our visitor badges on various doors,
    and found that they gave us access to jan closets and other low value targets.
    We didn''t attempt near the counting room or any other target that would likely
    have drawn suspicion and blown our cover. Back in the conference room, we gained
    access to the video system. The video system used the default manufacturer password,
    which we knew. Manufacturer default passwords are available on the manufacturer
    Web sites. We learned the guards watched were covered by surveillance and which
    ones weren''t. We knew exactly where the managers were, where the pit bosses were,
    and where the guards were.


    While pilfering through a file share, we found a spreadsheet showing which slot
    machines and electronic games were hot. We could have used information about machines
    with high payout rates to play games and increase our odds. We found a ton of
    customer information too. We had the names, addresses, descriptions, and notes
    on all the high rollers. The publicity from this type of break could cause monetary
    damage to the casino far than cleaning out the counting room. We found information
    on other customers—thousands of. Information would be invaluable to the marketing
    efforts of competing casinos.


    A little later, we heard the door to the conference room open, and saw a large
    angry man standing in the doorway. We knew we had been caught. The man wasn''t
    angry that we were there. He was angry sitting in the conference room when there
    was work to be done. He sternly told us to get back to work, and that he would
    let us slide this time. As he escorted us out of the conference room, pointed
    to an area that needed to be painted, we knew our work was done. We left through
    the door we had entered, said good night to the guard, and went to the hotel to
    sleep.'
