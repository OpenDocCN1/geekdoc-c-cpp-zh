    # Basic Overview of Equipment and How it Works


    In Chapter 2 the basic concept of a scanner was introduced. To review a scanner
    is a radio that stores multiple frequencies in channels, quickly switches between
    the channels, and stops scanning when a channel is active. This chapter will take
    a deeper dive into scanner features and operations, how to select a scanner for
    radio reconnaissance, and accessories that are helpful when performing radio reconnaissance.


    # COMMON SCANNER CONTROLS AND FEATURES


    The best source of information for operating a particular scanner is the owner''s
    manual. That by being said, there are controls and features that are common to
    all scanners available on the new and used market.


    # Channels and Banks


    Channels store the frequencies the scanner searches when it is scanning for radio
    traffic. Most scanners organize channels into banks. For example, a 200-channel
    scanner may have 10 banks of 20 channels each. This can be helpful when you need
    to group services together. A hobbyist may put police in


    > TIP

    It can save time and frustration if you program the few bands with common frequencies.
    For example, the authors use bank 10 for Family Radio Service Channels, bank 9
    for different frequencies, and so on. Lower bands are then used for specific engagements
    and targets. This saves the need to reprogram the higher bands.


