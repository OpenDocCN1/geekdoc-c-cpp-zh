    > 提示：无论你是否在使用无线电对目标进行侦察，在任何物理渗透测试期间，配备一个调到警察频率的扫描仪都是非常有益的。监控警察频率可以让你迅速判断自己是否已被发现，以及警察是否已经被召唤。这样一来，你可以立即联系目标方的络人，并准备好面对警察。当然，各国法律法规对监控警察频率的合法性规定不同，因此在监控警察频率之前，请务必咨询法律顾问。


    在你值班即将结束时，这为渗透测试人员提供了另一个优势。


    在监控无线电流量时，记录下守卫和调度员的名字，并注意守卫使用的术语。这些信息对于社会工程非常有用。知道人们的名字会让你看起来像是自己的人，并让你能够声称某位守卫引导你进入受限区域。说“守卫让我来这儿”的效果不如说“比尔·史密斯让我来这儿”。（当然，假设有一个名叫比尔·史密斯的守卫。）在对话中穿插守卫和其他组织的术语也会让你看起来像是内部内部的，并帮助你获得组织内部人员的信任。


    # 监控电话通话


    请记住，法律上监控电话通信可能是困难的，因此在监控任何电话流量之前，请确保它是合法的，并且你已获得适当的授权。电话中的信息通常比双向无线电更敏感，如果你能够获取电话流量，你可能会学到关于目标组织运营的大量，包括姓名、客户信息和财务数据。信用卡、银行信息、社会安全号、健康信息和其他高度敏感信息通常通过电话传输。如果测试范围允许，在物理渗透测试期间，测试这些流量是否安全应该是首要任务。


    对于渗透测试人员来说，能够监控帮助服务台或呼叫中心的电话可能是“圣杯”，特别是当帮助服务台涉及密码重置时。收集用户名、密码以及组织内部人员的名字可以使渗透测试变得相当简单。听帮助服务台的电话将让你对它以及帮助台如何验证呼叫者的身份以及组织特定的技术术语产生宝贵的见解。


    > 记住，根据定义，犯罪分子不遵守法律。这意味着他们拥有我们专业安全人员不具备的工具和方法。虽然有很多我们可以在不违反法律的情况下无法测试的犯罪方法，但理解犯罪分子所使用的方法和技术仍然至关重要。像犯罪分子一样思考是学习防范犯罪的最好方式。


    DTMF 解码器（在第 7 章中进行了详细描述）是一种能够解码电话按键音并以数字形式显示的设备。在监控电话流量时，这是一个极好的工具，因为它很容易获取语音信箱密码。此外，某些无线电设备使用
    DTMF 代码来传输加密信息。


    # 无线摄像头


    无线摄像头通常出现在布设电缆困难或昂贵的区域。寻找无线摄像头的区域包括楼梯、停车场离主楼最远的部分，以及大型物业的周边区域。


    虽然获取摄像头画面和视图的优势是显而易见的，但研究摄像头本身也可以收集大量信息。对于固定位置的摄像头，确定它们在监控什么应该是简单的。安装在停车场上方灯杆高处的摄像头是为了提供全景，而指向门的摄像头显然是在监控那扇门。


    一旦你获得了无线摄像头的画面，你就会知道守卫能看到什么。注意摄像头的覆盖范围，并寻找在物理渗透期间可以利用的盲点。


    # 云台机（PTZ）摄像头


    PTZ 摄像头变得越来越常见，允许用户或程序远程物理移动摄像头。


    跟踪摄像头的移动，判断摄像头是由人类还是软件控制的。如果是软件控制摄像头，你将看到受控且一致的动作；而如果是人类控制，


    你将看到更多自发的动作。


    > 虽然在观看摄像头画面时很容易走神，但市场上有许多智能视频系统可以检测运动或画面的变化并提醒人类，以便他们进行调查。所有类型的技术的智能视频系统也变得越来越便宜。运动报警功能现在已出现在许多中低视频系统中。


    它，你将看到更多自发的动作。如果摄像头是由软件控制的，那么摄像头画面可能没有被主动监控。相反，如果人类在控制摄像头，几乎可以保证图像正在被仔细观察。


    在晚上查看画面以确定摄像头是否具有夜视功能，以及一天中哪些时间段的光会影响摄像头。注意摄像头的焦距，以及它是宽角还是窄角。查看图像是否提供了可用的细节。通常情况下，摄像头是一种糟糕的侦查控制。在观看空停车场的电视画面时很容易失去焦点。然而，摄像头是犯罪发生后确定发生了什么和收集证据最好的方式之一。作为一种预防性控制，摄像头是有用的，因为它们可能会引导攻击者去往更软的目标。


    # 设备基本概述及其工作原理


    在第 2 章中引入了扫描仪的基本概念。回顾一下，扫描仪是一种在通道中存储多个频率的无线电，它可以在通道之间快速切换，并在通道活动时停止扫描。本章将深入探讨扫描仪的功能和操作、如何为无线电侦察选择扫描仪，以及在执行无线电侦察时有用的配件。


    # 常见控制和功能


    操作特定扫描仪的最佳信息来源是用户手册。尽管如此，市面上所有的扫描仪都有一些通用的控制和功能。


    # 通道与组


    通道存储扫描仪在扫描无线电流量时搜索的频率。大多数扫描仪将通道分为组（Banks）。例如，一个 200 通道的扫描仪可能有 10 个每组 20 通道的组。当你需要将服务组合在一起时，这非常有帮助。如果你对几个常用频率进行编程，业爱好者可能会感到困扰。例如，作者将组
    10 用于家庭无线电服务频道，组 9 用于不同的频率，依此类推。低频段则用于特定的任务和目标。这避免了重新编程高频段的需求。


