    # CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems


    > TIP

    During the offsite profiling stage of your penetration test be sure to check the
    http://www.radioreference.com com database for voice codecs commonly used by your
    target to verify if your scanner can monitor them or research ways to decode the
    traffic


    # APCO P-25


    There are an ever-growing number of digital modulation types used by wireless
    systems. However, currently the only standard that can be decoded by consumer
    grade scanners is the P-25 standard. Other digital modulation types are covered
    in Chapter 9.


    Project (P-25) is an open standard made by the Association of Public-Safety Communications
    Officials (APCO) to promote interoperability between public safety radio systems.
    Many advanced radio features as digital modulation and trunking are proprietary
    features created by manufacturers. These features traditionally did not operate
    with other manufacturers equipment. This often made it difficult to coordinate
    the response to a large-scale disaster requiring multiple agencies or municipalities
    because the radio system used by one city or agency would not be compatible with
    radios used by another city. The APCO P-25 standard was created to overcome these
    interoperability issues. The technical specifications for P-25 can be found in
    the ANSI/TIA-102 series of documents.


    P-25 transmissions can also be encrypted using a variety of standard encryption
    algorithms such as Data Encryption Standard (DES), Triple-DES, or Advanced Encryption
    Standard (AES). A number of NSA generated encryption ciphers are also supported
    as ACCORDIAN, BATON, MAYFLY, Firefly, and SAVILLE. However, few organizations
    implement encryption because of the additional hardware costs, administrative
    overhead of maintaining and distributing encryption keys, and poor reputation
    for performance encrypted radio systems


    The P-25 standard is being deployed in a number of phases. Each phase adds additional
    features. Phase 1 is currently in wide deployment. At the time of


    > NOTE

    Older voice encryption systems had a reputation of degrading the sound quality
    and reliability of a radio system. Although these challenges have been overcome
    by modern day voice encryption systems, many users still avoid encryption because
    of this bad reputation.'
