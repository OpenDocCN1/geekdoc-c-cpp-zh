    # How to Use the Information You Gather


    As organizations become security weaknesses, they tend to (at least attempt to)
    mitigate them. What this means for the penetration tester is that assessments
    would have been fairly easy a few years ago are now far more challenging. Because
    radio traffic is an area where most organizations do not place a focus on security,
    it provides a great resource for gathering intelligence. This is not just theory;
    the authors have used information gathered by profiling radio traffic to increase
    the success of many penetration assessments, as shown by the included case studies.


    # WHO IS GUARDING THE GUARDS?


    The information in this book is especially valuable when the target organization
    has a guard force that uses two-way radios. By listening to radio traffic on the
    guard frequency, it is usually possible to learn the schedule of the guard rounds
    as well as any regular movements. Knowing where the guards are invaluable when
    you wish to avoid them. Knowing the number of guards on duty on any given shift
    will also give you an idea to plan your penetration assessment. Obviously, attempting
    the assessment when the fewest number of guards is on duty is generally best.
    One exception is of course if there are a small number of guards during off hours,
    it still may not be the time as any movement will be abnormal and draw attention.


    Note whether the schedule of the guard shifts is staggered, i.e. not all guards
    change their shift at the same time, If all guards do this can present an opportunity
    that their posts may not be as well guarded or that they are in the middle of
    a shift. Like any of us, guards may be tired and less attentive and diligent


