    a human, allowing them to investigate. As all types of technology smart video
    systems have also gotten cheaper. Being able to alert on motion is a feature now
    found in many low- to mid-level video systems.


    it, you will see more spontaneous movement. If the camera is controlled by software,
    then it is possible that the camera feed is not being actively monitored. Conversely,
    if a human is controlling the camera it can almost be guaranteed that the image
    is being carefully watched.


    View the feed at night to determine if the cameras are night vision capable, and
    also watch to see if there are any times of day that glare makes the camera useless.
    If there is a time when glare is affecting the camera, then there may be a good
    time to attempt physical penetration.


    Note the focal length of the camera, and if it is a wide or narrow angle lens.
    See if the image provides usable detail. It is not uncommon that cameras are placed
    far enough from the target that they do not provide a great deal of information
    to the guard.


    In general, cameras are a poor detective control. It is easy to lose focus while
    watching television, so imagine trying to pay attention while watching the feed
    from a bank of cameras focused on an empty parking lot. Cameras, however, are
    one of the best ways to determine what happened and gather evidence after a crime
    has occurred. As a preventative control, cameras can be useful as they may send
    an attacker on to a softer target.'
