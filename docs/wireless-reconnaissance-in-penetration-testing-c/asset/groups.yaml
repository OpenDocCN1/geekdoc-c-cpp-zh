    ## BUILDING YOU KIT: HELPFUL ACCESSORIES


    ### Antenna Connectors


    Most scanners use either BNC or SMA connectors. When selecting an antenna for
    your scanner make sure you get the appropriate.


    ### Antennas for Handheld Scanners


    Every new handheld scanner will come with an antenna. These antennas usually work
    OK to poor and should be one of the first upgrades when building a wireless tool
    kit.


    **TIP**


    If we had to choose between a cheap radio and a good antenna or a good radio and
    a cheap antenna, the authors of this book would always choose a good antenna.
    A good antenna will pull in signals better so that a cheap radio can hear it.
    However a cheap antenna will make a good radio deaf.


    Also do not confuse the SMA connector on scanners with the reverse-SMA connection
    on some wireless cards. An SMA and a reverse-SMA are not compatible. Figures 7.9
    and 7.10 show what these various connectors look like.


