    数据库中，通道 4 被标记为“安全”（Security）。其他三个通道用于业务。


    带着这些信息，我们到达现场并在扫描仪中编写了四个通道并开始工作。不久后，我们便确认了第 4 通道正被安全人员使用。我们监控了这个通道。无线电杂音确认大门处有守卫驻守，但我们从未从第二个门听到过任何传输。


