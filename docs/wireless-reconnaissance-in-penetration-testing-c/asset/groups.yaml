    It is often useful during onsite reconnaissance to be able to determine the approximate
    frequency of a transmitter by the length of its antenna. Knowing this length will
    help you zero in on the frequency ranges that signals are more likely to be found,
    and decrease the time it takes to determine the exact frequency used by the target.
    The required length of dipole and whip antennas is determined by the following
    equation:


    ```

    Frequency (MHz) = 0.5 × wavelength = length of antenna (in feet)

    ```


    To obtain the length in inches, multiply by 12. For the length in meter, use the
    following equation instead:


    ```

    Frequency (MHz) = 0.5 × wavelength = length of antenna (in meters)

    ```


    Multiply this result by 100 (or simply divide 3/f) to obtain the length in centimeters.


    - Polarity: An antenna''s polarity determines which spatial axis the antenna is
    most responsive in. There are two types of polarity: horizontal and vertical.
    Understanding the polarity of the antenna you are using will help you position
    it properly, to get the maximum gain, and aim it (the design of the antenna necessitates)
    at the transmission source. Antennas with horizontal polarity are sensitive in
    a horizontal plane, and properly deployed the antenna should look like it is laying
    down, like the old style television directional antennas (Figure 2.13) you may
    still see on rooftops. Antennas with vertical polarity should stand vertically,
    as a whip antenna on a FM radio or CB radio. These are also the most common antenna
    for RF scanners.


    To get the best performance from your antenna, you want to match the polarity
    of the transmitting and receiving antenna. For most systems in this book the antenna
    on the receiver should be held vertically to get the performance.


    - Antenna gain: The amount that an antenna increases the signal strength is called
    gain, which is measured in decibels (dB). The decibel scale is logarithmic rather
    than linear, and due to this, just a few dB of gain can make a significant difference.
    As example, the difference in signal strength between a 50W light bulb and a 100W
    light bulb is 3 dB.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_24_0.png)


    # Signal Strength


    There are three basic ways to increase signal strength when receiving a signal:
    amplification, antenna tuning, and antenna orientation. Using an amplifier will
    amplify noise as well, including those you may not want, and may simply result
    in a louder version of the same noisy signal. You can also tune the length of
    the antenna, which can be done by adjusting the length of the antenna, or changing
    to an antenna tuned for the range you are interested in. Finally, using a directional
    antenna that is designed to focus the signal energy can increase the signal strength.


    # Antenna Diagrams


    To understand the reception properties of a given antenna, refer to the antenna
    diagram for the type of antenna. An antenna diagram is a graph, showing the gain
    and radiation pattern an antenna has around it. This is useful for determining
    the characteristics of a directional antenna, or to see how an omnidirectional
    antenna is. No antenna is going to perfectly receive in all directions, so a diagram
    can help you understand the characteristics of the antenna. Antenna diagrams are
    useful for understanding the concept of directional antennas. By studying antenna
    diagrams, you can see the lobes generated by making an antenna directional. This
    is an important concept to understand if you plan to use antennas for direction
    finding.


    # 26 CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems


    > TIP: trying to determine the direction of a signal source, change the orientation
    of the antenna until you find the orientation which allows you to receive the
    signal clearly and strong. As you do, you may see a small jump at a sub-lobe in
    the antenna''s gain field, which has the potential to give the appearance that
    the direction has been found, leading you on a wild goose chase. Knowing the antenna
    diagram for the antenna you''re using will help you to avoid being fooled. Always
    look for the most gain when orienting the antenna toward a signal source.


    # Popular Types of Antennas


    Broadly, antennas can be divided into two groups: directional and omnidirectional.
    There are many different types of antennas—dozens or hundreds, depending on how
    you classify them. This section will focus on the types that are of interest to
    penetration testers wireless reconnaissance.


    # Omnidirectional and Directional Antennas


    Omnidirectional antennas receive signals equally from all directions. Directional
    antennas pull in signals better from one direction. In this direction, they can
    detect a weaker or more distant signal than an equivalent omnidirectional antenna.
    The trade-off is that they do this by decreasing their ability to pull in signals
    from other directions.


    > NOTE: How Omni is? While the prefix omn—implies that the antenna is able to
    receive signals from any direction, technically omnidirectional antennas are usually
    only omnidirectional in a single plane. For example, depending on its orientation,
    an omnidirectional antenna may detect signals to the North, South, East, and West,
    but not above or below.


    > NOTE: The difference in signal strength achieved by an antenna is known as gain,
    which is measured in decibels (dB). Directional antennas adjust the gain pattern
    to better receive signals from a specific direction. A well-designed omnidirectional
    antenna can also provide gain at specific frequencies the antenna is tuned to.


    Directional antennas have both positive and negative gain, depending on which
    direction you are looking at the antenna. This is mapped out in antenna diagrams.


    # Types of Omnidirectional Antennas


    - Discone: Discone antennas are broadband antennas (able to receive a wide range
    of frequencies) that are generally base mounted. There are a few commercial discone
    antennas available for handheld radios, the most popular of which are tuned for
    cellular phone frequencies. antennas can be designed and built to be sensitive
    across a wider range of frequencies than other types of antennas.

    - Whip: A very common type of omnidirectional antenna is the whip antenna (Figure
    2.14). Typical scanners come with a whip antenna. These antennas are usually so
    inefficient that they have no gain, however this


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_26_0.png)


    **FIGURE 2.14** Whip Antenna, Reprinted with Permission from Meagan Call


    # CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems


    is a sacrifice made to allow the antenna to cover a wide frequency range. This
    wide range also means that it is also possible that the antenna will have a negative
    gain on certain frequencies. Usually, they are made to operate on a specific frequency
    largely based on the length of the antenna. Telescoping whips can be tuned to
    a variety of frequencies based on how much the antenna is extended.


    - Dipole: Antenna made up of two wires connected in a straight line. One wire
    connects to the radio and other wire connects to group. Usually made to operate
    on a specific frequency. Commonly used as a base antenna. The biggest advantage
    to dipole antennas is they are a very simple design and so are cheap to make.
    Additionally because they are a simple design they are very easy to make at home
    and are usually the home-brewed antenna people make.


    # Types of Directional Antennas


    - Yagi: This is the familiar roof antenna used for television reception (Figure
    2.15), which were a common sight in the golden age of NTSC broadcast, before cable
    and satellite television caught on and eventually replaced it. It consists of
    a central spine with numerous "ribs" of various lengths sticking out laterally.


    - Panel and wave guide: These types of directional antennas (Figure 2.16) which
    may be familiar to penetration testers from attacking wireless


