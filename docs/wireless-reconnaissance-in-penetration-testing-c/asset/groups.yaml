    ## 第 8 章 122：赌场并不总是赢：无线侦察


    ## 注意事项


    定期提醒使用无线电台的人员是一个好主意，他们在无线电台中说的每一句话，任何任何带有扫描仪的人都能听到。事实上，你通常不需要扫描仪就能收听紧急调度频率。诸如
    5-0 Radio 类似的手机应用程序允许用户收听全球范围内的扫描仪通道。在监控公共频道时，我们经常听到一些可能会让使用无线电台的人员感到尴尬的讨论，而且，我们确实有大量信息泄露。当然，无线电流量可以被加密以保护通信隐私，但在现实中，极少数机构或企业会对无线电流量进行加密。


    随着时间推移，赌场的人群开始散去，我们决定是时候结束这一天，回酒店休息了。没有了人群，我们开始在停车场行动，不想在还没开始之前被发现。当然，我们本会担心在赌场停车场时被发现，本可以找一个不那么显眼的地方停车，比如附近的某家商店或酒店。在酒店里，我们做了记录，并讨论了第二天的计划。满怀期待地，我们上床休息了。


    ## 华丽与魅力


    前一天晚上，我们注意了赌场客人的着装倾向。大多数人看起来很休闲，所以我们确定要模仿这种风格。如果我们是在一家高端赌场，我们可能会穿得像豪客。记住，打扮得得体且不显得突兀更好。我们停好车，穿过停车场，从正门进入。我们留意了作为紧急出口的保安站以及标有“员工”字样的门。我们在几台分币老虎机前前坐下，把装有
    Scout（侦测器）的背包放在旁边的地上，开始拉摇杆。我们在老虎机上没有大赢，但当一名保安走过时，我们注意到他携带着一台摩托罗拉 HT Pro 系列无线电台，很可能是
    GP-338。这些无线电台工作在 29.7–42、136–174 和 403–407 MHz 频率，且不支持加密或组频。有了这些信息，我们笑了，因为知道只要能找到它们的频率，就可以监控这些无线电台。保安使用的无线电台配有
    4 英长的天线，这表明它们工作在 136–174 或可能的 403–407 MHz 范围内。我们离开老虎机，在赌场中闲逛，背包里的 Scout 正在工作。我们在赌场自助餐区待了整整一小时，把
    14.95 美元的自助餐吃回每一分钱的价值。这只是工作的另一项福利。


    填饱了肚子后，我们回到车上，开始从 Scout 中提取频率。我们专注于我们认为他们可能工作的 136–174 和 403–407 MHz 范围。我们将这组小频率频率编程到我们的扫描仪中并开始监控。没多久，我们就找到了赌场保安使用的频率。


    ## 赌博时刻到了


    ## 注意事项


    虽然不一定像好莱坞电影描述的那样，但赌场不是在开玩笑的。他们一直在寻找作弊者和窃偷，只要你在赌场里，就可以安全地假设自己正处于闭路电视监控之下。前一天晚上，我们注意到许多保镖背着背包，因此知道我们也可以背一个背包而不会引起太多怀疑。任务需要的话，我们本可以使用腰包或其他方法隐藏我们的
    Scout。只需知道，如果你在赌场里被发现带有电子设备，你会有一些解释要做的。就像任何其他渗透测试一样，知道什么让你融入环境，什么会引起怀疑。


    ## 学习当地俚语


    在接下来的几个小时里，我们对赌场以及它的保护措施有了深入了解。除了聊天（咖啡凉了，我的团队输掉了垒垒球赛），我们还听到保安开始和结束轮班。我们学习了保安的名字和昵号、他们的班表和值守位置，以及赌场使用的各种术语。当时已经是下午早些时候，就无线电侦察而言，我们已经拥有了所需的一切。我们回到酒店休息并重新整顿。


    ## 赌博时刻到了


    我们制定了计划，决定装成建筑承包商并尝试从员工入口进入。我们知道必须表现得像像，新衣服是不行行的。我们找到一家当地的二手店，购买了一些看起来像有施工污渍的工装裤和衬衫。在吃完简单的便晚餐并短睡了一会儿后，我们离开酒店，在凌晨
    2 点后不久开车来到赌场停车场，我们注意到承包商们正来上班。我们坐在车里，喝着咖啡，等待我们的机会。没多久，我们就听到员工停车场的保安向调度员恳求离开岗位，以便他去洗手间。随着保安的请求变得越来越绝望，而当时没有替补人员，调度员最终妥协了。她告诉他快点，不需要替补人员，因为他“只需要一分钟”。一分钟就是我们需要的。我们迅速开车通过无人看守的大门，进入员工停车场。我们知道大门被监控摄像头覆盖，但我们决定放一把赌。后备箱装满了东西。


