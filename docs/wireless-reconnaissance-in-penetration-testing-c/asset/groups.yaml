    > Antennas are sensitive to all metallic objects in the nearby area. Moving an
    antenna often has a dramatic effect on reception. This is especially true in high-metal
    cubicle frames, inside buildings, hotel rooms, and the like. If using radio equipment
    while in a vehicle, simply moving the car a few inches may be enough to improve
    the reception. Of course sometimes, you will need to find another location altogether
    to get a clear signal.


    > Some antennas require a ground plane to function properly and get the best possible
    signal. The owner''s manual or technical specifications for the antenna should
    state if a ground plan is required, recommended, or not needed. If a ground plane
    is needed, it can be created by placing the antenna on a large piece of metal.
    If indoors, a filing cabinet is a good option, and if outdoors, use the roof or
    hood of a vehicle (unless course the body is fiberglass or plastic).


    802.11 networks. The "antenna," an inexpensive hardware hack involving a Pringle
    potato chip can, was a well-known example of this type of antenna, which happened
    to have dimensions and materials suitable for picking up Wi-Fi signals. They are
    not of much use in the frequency ranges usually covered by radio recon (below
    1 GHz).


    # MODULATION


    Modulation is the method used to encode voice or data that is transmitted by a
    radio. Broadly speaking, modulation may be classified as analog or digital. Analog
    is the older of the two, but digital is already well established, and continues
    to expand its share of the market, due to its numerous advantages. Digital formats
    offer higher audio quality and data to be sent more reliably, can use data compression,
    and sharing of the media, which allows for greater transmitter density, and more
    users of a given frequency in a given area.


    To properly listen to a signal, it is necessary for the transmitter and receiver
    to use the same modulation type. On some scanners, the modulation type is called
    the mode.


    # Analog Modulation


    While most people are familiar with Amplitude Modulation and Frequency Modulation
    (AM and FM), there are many other modes in which different radios operate. FM
    is the most common mode of modulation in the United States that is of interest
    to penetration testing, but it is good to know and understand the other modes.


    # Common Analog Modulation Types


    - AM—Amplitude Modulated: The strength (amplitude) of the radio wave is varied
    to encode the information into the carrier wave. Used between frequencies below
    30MHz, for shortwave radio transmissions, in the commercial AM band, and for aircraft
    communications such as aircraft-to-aircraft or aircraft-to-tower.

    - FM—Frequency Modulated: The frequency of the carrier wave is changed to encode
    information into the radio wave.

    - Narrow (FMN) is commonly used by two-way radio systems. It is designed to transmit
    low audio fidelity signals and takes up less bandwidth than the FM Wide (FMW)
    modulation (see below), which is used by broadcast FM stations and is discussed
    next. FMN is the most popular format for the focus of this book. With the exception
    of AM being used by aircraft, FMN is used for all two-way voice traffic transmitted
    over frequencies over 30MHz.

    - FM Wide (FMW) is used by commercial FM Broadcasters because it can transmit
    a higher fidelity signal than FMN. This increase in audio fidelity comes at a
    price and FMW takes up more bandwidth than FMN.

    - SSB—Single Sideband: This type of modulation is generally only used with shortwave
    frequencies below 30MHz, because it makes better use of bandwidth. It is used
    for two-way communications, typically applications like radio and ship-to-ship
    communications. Broadcast shortwave and AM radio stations do not use SSB because
    it requires a more complex radio which can be more difficult for the end user
    to tune.


    # Modulation


    > TIP

    If you are planning on obtaining a radio that covers shortwave bands, consider
    getting one that supports single sideband so you can listen to more than just
    commercial shortwave.


    # Digital Modulation


    Digital modulation types are becoming more and more common as people look for
    new ways to conserve bandwidth. Thanks to data compression algorithms, a digital
    signal carrying voice data can take up less RF bandwidth than an analog signal.
    Digital can be higher quality for voice traffic, as well. This is due to error
    checking, which keeps the 1s and 0s of the digital stream preserved and automatically
    corrected within limits. A distorted analog signal, by contrast, cannot be corrected
    this way at the receiving end, and therefore will sound distorted. However, this
    comes with a trade-off. A badly distorted analog signal may still be demodulated
    and less discernible, and a good ear can make intelligible speech through the
    static and distortion. With a digitally modulated signal, if the distortion is
    too great, the error correcting cannot restore the signal, and if a packet cannot
    be demodulated, it gets dropped, resulting in codecs of the voice. Once you get
    dropped packets, you lose all voice traffic.


    Currently, the great challenge with digital modulation is finding a radio or software
    that is able to decode it. The situation that exists today is similar to the "code
    hell" issue that drove users crazy number of years ago when trying to watch videos
    downloaded from the Internet. Each video file was encoded with one of dozens of
    custom codecs. In order to decode the video data, you need the right code to watch
    the video, which was not included with the video file itself, and had to be downloaded
    and installed separately. Without any automated means of finding and installing
    the codec, it could take a great deal of searching to find a web site that offered
    the codec for free download. Until just a few years ago, many video codecs in
    use were open license—and patent-encumbered, and had to be purchased in order
    to be used legally.


    With digital radio demodulation, it''s more of a proprietary modulation not being
    made for scanners. Many manufacturers have developed their own method of modulation
    and consider it a trade secret that confers an advantage if they keep it to themselves,
    forcing customers to buy from them. Oftimes, the only way to demodulate a signal,
    other than with the proprietary radio that supports the format, is a time-consuming
    reverse-engineering effort.


    > TIP

    During the offsite profiling stage of your penetration test be sure to check the
    http://www.radioreference.com database for voice codecs commonly used by your
    target to verify if your scanner can monitor them or research ways to decode the
    traffic.


    # APCO P-25


    There are an ever-growing number of digital modulation types used by wireless
    systems. However, currently the only standard that can be decoded by consumer
    grade scanners is the P-25 standard. Other digital modulation types are covered
    in Chapter 9.


    Project (P-25) is an open standard made by the Association of Public-Safety Communications
    Officials (APCO) to promote interoperability between public safety radio systems.
    Many advanced radio features as digital modulation and trunking are proprietary
    features created by manufacturers. These features traditionally did not operate
    with other manufacturers equipment. This often made it difficult to coordinate
    the response to a large-scale disaster requiring multiple agencies or municipalities
    because the radio system used by one city or agency would not be compatible with
    radios used by another city. The APCO P-25 standard was created to overcome these
    interoperability issues. The technical specifications for P-25 can be found in
    the ANSI/TIA-102 series of documents.


    P-25 transmissions can also be encrypted using a variety of standard encryption
    algorithms such as Data Encryption Standard (DES), Triple-DES, or Advanced Encryption
    Standard (AES). A number of NSA generated encryption ciphers are also supported
    as ACCORDIAN, BATON, MAYFLY, Firefly, and SAVILLE. However, few organizations
    implement encryption because of the additional hardware costs, administrative
    overhead of maintaining and distributing encryption keys, and poor reputation
    for performance encrypted radio systems


    The P-25 standard is being deployed in a number of phases. Each phase adds additional
    features. Phase 1 is currently in wide deployment. At the time of


    > NOTE

    Older voice encryption systems had a reputation of degrading the sound quality
    and reliability of a radio system. Although these challenges have been overcome
    by modern day voice encryption systems, many users still avoid encryption because
    of this bad reputation.

