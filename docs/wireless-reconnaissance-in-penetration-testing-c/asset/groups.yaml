    ## USING A FREQUENCY COUNTER


    A portable frequency counter (Figure 5.2) is one of the most valuable pieces of
    equipment for onsite profiling. They work by counting the number of beats, or
    oscillations in the airwaves of a period of time, giving the frequency of those
    oscillations and thus the transmission frequency. An important caveat is that
    if there are multiple transmission frequencies in the vicinity, the frequency
    counter will give false data as it will likely combine the oscillations and give
    an inaccurate frequency count. Frequency counters work best counting a single
    signal in a low noise environment, as they need a signal that is high enough over
    the noise floor that the counter can separate that signal from the background
    noise and only count that. The frequency counter will display the "near field"
    signal, which must be approximately 10–15 times as strong as other signals in
    the area, and the closer the frequency counter is physically to the signal, the
    better the chance that the frequency counter will be effective. It is becoming
    more and more difficult to find a place where single signal is in a low noise
    area, as today’s world is extremely RF-rich environment. With the proliferation
    of wireless phones and the wireless network towers, it can be a challenge for
    the frequency counter to lock onto a signal. This is especially difficult in a
    signal urban area or where there are multiple transmitters in a single tower.
    Additionally, commercial radio, pager, television, and emergency dispatch towers
    can cause havoc for the frequency counter. This makes sense, as radio, television,
    and emergency dispatch towers must have the power to broadcast over a geographically
    large area, while only the two-way radio transmitters used by many organizations
    must only blanket a comparatively small area.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_63_0.png


    The law of inverse squares means the closer you are to a signal, the stronger
    the signal will be. It should, of course, be obvious that a handheld frequency
    counter will generally allow you to get fairly close to the signal source. This
    is especially true when you have access to the interior of the facility that is
    being targeted.


    For penetration testers we recommend an Optoelectronic Scout frequency counter
    (Figure 5.4). The Scout has many advantages over a normal frequency counter, and
    the extra features are very useful for a penetration tester. The Scout can hold
    multiple frequencies as well as hits per frequency, and the frequencies can be
    downloaded to a computer for easy analysis. This can be a huge time-saver, as
    reading frequencies from a frequency counter screen and entering them into a computer
    can be a real headache. The Scout also offers reaction tuning, which means that
    it can automatically tune a compatible scanner to a frequency seen by the Scout.
    While this has usefulness, we have found that in some situations it can be helpful
    and save time. For example, if once onsite there is not enough time for profiling,
    and reaction tuning may allow you to quickly monitor signals in the area. This
    is no substitute for profiling, it is a good had hack if needed. Additionally,
    if the budget allows it, an extra scanner doing reaction tuning during an assessment
    can be a great way to catch frequencies missing during the onsite and offsite
    profiling.


    What is most useful as far the Scout, however, its small size and portability.
    The Scout can be in a backpack or worn on a belt under a coat, which is helpful
    in situations where discretion is necessary. Being removed and replacing a frequency
    counter from a backpack or coat is suspicious and can draw unwanted attention
    during a penetration assessment.


    The Optoelectronic Scout comes in both analog (Figure 5.4) versions. The digital
    version, as you might suspect, is designed to find the frequencies of a radio
    operating in a digital mode, which we have found to be of limited use during penetration
    assessments. Additionally, the digital mode tends to be finicky outside of a lab
    environment. The analog version, is a great piece of equipment and we highly recommend
    it.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_64_0.png


    FIGURE 5.2 Optoelectronics Cub Portable Frequency Counter, printed with Permission
    from Optoelectronics, Inc.


    ## TIP


    WINRADIO, Optoelectronics, and others make filters to remove common strong frequency
    ranges as the commercial FM broadcast band and page broadcast bands. These can
    be put between the antenna and a frequency counter to filter out these strong
    signals. The WINRADIO WR-UBF-1800 filters can be configured to block broadcast
    AM as well as broadcast FM signals. The Optoelectronics N100 FM Notch Filter (Figure
    5.3) blocks the FM broadcast band and is designed to fit inline between the antenna
    and the frequency counter and requires not additional cables. This makes the N100
    ideal for mobile handheld operations. Unfortunately for the penetration tester,
    TV stations cover such a wide range of frequencies they do not offer a filter
    to remove these strong signals. However, a tunable notch filter (a filter used
    to eliminate limited ranges of frequencies based based around a central frequency)
    can also be used to prevent a single strong frequency from interfering with a
    frequency counter.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_64_1.png


    FIGURE 5.3 Optoelectronics N100 FM Notch Filter, printed with Permission from
    Optoelectronics, Inc.


    ## TIP


    Sweeping for bugs? A common trick used when sweeping bugs is to take a footprint
    of the frequencies that are present in a room or around 100ft from the area to
    be swept for bugs, and then take a footprint of the frequencies in the area to
    be swept for bugs. Anything that is actually transmitting in the area you are
    sweeping, if transmitting at very low power, will appear much stronger due to
    the law of inverse squares.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_65_0.png


    **FIGURE 5.4** Optoelectronics Analog Scout, Reprinted with Permission from Optoelectronics,
    Inc..


