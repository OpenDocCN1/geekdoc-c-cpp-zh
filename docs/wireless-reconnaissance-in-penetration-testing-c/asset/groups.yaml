    Frequency Oscillator). The frequency created by the VFO changes in proportion
    to the frequency radio is tuned to. This occurs when radio waves from the local
    oscillator and tuner are combined they exit the mixer at the IF frequency. If
    the VFO did not change frequencies, the IF produced by the mixer would change
    the tuner.


    - 5. Demodulator: The demodulator extracts information carried by the radio wave,
    and (usually) converts it to an audio wave. For example, an FM radio uses an demodulator
    to extract the information needed to reconstruct the radio station is broadcasting.
    There are many types of modulation and demodulation. Other types will be covered
    later in this chapter.


