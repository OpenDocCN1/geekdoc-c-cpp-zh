    # Applying the Science: Radio Technology Basics


    # BIRDIES


    "Birds" are spurious signals and harmonics produced by the radio circuits. This
    is internal RF noise generated by the radio itself. Birdies make it appear like
    a signal is present where really is not. A birdie will either be a signal that
    is silent, or sound like static: To tell you if you have tuned to your scanner,
    remove the antenna. If the signal is still there, it is a birdie.


    Most scanners list the birdie frequencies for their radio. It is still good to
    verify this list, because new birds could appear depending on slight difference
    in the manufacturing process. To find the birds, take the antenna off your scanner
    and search all the frequencies it can.


    If you are unsure, put the antenna back. On attaching the antenna pulls in a strong
    signal, like a local pager tower, FM broadcaster, or TV station, then it is not
    a birdie—just a strong signal enough to recognize without the antenna.


    Since you''re going through the identifying of them, keep a list of these birds
    for future references.


    When you set up your scanner for new signals (in the onsite profiling chapter),
    you can consult the list to see if the signal you got was a birdie or not. Some
    people lock out the birds they are ignored during searches. It''s entirely possible
    for a real signal to be transmitted at a frequency that happens to be a birdie
    frequency of your scanner! Blocking out the birds cause you to miss a signal if
    it is on that frequency. Because of this, we do not recommend locking out the
    birds until you''ve determined that the signals are indeed originating from your
    scanner.


    Thanks to technological advances with equipment, finding a list of birds is not
    required as much these days. If you have a triple conversion scanner, the number
    of birds will be minimal. This is more important, but still critical, on older
    double conversion radios.


