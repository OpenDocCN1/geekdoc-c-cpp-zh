    # Preface


    Radio waves surround us and more and more devices are being made wireless. Most
    penetration testers focus only on the very small portion of the radio spectrum
    using 802.11 and Bluetooth devices. Physical penetration tests often miss guard
    radios, wireless headsets, wireless cameras, and many other radio devices commonly
    used in the modern corporation. These systems transmit a wealth of information
    derived from performing attackers in a targeted attack.


    This book aims to educate penetration testers on how to find these often ignored
    radios and mine them for information. The following chapters include information
    derived from choosing the best equipment to use and how to find frequency information,
    to actual case studies demonstrating how this information has been used during
    penetration tests. The authors draw on a combined knowledge derived from performing
    hundreds of penetration tests and decades of radio experience to share tips, tricks
    and helpful notes about this less explored avenue of attack. This book is the
    definitive resource for anyone interested in adding radio profiling to his or
    her arsenal of penetration testing tools.


    The book is also a great resource for those who need to defend systems and companies.
    Like penetration testers, defenders often ignore wireless traffic outside of 802.11.
    This book shows various radios that might be deployed in various environments
    and how attackers could exploit the information leaked by these systems. Essential
    information on how to prevent this leakage from occurring is also included.


    # HOW THIS BOOK IS ORGANIZED


    The best way to read this book is in the order it''s presented, but the chapters
    are structured to assist the reader she decide to read out of order. When key
    concepts are mentioned which were covered in earlier chapters, the page will reference
    the earlier chapter so the reader can flip back if he needs a refresher or is
    reading the chapters out of order. A glossary is also included at the end of the
    book to help with unfamiliar terms.'
  - '[PAGE 152]


    # Chapter 1: Why Radio Profiling?


    In the first chapter of the book the reader will learn what radio reconnaissance
    is and how it is useful during penetration tests. The chapter concludes with a
    short case study of radio reconnaissance used during a physical penetration test
    at a power company.


    # Chapter 2: Basic Radio Theory and Introduction to Radio Systems


    In Chapter 2 the reader will learn the theory behind how radios work and gain
    an introduction to the different radios systems you will encounter while performing
    radio reconnaissance. The chapter starts by discussing basic radio theory. The
    authors cover the terminology needed to understand underlying concepts, give an
    overview of the radio spectrum and discuss how radio waves behave at different
    frequencies. Next, they cover how a radio works and the different components found
    in a radio receiver. After the reader learns how radios work, she will read about
    most important part of radio: the antenna. This part of the chapter starts by
    covering antenna theory and wraps up with a discussion of the most common types
    of antennas one encounter while performing radio reconnaissance during a penetration
    test. After antennas are discussed, the chapter moves on the different ways radios
    encode data (modulation types). This section covers analog, digital and spread
    spectrum modulation types. Next is a rundown of the different types of most commonly
    used radio systems. starts by discussing simple duplex radio systems, expands
    to cover repeaters, and concludes with an explanation of trunked radio systems.
    The chapter ends with recommendations on where to learn about radios and radio
    theory.


    # Chapter 3: Targets


    In Chapter 3 the reader will learn about some of the different types of targets
    which could be searched for radio reconnaissance. Highlighted targets include
    guard radios, cordless phones and video cameras.


    # Chapter 4: Offsite Profiling


    The Offsite Profiling chapter covers how to gather as much information as possible
    on a client''s radio systems before arriving onsite. The authors suggest terms
    to use in online searches, how to search the FCC license database, and specialty
    websites that can be used to gather more information on the client''s equipment.
    The chapter concludes with a case study covering the offsite profiling performed
    before a physical penetration test of a ship dock and how the information was
    used during the attack.'
- md: '

    ## Chapter 5: On Site Radio Profiling


    Chapter 5 continues on the next step on a penetration test and covers information
    that can be gathered on a target''s radio systems onsite. The chapter starts out
    radio related items to keep an eye open for while onsite and what a penetration
    tester can learn from these items. Next chapter explores frequency counters and
    how to use one while profiling a target. Next the reader learns what can be discovered
    by looking at a targets radio systems and antennas. The authors discuss what can
    be learned about the make, model and type of radio used and how to estimate the
    frequency range, off of the radio''s antenna. Finally, this chapter also includes
    common frequencies and frequency ranges to search onsite. The chapter concludes
    with a case study of intercepting wireless headsets used at an insurance company
    and the information provided about the company''s internal network.


    ## Chapter 6: How to Use the Information You Gather


    In this chapter the reader will learn how to use the information gathered monitoring
    the targets systems. It includes specific advice on using the information gathered
    from guard radios, wireless headsets and phones and wireless cameras.


    ## Chapter 7: Basic Overview of Equipment and How it Works


    Chapter 2 explored the scanner and how it works. In Chapter 7 the authors cover
    the common controls and features found on scanners and how to operate them. Next
    the book explains how to select a scanner for wireless reconnaissance and provides
    recommendations on scanners to use for wireless reconnaissance. After recommending
    specific radios the authors also discuss and recommend the antennas which they
    have found the most valuable over the years. The authors conclude this chapter
    by discussing accessories the reader may want to add to their wireless kit for
    radio reconnaissance.


    ## Chapter 8: The House Doesn''t Always Win: A Wireless Reconnaissance Case Study


    Chapter 8 is a case study that pulls together the information provided in the
    book. During this case the authors outline how wireless reconnaissance was invaluable
    during a physical penetration test on a casino. They start out by showing offsite
    profiling using the techniques discussed in Chapter 4. Next they tell how they
    used the offsite and expanded it using the onsite profiling techniques discussed
    in Chapter 5. Throughout this case study, the reader will see firsthand how the
    information gathered by monitoring the casino’s radio systems was key to the successful
    penetration of this high value target.


    ## Chapter 9: New Technology


    During Chapter 9 the reader will learn where the world of wireless reconnaissance
    and penetration testing are heading. The authors discuss the shift to digital
    transmissions, the challenge this presents to penetration testers and some ways
    to overcome these challenges. Next they talk about Software Defined Radios and
    how this technology will bring about a new golden age of wireless hacking. In
    this section the reader will learn what a software defined radio is, common commercial
    and open source software defined radios and examples on how they can be used.
    Next the book covers the trend of VOIP enabling radio dispatch systems. This section
    includes a case study showing the security problems seen by the authors in VOIP
    enabled dispatch systems. The chapter ends with recommendations on resources to
    keep up to date on scanners, wireless reconnaissance, and wireless security.


    ## Glossary


    ### A


    **Active Antenna**: Describes a high gain antenna that is short in length. These
    are useful where space is at a premium and commonly used on shortwave frequencies
    below 30 MHz.

    **ADC**: Analog to Digital Converter.

    **AGC**: Automatic gain control.

    **AM; Amplitude Modulation**: Varying, by modulation, the transmitter power output
    in line with the modulating audio signal variation.

    **Amplification**: The process by which the strength of a signal is increased.
    Both radio and audio signals can be amplified.

    **Attenuator**: Circuit that reduces sensitivity in fixed steps. These fixed steps
    are measured in decibels.

    **Attention**: Blocking radio waves.

    **Attenuation Coefficient**: The amount of power absorbed by a dielectric. A low
    attenuation coefficient will allow radio waves to pass through the material.


    ### B


    **Band Pass Filter**: Filter that allows specified ranges of frequencies through,
    rejecting those that are not within the specified range. Usually constructed by
    combining a high pass and low pass filter.

    **Bandwidth**: The frequency space which is occupied by a radio signal.

    **Bank**: A scanner is a way to organize channels. They allow for grouping of
    channels into logical banks.

    **Baud**: Measured in bits per second, the rate data transmitted.

    **Beam Antenna**: Antenna, used outdoors, that receives from a certain direction.

    **Beat Frequency Oscillator, BFO**: Circuit in a receiver that enables reception
    of SSB signals by generating a replacement carrier.

    **BCB**: See Broadcast Band.

    **Bird**: Birds are spurious signals created by the internal electronics in a
    scanner. These signals have no noise or static however will stop the scanner in
    its search mode. The scanner can have four or five birds.

    **BNC**: Common antenna connector which locks in place by being twisted.

    **Broadcast Band, BCB**: Also known as AM, BCB is the frequency range from 540
    and 1700 kHz. This is the AM band on your car radio.


    ### C


    **Carrier**: A radio transmitter''s unmodulated output.

    **Center Frequency**: In an FM transmitter, the unmodulated carrier frequency.

    **Channel**: Frequency when radio transmission occurs. May also describe the input
    and output frequencies of a repeater or the location where a frequency is stored
    in a scanner''s memory.

    **Coaxial cable, Coax**: An electrical cable specifically designed to transmit
    RF energy. In a coax the inner conductor surrounded by a flexible insulating layer
    is then surrounded by a tubular conducting shield. Invented in 1880.

    **Coherence Interference**: When frequencies adjacent to the signal cause undesired
    interference.

    **Communications Act of 1934**: The Communications Act of 1934 combined and organized
    federal regulation of telephone, radio, and communications. The Act created the
    Federal Communications Commission (FCC) to oversee these.

    **Conductor**: Matter that transfers electrical waves.

    **Coordinated Universal Time**: Previously Known as Greenwich Mean time.

    **Counter**: Frequency Counter.

    **Critical Angle**: The angle at which radio signals reflect in the Earth''s ionosphere.
    Lower angles allow for greater distance of travel.

    **CTSS**: Continuous Tone-Doded System (CTSS) also known as tone squel is designed
    to allow users on a shared frequency to hear only users in their group. Each group
    is assigned its tone and the radio only plays to the audio when the tone is transmitted.

    **Cutoff Frequency**: The frequency at a filter rejects signals.


    ### D


    **D-layer**: Approximately 25 miles above Earth''s surface, the D-Layer is the
    lowest region of the Ionosphere. The D-Layer absorbs signals passing through it.
    The D-Layer disappears sooner after sunset, and on short days may not form.

    **DAC**: Analog to Digital Converter

    **dB**: A measurement of sound defined by a logarithmic scale between power levels.
    3 decibel is equivalent to double the power, while 20 dB increase 100 times the
    power.

    **DCS**: Digital Coded Squel. Digital version of CTSS.

    **Dead Zone**: Area where reception of a signal is not possible due to difficulties
    in propagation.

    **DECT**: Enhanced Coded Telecommunications is a digital standards used by cordless
    telephones.

    **Delay**: The time for which a scanner passes after a transmission ends moving
    on to the next channel.

    **Dielectric**: Matter that insulates radio waves.

    **Dipole**: Antenna made of two wires connected in a straight line. One wire connects
    to the radio and other wires connect to group. Used to operate on a specific frequency.
    Commonly used as base antenna.

    **Discone**: An omnidirectional, vertically polarized antenna with a disc shape.
    Discone antennas are broadband antennas (able to receive a wide range of frequencies)
    that are generally mounted.

    **Discriminator Output**: Provides access to the unfiltered audio signal from
    a radio. This is often required to decode data signals at 1200 Baud.

    **Direct Communication**: Communication between stations without using a repeater.

    **Direct Wave**: Radio signal propagated by line of sight.

    **Drift**: General frequency change in a transmitter or receiver. Commonly occurs
    when the temperature of a radio changes.

