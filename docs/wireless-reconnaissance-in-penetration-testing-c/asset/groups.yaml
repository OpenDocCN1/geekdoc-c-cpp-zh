    # Common Cordless Phone and Headset Ranges


    Cordless phone and headsets commonly operate on the ranges shown in the cordless
    phone and headset ranges chart. It is especially important to ensure that profiling
    these communication devices is within scope and legal. It is rare to find equipment
    operating in the 43.7–50MHz range, however the authors have seen it in use in
    a datacenter cordless phone during a previous penetration assessment.


    Cordless Phone and Headset Ranges


    | 43.7–50MHz |

    | 902–928MHz |

    | 2400–2483.5MHz (usually digital) |


    # SCANNER TIPS


    Prior to going onsite, it is helpful to enter the FRS, GMRS, MURS, Dot frequencies,
    and cordless phone and headset ranges into banks on your scanner to make it easier
    to scan the channels. If the scanner supports banks of multiple sizes, each service
    can be its own bank. When a frequency range is common, we will often put them
    in the higher banks, and use the lower banks for frequencies specific to the target.


    # FINDING TRUNKED SYSTEMS


    Trunked systems present a unique set of challenges, however they are generally
    used by Government entities (Local, State, and Federal), Utilities, educational
    institutions, and other large organizations and corporations. In larger cities,
    we will also likely encounter companies that lease a talk group on a trunk system
    run by a third party in the area. In the best case scenario, we discovered the
    trunking information during the ofthe reconnaissance, manually finding and mapping
    trunked systems can be extremely consuming and very challenging. However, this,
    does not mean that it is not possible. Some trunked systems will only require
    you to find the control frequency to be able to monitor traffic, while other systems
    will require you to map all frequencies in the system. If you are using a scanner
    that supports Control Channel Only trunking and are targeting a capable trunked
    system, you will only need to program the control channel into the scanner to
    monitor the trunked system. Unfortunately for the penetration tester, only Motorola
    trunked systems support this.


    Regardless of the type of trunked system you are targeting, it will be necessary
    to come up with a talk group mapping so you can separate the different'
