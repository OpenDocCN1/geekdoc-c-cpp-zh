    ## CHAPTER 1: Why Radio Profiling?


    well—not this particular lock of course, but the make and model. It took us under
    a minute to pick it and gain access to the building. Breaching the perimeter and
    gaining access to the main facility was our proof of concept and ended this portion
    of the assessment. But while we were shivering outside, a second team was taking
    another avenue to compromise the company, and what they found once they were inside
    let us know what we could have found inside the building.


    People are naturally trusting. And they usually want to help. The second team
    drove right up to the guard gate, and used a technique more effective than ramming
    the fence at full speed: conversation. The team told the guard that they were
    there to fix a network issue. The guard asked for their names and what company
    they were. We gave them their real names, and made up a company name. The guard
    diligently printed our names and made company visitor badges, and was even kind
    enough to direct us to the building that houses the computer room. Exit the car,
    the team walked through an unlocked door, up a few stairs, and found another unlocked
    door. Behind this door was what we had come for, the server room neatly and carefully
    labeled by the company''s IT staff. The backbone of the network. The life safety
    systems. The financial accounting systems. We added an administrative account
    to a few machines using a password and username that was on the bulletin board,
    pinned right to a poster advertising the importance of maintaining confidentiality.
    While this case may not seem to have much to do with radio, aside from the fact
    that the teams used them to communicate, radio turned out to be the difference
    between success and failure on this penetration test. Before coming onsite we
    found the frequency used by the company guard force by using a search engine and
    scouring radio hobbyist Web sites. While this may seem like a small detail, it
    allowed us to monitor the guard communications, and slip off as soon as they realized
    something was amiss. Had we not been monitoring the communications, we would likely
    have been caught and the penetration test would be considered a failure by the
    client. Instead, we were able to add another successful breach to our history.
    In this book you''ll learn the tools and techniques we used to discover the frequencies
    the guards used and monitor them.


    ## CHAPTER 2

    ## Basic Radio Theory and Introduction to Radio Systems


    Whether you credit Guglielmo Marconi or Nicola Tesla with his invention, radio
    has been in use for over a century, and will continue to grow for the foreseeable
    future. Indeed, tried and true radio technologies are becoming even more important
    in our increasingly connected world.


    A solid background in radio terminology and theory is essential for whereas reconnaissance.
