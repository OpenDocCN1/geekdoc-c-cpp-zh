    图 2.12 陷波滤波器


    陷波滤波器（图 2.12），也称为带阻滤波器，会移除一段频率


    ## 天线


    通过空气的无线波非常微弱。天线有助于收集并增强信号。当射频波经过天线时，它们会在无线电中感应出非常小的电压。


    天线是任何无线电最重要的组件之一。良好的天线可以轻易产生检测与错过信号之间的差异。事实上，在选择上，我们宁愿使用高质量的天线配合低质量的无线电，而不是相反。


    天线用于信号的传输和接收。由于本书的重点是接收信号，下一节将重点介绍天线如何接收以及改进接收的方法。类似的技术可以应用于发射天线以提高其性能。


    ## 天线理论


    理解天线的关键概念有：


    - *共振*（Resonance）发生在电信号从导线的一端传输到另一端并返回的时间与射频频率的一个周期相同时。换句话说，当导线的长度等于波长时，射频信号将在波长的倍数处产生共振，这种现象被称为*谐波*（harmonics）。谐波使天线更容易接收共振频率的信号。全波天线可能会变得非常长，这在手持无线电或车辆上似乎是不可能的。由于由于，人们经常使用
    1/2 和 5/8 波，理解共振至关重要。天线相对于给定频率的共振程度越高，激发天线并允许天线将该频率的信号通过无线电所需的射频能量就越少。*低阈值*或接收信号的微弱程度决定了无线电的灵敏度。这通常以微伏（µV）为单位。通过天线的射频能量激发天线，产生非常小的电压，同样以微伏（µV）为单位。


    > 提示

    > 并不是越大越好，特别是在天线方面。事实上，天线越短，接收高频信号的效果越好，因为高频意味着短波长。


