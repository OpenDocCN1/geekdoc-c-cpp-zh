    - 你们目前是否使用加密或中继（trunking）？


    这些问题和其他问题的答案在销售无线电设备时非常有帮助，对目标组织进行画像也有帮助。


    伪装成无线电销售人员会导致价值信息的泄露。通常，设施部门会管理无线电设备。如果目标公司有物理安全部门，他们可能负责无线电采购。记住，在拨打电话之前，你必须尽可能收集大量的信息。如果你无法对你声称销售的设备进行专业的谈论，骗局就会被拆穿。


    极少数例外外，在美国要求联邦通信委员会（FCC）颁发许可证的情况下在频率上进行合法广播是允许的。除了许多其他功能外，FCC 还确保无线电频谱以最高效率使用，并防止多个组织或站点争抢同一频率。保持一切井然有序并不令人意外，FCC
    维护着一个用于特定频率的许可证数据库。该数据库包含了频率信息以及许可证信息，包括其位置和联系方式。然而，可能令人惊讶的是，这个 FCC 数据库是向公众的。陷阱在于（当然，会有陷阱），该数据库的搜索和检索特定信息非常繁琐。


    私营部门已经提供了访问 FCC 数据库中包含信息的资源。Radiioreference.com（图 4.2）和 nationalradiodata.com（图
    4.3）就是此类两个资源。


    Radio Reference 作为一个付费站点时，也有许多包含大量丰富信息的免费区域。National Radio Data 在本文编写时提供的针对爱好者的价格为每年
    29 美元。


    在搜索组织使用的频率时，有几点需要注意。正如前面讨论的，有很多无线电设备转销商。其中许多转销商还提供设备维护服务，有时会提议为客户提供频率。在这些情况下，频率是许可给转销商并转租给某个组织的。


