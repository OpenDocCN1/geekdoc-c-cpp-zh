    # 为什么要进行无线电分析？


    信息无处不在，只要你知道去哪里寻找。在进行渗透测试时，在侦察阶段发现正确的信息往往决定了测试的成功与失败。虽然我们许多人对渗透测试人员经常使用的数据收集方法非常熟悉，但无线电流量可以提供大量的宝贵信息。这种很少被使用的侦察方法如果使用得当，可以提供丰富的数据。通过书中描述的方法所集的信息对于物理渗透测试和逻辑渗透测试都是有。


    此外，与渗透测试人员使用的任何其他方法一样，在保护网络和设施安全时，理解渗透测试人员和攻击者可能使用的方法是非常有用的。为了防御攻击者，有必要像攻击者一样思考。


    书中的内容并非所有内容在任何情况下都适用，这对于这种侦察方法来说也并非孤例。然而，正如包含的案例研究所示，当使用书中的方法时，其结果可能具有巨大的价值。


    > 注意：本书假设你已经熟悉渗透测试的基本概念。物理渗透测试是对组织或设施物理安全性进行测试的过程，而逻辑渗透测试是对组织或设施的网络和计算机安全性进行测试的过程。通常，物理和逻辑渗透测试会结合使用；例如，一旦攻破了设施，我们将利用物理访问接入网络或物理访问设备。


    执行此书中描述的操作所需的设备并不一定昂贵。虽然有价值数千美元的无线电台，但购买二手的基础接收机就可以提供你所需的大部分功能。一旦掌握了基础知识，就可以决定是否投资更贵、更复杂的设备。在可能的情况下，将描述使用各种设备的多种方法，并侧重于实用性。


    渗透测试人员和攻击者倾向于花费大量时间查看802.11和其他无线网络，偶尔会寻找蓝牙，以查看键盘等设备上是否有价值的流量。对于无线电频谱上的可用资源来说，这仅仅是一个开始。图
    1.1 显示了美国划分的无线电频谱（3kHz–300 GHz），并突出了 802.11 和蓝牙使用的频谱部分。如你所见，这些服务只使用了整个无线电频谱的一部分。图
    1.2 显示了无线电频谱，以及大多数渗透测试人员错过的无线电台和无线设备。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_1_0.png)


    图 1.1 大多数渗透测试人员查看的无线频谱部分


    # 守卫无线电、无线耳机、无线电话、无线摄像头 3


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_2_0.png)


    # 守卫无线电、无线耳机、无线电话、无线摄像头。建筑控制系统


    无线频谱上的目标包括那些存在了几年的设备（例如守卫使用的对讲机），以及那些刚刚开始作为无线视频摄像头的设备。某些目标无线电流量对安全专业人员来说可能有显而易见的用途，例如蓝牙键盘。出于某些原因，捕捉击键可能是无值的。然而，其他流量的优势可能没那么明显。后面的章节将涵盖现场和场外侦察的细节，以及如何使用适当的设备。然而，首先了解攻击者可以获得的信息类型非常重要。如果目标组织有守卫部队，守卫的无线电传输提供了丰富的情报。从守卫的名字到换班时间，再到内部术语，有很多可以挖掘的信息。在启动社交工程评估或攻击时，知道守卫的名字会增加渗透测试人员或攻击者的可信度。监听守卫流量也可能让攻击者知道守卫何时不在岗位上，无论是因为计划中的巡逻，还是无计划的洗手间或抽烟休息。进一步，结合警用扫描仪，攻击者可以获知事件的响应时间。


    图 1.2 大多数渗透测试人员错过的内容


    # 第 1 章：为什么要进行无线电分析？


    了解发现事件与通报当局之间的时间，以及当局的响应时间，可以让攻击者知道他们可以在设施内停留多久而不被发现。


    来自无线摄像头的流量可以提供许多与守卫部队流量许多相同的信息。知道守卫在设施或区域的什么位置，以及哪些区域无人，可能意味着在物理渗透评估期间成功与失败的区别。此外，在进入建筑之前看到其布局，在执行物理渗透测试时也是无价的。这在现实世界中发生的概率远比好莱坞小得多，取决于摄像头的分辨率和角度，也可能通过摄像头传输查看密码锁。


    除了画像分析和侦察之外，本书还对反情报提供了宝贵的见解。了解你的组织无意中泄露了什么信息将有助于确保机密信息的安全。作者们曾处于保密性至关重要的情况下，并在意想不到的地方发现了信息。一个例子是在扫描会议室的窃听器时发现了无线麦克风。该会议室曾用于一个关于潜在公司经理的演示。尽管有巨额的安全预算和窃听器扫描小组，如果这次高级会议使用了无线麦克风，附近的任何人都能听取整个演示。


    在尝试书中的任何内容之前，请确保你理解你所行为的法律和伦理影响。某些事情始终是违法的，例如干扰无线电传输，还有许多其他事情。为了确保机密信息的安全，了解如何防止无线电信号泄露是非常重要的。


    # 提示


    在尝试书中的任何内容之前，请确保你理解法律。


    # 案例研究


    通过案例研究是理解无线电真实价值的最佳方法。虽然这个案例研究包含虚构版本，作者在实际行动中使用了


