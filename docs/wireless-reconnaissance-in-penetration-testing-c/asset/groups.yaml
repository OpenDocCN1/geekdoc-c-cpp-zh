    # 110 CHAPTER 7: Basic Overview of Equipment and How it Works


    > NOTE

    Once bent a collapsible antenna is difficult if not impossible to bend them back
    into their original shape. For this reason, it is best to buy a new one.


    1-in. rubber duck antennas. While compact, and neat looking, they generally perform
    poorly unless used in high frequencies in the 900MHz range and above.


    ## Telescoping Whip Antennas


    Telescoping whip antennas (Figure 7.12) can be tuned to the desired frequency
    by shortening or lengthening them. They are generally very good for receiving
    signals; however they have several disadvantages. They are not particularly rugged,
    and are fairly easy to bend or break during use. Their larger size makes them
    generally more difficult to conceal, which is at cross purpose for our intended
    use. They are also rigid, making them a poor choice when wearing a radio on your
    belt. If not careful, rigid antennas can also place strain on the radio and cause
    the internal antenna connector to break the circuit board. If you plan to use
    a telescopic whip with a portable radio, choose one with a joint so that it can
    be pointed upward when the radio is laying flat. This will be a great help if
    using the radio at a table, desk, or in your car.


    ## Recommended Handheld Scanner Antennas


    If you can get one antenna, we recommend a high-quality rubber duck antenna such
    as the Austin Condor or Diamond RHF7CA. Both are good multi-band antennas. Beware
    of rubber duck antennas that are very short, around an inch in size. These have
    very poor performance and will cause you to miss everything except very strong
    signals. If you need a small antenna you can easily conceal the Diamond RHF10
    which is only 2.75 in. high, very flexible, and can receive 450 MHz, 800 MHz,
    and 900 MHz signals surprisingly well for its small size.


    If possible we recommend getting at least two scanner antennas. The second antenna
    should be a telescopic whip. The algorithm discussed in the Theory section of
    Chapter 2 can be used to figure out how long or short a telescopic whip antenna
    should be to match the target frequency. If you need to listen to a specific frequency,
    investing in a frequency-specific antenna may be a good option.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_106_0.png)


    ## Building Your Kit: Helpful Accessories


    > TIP

    Antennas are sensitive to all metallic objects in the nearby area. Moving an antenna
    often has a dramatic effect. This is especially true in high metal cubic frames,
    inside office buildings, hotel rooms, and the like. If using radio equipment while
    in a vehicle, simply moving the car a few inches may be enough to improve the
    reception. Of some times, you will need to find another location altogether to
    get a clear signal.


    ## Mobile Antennas


    For mobile antennas, the authors generally recommend the magnetic mount type.
    This allows easy portability and can be used on multiple vehicles. If you don''t
    need to use the antenna on more than one, a permanent mount antenna is also an
    option. In fact, the RadioShack mobile antenna is a good option, and it is usually
    easy to locate RadioShack. Better options include the Larson Tri-Band (Figure
    7.13) and the Austin Spectrum antennas. The Austin Spectrum is the taller and
    more expensive of the two. Both of these antennas are quality units, and both
    have their hardcore devotees in the radio community. The Larson and the Austin
    antennas can both be used with an NMO magnetic mount (Figure 7.15). NMO stands
    for Motorola and is a type of antenna connector commonly (Figure 7.14) used to
    mount a portable antenna on the outside of a vehicle, however this may not be
    the best option for long-term durability because BNC connectors are not water
    tight.


    ## Coax Cable


    Coax cables are a special type of cable used to carry RF signals. The quality
    and type of cable used become more important the longer the cable needs to be.
    For most wireless reconnaissance work long coax cables are not needed. Therefore
    most of the details around coax cables and selecting a high-quality cable are
    purposely not included in this book. For the purposes of wireless reconnaissance
    the most important thing to remember is to match the impedance of the cable with
    the impedance of the antenna and receiver. Scanners and scanner antennas have
    an impedance of 50 ohms.


    ## DTMF Decoder


    DTMF decoders decode touch tones. If cordless telephones or headsets are used
    by the target, DTMF decoders can be useful for decoding voicemail passwords. Some
    high-end scanners have DTMF decoders built into them. DTMF decoders are also available
    as an external piece of hardware or software.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_108_0.png)


    ## Camera


    As discussed in Chapter 5 Onsite Profiling having a camera can be helpful for
    taking pictures of the radio equipment and antennas used by the target organization
    so they can be analyzed later. A camera with a good optical zoom will be of the
    most benefit. Additionally binoculars can be helpful for similar reasons.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_109_0.png)


    **FIGURE 7.14** Magnetic Antenna Mount for Antennas with a BNC Connector, Reprinted
    with Permission from Meagan Call


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_109_1.png)


    **FIGURE 7.15** Magnetic Antenna Mount for Antennas with a NMO Connector, Reprinted
    with Permission from Meagan Call


    > TIP

    Suction cup window mounts (Figure 7.16) can be a great tool during reconnaissance.
    They allow you to mount antennas in hotel or office window, or inside a car. While
    generally people don''t notice antennas on vehicles, mounting the antenna inside
    can be a great option when you do not want extra attention.


    ## Headphones or External Speakers


    Headphones are another must have accessory when performing wireless reconnaissance.
    They will allow you to discretely listen to radio traffic. The crackle of a police
    radio dispatcher will always gather attention in public. When working in a car
    an external speaker can help hear transmission over road and engine noise. When
    getting a speaker to use in a car you can also consider getting one with a built-in
    audio amplifier so you can turn up the volume loud enough to clearly hear radio
    traffic.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_110_0.png)


    ## Audio Recording Equipment


    Being able to record information that you are receiving is helpful if a transmission
    needs to be reviewed to gather additional information or if you want to record
    activity on a channel while you are away from the radio. Also recording and playing
    back the information leaked by a company can be a great way to illustrate the
    risks to upper management of the intercepted data. Many desktop and mobile scanners
    have a line out specifically for being hooked up to a recording device. If you
    have a handheld scanner you can connect the recording right into the headphone
    jack. When selecting an audio recorder pick one that has a built-in VOX feature
    that will start recording only when audio is present. Finally select a recorder
    that will time stamp the audio files so you can look up when the transmission
    occurred. Note that some scanners such as the Uniden Home Patrol, GE PSR-800 and
    Icom R-20 (Figure 7.17) can come built with sound recording capabilities.


    ## Video Decoder


    The ability to decode signals given by a target organization is immensely helpful.
    Many organizations will use wireless security cameras to monitor area where they
    cannot easily run a video cable.


    FIGURE 7.16 Suction Cup Window Antenna Mount, Reprinted with Permission Meagan
    Call


    ## Building Your Kit: Helpful Accessories


    Some high-end scanners such as the Icom R-9500 (Figure 7.18) have the ability
    to decode video signals. However radios like this are outside most budgets. Other
    options include getting a used Icom R-3 which is a handheld scanner that can decode
    video signals. Although no longer in production used models can be readily found
    on eBay and other online sources. A dedicated video interception device such as
    the Optoelectronics Video Sweeper or AOR-STV (Figure 7.19) is another option.
    These are self-contained devices explicitly designed to scan for decode video
    signals. Note that most of the units will only decode analog video signals. In
    Chapter 10 we''ll touch on how the upcoming technology of software defined radios
    can also be used to decode both analog and digital signals.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_111_0.png)


    ## RF Amplifiers


    In general the authors of this book do not recommend using RF amplifiers (Figure
    7.20), also known as antenna boosters or pre-amplifiers. An RF amplifier will
    amplify not only the signal you are trying to hear but also RF noise in the area.
    Generally use of an RF amplifier will overload the front end of the scanner and
    cause you to miss the signal you are searching for.


    ## Voice Inversion Decoder


    Warning: Be sure to check applicable state, local, and federal laws before attempting
    to decode transmissions using voice inversion.


    Voice inversion is a simple way to scramble audio transmissions to make them difficult
    to understand. Voice inversion technology can be broken down into two types single
    point inversion and dual point

