    **FIGURE 5.9** Wireless Headsets Observed Onsite


    for legal liability, because we needed to ensure we did not monitor any headset,
    and therefore phone calls, from other business in the area.


    To accomplish this, we switched to directional antennas, and using them from several
    locations, determined which signals originated from inside the target building.
    Once we had identified signals originated from within the Client site, we started
    monitoring these signals.


    > Remember whenever you are going to be monitoring telephone calls it is critical
    to do it in a fashion that is legal and does not violate any wiretap laws. Wiretap
    laws are complicated and vary by state. For example, some states only require
    one party to consent to monitoring while other states require both parties (two
    party) consent. Be sure to engage your legal counsel to make sure this is done
    in a way that did not violate any laws.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_79_0.png)


    **FIGURE 5.10** Yessu VX-5R Amateur Radio, Reprinted with Permission from Meagan
    Call


    This lead to our first critical discovery. It turned out that one of the groups
    that used wireless headsets was the helpdesk. The helpdesk group handles password
    resets. By monitoring their headsets, we could listen in password reset conversations
    taking place. Once a password reset took place it was a race to login with the
    new password before the user did. If we won the race, we were in and had access
    to whatever that user account has permissions to.


    Once we logged in, we did need to set a new password. Meanwhile, when the legitimate
    user tried to reset their password using the temporary password provided to them
    by the helpdesk, they would find that the temporary password


    # CHAPTER 5: Onsite Radio Profiling


    given to them over the phone by the helpdesk didn''t work, and would need to call
    back to have it reset again. This could have clued someone in that something wasn''t
    right, but it''s human nature to assume a simpler, less sinister problem—such
    as the user heard the password incorrectly, or simply to blame the culprit. It
    Its not uncommon for a password to need to be reset a couple of time even when
    things are working correctly. So this behavior didn''t raise any suspicions.


    Once logged in and got a valid Windows authentication token, it didn''t matter
    if the password was reset again. Windows authentication tokens are good for a
    number of hours. So we could use the login as a head to attack the rest of the
    network. Next we used local privilege escalation exploits to gain administrative
    access to the system. Once we had administrative access to the system we searched
    for the token of a domain administrator who had recently logged into the system
    and used them to gain control of the corporate domain.


    If we could gain access to a list of user accounts, however, as by sniffing traffic,
    or finding a copy posted on a bulletin board or on a desk, we could have targeted
    a specific user account by attempting a number of failed login until the account
    became locked, and needed to be reset by the helpdesk. Normally a locked account
    does not need to have the password reset, but if we continued sending bad authentication
    attempts that the account keeps getting locked before the user could get in, eventually
    the user will request a password reset. So instead of waiting around and hoping
    to hear a request, we could trigger one.


    By using a DTMF (Dual Tone Multi-Frequency) decoder to translate the audible tones
    of the phone when pressing buttons into the corresponding number that represents
    them, we could decode users'' voicemail messages when they logged in to check
    their voicemail over the headset.


    Finally, we these specific headsets in the Client worked, they broadcast at all
    times when powered—not just while actively on a call. The headset also acted as
    a room bug, transmitting surrounding conversations if the headset was left on,
    which people commonly did.


