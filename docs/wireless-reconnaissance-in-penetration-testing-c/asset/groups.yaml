    # 第110页 第7章：设备基本概述及其工作原理


    > 注意事项

    折叠式天线一旦弯曲，就很难（甚至不可能）将其折回原始形状。因此，最好买一个新的。


    1英寸长的橡胶胶制“胶鸭式”天线（rubber duck antennas）。这种天线虽然紧凑且外观简洁，除非用于 900MHz 及以上的高频段，否则通常性能很差。


    ## 伸缩式天线


    伸缩鞭式天线（图 7.12）可以通过缩短或伸长来调整到所需的频率。它们在接收信号方面通常非常好；但它们也有几个缺点。它们并不特别坚固，在使用过程中非常容易弯曲或折断。较大的尺寸使得它们通常更难隐藏，这与我们的预期用途背道而驰。它们还很硬，因此在腰带上佩戴无线电台时不是好的选择。如果不小心，硬性天线还会对无线电台产生压力，导致内部天线连接器断裂电路板。如果你计划配合便携式无线电台使用伸缩天线，请选择带有接头的型号，这样当无线电台平放时它可以指向上方。这对于在桌子、办公桌或汽车内使用无线电台会有很大帮助。


    ## 推荐的手持式扫描仪天线


    如果你只能买一根天线，我们推荐高质量的橡胶胶鸭天线，例如 Austin Condor 或 Diamond RHF7CA。两者都是良好的多段天线。注意那些非常短（约1英寸）的胶鸭天线。它们的性能非常差，会导致你错过除极强信号以外的所有信号。如果你需要一个可以容易隐藏的小型天线，可以考虑
    Diamond RHF10，它高度只有 2.75 英寸，非常灵活，对于其小尺寸来说，接收 450 MHz、800 MHz 和 900 MHz 信号的效果好得惊人。


    如果可能，我们建议至少准备两个扫描仪天线。第二根天线应该是伸缩鞭式天线。第 2 章理论部分讨论的算法可以用来计算伸缩鞭式天线多长或多短才能匹配目标频率。如果你需要监听特定频率，投资特定频率的天线可能是一个不错的选择。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_106_0.png)


    ## 构建你的工具包：实用配件


    > 提示

