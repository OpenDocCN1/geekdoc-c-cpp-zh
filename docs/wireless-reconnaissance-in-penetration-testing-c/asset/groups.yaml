    # 庄家并不总是赢家：一个无线侦察案例研究


    ## 引言


    在提供了所有的技术信息和学习之后，作者诚挚地希望读者能在专业渗透测试员的职业生涯中使用书中的信息。我们已经在多次评估中使用书中介绍的技术和信息，而且通常这些信息使我们能够在没有它们的情况下可能无法取得成功。接下来的故事，怎么说呢，基本上是真实的。由于我们是专业安全人员，我们无法透露客户系统的细节或他们的姓名。然而，案例研究中的所有事件都是真实发生过的，我们从多次渗透测试的事件中提取了这一场景。


