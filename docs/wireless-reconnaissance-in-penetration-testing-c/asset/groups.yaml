    # 96 第 7 章：设备基本概述及其工作原理


    作为第二台扫描仪，专门用于监控区域内的警察交通，因为这样每当你在一个新的城市进行评估时，就不需要重新编程无线电台。为了进行有效的侦察，请选择一台可编程的扫描仪，以便在发现新目标频率时可以在现场进行编程。


    ## 频率范围


    从频率覆盖范围来看，扫描仪通常分为两个基本类别：全覆盖（Full Coverage）和频段覆盖（Band Coverage）。


    全覆盖通常出现在高端设备上，并且通常包括短波覆盖。虽然短波覆盖对渗透测试特别有用，但如果你兴趣成为一名无线电爱好者，拥有它也会很有趣。除非你获得特殊的设备，否则即使是全覆盖无线电台也会屏蔽旧的模拟电话频率。虽然模拟频率不再使用这看起来可能很奇怪，但销售能够接收这些频率的无线电台仍然是非法的。该法律有例外情况，如果你愿意处理大量的官僚程序，就可以合法获得未解锁的无线电台。联系销售未解锁扫描仪的经销商，他们可以提供购买未屏蔽扫描仪所需的get和文件。


    频段覆盖扫描仪无法调谐到任何频率，而是提供对热门频段或频率组的访问。这对于大多数用户来说已经足够，你想要监听的频率通常包含在频段覆盖中。


    过去有三种基本的无线电类型：限制在 30 MHz 到大约 500 MHz 之间的、限制在 30–900 MHz 之间的以及连续覆盖的。如今，或者更廉价的扫描仪已经覆盖了
    900 MHz，以前 900 MHz 覆盖是一个区别点，而今天常见的区别点在于设备的中网（trunking）和数字能力。对于专门的侦察，扫描仪不需要接收 30
    MHz 以下的信号。拥有一个可以接收 1.8 GHz 以上的扫描仪通常价值有限。如果你正在进行需要接收 1.8 GHz 以上流量的评估，扫描仪可能不是最好的工具，因为该范围内的大部分流量是数字信号。第
    11 章将讨论更适合此任务的专用工具。


