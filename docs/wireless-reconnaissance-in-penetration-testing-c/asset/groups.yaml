    # Selecting a Scanner


    the attenuator be used for all channels or none. Attenuation can be helpful in
    environments where there is a strong signal in the area that is overwhelming the
    other signals. Pager transmitters are notorious for overloading surrounding signals.
    Attenuation can also be helpful in an RF rich urban environment when using a sensitive
    scanner.


    # Near Field Frequency Counting Features


    Chapter 6 on On Site Profiling covers using a frequency counter such as the Optoelectronics
    Scout find unknown frequencies used by target radio system. Other scanners have
    near field capabilities built in. Uniden has branded this technology Close Call
    while GREL labels it Signal Stalker. Other manufacturers may have similar systems
    with different names. As a refresher near field receiver work by finding the strongest
    transmitter in the area that is high enough above the noise floor for the receiver
    to detect. Generally means these features work best in environments with low RF
    noise where we are close to the target transmitter. The usability and usefulness
    of these systems can greatly between models, manufacturers, and the operating
    environment. Overall the authors have had mixed results with these built in features
    and much prefers to use a dedicated device such as the Optoelectronic Scout. If
    your scanner does these features it is worth learning how to use them and employing
    during assignments. There have been rare cases where the near field frequency
    counter in a scanner detects a signal the Scout could not detect. The more information
    you can gather while profiling a better target.


    # Discriminator Out


    When a scanner receives a signal it goes through a number of filters and processes
    to clean up the audio before you hear it. When listening to normal audio traffic
    this is a good thing so you get clean and clear which is easy to understand. However
    during this cleanup process information is lost that is needed to decode digital
    signals. High-end scanners have a discriminator that outputs before it has been
    cleaned up so digital signals can be decoded. Decoding these digital signals is
    beyond the scope of this book, this may be of interest to individuals who perform
    reconnaissance if they plan or want to intercept and decode digital signals. This
    is also a feature that can be added to scanners by the end user. However usually
    involves opening the radio and soldering connectors to the internal circuit boards.
    So needless to say this is not for the faint of heart and will void your warranty.
    If you attempt this normal warning apply and the authors of this book will not
    be responsible for any damage you do to your radio. Figure 7.5 shows the inside
    of a radio with a homemade discriminator added.'
