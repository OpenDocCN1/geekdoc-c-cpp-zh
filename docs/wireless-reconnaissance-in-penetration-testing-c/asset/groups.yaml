    # Chapter 5: On Site Radio Profiling


    Chapter 5 continues on the next step on a penetration test and covers information
    that can be gathered on a target''s radio systems onsite. The chapter starts out
    radio related items to keep an eye open for while onsite and what a penetration
    tester can learn from these items. Next chapter explores frequency counters and
    how to use one while profiling a target. Next the reader learns what can be discovered
    by looking at a targets radio systems and antennas. The authors discuss what can
    be learned about the make, model and type of radio used and how to estimate the
    frequency range, off of the radio''s antenna. Finally, this chapter also includes
    common frequencies and frequency ranges to search onsite. The chapter concludes
    with a case study of intercepting wireless headsets used at an insurance company
    and the information provided about the company''s internal network.


    # Chapter 6: How to Use the Information You Gather


    In this chapter the reader will learn how to use the information gathered monitoring
    the targets systems. It includes specific advice on using the information gathered
    from guard radios, wireless headsets and phones and wireless cameras.


    # Chapter 7: Basic Overview of Equipment and How it Works


    Chapter 2 explored the scanner and how it works. In Chapter 7 the authors cover
    the common controls and features found on scanners and how to operate them. Next
    the book explains how to select a scanner for wireless reconnaissance and provides
    recommendations on scanners to use for wireless reconnaissance. After recommending
    specific radios the authors also discuss and recommend the antennas which they
    have found the most valuable over the years. The authors conclude this chapter
    by discussing accessories the reader may want to add to their wireless kit for
    radio reconnaissance.


    # Chapter 8: The House Doesn''t Always Win: A Wireless Reconnaissance Case Study


    Chapter 8 is a case study that pulls together the information provided in the
