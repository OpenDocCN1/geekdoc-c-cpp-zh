    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_140_0.png)


    bits can be processed by external programs. Analysis tools are very helpful when
    decoding signals, especially non-standard formats. The FSK is only a two-level
    decoder, that require a four-level FSK cannot be decoded. Many FSK formats use
    four-level encoding. So this is a pretty big weakness especially for a $500 piece
    of software.


    - Mini SIGINT (Figure 9.19) is a free plug-in that takes a fingerprint of a section
    of spectrum, and alerts when changes over a certain threshold appears in this
    spectrum. This tool is useful for finding new signals. if you know a device works
    in a certain band, but do not know the exact frequency it is using, you could
    take a baseline scan of that band to obtain a fingerprint of the RF then when
    the unknown device was and re-scan. The plug-in will identify frequencies appeared
    when the device was active.

    - Band Search (Figure 9.20) is a free plug-in that allows you to easily select
    a band for search activity.

    - Waterfall (Figure 9.21) is a free XRS plug-in which graphs the activity of a
    set frequency range in three-dimensions (signal strength versus frequency time).
    The plug-in can also log this data to a txt or CSV file, which is helpful for
    off-line analysis. This plug-in does not log RF data like GNU Radio can. Instead
    it lets the data used to create the graph such as the frequency, signal strength
    and time of each signal.


    ## Software-Defined Radios (SDRs) 147


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_141_0.png)


    9.19 Mini SIGINT XRS Plug-In Identifying New Signals


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_141_1.png)


    9.20 XRS Band Search Plug-In


    This tool is helpful for visualizing the activity of a band over time, and determine
    if seemingly random signals by a pattern.


    WiNRadio is excellent for finding new signals and performing analysis on digital
    signals before decoding. However, unless the right decoder exists for WiNRadio,
    and we have purchased it, usually decode them with GNU Radio in the USRP. The
    polished interface of WiNRadio makes it better for quickly detecting a signal.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_142_0.png)


    FIGURE 9.21 XRS Waterfall Scanner


    and from there we can determine if it is of interest and perform further analysis
    using GNU Radio, which in many cases can do things that cannot be done with WiNRADIO,
    thanks to the support of the open source community.


    There are other consumer grade software-defined radios, but most cover HF bands
    which are of limited use in wireless recon are not discussed here.


    ## NETWORK-ENABLE DISPATCH SYSTEMS


    Network-enabled dispatch systems are a recent newcomer to the environment, and
    are beginning to draw the interest of penetration testers. In the old days, the
    dispatcher needed to be close to the transmitter to dispatch units. This limited
    where a dispatcher could be physically located. Everything was hardwired, which
    also limited the mobility of the dispatcher. The hardwired nature of these systems
    also offered some security.


    High-end, modern data radio dispatch systems often operate over IP-enabled networks
    using VOIP. One benefit is that dispatchers can now move around to any place they
    can get an IP connection. The downside is the systems are now IP-enabled networks,
    which open them up to new attacks (or old attacks, depending on your perspective).


    ## Case Study: VOIP-Enabled Dispatch Radio on an Open TCP/IP Network


    A University recently updated to a new IP-enabled dispatch system. Initially,
    they were very excited this allowed the dispatcher to easily move around the campus,
    with a laptop and some other portable equipment, they could plug-in anywhere on
    campus and start dispatching. They foresaw that this would afford their security
    great disaster recovery capabilities if the security building was taken over or
    could not operate from there for some reason.


    Not understanding the potential vulnerability they was exposing themselves, they
    opened up to the radio system so the dispatcher could be the teacher, student,
    or any of the campus wireless networks. Unfortunately, this meant that anyone
    with access to these public networks could attack their new radio system. Looking
    at the radio system, we found the software needed to interact with it was difficult
    to find, and we could not find it online. This offered them some protection, as
    long as this remained, at any rate. The system wasn''t designed to be on a public
    network, which the student basically was, and poorly secured because of that.
    All of the traffic generated by the dispatch system was transmitted in cleartext,
    including user authentication, VOIP streams, and information about unit assignment.
    The dispatch system had an activity log, where the dispatcher could note which
    units are responding to what calls, and when they finish with the calls. This
    sensitive information would have been highly useful to unfriendly, who could easily
    used the public networks at the university to monitor the dispatcher''s coordination
    efforts, or spoof the system to misdirect users to where they needed.


    Additionally, the hardware that was provided and supported by the vendor was not
    well secured. For example, the system was missing security patches. The database
    running on the system had a very weak SA password. So the system had a large number
    of listing services which exposed additional attack surface. The large number
    of open ports would be alarming on an internal network, but were far too many
    for a system connected to a public network anyone could join.


    First, we recommended placing this system into its own private DMZ. The vendor
    would not apply patches until the system was thoroughly tested. So there would
    be long periods of time where the system could not be patched.


    ## CHAPTER 9: New Technology


    We recommended setting up a VLAN on the campus teacher network that could access
    this VLAN and assign a few network ports spread across campus that had access
    to this special VLAN and therefore the radio dispatch system. These special network
    jacks were also placed in secure locations where anyone could plug-in and use
    them. So in an emergency they knew they could go to these locations to gain access
    to the dispatch system. This VLAN was also given a high Quality of Service (QoS)
    priority on the network, to ensure the dispatch traffic was not dropped when the
    network congested.


    We debated using a VPN but the vendor would not guarantee it work over a VPN,
    given the latency it could introduce and have sensitive VOIP be latency issues.
    The vendor also said they do not recommend accessing the system over a wireless
    link because of the potential latency issues. So that, paired with the security
    concerns, stopped them from using it on the wireless.


    ## CONCLUSIONS AND LOOKWARD


    In summary, there''s a great deal more to wireless than just 802.11. There is
    a clear trend toward everything changing over digital formats, and moving away
    from analog. Wireless communications are becoming increasingly commonplace just
    everywhere—not just to replace existing wired systems, but adding “smart” capabilities
    to devices and systems which previously lacked them. There is a great deal of
    opportunity for the penetration tester, as new technologies are implemented without
    due consideration given to the security implications. An ever-increasing surface
    area for potential vulnerabilities to be discovered will keep security professionals
    busy for years to come.


    Software-defined radios are bringing about a golden age of wireless hacking. Their
    ability to reduce the amount of specialized hardware that you need to carry with
    you, combined with its superior flexibility and adaptability, and the enhanced
    signal analysis capabilities that it brings to the give the security professional
    a very flexible and powerful tool.


    With radio, as with any high tech field, the only constant is change. It''s important
    to keep your knowledge of the industry current. Staying abreast of the state of
    the art is a challenge. The best way to do that is to be immersed in the community.
    Read trade and hobbyist magazines such as Monitoring Times and Popular Communications
    on a regular basis. Getting your amateur radio license and joining local radio
    and scanner clubs are both ways to get started building your hands-on experience.
    American Radio League’s (ARRL) Website (http://www.arl.org/) is a great source
    of information on how to get your amateur radio license or locate a local amateur
    radio club.

