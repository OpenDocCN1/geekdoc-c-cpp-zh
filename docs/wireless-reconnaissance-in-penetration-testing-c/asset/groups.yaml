    output provides access to the unfiltered audio signal. Some scanners have discriminator
    output ports built-in, which makes it easy to access the unfiltered-signal.


    ## DIY RADIO MODIFICATION: DISCRIMINATOR OUTPUT


    Scanners that do not have this convenient feature can be modified by opening up
    the radio and soldering an audio line at a specific point on the circuit board.
    This is a relatively easy modification, which can be performed by the casual hobbyist
    or enthusiast, in a few minutes for less than $5 in parts that can be obtained
    from Radio Shack or similar stores, using a soldering station, a Dremel tool for
