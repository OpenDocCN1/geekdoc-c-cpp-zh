    are comfortable working with electronic devices, and soldering in particular,
    replacing the battery can be a fairly simple job. Hackers tend to tinker at heart,
    so when replacing the battery, it may make sense to install a replacement battery
    that will hold charge longer than the OEM battery. If doing this upgrade, make
    sure that the replacement battery is compatible with the Scout''s charging circuit.


    Another common issue with a used Scout is a blown front, after the antenna, the
    initial part of the receive portion of any radio. This happens when the Scout
    has been exposed to an unusually strong signal. Optoelectronics offers repairs,
    at the time of this wishing the minimum repair fee is $100, which is about one
    third of the cost of a new Scout.


    Certain models of scanners have frequency finding features. Band scope is one
    feature, however it has limited usefulness in reconnaissance unless it has a fast
    scan rate. Additional information is available in Chapter 7. Frequency grabbing
    features on scanners can be useful, and on higher end equipment there is an option
    to automatically store detected frequencies. Keep in mind that the frequency grabbing
    features on these scanners function similarly to other frequency counters, and
    short-range capabilities can also lock onto signals. Multiple manufactures use
    different trade names for this capacity, and a few of them are described in the
    sidebar.


    When using a signal counter, or the signal counting capabilities of a scanner,
    there are several tips that will make success more likely. Although it may seem
    intuitive, the signal strength does not always get stronger as you move toward
    the transmitting antennas. In fact, the base of the antenna tower is


    +   NOTE

    Scanner manufacturers use several names to describe their frequency counting capabilities:

    - Uiden Close Call™

    - Radio Shack High Signal Stalker I and Signal Stalker II™

    - GRE Spectrum Sweeper™'
