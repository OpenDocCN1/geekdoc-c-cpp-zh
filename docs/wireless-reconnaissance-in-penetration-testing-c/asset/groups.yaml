    ## CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_13_0.png)


    FIGURE 2.6 Multipath


    With technologies such as 802.11 Wi-Fi (2.4 and 5 GHz), multipathing actually
    becomes a useful property. A Wi-Fi signal indoors will reflect off of surfaces
    (walls, cabinets, etc.) and reach corners which would otherwise be in shadow if
    a line-of-sight frequency were used. Wi-Fi radios have specialized circuitry which
    allows them to combine these multiple paths, shifting the out-of-phase wave forms
    arriving from multiple paths back together into a reconstituted signal that is
    stronger than what would have been received, allowing Wi-Fi to work at longer
    ranges than it would otherwise. Wi-Fi signals are partially attenuated by most
    building materials, and completely blocked by some, this is an important factor
    in 2.4 GHz''s usefulness in 802.11 applications.


    # REGULATORY AGENCIES


    For wireless reconnaissance, we are mainly interested in a few chunks of the radio
    spectrum, specifically in the 30 MHz to 1 GHz range, 2.4 and 5 GHz spectrum. In
    the United States, the RF spectrum is governed by the Federal Communications Commission
    (FCC), who designates and apportions RF spectrum into different bands, which are
    commonly used by different types of services. The FCC is responsible for coordinating
    and issuing radio operation licenses, which authorize organizations to transmit
    specific frequencies, at specific power levels, in geographical regions. The FCC
    manages the RF spectrum, and therefore is required to keep and maintain public
    records of who is licensed to use which frequencies. This makes them a valuable
    resource for profiling targets. How to access and use this license information
    from the FCC will be discussed in Chapter 4. Additionally, electronic circuit
    emits an RF field when needed. Electronics manufacturers are required to certify
    products with the FCC, to guarantee that they are properly shielded so that their
    incidental RF emissions are properly contained and will not interfere with the
    operation of legitimately licensed broadcasts.


    Other countries have similar organizations to the FCC which manage and access
    to the spectrum in that country. In Europe, each country has its own governing
    body that manages the spectrum within their borders. The ITU (International Telecommunication
    Union) is a UN agency that coordinates shared global spectrum. This body covers
    spectrum utilization over international networks, satellite, short wave radio
    bands, and the broadcast operate spectrum. The ITU provides standards to help
    the various country regulatory bodies coordinate.


    # APPLYING THE SCIENCE: RADIO TECHNOLOGY BASICS


    Having provided a basic understanding of the radio spectrum and how radio waves
    at different frequencies act, we can apply this knowledge to understand how information
    can be transmitted and received using radio frequencies. For this we''ll learn
    the basic components of a radio and some basic radio theory.


    While we all have an image when we hear the term radio—be a clock radio, car stereo,
    or walkie-talkie—all radios do three basic things:


    - Tuning: A radio can tune into a desired frequency.

    - Amplification: A radio can amplify the weak signal that is received as the radio
    waves pass over the antenna. The amount of energy imported when a radio wave passes
    over an antenna is very weak. The signal usually needs to be amplified to a level
    where the other parts of the radio can process it.

    - Demodulation: A radio must detect the signal over the background noise, and
    demodulate the signal into a usable form. In most cases, this means converting
    the signal into sound waves the end user can hear.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_15_0.png)


    FIGURE 2.7 Block Diagram of a Radio


    To accomplish these things, a radio has different specialized parts. Figure 2.7
    is a block diagram for a Superheterodyne Receiver (also called Superhet), which
    is the most popular type of receiver used today, and commonly used in modern day
    scanners.


    It is important to understand at least at a high level what is going on inside
    the radio, in order to understand the limits of your equipment, as well as troubleshoot
    issues, such as front-end overload and spurious or false signals.


    Following the path an incoming signal from the air as it is processed by the radio
    receiver:


    - 1. Antenna: When radio waves pass over the antenna they induce a small current
    into the antenna which passed into the radio. When an electrical conductor passes
    through an RF field, the field induces a current in the conductor. Antennas and
    how they work will be covered in more depth later in the chapter.


    - RF amp and Tuner: The RF amp amplifies the weak signal that comes from the antenna.
    Often this signal is only a few microvolts. Getting the amplification right is
    a delicate balance for the engineer building the system. A strong enough amplifier
    is needed in order that the radio may be able to detect and demodulate a weak
    signal. But too strong an amplifier will create a signal that overloads the mixer,
    resulting in distortion in the signal as a variety of garbage signals are introduced
    into the radio and the radio generates signals outside of the intended frequency.
    This stage is also where the antenna is tuned to a specific frequency. In a scanner
    that can scan 100 channels per second the tuner needs to be able to quickly tune
    to different frequencies while remaining accurate.


    - Tuners also have filters to keep out signals that may be in the area. For example,
    a scanner may have a high-pass filter in place that filters out below 30 MHz,
    because that''s the lowest frequency the radio is designed to tune. Or, if it
    is only supposed to receive signals in the 144–148 MHz range may put a band-pass
    filter in place that only allows frequencies between 144 and 148 MHz through.
    This will help keep out by strong FM commercial radio stations or pager transmitter.
    FM radio stations and pager transmitters are notorious for causing front-end overload
    in radio scanners.


    High-end radios have multiple filters that are switched on and off depending on
    the frequency range the radio is tuned to. With scanners that need to receive
    signals over such a frequency range, it is extra challenging to make a front-end
    amplifier that works across the entire range they are intended to receive.


    - Mixer: A mixer is referred to as a data converter. The signals from the RF amp
    and local oscillator mixer. The mixer combines these waves and outputs a signal
    at a set frequency, referred to as the Intermediate Frequency (IF). No matter
    what the radio is tuned to, the IF that comes out of the mixer is the same. On
    most scanners the first IF output frequency is 10.7 MHz. Using an Intermediate
    Frequency makes it convenient to design the radio''s components, because they
    can be built around IF frequencies.


    In many radios this IF will actually go through converters and filters. To keep
