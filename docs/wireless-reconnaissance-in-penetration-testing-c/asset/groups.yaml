    ## 移动天线


    对于移动天线，作者通常推荐磁吸底座类型。这便于便携，并可以使用多辆车。如果你不需要在超过一辆车上使用该天线，固定式天线也是一种选择。事实上，RadioShack
    的移动天线是一个很好的选择，而且通常很容易找到 RadioShack。更好的选择包括 Larson 三段天线（图 7.13）和 Austin Spectrum
    天线。Austin Spectrum 是两者中更高、更昂贵的。这两种天线都是优质产品，并且在无线电社区中都有自己的忠实支持者。Larson 和 Austin
    天线都可以配合 NMO 磁吸底座使用（图 7.15）。NMO 代表 Motorola，是一种常见的天线连接器（图 7.14），用于在车辆外部安装便携式天线，然而对于长期耐用性来说，这可能不是最佳选择，因为
    BNC 连接器不是防水的。


    ## 同电缆


    同电缆是一种用于传输射频（RF）信号的特殊电缆。电缆越长，使用的电缆质量和类型就越重要。对于大多数无线侦察工作不需要长同电缆。因此，书中刻意没有包含关于同电缆和选择高质量电缆的多数细节。对于无线侦察而言，最重要的是使电缆的阻抗与天线及接收器的阻抗匹配。扫描仪和扫描仪天线的阻抗为
    50 欧姆。


    ## DTMF 解码器


    DTMF 解码器用于解码拨号音调。如果目标使用无线电话或耳机，DTMF 解码器对于解码语音信密码非常有用。一些高端扫描仪内置了 DTMF 解码器。DTMF
    解码器也可以作为外部硬件或软件提供。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_108_0.png)


    ## 相机


    如第 5 章“现场分析”所述，拥有一个相机有助于拍摄目标组织使用的无线电设备和天线的照片，以便以后进行分析。具有良好光学变焦的相机将受益最多。此外，双远镜出于类似原因也会有所帮助。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_109_0.png)


