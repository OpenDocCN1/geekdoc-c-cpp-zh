    \ a trunked system that spans over a state oftentimes there is no reason to broadcast\
    \ police or fire traffic to all the cities in a state. SmartZone systems make\
    \ much better use of the limited number of channels in a large trunked system\
    \ but only transmitting information if a user is in the target talkgroup.\n\n\
