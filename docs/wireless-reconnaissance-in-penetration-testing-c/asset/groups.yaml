    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_19_0.png)


    **FIGURE 2.8** Inside of a Scanner with a DIY Discriminator Output Added, Reprinted
    with Permission from Megan Call


    ## Filters


    A filter is a device that allows certain frequencies to pass, and rejects other
    frequencies. Filters are used inside radios to clean up RF and audio signals.
    Each filter has a cutoff frequency which is the frequency at which the filter
    reduces (attunes) the signal being passed through it and a decibel (dB) rating
    which tells how much of the signals are reduced by the filter. A filter may not
    completely eliminate a signal if the input signal is stronger than the dB rating
    of the filter. Filters can also have a fixed cutoff frequency or a variable cutoff
    frequency. Classically, filters are electronic circuits. However, as more radios
    become software-based, more and more filters are being implemented in software.


    There are two basic types of filters high-pass and low-pass filters. A high-pass
    filter allows frequencies above the cutoff frequency to pass through (Figure 2.9).
    A low-pass filter allows frequencies below the cutoff frequency to pass through
    the filter (Figure 2.10).


    Band-pass and notch filters are also common filters used in radios. A band-pass
    filter allows a set of frequencies to pass and is created by combining a low-pass
    filter to remove signals below the target band and a high-pass filter to remove
    signals above the target band (Figure 2.11). Band-pass filters are helpful to
    eliminate strong signals outside of the target band.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_20_0.png)


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_20_1.png)


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_21_0.png)


    FIGURE 2.11 Band-Pass Filter


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_21_1.png)


    FIGURE 2.12 Notch Filter


    Notch filter (Figure 2.12), also called a band stop, removes a section of the.


    ## ANTENNAS


    Radio waves passing through the air are very weak. The antenna helps gather and
    strengthen the signal. When RF waves pass over an antenna, they induce a very
    small voltage into the radio.


    The antenna is one of the most important components in any radio. A good antenna
    can easily make the difference between detecting and missing a signal. In fact,
    the choice, we would prefer a high-quality antenna paired with a low-quality radio
    than a low-quality antenna paired with a high-quality radio.


    Antennas are used when signals are both transmitted and received. Because the
    focus of this book is on receiving signals, the next section will focus on how
    antennas can receive and ways to improve how antennas receive. Similar techniques
    can be applied to transmitter antennas to improve their performance.


    ## Antenna Theory


    A number of concepts are key to understanding antennas:


    - *Resonance* occurs when an electric signal travels from one end of a wire to
    the other, and back in the same amount of time as the period of one cycle of the
    RF frequency. In other words, when the length of wire is equal to the wavelength,
    RF signals will resonate with lengths at multiples of the wavelength, as well,
    a phenomenon known as *harmonics*. Harmonics makes it easier for the antenna to
    pick up signals of resonance frequency. Full wavelength antenna can get very long
    which seems unlikely when mounted on a handheld radio or vehicle. Because of this
    people often use 1/2 and 5/8 waves, it is essential to understand resonance. The
    more resonant an antenna is with respect to a given frequency, the less RF energy
    is required to excite the antenna and allow the antenna to pass a signal at that
    frequency through the radio. The *low threshold*, or how weak a signal is to pick
    up, determines the sensitivity of the radio. This is typically measured in microvolts
    (µV). RF energy passing over an antenna excites the antenna, generating a very
    small voltage, also measured in µV. Antennas can also act as filters. Tuning an
    antenna to resonate at specific frequencies will make it easier to hear signals
    on that frequency. Note, however, that tuning an antenna to resonate on specific
    frequencies will make it more difficult to hear other


    > TIP

    > Bigger isn''t always better, especially when it comes to antennas. In fact,
    the shorter the antenna, the better it will hear higher frequency signals, since
    high frequency means short wavelength.

