    # Everything is Going Digital


    violation implications. Commercial tools to sniff and inject Bluetooth packets
    cost thousands of dollars. Ubertooth has lowered the cost for a device to attack
    Bluetooth to $120.


    # Zigbee


    Zigbee is a specification based on IEEE 802.15.4 standard for Personal Area Networks,
    and typically used in short-range and low-power wireless devices. Commonly, Zigbee
    devices are used in mesh networks, to extend their range by relaying through intermediary
    devices in the mesh. It is used in a wide range of products from smart meters
    to thermostats to wireless light switches. Zigbee shows up in a surprising number
    of places when you look for it, but very few penetration testers are looking for
    it. Zigbee systems are engineered into a variety of applications.


    The KillerBee framework was developed by Josh Wright to attack Zigbee. The project''s
    home page is: http://code.google/p/killerbee/. It is, open source software. KillerBee
    is a framework for assessing and exploiting vulnerabilities in Zigbee and IEEE
    802.15.4 networks. It can be used to sniff packets, replay packets for attacks,
    and to attack the crypto system used by Zigbee. Figure 9.3 shows KillerBee being
    used to inject custom crafted packets using Scapy.


    KillerBee can be used with a couple of different Zigbee radios. The most popular
    is the Atmel RZUSBSTICK (Figure 9.4). KillerBee has limited functionality when
    using this radio with the stock firmware. By loading a custom firmware more features
    are available. Note that loading the custom firmware de-


    > HIGH-JACKING WIRELESS CONNECTIONS TO GAIN ACCESS TO INTERNAL SYSTEMS


    In all cases, the wireless links are potential attack points, and should be considered
    penetration testers. By attacking the links or devices, most times the attacker
    is looking at manipulating the systems they control. For example, you may be able
    to make it look like more power is being used. Or attack the end point, like a
    thermostat, and adjust the temperature in the building. This may not seem like
    a big deal, but for manufacturing and healthcare, temperature control is critical.


    If you did penetrate a device you may be able to use that to further penetrate
    the backend corporate network. For, on a recent penetration test of a smart grid
    system we were able to high-jack the radio link between the smart meter and the
    power company. The power company assumed this was a secure link, and left the
    rest of their network much more exposed than they should. So once we were in,
    we had full access to their backend systems, and could execute a more traditional
    penetration test and attack the systems the smart meters tasked. We found vulnerabilities
    that allowed us to take over these systems and use them as a jumping-off point
    into the larger network.


    # CHAPTER 9: New Technology


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_126_0.png)


    FIGURE 9.3 Using KillerBee to Inject Custom Crafted Packets. Printed with Permission
    from Spencer “zeroSteiner” McIntyre


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_126_1.png)


    FIGURE 9.4 Atmel RZUSBSTICK Used by KillerBee. Reprinted with Permission from
    Meagan Call


    ATMEL-programming tool ($200 USD). But overall, it is still cheap to create a
    custom attack tool. The big benefit of KillerBee is it created a cheap platform
    to sniff and inject packets to attack Zigbee. In the past, test gear to do this
    was very expensive. With KillerBee, you can take a $40 Atmel RZUSBSTICK and make
    it into an attack tool.


    # Digital Means More than Just WiFi


    Clearly, there is a great deal more in the world of digital radio than 802.11
    (WiFi). Some applications for non-WiFi wireless technologies are:


    - Home/building automation systems: Common brands are Crestron, Control-4, and
    X10. They are used to connect together lighting, HVAC, motion and temperature
    sensors, motorized window shades, and other appliances, so buildings and homes
    can be automated and more energy efficient. For example, the automation system
    can be programmed to adjust your HVAC system to turn on and off, depending on
    which rooms are occupied, and the weather forecast for the day. All of those light
    switches, sensors, thermostats, etc. are often connected wirelessly. Some Zigbee
    or custom implementations of 802.15.4, while others use proprietary RF technology.
    These systems are not only green, they can also save money, so they will become
    more popular, particularly as prices on the technology drop and energy costs rise.


    - Smart Grid: The most popular smart grid applications are currently with electric
    power, but can apply to gas and water distribution networks as well. The technology
    is used to create a grid that can adapt in real time to changes. In a basic implementation,
    smart meters only report usage data back to a central office in real time, or
    near real time, but lacks the ability to control. To be smart, the grid has to
    be able to take the information it has gathered, and change/react to better manage
    load. Smart grids can interact with home appliances to adjust energy usage. For
    example, they can interact with thermostats to set a AC temperature during the
    hot season if the grid is under heavy load. Or, they can call to smart appliances,
    such as laundry machines and dishwashers, to schedule them to run when energy
    costs are the cheapest, or when there is a surplus, and avoid running when energy
    is in high demand. The meters, and the infrastructure to support this are often
    wirelessly connected using a variety of protocols, from proprietary mesh networks,
    to Zigbee, to cellular.


    - Proprietary links for digital signals, billboards, etc: Generally, billboards
    that have full color displays are updated over cellular cells so they get faster
    speeds. Lower-tech signs like the gas price signs or the LED signs outside of
    banks and use proprietary radio links that are usually 9600 Baud. They are slow,
    but not much data needs to be sent. There are really no standards here. A sign
    made by company A usually can''t be controlled by a controller made by company
    B.


    # SOFTWARE-DEFINED RADIOS (SDRs)


    We are accustomed to think of radios as hardware equipment, made of transistors,
    circuitry, and an antenna. However, it is possible to virtualize any type of electronics
    hardware by emulating it in software. Thus, the software-defined radio (SDR) is
    born. The general design of an SDR is an RF front end which feeds into an analog-digital
    converter (ADC). This digital signal is fed into a general purpose computer for
    processing (Figure 9.5). In some designs


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_128_0.png) a digital signal processor
    (DSP) is placed between the ADC and general purpose computer to aid in processing
    the output from the ADC. The RF front end varies, but converts the RF signal to
    a level and format by the Analog-to-Digital converter. In a perfect world, you
    could just plug an antenna into an ADC, but in reality you need some front-end
    hardware to convert the RF to a usable format and level.


    SDR is not a new concept, but with FPGAs and other electronics advances, it is
    now cheaper to implement them. Also, thanks to the speed of desktop computers,
    it has become feasible to implement features in software that formerly required
    specialized hardware for performance reasons. With cheaper SDRs, we are entering
    a new golden age of wireless hacking. SDRs will be the key to intercepting, decoding,
    and hacking the new digital systems.


    # How does an SDR Differ from a Traditional Radio?


    Software emulation of features traditionally implemented in hardware. Components
    that are usually implemented in hardware in a traditional radio are implemented
    in software in an SDR. The software and processing can run on a general purpose
    computer (personal computer or embedded system). Some use Field Programmable Arrays
    (FPGAs) to assist with processing. Often combination of both FPGA and a general-purpose
    CPU is used.


    Common parts of the radio implemented in software:


    - Filters: Making hardware filters that adapt to changes in the signal is very
    complicated and requires a large number of components. This is much simpler in
    software because the filter can be changed easily, based off of characteristics
    of the signal. Because of this, filters are commonly implemented in software.
    Many times RF filters are also implemented in SDRs.

