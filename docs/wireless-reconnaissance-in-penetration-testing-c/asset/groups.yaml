    # Glossary 159


    UHF: 450-470 MHz


    **UHF-T: 470-512 MHz**


    **Unity Gain**: Antenna with effective radiated power equal to the transmitter
    power. Does not have gain or loss


    **USB, Upper sideband**: Higher frequency sideband that transmitter carrier. See
    Single Sideband Modulation.


    **UTC, Universal Coordinated Time**: *See Zulu Time.*


    # V


    **Vertical Polarization**: Antenna that best receives radio waves with an electric
    field that is perpendicular to the Earth''s surface.


    **VHF: Very High Frequency: VHF is the frequency range from 30-300 MHz.**


    **VHF high band**: The range of VHF from 150 to 175 MHz.


    **VHF low band**: The range of VHF from 30 to 50 MHz.


    VOX: A VOX circuit powers a transmitter on and off automatically when it detects
    someone speaking into it.


    # W


    **Wavelength**: The wavelength of a frequency is the distance over which the shape
    repeats.


    # Y


    Yagi: A Yagi antenna, short for Yagi-Uda, is type of directional antenna.


    # Z


    **ZigBee**: A low-power consumption protocol for wireless control and monitoring
    of devices as light switches and HVAC. ZigBee is becoming more prevalent, especially
    in green buildings.


    **Zulu Time**: Zulu, which is Z in the phonetic alphabet, is used to describe
    Coordinated Universal Time, or UTC.'
