    在实地侦察期间，通过天线的长度来确定发射器的大致频率通常非常有用。了解这一长度将帮助你锁定信号更有可能出现的频率范围，并缩短确定目标所需精确频率的时间。偶极天线和鞭形天线的长度由以下公式决定：


