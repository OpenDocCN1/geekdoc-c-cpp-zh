    # Rebanding


    Rebanding, also known as reconfiguration, refers to changes in the 800 MHz band
    to allow on the Nextel Network and users on public safety networks to coexist.
    If you are monitoring rebanded trunked systems, you must have a scanner that supports
    rebanding. If you attempt to monitor rebanded trunked systems without a scanner
    that supports rebanding, the scanner will go to an incorrect channel and will
    not be able to monitor the transmission. While rebanding is not usually a major
    concern if you are monitoring private trunked systems in the 800 MHz range.


    # Continuous Tone-Coded Squel System (CTSS)


    Continuous Tone-Coded Squel System (CTSS), also known as tone squelch or remote
    squelch control, is designed to allow users on a shared frequency to hear only
    users in their user group. Theoretically, CTSS will allow a user to hear only
    transmissions by their user group, and not be subjected to the transmissions of
    others on the same channel. CTSS equipped receivers generally operate in either
    CTSS mode or normal mode. While in CTSS mode, the receiver''s audio will only
    be activated if the transmitted signal was sent using the same CTSS tone. CTSS
    is also helpful in noisy environments where a scanner could pick spurious signals
    that break the squelch. By programming in a CTSS tone for the scanner will not
    stop scanning unless a signal is present which also has the correct CTSS tone.


    # Digital Code Squelch (DCS)


    Digital Code Squelch (DCS) is a newer version of CTSS that operates by sending
    digital data using subaudible tones. Some manufacturers refer to DCS and Digital
    Private Line (DPL).


    # Alpha Numeric Memory


    Alpha numeric memory feature on a scanner allows the user to name each channel
    with a text string. In the past all a scanner would show a channel number and
    maybe a frequency. On those types of scanners you needed to remember Channel 1
    is the fire dispatch for Lakewood, Channel 2 is the dispatch for Rocky River,
    and so on. When you program 200 channels into a scanner, it quickly becomes impossible
    to remember them all. This feature is very helpful when performing wireless reconnaissance
    because you may be visiting multiple sites in a week which makes the task of memorizing
    channels even harder.


    # Computer Programmable


    It is wise to spend more up front and acquire a scanner that can be computer programmed.
    Being able to program the scanner with your computer will allow you to use your
    full size keyboard, copy, and paste frequencies from manuals and Web Sites, save
    significant time if you need to enter a large number of frequencies.


    # Voice Squelch


    Voice Squelch is a radio feature where the scanner will only stop when it has
    identified what seem to be voices. While this can be useful to skip over data
    traffic that you may encounter during reconnaissance, it will only work as the
    vendor has implemented it. It is wise to assess the scanner''s ability to accurately
    pick out voice transmissions before using this feature on an engagement. Similarly
    some manufactures have a Data Skip features that skips channels that need to carry
    data signals. This feature achieves the same results as Voice Squelch.


    # Attenuator


    Attenuation is a filter that decreases the power of signals entering into the
    radio. The attenuator is inline between the antenna and the front end of the radio.
    Various scanner models implement attenuation differently, where some allow the
    attenuator to be set on a per-channel basis, while others require


    > NOTE

    Recent model GRE and RadioShack scanners have a reputation of the front end of
    the radio easily being overloaded in environments with lots of signals, such as
    metropolitan areas. This results in distorted audio or hearing signals on the
    incorrect frequency. Enabling the Attenuation feature on the radio will help decrease
    the strength of these signals and prevent the radio front end from being overloaded.


    # Selecting a Scanner


    the attenuator be used for all channels or none. Attenuation can be helpful in
    environments where there is a strong signal in the area that is overwhelming the
    other signals. Pager transmitters are notorious for overloading surrounding signals.
    Attenuation can also be helpful in an RF rich urban environment when using a sensitive
    scanner.


    # Near Field Frequency Counting Features


    Chapter 6 on On Site Profiling covers using a frequency counter such as the Optoelectronics
    Scout find unknown frequencies used by target radio system. Other scanners have
    near field capabilities built in. Uniden has branded this technology Close Call
    while GREL labels it Signal Stalker. Other manufacturers may have similar systems
    with different names. As a refresher near field receiver work by finding the strongest
    transmitter in the area that is high enough above the noise floor for the receiver
    to detect. Generally means these features work best in environments with low RF
    noise where we are close to the target transmitter. The usability and usefulness
    of these systems can greatly between models, manufacturers, and the operating
    environment. Overall the authors have had mixed results with these built in features
    and much prefers to use a dedicated device such as the Optoelectronic Scout. If
    your scanner does these features it is worth learning how to use them and employing
    during assignments. There have been rare cases where the near field frequency
    counter in a scanner detects a signal the Scout could not detect. The more information
    you can gather while profiling a better target.


    # Discriminator Out


    When a scanner receives a signal it goes through a number of filters and processes
    to clean up the audio before you hear it. When listening to audio traffic this
    is a good thing so you get clean and clear which is easy to understand. However
    during this cleanup process information is lost that is needed to decode digital
    signals. High-end scanners have a discriminator that outputs before it has been
    cleaned up so digital signals can be decoded. Decoding these digital signals is
    beyond the scope of this book, this may be of interest to individuals who perform
    reconnaissance if they plan or want to intercept and decode signals. This is also
    a feature that can be added to scanners by the end user. However usually involves
    opening the radio and soldering connectors to the internal circuit boards. So
    needless to say this is not for the faint of heart and will void your warranty.
    If you attempt this normal warning apply and the authors of this book will not
    be responsible for any damage you do to your radio. Figure 7.5 shows the inside
    of a radio with a homemade discriminator added.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_100_0.png)


    **FIGURE 7.5** Scanner with a DIY Discriminator Added, Reprinted with Permission
    Meagan Call


    # Additional Considerations When Buying Used or Older Model Scanners


    There are many arguments to be made for purchasing used or older model equipment,
    price being chief amongst them. Used units are also great for


    > NOTE

    Ham radios are usually a great place to purchase used equipment. Often times,
    they will offer some form of warranty, and if something goes wrong you will be
    able to contact the person who sold the equipment. Additionally, Hams are passionate
    about radio, and generous with their knowledge.


    > TIP

    If allow, it is best to have two scanners. One can be used to monitor dispatch
    and the other can be used to scan. On reconnaissance engagements, you will almost
    always find at least two things you will want to monitor.

