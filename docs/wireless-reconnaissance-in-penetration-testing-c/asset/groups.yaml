    无法做的事情。


    还有其他消费级软件定义无线电台，但大多数覆盖 HF 频段（在无线侦察中用途有限），此处未作讨论。


    ## 网络化调度系统


    网络化调度系统是该领域最近的新成员，并开始引起渗透测试者的兴趣。在过去，调度员需要靠近发射器才能调度单位。这限制了调度员的物理位置。一切都是硬线连接的，这也限制了调度员的移动性。这些系统的硬线特性也提供了一些安全性。


    高端、现代数据无线电调度系统通常通过支持 IP 的网络使用 VOIP 运行。一个益处是调度员现在可以移动到任何可以获得 IP 连接的地方。缺点是这些系统现在是支持
    IP的网络，这使其容易受到新的攻击（或旧攻击，取决于你的观点）。


    ## 案例研究：开放 TCP/IP 网络上支持 VOIP 的调度无线电台


    某大学最近更新了一套新的支持 IP 的调度系统。最初，他们非常兴奋，因为这允许调度员带着笔记本电脑和其他便携式设备在校园内自由移动，他们可以在校园的任何地方插上并开始调度。他们预见到，如果安全大楼被占用或由于某种原因无法从那里运行，这将为他们的安全提供极大的灾难恢复能力。


    由于不理解他们正在暴露的潜在漏洞，他们向无线电系统开放，以便调度员可以是教师、学生或校园任何无线网络中的任何一个。不幸的是，这意味着任何访问这些公共网络的人都可以攻击他们新的无线电系统。查看该无线电系统，我们发现与其交互所需的软件很难找到，我们无法在网上找到它。只要这种情况仍然存在，至少为他们提供了一些保护。该系统设计初并不是运行在公共网络上的（学生基本上就在公共网络上），而且因为这个原因安全性很差。调度系统产生的所有流量都是明文传输的，包括用户身份验证、VOIP
    流和单位分配的信息。调度系统有活动日志，调度员可以在其中记录哪些单位正在响应哪些呼叫，以及何时完成呼叫。这些敏感信息对于敌意分子将非常有用，他们可以利用大学的公共网络监控调度员的协调工作，或者伪造系统将用户误导到他们需要的地方。


    此外，供应商提供并支持的硬件没有很好的保护。例如，系统缺少安全补丁。运行在系统上的数据库具有非常弱的 SA 密码。因此，系统有大量的列出服务，暴露了额外的攻击面。大量的开放端口在内部网络中会引起警觉，但对于公共网络来说，实在太多了。


