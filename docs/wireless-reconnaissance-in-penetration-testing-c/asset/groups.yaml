    # Trunked Radio Systems in Depth


    Trunked radio systems centrally manage a pool of channels, and intelligently switch
    users to whatever channel is open at a given time. This is often a difficult concept
    for scanner enthusiasts to understand, as represents a paradigm shift in design
    of the system. Trunked radio systems are one of the most complex types of radio
    systems in use today. Trunked radios use several channels or frequencies, and
    allows those channels to be shared by a large number of users, in talkgroups,
    without their conversations interfering with each other.


    Talkgroups are defined groups of users. For example, all police officers and dispatchers
    would belong to a police talkgroup; all fighters and fire employees would belong
    to a fire talkgroup, and all municipal waste collectors would be in a waste management
    talkgroup.


