    \ can cover a wide area or multiple sites can be made up of multiple repeaters.\
    \ Many states have created trunked networks using repeaters that cover the entire\
    \ site. In trunking each repeater or transmitter tower is referred to as a site.\
    \ Multi-site trunked systems can be divided into two categories: simulcast and\
    \ SmartZone.\n\nIn a multicast system a transmission that comes into the system\
    \ is broadcast by every site in the system. In a SmartZone system each unit checks\
    \ into the nearest site in so the sites have a list of all the units using them\
    \ at any given moment. A SmartZone site only broadcast traffic if a user in the\
    \ target talkgroup is using that specific site.\n\nAn analogy for this to help\
    \ users familiar with Ethernet networks is to imagine a multi-site trunked radio\
    \ system as an Ethernet hub or switch where each port on the hub or switch is\
    \ a trunking site. In this analogy a system would be an Ethernet hub because traffic\
    \ comes into one port (site) is broadcast out to all the other ports (sites) in\
    \ the system, it does not matter which talkgroup the traffic destined for. All\
    \ ports (sites) still see the traffic. A SmartZone system can be thought of as\
    \ an Ethernet switch where traffic comes from one port (site) destined for a specific\
    \ talkgroup and is broadcast to the ports (sites) where members of that talkgroup\
    \ are connected.\n\n> TIP\n> Trunking capable scanner often has complicated programming\
    \ functions. The best reference for programming your scanner to work with trunked\
