    systems are deployed at large corporate campuses, amusement parks, and sporting
    arenas. Increasingly, companies are also lease space on an existing trunked system,
    instead of building out their own systems.


    # Monitoring Trunked Radio Systems


    Listening in trunked systems is more complex than listening to non-trunked systems.
    The penetration tester is likely familiar with packet switching in computer networks,
    and the operation of the trunked radio system is essentially that of a packet
    switching network. There are scanners specifically designed to listen to trunked
    conversations, and you will need one to effectively listen to trunked traffic.
    Without a trunked-capable scanner, you may be able to pick up bits of conversations;
    however it is nearly impossible to consistently get the entire conversation. The
    basics of using a trunked-capable scanner are covered in Chapter 7.


    Trunking systems that can cover a wide area or multiple sites can be made up of
    multiple repeaters. Many states have created trunked networks using repeaters
    that cover the entire site. In trunking each repeater or transmitter tower is
    referred to as a site. Multi-site trunked systems can be divided into two categories
    simulcast and SmartZone.


    In a multicast system a transmission that comes into the system is broadcast by
    every site in the system. In a SmartZone system each unit checks into the nearest
    site in so the sites have a list of all the units using them at any given moment.
    A SmartZone site only broadcast traffic if a user in the target talkgroup is using
    that specific site.


    An analogy for this to help users familiar with Ethernet networks is to imagine
    a multi-site trunked radio system as an Ethernet hub or switch where each port
    on the hub or switch is a trunking site. In this analogy a system would be an
    Ethernet hub because traffic comes into one port (site) is broadcast out to all
    the other ports (sites) in the system, it does not matter which talkgroup the
    traffic destined for. All ports (sites) still see the traffic. A SmartZone system
    can be thought of as an Ethernet switch where traffic comes from one port (site)
    destined for a specific talkgroup and is broadcast broadcast to the ports (sites)
    where members of that talkgroup are connected.


    > TIP

    Trunking capable scanner often has complicated programming functions. The best
    reference for programming your scanner to work with trunked systems is your scanner''s
    manual.'
  - '[PAGE 41]


    # 42 CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems


    As you can image, multicast system make very poor use of valuable channels in
    large and complex systems. If you have a trunked system that spans over a state
    oftentimes there is no reason to broadcast police or fire traffic to all the cities
    in a state. SmartZone systems make much better use of the limited number of channels
    in a large trunked system but only transmitting information if a user is in the
    target talkgroup.


    From a wireless reconnaissance point of view, the types of system used will affect
    what traffic you can hear, based off of which sites you can hear traffic from
    and which end users are using those sites. In a multicast system you will hear
    all traffic in the trunked system no matter which tuner you can monitor. In a
    SmartZone you will miss traffic if there are no users of the talkgroup checked
    into a tower that is within range. The easiest way to avoid this is to be within
    range of the site that is closest to your target. Most likely the talkgroup you
    are interested in will be in near your target so units in that talkgroup will
    be checked into that site.


    # SUMMARY


    Fundamental concepts that we have explored in this chapter are essential knowledge
    for the penetration tester. Refer back to this chapter often to develop familiarity
    with these concepts. To review what we''ve covered:


    +   Radio Frequency (RF) is a large part of the electromagnetic spectrum, from
    3000kHz to 300,000MHz.

    All electromagnetic signals move through a vacuum at the speed of light. Because
    of this, frequency and wavelength are inversely related to each other. Low-frequency
    waves have a high wavelength, and high-frequency waves have a short wavelength.
    If you know the frequency, you can determine the wavelength and vice versa.

    nThe SuperHeterodyne design is the most common in modern radios. It consists of
    an antenna that feeds incoming signals into a “head end” (comprised of the RF
    Amplifier, Tuner, and Mixer), and from there is into the Demodulator for conversion,
    amplified by the audio amplifier, and finally output through a speaker.

    A good antenna is critical to radio performance. The antenna’s length determines
    what frequency it is tuned to; shorter antennas pick up higher frequency waves.
    The wave length is twice the length of the antenna. To know what length an antenna
    is tuned for what frequency, use the equation


    ```

    492 = 0.5 x wavelength = length of antenna (in feet Frequency (MHz)

    ```'
  - '[PAGE 42]


    +   FM is the most popular analog modulation type above 30 MHz, and is of the
    most interest to penetration tests for wireless renown


    +   Digital modulation types are becoming more common: This is a challenge, given
    that scanners currently have poor support for digital formats.


    +   Currently P-25 is the only digital modulation supported by scanners.


    +   Simple radio systems consist of a transmitter and one or receivers, or more
    commonly with the types of radios that are of interest to penetration testers,
    multiple transceivers.


    +   Repeaters allow signals to be transmitted over a wider area by amplifying
    and rebroadcasting the input signal. Be sure to monitor the output frequency of
    a repeater in order to receive all traffic.


    +   Trunked radio systems are advanced networks that allow for multiple talkgroups
    to share a small band of channels, controlled by a trunking master, which acts
    like a switch to route transmissions to the appropriate party and conserve radio
    bandwidth.


    # FURTHER LEARNING


    Beyond what can be covered here, there is a great deal that cannot be adequately
    covered in a single chapter. Now that you have a grasp of the fundamentals covered,
    be sure to continue your education. We recommend a few next steps:


    +   1. Get your amateur radio license: American Relay League''s (ARRL) web site
    (http://www.arl.org/) is a great source of information on how to get your radio
    license.


    +   2. Further reading: The American Relay Radio League (ARRL) puts out a lot
    of good books. There two stand out: Basic Radio: Understanding the Key Building
    Blocks by Joel R. Salas and The ARRL Handbook for Radio Communication. The Handbook
    is a pocket-sized tome, and is updated and revised each year, but much of the
    information in the old editions is still useful. Another very good read is The
    Art of Electronics by Paul Horowitz and Windfield Hill. Will provide good background
    for general electronics which is important to radio.


    +   3. Online courses: Many schools, notably the Massachusetts Institute of Technology,
    are offering courses for free. This is a great way to learn about these topics
    from top institutions for free. The MIT open courseware site is http://mit.mit.edu/.
    A good course to look into is 6.002.x: Circuits & Electronics.


    iTunes U [http://www.apple.com/education/itunes-u/] also has many recorded lectures
    if you search for radio and electronics courses.'
  - '[PAGE 43]


    # Targets


    As with any other type of reconnaissance or penetration test, it is vital to the
    success of radio reconnaissance to define the targets prior to beginning. The
    end goal of radio reconnaissance, for the purposes of this book, is to gather
    information that will enable either physical or logical penetration.


    There are two basic types of targets. The first is two-way radios used for verbal
    communication, and the second type of targets is devices that use radio frequencies
    to transmit audio or video information.


    | CONTENTS |

    | Two-Way Radios Used for Verbal Communication... 45 |

    | Devices that Use Radio Frequencies........... 46 |


    # TWO-WAY RADIOS USED FOR VERBAL COMMUNICATION


    Radios used for verbal communication have obvious applications for the penetration
    tester. The best example of these types of radios is the walkie-talkies. Monitoring
    the guard radios or other radios used by the target organization''s staff will
    allow the penetration tester to know where guards and staff are physically located,
    and help the penetration tester avoid detection. Monitoring these communications
    can also give you insight into company lingo, employee names, and culture. Be
    aware that it isn''t just guards who use radios to communicate with each other.
    When out and about, look around for radios. You may be surprised to see employees
    of retail establishments, restaurants, and other places frequently using radios
    to communicate. This is in addition to maintenance staff as well as others. Remember,
    it isn''t just guards who can provide you with valuable reconnaissance information
    to discover or call the police during a physical penetration test.


