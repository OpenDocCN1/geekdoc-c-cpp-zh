    > 天线对附近区域内的所有金属物体都很敏感。移动天线通常会对接收效果产生巨大影响。这在高金属框架的隔间、建筑内部、酒店房间等场所中尤为明显。如果在车辆内使用无线电电设备，只需将汽车移动几英寸（几厘米）可能就足以改善接收效果。当然，有时你可能需要完全寻找另一个位置来获取清晰的信号。


    > 某些天线需要地平面才能正常工作并获得最佳信号。天线的说明手册或技术规范应说明是否需要、推荐使用或不需要地平面。如果需要地平面，可以通过将天线放置在大型金属上来创建。如果是在室内，文件柜是一个很好的选择；如果是在户外，请使用车辆的车顶或引擎盖（除非车辆车身是玻璃纤维或塑料制成的）。


    802.11 网络。这种薯薯片“天线”是一种涉及 Pringle 薯片的廉价硬件黑客手段，是这类天线的著名示例，其尺寸和材料恰好适合接收 Wi-Fi 信号。它们在无线电侦测通常覆盖的频率范围内（1
    GHz 以下）并太大用。


    # 调制 (MODULATION)


    调制是用于对无线电传输的语音或数据编码的方法。广来说，调制可以分为模拟或数字。模拟是两者中较早的，但数字调制已经非常成熟，并且由于其许多优势，正在继续扩大其市场份额。数字格式提供更高的音频质量和更可靠的数据传输，可以使用数据压缩和媒体共享，这允许具有更高的发射机密度，并在给定区域内允许同一频率供更多用户使用。


    为了正确收听信号，发射机和接收机必须使用相同的调制类型。在某些扫描仪上，调制类型被称为模式（mode）。


    # 模拟调制


    虽然大多数人对幅度调制（AM）和频率调制（FM）很熟悉，但许多无线电还工作在其他模式下。FM 是美国对渗透测试感兴趣的最常见的调制模式，但了解并理解其他模式也是很有好的。


    # 常见的模拟调制类型


    - AM—幅度调制（Amplitude Modulated）：通过改变无线电波的强度（幅度）将信息编码到载波中。用于 30MHz 以下的频率，用于短波无线电传输、商业
    AM 频段以及飞机通信（如飞机间通信或飞机与塔台通信）。

    - FM—频率调制（Frequency Modulated）：通过改变载波的频率将信息编码到无线电波中。

    - 窄带（FMN）常用于双向无线电系统。它设计用于传输低音频保真度信号，占用的带宽比宽带 FM（FMW）调制少（见下文，后者由广播 FM 电台使用，并在后续讨论）。FMN
    是本书关注重点最流行的格式。除了用于飞飞的 AM 之外，FMN 用于所有在 30MHz 以上频率传输的双向语音流量。

    - FM 宽带（FMW）用于商业 FM 广播电台，因为它可以传输比 FMN 更高保真度的信号。音频保真度的提高是以代价换的，FMW 占用的带宽比 FMN 多。

    - SSB—单边带（Single Sideband）：这种调制通常仅用于 30MHz 以下的短波频率，因为它能更好地利用带宽。它用于双向通信，通常的应用如无线电和船对船通信。广播短波和
    AM 电台不使用 SSB，因为它需要更复杂的无线电，终端用户可能更难调谐。


    # 调制


    > 提示

    如果你计划获取一台覆盖短波频段的无线电，


    # 数字调制


    数字调制技术正变得越来越常见，由于数据压缩。目前很少组织实施加密是因为额外的硬件成本、维护和分发加密密钥的行政开销，以及对加密无线电系统性能的差声誉。许多制造商开发了他们自己的调制方法并将其视为商业秘密，迫使客户从他们那里购买。通常情况下，除非支持该格式的设备，否则是一项耗时的逆向工程工作。


    > 提示

    在渗透测试的实地分析阶段，请务必检查 radioreference.com 数据库中目标常用的音频格式，以验证你的扫描仪是否可以监控它们。


    # APCO P-25


    无线系统使用了不断增加的数字调制类型。然而，目前唯一消费级扫描仪能够解码的标准是 P-25 标准。其他数字调制类型将在第 9 章中介绍。


    Project (P-25) 是公共安全通信官员协会（APCO）制定的一种开放标准，旨在促进公共安全无线系统的互操作性。许多高级无线电功能如数字调制和分组是制造商创建的专有功能。这些功能传统上无法与其他制造商设备运行。这通常使得协调需要多个机构或市的大型救援工作变得困难，因为一个城市或机构使用的无线系统与另一个城市的无线电不兼容。APCO
    P-25 标准是为了解决这些互操作性问题而创建的。P-25 传输可以使用多种标准加密算法进行加密，例如数据加密标准 (DES)、三重 DES (Triple-DES)
    或高级加密标准 (AES)。还支持许多 NSA 生成的加密密码，如 ACCORDIAN、BATON、MAYFLY、Firefly 和 SAVILLE。然而，很少组织实施加密，是因为额外的硬件成本、维护和分发加密密钥的行政开销，以及对加密无线电系统性能的差声誉。


    P-25 标准正在分阶段部署。每个阶段都会增加额外的功能。第一阶段目前正在广泛部署。在此时的


    > 注意

    旧的语音加密系统具有降低无线电系统音质和可靠性的声誉。尽管这些挑战已被现代语音加密系统所克服，但许多用户仍然因为这种坏声誉而避免加密。


