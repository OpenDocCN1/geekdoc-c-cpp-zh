    during the hot season if the grid is under heavy load. Or, they can call to smart
    appliances, such as laundry machines and dishwashers, to schedule them to run
    when energy costs are the cheapest, or when there is a surplus, and avoid running
    when energy is in high demand. The meters, and the infrastructure to support this
    are often wirelessly connected using a variety of protocols, from proprietary
    mesh networks, to Zigbee, to cellular.


    +   - Proprietary links for digital signals, billboards, etc: Generally, billboards
    that have full color displays are updated over cellular cells so they get faster
    speeds. Lower-tech signs like the gas price signs or the LED signs outside of
    banks and use proprietary radio links that are usually 9600 Baud. They are slow,
    but not much data needs to be sent. There are really no standards here. A sign
    made by company A usually can''t be controlled by a controller made by company
    B.


    # SOFTWARE-DEFINED RADIOS (SDRs)


    We are accustomed to think of radios as hardware equipment, made of transistors,
    circuitry, and an antenna. However, it is possible to virtualize any type of electronics
    hardware by emulating it in software. Thus, the software-defined radio (SDR) is
    born. The general design of an SDR is an RF front end which feeds into an analog-digital
    converter (ADC). This digital signal is fed into a general purpose computer for
    processing (Figure 9.5). In some'
  - '[PAGE 128]


    # CHAPTER 9: New Technology


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_128_0.png)


    designs a digital signal processor (DSP) is placed between the ADC and general
    purpose computer to aid in processing the output from the ADC. The RF front end
    varies, but converts the RF signal to a level and format by the Analog-to-Digital
    converter. In a perfect world, you could just plug an antenna into an ADC, but
    in reality you need some front-end hardware to convert the RF to a usable format
    and level.


    SDR is not a new concept, but with FPGAs and other electronics advances, it is
    now cheaper to implement them. Also, thanks to the speed of desktop computers,
    it has become feasible to implement features in software that formerly required
    specialized hardware for performance reasons. With cheaper SDRs, we are entering
    a new golden age of wireless hacking. While many SDRs are still expensive, prices
    are continually dropping, as all electronics. SDRs will be the key to intercepting,
    decoding, and hacking the new digital systems.


    # How does an SDR Differ from a Traditional Radio?


    Software emulation of features traditionally implemented in hardware. Components
    that are usually implemented in hardware in a traditional radio are implemented
    in software in an SDR. The software and processing can run on a general purpose
    computer (personal computer or embedded system). Some use Field Programmable Gate
    Arrays (FPGAs) to assist with processing. Often combination of both FPGA and a
    general-purpose CPU is used.


    Common parts of the radio implemented in software:


    +   - Filters: Making hardware filters that adapt to changes in the signal is
    very complicated and requires a large number of components. This is much simpler
    in software because the filter can be changed easily, based off of characteristics
    of the signal. Because of this, filters are commonly implemented in software.
    Many times RF filters are also implemented in SDRs.'
- md: '

    - Amplifiers: Due to the laws of physics, hardware amplifiers always introduce
    noise when they amplify a signal. Better hardware amplifiers have less noise,
    but noise will still be introduced. Software can amplify a signal without introducing
    noise. The bigger issue here is making sure the signal was sampled at a high enough
    rate so it can be amplified without losing resolution/clarity—generally the higher
    the sample rate, the better the result. It should be noted that many SDRs, the
    RF amplifier in the front end is implemented in hardware, not in software. However
    on higher radios, more of the front end is implemented as SDR; advance these benefits
    will be realized by more readers.

    - Modulators/demodulators: One of the most common parts implemented in software.
    The other components in this list are often still implemented in many models of
    SDR. It is much easier to add new demodulators in software. It is also easier
    to give the end user the capability to adjust the modulators manually, or automatically,
    depending on the signal. Building a hardware demodulator that has the same level
    of flexibility and control is fairly complicated, and therefore an expensive proposition.


    ## Advantages of SDR


    - Cost: By emulating costly hardware components, manufacturers are able to make
    radios with fewer, and cheaper non-specialized components.

    - Rapid development: The great advantage of SDR is to make changes to the radio
    by changing code instead of re-wiring hardware allows for fast prototyping. If
    problems exist, you seldom need to re-wire the hardware; you just need to patch
    the software. Once one produces and distributes the code, anyone can download
    it and run it. With a physical radio there is skill needed to make the radio which
    can decode the signals, some people figure out how to do it.

    - Upgradability: With most obsolete hardware, usually all you can do is replace
    it. A lot of radio hardware still works perfectly, but lacks features or refinements
    that new models offer. With obsolete software, you can upgrade it, and gain new
    features and functionality.

    - Flexibility: SDR provides more features and configuration options than you can
    fit into a single piece of radio hardware.

    - Device consolidation: One piece of well-made and versatile SDR hardware can
    be adapted to do multiple things by loading in new code. In fact, it was necessary
    to build multiple, purpose-built radios—which got large and expensive. Today,
    you can modify a single SDR to perform multiple functions based on the code it
    is running. The flexibility of SDR means we can gain the ability to decode video
    and other data formats such as POCSAG (pagers) by writing new programs. For example
    in open source SDR, such as GNU Radio, there is existing source code for decoding
    two-level and four-level FSK signals. This functionality often costs extra in
    commercial SDR products.

    - Signal capture and advanced analysis. Finally, one of the greatest advantages
    of SDR is the ease with RF signals can be recorded and captured into a file. This
    is great because you can perform extensive analysis on a recorded signal than
    you can with a live signal. Traditional radios require a signal to be present
    in order to perform analysis on it, but with a recorded signal you can go repeatedly
    and analyze it in different ways. This is a huge help when analyzing an unknown
    signal. Traditional radios, at best you could record the audio output of the radio
    and analyze it later.


    ## THE POWER OF RECORDING RAW RF SIGNALS


    ### Offline Analysis of Unknown Data Signals


    For much the reason professional photographers like to show in RAW format, it''s
    always worthwhile to capture the original, unprocessed RF signal whenever you
    can. For analyzing signals, recording is incredibly useful, you no longer need
    to analyze the system, which involves lots of time waiting for a signal. Once
    you capture the transmission, you can take it off and analyze as much as you like.
    Being able to replay the sample multiple times is hugely beneficial.


    On one project, we needed to reverse-engineer the radio signal used to control
    a PLC (Programmable Logic Controller). When we found the frequency of the signal,
    we heard data when we tuned into that channel and decoded it as an FM signal.
    When we fed this signal into a visualization tool we could see it looked like
    a square wave. We might have been able to decode the binary signal right there.
    However, at the time we were not sure how the control signal was encoded over
    the air, whether it was FM encoded, or it was just lucky that it looked like FM
    signal. We captured the raw RF signal, and decoded the FM audio signal.


    When we analyzed the RF signal, we found out it was an FSK encoded signal, and
    could only be decoded from the RF capture. If we had attempted to capture the
    signal just as FM, we would have wasted time, and been forced to re-capture the
    signal, if could get another opportunity.


    The raw capture can also be helpful when analyzing frequency-hopping systems.
    When frequency hopping is occurring it can be very difficult to guess the hopping
    pattern and sync up with it in real time. However if you capture the raw RF signal,
    it is easier to analyze the hopping pattern off-line. Additionally, if you figure
    out the hopping pattern you can always feed the raw RF capture back into GNU Radio
    and decode the traffic. Note when doing this you need to make sure you capture
    all the signal. So if the hopping system is analyzing hops over a 5 MHz range,
    for example, you want to make sure the raw capture is at least 5 MHz width.


    ## WHAT IS AN FSK?


    FSK stands for Frequency-Shift Keying and is a common digital modulation used
    to transmit information wirelessly. To decode FSK signals you need an FSK decoder.
    Decoders come in two types: 2-level and 4-level. These decoders are also called
    slicers.


    A 2-level decoder is a fairly simple circuit to build in hardware (Figure 9b),
    and can be decoded from the RF capture. A 4-level decoder is more complex but
    allows for higher data density. If we had attempted to capture the signal just
    as FM, we would have wasted time, and been forced to re-capture the signal, if
    could get another opportunity.


    ## CHAPTER 9: New Technology


    ### GNU Radio


    GNU Radio is an open source toolkit for building software-defined radios. It is
    released under the GPL license, and features powerful signal processing blocks
    built in C++, connected by glue code written in Python, called graphs. It contains
    a number of pre-built blocks and graphics to decode a wide range of things, from
    broadcast FM to GSM cell phone. Figure 9.7 is a graphical representation of a
    Wide Band FM radio.


    GNU Radio is fairly hardware independent. The Ettus Research Universal Soft-Radio
    Peripheral (USRP) is probably the most popular radio that can be used with it.
    Cost for a complete USRP starts around $800–1000 for USRP1 and a daughter card.
    The price range is mainly determined by which model of daughter card you get.


    To set up Ettus, there is a main chassis that supports daughter boards, which
    allow the radio to transmit and receive on different frequencies. There are different
    USRP models available, designed to allow processing of different amounts of bandwidth,
    offering onboard processing power, and available in USB or Ethernet interfaces.
    The USRP 1 (Figure 9.8) is currently the most popular model with hobbyist and
    penetration testers. It uses a USB 2.0 interface, and can support up to four daughter
    cards. It supports up to 8 MS/s to the host PC. Depending on the daughter board,
    it can receive and transmit over a very wide frequency range.


    ## Disadvantages of SDR


    - Depending on what you want to do, it may require both software abilities and
    a deep understanding of RF.

    - Data decoding features are either expensive (commercial products), or rough
    around the edges (open source still in development).

    - Some SDR hardware can be very expensive.

