    # Squelch


    Squelch is a control that adjusts the amount of signal needed to stop the scanner
    or break audio so so that you can listen to the transmission. If the squelch is
    turned all the way, you will end up with static where there is no signal. Alternatively,
    turning squelch too high can you to miss signals that may be useful. The goal
    is to find a medium where you get as static as possible while still being able
    to receive the signals. On most scanners, squelch is controlled by a knob. Some
    rarely use plus buttons or a rocker. While it is an issue of personal preference,
    the authors prefer knob control over the granularity of adjustment it allows.


    # Scan Button


    Pushing the scan button will cause the scanner to scan its channels for activity.
    Additionally, the scan button can be used to resume scanning if the channel being
    listed is to not of interest.


    # Hold Button


    The hold button will stop a scanner and hold the radio on the current frequency
    or channel. This is helpful if you want to follow a conversation on a single frequency.'
