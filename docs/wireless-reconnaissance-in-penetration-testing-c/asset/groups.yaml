    这导致了我们的第一个重大发现。事实证明使用无线耳机的群体之一是帮助台（helpdesk）。帮助台小组处理密码重置。通过监控他们的耳机，我们可以窃听正在进行的密码重置对话。一旦发生密码重置，我们就要在用户之前抢先用新密码登录。如果我们赢了这场比赛，我们就进入了系统，并拥有了该用户账户拥的所有权限。


    一旦登录，我们确实需要设置一个新密码。与此同时，当合法用户尝试使用帮助台提供的临时密码重置密码时，他们会发现临时密码


    # 第 5 章：现场无线电分析


    帮助台通过电话给给他们的临时密码不起作用，他们需要拨回电话再次重置。这本会让某人察觉到某些不对劲，但人性倾向于假设一个更简单、不那么阴险的问题——例如用户听错了密码，或者简单地归咎于祸首。即使在运行正常的情况下，密码需要重置几次也并不常见。因此，这种行为并没有引起任何怀疑。


    一旦登录并获得有效的 Windows 身份验证令牌，密码是否再次重置就无关了。Windows 身份验证令牌可以使用几个小时。因此，我们可以利用登录作为头部来攻击网络的其余部分。接下来，我们使用本地权限提升漏洞获取对系统的管理权限。一旦我们获得了系统的管理权限，我们就搜索了最近登录过系统的域管理员令牌，并使用它们获取了对公司域的控制。


    然而，如果我们能够获取用户账户列表（例如通过嗅探流量，或在公告板或桌子上找到副本），我们就可以通过尝试多次失败登录直到账户被锁定并需要帮助台重置，从而针对特定的用户账户。通常，锁定账户不需要重置密码，但如果我们继续发送错误的身份验证尝试，导致账户在用户进入之前不断被锁定，最终用户将请求重置密码。因此，与其在那儿等候并听到请求，不如我们触发一个请求。


    通过使用 DTMF（双音频率）解码器将按键时电话的可听声调翻译成代表它们的相应数字，当用户登录并通过耳机检查语音信箱时，我们可以解码他们的语音留言。


    最后，我们发现客户的这些特定耳机在通电时会一直广播——而不只是在通话通话期间。耳机还充当了房间窃听器，如果耳机处于开启状态，它就会传输周围的对话，而人们通常会这样做。


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_80_0.png)


