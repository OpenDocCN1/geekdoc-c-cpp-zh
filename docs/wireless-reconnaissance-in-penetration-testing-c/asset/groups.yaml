    \ arenas. Increasingly, companies are also lease space on an existing trunked\
    \ system, instead of building out their own systems.\n\n## Monitoring Trunked\
    \ Radio Systems\n\nListening in trunked systems is more complex than listening\
    \ to non-trunked systems. The penetration tester is likely familiar with packet\
    \ switching in computer networks, and the operation of the trunked radio system\
    \ is essentially that of a packet switching network. There are scanners specifically\
    \ designed to listen to trunked conversations, and you will need one to effectively\
    \ listen to trunked traffic. Without a trunked-capable scanner, you may be able\
    \ to pick up bits of conversations; however, it is nearly impossible to consistently\
    \ get the entire conversation. The basics of using a trunked-capable scanner are\
    \ covered in Chapter 7.\n\nTrunking systems that can cover a wide area or multiple\
    \ sites can be made up of multiple repeaters. Many states have created trunked\
    \ networks using repeaters that cover the entire site. In trunking each repeater\
    \ or transmitter tower is referred to as a site. Multi-site trunked systems can\
    \ be divided into two categories: simulcast and SmartZone.\n\nIn a multicast system\
    \ a transmission that comes into the system is broadcast by every site in the\
    \ system. In a SmartZone system each unit checks into the nearest site in so the\
    \ sites have a list of all the units using them at any given moment. A SmartZone\
    \ site only broadcasts traffic if a user in the target talkgroup is using that\
    \ specific site.\n\nAn analogy for this to help users familiar with Ethernet networks\
    \ is to imagine a multi-site trunked radio system as an Ethernet hub or switch\
    \ where each port on the hub or switch is a trunking site. In this analogy a system\
    \ would be an Ethernet hub because traffic comes into one port (site) and is broadcast\
    \ out to all the other ports (sites) in the system; it does not matter which talkgroup\
    \ the traffic destined for. All ports (sites) still see the traffic. A SmartZone\
    \ system can be thought of as an Ethernet switch where traffic comes from one\
    \ port (site) destined for a specific talkgroup and is broadcast to the ports\
    \ (sites) where members of that talkgroup are connected.\n\n> TIP\n> Trunking\
    \ capable scanner often has complicated programming functions. The best reference\
    \ for programming your scanner to work with trunked systems is your scanner's\
    \ manual.\n\n## 42 CHAPTER 2: Basic Radio Theory and Introduction to Radio Systems\n\
    \nAs you can imagine, multicast systems make very poor use of valuable channels\
    \ in large and complex systems. If you have a trunked system that spans over a\
    \ state oftentimes there is no reason to broadcast police or fire traffic to all\
    \ the cities in a state. SmartZone systems make much better use of the limited\
    \ number of channels in a large trunked system but only transmitting information\
    \ if a user is in the target talkgroup.\n\nFrom a wireless reconnaissance point\
    \ of view, the types of system used will affect what traffic you can hear, based\
    \ off of which sites you can hear traffic from and which end users are using those\
    \ sites. In a multicast system you will hear all traffic in the trunked system\
    \ no matter which tuner you can monitor. In a SmartZone you will miss traffic\
    \ if there are no users of the talkgroup checked into a tower that is within range.\
    \ The easiest way to avoid this is to be within range of the site that is closest\
    \ to your target. Most likely the talkgroup you are interested in will be near\
    \ your target so units in that talkgroup will be checked into that site.\n\n##\
    \ SUMMARY\n\nFundamental concepts that we have explored in this chapter are essential\
    \ knowledge for the penetration tester. Refer back to this chapter often to develop\
    \ familiarity with these concepts. To review what we've covered:\n\n- Radio Frequency\
    \ (RF) is a large part of the electromagnetic spectrum, from 3000kHz to 300,000MHz.\n\
    - All electromagnetic signals move through a vacuum at the speed of light. Because\
    \ of this, frequency and wavelength are inversely related to each other. Low-frequency\
    \ waves have a high wavelength, and high-frequency waves have a short wavelength.\
    \ If you know the frequency, you can determine the wavelength and vice versa.\n\
    - The SuperHeterodyne design is the most common in modern radios. It consists\
    \ of an antenna that feeds incoming signals into a “head end” (comprised of the\
    \ RF Amplifier, Tuner, and Mixer), and from there is into the Demodulator for\
    \ conversion, amplified by the audio amplifier, and finally output through a speaker.\n\
    - A good antenna is critical to radio performance. The antenna’s length determines\
    \ what frequency it is tuned to; shorter antennas pick up higher frequency waves.\
