    ## 第 9 章：新技术


    ## 超越 802.11——数字无线协议


    ### 数字电子无线通信 (DECT)


    DECT 是一种主要用于无线电话和耳机的格式，它正成为事实上的标准，但也可以发现于其他应用中，例如婴儿监视器。DECT 等工具集是为了拦截和攻击这些系统而构建。DECT
    的当前实现需要一个 Dosch-Amand COM-ON-AIR 类型 2 PCMCIA 卡（图 9.1），该卡是


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_122_0.png)


    图 9.1 Dosch-Amand COM-ON-AIR 卡


    目前非常难找到。关于 DECT 工具集的信息可以在 https://dededect.org/ 找到。


    DECT 支持以名为 DECT 标准密码 (DSC) 的专有算法形式进行加密。通过安全社区的研究发现，由于加密实现较差、随机数生成能力不足以及密钥长度不足，该安全算法已被破解。


    在许多情况下，通过向 DECT 设备注入一个伪装成来自另一个单元的数据包，声称其不支持加密，就可以禁用加密。在回退到明文传输时，它现在会广播未加密的内容，导致通信暴露。这可能在通话过程中发生。


    DECT 这种设计上有缺陷的安全模型是一个漏洞的良好示例，直到人们开始调查它们，该漏洞才被注意到。由于安全研究人员没有查看它们，且在开始时没有考虑安全性，在协议和系统中还有哪些问题没有被注意到呢？


    ## 在实施前评估无线产品的重要性


    这就是为什么在实施新的无线技术之前进行研究至关重要。否则，


    ## 蓝牙


    蓝牙是一种极其常见的技术，存在于几乎手机、大多数笔记本电脑、台式电脑以及越来越多的汽车中。蓝牙在 2.4 GHz 频段使用跳频频谱，该频段也被 WiFi、微波炉和其他大多数
    2.4 GHz 设备使用。蓝牙设备形成一个包含八个节点的微型网络——一个主设备和七个从设备。蓝牙用于设备之间的短期通信，以及外设。通过蓝牙通信的外设数量和种类巨大——无线耳机、键盘、鼠标、游戏控制器、音箱等等。蓝牙主要以传输音频而闻名，例如蓝牙耳机。但它也可以用于连接
    HID 设备（如键盘和鼠标）并发送数据。虽然蓝牙访问点并不流行，但蓝牙 WiFi访问点可以将多个设备连接到网络。


    存在攻击蓝牙的工具，例如 Ubertooth（图 9.2），但蓝牙仍然不是渗透测试的目标。Ubertooth 是一种可以攻击 2.4 GHz 范围内无线系统的自定义无线适配器。它最初是为了攻击蓝牙而设计的，因此命名，但从以后得到了扩展。该项目的主页为
    http://ubertooth.sourceforge.net/。


    Ubertooth 可监测流量、注入流量并进行基础频谱监测。它是一个处于开发中的平台，因此不断增加新功能。它是嗅听蓝牙最便宜（如果最便宜）的方法之一，也是注入自定义数据包最便宜的工具。它降低了攻击蓝牙设备的门槛。


    Ubertooth 的关键在于，很难获取一个消费级蓝牙适配器并让它嗅听和注入自定义帧。对于 WiFi 来说这很容易。几乎任何 WiFi 适配器都可以用于嗅听流量，今天也支持注入。一旦这一点被发现，攻击
    WiFi 就变得便宜得多。迄为止，我们看到的在蓝牙适配器上实现此点的唯一方法是加载商业固件，这可能违反用户许可协议 EULA


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_124_0.png)


    图 9.2 Ubertooth One 适配。经 Meagan Call 许可转载。


