  mdcn: "\n系统部署在大型企业园区、游乐园和体育场馆。如今，公司越来越多地选择租用现有中干系统的空间，而不是建立自己的系统。\n\n## 监控中干无线电系统\n\
    \n在中干系统中进行收听比收听非中干系统更复杂。渗透测试人员可能熟悉计算机网络中的数据包交换，而中干无线电系统的运行本质上就是数据包交换网络。有专门设计用于收听中干对话的扫描仪，你需要一个这样的扫描仪来有效地收听中干流量。如果没有支持中干功能的扫描仪，你可能能够捕获对话的片段，但可能，几乎无法持续地获取整个对话。使用支持中干功能的扫描仪的入门知识将在第\
    \ 7 章中介绍。\n\n覆盖大区域或多个站点的中干系统可以由多个中继器组成。许多州使用覆盖整个站点的中继器建立了中干网络。在中干系统中，每个中继器或发射塔被称为一个“站点”（site）。多站点中干系统可以分为两类：模拟广播（simulcast）和\
    \ SmartZone。\n\n在多播传输系统中，进入系统的传输由系统中的每个站点广播。在 SmartZone 系统中，每个单元接入最近的站点，因此站点拥有在任何给定时刻使用它们的单元列表。SmartZone\
    \ 站点仅当目标小组的用户使用该特定站点时才广播流量。\n\n为了帮助熟悉以太网的用户，这种类比是将多站点中干无线电系统想象成以太网集线器或交换机，集线器或交换机的每个端口都是中干站点。在这个类比中，系统是一个太网集线器，因为进入一个端口（站点）的流量会广播到系统中所有其他端口（站点），无论流量指向哪个小组。所有端口（站点）都能看到流量。SmartZone\
    \ 系统可以被看作是以太网交换机，流量来自一个端口（站点）并指向特定的小组，然后广播到该小组成员连接的端口（站点）。\n\n> 提示\n> 中干功能扫描仪通常具有复杂的编程功能。使你的扫描仪与中干系统工作的最佳参考是你的扫描仪说明书。\n\
    \n正如你想象的，多播系统在大型复杂系统中对可用通道的利用低下。如果你有一个跨越整个州的中干系统，通常没有理由向州的所有城市广播警察或消防流量。SmartZone\
    \ 系统能更好地利用大型中干系统中有限的通道，但仅当用户位于目标小组时才传输信息。\n\n从无线侦察的角度来看，所使用的系统类型将影响你能听到的流量，这取决于从哪些站点听到流量以及哪些终端用户在使用这些站点。在多播系统中，无论你监控哪个调谐器，你都能听到中干系统的所有流量。在\
    \ SmartZone 中，如果没有该小组的用户接入范围范围内的塔塔，你将会错过流量。避免这种情况最简单的方法是处于距离目标最近的站点范围内。你感兴趣的小组可能就在目标附近，因此该小组的单元将接入该站点。\n\
    \n## 总结\n\n我们在本章中探索的基础概念对于渗透测试人员来说是必备知识。经常查阅本章以熟悉这些概念。回顾一下我们涵盖的内容：\n\n- 射频 (RF)\
    \ 是电磁频谱的很大一部分，范围从 3000kHz 到 300,000MHz。\n- 所有电磁信号在真空中以光速传播。因此，频率和波长之间存在反比关系。低频波具有长波长，高频波具有短波长。如果你知道频率，就可以确定波长，反之亦然。\n\
    - 超外差设计（SuperHeterodyne）在现代无线电中最为常见。它由天线组成，将接收信号馈入“前端”（由射频放大器、调谐器和滤波器组成），然后进入解调器进行转换，通过音频放大器放大，最后通过扬声器输出。\n\
    - 良好的天线对无线性能至关重要。天线的长度决定了它调谐的频率；较短的天线接收较高频率的波。波长是天线长度的两倍。要确定天线调谐频率所需的长度，使用公式：\n\
    \  `2 = length of antenna = Frequency (MHz)`\n"
