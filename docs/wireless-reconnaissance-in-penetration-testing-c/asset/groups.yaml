    # PIPE ORGAN ANALOGY


    It can be difficult to think about electromagnetic waves, since they cannot be
    seen or felt. Notably, wave phenomena behave very similarly in other media. For
    example, with sound waves, waves of physical matter (usually air) vibrating we
    see the same relationships between frequency and wavelength. Consider the pipe
    organ. The vibrating pipe creates a vibrating column of air in sympathy with the
    pipe. The pipe has a natural frequency, based on its length, which is tuned to
    a specific note. When energy from the organ causes the pipe to vibrate, it tends
    to vibrate at its natural frequency. The low notes (low frequency) are sounded
    by very long pipes (long wavelength), while the high notes (high frequency) are
    sounded by very short pipes (short wavelength). If the organ is played at full
    volume, more energy is imparted into the pipe, resulting in greater physical distance
    traveled in each cycle, in other words higher amplitude, and a more energetic
    vibration. Keep this image of the pipe organ in mind (Figure 2.2); it will become
    important later on when we discuss antennas and tuning to resonate on a target
    frequency.


