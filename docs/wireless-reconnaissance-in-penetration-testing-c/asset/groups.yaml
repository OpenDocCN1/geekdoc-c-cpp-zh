    # FIGURE 9.8 Ettus USRP1. Reprinted with Permission from Meagan Call


    The WBX daughter card can transmit and receive between 50 and 2200MHz and costs
    $400. The TVRX2 is a receive-only daughter card that covers 50–860 MHz and costs
    $200. The TVRX2 card can also receive two signals at once. Due to the frequency
    ranges they cover, the WBX and TVRX2 cards can receive most signals of interest
    to penetration testers performing wireless reconnaissance.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_133_0.png)


    # FIGURE 9.9 Inside of an Ettus USRP1 with the WBX and RFX2400 Daughter Cards
    Installed. Reprinted with Permission from Meagan Call


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_133_1.png)


    # 140 CHAPTER 9: New Technology


    The RFX2400 and XCVR2450 are two daughter cards which are also popular with penetration
    testers. The RFX2400 (Figure 9.9) can transmit and receive in the 2.3–2.9 GHz
    frequency range which covers the frequencies used by 802.1b/g, Zigbee, and Bluetooth.
    The RFX2400 costs $275. The XCVR2450 expands on the capabilities of the RFX2400
    by adding the ability to transmit and receive in the 4.9–5.9GHz band. This allows
    the card to operate in the frequency used by 802.11a, 802.11n in greenfield mode,
    and cordless phones operating in the 5 GHz band. The XCVR2500 costs $400. If a
    penetration tester has the budget, the authors recommend investing in a USRP1
    chassis with the WBX and XCVR2450 daughter cards.


    ## Example: Using the GNU Radio as a Spectrum Analyzer


    Spectrum analyzers are helpful tools to visualize the RF spectrum. This can be
    helpful when trying to find new signals or seeing how a signal behaves. For example,
    this function can be helpful to spot frequency-hopping spread spectrum radios.
    Issuing the command usr_fft.py followed by the frequency will open a new window
    which is seen in Figure 9.10.


    ## Using GNU Radio as a $20 USB Tuner


    GNU Radio also supports a variety of inexpensive USB tuners. These usually cost
    $20. Look for compatible ones containing the Realtek RTL2832 chipset. Though not
    nearly as powerful as the USRP, they cannot transmit, are limited in their ability
    to process bandwidth, and receiver performance can be poor, but for $20 it’s a
    great joy to experience the power of SDR, and its weaknesses may be lessened as
    better software is developed for the radio.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_134_0.png)


    FIGURE 9.10 FFT Display on GNU Radio


    Dongles with the Elonics E400 tuner have the best performance discovered to date.
    They can tune in frequencies from 64 to 1700 MHz, with some gaps around 1100–1250
    MHz (since frequency band was not in use for television broadcast). They have
    a theoretical sample rate of 3.2MS/s, but as of this writing, they only deliver
    up to 2.8MS/s. Third-party drivers are needed to get them to work with GNU Radio.
    Gz-baz and oscomoc rtl dr are two projects that build these drivers.


    ## WinRADIO


    WinRADIO is one of the most popular consumer SDRs. is a commercially developed
    group of SDRs, and consists of receivers. They come pre-built, so there is no
    assembly required, and start at around $700 and up. Figure 9.11 is the WinRADIO
    G305e receiver. The WinRADIO software that comes with these radios provides the
    ability to decode all analog formats (AM, FM, SSB). Adding capability to decode
    digital formats requires additional software, which costs extra. WinRADIO has
    a polished GUI interface (Figure 9.12), especially when compared to the interface
    on GNU Radio. Most of the WinRADIO software is written for Windows, but there
    is some support for Mac OS and Linux.


    WinRADIO offers a Professional Demodulator option for $200 makes it easy to see
    how signals are demodulated for the various formats it supports, and to adjust
    the filters and processing applied during the demodulation process.


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_135_0.png)


    FIGURE 9.11 WinRADIO G305e Receiver. Reprinted with Permission from Meagan Call


    ![](img/2e4b8b26cfbdeba5a5a91921492f98df_136_0.png)


    FIGURE 9.12 WINRADIO G305 GUI


    When the Demodulator is in Professional Mode, set the Demodulator or on the main
    menu bar, you can open a tool to analyze customize how the signal is demodulated.
    To open this tool click Setup in the demodulator section of WinRADIO. On this
    initial screen (Figure 9.13) a number of variables can be adjusted, how affect
    the signal is demodulated. The audio filter settings can be easily adjusted by
    dragging the edge of the filter. Figure 9.14 shows the filter after it has been
    adjusted. Additionally, on this screen the demodulation settings can be adjusted
    to determine how the signal is demodulated. Figure 9.15 shows the demodulation
    block diagram. By clicking on various points in the block diagram, you can see
    the signal as it is processed.


    ## Software-Defined Radios (SDRs)


    The capabilities of a SDR can be extended by a plug-in architecture called XPS
    (Xtensible Radio Specification), which allows individuals to write their own plug-ins.
    Most of these plug-ins are free, but some cost money. There is also an online
    site at http://xrs.winradio.com where third-party developers can post extensions.
    Some popular examples of these extensions include:


    - APCO P25 Decoders ($99.95–$199.95 on the radio), made by WinRADIO. Note this
    just decodes the APCO P25 digital format to voice and does not provide any trunking
    capabilities. (Trunking is provided by a separate software package; see the section
    on Trunking in Chapter 2 for more information.)

    - Trunking software ($99.95–$199.95, depending on the radio), made by WinRADIO.
    This package allows you to track trunking systems as it switches channels.

    - Advanced Digital ($199.95), made by WinRADIO. This can decode WEFAX, HF Fax,
    Packet Radio, ACARS, CTCSS, and DTMF. CTCSS and DTMF are the most useful for radio
    recon. It also has signal analysis capabilities, which can be used for identifying
    the encoding of an unknown data signal.

