    # Squelch


    Squelch is a control that adjusts the amount of signal needed to stop the scanner
    or break audio so that you can listen to the transmission. If the squelch is turned
    all the way, you will end up with static where there is no signal. Alternatively,
    turning squelch too high can cause you to miss signals that may be useful. The
    goal is to find a medium where you get as static as possible while still being
    able to receive the signals. On most scanners, squelch is controlled by a knob.
    Some rarely use plus buttons or a rocker. While it is an issue of personal preference,
    the authors prefer knob control over the granularity of adjustment it allows.


    # Scan Button


    Pushing the scan button will cause the scanner to scan its channels for activity.
    Additionally, the scan button can be used to resume scanning if the channel being
    listed is not of interest.


    # Hold Button


    The hold button will stop a scanner and hold the radio on the current frequency
    or channel. This is helpful if you want to follow a conversation on a single frequency.


    # Common Scanner Controls and Features


    # Manual Button


    # Program


    Program can be either a button or process followed to program a frequency to a
    channel. The control is different for each radio but is often similar between
    radios by the same manufacturer. The best source of information for instructions
    on using the programming function is the radio owner''s manual.


    # Lockout Button


    The lockout button is used to lock out a channel so that it is not scanned. This
    is especially helpful if a channel has a lot of static for reason, or if you wish
    to ignore a certain channel. A common reason for using the lockout during reconnaissance
    is when there is another user group nearby, such as maintenance, and you are only
    interested in listening to other group, such as the security force. Some radios
    have temporary lockouts which will lock out a channel until the unit is rebooted.


    # Search


    The search feature allows you to program in high and low frequency stops, and
    the scanner will scan the defined range and stop on activity. Some units store
    frequencies where they find activity into scratch memory, sometimes.


    > TIP

    > If you work for a team of penetration testers that will be sharing a scanner
    on or between engagements you should use a standard channel/bank layout so multiple
    teammates can easily use the same device. This will save time when you need to
    setup scanners between engagement and lessen confusion when performing an engagement.


    > TIP

    > When preparing to use a scanner on a new engagement always make sure all locked
    channels are unlocked. This will ensure that channels locked out during the previous
    engagement will not be skipped at the new site.


    ## CHAPTER 7: Basic Overview of Equipment and How it Works


    > TIP

    > A target site has a frequency that is used to communicate with the police, it
    is a good idea to set that as a priority channel. During a penetration test, you
    want to know as soon as possible if the police have been summoned so you can be
    prepared to explain. referred to as "monitor channels." This feature is valuable
    for penetration testers, and is very helpful when looking for a signal in a set
    area. One option to take advantage of this feature is to set up the scanner overnight
    or while you are working on other things, and return to see what the scanner found.
    You can first scan the range and lockout birds or other signals that are not of
    interest. This is much easier than using the search on.


    # Priority


    With the priority, you can set a priority channel. In some scanners, this will
    be a button. In others, it may be a menu-item.


    ## SELECTING A SCANNER


    The most important piece of equipment for reconnaissance is a scanner, and selecting
    the correct scanner can make things much easier. In fact, selecting the correct
    scanner can often mean the difference between success and failure. Many folks
    are tempted to get a top of the line scanner with all the bells and whistles.
    Although this may be fun these extra features often add confusion as you need
    to use it.


    ### Form Factor


    When selecting the scanner first is to figure out what form works for your needs.
    There are variety of form scanners available including handheld (Figure 7.1),
    base scanners (Figure 7.2), and mobile scanners. Many mobile scanners can be used
    as bases, or can be mounted in a vehicle, either hardwired or powered by the car''s
    12V power socket/lighter receptacle. Handheld scanners tend to be small and battery
    powered, and many can use adapters to power the unit and lower operating costs
    if you use the scanner often. For most reconnaissance work, especially the first
    radio, we recommend handheld scanners because they are the most portable and easy
    to power.


    A fourth factor that is starting to become more popular are scanners that only
    be controlled using a computer. These scanners do not have any control on them
    beside a power switch and occasionally volume control. The radios are often just
    a plain metal box or also referred as black box radios. Because these scanners
    require a computer to function they are not a good first radio to reconnaissance
    work.


    # Programmable Verse Pre-Programmed Scanners


    Scanners are available both as pre-programmed units or as programmable units.
    The pre-programmed units are not particularly useful for the purposes of this
    book, and are intended for hobbyists all well automobile racing fans and railroad
    enthusiasts. A pre-programmed scanner may make sense to have


    > TIP

    > Always be sure to bring plenty of batteries. Even if you use rechargeable batteries,
    certain to have non-rechargeable batteries in case the rechargeable batteries
    die. It makes for a bad day to get on site only to discover that you not have
    any battery power left. Also, note that some scanners have a switch to change
    operation between rechargeable and non-rechargeable batteries. Be sure that the
    switch is set correctly.

