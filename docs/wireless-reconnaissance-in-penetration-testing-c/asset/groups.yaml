    # Dedication


    I''d like to start out by thanking Joan Amaratti for believing I could write a
    book all those years ago. I''d also like to thank Ken Stasiak and the SecureState
    family for supporting me throughout the entire writing process. Finally I dedicate
    this book to Meagan Call for being a wonderfully supportive wife through this
    and all my projects.


    --Matt


    I dedicate this book to BNH, ELH, and JAH.


    --Alex


    # Author Biography


    Matt Neely (CISSP and CTGA) is the Director of Research, Innovation and Strategic
    Initiatives at SecureState, a security management consulting firm. SecureState
    Matt leads the Research and Innovation team which focuses on imagining, researching
    and developing new offensive and defensive capabilities. His research includes
    the convergence of physical and logical security, lock and lock picking, cryptography
    and all things wireless.


    Mr. Neely is actively involved in public speaking and has spoken as a subject
    matter expert over seventy-five times at various local, national and international
    conventions and user group meetings including BlackHat EU, DefCon, ShmoooCon,
    Thotcon and Notacon. Mr. Neely also guest lectures at local colleges on topics
    on security and risk management. He is a founding-member of the Cleveland Chapter
    of TOOOL and is a host on the Security Justice podcast.


    Alex Hamerstone is the Compliance Officer for TOA Technologies, an international
    workforce management software company. He is an RABQSA certified ISO27001 Auditor
    and is active in the security community. When he isn''t working or writing, he
    enjoys tinkering with electronics and spending time with his family.


    Alex Sanyk is an IT professional with over twelve years of experience in everything
    from desktop publishing and web design, PC and server hardware, to user support,
    system administration, and software development. In his spare time, he blogs and
    develops video games at his website, csanyk.com.


    # Preface


    Radio waves surround us and more and more devices are being made wireless. Most
    penetration testers focus only on the very small portion of the radio spectrum
    using 802.11 and Bluetooth devices. Physical penetration tests often miss guard
    radios, wireless headsets, wireless cameras, and many other radio devices commonly
    used in the modern corporation. These systems transmit a wealth of information
    derived from performing attackers in a targeted attack.


    The following chapters aim to educate penetration testers on how to find and exploit
    these systems. This book is also a great resource for those who need systems.


    # HOW THIS BOOK IS ORGANIZED


    The best way to read this book is in the order it''s presented, but the chapters
    are structured to assist the reader if reading out of order. When key concepts
    are mentioned which were covered in earlier chapters, the page will reference
    the earlier chapter so the reader can flip back. A glossary is also included at
    the end of the book to help with unfamiliar terms.


    ## Chapter 1: Why Radio Profiling?


    In the first chapter of the book the reader will learn what radio reconnaissance
    is and how it is useful during penetration tests. The chapter concludes with a
    short case study of radio reconnaissance used during a penetration test at a power
    company.


    ## Chapter 2: Basic Radio Theory and Introduction to Radio Systems


    In Chapter 2 the reader will learn the theory behind how radios work and gain
    an introduction to the different radios systems you will encounter while performing
    radio reconnaissance. The chapter starts by discussing basic radio theory. The
    authors cover the terminology needed to understand underlying concepts, give an
    overview of the radio spectrum and discuss how radio waves behave at different
    frequencies. Next, they cover how a radio works and the different components found
    in a radio receiver. After the reader learns how radios work, she will read about
    most important part of radio: the antenna. This part of the chapter starts by
    covering antenna theory and wraps up with a discussion of the most common types
    of antennas one encounter while performing radio reconnaissance during a penetration
    test. After antennas are discussed, the chapter moves on the different ways radios
    encode data (modulation types). This section covers analog, digital and spread
    spectrum modulation types. Next is a rundown of the different types of most commonly
    used radio systems starts by discussing simple duplex radio systems, expands to
    cover repeaters, and concludes with an explanation of trunked radio systems. The
    chapter ends with recommendations on where to learn about radios and radio theory.


    ## Chapter 3: Targets


    In Chapter 3 the reader will learn about some of the different types of targets
    which could be searched for radio reconnaissance. Highlighted targets include
    guard radios, cordless phones and video cameras.


    ## Chapter 4: Offsite Profiling


    The Offsite Profiling chapter covers how to gather as much information as possible
    on a client''s radio systems before arriving onsite. The authors suggest terms
    to use in online searches, how to search the FCC license database, and specialty
    websites that can be used to gather more information on the client''s equipment.
    The chapter concludes with a case study covering the offsite profiling performed
    before a physical penetration test of a ship dock and how the information was
    used during the attack.

