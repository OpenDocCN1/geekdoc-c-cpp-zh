    **图 2.14 鞭形天线，经 Meagan Call 许可转载


    # 第2章：基础无线电理论与无线电系统简介


    是为了天线覆盖宽频率范围而做出的牺牲。这种宽范围也意味着天线在某些频率上可能具有负增益。通常，它们根据天线的长度在特定频率上工作。伸缩鞭形可以根据天线伸缩的程度调谐到多种频率。


    - 偶极：由成直线连接的两根线组成的天线。一根线连接到无线电，另一根连接到地。通常在特定频率上工作。用作底座天线。偶极天线的最大优势是它们设计简单，因此制作廉廉。此外，由于设计简单，它们非常容易在家制作，而且通常是人们自制的天线。


