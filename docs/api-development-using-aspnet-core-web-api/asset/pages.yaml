  md: '# Conclusion


    As a Software Engineer My Opinion about Restful web services are a lightweight
    maintainable and scalable service that is built on the REST Architecture. Restful
    Web service exposes API from your application in a secure uniform stateless manner
    to the calling client can perform predefined operations using the restful service
    the protocols for the REST is HTTP and Rest is a Representational State Transfer.
    Representational state transfer (REST) is a de-facto standard for a software Architecture
    or Interactive applications that use this standard is called RESTful such web
    must provide its web resources in a textual representation and allow them to be
    read and modified with stateless protocol and predefined set of operations this
    standard allow interoperability between a Machine and the Internet that provide
    these services. REST Architecture is alternative to SOAP and SOAP Architecture
    is the way to access a Web Service.


