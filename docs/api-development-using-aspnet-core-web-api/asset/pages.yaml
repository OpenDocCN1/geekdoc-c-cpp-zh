  md: '# What is RESTful Web Service?


    Restful Web services are a lightweight maintainable and scalable service that
    is built on the REST Architecture. Restful Web service exposes API from your application
    in a secure uniform stateless manner to the calling client can perform predefined
    operations using the restful service the protocols for the REST is HTTP and Rest
    is a Representational State Transfer. Representational state transfer (REST) is
    a de-facto standard for a Software Architecture or Interactive applications that
    use Web Service a Web Service that follows this standard is called RESTful web
    web must provide its web resources in a textual representation and allow them
    to be read and modified with stateless protocol and predefined set of operations
    this standard allow interoperability between a Machine and the Internet that provide
    these services. REST Architecture is alternative to SOAP Architecture is the way
    to access a Web Service.


    # RESTful Web Service Features


    Rest Web services come a long way since their inception. In 2002 the Web Consortium
    released the definition of WSDL and SOAP Web services and this formed the standard
    of how web services are implemented in 2004 the web consortium also released the
    definition of an additional standard called RESTful in past four to five years
    this standard has become more popular and being used in many giants like Facebook
    and Twitter Microsoft. REST is a way to access resources that lie in an articular
    environment you could have a server that could be hosting important documents
    or pictures or videos. All these are an example of the resources if a client says
    a web browser needs any of these resources it must send a request to the server
    to access the resources.


    The key features of the RESTful implementation are as follows:


    # Resources


    The first key feature is the resource itself. Let us assume that a web application
    on the server has a record of Persons if we want to access the records of the
    Persons by Id the details are in the given below figure the coding part is also
    given.'
