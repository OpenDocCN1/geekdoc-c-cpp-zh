  md: '# RESTful Client-Server


    This is the most fundamental requirement of the REST Based architecture it means
    that the server will have a RESTful web service that would provide the required
    functionality to the client. The client sends a request to the web service on
    the server would either reject the request on complying and provide adequate response
    to the client,


    ![](img/ecf1b6d3def03c95166d6223c24cb862_17_0.png)


    # Stateless


    The concept of stateless means that it is up to the client to ensure that all
    the required information is provided to the server. This is required so that server
    can process the response appropriately the server should not maintain any soft
    of the information between requests from the client requests the server and the
    server give the response to the client appropriately.


    # Cache


    The Cache concept is to help with the problem of stateless which was described
    in the last point since each client request is independent sometimes the client
    might ask the server for the same request even though it had already asked for
    it in the past. This is even though it had already asked for it in the past. This
    request will go to the server and the server will give a response. This increase
    the traffic across the network cache is the concept implemented on the client
    to store requests which have already been sent to the server so if the same request
    is given by the client instead of going to the server saves the amount of and
    to fro network traffic from the client to the server.


    ![](img/ecf1b6d3def03c95166d6223c24cb862_17_1.png)


    # Layered System


    The concept of a layered system is that any additional layer such as a middleware
    layer can be inserted between the client and the actual server hosting the RESTful
    web service middleware layer is where all the business logic is created this can
    be an extra service created'
