  md: '# Introduction


    In this chapter, we will learn how to deploy the asp.net core 5 websites on a
    server using visual studio 2019.


    # Step 1 Account Setup on Server


    The first step for deployment of asp.net core web API is to create an account
    on the hosting provider website that supports the asp.net web application framework
    and then follow the steps in the given chapter.


    +   - Create a website in the hosting panel.

    - Then Create the SQL Website using the Hosting Panel


    # Step 2 Create the project asp.net Core 5 Web API using Visual Studio


    Create the project using visual studio and select the asp.net core version .Net
    5. Current


    ![](img/ecf1b6d3def03c95166d6223c24cb862_146_0.png)


