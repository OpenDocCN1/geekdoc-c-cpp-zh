    # # Project Structure


    We use a three-tier architecture in this project, with a data access layer, a
    business access layer, and an application presentation layer.


    ![](img/ecf1b6d3def03c95166d6223c24cb862_53_1.png)


    # ## Presentation Layer (PL)


    The Presentation layer is the top-most layer of the 3-tier architecture, and its
    major role is to display the results to the user, or to put it another way, to
    present the data that we acquire from the business access layer and offer the
    results to the front-end user.


    # ## Business Access Layer (BAL)'
