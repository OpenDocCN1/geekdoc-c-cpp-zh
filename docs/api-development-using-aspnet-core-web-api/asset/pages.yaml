  md: '# Why RESTful Service


    Restful Mostly comes into popularity due to the following features.


    +   - Heterogeneous language and environment this is one of the fundamental reasons
    why is same as we have seen for SOAP as well

    - It enables web applications that are built on various programming languages
    to communicate with each other.

    - RESTful web architecture helps the web applications to reside in different environments
    some could be on windows and could be on Linux.

    - RESTful web service offers this flexibility to applications built on various
    programming languages and platforms to talk to each other.


    # RESTful Architecture


    An Application OR Architecture considered RESTful or Rest Style has the following
    Characteristics


    +   - A-State and functionality are divided into distributed resources which means
    that every resource should be accessible via the normal HTTP Commands like getting,
    POST, PUT, DELETE, if someone wanted to get a file from a server, they should
    be able to issue the GET request and we want to put the file on the server, we
    will use either POST or PUT request, and finally, if we want to delete the file
    from the storage, we must use a DELETE request.

    - The architecture is client/server stateless layered and supports the caching.

    - The client-server is the typical architecture where the server can be web server
    hosting the application and the client can be as simple as the web browsers.

    - Stateless means that the state of the application is not maintained in REST


    If we want to delete a resource from a server using the DELETE Command, you cannot
    pass the deleted information to the next request. To ensure that the resources
    you deleted you would need to issue the GET request first to get all the information
    from the server after which one would need to see if the resource was deleted.


    # RESTful Principals and Constraints


    The REST architecture is based on few characteristics which are elaborated below
    any RESTful web service must comply with the below characteristics for it to be
    called RESTful these characteristics are known as design principle which need
    to be filled when working with RESTful architecture.'
  merge: -1
