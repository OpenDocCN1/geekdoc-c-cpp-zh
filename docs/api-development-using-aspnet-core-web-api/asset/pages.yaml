  md: '# Select the Deployment Option.


    Enable GitHub Actions to continuously deploy your app. GitHub Actions is an automation
    framework that can build, test, and deploy your app whenever a new commit is made
    in your repository. If your code is in GitHub, choose your repository here and
    we will add a workflow file to automatically deploy your app to App Service. If
    your code is not in GitHub, go to the Deployment Center once the web app is created
    to set up your deployment.


    ![](img/ecf1b6d3def03c95166d6223c24cb862_133_0.png)


    # Select the Net Working Options


    Web Apps can be provisioned with the inbound address being public to the internet
    or isolated to a Azure virtual network. Web Apps can also be provisioned with
    outbound traffic to reach endpoints in a virtual network, governed by network
    security groups or affected by virtual network routes. By default, your app is
    open to the internet and cannot reach into a virtual network. These aspects can
    also be changed after the app is provisioned.'
  merge: -1
