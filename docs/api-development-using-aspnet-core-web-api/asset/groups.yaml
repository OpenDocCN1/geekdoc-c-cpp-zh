  mdcn: "\n\n添加 DB Set 属性后，我们需要使用程序包管理器控制添加迁移并运行 `Command-Migration` 命令。\n\n`add-migration\
    \ OnionArchitectureV1`\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_78_0.png)\n\
    \n现在执行命令后，你需要通过执行 `update-database` 命令来更新数据库。\n\n## Migration 文件夹\n\n在执行完两个命令后，你可以在领域层（domain\
    \ layer）中看到迁移文件夹。\n\n## Repository 层\n\nRepository 层作为服务层和模型对象之间的中间层，我们在此层中维护所有的数据库迁移和数据库上下文对象（DbContext）。我们将添加包含读写操作数据访问模式的接口。\n\
    \n我们现在开始处理 Repository 层，将遵循与处理领域层相同的步骤，在你的应用程序中添加类项目，并将该项目命名为 Repository 层。\n\n\
    **但在这里我们需要在 Repository 层中添加 Domain 层的项目引用。** 右键点击项目并点击“添加（Add）”按钮，之后将在 Repository\
    \ 层中添加项目引用。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_79_0.png)\n\n## 使用架构在\
    \ Asp.Net Core 中开发 API\n\n现在点击引用（reference）并选择 Domain 层。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_80_0.png)\n\
    \n现在我们需要添加两个文件夹。\n\n- IRepository\n- Repository\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_80_1.png)\n\
    \n### IRepository\n\nIRepository 文件夹包含通用接口，通过此接口我们将为我们所有的实体创建 CRUD（增删改查）操作。\n\n\
    通用接口将扩展 `Base-Entity` 以使用某些属性。泛型接口的代码所示：\n\n```csharp\nusing DomainLayer.Models;\n\
    \nnamespace RepositoryLayer.IRepository\n{\n    public interface IRepository<T>\
    \ where T : BaseEntity\n    {\n        IEnumerable<T> GetAll();\n        T Get(int\
    \ Id);\n        void Insert(T entity);\n        void Update(T entity);\n     \
    \   void Delete(T entity);\n        void Remove(T entity);\n        void SaveChanges();\n\
    \    }\n}\n```\n\n### Repository\n\n现在我们创建一个继承泛型 `IRepository` 接口的泛型 Repository。泛型\
    \ Repository 代码所示：\n\n```csharp\nusing DomainLayer.Data;\nusing DomainLayer.Models;\n\
    using Microsoft.EntityFrameworkCore;\nusing RepositoryLayer.IRepository;\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace RepositoryLayer.Repository\n{\n   \
    \ public class Repository<T> : IRepository<T> where T : BaseEntity\n    {\n  \
    \      #region property\n        private readonly ApplicationDbContext _applicationDbContext;\n\
    \        private DbSet<T> entities;\n        #endregion\n\n        #region Constructor\n\
    \        public Repository(ApplicationDbContext applicationDbContext)\n      \
    \  {\n            _applicationDbContext = applicationDbContext;\n            entities\
    \ = _applicationDbContext.Set<T>();\n        }\n        #endregion\n\n       \
    \ public void Delete(T entity)\n        {\n            if (entity == null)\n \
    \           {\n                throw new ArgumentException(\"entity\");\n    \
    \        }\n            entities.Remove(entity);\n            _applicationDbContext.SaveChanges();\n\
    \        }\n\n        public T Get(int Id)\n        {\n            return entities.SingleOrDefault(c\
    \ => c.Id == Id);\n        }\n\n        public IEnumerable<T> GetAll()\n     \
    \   {\n            return entities.AsEnumerable();\n        }\n\n        public\
    \ void Insert(T entity)\n        {\n            if (entity == null)\n        \
    \    {\n                throw new ArgumentException(\"entity\");\n           \
    \ }\n            entities.Add(entity);\n            _applicationDbContext.SaveChanges();\n\
    \        }\n\n        public void Remove(T entity)\n        {\n            if\
    \ (entity == null)\n            {\n                throw new ArgumentNullException(\"\
    entity\");\n            }\n            entities.Remove(entity);\n        }\n\n\
    \        public void SaveChanges()\n        {\n            _applicationDbContext.SaveChanges();\n\
    \        }\n\n        public void Update(T entity)\n        {\n            if\
    \ (entity == null)\n            {\n                throw new ArgumentNullException(\"\
    entity\");\n            }\n            entities.Update(entity);\n            _applicationDbContext.SaveChanges();\n\
    \        }\n    }\n}\n```\n\n我们将在服务层中使用此 Repository。\n\n## Service 层\n\n此层用于与表现层（presentation\
    \ layer）和 Repository 层通信。服务层持有实体的所有的业务逻辑。在服务层中，接口与其实现是分离的，以实现松耦合和关注点分离。\n\n现在我们需要向解决方案中添加一个新项目作为服务层，我们将遵循在应用程序中添加类项目的相同过程，但在这里添加项目后，还需要进行一些额外工作，即添加\
    \ Repository 层的引用。\n\n## 使用洋葱架构在 Asp.Net Core 中开发 API\n\n我们新的服务层包含了 Repository\
    \ 层的引用。\n\n在服务层中，我们将创建两个文件夹。\n\n- ICustomServices\n- CustomServices\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_84_0.png)\n\
    \n### ICustom Service\n\n现在在 ICustomServices 文件夹中，我们将创建 `ICustomServices` 接口。该接口持有方法的签名，我们将在下方的\
    \ `ICustomServices` 接口代码中实现这些方法：\n\n```csharp\nusing DomainLayer.Models;\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace ServiceLayer.ICustomServices\n{\n \
    \   public interface ICustomService<T> where T : class {\n        IEnumerable<T>\
    \ GetAll();\n        T Get(int Id);\n        void Insert(T entity);\n        void\
    \ Update(T entity);\n        void Delete(T entity);\n        void Remove(T entity);\n\
    \    }\n}\n```\n\n### Custom Service\n\n在自定义服务文件夹中，我们将创建一个继承自 `ICustomService`\
    \ 接口的自定义服务类，自定义服务类代码所示。我们将为所有的实体编写 CRUD 操作。对于每个服务，我们将使用泛型仓库编写 CRUD 操作。\n\n## Department\
    \ Service\n\n```csharp\nusing DomainLayer.Models;\nusing RepositoryLayer.IRepository;\n\
    using ServiceLayer.ICustomServices;\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ ServiceLayer.CustomServices\n{\n    public class StudentService : ICustomService<Student>\n\
    \    {\n        private IRepository<Student> _studentRepository;\n\n        public\
    \ StudentService(IRepository<Student> studentRepository)\n        {\n        \
    \    _studentRepository = studentRepository;\n        }\n\n        public void\
    \ Delete(Student entity)\n        {\n            try\n            {\n        \
    \        if (entity != null)\n                {\n                    _studentRepository.Delete(entity);\n\
    \                    _studentRepository.SaveChanges();\n                }\n  \
    \          } catch (Exception)\n            {\n                throw;\n      \
    \      }\n        }\n\n        public Student Get(int Id)\n        {\n       \
    \     try\n            {\n                var obj = _studentRepository.Get(Id);\n\
    \                if (obj != null)\n                {\n                    return\
    \ obj;\n                }\n                else\n                {\n         \
    \           return null;\n                }\n            } catch (Exception)\n\
    \            {\n                throw;\n            }\n        }\n\n        public\
    \ IEnumerable<Student> GetAll()\n        {\n            try\n            {\n \
    \               var obj = _studentRepository.GetAll();\n                if (obj\
    \ == null)\n                {\n                    return obj;\n             \
    \   }\n                else\n                {\n                    return null;\n\
    \                }\n            } catch (Exception)\n            {\n         \
    \       throw;\n            }\n        }\n\n        public void Insert(Student\
    \ entity)\n        {\n            try\n            {\n                if (entity\
    \ != null)\n                {\n                    _studentRepository.Insert(entity);\n\
    \                    _studentRepository.SaveChanges();\n                }\n  \
    \          } catch (Exception)\n            {\n                throw;\n      \
    \      }\n        }\n\n        public void Remove(Student entity)\n        {\n\
    \            try\n            {\n                if (entity != null)\n       \
    \         {\n                    _studentRepository.Remove(entity);\n        \
    \            _studentRepository.SaveChanges();\n                }\n          \
    \  } catch (Exception)\n            {\n                throw;\n            }\n\
    \        }\n\n        public void Update(Student entity)\n        {\n        \
    \    try\n            {\n                if (entity != null)\n               \
    \ {\n                    _studentRepository.Update(entity);\n                \
    \    _studentRepository.SaveChanges();\n                }\n            } catch\
    \ (Exception)\n            {\n                throw;\n            }\n        }\n\
    \    }\n}\n```\n\n## Result Service\n\n"
