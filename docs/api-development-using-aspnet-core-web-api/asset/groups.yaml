    # # Summary


    Swagger (Open API) is a language-agnostic specification for describing and documenting
    the REST API. Swagger Allows both the Machine and Developer to understand the
    working and capabilities of Machine without direct access to the source code of
    the project the main objectives of swagger (Open API) are to,


    Minimize the workload to connect with Micro services.


    Swagger is the Interface Description Language for describing the RESTful APIS
    Expressed using JSON. Swagger is used to gathering with a set of open-source tools
    to Design build documents and use Restful Web Services Swagger includes automated
    documentation code generation and the generation. Three main components of Swashbuckle
    Swashbuckle.AspNetCoreCore is the Object Model and Middleware to expose swagger
    Document as JSON End Points.


    Swashbuckle.AspNetCore.SwaggerGen Generator that builds Swagger Objects Directly
    from your routes controllers and models this package is combined with swagger
    endpoints middleware to automatically expose the Swagger JSON. Swashbuckle.AspNetCore.UI
    is an Embedded version of the Swagger UI Tool that explains swagger JSON to build
    a highly customizable practical for explaining the Web API Functionality it includes
    a built-in test for the public Methods.'
