    \ 服务\n- 表示层\n- 依赖注入\n- 修改 Program.cs 文件\n- 控制器\n- 输出\n- 结论\n\n# 引言\n\n在本章中，我们将介绍使用\
    \ Asp.Net 6 Web API 的洋葱架构（Onion Architecture）。洋葱架构由 Jeffrey Palermo 于2008年引入，这种架构为我们提供了一种更好的构建应用程序的方法；使用这种架构，我们的应用程序具有更好的测试性、可维护性，并且对数据库和等基础设施的依赖较低。洋葱架构解决了耦合和关注点分离等常见问题。\n\
    \n# 什么是洋葱架构\n\n在洋葱架构中，我们拥有领域层、存储库层、服务层和表示层。洋葱架构解决了我们在企业级应用中面临的耦合和关注点分离的问题。洋葱架构还解决了三层架构和\
    \ N 层架构中遇到的问题。在洋葱架构中，我们的层级之间通过接口进行通信。\n\n# Asp.Net Core Web API 中的洋葱架构\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_70_0.png)\n\
    \n# 洋葱架构中的层\n\n洋葱架构使用了“层”的概念，但它与 N 层架构和三层架构不同。\n\n# 领域层\n\n该层位于架构的中心，我们拥有应用实体，这些是在使用\
    \ Asp.net core 应用开发中使用代码优先（code first）方法的应用模型类或数据库模型类；这些实体用于在数据库中创建表。\n\n# 存储库层\n\
    \n存储库层作为服务层和模型对象之间的中间层；我们在此层中维护所有的数据库迁移和数据库上下文对象（DbContext）。我们将添加包含数据库读写操作数据访问模式的接口。\n\
    \n# 服务层\n\n该层用于与表示层和存储库层通信。服务层持有实体所有的业务逻辑。在这些服务中，为了实现松耦合和关注点分离，接口与其实现类保持分离。\n\n\
    # 表示层\n\n在 API 的情况下，表示层通过 HTTP 请求以 JSON 对象的形式向我们展示数据库的对象数据。但在前端应用的情况下，我们通过消费 API\
    \ 并使用 UI 展示数据。\n\n# 洋葱架构的优势\n\n- 洋葱架构为代码提供了更好的可维护性，因为代码依赖于层。\n- 它为单元测试提供了更好的测试性；我们可以在不同的层中编写独立的测试用例，而不会影响应用程序中的其他模块。\n\
    - 使用洋葱架构，我们的应用程序是松耦合的，因为我们的层之间通过接口进行通信。\n- 领域实体是架构的核心和中心，并且访问数据库和 UI 层。\n- 在运行时将为应用程序提供完整的实现。\n\
    - 外部层永远不依赖于外部层。\n\n# 洋葱架构的实现\n\n现在我们将使用洋葱架构开发该项目。\n\n首先，你需要使用 Visual Studio 创建一个\
    \ Asp.Net Core Web 项目。创建项目后，我们将层添加到项目中；在添加了所有层后，我们的项目结构将如下所示。\n\n# 项目结构。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_72_0.png)\n\
    \n# 领域层\n\n该层位于架构的中心，我们拥有应用实体，这些是在使用 Asp.net core 应用开发中使用代码优先（code first）方法的应用模型类或数据库模型类；这些实体用于在数据库中创建表。\n\
    \n对于领域层，我们需要向应用程序添加类库项目。\n\n右键点击解决方案（Solution），然后点击添加（add）选项。\n\n# 使用洋葱架构在 Asp.Net.Core\
    \ 中开发 API\n\n# Models \n\n首先，你需要添加 Models 文件夹，将用于创建数据库实体。在 Models 文件夹中，我们将创建以下数据库实体。\n\
    \n![](img/ecf1b6d3def03c95166d6223c24cb862_74_0.png)\n\n# BaseEntity（基础实体）\n\n\
    ```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace DomainLayer.Models\n\
    {\n    public class BaseEntity\n    {\n        public int Id { get; set; }\n \
    \       public DateTime CreatedDate { get; set; }\n        public DateTime ModifiedDate\
    \ { get; set; }\n        public bool IsActive { get; set; }\n    }\n}\n```\n\n\
    使用洋葱架构在 Asp.Net Core 中开发 API\n\n# Department（部门）\n\nDepartment 继承自 BaseEntity\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    using System.Text;\nusing System.Threading.Tasks;\n\nnamespace DomainLayer.Models\n\
    {\n    public class Departments : BaseEntity\n    {\n        public string DepartmentName\
    \ { get; set; }\n        public int StudentId { get; set; }\n        public Student\
    \ Students { get; set; }\n    }\n}\n```\n\n# Result（结果）\n\nResult 将继承自 BaseEntity\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel.DataAnnotations;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ DomainLayer.Models\n{\n    public class Results : BaseEntity\n    {\n      \
    \  public string ResultStatus { get; set; }\n        public int StudentId { get;\
    \ set; }\n        public Student Students { get; set; }\n    }\n}\n```\n\n# Students（学生）\n\
    \nStudent 继承自基础实体\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.ComponentModel.DataAnnotations;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace DomainLayer.Models\n{\n    public class\
    \ Student : BaseEntity\n    {\n        public string Name { get; set; }\n    \
    \    public string Address { get; set; }\n        public string Emial { get; set;\
    \ }\n        public string City { get; set; }\n        public string State { get;\
    \ set; }\n        public string Country { get; set; }\n        public int Age\
    \ { get; set; }\n        public DateTime BirthDate { get; set; }\n    }\n}\n```\n\
    \n# SubjectGpa（课程 GPA）\n\nSubject GPA 实体继承自 Base Entity\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\n\nnamespace DomainLayer.Models\n{\n    public class\
    \ SubjectGpas : BaseEntity\n    {\n        public string SubjectName { get; set;\
    \ }\n        public float Gpa { get; set; }\n        public string SubjectPass\
    \ { get; set; }\n        public int StudentId { get; set; }\n        public Student\
    \ Students { get; set; }\n    }\n}\n```\n\n# Data 文件夹\n\n在领域中添加 Data 文件夹，用于添加数据库上下文类。数据库上下文类用于维护底层数据库的会话，通过它可以执行\
    \ CRUD 操作。\n\n右键点击应用程序创建 ApplicationDbContext 类\n\n```csharp\nusing DomainLayer.Models;\n\
    using Microsoft.EntityFrameworkCore;\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n```\n\n\
    ```csharp\nnamespace DomainLayer.Data\n{\n    public class ApplicationDbContext\
    \ : DbContext\n    {\n        public ApplicationDbContext(DbContextOptions<ApplicationDbContext>\
    \ options) : base(options)\n        {\n        }\n        protected override void\
    \ OnModelCreating(ModelBuilder builder)\n        {\n            base.OnModelCreating(builder);\n\
    \        }\n        public DbSet<Student> Students { get; set; }\n        public\
    \ DbSet<Departments> Departments { get; set; }\n        public DbSet<SubjectGpas>\
    \ SubjectGpas { get; set; }\n        public DbSet<Results> Results { get; set;\
    \ }\n    }\n}\n```\n\n"
