    # Stateless


    The concept of stateless means that it is up to the client to ensure that all
    the required information is provided to the server. This is required so that server
    can process the response appropriately the server should not maintain any soft
    of the information between requests from the client requests the server and the
    server give the response to the client appropriately.


    # Cache


