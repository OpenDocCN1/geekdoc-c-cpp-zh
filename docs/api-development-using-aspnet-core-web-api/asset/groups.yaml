  - '[PAGE 67]


    The presentation layer is responsible to give the results to the user against
    every HTTP request. Here we have a controller that is responsible for handling
    the HTTP request and communicates with the business layer against each HTTP request
    get the get data from the associated layer and then present it to the User.


    # Advantages of 3-Tier Architecture


    +   - It makes the logical separation between the presentation layer, business
    layer, and data layer.

    - Migration to a new environment is fast.

    - In This Model, each tier is independent so we can set the different developers
    on each tier for the fast development of applications

    - Easy to maintain and understand the large-scale applications

    - The business layer is in between the presentation layer and data layer the application
    is more secured because the client will not have direct access to the database.

    - The process data that is sent from business layer is validated at this level.

    - The Posted data from the presentation layer will be validated at the business
    layer before Inserting or Updating the Database

    - Database security can be provided by BAL Layer

    - Define the business logic in the BAL Layer and share it among the components
    at the presentation layer

    - Easy to Apply for Object-oriented Concepts

    - Easy to update the data provided quires at DAL Layer


    # Dis-Advantages of 3-Tier Architecture


    +   - It takes a lot of time to build the small part of the application

    - Need Good understanding of Object-Oriented programming


    # Conclusion


    In this chapter, we have learned about 3-tier Architecture and the three-layer
    exchange data between them how we can add the Data Access Layer and Business access
    layer in the project and studied how these layers communicate with each other.


    # Presentation Layer (PL)


    The top-most layer of the 3-Tier architecture is the Presentation layer the main
    function of the layer is to give the results to the user or in simple words to
    present the data that we get from the business access layer and give the results
    to the front-end user.


    # Business Access Layer (BAL)'
