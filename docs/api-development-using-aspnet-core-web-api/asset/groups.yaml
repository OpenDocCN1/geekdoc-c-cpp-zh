    - Output\n- Conclusion\n\n# Introduction\n\nIn this chapter, we will cover the\
    \ onion architecture using the Asp.Net 6 Web API. Onion architecture term introduced\
    \ by Jeffrey Palermo in 2008, this architecture provides us a better way to build\
    \ applications; using this architecture our applications are better testable,\
    \ maintainable and dependable on infrastructures like databases and services.\
    \ Onion architecture solves common problems like coupling and separation of concerns.\n\
    \n# What is Onion architecture\n\nIn onion architecture, we have the domain layer,\
    \ repository layer, service layer, and presentation layer. Onion architecture\
    \ solves the problem that we face during the enterprise applications like coupling\
    \ and separations of concerns. Onion architecture also solves the problem that\
    \ we are confronted in three-tier architecture and N-Layer architecture. In onion\
    \ architecture, our layer communicates with each other through interfaces.\n\n\
    # Onion Architecture in Asp.Net Core Web API\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_70_0.png)\n\
    \n# Layers in Onion Architecture\n\nOnion architecture uses the concept of the\
    \ layer, but it is different from N-layer architecture and 3-Tier architecture.\n\
    \n# Domain Layer\n\nThis layer lies in the center of the architecture where we\
    \ have application entities which are the application model classes or database\
    \ model classes using the code first approach in the application development using\
    \ Asp.net core; these entities are used to create the tables in the database.\n\
    \n# Repository Layer\n\nThe repository layer act as a middle layer between the\
    \ service layer and model objects; we will maintain all the database migrations\
    \ and database context Object in this layer. We will add the interfaces that consist\
    \ of the data access pattern for reading and writing operations with the database.\n\
    \n# Service Layer\n\nThis layer is used to communicate with the presentation and\
    \ repository layer. The service layer holds all the business logic of the entity.\
    \ In this services, interfaces keep separate from their implementation for loose\
    \ coupling and separation of concerns.\n\n# Presentation Layer\n\nIn the case\
    \ of the API, presentation layer presents us the object data from the database\
    \ using the HTTP request in the form of JSON Object. But in the case of front-end\
    \ applications, we present the data using the UI by consuming the APIS.\n\n# Advantages\
    \ of Onion Architecture\n\n- Onion architecture provides us with the better maintainability\
    \ of code because code depends on layers.\n- It provides better testability for\
    \ unit tests; we can write the separate test cases in layers without affecting\
    \ the other module in the application.\n- Using the onion architecture our application\
    \ is loosely coupled because our layers communicate with each other using the\
    \ interface.\n- Domain entities are the core and center of the architecture and\
    \ have access to databases and UI Layer.\n- A Complete implementation would be\
    \ provided to the application at run time.\n- The external layer never depends\
    \ on the external layer.\n\n# Implementation of Onion Architecture\n\nNow we are\
    \ going to develop the project using the Onion Architecture.\n\nFirst, you need\
    \ to create the Asp.Net Core web project using visual studio. After creating the\
    \ project, we will add our layer to the project; after adding all the layers our\
    \ project structure will look like this.\n\n# Project Structure.\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_72_0.png)\n\
    \n# Domain Layer\n\nThis layer lies in the center of the architecture where we\
    \ have application entities for the application model classes or database model\
    \ classes using the code first approach in the application development using Asp.net\
    \ core; these entities are used to create the tables in the database.\n\nFor the\
    \ Domain layer, we need to add the library project to our application.\n\nRight\
    \ click on the Solution and then click on add option.\n\n# API Development in\
    \ Asp.Net.Core Using Onion Architecture\n\n# Models Folder\n\nFirst, you need\
    \ to add the Models folder that will be used to create the database entities.\
    \ In the Models folder, we will create the following database entities.\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_74_0.png)\n\
    \n# Base Entity\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ DomainLayer.Models\n{\n    public class BaseEntity\n    {\n        public int\
    \ Id { get; set; }\n        public DateTime CreatedDate { get; set; }\n      \
    \  public DateTime ModifiedDate { get; set; }\n        public bool IsActive {\
    \ get; set; }\n    }\n}\n```\n\nAPI Development in Asp.Net Core Using Onion Architecture\n\
    \n# Department\n\nDepartment will extend the base entity\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\n\nnamespace DomainLayer.Models\n{\n    public class\
    \ Departments : BaseEntity\n    {\n        public string DepartmentName { get;\
    \ set; }\n        public int StudentId { get; set; }\n        public Student Students\
    \ { get; set; }\n    }\n}\n```\n\n# Result\n\nResult will extend the base entity\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.ComponentModel.DataAnnotations;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ DomainLayer.Models\n{\n    public class Results : BaseEntity\n    {\n      \
    \  public string ResultStatus { get; set; }\n        public int StudentId { get;\
    \ set; }\n        public Student Students { get; set; }\n    }\n}\n```\n\n# Students\n\
    \nStudent will extend the base entity\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.ComponentModel.DataAnnotations;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace DomainLayer.Models\n{\n    public class\
    \ Student : BaseEntity\n    {\n        public string Name { get; set; }\n    \
    \    public string Address { get; set; }\n        public string Emial { get; set;\
    \ }\n        public string City { get; set; }\n        public string State { get;\
    \ set; }\n        public string Country { get; set; }\n        public int Age\
    \ { get; set; }\n        public DateTime BirthDate { get; set; }\n    }\n}\n```\n\
    \n# SubjectGpa\n\nSubject GPA entity will extend the Base Entity\n\n```csharp\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace DomainLayer.Models\n{\n    public class\
    \ SubjectGpas : BaseEntity\n    {\n        public string SubjectName { get; set;\
    \ }\n        public float Gpa { get; set; }\n        public string SubjectPass\
    \ { get; set; }\n        public int StudentId { get; set; }\n        public Student\
    \ Students { get; set; }\n    }\n}\n```\n\n# Data Folder\n\nAdd the Data in the\
    \ domain that is used to add the database context class. The database context\
    \ class is used to maintain the session with the underlying database using which\
    \ you can perform the CRUD operation.\n\nRight click on the application and create\
    \ the class ApplicationDbContext\n\n```csharp\nusing DomainLayer.Models;\nusing\
    \ Microsoft.EntityFrameworkCore;\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n```\n\n\
    ```csharp\nnamespace DomainLayer.Data\n{\n    public class ApplicationDbContext\
    \ : DbContext\n    {\n        public ApplicationDbContext(DbContextOptions<ApplicationDbContext>\
    \ options) : base(options)\n        {\n        }\n        protected override void\
    \ OnModelCreating(ModelBuilder builder)\n        {\n            base.OnModelCreating(builder);\n\
    \        }\n        public DbSet<Student> Students { get; set; }\n        public\
    \ DbSet<Departments> Departments { get; set; }\n        public DbSet<SubjectGpas>\
    \ SubjectGpas { get; set; }\n        public DbSet<Results> Results { get; set;\
    \ }\n    }\n}\n```\n"
