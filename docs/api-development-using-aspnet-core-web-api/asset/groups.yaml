  - "[PAGE 18]\n\nwith a client could interact with before it makes a call to the\
    \ web service. the layered system needs to be transparent so that interaction\
    \ between client and server should Not Be Affected in any way.\n\n# RESTful Web\
    \ Services Interfaces\n\nThis is the underlying technology in the web service\
    \ how RESTful should work. RESTful works on the HTTP web layer and uses the below\
    \ key verb to work with resources on the server. Web Resources were first defined\
    \ on the world wide web as documents of files identified by their URLs today the\
    \ definition is much generic and abstract and includes everything or action that\
    \ can be identified Named Addressed handled or performed any of the way in a RESTful\
    \ web service requests made to a resources URI gives us the response with the\
    \ payload formatted in HTML XML JSON or some format, for example, the response\
    \ can be related resources the most common protocol is HTTP provides following\
    \ HTTP Methods GET, POST, PUT, PATCH, DELETE, CONNECT, OPTIONS AND TRACE.\n\n\
    The HTTP methods details are given below.\n\n+   - **POST** is used to post the\
    \ data from a web server to the database using the RESTful Web Service.\n- **GET**\
    \ is used to get the list of all records from the database either all records\
    \ or based on specific I would like Person ID or employ. \n- **DELETE** is used\
    \ to delete all the records from the database or based on a specific Id.\n- **PUT**\
    \ is used to Replace the record or update a record based on a Specific Id.\n-\
    \ **PATCH** method provides an entity containing the list of changes to be applied\
    \ to the resources requesting using the HTTP Request-URI.\n- **OPTIONS** The options\
    \ method represents a request for information about the communication options\
    \ available on the request/response chain identified by Request-URI.\n- **TRACE**\
    \ The trace method performs a message look back test along the path to the target\
    \ resources providing a useful debugging mechanism."
