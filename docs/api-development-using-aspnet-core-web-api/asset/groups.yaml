    ## What is RESTful Web Service?


    Restful Web services are a lightweight, maintainable and scalable service that
    is built on the REST Architecture. Restful Web service exposes APIs from your
    application in a secure, uniform, stateless manner so the calling client can perform
    predefined operations using the restful service. The protocol for REST is HTTP
    and REST is Representational State Transfer. Representational state transfer (REST)
    is a de-facto standard for a software architecture or interactive applications
    that use Web Service. A Web Service that follows this standard is called RESTful
    web. Web web must provide its web resources in a textual representation and allow
    them to be read and modified with a stateless protocol and a predefined set of
    operations. This standard allows interoperability between a machine and the Internet
    that provide these services. REST Architecture is an alternative to SOAP architecture,
    which is the way to access a Web Service.


    ## RESTful Web Service Features


    REST Web services have come a long way since their inception. In 2002, the Web
    Consortium released the definition of WSDL and SOAP Web services and this formed
    the standard of how web services are implemented. In 2004, the web consortium
    also released the definition of an additional standard called RESTful. In past
    four to five years, this standard has become more popular and is being used in
    many giants like Facebook, Twitter, and Microsoft. REST is a way to access resources
    that lie in an article environment; you could have a server that could be hosting
    important documents or pictures or videos. All these are examples of the resources.
    If a client says a web browser needs any of these resources, it must send a request
    to the server to access the resources.


    The key features of the RESTful implementation are as follows:


    ### Resources


    The first key feature is the resource itself. Let us assume that a web application
    on the server has a record of Persons. If we want to access the records of the
    Persons by Id, the details are in the given figure below; the coding part is also
    given.


    ### Request Verbs


    This describes what you want to do with the resources. Browser issues a GET verb
    to instruct the endpoints it wants to get the data from; POST is used to send
    the data by hitting the endpoints in the Postman or Swagger; and PUT is used to
    update the data and DELETE is used to either soft-delete the record or on a permanent
    basis.


    As shown in the below figure.


    ![](img/ecf1b6d3def03c95166d6223c24cb862_12_0.png)


    ### Request Header


    These are the additional instructions sent with the request; these might define
    the types of the response required or authorization details.


    ### Request Body


    Data is sent with the requested data is normally sent in the request when a POST
    request is made to the REST web service. In a POST call, the client tells the
    REST web service it wants to add a resource to the server, hence the request body
    would have the details of the resources which is required to be added to the server.
    As shown in the below.


    ![](img/ecf1b6d3def03c95166d6223c24cb862_13_0.png)


    ### Response Body


    This is the main body of the response. So in our RESTful API example, if we were
    to query the web service via the GET Request, the server returns the response
    in the JSON format, giving us the details of Persons according to the Person ID.


    ### For Posting the Data


    ![](img/ecf1b6d3def03c95166d6223c24cb862_14_0.png)


    ### Response After Positing the Data into Database


    ### Response Status Codes


    These codes are the general codes that are returned along with the response from
    the web server. The status code details are given in the table below.


    | Code | Response | Description |

    |---|---|---|

    | 1 | 100 - 199 | Informational Response |

    | 2 | 200 - 299 | Successful Response |

    | 3 | 300 - 399 | Redirects |

    | 4 | 400 - 499 | Client Error |

    | 5 | 500 - 599 | Server Error |


    ## RESTful Web Service Methods


    Web Resources were first defined on the world wide web which is much generic and
    abstract and includes everything or action today. The definition is much generic
    and can be identified as named address handled or performed in any way on the
    web. In a RESTful service, making requests to a resource URI gives us the response
    with the payload formatted in HTML, JSON, or some other format. For example, the
    response can be-the-following. The common HTTP methods are GET, POST, PUT, DELETE,
    PATCH, OPTIONS, and TRACE.


    The methods are given below:


    - GET: Used to get data from the server.

    - POST: Used to add data to the server.

    - PUT: Used to update data on the server.

    - DELETE: Used to remove data from the server.

    - PATCH: Used to perform partial updates.

    - OPTIONS: Used to describe the communication options for the resource.

    - TRACE: Used for loop-back testing.


    ![](img/ecf1b6d3def03c95166d6223c24cb862_15_0.png)


    ## Why RESTful Service


    RESTful became popular due to the following features:


    - Heterogeneous environments: RESTful works across different languages and environments.

    - It enables applications built on various languages to communicate.

    - RESTful web service provides flexibility for applications on various platforms.


    ## RESTful Architecture


    The REST architecture is based on the following characteristics:


    - Client-Server: The client-server relationship is a fundamental requirement.

    - Stateless: The server does not maintain any state between requests; the client
    must provide all necessary information.

    - Cacheable: The architecture supports caching to reduce network traffic.

    - Layered System: The architecture can be divided into layers, such as middleware.

    - Uniform Interface: REST provides a uniform way to interact with the server regardless
    of the client.


    ## RESTful Principals and Constraints


    The REST architecture is based on few characteristics which are elaborated below.
    Any RESTful web service must comply with the below to be called RESTful; these
    characteristics are known as design principles.

