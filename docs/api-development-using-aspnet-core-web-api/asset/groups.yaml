    ## 结论


    作为一名软件工程师，我对 Restful Web 服务的观点是：它是基于 REST 架构构建的轻量级、可维护且可扩展的服务。Restful Web 服务以安全、统一、无状态的方式从你的应用程序暴露
    API，以便调用客户端可以使用 restfulful 服务执行预定义的操作；REST 的协议是 HTTP，而 Rest 是表述状态转移（Representational
    State Transfer）。表述状态转移（REST）是软件架构或交互式应用程序的事实标准，使用该标准的被称为 RESTful；此类 Web 必须以文本形式提供其网络资源，并允许通过无状态协议和预定义的操作集进行读取和修改；该标准允许机器与提供这些服务的互联网之间实现互操作。REST
    架构是 SOAP 的替代方案，而 SOAP 架构访问 Web 服务的方法。


