    \n![](img/ecf1b6d3def03c95166d6223c24cb862_148_1.png)\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_148_2.png)\n\
    \n## Publish\n\nWhere are you publishing today?\n\n| Target | Description |\n\
    | :--- | :--- |\n| Azure | Publish your application to the Microsoft cloud |\n\
    | Docker Container Registry | Publish your application to any supported Container\
    \ Registry that works with Docker images |\n| Folder | Publish your application\
