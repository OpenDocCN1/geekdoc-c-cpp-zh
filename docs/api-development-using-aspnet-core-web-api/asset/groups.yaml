  mdcn: "\n\n# 选择部署选项。\n\n启用 GitHub Actions 以持续部署您的应用。GitHub Actions 是一个自动化框架，每当存储库中进行新提交时，它可以构建、测试并部署您的应用。如果您的代码在\
    \ GitHub 上，请在此处选择您的存储库，我们将添加工作流文件以自动将您的应用部署到 App Service。如果您的代码不在 GitHub 上，请在创建\
    \ Web 应用后转到部署中心来设置部署。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_133_0.png)\n\
    \n# 选择网络选项\n\n配置 Web Apps 时，其入站地址可以对互联网公开，也可以被隔离在 Azure 虚拟网络中。Web Apps 还可以配置出站流量以访问虚拟网络中的端点，这些流量受网络安全组管理或受虚拟网络路由的影响。默认情况下，您的应用对互联网开放，且无法访问虚拟网络。这些方面在应用配置后也可以进行更改。\n\
    \n## 选择 Azure 监控选项\n\nAzure Monitor Application Insights 是一种为开发者和 DevOps 专业人员提供的应用程序性能管理\
    \ (APM) 服务。在下方启用它以自动监控您的应用程序。它将检测性能异常，并包含强大的分析工具，帮助您诊断问题并理解用户实际上对您的应用做了什么。\n\n\
