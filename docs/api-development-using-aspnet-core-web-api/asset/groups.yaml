  mdcn: "\n在调用 Web 服务之前，客户端可以与之进行交互。分层系统需要是透明的，以便客户端和服务器之间的交互不会受到任何方式的影响。\n\n## RESTful\
    \ Web 服务接口\n\n这是 Web 服务中 RESTful 工作的底层技术。RESTful 运行在 HTTP Web 层上，并使用以下关键动词与服务器上的资源交互。Web\
    \ 资源最初在万网网上被定义为通过 URL 标识的文件文档。今天，该定义变得更加通用和抽象，包含了所有可以以任何方式被识别、命名、地址、处理或执行的实体或操作。在\
    \ RESTful Web 服务中，对资源 URI 发出的请求将向我们提供格式为 HTML、XML、JSON 或某些格式的负载的响应，例如响应可以是相关资源。最常用的协议是\
    \ HTTP，它提供了以下 HTTP 方法：GET、POST、PUT、PATCH、DELETE、CONNECT、OPTIONS 和 TRACE。\n\nHTTP\
    \ 方法的详情如下：\n\n- **POST** 用于通过 RESTful Web 服务将数据从 Web 服务器发布到数据库。\n- **GET** 用于从数据库中获取所有记录的列表，可以是所有记录，也可以基于特定的个人\
    \ ID 或员工。\n- **DELETE** 用于从数据库中删除所有记录或根据特定 ID 进行删除。\n- **PUT** 用于根据特定 ID 替换或更新记录。\n\
    - **PATCH** 方法提供一个实体，该实体包含应用于使用 HTTP Request-URI 请求的资源更改列表。\n- **OPTIONS** OPTIONS\
    \ 方法表示请求由 Request-URI 标识的请求/响应链上可用通信选项的信息。\n- **TRACE** Trace 方法沿目标资源路径执行消息回溯测试，提供了一种实用的调试机制。\n\
    \n## 在 Asp.net Core Web API 中创建你的第一个 RESTful Web 服务\n\n步骤 1：首先，在 Visual Studio\
    \ 中创建 Asp.net Core Web API。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_19_0.png)\n\
    \n什么是 REST 架构\n20\n\n## 配置你的新项目\n\n步骤 2：在你的解决方案（Solution）中添加新项目，例如用于业务访问层和数据访问层的\
    \ Asp.net Core 类库。\n\n## 添加新项目\n\n什么是 REST 架构\n\n## 添加 BAL（业务访问层）和 DAL（数据访问层）后\n\
    \n数据访问层中的所有数据以及所有增删改（Cr）操作都在数据访问层。对于业务逻辑，我们有业务访问层，我们在其中执行所有与业务相关的操作。\n\n## 数据访问层\n\
    \n下面的图片是根据我们的初始步骤构建的项目结构。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_21_0.png)\n\
    \n步骤 3：首先，在数据访问层中添加 Person 模型。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_21_1.png)\n\
    \n代码如下：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Text;\nusing System.ComponentModel.Annotations;\nusing System.ComponentModel.Annotations.Schema;\n\
    namespace DAL.Model\n{\n    [Table(\"Persons\", Schema = \"dbo\")] \n    public\
    \ class Person\n    {\n        [Key]\n        [DatabaseGenerated(DatabaseGeneratedOption.Identity)]\n\
    \        public int Id { get; set; }\n\n        [Required]\n        [DisplayName(Name\
    \ = \"UserName\")]\n        public string UserName { get; set; }\n\n        [Required]\n\
    \        [DisplayName(Name = \"Password\")]\n        public string Password {\
    \ get; set; }\n\n        [Required]\n        [DisplayName(Name = \"UserEmail\"\
    )]\n        public string Email { get; set; }\n\n        [Required]\n        [DisplayName(Name\
    \ = \"CreatedOn\")]\n        public DateTime CreatedOn { get; set; } = DateTime.Now;\n\
    \n        [Required]\n        [DisplayName(Name = \"IsDeleted\")]\n        public\
    \ bool IsDeleted { get; set; } = false;\n    }\n}\n```\n\n步骤 4：为你你想要执行的所有操作添加接口。\n\
    \n## 代码如下：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing\
    \ System.Text;\nusing System.Threading.Tasks;\n\nnamespace DAL.Interface\n{\n\
    \    public interface IRepository<T>\n    {\n        public Task<T> Create(T _object);\n\
    \        public void Update(T _object);\n        public IEnumerable<T> GetAll();\n\
    \        public T GetById(int Id);\n        public void Delete(T _object);\n \
    \   }\n}\n```\n\n什么是 REST 架构\n\n## 步骤 5：在你添加的 Repository 类中应用 Repository 模式。\n\
    \n![](img/ecf1b6d3def03c95166d6223c24cb862_24_0.png)\n\n## 代码如下：\n\n```csharp\n\
    using DAL.Data; \nusing DAL.Interface; \nusing DAL.Model; \nusing System;\nusing\
    \ System.Collections.Generic; \nusing System.Linq;\nusing System.Text;\nusing\
    \ System.Threading.Tasks;\nnamespace DAL.Repository\n{\n    public class RepositoryPerson\
    \ : IRepository<Person>\n    {\n        ApplicationDbContext _dbContext;\n   \
    \     public RepositoryPerson(ApplicationDbContext applicationDbContext)\n   \
    \     {\n            _dbContext = applicationDbContext;\n        }\n        public\
    \ async Task<Person> Create(Person _object)\n        {\n            _dbContext.AddAsync(_object);\n\
    \            await _dbContext.SaveChangesAsync();\n            return _object;\n\
    \        }\n        public void Update(Person _object)\n        {\n          \
    \  _dbContext.Update(_object);\n            _dbContext.SaveChanges();\n      \
    \  }\n        public IEnumerable<Person> GetAll()\n        {\n            return\
    \ _dbContext.Persons.ToList();\n        }\n        public Person GetById(int Id)\n\
    \        {\n            return _dbContext.Persons.FirstOrDefault(x => x.Id ==\
    \ Id);\n        }\n        public void Delete(Person _object)\n        {\n   \
    \         _dbContext.Remove(_object);\n            _dbContext.SaveChanges();\n\
    \        }\n    }\n}\n```\n\n## 步骤 6\n\n添加 Data 文件夹，并在所有项目中添加 SQL Server 包。\n\n\
    ![](img/ecf1b6d3def03c95166d6223c24cb862_25_0.png)\n\n然后在 API 项目中引用包。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_26_0.png)\n\
    \n现在修改解决方案中的 Start-up 类。\n\nStart-up 文件的代码如下：\n\n```csharp\nusing BAL.Service;\n\
    using DAL.Data;\nusing DAL.Interface;\nusing DAL.Model;\nusing DAL.Repository;\n\
    using Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Hosting;\nusing\
    \ Microsoft.AspNetCore.Mvc;\nusing Microsoft.EntityFrameworkCore;\nusing Microsoft.Extensions.Configuration;\n\
    using Microsoft.Extensions.DependencyInjection;\nusing Microsoft.Extensions.Hosting;\n\
    using Microsoft.OpenApi.Models;\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Threading.Tasks;\n\nnamespace AspNetCOREWebAPrud\n\
    {\n    public class Startup\n    {\n        private readonly IConfiguration _configuration;\n\
    \        public Startup(IConfiguration configuration)\n        {\n           \
    \ _configuration = configuration;\n        }\n\n        // 此方法由运行时调用，用于向容器添加服务。\n\
    \        public void ConfigureServices(IServiceCollection services)\n        {\n\
    \            services.AddDbContext<ApplicationDbContext>(options =>\n        \
    \        options.UseSqlServer(_configuration.GetConnectionString(\"DefaultConnection\"\
    )));\n            services.AddControllers();\n            services.AddHttpClient();\n\
    \            services.AddTransient<IRepository<Person, RepositoryPerson>>();\n\
    \            services.AddTransient<PersonService, PersonService>();\n        \
    \    services.AddControllers();\n            services.AddSwaggerGen(c =>\n   \
    \         {\n                c.SwaggerDoc(\"v1\", new OpenApiInfo { Title = \"\
    AspNetCoreWebAPICrud\", Version = \"v1\" });\n            });\n        }\n\n \
    \       // 此方法由运行时调用，用于配置 HTTP 请求管道。\n        public void Configure(IApplicationBuilder\
    \ app, IWebHostEnvironment env)\n        {\n            if (env.IsDevelopment())\n\
    \            {\n                app.UseDeveloperExceptionPage();\n           \
    \     app.UseSwagger();\n            }\n            app.UseSwaggerUI(c =>\n  \
    \          {\n                c.SwaggerEndpoint(\"/swagger/v1/swagger.json\",\
    \ \"AspNetCoreWebAPICrud v1\");\n            });\n            app.UseHttpsRedirection();\n\
    \            app.UseRouting();\n            app.UseAuthorization();\n        \
    \    app.UseEndpoints(endpoints =>\n            {\n                endpoints.MapControllers();\n\
    \            });\n        }\n    }\n}\n```\n\n然后在你的 Application Db Context 类中添加\
    \ DB Set 属性。\n\n"
