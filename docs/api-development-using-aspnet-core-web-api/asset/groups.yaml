    点击保存设置 (Save the Setting)


    ![](img/ecf1b6d3def03c95166d6223c24cb862_154_1.png)


    ## 现在点击发布 (Publish)


    但在发布之前，请检查你的应用程序是否已处于发布（Release）模式，且 Webhost 环境应处于生产（Production）模式。


    ![](img/ecf1b6d3def03c95166d6223c24cb862_155_0.png)


