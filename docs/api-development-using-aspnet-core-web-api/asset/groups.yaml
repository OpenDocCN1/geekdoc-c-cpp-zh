    ## 什么是 RESTful Web 服务？


    RESTful Web 服务是一种基于 REST 架构的轻量级、可维护且可扩展的服务。RESTful Web 服务以安全、统一且无状态的方式暴露您应用程序的
    API，以便调用客户端可以使用 RESTful 服务执行预定义的操作。REST 的协议是 HTTP，而 REST 代表“表述状态转移”（Representational
    State Transfer）。表述状态转移（REST）是使用 Web 服务的软件架构或交互式应用程序的事实标准。遵循此标准的 Web 服务被称为 RESTful
    Web。Web 必须以文本形式提供其网络资源，并允许通过无状态协议和预定义的操作集对其进行读取和修改。该标准允许提供这些服务的机器与互联网之间实现互操作。REST
    架构是 SOAP 架构的替代方案，后者是访问 Web 服务的一种方式。


    ## RESTful Web 服务的特性


    REST Web 服务自诞生以来取得了巨大进步。2002 年，网页联盟（Web Consortium）发布了 WSDL 和 SOAP Web 服务的定义，这构成了
    Web 服务实现的标准。2004 年，网页联盟还发布了名为 RESTful 的额外标准定义。在过去的四五年里，这一标准变得越来越流行，并被 Facebook、Twitter
    和 Microsoft 等许多巨头使用。REST 是访问 Web 环境中资源的方式；您可能有一个托管重要文档、图片或视频的服务器。所有这些都是资源的示例。如果客户端表示浏览器需要这些资源中的任何一个，它就必须向服务器发送请求以访问这些资源。


    RESTful 实现的关键特性如下：


    ### 资源


    第一个关键特性是资源本身。假设服务器上的 Web 应用程序有一条人员（Persons）的记录。如果我们想通过 Id 访问人员记录，详情见下方的图表；同时也给出了代码部分。


    ### 请求动词（Request Verbs）


    这描述了您想对资源执行的操作。浏览器发出 GET 动词来指示它想要获取数据的端点；POST 用于通过点击 Postman 或 Swagger 中的端点来发送数据；PUT
    用于更新数据，而 DELETE 用于逻辑删除记录或永久删除。


    如下所示。


    ![](img/ecf1b6d3def03c95166d6223c24cb862_12_0.png)


    ### 请求头（Request Header）


    这些是随请求一同发送的额外指令；它们可能定义了所需的响应类型或授权详情。


    ### 请求体（Request Body）


    在向 REST Web 服务发送 POST 请求时，随请求发送的数据通常在请求体中发送。在 POST 调用中，客户端告诉 REST Web 服务它想向服务器上添加一个资源，因此请求体将包含需要添加到服务器的资源详情。如下所示。


    ![](img/ecf1b6d3def03c95166d6223c24cb862_13_0.png)


    ### 响应体（Response Body）


    这是响应的主体。因此，在我们的 RESTful API 示例中，如果我们通过 GET 请求查询 Web 服务，服务器将以 JSON 格式返回响应，根据人员
    ID 为我们提供人员详情。


    ### 用于发布数据


    ![](img/ecf1b6d3def03c95166d6223c24cb862_14_0.png)


    ### 将数据发布到数据库后的响应


    ### 响应状态码


    这些代码是与 Web 服务器的响应一同返回的通用代码。状态码详情见下表。


    | 代码 | 响应 | 描述 |

    |---|---|---|

    | 1 | 100 - 199 | 信息性响应 |

    | 2 | 200 - 299 | 成功响应 |

    | 3 | 300 - 399 | 重定向 |

    | 4 | 400 - 499 | 客户端错误 |

    | 5 | 500 - 599 | 服务器错误 |


    ## RESTful Web 服务方法


    Web 资源最初定义在万维网上，它非常通用且抽象，包含了今天的今天或操作。该定义非常通用，可以被识别为在 Web 上以任何方式处理或执行的命名地址。在 RESTful
    服务中，对资源 URI 发起请求将带有以 HTML、JSON 或其他格式格式化的负载的响应。例如，响应可以是。常见的 HTTP 方法有 GET、POST、PUT、DELETE、PATCH、OPTIONS
    和 TRACE。


    方法所示所示：


    - GET：用于从服务器获取数据。

    - POST：用于向服务器添加数据。

    - PUT：用于更新服务器上的数据。

    - DELETE：用于从服务器上删除数据。

    - PATCH：用于执行部分更新。

    - OPTIONS：用于描述资源的通信选项。

    - TRACE：用于环回测试。


    ![](img/ecf1b6d3def03c95166d6223c24cb862_15_0.png)


    ## 为什么选择 RESTful 服务


    RESTful 变得流行是因为以下特性：


    - 异构环境：RESTful 跨不同的语言和环境工作。

    - 它允许基于各种语言构建的应用程序进行通信。

    - RESTful Web 服务为各种平台上的应用程序提供了灵活性。


    ## RESTful 架构


    REST 架构基于以下特性：


    - 客户端-服务器：客户端-服务器关系是一项基础要求。

    - 无状态：服务器之间不维护任何状态；客户端必须提供所有必要信息。

    - 可缓存：架构支持缓存以减少网络流量。

    - 分层系统：架构可以分为多个层，例如中间件。

    - 统一接口：REST 提供了一种无论客户端如何与服务器交互的统一方式。


    ## RESTful 原则与约束


    REST 架构基于以下几个特性，并在下方阐述。任何 RESTful Web 服务都必须遵守以下规定才能被称为 RESTful；这些特性被称为设计原则。


    '
