    \ 服务的完整流程。这是测试和记录你的 Web 服务最简单且美的方法。Postman 是一个用于 API 开发的协作平台。Postman 的功能简化了构建\
    \ API 的每一个步骤并优化了协作，让你能够更快速地创建更好的 API。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_104_0.png)\n\
    \n# 如何使用 Postman 在 Asp Net 5 中测试 API 服务\n\n在 Postman API 测试中，专业的方法是使用 API 请求集合（Collection）来收集如\
    \ GET、PUT、POST、DELETE 请求的响应。打开 postman，点击 Create Collection（创建集合）。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_104_1.png)\n\
    \n在 Postman 中命名该集合。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_105_0.png)\n\n\
    集合已准备好，用于收集 API 请求响应。\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_105_1.png)\n\
    \n使用 Postman 进行 API 测试\n\n# 添加像 PUT、POST、DELETE 和 GET 这样的 API 请求响应，\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_106_0.png)\n\
    \n我们将针对本文的用例进行测试。在本文中，我将测试 Web 的 POST、GET、PUT、DELETE 和 UPDATE 端点。\n\n![](img/6d3def03c95166d6223c24cb862_106_1.png)\
    \ 在此示例中，我们将使用开发的 Asp.Net Core 5 测试 Web 服务。\n\n# 在 Postman 中测试 Post 调用\n\n在这里我们将发送带有属性的\
    \ JSON 对象：\n\n```json\n{\n  \"username\": \"string\",\n  \"userPassword\": \"\
    string\",\n  \"userEmail\": \"string\",\n  \"createdOn\": \"2021-04-16T20:41.0622\"\
    ,\n  \"isDeleted\": true\n}\n```\n\n使用 Postman 进行 API 测试\n\n![](img/6d3def03c95166d6223c24cb862_108_0.png)\
    \ 现在点击 Raw 并选择 JSON。如果我们想在数据库中创建新用户，我们必须将 JSON 对象发送到端点，然后通过 Postman UI 发布到端点，从而在数据库中创建完整的用户对象。\n\
    \n![](img/6d3def03c95166d6223c24cb862_108_1.png)\n![](img/6d3def03c95166d6223c24cb862_109_0.png)\
    \ 现在你可以看到 API 给我们的服务器响应，这表明我们使用 Postman 在数据中已创建了新记录。\n\n# 在 Postman 中测试 Delete\
    \ 调用\n\n为了删除用户，我们在数据库中有一个单独端点，我们必须将 JSON 对象发送到端点，然后通过 Postman UI 发布到控制器的 DELETE\
    \ 调用，从而从数据库中删除。在删除记录时，选择 body 并传递要从数据库删除的 id 值。\n\n![](img/6d3def03c95166d6223c24cb862_110_0.png)\
    \ 我们针对指定的邮箱删除记录，如果 API 服务器响应为 true，则我们的记录已成功删除。\n\n![](img/6d3def03c95166d6223c24cb862_110_1.png)\
    \ 在上面的图片中，你可以看到点击 Delete 端点后服务器响应为 true，这表明我们的记录已从数据库中删除。\n\n# 在 Postman 中测试 Get\
    \ 调用\n\n如果我们想从数据库中获取所有用户的记录，我们将使用 Postman 调用 Web 服务的 GET 点，服务器请求完成后，我们的 GetAllPerson\
    \ 端点将向我们提供所有数据。\n\n![](img/6d3def03c95166d6223c24cb862_111_0.png) 点击端点从数据库中获取所有记录。\n\
    \n![](img/6d3def03c95166d6223c24cb862_111_1.png)\n\n# 在 Postman 中测试 Put 调用\n\n\
    在 Web 服务成功执行后，我们在数据库中以 JSON 对象的形式可见记录，数据库中只有一条记录，因此在 put 调用中我们将更新数据库记录。我们有单独的端点通过点击\
    \ UPDATE 点根据用户邮箱更新数据库的用户记录并发送到控制器，在控制器中我们有根据用户邮箱更新数据库记录的单独端点。\n\n我们将更新数据库中给定的\
    \ JSON 对象：\n\n```json\n{\n  \"id\": 0,\n  \"username\": \"Mudassar Ali Khan\"\
    ,\n  \"userPassword\": \"17859345\",\n  \"userEmail\": \"mudassarali@gmail.com\"\
    ,\n  \"createdOn\": \"2021-04-16T20:41:15.433Z\",\n  \"isDeleted\": false\n}\n\
    ```\n\n到下面的 JSON 对象：\n\n```json\n{\n  \"username\": \"Sardar Mudassar Ali Khan\"\
    ,\n  \"userPassword\": \"17859345\",\n  \"userEmail\": \"mudassarali@gmail.com\"\
    ,\n  \"createdOn\": \"2021-04-16T20:41:15.4332Z\",\n  \"isDeleted\": false\n}\n\
    ```\n\n![](img/6d3def03c95166d6223c24cb862_112_0.png) 我们已 API JSON 响应发送到 PUT 端点以更新数据库中的记录。\n\
    \n![](img/6d3def03c95166d6223c24cb862_113_0.png) 在成功提交数据后，你可以看到服务器响应为 true，这表明我们的数据已成功提交到数据库。\n\
    \n![](img/6d3def03c95166d6223c24cb862_113_1.png)\n\n# 结论\n\n作为一名软件工程师，我对 Postman\
    \ 的结论是它是测试 restful API 的最佳 Open API。作为一名开发者，我有使用 Postman 测试 restful API、发送完整 JSON\
    \ 对象并以专业方式获取的良好体验。它很容易在 Asp.net core Web API 项目中实现，配置完成后开发者可以享受 API 的魅力。\n\n#\
