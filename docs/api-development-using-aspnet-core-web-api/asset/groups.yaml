    \ Section now it's time to deploy your website Now go to solution explorer in\
    \ visual studio 2019.\n\n## Application Deployment on Server\n\nRight Click on\
    \ your Project and select the option to publish.\n\nClick the Publish option a\
    \ new window will appear now select the project publication here you have 5 to\
