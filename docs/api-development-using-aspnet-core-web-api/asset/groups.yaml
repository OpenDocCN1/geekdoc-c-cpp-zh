- md: "\nAfter Adding the DB Set property we need to add the migration using the package\
    \ manager console and run the Command-Migration.\n\n`add-migration OnionArchitectureV1`\n\
    \n![](img/ecf1b6d3def03c95166d6223c24cb862_78_0.png)\n\nAfter executing the commands\
    \ now, you need to update the database by executing the update-database Command.\n\
    \n## Migration Folder\n\nAfter executing both commands now you can see the migration\
    \ folder in the domain layer.\n\n## Repository Layer\n\nThe repository layer act\
    \ as a middle layer between the service layer and model objects we will maintain\
    \ all the database migrations and database context Object in this layer. We will\
    \ add the interfaces that consist of data access pattern for reading and writing\
    \ operations with the database.\n\nWe now will work on Repository Layer we will\
    \ follow the same project as we did for the Domain layer add the library project\
    \ in your applicant and give a name to that project Repository layer.\n\n**But\
    \ here we need to add the project reference of the Domain layer in the repository\
    \ layer.** Right click on the project and click the Add button after that we will\
    \ add the project references in the Repository layer.\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_79_0.png)\n\
    \n## API Development in Asp.Net Core Using Architecture\n\nClick on reference\
    \ now and select the Domain layer.\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_80_0.png)\n\
    \nNow we need to add the two folders.\n\n- IRepository\n- Repository\n\n![](img/ecf1b6d3def03c95166d6223c24cb862_80_1.png)\n\
    \n### IRepository\n\nIRepository folder contains the generic interface using this\
    \ interface we will create the CRUD operation for all our entities.\n\nGeneric\
    \ Interface will extend the Base-Entity for using some properties. The Code of\
    \ the generic interface is given below.\n\n```csharp\nusing DomainLayer.Models;\n\
    \nnamespace RepositoryLayer.IRepository\n{\n    public interface IRepository<T>\
    \ where T : BaseEntity\n    {\n        IEnumerable<T> GetAll();\n        T Get(int\
    \ Id);\n        void Insert(T entity);\n        void Update(T entity);\n     \
    \   void Delete(T entity);\n        void Remove(T entity);\n        void SaveChanges();\n\
    \    }\n}\n```\n\n### Repository\n\nNow we create the Generic repository that\
    \ extends the Generic IRepository Interface. The Code of the generic repository\
    \ is given below.\n\n```csharp\nusing DomainLayer.Data;\nusing DomainLayer.Models;\n\
    using Microsoft.EntityFrameworkCore;\nusing RepositoryLayer.IRepository;\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace RepositoryLayer.Repository\n{\n   \
    \ public class Repository<T> : IRepository<T> where T : BaseEntity\n    {\n  \
    \      #region property\n        private readonly ApplicationDbContext _applicationDbContext;\n\
    \        private DbSet<T> entities;\n        #endregion\n\n        #region Constructor\n\
    \        public Repository(ApplicationDbContext applicationDbContext)\n      \
    \  {\n            _applicationDbContext = applicationDbContext;\n            entities\
    \ = _applicationDbContext.Set<T>();\n        }\n        #endregion\n\n       \
    \ public void Delete(T entity)\n        {\n            if (entity == null)\n \
    \           {\n                throw new ArgumentException(\"entity\");\n    \
    \        }\n            entities.Remove(entity);\n            _applicationDbContext.SaveChanges();\n\
    \        }\n\n        public T Get(int Id)\n        {\n            return entities.SingleOrDefault(c\
    \ => c.Id == Id);\n        }\n\n        public IEnumerable<T> GetAll()\n     \
    \   {\n            return entities.AsEnumerable();\n        }\n\n        public\
    \ void Insert(T entity)\n        {\n            if (entity == null)\n        \
    \    {\n                throw new ArgumentException(\"entity\");\n           \
    \ }\n            entities.Add(entity);\n            _applicationDbContext.SaveChanges();\n\
    \        }\n\n        public void Remove(T entity)\n        {\n            if\
    \ (entity == null)\n            {\n                throw new ArgumentNullException(\"\
    entity\");\n            }\n            entities.Remove(entity);\n        }\n\n\
    \        public void SaveChanges()\n        {\n            _applicationDbContext.SaveChanges();\n\
    \        }\n\n        public void Update(T entity)\n        {\n            if\
    \ (entity == null)\n            {\n                throw new ArgumentNullException(\"\
    entity\");\n            }\n            entities.Update(entity);\n            _applicationDbContext.SaveChanges();\n\
    \        }\n    }\n}\n```\n\nWe will use this repository in our service layer.\n\
    \n## Service Layer\n\nThis layer is used to communicate with the presentation\
    \ and repository layer. The service layer holds all the business logic of the\
    \ entity. In this service interfaces are kept separate from their implementation\
    \ for loose coupling and separation of concerns.\n\nNow we need to add a new project\
    \ to our solution that will be the service layer we will follow the same process\
    \ for adding the library project in our application but here we need some extra\
    \ work after adding the project we need to add the reference of the Repository\
    \ Layer.\n\n## API Development in Asp.Net Core Using Onion Architecture\n\nOur\
    \ new service layer contains the reference of the repository layer.\n\nIn the\
    \ service layer, we will create the two folders.\n\n- ICustomServices\n- CustomServices\n\
    \n![](img/ecf1b6d3def03c95166d6223c24cb862_84_0.png)\n\n### ICustom Service\n\n\
    Now in the ICustomServices folder, we will create the ICustomServices Interface\
    \ this interface holds the signature of the method we will implement these methods\
    \ in the customs service code of the ICustomServices Interface given below.\n\n\
    ```csharp\nusing DomainLayer.Models;\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace\
    \ ServiceLayer.ICustomServices\n{\n    public interface ICustomService<T> where\
    \ T : class {\n        IEnumerable<T> GetAll();\n        T Get(int Id);\n    \
    \    void Insert(T entity);\n        void Update(T entity);\n        void Delete(T\
    \ entity);\n        void Remove(T entity);\n    }\n}\n```\n\n### Custom Service\n\
    \nIn the custom service folder, we will create the custom service class that inherits\
    \ the ICustomService interface code of the custom service class given below. We\
    \ will write the crud for all our entities. For every service, we will write the\
    \ CRUD operation using generic repository.\n\n## Department Service\n\n```csharp\n\
    using DomainLayer.Models;\nusing RepositoryLayer.IRepository;\nusing ServiceLayer.ICustomServices;\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
    using System.Threading.Tasks;\n\nnamespace ServiceLayer.CustomServices\n{\n  \
    \  public class StudentService : ICustomService<Student>\n    {\n        private\
    \ IRepository<Student> _studentRepository;\n\n        public StudentService(IRepository<Student>\
    \ studentRepository)\n        {\n            _studentRepository = studentRepository;\n\
    \        }\n\n        public void Delete(Student entity)\n        {\n        \
    \    try\n            {\n                if (entity != null)\n               \
    \ {\n                    _studentRepository.Delete(entity);\n                \
    \    _studentRepository.SaveChanges();\n                }\n            } catch\
    \ (Exception)\n            {\n                throw;\n            }\n        }\n\
    \n        public Student Get(int Id)\n        {\n            try\n           \
    \ {\n                var obj = _studentRepository.Get(Id);\n                if\
    \ (obj != null)\n                {\n                    return obj;\n        \
    \        }\n                else\n                {\n                    return\
    \ null;\n                }\n            } catch (Exception)\n            {\n \
    \               throw;\n            }\n        }\n\n        public IEnumerable<Student>\
    \ GetAll()\n        {\n            try\n            {\n                var obj\
    \ = _studentRepository.GetAll();\n                if (obj == null)\n         \
    \       {\n                    return obj;\n                }\n              \
    \  else\n                {\n                    return null;\n               \
    \ }\n            } catch (Exception)\n            {\n                throw;\n\
    \            }\n        }\n\n        public void Insert(Student entity)\n    \
    \    {\n            try\n            {\n                if (entity != null)\n\
    \                {\n                    _studentRepository.Insert(entity);\n \
    \                   _studentRepository.SaveChanges();\n                }\n   \
    \         } catch (Exception)\n            {\n                throw;\n       \
    \     }\n        }\n\n        public void Remove(Student entity)\n        {\n\
    \            try\n            {\n                if (entity != null)\n       \
    \         {\n                    _studentRepository.Remove(entity);\n        \
    \            _studentRepository.SaveChanges();\n                }\n          \
    \  } catch (Exception)\n            {\n                throw;\n            }\n\
    \        }\n\n        public void Update(Student entity)\n        {\n        \
    \    try\n            {\n                if (entity != null)\n               \
    \ {\n                    _studentRepository.Update(entity);\n                \
    \    _studentRepository.SaveChanges();\n                }\n            } catch\
    \ (Exception)\n            {\n                throw;\n            }\n        }\n\
