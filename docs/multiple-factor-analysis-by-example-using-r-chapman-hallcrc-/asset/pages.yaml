    # 2.3 Questioning


    Our example is a classic case: data from an opinion poll. The first step is to
    examine the differences in the different categories. First and foremost, the investigator
    will be interested in the answers to specific questions such as how many people
    like a given politician or how many students found a course (statistics) useful,
    and so on. The second stage is to examine the relationships between pairs of variables.
    We might ask questions such as are favourite politicians linked to given professions
    or attitudes to nuclear power related to attitudes to justice. The contingency
    table, constructed by crossing the responses to two questions, is the most common
    tool for analysing surveys and opinion polls.


    These two steps can be used to study the variability of respondents from both
    a one-dimensional and two-dimensional point of view. They are'
