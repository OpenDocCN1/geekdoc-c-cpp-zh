  md: '# Factors Common to Different Groups of Variables


    the construction of a principal component for each variable. This is indeed the
    case in standardised PCA, and it is precisely this property which should be transposed
    when simultaneously analysing several groups of variables.


    # 6.1.2 Factors Common to Several Groups of Variables


    Here we are therefore looking for the synthetic variables which are the most closely
    linked to the groups of variables. A synthetic variable, that is to say closely
    linked to each group, is referred to as a common factor (in that it is common
    to all groups). We can also imagine a factor to only certain groups and even a
    factor specific to only one group. This would make it possible to specify the
    general objective of studying relationships between sets of variables: we look
    for factors which can be:


    +   - Common to all groups of variables

    - Common to only some groups

    - Specific to one single group


    Much as in PCA, once these factors have been obtained, they are studied using
    representations:


    +   - Of individuals; fundamentally, a common factor is a structure on all the
    individuals; opposing two groups of individuals, for example.

    - Of variables (correlation circle); the question is: which variables in each
    group correspond (that is to say, related) to this structure on the individuals?


    # 6.1.3 Back to the Orange Juices


    Let us illustrate the concept of common factor using the Orange Juice data (see
    Section 1.1:0) for which we have two groups of variables: the seven sensory descriptors
    and the eight chemical measurements. In connecting these two types of data, we
    first calculate between-group correlation coefficients for which we have an idea
    prior to the calculation. Thus:


    +   - (sour taste, pH) = .85; this result is to be expected: the lower the pH,
    the more acidic the solution and the more we can expect acidic or sour assessments.

    - (sweet taste, sucrose) = .77, this result is also expected: the higher concentration
    of sucrose is, the more we expect sweet assessments.


    It must be specified that these relationships can only be expected with all other
    things being equal. In this data


    +   (A) The products were chosen according to a technical variable (pasteurisation
    level) and their origin (Florida/other). A choice like this will'
