- img_proc: true
  md: '# Comparing Clouds of Partial Individuals


    Property 2

    This representation uses factorial axes $N_I$ which have already been interpreted.
    $N_I$ and $N^*_I$ are analysed within the same context. This is highly important
    for users and in practice proves a decisive advantage (compared to a methodology
    implementing different methods and thus generating different factorial planes
    depending on the various aspects of an issue):


    +   - Firstly in terms of time and energy spent on the interpretation (only one
    system of axes is interpreted)

    - Then in terms of conclusions: when faced with many planes of representation
    from which one should draw our conclusions? That of the weighted PCA on $N_I$
    or that of the Procrustes analyses on $N^*_I$?


    Property 3

    Using the principal axes of $N_I$ induces relations of duality (also known as
    transition relations) between what is happening in $\mathbb{R}^K$ on the one hand,
    and in $\mathbb{R}^L$. This property is described below.

    Let $F^s_i$ be the vector of coordinates of points $i^j$ on the axis of rank $s$.
    By definition:


    $F^s_i = \hat{X}_i \mu_s$.


    Due to duality (the weighted PCA of $N_I$):


    $u_s = \frac{1}{\sqrt{\lambda_s}} G_s$.


    By combining these two equations, we obtain:


    $F^s_i = \frac{1}{\sqrt{\lambda_s}} \hat{X}_i M_s$.


    The coordinates of the partial points can be calculated from the variables'' coordinates.
    For partial individual $i^j$, this relationship, is expressed simply due to the
    unusual structure of matrix $\hat{X}_i$ which contains only 0, except for the
    data related to group $j$. Therefore, by denoting the coordinate of $i^j$ on $u_s$
    by either $F^s_j(i)$ or $F^s_i(j)$


    $F^s_j(i) = F_s(i^j) = \frac{1}{\sqrt{\lambda_j}} \sum_{k \in K_j} x_{ik} G_s(k)$.


    Thus, for the axis of rank $s$, up to a coefficient (the same for all the individuals),
    the coordinate of $i^j$ is the mean of the coordinates of the variables of group
    $j$ weighted by the values (centred and generally reduced) of $i$ for these variables
    (these weights can also be negative). In other words, partial individuals (relative
    to group $j$) are on the side of the variables (of group $j$) for which'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'they have a high value, opposite those variables (group j) for which

    they have a low value. This relationship is the restriction to the variables of

    group j of one of the usual transition relations of the weighted PCA of N_l

    (see Section 1.5.4). This is the origin of the partial transition relations, a

    property vital for interpreting the analyses.


    If we express the usual transition relation (for point i and therefore all of

    the variables), we obtain


    ```

    $F_s(i) = \sum_j F_s(i^j) = \frac{1}{J} \sum_j j F_s(i^j)$.

    ```


    By relating the partial points (with J coefficient), point i appears

    at the barycentre of J partial points $i^j$, which makes it much easier to read

    the graphs. It must be noted that, when calculating the barycentre, all of the

    J partial individuals ($i^j=j$) are of the same weight, which is logical

    g the desire to balance out the influence of the groups (the weight of the

    variables have been taken into account in calculating the coordinate of $i^j$).


    Natrically, the symmetric transition relation, which expresses the coordinate

    of a variable of group j in terms of the coordinates of the partial individuals

    ni^j$, does not exist (such a relation only exists in the PCA of group j)

    and would be undesirable as it is incompatible with a representation of

    the variables of different groups on any single graph.


    # 5.3 Application to the Six Orange Juices


    For the mean individuals, Figure 5.5 is exactly the same as Figure 4.4 (the per-

