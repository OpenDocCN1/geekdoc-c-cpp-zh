    } i} = \frac{(OH_i)^2}{(OM_i)^2} = cos^2(\overline{OM_i}, u_s)$.

    ```


    For one point, this indicator can be added over a number of axes (in the same
    as inertia percentages), making it possible to measure the representation quality
