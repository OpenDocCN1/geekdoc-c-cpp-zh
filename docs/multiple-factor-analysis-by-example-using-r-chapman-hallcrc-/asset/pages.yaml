  md: '# Hierarchical Multidid Factor Analysis


    The hierarchy is entered by the argument H, which defines a list containing as
    many terms as partitions. The first of these terms corresponds to the finest partition
    which, like in MFA, is described by the number of variables of each group (in
    the example, the first group contains two variables, the second only the third
    and so). The next term describes the next partition, using the same principle
    applied to the groups of the previous partition. In the example, this second partition
    creates a first group which brings together the first two groups of the previous
    hierarchical level and a second group which brings together the last two.


    The type of group is specified in the argument type which is endowed with a sequence
    of characters (as in MFA: "c" = unreduced quantitative group; "s" = standardised;
    "n" = qualitative group) of the finest partition.


    It is possible to make group, however it is in the hierarchical tree. These labels
    are brought together in a list (attributed to name.group) with the same structure
    as that defined the hierarchy (attributed to H). The two groups of the second
    partition are called Sor.Nap.1 and Sor.Nap.2.


