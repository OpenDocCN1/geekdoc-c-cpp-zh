    # 7.6.3 Example of an Indscal model via MFA (cards)


    A simple example can be used to illustrate the estimation of the parameters of
    the Indscal model via the MFA. There are two planar configurations of four individuals
    (see Figure 7.4) or, in other words, groups of two quantitative variables each
    (the horizontal X and vertical Y coordinates; see Table 7.3). Here we use the
    MFA terminology: individuals and groups (the model stimuli and subjects, respectively).


    This example is illustrated by a real experiment conducted with children. Two
    children were presented with a set of cards (depicting different shapes and colours.
    Each child was asked to arrange the cards on the table by placing those they considered
    similar close together, and placing those that they considered very far apart.
    The layout of the cards was summarised using coordinates after choosing an appropriate
    reference.


    These data were constructed using an Indscal model with two orthogonal dimensions.
    It is therefore unsurprising that the MFA ‘finds’ this model. The advantage of
    this example lies in the interpretation of certain results of the MFA as parameters
    of the Indscal model. In this MFA the variables are not standardised, so as to
    respect the initial distances. The estimations of the parameters are represented
    on a graph in Figure 7.5.


    TABLE 7.3

    | Cards. Dataᵃ | X1 | Y1 | X2 | Y2 |

