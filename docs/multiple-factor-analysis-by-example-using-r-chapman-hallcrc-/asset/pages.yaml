    derives directly from a more homogeneous distribution of inertia in this group.


    Remark

    In the Orange Juice data, the variables are quantitative. In the presence of qualitative
    variables, in the above reasoning the PCA should be replaced by multiple correspondence
    analysis (MCA). When the less-detailed partition includes mixed groups, PCA is
    then replaced by factorial analysis of mixed data (FAMD).


    # 10.4 Representing Partial Individuals


    # 10.4.1 Method


    In MFA the partial cloud (of individuals) associated with group $j$ (denoted $N_l^j$)
    is obtained by projecting the mean cloud ($N_l$) on the subspace (of $R^K$) generated
    by the variables of group $j$ alone. The same principle is used in HMFA with the
    groups'' roles played by the nodes. Thus, the partial cloud'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# Multiple Factor Analysis by Example Using R


    of node $n$ (denoted $N_i^n$, it is made up of partial individuals denoted $i^n$)
    is the projection of $N_i$ on the subspace generated by the variables which depend
    on node $n$ alone.


    The representation of cloud $N_j^n is obtained in the same way as for MFA, that
    is to say, by projection on the principal axes of $N_j$. This representation benefits
    from the same properties as in MFA, the partial transition relation which expresses
    the coordinate of point $i^n$ according to the coordinates of the variables depending
    on node $n$.


    The notations from MFA (see Section 5.2) are adapted to HMFA.


    $K_n$: Variables dependent on node $n$.


    $F_s^n$: Factor of rank $s$ partial to node $n$. This factor contains the coordinates
    of the partial individuals on the axis of $s$ (of mean cloud $N_i$). Its ith term
    is denoted $F_{si}^{(n)}$ or $F_s^{(n)}$ interchangeably.


    $M$: (Diagonal) Metric in $\mathbb{R}^K$ for the overall analysis. Unlike in MFA,
    the weights ($p_i$) of the variables from a group defined by a given node are
    not generally identical.


    With these notations, the partial transition relation of the MFA (see Section
    5.2) is introduced directly:


    ```

    $F_s^n(i^n) = \frac{1}{\sqrt{K_s}} \sum_{k \in K_s} x_{ik} p_k G_s(k)$.

    ```


    The interpretation rule resulting from this relation is the same as for MFA: on
    the graphs, partial individual $i^n$ is on the side of the variables (of node
    $n$) for which it has a high value and opposite the variables (of node $n$) for
    which it has a low value. The only difference between the two relations is the
    presence of weights of variables ($p_i$) which are not generally constant within
    a node.


    On the MFA graphs, the mean point $i$ is at the barycenter of the partial individuals
    (hence the name mean point). To obtain this property, cloud $N_j^n$ is dilated
    with the $J$ coefficient (see Section 5.2).


    This property can be transposed to HMFA as follows: each partial point $i^n$ must
    be the barycenter of the partial points which are directly dependent on node $n$.
    In the example of the orange juices:


    +   - Mean point $i$ must be at the barycenter of its partial points characterisation
    and hedonic assessments.

    - Partial point $i$ characterisation must be at the barycenter of its partial
    points chemical and sensory.


    In HMFA, this property is obtained by dilating clouds $N_j^n$. For the $j$ nodes
    dependent on the root node, dilation is conducted in the same way as in MFA, using
    the $J$ coefficient. For the other nodes, it is important to account for the dilations
    associated with the nodes that link to the root node.


    Thus, in the Orange Juice example, the partial points chemical and sensory must
    be dilated with coefficient 2 so that the partial point characterisation'
