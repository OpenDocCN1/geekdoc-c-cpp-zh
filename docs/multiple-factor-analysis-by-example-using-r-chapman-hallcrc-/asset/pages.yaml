  md: '# 11


    # Matrix Calculus and Euclidean Vector Space


    This book uses several elements of algebra, specifically matrix calculus and the
    notion of spaces endowed with a distance (or a metric). To help users avoid having
    to read a general algebra book, we have grouped these elements together. These
    examples do not need to be read in any particular order, that each one uses elements
    of the other.


    # 11.1 Matrix Calculus


    # Definitions


    A matrix is a set of numbers organised in a rectangular table. It is generally
    denoted by a capital letter (for example, X). These terms (= elements = entries)
    are denoted using indices, the first being that of the rows (for example, $A_{12}$,
    at at the crossing of the first row and the second column).


    The dimensions of a matrix are given in brackets (for example, matrix $A(n, p)$
    has $n$ rows and $p$ columns). If $n = p$, the matrix is square.


    In a symmetric square matrix $A_{ij} = A_{ji}$. In a diagonal matrix $A_{ij} =
    0$ if $i \neq j$. A diagonal matrix with nonzero terms equal to 1 is called an
    identity matrix. A vector corresponds to a matrix with only one column (a column
    matrix).


    # Transposition


    Let us consider a matrix denoted $X$ with $n$ rows and $p$ columns. Transposition-(matrix),
    denoted $X''$, is obtained by writing the values of the rows of $X$ in the columns
    of $X''$. The matrix $X''$ thus possesses $p$ rows and columns.


    # Matrix Multiplication


    Let us consider two matrices $X(n, p)$ and $Y(p, q)$ in which the number of columns
    of $X$ is equal to the number of rows of $Y$. The multiplication of these two
    matrices, denoted $XY$, is a matrix $A$, with $n$ rows and $q$ columns, and for
    which the general term $A_{ij}$, at the crossing of row $i$ and column $j$, is
    the scalar product between the vector containing the terms of the $i$th row'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Multiple Factor Analysis by Using R


    X and the vector containing the terms of the jth column of Y. Thus


    ```

    $A_{ij} = \sum X_{ik}Y_{kj}$.

    ```


    The (usual) scalar product between two vectors $u$ and $v$ (denoted $\u, \v$)
    is obtained by multiplying the corresponding matrices (also denoted $\u$ and $\v$),
    the first having been transposed.


    ```

    $(u, v) = u''v''$.

    ```


    Matrix multiplication can therefore be seen as a juxtaposition of scalar products.
    In statistics, we encounter this when the scalar product matrix is calculated
    between individuals $X(n, p)$ be the data table in which $n$ individuals are described
    by $p$ variables. The rows of $X$ correspond to the transposition of the column
    vectors, $XX''$ is therefore the same as calculating the scalar products of each
    individual with each of others. Indeed, the general term $XX''$, the crossing
    of row $i$ and column $l$, the scalar product between individuals $i$ and $l$.
    On the diagonal, we therefore obtain the squared norms of the individuals.


    The other matrix multiplication which commonly used in statistics is $X''X$. It
    juxtaposes the scalar products between the vectors representing the variables.
    When the variables are centred (and standardised, respectively), the $X''X$ matrix
    contains the covariances (and correlation coefficients, respectively) between
    the variables (up to a coefficient $n$) and only when the individuals are positioned
    on the diagonal of diagonal matrix $D$. When the individuals are not of the same
    weight, with these weights the covariance matrix is is written $X''DX$ (the variables
    are centred).


    In factorial analysis, clouds of points are often projected onto axes. When the
    coordinates of point $i$ are in the $i$th row of matrix $X$, we calculate all
    of the coordinates of the projections of points $i$ on unit vector $u$ by conducting
    matrix multiplication $Xu$ (where here is clearly interpreted as a juxtaposition
    of scalar products).


    The matrix multiplication is associative:


    ```

    $ABC = (AB)C = A(BC)$.

    ```


    To conduct matrix multiplication among three matrices, two of them (adjacent)
    are first multiplied together and then the result of this multiplication is multiplied
    by the third.


    The transpose of a multiplication of two matrices is equal to the multiplication
    of the two transpose matrices, with their order in the multiplication being inverted:
    $(AB)'' = B''A''$.


    # Trace of a Square Matrix


    The trace of a square matrix $A$ is the sum of its diagonal elements. It is denoted
    trace (A).'
