    # 2.8.3 MCA/PCA Comparison for Ordinal Variables


    The categories of the variables in this data are ordered. As we have already said,
    this characteristic is sufficiently confirm to warrant further comment; in particular,
    such variables can also be considered as quantitative and thus processed using
    PCA. This example is the opportunity to compare these two approaches.


    PCA only considers linear relationships. In the space of functions on $1 (\mathbb{R})$,
    a quantitative variable is represented by a vector; the relative positions of
    variables are limited to their angle (the cosine of which geometrically represents
    the correlation coefficient). In MCA, qualitative variables are represented by
    the same number of positions as categories. The relative positions of two variables
    can be of various patterns. This corresponds well to the notion of relationships
    between qualitative variables which are much more complex, or from another point
    of view, much richer, than the linear relationships between quantitative variables.


    In MCA, emphas nonlinear relationships is generalised in concrete terms by:


