    \ = \\lambda_s u_s$\n\nthat leads to\n\n> $XMX'DXMu_s = \\lambda_s XMu_s$.\n\n\
    Thus, as $F_s = XMu_s$:\n\n> $XMX'DF_s = \\lambda_s F_s$.\n\n$F_s$, the $s$th\
    \ factor on $I_s$, is like, $v_s$, an eigenvector of $XMX'D$ associated with the\
    \ eigenvalue $\\lambda_s$. These two vectors are collinear. The squared norm of\
    \ $F_s$ is $\\lambda_s$ and $v_s$ is standardised. Thus\n\n> $v_s = \\frac{1}{\\\
    sqrt{\\lambda_s}}F_s$.\n\nThe linear combination of categories, as a factor of\
    \ $\\mathbb{R}^\text{K}$ on which $N_l$ is projected (that is, $u_s$), yields\
    \ a function on $I$ ($F_s$) collinear to vector $v_s$ of $\\mathbb{R}^1$ on which\
    \ $N_k$ is projected.\n\nThis clearly expresses the duality between the two analyses:\
    \ the function on $I$ (in terms of the average of the squared correlation ratios)\
    \ to all of the variables corresponds to the dimension of maximum variability\
    \ the cloud of individuals. This is the same as in PCA (if we replace correlation\
    \ ratio with *correlation coefficient*). This is the basis for simulta-interpreting\
    \ the representations of $N_j$ and $N_\text{k}$. In MCA, this duality is expressed\
    \ in a particularly remarkable way. In Calculating $G_s$, we express the link\
    \ between $v_s$ and $F_s$,\n\n> $G_s = X'Dv_s = \\frac{1}{\\sqrt{\\lambda_s}}X'DF_s$.\n\
    \nFor the $k$th coordinate, we obtain (as $F_s$ is centered:\n\n> $G_s(k) = \\\
    frac{1}{\\sqrt{\\lambda_s}} \\frac{1}{p_k} \\sum_i p_i y_{ik} F_s(i)."
