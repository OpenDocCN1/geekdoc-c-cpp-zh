    number of categories of the qualitative variable.


    Indicator $Lg$ identifies a weaker common structure between the two codings for
    the weight: the qualitative variable better reproduces the raw data in case of
    length and width. The fact that these two variables have categories geometrically
    increases $Lg$ in this case. In comparison, the $RV$ indicator brings into perspective
    the importance of the common structure through the number of categories of the
    qualitative variable: it indicates that the images of the individuals given by
    the two codings are closer for weight. These two points of view are not contradictory:
    the qualitative coding with more than two categories makes it possible to highlight
    nonlinear relationships, which are invisible with quantitative variables (in factorial
    analysis).'
