    In this application on real data, we can see the drawback of GPA in the ²⁻ᵗ data.
    In fact, the advantage of GPA resides in the superimposed representation. The
    mean cloud is merely an intermediary calculation and its use as a mean lead.


    On the other hand, the superposed representation of the MFA distorts the partial
    clouds as mapping® in which each taster fights to find its exact nap (on the factorial
    plane). This is problematic in an application such Section 5.5. This is the origin
    of Procrustes MFA (PMFA), from which the mean configuration of the MFA, connects
    a Procrustes rotation of each partial configuration on this configuration.


    For example, Figure 9.8 shows the resulting graph for MFA of nappe 8 and 9. This
    is therefore a Procrustes rotation applied to the configurations of Figure 7.6
    in order to make them coincide as closely as possible with the configuration of
    the wines from Figure 7.7.


    It is not surprising to see that the largest dimension of nappe 9 (and 8, respectively)
    coincides (more or less) with the first (and, respectively, second) axis: this
    supports the representation of the tasters generated by the MFA (see Figure 7.7,
    right). Taster 9 (and 8, respectively) attributes great importance (in terms of
    the Indiscal model) to the dimension illustrated by the first (and, respectively,
    second) axis of the MFA.


    This clearly illustrates an advantage which has been mentioned times in this work,
    that is to say, that each perspective of the MFA (here, that of the superposed
    representation, the GPA), is related to other perspectives (that of Indiscal in
    the above comment).


    # 9.5 Conclusion


    MFA and GPA are fundamentally different methods with different objectives. In
    particular, GPA constructs a representation of the data within a constrained framework
    (each dimension is common to all of the groups). GPA must be reserved for specific
    applications.'
