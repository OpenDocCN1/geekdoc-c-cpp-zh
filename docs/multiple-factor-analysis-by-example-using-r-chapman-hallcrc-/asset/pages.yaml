  md: '# Multiple Factor Analysis by Example Using R


    Geometric Interpretation. Let $u$ be an eigenvector of matrix $A$ associated with
    the eigenvalue $\lambda$. If the function associated with matrix $A$ is applied
    to $u$, we obtain a vector collinear to $u$ (with the $\lambda$ ratio). The eigirections
    are constant for function $A$ and are very particular for this function (and consequently
    for matrix $A$).


    The procedure which finds the eigenvectors of matrix $A$ (each represented by
    a unit vector $n$) is called diagonalisation. The terminology ''the-eigenvectors
    of $A(n,n)$'' denotes a set of $n$ unit eigenvectors, each associated with a distinct
    eigenvalue.


    A symmetric matrix has the two following properties:


    +   1. Two eigenvectors associated with two distinct eigenvalues are orthogonal
    (for the identity metric).

    2. The eigenvalues are real numbers.


    In PCA, in space $\mathbb{R}^K$ (endowed with identity metric), the factorial
    axes are obtained from the eigenvectors of $X''DX$ (see Section 1.5.3). As this
    matrix is symmetrical, its eigenvectors are orthogonal (with one another), as
    the factorial axes they define.


    In space $\mathbb{R}^I$ (endowed with metric $D$ of the weights of individuals),
    the vectors we interested in, denoted $v_s$, are eigenvectors of $XX''D$. Thus


    > $XX''Dv_s = \lambda_s v_s$.


    Matrix $D$ is diagonal and contains only positive values. We denote $D^{1/2}$
    the diagonal matrix so $D^{1/2}D^{1/2}=D$ (its roots are the root of $D$). By
    left-multiplying the two sides of the previous equation by $D^{1/2}$ we obtain


    > $D^{1/2}XX''D^{1/2}D^{1/2}v_s = \lambda_s D^{1/2}v_s$.


    This illustrates that $D^{1/2}v_s$ is the eigenvector of $D^{1/2}XX''D^{1/2}$
    associated with eigenvalue $\lambda_s$. As this matrix is symmetric, two eigenvectors
    associated with distinct eigenvalues are orthogonal for the usual metric, thus


    > $(D^{1/2}v_s)''(D^{1/2}v_i) = v_s''Dv_i$,


    which expresses that the axes generated by vectors $v_s$ and $v_i$ are orthogonal
    for metric $D$.


    In factorial analysis, an eigenvalue corresponds to a projected inertia. It is
    therefore positive or zero. The condition of symmetry of $A$ is not sufficient
    to ensure non-negative eigenvalues. In fact, when the diagonalised matrix can
    be written in the form $X''X$ or $XX''$ (that is to say the multiplication of
    a matrix by its transpose), then the eigenvalues are positive or zero. Indeed,
    from


    > $X''Xu = \lambda u$.'
