  md: '# Matrix Calculus and Euclidean Vector Space


    When applied to the matrix XX'' of the scalar products between individuals,

    trace is the sum of the squared norms of the individuals, that is to say, if all

    individuals have a weight of 1, the total inertia of the cloud of individuals.

    The *trace* has a remarkable property:


    > trace(AB) = trace(BA).


    When applied to the covariance matrix between individuals, this property,

    expressed trace (X''DX) = trace (XX''D), links the total inertia of the cloud
    of

    variables with that of the cloud of individuals.

    Property: the trace of a square matrix is equal to the sum of its eigenvalues

    (defined below). This property is used in principal component analysis (PCA):

    t eigenvalues of X''DX are the inertias projected on the axes. The trace of

    X''DX is the total inertia which is decomposed on the factors.


    # Matrix and Function, Orthogonal Matrix, Diagonalisation


    Let us consider A(n, p) and vector u of R^p associated with a matrix, also

    doted u, of dimensions (n). By multiplying A and u, we obtain v =

    u with n coordinates therefore belonging to R''. A thus corresponds

    to function, for which all elements u of R'' attributes an element v of R^p.

    Generally, we consider the function within a square (for example, from R'' to

    R"), therefore associated with a square matrix of dimension (n,n).

    A square matrix A(n, n) is said to be orthogonal if all its column vectors

    are orthogonal and of norm 1 (thus constituting an orthonormal base). A matrix

    as if this thesis verifies A''A = I_n, where I_n is the identity matrix of size
    n.

    can also be shown that this matrix A verifies A''A = AA'' = I_n.


    An orthogonal matrix corresponds to a function with a remarkable prop-\erty: the
    norm of a vector remains unchanged by this function''s transforma-

    tion. Indeed,


    > ||Au||^2 = u''A''Au = ||u||^2.


    A function such that, which preserves the distance, is known as isometry.

    The most common example is rotation, which is used in Procrustes analysis.

    Base Change. Let us consider an orthogonal matrix A and uA vector ex-

    p in the columns of A. To express u_A in the usual canonical

    base, expressed u, we write: u = Au_A. From here we deduce the

    equation makes it possible to write u in the base (of the columns of)

    B: u_A = A''u.


    Vector u is said to be the eigenvector of the square matrix A associated

    with the eigenvalue λ if Au = λu.

    Straight away, we can see that if u is an eigenvector, ku (k being a constant)

    is also an eigenvector. This eigenvector generates an eigirection (or

    eigendimension) for which all of its vectors are eigenvectors (associated with

    the same eigenvalue). An eigirection is represented by a unit vector (which

    leaves two possibilities between which the software chooses at random)'
