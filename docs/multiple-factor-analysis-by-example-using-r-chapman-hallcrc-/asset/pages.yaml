  md: '# Multiple Factor Analysis by Example Using R


    80


    | | 1 | j | J |

    |---|---|---|---|

    | Variables | 1 $K_i$ | $1$ $k$ $K_j$ | $1$ $K_J$ |

    | Indiv. | $i$ $X_i$ | $x_{ik}$ $X_j$ | $X_J$ |


    **FIGURE 4.1**nTable with variables organised into groups.


    *Notations.* We use the notations from PCA (see Figure 4.1): $(i, l)$ for the
    individuals, $(k, K)$ for the variables and $p_i$ for the weight of individual
    $i$ $(\sum_i p_i = 1)$. These are completed by the notations related to the groups:


    +   - $j$: Index of the current group

    - $J$: Number of groups (or set of groups)

    - $K_j$: number of variables of group $j$ (or the set of these variables) and
    $K = \sum_j K_j$.

    - $X_j$: Subtable containing the data from group $j$ alone


    The total inertia of the cloud of individuals (identical to the cloud of variables)
    can be expressed, highlighting the role of each group of variables (the data are
    centered)


    $\sum_i p_i d^2(O, i) = \sum_i p_i \sum_k x_{ik}^2 = \sum_j \sum_{k \in K_j} \sum_i
    p_i x_{ik}^2 = \sum_j \sum_{k \in K_j} \text{Var}[k].$


    In this way, the contribution of group $j$ to the total inertia of the cloud of
    individuals is equal to the sum of variances of this group. With standardised
    variables, this contribution is equal to its number of variables: the influence
    of a group depends first and foremost on the number of variables. This has led
    many authors to suggest standardising (at 1) this contribution (which we obtain
    by attributing each variable weight equal to the inverse of the number of the
    groups to which it belongs).


    However, aside from the notion of inertia, the above approach does not take into
    account the factorial approach, that is to say that the search for directions
    of maximum inertia. With this mind, we express the criteria maximised by the first
    inertia, highlighting the contribution of each group of variables. Reasoning based
    on the cloud of variables itself is more direct. Denoting $H_k^s$ the projection
    of variable $k$ on the axis of rank $s$, the criterion associated with the axis
    of rank is expressed:


    $\sum_k (OH_k^s)^2 = \sum_j \sum_{k \in K_j} (OH_k^s)^2$.'
