  md: '# Multiple Factor Analysis by Using R


    In the weighted MCA, we denote $c_j$ the weight attributed to variable $j$. To
    be exactly in the context of the MCA, particularly to attain eigenvalues between
    0 and 1, the sum of these weights must equal 1. We show that this condition does
    not apply in MFA as, for each group, the weights of the variables ensure a maximum
    axial inertia of 1. But let''s not get ahead of ourselves. By following the MCA
    presentation in chapter 2, weighted MCA is generally the same as conducting a
    principal component analysis (PCA) on a table X:


    ```

    $X_{ik} = \frac{y_{ik}}{p_k} - 1,$

    ```


    where individual $i$ has a weight of $p_i$, and category $k$ (of variable $j$)
    of weight $m_k = p_kc_j$. The weighted MCA differs from usual MCA (as seen in
    Chapter 2), by the weighting of categories. The weighting of category $k$, belonging
    to variable $j$, can be seen as the product of the weighting of the category ‘within’
    variable $j$ (in other words $p_k$) by the weighting of variable $j$ in the set
    of variables (that is to say, $1/j$) in usual MCA and $c_j$ in weighted MCA),
    hence: $p_kc_j$.


    # 8.1.1 Cloud of Categories in Weighted MCA


    In MCA, the cloud of categories has remarkable properties. The principal characteristics
    of this cloud are brought together in Table 8.1, for both MCA and weighted MCA.
    For weighted MCA, they are obtained by replacing quantity $1/j$, in the MCA properties,
    by $c_j$.


    # 8.1.2 Transition Relations in Weighted MCA


    $\lambda_s$, $F_s$ and $G_s$ here designate the results (eigenvalue, coordinates
    of the individuals and coordinates of the categories of rank $s$) for MCA and
    weighted MCA.


    In weighted MCA a category $k$ is (up to a coefficient) at the barycentre (denoted
    $g_k$) of the individuals that possesses it:


    ```

    $G_s(k) = \frac{1}{\sqrt{\lambda_s}} \frac{1}{p_k} \sum_{i} y_{ik}F_s(i) = \frac{1}{\sqrt{\lambda_s}}
    \sum_{i} y_{ik}G_s(k).$

    ```


    In MCA an individual is (up to a coefficient) at the barycentre of the categories
    (each attributed the same weight) that it possesses:


    ```

    $F_s(i) = \frac{1}{\sqrt{\lambda_s}} \sum_{k \in K} y_{ik}G_s(k) = \frac{1}{\sqrt{\lambda_s}}
    \sum_{k \in K} y_{ik}G_s(k).

    ```


    In weighted MCA an individual is (up to a coefficient) at the barycentre of the
    categories (each attributed the weight of the variable to which it belongs)'
