  md: '# MFA and Procrustes Analysis


    # 9.2.2 Mean Cloud


    In methods, cloud $N_i$ contains the points $i$, the centres of gravity of the
    sets $\{i^j; j = 1, ..., J\}$ (which is why they are called mean clouds). However,
    as these two mean clouds $N_i$ are constructed in different spaces, they do not
    carry the same meaning from one to another.


    # In MFA


    +   * The $i^l$ associated with a given $i$ belong to orthogonal subspaces

    * Their coordinates are juxtaposed and cannot be averaged.

    * The squared distance between two mean points $i$ and $l$ is written:


    ```

    $d^2(i, l) = \frac{1}{j^2} \sum_j d^2(i^j, l^j)$

    ```


    +   * This overall distance increases with the distances in each subspace, whatever
    the direction of this distance in each subspace.

    * In $\mathbb{R}^{K^c}$, the total inertia of $N_i$ is equal to the total inertia
    of $N^l$ divided by $J^2$.


    # In GPA


    +   * The $i^l$ associated with a given $i$ belong to the same space, $\mathbb{R}^{K^c}$.

    * The coordinates of $i$ are average of the coordinates of $\{i^j; j=1, ..., J\}$.

    * As in MFA, the distance between the two mean points $i$ and $l$ is dependent
    on the distance between individuals $i$ and $l$ in each group but, in addition,
    on the fact that, along homologous directions, the deviations between individuals
    $i$ and $l$ either or do not have the same sign (see Figure 9.1).

    * As a result, at constant inertia $N^l$, the inertia of $N_i$ is greater when
    the deviations between the points are identical in homologous directions, that
    is to say, when $N^i$ and $N^l$ are similar. This is why, in GPA, the mean cloud
    is sometimes called a consensus cloud.


    **Illustration.** In Figure 9.1, A and B differ for each group: the same applies
    for C and D. On the axis of the PA, the differences between A and B are similar
    for each group: the mean points differ. On this axis, the differences between
    C and D are opposite for the two groups: the mean points are.


    # 9.2.3 Objective, Criterion, Algorithm


    From a general point of view, in both cases we are looking for factors common
    to $N^l$ which are visualised using a superimposed representation of $N^l$.'
