  md: '# Multiple Factor Analysis by Example Using R


    Quantitative variables


    | | k | K |

    |---|---|---|

    | Individuals i | | $x_{ik}$ |

    | Mean | | |

    | Standard deviation | $\hat{s}_k$ | $\hat{s}_k$ |


    FIGURE 1.1

    Data structure and notations.


    These notations are brought together in Figure 1.1

    An endless variety of data can be analysed using PCA. In the following paragraphs,
    we use an example which is rich and easy to understand. We have the final Baccalaureate
    grades for 909 high school students specialising in science (I = 909), for 5 subjects
    (K = 5): mathematics, physics, natural sciences, history-geography and philosophy.


    # 1.2 Why Analyse a Table with PCA?


    Let us go back to the previous example. Generally, once the means have been examined,
    the aim of studying such table statistically is to investigate the students ''within-subject''
    and ''between-subjects'' diversity. This diversity must first be examined by using
    indicators (mainly standard deviations) and graphs (mainly boxplots and histograms).

    The choice of PCA is mainly by two objectives:


    +   1. We consider the students not in terms of one grade or another, but in terms
    of overall grades, which we refer as their ''school profile.''. We study the diversity
    of these profiles (overall, rather than grade by grade). In PCA, this profile
    diversity is studied by highlighting their principal dimensions of variability.
    Therefore, in the example, we can expect the principal dimension of variability
    to oppose good students (who have good grades in all subjects) with bad students
    (who have bad grades in all subjects).

    2. We are interested in the relationships between variables. In PCA, we only examine
    linear relationships; the intensity of this type of relationship between two variables
    is measured by the correlation coefficient, as usual. In addition, these relationships
    are studied using synthetic variables (known as principal components). These are'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Principal Component Analysis


    linear combinations of initial variables which are closely related as possible
    (defined later) to these initial variables. Ideally, each synthetic variable is
    closely correlated to one group of variables alone, and uncorrelated with the
    others, identifying groups of variables (correlated within-group and uncorrelated-between-groups).


    We show that these synthetic variables coincide (defined later) with the dimensions
    of variability as seen above. This therefore shows that the objectives are closely
    linked, or even two aspects of the same question. This can be illustrated in the
    context of the example: saying that the principal dimension of variability opposes
    good and bad students (studying the individuals via their school profiles) is
    equivalent to saying that all of the variables (that is, the grades) are positively
    correlated two by two (studying relationships between variables).


    This idea may seem obvious: the rows and columns of a table are two aspects of
    the same reality (that is to say the table). This is the origin of the term duality
    (the dual nature) often used to designate this relationship between these two
    rows, on the one hand, and between the coordinates of rows and columns given by
    PCA. This relationship is no less fundamental: it helps us to understand better
    what we''re looking for; it also illustrates the suitability of the PCA for a
    very general issue, such as analysing a table. In addition, must be noted that
    we also find duality (issues and results) in all factorial analyses, in particular
    those studied in this book, PCA, multiple correspondence analysis (MCA), factorial
    analysis of mixed data (FAMD), MFA and hierarchical multiple factor analysis (HMFA).


