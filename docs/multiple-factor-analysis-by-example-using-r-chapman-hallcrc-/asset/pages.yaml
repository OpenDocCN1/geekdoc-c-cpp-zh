    # 9.2.6 Harmonising the Inertia of $N_I^f$


    In MFA, the inertia of $N_I^f$ is harmonised prior to the analysis:


    +   - Within the groups, by optional reduction of the columns

    - Between the groups, by overweighting the variables which amounts to a homotopy
    of each $N_I^f$


    In GPA, the issue is same as prior to conducting an MFA or any other analysis
    of this type of table. The practice is: the inertia of $N_I^f$ is always 100;
    optionally, the inertia of each $N_I^f$ can also be fixed to 100/J.


    # 9.2.7 Relationships Between Homologous Factors


    We use the notations from MFA: $F_I$; coordinates of $N_I$ along axis of ranks;
    $F_I^f$: coordinates of $N_I^f$ along axis of rank s.


    It can be shown then, in MFA, these factors benefit from the following property:


    > $\forall s, j : r(F_I^f, F_s) \ge 0$.


    Thus, a canonical variable $F_I^f$ is never negatively related to the general
    variable of the same rank $F_s$. This property is the very least we can ask of
    a common factor. The GPA can be shown to verify this property.


    However, in both GPA and MFA, homologous factors (such as $F_I^f$ and $F_s^f$)
    can be negatively correlated, as illustrated in the example (see Table 9.1). In
    this specific case, where each group has only one variable, the GPA considers
    the three variables to be homogenous (sometimes considering their opposites).
    Thus, the correlation matrix between homogenous factors is the same as the correlation
    matrix between initial variables'
