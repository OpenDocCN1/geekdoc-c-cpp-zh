    # 10.7 Application to Mixed Data: Sorted Napping®


    # 10.7.1 Data and Methodology


    In sensory evaluation, classic data collection involves asking judges (that is
    to say, tasters) to evaluate a set of products using a set of descriptors (variables).
    In this products are attributed a sensory characterisation: a given product is
    perceived as sour, mildly bitter and so on. This classic approach does not take
    into account the importance of these descriptors in constructing the tasters’
    overall assessments.

    To reveal the importance of each criterion, holistic methods can be used in which
    the judges directly evaluate the similarities between products, each to his or
    her own criteria. There are three possible methods.


