    case: $j$), a value which is reached when $v_s$ coincides with the first factor
    of the PCA of $K_1$ and with that of $K_2$ and with that of the FAMD of $K_3$.


    # Analysis in $R^2$


    In this space, group $j$ is represented by the matrix $W_j$ of the scalar products
    (between individuals) that it generates. The presence of different kinds of variables
    poses no problem as the $W_j$ matrices are homogeneous (same dimensions, first
    eigenvalue). The projection of group $K_j$, on axis $w_s$ generated by the general
    variable $v_s$ (defined in $\mathbb{R}^i$) of the MFA, is interpreted as the relationship
    measure $Lg(v_s, K_j)$ (see Section 7.4.1).

    In this space, the scalar product between $K_1$ and $K_2$ is worth $Lg(K_1, K_2)$
    (on the condition that the maximal inertia of each cloud associated with one group
    is 1). Depending on the nature of the variables, this scalar product derives from
    the correlation coefficient, from the correlation ratio or from $\phi^2$. Table
    8.2 specifies $Lg(K_1, K_2)$ according to the number and the number of the variables
    making up the groups in the case of homogeneous groups.

    When there is both a quantitative group and a qualitative group, $Lg(K_1, K_2)$
    is worth 0 if each variable from one group has a zero correlation with'
