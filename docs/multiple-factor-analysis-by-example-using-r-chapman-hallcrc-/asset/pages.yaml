  md: '# Number of Axes


    In $\mathbb{R}^K$, it is possible to find $K$ orthogonal axes. But, in MCA, the
    $K_j$ categories of variable $j$ are linked by a relationship (their sum counterbalanced
    by the weights of the categories is null). From this point of view, the maximum
    number of axes is $K-J$. In addition, $K_j$ is made up of $I$; at most $I-1$ axes
    are necessary in order to represent them perfectly. Finally, in MCA, the maximum
    number of axes with non-null inertia is min $\{I-1, K-J\}$.


    In $\mathbb{R}^I$, the categories, being centred, are situated within a subspace
    of dimension $I-1$. Furthermore, after centring, each variable $j$ generates a
    subspace of dimension $K_j-1$. All of the variables therefore generate a subspace
    with a maximum dimension of $K-J$. Finally, again we find that in MCA, the maximum
    number of axes with nonzero inertia is min $\{I-1, K-J\}$.


    # Interpretation Aids


    The interpretation aids presented for PCA (Section 1.6) can be directly applied
    to MCA.


    # Percentage of Inertia Associated with an Axis


    Inertia itself (associated with an axis), as a mean of squared correlation ratios,
    has already been discussed. The percentage of inertia, in all factorial analysis,
    measures the representation quality of the whole cloud ($N_i$ or $N_k$) by an
    axis or plane.


    In comparison, to PCA, MCA generally leads to:


    +   - Smaller percentages of inertia

    - A smoother decrease of these percentages


    When faced with such a result, users accustomed to working with PCA are often
    disappointed, in particular by the low percentages of inertia. This point requires
    some clarification. Everything from the fact that qualitative variable (with $K_j$
    categories) corresponds to a subspace (of $K_j$ dimensions). We get a feeling
    for these low percentages by considering the limit case in which all the variables
    are identical to one another. In such a case:


    +   - PCA yields a first axis associated with a percentage of inertia of 100%
    (and thus 0 for all following axes).

    - MCA yields $K_j-1$ axes across which the 100% of inertia is evenly distributed.


    Thus, for example, in the presence of variables with five categories, the percentage
    of inertia associated with the first axis cannot exceed 25%. More'
