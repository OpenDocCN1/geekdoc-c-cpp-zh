  md: "The distance between individuals $i$ and $l$ is expressed:\n\n```\n$d^{2}(i,\
    \ l) = \\sum_{k \\in K_i} (X_{ik} - X_{lk})^{2} + \\sum_{q \\in K_Q} \\sum_{k\
    \ \\in K_q} p_{kq} \\left( \\frac{Y_{ik}}{p_{kq}} - \\frac{Y_{lk}}{p_{kq}} \r\
    ight)^{2}$\n```\n\nThe quantitative variables contribute to this distance in exactly\
    \ the same way as in PCA on these variables alone (see Section 1.3); the qualitative\
    \ variables contribute to this distance (up to 1/Q coefficient) as they do in\
    \ the MCA of these variables alone (see Section 2.4). One important case is that\
    \ of the distance between an individual and the cloud's centre of gravity. This\
    \ centre of gravity lies at the origin $O$ when the variables are centered, as\
    \ assumed for quantitative variables. For the MCA-coded individuals, accounting\
    \ for division by $p_{kq}$, the mean of column $q_q$ is worth 1 (see Section 2.4).\n\
    \nFinally, we obtain:\n\n```\n$d^{2}(i, O) = \\sum_{k \\in K_i} x_{ik}^{2} + \\\
    sum_{q \\in K_Q} \\sum_{k \\in K_q} p_{kq} \\left( \\frac{Y_{ik}}{p_{kq}} - 1\
    \ \\right)^{2} = \\sum_{k \\in K_i} x_{ik}^{2} + \\sum_{q \\in Q} \\frac{1 - p_{q}(i)}{p_{q}(i)}$\n\
    ```\n\nwhere we define $q(i)$ the category of variable $q$ possessed by $i$, and\
    \ $p_{q}(i)$ the proportion associated with $q(i)$.\n\nIt is then necessary to\
    \ ensure the balance between the influence of the two types of variables in these\
    \ relationships. It is natural to measure the influence of a variable by its contribution\
    \ to the inertia of all the factors. The considerations established in $R^I$ are\
    \ transposed in $R^K$ by duality. Particularly, in the subspace of $R^K$ generated\
    \ by $K_q$ categories of variable $q$, the projection of the cloud of individuals\
    \ has an inertia of $K_q - 1$ distributed isotropically in all directions of this\
    \ subspace of dimension $K_q - 1$.\nIn all factor analyses we report:\n\n+   -\
    \ The cloud of individuals by its projection on its axes of inertia (we denote\
    \ $F_s(i)$ the projection of individual on the axis of rank $s$).\n- The quantitative\
    \ variables by their correlation coefficient with the factors $F_s$.\n- The categories\
    \ of qualitative variables by the centres of gravity of the corresponding individuals.\
    \ We denote $F_s(k_q)$ the coordinate of the projection, on the axis of rank $s$,\
    \ of the centre of gravity of the individuals possessing category $k$ of variable\
    \ $q$.\n\n# 3.4 Transition Relations\n\nHere we apply the general formulae for\
    \ PCA (see Section 1.5.4) to the encoded table as in Section 3.2."
