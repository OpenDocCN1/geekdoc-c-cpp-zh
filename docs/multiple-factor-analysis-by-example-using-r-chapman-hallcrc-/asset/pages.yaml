    \ notion of scalar product is connected to the notion of angle as follows. Let\
    \ $u$ and $v$ be two vectors forming an angle $\theta$. The cosine of angle $\t\
    heta$ is obtained by projecting one of these vectors onto the other after having\
    \ standardised them. Thus\n\n> $\\cos \\theta = \\frac{\\langle u, v \\rangle}{\\\
    |u\\| \\|v\\|}$.\n\nNote: Two vectors are said to be orthogonal if their scalar\
    \ product is zero. *Summary.* From the definition of scalar product, we define\
    \ the norm: $\\|u\\|^2 = \\langle u, u \rangle$. From the norm, we define the\
    \ distance: $d^2(u, v) = \\|u - v\\|^2$.\n\n# Vector Space with $n$ Dimensions\n\
    \nThe scalar product previously defined in $\\mathbb{R}^2$ can be generalised\
