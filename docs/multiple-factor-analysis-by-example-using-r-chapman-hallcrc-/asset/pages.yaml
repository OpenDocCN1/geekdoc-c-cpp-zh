    # 1.6.2 Contribution of One Point to the Inertia of an Axis


    # Case of an Individual


    In the maximised quantity (projected inertia of $N_i$), we can individualise the
    role of each individual, known as their contribution. This contribution is generally
    expressed as a percentage (of total inertia) thus, for individual $i$ and the
    axis of rank $s$,


    ```

    $Contribution(i, s) = \frac{Projected inertia of point } i \text{ on } s}{Projected
    inertia of } N_i \text{ on } s} = \frac{p_i(OH_i)^2}{\lambda_s}$

    ```


    The notion of contribution is important to identify specific situations in which
    one arises from very few individuals, or one single individual. That said, with
    in mind, when individuals are of the same weight, it is sufficient to look at
    the individuals on the factorial plane. Measuring contribution is therefore only
    truly useful when the weights of individuals are different.


    # Case of a Variable


    In centred-reduced cases, the ''raw'' contribution (that is, not expressed as
    a percentage of total inertia) of variable $k$ on the inertia of axis of rank
    $s$ is equal to the square of its correlation coefficient with the principal component
    $F_s$ and is therefore read directly from the correlation circle. This is not
    the case in unstandardised PCA as the raw contribution is thus a covariance. In
    this case, the two types of graphs (projection of $N_k$ and correlation circle)
    are required for interpretation. This is one of the reasons why unstandardised
    PCA is considered to be (slightly) more complicated to interpret than standardised
    PCA.


    Comment. For a given axis, the contributions can be added together to represent
    the contribution of a subset of individuals or a subset of variables.


