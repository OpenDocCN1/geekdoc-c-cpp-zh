  md: '# Principal Component Analysis


    All of the qualitative variables must be explicitly declared as supplementary.
    The presence of an undeclared qualitative variable will lead to an error message.
    The individuals and the barycenters associated with the categories evolve within
    the same space and, by default, are represented simultaneously.


    By default, the active and quantitative variables are represented simultaneously
    (see Figure 1.8, right). In order to obtain a graph featuring the barycenters
    of the categories alone (see Figure 1.8, left), we simply hide (invisible) the
    individuals.


    ```

    > plt.PCA(res,axes="c(1,2),choix="ind", invisible="ind")

    ```


    To group the results in a single .csv file:


    ```

    > write.infile(res, file="Output_ACP_Bac.csv")

    ```


    To obtain Table 1.3, we calculate the centre and reduced data table using the
    scale function (result in Bac_CR).


    ```

    > Bac_CR=scale(Bac3[2:11])*sqrt(909/908)

    ```


    # Remark


    In the scale function, the variance used is the estimation of the population variance
    (denoted σ²). Thus


    > $$\sigma^2 = \frac{1}{I-1} \sum(x_i - \bar{x})^2 = \frac{I-1}{I} Var[x].$


    To use the sample variance (denoted Var[x]), we therefore have to multiply the
    result of the scale function by $\sqrt{T/(I-1)}$.


    This makes it possible to edit the centre-reduced data of individuals 46 and 238,
    for example:


    ```

    > Bac_CR(c(46,238),]

    ```


    Table 1.6 contains the transpose data (t function) rounded to two decimal places
    (round function) and limited to a set of individuals, the rank of which we put
    in a vector (called list_ind_etiq).


    ```

    > list_ind_etiq=c(46,238,264,253,419,557,566,638,807,850,863)

    > round(Bac_CR_t[,list_ind_etiq),2)

    ```


    To obtain Table 1.4, we use the catdes (category description) accessible in the
    FactoMiner menu, or using the command:


    ```

    > results=catdes(Bac,num.var=1)

    ```'
