  md: 'In this case, all of the variables are active, both quantitative and qualitative.

    All of the results tables are saved in the output file (res). The four graphs

    in this chapter (individuals, categories, relationship square and correlation

    circle; Figures 3.3 and 3.4) are displayed by default.


    The graphs are obtained using a function specific to FAMD: plot. FAMD.

    The type of graph is determined by the type of elements to be represented

    spec in the choice argument: ind for individuals and categories, group

    for relationship square, and var for correlation circle. The following command
    ndisplays the individuals (choice="ind") and only the individuals

    (invisible="quali") by colouring them according to their category for

    the first variable (argument habitage: hab=1).


    ```

    > FAMD(res,axes=c(1,2),choice="ind",hab=1,invisible="quali")

    ```


    To obtain Table 3.1, we centre and reduce the quantitative variables (scale

    function; see in Section 1.11); the result is saved in the tab3_1

    matrix.


    ```

    > tab3_1=scale(biometry[,2:3])*sqrt(6/5)

    ```


    Finally, tab3_1 is horizontally concatenated with the raw data by


    ```

    > cbind(biometry,tab3_1)

    ```


    The relationship matrix (see Table 3.2) is in res$varLg.

    To construct Table 3.3, the eigenvalues and percentages of inertia, which are

    in the first two columns of res$eig, are saved and transposed (t function),

    in the tab3_3 matrix.


    ```

    > tab3_3=t(res$eig,c(2,1))

    ```


    This table is concatenated with res$varcoord which contains the inertias

    of the variables along axes; we select the first four axes, as which

    follow null inertia.


    ```

    > round(rbind(tab3_3[,1:4],res$varcoord[,1:4]),2)

    ```'
