    **FIGURE 4.3**nDuality between clouds of individuals and variables; clouds complete
    ($N_I, N_K$) or restricted to group of variables $j$ ($N_j^I, N_j^K$).


    which the sensory group is composed of unstandardised variables and the chemical
    group of standardised variables. By weighting the variables in such a way as to
    standardise (to I) the maximum inertia of each group, two types of variables can
    be simultaneously introduced as active within one analysis.


    In the individuals'' space $\mathbb{R}^K$, the attribution of weights to the variables
    induces a specific metric: in calculating a distance, each variable of group $j$
    intervenes with a weight of $1/\lambda_j^2$. Thus, by highlighting part of group
    $j$ within the distance between individual $i$ and the origin $O$


    ```

    $d^2(O, i) = \sum_{k \in K} \frac{x_{ik}^2}{\lambda_k^2}$.

    ```


    The part of group $j$ in $d^2(O, i)$ is interpreted geometrically as the squared
    distance between the origin and the projection of $i$ (denoted $i^j$) on the subspace
    generated by variables of group $j$ (denoted $K^j$). Individuals'' space $\mathbb{R}^K$
    is the direct sum of (sub)spaces $\mathbb{R}^{K^j}$ and we can write:


    ```

    $d^2(O, i) = \sum_{j} d^2(O, i^j)$.

    ```


    To interpret in $\mathbb{R}^K$ the property of weighting the variables introduced
    in $\mathbb{R}^I$, it is important to consider all points $i^j$ associated with
    group $j$: $\{i^j, i=1, I\}$ (see Figure 4.3). They make up the cloud $N_j^I$,
    the projection of cloud $N_I$ on linked to cloud $N_j^K$ (of the variables of
    group $j$ in $\mathbb{R}^I$) by relationships of duality. Thus, these two clouds
    have:


    +   - The total inertia

    - The same inertia projected on the principal dimension of inertia rank $s$, particularly
    the first of these, $\lambda_1^s$'
