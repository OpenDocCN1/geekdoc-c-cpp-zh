  md: 'measurement $Lg$. The first (common) factor, denoted $v_1$, is variable $z$
    which maximises


    ```

    $$\sum_{j} Lg(z, K_j) \text{ with norm constraint: } ||v_1||_D^2 = 1.$

    ```


    As $Lg(z, K_j)$ is close to the inertia of the variables of $K_j$ projected on
    $z$ (here, inertia integrates weighting by $\lambda_j^2$), this common factor
    is the first standardised principal component of the MFA. The balance of the influence
    of the groups, obtained thanks to the MFA''s weighing, makes it possible to interpret
    the MFA criterion both as of a PCA and of a canonical analysis. This result is
    important in more ways than one. In particular, it shows that the two objectives,
    studying the variability (including several groups of variables) of individuals
    (the objective of PCA) on the one hand, and looking for common factors (the objective
    of canonical analysis), are linked to each other, or are two aspects of the same
    issue. This idea has already been seen in the introduction to this chapter, in
    which these factors are defined as a structure on the individuals (the example
    given is that of the opposition between two groups with three orange juices).


    Once the first common factor has been found, we look for a second, orthogonal
    to the first, and so on until a sequence of orthogonal factors is found. These
    factors are the principal components of the MFA: that of rank $s$ has already
    been denoted $v_s$ (variance 1) or $F_s$ (variance $\lambda_s$).


    # 6.4 Searching for Canonical Variables


    Carroll''s method, each common factor $F_s$ is attributed a set of $J$ canonical
    variables (one for each group of variables). In some ways, these variables represent
    the common factor $F_s$ in each group. They are obtained by projecting $F_s$ onto
    each of the subspaces generated by the variables of a group. There is therefore
    homogeneity of criteria when searching for common factors and for canonical variables.
    In both cases, a group of variables is represented by the subspace it generates.


    We adapt Carroll''s approach by including the characteristics of our point of
    view in the canonical analysis, then:


    +   - Considering each group of variables while taking into account the distribution
    of inertia within the space it generates

    - Highlighting the individuals'' space, which is done when a common factor is
    defined as a structure on the individuals


    This point of view suggests using the coordinates of the partial individuals (grouped
    together in the partial factors denoted $F_j$) as canonical variables.'
