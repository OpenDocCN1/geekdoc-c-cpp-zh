  md: '# Qualitative and Mixed Data


    Until now, multiple factor analysis (MFA) has been presented for quantitative
    variables. In this chapter, we extend this to qualitative variables, and more
    generally, to mixed data. The referent method for processing individuals × qualitative
    tables is multiple correspondence analysis (MCA). Furthermore, the issue of mixed
    data has already been discussed in the chapter devoted to factorial analysis of
    mixed data (FAMD and MFA). Here we therefore present a combination of MCA, FAMD.


    Weighting the variables is key to MFA. We begin by introducing the notion of weighted
    variables in MCA under the name weighted MCA.


    # 8.1 Weighted MCA


    We use the notations for MCA as presented in Section 2.2:


    +   - $y_{ik}$: General term for the complete disjunctive table (CDT); $y_{ik}
    \in \{0, 1\}$.

    - $I$: The number of individuals and $J$ the number of variables.

    - $K_j$: The number of categories of variable $j$; $K = \sum_j K_j$ is the total
    number of categories.

    - $p_i$: The weight of individual $i$. Generally, all of the individuals have
    the same weight, with sum of weights fixed at 1: $p_i = 1/I$; these squares are
    brought together in the diagonal matrix $D$ of dimension $I$: $D(i, i) = p_i$.

    - $p_k$: The weight of the set of individuals possessing category $k$: $p_k =
    \sum_i p_{ik}$. When the individuals have the same weight, $p_k$ is the proportion
    of individuals possessing category $k$. These weights (of categories) are brought
    together in the diagonal matrix $M$ of dimension $K$: $M(k, k) = p_k$.


    In MCA, if a variable is duplicated, it is attributed a role which is twice as
    important. It is therefore easy to imagine an MCA in which the variables are weighted.
    Implicitly, in usual MCA, the weight of each variable is 1/J. This appears most
    notably in the maximised criterion: the mean of squared correlation ratios.'
