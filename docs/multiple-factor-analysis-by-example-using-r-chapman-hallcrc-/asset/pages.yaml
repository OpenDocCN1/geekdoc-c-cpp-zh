  md: '# Multiple Factor Analysis by Example Using R


    Therefore, up to a coefficient, the coordinate of category $k$ on the axis of
    rank s (in $\mathbb{R}^1$) is equal to the mean of the coordinates (in $\mathbb{R}^K$)
    of the individuals possessing category $k$.


    This property is vital to interpretation: the user is more likely to consider
    a category as a centre of gravity of the individuals as a (projected) indicator.
    Concretely, the proximity on a factorial plane between categories $k$ and $h$
    is interpreted as a profile similarity between the individuals possessing category
    $h$ and those possessing category $k$. This similarity is automatic when these
    two categories are possessed by the same individuals (thus ensuring proximity
    between the corresponding indicators) can be observed differently (the case of
    the two neighbouring categories of a given variable, for example, the age ranges
    60–65 and 65–70 years; no individual possesses both categories at once, but we
    might think that those who possess one have the same response profile as those
    possessing the other.


    As PCA, we use this reasoning by switching the roles of the rows and the columns.
    In $\mathbb{R}^1$, vector $v_s$ verifies


    ```

    $XMXDv_s = \lambda_s v_s$.

    ```


    Hence


    ```

    $X''DMXDv_s = \lambda_s X''Dv_s$.

    ```


    But $G_s = X''Dv_s$. Therefore


    ```

    $X''DXMG_s = \lambda_s G_s$.

    ```


    $G_s$ is an eigenvector of $X''DXM$ associated with the eigenvalue $\lambda_s$
    and is therefore collinear to $u_s$.


    ```

    $G_s = \sqrt{\lambda_s} u_s$.

    ```


    This property is used to express $F_s$ according to $G_s$. Thus


    ```

    $F_s = XMu_s = \frac{1}{\sqrt{\lambda_s}} XMG_s$.

    ```


    Hence, for the coordinate of row $i$ along $u_s$ ($G_s$ is centred):


    ```

    $F_s(i) = \frac{1}{\sqrt{\lambda_s}} \frac{1}{k} \sum_k y_{ik} G_s(k).

    ```


    Thus, up to a coefficient, the coordinate of individual $k$ on the axis of rank
    $s$ (in $\mathbb{R}^K$) is equal to the mean of the coordinates (in $\mathbb{R}^1$)
    of the category it possesses. This relationship and the previous one (expressing
    $G_s(k)$ according to $F_s(i)$) are known as transition relations as they express
    the coordinates of the points in one space ($\mathbb{R}^1$ or $\mathbb{R}^K$)
    according to the coordinates of the points in the other space.'
