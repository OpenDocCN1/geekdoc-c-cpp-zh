    # 9.4 Application to the Ten Touraine Wines


    These data have already been analysed in Chapter 7. In this mapping® data, 11
    tasters each provided a planar configuration of 10 wines.


    We are dealing with a GPA in its true context. As the initial configura- are planar,
    they can be perfectly represented on a plane. Otherwise, when they have more than
    two dimensions, the advantage of the GPA constraint of nondistortion of the configuration
    in looking for a superimposed representation becomes unclear, as it is not possible
    to represent the configurations without distorting them (due to their projection
    on the axes of $N_1$).


    We do not reproduce the superposition of the 10 configurations as it is extremely
    overcrowded and only real of interest to those who know the tasters well. The
    mean configuration generated by the MFA (see Figure 9.7) is very similar to these
    two planar configurations (.906. More precisely (see Table 9,5), these two representations
    have the same first axis ($r = .9917$), which is not the case for the second axis
    ($r = .8734$). As a result, the first bisector in GPA does not clearly separate
    the two axes (as it does in MFA).


    The second axis of the GPA isolates 5, 6, 8 and 9 from the others by bringing
    them to one another. This does not seem to make sense. In MFA, wines 8 and 9 mainly
    contribute to the second axis (60%) and wines 5 and 6 mainly contribute to the
    third axis (73%). Unlike the MFA, the GPA (in this application) only has two dimensions.
    This is why this second axis of the GPA is difficult to interpret. The impossible
    compromise (roughly between 2 and 3 of the MFA), that is the second axis of the
    GPA, also introduces a difference in inertia, with the first axis, which is very
    high compared to that of the MFA (72.79 – 27.21 > 36.39).


    *'
