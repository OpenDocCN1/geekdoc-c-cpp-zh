  md: '# Matrix Calculus and Euclidean Vector Space 245


    In matrix notations, retaining the $u$ and ($v$, respectively) to designate the
    column matrix (with $n$ rows and one column) bringing together the coordinates
    of $u$ and ($v$, respectively), the scalar product between $u$ and $v$ is written
    (denoting $u''$ the transpose of $u$):


    $$\langle u, v\rangle = u''v$$


    The orthogonality between two vectors is expressed: $u''v = 0$, and in the addition:
    $\|u\|^2 = u''u$. A unit vector therefore satisfies $u''u = 1$.


    # 11.2.2 Euclidean Space Endowed with a Diagonal Metric


    Up until now, in the usual distance, the same weight 1 is attributed to each dimension
    within the space. In data analysis, we might want to attribute a weight other
    than 1 for all of the dimensions, or a different weight for each dimension. The
    most common case is the cloud of variables in PCA.


    This cloud evolves within a space with $I$ dimensions, denoted $\mathbb{R}^I$,
    with each dimension associated with one individual. If individual $i$ is endowed
    with $p_i$, then this same weight $p_i$ must be attributed to dimension $i$ when
    calculating distance in $\mathbb{R}^I$. Because for simplicity''s sake, we impose
    a total weight of 1 to $p_i$, these weights $p_i$ are never equal to 1 and even
    in cases where the individuals have the same weights, the usual distance needs
    to be altered (slightly).


    Let us look at the general case of the space with $n$ dimensions ($\mathbb{R}^n$)
    retaining index $i$ for the dimensions. Let $p_i$ be the weight attributed to
    dimension $i$. These weights are organised on the diagonal of matrix $M$, a matrix
    containing zeros elsewhere (matrix $M$ is therefore diagonal).


    To show that we use the weights organised within matrix $M$, this letter is mentioned
    in the notions of scalar product, norm and distance. Thus


    $$\langle u, v\rangle_M = \sum_i p_i u_i v_i = u''Mv$$


    Hence the norm:


    $$\|u||_M^2 = \langle u, u\rangle_M = \sum_i p_i u_i^2 = u''Mu$$


    Hence the distance between the (extremities of the vectors) $u$ and $v$:


    $$d_M^2(u, v) = ||u - v||_M^2 = \sum_i p_i (u_i - v_i)^2$$


    Specific Cases. When all of the weights $p_i$ are equal to 1, we obtain the usual
    (Euclidean) distance. Matrix $M$ is the identity matrix, hence the name identity
    metric. When all of the weights are equal to a constant $c$ (and not 1; the usual
    case in space of variables in $\mathbb{R}^I$ of PCA with $c=1/I$), this is also
    referred to as the identity metric.'
