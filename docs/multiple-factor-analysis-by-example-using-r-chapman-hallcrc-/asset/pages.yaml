  md: "# Factorial Analysis of Mixed Data\n\n# Relationships from $\\mathbb{R}^K$\
    \ Toward $\\mathbb{R}^l$\n\nLet $G_s(k)$ be the coordinate of column $k$ on the\
    \ axis of rank $s$.\nCase of a quantitative variable:\n\n```\n$G_s(k) = \\frac{1}{\\\
    sqrt{\\lambda_s}} \\sum_i p_i x_{ik} F_s(i) = r(k, F_s)$.\n```\n\nCase of a category\
    \ $k_q$ with a relative frequency of $p_{k_q}$:\n\n```\n$G_s(k_q) = \\frac{1}{\\\
    sqrt{\\lambda_s}} \\frac{1}{p_{k_q}} \\sum_i p_i y_{iq} F_s(i) = \\frac{1}{\\\
    sqrt{\\lambda_s}} F_s(k_q)$,\n```\n\nwhere $F_s(k_q)$ is the coordinate, along\
    \ the axis of gravity of individuals with category $(k_q)$. In MCA, as up to the\
    \ $1/\\sqrt{\\lambda_s}$ coefficient, the coordinate of a category as an indicator\
    \ (that is to say in $\\mathbb{R}^l$), is equal to the barycentre of the individuals\
    \ which it possesses (in $\\mathbb{R}^K$).\n\n# Relationship from $\\mathbb{R}^l$\
    \ Toward $\\mathbb{R}^K$\n\nThis relationship is fundamental in MCA as it expresses\
    \ the position of an individual according to the categories it possesses. It is\
    \ rarely explicit in PCA but it underlies interpretation. For FAMD, it is expressed:\n\
    \n```\n$F_s(i) = \\frac{1}{\\sqrt{\\lambda_s}} \\sum_{k \\in K_1} x_{ik} G_s(k)\
    \ + \\frac{1}{\\sqrt{\\lambda_s}} \\sum_{k_q \\in K_2} p_{k_q} \\left(\\frac{y_{ik_q}}{p_{k_q}}\
    \ - 1\right) G_s(k_q).\n```\n\nThe first member is that of PCA (see Section 1.5.4).\
    \ It expresses that an individual lives on the side of the variables for which\
    \ it has an above average value, and opposite variables for which it carries a\
    \ below average value. The second member is that of MCA, up to the $1/Q$ coefficient\
    \ (see Section 2.5.3). It can be expressed as $F_s(k_q)$, thanks to the above\
    \ equation relating\n\n```\n$\\frac{1}{\\sqrt{\\lambda_s}} \\sum_{k_q \\in K_2}\
    \ (y_{ik_q} - p_{k_q}) F_s(k_q) = \\frac{1}{\\sqrt{\\lambda_s}} \\sum_{k_q \\\
    in K_2} y_{ik_q} F_s(k_q).$\n```\n\nThe latter equation expresses that an individual\
    \ is, up to the $\\sqrt{\\lambda_s}$ coefficient, at the barycentre of the categories\
    \ it possesses (with these categories themselves the barycentres of individuals).\n\
    \n# Remark\n\nIn the transition relation expressing the coordinate of an individual\
    \ according to those of the categories, the coefficient is:\n\n+   $\\sqrt{\\\
    lambda_s}$ if the categories are represented by the projection of the indicators\
    \ (in $\\mathbb{R}^l$)"
