  md: '# 9.2.9 Interpretation Aids


    We present the principal aids of GPA, specifying their meaning and, if appropriate,
    their equivalents in MFA.


    In GPA, superimposed representation provides a framework in which the total inertia
    of $N_I^f$ can be decomposed in many ways and can induce a comprehensive system
    of indicators (this decomposition is presented for MFA in Section 5.4). Total
    inertia (in practice set at 100) is decomposed between-inertia (inertia of the
    consensus $N_I$) and within-inertia (inertia of $N_I^f$ clouds, each bringing
    together $j$ partial points associated with individual $i$). These three inertias
    are themselves decomposed in three ways (an example of these decompositions is
    given below in Section 9.3.3).


    # Decomposition by Dimension


    +   - Between-inertia indicates the relative importance of the dimensions; here
    we find the eigenvalues of the PCA of $N_I$. This indicator is the same as for
    MFA.

    - Within-inertia indicates the degree of consensus of the dimension. This indicator
    is the same as in the MFA, in which we divide between-inertia to total inertia
    (see Section 5.4 and Table 5.2).


    # Decomposition by Group


    +   - The proportion of group $j$ in within-inertia measures the similarity between
    $N_I^f$ and $N_I$. In MFA, we calculate the canonical correlation coefficients
    and the $Lg$ measurements making it possible to evaluate the relationship between
    $N_I^f$ and $N_I$ by axis. There are two main differences between the methods:
    the nature of the indicator and whether they are calculated by axis or overall.
    These differences follow the different perspectives of the two methods. It is
    possible to introduce the indices of one method the other, except for the sums
    of within-inertia on several axes which have no meaning in MFA.

    - Decomposing within-inertia would make no sense.


    # Decomposition by Individual


    +   - The within-inertia of individual $i$ is its contribution to the mean cloud;
    this indicator also exists in MFA (careful: the mean cloud does not have exactly
    the same meaning) but then it is mostly used by axis in any factorial analysis.

    - The within-inertia of individual i$ indicates whether this individual is the
    object of overall consensus. In MFA, this indicator is calculated by axis but
    cannot be cumulated over several dimensions; in GPA, it can be calculated overall
    and broken down by axis.'
