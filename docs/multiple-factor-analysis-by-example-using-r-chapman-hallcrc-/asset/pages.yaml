  md: '# Comparing Groups of Variables


    +   1. This estimation is made in a framework common to several points of view
    (as seen in the previous chapters) which enrich one another in its interpretation.


    Two other characteristics differentiate the MFA estimation and that of the Indscal
    model.


    In MFA, the $F_s$ factors are orthogonal by construction. This constraint does
    not exist in the usual Indscal model. This constraint can seem useful at first
    as it is in factor analysis. However, there are sometimes correlated factors (underlying
    the evaluation of the distances). The orange juices are a good example of: the
    two experimental factors (origin and type) are not orthogonal and prove influential
    on the sensory plane. This is not a problem in factor analysis as the axes direct
    directions on the plane than the axes themselves (which can be done empirically,
    or more formally by optimal rotation of the axes). However, this is not possible
    with the Indscal model. This particularity, noticed since the origin, is especially
    clear with the interpretation in $R^n$; the plane generated by elements of rank
    1 $(w_1$ and $w_2)$ does not contain any other elements of rank 1 (other than
    $w_1$ and $w_2$). The result is that the usual Indscal algorithm retains its usefulness
    in the presence of nonorthogonal factors.


    The difference between the two approaches lies in the preliminary standardisation
    of the subjects: the Indscal algorithm standardises the subjects by fixing their
    total inertia at 1. The weighting in MFA is well suited to the Indscal model:
    particularly, multidimensional configuration must not be at a disadvantage in
    constructing the first axis.


    The Indscal model is Euclidean. The existence of a real distance makes it possible
    to imagine non-Euclidean individual data. However, the algorithms work from scalar
    product matrices, which means they require Euclidean individual data. Usually,
    individual data are not Euclidean. For example, when a subject is asked to evaluate
    successively the distances between stimuli, the distance matrix does not verify
    triangular inequality; such a matrix is not a distance in the strictest sense
    but a dissimilarity matrix (symmetrical matrix of positive numbers with 0 on the
    diagonal). In this case, Euclidean data are obtained by a preprocessing: Torgerson''s
    formula is applied to each dissimilarity matrix. The resulting matrix, a pseudo-scalar
    product matrix, is diagonalised and only the factors related to positive eigenvalues
    are retained. It can be shown that this procedure, known as factor analysis on
    distance tables (FADT), provides the best Euclidean approximation of a non-Euclidean
    distance matrix.


    Specific case. There is one case in which the individual data are Euclidean: the
    napping®. In this data-collection procedure, subjects are asked to lay out the
    stimuli on a large sheet of paper (originally a tablecloth, or *nappe* in French,
    hence the term *napping*) so that the distances on the paper reflect the perceived
    distances. This data-collection method is used in both of the examples below.'
