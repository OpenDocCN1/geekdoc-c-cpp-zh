  md: 'Case where only one of the two groups is multidimensional


    $K_1 = \{v\} \quad K_2 = \{z_k : k=1, K_2\}$


    Variable $z_k$ is endowed with weight $m_k$. When the variables are standardised,
    this weight is generally that of the MFA: $1/\lambda_k^2$. When the variables
    are only centred, we can consider reduction as a weighting (of the standardised
    variables) by their variance ($s_k^2$). Finally, in this case, their weight in
    MFA is $s_k^2/\lambda_k^2$, can be written as a sum of elements of rank 1. Thus


    $W_2 = \sum_k m_k z_k z_k$.


    This is why, by exploiting the bilinearity of the scalar product,


    $$\langle W_1, W_2 \rangle_D = \langle v'', \sum_k m_k z_k z_k'' \rangle_D = \sum_k
    m_k \langle v'', z_k'' \rangle_D = \sum_k m_k r^2(v, z_k)$ \n= \sum_k$ projected
    intertia of $z_k$ on $v$ (in $\mathbb{R}^1$) $= Lg(v, K_2)$.


    Again here, the scalar product is interpreted as a relationship measurement (see
    Section 6.2).


    General Case: Two multidimensional groups


    $K_1 = \{vh : h=1, K_1\} \quad K_2 = \{z_k : k=1, K_2\}$


    Variable $v_h$ is endowed with weight $m_h$ and variable $z_k$ is endowed with
    weight $m_k$.


    $W_1 = \sum_h m_h v_h v_h'' \quad W_2 = \sum_k m_k z_k z_k''$


    $$\langle W_1, W_2 \rangle_D = \sum_{h,k} m_h m_k r^2(v_h, z_k) = \sum_h m_h Lg(v_h,
    K_2) = \sum_k m_k Lg(z_k, K_1)$.$


    This scalar product in $\mathbb{R}^2$ is interpreted in space $\mathbb{R}^1$:
    the inertias of the variables of a group projected onto each of the variables
    of the other group are added together.


    It is worth noting that if, and only if, each variable from one group is uncorrelated
    with every variable from the other group. There is no maximum value as such as:
    this maximum depends on the dimensionality of the groups. More specifically, this
    quantity increases when the two groups possess a rich common structure (that is
    to say, when they have several common directions with high inertia in'
