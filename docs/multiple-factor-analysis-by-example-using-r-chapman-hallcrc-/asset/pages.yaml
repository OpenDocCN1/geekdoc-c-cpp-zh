  md: '# 8.3 Mixed Data


    The $J$ groups of variables are now decomposed into $J_1$ groups of quantitative
    variables, $J_2$ groups of qualitative variables and $J_3$ mixed groups.


    Simultaneously processing quantitative and qualitative variables by factorial
    analysis was addressed for FAMD (Chapter 3). However FAMD does not account for
    the notion of groups of variables. However, many applications require the possibility
    to account for variables of both kinds organised into groups. MFA offers such
    a possibility.


    A starting point for such analysis is to define a distance between individuals
    which simultaneously accounts for both types of variables. This question has already
    been addressed for FAMD. Concisely, it can be said that this distance must be
    that of the PCA if we consider only quantitative variables, and of MCA if we consider
    only qualitative variables. The new element here is the structuring into groups.
    The balance between both types of variable must be ensured within mixed groups
    (as in FAMD) and between the groups, as in MFA.


    # 8.3.1 Weighting the Variables


    The data table juxtaposes quantitative variables and indicators. The analysis
    simultaneously takes into account both types of data and function ''locally''
    as PCA for quantitative variables and MCA for qualitative variables. In practice,
    as FAMD, this result can be obtained directly by using the equivalence between
    PCA and MCA: the indicators can be processed as quantitative variables on the
    condition that they are appropriately weighted and coded (see Section 2.4).


    The groups are balanced by the weighting of the MFA. The initial weight of $k$
    of group $j$ is divided by:


    +   - $\lambda_j$ if group $j$ is quantitative or mixed ($\lambda_j^*$: first
    eigenvalue of the PCA or FAMD of group $j$)

    - $Q_j$ if group $j$ is qualitative ($\lambda_j^*$: first eigenvalue of the MCA
    of group $j$ including $Q_j^*$ variables (see Section 8.2.1))


    The same result can be obtained by replacing the raw data with the factors of
    the separate factorial analysis of the groups (PCA, MCA or FAMD depending on the
    case). These factors are either unstandardised, or standardised and attributed
    an initial weight equal to their associated eigenvalue. This property suggests
    that the contributions (in the fullest sense of the word) to the inertias of the
    axes be calculated both for the initial variables and for the factors of the separate
    analyses (an idea already used in Section 4.5).'
