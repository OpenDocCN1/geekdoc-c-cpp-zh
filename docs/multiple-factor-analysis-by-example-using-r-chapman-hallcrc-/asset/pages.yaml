  md: '# Preface


    Due to the extensive field of application, multiple factor analysis (MFA) is widely
    used today. This book is the first comprehensive account of the method in English:
    it brings together the theoretical and methodological aspects with application
    examples and details of how to implement them using an R package (FactoMineR).


    In the same way as principal component analysis (PCA) or multiple correspondence
    analysis (MCA), MFA is applied to tables which a set of individuals (one individual
    = row) is described by a set of variables (one variable = column). The particularity
    of MFA lies in the fact that within the active variables, it can account for a
    group structure defined by the user. Such data tables are called individuals variables
    organised into groups.


    This data format is widely used, firstly because it corresponds to the user''s
    approach when designing data collection. For example, someone designing an opinion
    poll organises the questionnaire into themes, each of which is developed using
    several questions (the questions are the variables and the groups of variables).
    This structure must be present when analysing the results of the poll. Secondly
    it is widespread because users often want to bring together data for the same
    statistical individuals in different contexts (e.g., geographical or temporal).
    In the food industry, for a given set of products, we often have sensory profiles
    from tastings conducted in different countries. These sets of data need to be
    analysed simultaneously at the same time preserving their individuality during
    both the statistical analysis and the interpretation phase.


    Experience in working with many diverse users has shown that multiple structure
    (into groups of variables) are fact in the standard data format used today. Along
    with this complex structure, the nature of the data is as complex as the variables
    can be quantitative or qualitative. It is therefore necessary for users to have
    access to a methodology for analysing individuals variables tables in which the
    variables are structured into quantitative, qualitative or mixed groups. This
    is precisely the field of application.


    MFA is the result of research by Brigitte Escofier and Jérôme Pagés in the early
    1980s. This method is now well established if we consider the wide range of software
    available. To name but a few software packages including an MFA procedure: FactoMineR
    (R Package) ade4 (R Package), SPAD, Uniwin (Statgraphics) and XLStat.


    Having achieved availability of the method, and with the data format justifying
    its implementation, one question remains: what exactly does'
  merge: -1
