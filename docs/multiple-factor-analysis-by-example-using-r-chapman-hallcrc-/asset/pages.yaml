  md: '# MFA and Procrustes Analysis


    # Remark


    When homotheties are authorised, one trivial solution is to choose 0 as the $q_j$
    coefficient for each cloud $j$. In order to avoid this, one can fix the total
    inertia of $N_l^2$ (union of $N_j^2$).


    In MFA, axis by axis, the aim is to maximise resemblance between-cloud inertia.
    Despite their resemblance, the two criteria only partially correspond because,
    by proceeding axis by axis, total inertia is no longer fixed, which cancels out
    the equivalence of minimising within-inertia and maximising between-inertia. Therefore,
    between the two methods:


    +   * The geometric representations differ; the mean clouds do not have exactly
    the same meaning.

    * The quantities to be maximised differ despite the existence of a resemblance.

    * The types of transformation of $N_l^2$ differ (rotation or projection).


    # 9.2.4 Properties of the Representations of $N_j^2$


    In GPA


    +   * The transformations of $N_l^2$ are orthogonal (which may include homothetic).

    * The shape of $N_l^2$ is perfectly respected; this is a very strong constraint,
    specific to GPA.

    * If $K_c$ is greater than 3, the superimposed representation of $N_l^2$ can only
    be examined using projections, for example, on the principal axes of $N_j$; these
    projections are conducted after fitting.


    # In MFA


    +   * The projection is conducted in parallel to the fitting.

    * The projection of $N_l^2$ is conducted on axes which do not belong to $\mathbb{R}^{K_r}$,
    or, from another point of view, nonorthogonal axes of $\mathbb{R}^{K_c}$. The
    result is a deformation of $N_l^2$, even if cloud $N_l$ is perfectly respected.
    These distortions have already been described in Section 5.5; an illustration
    is given in the example (referred to as $2^{3-1}$) described below in Section
    9.3.


    # 9.2.5 A First Appraisal


    MFA is a particular factorial analysis and a multicanonical analysis (in Carroll’s
    sense). It is not a Procrustes analysis if we consider the deformation of $N_j^2$.
    Nonetheless the issues which arise in Procrustes analyses and MFA are connected:'
