  md: '# 2 Multiple Correspondence Analysis


    Multiple correspondence analysis (MCA) is the factorial method adapted to tables
    in which a set of individuals is described by several qualitative variables. It
    can be presented in many ways. In France, following the work of L. Lebart, the
    most common is to focus on the similarities with correspondence analysis, a method
    designed to study the relationship between two qualitative variables. In the perspective
    of simultaneously processing quantitative and qualitative variables for the same
    individuals, which is one of the strengths of multiple factor analysis (MFA),
    it is important to focus on the similarities between principal component analysis
    (PCA) and MCA. This is presented in this section. In the presentation chosen for
    this chapter, which follows that PCA as as closely as possible, we nonetheless
    do not come to the conclusion that MCA is simply a specific case of PCA. They
    are indeed entirely distinct methods belonging to the same family: factorial analyses.


    # 2.1 Data


    The data are made up of a set of $I$ individuals each described by a set of $J$
    qualitative variables. The structure of the raw data table is identical to that
    of the table used for PCA:


    +   - Each row $i$ corresponds to a (statistical) individual.

    - Each column $j$ corresponds to a (qualitative) variable.

    - At the intersection of row $i$ and column $j$, we find the value of variable
    $j$ for individual $i$. Compared to PCA, the difference here is that the value
    is not quantitative: it is the category possessed by $i$ for variable $j$ (see
    Figure 2.1).


    The most common example of this type of data, which will often serve as a reference,
    is that of a survey. The statistical individuals are the questions and the variables
    are the questions themselves. Thus, for the question, “What kind of job do you
    do?” participants respond by choosing from a set of predefined responses, for
    example: {manual labourer, employee, senior management, etc).'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'In practice, in the questionnaires, the response categories for any given questions
    are often ranked. Thus, in an opinion poll, a classic approach is to offer a set
    of statements (in surveys, it is called a battery of items): for each statement,
    the participant must express his or her agreement or disagreement using a scale
    identified by a set of ordinate categories. For example:


    Express your agreement or disagreement with the following statement. All nuclear
    power plants should be closed.


    +   1. Totally disagree

    2. Disagree

    3. Agree

    4. Totally agree


    We could consider variables like this to be quantitative: that is to say, a degree
    of agreement ranging from 1 (totally disagree) to 4 (totally agree). In an example,
    we show the advantage of considering them as qualitative.


    # 2 Complete Disjunctive Table


    The table described in the previous section corresponds to a table of data as
    it should be entered into software. Another way of representing the data is a
    table crossing the individuals in rows with the categories in columns featuring,
    at the intersection of row $i$ and column $k$ (belonging to variable $j$), value
    $y_{ik}$ which:


    +   - 1 if individual $i$ possesses category $k$ (of variable $j$)

    - 0 in all other cases


    This table is not explicitly calculated by the user, the MCA is based on it. It
    is known as a complete disjunctive table (and denoted COT; see Figure 2-1): if
    we consider the $y_{ik}$ relative to any individual and any variable, these values
