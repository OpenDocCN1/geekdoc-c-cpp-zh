  md: '# 7.6.2 Estimating Parameters and Properties


    The usual Indscal algorithm (for estimating the model''s parameters) described
    in the original publication of the model using an alternating method: $z_s$ are
    fixed and $q_l$ are estimated; these values $q_l$ in turn to estimate $z_s$, and
    so on. In order to do this, the number of factors S must be fixed. These estimations
    are not nested (that is to say, the factors of the estimation for $S = 2$ do not
    coincide with the factors of an estimation with $S > 2$). In practice, this problem
    is resolved by launching the algorithm for several values of S and choosing a
    value of S which corresponds to a good balance between the goodness of fit and
    the number of factors.


    The MFA, seen as a method for estimating the parameters of the Indscal model,
    is conducted in two steps.


    **Step 1.** The $z_s$ are estimated. These factors correspond as much possible
    to high directions of inertia in each group. This (high inertia) does not appear
    explicitly in the Indscal model. It is essential in MFA and leads to a hierarchy
    of factors, from the most (overall) to the subjects, to the least important. This
    hierarchy between the factors is of course necessary in practice, and users of
    Indscal''s usual algorithms will obtain by ranking the factors in ascending order
    according to the individuals'' weights.


    **Step 2.** As $z_s$ are fixed, $q_l$ are estimated. According to the interpretation
    of $q_l$ as the relationship measurement $Lg(z_s, K_l)$, the weight subject attributes
    to dimension $s$ increases the more closely the dimension corresponds to a strong
    direction of inertia of its configuration of the stimuli. This corresponds perfectly
    to the meaning of the weights in the Indscal model.


    Compared with the usual algorithm, the estimation of the parameters of the Indscal
    model by the MFA presents five technical advantages:


    +   1. The weights $q_l$ are always positive. In comparison, the usual Indscal
    algorithm can provide negative weights interpreted as rounding errors if they
    are close to 0 but are otherwise not interpretable (in practice, these negative
    weights are replaced by zero).

    2. The weights $q_l$ have a maximum value of 1, a value reached which corresponds
    to the direction of maximum inertia of subject $j$. The scale of variation of
    these weights is therefore fixed, which makes it possible to compare them amongst
    subjects, axes and analyses.

    3. The estimations of the parameters of the models which have different numbers
    of factors are nested (the axes of the two-dimensional solution are the first
    two of the solutions with more than two dimensions).

    4. Thanks to the two-stage approach (first find $z_s$ and then $q_l$), supplementary
    subjects are introduced naturally.'
