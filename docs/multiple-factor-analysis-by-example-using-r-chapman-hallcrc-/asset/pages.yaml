  md: '# Multiple Factor Analysis by Example Using R


    analogous to histograms and scatter plots for quantitative variables. Then, it
    is necessary to go further: as with PCA for quantitative variables, the main aim
    of MCA is to study the variability of the individuals from a multidimensional
    perspective.


    With in mind, we consider each participant from the point of view of all of his
    or her responses, which we can call their response profile. As PCA, the diversity
    of these profiles will be studied using their principal dimensions of variability.
    At this general level, the objectives of PCA and MCA are identical.


    Similarly, as in PCA, we are also interested in the relationships between the
    variables. However, the variables are qualitative: not all of a relationship can
    be summarised by an indicator such as the correlation coefficient, even in a first
    approach (the link). the relationship indicates between two qualitative variables
    only measures the intensity or the significance of the relationship, but tells
    us nothing about the nature of link. We must visualise the associations between
    categories: for example, the relationship between the variables eye colour and
    hair colour is generalised by the privileged association between categories blue
    eyes and blonde hair; among things, people with blue eyes often have blonde hair
    than other people; blondes more often have blue eyes than other people. The most
    important elements of the results of MCA lie in the graphical representation in
    which each category is represented by a point, and the proximity between two points
    expresses a privileged association between the two categories.


    Also in PCA, this overall visualisation of the relationships will be established
    from the synthetic variables used to construct the factorial planes. In PCA, aside
    from their usefulness in representing categories, the search for synthetic variables
    can be an objective in itself. This perspective is less obvious in MCA as these
    synthetic variables are not of the same type as the variables that they synthesize.
    In concrete terms, a set of qualitative variables is summarised using quantitative
    variables by associating a coefficient to each category and, for each individual,
    calculating the coefficients for each of the categories it possesses. The difficulty
    is in choosing the coefficients. In factorial analysis, the main idea is to choose
    synthetic variables with the greatest possible variance.


    # 2.4 Clouds of Individuals and Variables


    Let us consider the complete disjunctive table. By following the approach used
    in PCA, we construct the cloud of rows (individuals) and of the columns (categories)
    for this table. The analogy with PCA is clearly seen when considering each column
    of the CDT as an indicator variable.


    As in PCA, the data table must be transformed prior to the analysis. Indeed, in
    the raw CDT, the possession of a category k by an individual induces'
