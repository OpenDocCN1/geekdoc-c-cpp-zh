  md: '# MFA and Procrustes Analysis


    # Summary


    +   - Both methods have systems of indicators which make it possible to scan all
    of the issues that arise when examining a superimposed representation.

    - However, in MFA it is not possible to add together the projected inertias of
    $N_j$ over several axes.

    - In GPA, the forced nature of the superposition, which weighs on the consensus,
    also consequently weighs on the indicators as shown in the following example ($2^{3-1}$).


    # 9.2.10 Representing the Variables


    In both methods, the correlation coefficients (along with the covariances where
    appropriate) are calculated between the initial variables and the dimensions of
    the mean cloud. These coefficients are represented graphically in the same way
    as PCA.

    Here, the difference between the two methods is caused by the fact that in MFA
    the initial variables play a direct role (through the within-and-between-group
    relationships) in the mean cloud, whereas in GPA they intervene indirectly. As
    a result:


    +   - The representation of variables has its own optimality in MFA, which is
    not the case in GPA.

    - The transition relation which expresses the coordinate of a mean individual''s
    coordinates does not exist in GPA.

    - The relationship which in MFA expresses the coordinate of a particular ($i^j$)
    according to the coordinates of the variables (group $j$) is all the more specific
    to MFA. This relationship, described in Section 5.2 (property 3), is key to the
    interpretations.


