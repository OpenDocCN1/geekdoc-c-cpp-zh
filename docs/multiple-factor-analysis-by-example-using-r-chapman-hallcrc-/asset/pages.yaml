    This factor is specific to group 1 and closely related to the third factor of
    the MCA for this group ($F_3^{AFM}, F_3^g$ = .95). Being three-dimensional, group
    1 could not be perfectly represented on the first plane of the MFA.


    In MCA, each variable, generates in $\mathbb{R}^1$, a subspace of dimension (number
    of categories - 1). For group 1, the first plane of the MFA takes into account
    the two length dimensions, the single width dimension and one width dimension.
    Thus, the third factor of the MFA ‘automatically’ expresses the remaining width
    dimension.'
