  md: '# Comparing Clouds of Partial Individuals


    # 103


    ![](img/6b887cdbc8ce8df1d48c89228f9b63a5_117_0.png)


    Figure 5.2

    Procrustes analysis of the data in Figure 5.1. A: graphs 1 and 2; B: graphs 1
    and 3.


    We obtain a superimposed representation of partial clouds highlighting the similarities
    and differences in shape between the clouds as well as possible (that is to say
    in terms of a given criterion).

    nThe results of the Procrustes analysis applied to the two above cases are given
    in Figure 5.2. In the first case, the similarity of the shapes of the two clouds
    is clear.

    Chapter 9 gives more information on Procrustes analysis. In the present chapter,
    references to Procrustes analysis are useful for defining our objective: to construct
    graphs featuring partial points, or in other words, each individual as seen by
    each group of variables. This chapter describes MFA’s solution to this problem.


    # 5.2 Method


    The individuals’ space $\mathbb{R}^K$ can be seen as a direct sum of spaces $\mathbb{R}^{K_j}$:


    ```

    $$\mathbb{R}^K = \bigoplus_{j=1}^L \mathbb{R}^{K_j}$.

    ```


    Space $\mathbb{R}^{K_i}$ used above to define $N_i$ is isomorphic to subspace
    $\mathbb{R}^{K_i}$ of $\mathbb{R}^K$ (see Figure 5.3). In MFA, $\mathbb{R}^K$
    is endowed with the diagonal metric $\mathbf{M}$ containing the opposite of the
    first eigenvalue of the separate PCAs for the groups of variables (in $\mathbb{R}^K$).
    This metric, being constant within a group of variables, does not question this
    isomorphism.


    Table $X_j$ contains the coordinates of $N_j$ in subspace $\mathbb{R}^{K_j}$ of
    $\mathbb{R}^K$. As subspaces $\mathbb{R}^{K_j}$ are orthogonal by construction,
    cloud $N_j^!$ is the orthogonal projection of'
