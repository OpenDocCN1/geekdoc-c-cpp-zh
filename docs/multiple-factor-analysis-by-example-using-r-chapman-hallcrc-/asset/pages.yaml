  md: '# #6 Factors Common to Different Groups of Variables


    Historically, the simultaneous analysis of several groups of variables focused
    on looking for factors common to these groups. This is the aim of canonical analysis,
    of which there are many variations. This chapter shows how this point of view
    is taken into account in multiple factor analysis (MFA) and how MFA can be considered
    as a specific canonical analysis. We begin by describing the objectives corresponding
    to this new perspective, in particular the notion of common factor.


    # ## 6.1 Objectives


    A major aspect of studying a table of individuals × variables lies in identifying
    relationships between variables. Thus, in the simple case of one group of quantitative
    variables, the correlation coefficients between the variables taken two by two
    are examined. This analysis can also be conducted with several groups of variables,
    in which case we distinguish between-group and within-group correlations. However,
    simultaneously taking into account several groups of variables implies that we
    should look at the relationship between the groups of variables themselves. The
    details concerning the scope of such a concept are outlined below.


    This is not a new issue: in 1936, J. Hotelling published an article entitled ‘Relationships
    Between Two Sets of Variables.’ To introduce the issue, he presented the example
    of connecting supply and demand for raw materials in agriculture, highlighting
    the need to analyse all the raw materials simultaneously (for the supplies on
    the one hand, and the demands, are interdependent). At the end of this section
    we describe the issue analysed by Hotelling in further detail. Below, however,
    we look at this problem in what we consider to be a more natural way, given the
    exploratory analysis context of this book.


    Let us look back at the case of a single group of quantitative variables. Beyond
    the paired correlations, the relationships are studied with principal component
    analysis (PCA). The principal components are helpful for representing the initial
    variables as they maximise projected inertia. In standardised'
