    Free sorting (= categorisation). Each judge partitions the products so that each
    classes products which are similar to one another (in the judge''s opinion) and
    between the classes where the products differs. In this data-collection method,
    each judge''s data are a qualitative variable (defined on the products).


    Napping®. Each judge provides a planar representation of products in such a way
    that two are closer together (or farther apart, respectively), the more similar
    they are (or different, respectively). Originally, each judge physically laid
    out products on a large sheet of paper 40 cm × 60 cm (a tablecloth, or nappe in
    French, hence the term napping); in practice, the nappe defines a configuration
    of products provided by a judge). Nowadays, this operation is performed on a screen:
    using specially designed software, the judge positions icons representing the
    products. In this data collection method, each judge''s data are a pair of quantitative
    variables (the products'' coordinates).


    For the distances to be respected, the variables are not standardised when the
    data are analysed.


    Sorted napping combines the two previous approaches. After having positioned the
    products on the nappe, the judge groups the products which he believes to be particularly
    similar. In this method, from each judge include three variables (the set of these
    three variables is a sorted nappe): a pair of quantitative variables (which make
    up we refer to as the nappe) and a qualitative variable (sorting).


    To illustrate the factorial analysis of such data, we use a small example made
    of two sorted nappes (Table 10.4 and Figure 10.7).


