    # Remark


    If, in the data from the previous example, GPA are conducted using homotheties,
    group 2 is attributed a 0 coefficient, which illustrates how introducing homotheties
    makes it possible to exclude a group. However, introducing homotheties satisfactorily
    solves the problem of negative correlations between homologous dimensions only
    in one-dimensional cases, as the homothety is applied in the same way as all the
    dimensions of the group.


    # 9.2.8 Representing Individuals


    Preliminary Note. When the Procrustes model is verified exactly (that is to say,
    Nⱼ infer one another by rotation or symmetry), both methods provide the ''correct
    answer'', that is to say, a superimposed representation of Nⱼ which the homologous
    points are equal and the shapes of Nⱼ perfectly respected. For GPA, it is clear
    as the mean cloud is identical to Nⱼ after rotation. For MFA, consider three groups
    X = (Z, ZA, ZB) with A'' = IA and B'' = IB (with IA of the appropriate size);
    the principal components of the MFA are eigenvectors of X'' = 3ZZ''; the mean
    cloud and each partial component could therefore have the same principal components.


    In identifying common factors, the GPA framework is restricted compared to that
    of MFA, as it supposes that:


    +   - Are Kj common orthogonal factors.

    - The factors are common to all groups.


    These constraints weigh on all of the results (in particular on the first factors),
    as we are looking to find an overall optimum. Let us consider the case of a factor
    common to only certain groups.


    +   - In MFA, Nⱼ which do not possess this factor are orthogonal to it; they have
    no influence on it.

    - In GPA, all directions are common to all the groups and a factor to some groups
    will be superimposed with the direction of the other groups with which it is not
    related. In this case, identifying this common factor can be disturbed: the mean
    configuration does not correspond to that of this common factor as it is distorted
    by the representations of the groups which have nothing in common with it, but
    which are nonetheless superimposed on it.'
