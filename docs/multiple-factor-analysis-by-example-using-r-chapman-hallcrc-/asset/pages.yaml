    # 11.2 Euclidean Vector Space


    In factorial analysis, we work in vector spaces. The notions of distance, norm,
    projection and angle (and therefore scalar product) are essential to this type
    of analysis. Here, we show how these notions are related to one another and how
    they can be calculated.


    A vector space (finite dimensional) in which distance (= metric) is defined from
    a scalar product is said to be $Euclidean$. In factorial analyses, we always work
    in Euclidean spaces.


    # 11.2.1 Vector Space Endowed with the Usual Distance


    Two-Dimensional Space

    In three-dimensional space $(\mathbb{R}^3$, which is all around us), we are familiar
    with the notions of distance, length and angle. We start from this basic knowledge,
    first reasoning on the plane $(\mathbb{R}^2)$ to keep things simple, and we conduct
    simple calculations from two points $A$ and $B$ (see Figure 11.1). By considering
    $\mathbb{R}^2$ as a vector space, $A$ and $B$ are vectors, connecting the origin
    with points $A$ and $B$ (here we recognise the point of view of the variables
    in PCA). As a vector it is denoted $\vec A$. To simplify notation, we use the
    same letter A to designate the point, the vector and the matrix (with one column)
    bringing together the coordinates of $A$ ($x_a$ and $y_a$).


    $Pythagoras$''s theorem is used to calculate the squared distance between $A$
    and $B$.


    $d^2(A, B) = (x_a - x_b)^2 + (y_a - y_b)^2$.


    The length of the vector $\vec A$, also known as its norm, denoted $\|\vec A\|$
    or simply $\|A\|$, is calculated as the distance between $O$ and $A$ thus


    $$\|\vec A\|^2 = \|A\|^2 = d^2(O, A)$.'
