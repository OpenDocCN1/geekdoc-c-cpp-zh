- img_proc: true
  md: '# 4 Weighting Groups of Variables


    This chapter is the first devoted to multiple factor analysis (MFA). MFA is applied
    to tables in which a set of individuals is described by several sets of variables.
    The key points of this method are dealt with in succession over four chapters.
    The first aims to balance the groups in an overall analysis by weighting the variables.
    This characteristic of MFA is vital, in the sense that it is the source of many
    properties of this method.


    # 4.1 Objectives


    In order to keep things simple, we here deal with standardised quantitative variables.
    As the table to be analysed is an individuals × variables table, the two main
    issues associated with it are that of principal component analysis (PCA), that
    is to say:


    +   1. A representation of the variability of individuals. This is done using
    the principal dimensions of this variability.

    2. A representation of the correlation between variables constructed using synthetic
    variables (the principal components).


    The partition of the variables (into groups) does not appear at this general level.
    Therefore we need to specify the influence of the group structure on the issue
    at hand. The fundamental idea is that identifying groups among the variables more
    or less implies a balance between them (the precise meaning of which still needs
    to be determined). Indeed, what can be said about an analysis as this which, for
    example, might highlight a factor depending primarily on one group alone? This
    factor not merely the result of an especially high inertia for this group of variables?
    In this case it not particularly noteworthy. However, if the inertia of the groups
    has been balanced (in a sense defined hereafter), users would be able to interpret
    the impossibility in this data of displaying a direction of high inertia to which
    the different groups contribute (more or less) equally. Without getting into the
    technical details, which we do later, we can specify what we expect from such
    a balance. We can approach this issue from many different perspectives. As we
    work within the context of factorial analysis, we focus our attention on the inertia
    of the clouds studied.'
  merge: -1
  pgno: 93
