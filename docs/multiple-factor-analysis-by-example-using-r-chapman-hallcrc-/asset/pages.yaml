  md: '# Multiple Factor Analysis by Example Using R


    This distance takes into account the null coefficients $y_{ik}$ for individual
    $i$, induced by the categories it possesses. The mean of these coefficients (more
    precisely its deviation from the value 1) indicates the extent to which the individual
    $i$ presents rare categories. The more rare it presents, the farther it is from
    the origin (and thus the more unusual it is; a satisfactory interpretation of
    a distance from the origin).


    # Total Inertia of $N_j$ (With Respect to $G_j$)


    ```

    $Total Inertia (N_j / G_j) = \sum_{i} p_i d^2(i, G_i) = \frac{K}{J} - 1.$

    ```


    The total inertia of the cloud depends not on the content of the data table but
    on one aspect of its format: the mean number of categories per variable. This
    result is the same as that of standardised PCA, when the total inertia is equal
    to the number of variables (and therefore does not depend on the content of the
    table).


    # Distance Between Two Individuals $i$ and $l$


    ```

    $d^2(i, l) = \sum_{k} p_k \left(\frac{y_{ik}}{p_k} - \frac{y_{lk}}{p_k}\right)^2
    = \frac{1}{J} \sum_{k \in K_j} \left(\frac{y_{ik}}{p_k} - \frac{y_{lk}}{p_k}\right)^2$

    ```


    The last term determines the contribution of variable $l$ to the distance between
    $i$ and $l$. If individuals $i$ and $l$ present the same category for variable
    $j$, this category contribution is worth 0. Otherwise, by denoting $k$ (and, respectively,
    $h$), the category possessed by $i$ (and, respectively, $l$), it has a value of


    ```

    $\frac{1}{J} \left(\frac{1}{p_k} + \frac{1}{p_h}\right)$.$

    ```


    Thus, two individuals are all the most distant when they possess different categories
    for a large number of variables, and particularly when these categories (those
    possessed by only one of the two) are rare. This distance is more than satisfactory.


    # Remark


    The distance between two individuals $i$ and $l$ can also be expressed:


    ```

    $d^2(i, l) = \sum_{k} p_k \left(\frac{y_{ik}}{p_k} - \frac{y_{lk}}{p_k}\right)^2
    = \frac{1}{J} \sum_{k} p_k (y_{ik} - y_{lk})^2.$

    ```


    We reach this relationship when, as is usually the case, we present MCA from correspondence
    analysis: the data are transformed into profiles and the category $k$ is attributed
    to the inverse of its weight. The PCA of $x_{ik}$ does indeed yield the same results
    as the MCA.'
