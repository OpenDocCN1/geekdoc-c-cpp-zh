  md: '# Principal Component Analysis


    Principal component analysis (PCA) is the most widely used factorial method. It
    is applied to tables in which a set of (statistical) individuals is described
    by a set of quantitative variables. In this chapter, we present a detailed description
    of this method, both in theory and in practice. This is the perfect opportunity
    to introduce a number of concepts used to analyse multiple tables, but also to
    apply to simple ones. This enables the reader to see the specifications of multiple
    factor analysis (MFA) better.


    # Vocabulary: Factor Analysis or Factorial Analysis?


    Both families of methods are very similar, Roughly, we can say that factor analysis
    is based on a model whereas factorial analysis is purely exploratory. Typically,
    principal component analysis is a factorial analysis. The same is true for correspondence
    analysis and all of the methods presented in this book. In this case, why do we
    say multiple factor analysis? It is simply a mistranslation of a method originally
    introduced in French under the name Analyse factorielle Multiple. Now, multiple
    factor analysis is is widespread and, in our opinion, changing its name to multiple
    factorial analysis would lead to yet more confusion.


    # 1.1 Data, Notations


    We start by studying a table with the following characteristics:


    +   - Each row represents a statistical individual; we denote $I$ the number of
    individuals. $I$ also designates the set of individuals. Using the same letter
    to designate both the set and its cardinal is not confusing as the meaning is
    always clear from the context.

    - Each column represents a quantitative variable; $K$ represents the number of
    variables (as well as the set of variables).

    - At the intersection of row $i$ and column $k$, is $x_{ik}$, the (numerical)
    value of individual $i$ for variable $k$.


    Let us add two classical notations:


    +   - Mean of variable $k$; this is not used much as the variables are generally
    centred, but it can sometimes be useful for the centring to appear explicitly;

    - $s_k$: The standard deviation of variable $k$.'
