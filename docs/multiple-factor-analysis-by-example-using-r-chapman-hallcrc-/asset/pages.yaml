    # 10.6 Representing the Nodes


    In MFA, the representation of groups of variables (known as the relationship square;
    see Section 7.3) presents an interesting property: the coordinate of an active
    group along axis s is interpreted both as the relationship measurement lg between
    group j and the 5th factor, and as the contribution of group j to the construction
    of the rank s.


    In HMFA this property only exists for nodes directly linked to the root node (HMFA
    relies on an MFA of these nodes). For the others, two notions do not coincide.
    In this type of graph, it is natural to favour the notion of relationship to enable
    the representation of supplementary elements. With this choice, a set of variables
    which appear twice in the hierarchy lies in place.


    In the example of the orange juices, this representation (see Figure 10) shows
    that:


