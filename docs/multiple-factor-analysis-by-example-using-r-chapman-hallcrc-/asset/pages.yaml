  md: '# Multiple Factor Analysis by Example R


    lead to correlations between chemical characteristics. Thus, $r(pH, sucrose) =
    .82$: overall, the least acidic juices (chemically) have the highest sucrose content.


    (B) These relationships between chemical characteristics influence several sensory
    variables and therefore induce relations between them. But there is more: even
    if we ask them to give a separate analysis of their perceptions, these perceptions
    will be simultaneous. Considering the taste sensations only, we first perceive
    a taste balance, within which we try to evaluate the basic tastes. As a result,
    we evaluate relationships between sensory variables. Thus, $r(sourness, sweetness)
    = -.90$. A first idea is to connect this to the relationship mentioned above (pH,
    sucrose). But we can also consider the sweet/sour taste balance (to reduce the
    sourness of a lemon, we often add sugar). To study the relationship between chemical
    and sensory data, we might need to go beyond paired correlations (that is to say
    between a chemical variable and a sensory variable), and to consider the general
    chemical and sensory profiles (rather than their separate elements). With this
    in mind, what does the common factor have to offer?


    Considering the between-group and within-group correlations amongst the four variables
    mentioned above (pH, sucrose, sweetness and sourness), the small number of variables
    (four) which, moreover, are easy to interpret (at least first glance), and finally
    the small number of individuals, we might think about confronting two classes
    of three juices each:


    +   1. The two Tropicana and Fruvita; these three juices have a high pH and a
    high sucrose content. They are perceived as sweet and slightly sour.

    2. The two Pampryl and Joker; these three juices present exactly the opposite
    characteristics.


    This opposition illustrates the concept of common factor. It is considered as
    a common factor in the sense that it is linked to variables from both groups (of
    variables). Its main advantage lies in the fact that the description of the opposition
    between these two classes (of juices) synthetically presents the relationships
    between the variables of the two groups, both between-group and within-group.


    Finally, in this small example (6 individuals, 2 groups of 2 variables each),
    it was possible:


    +   - To intuitively highlight this common factor without specific statistical
    analysis

    - To validate the summary provided by the common factor by directly analysing
    all of the correlation coefficients'
