    Here we note that MCA can highlight nonlinear relationships. The quantitative
    perspective observes that the second factor is not correlated with length and
    width. The qualitative perspective also depicts an absence of relationship with
    width, but a nonlinear relationship with length.

    From the point of view of the superimposed representation of partial clouds, it
    should be noted that the dispersion of partial individuals is greater for group
    1 than for group 2. This is a consequence of the lower decrease of inertias of
    the separate analysis of group 1. In parallel, $F_2$ of the MFA is closely linked
