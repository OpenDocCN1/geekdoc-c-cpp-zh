  md: "# Principal Component Analysis\n\n# 1.4 Centring and Reducing\n\nIn PCA, the\
    \ data table is always centred, as denoted by\n\n```\n$X_{ik} \\leftarrow X_{ik}\
    \ - \\bar{X}_k,$\n```\n\nwhere $x_{ik}$ designates the general term of the analysed\
    \ table.\nWithin space $\\mathbb{R}^k$, centring is geometrically interpreted\
    \ as the positioning of the origin to the mean point $G_j$: this operation does\
    \ not alter the shape of the studied cloud $N_j$. Within the space $\\mathbb{R}^l$,\
    \ centring is interpreted as the projection of $N_k$ on the subspace orthogonal\
    \ to the first bisector (or the bisector is the line containing the constant functions).\n\
    \nLet us outline the proof of this second result, which is widely used in statistics.\
    \ Let 1 be the vector of $\\mathbb{R}^l$ (belonging to the first bisector), all\
    \ the components of which have a value of 1. With the metric $D$, this is a unit\
    \ vector. Let $\\mathbf{1}^\\perp$ be the subspace of $\\mathbb{R}^l$, supplementary\
    \ orthogonal of $\\mathbf{1}$. Vector $v$ (denoted $\\mathfrak{v}$) of $\\mathbb{R}^l$\
    \ can be decomposed into its projection on $\\mathbf{1}$ (denoted $P_1(v)$) and\
    \ on $\\mathbf{1}^\\perp$ (denoted $P_\\perp(v)$). Thus\n\n```\n$P_1(v) = v -\
    \ P_perp(v).$\n```\n\nIt is easy to show that $P_1(v)$ is the constant vector\
    \ for which each component has a value of $\\mathfrak{v}$. The value to the right\
    \ of the $=$ sign is therefore the centred variable $v$. Thus, in PCA, cloud evolves\
    \ over $\\mathbf{1}^\\perp$, a subspace of dimension $l-1$.\n\nWhen the variables\
    \ are not expressed in the same units, the data must be reduced as follows,\n\n\
    ```\n$X_{ik} \\leftarrow X_{ik} - \\frac{\bar{X}_k}{s_k}$\n```\n\nThe PCA is said\
    \ to be standardised (if the data are only centred, the same units, the PCA is\
    \ said to be unstandardised). When the variables are expressed in the same units,\
    \ the opportunity to reduce must be discussed on a case-by-case basis. In practice,\
    \ unless there is a specific reason, users tend to reduce the data because, as\
    \ we show, this balances the influence of each variable.\n\nWithin the space of\
    \ individuals, reduction is interpreted geometrically as taking the standard deviation\
    \ $s_k$ as a unit of measurement for variable $k$. Within the variables' space,\
