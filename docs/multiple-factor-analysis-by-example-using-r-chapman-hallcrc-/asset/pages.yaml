  md: '# Comparing Groups of Variables


    as not bitter at all, very sweet, and so on. We denote $z_s(i)$ the value of the
    sth factor for stimulus $i$; fundamentally, there is no ordinal relationship between
    the factors.


    +   2. In their overall evaluation of stimuli, the subjects do not attribute the
    same importance to the different factors. For example, some judges give great
    importance to differences in sourness (perhaps because they are particularly sensitive
    to acidity) and very little importance to differences in bitterness; these judges
    might, for example, consider two juices with very different bitterness as similar,
    and considers juices which only differ according to their sourness as very different.
    Let $q_s^j$ be the weight attributed by subject $j$ to factor $z_s$.


    With these assumptions, the distance perceived by subject $j$ between the stimuli
    $i$ and $l$ is expressed:


    ```

    $d_j^2(i, l) = \sum_s q_s^j (z_s(i) - z_s(l))^2 + \text{residual}$.

    ```


    In this model, the factors $z_s$ and the weights $q_s^j$ are the parameters to
    be estimated. There are no constraints on the residuals, as the model is not designed
    within a classic inferential framework.

    in other words, according to this model, there is a configuration of stimuli (defined
    by $z_s$) that each subject $j$ ''sees'' with its own diagonal matrix. The point
    of view makes it possible to write the model for the scalar products. By denoting
    $w_j(i, l)$ the scalar product between two stimuli $i$ and $l$ from the point
    of view of subject $j$:


    ```

    $w_j(i, l) = \sum_s q_s^j z_s(i) z_s(l) + \text{residual}$,

    ```


    which generates, for matrix $W_j$ bringing together the scalar products for subject
    $j$:


    ```

    $W_j = \sum_s q_s^j z_s z_s'' + \text{residual}$.

    ```


    In this equation, we recognise the decomposition, in $\mathbb{R}^{12}$, of $W_j$
    into a sum of symmetrical elements of rank 1. The representation of the groups
    of variables in the MFA can therefore be interpreted in terms of an Indscal model
    in which:


    +   - The stimuli are the individuals; the subjects are the groups of variables.


    +   - The factors $z_s$ of the model are the standardised factors $v_s$ (of the
    MFA).


    +   - Weight $q_s^j$ is the coordinate, in $\mathbb{R}^{12}$, of group $j$ along
    the direction of rank $s$.'
