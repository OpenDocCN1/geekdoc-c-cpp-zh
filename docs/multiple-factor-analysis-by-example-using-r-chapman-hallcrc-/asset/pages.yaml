  md: '# Comparing Groups of Variables


    # 7.3 Norm in the Groups’ Space


    In $\mathbb{R}^{f2}$, we associate a norm with the scalar product defined above.
    The square of this norm, denoted $N_G$, is used as an indicator of dimensionality.
    Thus


    ```

    $N_G(W_j) = ||W_j||_D^2 = \langle W_j, W_j \rangle_D = \text{trace}(W_j D W_j
    D) = \sum_s(\lambda_s)^2$

    ```


    Due to the weighting in MFA, this norm can be written:


    ```

    $N_G(W_j) = ||W_j||_D^2 = \frac{1}{(\lambda_1)^2} \sum_s (\lambda_s)^2 = 1 + \sum_s
    \frac{\lambda_s^2}{\lambda_1^2}$

    ```


    The groups of variables are not standardised in MFA. The norm of a group increases
    if it has a high number of directions of inertia equal to (in practice, neighbouring)
    its first eigenvalue. This is why $N_G$ is considered an indicator of dimensionality.


    **Dimensionality and Dimension.** The dimension of a group of variables is defined
    as that of the subspace generated by the variables of the group. In this subspace,
    the users are only interested in the dimensions associated with high inertia.
    We can then define dimensionality as the number of these dimensions of high inertia.


    In the case of the six orange juices, $N_G$ is 1.039 for group 1 and 1.109 for
    group 2. As has already been mentioned (see comment, Table 4.5), the first has
    only one notable dimension and the second two. From this perspective, indicator
    $N_G$ does indeed rank the groups according to their dimensionality. However,
    this indicator suggests a deviation between the two dimensionalities which is
    much lower than that suggested by the sequence of eigenvalues. This is because
    these eigenvalues are squared (in calculating $N_G$), making them low compared
    to (the first one equal to) 1 (see Table 7.1).


