    | b | 0 | 0 | 8 | 4 |

    | c | 10 | 4 | 0 | 4 |

    | d | 10 | 4 | 4 | 0 |

    | Variance | 25 | 4 | 8 | 8 |


    > ᵃ {X1, Y1}: Coordinates for the left configuration (see Figure 7.4).'
