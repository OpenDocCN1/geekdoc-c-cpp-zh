    TABLE 7.4

    Cards. Inertias in the Separate PCAs and MFA


    | | Total | F1 | F2 |

    |---|---|---||

    | PCA Group 1 | 29 | 25 | 4 |

    | PCA Group 2 | 16 | 8 | 8 |

    | MFA | 3.16 | 2 | 1.16 |

    | of which group 1 | 1.16 | 1 | 0.16 |

    | of which group 2 | 2 | 1 | 1 |


    Two representations of the individuals are possible in the Indscal model:


    +   1. Standardised factors. This results directly from the model in the sense
    that the weights $q_j$ are applied to the factors. This is the usual choice in
    the Indscal programs.

    2. Unstandardised factors, with their norm measuring their relative importance.
    This is the choice of the MFA (see Figure 7.5), conducted independently of the
    Indscal model but can be interpreted in terms of this model: that is to say, the
    square of a factor (the associated eigenvalue) is the sum of the weights of all
    of the active groups for this factor ($q_j; j=1, J$).


    The configuration of individuals in Figure 7.5 shows that the first factor is
    generally more important (for the subjects) than the second: its elongated shape
    illustrates these importance. Overall (for the groups/subjects), shape is more
    important than colour. Finally, this configuration is a ‘mean’ representation
    of clouds associated with each group.


    This relative importance can also be read on the groups’ representation (Figure
    7.5), thus, the weights for the first axis are much greater than for the second.
    The fact that these weights have an upper limit of 1 in MFA makes it possible
    to be more precise: in this example, the first factor corresponds to the maximum
    dimension of inertia of each group.


    In practice, this group maximum is unique (the PCA generates two equal first eigenvalues).
    From this perspective, the case of the second group is particular due to its symmetry
    (clearly visible in Figure 7.4); both factors are of equal importance. It is also
    noted that, in the relationship square, the point of coordinates (1,1) does not
    correspond to the ‘mean’ configuration of the individuals (see Figure 7.5) but
    to the standardised factors. This is why, as an aid, the point to the configuration
    of the individuals of Figure 7.5 is represented. This is done under the label
    MFA (for mean configuration of MFA). The coordinates of this point are $(1,\lambda_2/\lambda1)$,
    denoting $\lambda1$ and $\lambda_2$ the first two eigenvalues of the MFA.


    Table 7.4 summarises the principal inertias in this analysis. The simplicity of
    these data makes it possible to find all these results easily. The eigenvalues
    of the separate analyses coincide with the variances of the initial variables.
    The groups’ inertias, on the second axis of the MFA, are obtained by dividing
    the second eigenvalue by the first.'
