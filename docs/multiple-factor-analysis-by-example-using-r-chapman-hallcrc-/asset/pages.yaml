    # 7.6 The Indscal Model\n\nThe Indscal model is useful for analysing a set of\
    \ distance matrices. It is expressed directly in space $R^2$. In addition, the\
    \ analysis of cloud $N_l$ included in the MFA corresponds to this model. Hence\
    \ the introduction of this model in this chapter.\n\n# 7.6.1 Model\n\nIn the previous\
    \ sections, each group $j$ is represented by the shape of cloud $N_l^j$ with which\
    \ it is associated. Technically, to represent this shape, having considered the\
    \ distance matrices associated with $N_l^j$, the scalar product (between the individuals)\
    \ matrix $W_j$ is used. These two points of view, distances and scalar products,\
    \ are brought together in the Indscal model, a model designed to analyse a set\
    \ of distance matrices (relative to a given set of individuals).\n\nIn the original\
    \ Indscal model data, $J$ subjects were asked to evaluate the resemblances (or\
    \ distances, in practice these distances are similarities; see one of the following)\
    \ between $I$ stimuli. *Directly* means that we do not ask each subject $j$ for\
    \ an evaluation of each characteristic of each stimulus, but for an overall evaluation\
    \ of the distance $d_j(i, l)$ for each pair of stimuli $(i, l)$. The data are\
    \ made up of a set of $J$ distance matrices (of $I \times I$ dimension).\n\nThe\
    \ Indscal model is based on two assumptions:\n\n+   1. The stimuli are differentiated\
    \ according to $S$ factors (or characteristics) for which there is a consensus\
    \ among the subjects. If the stimuli are orange juices, an example of such a consensus\
    \ would be: all of the subjects perceive juice I as very bitter, very sweet, and\
    \ so on; juice 2"
