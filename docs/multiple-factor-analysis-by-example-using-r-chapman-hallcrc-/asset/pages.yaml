    # Comparing the Estimations: Quality of the Fit


    In the usual Indscal procedure, this quality is measured by the proportion of
    inertia explained by the model (sum of squares of the residuals divided by the
    total variability). In MFA, this quantity is interpreted as the proportion of
    inertia of cloud $N_i$ expressed by an axis or plane (see 7.5).


    Table 7.5 brings together the quality of fit of the Indscal model for different
    procedures. With two dimensions, this quality is slightly better (.4961 > .4286)
    for the Indscal estimation (see Figure 7.7) than for the MFA (see Figure 7.7).
    This is the expected result: the orthogonality constraint included in the MFA
    solution can only decrease the quality of the fit.


    This is why we compare the estimation associated with only the first factor of
    the MFA and the Indscal estimation with one dimension. The difference between
    the two procedures still favours Indscal but this time much less clearly (.2862
    > .2773). Here, again, we can legitimately expect a better fit by Indscal, for
    the algorithm specifically aims to optimise this fit, which is not the case in
    MFA.


    Finally, it is important to mention that groups are weighted differently in the
    two approaches: in Indscal, it is the tasters'' total inertias which are standardised.
    Does this procedural difference explain the differences in the quality of the
    fit? In this data, this difference in weighting has little influence (after the
    MFA weighting, the tasters have more or less the same norm in fact except for
    t 10, whose to choose only one dimension has already been mentioned. This is why
    we conduct the analyses without t 10, which should attenuate the weighting effect.
    As expected (see Table 7.5), the differences still favour the Indscal procedure,
    but to a lesser extent (.4860 > .4674) for the two-dimensional solution and .3118
    > .3073 for the one-dimensional solution).


