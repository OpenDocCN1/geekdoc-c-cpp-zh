  md: '# # Comparing Groups of Variables and Indiscal Model


    The previous chapters present detailed tools for analysing relationships between
    groups of variables, both from the point of view of the variables (between-group
    correlations) and the individuals (comparison of partial clouds). However, when
    there is a large amount of data (many groups, each with a lot of variables, and
    a large number of individuals), more general tools are required, at least first,
    in order to answer questions such as:


    +   - Given two groups of variables, can we consider them to be related?

    In other words: overall, are the two associated partial clouds similar?

    - As is the case for representations of individuals and variables, it is possible
    to generate graphs in which each group is represented by a point, with the proximity
    of points $j$ and $h$ indicating a relation/similarity between groups $j$ and
    $h$?


    # ## 7.1 Cloud $N_j$ of Groups of Variables


    The raw data associated with a group $j$ of variables makes up table $X_j$. Generally,
    there is no correspondence between the columns of the different $X_i$ and it is
    not possible to compare the $X_i$ tables directly.


    The idea of comparing two groups of variables by their partial cloud (see Chapter
