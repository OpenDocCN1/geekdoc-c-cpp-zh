  md: '# 10.3 Weighting the Variables


    In MFA, taking into account partitioning of the variables first balancing the
    role of the groups in an overall analysis. This idea is transposed in the case
    of a hierarchy of the variables: for each node, taking this hierarchy into account
    means the role of the variables which descend directly from that node.


    Therefore, in the Orange Juice data, the chemical and sensory groups first need
    to be balanced. This balance must be conducted in the sense of MFA, that is to
    say, by fixing the maximal inertia at 1. Firstly, we endow these variables with
    their weights in the MFA of these two groups (that is to say, the inverse of the
    first eigenvalue of the analysis of $n$) $\lambda_i^2$ is the first eigenvalue
    of a sensory variable (belonging to node 2-2; see Figure 10.1)1/\lambda_2^2 =
    1/4.737 = .2108$, and for a chemical variable (belonging to node 2-1), $1/\lambda_1^2
    = 1/6.2125 = .1610.


    In addition, the groups'' characterisation and hedonic assessments need to be
    balanced. In order to do this, the hedonic assessments (node 1) will be weighted
    by $1/\lambda_1^2 = 1/34.0281 = .02939$, and the characterisation variables will
    be overweighted by the inverse of the first eigenvalue of their MFA, $1/\lambda_i^2
    = 1/1.7852 = .5602$. They are said to be overweighted as these variables are already
    weighted in the MFA associated with the characterisation variables:


    +   - Chemical variables: $(1/\lambda_2^2)(1/\lambda_1^2) = .0902

    - Sensory variables: $(1/\lambda_1^2)(1/\lambda_2^2) = .1181


    Using these weights in the overall analysis:


    +   - The groups'' characterisation and hedonic assessment are balanced in terms
    of the MFA (in the full sense of the word: the maximum inertia of each group is
    fixed at 1)

    - The groups'' chemical and sensory are balanced in terms of the MFA (in a limited
    sense: the maximum inertia are all equal, but are not 1, more precisely $1/\lambda_i^2$).


    More generally, let us consider a variable $k$, with initial weight of $p_k^0$
    (generally $p_k^0=1$) and $\{0, 1, \dots, n, \dots\}$, $N$ (node 0 represents
    the variable considered alone) linking it to the root node.


    Let $\lambda_n^2$ be the first eigenvalue of the factor analysis associated with
    node $n$. In the case of quantitative variables, this analysis is a PCA if $n=1$,
    a MFA if $n=2$ and a HMFA if $n>2$. The weight of variable $k$ in the analysis
    associated with any node $n_0$


    ```

    $p_k^{n_0} = p_k^0 \prod_{n=1}^{n_0} \frac{1}{\lambda_n^2}$

    ```'
