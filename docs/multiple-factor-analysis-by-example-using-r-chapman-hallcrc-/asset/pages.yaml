    # 3.5 Implementation


    The simplest solution is to use a FAMD program such as the FAMD function of the
    FactoMineR package or the AFMD function in UNWIN Plus. Otherwise, an FAMD can
    be performed from a regular PCA program. In order to do this, the quantitative
    variables must be first centered and reduced as we standardised PCA. The qualitative
    variables appear through their indicators in which $y_{ik}$ (= 0 or 1) is divided
    by $\sqrt{p_k}$. Dividing by $\sqrt{p_k}$, rather than $p_k$ as indicated in Section
    3.2, it makes possible to use the metric identity in $\mathbb{R}^K$ (most PCA
    programs do not permit other metric). Moreover, it is not necessary to centre
    the data, as this will be done by PCA programs. PCAs as this directly provide
    the representations of individuals and quantitative variables. To obtain the representation
    of the categories'' centres of gravity, the qualitative variables need to be introduced
    as supplementary.


    # 3.6 Example: Biometry of Six Individuals


    To illustrate FAMD, we use a small and simple dataset. Six individuals are described
    by two uncorrelated quantitative variables (height and weight) and one qualitative
    variable (hair colour, with three categories) connected to the first two. The
    data are brought together in Table 3.1.


    TABLE 3.1

    Biometry Data$^a$


    | Hair Colour | Height | Weight | CR Height | CR Weight |

    |---|---|---|---|---|n| a | Blonde | 1 | 1 | -1.464 | -1.225 |

    | b | Blonde | 2 | 2 | -0.878 | 0.000 |

    | c | Brown | 3 | 3 | -0.293 | 1.225 |

    | d | Brown | 4 | 3 | 0.293 | 1.225 |

    | e | Black | 5 | 2 | 0.878 | 0.000 |

    | f | Black | 6 | 1 | 1.464 | -1.225 |


    | Mean | 3.5 | 2 | 0 | 0 |

    | Standard Deviation | 1.708 | 0.816 | 1 | 1 |


    $a$ CR: centred-reduced.'
