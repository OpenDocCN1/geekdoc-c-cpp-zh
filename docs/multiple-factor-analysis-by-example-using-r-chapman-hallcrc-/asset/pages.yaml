  md: 'Like measurement Lg, RV is worth 0 if, and only if, each variable of one group
    is uncorrelated with every variable of the other group. However, the RV coefficient
    is always less than or equal to 1, a value attained when the clouds of individuals
    associated with each of the groups homothetic (the dimension of the clouds of
    individuals does not interfere in this case). This useful property makes RV the
    traditional measurement of the relationship between two groups of multidimensional
    variables. However, in cases where one of the groups is one-dimensional, Lg is
    more suitable.


    In both measurements, we evaluate the importance of a structure common to two
    groups of variables:


    +   - RV, without paying attention to the dimension of this common structure

    - Lg, taking into account the dimension of this common structure and its inertia
    relative to that of the groups. Lg is in some ways a ''number of common dimensions'',
    ''weighted'' by its inertia.


    The two measurements further complement each other. It is important to remember
    that RV or Lg is chosen according to whether we want to distinguish between the
    case of two one-dimensional homothetic structures and that of two multidimensional
    homothetic structures (in many respects, the second case is more remarkable than
    the first). When working with MFA, we examine both indicators.


    Figure 7.2 gives the values of RV and Lg in a few typical cases explained below.


    +   - Cases 1, 2 and 3. In these three cases, the structures generated by the
    two groups are homothetic: RV is always worth 1. Lg increases with the number
    and the inertia (relative to the first principal component of each group) of the
    common dimensions

    - Cases 4 and 5. In these three cases, the two groups have the first principal
    component, and only this component, in common: Lg is always worth 1; RV decreases
    as the number of ''non-common'' dimensions increases.

    - Cases 1 and 6. Between 1 and 6, the number of common dimensions increases along
    with the number of non-common dimensions: Lg increases and RV decreases

    - Cases 7, 8 and 9. In these three cases, the common dimension of the two groups
    differs from their first principal component, and for each group, is associated
    with a constant inertia relative to that of the first principal component: Lg
    is constant, and here is worth 25; RV decreases as the number and inertia of non-common
    dimensions increase.'
