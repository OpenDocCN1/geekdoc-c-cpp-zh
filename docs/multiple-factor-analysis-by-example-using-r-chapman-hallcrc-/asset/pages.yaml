    of interest. This is illustrated in Figure 10.2, which identifies two sequences
    of partitions from one hierarchy. In our applications, the hierarchies are not
    indexed: as Figure 10.2, graphically introducing indexes to each node makes it
    possible to envisage a specific sequence of partitions.


    These are not merely formal considerations. In practice, that is say, in the function
    which conducts an HMFA in the FactoMiner package, the hierarchy is introduced
    using a sequence of nested partitions. The results concerning the nodes are given
    identifying this sequence. In Figure 10.2, the sequence on the left makes it possible,
    partition P2, to determine the components of node 1 (X1, X2, X3, X4) without identifying
    individuals of node 2 (X5, X6, X7), which is not the case for the sequence on
    the right. This aspect is particularly important in the graphs representing partial
    individuals, which quickly become overcrowded (see below).


    We show that, in the calculation procedure as well as that used to determine the
    hierarchy, we proceed from the bottom upwards, from the most to the least detailed
    partition. When analysing we proceed in the opposite sequence, from top to bottom.
    It is therefore useful to number the partitions from the top down (see Figure
    10.2).


    When interpreting the analysis, we constantly refer back to the groups of variables
    defined in the tree, that is to say, the nodes of the tree. It is important to
    label. There are two ways of labelling the data, bearing in mind that the root
    node, which includes all of the variables, does not need to be labelled.


    One system (see Figure 10.2, right) is based on the partitions. A node receives
    a label concatenating the rank of the partition which defines it, followed by
    an (arbitrary) ordinal number in the partition. Therefore, in this system, 2-1
    is the first node of the partition at level 2.


    Another system (see Figure 10.2, left, and Figure 10.1) expresses the path between
    the root node and any given node (in much the same way as the sections of a book
    might be numbered, like in this). Therefore, in this system, 2-1 is the first
    node (directly) dependent on node 2 (which itself is directly attached to the
    root node).'
