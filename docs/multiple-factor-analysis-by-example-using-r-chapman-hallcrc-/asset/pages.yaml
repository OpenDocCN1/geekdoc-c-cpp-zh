  md: "# Factorial Analysis of Mixed Data\n\nattributed a weight $p_k$ (strictly speaking\n\
    \nSpecifically, by proceeding in this way, we obtain a fundamental property of\
    \ MCA: the projected inertia of $N_k$ on a central variable $y$ is equal to the\
    \ squared correlation ratio $\\eta^2(q, y)$ between $q$ and $y$.\n\nWhen looking\
    \ for direction $v$ of $\\mathbb{R}^l$ which maximises the projected inertia of\
    \ $N_k$ (made up of the quantitative variables and the indicators), we maximise\
    \ the criterion:\n\n```\n\\sum_{k\\in K_1} r^2(k, v) + \\sum_{q\\in Q} \\eta^2(q,\
    \ v).\n```\n\nThis is the starting point of the method put forward by Gilbert\
    \ Gilporta in 1990. Geometrically, as variables $k$ on $v$ is their cost $\theta_{kv}\
    \ = r(k, v)$ where $\theta_{kv}$ is the angle between vectors $k$ and $v$. Similarly,\
    \ as $v$ is centered, $\\eta^2(q, v) = \\cos^2(\theta_{qv})$ where $\theta_{qv}$\
    \ is the angle between $v$ and $E_q$. The criterion is thus expressed:\n\n```\n\
    \\sum_{k\\in K_1} \\cos^2\\theta_{kv} + \\sum_{q\\in Q} \\cos^2\\theta_{qv}.\n\
    ```\n\nThis is the starting point of the method put forward by Brigitte Coiffer\
    \ in 1979.\n\n+   - The influence of a variable must be explained according to\
    \ the dimension of the subspace it generates. Thus, in space $\\mathbb{R}^l$:n-\
    \ A quantitative variable is represented by a vector associated with an inertia\
    \ of 1.\n- A qualitative variable with $K_q$ categories is represented by $K_q$\
    \ vectors generating a subspace $E_q$ of dimension $K_q - 1$, all of which are\
    \ associated with an inertia of $K_q - 1$.\n\nAs in MCA the total inertia of a\
    \ qualitative variable increases the more categories are there. However, when\
    \ projected on whichever dimension of $E_q$, this inertia is worth 1. In this\
    \ way, when searching for directions of maximum inertia, these two types of variables\
    \ are balanced, which is highlighted by one or another of the two expressions\
    \ of the criterion below.\n\n# 3.3 Representing Individuals\n\nThe dimensions\
    \ of space $\\mathbb{R}^K$ are quantitative variables $K_1$ and indicators $K_2$.\
    \ Its diagonal Euclidean metric is the column weights (1 for the quantitative\
    \ variables and $p_k$ for the categories)."
