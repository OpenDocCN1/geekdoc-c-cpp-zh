  md: '# MFA and Procrustes Analysis


    Let $X_1$ and $X_2$ be the tables containing the initial data which are generally
    centred and reduced; we aim to transform $X_2$ to fit $X_1$.


    Let $V_{12} = X_1''X_2$ be the matrix containing (up to $I$ coefficient) the coefficients
    between the variables of group 1 (rows) and those of group 2 (columns), when the
    data are centred and reduced. $V_{12}$ contains the covariances if the data are
    only centred.


    Let $U$ be an (orthogonal) matrix of standardised eigenvectors of $V_{12}$ and
    $V$ an (orthogonal) matrix of standardised eigenvectors of $V_{12}''V_{12}$. It
    can be shown that the fit of $X_2$ (to table $X_1$) is given


    $Y_2 = X_3UV''$,


    The dissymmetry of the solution is only apparent: from the point of view the relative
    position of the points, there is no difference between fitting $X_1$ to $X_2$
    or $X_2$ to $X_1$.


    **Remark**

    The axes of the principal component analysis (PCA) only depend on the relations
    between variables; those of the Procrustes analysis depend only on between-table
    correlations.


    **Second Case:** $J > 2$. This is the case of the GPA. There is no known analytical
    solution. An iterative algorithm, at each step, successively fits each cloud $N_j''$
    to the mean cloud (in the first step, the first cloud acts as a mean cloud). The
    mean cloud itself is recalculated after the rotations of $N_j''$. More specifically,
    the principle of the usual algorithm is described as follows:


    +   1. Initialise the mean cloud $Z$ (by the first configuration).


    +   2. Fit of each cloud $N_j''$ to the mean cloud; update $N_j''$ by the result
    of these fits are conducted successively.


    +   3. Update the mean cloud $Z$ from fitted clouds $N_j''$.


    +   4. Update the fitting criterion for all $N_j''$.


    +   5. Begin step 2 again when the improvement of the criterion is above a fixed
    threshold.


    This algorithm converges, but its convergence to an overall optimum of the criterion
    is uncertain. Many studies have tried to improve this algorithm.


    **Depending on the Number of Dimensions**


    **First Case:** $K_c = 2$ or 3. The solution can be examined directly and overall
    by a graphical representation.


    **Second Case:** $K_c > 3$. The solution can only be examined via a projection
    on subspaces. In the usual variant, at the end of the PA (or the GPA), $N_j''$
    are'
