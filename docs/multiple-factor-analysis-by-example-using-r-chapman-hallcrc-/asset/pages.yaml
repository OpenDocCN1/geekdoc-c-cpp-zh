  md: '# 10


    # # Hierarchical Multiple Factor Analysis


    Hierarchical multiple factor analysis (HMFA) is the most direct extension of multiple
    factor analysis (MFA): it is used with tables in which the variables are structured
    according to a hierarchy. In practice, this means a sequence of nested partitions.
    At first sight, one might be tempted to think that this is merely a curiosity,
    but HMFA has considerable application potential due to the increasingly complex
    nature of the data users wish to analyse simultaneously.


    #  10.1 Data, Examples


    We often want to analyse individuals × variables tables in which the structure
    of the variables is more complex than a simple partition. To illustrate this point,
    let us look back at the orange juices.


    In fact, in these data, in addition to the chemical and sensory measurements,
    we also have evaluation scores (known as hedonic assessments in the field of sensory
    analysis) for each of the six juices, attributed by 96 consumers. We want this
    data to indicate which of these juices consumers preferred. Using the terminology
    utilized in the presentation of principal component analysis (PCA), we refer to
    the hedonic profile of a product as all of the assessment scores it obtained.
    This table should make it possible to identify juices with similar hedonic profiles
    (when someone likes one juice, likes the other) or opposite profiles (when someone
    likes one juice, does not like the other). These scores can be presented in a
    table with the six juices and the consumers in the columns, with, at the intersection
    of row $i$ and column $k$, the score given by consumer $k$ for product $i$. Presented
    in this way, that is to say, with the products associated with rows of a table,
    these can be juxtaposed with the chemical (8 variables) and sensory (7 variables)
    data. In the end, we obtain a table with $8 + 7 + 96 = 111$ columns.


    We might consider conducting an MFA of this value, with the three groups of variables
    introduced as active but this methodology would make the three groups play the
    same role, which would not meet the users'' needs. Users primarily want to link
    the hedonic assessments to the characteristics of the products, these characteristics
    being chemical measurements or sensory descriptors. This perspective suggests
    the hierarchical structure on the data'
