  md: '(see Sections 6.2 and 6.3) on the condition that the relationship between a
    variable $z$ and a group of variables $K_j = \{v_k; k = 1, k_j\}$ is measured
    by the $L_g$ measurement, the projected inertia of the variables of group $K_j$
    along $z$. Thus


    $L_g(z, K_j) = \sum_{k \in K_j} \text{inertia of the projection of } v_k \text{
    on } z.$


    When the group of variables $j$ is made up of indicators of only one qualitative
    variable $V$, this measurement allows and it can be shown that it is worth ($z$
    is centred):


    $L_g(z, K_j) = \eta^2(V)$


    in which $\eta^2(z, V)$ is the squared correlation ratio between $z$ and variable
    $V$. If group $j$ includes $Q_j$ qualitative variables $V_q$, this measurement
    becomes:


    $L_g(z, K_j) = \frac{1}{\lambda_j^2} \sum_{q \in Q_j} \eta^2(z, V_q)$


    This measurement is proportional to the mean of the squared correlation ratios
    between variable $z$ and the variables which make up group $j$. It is divided
    by its maximum value accounting for the data from group $j$, which is the first
    eigenvalue of the MCA of this group. Indeed, in MCA, the eigenvalue of rank $s$
    is equal to the mean of the squared correlation ratios between factor $F_s$ and
    the $Q$ qualitative variables. Finally, the $L_g$ measurement is 0 if the variable
    $z$ has a zero correlation ratio with each variable of group $j$; it is 1 if it
    coincides with the principal direction of inertia of group $j$.


    These comments are the same as those made regarding quantitative variables. They
    show that $L_g$ is well suited to serve as a relationship measurement in a multicanonical
    analysis of qualitative variables and MFA can therefore be considered as such
    an analysis.


    # Remark


    In the last relationship, $L_g(z, K_j)$ satisfies the following property: if each
    variable of group $j$ is duplicated, the MCA of this group, and particularly $\lambda_j^2$,
    remains unchanged; the $1/Q_j$ coefficient induces the same value of $L_g(z, K_j)$
    in both cases.


    # Looking for General Variables


    In space $\mathbb{R}^i$ endowed with the metric $D$ (containing the weights of
    the individuals), the general variable of rank $s$ (denoted $z_s$) of this multicanonical
    analysis maximises:


    $$\sum_j L_g(z_s, K_j) = \sum_j \frac{1}{\lambda_j^2} \sum_{q \in Q_j} \eta^2(z_s,
    V_q)$


    with the usual norm and orthogonality constraints:

    $|z_s||_D=1 \quad \langle z_s, z_t\rangle_D = 0 \quad \text{if } s \neq t$.'
