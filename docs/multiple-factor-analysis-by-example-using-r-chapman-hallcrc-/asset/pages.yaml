  md: '# Factors Common to Different Groups of Variables


    Of course this is not the case when there is a large amount of data, which is
    why we need a specific statistical method.


    In this orange juice it was possible to identify a common factor thanks to the
    PCA results (see Section 1.10). Therefore, PCA ''the'' method for identifying
    common factors? No, it is not, as it is subject to an imbalance between the two
    groups. Moreover, in the PCA in Chapter 1, only the chemical variables are active.
    In this analysis, we first look for the principal dimensions of chemical variability,
    and only then do we connect these dimensions to the sensory variables.


    # 6.1.4 Canonical Analysis


    In order to analyse the relationships between two groups of variables, Hotelling
    introduces the notion of canonical variables. It simultaneously looks for:


    +   - A linear combination (denoted $u$) of the variables from group 1

    - A linear combination (denoted $v$) of the variables from group 2


    such as the correlation coefficient between $u$ and $v$ $(r(u, v))$ is maximised.
    $u$ and $v$ are said to be canonical variables, $r(u, v)$ is known as canonical
    correlation coefficient and the approach as a whole is known as canonical analysis.


    Canonical analysis is a method which plays an important theoretical role, essentially
    because of the other statistical methods which can be seen as specific cases (multiple
    regression, for example, if one of the groups is reduced to a single variable),
    but it is practically never used to process data. We believe this is because the
    perspective of looking for a pair of canonical variables, in each group, does
    not naturally coincide with the users'' questions. The orange juice example highlighted
    the benefits of another approach: common factor.


    The idea of looking for a function linked as closely as possible to a set of groups
    of variables was first introduced by J. D. Carroll in 1968, as a generalisation
    of (Hotelling''s) canonical analysis. As many generalisations of canonical analysis
    were put forward, it is important to specify Carroll''s generalised canonical
    analysis (GCA; it is also known as Carroll''s multicanonical analysis). Due to
    its age and partly to its focus on searching for common factors, we can consider
    this analysis as a benchmark method for this issue. Of course this does not mean
    other methods cannot be put forward, but they need to be compared to this (as
    we do).


    It must nonetheless be noted that in his presentation, Carroll uses that which
    we have referred to as common factors as intermediaries for calculations in order
    to obtain canonical variables (from a common factor, he deduces one canonical
    variable per group). The above presentation of Carroll''s multivariable analysis
    is therefore our point of view about this method.'
