  md: '# Multiple Factor Analysis by Example Using R


    ![](img/6b887cdbc8ce8df1d48c89228f9b63a5_208_0.png)


    **FIGURE 9.1**\Four individuals (A, B, C, D) described by two groups, each composed
    of one variable ({V1}, {V2}). Representations of clouds $N_i$ and $N_j$ in space
    $\mathbb{R}^K$ of the MFA (left) and on the unique axis of the Procrustes analysis
    (right).


    # **In MFA**


    +   * The number of common factors is not specified.

    * The common factors can be common to all or some of the groups.

    * The aim of the analysis is to highlight them.


    # **In GPA**


    +   * We assume that there is an homology between the spaces in $N_i^j$ initially
    evolve. In practice, we identify homologous bases of these spaces. Finally, in
    terms of canonical analysis, this assuming that there are $K_c$ factors common
    to all of the $J$ groups.

    * The aim of the analysis is to identify these common factors.


    # **Criterion**


    In both methods, the criterion can be expressed in the superposed representation.
    We consider the partition of $N^j$ into $I$ classes, containing the partial points
    associated with one given individual ($i^j; j = 1, J$). The within-class inertia
    of $N_i^j$ relative to this partition is written:


    ```

    $$\sum_{i}\sum_{j} d^2(i^j, i) = \frac{1}{2J}\sum_{i}\sum_{j} d^2(i^j, i^j)''.$$

    ```


    In PA and GPA, the same result can be achieved by maximising the associated between-class
    inertia which is none other than the inertia of $N_l$. For GPA, at each step we
    are looking for the rotation of each cloud $N_l^j$ which satisfies this criterion
    (thus calculated for all dimensions).'
