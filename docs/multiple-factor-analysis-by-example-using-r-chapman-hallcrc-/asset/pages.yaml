  md: '# Multiple Factor Analysis and Procrustes Analysis


    Originally, the question that motivated Procrustes analysis (PA) was, ''How can
    one of two homologous clouds of points situated within the same space be turned
    to make them coincide as closely as possible?'' Today, generalised Procrustes
    analysis (GPA) is applied to sets of more than two clouds.


    Chapter 5 describes the solution proposed by multiple factor analysis (MFA) to
    obtain a superimposed representation of homogenous clouds of points ($N_I$). The
    two approaches must be compared.


    As GPA is not well known outside the field of sensory analysis, we start by presenting
    some basic elements of this method.


    # 9.1 Procrustes Analysis


    # 9.1.1 Data, Notations


    There are $J$ clouds (denoted $N_I$) of $I$ homologous points ($i^j$). These clouds
    evolve within spaces of the same number of dimensions $K_c$ (but these dimensions
    do not correspond from one space to the other). The coordinates of the points
    of $N_I$ are brought together in matrix $X_j$ of dimensions $(I, K_j)$. The coordinates
    of $X_j$ are centred.


    Initially $N_I$ evolve within spaces of different dimensions ($K_j$), we choose
    $K_c = \max \{K_j, j = 1\}$; when $K_j < K_c$, we consider that $N_I$ has zero
    inertia in $K_c - K_j$ directions, which it obtained by adding columns of 0 to
    the initial matrix $X_j$.


    In Procrustes analysis, the individuals are always attributed a weight of 1. That
    being said, the presence of different weights from one individual to the other
    is not contrary to Procrustes analysis: we might want the superposition to be
    a particularly good fit for certain individuals. Reminder: in MFA it is possible
    to attribute weights to individuals, a possibility which is offered by FactMineR.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# 9.1.2 Objectives


    Clouds $N_j^I$ are positioned in one space $\mathbb{R}^K$. Each cloud is centred
    and no translation is required. We transform $N_j^I$ so as to make the homologous
    points coincide as much as possible. In the most common (and original) version,
    only orthogonal transformations are authorised (that is to say, the rotations
    and symmetries) as they do not modify the distances between the points of a single
    cloud. Homotheties can also be authorised, but their application disadvantage
    cannot be seen when $N_j^I$ have been standardised. Thus, unless explicitly stated
    to the contrary, they are not considered.


    Following transformations, cloud $N_j^I$ have new coordinates that are brought
    together in matrix $Y_j$. Saying that $N_j$ coincide (with one another) as well
    as possible is the same as saying $Y_j$ are as close together as possible. The
    sum of square of the term-by-term differences between matrices $Y_j$ and $Y_i$
    is written:


    ```

    trace $\[(Y_j - Y_i)''(Y_j - Y_i)]$.

    ```


    The quantity Procrustes analysis minimises is thus written:


    ```

    $\sum_{j>i} \text{trace }(Y_j - Y_i)''(Y_j - Y_i)$.

    ```


    $Y_i$ is deduced from $X_i$ by isometry (a transformation which preserves the
    distances); $Y_j$ can be written $Y_j = X_iT_j$ with $T_j$ as an orthogonal matrix,
    that is to say, verifying $T_j''T_j = I_d$ (denoting the identity matrix of the
    appropriate size). The Procrustes model can therefore be expressed:


    ```

    $q_jX_iT_j = Z + E_j$.

    ```


    $Z$, matrix of size $(I, K_i)$, contains the coordinates of the so-mean configuration
    (in reference to the way it is calculated), $E_j$, a matrix of residuals and $q_j$
    a scalar in the model when the homotheties are authorised.


    Mean Cloud. When $N_j^I$ are placed in the same space, we can construct a mean
    cloud $N_l$ for which each point $i$ is the barycentre of its homologous points
    in $N_j$. Up to a certain point, this cloud is analogous with mean cloud $N_l$
    of the MFA. To make it easier to compare the two methods, we call $N_l$ the mean
    cloud, whatever the analysis (even though the two clouds are not constructed in
    the same way).


    # 9.1.3 Methods and Variations


    # Depending on the Number of Clouds


    First Case: $j = 2$. This is the original method. It includes an analytical solution
    which we look at briefly.'
