  md: '# 8.2.3 Representing Partial Individuals


    The notion of partial individuals, that is to say, an individual considered from
    the point of view of a group only, is important in MFA. We have already denoted
    $i^j$, individual $i$ \as ‘as seen’ by group $j$. The geometric principle of representation
    of these partial individuals is identical for quantitative and qualitative variables:
    space $\mathbb{R}^k$, partial individual $i^j$, derived from $i$ by replacing
    its values for the (centred) variables by 0 for groups other than $j$, is projected
    on the axes of inertia of $N_j$.


    The representation of partial individuals benefits from importance property: a
    transition relation. This is inferred from the usual relationship the coordinate
    of an individual according to that of the categories, limited to one single group
    of variables. These two relationships (partial and usual) are presented for qualitative
    variables.


    In MFA on qualitative variables, the representation of $N_i$ verifies the properties
    of weighted MCA (see Section 8.1.2). An individual is (up to a coefficient) at
    the barycentre of the categories that it possesses (each attributed the weight
    of the variable to which it belongs).


    ```

    $F_s(i) = \frac{1}{\lambda_s} \frac{1}{Q_j} \sum_{k \in K_j} y_{ik} F_s(g_k)$

    ```


    The representation of partial individual $i^j$ verifies the previous transition
    relation by restricting the sum to variables of group $j$ (partial transition
    relation). Thus


    ```

    $F_s(i^j) = \frac{1}{\lambda_s} \frac{1}{Q_j} \sum_{k \in K_j} y_{ik} F_s(g_k)$

    ```


    Up to a coefficient, $i^j$ is at the barycentre of the categories (of group $j$)
    that it possesses. This relation can be used to compare directly the positions
    of points of the same cloud $N_i^j$ (for example, $i^j$ and $l''$). However, comparisons
    between points from different clusters (such as $i^j$ and $i^h$) are indirect:
    the relative positions of these points in their respective clouds ($N_i^j$ and
    $N_i^h$) can be compared, which really seems useful if the factors (of MFA) being
    examined common to groups $j$ and $h$.


    # Remark


    In MFA, each cloud $N_i^j$ is dilated according to a homothetic ratio $j$ in order
    to situate individual $i$ at the centre of gravity of its partial points $\{i^j
    : j = 1, J\}$. The previous formula becomes:


    ```

    $F_s(i^j) = \frac{1}{\lambda_s} \frac{1}{Q_j} \sum_{k \in K_j} y_{ik} F_s(g_k)$

    ```'
