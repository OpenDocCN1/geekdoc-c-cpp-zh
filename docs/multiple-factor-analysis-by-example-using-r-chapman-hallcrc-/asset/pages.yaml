  md: '# #3 Factorial Analysis of Mixed Data


    The need to introduce simultaneously quantitative and qualitative variables (known
    as mixed data) as active elements of one factorial analysis into common. The usual
    methodology is to transform the quantitative variables into qualitative variables,
    breaking down their variation interval into classes, and submitting the resulting
    homogeneous table to a multiple correspondence analysis (MCA). This methodology
    is relatively easy to implement and is used whenever there are enough individuals;
    generally more than 100), a limit below which MCA results are not stable.


    In two cases, there are advantages to conserving the quantitative variables:


    +   1. When the number of qualitative variables is very low compared to quantitative
    variables: thus, we might think twice about reconsidering20 quantitative variables
    with the sole aim of introducing one single qualitative variable

    2. When there are a small number of individuals


    The method we present here from two different origins. In 1979, Brigitte Escofier
    suggested introducing qualitative variables in MCA (thanks to appropriate coding).
    In 1990, Gilbert Saporta suggested introducing qualitative variables in principal
    component analysis (PCA) thanks to a specific metric. In reality, these two approaches
    yield the same results. The resulting factor analysis presents a sufficient number
    of positive properties and application potential to justify the status of a separate
    method: factorial analysis of mixed data (FAMD).


    # ## 3 Data, Notations


    We have $l$ individuals. Each individual $i$ is attributed a weight $p_i$ such
    as $\sum p_i = 1$. To simplify matters, except when explicitly stated, we suppose
    the individuals are of the same weight, thus $p_i = 1/l$ $Vi$. These individuals
    are described by:


    +   - $K_1$ quantitative variables $\{k = 1, K_1\}$; these variables are standardised
    (centred and reduced); this is not merely for convenience but is necessary due
    to the presence of two types of variables.'
