    # Reconstitution of $N_l^j$


    The coordinates of the projection of $N_l^j$ on $u_s$ are brought together in
    $F_l^j; F_s^j$ is related to $v_s$ (see Section 5.2):


    ```

    $F_l^j = \frac{1}{\sqrt{\lambda_s}} \bar{X}_j MG_s = \frac{1}{\sqrt{\lambda_s}}
    \bar{X}_j MX'' v_s = \frac{1}{\sqrt{\lambda_s}} W_j v_s.$

    ```


    Let $\{\sqrt{\lambda_s} F_s^j; s = 1, S\}$ be the set of projection coordinates
    of cloud $N_l^j$ (multiplied by $\sqrt{\lambda_s}$). The PCA of the matrix $(I,
    S)$ is the same as that of table $W_j Z (I, I)$. This leads to the diagonalisation
    of the matrix


    ```

    $W_j ZZ''W_j = W_j W_j,$

    ```


    whose eigenvectors are the same as $W_j$ and the eigenvalues squares of those
    $W_j$.


    Thus, the PCA of $\{\sqrt{\lambda_s} F_s^j; s = 1, K\}$ results the same factors
    as those of $X_j$, the eigenvalues of this PCA being the squares of $X_j$. From
    this perspective, all of $F_l^j$ enables us to reconstruct $X_j$. This reconstruction
    is not generally perfect, even if $N_l^j$ is fully represented in the MFA, as
    for this reconstruction:


    +   * $F_s^j$ have already been multiplied by $\sqrt{\lambda_s}$ (distortion 1).

    * The eigenvalues of the resulting reconstruction are the squares of those of
    exact reconstruction (distortion 2).


    # Numerical Example


    In the Trapeze dataset, the initial variables corresponds to the axes of the MFA.
    The distortion of $N_l^j$ can therefore be illustrated by comparing the variance
    of an initial variable group $j$ (denoted $v^j$) and the corresponding variance
    of factor $F_l^j$. Using the results shown above, we obtain:


    ```

    $Var [\frac{1}{\sqrt{\lambda_s}} F_l^j] = \frac{\lambda_s^2}{\lambda_s} Var [F_l^j]
    = (Var [v^j])^2.$

    ```


    Here, $F_l^j$ is the vector of the coordinates provided by the programs (after
    the homothety of ratio J (see Section 5.2)) hence the division by J. The variance
    of $v^j$ must be considered after the MFA weighting thus, by replacing the symbols
    in the second equality above by their value of group 1 and axis 2:


    ```

    $\frac{0.5}{2^2} = 0.08 = (\frac{2.5}{25})^2.$

    ```'
