  md: '# Qualitative and Mixed Data


    To make the maximum inertia of the cloud associated with group equal to 1, we
    divide the weight of each category of group j by $\lambda_j^1$ (first eigenvalue
    of the MCA of group j). After this harmonisation, the distance between $i^1$ and
    $l^1$ is expressed (see Section 2.4):


    ```

    $d^2(i^1, l^1) = \frac{1}{Q_j\lambda_j^1} \sum_{k_J \in J_j} p_k \left( \frac{y_{ik}}{p_k}
    - \frac{y_{lk}}{p_k} \right)^2$

    ```


    When considering all the groups of variables, these distances generate the following
    distance between points i and of $N_i$:


    ```

    $d^2(i, l) = \sum_j d^2(i'', l'') = \sum_j \frac{1}{Q_j\lambda_j^1} \sum_{k_J
    \in J_j} p_k \left( \frac{y_{ik}}{p_k} - \frac{y_{lk}}{p_k} \right)^2\n= \sum_j
    \sum_{k_J} \frac{1}{Q_j\lambda_j^1} p_k \left( \frac{y_{ik}}{p_k} - \frac{y_{lk}}{p_k}
    \right)^2$

    ```


    This relationship shows that the MFA of a set of qualitative variables organized
    into groups must be based on a weighted MCA in which the weighting of the variables
    of group j is $1/(Q_j\lambda_j^1)$.


    The weight $1/(Q_j\lambda_j^1)$ of variable $q$ for group j results from two steps:


    +   1. Consider that variable $q$ belongs to group j in which case the weighting
    is $1/Q_j$ in the MCA for this group.


    +   2. Fix the maximum axial inertia of the MCA for group j at 1 by dividing the
    weights of the preceding variables by $\lambda_j^1$ (first eigenvalue of this
    MCA).


    Weighted MFA provides the representations of individuals and categories in accordance
    with the issue: the role of the different groups is balanced. The discussion of
    the conditions of this balance – harmonising the maximum axial inertias, rather
    than the total inertias, for example – can be approached from the same perspective
    as for that of the quantitative variables.


    # Remark


    When each group is made up of only one variable, $\forall j Q_j = 1$ and $\lambda_j^1
    = 1$, MFA is then equal to MCA.


    In MFA, the sum of the weights of the variables is not set at 1. This is due to
    the fact that each group has imposed an maximum axial inertia of 1.


    # 8.2.2 From the Perspective of Multicanonical Analysis


    # Lg Measurement for Qualitative Variables


    For quantitative variables (see Section 6.2), it has been mentioned that MFA can
    be considered a multicanonical analysis as described by Carroll'
