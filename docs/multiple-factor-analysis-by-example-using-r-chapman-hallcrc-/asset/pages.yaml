    # 8.2 MFA of Qualitative Variables


    Within the CDT (its general term is denoted $y_{ik}$), the indicators are now
    brought together in groups which include several variables. The indicators of
    a given variable always belong to one group: no distinction is made between a
    group of indicators and a group of variables. As in all MFA, we use the letter
    $j$ for the group (group) and $J$ the number of groups); the letter $q$ is used
    for qualitative variables (variable $q$ and $Q$ the number of variables). In summary:


    +   - $K$: Number of categories of group $j$; $K$: total number of categories
    $(K = \sum K_j)$

    - $Q_j$: Number of variables of group $j$; $Q$: total number of variables $(Q
    = \sum Q_j)$


    # 8.2.1 From the Perspective of Factorial Analysis


    # Principle of Weighting Groups of Variables


    The issue which arises from accounting for groups in a set of variables is whether
    the those versus are quantitative or qualitative: firstly the need of balancing
    the influence of the groups in an overall analysis, bearing in mind that a group
    with numerous dimensions will influence more axes than another with only few dimensions
    (or even one single dimension). The solution chosen by MFA (to harmonise the maximum
    axial inertia of the clouds associated with the different groups), previously
    presented within the context of quantitative variables, is not specific to these
    variables and applies to qualitative variables.


    # MFA of Qualitative Variables Is Based on a Weighted MCA


    As MCA is the usual analysis of a set of qualitative variables, it is natural
    to base the MFA if groups of qualitative variables on a weighted MCA. In this
    weighted MCA, the weighting of variables, induced by the equalisation (at a value
    of 1) of the maximum axial inertia of the subclouds, stems from this following
    reasoning.


    In group $j$ prior to weighting (that is to say, in the MCA applied to group $j$),
    the distance between two individuals $i$ and $l$ is expressed:


    ```

    $d^2(i'', l'') = \frac{1}{Q_j^2} \sum_{k \in K_j} p_k \left( \frac{y_{ik}}{p_k}
    - \frac{y_{lk}}{p_k} \right)^2$,

    ```


    denoting $i''$ the individual $i$ considered from the point of view of the variables
    of group $j$ alone (called partial individ in MFA).


