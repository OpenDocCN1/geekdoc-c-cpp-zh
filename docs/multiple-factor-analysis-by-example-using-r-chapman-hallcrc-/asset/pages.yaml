    # PCA and Synthetic Visualisation


    PCA is mainly used to obtain a synthetic view of a data table; we ‘replace’ the
    initial variables $K$ with two or three synthetic variables (the principal components).
    This point of view is called dimension reduction. However, in this example, it
    is tempting to retain the five axes as all can be easily interpreted. As we start
    with only five variables, there is no dimension reduction and, from this ‘countable’
    perspective, there is no synthesis.


    Nevertheless, even if we retain all five axes, it is more interesting (in our
    opinion) to comment on the PCA than on the initial variables. We let you the reader
    for yourself, but would like to draw your attention to two points. Unlike the
    initial variables, the principal components are:


    +   1. Organised into a hierarchy (descending order of variance)

    2. Uncorrelated with one another


    # 1.8 Supplementary Elements


    An element, be an individual or a variable, is said to be supplementary if it
    does not participate in constructing the axes on which it is represented. In practice,
    factorial analysis is almost always performed with supplementary elements, and
    in particular, supplementary variables. When faced with an available set of variables,
    the decision to consider a given variable as either active or supplementary is
    not always easy and the objectives of the analysis must be precisely specified.
    In real cases, the easiest approach is to reason in terms of individual profiles,
    and to ask oneself which variables participate in creating this profile.


    Let us look at the example of the 909 students. For these students we have access
    to:


    +   - Baccalaureate grades for five subjects

    - Five grades for these five subjects obtained during the school year, here called
    year grades

    - The high school variable, a qualitative variable with 23 categories


    The high school variable, being qualitative, cannot be active. In any case, we
    are studying school profiles and of course the high school is not part of that.
    Nonetheless, we do not believe this variable should be eliminated, as it is interesting
    to link the principal dimensions of variability of the school profiles with the
    high schools (see the following section).'
