    # 9.3.2 Results of the MFA


    Projected Inertias of the Mean Cloud


    The inertias of axis of the MFA are easy to calculate. The first axis corresponds
    to variable X. Its inertia is obtained by adding those of $X_1$ and $X_2$ (after
    weighting by the MFA, that is to say, by dividing each variance by the maximum
    variance of its group). Thus $36/36+36/36 = 2$. Axis 2 corresponds to variable
    Y and has an inertia of $36/36+9/36 = 1.25$. Axis 3 corresponds to Z with an inertia
    of $4/36+36/36 = 10/9$. In this analysis, three dimensions are needed to represent
    the data (data are generated from three orthogonal variables). They are of similar
    importance.


    Relationship Measurements Between Factors and Groups


    Two measures are used and brought together in Table 9.3 in which we find, at the
    cost of group $j$ and factor $s$:


    +   * The (canonical) correlation coefficient between $F_s$ and $F_l^j$


    The canonical correlation coefficients indicate that $F1$ is common to groups
    1 and 2, $F2$ to groups 2 and 3. The $Lg$ measurements specify, for example, that
    $F3$ corresponds to the principal direction of inertia of group 3 and to a direction
    of lesser inertia of group 2. We observe the exact structure used to construct
    the data.


    Inertias of Individuals in the Mean Cloud


    Whatever the axis, the four individuals have the same coordinate (in absolute
    value) and therefore the same contribution to inertia. Here we again see the symmetry
    of individuals which can be clearly seen in the data.'
