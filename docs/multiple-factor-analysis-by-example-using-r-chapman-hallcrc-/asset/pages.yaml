    \ of $u$ and $\\{v_i; i = 1, n\\}$ the coordinates of $v$:\n\n```\n$\\langle u,\
    \ v \\rangle = u_1 v_1 + u_2 v_2 + \\dots = \\sum_{i=1}^n u_i v_i$.\n```"
