    **FIGURE 1.2**

    The cloud of individuals.


    This quantity measures the discrepancy between the profiles of individuals i and
    l. Studying the individuals’ variability means studying these distances, the whole
    set of which determines the shape of cloud $N_l$. This variability can also be
    dealt with the distances between each point $M_l$ and the mean point $G_l$. Therefore,
    for individual $i:


    ```

    $d^2(i, G_l) = \sum_{k} (X_{ik} - \bar{X}_k)^2$.

    ```


    This distance measures the ‘peculiarity’ of the individual $i$ (how it differs
    from others). The set of these peculiarities makes up the overall variability
    of the data. To measure this overall variability, the squares of the distances
    to the mean point are aggregated in order to obtain the total inertia of $N_l$
    (with respect to $G_l$).


    ```

    Total inertia $N_l/G_l = \sum_{i} p_i d^2(i, G_l) = \sum_{i} \sum_{k} p_i(X_{ik}
    - \bar{X}_k)^2 = \sum_{k} Var[k].

    ```


    This total inertia is equal to the sum of the $k$ variances, denoted $Var[k]$.
    Thereby, when the variables are reduced, it is equal to the number of variables.
    This clearly shows, in the centred-reduced case but also in general, that in PCA,
    it is not the total inertia itself which is interesting but rather the way in
    which it is distributed. We also observe this property in MCA and MFA. We obtain
    the same total inertia in aggregating the squares of the between-individuals distances,
    a perspective used at the beginning of this section. The variance of variable
    $k$, based on the deviations between individuals, is thus expressed:


    ```

    $Var[k] = \frac{1}{2} \sum_{i} \sum_{k} p_i p_i(x_{ik} - x_{lk})^2$.

    ```'
