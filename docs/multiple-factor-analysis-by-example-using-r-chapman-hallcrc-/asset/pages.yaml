  md: '# Multiple Factor Analysis by Example Using R


    +   - The effectiveness of FAMD in dealing with the crucial issue of balancing
    the two types of variables

    - The fact that a quantitative variable cannot be closely linked to a single axis
    (as in PCA) whereas a qualitative variable can be closely linked to (number of
    categories – 1) axes (as in MCA)


    Figure 3.2 represents the relative positions of variables and axes in $\mathbb{R}^1$.
    Due to the orthogonality between height and width, the axes are situated on the
    plane generated by the quantitative variable and its projection on the plane.
    This figure clearly illustrates the geometric interpretation of the FAMD in the
    space of functions on $I$ and how the balance is achieved between the two types
    of variable.


    The (absolute) contribution of a variable to the inertia of an axis is also interpreted
    as a measurement of the relationship between the variable and the axis (squared
    correlation, ratio or coefficient according to the nature of the variable). These
    inertias can be represented in the graph known as the relationship square (see
    Figure 3.3, left) which shows that:


    +   - The first factor results from the variables height and colour.

    - The second factor results from the variables weight and colour.

    - In both cases the contributions are balanced between the two variables.

    - In both cases, the factor is closely linked to each of the two variables.


    With this general framework defined, interpreting Figures 3.3 and 3.4 is easy
    in this simple case. The first axis opposes some blondes and tall people with
    black hair. These two groups of individuals are light and oppose the heavy, brown-haired
    individuals on the second axis.


