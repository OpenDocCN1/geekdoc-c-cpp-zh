    nodes; this is not new: the strong correlation between this axis and the first
    component of the analyses of the nodes has already been mentioned.

    - The second axis is more closely related to hedonic assessments as characterisation;
    this is due to the higher dimensionality of the hed assessments (see Table 10.1).
    As characterisation (and particularly its two aspects) has a predominant dimension
    linked to the first axis, it cannot be closely related to the other dimensions
    in terms of L.

    - The relationship with the first axis is stronger for the sensory group than
    for the chemical group. In the MFA on the characterisation data alone (see Figure
    7.3 and Table 4.5), this relationship was at the same level. This is probably
