  md: '# 2.5.2 Cloud of Categories


    Again here, as in PCA, we project cloud $N_K$ onto a sequence of orthogonal axes
    of maximum inertia. However, the properties of cloud $N_K$ vary depending on which
    of the analyses is used. In MCA, the projected inertia of categories $K_j$ of
    a given variable $j$ on a unit vector $v$ is proportional to the squared correlation
    ratio between $j$ and $v$. Therefore, the projected inertia of $N_K$ is worth


    ```

    Projected inertia of $N_K$ on $v = \frac{1}{j} \sum_j \eta^2(j, v).

    ```


    Thus, the factors (on $I$) of the MCA are factors in which are closely linked
    to the initial variables (in terms of the average of the squared correlation ratios).
    This property is highly important for several reasons:


    +   It validates the process as a whole (application of the factorial methodology
    to the CDT).


    +   It draws another parallel between PCA and MCA (in PCA each factor on $I$,
    is to say each principal component, maximises the sum of the squared correlation
    coefficients between itself and the initial variables).


    Expressing eigenvalues as averages of correlation ratios makes their interpretation
    useful independently of the percentage of inertia. The maximum value 1 corresponds
    to a dimension shared by all the subspaces created by the variables. In concrete
    terms, this dimension is associated with a synthetic partition (of individuals)
    in the sense that whatever, two individuals possess the same category, they belong
    to the same class of the synthetic partition. This is only possible if the qualitative
    variables are linked with one another: the characteristics of each variable can
    be merged so that the new $J$ variables thus defined be identical. The eigenvalue
    $\lambda_s$ measures the intensity of the relationships (between the variables)
    expressed by the axis of rank $s$.


