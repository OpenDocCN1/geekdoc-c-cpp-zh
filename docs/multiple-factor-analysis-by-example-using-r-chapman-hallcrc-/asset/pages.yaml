  md: '# Multiple Factor Analysis by Example Using R


    To obtain these two properties, it is necessary, when calculating a distance in
    $\mathbb{R}^I$, to attribute to each dimension $i$ the weight $p_i$ of the corresponding
    individual. Thus, we obtain:


    ```

    $d^2(O, M_k) = \sum_{i} p_i (x_{ik} - \bar{x}_k)^2 = \text{Var}[k].$$

    ```


    This way of calculating the distance (also known as the metric) in $\mathbb{R}^I$
    is therefore linked to the weights of the individuals. We say that the weights
    on the individuals induce a metric in the space of functions on $I$. To get a
    feel for this, we consider the equivalence between two rigorously identical individuals
    of the same weight $p$ on the one hand, and only one of these individuals with
    weight $2p$.


    Usually the weights $p_i$ are organised on the diagonal of a matrix denoted $D$
    of size $(I, I)$, with the diagonal terms being null. Matrix $D$ is diagonal,
    which explains the origin of the term *diagonal metric*.


    The metric defined in this way is Euclidean (that is, it is associated with a
    scalar product). By denoting $(u, v)_D$ the scalar product in $\mathbb{R}^I$ between
    vectors $v$ and $w$ (the letter $D$ for use of weights $p_i$), we obtain:


    ```

    $\overline{(OM_k, OM_j)_D} = \sum_{i} p_i(x_{ik} - \bar{x}_k)(x_{ij} - \bar{x}_j)
    = \text{Covariance}[k, j].$$

    ```


    This clearly shows that it is the centring which makes it possible to interpret
    this scalar product as a covariance. If, in addition, the variables are reduced,
    this scalar product is equal to the cosine of the angle $\theta_{kj}$ between
    $OM_k$ and $OM_j$ and is interpreted as the correlation coefficient.


    The above relationships are expressed as follows, denoting $v''$ the transpose
    vector of $v$ and $v$ the $k$-th column of $X$:


    ```

    $d^2(O, M_k) = ||v_k||^2_D = v''_k D v_k.$

    ```


    The total inertia of cloud $N_K$ in $\mathbb{R}^I$, with respect to the origin
    $O$, is easy to calculate as the variables have an equal weight of 1.


    ```

    $$\text{Inertia}(N_K/O) = \sum_{k} 1 \ d^2(O, M_k) = \text{Var}[k].$$

    ```


    This total inertia is equal to those of cloud $N_K$ in $\mathbb{R}^K$: the number
    $K$ of variables contributes to the centre-reduced case. This highly important
    property concerns the duality between the table'' rows and columns. Analysing
    the diversity of the individuals'' profiles (cloud $N_i$) or the correlations
    between variables (cloud $N_K$) examining clouds with the same inertia, a property
    induced by the fact that the points of one are the same as the dimensions of the
    space within which the other evolves.'
