  md: '# Multiple Factor Analysis by Example Using R


    A series of indicators can be obtained by decomposing the inertia of the cloud
    bringing together all of the partial points.


    We denote $N_j^I$ the cloud of all partial points (for all individuals and all
    groups) $(i^j; i=1, I; j=1, J)$. Thus: $N_j^I = \sum_i N_i^j$.


    We can consider partitioning $N_j^I$ into $I$ classes where the same class is
    attributed the $J$ partial points associated with a given individual. We denote
    $N_i$ the cloud of partial points associated with individual i. Thus: $N_i = \sum_j
    N_{ij}$$.


    For each axis (of rank $s$), we apply Huygens’ theorem to this second partition,
    decomposing total inertia (with respect to the origin O) into between-class and
    within-class inertia. The class points make up $N_j$. The within-class inertia
    is that of $N_j$ relative to their center of gravity. (to simplify the equations
    we do not mention the rank $s$ of the axis):


    ```

    Inertia[N_j^I /O] = Inertia[N_l/O] + \sum_i Inertia[N_i^j /i].

    ```


    The within-class inertia of $N_j^I$ measures the heterogeneity, $u_s$, of the
    partial points associated with individual $i$. By dividing by the within-class
    inertia $N_i$, we obtain the (relative) contribution of individual $i$ to this
    within-class inertia (for axis $s$). By ranking these contributions in ascending
    order (for each axis), we obtain:


    +   - At the beginning, the individuals whose partial points are heterogeneous
    for the axis in question. These individuals successfully represent the similarities
    between $N_j^I$, particularly if they are far from the origin. We select some
    of these to illustrate the interpretation.


    +   - At the end, the individuals whose partial points are heterogeneous for the
    axis in question. They highlight differences between $N_j^I$ which is an aspect
    of the variability of the data.


    When there are a lot of individuals, the ranked lists (by axis) are essential
    in order to be able to select which individuals first. Table 5.1 brings the contributions
    to the within-class inertia of the six juices. In this very small dataset, the
    table is not useful for interpretation (visual analysis is sufficient) and is
    given for information only. We can see:


    +   - For the first axis, the heterogeneity of juices 2, 4 and 5; the homogeneity
    of juice 3; and the greater heterogeneity of juice 4 compared to juice 1 (described)


    +   - For the second axis, the extreme heterogeneity of juice 4


    When there are more than two axis groups, it could be interesting to decompose
    this within-individual inertia by group of variables. We thus obtain the contributions
    of the partial individuals to the within inertia. This'
