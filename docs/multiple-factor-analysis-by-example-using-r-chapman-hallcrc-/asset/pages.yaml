    due to the weighting of the MFA (this property is almost always observed in practice).

    The second axis corresponds to a direction of high inertia for group 1 and lower
    for group 2. This was also expected due to the first two eigenvalues of the separate
    analyses. The third axis is specific to group 1. This is coherent with the data
    construction method used.

    We here illustrate the major difficulty inherent to the simultaneous analysis
    of quantitative and qualitative variables: weighting of the MFA standardises the
    maximum axial inertia of each group. However, due to the decrease of the inertias
    which is generally lower in MCA than in PCA, the qualitative groups should be
    more influential, in terms of contribution to inertia, from the second axis. This
    difficulty may nonetheless be put into perspective as shown in the following section.


    # 8.4.3 Coordinates of the Factors of the Separate Analyses


    The first two factors of the MFA (see Figure 8.1) are quite close to the factors
    of the same rank in the separate analyses. They are arguably slightly more correlated
    with the factors of the quantitative group. This is probably a consequence of
    the low decrease in the inertias of the qualitative group, which indirectly favours
    the factors of the quantitative group, in the sense that they mediate between
    directions of the qualitative group with comparable inertias.

    Conclusion: Weighting the MFA worked very well in this example by balancing the
    influences of these two types of variable.'
