  md: '# Multiple Factor Analysis by Example Using R


    ![](img/6b887cdbc8ce8df1d48c89228f9b63a5_118_0.png)


    FIGURE 5.3 $N_i^K$ in $\mathbb{R}^{K_i}$ and in $\mathbb{R}^K$.


    The partial cloud $N_i^K$ in $\mathbb{R}^{K_i}$ with added 0 to be the dimension
    of $X$, that is to be the matrix of the coordinates of $N_i^K$ in $\mathbb{R}^K$
    (variables centred). Figure 5.4 illustrates the relative positions of $N_i$ and
    $N_i^K$ in the borderline case of two groups each containing one variable.


    The complete individual $i$ is the''sum'' of partial individuals $i^j$. In the
    graphs, it is helpful to feature $i$ at the centre of gravity of the $J$ points
    $i^j$. Also, in practice, clouds $N_i^J$ are dilated with the $J$ coefficient
    to generate the graphs. This is why $i$ is known as a mean individual.


    In this space, the representation of the individuals is obtained in (MFA) by a
    weighted factorial analysis of $N_i$. The representation of $N_i^K$ is obtained
    by projecting $(N_i^K)$ on the main axes of $N_i$. This procedure has several
    important properties for the user.


    # Property 1


    This representation is obtained by projection, a common approach for users of
    factorial analysis. The geometric interpretation is clear and poses no algorithmic
    problems.


    ![](img/6b887cdbc8ce8df1d48c89228f9b63a5_118_1.png)


    FIGURE 5.4 Complete (i) and partial ($i^1$ and $i^2$) representations of the same
    individual $i$. The first (and, respectively, second) group is reduced to variable
    $V_1$ (and $V_2$, respectively). From the coordinates of $i$, partial individuals
    are dilated with the $J$ coefficient.'
