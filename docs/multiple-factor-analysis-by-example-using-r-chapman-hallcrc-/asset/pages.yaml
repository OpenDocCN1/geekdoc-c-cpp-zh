  md: "xiv\n\nPreface\n\n‘account for group structure of the variables in an overall\
    \ analysis’ mean?\nIn other words, why we do not simply conduct, for example,\
    \ a principal\ncomponent analysis and take the group structure of the variables\
    \ into account\nsolely during interpretation? We might summarise by saying that\
    \ this book\nanswers this question first and foremost.\n\nThe first two chapters\
    \ look back at basic factor analysis methods for\nindividuals ✗ variables, PCA\
    \ and MCA.\n\nChapter 3 presents Factor Analysis of Mixed Data (FAMD), a little-known\n\
    method for simultaneously analysing quantitative and qualitative variables\nwithout\
    \ distinction. FAMD contains the technical elements required\nfor taking into\
    \ account both types of variables within one single analysis.\n\nThe following\
    \ chapters numbered 4 to 9, describe multiple factor analysis.\nThe first look\
    \ in turn at the key points of MFA in the context of quantitative\nvariables.\
    \ In addition, one chapter is given over to qualitative and mixed data.\nFinally,\
    \ one chapter compares MFA and Procrustes analysis.\n\nChapter 10 presents a natural\
    \ extension of MFA: hierarchical MFA (HMFA).\nIn this method, the variables are\
