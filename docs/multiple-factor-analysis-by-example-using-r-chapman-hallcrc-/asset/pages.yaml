  md: '# Multiple Factor Analysis by Using R


    PCA, this criterion is equivalent to the sum of squared correlation coefficients
    between the principal component and the initial variables. This is why the principal
    components are interpreted as synthetic variables (they summarise to which they
    are closely related).


    In order to account for several groups of variables, we might consider implementing
    a PCA on the whole dataset in order to visualise between- and within-group correlations.
    This was done in Chapter 4 where it was shown that, to be useful, this analysis
    proposes that there is a balance between the groups of variables. In other words,
    highlighting between-group correlations from within-group correlations implicitly
    implies a balance between the groups of variables.


    # 6.1.1 Measuring the Relationship between a Variable and a Group


    Let us look back at the second perspective on a principal component of a standardised
    PCA: a component such as is a synthetic variable closely related to the initial
    variables. The simplest extension of the case of several groups is to look for
    a variable which is closely related to the groups of variables. This requires
    the definition of a measurement of the relationship between a variable (there
    is to say $v_s$, a synthetic variable of rank $s$) and a group of variables (already
    denoted $K_j$). Denoting such a measurement $Lg(v_s, K_j)$, the synthetic variable
    (of rank $s$) must fulfill:


    > $$\sum_j Lg(v_s, K_j) \text{ maximum}$


    with constraint $\|v_s\| = 1$ and orthogonality constraint $v_s \perp v_t$ for
    $t < s$, looking for a set of synthetic variables $v_s$ as a criterion, it is
    sufficient to ensure the groups are balanced within such that the measure satisfies
    the following relationship (as the squared correlation coefficient in standardised
    PCA):


    $0 \le Lg \le 1$.


    The value 0 indicates a total absence of relationships (in a sense which still
    requires clarification); the value 1 indicates a relationship of maximum intensity
    (in a sense which still requires clarification).

    The references to correlation of the standardised PCA sheds light on what we expect
    from a balance (expressed as a squared correlation coefficients) between the groups
    of variables. In PCA, the aim is not to obtain principal components (synthetic
    variables) as each is linked in the same way to each variable (the possibility
    of obtaining such a principal component depends on the correlations between initial
    variables). It is merely required, prior to the analysis, no initial variable
    should be privileged in constructing a principal component; this is ensured by
    equalising the maximum contribution to'
