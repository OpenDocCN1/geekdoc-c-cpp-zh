    # ### Representation of Groups of Variables (see Figure 10.13)


    In HMFA, a group of variables corresponds to a node of the tree structuring the
    variables. The $Ng$ indicator (squared norm in $\mathbb{R}^{17}$), which specifies
    the group’s dimensionality, appears in the first column of Table 10.7. This indicator
    shows:


    +   - The dimensions (equal to 2 or 1) of the sortings (qualitative variables
    with three or two categories)

    - The strongest dimensionality of nape 1 (1.198 > 1.099) due to the greater relative
    importance of its second (vertical) dimension

    - The dimensionalities of these sorted nappes, intermediate between that of the
    nappes and that of the sortings


    For the two groups attached to the root node (sorted nappes 1 and 2), the representation
    of nodes in HMFA is exactly the same as that for the groups in MFA: the coordinates
    of groups are interpreted both as a contribution and a relationship measurement.
    In this example, these coordinates are the inertias of rows 2 and 3 of Table 10.5.
    Figure 10.13 illustrates:


    +   - The great importance of the first axis on sorted nappes

    - The importance of axis 2 greater in sorted nape 1 (in which this axis corresponds
    to both kinds of data) than in sorted nape 2 (in which this axis is not all linked
    to the sorting)'
