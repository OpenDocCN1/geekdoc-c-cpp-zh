    # 1.5.6 Number of Axes


    In $\mathbb{R}^K$, there is a maximum of $K$ orthogonal axes. Furthermore, to
    represent a set of $I$ points orthogonal, at most $I-1$ axes (the origin is in
    $G_1$) are needed. The maximum number of axes (with an inertia of positive value)
    is therefore $\min[I-1, K]$.


    In $\mathbb{R}^I$, as the variables are centred, they are in a space of $I-1$
    dimension (in which there is a maximum of $I-1$ orthogonal axes). Furthermore,
    the $K$ variables generate a subspace with at most $K$ dimensions. The maximum
    number of axes of inertia with a positive value is therefore $\min[I-1, K]$.


    # 1.5.7 Vocabulary: Axes and Factors


    The term axis is not ambiguous: it represents a direction in a space. The word
    factor is used with different meanings in different fields; for example, in R
    software, it refers to a qualitative variable. This book uses the concept of factor
    as introduced by J.-P. Benzéczi. When projecting points on axis, the coordinates
    of the projected points are brought together in a vector which we refer to as
    a factor. Thus, in $\mathbb{R}^K$ space, we project the $I$ individuals on the
    axis of rank $s$ and the coordinates of the projections are brought together in
    the vector denoted $F_s$; $F_k$ is known as the factor on $I$ of rank $s$. In
    PCA, the projection on axis $s$ of all the $K$ variables leads to $G_s$ which
    is therefore the factor on $K$ of rank $s$. Due to transition relations, the factor
    $F_s$ (and $G_s$, respectively) in $\mathbb{R}^K$ (and $\mathbb{R}^I$, respectively)
    are collinear with the axis of rank $s$ in $\mathbb{R}^I$ (and $\mathbb{R}^K$,
    respectively) on which the variables (and individuals, respectively) are projected.
    In summary, we can say that in factorial analysis, the factors in space are the
    axes in the other.


