  md: '# 8.2.4 Representing Partial Categories


    As categories are represented by a centre of gravity of individuals, we can imagine
    a concept of partial categories based on that of partial individuals. In $\mathbb{R}^K$,
    partial category $k$ for group $(g_k)$ is inferred from $g_k$ by replacing its
    values for the variables $i$ (that is to say, the transformed and transformed
    indicators) for other groups with $i=0$. As a result, in MFA, a partial category
    is at the centre of gravity of the partial individuals that possess it. Projecting
    on the axis of rank


    ```

    $F_s(g_k) = \frac{1}{p_k} \sum_{i} p_{ik} f_s(i^k)$

    ```


    Remark

    nThe concept of partial category is of great importance for analysing qualitative
    variables. In surveys, for example, there are generally lot of individuals: they
    are therefore not considered individually, but instead through the subpopulations
    induced by their categories. This concept of *partial category* justifies the
    fact that, in MFA, the categories should be represented through the barycentres
    of their individuals rather than by indicators (or the barycentres, dilated axis
    by axis by the coefficient $1/\sqrt{s_k}$, which amounts to the same thing), as
    is usually the case in MCA.


    # 8.2.5 Analysing Variables in Space of Groups Variables $(\mathbb{R}^P)$


    Cloud of Groups of Variables

    In $\mathbb{R}^P$, the case of qualitative variables is only slightly different
    from that of quantitative variables. Each group of variables $K_j$ is represented
    by the matrix of the scalar products between individuals defined by group $j$
    alone. denoting $M_j$ the diagonal matrix of $K_j$ containing the weights of the
    categories of group $j$ (see also Section 7.1): $W_j = X_j M_j X_j^T$. Each $W_j$
    is associated with a point in $\mathbb{R}^P$. All of these points make up the
    cloud of groups of variables denoted $N_j$.

    $N_j$ is on the subspace generated by the standardised principal components (of
    the MFA in $\mathbb{R}^P$) that is to say on $w_s = v_s$ (see Section 7.4.1).
    The coordinate of group $j$ along $w_s$ is equal to the relationship measurement
    $Lg(w_s, K_j)$, which is why this representation is known as a relationship square.
    $Lg(w_s, K_j)$ is also the contribution of group $j$ to the inertia of the axis
    of rank $s$ (see Section 6.5.1). Unlike for groups of quantitative variables,
    this $Lg$ measurement is based on the correlation ratio (and not the correlation
    coefficient) for which it is a standardised mean (see Section 8.2.2). Each qualitative
    variable can also be represented individually in the relationship square. The
    representation suggested for the MCA (see Section 2.6)'
