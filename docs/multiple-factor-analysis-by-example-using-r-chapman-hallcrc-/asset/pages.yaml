    # 10.8 HMFA in FactoMineR


    Here we use the sorted nappes data (see Table 10.4). This presentation focuses
    on the specific aspects of the HMFA (compared with the MFA).


    ```

    # Importation

    > SorNap=read.table("SorNap.csv",header=T,sep=",",row.names=1)


    # Checking the first two rows

    > SorNap[1,2]

    X1 Y1 S1 X2 S2

    a 10 S1_1 10 S2_1

    b 20 S1_1 10 S2_1

    ```


    To define the hierarchy on the variables, we describe a sequence of partitions.
    The first partition described the finest (= most detailed). Then, for each partition
    level, the groups defined by the previous partition are aggregated.


    In the example of the two sorted nappes, the four groups of variables (nappe and
    sorting for each taster) are defined first. Following a procedure similar to that
    of MFA, we obtain four groups (see Figure 10.14, left), two of which are quantitative
    (containing the coordinates of a nappe, called Nappe_1 and Nappe_2) and two of
    which are qualitative (including a qualitative variable, called Sorting_1 and
    Sorting_2). After this has been done, the Next level of the hierarchy opens a
    window (see Figure 10.14, right) to bring together the groups which have already
    been constructed.'
