  md: '# Multiple Factor Analysis by Example Using R


    projected onto the factorial axes of $N_l$. It has also been suggested to use
    the factorial axes of the union of the $N_l^I$ (denoted $N_l^U$).


    # Influence of the Dimensions on the Objectives


    When $K_l > 3$, homology between the spaces in which $N_l^I$ evolve is not studied
    globally but by subspace. In practice, the representations are often studied dimension
    by dimension. This point of view brings generalised canonical analysis, which
    is to say, the search for a sequence of directions common to several homologous
    clouds of points. We often refer back to this approach.


    # 9.2 Comparing MFA and GPA


    Reminder: The MFA is based on a weighted PCA of table $X$ of size $(I, K)$ juxtapasing
    tables $X_j$ in rows. In this PCA, the variables of group $j$ are weighted by
    $1/\lambda_j^I$ (denoting $\lambda_j^I$ the first eigenvalue of the separate PCA
    for group j).


    # 9.2.1 Representing $N_l^I$


    Each $N_l^I$ corresponds to a table $X_j$.


    # In MFA


    $N_l^I$ are placed in space $\mathbb{R}^K$, the direct sum of $\mathbb{R}^{K_j}$.
    Thus, $N_l^I$ are not really in the same space. The simultaneous nature of this
    representation is artificial; it is justified as a framework for interpreting
    the method.


    # In GPA


    $N_l^I$ are all positioned in the same space $\mathbb{R}^K$. This representation
    corresponds to an overall homology of spaces $\mathbb{R}^{K_j}$, which each contains
    a $N_l^I$.


    N.B.: Initially, it is an overall homology, rather than initial dimension by which
    the variables are the same from one group to the other. This initial superimposed
    representation of $N_l^I$ is artificial, as is that of the MFA, and is justified
    as a framework for interpreting the method.


    The aim of GPA is to identify the homologous dimensions of $N_l^I$ from this overall
    homology of spaces $\mathbb{R}^{K_j}$. These homologous dimensions induce the
    same structure on the individuals. We observe the common factor notion of MFA.


    Almost all of the differences between the two methods are derived from the difference
    between the two modes of representation of $N_l^I$.'
