  pgno: 56
- img_proc: true
  md: '# Multiple Correspondence Analysis


    the value $y_{ik} = 1$. However, this category $k$ does not characterise individual
    $i$ in the same way, depending on its frequency in the sample population: specifically,
    from the point of view of the analyst, possession of a rare category characterises
    an individual more than a frequent category. This is the origin behind relativising
    $y_{ik}$ by the frequency of category $k$, which can be performed by transforming
    $y_{ik}$ as follows:


    ```

    $X_{ik} \leftarrow y_{ik} / p_k$.

    ```


    With this transformation, possession of category $k$ induces, for individual $i$,
    a value of $x_{ik}$ equal to, for example:


    +   - 1 if $k$ is possessed by all individuals

    - 2 if $k$ is possessed by half the population

    - 4 if $k$ is possessed by a quarter of the population


    Furthermore, the mean for each column $k$ is worth 1. As the columns must be centred,
    the final transformation is expressed:


    ```

    $X_{ik} \leftarrow y_{ik} / p_k - 1$.

    ```


    In this chapter we present MCA from the unstandardised PCA of $X_{ik}$.


    # 2.4.1 Cloud of Individuals


    We consider all the data for individual $i$: $\{x_{ik} : k=K\}$. This individual
    can be represented by a point in space $R^K$ (known as the individuals'' space).
    We then construct the cloud of individuals $N_i$. By default, this centre is centred
    (or the centre of gravity). Each individual $i$ is attributed the weight $p_i$
    so $\sum_i p_i = 1$; this weight is generally constant, $p_i = 1/I$.


    In defining distance in $R^K$, we must specify which is attributed to each dimension,
    that is to say, to each category. In MCA, this weight is proportional to the frequency
    of the category, taking into account the constraint that the sum of all weights
    is 1: the weight of category $k = mk_k = p_k/J$.


    This counterbalancing is ''natural'' if we consider a category as the set of individuals
    which possesses it, a valuable point of view for analysing the results, as we
    show later. The direct justification for counterbalancing in this way is clearer
    in the categories'' space (the categories'' weights in this space induce the metric
    within $R^K$). Indirect justifications lie in the positive properties of the MCA.


    # Distance Between an individual $i$ and the Centre of Gravity of $N_i$


    The centre of gravity of $N_i$ is $G_i$.


    ```

    $d^2(i, G_i) = \sum_k \frac{p_k}{J} (\frac{y_{ik}}{p_k} - 1)^2 = \frac{1}{J} \sum_k
    \frac{y_{ik}}{p_k} - 1$.

    ```'
