    # Remark


    In Figure 7.3, the two qualitative variables (introduced as supplementary) were
    represented, as in multiple correspondence analysis (MCA); see Figure 2.3), by
    their squared correlation ratios with the factors. It thus appears that this first
    dimension more or less corresponds to the origin of the juices (Florida/other).
    The type of juice (ambient/refrigerated) is somewhat related to the second dimension
    and slightly related to the first. The overall evaluation is a supplementary group
    containing a single variable; its coordinates are a squared coefficient of correlation
    with the factors (the Florida juices are evaluated the best). These comments support
    the individuals'' representation. Full justification for simultaneously representing
    quantitative and qualitative groups is described in the following chapter on qualitative
    and mixed data.


    # 7.4 Criterion


    In $R^l$, the (standardised) principal component $v_l$ maximises the quantity
    (with the usual orthogonality and norm constraints):


    ```

    $L_g(v, K_j)$

    ```


    Translated in $R^l$, this criterion becomes $w_s$ is the $w$ which maximises the
    quantity


    ```

    $\langle w, W_j \rangle_{D''}$

    ```


    which is the sum of the coordinates of the $W_j$, aside from the particular constraint
    of being rank 1, the usual orthogonality and norm constraints:


    ```

    $||w_s||^2 = 1 \quad \langle w_s, w_t \rangle = 0 \quad \text{for} \ t < s.$

    ```


    We follow the usual factor analysis approach, that is to say the projection of
    a cloud of points onto a sequence of orthogonal axes in descending order of interest;
    however, the coordinates of the projections intervene directly in the criterion
    rather than through their square. This does not pose a problem, unlike PCA for
    example, as these coordinates are always positive.


