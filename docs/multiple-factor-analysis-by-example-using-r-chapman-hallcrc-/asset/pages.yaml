  md: '# Multiple Correspondence Analysis


    generally, we can calculate the ratio between the upper limit of projected inertia
    ($K_j - 1 = 4$ in this example).


    # Contributions


    The comments can be made about the contribution of an individual in MCA as in
    PCA. The contributions of the variables have already been discussed. The contribution
    (denoting CTR($k$)) of a category $k$ (the inertia of axis rank $s$) can be considered
    in two ways. From its definition in space $\mathbb{R}^k$,


    ```

    $CTR_s(k) = \frac{P_k}{J}G_s(k)^2,$$

    ```


    in $\mathbb{R}^K$ we obtain (denoting $F_s(k)$ the coordinate of the barycentre
    of the individuals possessing the category:


    ```

    $CTR_s(k) = \frac{1}{J\lambda_s}P_kF_s(k)^2$.

    ```


    The contribution of a category $k$ can therefore also be expressed in $\mathbb{R}^K$:
    it is proportional to the inertia of the barycentre of the individuals possessing
    $k$. This point of view enhances the interpretation of the MCA criterion in $\mathbb{R}^K$.
    Until now, we have aimed to express the maximum variability by a reduced number
    of dimensions. If, within $\mathbb{R}^K$, we consider the cluster of barycentres
    with the categories, it appears that the axes of the MCA also separate these barycentres
    ‘at best’


    # Supplementary Elements


    In practice, as for PCA, MCA is almost always performed using supplementary elements.
    Introducing supplementary individuals or qualitative variables (and therefore
    categories) is not particularly problematic. Apart from fact that they do not
    participate in constructing the axes, these elements are processed in the same
    way as the active elements.


    Moreover, we can introduce supplementary quantitative variables in MCA. In such
    cases, we calculate the correlation coefficients between these variables and the
    factors on $I$. As in PCA, the variables are represented in the correlation circle.
    They can also be represented in the relationship square (see Section 2.6).


