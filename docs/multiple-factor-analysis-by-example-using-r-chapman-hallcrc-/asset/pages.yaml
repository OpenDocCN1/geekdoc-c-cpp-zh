    # 7.7 MFA in FactoMineR (groups)


    We use the Orange juice data (see Table 1.5).

    In Commander, representations of groups in a relationship square are obtained
    by default for the first plane (see Figure 4.10). To obtain other planes, we use
    the `plot.MFA` function:


    +   - plot.MFA(ResMFA,axes=(2,3),choix="group")


    The MFA combines several tables for the groups (in $\mathbb{R}^{iz}$: the coordinates
    ($res$groupcoord), the qualities of representation ($res$groupcos) and the total
    inertias ($res$groupdist).

    Table 7.2 combines several of these results. Below, we list the R code needed
    to obtain it:


    +   # Initialisation

    - tab7_2=matrix(nrow=3,col=7)


    +   # Labels of rows and columns

    - row.names(tab7_2)=c("W1","W2","NJ")

    - colnames(tab7_2)=c(paste("Axis",1,5),"Plane(1,2)","Ssp(1,5")


    +   # Quality of representation of groups

    - tab7_2[1:2,5]=ResMFA$groupcos[1,5]


    +   # Projected inertia of NJ

    - tab7_2[3,1:5]=apply(ResMFA$groupcoord,1:5]^2,MARGIN=2,FUN=sum)


    +   # Quality of representation of NJ

    # Total inertia of the W are in ResMFA$groupdist2

    - tab7_2[3,1:5]=tab7_2[1,3:5]/sum(ResMFA$groupdist2)


    +   # Two columns margin

    - tab7_2[6]=apply(tab7_2[1,3:2],MARGIN=1,FUN=sum)

    - tab7_2[7,1:5]=apply(tab7_2[1,3:5],MARGIN=1,FUN=sum)

    - round(tab7_2,4)


    In the relationship square, it can sometimes be useful to add a point corresponding
    to all of the active tables (including the weighting of the MFA). This was done
    in Figure 7.5 using the `card` data. To do this, from the (interactive) graph
    generated using the plot.MFA function, a point is added (points function): its
    coordinates are calculated from the eigenvalues of the MFA and its label is displayed
    with the text function.'
