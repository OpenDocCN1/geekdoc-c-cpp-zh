  md: '# 1.9 Qualitative Variables in PCA


    # Principle


    PCA is designed to analyse several quantitative variables simultaneously. Thus,
    qualitative variables cannot intervene as active (elements). However, qualitative
    variables can be introduced as supplementary (elements), that is to say, linked
    to principal components. In concrete terms, introducing a supplementary qualitative
    variable in PCA can occur as described below.


    On factual planes, we can identify individuals by a symbol designating their category
    for a variable; in the Baccalaureate data, this means representing students by
    the numbers given to their high school, for example. This makes it possible to
    analyse (visualising between-high schools and within-high school variability)
    the relationship between a qualitative variable and the principal components (a
    level of precision which is indeed rarely necessary), but it makes it possible
    to study only a single variable at a time.


    On the factual planes, we can also represent the centers of gravity of individuals
    presenting the same category of variable (for all categories of all the variables);
    this procedure is less than detailed above (it does not practise within-high school
    variability) but it is used to visualise the categories of multiple qualitative
    variables at once.


    Intuitively, a quantitative variable and a qualitative variable are linked if
    the individuals of the same class (a class gathers the individuals having the
    same category for the qualitative variable) have similar values for the quantitative
    variable. More precisely, we decompose the variability of the quantitative variable
    according to the partition defined by the qualitative variable. We therefore obtain
    the equation of the analysis of variance which, in our language, can be expressed
    (in which we call Huygens’ theorem):


    > Total inertia = between-classes inertia + within-class inertia


    The squared correlation ratio divides between inertia by total-inertia. This is
    the percentage of inertia ‘explained’ by the qualitative variable.

    Therefore, overall itself of the relationship between a qualitative variable $q$
    and a principal component $q$ and $F_s$ can be measured by the squared correlation
    ratio between We can then construct a representation of the variables using this
    measurement as a coordinate. This representation is particularly useful when there
    are a large number of qualitative variables, which is not the case in the case
    of Baccalaureate grades. It is described in more detail later and illustrated
    in multiple correspondence analysis (see Figure 2.3).


    The significance of this relationship can be measured by the p-value associated
    with the overall F test of the factor effect in the one-way analysis of variance
    ‘explaining’ component $F_s$ using variable $q$. As in a regular analysis of variance,
    this overall test is a prerequisite to detailed examination of the categories
    outlined below. When there are a high number of qualitative'
