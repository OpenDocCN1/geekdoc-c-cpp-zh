  md: '# Comparing Groups of Variables


    # 7.6.4 Ten Touraine White Wines


    **Data (Wines)**


    Eleven tasters (professional enologists) were asked to evaluate 10 white wines
    using the napping® method. Each taster laid out the wines on a paper tablecloth
    with the wines that seem similar to him or her on a sensory level placed close
    together. Thus, each taster is associated with a configuration of 10 wines, that
    is to say, a table of coordinates with 10 rows (the wines) and two columns (horizontal
    and vertical coordinates), except for taster 10 who used only the vertical dimension
    (and therefore his have only one column). Each configuration is called a *nappe*.


    These tables are horizontally brought together, all of them being subjected to
    an MFA when a group corresponds to a taster (and therefore contains his or her
    coordinates). Here we focus on the representation of the groups (the tasters)
    in reference to the Indiscal model. In parallel to the MFA, the parameters of
    this model were estimated with the usual procedure (that we refer to as Indiscal,
    using the word to designate both the model and a usual program).


    Five of the wines (numbered 1 to 5) are officially labelled Touraine (Sauvignon
    wines). The remaining five (numbered 6 to 10) belong to the Vouvray labelling
    category (Chenin wines). In the lower group, two wines (7 and 10) are cask-aged
    (and have a *woody flavour*) and one number (6) has residual sugars (g/L).


    Figure 7.6 shows the two nappes for 8 and 9. For taster 9, for example, the two
    woody wines (7 and 10) to be relatively isolated but no separation between the
    Chenins and Sauvignons.


    # **Results


    The configuration of the wines provided by the MFA (see Figure 7.7), according
    to the first bisector, shows a separation between Chenins and Sauvignons.


