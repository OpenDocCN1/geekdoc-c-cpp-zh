    # Interpretability and Percentage of Inertia


    Thus, in this analysis, all of the axes can be clearly interpreted. This is therefore
    an unusual case, which clearly highlights two important points:


    +   PCA can be seen as a base change (to examine the variability of individuals
    beginning with the dimensions with the greatest inertia); in the most common applications,
    we use only the first axes of the new inertia, reducing the visibility of this
    point of view.

    The interpretability of an axis is not necessarily associated with high interpretability;
    the fifth axis is clear (its interpretation is simple and the position of the
    individuals can be easily linked to the data) and marginal (it represents little
    variability: the maths and physics grades are correlated ($r = .62$) and the deviation
    between the two corresponds to little variability).


    # Two Readings of the Correlation Circle


    In the representation of variables, the coordinate of variable $k$ along the axis
    of rank $s$ can be considered in two different ways (see Section 1.5.4):


    +   The correlation coefficient between variable $k$ and principal component $F_s$

    The coefficient of variable $k$ in the linear combination defining axis $u_s$
    in $\mathbb{R}^k$ (up to the coefficient $\sqrt{\lambda_s}$)


    Generally, the first approach is favoured. In this example, we mainly used the
    second, which is better suited to situations in which the linear combinations
    of variables can be interpreted easily. To do this, the variables must be expressed
    in the same units. It must be noted that the linear combinations presented above
    were calculated from raw variables, which yields a more striking interpretation.
    To better ‘fit’ the PCA, it is possible to apply these combinations to the centred-reduced
    variables, which does not change much in this data where the standard deviation
    varies only slightly from one variable to another (by doing this, the correlation
    coefficients between these combinations and the principal components increase
    slightly in four out of five cases).


    In practice, a significant advantage of the first approach is that it can also
    be applied to (quantitative) supplementary variables (see the following section).


