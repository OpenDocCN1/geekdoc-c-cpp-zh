  md: '# 8.3.2 Properties


    # Representing the Variables


    The quantitative variables are represented with the help of their correlation
    coefficients with the factors. The qualitative variables essentially appear through
    their categories, represented by the barycentre of individuals that possess them.
    In MFA, we use the exact barycentre (rather the barycentre up to a coefficient
    as in MCA) due to the partial coefficients (for which the coefficient would not
    be justified). In addition, the qualitative variables themselves also appear in
    the relationship square.


    # Representing Clouds of Partial Individuals


    Equalising maximum inertias of these clouds allows them to be represented simultaneously.
    This representation benefits from partial transition relations identical to those
    of the MFA applied to groups of the same type.


    Up to a coefficient, partial individual i of qualitative j lies at the barycentre
    of categories of group j which it possesses; thus


    ```

    $F_s(i^j) = \frac{1}{\sqrt{\lambda_s} \hat{Q}_j} \sum_{k \in K_j} y_{ik} G_s(k)
    = \frac{1}{\sqrt{\lambda_s} \hat{Q}_j} \sum_{k \in K_j} y_{ik} G_s(k).$

    ```


    Partial individual of qualitative group j lies on the side of the variables of
    group j for which it has high values and opposite of group j for which it has
    low values; thus


    ```

    $F_s(i^j) = \frac{1}{\sqrt{\lambda_s} \lambda_j^i} \sum_{k \in K_j} X_{ik} G_s(k).$

    ```


    The position of a partial individual of mixed group j verifies a property which
    combines the two preceding properties in the same way as the transition relation
    in FAMD (see Section 3.4). In summary, individual lies on the side of the quantitative
    variables for which it has a high value and on the side of the categories it possesses.


    In the previous relationships, coefficient J ensures that individual i is at the
    isobarycentre of its partial points $i^l$, whatever their type (see also the remark
    at the end of Section 8.2.3). thus


    ```

    $F_s(i) = \frac{1}{J} \sum_{j \in J} F_s(i^j).$

    ```


    Partial categories can be defined from the partial individuals. Partial category
    k of group j is denoted $k^l$; it is situated at the isobarycentre of partial
    individuals $i^l$ associated with the individuals possessing category k. This
    definition applies whatever the nature of group j.'
