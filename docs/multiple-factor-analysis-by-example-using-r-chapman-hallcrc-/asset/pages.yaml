    # 5.5.3 Algebra Approach


    Notations (Reminders and Additions)


    Let $X$ be the general term of table $X$ of $(I, K)$ juxtaposing $X_j$ in the
    rows. Let $m_k$ be the weight attributed to variable $k$, $M_k$ the diagonal matrix
    of $(K, K)$ containing all of $m_k$, and $M_j$ the diagonal matrix $(K_j, K_j)$
    containing weights $m_j$ for values of group $j$. To simplify waters, we attribute
    the same weight to all individuals.


    $W_j = X_j M_j X_j^T$, is the scalar product matrix (between individuals) associated
    with the $j$th table.


    The MFA is based on a weighted PCA of table $X$. We denote $u_s$ the vector of
    the $s$th axis of inertia cloud ($u_s \in \mathbb{R}^K$), $F_s$ the associated
    principal component, $v_s$ the associated standardised principal component ($v_s
    \in \mathbb{R}^I$), $\lambda_s$ the associated eigenvalue and $S$ the number of
    nonzero eigenvalues.


    Let $Z$ be matrix $(I, l)$ the columns of which are the standardised eigenvectors
    of $XMX^T$; the first $S$ columns of $Z$ are the $v_s$. We obtain $Z''Z = ZZ''$
    = identity.


    The coordinate of partial individual $i^l$ along axis of rank $s$ in the MFA is
    denoted $F_s(i^l) = F_s^i$. $F_l$ is the vector containing these $I$ coordinates.'
