  md: '# Weighting Groups of Variables


    # 4.6 Conclusion


    In this example, the effect of weighting as a balancing factor between the groups
    is not excessive as the first eigenvalue varies only slightly from one group to
    another. Consequently, for this dataset, PCA and MFA generate similar axes. But
    when the first eigenvalue differs greatly from one group to another, the weighting
    plays a vital role.


    However, setting the maximum axial inertia to 1 makes it easier to read the indicators
    of inertia (see rows 6, 7 and 8 of Table 4.5), which are vital later on. But especially,
    the advantage of the MFA lies in all of the aspects and are dealt with in the
    following chapters. In this case, from on in, the simplified representation of
    the factors of the separate analysis illustrates the advantage of accounting for
    structuring the variables into groups. For example, saying that the principal
    dimension that we present (that of the MFA) is very close to the principal dimension
    of each group increases the usefulness of the results.


