  md: '# 2.6 Representing Individuals, Categories and Variables


    Representing Individuals and Categories


    In MCA, transition relations are particularly simple and suggest superimpositions
    the representations of individuals and categories. They can therefore be expressed
    as follows. Along each axis, up to a coefficient:


    +   - An individual is at the barycenter of the categories it possesses.

    - A category is at the barycenter of the individuals that possess it.


    This is why the term barycentric properties is used for transition relations (we
    say quasi-barycentric refer to the fact that the categories are barycenters only
    up to a coefficient).


    In the practice of MCA, for example, in opinion poll data processing, the individuals
    are often numerous and anonymous (the only thing we know about them their answers).
    Thus, the clause of individuals is only consulted for its general appearance,
    with attention focused on the representation of the categories. With this in mind,
    some users prefer to represent categories by their exact barycenters.


    # Representing the Variables


    Particularly when there are a high number of variables, considering the categories
    is useful when users might want to know the answers to which variables are most
    closely related to a given axis, and which variables contributed to a given axis.


    Thanks to the correlation ratio between variable $j$ and the factor on $l$ of
    rank s it possible to answer these two questions as its square (already denoted
    $n^2(j, F_s)$) measures both:


    +   - The intensity of the relationship between variable $j$ and the factor of
    rank s

    - The contribution of variable $j$ to the inertia of dimension $s$ (see expression
    according to $n^2(j, F_s)$)


    These coefficients can be represented by a graph in which the coordinate of variable
    $j$ along direction $s$ is $n^2(j, F_s)$. Such a graph, an example of which is
    given Figure 2.3, highlights those variables most closely linked to one of the
    two axes or both of them. As the coordinates are between 0 and 1, the points are
    situated within a square (with sides with a length of 1), which is why this graph
    is called the relationship square. It must be noted that we can also represent
    quantitative variables on this graph by using the squared correlation coefficients
    as coordinates (between these variables and the factors $F_s$). Other properties
    of this relationship square are described in the context of MFA (Chapter 7).'
