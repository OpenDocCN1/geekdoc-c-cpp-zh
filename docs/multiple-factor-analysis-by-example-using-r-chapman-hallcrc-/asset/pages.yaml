    # 5.6 Superimposed Representation: Conclusion


    Superimposed representation is of major interest in applications. In some cases,
    it makes possible to avoid consulting separate analyses. With in mind, we have
    insisted on the distortions linked to this representation. In sum, along the axis
    of rank $s$ of the mean cloud, the inertia of the projection of $N_i$ tends to
    be accentuated when the direction of projection corresponds:


    +   - A low direction of inertia of cloud $N_i$ (due to distortion 1); this distortion
    is identical for all $N_i$

    - A high direction of inertia of $N_i^s$ (due to distortion 2); this distortion
    varies according to $N_i$


    In this regard, the superimposed representation of $N_i^s$ benefits from a partial
    transition relation expressing $F_s(i)$ of individual $i$ according to the coordinates
    $G_s(k)$ of the variables of group $j$.

    This relation makes it possible to take into account individuals who have data
    for only certain groups of variables. Such individuals cannot be introduced as
    variables in MFA. However, we can introduce them as supplementary and represent
    them as partial points corresponding to the groups for which they possess data.


    In the Orange example, this would correspond to a juice for which we know the
    chemical variables, but has not been tested. Therefore, on the factorial plane
    of Figure 5.5, we can represent the partial point chemical its position compared
    to the other chemical partial points. Concretely, this will be done by completing
    the missing data using arbitrary values (for example, the means of the variables)
    and, in the results, taking into account only the partial points for which data
    are available. Here, MFA offers the opportunity to include data in the analysis
    that are usually left out.


