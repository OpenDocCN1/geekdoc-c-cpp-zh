  md: '# Multiple Factor Analysis by Example Using R


    $K_1$ quantitative variables (standardised) $Q$ qualitative variables (condensed
    coding) $Q$ qualitative variables = $K_2$ indicators (complete disjunctive coding)


    ![](img/6b887cdbc8ce8df1d48c89228f9b63a5_82_0.png)


    **FIGURE 3.1**

    Data structure and principal notations. $x_{ik}$ : Value of $i$ for variable (central-reduced)
    $k$; $x_{iq}$ : Category of $i$ for variable $q$; $y_{ik}$ : 1 if $i$ possesses
    $q$ of variable $q$ and otherwise 0.


    +   - $Q$ qualitative variables $\{q=1, Q\}$, the $qth$ variable presents $K_q$
    categories $\{k=1, K_q\}$; the overall number of categories is $\sum_q K_q = K_2$;
    we denote $p_{kq}$, the proportion of individuals possessing $k_q$.


    Let $K = K_1 + K_2$ the total number of quantitative variables and indicator variables.

    These notations can be brought together in the table 3.31 in which the qualitative
    variables appear both in their condensed form and in their complete disjunctive
    form.


    # 3.2 Representing Variables


    Let $\mathbb{R}^I$ the space of functions on $I$. This space is endowed with the
    diagonal metric of the weights of the individuals, denoted $D$:


    ```

    $D(i, j) = \begin{cases} 0 & \text{if } j \neq i \ p_i & \text{if } j = i \end{cases}$

    ```


    Generally the individuals have the same $D = (1/l) I_d$ (where $I_d$ is the identity
    matrix of appropriate dimensions).

    As standardised PCA, the quantitative variables are represented by vectors with
    a length of 1.


    As in MCA, variable $q$ is represented by cluster $N_q$ of centred indicators
    $K_q$. This cluster generates subspace $E_q$ of dimension $K_q-1$; $E_q$ is the
    set of centred constants on the classes of the partition defined by $q$. For $N_q$
    to possess the same inertial properties as in an MCA, if we perform unstandardised
    PCA on it, the indicator $k_q$ must be divided by $p_{kq}$ and'
