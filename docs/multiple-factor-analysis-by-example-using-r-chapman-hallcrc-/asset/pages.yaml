  md: '# Multiple Correspondence Analysis


    By default, all of the selected elements (individuals and variables) are labelled.
    Thus, the relationship square (see Figure 2.3 on the left) is obtained by


    ```

    plot(res,choix="var")

    ```


    Elements can be removed from the selection using the argument invisible; the graph
    of individuals alone (see Figure 2.3 on the right) is obtained by


    ```

    plot.MCA(res,choix="ind",invisible="var")

    ```


    The parameter label can be used to label only certain elements; to obtain the
    graph of labelled categories, which are not labelled:


    ```

    plot.MCA(res,choix="ind",label="var")

    ```


    Now us apply the MCA to the entire Tools table. The qualitative supplementary
    variables must be identified as such (otherwise they are considered) as must the
    quantitative supplementary variables (otherwise they generate an error message).


    ```

    res=MCA(Tools,quali.sup=6,quanti.sup=c(7:11))

    ```


    By default, this command displays all of the basic graphs: individuals (ind),
    categories (var), quantitative variables (quanti.sup, correlation circles) and
    all of the variables (var; relationship square).


    The plot.MCA function has many options. For example, representing the individuals
    alone, coloured according to the (qualitative) variable n°6, using the argument
    habillage (hab=6), and so on:


