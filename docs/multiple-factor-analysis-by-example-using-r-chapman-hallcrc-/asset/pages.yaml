    illustrated in Figure 10.1. The aim of this chapter is to show what accounting
    for a hierarchical structure on the variables means.

    The Bac data, used to illustrate the PCA in Chapter 1, provides a second example
    of a hierarchy of variables. In fact, this data, along with each student''s Baccalureate
    results, we also have their term grades (there are three terms) for each of the
    five subjects. The complete data table therefore has 5 (subjects) × {1 (Bac) +
    3 (terms)} = 20 columns. It is possible to count many interesting analyses on
    this data. An overall perspective is to account for the hierarchy of variables
    which first separates the five Bac grades from the fifteen term grades, and within
    these terms, the three blocks of five term grades.


    These examples illustrate a common source of hierarchies defined from variables:
    collecting different kinds of data for one set of statistical individuals. Surveys
    are another source: questionnaires are often organised into themes and subthemes;
    it is interesting to take this structure into account in the analysis.


    # 10.2 Hierarchy and Partitions


    Figure 10.2 contains two representations of one hierarchy defined on a set of
    seven variables {X1, ..., X7}. In these graphs, a node is represented by a horizontal
    segment. The highest segment represents the root node.

