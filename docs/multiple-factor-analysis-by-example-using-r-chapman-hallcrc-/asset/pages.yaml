  md: '# Comparing Clouds of Partial Individuals


    Much multiple factor analysis (MFA) use involves comparing subtables, each made
    up of a group of variables. One aspect of this comparison was described in the
    previous chapter that of the factors of separate analyses. Here we deal with the
    aspect that undoubtedly contributes the most to MFA results: comparing clouds
    of individuals each associated with one of the groups of variables.


    # 5.1 Objectives


    A row of a data table in which we only consider the data relative to a single
    group of variables is known as a *partial individual*. Thus, partial individual
    $i$ corresponding to group $j$, denoted $i^j$, is made up of all the values of
    $\{x_{jk}: k \in K_j\}$. The set of partial individuals $\{i^j, i \in I\}$ associated
    with group $j$ makes partial cloud $N^j$. This cloud of individuals is analysed
    when conducting a principal component analysis (PCA) of the data of the single
    group $j$. It evolves in the space generated by the variables of group $j$ alone:
    $\mathbb{R}^K$. In MFA we have to consider $j+1$ clouds of individuals: the $j$
    partial clouds to which we add cloud $N$, we consider ''overall'' (as opposed
    to partial) evoking the fact that it is associated with the whole (active) data.
    In practice, we designate it a *mean cloud*, in reference to one of its geometric
    properties.


    The comparison of partial clouds is the geometric translation of the question
    of whether two individuals $i$ and $l$ are similar in terms of group $j$ are also
    similar in terms of group $g$.


    Thus, when considering the groups of sensory and chemical variables in the example
    of the six orange juices, we might ask ourselves the following questions:


    +   - Overall, do two orange juices which are similar from a chemical point of
    view also have the same sensory profile?

    - Are there any juices which have a ‘mean’ chemical profile and an unusual sensory
    profile? Could such a discrepancy which was not measured, an in-teraction between
    chemical and sensory characteristics (on perception) or some'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# Multiple Factor Analysis by Example Using R


    ![](img/6b887cdbc8ce8df1d48c89228f9b63a5_116_0.png)


    **FIGURE 5.1**

    Three individuals (A, B, C) according to two groups of variables: biometry (1)
    and grades (two variations: 2 and 3).


    other factor? Users expect statistics to identify such discrepancies so that they
    might be interpreted.


    We can illustrate our expectations when comparing (the shape of) partial clouds
    using a small example of data chosen for its simplicity. For three students (A,
    B and C), we have biometric measurements (height and weight) and exam grades (French
    and maths). As both groups are two-dimensional, it is possible to represent partial
    clouds graphically, with the visual examination acting as a statistical analysis
    (see Figure 5.1).


    In the first case (graphs 1 and 2), the graphs show a similar shape for the clouds.
    Each, students B and C are very similar and A is particular. According to the
    graphs, A is both tall and heavy, and has a ‘scientific profile’ (of good maths,
    at bad French).


    In the second case (graphs 1 and 3), the graphs show partial clouds of different
    shapes. For the biometric measurement, A is particular (tall and heavy) whereas
    for the grades it is B (‘scientific profile’) which is different.


    More generally, we compare $N_f^2$ in terms of their shape (we define the shape
    of a cloud of points by all of its interpoint distances).


    Direct visual comparison of these clouds is easy, in theory, if they are each
    only defined by two variables. But even in this case, if there are many individuals
    and/or groups, a graphical tool can be useful. Procrustes analysis provides such
    a graphical tool. This method:


    +   - After standardisation by the total inertia (if appropriate)

    - Superimposes the configurations

    - Turns one by one, operating symmetries where appropriate, in order to bring
    closer (when possible) the partial points related to one individual (known as
    homologous points); elementary rotation which fits one cloud to another is known
    as *Procrustes rotation*.'
