    # 1.6 Interpretation Aids


    # 1.6.1 Percentage of Inertia Associated with an Axis


    By dividing the projected inertia of cloud $N_i$ (or $N_k$) onto the axis of rank
    $s (\lambda_s)$ by the total inertia (equal to $K$ in standardised PCA), we obtain
    the percentage of inertia associated with an axis; this percentage is used to
    measure:


    +   - The quality of representation of clouds ($N_i$ or $N_k$) by the axis of
    rank $s$

    - The relative importance of axis $s$ (compared to the other axes)


    The percentage of inertia does not measure the advantage of a given axis for the
    user, firstly because it must be compared to the possible number of axes with
    an inertia of positive value. Thus, for example, 70% will not be considered in
    the same way if it is the result of the analysis of a table with the dimensions
    (5, 4) or (50, 40). In concrete terms, in standardised PCA, the percentage of
    inertia of an axis can be compared to what it would be in the absence of structure
    in the data (spherical cloud of individuals, with no particular direction of extension,
    or variables uncorrelated by two, which amounts to the same thing) or $100/K$
    corresponds to an eigenvalue of 1. Consequently, we must approach with caution
    when faced with an axis with an eigenvalue of less than 1, which represents less
    variance than any single variable.


    In the same context, we can simulate tables (with fixed dimensions) from independent
    variables. We then obtain a distribution of the first eigenvalue in which we can
    situate a first observed eigenvalue. To do this, we apply a common (unilateral)
    test approach, with the following $H_0$ hypothesis: the data from a process in
    which the variables are independent. Concretely, tables were drawn up to give
    the 95% quantile of the distributions of the first eigenvalue for different values
    of $I$ and $K$. Even if, in a given case, this hypothesis does not have a clear
    meaning, the value of such a table is always useful, at least for information.


    The percentages of inertia can be added over several axes; by adding these percentages
    for the first two axes, we example:


    +   - The representation of clouds ($N_i$ or $N_k$) by the first plane

    - The relative importance of the first plane (compared with other planes, or with
