  md: '# Comparing Groups of Variables


    ![](img/6b887cdbc8ce8df1d48c89228f9b63a5_151_0.png)


    FIGURE 7.2

    Lg and RV measurements in a few cases. Each segment represents a variable belonging
    to group 1 (continuous lines) or group 2 (broken lines). In these examples, the
    angles between the variables are worth 0° or 90°, which are not accurately represented
    on the diagrams in order to display all the variables.


    In this sense, we can consider this scalar product as a measurement of the relationship
    between two groups of variables. This aspect appears more clearly in the following
    section explaining the norm in $\mathbb{R}^{l2}$.


    Lg and RV

    By explicitly highlighting the weighting of the MFA, the measurement Lg of the
    relationship between groups $K_j$ and $K_i$ is expressed:


    ```

    $Lg(K_j, K_i) = \left(\frac{W_j, W_i}{\lambda_j^1, \lambda_i^1}\right)_D$.

    ```


    When $W_1$ and $W_2$ are standardised (in $\mathbb{R}^{l2}$), $(W_1, W_2)_D$ is
    interpreted geometrically as a cosine and corresponds to the RV relationship measurement.

    Thus


    ```

    $RV(K_j, K_i) = \left(\frac{W_j, W_i}{\|W_j\|_D, \|W_i\|_D}\right)_D$.

    ```'
