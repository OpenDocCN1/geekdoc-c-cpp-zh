    or reliability. The open nature of the code further means that any developer,
    anywhere, can inspect the code, spot errors, and suggest possible fixes; this
    produces a stable, robust product wherein bugs, once discovered, are rapidly resolved—within
    a few hours of discovery!


    # Community Support


    Looking for a way to integrate Flickr components or Google Maps data into your
    application? Try the Zend_Service_Flickr or Zend_Gdata components. Communicate
    with a Flash application using Adobe Message Format (AMF)? Reach for the Zend_Amf
