  md: "# Chapter 10: Working with News Feeds and Web Services\n\nfeeds in the two\
    \ most common formats, while the Zend_Feed component makes it possible to generate\
    \ new feeds or modify existing feeds from native PHP data structures. The following\
    \ sections explain these components in detail.\n\n# Understanding News Feed Formats\n\
    \nTypically, news feeds are published in either Really Simple Syndication (RSS)\
    \ format or Atom Syndication Format (ASF) or, more commonly, “Atom”). Both formats\
    \ are XML-based and contain a marked-list of resources, each of which is tagged\
    \ with descriptive information such as a title, description, URL, and date. Both\
    \ formats can also reference a variety of different resource types, including\
    \ documents (usually blog entries or news items), images, and video and audio\
    \ streams.\n\nLike RSS, Atom feeds contain summary information about the resources\
    \ they describe; however, Atom feeds are slightly more complex than RSS feeds,\
    \ and the Atom syndication format has also been accepted as an Internet Engineering\
    \ Task Force (IETF) standard, yet to be matched by the RSS format. The differences\
    \ are unintentional: The Atom format was conceived in 2003 as an alternative to\
    \ the RSS format, which was originally devised by Netscape Communications in early\
    \ 1997. Since its introduction, the RSS format has been through multiple iterations\
    \ and competing versions, and the Atom format was conceived as a fresh approach\
    \ that had the advantage of not requiring backward compatibility with existing\
    \ feeds.\n\n10-1 illustrates the similarities (and differences) between the RSS\
    \ and Atom formats.\n\n# Consuming News Feeds\n\nThe easiest way to integrate\
    \ news feeds into a Zend Framework application is with the Zend_Reader component\
    \ which provides a simple, extensible framework for parsing feed and entry data.\
    \ This component can handle both Atom and RSS feeds, and it supports all existing\
    \ versions of both formats. This is a significant time-saver, given the RSS variants\
    \ currently in use. The Zend Framework manual specifies the component's design\
    \ philosophy when it states, “you should not have to care whether a feed is RSS\
    \ or Atom as long as you can extract the information you want.”\n\nConsider the\
    \ following example, which illustrates the process of using Zend_Feed_Reader:\n\
    \n```\n<?php\nclass Sandbox_ExampleController extends Zend_Controller_Action\n\
    {\n    public function feedAction()\n    {\n        // import feed from URL\n\
    \        $feed = Zend_Reader::import(\n            'http://news.google.com/news?hl=en&topic=w&output=rss');\n\
    \n        // get get-feed summary elements\n        $this->view->feed = array();\n\
    ```"
  merge: -1
  pgno: 331
