    \ This Atom feed is returned to the client using the feed object's send() method.\n\
    \n# CAUTION\n\nThe Zend Framework v1.9 and earlier included a bug that resulted\
    \ in the router attempting to delete REST requests for the indexAction() to a\
    \ listAction() instead. The listing illustrates a simple workaround for this:\
    \ forward listAction() requests, if any, to the indexAction() using the _forward()\
    \ controller method.\n\nThe Api_CatalogController::getAction is automatically\
    \ dispatched when the router encounters a GET request with the \"id\" variable,\
