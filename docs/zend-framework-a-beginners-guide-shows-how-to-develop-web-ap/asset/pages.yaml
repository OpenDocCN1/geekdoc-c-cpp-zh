  md: '# Creating the Default Module


    The first step is to create the $APP_DIR/application/modules/ directory, and then
    create a set of subdirectories within that for the default module and its controllers
    and views. The zf command-line tool does not create these directories, so it is
    necessary to perform this task manually.


    ```

    shell cd /usr/local/apache/htdocs/square/application

    shell mkdir modules

    shell mkdir modules/default

    ```


    Next, move the existing models, controllers, and views from $APP_DIR/application/*
    to $APP_DIR/application/modules/default/


    ```

    shell mv controllers modules/default/

    shell mv views modules/default/

    shell mv models modules/default/

    ```


    # Updating the Application Configuration File


    The next step is to update the global application configuration file, located
    at $APP_DIR/application/configs/application.ini, with the location of the modules
    directory. This tells the Zend Framework''s routing subsystem to resolve module-specific
    entities.


    To perform this, open the application configuration file in a text editor and
    add the following lines to the [production] section:


    ```

    resources.frontController.moduleDirectory = APPLICATION_PATH " /modules"

    resources.modules = " "

    ```


    Once you''ve completed the preceding steps, accessing the application index page
    using the URLs http://square.localhost/ and http://square.localhost/default/index/index.
    If all has gone well, you should see the default application index page in both
    cases, as shown in Figure 2-2.


    > TIP\Regardless of whether or not you organize your application into modules,
    remember that you can always redirect URL requests to specific modules, controllers,
    and actions through the use of custom routes.


    # Understanding Master Layouts and Custom Routes


    At this point, you know enough the inner workings of a Zend Framework application
    to actually begin writing code of your own. The following sections get you started,
    guiding you through the process of creating a custom welcome page, setting up
    a master layout for the application, and building a custom route to it.'
