  md: "# 142 Zend Framework: A Beginner's Guide\n\n```\nresources.router.routes.delete.route\
    \ = /admin/articles/delete/:id\nresources.router.routes.delete.defaults.module\
    \ = system\nresources.router.routes.delete.defaults.controller = articles\nresources.router.routes.delete.action\
    \ = delete\n```\n\n# Layout\n\nBy default, all views will use the master layout\
    \ in the application configuration file. Customers often request a different look\
    \ and feel for an application's administrative views, either for aesthetic purposes\
    \ or to visually highlight to users that they've moved to a different section\
    \ of the application.\nIt's not particularly difficult to do this with a Zend\
    \ Framework application: Simply create a new layout for administrative views,\
    \ and then switch to it as needed within individual actions.\nHere's an example:\n\
    \n```\n<php\nclass SandboxExampleController extends Zend_Controller_Action {\n\
    \    public function adminDeleteAction() {\n        $this->->_helper->setLayout('admin');\n\
    \        // continue\n    }\n}\n```\n\nThis can be tedious (not to mention the\
    \ potential to become a maintenance nightmare) when dealing with a large number\
    \ of actions. Therefore, an alternative approach is to examine the URL and automatically\
    \ switch the layout within the controller's init() or preDispatch() method, before\
    \ rendering the view. This approach is described in detail in the next section.\n\
    \n# Try This 5-2 Listing, Deleting, and Updating Database Records\n\nWith all\
    \ this background information in mind, let's proceed to build the SQUARE administration\
    \ panel. As noted earlier, to keep things simple, we'll assume that administrators\
    \ only need to view, edit, and delete items from the catalog. The following sections\
    \ discuss each of these functions in detail.\n\n# Setting the Administrative Layout\n\
    \nThe first step is to define a new master layout for administrative views. Since\
    \ the main purpose of this layout is to distinguish the administrative interface\
    \ from the public one, it doesn't need to be particularly elaborate. Here's an\
    \ example of what it might look like:\n\n```\n<!DOCTYPE html PUBLIC \"//W3C//DTD\
    \ XHTML 1.0 Strict//EN\" \"http://www.w3.org/TR/xhtml/DTD/xhtml-strict.dtd\">\n\
    ```"
