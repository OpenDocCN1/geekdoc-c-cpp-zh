    \ = null;\n            $item->save();\n            $id = $item->RecordID();\n\
    \            $this->_helper->getHelper('FlashMessenger')->addMessage(\n      \
    \          'Your submission has been accepted as item #' . $id\n             \
    \   '. A moderator will review it and, if approved,\nit will appear on the site\
