  md: "# Chapter 10: Working with News Feeds and Web Services 337\n\n```\n// forward\
    \ to indexAction\npublic function listAction() {\n    return $this->forward('index');\n\
    }\n```\n\nThe Api_Catalog::indexAction begins executing a Doctrine query to obtain\
