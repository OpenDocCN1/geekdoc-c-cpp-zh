  md: '# 346 Zend Framework: A Beginner’s Guide


    # Key Tools & Concepts


    +   - Improve site navigation with menus, sitemaps, and breadcrumb trails

    - Learn about the Zend Framework’s Dojo integration

    - Create an AJAX-enabled autocomplete form input

    - Use YUI Library widgets with the Zend Framework

    - Understand how to create and use action helpers


    Distilling the essence of a Web application into clear, consistent navigation
    is one of things that sound easy in theory but are actually fairly hard to get
    right in practice. It takes many hours of thought and experiment to build a usable
    and consistent navigation for a Web application. However, the effort is invariably
    worth it: Navigation is one of the key elements of Web site usability, and getting
    right helps users locate information efficiently, making them happy and repeating
    visits.

    In addition to good navigation, it’s also possible to improve application usability
    through the judicious use of client-side programming techniques. The client API
    in most modern browsers, with the ready availability of client-side toolkits like
    jQuery, MooTools, and Dojo, makes it possible to quickly add new behaviors and
    functions to a Web application, improving responsiveness, reducing wait time,
    and (again) making users happy.

    What does this have to do with the Zend Framework? Well, the Zend Framework includes
    a couple of components that are directly relevant to the goal of improving application
    usability. In particular, the Zend_Navigation component, which provides a flexible,
    sophisticated API for managing and implementing different types of site navigation
    structures; and the Zend_Dojo component, which makes it possible to directly integrate
    HTML and AJAX widgets with the Web application. This chapter discusses both components,
    and also demonstrates how it is to integrate a third-party JavaScript toolkit,
    the Yahoo! User Interface (YUI) Library, with a Zend Framework application.


    # Working with Navigation Structures


    Zend_Navigation provides an object-oriented approach to managing navigation on
    a Web site or application. It provides a mechanism to express the relationships
    between the different pages of a Web application, and to render these as menus,
    sitemaps, or breadcrumb trails. Links and link relationships may be expressed
    as nested PHP arrays, XML documents, or INI files.


    # Understanding Pages and Containers


    The most basic navigational unit under the Zend_Navigation approach is a page,
    usually expressed as an instance of the Zend_Navigation_Page class. Every page
    has, at minimum, a'
