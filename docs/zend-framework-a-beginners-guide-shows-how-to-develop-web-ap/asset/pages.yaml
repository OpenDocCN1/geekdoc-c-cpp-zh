  md: '# Zend Framework: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Understand the basics of the Model-View-Controller pattern

    - Find out URL requests are handled in a Zend Framework application

    - Gain the benefits of a modular directory layout

    - Define and apply a global template to application views

    - Create custom routes for application resources

    - Learn to serve static content pages


    The preceding chapter gave you a gentle introduction to the Zend Framework, guiding
    you through the process of installing the framework and starting a new project.
    You now need to start fleshing out the application skeleton with code that makes
    it functional. This chapter will help you to do so, by introducing you to the
    fundamental design principles of a Zend Framework and then applying this knowledge
    to the task of building a real-world application. Without further ado, let''s
    jump straight!


    # Understanding Basic Concepts


    When you are developing a PHP application, the typical approach is to embed PHP
    code into one or more HTML documents using special delimiters. This makes it easy
    to construct dynamic Web pages using programming constructs like variables and
    function calls; simply alter the values of the variables embedded within the HTML
    code, and the content displayed on the pages changes appropriately.


    Every application developer knows, however, this convenience comes at a price.
    The approach described in the previous paragraph PHP scripts that are closely
    interwoven with HTML code that maintaining them is a nightmare. Since the physical
    file usually contains both HTML interface elements and PHP code, developers and
    designers must coordinate with each other to make changes. The most common example
    of this is when interface designers need to alter the look and feel of a Web application—typically,
    the changes they make to the HTML code must be monitored by a developer to ensure
    the integrity of the embedded business logic.


    This type of arrangement is easily recognized by its most visible symptom: a bunch
    of hurried developers and designers clustered around a single computer arguing
    with each other as they take turns at the keyboard. Needless to say, in addition
    to producing frayed temps and suboptimal code, this approach usually requires
    more time and money than strictly necessary for the task at hand. And that’s where
    the Zend Framework can help.'
