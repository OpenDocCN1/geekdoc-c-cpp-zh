  md: "# 216 Zend Framework: A Beginner's Guide\n\n```\n$this->->_helper->getHelper('FlashMessenger')\
    \ ->addMessage(\n'Your submission has been accepted as item # ' $id\n. A moderator\
    \ will review it and, if approved, it will\nappear on the site within 48 hours.');\n\
    $this->->_redirect('/catalog/item/success');\n```\n\nThe, Zend_Form_Element File\
    \ objectgetTransferAdapter() method returns an instance of the Zend_File_Transfer\
    \ HTTP adapter. This adapter serves as a control point for receiving, validating,\
    \ and processing multiple uploads. It exposes a receive() method, which can be\
    \ used to manually receive the individual elements of a multiple upload. The use\
    \ of Rename ensures that these files are automatically renamed using a particular\
    \ naming convention that incorporates the entry's record ID and the file sequence\
    \ ID in the filename. The renamed files are saved to disk, in the destination\
    \ directory specified by the Zend_Form_Element File objectgetDestination() method.\n\
    \n# CAUTION\n\nWhen you're uploaded files with their original name, remember to\
    \ validate the filename before receiving the file with the receive() method. This\
    \ is to eliminate the possibility of files being injected into the server's file\
    \ system through the use of filenames like '../etc/passwd' or '../index.php',\
    \ which would obviously cause serious problems on a badly configured server.\n\
    \n# Updating the Display Action and View\n\nMost of the heavy lifting is now over.\
