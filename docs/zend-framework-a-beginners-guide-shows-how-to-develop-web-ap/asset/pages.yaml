    it, and then asks for more data, and so on. In a single-user environment, these
    delays will not matter as much because no other transactions will be trying to
    access the database. In a multiuser scenario, a delay caused by a single transaction
    can have a ripple effect on all other transactions queued in the system, resulting
    in severe performance degradation.


    +   - Try breaking down large transactions into smaller subtransactions and executing
    them independently. This will ensure that each subtransaction executes quickly,
    freeing up valuable resources that would otherwise be used to maintain the state
    of the system.


    # Optimize Table Design and Server Configuration


    The techniques discussed in this section are all suggestions for application-layer
    optimization. However, for further performance improvements, you should also consider
    various techniques for optimizing performance at the database layer, such as:


    +   - Using indexes to speed up searching, grouping, sorting

    - Selecting an appropriate table engine

    - Specifying table join fields to be of the same data type and length

    - Increasing the available memory for various server-side buffers, such as the
    read buffer, the sort buffer, and the thread cache.


    You’ll find more information on these techniques in the manual for your database
    server.


    # Lazy Loading


    Both the Zend and Doctrine include autoloaders that can automatically find and
    load class definition files "demand." This technique, commonly known as lazy loading,
    significantly improves performance by reducing the number of file reads by a PHP
    script.


    To activate the Zend Framework autoloader, the Zend manual suggests adding the
    following lines of code to the application''s index.php script:


    ```

    <?php

    require_once ''Zend/Loader/Autoloader.php'';

    end_Loader_Autoloader::getInstance();

    ?>

    ```


    To fully benefit from the autoloader, it is also necessary to strip out all the
    require_once() and include_once() function calls from your Zend Framework installation.
    The Zend Framework provides an example of a simple command-line script that can
    do this for you. You’ll find a link to the relevant manual at the end of this
    chapter.


    It’s also a good idea to rearrange your PHP include path so that the Zend Framework
    directory is at or near the top of the list. This is because when attempting to
    require() or'
