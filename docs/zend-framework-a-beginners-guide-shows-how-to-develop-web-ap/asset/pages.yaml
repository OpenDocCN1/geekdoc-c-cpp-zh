  md: "# Chapter 10: Working with News Feeds and Web Services 339\n\n# Defining the\
    \ POST Action\n\nThe Api_CameraController::postAction is automatically dispatched\
    \ when the router encounters a POST request. As per REST conventions, such a request\
    \ should result in the creation of a new resource, with the body of the request\
    \ containing the raw data required for resource creation. Here's the code:\n\n\
    ```\n<?php\nclass Api_ApiController extends Zend_Rest_Controller\n{\n    public\
    \ function postAction()\n    {\n        // read POST parameters and save to database\n\
    \        $item = new Square_Item;\n        $item->fromArray($this->getRequest()->getPost());\n\
    \        $item->setRecordDate(date('Y-m-d', mtime(time())));\n        $item->setDisplayUntil\
    \ = null;\n        $item->save();\n        $id = $item->getRecordID();\n\n   \
    \     // set response code to 201\n        // send ID of newly-created record\n\
    \        $this->getResponse()->setHttpResponseCode(201);\n        $this->getResponse()->setHeader('Location',\
    \ $this->getApiBaseUrl().'/'.$id);\n        echo $this->getApiBaseUrl().''.$id;\n\
    \        exit;\n    }\n}\n```\n\nNotice that once the resource record has been\
    \ created and saved to the database, the client is sent a 201 (created) response\
    \ code, together with the URL of the newly created resource.\n\n# Ask the Expert\n\
    \n**Q:** Why does your REST API return results as Atom feeds?\nnA:** While REST-based\
    \ APIs can return data in any format, it's quite common for them to return Atom\
    \ or RSS feeds. This is because most modern HTTP clients come with built-in support\
    \ for these feeds, and most programming languages, too, include built-in or readily\
    \ available parsers for these formats.\n\n(continued)"
