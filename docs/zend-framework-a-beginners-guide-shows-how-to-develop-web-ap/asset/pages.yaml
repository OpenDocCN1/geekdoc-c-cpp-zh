  md: "# Chapter 11: Working with User Interface Elements 357\n\nSave this file as\
    \ $APP_DIR/application/configs/navigation.xml. Notice that this XML uses string\
    \ identifiers for each menu label; these will be automatically localized to the\
    \ currently selected language via Zend_Navigation's built-in compatibility with\
    \ Zend_Locale.\n\n# Registering the Navigation Object\n\nThe next step is to update\
    \ the application bootstrapper and configure and register an instance of the Zend_Navigation\
    \ object. This instance will then become available in all application controllers\
    \ and views, enabling the use of the various view helpers.\nTo this, update the\
    \ application bootstrapper, at $APP_DIR/application/Bootstrap.php, and add the\
    \ following method to it:\n\n```\n<?php\nclass Bootstrap extends Zend_Bootstrap\
    \ {\n    protected function _initNavigation() {\n        // read navigation XML\
    \ and initialize container\n        $config = new Zend_Config_Xml(APPLICATION_PATH\
    \ . '/configs/navigation.xml');\n        $container = new Zend_Navigation($config);\n\
    \n        // register navigation container\n        $registry = Zend_Registry::getInstance();\n\
    \        $registry->set('Zend_Navigation', $container);\n\n        // add action\
    \ helper\n        Zend_Controller_Action_HelperBroker::addHelper(\n          \
    \  new Square_Controller_Action_Helper_Navigation()\n        );\n    }\n}\n```\n\
    \nNotice that the line of _initNavigation() method references a Navigation action\
    \ helper. This is a custom action helper that is called on every request and takes\
    \ care of setting the active page in the main menu. This is discussed in the next\
    \ section.\n\n# CAUTION\n\nReading an extra file to load the navigation container\
    \ on every request, as shown in the previous section, can significantly degrade\
    \ performance in high-traffic applications. An alternative in such cases, especially\
    \ for simple navigation containers, is to define the container in the application\
    \ configuration file itself. This eliminates the extra file read and keeps things\
    \ speedy.\n\n(continued)"
