  md: '# About the Author


    **Vikram Vaswani** is the founder and CEO of Melonfire (http://www.melonfire.com/),
    a consultancy firm with special expertise in open-source tools and technologies.
    He has 12 years of experience working with PHP and MySQL as a Web developer and
    product manager, and has created and deployed a variety of PHP applications for
    corporate intranets, high-traffic Web sites, and mission-critical thin-client
    applications.


    Vikram is a passionate proponent of the open-source movement and is a regular
    contributor of articles and tutorials on PHP, MySQL, XML, and related tools to
    the community through his regular columns on the Zend Developer Zone


    IBM DeveloperWorks is the author of Zend Technologies’ well-regarded PHP 101 series
    for PHP beginners, and his previous books include MySQL: The Complete Reference
    (http://www.myphp-t.com/), How to Do Everything with PHP & MySQL (http://www.everythingphpmysysql.com/),
    PHP Programming Solutions (http://www.php-programming-solutions.com/), and PHP:
    A Beginner’s Guide (http://www.php-beginners-guide.com/).


    A Felix Scholar at the University of Oxford, England, Vikram combines his interest
    in Web application development with various other activities. When not dreaming
    up plans for world domination, he amuses himself by reading fiction, watching
    movies, playing squash, blogging, and keeping a wary eye out for Agent Smith.
    Read more about him and Zend Framework: A Beginner’s Guide at http://www.zf-beginners-guide.com.


    # About the Technical Editor


    **Ryan Mauger** is the Lead Developer for Lupimedia (http://www.lupimedia.com/),
    a multimedia design agency in Somerset, England that specializes in bespoke management
    systems for designed-oriented Web sites. Ryan is a keen Zend Framework supporter
    and contributor, and can often be found answering questions and guiding people
    on IRC (#channel). When not evangelizing the Zend Framework, Ryan is a proud father,
    and enjoys escaping to the lakes for a spot of fly fishing. Read more about him
    and his work at http://www.rmauger.co.uk.'
