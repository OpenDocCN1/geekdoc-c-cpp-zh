    Notice Doctrine maps each table in the database to two model classes: a base class
    and a child class. The base class extends the Doctrine_Record class, includes
    the table definition, and exposes (via inheritance) all the methods for common
    database operations. The child class is a stub class derived from the base, and
    serves as a container for any custom methods that you might want to add to the
    model.


    # Setting Model Relationships


    Now, while Doctrine can produce models that correspond to individual tables and
    expose methods for common operations on tables, it doesn''t have the intelligence
    to automatically detect relationships between tables. However, relationships are
    often critically in practical use, so it''s up to the developer to define these
    relationships by linking models.


    Doctrine makes it possible to replicate the different types of relationships possible
    in an RDBMS—one-to-one, one-to-many, many-to-many, and self-referencing—using
    just two methods: hasOne() and hasMany(). Both methods take two arguments: the
    name of the other model to be used in the relationship, and an array of options
    specifying parameters for the relationship. To ensure that these relationships
    are automatically loaded when the model is instantiated, they should be used within
    the model''s setUp().


