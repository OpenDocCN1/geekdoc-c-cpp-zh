  md: "# Chapter 9: Understanding Application Localization\n\nNext up, the application's\
    \ contact form. This form definition is created using ZendForm, which can automatically\
    \ detect and use a registered ZendTranslate object to perform run-time string\
    \ localization. So all that's required here is to replace each element's label\
    \ with a string identifier, which will be automatically replaced by the translated\
    \ value at runtime. Edit the form definition, at $APP_DIR/library/Square/Form/Contact.php,\
    \ and make the changes highlighted in bold:\n\n```\nphp\nclass Square_Form_Contact\
    \ extends Zend_Form {\n    public function __init() {\n        // initialize form\n\
    \        $this->setAction('/contact/index')\n            ->setMethod('post');\n\
    \n        // create input for name\n        $name = new Zend_Form_Element('name');\n\
    \        $name->setName('contact-name')\n            ->setOptions(array('size'\
    \ => '35'))\n            ->setRequired(true)\n            ->addValidator('NotEmpty',\
