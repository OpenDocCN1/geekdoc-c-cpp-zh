  md: "# Zend Framework: A Beginner's Guide\n\nThis example makes use of the DbTable\
    \ database authentication adapter, which is initialized with an instance of the\
    \ Zend_Db_Adapter_Abstract class. This adapter is passed a set of credentials,\
    \ and the Zend_Auth singleton is then used to perform authentication against these\
    \ credentials. The return value of the Zend_Auth::authenticate method is a Zend_Auth_Result\
    \ object; this object can be tested via its isValid() method to determine whether\
    \ authentication succeeded or failed.\n\nZend_Auth also exposes a number of additional\
    \ methods, which can be used within individual controllers and actors to verify\
    \ that an authenticated session exists. For example, the hasIdentity() method\
    \ returns a Boolean value indicating whether an authenticated user session exists,\
    \ while the getIdentity() method returns the identity of the authenticated user.\
    \ These methods can be invoked from individual actions to test whether not the\
    \ user has been authenticated, and therefore, to allow or disallow the's action.\n\
    \nHere's an example, which ensures that the protectedAction() is only available\
    \ to authenticated users:\n\n```\n<?php\nclass SandboxExampleController extends\
    \ Zend_Controller_Action\n{\n    public function protectedAction()\n    {\n  \
    \      // check if user is authenticated\n        // if no, redirect to login\
    \ page\n        // if yes, proceed as normal\n        if (!Zend_Auth::getInstance()->hasIdentity())\
    \ {\n            $this->redirect('/admin/login');\n        } else {\n        \
    \    $model = new MemberModel();\n            $this->view->data = $model->fetchAll();\n\
    \        }\n    }\n}\n```\n\nIt's also possible to create custom authentication\
    \ adapters that verify credentials against other sources, by simply extending\
    \ the base Zend_Auth_Adapter_Interface class. The class must also implement, at\
    \ minimum, a constructor that accepts user credentials and an authenticate() method\
    \ that verifies these credentials against an authentication provider. The return\
    \ value of the authenticate() method must be an instance of the Zend_Auth_Result\
    \ class, with a constant indicating whether or not authentication was successful.\
    \ You'll see an example of one such custom authentication adapter in the next\
    \ section."
