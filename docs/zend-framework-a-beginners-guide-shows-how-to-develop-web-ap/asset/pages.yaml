  md: '# Ask the Expert


    Q: How do I sort or limit search results from Zend_Search_Lucene?

    A: By default, Zend_Search_Lucene returns all matching documents, sorted by score.
    If this is not to your taste, you can define the sort field and sort order by
    adding additional parameters to the find() method. Similarly, you can restrict
    the number of matches returned by specifying a limit via the setResultLimit()
    method.


    NOTE

    A full discussion of the query language supported by Zend_Search_Lucene is not
    possible within the limited scope of this book. However, you can look up detailed
    information on this topic using the links at the end of this chapter.


