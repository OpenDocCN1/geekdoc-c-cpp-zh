  md: '# Chapter 2: Working with Models, Views, Controllers, and Routes 27


    As the controller tasked with intercepting client requests and directing them
    to the appropriate target for response, the front controller has a key role to
    play in the overall flow of a request through the application.


    +   When a request arrives, the Web server''s .htaccess file automatically rewrites
    it into a standard format and passes it on to the index.php script. This script
    sets up the application environment, reads the application configuration file,
    and creates an instance of the front controller.


    +   The front controller examines the request and determines the key components
    of URL. It attempts to route the request to an appropriate controller and action.
    To perform routing, the front controller will check both default and custom routes,
    and make use of pattern-matching techniques to select an appropriate target for
    the request.


    +   If a match is found, the front controller transfers to the corresponding controller
    and action. Once invoked, the action changes the application state using one or
    more models. It also selects the view to be displayed and sets any required properties.
    Once the action has completed, the selected view renders its output, wrapping
    it in a layout as needed. This output is transmitted back to the requesting client.


    +   In the event that none of the application''s defined routes match the request,
    an exception is thrown and the error controller and action are invoked. Based
    on the parameters of the exception, the error controller renders a view containing
    a failure notice. This output is transmitted back to the requesting client.


    # NOTE


    Any unexpected exceptions generated during the request-handling process will invoke
    the error controller and corresponding action. This will produce a view containing
    a failure notice, which is transmitted back to the requesting client.


    As noted earlier, the routing system automatically maps URLs in the format module/controller/action
    to the corresponding module, controller, and action. So, for example, to access
    the Listing::saveAction in the “auto” module, you''d need to request the URL http://application/auto/listing/save.
    Similarly, to access the NewsController::edit in the “content” module, you''d
    need to request the URL http://application/content/news/edit.


    If the routing system receives a request that doesn''t conform to the /module/controller/action
    format, it automatically applies defaults, as follows:


