  md: "# Zend Framework: A Beginner's Guide\n\nURL into a variable that can be accessed\
    \ within a controller. This means that, for example, a client requested the URL\
    \ /content/hello-world, the routing subsystem would automatically capture the\
    \ URL segment “hello-world” and store it in a request named page.\n\n# Defining\
    \ the Controller\n\nWhy do we need to capture the final segment of the URL and\
    \ store it as a request variable? That question is answered in the next paragraph,\
    \ but until we get there, let’s create the “default” module’s StaticContentController,\
    \ which, by convention, should be located at $APP_DIR/application/modules/default/controllers/StaticContentController.php.\
    \ Create this file and fill it with the following:\n\n```\n<?php\nclass StaticContentController\
    \ extends Zend_Controller_Action\n{\n    public function init()\n    {\n    }\n\
    \n    // display static views\n    public function displayAction()\n{\n      \
    \  $page = $this->getRequest()->getParam('page');\n        if (file_exists($this->view->getScriptPath(null))\
    \ .\n            \"/\" . $this->getRequest()->getControllerName() .\n        \
    \    \"/$page.php\" . $this->view->viewSuffix) {\n            $this->render($page);\n\
    \        } else {\n            throw new Zend_Controller_Action_Exception('Page\
    \ not found', 404);\n        }\n    }\n}}\n```\n\nThis controller exposes a single\
    \ action, displayAction(), which is responsible for reading the page variable\
    \ set by the routing subsystem using the request object’s getParam() method. It\
    \ then attempts to find a view script matching the value of that variable. If\
    \ a matching view script is found, it is rendered and sent to the client. So,\
    \ for example, if the URL requested by the client was /content/hello-world, the\
    \ $request->getParam('page') would return the value “hello-world”, and the action\
    \ would therefore attempt to render a view map $APP_DIR/application/modules/default/views/scripts/static-content/hello-world.phtml.\n\
    \nIf no matching view can be found, a 404 exception is raised and propagated to\
    \ the default exception handler, which formats it into a readable error and displays\
    \ it to the client."
