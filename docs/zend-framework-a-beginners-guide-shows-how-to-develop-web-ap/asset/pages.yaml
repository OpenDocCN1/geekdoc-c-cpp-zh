  md: "# Zend Framework: A Beginner’s Guide\n\nat the top level of the navigational\
    \ hierarchy, and each page has a title and URL. Each page may itself contain further\
    \ pages; these are expressed as Zend_Navigation_Page objects and attached to their\
    \ parent as a nested array. This hierarchical structure can easily be extended\
    \ to cover the entire surface of a Web site.\n\nPage objects are created as instances\
    \ of the Zend_Navigation_Page_Mvc class or the Zend_Navigation_Page_Uri class,\
    \ both of which extend the abstract Zend_Navigation_Page class. The difference\
    \ between the two arises from the manner in which the page link is defined: the\
    \ former piggybacks on the Zend Framework’s router by specifying each page’s module,\
    \ action, and controller, while the latter directly specifies the page link as\
    \ a URL. The following example illustrates the difference:\n\n```\n<?php\nclass\
    \ Sandbox_ExampleController extends Zend_Controller_Action\n{\n    function action()\n\
    \    {\n        // define MVC page\n        $page = Zend_Navigation_Page::factory(\n\
    \            'label' => 'Contact Us',\n            'module' => 'default',\n  \
    \          'controller' => 'contact',\n            'action' => 'index',\n    \
    \    ));\n\n        // define URI page\n        $page = Zend_Navigation_Page::factory(\n\
    \            'label' => 'Contact Us',\n            'uri' => '/contact/',\n   \
    \     ));\n    }\n}\n```\n\nEach page exposes a number of \"getter\" and \"setter\"\
    \ methods, which can be used to set page properties. For example, the label, forward\
    \ relationships, reverse relationships, and visibility can be all set with the\
    \ page object’s setLabel(), setRel(), setRev(), and setVisibility() methods, respectively,\
    \ and can be retrieved with the corresponding getLabel(), getRel(), getRev(),\
    \ and getVisibility() methods. There’s also the isActive() method, which returns\
    \ a Boolean value indicating whether or not the page matches the current request.\n\
    \n# TIP\n\nIn most cases, it is preferable to specify page objects as Zend_Navigation_Page_Uri\
    \ instances. Not only are the corresponding URLs somewhat easier to read and understand,\
    \ but the flexible nature of these objects means they can also be used to create\
    \ links to external or third-party resources. Zend_Navigation_Page_Mvc objects,"
