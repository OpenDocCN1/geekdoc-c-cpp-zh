    # Ask the Expert


    **Q:** Why do you have a separate translation file for the *en locale* in addition
    to files for the *en_US* and *en_GB* locals?

    **A:** As explained earlier in the chapter, if Zend_Translate is unable to find
    a source file for a locale identifier, it will automatically degrade the locale
    identifier to just the language code and use the general translation source file
    for that language, if available. Therefore, it''s recommended to always include
    a general translation file for every language that you plan to support in the
    application, in addition to the more specific translation files. This is the reason
    for including an *en* language file in addition to the *en_US* and *en_GB* language
    files.


    (continued)'
