  md: '# Chapter 5: Handling CRUD Operations 153


    # ## Handling Date Input


    A word about the date input fields in this form. As you may remember from Chapter
    3, Zend_Form includes a Date validator, which can be used to check if a date is
    valid or not. If you take a look at the preceding form definition, you''ll see
    that it includes three selection lists for date input, each for the day, month,
    and year. There''s also a hidden input field, which is used internally to store
    the composite date value created from the three selection lists, and is associated
    with the aforesaid Date validator.


    You''re probably thinking that this seems unnecessarily, and you''re right. Why?
    Well, as in default, the Date validator expects the date input to be formatted
    as a single string in YYYY-MM-DD format, and provides a validation error if this
    format is not. In the real world, users often make errors when manually typing
    in date as strings. Common errors include selecting a different format (for example,
    DD-MM-YYYY), forgetting to pad single-digit date and month values with zeros (for
    example, entering 9 instead of 09), or using a different separator (for example,
    YYYY/MM/DD).


    With this in mind, it''s generally considered safer and more user-friendly to
    select a selection list or graphical calendar interface for date input, as this
    is prone to user eccentricities, and then rewrite the input into the desired format
    programmatically. As you''ll see in the next section, precisely what the updateAction()
    does. It uses the three selection lists to create a composite date value in YYYY-MM-DD
    format, sets the hidden input field to this value, and then allows validation
    to proceed in the normal fashion.


    Since the hidden input field is associated with a Date validator, an invalid date
    will fail validation and the Date validator will generate an error message, which
    will be visible when the form is re-rendered. If the date is valid, the input
    will pass validation and the remainder of the action code will be executed as
    normal.


    # ## TIP


    There are other approaches to handling date input fields as well. One, suggested
    by leading Zend Framework developer Matthew O''Phinney, extending the Zend_Form
    base class to create a composite date element (you''ll find a link to this at
    the end of the chapter). Another technique, discussed in detail in Chapter 11,
    involves using a graphical calendar in combination with a text input field to
    direct the selected date in the required format.


    You''ll notice that this form definition also makes use of the HtmlTag. As explained
    in Chapter 3, this decorator controls the markup around form fields. In this particular
    case, it''s used to wrap a <div> element among the three date selection lists,
    through selective use of the decorator''s ''openOnly'' and ''closeOnly'' attributes.
    This <div> is used by the user-defined handleInputDisplayOnSelect() JavaScript
    function, which automatically hides or shows the group of date selectors depending
    on the item''s status.


    (continued)'
