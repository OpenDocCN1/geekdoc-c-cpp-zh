  md: "# Chapter 5: Handling CRUD Operations 167\n\n# Defining the Logout Action\n\
    \nThe corollary to the loginAction() is the logoutAction(), which destroys the\
    \ authenticated session and clears the user's identity via the Zend_Auth::clearIdentity\
    \ method. Here's what it looks like:\n\n```\n<?php\nclass LoginController extends\
    \ Zend_Controller_Action\n{\n    public function logoutAction()\n    {\n     \
    \   Zend_Auth::getInstance() ->clearIdentity();\n        Zend_Session::destroy();\n\
    \        $this->redirect('/admin/login');\n    }\n}\n```\n\n# Protecting Administrative\
    \ Actions\n\nThe final step is to attach authentication checks the actions you\
    \ wish to protect. Since all the administrative actions created to date are located\
    \ in a single controller, the Catalog_AdminItemController, these checks can conveniently\
    \ be added to controller's preDispatch() method. Here's what the updated preDispatch()\
    \ method looks like:\n\n```\n<?php\nclass Catalog_AdminItemController extends\
    \ Zend_Controller_Action\n{\n    // action to handle admin URLs\n    public function\
    \ preDispatch()\n    {\n        // check if user is authenticated\n        //\
    \ if not, redirect to login page\n        $url = $this->getRequest()->getRequestUri();\n\
    \        $this->_helper->setLayout('admin');\n        if (!Zend_Auth::getInstance()\
    \ ->hasIdentity()) {\n            $session = new Zend_Session_Namespace('square.auth');\n\
    \            $session->requestURL = $url;\n            $this->redirect('/admin/login');\n\
    \        }\n    }\n}\n```\n\nAs a result of this change, whenever the router receives\
    \ a request for an administrative action, the preDispatch() method will first\
    \ check if the user's identity has been authenticated\n\n(continued)"
