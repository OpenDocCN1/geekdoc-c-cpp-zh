  md: "# 326 Zend Framework: A Beginner’s Guide\n\n```\n// get latitude/longitude\
    \ results for address\n$response = $soap->geocode(\\'E Capitol St NE & 1st St\
    \ NE, Washington, DC');\n$this->view->results = array();\nforeach ($response as\
    \ $r) {\n    $this->view->results[] = array(\n        'zip' => $r->zip,\n    \
    \    'latitude' => $r->lat,\n        'longitude' => $r->long\n    );\n}\n\n//\
    \ get SOAP request and response for debugging\n$this->view->request = $soap->getLastRequest();\n\
    $this->view->response = $soap->getLastResponse();\n```\n\nThis example creates\
    \ a new Zend_SoapClient object and instantiates it with the URL to the Web service’s\
    \ WSDL file. As discussed, the WSDL file allows the client to automatically obtain\
    \ information on available methods, exported data types, and content of input\
    \ and output arguments. The second argument to the object constructor is an array\
    \ of configuration options, which can be used to define various aspects of client\
    \ behavior.\n\n# NOTE\n\nIt’s also possible to use Zend_Soap_Client in non-WSDL\
    \ mode by omitting the WSDL URL and directly specifying the SOAP service URL (endpoint)\
    \ as an argument in the options array.\n\nOnce the Zend_Soap_Client object has\
    \ been instantiated, remote methods can be accessed by “proxy,” calling the corresponding\
    \ object method. The Zend_Soap_Client object will automatically take care of creating\
    \ the SOAP message packet, transmitting it to the server via POST, receiving a\
    \ packet, and decoding the response packet into a PHP Zend_Soap_Client_Response\
