  md: "# Chapter 11: Working with User Interface Elements 371\n\n# Updating the Controller\n\
    \nThe final step is to update the ContactController and define the endpoint for\
    \ the autocomplete input. Here is the code, which should be added to $APP_DIR/application/modules/default/controllers/ContactController.php:\n\
    \n```\n<?php\nclass ContactController extends Zend_Controller_Action {\n    public\
    \ function autocompleteAction() {\n        // disable layout and view rendering\n\
    \        $this->->_helper->layout->disableLayout();\n        $this->getHelper('viewRenderer')->setNoRender(true);\n\
    \n        // get country list from Zend_Locale\n        $territories = Zend_Locale::getTranslationList('territ',\
    \ null, 2);\n        $items = array();\n        foreach ($territories as $t) {\n\
    \            $items[] = array('name' => $t);\n        }\n\n        // generate\
    \ and return JSON string compliant with dijo.data structure\n        $data = new\
    \ Zend_Dojo_Data('name', $items);\n        header('Content-Type: application/json');\n\
    \        echo $data->toJson();\n    }\n}\n```\n\nThis method converts an array\
    \ containing a list of countries into the JSON format expected by using the Zend_Dojo_Data\
    \ component discussed earlier, and it returns it to the requesting client.\n\n\
    To see this in action, visit the SQUARE application by browsing to http://square.localhost/contact,\
    \ and you should see a new text input field for country name. Enter a few characters\
    \ in this field, and as Dojo requests and presents a list of matching suggestions\
    \ from the ViewController::autocompleteAction defined in the previous section.\n\
    \nFigure 11-10 illustrates an example of what you might see.\n\n# Contact\n\n\
    Name:\n\nEmail address:\n\nCountry\n\n| Andorra |\n| Antigua and Barbuda |\n|\
    \ Anguilla |\n| Angola |\n| Antarctica |\n\nFigure 11-10 The Dojo ComboBox in\
    \ action"
