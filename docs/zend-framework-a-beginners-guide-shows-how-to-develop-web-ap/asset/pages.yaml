  md: "# Chapter 5: Handling CRUD Operations\n\n```\n{\n  if ($this->_helper->getHelper('FlashMessenger')->getMessages())\
    \ {\n    $this->view-messages = $this->_helper\n    ->getHelper('FlashMessenger')->getMessages();\n\
    \  } else {\n    $this->redirect('/');\n  }\n}\n```\n\nAssuming the form input\
    \ is valid, the createAction() method creates an instance of the Item model and\
    \ populates it using the input submitted through the Web form. Any necessary custom\
    \ adjustments to the input data—for example, setting the receiver's display status\
    \ to hidden—are performed at this point, and the record is saved to the database\
    \ by calling the model's save() method, which formulates and executes the necessary\
    \ INSERT query. Any errors in the process will be represented as Doctrine exceptions\
    \ and propagated to the default exception handler for resolution.\nIf the record\
    \ was saved, a status message is added to the FlashMessenger and control is transferred\
    \ to the successAction() method, which renders a success view. By convention,\
    \ this view script is located at $APP_DIR/application/modules/catalog/views/scripts/item/success.phtml.\
    \ Here's what it looks like:\n\n```\n<h2>Success</h2>\n<?php echo implode($this->messages);\
    \ ?>\n```\n\n# Ask the Expert\n\n+   **Q:** Why are you redirecting to the successAction(),\
    \ instead of simply rendering a success view within the createAction(), after\
    \ saving the record in the previous example?\n\n+   **A:** This is the recommended\
    \ approach to follow after any successful POST operation, and is specifically\
    \ to avoid the called \"double post problem.\" Consider that, in the scenario\
    \ where the success view is rendered by the createAction(), if the application\
    \ user hits the browser's Refresh/Reload button after the success view has been\
    \ rendered, it will result in the same data being POSTed to the server. However,\
    \ by storing the success message in the FlashMessenger action helper and redirecting\
    \ to the successAction() to render this success view, the problem is completely\
    \ eliminated; reloading the page in this scenario will either generate the success\
    \ view again (without causing a double post) or redirect the client to the index\
    \ page.\n\n(continued)"
