    +   - The Zend_Log object serves as the primary control for generating log messages.
    It exposes a log() method that initiates the log write operation.


    +   - The Zend_Log_Writer object takes care of writing the log message to the
    specified data storage destination, be it a file, a database, an email address,
    or the system log. It is attached to the Zend_Log object with the latter''s add()
    method. Multiple writers may be attached to a single Zend_Log object. Table 8-2
    shows a list of the built-in writers included with the Zend Framework.


    +   - The Zend_Log_Formatter object takes care of reformatting the log message,
    either into XML or a user-defined format. It is always associated with a writer,
    and is attached to one with the latter''s setFormatter() method. Only one formatter
    is permitted per writer. Table 8-3 provides a list of the built-in formatters
    included with the Zend Framework.


