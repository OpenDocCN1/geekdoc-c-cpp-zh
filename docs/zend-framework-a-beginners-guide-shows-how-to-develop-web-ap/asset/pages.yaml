    \ via\naddMultiOption() method.\n\n# Defining Controllers and Views\n\nThe action\
    \ URL for the form defined in the previous section is specified as /catalog/\n\
    item/create. Under standard Zend Framework naming conventions, this to\nItemController::createAction\
    \ in the “catalog” module. This controller was created in\nChapter 4; now it needs\
