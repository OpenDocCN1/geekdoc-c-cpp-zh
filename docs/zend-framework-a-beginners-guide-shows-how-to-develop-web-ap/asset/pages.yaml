  md: "# Zend Framework: A Beginner's Guide\n\n# Defining String Localization Targets\n\
    \nWith the dates and numbers handled, the next step is to perform string localization.\
    \ Given the limited space constraints of this book, it isn't possible to localize\
    \ every string in the application, and so, this will assume that string localization\
    \ is restricted to only the three targets: the application's main menu, page footer,\
    \ and contact form.\n\nTo perform string localization, it is necessary to edit\
    \ each application layout and view, and use the translation view helper to dynamically\
