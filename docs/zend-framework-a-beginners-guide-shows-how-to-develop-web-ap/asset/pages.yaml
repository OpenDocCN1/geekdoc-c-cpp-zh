  md: "# Chapter 4: Working with Models 119\n\n# # Using Filters\n\nThe Doctrine_Query\
    \ class exposes a fluent interface, which means it's very easy to add layers to\
    \ this query. For example, let's suppose you wanted to retrieve only records of\
    \ active member accounts. You can add this condition to the query with the where\
    \ () method, as follows:\n\n```\n<?php\n$q = Doctrine_Query::create(\n  ->from('Member\
    \ m')\n  ->where('m.Status = ?, 1);\n$result = $q->fetchArray();\n?>\n```\n\n\
    You can attach multiple filters to a query in this manner with the addWhere()\
    \ method. Here's an example that retrieves records of active members located in\
    \ the United Kingdom:\n\n```\n<?php\n$q = Doctrine_Query::create(\n  ->from('Member\
    \ m')\n  ->where('m.Status = ?, 1)\n  ->addWhere('m.Location = ?, 'UK');\n$result\
    \ = $q->fetchArray();\n?>\n```\n\n# # Grouping and Ordering Results\n\nYou can\
    \ group and order the result set with the orderBy() and groupBy() methods. Here's\
