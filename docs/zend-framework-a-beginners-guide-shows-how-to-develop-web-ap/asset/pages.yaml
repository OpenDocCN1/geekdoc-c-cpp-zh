- img_proc: true
  md: "# Chapter 9: Understanding Application Localization\n\nBy default, a newly\
    \ instantiated Zend_Currency object will check if the application contains a registered\
    \ Zend_Locale object and, if it does, it will use this registered locale when\
    \ localizing currency values. It's also possible to override this behavior and\
    \ explicitly specify a locale as argument to the Zend_Currency constructor. In\
    \ either case, Zend_Currency will automatically select the appropriate currency\
    \ for that locale. Localized currency values can now be obtained by calling the\
    \ Zend_Currency object's toCurrency() method, which accepts a currency value as\
    \ argument.\nConsider the following example, which illustrates this in practice:\n\
    \n```\n<?php\nclass SandboxExampleController extends Zend_Controller_Action {\n\
    \    public function currencyAction() {\n        // initialize currency object\n\
    \        $currency = new Zend_Currency('fr_FR');\n\n        // result: '990,65\
    \ €'\n        $this->view->message = $currency->toCurrency(990.65);\n    }\n}\n\
    ```\n\n# CAUTION\n\nWhen you are passing a locale identifier to Zend_Currency,\
    \ it is mandatory to include both the language code and the region code. Omitting\
    \ either of these two codes will result in an exception, as Zend_Currency requires\
    \ the complete locale identifier to correctly identify the corresponding currency.\n\
    \nFor regions that have more than one currency, or to override the default currency\
    \ selection, the Zend_Currency constructor will accept a currency code as additional\
    \ optional argument. Here's an example:\n\n```\n<?php\nclass SandboxExampleController\
    \ extends Zend_Controller_Action {\n    public function currencyAction() {\n \
    \       // initialize currency object\n        $currency = new Zend_Currency('fr_FR',\
    \ 'FRP');\n\n        // result: '990,65 F'\n        $this->view->message = $currency->toCurrency(990.65);\n\
    \    }\n}\n```"
  merge: -1
  pgno: 301
- img_proc: true
  md: "# 284 Zend Framework: A Beginner’s Guide\n\n# NOTE\n\nA complete list of currency\
    \ codes is available in the ISO 4217 standard. You'll find a link to this standard\
    \ at the end of the chapter.\n\nIt is also possible to customize the currency\
    \ string returned by Zend_Currency using the setFormat() method to adjust the\
    \ position of the currency symbol, the name of the currency, the number precision,\
    \ and the visibility of the three-character currency code. This method accepts\
    \ an array of key-value pairs and reformats the currency string accordingly. The\
    \ following examples illustrate this:\n\n```\n<?php\nclass Sandbox_ExampleController\
    \ extends Zend_Controller_Action\n{\n    public function currencyAction()\n  \
    \  {\n        // initialize currency object\n        $currency = new Zend_Currency('hi_IN');\n\
    \n        // adjust currency format\n        $currency->setFormat(\n         \
    \   array(\n                'position' => Zend_Currency::RIGHT,\n            \
    \    'display' => Zend_Currency::USE_NAME,\n                'precision' => 2,\n\
    \            )\n        );\n\n        // result: '990.65 भारतीय रुपया'\n     \
    \   $this->view->message = $currency->toCurrency(990.65);\n\n        // create\
    \ custom currency format\n        $currency->setFormat(\n            array(\n\
    \                'position' => Zend_Currency::LEFT,\n                'display'\
    \ => Zend_Currency::USE_SYMBOL,\n                'precision' => 4,\n         \
    \       'name' => 'Driit',\n                'symbol' => 'DRT'\n            )\n\
    \        );\n\n        // result: 'DRT 990.6500'\n        $this->view->message\
    \ = $currency->toCurrency(990.65);\n    }\n}\n```"
  merge: -1
  pgno: 302
- img_proc: true
  md: "# Chapter 9: Understanding Application Localization\n\nTIP\n\nZend_Currency\
    \ includes the ability to perform exchange rate conversions on currency values\
    \ before localizing them. Alternatively, consider the PEAR Services_ExchangeRates_package,\
    \ which provides an API to perform real-time currency conversion using current\
    \ exchange rates. You'll find links with more information at the end of this chapter.\n\
    \n# Localizing Measurements\n\nWeights and measures are another where localization\
    \ is often necessary, and here too the Zend Framework has a solution: Zend_Measure,\
    \ a component designed to help in converting between different measurement units\
    \ and presenting the result as per local conventions. The component supports more\
    \ than 30 different measurement types, ranging from common types such as length,\
    \ weight, volume, and temperature to unusual ones as as acceleration illumination,\
    \ power, frequency, and energy.\n\nTo initialize a Zend_Measure object, it is\
