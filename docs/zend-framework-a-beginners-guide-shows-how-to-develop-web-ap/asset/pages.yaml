  md: "# Zend Framework: A Beginner’s Guide\n\n```\n// returns result array representing\
    \ authenticated user record\n// excludes specified user record fields as needed\n\
    public function getResultArray($excludeFields = null) {\n    if (!$this->resultArray)\
    \ {\n        return false;\n    }\n\n    if ($excludeFields != null) {\n     \
    \   $excludeFields = (array)$excludeFields;\n        foreach ($this->resultArray\
    \ as $key => $value) {\n            if (!in_array($key, $excludeFields)) {\n \
    \               $resultArray[$key] = $value;\n            }\n        }\n     \
    \   return $resultArray;\n    } else {\n        return $this->resultArray;\n \
    \   }\n}\n```\n\nSelect this class as $APP_DIR/library/Square/Auth/Adapter/Doctrine.php.\
    \ The main workhorse in this class definition is the authenticate() method, which\
    \ performs and executes a query to check if the supplied username and password\
    \ are valid. The method returns an instance of the Zend_AuthResult with three\
    \ properties: a code indicating success or failure, the username (or other unique\
    \ identity key) if successful, and an array containing error messages if unsuccessful.\n\
    \n# TIP\n\nApart from simple success and failure indicators, a number of other\
    \ result codes are also available. These can be used to provide more specific\
    \ information on why the authentication attempt failed—for example, whether the\
    \ failure was related to the username or to the password, whether the discovered\
    \ user record was ambiguous, or some other type of error occurred. A complete\
    \ list of these result codes can be found in the Zend Framework manual.\n\nWhile\
    \ the authenticate() method returns whether or not the user was authenticated,\
    \ the getResultArray() method returns the complete user record for authenticated\
    \ users, as an array. This method optionally accepts a list of fields to be excluded\
    \ and strips them from the returned array. This is a handy method to include in\
    \ your adapter, because it allows one-shot access to the entire user record and\
    \ makes easy to persist the user record in the session for other actions. You’ll\
    \ see an example of this in the next section."
