  md: '# Zend Framework: A Beginner’s Guide


    # Key Skills & Concepts


    +   * Page and sort database result sets

    * Filter, validate, and process file uploads through Web forms

    * Read and write configuration files in INI and XML formats


    When you''re building a software application, one of the most important tasks
    is to identify which aspects of the application''s behavior should be configurable
    by the user. For example, if you''re building a content management system, you
    will probably want to allow the application administrator leeway to decide how
    dates and times should be displayed, whether or not images can be attached to
    posts, and whether or not comments should be subject to reviewer and approval.
    However, you will probably not want the administrator dealing with the file format
    in which data is stored, or the manner in which exceptions are handled, as these
    are internal to the application and (usually) not appropriate for user-level configuration.


    Identifying which aspects of an application should be user-configurable isn''t
    easy as it sounds. In order to perform the analysis correctly, the developer requires
    a thorough understanding of both software''s goals and the end-requirements it
    is built to address. Once the analysis is complete, however, things become much
    easier. The identified variables can be relocated to a separate storage area (usually
    one or more configuration files), and it is now up to the developer to present
    an interface for application administrators to manipulate these variables at runtime.


    The Zend Framework includes a ZendConfig component, which provides a full-featured
    API for reading and writing configuration files in various formats. This chapter
    examines this component in detail, discussing how it can be used to manage configuration
    data in the context of the SQUARE example application. It also revisits two components
    from previous chapters, ZendForm and Doctrine, and illustrates how they can be
    used to satisfy two common requirements: enabling file uploads, and paging and
    sorting result sets.


    # Try This 7-1 Paging and Sorting Database Records


    When you''re dealing with large data sets within a Web application, it''s generally
    considered a Bad Thing to simply dump all the available data into a single page
    willy-nilly and let the user sort it out for himself or herself. Pagination, which
    involves breaking large data sets into smaller chunks, or pages, is a common interface
    pattern for improving readability and navigation in these situations. Pagination
    is important because it allows the user to exert control over which segment of
    the data is visible at any given moment, and thus avoid drowning in a never-ending
    sea of data. When used with a database server, pagination also helps reduce server
    load by producing smaller result sets.'
