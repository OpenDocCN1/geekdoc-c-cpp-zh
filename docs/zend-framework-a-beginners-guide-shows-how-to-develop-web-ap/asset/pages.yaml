    At this point, your REST API is up and running. You can test it by navigating
    the URL http://square.localhost/api/catalog in your Web browser, which should
    produce an Atom feed of active listings from the stamp catalog database. Figure
    10-5 illustrates what the output looks like.


    In a similar view, accessing the same URL with an additional item identifier,
    such as http://square.localhost/api/catalog/1, generates an Atom feed with details
    of the requested item. Figure 10-6 illustrates what this might look like.


    ![](img/222e7e58871b088cc6397852e1452b57_359_0.png)


    Figure 10-6 The API response to a GET request for a specific request


