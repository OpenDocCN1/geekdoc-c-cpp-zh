- img_proc: true
  md: '# Zend Framework: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Localize your application to different regions of the world

    - Automatically apply local conventions for dates, currencies, temperatures, and
    measurements

    - Build a multilingual Web application


    One of the nicest things about the Web is that it''s global: People from around
    the world can access and use Web applications with nothing more complicated than
    a browser and an Internet connection. The popularity and rapid growth of applications
    like Flickr, Google, Twitter, MySpace, and Facebook are testaments to the Web’s
    global reach and to a nation of a medium for communication and collaboration.


    If you''re a developer building a Web application, this fact has one important
    implication: Once your application is on the Web, it''s quite likely to receive
    visits from users who do not necessarily speak the same language as you, or even
    live in the same country. To make your application accessible to these users,
    it’s necessary to use the local languages, symbols, and formatting conventions
    of each user’s home country. This is the approach followed by some of today’s
    most popular applications; look at any of the applications mentioned in the previous
    paragraph, and you''ll find a version in your local language or dialect.


    The Zend Framework provides an easy way to perform application-level localization
    with its Zend_Locale component, and many other components, as Zend_Date and Zend_Currency,
    which can automatically adjust their behavior to support the user’s current region.
    There’s also the Zend_Translate component, which provides a full-fledged API for
    managing and translation strings in different languages. This chapter examines
    these components in detail, illustrating how they can be combined to build a localized,
    multilingual application.


    # Understanding Localization and Locales


    The pundits of globalization would have believe that the world is becoming an
    increasingly homogenous place, but in reality, every country still has a distinct
    identity and set of cultural mores. These differences exist at both the perceptual
    level—for example, the Italians as perceived a keen eye for fashion, while the
    French are a nation of gourmets—and in more prosaic cultural artifacts such as
    language, currency, measurements, and. For example, in the United States, July
    4th 2011 would be written as 7/4/2011, while in India the date would be expressed
    as 4/7/2011. Similarly, distances are expressed in kilometers in Germany, France,
    Italy, India, and many other countries, they are expressed in miles in the United
    States.


    Localization is the process of adapting an application to a particular geographic
    region, country, and/or language. This might be as simple as ensuring that dates,
    times, and currencies are displayed in the correct format for the selected region,
    or as complex'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Chapter 9: Understanding Application Localization 273


    as translating application labels, menus, and messages into the native language(s)
    of that region. The rationale is simple: The more “local” the application, the
    easier it is for users in different regions to understand it and making use of
    it. Most popular Web applications do this as a matter of routine: To illustrate,
    consider Figure 9-1, which displays the Google search engine as it appears in
    three different countries of the world: United States, France, and India.


    Central to the process of localization is the concept of locales and locale identifiers.
    A locale identifier is a string representing the user’s language and geographic
    region. This identifier consists of a language code and a country code, separated
    with an underscore. This identifier is intended to provide the application with
    precise information about the user’s current location and language, and thereby
    enable it to present its information in the usual conventions of that location
    and language.


    An example will make this clearer. Consider, for example, an application that
    is set to the locale en_US (language: English, country: United States). If the
    application is locale-aware, it will use this information to ensure that, for
    example, dates are presented in MM-DD-YYYY format and currencies are prefixed
    with the dollar ($) symbol. If the application is reconfigured to the locale de_AT
    (language: German, country: Austria), it will automatically perform the necessary
    internal adjustments to present dates in DD-MM-YYYY format and prefix currencies
    with the euro (€) symbol.


