    # Using a Custom Route


    Custom routes make it possible to map application URLs to specific modules, controllers,
    and actions, and are particularly useful when the Zend Framework’s default routes
    turn out to be inadequate or limiting.


    To illustrate, let’s say you want to map the application URL /home to redirect
    users to the application index page. To create a custom route that maps this URL
    to the “default” module’s IndexController::indexAction, update the application
    configuration file at $APP_DIR/application/configs/application.ini and add the
    following route entry to the [production] section:


    ```

    resources.router.routes.home.route = /home

    resources.router.routes.home.defaults.module = default

    resources.router.routes.home.defaults.controller = index

    resources.router.routes.home.defaults.action = index

    ```


    A route entry typically contains route, module, controller, and action attributes.
    The route attribute specifies the URL pattern that should match, while the module,
    controller, and action attributes indicate which module, controller, and action
    should'
