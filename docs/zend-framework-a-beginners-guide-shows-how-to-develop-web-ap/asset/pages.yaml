    # Unit Testing Policy


    Given that the Zend Framework is a loosely coupled set of components that are
    subject to ongoing development, unit testing assumes particular importance to
    ensure that components continue working correctly and the code base remains stable
    throughout release cycles. The Zend Framework has a strict unit testing policy,
    which dictates that components can only be added to the framework if they are
    accompanied by a reasonably complete and working collection of tests (written
    under the PHPUnit framework). This policy ensures that backward compatibility
    is maintained between releases and regressions are readily visible.


    # Code-Generation Tools


    Zend Framework includes a “tooling” feature that allows developers to get a new
    Zend Framework project up and running with minimal effort. This feature, implemented
    as a command-line script built on top of the Zend Tool component, takes care of
    creating the base filesystem layout for a new project and populating it with an
    initial set of controllers, views, and actions. Developers can use this testing
    script as a convenient shortcut to quickly create new objects as development progresses.


