    \ APC opcode cache.\n\nEvery cache has two key attributes: a lifetime and a unique\
    \ identifier.\n\n+   The lifetime value, usually specified in seconds, indicates\
    \ the period for which a cache entry should be considered \"valid\" or \"fresh\"\
