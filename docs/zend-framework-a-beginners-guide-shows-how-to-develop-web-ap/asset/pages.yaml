  md: "# 214 Zend Framework: A Beginner’s Guide\n\n```\n->addValidator('IsImage')\n\
    ->addValidator('Size', false, '204800')\n->addValidator('Extension', false, 'jpg,png,gif')\n\
    ->addValidator('ImageSize', false, array(\n  'minwidth' => 150,\n  'minheight'\
    \ => 150,\n  'maxWidth' => 150,\n  'maxheight' => 150\n))\n->setValueDisabled(true);\n\
    \n// attach element to form\n$this->addElement($images);\n\n// create display\
    \ group for file elements\n$this->addDisplayGroup(array('images'), 'files');\n\
    $this->setDisplayGroup('files')\n->setOrder(40)\n->setLegend('Images');\n\n//\
    \ attach element to form\n$this->addElement($submit);\n\n```\n\nThis adds a set\
    \ of three file upload elements to the form, via the setMulti() method. A set\
    \ of validators is used to ensure that these elements can only be used to upload\n\
    \n# Ask the Expert\n\n**Q: Why are you calling the Zend_Form_Element_File object’s\
    \ setValueDisabled() method?**\n\n**A: This prevents the files from being automatically\
    \ received when the getValues() method is called in the action. That’s simple,\
    \ but the really interesting question is, why should the files not be automatically\
    \ received? And therein lies a tale. You see, the Rename filter does not support\
    \ multiple uploads. However, our application requirements dictate that uploaded\
    \ files should be renamed to a specific format. To reconcile these two facts,\
    \ Thomas Wiedner, a well-known Zend Framework developer, suggests dynamically\
    \ setting the Rename filter on each individual file of the multiple upload, and\
    \ then manually receiving it using the Zend_File_Transfer HTTP adapter receive()\
    \ method. So, the call to setValueDisabled() ensures that the files are not automatically\
    \ received in the action and provides room for this manual receive-and-rename\
    \ process."
  merge: -1
