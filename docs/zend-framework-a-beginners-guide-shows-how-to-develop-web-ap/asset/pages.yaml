  md: "# Chapter 5: Handling CRUD Operations 159\n\nThe Zend Framework includes a\
    \ component specifically designed to tackle user authentication tasks. This component,\
    \ called Zend_Auth, provides an API and a set of adapters for verifying user credentials\
    \ against a variety of data sources, including SQL-compliant database systems,\
    \ text files, LDAP_directories, and OpenID providers. Successfully authenticated\
    \ identities are automatically stored in the session by Zend_Auth, which can be\
    \ retrieved or reverified at any time by a controller or action.\n\n# NOTE\n\n\
    Out of the box, Zend_Auth only supports session-based storage. However, you can\
    \ add support for other storage mechanisms simply by extending the Zend_Auth_Storage\
    \ Interface class. More information, and examples of how to do this, can be found\
    \ in the links at the end of this chapter.\n\nTo understand how this works in\
    \ practice, consider the following example:\n\n```\n<?php\nclass Sandbox_ExampleController\
    \ extends Zend_Controller\n{\n    public function authenticateAction(){\n    \
    \    // generate a login form\n        $form = new Form_Example_Auth;\n      \
    \  $this->view->form = $this->getRequest()->isPost()\n        if ($form->isValid($this->getRequest()->Post()))\
    \ {\n            // get credentials from user input\n            // initialize\
    \ authentication adapter\n            // perform authentication and test result\n\
    \            $values = $form->getValues();\n            $adapter = new Zend_Auth_Adapter_DbTable($this->db);\n\
    \            $adapter->setIdentity($values['username'])\n                -->setCredential($values['password']);\n\
    \            $auth = Zend_Auth::getInstance();\n            $result = $auth->authenticate($adapter);\n\
    \            if ($result->isValid()){n                $this->helper->getHelper('FlashMessage')\n\
    \                    ->addMessage('You were successfully logged\n            \
    \    in.');\n                $this->redirect('/admin/index/');\n            }\
    \ else {\n                $this->view->message = \n                    'You could\
    \ not be logged in. Please try again.';\n            }\n        }\n    }\n}\n\
    ```"
