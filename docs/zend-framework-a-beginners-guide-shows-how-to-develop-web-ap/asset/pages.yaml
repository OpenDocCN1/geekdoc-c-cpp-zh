    # Defining the Index Location


    Zend_Search_Lucene full-text search indices are stored as disk files, and one
    of the first tasks is to find a location for them. So, create the $APP_DIR/data/indexes/
    directory, which is the default location for search index files under the Zend
    Framework.


    ```

    shell cd /usr/local/apache/htdocs/square

    shell mkdir data

    shell mkdir data/indexes

    ```


    It''s also a good idea to update the application configuration file, at $APP_DIR/application/configs/application.ini,
    with this location, that it can be used from within actions. Open this file and
    update it with the following configuration directive:


    ```

    indexes.indexPath = APPLICATION_PATH "../data/indexes"

    ```


