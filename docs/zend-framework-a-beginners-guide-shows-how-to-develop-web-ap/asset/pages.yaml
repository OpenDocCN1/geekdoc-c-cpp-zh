  md: "# 222 Zend Framework: A Beginner’s Guide\n\n# Working with Configuration Data\n\
    \nAs explained earlier, an application developer must usually define which aspects\
    \ of an application's behavior should be configurable by the user. This information,\
    \ or configuration data, should be stored within the application's data store\
    \ (which could be a database, flat file, or some other form of permanent storage),\
    \ and accessed as needed by different application components.\n\nThe Zend Framework\
    \ makes the task of handling configuration files a little easier, with its Zend_Config\
    \ component. This component provides a full-featured API for reading and writing\
    \ configuration files, using an adapter-based approach. As of this writing, the\
    \ component comes with adapters for both INI and XML formats, and it's reasonably\
    \ easy to write new adapters for other custom formats as well.\n\nThe best way\
    \ to illustrate how Zend_Config works is with a few examples. The following sections\
    \ will get you started.\n\n# Reading Configuration Files\n\nZend_Config can be\
    \ used to read and parse configuration files expressed in XML or INI format. To\
    \ illustrate how this works, assume for a moment that you have an INI configuration\
    \ file named example.ini, containing the following data:\n\n```\n[object]\nshape\
    \ = 'square'\nsize = '10'\ncolor = 'red'\ntypeface.name = 'Mono'\ntypeface.size\
    \ = 19\ntypeface.units = 'px'\ntypeface.color = 'white'\n```\n\nThis data can\
    \ be read into a Zend_Config object, and the individual configuration variables\
    \ can be accessed as properties using standard object notation. Here's an example,\
    \ which illustrates this:\n\n```\n<?php\nclass Sandbox_ExampleController extends\
    \ Zend_ControllerAction\n{\n    public function configAction()\n    {\n      \
    \  // initialize configuration object\n        $config = new Zend_Config_Ini(APPLICATION_PATH\
    \ . \"/configs/example.ini\");\n\n        // sets $view-a to 'square'\n      \
    \  $this->view->a = $config->object->shape;\n```"
  merge: -1
  pgno: 240
- img_proc: true
  md: "# Chapter 7: Paging, Sorting, and Uploading Data 223\n\n```\n// sets view->b\
    \ to 'white'\n$this->view->b = $config->object->typeface->color;\n\n```\n\n# CAUTION\n\
    \nBy default, configuration data represented in a Zend_Config object is read-only,\
    \ and any attempt to modify it will produce an exception. To allow modifications,\
    \ pass an additional options array to the Zend_Config object as third argument,\
    \ specifying the 'allowModifications' key as true. More information on this can\
    \ be obtained from the links at the end of this chapter.\n\nThere's also a Zend_Config_Xml\
    \ adapter designed to handle XML-encoded configuration\n\n```\n<?xml version=\"\
    1.0\"?>\n<configuration>\n  <application>\n    <name>SomeApp</name>\n    <version>2.3</version>\n\
    \    <window>\n      <height>600</height>\n      <width>500</width>\n      <titlebar>\n\
    \        <title>Export Data</title>\n        <foregroundColor>#ffffff</foregroundColor>\n\
    \        <backColor>#0000ff</backColor>\n      </titlebar>\n    </window>\n  </application>\n\
    </configuration>\n```\n\nHere's an example of reading this file and accessing\
    \ configuration values from within it using the Zend_Config_Xml adapter:\n\n```\n\
    <?php\nclass Sandbox_ExampleController extends Zend_Controller_Action\n{\n   \
    \ public function configAction()\n    {\n        // initialize configuration object\n\
    \        $config = new Zend_Config_Xml(APPLICATION_PATH . \"/configs/example.xml\"\
    );\n    }\n\n    // sets view->a to '2.3'\n    $this->view->a = $config->application->version;\n\
    ```"
  merge: -1
  pgno: 241
- img_proc: true
  md: "# 224 Zend Framework: A Beginner’s Guide\n\n```\n// sets $view->b to 'Export\
    \ Data'\n$this->view->b = $config->application->window->titlebar->title;\n}\n\
    ```\n\n# Writing Configuration Files\n\nThat takes care of reading files, but\
    \ how about writing them? Zend_Config includes a writer component, Zend_Config_Writer,\
    \ which can be used to create configuration files in PHP, XML, or INI formats.\
    \ Configuration data can be arranged hierarchically, or in sections, for greater\
    \ readability.\n\nHere’s an example that illustrates how Zend_Config_Writer can\
    \ be used to produce a configuration file in INI format:\n\n```\n<?php\nclass\
    \ SandboxExampleController extends Zend_Controller_Action {\n    public function\
    \ configAction() {\n        // create configuration object\n        $config =\
    \ new Zend_Config(array(), 1);\n\n        // create section\n        $config->blog\
    \ = array();\n        $config->blog->allowComments = 'yes';\n        $config->blog->displayComments\
    \ = 'yes';\n        $config->blog->allowTrackbacks = 'yes';\n        $config->blog->defaultAuthor\
    \ = 'Jack Frost';\n        $config->blog->numPostsOnIndexPage = 5;\n\n       \
    \ // create section\n        $config->calendar = array();\n        $config->calendar->weekStartOn\
    \ = 'Monday';\n        $config->calendar->highlightToday = 1;\n\n        // create\
    \ subsection\n        $config->calendar->events = array();\n        $config->calendar->events->displayTitle\
    \ = 1;\n        $config->calendar->events->displayStartTime = 1;\n        $config->calendar->events->displayEndTime\
    \ = 0;\n        $config->calendar->events->displayLocation = 1;\n\n        //\
