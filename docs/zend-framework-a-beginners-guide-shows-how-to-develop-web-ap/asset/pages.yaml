    # Summary


    This chapter focused on user interface elements, and the Zend Framework components
    that can create a better experience for application users. First, this chapter
    discussed the Navigation component, illustrating how to structure pages into containers
    and generate sitemaps, menus, and breadcrumb trails from these containers. Next,
    it examined the Zend Framework’s Dojo integration and illustrated how the Zend_Dojo
    component could be used to quickly integrate an autocomplete into a Zend_Form
    instance. Finally, it looked at the process of using third-party JavaScript widgets
    in a Zend Framework application, with an example of integrating a YUI date picker
    into a Zend_Form instance.'
