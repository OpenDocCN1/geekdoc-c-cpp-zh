  md: "# Chapter 9: Understanding Application Localization\n\nZend_Locale_Format::convertNumerals('6482093.6498',\
    \ 'Latn', 'Deva');\n}\n\n**TIP**\nYou can obtain a complete list of the numeric\
    \ scripts supported by Zend_Locale_Format::convertNumerals by calling Zend_Locale::getTranslationList('script').\n\
    \n# Localizing Dates and Times\n\nThe Zend Framework comes with a component specifically\
    \ designed to handle temporal display and manipulation. This component, Zend_Date,\
    \ provides a simple API to create and format date and time values; it also supports\
    \ a much wider range of timestamps by PHP's built-in mtime() function, and it\
    \ can automatically detect the application locale (if set with Zend_Locale) and\
    \ present date and time values according to the local conventions of that.\nHere's\
    \ a simple example of Zend_Date in action:\n\n```\n<?php\nclass Sandbox_ExampleController\
    \ extends Zend_Controller_Action\n{\n    public function dateAction()\n    {\n\
    \        // set date to now\n        $date = new Zend_Date();\n\n        // result:\
    \ 'Dec 18, 2009 5:58:38 AM'\n        $this->view->message = $date;\n    }\n}\n\
    ```\n\nAs these examples illustrate, a Zend_Date object is automatically initialized\
    \ to the current date and time. It is also possible to initialize it to a specific\
    \ date and time by passing the constructor a-human-readable date string, a UNIX\
    \ timestamp, or an array of date/time segments. Here are some examples:\n\n```\n\
    <?php\nclass Sandbox_ExampleController extends Zend_Controller_Action\n{\n   \
    \ public function dateAction()\n    {\n        // set date using UNIX timestamp\n\
    \        $date = new Zend_Date(1261125725);\n    }\n```"
  merge: -1
  pgno: 297
- img_proc: true
  md: "# 280 Zend Framework: A Beginner’s Guide\n\n```\n// result: '2009-12-18T08:42:05+00:00'\n\
    $this->view->message = $date->get(Zend_Date::ISO_8601);\n\n// set date using string\n\
    // result: '2010-12-25T15:56:00+00:00'\n$date->set('25/12/2010 15:56');\n$this->view->message\
    \ = $date->get(Zend_Date::ISO_8601);\n\n// set date using array\n// returns '2010-06-24T16:35:00+00:00'\n\
    $date->set(\narray(\n    'year' => 2010,\n    'month' => 6,\n    'day' => 24,\n\
    \    'hour' => 16,\n    'minute' => 35,\n    'second' => 0\n));\n$this->view->message\
    \ = $date->get(Zend_Date::ISO_8601);\n```\n\n# CAUTION\n\nAvoid creating multiple\
    \ instances of Zend_Date, because each instance incurs a significant startup cost.\
    \ So, where multiple instances are required, it is much more efficient to reuse\
    \ an existing instance than to instantiate multiple instances.\n\nAs illustrated\
    \ in the previous example, Zend_Date includes a set of predefined constants for\
    \ common date formats as ISO 8601 and UNIX timestamps. These can be passed to\
    \ the Zend_Date object's get() method to retrieve date and time in the correct\
    \ format. The following list demonstrates some of these formatting constants,\
    \ with examples of the resulting output:\n\n```\n<php\nclass SandboxExampleController\
    \ extends Zend_Controller_Action\n{\n    public function action()\n    {\n   \
    \     // set date using string\n        $date = new Zend_Date('25/12/2010 15:56');\n\
    \n        // result: '2010-12-25T15:56:00+00:00'\n        $this->view->message\
    \ = $date->get(Zend_Date::ISO_8601);\n\n        // result: 'Sat, 25 Dec 2010 15:56:00\
    \ +0000'\n        $this->view->message = $date->get(Zend_Date::RFC_2822);\n```"
