  md: "# 144 Zend Framework: A Beginner’s Guide\n\n# Ask the Expert\n\n**Q: What is\
    \ the preDispatch() method?**\n\n**A: The preDispatch() method is a special \"\
    stub\" method that is automatically executed by the controller before the requested\
    \ action is invoked. It's particularly useful for preprocessing, logging, or otherwise\
    \ manipulating the contents of a request before passing it on to the specified\
    \ action. And, in case you're wondering, there's also a postDispatch() method,\
    \ which is automatically executed by the controller after the requested action\
    \ is invoked.\n\nThe code to this should be added to the `Catalog_AdminItemController`\
    \ $APP\\_DIR/modules/catalog/controllers/AdminItemController.php, as shown in\
    \ the following example:\n\n```\n<?php\nclass Catalog_AdminItemController extends\
    \ Zend_Controller {\n    // action to handle admin URLs\n    public function preDispatch()\n\
    \    {\n        // check URL for /admin pattern\n        // set admin layout\n\
    \        $url = $this->getRequest()->getRequestUri();\n        $this->->_helper->layout->setLayout('admin');\n\
    \    }\n}\n```\n\nThis code checks the current request and switches to the administrative\
    \ layout template using the `setLayout()` method.\n\n# Defining Custom Routes\n\
    \nThe next step is to define custom routes for the administrative functions. It's\
    \ necessary at this point to make some assumptions about what these routes will\
    \ look like, so let's assume that\n\n+   1. The summary listing URL will be of\
    \ the form /admin/catalog/item/index.\n\n+   2. All display URLs will be of the\
    \ form /admin/catalog/item/display/xx, where xx is a variable indicating the record\
    \ ID."
