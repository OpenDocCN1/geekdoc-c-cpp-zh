  md: '![](img/222e7e58871b088cc6397852e1452b57_99_0.png)


    **TIP**

    In case the predefined filters and validators that ship with the Zend Framework
    don’t meet your needs, remember that you can always write your own. The Zend Framework
    manual has examples of how to do this.


    # # Retrieving and Processing Form Input


    Within a controller script, you can use a number of Zend_Form methods to retrieve
    and process form input after submission:


    +   - The `isValid()` method checks if the submitted input is valid. This method
    accepts an array of input values and returns true or false depending on whether
    these values match the validation rules set up with the various `addValidator()`
    calls.

    - If the input is invalid, the `getMessages()` method returns a list of error
    messages generated during the validation process. This list can be processed and
    displayed when the form is rendered to give the user a hint about what went wrong.

    - If the input is valid, the `getValue()` method can be used to retrieve the value,
    filtered values for further processing. Values are returned as elements of an
    associative array, where the key represents the element name and the array value
    represents the corresponding input value. There’s also a `getUnfilteredValues()`
    method, which returns the original, unfiltered input as entered by the user.


    **TIP**

    The `isValid()` method automatically verifies CAPTCHA and hash values, with no
    additional programming required on your part.'
