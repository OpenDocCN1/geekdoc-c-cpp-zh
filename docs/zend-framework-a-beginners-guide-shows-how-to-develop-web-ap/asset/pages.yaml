  md: '# Chapter 4: Working with Models


    application; you always need to create your own. The Zend Framework includes a
    number of tools that can assist you in this task, as the Zend_Db_Adapter database
    abstraction layer and the Zend_Db_Table interface to table operations. However,
    you can also create your application models using third-party tools like Qcodec
    or Propel, and integrate them into your Zend Framework Application. And, in fact,
    is what the next section is all about.


    # # Installing Doctrine


    While you can create your application models from scratch, using the components
    provided by the Zend Framework, there''s an easier way: use a Object Relational
    Mapping (ORM) tool to automatically generate them. These tools can automatically
    scan an existing database and create model classes corresponding to the tables
    within it, using either the ActiveRecord or DataMapper pattern. Then it''s simple
    to add these augmented models to an application and extend them as needed to support
    specific requirements.


    There are a large number of free, open-source ORM tools available for PHP, such
    as Propel, Doctrine, RedBean, and Qc. This book uses Doctrine, which is extremely
    popular among developers on its ease of use, flexibility, and extensive extension.
    The Doctrine package includes a database abstraction layer, with support for most
    common RDBMS systems; a customized version of SQL Query Language (DQL); and tools
    to automatically generate model classes from an existing database schema. These
    model classes are based on the ActiveRecord pattern, are fully compliant with
    the PHP 5.3.x object.


    To get started with Doctrine, download and install the latest version to your
    development environment by visiting the official Doctrine Web site and getting
    a copy of the most recent release of the software. Then, extract its contents
    to a temporary area on the file system.


    ```

    $ shell cd /tmp

    $ shell tar -xzvf Doctrine-XX.gz

    ```


    You should end up with a directory structure that looks like Figure 4-1. The lib/
    directory contains all the Doctrine components, while the test/ directory contains
    test cases.


    The contents of the lib/ directory should be moved to a location in your PHP "include
    path" list.


    ![](img/222e7e58871b088cc6397852e1452b57_125_0.png)


    **Figure 4-1** The contents of a Doctrine release archive'
