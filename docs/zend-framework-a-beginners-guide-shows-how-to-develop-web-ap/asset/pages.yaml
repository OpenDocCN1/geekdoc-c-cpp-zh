  md: "# 276 Zend Framework: A Beginner’s Guide\n\nautomatic locale detection feature,\
    \ which can dynamically set the locale at run time after inspecting the following\
    \ information sources:\n\n+   **The settings of the client environment** Most\
    \ Web clients allow users to choose their preferred language and locale for viewing\
    \ Web pages. This information is accessible within a PHP application in the $_SERVER['HTTP_ACCEPT_LANGUAGES']\
    \ array. When this information is available, Zend_Local will use it to automatically\
    \ set the application locale. When the user has specified preferred languages\
    \ and locales, the first valid locale will be used.\n\n+   **The settings of the\
    \ host environment** When client settings are not available, Zend_Local will inspect\
    \ the server environment and set the application locale based on the host’s system\
    \ locale. This information can be accessed and modified within PHP with the setlocale().\n\
    \nUse automatic locale detection, the Zend_Local object must be initialized with\
    \ one of the special locales 'browser', 'environment', or 'auto'. Using the 'browser'\
    \ locale restricts detection to the user’s browser only, while using the 'environment'\
    \ locale restricts it to the host server only. Using the special 'auto' locale\
    \ (or, alternatively, passing no arguments to the object constructor) tells Zend_Local\
    \ to check both the user’s browser and the host server for information.\n\nHere\
    \ is an example of these actions in:\n\n```\n<?php\nclass Bootstrap extends Zend_Application_Bootstrap_Bootstrap\n\
    {\n    protected function initLocale()\n    {\n        // detect locale from user's\
    \ browser\n        $locale = new Zend_Local('browser');\n\n        // detect locale\
    \ from server environment\n        $locale = new Zend_Local('environment');\n\n\
    \        // detect locale automatically from browser and then server\n       \
    \ $locale = new Zend_Local('auto');\n\n        // detect locale automatically\
    \ from browser and then server\n        $locale = new Zend_Local();\n\n      \
    \  // register locale\n        $registry = Zend_Registry::getInstance();\n   \
    \     $registry->set('Zend_Local', $locale);\n    }\n}\n```\n\nIf autodetection\
    \ fails, Zend_Local will throw an exception indicating this fact. The general\
    \ practice in this situation is to catch the exception and manually set the locale"
