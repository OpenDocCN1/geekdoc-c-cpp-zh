    \ http://www.geonames.org/countryInfo?country=IN.\n\nThe response to a Zend_Client\
    \ request is presented as an instance of the Zend_Rest_Client_response object,\
    \ and is typically represented as a SimpleXML object or array of objects. Individual\
    \ elements of the response can be accessed either using SimpleXML notation, or\
    \ by directly accessing the element name as a method. Under the latter method,\
    \ an XPath query will be used to return all matching elements, regardless of their\
    \ hierarchical position in the XML document tree."
