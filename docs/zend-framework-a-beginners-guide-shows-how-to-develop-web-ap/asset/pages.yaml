    Figure 12-1 illustrates, this report provides useful information on the average
    of seconds needed by the server to respond to a particular URL request. Running
    a similar test on other application requests builds up an accurate picture of
    which parts of an application are "slow" and could benefit from optimization.


    An alternative to ApacheBench is the Microsoft Web Capacity Analysis Tool (WCAT).
    Like ApacheBench, this tool simulates loads on a web server, returning data on
    measured throughput and response times. Although only available for the Windows
    platform, it has a couple of interesting features: it can be used from multiple
    client systems simultaneously, and it can benchmark multiple-request "transactions"
    that must be executed in a specific sequence.


    Here''s an example of WCAT to benchmark a Web application:


    ```

    shell wcat.ws -terminate -run -clients localhost -t scenario.ubr -f settings.ubr
    -s -singleip -extended

    ```


    Figure 12-2 illustrates an example WCAT output report.'
