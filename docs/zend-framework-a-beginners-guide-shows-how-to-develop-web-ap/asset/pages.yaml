    class Catalog_ItemController extends Zend_Controller_Action {\n    public function\
    \ createAction() {\n        // generate input form\n        $form = new Square_Form_ItemCreate;\n\
    \        $this->view->form = $form;\n\n        // test for valid input\n     \
