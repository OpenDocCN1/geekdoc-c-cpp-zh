    # # Code Profiling


    Once’ve got some broad relevant figures and have identified areas for improvement,
    the next step is to profile the relevant controllers and actions, and understand
    where the bottlenecks are. One of the most popular tools for this task is PHP’s
    Xdebug extension, available for both Windows and *NIX flavors of PHP.


    The Xdebug prof generates detailed statistics on the amount of time spent per
    call in a script and the total time spent on script compilation, and execution.
    These statistics make it possible to see which function calls are responsible
    for the maximum processing overhead, and thus identify areas for potential optimization.
    The Xdebug extension also overrides PHP’s default exception-handling routines,
    providing more detailed debugging output and stack traces for both fatal and non-fatal
    errors.'
