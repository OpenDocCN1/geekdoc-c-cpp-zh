  md: "# Chapter 2: Working with Models, Views, Controllers, and Routes 21\n\nZend\
    \ Framework applications are built according to a widely accepted set of principles\
    \ which encourage reusability, maintainability, and scalability. One of the linchpins\
    \ of this approach is the Model-View-Controller (MVC) design pattern, which allows\
    \ application logic to be separated from the user interface and data, such that\
    \ they can be manipulated independently of each other. The MVC pattern also encourages\
    \ organization and separation of an application's responsibilities, and allows\
    \ different components to be tested independently.\n\nThe following sections explain\
    \ the key components of the MVC pattern, with specific notes on the Zend Framework's\
    \ implementation where relevant.\n\n# Models\n\nEvery application is driven by\
    \ data, whether it's something simple as a username and password or as complex\
    \ a multicurrent shopping cart. In the MVC pattern, data layer is represented\
    \ by one or more models, which provide functions to retrieve, save, delete, and\
    \ otherwise manipulate application data. This data is output-agnostic: it is completely\
    \ concerned with the data itself, and unconnected with how data is presented to\
    \ the user. As such, it provides a logically independent interface to manipulate\
    \ application data.\n\nTo illustrate, consider a simple Web application that allows\
    \ users to post classified advertisements for used cars. Under the MVC pattern,\
    \ this application's data—the car listings—would be represented by a Listing model,\
    \ which would expose methods for manipulating the underlying data. This model\
    \ would not be concerned with the visual display of the listings; rather, its\
    \ focus would be on the functions needed to access and manipulate individual listings\
    \ and their attributes in the data store.\n\nHere's an example of what one such\
    \ model might look like:\n\n```\n<?php\nclass ListingModel\n{\n    public function\
    \ __construct())\n    {\n        // constructor\n    }\n\n    public function\
    \ read($id)\n    {\n        // code to retrieve a single listing using its ID\n\
    \    }\n\n    public function find($criteria)\n    {\n        // code to retrieve\
    \ listings matching given criteria\n    }\n\n    public function save()\n    {\n\
    \n```"
