  md: "# Chapter 11: Working with User Interface Elements 349\n\non the other hand,\
    \ must be mapped by the Zend Framework router and so can only be used to create\
    \ links to internal application resources.\n\nThe Zend_Navigation container can\
    \ be initialized, as shown previously, with an array of Zend_Page objects. For\
