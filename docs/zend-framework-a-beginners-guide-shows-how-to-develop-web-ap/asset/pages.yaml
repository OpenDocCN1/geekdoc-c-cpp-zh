  md: "# 254 Zend Framework: A Beginner’s Guide\n\n# Ask the Expert\n\n**Q: What is\
    \ Zend_Debug?\n\n**A:** The Zend_Debug component provides a convenient way to\
    \ inspect variables in PHP. It exposes a single static method, `dump()`, which\
    \ can be used to \"dump\" contents of a variable to the standard output device.\
    \ This method is commonly used to quickly look inside variables, especially when\
    \ debugging and logging errors. Internally, `Zend_Debug::dump()` works as a wrapper\
    \ around the PHP `var_dump()` function, adding `<pre>...</pre>` tags around the\
    \ output and cleaning up line breaks for better formatting.\n\nTIP The Zend_Controller_Request_Http\
    \ object exposes various methods to get information about the current request,\
    \ and some of these are used in the previous code listing. The `getParameters()`\
    \ method returns an array of the request parameters, the `getServer()` method\
    \ returns an array of environment variables (`$_SERVER`), and the `getEnv()` method\
    \ returns an array of the current environment (`$_ENV`).\n\n# Logging Data\n\n\
    You've already seen, in the previous section, how it's possible to alter the amount\
    \ of debugging information presented to the user in production environments. However,\
    \ even though this information shouldn't be shown to the user, it does have value\
    \ to the application developer and administrator. So, the Zend Framework includes\
    \ a Zend_Log component, which provides a general-purpose logging framework to\
    \ log any type of data (including, but not limited to, exceptions) to file or\
