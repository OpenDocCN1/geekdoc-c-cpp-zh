  md: "# Zend Framework: A Beginner’s Guide\n\nsome Microsoft Office 2007 formats)\
    \ as well as to perform different types of search queries on the indexed data.\n\
    \nThere are two primary operations involved in implementing full-text search with\
    \ Zend_Search_Lucene: indexing data and searching data. Indexing scans a set of\
    \ documents and creating an index of its contents; searching looking up this index\
    \ to find documents matching various user-specified criteria. The following sections\
    \ provide an overview of these two operations.\n\n# Indexing Data\n\nA Zend_Search_Lucene\
    \ index is composed of individual documents, each of which may be further broken\
    \ into fields. When you’re building an index, Zend_Search_Lucene allows precise\
    \ control over each field of a document should be treated. The two basic parameters\
    \ here are indexing and storage: Indexed fields can be used in searches, while\
    \ stored fields can be displayed in search results. There are five basic types\
    \ of fields:\n\n+   * Keyword fields are not tokenized, but are indexed and stored\
    \ within the index.\n* Text fields are tokenized, indexed, and stored.\n* UnStored\
    \ fields are tokenized and indexed, but not stored.\n* Unindexed fields are tokenized\
    \ and stored, but not indexed.\n* Binary fields are not tokenized and are stored.\n\
    \nWhen you’re making a determination as to which field types to use in your Zend_Search_Lucene\
    \ index, it’s important to have a clear idea of which fields you’ll be using as\
    \ search criteria and which fields you plan to display in search results. To illustrate\
    \ how this works in practice, assume for a moment that you have a collection of\
    \ XML documents in the following format:\n\n```\n<xml version='1.0\">\n<document>\n\
    \  <id>5468</id>\n  <from>Jim Doe <jim@example.com></from>\n  <to>Jane Doe <jane@example.com></to>\n\
    \  <subject>Hello</subject>\n  <date>Tuesday, February 27, 2008 10:45 PM</date>\n\
    \  <body>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed eius eiusmod\
    \ incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud\
    \ exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute\
    \ irure reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.\
    \ Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt\
    \ mollit anim id est laborum</body>\n</document>\n```"
