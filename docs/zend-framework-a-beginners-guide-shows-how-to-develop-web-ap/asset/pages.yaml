    the form has been submitted. The first half displays an input form containing
    two fields and a submit button; the second half validates the input to ensure
    that it is in the correct format and proceeds to escape it and insert it into
    a database.


    Figure 3-1 illustrates what the form looks like. Now, the script and general approach
    that you’ve just seen in practice, there’s no denying that it has a couple of
    problems:


    +   - The same script file contains both HTML interface elements and PHP business
    logic. As discussed in the previous chapter, this is both messy to look at and
    hard to maintain. It is also hard to enforce consistency between forms, since
    the code to produce each form is customized to a very high degree.


    +   - Every time you add a new field to the first half of the script, you need
    to add a corresponding set of validation tests and error messages to the second
    half of the script. This is annoying, and often repetitive: witness that the first
    two tests in the example do exactly the same thing.


    +   - There’s no way to reuse validation tests from one other forms (unless you
    had the foresight to pack them into classes or functions from the get-go). As
    a result, you often end up writing the same code time and time again, especially
    when working with forms that perform related or similar operations.


