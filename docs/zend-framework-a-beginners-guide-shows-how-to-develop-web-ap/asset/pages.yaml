  md: "# Chapter 6: Indexing, Searching, and Formatting Data 183\n\nHere's some example\
    \ code that illustrates how a collection of documents could be indexed:\n\n```\n\
    <?php\nclass Sandbox_ExampleController extends Zend_Controller_Action\n{\n   \
    \ public function indexAction()\n    {\n        // get index directory\n     \
    \   $index = Zend_Search_Lucene::create('/tmp/indexes/');\n\n        foreach (glob('*.xml')\
    \ as $file) {\n            // read source xml\n            $xml = simplexml_load_file($file);\n\
    \n            // create new document in index\n            $doc = new Zend_Search_Lucene_Document();\n\
    \n            // index and store fields\n            $doc->addField(Zend_Search_Lucene::Field::UnIndexed('id',\
    \ $xml->id));\n            $doc->addField(Zend_Search_Lucene::Field::Text('from',\
    \ $xml->to));\n            $doc->addField(Zend_Search_Lucene::Field::Text('date',\
    \ strtotime($xml->date)));\n            $doc->addField(Zend_Search_Lucene::Field::UnStored('subject',\
    \ $xml->subject));\n            $doc->addField(Zend_Search_Lucene::Field::UnStored('body',\
    \ $xml->body));\n\n            // save result to index\n            $index->addDocument($doc);\n\
    \        }\n\n        // set number of documents in index\n        $count = $index->count();\n\
    \    }\n}\n```\n\nEach document in the index is represented as a Zend_Search_Lucene_Document\
    \ object, and the individual fields of each message are represented as Zend_Search_Lucene_Field\
    \ objects. These fields are indexed and added to the document with the Zend_Search_Lucene_Document::addField()\
    \ method, and the final document is then added to the index with the Zend_Search_Lucene::addDocument()\
    \ method.\n\nDefining which fields are searchable and which fields should be displayed\
    \ in search results is a key task when indexing data. The previous example shows\
    \ that recipient, date, subject, and body fields should be searchable, while only\
    \ recipient and date fields"
