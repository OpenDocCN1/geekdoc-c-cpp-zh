    When application data is stored in a database, as MySQL, SQLite, or PostgreSQL,
    models may make use of an underlying database abstraction layer to handle the
    tasks of managing database connections and executing SQL queries. The Zend Framework
    includes a database abstraction layer, Zend_Db, which provides a common interface
    to many different database systems, and models in the Zend Framework are expressed
    using the Data Mapper pattern. It’s also quite easy to integrate third-party models,
    such as those created with Object-Relational Mapping (ORM) tools as Doctrine and
    Propel, into a Zend Framework application.


    # Views


    If models are concerned solely with accessing and manipulating the application’s
    raw data, views are concerned solely with how this data is presented to the user.
    Views can simply be thought of as the “user interface layer,” responsible for
    displaying data but not capable of accessing or manipulating it. Views can also
    receive input from the user, but their responsibility is again linked to the appearance
    and behavior of the input form; they are not concerned with processing, sanitizing,
    or validating the input.


    In the context of the classified application discussed earlier, views would be
    responsible for displaying current listings and generating forms into which new
    listings could be entered. So, for example, there might be a view to display all
    the latest listings in a particular category, and a view to input new listings.
    In all of these cases, the controller and/or model would handle the tasks of retrieving
    and processing data, while the view would take care of messaging this data into
    an appropriate format for display and rendering it to.


    Here’s an example of a view intended to display the most recent listings:


