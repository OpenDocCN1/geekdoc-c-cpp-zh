    # Testing MySQL


    Once MySQL has been successfully installed, the base tables have been initialized,
    and the

    server has been started, you can verify that all is working as it should via some
    simple tests.


    First, start up the MySQL command-line client by changing to the bin/ subdirectory
    of

    your MySQL installation directory and typing the following command:


    ```

    prompt# mysql -u root

    ```


    You should be rewarded with a prompt, as follows:


    ```

    Welcome to the MySQL monitor.  Commands end with ; or \g.

    Your MySQL connection id is 26288

    Server version: 5.1.30-community MySQL Community Edition (GPL)

    Type ''help''; or ''\h'' for help. Type ''\c'' to clear the buffer.

    mysql>>

    ```


    At this point, you are connected to the MySQL server and can begin executing SQL

    commands or queries to test whether the server is working as it should. Here are
    a few

    examples, with their output:


    ```

    mysql> SHOW DATABASES;

    ---------------------

    | Database |

    ---------------------

    | mysql |

    | test |

    ---------------------

    2 rows in set (0.13 sec)

    ```


    ```

    mysql> SELECT COUNT(*) FROM mysql.user;

    ---------------------------

    | count(*) |

    ---------------------------

    |      1    |

    ---------------------------

    1 row in set (0.00 sec)

    ```


    If you see output similar to this example, your MySQL installation is working
    as it should.

    Exit the command-line client by typing the command exit and you''ll be returned
    to your

    command prompt.'
