    6. This step is the most important in PHP installation process. It sending arguments
    to the PHP configure script to configure the PHP module. Command-line parameters
    specify which extensions should be enabled, and they also tell PHP to find the
    supporting libraries needed by those extensions.


    ```

    [root@host]# cd /tmp/httpd-php-5.3.1

    [root@host]# ./configure --prefix=/usr/local/php

    --with-apache2=/usr/local/apache/bin/apxs

    --with-zlib --with-gd --with-mysqli=mysql

    --with-pdo-mysql=mysql

    ```


    Here is a brief explanation of what each these arguments do:


    +   - The --with-apache2 tells PHP to find Apache APXS (Apache Extension). This
    script simplifies the task of building and installing loadable modules for Apache.

    - The --with-zlib tells PHP to activate compression (zip) features, which are
    used by other PHP services.

    - The --with-gd tells PHP to activate image-processing features.

    - The --with-mysqli activates PHP''s MySQL extension and tells PHP to use the
    new MySQL driver (mysqlnd) as the MySQL client library.

    - The --with-pdo-mysql activates PHP''s MySQL PDO driver and tells PHP to use
    the MySQL native driver as the MySQL client library.'
