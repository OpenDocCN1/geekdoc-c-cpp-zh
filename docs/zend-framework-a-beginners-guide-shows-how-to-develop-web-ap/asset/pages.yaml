    common requirement involves users to sort the data set by one of its fields. Here
    too, additional parameters indicating the field and direction to sort are appended
    to the URL request, and the page controller is configured to sort the data by
    these parameters before handing it off to the view for display.


    To see this, go back to the application configuration file at $APP_DIR/application/configs/application.ini
    and further revise the route definition with two additional parameters, as shown
