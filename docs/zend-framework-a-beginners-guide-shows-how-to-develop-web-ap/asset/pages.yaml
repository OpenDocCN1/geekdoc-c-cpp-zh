    \ and \"exported\" across the application using Zend_Registry, so that it can\
    \ be used within different actions. However, in many cases, there is a need to\
    \ use cache configurations depending on the type of data being cached. For example,\
    \ you might want to cache RSS and Web service feeds in disk files while storing\
    \ frequently executed query results in a memory-cached, because retrieving data\
    \ from disk usually takes longer than pulling it out of memory.\n\nStriking the\
    \ correct balance between the different cache types is critical of importance\
    \ in achieving an optimal mix of speed and efficiency. This task is made somewhat\
    \ easier with Zend Framework’s Zend_Cache_Manager component and plugin-in, which\
    \ makes it possible to configure multiple cache types in the application configuration\
    \ file. This reduces the amount of configuration needed in the application bootrapper,\
    \ and makes it possible to use different caching styles for different actions\
    \ (or even within the same action).\n\nHere’s an example of one cache configuration:\n\
    \n```\nresources.cachemanager.mycache.frontend.name = Core\nresources.cachemanager.mycache.frontend.options.lifetime\
    \ = 600\nresources.cachemanager.mycache.frontend.options.automatic_serialization\
    \ = true\nresources.cachemanager.mycache.backend.name = Apc\n```\n\nIt is now\
