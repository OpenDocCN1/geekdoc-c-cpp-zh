  md: "# Chapter 8: Logging and Debugging Exceptions 243\n\nTo illustrate how this\
    \ works, consider the following listing, which attempts to access a nonexistent\
    \ array element using an ArrayIterator:\n\n```\n<?php\n// define array\n$cities\
    \ = array(\n  'London',\n  'Washington',\n  'Paris',\n  'Delhi'\n);\n\n// try\
    \ accessing a non-existent array element\n// generates an OutOfBoundsException\n\
    try {\n  $iterator = new ArrayIterator($cities);\n  $iterator->seek(10);\n} catch\
    \ (Exception $e) {\n  echo \"ERROR: Something went wrong!\\n\";\n  echo \"error:\
    \ \" . $e->getMessage() . \"\\n\";\n  echo \"Error code: \" . $e->getCode() .\
    \ \"\\n\";\n  echo \"File name: \" . $e->getFile() . \"\\n\";\n  echo \"Line:\
    \ \" . $e->getLine() . \"\\n\";\n  echo \"Backtrace: \" . $e->getTraceAsString()\
    \ . \"\\n\";\n}\n?>\n```\n\nWhen PHP encounters code wrapped within a try-catch\
    \ block, it first attempts to execute the code within the try block. If this code\
    \ is processed without any exceptions generated, control transfers to the lines\
    \ following the try-catch block. However.\n\n# Ask the Expert\n\n**Q:** I've seen\
    \ that uncaught exceptions generate a fatal error that causes the script to end\
    \ abruptly. Can I change this?\n\n**A:** Yes and no. PHP offers the set_exception_handler()\
    \ function, which allows you to replace PHP's default exception handler with your\
    \ own custom code, in the same way as set_error_handler() does. However, there's\
    \ an important caveat to be aware of here. PHP's default exception handler displays\
    \ a notification and terminates script exception. Using a custom exception handler\
    \ allows limited control over this behavior: While you can change the manner and\
    \ appearance of the notification display, you can't make the script continue executing\
    \ beyond the point where the exception was generated."
