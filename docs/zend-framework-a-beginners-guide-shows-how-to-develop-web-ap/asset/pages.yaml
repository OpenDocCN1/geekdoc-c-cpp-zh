  md: '# Zend Framework: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Learn about the PHP 5.x exception model

    - Understand how exceptions are handled in a Zend Framework application

    - Integrate custom exceptions classes with the default Zend Framework error handler

    - Control the visibility of error information in production environments

    - Maintain a permanent record of exceptions by logging them to a file or a database

    - Enhance log messages with additional debugging information

    - Track exceptions in real time with the Firebug console debugger


    A common misconception, among less experienced developers, is that a “good” program
    is one that works without errors. In fact, this is not strictly true: A better
    definition might be that a good program is one that anticipates all possible error
    conditions ahead of time and deals with them in a consistent manner.

    Writing “intelligent” programs that conform to this definition is as much art
    as science. Experience and imagination play important roles in assessing potential
    causes of error and defining corrective action, but no less is the programming
    framework itself defines the tools and functions available to trap and resolve
    errors.

    By developing applications with the Zend Framework, error handling is less of
    a concern than with many other frameworks. The error handler supplied by the Zend
    Framework can handle most common situations out of the box, and there are a number
    of other components, such as Zend_Log and Zend_Debug, which can be used to provide
    additional information to developers and administrators. This chapter will introduce
    you to all of these tools, and explain how they can be used in a practical context.


    # Understanding Exceptions


    PHP 5.x introduced a new exception model, similar to that used by other programming
    languages like Java and Python. In this exception-based approach, program code
    is wrapped in a try block, and exceptions generated by it are “caught” and resolved
    by one or more catch blocks. Because multiple catch blocks are possible, developers
    can trap different types of exceptions and handle each type differently.'
