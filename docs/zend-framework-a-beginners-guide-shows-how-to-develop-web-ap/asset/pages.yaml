    The next step is to create a log writer that will integrate with Doctrine to write\
    \ log entries to the database.\nAs discussed earlier, this is not very difficult:\
    \ It can be done simply by extending the base Zend_Log_Writer_Abstract class and\
    \ ensuring that the child class expands _write() method knows how to actually\
    \ perform the log operation. However, you might be wondering why this is necessary,\
    \ given that Zend already comes with the Zend_Log_Writer_Db writer.\n\nAs explained\
    \ in detail 5, the ways to do efficiency and consistency with Doctrine models,\
    \ and using one database library instead of two at this point simply muddies the\
    \ waters. Efficiency, because already Zend_Db at this point simply reduces the\
    \ number of components the application has to load and the amount of configuration\
    \ information that must be duplicated.\n\nWith this explanation, proceed to create\
    \ a custom log writer class Square_Log_Writer_Doctrine containing the following\
    \ code:\n\n```\n<php\nclass Square_Log_Writer_Doctrine extends Zend_Log_Writer_Abstract\n\
    {\n    // constructor\n    // accepts model name and column map\n    public function\
    \ __construct($modelName, $columnMap)\n    {\n        $this->modelName = $modelName;\n\
    \        $this->columnMap = $columnMap;\n    }\n\n    // stub function\n    //\
    \ to deny formatter coupling\n    public function setFormatter($formatter)\n \
    \   {\n        require_once 'Zend/Log/Exception.php';\n        throw new Zend_Log_Exception(get_class())\
    \ . ' does not support formatting';\n    }\n\n    // main log write method\n \
    \   // maps database fields to log message fields\n    // saves log messages as\
    \ database records using model methods\n    protected function _write($message)\n\
    \    {\n        $data = array();\n    }\n} ?>\n```"
