  md: '# Zend Framework: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Learn to programmatically create forms and form elements

    - Understand how to filter and validate user input

    - Protect your forms from Cross-Site Request Forgery (CSRF) attacks and spambots

    - Control the appearance of form elements and error messages

    - Create a working contact form


    > the previous chapter, you learned how the Zend Framework implements the Model-View-Controller
    pattern, and you looked underneath the hood of the example application to see
    how it works. You also started to fetch out the example application by adopting
    a modular directory structure, adding a master layout, and creating custom controllers,
    and routes for static content.

    Now, while you can certainly use the Zend Framework to serve up static content,
    doing so is like using a bulldozer to knock over a tower of plastic blocks. There''s
    nothing stopping you from doing it, but it''s not really what the bulldozer was
    intended for, and you''re liable to face hard questions about why there''s a bulldozer
    in your living room in the first place! The Zend Framework is similar, in that
    it''s intended to provide robust, elegant, and extensible solutions to complex
    Web application tasks. The more complex the task, the better suited it to the
    power and flexibility of the framework... and the more you''ll have knocking at
    it!

    In this chapter, you''ll learn how the Zend Framework can simplify one of the
    most common application development tasks: creating Web forms and processing input.
    You''ll also apply this knowledge to add some interactivity to the SQUARE example
    application, by creating a contact form. So without further, let''s jump right
    in!


    # Understanding Form Basics


    To demonstrate how the Zend Framework can help you with forms, a brief illustrative
    example will suffice. If you are like most PHP developers, chances are you''ve
    written a form-processing script like the one at some point in your career:


