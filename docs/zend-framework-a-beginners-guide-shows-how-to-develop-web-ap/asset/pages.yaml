    # # Accessing Web Services


    In recent years, it’s become almost de rigueur for consumer-facing Web applications
    to expose some or all of their functions and/data for third-party use through
    Web services. Google, Facebook, Twitter, Technorati, and Flickr are some of the
    many hundreds of thousands of Web applications that today allow such access to
    their inn. As an application developer, it’s quite likely that you’ll find yourself
    integrating these Web services into your application, or creating your own Web
    services for others to access and consume.


    The Zend Framework comes with implementations for many common Web services (including
    all the ones mentioned in the previous paragraph, and a few more besides). It
    also offers generic SOAP and REST clients for accessing SOAP- and REST-based Web
    services. The following sections examine these components in greater detail.


    # ## Understanding Web Services


    Think of a Web service as a “remote API,” which allows a client to request an
    action or perform a query on a remote server. The nature of the request can vary;
    common examples'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Zend Framework: A Beginner’s Guide


    including looking up and returning a database record that matches a particular
    identifier, verifying a credit card number, or retrieving the latitude and longitude
    corresponding to a specific code. The server will receive the request, perform
    the necessary query or action, and return the result to the requesting client
    in a structured format.


    Web services may be based on either the Simple Object Access Protocol (SOAP) or
    Representational State Transfer (REST) architecture. In both cases, clients transmit
    requests and receive responses over HTTP. The key difference lies in how these
    requests and responses are encoded. With SOAP-based services, request messages
    are typically encoded in XML envelopes and transmitted to the server in simple
    XML packaging. REST-based services, requests, and responses are not encoded in
    XML, and the HTTP method used to transmit requests from client to server (whether
    GET, POST, PUT, or DELETE) play an active role in determining the service action
    and response.


    Because the REST model uses existing HTTP verbs, such as GET (get data), POST
    (create data), PUT (update data), and DELETE (remove data) to communicate intent,
    it is generally considered easier and simpler to implement than the SOAP model.
    To better appreciate, consider Figure 10-3, which illustrates the difference between
    SOAP and REST request response packets.


    In you''ve ever asked a question at a party or for a response within earshot,
    here are a few key points of difference between the SOAP and REST approaches:


    +   SOAP makes extensive use of XML for request and response encoding, and it
    uses data typing to ensure the integrity of the data being passed between client
    and server. REST requests and responses, on the other hand, can be transmitted
    in ASCII, XML, JSON, or any other format that is understandable by both client
    and server. Additionally, the REST model also has no built-in data typing requirements.
    As a result, REST requests and response packets are typically much smaller than
    the corresponding SOAP packets.


    +   Under the SOAP model, the HTTP transport layer is mostly a passive spectator,
    with the role limited to the transmission of SOAP requests from client to server
    using the POST method. The details of the service request, such as the procedure
    name and input arguments, are encoded in the request body. REST architecture,
    on the other hand, treats the HTTP transport layer as an active participant in
    the transaction, making use of existing HTTP "verbs" such as GET, POST, PUT, and
    DELETE to indicate the type of service required. From a development perspective,
    REST requests are generally easier to formulate and understand, to piggyback on
    existing, well-understood HTTP interfaces.


    +   The SOAP model supports some degree of introspection, allowing service developers
    to describe the API in a Web Service Description Language (WSDL) file. These files
    are reasonably complex to create; however, the effort is often worth it, because
    SOAP clients can then obtain detailed information on method names and signatures,
    input and output data types, and return values through this WSDL file.'
