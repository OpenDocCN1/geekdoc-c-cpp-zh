  md: "# Zend Framework: A Beginner’s Guide\n\n# Ask the Expert\n\n**Q:** Should translation\
    \ keys be lowercase?\n\n**A:** There is no convention that requires you to only\
    \ use lowercase for translation keys. Doing so would mean that you would need\
    \ to wrap `translate()` calls within application views in calls to `strtoupper()`\
    \ and/or `ucfirst()`, which is a tedious exercise. Additionally, different languages\
    \ might need demand capitalizations of the same word, and applying case transformations\
    \ within application views would not permit this. Finally, if `Zend_Translate`\
    \ is unable to find a translation source for the selected language, it will fall\
    \ back to displaying the keys themselves. Therefore, limiting translation keys\
    \ to lowercase is usually undesirable. You should, however, ensure that your translation\
    \ keys are named correctly, so that they serve as a viable fallback option for\
    \ `Zend_Translate`.\n\n# Supporting Manual Locale Selection\n\nNow, while locale\
    \ autodetection is fine and dandy, you may also want users to be able to manually\
    \ select their desired language and locale. More than often, this feature is implemented\
    \ in the application user interface as a string of clickable flag icons; clicking\
    \ one of these icons switches the application to the corresponding language.\n\
    \nTo add this feature, define a new LocaleController in the application’s “default”\
    \ module, which will be responsible for manually setting the locale to selected\
    \ by the user, and fill it with the following code:\n\n```\n<?php\nclass LocaleController\
    \ extends Zend_Controller_Action\n{\n    // to manually override locale\n    public\
    \ function indexAction()\n    {\n        // if supported locale, add to session\n\
    \nif (Zend_Validate::is(\n            $this->getRequest()->getParam('locale'),\
    \ 'InArray',\n            array('haystack') => array('en_US', 'en_GB', 'de_DE',\
    \ 'fr_FR'))\n        )) {\n            $session = new Zend_Session_Namespace('square.11on');\n\
    \            $session->locale = $this->getRequest()->getParam('locale');\n   \
    \     }\n\n        // redirect to requesting URL\n        $url = $this->getRequest()->getServer('HTTP_REFERER');\n\
    \        $this->redirect($url);\n    }\n}\n```"
  merge: -1
  pgno: 324
- img_proc: true
  md: "# Chapter 9: Understanding Application Localization\n\nSave this file as $APP_DIR/application/default/controllers/LocaleController.php.\n\
    When the LocaleController::indexAction is invoked, it first retrieves the URL\
    \ of the referring script and stores this in a local variable. It looks up the\
    \ URL request for $_GET['locale'] parameter, checks if the requested locale is\
    \ supported, and if it is, stores this in the session. Finally, it redirects the\
    \ client back to the referring script.\nThis is only part of the puzzle, though.\
    \ It's also necessary to update the application bootstrap and modify the `initLocale()`\
    \ method to check if a locale is present in the session, and if it is, give this\
    \ locale priority over the autodetected locale.\nHere's the revised `initLocale()`\
    \ method:\n\n```\n<?php\nclass Bootstrap extends Zend_Application_Bootstrap_Bootstrap\
    \ {\n    protected function initLocale() {\n        $session = new Zend_Session_Namespace('square.l10n');\n\
    \        if ($session->locale) {\n            $locale = new Zend_Locale($session->locale);\n\
    \        }\n\n        if ($locale === null) {\n            try {\n           \
    \     $locale = new Zend_Locale('browser');\n            } catch (Zend_Locale_Exception\
    \ $e) {\n                $locale = new Zend_Locale('en_GB');\n            }\n\
    \        }\n\n        $registry = ZendRegistry::getInstance();\n        $registry->set('Zend_Locale',\
    \ $locale);\n    }\n}\n```\n\n# Updating the Master Layout\nThe final step is\
    \ to add the string of icons to the application's main menu, and link it to the\
    \ LocaleController::indexAction. To do this, update the master layout, at $APP_DIR/application/layouts/master.php,\
    \ with the changes highlighted below:\n\n```\n<!DOCTYPE html PUBLIC \"//W3C//DTD\
    \ HTML 1.0 Strict//EN\" \n\"http://www.w3.org/TR/DTD/html1-strict.dtd\">\n<html\
    \ xmlns=\"http://www.w3.org/1999/xhtml\" xml:lang=\"en\" lang=\"en\">\n\n...\n\
    \    <div id=\"menu-locale-container\">\n        <div id=\"locale\">\n       \
    \     <a href=\"<?php echo $this->url(array('module' => 'default',\n         \
    \       'controller' => 'locale', 'action' => 'index',\n                'locale'\
    \ => 'en_GB'), 'default', true);?>\"></a>\n(continued)\n```"
