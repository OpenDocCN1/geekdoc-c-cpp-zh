  md: "# Chapter 5: Handling CRUD Operations 165\n\n# Defining the Login Action and\
    \ View\n\nWith most of the hard work delegated to the authentication adapter,\
    \ creating the LoginController::loginAction becomes a piece of cake. Here's the\
    \ code, by which convention should be saved as $APP_DIR/application/default/controllers/LoginController.php:\n\
    \n```\n<php\nclass LoginController extends Zend_Controller_Action\n{\n    public\
    \ function init()\n    {\n        $this->helper->layout->setLayout('admin');\n\
    \    }\n\n    // login action\n    public function loginAction()\n    {\n    \
    \    $form = new Square_Form_Login;\n        $this->view->form = $form;\n    \
    \    // check for valid input\n        // authenticate user record to session\n\
    \        // redirect to original URL if present\n        if ($this->getRequest()->isPost())\
    \ {\n            if ($form->isValid($this->getRequest()->get())) {\n         \
    \       $values = $form->getValues();\n                $adapter = new Square_Auth_Adapter_Doctrine(\n\
    \                    $values['username'], $values['password']\n              \
    \  );\n                $auth = Zend_Auth::getInstance();\n                $result\
    \ = $auth->authenticate($adapter);\n                if ($result->isValid()) {\n\
    \                    $session = new Zend_Session('auth.auth');\n             \
    \       $session->user = $adapter->getResultArray('Password');\n             \
    \       if (isset($session->requestURL)) {\n                        $url = $session->requestURL;\n\
    \                        unset($session->requestURL);\n                      \
    \  $this->redirect($url);\n                    } else {\n                    \
    \    $this->helper->getHelper('FlashMessenger')\n                            ->addMessage('You\
    \ were successfully logged in.');\n                        $this->redirect('/admin/login/success');\n\
    \                    }\n                }\n            } else {\n            \
    \    $this->view->message = \n                    'You could not be logged in.\
    \ Please try again.';\n            }\n        }\n    }\nn}\n```\n\n(continued)"
