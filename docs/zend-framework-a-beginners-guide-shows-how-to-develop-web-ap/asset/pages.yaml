    \ contrast, the exception-based approach is more flexible. A generic exception\
    \ handler works like a safety net, catching and handling even errors for which\
    \ no specific handling code has been written. This only helps to make application\
    \ code more robust and resilient to unforeseen situations.\n\n+   - Because the\
    \ exception model used an object-based approach, developers can use OOP concepts\
    \ of inheritance and extensibility to subclass the base object and create"
