    and manually approve suitable ones for display in search results. Moderators would
    also have access to a simple content management system for news and press releases;
    this information be accessible both via the Web site and as an RSS feed. And just
    to make things interesting, the stamp database would also be available via a SOAP
    interface, to facilitate integration with third-party applications.


    Sounds funky? It is and even has a cool name: the Stamp Query and Research Engine,
    as friends like to call it, SQUARE. The SQUARE example application is conceived
    that it covers many requirements encountered in day-to-day development: static
    pages, input forms, image upload, login-protected administration panel, data paging
    and sorting, multiple output types, and keyword search. Implementing these features
    requires one to understand the nifty-gritties of database processing, input validation,
    session management, authentication and security, CRUD database operations, Web
    service APIs, and integration with third-party libraries. As such, it should be
    a good starting point to begin application development with the Zend Framework.


    # Create the Application Directory


    Let''s get started. Change to the Web server''s document root directory (typically
    /usr/local/apache/htdocs on UNIX/Linux or C:\Program Files\Apache\htdocs on Windows)
    and create a new subdirectory for your application. For reasons that have been
    explained in the preceding section, make this directory square/


    ```

    shell cd /usr/local/apache/htdocs

    shell mkdir square

    ```


    This directory will be referenced throughout this book as $APP_DIR.


    # Create the Application Skeleton


    The next step is to initialize the application and create the basic files and
    directories for a skeletal Zend Framework application. The zf command-line script
    can do this for you—simply change to $APP_DIR and run the following command (see
    Figure 1-4):


    ```

    shell cd /usr/local/apache/htdocs/square

    shell zf create project.

    ```


    (continued)'
