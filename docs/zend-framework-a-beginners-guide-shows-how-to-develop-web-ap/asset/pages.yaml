  md: "# 368 Zend Framework: A Beginner’s Guide\n\n# Try This 11-2 Adding a Dojo Autocomplete\
    \ Widget\n\nNow that you know what Zend_Dojo component can do, let's try using\
    \ it for something practical: adding an autocomplete input to a Zend Form instance.\
    \ This is a reasonably common requirement, and the following sections will walk\
    \ you through the process.\n\nFor this example, assume that the autocomplete input\
    \ is to be attached to the application’s contact form, which will “suggest” a\
    \ list of counters based on the user’s input. The first step, is to update the\
    \ Square_Form_Contact object to extend Zend_Dojo_Form instead of Zend_Form, as\
    \ discussed in the previous section, and to add a Dijit ComboBox element to it.\n\
    \n```\n<php\nclass Square_Form_Contact extends Zend_Dojo_Form {\n    public function\
    \ init() {\n        // initialize form\n        $this->setAction('/contact')\n\
    \            ->setMethod('post');\n\n        // create text input for name\n \
    \       ...\n\n        // create text input for email address\n        ...\n\n\
    \        // create autocomplete input for country\n        $country = new Zend_Dojo_Form_Element_ComboBox('country');\n\
    \        $country->setLabel('contact-country')\n            ->setOptions(array(\n\
    \                'autocomplete' => true,\n                'storeId' => 'countryStore',\n\
    \                'storeType' => 'dojo.data.ItemFileStore',\n                'storeParams'\
    \ => array('url' => \"/data/contact/autocomplete\",\n                'dijitParams'\
    \ => array('searchAttr' => 'name'))\n            ))\n            ->setRequired(true)\n\
    \            ->addValidator('NotEmpty', true)\n            ->addFilter('HTMLEntities')\n\
    \            ->addFilter('StringToLower', true)\n            ->addFilter('StringTrim');\n\
    \n        // create text input for message body\n        ...\n    }\n```"
  merge: -1
  pgno: 386
