  md: '# Chapter 2: Working with Models, Views, Controllers, and Routes 25


    Modules provide a way to accomplish this. So, for example, if your application
    includes functions for search, user profile management, and news, you could create
    separate "search," "profile," and "news" modules, and place the corresponding
    models, views, and controllers for each in these modules.


    Modules provide convenient way to organize application code, or a way to build-party
    application components that can easily be plugged in to an existing installation.
    The Zend Framework''s default router is fully module-aware, allowing you to begin
    using modules in your application without any custom programming, and each module
    (except the "default" module) also has its own namespace to prevent object and
    variable collisions.


    # Routes


    Routes provide the link between user requests and actions. When a user makes a
    request for an application URL, the front controller intercepts that and decides,
    based on the URL pattern, which controller and action should be invoked to fulfill
    the request. This process of routing requests to controllers is a key part of
    the application execution flow, and is capable of extensive configuration. Routes
    make use of regular expressions for pattern matching, and can be expressed using
    either XML or INI file.


    By default, the Zend Framework includes some standard routes that are suitable
    for applications of small complexity. These standard routes assume that application
    URLs are of the form /module/controller/action, and divert user requests accordingly.
    So, for example, a request at http://application/auto/listing/index would be automatically
    mapped to ListingController::indexAction in the "auto" module. Notice that controller
    and action names follow a specific and naming convention.


    NOTE


    The Zend Framework''s routing subsystem automatically applies default values to
    routes that don''t conform to the /module/controller/action format. A detailed
    discussion of these default values, and their impact on how request URLs are mapped
    to controllers and actions, can be found in the section titled "Understanding
    Component Interaction.


    In case the standard routes in the previous paragraph are too limiting or inflexible
    for the demands of your application, the Zend Framework also supports custom,
    user-defined routes. These routes support (among other things) optional and mandatory
    parameters, default values, and multiple chained routes, and they allow you to
    micromanage your application''s routing so that application URLs need not directly
    reflect your internal classification of controllers, actions, and modules.


    # Layouts


    In the classical sense, a layout is a definition of how a collection of elements
    is arranged. In the context of the Zend Framework application, layouts can be
    thought of as interface templates, providing a way to "decorate" application content
    using one or more standard application-wide interfaces. Layouts provide a way
    to abstract common interface elements, as'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'headers and footers or site-wide navigation widgets, into separate files that
    can be edited and maintained independent of individual views.


    It''s quite common for an application to have more than one layout. For example,
    you might wish to present one interface to users and another to administrators,
    or you might allow users to customize their experience of the application by selecting
    from a set of predefined interface themes. Layouts make this, and elating options,
    reasonably easy to implement.


    NOTE

    Y''ll begin working with modules, custom routes, and layouts later in this chapter.


    # Understanding Component Interaction


    If you think of a Zend Framework application like a circus (and the analogy is
    often more than a little), then the controller is the ringmaster, whipping the
    acts into shape and making sure the audience is satisfied. This section examines
    its role in more detail, illustrating in the context of the steps that go into
    intercepting and satisfying a request for an application


    Figure 2-1 illustrates the flow of a request through a typical Zend Framework
    application.


    ![](img/222e7e58871b088cc6397852e1452b57_44_0.png)


