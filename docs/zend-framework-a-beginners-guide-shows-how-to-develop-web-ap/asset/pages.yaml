    There are four basic steps to be followed when supporting a new output type with
    the ContextSwitch helper:


    +   1. Define the context parameters. The ContextSwitch helper comes with an addContext()
    method that can be used to define a new context. This addContext() method accepts
    two arguments: a string holding the name of the new output type, and an array
    containing additional configuration information, such as the headers to be sent
    to the requesting client and the filename suffix to look for in view scripts.
    In the previous example, the addContext() method specifies a view suffix of .yaml
    and a ''Content-Type'' header of text/yaml.


    > NOTEnThis step can be omitted when working with the predefined XML and JSON
    contexts.


    +   2. Link the context with one or more actions. Once the output type has been
    defined, the ContextSwitch helper''s addActionContext() method can be used to
    map it to one or more actions. In the previous example, the addActionContext()
    method specifies that the listAction() can also return in YAML format.


    > TIPnIf you have a number of different contexts and actions to deal with, consider
    using the addActionContexts() method, which accepts an array of context-action
    pairs and serves as a convenient shortcut to multiple contexts and actions in
    a single method call.


    +   3. Create a view script for the context. The next step is to create a view
    script for each action and context. By default, this view script is named with
    the suffix specified in the addContext() method, and it contains all the formatting
    codes, markup, and business logic needed to generate output in the specified format.
    To illustrate, in the previous example, the view script list.yaml.shtml would
    be responsible for generating a YAML view of the listAction() method''s output.
    Similarly, if the required output type was XLS, the view script would be named
    list.xls.shtml, and it would contain the PHP code necessary to generate spreadsheets
    in Microsoft Excel format.'
