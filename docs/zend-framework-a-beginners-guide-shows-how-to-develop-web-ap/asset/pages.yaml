  md: 'Zend Framework: A Beginner’s Guide


    # Creating the Navigation Action Helper


    Zend Framework action helpers are generally perceived as complex and hard to understand.
    In reality, this couldn''t be further from the truth. Action helpers exist as
    a substitute for base controllers; they provide a way for developers to program
    common functionality into "helper objects" that can be loaded and used at run
    time from any action controller.


    Action helpers are typically registered using a helper broker, which exposes addHelper()
    and removeHelper() methods to immediately load and unload helpers from the helper
    stack. This is particularly important for helpers that are referenced in preDispatch()
    or postDispatch() methods. An alternative is to use the broker’s addPath() or
    addPrefix() method to map the helper path; information then can be used to use
    the helper on demand.


    Once they''ve been loaded, helpers can be retrieved using the helper broker’s
    getHelper() method, which returns the helper object. This helper is available
    for use in all action controllers via the controller object’s _helper property,
    making it possible to load helpers within the application bootstrap or as needed
    specific controllers.


    # TIP


    You might not have known it in time, but you''ve already seen and used some of
    the Zend Framework’s built-in action helpers in previous chapters. The ContextSwitch
    helper in Chapter 6 and the FlashMessenger helper in Chapter 3 are both examples
    of built-in action helpers, accessed from within using the helper broker’s getHelper()
    method.


    Table 11-1 provides a complete list of the action helpers that are included in
    the Zend Framework.


    With background information out of the way, let’s return to the task at hand:
    creating a custom action helper that will automatically check the current request
    URL, match it against the navigation controller, and flag the current active page.
    To do this, create a new action helper at $APP_DIR/library/Square/Controller/Action/Helper/Navigation.php,
    and fill it with the following code:


    | Action Helper | Description |

    |---|---|n| ActionStack | Queues multiple actions for execution |

    | ContextSwitch | Enables output in different formats |

    | FlashMessenger | Stores messages for retrieval on next request |

    | Autocomplete | Formats and sends JSON/HTML arrays of data for autocomplete inputs
    |

    | JSON | Enables output in JSON format |

    | Redirector | Handles client redirection |

    | ViewRenderer | Registers view scripts and handles view script rendering |


    Table 11-1 Action Helpers Included with the Zend Framework'
