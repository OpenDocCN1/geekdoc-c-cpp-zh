  md: "# Chapter 7: Paging, Sorting, and Uploading Data\n\nimage files in JPEG, GIF,\
    \ or PNG format, each over 2MB in size and each with dimensions of 150×150 pixels.\
    \ It's also a good idea to rename uploaded images to conform to a standard naming\
    \ format before saving them to disk, and this is handled by the Rename filter\
    \ (discussed in the next section).\n\n# Updating the Create Action\n\nThe next\
    \ step is to update the CatalogItemController::createAction to receive the uploaded\
    \ images, rename them to conform to a standard format, and save them to disk.\
    \ To accomplish this, revise the code at $APP_DIR/application/modules/catalog/ItemController.php,\
    \ with the changes highlighted below:\n\n```\n<?php\nclass CatalogItemController\
    \ extends Controller_Action\n{\n    public function createAction()\n    {\n  \
    \      // generate input form\n        $form = new Square_Item_form;\n       \
    \ $this->view->form = $form;\n\n        // test for valid input\n        // if\
    \ valid, populate model\n        // assign default values for some fields\n  \
    \      // save to database\n        if ($this->getRequest()->isPost()) {\n   \
    \         if ($this->getRequest()->isValid($this->getRequest()->getPost())) {\n\
    \                $item = new Square_Model_Item;\n                $item->fromArray($form->getValues());\n\
    \                $item->recordDate = date('Y-m-d', mktime());\n              \
    \  $item->displayStatus = 0;\n                $item->displayUntil = null;\n  \
    \              $item->save();\n                $id = $item->getRecordArg('bootstrap')->getOption('uploads');\n\
    \                $config = $this->images->getConfig($config['uploadPath']);\n\
    \                $adapter = $this->images->getTransferAdapter();\n           \
    \     for ($x=0; $x<$config->getFiles(); $x++) {\n                    $xt = pathinfo($adapter->getFileName('images_'.$x.'.xt'),\
    \ PATHINFO_EXTENSION);\n                    $adapter->clearFilters();\n      \
    \              $adapter->addFilter('Rename', array(\n                        'target'\
    \ => sprintf('%d_%s', $id, ($x+1)),\n                        'overwrite' => true\n\
    \                    ));\n                }\n                $adapter->receive('images_'.$x.'._');\n\
    \            }\n        }\n    }\n}\n```\n\n(continued)"
