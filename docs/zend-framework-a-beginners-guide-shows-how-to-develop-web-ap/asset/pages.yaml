- img_proc: true
  md: '# Zend Framework: A Beginner’s Guide


    Fowler, James Buck, and Chris Hartjes (you’ll find links at the end of this chapter),
    which proposes business logic should be located within models, rather than controllers,
    wherever possible. This approach offers a number of benefits:


    +   * “Fat” models reduction and help developers adhere to the Don''t Repeat Yourself
    (DRY) method by encapsulating key business rules into reusable objects and object
    methods. Inheritance chains can then be used to apply these rules consistently
    across the application. Specifying models using OOP principles also makes it possible
    to extend base models with additional functionality as needed, and to make a distinction
    between public and private attributes within the larger application space.


    +   * Self-contained “fat” models that encapsulate all the business rules necessary
    for their proper functioning are more portable than “thin” models that rely on
    application controllers to enforce business rules. Since most of the application’s
    business logic is in the model, rather than the controller, switching to a different
    framework, for example, becomes easier, as the model can be swapped in to the
    new system and will work usually without significant retrofitting.


    +   * When “fat” models handle most of the heavy lifting, controllers typically
    end up containing only a few lines of highly focused code. These makes them easier
    to understand and read, and contributes to better overall performance (because
    controllers are typically invoked more than models). It also produces more maintainable
    code: For example, if you need to change business rules for a particular application
    entity, you only need to update the model for that entity, not for all the controllers
    that use it.


    +   * Debugging and testing become more transparent than the “fat model, skinny
    controller” approach, because it’s usually easy to identify whether the model
    or the controller is the source of an error, and to correct it with minimal impact
    on the rest of the application.


    It’s important to note, at this point, that the Zend Framework does not come with
    a Zend_Model component, or a set of predefined models, that you can “drop in”
    to your


    # Ask the Expert


    Q: Is a “model” simply a set of packaged SQL statements?


    A: No, definitely not. It’s a common misconception that models are simply object
    representations of database tables, with methods corresponding to the SQL INSERT,
    UPDATE, and DELETE statements. In reality, models are much more than Structured
    Query Language (SQL) wrappers. They can (and should) enforce application-specific
    business rules, perform calculations, handle conversions, apply filters, and perform
    any required operations on data. Remember, your models, the less work for your
    controllers, and the more maintainable and portable your application.'
