    SELECT m.id, m.name FROM movie m, director AS d

    WHERE d.id = m.director AND d.name = ''Alfred Hitchcock'';

    ```


    You can also inert queries through creative use of MySQL’s ORDER BY and LIMIT
    clauses. Consider the following subquery:


    ```

    SELECT id, duration FROM movie

    WHERE duration =

    (SELECT MAX(duration) FROM movie);

    ```


    This works better than the query, which is simpler to read and also runs much
    faster:


    ```

    SELECT id, duration FROM movie

    ORDER BY duration DESC

    LIMIT 0, 1;

    ```


    # Use Temporary Tables for Transient Data or Calculations


    MySQL also lets you create temporary tables with the CREATE TEMPORARY TABLE command.
    These tables are so-called because they remain in existence only for the duration
    of a single MySQL session and are automatically deleted when the client instantiates
    its connection with the MySQL server. These tables are handy for transient, session-based
    data calculations, or for the temporary storage of data. And they’re session-dependent,
    two sessions can use the same table name without conflicting.


    Since temporary tables are stored in memory, they are significantly faster than
    disk-based tables. They can be effectively used as intermediate storage areas,
    to speed up query execution by helping to break up complex queries into simpler
    components, or as a substitute forquery and join support.


    MySQL’s INSERT...SELECT syntax, together with its IGNORE keyword and for temporary
    tables, provides numerous opportunities for creative rewriting of SELECT queries
    to have them execute. For example, if you have a complex query that involves selecting
    a set of distinct values from a particular field, and the MySQL engine is unable
    to optimize your query because of its complexity. SQL programmers can improve
    performance by breaking down the single complex query into numerous simple queries
    (which lend themselves better to optimization) and then using the INSERT IGNORE...SELECT'
