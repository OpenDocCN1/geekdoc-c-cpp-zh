  md: '# 124 Zend Framework: A Beginner''s Guide


    In this example, the displayAction() method retrieves the value of the input variable
    $GET[''id''], and interpolates this value into a Doctrine query that attempts
    to find a matching record in the database. If the query returns a single record
    as the result, this is assigned to the view as an associative array. If no matches,
    or multiple matches, are found, a 404 exception is raised and propagated forward
    to the default exception handler, which formats it into a readable error page
    and displays it to the client.


    This listing introduces a new component, the Zend_Filter_Input component. This
    component, as name suggests, provides an alternative approach to filtering and
    validating input, and is very useful in scenarios where the user''s input not
    come through a form (as in this example, where the record ID is identified as
    a URL request parameter). All of the filters and validators used in Chapter 3
    can also be used with Zend_Filter_Input.


    How does it work? The Zend_Filter_Input class accepts three arguments—an array
    of filters, an array of validators, and an array of input data to be tested—and
    runs the first and second of these. You can also specify each separately using
    the setData() method. In the previous listing, for example, the $GET[''id''] variable
    is first filtered using the HTMLEntities, StripTags, and StringTrim filters, to
    make sure it is an integer. With Zend_Form, there is an isValid() method, which
    returns Boolean true or false depending on whether or not the data is valid; this
    can be used as a conditional wrapper around the action''s business logic.


