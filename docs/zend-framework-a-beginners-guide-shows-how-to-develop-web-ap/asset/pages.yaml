    \ all the defined contexts and gets the ball rolling. You can attach the special\
    \ `?format=context-name` parameter to the action's URL to include the required\
    \ output type to the ContextSwitch helper—for example, `?format=yaml` for YAML\
    \ output or `?format=xls` for XLS output.\n\n# Try This 6-3 Expressing Search\
