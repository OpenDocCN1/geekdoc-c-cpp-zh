    REST model, on the other hand, eschews WSDL-level complexity in favor of a simpler,
    more intuitive interface based on standard HTTP methods, as described earlier.


    +   REST revolves around the concept of resources, while SOAP interfaces based
    on objects and methods. A SOAP interface can have a potentially unlimited number
    of methods; however, a REST interface is limited to four possible operations,
    corresponding to the four HTTP "verbs."


    # Consuming Web Services


    The Zend Framework includes generic clients for REST- and SOAP-based Web services,
    as well as a number of service-specific client implementations that can be used
    to directly communicate with popular Web services. The following sections examine
    these aspects in greater detail.


    # Using Service-Specific Client Implementations


    The Zend Framework includes a number of preconfigured clients for popular Web
    services, as those exposed by Google, Amazon, Flickr, Technorati, and others.
    Using these service-specific client implementations can reduce the time and effort
    involved in integrating data from these services into a Web application. In most
    cases, these implementations provide an object-oriented API, with service responses
    returned as native PHP objects or arrays.


    Table 10-1 lists the service-specific implementations currently included in the
    Zend Framework.

    While a complete description of each of these implementations is not possible
    within the limited confines of this chapter, a few examples will be illustrative.
    Consider the following


    # Ask the Expert


    Q: If I’m building a Web service, should I use: SOAP or REST?


    A: With all questions of this sort, the answer really depends on your requirements
    and goals. For transactional or e-commerce services, or in situations where the
    service is part of a larger, distributed platform, SOAP’s strict data typing and
    formal service description often make it a better choice than REST. On the other
    hand, if your goal is simply to enable quick-and-direct access to your application’s
    demands, with ease of use and flexibility as your key, REST is probably a better
    option. That said, it’s worth noting that the REST approach is gradually overtaking
    the SOAP approach in popularity, both because it cleverly leverages existing technologies
    and because it is significantly simpler to use and understand.'
