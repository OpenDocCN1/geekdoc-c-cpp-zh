  md: "# 278 Zend Framework: A Beginner’s Guide\n\n```\npublic function numberAction()\n\
    {\n    // localize number\n    // result: '195,740.676'\n    $this->view->message\
    \ = Zend_Locale_Format::toNumber(195740.676, array('locale' => 'en_GB'));\n```\n\
    \n```\n// result: '195,740.676'\n$this->view->message = Zend_Locale_Format::toNumber(\n\
    \    195740.676, array('locale' => 'en_GB');\n);\n```\n\nIt is worth noting out\
    \ that, unlike Zend_Date and Zend_Currency, Zend_Locale_Format cannot directly\
    \ retrieve the application locale from the registry. It is therefore mandatory\
    \ to pass a locale identifier to the toNumber() method as an argument.\nIt is\
    \ also possible to customize the output by specifying a custom format and precision.\
    \ These options can be passed to the toNumber() method in the options array. Here\
    \ are some examples:\n\n```\n<?php\nclass SandboxExampleController extends Zend_Controller_Action\n\
    {\n    public function numberAction()\n{\n    // use custom number format\n  \
    \  // result: '1,95,740.67'\n    $this->view->message = Zend_Locale_Format::toNumber(195740.676,\
    \ array(\n        'locale' => 'en_GB',\n        'number_format' => '##,##.00'\n\
    \    ));\n}\n}\n```\n\nThe other method in the Zend_Locale_Format component is\
    \ the static convertNumer() method, which makes possible to convert numbers between\
    \ Arabic and Latin scripts. This requires that PHP’s PCRE engine be compiled with\
    \ UTF-8 support (Windows PHP installations often lack this). Here is an example\
    \ of it action:\n\n```\n<?php\nclass SandboxExampleController extends Zend_Controller_Action\n\
    {\n    public function numberAction()\n{\n    // convert numeric scripts\n   \
    \ $this->view->message = Zend_Locale_Format::convertNumerals('1956', 'Latn', 'Thai');\n\
    \    $this->view->message =\n```"
