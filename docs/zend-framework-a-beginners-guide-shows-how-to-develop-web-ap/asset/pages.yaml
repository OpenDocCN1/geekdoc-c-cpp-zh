  md: '# Chapter 2: Working with Models, Views, Controllers, and Routes 39


    # Ask the Expert


    **Q: Why are layouts stored at the global level and not the module level?


    **A: With Web applications, it''s quite common for views in different modules
    to share the same layout. Therefore, the Zend Framework''s default directory layout
    suggests placing layouts at the global, or by application, level under `$APP_DIR/application/layouts/`,
    rather than the `$APP_DIR/application/modules/` hierarchy.


    That is, if your application is structured such that each module uses a different
    layout, you could relocate your layout files to the module level, and write a
    custom plug-in that dynamically changes the layout based on the module accessed.
    You''ll find a more detailed discussion of how to do this in the links at the
    end of this chapter.


    # Try This 2-2 Serving Static Content


    In previous sections, your activities have been limited to modifying the application''s
    existing controllers and views. However, as development progresses, you will find
    it necessary to begin creating controllers, actions, and views to encapsulate
    additional functionality. It shouldn''t be cause for alarm, because there''s a
    standard process you can follow whenever you need to add new functionality to
    a Zend Framework application.


    These steps are illustrated in the following sections, which will guide you through
    the process of adding a `StaticContentController` and associated views that will
    be responsible for serving up static content pages like "About Us" and "Services"
    pages.


    # Defining Custom Routes


    The first step is to define a base route for static content pages. We''ll assume
    that all static content page URLs are of the form `/content/xx`


    ```

    resources.router.routes.static-content.route = /content/:page

    resources.router.routes.static-content.defaults.module = default

    resources.router.routes.static-content.defaults.controller = static-content

    resources.router.routes.static-content.defaults.action = display

    ```


    This route is a little more complex than the one you saw earlier, because it contains
    a variable placeholder. The Zend Framework supports the use of variable placeholders,
    indicated by a preceding colon, in route patterns, and will automatically convert
    that request


