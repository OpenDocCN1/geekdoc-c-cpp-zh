    # Try This 8-2 Logging Application Exceptions


    Let’s now put all of this information in a practical context by updating the SQUARE
    application with a full-fledged exception-logging system, one that logs exception
    data to the file, the database, and the Firefox console. As you will see, this
    is actually quite simple and can be accomplished relatively easily. The following
    sections will guide you through the process.


    > **NOTE**nThe following sections includes a discussion of how to log exception
    data to Firefox, the Firefox browser debugger. It assumes that you have a working
    installation of the Firefox browser, together with the Firefox and FirePHP extensions.
    In case you don’t already have these components, you can download them from the
    Web using the links at the end of the chapter.


    # Defining the Log Location


    The first step is to define a location for the file-based log. So, create the
    $APP_DIR/data/logs/ directory, which is the default location for log files under
    the Zend Framework’s recommended layout.


    ```

    shell cd /usr/local/apache/htdocs/square/data

    shell mkdir logs (continued)

    ```'
