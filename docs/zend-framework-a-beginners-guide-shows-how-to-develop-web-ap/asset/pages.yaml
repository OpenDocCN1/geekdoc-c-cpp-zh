    ```\n\nThe CAPTCHA element automatically generates a CAPTCHA verification input,\
    \ which is a useful tool to filter out automated form submissions. More and more\
    \ web sites are using CAPTCHAs to reduce the number of false registrations and/or\
    \ spam messages received through online lines. Although manually generating and\
    \ verifying a CAPTCHA is a tedious process, the Zend_Form_Element_Captcha makes\
    \ it as simple as adding a few lines of code to your form. Here's an example:\n\
    \n```\n<?php\nclass Form_Example extends Zend_Form\n{\n    public function init()\n\
    \    {\n        // initialize form\n        $this->setAction('/sandbox/example/form')\n\
    \            ->setMethod('post');\n\n        // create text input for user name\n\
    \        $name = new Zend_Form_Element_Text('username');\n        $name->setLabel('Username:')\n\
    \            ->setOptions(array('size' => '16'));\n    }\n}\n```\n\n# What is\
    \ the Expert, and how do I protect against it?\n\n**Q:** What is a CSRF attack,\n\
    \n**A:** Typically, a user visits a protected Web site and validates his/her access\
    \ credentials, a user session is generated and the access credentials are validated\
    \ from the session data on each request. A CSRF attack involves hijacking a validated\
    \ user session and using the implicit trust relationship that already exists between\
    \ the user and the host application to invisibly transmit unauthorized requests\
    \ through input sources as Web forms. By generating a unique hash value for each\
    \ form and validating when the form is submitted, a developer is able to make\
    \ it harder to perform this type of attack. Using a hash value also provides (limited)\
    \ protection from automated spam mailers (“spambots”), and is more user-friendly\
    \ than a CAPTCHA."
