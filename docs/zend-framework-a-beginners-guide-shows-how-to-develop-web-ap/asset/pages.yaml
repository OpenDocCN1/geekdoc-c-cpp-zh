    Most of the heavy lifting is done by the indexAction() method, which creates an
    object of the Square_Form_Cont class discussed earlier and attaches it to the
    view. When the form is submitted, the object isValid() method is used to validate
    the input submitted by the user. If the input is to be valid, an instance of the
    Zend_Mail component is created, and object methods are used to format the input
    into an email message and send it to a specified email address. Once the message
    has been sent, control is transferred to the successAction() method, which returns
    a success view.

    That''s what if all goes well...but there''s a slip ''twixt the lip, so if the
    input is to be invalid, the isValid() method will return false and the view will
    be reloaded, with error messages indicating the source of the error(s). Zend_Form
    will also populate the form with input values to ensure the user doesn''t need
    to re-enter all the data. On the other hand, if the input is valid but an error
    occurs in the process of email generation and transmission, Zend_Mail will throw
    a PHP exception, which will be caught and handled by the application''s default
    error handler.


    # NOTE


    In order for the Zend_Mail object''s send() method to work correctly, a mail delivery
    agent (such as sendmail) must be available and correctly configured in php.ini
    configuration file. If this is not the case, message transmission will fail and
    the send() will throw an exception at the point of failure.

    This controller also introduces a new tool, the FlashMessenger helper, which is
    a useful little ''helper'' to display the status of messages to user. Messages
    can be added to the FlashMessenger object via its addMessage(); these messages
    are stored in the session until retrieved with a call to the getMessages() method,
    at which they are removed from the session. This makes the FlashMessenger a convenient
    place to temporarily store messages between the time an operation ends and the
    subsequent view rendering, and you''ll see it being used throughout this book.


    # CAUTION


    You''ll notice that the controller''s init() method sets the view''s document
    type to XHTML 1.0 Strict. This is because, by default, Zend_Form doesn''t produce
    well-formed XHTML markup. Setting the document type in this manner forces it to
    do.

