    # Adding Full-Text Search


    When you''re building an application search engine, there are a couple of different
    ways you can go. You can create a filter-based search engine, wherein specific
    criteria entered by the user are used to filter the list of search results, as
    shown in the previous section. Or, you can create a full-text search engine, which
    indexes application content and finds matches on the basis of keywords entered
    by the user. In modern Web applications, a full-text search is often preferred,
    because it''s typically faster and produces more accurate results than a database
    search.


    The Zend Framework comes with a very capable full-text search component, known
    as Zend_Search_Lucene. A PHP-only implementation of the Apache Lucene Project,
    this component can be used both to index various document types (including text,
    HTML, and'
