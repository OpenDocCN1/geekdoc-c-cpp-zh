    policy has made the Zend Framework popular with both corporate and independent
    users. Startups, Fortune 500 companies, independent developers, and PHP hobbyists
    are all fans of the project—as of writing, the Zend Framework has been downloaded
    over 10 million times and there are more than 400 open-source projects that are
