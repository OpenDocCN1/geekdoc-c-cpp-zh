  md: '# Zend Framework: A Beginner’s Guide


    # Working with Administrative Actions


    At this point, one of the key goals of the SQUARE application—allowing sellers
    to directly upload listings of available stamps—has been met. However, these aren''t
    immediately visible in the public domain, because application administrators must
    still manually review uploaded items and approve them for display or remove them
    from the database. And that''s where the SQUARE administration panel comes in.


    The SQUARE administration panel is a section of the application reserved specifically
    for application administrators. It provides an interface for administrators to
    update, view, and delete catalog items, and it''s the perfect place to illustrate
    how the remaining CRUD operations can be implemented. But before you dive into
    the code, it''s a good idea to understand the different ways in which administrative
    actions can be handled in the context of a Zend Framework application. There are
    three aspects to consider here: structure, routing, and layout.


    # Structure


    In a modular application, there are a number of ways in which administrative actions
    can be structured:


    +   Create a single controller in the default module that holds all the administrative
    actions for the application. Under this approach, a single controller would contain
    administrative actions for all the application''s modules (see Figure 5-4). This
    approach is not recommended, except for very small applications, as the single
    controller could quickly grow to a very large size, affecting both performance
    and maintainability.


    +   Create a separate module that holds all the administrative actions for the
    application. This new module would contain individual controllers for the application’s
    administrative actions, with one such controller per module (see Figure 5-5).
    This is a common approach, but it too is not very maintainable, as Figure 5-5
    illustrates, you end up with a single controller that manage the information of
    the multiple controllers within each module. It’s also ideal when building self-contained
    modules, as the actions to each module are not all stored in the same filesystem
    location.


    ![](img/222e7e58871b088cc6397852e1452b57_158_0.png)


    Figure 5-4 Administrative actions in a single controller


    ![](img/222e7e58871b088cc6397852e1452b57_158_1.png)


    Figure 5-5 Administrative controllers in a separate module'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Chapter 5: Handling CRUD Operations


    +   Create a separate controller within each module that holds all the administrative
    actions for that module. Under this approach, each module includes, at minimum,
    two controllers: one for public actions and the other for corresponding administrative
    actions (see Figure 5-6). This approach is recommended for various reasons: it
    makes sense for both logical and physical perspectives, as all the actions for
    a specific module are held in a single filesystem location; it''s easily enough
    to maintain; and it is flexible enough to be adapted to different purposes.


    ![](img/222e7e58871b088cc6397852e1452b57_159_0.png)


    # Routing


    To ensure consistency, it is generally a good idea for administrative routes to
    mimic their public counterparts. So, for example, if the public route is article/edit/5,
    the corresponding administrative route might be of the form /admin/article/edit/5;
    the use of the /admin prefix serves to mark a clear and consistent interface to
    an application''s functionality, while maintaining simplicity. This consistency
    is particularly important if, say, later decide to expose REST or SOAP functionality
    as well.


    Unlike other frameworks, the Zend Framework doesn''t come built-in administrative
    routes. Therefore, it is necessary to manually configure these, by specifying
    them in the application configuration file or by extending the base router to
    become "prefix-aware". An example of the former is shown in the following code;
    look at the end of this list for examples of:


    ```

    resources.router.routes.list.route = /admin/routes/index

    resources.router.routes.list.defaults.module = system

    resources.router.routes.list.defaults.controller = articles

    resources.router.routes.list.defaults.action = list


    resources.router.routes.view.route = /admin/routes/view/:id

    resources.router.routes.view.defaults.module = system

    resources.router.routes.view.defaults.controller = articles

    resources.router.routes.view.defaults.action = display


    resources.router.routes.update.route = /admin/articles/edit/:id

    resources.router.routes.update.defaults.module = system

    resources.router.routes.update.defaults.controller = articles

    resources.router.routes.update.defaults.action = update

    ```


    > Figure 5-6 Administrative controllers within each module'
