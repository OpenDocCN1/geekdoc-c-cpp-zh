  md: '# Chapter 7: Paging, Sorting, and Uploading Data 201


    The interesting thing about pagination is that the program code needed to implement
    this pattern is reasonably standard, and is unlikely to change from project to
    project. This makes it the ideal kind of thing to implement as a reusable component,
    and in fact, most frameworks and database abstraction layers come with a ready-made
    pagination component. For example, the Zend Framework includes a Zend_Pager component,
    which comes with adapters (including one for Zend_DB) for different data sources.
    Similarly, Doctrine comes with a Doctrine_Pager component, which can be used to
    directly process and page queries.


    There isn''t much to choose between segmenting a single data set into smaller
    subsets, and by generating navigation links to move back and forth between the
    different subsets. However, since pagination is most commonly associated with
    database result sets, it usually makes sense to use the pager component that is
    recommended by, or included with, the database abstraction layer. Since this book
    recommends Doctrine for all database access operations, the following discussion
    will focus on the Doctrine_Pager and Doctrine_Query components, illustrating how
    they can be used to page and sort result sets in the context of the SQUARE example
    application.


    # Adding Page Numbers to Routes


    The typical operation of a pagination component is quite simple. The component
    is first configured with the number of items to be displayed per page. It then
    calculates the total number of pages by dividing the number of items present in
    the data set by the number of items requested per page, and then dynamically generates
    a set of navigation links for movement between these pages. Each link contains
    an additional GET parameter (the page number) that the pager controller can use
    to determine which subset of data is being requested.


    To illustrate how this works, open the application configuration file at $APP_DIR/application/config/application.ini
    and update the route for the administrative summary page with an additional parameter,
    as follows:

    resources.router.routes.admin-catalog-index.route =

    /admin/catalog/item/index/:page

    resources.router.routes.admin-catalog-index.defaults.module = catalog

    resources.router.routes.admin-catalog-index.defaults.controller =

    admin.item

    resources.router.routes.admin-catalog-index.defaults.action = index

    resources.router.routes.admin-catalog-index.defaults.page = 1


