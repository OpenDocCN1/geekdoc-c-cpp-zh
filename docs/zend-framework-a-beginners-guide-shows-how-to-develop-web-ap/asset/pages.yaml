    >\n    <div id=\"logo\">\n      <img src=\"images/logo-admin.gif\" />\n    </div>\n\
    \  </div>\n  </div></div>\n  <div id=\"menu\">\n    <?php if (Zend_Auth::hasIdentity()):\
