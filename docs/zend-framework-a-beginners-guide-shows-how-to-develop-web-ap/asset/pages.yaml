  md: '# 74 Zend Framework: A Beginner''s Guide


    It shouldn’t be too hard to guess what happens next. The application will perform
    a few internal calculations that will end in it attempt to divide the total amount
    payable by the specified term. Since the term in this case is a string, PHP will
    cast it to the number 0, producing a divisionby-zero error. The resulting slew
    of ugly error messages is likely to leave even the blasé developer-faced; more
    importantly, if the input value is also saved to the database as is, the error
    will occur every time the calculation is performed on the record. Multiplying
    this by a few hundred records containing similar errors, scattered throughout
    the database, you''ll quickly see how the lack of appropriate input validation
    can significantly damage the application.


    PHP comes with various functions to assist developers in the task of validating
    input. For example, the is_numeric() function tests if a value is numeric, while
    the ctype_alpha() and ctype_alnum() functions can be used for alphabetic and alphanumeric
    strings. There''s also the filter_var() function, which can be used to test the
    validity of addresses and URLs, and the preg_match() function, which allows for
    pattern validation using regular expressions. Here''s an example of these functions
    in action:


    ```

    <php

    // define array of valid data

    $valid = array();


    // check if age is a number

    if (is_numeric(trim($_POST[''age'']))) {

    $valid[''age''] = trim($_POST[''age'']);

    } else {

    die(''ERROR: Age is not a number.'');

    }


    // check for valid first name

    if (isset($_POST[''firstname''])) && ctype_alpha($_POST[''firstname''])) {

    $valid[''firstname''] = trim($_POST[''firstname'']);

    } else {

    die(''ERROR: First name not present or invalid.'');

    }


    // check for valid email address

    if (isset($_POST[''email'']))

    && filter_var($_POST[''email''], FILTER_VALIDATE_EMAIL)) {

    $valid[''email''] = trim($_POST[''email'']);

    } else {

    die(''ERROR: Email address not present or invalid.'');

    }


    // processing code here //

    ?>

