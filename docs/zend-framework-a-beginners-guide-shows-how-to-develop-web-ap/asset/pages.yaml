    # Defining the Controller\n\nThe next step is to define the API controller, which\
    \ will handle all REST requests. As discussed previously, this controller should\
    \ extend the abstract Zend_Rest_Controller, and implement all its abstract methods.\
    \ Here’s what it looks like:"
