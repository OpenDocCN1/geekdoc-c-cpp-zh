    \        'salesRank' => $i->SalesRank\n    );\n}\n```\n\nThe search object's itemSearch()\
    \ method queries the Amazon Web service for a list of products matching the specified\
    \ parameters, and returns an array of Zend_Service_AmazonItem objects, containing\
    \ information on the corresponding item. It's quite easy to iterate through this\
    \ array of objects, extracting the relevant information for display.\n\n# Using\
    \ Generic Client Implementations\n\nIf you're trying to access a Web service for\
    \ which no predefined service implementation exists, don't lose heart: The Zend\
    \ Framework also includes generic SOAP and REST clients for accessing such services.\
    \ These clients are implemented in the Zend_Soap_Client and Zend_Rest_Client components,\
    \ respectively.\n\nTo illustrate this in action, consider the following example,\
    \ which uses the generic SOAP client to access the GeoCoder Web service and return\
    \ the latitude and longitude corresponding to a particular address:\n\n```\n<?php\n\
    class SandboxExampleController extends Zend_Controller_Action {\n    public function\
    \ soapAction() {\n        // initialize SOAP client\n        $soap = new GeoCoderSoap_wsdl(\n\
    \            'http://geocoder.us/dist/clients/GeoPHP.wsdl', array(\n         \
