  md: "# Working with File Uploads\n\nIn Chapter 3, you got a crash course in how\
    \ to create and process forms with the Zend_Form component, and subsequent chapters\
    \ have further increased your knowledge of Zend_Form by applying these techniques\
    \ to different types of forms. However, there's one common requirement that hasn't\
    \ been covered to date: handling file uploads through.\n\nPHP has, of course,\
    \ supported file upload forms for many years, and offers both the special $_FILES\
    \ superglobal and a number of built-in methods, which as is $_uploaded_file()\
    \ and move_uploaded_file(), to assist in the task of managing file uploads securely\
    \ and efficiently. Under the Zend Framework, similar functionality is available\
    \ through the Zend_File_Transfer component, which provides a full-fledged API\
    \ for receiving, validating, and processing uploaded files. This component also\
    \ works seamlessly to handle file transfers initiated through Zend_Form elements.\n\
    \n# CAUTION\n\nWhile PHP natively supports POST and file uploads, the Zend_File_Transfer\
    \ component currently supports POST uploads.\n\nThe best way to understand how\
    \ file transfers work under Zend_Form is with an example. Consider the following\
    \ code, which sets up a simple form consisting of a file upload element and submit\
    \ a button:\n\n```\n<php\nclass Form_Example extends Zend_Form\n{\n    public\
    \ function init()\n    {\n        // initialize form\n        $this->setAction('/sandbox/example/form')\n\
    \            ->setMethod('post');\n\n        // create file input for photo upload\n\
    \        $photo = new Zend_Form_Element_File('photo');\n        $photo->setLabel('Photo:')\n\
    \            ->setDestination('/tmp/upload/');\n\n        // create submit button\n\
    \        $submit = new Zend_Form_Element_Submit('submit');\n        $submit->setLabel('Submit');\n\
    \n        // attach elements to form\n        $this->addElement($photo)\n    \
    \        ->addElement($submit);\n\n        return $this;\n    }\n}\n```"
  merge: -1
  pgno: 227
