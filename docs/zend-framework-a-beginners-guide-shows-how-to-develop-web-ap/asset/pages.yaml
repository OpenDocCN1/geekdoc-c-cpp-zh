    # Installing and Configuring the Software


    Once the required software has been obtained, the next step is to install the
    various pieces and get them talking to each other. The following sections outline
    the steps for both Windows and UNIX platforms.


    # NOTE


    If you use an Apple workstation, you can find instructions for installing PHP
    on Mac OS X in the PHP manual, at http://www.php.net/manual/en/install.macosx.php.


    # Installing on UNIX


    The installation process for UNIX involves a number of distinct steps: installing
    MySQL from a binary distribution; compiling and installing PHP from a source distribution;
    and compiling and configuring Apache to properly handle requests for Web pages.
    These steps are described in greater detail in the following subsections.


    # Installing MySQL


    To install MySQL from a binary distribution, use the following steps:


    +   1. Ensure that you are logged in as the system’s root user.


    ```

    [user@host]# su root

    ```


    +   2. Extract the content of the MySQL binary archive to an appropriate directory
    on your system—example, /usr/local.


    ```

    [root@host]# cd /usr/local

