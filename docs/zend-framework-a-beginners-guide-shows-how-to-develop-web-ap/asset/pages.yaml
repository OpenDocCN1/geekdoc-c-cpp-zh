  md: "# 246 Zend Framework: A Beginner's Guide\n\ndifferent Exception objects for\
    \ different types of exceptions. This makes it possible to distinguish between\
    \ different types of errors and to handle each type differently.\n\n+   - The\
    \ exception-based approach forces developers to make hard decisions about how\
    \ to handle different types of errors. Where exceptions are not available, developers\
    \ can easily omit (by audit or design) tests to check the return value of functions.\
    \ However, exceptions are not so easy to ignore. By requiring developers to create\
    \ and populate catch blocks, the exception model forces them to think about the\
    \ causes and consequences of errors and ultimately results in better design and\
    \ more robust implementation.\n\nAll Zend Framework components are explicitly\
    \ designed to use the exception-based model by default, with each component extending\
    \ the base Zend_Exception class as needed. So, regardless of whether you are using\
    \ Zend Framework components as stand-alone pieces of a larger application, or\
    \ within the context of a Zend Framework MVC application, consistency in approach\
    \ can significantly reduce the time spent on developing-level error-handling features.\n\
    \n# Understanding the Default Error-Handling Process\n\nLet's look a little more\
    \ closely at exception handling within a Zend Framework MVC application. By default,\
    \ when an exception is thrown, exception \"bubbles up\" through the execution\
    \ chain until it reaches the front controller. The front controller includes an\
    \ error-handler plugin (automatically registered as part of the bootstrap process)\
    \ which takes care of forwarding the exception to the application's default error\
    \ controller. The error controller then checks the exception and displays an appropriate\
    \ error view to the requesting client.\n\nWhere does this error controller come\
    \ from? For projects created with the command-line script, it is automatically\
    \ generated in the default project layer. For projects created manually, it must\
    \ be manually generated. In either case, it is represented as a separate controller\
    \ and action, ErrorController::errorAction, and located within the application's\
    \ \"default\" module. Here's an example of what it typically looks like:\n\n```\n\
    <?php\nclass ErrorController extends Zend_Controller_Action\n{\n    public function\
    \ errorAction()\n    {\n        $errors = $this->getParam('error_handler');\n\
    \    }\n\nswitch ($errors->type) {\n    case Zend_Controller_Plugin_ErrorHandler::EXCEPTION_NO_CONTROLLER:\n\
    \    case Zend_Controller_Plugin_ErrorHandler::EXCEPTION_NO_ACTION:\n        //\
    \ 404 error - controller or action not found\n        $this->getResponse()->setStatusCode(404);\n\
    \        $this->view->message = 'Page not found';\n        break;\n}\n```"
