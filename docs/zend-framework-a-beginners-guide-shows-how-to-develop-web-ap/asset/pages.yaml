    \ will ensure that the data set is automatically sorted by item ID in ascending\
    \ order.\n\nFigure 7-2 has an example of the output, sorted by grade (look at\
    \ the URL in your browser address bar to better understand how this works).\n\n\
    Figure 7-2 The catalog summary view, with sorting and paging enabled"
