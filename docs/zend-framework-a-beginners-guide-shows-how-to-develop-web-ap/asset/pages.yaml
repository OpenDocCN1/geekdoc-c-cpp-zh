    $name->setLabel('Name')\n    ->setOptions(array('size' => '35'))\n    ->setRequired(true);\n\
    ```\n\n# Ask the Expert\n\n**Q:** What is a CAPTCHA?\n\n**A:** A CAPTCHA, or Completely\
    \ Automated Public Turing test to tell Computers and Humans Apart, is a common\
    \ challenge-response test used to identify whether the entity at the other end\
    \ of a connection is a human or a computer. On the Web, the typical form of a\
    \ CAPTCHA is a distorted sequence of random alphanumeric characters, operating\
    \ on the principle that a computer would be unable to see the distortion, but\
    \ a human, with greater powers of perception, would be able to identify the sequence.\
    \ Such CAPTCHAs are typically attached to input forms on the Web (for example,\
    \ user registration forms), and they must be solved correctly before the input\
    \ is processed by the host application. CAPTCHAs need not always be visual; audio\
    \ CAPTCHAs are also possible, and are most appropriate for visually handicapped\
    \ users."
