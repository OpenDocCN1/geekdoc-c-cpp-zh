    \ system to protect access to the SQUARE administration panel. The following sections\
    \ will guide you through the process.\n\n# Defining Custom Routes\n\nAs always,\
    \ a good place to begin is with the route definitions. Define login and logout\
    \ routes for your administration panel by adding the following definitions to\
    \ your application configuration file at $APP_DIR/application/configs/application.ini:\n\
    \n```\nresources.router.routes.login = /admin/login\nresources.router.routes.login.defaults.module\
