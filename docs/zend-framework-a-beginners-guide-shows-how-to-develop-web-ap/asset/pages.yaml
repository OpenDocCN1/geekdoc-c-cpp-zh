  md: "# Zend Framework: A Beginner’s Guide\n\n# Try 11-3 Adding a YUI Calendar Widget\n\
    \nIn the previous section, you saw how easy it is add Dojo widgets to a Zend application.\
    \ However, Dojo is not the only game in town, and it's also easy to integrate\
    \ widgets and libraries from other client-side programming toolkits as well. This\
    \ next section illustrates the process of adding a pop-up calendar widget from\
    \ the Yahoo! User Interface Library (YUI) to a Zend instance.\n\nThe target form,\
    \ in this case, is the ItemUpdate form that was first defined in Chapter 5, and\
    \ that allows administrators to adjust catalog item properties and display status.\
    \ In this example, we will update the form to use YUI's graphical calendar widget\
    \ for single-click date input, instead of displaying selection lists for day,\
    \ month, and year input.\n\nFor purposes of this example\n\n# Updating the Form\n\
    \nThe first step is to update the form, creating a new element that will contain\
