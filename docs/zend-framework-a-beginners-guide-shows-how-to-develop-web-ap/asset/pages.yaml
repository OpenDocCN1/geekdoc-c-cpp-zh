  md: "# Zend Framework: A Beginner’s Guide\n\n# Defining the Update Action and View\n\
    \nUpdating records typically involves two distinct queries:\n\n+   1. The first\
    \ query is a read query, occurring when the user selects a record for update.\
    \ The updateAction() must read the selected record from the database, prepopulate\
    \ a Web form with the field values currently stored in the database, and render\
    \ this form to the user.\n\n+   2. The second query is a write query, occurring\
    \ when the user submits the form. The updateAction() must receive, filter, and\
    \ validate the submitted values. If the values are valid, the action must write\
    \ the new version of the record to the database.\n\nThe Catalog_AdminItemController::updateAction\
    \ performs both of these functions. Here’s what it looks like:\n\n```\n<php\n\
    class Catalog_AdminItemController extends Zend_Controller\n{\n    // modify an\
    \ individual catalog item\n    public function updateAction()\n    {\n       \
    \ // generate input form\n        $form = new Square_Form_ItemUpdate();\n    \
    \    $this->view = $form;\n\n        if ($this->getRequest()->isPost()) {\n  \
    \          // IF POST request\n            // test if input is valid\n       \
    \     // retrieve current record\n            // update values and replace in\
    \ database\n            $postData = $this->getRequest()->getPost();\n        \
    \    $postData['DisplayUntil'] = sprintf('%04d-%02d-%02d',\n                $this->getRequest()->getPost('DisplayUntil_year'),\n\
    \                $this->getRequest()->getPost('DisplayUntil_month'),\n       \
    \         $this->getRequest()->getPost('DisplayUntil_day'));\n\n            if\
    \ (isValid($postData)) {\n                $input = $form->getValues();\n     \
    \           $item = Doctrine::table('Square_Model_Item')\n                   \
    \ ->find($input['RecordID']);\n                $item->fromArray($input);\n   \
    \             $item->DisplayUntil =\n                    ($item->DisplayStatus\
    \ == 0) ? null : $item->DisplayUntil;\n                $item->save();\n      \
    \          $this->helper->getHelper('FlashMessenger')\n                    ->addMessage('The\
    \ record was successfully updated.');\n                $this->redirect('/admin/catalog/item/success');\n\
    \            }\n        } else {\n            // IF GET request\n            //\
    \ set filters and validators for GET input\n        }\n    }\n}\n?php\n```"
