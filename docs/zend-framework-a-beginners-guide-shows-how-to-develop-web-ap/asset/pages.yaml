    # Caching Doctrine Queries


    While Zend_Cache can be generally used to cache the results of database queries,
    demonstrated in the very first example in this section, it''s also possible to
    use Doctrine''s own caching mechanism for this purpose. Doctrine comes with two
    different caching systems, one for queries and one for results, both are easy
    to activate and use, with minimal code refactoring.

    The Doctrine query cache holds parsed representations of Doctrine_Query objects,
    allowing repeat queries to be directly sent to the server without first needing
    to be parsed. The Doctrine result cache does everything the Doctrine query cache
    does, but also stores serialized representations of the query results and returns
    them wherever possible, thereby taking the database


    # Ask the Expert


    Q: Is a memory cache always preferable to a disk cache?

    A disk cache is generally considered "slower" than a memory cache, because retrieving
    data from disks usually takes longer than pulling it out of a memory-based cache
    like memcached or APC. In this mind, it often makes sense to cache frequently
    accessed data in a memory cache rather than in a disk cache, that it can be retrieved
    and served faster.

    However, it is incorrect to conclude that this application performance can be
    maximized by storing all data in a memory-based cache, because one must consider
    the size of the data being cached. In most cases, memory is a far scarcer resource
    than disk space, so it usually makes more sense to use a disk cache when the data
    to be cached is large in size. Storing everything, including the kitchen sink,
    in a memory-based cache will usually end up hurting, rather than helping, performance
    as the system will quickly run out of memory for other critical tasks.'
