  md: "# 184 Zend Framework: A Beginner's Guide\n\nshould be displayed in search results.\
    \ Marking the body and subject fields as UnStored fields makes them searchable\
    \ while reducing the disk space consumed by the index, while marking the recipient\
    \ and date fields as Text fields makes it possible to search both and display\
    \ them in search results.\n\n# Searching Data\n\nOnce the data has been indexed,\
    \ the next step is to search it. Zend_Search_Lucene comes with a full-featured\
    \ query engine that can be used for both simple and complex queries on an index.\
    \ Queries may be created either by applying the built-in query parser to user\
    \ input or by programmatically generating them using API methods. For simple keyword\
    \ queries, the standard query parser is suitable; more complex queries that include\
    \ modifiers, proximity constraints, subqueries, or field groups should be created\
    \ using API methods.\n\nHere's some example code illustrates how to search a collection\
    \ of indexed documents and display results:\n\n```\n<php\nclass SandboxExampleController\
    \ extends Zend_Controller\n{\n    public function searchAction()\\ {\n       \
    \ // get query string from $_GET['query']\n        // if valid, open index and\
    \ parse query string\n        // execute query $data = $input->setData($this->getRequest())->getParams());\n\
    \        if ($input->isValid()) {\n            $index = Zend_Search_Lucene::open('/tmp/indexes/');\n\
    \            $results = $index->find(\n                Zend_Search_Lucene_QueryParser::parse($input->query)\n\
    \            );\n            $this->view = $results;\n        }\n    }\n}\n```\n\
    \nAs illustrated in the preceding code, the first step is to open a handle to\
    \ the index created earlier using the Zend_Search_Lucene::open() method. The query\
    \ string is passed to the Zend_Search_Lucene::find() method to scan the index\
    \ for matching documents. Matters are returned as Zend_Search_Lucene_QueryHit\
    \ objects, ranked by score. Each of these objects exposes the document number\
    \ and the document score as object properties. Other stored fields of the document\
    \ can be accessed as object properties, as shown in the previous example. All\
    \ field values are automatically converted to UTF-8.\n\nThe query string passed\
    \ to the find() method may contain keywords, phrases, wildcards, range constraints,\
    \ proximity modifiers, and Boolean operators like AND, OR. When this query is\
    \ submitted by the user, it's a good idea to pass it through the Zend_Search_Lucene_Searching_QueryParser::parse()\
    \ method, which takes care of automatically parsing and tokenizing the query string\
    \ and converting it into a query objects. This also reduces the amount of input\
    \ validation needed."
