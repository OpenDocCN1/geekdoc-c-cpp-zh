  md: "# Chapter 7: Paging, Sorting, and Uploading Data 225\n\nThe first step is to\
    \ initialize a ZendConfig object, which represents the configuration data. This\
    \ object should be initialized with an array containing configuration data (or\
    \ an empty array if no data exists), and a Boolean argument indicating whether\
    \ or not the configuration data can be modified. The ZendConfig object has been\
    \ initialized, individual configuration variables can be set as properties using\
    \ standard object notation. Hierarchical data structures are supported, simply\
    \ by chaining properties; depending on the output format chosen, this hierarchy\
    \ is represented either with separators (INI) or nesting (XML).\n\nThe configuration\
    \ file generated by the preceding code is as follows:\n\n```\n[blog]\nallowComments\
    \ = \"yes\"\\endisplayComments = \"yes\"\nallowTrackbacks = \"yes\"\ndefaultAuthor\
    \ = \"Jack Frost\"\nnumPostsOnPageIndex = 5\n```\n\n```\n[calendar]\nweekStartsOn\
    \ = \"Monday\"\nhighlightToday = 1\nevents.displayTitle = 1\nevents.displayStartTime\
    \ = 1\nevents.displayEndTime = 0\nevents.displayLocation = 1\n```\n\nXML configuration\
    \ files are quite powerful for Web-based applications, because most languages\
    \ include XML parsing (PHP; in particular, comes with a number of extensions for\
    \ XML parsing, including the SimpleXML, DOM, and XMLReader extensions). To present\
    \ the same configuration data in XML format, simply update the code to use the\
    \ Zend_Config_Writer XML adapter, as follows:\n\n```\n<?php\nclass Sandbox_ExampleController\
    \ extends Zend_Controller_Action\n{\n    public function configAction()\n{\n \
    \       // create configuration object\n        $config = new ZendConfig(array(),\
    \ 1);\n\n        // create section\n        $config->blog = array();\n       \
    \ $config->blog->allowComments = 'yes';\n        $config->blog->displayComments\
    \ = 'yes';\n        $config->blog->allowTrackbacks = 'yes';\n        $config->blog->defaultAuthor\
    \ = 'Jack Frost';\n        $config->blog->numPostsOnPageIndex = 5;\n    }\n```"
