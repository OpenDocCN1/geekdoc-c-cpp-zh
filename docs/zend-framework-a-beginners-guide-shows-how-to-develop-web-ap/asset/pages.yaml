  md: '# Chapter 1: Introducing the Zend Framework 3


    With this in mind, there’s been a concerted and visible effort in the PHP community
    over the last few years to move from ad-hoc "anything goes" programming to a more
    standardized, framework-oriented approach. Not only does this approach make it
    easier to get up and running when building a PHP application from scratch, but
    it produces cleaner, more consistent, and more secure application code. This chapter,
    and the remainder of this book, introduces you to one such framework, the Zend
    Framework, which provides a flexible and scalable approach to building PHP applications
    for serious developers.


    # Overview


    In words of its official Web site (http://framework.zend.com/), the Zend Framework
    is "an open source framework for developing web applications and services with
    PHP 5 [...] based on simplicity, object-oriented practices, corporate friendly
    licensing, and a rigorously tested codebase." It provides a comprehensive set
    of tools to build and deploy PHP-based Web applications, with built-in APIs for
    common functions like security, input validation, caching, database and XML operations,
    and internationalization.


    Unlike many other frameworks, the Zend Framework uses a "loosely coupled" architecture.
    Simply put, this means that although the framework itself consists of numerous
    components, these components are largely independent and have minimal links to
    each other. This loosely coupled architecture helps in lightweight applications,
    because developers can choose to use only the specific components they need for
    the task at hand. For example, developers looking to add authentication or caching
    to their application can directly make use of the Zend_Auth or Zend_Cache components,
    without needing the rest of the framework.


    The Zend Framework provides a complete implementation of the Model-View-Controller
    (MVC) pattern, which allows application logic to be separated from the user interface
    and data models. This pattern is recommended for applications of medium to large
    complexity and is commonly used for Web application development, as it encourages
    code reusability and provides a more manageable code structure. Zend Framework’s
    implementation of the MVC pattern is discussed in detail in Chapter 2.


    The Zend Framework is created and maintained by Zend Technologies, a commercial
    software vendor whose founders, Andiman and Zee Suraski, were also responsible
    for the first major rewrite of the PHP parser, released as PHP 3.0 in 1997. The
    first version of the Zend Framework, v1.0, was released in July 2007 and contained
    35 core components, including caching, authentication, configuration management,
    database access, RSS and Atom feed generation, and localization.


    Since then, the framework has been through numerous iterations with the most recent
    release, v1.10, now containing more than 65 components that support (among other
    things) Adobe’s Action Message Format (AMF), Google’s GData APIs, and Amazon’s
    EC2 and SQS Services. Fortunately, the increase in the number of components has
    been accompanied by a corresponding increase in documentation—the manual for Zend
    Framework v1.9 (circa 2009) weighs in at 3.7MB, as to the 780KB manual that shipped
    with Zend Framework v1.0 in 2007.'
