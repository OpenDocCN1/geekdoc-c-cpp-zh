    # Ask the Expert


    **Q:** Why aren’t you using the Doctrine result cache to cache query results?


    **A:** While it is certainly possible to use the Doctrine result cache for query
    results, doing so invariably requires one to load the Doctrine model(s). The approach
    used in this example bypasses this step, such that the Doctrine model is not invoked
    at all. This reduces the amount of code executed even further and only helps to
    increase overall performance.


    # Summary


    This chapter, the last in this book, explored the important topic of Zend Framework
    performance optimization, discussing some of the techniques and options available
    to help you squeeze a little more out of your application. In addition providing
    a quick overview of the tools available for performance analysis and code profiling,
    the chapter examined various strategies for performance optimization, including
    query and output caching, lazy loading. SQL query tuning, and code refactoring.


    Application optimization is almost a science unto itself, and is impossible to
    cover in the limited space available in this chapter. However, adopting these
    techniques will help you build more efficient applications, and they should be
    a part of your standard development process.'
