  md: '# Zend Framework: A Beginner’s Guide


    # Defining Custom Routes


    The next step is to define a route to the configuration controller. Since the
    configuration panel isn''t specific to any particular module, this controller
    can be placed in the all-purpose “default” module. Here''s the route definition,
    which should be added to the application configuration file at $APP_DIR/application/configs/application.ini:


    ```

    resources.router.routes.admin-config.route = /admin/config

    resources.router.routes.admin-config.defaults.module = default

    resources.router.routes.admin-config.defaults.controller = config

    resources.router.routes.admin-config.defaults.action = index

    ```


    ```

    resources.router.routes.admin-config-success.route = /admin/config/

    succ

    resources.router.routes.admin-config-success.module = default

    resources.router.routes.admin-config-success.defaults.controller = config

    resources.router.routes.admin-config-success.defaults.action = success

    ```


    # Ask the Expert


    Q: I''m confused. Why are you storing the location of one configuration file in
    another?


    A: The application configuration file, at $APP_DIR/application/configs/application.ini,
    is a global file that is read by the Zend Framework application. Typically, it
    contains numerous settings that are defined by the application designer and should
    not be modified without consideration. That said, every application has various
    user-level settings that should be configurable by application users and administrators.
    For the SQUARE application, these settings are stored in a separate user-level
    configuration file, at $APP_DIR/application/configs/square.ini.


    Separating system-level settings from user-level settings in this manner is generally
    recommended, because it allows these two types of variables to be manipulated
    independently without risk of corruption. However, there also needs to be a link
    between the two, so that actions and controllers that rely on user-level settings
    know to find this information. Since the application configuration file application.ini
    is globally available for all actions and controllers, the path to the user-level
    configuration file square.ini can be conveniently stored within.


    If you''re still confused, here’s another way to look at it: Changes in the application.ini
    global configuration may also require alteration of application code, but changes
    in the user-level configuration file should never have this effect.'
