  md: "# 168 Zend Framework: A Beginner’s Guide\n\nusing the Zend_Auth::hasIdentity\
    \ method. If no identity exists, this will return false. If this happens, the\
    \ request URL will be stored in the session, and the client will be redirected\
    \ to the login method.\n\nFollowing a successful login, the request URL will be\
    \ retrieved from the session by the loginAction() (discussed in the previous section)\
    \ and the client will be redirected back to this URL. The preDispatch() method\
    \ will be executed, this time, since the user's identity has already been confirmed,\
    \ the hasIdentity() will return true, and the requested action will be dispatched\
    \ in the normal manner.\n\n# Updating the Master Layout\n\nAs illustrated in the\
    \ preceding section, the Zend_Auth object's hasIdentity() method provides a convenient\
    \ test for whether or not the user has been authenticated. This fact can be good\
    \ to use in the administrative layout, to selectively display menu items depending\
    \ on whether the user is logged in or not. Here's an example, with APP_DIR/application/layouts/admin.phtml\
    \ to display a \"Logout\" item in the main area when the user is logged in. The\
    \ changes are highlighted in bold.\n\n```\n<!DOCTYPE html PUBLIC \"//W3//DTD HTML\
