    Note the Zend Dojo::enableView in the previous listing. This method adds the Dojo
    view helper path to the Zend View object, omitting it will usually result in an
    exception because Zend_View will be unable to find and load the required helper(


    If you''d prefer to load Dojo Toolkit libraries from an external location, such
    as a Content Network (CDN), you can use the setCdnBase() method, as follows:


    ```

    <?php

    Zend_Dojo::enableView($this);

    $this->dojo()->setCdnBase(Zend_Dojo::CDN_BASE_AOL)

    ->addStyleSheetModule(''dijit.themes.tundra'')

    ->setDojoConfigOption(''parseOnLoad'', true)

    ->setDojoConfigOption(''locale'', ''en-US'')

    ->setDojoConfigOption(''isDebug'', true);

    echo $this->dojo();

    ?>

    ```


    # CAUTION


    If you don''t specify a local path to the Dojo libraries with setLocalPath(),
    the Dojo view helper will automatically assume that you wish to use the Google
    CDN.


    In addition to the Dojo view, the Zend Framework also ships with a number of other
    view helpers that can be used to directly render Dojo and Layout containers and
    form elements within a view script. Table 11-2 gives an abridged list of these
    helpers.


    It''s worth noting that the Dojo view helper will automatically detect your use
    of these helpers in a view script and generate the necessary client-side code
    to initialize them. Here''s an example:


    ```

    <html>

    <head>

    <?php

    Zend_Dojo::enableView($this);

    ```'
