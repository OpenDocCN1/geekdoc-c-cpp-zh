    \ the period for which the item is visible in the public catalog.\n\nZend_Form,\
    \ with its object-oriented approach to form creation, is particularly good at\
    \ meeting this requirement. Using OOP concepts of inheritance and extensibility,\
    \ it’s possible to extend a parent class and derive child form classes by adding\
    \ and subtracting form elements via Zend_Form::addElement() and removeElement()\
    \ methods.\n\nTo illustrate, consider the following UpdateForm class, which is\
    \ derived from the ItemCreate class created at the beginning of this chapter.\
    \ This child class shares many input elements with its parent; however, since\
    \ it’s intended for use only by administrators, it removes unwanted elements (the\
