    # Summary


    Once your application''s basic CRUD functions are up and running, users and administrators
    are free to add data to it. This begets a new problem, that of making application
    data accessible, searchable, and exportable to a number of common formats. This
    chapter focused specifically on this problem, guiding you through the process
    of adding search capabilities to an application and showing how to use the Zend_Search_Lucene
    component. It also demonstrates the ContextSwitch helper, which makes it easy
    to support different output formats such as XML, RSS, JSON, and others.'
