  md: '# Chapter 8: Logging and Debugging Exceptions


    The second half of this chapter de-focused specifically on the Zend/Log component,
    which provides a full-featured framework for logging messages in a Zend Framework
    application. This component can be used to log messages to a variety of different
    storage media, including file, database, email address, system logger, and Firebug
    console, and it can also be extended to support new log destinations. Some of
    these features were demonstrated in a practical context, by adding exception logging
    code to the SQUARE example application. To learn more about the topics discussed
    in this chapter, consider visiting the following links:


    +   - An overview of exceptions and exception handling in PHP 5.x, at http://www.php.net/manual/en/language.exceptions.php

    - An overview of exceptions and exception handling in the Zend Framework, at http://framework.zend.com/manual/en/zend.controller.exceptions.html

    - The Zend Framework error handler plugin, at http://framework.zend.com/manual/en/zend.controller.plugins.html

    - The Zend_Log component, at http://framework.zend.com/manual/en/zend.log.html

    - The Zend_Debug component, at http://framework.zend.com/manual/en/zend.debug.html

    - The Firefox Web browser, at http://www.mozilla.com/firefox

    - The FirePHP extension, at http://www.firephp.org/

    - A discussion of using the Firebug and FirePHP components with the Zend Framework
    (Christoph Dorn), at http://www.christophorn.com/Blog/2008/09/02/firephp-and-zend-framework-16/

    - A discussion of handling errors in a Zend Framework application (Jani Hartikainen),
    at http://codeutopia.net/blog/2009/03/02/handling-errors-in-zend-framework/

