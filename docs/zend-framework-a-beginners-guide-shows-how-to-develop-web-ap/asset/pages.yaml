    and reference guide. The community is also encouraged to "give back" to the framework
    by submitting new components—there are currently over 500 independent contributors
    to the project—so long as the contributions meet Zend''s requirements for documentation
    and unit testing.


    # Features


    You might be wondering why the Zend Framework is a better idea than simply rolling
    your own code, the way you''re to right now. Well, here are some reasons.


    # Standards Compliance and Best Practices


    Unlike some other programming languages, PHP does not enforce a common coding
    standard. As a result, the manner in which PHP applications are written differs
    significantly from developer to developer, making it hard to ensure project-wide
    consistency. PHP''s relative lack of "strictness" can also produce code that fails
    to adhere to best practices, rendering it vulnerable to attack.


    The Zend Framework, on the other hand, incorporates current thinking on best practices,
    provides a standard layout layout, and provides built-in support for common development
    tasks such as input validation and sanitization. Therefore, using it as the basis
    for a PHP project automatically produces higher-quality code and an application
    that''s more forward-leaning on security issues. Additionally, because the Zend
    Framework is well-documented, developers joining the project team at a later date
    will have a much shorter learning curve and can begin contributing to the project
    faster.


    # Reusability


    The Zend Framework is object-oriented and makes use of the new object model in
    PHP 5.x. This object-oriented programming (OOP) architecture encourages reusability,
    allowing developers to significantly reduce the time spent writing duplicate code.
    This fact is particularly important in the context of Web applications, which
    often need to expose multiple interfaces to their data. Suppose, for example,
    that you wish to add an XML interface to your application''s existing search functionality.
    With the Zend Framework, this is as simple as defining a new view that takes care
    of reformatting controller output in XML, and the entire process is transparent
    and easy to accomplish.'
