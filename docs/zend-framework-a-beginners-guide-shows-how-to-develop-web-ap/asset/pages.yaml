  md: '# Ask the Expert


    **Q: I''m already validating form input using JavaScript. Why do I also need to
    validate it using PHP?**


    **A: It''s common practice to use client-side scripting languages like JavaScript
    or VBScript for client-side input validation. However, this type of client-side
    validation is not foolproof—if a user turns off JavaScript in the client, all
    your client-side code will become nonfunctional. That''s why it''s a good idea
    to couple client-side validation (which is faster) with server-side validation
    (which is more secure).


    # Using Validator and Filter Chains


    One of the most interesting things about the Zend_Filter and Zend_Validate components
    is their support for chaining or stacking. Essentially, this means it is possible
    to attach multiple filters to a single input element, and then they automatically
    run, in sequence, when the form is submitted. The following example illustrates
    this setting up a chain of filters:


    ```

    <?php

    // create text input for name

    // filter tags, entities and whitespace

    $name = new Zend_Form_Element_Text(''name'');

    $name->setLabel(''First name:'')

    ->setOptions(array(''size'' => ''16''))

    ->setRequired(true)

    ->addFilter(''StripTags'')

    ->addFilter(''HTMLEntity'')

    ->addFilter(''StringTrim'')

    ->addFilter(''ToLower'');

    ```


    In this example, the first filter strips HTML from the input, the second encodes
    entities, the third trims leading and trailing whitespace, and the fourth transforms
    the result to lowercase. These filters are executed on the input value in their
    order of appearance in the chain. Validators work in a similar manner and with
    an additional property. A validator chain can be configured such that a failure
    in any validator terminates the entire chain with an error message. This behavior
    is controlled by the second argument to the addValidator() method which, when
    set to true, breaks the chain if there is a failure in the corresponding validator.
    Consider the next example, which illustrates this:


    ```

    <?php

    // create text input for age

    ```'
