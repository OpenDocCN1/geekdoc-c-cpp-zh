  md: "# 302 Zend Framework: A Beginner’s Guide\n\n# Registering the Translation Object\n\
    \nThe final step is to update the application bootstraprapper configure and register\
    \ an instance of the Zend_Translate object. This instance will become available\
    \ in all application controllers and views, enabling the use of the translation\
    \ view helper and Zend_Form’s autotranslation features.\n\nTo this, update the\
    \ application bootstraprapper, at $APP_DIR/application/Bootstrap.php, and add\
    \ the following method to it:\n\n```\n<?php\nclass Bootstrap extends Zend_Application_Bootstrap_Bootstrap\n\
    {\n    protected function _initTranslate() {\n        $translate = new Zend_Translate('array',\n\
    \            APPLICATION_PATH . '../languages/',\n            null,\n        \
    \    array('scan' => Zend_Translate::LOCALE_FILENAME,\n            'disableNotices'\
    \ => 1));\n\n        $registry = Zend_Registry::getInstance();\n        $registry->set('Zend_Translate',\
    \ $translate);\n    }\n}\n```\n\n# TIP\n\nInstead of getting the Zend_Registry\
    \ instance, you can directly access registry values with the shorthand Zend_Registry::get($index)\
    \ and Zend_Registry::set($index, $value) methods.\n\nAnd you’re done! To see this\
    \ in action, configure your browser settings and add French or German as your\
    \ preferred language. Figure 9-6 shows an example of how to do this in Mozilla\
    \ Firefox, while Figure 9-7 shows an example of how to do this in Microsoft Internet\
    \ Explorer.\n\nFigure 9-6 Configuring page languages in Mozilla Firefox"
