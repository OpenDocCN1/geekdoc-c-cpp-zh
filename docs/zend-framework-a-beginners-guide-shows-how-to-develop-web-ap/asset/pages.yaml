  md: "# 294 Zend Framework: A Beginner’s Guide\n\nOnce a Zend_Translate object has\
    \ been registered with the application registry, other Zend Framework components\
    \ can also use it for string localization. The best example of this is Zend_Form,\
    \ which can automatically use a registered Zend_Translate to prepare localized\
    \ versions of form field and button labels, option elements, fieldset legends,\
    \ and validation error messages. You'll see an example of this in the next section.\n\
    \n# Try This 9-1 Localizing the Example Application\n\nAs the previous sections\
    \ have illustrated, the Zend Framework offers a comprehensive API for application\
    \ localization. Now that you know the theory, let's apply in a practical context\
    \ by localizing the SQUARE example to support three different languages: English\
    \ (both UK and US), French, and German.\n\n# Setting the Application Locale\n\n\
    The first step in application localization is to define the application's locale.\
    \ This locale information can be used by other components, such as Zend_Date and\
    \ Zend_Translate. The recommended way to do this is to first attempt locale autodiscovery\
    \ from the user's client, or failing that, manually set the locale to a reasonable\
    \ value.\n\nBy editing the application bootstrap, at $APP_DIR/application/Bootstrap.php,\
    \ and adding a method to perform locale autodiscovery, as follows:\n\n```\n<?php\n\
    class Bootstrap extends Zend_Application_Bootstrap_Bootstrap {\n    protected\
    \ function _initLocale() {\n        try {\n            $locale = new Zend_Locale('browser');\n\
    \        } catch (Zend_Locale_Exception $e) {\n            $locale = new Zend_Locale('en_GB');\n\
    \        }\n        $registry = Zend_Registry::getInstance();\n        $registry->set('Zend_Locale',\
    \ $locale);\n    }\n}\n```\n\nIn this case, Zend_Locale will automatically detect\
    \ the user's current locale and, if unable to do so, it will set the locale to\
    \ en_GB (language: English; country: United Kingdom). The locale will be registered\
    \ in the application registry via Zend_Registry so that other-aware components\
    \ can use it as well.\n\n# Localizing Numbers and Dates\n\nWith locale definition\
    \ out of the way, the next step is to look through the application and begin the\
    \ process of localizing numbers and dates. If you take a look at the stamp catalog\
    \ views, you'll see that each stamp record includes some numeric values: the stamp's\
    \ denomination and"
