    # Explicitly Specify Fields


    It''s common to see queries like this:


    ```

    SELECT (*) FROM airport;

    SELECT COUNT(*) FROM airport;

    ```


    These queries use the asterisk (*) wildcard for convenience. However, this convenience
    comes at a price: The * forces MySQL to read every field or record in the table,
    adding to the overall query processing time. To avoid this, explicitly name the
    output fields you wish to see in the result set, as shown in this example:


    ```

    SELECT id, name FROM airport;

    SELECT COUNT(id) FROM airport;

    ```


    # Index Join Fields


    Fields are accessed frequently should be indexed. As a general rule, if you have
    a field involved in searching, grouping, or sorting, indexing it will likely result
    in a performance gain. Indexing should include fields that are part of join operations
    or fields that appear with clauses such as WHERE, GROUP BY, or ORDER BY. In addition,
    joining fields rather than character fields, produce better performance.


    # Use Small Transactions


    Cliché it may seem, the KISS (Keep It Simple, Stupid!) principle is particularly
    applicable in the complex world of transactions. This is because MySQL uses a
    row-level locking mechanism to prevent simultaneous transactions from editing
    the same record and causing corruption. The row-level locking mechanism prevents
    more than one transaction from accessing a row at the same time—this safeguards
    the data, but has the disadvantage of causing other transactions to wait until
    the transaction initiating the locks has its work. So long as the transaction
    is small, this wait is not noticeable. When you are dealing with a large database
    and many complex transactions, however, the long wait time the various transactions
    wait for each other locks can significantly affect performance.


    For this reason, it is generally a good idea to keep your transactions small and
    to make them change quickly and exit so that other transactions queued behind
    them do not get unduly delayed. At the application level, two common strategies
    exist for accomplishing this.


    +   Ensure that all user input required for the transaction is available before
    issuing a START TRANSACTION command. Often, novice application designers initiate
    a transaction before the complete set of values needed by it is available. Other
    transactions initiated at the same time now have to wait while the user inputs
    the required data and the application processes'
