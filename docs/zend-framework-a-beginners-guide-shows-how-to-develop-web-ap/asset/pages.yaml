  md: "192 Zend Framework: A Beginner’s Guide\n\n# # Ask the Expert\n\n**Q:** Which\
    \ is better: full-text search using disk indices or filter-based search using\
    \ database queries?\n\n**A:** As a general rule, full-text search produces better\
    \ quality results than database search, for a\ncouple of reasons. It's not usually\
    \ practical to allow users to search by every single facet of\ndatabase record,\
    \ besides, the full-text search capabilities built into most RDBMSes\naren't as\
    \ sophisticated or as efficient as those found in more focused full-text search\
    \ tools\nlike Lucene, Sphinx, or Sol. It's also typically faster than database\
    \ search, as the search is\nperformed using disk-based indices rather than a database\
    \ connection. That said, full-text\nsearch relies on static indices created from\
    \ the source content, therefore, in situations\nwhere the source content is subject\
    \ to frequent updates, full-text search results can lag behind\nt actual, available\
    \ content. A database search, because it runs directly on the content, does\n\
    suffer from this lag. With as most questions, the answer to this one is subjective\n\
    \ depends on the exact balance you wish to achieve between performance and accuracy.\n\
    \n# # Handling Multiple Output Types\n\nModern Web applications do not just speak\
    \ HTML—they're usually capable of\nserving up RSS, JSON, XML, and a variety of\
    \ other formats as well. Since the MVC pattern\ndistinguishes between data and\
    \ presentation, it's ideally suited to this sort of thing: supporting\na new output\
    \ type becomes as simple as creating a new view containing the appropriate\nformatting\
    \ codes and/or markup. Most importantly, these changes are localized to the view\
    \ layer,\n can be accomplished without any modifications needed in the controller\
    \ and model layers.\nThe Framework has a built-in handler for multiple output\
    \ types, or contexts,\nknown as the ContextSwitch helper. This helper handles\
    \ all the tasks involved in switching to\na different output format, disabling\
    \ the default layout, selecting the appropriate view\nscript, and sending the\
    \ correct headers for the selected format.\nTo illustrate how this works, consider\
    \ the following example, which sets up a new context\nfor YAML output:\n\n```\n\
    <?php\nclass Sandbox_ExampleController extends Zend_Controller_Action\n{\n   \
    \ public function init()\n    {\n        // initialize context switch helper\n\
    \        $contextSwitch = $this->_helper->getHelper('contextSwitch');\n      \
    \  $contextSwitch->addContext(\n            'yaml',\n            array(\n```"
