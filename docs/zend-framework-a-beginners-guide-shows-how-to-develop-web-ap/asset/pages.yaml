  md: "# Chapter 10: Working with News Feeds and Web Services 333\n\n| Request URL\
    \ | Request Method | Description | Example |\n|---|---|---|--|\n| /api/items |\
    \ GET | Get all items | GET /api/items |\n| /api/items | POST | Add new item |\
    \ POST /api/items |\n| /api/items/id | GET | Get item record | GET /api/items/25\
    \ |\n| /api/items/id | PUT | Update item record | PUT /api/items/15 |\n| /api/items/id\
    \ | DELETE | Delete item record | DELETE /api/items/13 |\n\nTable 10-2 Standard\
    \ REST Routes\n\nTable 10-2 illustrates the typical URL routes for a REST-based\
    \ service.\nIt should be clear from Table 10-2 that, under the REST model, existing\
    \ HTTP verbs, such as GET (get data), POST (create data), PUT (update data), and\
    \ DELETE (remove data), indicate the action to be taken on the specified resource.\
    \ Where required, a unique resource identifier is included with the request URL.\
    \ Any additional arguments, particularly when creating new resources or updating\
    \ existing ones, are passed within the body of the POST or PUT request.\nThe Zend\
    \ Framework includes a Zend_Rest Router component that can automatically enable\
    \ these REST routes for the entire application, for a specific module, or for\
    \ a specific controller. When matching URL requests, this component will automatically\
    \ identify the request method, examine request arguments, and invoke one of the\
    \ corresponding standard actions: indexAction(), getAction(), postAction(), putAction(),\
    \ and deleteAction().nThese five standard actions are defined as abstract methods\
    \ of the Zend_Rest_Controller class. This controller, which itself extends the\
    \ Zend_Controller_Action class, serves as the base for all REST-based controllers\
    \ in the Zend Framework. Here's a controller skeleton that illustrates this more\
    \ clearly:\n\n```\n<?php\nclass Sandbox_Rest_Controller extends Zend_Rest_Controller\n\
    {\n    public function indexAction()\n    {\n        // handle GET requests\n\
    \    }\n\n    public function getAction()\n    {\n        // handle GET requests\n\
    \    }\n\n    public function postAction()\n    {\n        // handle POST requests\n\
    \    }\n}\n```"
