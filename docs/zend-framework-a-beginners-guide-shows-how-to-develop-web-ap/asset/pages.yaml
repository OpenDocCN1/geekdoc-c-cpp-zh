    # Using a Custom Namespace


    The definition in the previous section uses a custom namespace, "Square," which
    is prefixed to the class name. This is a recommended practice for any custom objects
    or libraries that you may create for the application space, as it helps avoid
    name collisions between your definitions and others that may exist in the application
    space. An added benefit is if you register your custom namespace with the Zend
    Framework''s autoloader and then find your definitions correctly in the application
    directory structure, the Zend Framework will automatically find and load them
    at run time.


    With in mind, save the class definition from the preceding code to $APP_DIR/library/Square/Form/Contact.php,
    and then add the following directive to the application configuration file, as
    $APP_DIR/application/configs/autoload.ini, to register the "Square" namespace
    with the autoloader:


    ```

    autoloaderNamespaces[] = "Square_"

    ```


    # CAUTION


    If your classes use an underscore to separate the namespace from the rest of the
    class name, you must include this underscore when registering the namespace with
    the Zend Framework autoloader.


