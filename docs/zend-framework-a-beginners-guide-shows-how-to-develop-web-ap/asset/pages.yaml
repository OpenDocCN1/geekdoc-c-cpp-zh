    \n// result: '2010-12-25T15:56+00:00'\n$this->view->message = $date->get(Zend_Date::ATOM);\n\
    \n// returns: '2010-06-24T16:35:00+00'\n$this->view->message = $date->get(Zend_Date::ISO_8601);\n\
    \n// result: 'Saturday, December 25, 2010'\n$this->view->message = $date->get(Zend_Date::DATE_FULL);\n\
    \n// result: 'December 25, 2010 3:56:00 UTC'\n$this->view->message = $date->get(Zend_Date::DATETIME_LONG);\n\
    }\n```\n\n# TIP\n\nIf the predefined formats don't meet your needs, you can also\
    \ create your custom formats, using either Zend_Date or PHP date() specifiers.\
    \ The Zend Framework manual has more information on this, and you'll find a link\
    \ to the relevant section at the end of this chapter.\n\nZend_Date is also fully\
    \ locale-aware: The component will automatically look for a registered Zend_Locale\
    \ object and, if available, will use the specified locale when formatting date\
    \ and time values. It is also possible to explicitly specify a locale as an argument\
    \ to the Zend_Date object, and have Zend_Date use that value instead. The following\
    \ example, which illustrates these scenarios:\n\n```\n<?php\nclass Sandbox_ExampleController\
    \ extends Zend_Controller_Action{\npublic function dateAction()\n    // define\
    \ and register locale\n    $locale = new Zend_Locale('fr_FR');\n    $registry\
    \ = Zend_Registry::getInstance();\n    $registry->set('Zend_Locale', $locale);\n\
    \n    // create date object\n    // locale will be automatically detected\n  \
    \  $date = new Zend_Date();\n\n    // result: 'vendredi 18 décembre 2009'\n  \
    \  $this->view->message = $date->get(Zend_Date::DATE_FULL);\n```"
