  md: '# Chapter 3: Working with Forms


    | Filter Name | Description |

    |---|---|n| Alnum | Removes non-alphanumeric characters from argument |

    | Alpha | Removes non-alphabetic characters from argument |

    | Digits | Removes non-numeric characters of argument |

    | Int | Returns integer value of argument |

    | Dir | Returns directory name component of argument |

    | BaseName | Returns filename component of argument |

    | RealPath | Returns absolute filesystem path for argument |

    | StringToLower | Converts argument to a lowercase string |

    | StringToUpper | Converts argument to an uppercase string |

    | StringTrim | Removes leading and trailing whitespace from argument |

    | StripNewlines | Removes break characters from argument |

    | HtmlEntities | Converts special characters in argument to their HTML entity
    equivalents |

    | StripTags | Removes HTML and PHP code from argument |

    | Encrypt | Returns encrypted version of argument |

    | Decrypt | Returns decrypted version of argument |

    | NormalizedToLocalized | Returns argument in standard form |

    | LocalizedToNormalized | Returns argument in localized form |

    | Callback | Calls user-defined filter with argument |

    | LowerCase | Converts contents of uploaded file to lowercase |

    | UpperCase | Converts contents of uploaded file to uppercase |

    | Rename | Renames uploaded file |


    **Table 3-2** Input Filters Included with the Zend Framework


    # Using Input Validators


    Filtering input is only part of the package. It''s also extremely important to
    validate user input to ensure that it is in the correct format before using it
    for calculations or saving it to the application''s data store. Improperly validated
    application input can not cause significant data corruption and loss, but it can
    also be embarrassing in the extreme to the proud application developer.


    In order to illustrate the importance of input validation, consider a simple example:
    an online mortgage calculator that allows a user to enter the desired loan amount,
    finance term, and interest rate. Now, let''s assume that the application doesn''t
    include any input validation. And let''s suppose that the user decides to enter
    the string ''ten'', instead of the number 10, into the term field.'
