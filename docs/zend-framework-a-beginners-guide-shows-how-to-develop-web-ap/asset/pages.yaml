  md: "# Chapter 11: Working with User Interface Elements\n\n```\n// create captcha\n\
    ...\n```\n\n```\n// create submit button\n...\n```\n\n```\n// attach elements\
    \ to form\n$this->addElement($name)\n  ->addElement($email)\n  ->addElement($country)\n\
    \  ->addElement($message)\n  ->addElement($captcha)\n  ->addElement($submit);\n\
    }\n```\n\nThis revised definition adds a new Ditto ComboBox to the contact form,\
    \ and specifies the use of a remote Dojo dat for autocomplete suggestions. The\
    \ endpoint for the datastore is also specified, as /default/contact/autocomplete.\
    \ Save the revised object definition to APP_DIR/library/Square/Form/Contact.php\
    \ and keep ready to see how this endpoint is defined.\n\n# Initializing the Dojo\
    \ View Helper\n\nThe next step is to initialize the Dojo helper. If your application\
    \ doesn't use layouts, you can perform this initialization directly in the relevant\
    \ view script. However, since the SQUARE example application makes use of layouts,\
    \ this initialization must be performed within the layout itself.\n\nThis brings\
    \ up an interesting point. As a general rule, it's important to minimize the total\
    \ of remote requests generated by a Web page, because each request adds overhead\
    \ and increases the amount of time a user must wait for the page to load completely.\
    \ With this, it is obviously not very efficient to initialize the Dojo helper\
    \ in the layout script, as it will result in Dojo requests being requested and\
    \ loaded even when they are not needed.\n\nA better approach in this case is to\
    \ configure the Dojo helper in the application bootrapper, but explicitly disable\
    \ so that it is not loaded by every view script. It can then be dynamically enabled,\
    \ as needed, in view scripts that require it.\n\nTo do this, first update the\
    \ application configuration file to enable the resource plugin, by adding the\
    \ following line to:\nresources.view = \"\",\n\nThen, update the application bootstrap\
    \ at $APP_DIR/application/Bootstrap.php with the following method:\n\n```\n<?php\n\
    class Bootstrap extends Zend_Application_Bootstrap_Bootstrap\n```\n\n(continued)"
