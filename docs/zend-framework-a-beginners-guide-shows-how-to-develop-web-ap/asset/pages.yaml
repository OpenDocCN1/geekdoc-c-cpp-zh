  md: "# Chapter 8: Logging and Debugging Exceptions\n\nIt's worth pointing out here\
    \ that in case none of the techniques in the preceding examples fit your application's\
    \ requirements, it's also quite easy to create custom log writers for other data\
    \ storage destinations, simply by extending the Zend_Log_Writer_Abstract class.\
    \ The child class must expose, at minimum, a protected write() method that accepts\
    \ the log message as an input argument, and writes it to the specified destination.\
    \ You'll see an example of one such custom log writer in the next section.\n\n\
    # Adding Data to Log Messages\n\nBy default, every log message contains four keys:\
    \ the log message, the log priority (as a number and a string), and a timestamp\
    \ indicating this message, the message was generated. However, it's possible to\
    \ add user-defined keys to this message, via the Zend_Log object's setItem() method.\
    \ This method accepts two parameters—a key and a value—and attaches this key/value\
    \ pair to the log message. This is particularly useful if you need to include\
    \ additional debugging information in a log message. Here's an example, which\
    \ adds the client IP address and request URL to the log message:\n\n```\nphp\n\
    class SandboxExampleController extends Zend_Controller {\n    public function\
    \ logAction() {\n        // initialize logging engine\n        $logger = new Zend_Log();\n\
    \n        // attach writer to logging engine\n        $writer = new Zend_Log_Writer_Mock();\n\
    \        $logger->addWriter($writer);\n\n        // add client IP and request\
    \ URL to log message\n        $logger->setItem('request', $this->getRequest()->getRequestUri());\n\
    \        $logger->setItem('host', $this->getRequest()->getClientIp());\n\n   \
    \     // write log message\n        $logger->log('Body temperature critical',\
    \ Zend_Log::EMERG);\n    }\n}\n```\n\n# Formatting Log Messages\n\nThe keys included\
    \ in a log message serve a dual purpose: They can also be used as format specifiers\
    \ to create a custom format string for log messages. The Zend_Log_Formatter_Simple\
    \ object uses this format string to control the format in which log messages are\
    \ written to the destination. Format specifiers are enclosed in percentage (%)\
    \ symbols (see the very first code listing in this section for an example)."
