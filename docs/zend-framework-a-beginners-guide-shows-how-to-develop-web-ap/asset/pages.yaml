  md: '# 414 Zend Framework: A Beginner’s Guide


    # Key Skills & Concepts


    +   * Learn to obtain and install MySQL, PHP, and Apache software from the Internet

    * Perform basic testing to ensure the applications are working correctly

    * Find out how to automatically activate all required components on system startup

    * Take basic steps to safeguard the security of your MySQL installation


    In this book, you learned the Zend Framework and how it can be used to build Web
    applications. The examples in this book assumed that you have a correctly configured
    Apache/MySQL/PHP development environment. In case you don''t, this will show you
    how to install and configure these components and create a development environment
    that can be used to run the code examples in this book.


    # CAUTION


    This appendix is intended to provide an overview and guide to installing and configuring
    MySQL, PHP and Apache on UNIX and Windows. It is not intended as a replacement
    for the installation documentation that ships with each software package. If you
    encounter difficulties installing the various programs described here, visit the
    respective program''s Web site or search the Web for detailed troubleshooting
    information and advice (some links are provided at the end of this appendix).


    # Obtaining the Software


    There are a couple of ways you can get an Apache/MySQL/PHP development environment
    running on your Windows or *NIX system:


    +   1. You can download an all-in-one, integrated stack that contains all the
    necessary pieces and dependencies, preconfigured to work.

    2. You can download the different pieces separately and configure them yourself.


    The first approach is recommended if you''re new to PHP, or to open-source development
    in general, as it will get you up and running with minimal heartache. Here are
    two popular stacks you should consider:


    +   * Server Community Edition is an integrated, robust stack by Zend Technologies.
    In addition to the standard Apache/MySQL/PHP components, it also includes a number
    of debugging and optimization tools, plus (as a bonus) the latest version of the
    Zend Framework. It is available for Microsoft Windows, Mac OS, and Linux operating
    systems, and it can be freely downloaded from http://www.zend.com/.'
