    # Model Patterns


    When it comes to working with models, there are two commonly used patterns: the
    DataMapper pattern and the ActiveRecord pattern. The previous example is an illustration
    of the ActiveRecord pattern, in which a class corresponds directly with a database
    table and exposes methods like save(), update(), and delete() to manage the records
    in that table. It should be clear that under this pattern, models and their underlying
    database tables are closely linked, and a change in one necessitates a change
    in the other.


    The DataMapper pattern is slightly different, in that there need not exist a 1:1
    correspondence between the model class and the underlying database table. Rather,
    this pattern uses an in-between layer (the "mapper of the name") to handle the
    task of mapping data from the model class to database fields. In this case, it
    is the mapper class that exposes methods like save(), update(), and fetch(), and
    internally performs the translation necessary to correctly map members to database
    fields. This pattern allows for greater flexibility and a wider variety of configurations
    than the ActiveRecord pattern; the separation of data from data storage also produces
    more readable and maintainable models. That said, it''s more complex to implement
    than the ActiveRecord pattern.


    Which do you use? There''s no easy answer to question, because it''s a lot like
    asking which flavor of ice cream is best. The ActiveRecord pattern, by definition,
    assumes that data storage and models based on this pattern are closely coupled
    with the underlying database structure. This is good for smaller projects or projects
    where the key functions correspond closely to the standard SELECT, INSERT, UPDATE,
    and DELETE commands. The DataMapper pattern allows for explicit separation of
    application-level business rules and data storage, and it is the model itself,
    rather than the underlying database, that is considered the primary data definition
    agent. A corollary of this is that you''re not limited to one database; the mapper
    can just easily map data to other types of storage, such as flat files, XML, or
    LDAP. This pattern is for projects with sophisticated data structures and/or custom
    storage formats, or those where the key functions require more complex interactions
    between application entities.


    # Model Scope


    It''s often hard to draw a line between what goes into a model and what goes into
    a controller. For example, in the bank example described earlier, one might argue
    that the validation related to amounts and locations should be in the controller,
    rather than in the model. In general, the developer community has largely adopted
    the "fat model, skinny controller" approach recommended by various thought leaders,
    including Martin'
