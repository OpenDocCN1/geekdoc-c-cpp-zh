  md: "# 352 Zend Framework: A Beginner’s Guide\n\nbootstrappper and made persistent\
    \ through the application registry. Here’s an example that illustrates how the\
    \ container can be set up:\n\n```\n<?php\nclass Bootstrap extends Zend_Application_Bootstrap_Bootstrap\n\
    {\n    protected function initNavigation()\n    {\n        $config = new Zend_Config_Xml(APPLICATION_PATH\
    \ . '/configs/site.xml');\n        $container = new Zend_Navigation($config);\n\
    \        $registry = new Zend_Registry::getInstance();\n        $registry->set('Zend_Navigation',\
    \ $container);\n    }\n}\n```\n\nOnce this is done, Zend_Navigation view helpers\
    \ automatically access the registered navigation container from within a script\
    \ and turn it into, menus, sitemaps, or breadcrumb trails suitable for use on\
    \ a Web page. The following sections discuss these aspects in detail.\n\n# Menus\n\
    \nThe Zend_Navigation menu helper can automatically turn navigation data into\
    \ a hierarchical set of unordered lists. Here’s an example of how to use it in\
    \ a script:\n\n```\n<php echo $this->navigation()->menu(); ?>\n```\n\n> The output\
    \ of this code is nested, unordered list of links, as shown in Figure 11-1. It’s\
    \ also possible to customize this default output by specifying only the active\
    \ menu branch should be displayed and by defining the depth of the menu tree that\
    \ is. These options are passed to the view helper’s renderMenu() method as an\
    \ associative array. Here’s a revision of the previous example that illustrates\
    \ this:\n\n```\n<?php\necho $this->navigation()\n    ->renderMenu(null, array(\n\
    \        'minDepth' => null,\n        'maxDepth' => 1,\n        'ulClass' => 'nav',\n\
    \        'onlyActiveBranch' => true\n    ));\n?>\n```\n\nFigure 11-2 illustrates\
    \ the resulting output.\n\n# TIP\n\nIf you’d like the menu to be rendered using\
    \ custom markup instead of the default unordered list, you can specify a custom\
    \ view script for the Menu view helper with the setPartial() method."
