    # Ask the Expert


    **Q:** How does refactoring method help in improving performance?


    **A:** Chapter 4 discussed the "fat model, skinny controller" approach, which
    proposes that business logic should be located within methods, rather than controllers,
    wherever possible. In addition to other benefits, this approach can improve performance
    when it is used in combination with caching. As shown earlier in the section "Caching
    Query Results," you can use caching to block the method calls on the model altogether
    if cached result data already exists, reducing the number of lines of code that
    need to be executed. Fewer lines of code automatically translates to faster script
    parsing and execution.


