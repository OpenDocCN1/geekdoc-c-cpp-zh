  md: "# Working with the Dojo Toolkit\n\nThe Dojo Toolkit is a cross-browser JavaScript\
    \ library that includes both a data access layer for AJAX requests and responses\
    \ (Dojo Data) and a set of predefined user interface components (Dijit). These\
    \ components include layout and menu elements, data grids, dialog boxes, forms\
    \ controls as autocomplete inputs and data selectors, and various animated page\
    \ effects. The project is supported by some of the Web's biggest companies, including\
    \ Google, IBM, AOL, and Sun Microsystems.\n\nThe Zend Framework makes it easy\
    \ to get started with the Dojo Toolkit. The full version of the Zend Framework\
    \ comes with a complete distribution of Dojo and Dijit interface components, and\
    \ the framework also includes a Zend_Dojo component that simplifies the task of\
    \ activating and using the Dojo Toolkit in a Web application. This Zend_Dojo component\
    \ includes a data layer implementation, and a helper that assists in setting up\
    \ the Dojo environment, and a set of layout extensions that can be used to add\
    \ Dojo/Dijit functionality to view scripts. The following sections discuss these\
    \ in detail.\n\n# Handling Dojo Data\n\nThe Dojo Toolkit defines a uniform format\
    \ for client-server data exchange, and provides two basic datastores, `dojo.data.ItemReadStore`\
    \ and `dojo.data.ItemWriteStore`, for interacting with data. In its simplest form,\
    \ this data is represented as a structured JSON object and looks something like\
    \ this:\n\n```\n{\n  \"identifier\":\"name\",\n  \"items\": [\n    {\"name\":\"\
    Agatha Christie\"},\n    {\"name\":\"J. K. Rowling\"},\n    {\"name\":\"Dan Brown\"\
    },\n    {\"name\":\"William Shakespeare\"},\n    {\"name\":\"Dennis Lehane\"}\n\
    \  ]\n}\n```\n\nThe `Zend_Dojo_Data` component provides an object-oriented API\
    \ for constructing this JSON representation, adding items to it, iterating it\
    \ over, and querying it for matches. To illustrate, consider the following listing,\
    \ which produces output equivalent to the previous code listing:\n\n```\n<?php\n\
    class Sandbox_ExampleController extends Zend_ControllerAction\n{\n    public function\
    \ dojoAction()\n    {\n        // define data items\n        $authors = array(\n\
    \            'Agatha Christie', 'J. K. Rowling', 'Dan Brown',\n```"
  merge: -1
  pgno: 379
- img_proc: true
  md: "# 362 Zend Framework: A Beginner’s Guide\n\n```\n'William Shakespeare', 'Dennis\
    \ Lehane'\n);\nforeach ($authors as $sa) {\n$items[] = array('name' => $sa);\n\
    }\n```\n\n```\n// initialize object and pass data items\n$data = new Zend_Dojo_Data('name',\
    \ $items);\n```\n\n```\n// output as structured JSON\necho $data->toJson();\n\
    ```\n\nAs illustrated in this example, the object is initialized simply by passing\
    \ the object\nconstructor name of the unique identifier field (in this case, 'name')\
    \ and an array of data\nitems. These data items must be expressed as associative\
    \ arrays (or objects implementing\ntoArray() method), and must include the specified\
    \ identifier as one of the array keys.\\ Once initialized, the object may be exported\
    \ either as a PHP array or a JSON string, via the\ntoArray() or toJson() method.\n\
    \n# TIP\n\nThe Zend_Dojo_Data component comes in particularly handy when implementing\n\
    endpoints for Dojo/Dijit AJAX requests. You'll see an example of this further\
    \ along in\nthis chapter.\n\n# Using the Dojo View Helpers\n\nTypically, initializing\
    \ the Dojo components in a Web page involves the Dojo\nlibrary files, initializing\
    \ the Dojo parser, and enabling the required components, passing along\nconfiguration\
    \ options as necessary. While this can be done manually within your\nview scripts,\
    \ the Zend Framework provides an easier way: the Dojo view helper, which can\n\
    \"Dojo-ify\" by a automatically generating all the client-side initialization\
    \ code\n\nHere's an example of using the Dojo view helper in a view script:\n\n\
    ```\n<php\nZend_Dojo::enableView($this);\n$this->dojo()->setLocalPath('/js/dojo/dojo.js')\n\
    \    ->addStylesheet('dijit.themes.tundra')\n    ->setDijConfig('parseOnLoad',\
    \ true)\n    ->setDojoConfig('locale', 'en-US')\n    ->setDojoConfig('isDebug',\
    \ true);\necho $this->dojo();\n?>\n```\n\nFigure 11-7 illustrates the markup generated\
    \ by the helper from the previous listing."
