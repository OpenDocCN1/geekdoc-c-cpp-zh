  md: '# 428 Zend Framework: A Beginner’s Guide


    # Setting the MySQL Super-User Password


    When MySQL is first installed, access to the database server is restricted to
    the MySQL administrator, aka ''root''. By default, this user is initialized with
    a blank password, which is generally considered a Bad Thing. You should therefore
    rectify this as soon as possible by setting a password for this user via the mysqldadmin
    utility, using the following syntax in UNIX:


    ```

    [root@host]# /usr/local/mysql/bin/mysqldadmin -u root password ''new-password''

    ```


    In Windows, you can use the MySQL Server Configuration Wizard, which allows you
    to set or reset the MySQL administrator password (see the section entitled “Installing
    on Windows” for more details).


    This password change goes into effect immediately, with no requirement to restart
    the server.


    # Summary


    As open-source applications, MySQL, Apache, and PHP are available for a wide variety
    of platforms and architectures, in both binary and source forms. This appendix
    demonstrated the process of installing and configuring these software components
    to create a PHP development environment on the two most common platforms, UNIX
    and Windows. It also showed how to configure your system to launch these components
    automatically every time the system starts up, and it offered some tips on based
    on MySQL security.


    To read more about the installation processes outlined in this appendix, or for
    detailed troubleshooting advice and assistance, consider visiting the following
    pages:


    +   - MySQL installation notes, at

    - http://mysql.com/doc/refman/5.1/en/installing-binary.html


    +   - General guidelines for compiling Apache on UNIX, at

    - http://httpd.apache.com/docs/2.2/install.html


    +   - Windows-specific notes for Apache installations, at

    - http://httpd.apache.com/docs/2.2/platform/windows.html


    +   - Installation instructions for PHP on Windows, at

    - http://www.php.net/manual/en/install.windows.php


    +   - Installation instructions for PHP on UNIX, at

    - http://www.php.net/manual/en/install.unix.php


    +   - Installation instructions for PHP on Mac OS X, at

    - http://www.php.net/manual/en/install.macos.php'
