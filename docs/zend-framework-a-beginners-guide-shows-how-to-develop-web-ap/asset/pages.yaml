  md: '# Chapter 9: Understanding Application Localization 309


    # Summary


    As this chapter demonstrates, Zend Framework includes everything you need to fully
    localize your application to different languages and countries. The Zend_Locale
    component provides a framework for defining the application locale, either through
    a manual setting at design time or through a process of autodetection at runtime.
    In either case, Zend Framework components, such as Zend_Date, Zend_Currency, and
    Zend_Measure, have the ability to automatically detect this locale and adjust
    their behavior to reflect local conventions for dates, currencies, and measurements.


    The most complex aspect of any localization project involves translating application
    to different languages, and here too the Zend Framework offers a solution in the
    form of Zend_Translate. Zend_Translate provides a flexible API for working with
    translations in many different formats, and it can automatically integrate with
    Zend_View through the translation view helper to simplify the task of run-time
    localization.


    All these aspects of localization were illustrated in the SQUARE example which,
    at the end of this chapter, now supports four locales and is capable of presenting
    dates, numbers and (some) content in the user''s current or selected language.
    While a complete localization exercise is not possible within the limited confines
    of this book, this exercise nevertheless give you some insight into the process,
    and the foundation for future research.


    To learn more about the topics discussed in this chapter, consider visiting the
    following links:


    +   - The Zend_Locale component, at http://framework.zend.com/manual/en/zend.locale.html

    - The Zend_Date component, at http://framework.zend.com/manual/en/zend.date.html

    - The Zend_Date formatifiers, at http://framework.zend.com/manual/en/zend.date.constants.html

    - The Zend_Currency component, at http://framework.zend.com/manual/en/zend/currency.html

    - The Zend_Currency exchange rate conversion, at http://framework.zend.com/manual/en/zend.currency.exchange.html

    - The Zend_Measure component, at http://framework.zend.com/manual/en/zend/measure.html

    - The Zend_Translate component, at http://framework.zend.com/manual/en/zend/translate.html

    - The Zend_Translate directory layouts for source files, at http://framework.zend.com/manual/en/zend.translate.using.html

    - The GNU gettext project, at http://www.gnu.org/software/gettext/

    - The ISO 639 standard (language codes), at http://www.iso.org/iso/support/faqs/widely_used_standards/widely_used_standards_other/language_codes

    - The ISO 3166 standard (country codes), at http://www.iso.org/iso/support/faqs/widely_used_standards/widely_used_standards_other/country_name_codes.htm'
