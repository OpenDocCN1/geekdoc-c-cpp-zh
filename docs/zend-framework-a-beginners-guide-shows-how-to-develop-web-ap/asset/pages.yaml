  md: '# Ask the Expert


    **Q**: Why do I need to escape output before displaying it?


    **A**: As a general rule, you shouldn''t trust any data that comes from an external
    source. This is because it''s always possible for attackers to embed malicious
    content into this data and, if you use it without cleaning it, you might be putting
    your application''s users at risk. A common example of this type of exploit is
    “cross-site scripting attack”, wherein an attacker is able to gain access to sensitive
    user data by piggybacking malicious JavaScript code or HTML form code into your
    Web pages. With this in mind, it''s always essential to pass output through a
    sanitation routine before displaying it to the user.


    # Summary


    Previous chapters have focused on views and controllers, this one focused on models:
    what they are, how they work, and what role they play in an MVC application. Although
    the Zend Framework doesn''t come with a dedicated model component, it''s never
    quite easy to create your own or integrate third-party models, such as those generated
    by the Doctrine ORM package. This chapter demonstrated the process, showing how
    to use Doctrine models and configure them in the context of a Zend Framework application.
    It also introduced you to the Zend_Filter_Input component, a useful tool for ad-hoc
    input filtering and validation, and the Bootstrap class, which provides a framework
    for initializing application routines at time.


    The SQUARE example is now significantly simpler as well. It has a database for
    persistent storage, and a controller that can interact with to retrieve and display
    database records. More importantly, it has a set of robust, extensible models.
    This will not simplify data access and manipulation, but it will also provide
    a basis for the more advanced functionality discussed in later chapters of this
    book.


    To learn more about the topics discussed in this chapter, consider visiting the
    following links:


    +   - The official Doctrine Web site and manual, at http://www.doctrine-project.org/
    and http://www.doctrine-project.org/documentation/manual_1/en


    +   - An introduction to Doctrine models, at http://www.doctrine-project.org/documentation/manual_1/en/introduction-to-models


    +   - Information on how to express database relationships using Doctrine models,
    at http://www.doctrine-project.org/documentation/manual_1/en/defining-models


    +   - Sample queries using Doctrine, at http://www.doctrine-project.org/documentation/manual_1_0/working-with-models'
