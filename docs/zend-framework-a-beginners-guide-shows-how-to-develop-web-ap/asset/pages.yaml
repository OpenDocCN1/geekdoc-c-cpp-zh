  md: "# Chapter 9: Understanding Application Localization 293\n\n```\n$translate->_('two'),\n\
    $translate->_('three');\n\n}\n```\n\nIt is important to note that if ZendTranslate\
    \ is unable to find a translation source for a fully qualified locale, it will\
    \ automatically “degrade” the locale and use the translation source that matches\
    \ the degraded locale. For example, if the application locale is set to fr_LU\
    \ (language: French; country: Luxembourg) but no translation source is available\
    \ for the fr_LU locale, Zend_Translate will automatically use the translation\
    \ source for the fr locale instead, if available.\n\n# Using the Translation View\
    \ Helper\n\nThe examples in the previous sections have demonstrated translation\
    \ operations within the scope of the controller. In reality, however, the correct\
    \ approach is to perform translation operations within the scope of the view script\
    \ rather than of the controller. Zend_Translate includes a translation view helper,\
    \ which can be used to perform operations within a view script.\n\nTo use the\
    \ translation view helper, it is necessary to first register the Zend_Translate\
    \ object in the application registry, such that it is accessible throughout the\
    \ application. Here’s an example of how to do this:\n\n```\n<?php\nclass Bootstrap\
    \ extends Zend_Application_Bootstrap_Bootstrap\n{\n    protected function _initTranslate()\n\
    {\n        // initialize and register translation object\n        $translate =\
    \ new Zend_Translate('array',\n            APPLICATION_PATH . '../languages/',\n\
    \            null,\n            array('scan' => Zend_Translate::LOCALE_FILENAME));\n\
    \        $registry->set('Zend_Translate', $translate);\n    }\n}\n```\n\nOnce\
    \ this is done, translation can be performed within a view script simply by calling\
    \ the object’s translate() method, as shown in the following code. In this manner,\
    \ the translation view helper will retrieve the corresponding local-language string\
    \ and interpolate it into the view script before rendering the view.\n\n```\n\
    <div id=\"header\">\n<?php echo $this->translate('welcome'); ?>\n</div>\n```"
