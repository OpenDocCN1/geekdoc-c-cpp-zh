    \ this via its gql() method, which returns the raw SQL of a query for inspection.\n\
    \n# Adding, Updating, and Deleting Records\n\nAdding a new record to the database\
    \ using a Doctrine model is simplicity itself: Simply instantiate an instance\
    \ of the model, set field values as model properties, and call the model’s save()\
    \ method. Here’s an example:\n\n```\n<?php\n$member = new Member;\n$member->FirstName\
    \ = 'Jack';\n$member->LastName = 'Frost';\n$member->Email = 'jack@example.com';\n\
    ```\n\n# Ask the Expert\n\n**Q:** Does DQL support right joins?\n\n**A:** No.\
    \ DQL currently supports left joins and inner joins. But this shouldn’t slow you\
    \ down, because left and right joins are interchangeable, depending on which side\
    \ of the join you are standing on. To illustrate, consider the following two queries:\n\
    \n```\nSELECT * FROM c LEFT JOIN a USING (id)\nSELECT * FROM a RIGHT JOIN c USING\
    \ (id);\n```"
