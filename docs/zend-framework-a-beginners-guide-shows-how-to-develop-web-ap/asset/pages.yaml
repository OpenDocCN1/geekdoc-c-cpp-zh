    # NOTE


    It’s worth pointing out that there is an easier way to serve static pages in a
    Zend Framework application: You can simply place them in the $APP_DIR/public/directory
    as HTML files, and link to them manually. However, these pages would not be able
    to use any of the Zend Framework’s built-in features, such as global layouts,
    routes, caching, or security, and, this approach is not usually recommended.


    # Summary


    Now that you are at the end of this chapter, you should have a deeper understanding
    of what goes into making a Zend Framework application tick. This chapter began
    with an introduction to the Model-View-Controller design pattern, explaining what
    models, views, and controllers are and how they interact with each other to produce
    a logically separated, layered application. It also introduced important concepts,
    such as modules, layouts, and the front controller, and explained the basics of
    how users are requested and handled in an application context. Finally, it applied
    all this theory to the real world, by beginning the process of customizing and
    enhancing the simple test application created at the end of the previous chapter.


    The SQUARE example application is still in its early stages: It has a customized
    layout, knows how to deal with modules, and can serve up static content. This
    might not seem like much, but implementing this very basic functionality will
    have helped you understand the main principles of MVC-based development with the
    Zend Framework and created a solid foundation for the more advanced material in
    subsequent chapters.


    To learn more about the topics discussed in this chapter, consider visiting the
    following links:


