    # Installing Apache and PHP


    PHP can be integrated with the Apache Web server in one of two ways: as a dynamic
    module that is loaded into the Apache Web server at runtime, or as a static module
    that is integrated into the Apache source tree at build time. Each alternative
    has advantages and disadvantages:


    +   Installing PHP as a dynamic module makes it easier to upgrade your PHP build
    at a later date, as you only need to recompile the PHP module and not the rest
    of the Apache Web server. On the flip side, with a dynamically loaded module,
    performance tends to be lower than with a static module, which is more closely
    integrated with the server.


    +   Installing PHP as a static module improves performance, because the module
    is compiled directly into the Apache source tree. This choice has an important
    drawback: if you ever decide to upgrade your PHP build, you will need to reintegrate
    the newer PHP module into the Apache source tree and recompile the Apache Web
    server.


    This section shows how to compile PHP as a dynamic module that is loaded into
    the Apache server at run time.


    +   1. Ensure that you are logged in as your system’s root user.


    ```

    [user@host] # su - root

    ```


    +   2. Extract the contents of the Apache source archive to your system’s temporary
    directory.


    ```

    [root@host] # cd /tmp

    [root@host] # tar -xzvf /tmp/httpd-2.2.14.tar.gz

    ```


    +   3. To enable PHP dynamically, the Apache server must be compiled with Dynamic
    Shared Object (ISO) support. This support is enabled by passing the --enable-module=so
    option to the Apache configure script, as follows:


    ```

    [root@host] # cd /tmp/httpd-2.2.14

    [root@host] # ./configure --prefix=/usr/local/apache

    --enable-module=so --enable-rewrite

    ```


    +   4. Now, compile the server using the make command, and install it to the system
    make install.


    ```

    [root@host] # make

    [root@host] # make install

    ```


    Figure-A-2 illustrates what you might see during the compilation process.


    Apache should now have been installed to /usr/local/apache/.


    +   5. Next, proceed to compile and install PHP. By beginning extract the contents
    of the PHP source archive to your system’s temporary directory.


    ```

    [root@host] # cd /tmp

    [root@host] # tar -xzvf /tmp/php-5.3.1.tar.gz

    ```'
