  md: '# Creating REST-Based Web Services


    # Understanding REST Routes


    In addition to providing a comprehensive set of tools for accessing and integrating
    news feeds and Web services into a PHP application, the Zend Framework also makes
    it easy to expose application functionality by building your own REST-based services.
    This is usually accomplished through the Zend_Rest_Route and Zend_Rest_Controller
    components, discussed in the following section.


    There are two key principles of REST-based architecture:


    +   - An application is made up of multiple resources, each of which can be accessed
    with a unique URL.

    - The method used to access a resource determines the action that is to be taken
    on that resource.


    ![](img/222e7e58871b088cc6397852e1452b57_350_0.png)'
