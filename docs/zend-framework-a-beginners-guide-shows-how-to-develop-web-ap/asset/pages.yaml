  md: '# Zend Framework: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Dynamically generate and execute database search queries

    - Learn to store and index different types of data

    - Create a full-text search engine with the Zend_Search_Lucene component

    - Understand how to enable output type switching at run

    - Express the same output in many different formats, including XML


    Have you ever seen a sponge in a bucket of water? For the first minute or two,
    while it’s mostly dry, it floats happily on the surface, without a care in the
    world. As it sucks up more and water, it gradually submerges, until it’s completely
    wet and ready for use. A user-facing Web application is a lot like this. When
    it’s first launched on the Web, it’s little more than an empty shell, waiting
    for the world to notice. As it attracts users, it begins soaking up, and positive
    network effects start to take over: The more people who use it, the more valuable
    it becomes to others.


    What does this have to do with anything? Well, as your application starts accumulating
    content, it becomes more and more important to have this content searchable and
    accessible in different formats, that users can exploit it for different purposes
    (for example, mashing it up with content from other services). Simply providing
    a browsing index of database contents won’t cut it; you also need to offer users
    different ways to search data and filter results, and different formats in which
    to express these search results.


    That’s where this comes in. Over the next few pages, it will introduce you to
    the basics of adding search functionality to a Web application, with examples
    of both filter-based and full-text searches. It will also discuss the Zend Framework’s
    ContextSwitch helper, which provides a flexible and extensible system for handling
    multiple output types, including XML and JSON.


    # Try This 6-1 Searching and Filtering Database Records


    In the previous chapter, you built an interface for users to upload items to the
    product catalog and for administrators to review and approve these items for display
    on the public Web site. This section will build on the work done in the previous
    chapter, creating an interface for users to browse approved items and filter them
    by various criteria.


