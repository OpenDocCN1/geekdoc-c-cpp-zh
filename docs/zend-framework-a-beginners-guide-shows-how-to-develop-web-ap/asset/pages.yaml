  md: "# 70 Zend Framework: A Beginner’s Guide\n\n# Filtering and Validating Form\
    \ Input\n\nAs a Web application developer, there's one unhappy fact that you'll\
    \ have to learn live with: There are always going to be people who get their chuckles\
    \ from finding loopholes in your code and exploiting these loopholes for malicious\
    \ purposes. Therefore, one of the most important things a developer can do to\
    \ secure an application is to properly filter and validate all the input passing\
    \ through it.\n\nThe following sections discuss the filtering and validation tools\
    \ available in the Zend Framework, together with examples of how they can be used\
    \ with Web forms to make your application secure.\n\n# Using Input Filters\n\n\
    Most of the time, input exploits consist of sending your application clearly devalued\
    \ values that \"trick\" it into doing something it really, really shouldn't. A\
    \ common example of this type of exploit is the SQL injection attack, where an\
    \ attacker manipulates your database with an SQL query embedded inside form input.\
    \ Therefore, one of the most important things a developer must do before using\
    \ any input supplied by the user is to \"sanitize\" it by removing any special\
    \ characters or symbols from it.\n\nPHP has various functions to assist developers\
    \ in the task of sanitizing input. For example, the `htmlspecialchars()` escapes\
    \ special characters (like quotes and backlashes) in input so that can be safely\
    \ entered into a database, the `strip_tags()` function strips all the HTML and\
    \ PHP tags out of a string, returning only the ASCII content. There's also the\
    \ `htmlspecialchars()` function, which is commonly used to replace special characters\
    \ like `&`, `<`, and `> ` ` with their corresponding HTML entity values, rendering\
    \ them harmless.\n\nHere's an example of sanitizing input with the `htmlspecialchars()`\
    \ function:\n\n```\n<?php\n// array of sanitized data\n$sanitized = array();\n\
    \n// strip tags from POST input\nif (isset($_POST['name']) && !empty($_POST['name']))\
    \ {\n    $sanitized['name'] = htmlspecialchars($_POST['name']);\n}\n\n// processing\
    \ code //\n?>\n```\n\nWhen filtering input, the Zend Framework provides a comprehensive\
    \ set of input filters, which can either be attached to form elements with the\
    \ `addFilter()` method or used on a standalone-basis for ad-hoc input sanitization.\
    \ Here's an example of the EntitiesFilter on a text input field:\n\n```\n<?php\n\
    class Form_Example extends Zend_Form\n```"
