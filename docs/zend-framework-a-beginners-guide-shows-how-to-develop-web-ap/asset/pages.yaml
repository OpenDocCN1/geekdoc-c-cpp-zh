    **Figure 10-7** The API response to a POST request


    And finally, POST-ing an array of data to the URL http://square.localhost/api/catalog
    will result in the creation of a new item record in the database, and a reference
    to the item URL will be returned to the client (see Figure 10-7).


    # # Summary


    Most blogs and news sites use RSS or Atom feeds that can be used to syndicate
    new content to third-party applications. Writing parsers to consume these feeds
    is a common application development task, and the Zend Framework simplifies it
    by providing a set of predefined components to generate, modify, and parse news
    feeds. This chapter discussed these components in detail, illustrating how they
    could be used to integrate feeds from online news sources into the SQUARE example
    application.


    By allowing third-party access to an application''s functions, Web services enable
    a new range of "mashups" and spin-off products that integrate data from multiple
    sources while encouraging innovation. The Zend Framework makes it easy to jump
    on the Web service bandwagon: it includes generic clients for REST and SOAP access,
    as well as ready implementations for Web services exposed by popular applications
    such as Google, Amazon, and Twitter. This chapter demonstrated some of these implementations,
    and illustrated the basics of creating a REST-based Web service from scratch using
    the SQUARE example.


    To learn more about the topics discussed in this chapter, visiting the following
    links:


