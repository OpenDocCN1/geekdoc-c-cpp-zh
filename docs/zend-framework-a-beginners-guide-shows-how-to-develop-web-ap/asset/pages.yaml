  md: "# Chapter 7: Paging, Sorting, and Uploading Data 213\n\n# ## Try This 7-2 Enabling\
    \ Image Uploads\n\nWith all this background information at hand, let's consider\
    \ updating the SQUARE example by allowing sellers to add up to three photographs\
    \ to their catalog entries. The following sections discuss how to enable this\
    \ feature.\n\n# Defining the Upload Destination\n\nThe first step is to define\
    \ a definition for uploaded images. Since these images will eventually be displayed\
    \ in the public catalog and therefore must be accessible by unauthenticated URL\
    \ requests, it makes sense to store them under the $APP_DIR/public/ directory\
    \ hierarchy. So, create the $APP_DIR/public/uploads/, as follows:\n\n```\nshell\
    \ cd /usr/apache/htdocs/square/public\nsmkdir uploads\n```\n\nSince different\
    \ controllers and actions will require this information, it also makes sense to\
    \ centralize it in the application configuration file. Open the application configuration\
    \ file, at $APP_DIR/application/configs/application.ini, and add the following\
    \ directive to it: uploads.uploadPath = APPLICATION_PATH ../public/uploads\n\n\
    # ## Updating the Form Definition\n\nThe next step is to update the form for creating\
    \ new catalog entries with additional file elements. To do this, update the form\
    \ definition, at $APP_DIR/library/Square/FormItemCreate.php, with the changes\
    \ highlighted in bold:\n\n```\n<?php\nclass Square_Form_ItemCreate extends Zend_Form\n\
    {\n    public function init()\n    {\n        // initialize form\n        $this->setAction('/catalog/item/create')\n\
    \            ->setMethod('post');\n        // element definitions abbreviated\
    \ due to space constraints /\n// refer to Chapter 4 or the code archive //\n//\
    \ for the complete form definition //\n        // create file input for item images\n\
    $images = new ZendForm Element_File('images');\n$images->setMultiFile(3)\n```\n\
    \n(continued)"
  merge: -1
