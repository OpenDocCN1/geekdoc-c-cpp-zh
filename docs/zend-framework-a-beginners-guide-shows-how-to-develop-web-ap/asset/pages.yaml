  md: "# Zend Framework: A Beginner’s Guide\n\nAs these two examples illustrate, the\
    \ Zend Framework makes it easy to access any SOAP-REST-based Web service, even\
    \ if a service-specific implementation does not already exist without requiring\
    \ extensive knowledge of service intervals. This makes it a valuable tool for\
    \ rapid and efficient integration of third-party Web services into a PHP application.\n\
    \n# TIP\n\nNotice the getLastRequest() and getLastResponse() methods in the previous\
    \ listings. These methods come in very handy for debugging SOAP and REST transactions,\
    \ and for verifying the contents of request and response packets.\n\n# Try This\
