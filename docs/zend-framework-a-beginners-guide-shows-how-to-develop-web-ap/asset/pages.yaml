  md: '# Chapter 12: Optimizing Performance 385


    Figure 12-3 An Xdebug profile of a Zend Framework request, as viewed in Webgrid


    Once configured, Xdebug will automatically profile every script executed through
    the PHP interpreter. Profile reports are formatted as cachegrind files, which
    may be viewed with a number of open-source tools, such as WinCacheGrind (Windows
    desktop), KCacheGrind (*NIX desktop), or Webgrid (PHP Web Application). Profiles
    are stored in the output directory specified in the xdebug.output_dir variable
    in php.ini configuration file.


    Figure 12-3 illustrates what a profile might look like.


    This type of profiling information is very useful to understand, for example,
    which method calls or framework components are taking up the majority of processing
    time and therefore are reasonable targets for optimization or substitution by,
    other libraries.


    # NOTE


    PHP''s Xdebug extension is installed in the usual way, in PHP''s ext/ directory,
    and is activated by adding the xdebug.extension_ts=/path/to/xdebug/ directive
    to the php.ini configuration file. You must also specify the xdebug.profiler_enable,
    xdebug.output_dir, and xdebug.trace_output_dir variables in the configuration
    file. For detailed installation instructions, see the Xdebug Web site link at
    the end of this chapter.


    An alternative to Xdebug is the PEAR Benchmark class, which provides an API to
    benchmark function calls. In this case, the benchmarking tool is embedded within
    specific actions, wrapping action code within calls to its start() and stop()
    methods. These'
