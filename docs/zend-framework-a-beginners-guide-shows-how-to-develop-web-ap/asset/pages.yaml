    # Installing on Windows


    Compiling applications on Windows is a challenging process, especially for novice
    developers. With this, it is advisable for users to focus on installing and configuring
    prebuilt binary releases of MySQL, SQLite, PHP, and Apache, instead of attempting
    to complete them from source code. These releases can be downloaded from the Web
    sites listed earlier, in the section “Obtaining the Software,” and are to be installed
    one after another, as outlined in the following subsections.


    # Installing MySQL


    MySQL is available in both source and binary forms for all 32-bit and 64-bit versions
    of Microsoft Windows. Most often, you will want to use either the “Essentials”
    or “Complete” binary distributions, which include an automated installer to get
    MySQL up and running in just a few minutes.


    To install MySQL from a binary distribution, use the following steps:


    +   1. Log in as an administrator (if you’re using Windows XP/Vista/7).


    +   2. Double-click the mysql-*,msi file to begin the installation process. You
    should see a welcome screen. (see Figure A-3).'
