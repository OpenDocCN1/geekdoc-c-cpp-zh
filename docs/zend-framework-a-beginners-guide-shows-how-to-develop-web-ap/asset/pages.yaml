  md: "# Zend Framework: A Beginner’s Guide\n\n```\n// create date object\n// pass\
    \ it locale or locale object\n$locale = new Zend_Date('de_DE');\n$date = new Zend_Date($locale);\n\
    ```\n\n```\n// result: 'Freitag, 18. Dezember 2009 '\n$this->view->message = $date->get(Zend_Date::DATE_FULL);\n\
    }\n```\n\nZend_Date also natively supports time zones via its getTimezone() and\
    \ setzone methods, and automatically adjusts dates and times based on the selected\
    \ time zone. Here’s a simple example that illustrates this:\n\n```\n<php\nclass\
    \ Sandbox_ExampleController extends Zend_ControllerAction\n{\n    public function\
    \ dateAction() {\n        // set date using string\n        $date = new Zend_Date('25/12/2010\
    \ 15:56');\n\n        // set time to UTC\n        $date->setTimezone('UTC');\n\
    \n        // result: '2010-12-25T15:56+00:00'\n        $this->view->message =\
    \ $date->get(Zend_Date::ISO_8601);\n\n        // set time to IST\n        $date->setTimezone('Asia/Calcutta');\n\
    \n        // result: '2010-12-25T21:26+05:30'\n        $this->view->message =\
    \ $date->get(Zend_Date::ISO_8601);\n    }\n}\n```\n\n# Localizing Currencies\n\
    \nEvery country (with the exception of the Eurozone) has its own currency, making\
    \ currency localization a key aspect of application development. As with dates\
    \ and times, Zend_Framework includes a Zend_Currency component designed specifically\
    \ to handle this task. This component provides methods to create currency strings\
    \ that conform to local conventions, complete with currency symbol or short or\
    \ long name. It also exposes methods to retrieve information on the regions where\
    \ a specified currency is in circulation, and to list the currencies that are\
    \ in circulation in a specified region."
  merge: -1
