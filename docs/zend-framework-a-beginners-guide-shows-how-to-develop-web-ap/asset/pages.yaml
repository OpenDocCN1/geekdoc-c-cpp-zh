  md: "# Chapter 9: Understanding Application Localization 277\n\nto a reasonable\
    \ value, based on a “best guess” assumption about the application’s primary audience.\
    \ For example, if the application is an e-commerce store aimed at users in India,\
    \ it is reasonable to set the default locale to hi_IN in cases where no other\
    \ locale information can be detected. Here’s an example of how this can be:\n\n\
    ```\n<?php\nclass Bootstrap extends Zend_Application_Bootstrap_Bootstrap\n{\n\
    \    protected function __initLocale()\n    {\n        // try to auto-detect locale\n\
    \        // if fail, set locale manually\n        try {\n            $locale =\
    \ new Zend_Locale('browser');\n        } catch (Zend_Locale_Exception $e) {\n\
    \            $locale = new Zend_Locale('hi_IN');\n        }\n\n        // register\
    \ locale\n        $registry = Zend_Registry::getInstance();\n        $registry->set('Zend_Locale',\
    \ $locale);\n    }\n}\n```\n\n# CAUTION\n\nIt is important to note that Zend_Locale\
    \ will not throw an exception if the locale identifier detected only the language\
    \ code and not the region code. For example, some client and/or server environments\
    \ may simply return the locale en or fr. This situation can sometimes create a\
    \ problem when Zend_Locale is used with other locale-aware classes such as Zend_Currency.\
    \ There is no real solution to this problem, apart from manually setting the locale\
    \ based on available facts and a “best guess” estimate. A proposed feature in\
    \ Zend_Locale will, in the future, allow “locale upgrading,” wherein partially\
    \ qualified locale identifiers (for example, en) will be automatically converted\
    \ to fully qualified locale identifiers (for example, en_US).\n\n# Localizing\
    \ Numbers\n\nThe Zend_Locale component includes a subcomponent, Zend_Locale_Format,\
    \ which is designed expressly to assist in the task of localizing numeric values.\
    \ This component includes a static toNumber() method that can be used to present\
    \ numbers in locale-specific conventions. Here’s an example:\n\n```\n<?php\nclass\
    \ Sandbox_ExampleController extends Zend_Controller_Action\n{\n```"
