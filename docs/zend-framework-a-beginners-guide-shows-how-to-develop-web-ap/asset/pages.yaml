  md: '170 Zend Framework: A Beginner’s Guide


    # Ask the Expert


    **Q:** Can I use Zend_Auth to grant or deny access to application resources on
    the basis of user roles or privileges?


    **A:** As the Zend Framework manual points out, Zend_Auth is concerned with user
    authentication (verifying that a user is who he or she claims to be) and not with
    user access control (verifying that a user has rights to access specific applications).
    In practical terms, this means that if authenticated, a user can access any or
    all of the protected actions; the system does not allow for fine-grained control
    over which user has which action(s). If your application needs to control specific
    actions based on user roles, you should consider using the Zend_Acl component
    instead.


    # Summary


    This chapter focused on two of the most common tasks you''ll encounter when building
    Web applications: implementing CRUD operations and authenticating users. Building
    on the techniques discussed in previous chapters, it showed how to list, create,
    update, and delete database records using the MVC paradigm. It also introduced
    you to the Zend_Auth component and explained how it can be used to protect access
    to specified actions with a simple user authentication system.


    At the end of this chapter, the SQUARE example application has a lot of meat on
    its bones. Users are now able to directly add items for sale to the online catalog,
    while administrators have the capability to review these listings, approve them
    for display, modify them, or delete them through a reasonably fully-fledged administration
    panel. Access to these administrative functions is protected through a basic login/logout
    system, and there are even couple of nice touches, such as the ability to automatically
    redirect to the originally requested action post-login and a main menu that "knows"
    whether or not a user is currently logged in.


    Implementing these functions should have given you some insight into how the different
    components of the Zend Framework can be combined to satisfy real-world requirements.
    Remember that you can read more about the topics discussed in this chapter by
    visiting the:


    +   - The Zend_Controller component, at

    http://framework.zend.com/manual/en/zend.controller.html

    - The Zend_Layout component, at

    http://framework.zend.com/manual/en/zend.layout.html

    - The Zend_Auth component, at

    http://framework.zend.com/manual/en/zend.auth.html'
