  md: "# Breadcrumb Trails\n\nThere's also a Breadcrumbs navigation helper, which\
    \ automatically creates breadcrumb trails based on the currently requested URL.\
    \ In this case too, it's possible to customize the appearance of the breadcrumbs,\
    \ including the separator, the indentation, and whether or not the last breadcrumb\
    \ should be rendered as a link. Here's an example of how to use this helper in\
    \ a view script:\n\n```\n<?php\necho $this->navigation()\n  ->breadcrumbs()\n\
    \  ->setLinkLast(true)\n  ->setSeparator(' / ');\n?>\n```\n\nFigure 11-3 illustrates\
    \ the output."
