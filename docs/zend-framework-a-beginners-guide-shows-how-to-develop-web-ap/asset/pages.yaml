    # Working with Doctrine Models


    Before going any further, let''s take a quick diversion into the world of Doctrine
    models. As discussed earlier, Doctrine models implement the ActiveRecord pattern,
    wherein each instance of the model class represents a record of the underlying
    table, and each property of the instance represents a field of the record. Models
    extend the Doctrine_Record base class, which exposes a number of methods to simplify
    the work of adding, editing, deleting, and searching for records. The following
    sections examine these aspects in more detail.


    # Retrieving Records


    There are a couple of different ways to retrieve records using a Doctrine model.
    If you have the record’s primary key, one approach is to use the find() method,
    as follows:


    ```

    <?php

    $member = Doctrine::getTable(''Member'')->find(1);

    var_dump($member->toArray());

    ?>

    ```


    If you’d prefer to fetch all the available records, you can use the findAll()
    method, as follows:


    ```

    <?php

    $members = Doctrine::getTable(''Members'')->findAll();

    var_dump($members->toArray());

    ?>

    ```


    Doctrine has its own variant of SQL called Doctrine Query Language (DQL), which
    provides a flexible interface to creating and executing database queries. This
    offers an alternative, and more flexible, option for retrieving records from a
    database. Consider the following simple example, which retrieves all records as
    an array:


    ```

    <?php

    $q = Doctrine_Query::create()

    ->from(''Member m'');

    $result = $q->fetchArray();

    ?>

    ```'
