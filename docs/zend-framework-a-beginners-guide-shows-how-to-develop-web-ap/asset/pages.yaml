    The previous chapter gave you a crash course in the basics of creating, validating,
    and processing forms using the Zend Framework. However, form input doesn’t just
    go into a vacuum; it has to go somewhere. More often than not, “somewhere” is
    a database, such as MySQL, SQLite, or PostgreSQL, so adding database support to
    an application becomes a key task for the application developer.

    A database is only part of the puzzle: you need models to interact with it. Models,
    which are logically independent of controllers, serve as the application’s “data
    layer” and provide all the functions necessary to manipulate application data.
    The Zend Framework makes it easy to write models that are specific to your application’s
    requirements; you can also integrate models generated by popular third-party tools
    like Doctrine and Propel.

    This chapter will take your Zend skills up another couple of notches, showing
    you how to create and add models to your application, and use these models to
    retrieve data from a MySQL database. It will also introduce you to Doctrine, a
    powerful (and free) data mapping tool that can significantly simplify these tasks.


