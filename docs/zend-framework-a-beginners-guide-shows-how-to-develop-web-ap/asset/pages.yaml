  md: '# 32 Zend Framework: A Beginner’s Guide


    appropriate to your application''s requirements and structure.


    That said, the SQUARE example application described in these chapters makes extensive
    use of modules, and this book recommends use of modules in general for Zend Framework
    application development, for the following reasons:


    +   - Organizing code into modules produces a structured code tree, because all
    the controllers, views, and models related to a particular function or set of
    functions are stored within the same directory tree. A module-based directory
    layout also makes the areas of logical separation within an application immediately
    visible, with no additional documentation necessary, and is more maintainable
    in the long run.


    +   - Organizing code into modules encourages the creation of robust and extensible
    software. Modules can be structured as independent packages with their own controllers,
    views, and models. Modules can thus be thought of as reusable components that
    can be plugged into an existing application to quickly give it new functionality.


    When you are using modules with the Zend Framework''s default routes, it''s necessary
    to include the module name in your URL request, in the format `/module/controller/action`.
    The routing subsystem receives a request that doesn''t contain a module name,
    it automatically looks in what it considers the “default” module—the global application
    directory, `$APP_DIR/`/


    This behavior can create also small degree of inconsistency in URLs when the application
    contains additional modules in `$APP_DIR/application/modules/`. Therefore, when
    following a modular directory structure, it''s a good idea to explicitly create
    a directory for the “default” module, at `$APP_DIR/application/modules/default`,
    and more controllers, views, and models that were previously stored in the `$APP_DIR/application/*`
    hierarchy to the `$APP_DIR/application/modules/default/*` hierarchy.


    ![](img/222e7e58871b088cc6397852e1452b57_50_0.png)


    Figure 2-4 The recommended structure for a Zend Framework application module


