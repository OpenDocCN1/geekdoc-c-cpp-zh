  md: "# Chapter 9: Understanding Application Localization\n\n```\n// create translation\
    \ object\n// specify translation adapter\n// automatically find source files for\
    \ each locale\n$translate = new Zend_Translate('array', APPLICATION_PATH .\n \
    \   '../languages', null,\n    array('scan' => Zend_Translate::LOCALE_FILENAME));\n\
    \n```\n\nOf course, these are not the only two options available. There are a\
    \ number of standard directory layouts supported by Zend_Translate translation\
    \ source files, and you should choose one that is most appropriate for the size\
    \ and scale of your project. You can read more about these layouts, and also see\
    \ some examples, using the links at the end of this chapter.\n\n# Using the Application\
    \ Locale\n\nLike many other Zend_Framework components Zend_Translate is locale-aware:\
    \ If a registered Zend_Locale instance is available, it can automatically use\
    \ this locale as the default for all translation operations. This is convenient,\
    \ because it allows the locale to be set once (in the application bootstrap) and\
    \ then have locale applied to all Zend_Translate operations across the entire\
    \ application.\n\n# Ask the Expert\n\n**Q: What is GNU gettext and how do I use\
    \ it?\n\n**A:** GNU gettext is part of the GNU Translation Project, and provides\
    \ a standard way of creating and using translation tables for an application.\
    \ Under this system, translation strings for different languages are specified\
    \ in human-readable message template (*.po) files, for each language. These files\
    \ are converted to binary format (*.mo) files, which are distributed with the\
    \ application.\nBy convention, gettext uses a directory-based layout for *.mo\
    \ translation files, wherein translation files for different languages are stored\
    \ in separate directories named according to locale or language (Figure 9–4 shows\
    \ an example). It is worth noting that Zend_Translate's source detection feature\
    \ can recognize and use this directory layout automatically, thereby allowing\
    \ developers to use existing GNU gettext sources in PHP application with no additional\
    \ modification."
