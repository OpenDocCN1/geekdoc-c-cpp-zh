    common techniques you can use to make your queries faster.


    # Caching Data

    One of the quickest ways to ensure performance bottlenecks in a Web application
    is by using a cache.

    What''s, you ask? Very simply, a cache is an intermediate location containing
    copies of frequently requested pieces of information. Whenever a request for one
    of these fragments comes, the system will pull out and return the cached copy,
    which is invariably faster than generating the information from the original data
    source.

    Caches can be maintained at various levels depending on the requirements of the
    user. Unknown to many, the most commonly used caching mechanism is the Web browser
    itself. Web browsers download content to a temporary location on the hard drive
    before rendering it to you. And, if you visit the same page again, the browser
    will pick it from the local cache (unless you configured it).

    At your workplace, it''s highly likely that your Internet connection with a large
    group of users, through a proxy server. Clever network administrators often use
    the proxy server''s cache to save copies of frequently requested pages. Subsequent
    requests for such pages are directly serviced from the proxy server''s cache.
    This system is replicated at different levels of the hood; it''s not uncommon
    to find ISPs caching content in order to reduce traffic that otherwise cost us
    bandwidth on their Internet backbone.

    Finally, Web sites often implement a caching system to serve their own content
    factor. In its simplest form, a system consists of sending static "snapshots"
    of dynamic pages to clients, rather than re-rendering the pages in every request.
    This reduces load and frees up resources for other tasks. The snapshots are regenerated
    at regular intervals to ensure they are fresh.

    In addition it is also possible to implement fine-grained caching for database
    query results, function and class definitions, and compiled PHP code (this is
    last known as opcode caching). All of these caching strategies can improve the
    performance of your Web application by reducing the amount of work the system
    has to do to satisfy a particular request.


    # Understanding Cache Operations

    The Zend Framework includes a Cache component, which provides a comprehensive
    API to store and retrieve data from a cache. This data may include database result
    collections,'
