    > CAUTION

    It should be noted that logging exceptions to three different destinations, as
    discussed in this section, it is not recommended in production environments. Logging
    data to a file or database can affect performance due to file locking or network
    latency issues, while logging data to the Firebug console increases the size of
    the response packet sent to the client by the server. These and other performance
    issues must be carefully explored when adding logging capabilities to a Zend Framework
    application.


    # Summary


    This chapter marks the end of first section of this book, which was intended to
    teach you basic application development techniques with the Zend Framework. Fittingly,
    it covered exception handling, an important part of application development and
    an area that every developer should be familiar with.


    This chapter began with an introduction to the new exception model introduced
    in PHP 5.x, outlining its benefits vis-à-vis the older PHP 4.x model. With this
    background information at hand, it then proceeded to examine the default exception-handling
    system built into the Zend Framework, outlining the functions of the default error
    controller and examining how the default process can be adjusted to cover different
    situations. It also took a quick look at how exception handling can (and should)
    be modified depending on whether the application is running in a development or
    production environment, and demonstrated a practical application of creating a
    custom error page.'
