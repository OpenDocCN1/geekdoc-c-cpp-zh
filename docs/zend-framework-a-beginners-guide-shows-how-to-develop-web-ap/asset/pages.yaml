    }\n```\n\nFigure 3-9 illustrates the resulting output.\n\n# ### Hash and CAPTCHA\
    \ Fields\n\n**Figure 3-9** A form with an image button\n\nThe Zend Framework uses\
    \ two \"special\" form elements to assist in maintaining input security: the Hash\
    \ and CAPTCHA elements. These are represented by the Zend_Form_Hash and Zend_Form_Captcha\
    \ classes, respectively.\n\nThe Hash element uses a salt value to generate a unique\
    \ key for the form and store it in the session. When the form is submitted, the\
    \ hash value submitted with the form is automatically compared to the value stored\
    \ in the session. If a match is found, the form submission is assumed to be genuine.\
    \ If there is a mismatch, it's a reasonable supposition that the form has been\
    \ hijacked and is being used in a Cross-Site Forgery (CSRF) attack.\nHere's an\
    \ example of using this element:\n\n```\n<?php\nclass Form_Example extends Zend_Form\n\
    {\n    public function init()\n    {\n        // initialize form\n        $this->setAction('/sandbox/example/form')\n\
    \            ->setMethod('post');\n\n        // create text input for number\n\
    \        $cc = new Zend_Form_Element_Text('ccanum');\n        $cc->setLabel('Credit\
    \ card number:')\n            ->setOptions(array('size' => '16'));\n\n       \
    \ // create text input for amount\n        $amount = new Zend_Form_Element_Text('amount');\n\
    \        $amount->setLabel('Payment amount:')\n            ->setOptions(array('size'\
    \ => '4'));\n\n        // create hash\n        $hash = new Zend_Form_Element_Hash('hash');\n\
    \        $hash->setSalt('hf23hflw03jj');\n\n        // create submit button\n\
    \        $submit = new Zend_Form_Element_Submit('submit');\n        $submit->setLabel('Submit');\n\
    \n        // attach elements to form\n```"
