  md: "# Add Zend Framework Libraries\n\nAt this point you have an important decision\
    \ to make. You must decide whether to include the Zend Framework libraries with\
    \ your application, or leave it to users to download and install these libraries\
    \ themselves. There are pros and cons to each option, as follows:\n\n+   - Requiring\
    \ users to download the Zend Framework libraries themselves ensures that they\
    \ always have access to the latest code (and bug fixes). However, the process\
    \ can be intimidating for novices, and if the newer libraries are not backward-compatible\
    \ with the original versions, unusual and hard-to-track bugs could appear.\n-\
    \ Bundling the Zend Framework libraries with your application ensures that users\
    \ can begin using the application out of the box, with no version incompatibilities.\
    \ However, it also “locks in” users to a particular version of the Zend Framework,\
    \ possibly making it harder to upgrade to newer versions with additional features\
    \ or necessary bug fixes.\n\nFor purposes of this book, I will assume that the\
    \ Zend Framework libraries will be bundled with the application. Therefore, copy\
    \ the contents of the Zend Framework library/ directory to $APP_DIR/library/,\
    \ as you did earlier in the chapter, using the following command. The default\
    \ settings are to look in this location for libraries to be included.\n\n```\n\
    shell> cp -R /usr/local/lib/php/Zend library/\n```\n\n# Define Virtual Host Settings\n\
    \nTo make it easier to access the application, it's a good idea to define a new\
    \ virtual host and point it to the application's public directory. This is an\
    \ optional but recommended step, as it helps simulate a “live” environment and\
    \ presents application resources (URLs) as they would appear to users in a public\
    \ environment.\n\nAssuming you're using the Apache web server, you can set up\
    \ a virtual host for the application by editing the Apache configuration file\
    \ (httpd.conf or httpd-hosts.conf) and adding the following lines to:\n\n```\n\
    NameVirtualHost *:80\n<VirtualHost *:80>\n  DocumentRoot \"/usr/local/apache/htdocs/square/public\"\
    \n  ServerName square.localhost\n</VirtualHost>\n```\n\nThese lines define a new\
    \ virtual host, square.localhost/, whose document root corresponds to the $APP_DIR/public\
    \ directory. Restart the web server to activate these new settings. Note that\
    \ if you're on a network, it might be necessary to update your network's DNS server\
    \ to let it know the new host as well.\n\n(continued)"
