  md: '# 382 Zend Framework: A Beginner’s Guide


    # Key Skills & Concepts


    +   - Become familiar with application benchmarking and profiling tools

    - Understand the benefits and types of caching

    - Find out how to cache Web service responses and RSS feeds

    - Learn various techniques for optimizing database query performance


    Over the last few years, Web applications have become increasingly sophisticated,
    sporting a number of bells and whistles—AJAX user interfaces, streaming media,
    dynamically generated content—in an attempt to attract and retain visitors. As
    applications become more complex, their reliance on dynamic data sources increases,
    and as more and more requests need to be served per second, the first casualty
    is usually application performance.

    However, there are many common techniques you can use to identify and work around
    performance bottlenecks in application code. Techniques like code profiling, caching,
    refactoring, and lazy loading can reduce server load and improve response times.
    The Zend Framework comes with a number of tools that you can use for this task,
    and this discusses some of them.


    # Analyzing Performance


    Before you can started with fine-tuning a Web application, you needed detailed
    information on which parts of an application are suffering from degraded performance.
    A number of tools exist for benchmarking and profiling, and the following sections
    discuss them in some detail.


    # Benchmarking


    ApacheBench, or *ab*, is a tool to benchmark Web server response times. It does
    this by sending multiple simultaneous requests to a server URL, timing the response,
    and generating detailed statistics of response times under varying loads. ApacheBench
    is the Apache Web server distribution and is available for both Windows and *NIX
    platforms. Although part of the Apache distribution, it can also be used to benchmark
    any other HTTP-compliant Web server.


    Here’s an example of using ApacheBench to benchmark a Web application, simulating
    1000 requests for the same resource, sent 10 at a time:


    ```

    shell ab -n 1000 -c 10 http://server/request/url

    ```


    Figure 12-1 illustrates an example of the output report generated by ApacheBench.'
