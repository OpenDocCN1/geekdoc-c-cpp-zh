    # Links


    The Links helper generates a set of <link> elements that express the relationship
    of a particular page to other pages in the document collection, as well as provide
    additional information to search engines. These <link> elements can express both
    forward and reverse relationships, and always appear within the <head> of an HTML
    document.


    Here’s an example of how to use this helper in a view script:


    ```

    <?php echo $this->navigation()->links(); ?>

    ```


    Figure 11-4 illustrates an example of the output.


