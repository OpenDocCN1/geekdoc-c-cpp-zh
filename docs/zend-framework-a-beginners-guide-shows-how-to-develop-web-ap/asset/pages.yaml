  md: "# 252 Zend Framework: A Beginner’s Guide\n\nIn the development environment,\
    \ the default error view includes the error message, a stack trace, and a variable\
    \ dump of the request space. In production, staging, and testing environments,\
    \ only the error message is displayed to the user.\n\nThese settings can be adjusted\
    \ by modifying the appropriate block in the application configuration file and\
    \ by altering the error view to display more or less information depending on\
    \ which environment is currently in use (there's an example of this in the next\
    \ section).\n\n# Try This 8-1 Creating a Custom Error Page\n\nWith all this in\
