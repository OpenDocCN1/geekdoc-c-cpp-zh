    # Try 2-1 Using a Modular Directory Layout


    As discussed in the previous section, a modular directory layout enforces consistency
    and produces a more manageable code tree. The following steps discuss how to adopt
    this layout for the example application created in Chapter 1, as a prelude to
    beginning application development.'
