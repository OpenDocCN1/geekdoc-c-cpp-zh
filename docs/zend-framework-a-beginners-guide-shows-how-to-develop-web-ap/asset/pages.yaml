  md: "# Chapter 5: Handling CRUD Operations 163\n\narray format expected by Zend_Db\
    \ (tedious and error-prone due to the large number of DSN permutations possible).\n\
    \nThere's also the small matter of consistency. Thus far, all database access\
    \ has occurred through Doctrine models. Switching over to Zend_Db only for authentication-queries\
    \ is confusing; it is also inefficient the application now has to load two sets\
    \ of libraries instead of one for database operations. For all reasons, it makes\
    \ sense to create a custom authentication adapter that uses Doctrine, instead\
    \ of using the provided Zend_Auth_Adapter_DbTableadapter.\n\nWith that explanation\
    \ out of the way, let's proceed to the actual code. Consider the following listing,\
    \ which creates a Doctrine-based authentication adapter that conforms to Zend_Auth\
    \ conventions:\n\n```\n<php\nclass Square_Auth_Adapter_Doctrine implements Zend_Auth_Adapter_Interface\n\
    {\n    // array containing authenticated user record\n    protected $resultArray;\n\
    \n    // constructor\n    // accepts username and password\n    public function\
    \ __construct($username, $password)\n    {\n        $this->username = $username;\n\
    \        $this->password = $password;\n    }\n\n    // main authentication method\n\
    \    // queries database for match to authentication credentials\n    // returns\
    \ Zend_Auth_Result with success/failure code\n    public function authenticate()\n\
    \    {\n        $q = Doctrine_Query::create('u')\n            ->where('u.Username\
    \ = :username AND u.Password = PASSWORD(?)')\n            array('username' =>\
    \ $this->username, 'password' => $this->password);\n\n        $result = $q->fetchArray();\n\
    \        if (count($result) == 1) {\n            return new Zend_Auth_Result(\n\
    \                Zend_Auth_Result::SUCCESS, $this->username, array());\n     \
    \   } else {\n            return new Zend_Auth_Result(\n                Zend_Auth_Result::FAILURE,\
    \ null,\n                array('Authentication unsuccessful')\n            );\n\
    \        }\n    }\n}\n```\n\n(continued)"
