    ```


    To update an record, retrieve it using the find() method or a DQL query, update
    the necessary properties, and save it back to the database using the save() method.

    Here''s an example:


    ```

    <?php

    $member = Doctrine::getTable(''Member'')->find(1);

    $member->FirstName = ''John'';

    $member->Status = 2;

    $member->save();

    ?>

    ```


    For more precoil, you can also update records using the DQL update() method.

    Here''s an example, which is equivalent to the previous one:


    ```

    <?php

    $q = Doctrine_Query::create()

    ->update(''Member m'')

    ->set(''m.FirstName'', ''?'', ''John'')

    ->set(''m.Status'', ''?'', ''2'')

    ->addWhere(''m.RecordID = ?, 1);

    $q->execute();

    ?>

    ```


    In a similar vein, you can delete records by calling the model''s delete() method
    or by using a DQL query. The following listing illustrates both these approaches:


    ```

    <?php

    // using model methods

    $member = Doctrine::getTable(''Member'')->find(11);

    $member->delete();


    // using DQL

    $q = Doctrine_Query::create()

    ->delete(''Member m'')

    ->addWhere(''m.RecordID = ?, 11);

    $q->execute();

    ?>

    ```


    While a full explanation of the Doctrine package is beyond the scope of this book,
    the preceding examples should have given you some insight into the basics of model
    operations and provided a foundation for you to understand the material in the
    following sections. For more information, and many more examples, refer to the
    links at the end of this chapter.'
