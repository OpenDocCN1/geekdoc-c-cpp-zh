  md: "# Chapter 11: Working with User Interface Elements 351\n\nTIP\n\nZend_Navigation\
    \ is fully locale-aware, and will automatically translate labels into local-language\
    \ equivalents, given a correctly configured Zend_Translate object. You can read\
    \ more about Zend_Translate in Chapter 9.\n\nIt's easy to iterate over a Zend_Navigation\
    \ container with the RecursiveIteratorIterator, retrieving the contents of Zend_Navigation_Page\
    \ objects. Here's an example:\n\n```\n<?php\nclass Sandbox_ExampleController extends\
    \ Zend_Controller_Action\n{\n    function navAction()\n    {\n        // initialize\
    \ navigation container\n        $config = new Zend_Config_Xml(APPLICATION_PATH\
    \ . '/configs/site.xml');\n        $container = new Zend_Navigation($config);\n\
    \n        // iterate over container\n        // display page information\n   \
    \     foreach (RecursiveIteratorIterator::CHILD_FIRST) as $page) {\n         \
    \   echo $page->getLabel();\n        }\n    }\n}\n```\n\nThe Zend_Navigation container\
    \ also exposes various methods for interacting with it. In particular, it exposes\
    \ the findBy() search method, which can be used to retrieve all pages matching\
    \ specific criteria. Consider the following example:\n\n```\n<?php\nclass Sandbox_ExampleController\
    \ extends Zend_Controller_Action\n{\n    function navAction()\n    {\n       \
    \ // initialize navigation container\n        $config = new Zend_Config_Xml(APPLICATION_PATH\
    \ . '/configs/site.xml');\n        $container = new Zend_Navigation($config);\n\
    \n        // find all pages with matching URLs\n        $container->findBy('uri',\
    \ '/about');\n    }\n}\n```\n\n# Rendering Navigational Elements\n\nOf course,\
    \ defining a site's navigation structure is only part of the problem; you still\
    \ need to use it in some way. Typically, the Zend_Navigation container is initialized\
    \ in the application"
