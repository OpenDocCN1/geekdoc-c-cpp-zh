    \        $lengthCm = new Zend_Measure_Length(\n            2540,Zend_Measure_Length::CENTIMETER,\
    \ 'fr_CH');\n        $this->view->message = $lengthCm->convertTo(Zend_Measure_Length::INCH);\n\
    \    }\n}\n```\n\n# # Localizing Strings\n\nWhile the language you're most likely\
    \ to be on the Web, it's important to remember that there is still a large percentage\
    \ of Internet users for whom English is not their native language. This fact assumes\
    \ particular significance when localizing a Web application, the biggest component\
    \ of any localization project consists of translating the application's textual\
    \ content into multiple languages.\n\nThe Zend Framework offers a comprehensive\
    \ API for managing translation strings in different languages, via its Zend_Translate\
    \ component. This component supports a wide variety of translation sources, including\
    \ CSV files, PHP arrays, GNU gettext files and can be easily extended to support\
    \ other data sources (for example, translation strings from a database). Like\
    \ other Framework components discussed in this chapter, it is fully locale-aware\
    \ and can dynamically select the appropriate language for the application based\
    \ on a registered Zend_Locale object, or from client locale settings.\n\n```\n\
    <?php\n// languages/messages.fr_FR.php\nreturn array(\n    'welcome' => 'Bienvenue',\n\
    \    'dog' => 'chien',\n    'cat' => 'chat',\n    'one' => 'un',\n    'two' =>\
    \ 'deux',\n    'three' => 'trois',\n);\n```\n<?php\n// languages/messages.de_DE.php\n\
    return array(\n    'welcome' => 'Willkommen',\n    'dog' => 'hund',\n    'cat'\
    \ => 'katz',\n    'one' => 'eins',\n    'two' => 'zwei',\n    'three' => 'drei',\n\
    );\n```\n<?php\n// languages/messages.es_ES.php\nreturn array(\n    'welcome'\
    \ => 'Bienvenido',\n    'dog' => 'gato',\n    'cat' => 'perro',\n    'one' =>\
    \ 'un',\n    'two' => 'dos',\n    'three' => 'tres',\n)\n```"
