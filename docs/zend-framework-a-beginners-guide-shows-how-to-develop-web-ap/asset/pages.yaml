  md: "# Chapter 12: Optimizing Performance 397\n\nIn most cases, this would be a\
    \ time-consuming process involving few database queries and calls to Web service\
    \ endpoints. It therefore makes sense to cache the output of this method call\
    \ so that repeat queries with the same input \"fingerprint\" can be directly retrieved\
    \ from the cache. Cached data is stored in a memcached server, instead of a disk\
    \ file, for faster retrieval. Here's another example, using the File frontend\
    \ with the APC backend:\n\n```\n<?php\nSandbox_ExampleController extends Zend_Controller_Action\n\
    {\n    public function cacheAction()\n    {\n        // define master file\n \
    \       $localConfigFile = APPLICATION_PATH . '.configs/my.ini';\n\n        //\
    \ define cache configuration\n        $front = array(\n            'lifetime'\
    \ => 600,\n            'automatic_serialization' => true,\n            'master_files'\
    \ => array($localConfigFile)\n        );\n        $back = array();\n\n       \
    \ // initialize cache\n        // load master file from cache\n        $cache\
    \ = Zend_cache::factory('File', 'Apc', $front, $back);\n        if (!$config =\
    \ $cache->load('localconfig')) {\n            if (file_exists($localConfigFile))\
    \ {\n                $config = new Zend_Config_Ini($localConfigFile);\n      \
    \          $cache->save($config, 'localconfig');\n            }\n        }\n \
    \   }\n}\n```\n\nThis example automatically caches the specified master file in\
    \ the APC shared memory cache and uses it for subsequent requests. The key to\
    \ note here is that the File frontend will automatically detect any change to\
    \ the master file and, when such change occurs, invalidate the cached version\
    \ and re-create it on the next request.\n\nNOTE\nThe Static back is interesting,\
