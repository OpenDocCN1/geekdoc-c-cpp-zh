  md: '# Chapter 7: Paging, Sorting, and Uploading Data 239


    # Summary


    This chapter focused on three components, all of which are new to you: the Doctrine_Pager
    component, which provides a framework for pagination large database result sets;
    the ZendFile_Transfer component, which provides a full-featured API for validating,
    filtering, and receiving files uploaded through Web forms; and the Zend_Config
    component, which makes it easy to handle configuration data reference in different
