    as required.


    # Controlling Exception Visibility


    As a rule, it''s not a good idea to include stack traces and other debugging information
    in error messages when an application has been transferred to a production environment.
    This information contains sensitive information, such as SQL query output, file
    locations, and/user passwords, which can be used by malicious users to identify
    an application''s peaks and mount attacks on it remotely. Hiding this information
    in production environments is an important step in improving application security.


    The typical Zend Framework application comes with configuration settings for four
    environments: development, testing, staging, and production. Under the default
    settings, error display in these environments is handled as follows:


    +   - In development and testing environments, the PHP ''display_errors'' and
    ''display_startup_errors'' configuration variables are set to true, resulting
    in error messages being displayed to the user. In staging and production environments,
    these variables are set to false and, as a result, error messages are hidden from
    the user.


    # Ask the Expert


    Q: How do I switch between production and development environments?


    A: Information about the current environment is specified in the .htaccess file,
    as server environment variable named APPLICATION_ENV. On every request, the index.php
    script checks for and passes it to the Zend Application component. Zend then reads
    the appropriate block of the configuration file, and sets up application variables
    as per the directives specified in this block. So to switch from environment to
    another, simply edit the application''s .htaccess file and set the value of the
    APPLICATION_ENV variable to the required environment name.'
