  md: '# Chapter 9: Understanding Application Localization 289


    A Zend_Translate object is initialized with three arguments: the type of translation
    adapter to use, the location of the translation source files, and the locale for
    the file. The setLocale() method is used to define the current locale. With this
    information at hand, Zend_Translate is able to look up the appropriate translation
    file and return the translation for each string.


    > TIP

    If Zend_Translate is unable to find a translation source for the specified locale,
    it will return the original translation key and generate a PHP error notice. To
    disable this notice, pass the special ''disableNotices'' option in the fourth
    argument to the Zend_Translate constructor.


    # Working with Adapters and Data Sources


    Zend_Translate supports a number of different adapters for translation source
    files. The previous example used the Array adapter, which is suitable in many
    scenarios. However, there exist other options too, such as in Table 9-2.


    Zend_Translate can also recursively scan a directory tree and attach all found
    translation sources to the Zend_Translate object, through a process of automatic
    detection. The locale for each translation file is autodetected based on the corresponding
    file and/or


    | Adapter | Description |

    | Zend_Translate_Adapter_Array | Reads translation sources expressed as a PHP
    array |

    | Zend_Translate_Adapter_Csv | Reads translation sources expressed in CSV format
    |

    | Zend_Translate_Adapter_Ini | Reads translation sources expressed in INI format
    |

    | Zend_Translate_Adapter_Gettext | Reads translation sources expressed in GNU
    binary binary format |

    | Zend_Translate_Adapter_Tbx | Reads translation sources expressed in TermBaseXChange
    (TBX) format |

    | Zend_Translate_Adapter_Tmx | Reads translation sources expressed in Translation
    Memory exchange (TMX) format |

    | Zend_Translate_Adapter_Qt | Reads translation sources expressed in QtLinguistic
    format |

    | Zend_Translate_Adapter_Xiff | Reads translation sources expressed in the XML
    Localization Interchange File Format (XLIFF) |

    | Zend_Translate_Adapter_XlTm | Reads translation sources expressed in XML Text
    Memory (XML:TM) format |


    Table 9-2 Translation Adapters Included with the Zend Framework'
