    # Defining the Authentication Adapter


    The form in the previous section submits its data to the LoginController::loginAction
    in the "default" module. Before we get into the code for this action, we need
    to spend a few minutes creating an authentication adapter that knows how to verify
    the supplied username and password against the user table created in Chapter 4.


    As discussed it is not very difficult to create a custom authentication adapter
    with Zend_Auth. It can be done simply by extending the base Zend_Auth_Adapter_Interface
    class and ensuring that the child class exposes an authenticate method that knows
    how to perform the required authentication. More important question is, why is
    it necessary to create a custom adapter, when Zend_Auth already includes a built-in
    adapter for database authentication?


    The reason entirely to do this with efficiency and consistency. To begin, with
    the Zend_Auth_DbTable adapter only works with an instance of the Zend_Db class,
    and it cannot be used directly with a Doctrine model. Zend_Db, in turn, expects
    its database connection parameters to be specified in a different format than
    that expected by Doctrine. Therefore, in order to use the Zend_Auth_Adapter_DbTable
    directly, it is necessary to either specify the same database connection parameters
    in two different formats in the application configuration file (not ideal, as
    it means updating every...'
