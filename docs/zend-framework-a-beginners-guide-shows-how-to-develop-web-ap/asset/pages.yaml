  md: "# Zend Framework: A Beginner’s Guide\n\n# Defining the GET Actions\n\nNext,\
    \ let's define the ApiCatalogController::indexAction. You'll remember that this\
    \ action is automatically dispatched when the router encounters a GET request\
    \ without the \"id\" request variable, and it should return a list of all matching\
    \ resources. Here's the code:\n\n```\n<?php\nclass Api_CatalogController extends\
    \ Zend_Rest_Controller\n{\n    public function indexAction()\n    {\n        //\
    \ get records from database\n        $q = Doctrine_Query::create()\n         \
    \   ->from('i.Square_Model_Item i')\n            ->leftJoin('i.Square_Model_Country\
    \ c')\n            ->leftJoin('i.Square_Model_Grade g')\n            ->leftJoin('i.Square_Model_Type\
    \ t')\n            ->where('i.DisplayStatus = 1');\n        $result = $q->fetchArray();\n\
    \n        // set feed elements\n        $output = array(\n            'title'\
    \ => 'Catalog records',\n            'link' => $this->apiBaseUrl,\n          \
    \  'author' => 'Square API/1.0',\n            'charset' => 'UTF-8',\n        \
    \    'entries' => array()\n        );\n\n        // set entry elements\n     \
    \   foreach ($result['entries'] as $r) {\n            $output['title'] = $r['Title']\
    \ . ' - ' . $r['Year'],\n            $output['link'] = $this->apiBaseUrl . '/'\
    \ . $r['RecordID'],\n            $output['description'] = $r['Description'],\n\
    \            $output['lastUpdate'] = strtotime($r['RecordDate']),\n          \
    \  $output['square:title'] = $r['Title']\n        }\n\n        // import array\
    \ into atom feed\n        // send to client\n        $feed = Zend_Feed::importArray($output,\
