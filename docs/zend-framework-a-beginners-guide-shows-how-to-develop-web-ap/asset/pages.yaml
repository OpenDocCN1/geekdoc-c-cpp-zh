  md: '# Ask the Expert


    **Q**: Can I use the Zend Framework in a shared hosting environment, where I''m
    likely to have limited or no control over global PHP configuration directives
    like the PHP “include path”?


    **A**: Yes, absolutely. There are a couple of ways to accomplish this:


    +   - If you''re concerned about using Zend Framework classes in your application,
    all you need to copy the `library/Zend` directory to your home area, and then
    use the `ini_set()` function to dynamically add this location to your PHP path
    in your application scripts.


    +   - If you''d like to use the `zf` command-line script, you should also copy
    the `bin/` directory to your home area (at the same level as the `library/` directory).
    You should be able to invoke the `zf` command-line script as usual, by prepending
    the complete filesystem path to the script name. This will work, if Zend Framework
    cannot be found in the PHP include path, the `zf` command-line script will also
    look for a `library/Zend` directory one above it in the current directory hierarchy
    and use it if available. Alternatively, you can explicitly tell the `zf` command-line
    script where to find your Zend Framework installation, by setting the `ZEND_TOOL_INCLUDE_PATH_PREPEND`
    environment variable to the appropriate location.


