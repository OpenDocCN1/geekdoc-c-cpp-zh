  md: "# Zend Framework: A Beginner’s Guide\n\n# Ask the Expert\n\n**Q**: Why the\
    \ LoginComponent part of the “default” module, rather than the “catalog” module?\n\
    \n**A**: The “catalog” module serves as a container for controllers, actions,\
    \ and views related to catalog management. However, login/logout actions are not\
    \ specific to catalog management, and are better situated at the global, application,\
    \ level. The “default” module is therefore a more local location for these actions.\n\
    \n```\npublic function successAction()\n{\n    if ($this->_helper->getHelper('FlashMessenger'))->getMessages()\
    \ {\n        $this->view->messages = $this->_helper\n            ->getHelper('FlashMessenger')\n\
    \            ->getMessages();\n    } else {\n        $this->redirect('/');\n \
    \   }\n}\n```\n\nThe loginAction() reads the credentials submitted through the\
    \ login form, and uses the authentication adapter created in the previous step\
    \ to verify them against the application database. If authentication fails, it\
    \ re-renders the form with an error message. If not, it stores the user record\
    \ in the session and looks up the session namespace to see if there is an entry\
    \ for the original request URL (on this later). If there is, it redirects the\
    \ client to that URL; if not, forwards to the successAction() and renders the\
    \ success view.\n\nHere’s the login view script at $APP_DIR/application/modules/default/views/login.php\
    \ looks like:\n\n```\n<h2>Login</h2>\n<div style=\"color:red; font-weight:bolder\"\
    >\n    <?php echo $this->message; ?>\n</div>\n<?php echo $this->form; ?>\n```"
