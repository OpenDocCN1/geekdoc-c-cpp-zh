    everything you need.

    As these examples illustrate, one of the nice things about a community-supported
    project like the Zend Framework is the access to the creativity and imagination
    of developers around the world. The Zend Framework is composed of a large number
    of independent components that developers can use to add new functionality to
    their PHP project. Using these components is usually a more time- and cost-effective
    alternative to rolling your own code.


