  md: "# 370 Zend Framework: A Beginner's Guide\n\n```\nprotected function _initDojo()\
    \ {\n    // get view resource\n    $this->bootstrap('view');\n    $view = $this->getResource('view');\n\
    \n    // add helper path to view\n    Zend_Dojo::enableView($view);\n\n    //\
    \ configure Dojo view helper, disable\n    $view->dojo() -setCdnBase(Zend_Dojo::CDN_BASE_AOL)\n\
    \        --addStylesheetModule('djit.themes.tundra')\n        --disable();\n}\n\
    ```\n\nThis method grabs the Zend_View instance from the resource plug-in and\
    \ uses the Zend_Dojo::enableView method to enable the Dojo view helper for the.\
    \ It then configures the Dojo environment, setting the CDN URL and stylesheet,\
    \ and finally disables the helper with its disable() method. The end result of\
    \ this is that the Dojo view helper is configured for, but the Dojo Toolkit libraries\
    \ will not be loaded in view scripts unless explicitly asked to do so via a call\
    \ to the view helper's enable() method.\n\n# Updating the Master Layout\n\nThe\
    \ next step is to update the layout to check if the Dojo view helper is enabled\
    \ and, if yes, to load the Dojo environment. This is not very difficult to do,\
    \ as the following additions to the <head> of the $APP_DIR/application/layouts/master.php\
    \ layout illustrate:\n\n```\n<!DOCTYPE html PUBLIC \"//W3C//DTD HTML 1.0 Strict//EN\"\
    \n\"http://www.w3.org/TR/html11/html1-strict.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xml:lang=\"en\" lang=\"en\">\n<head>\n    <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=utf-8\"/>\n    <base href=\"/ />\n    <link rel=\"\
    stylesheet\" type=\"text/css\" href=\"css/master.css\" />\n    <?php if ($this->dojo()->isEnabled())\
    \ {\n        echo $this->dojo();\n    }\n    ?>\n</head>\n<body class=\"tundra\"\
    >\n\n</body>\n</html>\n```"
