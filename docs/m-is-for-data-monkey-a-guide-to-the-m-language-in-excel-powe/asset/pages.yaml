  md: '# Chapter 3 Basic Append Operations


    One of the jobs that Excel pros on a regular basis is appending one file to another.
    Particularly in organizations where data is shared by CSV, TXT, or Excel files,
    the process usually boils down to the following:


    +   - Import and transform file #1

    - Import and transform file #2

    - Copy file #1''s data and paste it at the end of file #2

    - Save the file as Consolidated


    The user then builds a business intelligence solution in the Consolidated file.
    When the next month comes along, the data from the next month is copied into the
    Consolidated file, the solution is updated, and all is good.


    But the process is not all sunshine and rainbows, and there are some obvious issues
    here. This chapter does not solve the issue of a making mistake in the transformations
    (although future chapters do), but it does show how Power Query can consolidate
    two or more data sets without worrying about pasting over the last few rows of
    data.


    # Importing Data Files


    The Ch03 Examples folder contains three CSV files: Jan 2008.csv, Feb 2008.csv,
    and Mar 2008.csv. This section walks through the process of importing and appending
    each file.


    Importing the files is fairly straightforward:


    +   - Create a new query -> From File -> From CSV

    - Browse to the Ch03 Examples\Jan 2008.csv -> Open


    Power Query opens the file and executes the following steps automatically for
    this data source:


    +   - Promotes the first row to headers, showing TranDate, Account, Dept, and
    Sum of Amount.

    - Sets the data types to Date, Whole Number, Whole Number, and Decimal Value.


    To be safe, you should remove the Changed Type step and re-create it to force
    the dates to import based on the U.S. standard that they came from:


    +   - Remove the Changed Type step

    - Right-click TranDate -> Change Type -> Using Locale -> Date -> English (United
    States) -> OK

    - Right-click Account -> Change Type -> Whole Number

    - Right-click Dept -> Change Type -> Whole Number

    - Right-click Amount -> Change Type -> Decimal Number


    > If your number format is set to display negative numbers with a – sign instead
    of using parentheses, you may also have to remove the $ signs from Sum of Amount
    before changing it to a decimal number to avoid errors. To do this, select the
    Changed Type with Locale step -> right-click the Sum of Amount -> Replace Values
    -> Replace with nothing. After you''ve performed these steps, select the Changed
    Type step again to make sure you''re at the end of the query before continuing.


    In addition, you should also make the following transformations:


    +   - Select the TranDate column -> Home -> Reduce Rows -> Remove Errors

    - Right-click the TranDate column -> Rename -> Date

    - Right-click the Sum of Amount header -> Rename -> Amount


    Errors are explored in detail in Chapter 7.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_36_0.png)'
