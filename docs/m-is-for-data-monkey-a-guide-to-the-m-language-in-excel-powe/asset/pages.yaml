    # # Converting Text to Dates


    The next task is to convert the filenames into valid dates for the month end.
    Power Query actually has some very good facilities for this, but in order for
    them to work, the data needs to look like a date, which takes a couple of tricks:


    +   - Right-click the Name column -> Replace Values

    - Set Value to Find of .csv -> leave Replace blank -> OK

    - Right-click the Name column -> Replace Values

    - Set Value to a single space -> Replace With to , (space number one comma—without
    the quotation marks) -> OK


