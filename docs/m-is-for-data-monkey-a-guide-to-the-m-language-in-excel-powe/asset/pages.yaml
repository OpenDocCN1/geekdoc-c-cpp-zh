  md: '# Chapter 8 Importing from Databases


    Your organization may grant you direct access to the company databases, and if
    that''s the case, you''re lucky: Such a database is far the best source from which
    to get your data. Not only are you guaranteed to get access to the most up-to-date
    data, but loading from databases is generally more efficient than loading files.


    It doesn''t matter what type of database you''re connecting to, as the experience
    of collecting, filtering, and summarizing database is virtually identical no which
    database is connected to. The connection experience has some very minor differences,
    but the interface for each type of database will guide you through the process,
    which essentially boils down to the three steps:


    +   1. Provide the location of the database.

    2. Enter your authentication credentials.

    3. Select the table(s) you wish to work with.


    The goal of this book is to show you what will most likely encounter in the real
    world. For reason, it''s important that you experience how Power Query works with
    the most common SQL database on the planet: Microsoft''s SQL Server.


    As SQL Server databases aren''t easily portable, we are hosting an SQL Azure database
    on Microsoft''s Azure web service for you to practice these techniques. This is
    essentially a SQL Server database that is hosted in the cloud and is available
    for you to freely access and explore. This means that no matter where in the world,
    you can connect and explore the data within this database.


    # Loading Data from a Database


    Power Query supports connecting to a large variety of databases without the need
    to install any additional drivers. The connections available can be found in three
    separate areas in the Excel user interface:


    +   * New query → From Database

    * New query → From Azure

    * New query → From Other Sources


    If you can''t find the one you need, don''t lose hope. If you install the vendor''s
    ODBC driver, you should be able to connect to your database via the From Other
    Sources → ODBC Connector.


    # Connecting to the Database


    For this example, you''ll connect to the AdventureWorks database contained in
    your SQL Server and analyze the total sales by region for the AdventureWorks company.


    > In an effort to make sure you don''t cause yourself issues when making your
    initial database connection, we recommend that you read the steps below (up to
    the “Managing Connections” section) before attempting to actually make a connection.


    To get started, you need to go through the following steps:


    +   * Create a new query → From Azure → From Microsoft Azure SQL Database

    * Connect to the following database:

    * Server: azuredb.powerqueryworkshop.com

    * Database: AdventureWorks2012'
