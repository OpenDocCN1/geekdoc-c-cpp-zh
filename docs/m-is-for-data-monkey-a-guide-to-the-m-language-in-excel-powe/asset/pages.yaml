    function (table as any, comparisonCriteria as any, default as any) as any


    Returns the largest row in the table, given the comparisonCriteria. If the table
    is empty, the optional default value is returned.


    Example: Find the row with the largest value in column [a] in the table ([[a =
    2, b = 4], [a = 6, b = 8]]).


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_180_0.png)


    This box allows you to test the function out, but clicking Cancel makes it go
    away. Behind it you''ll find the full documentation for the function, so you can
    determine whether it does what you need.


    Note that you''re not restricted to using the #Shared command from a blank query.
    Any time you want to check Power Query''s formula documentation, you can do the
    following:


    +   1. Click the fx on the formula bar to add a new step

    2. Replace the code in the new step with =#Shared

    3. Convert the records to a table

