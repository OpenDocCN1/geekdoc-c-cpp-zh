    # Considerations


    When working through the techniques described in this chapter, there are a couple
    things you need to keep

    in mind.


    # =Excel.CurrentWorkbook()


    The biggest thing to remember about building solutions using the Excel.CurrentWorkbook()
    function is that

    this reads all the objects in the current file. Since this affects the calculation
    chain, you get hit with

    a recursion error, meaning as the new tables are built, Power Query recognizes
    them and reads them

    as potential content as well.


    The implications of this appear at refresh, when the query attempts to load itself,
    thereby duplicating the

    data in the output. When working with this method, it is important to remember
    this and guard against it.

    Strategies to prevent problems like filtering errors on key columns to using naming-

    for both your input and output columns you can filter out the ones you don''t
    need.


    > Whatever method you choose, make sure to test it through a couple refreshes
    before releasing

    it to production!


    # =Excel.CurrentWorkbook([Content])


    Unlike with Excel.CurrentWorkbook(), using the Excel.CurrentWorkbook() function
    doesn''t cause recursion issues.

    The reason is that Excel.CurrentWorkbook reads from the most recently saved copy
    of an Excel workbook.

    This can obviously have implications if a user is in the process of updating the
    file but hasn''t saved it, as you

    won''t get the correct data that you might expect.


    The other concern when using the Excel.CurrentWorkbook() function to extract the
    contents of a workbook is

    it it pulls worksheets in addition to ranges and tables. This makes it very easy
    to duplicate data if you are

    not careful, as all named ranges and tables exist in worksheets. Pay attention
    to filtering the Kind

    column to avoid this issue.


    Even if there is only one kind of data in the workbook when you build the solution,
    it''s not a bad

    idea to future-proof your solution by using a filter to accept only the desired
    kind. This will prevent-

    ent issues when a user adds a table to a file that never had one.


    It should be noted that it is entirely possible to use Excel.CurrentWorkbook()
    to read from the current-

    book, exposing the ability to read worksheet content. This is useful if you can
    define print ranges

    or other ranges over over your data.) Remember, however, that the query will read
    from the most recently saved

    copy of the workbook, not the live copy. This has that unfortunate side effect
    of still facing the recursion issues

    from the Excel.CurrentWorkbook() function, you may not see them until the next
    time you open the file.'
  merge: -1
