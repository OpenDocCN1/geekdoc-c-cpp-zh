  md: '# # Chapter 1 Importing Basic Data


    If you''re an Excel pro, it''s highly likely that your life is all about importing,
    manipulating, and transforming data that you use it. Sadly, many of us don''t
    have access to databases with curated data. Instead, we are fed a steady diet
    of TXT or CSV files and have to go through the process of importing them into
    our Excel solutions before we can start our analysis. For us, critical business
    information is stored in the following formats:


    +   - TXT files, which are delimited by characters

    - CSV files, which are delimited by commas

    - Excel worksheets


    Fortunately, Power Query was built built for us, and it allows us to import our
    data from any of these sources.


    # ## Importing Delited Files


    The process of importing a delimited file like a .CSV or tab-delimited .TXT file
    is fairly straightforward, following the basic ETL (extract, transform, and load)
    process, as is described in the following sections.


    # ## Extract (from the File)


    The download package for this chapter contains two delimited files, either of
    which will work for this example. Both are named Ch01-Delimited though one is
    a comma-delimited CSV and the other is a tab-delimited TXT file. To import either
    delimited file using Power Query you can:


    +   - Open a new (blank) workbook

    - Create a new query -> From -> From CSV (or Text if you used the TXT file)

    - Browse to the Ch01 Examples\Ch01-Delimited file and double-click


    > In different versions of Excel, you will use slightly different methods for
    creating a new query. To learn how to create a new query in your version of Excel,
    see the "Creating New Queries" in the Introduction.


    Excel launches a new window, the Power Query editor, which looks like this:


    | TranData | Account | Dept | Sum of Amount |

    |---|---|---|---||

    | 1 | 12/2009 | 61510 | 15 | (22.07) |

    | 2 | 12/2009 | 61520 | 15 | (151.82) |

    | 3 | 12/2009 | 61530 | 15 | (12.4) |

    | 4 | 12/2009 | 61540 | 15 | (0.92) |

    | 5 | 12/2009 | 61550 | 15 | (61.87) |

    | 6 | 12/2009 | 61560 | 15 | (1.6) |

    | 7 | 12/2009 | 61570 | 15 | (127.03) |

    | 8 | 12/2009 | 62010 | 15 | (283.84) |

    | 9 | 12/2009 | 62020 | 15 | (241.45) |

    | 10 | 12/2009 | 62099 | 15 | 18.41 |

    | 11 | 12/2009 | 62510 | 120 | (70.58) |


    Figure 11 The Power Query editor with an imported delimited file.


    # ## Transform (into the Desired Output)


    This Power Query editor view shows some important pieces of information that are
    worth taking notice of:


    +   - The data appears in a nice format with column headers

    - The query has been automatically given a name (name of the file)

    - There are three steps listed in the Applied Steps box'
