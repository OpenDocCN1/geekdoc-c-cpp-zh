  md: '# Preparing the Data


    As you see, the data is contained in a worksheet, but it has no table associated
    with it. You already know that you can fix it, so somewhere in the data and create
    a new query:


    +   - Create a new query -> From Table -> OK (to confirm the table boundaries)

    - In Excel 2010 adjust the range to $A$4:$I$7 (removing the last row)


    The data lands in Power Query, and you now have the ability to make any transformations
    or manipulations you need. The overall goal here is to unpivot the data, but there
    is a column you really don''t need. The Total column can be removed because you
    simply rebuild it with a PivotTable. Right-click the Total column -> Remove. You''re
    now left with just the key data: the Sales Category column and a column for each
    day.


    # Univoting Columns


    To unpivot in PivotTables, follow these steps:


    +   - Select the 1/1/2014 column -> hold down Shift -> select the 1/7/2014 column

    - Right-click one of the columns -> Unpivot Columns


    The results are astounding: you''re already done.


    | Sales Category | Attribute | Value |

    | Beer | 1/1/2014 | 103 |

    | Beer | 1/2/2014 | 243 |

    | Beer | 1/3/2014 | 101 |

    | Beer | 1/4/2014 | 137 |

    | Beer | 1/5/2014 | 103 |

    | Beer | 1/6/2014 | 185 |

    | Beer | 1/7/2014 | 111 |

    | Wine | 1/1/2014 | 175 |

    | Wine | 1/2/2014 | 223 |

    | Wine | 1/3/2014 | 138 |


    Figure 79 Univoting magic in action.


    You have only a couple changes to make before you finalize your data set:


    +   - Right-click the Attribute column -> Change Type -> Date

    - Right-click the Attribute column -> Rename -> Date

    - Right-click the Value column -> Rename -> Units

    - Rename the query to DailySales

    - Go to Home -> Close & Load


    Can you believe how easy is this?


    > Notice that there is no need to Change Type Using Locale in this instance. Since
    the data already resides inside Excel, Power Query will recognize this data correctly
    no matter what your regional settings are.


    # Repivoting


    Next you can build a couple of PivotTables from this data, you rebuild the user''s
    existing data:


    +   - Select a cell in the table -> Insert PivotTable

    - Insert the PivotTable in F11 of the same worksheet

    - Place Sales Category on Rows, Date on Columns, and Units on Values


    Now you can alternate an view from the same data set:


    +   - Select a cell in the table -> Insert PivotTable

    - Insert the PivotTable in F11 of the same worksheet'
