  md: '# # Connecting to Web-Hosted Files


    As it happens, the World Factbook page actually makes use of a text file to feed
    the data displayed in the web page.


    Now, if you know the URL to the text file, you can connect directly to it? The
    answer is yes, and here''s how it works:


    +   - Create a new query From Other Sources -> From Web

    - Enter the URL as follows: https://www.cia.gov/library/publications/the-world-factbook/rankorder/rawdata2119.txt

    - Click OK


    You are launched directly into the Power Query editor. Notice that you bypass
    the website authentication step. The reason for this is that you specified that
    you wanted the authentication settings to apply to the website root (www.gov)
    when you created the previous query. Had you not done that earlier, you would
    have been prompted to provide the authentication method.


    | Column1 | Column2 | Column3 | PROPERTIES |

    |---|---|---|-|

    | 1 | China | 1355692576 | Name |

    | 2 | India | 1236344631 | Query1 |

    | 3 | European Union | 511438212 | All Properties |

    | 4 | United States | 318892103 | APPLIED STEPS |

    | 5 | Indonesia | 253609643 | Source |

    | 6 | Brazil | 202656788 | |

    | 7 | Pakistan | 196174380 | Changed Type |

    | 8 | Nigeria | 1771552754 |


    Figure 152 Connecting directly to a text file over the web.


    Based on the data you get back, you can assume that the column headers are not
    stored in the text file but rather provided by the HTML of the web page. This
    is no big deal though, as you can fix this to make your data consistent with the
    previous experience:


    +   - Go to Home -> Keep Rows -> Keep Top Rows -> 10 -> OK

    - Right-click Column1 -> Rename -> Rank

    - Right-click Column2 -> Rename -> Country

    - Right-click Column3 -> Rename -> Population

