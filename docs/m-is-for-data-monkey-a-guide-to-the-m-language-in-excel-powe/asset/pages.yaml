  md: "# Building a Power Query SWITCH() Function\n\nBuilding the function isn't overly\
    \ difficult once you know the basic structure. Here's how you get started:\n\n\
    +   - Open Ch22 Examples\\Emulating SWITCH.xlsx\n- Create a new query -> From\
    \ Other Sources -> Blank Query\n- Name the query frnSWITCH\n- Go to Home -> Advanced\
    \ Editor\n- Enter the M code shown below:\n\n```\n(input) =>\n    values = {\n\
    \        (result_1, return_value_1),\n        (input, \"Undefined\")\n    }\n\
    \    Result = List.First(List.Select(values, each _(0)=input))\n\n```\n\nThis\
    \ code is the basic framework for SWITCH() function. These are the key parts to\
    \ recognize here:\n\n+   - result_1 is the first of the possibilities that you\
    \ may pass to the function\n- return_value_1 is the value that you'd like to return\
    \ if the first result is result_1\n- If you need more values, just insert another\
    \ comment after the (result_1, return_value_1) section and put in a (result_2,\
    \ return_value_2) section\n- You can keep as many values as you need\n- The input\
    \ value in the list will return the text Undefined if you don't pass in your provided\
    \ list of options (it's the Else part of the SWITCH() function)\n\nUsing this\
    \ structure, you can modify the fnSWITCH statement for your scenario as:\n\n```\n\
    (input) =>\n    values = {\n        (\"E\", \"Employee\")\n        (\"S\", \"\
    SCYC\")\n        (\"N\", \"Non-Taxable\")\n        (\"R\", \"Restricted\")\n \
    \       (\"I\", \"Inactive\")\n        (\"L\", \"Social\")\n        (\"M\", \"\
    Medical\")\n        (\"U\", \"Regular\")\n        (input, \"Undefined\")\n   \
    \ }\n    Result = List.First(List.Select(values, each _(0)=input))\n\n```\n\n\
    The changes we made here to replace value_1 with \"E\" and return_value_1 with\
    \ \"Employee\" and to add more pair of potential inputs and desired values to\
    \ return. Note that you're restricted to looking up single characters. You can\
    \ look up values or longer text strings as easily; just make that your options\
    \ are always in pairs between curly braces and a comma at the end of the line.\n\
    \nWhen you're done the modifications:\n\n+   - Click Done\n- Go to Home -> Close\
    \ & Load"
