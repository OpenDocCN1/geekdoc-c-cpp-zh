  md: '# Chapter 8 Importing from Databases


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_86_0.png)


    # Query Folding and Optimization


    One of the great features that databases offers the ability to take advantage
    of query folding to optimize query performance. While the technology is built
    in and will work by default for when you build solutions using Query''s user interface,
    you can also accidentally break it, in which case your queries will be processed
    by Excel instead. To avoid this mistake, you need to understand what query folding
    is and how it works at a rudimentary level.


    # What Is Query Folding?


    Most people don''t think about what is happening behind the scenes as they''re
    clicking the commands to select, filter, sort, and group data. You''re aware by
    now, that each of these steps is recorded in the Applied steps box, letting you
    build a sequential macro. What you not not aware of, is that Power Query is also
    translating them as many of those as it can into SQL and sending those to the
    database.


    With even more amazing is that a server that has query folding capabilities will
    accept those individual queries and then attempt to fold them into a more efficient
    query. The impact of this is evident when you''re issuing subsequent commands
    as Select All Records in Table followed by Filter to Exclude All Depts Except
    150.


    In lay terms, instead of loading all 100,000 rows and filtering down to the 1,500
    for that department, the server instead takes the queries to build a more efficient
    query that reads:


    ```

    Select * tblTransactions Where Dept = ''150''

    ```


    The impact of this is massive: It saves the processing time involved in dealing
    with 98,500 rows. While not all commands can be folded, a great many, pushing
    the processing workload to the server.'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'Query technology is restricted to databases. While it would be nice to have
    this function-ality for TXT, CSV, and Excel files, these files are not databases
    and therefore have no engine to fold the queries. You should be aware that not
    all databases support query folding.


    If the file or database you are connecting to is incapable of the queries, Excel
    will download the full set of data and perform the requested steps using its own
    engine to process them. Everything will still work, but it''s not just as efficient.


    # # Optimization


    Power Query can be slow. It''s an unfortunate fact, and one that Microsoft is
    keenly aware of and constantly trying to improve. Unless Microsoft concurs, it
    is important that you have some strategies to maximize performance when you work.


    The first strategy is to never provide a custom SQL statement when setting up
    your initial query.(The only exception to this rule is if you are an SQL ninja
    and are confident that you can provide a more efficient query than the query folding
    can build for you.) By providing a custom SQL statement, you immediately break
    the query folding capabilities for any subsequent steps, potentially hurting your
    long-term performance.


    Remember that Power Query was not a replacement for SQL Server Management Studio
    (SSMS). It was built as a tool to help excel pros, who generally know well—if
    any—SQL syntax, to extract, filter, sort, and manipulate data. Power Query''s
    job is to build your SQL code for you.


    The second strategy is to give preference to connecting to tables instead of views.
    Power Query can read the keys or indexes of a table but not a view. This leads
    to Power Query making choices when trying to load the data from a view—choices
    that may not be as efficient as those related to reading the indexes and keys
    from a table. Power Query also cannot perform relationship detection across views,
    which makes the initial design experience more difficult in the first place.


    The third strategy is to try and push as much work to the database as possible.
    For example, query folding pushes the workload to the server, rather than being
    performed using Power Query on the local workstation. As databases are designed
    to process data efficiently, this will help with performance.


    The fourth consideration is to try to do as much as possible in your initial query
    design using the Power Query user interface instead of reaching to M code. While
    it will be tempting to inject parameters dynamically to control filters (especially
    after you read Chapter 23 on parameter tables), you should be aware that this
    will break the query folding capability.


    > Query folding cannot be executed against any line that contains a custom M or
    SQL statement. Even worse, M or an SQL statement stops any further query folding
    from taking place.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Chapter 9 Merging Tables and Queries


    One of the classic issues that has presented itself to Excel pros for years is
    aggregating separate data tables into one order to serve a PivotTable. The route
    was to VLOOKUP() or INDEX(MATCH()) combination to read data from one table into
    another.


    The challenge with this is that many users were terrified of VLOOKUP() and didn''t
    understand the INDEX() and MATCH() functions either. While Pivotnow allows you
    to aggregate two tables without using any VLOOKUP() functions, it carries its
    own complexities. Yet still the issue remains: Sometimes you just need an easy
    way to merge two tables'' records.


    When Power Query hit the scene, it introduced yet another method to combine two
    tables—one that didn''t involve learning Excel formulas or building a relational
    database structure.


    # Merging Tables via Power Query


    For this example, suppose you have two tables that exist in an Excel worksheet.
    The first is the Sales table, which holds the Date, Product SKU (number), Brand,
    and Sales Quantity of all the sales transactions. But it doesn''t hold any information
    about the price or cost of the products. And information (that is more, however)
    is in the Inventory table. You''d like to merge the two tables in order to get
    a comprehensive list of products with their finer details.


    # Creating "Pointer" Queries


    In order to merge or append queries, the queries actually needs to recognize the
    data as a query. Having a table in Excel isn''t enough; Power Query actually seems
    crazy to have an existing table, pull it into a Power Query, and then load it
    into an Excel table to reference it. And, you don''t actually need to do that.


    Inside the CH09 Examples\Merge.xlsx file, you''ll find two tables set up: an Inventory
    table and a Sales table. In order to let Power Query read the contents of the
    Inventory table you need to:


    +   * Click all inside the Inventory table

    * Create a new query -> From Table


    Power Query opens its editor so you can make any transformations you need. In
    this case, however, you don''t actually need to make any. All you want to do is
    create something that you can connect to.


    +   * On the Home tab, click the drop-down on the Close of Close & Load button

    * Choose Load & Load To...

    * In the Load Dialog, which now asks where to save your data, select Only Create
    Connection


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_88_0.png)


    Figure 115 Choosing to create a connection-only query.


    +   * Click Load'
  merge: -1
  pgno: 88
