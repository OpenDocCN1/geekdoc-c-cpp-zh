  md: 'At first glance, you might be tempted to transpose this data and fill John
    Thompson''s name down. But there are other rows, and you have no idea how many.
    Building a solution to this approach could be very difficult to maintain, so you
    need to find a better way.


    A more sensible approach in this case would be to add a new column and a formula
    in it—a formula that checks whether the Out column is a time and pulls the data
    in the column if the test fails. How do you do that?


    # # Replicating Excel''s IFERROR() Function


    Try an experiment:


    +   - Right-click the Out column → Change Type → Time


    As you''d expect, the times always convert nicely, but the employee name returns
    an error:


    | Work Date | Out | Reg Hrs |

    | --- | --- | --- |

    | Contingent Worker: | Error | |

    | 3/3/2015 | 6:00 PM | 8.50 |

    | 3/4/2015 | 6:00 PM | 8.00 |


    Figure 222 John Thompson doesn''t have the time.


    This is entirely to be, but you can use your knowledge of how to solve the problem?
    If you tested to converting this column to a time data type returns an error?
    If it did, and it did not, null, you could return the time.


    You can use Power Query''s Time.From() to attempt to convert the data to a value.
    And based on your Excel knowledge, you''d expect kind of this to work:


    ```

    =IFERROR(Time.From(null))

    ```


    Unfortunately, you will get nothing but an error, as Power Query doesn''t recognize
    the IFERROR function. All is not lost, however, as Power Query has a function
    to do this, although the syntax is different:


    ```

    =try <operation> otherwise <alternate result>

    ```


    Just like Excel''s IFERROR(), Power Query''s statement attempts to perform the
    operation performed. If it succeeds, result will be returned. If, however, result
    is an error, then it will return the value (or other logic) specified in the otherwise
    clause.


    This means IFERROR() can be written in Power Query as:


    ```

    =try Time.From([]) otherwise null

    ```


    It should return null for any row that contains an employee name in the Out column
    and the time for any row that has a valid time in it. Give it a try:


    +   - Remove the Changed step

    - Add Column → Add Custom

    - Leave the name as in the formula below

    - Click OK


