  md: '# Chapter 23 Dynamic Parameter Tables


    In Chapter 21 we explored how custom functions can be used to preprocess data
    sets prior to merging. While this is a fantastic benefit of custom functions,
    it is far from the only one.


    Consider the example in the last chapter, of pulling timesheets from a folder.
    Say that you''ve built the master consolidation file, saved it in H:\Payroll,
    and for months have been storing the timesheets in the subfolder H:\Payroll\Timesheets.
    After working hard all year, you finally get a few weeks off and have to pass
    the solution to someone else to maintain while you''re going. There''s a problem,
    though: their system has the path to your solution mapped to J:\Payroll. Rather
    than recount the solution for their replacement and have to code it when you return,
    you''d really like to make the path relative to the workbook it is located. That
    is, if the user opens it up from J:\Payroll or H:\Payroll or something else, it
    shouldn''t make a difference.


    The real challenge? Is there no function in the M language that allows you to
    work out the path to the workbook? Interestingly, an Excel formula can do this.


    > Before we embark on the journey of making the file path dynamic, there is something
    you should know about this technique: Queries where data access happens inside
    a function and where the data source is dependent on parameters to the function
    can''t currently be refreshed in Power BI. This is because Microsoft performs
    static analysis of the query to discover the data source, and the static analysis
    can''t yet handle this scenario.


    This does not mean that the functionality is not useful, and it doesn''t mean
    that it won''t be supported one day. It simply means that you should rely on it
    only if the solution is going to live in Desktop Excel and not on the web.


    # Implementing Dynamic Parameter Tables


    There are three steps to implementing parameter tables into your solution:


    +   1. Create a parameter table in Excel.

    2. Create the function to extract the values from the table.

    3. Retrofit your existing queries to call the function.


    We will walk through each step of this process using the Ch 23 Examples\ParameterTables.xlsx
    file.


    Upon opening this file, you''ll recognize that this file is a continuation of
    the Timesheet file that you''ve built over a couple of chapters. The challenge
    with this file is that the paths are all hard coded to your PC, (the author''s
    in the case of the example file,) and now you''d like to deliver the solution
    so that works no matter where you store it.'
  merge: -1
  pgno: 218
