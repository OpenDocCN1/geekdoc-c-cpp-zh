    # ## Combining Query Steps


    Now you could make this code if you wanted to? You are going to get the Source
    step again, but the Added Index step isn''t absolutely what you need in the Applied
    Steps. It is, however, possible to combine these two steps into one. You can look
    at the code for those two steps by going Home -> Advanced Editor:


    ```

    "#Added Index" = Table.IndexColumn(Source, "Index", 0, 1),

    RowNumbers = Table.SelectRows("Added Index", each Text.StartsWith([Column1], "ID
    Number") or Text.StartsWith([Column1], "ID Total"))

    ```


    Notice how the "#Added Index" step contains the Table.IndexColumn(1). On the RowNumbers,
    you also see that the "#Added Index" step is the first parameter into the Table.SelectRows()
    function. If you want to avoid having a separate "#Added Index" step, all you
    need to substitute the actual code within the "#Added Index" step in place of
    that term in the next line.


    > When substituting the code in this way that you want everything between the
    equals sign and the final comma, only.


    By substituting the code in place, adding some line breaks, and removing the "Added
    Index" line completely, you end up with nested code, as follows:


    ```

    RowNumbers = Table.SelectRows(

    Table.IndexColumn(Source, "Index", 0, 1),

    each Text.StartsWith([Column1], "ID Number")nor Text.StartsWith([Column1], "ID
    Total"))

    ```


    As you see, this code still runs flawlessly, it removes the Added Index step from
