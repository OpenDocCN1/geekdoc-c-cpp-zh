    # Transposing Stacked Tables


    Another complicated transformation scenario is one where the details for a transaction
    are stacked vertically on top of each item, with rows spanning the transactions:


    | Transactions | | | |

    | --- | --- | --- | --- |

    | 10/14/2014 | | | |

    | Outback Steakhouse | 34.98 | | |

    | | Date Vendor Amount | |

    | 10/16/2014 | 10/16/2014 Outback Steakhouse 34.98 |

    | 10/16/2014 | 10/16/2014 Earl''s Restaurant 89.98 |

    | Earl''s Restaurant | 89.98 | | |


    Figure 187 Data where the transpose operation is necessary.


    In this scenario, you essentially need to transpose each block of data, then the
    stacks into one table. The however, is that Power Query doesn''t have an out-of-the-box
    command to do this. If you transpose the data, you''ll get one row of data and
    a larger number of rows rather than recorded individually the way you need.


    Again, getting the want is entirely possible but it requires a little creative
    thinking and some tricks.


    # Loading the Data


    In this example, you will transpose the list of credit card transactions found
    in Ch15 Examples\Transpose Stacked Tables:


    | | | |

    | --- | --- | --- |

    | 1 | 10/26/2015 | |

    | 2 | City of Vancouver | |

    | 3 | | 123456 |

    | 4 | | 34.98 |

    | 5 | | |

    | 16 | | 9272345 |

    | 17 | | 89.98 |


    Figure 188 A stacked list of transactions in a single column.'
