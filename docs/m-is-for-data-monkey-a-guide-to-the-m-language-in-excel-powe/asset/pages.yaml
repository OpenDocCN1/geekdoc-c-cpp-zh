  md: '# # Chapter 0 Introduction: A New Revolution


    Whether we are performing basic data entry, building simple reports, or designing
    full-blown business intelligence solutions using VBA, SQL and other languages,
    we Excel pros all data to a certain extent. Our skill sets vary greatly, but the
    overall jobs we are usually trying to perform include:


    +   - Transforming data to meet our needs

    - Appending one data set to another

    - Merging multiple data sets together

    - Enriching our data for better analysis


    We may get tagged with the name "data monkey," but we are actually information
    workers. No matter what we call ourselves in our formal job descriptions, our
    role is to clean up data and turn it into information. Our jobs may not be glorious,
    but they are essential, and without our work done correctly, the end results of
    any analysis are suspect.


    While Excel an amazing tool to help build business intelligence out of data, converting
    raw data into consumable data has been a challenge for years. In fact, it''s this
    that we often spend most of our time—prepping data for analysis and getting it
    into a nice tabular format to expose Excel''s most powerful analytical and reporting
    tools.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_10_0.png)


    Figure 1 Behind the curtains, we are all information workers trying to reach our
    desired goal with data.


    Despite the moniker "data monkey," we information workers are often more like
    data magicians. Our data seldom enters our world in a ready-to-consume format;
    it can take hours of cleaning, filtering, and reshaping to get things ready to
    go.


    Once our data is prepared and ready, we can perform a vast array of analytical
    processes with ease. Tools using conditional formatting, filters pivot tables,
    charts, slices, and more let us work magic and impress our audience.


    But getting the data prepared and ready, is the hard part. We''ve served dirty
    data, held in collections of text and Excel files (maybe a database, if we''re
    very lucky), and we somehow have to clean it up and get it ready to use. Our end
    goal is simple: Get the data into an Excel table as quickly as possible, while
    making sure it is scoped to our needs and accurate. And every solution needs a
    different combination of data coming from different sources... which takes magic.'
  merge: -1
