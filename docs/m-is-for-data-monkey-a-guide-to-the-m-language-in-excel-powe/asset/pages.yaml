  md: "# Understanding the pqLOOKUP Function\n\nSo does the pqLOOKUP function work?\
    \ Take a look at the code:\n\n```\n(lookup_value = any, table_array as table,\
    \ col_index_number as number,\noptional approximate_match as logical) as any =>\n\
    let\n    /*Provide optimal match if user didn't */\n    matchtype =\n    if approximate_match\
    \ = null\n        then true\n    else approximate_match,\n    /*Get name of return\
    \ column */\n    Cols = Table.ColumnNames(table_array),\nColTable = Table.FromList(Cols,\
    \ Splitter.SplitByNothing(), null,\nnull, ExtraValues.Error),\nColName_match =\
    \ Record.Field(ColTable,\"Column1\"),\nColName_return = Record.Field(ColTable(col_index_number\
    \ - 1),\n\"Column1\"),\n\n    /*Find closest match */\n    SortData = Table.Sort(table_array,\n\
    \        ({ColName_match, Order.Descending}}),\nRenameLookupCol =\nTable.RenameColumns(SortData,\
    \ {{ColName_match, \"Lookup\"}}),\nRemoveExcess =\nTable.SelectRows(\n    RenameLookupCol,\
    \ [Lookup] <= lookup_value),\nnClosestMatch=\n    if Table.IsEmpty(RemoveExcess)=true\n\
    \        then \"#N/A\"\n    else Record.Field(RemoveExcess(0),\"Lookup\"),\n\n\
    \    /*What should be returned in case of approximate match? */\nClosestReturn=\n\
    \    if Table.IsEmpty(RemoveExcess)=true\n        then \"#N/A\"\n    else Record.Field(RemoveExcess(0),ColName_return),\n\
    \n    /*Modify result if we need an exact match */\n    Return =\n    if matchtype=true\n\
    \        then ClosReturn\n    else\n        if lookup_value = ClosestMatch\n \
    \           then ClosReturn\n        else \"#N/A\"\nin Return\n```\n\nThe code\
    \ is fairly complex, and it uses a variety of tricks, but the basic methodology\
    \ is this:\n\n+   1. Pull in the data table.\n2. Sort it descending by the first\
    \ column.\n3. Remove all records greater than the value being searched for.\n\
    4. Return the value in the requested column for the first remaining record unless\
    \ an exact match was specified."
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Chapter 22 Advanced Conditional Logic


    5. If an exact match was specified, test to see if the return is a match. If it
    is, the value. If it is, not, return #N/A.


    Note the following in the code:


    +   - Each of the values in the parameters have an explicit data type declared.
    This is to prevent the user from accidentally providing a table where a numeric
    column number is required.

    - The `approximate_match` variable is defined as optional, meaning the user can
    ignore it.

    - The matchtype variable is used to see if a match was specified. If a match was
    specified, it is assigned to the matchtype variable, but not (`approximate_match`
    is null), a value of true will be assigned.

    - The name of the column to be returned is pulled by reviewing the column headers
    of the table, splitting them into a list of records, and pulling out the record
    whose index matches the requested column (1 to adjust to base 0).

    - The data is sorted in descending order, based on the column to be searched.
    All records greater than the requested value are removed (by selecting all rows
    where the value is less than or equal to the value searched for).

    - If no remain, a #N/A result is then, but if there are, the first record in the
    lookup column is returned. You can check this later to see if it matches the record
    being searched for (which is important for the match scenario).

    - The approximate match value is then (always) calculated, even if an exact match
    was requested. If no rows are present in the data set, #N/A result is returned;
    otherwise, the closest value is pulled from the return column.

    - The final test checks the type of match requested. If it is an approximate match,
    the match is always returned (which may be #N/A). However, the match type was
    an exact match, the code will return #N/A instead of the closest column''s value
    matched the value sought exactly.


    It go without saying that this is not a function you''ll knock out in a few minutes.
    It is long, and it took several hours of development and debugging to get it right.
    It is, however, a fairly robust function in the way it works, and it shows how
    to build complex functions using Power Query.


    # Replicating Pivot''s SWITCH() Function


    Pivot has has a function SWITCH() that allows you to perform multi-condition logic
    by declaring a table of index values and results and passing in a variable value.
    The function then looks up the provided index value and returns the matching result.
    This is easier than nested levels of IF statements, so it sometimes makes sense
    to replicate the SWITCH() in Power Query.


    The syntax for in Pivot is as follows:


    ```

    =SWITCH(expression, value_1_result_1, value_2_result_2,...,[Else])

    ```


    One example of where this can be used is when breaking down patterns like customer
    columns, where each header represents something. To make a code like the MP10105ASPR,
    where the third character could be one of the following:


    ```

    E = Employee, S = Yacht Club, N = Non-Taxable, R = Restricted,\NI = Inactive,
    L = Social, M = Medical, U = Regular

    ```


    To break this apart, you could build a function with nested IF statements or by
    using VLOOKUP() in Power Pivot, though, it''s much easier with the SWITCH() function,
    as follows:


    ```

    =SWITCH([Column], "ER", "Employee", "S", "Yacht Club", "N", "Non-Taxable", "R",
    "Restricted", "I", "Inactive",

    "L", "Social", "M", "Medical", "U", "Regular", "Undefined'')

    ```


    There are several ways to accomplish this goal. For example, you could get just
    the another letter and merge the results against a table. The purpose of this
    section is to give you yet another alternative.'
