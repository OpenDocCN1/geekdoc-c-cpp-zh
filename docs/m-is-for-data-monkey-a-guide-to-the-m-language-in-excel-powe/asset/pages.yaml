  md: '# Chapter 9 Merging Tables and Queries


    In the previous merge, you created the merge based on the SKU number, meaning
    that records would only be matched up if their items matched. In this case, you
    matched based on the brand. Because the OK Springs shows twice in the Inventory
    table, when the Sales table brings the brand OK Springs, it creates two tables.
    The fact that they have different SKUs is irrelevant to Query, as you asked for
    a match on brand, not SKU.


    You can see from this example that you need to be careful when creating matches.
    This feature can be very useful, but also dangerous if you are not paying attention
    and avoiding a one-to-many match.


    # Dynamic Table Headers


    Excel tables are fantastic, they truly are. But one issue with them is that they
    lock down the header row into hard-coded values. That prohibits from having dynamic
    headers on your tables, driven by formulas.


    The file CH09 Examples\DynamicHeaders.xlsx contains a spreadsheet for budgeting
    green fees for a golf course. The table has a suitable setup and is able to change
    the header in B1 and update all headers in rows 3 and 32 of the document:


    | | B | C | D | E |

    |---|---|---|---|---||

    | 2 | | | | | 2014 |

    | 3 Month | 1/31/2014 | 2/28/2014 | 3/31/2014 | 4/30/2014 |

    | 4 Green Fee | | | | | |

    | 5 9 hole rounds (18 hole equivalent) | 40 | 60 | 103 | 175 |

    | 6 18 hole rounds | | | | | |

    | 30 | | | | | |

    | 31 Recap | | | | | |

    | 32 Month | 1/31/2014 | 2/28/2014 | 3/31/2014 | 4/30/2014 |

    | 33 Total Green Fee Rounds | 140 | 310 | 503 | 845 |

    | 34 Total Pass Rounds | 50 | 50 | 90 | 180 |

    | 35 Member/Annual Pass Rounds | 146 | 184 | 290 | 1,423 |

    | 36 Total Other Rounds | 48 | 71 | 155 | 329 |


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_92_0.png)


    # The Issue


    The challenge is here that you need to load and pivot the Recap table (rows 32:36).
    Using Power Query is the easiest way to unpivot data, you obviously want to use,
    but there are some challenges in getting the data into Power Query in the first
    place:


    +   * Loading the data via a table would cause the column headers to be locked
    in, and you would lose the dynamic effect.

    * Loading the data using a named range would allow the column headers to change
    in the worksheet but would prevent any hard-coded steps in the query when the
    dates change.


    The workaround in this case is to create a translation table and merge back into
    the query.


    # Creating a Translation Table


    The translation table for this example needs to be come up with a logical way
    to translate a static column header to the current dates. Using the notation CYMX
    (Current Year, Month x), you can build a table to hold these dates. Create the
    table as follows:


    +   * Enter in cell A40: Period

    * Enter in cell B40: Date

    * Enter in cell A41: CYM1

    * Extend A40 to A52 so that it reads CY2, CYM3, and so on

    * Select A40:B52 -> Home -> Format as Table'
