  md: '# Creating Query Steps


    Next, you need to use this in your query, but could there be an issue: Power Query
    works as a sequential macro recorder, which means you''ve left your original source
    behind. So how do you get it back?

    The answer is to click fx in the formula bar:


    ```

    = Table.SelectRows(Table.AddIndexColumn(Source,"Index", 0, 1), Text.StartsWith([Column1],"ID
    Number") or Text.StartsWith([Column1],"ID Total"))

    ```


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_191_0.png)


    If you''re not paying attention when you click this button, you will be forgiven
    for thinking nothing happened.

    The data in the preview window doesn''t appear as you would have. All you see,
    however, that you have a new step in the Applied Steps box Custom1, and the formula
    in the formula bar has changed to:


    ```

    =RowNumbers

    ```


    Clicking the fx button always creates a new query step that refers to the previous
    step. So how is that useful?

    Change the formula to:


    ```

    =Source

    ```


    You now see that you are looking back at the original data.


    > If you checked the Advanced Editor, you could have typed this in by manually
    adding a new step right before the keyword, as follows: Custom = Source Of, in
    order to keep the code working, you would also need to add a comma to the preceding
    line and change the term after the in keyword to Custom1 from RowNumbers.


    You''re in good shape here, as you can select the RowNumbers step to see the first
    and last rows you want to find, step back to Custom1 so you can start doing exactly
    that.


    # Referring to a Applied Step


    You now want to restore your data via the user interface. The reason for this
    is that it will give you the syntax for the functionality you''re-instead of looking
    up the function and doing things manually from the beginning.

    The index number for the last row is 9 as the data set currently sits. If you
    filtered the rows from the top first, however, this would need to be updated.
    Rather than complicate times, you can remove the bottom rows first, as the index
    for the top rows won''t change when you remove the bottom rows.


    The approach you''re using here to remove the bottom rows isn''t actually driven
    by the Remove Rows feature, as it requires the number of rows to remove. This
    means you''d need to calculate all rows in the data set, work out the last row,
    and perform some math to determine how many rows to remove. Rather than that,
    you can identify that the final row you need is row 9, so you can use the Keep
    Top Rows feature instead to keep the top 9 rows:


    +   Go to Home -> Keep Rows -> Keep Top Rows -> 9


    You now a table filtered to show the top 9 rows:'
