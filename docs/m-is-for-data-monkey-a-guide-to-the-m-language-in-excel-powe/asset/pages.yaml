  md: '# Chapter 2 Overriding Power Query Defaults


    Your job is tough when everyone follows the rules. But every now and then when
    you''re trying to import a file into Excel, you''re likely to discover that the
    report programmer didn''t follow the proper standards. The file may have a particular
    extension that implies it should follow a certain standard, but it is actually
    just massaging that type of file. Yet when you open it, you find something is
    not compliant with the standard, and it doesn''t work correctly.


    # Malformed File Example


    Say that you''re working with a CSV data set that looks like this viewed in Notepad:


    ```

    Downloaded from MarSys: 2008-02-12T13:10:29

    TranDate Account, Dept, Amount

    1/2/2008, 61510, 150 ($26.03)

    1/2/2008, 61520, 150 ($55.07)

    1/2/2008, 61530, 150 ($10.60)

    1/2/2008, 61540, 150 ($0.29)

    1/2/2008, 61550, 150 ($48.02)

    ```


    Figure 2 A row at a malformed CSV file, which has an extra header row.


    So what''s wrong with this data set? Starting on row 2, it has nice consistent
    list of data showing in a proper comma-separated format, with one header row and
    four columns of data, separated by commas. The issue is that there is an extra
    row at the top of the page, with no commas in it. In a normal CSV setup, this
    should not occur, as most programs work out the column count based on the first
    row.


    Interestingly, when Excel opens this file, it handles it without issue:


    | A | B | C | D | E |

    |---|---|---|---|---|

    | 1 | Downloaded from MarSys: 2008-02-12T13:10:29 | | | |

    | 2 | TranDate Account Dept | Amount |

    | 3 | 1/2/2008 | 61510 | 150 | ($26.03) |

    | 4 | 1/2/2008 | 61520 | 150 | ($55.07) |

    | 5 | 1/2/2008 | 61530 | 150 | ($10.60) |

    | 6 | 1/2/2008 | 61540 | 150 | ($0.29) |

    | 7 | 1/2/2008 | 61550 | 150 | ($48.02) |


    Figure 23 Malformed CSV file loaded into Excel.


    Power Query, unfortunately, doesn''t handle this quite gracefully, as you can
    see if you follow these steps:


    +   * Open a blank workbook

    * Create a new query → From → From CSV

    * Browse to Ch02 Examples\MalformedCSV.csv


    When Power Query loads, the data is imported as follows:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_28_0.png)


    Figure 24 Malformed CSV file loaded into Power Query.


    This is obviously not good. You''re looking at a single column of data. Worse,
    it appears Power Query recognizes the comma as delimiter, and failed to import
    the last three columns!'
