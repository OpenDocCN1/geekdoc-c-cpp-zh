  md: '# Chapter 22 Advanced Conditional Logic


    The trick is essentially as the trick with replicating the OR() function with
    List.AnyTrue(), except that for AND() you need use the List.AllTrue(). This function
    returns a true value only if every logical test provides a true value—like Excel''s
    AND() function.


    Take a look at how it differs from the previous function:


    +   - Go to the Workbook Queries pane -> right-click pqOR -> Duplicate

    - Rename the query pqAND

    - Select the Added Custom step -> click the gear icon (to edit the formula)

    - Replace List.AllTrue

    - Select the Filtered Rows step


    As you can see, the results are quite different from the results you get by using
    the original List.AnyTrue() function:


    | Inventory Item | Sold By | Cost | Price | Commission | Match? |

    |---|---|---|---|---||

    | Talkative Parrot | Fred | 17 | 32 | | 0.96 Meets Criteria! |

    | Talkative Parrot | Fred | 17 | 32 | | 0.96 Meets Criteria! |

    | Talkative Parrot | Fred | 17 | 32 | | 0.96 Meets Criteria! |

    | Talkative Parrot | Fred | 17 | 32 | | 0.96 Meets Criteria! |

    | Talkative Parrot | Fred | 17 | 32 | | 0.96 Meets Criteria! |


    Figure 290 Using the List.AllTrue() function to tag records based on multiple-column
    criteria.


    While this obviously obviously filtered the data based on the results from the
    formula output, the great thing about this function is that you can easily tag
    records without filtering first. This allows you more flexibility in building
    more complicated logic while still preserving your original data—something that
    can''t be done if you filter columns to drift into the end values.


    # Replicating Excel''s VLOOKUP() Function


    As many people try to VLOOKUP(), it is an incredibly useful function for Excel
    pros. Those who love it will try to replicate its functionality in Power Query
    at some point. However, depending on which version of VLOOKUP() you need, it can
    be quite tricky to implement.


    # VLOOKUP() Using an Exact Match


    In truth, you don''t need to do anything to emulate VLOOKUP''s exact match, as
    this functionality can be replicated by merging two tables together, as described
    in Chapter 9.


    # VLOOKUP() Using an Approximate Match


    Replicating VLOOKUP()''s approximate match is a totally different than the exact
    match scenario. It requires some logic to emulate those steps because you''re
    not trying to match records against each other but actually trying to find the
    closest record to our request without going over. You won''t create the function
    from scratch here, you will see the function and how it works.


    To get started, open Ch22\Emulating VLOOKUP.xlsx. In this file you''ll find two
    tables: BandingLevels and DataTable.'
