  md: "# Chapter 5 Aggregating Excel Worksheets\n\nSo far, each of the techniques\
    \ demonstrated for aggregating data has been based on pulling data from external\
    \ CSV or TXT files. Each Excel pro, however, the world of data is much bigger\
    \ than these types of files. There is a huge amount of data inside Excel files,\
    \ and you need the ability to combine those data sources together. For example,\
    \ you might want to be able to append all tables in a workbook. Or you might want\
    \ to be able to append all worksheets in a workbook (where tables haven't been\
    \ set up). And naturally, you will need to be able to accomplish these goals from\
    \ within the active workbook or from an external one.\n\nWhile the good news is\
    \ that these can all be accomplished, the bad news is that there is no easy way\
    \ to accomplish these tasks via the standard user interface. Each of them requires\
    \ some minor manipulation of the Power Query formula bar—nothing more serious\
    \ than what you've seen so far.\n\nIt's important to understand that the methods\
    \ for dealing with data in your active workbook are quite different from those\
    \ for pulling data from an external file.\n\nPulling data from within the current\
    \ file works like this:\n\n+   * Start with a blank query\n* Enter the following\
    \ function in the Power Query formula bar:\n  =Excel.CurrentWorkbook()\n* Filter\
    \ and expand the tables or ranges you need\n\nThis process gives you access to\
    \ the following objects:\n\n+   * Excel tables\n* Named ranges\n* Workbook connections\n\
    \nUnfortunately, this process doesn't allow you to enumerate all worksheets in\
    \ the file.\n\n# Consolidating Tables\n\nLet's look at some specific examples,\
    \ starting with the Ch05 Example Files\\Consolidate Tables-Start.xlsx.\nin this\
    \ file you'll find three worksheets that list gift certificates by a spa for the\
    \ current month. The clerk who created the workbook never added any issue dates\
    \ to the certificates, although she did create table names in the formula Jan_2008,Feb_2008,\
    \ and so on.\n\nIn order to analyze the transactions, the data obviously needs\
    \ to be consolidated, and Power Query is the perfect tool for doing that. Let's\
    \ get started:\n\n+   * Create a new query -> From Sources -> Blank Query\n* Type\
    \ the following into the formula bar:\n  =Excel.CurrentWorkbook()\n\nNow you see\
    \ your list of tables:\n\n![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_52_0.png)"
