- img_proc: true
  md: '# Implications of Parameter Tables


    Referencing a parameter table gives us a huge amount of flexibility when building
    solutions. Whether you are building solutions internally within your company and
    to share them with team members or divisions, you can now set them up from dynamic
    folder structures relative to your solution path. If you develop solutions for
    clients, this is also hugely impactful, as it is doubtful that you will ever have
    the same file structure on your system as your client does. The last thing you
    want to do in either of these situations is send the end user a file with instructions
    on how to edit the M code.


    But the power of parameter tables doesn''t end there. Consider each of the following
    tasks that you may wish to perform:


    +   - Build a calendar table based on the dates in cells in an Excel worksheet

    - Drive a filter for a table based on the value in an Excel cell

    - Determine which of four Excel tables to load into a solution


    By setting up and using a custom function to read from an Excel table, we can
    accomplish any of these goals. This affords us not only the ability to dynamically
    drive our content, but also gives us the ability to generate data in an environment
    more familiar to us, and in some cases do things that Power Query wouldn''t other-wise
    us to do.


    Again, we need to call out the caveat that if you are publishing to Power BI,
    this solution won''t work for you, as Power BI doesn''t currently support dynamically
    generating paths to databases and the like. If you are developing your content
    in an Excel desktop environment, however, you''ll find this to be one of the most
    useful techniques in this book.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Chapter 24 Dynamic Calendar Tables


    When working with Power Pivot in Excel 2010 and 2013, you need to provide your
    own calendar table for your models. This is really easy in organizations with
    a cooperative IT department that publishes a calendar for users.


    If you don''t live in an organization like that, however, things are more difficult.
    You can reach out to web sources, but those don''t work when you''re tinkering
    with your model while sitting in an airplane or on the way out to visit your operations
    in mine Africa. You can also build your own calendar in an Excel table, but this
    leads to challenges when the data expands, as the date table doesn''t automatically
    expand for you.


    For those, Power Query has come the rescue. As you''ll see, it is super easy to
    set up a fully dynamic calendar in Excel using Power Query. And building on the
    techniques from Chapter 23, you can drive the whole thing based on a few Excel
    cells.


    # Creating a Dynamic Calendar Table


    Creating a full dynamic calendar for your solution requires a total of four steps:


    +   1. Add a parameter table to hold the calendar boundaries.

    2. Implement the fnGetParameter function to retrieve the boundaries.

    3. Build the basic dynamic calendar framework.

    4. Add the required calendar columns.


    Building on the methods explored in Chapter 23, in this you''ll see that this
    process is actually quite quick to set up.


    # Step 1: Adding a Parameter Table


    For this example, you''ll start from a completely blank workbook, although you
    could easily retrofit this into an existing model. If you already have a Parameter
    table in your solution, you can simply add new fields to it. If not, you''ll need
    to build the table from scratch.


    Remember the key pieces here as you build your table:


    +   - The table must be called Parameters

    - There must be a Parameter column and a Value column


    You should build the table to hold the start and end dates:


    +   - Start Date 1/1/2014

    - End Date =EOMONTH(TODAY(),,0)


    When the setup is complete, the table will look as follows:


    | File | Insert | Page Layout | Formulas | Data |

    |---|---|---|---|--|

    | Table Name: | Summarize with PivotTable | | | |

    | Parameters | Remove Duplicates | Insert | Export Refres | |

    | Resize Table | Convert to Range | Slicer | | |

    | Properties | Tools | | | Ext |

    | B4 | | | | =TODAY() | |

    | A | B | C | D | E |

    | Parameter | Value | | | |

    | Start Date | 1/1/2014 | | | |

    | End Date | 8/14/2014 | | | |


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_224_0.png)


    The EOMONTH() function has the following syntax:'
  merge: -1
  pgno: 224
- img_proc: true
  md: '216


    =EOMONTH(start_date,months)


    If you use 0 for the months parameter, the function will return the last day of
    the given month. If you provide -1, it will be the end of the previous month,
    and if you use a positive value of 3, function will give you the end of the 3
    months after the provided date. This function is very useful when driving your
    calendar table.


    # Step 2: Implementing the fnGetParameter Function


    Once the table is built, you can create the fnGetParameter function:


    +   - Open the Ch24 Examples!fnGetParameter.txt file

    - Copy the entire contents of the text file

    - Create a new query -> Other Sources -> Blank Query

    - Go to Home -> Data window -> Advanced Editor

    - Highlight all the code in the window -> Ctrl+V -> Done

    - Rename the query fnGetParameter


    The fnGetParameter function is now installed as well, ready to be used:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_225_0.png)


    Figure 309 The fnGetParameter function is ready to go.


    # Step 3: Building the Basic Calendar Framework


    With the groundwork quickly laid, you can now get to the real task at hand: building
    the calendar. Rather than exit the Power Query editor, you can create a new query
    right inside it:


    +   - Go to Home -> New Source -> Other Sources -> Blank Query

    - Rename the query Calendar


    You now have a new query with nothing in it at all:


