    # # Caveats and Frustrations with the From Web Experience


    The Web experience is certainly a weakness in Power Query''s otherwise incredible
    arsenal of tools. There are several things we hope could be improved in this area,
    and there are things to watch out for as you develop solutions based on web data.


    None of the factors discussed below should be seen as reasons not to develop solutions
    based on website data. Instead, they are intended to make sure go into this area
    with both eyes open, seeing not only the benefits but also the risks of relying
    on web-sourced data you don''t.


    # ## The Collecting Data Experience


    Building solutions using web data can be a painful experience in Power Query.
    If there are tables in the HTML code, everything works well. If not, however,
    all bets are off.


    Compare this to Classic Data -> From Web experience, which kicks off a web browser
    that allows you to navigate the data you''re looking for. Power Query does not
    give you this facility but leaves you to navigate web pages using a different
    browser.


    In itself, this might not seem like a big deal, except for the issue that it is
    very difficult to tell if the data you are seeing in the browser is an easy-to-use
    tool or without looking at the code.


    The challenge here is that you''ll grab the promising URL, drop it in the Power
    Query interface, and then spend a huge amount of time expanding columns, each
    route down the rabbit hole of HTML tags, trying to find the data you''re looking.
    Even if you understand the web debugging tools, it still doesn''t make the job
    easy. Because Excel pros are not web developers, this is really an unnecessary
    burden that is being placed upon them.'
  merge: -1
  pgno: 117
- img_proc: true
  md: '# Chapter 12 Importing Data


    Ideally, this experience should kick off a web browser, let you navigate to the
    page and select the data range you''d like to import, and then do the work of
    breaking the HTML to do for you. Until that happens, importing data that is not
    formatted in a tabular fashion will continue to be difficult.


    # Data Integrity


    Another major concern with web data is the source and integrity of the data. Be
    cautious of connecting and importing data from sites such as Wikipedia or other
    sites that you don''t have a business relationship with. While demos love to use
    Wikipedia as a great example, the reality is that relying on this site can be
    dangerous. The content is curated, it can also be changed by users. Although the
    site makes a great effort to curate data, the information there is far from perfect
    and may not be entirely factual.


    The other issue is how readily the data is updated. Imagine investing time in
    building a complicated query against a web page, only to find out that the owner/curator
    doesn''t update it on a timely basis. You need to be assured that when you refresh
    the data, the routine isn''t merely refreshing out-of-date data but rather that
    it''s refreshing current data. You''re likely to invest a significant amount of
    time and make business decisions assuming that the last refresh you pulled the
    most recent data.


    # Solution Stability


    There is another real concern when building your business logic against web sources
    that you do not own or control. Every other company that provides these feeds
    and pages wants to serve its customers. Unfortunately for us, that doesn''t mean
    that they are interested in putting out a consistent experience that never changes.
    In fact, quite the opposite is true. They are also trying to update things, changing
    the web pages to add new bells or whistles, or make the sites more attractive
    to the human eye. This has the very real side effect of blowing queries apart,
    usually without notice, and oftimes when you don''t have time to fix them.'
