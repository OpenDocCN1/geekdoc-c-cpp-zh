    # Converting the Query into a Function


    Next, you need to convert the query into a function. This involves three steps:


    +   1. Come up with a name for the variable that will hold the data you wish to
    replace.

    2. Edit the query and place the text for the data you wish to replace and overwrite
    it with the variable name.

    `(variable_name)=`

    3. Scan your query for the variable name that is somewhat descriptive of the data
    it will hold, as


    It''s a good idea to come up with a variable name that is somewhat descriptive
    of the data it will hold, as it helps self-document your M code. The goal here
    is to convert the single-use example into a function where you can dynamically
    update the file path, so you should use something like filepath to describe what
    it holds. (Ultimately, you get to choose the name. Make sure it doesn''t contain
    any spaces or special characters.)


    > Windows File Explorer has a set of rules about characters are allowed for file
    names and paths. Power Query uses slightly different rules. For example, if you
    set up a folder such as D:\Data Monkey, it can be read by Windows, but Power Query
    will choke on it, as Power Query will not allow a file path to start with the
    ! character.


    Now you''ve edited the Timesheet query, edit the query to turn it into a function:


    +   * Edit the variable name, -> Home -> Advanced Editor

    * Place your cursor right in front of the let statement

    * Type the following:

    `(filepath)=`

    * Press Enter


    Your code should now start like this:'
