  md: '# Chapter 10 Query Loading Destinations


    To link this data into the Pivot Data Model, select anywhere inside the Sales
    table, go to the Power Pivot tab, and click Create Linked Table. The end result
    is a data flow that follows this process:

    Excel table -> connection-only query -> append query -> Excel table -> Power Pivot


    > You might think it would be easier to go directly from your monthly sales tables,
    link both to Pivot Table, and create a relationship—avoiding the necessity of
    the append query. The issue is that Power Pivot is great at creating horizontally
    (replicating VLOOKUP() functionality) but it is lousy at stacking tables on top
    of each other (appending data).


    The challenges with this approach are two-fold:


    +   - Your data gets duplicated if it is loaded to the worksheet first and then
    to the Data Model.

    - Your Pivot tables are capped at a maximum of 1,048,575 rows of data (1 less
    than the number of rows in the worksheet).


    So while this works and is the supported method, using Power Query''s supported
    loading methods definitely has some drawbacks for serious model.


    # Loading to the Data Model (Excel 2013+)


    In Excel 2013 and higher, the process of linking to the Data Model is actually
    much easier: Excel gives you a little box that you can click to have Excel the
    job for you. To see this in action, you can modify the existing Sales table:


    +   - In the Workbook Queries pane, right-click the Sales query -> Load To...

    - Select Only Create Connection

    - Check the Add Data to the Data Model checkbox

    - Click Load


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_98_0.png)


    Figure 130 Changing the query loading options.


    Making these changes triggers a warning about possible data loss. This happens
    because changing from Table to Only Create Connection tells Excel that you would
    like to remove the table that Power Query landed in the worksheet. Because that
    is to be expected, you can simply acknowledge the warning by clicking Continue.'
