  md: "# # Locking Columns to Unipivot\n\nWhile this should be unusual, there may\
    \ come a time when you need the ability to unipivot a specific column or columns\
    \ that you want to unipivot and ensure that new columns added to your source data\
    \ are not unpivot by default. Doing so takes some manipulation of the formula\
    \ in the formula bar.\nAssume that you want to unipivot the Total column, for\
    \ example, you would take the following steps:\n\n+   - Create a new query `->\
    \ From Table`\n- Right-click the Total column `-> Unpivot Column`\n- The query\
    \ at this point would look similar to this, with the final two columns being unpivoted:\n\
    \n| Sales Category | 1/1/2014 | 7/27/2014 | 1/8/2014 | Attribute | Value |\n|---|---|---|---|---|---||\n\
    | 1 Beer | | 103 | | 111 | 34 Total | 983 |\n| 2 Wine | | 177 | | 83 | 86 Total\
    \ | 941 |\n| 3 Cider | | 161 | | 92 | 47 Total | 170 |\n| 4 Liquor | | | 180 |\
    \ | 23 Total | 1128 |\n\nFigure 83 The Total column has been unpivoted.\n\n+ \
    \  - Use the icon in the formula bar to expand the formula bar\n- At this point\
    \ the formula would read as follows:\n  =Table.UnipivotOtherColumns(\"Changed\
    \ Type\", \"Sales Category\", \"1/2/2014\", \"1/3/2014\", \"1/4/2014\", \"1/5/2014\"\
    , \"1/6/2014\", \"1/7/2014\", \"1/8/2014\", \"Attribute\", \"Value\")\n\nHere's\
    \ how code breaks down:\n\n+   - Table.UnipivotOtherColumns[] is the function\
    \ to be executed\n- \"Changed Type\" is the name of the previous step from the\
    \ Applied Steps box\n- `{}` is a list of all the columns, separated by commas\n\
    - \"Attribute\" is the name of the new column that will hold the unpivoted text\n\
    - \"Value\" is the name of the column that will hold the unpivoted values\n\n\
    If you wanted to lock your code to make sure that no other columns were ever unpivoted,\
    \ you would need to change this from the Table.UnipivotOtherColumns function to\
    \ use the Table.Unipivot function.\nLike Table.UnipivotOtherColumns, the Table.Unipivot\
    \ function takes four parameters:\n\n+   - The step you want to unipivot: \"Changed\
    \ Type\"\n- A list of all the columns you want to unipivot: {\"Total\"}\n- The\
    \ name of the column to hold the unpivoted text: \"Attribute\"\n- The name of\
    \ the column to hold the unpivoted values: \"Value\"\n\nSo the overall formula\
    \ would read as follows:\n=Table.Unipivot(\"Changed Type\", \"Total\", \"Attribute\"\
    , \"Value\")\nAnd the effect would look exactly the same as the version that was\
    \ produced before the last fact after the world would not also get unpivoted upon\
    \ refresh.\n\n> In order to lock the unpivot of multiple columns, you just provide\
    \ the full list of columns to unipivot between the () characters, with each column\
    \ header surrounded in quotes and separated by commas."
