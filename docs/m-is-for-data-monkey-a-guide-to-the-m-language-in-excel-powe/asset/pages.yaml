  md: '# Chapter 4 Importing All Files in a Folder


    The classic way that Excel pros deal with importing files in a folder is incredibly
    tedious and error prone. Each file needs to be imported, transformed, copied,
    and pasted into the master table. Depending on how big and complex the transformations
    are, how many files are there, and how the solutions have been running, this can
    be terrifying.


    You''ve already seen that Power Query can eliminate the copying/pasting dangers
    involved importing and appending files on a one-by-one basis, but what about these
    pretty serious issues:


    +   - Importing multiple files is tedious.

    - Repeating complex transformation steps is error prone.


    The good news is now that Power Query has a way to deal with both of these issues
    as well.


    > This chapter focuses on importing binary files, such as TXT and CSV files. Chapter
    5 covers importing data from multiple workbooks.


    # Sourcing All Files in a Folder


    The example files for this chapter are broken down into four subfolders:


    +   - Begin

    - 2008 – More

    - 2009

    - 2010


    Each folder contains a variety of text files that you will combine.


    # Extracting the Files Listing


    To get started, open a blank workbook:


    +   - Start a new query -> From File -> From Folder

    - Click Browse


    You are now presented with a dialog that Power Query uses to select folders.


    +   - Locate the Ch04 Examples\Begin folder select -> OK (to close the file picker
    dialog)

    - Click OK (to load the folder to Power Query)


    You can now see the Power Query window. This time, things look quite different
    than what you''ve seen so far. Instead of instances, you will see a list of files
    and their properties:


    | Content | Name | Extension | Date accessed | Date modified | Date created |

    |---|---|---|---|---|---|

    | 1 | Feb.csv | csv | 8/7/2015 2:57:48 PM | 4/5/2015 10:55:03 AM | 8/7/2015 2:57:48
    PM |

    | 2 | Jan.csv | csv | 8/7/2015 2:57:48 PM | 4/5/2015 10:55:04 AM | 8/7/2015 2:57:48
    PM |

    | 3 | Mar.csv | csv | 8/7/2015 2:57:48 PM | 4/5/2015 10:55:06 AM | 8/7/2015 2:57:48
    PM |


    Figure 46 The list of files in the Begin folder.


    # Future-Proofing File Selection


    In this chapter, you will be combining all the CSV files from the four folders.
    Before you go further, you should filter this list to ensure only CSV files are
    present. Even though you see only CSV files in the list above, you never know
    when someone else will decide to store an Excel workbook in this folder. If that
    happens, it''s sure to break your solution when you''re at your busiest. By effort
    of it, a little future-proofing is worth the time.


    To filter to csv files, you''d normally click the arrow on the Extension column,
    uncheck the (Select All) option, and then check CSV. Unfortunately, because you
    only have CSV files in the list right, doing'
