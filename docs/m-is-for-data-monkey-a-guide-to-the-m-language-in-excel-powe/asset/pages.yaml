  md: "# Chapter 19 Query Objects\n\nBefore we take a closer look at programming with\
    \ Power Query's M language, we first need to take a detailed look at the different\
    \ objects and functions that are available. Having a sound understanding of how\
    \ to create these objects, something from each other, will be useful when working\
    \ with more advanced programming concepts.\n\nBe aware that this focus is on how\
    \ not to use these new-found powers in anything extremely practical. This chapter\
    \ focuses on how to actually talk to these objects, providing a reference for\
    \ you to return to when you need to talk to these objects (or portions thereof)\
    \ when working in more complex scenarios.\n\nIf you're following along on your\
    \ computer, you'll notice that all of the key objects in this chapter (tables,\
    \ lists, records, values, binaries, and errors) show up in a green font when included\
    \ in a column. In addition, each can be previewed by clicking the whitespace beside\
    \ that key.\n\n# Tables\n\nTable objects show up in numerous places in Power Query,\
    \ and we appreciate it when they do, as they are very easy to work with. Follow\
    \ these steps to see for yourself:\n\n+   - Open Ch19\\Power Query Objects.xlsx\n\
    - Create a new query -> From Sources -> Blank Query\n- Type the formula in the\
    \ formula bar:\n  ```powerquery\n  =Excel.CurrentWorkbook()\n  ```\n\nYou can\
    \ see that there is one table in the workbook:\n\n![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_166_0.png)\n\
    \nFigure 22 The sole table in the workbook being previewed.\n\nThe benefits of\
    \ tables are numerous in Power Query:\n\n+   - You can preview the data in a table.\n\
    - The data contained in the table has rows and columns (even though you can't\
    \ guarantee that a header row will be in place).\n- You can drill into specific\
    \ tables in the column or expand them.\n- Once you've expanded a table, you have\
    \ a full set of transformation ribbon tabs available to you, and you can use them\
    \ to further transform and manipulate the data.\n\nTables do not, of course, only\
    \ mean Excel tables—far from it. You can find tables in many data sources, including\
    \ those extracted from formulas like Excel.CurrentWorkbook(), Csv.Document(),\
    \ data-base tables, and more, as you've seen in earlier chapters.\n\nYou should\
    \ finalize this query before you move on:\n\n+   - Rename the query Table\n- Go\
    \ to Home -> Close & Load To... -> Only Create Connection"
  merge: -1
