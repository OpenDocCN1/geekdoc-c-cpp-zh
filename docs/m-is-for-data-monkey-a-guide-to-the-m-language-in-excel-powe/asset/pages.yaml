  md: '# Define once Consume anytime


    Figure 6 Define the transformation process once and anytime.


    Consider this for a moment: You need a particular TXT file, and it takes 20 minutes
    to import and clean it before you can use it. Power Query enables you to accomplish
    the same task in 10 minutes, which saves 10 minutes the first time you use it.
    Next month comes, and you will need the new version of the same TXT file. Power
    Query, you have to pull up your sleeves and relieve the 20 minutes of Excel exuberance
    where you used Excel that you''re a master at relieving the post, performing those
    exhilarating steps over and again each month. Wait ... you don''t find that exhilarating?
    In case, just save your TXT file over the old month, go into Excel, and click
    Data → Refresh All. You''re finished. _Seriously.


    This is where you see the real power of Power Query. It is easy to use, and it
    also easy to *reuse*. It changes your hard work into an investment and frees up
    your time during the next cycle to do something worthwhile.


    # Power Query Versions


    Before we tell you to get Power Query, let''s talk about the updates. Yes, that
    might seem putting the cart before the horse, but there is a pretty solid reason
    for this.


    # The Update Cycle


    The Power Query releases monthly updates. We''re not talking bug fixes (although
    those are certainly included); we''re talking new features and performance enhancements.
    While some are small, others are much larger. In February 2014 the team added
    the ability to connect to Microsoft Exchange as a data source. In 2015 the team
    released an update that cut query time by 30%. In July 2015 the team released
    an update that solved some very serious issues refreshing with Power Pivot.


    Are there risks in installing the latest updates as they become available? Sure
    are there. Bugs happen, particularly in complex software. The reality is that
    the Power Query team works very hard if you''re concerned, download the installer
    and save it rather than installing directly from the web. This will allow you
    to roll back if the need ever arises.


    If you have Power Query installed, make sure you update it. This book was written
    using version 2.24, released in July 2015, and you should be on at least this
    update.


    # Where Do I Get Power Query?


    The answer depends on the version of Excel that you have:


    +   * Excel 2010 and 2013—Download it from http://go.microsoft.com/fwlink?LinkId=317450.

    * Excel 2016—You already have Power Query installed, but the entry point is a
    bit different than in the Excel 2010 and 2013 versions.

    * Power BI Desktop—Wait, what? What does this have to do with Excel? A little
    and a lot, really. The short story is that Power BI is a standalone program for
    sourcing and modeling your data. As it happens, Power Query is the tool used to
    source and transform the data with Power BI Desktop, so you''re going to be learning
    a skill in this book that is portable to other applications. The Power BI Desktop
    can be downloaded from www.powerbi.com.'
  merge: -1
