    # # Values


    If you are working with databases, you will occasionally see containing values:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_177_0.png)


    Figure 24 The elusive value object.


    This particular object shows up only in certain cases. In order for it to appear,
    you must be working with a database that has a primary key and foreign key relationship
    set up between the tables. What''s really strange is that value is just what a
    database returns.


    > This particular table can be located in the AdventureWorks2012 database that
    you connected to in Chapter 8. Use the same method to connect as described in
    Chapter 8, connect to the Sales.Territory table, and remove the columns other
    than those showed.


    Once you know what values you have, working with them is the same as working with
    the other data types that are related to:


    > The direction of the relationship determines what is returned to a column when
    you''re working with a database. If you are in a fact table, and the link is going
    to the dimension table, you''ll receive a value (record). If you are in a dimension
    table, and the link is going to a fact table, you''ll receive a table.


    # # Binaries


    Binaries are essentially files. They can be combined and read using functions
    like CsvDocument(), whereas like Excel workbooks, cannot be combined and read
    using the Excel.Workbook() function.

    The process of extracting data from these workbooks was covered extensively in
    Chapters 3 and 4, so we don''t need to explore them further, other than to mention
    they are a Power Query object that you will encounter.


    # # Errors


    There are two types of error messages that you can encounter in Power Query: step-level
    errors and row-level errors.'
