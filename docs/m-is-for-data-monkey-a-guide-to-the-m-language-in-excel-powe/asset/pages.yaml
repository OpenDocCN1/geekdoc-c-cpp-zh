    Figure 243 (0) = Record 1?


    What just happened here?


    When treated in this way, the Source step returns a list of records. Because Power
    Query is base 0, record 0 returns the first value in the list. (If you''d made
    this =Source(1), you would have retrieved the record for the Talkative Parrot.


    Even more interestingly, you can drill in even further by appending the field
    name in square brackets. Try modifying the query to the following:


    ```

    =Source(0)[Price]

    ```


    As you can see, you just drilled right in and extracted the price for the first
    record in the table:


    |45


    Figure 244 Drilling into record 0''s price.


    To understand the relevance of this, consider a situation where you need to drill
    into a specific record in order to control filters. In Chapter 20 you''ll see
