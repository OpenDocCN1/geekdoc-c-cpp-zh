    Now, as great as it is to create a list from scratch like this, creating a list
    of numbers from 1 to 365 would be a bit of a pain. For reason, you also have the
    ability to use a shortcut to create a consecutive list from one number through
    another. Change the formula in the formula bar to read as follows:


