    When you have a list of repeating transaction numbers as you do in this example,
    you can pivot them. It will look little ugly at first, but you''ll see how incredible
    this truly is.


    +   - Select the Inserted Modulo -> Transform -> Pivot Column


    Now comes the tricky part: the values need to be set up correctly. By default,
    when you ask to pivot a column, the values in that column will be the column headers.
    Power Query then asks which values you want in the (or body) area of the pivoted
    data. The trick is here that pivoting data is usually done to summarize the values,
    and you aren''t interested in doing that. You want your original values, follow
    these steps:


    +   - Set the values column to Transactions

    - Expand the Advanced Options

    - Set the Aggregate Value Function to Don''t Aggregate

    - Click OK


