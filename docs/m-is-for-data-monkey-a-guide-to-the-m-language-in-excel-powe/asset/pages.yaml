    row number.


    In order to work that out, you need the index number for each row in the data
    set. As you are going to be using this new step in future calculations, you should
    also rename it to avoid # coding awkwardness:


    +   - Go to Add Column -> Add Index Column -> From 0

    - Right-click the Added Index step -> Rename -> Transactions


    You are now set and ready to build a formula that spans rows:'
