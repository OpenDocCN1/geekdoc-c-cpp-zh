    \ will run perfectly:\n\n```\nlet\nSource = Excel.CurrentWorkbook(){[Name=\"Sales\"\
    ]}[Content],\nNewType = Table.TransformColumnTypes\n(\nSource,\n  \"Price\", type\
    \ number\n)}\ninewType\n```\n\nWhy would you even use useful when to do this?\n\
    \nThis technique can be very useful when you're trying to debug things like lists\
