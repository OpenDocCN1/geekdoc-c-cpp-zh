  md: '# Chapter 15 Transposing and Unpivoting Complex Data


    Before you do anything else, you need to get the data into Power Query:

    * Select A1 -> create a new query -> From table

    * Extend the table boundaries to cover A1:A17


    The data is now ready for you, and it''s time to figure out how to approach it.


    # Creating a Module Column


    Rather than to transpose the records at this point, you''re going to take a different
    approach. You''re going to number the records, and you''re going to do it twice.
    To make this happen:

    * Go to Column -> Add Index Column -> From 0


    At this point, you have a numeric list of the transactions, starting from 0:


    | Transactions | Index |

    |---|---||

    | 1 | 10/27/2015 12:00:00 | 0 |

    | 2 | City of Vancouver | 1 |

    | 3 | | 123456 | 2 |

    | 4 | | 34.98 | 3 |

    | 5 | null | 4 |

    | 6 | null | 5 |

    | 7 | 10/27/2015 12:00:00 | 6 |

    | 8 | Earl''s Restaurant | 7 |

    | 9 | | 323511 | 8 |


    Figure 18 You have a number indicating the numeric data in the file. What we actually
    want is a number as it corresponds to each line of the transaction. In other words,
    the transaction data should always be 0, the vendor 1, and so on. To get that,
    you need to add a modulo column.


    Before you do, you need a key piece of information from the table: You need to
    know the value in the first row of the second record. In this case, value you
    are looking for is 6, as shown in the index column (Power Query starting from
    0, not 1). That number is going to be the factor for the modulo calculation.

    The modulo essentially takes a value, subtracts the closest multiple of the factor
    from the value provided, and returns the remainder. So if the value is 8, the
    modulo subtracts 6 and returns the remainder, which is 2. Try it out:


    +   * Select the index column

    * Go to Column -> From Number -> Standard -> Modulo -> 6


    You now have a list of the transaction line numbers!


    | Transactions | Index | Inserted Module |

    |---|---|---||

    | 1 | 10/27/2015 12:00:00 | 0 | 0 |

    | 2 | City of Vancouver | 1 | 1 |

    | 3 | | 123456 | 2 | 2 |

    | 4 | | 34.98 | 3 | 3 |

    | 5 | null | 4 | 4 |

    | 6 | null | 5 | 5 |

    | 7 | 10/27/2015 12:00:00 | 6 | 0 |

    | 8 | Earl''s Restaurant | 7 | 1 |

    | 9 | | 323511 | 8 | 2 |


    Figure 19 You now have a transaction line number for each item.


    This looks interesting, but why set this up in the first place? The answer lies
    in the solution to this data set.'
