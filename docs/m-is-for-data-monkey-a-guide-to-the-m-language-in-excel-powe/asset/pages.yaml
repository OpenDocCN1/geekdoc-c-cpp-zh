  md: '# Chapter 7 Importing Nondelited Text Files


    One of the biggest challenges for many Excel pros is importing and cleaning nondelited
    text files. If you''ve ever dealt with one, you know how painful it can be. They
    typically arrive with some default name like ASCII.TXT and are essentially character-by-character
    representations of what the output should look like when printed. they are subject
    to all kinds of crazy issues, including the following:


    +   - Characters aligned by position instead of delimited by a character

    - Inconsistent alignment

    - Nonprintable characters (such as control codes)

    - Repeating header rows


    A major part of the job for many Excel pros is importing this type of information
    into Excel and cleaning it. All of this has to happen *before* you can get to
    the analysis that adds business value.


    If you''ve been there, you know the process follows this general flow:


    +   1. Import the file into Excel via Data -> From Text.

    2. Work in a postage stamp-sized Import Wizard window, trying to determine how
    the columns are delimited and which to skip.

    3. Dump the results of the Import Wizard into a worksheet.

    4. Turn the data into a proper table Excel.

    5. Sort and filter the table to remove garbage rows.

    6. Clean and trim the text in the columns.


    And the best is that next month, when you get the updated data file, you get to
    relive this exciting process all over again. Wouldn''t it be better if there was
    a better way? Great news! Then, you''ve found it.


    # Connecting to the File


    You connect to a nondelited file the same way you connect to any other text file:


    +   - Create a New Query -> From File -> From Text

    - Browse to Ch007 Examples -> GL Jan-Mar.TXT


    Power Query puts the data in a single column:


    | Column1 | XYZ Company Ltd. | Pg 1 | PROPERTIES |

    |---|---|---|---||

    | 1 | | | Name |

    | 2 | Detailed General Ledger with Net Change for Aug 2004 to Mar 2009 | | GL
    Jan-Mar |

    | 3 | Dext - Restaurant Costs | | All Properties |

    | 4 | | | | |

    | 5 | Account | Begin | Final | APPLIED STE |

    | 6 | Description of Account | Balance | Change | Source |

    | 7 | | | | |

    | 8 | Jan 2006 | | | |

    | 9 | 123-03 | Purchases | 0.00 214,861.77 21 |

    | 10 | | | | |

    | 11 | Tran Date | Tran Amount | Source | Reference Information | Veil |

    | 12 | 01/02/2006 | 4,229.36 | G0001 | Food Purchase-Douglas | |

    | 13 | | 0,450 | G0002 | User-Direct | |


    Figure 84 The Power Query view of a nondelited text file.


    The first benefit you''ll notice over the standard Excel import process is that
    you get to work in a full-sized window. That is a massive improvement on its,
    as you can actually see what is going.


    > If the column is too narrow, just mouse over the right side of the column header,
    hold down the left mouse button, and drag it wider.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_66_0.png)'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'You''ll also notice, since the file is not delimited with any consistent delimiters,
    Power Query has not made any guesses about your data. Instead, it leaves the entire
    process to you. Given the state of this file, that is probably not a bad thing.


    Before we dig any further into this, note that there are many ways to import nondelimited
    text files, and none of them are right or wrong. The example in this chapter has
    been architected to show a great deal of transformations via the user interface,
    as well as the typical way Excel might approach this task. With more experience,
    you''ll find that quicker routes to the goal are almost certainly possible.


    # Cleaning Nondelimited Files


    The general goal when starting to clean up a nondelimited file is to get the data
    into a semblance of columnar data as quickly as possible. In this case, the top
    10 rows don''t seem to add much value, while the 11th row might be key columns.
    Therefore, go to Home -> Reduce Rows -> Remove Rows -> Remove Top -> 10 -> OK.


    The rows disappear and will not be imported into the solution:


    | Tran Date | Tran Amount | Source | Reference Information | Ver |

    | --- | --- | --- | --- | --- |

    | 01/02/2006 | 4,429.36 | G0001 | Food-North-North | |

    | 01/03/2006 | 10,450.96 | G0002 | Liquor-Purchase-Libr | |

    | 01/03/2006 | 128.25 | G0003 | Supply-Avis & Davis | |

    | 01/04/2006 | 4,895.61 | G0004 | Food-North-North | |

    | 01/04/2006 | 11,551.06 | G0005 | Liquor-Purchase-Libr | |

    | 01/04/2006 | 141.75 | G0006 | Supply-Avis & Davis | |

    | 01/06/2006 | 4,662.48 | G0007 | Food-North-North | |

    | 01/06/2006 | 11,001.01 | G0008 | Liquor-Purchase-Libr |


    Figure 85 The top rows are removed, bringing the headers closer to the top.


    Next, you need to choose a direction to break into this data. You could try breaking
    in the left or right, but currently there are a ton of extra spaces, and there
    are duplicated spaces in the middle. It would be nice to get rid of those.


    In Excel it is standard practice to run textual data through the TRIM() and CLEAN()
    functions in order to remove all leading, trailing, and duplicate spaces, as well
    as remove non-printing characters. Power Query also has this functionality, and
    here''s how you can apply that:


    +   - Right-click Column1 -> Transform -> Trim

    - Right-click Column1 -> Transform -> Clean


    The data looks a bit better:


    | Tran Date | Tran Amount | Source | Reference Information | Vendor Name |

    | --- | --- | --- | --- | --- |

    | 01/02/2006 | 4,429.36 | G0001 | Food-North-North Distributors | |

    | 01/03/2006 | 10,450.96 | G0002 | Liquor-Purchase-Libr Branch | |

    | 01/03/2006 | 128.25 | G0003 | Supply-Avis & Davis Distributors Inc | |

    | 01/04/2006 | 4,895.61 | G0004 | Food-North-North Distributors | |

    | 01/04/2006 | 11,551.06 | G0005 | Liquor-Purchase-Libr Branch | |

    | 01/04/2006 | 141.75 | G0006 | Supply-Avis & Davis Distributors Inc | |

    | 01/06/2006 | 4,662.48 | G0007 | Food-North-North Distributors | |

    | 01/06/2006 | 11,001.01 | G0008 | Liquor-Purchase-Libr Branch |


    Figure 86 Data trimmed and cleaned.


    At this point, you may notice that Power Query''s trim functionality doesn''t
    work the same as Excel''s. While Excel''s TRIM() function removes all leading
    and trailing spaces and replaces any duplicate spaces in'
