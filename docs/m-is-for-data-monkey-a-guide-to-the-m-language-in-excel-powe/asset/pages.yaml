  md: '# Operating on Each Row in a Column


    There is one very important construct in M: how to read and modify code that operates
    on each row in a column. To get this, you can take your existing query and add
    a column to determine the total sales by row:


    +   - Make sure you use the Advanced Editor

    - Select the Quantity and Price columns -> Add Column -> Standard -> Multiply

    - Right-click the Multiply column -> Rename -> Gross Sales

    - Right-click the Inserted Multiplication step -> Rename -> CalSales

    - Right-click the Renamed Columns step -> Rename -> Rename


    The query will now look like this:


    | Date | Inventory Item | Employ... | Quantity | Price | Sales |

    |---|---|---|---|---||

    | 1 | 5/10/2014 | Lovable Kitten | | 1 | 4 | 180 |

    | 2 | 5/9/2014 | Talkative Parrot | | 2 | 32 | 64 |

    | 3 | 5/24/2014 | Lovable Kitten | | 3 | 45 | 180 |

    | 4 | 5/20/2014 | Adobe Kitty | | 2 | 35 | 70 |

    | 5 | 5/8/2014 | Lovable Kitten | | 3 | 1 | 45 |

    | 6 | 5/23/2014 | Sleepy Gerry | | 1 | 39 | 39 |

    | 7 | 5/11/2014 | Cranky Crocodile | | 2 | 5 | 175 |

    | 8 | 5/19/2014 | Adobe Kitty | | 4 | 25 | 70 |

    | 9 | 5/9/2014 | Sleepy Gerry | | 3 | 5 | 195 |


    Figure 21 The query with a Gross Sales column.


    Viewing the code in the Advanced Editor yields two lines of code at the end of
    the query (wrapped lines have been indented here for identification):


    ```

    CalSales = Table.AddColumn(NewType, "Multiply", each

    List.Product([Quantity], [Price]), type number),

    Rename = Table.RenameColumns(CalSales, {"Multiply",

    "Gross Sales"}))

    ```


    While you may not recognize the function used in the Rename step, you can easily
    recognize that the Table.RenameColumns function refers to the previous step and
    provides a list of the previous column names and the name you''d like to make
    them. In addition, based on the fact that you see the line open with {two, you
    can identify that you could provide a list of lists and rename multiple columns
    at once.


    The CalSales line, however, has a new keyword that you''ve never seen before.
    The Table.AddColumn function refers to the NewType step and provides the value
    "Multiply". Since Multiply was the name given to the column, this means you could
    probably just change this line to use "Gross Sales" instead of avoiding the renaming
    of the column later.


    Following the column line is a new keyword you haven''t encountered yet: each.
    each keyword allows to Power Query that you performed this action for each row
    in the query. Following this, you will see the List.Product() function, which
    indicates columns to multiply against each other and the data type the output
    should take.


    You may now make some modifications to change the code short:


    +   - Replace "Multiply" in the column from the end with "Gross Sales"

    - Remove the comma from the end of the CalSales line

    - Remove the entire Rename line

    - Change the last line to read "CalSales" instead of "Rename"


    Your query should now look similar to this:'
