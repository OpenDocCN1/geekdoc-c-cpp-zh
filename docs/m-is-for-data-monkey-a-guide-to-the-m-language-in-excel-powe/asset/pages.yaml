    # Observations


    It is a real shame that not all the functions in Power Query have full equivalency
    with those in Excel, especially since Power Query is a tool for Excel users. Hopefully
    this will change in future versions; we''d like to see a new library of functions
    added that allow you to put your names and existing Excel formula directly into
    Power Query without needing to learn new formula names and syntaxes. That time,
    however, it is important to you test the results from the Power Query functions
    until Excel''s equivalents and make sure they match what you expect, as you will
    occasionally have to tinker with the output to get it to line up correctly.'
