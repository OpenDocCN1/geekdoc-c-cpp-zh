  md: '# Step 3: Calling the fnGetParameter Function


    With the table built, and the function in place, the last step is to retrofit
    the existing query to actually use it. Doing so will allow you to source the file
    path from the cell and use that in your query. Because the file path updates the
    workbook is recalculated, it will always be accurate, which means the solution
    will always look for the timesheet files in the subdirectory of the solution resides.

    To retrofit the Timesheets, you don''t even have to leave the Power Query editor.
