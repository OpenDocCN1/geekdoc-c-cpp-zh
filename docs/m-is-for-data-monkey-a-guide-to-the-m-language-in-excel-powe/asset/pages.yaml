    # # Reordering Steps


    When you review the steps in the Applied Steps, you can see that after you split
    the columns by delimiter, Power Query automatically inserts a step to change the
    column types. Unfortunately, the data is lined up to the left, so you know Power
    Query configured everything as text.


    You need to fix that if you go back to the Changed Type step and start converting
    the data types to dates and values, you''ll cause errors across row 1. (They are
    all values and have been promoted to headers) It really makes sense to change
    the column types after you have promoted headers, not before. Try moving that
    type step down by right-clicking the Changed Type step → Move Down.


    The step moves, but it causes an error when doing:


    > > Expression.Error: The column ''Column1.1'' wasn''t found.

    >

    > Details:

    >

    > Column1


    Figure 30 Power Query tells you it can''t find a specific column name.


    The reason this error shows up is that the Changed Type step was setting the data
    types on Column1.1. But since you promoted the column headers, there is no Column1.1;
    it''s now TranDate.


    Moving steps in Power Query can be a very handy feature, but you have to watch
    out for errors like the one just shown.


    As you become comfortable with Power Query, you might decide to fix a problem
    like this using the formula step directly, but for the easiest way to fix this
    specific issue is simply to delete the step and re-create it:


    +   * Remove the Changed Type step by deleting it in the Applied Steps box

    * Right-click Amount → Change Type → Decimal Number


    > If you get an error in the column when you do this, you can fix it by doing
    the following: Select

    the Promoted Headers step → right-click the Amount → Replace Values. Replace the
    $

    sign with nothing. At this point, what will work when the Changed Type step works.
    The root cause of the issue is that your regional settings use a – for negative
    numbers as opposed to putting negative numbers in parentheses.


    You''re almost there. You just have the date column left to go. For now, go to
    Home → Close & Load to finalize the query.'
