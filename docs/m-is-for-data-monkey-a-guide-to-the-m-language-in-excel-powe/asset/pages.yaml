    \ ... manual. Wouldn't it be better if\ncould schedule an update, or maybe control\
    \ the order in which things update?\n\n# ## Options for Automating Refreshing\n\
    \nYou can use a few different methods of automating the refreshing of Power Query\
    \ solutions:\n\n+   - Refresh when the workbook is opened\n- Refresh every x minutes\n\
    - Refresh connection on demand via VBA\n- Refresh all connections on demand via\
    \ VBA\n- Schedule refreshes via a third-party add-in\n\nEach works differently\
    \ and has its own benefits and drawbacks, as you'll see in this chapter.\n\n#\
    \ ## Scheduling Refreshes Without Code\n\nThe first two methods for automating\
    \ refresh are both explored through the user interface\nand don't require any\
    \ VBA code whatsoever. They can be configured on a connection-by-connection basis,\n\
    and you can even automate the refresh to Power Pivot if desired. Each of these\
    \ connections is controlled by\navigating to the Workbook dialog in Excel (not\
    \ Power Query):\n\n+   - Go to Data → Connections → select your query → Properties\n\
    \nThis launches the following dialog, where you can check the box to update the\
    \ query when the file is opened:\n\n![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_142_0.png)\n\
    \nFigure 195 Setting connection options.\n\n# ## Background Refreshing\n\nIn the\
    \ Connection Properties dialog, notice that the Enable Background Refresh checkbox\
    \ is selected by de-\fault. This setting allows you to specify whether you'd like\
    \ to keep working in Excel while the data refreshes. If\nuncheck this box, you\
    \ could potentially decrease the amount of time it takes to refresh your solution,\
    \ but\nYou'll also lock out the user interface, which means you won't be able\
    \ to do other things until it is complete.\n\nIf you want to prevent users from\
    \ working until the data is fully refreshed, you want to disable this\nsetting.\
    \ If you need to do other things while you wait, however, this setting is best\
    \ left alone."
