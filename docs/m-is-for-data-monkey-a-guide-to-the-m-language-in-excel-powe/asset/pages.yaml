  md: "# Chapter 11 Defining Data Types\n\nAs Power queries, it is getting better\
    \ and better at automatically setting appropriate data types on columns of data.\
    \ Even so, there are still times when it pops up with an odd choice (or no choice\
    \ at all). This can leave hidden traps in data sets that rear their heads when\
    \ you expect it and can cause all kinds of confusion.\n\n# What Data Types Are\
    \ Recognized?\n\nPower Query recognizes several data types—more, in fact, Excel\
    \ does. The complete list of Power Query's data types is:\n\n+   - Number: Decimal\
    \ Number, Whole Number, Currency\n- Date/times: Date/Time, Date, Time, Date/Time/Timezone\n\
    - Text: Text\n- Boolean: True/False\n- Object: Binary\n- Undefined: Any\n\nThe\
    \ true killer is in the last data type. Any is a variant data type that Power\
    \ Query will use to indicate that it's not sure of the data type. The challenge\
    \ here is that data defined as Any could take a variety of forms when being loaded\
    \ or referenced in the future.\n\n# Why Data Types Are Important?\n\nTo demonstrate\
    \ the importance of defining data types, in this chapter you will create a new\
    \ query and remove the data types that Power Query defines for. This will give\
    \ you a good understanding of why declaring data types is important and not something\
    \ you should leave to chance.\n\n# Tables and the Any Data Type\n\nStart by loading\
    \ a query with no defined data types into an Excel table:\n\n+   - Open Ch11 Examples\\\
