  md: "# Chapter 23 Dynamic Parameter Tables\n\n# Step 2: Implementing the fnGetParameter\
    \ Function\n\nWith the parameter name in a state that can hold any variable you,\
    \ you need to give Power Query a method to read those values. This portion can\
    \ be done by using the following custom function:\n\n```\n(ParameterName as text)\
    \ =\nlet\n    ParamSource = Excel.CurrentWorkbook()\n    [Name=\"Parameters\"\
    ]][Content],\n    ParamRow = Table.SelectRows(ParamSource,\n        each ([Parameter]=ParameterName),\n\
    \    Value=\n        if Table.IsEmpty(ParamRow)=true\n        then null\n    \
    \    else Record.Field(ParamRow(0),\"Value\")\nin\nValue\n```\n\n> This function\
    \ is contained in the fnGetParameter.txt file in the Ch23 Examples folder. In\
    \ addition to the code, it also contains instructions to use the function, as\
    \ well as the formula to return the path from a cell. The file is provided to\
    \ give you a template you can store and use multiple times.\n\nThis code connects\
    \ to the Parameters table in the workbook and then selects the row of the table\
    \ where the dynamic parameter's value matches the record in the Parameter column\
    \ of the Excel table. With that match in place, it returns what it finds in the\
    \ Value column. It is because each of these names is hard coded in the function\
