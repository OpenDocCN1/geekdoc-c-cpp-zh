    they are huge buckets of email back spanning sometimes months but more often years.
    As a result, retrieving data from Exchange can be very slow.


    The solution to this is to use rules to reroute key emails into subfolders. When
    the subfolders contain relevant data, retrieving, transforming, and loading the
    finished product will happen much more quickly.'
