  md: '# 12 Importing Web Data


    One of the really interesting use cases for Power Query is leveraging it to pull
    data relevant to your business from the web.


    Power Query works very well when website data is stored in tables, and occasion
    it even lets you access a text file that is holding information. If the data isn''t
    formatted with table tags in the HTML code, however things become very difficult,
    even if you have some HTML knowledge.


    # Connecting to Pages with Tables


    For the example in this chapter, you will take the role of a marketing person
    who is trying to figure out the best countries in which to market a product. The
    primary statistic that you want to figure out front is 10 countries that have
    the largest populations, as that seem to be a factor that could be reasonably
    constructed to drive sales.


    In order to get this, you have explored the populations of the countries of the
    world. You would have come a web page with that to pull this data into Excel that
    you can use with other tools. Follow these steps:


    +   - Create a new query -> Other Sources -> From Web

    - When prompted for the URL, enter the following: https://www.cia.gov/library/publications/the-world-chatroom/rankorder/2119rank.html

    - Click OK


    You are prompted with a set of authentication options:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_112_0.png)


    There are several options down the left side of the dialog, allowing you to choose
    from Windows or basic authentication, provide a Web API key, or provide your Office
    365 credentials. The important one to you at this point is the Anonymous option.


    The question you are asked here is if you''d like to use these credentials for
    the specific page or the root domain. While there are sometimes reasons to choose
    the specific page, changes that you''re probably going to want to stick with the
    default—root domain—in most cases. So ensure that the first option is selected
    and click Connect.


    At this point, Power Query inspects the document, looking for tables. Once it
    has worked out the content it recognizes, it sends you to the Navigator pane.
    In this case, there two options to choose from—Table 0 or Document:'
