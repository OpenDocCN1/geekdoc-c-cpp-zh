  md: '# Replicating Excel''s FIND() Function


    By now you are wondering what the big deal is. It is obvious that the Power Query
    team changed the way we reference formulas. In fact, the team have injected some
    logic to guard all the formulas together, as they start with Text.FunctionName.


    But the changes are also a bit bigger. Let''s take a look at replicating Excel''s
    FIND() function.

    The following table is using FIND() to find a lowercase o in the words. Naturally,
    that works in some cases, and it returns errors in the case of words that don''t
    contain the specified character.


    | Word | FIND("o",x) |

    |---|---|n| Football | 2 |

    | Doorknob | 2 |

    | Bookkeeper | 2 |

    | Automobile | 4 |

    | Mountain | 2 |

    | Truck | #VALUE! |

    | Car | #VALUE! |


    Figure 211 The FIND() function you want to replicate.


    Follow these steps to see how Power Query handles:


    +   * Select a cell in the data -> create a new query -> From Table

    * Change the query name to qfind


    Before you add the custom column, you should know that the new name for FIND in
    Power Query is Text.PositionOf(). Using the syntax of the FIND() function means
    that you should be able to go with this:

    `=Text.PositionOf("", [Word])`


    Try it:


    +   * Go to Add Column -> Add Column

    * Name the new column pfind("o",x) and enter the formula above

    * Click OK


    The results are from what you prefer:


    | Word | FIND("o",x) | pfind("o",x) |

    |---|---|---|

    | 1 Football | 2 | |

    | 2 Doorknob | 2 | -1 |

