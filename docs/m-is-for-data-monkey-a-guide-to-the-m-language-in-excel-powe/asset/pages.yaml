    # # Surviving an Update


    At this point, you''d be fairly comfortable saving the file, returning it to you,
    and letting him continue to update it. After all, Power queries can be refreshed
    at any time.


    But say that you do so and the user updates and sends it back to you. Upon opening
    the file, you see that the user has done changes that only an end user could think
    of:


    | Sales Category | 1/1/2014 | 1/2/2014 | 1/3/2014 | 1/4/2014 | 1/5/2014 | 1/6/2014
    | 1/7/2014 | Total | 1/8/20 |

    |---|---|---|---|---|---|---|---|---|---||

    | Beer | 103 | 243 | 101 | 137 | 107 | 185 | 111 | 983 | 34 |

    | Wine | 175 | 223 | 138 | 57 | 66 | 199 | 92 | 170 | 86 |

    | Cider | | | | | | | 78 | 90 | 47 |

    | Liquor | 162 | 207 | 103 | 179 | 150 | 147 | 180 | 1,128 | 23 |

    | Total | 440 | 673 | 342 | 373 | 319 | 609 | 466 | 3,222 | |


    Figure 81 The table, as returned by the end user.


    Looking through the changes, you''re re-astounded to see the following:


    +   - The day is added after the total column.

    - A new sales category has been injected with retroactive data.

    - The user didn''t complete the total on the new column.


    How will the refresh fare, given these changes? To find out, go to Data tab and
    click Refresh All two times (once for the Power Query and once for the PivotTables).'
