    Finally, you can complete the query:


    +   - Change the query name to ManualCombine

    - Home → Close & Load

    - And at this point create a PivotTable and that it matches the results you got
    in the previous section, with the only difference being that you''ve included
    a new field that was derived from the properties—something that is impossible
    using the easy Binaries method.


    # Implications of the From Folder Feature


    Importing on one file as described in Chapter 2 is the way people start building
    Power Query solutions. That approach can work well in any of the following scenarios:


    +   - Where the data set will grow slowly over time

    - Where the transformation requirements are different for each file in the folder

    - Where you didn''t realize the solution would expand over multiple files


    If, however, you suspect that a solution may grow bigger than one file, and the
    data setup will be consistent, there is nothing to stop you from using the approach
    in this chapter as follows:


    +   - Set up a subfolder

    - Move your single file into that folder

    - Leverage the Import From Folder functionality against the subfolder


    Yes, or there is only one file there today, but what? As you get new files that
    pertain to the solution, just throw them in the subfolder, and they are instantly
    part of your solution!

    Sometimes a little foresight can go a long way in building solutions that stand
    the test of time.'
