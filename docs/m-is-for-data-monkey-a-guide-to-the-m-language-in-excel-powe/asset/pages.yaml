    <a name="wfbtop">/</a>

    <div id="footer">/</div>

    <- footer --

    <div class="fbtitleRankOrder">/</div>

    <div class="rankOrder">/</div>

    <div class="smalltext">/</div>

    <div class="smalltext"></div>

    <table id="rankOrder">

    <tbody>

    <tr class="rankheading">

    <th>Rank</th>

    <th>Country</th>

    <th>POPULATION</th>

    <th>Date of Information</th>

    </tr>

    </tbody></table>

    ```


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_115_0.png)


    The trick to do this is to find the class tag you are looking for. Then you mouse
    over every arrow and watch what it highlights in the document window. When highlighting
    your tables, you can find the element by clicking on the arrow that points right.
    (In this case, <body> needs to be expanded.)


    The arrow rotates down, expanding more elements, and then the process continues
    until you have your data. Next, you expand <div class="main-block"> and then <section
    id="main"> and then see the up level div, and so on.


    If you accidentally fall into a hole that doesn''t have your data, you go back
    up one level and collapse that block of code by clicking the arrow. This rotates
    the arrow back from pointing down to pointing right, and it collapses the elements
    contained within that.


    Once you have navigated through the process and found your data, you can begin
    the painful second portion: replicating the navigation in Power Query. Here is
    what you do:


    +   - Create a new query From Other Sources

    - Enter the URL used for the first example: https://www.cia.gov/library/publications/the-worldfactbook/rankorder/2119rank.html

    - Click OK -> Document -> Edit'
