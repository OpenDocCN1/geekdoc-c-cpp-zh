  md: '# # Step 1: Creating a Table


    The first thing you need is to create a table to hold your parameters. This table
    should take a specific form, and it needs to have certain components set up correctly.


    Create the table below in cell A7:B8 of the Info worksheet:


    | File | Home | Page Layout | Formulas | Data | Review | View | Developer | Power
    Pivot |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | Table Name: | Summarize with PivotTable | | Properties | Header Row | First
    |

    | Parameters | Remove Duplicates | | Open in Browser | Total Row | Last |

    | Resize Table | Convert to Range | | Insert Export Slicer | Unlink | Banded Rows
    | Ban |

    | Properties | Tools | | External Table Data | Table |


    | A8 | B8 |

    | --- | --- |

    | Parameter | Value |

    | File Path | |

    | | |

    | | |


    Figure 32 The barebones Parameters table.


    Notice several key characteristics of this table:


    +   - The first column''s header: Parameter

    - The second column''s header: Value

    - The table has a name of: Parameters


    > Each of these characters must be correct if you want to copy and paste a function
    you''ve been provided in the download files. If even one of these items is spelled
    differently, you will need to debug the table or the function.


    The table is now set to hold every piece of data that you want to use as a dynamic
    variable in your solution. Simply provide the name of the parameter on the left
    and the value for the parameter in the Values column.


    Next, you need to determine the path to the current workbook. Enter the formula
    below into cell B8:


    ```

    =LEFT(CELL("filename", A1), FIND("", CELL("filename", A1),1)-1)

    ```


    > > If you haven''t saved your file, this function won''t return the path as it
    can''t determine where the workbook lives. Saving the file will fix this issue
    for you.


    Upon doing, you should see the path to the workbook. The only challenge is that
    you actually want this path to point to the Source Files folder, where is the
    timesheets are stored. Update the formula as follows:


    | A | B |

    | --- | --- |

    | Parameter | Value |

    | File Path | D:\pqTraining\Ch 23 Examples\Source Files\ |

    | | |

    | | |


