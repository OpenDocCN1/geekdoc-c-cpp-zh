    | 2 | Escobar,Miguel |


    Figure 229 You can still use commas in list output.


    # Converting Lists into Tables


    Say that you want to split your data into two columns, that is not possible with
    a list as lists are restricted to a single column of data. In this case, you really
    need the richer transformational toolset that offers.


    Not to worry: It is super easy to transform a list into a table. Just click the
    big To Table button in the top left of the List Tools contextual tab. This interesting
    dialog appears:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_168_0.png)


    Figure 230 What''s this about delimiters?'
