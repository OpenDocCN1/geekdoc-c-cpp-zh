    | 4 Automobile | 4 | -1 |

    | 5 Mountain | 2 | -1 |

    | 6 Truck | Error | -1 |

    | 7 Car | Error | -1 |


    Figure 212 What the case is going on


    In Power Query, the -1 for result informs you that Text.PositionOf() found no
    match. But how is that possible? The letter o plainly appears in a bunch of those
    words.

    to find the answer, examine the syntax for this function, compared to Excel''s:


    | Syntax | Example | Result |

    |---|---|---|

    | Excel | =FIND(find_text,text_within) | =FIND("xc", "Excel") | 2 |

    | Power Query | =Text.PositionOf(text, find_text) | =Text.PositionOf("Excel","xc")
    | 1 |


    Do you see the difference? Not only is the FIND() function masquerading under
    a new name, but the order of the parameters has flipped! That will certainly cause
    an issue. Now you need to follow these steps:'
