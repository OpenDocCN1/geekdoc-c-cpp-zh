    This process may seem incredibly painful, but if you follow these steps, you can
    easily update an Excel 2010 Power Pivot when changes are made to your Power Query
    queries. The process is tedious, but it''s always the same.


    > The problem with loading directly to Power Pivot in Excel 2010 is that both
    Power Query and Power Pivot was integrated into Excel 2013 and Power Query in
    2016. From Excel 2013, Power Query and Power Pivot were able to start talking
    to each other, and Excel can handle this process without manual intervention.


    # Data Models in Excel 2010 and 2013


    Because Power Query is a separate add-in for Excel 2010 and 2013, there are some
    very dangerous idiosyncrasies you need to be aware of when using Power Query.
    Fortunately, these have been solved with Excel 2016 and for people using Excel
    2013, but if you are developing in earlier versions, you either need to go "all
    in" with Power Query or avoid it.


    # How to Correct Your Model


    Corrupting your model is deadly, and the worst part is that you may not realize
    for months that you''ve done it. Here is a very easy way to do (and it''s safe
    to try it here, go for it!)


    +   * Open the CH10 Examples\Load Destinations – Complete that pertains to your
    version

    * Open Power Pivot

    * Rename the worksheet Transactions'
