    Compacting the code is an entirely optional step. You are able to keeping your
    code by copying the previous step and substituting it into the next step in place
    of the previous step name. While this can make your code more compact and efficient,
    be aware that it could drastically affect your ability to debug your code in the
    case something goes wrong. The trick is to find a happy medium that makes sense
    to you.


    # Referring to the Previous Row Dynamically


    There is one more task to accomplish with this data set: working out the number
    of days since the previous row. Unfortunately, while it would be incredible to
    just click a button to make this happen, you''re not so, as Power doesn''t have
