    = (1..365)

    ```


    You get a nice consecutive list from 1 to 365:


    | | List |

    |---||

    | 1 | 1 |

    | 2 | 2 |

    | 3 | 3 |


    Figure 228 Using the . characters to create a consecutive list.


    > You can create consecutive alphabetical lists in this manner as well, provided
    that you wrap the characters in quotes and use only a single character. For example,
    ="A"..J" will work, but ="A"..ZZ" will not.


    You can also use commas inside lists, provided that they are inside the quotes.
    Replace the formula in the formula bar with:


    ```

    = ("Puls,Ken","Escobar,Miguel")

    ```


