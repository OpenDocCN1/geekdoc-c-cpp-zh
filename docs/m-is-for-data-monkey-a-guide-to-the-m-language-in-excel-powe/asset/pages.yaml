  md: "# Refreshing All Power Query Queries\n\nIn order to refresh all Power Queries\
    \ in a workbook, you need to use a slightly different block of code. The following\
    \ macro will look through all connections in the workbook and identify whether\
    \ they are created by Power Query (and it ignores others):\n\n```\nPublic Sub\
    \ UpdatePowerQueriesOnly()\n    Dim LTest As Long, cn As WorkbookConnection\n\
    \    On Error Resume Next\n    For Each cn In Workbook.Connections\n        LTest\
    \ = InStr(1, cn.OLEDBConnection.Connection,\n\"Provider=Microsoft.Mashup.OleDb.1\"\
    )\n        If Err.Number <> 0 Then\n            Err.Clear\n            Exit For\n\
    \        End If\n        If LTest > 0 Then cn.Refresh\n    Next cn\nEnd Sub\n\
    ```\n\nThis macro can be stored in the same workbook as the one created in the\
    \ previous section, or it can replace the previous code (which you would need\
    \ to relink your to the new macro instead).\n\n> Be aware that the code above\
    \ will not necessarily refresh the queries in the order you need to be refreshed,\
    \ as Excel refreshes queries in alphabetical order. Fortunately, you can change\
    \ the name of the queries by going to Data → Connections → Properties and modifying\
    \ the connection name. You can rename each query into an order such as 01-Jan-2008,\
    \ 02-Feb-2008, 03-Mar-2008, 99-Transactions. By doing this, you ensure that a\
