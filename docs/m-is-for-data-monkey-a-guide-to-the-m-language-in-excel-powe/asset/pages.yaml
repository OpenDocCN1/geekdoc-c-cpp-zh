  md: '# Chapter 14 Grouping and Summarizing


    Let''s circle back for a moment and look at what happened first and then look
    at what you got from it.

    The formula you use examines a table and extracts the max value from the given
    column. For the parameters, you provide the [Details] column of the query, as
    that holds the tables to be examined. The column within that table, amount, was
    provided, wrapped in quotes as the function requires.

    Unlike formulas you''ve seen, this function doesn''t just return the value. It
    returns a record. This is fantastic because the record doesn''t just hold the
    maximum value. It holds all of the details that go with that data.


    You''ll learn more about records in Chapter 19.

    In addition, you can expand the MaxRecord column by using the double-headed arrows
    on the top right to get the individual components into:


    +   * Click the Arrow on the MaxRecord column

    * Expand the ProductName and Amount columns and uncheck the Prefix at the bottom
    -> OK

    * Right-click the Details column -> Remove

    * Right-click the Product column -> Rename -> TopSeller

    * Right-click the Amount column -> Rename -> TopSeller


    The result is that you have a table that summarizes sales by Date and Channel
    and clearly shows the top-item, as well as its contribution:


    | Date | Channel... | Pro... | Sales $ | TopSeller | TopSeller |

    |---|---|---|---|---||

    | 1 | 3/6/2015 Reseller | | | 164.7 Cap Seller | 164.7 |

    | 2 | 3/6/2015 Online | | | 180.3 All Seller | 180.43 |

    | 3 | 3/6/2015 Online | | | 248.3 Short Seller | 229.92 |

    | 4 | 3/11/2015 | | | 184.2 3/4 Seller | 184.02 |

    | 5 | 3/12/2015 Online | | | 230.6 Short Seller | 230.67 |

    | 6 | 3/13/2015 Online | | | 133.9 Short Seller | 133.98 |

    | 7 | 3/14/2015 | | 2 | | 327.1 Long Seller | 163.55 |

    | 8 | 3/14/2015 Online | 1 | | 116.83 3/4 Seller | 116.83 |


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_130_0.png)


    There is only one thing left to do: work out the percentage the top seller represents
    of the total daily sales. That is easily achieved with a simple calculation:


    +   * Go to Column -> Add Custom Column

    * Set the column to TS % of Sales and enter the following formula:

    `"#TopSeller $"/##Sales $\$\`


    Don''t let the hash marks and quotes mess you up. The easiest way to build the
    formula is by clicking the field names on the right, and Power Query will put
    them in for you. You''ll learn more about why why when you read Chapter 21.


    The result is a little ugly, with some showing no decimals, some showing one,
    and others showing a ton. You can run out quite easily:


    +   * Set the TS % of Sales column -> Transform -> Rounding -> Round... -> 2


    Make sure you use the Transform tab to perform this operation. If you don''t,
