  md: '# # Chapter 15 Transposing and Unpivoting Complex Data


    When working with real-world data, Excel often encounter data that needs to be
    treated in a variety of ways. While unpivoting is extremely common, on occasion
    you may need to reverse this and pivot data before making more complex transformations.
    Another technique that can be extremely useful is transposing data—for example,
    flipping data that is laid out in a vertical manner so that it''s displayed horizontally
    (or versa). Both of these functions are, fortunately, built in the Power Query
    interface and can aid in transforming data into tables.


    # ## Unpivoting Subcategorized Tables


    The first example we will deal with in this chapter is unpivoting a subcategorized
    table. While we looked at unpivoting in Chapter 6, this scenario, based on the
    figure below, adds another dimension to the issue.


    | | April Budget Variance | | Account Month Measure Value |

    |---|---|---|---|---|---|---||

    | Alcohol | 15,747.28 | 25,012.00 | (9,264.72) | April | Actual | 15,747.28 |

    | Food | 34,523.71 | 44,740.00 | (10,216.29) | Food | April | Actual |

    | Other | 237.79 | 3,867.00 | (3,629.21) | Other | April | Budget | 25,012.00
    |

