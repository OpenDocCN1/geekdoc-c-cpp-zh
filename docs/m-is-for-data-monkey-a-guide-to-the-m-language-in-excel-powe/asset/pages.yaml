  md: '# Referring to Steps or Rows


    Consider a scenario where you have a text file that contains data like that shown
    below:


    The Challenge:

    Import rows between ID Number and ID Total


    | ID Number | Amount | OrderDate |

    | --- | --- | --- |

    | 1234 | 5 | 2015-05-01 |

    | 1235 | 45 | 2015-05-12 |

    | 1236 | 82 | 2015-05-13 |

    | 1237 | 32 | 2015-05-22 |

    | ID Total | 164 | |


    Figure 264 Tab-delimited data with a specific requirement.


    This data draws a few interesting wrinkles:


    +   - The data is delimited, but the first row doesn''t contain any tabs. This
    means you will need to manually trigger the column splits.

    - The number of rows prior to ID Number is variable. There could be 5 or 5,000
    rows before the row that contains the ID text.

    - The number of rows between after and the ID row is also variable.


    Your overall challenge here is that you need to extract rows from the middle of
    a data set and make dynamic to deal with however many rows are evident, in the
    middle of, and after the needed data.


    In addition, as one final wrinkle, you''d like to determine the number of days
    between each order date compared to the previous order. This task will entail
    trying to subtract the date on one row from the data on another—something that
    can''t be done via the Power Query user interface.


    # Connecting to the Data


    You need to connect to the data and figure out which rows you need in order to
    perform your goals:


    +   - Open a blank workbook

    - Create a new query -> From File -> From Text -> Ch20 Examples|Varying Header
    Rows.txt -> OK

    - Go to Add Column -> Add Index Column -> From 0

    - Filter Column1 -> Text Filters -> Begins With

    - Set the filter By ID Number OR Rows With ID Total

    - Right-click and rename the Filter Rows to RowNumbers


    > You could accomplish the same goal by filtering to rows that begin with ID,
    but you''t making the terms as tight as possible, you can reduce the chance of
    errors in the future. (Of course, if another ID Number row enters the data, you
    will still have to work out how to deal with this.)


    The query should now look as follows:'
