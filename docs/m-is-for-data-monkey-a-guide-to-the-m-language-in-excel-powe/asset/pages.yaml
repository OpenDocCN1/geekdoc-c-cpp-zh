- img_proc: true
  md: 'The challenge here is Power Query relies on the CSV file being a proper CSV
    file because it wants to read the data based on commas. It reads the first row
    to determine how many columns exists. Since there are no commas in line, Power
    Query figures that it reads a single column. It then starts to read each row and
    steps at the first column.


    Normally this process works fine. But in the case of this file, Power Query ignores
    a large part of the data you need. The news is that you can fix this by telling
    Power Query how the file needs to be treated.


    # Overriding Power Query''s Default Queries


    Power Query loves to be helpful by trying to make assumptions about data. While
    it''s often, it can occasionally be wrong and needs some manipulation.


    There are two main ways these issues manifest in the user interface: Power Query
    sometimes inserts extra steps that are incorrect/irrelevant, and sometimes misconfigures
    steps. You deal with these two problems differently, as discussed in the following
    sections.


    # Removing Power Query Steps


    Of the two Power Query problems just mentioned, removing added steps is by far
    the easier.


    In the case of import shown earlier in this chapter, Power Query did two things.
    First, it imported the file, and then set the data type on Column1. The challenge
    here is you need to change the import format, and you may not be sure if you''ll
    even have a column the Changed type needs. This is very easy to delete—simply
    mouse the step in the Applied Steps box and click the x on the left of the step
    to delete it from the Power query sequence:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_29_0.png)


    Figure 25 Removing a step in Power Query.


    > Be aware that if you delete steps in the middle of a query that are important
    to the end, you may cause the query to throw an error by the end. In addition,
    there is no functionality in the area of the user interface!


    In this case, deleting the Changed Type step doesn''t appear to change anything
    in the query at this point. (After all, Power Just forced the step to be treated
    as text.) It does, however, help you avoid errors as if you fix the problem, described
    next.


    # Reconfiguring Steps


    Now you need to change the way Power Query handles the file at import. To do that,
    you need to click the little gear icon on the right side of the Source step. When
    you do, you''re launched into a configuration window:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_29_1.png)


    Figure 26 Changing the details of the file to be imported.


    This dialog allows you to change a few important things about the file, including
    the file path and what type of Power Query should assume this is when trying to
    import it. Because the file in this case carries the CSV file extension, Power
    Query chose the Csv Document type.'
  merge: -1
  pgno: 29
