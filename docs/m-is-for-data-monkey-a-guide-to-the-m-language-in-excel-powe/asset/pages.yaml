  md: '# Chapter 0 Introduction: A New Revolution


    Power Query is the ETL tool; its function is to extract data from almost any,
    transform it as desired, and then load it. What does that truly mean to us as
    Excel pros?


    # Extract


    Extraction can be targeted against one or more data sources, including text files,
    CSV files, Excel files, databases, and web pages. In addition, the Power Query
    team has many connectors to data sources that have otherwise been tough to get
    at—Microsoft Exchange, Facebook, Salesforce, and other Software-as-a-service sources.


    # Transform


    When we talk transformation, we include each of the following areas:


    +   * Data cleaning—Data cleaning could involve filtering out departments from
    a database or removing blank or rows from a text file. Other uses include changing
    cases from uppercase to lowercase, splitting data into multiple columns, and forcing
    data to import in the correct format for a particular country. Data cleaning is
    anything you need to do to your data you can clean it up.

    * Data integration—If you use VLOOKUP() or INDEX(MATCH(), you''re probably integrating
    data sets. Power Query can join data in either vertical or horizontal fashion,
    allowing you to join two tables (creating one table) or merge tables together
    horizontally, without having to write a single VLOOKUP() function. You can also
    perform other operations, such as querying.

    * Data enrichment—These tasks include adding new columns or calculations over
    a data set. Power Query makes it easy to perform mathematical calculations like
    creating Gross Sales by multiplying Quantity * Price or add new formats of dates
    based on your transaction date column. In fact, with Power Query you can create
    tables dynamically, based on the value in an Excel cell. Need a dynamic table
    that runs years back from today''s date? Look no further than Power Query.


    Power Query allows you to perform many transformations through menu commands without
    ever having to write formulas or code to them. This tool was built for Excel pros,
    and with no coding experience whatsoever, you can use Power Query to perform transformations
    that would be incredibly complex in SQL or VBA. That''s a great thing!


    If you''re the type of person who likes to get under the covers and tinker with
    formulas or code, however, you can. While there is no requirement to learn it,
    Power Query records everything in a language called M (Languages L were). And
    if you''re a wizard who decides to take advantage of this language, you can build
    even more efficient queries without it.


    # Load


    With Power Query you can load data into one of four places:


    +   * Excel tables

    * The Pivot Data Model

    * Power BI

    * Connections only


    The last point might seem a bit mysterious, but it simply means you can create
    a query that can be used by other queries. This allows for very interesting use
    cases that we''ll explore more in the book.


    While it''s interesting to look at where the data loads, really isn''t the important
    part of the loading process in this ETL tool. It''s how it loads or rather how
    to load it.


    Power Query is essentially a macro recorder keeps track of every bit of the extract
    and transform steps. You can define a query once and determine where you''d like
    to load it. After you''ve done that, you can simply refresh your query to run
    it again.'
  merge: -1
