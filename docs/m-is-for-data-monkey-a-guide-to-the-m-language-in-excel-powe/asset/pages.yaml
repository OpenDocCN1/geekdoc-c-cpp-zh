    # # Append Consistent Data Types


    Since you already know the data types are defined in the May query, you can make
    the data types consistent in the June query and see how that affects the append
    queries:


    +   - In the Workbook Queries right-click June -> Edit

    - Set the data column to a Date data type

    - Set the Inventory Item and Sold By columns to Text data type

    - Set the Cost and Price columns to a Number data type

    - Set the Commission column to a Decimal number data type

    - Go to Home -> Close & Load


    And now you can refresh one of the two appended queries to see the effects. No
    matter which choose, you''ll find that the values in the Date column show properly
    defined as Date types.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_110_0.png)


    | Date | Inventory Item | Sold By | Cost | Price | Commission |

    |---|---|---|---|---|-|

    | 1 | 6/26/2014 Puppy Turtle | Fred | 8 | 30 | |

    | 2 | 6/26/2014 Lakeside Parrot | Jane | 17 | 32 | |

    | 3 | 6/20/2014 Rambunctious Puppy | Fred | 9 | 30 | |

    | 4 | 6/21/2014 Lovitten Kitten | John | 12 | 45 | |


    Figure 14 The data type is applied to the append query''s column.


    # # Data Type Best Practices


    While it is tempting to rely on Power Query to assign data types and continue
    on, we recommend that you review the final set of every output query and define
    your data types. Even though Microsoft is constantly improving the interface,
    there are still stands in the Power Query interface that will return an Any date,
    even if it was defined before.


    Until recently, an example of this was creating a month end from a date. Even
    though the column with the date returned a value that looked like a Date but was,
    in fact, an Any. This specific issue is now fixed, there are bound to be still
    issues like this lurking in the program.


    In addition, there are also commands that will not run on columns where the data
    type is Any. One such command is the Replace Values, which won''t always find
    correct values. If the column is converted to Text, however, the commands functions
    properly.


    As you''ve seen, the risk of having your data defined as Any data type can cause
    issues in both Excel and Power Pivot, these problems can manifest in many ways.
    Remember also that you fixed the two appended queries in this chapter by changing
    the underlying data type. The flip side of this is that it will be easy to break
    things when modifying your query and cause the query to render Any data types.
    The amount of effort compared to the peace of mind, it is highly recommended that
    you create a habit of defining data types for each and every column as the final
    step of a production query, even if the data types have been defined earlier.
    While it might seem tedious, remember that it is a one-time task for a query that
    could rerun every single day of the year.'
