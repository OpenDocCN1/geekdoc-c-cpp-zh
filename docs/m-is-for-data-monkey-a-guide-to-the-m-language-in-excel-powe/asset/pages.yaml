    is written by Excel pros for Excel pros. Every solution in the pages of this book
    is illustrated with Excel.


    # # How to Use This Book


    This book is intended to be your number-one resource for understanding Power Query
    and the M language from a practical point of view as an Excel pro. Our goal is
    to address Excel problems that excel commonly face and show you how to use Power
    Query to solve them. We also cover some more advanced scenarios as well, incorporating
    Power Query and M best practices throughout, to help you understand not only how
    to build Power Query solutions but how to make them last.


    # # The Learning Map


    After working with Power Query for a long time, we''ve come up with a method that
    we believe is the optimal way to teach how to use this incredible tool. It''s
    one we''ve tested and refined in our online http://powerquery.training workshops,
    and it involves carefully layering techniques that depend on each other. The learning
    map is shown below.


    # ## How Power Query SHOULD Be Learned:

    Via a Similar "Simple to Advanced" Path


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_16_0.png)


    # ## Time Spent Working in Power Query->


    An optimal learning path to master Power Query and the M language.


    # # Where to Find the Power Query Commands


    Power Query was initially released after Excel 2013 as a free-in for Excel, and
    it was (rather shockingly) backward compatible with Excel 2010. In both of versions,
    a unique ribbon tab holds all the Power Query commands.


    Because Power Query is so incredibly useful, it only made sense to integrate the
    tool into Excel 2016. Due to concerns about bloating the user interface, though,
    Power Query was not given its own ribbon tab in Excel 2016 but was instead squashed
    down into the Get & Transform group on the Data tab. The image below shows where
    Power Query is accessible in each application.'
