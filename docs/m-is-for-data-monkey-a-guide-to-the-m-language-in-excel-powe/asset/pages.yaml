    Every issue that your user threw at was handled. The totals are, the data is in
    the right order, and the historical values have been updated.


    # Understanding the Unpivot Functions


    There are actually two unpivot functions on the right-click menu in Power Query:
    Unpivot Columns and Unpivot Other Columns.


    # How Unpivot Other Columns Works


    To be fair, we may have made some unnecessary mistakes in the example above. Instead
    of selecting the 1/1/2014 through 7/1/2014 columns, you could have right-clicked
    the Sales Category column and chosen the Unpivot Other Columns command. This command
    would unpivot every column other than the one(s) you selected. From a logical
    point of view, it would have made complete sense when the solution was updated
    that it worked well.


    Having said, the demo was set up this for a reason—to explain what really happens
    when you use the Unpivot command.


    # How Unpivot Columns Actually Works


    Based on the terminology of the user interface, you would have expected that when
    you recorded the step above to unpivot the 1/1/2014 through 7/1/2014 columns,
    Power Query would hard code those specific columns. It should be plainly obvious
    that this is not the case.


    Here’s what Power Query actually did: It looked at all the columns in the data
    set and determined that there was one column did not select. Rather than build
    you a specific "unpivot columns" command, it actually recorded code that says
    "unpivot everything except the column(s) that weren''t selected." In this case,
    it actually recorded that "unpivot everything except Category.\"


    While this change seems subtle, it actually has some fairly large risks, both
    good and bad.

    The good news is that it is very difficult to make a mistake and build a scenario
    that blows up when new daily columns are added. Essentially, it future-proofs
    your solution for new dates, as will always be pulled in.


    The bad news is that there is no way through the user interface to lock in a specific
    "unpivot column only" command. This means that if you have an Unpivot Columns
    command in your query, and you add a new column to the data table, it will be
    unpivoted as well.'
