  md: "# Chapter 17 Power Query Formulas\n\nOne of the great features of Excel's MID()\
    \ function is that you never have to worry about how many characters are remaining\
    \ in the text string. The final parameter you provide is the number of characters\
    \ remaining, it will simply return all characters without triggering an error.\
    \ Not so in Power Query. In order to fix this, you have to make a modification\
    \ to how many characters are returned, as you don't want to provide a number higher\
    \ than the number of characters remaining. In other words, you want to return\
    \ the minimum of four characters, or the number of characters remaining in the\
    \ text string.\n\nYou're going to learn a bit more about regarding functions in\
    \ Chapter 20. Right now, however, just know that you need to use a List function\
    \ to do this, specifically ListMin().\n\nRather than just build this into your\
    \ function, follow these steps to see if you can build this in a separate column:\n\
    \n+   - Go to Column -> Add Custom Column\n- Enter the formula\n  `=List.Min({Text.Length([Word])-(5-1),4})`\n\
    - Click OK\n\nYou can see that a table which you created has only one character:\n\
    \n| Word | MID(5,4) | pqMID(x,5,4) | Custom |\n|---|---|---||}{\n| 1 Football\
    \ | ball | ball | 4 |\n| 2 Doorknob | knob | knob | 4 |\n| 3 Bookkeeper | keep\
    \ | keep | 4 |\n| 4 Automobile | mobi | mobi | 4 |\n| 5 Mountain | tain | tain\
    \ | 4 |\n| 6 Truck | k | Error | 1 |\n| 7 Car | | Error | -1 |\n\nFigure 217 You\
    \ have determined the number of characters remaining.\n\nYou'll get a lot more\
    \ explore lists in Chapter 19, but here's a quick breakdown of the formula:\n\n\
    +   - Text.Length([Word])-(5-1) takes the length of the Word in the Word column\
    \ and subtracts the starting position. You used (5-1) as you wanted the fifth\
    \ character, but you need to correct it for base 0. (You could simplify this to\
    \ 4 if desired).\n- The final 4 represents the maximum number of characters you\
    \ want to return\n- In order to use these in the List.Min() function, they need\
    \ to be surrounded by curly braces and separated by commas.\n\nWith this working,\
    \ you can simply edit your original column to use this formula in place of the\
    \ final 4:\n\n+   - Click the gear icon next to the Added Custom 1 step\n- Copy\
    \ the formula you just wrote\n- Click OK\n- Click the gear icon next to the Added\
    \ Custom step\n- Modify the formula and nest the copied formula in place of the\
    \ final 4:\n  `=Text.Range([Word],5-1,List.Min({Text.Length([Word])-(5-1),4}))`\n\
    - Click OK\n\nWhen you preview the Added Custom step, your MID function equivalent\
    \ should now be working."
