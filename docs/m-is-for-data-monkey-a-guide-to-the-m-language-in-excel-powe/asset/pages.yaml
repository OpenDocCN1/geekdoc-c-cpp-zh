    # # Removing Extraneous Columns


    There are a lot of columns in the Power Query editor now, and you really don''t
    need them for the next steps. You should get rid of the irrelevant ones so you
    can focus on the ones that truly matter:


    +   - Select the Name column -> hold down Ctrl -> select the Content column

    - Right-click one of the columns -> Remove Other Columns


    > Power Query works as a sequential macro recorder, processing each step before
    moving on. This means that you doesn''t require precedent columns to stick around.
    Given that, and you''ve already filtered CSV files, you can rename that column
    as well.


    These steps had two effects. The first is that you removed all the extraneous
    columns in the easiest fashion possible (which is more future-proofing in case
    the Power Query team decides to add another column to this view in a future update).
    Second, because of the order in which you selected the columns, you flipped the
    order in which they are presented in the Power Query editor, as shown:


