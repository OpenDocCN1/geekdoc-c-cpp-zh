  md: '# Chapter 20 Understanding the M Language


    Now that you''ve explored the different objects you can use in Power Query, it
    is time to take a deeper look at the M language that is used to perform Power
    Query''s magic. While mastering M isn''t truly necessary, it can certainly add
    some code to power your arsenal and allow you to work with situations that others
    can''t.


    # M Query Structure


    To started, you''ll pull a table into Power Query and examine the code that is
    working behind the scenes:


    +   * Open Ch20 Examples\Unappearing\M.xlsx -> select any cell in the Sales table

    * Create a new query -> From Table

    * Delete the Changed step


    Your query should look like this:


    | Date | Inventory item | Employ... | Quantity | Price |

    |---|---|---|---|-|

    | 1 | 5/10/2014 12:00:00 | Lovable Kitten | 1 | 45 |

    | 2 | 5/9/2014 12:00:00 | Talkative Parrot | 2 | 32 |

    | 3 | 5/24/2014 12:00:00 | Lovable Kitten | 3 | 45 |

    | 4 | 5/20/2014 12:00:00 | Adorable Kitty Cat | 2 | 35 |

    | 5 | 5/8/2014 12:00:00 | Lovable Kitten | 3 | 39 |

    | 6 | 5/23/2014 12:00:00 | Sleepy Giraffe | 3 | 39 |

    | 7 | 5/13/2014 12:00:00 | Pretty Crocodile | 5 | 35 |


    Figure 255 The initial query is ready to examine.


    # Query Form


    So far, everything you''ve seen been through the user interface. You''ve seen
    Power Query act as a macro recorder, and you have been able to interact with it
    via the Applied Steps box. You''ve also had some limited interaction via the formula
    bar. What you haven''t seen yet is the programming language that resides underneath
    the covers of this incredible tool. It''s time to change that.


    +   * Go to Home -> Advanced Editor, and it contains the code for the entire query
    created to date:


    The Advanced Editor window appears, and it shows


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_182_0.png)


    Figure 256 Power Query''s Advanced Editor.'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'You can see that the feature set at this time is very limited. The Advanced
    Editor is essentially just a text editor with a syntax checker in the bottom-left
    corner. This area will doubt some investment in future, but right now it is essentially
    just a text box.


    > Before you get frustrated trying to resize the editor to make it as small as
    the image above, be aware that you can''t (We shrunk it with photo editing to
    save page space.) The Advanced Editor can be expanded to make it bigger, but it
    can''t collapse more than the default size when you first open it.


    Take a look at the code inside the window shown below:


    ```

    let

    Source = Excel.CurrentWorkbook(){Name="Sales"}[Content]

    inSource

    ```


    There are some key pieces here that are required to build a successful query,
    so we''ll break this down by line.


    The first line of every query must begin with the word let. (This changes for
    functions, which are covered in Chapter 21.) Nothing else goes on this line at.


    The second line begins with the word Source. This is important, as this is the
    step name from the Applied Steps box. In this case, you use this step name to
    work out which line of code relates to the step you want to examine. ExcelWorkbook(k)
    function. It then appended a list of the records (the Excel table) that it imported.
    Power Query invoked the ExcelWorkbook(k) function and it into the records for
    each table.


    The second-to-last line of every query is the word in.


    The last line is a single that refers to the step containing the output you''d
    like to return at the end of the query. This is usually the previous step but
    doesn''t have to be.


    Now you can add another step to this query:


    +   - Close the Editor by clicking Done

    - Right-click the Price column -> Change Type -> Decimal Number

    - Go to Home -> Advanced Editor


    You can see a new step has been added to the window:


    ```

    let

    Source = Excel.CurrentWorkbook(){Name="Sales"}[Content]

    #"Changed Type" = Table.TransformColumnTypes(Source,"Price",type number})

    in#"Changed Type"

    ```


    Figure 257 A new step has been added to the query.


    There are a few things worth noting here. First, a comma has been added to the
    end of the Source line. If you check back to the prior code, you''ll see that
    there was not there.) This is incredibly important: Every line between the let
    and in must have a comma except the last line before the in, which can never have
    a comma at the end. In this case, the Source line ends with a comma, but the #"Changed
    Type" line does not, at the end.


    > To put this in Query terms, you are providing a list of steps between the let
    and in lines. As you know, all items in a list need to be separated from each
    other via comma, but you don''t put a comma at the end.


    # The Meaning of #""syntax"


    The second thing you should notice in the previous screenshot is that the step
    reads Changed Type in the Applied Steps box but comes into the code as #"Changed
    Type".'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Chapter 20 Understanding the M Language


    The challenge here is that the space between Changed and Type causes Power Query
    to treat the two separate terms. To deal with this Changed Type as a single term,
    Power Query prefixes the term with the # character and wraps the term in quotes.
    Sadly, you''ll see this kind of happening frequently in Power Query, as the default
    names given to steps usually have spaces in them. This results in a lot of hash
    marks and quotes in longer code blocks.


    If you wanted to, you could change this to avoid these issues. You can do this
    in two different ways:


    +   - Right-click the step name in the Applied Steps (before entering the Advanced
    Editor) and renaming the step.

    - Replace every instance of "#Changed Type" in the Advanced Editor with a new
    NewType.


    Regardless of which method you choose, your code will end up like this:


    ```

    let

    Source = Excel.Workbook()[Name="Sales"]}[Content],

    NewType = Table.TransformColumnTypes(Source,\{"Price", type number])

    in

    NewType

    ```


    Figure 25 Updating code to remove the "#awkwardness"


    > If you make your modifications manually, remember that your new term must be
    identical in all instances (no changes), and don''t forget to rename the last
    step!


    # Tying the Steps Together


    The next thing to understand is how the individual lines link to each other. Notice
    in the NewType line, there is a reference to Source:


    ```

    let

    Source = Excel.Workbook()[Name="Sales"]}[Content],

    NewType = Table.TransformColumnTypes(Source,\{"Price", type number])

    in

    NewType

    ```


    Figure 25 The Source reference referenced in the NewType line.


    It''s referencing that allows Power Query to chain all the commands together.
    You can basically read the NewType line as:


    +   - Give us output of the Source step

    - Transform the column types of step and set Price to a type of number


    # Using Line Breaks


    Another piece of this equation is interesting as the code shown below is equivalent
    to this block:


    ```

    let

    Source = Excel.Workbook()[Name="Sales"]}[Content],

    NewType = Table.TransformColumnTypes(

    (Source,\{"Price", type number])

    in

    NewType

    ```


    But this violates the rule about having a comma at the end of all lines except
    the line preceding the in state, doesn''t it? Exactly.


    When Power Query runs your code, it looks for keywords, including the comma and
    the in keyword. As it reads a line, it ignores commas that are enclosed within
    parentheses, curly braces, square brackets, or quotes. When it encounters a comma,
    it recognizes that it is the end of the current line and starts the next line
    of code as an independent step. Alternatively, if it finds the in keyword, it
    knows that the query is going to end and looks to see which step to return.'
  merge: -1
  pgno: 184
- img_proc: true
  md: "Why is this important? It means that you can actually place a line in the break\
    \ of the middle. Because Power Query\nhn't found either a comma or the in keyword\
    \ at the end of the initial NewType line, it keeps moving on,\nasthat the line\
    \ is still part of the first. In essence, this means that this code:\n\n```\n\
    NewType = Table.TransformColumnTypes(Source,({\"Price\", type number}))\n```\n\
