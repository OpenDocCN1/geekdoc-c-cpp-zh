  md: '# Chapter 14 Grouping and Summarizing


    In many ways, grouping and summarizing ups the life of an Excel pro. You''ve got
    all kinds of tools for the purpose, using Excel''s ability to subtotal, aggregate,
    and perform other operations using PivotTables. Sometimes, however, when working
    with large data sets you need to group the records at the source analysis.


    Power Query adds another set of tools that you can use to quickly group and summarize
    data. Interestingly, it gives you the ability to quickly remove columns, thinning
    the data down to a manageable level.


    # Applying Grouping


    To demonstrate how grouping works in Power Query, consider the case of a T-shirt
    manufacturer that has provided this table of data:


    | Date | ProductID | ProductName | ChannelName | Amount |

    |---|---|---|---|---|

    | 1 | 3/6/2015 | 1001 Cap Sleeve | Reseller | 164.7 |

    | 2 | 3/6/2015 | 1002 Long Sleeve | Online | 180.4 |

    | 3 | 4/10/2015 | 1003 Short Sleeve | Online | 229.9 |

    | 4 | 5/10/2015 | 1004 Sleeveless | Online | 118.4 |

    | 5 | 6/11/2015 | 1005 3/4 Sleeve | Store | 184.0 |

    | 6 | 7/12/2015 | 1003 Short Sleeve | Online | 230.6 |

    | 7 | 8/13/2015 | 1003 Short Sleeve | Online | 133.9 |


    Figure 167 A list of sales transactions.


    Your goal is to list this and figure out two things:


    +   * Total sales for each day by channel

    * The largest product''s production as a percentage of daily sales


    # Connecting to the Data


    Start by loading your data in Power Query:


    +   * Open Ch14 Examples\Grouping.xlsx

    * Select a cell in the table on the Worksheet -> new query -> From Table

    * Right-click the column -> Change Type -> Date


    You now have your table in a nice state, ready to group and summarize the data:


    | Date | ProductID | ProductName | ChannelName | Amount | PROPERTIES |

    |---|---|---|---|---|---|

    | 3/6/2015 | 1001 Cap Sleeve | Reseller | 164.7 | Name | Sales |

    | 3/6/2015 | 1002 Long Sleeve | Online | 180.4 | | |

    | 3/6/2015 | 1003 Short Sleeve | Online | 229.9 | All Properties |

    | 4/10/2015 | 1004 Sleeveless | Online | 118.4 | | |

    | 5/11/2015 | 1005 3/4 Sleeve | Store | 184.0 | APPLIED STEPS |

    | 6/12/2015 | 1003 Short Sleeve | Online | 230.6 | Source |

    | 7/13/2015 | 1003 Short Sleeve | Online | 133.9 | Changed Type |

    | 8/14/2015 | 1004 Sleeveless | | | 163.55 | |


    Figure 168 The table ready to summarize.


    # Grouping the Data


    To group your data by date and by channel:


    +   * Select the Date column'
