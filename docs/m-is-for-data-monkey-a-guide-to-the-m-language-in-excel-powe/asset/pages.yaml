    +   - Change the query name to FromNamedRange

    - Go to Home → Close & Load


    # Dynamic Named Ranges


    Excel tables automatically expand vertically and horizontally as new data is added.
    This is one of the great features of Excel tables, but the challenge is that they
    carry a bunch of formatting with them. Named ranges don''t carry all that formatting,
    but they lack the automatic expansion ability that is so fantastic with Excel
    tables. As a workaround, you can create a dynamic range that automatically expands
    as the data grows.


    On the Dynamic worksheet of the Ch01-Excel Data.xlsx file you''ll find another
    copy of the original data. Follow these steps to set up a dynamic range that expands
    as new records are added:


    +   - Go to the Formulas tab → Name Manager → New

    - Change the name to DynamicRange

    - Enter the formula in the formula bar:

    =Dynamic!$A$5:$INDEX(Dynamic!$F:$F,MATCH(99~99,Dynamic!$A:$A))

    - Click OK


    The challenge is now that you can refer to this named range in Power Query, because
    it is a dynamic range, you can select it from the Name Box in Excel. If you can''t
    select it, you can attach it to by Power Query which range in the first place?
    The secret is to create a blank range and tell Power Query which range you want
    to connect to. Here is how:


    +   - Create a new query → From Other Sources → Blank Query


    If you don''t see the formula bar in the Query Editor between the ribbon and the
    data area, go to the View tab and click the Formula Bar checkbox.


    +   - In the formula bar, type the following:

    =Excel.CurrentWorkbook()

    - Press Enter


    As shown below, you can see a table that lists all the Excel objects in this workbook
    that you can connect to.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_26_0.png)'
