  md: '# You’ll go bananas as you replace tedious data cleansing with Power Query


    > “Although I had been casually using Power Query for months, I had only been
    scratching the surface until I read this book. The day after reading the first
    half of this book, a person in my Excel seminar presented an Excel data cleansing
    problem that was taking the intern the entire month to solve in 9 minutes; we
    replaced the entire process with Power Query. If you regularly clean data, Power
    Query will change your life, and this book will show you how.”

    - Bill Jelen, MrExcel.com


    # About the Authors


    Ken Puls is a fellow of Chartered Professional Accountants in Canada and a Microsoft
    MVP in Excel. His ExcelGuru Consulting firm is dedicated to training users to
    use Excel and Power BI efficiently.


    Despite the moniker “data monkey,” we information workers are often more like
    magicians. Our data enters our world in a ready-to-consume format; it can take
    hours of cleaning, filtering, and reshaping to get things ready to go. Power Query
    will make this process faster the first time and reduce it to a single click every
    subsequent time. When it comes to importing, cleaning, and transforming data get
    it ready for analysis, you will learn Power Query faster than you can learn Excel
    formulas, and handle complex structures much more easily than VBA. There is no
    doubt in our minds that Power Query will change the way Excel pros work with data
    forever. If you are using Excel 2010, 2013, or 2016 on a Windows PC, Power Query
    is available to you. This book will teach you pro tips for getting the most from
    Power Query.


    Miguel Escobar is an Excel MVP and consultant and expert on business intelligence,
    PowerPivot, Excel, Power View, and SharePoint. He was the translator of Fórmulas
    DAX para PowerPivot. Miguel and Ken co-founded PowerQuery.Training.


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_243_0.png)


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_243_1.png)


