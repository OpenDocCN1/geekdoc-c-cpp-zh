  md: 'Foreword Power Query Changed Our Lives


    # # Foreword Power Query Changed Our Lives


    # Ken’s Story: “Coffee & Power Query”


    It''s the name of the meeting in my Outlook calendar from back November 2013.
    It was one of the Microsoft MVP summits, the product recently had its name changed
    from Data Explorer, and I was meeting Miguel Lioguel and Faisal Mohamad from the
    Power Query team over to talk about the good and the bad of the tool from Excel
    users'' perspective.


    In conversation, I told them that Power Query was great, but its a lousy replacement
    for SQL Services Management Studio. I distinctly remember part of the conversation.
    I''d been working with SSMS and Power Query a lot at the time, and was struggling
    with the fact that Power Query did some of the tasks, but not all. I was frustrated,
    as I was struggling with the tool, trying to make it behave the same as SSMS,
    but it didn''t just.


    What happened after I laid out my concerns flicked my complaints on their head.
    I''m paraphrasing from my memory, the response was something like this:


    > "Ken, this tool isn''t a replacement for SSMS. We built this for Excel people...
    our intent is that they never need to use or SQL at all"


    For anyone who knows me, they know that I''m very self speechless, but that was
    just not enough to do it. That statement upset the balance of my world.


    Understand that I''m not a normal Excel pro. I know enough to be dangerous, I''m
    extremely accomplished with VBA, VB.NET, C#, XML and a few other languages. While
    I teach technology and challenges, the true reason I know how many languages as
    I do today is I taught myself out of necessity. Typically my needs were complicated,
    and involved a painful journey of jumping into the deep end with a “sink or swim”
    approach.


    No Excel should need to work with SSMS in order to get the data that Power Query
    was an Excel focused replacement for that. It occurred once to me, somehow, that
    it was designed to actually make the life of Excel so much easier that they wouldn''t
    even need to reach to SQL at all.


    That meeting changed my view of Power Query I took a step back and looked at it
    in a new light. And I started to use it as it was intended to be... on its own,
    driving everything through the user interface, avoiding SQL wherever possible.
    It started working better, it allowed me to go more places, it allowed me to do
    things never before able to do.


    I love this tool. Not because what I can do with it, but because of how easy it
    makes for me to get things done for a business without the need for coding. I
    love it because the people pick it up rapidly and add real value in an incredibly
    short amount of time. The power is truly centered around the Excel pro, allowing
    us to build complex solutions via one of the best user interface designs ''ve
    in a long time. While we do the coding techniques in this book, the best part
    is that''s optimal, just extending the capabilities far.


    # Miguel''s Story: The Underdog


    I don''t remember the exact moment when I introduced to Power Query. It was early
    2013 when I downloaded it and started playing with it. At first it seemed like
    a new tool that could transform data, but I still felt Power Pivot was to be the
    center of attention in the data story. Then Power Query was called ''Data Explorer''
    – and like today – it focused on delivering a rich interface, allowing you to
    do amazing things without ever needing to look at code. Little did I know that
    this ''neat'' would solve all of my data problems.


    At first, Power Query might seem to you like it seemed to me – just a guided-end
    tool that can do some real data transformations. And then you''ll realize the
    true power and flexibility that the Power Query engine brings to the table. Today,
    I feel that Power Query is as important as Power Pivot, as how you shape your
    data will ultimately determine how your Power Pivot Data Models work.'
