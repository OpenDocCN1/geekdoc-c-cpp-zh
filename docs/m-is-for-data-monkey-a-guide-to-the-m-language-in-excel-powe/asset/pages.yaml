    | 3/11/2015 | 6:00 PM 8.50 | 0.00 | 0.00 | 0.00 |


    Figure 220 A text file with some challenges.


    The data doesn''t seem so bad at glance. And it seems even less of an issue when
    you realize that you don''t really need the top rows, as the dates are included
    on each row of the data table. But then you notice an issue: the employee name
    is not included in rows but buried in the middle of the data. How do you get it
    out of there?


    The challenge in this scenario is to figure out how to get the employee name associated
    with each row of data—and that is not going to be possible without some conditional
    logic.


