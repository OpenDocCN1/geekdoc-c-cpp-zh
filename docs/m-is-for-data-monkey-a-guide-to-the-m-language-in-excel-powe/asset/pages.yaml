  md: '# Chapter 16 Updating Refreshing


    ```

    Sub Refresh()

    ActiveWorkbook.Connections("Power Query") - Refresh

    ActiveWorkbook.Connections("Power Query") - Feb2008").Refresh

    ActiveWorkbook.Connections("Power Query") - Mar2008").Refresh

    ActiveWorkbook.Connections("Power Query") - Transactions").Refresh

    Worksheets("Transactions").PivotTables("PivotTable1").Refresh

    nPivotCache.Refresh

    End Sub

    ```


    The space and underscores are the characters you use to indicate a line name in
    VBA code. The code will run well if the PivotCache.Refresh line remains on the
    same line as Worksheets("Transactions").PivotTables("PivotTable"). Just make sure
    that there is no space between the period of the first line and the PivotCache.Refresh.


    You can see that you may need to remove the unused code comments first. After
    that simply inject new lines in order to refresh the specific connections in the
    order you want them refreshed.

    in addition, by specifying Worksheets("Transactions") in place of ActiveSheet,
    you eliminate the need to select the PivotTable, and also ensure that you are
