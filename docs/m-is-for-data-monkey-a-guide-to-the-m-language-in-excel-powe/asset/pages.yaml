    # # Method Recap


    As you''ve seen in this chapter, the process for unpivoting subcategories involves
    the following eight-step process:


    +   1. Load the data.

    2. Transpose the data.

    3. Fill the major heading into null areas.

    4. Merge the major headings and subheadings into a single column.

    5. Transpose the data back.

    6. Promote the consolidated headings into header rows.

    7. Unpivot the data.

    8. Split the consolidated headings back into their individual components.


    This technique is not limited to only two levels of headings. The secret is to
    combine all the headings and subheadings into one text string that can be promoted
    to headers. As long as you''ve done that, you can promote a dozen subheadings
    if needed.


    # # Replicating the Original Data


    With the data completely unpivoted, the original data table can quickly be rebuilt
    using a PivotTable with the following configuration:


    +   * Class and Account on Rows

    * Month and Measure on Columns

    * Amount on Values


    However, in order to rebuild the PivotTable so''s laid out consistently with the
    original data, you also need to make the following modifications:


    +   * Go to PivotTable Tools -> Design -> Subtotals -> Show All Subtotals at Bottom
    of Group

    * Select the Revenues cell in the first column and drag it above the Expenses
    row

    * Right-click the April column header -> uncheck Subtotal Month

    * Right-click any value cell -> Value Field Settings -> Number Format

    * Choose Accounting -> 2 decimals -> No Symbol

    * Click OK (twice) to return to the worksheet'
