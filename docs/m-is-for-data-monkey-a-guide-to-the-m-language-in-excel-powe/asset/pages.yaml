    by the PivotTable. (Of course, this would be more obvious if the data changed,
    but the data source is static)

    As great as is, sending your users back to the Developer tab to run the macro
    on a regular basis is a little scary. Rather than do that, why not give them a
    button to refresh the macro? Follow these steps:


    +   - Go to Developer -> Insert -> choose the top-left icon

    - Find an empty space on the worksheet

    - Hold down the left mouse button -> drag down and right -> let go of the mouse

    - Assign the Refresh macro -> OK


    The Assign Macro dialog pops up with your macro in it.'
