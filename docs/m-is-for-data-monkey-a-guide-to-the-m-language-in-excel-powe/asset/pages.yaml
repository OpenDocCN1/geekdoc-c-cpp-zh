  md: '# Chapter 25 Query Organization


    With all the work you''ve done learning Power Query, you wouldn''t expect to suddenly
    get hit by an error when trying to merge two tables. Unfortunately, this is a
    possibility if the tables come from different data sources.


    # The Formula.Firewall Error


    One of the things that you haven''t seen so far in this book is the dreaded Formula.Firewall
    error, but it can be quite a shock when it hits you. And while there are strategies
    for avoiding it, it is best if you know what causes this nasty error message to
    appear.


    # Triggering the Formula.Firewall Error


    In the timesheet used through several chapters, recall that you built a fairly
    robust solution. The solution file is saved in a specific location, and the data
    files are stored in the Sources subfolder, which hangs off the solution directory.
    You repurposed this code to import a single table, turning it into a function
    and leveraging it to preprocess all the files in the Sources directory so you
    can combine them afterward. The data lands nicely in an Excel worksheet (or the
    Power Pivot Data Model if you were inclined to push it there). What could go wrong?


    A scope change. That''s what. Suppose your manager tells you that he wants the
    department for each employee merged with the data set.


    You''ve got the employee records stored in another Excel file with each employee''s
    name and department. You know how to import from Excel files, and know how to
    merge data sets together. How hard can it be? Try to see:


    +   - Open Ch25 Examples\Query Organization.xlsx

    - Create a new query -> From -> From Excel Workbook

    - Navigate to Ch25 Examples\Departments.xlsx

    - Select the EmployeeDepts table


