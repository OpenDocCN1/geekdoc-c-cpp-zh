  md: '# Workbook Queries


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_23_0.png)


    Figure 15 The Workbook Queries task pane, showing the results of the query.


    > If you''re working along with the book and your query shows a significant number
    of errors, don''t panic. This means that your regional settings are not set to
    a U.S. format. Right now we are focused on how to use the Power Query interface
    to import data, but rest assured that we will show you how to address this specific
    issue (among others) in Chapter 2.


    With the data in the table, you now have the ability to refresh any time via a
    few methods:


    +   - Right-click the table in the Excel worksheet -> Refresh

    - Right-click the query in the Workbook Queries pane -> Refresh

    - Go to the Data tab -> Refresh All


    Each time one of these commands is issued, Excel triggers Power Query to open
    the file, process each of the steps you recorded, and place the data in the table.
    As long as the new transactions file is on top of the one you used to build your
    solution, and as long as the data structure is the same, you''ve automated your
    import process down to a couple of clicks!


    > If you miss the Workbook Queries pane, you can show it again via Data tab ->
    Show Queries in Excel 2016 or Power Query tab -> Show Pane in Excel 2010/2013.


    > In order to preserve the table and other features of Power Query, this file
    must be saved in a valid Excel file format, such as XLSX, XLSB, or XLSM.


    # Importing Excel Data


    You can import three general formats of Excel data from a workbook. You can import
    data held in:


    +   - Excel tables

    - Named ranges

    - Dynamic named ranges


    > Chapter 5 covers importing data from worksheets without tables and data contained
    in other workflows.


    # Connecting to Excel Tables


    Rather than connect to an official Excel table, in this case you will connect
    to data that is in a tabular format but no table style yet applied. The data to
    use for this is located in the Ch01 Examples\Excel Data.xlsx file on the Table
    worksheet, and it looks like this:'
