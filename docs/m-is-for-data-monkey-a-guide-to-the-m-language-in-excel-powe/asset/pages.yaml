    The final step for this data source is to load it to Excel and build a PivotChart
    from it:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_124_0.png)


    Figure 166 A profit-tracking chart built from previously useless email.


    Consider the impact here where you''ve been collecting these emails for the better
    part of two years and never reading them. Suddenly they have business value. These
    emails can be used as part of an dashboard to review the profitability of one
    of the income streams that supports your website.


    # Best Practices for Exchange Sources


    There are two main issues to consider when building a solution against a Microsoft
    Exchange service: portability and performance.


    # Portability


    The first thing you need to take into account is how this solution is intended
    to survive and whether we will need to pass it on to another user. Why? Because
    you are targeting your email account. Building a solution against your email account
    locks it down so you can only use it. It can''t be shared, and it''s difficult
    to port to other layers, as the source files for the solution (emails, attachments)
    are in your inbox.


    The reality is if you leave the organization, voluntarily or otherwise, the solution
    will most likely become useless to others. And if you stay and get promoted, you''ll
    be stuck updating the solution that is bound to your email account.


    If you intend to use the solution for a longer period, or if it serves other users,
    it might be best to try out to extract the data from your inbox first and build
    the solution against that source. For email attachments, that is fairly easy:
    Just save them to a folder. For the email itself, may not be practical, and maybe
    Power is the method to extract the emails and archive them in another format.
    Regardless, you should definitely give some thought to a succession plan for your
    solution once it starts to get reused.


    # Performance


    The other major consideration you should take into account is performance, including
    speed.'
