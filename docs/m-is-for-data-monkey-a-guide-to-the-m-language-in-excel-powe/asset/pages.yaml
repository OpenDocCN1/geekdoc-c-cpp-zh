    The impact of this is fairly important. Power Query imported your data, analyzed
    it, and noticed some trends. What you don''t see is Power Query imported your
    data as column (based on the fact that CSV files have their columns separated
    by commas), so it (correctly) split it into columns. That data landed in the Source
    step.


    Power Query then analyzed your data and found that the first row had headers that
    were inconsistent with the values in the columns. It therefore added the step
    Promoted Headers to promote the first row to be column headers for your title.


    Next, Power Query attempted to identify and set the data types in the columns.
    The assumption that the TranDate column is dates, the Account and Dept columns
    are numbers, and the Sum of Amount column is values. It then applied those data
    types in the Change step what you see in the Applied Steps.


    The great thing is that you can make modifications to clean the data . . . like
    fixing the terms in the column headers to be more readable. To do this, follow
    these steps:


    +   - Select Changed Type in the Applied Steps box

    - Right-click the header of the TranDate column -> Rename -> Date

    - Right-click Sum of Amount -> Rename -> Amount


    The Power Query editor now looks like this:


