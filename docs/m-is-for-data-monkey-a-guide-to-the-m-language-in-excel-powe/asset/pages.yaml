    # The Benefits and Dangers of Black Magic


    The true wizards of Excel use many different techniques to make their happen—sometimes
    on their own and in combination. These types of magic include:


    +   - Excel formulas—These are the first techniques that the magician will often
    reach to, leveraging their knowledge of formulas using functions as VLOOKUP(),
    INDEX(), MATCH(), OFFSET(), LEFT(), LEN(), TRIM(), CLEAN()), and While formulas
    are used by most Excel users, the complexity of these formulas varies by the user''s
    experience and comfort.

    - Visual Basic for Applications (VBA)—This powerful language can help you create
    powerful and dynamic transformations for your data. VBA techniques need to be
    used by advanced users to the discipline required to truly master them.

    - SQL statements—SQL is another powerful language for manipulating data, and it
    can be extremely useful for selecting, sorting, and grouping. The reality is that
    this language is typically used by advanced users, and even Pros don''t know where
    to get started with it. This language is often thought of being the sole domain
    of database professionals, although every Pro should spend some time in learning
    it.


    All these tools have something in common: For many years, they were essentially
    the tools available for cleaning and transforming data into something. Despite
    their usefulness, many of these tools also have two serious weaknesses: They require
    time to build and to master the techniques.


    While it''s true that savvy magicians use these tools to build solutions to automate
    and import raw data in a clean format, this takes years of learning advanced languages
    as well as a significant amount of time spending, developing, testing, and maintaining
    the solutions. Depending on the complexity of the solutions building, solutions
    for a minor change in the input format or extending them to embrace another could
    be horrendous.


    One hidden danger of having a true wizard in a company is that the person can
    build an incredible solution that works until long he or she leaves the company.
    At some point, others at the company realize that they don''t understand the solution
    and now have to fix it when it eventually becomes


    On the flip side, many people with this data cleanup didn''t have time or opportunity
    to learn these advanced techniques. And while we could say that they''re better
    off not having a massive system collapse without to fix it, they waste hours,
    days, weeks, months, and years of time and performing repetitive data cleanup
    on a regular basis.


    Take a moment and think about how many hours are consumed on a monthly basis in
    your company performing repetitive data import and cleanup tasks in Excel. Multiply
    these hours by the average wage rate in your company ... by the number of companies
    in your industry worldwide and ... you get the idea. The cost of productivity
    in this area is staggering.'
  merge: -1
