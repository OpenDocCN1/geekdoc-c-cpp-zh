    # Creating Staging/Loading Queries


    The secret to avoiding the Formula.Firewall is to separate the job of connecting
    to the database and loading to the end destination. We call staging queries and
    loading queries.'
  merge: -1
  pgno: 232
- img_proc: true
  md: '# M is for (Data) Monkey


    You use staging queries to ensure that you create separate queries as possible
    to extract the initial data from each data source. You then do many transformations
    in the staging query in order to get the data into a shape where it can be used
    by many other queries. What you do not, however, is try to merge onto another
    data source or load the result into a worksheet of the Data Model. Both of tasks
    are reserved for a loading query.


    A loading query is designed to pull data from one or more staging queries and
    merge or append as required before making any final transformations that are needed.
    You then set these queries to load the output to the final destination, whether
    it''s the worksheet or the Data Model.


    Visually, the process looks as follows:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_233_0.png)


    Figure 322 Organizing staging and loading queries.


    Technically, combining any two different data sources can cause a Formula.Firewall
    to appear; even trying to inject a parameter from an Excel parameter table can
    trigger the error. If you get a Formula.Firewall error when trying to nest a dynamic
    parameter in the middle of a query, try to declare your variable front avoid the
    next function in your code. This resolves that issue.


    # Caveats


    When working with staging and loading queries, you need to be careful in certain
    cases, especially when the data source you connect to can take advantage of query
    folding to improve performance. The reason for this is that query folding can
    be executed only from the primary connection to the data source (the staging query).


    When using a staging/loading approach against a database that supports query folding,
    you should always try to accomplish as many filtering and joining and grouping
    operations as you can in the staging query. This will allow Power Query to pass
    the processing job back to the database. As you move out of your query into a
    secondary staging query or the loading query, no more commands can be passed back
    to the database to be folded, which means Power Query has the processing work.
    It may also sense to make several connections to the database to pull individual
    data sets, allowing the database to do the heavy lifting for you since these databases
    are optimized for the sorting, filtering, and grouping operations.


    By contrast, if you are targeting your solution sources that don''t support query
    folding (such as text or Excel files), it''s a good idea to create one staging
    query to pull in the data and cut it down as much as possible. You can then reshape
    the data as needed in order to get it into your model. Whereas secondary staging/loading
    queries. Since there is no ability to take advantage of a more efficient engine
    query, you want to bring the data in once and try to make sure each step works
    with as few records as possible to improving time.


    You should also be conscious of trying to set up many levels of staging queries
    between your data source and your loading queries. Whereas using one staging query
    feeding one loading query can be easy to follow, things get much more complicated
    when you use data feeding through five or more intermediate queries on the way
    to the end. It''s a longer trail to process, which could have impacts, and most
    certainly there will be a longer trail to audit should go wrong. Keeping the query
    flow tighter will help you when you''re trying to debug and maintain your queries.'
  merge: -1
  pgno: 233
- img_proc: true
  md: '# Chapter 25 Query Organization


    You should also be aware that Power BI doesn''t generally appreciate long trails
    of queries using the staging and loading query approach. If you are intending
    to push your solution to Power BI, it is a good idea to try to keep the approach
    to a single query if possible and limit the number of steps if not.


    # Keeping Queries Organized


    As you build more and more Power queries, you''ll find that things start to get
    a bit disorganized in the Workbook panes. As it happens, there are a couple ways
    to keep a handle on this issue.


    # Changing Query Display Order


    As you start queries, Power Query will add them to the bottom of the list, in
    sequential order. You can, however, change the order in which these queries are
    presented in the Workbook panes (and Power Navigator inside the Power Query editor).
    To change where a query shows in relation to the others, these follows:


    +   * Right-click your query

    * Choose Move Up (or Move Down)


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_234_0.png)


    # Grouping Queries


    Ordering is great, but it doesn''t help you categorize queries very easily. Especially
    when using the staging and loading approach, it is very helpful to create groups
    in which to store each query. Here''s how:


    +   * Right-click the fnGetTimesheet query → Move to Group → New Group...

    * Call the new group Functions


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_234_1.png)'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'You can now move the fnParameter into the Functions group as:


    +   - Right-click fnGetParameter -> Move to Group -> Functions


    It''s just a simple matter of creating new groups for the staging and loading
    queries as:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_235_0.png)


    Figure 326 All queries, nicely organized.


    This approach works very nicely for keeping things organized, and it also gives
    you the ability to quickly scan the queries to see if they are set up. If you
    see the text "x rows loaded" under a staging query, you know it''s not actually
    taking a specific staging role, and you can either fix it or move it to the Load
    group.


    In addition to being able to perform the reordering and grouping in the Excel
    interface, these features are also supported in the Power Query editor, via the
    Navigator pane:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_235_1.png)


    Figure 327 Organizing Power Query queries in the Navigator pane.'
