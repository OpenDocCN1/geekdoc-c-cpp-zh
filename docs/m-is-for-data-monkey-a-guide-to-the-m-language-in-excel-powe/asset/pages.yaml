  md: '# Chapter 13 Loading Data from Exchange


    In the past, trying to get data out of Microsoft Exchange was an absolute nightmare.
    It involved VBA scripts, significant development, and painful maintenance. The
    unfortunate part was that there was a significant amount of information buried
    in your email and calendar that can add great business value to you, but with
    it being so difficult to get, it was a nonstarter. Power Query has changed, allowing
    an easy way to connect to your Exchange database and starting out pull drivers
    that can impact your business intelligence solutions.


    # Accessible Data


    There are five main aspects that you can connect to in your Exchange database:


    +   * Mail

    * Calendar appointments

    * People

    * Tasks

    * Meeting requests


    Each of these can be pulled to Power Query, cleaned and turned into a table, and
    then served up to a table or the Power Pivot Data Model.


    # Potential Use Cases


    The most difficult question to wrap your head around related to Exchange as a
    data source is not how to connect to it rather why you would want to. The main
    reason for this is that you''ve never had the ability, so you haven''t thought
    about it. Considering the following scenarios and how to connect to your Exchange
    server could be used in your organization.


    # Aggregating Survey Data


    With Power Query to read email, you could create a simple survey with a table
    in the body and send it out to your audience. You can then use Power Query to
    read all replies, extract the information from the individual tables, and combine
    the tables into a data source. Better yet, you don''t have to worry if someone
    sends in a copy late, you just refresh the data source to pull it in.


    # Aggregating Budget Requests


    It''s a common practice for accountants to send Excel books to key personnel and
    ask them to pull in budget and report via email. What if you then use Power Query
    to scan for all emails with a certain subject and/or attachment and then open
    and combine each attachment and extract the data? This is entirely possible with
    Power Query.


    # Building an IT Alert Dashboard


    In IT, we get numerous alerts from various servers and pieces of equipment. Some
    are informational and critical, but depending on the volume of equipment you have
    and the frequency of alerts, they can quickly turn into information overload.
    Oftentimes these emails are automatically routed to a folder and ignored. But
    think about this: You can now use Power Query to aggregate the alerts, chart the
    value and severity, and build an systems alert dashboard from previously useless
    email.


    # Endless Possibilities


    Fetching and matching contact details to appointments and emails, the real question
    today is not if you can use this feature but how. You might need a dashboard of
    interaction you''ve had with a client, or you need to track who has replied to
    a critical email you sent out. There is a ton of valuable information sitting
    in your inbox that you now have access to in a way you never before.


    # Building an Email Dashboard


    For this example, you''ll take the role of a website owner to see how previously
    useless email can be turned into something interesting. While won''t be able to
    replicate the steps in this chapter yourself (they are'
  merge: -1
  pgno: 120
