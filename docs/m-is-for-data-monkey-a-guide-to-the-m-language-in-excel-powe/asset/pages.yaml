  md: "safeguard poor interpretations by Excel or Power Pivot, it's a good idea to\
    \ set those data types\n. Set them as follows:\n\n+   * Text: Employee\n* Decimal\
    \ Number: Expenses, Misc Hrs, OT Hrs, Reg Hrs\n* Time: Out\n* Date: Work Date\n\
    \nWith that, you finally find the query:\n* Home -> Close & Load To...\n* Select\
    \ Existing Worksheet -> Timesheet -> A1\n\n# Solution Impact\n\nThe ramifications\
    \ of the process described here are rather extensive. Even if you build a single-use\
    \ scenario,\ny can now convert it to be consistently applied across multiple files.\
    \ That is a huge benefit that previ-\nously unavailable to Excel pros, at least\
    \ in easy-to-deploy fashion.\n\nYou can deal with situations where your datap\
    \ footprint expands across multiple files and where transformations\n be too complex\
    \ if the files were combined into one before being processed. Building a single-use\n\
    case, you can perform the transformation on a smaller scale and then append the\
    \ results.\n\n# Debugging Custom Functions\n\nOne of the painful pieces of working\
    \ with custom functions is that you lose the ability to step through them\n. That\
    \ makes debugging functions a bit of a challenge.\n\nWhile it's not ideal, there\
    \ is a way to convert a function back into a query so that you can test it. The\
    \ unfort-\nate of this process is that it is a temporary state before converting\
    \ the function into a debuggable state\nconverts it out of function mode, breaking\
    \ any subsequent queries during the debugging process. However,\nit is the only\
    \ way to achieve the goal, so you'll learn out it next.\n\n# Restoring Query Steps\
    \ to the Applied Steps Box\n\nIn order to restore the Applied Steps box so that\
    \ you can debug a function, you actually need to turn it back\nto a query. To\
    \ do this you need to do two things:\n\n+   1. Comment out the line that turns\
    \ the query into a function\n2. Duplicate the variable used in the initial line\
    \ and assign it a value\n\nFailure to do either of these steps will cause you\
    \ to end up with a query or function that returns the wrong\nresults at best or\
    \ errors at worst.\n\nTo comment out a line in M, you insert the characters //\
    \ at the beginning of the line. This tells the Power\nquery engine that the remaining\
    \ characters on the line should not be executed.\n\nTo duplicate the variable,\
    \ you need to set up a new step after the initial let line to create and assign\
    \ a value\nto the variable. The line must be built using the following syntax:\n\
    \n```\nVariable_name = assign_value_here\n```\n\nThe variable name must be the\
    \ variable that is currently enclosed in the opening parentheses for the function,\n\
    and the line must end with a comma. Take a look:\n\n+   * Edit the fnGetTimesheet\
    \ query -> Home -> Advanced Editor\n\nWait... something is different than the\
    \ last time you looked at this code:"
