  md: '# # Chapter 18 Conditional Logic in Power Query


    As you build more solutions using Power Query, you''re bound to come across a
    scenario where you need to perform some kind of logic in a column. While Power
    Query has a method to do this, it''s not consistent with the way an Excel Pro
    would approach this it.


    # ## Scenarios in Power Query


    This example looks at the issues that appear when you import the following timesheet
    from a text file:


    | Date | Work Date | | | |

    |---|---|---|---|---||

    | From | 3/1/2015 | | | |

    | To: | 3/14/2015 | | | |

    | Work Date Out Reg Hrs OT Hrs Misc Hrs Expenses |

    | Contingent Worker: John Thompson | | | | |

    | 3/3/2015 | 6:00 PM 8.50 | 0.00 | 0.00 | 0.00 |

    | 3/4/2015 | 6:00 PM 8.00 | 0.00 | 0.00 | 0.00 |

