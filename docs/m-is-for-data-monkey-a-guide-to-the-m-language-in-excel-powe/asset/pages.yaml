  md: '# Chapter 17 Power Query Formulas


    Power Query''s user interface is amazing, and many of the things you need to do
    are already built in. Having said, there are sure to be times when you need to
    do things that aren''t built in the user interface. Even without easy-to-click
    buttons, there are ways to get jobs done. You just have to reach in to Power Query''s
    programming language: M.


    # Getting Started with M


    While aspects of M can get quite technical, the easiest way to get some exposure
    to the language is to start with custom columns and add them to them.


    Because Power Query was built for Excel pros, you might expect that its formula
    language would be just like Excel''s—much like Pivot''s DAX formulas are identical
    in name to those from Excel. Unfortunately, this is not the case, as you''ll see,
    and you''ll have to temper your initial instincts to use those formulas as you
    learn a new syntax.


    # Creating Custom Columns


    It is relatively straightforward to create a custom column. While inside your
    query:


    +   - Go to Add Column → Add Custom Column


    You see this dialog, which allows you to create a new formula:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_148_0.png)


    Three portions to this dialog that are important:


    +   - New Column Name—Whatever you type here will be used as the name of the column
    you are creating when you click OK.

    - Available Columns—This box lists the names of all the columns in your query.
    Double-clicking any item in this box places it into the formula area with the
    syntax to refer to the field.

    - Custom Column Formula—This is where you actually create the formula that will
    be used.'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'You can easily do simple aggregations in the formula area, using syntax that
    you''re used in Excel. For example, to join the two columns listed above as text,
    you would build a formula in the following manner:


    +   - Double-click Column1 in the Available Columns list

    - Type the & character

    - Double-click Column #2 in the Available Columns list


    From this, Power Query would build the following formula:


    ```

    = [Column1] & [#Column #2]

    ```


    The great thing about using the double-click interface is that, at this point,
    it doesn''t matter to you that the syntax of Column1 and Column #2 must be handled
    differently. The interface will get it right, and you can get on completing the
    job.


    > This specific syntax is explained in Chapters 19 and 20.


    As you might expect, you can perform regular mathematical equations as well, including
    the following:


    | Operation | Power Query Equivalent |

    |---|---|n| Addition | =[Column1]+[#Column #2] |

    | Subtraction |=[Column1]-[#Column #2] |

    | Multiplication |=[Column1]*[#Column #2] |

    | Division |=[Column1]/[#Column #2] |


    Interestingly, however, the exponent operator ^ that you are used in Excel will
    not work. Exponentiation requires a custom formula:


    ```

    =Number.Power([Column1], [#Column #2])

    ```


    # Discovering New Formulas


    Currently, Power Query doesn''t have any IntelliSense, so it can be difficult
    to determine which formulas exist. While this is something that we hope will change
    in future, it leaves us hunting when we need to work out which formulas exist.


    For this reason, in the Add Custom Column dialog, there is a hyperlink just underneath
    the Custom Formula box.'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Chapter 17 Power Query Formulas


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_150_0.png)


    Figure 201 How to find more Power Query formulas.


    Click this link to go to a web page that helps you learn about Power Query formulas.
    If you scroll down that page, you''ll find a link to Power Query Formula Categories,
    which then links you through the MSD documentation site. This site lists all formula
    categories and allows you to browse and find the ones you need.


    > We recommend bookmarking the landing page for the MSDN site. This will prevent
    you from having to open the Add Custom Column dialog in order to access this documentation.


    # Formula Gotchas


    Power Query and Excel have significant differences in terms of how they handle
    inputs. The following table summarizes some of the issues that will constantly
    frustrate you in the beginning:


    | Excel | Power Query |

    | Formulas are not case sensitive | Formulas are case sensitive |

    | Counts using base 1 | Counts using base 0 |

    | Data type conversions are implicit | Observes strict data typing |


    # Case Sensitivity


    The case sensitivity is a headache but there is here to use. The trick: in 99%
    of cases, the first letter of each word in a Power Query formula is capitalized,
    and the rest are lowercase. Excel does not care which case you use and converts
    formulas to uppercase by default, Power Query returns no error.


    # Base 0 versus Base 1


    The difference between base 0 and base 1 is where the line number starts. Considering
    the following word: Excel. If you were to ask yourself the position of the x,
    you would probably say. Character E is 1, and x is 2. Does that sound correct?


    Counting in this fashion follows a base 1 rule, where first character has an index
    position of 1, the second character 2, and so on. It''s the way you count, and
    it''s the way Excel counts.'
  merge: -1
  pgno: 150
- img_proc: true
  md: 'If you asked Power Query the same question, it would return an answer of 1.
    That''s a bit of a head-scratcher at first, especially since Excel counts in a
    base 1 fashion. You''d kind of expect Power Query to follow the same rules, but
    it doesn''t. Power Query starts at 0, not in the world of Excel, the E is character
    0, and X is character 1.


    Ultimately, this doesn''t generate issues that can''t be dealt with, but it does
    mean when you''re building formulas in Power Query, you can end up by one position
    very easily.


    # Data Type Conversions


    Excel formulas very forgiving with data types, using implicit conversion, unlike
    Power Query explicit conversion. To understand what that means, consider the following
    scenarios.


    In Excel you can add a value to increase it to the next day. Because all dates
    are really just numbers, adding 1 to the date will work perfectly.


    In Power Query, if the date is formatted as a date type, you must use a specific
    formula to add days to it. And if you try to use the same formula to add days
    to a number, Power Query will give you an error as it''s not a date. This means
    you must explicitly convert your fields to the data type before using them in
    formulas.


    In Excel you can join two cells using the & function. Whether the cell contains
    text or values is completely irrelevant. Excel implicitly convert them to text
    and then join them


    ```

    =[Column2] &[Column1]

    ```


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_151_0.png)


    Observe what happens when you pull this into Power Query and create a new column
    using the following formula:


    ```

    =[Column1] & [Column2]

    ```


    As you can see, you get a completely different result:


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_151_1.png)


    In order to fix this, you have to tell Power Query explicitly to convert the number
    to text before it tries to join the two strings together. Do by wrapping Column1''s
    input in a conversion function:


    ```

    =Text.From([Column1]) & [Column2]

    ```


    When you explicitly convert the data in Column1 to a text value, the concatenation
    will work as you originally intended:'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Chapter 17 Power Query Formulas


    ![](img/6bec3199cfc2aa8c8d6d98b30c6382a0_152_0.png)


    There are actually two ways to deal with data types in Power Query:


    +   - Set the data type for the column you are referring to before using a custom
    function.

    - Use a data type conversion function to force the input to convert to the required
    data type.


    # Useful Data Type Conversion Functions


    There are several data type conversion functions in Power Query. Some of the most
    important of them are described in the following sections.


    # Converting to Text


    For the most part, if you need to convert the values in a column to text, you
    just use the Text.From() function. There are some additional functions, however,
    you can use to convert your data typing even more explicit. The following table
    shows how to convert different data types into a Text data type:


    | To Convert | Formula | Example |

    |---|---|--|

    | Anything | Text.From() | Text.From([Column1]) |

    | A date | Date.ToText() | Date.ToText([Column1]) |

    | A time | Time.ToText() | Time.ToText([Column1]) |

    | A number | Number.ToText() | Number.ToText([Column1]) |


    Keep in mind that Text.From() will do the job of all the others, whereas Time.ToText()
    will not convert a number to a text value.


    # Dates


    There are two types of dates that you need to be concerned with: those that are
    based on numbers, and those that come as textual dates. Different conversion functions
    are provided for each data type in order to turn them into a Date data type:


    | To Convert | Formula | Example |

    |---|---|--|

    | Numeric dates | Date.From() | Date.From([Column1])

    Date.From(42986) |

    | Text dates | Date.ToText() | Date.ToText([Column1])

    Date.ToText("Jan 31, 2015") |


    Again, Date.From() actually performs the function of Date.ToText, although the
    reverse case is not true.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Times


    Like dates, time values can arrive as either numeric time values or textual ones.
    Again, there are two functions for these:


    | To Convert | Formula | Example |

    |---|---|---|n| Numeric times | Time.From() | Time.From([Column1])<br>Time.From(0.586)
    |

    | Text times | Time.FromText() | Time.FromText([Column1])<br>Time.FromText("02:03
    PM") |


    Again, just as with dates, Time.From()performs the function of Time.FromText(),
    but, the reverse case is not true.


    # Durations


    A difference is the difference between two date/time values, and it allows you
    to work out the days, minutes, and seconds to complete a task. Two functions exist,
    where the .From() variant can perform the job of the other:


    | To Convert | Formula | Example |

    |---|---|---|n| Numeric durations | Duration.From() | Duration.From([Column1])<br>Duration.From(2.525)
    |

    | Text durations | Duration.FromText() | Duration.FromText([Column1])<br>Duration.FromText("15:35")
    |


    # Values


    There are actually large variety of numeric conversion functions. Again, Number.From()
    will perform the job of all of them, there are others included as well, if case
    want to force your numbers to a specific numeric type:


    | Convert Value To | Formula | Example |

    |---|---|---|n| Decimal number | Number.From() | Decimal.From([Column1])<br>Number.From(2.525)
    |

    | Decimal number (from text) | Number.FromText() | Number.FromText([Column1])<br>Number.FromText("15.35")
    |

    | Decimal number | Decimal.From() | Number.From([Column1])<br>Number.From(15)
    |

