  md: '# Chapter 22 Advanced Conditional Logic


    In Chapter 18, you learned how to replicate the functionality of Excel''s IF()
    and IFERROR() functions. Of course, the IF() and IFERROR() are not the only functions
    in Excel that you need to implement conditional or matches.


    Unlike the examples framed previously, replicating other formulas in Excel''s
    conditional logic involves a bit more complicated techniques, including using
    lists and custom functions.


    # Multicolumn Logic


    Occasionally, you are trying to filter down raw data, which may need to filter
    based on multiple criteria. Consider the following data, which is included in
    the Ch22 Examples/Multi-Column Logic.xlsx file:


    | Date | Inventory Item | Sold By | Cost | Price | Commission |

    |---|---|---|---|---|--|

    | 5/10/204 Sat | Lovable Kitten | Fred | 12.00 | 45.00 | 1.35 |

    | 5/9/2024 Fri | Talkative Parrot | John | 17.00 | 32.00 | 0.96 |

    | 5/24/2024 Sat | Lovable Kitten | Jane | 12.00 | 45.00 | 1.35 |

    | 5/20/2024 Tue | Adorable Kitty Cat | John | 25.00 | 35.00 | 1.05 |

    | 5/8/2024 Thu | Lovable Kitten | Jane | 12.00 | 45.00 | 1.35 |

    | 5/23/2024 Fri | Sleepy Gerbil | Jane | 25.00 | 39.00 | 1.17 |

    | 5/11/2024 Sun | Crunchy Crocodile | John | 10.00 | 35.00 | 1.05 |

    | 5/19/2024 Mon | Adorable Kitty Cat | Mary | 25.00 | 35.00 | 1.05 |

    | 5/15/2024 Sat | Sleepy Gerbil | Jane | 25.00 | 25.00 | 1.25 |


    Figure 288 A raw data set.


    # Replicating Excel''s OR() Function


    What if you want to list only data where you sold a Talkative Parrot or the item
    that was sold by Fred? In this scenario, it would be easy: just filter the Inventory
    Item column to Talkative Parrot and then filter the Sold By column. But that won''t
    work in the case you''ve used Talkative Parrots sold by John or Jane, and you''d
    also lose other items sold by Fred.


    If the data is in a table, you could solve this using Advanced Filter or by adding
    a column using the following formula and filtering to only show results that are
    listed as:


    ```

    =OR([@Inventory Item]="Talkative Parrot", [@Sold By]="Fred")

    ```


    But if the data doesn''t originate in an Excel table? what if it''s sourced from
    a database, a web page, or a text file? Plainly, that won''t work.


    +   * Select any cell in the May worksheet

    * Create a new query -> From Table

    * Right-click the Date column -> Change Type -> Date


    Since you can''t filter your data without losing records, you''re going to need
    to add a custom column and apply a formula to examine each:


    +   * Go to Add Column -> Add Custom Column

    * Name the Column


    You know that you''re going to test whether a certain criterion is true or false,
    using a basic formula framework along the lines of the:


    ```

    = if logic test then "Meets Criteria!" else "No Match"

    ```


    The challenge here is coming up with that logic test. Power Query doesn''t have
    an OR() function, so what is the equivalent?


    When you''re looking for comparisons, it is helpful to quickly scan the list of
    functions contained in the Power Query formula categories.'
  merge: -1
  pgno: 206
- img_proc: true
  md: "Remember that you can access the list of Power Query formulas by clicking the\
    \ Learn About Power Query formulas by clicking the Custom dialog and then clicking\
    \ the Power Query formula link part down the page. You end up at https://msdn.microsoft.com/library/mt296612.aspx\
    \ web page.\n\nWithin the list, you will find there is a List.AnyTrue function,\
    \ which seems somewhat promising. Selecting item in the context reveals the following\
    \ example:\n\n```\nList.AnyTrue([==0, false, 1 < 0 ]) equals false\n```\n\nBased\
    \ on this, you will find that the function contains a list of values, as indicated\
    \ by the curly braces in the parentheses. it also shows that the function will\
    \ return false if none of the items are true.\n\nTry to nest this formula in the\
    \ logic of test:\n\n```\n=if List.AnyTrue(\n  [Inventory Item]=\"Talkative Parrot\"\
    ,[Sold By]=\"Fred\"\n)\n  then Meets Criteria!\"\n  else \"No Match\"\n```\n\n\
    Remember that you need to separate the criteria with commas and then surround\
    \ the entire list of criteria with curly braces because the List.Any() function\
    \ requires a list as a parameter.\n\nUpon clicking, OK you can see that the formula\
    \ returns your message in any case where the sales items equals Talkative Parrot\
    \ or the Sold By holds Fred:\n\n| Inventory Item | Sold By | Cost | Price | Commiss...\
    \ | Match? |\n| --- | --- | --- | --- | --- | --- |\n| Lovable Kitten | Fred |\
    \ | | | Meets Criteria! |\n| Talkative Parrot | John | | | | Meets Criteria! |\n\
    | Lovable Kitten | Jane | 12 | 45 | | 1.35 No Match |\n| Adorable Kitty Cat |\
    \ John | 25 | 35 | | 1.05 No Match |\n| Lovable Kitten | Jane | 12 | 45 | | 1.35\
    \ No Match |\n| Sleepy Gerbil | Jane | 25 | 39 | | 1.17 No Match |\n| Cranky Crocodile\
    \ | John | 10 | 35 | | 1.05 No Match |\n| Adorable Kitty Cat | Mary | 25 | 35\
    \ | | 1.05 No Match |\n| Sleepy Gerbil | Jane | 25 | 39 | | 1.17 No Match |\n\
    | Slithering Snake | Fred | | | | Meets Criteria! |\n| Sleepy Gerbil | Mary |\
    \ 25 | 39 | | 1.17 No Match |\n\nFigure 289 Replicating Excel's OR() function\
    \ using List.AnyTrue().\n\nSince the function returns true if any of the criteria\
    \ are true, any instances where Fred sold a Talkative Parrot would also display\
    \ the result Meets Criteria! in the Match? column.\n\nYou can now finalize this\
    \ query by taking the following steps:\n\n+   - Filter the Match? to only include\
    \ Meets Criteria! values\n- Change the query name to pqOR\n- Go to Home -> Close\
    \ and Load\n\nPower Query returns a table containing of 88 rows out of the original\
    \ 332.\n\n# Replicating Excel's AND() Function\n\nWhile it's true that you can\
    \ reduce records by filtering a table column-by-column, what if you only want\
    \ to replicate records where a condition exists in multiple columns? For this\
    \ you need to replicate Excel's AND() function."
