  md: '# Chapter 21 Creating Custom Functions


    If you weigh back to Chapters 3 and 4, you might remember a couple of issues with
    the way that Excel pros has historically imported and appended data sets. This
    was the classic method to consolidate these files:


    +   1. Import and transform file #1.

    2. Import and transform file #2.

    3. Copy file #2''s data and paste it at the end of file #1.

    4. Save file #1 as a consolidated file.


    And then, as each month came along, a similar import, clean, copy and paste workflow
    would follow. This, of course, led to several disasters in both the transformation
    steps and the copy and paste. The more complicated the transformations, the longer
    the process ran and the more job you turned over new hands, the more likely something
    would go wrong. Steps would be missed or performed incorrectly, resulting in a
    compromised data set.


    While you can solve many of these issues by creating queries, and with enough
    foresight you can import all files in a folder, what happens in the following
    situations?


    +   * You built a query with significant transformations against a single file.
    The boss liked it so much that it turned it into the business intelligence system
    and now needs to be performed on monthly file and appended.

    * You attempted to import all files in a folder, but the files required transformation
    before being appended.


    Either of these scenarios creates problems, but each can be solved by creating
    a custom function. These functions can be used to take an existing set of Power
    Query code, package it up, and it to be executed multiple times. In the case of
    the first scenario, you can reuse what''ve already built and apply it consistently
    to each new file (reducing the human error factor). In the case of the latter,
    you can apply the process to each file, landing the result of each preprocessed
    data set into a column of tables that can then be combined.


    And the best part? It''s not that difficult!


    # Building a Custom Function


    In order to build a custom function, you basically follow a three-step process:


    +   1. Build a single-use scenario first.

    2. Convert the single-use scenario into a function.

    3. Call the function from another query.


    This sounds easy in practice. Let''s take a look how to put it all together.


    Rather than build a new scenario, you will fall back on the scenario from Chapter
    18 on conditional logic, where you imported the 2015-03-14.txt timesheet. In this
    chapter you''ve already built the code to perform the import you needed, targeted
    at a specific timesheet.


    Not surprisingly, you''d now like to apply the same logic to a different file.
    Rather than just change the source, however, you''d also like to consolidate those
    files and others that are later added to the directory. For this, you can use
    a custom function.


    # Building a Single-Use Scenario


    You''ve already built the single-use scenario previously, and you can just load
    it to begin your work here. Open the Ch21 Examples\Custom Functions.xlsx file
    to get a copy of the routine that you built previously. This file contains code
    identical to what was built in Chapter 18, with one exception: the file path is
    pointed to a folder Source Files, which contains three separate files (including
    the original 2015-03-14.txt file).


    When you go to Edit Query, you get an error message because the Source step refers
    to a location that is different from where you copied the sample files. To resolve
    this:'
  merge: -1
  pgno: 198
