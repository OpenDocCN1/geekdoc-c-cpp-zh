  md: '# Chapter 1


    ![](img/db58f542749354fde4835edbc0ae9a1a_5_0.png)


    # # BUDDING

    # BRILLIANCE


    Mathematician Alan Turing showed that ideas could be as powerful as weapons. Combining
    his math and science talents with a passion to help his country, he found a way
    to help Britain and its allies win World War II (1939–1945).'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'Alan was born in London, England, on June 23, 1912. Alan''s parents soon went
    back to India, where Alan''s father worked for the government. Alan and his brother
    did not live with their parents. The boys lived with family friends and grew up
    in England.


    ![](img/db58f542749354fde4835edbc0ae9a1a_6_0.png)'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'Alan began attending Hazelhurst, a boarding school in Sussex, when he was nine
    years old. He lived and studied there. Alan loved math and science, and he spent
    most of his free time thinking about the subjects. He even did his own chemistry
    experiments. But his abilities were often unrecognized by his teachers and classmates.


    ![](img/db58f542749354fde4835edbc0ae9a1a_7_0.png)


    > Alan''s brother, John, also went to school at Hazelhurst.'
  merge: -1
  pgno: 7
- img_proc: true
  md: '![](img/db58f542749354fde4835edbc0ae9a1a_8_0.png)


    > Alan''s mother sketched this picture of Alan (left) examining daisies while
    his classmates played a field hockey game. Young Alan was always interested in
    plants than in sports.


    # Hockey or Watching the Daisies Grow


    Alan was especially fascinated with plants. Alan''s mother sketched a picture
    of him gazing at daisies while he was supposed to be playing field hockey with
    Hazelhurst classmates. Alan also enjoyed reading a book called Natural Wonders
    Every Child Should Know by Edwin Tenney Brewster. It was a well-known science
    book that covered the similarities and differences between living things.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'Alan’s mother was not pleased that her son enjoyed science so much. Science
    was not considered a proper course of study for young British gentlemen. Schools
    at the time valued subjects such as Latin and English literature. She worried
    he would not be accepted into a good school after leaving Hazelhurst.


    # DIFFICULT STUDENT


    His mother had no reason to worry. At thirteen, Alan was accepted to the Sherborne
    School, a well-regarded British institution. There, he kept digging into his interest
    in science on his own. He read Albert Einstein’s general theory of relativity.
    The theory was Einstein’s idea of


    ![](img/db58f542749354fde4835edbc0ae9a1a_9_0.png)


    > This photo was taken when Alan was a student at Sherborne School. The school
    is in southwestern England.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'how gravity works. He said that objects bend, or curve, time and space depending
    on how much mass they have. Gravity is the result of these curves. Despite the
    complex nature of the theory, Alan’s notes on the subject proved that he understood
    it.


    Alan was clearly intelligent. But his teachers didn''t see it. They called his
    schoolwork careless and sloppy, and he was so far behind in some subjects that
    he almost wasn''t allowed to take his final exams.


    # PROVING HIMSELF


    But Alan took his exams. He passed and graduated from Sherborne School. Then he
    went to King''s College in Cambridge. His teachers there were more accepting of
    his interest in math and science. He began to think about more complex mathematical
    ideas, such as statistics. Turing rowed, sailed, and ran to clear his mind when
    he wasn''t studying.


    After graduating in 1934, Turing stayed at the college as a fellow—scholar who
    works at a college. He studied probability theory. This branch of mathematics
    has to do with how likely it is that random events will occur. In 1936, Turing
    won a Smith’s Prize from the University of Cambridge for his work in probability
    theory.'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Chapter 2


    ![](img/db58f542749354fde4835edbc0ae9a1a_11_0.png)


    > Turing ran for fun and also competed in races during his time at King''s College.


    # CODE-BREAKING


    Turing was out running one day when he got an idea he just had to write down.
    He thought it might be possible to build a computing machine that could solve
    math problems by itself.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Turing imagined his machine reading a set of instructions for solving math
    problems. The instructions would be on a length of tape. The tape would have squares
    on it. Some squares would be blank. Others would be marked with characters such
    as 1 or 0. The machine would read the numbers on the tape and be able to calculate
    answers to difficult problems.


    ![](img/db58f542749354fde4835edbc0ae9a1a_12_0.png)


    > Turing was one of the world''s first computer scientists.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'The machine Turing had in mind was a thought experiment. He didn''t think it
    could really be built. He worked alone and didn''t realize other mathematicians
    were working on similar ideas.


    In 1936, Turing published a paper about a math problem. To solve the problem,
    he wrote about a computing machine. The paper was the first explanation of how
    such a machine could be programmed. He didn''t know it then, but the paper would
    be groundbreaking in the world of mathematics.


    # PREPARING FOR WAR


    The same year he published his paper, Turing began


    > COMPUTER PIONEER Turing''s idea for instructions for a computing machine is
    the basis for modern computer languages. Most computer languages are translated
    by the machine into a series of 1s and Os called a binary code. By reading the
    order of the binary code, the computer can follow complex instructions.'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'attending Princeton University in New Jersey. He studied mathematics and, later,
    **cryptography**. His interest in cryptography grew from frightening current events
    during the 1930s.


    > Princeton University is one of the oldest colleges in the United States. It
    began accepting students in 1746.


    ![](img/db58f542749354fde4835edbc0ae9a1a_14_0.png)'
  merge: -1
  pgno: 14
- img_proc: true
  md: '![](img/db58f542749354fde4835edbc0ae9a1a_15_0.png)


    > Adolf Hitler (right) became the leader of Germany in 1933.


    While Turing was studying at King''s College and Princeton, Adolf Hitler rose
    to power to become the dictator of Germany. Hitler and the Nazi Party had plans
    to expand into other countries through military force. Britain was likely to go
    to war against Germany. Like many others throughout Europe and the world, Turing
    was scared. But he knew that knowledge of cryptography could be useful in a war.


    In 1938, Turing graduated from Princeton. He was offered a position at the university
    and could have stayed in the United States. Instead, he returned to Cambridge
    and then began'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'work at the Government Code and Cypher School. It wasn''t really a school but
    rather a secret code-breaking organization started during World War I (1914–1918).
    It gathered intelligence about the enemy to keep Britain safe.


    The Germans enciphered their military messages. That prevented their enemies from
    reading them and learning their plans. In 1938, a team of mathematicians in Poland
    designed a machine called Bomba. It deciphered codes and allowed the mathematicians
    to unlock and read entire coded messages written by the German military. It worked
    as long as the Germans followed a certain pattern when creating their messages
    each day.


    Soon enough, the Germans changed their method of creating codes so Bomba could
    not crack them. Bomba would still prove to be useful, however. It would become
    an important part of Turing''s code-breaking work during World War II.


    # TECH TALK


    > [Turing] invented the idea of software, essentially. It''s software that''s
    really the important invention.


    --Freeman Dyson, physicist'
  merge: -1
