- img_proc: true
  md: 'People may visit the Alan Turing Memorial in Manchester, England. It was unveiled
    in 2001.


    ![](img/db58f542749354fde4835edbc0ae9a1a_28_0.png)'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'In 2009, British prime minister Gordon Brown offered an official apology to
    Turing on behalf of the government. In 2013, Queen Elizabeth II formally pardoned
