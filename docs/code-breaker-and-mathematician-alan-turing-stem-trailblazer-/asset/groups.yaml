  - '[PAGE 27]


    Around this time, Turing''s work was interrupted. In England in the 1950s, it
    was against the law to be homosexual. Turing was homosexual. In 1952, he was convicted
    of the crime of being homosexual. He lost his security clearance. He could no
    longer work in cryptography for the government.


    # DEATH AND HONOR


    Turing died of cyanide poisoning in June 1954. Many people believe he committed
    suicide. But his death may have been accidental. Turing often used cyanide in
    experiments at home. He may have swallowed the poison or inhaled its vapors by
    mistake.


    After his death, the British government recognized that Turing had been mistreated
    when he had been convicted of a crime.


    > I believe that at the end of the [twentieth] century the use of words and general
    educated opinion will have altered so much that one will be able to speak of machines
    thinking without expecting to be contradicted.\n—Alan Turing


    # TECH TALK'
- md: '

    People may visit the Alan Turing Memorial in Manchester, England. It was unveiled
    in 2001.


    ![](img/db58f542749354fde4835edbc0ae9a1a_28_0.png)


    In 2009, British prime minister Gordon Brown offered an official apology to Turing
    on behalf of the government. In 2013, Queen Elizabeth II formally pardoned him
    for his criminal conviction.


    Turing continues to be honored and respected for his work. He helped save the
    world from Nazi aggression, and he sparked new ideas about math, science, and
    technology.


