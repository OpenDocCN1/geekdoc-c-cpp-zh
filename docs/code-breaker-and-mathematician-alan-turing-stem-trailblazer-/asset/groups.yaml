    # ABOUT THE AUTHOR


    Heather E. Schwartz has written more than sixty nonfiction books for kids. She
    always enjoys researching and learning about people with a passion for what they
    do, like Alan Turing.


    ![](img/db58f542749354fde4835edbc0ae9a1a_35_0.png)


    Have you ever wished you could do heroic to help your country? When Alan Turing
    was a boy, he was fascinated by math and science. Later, Turing''s math skills
    would help Great Britain win World War II.


    Turing''s parents taught him he''d be better off dropping math in favor of more
    gentlemanly studies, such as literature and Latin. But he stuck with it, and by
    the start of World War II in 1939, he was ready to take on the biggest challenge
    his country faced: Nazi Germany. Turing put his advanced knowledge of math to
    work decoding secret German messages. Great Britain turn to help the tide of the
    war—they provided the foundation upon which much of modern computing and artificial
    intelligence is based.


