    人们可能会访问位于英国曼彻的艾兰·图灵纪念碑。它于2001年揭幕。


    ![](img/db58f542749354fde4835edbc0ae9a1a_28_0.png)


    2009年，英国首相戈登·布朗代表政府向图灵表达了正式道歉。2013年，伊丽莎白二世女王正式赦免了他因同恋而被定罪的刑事。


    图灵因其贡献持续受到人们的推崇和尊重。他曾帮助世界免受纳粹德国的侵略，并激发了关于数学、科学和技术的各种思想火花。


