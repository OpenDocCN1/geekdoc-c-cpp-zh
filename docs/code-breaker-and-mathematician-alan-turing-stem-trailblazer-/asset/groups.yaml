    attending Princeton University in New Jersey. He studied mathematics and, later,
    **cryptography**. His interest in cryptography grew from frightening current events
    during the 1930s.


    > Princeton University is one of the oldest colleges in the United States. It
    began accepting students in 1746.


    ![](img/db58f542749354fde4835edbc0ae9a1a_14_0.png)


    ![](img/db58f542749354fde4835edbc0ae9a1a_15_0.png)


    > Adolf Hitler (right) became the leader of Germany in 1933.


    While Turing was studying at King''s College and Princeton, Adolf Hitler rose
    to power to become the dictator of Germany. Hitler and the Nazi Party had plans
    to expand into other countries through military force. Britain was likely to go
    to war against Germany. Like many others throughout Europe and the world, Turing
    was scared. But he knew that knowledge of cryptography could be useful in a war.


    In 1938, Turing graduated from Princeton. He was offered a position at the university
    and could have stayed in the United States. Instead, he returned to Cambridge
    and then began work at the Government Code and Cypher School. It wasn''t really
    a school but rather a secret code-breaking organization started during World War
    I (1914–1918). It gathered intelligence about the enemy to keep Britain safe.


    The Germans enciphered their military messages. That prevented their enemies from
    reading them and learning their plans. In 1938, a team of mathematicians in Poland
    designed a machine called Bomba. It deciphered codes and allowed the mathematicians
    to unlock and read entire coded messages written by the German military. It worked
    as long as the Germans followed a certain pattern when creating their messages
    each day.


    Soon enough, the Germans changed their method of creating codes so Bomba could
    not crack them. Bomba would still prove to be useful, however. It would become
    an important part of Turing''s code-breaking work during World War II.


    # TECH TALK


    > [Turing] invented the idea of software, essentially. It''s software that''s
    really the important invention.

    -- Freeman Dyson, physicist


    # Chapter 3


    ![](img/db58f542749354fde4835edbc0ae9a1a_17_0.png)


    # BUILDING THE BOMBE


    On September 1, 1939, Germany invaded Poland. Two days later, France and Britain
    declared war on Germany. World War II had begun. Turing''s work in math and cryptography
    suddenly became urgent and an important part of the war effort.


    Britain and its allies, including the United States, wanted to decode Germany''s
    messages to prevent surprise attacks. But the Germans had a secret weapon on their
    side: the Enigma machine. Invented by a German engineer, the Enigma machine could
    encipher code that was impossible for human code-breakers to crack.


    ![](img/db58f542749354fde4835edbc0ae9a1a_18_0.png)


    The Enigma machine looked similar to a typewriter—machines with keyboards that
    people used to write on before computers were developed. It had a keyboard and
    several rotating wheels. When messages were typed on the keyboard, the wheels
    turned and changed letters to scramble messages. The machine was able to scramble
    letters in so many different ways that code-breakers could not possibly try them
    all. And the settings were changed each day to create an entirely new code.


    # GUESSING GAME


    Turing had some clues about how to crack the Enigma code. He knew that certain
    words and phrases were common in messages the Germans sent. For example, many
    messages were about the weather. Commonly used words such as *wettervorhersage*,
    or weather forecast, could be deciphered. These were called cribs. A crib can
    help unlock the rest of the text in a message.


    ![](img/db58f542749354fde4835edbc0ae9a1a_19_0.png)


    By studying captured German intelligence, Turing also learned that the Enigma
    machine would never encipher a letter as itself. It would always be a different
    letter in a scrambled message. The Germans made their machine work this way on
    purpose, thinking it would make the messages harder to unscramble. But knowing
    a letter would never be coded as itself was a clue that Turing used to create
    cribs.


    ![](img/db58f542749354fde4835edbc0ae9a1a_20_0.png)


    > Scrambled German messages such as this were commonly intercepted by British
    agents.


    These clues helped Turing make educated guesses about how the Enigma code could
    be cracked. They were bits of information that helped form a mathematical solution
    in his mind. But they were not enough to break the code.


    # CRACKING THE CODE


    The main obstacle to cracking the Enigma code was the number of possibilities
    that existed. There were too many for a code-breaker to test. But Turing believed
    a machine could do what humans could not.


    He built a machine called the Bombe based on the Polish Bomba. The Bombe was made
    of rotors and switches that acted like thirty-six Enigma machines. The parts moved
    quickly to test thousands of different letter combinations.


    > THE BOMBE

    The Bombe was an enormous machine. It was about 7 feet (2.1 m) wide, 6.5 feet
    (2 m) tall, and weighed 1 ton (0.9 t). It used 12 miles (19 km) of wiring and
    contained ninety-seven thousand parts.


    ![](img/db58f542749354fde4835edbc0ae9a1a_22_0.png)


    > To ensure that British agents would be able to decipher all the German messages
    they intercepted, more than two hundred Bombes were built during the war.


    With the help of a crib, the Bombe worked on German messages that the British
    intercepted. It found a small number of likely solutions to each enciphered message
    for code-breakers to check. From there, they could easily decipher the code and
    read the messages.


    # Chapter 4


    ![](img/db58f542749354fde4835edbc0ae9a1a_23_0.png)


    # AFTER THE WAR


    World War II ended with Germany''s defeat in 1945. The Bombe played a major role
    in the outcome. Messages deciphered by the Bombe told about the enemy''s movements
    and plans. Some experts believe the fighting would have continued for two more
    years without Turing''s Bombe. They estimate two million more people would have
    died in the war.


    Britain recognized Turing''s efforts. He was honored as an Officer of the Most
    Excellent Order of the British Empire. After the war, he continued working in
    his field. At the National Physical Laboratory in London, Turing designed the
    Automatic Computing Engine. It was the first computer design that could store
    digital programs.


    > Turing''s Automatic Computing Engine was first put to use in 1950.


    ![](img/db58f542749354fde4835edbc0ae9a1a_24_0.png)


    # THE TURING TEST


    In 1948, Turing became deputy director of the Computing Machine Laboratory at
    the University of Manchester. There, he developed ideas for computer software
    and artificial intelligence. He created the Turing test to study artificial intelligence.


    The Turing test was an experiment to see if artificial intelligence could really
    think for itself. A person acting as a judge received messages on a screen. Some
    messages came from another person. Others were from the computer. If the judge
    mistakenly believed the computer-generated messages came from a human at least
    half the time, it could be assumed that the computer was intelligent. Forms of
    the Turing test are still used to judge a computer''s ability.


    > “A computer would deserve to be called intelligent if it could deceive a human
    into believing it was human.”

    — Alan Turing


    ![](img/db58f542749354fde4835edbc0ae9a1a_26_0.png)


    # FINAL CONTRIBUTIONS


    In 1952, Turing turned his attention to biology and how things grow. His interest
    in the subject went back to his childhood, when he''d been fascinated with plants.
    As an adult, he had new ideas that explained how patterns in living things develop.
    He published a paper on his ideas, focusing on daisies.


    Around this time, Turing''s work was interrupted. In England in the 1950s, it
    was against the law to be homosexual. Turing was homosexual. In 1952, he was convicted
    of the crime of being homosexual. He lost his security clearance. He could no
    longer work in cryptography for the government.


    # DEATH AND HONOR


    Turing died of cyanide poisoning in June 1954. Many people believe he committed
    suicide. But his death may have been accidental. Turing often used cyanide in
    experiments at home. He may have swallowed the poison or inhaled its vapors by
    mistake.


    After his death, the British government recognized that Turing had been mistreated
    when he had been convicted of a crime.

