    The major difficulty in simultaneously using electrical stimulation and high-gain
    preamplifiers results from the discrepancy between the amplitudes of the stimulus
    and the neuroelectric potentials. Stimulator voltage outputs may be as high as
    100 volts before they can be effective in eliciting neural responses. However
    the amplifier is tuned to pick up signals that are best measured in units of millivolts,
    and often only in microvolts. Thus the amplifier is exposed during stimulus to
    a very larger voltage than it can handle. Under these conditions most amplifiers
    overload and are momentarily blocked in their ability to pass any input low-level
    signals. Blockage of this sort is due to the fact that the stimulus voltage and
    the neuroelectric signal are closely coupled to each other electrically; that
    is, they are referenced to the same common potential. If the two potentials can
    be decoupled, or isolated from each other, this problem can be achieved in many
    ways, all of which involve some sort of electrical transmission to a grounded
    "floating" or ungrounded circuit. Simple transformers can be used as the simplest
    expedient, but transformers do not have good isolation or waveform preservation
    properties.


    Two more recent developments have much improved the degree of isolation that can
    be obtained. One innovation is a radio frequency system. This device, developed
    by Schmitt and Dubbert (1949), makes use of a very small transmitter that sends
    a signal across an air gap to an equally tuned receiver. The net effect of the
    transmission of the signal across the gap between the two coils is to provide
    a voltage on the output that is free of any reference to ground except that is
    leaking through parasitic capacitances.


    An even greater degree of isolation can be achieved through the use of optical
    isolators. These systems substitute a voltage-controlled light source and a light-sensitive
    resistor for the transformer or radio frequency transmitter-receiver. When an
    input signal activates the unit, the light source, usually a photodiode, glows.
    The light then activates a photodetector, which changes resistance in a way that
    controls the magnitude of the current passing through the output circuit. The
    effect of this transmission, once again, is to isolate the stimulus from ground
    reference.'
