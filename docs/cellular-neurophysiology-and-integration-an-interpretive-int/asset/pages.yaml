  md: '# A. GROSS ANATOMY OF THE HUMAN NERVOUS SYSTEM


    The peripheral nervous system, the network of nerves that extends to all portions
    of the body, consists of two parts. One part is composed of the somatic nerves
    sending motor or efferent (outward-going) signals to the voluntary muscles and
    receiving sensory or afferent (inward-going) signals from the sensory receptors.
    The other part of the peripheral nervous system is also efferent and afferent
    and sends both motor signals to receives sensory messages from the smooth muscles
    and the internal organs of the body. This second part is known as the *autonomic
    system*. Its motor component, in turn, is composed of two parts, the *sympathetic*
    and *parasympathetic* portions.


