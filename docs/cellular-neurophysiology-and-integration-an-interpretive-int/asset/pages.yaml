  md: '# 1. INTRODUCTION


    To make the distinction between the processes of communication and integration
    more specific, let us define these terms more explicitly at this point:


    Communication—The process by which information is transmitted from one point to
    another in the nervous system. The prime criterion for excellence of communication
    is that the transmitted information be the same when it arrives at its destination
    as it left the source. Integration—The process by which information from several
    different sources interacts at some processing point to produce an output that
    is improved in its utility, economy of representation, or biological effectiveness.
    The prime criterion for excellence of integration is that multiple inputs result
    in outputs of increased biological value.


    It must be realized that there is a basic incompatibility between the requirements
    for good communication and the requirements for good information processing in
    the nervous system. The communication aspects of the nervous system should be
    ideally designed to have the highest possible fidelity. The communicated information
    pattern should be accurately reproduced. On the other hand, integrative information-processing
    mechanisms function to alter, convert, or transform the incoming signal from one
    pattern to another, and thus they court the demands for transmission fidelity.
    The ability to adapt to the great variety of environmental stimuli encountered
    by organisms is critically dependent upon this integrative processing of information.
    From the evolutionary point of view it is virtually useless for an organism to
    spew out the same information pattern that was taken in. Without integration,
    interaction, and synthesis, without the deletion of irrelevant information and
    the enhancement of incoming information patterns by assimilation with old memories,
    behavioral evolution would probably come to a standstill as animals failed to
    modify their responses to environmental stresses.


    The analogy between neural integration and the genetic combination process in
    sexual reproduction is clear. Both processes achieve variety, flexibility, and
    adaptability because they combine a large number of components into a virtually
    infinite number of combinations, in a way that leads to continuous improvement
    in the species. As genetic combination is the essence of evolutionary development,
    so neural integration is certainly the really unique aspect of an animal''s mental
    life. Though it may seem farfetched to some, it is reasonable to argue that the
    essence of human consciousness is largely this ability to combine and permit input
    signals at the neuronal level.


    Older models that view the nervous system as simply a switching network (such
    as classic conditioning models or more recent computer'
