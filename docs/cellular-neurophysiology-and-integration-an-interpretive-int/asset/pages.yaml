  md: '# 9

    THE SYNAPSE


    Chapter 3 emphasized the fact that the contemporary doctrine of neuronal anatomy
    asserts that neurons transmitting information within the nervous system are not
    protopastically interconnected. Rather, in each sensory modality three to fix
    five separate cells are connected "end to end" to sequentially convey afferent
    signals to the brain. neurons communicate through a very large number of interconnecting
    regions. The regions of communication between neurons, known as synapses, have
    been the object of intensive study by neurophysiologists because it is only at
    these points that neural integration and interaction become possible. This interest
    has been especially great since neural discontinuity was firmly established by
    advances in electronmicroscopy and staining techniques.


    Considering the infinitesimal dimensions of synapses, how is we know that the
    neurons on each side of a synapse are separated by their plasma membranes? Eccles
    (1964) has listed the following specific evidence for accepting the doctrine of
    anatomical discontinuity between neurons:


    +   1. Axonal degeneration produced by separating the axon from the cell body
    does not proceed across synaptic boundaries. Thus the metabolism of the axon beyond
    the synapse is separate and distinct from that preceding the synapse.

    2. Most synapses insert a1/2 to 1 millisecond delay in the transmission of a neural
    signal. This is equal to the delay produced by conduction over an inch or two
    of uninterrupted axon.'
