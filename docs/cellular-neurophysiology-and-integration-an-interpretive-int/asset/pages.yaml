    In Chapter 8 we consider how single cell responses can be mixed to produce compound
    or pooled action potentials. These classes of electrical signals reflect the action
    of many cells, rather than one. A particularly important issue is whether or not
    the group statistics of neurophysiological responses truly represent the characteristics
    of individual cells. A consideration of some appropriate research shows that the
    two are highly correlated, and thus some important links can be made between the
    two kinds of response.


    Having completed the discussion of transmission properties along neurons and mixed,
    noninteracting, neuronal responses, we are then prepared to consider, in Chapter
    9, the problem of transmission between neurons. The synapse is a highly specialized
    region between neurons that allows the electrochemical activity in one cell to
    initiate a comparable pattern of activity in a nearby cell. Both chemically and
    electrically mediated synapses are discussed, as well as some important topics
    concerning the ionic basis of synaptic action.


