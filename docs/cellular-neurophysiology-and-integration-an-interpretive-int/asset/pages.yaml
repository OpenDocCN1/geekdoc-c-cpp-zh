    in the temperature of the cat''s tongue. Some fibers seemed to respond best to
    cooling and others to warming, while those that responded to ambient or steady
    levels also seemed to be separated into cold- and warm-sensitive groups. Quite
    patterns of response were often observed among these steady discharge fibers,
    which are thought to differentially encode warmth and cold on the one hand, and
    warming and cooling on the other.


    In general, however, we have little knowledge of the primary sensory actions that
    lead to thermal sensations or to such complex experiences as pain, itch, or tickle.
    Most of what is known about the primary sensory action in somesthesis is based
    upon on mechanoreceptors such as the Pacinian corpuscle.


