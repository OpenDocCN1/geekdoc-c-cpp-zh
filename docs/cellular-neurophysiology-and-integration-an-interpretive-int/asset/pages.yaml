  md: '# B. ORIGIN OF THE ELECTRICAL BASIS OF NERVOUS ACTION


    as the electricity in a metallic conductor. Though both are electrical and can
    be described by the same mathematical functions, in each case the carriers are
    different. Electrons and “holes” convey charge in metals, while ions convey charge
    in the neuron. In addition, the properties of the conductors are different. Metals
    have low resistances, while neurons have mixed resistive and capacitive elements
    of appreciable magnitude. The capacitive and resistive elements in a neuron and
    the nature of the carrier that specify conduction velocities will be far slower
    in biological tissues than in a wire. Furthermore, the neuron is a metabolic system
    that in many instances produces its own power from sources located within the
