    terminal portions of the neuron are seen to rest in shallow trenches or troughs
    on a specialized thickening of the motor cell membrane known as the motor end
    plate. Figure 9.8b, a drawing made from an electron micrograph, shows better detail
    the fine structure of the junction between the neuron and the motor end plate.
    The reader should particularly note the fine gap between the two structures (reminiscent
    of the synaptic cleft), the invaginations of the muscle cell''s end plate by tiny
    extrusions of the motor neuron, and perhaps most important, dark stained particles
    reminiscent of the packets of transmitter substance in the synapse.'
