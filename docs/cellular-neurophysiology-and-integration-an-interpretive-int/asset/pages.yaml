  md: '# 196 9. THE SYNAPSE


    Recent work (Chapters 10 and 11) indicates that some of the substances that had
    been thought to be exclusively excitatory may in fact be either excitatory or
    inhibitory, depending upon the nature of the receptor site. Acetylcholine, for
    example, is now known to serve either role in invertebrates like Aplysia.


    Substances that have classically been considered to be solely inhibitory in mammalian
    brains include the amino acids glycine and GABA (gamma-aminobutyric acid). On
    the other hand, a substance like strychnine, while not strictly a natural transmitter
    substance, is known to inhibit inhibitory action and thus produce a pseudo-excitatory
    effect is, therefore, to elicit neural activity, and in large doses this activation
    may be so strong as to result in severe convulsions. Chemicals such as strychnine
    appear to decrease the sensitivity of postsynaptic region to the inhibitory substances
    that normally stabilize the neural net.


    The general concept of the secondary inhibition of inhibitory effects is exceedingly
    important. Furthermore, some chemical means of deactivating transmitter substances
    must exist in the postsynaptic tissue in order to prevent a perpetuation of the
    inhibitory or excitatory effects. In cholinergic systems, postsynaptic tissues
    seem to be rich in AChE (acetylcholterase), an enzyme that quickly breaks down
    acetylcholine. The synaptic effects of acetylcholine last for only a few milliseconds
    before the transmitter molecules are destroyed and deactivated. This is particularly
    important in speeding up the action of neurons and motor units, since perseverance
    of a response would reward the speed at which changes could be made in the state
    of a neuron.


    Similarly it has been suggested that some general anesthetic drugs work by interfering
    with chemical synaptic transmission. The postsynaptic sites, chemoreceptors that
    they are, are especially likely to bind a number of chemicals, but not all are
    absorbed excite the neuron. Specifically, the suggestion has been made that blocking
    occurs when the anesthetic drug occupies many of the postsynaptic receptor sites
    without producing the effects that would be required for nervous transmission.
    Since the sites are already occupied, any of the usual transmitter substance that
    might arrive be ineffective. Other anesthetics, particularly local ones, must
    directly act to reduce axonal activity.


    Although several major stages of the synaptic transmission process have been distinguished,
    not all are fully understood. It is not known, for example, if spike action potentials
    produce an intermediate graded potential in presynaptic tissue, or if the potentials
    detected there are merely degraded spikes. A question of equal importance concerns
    the action of the specific release mechanism. How does a graded potential release
    or trigger the release of very large numbers of transmitter molecules? In other
    words,'
