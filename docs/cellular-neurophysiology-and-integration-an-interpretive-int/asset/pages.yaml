  md: '# 12

    A SUMMARY OF

    GENERAL PRINCIPLES


    We have now completed an interpretive and introductory survey of the science of
    cellular neurophysiology and integration. The material has been presented in a
    way that, hopefully, emphasizes the meaning of the various experiments while still
    making clear the procedures and results. The book has been organized in such a
    way that a conceptual thread is maintained, progressing from the simple to the
    more complex and from the periphery to the central nervous systems. Necessarily,
    in presenting knowledge of such complexity, the material must be spread over many
    pages and, probably, many separated hours of the reader''s time. Very often the
    effect of this dispersion is to dissipate what, perhaps, be the most important
    content of a text. Essential content is, of course, the general perspective that
    emerges as one is exposed to the many details of the experimental material. In
    other words, the "trees" of the experiments obscure the "forest" of a general
    theoretical overview. It may also be the case that each individual experiment
    is not of great importance; any one of their number might make the same point—as,
    indeed, it must if a body of knowledge to become a structured science rather than
    remain a disordered collection of isolated and trivial facts.


    For these reasons, it would be useful to summarize what are, in the author''s
    opinion, the most important general concepts of cellular neurophysiology. These
    will be stated in a list of brief recapitulations. No attempt will be made to
    justify these principles anew (if that was not done adequately to this point,
    the book has failed its intent). The principles will simply be presented ex cathedra.
    This particular list of general conclusions,'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# 270 12. A SUMMARY OF GENERAL PRINCIPLES


    of course, reflects the personal biases, interests, and experiences of the author
    as well as empirical findings surveyed in this text. Nevertheless, we hope that
    our perspective is relatively consistent with that of the rest of the neurophysiological
    community, and that this list will be a fair statement of what most neurophysologists
    would agree are the most important principles of the science today.


    +   1. Cellular neurophysiology is the study of the function, structure, and biochemistry
    of neurons—the cells of an organism that are specialized for the transduction,
    communication, and integration of stimulus information.


    +   2. Though the science of cellular neurophysiology is an interesting and exciting
    field of inquiry in its own right, recent enthusiasm has been directed at its
    implications for establishing a reductionistic basis for molar behavior. In G.
    A. Horridge''s words, "The aim of neurobiology is the explanation of behavior."


    +   3. This aspect of the goals of the science of neurophysiology is founded upon
    a specific philosophical statement about the nature of the mind. That statement
    is the assertion of structural monism: All aspects of mind, consciousness, behavior,
    and performance are nothing more (or less) than the function of the tissues that
    make up the nervous system. Many neurophysologists compartmentalize their personal
    beliefs and scientific work, this modest premise is implicit in the work of all
    contemporary researchers in the field.


    +   4. Modern neuron theory assumes a system of discrete neurons that are not
    protopically interconnected but that interact through specific points of contact
    known as synapses.


    +   5. Neurons are specialized cells characterized by a high degree of electrochemical
    reactivity. Their function in the nervous system is primarily communication and
    integration of information patterns, but it is becoming increasingly evident that
    many neurons also play a secretory role.


    +   6. Neurons carry out their communication and integration functions by means
    of electrochemical reactions. The flow and concentration of few ions (sodium,
    potassium, and chloride) mainly define the direction and magnitude of the voltages
    measured during any neural response.


    +   7. Neurons respond in a number of different ways. Both regenerative action
    potentials and graded potentials are to be found at different points on the cell.
    Some of these responses are activated by mechanisms intrinsic to the cell (e.g.,
    spontaneous or pacemaker action potentials), while others are produced by outside
    stimulation (e.g., receptor or synaptic action potentials).


    +   8. The category of "action potential" (contrary to popular usage) includes
    responses other than the spike action potential. In fact, any deviation from the
    potential level of the resting membrane that is not related'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# A SUMMARY OF GENERAL PRINCIPLES 271


    to the metabolic state of the membrane may be considered to be an information-bearing
    action potential. Specifically included in the category of action potentials are
    nonregenerative graded potentials.


    9. The electrical signals picked up from neurons are correlates of the dynamic
    and steady-state distributions of the involved ions. However, the electrical signal
    should not be considered to be the primary aspect of neural activity. We are now
    learning that the electrochemical action of the neuron is more chemical than it
    is electrical. Our fascination with the electrical concomitants is due to the
    fact that our recording technology is more sensitive to volts than to ions.


    10. Although the electrical correlates of nervous activity have been guessed for
    several hundred years, it was not until the introduction of modern electronic
    recording instruments that specific understanding of the electrochemistry of neurons
    was achieved. Both the anatomical oddity represented by the giant axon and the
    invention of the intracellular microelectrode contributed greatly to the attainment
    of this understanding.


    11. Electrophysiological instruments have a dual influence on the development
    of both the theory and data of neurophysiology. In many cases a particular device
    has opened the door to detailed understanding of one or another process while
    at the same time inhibiting the development of a broad conceptual understanding
    of the action of neurons. This limitation has been especially unfortunate with
    regard to multicellular processes, since so many of our instruments are sensitive
    only to the temporal response of single points in space.


    12. The electrochemical events underlying nervous action are currently assumed
    to be directly mediated by the neuronal or plasma membrane. This assumption is
    known as the membrane theory. In particular, variations in the impedance of the
    membrane to the flow of sodium, potassium, and chloride ions seem to explain what
    we know of neural processes.


    13. Neurons exhibit a wide variety of anatomic forms, depending upon their function.
    Transmission neurons typically possess elongated axons, whereas integrating neurons
    often display extensive arborization of the dendritic trees. Receptor neurons
    may or may not have axons. Generalizations about anatomic form, however, usually
    turn out to have many exceptions.


    14. Receptors are tuned to respond to vanishingly small amounts of a type of physical
    energy—their adequate stimulus—and in some cases are as sensitive as, theoretically,
    they can be (e.g., a rod of the retina seems to produce a single quantum of light).


    15. Many receptors exhibit ultramicroscopic structures at their synaptic junctions
    that are suggestive of both afferent and efferent synaptic'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# 272 12. A SUMMARY OF GENERAL PRINCIPLES


    interconnections. Information, therefore, may travel both into and out of a receptor,
    and neuronal integration probably occurs even in these most peripheral units.


    16. Many receptors have elongated or ciliated structures. This characteristic
    feature produces two advantages: the protrusion of the receptive tissue into an
    area where it is likely to encounter stimuli, and an increase in the area of the
    sensitive surfaces.


    17. Some receptors (e.g., the rod of the vertebrate eye and the receptor cells
    of the taste bud) are continually in a dynamic process of decay and regeneration.


    18. Transmission neurons can conduct in both the orthodromic and the antidromic
    directions. However, synapses are not, in general, bidirectional. Synaptic rectification,
    therefore, is the main basis of a neuronal nervous system. The refractory period
    following a spike response also helps to make the nervous system directional by
    preventing retrogriding.


    19. Transmission neurons are often covered with a myelin sheath composed of layers
    of Schwann membranes. This myelin sheath acts to produce a rapid form of neural
    transmission by allowing the ionic currents to skip between nodes of Ranvier—the
    discontinuities in the sheath.


    20. The plasma or cell membrane of a neuron is a region of demarcation between
    the inside and the outside of the cell. Since the membrane can just be resolved
    at the limits of electronmicroscopy, there is no consensus concerning its structure.
    A number of competing theories of membrane structure are current. They all involve
    a combination of lipid and protein, perhaps arranged as a bilayer of lipid molecules
    penetrated by protein molecules.


    21. An ionic concentration equilibrium is established across the membrane by a
    metabolically driven pumping action operating in a direction opposite to the passive
    forces of diffusion, osmosis, and potential driving. The establishment of ion
    concentration difference by the “pump” produces a resting potential characteristic
    of the unactivated neuron.


    22. The exact nature of the “pump” itself is not yet fully understood, but it
    appears to pump out of the neuron at least two ions of sodium (creating a sodium
    deficiency inside the cell) for each ion of potassium pumped in (creating a potassium
    ion surplus the cell). Chloride ion concentrations seem to follow more or less
    passively and are determined by the final resting potential, although the existence
    of a separate chloride pump has also been suggested.


    23. The transmembrane channels, through which sodium and potassium ions flow,
    appear to be different, because it is possible to inhibit selectively one or the
    other with various pharmacological agents.'
