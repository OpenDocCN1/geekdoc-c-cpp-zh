    small input input capacitance, when combined with the very high input resistance
    of a good preamplifier, can produce an electrical circuit with a very long resistance-capacitance
    (RC) time constant. The result of this long time constant is to reduce the high
    frequency sensitivity of the amplifying system. Therefore, recorded biopotential
    will be seriously distorted by the inability of the preamplifier to follow the
    rapidly changing signal. Rise times will be artificially elongated and very fast
    signals will not be passed at all by the electrode-preamplifier circuitry. Many
    preamplifiers, therefore, in addition to being designed for high input impedance,
    also contain special circuits whose purpose it is to reduce the time constant
    by minimizing input capacitance.


    Older amplifiers accomplished the reduction in RC time constant by laboriously
    minimizing input capacitance, either by placing the first stage of the amplifier
    close to the tip, or by elaborate shielding. However, Amatiek (1958) has described
    an ingenious method for reducing the effective input capacitance of a preamplifier
    in an entirely different manner. He suggested that the input capacitance be neutralized
    by balancing it with an equal but opposite capacitive effect. In such a device,
    the input signal is also inverted by an amplifier with a grain of 1. This inverted
    signal is passed to a second capacitor, which is adjusted by the experimenter
    to be equal to the input capacitance of the preamplifier. There are two capacitors,
    equal size and connected in parallel, with opposite polarities of applied voltage.
    The result is that the effect of the input capacitance is reduced to a vanishing
    small value, even though the capacitance is still present. The advantages of neutralization
    input capacitance are offset, by an increase in the noise level of the output
    signal. However, this is not a serious impediment, considering the relatively
    large signals produced by high impedance intracellular electrodes of the sort
    requiring input capacitance neutralization. When extracellular electrodes may
    generate only 100 microvolts, intracellular signals may be as large as 100 millivolts.


