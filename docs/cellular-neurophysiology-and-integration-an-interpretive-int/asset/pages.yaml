    NEUROMUSCULAR JUNCTION


    The junction between an efferent neuron and a motor unit of the muscle exhibits
    so many common features with the true synapse (defined as the functional junction
    between two neurons), it is essential to discuss it at this point. The final act
    of communication along the chain of neurons from receptor to effector is the converse
    of transduction. In this final step, neural electrochemical energy is converted
    into physical energy of quite a different sort than that occured through the neuron.
    The counter-transducer, as we might consider it, is the motor unit. A full description
    of how muscle cells carry out this conversion of electrochemical voltages to mechanical
    forces is not relevant to this book, but the final stage of communication at the
    junction between the motor neuron and the effector, the neuromuscular or myoneural
    junction, is important to our discussion.


    Armed with the information already presented about synaptic action, it is quite
    easy to understand the basic concepts of neuromuscular transmission. All the presynaptic
    functions are virtually identical, and the reader has only to learn a slightly
    different vocabulary specific to muscle cell response to the key features of the
    process.


    Anatomically, the main difference between the synapse and the neuromuscular junction
    is that the postsynaptic element in the junction is not a neuron but of several
    kinds of muscle cell. The contractile action of a muscle unit is now believed
    to be largely due to the variable overlapping of the sliding subcellular filaments
    in Fig. 9.8. The question pertinent to this discussion is: How does the neural
    action trigger this contraction?


