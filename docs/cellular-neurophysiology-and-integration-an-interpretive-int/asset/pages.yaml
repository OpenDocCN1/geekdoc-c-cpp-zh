    The vertebrate retina often contains two kinds of visual receptor cells, rods
    and cones. Though we know now that there are important functional differences
    between the two cell types, the original dichotomy was based simply on observations
    of their different structures.


    Typical shapes of a rod and a cone are illustrated in the diagrammatic displays
    of Figs. 3.4a and 3.4b. These figures illustrate a number of important parts.
    Both the rod and cone are composed of two main parts: an inner segment containing
    the cell nucleus and the synaptic contacts, and an outer segment containing discs
    which the light-sensitive photochemicals are enclosed. The structure of the rod,
    however, can be seen to be not only architecturally different from the cone, but
    close examination also suggests a developmental difference of considerable importance.
    Apparentlyly, the outer segments of rods are in a constant state of disintegration
    at their apical end and reconstitution from their basal end. Figure 3.4b shows
    that the rod is composed of a series of discs or plates, which are mostly unconnected
    to the outer membrane of the cell. These intracellular cells are apparently produced
    by invaginations of the cell membrane at the base of the outer segment. Radioisotope
    studies indicate that the newly formed discs migrate up through the outer segment,
    subsequently to be cast loose into the intercellular environment. Discs in the
    rods, therefore, are both unconnected and transient structures in a constant state
    of replacement.


