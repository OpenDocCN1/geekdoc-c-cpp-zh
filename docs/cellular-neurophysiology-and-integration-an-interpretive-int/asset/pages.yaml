    # B. STEREOTAXIC INSTRUMENTS AND MICROELECTRODE MANIPULATORS


    A high degree of mechanical precision is required to place a microelectrode accurately
    and to maintain it in a stable relationship to the neuronal tissue under examination.
    Stability and control of this sort require a massive mechanical apparatus that
    is sufficiently rigid and inertial to be free of unwanted mechanical motion. It
    is because of this necessity for size and mass of the accessory apparatus that
    only a few experiments have been conducted in which several microelectrodes were
    operated simultaneously in the same preparation. At present, it appears that a
    dozen or so electrodes is the largest number that have been used at once in a
    single experiment.


    The rigid framework used to hold both the animal and the microelectrode in position
    is referred to as a stereotaxic instrument, a defining term that is based on another
    function it serves. The location of some of the centers and nuclei in the brain
    or nervous system is relatively constant from one animal to another, and therefore
    brain atlases can be prepared to give the three-dimensional coordinates for structures
    referred to as particularly prominent external landmark, such as the opening to
    the ears or a suture in the skull, for an animal of a particular species and size.
