    electrical equipment. If this “pick-up” is too great, metal screens or sheets
    can be used to shield materials from most common sources of interference.


    Preamplifiers usually do not have substantial voltage gain. They are marginally
    matching devices coupling the high impedance of the electrode to the low input
    impedances of the main power amplifiers, in order to maximize power transfer from
    one to the other. They may thus produce an output signal that is only slightly
    larger in voltage magnitude than the original signal, but many times more powerful
    in current driving capacity. This low-level voltage capability means that preamplifiers
    can be entirely battery operated, another feature that can contribute to the reduction
    of noise injected into the neurophysiological record by the electronic system.


    Amplifiers in general can be separated into two different kinds on the basis of
    coupling that exists between successive stages. The first kind of amplifier is
    said to be direct current (DC) coupled from one amplifier to the next. With this
    sort of coupling even constant voltage signals can be amplified and passed through
    the system. Direct current coupling means simply that no series capacitors are
    used in the interstage circuitry, and constant voltages thus pass as easily as
    changing ones. A number of problems are associated with the design of DC amplifiers,
    because they do allow DC and other slowly changing signals to pass. These slow
    signals may include such biopotentials as the resting potential of a cell membrane,
    potentials defined by the position of the eye, slow surface changes on the brain,
    and similar signals of long or continuous duration. These are the signals that
    require the use of DC amplifiers, but there may also be spurious voltages with
    similar low-frequency characteristics that can distort or even obscure the desired
    signal.


    Interfering voltages to which DC amplifiers are sensitive include amplifier-line
    drift and electrode polarization effects, in addition to spurious electrophysiological
    signals. Base-line drift results from the amplification of tiny, gradual, long-term
    fluctuations in parts of the amplifier. In a DC coupled amplifier, a slight change
    in a resistor can produce a minute voltage shift early in the term of amplifying
    stages that can be amplified at the output to a substantial voltage fluctuation.
    Such interference may completely obscure a low-frequency neural signal. Similarly,
    slight fluctuations in the characteristics of the electrode, such as the smallest
    amounts of polarization, can be amplified and result in large constant output
    signals.


    Simpler, less noise-sensitive alternating current (AC) coupled amplifiers are
    usually used for the study of signals such as action potentials, electrocardiograms,
    and evoked potentials that are relatively brief transients, rather than for examining
    constant or long-duration voltage shifts. AC coupled amplifiers have capacitive
