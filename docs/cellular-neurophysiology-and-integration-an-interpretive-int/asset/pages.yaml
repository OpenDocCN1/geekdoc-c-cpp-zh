  md: '# 1

    INTRODUCTION


    A. THE CONTPORARY SIGNIFICANCE OF NEUROPHYSIOLOGY


    An extraordinary scientific development has been underway for the last 30 years.
    After centuries of speculation and frail theories devoid of empirical foundation,
    it is now possible to examine the cellular basis of the action of the nervous
    system, and thus to begin considering the true relation between the neural substrate
    and behavior. Perhaps no science holds such intrinsic excitement or hope for the
    long-range solution of both theoretical and practical human problems as modern
    cellular neurophysiology—the inquiry into the basic nature and function of neurons.
    It is this class of specialized cells that ultimately defines the very basis of
    human nature, and it is at this level that many of the solutions to the social
    and personal problems afflicting the people may ultimately be found.


    Each neuron, the basic building block of the nervous system, is a member of a
    class of cells that includes a remarkable variety of cellular units throughout
    the peripheral and central portions of all multicellular organisms. The essential
    feature of the neuron is its greatly heightened ability to react to events external
    to itself, and thus to interact with events occurring in neighboring neurons,
    as well as with the external environment. The reactive capacity of this class
    of highly specialized single cells has evolved from primitive excitability, elicited
    by relatively great amounts of physical stimuli, characteristic of all cells,
    to a sensitivity that allows neurons to respond to stimuli whose energy content
    approaches, in many cases, the absolute limits of physical energy. A photoreceptor
    in the eye, for example, is sensitive to a *single quantum* of light when conditions
    are'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 1. INTRODUCTION


    optimized, and the ear is sensitive to a mechanical oscillation an order of magnitude
    smaller than the diameter of a hydrogen atom.


    The highly economical power levels required by the individual neuron allow an
    information-processing system to be built into the human brain that is probably
    the most complicated single structure to have evolved in the history of the universe.
    Only at levels of cosmological interactions do we find comparable complexities,
    but even at that level there is no evidence for the emergence of any sentient
    awareness.


    This economy of energy, nevertheless desirable from an evolutionary point of view,
    is not the essential characteristic of nervous action. The same events that are
    represented by patterns of neural action could conceivably be constructed from
    completely different kinds of components, which are far less efficient, without
    any change in the nature of thought. The logical operations could remain invariant
    in an information-processing system, no matter what sort of parts were used in
    its construction. The essential aspect of neural processes is that they are able
    to synthesize complex events, including thoughts and self-awareness, by concatenating
    a huge number of quite simple processes. While the individual neuron can perform
    only a few simple logical processes, logicians have established that a fully connected
    net of neurons can represent virtually any concept, no matter how complicated.


    The presumption that a net of neurons ultimately gives rise to cognitive behavior
    is based on a great logical leap, a statement of belief, or formally, rather than
    a rigorously established “proof” of the relationship between brain structure and
    mind. Nevertheless, this premise is based on a compelling set of arguments. Many
    developments in a variety of sciences have coalesced on this issue in the last
    30 years in a way that cannot be ignored any longer. Indeed, we may now be in
    the midst of a psychobiological revolution, comparable to the great religious
    and industrial revolutions of the past, that will have profound effects on society
    in the centuries to come. The notion of brain-mind identity may have as powerful
    an influence on social development as the notions of personal freedom and democracy
    have had in the last few centuries.


    The notion that complex interactions between simple neural units may underlie
    more complex cognitive processes can be understood only if the problem of neural
    activity is approached from a point of view that emphasizes networks of neurons.
    For many technological and historical reasons, our knowledge is still limited
    to the actions and interactions of a relatively few neural units. We know quite
    a bit about the nature of the membrane of the neuron and the processes that allow
    the membrane to perform its specialized functions. We know quite a bit about how
    neurons interact with each other at their points of synaptic contact. However,'
