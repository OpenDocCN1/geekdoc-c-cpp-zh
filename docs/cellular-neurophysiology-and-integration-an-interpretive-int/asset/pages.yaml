    # 2. The Ionic Basis of the Spike Action Potential


    The preceding qualitative description of the spike action potential does not clarify
    the underlying ionic mechanisms accounting for this extraordinarily neural response.
    An elegant explanation, however, has been developed, based on the ionic model
    and notions of the semipermeable membrane discussed in Chapter 5. It was established
    that the best current explanation of the resting potential is one based upon the
    sodium and potassium ion concentration differences across a cell membrane. We
    now add to those notions the general principle that fluctuations in the resting
    potential (that is, action potentials) are mainly due to local, transient changes
    in the permeability of a membrane to these two particular ions.


