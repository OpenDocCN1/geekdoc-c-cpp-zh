  md: '# E. TRANSDUCTION IN THE SOMESTHETIC RECEPTOR 123


    While the exact nature of the conversion process at the molecular level cannot
    be clarified, Loewenstein and Rathkamp (1958) have at least established where
    in the membrane the various substeps in the transductive process occur in the
    Pacian corpuscle. Their experimental setup is shown in Fig. 6.8.


    Loewenstein and Rathkamp used a powerful technique, the pressure block, in order
    to determine the role of specific portions of the receptive tip of the axon. When
    a fine wire was used to compress the neuron at the first node of Ranvier (as shown
    in Fig. 6.8), the spike action potential disappeared, even though the generator
    potential was still present and normal. The effect of the block on the spike action
    potential can be seen in Fig. 6.9, which shows the spike before, during, and after
    the compression block. Compression blocks applied at more central nodes of Ranvier
    do not show a corresponding drop-out of the spike action potential. The conclusion
    drawn by Loewenstein and Rathkamp is that only the first node of Ranvier is specialized
    for the conversion of generator potentials into spike action potentials.


    The next question, then, is: What is the site of origin of the generator potential
    itself? The pressure block was also used by Loewenstein and Rathkamp to answer
    this question, but in this case it was applied to the unmyelinated portion of
    the nerve ending at the tip of the axon. The result of this experiment was that
    the larger and more normal-looking node was the generator potential. Figure 6.10
    presents these results. The major conclusions to be drawn from this important
    experiment are: (a) it the unmyelinated terminal of the nerve fiber that is uniquely
    capable of converting mechanical energy, into generator potentials, and (b) this
    capability is not localized. Rather, it is distributed over the entire receptive
    portion of the terminal, and the magnitude of the potential depends upon how much
    of the terminal portion of the neuron is stimulated.


    An important general observation that emerges from the Loewenstein and Rathkamp
    experiment is that there is a high degree of specialization exhibited by different
    portions of the nerve membrane, even though these portions might be located within
    a few mic of one another. The most terminal portion of the axon can produce generator
    potentials but cannot be stimulated by any means to produce regenerative spike
    action potentials. The narrow collar of membrane at the first node of Ranvier,
    on the other hand, cannot be stimulated directly to produce generator potentials.
    Yet this collar is the only portion of the nerve that seems to be capable of converting
    the generator potential to the regenerative spike for long-distance communication.
    More central portions of the axon, while perfectly capable of propagating spikes,
    cannot convert the graded generator potentials into spikes unless these graded
    potentials are abnormally large.'
