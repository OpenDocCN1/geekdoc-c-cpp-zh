    cells already mentioned, is itself part of a larger system, according to Kandel
    and his colleagues. Although L10 is a driver in the subgroup, it too receives
    inputs from other interneurons; Table 11.2 indicates that it is actually a follower
    for at least four other neurons (identified only as numbered interneurons II,
    III, IV, and V, since its specific anatomic'
