    # A. ELECTROPHYSIOLOGICAL ELECTRORODES


    As soon as it was understood there is something fundamentally electrical about
    nervous activity, the problem of interconnection between measuring equipment and
    organic tissue became a major one. The earliest electrodes were simple pieces
    of metal, and since there were inadequate display devices, it was not realized
    for many years how badly signals from the nerves were distorted by these primitive
    junctions.


    Modern electrophysiological electrodes help to reduce the distortion of the signal
    in two ways. Our discussion can be organized by dividing electrodes into two categories
    on the basis of size. Macroelectrodes include the relatively large contacts that
    can be utilized for detecting neural signals that are generated by many different
    cells, distributed over a wide region, or from neurons that can be isolated from
    their neighbors. The signals generated by the brain (electroencephalogram) or
    the heart (electrocardiogram) are typical of signals that allow the use of macroelectrodes.
    These signals are the result of the combined activity of a very large number of
    individual voltage sources distributed over a wide area. In special situations,
    single neurons may also produce sufficiently isolated voltages the details of
    their action can be detected with macroelectrodes. Some workers have been able
    to routinely pick up several single-cell responses by simply inserting the cut-off
    of a relatively thick, insulated wire into brain tissue (see, for example, Ito
    & Olds, 1971). In other instances, when cells can be physically isolated from
    one another, the separated neuron may be simply laid on top of a macroelectrode.
    (See Hartline, Wagner, and Ratcliff, 1956; Uttal & Kasprzak, 1962). But in general,
    to achieve sufficient signal amplitude and to observe the details of individual
    neuronal responses requires the use of microelectrode techniques.


