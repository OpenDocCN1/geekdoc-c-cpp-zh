    # C. ESTABLISHMENT OF THE RESTING POTENTIAL


    # 1. Concentration Potentials: A General Approach


    Let us first consider how an electrical potential is produced across a membrane
    by a difference in the concentration of solutions on either side of the membrane.
    In the idealized case to be discussed in this section, it is important to remember
    that we will be considering the potential due to only a single solute. This potential
    is exerted either a perfectly permeable membrane or across a liquid junction (that
    is, a junction between two contacting solutions a demarcating membrane, a situation
    that can only momentarily). We will not yet concerned about the specific details
    of the real neuronal membrane—a considerably more complicated system.


    Equation (5.1) defines the membrane potential produced by two concentrations of
    a single salt separated by a perfectly permeable membrane, or by a liquid junction.
    This equation is a function of several factors that contribute to the membrane
    potential, some reflecting the nature of the ions and some reflecting membrane
    characteristics:


    ```

    $E = \frac{RT}{F} \ln \frac{u-v}{u+v} \frac{C_1}{C_2} \quad (5.1)$

    ```


    where $R$ is equal to the universal gas constant, $T$ is the temperature in absolute
    degrees, $F$ is an electrical charge value that depends upon the ions that are
    involved, $u$ and $v$ are the velocities in the solvent of the anion and cation,
    respectively, and $C_1$ and $C_2$ are concentrations of the salt on either side
    of the membrane. The terms $u$ and $v$, the ion mobilities, are affected both
    by the ion species and the nature of the solvent.


    Equation (5.1) holds for the case in which the membrane is perfectly permeable
    to both the anion and the cation; thus this potential difference can only occur
    for a moment before it declines to zero. If the membrane does not allow any flow
    of ions, it is said to be impermeable, and the concentration differences $C_1$
    and $C_2$ will remain constant, and the terms $u$ and $v$ in formula become zero.
    The factors $u$ and $v$ are also effectively zero when the flow of ions across
    some less than perfectly impermeable membrane has arrived at an equilibrium condition
    such that an equal number of ions are moving from one side of the membrane to
    the other.'
