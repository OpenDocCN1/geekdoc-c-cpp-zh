    # 3. Vestibular Receptors


    Not surprisingly, considering the embryological history and its anatomic propinquity,
    receptor cell cells of the vestibular system are very similar to those of the
    auditory system. Figure 3.9 is an electicrograph of the field of cilia of a group
    of vestibular hair cells embedded in the epithelial tissue of the frog''s vestibular
    receptor. Unlike auditory hair cells, the cilia of vestibular hair cells are not
    all of equal size. There is one exceptionally large kinocilium with a bulbous
    end, which appears to lie atop the end of the other, slightly smaller stereocilia.
    Hillman and Lewis (1971), who took this extraordinary picture, believe that the
    kinocilium is physically connected to the stereocilia in a way that performs an
    important biological function. Because of the connection between the bulb and
    the stereocilia, stimulus motions that are primarily directed tangentially to
    the top of the hair cell are converted into an upward-plunger-like motion of the
    stereocilia. This redirection of the stimulus force greatly increases the physical
    energy available at the base plate, magnifying the overall sensitivity of the
    vestibular system to small accelerations.


    There are two types of vestibular hair cells, defined by shape rather than differences
    in location or observed function. Figure 3.10a (HC I) shows a typical Type I hair
    cell displaying an unusual enveloping of the hair cell by a flask-like calyx from
    the end of the second-order neuron. As the auditory hair cells, both afferent
    and efferent synapses appear to be present, but in this case the efferent synapse
    probably exerts its effects on the calyx rather than directly on the hair cell.
    Type II vestibular hair cells, an example of which is also shown in Fig. 3.10b
    (HC II), are similar to the typical auditory hair cell, with both afferent and
    efferent synapses terminating at the base of the cell itself.'
