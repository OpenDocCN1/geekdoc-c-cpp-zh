    THE TRANSMISSION PROCESS


    # ## A. INTRODUCTION


    Now that we have discussed the ionic basis of the resting potential and the transduction
    processes that initiate neural activity, we can turn our attention to the transmission
    of information from one point to another in the nervous system. The activation
    of a receptor cell would be without biological value if the information pattern
    generated by the energy transduction were not transmitted to some remote destination.
    The transduced information must be decoded or integrated with information arriving
    over other transmission lines, if the organism is to respond meaningfully.


    There are two ways in which information can be transmitted by individual neurons:
    “spikes” (propagated, nondecrementing, “all-or-none” signals), and more localized,
    graded, summatable potentials.


    The spike action potential, with its special characteristics, is the mechanism
    excellence for the transmission of neural information over long distances in the
    nervous system. Its particular utility lies in the fact that it is not reduced
    in amplitude or shape as it progresses from one place to another. Graded potentials,
    on the other hand, rapidly diminish in amplitude and change in waveform the further
    a measurement is made from their original source. This diminution is due to membrane
    resistance and capacitance. At best, graded potentials can be detected at distances
    no greater than a millimeter or two from their points of origin.


    The reason for this difference in the action of the two potentials is simple to
    describe superbly, but difficult to explain in detail. On a very qualita'
  merge: -1
  pgno: 164
- img_proc: true
