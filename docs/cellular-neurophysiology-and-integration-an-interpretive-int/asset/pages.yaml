    # 2. The Reflex


    Inhibition, it should be appreciated by now, is a necessity for the success-ful
    operation of a neuronal net at any level of integration, but nowhere is this need
    as clear-cut as in reflexive actions. Reflexes are defined as the more or less
    automatic, rapid motor responses of an effector to some stimulus. In vertebrates
    the locus of reflexive action has classically been considered to be the spinal
    cord. In invertebrates a reflexive analysis of behavior may be equivalent to a
    full statement of the animals'' repertoire, and it may indeed be that the dichotomy
    of reflex and central integration perishes at that level of the animal kingdom.


    # 3. Rhythmic Activity


    Inhibitory and reflexive mechanisms give rise to a number of other, more complex
    response processes as they occur in concert. One of the inter-esting derived processes
    is the elicitation of rhythmic or cyclic activity, a network process frequently
    observed at many different levels of behavior. Examples of rhythmic behavior are
    common throughout the animal king-dom. Some single-cell animals pulsate in their
    entirety or rhythmically wave flagella in their environments. The rhythmic action
    of human locomotion or the locust wing (Wilson, 1967) can also be seen to depend
    on a combi-nation of reflexive and inhibitory interactions, even though the basic
    rhythm is controlled by effector signals from the central nervous system.


    # 4. Cellular Learning and Neuronal Plasticity


    The literature concerned with human learning at the molar level is so abundant
    that it is often taken for granted that the ability to learn is a characteristic
    common to all living organisms. Over the last few decades researchers have studied
    learning in many animals far down the phyloge-netic tree. Paramecia, Planaria,
    Aplysia, cockroaches with and without heads, and many other invertebrates, as
    well as goldfish, rats and a host of other mammals have been the subjects of psychological
    research. In recent years, however, some investigators have raised the question
    of whether or not the concept of learning, seemingly so highly developed in vertebrates,
    is actually so common in invertebrates. Many studies of learn-ing in lower animals
    have been highly equivocal, and there is considerable controversy over whether
    or not “learning” in lower animals is the same type phenomena that occurs in higher
