  md: '# 154 7. THE TRANSMISSION PROCESS


    Two distinct phenomena have been invoked to explain the action of the membrane
    potential during this recovery period. The first involves the time course of sodium
    permeability. We have seen that the supernormal sodium flux begins to be reduced
