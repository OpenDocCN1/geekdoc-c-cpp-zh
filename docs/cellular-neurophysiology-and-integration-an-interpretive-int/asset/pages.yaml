  md: '# B. CHEMICALLY MEDIATED SYNAPTIC TRANSMISSION 193


    several important concepts. Note that even within the microscopic synaptic region—only
    a few hundred angstrom units in width—several different levels or modes of information
    coding can exist. Transmission in the synaptic axon up to the region of the synapse
    takes place by means of the frequency-coded spike action potential discussed earlier.
    Presynaptic tissues convert this pulse-coded information into a graded potential,
    which in some case may not yet completely understood brings about the release
    of the transmitter chemical that serves as a chemical code for the transmitted
    information. The transmitter chemical itself then diffuses in what appears to
    be a purely passive manner (i.e., no active force drives the transmitter molecules)
    across the synaptic cleft. The molecules of transmitter substance are subsequently
    captured by specialized receptor sites on the postsynaptic tissue, whose resting
    potential is altered to produce another graded postsynaptic potential.


    The postsynaptic potential may have either an inhibitory or excitatory effect
    on the postsynaptic neuron. If it is excitatory, it increases the amount of spike
    action potential activity in the presynaptic axon. If it is inhibitory, postsynaptic
    activity is reduced. Now that we have established a general qualitative picture
    of the two kinds of synaptic action, let us consider the chemical process in greater
    detail.


    # B. CHEMICALLY MEDIATED SYNAPTIC TRANSMISSION


    The major puzzle in the chemical synaptic transmission process is: How presynaptic
    graded activity able to evoke postsynaptic membrane depolarization? This section
    will attempt to fill in the details of the currently accepted model of chemical
    transmission that was introduced in the previous section.


    The earliest evidence indicating the presence of some sort of chemical mediation
    of the synaptic transmission process was quite indirect. Investigators working
    the first half of the 20th century encountered a number of different chemicals
    that produced exceptionally strong neural effects. Loewi (1921), for example,
    demonstrated the very strong inhibitory effects of acetylcholine on heart rate.
    Cannon and his colleagues (Cannon & Bacq, 1931) found that epinephrine and some
    of its chemical relatives (specifically norepinephrine) accelerate heart rate.
    In each case the action was produced by a chemical that was normally emitted by
    stimulated portions of the parasympathetic and sympathetic nervous systems, respectively.
    The notion that parts of the nervous system secrete chemicals thus being to seem
    highly plausible.


    On the basis of a number of pieces of evidence it is now agreed by all workers
    studying chemical synapses that the chemical transmitter substances are organized
    in a quantum fashion. That is, many molecules of the chemical transmitter substance
    appear to be clustered in groups or'
