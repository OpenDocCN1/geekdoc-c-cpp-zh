    # E. “LEARNING” IN SIMPLE NEURONAL NET


    For many years, classical conditioning had been considered to be the prototype
    of higher forms of learning in man and other animals. Though it is no longer fashionable
    to assume that all learning is nothing than a concatenation of conditioned responses,
    classical conditioning is still used by many workers as a model to elaborate some
