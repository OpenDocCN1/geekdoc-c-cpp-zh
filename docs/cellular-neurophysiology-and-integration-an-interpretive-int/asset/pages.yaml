  md: '# C. ANATOMY OF TRANSMISSION NEURONS 47


    The first point to consider when defining the parts of transmission neurons is
    a functional one. Activation of such a neuron must be initiated at a certain point,
    and information about this activation must be conveyed to some other point if
    the neuron is to perform its information-transmission function adequately. This
    set of functional concepts—initiation at an origin, transmission to a distant
    destination, and utilization of the transmitted information—defines a directionality
    for the neuron''s main action.


    The concept of the functional directionality of a neuron is important to the following
    discussion because it is used in the definition of a key terms in neural anatomy.
    Transmission neurons are connected in neural nets so that they will conduct normally
    in only one direction.* Transmission in the usual direction is called orthodromic
    conduction, while activity moving in the opposite direction, which (though abnormal)
    can be produced by experimental procedures, is referred to as antidromic conduction.


    It has generally been assumed that antidromic and orthodromic spike potentials
    are equal in all regards, but recent evidence (Mulloney & Silverston, 1972) indicates
    that this may not be the case, least in the stomogastric ganglion of the spiny
    lobster. Not only did these workers discover that the shape of the spikes in a
    neuron differed, depending on whether they were spontaneously triggered orthodromic
    responses or the result of antidromic invasion of the cell, but they also observed
    that some of the normal effects of the orthodromic spikes did not occur when they
    were produced by antidromic stimulation of other neurons. The particular cell
    they were studying had previously been shown to inhibit the activity of four other
    cells when it was triggered by an orthodromic spike. However, antidromic elicitation
    of the response of this cell resulted in a spike that did not produce this inhibition.


    This study is of considerable importance because, as Mulloney and Overton note,
    it destroys the premise that antidromic and orthodromic responses are equivalent
    in all respects other than direction of travel. It raises the possibility that
    the absence of observed interaction between two neurons when one is conducting
    antidromically is equivocal. The lack of interaction may be interpreted in either
    of two ways: in terms of the ineffectiveness antidromic spikes, or completely
    to the contrary, as reflecting a true absence of interaction between the two cells.
    A classic and often-used laboratory test of interneuronal interaction is thus
    opened to question. Perhaps even more important, the nonequivalence of spikes
    traveling in different directions suggests the presence of some differential


