  md: '# A BRIEF HISTORY OF CELLULAR NEUROPHYSIOLOGY


    In all the sciences there is a critical dependence between the data obtained and
    the theories developed on the one hand, and the available technological instrumentation
    on the other. In neurophysiology this is particularly true, because the difference
    between the scale of common observation and the scale of events at which neurons
    operate is so disparate. The human observer must deal with inches and centimeters
    unless he has some sort of magnifier, and with seconds unless he has some device
    to convert brief occurrences into longer-lasting records. Neurons, however, are
    microscopic cells, and many of the critical components are submicroscopic. Micrometers
    and nanometers are the appropriate units for measurement at this end of the scale.
    Similarly, the salient events occur not over periods of seconds, but in milliseconds;
    yet even these brief events have temporal subcomponents that are essential to
    their understanding. The voltages and the amounts of chemical involved are likewise
    vanishing small. A few millvolts or a few molecules may represent the critical
    scales of electrical or chemical events at the neural level.


    It is easy to understand, however, how the history of neurophysiology was influenced,
    and powerful constraints lifted, by the technological developments that allowed
    this disparity in scale to be surmounted. The nature of the individual microscopic
    neuron could not be appreciated until the microscope was invented. The electrochemical
    nature of the neuron could not be understood until the nature of electricity and
    the relationship between chemical and electrical events were understood. The rapid
    electrical'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# 10 2. HISTORY OF CELLULAR NEUROPHYSIOLOGY


    events themselves could not be analyzed in any detail until electronic amplification
    and display instrumentation became available in the twentieth century. A cursory
    examination of scientific history shows that the major conceptual and philosophical
    questions were being asked about the nervous system long before the answers could
    be acquired. But, as in other sciences, satisfactory answers to neurophysiological
    puzzles could be obtained until data based on direct observation were forthcoming.
    To achieve a direct answer with direct observation required a technology of magnification
    in both time and space. This brief neurophysiological history, therefore, necessarily
    emphasizes the development of those instruments that were crucial to the development
    of direct, more refined observational techniques.


    A full review of the enormous scope of neurophysiological history, even one limited
    mainly to technological influences, is not possible here. The interested reader
    is directed especially to the first chapter in the monumental Handbook of Physiology
    (Brazier, 1959), or to Fulton and Wilson''s (1996) translations of some of the
    classic biological source documents, for a more complete treatment.


    In the brief history that follows, a single theme is stressed: the origin of the
    concept that neural function has an electrical basis. However, we should note
    that, from one point of view, this theme is a misstatement of the physical actuality.
    As we learn about the nervous system, it becomes increasingly clear that the electrical
    signals that are so easily recorded with even the simplest of currently available
    instruments are only reflections of processes that should more properly be considered
    to be fundamentally clear. While our technology allows, in fact, forces, us to
    stress electrical terminology, may of the electrical signs are, to a considerable
    degree, only concomitant ionic migrations. Unfortunately, there is not yet an
    equivalent technology for direct measurement of ionic ebb and flow without reference
    to the associated electrical signals. Perhaps some day there will be chemically
    sensitive electrodes that have the precision and delicacy of electrically sensitive
    ones; until then, we are bound by this technological constraint to observe secondly
    electrical signals in situations where ion behavior may be more fundamental. This
    is a modern caveat; let us see how the idea that neurons are electrochemical in
    nature developed over the years.


    # A. CLASSIC VIEWS OF NERVOUS ACTION


    The peripheral nerves, the spinal cord, and the brain were known to exist as anatomic
    entities by the early Greek scientist-philosophers. That is about all that needs
    to be said of their view of the nervous system, for ancient deas of mental activity
    dealt with it as a separate, nonincorporate entity and usually associated thought
    processes with other parts of the'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# B. ORIGIN OF THE ELECTRICAL BASIS OF NERVOUS ACTION 11


    body. Our language and culture still reflect the predominance of the view that
    the heart, for example, is more important to intellectual and emotional function
    than the brain.


    Although there was some earlier philosophical speculation that the nerves and
    the brain might be specifically associated with mental activity, it was not until
    Galen''s time (A.D. 130–200) that what we now consider to be scientific ideas
    about the nervous system''s function begin to emerge. Galen, like most theoreticians
    past and present, was influenced by the contemporary technology familiar to him,
    and his models and ideas reflected the technology of his times. In the second
    century A.D. the predominant technologies were hydraulics and mechanics, and it
    was on these foundations that Galen built his theory. Though he accepted the crucial
    notion that the nerves were necessary concomitants of human thought and action,
    Galen assumed that the nerves actually were part of a hydraulic system through
    which fluids, produced by various organs of the body, were conveyed to produce
    muscular movements or perceptions. His notions of a hydraulic system that was
    directly related to behavior predecessors in antiquity, but the details of his
    theory were based largely on his own dissections and observations of the variety
    of fluids that seemed to permeate the body.


    The sheer persistence of hydraulic theories of nervous action was incredible.
    Throughout the dark ages following the decline of Rome. When these problems were
    considered all, Galen''s views went unchallenged, even well into the European
    Renaissance. Harvey''s description in 1628 of the circulatory system, and his
    emphatic confirmation of the notion of closed fluid cycles in the body, reinforced
    these views even more. The notion of a nervous system that operated on the basis
    of fluid transport was strongly supported by both Descartes, that universal mathematical,
    physiological, and philosophical genius, and by the mathematician Borelli (who,
    incidentally, eliminated the notion that nerves carries gases rather than fluids,
    by dissecting nerves under water and showing that no bubbles were released). And
    so this wet view of the nervous system persisted until the end of the eighteenth
    century.


    # B. ORIGIN OF THE IDEA OF THE ELECTRICAL BASIS OF NERVOUS ACTION


    The histories of physiology and physics are extraordinarily intertwined from the
    late eighteenth century on. Discoveries in physiology stimulated findings in physics,
    which in turn provided impetus for new areas of physiological research. The highlight
    of these exciting times occurred in 1791, when Luigi Galvani published his observations
    on a series of experiments carried out on a neuromuscular preparation from the
    frog. Galvani showed'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# 12 2. HISTORY OF CELLULAR NEUROPHYSIOLOGY


    that preparations, consisting only of amputated frog legs and the attendant stumps
    of the severed nerves could be made to respond to electrical stimuli that were
    produced in any number of ways. Electricity was manipulated (if not completely
    understood) well enough by this time that it could be produced from electrostatic
    generators, stored in Leyden jars (the early capacitor), or acquired from lightning
    rods.


    Figure 2.1 shows one of Galvani''s experiments. Clearly the electrical stimulus
    produced by the lightning was the direct antecedent of the observed electrical
    action in the frog legs; and although this did not necessarily establish electrical
    action in the nerves (that discovery would have to wait until the tiny neuronal
    responses could be electronically amplified and displayed), it was a minuscule
    logical step to the assumption that the physical energetics of the neuron were
    the same as the stimulus. In fact we now know the modern view of transduction
    is based upon the premise that the physical energy of the stimulus is converted
    to other forms of physical energy in the nervous system. Indeed, the variety of
    stimulus energies to which the receptors are normally sensitive should have warned
    against such deduction.


    Nevertheless, the twitch of Galvani''s frog legs signaled an end to hydraulic
    theories of nervous action and a beginning to the electrical theories, versions
    of which have persisted until our time. It is now understood that the electricity
    of the nervous system does not function in the same way


