  md: '# B. COMPOUND RESPONSES 179


    If the notion of congruence is a reasonable one, it should also be expected that
    the sensory system into which the electrodes have been placed is driven by an
    appropriate stimulus, the correlation between spike count and the amplitude of
    the microelectroencephalogram would increase. This is exactly the result obtained
    for those cells in the visual cortex of the cat which respond to light flashes.
    (The visual cortex does include other cells that are not responsive to light,
    and for these cells the congruence was seen to decrease).


    In summary, Fox and Norman presented a valuable measure for the estimation of
    the “coordination” or congruence of a group of cortical cells. This measure has
    a number of important implications. First, the high degree of correlation with
    single-cell activity tells us that the microelectroencephalogram, if it is not
    a direct product of the spikes themselves, is certainly derived from processes
    that also underlie spike generation. The two are essentially analogs of each other,
    therefore, and may be considered to be least informationally equivalent. Second,
    the microelectroencephalogram gives us a measure that is a cumulative index of
    the many cells in the recording region of the electrode, rather than a measure
    of the activity of a single cell. Such a measure may be the only plausible way
    of investigating the action of ensembles of neurons—and ensembles may be the “name
    of the game.” Third, congruence is a direct estimate of the degree to which the
    activity of a single cell represents the mean biological activity of all the cells
    in the region contributing to the slow potential. Congruence should, therefore,
    prove in future to be an important measure of brain activity and contribute greatly
    to an understanding of how it is the activity of single cells are pooled into
    compound responses.


    One final point with regard to the possible origins of the compound potentials
    that can be recorded from the brain: As we learn more about glial cells, the supporting
    units found between neurons, it becomes clear that they, too, produce bioelectric
    potentials. Some of these voltages may be produced under the indirect influence
    of the neurons that are embedded among the glial cells. In some cases (e.g., the
    Muller cells in the retina), the time course of glial and neuronal cells’ response
    may be nearly the same. Thus, it is possible that, even though they are not involved
    in meaningful information processing, glial responses may be correlated with stimuli
    or psychological processes. It has been further suggested that the direct cause
    of glial depolarization is the increased potassium concentration in the extracellular
    space as a result of neuronal activity. This possibility has been considered in
    detail by Orkand, Nichols, and Kuffer (1966) and in an extensive review by Kuffer
    and Nichols (1966). The fact that such signals do occur raises, at least, the
    possibility that they may contribute to the production of compound action potentials.'
