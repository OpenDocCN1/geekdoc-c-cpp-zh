    lute or in a relative sense (the whale''s brain is considerably larger than man''s;
    the tree shrew has a higher brain-to-body-weight ratio than man), the unique attributes
    of the human brain have culminated in a thinking, history-keeping, and creative
    animal that has no known analog.


    To understand fully and appreciate the nervous system we should first note that
    it is widely dispersed throughout the body. The nervous system is seen to be composed
    of a central core consisting of the brain, the spinal cord, and (because of their
    embryological origins) the retinae of the eyes, as well as a peripheral network
    of sensory and motor nerves. The central nervous system, although it serve communication
    functions (many of the tracts that lie within it are simply links from one part
