    book Molecular Basis of Odor.


    If a key-and-lock notion cannot be used to explain different sensory effects of
    molecules of varying shapes, the possibility must be raised that shape alone is
    an ephenomenon merely reflecting some more fundamental characteristic of the interactive
    forces that hold molecules together; and that it is more fundamental property,
    rather than shape, that must ultimately explain receptor specificity.


    In summary, it seems likely that the primary sensory action in olfaction is a
    direct chemical interaction of odorant molecules with more or less specific receptor
    sites on the surface of the olfactory epithelium. The detailed nature of this
    chemical reaction is, for all practical purposes, still unknown. With the rejection
    of the key-and-lock aspects of Amoore''s theories, the single compelling fact
    remaining is that the shapes of the molecules are highly correlated with psychophysical
    discriminations. Future research will have to unravel how this shape difference
    is discriminated by olfactory receptors.'
