  md: '# F. TRANSDUCTION IN THE OLFACTORY RECEPTOR 133


    # 2. Production of the Olfactory Generator Potential


    Since the nature of the olfactory primary sensory action is unknown, the mechanism
    of the olfactory generator potential is equally obscure. We can only speculate
    that in some chemical action leads to a change in receptor cell membrane permeability
    in the olfactory epithelium. This permeability change allows the ionic equilibrium
    to shift in such a way that a graded potential is produced, which initiates spike
    action potentials in the tiny axons of the olfactory nerve.


    This simple speculative statement, however, is complicated by the fact that there
    is a great deal of controversy over whether or not the olfactory generator potential
    has actually been detected. Slow potentials are known to be generated at the olfactory
    epithelium by odorless stimulants. Nevertheless, it is not yet clear whether these
    slow potentials are actually the true generator potentials. Ottuson (1956) made
    extensive studies of a graded negative potential, which occurs with moderate latency
    and a very slow time course after the application of a stimulus. Figure 6.13a
    shows a typical negative electro-olfogram recorded with the apparatus shown in
    the inset. This signal is now referred to as the “Ottuson potential,” in honor
    of its discoverer.


    However, a positive potential of similar temporal characteristics has been observed
    under some conditions. Takagi, Shibuya, Higashino, and Arai (1960) observed that
    the polarity of the graded Ottuson potential is revealed with certain stimulants
    (see Fig. 6.13b). In addition, Takagi and Shibuya (1959) showed that there is
    also a negative off-potential associated with the typical negative Ottuson or
    the anomalous positive offpotential, as shown in Figs. 6.13b and c. Figure 6.13d
    shows the associated spike activity in the olfactory bulb and its relation to
    some of these graded potentials.


    A number of discrepancies prevent confirmation of any of these graded potentials
    as generator potentials. Takagi (1967) spells out some of the discrepancies in
    an interesting review of the problem. One of the most damaging is a report that
    shows the Ottuson potential could be eliminated (by wiping off the mucous usually
    found on the olfactory epithelium) without any diminution of olfactory bulb spike
    action potentials (Shibuya, 1964). Takagi also suggests that at least some of
    the system of graded potentials may be no more than secretory potentials produced
    by the tentacular cells of the olfactory epithelium when stimulating chemicals
    are present. If this were so, it would be a somewhat disappointing state of affairs,
    because no candidate for the generator potential role would then be left.


    Clearly, there is much more to be learned about the transductive process of olfaction,
    both with regard to the generator potential and its origin,'
