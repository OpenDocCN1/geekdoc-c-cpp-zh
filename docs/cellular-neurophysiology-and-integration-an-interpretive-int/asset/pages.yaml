    (a) Refractory periods, excitability, and the recovery cycle. If an axon is stimulated
    within a few milliseconds after a response, it will be incapable of responding
    to the same extent it originally did. If the second follows the first within a
    millisecond or so, there will usually be no response at all, no matter how strong
    the stimulus. This period of time is referred to as the absolute refractory phase
    of the neuronal action potential. For a few milliseconds after the absolute refractory
    period the neuron requires a much larger-than-normal stimulus to be excited; this
    period is called the relative refractory phase. During the relative refractory
    phase the response amplitude of the individual spike may be altered, but the main
    effect seems to be an elevation of the threshold for evoking a response. In some
    preparations a brief, superexcitable period following a stimulus may also follow
    the absolute refractory phase.


    The time course of the periods of altered excitability following a stimulus may
    be established by use of the two-pulse experimental paradigm. Two pulses separated
    by a variable interval are applied to the neuron. Some measure of the responsiveness
    of the neuron or nerve to the second of two stimulus pulses is then plotted against
    values of the interstimulus interval. A time plot of the recovery function is
    then produced, which describes important properties of the neural membrane mechanism.
    One of the most important is that the refractory periods define the maximum possible
