    # D. NETWORK PROCESSES


    Now that we have considered some of the cellular mechanisms that might underlie
    integrative behavior at the level of the neuron, it is appropriate to discuss
    relevant network processes that might contribute to higher level integration.
    The phrase "network processes" refers to the functions of groups of neurons that
    are the result of the cellular mechanisms just described. These network processes
    are also not equatable with molar responses, but they do represent functions of
    a level of complexity that begin to exhibit comparable behavior.'
