    # 2. The Origin of Compound Action Potentials of the Brain


    An important general question that arises in dealing with compound action potentials
    concerns the relation of this waveform to the individual membrane action potentials.
    For each compound response we would like to know as much as possible about the
    contributing neuronal population, and in what way their individual responses were
    summed. The problem of the peripheral nerve compound action potential is relatively
    straightforward. The calculated sums of individual spike action potentials have
    proven to be adequate in predicting the shape of the compound response. However,
    for such compound action potentials as the evoked brain potential and the electroencephalogram,
    there is a great deal of controversy among different authorities to the origin
    of the potential.


    The major controversial issue concerning evoked brain potentials is in regard
    to their cellular origins. Purpura (1959) comprehensively reviewed the theories
    of the genesis of cortical potentials and stated that the early models stressing
    the contribution of spike action potentials, which were invoked to explain slow
    brain potentials, could no longer be accepted, principally because spike activity
    could not be associated experimentally with slow potentials. These models, he
    further stated, have been replaced by newer ideas where slow dendritic and synaptic
    potentials are hypothesized as the basic subunits that are summed to produce the
    slow cortical potentials.


    Amassian, Waller, and Macy (1964) expressed this same point of view in one of
    the first reports on sensory evoked response in man. For a number of reasons,
    including the apparent ability of experiments associate associate activity and
    mathematical considerations of the recording technique, they also concluded that
    spike action potentials do not contribute directly to the compound evoked brain
    potential recorded from the surface of the head. They also stated that the slow
    potentials already known to exist, such as the postsynaptic and the various postspike-after-potentials,
    are more likely added together to produce the waveform.


    Much of their evidence supporting that viewpoint rest on the analysis of a small
    sample of neuronal action potentials. However, modern computing equipment that
    allows much larger sample sizes to be collected'
