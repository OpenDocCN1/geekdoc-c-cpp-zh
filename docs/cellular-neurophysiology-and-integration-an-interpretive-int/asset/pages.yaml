    The second major difficulty encountered with electrical stimuli revolves around
    the fact that the resistive and capacitive properties of the stimulated tissue
    can so distort the stimulus that a very constant voltage will produce a very non-constant
    current. This effect is mainly due to the charging of the capacitive components
    of the tissue in such a way that the applied voltage waveform is differentiated.
    Only the rise and fall (high-frequency components) of the waveform are passed
    when a current is so differentiated. The distortion can result in an actual stimulus
    current waveform like that shown in Fig. 4.11, even though the applied voltage
    stimulus is rectangular shaped.


    The manner in which this difficulty is overcome also depends upon special electronic
    circuitry. Circuits can be designed so they produce constant current stimuli,
    rather than constant voltage outputs. In a constant current simulator, the voltage
    applied to the tissue is not constant, but varies in the manner required to maintain
    a constant current through the tissue. Since most investigators believe that the
    applied current is a more satisfactory measure of stimulus amplitude than the
    voltage, this is a desirable feature. In any event, a constant current can be
    quantified more precisely by a variable voltage.


    We now have considered a number of important technical procedures and instruments
