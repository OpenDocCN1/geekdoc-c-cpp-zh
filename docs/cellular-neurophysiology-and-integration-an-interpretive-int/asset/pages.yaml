    for the conduction of signals over long distances along the axons. It is characterized
    by an all-or-none responsiveness and a typical spike-like shape during its time
    course. The spike shape, of course, is due to the fact that the amplitude of the
    spike is large compared to the other types of action potentials and the duration
    is brief, typically around 5 msec. Chapter 7 discusses the spike action potential.


