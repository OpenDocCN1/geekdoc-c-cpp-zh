    The notion of directionality has also been historically used to define the two
    major types of transmission fibers found on a single neuron. The region that carries
    information from a synapse toward the cell body (also called the soma or perikaryon)
    is referred to as the *dendrite*. The *axon*, on the other hand, was conventionally
    considered the output element of the neuron, carrying information away from the
    dendritic region. Axons are usually single fibers of greater diameter than even
    the largest of the dendrites. In some cells the axon may extend outward on both
    sides of the cell body; such cells are said to be bipolar. In addition, axons
    are often, unlike dendrites, covered with a fatty sheath of myelin. Although dendritic
    structures are not usually myelinated, in some cases even this counter-generalization
    fails to hold. For example, Pinching (1971) reports electronmicrographic evidence
    of the myelination of the mitral cells of the olfactory bulb. Figure 3.16 shows
    the very fine dendritic myelination he observed at a magnification of 45,000×.


    Bodian (1962, 1967) has added considerable precision to these vague definitions,
    while maintaining the importance of the criterion of directionality. For example,
    he defines the dendrite as that part of the neuron that is uniquely capable of
    receiving information from presynaptic regions. This definition, of course, is
