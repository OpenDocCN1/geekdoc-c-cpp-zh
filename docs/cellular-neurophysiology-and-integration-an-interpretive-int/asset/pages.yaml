  md: '# 7. Coding and Decoding


    Finally, in this catalog of network processes, we come to a very general topic
    that transcends the specific functions of a network, which originates and utilizes
    the properties of the network for its operation. We, thus, introduce the topic
    of coding—the means by which messages communicated through the nervous system
    are represented at any particular point. A code may be defined as a set of dimensions
    and the rules for using these dimensions in the representation of a message. The
    topic is extraordinarily broad and is the subject of an extensive discussion by
    the'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# D. NETWORK PROCESSES 235


    ![](img/61aae0ecef3f04214272324c376b8b4a_258_0.png)


    FIG. 10.11. The gamma motor neuron system, illustrating a feedback loop that involves
    direct neural links as well as sensory-motor mediated nonneural links. (From Thompson,
    1967.)


    author elsewhere (Uttal, 1973). Here we shall deal only with some of the major
    issues concerning neural coding.


    The representation of information patterns or messages by patterns of neural signals
    in the nervous system is a multifaceted process. Conventional neurophysiological
    texts usually describe coding in terms of the relationship between the intensity
    of a stimulus and the frequency of the induced nerve action potential patterns.
    However, each dimension of every message in the nervous system must be represented
    by some equivalent kind of activity in the nervous system. Thus, for example,
    visual stimulus intensity, might be represented by spike action potential frequency
    at some point in the nervous system. But color (the stimulus quality) and the
    spatial and temporal aspects of the stimulus must also be represented. Not only
    are there many dimensions to a message, or codes that may be used for the representation
    process. These possible neural dimensions or candidate codes, as they are known,
    include not only the frequency of the spike action potential, but also the dimensions
    of the graded potential, such as amplitude and temporal pattern. Such derived
    statistical measures as the standard deviation of the interspike interval may
    also be a'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'separate code, distinct from even such a closely related dimension as the mean
    frequency of the same signal.


    One of the most important general concepts of modern neural coding theory is that
    it is probable that a single dimension of a message might be represented by different
    encoding dimensions at different levels of the nervous pathway. Some aspect of
    a message might be represented by spike action potential frequency in axons that
    can propagate spikes; but in another portion of the same cell (such as the pre-
    or postsynaptic membrane) that cannot propagate spikes, this same message dimension
    may be represented by the amplitude of a graded potential. Thus, there is no unique
    code; there are only codes at given levels. A message may be encoded and reencoded
    at many sequential points along the afferent or efferent pathways.


    The manner in which a transmitted code is detected and selectively responded by
    a receiver neuron is closely related to the properties of the receiver neuron
    and its interconnections. Thus, the decoding of nervous messages from one neural
    code into another is another aspect of the integrative action of neural nets.


    This brief of cellular mechanisms and network processes has been presented in
    a relatively abstract manner. We have only briefly mentioned some of the experiments
    that make these notions concrete and have passed over very basic concepts in a
    way that must certainly seem cryptic to the reader. There are two reasons for
    this rapid scan. One is that the complexity of the problem is awesome. The function
    of nerve nets in their role as integrative mechanisms is so involved that it is
    obviously impossible if all of the details were thrust upon the reader at once.
    Second, the enormous abundance of published material dealing with those aspects
    of integrative function that are understood obtained with a wide variety of biological
    preparations. Not only are the results extremely variable, but the techniques
    and preparations that have been used would have to be explained over and over
    again for each new experiment to make this material fully intelligible.


    One method of making such complex material intelligible is to pick one model preparation,
    in this case the mollusk A Aplysia; define its relatively simple neuroanatomy
    and the appropriate experimental techniques precisely; and then present examples
    from the research carried out only on this animal to illustrate more concretely
    the general network processes we have described. In the following chapter we proceed
    to do just that.'
