  md: '# A SUMMARY OF GENERAL PRINCIPLES 273


    24. All deviations from the resting potential are the direct result of ion concentration
    shifts caused by changes in the permeability of the membrane.


    25. In general, all receptor processes also involve an alteration in the receptor
    membrane permeability, so that the cell''s resting potential is changed. The resulting
    receptor or generator graded potential is a necessary precursor of subsequent
    propagated spike activity.


    26. Each receptor possesses some sort of specific trigger action, or primary sensory
    action, which leads directly to a change in the membrane permeability and thence
    to the generator or receptor potential.


    27. Neural transmission may occur by either of two processes. The first is a passive,
    decremental spread of electrical signals by ionic currents. This process is suitable
    only for transmission over very short distances. The second is the propagation
    of regenerative spike action potentials. This is a nondecremental process, suitable
    for communication over very long distances.


    28. Spike action potentials are produced by a sequential, but independent, breakdown
    in the membrane''s permeability, first to sodium and then, a millisecond or so
    later, to potassium. The increase in sodium flow, according to the Hodgkin-Huxley
    theory, accounts for the leading edge of the spike, while the increase in potassium
    flow accounts for the rapid recovery of the spike back to the resting potential
    level.


    29. Long-term recovery of ion concentrations to resting potential levels, however,
    appears to be dependent upon an extended period of sodium and potassium pumping.


    30. The triggering of the breakdown in membrane permeability that leads to a spike
    is a threshold phenomenon. Once a local depolarization has achieved that threshold,
    the remainder of the process is spontaneous and requires no further introduction
    of extracellular energy. Since the process produces larger electropotentials than
    needed to trigger it, the spike is able to propagate to distant locations without
    decrement.


    31. The amplitude of a spike is independent of the stimulus; it is a function
    only of the state of the neuron. This fact is known as the all-or-none law.


    32. The speed of spike propagation is a function of the size and degree of myelination
    of the neuron as well as its general state.


    33. Compound poled potentials reflect the sum of the responses of many neurons.
    If the number of responses is few, then the individual spikes can be seen in a
    pooled record. If not, the continuous waveform, characteristic of a compound action
    potential, will be produced. The duration of the compound response depends upon
    the degree of synchronization and the nature of the contributing action potentials.'
  merge: -1
  pgno: 296
- img_proc: true
  md: '34. A mathematical proof of Cox and Smith has shown that pooled spike action
    potentials cannot be separated solely on the basis of the inter-vals between successive
    spikes. Any attempt to use a computer analyzer to achieve this goal would be fruitless.
    Some success is possible in special cases, if amplitude information is included
    in the analytic criteria.


    35. Compound responses often can be detected by computer averaging techniques,
    even though those responses are considerably smaller than the electrical noise
    in which they are embedded.


    36. Compound brain potentials can be shown to be related to the spike responses
    of individual neurons. Whether this is due to the fact that the spikes electrically
    summate with each other to form the compound poten-ial, or whether both are derived
    functions of some other, more fundament-al process, is not yet known.


    37. Hypersynchronization of peripheral nerve spike action potentials into a compound
    action potential means of "nonphysiological" electrical pulse stimulation introduces
    no artifacts that could distort comprehension of the coding mechanisms of the
    individual axons.


    38. Both electrical and chemical means of synaptic transmission are known. The
    two types of synapse differ in the spacing between the involved neurons, the rapidity
    of synaptic transmission, the degree of electrical coupling, and the relative
    sizes of the pre- and postsynaptic regions.


    39. Chemically mediated synapses work by diffusion of transmitter molecules secreted
    by the presynaptic region to receptor sites on the post-synaptic neuron.


    40. A single neuron does not produce more than a single kind of trans-mitter substance.
    This fact is known as Dale''s principle.


    41. A single transmitter substance may produce either inhibitory or ex-citatory
    responses, depending upon the nature of the postsynaptic receptor sites.


    42. The transmitter substance appears to be bundled into packets of several hundred
    molecules each and produces quantal miniature postsynic responses associated with
    the arrival of the contents of individual packets at the receptor sites. These
    miniature quantal responses, however, may sum with each other to produce postsynaptic
    potentials of virtually continuously graded amplitude.


    43. Excitatory postsynaptic responses appear to be always depolariza-tions, but
    inhibitory potentials may be hyper- or depolarizing, de-pending on the level of
    the resting potential. In the vertebrate retina, how-ever, excitatory potentials
    are hyperpolarizing. Therefore, no simple relationship exists between excitatory
    and inhibitory responses, on the one hand, and hyperpolarizing or depolarizing
    membrane potentials, on the other.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# A SUMMARY OF GENERAL PRINCIPLES 275


    44. Inhibitory postsynaptic responses generally seem to involve increase in the
    membrane’s permeability to potassium and chloride ions. Excitatory postsynaptic
    responses seem to involve changes in the permeability of the membrane to sodium
    and potassium ions, changes which are similar to those occurring in other membrane
    actions. However, there are notable differences between action responses in synapses
    and axons.


    45. Neural integration, occurring primarily at synaptic junctions, represents
    what is perhaps the most significant neurobiological process. It is the basis
    of all adaptive behavior and, thus, of all cognitive functions. Neural integration
    is defined as the cumulative effect of multiple inputs such that the conducted
    information pattern is modified in an adaptive manner.


    46. Integration is a property of most neurons, including receptors and motor units
    that receive multiple inputs, as well as interneurons, the latter being defined
    as "neurons that connect neurons to neurons."


    47. A number of processes that tend to modulate the flow of information occur
    within the neuron. The major integrative factors modulating information flow,
    however, occur at the synapses. Some of these processes mimic some attributes
    of learning at the molar level.


    49. Because of the complexity of mammalian nerve nets and the small size of the
    constituent neurons, model preparations (usually invertebrate) have been used
    to triplicate the integrative action of nervous tissue. Among the many model preparations,
    the Aplysia, an Opisthobranchian mollusk, has been especially useful because of
    the small number and large size of the neurons comprising its simple ganglia.


    50. A number of cellular processes that are similar to the various aspects of
    molar behavior have been observed in model preparations. Whether these processes
    are structural homologues or mere process analogues of behavior is not certain.
    Nevertheless, these processes do serve, at least, as conceptual models of a nervous
    function that might underlie the organism’s behavior. At best, they represent
    insights into the cellular basis of human experience that are of utmost importance.


    This last statement in the summary is fraught with import. The frontier of contemporary
    psychobiological research lies exactly in this area. Have'
  merge: -1
  pgno: 298
- img_proc: true
  md: 'we finally made the breakthrough so long awaited, and are we now really beginning
    to unlock the cellular basis of human experience? Or, on the other hand, have
    we merely set up another situation in an analogous process is assumed to explain
    more than it really can?


    If there is a final comment on which it is most appropriate to end this book,
    it would be the caveat that this great philosophical issue—the relation between
    the microscopic responses of the neuron and the macroscopic responses of the organism—is
    yet unresolved. Though a considerable amount of technical information has been
    gained in regard to the details of neural function, we still must face the grandeur
    issue of what it all means. The search for a solution to this problem may well
    represent the major intellectual challenge of the next century.'
