  md: '# D. MOTOR CONTROL AND REFLEXES 251


    # D. MOTOR CONTROL AND REFLEXES


    Now that there is some familiarity with the details of at least part of the neural
    network in this extraordinary preparation, it is timely to consider how these
    networks might act to control the behavior of the Aplysia. Unfortunately, promising
    though such an analytic approach is, only a very few reports are available in
    which the specific details of the neural anatomy have been compared to the behavior
    of the total organism. Although this type of research is at the current frontier
    of psychobiological interest, specific studies, in which the behavior of an organism
    is linked to the specific properties of neurons, are, as yet, few and far between.
    Nevertheless, several reports have been produced in which the anatomic simplicity
    of Aplysia (and a closely related animal, the Triton) have been used to make this
    comparison.


    Before discussing the details of these important experimental studies it should
    be noted that no analogous studies have ever been done on the vertebrate nervous
    system. Yet, too little is known about the identity of specific vertebrate neurons
    and their interconnections to allow similar studies to be performed. Vertebr neurons
    are so small that they can be detected only blindly, and it is highly unlikely
    that any single cell has ever been impaled, even fortuitously, more than once,
    much less repeatedly targeted in a premiated manner.


    The difference in size and number between vertebrate and invertebrate neuronal
    systems may mean that they possess entirely different modes of organization and
    operation. The small number of neurons involved and the almost automatic control
    of behavior in the central nervous system of invertebrates may reflect an organization
    more comparable to the reflexes of the spinal cord than to the action of the cerebral
    hemispheres of a primate. Aplysia and other invertebrates may be said to lack
    real "brains," the term "brain" being used here only as an analogy for the central,
    large ganglion.


    The reader is cautioned not to assume that all the behavioral processes observed
    in the Aplysia can be directly extended to analogous human cognition. The reflexive
    operation in the Aplysia may, in fact, be only slightly relevant to the way humans
    think. Self-awareness may be an emergent property that arises only when the number
    of neurons in the nervous system is much closer to 10^¹⁰ than the 10^⁵ of rudimentary
    nervous system. Nevertheless, in a model preparation such as Aplysia has been
    possible even before begin making comparisons between nerve nets and behavior;
    and thus it is to these animals that we know for information about the interaction
    of known nets of neurons.


    Feeding into the abdominal ganglion of the Aplysia is a nerve known as the ctenidio-genital
    nerve. This nerve conveys signals to the gills, the'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 252 11. APLYSIA: ANATOMY AND PHYSIOLOGY OF A MODEL PREPARATION


    gonads, and other structures of the reproductive tract. Peretz (1969) has carried
    out two kinds of experiments to determine the involvement of the abdominal ganglion
    neurons in the motor control of the gill. His first experiment consisted of a
    conventional electrophysiological recording situation, in which spike action potentials
    were picked off specifically identified neurons during spontaneous gill movements.
    In this way, Peretz was able to determine which cells were involved with gill
    motion as sensors. Armed with this information, he was able to perform a more
    complex experiment, using electrical stimulation with intracellular microelectrodes
    to define which of the cells were specifically involved in controlling motor responses.


    Comparisons of electrophysiological responses to stimulation and direct behavioral
    observation of gill movements led Peretz to the conclusion that four different
    types of neurons are involved in this motor system. The first type is capable
    of eliciting gill responses, as well as responding during spontaneous gill movements.
    The second type was able to elicit gill movements when intracellular recordings
    were made it-seen to respond with a diminution in the rate of activity during
    spontaneous gill movements. The third type was inhibited in the same way during
    spontaneous gill movements, but could not evoke any gill movement; the fourth
    type increased the frequency of spike firing during gill movements, but could
    not evoke gill movement.


    At the same time, Kupfermann and Kandel (1966), working with a similar *Aplysia*
    preparation, reported the involvement of other neurons in controlling movements,
    not only of the gill, but also of siphon and mantle shelf. In its normal environment,
    the *Aplysia* exhibits reflex withdrawal of it whenever it is touched—a useful
    response. With the information known about the abdominal ganglion, Kupfermann
    and Kandel were able not only to demonstrate the details of the neural network
    underlying this reflexive withdrawal but also to show certain details of the operation
    of the net that reflect a new important mechanism: This simple net can operate
    on the basis of either a peripheral reflex or on the basis of signals controlled
    and initiated from the abdominal ganglion. The alteration between these two modes
    of operation also appears to be centrally controlled. Figure 11.8 is an up-to-date
    schematic summary of their work from Kandel (1973). It will be used as a vehicle
    for the discussion to follow.


    According to Kupfermann and Kandel, this sensory motor system may be composed
    of the siphon, the mantle shelf, and the gill, with their respective sensors,
    the afferent neurons and a group of 5 motor neurons that are driven by the sensors
    either directly or through one or two interposed interneurons. The important discovery
    made by Kupfermann and Kandel was that there are, indeed, two possible routes
    for afferent information to take on its way to the motor cells. These routes'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# D. MOTOR CONTROL AND REFLEXES 253


    mediate two behavioral modes. If the animal is stimulated externally in what may
    be a the threatening manner, it is desirable for it to respond rapidly and reflexively
    by immediate withdrawal. In this case, the connection to all five of the motor
    neurons must be a simple excitatory one, so that the muscular actions necessary
    for withdrawal can be elicited instantaneously.


    In other instances, these same muscular actions are not required as parts of a
    massive withdrawal reflex, but as a more specific, coordinated response. If the
    five motor neurons were activated by purely excitatory connections under all conditions,
    self-stimulation of the receptors might be expected to lead to a continued (tonic)
    contraction of all of the muscles once the animal was touched. For these reasons,
    some sort of switching mechanism is useful so that under certain conditions some
    of the neurons can be inhibited, rather than all being excited by afferent signals.
    Under conditions of central control and initiation (as opposed to reflexive control),
    the interconnections of the afferent signal to the motor neuron must, therefore,
    be different than the connection to the same neuron during reflexive responses.
    This biological switching action is symbolized by the three drawings of Fig. 11.8.
    In Figs. 11.8b and c the afferent signals are routed to the motor neurons to produce
    an excitatory reflex response. Figure 11.8a shows the case in which the sensory
    signal is routed through an interneuron. The output of this interneuron on the
    system is bipolar; that, it excites some and inhibits others.


    The exact nature of the hypothetical mechanism that allows the nervous system
    to switch between the two modes of action is still not known, course, but it is
    clear that such a mechanism adds a great deal of flexibility to the response repertoire
    of Aplysia, even as it is constrained by the limited number of neurons available.
    The reflexive withdrawal can be rapid and massive as needed for a defensive reaction;
    yet at another time, the integration of inhibitory and excitatory responses of
    individual neurons can allow the animal to perform coordinated movements. This
    should not be misinterpreted as a sort of "free will" on the part of the animal
    but some process does allow the alternative modes of response. Kupfermann and
    Kandel suggested that the adaptive value of the internally coordinated action
    may be produce the pattern of movements required for locomotion, respiration,
    and clearing the mantle cavity of foreign objects.


