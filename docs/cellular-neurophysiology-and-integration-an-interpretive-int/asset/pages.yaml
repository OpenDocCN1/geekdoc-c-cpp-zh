    # E. THE MEMBRANE THEORY OF NEURONAL ACTION


    From a purely historical perspective, it is astonishing how fast knowledge accumulated
    and new theories developed in the twentieth century concerning the cellular and
    biochemical basis of nervous action. The general framework of the contemporary
    theory was spelled out by Bernstein in 1902 when he suggested that the basis of
    neural action was the selective passage of various ions through the semipermeable
    plasma membrane of the neuron. However insightful this notion, it was based on
    what were then some flimsy ideas. The existence of an intracellular fluid filled
    with mobile ions was not firmly established until Hober’s work in 1910 and 1912
    on the nerve was some suggestive evidence for the existence of the membrane itself,
    its physical properties were not measured until the mid-1920s by Fricke. He was
    the first to suggest that the membrane is only a molecule or two thick and to
    estimate (correctly, as it turned out) its capacitance. Direct viewing of the
    cell membrane with an electron microscope has been possible only since the mid-1940s.


    Once routine entry of the cell with micropipettes was possible, many speculations
    of the past were opened to direct experimental inquiry. Hodgkin and his co-workers,
