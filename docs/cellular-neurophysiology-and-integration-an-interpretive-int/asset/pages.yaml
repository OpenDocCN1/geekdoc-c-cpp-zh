    of the concept is identical. Dawson (1954) also developed what was perhaps the
    earliest electrical device actually to perform a pseudo-averaging function, commutator-driven
    bank of capacitors, each of which charged to a level corresponding to a weighted
    algebraic sum of the signals at a given time after the stimulus.


    Averaging may be formally defined by an equation of the following:


    ```

    $E_t = \frac{1}{N} \sum_{n=1}^{N} E_t^n. \quad (8.1)$

    ```


    In this equation $E_t$ is the average value of the signal at a given time $t$,
    following the stimulus; $N$ is the number of sequential responses averaged; and
    $E_t^n$ is the voltage at time $t$ for the $nth$ record. The equation represents
    but one point on the averaged curve for a particular time $t$ after the stimulus.
    The variable $t$ must be varied systematically to plot out the entire time function.
    In practice, the preparation of an average response requires the presentation
    of a repetitive number $(N)$ of stimuli. For digital computer averaging, each
    evoked potential is then digitized by means of an analog-to-digital converter,
    at a rate sufficient to provide an adequate density of sample points. A large
    number of averages, equivalent to the family of $t$''s is computed with the use
    of Eq. (8.1), and the values of the family of averages are plotted or displayed
    on some appropriate device to represent the average time course of response.


    In the most sophisticated digital averages, a true division by $N$ is made with
    each successive stimulus presentation. Performing a division, however, is a complicated
    logical operation that may be avoided by a simple expedient. Thus, many commercial-purpose
    averagers do not actually average but are serial accumulators. Each time a stimulus
    is presented, an analog-to-digital converter samples the data, as described above.
    These coded values may be summed according to Eq. (8.1), but the division by $N$
    is never accomplished. Instead the cumulative value in the register corresponding
    to $\sum_{n=1}^{N} E_n$, that is corresponding to a single $t$, increases throughout
    the entire experiment. In this manner, the values accumulated in each of the registers
    gradually increase in magnitude up to the maximum capacity of the storage registers.


    Since there is as much likelihood that an unsynchronized signal will be above
    the mean value below, after any number of stimuli, once again the contents of
    each register tend toward some mean value. However, in this case there will be
    produced an increasingly nonzero mean value as the number of stimulus presentations
    increases. The division by $N$, therefore, simply acts as a scaling factor to
    normalize the amplitude'
