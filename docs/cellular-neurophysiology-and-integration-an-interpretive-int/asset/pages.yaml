    Behavior, throughout the animal kingdom, is characterized by discrepancies between
    the input stimulus and the output response. This fact has already been alluded
    to as a critical, and at first glance, an incompatible, difference between the
    communicative functions (in which signal features must be maintained) and integrative
    functions (in, which signal features must be modified) of the nervous system.


    Adaptive behavior must be mediated by equally flexible neuronal patterns. This
    means that an input stimulus must be modified to select some new neural pattern
    by interacting with other sources of neural information. However, if this modification
    is to serve an adaptive function, the output pattern must remain related in some
    way to the input. Otherwise, stimulus inputs would simply trigger random activity.
    To maintain this functional relationship while still maximizing opportunities
    for flexibility and adaptation, the input stimulus must undergo a process of selection
    and interaction with mixed, multiple inputs. This process of adaptation through
    mixing and selection has come to be known as neural integration.


    Perhaps the best formal definition of integrative activity in nervous nets is
    that proposed by Bullock and Horridge (1965):


    > Integration is a process or set of processes that result in an output not identical
    to the input but still some function of the input [p. 257].


