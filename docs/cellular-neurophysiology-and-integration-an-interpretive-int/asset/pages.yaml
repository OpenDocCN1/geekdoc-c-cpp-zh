  md: '# 194 9. THE SYNAPSE


    packets of almost constant size that are released as units. One of the earliest
    and most compelling arguments for the packet concept were some work that dealt
    with very careful recordings of the microstructure of the post-synaptic potentials.
    Del Castillo and Katz (1954) observed in motor plates and Eccles and Eccles, Iggo,
    and Lundberg (1961) and Nishi and Koketsu (1960) observed in central neurons when
    a microelectrode was inserted into the postsynaptic tissue, spontaneous depolarizations
    occurred with rather irregular periodicity. These spontaneous depolarizations
    were very small, with an amplitude of only about 5 mV. Because of their very small
    size, they have to be called miniature postsynaptic potentials. It has been determined
    that the miniature postsynaptic potential results from the action of a relatively
    large and constant number of molecules (typically several thousand), since electrophoretic
    experiments in which only a few hundred ions are injected by a driving electric
    field do not produce equivalent depolarizations.


    Since the miniature potential so occurs spontaneously, and since it seems to be
    the action of a substantial number of molecules, the notion that large numbers
    of molecules of the transmitter substance form constant size aggregates or packets
    has gained widely. Further direct support for this concept comes from electron
    micrographs of the sort shown in Fig. 9.4. (The first observation of vesicles
    now believed to be the packets of transmitter substance is usually attributed
    to De Robertis & Bennett, 1954.) Clusters of these structured vesicles can be
    seen in the presynaptic terminal in close proximity to the synaptic cleft. It
    is currently thought that the molecules separate either upon their release and
    that they travel independently to the postsynaptic receptor sites. Supporting
    the notion that the molecules of the transmitter substance diffuse passively across
    the synaptic cleft or correspondence between the cleft size, the diffusion time,
    and synaptic delays electrophysiologically.


    A wide variety of biochemicals are now believed to act as synaptic transmitter
    substances in the nervous systems of various animals. For example, acetylcholine
    has been shown to be an effective transmitter substance for several synapses.
    While this substance was long thought to be solely involved in neuroeffector junctions
    and parasympathetic action in vertebrates, “cholinergic” synapses are now thought
    to be more generalised throughout the entire phylogenetic tree. Similarly, norepinephrine
    was classically suggested as the transmitter substance in the sympathetic portion
    of the autonomic nervous system. Other possible excitatory transmitter substances
    in mammalian brains include 5-hydroxytryptamine, glutamate and aspartic acids,
    and dopamine. Glutamates also seem to be excitatory transmitters in the squid.
    Serotonin is now also known to be a powerful transmitter in some parts'
