    # E. TRANSDUCTION IN THE SOMESTHETIC RECEPTOR


    # 1. Primary Sensory Action in Somatosensation


    The wide variety of cutaneous and proprioceptive receptors are probably stimulated
    by the action of a number of different primary sensory actions. Hensel, Ström,
    and Zotterman (1951) have shown that neurons in the lingual nerve leading from
