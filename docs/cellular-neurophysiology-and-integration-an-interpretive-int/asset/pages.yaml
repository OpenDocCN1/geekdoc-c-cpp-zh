  md: '# D. NETWORK PROCESSES 233


    However, some opposition to the general notion has appeared and a number of authors
    have raised philosophical and technical arguments against direct relations between
    the actions of single cells and the psychophysical response (Weisstein, 1969;
    Uttal, 1971). Needless to say, the question is of fundamental importance in understanding
    the relation between brain and behavior.


    # 6. Centrifugal Processes and Central Feedback


    The next set of network processes that should be mentioned as sources of variation
    in afferent information control be classified under the general term of centrifugal
    signals. Centrifugal signals are those that are generated by some action of the
    central nervous system and then, like effector signals, are transmitted outwards
    to the periphery. The definition of centrifugal signals is significantly constrained
    to include only those signals that affect sensory inputs. Some, as we saw in Chapter
    3, we actually modulate the sensitivity of receptors, while others interfere in
    one way or other with signals generated by receptors at some other point along
    the afferent pathway. The interplay between afferent and centrifugal signals represents
    one of the more complex forms of interaction of the sensory processes with the
    rest of the nervous system.


    Centrifugal feedback processes appear to exert their influence in a number of
    ways. They may directly influence the activity of the receptors, or they may act
    on second-order cells. They may also work by interacting with incoming signals
    at the level of the brain stem. In some cases, it is even reasonable to include
    interaction among different regions of the brain in the category of centrifugal
    interaction. In fact, any effect on a lower level of the nervous system that results
    from stimulation at a higher level is generally considered to be a centrifugal
    feedback process.


    Most of the experiments concerning centrifugal feedback were conducted with the
    use of an experimental paradigm in which the higher levels of the nervous system
    were stimulated artificially and the differential effects on a response produced
    by a second, natural stimulus, were observed in a more peripheral portion of the
    system. As Livingston (1959) so eloquently points out, several other kind of experimental
    paradigms exhibit the sort of centrifugal effect on peripheral structures. The
    distinguishing characteristics of these other experiments is that the more central
    nervous action is triggered not by an artificial stimulus, but by some natural
    means.


    Recent experiments in peripheral habituation, which have attracted a great deal
    of attention (see Thompson, 1967, for a review of this material), are closely
    related to centrifugal effects. In habituation experiments, the ability of the
    sensory pathways to transmit information changes as a direct result of increasing
    experience with the stimulus pattern. These experiments'
