    Electrophysiological experiments such as those carried out in Segundo''s laboratory
    describe the ways in which the decoding processes occur, but they do not speak
    directly to the underlying membrane properties that account for the specific course
    of the various responses. However, Segundo makes a very important point on this
    matter when no matter how complex and subtle the decoding appears to be, may be
    accounted for in terms of very temporal summation mechanisms. No new mechanisms,
    he says, other than those wellknown to be characteristic of neural membranes,
    are required to explain the exquisite decoding discriminability exhibited by *Aplysia*
    postsynaptic cells.


    This assertion, although made by an experimentalist, nonetheless a highly important
    philosophical statement. In a sense, it rests the basic notion of physiological
    reductionism, namely, that the most complex response is in principle (if not,
    in fact, at the moment) explicable in terms of the concatenated action of a number
    of simpler units. This concept of reductionism can also be extended upwards, and
    these cellular decoding mechanisms, so well modeled by this single mollusc, may
    also serve as the building blocks of all that we know "behavior," including man''s
    intrapersonal self-awareness.


    Perhaps, that is not a proper noun upon which conclude this chapter. Certainly,
    the reader will have realized that while enormous strides have been made towards
    understanding the cellular and integrative physiology of the nervous system, we
    have hardly begun to attract more important questions dealing with the relationship
    between cellular neurophysiological data and the behavior of higher vertebrates,
    among them. The work reviewed here that has accumulated from studies of the *Aplysia*
    in particular is illuminating and serves as a guidepost for the future. But technological
    and conceptual advances are required before similar analyses can be applied to
    higher organisms. Of the very basic premises of the work on *Aplysia* and other
    model preparations may ultimately turn out to not even first approximations of
    what we shall find in vertebrate preparations. It has yet to be demonstrated,
    for example, that the relationship between specifically identified cells and specific
    functions, such as found in this simple invertebrate preparation, is also characteristic
    of the vertebrate nervous system. It is quite conceivable that completely different
    organizing principles may apply in more complex brains, and that models based
    on our elementary friend, the *Aplysia*, may be too simplistic to answer the questions
    man asks of himself. The process analogies so promising now may prove not to be
    the structural homologies we desire.'
