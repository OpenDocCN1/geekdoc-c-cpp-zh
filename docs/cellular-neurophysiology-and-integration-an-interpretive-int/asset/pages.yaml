    # 2. Production of the Auditory Receptor Potential


    The most complete theory concerning the production of the auditory receptor potential
    is developed by Halloway Davis, a distinguished contributor to auditory theory.
    However, there is still some controversy surrounding his model. In addition to
    the usual difficulties in understanding the exact processes at the ultramicroscopic
    level of molecules and membranes, it is not agreed on that the receptor potential
    has been unequivocally identified. The lack of agreement is due to a shortage
    of possible voltages, but to an abundance of electrical signals of several different
    kinds that can be detected in the inner ear.


    When the cochlear microphonic was first detected by Wever and Bray (1930), it
    was immediately assumed to be the neurally transmitted acoustic signal. During
    subsequent experiments by them, however, it was shown that the cochlear microphonic
    is a most unusual nervous response. It has enormous high-frequency following capabilities
    (up to many thousands of hertz) and is independent of body metabolism that it
    can be detected long after the death of the animal (Wever, Bray, & Lawrence, 1941).
    Since nerve impulse rates are known to be limited to about 1000 Hz, and mammalian
    nerves are known to be extremely sensitive to anoxia, the microphonic clearly
    could not be the result of a propagated nerve impulse pattern. For many years
    following their discovery, therefore, the cochlear'
