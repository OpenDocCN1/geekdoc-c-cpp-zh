    to the essence of this part of his argument.


    More severe criticisms of the Davis theory, however, may be directed at the second,
    more speculative portion. The explicit assumption in this second part is that
    the cochlear microphonic, described as in the first part of his theory, is, in
    fact, the receptor potential; that is, he assumes that the cochlear microphonic
    is specifically responsible for triggering the synaptic action, which leads to
    spike potentials in secondorder neurons. On the other hand, even Davis appreciates
    the weakness of this assumption, for he states the same processes accounting for
    modulation of the resting DC current may also, in some other way, increase the
    release of neurochemical substance.


    However, a number of questions remain unanswered in this case. What, for example,
