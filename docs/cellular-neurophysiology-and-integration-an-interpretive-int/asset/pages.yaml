  md: '# B. ANATOMY OF RECEPTORS 31


    procedures that discriminate one region from another by selective coloration.
    Fluorescence and radiographic techniques are also in cur-rent vogue.


    The central nervous system may be considered to be a tube along which various
    portions have swelled into major centers. The most extraordinary growth of course,
    is in the most anterior portion—the great centers known as the cerebral hemispheres,
    which under ordinary conditions overhang and hide the underlying brain stem. The
    brain stem itself consists of a number of important nuclei that perform various
    communication and integration functions. These have been summarized in Table 3.2.


    Ascending through the core of these direct pathways is the reticular formation,
    an anatomically unstructured system (the cellular network is very diffuse, and
    no clear lines of demarcation between its various regions have even been found)
    that seems to acquire input signals from almost all the senses and to disperse
    these messages to most other portions of the brain. The reticular formation has
    been assumed to serve a general activating function and to be associated particularly
    with the maintenance of consciousness.


    Armed with this brief anatomy, our attention can now turn to the main theme of
    this book: the structure and function of the individual building blocks, the microscopic
    neurons that make up these macroscopic structures.


    # B. ANATOMY OF RECEPTORS


    The receptor cell is the natural starting point for any discussion of the microanatomy
    of the nervous system. Receptor cells are located in the sense organs, where the
    initial points of contact between the physical stimuli of the outside world and
    the internal, electrochemical environment occurs. Thus, it is at this point that
    information patterns may be considered neural encoded.


    An important general point that must be considered at the beginning of this discussion
    is that the receptor cells of the sense organs are themselves neurons. They are
    specialized, of course, and differ from transmission neurons and interneurons
    in a number of ways. Rather than having a synaptic input, the most peripheral
    portion of each has been specialized to convert a physical stimulus of one form
    or another into neural signals. Almost all receptor cells terminate in elongated
    structures, or they occur at the end of an elongated neural fiber. This is a useful
    adaptation since the receptor''s function is to probe the external environment.
    Many receptor cells are, in addition, ciliated and may have a cluster of small
    extensions at their end. Ciliation serves to increase the surface area of the
    receptor'
