  md: '# C. THE PROPAGATED SPIKE ACTION POTENTIAL 151


    It is important to point out that not all of the questions we have raised regarding
    the ionic basis of the spike action potential can be fully answered at present,
    although there are fairly sound, internally consistent answers available for some
    of them. It is not known, however, why the threshold of regenerative depolarization
    is located at the precise level observed for each nerve membrane. It is generally
    agreed, however, that at the threshold for a rapid change in permeability of the
    membrane to sodium and potassium ions is triggered, and that the time function
    change for the two ions is quite different.


    The Hodgkin-Huxley model of the spike is not universally accepted, although it
    is certainly the most complete and comprehensive of current theories. Its main
    premise is that a dynamic change in membrane results in the passive flow of sodium
    and potassium ions into and out of the cell. But some theorists disagree. For
    example, Landowne (1973), on the basis of his low-temperature experiments on ionic
    transport, believes that the simple permeability model cannot work. He has suggested
    an alternative model in which the transported sodium is actually stored within
    the membrane, and the quantity of that ion can enter is limited to only that stored
    amount. His model, therefore, involves active metabolic processes for the production
    of the spike, unlike the purely passive model championed by Hodgkin and Huxley
    that has such wide currency.


    The following discussion, nevertheless, presents what is now the conventional
    and more complete Hodgkin and Huxley approach, but the reader is addition that
    no molecular or ionic theory fully encompasses all the experimental data accumulated
    in the past 20 or 30 years.


