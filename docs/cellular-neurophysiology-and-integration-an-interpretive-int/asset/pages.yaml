  md: '# C. HYPERSYNCHRONIZED COMPOUND RESPONSES 183


    correlogram can be considered a long-term averaging process that tends to emphasize
    the periodic similarities between two functions over the aperiodic. Thus, two
    sets of data having very long-term periodic trends, or sequences common to both
    signals, can be reduced to the form of the correlogram. From this point of view,
    the cross-correlation function can be seen to be closely similar to the Fourier
    frequency analysis technique. In fact, by making $f(t)$ or $g(t)$ equal to a family
    of sinusoids it becomes exactly that.


