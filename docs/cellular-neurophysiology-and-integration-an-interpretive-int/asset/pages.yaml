  md: '# 162 7. THE TRANSMISSION PROCESS


    However, two features of the nervous system do operate to constrain the direction
    of propagation of the spike action potential: refractory and recovery cycles,
    and synaptic action. If the spike is initiated at the end of an axon, either at
    the axon hillock or at the initial postsynaptic terminal, then the refractory
    period and the cycle of the resting potential limit conduction to a single direction—away
    from the initial point of entry. A spike cannot be retrobacked along the axonal
    path from which it came. This limitation exists because, during the refractory
    period, the neuronal spike response travels far away from the region it has just
    activated that it is no longer capable of eliciting a response in that region.


    Directionality is additionally imposed upon the nervous system by the action of
    synapses. Synapses are strongly directional and therefore act as rectifiers. Synaptic
    action is discussed in detail later in Chapter 9, and we shall defer further discussion
    of this matter until then.


    A second important property of axonal transmission is its velocity. conduction
    velocity is intrinsically interesting because it is one property of the neuron
    that is known, if not a directly derivable, function of neuron structure. The
    fact that different neurons conduct at different speeds was discovered rather
    early (Gasser & Grundfest, 1939), and it was obvious from these early neurophysiological
    experiments that conduction velocities are closely associated with fiber diameter.


    How extraordinarily precise the relationship is for the large A fibers of the
    somatic system actually was demonstrated by Hursh (1939), who showed that there
    was a strikingly linear function relating the diameter of a fiber to conduction
    velocities in mammalian nerves (Fig. 7.10). The upper limit observed by Hursh
    was about 140 meters per second. This value, of course, is substantially below
    electronic conduction speed.


    The degree of myelination of an axon is another important factor in determining
    its conduction velocity. It was demonstrated in Chapter 3 that many kinds of neurons
    are typically encased in a fatty sheath of myelin, produced by the unusual “wrapping”
    action of the Schwann satellite cells. It was pointed that on many of these cells,
    in particular the peripheral axons myelin is interrupted at nodes of Ranvier.
    At these nodes the myelin sheath is completely absent (Bunge, 1968), and its electrochemical
    resistance is also very much reduced. These nodes, therefore, literally provide
    short-circuits for the propagating currents that sequentially trigger the spike
    action potential along successive positions of the axon, allowing the spike to
    “skip” at a high velocity. Spike action potentials in an unsheathed cell, however,
    must sequentially activate all locations on the membrane if they are to propagate
    themselves. Because'
