  md: '# 62 3. NEUROANATOMY


    each other, and the heads tend to repel each other. The membrane is, therefore,
    formed when the lipids form a regular structure of two molecular layers that are
    arranged tail to tail (see Fig. 3.24). The outer electron-dense regions in the
    electronmicrograph are characteristic of the heads of these molecules, and the
    less dense regions in the middle represent the core composed of the tails. Many
    of the proposed features of the currently accepted model are summarized in Fig.
    3.24.


    It should be remembered, however, that there is no contemporary consensus on the
    exact molecular structure of the membrane, but only a set of competing models
    suggested on the basis of a not always consistent set of data.


    The other main feature of the membrane to be explained is its selectivity to ions,
    a selectivity that varies from time to time. To achieve such variable selectivity,
    the membrane must possess some transport mechanisms and/or pathways through which
    ions can pass under some conditions and not others. This topic is discussed in
    greater detail in Chapter 5, but to preview an important point here, the “pore”
    or “channel” through which ions move might be better interpreted as some sort
    of chemical process, perhaps mediated by a penetrating protein molecule, rather
    than a real physical hole. A “pore” at the molecular level of the structure we
    are now considering is, therefore, perhaps more appropriately considered as something
    of a metaphor for the means by which ions move across membranes. Whether this
    movement is by means of physical gaps, by carrier substances, or by electrostatic
    forcing fields is not yet established.


    We have now surveyed the anatomical structures that are important for our study
    of cellular neurophysiology. In the next chapter we will consider some methodological
    and instrumental issues that allow the measurement of both the transient and sustained
    potentials that can be developed across the membrane.'
