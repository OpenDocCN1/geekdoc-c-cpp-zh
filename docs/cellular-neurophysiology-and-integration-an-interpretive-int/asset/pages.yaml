    If the number of spike action potentials, or for matter any other action potential,
    is sufficiently large, then the individual spikes may not be individually discernible
    on an oscilloscope trace. Rather the voltages generated by each individual neuron
    combine to produce a cumulative signal, which is an arithmetic sum of the individual
    responses, in accord with the usual laws of voltage addition. As the number of
    individual spike action potentials increases, pooled potentials show increasing
    numbers of complex spikes resulting from the superposition of individual spikes.
    These voltage mixtures can be easily identified by extra bumps and notches on
    the overall smooth rise and fall of the spike; but occasionally deceptively simple,
    perfectly synchronized responses occur. In the central nervous system almost any
    electrode not positioned intracellularly, except the most highly selective, will
    pick up such multiple responses because of the dense neuronal packing.


