  md: '# B. COMPOUND RESPONSES 177


    Fox and Norman (1968) expanded the earlier notions of the relationship between
    the spike and the compound evoked brain potential by inventing a new measure they
    call congruence. Congruence is a measure that describes in a quantitative fashion
    how typical an individual cell''s pattern of response is the total sample of cells
    contributing to a particular compound evoked potential. The activity of the single
    cell and of a microelectroencephalogram were recorded in the manner described
    above, by means of one electrode and two amplifiers with differing bandpass characteristics.


    Fox and Norman formed three functions from the recorded data. The first function
    was the distribution of amplitudes of the microelectroencephalogram recorded with
    the low bandpass amplifier. A digital-to-analog converter sampled the amplitude
    of this continuously varying potential every millisecond and made an entry into
    one of 256 amplitude categories each time the amplitude of the signal was within
    its range. In this way, an amplitude histogram was formed, which showed the number
    of occurrences of each amplitude value. An example of this type of histogram is
    seen in Fig. 8.7a.


    The second function was based upon the occurrences of the spike action potential
    from a single cell, as detected with the high bandpass amplifier. Every time the
    cell fired, it would trigger the computer to determine in which of the 256 amplitude
    levels the slow potential currently resided. Another computer analysis program
    then developed a second amplitude histogram, based upon the number of times a
    spike occurred for each of the 256 amplitude levels. An example of this type of
    histogram is shown in Fig. 8.7b.


    So far, this procedure is a relatively straightforward process in which two simple
    amplitude histograms are developed. Now consider that some of the amplitudes of
    the slow potential occur more frequently than others. The extreme values, of course,
    occur relatively infrequently, and the midvalues occur relatively frequently.
    The frequency of the spikes shown in the second histogram is, therefore, strongly
    biased because there are many mid-value amplitudes of the slow potential than
    there are extreme amplitude values. It is, therefore, necessary to normalize these
    data by dividing the distribution of spike occurrence by the distribution of amplitude
    occurrence. By carrying out this simple calculation, Fox and Norman controlled
    for unequal numbers of the slow potential amplitudes. The results of this normalization
    form a third graph, which plots a function that is essentially equivalent to the
    number of times a spike occurred at each amplitude value of the slow potential.
    This typical curve, therefore, is normalized for the number of times each slow
    potential amplitude value occurred. An example of this third normalized histogram
    is shown in Fig. 8.7c. If we carefully study the three histograms a most important
    fact emerges. Even though there is an almost normal and, therefore, at first glance
