    # C. BASIC MECHANISMS


    The compound and pooled action potentials that were discussed in Chapter 8 are
    processes produced by a mixture of nervous signals in a way that does not, by
    any stretch of the definition, involve true neural integration. These types of
    responses are merely the physical superimpositions of individual electropotentials
    produced by the various parts of individual neurons. The composite signals are
    defined solely by the physical and geometrical relationships of the neurons and
    the fluids that constitute their environments.


    In general, even neurons that are closely bundled do not interact functionally
    except in the most extraordinary situations. Nerve passing by each other are so
    well insulated that the electropotentials induced in each one do not often affect
    their neighbors. Although there had been some interest in ephaptic interaction
    (information transmission between adjacent axons) this phenomenon appears to remain
    a laboratory curiosity. In the somatosensory system of man, despite the long parallel
    runs of many neurons, there is no opportunity for integrative interaction until
    the axon reaches the spinal cord, for the simple reason that no synapses exist
    prior to the spinal centers.


