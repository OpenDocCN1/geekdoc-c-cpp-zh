  md: '# A. ELECTRICAL AND CHEMICAL SYNAPSES 191


    of synaptic action are known at present. The first mode of synaptic action is
    based upon direct electrical activation, similar to the way in which a nerve impulse
    is propagated along the axon itself. The second, and apparently much more common,
    mode of synaptic action is mediated by means of highly specialized transmitter
    chemicals released from the terminal or presynaptic region of the cell from which
    the information is gained. Information is transmitted by the diffusion of transmitter
    substance across the space between two neurons, producing an alteration in the
    membrane potential of the second or postsynaptic cell.


    Electrical synapses between two neurons are less frequently found in vertebrate
    preparations than are the much more common chemical synapses, and only very rarely
    in mammalian tissue (Sotelo & Palay, 1970). Electrical synapses require a much
    higher degree of electrical coupling to function than do chemical synapses and,
    therefore, the two neurons are generally more closely spaced. How close the spacing
    may be in an electrical synapse is evidenced by the electronmicrographic work
    of Bennett, Aljure, Nakajima, and Pappas (1963) and Pappas (1966). One example,
    a Mauther neuron from an axolotl, an amphibian that retains its gills into adulthood,
    is shown in Fig. 9.2. The important feature of this photograph is that the spacing
    between the two neurons is very close—only 20 Å—and there is no evidence of any
    chemically active vesicles. In other cells there is a suggestion that these two
    membranes may actually be fused. Pappas believes that this closely spaced region
    is the morphological structure responsible for electrical synaptic conductivity.


    It is important for the reader to understand that the distinction between an electrical
    and a chemical synapse does not mean that one is exclusively chemical or the other
    exclusively electrical. The voltages and currents that in electrical synapses
    result from the same sort of ionic flows described in our previous discussion
    of the resting and action potential. The chemical synapse, while it seems to be
    relatively insensitive to electricity as a primary excitant (some neurophysologists
    feel that it is completely initable electrically), do exhibit the same sort of
    electropotentials as any ionic system. (See the sections on pre- and postsynaptic
    potentials later in this chapter.) It must be remembered that our technology for
    observing the magnitude and time course of even these chemical events is almost
    exclusively electrical one. Chemical events can be only indirectly observed with
    the usual sort of electrophysiological electrodes and amplifiers. The key difference
    between chemical and electrical synapses is the nature of the primary excitant
    that is best able to alter the resting potential of the postsynaptic region.


    In the epilog to his distinguished book (Eccles, 1964) also lists some specific
    distinguishing features of the chemical and electrical synapse which have been
    paraphrased as follows:'
