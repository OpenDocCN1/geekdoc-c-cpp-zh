  md: '# D. NETWORK PROCESSES 225


    # 1. Inhibition


    Although the synaptic and cellular aspects of inhibition have already been discussed,
    the prime importance of this process must be emphasized once again at the network
    level. The overriding importance of a capability for inhibition can be emphasized
    by reconsidering the fact that if a network did not possess some intrinsic inhibitory
    mechanism, it would continue to respond to even the simplest input until physiologically
    exhausted. The behavioral ramifications of an inhibition-free network would be
    disastrous. Suppose that some organism mutated suddenly that inhibitory processes
    were no longer part of its network properties. The organism would then exist in
    a constant state of uncontrolled activity; no coordinated or integrative activity
    of any kind would be possible. Obviously such a situation is absurd; no creature
    could live long with such a handicap, and certainly no species could evolve under
    the enormous burden of the absence of inhibition. Thus, all neural networks must
    possess some sort of general inhibitory capability.


    Specific inhibitory mechanisms have been observed in different parts of many nervous
    systems. Lateral inhibitory interaction among the receptor units of vertebrate
    and invertebrate receptors and sensory neurons is now a widely accepted concept.
    Hartline and his coworkers were the first to establish the general notion of reciprocal
    interactions between neighboring receptors of the compound eye of the horseshoe
    crab. In recent years the concept of antagonistic inhibition and excitation has
    been extended to the vertebrate eye by workers as Kuffler (1953) and Barlow and
    Levick (1965). It is now widely accepted that lateral interactions in the periphery
    are fundamental to such important perceptual processes as the intensifications
    of contours.


    In the horseshoe crab eye, Hartline and his collaborators (e.g., Hartline, Wagner,
    & Ratliff, 1956) have demonstrated that the receptor cells are interconnected
    in a purely inhibitory fashion. Activity in one cell exerts an inhibitory influence
    on activity in a neighboring cell as a function of the distance between the two
    cells and the amount of activity in the inhibitor. The action is reciprocal in
    the sense that usually inhibits the other, and simultaneous stimulation of both
    leads to a much smaller amount of activity in each than when they are separately
    stimulated. Figure 10.8 shows the results of one of these experiments.


    A somewhat different interactive organization appears to characterize the vertebrate
    eye. Concentric and antagonistic arrangements of receptive fields that may interact
    in excitatory as well as inhibitory modes seem to be fairly common, not only in
    the periphery, but at higher levels of the nervous systems of many animals.'
