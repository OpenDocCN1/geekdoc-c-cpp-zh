    to sodium rapidly returns to its very normal level. Given a sufficient amount
    of time, this change in the permeability of the membrane would result the reestablishment
    of the resting potential. In fact, however, the return occurs much more rapidly
    than could be accounted for by such a passive process. Therefore, other forces
    must be invoked to explain the restoration of resting polarization levels. One
    suggested possibility is the sodium-potassium pump itself. But that active mechanism
