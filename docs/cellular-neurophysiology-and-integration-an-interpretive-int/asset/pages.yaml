    Bullock''s categorization of the modes of neuron action has specific implications
    for current theories of neural encoding of sensory, cognitive, and motor messages.
    If the neuron responds in so many different ways as information passes from one
    part of the cell to the next, it is clear that codes used to represent a given
    pattern of information cannot remain constant within the cell. Rather, at each
    place in the cell a different coding mechanism must represent the message pattern.
    As information is transmitted from cell to cell, the coding and recording of information
    occurs again and again. At one point a graded action potential may represent the
    pattern, while at another, a train of spike action potentials may be the coding
    mechanism. The important implication is that there is no single or "best" neural
    code, and certainly no psychophysical test could tell how a given percept is encoded
    at any level of the nervous system. Rather, there are many different and equally
    useful neural "languages" used at different places in the nervous pathways.


