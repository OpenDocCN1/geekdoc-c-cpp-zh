    # E. TRANSMISSION PROPERTIES OF SINGLE AXONS


    Up to now the spike action potential response has been discussed almost independently
    of the fact that it has evolved as the medium of communication over the long axons
    of the nervous system. Let us now concentrate on those properties of the spike
    that are associated with its transmission function, rather than on the local ionic
    conditions that power it. It is particularly important to understand the transmission
    function of the spike action potential because historically it has been considered
    to be the neural code par excellence. Patterns of spikes can vary in frequency,
    in interval, in amplitude (if the outputs of several neurons are compounded).
    It is clear that in many parts of any nervous pathway, the spike is available
    as a medium for conveying stimulus information.


    One of the first considerations of the propagated nerve impulse is the matter
    of directionality of axonal transmission. The nervous system would explode into
    an uncontrolled torrent of chaotic nerve impulses if there were not strong constraints
    imposed on the direction in which nerve impulses can travel from their point of
    excitation. Nevertheless, it must be that the axon itself has no intrinsic directionality,
    but can convey information well in both the antidromic and orthodromic directions,
    even simultaneously. In fact, the neuron is capable of conveying several different
    responses, even patterns of response, in different directions down different branches
    of an axon at the same time.'
