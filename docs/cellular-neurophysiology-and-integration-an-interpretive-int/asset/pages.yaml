  md: '# 8. COMPOND AND POOLED ACTION POTENTIALS


    In any event, there is as yet no complete agreement on the origins of electroencephalographic
    or evoked brain potentials; any or all of the voltage sources mentioned so far
    may contribute to those normal compound action potentials. Hopefully, the problem
    can be resolved in the not-to-distant future.


    # C. DO HYPERSYNCHRONIZED COMPOUND RESPONSES TRULY REPRESENT NATURAL CODING METHODS?


    As noted earlier, Gasser (1938) and Erlanger and Gasser (1937) originally explored
    the nature of action potentials in peripheral nerves by a stimulation technique
    that has become standard in both neurophysiological and psychological laboratories.
    The stimulus they used was a highly unusual—some would say nonphysiological—event;
    a brief, but (in terms of normal biological electropotentials) massive electrical
    pulse. The description of the peripheral nerve compound evoked potential in our
    earlier discussions is primarily based on results from experiments in which stimuli
    of this sort were used. However, when the activity of a somatosensory nerve trunk
    is observed by means of normal stimuli, such as a tap, a brush, or the application
    of heat or cold, most observational techniques indicate that the pattern of response
    is better characterized as being of the pooled type of record. This is entirely
    reasonable, of course, for a much greater degree of information coding is inherently
    available in the delicate time relations between the more or less independently
    responding single-cell spike action potentials.


    A major question arises, though, because of the emphasis placed by many experimenters
    on the electrically-generated compound action potential. Does this artificial
    stimulation introduce any spurious or extraneous features on top of the normal
    coding properties of the nerve? In other words, does the hypersynchronized response
    in which all neurons respond simultaneously introduce properties of its own that
    make the recorded potential unrepresentative of a statistical summation of the
    semiindependent fiber response? To elaborate further by expressing the question
    in a more formal manner, does this particular statistic—the compound action potential
    produced by electrical stimulation—represent in an unbiased way the central tendencies
    of a family of independently responding axonal potentials?


    Clearly, the only way to resolve these questions is to devise some means of performing
    the same statistical analysis performed by the nerve itself when it is stimulated
    with a transient electrical stimulus. As an analytical technique was developed
    by Casby, Siminoff, and Houseknecht (1963), who used a specially designed analog
    computer to cross-correlate the pooled responses evoked by natural stimulation.'
