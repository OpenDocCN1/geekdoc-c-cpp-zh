    # B. PLAN AND ORGANIZATION OF THE BOOK


    This book is directed toward those students at the university level who

    have already had some introduction to the biological and physical sciences.

    It is assumed that the reader has a basic, introductory knowledge of elec-

    tric and cellular biology. The foundations of cellular neurophysiology

    will be presented in a way that will allow students of specialties other

    physiology to acquire an understanding of the basic concepts of this

    elegant and intricate body of knowledge. The main effort in this book is

    to interpret extensively the meaning of the various aspects of neurophysiol-

    y to be considered. The historical, philosophical, and conceptual aspects

    of cellular neurophysiology will be emphasized.


    Modern neurophysiology is unquestionably a difficult body of material

    to master. Much of it is not only highly technical but also involves a numberber
    interacting concepts that make some aspects of the subject quite

    complex. Unfortunately there is no way to avoid this detail without losing

    a solid understanding of the subject. But it is a body of knowledge of in-creasing
    importance that grows almost daily in new findings, and the time

    has come for a statement that attempts to extract the important concepts\and general
    principles to a greater degree than usual. Methods and findings

    will necessarily play an important role in our discussion, but the author’s

    principal intent is to use these materials to help in achieving con-ceptual understanding
    than as goals in themselves.


    The only hope for grasping the fundamentals of cellular neurophysiology

    is to keep rigid control over the sequence of ideas as they are presented.

    The problem is in deciding which of the alternative dimensions this

    sequence of control should be exerted. There are two obvious candidates.

    One possible thread along which the discussion might be organized that

    in increasing levels of cellular anatomy and complexity. This thread passes

    the basic biochemical properties of the neuronal membranes to the

    interactive mechanisms that allow cells to communicate with each other.

    an alternative sequence of discussion is imposed by the intrinsic direc-tionality
    of information flow within the nervous system. Receptors “trans-du” physical energy.
    The long axons of certain specialized neurons then

    transmit that information through synaptic junctions to the central nervous

    system, where it is integrated into output patterns that are again transmitted

    through a similar channel—but in a reverse direction, to the periphery.'
