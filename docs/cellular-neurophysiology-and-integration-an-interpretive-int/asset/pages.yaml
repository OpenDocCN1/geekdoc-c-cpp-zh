  md: '# E. ANATOMY OF THE PLASMA MEMBRANE 59


    # E. ANATOMY OF THE PLASMA MEMBRANE


    The final entry in this brief anatomical atlas will be a consideration of the
    structure of the cell wall, or plasma membrane, as it is more correctly known.
    A number of references have already been made to this extraordinary region of
    demarcation between the inside and the outside of the neuron. In later chapters
    it will be seen that the properties of the membrane are, in fact, the basis of
    almost all neural action.


    At the level of microscopic analysis to which we now descend, it is not certain
    that we are in fact dealing with structural entities of the same sort as the more
    macroscopic structures. The models to be described are moot, and the theories
    of molecular structure of what just it is that constitutes the membrane are far
    from common-sense explanations. Thus it is necessary to express an important caveat
    at this point. The membrane exists at the limit of resolution of even the most
    powerful electron microscopes available. Its dimensions are such that we have
    only a shadowy, indirect impression of what the membrane must actually be. While
    it is abundantly clear that there is certainly something different present at
    the interface between the cellular and extracellular fluids, it is to the realm
    of the indirect evidence of biochemistry, electrical properties, and ion transport
    that we must turn for details concerning the nature of the plasma structure.


    The last of the directly visible facts of the membrane is that it is a three-layered
    structure. Figure 3.23 is an electronmicrograph showing the tripartite structure,
    consisting of a central core and two outer layers. One of the outer layers is
    in contact with the intracellular cytoplasm of the cell, while the other is in
    contact with the extracellular fluid. The total thickness of the cell membrane
    is usually about 70 angstrom units. Biochemical assays performed on centrifuged
    components of cells, show that the membrane is composed primarily of a mixture
    of proteins and lipids. Brechers (1973) describes how microanalytical of the protein
    components can be carried out with special detergents to enhance an otherwise
    weak tendency for the membrane components to separate when dissolved in water.
    These solutions can then be


