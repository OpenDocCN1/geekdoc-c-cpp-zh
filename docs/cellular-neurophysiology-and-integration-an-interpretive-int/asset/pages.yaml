    15 microvolts in amplitude, whereas the amplitude of the usual electroencephalographic
    activity is on the order of 1/ millivolt. The problem facing the investigator
    is to extract the tiny evoked potentials from the other interfering signals. Such
    a procedure is possible, because of the fact that evoked potentials are synchronized
    with the impulsive stimulus that generates them. In contrast, the noise is, by
    definition, activity unrelated to the stimulus. Therefore, at any delay following
    the unstimulated activity or noise tends to be randomly distributed. When averaged,
    the randomly fluctuating signal will tend to converge on the value zero. On the
    other hand, when one averages a signal that is synchronized or timelocked to the
    stimulus, the average value at each delay following the stimulus will converge
    toward some representative nonzero value. A mixture of the two types of signal,
    synchronized and random, will tend, upon repetitive averaging, to reproduce the
    waveform of the larger, unsynchronized activity.


    During War II repetitive sweep techniques were used to enhance radar displays.
    The conceptual problem faced in that context was exactly the same as that for
    bioelectric potentials, except that the stimulus was the original burst of transmitted
    radio waves and the response was a much smaller radio wave reflected from the
    target. The various types of receivers capable of receiving the tiny reflected
    signals all had poor signal-to-noise characteristics. In addition, meteorological
    conditions contributed to irrelevant noise. The method used to extract the significant
    signals was to send a signal to the target area repeatedly, and to supervise one
    response after another on the same display. Thus, very small changes could be
    seen with the naked eye.


    In 1950, G. D. Dawson suggested that similar superposition techniques could be
    used to detect small evoked potentials from the human brain. (He also pointed
    out, incidentally, that the technique, like the radar solution, was functionally
    identical to the superposition idea used by Galton in 1883 to enhance the similarities
    among a collection of facial portraits.)


    Dawson''s techniques created an almost unprecedented opportunity to do electrophysiological
    studies of the intact human brain that has received a great deal of attention
