    # B. BIOLOGICAL SYSTEMS


    A neuronal net that can produce behavior of human complexity is most certainly
    not a simple one. There are probably something like 10 billion neurons in the
    central nervous system of a human, and the multiple connections among them are
    very complex. Figure 3.22d showed that even a single neuron can have a very large
    number of synaptic connections. This means that the possible number of combinations
    of neurons is vastly larger than even the large number of cells involved. No realistic
    estimate of the significant number of neuronal combinations in the vertebrate
    brain is possible because no one knows how many of the myriad synapses can be
    observed under a microscope are simply redundant. Furthermore, in most vertebrate
    systems the cells are so numerous, small, and appear so inconsistent in location
    and evolved function that the recording of responses is pretty much blind sampling.
    Thus, no replication of the manipulation of specific neurons or of precisely defined
    input-output relations is possible.


    In a situation so complicated, the experimenter is constantly looking for less
    complex version of the problem. He would like to work with some lesser part of
    the overly complex total problem, one that can be isolated or abstracted to a
    level of workable simplicity—a neural subset that still maintains the basic properties
    of the more general neuronal net under investigation.


    There are two ways to achieve this goal. One way is to look to a part of the vertebrate
    nervous system that is simple and well ordered in structure. The plexi of the
    receptor organs meet this qualification in part, and the research on interactive
