    # C. ANATOMY OF TRANSMISSION NEURONS


    Transmission neurons have been specialized for the purpose of conveying information
    from one place to another in the body. To achieve this they have evolved into
    the longest cells in the body. A typical somatosensory neuron, for example, may
    convey information from a receptor in the skin of the foot to a synaptic contact
    in the spinal cord. Such a cell may be as long as three or four feet. It need
    not necessarily be of great volume, however, since the diameter of that part of
    the cell that contributes most to its length, the axon, is only a few microns.'
