    that must be generated to produce the necessary depolarization for activation.
    However, a number of experiments (e.g., Coombs, Eccles, & Fatt, 1955) have shown
    that inhibitory action may be either hyperpolarizing or depolarizing, depending
    upon the clamped resting potential of the postsynaptic tissue at the time the
    inhibitory transmitter substance arrives. One recording of such an experiment
    is shown in Fig. 9-5. An inhibitory depolarization is seen to occur when the membrane
    resting potential has been locked at a hyperpolarized level by means of a voltage
    clamping apparatus. At other clamped levels, the inhibitory potential is clearly
    hyperpolarizing. The dependence of the polarity of the inhibitory postsynaptic
    potential on the level of original membrane potential conclusively rules out any
    notion of a direct and simple association between inhibition and hyperpolarization.
    A more accurate statement might be that the i.p.s.p. polarization shift tend toward
    a membrane potential that is intermediate in amplitude between the potassium concentration
    potential and the chloride equilibrium potential.


    A new ionic mechanism has been hypothesized to explain inhibitory membrane potential
    shifts that are either hyper- or depolarizing. This theory has been proposed by
    Eccles (1964). He believes that the fundamental inhibitory action is not hyperpolarization
    per se but is a change in the normal membrane permeabilities to potassium and
    chloride ions.'
