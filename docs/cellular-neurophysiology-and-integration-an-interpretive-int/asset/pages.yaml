    due to injury or metabolic deficiencies are not considered action potentials in
    the sense used here. Following Bullock, three classes of action potentials are
    defined: pacemakers, transduced action potentials, and internal responses.


    +   1. Pacemakers


    Pacemaker action potentials include the periodic potential shifts initiated by
    an oscillatory or rhythmic mechanism within the neuron itself. These activities
    may serve as a master clock to trigger some other, massive repetitive function.
    The critical condition defining a pacemaker action potential, however, is a periodic,
    intracellular response without identifiable external stimulation. The pacemaker
    function of the heart is the most familiar of these potentials, but pacemaker
    activity is also found in a number of other vertebrate and invertebrate interests.
    Interestingly, von Baumgarten* has shown that it is also possible to set up a
    kind of pseudpacemaker activity (in addition to the naturally present pacemaker)
    in the nervous system of the mollusk Aplysia (the sea hare), by repeated stimulation
    with periodic stimuli. When the stimuli cease, the cell continues to respond at
    the appropriate interval.


    +   2. Transduced Action Potentials


    This class of action potential is composed of two subcategories. The first includes
    receptor or generator potentials produced when some form of external physical
    energy impinges on a specialized receptor capable of converting physical energy
    into neuronal electrochemical energy. Receptor or generator potentials are graded
    and spread from one place to another in the cell only by passive electrical or
    electrotonic spread. They are the responses of highly specialized neurons whose
    main purpose is to amplify and convert the amounts of physical energy involved
    in sensory activation. How this form of action potential is generated by the transductive
    mechanisms of the various senses is the subject matter of Chapter 6.


    The second class of transduced potentials is the synaptic potential. Synaptic
    potentials are similar in many respects to receptor potentials but are generated
