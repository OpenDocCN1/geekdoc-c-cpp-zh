  md: '# E. "LEARNING" IN SIMPLE NEURONAL NETS 261


    of classical conditioning, the essentials of the classical conditioning paradigm
    are relatively simple.


    The Aplysia''s nervous system exhibits an analogous neurophysiological process
    that has been designated heterosynaptic facilitation. It is important to emphasize
    that classical conditioning and heterosynaptic facilitation are only process analogs
    of each other, and few researchers believe that they are homologous. That is,
    while the two exhibit many common features in their operation, it is probably
    not appropriate to link the two in a way that identifies heterosynaptic facilitation
    as the underlying neuronal mechanism for whatever classical behavioral conditioning
    might be observed in Aplysia or any other animal.


    Heterosynaptic facilitation is a phenomenon observed in neural nets in which the
    effect of a weak electrical stimulus, analogous to a conditioned stimulus, applied
    to a presynaptic neuron can be enhanced in its ability to evoke a postsynaptic
    potential. This enhancement is achieved by pairing the weak stimulus with a vigorous
    stimulus applied to another presynaptic neuron. Heterosynaptic facilitation, therefore,
    is quite comparable to posttetanic potentiation in terms of its. The latter process
    is quite distinct, for it involves a change in the synaptic effectiveness as a
    result of exercise while heterosynaptic facilitation is a network process involving
    several neurons and synapses. Nevertheless, heterosynaptic facilitation and post-tetanic
    potentiation are alike in that both produce similar effects—a transitory increase
    in the response magnitude of the postsynaptic neuron to a stimulus that previously
    had been less effective. For this reason, both processes have been repeatedly
    suggested as possible cellular mechanisms mediating some sort of adaptive or learned
    behavior.


    The early work on the two was not so clear. Indeed, there was an assumption that
    it might simply be another version of heterosynaptic facilitation from post-tetanic
    potentiation. However, Tauc and Epstein (1967) and Epstein and Tauc (1970) clearly
    showed that the two were separate processes and heterosynaptic facilitation occurred
    under conditions, such as low temperature or substitution of lithium for sodium
    in the bathing solutions, in which it was impossible to obtain post-tetanic potentiation.
    Even more important, work by these investigators showed that the heterosynaptic
    effect was not due to a mere change in the postsynaptic membrane, but required
    the action of some sort of intermediary neuron.


    Heterosynaptic inhibition is also known to occur in some cases. In such instances
    the response is decreased rather than increased. However, all the other properties
    of such an inhibition are sufficiently comparable to facilitation to warrant no
    further discussion.


    Since the terminology and methodology of the typical heterosynaptic experiment
    is somewhat specialized, 11.12b is presented to clarify the technology and define
    some of the relevant terms.'
