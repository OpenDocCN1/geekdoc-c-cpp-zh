    and a cathode ray tube (CRT), an evacuated glass envelope with a source of electrons
    (the electron gun) at one end and a fluorescent screen at the other end that glows
    when hit by the electrons. Figure 4.5 shows the components of a typical CRT.


    The electron source is a heated filament similar to that found in a radio vacuum
    tube. The heating action produced by a current passing through this filament boils
    off the outer orbital electrons of the atoms of the filament metal (usually tungsten).
    These electrons are then attracted by a positive potential on a secondary accelerating
    electrode, and/or repelled by a negative potential on the electron source itself,
    toward the face of the CRT. The diffused bundle of electrons emitted by the filament
    is focused and collimated by placing an appropriate voltage on a special set of
    focusing electrodes and by masking the electron pathway with metal shields. The
    fluorescent brightness of the face of the oscilloscope is controlled by a grid
    electrode interposed in the electron beam pathway. The position of the electron
    beam on the face of the CRT is determined by magnetic or electrostatic deflection
    of the beam of electrons as they move from the electron source to the fluorescent
    material. Often both techniques, electrostatic and electromagnetic deflection,
    are used simultaneously in a single tube. When electrostatic deflection is employed
    alone, two sets of deflection plates are used—one for horizontal and one for vertical
    positioning. Similarly, electromagnetic control requires two sets of coils, but
    the coils may be external to the CRT, a simpler construction technique can be
    applied within the evacuated tube itself.


    A simple CRT is capable of only producing a spot of light on the fluorescent face
    at a place determined by voltages on the horizontal and vertical deflection plates.
    But obviously with such a point plotter it is possible to draw any figure desired
    by judiciously programming the sequence of signals to the deflection plates or
    coils.


