    the neuron to the motor cells of muscles.


    In transmission neurons the large axon plays the central role, for it is the link
    that allows the transmitting cell to perform its main function—communication.
    A number of anatomic peculiarities of the axon serve specific mention. When an
    appropriately prepared vertebrate neuron is observed microscopically, the most
    obvious feature is the coat that surrounds the axonal fiber. This coat, the myelin
    sheath, is a multilayered structure of fused lipid and proteinaceous layers, which
    serves a number of purposes. It insulates the cell from the electrical and chemical
    activity of surrounding cells, thus reducing "cross-talk" between cells. Since
    it is not continuous but rather structured more like a chain of linked sausages,
    it allows a very rapid form of transmission termed saltatory conduction. The interruptions
    between the links of the myelin "sausages" are called the nodes of Ranvier. Internode
    distance may be about 1.5 mm in a typical vertebrate neuron. The nodes act as
    local regions of low resistance to which excitatory ionic currents can skip, rather
    than being propagated the entire length of the axon. This sort of conduction by
    skipping greatly reduces the conduction time over a given length of axon.


    > * Saltatory conduction was first described by Lilly (1925), and more fully developed
    as an important concept by Huxley and Stämpfli (1949) and by Tasaki and his colleagues
    (Tasaki, 1953).'
