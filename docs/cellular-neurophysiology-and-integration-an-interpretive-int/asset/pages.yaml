  md: '# D. NETWORK PROCESSES 229


    A particularly strong example of such neural feature specificity is the orientation
    and moving line-detection sensitivities of central visual neurons of the cat and
    the monkey, as described by Hubel and Wiesel (1961, 1968); but Table 10.1 lists
    a variety of other specific spatiotemporal features that can selectively trigger
    feature-filtering neurons in various species.


    The notion that these feature-filtering single neurons are correlates or codes
    for comparable sensitivities at the behavioral level has wide currency in today''s
    psychobiological literature. The general idea is that if certain brain cells are
    more or less uniquely tuned to particular features, then activation of these neurons
    by the appropriate stimuli constitutes all that is necessary for the correlated
    perception to occur.


    A relation between specific sensitivities of neurons to straight lines oriented
    in a particular direction and the adaptive effects observed in humans as a result
    of viewing grid patterns has been suggested by a number of authors. In psychophysical
    experiments test for grid adaptation, a subject looks at a grid composed of lines
    aligned in a particular direction, as a preadaptation stimulus. An example of
    this type of pattern is shown in Fig. 10.1a. Following the adaptation period,
    the detectability of another grid (shown in Fig. 10.10b) is measured as a function
    of its orientation. The general effect is that test grids aligned along axis to
    that of the preadaptation grid lines are seen less well than those that are oriented
    differently.


    One problem with this hypothesis had been that few experiments were entirely comparable
    had been carried out in the neurophysiological realm. Those that were most often
    cited as examples of possiblephysiological usually had very different time constants.
    When the psychological phenomena occurred over periods of several seconds, the
    neurophysiological adaptive processes occurred too freely. However, a new report
    (Maffei, Fiorentini, & Bisti, 1973) may possibly fill in the missing link in this
    case. These workers have found in the visual cortex of the cat neurons that respond
    to gratings with a prolonged inhibition comparable to that of the psychophysical
    experiment. In their experiment test of the adaptive effect is performed by using
    a test grating that is of a lower contrast than the preadaptation grating. Both
    the psychophysical phenomenon and the neurophysiological findings in the cat show
    Figure 10.10c displays the results of the response of a neuron to a test stimulus
    prior to and following adaptation and after recovery from the 30-secondlong inhibited
    period.


    This kind of psychophysical phenomenon illustrates that are presumed by many investigators
    to be direct molar concomitants of the selective filtering characteristics of
    single neurons in the nervous system.'
