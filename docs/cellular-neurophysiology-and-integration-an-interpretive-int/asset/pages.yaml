  md: '# 228 10. NEURONAL INTEGRATION


    the laboratory, and that it is not a process commonly utilized by most animals
    in their natural environments.


    This viewpoint may be too radical, but its expression does raise a number of important
    issues. The most significant one in the context of this discussion is whether
    the variations in performance observed at the cellular, network, and molar levels
    are identifiable with each other in such a way that one level is “explained” by
    the one below it. In our discussion of the Aplysia experiments in the chapter
    to follow, certain behavioral changes we describe seem to possess all of the qualifications
    for true learning. However, the analogies that have been drawn between learning
    in humans and Aplysia have been severely criticized. It has been suggested that
    the “learning” demonstrated in these primitive animals may more correctly be characterized
    as pseudoconditioning—a change in performance due to stimulus repetition rather
    than a true adaptive change. Whatever the outcome of this controversy, it is clear
    that some changes occur as a result of prior experience in the performance of
    synapses, cells, networks, and of both simple and complex organisms. Whether or
    not these processes are identifiable with each other will have to be decided by
    future research.


    # 5. Feature Filtering


    Another general aspect of neural net function is the process that has come to
    be called feature filtering. Feature filtering refers to the general process by
    which only selected attributes of a complex stimulus pattern are passed through
    the neuronal transmission system. A classic example is the accentuation of contours
    produced by lateral inhibitory mechanisms, already mentioned.


    In the early 1960’s a major revolution occurred in neurophysiological research.
    Until then all attention had been directed to neural responses by impulsive electrical
    stimuli, flashes of light, clicks of sound, or taps to the integument. Some investigators
    (Hubel & Wiesel, 1959; Levin et al., 1959) were concerned by the fact that these
    did not represent stimuli to which most animals ever respond. To the contrary,
    most animals respond with stimuli that are subtle variations in the arrangement
    of their natural environment. The essence of their innovation was the realization
    that, for example, a moving spot might indicate a fly to a frog, would be of greater
    biological significance than the artificial impulsive stimuli that had been popular
    in the laboratory. Therefore, both groups of investigators began experimenting
    with spatially and temporally patterned stimuli, and the results were truly astounding.
    Whereas unpatterned visual stimuli, even very bright ones, evoked only the most
    feeble movement with some particular movement or shape could evoke a very strong
    response.'
