  md: '# A. THE CONTEMPORARY SIGNIFICANCE OF NEUROPHYSIOLOGY 3


    the limits of our knowledge are rapidly reached when attempts are made to understand
    how even as few as three neurons interact collectively. of a far greater number
    must be involved in even the simplest information-processing act in the mammalian
    nervous system.


    It is for these reasons that researchers study relatively simple structures to
    elucidate some aspect of neural interaction. Invertebrates are commonly used,
    not so much because of any intrinsic interest in their function (how few, indeed,
    worry about the problem of innervation of the muscles that masticate food in the
    stomach of the lobster for its own sake?) but because these simpler creatures
    model some aspect of nervous function that may be generally applicable to the
    solution of the mind-brain problem in man. Even when working with higher animals,
    including man, we tend to study the function of relatively simple, well-ordered
    sensory receptor structures to find out about some special aspect of a more general
    nervous function. Much of what is known about inhibition in nervous nets, for
    example, has arisen from studies of crustaceans and vertebrate systems. Obviously
    this is a process of great significance throughout the phylogenetic tree, including
    all parts of the nervous system, and we can gain important understanding by generalizing
    from the primitive to the complex.


    As more is learned about the basic mechanisms that underlie complex processes,
    the focus of laboratory attention has shifted perceptibly in emphasis. During
    the 1950s and early 1960s an observer at a neurophysiological conference would
    have seen an almost complete absorption with the study of action potentials produced
    by single neurons. In the last 10 years, however increasing attention has been
    directed at interactions among neurons.


    In light of this modern emphasis on information processing in nets of neurons,
    it is important not to overlook another vital function of neurons, which is clearly
    intertwined with the processing aspect, but in many regards it is quite different.
    This, of course, is the function of communication. The necessity for neuronal
    communication links is obvious. Receptors and effectors are located at the periphery
    of the body. Yet the complicated information processing that links inputs from
    receptors to the biologically appropriate, adaptive effector responses generally
    occurs in the most centralized, interior portion of the organism. It is to and
    from the brain, in particular, that information must be communicated. In man this
    distance may be five or more feet, and in other animals even greater distances
    must be traversed. To depend upon the slow spread of excitable responses along
    an unspecialized cellular net would be behaviorally catastrophic; thus there is
    strong evolutionary pressure toward the development of rapid communication links
    in multicellular animals.'
