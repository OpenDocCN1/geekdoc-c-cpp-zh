    many experimental situations also require some sort of stimulating apparatus to
    elicit a neural response under controlled conditions. Over the years there been
    a substantial change in the sort of stimulators used in neurophysiological experiments.
    In the early days almost all stimulators were impulsive types; that is, they were
    designed to produce the briefest possible stimulus. Each stimulus pulse could
    vary only'
