    for microsurgery, it has proven useful in some electrophysiological recording
    situations.


    # C. PREAMPLIFIERS


    The purpose of the electrode-amplifier-display chain is to reproduce and record
    the amplitude and time course of the neuroelectric signal under investigation,
    as high fidelity as possible. But connecting electronic equipment to the delicate
    neuronal electrical source without distorting the waveform is not simple. In this
    section several possible sources of distortion are considered that could be produced
    by the preamplifier and the electrode-preamplifier interface. We will also consider
    ways in which this sort of distortion can be minimized.


    Microdes have considerable internal impedances. A electrode with a tip diameter
    of 1 micron may have an internal resistance on the order of 10 to 20 million ohms,
    and smaller electrodes may have internal resistances as high as 10 ohms. The internal
    resistance of the electrode and the input resistance of the preamplifier to which
    it is connected, along with the unavoidable stray capacitance of the wiring, therefore,
    form a resistance-capacitance voltage divider as shown in Fig. 4.4. Two problems
    are created.


    The first problem is one due to the internal resistance component of the electrode
    itself. The entire neural potential under study is effectively applied across
    the two ends (marked A and B) of the voltage divider shown in Fig. 4.4. But only
    a small portion of this voltage may be detected. This occurs because the part
    $v$ of the total applied voltage $V$ is sensed across a resistor in some series
    circuit is proportional to the ratio of the individual resistance value $r$ and
    the total resistance $R$, a relation that may be expressed as


    ```

    $v = \frac{r}{R}V.\quad(4.1)$

    ```


    Therefore, if the input resistance of the preamplifier is smaller or even comparable
    in magnitude to that of the electrode, only a portion of the'
