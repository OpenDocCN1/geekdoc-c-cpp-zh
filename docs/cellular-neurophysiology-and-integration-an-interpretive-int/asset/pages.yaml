  md: '# C. EXCITATION, INHIBITION: DEPOLARIZATION & HYPERPOLARIZATION 197


    what ionic mechanism suddenly allows the membrane to pass large numbers of transmitter
    molecules (the vesicles presumably having burst on the presynaptic side of the
    synapse), when previously only infrequent passages leading to miniature postsynaptic
    potentials occurred. These and some related issues represent the frontier of current
    research in the field. A full and excellent discussion of synaptic biochemistry
    can be found in Albers, Siegel, Katzman, and Agranoff (1972).


    # C. EXCITATION AND INHIBITION: DEPOLARIZATION AND HYPERPOLARIZATION


    Another major issue concerning synaptic transmission is the relation between the
    polarity of the postsynaptic potential and the excitation or inhibition of the
    neuron. As indicated earlier, synaptic activity may be either excitatory or inhibitory.
    Excitatory synaptic action results in the stimulation of the postsynaptic membrane
    in a way that increases the response of the cell. Synaptic action may also be
    inhibitory in a way that blocks or reduces the response.


    The graded postsynaptic potentials that can be measured during excitation are
    defined in terms of the direction of the effect and not the polarity of the membrane
    potential. Thus the potential measured during excitation is referred to as the
    excitatory postsynaptic potential (commonly abbreviated e.p.s.p.), while the potential
    recorded during synaptic inhibition is referred to as the inhibitory postsynaptic
    potential (i.p.s.p.).


    It must be very clearly remembered that these definitions are based upon the actions
    of excitation and inhibition and not the polarity of the measured voltage. The
    question of the relation to the polarity and the direction of the response is
    another matter.


    It turns out that e.p.s.p are always depolarizations and therefore the term "e.p.s.p."
    has acquired the additional meaning of a depolarizing synaptic potential. But
    to be very precise this is not exactly correct. Here becomes clear when the situation
    for i.p.s.p is considered. Here there appears to be no simple relation between
    inhibition and hyperpolarization and inhibition.


    Achieving an understanding of the relationship between inhibition and the polarity
    of the membrane is particularly important because there is considerable controversy
    among researchers concerning some critical points. Direct association between
    inhibition and hyperpolarization might at first also be assumed. Thus, the reasoning
    goes, if the postsynaptic membrane is hyperpolarized, excitation would require
    greater depolarization than would be required with with a normal resting potential.
    In other words, inhibition might be thought of as the sole effect of simply shifting
    the threshold for excitation and inhibition thus adding to the magnitude of the
    e.p.s.p.'
