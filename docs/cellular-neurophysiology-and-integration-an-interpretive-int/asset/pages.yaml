  md: '# 82 4. ELECTROPHYSIOLOGICAL TECHNIQUES


    The difficulty with a ramp comparison technique is the exceptionally long time
    required for the completion of the comparison. This is further complicated by
    another factor. In order to have equally spaced points, the period of each conversion
    has to be as long as the time required for conversion of the largest possible
    amplitude. This means that the rate at which signals are coded is very low, and
    for signals that changed appreciably in amplitude during the comparison interval,
    a sizable error could be introduced into the calculation. In other words, the
    coding used in this scheme of conversion is uneconomical because each increment
    in the amplitude scale requires another unit of time. This may be considered to
    be classification by exhaustive inquiry, rather than systematic exclusion of possible
    values by a deductive test.


    A satisfactory analog-to-digital conversion technique that uses a more logical
    approach is the method of successive approximations. This type of converter utilizes
    a much more economical code. Rather than counting each amplitude step, it essentially
    plays an electronic parody of the parlor game "Twenty Questions," classifying
    the signals into smaller and larger groups with each successive "question." Thus
    only a few successive approximations are required to identify a given amplitude,
    in contrast to the exhaustive testing of every possible amplitude that is characteristic
    of the ramp comparison procedure.


    The sampling frequency capacity of an analog-to-digital converter is also limited
    by the time taken for a signal conversion. However, successive approximation conversion
    may occur in little as 1 microsecond. Nevertheless, with a frequency so high that
    it varies at all during the conversion time it will be inaccurate encoded. Auxiliary
    input devices, called sample-and-hold circuits, have therefore been designed for
    use with the analog-to-digital converter to help overcome this limitation. A sample-and-hold
    circuit samples the magnitude of an applied voltage at the beginning of the conversion
    and holds a constant record of that initial value until the conversion is complete.
    This is accomplished by means of a storage capacitor, the charge of which follows
    the input signal during the preconversion period, but is electrically disconnected
    from an input signal as soon as the converter starts to perform its operation.
    When the capacitor is disconnected, it is not able to discharge through any other
    pathway, and the initial signal level is maintained.


    Often a single analog-to-digital converter may be called upon process signals
    arriving on a number of separate lines from sources. It is important to be able
    to select one of these lines for conversion at any given time. The process of
    selecting and connecting only one of possible signal lines is called multiplexing
    and can be accomplished either by relay contacts or by transistorized switches.
    An advantage of relays is that they have very low input impedances when the switch
    is closed and very large impedances when the switch is open. Thus there is'
