    Over the years, substantial changes in the philosophy of neurophysiological research
    have affected the design of stimulators. Perhaps the most important milestone
    occurred around 1960 when Hubel and Wiesel (1959) and Lettvin, Maturana, McCulloch,
    and Pitts (1959) discovered stimuli with various features in time and/or space
    (for example, dots, lines, corners, and edges moving in particular directions
    at particular speeds), were much more effective than simple impulses in eliciting
    neural responses in the visual system. This was so even when the patterned stimuli
    were considerably less energetic than the impulsive ones.


    As this trend toward more elaborately patterned stimuli continued, technology
    changed in some unusual ways. First it seemed there was actually a tendency toward
    simplification. The flashers and flickers of the past were not replaced by more
    elaborate stimulators, but by less complex ones. In many distinguished studies
    (see, for example, Hubel & Wiesel, 1962, 1965), Hubel and Wiesel have always used
    a simple light source projecting an appropriately shaped image, which is moved
    about manually within the visual field of the animal. The work of Lettvin''s group
    was done with an ingenious, though simple, stimulator that used magnets to move
    a stimulus about an aluminum frame placed in a frog''s field of vision.


    However, in recent years a number of investigators they wished to do to turn to
    more elaborate apparatus. Some, like Spinelli (1967) and Uttal (1969), have used
    computers to generate elaborate patterns of visual stimuli.


    A full discussion of the many types of physical stimulators that have been used
    in electrophysiological research is beyond beyond the scope of this book. The
    variety of photic, mechanical, acoustical, and chemical stimulation procedures
    is enomous. We cannot consider them in detail here, but the interested reader
    may want to look at another book by the author (Uttal, 1973, Chapter 2) for a
    more complete discussion of various means of stimulating neural activity. In this
    section only one kind of stimulator will be discussed—the electrical pulse stimulator.
    This one was chosen for two reasons.


    First, electricity is the most general of all stimuli that can be used to activate
    any part of the nervous system. It is the one stimulus that allows'
