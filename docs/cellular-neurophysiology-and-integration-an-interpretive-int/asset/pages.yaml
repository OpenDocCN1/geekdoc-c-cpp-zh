  md: '# B. RECEPTOR AND GENERATOR POTENTIALS 103


    The transduction of physical to electrochemical energies that occurs within the
    receptor cell also consists of a number of distinct and separable processes. The
    primary sensory action may be defined as the specific interaction between the
    stimulus energy and some part of the receptor that triggers actual energy conversion.
    From a certain perspective, the primary sensory action may also be considered
    to be a preneural process rather than a neural process itself. Nevertheless, it
    is the final and key preneural event that leads to the alteration of the resting
    membrane potential. Thus it is of special importance in our understanding of transduction.
    The primary sensory action must be defined and clarified in detail for each receptor
    type, because of each of these individual methods serves the same general purpose:
    the production of some change in the properties of the membrane that leads directly
    to that deviation from the resting potential that has come to be known as either
    the receptor or generator potential.


    # B. RECEPTOR AND GENERATOR POTENTIALS—A DEFINITION


    The infinitesimal amounts of energy involved in transduction make it clear that
    the essential parts of the process must occur at the molecular level. Some change
    in the permeability of the membrane, produced by a stimulus, presumably leads
    to a momentary fluctuation of the resting potential. This initial fluctuation
    is observed in all receptors in the form of a transient, graded shift in the potential
    measured across the membrane. This graded potential cannot itself be propagated
    to distant neural locations, but it can act as a precursor for signals that can
    be conveyed over long distances. Two generic terms have been applied to this intra-receptor
    fluctuation; it may be referred to as either a receptor or a generator potential.


    The distinction between a receptor and a generator potential is based on an anatomical
    rather than a functional difference, depending on whether the receptor itself
    is a specialized terminal portion of a neuron with its elongated axon, or whether
