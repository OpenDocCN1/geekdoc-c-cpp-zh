    # C. PATTERNS OF EXCITATION AND INHIBITION


    The fact that the action of a driver cell may be inhibitory or excitatory is only
    one suggestion that the analysis of even simple nerve networks is not a routine
    straightforward task. Indeed, an analogy may be drawn between the many-body problem
    in classical physics and the problem of the multiple neuron interaction. Just
    as the mathematical solution of the manybody problem becomes increasingly intractable
    as the number of interactions increases, so does the problem of interacting neurons
    increase in complexity as the number of neurons and the kinds of interactions
    increase. There are many ways in which nervous interactions are more complicated
    than gravitational ones. In this section we consider exemplary empirical observations
    that illustrate some of these complexities and shall try to clarify how much progress
    has been made so far in understanding them in Aplysia.


    Perhaps the most thorough analysis of any nervous net in any organism is that
    done (e.g., Kandel, Frazier, Waziri, and Coggeshall, 1967) on a small system of
    cells in the abdominal ganglion of the Aplysia, which centers around the action
    of driver cell L10. These investigators have made sufficient progress to allow
    them actually to draw a tentative wiring diagram of the group of involved neurons.
    This diagram, which would have been impossible ten years ago, illustrates for
    perhaps one of the first times in human history, a situation in which the action
    of specific, identified neurons is used to account for the molar aspects of behavior.


