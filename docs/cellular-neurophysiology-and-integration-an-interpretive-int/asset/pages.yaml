  md: 'According to this model, the membrane changes its permeability in a complex
    manner. The arrival of a packet of an inhibitory chemical transmitter seems to
    increase drastically the permeability of the membrane to the flow of potassium
    and chloride ions. This change in permeability is the fundamental reason for the
    polarity changes observed in inhibitory postsynaptic potentials.


    A major, related question concerns whether or not one neuron can exert both excitatory
    and inhibitory effects. It was generally assumed until recently that inhibitory
    and excitatory postsynaptic potentials were produced by separate cells manufacturing
    specific products that compose the transmitter substance. A given cell was presumed
    to produce only one substance that was exclusively excitatory while another solely
    produce a different substance that was exclusively inhibitory. If the first cell
    connected to a neuron, the postsynaptic cell was always excited; if another secreted
    an inhibitory substance was connected, the postsynaptic cell was inhibited.


    However, Wachtel and Kandel (1967) found a very significant exception to this
    presumption. They discovered that one of the neurons in the well-mapped abdominal
    ganglion of the sea hare Aplysia* has both inhibitory and excitatory effects on
    the cells with which it made synaptic contact. Even more surprising, it seemed
    that the cell could have either an excitatory or an inhibitory effect at the same
    synapse! The difference in action in each case was related to the rate at which
    the presynaptic fiber was electrically stimulated. Wachtel and Kandel inserted
    a microelectrode into the postsynaptic cell, and by passing a pulsed current through
    the microelectrode, they were able to produce a single spike action potential
    time the current was pulsed. When the neuron was stimulated at low and moderate
    rates, another microelectrode in the postsynaptic neuron picked up an e.p.s.p.
    sufficiently large for it to usually produce a spike action potential each time.
    When the presynaptic fiber was stimulated at a faster rate, the response of the
    postsynaptic fiber changed drastically. The depolarizing e.p.s.p. changed to a
    hyperpolarizing i.p.s.p. and the cell ceased responding.


    Even this is one most unique preparation and the effect occurs in an animal far
    down on the phylogenetic tree, it raises the possibility that vertebrate synapses
    may also be inhibitory or excitatory, depending on seemingly irrelevant as the
    frequency of the incoming impulses. If so, the possible complexity of interactions
    among neurons in a simple nerve net increases drastically.


