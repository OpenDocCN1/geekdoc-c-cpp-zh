    # B. THE BIOCHEMISTRY OF SYNAPTIC ACTION


    Although our discussion has already covered the general biochemistry of synaptic
    action, the Aplysia has been so especially useful as a model system in acquiring
    new knowledge about ionic mechanisms it we'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# B. THE BIOCHEMISTRY OF SYNAPTIC ACTION 243


    worth considering some new developments before turning to the network aspects
    of integration in this animal.


    To review briefly synaptic action, the reader should remember that it is now believed
    presynaptic activation of a neuron stimulates it to release graded amounts of
    various transmitter substances that migrate across the very small synaptic cleft
    to the postsynaptic membrane, where they are picked up by specialized receptor
    sites. These transmitter substances are capable of modifying the postsynaptic
    resting potential by varying the permeability of the receptor sites in a way that
    leads directly to the generation of spike action potentials at other neuronal
    sites specialized for this conversion.


    In this section we shall concentrate on the nature of the transmitter substances
    and the receptor sites, and briefly mention possible chemical mechanisms that
    might account for the alteration of the membrane potential on postsynaptic neurons
    of Aplysia, in particular. First, however, we reexamine, briefly, a general notion
    that now appears to be in need of considerable modification.


    It has been assumed for many years, since the earliest synaptic transmitters were
    identified, that there separate excitatory and inhibitory chemicals. The idea
    that a given substance could operate on a generalized postsynaptic receptor site
    to produce either an inhibitory or an excitatory response but not was supposed
    to be determined by the nature of the transmitter substance rather than that of
    the receptor site. Thus, some substances as acetylcholine were assumed to be exclusively
    excitatory; others such as GABA were assumed to be inhibitory. As we saw in Chapter
    9, recent work, particularly in invertebrate preparations (Wachtel & Kandel, 1967),
    indicates that this notion is probably incorrect. It appears that a single transmitter
    substance is capable of producing either inhibitory or excitatory effects, depending
    upon the frequency of presynaptic stimulation and, presumably, the nature of the
    receptor site upon which the substance impinges.


    This question of multiple effects of each transmitter substance, of course, is
    intimately related to the question of whether or not a single neuron is capable
    of producing more than one kind of transmitter substance. A generally accepted
    rule of synaptic organization has been that a neuron is capable of producing only
    one transmitter substance. This rule has been referred to as “Dale''s principle.”
    It appears that Dale''s principle must still be considered to be valid—a single
    neuron is a chemical factory for only one type of transmitter. The fact that a
    single neuron may both excite and inhibit seems to be solely by the differential
    response of the postsynaptic receptor sites to the single chemical.


    A much more detailed understanding of the varied nature of Aplysia postsynaptic
    receptor sites has forthcoming in recent years. In 1972'
  merge: -1
  pgno: 266
- img_proc: true
  md: '# 244 11. APLYSIA: ANATOMY AND PHYSIOLOGY OF A MODEL PREPARATION


    a very important series of papers was published by Keoe (1972a, 1972b, 1972c)
    and Ascher (1972). In brief, from their findings, it appears that there are as
    many as five different kinds of receptor sites in Aplysia, three of which are
    sensitive to acetylcholine and two of another substance, dopamine, known to have
    considerable synaptic efficacy. Usually, more than one of the five types of receptors,
    including both excitatory and inhibitory sites, appear to be on the same cell.
    Cells in certain locations predominantly excitatory sensitivity, while others
    elsewhere in a ganglion appear to have a finer inhibitory sensitivity. Indeed,
    different parts of the same cell may exhibit specific sensitivities to different
    transmitter substances.


    Kehoe (1972b) has shown that a single transmitter substance, acetylcholine, ionophoretically
    injected into an Aplysia pleural ganglion neuron, can evoke three kinds of responses.
    In cells located near the middle of the ganglion, a two-component inhibitory response
    is produced, consisting of first a rapid, spike-like postsynaptic hyperpolarizing
    response, and next a longer-lasting (as long as 20 seconds) response. This longer
    response is hyperpolar when the resting membrane potential is more than -60 mV.
    However, when the membrane potential is more negative than -60 mV, even the rapid
    component remains much the same as it was at more depolarized levels, the long
    component is reduced in amplitude. At even greater clamped membrane hyperpolarizations
    it is converted to a depolarization. Figure 11.5a shows a combined rapid and slow
