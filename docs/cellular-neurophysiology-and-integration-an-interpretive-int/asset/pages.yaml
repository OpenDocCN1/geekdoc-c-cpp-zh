    The currently accepted answers to these questions are based primarily on the work
    of Hodgkin and Huxley (see, for example, Hodgkin & Huxley, 1952b, and Hodgkin,
    1958), who received the Nobel Prize in 1963 for their description of the ionic
    basis of nerve membrane activity. Other important contributions include Keynes
    (1951) and Cole (1968). The theory to which they all have contributed a number
    of key points:


    +   1. The state of the membrane potential at any point in time is primarily a
    function of the sodium and potassium ionic distributions present at any time.

    2. The concentrations of the ions are functions of membrane permeability, as well
    as the sodium-potassium pumping action. Therefore, the potential across the membrane
    is also a function of the permeability of the membrane.

    3. However, membrane permeability is also a function of the potential across the
    membrane. Specifically, for sodium and potassium, the greater the membrane depolarization,
    the greater its permeability to these two ions. This is a critical point, because
    it establishes a positive feedback cycle that almost totally accounts for the
    regenerative (positive feedback) process that results in the spike action potential.
    The greater the depolarization, the greater the permeability; and the greater
    the permeability, the greater depolarization. This statement holds true until
    depolarization has peaked, at which point sodium permeability begins to decrease
    very rapidly again. It is this reversal and abrupt decline in sodium permeability
    at maximum depolarization and the effect of a slightly delayed increase in potassium
    permeability that prevents a depolarized membrane from remaining until the much
    slower pumping action can restore the resting potential.

    4. The increase in permeability to sodium and potassium does not occur at the
    same rate. This is the critical factor that accounts for the rapid rise and subsequent
    fall of the membrane potential, and thus the spike-like shape of the waveform.'
