  md: '# 5 THE CHEMICAL BASIS OF NEUROELECTRIC ACTIVITY: THE RESTING POTENTIAL AND
    A TAXONOMY OF ACTION POTENTIALS


    The ultramicroscopic membrane that surrounds a neuron and demarcates it from neighboring
    cells does more than merely contain the cytoplasmic gel. Fluctuations in the permeability
    characteristics of the membrane are the source of all neuroelectric activity.
    The membrane accomplishes extraordinary functions because of its ability to pass
    some ions into or out of the selectively, while barring the movement of others,
    and to individually vary the permeability to various ions over time. This variable
    selective and differential permeability to ions at the molecular level is thus
    the ultimate source of all responses at the behavioral level.


    It must be emphasized that the following introduction to membrane processes is
    based on an admittedly incomplete model of ionic transport and equilibrium mechanisms.
    Although some of the basic notions are well established (for example, sodium and
    potassium ions are definitely known to be the primary ones involved in the ionic
    balances underlying both the resting and action membrane potentials), other important
    concepts (such as the detailed nature of the sodium-potassium pumping mechanism)
    are not yet fully understood. The material discussed in this chapter is presented,
    therefore, within the context of a developing theory of nerve membrane that is
    acceptable, fruitful, and useful, but does not yet fully explain all the involved
    molecular and ionic processes. The reader should bear in mind that the “facts”
    presented and the model itself are highly susceptible to revision or outright
    rejection as new information becomes available.'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# 5. CHEMICAL BASIS OF NEUROELECTRIC ACTIVITY


    The following discussion is intended simply to introduce some basic concepts and
    a vocabulary that can be used in the more detailed discussion of action potentials
    in the chapters that follow. It is not intended to be complete. The reader interested
    in a more complete discussion is referred to Cole (1968), Aidley (1971), or Tosteson
    (1969), or for a highly mathematical treatment, to Plonsey (1969).


    Electrochemical potentials exist across a membrane when the concentrations of
    ions differ from either side of the membrane. However, if the membrane is permeable
    to any of the involved ions there will be forces acting to alter these concentration
    differences. Some of these forces are passive, in the sense that they draw upon
    the potential energy of the concentration difference itself to reduce that difference.
    On the other hand, active forces are also work across the membrane. By an active
    force, we mean a process that draws energy from the metabolic processes of the
    cell in a way that may actually increase the concentration difference and thus
    the resulting electric potential across the membrane. Let us consider these two
    categories—passive forces and active forces—in the following paragraphs.


    # A. PASSIVE FORCES


    # 1. Diffusion


    If two solutions, each containing a different concentration of solute, are separated
    from each other by a membrane that is at least partially permeable to that solute,
    molecules of the solute can pass by diffusion from one solution to the other.
    Random Brownian motions of the molecules of the solute totally account for this
    process and no metabolic energy is expended. The degree of diffusion is exactly
    that predicted by simple statistical-mechanical principles, i.e., on the simple
    statistical basis of random motion, concentration differences tend to average
    out. In the initial state, when high original concentration differences are present,
    a low degree of entropy (disorder) is said to exist; there, concentrations are
    very nonrandom (there is more solute on one side than the other). If the membrane
    is able to pass molecules of the solute, the process leads to higher degree of
    entropy (greater disorder) of the molecules (the solute is considered to be more
    randomly distributed and in a state of greater disorder when the concentrations
    are equal). Since the ideal membrane we are discussing is assumed not to act in
    a selective direction (ions flow equally well in both directions), this increase
    in entropy occurs simply because more molecules would be expected randomly to
    cross the membrane from the high concentration side than from the low'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# A. PASSIVE FORCES 89


    concentration side. Passive diffusion resulting from purely statistical distributions
    of molecular motion, therefore, can only result in equalization of the solute
    concentrations in the two solutions.


    # 2. Osmosis


    Assume a similar semipermeable membrane partitions off two different concentrations
    of a common solute in a common solvent. Assume also that the membrane is impermeable
    to the larger solute molecules, but will pass at least some of the smaller molecules.
    Under these conditions the solvent will migrate from the side of low solute concentration
    (high solvent concentration) to the side of high solvent concentration (low solvent
    concentration) in a way that also tends to equalize the two concentrations. Osmosis
    may therefore be considered as a force that works primarily in the direction that
    reduces the solute concentration difference of the two solutions by transport
    of the solute. Osmosis, however, is not simply diffusion of the solvent. The energy
    involved in osmotic pressure is usually greater than predictable from simple diffusion
    forces, in spite of the fact that Brownian motion is presumed to be the driving
    force for both processes.


    # 3. Potential Driving


    If the solute is ionized, as it always is in cases involving dissolved salts,
    then, as we noted earlier, an electrical potential difference between the two
    sides of a semipermeable membrane can also exist simply by unequal net charge
    arising across the membrane. For example, if there are more positively charged
    cations on one side of a membrane than the other, the side with fewer has a net
    negative potential relative to the other, both because of the ratio of cations
    and the ratio of anions left behind.* This potential difference will tend to move
    some of the positively charged ions from the side where they are in to the other
    side of the membrane. Ion movements due to potential differences of this sort
    are said to be running downhill, since they reduce large concentrations and potential
    differences to smaller ones. Passive potential driving can, therefore, also be
    seen as forcing concentration differences across a membrane toward equality, just
    as diffusion and osmosis do.


    > * The reader might receive the impression from this discussion that large numbers
    of charges are involved. In fact the total numbers involved in neural membrane
    potentials are very small—only one in every 100,000 or so of the charged ions
    inside a cell moves inward or outward—and the charge distribution effects are
    mainly localized within 20 angstrom units of the membrane. These facts should
    be kept in mind when one begins to consider the absolute rather than the relative
    magnitudes of ion flux.'
