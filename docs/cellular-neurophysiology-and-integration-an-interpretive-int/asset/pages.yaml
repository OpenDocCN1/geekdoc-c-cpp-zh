  md: '# C. ANATOMY OF TRANSMISSION NEURONS 53


    The myelin surrounding peripheral axons is an extraordinary substance. It is formed
    by a sequential build-up of multiple and overlapping layers of the wall of specialized
    accessory cells, called Schwann cells. Schwann cells appear in close association
    with the neuron early in its embryological development. The Schwann cell has the
    dynamic capacity to encircle the axon by means of both physical growth and actual
    migration. Figure 3.19 shows this enveloping process. The Schwann cell is only
    loosely attached to the neuron at the beginning of development, but as it matures
    it grows in such a way that successive layers of its own cell membrane are deposited
    around the axon. Finally, the Schwann cell itself becomes little more than a nucleus
    hidden away among the folds of its own hypertroph cell wall.


    It is thought that Schwann cells may also perform a metabolic service for the
    axon. This notion, while not yet well established, is based on the idea that some
    parts of the axon are so far from their own cell body that they cannot adequately
    be serviced by the usual intracellular flow of metabolites. Intercellular perfusion
    of metabolites from the Schwann cell nucleus might be utilized by the axon for
    its own maintenance.


    The layered appearance of the myelin sheath is shown especially clearly in the
    electronmicrograph of Fig. 3.20. Darker lines are due to contacts


