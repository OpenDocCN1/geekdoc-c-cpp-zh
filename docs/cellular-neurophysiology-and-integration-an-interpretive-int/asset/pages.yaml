    NEUROANATOMY


    Each of the various types of cells that make up the body is specialized to perform
    one of the general life functions in a particularly efficient manner. Neurons,
    the cells of greatest interest in this text, have been specialized under the influence
    of evolutionary forces so that the stimulation of one portion of a cell may result
    in action at some distant locus. Thus, the generalized excitability of the prototypical
    cell has evolved into a capacity for specialized information transmission and
    integration between among networks of neurons. We may therefore consider the primitive
    excitability of a single generalized cell as the antecedent of all psychological
    and behavioral responses.


    What are the fundamental premises of the current theory of neuronal anatomy? Basically,
    it is agreed that each neuron is anatomically separate and distinct from all others.
    Specifically, this means that each neuron is completely surrounded by its own
    cell membrane. This is not to say that cells are also physiologically independent
    because a basic axiom of modern neuronal theory is that neurons do interact. However,
    it has now been incontrovertibly established that they do so primarily at intercellular
    regions called synapses. The interaction between the cells may be quite intimate;
    small molecules and charge carriers such as ions do move between the gap between
    two cells, but most of the intracellular material, as well as cell metabolism,
    is sharply delimited at the membrane. Even when the membrane of one neuron is
    fused to the next one (a tight junction), the intracellular contents of the two
    cells are mainly isolated from each other.


    Interaction at a synapse is an intricate process in which the information being
    communicated or processed by the neuron is encoded, transmitted, and decoded several
    times. The information may be represented by spike, graded potentials, or even
    the amount of certain chemical transmitter sub-'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# A. GROSS ANATOMY OF THE HUMAN NERVOUS SYSTEM 25


    stances here. Although we discuss all of these matters later, the important point
    to note here is that intercellular transmission is a communication process that
    does not take place through protoplasmic continuity. While most synapses have
    only a very small gap between the cell membranes of the transmitting and the receiving
    neurons, there is almost always a proto- plasmic discontinuity. This cleft in
    a chemical synapse may be less than 1/20 of the wavelength of visible light—only
    a few hundred angstrom units. Nevertheless, in spite of these small dimensions,
    there are measurable delays, observable electrochemical events, and direct electronmicroscopic
    evidence that demonstrate that neurons in the nervous system are separate and
    distinct cells.


    The high level of neuronal specialization and unity of function has not led to
    a single standard nerve cell type. There are many different neuron shapes to be
    found in various portions of the nervous system. Some are highly specialized for
    communicating information over very long distances, while others are specialized
    for the integration of several sources of nervous activity within a local region
    of central nuclei. The former, the com- munication type, is usually characterized
    by nondecremental, i.e., constant amplitude, conduction. The latter, the integrative
    type, is usually characterized by the extreme arboriza- tion of some of its terminal
    branches. Integration is, however, property. Integration is, however, a property
    of most neurons; every receptors and the last neuron in a motor chain can perform
    integrative functions. In addition, receptor cells have unique stru- ct adaptations
    for carrying out the special function of converting one or another kind of physical
    energy into patterns of neurochemical energy.


    Despite great diversity of anatomical form, all neurons contain homolo-ous parts.
    Some of the common features are shared by all living cells. Others, however, are
    specific to neurons and reflect the nature of the spe- cialize they have undergone
    during their evolution.


    In this chapter we first briefly introduce some of the great anatomical features
    of the nervous system. We then consider various examples of the receptors, and
    neurons specialized for transmission and integration, respect-ively, with the
    intent of alerting the reader to the great variety that can be observed in neuronal
    anatomy. This chapter then concludes with a dis cussion of the ultramicroscopic
    nature of the neural membrane—that re- gion of demarcation, only a few molecules
    thick, that plays such an impor- tant role in nervous action.


    # A. GROSS ANATOMY OF THE HUMAN NERVOUS SYSTEM


    It has been said that the human nervous system is perhaps the highest development
    of organic evolution and the most complex structure that has ever existed. Although
    the human brain is not the largest in either an abso-'
