  md: '# PREFACE


    Because of its general importance to a number of related disciplines, students
    of the modern science of neurophysiology have benefited from time to time from
    an introductory survey presented at a more elementary level than is usually found
    in advanced textbooks. This role was played by Brazier''s (1951) pioneering book
    entitled Electrical Activity of the Nervous System, then by Stevens'' (1966) A
    Primer of Neurophysiology, by Katz''s (1966) Nerve, Muscle and Synapse, and most
    recently by Hodkin''s (1967) The Conduction of the Nervous Impulse.


    The dynamism of the field is such, however, more up-to-date statements incorporating
    many of the exciting new findings concerning cellular neurophysiology are required
    periodically. This text is aimed at filling that need. It is an outgrowth of a
    part of the course on the neurophysiology of sensory processes taught by The University
    of Michigan during the last ten years. This book is an attempt to present the
    subject matter at a level appropriate for advanced undergraduate students and
    first year graduate students whose knowledge of chemistry, physics, and mathematics
    is limited to introductory courses.


    To accomplish this, a number of the more esoteric of neurophysiology have been
    presented in a more qualitative form than is usual. Throughout the text, a model
    of neural action based upon simple ionic concentration differences is emphasized,
    rather than the much more difficult and complete physical chemistry approach emphasizing
    electrochemistry found in more advanced texts. The material has also been organized
    in what is believed to be an improved logical sequence involving a develop-'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# xii PREFACE


    ment based on both increasing anatomic complexity and the direction of information
    flow in the nervous system.


    Most important of all, however, an extra effort has been made to interpret and
    make clear the significance of the biological findings. In every instance possible
    the author has tried to explain why a particular finding is important and what
    the questions are that led to the asking of a particular experimental question.
    If the book is to achieve its particular goal, this is what is hoped it does better
    than any of its predecessors.


    The subject matter of this book—cellular neurophysiology and integration—is contemporary,
    relevant, and important. With regard to these issues it stands on its own foot.
    Though theoretical and experimental neurophysiology will probably not add to the
    variety of foods in our larder solve the energy or population problems, it is
    a field that probably more than any other may help to provide the basis for an
    understanding of ourselves and of the essence of human nature. What is the origin
    of mental life? How is it that we are the special and unique entities we are?
    How can we solve the problems that relate—man''s relationship to himself and to
    his fellow man? These are the questions that will be important in the next millennium,
    and these are the questions whose solutions require insights from neurophysiology.
    In the long run (that is the target range towards which at least some of us must
    keep in, in time of pressure for immediate “relevance”) the nature of the nervous
    system, and with all of the related medical, sociological, and psychological issues,
    will remain the major intellectual challenges.


    No author of a textbook such as this can claim to have done all the work himself.
    The works of the many distinguished scholars that have been cited in the body
    of the text contributed directly to the book''s organization. The indirect influence
    of many other scientists will be clear to any informed reader. Specifically Professor
    Stephen Easter The University of Michigan''s Zoology Department did me the courtesy
    of reading and commenting on the entire manuscript. The book is much improved
    because of his efforts. Professor James Ranck The University of Michigan''s Physiology
    Department also helped enormously by reading and commenting on a number of early
    draft chapters. Much of this was written while I was a visiting researcher at
    the University of Hawaii''s Sensory Sciences Laboratory. I am grateful to the
    trio of co-directors, Dr. Robert Cole, Ian Cooke, and M. E. Bitterman for their
    cordial hospitality in stimulating environment. I am also grateful to Ms. Lynn
    Gore for her competent typing and editorial advice and to Ms. Lillian Weigum,
    who assisted with typing of the final manuscript. Ms. Thelma Einstein energetically
    helped me through the final run of figures and bibliographies as well compiling
    the index.


    As ever, my wife May provided the wisdom and support that makes any task of mine
    possible.


    William R. Uttal'
