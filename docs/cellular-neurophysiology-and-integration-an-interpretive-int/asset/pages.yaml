    a statistical summary of the behavior of a population of neurons. In one case,
    when the electrical stimulus was used the statistical summation was accomplished
    by the nerve itself. In the other, the statistical summation was produced by an
    external device—the cross-correlator. The obvious conclusion is that the electrically
    stimulated response in no way distorts the true pattern of the response. There
    are no additional or extraneous factors inserted by the nonphysiological synchronization
