    # 2. The Voltage Clamp


    The fact that in the plasma membrane a sudden increase in permeability to sodium
    occurs when a nerve cell fires a spike potential is one piece of evidence that
    suggests some functional relationship exists between membrane potential and ionic
    current. Under ordinary conditions it is very difficult to determine the details
    of this relationship because of the complexity and rapidity of the chemical dynamics
    involved. An experimental alternative that locks the parameters of a membrane
    at a constant value and allows their static measurement has been developed by
    Cole (1949). His technique for electrically forcing the membrane potential to
    a predetermined value and holding it is now known as a voltage clamp.


    Voltage clamping of a neuronal membrane is implemented by a special type of feedback
    amplifier. The device is designed to sense the momentary voltage across a membrane
    and instantaneously apply a “bucking” or counter-current that has the polarity
    and amplitude to bring the membrane to any desired constant potential. With proper
    adjustment, potentials may be maintained at levels quite different from their
    resting potential, and current permeability measurements may be made while the
    membrane potential is locked at a fixed value. A disadvantage is that rather large
    electrodes must be used with the voltage-clamping amplifier in order to avoid
    local variations in membrane voltage, a condition that might lead to ill-defined
    variability or nonhomogeneity in the response. Such a situation would result in
    an averaged value that might not reflect the real membrane condition.


    Figure 7.8 illustrates a typical voltage-clamping apparatus that has been set
    up to detect the membrane potential and to generate the current needed to clamp
    it at some voltage desired by the experiment. After the initial transients that
    are associated with membrane capacitance charge and discharge and the establishment
    of ionic equilibria have settled down, Ohm’s law, I = E/R1, the relation between
    the current I and the potential E, is a direct measure of membrane resistance
    R or conductance (1/R).


    One typical result of a voltage-clamp experiment is the finding discussed above,
    membranes clamped at potentials more positive than the resting potential display
    very low resistance (that is, high permeability) to currents of the sodium ion
    carrier. The exact function relating permeability and potential can be plotted
    by varying the clamping voltage from the resting potential level to the peak value
    of the spike. Figure 7.9 shows such a membrane potential-permeability function
    for a typical fiber (as a function of the time after the clamp was applied).'
