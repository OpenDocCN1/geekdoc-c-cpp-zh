    For 1-millisecond-long spike action potentials, a band pass from 300 to 2000 Hz
    would be desirable. For evoked brain potentials, a range of 3 to 300 Hz would
    be preferred.


    # D. POWER AMPLIFIERS


    The purpose of the preamplifier is to replicate the tiny signal picked up by an
    electrode in introducing as little additional electronic noise as possible. Low
    noise level is usually best achieved when only a modest amount of amplification
    occurs in the preamplifying first stage. However, the voltage and current capacities
    of the preamplifier are usually insufficient to drive display and recording equipment,
    upon which recorded signals are presented to the experimenter. Usually, therefore,
    another stage of power amplification is required to provide adequate input power
    levels to those displays. While in modern equipment the actual power amplification
    components are distributed (some of it) may be constructed into the preamplifier
    or into the display equipment), the function of power amplification must still
    be present in the overall system.


    Power amplifiers usually give a substantial voltage boost, but probably more important,
    they provide sufficient current-driving capability to force even fairly massive
    indicators, the stylus of a pen recorder, to new positions in short periods of
    time. This allows even fairly varying signals to be traced. Emphasis has, therefore,
    been placed on development of high-power amplifiers with short time constants
    for rapid response. Depending on whether an oscilloscope or a pen recording display
    is used, the current requirements of the power amplifier may vary substantially.


