  md: '# G. TRANSDUCTION IN THE GUSTATORY RECEPTOR 135


    # G. TRANSDUCTION IN THE GUSTATORY RECEPTOR


    +   1. Primary Sensory Action in Gustation


    Gustation is a sense that seems to be mediated by direct chemical inter-actions
    between molecules of the stimulus and the constituent molecules of the taste receptor
    cells. Yet the very directness of this chemical action makes our knowledge of
    the primary sensory action less complete than for some directly activated modalities.
    The primary processes involved in taste are so microscopic that it is not yet
    even clear where the site of the primary sensory action resides. It is speculated
    that the significant chemi-cal action occurs at specialized portions of the microvilli
    of the gustatory receptor cells.


    Because of this uncertainty and difficulties with stimulus control, re-search
    in the area of gustatory transduction has concentrated on problems that are amenable
    to chemical analysis. For example, attempts have been made for many years to find
    chemical correlates of the four classic funda-mental tastes—sweet, sour, bitter,
    and salty. It should be emphasized, how-ever, even that the notion of a “fundamental
    taste” is an idea drawn from the loosest analogy between visual color-mixing ideas
    and gustation. While this analogy may have useful pedagogic value, the lack of
    a single dimension of variation, comparable to photonic wavelength, makes it a
    weak one. This is particularly so in light of the fact that correlations between
    chemical structure and taste are incomplete, at best. Furthermore, taste scientists
    have generally found it difficult to create complex tastes from mixtures of the
    four fundamentals. There is much more going on in the tongue than where quality
    does seem to be a relatively simple additive mixture of a set of fundamental stimuli.


    Pfaffmann (1959), in a comprehensive review of the taste literature over the 1950s,
    describes the tentative, inconsistent nature of the associations that have been
    made between taste and chemical structure. Sourness, for example, seems to be
    a function of the pH or acidity of a solution. The greater the number of hydrogen
    ions present, the greater the sourness of a substance. To confuse the issue, not
    all acids are sour. Amino acids are sweet, and picric acid is bitter.


    A sensation of sweetness also results from stimulation with a wide variety of
    dissimilar substances. Typically, organic molecules are the ones that taste sweet,
    but so do heavy metal salts of lead and beryllium. This probably accounts for
    the high incidence of lead poisoning in children in poverty situations. Lead salts
    from painted walls are a dangerous substitute for the sucrose or lactose of candy
    or milk.


    Dzendolelet (1968) has suggested that a common feature of sweet-tasting substances
    is that they have some molecular bonding arrangement that'
