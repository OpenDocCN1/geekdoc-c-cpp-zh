  md: '# 6. INTRODUCTION


    From this point of view, the study of cellular neurophysiology is dominated by
    its directionality, rather than by levels of anatomical complexity.


    In this book the author has tried to maintain both threads of the discussion simultaneously.
    In a few instances, the thread must deviate from a strictly parallel route, in
    order to avoid premature discussion of material for which the prerequisites have
    not yet been introduced. But in general we shall be progressing from the microscopic
    to the more macroscopic while simultaneously following the stream of information
    flow from the periphery to the central nervous system and then to the periphery
    once again.


    Chapters 2 and 3 contain the first dispersions. In order to set the stage for
    the cellular neurophysiological details to follow, two bodies of background information
    must first be considered. The first, presented in Chapter 2, is a brief historical
    survey, to place the discussion in the context of its intellectual origins. Though
    some of the ideas of modern neurophysiology are surprisingly antique (for example,
    the notion of the cell membrane was originally proposed around the turn of the
    century), much supporting evidence for some of the most widely accepted theories
    did not appear until the 1940s. Chapter 3 briefly presents some details of the
    gross anatomy of the nervous system, in sufficient detail to introduce the reader
    to the locus of various tissues that are discussed in later chapters. A brief
    anatomy of the microstructure of neurons and receptor cells is then presented.
    Chapter 3 concludes, at an even finer level of neuroanatomy, with a discussion
    of the anatomy of the cell or plasma membrane, a tissue of the utmost importance
    to our later discussion.


    Chapter 4 presents a discussion of modern neurophysiological research techniques,
    information required for understanding the experimental data to be discussed in
    later chapters. Chapter 5 first specifically introduces what is meant by the neuron
    theory, the now universally accepted notion that the nervous system is made up
    of functionally separate cellular units rather than an interconnected reticulum
    or network. The discussion then turns to a consideration of how the distributions
    of ions across the membrane are produced by the various passive and active forces
    that operate on chemical ions and how those distributions of ions rise to potential
    differences, particularly the so-called resting potential. Finally, a taxonomy
    of membrane potentials is presented.


    Once it has been established how resting potentials can be developed by metabolic
    engines within the membrane, several subsequent chapters are dedicated to explorations
    of how the resting potential can be perturbed to carry information to other parts
    of the nervous system. Chapter 6 discusses the initiation of membrane action potential
    by physical energies. This, of course, is the function generally known as transduction.
    Transductive mechanisms are considered separately for each of the senses,'
