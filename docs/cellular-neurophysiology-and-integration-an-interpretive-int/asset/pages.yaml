  md: '# 262 11. APLYSIA: ANATOMY AND PHYSIOLOGY OF A MODEL PREPARATION


    To demonstrate heterosynaptic facilitation, a stimulus is applied to one of the
    nerves feeding into the selected ganglion. The amplitude of this stimulus is then
    adjusted to a relatively low value so that it produces only a small postsynaptic
    potential in a cell impaled with a microelectrode. This relatively weak test stimulus
    is then paired with another stronger stimulus, applied to another of the nerves
    feeding into the ganglion. This second stimulus, usually referred to as the priming
    stimulus, in the terminology originally suggested by Tauc and his co-workers,
    is adjusted so that it is capable of producing a vigorous response in the responding
    cell. If the test and the priming stimulus are paired repeatedly over approximately
    a three-minute period, a subsequent presentation of the test stimulus alone will
    produce a greatly enhanced postsynaptic potential. The typical time course of
    the facilitation is shown in Fig. 11.13. As can be seen in this figure, the facilitation
    can last for over 15 minutes—an extraordinarily long time—and also, at its maximum,
    closely approximates the response level of the original priming stimulus.


    According to Kandel and Tauc (1964, 1965), only certain cells found within the
    abdominal ganglion of Aplysia display heterosynaptic facilitation. Most cells
    of the ganglion exhibit no change in response, but in no case did any cells exhibit
    a facilitation without the paired stimuli. The fact


