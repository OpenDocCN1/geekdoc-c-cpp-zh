  md: '# C. ANATOMY OF TRANSMISSION NEURONS 49


    cells themselves, but the context in this case is that of a synaptic junction
    in contact with a preceding cell rather than an energy transducer in contact with
    the physical environment.


    The best way to summarize these modern and precise definitions of the neuronal
    parts is to know Bodian''s definitions in full:


    **Dendritic zone:** the receptor membrane of a neuron, either consisting of a
    set of tapering cytoplasmic extensions (dendrites) which receive synaptic endings
    of other neurons or differentiated to convert environmental stimuli into local-response-generating
    activity.* Mitochondrial concentrations may be present.


    **Axon:** a single, often branched and usually elongated, cytoplasmic extension
    morphologically and perhaps uniquely differentiated to conduct nervous impulses
    away from the dendritic zone. It is characteristically uniform in caliber and
    ensheathed by glial or neurilemma cells. Sheath differentiation and axon caliber
    are related to speed of conduction.


    **Perikaryon:** the "cell body" or nucleated cytoplasmic mass, which is usually
    characterized by the presence of chromidial substance [i.e., chromosomes]. This
    portion of the neuron is the focal point of embryonic growth of dendrites and
    axon, of regeneration, and perhaps of synthesis in the differentiated neuron.
    It may be located in the dendritic zone or within the axon, or it may be attached
    to the axon. **Axon telendria:** the usually branched and variously differentiated
    terminals of axons whose membrane and cytoplasmic differentiation related to synaptic
    transmission or neurosecret activity. Mitochondrial concentrations, "synaptic
    vesicles," or secretory granules are commonly present in bulb-like terminals.
    Like the dendritic zone, the telendria do not transmit all-or-none conducted potentials.
    They transmit electrical or chemical signals capable of producing generator potentials
    in the dendritic zone of other neurons and in muscle, and stimulatory effects
    in innervated glandular cells or distant cells via the humoral route (neurohormones)
    [Bodian, 1962, p. 326].


    Figure 3.17 further clarifies these definitions by presenting a number of examples
    of the anatomy of various transmission neurons.


    The perikaryon contains the nucleus that produces the enzymes that are responsible
    for the metabolic processes that nourish and cleanse the neuron of wastes. The
    nucleus also stores genetic information in the darkly-staining chromosomes. Because
    the nucleus is the source of the metabolic enzymes, if an axon or a dendrite is
    separated from the cell body accidentally


