  \ | 0.4989 | 0.499 | 0.499 |\n\n### 转换为标准正态分布\n\n并不是所有的正态分布都是具有 ![c10-math-0271](img/c10-math-0271)\
  \ 和 ![c10-math-0272](img/c10-math-0272) 的标准分布。幸运的是，令人的是，每一个正态分布无论 ![c10-math-0273](img/c10-math-0273)\
  \ 和 ![c10-math-0274](img/c10-math-0274) 的值如何，都可以很容易地转换为标准正态分布。因此，人们可以使用熟悉的标准正态表确定任何正态分布的面积和概率。\n\
  \n线性关系\n\n![equation](img/c10-math-0275.png)\n\n将任何均值为 ![c10-math-0276](img/c10-math-0276)\
  \ 标准差为 ![c10-math-0277](img/c10-math-0277) 的正态随机变量转换为标准正态变量 `z`，其具有 ![c10-math-0278](img/c10-math-0278)\
  \ 和 ![c10-math-0279](img/c10-math-0279)。`z` 的值也被称为 ***z*-score**（z 分数）。\n\n\n\n\n\
  要将正态概率表应用于正态随机变量 `x`，我们将 `x` 的值转换为其对应的 `z` 分。`z` 的值是 `x` 的值与均值 ![c10-math-0280](img/c10-math-0280.png)之间的标准差个数。负的\
  \ `z` 分表示 `x` 小于均值，而正的 `z` 分表示 `x` 大于均值。\n\n我们在符号或计算中偶尔提供的替代方案是为了鼓励你选择一种舒适的格式。我们建议画出正态曲线下的区域。这将有助于你在处理更复杂的问题时检查工作。\n\
  \n正态分布是所有理论概率分布中最重要的一个。它是大多数统计理论和实际应用的基础。当 `n` 值较大时，正态曲线是二项分布的良好近似。它也是许多其他概率分布的良好近似。例如，正态分布通常是人体身高或体重、智商（IQ）和其他测试成绩、制造零件以及实验室实验中的测量误差的相对频率分布的良好近似。\n\
  \n之前提到了纽约马拉松的比赛时间。实际上，在距离 4 小时还有几分钟和距离 5 小时之前发现了偏离正态性的情况。这些被解释为运动员为了实现目标（例如“我会尝试打破四小时”等）而付出的额外努力。有时，偏离正态性的情况可以用于检测异常，例如在生产过程中。\n\
  \n在这里，正态概率是通过使用标准正态表确定的，在已知均值和标准差的情况下，将非标准变量转换为 `z` 变量。有时，概率是给定的，例如 95% 的质量标准，而需要计算其他参数。实际上，有四个相关的量——概率、变量值、均值和标准差。上面的示例使用了后三个来获取概率。实际上，任何三个都可以用来确定第四个，如接下来的示例所示。\n\
