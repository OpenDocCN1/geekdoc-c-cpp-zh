  \ LP 中变量数量对自动计算几乎没有障碍。\n\n### 大于等于约束\n\n回想，SMP 中的不等式约束是“小于等于”类型的。这意味着添加松弛变量有两个作用：不等式变为等式，且松弛变量变为基变量。例如，添加一个非负松弛变量\
