  \ `c` 元，并在 ![c6-math-0125](img/c06-math-0125.png) 天可以使用。\n\n\n\n1975 年，诺贝尔经济学奖授予数学家列昂尼德·康托罗科维奇（苏联）和经济学家查加林·库普曼斯（美国），以表他们在资源最优分配理论做出的贡献，线性规划其中起着关键作用。\n\
