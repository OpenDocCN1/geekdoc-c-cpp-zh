  \ 光速为每秒 186,000 英里。\n\n## 历史注释\n\n根据《牛津英语字典》（OED），`algebra`一词在 17 世纪被广泛接受。它认为起源于阿拉伯语，意为“部分的合并”和“计算”。\n\
  \n### 勒内·笛卡尔 (1596–1650)\n\n笛卡尔于 1596 年出生在法国，是一位贵族的子子。他走遍欧洲，学习数学、科学、法律、宗教和哲学。他深受启蒙运动思想者的影响。\n\
  \n笛卡尔是历史上最有影响力的思想家之一，有时被称为现代哲学的创始人。除了在哲学方面的成就，他还是一位卓越的数学家，创立了解析几何并寻求支配所有物理变化的简单规律。\n\
  \n数学可能是笛卡尔最感兴趣的领域；在他人基础上，他建立了笛卡尔坐标和笛卡尔曲线。他对代数贡献了负根的处理和指数表示法。\n\n### 莱哈德·欧拉 (1707–1783)\n\
  \n欧拉通常被认为是那个时代产量最高的数学家之一。他写了 866 本书和论文，获得了 12 次巴黎学院奖。他出生于瑞士，是一位路派牧师之子。最初是一名神学生，在约翰·伯努利的影响下转学数学。他在微积分、数学分析和数论方面做出了重大贡献。他引入了符号`e`、`i`、`f(x)`、`![c01-math-0598](img/c01-math-0598)`以及求和符号Σ。令人惊讶，他大部分的出版物出现在他失明的最后\
  \ 20 年里。\n\n### 克里斯蒂亚安·惠根斯 (1629–1695)\n\n惠根斯于 1629 年出生在荷兰，是一位重要外交官之子。他 16 岁时进入莱顿大学学习数学和法律。\n\
  \n惠根斯对天文感兴趣，并将注意力转向了镜片磨制和望远镜制造。他发现了土星的主要卫星。由于天文观测需要精确的计时，他产生了兴趣并专利化了第一个摆钟。惠根斯的数学教育受到了笛卡尔偶尔访问他家的影响。\n\
  \n\n\n\n\n# 约翰·纳培尔 (1550–1617)\n\n他出生于爱丁（苏格兰），关于他的早年情况鲜为人知。他 13 岁时进入圣安德鲁斯大学。后来认为他在欧洲其他地方完成了学业。纳培尔对数学的兴趣使他发明了对数，并引入了分数的小数表示法。他还因“纳培尔算盘”而闻名，该工具用于机械化进行乘除以及求平方根和立方根。\n\
