  ## 10.3 均匀分布\n\n当随机变量的所有值具有相同的频率或概率时，称它们遵循`uniform distribution`。均匀频率图是一个矩形。\n\n\
  当概率以概率曲线上的面积表示时，总面积为 1。因此，均匀分布矩形的面积为 1。如果随机变量从 ![c10-math-0139](img/c10-math-0139.png)\
  \ 到 ![c10-math-0140](img/c10-math-0140.png)，则均匀分布 ![c10-math-0141](img/c10-math-0141.png)\
  \ 是矩形的高度。均匀随机变量的均值 ![c10-math-0142](img/c10-math-0142.png) 是 `c` 和 `d` 的中点。\n\n\
