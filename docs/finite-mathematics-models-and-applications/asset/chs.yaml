  \n沿着路径 `GCD`。注意这里使用了上一次迭代中产生的 `f(2, 3)` 和 `f(3, 2)`。\n\n到这里，你已经有思路了！继续向回溯，一次一段，形成\
  \ `f(x, y)` 的各种值。每次迭代都依赖于上一次迭代，直到达到 `f(0, 0)`。应该跟踪不断演变的最优路径，它是从节点 `D` 反向展开的。完成整个解是有益的。\n\
  \n很有趣的是，线性规划在原理上可以使用动态规划方法来求解。这并没有计算上的优势；事实上，它的效率通常低于单纯形法（Simplex Method）。然而，它提出了一个重要的观点：数学优化的解可以通过多种一种方式获得。\n\
  \n我们用示例 6.6 中涉及的著名的“背包问题”的简化版来阐释。\n\n## 历史注释\n\n“Programming”（编程）一词有许多用法。包括“心理编程”、“戏剧节目”和“计算机编程”等。在数学文献中，该词通常是“优化”的同义词——寻找函数的最大值最小值。\n\
  \n显然，在二战后的后的几年里，“programming”被用作“planning”（规划）的同义词。在规划问题中，特别是在军事背景下，出现了最优性问题。例如，从可用飞机、目标和燃料限制中分配飞机到目标；飞行员规划符合营养需求且成本最低的餐单；等等。\n\
  \n理查德·贝尔曼（Richard Bellman, 1920–1984）——纽约人，贝尔曼在二战期间曾服于美国军，在新墨西哥州洛斯阿拉莫理论物理部门工作直到\
  \ 1946 年。他离开那里前往普林斯顿大学，在 3 个月内完成了博士学位并在那里任教，直到 1952 年加入了新成立的兰德公司（Rand Corporation），那是位于加州的一家美国空军“智库”。\n\
  \n在兰德公司，贝尔曼对多阶段决策过程感兴趣。他发明了动态规划，这是该领域的一个重大突破，它在函数方程方面具有广泛的应用。晚年时，他对医学数学产生了兴趣。关于动态规划命名的有趣描述，可以参考\
  \ Stuart Dreyfus 的《动态规划史》（www.google.com）以及他的自传《飓风之眼》（World Scientific Publishing\
  \ Co., Singapore, 1984）。\n\n### 练习 11.5\n\n1. **1** 从节点 1 开始，目的地是节点 5，网络显示了它们之间的可能路线。使用动态规划选择节点\
