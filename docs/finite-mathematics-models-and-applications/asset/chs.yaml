  \n**求和符号**在本节中被方便使用。希腊字母 ![c10-math-0037](img/c10-math-0037.png) (sigma) 用于表示符号右侧值的和，从第一个测量值到第\
  \ `n` 个测量值。在符号 `![c10-math-0039](img/c10-math-0039.png)` 或简单的 `![c10-math-0040](img/c10-math-0040.png)`\
  \ 明确的情况下。\n\n### 集中趋势\n\n给定一组测量值数据，人们直觉地寻找总结它们的方法。最常见且可能有用的是平均值。人们经常提到平均温度、每加仑里程、平均旅行时间、平均分数等。\n\
  \n来自总体所有成员的均值称为**总体均值**，通用希腊字母 ![c10-math-0051](img/c10-math-0051.png) 表示。它由 `![c10-math-0052](img/c10-math-0052.png)`\
  \ 定义，其中 `![c10-math-0053](img/c10-math-0053.png)` 是特定值 `x` 的概率。注意，当总体的 `n` 个元素概率相等时，`![c10-math-0054](img/c10-math-0054.png)`\
  \ 所以 `![c10-math-0055](img/c10-math-0055.png)` 等于 `![c10-math-0056](img/c10-math-0056.png)`。\n\
  \n来自总体随机抽样的均值（平均值）称为**样本均值**，并用 ![c10-math-0057](img/c10-math-0057.png) 表示。在示例 10.2.1\
  \ 中，行程 `![c10-math-0058](img/c10-math-0058.png)` 英里的平均段长度是总体均值，因为五段构成了一个总体。在示例 10.2.2\
  \ 中，这六个学生是样本，因此 `![c10-math-0059](img/c10-math-0059.png)` 是样本均值；示例 10.2.3 中计算出的均值也是，因为数据表明它们是样本。\n\
  \n描述定量（数值）数据的许多其他方法是**集中趋势**指标；即数据围绕某些值的聚集或中心化。\n\n平均值或平均数是一种流行的集中趋势指标；用一个数字描述数据。平均值不一定在数据之中。它甚至可能不是可能的结果。另外两种集中趋势指标是中位数众数。\n\
  \n**位数**是排序数据（升序或降序）的中间值。如果样本量 `n` 是奇数，则位数是唯一的，且位于 `![c10-math-0060](img/c10-math-0060.png)`\
  \ 位置，即有序数据的中间值。如果 `n` 是偶数，则有两个中间值。通常做法是将 `![c10-math-0061](img/c10-math-0061.png)`\
  \ 和 `![c10-math-0062](img/c10-math-0062.png)` 位置的两个数字取平均。因此，当 `n` 为偶数时，位数可能不属于数据集。\n\
  \n**众数**是数据中频率最高的值。众数如果存在，与平均值和位数一样在数据中，且不需要唯一的。\n\n### 变异性\n\n**变异性**是数据的另一个重要描述符；其**离散程度**或扩散性的测量。最简单的变异性测量是**范围**；其最大值和最小值之间的差。\n\
  \n虽然范围容易计算，但对统计理论并不有用。原因显而易见！范围仅取决于两个观测值，因此与样本量无关。最大值或最小值的任何异常值都会极大改变范围。\n\n另一种更有用的变异性测量是**方差**。再次，与平均值一样，存在总体值和样本值。**总体方差**由小写希腊字母\
  \ sigma 的平方 `![c10-math-0074](img/c10-math-0074.png)` 表示，并定义为\n\n```\n![c10-math-0075](img/c10-math-0075.png)\n\
  ```\n\n**样本方差** `![c10-math-0079](img/c10-math-0079.png)` 定义为\n\n```\n![c10-math-0080](img/c10-math-0080.png)\n\
  ```\n\n\n\n\n\n其中 ![c10-math-0081](img/c10-math-0081.png) 是样本平均值，它替换了未知的总体平均值 ![c10-math-0082](img/c10-math-0082.png)。样本方差完全由样本数据得出。样本方差的等效形式为：\n\
  \n![equation](img/c10-math-0083.png)\n\n将方差视为围绕均值的平方波动平均是有用的。请注意，方差使用了所有数据，而极差只包含两个极值。因此，`variances`\
  \ 被视为衡量变异性的优指标。\n\n方差的平方根是`standard deviation`或`standard error`，应用于实际计算。有`population\
  \ standard deviation` ![c10-math-0093](img/c10-math-0093.png) 和`sample standard\
  \ deviation` `s`。\n\n注意：总体值习惯使用希腊字母。\n\n### 经验规则\n\n对于较大的数据集，一个实用的`empirical rule`是：大约\
  \ 68%的数据位于样本均值一个标准差范围内；95%的测量值位于两个标准差范围内；几乎所有数据位于三个标准差范围内。\n\n尽管这些百分比源于`Normal Distribution`，但它们对于非正态的、“丘峰型”分布同样有效。经验规则是对数据正态性的粗略指示。\n\
