  7. 历史笔记\n\n\n\n\n概率论是处理偶然事件的数学分支。虽然在历史上它与机会游戏密切相关，但概率概念在商业、社会科学、生物学、医学、物理科学和工程领域越来越多地遇到。从投资风险评估到桥梁安全、行为、疾病传播、药效以及垃圾邮件过滤器，数学概率都发挥着作用。\n\
  \n在本章以及第 8 章中研究数学概率需要一些`set theory`（集合论），这解释了为什么它是下一个主题。\n\n## 7.1 集合\n\n简单来说，集合是事物的集合或分组。例如，数字组{1,\
  \ 3, 2, 6} 构成一个集合，可以标记为 `A`。集合的成员称为其`elements`。要表示元素 `a` 属于集合 `A`，写做 ![c7-math-0002](img/c07-math-0002.png)。如果\
  \ `a` 不是 `A` 的元素，则写 ![c7-math-0004](img/c07-math-0004.png)。所考虑的元素的总称为`universal`集合\
  \ `U`。\n\n有时，一个规则定义了一个集合的元素。例子包括“骰子上的面”、“元音”或“星期几”。这些被表示为集合\n\n```\n![equation](img/c07-math-0005.png)\n\
  ```\n\n以及此类推，其中正斜杠 `/` 读作“使得\n\n没有元素的集合称为`empty`集或`null` 集。空集用 { } 或 ![c7-math-0006](img/c07-math-0006.png)\
  \ 表示，但不同两者并用。空集的任一种表示法都是合适的。它们的组合如 ![c7-math-0007](img/c07-math-0007.png) 并不是空集。它是一个包含符号\
  \ ![c7-math-0008](img/c07-math-0008.png) 的集合。\n\n如果集合 `A` 的每个元素也是集合 `B` 的元素，那么我们说\
  \ `A` 是 `B` 的`subset`（子集），写做 ![c7-math-0016](img/c07-math-0016.png) 或 “A 包含 B 中”。它的否定写做\
  \ ![c7-math-0017](img/c07-math-0017.png)，或 “A 不 B 中”。如果两个集合 `A` 和 `B` 有完全相同的元素，它们被称为`equal`（相等）或`identical`（相同），写为\
  \ ![c7-math-0018](img/c07-math-0018.png)。它的否定“A 不等于 B”是 ![c7-math-0019](img/c07-math-0019.png)。\n\
  \n### 复合集合\n\n两个或多个集合的`union`（并）是另一个包含其中每个集合元素的集合。对于两个集合 `A` 和 `B`，它们的并集 ![c7-math-0029](img/c07-math-0029.png)\
  \ 包含所有“在 A 中或 B 中”的元素。对于三个集合 `A`、`B` 和 `C`，并集 ![c7-math-0030](img/c07-math-0030.png)\
  \ 包含出现在至少一个集合中的每一个元素，依此类推。\n\n在并集中，有一个`intersection`（交）集。它对应于组成并集的集合的公共元素。两个集合 `A`\
  \ 和 `B` 的交集表示为 ![c7-math-0031](img/c07-math-0031.png)。只有同时出现在两个集合中的元素才构成交集。如果两个集合没有共同元素，则被称为`disjoint`（不交）或`mutually\
  \ exclusive`（互斥）；即 ![c7-math-0032](img/c07-math-0032.png)。三个集合的交集表示为 ![c7-math-0033](img/c07-math-0033.png)。只有出现在三个集合中的元素才能形成交集。\n\
  \n集合 `A` 的`complement`（补集，相对于全集 `U`）是它的否定。集合 `A` 的补集是“非 A”的集合，表示为 ![c7-math-0034](img/c07-math-0034.png)。注意\
  \ `c` 在这里不是指数，因为集合不进行幂运算。为了避免混淆，一些作者使用 ![c7-math-0035](img/c07-math-0035.png) 或\
  \ ![c7-math-0036](img/c07-math-0036.png)，尽管这些表示法也有缺点。补集 ![c7-math-0037](img/c07-math-0037.png)\
  \ 由全集 `U` 中不属于集合 `A` 的元素组成。并 ![c7-math-0038](img/c07-math-0038.png) 是全集，而 ![c7-math-0039](img/c07-math-0039.png)\
  \ 是空集。\n\n代数中的交换律、结合律和分配律在集合代数中也有对应的律。它们总结如下：\n\n集合 `A` 的大小（通过其元素的数量来衡量）表示为 `n(A)`。例如，如果\
