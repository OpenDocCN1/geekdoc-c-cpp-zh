  \ 禁烟的意见\n#### 4. 示例 10.6.4 选择问卷\n\n## 7. 数据的图表表示\n\n处理数据呈现的统计学分支是描述性统计。图表法用于数据的可视化。\n\
  \n饼图用于表示定性数据，特别是当只有少数类别时。圆形被分成若干扇，每扇代表一个类别。每个扇区的大小与该类别的频率成比例。饼图应有清晰的标题。\n\n条图是另一种用于定性数据的方法，特别是当类别为名别或序数时。条形垂直或水平排列，每个条形的高度或长度代表该类别的频率。\n\
  \n直方图用于定量数据。它们是垂直条形图的一种特殊情况，其横轴是连续变量。组边界内的测量次数为组频率。组边界设置在横轴上。组边界之间的距离为组间距。\n\n相对频率\
  \ `f` 是将频率除以总样本量 `n` 以对其进行归一化。相对频率百分比是相对频率乘以 100%。相对频率之和为 1，因此相对频率百分比之和为 100%。\n\
  \n选择何种图表方法来显示信息通常是可选的，因为它取决于数据的类型和分析的目的。无论如何选择，数据都应该以清晰且有意义的方式显示。\n\n### 练习题 10.1\n\
