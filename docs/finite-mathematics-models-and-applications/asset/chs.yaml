  \n\n\n到 19 世纪，“等等概率”假设的局限性已显而易见。硬币或骰子可能被“加了文章”或“弄斜”，因此显然不能假设结果是等可能的。于是，“频率”概念应运而生。概率通过实验决定，例如通过反复投掷硬币并记录正面的次数。正面次数与总投掷次数的比值估计了正面的概率；其假设是投掷次数越多，对概率的估计就越准确。尽管人们无法精确知道某个概率（因为这需要无限次投掷），但这种局限性通过将概率概念应用于更广泛的现象而得到了平衡。\n\
  \n## 概率论导论\n\n概率论中的某些用法需要简要解释。我们称`experiment`（实验）为发生观测或测量的行为或过程。`outcome`（结果）是实验的结果。实验的`sample\
  \ space`（样本空间）是其互斥结果完全（且穷）集合。样本空间的元素记作 `S`，称为样本点。\n\n## 概率关系\n\n概率关系来源于集合论。由集合 `A`\
  \ 描述的事件概率的习惯记法为 `P(A)`。由于概率值于 0 和 1 之间（包含边界），且全集或样本空间的概率之和为 1，因此可以写成：\n\n![equation](img/c07-math-0402.png)\n\
  \n其中补集 `images/c07-math-0403.png` 表示“非 `A`”，而 `images/c07-math-0404.png` 表示其概率。以下是确定概率时需要记住的某些性质。\n\
  \n对于简单概率，通常假设样本空间 `S` 中的每个简单事件都是等可能的。从标准牌组中抽取一张卡牌、投掷一个公平的骰子等都是例子。因此，概率通过特定感兴趣的事件在样本空间中的元素个数来计算，公式如下：\n\
  \n![equation](img/c07-math-0411.png)\n\n## 条件概率\n\n在事件 `B` 已经发生的给定条件下，事件 `A` 的`conditional\
  \ probability`（条件概率）定义为：\n\n![equation](img/c07-math-0438.png)\n\n即交集事件的概率除以给定事件的概率，就是事件\
  \ `A` 位于事件 `B` 的条件概率。\n\n交集事件概率的计算可以通过以下形式的条件概率定义来辅助：\n\n![equation](img/c07-math-0439.png)\n\
  \n### 概率独立性\n\n如果事件 `A` 的概率不受事件 `B` 发生（或不发生）的影响，则认为事件 `A` 和 `B` 是 `probabilistically\
  \ independent`（概率独立的），或简单称为 `independent`（独立的）。因此，事件 `A` 和 `B` 是独立的，当且仅当：\n\n![equation](img/c07-math-0449.png)\n\
  \n换句话说，当事件 `B` 的发生或不发生对 `A` 偶然发生没有影响时，事件 `A` 和 `B` 就是独立的。不独立的事件是`dependent`（相关的）。顺便提到，概率独立性也称为\
  \ `stochastic independence`（随机独立性）或 `statistical independence`（统计独立性）。\n\n在许多实际情况下，联合概率或交集概率带来了困难，因为往往无法获得数据。例如，在预测海上溢油的移动时，风速和波高是主要因素。联合事件的数据应该是同一时刻、同一地的风速和波浪测量值。虽然风速和波浪测量很容易且通常可用，但它们通常不是同时测量的。评估联合事件的依赖程度非常重要，因为这是常用假设的准确性的线索：\n\
  \n![equation](img/c07-math-0464.png)\n\n需要理解的是概率独立性并不是某种通常在“实践上”或“数学上”被证明的结论。它是关于事件的一种假设。关于独立性的假设来自于经验和对它们的认知。例如，投掷硬币通常被视为独立事件，一个家庭连续出的孩子的性别也是如此。然而，这些信念无法通过“数学证明”。\n\
