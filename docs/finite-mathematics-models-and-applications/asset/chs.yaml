  \n如前所述，“matrix`是行和列的`elements`（或`entries`）矩形数组。具有 `m` 行 `n` 列的矩阵称为 ![c03-math-0073](img/c03-math-0073.png)\
  \ 矩阵。其`dimension`为 `m x n`（注意先规定行数）。\n\n例如，一个 ![c03-math-0075](img/c03-math-0075.png)\
  \ 矩阵 `A`，其元素 ![c03-math-0076](img/c03-math-0076.png), ![c03-math-0077](img/c03-math-0077.png)\
  \ 和 ![c03-math-0078](img/c03-math-0078.png) 写为\n![equation](img/c03-math-0079.png)\n\
  \n两个矩阵 `A` 和 `B` 如果它们的元素相等，则相等。即对于 ![c03-math-0080](img/c03-math-0080.png) 的 ![c03-math-0081](img/c03-math-0081.png)\
  \ 和 ![c03-math-0082](img/c03-math-0082.png)，这意味着矩阵 `B` 中的对应元素必须与矩阵 `A` 相同。维度为 ![c03-math-0083](img/c03-math-0083.png)\
  \ 和 ![c03-math-0084](img/c03-math-0084.png) 的矩阵被称为 `vectors`。\n\n### 矩阵加法与减法\n\n\
  两个矩阵 `A` 和 `B` 的加法或减法只有在它们具有相同维度的情况下才。所得矩阵 `C` 由元素 ![c03-math-0085](img/c03-math-0085.png),\
  \ ![c03-math-0086](img/c03-math-0086.png) 和 ![c03-math-0087](img/c03-math-0087.png)\
  \ 组成。不同维度的矩阵既不能加也不能减。\n\n如果 `k` 是某个标量（常量），且 `A` 是一个 ![c03-math-0088](img/c03-math-0088.png)\
  \ 矩阵，那么标量倍 `kA` 是一个具有元素 ![c03-math-0089](img/c03-math-0089.png), ![c03-math-0090](img/c03-math-0090.png)\
  \ 和 ![c03-math-0091](img/c03-math-0091.png) 的矩阵。也就是说，每个元素乘以标量 `k`。\n\n### 矩阵乘法\n\
  \n除了加法和减法，还可以定义矩阵乘法。由于向量也是矩阵，我们从它们开始。当一个 ![c03-math-0105](img/c03-math-0105.png)\
  \ 矩阵（行向量）乘以一个 ![c03-math-0106](img/c03-math-0106.png) 矩阵（列向量）时，结果是一个 ![c03-math-0107](img/c03-math-0107.png)\
  \ 矩阵（向量），即单元素矩阵。\n\n如果 ![c03-math-0108](img/c03-math-0108.png) 和 ![c03-math-0109](img/c03-math-0109.png)，那么这些\
  \ ![c03-math-0110](img/c03-math-0110.png) 和 ![c03-math-0111](img/c03-math-0111.png)\
  \ 矩阵的乘积产生 ![c03-math-0112](img/c03-math-0112.png)，一个单元素矩阵。\n\n接下来，我们推广到较大矩阵的乘法。再次，需要乘法兼容性或**相容性**。一个\
  \ ( *m × n*) 矩阵只能乘以一个 (*n × r*) 矩阵以产生 (*m × r*) 矩阵，*m* 和 *r* 是任意的。矩阵没有除法。\n\n与普通运算不同，矩阵乘法通常不满足交换律。也就是说，对于兼容矩阵，**AB**\
  \ 通常等于 **BA**。如果矩阵不兼容，则无法进行乘法。这在示例 3.2.5 中得到了说明。\n\n矩阵乘法可以获取存储在矩阵格式中的数据信息。示例 3.2.6\
  \ 有助于说明这一点。\n\n### 方阵、单位阵与转置矩阵\n\n**方阵**具有相同的行数列数，即 ![c03-math-0150](img/c03-math-0150.png)。\n\
  \n\n\n\n\n矩阵 ![c03-math-0151](img/c03-math-0151.png) `A` 的`主对角线`元素用双下标 ![c03-math-0152](img/c03-math-0152.png)\
  \ 表示。\n\n`单位矩阵` `I` 是方阵，其主对角线元素为 1，其余元素为 0。单位矩阵的示例如：\n\n![equation](img/c03-math-0153.png)\n\
  \n阶 ![c03-math-0154](img/c03-math-0154.png) 单位矩阵方便记为 ![c03-math-0155](img/c03-math-0155.png)。所有元素均为\
  \ 0 的矩阵称为`零矩阵`，记为 `0`。\n\n矩阵的`转置`是将行和列互换。也就是说，一个 ![c03-math-0156](img/c03-math-0156.png)\
  \ 矩阵 `A` 的转置是一个 ![c03-math-0157](img/c03-math-0157.png) 矩阵，记为 ![c03-math-0158](img/c03-math-0158.png)，其中矩阵\
  \ `A` 的行和列发生了互换。（注：t 表示转置。它不是指数。）\n\n我们已经定义了矩阵的加法、减法和乘法。矩阵除没有定义。矩阵的一些规则与普通算术相似，但并非全部如此。\n\
