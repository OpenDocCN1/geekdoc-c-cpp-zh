  \ 设置可以允许不超过 5% 的苏打水输出不可接受？\n\n## 10.5 正态分布应用\n\n\n\n\n正态分布在生活的几乎每一个方面（无论是自然还是其他）都发挥着作用，这一点已经得到强调。自然选择伴的变异和适应也遵循正态曲线。本节中的示例说明了上一节获得的技术技能的多种实际用途。\n\
  \n上述示例再次阐明，只要知道正态分布四个参数中的任意三个——阈值常数（如航空容量或水坝高度）、均值、标准差和概率——就可以确定第四个参数。\n\n在比较替代策略时，可能会出现另一种有趣的情况。假设完成时间在两种替代旅行路线或执行建筑项目的方式上遵循正态分布。设两种替代方案的均值和标准差分别为\
  \ ![c10-math-0452](img/c10-math-0452.png) 和 ![c10-math-0453](img/c10-math-0453.png)，以及\
  \ ![c10-math-0454](img/c10-math-0454.png) 和 ![c10-math-0455](img/c10-math-0455.png)，并假设完成时间越早越好。\n\
  \n显然，如果 ![c10-math-0456](img/c10-math-0456.png) 和 ![c10-math-0457](img/c10-math-0457.png)，则应选择第一种方案，因为不仅不仅平均更短，而且变异较小，因为\
  \ ![c10-math-0458](img/c10-math-0458.png)。如果 ![c10-math-0459](img/c10-math-0459.png)\
  \ 和 ![c10-math-0460](img/c10-math-0460.png)，则优选第二种方案。\n\n有趣的情况是，例如 ![c10-math-0461](img/c10-math-0461.png)\
  \ 和 ![c10-math-0462](img/c10-math-0462.png)。现在，从平均而言，第一种方案更快。然而，第一种方案较高的标准差表明变异性更大，因此偏离均值的大幅向上的风险更大。如何做出理性选择？下一个示例展示了一种方法！\n\
  \n### 统计样本\n\n统计学家处理 `samples`（样本），而 `sample mean`（样本均值）是从中获得的信息中最重要的。记得\n\n```\n\
  ![equation](img/c10-math-0471.png)\n```\n\n现在，数学事实是，如果 ![c10-math-0472](img/c10-math-0472.png)\
  \ 是正态随机变量的独立观测值，那么也是随机变量的 ![c10-math-0473](img/c10-math-0473.png) 服从正态分布。实际上，中心极限定理确保即使\
  \ ![c10-math-0474](img/c10-math-0474.png) 来自非正态分布的观测值，在相当一般的条件下，![c10-math-0475](img/c10-math-0475.png)\
  \ 仍保持近似正态分布。这种近似随着样本量 `n` 的增加而提高。许多统计学家认为，对于样本量为 30 或更多，这种近似在实际用途中是“精确”的。正是这个数学中最卓越的定理之一，使得正态分布如此重要，并成为许多数学统计的基础。\n\
  \n由于 ![c10-math-0478](img/c10-math-0478.png) 是正态随机变量，它具有均值和方差。如果观测的正态变量 `x` 的均值为\
  \ ![c10-math-0479](img/c10-math-0479.png) 标准差为 ![c10-math-0480](img/c10-math-0480.png)，那么\
  \ ![c10-math-0481](img/c10-math-0481.png) 具有相同的均值 ![c10-math-0482](img/c10-math-0482.png)\
  \ 和标准差 ![c10-math-0483](img/c10-math-0483.png)，其中 `n` 是样本量。这些证明虽然并不困难，但在此省略。\n\n\
  随着样本量的增加，直觉上预期 ![c10-math-0490](img/c10-math-0490.png)（样本平均值）接近 ![c10-math-0491](img/c10-math-0491.png)。事实上，根据大数定律，确实如此！\n\
  \n对于 ![c10-math-0492](img/c10-math-0492.png)（其关于均值 ![c10-math-0493](img/c10-math-0493.png)\
  \ 的变异性衡量），预期其变异随着样本量的增加而减少。毕竟，样本量越大，预期越接近。\n\n\n\n95% 这个数字被称为`test level`（检验水平）或`level\
  \ of significance`（显著性水平），通常像这里一样是任意的。下一个例子说明了一个常见的情况，即没有预先检验水平。观测显著性水平（`observed\
  \ significance level`）或所谓的 `p-value`，衡量了检验统计量与假设均值之间不一致的程度。它是我们在前几个例子中用于对某些主张表示怀疑的尾部（或尾部）概率。这个值通常在用统计计算机软件包分析统计数据时报告。其核心思想是让用户根据当前目的来判断其显著性或缺乏显著性。\n\
  \n前面的例子让统计学专业的学生联想到`tests of hypothesis`（假设检验）。为了在有限的篇幅内更好地、非正式地传达底层概念，我们的讨论省略了一些技术性符号。\n\
  \n我们已经多次提到，统计学家将 `![c10-math-0543](img/c10-math-0543.png)` 视为 `![c10-math-0544](img/c10-math-0544.png)`\
  \ 的估计，而且可以肯定，这种估计通常随着样本量的增加而提高。然后，在超几何分布的一个例子中，简要考虑了`maximum-likelihood estimate`（极大似然估计）（第\
  \ 8 章）。在这两种情况下，均值都被指定为一个值——即所谓的`point estimate`（点估计）。\n\n对于许多实际用途来说，均值的精确值并不特别重要。相反，均值可能所在的区间的某种置信度反而更有用。\n\
  \n所谓的`confidence intervals`（置信区间）包含四个部分：样本均值、标准差、样本量和`confidence level`（置信水平）。置信水平是一个概率。它表示了置信区间实际上包含（未知的）均值\
  \ `![c10-math-0545](img/c10-math-0545.png)` 的可能性。毕竟，唯一确定包含均值的区间是实数线，`![c10-math-0546](img/c10-math-0546.png)`\
  \ 到 `![c10-math-0547](img/c10-math-0547.png)`。当然，这没有用。然而，它表明区间的缩小意味着存在风险所选区间不包含均值\
  \ `![c10-math-0548](img/c10-math-0548.png)` 的风险。\n\n构建置信区间始于 `![c10-math-0549](img/c10-math-0549.png)`。围绕\
