  \ 分配 0 小时。\n\n# 使用技术\n\n学生不需要技术辅助即可从本文中充分受益。\n\n对于对这些工具的使用感兴趣的人，我们提供了以下指南：\n\n-\
  \ TI-83 计算器：用于矩阵\n- LINDO：用于线性规划\n- EXCEL：用于概率和统计\n\n## 矩阵\n\n第 3 章包含了大多数计算器可以执行的常用矩阵操作。大多数\
  \ TI 计算器可能使用类似的步骤。例如，对于 TI 型号，**输入矩阵**：\n\n1. 按 `2nd` 键，然后选择 `matrix`，在编辑菜单中选择 `a\
  \ matrix`。\n2. 输入行维度，进入列维度。\n3. 输入矩阵元素。\n4. 输入所有值后，按 `2nd` 键并选择 `quit` 返回主屏幕。\n\n\
  你可以编辑或查看矩阵。如果矩阵太大无法显示，使用方向键向下或向右滚动。\n\n## 矩阵运算\n\n1. 如果维度兼容（例如 `[A]` 和 `[B]`），矩阵可以相加（相减）。\n\
  2. 矩阵乘法使用 `2nd` 键。\n3. 矩阵乘以常数时使用 `2nd` 键。\n4. 矩阵幂运算使用 `2nd` 键。\n5. 寻找矩阵逆使用 `2nd`\
  \ 键。\n\n#### 线性规划\n\n单纯形法用于第 5 章和第 6 章。提供了一些计算机程序。\n\n## 使用 Lindo\n\n以下是一些说明：\n\n\
  ## 使用 Excel 计算阶乘、组合和排列\n\n组合学在第 7 章介绍。大多数计算器都有可以计算组合的函数。对于喜欢使用 Excel 的，另一种方案是：\n\
  \n使用顶部灰色工具栏上的 `insert` 并选择 `function`。函数类别将是 `Math &Trig`，函数名称为 `FACT`（阶乘）。`COMBIN`（组合）；以及\
  \ `PERMUT`（排列）。\n\n## 创建频率直方图\n\n*这些说明将数据形成频率直方图。直方图的轴、标题和其他部分可以修改，以获得与文本风格相似的直方图*。\n\
  \n\n\n\n\n现在，从屏幕顶部的灰色工具栏选择 `Tools/Data Analysis/Histogram`。你需要在 `Input Range` 中输入\
  \ `A1:A68`，在 `Bin Range` 中输入 `B1:B11`，点击输出范围并输入 `D10`，勾选 `chart output` 复选框，然后点击确定。你应该看到组距频率和一个小的条形图（注意：矩形没有像直方图本该那样连接）。6.5\
  \ 的组距数应为 0，14.5 的组距数应为 6，然后是 7, 8, 3, 0, 2, 6, 9, 14, 13。\n\n现在，双击图表标题中的 `Histogram`\
  \ 单词，你就可以编辑标题了。标题应更改为合适的内容，例如 `68 Small Town Building Ages.`。双击 `Bin` 单词将轴标签更改为\
  \ `Building Ages.`。双击独立轴（百分比）上的任意任意一个数字，会出现设置轴格式对话框。选择 `scale` 并将 `number of categories\
  \ between tick marks` 更改为 `1`，然后点击 `ok`，这样如果每个 Bin 还没有显示在图上，就会显示。点击直方图的空白区域，使一个框突出整个图表。通过点击图表底部的中间黑色矩形拖动图表底部，以便更清楚地看到这些矩形。双击图中的一个矩形，会出现\
  \ `Format Data Series` 对话框。点击 `data labels` 标签页并点击 `show values`，先不要点击确定。这会将频率放置在相应矩形的上方。点击\
  \ `options` 标签并将 `gap width` 更改为 0，然后点击 `ok` 以消除矩形之间的间隔，从而得到直方图而不是条形图。确保通过点击图表中的空白区域使直方图仍处于选中状态，以便只打印直方图；否则打印选项将会打印整个工作簿。\n\
  \n## 使用 Excel 确定汇总统计量\n\n假设建筑年龄的直方图数据在一个 Excel 文件中。使用 `Tools/Data Analysis/Descriptive\
  \ Statistics` 选项。在对话框中，`Input Range` 将为 `A1:A68`。接下来，取消勾选 `labels in first row`\
  \ 复选框，并确保勾选 `group by columns` 选项。\n\n`Output Range` 为 `D10`，并勾选 `Summary Statistics`\
  \ 框。现在，点击 `ok`。通过点击并拖动屏幕上方灰色工具栏区域 D 列右下角的鼠标来加宽 D 列。加宽列到足够阅读列中出现的所有单词。双击单元格 `D10`，以便将\
  \ `column1` 标题更改为 `Descriptive Statistics for 68 Building Ages`。数据的平均值为 54，计数应为\
  \ 68。\n\n感兴趣的读者可能会有其他偏好。我们鼓励他们的追求。\n\n## 术语表\n\n| **Absorbing Markov Chain–** |\
  \ 具有至少一个从每个非吸收状态均可到达达的吸收状态的马尔可夫链。 |\n| **Algebraic Expressions–** | 使用字母数字字符和特殊符号表示的数学描述。\
  \ |\n| **Amortization–** | 在指定的时间内偿还贷款。 |\n| **Annuity–** | 在指定时间内的定期付款。 |\n| **Arithmetic\
  \ Sequence–** | 通过加上一个常数（公差）形成的连续项。 |\n| **Augmented Matrix–** | 以矩阵格式表示的为 `[A|B]`\
  \ 的系数和常数。 |\n| **Avogadro's Number–** | 1 摩尔物质中的原子数，6.02 × 10²³。 |\n| **Bar Chart–**\
  \ | 定性数据的图表。等宽且间距相同的条形，垂直或水平排列。 |\n| **Basic Variable–** | 在线性规划中，在任何迭代中都仅出现在一个约束条件中的非负值变量。\
  \ |\n| **Bayes' Rule–** | 评估条件概率中信息的影响。用符号表示为 ![bgloss-math-0001](img/bgloss-math-0001.png)。\
  \ |\n| **Bernoulli Trials–** | 一系列重复的、名义相同且独立的试验，具有两种可能的结果且每次试验的概率相同。 |\n| **Binomial\
  \ Distribution–** | 在 `n` 次伯努利试验中，试验概率为 `p` 时恰好有 `x` 次“成功”的概率为 ![bgloss-math-0002](img/bgloss-math-0002.png)。\
  \ |\n| **Canonical Form–** | 吸收马尔可夫链矩阵，其吸收状态排在非吸收状态之前的行。 |\n| **Cartesian Coordinates–**\
  \ | 平面上由有序对 `(x, y)` 描述的点。 |\n| **Cartesian Product of a Set–** | 也称为直积或交叉积。满足 `a`\
  \ ∈ `A` 且 `b` ∈ `B` 的所有可能对 `(a, b)`。 |\n| **Central Limit Theorem–** | 无论变量分布如何，随机变量之和趋向于正态分布。随着\
  \ `n` 的增加，对正态性的近似会提高。 |\n| **Class Boundary–** | 直方图矩形宽度的尺度。 |\n| **Combination–**\
  \ | 将 `n` 个对象无放分成两组且不考虑顺序的方法数。 |\n| **Complement of a Set–** | 全集中不在给定集合中的所有元素；给定集的否定。\
  \ |\n| **Conditional Equation–** | 在某些变量值下有效的方程。 |\n| **Conditional Probability–**\
  \ | 以先前事件为条件的概率。 |\n| **Confidence Interval–** | 总体参数（如平均值）的估计区间。 |\n| **Constants–**\
  \ | 固定值。 |\n| **Constraints for LP–** | 需要满足的条件。 |\n| **Cryptology–** | 代码科学。 |\n\
  | **Decision Variables–** | 由决策者选择的变量。 |\n| **Descriptive Statistics–** | 用于数据展示、组织和总结的统计学分支。\
  \ |\n| **Determinant of a Matrix–** | 通过矩阵带符号乘积之和获得的数值。 |\n| **Dimension of a Matrix–**\
  \ | 矩阵的行数 `m` 和列数 `n`，表示为 `m` × `n` 矩阵。 |\n| **Dimensional Analysis–** | 使用基本维度分析和公式物理量之间的关系。\
  \ |\n| **Dual Program–** | 原规划的对偶。 |\n| **Dynamic Programming–** | 通过递归进行优化；它将 `n`\
  \ 个变量的单一优化替换为 `n` 个单变量优化。 |\n| **Effective Rate of Interest–** | 等于复合利率的简单利率。 |\n\
  | **Elementary Matrix–** | 对单位矩阵进行单次行操作得到的方阵。 |\n| **Elements of a Matrix–** | 组成矩阵的元素。\
  \ |\n| **Elimination–** | 一种通过代数组合系统地消除变量的方法。 |\n| **Empirical Rule–** | 对于正态变量的观测值，约\
  \ 68% 落在一个标准差内，约 95% 落在两个内，几乎所有落在三个标准差内。 |\n| **Expected Value–** | 随机量的平均或均值的同义词。\
  \ |\n| **Exponential Functions–** | 表达式为 `b^x`，`x` 为独立变量，`b` 为实数。 |\n| **Factorial–**\
  \ | 连续递减自然数的乘积，例如 `5! = 5·4·3·2·1`。根据定义，`0! = 1`。 |\n| **Feasible Region–** | 满足条件的变量值范围。\
  \ |\n| **Feasible Vector–** | 满足条件的 `(1 × n)` 或 `(n × 1)` 矩阵。 |\n| **Fibonacci Numbers–**\
  \ | 序列 1, 1, 2, 3, 5, 8, 13,…；每项都是前两个项之和。 |\n| **Fundamental Matrix–** | 其元素是在吸收前，从一个非吸收状态到达另一个非吸收状态的期望次数。\
  \ |\n\n\n\n\n\n### 计数学乘法原理–\n对于`n[1]` 个第一类元素、`n[2]` 个第二类元素……以及 `n[r]` 个第 `r` 类元素，恰好有\
  \ ![bgloss-math-0003](img/bgloss-math-0003.png) 个由每类一个元素组成的 `r` 元组。\n\n### 偶偶性原理–\n\
  原始问题有解，当且仅当其对偶问题有解。如果存在最优解，则两者的最优解是相同的。\n\n### 博弈论–\n竞争情势的数学，有助于对手之间进行策略选择。\n\n\
  ### 高斯-德尔特消元法–\n一种利用矩阵格式求解线性方程组的迭代代数方案。\n\n### 几何平均收益率–\n复合年收益率，即几何平均，由 ![bgloss-math-0004](img/bgloss-math-0004.png)\
  \ 给出。\n\n### 等比数列–\n相邻项通过将前一项乘以一个常数（公比）得到。例如，公比为 `r` 的 `a`, `ar`, `ar`², …。\n\n\
  ### 几何相似性–\n与几何比例有关，对象之间的一一对应关系，使得其对应元素之比为常数。\n\n### 黄金分割比例–\n极限比例，![bgloss-math-0005](img/bgloss-math-0005.png)，即斐波那契数的值等于\
  \ ![bgloss-math-0006](img/bgloss-math-0006.png)。\n\n### 半平面–\n由不等式划定的区域。\n\n###\
  \ 直方图–\n定量数据的展示，类似于条形图，不同之处在于条形是连接在一起的。\n\n### 齐次的–\n每个方程均等于零的线性方程组。\n\n### 超几何分布–\n\
  针对有限总体中、具有两种可能结果的独立重复试验的概率分布（试验概率会变化）。其在大总体中的局限情况为二项分布。\n\n### 假设检验–\n对参数的假设值的统计推断。\n\
  \n### 恒等式–\n对变量的所有值都成立的关系。\n\n### 单位矩阵–\n主对角线元素为 1，其余元素为 0 的方阵。\n\n### 初始概率向量–\n\
  对应马尔可夫链的初始状态概率向量。\n\n### 输入产出分析–\n联系关联组织和行业之间的输入与输出。现代经济理论的主流，归功于诺贝尔奖经济学家瓦西·列昂秋夫。\n\
  \n### 直线的截距–\n与 `x` 轴（`y = 0`）的交点为 `x`截距，与 `y` 轴（`x = 0`）的交点为 `y`截距。\n\n### 利息–\n\
  使用资金支付或收取的费用。\n\n### 间隔尺度–\n在缺乏绝对零点的尺度上衡量的定量数据。华氏或摄氏温度是示例。\n\n### 矩阵逆–\n另一个矩阵 `A^(−1)`，使得\
  \ `AA^(−1) = A^(−1)A = I.`。\n\n### 需求法则–\n需求随价格下降而增加。\n\n### 供给法则–\n供给随价格上升而增加。\n\
  \n### 等高值线–\n具有不同函数值的平行曲线。\n\n### 线性方程–\n变量指数均为 1 的方程。\n\n### 线性规划–\n在线性不等式约束下待优化的线性目标。\n\
  \n### 对数函数–\n指数函数的反函数。\n\n### 矩阵的主对角线–\n`n` × `n` 方阵的对角线元素 `a[11]`, `a[22]`, …,\
  \ `a[nn]`。\n\n### 边际成本–\n每额外生产一个单位成本。当成本是线性的，边际成本为其斜率。\n\n### 市场均衡–\n当需求等于供给时。\n\
  \n### 马尔可夫过程–\n每个随机结果仅取决于其直接之前的结果。\n\n### 矩阵–\n元素的矩形数组。\n\n### 矩阵加法–\n维度相同的矩阵可以通过相加对应元素来形成新矩阵。\n\
  \n### 矩阵乘法–\n两个匹配的矩阵，例如 `(m × n)` 和 `(n × r)`，可以相乘形成一个新的 `(m × r)` 矩阵，其元素为一个矩阵第\
  \ `i^(th)` 行与另一个矩阵第 `j^(th)` 列元素乘积之和。\n\n### 平均值–\n平均数。平均值可以是样本平均值或总体平均值。它是最常用的集中趋势度量。\n\
  \n### 集中趋势尺度–\n衡量数据集中性的指标有平均值、中位数和众数。\n\n### 离散程度–\n衡量数据变异性的指标有范围、标准差和方差。\n\n###\
  \ 中位数–\n排序数据的中间值。对于 `n` 个观测值（`n` 为奇数），位数是第 `(n + 1)/2` 个值。如果 `n` 是偶数，位数是第 `n/2`\
  \ 和 `n/2 + 1` 位置数值的平均值（某些作者倾向于在 `n` 为偶数时将两个中间值均称为位数）。\n\n### 众数–\n数据中出现最高的值。\n\n\
  ### 蒙特卡洛方法–\n一种随机采样方案，可能是工业和政府应用最广泛的数学，通常被称为仿真。\n\n### 互斥–\n（不相交）没有公共元素的集合或事件。集合的交集为空集。\n\
  \n### 名尺度–\n具有不同标记的定性数据（例如，苹果和梨）。\n\n### 正态分布（高斯分布）–\n概率分布中最重要的，非正式描述为钟形曲线。\n\n\
  ### 空集–\n（空集），一个没有元素的集合。\n\n### 目标函数（线性规划）–\n需要优化的函数，通常受约束限制。\n\n### 观测显著性水平–\n\
  检验统计量偏离假设值的概率。\n\n### 序尺度–\n数据的定性排序或顺序（例如，第一名、第二名）。\n\n### 平行线–\n斜率相同且永不相交的直线。\n\
  \n### 矩阵–\n在博弈论中，各种策略的收益（损失）矩阵。\n\n### 排列–\n在 `n` 个对象中排列 `r` 个对象（`r ≤ n`）不放回且考虑顺序的方法数。\n\
  \n### 垂直线–\n以直角相交的直线。此类线的斜率互倒数。\n\n### 饼图–\n（或圆图）用于展示定性数据。\n\n### 主元元素（线性规划）–\n\
  确定变为基变量的非基变量。它是单纯形表中具有最小（负）目标系数的列以及具有最小正比率 `b/a` 的行中的单元格。\n\n### 点估计–\n统计学中，对总体参数的数值估计（例如，![bgloss-math-0007](img/bgloss-math-0007.png)\
  \ 是 ![bgloss-math-0008](img/bgloss-math-0008.png) 的点估计）。\n\n### 泊松分布–\n连续体（例如时间）中离散事件的概率分布。它是交通、电话通话、血液样本、材料缺陷等非常有用的描述符。\n\
  \n### 总体–\n结果的总和。通常，统计学家对总体进行推断。\n\n### 投资组合–\n一组投资选择。\n\n### 现值–\n未来资金的价值。\n\n\
  ### 原始问题–\n每个线性规划都与另一个线性规划相关；其中一个（任意一个）被称为“原始规划”，另一个（推导出的）是其“对偶规划”。\n\n### 本金–\n\
  笔资金。\n\n### 最优原理\n动态规划中的最优策略具有以下性质：无论之前的决策如何，剩余决策相对于当前状态而言都是最优策略。\n\n\n\n\n\n| **概率分布–**\
  \ | 偶然事件相对频率的数学表示。它可以是连续或离散值的随机变量。 |\n| **定性–** | 无法用数值衡量的分类数据。 |\n| **定量–** | 数值数据。\
  \ |\n| **随机变量–** | 随机取值。 |\n| **极差–** | 数据中最大值与最小值之间的差。 |\n| **比例标度–** | 具有绝对零点的标度（例如：开尔文温度、重量、高度等）。\
  \ |\n| **优势化化法–** | 通过消除行或列中的优势策略来减少博弈论策略的数量。 |\n| **正则矩阵–** | 马尔可夫链中缺少零元素的转移矩阵（或其幂）。\
  \ |\n| **相对频率–** | 归一化总和为单位的频率。 |\n| **鞍点–** | 收益矩阵中同时是行最小且列最大值的元素。 |\n| **样本–**\
  \ | 总体体的子集。 |\n| **样本空间–** | “实验”中所有互斥偶然结果的集合。 |\n| **单纯形法–** | 用于求解线性规划的迭代数值方案（算法）。\
  \ |\n| **奇异矩阵–** | 不可逆的矩阵。（行列式为零。） |\n| **松弛变量–** | 添加到“小于等于”不等式约束以产生等式的非负变量。 |\n\
  | **斜率–** | “升直除除”或“`y` 值的变化除以 `x` 值的变化”。 |\n| **方程的解–** | 使方程成立的变量值。 |\n| **稳定概率向量–**\
  \ | 马尔可夫链概率向量，满足稳态条件，使得进一步的转移不会改变最终状态概率。 |\n| **标准差–** | 衡量平均值离散程度或变异性的；方差的平方根。\
  \ |\n| **标准极大化问题–** | 以最大化为目标、所有约束均为“小于等于”、且变量和约束右侧均为非负的线性规划。 |\n| **标准正态随机变量–**\
  \ | 均值为零、方差为一的正态分布；通常用 `Z` 表示。 |\n| **直线折旧法–** | 根据设备和建筑的使用龄或使用情况对其价值进行的线性折旧。年度线性折旧额为常数。\
  \ |\n| **子矩阵–** | 较大矩阵的子集。 |\n| **代入法–** | 求解方程组的代数方法。解出一个变量，将其代入方程的其他位置。 |\n| **求和符号–**\
  \ | 希腊字母 `Σ` 表示指定值的求和。 |\n| **剩余变量–** | 从“大于等于”不等式约束中减去以产生等式的非负变量。 |\n| **线性规划的表–**\
  \ | 常数和系数的表格格式，便于使用单纯形法。 |\n| **终点–** | 网络或树图中的端点。 |\n| **超越数–** | 如 `π` 和 `e` 等不是实系数多项式方程的根的数。\
  \ |\n| **转移图–** | 描绘马尔可夫链的转移概率。 |\n| **转移矩阵–** | 马尔可夫链中状态之间转移的概率。 |\n| **矩阵转置–**\
  \ | 行列互换的矩阵。 |\n| **旅行推员问题–** | 一种为了最小化“推员”访问若干城市恰好一次且不返回的路程的路线规划。它是上世纪最有用且数学上困难的问题之一。\
  \ |\n| **树图–** | 多个事件的图形化表示。 |\n| “**双人零和博弈**” | 一种两人游戏，一方的收益（损失）是另一方的负值。 |\n| **均匀分布–**\
  \ | 随机变量所有取值具有相等概率的分布。 |\n| **全集–** | 所有可能结果的总和。 |\n| **游戏值–** | 一局博弈的净（平均）值。 |\n\
  | **变量–** | 数值发生变化的量。 |\n| **方差–** | 变异性的衡量标准；围绕平均值的平方波动的平均值。 |\n| **变化–** | 在正比例中，两个相关量同步增加或减少。在反比例中，一个量增加时另一个量在减少。\
  \ |\n| **韦恩图–** | 集合及其关系的描绘。 |\n| ***Z*-分数–** | 通过 ![bgloss-math-0009](img/bgloss-math-0009.png)\
  \ 将“原始分”`x` 转换为“标准正态分”。 |\n\n# 索引\n\n## A\n- 摊销 (amortization)\n- 年收益率 (annual rate\
