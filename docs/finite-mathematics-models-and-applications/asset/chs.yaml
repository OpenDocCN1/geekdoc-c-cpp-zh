  \ 100 美元、三等奖 50 美元。三次抽取产生中奖者。单张票的期望值是多少？\n\n\n\n\n\n虽然解决概率问题通常需要针对特定情况进行“定制化处理”，但许多分析从一个*理想化*或*原型*模型开始是有用的。从这些原型中，可以推导出理想的**概率分布**。\n\
  \n首先，想象一系列类似于抛硬币的重复试验，这被称为**伯努利试验**（Bernoulli Trials），它们具有以下特征。\n\n必须记住，这些是理想化的试验。它们是几种广泛使用的概率分布的基础。投掷硬币是伯努利试验最简单的例子。重复投掷同一枚硬币，而不调整硬币的姿态，是对第一个特征的合理近似。第二个特征只考虑两种可能的结果：正面或反面。硬币可能会立在硬币上；这是第三种可能的结果。在这里，此类试验简单地被称为无效试验且不计入统计。第三个特征假设（例如）正面的概率在每次投掷中都是相同的。\n\
  \n批量制造的物品通常可以被视为一系列伯努利试验。事实上，结果偏离伯努利试验的现象是制造过程中存在缺陷的线索。例如，重复结果之间看似缺乏独立性，可能是制造过程中存在不完美或缺陷的线索。另一个例子是，缺陷出现频率（试验概率）的变化可能追溯到机器部件的磨损等。\n\
  \n许多伯努利试验的实例或其合理近似并不总是显而易见的。例如，河流的最大（或最小）年流量或风载和雪载等。需要仔细连续的年度最大值是否为合理的伯努利试验，因为例如河床的改变或土地利用模式的改变会影响这些假设。定期的股市变化或销售波动可能是“上”或“下”。混凝土圆柱的测试、离开高速公路的车辆数以及数据传输可以合理地描述为伯努利试验。有时，伯努利试验是人为构造的。例如，为了评估一种防腐蚀海军漆，可以对一组船的一侧进行常规处理，而另一侧则采用新的处理方法。此后，每只船被视为一次伯努利试验，如果新处理方法“有用”则为“成功”，否则为“失败”。\n\
  \n通常，试验成功的概率用 `p` 表示，失败概率用 `q` 表示。由于每个结果都是成功或失败，因此![c8-math-0043](img/c08-math-0043.png)。\n\
  \n### 二项概率分布\n\n考虑一系列 `n` 次伯努利试验，![c8-math-0052](img/c08-math-0052.png)，“成功”的概率为\
  \ `p`，![c8-math-0053](img/c08-math-0053.png)，“失败”的概率。恰好有 `x` 次“成功”后跟 ![c8-math-0054](img/c08-math-0054.png)\
  \ 次“失败”的概率为\n\n![equation](img/c08-math-0055.png)\n\n然而，这是某一种特定“成功”和“失败”排列的概率。例如，“在五次伯努利试验中获得两次成功”的事件可能是\
  \ `S S F F F`，概率为 ![c8-math-0056](img/c08-math-0056.png)。另一种可能性可能是 `S F F F S`。显然，每种可能的排列具有相同的概率。\n\
  \n回顾组合数学（第 7 章），在五次伯努利试验中获得两次成功恰好有 ![c8-math-0057](img/c08-math-0057.png) 种排列。通常，在\
  \ `n` 次伯努利试验中 `x` 次“成功”的概率为\n\n![equation](img/c08-math-0058.png)\n\n这是 `n` 次伯努利试验中成功次数的著名的**二项分布**。\n\
  \n有些人使用紧凑的函数符号 ![c8-math-0059](img/c08-math-0059.png)，或简单的 ![c8-math-0060](img/c08-math-0060.png)\
  \ 来简写这种二项分布，因为看一看，`b` 就表示二项分布。随机变量为 `x`，试验次数为 `n`，试验成功概率为 `p`。\n\n二项分布与许多实际问题相关。这些包括工业抽样、药物测试、遗传学、流行病、医学诊断、民意调查、社会现象分析、鉴定测试、水文学等。练习题具有说明性。\n\
  \n示例 8.2.3 和 8.2.4 阐明了章节开头提到的原型的价值，即概率的简便计算。\n\n随机结果的结果有时是背直觉的。例如，一台机器生产的芯片具有特征性的高缺陷率，例如\
  \ ![c8-math-0072](img/c08-math-0072.png)。假设进行了调整试图改进输出。如果检查 ![c8-math-0073](img/c08-math-0073.png)\
  \ 片芯片且没有发现任何一个 ![c8-math-0074](img/c08-math-0074.png) 有缺陷，其概率为 ![c8-math-0075](img/c08-math-0075.png)。如果同样地检查了另外三片芯片且没有发现有缺陷（即\
  \ ![c8-math-0076](img/c08-math-0076.png)），则概率为 ![c8-math-0077](img/c08-math-0077.png)。\n\
  \n二项分布的图除非 ![c8-math-0078](img/c08-math-0078.png) 否则对称的。理论或原型分布源于假设（例如，抛硬币）。经验分布源于观测和测量。二项分布的名称源于二项式展开\
  \ ![c8-math-0079](img/c08-math-0079.png)。\n\n![equation](img/c08-math-0080.png)如果将\
  \ `a` 替换为 `p`，`b` 替换为 `q`，`r` 替换为 `n`，很容易看出展开式的项就是二项分布 ![c8-math-0081](img/c08-math-0081.png)\
  \ 随着 `x` 取其值。实际上，我们验证了 ![c8-math-0082](img/c08-math-0082.png) 是一个正确的分布。\n\n### 二项试验模型\n\
  \n这种使用二项式展开的最后推导没有提供特殊的见解，也不允许进一步的概念开发。以下“事件语句”方法更有启发性！\n\n考虑事件：\n\n![c8-math-0083](img/c08-math-0083.png)\
  \ “在 n 次伯努利试验中恰好有 x 次成功” ![c8-math-0084](img/c08-math-0084.png)。\n\n事件 **A** 的实现只有当以下事件之一发生时：\n\
  \n![c8-math-0085](img/c08-math-0085.png) “在 ![c8-math-0086](img/c08-math-0086.png)\
  \ 次伯努利试验中恰好有 x 次成功，且第 ![c8-math-0087](img/c08-math-0087.png) 次试验失败。”或\n\n![c8-math-0088](img/c08-math-0088.png)\
  \ “在 ![c8-math-0089](img/c08-math-0089.png) 次伯努利试验中恰好有 ![c8-math-0090](img/c08-math-0090.png)\
  \ 次成功，且第 ![c8-math-0091](img/c08-math-0091.png) 次试验成功。”\n\n事件 **A** 是事件 **B** 和\
  \ **C** 的并集。即：\n\n![equation](img/c08-math-0092.png)\n\n这可以写成概率陈述\n\n![equation](img/c08-math-0093.png)\n\
  \n因为 **B** 和 **C** 是互斥事件。\n\n\n\n\n\n令 ![c8-math-0104](img/c08-math-0104.png) 代表\
  \ ![c8-math-0105](img/c08-math-0105.png)，因为它是两个（离散）变量的函数。事件 `B` 和 `C` 本身是联合事件。但在伯努利试验的假设下，每个事件都由独立事件组成。令\
  \ `p` 为每次试验成功的概率，那么 ![c8-math-0106](img/c08-math-0106.png) 可以表示为 ![c8-math-0107](img/c08-math-0107.png)，而\
  \ ![c8-math-0108](img/c08-math-0108.png) 则表示为 ![c8-math-0109](img/c08-math-0109.png)。（我们暂时通过忽略\
  \ `x` 和 `n` 的值来简化讨论。）\n\n因此，\n\n![equation](img/c08-math-0110.png)\n\n当 ![c8-math-0111](img/c08-math-0111.png)\
  \ 和 ![c8-math-0112](img/c08-math-0112.png) 时。\n\n这是一个关于两个离散变量 `x` 和 `n` 的差分方程。这类方程的解并不困难，但可能并不熟悉。它的解是\n\
  \n![equation](img/c08-math-0113.png)\n\n并且可以很容易验证。\n\n这种基于事件陈述发展的方法有很多优点。首先，起始的事件陈述编码了两种可能的结果。然后它演变为概率陈述，而概率陈述进一步演变为函数关系。这种函数格式使用了独立性假设。最后，确定概率分布变成了一个求解差分方程的问题。\n\
  \n注意这种建模方法在泛化方面的潜力。在这种格式下，很容易将伯努利试验扩展到两个以上的可能结果；这些被称为泊松试验（Poisson Trials）。如果独立试验的假设不成立，人们可以处理差分方程更大的复杂性，和/或寻求近似表示。这在任何方面都优于通常初等推导中的数学“死胡同”。有大量的知识可以通过分析和/或数值技术来求解各种类型的差分方程。\n\
  \n此外，这种格式还可以研究试验概率 `p` 不为常定的情况，例如，它可能取决于之前的成功次数，即 `x` 和/或 `n` 的函数。最后，也是非常重要的一点是，这种针对概率分布的模型方法不依赖于许多概率论证中常见的“等概率”假设。\n\
