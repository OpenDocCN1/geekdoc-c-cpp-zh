  \n17. **17.** 重复之前的练习对于：\n\n18. **18.** 找到正则马尔可夫链的稳定向量。\n\n## 9.4 吸收链\n\n虽然某些马尔可夫链可以无限持续发生无限事件（例如天气变化），但其他马尔可夫链会自然终止；例如赌徒输光或老鼠离开迷宫。这类马尔可夫链被称为\
  \ `absorbing`（吸收链）。\n\n马尔可夫链中的一个状态如果无法离开，则该状态是 `absorbing state`。如果可以离开某个状态，则它是\
  \ `nonabsorbing`（非吸收的）。\n\n如果转移概率矩阵至少有一个从每个非吸收状态都能到达的吸收状态，则该马尔可夫链是 `absorbing chain`（吸收链）。注意吸收状态的线索：主对角线上的“1”。\n\
  \n吸收链转移概率矩阵的吸收状态具有特殊作用。将吸收状态重新标记并排序，使其出现在非吸收状态之前。这种转移概率矩阵的新格式被称为 `canonical form`（标准形式）。\n\
  \n标准形式包含四个子矩阵，按逆时针标记为 `I`、`R`、`S` 和 `0`。\n\n![image](img/c09uf023.jpg)\n\n在这里，`I`\
  \ 是一个维度等于吸收状态数量的单位矩阵。矩阵 `R` 是从非吸收状态到吸收状态的转移概率。方矩阵 `S` 是非吸收状态之间的转移概率，`0` 是零矩阵。\n\n\
  基础矩阵 `N` 定义为 ![c9-math-0165](img/c09-math-0165.png)，在吸收链的研究中非常有用。它的元素是在吸收之前，从一个非吸收状态访问另一个非吸收状态的*期望*（平均）*次数*。也就是说，从非吸收状态\
  \ *j* 开始，吸收之前访问另一个非吸收状态 *k* 的期望次数是 `N` 的第 ![c9-math-0166](img/c09-math-0166.png)\
  \ 个元素：*j*, *n*，对应于 *n* 状态马尔可夫链。\n\n\n\n当从非吸收状态开始时，到达吸收状态之前的预期（平均）步数，可以通过相加 `N` 中对应于起始非吸收状态的行的条目来得到。\n\
  \n矩阵 `C`（其中 `![c9-math-0169](img/c09-math-0169.png)`）决定了链从给定的非吸收状态开始进入特定吸收状态的概率。对应于非吸收状态的行和对应于吸收状态的列提供了\
  \ `C` 中的项，即为相关的概率。\n\n这些思想在下一个例子中得到了说明。\n\n### 练习题 9.4\n\n1. **1.** 判断这些是否为吸收马尔可夫链：\n\
