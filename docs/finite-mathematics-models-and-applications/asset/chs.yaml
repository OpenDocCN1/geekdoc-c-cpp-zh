  \ 单位矩阵 ![c03-math-0296](img/c03-math-0296.png) 通过一次初行变换得到，则称为**初等矩阵**。\n\n**子矩阵**是从较大的矩阵通过删除某些行和/列得到的矩阵。\n\
  \n在求解线性方程组时，应用初行变换形成一种称为**简化行**的矩阵有助于确定方程的解（如果有）。每个初行变换都必须应用于上一次变换后的矩阵。\n\n### 阶梯矩阵\n\
