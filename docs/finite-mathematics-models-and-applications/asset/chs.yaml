  - 示例 3.4.6 单一商品经济\n- 示例 3.4.7 投入-输出分析\n- 示例 3.4.8 三行业投入-输出\n\n## 历史说明\n简单来说，`matrix`\
  \ 是一个称为 `elements` 或项的数字数组。它们允许按照规定的规则以“批量”格式对数字进行代数运动。因此，它们非常适合自动化计算，即对构成矩阵的元素重复执行特定的命令。结果是矩阵日益增长的重要性与计算机能力的增强和成本的降低相并行。矩阵对于计算机在工程、密码学和高科技成像中处理大规模甚至海量信息以及求解大型方程组的能力至关重要。此外，正如“历史说明”所述，矩阵对社会科学也很重要。\n\
  \n## 3.1 矩阵\n### 引言\n本节介绍了矩阵方法在求解方程组中的应用。\n\n回顾第 1 章，方程组是通过简单的代数操作求解的。例如，方程\n\n\
  ![equation](img/c03-math-0001.png)\n\n通过将第二个方程乘以 ![images/c03-math-0002.png] 加到第一个方程得到：\n\
  \n![equation](img/c03-math-0003.png)\n\n另一种方法（其原理在以后很有用）允许自动化计算。我们通过一个简单的例子来演示。\n\
  \n将第一个方程除以 `x` 的系数 2，得到新的形式 ![images/c03-math-0004.png。\n\n接下来，利用这个方程消去第二个方程中的 `x`。这里只需要相加，因为\
  \ ![images/c03-math-0005.png] 和 ![images/c03-math-0006.png] 消消了。结果是\n\n![equation](img/c03-math-0007.png)\n\
  \n现在，将最后一个方程乘以 2 得到 ![images/c03-math-0008.png。最后，“回代” ![images/c03-math-0009.png]\
  \ 到第一个方程得到 ![images/c03-math-0010.png。该方程组的序对解为 (13, 8)。\n\n我们可以修改前两个例子中的迭代程序及其矩阵格式，从而在不需要“回代”的情况下获得解。这种方法被称为高斯-乔旦消元法，通过代数迭代将方程组转换为具有以下性质的格式：\n\
  \n* *变量在系统中只出现一次*。\n\n* *变量的系数为 1*。\n\n* *每个方程最多有一个变量*。\n\n\n\n注意，在高斯-乔旦消元的最后步骤中，变量按数字倒序从每个先前的方程中消除。也就是说，第三个方程中的\
  \ ![c03-math-0038](img/c03-math-0038.png) 被用于消去前两个方程中的 ![c03-math-0039](img/c03-math-0039.png)。这确定了\
  \ ![c03-math-0040](img/c03-math-0040.png)的值。接下来，用第二个方程中 ![c03-math-0041](img/c03-math-0041.png)的值来消去第一个方程中的\
  \ ![c03-math-0042](img/c03-math-0042.png)。现在得到了 ![c03-math-0043](img/c03-math-0043.png)\
  \ 的值。这种组织确保了变量的系统化消除。\n\n如前所述，用于两个方程两个未知数的方法（通过代入一个变量的值来确定另一个）不适用于许多方程和变量的系统。\n\n\
  高斯-乔旦消元法将在第 3.3 节中进一步讨论。注意在处理矩阵格式而非整个方程时，高斯-乔旦消元的便利性。它被用于许多计算机程序。记住，并不是所有的方程组都有解，有些可能有多个解。我们稍后会考虑这些。矩阵方法对于自动化计算是无价的。\n\
