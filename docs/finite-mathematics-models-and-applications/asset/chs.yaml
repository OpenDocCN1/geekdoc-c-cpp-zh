  \n## 5.2 表格与主元操作\n\n在本节中，我们将开发一种求解线性规划的格式和步骤。\n\n回使用松弛变量重写的线性规划（第 5.1 节）：\n\n![equation](img/c05-math-0050.png)\n\
  \n为了方便起见，将程序组织为 `tableau`（表格）格式如下：\n\n| 行 | `x[1]` | `x[2]` | `x[3]` | `s[1]` |\
  \ `s[2]` | `s[3]` | RHS |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
  \ |\n| 1 | 5 | 7 | 10 | 1 | 0 | 0 | 90,000 |\n| 2 | 1 | 3 | 4 | 0 | 1 | 0 | 30,000\
  \ |\n| 3 | 1 | 1 | 1 | 0 | 0 | 1 | 9,000 |\n| 目标 | -6 | -13 | -20 | 0 | 0 | 0 |\
  \ ![c5-math-0054](img/c05-math-0054.png) |\n\n注意，最后一行包含目标系数，且 `Z` 被移动到 RHS（右侧常数），当前值为零。如果表格的某列中只有一个“1”且该列的其他位置全为\
  \ 0，则对应的变量（位于该列顶部）被称为 `basic variable`（基变量）。在上面的当前迭代中，![c5-math-0056](img/c05-math-0056.png)、![c5-math-0057](img/c05-math-0057.png)\
  \ 和 ![c5-math-0058](img/c05-math-0058.png) 是基变量。\n\n非基变量（此处为 ![c5-math-0059](img/c05-math-0059.png)、![c5-math-0060](img/c05-math-0060.png)\
  \ 和 ![c5-math-0061](img/c05-math-0061.png)）值为零。随着求解的进行，基变量和非基变量可能会改变状态。然而，每个约束中恰好有一个基变量。\n\
  \n在以三个松弛变量为基变量的初始表格（上一个）中，它们在 RHS 处的当前值为 ![c5-math-0062](img/c05-math-0062.png)、![c5-math-0063](img/c05-math-0063.png)\
  \ 和 ![c5-math-0064](img/c05-math-0064.png)。从几何上讲，将非基变量等于零等于在可行区域的顶点处评估基变量。\n\n此阶段或\
  \ `iteration`（迭代）的解从表格中读取为 ![c5-math-0065](img/c05-math-0065.png)、![c5-math-0066](img/c05-math-0066.png)、![c5-math-0067](img/c05-math-0067.png)、![c5-math-0068](img/c05-math-0068.png)\
  \ 以及目标 ![c5-math-0069](img/c05-math-0069.png)。\n\n既然有了 SMP（单纯形规划问题）的方便格式，我们接下来寻找一种方法从一个可行解变为另一个可行解，并希望更接近最优解。\n\
  \n一个可行解通过恰好一个基变量交换恰好一个非基变量来变为另一个可行解。也就是说，当前的基变量变成非基变量，而当前的非基变量变成基变量。这种“一换一”的交换保持了基变量的数量等于约束方程的数量，所有其他变量均为非基变量。\n\
  \n这仍然留有一个问题：将哪个非基变量提升为基变量，因此哪一个基变量变成非基变量。`pivot element`（主元）是实现所需更改的关键。\n\n要选择主元，请选择一个目标系数为负值的列。按照惯例，当存在多个负目标系数时，选择值最小（最负）的对应列。该列的非基变量是入基基变量。回想本节开头介绍的示例中的目标\
  \ ![c5-math-0070](img/c05-math-0070.png)。如果我们选择一个负系数，一个非基变量将变为基变量，从而从零增加，`Z` 的值增加，向最大值移动。选择正系数的非基变量将减少\
  \ `Z` 的值，不是有用的。\n\n接下来，研究计划进入基的非基变量所在列中 `b`（常数）与 `a`（约束系数）的比率，即 RHS 与对应正值约束系数的比率。该比率是非基变量在不违反该约束的情况下从当前零值增加的幅度。如果约束系数为负，则该非基变量可以增加到任何值而不违反该约束，显然不是好的选择。新基变量只能通过这些正值\
  \ `b/a` 比率来增加。出现这种情况的约束确定了主元（如果选择最小的 `b/a` 比率，将违反约束）。\n\n示例 5.2 说明了上述讨论。\n\n以下是选择主元的步骤。\n\
  \n如果目标列的所有元素均为负或零，则 Z 的最大值为无穷。由于这不可能是实际问题的答案，可能是公式中遗漏了约束，或者在转抄时出错，或者必须修复某种情况。一旦确定了主元，下一步是\
  \ `pivot operation`（主元操作）。为了使主元变为单位，将该行除以它的值。然后从其他行减去该行行的倍数，直到获得所需的零。这种 `Gauss-Jordan\
  \ elimination`（高斯-若旦消元法）方案持续到第一个主元。下一节迭代到最优解。\n\n### 5.2 练习\n\n1. 画出初始表格 ![c5-math-0034](img/c05-math-0034.png)。\n\
