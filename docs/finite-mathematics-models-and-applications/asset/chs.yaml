  \ 100 人的班级中，57 人是女性。该级有 50 名大一学生，其中 23 名男性。使用树图确定有多少女性。\n\n## 7.4 组合数学\n\n如果有 `![c7-math-0283](img/c07-math-0283.png)`\
  \ 种类的元素和 `![c7-math-0284](img/c07-math-0284.png)` 种类的元素，恰好有 `![c7-math-0285](img/c07-math-0285.png)`\
  \ 对元素，即由每种元素组成的对。这是本章之前考虑过的直积。\n\n如果有 `![c7-math-0286](img/c07-math-0286.png)` 种第一类元素、`![c7-math-0287](img/c07-math-0287.png)`\
  \ 种第二类元素以及 `![c7-math-0288](img/c07-math-0288.png)` 种第三类元素，则分别有 `![c7-math-0289](img/c07-math-0289.png)`\
  \ 个三元组（称为**三元组**），由每种元素组成，以此此类推。\n\n这一结果推广为**乘法原理**，有时称为**计数基本原理**。\n\n连续自然数的乘积被称为**阶乘**。例如，“五阶乘”表示为\
  \ `5!`，是乘积 `5 * 4 * 3 * 2 * 1`。根据定义，`0! = 1`。\n\n更一般地，\n\n```\n![equation](img/c07-math-0301.png)\n\
  ```\n\n### 组合数学\n\n三位数锁有多少种数字组合？摩斯密码需要多少个符号（点和划）？大型电信网络或对大量人口进行分类时需要多少个连接？\n\n\n\
  \n\n这些是与名为`combinatorics`（组合数学）的数学分支相关的几个例子。它是“超级计数”，通常处理远超日常经验、远超手指脚数量的数字。随着计算机软件的发展，组合数学吸引了更多的兴趣。一些用途包括密码学和其他安全代码或设备、网络设计以及软件程序。\n\
  \n我们对组合数学的主要用途是在概率和统计分析中以计算概率。在所有结果出现概率均等的情况下，某一特定事件的概率是该事件发生方式数与总结果数之比。\n\n考虑以下问题：\n\
  \n*从包含 `n` 个元素的总体中选择 `r` 个元素的样本共有多少种方法？*\n\n这个查询中存在两个歧义！\n\n第一个是在从总体中选出的项目在进行下一次选择之前是否会被放回。如果是，那么重复选择实际上是从原始总体中进行的。如果不是，总体在每次选择之后、下一次选择之前都会发生变化。\n\
  \n第二个是项目之间是否可以相互区分。如果不可区分，则项目的选择顺序无关。如果项目之间是相互区分的，那么选择顺序就变得相关。\n\n下面的树状图展示了根据结果是`不放回`还是`有放回`选择以及考虑顺序的四种可能结果。\n\
  \n![inline image](img/c07uf013.jpg)\n\n我们逐一考虑它们！\n\n### 排列 (Permutation)\n\n不放回且考虑顺序的被称为`permutation`（排列）。可以使用乘法原理轻松计算。第一个元素显然有\
  \ `n` 种方式进行选择。由于是不放回，下一次抽取是从 ![c7-math-0306](img/c07-math-0306.png) 个元素中进行的，依此类推，如\
  \ ![c7-math-0307](img/c07-math-0307.png)。这很容易看出是 `r` 个数字 ![c7-math-0308](img/c07-math-0308.png)\
  \ 的乘积。它也可以以阶乘形式写为 ![c7-math-0309](img/c07-math-0309.png)!\n\n排列考虑了顺序。例如，Jane 坐在\
  \ Joe 之前和 Joe 先坐 Jane 坐在他后面是不同的。\n\n### 组合 (Combination)\n\n在许多情况下，顺序可能是不相关的，正如上面的例子所示，如果\
  \ Jane 和 Joe 是一对的话。为了方便，让 `y` 代表从 `n` 个元素中不放回且不考虑顺序地选择 `r` 个元素的方法数。现在，为了恢复顺序，`y`\
  \ 种方法中的每一种都必须乘以 `r!`，即 `r` 个元素的排列（permutations）数量。那么 (`y`)(`r!`) 就变成了排列 ![c7-math-0314](img/c07-math-0314.png)!也就是说，![c7-math-0315](img/c07-math-0315.png)!\
  \ 解出 `y` 得到 ![c7-math-0316](img/c07-math-0316.png)，并称为 `combination`（组合），并由 ![c7-math-0317](img/c07-math-0317.png)\
  \ 表示。即，![c7-math-0318](img/c07-math-0318.png)。\n\n有时，组合 ![c7-math-0319](img/c07-math-0319.png)\
  \ 被写为 ![c7-math-0320](img/c07-math-0320.png)，排列则写为 ![c7-math-0321](img/c07-math-0321.png)。可以证明\
  \ ![c7-math-0322](img/c07-math-0322.png)。排列的数量通常比组合多，除非 ![c7-math-0323](img/c07-math-0323.png)\
  \ 或 1。还应该注意 ![c7-math-0324](img/c07-math-0324.png)。这种发生是因为包含 `n` 个元素中的 `r` 个元素的方法与排除\
  \ `n` 个元素中的 ![c7-math-0325](img/c07-math-0325.png) 方法是相同的。\n\n例如，一套台球有 15 个编号为 ![c7-math-0326](img/c07-math-0326.png)\
  \ 的球。选择三个 ![c7-math-0327](img/c07-math-0327.png) 球的方法数是排列 ![c7-math-0328](img/c07-math-0328.png)。假设选中的实际球（任意地）编号为“1”、“8”和“15”。排列\
  \ ![c7-math-0329](img/c07-math-0329.png) 包含了 6 种 ![c7-math-0330](img/c07-math-0330.png)\
  \ (`r!`) 种三个选定球的排列方式：“1”，“8”，“15”，“1”，“15”，“8”，“8”，“1”，“15”，“8”，“15”，“1”，“15”，“1”，“8”，“15”，“8”，“1”。\n\
  \n现在，假设顺序不重要。那么排列 ![c7-math-0331](img/c07-math-0331.png) 变成了组合 ![c7-math-0332](img/c07-math-0332.png)。从\
  \ 15 个元素中选择三个 ![c7-math-0333](img/c07-math-0333.png) 球的方法数是 ![c7-math-0334](img/c07-math-0334.png)。组合\
  \ ![c7-math-0335](img/c07-math-0335.png) 被写为 ![c7-math-0336](img/c07-math-0336.png)，排列写为\
  \ ![c7-math-0337](img/c07-math-0337.png)。可以证明 ![c7-math-0338](img/c07-math-0338.png)。排列的数量通常比组合多，除非\
  \ ![c7-math-0339](img/c07-math-0339.png) 或 1。还应该注意 ![c7-math-0340](img/c07-math-0340.png)。这种发生是因为包含\
  \ `n` 个元素中的 `r` 个元素的方法与排除 ![c7-math-0341](img/c07-math-0341.png) 个元素的方法是相同的。\n\n\
  例如，一套台球有 15 个编号为 ![c7-math-0342](img/c07-math-0342.png) 的球。选择三个 ![c7-math-0343](img/c07-math-0343.png)\
  \ 球的方法数是排列 ![c7-math-0344](img/c07-math-0344.png)。假设选中的实际球（任意地）编号为“1”、“8”和“15”。排列\
  \ ![c7-math-0345](img/c07-math-0345.png) 包含了 6 种 ![c7-math-0346](img/c07-math-0346.png)\
  \ (`r!`) 种三个选定球的排列方式：“1”，“8”，“15”，“1”，“15”，“8”，“8”，“1”，“15”，“8”，“15”，“1”，“15”，“1”，“8”，“15”，“8”。\n\
  \n现在，假设顺序不重要。那么排列 ![c7-math-0347](img/c07-math-0347.png) 变成了组合 ![c7-math-0348](img/c07-math-0348.png)。从\
  \ 15 个元素中选择三个 ![c7-math-0349](img/c07-math-0349.png) 球的方法数是组合 ![c7-math-0350](img/c07-math-0350.png)。\n\
  \n组合的积有助于确定一系列事件的发生方式。许多事件可以分解为步骤或阶段。分析每个阶段，然后将它们合并。结果集的元素数量通常使用乘法原理确定，如下所示。\n\n\
  当排列是圆形的或存在几组不同的对象时，会出现特殊情况。*n* 个不同对象的圆周排列（如钥匙环上的钥匙）是 ![c7-math-0351](img/c07-math-0351.png)!\n\
  \n*n* 个不同对象的排列，其中 ![c7-math-0352](img/c07-math-0352.png) 是第一类，![c7-math-0353](img/c07-math-0353.png)\
  \ 是第二类，![c7-math-0354](img/c07-math-0354.png)，且 ![c7-math-0355](img/c07-math-0355.png)\
  \ 是第 *r* 类，其排列数为：\n\n![equation](img/c07-math-0356.png)\n\n这通常由符号\n\n![equation](img/c07-math-0357.png)\
  \ 表示并称为 `multinomial`（多项式系数）。\n\n### 练习题 7.4\n\n\n\n\n\n1. 如果使用数字 {2, 3, 6, 7, 8}\
