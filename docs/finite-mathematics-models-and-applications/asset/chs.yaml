  \ 且方程组的解为 ![c03-math-0276](img/c03-math-0276.png)，请将其为方程组。\n\n### 3.3\n\n一个线性方程组的右侧全为零，则称该方程组是**齐次的**。即：\n\
  \n![equation](img/c03-math-0277.png)\n\n每一个齐次线性方程都是一致的，因为总存在一个**零解** ![c03-math-0278](img/c03-math-0278.png),\
  \ ![c03-math-0279](img/c03-math-0279.png)。对于每一个齐次方程，以下恰好有一项成立：\n\n1. 唯一的解是零解。\n\
  2. 除了零解外还有无穷多个解。\n\n当变量个数超过方程个数时，齐次线性方程有无穷多个非零解。\n\n有时，通过替换为相同解线性方程组更容易。三种初行变换如下：\n\
  \n1. 方程可以乘以任何非零常数。\n2. 方程对可以交换。\n3. 将一个方程的倍数加到另一个方程。\n\n初行变换可以在增广矩阵上进行，因为它们的行对应于方程组。一个\
