  ### 1. 示例 2.4.5 波斐那契数列\n\n## 5. 历史笔记\n\n## 2.1 单利与复利\n\n### 2.1.1 单利\n\n你听过句格言：“今天的一美元不等于明天的一美元。”在许多语境下，在这里我们的意思是金钱可以产生更多金钱！\n\
  \n利息是为了使用资金而支付或收取的款项。当你借钱时，你支付利息的承诺是贷款人提供资金的诱因。在你的储蓄或货币市场账户中，你是贷款人，你的账户会计入利息。\n\n\
  借入资金被称为**本金**。利率以每单位时间内每美元的金额来表示。利率通常以小数形式表示。例如，假设年利率为 6%，意味着一年后每美元本金要支付 6 分钱的利息。为了方便比较利率，习惯上以年为单位表示。\n\
  \n在最简单的情况下，应计利与本金、时间和利率成正比。\n\n累积的总金额 `A`（本金加利息）为：\n\n![equation](img/c02-math-0002.png)\n\
  \n利息是定期支付的。有时，贷款利会在到期日以外的其他时间段收取（或支付）。因此，当资金（利息加本金）保持投资状态时，在下一个支付周期，利息不仅像以前一样对本金支付，还会对之前赚取的利息支付。这就是**复利**。\n\
  \n### 2.1.2 复利\n\n令 ![c02-math-0011](img/c02-math-0011.png) 为以利率 `r` 投资时间 `t`（年）的初始本金，则\
