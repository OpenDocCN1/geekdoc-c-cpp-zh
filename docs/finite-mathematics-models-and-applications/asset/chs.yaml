  \ 为 $15,000。确定生产计划。\n\n## 历史注释\n\n在伊恩·布拉德利和罗纳德·L·米克的著作《*矩阵与社会*》中（这是一本通俗良好的普林斯顿大学出版社书籍，1986\
  \ 年），他们提出了关于矩阵对社会科学家重要性的有趣案例。他们将对物理科学发展至关重要的多变量数学，与社会科学中所需的巨量变量以及因此社会科学所需的不同数学（主要是矩阵理论）进行了对比。\n\
  \n本杰明·富兰克林将其创作的一个奇特的魔幻方阵称为“任何魔术师制作过的方阵中最具魔幻性的”。保罗·C·帕塞尔在《本杰明·富兰克林的数字：一段无名的数学奥游》中对此有精彩的描述。\n\
  \n***亚瑟·凯利 (1821–1895)*** —— 卓越的英国数学家，以其在代数的工作闻名。他对理论动力学和天文学也做出了贡献，是最早考虑三维以上几何的数学家之一。凯利是\
  \ 19 世纪英国纯数学派的领袖。在执业法律的 14 年里，他写了 250 多篇数学论文。1863 年，他成为剑桥大学数学教授，并在那里研究高维几何的同时，还开发了矩阵代数。凯利是研究矩阵的早期数学家之一。行列式的符号归功于他。\n\
  \n凯利在矩阵方面的工作为海森堡量子力学的发展奠定了基础。从以后，矩阵已成为大型数据库计算操作以及社会科学理论发展的基础。\n\n***卡尔·弗里德里希·高斯\
  \ (1777–1855)*** —— 出生德国，作为数学家、物理学家和天文学家而闻名。被称为“数学家王子”，高斯在数论、函数论、概率、统计学、电磁理论等领域做出了深远贡献。\n\
  \n高斯从 1795 年到 1798 年在哥廷根大学学习。他的博士论文是证明了每个代数方程至少有一个根（解）。这个挑战了数学家几个世纪的定理被称为“代数数基本定理”。高斯坚持在发表任何结果之前进行完备的证明。因此，许多发现并没有归于他的名下。然而，他发表的作品已足以确立他作为或许是史上最伟大的数学家的声誉。\n\
  \n***卡米尔·乔丹 (1838–1921)*** —— 出生于法国，名玛丽·恩内蒙德·卡米尔·乔丹，接受过工程师训练。在担任工程师期间，他写了 120 篇数学研究论文。他几乎发表了他时代数学的所有分支论文。他主要作为一名代数家闻名，对求解线性方程组的消元法进行了改进，现在被称为高斯-乔丹消元法。\n\
  \n***瓦西·列昂惕夫 (1906–1999)*** —— 经济学教授之子，出生于俄罗斯圣彼得堡。他在列宁格大学学习经济学、哲学和社会学，1925 年搬到柏林，后来在柏林大学获得博士学位。1931\
  \ 年，列昂惕夫加入美国国立经济研究院，当时是实证经济研究的中心。一年后，他加入了哈佛大学教职。\n\n很早时候，他对一个经济部门的变化如何影响其他经济部门感兴趣。他的工作（即使在早期）在二世界大战期间的国家战争生产规划中发挥了重要作用。他的投入产出经济分析被用于展示一个行业的投入产生消费或投入另一个行业的产出的广泛过程。它有助于理解国家内部和国家之间的贸易。列昂惕夫设计的矩阵格式经常用于显示最终产品生产的变化对投入需求的影响。他是\
  \ 1973 年诺贝尔经济学奖得主。\n\n### 第 3 章补充练习\n\n1. **1.** 假设 `A` 是一个 ![c03-math-0631](img/c03-math-0631.png)\
