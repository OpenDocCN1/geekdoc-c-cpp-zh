  列奥纳多·斐波那契（Leonardo Fibonacci）是一位 13 世纪的商人学者，他曾过：“如果每对兔子每月都生出一对新兔子，而新兔子从第二个月开始具有繁殖能力，那么一年内从一对兔子可以产生多少对兔子？”\n\
  \n这个问题的答案产生了著名的斐波那契数。\n\n斐波那契数与另一个有趣的数字——**黄金比例**有关。黄金比例在 2000 年前就被欧几里得所知。通过研究由分段线\
  \ ![inline image](img/c02uf003.jpg) 得出的比例\n\n![equation](img/c02-math-0138.png)，他得出了二次方程\
  \ ![c02-math-0139](img/c02-math-0139.png)。\n\n它的根为 ![c02-math-0140](img/c02-math-0140.png)，其正根约等于\
  \ 1.6180339887…，即黄金比例 Φ。\n\n黄金比例表现为斐波那契数的极限比值：\n\n![equation](img/c02-math-0141.png)\n\
  \n这些比值在它们的极限值 Φ 上下波动。\n\n奇的是，![c02-math-0145](img/c02-math-0145.png) 的倒数是其小数部分 0.618。一种边长比例为“黄金比例”（即\
  \ 1:1.618 或等值的 0.618:1）的矩形几个世纪以来一直为人知。它出现在希腊帕特农神庙和其他经典的建筑结构和设计中。\n\n### 2.4 练习题\n\
