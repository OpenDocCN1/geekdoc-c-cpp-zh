  \ | 0.50 | 0.25 | 0.15 | 0.10 |\n\n假设每周有五个交易日。\n\n\n\n\n\n### 引言\n\n如前所述，随机采样已广为人知；而蒙特卡洛方法（Monte\
  \ Carlo）是对旧思想的新颖变体。它与传统的简单随机采样不同，后者总体中的每个项目被选中的概率是相同的；而在蒙特卡洛方法中，总体中项目的被选取概率与所模拟的实际概率情况相同。\n\
  \n该方法与第二次世界大战（WWII）期间的博弈游戏有关，并获得了摩纳哥公国赌博中心的华丽名称。约翰·冯·诺依曼（John von Neumann）和斯坦尼斯瓦夫·乌拉（Stanislaw\
  \ Ulam）的名字经常与蒙特卡洛方法的早期联系在一起。\n\n二战后的多年里，蒙特卡洛方法在许多领域获得了重要且多样化的追随。军事防御系统；桥梁和其他结构设计；车辆交通模式、信号和速度；手术程序；电话网络分析；火车和飞行时刻表；工程建设是蒙特卡洛方法不可或缺的众多角色之一。\n\
  \n到此时你应该意识到蒙特卡洛技能有多容易掌握，以及你可能对其产生多大的用途。使用基于计算的蒙特卡洛方法，人们可以在几分钟内模拟数月数的数据。它允许对可以控制的因素进行操作，而无需在实际系统上进行实验的时间风险。\n\
  \n约翰·冯·诺依曼（1903–1957）—— 参见第 11.1 节。\n\n斯坦尼斯瓦夫·M·乌拉（1909–1984）——一位对二战“曼哈顿计划”做出显著贡献的波裔美国数学家。他是最早利用随机采样（蒙特卡洛方法）寻求原子理论近似解的人之一。\n\
  \n## 11.5 动态规划\n\n为人知的动态规划，通过递归优化将例如 `n` 个变量中的单一优化替换为 `n` 个每个针对一个变量的最大值（或最小值）。单变量优化问题通常比多变量问题容易解决得多。该方法由理查德·贝尔曼（Richard\
  \ Bellman）在 20 世纪 50 年代专家开发，已应用于各种背景下的各种顺序决策问题，且有时取得了令人惊叹的结果。\n\n动态规划的解决方案取决于将问题转化为阶段性或顺序格式，在这种格式下，一个阶段的解决方案成为下一阶段解决方案的输入。该过程持续到获得整个解决方案。\n\
  \n动态规划取决于最优性原理。通俗地说，无论系统状态如何，最优策略仅取决于当前状态，而与到达该状态的方式无关。数学工作通常由与特定数学形式相关的定理驱动。在动态规划中，除了阶段性结构外，没有特定的数学格式。最优原理具有“解耦”问题阶段的效果。在许多方面，使用动态规划解决优化和决策是通过示例学习的艺术。\n\
  \n递归定义函数的方法，其中主体函数被应用于自身的定义中。正向递归和反向递归产生相同的结果。正向递归可能看起来更有逻辑，但反向递归通常应用于动态规划问题中，因为它在许多情况下计算效率似乎更高。下一个示例将针对上一个示例使用反向递归。\n\
  \n动态规划已应用于设备更换、库存建模、投资规划、生产调度、蛋白质序列对齐以及“背包”问题和“旅行员”问题。子问题计算中状态变量数量的增加会导致被称为“维度灾难”的计算困难。\n\
  \n本章介绍的问题在本质上是确定性的。我们所说的确定性，是指方法的下一阶段状态完全由当前状态和策略决策决定，而不是取决于任何需要概率分布的随机事件。\n\n分析上述解决方案是有启发意义的。首先，注意从节点\
  \ M 到节点 D 的任何路径都需要恰好六步：三次向北和三次向东。这意味着可能的路径数量可以通过组合计算：\n\n```\n![equation](img/c11-math-0660.png)\n\
  ```\n\n在示例的“![c11-math-0661](img/c11-math-0661.png)”网络中，任何路径上的总成本通过六个成本的五次加法计算得出。因此，通过完全枚举求解\
  \ 20 种可能的路径需要 100 次加法。上述动态规划解决方案仅需要 24 次加法（包括在节点 C 和 H 处的评估）。\n\n对于“![c11-math-0662](img/c11-math-0662.png)”网络，有\
  \ ![c11-math-0663](img/c11-math-0663.png)条路径，每条路径有![c11-math-0664](img/c11-math-0664.png)次加法。这意味着完全枚举大约需要\
  \ 350 万次加法。\n\n对于“![c11-math-0665](img/c11-math-0665.png)”网络，完全枚举大约需要![c11-math-0666](img/c11-math-0666.png)次加法。每秒能够进行![c11-math-0667](img/c11-math-0667.png)次加法的计算机几乎需要\
  \ 80 天才能完成完全枚举。即使使用计算机，对于更大的问题，对完全枚举替代方案也是明显的。\n\n动态规划中巨大的计算收益是因为并不是条路径都被枚举。沿路径的枚举只有在当路径有望成为最优解决方案的一部分时才会继续。当这种可能性消失时，路径就会被放弃，从而节省进一步的计算工作。通常，计算量随完全枚举变量的数量指数级增长。先前的示例通过从“结束”或最终阶段开始说明了递归的思想。在许多感兴趣的情况下，所需的优化比简单地比较两个数字的最大值或最小值更复杂。为了更好地可视化动态规划的概念公式，将一个先前的数值示例符号化。\n\
