  \ b) 恰好拥有三项物品中的两种？ | c) 拥有手机或 DVD？ |\n\n### 7.3 树图\n\n**树图**是*有向图*的一种示例，其分支从一个起点出发。“树”的起点是它的**根**。**路径**表示从根到**终点**的移动且不回溯。构造得良好的树可以简化计数问题和概率计算。它们是绘制复杂决策（称为**决策树**）的常用方法，例如大型建设和设计项目，以及航天计划和商业规划等。\n\
  \n一个含有 `n` 个元素的集合的子集数量为 `![c7-math-0239](img/c07-math-0239.png)`（注：此处公式通常应为 $2^n$），包括空集和集合本身。这在下一个例子中得到了体现。\n\
  \n有时，树图比韦恩图更容易显示。下一个例子重新复习了示例 7.2.3 中的韦恩图。\n\n### 7.3 练习题\n\n1. **1.** 找到 `![c7-math-0281](img/c07-math-0281.png)`\
