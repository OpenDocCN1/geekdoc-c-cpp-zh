  \n\n\n\n## 5. 62.\n\n2004 年 6 月，一次里氏级 4.1 级的地震袭击了伊利诺伊州北部。其影响波波从威斯康星州一直到密苏里州，从密歇根州西部一直到爱荷华州。中西部地区的另一次地震，即\
  \ 1895 年的“万圣节地震”，估计里氏级为 6.8 级。万圣节地震比伊利诺伊北部地震强多少倍？\n\n## 1.6 变化\n\n科学公式可以表示许多类型的变化。在**正比例**关系中，两个相关量可以同时增加或同时减少。例如，时薪\
  \ `y` 与工作小时数 `x` 成正比。用符号表示为：![c01-math-0508](img/c01-math-0508.png)，其中 `k`（时薪）是一个**比例常数**。![c01-math-0509](img/c01-math-0509.png)\
  \ 的图像是一条过原点的直线。\n\n![inline image](img/c01uf011.jpg)\n\n物理学家使用弹簧的*胡克定律*将力 `y` 直接与其弹性限内的伸长量\
  \ `x` 联系起来。即：![c01-math-0513](img/c01-math-0513.png)，其中 `k` 被称为*弹簧系数*，是比例系数。建筑设计自古以来就使用了比例关系。\n\
  \n**几何相似性**与比例有关，可以性地简化数学建模。在几何相似中，物体之间存在一一对应的关系，使得它们对应点之间的距离之比为常数。记住，如果两个三角形的角相等，则它们相似。对于图中所示的相似三角形：![c01-math-0522](img/c01-math-0522.png)。\n\
  \n![inline image](img/c01uf012.jpg)\n\n正比例不是非线性的。也就是说，它可以随 `x` 的**幂次正比例变化**。数学“幂模型”的形式为：\n\
  \n![equation](img/c01-math-0530.png)\n\n例如，圆的面积 `A` 与其半径 `r` 的平方成正比，如：![c01-math-0531](img/c01-math-0531.png)。\n\
  \n在另一种变化形式——**反比例**中，一个量的增加会导致另一个量的减少，其表达式为：![c01-math-0542](img/c01-math-0542.png)\
  \ 或 ![c01-math-0543](img/c01-math-0543.png)。\n\n虽然简单正比例的图像是过原点的直线，但当 `x` 和 `y` 为正值时，简单的反比例是第一象限中的*等支双曲线*（所示）。![inline\
  \ image](img/c01uf013.jpg)\n\n例如，对于光和声，波频 ![c01-math-0546](img/c01-math-0546.png)\
  \ 与波长 ![c01-math-0547](img/c01-math-0547.png) 成反比，因此 ![c01-math-0548](img/c01-math-0548.png)\
  \ 是常数；恒温下气体的压力 `P` 与体积 `V` 成反比，因此 ![c01-math-0549](img/c01-math-0549.png)（常数）表示了波义定律；以此类推。\n\
  \n更一般的反比例，例如作为 `x` 的 `n` 次方，可以表示为：\n\n![equation](img/c01-math-0552.png)\n\n*牛顿万有引力定律*两个质量之间的引力\
  \ `F` 与它们之间距离 `x` 的平方成反比。即：![c01-math-0553](img/c01-math-0553.png)，其中 `k` 是比例系数。类似地，光源的光照强度与光源距离的平方成反比。\n\
  \n还有其他更复杂的变化形式。许多化学和物理关系都表现出某种类型的变化。例如，梁的强度与使用的材料数量、种类以及梁的形状有关。矩形梁为结构增加了显著强度，因此经常被用于桥梁和建筑。\n\
  \n供需关系的经验性经济关系；货币供应与通货膨胀；短期长期利率等通常具有复杂的变化形式。\n\n### 1.6 练习题\n\n1. **1.** 描述所示的变化：\n\
