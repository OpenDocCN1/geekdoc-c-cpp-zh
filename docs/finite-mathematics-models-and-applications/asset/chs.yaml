  \n1. **9.1.1** 马尔可夫链是随机变量序列，其中每个状态的概率仅取决于上一次事件获得的状态。\n2. **9.1.2** 转移矩阵用于表示在不同状态之间移动的概率。\n\
  \n### 9.2 平稳分布\n\n1. **9.2.1** 平稳分布是在转移后保持不变的概率分布。\n2. **9.2.2** 我们可以通过求解方程 `π =\
  \ `=` 来找到平稳分布。\n\n### 9.3 吸收链\n\n1. **9.3.1** 吸收马尔可夫链是指至少有一个无法离开的状态。\n2. **9.3.2**\
  \ 我们可以使用基础矩阵计算吸收的期望时间。\n\n### 9.4 马尔可夫链的应用\n\n1. **9.4.1** 马尔可夫链广泛应用于金融、生物学和计算机科学等多个领域。\n\
  \n\n\n\n\n对于后天（下一阶段），天气取决于明天的天气，以此此类推。这些是随机过程，其结果取决于多个先前的结果，而不仅仅是表征马尔可夫链的单一结果。对这些的研究超出了我们的范围。然而，作为一种模型的马尔可夫链通常是现实且实用的，其数学描述也非常完善。马尔可夫模型已应用于学习、记忆、社会流动、生态系统、不确定性下的决策等领域的研究。\n\
  \n## 9.1 转移矩阵与转移图\n\n马尔可夫链从一个状态转移到另一个状态的概率称为`转移概率`。在天气示例中，“雨”到“无雨”的转移概率为 0.4，而“无雨”到“无雨”的转移概率为\
  \ 0.8，以此此类推。注意，转移概率本质上就是条件概率。\n\n转移概率通常以图形或矩阵的形式表示。如下所示。你可以根据喜好选择其中一种或两者！\n\n![image](img/c09uf002.jpg)\n\
