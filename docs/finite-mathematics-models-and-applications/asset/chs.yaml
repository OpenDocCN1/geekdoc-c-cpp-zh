  \ ![c7-math-0057](img/c07-math-0057.png)。注意，虽然集合不能进行算术加法，但数字可以！\n\n同样，并集的大小是减去重复元素后其组成集合的大小之和。用符号表示，对于两个集合\
  \ `A` 和 `B`，\n\n```\n![equation](img/c07-math-0058.png)\n```\n\n如果 `A` 和 `B` 是任意两个集合，那么所有满足\
