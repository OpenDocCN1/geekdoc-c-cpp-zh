  \ ![c10-math-0606](img/c10-math-0606.png) Find 一个 99% 的置信区间。\n\n## 10.6 开发和开展调查\n\
  \n营销人员、公共官员、健康和社会规划机构以及民意调查者寻求有关感兴趣人群的可靠信息。通常，时间和成本限制使得`census`（对整个总体进行调查）并不可行。抽样调查满足了这一需求！在`简单随机调查`中，总体的每个成员都有相同的被选机会。虽然调查有很多类型，但简单随机调查是最常见的，也是本节的主题。\n\
  \n样本调查是较大集合`总体`的子集（样本）。对样本中的每个成员观测或测量感兴趣的特征，并此计算均值和方差等汇总统计量。根据样本数据对总体进行推断。这些推断的有效性和可靠性取决于样本选择和测量采取的仔细程度。获得合格的样本通常并不容易！\n\
  \n有些民意调查失败得非常惨，因此闻名。你能判断它们为什么失败吗？\n\n*   《文学摘》（The Literary Digest）是当时一本著名的杂志，它预测\
  \ 1936 年总统选举中，共和人阿尔弗雷德·兰登将压倒性击败民主人富兰克林·罗斯福。实际上，兰登仅在两个州获胜，并以巨大的选举人差距输掉了选举。\n*   盖洛调查（The\
  \ Gallup Poll）与当时几乎所有其他领先的全国调查一样，预测 1948 年总统选举中，共和人托马斯·杜基将大胜现任总统哈里·特鲁曼。最终，特鲁曼是胜者。\n\
  *   在 2000 年总统选举中，电视网络调查在傍晚早期预测佛罗里达州属于民主人阿尔伯特·戈尔。晚些时候，他们撤回了对佛罗里达州的预测，称“差距到无法判定”。最终，美国最高法院判定共和人乔治·W·布什胜得选举。\n\
  *   1985 年，可口可乐公司发起了一项巨大的营销活动。它宣布将根据广泛的市场调查对其著名的饮料进行重新配方。配方改变后不久，公众的抗议导致公司恢复了原始配方，并命名为“经典可乐”。\n\
  \n虽然设计合格的调查可能很困难，但解释它们有时会失败可能是更大的挑战。\n\n在进行调查时，《文学摘》向拥有电话的人、订阅杂志的人、车主以及一些注册选民邮寄了明信片。这个样本偏向于那些负担得起此类便利设施的富裕阶层。此外，25%\
  \ 的低响应率也可能是一个因素。该调查显然不能代表选民总体，该杂志的信誉损失巨大，以在不久后停止了出版。\n\n尽管民意调查者从 1936 年《文学摘》的经历中汲取了许多经验，但\
  \ 1948 年的选举是另一个例子。调查者和政治评论家再次自信且错误地预测托马斯·E·杜基将轻松击败现任总统哈里·S·特鲁曼。然而，对于调查哪里出了问题，似乎还没有明确的共识！杜基的领先优势被淡化了。\n\
  \n### 结果时需要考虑的问题包括：\n\n*   是谁开展了调查？\n*   样本是否具有代表性？\n*   样本是如何选择的？\n*   是如何进行访谈的？\n\
  *   问了哪些问题？顺序是什么？\n*   调查是什么时候进行的？\n*   哪些因素可能会偏斜结果？\n*   误差范围是多少？\n\n\n\n\n大多数调查都包含针对目标人口的`人口统计学`问题。这些问题可能包括关于受访者的收入、年龄、种族/民族、婚姻状况、性别或受教育程度的问题。除了简单的“是/否”和多选题问题外，研究人员还可以在调查中包含“开放式”或“简答式”问题。虽然这类问题更难统计，且不太可能引发回答，但它们可能会为研究人员提供待考虑的项目。\n\
  \n在调查开始前提供一些关于其目的的信息可能是重要的，例如：回复将如何被使用；以及完成调查所需的预计时间。对个人回答保密性的保证有助于提高回答率。\n\n例如，考虑一项关于禁烟的调查，这在许多地方都是一个有时性的话题。相关信息可能包括个人的年龄、是否吸烟以及频率如何、家庭成员是否吸烟以及对禁烟的意见。可能还有其他有用的问题。接几个例子有助于制定一些调查问题。\n\
  \n有时，调查问题涉及量表法。量表问题有两种类型：评分（rating）和排序（ranking）。在评分中，有一组预先编码的有序回答。在排序中，要求受访者对一组选项进行排序。排序需要一个较短的列表。列表越长，可靠排序越困难。\n\
  \n有时，试点调查（pilot survey）是有用的。使用一部分受试者进行试运行，并按照预期方案对整个小组进行。例如，对于电话调查，测试也应该通过电话进行。试点阶段对于判断合适的长度、识别歧义、澄清问题以及注意潜在的陷阱非常有价值。根据试点调查可以进行修订，如果可能，进行另一次重大的试点测试可能是明智的。数据收集和记录中的错误是常见的。最后，负责实施调查的人员应该进行试运行并预测可能遇到的困难。\n\
  \n### 练习题 10.6\n\n1. **1.** 改进这些调查问题：\n    1. a) 你多久在 `eBay` 上购物？\n    2. b) 你的年收入是多少？\n\
  \    3. c) 你在线购买过多少条短信？\n\n2. **2.** 改进此问题：\n    前总统布什曾提议对社会保障福利进行改革。你\n    1. a)\
  \ 同意 b) 无意见 c) 反意\n    2. b) 这些改变？\n\n3. **3.** 编写一份关于禁烟的短调查（10–20 个问题）。包含人口统计学问题，并针对文中讨论的两种量表类型各包含一个问题。\n\
  \n4. **4.** 在小样本上对短调查进行试点测试，然后重构调查以反映获得的信息。\n\n5. **5.** 针对你们班级感兴趣的话题创建一个调查，进行试点测试并收集结果。以个人或小组形式，简要说明在创建调查方面中学到了什么。\n\
  \n## 历史注释\n\n“statistics”（统计）一词在不同语境下有几种含义。《美国遗传词典》将统计学描述为“对数值数据进行收集、组织和解释的数学，特别是通过抽样推断对总体特征进行分析”。\n\
  \n虽然对数字和数据的兴趣可以追溯到几个世纪以前，但对正态分布在许多不同现象和数据中普遍性的认识，标志着现代数学统计学发展的开端。\n\n到 19 世纪后期，统计学研究的成熟在这些中显而易见……注：提供的源文本在历史部分包含重复/碎片化的句子；我保留了所提供的核心传记信息）。\n\
  \n（注：根据标准文档工程实践，我已清理了重复内容，重点关注 Box、Fisher 和 Gosset 提供的独特传记信息。）\n\n**艾尔默·费舍爵（Sir\
  \ Aylmer Fisher, 1890–1962）** —— 遗传学家和统计学家，出生伦敦。他在剑桥大学学习数学和天文学，对生物学感兴趣。他在 1915 年至\
  \ 1919 年教授数学和物理。他曾担任英国加尔顿实验室的首席统计学家，以及罗瑟姆斯特德农业实验站的统计学家。\n\n在罗瑟姆斯特德，费舍对遗传学以及实验的设计与分析均做出了贡献。他引入了随机化、方差分析和极大似然法的概念，是现代统计学的“父亲”。\n\
  \n**威廉·塞利·戈斯特（William Sealy Gosset, 1876–1937）** —— 英国统计学家在牛津大学新学院接受教育，学习化学和数学，并于\
  \ 1897 和 1899 年获得学位。戈斯特在爱尔兰的健酿啤酒厂担任化学家，他在啤酒抽样中产生了对统计学的兴趣。他注意到小样本与正态分布存在无法解释的小微偏差，并设计了\
  \ `t` 分布来解释它们。戈斯特以笔名 `Student` 发表，`t-distribution`通常以此名称称呼。\n\n**乔治·E·布克斯（George\
  \ E. Box, 1919–2013）** 在英国出生并长大。战后，他在伦敦大学学院获得了数学和统计学学位。从 1948 年至 1956 年，布克斯担任帝国化学工业（ICI）的统计学家。1960\
  \ 年，布克斯加入威斯康星大学麦迪逊分校，开始建立该系系。\n\n### 第 10 章 补充练习题\n\n1. **1.** 按类别（定性、定量）和类型（名义、序数、区间、比例）对这些数据分类：\n\
