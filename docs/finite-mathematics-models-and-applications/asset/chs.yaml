  \ ![c7-math-0564](img/c07-math-0564.png)？\n\n\n\n\n在第 7 章中，你学习了概率论的要素。在那里计算的概率假设所有结果的发生几率相等。此外，每个问题都需要单独或定制的解决方案。在本章中，我们研究适用于一般情况的概率。它们引出了被称为`概率分布`的概率公式，这些公式适用于一类情况。其优势在于，当出现可识别的情况或或类似的情况时，可以将它们与已经计算过的概率分布相关联。这通常比设计定制的解决方案要容易得多。\n\
  \n记住，偶然性情况的结果被称为`样本点`，它们的总和称为`样本空间`。样本点可以用`随机变量`来描述，即一个根据偶然情况取值的变量。当样本点是离散或可计数的时（例如硬币抛掷中正朝上的次数或交通事故的数量），随机变量是`离散取值的`。当样本点位于连续体上时（例如降雨量或燃料消耗），随机变量是`连续取值的`。\n\
  \n### 概率分布\n\n对于离散随机变量，`概率分布` ![c8-math-0001](img/c08-math-0001.png)，![c8-math-0002](img/c08-math-0002.png)\
  \ 将概率与`x`的每个值相关。它可以是图形、表格或数学公式。例如，![c8-math-0003](img/c08-math-0003.png)，![c8-math-0004](img/c08-math-0004.png)\
  \ 代表与掷骰相关的概率。\n\n离散随机变量的概率分布具有以下属性：\n\n1. **a.** 所有概率均为非负且上限为 1。即，![c8-math-0005](img/c08-math-0005.png)。\n\
  2. **b.** 样本空间上的概率之和恰好为 1。即，![c8-math-0006](img/c08-math-0006.png)，其中 ![c8-math-0007](img/c08-math-0007.png)\
  \ 是`X`的可能值。\n\n### 期望值\n\n随机变量`X`的`期望值`是其（长期）`平均`值或`均值`的正式名称。这个名字并不理想，因为平均值既不需要是“预期的”，甚至不可能是可能的结果。例如，每三组地重复抛掷公平硬币时，反面出现的（长期）平均次数是\
  \ 1.5 次。当然，这不可能是一个实际的结果。\n\n随机变量`X`的期望值通用符号为 ![c8-math-0016](img/c08-math-0016.png)。它是通过将随机变量的每个值与其相关的概率相乘，并对随机变量的所有值求和得到的。例如，掷三枚硬币的![c8-math-0017](img/c08-math-0018.png)。\n\
  \n将平均值命名为期望值不仅不理想，符号 ![c8-math-0023](img/c08-math-0023.png) 也是如此。通常，此类符号用于函数。`X`的期望值绝不可能是`X`的函数。\n\
  \n### 练习 8.1\n\n1. **1.** 将这些随机变量分类为离散或连续：\n    - a) 建造新房的时间。\n    - b) 页面上的印刷错误数量。\n\
