  \ Hutchison）的家庭是“哈奇逊森”家族唯一的家庭。\n\n读完故事后，回答以下问题：\n\n1. **a.** 假设比尔·哈奇逊森家庭的某位成员中了签，那么特丝（Tess）成为中奖者的概率是多少？\n\
  2. **b.** 当按字母顺序抽取签条时，每个家庭被选中的概率相等吗？\n3. **c.** 为什么所有村民的中奖概率并不相等？\n4. **d.** 解释为什么“家庭中已婚子女的性别”与“中奖签”在统计学上是相互依赖的。\n\
  5. **e.** 如何进行抽签，才能使每个村民中奖并被石头石死的的概率相等？\n\n## 7.6 贝斯法则与决策树\n\n第 7.3 节中的树图展示了事件的样本空间。在本节中，我们为组件“分支”事件分配概率。某些事件的结果影响后续事件的事件序列通常是关注的重点。有时用树图来表示它们是有帮助的。树上每个分支的概率是在给定先验分支上的事件已经发生的条件下，指定事件发生的条件概率。一个在““分支”上带有条件概率的“树”被称为`概率树`。\n\
  \n在识别出所有终点后，样本空间概率被记录在从根到终点的路径上。所关注的概率是各个分支概率乘积之和。接下来的示例说明了这种技术。\n\n### 全概率公式与贝斯法则\n\
  \n关注的事件通常取决于其他事件的发生。例如，如果可以通过几条路线中的任意一条到达目的地，那么“到达目的地”事件只能与沿着恰好一条路线旅行同时发生。另一个例子：丢失的物体在几个不同的位置之一。“物体被找到”这一事件只能与这几个位置中的一个相关。\n\
  \n这些例子暗示了偶然事件是`互斥的`；也就是说，一个者的发生排除了其他者的发生（例如，如果硬币显示正面，它就不能显示反面）。此外，假设偶然事件是`完全完备的`；也就是说，没有其他（未说明的）偶然情况。这些思想在并集和交集的集合中表示为：\n\
  \n![equation](img/c07-math-0493.png)\n\n其中 ![c7-math-0494](img/c07-math-0494.png),,\
  \ ![c7-math-0495](img/c07-math-0495.png)是`n`个互斥且完全完备的偶然事件，其中必须有一个事件与事件 `A` 同时发生。\n\
  \n由此得出：\n\n![equation](img/c07-math-0498.png)\n\n所有的联合事件都是互斥的，因此它们的概率为零。最后一个表达式被称为`全概率公式`，在理论和应用中都非常重要。它允许利用条件概率（可以从数据中恢复）来计算一个难以捉摸的事件\
  \ `A` 的概率。此外，该表达式通过偶然事件的概率对这些条件概率进行了适当的加权。\n\n### 贝斯法则\n\n全概率公式得出了一个被称为`贝斯法则`（或贝斯公式或贝斯定理）的重要结果。条件概率\
  \ ![c7-math-0512](img/c07-math-0512.png)通常可以从记录中获得。例如，使用 ![c7-math-0513](img/c07-math-0513.png)到达目的地（事件\
  \ `A`）；或者结构性失效（事件 `A`）是由失效模式 ![c7-math-0514](img/c07-math-0514.png)导致的；或者血液测试（事件\
  \ `A`）实际上是假的（模式 ![c7-math-0515](img/c07-math-0515.png)),其中 ![c7-math-0516](img/c07-math-0516.png)。\n\
  \n然而，实际问题通常涉及事件反转后的条件概率，即 ![c7-math-0517](img/c07-0517.png)。因此，灾难性（或关注的）事件 `A` 已经发生，感兴趣的是其原因或相关事件。\n\
  \n显然，![c7-math-0518](img/c07-math-0518.png)。\n\n这就是贝斯法则。它在关注的主要事件已经发生的情况下，估计因果或起源事件的概率。这是一种“向后看”。另一个例子是，“报告有龙卷风”，寻求其位置的概率估计；或者“记录到发烧”，寻求其可能原因的概率。使用这种几率概率估计是为了缩小对实际原因的搜索。\n\
  \n注意 ![c7-math-0519](img/c07-math-0519.png)（称为`后验概率`）是用已知条件概率 ![c7-math-0520](img/c07-math-0520.png)\
