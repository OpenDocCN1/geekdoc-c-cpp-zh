  \n## 流体混合问题\n\n`fluid blending`（流体混合）问题结合了产品混合型和饲料混合两种类型的特征。目标可以是最小化混合成本，也可以是最大化利润。某些约束由于资源限制可能是“小于”类型，而“大于”约束则确保满足或超过某些最小混合规格。\n\
  \n你将遇到双下标的使用，如上方的 ![c6-math-0048](img/c06-math-0048.png)。在线性规划应用中，它们是建模“从……到……”情况的便利工具。例如，![c6-math-0049](img/c06-math-0049.png)\
  \ 表示“从工厂 `i` 到仓库 `j`”。因此，![c6-math-0050](img/c06-math-0050.png) 例如一眼就能看出从例如 2 号工厂移动到\
  \ 3 号仓库的单位数。\n\n## 分配问题\n\n想象有若干工人以及等数量的任务需要给他们分配。每个工人相对于每个任务都有一个效率。问题是将任务分配给工人，以实现总效率最大化的方式。每个工人相对于每个任务的成本或时间的互补问题则构成了一个最小化问题。这两种情况的原理是相同的。\n\
  \n虽然示例中作业数量和工人的数量是相同的，但它们不必如此。可以认为工人可能会分担某些作业，使得 ![c6-math-0061](img/c06-math-0061.png)\
  \ 不仅仅是 0 或 1。线性规划理论中的一个定理（此处未引用）确保了，由于约束的右侧为 1，`x` 的最优值是 1 或 0。手动进行数值计算可以澄清解的性质。\n\
  \n## 运输问题\n\n运输型问题是前文分配问题的推广，其名称暗示了它产生的背景。想象有若干个工厂（生产产品）和若干个仓库（存储产品）。不同的工厂和仓库通常生产和存储的数量不同。\n\
  \n从每个工厂到每个仓库的运输成本可能有所不同。问题是：应该从每个工厂向每个仓库运送多少数量以满足他们的需求，并使总运输成本最低？\n\n你可能再次注意到双下标变量在分配和运输问题中的用处。多个下标在数学符号中很常见，用于表示维度。在线性规划中并非如此，双下标符号通常表示“从……到……”的关系。在更复杂的情况下，三个或更多下标是很有用的，也许是为了反映材料或零件通过连续生产阶段的移动。同样令人满意但显然更不方便的表示法是对变量进行顺序编号。然而，这可能需要频繁查阅“目录”来识别变量。\n\
  \n## 背包问题\n\n在经典的背包问题中，有各种已知重量和价值（或效用）且数量不同的物品可用于填充一个受总重量限制的形象背包。目标是使背包物品的价值最大化。\n\
  \n## 边料问题\n\n边料问题是另一个经典的线性规划。胶片、纸、织物等是以巨大的母卷形式的，然后切割成较小尺寸供商业使用。目标是在满足商业需求的同时最小化切割过程中的边料浪费。\n\
  \n你可能会质疑为什么在仅需要精确数量 ![c6-math-0114](img/c06-math-0114.png) 时在需求约束中使用“大于”符号。答案部分是出于通用建议——给优化技术尽可能大的自由度。这有助于数学寻找最佳分配。不必要的等式约束可能会忽略更优的替代方案。\n\
