  20. ![equation](img/c11-math-0120.png)\n\n### 历史笔记\n\n***埃米尔·波尔 (Émile Borel, 1871–1956)\
  \ –*** 法国数学家，就读于巴黎高等师学院。22 岁时，波尔被任命为利尔大学数学教授。他被誉为创立了第一个点集测度的有效理论。他的工作是现代实变函数理论的开端。从\
  \ 1921 年到 1927 年，波尔发表了一系列关于博弈论的论文，并成为第一个定义策略游戏的人。波尔写了近 300 篇论文和 30 多本书。\n\n***约翰·冯·诺依曼\
  \ (John Von Neumann, 1903–1957) –*** 二世纪最杰出的数学家之一。有些人认为他奠定了二十世纪数学的很大方向。他在非亚里士德逻辑和博弈论数学方面的基础性工作对量子物理的发展起了作用。\n\
  \n### 11.2 在金融和经济学中的应用\n\n#### 金融：“贴近生活”\n\n这里是一些日常生活中的财务原则。\n\n#### 尽早储蓄\n\n从 1963\
  \ 年开始，“早储蓄者”每年向标普 500 指数基金投资 2000 美元，持续 10 年，然后让这笔钱增长，总投资额为 20,000 美元。遗憾的是，“早储蓄者”的时机糟糕得难以信。每年的\
  \ 2000 美元投资都是在标普 500 指数处于全年最高的一天进行的。（目标是“低买高卖”）。\n\n“晚储蓄者”也每年向同一只标普 500 指数基金投资 2000\
  \ 美元。然而，“晚储蓄者”从 1973 年开始，持续投资了 20 年（是“早储蓄者”的两倍），并且同样让钱增长——总投资额为 40,000 美元。幸运的是，“晚储蓄者”的时机运气惊人。每年的投资都是在标普\
  \ 500 指数处于全年最低的一天进行的！结果如何？\n\n截至 1999 年 5 月，“晚储蓄者”的账户价值 848,917 美元。资金的惊人增长！惊讶的是，“早储蓄者”的账户价值为\
  \ 876,004 美元——而投资只有一半！\n\n这就是定期储蓄而非“晚期储蓄”的力量！这是几何增长与算术增长的区别。\n\n（改编自 1999 Louis\
  \ Rukeyser 出版）\n\n#### 如何计算年收益率\n\n报纸和杂志上有关于共同基金的平均收益率的广告。通常没有说明“平均”定义。有算术平均值和几何平均值——它们是不一样的。哪种衡量资金的方式更有意义？\n\
  \n\n\n实际上，由于利率和预期寿命具有不确定性，使用概率分布的 `Monte Carlo Method` 允许进行练习中建议的各种实验。在这里，我们使用均匀概率分布来说明\
  \ `Monte Carlo Method`。你可以将下一个示例推迟到学习第 11.4 节。\n\n## 现金流最大化\n\n许多商业活动是通过合同进行的，合同中规定了工作的完成时间以及如何进行（周期性）付款。\n\
