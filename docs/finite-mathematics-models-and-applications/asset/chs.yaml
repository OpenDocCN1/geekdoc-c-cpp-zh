  \ 18 |\n\n### 3.4 矩阵求逆与输入输出\n\n任何方阵 `A` 如果存在另一个方阵 `B`，使得其乘积为单位矩阵 ![c03-math-0417](img/c03-math-0417.png)，则称该矩阵具有**逆矩阵**。记性质为\
  \ ![c03-math-0418](img/c03-math-0418.png)。\n\n要找到方阵 `A` 的逆矩阵，首先构造增广矩阵 ![c03-math-0435](img/c03-math-0435.png)，左侧为\
  \ `A`右侧为相同维数的单位矩阵 `I`。竖线用于区分两个矩阵。竖线并不是代表等号，而是为了方便处理相关矩阵。\n\n与高斯-乔旦消元法相同的操作用于将矩阵\
  \ ![c03-math-0436](img/c03-math-0436.png) 转换为 ![c03-math-0437](img/c03-math-0437.png)，其中\
  \ ![c03-math-0438](img/c03-math-0438.png) 是矩阵 `A` 所要求的逆矩阵。\n\n`A` 可能缺少逆矩阵，因此是**不可逆的**。不可逆矩阵被称为**奇异矩阵**。\n\
  \n### 行列式\n\n方阵 `A` 有一个**行列式 det A** 来表示其数值。行列式的计算是通过累加来自 `A` 的所有**带符号代数积**得出的，如下所示。\n\
  \n![c03-math-0450](img/c03-math-0450.png) 矩阵的行列式值为：\n\n![equation](img/c03-math-0451.png)\n\
  \n对于 ![c03-math-0452](img/c03-math-0452.png) 矩阵（2x2 矩阵），注意其计算的“规则”：从左到右乘以对角线元素。即，从“一—一”位置开始，将\
  \ ![c03-math-0453](img/c03-math-0453.png) 乘以 ![c03-math-0454](img/c03-math-0454.png)。然后，减去其他对角线元素的积。\n\
  \n对于 ![c03-math-0455](img/c03-math-0455.png) 矩阵，其行列式的计算为：\n\n![equation](img/c03-math-0456.png)\n\
  \n该行列式使用矩阵的带符号代数积计算。示意图很有用。注意图中并列重复矩阵以执行操作，箭头处的符号表示在计算行列式时是相加还是减去。\n\n![inline image](img/c03uf001.jpg)\n\
  \n以下是一些行列式的规则：\n\n* 如果矩阵包含零行或零列，则行列式的值零。\n* 如果矩阵有两个相同的行或列，行列式的值也为零。\n* 如果其中一行或列是另一行的倍数，则行列式零（因为它们可以通过一次算术运算变为等价）。\n\
  * 如果矩阵的行列式为零，则它没有逆矩阵。\n\n一个 ![c03-math-0457](img/c03-math-0457.png) 矩阵逆矩阵的有用公式使用行列式：\n\
  \n矩阵的逆在求解方程组时很有用。方程组 ![c03-math-0461](img/c03-math-0461.png) 的解由符号 ![c03-math-0462](img/c03-math-0462.png)\
  \ 给出。\n\n密码学（*Cryptology*），秘密代码科学依赖于矩阵。例如，在一个由字母和标点组成的简单代码中，![c03-math-0469](img/c03-math-0469.png),\
  \ ![c03-math-0470](img/c03-math-0470.png), ![c03-math-0471](img/c03-math-0471.png),\
  \ ![c03-math-0472](img/c03-math-0472.png)。\n\n### 输入—输出分析\n\n经济实体（如公司、社区、甚至国家）使用各种资源生产各种产品。反过来，这些产品又成为其他实体的资源，以此此类推。\n\
  \n\n\n\n\n例如，一家汽车制造商使用金属板、塑料、电线、织物、机器、轮胎、水、电力、燃料、动力和其他产品作为资源来生产车辆——其中一些供员工用于送货、运输等，另一些则用于生产其他资源。\n\
  \n投入产出分析的核心思想是经济实体各`部门`之间复杂的相互作用。无论大小，某些部门成为其他部门的资源，从而贡献于其他产品。\n\n矩阵是研究投入产出模型的主要数学手段。\n\
  \n令`![c03-math-0494](img/c03-math-0494.png)` 代表 `n` 个部门的输出单位，`![c03-math-0495](img/c03-math-0495.png)`\
  \ 代表生产单单位输出 `j` 所需的投入单位 `i`；`i`，`![c03-math-0496](img/c03-math-0496.png)`。`![c03-math-0497](img/c03-math-0497.png)`\
  \ 的矩阵 `A` 被各种称为“交换表”、“交易表”、“技术系数矩阵”、“技术矩阵”、“消耗矩阵”以及其他名称。例如，`![c03-math-0498](img/c03-math-0498.png)`\
  \ 是生产 `![c03-math-0499](img/c03-math-0499.png)` 单位部门 `j`（输出）时所需的部门 `i`（投入）的单位数。对所有部门求和时，`![c03-math-0500](img/c03-math-0500.png)`\
  \ 是生产 `![c03-math-0501](img/c03-math-0501.png)` 单位输出 `j` 的部门输出总和。这需要与部门 `j` 输出的需求量\
  \ `j` 相平衡。\n\n我们可以将部门 `j` 的输出写为 `![c03-math-0502](img/c03-math-0502.png)`。这里，`![c03-math-0503](img/c03-math-0503.png)`\
  \ 是部门 `j` 的需求。也就是说，部门 `j` 的总产量减去内部消耗的 `j` 的量。这样的方程适用于 `n` 个部门中的每一个。在矩阵表示法中，`![c03-math-0504](img/c03-math-0504.png)`，其中\
  \ `A` 是技术矩阵，`X` 是输出或生产计划向量，`D` 是 `![c03-math-0505](img/c03-math-0505.png)` 需求向量。这也可以写成\
  \ `![c03-math-0506](img/c03-math-0506.png)`。通过方程两边同乘以 `![c03-math-0507](img/c03-math-0507.png)`\
  \ 来求解 `X`，得到：\n\n```\n![equation](img/c03-math-0508.png)\n```\n\n如果 `![c03-math-0509](img/c03-math-0509.png)`\
  \ 的所有元素均为非负，那么对于任何非负需求向量都可以找到一个非负生产向量，该经济体被称为`生产性的`。\n\n如果技术矩阵或消耗矩阵 `A` 的某一列之和小于\
  \ 1，则相应的行业生产 1 美元的输出所需的消耗少于 1，该行业被称为`有盈利的`。\n\n这个概念可以扩展到具有两个行业的经济体，每个行业生产一种单一商品。每个行业在生产过程中可能会使用自己的一些商品和其他行业的商品。这在示例\
  \ 3.4.7 中所示。\n\n这种对经济实体的想象性描述（通常被称为`投入产出模型`）归功于诺贝尔奖得主经济学家瓦西西·列昂季夫（Wassily Leontief）。它是现代经济理论的基础。\n\
