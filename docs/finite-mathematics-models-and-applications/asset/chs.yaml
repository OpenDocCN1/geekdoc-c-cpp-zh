  \n（注：由于原始文本中存在大量重复段落，翻译时已根据“不要重复输出原文”的指令进行了去重，以下为完整的逻辑译文：）\n\n在一个简单的硬币对决策略中，每位玩家同时展示一个硬币面。如果面相同（例如都是“正面”或都是“反面”），则\
  \ `Player A` 赢得对手的硬币。如果面不匹配，`Player A` 则将硬币让给 `Player B`。游戏的每局过程都可以用一个`收益矩阵`来表示。`Player\
  \ A` 的收益矩阵在左侧。右侧 `Player B` 的收益矩阵是其相反数矩阵。\n\n![image](img/c11uf077.jpg)\n\n显然，在零和博弈中，如果一个玩家的收益矩阵已知，那么对手的收益矩阵也是已知的。因此，只需要显示一个矩阵，且此后的收益矩阵将始终针对\
  \ `Player A`。\n\n为了解释简单硬币对决的收益矩阵，假设 `Player A` 一直采取其第一种策略（正面），希望 `Player B` 也选出正面。一旦\
  \ `Player B` 意识到 `Player A` 一直选出正面，就会切换到第二种策略——反面。通过这种方式，玩家通过切换策略来寻求优势。\n\n在混合策略中，玩家从多种策略中进行选择，通常是随机的，并为每种策略分配频率（概率）。\n\
  \n为了避免在仅使用单次游戏时给对手明显的优势，游戏的对称性建议每位 `Player` 平均在 `R`、`P` 和 `S` 之间随机选择。这个游戏是`公平的`，即如后文所示，它对每位\
  \ `Player` 的价值均为零。\n\n### 基本原理\n\n1. 每位玩家在理性行动，选择最优策略。\n2. 每位玩家都假设对手也会选择最优策略。\n\
  3. 最优策略能使玩家的目标最大化。\n\n可以通过观察法通过删除行或列来缩小收益矩阵的大小。也就是说，如果某行的每个元素都小于另一行中的对应元素，则该行被认为是`被支配的`（dominated），可以从矩阵中删除，因为理性的玩家不会做出那种选择。如果某一列的元素大于另一列的对应元素，则该列是被支配的。\n\
  \n### 支配性化约准则\n\n1. 收益矩阵某行的元素是否被另一行支配？如果是，删除该被支配的行。\n2. 收益矩阵是否存在某列的元素被另一列支配？如果是，删除该被支配的列。\n\
  3. 按任意顺序重复这些步骤，直到没有某行或某列支配另一行。\n\n虽然纯策略偶尔会发生，但更有可能需要混合策略。混合策略的选择通常不像后两个例子那样显而易见。游戏的`价值`是每位\
  \ `Player` 每每局游戏的平均回报。在零和博弈中，如果价值对一个玩家是正的，那么对对手来说就是负的。\n\n一个例子有助于理解概念。\n\n### 极大极小准则\n\
  \n`最优策略`取决于玩家认为什么是“最好的”。在`极大极小`（minimax）策略中，玩家选择策略以使自己最坏的结果最小化。因此，作为行玩家 `Player\
  \ A` 寻求最小收益的最大化。而作为列玩家 `Player B` 则寻求最大收益的最小化。\n\n在上一个例子中，`Player A` 通过 `![c11-math-0014](img/c11-math-0014.png)`\
  \ 策略获得的 2 点收益既是行最小值也是列最大值。它是一个`鞍点`。任何拥有一个或多个鞍点的博弈都被称为`严格确定的`。也就是说，没有其他策略可以提高任何一个玩家的收益。鞍点具有相同的收益值，称为`游戏价值`。它们是由玩家\
  \ `A` 和 `B` 的`纯策略`产生的。如果博弈是`公平的`，其价值为零。如果价值不为零，博弈是偏斜的或不公平的。\n\n通常，不存在最优的纯策略，正如下一个例子所示，博弈是`非严格确定的`。\n\
  \n游戏的`价值`是每局游戏赢得（或丢失）的平均金额。因此，对于混合策略，游戏的价值是一个随机结果。在随机选择的混合策略中，游戏的价值是一个`平均值`或期望值。确定执行混合策略的概率可能是具有挑战性的。值得注意的是，这类游戏可以使用线性规划来求解。\n\
