  \n## 1.7 单位转换与量纲分析\n\n虽然许多感兴趣的物理量可以用不同的单位制表示，但每个量都被认为具有相同的`dimension`。例如，质量或长度可以分别用克、盎司、磅等单位表示，或者分别用厘米、英寸、英尺等单位表示。然而，质量\
  \ `M` 和长度 `L` 是基本维度。许多（如果不是大多数）物理和化学量都可以用质量、长度和时间 `T` 的基本维度表示。\n\n数字，包括超越数（如 ![c01-math-0572](img/c01-math-0572.png)\
  \ 和 `e`）以及三角量，被认为是无量纲的。\n\n通过`量纲分析`，方程两边的量纲必须相同，否则表达式就不可能是正确的。科学家利用这种量纲正确性的性质来辅助探索和发展关系式。例如，如果有人将自由落体定律写成\
  \ ![c01-math-0583](img/c01-math-0583.png)，显而就能看出这是不可能的，因为左侧的长度不可能等于时间的平方单位。再次注意，量纲分析虽然很有价值且有用，但它不能保证关系的完全正确性，因为数值系数是无量纲的。\n\
  \n由于质量在化学反应中是守恒的，因此为元素建立原子质量标尺是必要的。一个`mole`物质包含 ![c01-math-0591](img/c01-math-0591.png)\
  \ 个该物质原子。这个数字就是 `Avogadro`常数。这无疑是一个巨大的数字。例如，![c01-math-0592](img/c01-math-0592.png)\
  \ 个每个直径约为 14 厘米的球体将填满地球大小的体积。\n\n### 1.7 练习题\n\n1. **1.** 将 5 英里转换为米。（使用 1 米 = 39.37\
