  \n\n\n# 13. 对于一个大型送货车队，每天平均故障次数为 2.4 辆。明天恰好发生四次故障的概率是多少？下周四故障少于两次的概率是多少？\n\n##历史注释\n\
  \n`Jacob Bernoulli (1654–1705)` — 瑞士数学家，概率论的创始人之一。他的兄弟约翰·伯努利（他共同对微积分做出了重要贡献）以及他的叔父丹尼尔·伯努利也是那个时代著名的数学家。雅各布的父母希望他学习哲学和神学，但他对此非常反感。在完成哲学和神学学位的同时，他学习了数学和天文学。\n\
  \n`Siméon Poisson (1781–1840)` — 数学家、物理学家，泊松在统计学和物理学中开发了许多数学应用。他关于各种数学主题编写了 300\
  \ 多份手稿和书籍。\n\n## 第 8 章补充练习\n\n1. **1.** 确定给定概率分布的 `x` 的期望值。注意，缺失的概率需要确定。\n\n| `x`\
