  \n\n\n### 7. 如果一对夫妇计划生三个孩子，那么他们至少有两个女儿的概率是多少？假设性别的出现概率相等。\n\n### 8. 一家工业工厂用两台机器生产产品。较新的机器生产的产品合格率为\
  \ 95%，而较旧的机器生产合格率仅为 85%。如果随机选择一台机器并检查其产出的两个产品，求以下情况的概率：\n\n* **a.** 两个产品都是合格的。\n\
  * **b.** 如果两个产品都不合格，它们来自较旧机器的概率是多少。\n\n### 9. 一家油漆工厂的检查员发现，12% 的油罐装得过多，13% 装得不足，75%\
  \ 装得正确。在已知油罐没有装正确量的情况下，油罐内油不足的概率是多少？\n\n### 10. 两枚硬币中，一枚经过加重，使其反面的概率为 `3/4`。另一枚硬币是均匀的。随机选择一枚硬币并投掷两次。记录每次投掷的结果。求在结果为两次反面的情况下，选到不均匀硬币的概率是多少。\n\
  \n### 11. 随机抽取两张牌且不放回，并记录为面值牌、A 牌或数字牌。求概率：\n\n* **a.** 在已知两张都不是 A 牌的情况下，至少抽到一张面值牌的概率。\n\
  * **b.** 在已知至少有一张数字牌的情况下，两张都是数字牌的概率。\n\n### 12. 在某大学，55% 的学生是低年级学生（大一和大大二），35% 是高年级学生（大三和大四），10%\
  \ 是研究生。留学生占低年级学生的 10%，高年级学生的 25% 以及研究生的 60%。如果随机选择的一名学生是留学生，那么他（或她）是研究生的概率是多少？\n\
  \n### 13. 有两种独立的诊断测试可用于检测一种难以捉发现的疾病。“A 测试”检测出该疾病的概率仅为 `0.6`。对于“B 测试”，相应的概率为 `0.9`。一旦在体内检测到该疾病，就会尝试确定其位置。测试\
  \ `A`（单独）检测出疾病并正确准确定其位置的概率为 `0.8`。测试 `B` 相应的概率为 `0.5`。当两种测试都检测出疾病时，其位置可以被确定确定。\n\
  \n* **a.** 推导出检测出疾病的概率。\n* **b.** 计算只有一种测试检测出疾病的概率。\n* **c.** 推导出一个表达式并计算准确定位置的概率。\n\
  * **d.** 某人被确定患有疾病并确定了位置。求其由测试 `B` 单独检测出来的概率是多少？\n\n### 14. 到达装配线的零件来自四个生产源，分别占总量的\
  \ 20%、30%、25% 和 25%。各源生产中出现缺陷的比例分别为 6%、3%、1% 和 4%。在装配线上发现了一个缺陷零件。求该零件由第一个源生产的概率是多少。\n\
  \n### 15. 新桥的钢电缆从三个来源 `A`、`B` 和 `C` 获取，分别供应所需电缆总数的 30%、25% 和 45%。过去，现场测试发现电缆缺陷率分别为\
  \ 2%、3% 和 5%。如果随机选择一根电缆发现有缺陷，求它来自源 `C` 的概率是多少？\n\n### 16. 从纽约到佛罗里达有三种材料运输模式：陆路、海运或空运。此外，陆运可以是铁路或高速公路。大约一半的材料通过陆路运输，30%\
  \ 通过海运，其余的通过空运。此外，所有陆运中 40% 是通过高速公路，其余通过铁路。货物损坏的百分比分别为：高速公路 10%、铁路 5%、海运 6% 和空运\
  \ 2%。\n\n* **a.** 预计所有货物中损坏货物的占百分比是多少？\n* **b.** 如果收到损坏的货物，求其通过陆路、海运和空运运输的概率各是多少？\n\
  \n### 17. 一种检测缺陷的仪器可靠性为 98%。它还会在 8% 的情况下对合格产品指示有缺陷。经验表明，所有测试物品中 12% 是有的。一个物品刚刚经过了测试，仪器显示其有缺陷。求该物品实际上没有缺陷的概率是多少？\n\
  \n### 18. 在制造过程中，大型机器的缺陷发生率为 2%，较小机器的发生率为 3%。较小机器生产了 30% 的产出。产出混合在一起且无法区分。随机选择一个物品发现是缺陷的。求它由大型机器制造的概率是多少？\n\
  \n### 19. 两台机器分别生产了 30% 和 70% 的硅片产出，缺陷率分别为 2% 和 3%。求随机选择一个芯片并发现有缺陷的芯片，其由第一台机器制造的概率是多少？\n\
  \n### 20. 某制造商的产品在三台机器 `A`、`B` 和 `C` 上制造，并将其产出混合在一个大箱子里。这些台机器分别制造了产出的 25%、45% 和\
  \ 30%。然而，每台机器的产出中有一小部分是缺陷的。假设相应的缺陷率为 3%、2% 和 1%。随机选择一个产出并发现有缺陷，求它由机器 `B` 制造的概率是多少？\n\
  \n\n\n\n数学概率有一段悠久的历史。尽管直到 20 世纪，西方数学家一直对其对其冷落，但它在现代科学中起着至关重要的作用。\n\n概率在机会游戏（如纸牌和骰子）中的早期发展，曾为那些通过开发数学技能来帮助赌徒的人提供了一定的经济支持。19\
  \ 世纪和 20 世纪的数学家倾向于忽略该学科的严肃数学发展，或许可能是因为它的起源并不那么光彩。\n\n“等概率”假设非常适用于赌博应用，因此对其进行推广的动力很小。该假设在\
  \ 19 世纪得到了推广，并导致了“经典概率”的发展，这正是本章和下一章的主题。\n\n`托马斯·贝叶斯 (1702–1761)`。数学家兼神学家贝叶斯被认为是早期使用归纳概率的先驱。他根据事件根据（过去）发生的频率，为未来事件发生的概率建立了数学基础。他的概率发现于\
  \ 1763 年发表在《解决机会学说中某一问题的论文》中。这成为了现代贝叶斯统计学的基础。\n\n`奥古斯塔·德·摩根 (1806–1871)`。尽管他是英国教会的一员，但他出于原则拒绝参加神学考试，这使他失去了在剑桥大学继续进行深造学习所需的硕士学位。尽管如此，在\
  \ 1828 年，21 岁的他成为了新成立的伦敦大学学院的首位数学教授。他担任该教席约 38 年，期间除了在原则问题上偶尔辞职外。\n\n`约翰·维恩 (1834–1923)`。他被授予英国教会牧师神职，后来回到剑桥大学担任道德科学讲师。他对比逻辑很感兴趣，于\
  \ 1889 年写了《`经验逻辑原理`》，后来又写了《`符号逻辑`》。他最广为人知的成就是是对三段论逻辑的几何表示，现在被称为维恩图。有趣的是，他并不是第一个使用这些图的人，那项荣誉属于莱布尼兹。尽管如此，他在这些图的发展方面取得了显著进展。\n\
