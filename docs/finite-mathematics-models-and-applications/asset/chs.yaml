  \ 10 个成年人中，至少 3 人抽烟的机会是多少？\n\n## 8.3 超几何分布\n\n想象一群动物，其中一些带有微型无线电“标签”以研究迁徙习性。从大群体\
  \ ![c8-math-0122](img/c08-math-0122.png) 中随机抽取 `k` 只动物，其中 ![c8-math-0123](img/c08-math-0123.png)\
  \ 带有标签，![c8-math-0124](img/c08-math-0124.png)。随机取出的 `x` 个带有标签的概率是多少？\n\n\n\n\n首先，计算样本具有指定组成部分的方法数。接着，将该数除以从\
  \ `n` 只动物中选取大小为 `k` 的样本的总方法数。由于是不放回抽且顺序不重要，最后这个数字是 ![c8-math-0125](img/c08-math-0125.png)。通过类似的推理，将种群看作由两类动物组成：“已标记”和“未标记”。从\
  \ `r` 只已标记动物中选择 `x` 只的方法数为 ![c8-math-0126](img/c08-math-0126.png)[,]，而从其他剩余的 ![c8-math-0128](img/c08-math-0128.png)\
  \ 只未标记动物中选择 ![c8-math-0127](img/c08-math-0127.png) 只未标记动物的方法数为 ![c8-math-0129](img/c08-math-0129.png)。\n\
  \n使用计数乘法原理（Section 7.4），选取两组动物的方法数是乘积：\n\n![equation](img/c08-math-0130.png)\n\n\
  因此，所需的概率为：\n\n![equation](img/c08-math-0131.png)\n\n这就是**超几何概率分布**，可以方便地用函数符号 ![c8-math-0132](img/c08-math-0132.png)或简单记为\
  \ ![c8-math-0133](img/c08-math-0133.png)，其中随机值 `x` 再次出现在分号之前，并在后面跟着参数 `n`、`r` 和\
  \ `k`。（这种描述性的函数符号与二项分布的用法相似。）\n\n将二项分布和超几何分布混淆是常见现象，因为它们都关注观测样本中“成功”的数量。它们的区别在于获取数据的方式以及/或\
  \ 种群的大小。\n\n对于二项概率分布，数据是从有限种群中有放回地抽取的，或者等价地从无限种群中（不放回地）抽取。例如，在重复投掷中，硬币在每次投掷后都会“恢复”。\n\
  \n另一方面，超几何样本数据是从有限种群中不放回地抽取的。在二项情况下，试验概率 `p` 是常定的且其结果是独立的；但在超几何情况下，实际概率随着抽取的进行而变化。每次抽取，种群的组成都会发生变化。例如，一只“已标记”的动物不会被计数两次，在选择一个动物后，下次抽取的概率可能会发生显著变化（除非种群极大）。\n\
  \n### 工业质量控制\n\n质量控制检查是生产过程中不可或缺的一部分。事实上，工业质量控制人员有活跃的专业协会。超几何分布在估计大生产批次中的缺陷数量方面起着作用。\n\
  \n生产数量 `n` 通常是已知的，而缺陷数量 `r` 是未知的。在判断生产是否符合标准的方法中，假设 `r`（种群中“已标记”的数量）是 `n` 件产品批次中可以容忍的最大缺陷数量。接下来，使用大小为\
  \ `k` 的样本，并统计其中缺陷的数目 `x`。可以使用超几何分布计算 `x` 个或更多缺陷的概率。如果该概率足够小，可能表明 `r` 的真实值没有超过假设值。\n\
  \n### 种群估计\n\n在某些情况下，需要对种群大小 `n` 进行估计。例如，经常需要对某个地区的动物数量进行估计。通常做法是捕获 `r` 只动物，并用某种无害但区分的方式对其进行标记。这些被标记的动物被释放并与更大的种群混合。当判断混合完全完成后，进行第二次捕获\
  \ `k`，并记录被标记动物的数量 `x`。\n\n显然，至少有 ![c8-math-0142](img/c08-math-0142.png) 只动物，即捕获到的数量减去重复部分。然而，![c8-math-0143](img/c08-math-0143.png)\
  \ 的情况通常是不可能的。`n` 远大于 ![c8-math-0144](img/c08-math-0144.png) 也是不太可能的。\n\n在这种情况下，可以将超几何概率分布\
  \ ![c8-math-0145](img/c08-math-0145.png) 视为四变量函数，其中只有三个是知的：`k`、`r` 和 `x`。因此，需要额外信息来评估概率。获取这些信息的方法是假设导致\
  \ `x` 只标记动物的经历是最可能的。即，令 `n` 为在已知 `x`、`k` 和 `r` 取值下使 ![c8-math-0146](img/c08-math-0146.png)\
  \ 最大的值。由于 ![c8-math-0147](img/c08-math-0147.png) 是单峰函数，寻找其最大值的一种方法是注意比率\n\n![equation](img/c08-math-0148.png)\n\
  \n从小于 1 到大于 1 的变化。![equation](img/c08-math-0149.png) 匹配 ![c8-math-0150](img/c08-math-0150.png)。\n\
  \n### 统计还是概率？\n\n前面的讨论为澄清概率与统计之间的区别提供了很好的机会。超几何分布的推导可以看作是一个概率问题。然而，`r` 的估计并不直接处理概率，而是处理统计。通过匹配数据来估计\
  \ `n` 是著名的**极大似然原理**。\n\n### 泛化\n\n超几何分布可以很容易推广到多种类型的种群。我们的讨论仅限于两种类型：“好”和“坏”。具体来说，考虑一个大小为\
