  \ **18.** 在海面上，水压等于约每平方英寸 15 磅的空气压力。在海面以下，每下降 10 英尺，水压增加 4.43 磅每平方英寸。\n    1. **a.**\
  \ 将水压表示为深度的函数。\n    2. **b.** 水压为 80 磅每平方英寸时的深度是多少？\n\n19. **19.** 一百货商店一套男装的价格为\
  \ 84 美元，批发价为 70 美元。同样，一件女装定价 48 美元，批发价 40 美元。如果加价策略是线性的并体现在这些物品的价格中，请建立零售价 `R` 与商店成本\
  \ `C` 之间的关系。\n\n20. **20.** 某产品的需求与其价格呈线性相关。该产品定价为 1.50 美元时售出 40 件。当定价为 6 美元时，仅售出\
  \ 22 件。确定价格 `x` 与销售量 `y` 之间的线性关系。\n\n## 1.3 求解线性方程组\n\n求解两个或多个线性方程组即是找到它们之间的公共点（交点）。目前有以下方法可用：\n\
  \n| (1) 图形法 | (2) 代入法 | (3) 消元法（加减法） |\n\n通过图形法求解二元线性方程组，是在公共坐标轴上画出它们的图像。如果有公共解，则该解位于它们的交点处。\n\
  \n二元线性方程组的图像具有以下属性之一：它们相交于一点、平行或共线。这三种可能性在如图所示。\n\n![内联图像](img/c01uf004.jpg)\n\n\
  一个二元线性方程组是**一致的**、**不一致的**还是**依赖的**，从斜率截距形式 ![c01-math-0212](img/c01-math-0212.png)\
  \ 一而易见。\n\n* 当斜率不同时，系统有唯一解。\n* 当斜率相等且 `y` 截距不同时，直线是平行的。此类系统是不一致的（无解）。\n* 当斜率和 `y`\
  \ 截距相等时，直线是共线的（重合的）。有无数解满足这两个方程。\n\n由于绘图需要极高的精确度，图形法通常是不实用的。\n\n可以使用代数方法**代入法**来求解方程组。在该方法中，从其中一个方程中解出一个变量，并将其代入另一个方程。通过明智选择代入的对象，可以有助于减少计算量。\n\
  \n在前面的示例中，我们从第一个方程解出 `y`。也可以从第二个方程解出 `y` 或从任意一个方程解出 `x` 来开始过程。在求解方程组时，我们找到了唯一解。该方程组是一致且独立的。依赖方程组会导致恒等式。不一致的方程组总是产生一个错误的条件。\n\
  \n代数求解方程组的第三种方法是**加法法**或**消元法**。在这里，寻求通过因子乘以方程，使得在相加时可以消掉其中一个变量。\n\n经济学家知道消费者对商品的需求与其价格有关。根据*需求定律*，需求量随价格的下降而增加。正如消费者的购买意愿与价格有关，制造商的供货意愿也与实现价格有关。根据*供给定律*，供给量随价格的增加而增加。当需求等于供给时，就会发生*市场均衡*。下图说明了供需相等时的交点。\n\
  \n![内联图像](img/c01uf006.jpg)\n\n*总成本*由两个组成部分组成：固定成本和变动成本。*固定成本*（例如月租）独立于“生产水平”。*变动成本*随生产水平而变化。*收入*等于物品单价乘以其需求量。*利润*是收入与总成本之差。同时求解总成本方程和收入方程，它们的交点即为*盈亏平衡点*，此时利润为零。\n\
  \n**边际成本* ![c01-math-0252](img/c01-math-0252.png) 是与额外增加一个单位生产相关的成本。当成本是线性函数时，MC\
  \ 是斜率。当收入是线性函数时，其斜率就是*边际收益* ![c01-math-0253](img/c01-math-0253.png)。也就是说，MR 是额外销售一个单位带来的收入。\n\
