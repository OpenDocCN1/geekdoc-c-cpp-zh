  \ 1175–1250）*** – 被认为是中世纪（跨越 900 年）最有天赋的数学家，斐波那契向欧洲引入了印度阿拉伯数字和十进制。他出生于意大利比萨的商人家庭，那里当时是一个伟大的商业中心，这让他有机会前往亚洲和中东旅行，那里激发了他对实用数学的兴趣。\n\
