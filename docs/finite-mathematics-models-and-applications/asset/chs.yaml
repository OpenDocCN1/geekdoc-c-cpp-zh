  \n## 4.3 线性规划的几何解\n\n商业、经济和制造业中的许多实际问题在资本、劳动力原材料的需求之间存在复杂的关系。这些问题通常是关于利润或收入的最大化，或者是成本或投入资源的最小化。优化过程通常受到管理选择的约束或限制。\n\
  \n如果要最大化（或最小化）的`objective` 是线性的，且约束可以表示为线性不等式，则该问题被称为`线性规划` `(LP)`。线性规划的应用涵盖许多领域，包括商业、军事、农业、运输、行为和社会科学等。随着\
  \ 20 世纪 50 代自动计算在复杂调度和资源分配中的出现，线性规划的实际重要性凸显出来。\n\n本章中的示例只有两个变量，因此可以在二维空间中绘制图形。在第\
  \ 5 章中，我们将介绍解决具有更多变量问题的方法。\n\n**决策变量**，顾名义，是指其值由决策者决定的变量。在示例 4.3.1 中，用于表示生产数量的 `x`\
  \ 和 `y` 就是决策变量。目标函数是需要最大化（或最小化）的量，并用决策变量来表示。在这里，利润函数 ![c4-math-0091](img/c04-math-0091.png)\
  \ 用 `Z` 表示，即目标函数。四个不等式是约束条件；变量限制 ![c4-math-0092](img/c04-math-0092.png) 和 ![c4-math-0093](img/c04-math-0093.png)\
  \ 被称为**非负性条件**。\n\n线性规划（封闭可行解集）的目标函数的最大值或最小值（最优解）始终发生在顶点。这可以通过研究**等线**看出，等线是在相同方向上使函数值从一条曲线增加到另一条曲线的平行线。在函数值增加的方向上，最后与可行区域相交的等线会在顶点处与可行区域。示例\
