  \n\n\n\n\n想象一场有数千名跑步者的马拉松；当他们每一个人越过终点时，跑步时间会被记录下来。将跑步时间形成频率图，在数学上几乎可以肯定，它呈现出的一个钟形曲线！\n\
  \n同样，在一个随机选择的大群体中，可以预见他们的身高、鞋码、手臂长度等的频率图会形成一个钟形曲线。这被称为 `Normal Distribution`（正态分布）或\
  \ `Gaussian distribution`（高斯分布）。\n\n正态分布是概率分布中最重要的一种。它忠实地描述了各种现象——包括自然、技术和社会现象。\n\
  \n为了更好地说明正态分布的许多有趣应用和统计用途，有必要了解这种神奇无处不在的概率分布的形式和数值原理。\n\n该图展示了具有不同均值和标准差的钟形曲线。\n\
  \n![image](img/c10uf007.jpg)\n\n虽然外观不同，但每一个都是正态分布。注意，每一个分布都关于其均值 ![c10-math-0213](img/c10-math-0213.png)\
  \ 处的最高点（众数）对称。\n\n每一个正态分布都由其均值 ![c10-math-0214](img/c10-math-0214.png) 和方差 ![c10-math-0215](img/c10-math-0215.png)\
  \ 唯一确定。对于正态分布，均值和众数重合。方差是衡量钟形曲线“扩散”程度或离散程度的指标，如图所示。\n\n接下来是一个正态分布的数学表达式，有些复杂。没有必要背诵！\n\
  \n正态曲线下的面积对应于概率。例如，随机变量 `x` 取值于 `a` 和 `b` 之间的概率 ![c10-math-0221](img/c10-math-0221.png)\
  \ 是图中的阴影区域。\n\n![image](img/c10uf008.jpg)\n\n### 标准正态分布\n\n对于 ![c10-math-0222](img/c10-math-0222.png)\
  \ 和 ![c10-math-0223](img/c10-math-0223.png) 的正态分布被称为 `Standard Normal Distribution`（标准正态分布）。它是针对随机变量\
  \ `Z` 的特殊正态分布。\n\n![image](img/c10uf009.jpg)\n\n标准正态分布对应于正态曲线下方面积的值已经制表。幸运的是，不需要计算曲线下的面积来获得概率；它们构成了\
  \ `Standard Normal Table`（标准正态表）。注意表格值的排列方式——`z` 的后两位小数水平设置。例如，`z` 位于 0 和 1.23 之间的概率是\
  \ 0.3907。\n\n表格的几个重要特征需要解释。首先，由于每个概率分布的面积和为 1，因此 ![c10-math-0226](img/c10-math-0226.png)\
  \ 的面积是 ![c10-math-0227](img/c10-math-0227.png)。同样，![c10-math-0228](img/c10-math-0228.png)\
  \ 的面积也是 ![c10-math-0229](img/c10-math-0229.png)。\n\n其次，对于 `z` 的负值，利用正态分布的对称性。例如，`z`\
  \ 在于 0.00 和 ![c10-math-0230](img/c10-math-0230.png) 之间的概率是 0.3907；与 `z` 在于 0.00\
  \ 和 1.23 之间的概率完全相同。\n\n第三，虽然理论上 `z` 可以取极大值，但表格显示 ![c10-math-0231](img/c10-math-0231.png)\
  \ 限定的面积为 0.4990 或接近 ![c10-math-0232](img/c10-math-0232.png)！因此，事实上，较大的 `z` 值虽然理论上可能，但是不可能的。这些特征在随后的示例中给出。方框总结了这些属性。\n\
