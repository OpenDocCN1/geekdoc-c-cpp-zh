  \n### 15\n**15.** 如果三名女性和六名男性担任美国最高法院法官，那么随机选择四位法官中包含至少一名女性的概率是多少？\n\n## 8.4 泊松分布\n\
  \n`Poisson process`（泊松过程）是一种重要的随机过程，它是更复杂随机过程的基础。几种概率分布自然地产生于该过程，包括`Poisson distribution`（泊松分布）（历史注释）。\n\
  \n`Poisson distribution` 可能是对离散随机事件最有用的描述符。示例包括：每日工业事故的随机数量、生产批次中的缺陷、每天通过桥梁或通过标记的汽车数量、每页打印错误、每小时接到的手机电话、一段受照射\
  \ DNA 片段中的突变、安全带使用情况的研究、血计数等。\n\n为了说明泊松随机变量，考虑在时间轴上随机发生的事件（见下方的查看视图）。例如，\n\n![image](img/c08uf004.jpg)\n\
  \n考虑一个（很小的）时间间隔 ![c8-math-0160](img/c08-math-0160.png)。在 ![c8-math-0161](img/c08-math-0161.png)\
  \ 中随机发生的概率与其持续时间成比，而不是与 ![c8-math-0162](img/c08-math-0162.png) 或 ![c8-math-0163](img/c08-math-0163.png)。也就是说，在间隔\
  \ ![c8-math-0164](img/c08-math-0164.png) 内发生的概率在时间轴上的任何地方都是相同的。此外，假设在任意小间隔内发生两次或更多事件的概率是可以忽略不计的。最后，任何间隔内的发生次数与任何其他不重叠的间隔无关。\n\
  \n具有上述特征的现象由泊松分布描述如下：\n\n我们再次使用了函数符号 ![c8-math-0168](img/c08-math-0168.png)，或者简单地使用\
  \ ![c8-math-0169](img/c08-math-0169.png)，其中`x` 是随机变量的值。\n\n泊松分布中的单一参数 ![c8-math-0170](img/c08-math-0170.png)\
  \ 是特定区域、体积、时间单位等范围内随机发生次数（“命中”）的平均值。\n\n理论上，泊松随机变量取整数值 `0`、`1`、`2`……。当 ![c8-math-0178](img/c08-math-0178.png)\
  \ 较小时，泊松分布右偏，并随着 ![c8-math-0179](img/c08-math-0179.png) 增大而趋于对称。当试验次数很大且试验概率较小时，泊松模型提供了对二项分布的合理近似。\n\
  \n对于实际案例，通常很难验证泊松随机变量的特征。与所有概率模型一样，泊松模型的适用性测试取决于它是否提供了对现实的合理近似——即经验数据是否支持它。\n\n\
