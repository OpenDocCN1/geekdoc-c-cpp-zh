  \n注意，置信水平越高，置信区间越宽。从某种意义上说，选定的置信水平越高，为了覆盖包含均值 `![c10-math-0575](img/c10-math-0575.png)`\
  \ 的风险，所需的区间就越宽。\n\n此外，请注意置信区间的宽度。\n\n## 10.5 习题\n\n另有说明，否则假设正态分布。\n\n1. **1.** 在许多应用中，人们对变量处于均值正负一个标准差范围内的概率感兴趣。计算\n\
