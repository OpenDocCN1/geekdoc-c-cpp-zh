  \n10. 一个委员会有五个成员。有多少种方式选出三个成员担任秘书、财务和主席？\n\n11. 一幅地图要把特拉华州、马里兰州、新泽西州、弗吉尼亚州和宾夕法尼亚州涂成不同的颜色。如果有七种颜色可选，地图有多少种上色方式？\n\
