  \n## 1.4 数字 $\\pi$ 和 $e$\n\n用一句老话来说：“数字有数字，也有不同的数字！”你对整数、分数和小数并不陌生，它们共同构成了**有理数**。不是完全平方数、完全立方数等的数的平方根、立方根等被称为**无理数**和**复数**。它们作为线性、二次及其他被称为**多项式**的方程的根而出现。\n\
  \n然而，自然界中还存在其他不是多项式方程之根的数字——它们被称为**超越数**。每一个超越数都是无理数。在这些令人惊叹的超越数中，最著名的是![c01-math-0284](img/c01-math-0284.png)\
  \ 和 $e$。两者在文中都会出现。虽然我们在这里简要介绍它们，但通过互联网搜索可以获得关于它们的许多迷人信息。\n\n### 数字 $\\pi$\n\n希腊字母“pi”，写作![c01-math-0285](img/c01-math-0285.png)，你可能已经很熟悉了。半径为\
  \ $r$、直径为 $d$ 的圆的周长 $C$ 是![c01-math-0286](img/c01-math-0286.png) 或 ![c01-math-0287](img/c01-math-0287.png)。因此，![c01-math-0288](img/c01-math-0288.png)\
  \ 或 $C/d$。\n\n古代人试图仅用圆规和直尺构造出一个与圆面积相同的正方形。这被称为“化圆”，它是几何学中最令人困惑的挑战之一。世纪的尝试得出，任何圆的面积都不可能完全等于正方形的面积。对于半径为\
  \ $r$ 的圆，面积![c01-math-0289](img/c01-math-0289.png)，等于边长为 $s$ 的正方形面积需要数字 $r$ 和 $s$\
  \ 满足![c01-math-0290](img/c01-math-0290.png) 或 ![c01-math-0291](img/c01-math-0291.png)。我们现在知道![c01-math-0292](img/c01-math-0292.png)永远无法表示为两个数字之比。\n\
  \n符号![c01-math-0293](img/c01-math-0293.png)首次用于 1706 年，在被**莱昂哈德·欧拉**（Leonhard Euler）于\
  \ 1737 年采用后流行起来（历史注释）。\n\n据信巴比伦人在公元 2000 年第一个估算出![c01-math-0294](img/c01-math-0294.png)。早期荷兰物理学家**克里斯斯蒂安·惠格斯**（Christiaan\
  \ Huygens）试图在圆内仔细构造边数增加的内接多边形，希望通过对半径和多边形面积的精确测量来估算![c01-math-0295](img/c01-math-0295.png)。\n\
  \n报纸定期报道![c01-math-0296](img/c01-math-0296.png)值的扩展。用增加的小数位数来表示![c01-math-0297](img/c01-math-0297.png)几个世纪以来一直挑战着数学家，并持续至今。1999\
  \ 年《吉尼斯世界纪录》提到，东京的一个研究小组计算了![c01-math-0298](img/c01-math-0298.png)约 2060 亿位。到 2002\
  \ 年，π的记录达到了 1.24 万位。一台每秒能进行超过 2 万次计算的海立超级计算机花费了 400 小时才计算出这些数字。这些成就不仅在数学上值得关注，而且在密码学、随机数以及互联网传输安全方面也有意义。\n\
  \nπ几乎出现在科学的各个领域，包括 DNA 双螺旋、月球和太阳表面、彩虹、扩散的池塘涟漪、爱因斯坦引力场方程、正态分布、素数分布、波、导航、光谱等。在几何学中，如你所知，![c01-math-0302](img/c01-math-0302.png)出现在圆、球、锥、圆柱或圆多边形的周长、面积和体积中。\n\
  \n### 数字 $e$\n\n数字 $e$（由莱昂哈德·欧拉命名）另一个源自特殊极限的奇特数字。考虑数量\n\n![equation](img/c01-math-0303.png)\n\
  \n显然，当![c01-math-0304](img/c01-math-0304.png)时，它的值为 2。当![c01-math-0305](img/c01-math-0305.png)时，该值为\
  \ 2.25。它的值随着$n$的增加而增大。是否存在极限？还是说它会随着$n$变得越来越大而无限增长，趋于无穷？实际上，它的值为![c01-math-0306](img/c01-math-0306.png)，虽然它随着$n$的增加而继续增大，但它是有界的。\n\
  \n$e$的一个性质是**自然对数**的底。它也出现在概率论、统计学、增长或衰减以及一个数量的增长速率与其数值成正比的情况下。\n\n### 1.4 练习题\n\
