  \n一个基本假设是，体内药物浓度的下降速率与瞬时浓度成正比。\n\n设 `C(t)` 为患者在时间 `t`（天）的体药物浓度，![c11-math-0260](img/c11-math-0260.png)。随时间下降的浓度可以用一个差分方程表示，其中\
  \ `k` 为比例常数，被称为`消除常数`。\n\n![equation](img/c11-math-0262.png)\n\n其中比例因子 `k` 称为 `消除常数`。\n\
  \n该差分方程的解可以被实为：\n\n![equation](img/c11-math-0263.png)\n\n其中 ![c11-math-0264](img/c11-math-0264.png)\
  \ 是 ![c11-math-0265](img/c11-math-0265.png) 初始剂量。\n\n虽然初始剂量随时间推移而衰减，但在下次给药时，通常会有可测量的（低于治疗水平的）残留。\n\
  \n虽然在下次给药时部分药物仍留在血液中，但正如前面提到的，其量可能没有很大的治疗价值。然而，从长期来看，可能会产生不理想的高浓度。\n\n在下次给药时，剩余的药物浓度\
  \ ![c11-math-0268](img/c11-math-0268.png) 为：\n\n![equation](img/c11-math-0269.png)\n\
  \n因此，在下次给药后，第二天开始时的浓度 ![c11-math-0270](img/c11-math-0270.png) 为：\n\n![equation](img/c11-math-0271.png)\n\
  \n在第二天结束、第三次给药之前，第二次给药后的剩余量 ![c11-math-0272](img/c11-math-0272.png) 为：\n\n![equation](img/c11-math-0273.png)\n\
  \n第三次给药后后，药物浓度为 ![c11-math-0274](img/c11-math-0274.png)。当第四次给药时，剩余量为：\n\n![equation](img/c11-math-0275.png)\n\
  \n推广之，`n` 次给药后的累积剩余量为：\n\n![equation](img/c11-math-0276.png)\n\n这是一个具有 ![c11-math-0277](img/c11-math-0277.png)\
  \ 的等比数列，其和为：\n\n![equation](img/c11-math-0278.png)\n\n长期极限也很有意义，因为 ![c11-math-0279](img/c11-math-0279.png)\
  \ 是：\n\n![equation](img/c11-math-0280.png)\n\n因此，长期来看，当下次给药时，浓度为：\n\n![equation](img/c11-math-0281.png)\n\
  \n这是即将给药的药物量恰好取代前一天消除的药物量。这是一个“稳态”。在这里，![c11-math-0282](img/c11-math-0282.png) 是\
  \ `维持剂量`，而 ![c11-math-0283](img/c11-math-0283.png) 是 `治疗剂量`。\n\n## 练习 11.3\n\n1.\
