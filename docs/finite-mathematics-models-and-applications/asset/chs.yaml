  \ 5.5.5 另一种方法\n\n## 6. 历史说明\n#### 线性规划历史\n线性规划图解法（第 4 章）的局限性促使人们寻找替代方案。其中最为人知的是名为`单纯形法`\
  \ 的迭代方案，由`George Dantzig` 开发。它在 20 世纪 40 年代后期的发展以及自动化计算的进步使得`线性规划 (LP)` 在日常运营和政府规划中被广泛使用。学习在许多变量和约束的程序中使用`单纯形法`\
  \ 的优势在于可以在实际背景中例行公地解决问题。\n\n## 5.1 标准最大化问题 (SMP)\n考虑以下线性规划：\n![equation](img/c05-math-0001.png)\n\
  `c05-math-0002` 是目标（或成本）系数，`c05-math-0003` 是约束系数，而 `c05-math-0004` 是资源常数。\n当 `c05-math-0005`\
  \ 为非负时，该线性规划为一个`标准最大化问题 (SMP)`。\n\n考虑这个标准最大化问题：\n![equation](img/c05-math-0015.png)\n\
  显然，这个线性规划满足四个要求：\n* 它是一个最大化问题。\n* 所有约束都是小于或等于类型。\n* `RHS` 常数是非负的。\n* 所有变量都是非负的。\n\
  \n如果变量的值是非负且满足所有约束，则该 `SMP` 的解是可行的。这种这样的 `c05-math-0016` 的解被称为`可行向量`。可行向量是一个可行解。\n\
  \n“小于或等于”不等式约束通过添加一个新变量变为等式约束，该变量被恰地称为`松弛变量`。它解释了不等式左侧和右侧（`RHS`）之间的差异。例如，`c05-math-0029`\
  \ 可以通过添加非负松弛变量 `c05-math-0031` 写为等式 `c05-math-0030`。每个小于不等式都需要其唯一的松弛变量。在引入三个必要的松弛变量后，目标函数和约束条件为：\n\
  ![equation](img/c05-math-0032.png)\n习惯上将目标函数中的变量项放在左侧。这种形式被称为`标准形式`下的 `SMP`。\n\n\
