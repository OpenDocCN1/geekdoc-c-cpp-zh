  \ 第二类元素，从中抽取大小为 `k` 的样本。样本包含 ![c8-math-0154](img/c08-math-0154.png) 第一类元素的概率为\n\n\
  ![equation](img/c08-math-0155.png)\n\n其中 ![c8-math-0156](img/c08-math-0156.png)\
  \ 是第一类，![c8-math-0157](img/c08-math-0157.png) 是第二类。超几何随机变量的范围限于样本大小或种群中的成功数量，取较小者。\n\
  \n### 8.3 练习题\n\n1. **1.** 袋里有六个红球和四个黑球。随机同时取出三个球。求：\n   - a) 全是红球的概率？\n   - b)\
