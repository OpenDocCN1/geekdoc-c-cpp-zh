  \n## 5. 历史笔记 (#c04.xhtml_c04_level1_5)\n\n### 引言\n\n线性规划是寻求线性函数（目标函数）的最大值（或最小值）并受线性约束限制的数学方法。在没有约束的情况下，问题非常简单！只需为每个变量独立地分配值即可。然而，约束的存在使得问题变得挑战性得多，因为不能给变量分配任意值。事实上，直到\
  \ 20 世纪 40 年代后期，一种可靠的迭代数值求解方案才开发出来。关于这个迷人的主题及其对人们日常生活的影响，有很多可以写的。它是关于稀缺资源的数学，而毕竟，这是每个人的日常挑战！线性规划在工业和政府的运营与规划中应用广泛。\n\
  \n本章通过几何法求解（小型）双变量线性规划（LP）。虽然该方法对于较大的问题并不实用，但它确实提供了宝贵的见解。\n\n## 4.1 线性不等式的画图\n\n\
