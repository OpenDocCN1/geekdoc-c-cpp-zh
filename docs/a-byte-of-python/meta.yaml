  md: '# Python en:Modules


    When Python executes the import sys statement, it looks for the sys module. In
    this case, it is one of the built-in modules, and hence Python knows where to
    find it.


    If it was not a compiled module i.e a module written in Python, then the Python
    interpreter will search for it in the directories listed in its sys.path variable.
    If the module is found, then the statements in the body of that module are run
    and then the module is made available for you to use. Note that the initialization
    is done only the first time that you import a module.


    The argv variable in the sys module is accessed using the dotted notation i.e.
    sys.argv. It clearly indicates that this name does not clash with any argv variable
    used in your program. Another advantage of this approach is that


    The sys.argv variable is a list of strings (lists explained in detail in a later
    chapter. Specifically, the sys.argv contains the list of command line arguments
    i.e the arguments passed to your program using the command line.


    If you are using an IDE to write and run these programs, look for a way to specify
    command line arguments to the menu.


    Here, when we execute python sys.py we are arguments, we run the module using_sys.py
    with the python command and the other things that follow arguments passed to the
    program. Python stores the command line arguments in the sys.argv variable for
    us.


    Remember, the name of the script running is the first argument in the sys.argv
    list. In this case we will have ''using.py'' as sys.argv[0], ''we'' as sys.argv[1],
    ''are'' as sys.argv[2] and ''arguments'' as sys.argv[3]. Notice Python starts
    counting from 0 and not 1.


    The sys.path contains the list of directory names where modules are imported from.
    Observe that the first string in sys.path is empty this string indicates that
    the current directory is also part of the sys.path which is same as the PYTHONPATH
    environment variable. This means that you can directly import modules located
    in the current directory. Otherwise, you will have to place your module in one
    of the directories listed in sys.path.


    Note that the current directory is the directory from which the program is launched.
    Run import os; print (os.getcwd()) to find out the current directory of your program.


    # Byte-compiled .py files


    Importing a module is a relatively costly affair, so Python does some tricks to
    make it faster. One way is to create byte-compiled files with the extension .pyc
    which is an intermediate format that Python transforms the program into (remember
    the introduction section on how Python works?). This .pyc file is useful when
    you import the module next time from a different program - it will be much faster
    since portion of the processing required in importing a module is already done.
    Also, these byte-compiled files are platform-independent.


    # Note


    .pyc files are usually created in the same directory as the corresponding .py
    files. If Python does not have permission to write files to that directory, then
    the .pyc files will not be created.'
