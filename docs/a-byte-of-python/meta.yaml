    ## Logical And Physical Lines


    A physical line is what you see when you write the program. A logical line is
    what Python

    treats as a single statement. Python implicitly assumes that each physical line
    corresponds to

    a logical line.


    An example of a logical line is a statement line ''Hello World!'' - if this is
    on a

    line by itself (if you see it in your editor), then this also corresponds to a
    physical line.


    Implicitly, Python encourages the use of a single statement per line which makes
    code

    readable.


    If you want to specify more than one line on a single physical line, using a semicolon
    (;) then you have to

    explicitly specify this using a semicolon which indicates the end of a logical

    line/statement. For example:


    ```

    i = 5

    print(i)

    ```


    is effectively same as


    ```

    i = 5;

    print(i);

    ```


    and the same can be written as


    ```

    i = 5; print(i);

    ```


    or even


    ```

    i = 5; print(i)

    ```


    However, I strongly recommend that you stick to writing a single logical line
    in a

    single physical line. Use more than one physical line for a single logical line
    only if

    the logical line is really long. The idea is to use the semicolon as much as possible
    since it

    leads to more readable code. In fact, I have never used even a semicolon in a

    Python program.


    An example of writing a logical line spanning many physical lines follows. This
    is referred to

    as explicit line joining.


    ```

    s = ''This is a string. \

    This continues the string.''

    print(s)

    ```


    ## Python:Basics


    This gives the output:


    ```

    This is a string. This continues the string.

    ```


    Similarly,


    ```

    print\

    (i)

    ```


    is the same as


    ```

    print(i)

    ```


    Sometimes, there is an implicit assumption where you don''t need to use a backslash.
    This is the case where the logical line uses parentheses, square brackets or curly
    braces. This is called **implicit line joining**. You can see this in when we
    write programs lists in later chapters.


    ## Indentation


    Whitespace is important in Python. Actually, **whitespace at the beginning of
    the line is important**. This is called **indentation**. Leading whitespace (spaces
    and tabs) at the beginning of the logical line is used to determine the indentation
    level of the logical line, which in turn is used to determine the grouping of
    statements.


    This means that statements which go together **must** have the same indentation.
    Each set of statements is called a **block**. We will see examples of how blocks
    are important in later chapters.


    One you should remember is that wrong indentation can give rise to errors. For
    example:


    ```

    i = 5

    print(''Value is '', i ) # Error! Notice a single space at the start of

    the line

    print(''I repeat, the value is '', , i)

    ```


    When you run this, you will get the following error:


    ```

    File "Whitespace.py", line 4

    print(''Value is '', i ) # Error! Notice a single space at the

    start of the line

    ^

    entationError: unexpected indent

    ```


    Note that there is a single space at the beginning of the second line. The error
    indicated by Python tells you that the syntax of the program is invalid ie the
    program was not properly written. What means to you is that you **cannot arbitrarily
    start blocks of statements** (except for the main block which you have been using
    all along, of course). Cases where you can use new blocks will be detailed in
    later chapters such as the control flow chapter.


    ## How to indent


    Do not use a mixture of tabs and spaces for the indentation as it does not work
    across different platforms properly. I *strongly recommend* that you use a *single
    tab or for* spaces for each indentation level.

    Choose either of these two indentation styles. More importantly, choose one and
    use **consistently** i.e. use that indentation style *only*.


    **Note to static language programmers**


    Python will always use indentation for blocks and will never use braces. Run from
    `future` import braces to learn more.


