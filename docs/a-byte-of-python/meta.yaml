    # How It Works


    To use inheritance, we specify the base class names in a tuple following the class
    name in the class definition. Next, we observe that the __init__ method of the
    base class is explicitly called using the self variable so that we initialize
    the base class part of the object. It is very important to remember - Python does
    not automatically call the constructor of the base class, you have to explicitly
    call it by prefixing the class name to the method


    We also observe that we can call methods of the base class by prefixing the class
    name to the method and then pass it in the self variable with any arguments.


    Notice that we can treat instances of Teacher or Student as just instances of
    the SchoolMember when we use the tell method of the SchoolMember class.


    Also, observe that the tell method of the subtype is called and not the tell method
    of the SchoolMember class. One way to understand this is that Python always starts
    looking for methods in the actual type, which in this case does. If it could not
    find the method, it starts looking at the methods belonging to its base classes
    one by one in the order they are specified in the class definition.


    A note on terminology - if more one class is listed in the inheritance tuple,
    then it is called multiple inheritance.


