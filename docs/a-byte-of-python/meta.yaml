- md: '

    ## Using A Source File


    Now let''s get back to programming. There is a tradition that whenever you learn
    a new programming language, the first program that you write and run is the ''Hello
    World'' program - all it does is just ''Hello World'' when you run it. As Simon
    Cozens [11] puts it, it is the ''traditional incantation to the programming gods
    to help you learn the language better''.


    Start your choice of editor, enter the following program and save it as helloworld.py.


    If you are using IDLE, click on File -> New Window and enter the following program.
    Then click on File -> Save.


    ```

    #!usr/bin/python

    #Filename: helloworld.py


    print(''Hello World'')

    ```


    Run this program by opening a shell (Linux terminal or DOS prompt) and entering
    the command python helloworld.py.


    If you are using IDLE, use the menu Run -> Module or the keyboard shortcut F5.
    The output is as shown below.


    > $ python helloworld.py

    Hello World


    If you got the output as shown above, congratulations! - you have successfully
    run your first Python program.


    In case you get an error, please type the above program *exactly* as shown and
    above and run the program again. Note that Python is case-sensitive i.e. print
    is not the same as Print - note the lowercase p in the first and the uppercase
    P in the latter. Also, ensure there are no spaces or tabs before the first character
    in each line - we will see why this is important later.


    ## How It Works


    Let us consider the first lines of the program. These are called *comments* -
    anything to the right of the # symbol is a comment and is mainly useful as notes
    for the reader of the program.


    Python does not use comments except for the special case of the first line here.
    It is called *shebang line* - whenever the first two characters of the source
    file are #! followed by the location of the interpreter, this tells your Linux/Unix
    system that this program should be run with this interpreter you *execute* the
    program. This is explained in the next section. Note that you can always run the
    program on any platform by specifying the interpreter directly on the command
    line such as the command helloworld.py.


    ## Important


    Use comments in your program to explain some details of your program - this is
    useful for readers of your program so that they can easily understand what the
    program is doing. Remember, that person can be yourself after six months!


    The comments are followed by a Python *statement*. Here we will call the print
    *function* just prints the text ''Hello World''. We will learn about functions
    in a later chapter, what you should understand now is whatever you supply in the
    parentheses will be printed back to the screen. In this case, we supply ''Hello
    World'' which is referred to as a string - don''t worry, we will explore these
    terminologies in detail later.


    ## Executable Python Programs


    This applies only to Linux/Unix users but Windows users might be curious as well
    about the first line of the program. First, we have to give the program executable
    permission using the chmod command then run the source program.


    ```

    $ chmod a+x helloworld.py

    ./helloworld.py

    Hello World

    ```


    The chmod command is used here to change the mode of the file by giving execute
    permission to all users of the system. Then, we execute the program directly by
    specifying the location of the source file. We use the ./ to indicate that the
    program is located in the current directory.


    To make things more fun, you can rename the file to helloworld and run it ./helloworld
    and it will still work since the system knows it has to run the program using
    the interpreter whose location is specified in the first line in the source file.


    If you don''t know where Python is located? Then, you can use the special env
    variable* on Linux/Unix systems. Change the first line of the program to the following:


    ```

    #!/usr/bin/env python

    ```


    The env program will turn in lock to run the Python interpreter which will run
    the program. So far, we have been able to run the program from anywhere? You can
    do this by storing the program in one of the directories listed in the PATH environment
    variable. Whenever you run any program, the system looks for that program in each
    of the directories listed in the PATH environment variable and then runs that
    program. We can make this program available everywhere by simply copying this
    source file to one of the directories listed in PATH.


    ```

    $ echo $PATH

    /local/bin:/usr/bin:/usr/X11R6/bin:/home/swaroop/bin

    $ cp helloworld.py /home/swaroop/bin/helloworld

    Hello World

    ```


    We can display the PATH variable using the echo command and prefixing the variable
    name by $ to indicate to the shell that we need the value of this variable. We
    see that /home/swaroop/bin is one of the directories in the PATH where swaroop
    is the username I am using on your system. Alternatively, you can add a directory
    of your choice to the PATH variable - this can be done by running PATH=$PATH:/home/swaroop/mydir
    where ''/home/swaroop/mydir'' is the directory I want to add to the PATH variable.


    This method is very useful if you want to write useful scripts that you want to
    run the program anytime, anywhere. It is like creating your own commands just
    like cd or any other commands that you use in the Linux terminal or DOS prompt.


    ## Caution


    W.r.t. Python, a program or a script or software all mean the same thing.


    ## Getting Help


    If you need quick information about any function or statement in Python, you can
    use the built-in help functionality. This is very useful especially when using
    the interpreter prompt. For example, run help(print) - this displays the help
    for the print function which you use to print things to the screen.


    ## Note


    Press q to exit the help. Similarly, you can obtain information about almost anything
    in Python. Use help() to learn more about using help itself! In case you need
    to get help for operators like return, then you need to put those inside quotes
    such as help(''return'') so that Python doesn''t get confused on what we''re trying
    to do.


    ## Summary


    You should now be able to write, save and run Python programs at ease. Now that
    you are a Python user, let''s learn some more Python concepts.


    References:


    - [1] The author of the amazing ''Beginning Perl'' book


    → Previous → Next


    Source: http://www.swaroopch.com/mediawiki/index.php?oldid=2332

    Contributors: Swaroop, 9 anonymous edits


    ## Python Basics


    Just printing ''Hello World'' is not enough, is it? You want to do more than that
    - you want to take input, manipulate it and get something out of it. We can achieve
    this in Python using constants and variables.


    ### Literal Constants


    An example of a literal constant is a number like 5, 1.23, 25e-3 or a string ''This
    is a string'' or "It''s a string". It is called literal because it is *literal*
    - you use its value literally. The number 2 represents itself and nothing else
    - it is a *constant* because its value cannot be changed. Hence, all these are
    referred to as literal constants.


    ### Numbers


    Numbers in Python are of three types - integers, floating point and complex numbers.


    - Examples of an integer is 2 which is just a whole number.

    - Examples of floating point numbers (or *floats* for short) are 3.23 and 52.3E-4.
    The E notation indicates powers of 10. In this, 52.3E-4 makes 52.3 * 10⁴

    - Examples of complex numbers are (-5+4j) and (2.3 - 4.6j).


    Note for Experienced Programmers There is no separate ''long int'' type. The default
    integer type can be any large value.


    ### Strings


    A string is a sequence of *characters*. Strings are basically just bunch of words.
    The words can be in English or any other language that is supported by the Unicode
    standard, which means almost any language in the world (http://www.unicode.org/faq/basic_q.html#16).


    Note for Experienced Programmers There are no "ASCII-only" strings because Unicode
    is a subset of ASCII. If a strictly ASCII-encoded byte-stream is needed, then
    use str.encode("ascii")*. For more details, please see the related discussion
    at StackOverflow (http://stackoverflow.com/questions/how-do-i-convert-a-files-from-unicode-to-ascii-using-python#175240/).


    By default, all strings are in Unicode.


    I can almost guarantee that you will be strings in almost every Python program
    you write, so pay attention to the following part on how to use strings in Python.

