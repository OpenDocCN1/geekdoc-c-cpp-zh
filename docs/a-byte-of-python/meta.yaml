    ## 使用源文件


    现在让我们回到编程中。有一个传统：每当你学习一种新的编程语言时，你编写并运行的第一个程序都是“Hello World”程序——它在运行时唯一做的事情就是输出“Hello
    World”。正如 Simon Cozens [11] 所说，它是“向编程之神祈的传统咒语，帮助你更好地学习这种语言”。


    启动你选择的编辑器，输入以下程序并将其保存为 helloworld.py。


    如果你正在使用 IDLE，点击 File（文件） -> New Window（新建窗口）并输入以下程序。然后点击 File -> Save（保存）。


    ```

    #!usr/bin/python

    #Filename: helloworld.py


    print(''Hello World'')

    ```


    通过打开 shell（Linux 终端或 DOS 提示符）并输入命令 `python helloworld.py` 来运行此程序。


    如果你正在使用 IDLE，请使用菜单 Run -> Module 或键盘快捷键 F5。输出如所示。


    > $ python helloworld.py

    Hello World


    如果你得到了如所示的输出，恭喜你！你已经成功运行了你的第一个 Python 程序。


    如果遇到错误，请按照上述所示*完全*准确地输入程序并再次运行。请注意 Python 是区分大小写的，即 `print` 和 `Print` 是不同的——注意第一个是小写
    `p`，第二个是大写 `P`。此外，确保每行的第一个字符之前没有空格或制表符——我们稍后会看到为什么很重要。


    ## 工作原理


    让我们考虑程序的开头几行。这些被称为*注释*（comments）——# 符号右侧的所有内容都是注释，主要用作程序读者的笔记。


    除了这里第一行的特殊情况外，Python 并不使用注释。这一行被称为 *shebang 行*（shebang line）——当源文件的前两个字符是 `#!`
    后紧跟解释器的位置时，这告诉你的 Linux/Unix 系统该程序应该用你*执行*程序时指定的解释器来运行。这将在下一节中解释。请注意，你始终可以通过在命令行直接指定解释器（例如命令
    `helloworld.py`）来在任何平台上运行该程序。


    ## 重要性


    在你的程序中使用注释来解释某些细节——这对于你程序的读者很有用，让他们能够轻松理解程序在做什么。记住，六个月后的那个人可能是你自己！


    注释之后是一个一个 Python *语句*（statement）。在这里我们将 `print` 称为*函数*（function），它只是打印文本 ''Hello
    World''。我们将在稍后的章节中学习函数，你现在应该理解的是在括号中提供的任何内容都将打印到屏幕上。在这种情况下，我们提供了 ''Hello World''，它被称为字符串（string）——担心，我们稍后会详细探讨这些术语。


    ## 可执行的 Python 程序


    这仅适用于 Linux/Unix 用户，但 Windows 用户可能对程序的第一行也好奇。首先，我们必须使用 `chmod` 命令赋予程序可执行权限，然后运行源程序。


    ```

    $ chmod a+x helloworld.py

    ./helloworld.py

    Hello World

    ```


    `chmod` 命令在这里用于通过向系统所有用户授予执行权限来更改文件模式。然后，我们通过指定源文件的位置直接执行程序。我们使用 `./` 来表示程序位于当前目录。


    为了增加趣味性，你可以将文件重命名为 `helloworld` 并运行 `./helloworld`，它仍然可以工作，因为系统知道必须使用源文件第一行中指定的解释器来运行该程序。


    如果你不知道 Python 位于何处？那么你可以使用 Linux/Unix 系统上的特殊 *env 变量*。将程序的第一行更改为如下：


    ```

    #!/usr/bin/env python

    ```


    `env` 程序将紧接着运行 Python 解释器，由其运行程序。到目前为止，我们已经从任何地方运行程序了？你可以通过将程序存储在 PATH 环境变量列出的目录之一来实现。每当你运行任何程序时，系统都会在
    PATH 环境变量列出的每个目录中查找该程序然后运行它。我们可以通过简单地将此源文件复制到 PATH 列出的目录之一来让此程序随处可用。


    ```

    $ echo $PATH

    /local/bin:/usr/bin:/usr/X11R6/bin:/home/swaroop/bin

    $ cp helloworld.py /home/swaroop/bin/helloworld

    Hello World

    ```


    我们可以使用 `echo` 命令显示 PATH 变量，并在变量名前前加 `$` 以告诉 shell 需要该变量的值。我们看到 `/home/swaroop/bin`
    是 PATH 中的目录之一，其中 `swaroop` 是我在你的系统中使用的用户名。或者，你可以将你选择的目录添加到 PATH 变量中——这可以通过运行 `PATH=$PATH:/home/swaroop/mydir`
    来，其中 `''/home/swaroop/mydir''` 是我想添加到 PATH 变量的目录。


    如果你想编写实用的脚本以便随时随地运行程序，这种方法非常有用。这就像创建你自己的命令，就像 `cd` 或你在 Linux 终端或 DOS 提示符使用的任何其他命令一样。


    ## 注意事项


    对于 Python，程序、脚本或软件的意思相同。


    ## 获取帮助


    如果你需要关于 Python 中任何函数或语句的快速信息，可以使用内置的帮助功能。这在在使用解释器提示符时特别有用。例如，运行 `help(print)`
    ——这会显示 `print` 函数的帮助，你用它将内容打印到屏幕上。


    ## Note


    按 `q` 退出帮助。同样，你可以获取关于 Python 中几乎任何内容的信息。使用 `help()` 来学习更多关于使用 help 本身的方法！如果你需要获取
    `return` 等运算符的帮助，你需要将它们放在引号中，例如 `help(''return'')`，这样 Python 就不会混淆我们试图做什么。


    ## 总结


    你现在应该能够轻松地编写、保存和运行 Python 程序了。既然你已经是一个 Python 用户，让我们学习更多 Python 概念吧。


    参考文献：


    - [1] 奇书《Beginning Perl》的作者


    → 上一页 → 下一页


    来源：http://www.swaroopch.com/mediawiki/index.php?oldid=2332

    贡献者：Swaroop, 9 匿名编辑


    ## Python 基础


    仅仅打印 ''Hello World'' 是不够的，对吗？你想做更多——你想输入、处理它并获取结果。我们可以在 Python 中使用常量和变量来实现。


    ### 字面量常量


    字面常量的例子是数字如 `5`、`1.23`、`25e-3` 或字符串 `''This is a string''` 或 `"It''s a string"`。它被称为字面量是因为它是*字面的*——你直接使用它的值。数字
    `2` 代表它本身——它是一个*常量*因为它的值不能改变。因此，所有这些都是字面量常量。


    ### 数字


    Python 中的数字三种类型——整数、浮点数和复数。


    - 整数的示例是 `2`，它只是一个整数。

    - 浮点数（简称为 *floats*）的示例是 `3.23` 和 `52.3E-4`。`E` 表示法表示 10 的幂。在这里，`52.3E-4` 表示 $52.3
    * 10⁴$。

    - 复数的示例是 `(-5+4j)` 和 `(2.3 - 4.6j)`。


    对于经验丰富的开发者，没有独立的 ''long int'' 类型。默认整数类型可以是任意大值。


    ### 字符串


    字符串是字符的序列。字符串基本上是一堆单词。单词可以是英语或 Unicode 标准支持的任何其他语言，这意味着世界上几乎任何语言（http://www.unicode.org/faq/basic_q.html#16）。


    对于经验丰富的开发者，没有“仅 ASCII”字符串，因为 Unicode 是 ASCII 的子集。如果需要严格的 ASCII 编码字节流，请使用 `str.encode("ascii")`*。更多细节请参阅
    StackOverflow 上的相关讨论（http://stackoverflow.com/questions/how-do-i-convert-a-files-from-unicode-to-ascii-using-python#175240/）。


    默认情况下，所有字符串都是 Unicode。


    我几乎可以保证，在你编写的每个 Python 程序中都会有字符串，所以请注意以下关于如何在 Python 中使用字符串的部分。


    '
