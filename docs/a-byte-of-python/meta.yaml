    # Changing the Order Of Evaluation


    To make the expressions more readable, we can use parentheses. For example, 2
    + (3 * 4) is definitely easier to understand than 2 + 3 * 4 which requires knowledge
    of the operator precedence. As with everything else, parentheses should be used
    reasonably (do not overdo) and should not be redundant (as in 2 + (3) * 4).


    There is an additional advantage to using parentheses - it helps us to change
    the order of evaluation. For example, if you want to add be evaluated before multiplication
    in an expression, then you can write something like (2 + 3) * 4.


    # Associativity


    Operators are usually associated from left to right i.e. operators with the same
    precedence are evaluated in a left to right manner. For example, 2 + 3 + 4 is
    evaluated as (2 + 3) + 4. Some operators like assignment operators have right
    to left associativity. a = b = c is treated as a = (b = c).


