    Python:en: Next


    # Discussion


    If you are stuck with a Python problem, and don''t know whom to ask, then the
    comp.lang.python discussion group (http://groups.google.com/group/comp.lang.python/

    top) is the best place to ask your question.


    Make sure you do your homework and have tried solving the problem yourself.


    # News


    If you want to know what is latest in the world of Python, then follow the Official
    Python Planet (http://planet.python.org) and/or the Unofficial Python Planet (http://www.

    planetpython.org).


    # Installing libraries


    There are a huge number of open source libraries at the Python Package Index (http://

    pypi.python.org/pypi) which you can use in your programs.


    To install and use these libraries, you can use Philip J. Eby''s excellent Easytool

    (http://peak.telecommunity.com/DevCenter/EasyInstall#using-easy-install).


    # Graphical Software


    Suppose you want to create your own graphical programs using Python. This can
    be done

    using a GUI (Graphical User Interface) library with your Python bindings. Bindings
    are

    what allow you to write programs in Python and use the libraries which are themselves

    written in C or C++ or other languages.


    There are lots of choices for GUI using:


    # PyQt


    This is the Python binding for the Qt toolkit which is the foundation upon which
    the

    KDE is built. Qt is extremely easy to use and very powerful especially by the
    Qt

    Designer and the amazing Qt documentation. Qt is free if you want to create open

    source (GPL)ed and you need to buy it if you want to create proprietary

    closed software. Starting with Qt 4.5 you can use to create non-GPL software

    as well. To get started, read the PyQt tutorial (http://zetcode.com/tutorials/pyqt/)

    or the PyQt book (http://www.qtrac.org/pyqtbook.html).


    # PyGTK


    This is the Python binding for GTK+ which is the foundation upon which the

    GNOME is built. GTK+ has many quirks in usage but once you become comfortable,

    you can create GUI apps fast. The Glade interface designer is indispensable.

    The documentation is to improve. GTK+ works well on Linux but its port to

    Windows is incomplete. You can create free as well as proprietary software using\GTK+.
    To get started, read the PyGTK tutorial (http://www.gtk.org/tutorial.html).


    # wxPython


    This is the Python bindings for the wxWidgets toolkit. wxPython has a learning
    curve

    associated with it. However, it is very portable and runs on Linux, Windows, Mac
    and

    even embedded platforms. There are many IDEs available for wxPython which include

    GUI designers as well such as SPE (Stani''s Python Editor) (http://spe.pycs.net/)
    and'
  - '[PAGE 109]


    # Python:What Next


    the wxGlade (http://wxglade.sourceforge.net/) GUI builder. You can create free
    as well as proprietary software using wxPython. To get started, read the wxPython
    tutorial (http://zetcode.com/wxpython/).


    # Tkinter


    This is one of the oldest GUI toolkits in existence. If you have used IDLE, you
    have a Tkinter program at work. It doesn''t have one of the best look & feel because
    it has old-school look to it. Tkinter is portable and works on both Linux/Unix
    as Windows. Importantly, Tkinter is part of the standard Python distribution.
    To get started, read the Tkinter tutorial (http://www.python.com/library/tkinter/introduction/).


    For more choices, see the GuiProgramming wiki page at the official python website
    (http://www.python.org/cgi-bin/moin//GuiProgramming).


    # Summary of GUI Tools


    Unfortunately, there is no one standard GUI tool for your situation. I suggest
    that you choose one of the above tools to pay any use of the GUI tools. The second
    factor is whether you are willing to run the program only on Windows or Mac or
    Linux or all of them. The third factor, if Linux is a chosen platform, is whether
    you are a KDE or GNOME user on Linux.


    For a more detailed and comprehensive analysis, see Page 26 of The Python Papers,
    Volume 3, Issue 1 (http://archive.pythonpapers.org/ThePythonPapersVolume3Issue1.pdf).


    # Various Implementations


    There are usually two programming language - the language and the software. A
    language is how you write something. The software is what actually runs your programs.


    We have using the CPython software to run our programs. It is referred to as CPython
    because it is written in the C language and is the Classical Python interpreter.


    There are other software that can run your Python programs:


    # Jython (http://www.jthon.org)


    A Python implementation that runs on the Java platform. This means you can use
    Java libraries and classes from Python language and vice-versa.


    IronPython (http:// / www. codeplex. com/ Wiki/ View. aspx?ProjectName=IronPython)


    A Python implementation runs on the .NET platform. This means you can use .NET
    libraries and classes from Python language and vice-versa.


    # PyPy (http://codespeak.net/pypy/pypy/doc/home.html)


    A Python implementation in Python! This is a research project to make it fast
    and easy to improve the interpreter since the interpreter is written in a dynamic
    language (as opposed to static languages such as C, Java or C# in the three implementations)


    # Stackless Python (http://www.stackless.com)


    A Python implementation that is specialized for thread-based performance.'
  - '[PAGE 110]


    # Python en:What Next


    There are also others such as CLPython (http://common-list.net/project/clpython/)
    - a Python implementation written in Common L and IronMonkey (http://wiki.mozilla.org/Tamarin:IronMonkey)
    which is a part of IronPython to work on a JavaScript interpreter which could
    mean you can use Python (instead of JavaScript) to write your web-browser("Ajax")
    programs.


    Each of these implementations have their specialized areas where they are useful.


    # Summary


    We have come now to read the end of this book, as they say, this is the beginning
    of the end! You are now an avid Python user and you have no doubt ready to solve
    many problems using Python. You can start automating your computer to do all kinds
    of previously unimaginable things or write your games and much more. Go, get started!


    Previous Next


    Source: http://www.swaroopch.com/mediawiki/index.php?oldid=1845

