  md: '# Using A Source File


    Now let''s get back to programming. There is a tradition that whenever you learn
    a new programming language, the first program that you write and run is the ''Hello
    World'' program - all it does is just ''Hello World'' when you run it. As Simon
    Cozens [11] puts it, it is the ''traditional incantation to the programming gods
    to help you learn the language better''.


    Start your choice of editor, enter the following program and save it as helloworld.py


    If you are using IDLE, click on File -> New Window and enter the following program.
    Then click on File -> Save.


    ```

    #!usr/bin/python

    #Filename: helloworld.py


    print(''Hello World'')

    ```


    Run this program by opening a shell (Linux terminal or DOS prompt) and entering
    the command python helloworld.py.


    If you are using IDLE, use the menu Run -> Module or the keyboard shortcut F5.
    The output is as shown below.


    > $ python helloworld.py

    Hello World


    If you got the output as shown above, congratulations! - you have successfully
    run your first Python program.


    In case you get an error, please type the above program *exactly* as shown and
    above and run the program again. Note that Python is case-sensitive i.e. print
    is not the same as Print - note the lowercase p in the first and the uppercase
    P in the latter. Also, ensure there are no spaces or tabs before the first character
    in each line - we will see why this is important later.


    # How It Works


    Let us consider the first lines of the program. These are called *comments* -
    anything to the right of the # symbol is a comment and is mainly useful as notes
    for the reader of the program.


    Python does not use comments except for the special case of the first line here.
    It is called *shebang line* - whenever the first two characters of the source
    file are #! followed by the location of the interpreter, this tells your Linux/Unix
    system that this program should be run with this interpreter you *execute* the
    program. This is explained in the next section. Note that you can always run the
    program on any platform by specifying the interpreter directly on the command
    line such the command helloworld.py.


    # Important


    Use sensibly in your program to explain some details of your program - this is
    useful for readers of your program so that they can easily understand what the
    program is doing. Remember, that person can be yourself after six months!


    The comments are followed by a Python *statement*. Here we will call the print
    *function* just prints the text ''Hello World''. We will learn about functions
    in a -> later chapter, what'
