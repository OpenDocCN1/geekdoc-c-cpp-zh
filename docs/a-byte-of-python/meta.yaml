  mdcn: "\n\n# Python：运算符与表达式\n\n| | | 描述 |\n|---|---|---|\n| or | 布尔或 | x = True;\
    \ y = False; x or y 返回 True。 |\n| | 否则如果是 True，则返回 y 的求值 | 此处同样短路求值。 |\n\n# 数学运算和赋值的快捷方式\n\
    \n在变量上执行数学运算并将结果赋值回该变量是常见操作，因此对于此类表达式有一个快捷方式：\n\n你可以写成：\n\n```\na = 2; a = a *\
    \ 3\n```\n\n写为：\n\n```\na = 2; a *= 3\n```\n\n注意 `var = var 运算表达式` 变成了 `var 运算=表达式`。\n\
    \n# 求值顺序\n\n如果你有一个像 `2 + 3 * 4` 的表达式，是先执行加法还是乘法？我们的中学数学告诉我们应该先执行乘法。这意味着乘法运算符的优先级高于加法运算符。\n\
    \n下表是 Python 的优先级表，从最低优先级（最松散）到最高优先级（最紧密）。这意味着在给定的表达式中，Python 会先评估表中较低的运算符和表达式，再评估表中位置靠上的。\n\
    \n下表摘自 [Python 参考手册](http://docs.python.org/dev/3/reference.html#evaluation-order)，是为了完整性而提供的。最好使用括号合理地分组运算符和操作数来显式指定优先级，这会让程序更具可读性。详情见下方的“求值顺序”。\n\
    \n| 运算符 | 描述 |\n|---|---|\n| lambda | Lambda 表达式 |\n| or | 布尔或 |\n| and | 布尔与\
    \ |\n| not | 布尔非 |\n| in, not in | 成员测试 |\n| is, not | 标识性测试 |\n| <, <=, >, >=,\
    \ !=, == | 比较 |\n| | 按位或 |\n| ^ | 按位异或 |\n| & | 按位与 |\n| <<, >> | 移位 |\n| +, -\
    \ | 加、减 |\n| *, /, % | 乘法、除法、整除和取模 |\n| +x, -x | 正数、负数 |\n\n# Python：运算符与表达式\n\
    \n| 运算符 | 描述 |\n|---|---|\n| ~x | 按位非 |\n| ** | 幂 |\n| x.attribute | 属性引用 |\n\
    | x[index] | 索引 |\n| x[index1:index] | 切片 |\n| f(arguments ...) | 函数调用 |\n| (expressions,\
    \ ...) | 绑定或元组显示 |\n| [expressions, ...] | 列表显示 |\n| {key:datum, ...} | 字典显示 |\n\
    \n我们尚未使其易读的运算符将在后面的章节中解释。优先级相同的运算符列在表格上方。例如，`+` 和 `-` 优先级相同。\n\n# 改变求值顺序\n\n为了让表达式更具可读性，我们可以使用括号。例如，`2\
    \ + (3 * 4)` 绝对比需要运算符优先级的 `2 + 3 * 4` 更容易理解。与其他任何事情一样，括号应该合理使用（不要过度），且不应该是冗余的（例如\
    \ `2 + (3) * 4`）。\n\n使用括号还有一个额外优势——它可以帮助我们改变求值顺序。例如，如果你想在表达式中先计算加法再计算乘法，你可以写成类似\
    \ `(2 + 3) * 4` 的代码。\n\n# 结合性\n\n运算符通常从左到右结合，即优先级相同的运算符按左到右的方式评估。例如，`2 + 3 + 4`\
    \ 被评估为 `(2 + 3) + 4`。某些运算符（如赋值运算符）具有从右到左的结合性。`a = b = c` 被视为 `a = (b = c)`。\n\n\
    # 表达式\n\n示例：\n#!/usr/bin/python\n# FileName: expression.py\n\n```\nlength = 5\n\
    breadth = 2\n\narea = length * breadth\nprint('Area is', area)\nprint('Perimeter\
    \ is', 2 * (length + breadth))\n```\n\n输出：\n\n```\n$ python expression.py\nArea\
    \ is 10\nPerimeter is 14\n```\n\n工作原理：\n矩形的长度和宽度存储在同名的变量中。我们利用这些变量通过表达式计算矩形的面积和周长。我们将表达式\
    \ `length * breadth` 的结果存储在变量 `area` 中，然后使用 `print` 函数将其打印。在第二种情况下，我们直接在 `print`\
    \ 函数中使用表达式 `2 * (length + breadth)` 的值。\n\n此外，注意 Python 如何“美化打印”输出。尽管我们没有在 'Area\
    \ is' 和变量 `area` 之间指定空格，但 Python 会加上它，以便我们获得整洁的输出，这样程序更具可读性（因为我们不需要担心输出字符串中的空格）。这就是\
    \ Python 如何让程序员的生活变得简单的例子。\n\n# 总结\n\n我们已经看到了如何使用运算符、操作数和表达式——这些是任何程序的各种构建块。接下来，我们将看到如何使用语句在程序中使用这些内容。\n\
    \n上一页 下一页\n\n> 来源：http://www.swaroop.com/mediawiki/index.php?oldid=1579\n贡献者：Swaroop,\
    \ 4 处匿名编辑\n\n# Python 中：控制流\n\n## 引言\n\n在我们到目前为止看到的程序中，总有一系列语句，Python 忠实地按照相同的顺序执行它们。如果你想改变它的运行流程呢？例如，你想让程序根据不同的情况做出决定并执行不同的操作，比如根据一天的时间打印“早上好”或“晚上好”？\n\
    \n正如你可能猜到的那样，这是通过使用控制流语句实现的。Python 中三个控制流语句：`if`、`for` 和 `while`。\n\n## if 语句\n\
    \n`if` 语句用于检查条件，如果条件为真，我们运行块语句（称为 `if-block`），否则我们处理另一块语句（称为 `else-block`）。`else`\
    \ 子句是可选的。\n\n示例：\n\n```\n#!/usr/bin/python\n# Filename: if.py\nnumber = 23\nguess\
    \ = int(input('Enter an integer : '))\nif guess == number:\n    print('Congratulations,\
    \ you guessed it.') # 新块在此开始\n    print('but you do not win any prizes!') # 新块结束\n\
    elif guess < number:\n    print('No, it is a little higher than that') # 另一个块\n\
    \    # 你可以在块中做任何你想做的事...\nelse:\n    print('No, it is a little lower than that')\n\
    \    # 你必须让 guess > number 才能到达这里\n```\n\nprint('Done')\n# 最后一条语句在 if 语句执行后总是会被执行\n\
    \n输出：\n\n```\n$ python if.py\nEnter an integer : 50\nNo, it is a little lower\
    \ than that\nDone\n\n$ python if.py\nEnter an integer : 22\n```\n\n# Python：控制流\n\
    \n```\n$ python if.py\nEnter an integer : 23\nCongratulations, you guessed it.\n\
    (but you do not win prizes!)\nDone\n```\n\n# 工作原理：\n\n在这个程序中，我们从用户处获取猜测并检查它是否是我们想要的数字，比如\
    \ 23。然后，我们使用 `input()` 函数获取用户的猜测并设置变量。函数只是可重用的程序片段。我们将在下一节更多关于它们的内容。\n\n我们向内置\
    \ `input` 函数提供一个字符串，它将其打印到屏幕上并等待用户输入。一旦我们输入内容并按回键，`input()` 函数就会返回我们，格式为字符串。然后我们把此字符串转换为整数并存储在变量\
    \ `guess` 中。实际上 `int` 是一个类，你现在只需要知道可以使用它来转换字符串（假设字符串包含有效输入）。\n\n接下来，我们将用户的猜测与我们选择的数字进行比较。如果它们相等，我们就打印一条成功消息。注意我们使用缩进级别来告诉\
    \ Python 哪些语句属于该块。这就是为什么缩进在 Python 中如此重要。我希望你正在遵循“一致缩进”的规则。你\n\n注意 `if` 语句结尾包含冒号——我们正在指示\
    \ Python 后面有一块语句。\n\n然后，我们检查猜测是否小于数字，如果是，我们就告知用户猜大一点。我们使用的是 `elif` 子句，它实际上将相关的\
    \ `if-else` 语句合并为一个组合的 `if-else` 语句。这让程序更容易理解并减少了所需的缩进量。\n\n`elif` 和 `else` 语句也必须在逻辑行末尾冒号，后面跟着相应的语句块（当然要有正确的缩进）\n\
    \n你可以在语句的 `if` 块内部另一个语句，依此类推——这被称为嵌套语句。\n\n记住 `elif` 和 `else` 部分是可选的。一个最小的 `if`\
    \ 语句是：\n\n```\nif True:\n    print('Yes, it is true')\n```\n\n在 Python 执行完 `if`\
    \ 语句以及相关的 `elif` 和 `else` 子句后，它移动到包含 `if` 语句块中的下一条语句。在这种情况下，它是程序开始执行的主块，下一条语句是\
    \ `print('Done')` 语句。之后，Python 看到程序的结束并简单地完成。\n\n尽管这是一个非常简单的程序，但我已经指出了即使在这个简单的程序中也应该注意的事情。这些都是非常直观（对于那些有\
    \ C/C++ 背景的人来说惊讶地简单），并且需要你\n\n"
