  md: "# DocStrings\n\nPython has a nifty feature called documentation strings, usually\
    \ referred to by its shorter name docstrings. DocStrings are an important tool\
    \ you should make use of since it helps to document the program better and makes\
    \ it easier to understand. Amazingly, we can get the docstring back from a function,\
    \ when the program is actually running!\nExample:\n\n```\n#!/usr/bin/python\n\
    # Filename: func_doc.py\n\ndef printMax(x, y):\n    \"\"\"Prints the maximum of\
    \ two numbers.\"\"\"\n    x = int(x) # convert to integers, if possible\n    y\
    \ = int(y)\n\n    if x > y:\n        print(x, ' is maximum')\n    else:\n    \
    \    print(y, ' is maximum')\n\nprintMax(3, 5)\nprint(printMax.__doc__)\n```\n\
    \nOutput:\n\n```\n$ python func_doc.py\n5 is maximum\nPrints the maximum of two\
    \ numbers.\n\nThe two values must be integers.\n```\n\nHow It Works:\n\nA string\
    \ on the first logical line of a function is the docstring for that function.\
    \ Note that DocStrings also apply to modules and classes which we will learn about\
    \ in the respective chapters.\n\nThe convention followed for a docstring is a\
    \ multi-line string where the first line starts with a capital letter and ends\
    \ with a dot. The second line is blank before any detailed explanation starting\
    \ from the third line. You are strongly advised to follow this convention for\
    \ all your docstrings and all non-trivial functions.\n\nWe can access the docstring\
    \ of the printMax function using the __doc__ (notice the double underscores) attribute\
    \ (name belonging to of). Just remember that Python treats everything as an object\
    \ and this includes functions. We'll learn more about objects in the class on\
    \ classes.\n\nIf you used help() in Python, then you have already seen the usage\
    \ of docstrings! What it does just fetch the __doc__ attribute of function and\
    \ displays it in a neat manner for you. You can try it out on the function above\
    \ - just include help(printMax) in"
