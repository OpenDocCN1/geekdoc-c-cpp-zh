    ## Python on:Operators and Expressions


    ## Introduction


    Most statements (logical lines) that you will contain **expressions**. A simple
    example of an expression is 2 + 3. An expression can be broken down into operators
    and operands. **Operators** are functionality that do something and can be represented
    by symbols such as or or by special keys. Operators require some data to operate
    on and which such data is called **operands**. In this case, 2 and 3 are the operands.


    ## Operators


    We will briefly take a look at the operators and their usage:

    Note that you can evaluate the expressions given in the examples using the interpreter
    interactively. For example, to test the expression 2 + 3, use the interactive
    interpreter prompt:


    ```

    >>> 2 + 3

    5

    >>> 3 * 5

    15

    >>>

    ```


    | Operator | Name | Explanation | Examples |

    |---|---|---|---|

    | + | Plus | Adds the two objects | 3 + 5 gives 8. ''a1'' + ''b'' gives ''ab''.
    |

    | - | Minus | Either gives a negative number or gives the subtraction of one number
    from the other | -5.2 gives a negative number. 50 - 24 gives 26. |

    | * | Multiply | Gives the multiplication of two numbers or the string repeated
    many times. | 2 * 3 gives 6. ''la'' * 3 gives lalala''. |

    | ** | Power | Returns x to the power of y | 3 ** 4 gives 81 (i.e. 3 * 3 * 3)
    |

    | / | Divide | Divide x by y | 4 / 3 gives 1.3333333333333333 |

    | // | Floor Division | Returns the floor of the quotient | 2 // 3 gives 0 |

    | % | Modulo | Returns the remainder of the division | 8 % 3 gives 2 |

