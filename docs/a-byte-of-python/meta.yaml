    ## Python 基础


    某些事情应该被执行，在这种情况下，我们将变量 `i` 连接到值 `5`。

    接下来，我们使用 `print` 语句打印 `i` 的值，意所当然的是，它只是将变量的值打印到屏幕上。


    我们将 `i` 中存储的值加 1 并将其存回。然后我们打印它，如所预期的，我们得到了值 `6`。


    同样，我们将字面量字符串赋值给变量 `s` 然后将其打印出来。


    ## 给静态语言编译者的说明


    变量通过赋值来使用。不需要或使用声明或数据类型定义。


    ## 逻辑行与物理行


    物理行是你编写程序时看到的内容。逻辑行是 Python 视为单个语句的内容。Python 隐式地假设每个物理行对应一个逻辑行。


    逻辑行的一个示例是语句 `''Hello World!''` —— 如果它单独占一行（如果你在编辑器中看到它），那么它也对应一个物理行。


    隐式地，Python 鼓励每行使用单个语句，这使得代码具有可读性。


    如果你想在单行物理上指定指定行，可以使用分号（`;`），但你必须显式地使用分号来指定，分号表示逻辑行/语句的结束。例如：


    ```

    i = 5

    print(i)

    ```


    实际上等同于


    ```

    i = 5;

    print(i);

    ```


    也可以写成


    ```

    i = 5; print(i);

    ```


    或者甚至


    ```python

    i = 5; print(i)

    ```


    然而，我强烈建议你坚持在单个物理行中写单个逻辑行。只有当逻辑行非常长时，才对单个逻辑行使用多个物理行。这种做法的理念是尽可能使用分号，因为它能带来更可读性的代码。事实上，我从未在
    Python 程序中用过甚至分号。


    下面是一个跨越多个物理行的逻辑行示例。这被称为显式行连接。


    ```

    s = ''This is a string. \

    This continues the string.''

    print(s)

    ```


    ## Python 基础


    这给出了输出：


    ```

    This is a string. This continues the string.

    ```


    同样，


    ```

    print\

    (i)

    ```


    等同于


    ```

    print(i)

    ```


    有时，存在一种隐式假设，你不需要使用反斜杠。这种情况发生在逻辑行使用括号、方括号或大括号时。这被称为**隐式行连接**。当我们在后面的章节中编写程序列表时可以看到这一点。


    ## 缩进


    空白在 Python 中非常重要。实际上，**行首的空白是重要的**。这被称为**缩进**。逻辑行开头的前导空白（空格和制表符）用于确定逻辑行的缩进级别，反之，它被用于确定语句的分组。


    这意味着组合在一起的语句**必须**具有相同的缩进。每组语句被称为一个**块（block）**。我们将在稍后的章节中看到关于块为什么很重要的示例。


    你应该记住的一点是，错误的缩进会导致错误。例如：


    ```

    i = 5

    print(''Value is '', i ) # 错误！注意行开头的单个空格

    print(''I repeat, the value is '', , i)

    ```


    当你运行此代码时，将得到以下错误：


    ```

    File "Whitespace.py", line 4

    print(''Value is '', i ) # 错误！注意行开头的单个

    空格

    ^

    entationError: unexpected indent

    ```


    注意第二行开头有一个空格。Python 指示的错误告诉你程序的语法是无效的，即程序没有写得正确。对你来说，这意味着你**不能随意启动语句块**（当然，除了你一直在使用的主块除外）。可以使用新块的情况将在后面的章节中详细介绍，例如控制流章节。


    ## 如何缩进


    不要混合使用制表符（tabs）和空格进行缩进，因为它们在不同平台上无法正常工作。我*强烈建议*你为每个缩进级别使用*单个制表符或四个*空格。选择这两种缩进风格中的一种。更重要的是，选择一种并**一致地**使用，即*仅*使用那种缩进风格。


    **给静态语言编译者的注意**


    Python 始终使用缩进表示块，永远不会使用大括号。运行 `from future import braces` 了解更多。


    ## 总结


    既然我们已经过过了许多细节，我们可以转向更有趣的内容，例如控制流语句。确保你对在本章中读到的内容熟悉。


