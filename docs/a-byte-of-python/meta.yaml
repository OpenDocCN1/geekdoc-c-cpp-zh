    # Python en:Appendix FLOSS


    # Free/Libre and Open Source Software (FLOSS)


    FLOSS (http://en.wikipedia.org/wiki/FLOSS) is based on the concept of a community,
    which itself is based on the concept of sharing, and particularly the sharing
    of knowledge. FLOSS are free for use, modification and redistribution.


    If you have already read this book, then you are already familiar with FLOSS since
    you have been using Python all along and Python is an open source software!


    Here are some examples of FLOSS to give an idea of the kind of things that community
    sharing and building create:


    +   - Linux. This is a Linux operating system that the whole world is slowly embracing!
    It was started by Linux Torvalds as a now. It is giving competition to Microsoft
    Windows. [ Linux Kernel (http://www.kernel.org )

    - Ubuntu. This is a community-driven distribution, sponsored by Canonical and
    it is the most popular Linux distribution today. It allows you to install a plethora
    of FLOSS available and all in an-to-use and easy-to-install manner. Best of all,
    you can just reboot your computer and run Linux off the CD! This allows you to
    completely try out the new OS before installing it on your computer. [ Ubuntu
    Linux (http://www.ubuntu.com )

    - OpenOffice. This is an excellent suite for writing, spreadsheet and drawing
    components many other things. It can open and edit MS Word and MS PowerPoint files
    with ease. It runs on almost all platforms. [ OpenOffice (http://www.openoffice.org
    )]

    - Mozilla Firefox. This is the next generation web browser which has gained great
    competition to Internet Explorer. It is blatantly fast and has gained critical
