    ## Python 之：运算符与表达式


    ## 引言


    你大多数语句（逻辑行）将包含**表达式**。表达式的一个简单示例是 `2 + 3`。一个表达式可以拆分为运算符和操作数。**运算符**是执行某些操作的功能，可以使用符号（如
    `or`）或特殊键表示。运算符需要一些数据进行操作，这些数据被称为**操作数**。在这种情况下，`2` 和 `3` 就是操作数。


    ## 运算符


    我们将简要查看运算符及其用法：

    注意，你可以使用解释器交互评估示例中的表达式。例如，测试表达式 `2 + 3`，使用交互式解释器提示符：


    ```

    >>> 2 + 3

    5

    >>> 3 * 5

    15

    >>>

    ```


    | 运算符 | 名称 | 解释 | 示例 |

    |---|---|---|---|

    | + | 加法 | 将两个对象相加 | 3 + 5 得到 8。''a1'' + ''b'' 得到 ''ab''。 |

    | - | 减法 | 得到负数或从一个数中减去另一个 | -5.2 得到一个负数。50 - 24 得到 26。 |

    | * | 乘法 | 两个数字的乘积或重复多次字符串 | 2 * 3 得到 6。''la'' * 3 得到 ''lalala''。 |

    | ** | 幂 | 返回 x 的 y 次方 | 3 ** 4 得到 81（即 3*3*3*3） |

    | / | 除法 | x 除以 y | 4 / 3 得到 1.3333333333333333 |

    | // | 整除 | 返回商的取整部分 | 2 // 3 得到 0 |

    | % | 取模 | 返回除法的余数 | 8 % 3 得到 2 |

    | << | 左移 | 将位向左移动指定的位数 | 2 << 2 得到 8。 |

    | >> | 右移 | 将位向右移动指定的位数 | 15 >> 1 得到 5。 |

    | & | 按位与 | 数字的按位与 | 5 & 3 得到 1。 |

    | | | | 按位或 | 数字的按位或 | 5 | 3 得到 7 |

    | ^ | 按位异或 | x 的按位异或 (-x+1) | 5 ^ 3 得到 6 |

    | < | 小于 | 如果 x 小于 y，返回 True | 5 < 3 得到 False |

    | > | 大于 | 如果 x 大于 y，返回 True | 5 > 3 得到 True |

    | <= | 小于等于 | 如果 x 小于等于 y，返回 True | 3 <= 6 得到 True |

    | >= | 大于等于 | 如果 x 大于等于 y，返回 True | 4 >= 3 得到 True |

    | == | 等于 | 比较对象是否相等 | 2 == 2 得到 True |

    | != | 不等于 | 比较对象是否不等 | 2 != 3 得到 True |

    | not | 逻辑非 | 如果 x 为 True，则返回 False。如果 x 为 False，则返回 True。 | True 返回 False |

    | and | 逻辑与 | 如果 x 和 y，如果 x 为 False 则返回 False，否则返回 y 的评估 | False and True 返回 False，因为
    x 为 False。在这种情况下，Python 不会评估 y，因为它知道 ''and'' 表达式的左侧为 False，这意味着无论其他值如何，表达式都是 False。这被称为短路值评估。
    |


