    # Python in:Data Structures


    You can do slicing with negative positions. Negative numbers are used for positions
    from the end of the sequence. For example, shoplist[:-1] will return a slice of
    the sequence which excludes the last item of the sequence but contains everything
    else.


    You can also provide a third argument for the slice, which is the step for the
    slicing (by default, the step size is 1):


    ```

    >>> shoplist = [''apple'', ''mango'', ''carrot'', ''banana'']

    >>> shoplist[::2]

    [''apple'', ''carrot'']

    >>> shoplist[::2]

    [''apple'', ''mango'', ''carrot'']

    >>> shoplist[::3]

    [''apple'', ''banana'']

    >>> shoplist[::1]

    [''banana'', ''carrot'', ''mango'', ''apple'']

    ```


    Notice that when the step is 2, we get the items with position 0, 2, ... When
    the step size is 3, we get the items with position 0, 3, etc.


    Try various combinations of slice specifications using the Python interpreter
    interactively i.e. the prompt so that you can see the results immediately. The
    great thing about sequences is that you can access tuples, lists and strings all
    in the same way!


    # Set


    Sets are unordered collections of simple objects. These are used when the existence
    of an object in a collection is more important than the order or how many times
    it occurs.


    Using sets, you can test for membership, whether it is a subset of another set,
    find the intersection between two sets, and so on.


    ```

    >>> bri = set([''brazil'', ''russia'', ''india''])

    >>> ''india'' in bri

    True

    >>> ''usa'' in bri

    False

    >>> bric = bri.copy()

    >>> bric.add(''china'')

    >>> bric.issuberset(bri)

    True

    >>> bri.remove(''russia'')

    >>> bri & bric # OR bri.intersection(bric)

    {''brazil'', ''india''}

    ```


    How It Works:

    The example above is pretty much self-explanatory because it involves basic set
    theory mathematics taught in school.'
