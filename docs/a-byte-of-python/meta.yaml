  md: "# Python en:Modules\n\n# Introduction\n\nYou have seen how you can reuse code\
    \ in your program by defining functions once. What if you wanted to reuse a number\
    \ of functions in other programs that you write? As you might have guessed, the\
    \ answer is modules.\n\nThere are various methods of writing modules, but the\
    \ simplest way is to create a file with .py extension that contains functions\
    \ and variables.\n\nAnother method is to write the modules in the native language\
    \ in which the Python interpreter itself was written. For example, you can write\
    \ modules in the C programming language (http://docs.python.org/ending/) and when\
    \ compiled, they can be used from your Python code using the standard Python interpreter.\n\
    \nA module can be imported by another program to make use of its functionality.\
    \ This is how we can use the Python standard library as well. First, we will see\
    \ how to use the standard library modules.\n\nExample:\n\n```\n#!/usr/bin/python\n\
    # Filename: using_sys.py\nimport sys\n\nprint('The command line arguments are:')\n\
    for i in sys.argv:\n    print(i)\n\nprint('\\\\n\\nThe PYTHONPATH is', sys.path,\
    \ '\\\\n')\n```\n\nOutput:\n\n```\n$ using_sys.py we are arguments\nThe command\
    \ line arguments are:\nusing_sys.py\nwe\nare\narguments\n\nPYTHONPATH is ['',\
    \ 'C:\\Windows\\system32\\python30.zip',\n'C:\\Python30\\\\DLLs', 'C:\\Python30\\\
    \\lib\\plat-win', 'C:\\Python30',\n'C:\\Python30\\\\lib\\site-packages']\n```\n\
    \nHow It Works:\n\nFirst, we import the sys module using the import statement.\
    \ Basically, this translates to telling Python that we want to use this module.\
    \ The sys module contains functionality related to the Python interpreter and\
    \ its environment i.e. the system."
