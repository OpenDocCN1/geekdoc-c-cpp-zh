    ```\n\nx = 50\n\n```\ndef func(x):\n    print('x is',, x)\n    x = 2\n    print('Changed\
    \ local x to', x)\n```\n\n```\nfunc(x)\nprint('x is still', x)\n```\n\nOutput:\n\
