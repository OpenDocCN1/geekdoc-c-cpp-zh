    `C:\Python30`。当然，根据实际情况使用。


    ### 适用于 macOS 用户


    对于 macOS 用户，macOS 用户在他们的系统中可能已经安装了 Python。


    ### 总结


    如果你想在 Linux 系统中使用 Python，你的系统中可能已经安装了 Python。对于 Windows 用户，我们在 Terminal 中使用。对于
    macOS 用户，我们已经安装了 Python。


