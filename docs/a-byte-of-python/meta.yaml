    Contributors: Swaroop, 8 anonymous edits\n\n# Python en:Functions\n\n# Introduction\n\
    \nFunctions are reusable pieces of programs. They allow you to give a name to\
    \ a block of statements and you can run that block using that name anywhere in\
    \ your program and any number of times. This is known as calling the function.\
    \ We have already used many built-in functions such as the len and range.\nThe\
    \ concept is probably the most important building block of any non-trivial software\
    \ (in any programming language), we will explore various aspects of functions\
    \ in this chapter.\nFunctions are defined using the keyword. This is followed\
    \ by an identifier name for the function followed by a pair of parentheses which\
    \ may enclose names of variables and the line ends with a colon. Next follows\
    \ the block of statements that are part of the function. An example will show\
    \ that this is actually very simple:\n\nExample:\n\n```\n#!/usr/bin/python\n#\
    \ Filename: function1.py\n\ndef sayHello():\n    print('Hello World!') # block\
    \ belonging to the function\n# End of function\n```"
- md: "\n## Python:Functions\n\n```\nsayHello() # call the function\nsayHello() #\
    \ call the function again\n```\n\nOutput:\n\n```\n$ python function1.py\nHello\
    \ World!\nHello World!\n```\n\nHow It Works:\nWe define a function called sayHello\
    \ using the syntax as explained above. This function takes no parameters and there\
    \ are no variables declared in the parentheses. Parameters to functions are just\
    \ input to the function so that we can pass in different values to it and get\
    \ back corresponding results.\n\nNotice that we can call the same function twice\
    \ which means we do not have to write the same code again.\n\n## Function Parameters\n\
    \nA function can take parameters, which are values you supply to the function\
    \ so that the function do something utilizing those values. These parameters are\
    \ just like variables except that the values of these variables are defined when\
    \ we call the function and are already assigned when the function runs.\n\nParameters\
    \ are specified within the pair of parentheses in the function definition, separated\
    \ by commas. When we call the function, we supply the values in the same way.\
    \ Note the terminology used - the names given in the function definition are called\
    \ parameters whereas the values you supply in the function call are called arguments.\n\
    \nExample:\n\n```\n#!/usr/bin/python\n# Filename: func_param.py\n```\n\n```python\n\
    def parseInt(a, b):\n  if a > b:\n    print(a, 'is maximum')\n  elif a == b:\n\
    \    print(a, 'is equal to', b)\n  else:\n    print(b, 'is maximum')\n```\n\n\
    ```python\nprintMax(3, 4) # directly give literal values\n```\n\n```python\nx\
    \ = 5\ny = 7\n```\n\n```python\nprintMax(x, y) # give variables as arguments\n\
    ```\n\nOutput:\n\n```\n$ python func_param.py\n4 is maximum\n7 is maximum\n```\n\
    \nHow It Works:\n\nHere, we define a function called printMax where we take two\
    \ parameters called a and b. We find out the greater number using a if..else statement\
    \ and then print the bigger number.\n\nIn the first usage of printMax, we directly\
    \ supply the numbers i.e. arguments. In the second usage, we call the function\
    \ variables. printMax(x, y) causes value of argument x to be assigned to parameter\
    \ a and the value of y assigned to parameter b. The printMax function works the\
    \ same in both cases.\n\n## Local Variables\n\nWhen you declare variables inside\
    \ a function definition, they are not related in any way to other variables with\
    \ the same names used outside the function i.e. variable names are local to the\
    \ function. This is called the scope of the variable. All variables have the scope\
    \ of the block they are declared starting from the point of definition of the\
    \ name.\n\nExample:\n\n```python\n#!/usr/bin/python\n# Filename: func_local.py\n\
    ```\n\nx = 50\n\n```python\ndef func(x):\n    print('x is', x)\n    x = 2\n  \
    \  print('Changed local x to', x)\n```\n\n```python\nfunc(x)\nprint('x is still',\
    \ x)\n```\n\nOutput:\n\n```\n$ python func_local.py\nx is 50\nChanged local x\
    \ to 2\nx is still 50\n```\n\nHow It Works:\n\nIn the function, the first time\
    \ that we use the value of the name x, Python uses the value of the parameter\
    \ declared in the function.\n\nNext, we assign the value 2 to x. The name is local\
    \ to our function. So, when we change the value of x in the function, the x defined\
    \ in the main block remains unaffected.\n\nIn the last print call, we display\
    \ the value of x in the main block and confirm that it is actually unaffected.\n\
    \n## Using The global Statement\n\nIf you want to assign a value to a name defined\
    \ at the top level of the program (i.e. not inside any kind of scope such as functions\
    \ or classes), then you have to tell Python that the name is not local, but it\
    \ is global. We do this using the global statement. It is impossible to assign\
    \ a value to a variable defined outside function without the global statement.\n\
    \nYou can use the values of such variables defined outside the function (assuming\
    \ there is no variable with the same name within the function). However, this\
    \ is not encouraged and should be avoided since it is unclear to the reader of\
    \ the program as to where that variable's definition is. Using the global statement\
    \ makes it amply clear that the variable is defined in an outermost block.\n\n\
    Example:\n\n```python\n#!/usr/bin/python\n# Filename: func_global.py\n\nx = 50\n\
    \ndef func():\n    global x\n    print('x is', x)\n    x = 2\n    print('Changed\
    \ global x to', x)\n\nfunc()\nprint('Value of x is', x)\n```\n\nOutput:\n\n```\n\
    $ python func_global.py\nx is 50\nChanged global x to 2\nValue of x is 2\n```\n\
    \nHow It Works:\n\nThe global statement is used to declare that x is a global\
    \ variable - hence, when we assign a value to x inside the function, this change\
    \ is reflected when we use the value of x in the main block.\n\nYou can specify\
    \ more than one global variable using the same global statement. For example,\
    \ global x, y, z.\n\n## Using nonlocal statement\n\nWe have seen how to access\
    \ variables in the local and global scope above. There is another kind of scope\
    \ called \"nonlocal\" scope which is in-between these two types of scopes. Nonlocal\
    \ scopes are observed when you define functions inside functions. Since everything\
    \ in Python is just executable code, you can define functions anywhere.\n\nLet's\
    \ take an example:\n\n```python\n#!/usr/bin/python\n# Filename: func_nonlocal.py\n\
    ```\n\n```python\ndef func_outer():\n    x = 2\n    print('x is', x)\n\n    def\
    \ func_inner():\n        nonlocal x\n        x = 5\n\n    func_inner()\n    print('Changed\
    \ local x to', x)\n```\n\nfunc_outer()\n\nOutput:\n\n```\n$ python func_nonlocal.py\n\
    x is 2\nChanged local x to 5\n```\n\nHow It Works:\n\nWhen we are inside func_inner,\
    \ the 'x' defined in the first line of func_outer is relatively neither in local\
    \ scope nor in global scope. We declare that we are using this x by nonlocal and\
    \ hence we get access to that variable.\nChanging the nonlocal x to global x and\
    \ also by removing the statement itself and observe the difference in behavior\
    \ in these two cases.\n\n## Default Argument Values\n\nFor functions, you may\
    \ want to make some of its parameters as optional and use default values if the\
    \ user does not provide values for such parameters. This is done with the help\
    \ of default argument values. You can specify default values for parameters by\
    \ following the parameter name in the function definition with the assignment\
    \ operator (=) followed by the default value.\n\nNote that the default argument\
    \ value should be a constant. More precisely, the default argument value should\
    \ be immutable - this is explained in detail in later chapters. For now, just\
    \ remember this.\n\nExample:\n\n```python\n#!/usr/bin/python\n# Filename: func_default.py\n\
    def say(message, times = 1):\n    print(message * times)\n```\n\n```python\nsay('Hello')\n\
    say('World', 5)\n```\n\nOutput:\n\n```\n$ python func_default.py\nHello\nHelloWorldWorldWorld\n\
    ```\n\nHow It Works:\n\nThe function named is used to print a string as many times\
    \ as specified. If we don't supply a value, then by default, the string is printed\
    \ just once. We achieve this by specifying a default argument value of 1 to the\
    \ parameter times.\n\nIn the first usage of say, we supply only the string and\
    \ it prints the string once. In the second usage of say, we supply both the string\
    \ and an argument 5 stating that we want to say the string 5 times.\n\n## Important\n\
    \nOnly parameters that are at the end of the parameter list can be given default\
    \ values i.e. you cannot have a parameter with a default argument value before\
    \ a default argument value in the order of parameters declared in the function\
    \ parameter list.\n\nThis is because the values are assigned to the parameters\
    \ by position. For example, def func(a, b=5) is valid, but def func(a=5, b) is\
    \ not valid.\n\n## Keyword Arguments\n\nIf you have functions with many parameters\
    \ and you want to specify only some of them, then you give values for such parameters\
    \ by naming them - this is called keyword arguments - we use the name (keyword)\
    \ instead of the position (which we have been using all along) to specify the\
    \ arguments to the function.\n\nThere are two advantages - one, using the function\
    \ is easier since we do not need to worry about the order of the arguments. Two,\
    \ we can give values to only those parameters that we want, provided that the\
    \ other parameters have default argument values.\n\nExample:\n\n```python\n#!/usr/bin/python\n\
    # Filename: func_key.py\n```\n\n```python\ndef func(a, b=5, c=10):\n    print('a\
    \ is', a, 'and b is', b, 'and c is', c)\n```\n\n```python\nfunc(3, 7)\n```\n"
  mdcn: "\n\n## Python:函数\n\n```\nsayHello() # 调用函数\nsayHello() # 再次调用函数\n```\n\n\
    输出：\n\n```\n$ python function1.py\nHello World!\nHello World!\n```\n\n工作原理：\n\
    我们使用上述的语法定义了一个名为 `sayHello` 的函数。该函数不接受任何参数，括号中没有声明任何变量。函数的参数只是函数的输入，这样我们可以向它传递不同的值并获得相应的结果。\n\
    \n注意，我们可以多次调用同一个函数，这意味着我们不需要再次编写相同的代码。\n\n## 函数参数\n\n函数可以接受参数，参数是您提供给函数的值，以便函数利用这些值执行某些操作。这些参数就像变量，不同之处在于这些变量的值是在调用函数时定义的，并且在函数运行时已经赋值了。\n\
    \n参数指定在函数定义的一对括号内，并用逗号分隔。当我们调用函数时，我们以相同的方式提供值。注意所使用的术语 - 在函数定义中给出的名称称为**参数 (parameters)**，而您在函数调用中提供的值称为**参数\
    \ (arguments)**。\n\n示例：\n\n```python\n#!/usr/bin/python\n# Filename: func_param.py\n\
    ```\n\n```python\ndef parseInt(a, b):\n  if a > b:\n    print(a, 'is maximum')\n\
    \  elif a == b:\n    print(a, 'is equal to', b)\n  else:\n    print(b, 'is maximum')\n\
    ```\n\n```python\nprintMax(3, 4) # 直接给出字面量\n```\n\n```python\nx = 5\ny = 7\n```\n\
    \n```python\nprintMax(x, y) # 将变量作为参数\n```\n\n输出：\n\n```\n$ python func_param.py\n\
    4 is maximum\n7 is maximum\n```\n\n工作原理：\n\n在这里，我们定义了一个名为 `printMax` 的函数，其中包含了两个名为\
    \ `a` 和 `b` 的参数。我们使用 `if..else` 语句找到较大的数，然后打印较大的数。\n\n在 `printMax` 的第一次使用中，我们直接提供了数字，即参数。在第二次使用中，我们通过变量调用函数。`printMax(x,\
    \ y)` 导致参数 `x` 的值被赋值给参数 `a`，`y` 的值被赋值给参数 `b`。`printMax` 函数在两种情况下工作原理相同。\n\n##\
    \ 局部变量\n\n当您在函数定义内部声明变量时，它们与函数外部使用的同名变量没有任何关系，即变量名是函数**局部的**。这被称为变量的**作用域 (scope)**。所有变量的作用域都是从名称定义点开始的所在块的作用域。\n\
    \n示例：\n\n```python\n#!/usr/bin/python\n# Filename: func_local.py\n```\n\nx = 50\n\
    \n```python\ndef func(x):\n    print('x is', x)\n    x = 2\n    print('Changed\
    \ local x to', x)\n```\n\n```python\nfunc(x)\nprint('x is still', x)\n```\n\n\
    输出：\n\n```\n$ python func_local.py\nx is 50\nChanged local x to 2\nx is still\
    \ 50\n```\n\n工作原理：\n\n在函数内部，我们第一次使用名称 `x` 的值时，Python 使用函数中声明的的值。\n\n接下来，我们将值 `2`\
    \ 赋值给 `x`。该名称对我们的函数是局部的。因此，当我们在函数中更改 `x` 的值时，主块中定义的 `x` 不受影响。\n\n在最后一个 `print`\
    \ 调用中，我们显示了主块中 `x` 的值，并确认它实际上不受影响。\n\n## 使用 global 语句\n\n如果您想给在程序顶层定义的名称赋值（即不在任何种类型的作用域内，如函数或类），那么您必须告诉\
    \ Python 该名称不是局部的，而是**全局的 (global)**。我们使用 `global` 语句来实现这一点。如果不使用 `global` 语句，无法给函数外部定义的变量赋值。\n\
    \n您可以使用在函数外部定义的此类变量的值（假设函数内部没有同名变量）。然而，不鼓励这样做，并且应该避免，因为程序的读者来说不清楚该变量的定义在哪里。使用\
    \ `global` 语句可以清楚地表明变量定义在最外层块。\n\n示例：\n\n```python\n#!/usr/bin/python\n# Filename:\
    \ func_global.py\n\nx = 50\n\ndef func():\n    global x\n    print('x is', x)\n\
    \    x = 2\n    print('Changed global x to', x)\n\nfunc()\nprint('Value of x is',\
    \ x)\n```\n\n输出：\n\n```\n$ python func_global.py\nx is 50\nChanged global x to\
    \ 2\nValue of x is 2\n```\n\n工作原理：\n\n`global` 语句用于声明 `x` 是一个全局变量 - 因此，当我们在函数内部为\
    \ `x` 赋值时，这个更改会在主块中使用 `x` 的值时反映。\n\n您可以使用同一个 `global` 语句指定多个全局变量。例如，`global x,\
    \ y, z`。\n\n## 使用 nonlocal 语句\n\n我们在上面已经了如何访问局部和全局作用域中的变量。还有另一种作用域被称为“非局部 (nonlocal)”作用域，它介于这两种作用域之间。当在函数内部定义函数时，就会观察到非局部作用域。由于\
    \ Python 中的一切都是可执行代码，您可以在任何地方定义函数。\n\n让我们来看来看：\n\n```python\n#!/usr/bin/python\n\
    # Filename: func_nonlocal.py\n```\n\n```python\ndef func_outer():\n    x = 2\n\
    \    print('x is', x)\n\n    def func_inner():\n        nonlocal x\n        x\
    \ = 5\n\n    func_inner()\n    print('Changed local x to', x)\n```\n\nfunc_outer()\n\
    \n输出：\n\n```\n$ python func_nonlocal.py\nx is 2\nChanged local x to 5\n```\n\n\
    工作原理：\n\n当我们在 `func_inner` 内部时，`func_outer` 第一行定义的 'x' 既不在局部作用域也不在全局作用域内。我们通过\
    \ `nonlocal` 声明我们正在使用这个 `x`，从而获取该变量。\n将非局部 `x` 改为全局 `x` 以及删除该语句本身，观察这两种情况下行为的区别。\n\
    \n## 默认参数值\n\n对于函数，您可能希望将其某些参数设置为可选的，如果用户没有为这些参数提供值，则使用默认值。这是通过默认参数值来实现的。您可以通过在函数定义中的参数名后跟随赋值运算符\
    \ (`=`) 以及默认值来为参数指定默认值。\n\n注意，默认参数值应该是常量。更准确地说，默认参数值应该是不可变的 (immutable)——将在后面的章节中详细解释。现在只需记住这一点。\n\
    \n示例：\n\n```python\n#!/usr/bin/python\n# Filename: func_default.py\ndef say(message,\
    \ times = 1):\n    print(message * times)\n```\n\n```python\nsay('Hello')\nsay('World',\
    \ 5)\n```\n\n输出：\n\n```\n$ python func_default.py\nHello\nHelloWorldWorld\n```\n\
    \n工作原理：\n\n名为 `say` 的函数按照指定的次数打印字符串。如果我们不提供值，默认只打印一次。我们通过为参数 `times` 指定默认值 `1`\
    \ 来实现这一点。\n\n在 `say` 的第一次使用中，我们只提供了字符串，它打印一次字符串。在 `say` 的第二次使用中，我们同时提供了字符串和参数\
    \ `5`，表示我们要打印 5 次字符串。\n\n## 重要\n\n只有参数列表末尾的参数可以赋予默认值，即在函数参数列表顺序中，不能将具有默认值的参数放在没有默认值的参数之前。\n\
    \n这是因为值是通过位置赋值给参数的。例如，`def func(a, b=5)` 是有效的，但 `def func(a=5, b)` 是无效的。\n\n##\
    \ 关键字参数\n\n如果您有一个许多许多参数的函数并且只想指定其中某些，那么您通过命名它们来为此类参数赋值——这被称为**关键字参数 (keyword arguments)**——我们使用名称（关键字）而不是一直以来使用的位置来为函数指定参数。\n\
    \n这有两个优点 - 第一，使用函数变得更简单，因为我们不需要担心参数的顺序。第二，只要其他参数具有默认参数值，我们就可以只为我们需要的参数赋值。\n\n\
    示例：\n\n```python\n#!/usr/bin/python\n# Filename: func_key.py\n```\n\n```python\n\
    def func(a, b=5, c=10):\n    print('a is', a, 'and b is', b, 'and c is', c)\n\
    ```\n\n```python\nfunc(3, 7)\n```\n\n"
