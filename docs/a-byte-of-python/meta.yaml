  mdcn: "\n\n# Python 字节 (A Byte of Python)\n\nv1.92 (适用于 Python 3.0)\n\n# Python\n\
    \n选择你的 Python 版本：\n\n如果你想学习当前的 Python 2.x，请阅读 [1] 或下载 PDF [2]\n\n如果你想学习新的 Python\
    \ 3.0，请点击此处阅读或下载 PDF [3]\n\n你也可以购买纸质正装版。[4]\n\n# 简介\n\n《A Byte of Python》是一本关于使用\
    \ Python 语言进行编程的书籍。它为初学者读者提供了 Python 语言的教程或指南。如果你们都了解电脑，比如如何保存文本文件，那么这本书就是为你们准备的。\n\
    \n本书已针对新的 Python 3.0 进行了更新。如果你正在寻找当前 Python 2.x 版本的教程，请下载该书之前的版本 [5]。同样，如果你在犹豫是学习\
    \ Python 2.x 还是 3.x，可以阅读 James Bennett 撰写的这篇文章 [6]。\n\n# 谁在读《Python 字节》？\n\n以下是人们对这本书的评价：\n\
    \n## 读者反馈\n\n- 这是我见过的最好的教程！感谢你的努力。\n  - Walt Michalik (wmich50-at-theramp-dot-net)\n\
    \n- 你做了我在网上找到的最好的教程。干得好。谢谢！\n  - Joshua Robin (joshrob-at-poccta-dot-one-dot-pl)\n\
    \n- 你好，我来自多米尼加共和国。我叫 Pavel，我最近读了你的书《A Byte of Python》，我认为它非常棒！！ :) 我从所有的示例中学到了东西。这本书对像我这样的新手非常有帮助……\n\
    \  - Pavel Simo (pavel-dot-simo-at-gmail-dot-com)\n\n- 我最近读完了《Byte of Python》，我觉得我真的应该感谢你。读最后几页时感到很难过，因为我现在必须回到那些枯燥、乏味或其他手册来学习\
    \ Python 了。我非常感谢你的书。\n  - Samuel Young (sy-one-three-seven-at-gmail-dot-com)\n\
    \n- 亲爱的 Swaroop，我正在上一个对教学毫无兴趣的老师的课。我们在使用 O'Reilly 出版的第二版《Learning Python》。对于没有任何编程知识的初学者来说，那并不是一本教材，而且那个老师应该在另一个领域工作。非常感谢你的书，没有它，我对比\
    \ Python 和编程将一无所知。万分感谢，你能将“信息拆解”到初学者可以理解的且并非所有人都能掌握的程度。\n  - Joseph Duarte (jduarte1-at-cfl-dot-rr-dot-com)\n\
    \n- 我喜欢你的书！它是史上最伟大的 Python 教程，也是一本非常实用的参考书。太棒了，真正的杰作！继续保持努力！\n  - Chris-André\
    \ Sommersett\n\n- 我只是写邮件给你，是为了感谢你在线编写了《Byte of Python》。在偶然发现你的书之前，我已经尝试了 Python\
    \ 几个月，尽管我在 PyGame 上取得了有限的成功，但我从未完成过程序。\n\n多亏了你对分类的简化，Python 实际上似乎是一个可以实现的目标。似乎我终于学会了基础知识，可以继续我的真实目标——游戏开发了。\n\
    \n再次非常感谢你在网上为我们提供了这份结构化且实用的基础编程指南。它让我跳出了 OOP（面向对象编程）的迷局，并获得了另外两本书未能提供的理解。\n  -\
    \ Matt Gallivan (m-underscore-gallivan-12-at-hotmail-dot-com)\n\n- 感谢你的书《A byte\
    \ of python》，我认为这是学习 Python 的最佳方式。我是一个住在埃及的15岁少年，我叫 Ahmed。Python 是我的第二种编程语言，我在学校学过\
    \ Visual 6但不喜欢，但我真的很喜欢学习 Python。我确实做了书中的程序并成功了，我会尝试开始更多程序并阅读 Python 程序（如果你能告诉我哪里可以找到像你这样好的教程，将对我非常有帮助）。谢谢。\n\
    \  - Ahmed Mohammed (sedo-underscore-91-at-hotmail-dot-com)\n\n- 对于初学者学习更多 Python\
    \ 的绝佳资源是 Swaroop C H 编写的110页 PDF《A Byte of Python》。它写得很好，易于理解，可能是对 Python 编程最好的介绍。\n\
    \  - 在 Linux 发表的一篇关于 Scripting Scribus 的文章中，Drew Ames 这样说道 [7]\n\n- 昨天，我在我的 Nokia\
    \ N800 上读完了《Byte of Python》的大部分内容，这是我为止遇到过的最简单、最简洁的 Python 介绍。强烈推荐作为学习 Python\
    \ 的起点。\n  - Jason Delport 为他的博客 [8]\n\n# 学术课程\n\n本书被用作各个教育的教学材料：\n\n- 1. 阿姆斯特丹自由大学（Vrije\
    \ Universiteit）的“编程语言原理”课程 [9]\n- 2. 加州大学戴维斯分校的“计算基础概念”课程 [10]\n- 3. 哈佛大学的“使用\
    \ Python 编程”课程 [11]\n- 4. 利兹大学的“编程简介”课程 [12]\n- 5. 波士顿大学的“应用编程简介”课程 [13]\n- 6.\
    \ 俄克拉荷马大学的“气象技术技能”课程 [14]\n- 7. 密歇根州立大学的“地理处理”课程 [15]\n- 8. 爱丁堡大学的“多代理语义网”课程 [16]\n\
    \n# 甚至有 NASA\n\n这本书甚至被 NASA 使用！它被用于他们的喷气推进实验室 [17] 以及深空网络项目。\n\n# 官方推荐\n\n这本书已列在\
    \ Python 官方网站的完整教程 [18] 部分，就在官方文档旁边。\n\n# 许可\n\n- 1. 本书根据知识共享署名-相同共享 3.0 国际许可\
    \ [19] 许可使用。\n  - 这意味着：\n    - 你可以自由地共享（即复制、分发和传输）本书\n    - 你可以自由地混合（即改编）本书\n\
    \  - 条件：\n    - 署名（Attribution）：你必须以作者或许可者规定的方式署名（但不能以任何他们认可你或支持你使用本书的方式）。\n \
    \   - 相同共享（Share Alike）：如果你修改、转换或基于本作品进行创作，你必须以相同或类似的许可分发衍生作品。\n    - 对于任何重用或分发，你必须向他人说明许可条款。\n\
    \n（注：此处原文中存在大量重复的许可条款描述，翻译时已保持核心逻辑并去除了冗余）\n\n"
