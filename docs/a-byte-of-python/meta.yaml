    # Note for C+/Java/C# Programmers


    All classes (including the data members) are public and all the methods are virtual
    in Python.


    One exception: If you use data members with names using the double underscore
    prefix such as __private__, Python uses name-mangling to effectively make it a
    private variable.


    The convention followed is that any variable is to be used only within the class
    or object begin with an underscore and all other names are public and can be used
    by other classes/objects. Remember that this is only a convention and is not enforced
    by Python (except for the double underscore prefix).


    # Inheritance


    One of the major benefits of object oriented programming is reuse of code and
    one of the ways this is achieved through the inheritance mechanism. Inheritance
    can be best imagined as implementing a type and subtype relationship between classes.


    Suppose you want to write a program that has keep track of the teachers and students
    in a college. They have common characteristics such as name, age and address.
    They also have specific characteristics as salary, courses and leaves for teachers,
    marks and fees for students.


    You can create two independent classes for each type and process them by adding
    a new common characteristic to both of independent classes. This quickly becomes
    unwieldy.


    A better way would be to create a common class SchoolMember and then have the
    teacher and student classes inherit from this class i.e. they will become sub-types
    of this type (class) and then we can add specific characteristics to these sub-types.


    There are many advantages to this approach. If we add/change any functionality
    in SchoolMember, this is automatically reflected in the subtypes. For example,
    you can add a new ID field for both teachers and students by simply adding it
    to the SchoolMember class. However, changes in the subclasses do not affect other
    subtypes. Another advantage is that you can refer to a teacher or student object
    as a SchoolMember object which could be useful in such situations as counting
    of the number of school members. This is called polymorphism where a sub-type
    can be substituted in any situation where a parent type is expected i.e the object
    can be treated as an instance of the parent class.


    Also observe that we reuse the code of the class and do not need to repeat it
    in the different classes as we would have had in case we had used independent
    classes.


    The School class in this situation is known as the base class or the superclass.
    The Teacher and Student classes are called the derived classes or subclasses.


    We will see this example as a program.


    ```

    #!/usr/bin/python

    # Filename: inherit.py

    ```'
