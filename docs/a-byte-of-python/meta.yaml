    $ python try_except.py\nEnter something --> # Press ctrl-c\nYou cancelled the\
    \ operation.\n```\n\n```\n$ python try_except.py\nEnter something --> no exceptions\n\
    You entered no exceptions\n```\n\n### How It Works:\n\nWe put all the statements\
    \ that might raise exceptions/errors inside the try block and then put handlers\
    \ for the appropriate errors/exceptions in the except clause/block. The except\
    \ clause can handle a single specified error or exception, or a parenthesized\
    \ list of errors/exceptions. If no names of errors or exceptions are supplied,\
    \ it will handle all errors and exceptions.\n\nNote that there has to be at least\
    \ one except clause associated with every try clause. Otherwise, what's the point\
    \ of having a try block?\n\nIf any error or exception is not handled, the default\
    \ Python handler is called which stops the execution of the program and prints\
    \ an error message. We have already seen this in action above.\n\nYou can also\
    \ have an else clause associated with a try..except block. The else clause is\
    \ executed if no exception occurs.\n\nIn the next example, we will also see how\
    \ to get the exception object so that we can retrieve additional information.\n\
    \n## Raising Exceptions\n\nYou can raise exceptions using the raise statement\
    \ by providing the name of the error/exception and the exception object that is\
    \ to be thrown. The error or exception that you can raise be a class which directly\
    \ or indirectly be a derived class of the Exception class.\n\n```python\n#!/usr/bin/python\n\
    # Filename: raising.py\n\nclass ShortIntException(Exception):\n    '''A user-defined\
    \ exception class.'''\n    def __init__(self, length, atleast):\n        self.length\
    \ = length\n        self.atleast = atleast\n```\n\n```python\ntry:\n    text =\
    \ input('Enter something -> ')\n    if len(text) < 3:\n        raise ShortIntException(len(text),\
    \ 3)\n    # Other work can continue as usual here\nexcept EOFError:\n    print('Why\
    \ did you do an EOF on me?')\nexcept ShortIntException as ex:\n    print('IntException:\
    \ The input was {0} long, expected at least {1}'\\n\n        .format(ex.length,\
    \ ex.atleast))\nelse:\n    print('No exception was raised.')\n```\n\nOutput:\n\
    \n```\npython raising.py\nenter something -> a\nIntException: The input was 1\
    \ long, expected at least 3\n```\n\n### How It Works:\n\nThe output should be\
    \ the same as the previous example. The difference here is that we are using the\
    \ open function with the with statement - we leave the closing of the file to\
    \ be done automatically by with.\n\n## The with statement\n\nAcquiring a resource\
    \ in the try block and subsequently releasing the resource in the finally block\
    \ is a common pattern. Hence, there is also a with statement that enables this\
    \ to be done in a clean manner:\n\n```python\n#!/usr/bin/python\n# Filename: \"\
    poem.txt\"\n\nwith open(\"poem.txt\") as f:\n    for line in f:\n        print(line,\
    \ end='')\n```\n\n### How It Works:\n\nThe output should be the same as the previous\
    \ example. The difference here is that we are using the open function with the\
    \ with statement - we leave the closing of the file to be done automatically by\
    \ with.\n\nWhat happens behind the scenes is that there is a protocol used by\
    \ the with statement. It fetches the object returned by the open statement, let's\
    \ call it \"thefile\" in this case.\n\nIt calls the thefile__enter__ function\
    \ before starting the block of code under it and always calls thefile__exit__\
    \ after finishing the block of code.\n\nSo the code that we have written in a\
    \ finally block is taken of care automatically by the __exit__ method. This is\
    \ what helps us to avoid having to use explicit statements repeatedly.\n\n## Finally\n\
    \nSuppose you are reading a file. How do you ensure the file object is always\
    \ closed? Use the finally block.\n\n```python\n#!/usr/bin/python\n# Filename:\
    \ finally.py\n\nimport time\ntry:\n    f = open('poem.txt')\n    while True:\n\
    \        line = f.readline()\n        if len(line) == 0:\n            break\n\
    \        print(line, end='')\n        time.sleep(2)\nexcept KeyboardInterrupt:\n\
    \    print('You cancelled the operation.')\nfinally:\n    f.close()\n```\n\nOutput:\n\
    \n```\n$ python finally.py\nProgramming is fun\nYou cancelled the operation.\n\
    ```\n\n### How It Works:\n\nThe usual file-reading stuff, but we have arbitrarily\
    \ sleeping for 2 seconds after each line using the time.sleep function so that\
    \ the program runs slowly. When the program is still running, press ctrl-c to\
    \ interrupt/cancel the program. Observe that the KeyboardInterrupt exception is\
    \ thrown and the program quits. However, before the program exits, the finally\
    \ clause is executed and the file object is always closed.\n\n## Summary\n\nWe\
    \ have discussed the usage of the try..except and try..finally statements. We\
    \ have seen how to create our exception types and how to raise exceptions as well.\n\
    \nNext, we will explore the Python Standard Library.\n"
