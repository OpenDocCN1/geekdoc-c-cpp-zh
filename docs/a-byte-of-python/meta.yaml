  - "[PAGE 37]\n\n# # Python en:Control Flow\n\n# ## Introduction\n\nIn the programs\
    \ we have seen till now, there has always been a series of statements and Python\
    \ faithfully executes them in the same order. What if you wanted to change the\
    \ flow of how it works? For example, you want the program to take some decisions\
    \ and do different things depending on different situations such as printing 'Good\
    \ Morning' or 'Good Evening' depending on the time of the day?\n\nAs you might\
    \ have guessed, this is achieved using control flow statements. There are three\
    \ control flow statements in Python - if, for and while.\n\n# ## The if statement\n\
    \nThe if statement is used to check a condition and if the condition is true,\
    \ we run a block of statements (called the if-block), else we process another\
    \ block of statements (called the else-block). The else clause is optional.\n\n\
    Example:\n\n```\n#!/usr/bin/python\n# Filename: if.py\nnumber = 23\ngess = int(input('Enter\
    \ an integer : '))\n guess == number:\n    print('Congratulations, you guessed\
    \ it.') # New block starts here\n    print('but you do not win any prizes!') #\
    \ New block ends here\nel guess < number:\n    print('No, it is a little higher\
    \ than that') # Another block\n    # You can do whatever you want in a block ...\n\
    else:\n    print('No, it is a little lower than that')\n    # you must have guess\
    \ > number to reach here\n```\n\nprint('Done')\n# This last statement is always\
    \ executed, after the if statement is executed\n\nOutput:\n\n```\n$ python if.py\n\
    Enter an integer : 50\nNo, it is a little lower than that\nDone\n\n$ python if.py\n\
    ter an integer : 22\n```"
