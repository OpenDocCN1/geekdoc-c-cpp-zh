    \ also be written as Person().sayHi()\n```\n\nOutput:\n\n```\n$ python method.py\n\
    Hello, how are you?\n```\n\nHow It Works:\nHere we see the self in action. Notice\
    \ that the sayHi method takes no parameters but still has the self in the function\
    \ definition.\n\n## The __init__ method\n\nThere are many methods which have special\
    \ significance in Python classes. We will see the significance of the __init__\
    \ method now.\n__init__ method is run as soon as an object of a class is instantiated.\
    \ The method is useful to do any initialization you want to do with your object.\
    \ Notice the double underscores both at the beginning and at the end of the name.\n\
    \nExample:\n\n```python\n#!/usr/bin/python\n# Filename: class_init.py\n\nclass\
    \ Person:\n    def __init__(self, name):\n        self.name = name\n    def sayHi(self):\n\
    \        print('Hello, my name is ', self.name)\n\np = Person('Swaroop')\np.sayHi()\n\
    ```\n\nOutput:\n\n```python\n$ python class_init.py\nHello, my name is Swaroop\n\
    ```\n\nHow It Works:\nHere, we define the __init__ method as taking a parameter\
    \ name (along with the usual self), here we just create a new field called name.\
    \ Notice there are two different variables even though they are both called 'name'.\
    \ The dotted notation allows us to differentiate between them.\nMost importantly,\
    \ notice that we do not explicitly call the __init__ method but pass the arguments\
    \ in the parentheses when calling the class when creating a new instance of the\
    \ class. This is the special significance of this method.\nNow, we are able to\
    \ use the self.name field in our methods which is demonstrated in the SayHi.\n\
    \n## Class And Object Variables\n\nWe have already discussed the functionality\
    \ of classes and objects (i.e. methods), now let us learn about the data part.\
    \ The data part, i.e. fields, are nothing but ordinary variables that are bound\
    \ to the namespaces of the classes and objects. This means these names are valid\
    \ within the context of these classes and objects. That's why they are called\
    \ name spaces.\nThere are two types of fields - class variables and object variables\
    \ which are classified depending on whether the class or the object owns the variables\
    \ respectively. There is only one copy of the class variable and when any object\
    \ makes a change to a class variable, that change will be seen by all the other\
    \ instances. Object variables are owned by each individual object/instance of\
    \ the class. In this case, each object has its own copy of the field i.e. they\
    \ are not shared and are not related in any way to the field by the name in a\
    \ different instance. An example will make this easy to understand:\n\n```python\n\
    #!/usr/bin/python\n# Filename: objvar.py\nclass Robot:\n    '''Represents a robot,\
    \ with a name.'''\n\n    # A class variable, counting the number of robots\n \
    \   population = 0\n\n    def __init__(self, name):\n        '''Initializes the\
    \ data.'''\n        self.name = name\n        print('Initializing {}}'.format(self.name))\n\
    \n        # When this person is created, the robot\n        # adds to the population\n\
    \        Robot.population += 1\n\n    def __del__(self):\n        'I am dying.'\n\
    \        print('{0} is being destroyed!'.format(self.name))\n\n        Robot.population\
    \ -= 1\n\n        if Robot.population == 0:\n            print('{0} was the last\
    \ one.'.format(self.name))\n        else:\n            print('There are still\
    \ {0:d} robots').format(Robot.population)\n\n    def sayHi(self):\n        '''Greeting\
    \ by the robot.'''\n        print('Greetings, my masters call me {0}.'.format(self.name))\n\
    \n    @staticmethod\n    def howMany():\n        '''Prints the current population.'''\n\
    \        print('We have {0:d} robots.'.format(Robot.population))\n\ndroid1 = Robot('R2-D2')\n\
    droid1.sayHi()\nRobot.howMany()\n\ndroid2 = Robot('C-3P0')\ndroid2.sayHi()\nRobot.howMany()\n\
    \nprint(\"\\Robots can do some work here.\\n\")\n\nprint(\"\\Robots have finished\
    \ their work. So let's destroy them.\")\ndel droid1\ndel droid2\n\nRobot.howMany()\n\
