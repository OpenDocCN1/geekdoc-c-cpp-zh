    \ = length\n        self.atleast = atleast\n```\n\n```python\ntry:\n    text =\
    \ input('Enter something -> ')\n    if len(text) < 3:\n        raise ShortIntException(len(text),\
    \ 3)\n    # 其他工作可以在这里正常进行\nexcept EOFError:\n    print('Why did you do an EOF\
    \ on me?')\nexcept ShortIntException as ex:\n    print('IntException: The input\
    \ was {0} long, expected at least {1}'\\n\n        .format(ex.length, ex.atleast))\n\
    else:\n    print('No exception was raised.')\n```\n\nOutput:\n\n```\npython raising.py\n\
    enter something -> a\nIntException: The input was 1 long, expected at least 3\n\
    ```\n\n### 工作原理：\n\n输出应该与之前的示例相同。这里的不同在于我们使用了带有 `with` 语句的 `open` 函数——我们将文件的关闭交给\
    \ `with` 自动完成。\n\n## with 语句\n\n在 `try` 块中获取资源随后在 `finally` 块中释放资源是一种常见模式。因此，还有一个\
    \ `with` 语句能够以简洁的方式完成这一点：\n\n```python\n#!/usr/bin/python\n# Filename: \"poem.txt\"\
    \n\nwith open(\"poem.txt\") as f:\n    for line in f:\n        print(line, end='')\n\
    ```\n\n### 工作原理：\n\n输出应该与之前的示例相同。这里的不同在于我们使用了带有 `with` 语句的 `open` 函数——我们将文件的关闭交给\
    \ `with` 自动完成。\n\n在背后发生的是 `with` 语句使用了一种协议。它获取 `open` 语句返回的对象，在这种情况下我们称之为 \"thefile\"\
    。\n\n它在开始其下方的代码块之前调用 `thefile__enter__` 函数，并在完成代码块后始终调用 `thefile__exit__`。\n\n\
    因此，我们在 `finally` 块中编写的代码由 `__exit__` 方法自动处理。这帮助我们避免重复使用显式语句。\n\n## Finally\n\n\
    假设你正在读取一个文件。如何确保文件对象始终关闭？使用 `finally` 块。\n\n```python\n#!/usr/bin/python\n# Filename:\
    \ finally.py\n\nimport time\ntry:\n    f = open('poem.txt')\n    while True:\n\
    \        line = f.readline()\n        if len(line) == 0:\n            break\n\
    \        print(line, end='')\n        time.sleep(2)\nexcept KeyboardInterrupt:\n\
    \    print('You cancelled the operation.')\nfinally:\n    f.close()\n```\n\nOutput:\n\
    \n```\n$ python finally.py\nProgramming is fun\nYou cancelled the operation.\n\
    ```\n\n### 工作原理：\n\n通常的文件读取操作，但我们使用 `time.sleep` 函数每行人为地睡眠 2 秒，以便程序运行缓慢。当程序仍在运行时，按下\
    \ ctrl-c 中断/取消程序。观察到抛出了 `KeyboardInterrupt` 异常并且程序退出。然而，在程序退出之前，`finally` 子句会执行，文件对象会被关闭。\n\
    \n## 总结\n\n我们讨论了 `try..except` 和 `try..finally` 语句的使用。我们已经看到了如何创建自己的异常类型以及如何抛出异常。\n\
    \n接下来，我们将探索 Python 标准库。\n\n"
