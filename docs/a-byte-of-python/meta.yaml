    ## 示例代码


    学习编程语言的最佳方法是编写大量代码并阅读大量代码：


    - [PLEAC 项目](http://pleourceforge.net/pleac_python/index.html)

    - Rosetta 仓库](http://www.rosetacode.org/wiki/Category:Python)

    - java2s 上的 Python ](http://www.java2s.com/Code/Python/Catalog-Python-Examples.html)

    - [Python Cookbook](http://code.activestate.com/recipes/langs/python/) 是一份非常有价值的关于如何使用
    Python 特定问题的方案或技巧汇。这是每个 Python 用户的必读之。


    ## 问题与解答


    - Python 官方要做与不要](http://docs.python.org/dev/howto/doandet.html)

    - Python 常见](http://www.python.org/doc/faq/general/)

    - Norvig 的常见问题列表](http://norvig.com/python-iaq.html)

    - Python 面试问答](http://dev.fycenter.com/Interview-Questions/Python/index.html)

    - 带有 python 标签的 StackOverflow 问题](http://beta.stackoverflow.com/questions/tagged/python)


    ## 提示与技巧


    - Python 提示与技巧](http://www.siafoo.net/article/52)

    - 使用 Python 的高级软件工艺](http://ivory.idll.org/articles/advanced-swc/)

    - [Charming Python](http://gnosis.cx/publish/tech_index_cp.html) 是 David Mertz
    编写的一系列优秀的 Python 相关文章。


    ## 书籍、论文、教程、视频


    这本书之后的下一个逻辑步骤是阅读 Mark Pilgrim 编写的 [Dive Into Python](http://www.diveintopython.org)
    书，你可以很好地完全在线阅读。《Dive Into Python》详细探探讨了正则表达式、XML 处理、Web 服务、单元测试等主题。


    其他资源还有：


    - ShowMeDev Python 视频](http://showmedo.com/videos/python)

    - GoogleTechTalks Python 视频](http://youtube.com/results?search_query=googletealks+python)

    - Awaretek Python 教程综合列表](http://www.awaretek.com/tutorials.html)

    - The Effbot 的 Python Zone](http://effbot.org/zone/)

    - 每封 Python-URL 邮件中的链接](http://groups.google.com/group/comp.lang.python.announce/t/37de95ef0326293d)

    - Python 论文](http://pythonpapers.org)


    ## 讨论


    如果你被某个 Python 问题困住，且不知道问谁，那么 comp.lang.python 讨论组](http://groups.google.com/group/comp.lang.python/top)
    是提问问题的最佳地方。


    确保你已经做了作业并尝试过自己解决问题。


    ## 新闻


    如果你想知道 Python 世界的最新动态，请关注官方 Python Planet](http://planet.python.org) 和/或 [非官方
    Python Planet](http://www.planetpython.org)。


    ## 安装库


    [Python Package Index](http://pypi.python.org/pypi) 上有大量的开源库，你可以在程序中使用。


    要安装并使用这些库，你可以使用 Philip J. Eby 出色的 Easytool](http://peak.telecommunity.com/DevCenter/EasyInstall#using-easy-install)。


    ## 图形化软件


    假设你想用 Python 创建自己的图形化程序。这可以使用带有 Python 绑定的 GUI（图形用户界面）库来实现。绑定（Bindings）让你允许你用
    Python 编写程序，并使用本身用 C 或 C++ 或其他语言编写的库。


    使用 GUI 有很多选择：


    ### PyQt


    这是 Qt 工具包的 Python 绑定，它是 KDE 构建的基础。Qt 极其易用且功能强大强大，特别是通过 Qt Designer 和惊叹的 Qt 文档。如果你想创建开源（GPL
    许可）的软件，它是免费的；如果你想创建专有的闭源软件，则需要购买。从 Qt 4.5 开始，你也可以用它创建非 GPL 软件。要开始学习，请阅读 PyQt 教程](http://zetcode.com/tutorials/pyqt/)
    或 PyQt 书](http://www.qtrac.org/pyqtbook.html)。


    ### PyGTK


    这是 GTK+ 的 Python 绑定，它是 GNOME 构建的基础。GTK+ 在用法上有许多特性，但一旦你熟悉了，就可以快速创建 GUI 应用。Glade
    界面设计器是不可或少的。文档正在改进。GTK+ 在 Linux 上运行良好，但其 Windows 移植并不完整。你可以使用 GTK+ 创建免费以及专有的软件。要开始学习，请阅读
    PyGTK 教程](http://www.gtk.org/tutorial.html)。


    ### wxPython


    这是 wxWidgets 工具包的 Python 绑定。wxPython 有相应的学习曲线。然而，它非常有移植性，可以在 Linux、Windows、Mac
    甚至嵌入式平台上运行。wxPython 有许多 IDE 可用，包括 GUI 设计器以及 SPE (Stanis Python Editor)](http://spe.pycs.net/)


    ### Tkinter


    这是 Tcl 的 Python 绑定，它是 Tk GUI 构建的基础。Tkinter 随 Python 内置，因此非常容易开始创建 GUI 应用。Glade
    界面设计器是不可或少的。文档正在改进。Tkinter 在 Linux 上运行良好，但其 Windows 移植并不完整。你可以使用 Tkinter 创建免费以及专有的软件。要开始学习，请阅读
    Tkinter 教程](http://docs.python.org/3/tkinter/index.html)。


    '
