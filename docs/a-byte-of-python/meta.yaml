    ## Python in:Introduction


    ### Introduction


    Python is one of those rare languages which can claim to be both simple and powerful.
    You will find that you will be pleasantly surprised by how easy it is to concentrate
    on the solution to the problem rather than the syntax and structure of the language
    you are programming in.


    The official introduction to Python is:


    - Python is easy to learn, powerful programming language. It has efficient high-level
    data structures and a simple but effective approach to object-oriented programming.
    Python''s elegant syntax and dynamic typing, together with its interpreted nature,
    make it an ideal language for scripting and rapid application development in many
    areas on most platforms.


    I will discuss most of these features in more detail in the next section.


    ## Note


    - Guido van Rossum, the creator of the Python language, named the language after
    the BBC show "Monty Python''s Flying Circus". He doesn''t particularly like snakes
    that kill animals for feeding their long bodies around them and crushing them.


    ## Features of Python


    ### Simple


    Python is a simple and minimalistic language. Reading a good Python program feels
    almost like reading English, although very strict English! This pseudo-code nature
    of Python is one of its greatest strengths. It allows you to concentrate on the
    solution to the problem rather than the language itself.


    ### Easy to Learn


    As you see, Python is extremely easy to get started with. Python has an extraordinarily
    simple syntax, as already mentioned.


    ### Free and Open Source


    Python is an example of a FLOSS (Free/Libre and Open Source Software). In simple
    terms, you can freely distribute copies of this software, read its source code,
    make changes to it, and use pieces of it in new free programs. FLOSS is based
    on the concept of a community which shares knowledge. This is one of the reasons
    why Python is so good - it has been created and is constantly improved by a community
    who just want to use a better Python.


    ### High-level Language


    When you write programs in Python, you never need to worry about the low-level
    details such as managing the memory used by your program, etc.


    ### Portable


    Due to its open-source nature, Python has been ported to (i.e. changed to make
    it work on) many platforms. All your Python programs can work on any of these
    without requiring any changes at all if you are careful enough to avoid any system-dependent
    features.


    You can use Python on Linux, Windows, FreeBSD, Macintosh, Solaris, OS/2, Amiga,
    AROS/400, FreeBSD, OS/390, z/OS, Palm OS, QNX, VMS, Psion, Acorn RISC OS, VxWorks,
    PlayStation, Sharp Zaurik, Windows CE and PocketPC!


    ### Interpreted


    This requires a bit of explanation.


    A program written in a compiled language like C or C++ is converted from the source
    language i.e. C or C++ into a language that is executed by your computer (binary
    code i.e. 0s and 1s) using a compiler with various flags and options. When you
    run the program, the linker/loader software copies the program from the hard disk
    to memory and starts running it.


    Python, on the other hand, does not need compilation to binary. You just run the
    program directly from the source code. Internally, Python converts the source
    code into an intermediate form bytecodes and translates this into the language
    of your computer and runs it. All this, actually, makes Python much easier since
    you don''t have to worry about compiling the program, making sure that the proper
    libraries are linked and loaded, etc, etc. This also makes your programs much
    more portable, since you can just copy your Python program into another computer
    and it works!


    ### Object Oriented


    Python supports procedure-oriented programming as well as object-oriented programming.
    In procedure-oriented languages, the program is built around procedures or functions
    which are not reusable pieces of programs. In object-oriented languages, the program
    is built around objects which combine data and functionality. Python is a very
    powerful simplistic way of doing OOP, especially when compared to big languages
    like C++ or Java.


    ### Extensible


    If you need a critical piece of code to run very fast or want to have some piece
    of algorithm not to be open, you can code that part of your program in C or C++
    and then use it using your Python program.


    ### Embeddable


    You can embed Python within your C/C++ programs to give ''scripting'' capabilities
    for your program''s users.


    ### Extensive Libraries


    The Standard Library is huge indeed. It can help you do various things including
    regular expressions, documentation generation, unit testing, threading, databases,
    web browsers, CGI, FTP, email, XML, XML-RPC, HTML, WAV files, cryptography, GUI
    (graph user interfaces), Tk, and other system-dependent stuff. Remember, all this
    is available wherever Python is installed. This is called the ''Batteries Included''
    philosophy of Python.


    Besides the standard library, there are other high-quality libraries such as wxPython
    (http://www.wxpython.org), Twisted (http://www.twistedmatrix.com/products/twisted),
    Python Imaging Library (http://www.pythonware.com/products/pil/index.htm) and
    many more.


    ## Python in:Introduction


    Python is indeed an exciting and powerful language. It has the right combination
    of performance and features that make writing programs in Python both fun and
    easy.


    ## Why not Perl?


    If you didn''t know already, Perl is another extremely popular open source interpreted
    language.


    If you have ever writing a large program, you would have answered this question
    yourself! In other words, Perl programs are easy when they are small and excels
    at small scripts to ''get work done''. However, they quickly become unwieldy once
    you start writing programs.


    Compared to Perl, Python programs are definitely simpler, easier to write and
    hence more maintainable. I admire Perl and I use it on a daily basis whenever
    I write a program, I start thinking in terms of Python because Perl has undergone
    so many hacks and changes, that it feels like it is one big (or half of one) hack.
    Sadly, the upcoming Perl 6 does not seem to be making any improvements regarding
    this.


    The only and very significant advantage that I feel Perl is its huge CPAN (http://cpan.perl.org)
    library - Comprehensive Perl Archive Network. As the name suggests, this is a
    humongous collection of Perl modules and it is simply mind-boggling by its sheer
    size and depth - you can do virtually anything with a computer these modules.
    One of the reasons that Perl has more libraries than Python is that it has been
    around for a much longer time than Python. However this seems to be changing with
    the growing Python Index (http://pypi.python.org/pypi).


    ## Why not Ruby?


    If you didn''t know already, Ruby is another popular open source interpreted language.


    If you already like Ruby, then I would definitely recommend you to continue using
    it.


    For other people who have not used it and are trying to judge whether to learn
    Python or to learn Ruby, then I would recommend Ruby, purely from an ease-of-learning
    perspective. I personally found it hard to grep the Ruby language, but for people
    who understand Ruby, they praise the beauty of the language. Unfortunately, I
    am not as lucky.


