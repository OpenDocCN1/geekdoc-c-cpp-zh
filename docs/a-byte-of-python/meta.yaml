  md: "# Python en:Control Flow\n\nIn this program, we are still playing the guessing\
    \ game, but the advantage is that the user is allowed to keep guessing until he\
    \ guesses correctly - there is no need to repeatedly run the program for each\
    \ guess, as we have done in the previous section. This aptly demonstrates the\
    \ use of the while statement.\n\nWe move the in and if statements to inside the\
    \ while loop and set the variable running before the while loop. First, check\
    \ if the variable running is True and then proceed to execute the corresponding\
    \ while-block. After this block is executed, the condition is again checked in\
    \ this case is the running variable. If it is true, we execute the while-block\
    \ again, else we continue to execute the optional else-block and then continue\
    \ to the next statement.\n\nThe else block is executed when the while loop condition\
    \ becomes False - this may be the first time that the condition is checked. If\
    \ there is an else clause for a while loop, it is executed unless you break out\
    \ of the loop with a break statement.\n\nThe True and False are called Boolean\
    \ types and you can consider them to be equivalent to the value 1 and 0 respectively.\n\
    \n# Note for C/C++ Programmers\n\nRemember that you can have an else clause for\
    \ the while loop.\n\n# The for loop\n\nThe for..in statement is another looping\
    \ statement which iterates over a sequence of objects i. each item in a sequence.\
    \ We will see more sequences in detail in later chapters. What you need to know\
    \ right now is that a sequence is just an ordered collection of items.\n\nExample:\n\
    \n```\n#!/usr/bin/python\n# Filename: for.py\n\for i in range(1, 5):\n    print(i)\n\
    else:\n    print('The for loop is over')\n```\n\nOutput:\n\n```\n$ python for.py\n\
    1\n2\n3\n4\nThe for loop is over\n```\n\nHow It Works:\n\nIn this program, we\
    \ are printing a sequence of numbers. We generate this sequence of numbers using\
    \ the built-in range function.\n\nWhat we do here is supply it two numbers and\
    \ range returns a sequence of numbers starting from the first number and up to\
    \ the second number. For example, range(1,5)"
