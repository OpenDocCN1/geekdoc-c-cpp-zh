  md: '# Python:Data Structures


    # Summary


    We have explored the various built-in data structures of Python in detail. These
    structures will be essential for writing programs of reasonable size.


    Now that we have a lot of the basics of Python in place, we will next see how
    to design and write a real-world Python program.


    Previous Next


    Source: http://www.swaroopch.com/mediawiki/index.php?oldid=15882

    Contributors: Swaroop, 5 anonymous edits


    # Python en:Problem Solving


    We have explored various parts of the Python language and now we will take a look
    at how all these parts fit together, by designing and writing a program which
    does something useful. The idea is to learn how to write a Python script on your
    own.


    # The Problem


    The problem is "I want a program which creates a backup of all my important files".


    Although, this is a simple problem, there is not enough information for us to
    get started with the solution. A little more analysis is required. For example,
    how do we specify which files are to be backed up? How are they stored? Where
    are they stored?


    After analyzing the problem properly, we design our program. We make a list of
    things about how our program should work. In this case, I have created the following
    list on how I want to work. If you do the design, you may not come up with the
    same kind of analysis since every person has their own way of doing things, so
    that is perfectly okay.


    +   1. The files and directories to be backed up are specified in a list.

    2. The backup must be stored in a main backup directory.

    3. The files are backed up into a zip file.

    4. The name of the zip archive is the current date and time.

    5. We use the zip command available by default in any standard Linux/Unix distribution.
    Windows users can install (http://gnuwin32.sourceforge.net/downloads/zip.php)
    from the GnuWin32 project page (http://gnuwin32.sourceforge.net/packages/zip.zip)
    and add C:\Program Files\GnuWin32\bin to your system PATH variable, similar to
    what we did for recognizing the python command itself. Note that you can use any
    archiving command as long as it has a command line interface so that we can pass
    arguments to it from our script.'
