  - '[PAGE 1]


    # Python


    Choose your Python version:


    If you want to learn the current Python 2.x, read [1] or download the PDF [2]


    If you want to learn the new Python 3.0, read here or download the PDF [3]


    You can also buy a printed hardcopy. [4]


    # Introduction


    '' Byte of Python'' is a book on programming using the Python language. It serves
    as a tutorial or guide to the Python language for a beginner audience. If you
    all know about computers it is how to save text files, then this book is for you.


    This book is updated for the new Python 3.0. If you are looking for a tutorial
    on the current Python 2.x version, please download the previous revision of the
    book [5]. On the same note, if you''re wondering whether to learn Python 2.x or
    3.x, then read this article by James Bennett [6]


    # Who Reads ''A Byte of Python?''


    Here are what people are saying about the book:


    # Feedback From Readers


    +   This is the best tutorial I''ve ever seen! Thank you for your effort.


    +   - Walt Michalik (wmich50-at-theramp-dot-net)


    +   - You''ve made the best tutorial I''ve found on the Net. Great work. Thanks!


    +   - Joshua Robin (joshrob-at-poccta-dot-one-dot-pl)


    +   Hi, I''m from Dominican Republic. My name is Pavel, I recently read your book
    ''A Byte of Python'' and I consider it excellent!! :). I learnt from all the examples.
    Your book is of great help for newbies like me...


    +   - Pavel Simo (pavel-dot-simo-at-gmail-dot-com)


    +   I recently finished reading Byte of Python, and I thought I really ought thank
    you. It was very sad to read the final pages as I now have to go back to dull,
    tedious or etc manuals for learning about python. I really appreciate your book


    +   - Samuel Young (sy-one-three-seven-at-gmail-dot-com)


    Dear Swaroop, I am taking a class from an instructor that has no interest in teaching.
    We are using Learning Python, second edition, by O''Reilly. It is not a text for
    beginner without any programming knowledge, and an instructor should be working
    in another field. Thank you very much for your book, without it I would be clueless
    about Python and programming. Thanks you a million, you are able to ''break the
    message down'' to a level that beginners understand and not everyone can.


    +   - Joseph Duarte (jduarte1-at-cfl-dot-rr-dot-com)


    I love your book! It is the greatest Python tutorial ever, and a very useful reference.
    Brilliant, a true masterpiece! Keep up the good work!


    +   - Chris-André Sommersett'
