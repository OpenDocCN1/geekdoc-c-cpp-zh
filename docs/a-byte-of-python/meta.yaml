    \ 3\nTrue\n```\n\n其工作原理：\n\n`sys` 模块有一个 `version_info` 元组，它提供了版本信息。第一个条目是主版本。我们可以通过检查它来例如确保程序只在\
    \ Python 3.0 下运行。\n\n```python\n#!/usr/bin/python\n# Filename: versioncheck.py\n\
