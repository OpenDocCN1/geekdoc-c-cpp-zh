  md: "# Python:Exceptions\n\n(Cleaning up: Closed the file)\n\nHow It Works:\n\n\
    The usual file-reading stuff, but we have arbitrarily introduced sleeping for\
    \ 2 seconds after printing each line using the time.sleep function so that the\
    \ program runs slowly after (Python is very by nature). When the program is still\
    \ running, press ctrl-c to interrupt/cancel the program.\n\nObserve that the KeyboardInterrupt\
    \ exception is thrown and the program quits. However, before the program exits,\
    \ the finally clause is executed and the file object is always closed.\n\n# The\
    \ with statement\n\nAcquiring a resource in the try block and subsequently releasing\
    \ the resource in the finally block is a common pattern. Hence, there is also\
    \ a with statement that enables this to be done in a clean manner:\n\n```\n#!/usr/bin/python\n\
    # Filename: \"poem.txt\"\n\nwith open(\"poem.txt\") as f:\n    for line in f:\n\
    \        print(line, end='')\n```\n\nHow It Works:\n\nThe output should be the\
    \ same as the previous example. The difference here is that we are using the open\
    \ function with the with statement - we leave the closing of the file to be done\
    \ automatically by with.\n\nWhat happens behind the scenes is that there is a\
    \ protocol used by the with statement. It fetches the object returned by the open\
    \ statement, let's call it \"thefile\" in this case.\n\nIt calls the thefile.__enter__\
    \ function before starting the block of code under it and always calls thefile.__exit__\
    \ after finishing the block of code.\n\nSo the code that we have written in a\
    \ finally block is taken of care automatically by the __exit__ method. This is\
    \ what helps us to avoid having to use explicit statements repeatedly.\n\nMore\
    \ discussion on this topic is beyond scope of this book, please refer PEP 343\
    \ (https://www.python.org/dev/peps/pep-0343/) for comprehensive explanation.\n\
    \n# Summary\n\nWe have discussed the usage of the try..except and try..finally\
    \ statements. We have seen how to create our exception types and how to raise\
    \ exceptions as well.\n\nNext, we will explore the Python Standard Library.\n\n\
