    \ LAMP 栈中的 M，该栈运行着互联网上绝大多数的网站。[ MySQL (http://www.mysql.com) ]\n\n- VLC 器。这是一个视频播放器，可以将任何\
    \ Div 转换为 MP3 或 Ogg，并将 VCD 和 DVD 转换为……谁说开源不是很有趣的？[ VLC 播放器 (http://www.videolan.org/vlc/)\
    \ ]\n\n- GeekBox 是一个 Linux 发行版，其设计目标是让你在从 CD 启动后立即播放电影！[ GeekBox (http://www.geebox.org/en/start.html)\
    \ ]\n\n这个列表旨在让你有一个大致的了解——世界上还有许多优秀的 FLOSS，例如 Perl 语言、PHP 语言、用于网站的 Drupal 内容管理系统、PostgreSQL\
    \ 数据库服务器、TORCS 赛车游戏、KDevelop 1DE、Xine 电影播放器、VIM 编辑器、Quantum+、Banshee 播放器、GIMP\
    \ 图像编辑程序等等。列表还可以继续下去。\n\n获取 FLOSS 世界的最新动态，请查看以下网站：\n\n- linux.com (http://www.linux.com)\n\
    \n- LinuxToday (http://www.linuxtoday.com)\n\n- NewsForge (http://www.newsforge.com)\n\
    \n- DistroWatch (http://www.distrowatch.com)\n\n访问以下网站获取更多关于 FLOSS 的信息：\n\n- SourceForge\
    \ (http://www.sourceforge.net)\n\n- FreshMeat (http://www.freshmeat.net)\n\n所以，去探索\
    \ FLOSS 广阔、免费且开源的世界吧！\n\n上一页 下一页\n\n来源：http://www.swaroopch.com/mediawiki/index.php?oldid=1580\n\
    \n贡献者：Swaroop，1 位匿名编辑者\n\n## Python 英文：附录 关于\n\n## 志后\n\n我在创作这本书时使用的几乎所有软件都是免费的开源软件。\n\
    \n## 书的诞生\n\n在本书的第一稿中，我使用 Red Hat 9.0 Linux 作为设置的基础；在第六稿中，我使用 Fedora Core 3 Linux\
    \ 作为设置的基础。\n\n起初，我使用 KWord 来撰写这本书（如前言中的“历史课程”所示）。\n\n## 青春时代\n\n后来，我切换到使用 Kate\
    \ 编写 DocBook XML，但我发现它太繁琐了。于是，我切换到了 OpenOffice，它在格式控制和 PDF 生成方面提供的水平非常出色，但它从文档生成的\
    \ HTML 却粗糙。\n\n最后，我发现了 XEmacs，在决定这种格式是长期解决方案后，我用 DocBook XML（再次）从头重写了这本书。\n\n\
    在第六稿中，我决定使用 Quanta+ 进行所有的编辑。我使用了 Fedora Core 3 Linux 自带的标准 XSL 样式表。也使用了标准的默认字体。然而，我编写了一个\
    \ CSS 文档来为 HTML 页面添加颜色和样式。我还编写了一个原始的词法分析器（当然是用 Python ），它可以自动为所有程序列表提供语法高亮。\n\n\
    ## 现在\n\n对于这第七稿，我使用 MediaWiki (http://www.mediawiki.org) 作为设置的基础 (http://www.swaroopch.com/notes/)。现在我在在线上编辑一切，读者可以直接在\
    \ wiki 网站内进行阅读/编辑/讨论。\n\n我仍然使用 Vim 进行编辑任务，以及 Firefox 的 ViewSource 扩展 (https://addons.mozilla.org/en-US/firefox/addon/394)，该扩展与\
    \ Vim 集成。\n\n## Python 英文：附录 关于\n\n## 关于作者\n\nhttp://www.swaroop.com/about/\n\n\
