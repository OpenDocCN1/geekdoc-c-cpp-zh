    \ of the object. The interesting part is that you will have eval(repr(object))\
    \ == object most of the time.\n\n```\n>>> i = []\n>>> i.append('item')\n>>> repr(i)\n\
    \"['item']\"\n['item']\n>>> eval(repr(i)) == i\nTrue\n```\n\nBasically, the repr\
    \ function is used to obtain a printable representation of the object. You can\
    \ control what your classes return for the repr function by defining the __repr__\
    \ in your class.\n\n# Summary\n\nWe have covered some more features of Python\
    \ in this chapter and yet we haven't covered all the features of Python. However,\
    \ at this stage, we have covered most of what you are ever going to use in practice.\
    \ This is sufficient for you to get started with whatever programs you are going\
    \ to create.\n\nNext, we will discuss how to explore Python further."
