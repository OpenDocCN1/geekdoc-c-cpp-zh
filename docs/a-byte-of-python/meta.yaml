  md: '# Python:Introduction


    Python is indeed an exciting and powerful language. It has the right combination
    of performance and features that make writing programs in Python both fun and
    easy.


    # Why not Perl?


    If you didn''t know already, Perl is another extremely popular open source interpreted
    programming language.


    If you have ever writing a large program in Perl, you would have answered this
    question yourself! In other words, Perl programs are easy when they are small
    and excels at small hacks and scripts to ''get work done''. However, they quickly
    become unwieldy once you start writing bigger programs and I am speaking this
    of my experience writing large programs at Yahoo!


    Compared to Perl, Python programs are definitely simpler, easier to write and
    hence more maintainable. I admire Perl and I use it on a daily basis for various
    things whenever I write a program, I start thinking in terms of Python because
    it becomes so natural for me. Perl has undergone so many hacks and changes, that
    it feels like it is one big (or half of one) hack. Sadly, the upcoming Perl 6
    does not seem to be making any improvements regarding this.


    The only and very significant advantage that I feel Perl, is its huge CPAN (http://cpan.perl.org)
    library - The Comprehensive Perl Archive Network. As the name suggests, this is
    a humongous collection of Perl modules and it is simply mind-boggling by its sheer
    size and depth - you can do virtually anything with a computer using these modules.
    One of the reasons that Perl has more libraries than Python is that it has been
    around for a much longer time than Python. However this seems to be changing with
    the growing Python Package Index (http://pypi.python.org/pypi).


    # Why not Ruby?


    If you didn''t know already, Ruby is another popular open source interpreted language.


    If you already like use Ruby, then I would definitely recommend you to continue
    using it.


    For other people who have not used it and are trying to judge whether to learn
    Python or to learn Ruby, then I would recommend Ruby, purely from an ease-of-learning
    perspective. I personally found it hard to grep the Ruby language, but for people
    who understand Ruby, they praise the beauty of the language. Unfortunately, I
    am not as lucky.


    # What Programmers Say


    You may find interesting to read what great hackers ESR have to say about Python:


    +   - Eric S. Raymond is the author of "The Cathedral and the Bazaar", and is
    also the person who coined the term Open Source. He says that Python has become
    his favorite programming language (http://www.linuxjournal.com/article.php?sid=3882).
    This article was the real inspiration for my first brush with Python.

    - Bruce Eckel is the author of the famous Thinking in Java and Thinking in C++
    books. He says that no language has made him more productive than Python. He says
    that Python is perhaps the only language that focuses on making easier for the'
