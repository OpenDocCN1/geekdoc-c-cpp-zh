- md: "\n# Python en:Control Flow\n\naware of all these initially, but after that,\
    \ you will become comfortable with it and it'll feel\n'natural' to you.\n\n# Note\
    \ for C/C+ Programmers\n\nThere is no switch statement in Python. You can use\
    \ an if..elif..else statement to\ndo the same thing (and in some cases, you use\
    \ a dictionary to do it quickly)\n\n# The while Statement\n\nThe while statement\
    \ allows you to repeatedly execute a block of statements as long as a\ncondition\
    \ is true. A while statement is an example of what is called a looping statement.\n\
    while statement can have an optional else clause.\n\nExample:\n\n```\n#!/usr/bin/python\n\
    # Filename: while.py\n\nnumber = 23\nrunning = True\n\nwhile running:\n    guess\
    \ = int(input('Enter an integer : '))\n\n    if guess == number:\n        print('Congratulations,\
    \ you guessed it.')\n        running = False # this causes the while loop to stop\n\
    \    elif guess < number:\n        print('No, it is a little higher than that.')\n\
    \    else:\n        print('No, it is a little lower than that.')\n\nprint('The\
    \ while loop is over.')\n# Do anything else you want to do here\n```\n\n```\n\
    $ python while.py\nEnter an integer : 50\nNo, it is a little lower than that.\n\
    Enter an integer : 22\nNo, it is a little higher than that.\nEnter an integer\
    \ : 23\nCongratulations, you guessed it.\nThe while loop is over.\nDone\n```\n\
    \nHow It Works:\n\nIn this program, we are still playing the guessing game, but\
    \ the advantage is that the user is allowed to keep guessing until he guesses\
    \ correctly - there is no need to repeatedly run the program for each guess, as\
    \ we have done in the previous section. This aptly demonstrates the use of the\
    \ while statement.\n\nWe move the in and if statements to inside the while loop\
    \ and set the variable running before the while loop. First, check if the variable\
    \ running is True and then proceed to execute the corresponding while-block. After\
    \ this block is executed, the condition is again checked in this case is the running\
    \ variable. If it is true, we execute the while-block again, else we continue\
    \ to execute the optional else-block and then continue to the next statement.\n\
    \nThe else block is executed when the while loop condition becomes False - this\
    \ may be the first time that the condition is checked. If there is an else clause\
    \ for a while loop, it is executed unless you break out of the loop with a break\
    \ statement.\n\nThe True and False are called Boolean types and you can consider\
    \ them to be equivalent to the value 1 and 0 respectively.\n\n# Note for C/C++\
    \ Programmers\n\nRemember that you can have an else clause for the while loop.\n\
    \n# The for loop\n\nThe for..in statement is another looping statement which iterates\
    \ over a sequence of objects i. each item in a sequence. We will see more sequences\
    \ in detail in later chapters. What you need to know right now is that a sequence\
    \ is just an ordered collection of items.\n\nExample:\n\n```\n#!/usr/bin/python\n\
    # Filename: for.py\nfor i in range(1, 5):\n    print(i)\nelse:\n    print('The\
    \ for loop is over')\n```\n\nOutput:\n\n```\n$ python for.py\n1\n2\n3\n4\nThe\
    \ for loop is over\n```\n\nHow It Works:\n\nIn this program, we are printing a\
    \ sequence of numbers. We generate this sequence of numbers using the built-in\
    \ range function.\n\nWhat we do here is supply it two numbers and range returns\
    \ a sequence of numbers starting from the first number and up to the second number.\
    \ For example, range(1,5) gives the sequence [1, 2, 3, 4]. By default, range takes\
    \ a step count of 1. If we supply a third number to range, then that becomes the\
    \ step count. For example, range(1,5,2) gives [1,3]. Remember that the range extends\
    \ up to the second number i.e. does not include the second number.\n\nThe for\
    \ loop iterates over this range - for i in range(1,5) is equivalent to for i in\
    \ [1, 2, 3, 4] which is assigning each number (or object) to the sequence to i,\
    \ one and then executing the block of statements for each value of i. In this\
    \ case, we just print the value in the block of statements.\n\nRemember that the\
    \ else part is optional. When included, it is always executed once after the loop\
    \ for unless a break statement is encountered.\n\nRemember that the for.. loop\
    \ works for any sequence. Here, we have a list of numbers generated by the built-in\
    \ range function, but in general we can use any kind of sequence or any kind of\
    \ objects! We will explore this detail in later chapters.\n\nNote for C/C++/Java/C#\
    \ Programmers\n\nThe Python for loop is radically different from the C/C++ loop.\
    \ C# programmers will note that the for loop in Python is similar to the foreach\
    \ loop in C#, Java programmers will note that the same is similar to for (int\
    \ : IntArray) in Java 1.5.\n\nIn C/C++, if you want to write for (int i = 0; i\
    \ < 5; i++), then in Python you write just for i in range(0,5). As you can see,\
    \ the for is simpler, more expressive and less prone to error.\n\n# The break\
    \ Statement\n\nThe break statement is used to break out of a loop statement i.e.\
    \ stop the execution of a looping statement, if the loop condition has not become\
    \ False or the sequence of items has been completely iterated.\n\nAn important\
    \ note is that if you break out of for or while loop, any corresponding loop else\
    \ block is not executed.\n\nExample:\n\n```\n#!usr/bin/python\n# Filename: break.py\n\
    ```\n\n```\nwhile True:\n    s = (input('Enter something : '))\n    if s == 'quit':\n\
    \        break\n    print('Length of the string is', len(s))\nprint('Done')\n\
    ```\n\nOutput:\n\n```\n$ python break.py\nEnter something : Programming is fun\n\
    Length of the string is 18\nEnter something : When the work is done\nLength of\
    \ the string is 21\n```\n\n```\nEnter something : if you wanna make your work\
    \ also fun:\nLength of the string is 37\nEnter something :  use Python!\nLength\
    \ of the string is 12\nEnter something :  quit\nDone\n```\n\nHow It Works:\n\n\
    In this program, we repeatedly take the user's input and print the length of each\
    \ input time. We are providing a special condition to stop the program by checking\
    \ if the user is 'quit'. We stop the program by breaking out of the loop and reach\
    \ the end of the program.\n\nThe length of the input string can be found using\
    \ the built-in len function. Remember that the break statement can be used with\
    \ the loop for well.\n\n# Swaroop's: Poetic Python\n\nThe input I have used is\
    \ a mini poem I have written Swaroop's Poetic Python:\n\n```\nProgramming is fun\n\
    When the work is done\nif you make your work also fun:\nuse Python!\n```\n\n#\
    \ The continue Statement\n\nThe continue statement is used to tell Python to skip\
    \ the rest of the statements in the current loop block and to continue to the\
    \ next iteration of the loop.\n\nExample:\n\n```\n#!/usr/bin/python\n# Filename:\
    \ continue.py\n```\n\n```\nwhile True:\n    s = input('Enter something : ')\n\
    \    if s == 'quit':\n        break\n    if len(s) < 3:\n        print('Too small')\n\
    \        continue\n    print('Input is of sufficient length')\n    # Do other\
    \ kinds of processing here...\n```\n\nOutput:\n\n```\n$ python test.py\nEnter\
    \ something : a\nToo small\nEnter something : 12\nToo small\n```\n\n```\nEnter\
    \ something : abc\nInput is of sufficient length\nEnter something : quit\n```\n\
    \nHow It Works:\n this program, we accept input from the user, but we process\
    \ them only if they are at least 3 characters long. So, we use the built-in len\
    \ function to get the length and if the length is less than 3, we skip the rest\
    \ of the statements in the block using the continue statement. Otherwise, the\
    \ rest of the statements in the loop are executed and we can do any kind of processing\
    \ we want to do here.\nNote that the continue statement works with for loop well.\n\
    \n# Summary\n\nWe have seen how to use the three control flow statements - if,\
    \ while and for along with their break and continue statements. These are some\
    \ of the most used parts of Python and hence, becoming comfortable with them is\
    \ essential.\nNext, we will see how to create and use functions.\n\n# Python en:Functions\n\
    \n# Introduction\n\nFunctions are reusable pieces of programs. They allow you\
    \ to give a name to a block of statements and you can run that block using that\
    \ name anywhere in your program and any number of times. This is known as calling\
    \ the function. We have already used many built-in functions such as the len and\
    \ range.\nThe concept is probably the most important building block of any non-trivial\
    \ software (in any programming language), we will explore various aspects of functions\
    \ in this chapter.\nFunctions are defined using the keyword. This is followed\
    \ by an identifier name for the function followed by a pair of parentheses which\
    \ may enclose names of variables and the line ends with a colon. Next follows\
    \ the block of statements that are part of the function. An example will show\
    \ that this is actually very simple:\n\n```\n#!/usr/bin/python\n# Filename: function1.py\n\
    \ndef sayHello():\n    print('Hello World!') # block belonging to the function\n\
    # End of function\n```\n"
  mdcn: "\n\n# Python 英文：控制流\n\n起初可能并不熟悉这些内容，但之后你将逐渐习惯它们，并觉得它们对你来说很“自然”。\n\n# 给 C/C++\
    \ 程序员的说明\n\nPython 中没有 `switch` 语句。你可以使用 `if..elif..else` 语句来实现相同的功能（在某些情况下，你也可以使用字典来快速实现）。\n\
    \n# while 语句\n\n`while` 语句允许你在条件为真时重复执行一个语句块。`while` 语句是所谓的循环语句的一个示例。`while` 语句可以带有一个可选的\
    \ `else` 子句。\n\n示例：\n\n```python\n#!/usr/bin/python\n# Filename: while.py\n\n\
    number = 23\nrunning = True\n\nwhile running:\n    guess = int(input('Enter an\
    \ integer : '))\n\n    if guess == number:\n        print('Congratulations, you\
    \ guessed it.')\n        running = False # 这会导致 while 循环停止\n    elif guess < number:\n\
    \        print('No, it is a little higher than that.')\n    else:\n        print('No,\
    \ it is a little lower than that.')\n\nprint('The while loop is over.')\n# 在此处进行任何你想做的其他操作\n\
    ```\n\n```bash\n$ python while.py\nEnter an integer : 50\nNo, it is a little lower\
    \ than that.\nEnter an integer : 22\nNo, it is a little higher than that.\nEnter\
    \ an integer : 23\nCongratulations, you guessed it.\nThe while loop is over.\n\
    Done\n```\n\n工作原理：\n\n在这个程序中，我们仍然在玩猜游戏，但优势是允许用户一直猜，直到猜对为止——不需要像我们在上一节中的那样为每次猜测都反复运行程序。这恰恰演示了\
    \ `while` 语句的使用。\n\n我们将 `input` 和 `if` 语句移动到 `while` 循环内部，并在 `while` 循环之前设置变量\
    \ `running`。首先检查变量 `running` 是否为 `True`，然后执行相应的 `while` 块。在执行完该块后，再次检查条件（在本例中是变量\
    \ `running`）。如果为真，我们再次执行 `while` 块；否则继续执行可选的 `else` 块，然后继续执行下一个语句。\n\n当 `while`\
    \ 循环条件变为 `False` 时，会执行 `else` 块——这可能是第一次检查条件。如果 `while` 循环有一个 `else` 子句，除非你使用\
    \ `break` 语句跳出循环，否则它会被执行。\n\n`True` 和 `False` 被称为布尔类型，你可以将它们分别等同于值 `1` 和 `0`。\n\
    \n# 给 C/C++ 程序员的说明\n\n记住你可以为 `while` 循环编写一个 `else` 子句。\n\n# for 循环\n\n`for..in`\
    \ 语句是另一种循环语句，用于遍历对象序列，即序列中的每个项。我们将在稍后的章节中详细介绍更多序列。你现在需要知道的是序列仅仅是项的有序集合。\n\n示例：\n\
    \n```python\n#!/usr/bin/python\n# Filename: for.py\nfor i in range(1, 5):\n  \
    \  print(i)\nelse:\n    print('The for loop is over')\n```\n\n输出：\n\n```bash\n\
    $ python for.py\n1\n2\n3\n4\nThe for loop is over\n```\n\n工作原理：\n\n在这个程序中，我们正在打印一个数字序列。我们使用内置的\
    \ `range` 函数生成这个数字序列。\n\n在这里我们做的是提供两个数字，`range` 返回一个从第一个数字开始到第二个数字之前的数字序列。例如，`range(1,5)`\
    \ 序列 `[1, 2, 3, 4]`。默认情况下，`range` 的步长为 `1`。如果我们向 `range` 提供第三个数字，那么它将成为步长。例如，`range(1,5,2)`\
    \ 给出 `[1,3]`。记住 `range` 扩展到第二个数字，即不包含第二个数字。\n\n`for` 循环遍历这个范围——`for i in range(1,5)`\
    \ 等同于 `for i in [1, 2, 3, 4]`，这会将序列中的每个数字（或对象）赋值给 `i`，然后为 `i` 的每个值执行语句块。在这种情况下，我们只是在语句块中打印该值。\n\
    \n记住 `else` 部分是可选的。当包含它时，在循环结束后总是执行一次，除非遇到 `break` 语句。\n\n记住 `for..` 循环适用于任何序列。在这里，我们有一个由内置\
    \ `range` 函数生成的数字列表，但通常可以使用任何类型的序列或任何类型的对象！我们将在稍后的章节中探索这些细节。\n\n# 给 C/C++/Java/C#\
    \ 程序员的说明\n\nPython 的 `for` 循环与 C/C++ 的循环完全不同。C# 程序员会注意到 Python 的 `for` 循环类似于 C#\
    \ 中的 `foreach` 循环；Java 程序员会注意到它与 Java 1.5 中的 `for (int : IntArray)` 相似。\n\n在 C/C++\
    \ 中，如果你想写 `for (int i = 0; i < 5; i++)`，那么在 Python 中只需写 `for i in range(0,5)`。正如你所看到的，`for`\
    \ 更简单、更具表现力，且不易出错。\n\n# break 语句\n\n`break` 语句用于跳出循环语句，即如果循环条件尚未变为 `False` 或项序列未完全迭代，则停止循环语句的执行。\n\
    \n一个重要的点是，如果你跳出了 `for` 或 `while` 循环，任何相应的循环 `else` 块将不会被执行。\n\n示例：\n\n```python\n\
    #!/usr/bin/python\n# Filename: break.py\n\nwhile True:\n    s = input('Enter something\
    \ : ')\n    if s == 'quit':\n        break\n    print('You entered:', s)\n```\n\
    \n输出：\n\n```bash\n$ python break.py\nEnter something : hello\nYou entered: hello\n\
    Enter something : world\nYou entered: world\nEnter something : quit\n```\n\n工作原理：\n\
    \n在这个程序中，我们仍然在玩猜游戏，但优势是允许用户一直猜，直到猜对为止——不需要像我们在上一节中的那样为每次猜测都反复运行程序。这恰恰演示了 `break`\
    \ 语句的使用。\n\n# continue 语句\n\n`continue` 语句用于跳过循环的剩余部分，如果循环条件尚未变为 `False` 或项序列未完全迭代。\n\
    \n示例：\n\n```python\n#!/usr/bin/python\n# Filename: continue.py\n\nwhile True:\n\
    \    s = input('Enter something : ')\n    if s == 'quit':\n        break\n   \
    \ if len(s) < 3:\n        print('Too small')\n        continue\n    print('Input\
    \ is sufficient length')\n```\n\n输出：\n\n```bash\n$ python continue.py\nEnter something\
    \ : a\nToo small\nEnter something : ab\nToo small\nEnter something : abc\nInput\
    \ is sufficient length\nEnter something : quit\n```\n\n工作原理：\n\n在这个程序中，我们接受用户的输入，但只有当长度至少为\
    \ 3 个字符时才进行处理。因此，我们使用内置的 `len` 函数获取长度，如果长度小于 3，我们使用 `continue` 语句跳过块中的剩余语句；否则，执行循环的其余语句，我们可以在此处进行任何你想做的其他操作。\n\
    \n记住 `continue` 语句适用于 `for` 循环。\n\n"
