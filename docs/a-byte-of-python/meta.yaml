    # Python en:Preface


    Python is probably one of the few programming languages which is both simple and
    powerful. It is good for both beginners as well as experts, and more importantly,
    is fun to program with. This book aims to help you learn this wonderful language
    and how to get things done quickly and painlessly in effect ''The Perfect Anti-venom
    to your programming problems''.


    # Who This Book Is For


    This book serves as a guide or tutorial to the Python programming language. It
    is mainly targeted at newbies. It is useful for experienced programmers as well.


    The aim is that if you know how computers is how to save files, then you can learn
    Python from this book. If you have previous programming experience, then you can
    also learn Python from this book.


    If you have previous programming experience, you will be interested in the differences
    between Python and your favorite programming language - I have highlighted many
    such differences. A little warning though, Python is soon becoming your favorite
    programming language!


    # History Lesson


    I started with Python when I needed to write an installer for a software I had
    written ''Diamond'' so that I could make the installation easy. I had to choose
    between Python and Perl bindings for the Qt library. I did some research on the
    web and I came across an article Eric S. Raymond, the famous and respected hacker,
    talked about how Python has become favorite programming compared to Perl-Qt. So,
    I decided that Python was the language for me.


    Then, starting search for a good book on Python. I couldn''t find any! I did some
    O''Reilly''s books but they were either too expensive or more like a reference
    manual than a guide. I settled for the documentation that came with Python. However,
    it was too brief and small. It did give a good idea about Python but was not complete.
    I managed with since I had previous programming experience, but it was unsuitable
    for newbies.


    About six months after my first brush with Python, I installed (the) latest Red
    Hat 9 Linux and I was playing around with KWord. I got excited about it and suddenly
    got the idea of writing stuff on Python. I started writing a few pages but it
    quickly became 30 pages long. Then, I became serious about making it more useful
    in a book form. After a lot of rewrites, it has reached a stage where it becomes
    a useful guide to learning the Python language. I consider this book to be my
    contribution and tribute to the open source community.'
