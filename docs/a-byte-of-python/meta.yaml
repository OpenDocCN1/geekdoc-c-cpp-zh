  md: "# Python en:Exceptions\n\nclause can handle a single specified error or exception,\
    \ or a parenthesized list of errors/exceptions. If no names of errors or exceptions\
    \ are supplied, it will handle all errors and exceptions.\n\nNote that there has\
    \ to be at least one except clause associated with every try clause. Otherwise,\
    \ what's the point of having a try block?\n\nIf any error or exception is not\
    \ handled, the default Python handler is called which stops the execution of the\
    \ program and prints an error message. We have already seen this in action above.\n\
    \nYou can also have an else clause associated with a try..except block. The else\
    \ clause is executed if no exception occurs.\n\nIn the next example, we will also\
    \ see how to get the exception object so that we can retrieve additional information.\n\
    \n# Raising Exceptions\n\nYou can raise exceptions using the raise statement by\
    \ providing the name of the error/exception and the exception object that is to\
    \ be thron.\n\nThe error or exception that you can arise be class which directly\
    \ or indirectly be a derived class of the Exception class.\n\n```\n#!/usr/bin/python\n\
    # Filename: raising.py\n\nclass ShortIntException(Exception):\n    '''A user-defined\
    \ exception class.'''\n    def __init__(self, length, atleast):\n        self.length\
    \ = length\n        self.atleast = atleast\n```\n\n```\ntry:\n    text = input('Enter\
    \ something -> ')\n    if len(text) < 3:\n        raise ShortIntException(len(text),\
    \ 3)\n    # Other work can continue as usual here\nexcept EOFError:\n    print('Why\
    \ did you do an EOF on me?')\nexcept ShortIntException as ex:\n    print('IntException:\
    \ The input was {0} long, expected at least {1}'\\n'\n        .format(ex.length,\
    \ ex.atleast))\nelse:\n    print('No exception was raised.')\n```\n\nOutput:\n\
    \n```\npython raising.py\nter something -> a\n```"
