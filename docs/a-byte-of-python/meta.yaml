  md: "# The assert statement\n\nThe assert statement is used to assert that something\
    \ is true. For example, if you are very sure that you will have at least one element\
    \ in a list you are using and want to check this, and raise an error if it is\
    \ not true, then assert statement is ideal in this situation. When the assert\
    \ statement fails, an AssertionError is raised.\n\n```\n>>> mylist = ['item']\n\
    >>> assert len(mylist) >= 1\n>>> mylist.pop()\n'item'\n>>> mylist\n[]\n>>> assert\
    \ len(mylist) >= 1\nTraceback (most recent call last):\n  File \"<stdin>\", line\
    \ 1, in <module>\nAssertionError\n```\n\nThe assert statement should be used judiciously.\
    \ Most of the time, it is better to catch exceptions, either handle the problem\
    \ or display an error message to the user and quit.\n\n# The repr function\n\n\
    The repr function is used to obtain a canonical string representation of the object.\
    \ The interesting part is that you will have eval(repr(object)) == object most\
    \ of the time.\n\n```\n>>> i = []\n>>> i.append('item')\n>>> repr(i)\n\"['item']\"\
    \n['item']\n>>> eval(repr(i)) == i\nTrue\n```\n\nBasically, the repr function\
    \ is used to obtain a printable representation of the object. You can control\
    \ what your classes return for the repr function by defining the __repr__ in your\
    \ class.\n\n# Summary\n\nWe have covered some more features of Python in this\
    \ chapter and yet we haven't covered all the features of Python. However, at this\
    \ stage, we have covered most of what you are ever going to use in practice. This\
    \ is sufficient for you to get started with whatever programs you are going to\
    \ create.\n\nNext, we will discuss how to explore Python further."
