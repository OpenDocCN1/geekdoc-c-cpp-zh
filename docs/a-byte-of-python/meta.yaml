  md: 'Python:en: Next


    # Discussion


    If you are stuck with a Python problem, and don''t know whom to ask, then the
    comp.lang.python discussion group (http://groups.google.com/group/comp.lang.python/

    top) is the best place to ask your question.


    Make sure you do your homework and have tried solving the problem yourself.


    # News


    If you want to know what is latest in the world of Python, then follow the Official
    Python Planet (http://planet.python.org) and/or the Unofficial Python Planet (http://www.

    planetpython.org).


    # Installing libraries


    There are a huge number of open source libraries at the Python Package Index (http://

    pypi.python.org/pypi) which you can use in your programs.


    To install and use these libraries, you can use Philip J. Eby''s excellent Easytool

    (http://peak.telecommunity.com/DevCenter/EasyInstall#using-easy-install).


    # Graphical Software


    Suppose you want to create your own graphical programs using Python. This can
    be done

    using a GUI (Graphical User Interface) library with your Python bindings. Bindings
    are

    what allow you to write programs in Python and use the libraries which are themselves

    written in C or C++ or other languages.


    There are lots of choices for GUI using:


    # PyQt


    This is the Python binding for the Qt toolkit which is the foundation upon which
    the

    KDE is built. Qt is extremely easy to use and very powerful especially by the
    Qt

    Designer and the amazing Qt documentation. Qt is free if you want to create open

    source (GPL)ed and you need to buy it if you want to create proprietary

    closed software. Starting with Qt 4.5 you can use to create non-GPL software

    as well. To get started, read the PyQt tutorial (http://zetcode.com/tutorials/pyqt/)

    or the PyQt book (http://www.qtrac.org/pyqtbook.html).


    # PyGTK


    This is the Python binding for GTK+ which is the foundation upon which the

    GNOME is built. GTK+ has many quirks in usage but once you become comfortable,

    you can create GUI apps fast. The Glade interface designer is indispensable.

    The documentation is to improve. GTK+ works well on Linux but its port to

    Windows is incomplete. You can create free as well as proprietary software using\GTK+.
    To get started, read the PyGTK tutorial (http://www.gtk.org/tutorial.html).


    # wxPython


    This is the Python bindings for the wxWidgets toolkit. wxPython has a learning
    curve

    associated with it. However, it is very portable and runs on Linux, Windows, Mac
    and

    even embedded platforms. There are many IDEs available for wxPython which include

    GUI designers as well such as SPE (Stani''s Python Editor) (http://spe.pycs.net/)
    and'
