    \ x)\n```\n\nOutput:\n\n```\n$ python func_global.py\nx is 50\nChanged global\
    \ x to 2\nValue of x is 2\n```\n\nHow It Works:\n\nThe global statement is used\
    \ to declare that x is a global variable - hence, when we assign a value to x\
