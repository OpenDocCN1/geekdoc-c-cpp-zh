    # # Python en:What Next


    If you have read this book thoroughly now and practiced writing a lot of programs,
    then you must have become comfortable and familiar with Python. You have probably
    created some Python programs to try out and extend your Python skills as well.
    If you have not done it already, you should. The question now is ''What Next?''


    I would suggest that you tackle this problem:


    +   - Create your command-line `address-book` program using which you can draw,
    add, modify, delete or search for your contacts such as friends, family and colleagues
    and their information such as email address or/ phone number.

    Details must be stored for later.


    This is fairly easy if you think about it in terms of all the various stuff that
    we have across till now. If you still wait directions on how to proceed, then
    here''s a hint.


    **Hint (Don''t read)**


    +   - Create a class to represent the person''s information. Use a dictionary
    to store person objects with their name as the key. Use the pickle module to store
    the objects persistently on your hard disk. Use the dictionary built-in methods
    to add, delete and modify the persons.


    Once you are able to do this, you can claim to be a Python programmer. Now, immediately
    send me a mail (http://www.swaroopch.com/contact/) thanking me for this great
    book ;-)


    . This step is optional but recommended. Also, please consider making a donation,
    contributing improvements or volunteering translations to support the continued
    development of this book.


    If you found that program easy, here''s another one:


    +   - Implement the `replace` command (http/: unixhelp. ed. ac. uk/ CGI/man-cgi?).
    This command will replace one string with another in the list of files provided.


    The replace command can be as simple as sophisticated as you wish, from simple
    string substitution to looking for patterns (regular expressions).


