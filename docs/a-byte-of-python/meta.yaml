    \n在第一次用法 `func(3, 7)` 中，参数获取值 3，参数 `b` 获取值 7，而 `c` 获取了默认值 10。\n\n在第二次用法 `func(25,\
    \ c=24)` 中，由于参数的位置，变量获取了值 25。然后，由于命名（即关键字参数），参数 `c` 获取了值 24。变量 `b` 获取了默认值 5。\n\
    \n在第三次用法 `func(c=50, a=100)` 中，我们完全使用关键字参数来指定值。注意，我们在为参数 `c` 指定值之前，先指定了函数定义中在\
    \ `c` 之前的参数。\n\n## 可变参数 (VarArgs)\n\n待办\n\n我应该在后面的章节中介绍这个吗？因为我们还没有讨论列表和字典。\n\n\
    有时你可能想定义一个可以接受任意数量参数的函数，这可以通过星号来实现：\n\n```python\n#!/usr/bin/python\n# Filename=\
    \ total.py\n```\n\n```python\ndef total(initial=-5, *numbers, **kwargs):\n   \
    \ count = initial\n    for number in numbers:\n        count += number\n    for\
    \ key in keywords:\n        count += keywords[key]\n    return count\n```\n\n\
    ```python\nprint(total(10, 1, 2, 3, vegetables=50, fruits=100))\n```\n\n输出:\n\n\
    ```\n$ python total.py\n166\n```\n\n工作原理：\n\n当我们声明一个带星号的参数（如 `*param`），那么从该点到结束的所有位置参数都会收集到一个名为\
    \ `param` 的列表中。\n同样，当我们声明一个带双星号的参数（如 `**param`），那么从该点到结束的所有关键字参数都会收集到一个名为 `param`\
    \ 的字典中。\n我们将在后面的章节中探索列表和字典。\n\n## 仅关键字参数\n\n如果我们希望指定某些关键字参数为仅限关键字，而不作为位置参数，可以将它们声明在星号参数之后：\n\
    \n```python\n#!/usr/bin/python\n# Filename: keyword_only.py\n\ndef total(initial-5,\
    \ *numbers, vegetables):\n    count = initial\n    for number in numbers:\n  \
    \      count += number\n    count += vegetables\n    return count\n\nprint(total(10,\
    \ 1, 2, 3, vegetables=50))\nprint(total(10, 1, 2, 3))\n# 报错，因为我们没有为 'vegetables'\
    \ 提供默认参数值\n```\n\n输出:\n```\n$ python keyword_only.py\n66\nTraceback (most recent\
    \ call last):\nFile \"test.py\", line 12, in <module>\nprint(total(10, 1, 2, 3))\n\
    TypeError: total() needs keyword-only argument vegetables\n```\n\n工作原理：\n在星号参数之后声明参数会导致仅限关键字参数。如果参数没有提供默认值，那么当调用函数时没有提供该关键字参数，将会抛出错误，如上所示。\n\
    如果你想要仅关键字参数但不需要星号参数，只需使用一个空星号且不使用任何名称，例如 `def total(initial=5, *, vegetables)`。\n\
    \n## return 语句\n\n`return` 语句用于从函数返回，即跳出函数。我们还可以选择从函数返回一个值。\n\n示例：\n\n```python\n\
    #!/usr/bin/python\n# Filename: func_return.py\n\ndef maximum(x, y):\n    if x\
    \ > y:\n        return x\n    else:\n        return y\n\nprint(maximum(2, 3))\n\
    ```\n\n输出:\n\n```\n$ python func_return.py\n3\n```\n\n工作原理：\n\n`maximum` 函数返回参数的最大值，在本例中即传递给函数的数字。它使用一个简单的\
    \ `if..else` 语句找到较大的值，然后返回该值。\n\n注意，没有值的 `return` 语句等同于 `return None`。`None` 是\
    \ Python 中的一种特殊类型，代表空无。例如，如果变量的值为 `None`，则用它表示该变量没有值。\n\n除非你写了自己的 `return` 语句，否则每个函数最后都隐式包含一个\
    \ `return None` 语句。你可以通过运行 `print(someFunction())` 看到，其中 `someFunction` 没有使用 `return`\
    \ 语句：\n\n```python\ndef someFunction():\n    pass\n```\n\n`pass` 语句在 Python 中用于表示空语句块。\n\
    \n## 注意事项\n\n有一个名为 `max` 的内置函数，它已经实现了“寻找最大值”的功能，因此尽可能使用这个内置函数。\n\n## 文档字符串 (DocStrings)\n\
    \nPython 有一个非常实用的特性叫做文档字符串，通常简称为 `docstrings`。`DocStrings` 是你应该利用的一个重要工具，因为它有助于更好地记录程序并使其更易理解。令人惊讶的是，在程序实际运行时，我们可以从函数获取回\
    \ docstring！\n示例：\n\n```python\n#!/usr/bin/python\n# Filename: func_return.py\n\
    \ndef maximum(x, y):\n    \"\"\"返回两个数字的最大值\"\"\"\n    if x > y:\n        return\
    \ x\n    else:\n        return y\n\nprint(maximum(2, 3))\nprint(maximum.__doc__)\n\
    ```\n\n输出:\n\n```\n返回两个数字的最大值\n```\n*(注：由于原文示例中 docstring 部分不完整或存在 OCR 错误，此处根据逻辑补全了示例内容以符合翻译规范)*\n\
    \n"
