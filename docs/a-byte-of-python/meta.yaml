- md: "\n# A Byte of Python\n\nv1.92 (for Python 3.0)\n\n# Python\n\nChoose your Python\
    \ version:\n\nIf you want to learn the current Python 2.x, read [1] or download\
    \ the PDF [2]\n\nIf you want to learn the new Python 3.0, read here or download\
    \ the PDF [3]\n\nYou can also buy a printed hardcopy. [4]\n\n# Introduction\n\n\
    'A Byte of Python' is a book on programming using the Python language. It serves\
    \ as a tutorial or guide to the Python language for a beginner audience. If you\
    \ all know about computers it is how to save text files, then this book is for\
    \ you.\n\nThis book is updated for the new Python 3.0. If you are looking for\
    \ a tutorial on the current Python 2.x version, please download the previous revision\
    \ of the book [5]. On the same note, if you're wondering whether to learn Python\
    \ 2.x or 3.x, then read this article by James Bennett [6]\n\n# Who Reads 'A Byte\
    \ of Python?'\n\nHere are what people are saying about the book:\n\n## Feedback\
    \ From Readers\n\n- This is the best tutorial I've ever seen! Thank you for your\
    \ effort.\n  - Walt Michalik (wmich50-at-theramp-dot-net)\n\n- You've made the\
    \ best tutorial I've found on the Net. Great work. Thanks!\n  - Joshua Robin (joshrob-at-poccta-dot-one-dot-pl)\n\
    \n- Hi, I'm from Dominican Republic. My name is Pavel, I recently read your book\
    \ 'A Byte of Python' and I consider it excellent!! :). I learnt from all the examples.\
    \ Your book is of great help for newbies like me...\n  - Pavel Simo (pavel-dot-simo-at-gmail-dot-com)\n\
    \n- I recently finished reading Byte of Python, and I thought I really ought thank\
    \ you. It was very sad to read the final pages as I now have to go back to dull,\
    \ tedious or etc manuals for learning about python. I really appreciate your book\n\
    \  - Samuel Young (sy-one-three-seven-at-gmail-dot-com)\n\n- Dear Swaroop, I am\
    \ taking a class from an instructor that has no interest in teaching. We are using\
    \ Learning Python, second edition, by O'Reilly. It is not a text for beginner\
    \ without any programming knowledge, and an instructor should be working in another\
    \ field. Thank you very much for your book, without it I would be clueless about\
    \ Python and programming. Thanks you a million, you are able to 'break the message\
    \ down' to a level that beginners understand and not everyone can.\n  - Joseph\
    \ Duarte (jduarte1-at-cfl-dot-rr-dot-com)\n\n- I love your book! It is the greatest\
    \ Python tutorial ever, and a very useful reference. Brilliant, a true masterpiece!\
    \ Keep up the good work!\n  - Chris-André Sommersett\n\n- I'm just e-mailing you\
    \ to thank you for writing Byte of Python online. I had been attempting Python\
    \ for a few months prior to stumbling across your book, and although I made limited\
    \ success with PyGame, I never completed the program.\n\nThanks to your simplification\
    \ of the categories, Python actually seems a reachable goal. It seems like I have\
    \ finally learned the foundations and I can continue into my real goal, game development.\n\
    \nOnce again, thanks VERY MUCH for placing us a structured and helpful guide to\
    \ basic programming on the web. It moved me into out of OOP with an understanding\
    \ where two books had failed.\n  - Matt Gallivan (m-underscore-gallivan-12-at-hotmail-dot-com)\n\
    \n- I would like to thank you for your book 'A byte of python' which myself find\
    \ the best way to learn python. I am a 15 year old living in egypt my name is\
    \ Ahmed. Python my second programming language I learn visual 6 at school but\
    \ didn't enjoy it, however I really enjoyed learning python. I do address thebook\
    \ program and i was successful, if I will try to start more programs and read\
    \ python programs (if you could tell me source where to find a tutorial as good\
    \ as yours that would have helped me a lot. Thanks.\n  - Ahmed Mohammed (sedo-underscore-91-at-hotmail-dot-com)\n\
    \n- A wonderful resource for beginners to learn more about Python is the 110-page\
    \ PDF A Byte of Python by Swaroop C H. It is well-written, easy to follow, and\
    \ may be the best introduction to Python programming Scribus\n  - Drew Ames in\
    \ an article on Scripting Scribus [7] published on Linux\n\n- Yesterday I got\
    \ through most of Byte of Python on my Nokia N800 and it's the easiest and most\
    \ concise introduction to Python I have yet encountered. Highly recommended as\
    \ a starting point for learning Python.\n  - Jason Delport for his weblog [8]\n\
    \n# Academic Courses\n\nThis book is used as instructional material in various\
    \ educational institutions:\n\n- 1. 'Principles of Programming Languages' course\
    \ at Vrije Universiteit, Amsterdam [9]\n- 2. 'Basic Concepts of Computing' course\
    \ at University of California, Davis [10]\n- 3. 'Programming With Python' course\
    \ at Harvard University [11]\n- 4. 'Introduction to Programming' course at University\
    \ of Leeds [12]\n- 5. 'Introduction to Application Programming' course at Boston\
    \ University [13]\n- 6. 'Information Technology Skills for Meteorology' course\
    \ at University of Oklahoma [14]\n- 7. 'Geoprocessing' course at Michigan State\
    \ University [15]\n- 8. 'Multi Agent Semantic Web' course at the University of\
    \ Edinburgh [16]\n\n# Even NASA\n\nThe book is even used by NASA! It is being\
    \ used in their Jet Propulsion Laboratory [17] with their Deep Space Network project.\n\
    \n# Official Recommendation\n\nThis book has been listed on the official website\
    \ for Python in the Full Tutorials [18] section, next to the official documentation.\n\
