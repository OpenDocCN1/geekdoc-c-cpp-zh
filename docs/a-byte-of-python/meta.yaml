    ## 在：导言中的 Python


    ### 导言


    Python 是少数几个可以自称既简单又强大的语言之一。你会发现，将精力集中在问题的解决方案而不是你所编程语言的语法和结构上，这让你感到非常惊喜。


    Python 的官方介绍是：


    - Python 是一门易于学习、强大的编程语言。它具有高效的高级数据结构和简单但有效的面向对象编程方法。Python 优雅的语法和动态类型，加上它的解释型特性，使其成为许多平台许多领域脚本编写和快速应用程序开发的理想语言。


    我将在下一节中详细讨论这些大部分特征。


    ## 注意


    - Python 语言的创造者 Guido van Rossum 以 BBC 节目《蒙蒂 Python 的飞行马戏》命名了该语言。他并不特别喜欢那些通过杀害动物来饱满长身体并将其压碎的蛇。


    ## Python 的特性


    ### 简单


    Python 是一种简单且极极主义主义的语言。阅读一个良好的 Python 程序感觉几乎就像在读英语，尽管是非常严格的英语！Python 的这种伪代码性质是它最大的优势之一。它允许你专注于问题的解决方案，而不是语言本身。


    ### 易于学习


    如你所见，Python 入门非常容易。正如前面提到的，Python 拥有极其简单的语法。


    ### 免费且开源


    Python 是 FLOSS（自由/自由开源软件）的一个示例。简单来说，你可以自由地分发该软件的副本，阅读其源代码，对其进行修改，并在新的免费程序中使用它的部分代码。FLOSS
    基于共享知识的社区概念。这是 Python 如此好的原因之一——它由一个只想使用更好 Python 的社区创建并不断改进。


    ### 高级语言


    当你在用 Python 编写程序时，你永远不需要担心低级细节，例如管理程序使用的内存等等。


    ### 可移植性


    由于其开源性质，Python 已经被移植到（即经过修改以便在……的平台上运行）许多平台。只要你足够小心地避免任何依赖于系统的特性，你所有的 Python 程序都可以在这些任何一个平台上运行，而无需任何更改。


    你可以在 Linux、Windows、FreeBSD、Macintosh、Solaris、OS/2、Amiga、AROS/400、FreeBSD、OS/390、z/OS、Palm
    OS、QNX、VMS、Psion、Acorn RISC OS、VxWorks、PlayStation、Sharp Zaurik、Windows CE 和 PocketPC
    上使用 Python！


    ### 解释型


    这需要一点解释。


    用 C 或 C++ 等编译型语言编写的程序，使用带有各种标志和选项的编译器，从源码（即 C 或 C++）转换为你的计算机执行的语言（二进制代码，即 0 和
    1）。当你运行程序时，链接器/加载器软件将程序从硬盘复制到内存并开始运行。


    相反，Python 不需要编译为二进制文件。你只需要直接从源代码运行程序。在内部，Python 将源代码转换为中间形式字节码，并将其翻译为你计算机的语言然后运行。实际上，这一切让
    Python 变得容易得多，因为你不需要担心编译程序、确保链接并加载了正确的库等等。这也让你的程序具有更好的可移植性，因为你只需要将你的 Python 程序复制到另一台计算机上它就能运行！


    ### 面向对象


    Python 支持过程化编程，也支持面向对象编程。在过程化语言中，程序围绕过程或函数构建，而这些不是可重用的程序段。在面向对象语言中，程序围绕结合数据和功能的对象构建。Python
    是实现 OOP 的一种非常强大且简单的方法，特别是与 C++ 或 Java 这样的大语言相比。


    ### 可扩展


    如果你需要某部分关键代码运行非常快，或者希望某些算法代码不公开，你可以用 C 或 C++ 编写程序的该部分，然后通过你的 Python 程序使用它。


    ### 可嵌入


    你可以将 Python 嵌入到 C/C++ 程序中，为程序的程序的用户提供“脚本”能力。


    ### 丰富的库


    标准库确实巨大。它可以帮助你做各种事情，包括正则表达式、文档生成、单元测试、线程、数据库、网络浏览器、CGI、FTP、电子邮件、XML、XML-RPC、HTML、WAV
    文件、加密、GUI（图形用户界面）、Tk 以及其他依赖系统的东西。记住，所有这些在任何安装了 Python 的地方可用。这被称为 Python 的“内置电池”（Batteries
    Included）哲学。


    除了标准库，还有其他高质量的库，如 wxPython (http://www.wxpython.org)、Twisted (http://www.twistedmatrix.com/products/twisted)、Python
    Imaging Library (http://www.pythonware.com/products/pil/index.htm) 等许多。


    ## 在：导言中的 Python


    Python 确实是一门令人兴奋且强大的语言。它性能与特性的完美结合，使得用 Python 编写程序既有趣又简单。


    ## 为什么不选择 Perl？


    如果你还不知道，Perl 是另一种非常流行的开源解释型语言。


    如果你曾经写过大型程序，你就会自己回答过这个问题了！换句话说，Perl 程序在很小时很容易，并且擅长“完成工作”的小脚本。然而，一旦你开始编写程序，它们就会变得难以处理。


    与 Perl 相比，Python 程序明显简单、更容易编写，因此更易维护。我钦佩 Perl 并在编写程序时每天使用它，因为 Perl 经历了太多的黑客，以至于感觉就像一个巨大的（或半个）黑客。遗憾的是，即将
    Perl 6 似乎没有在这方面做出任何改进。


    Perl 的唯一且非常显著优势是它巨大的 CPAN (http://cpan.perl.org) 库——综合 Perl 归档网络。正如名称所示，这是一个巨大的
    Perl 模块集合，其规模和深度简直令人震惊——你可以用这些模块做任何事情。Perl 库比 Python 多的原因之一是它出现的时间比 Python 长得多。然而，随着
    Python Index (http://pypi.python.org/pypi) 的增长，这种情况正在发生。


    ## 为什么不选择 Ruby？


    如果你不知道，Ruby 是另一种流行的解释型语言。


    如果你已经喜欢 Ruby，我绝对建议你继续使用它。


    对于其他没有用过它并试图判断是学习 Python 还是学习 Ruby 的人，我会推荐 Ruby，纯粹从易用性的角度来看。我个人发现 Ruby 语言很难理解，但对于理解
    Ruby 的人来说，他们赞美这种语言的美感。遗憾的是，我不那么幸运。


    ## 程序员怎么说


    你可能会发现阅读伟大的黑客对 Python 的评价很有趣：


    - Eric S. Raymond 是《大教堂与集市》的作者，也是创造“开源”一词的人。他说 Python 已经成为他最喜爱的编程语言（http://www.linuxjournal.com/article.php?sid=3882）。这篇文章是我第一次接触
    Python 的真正灵感来源。

    - Bruce Eckel 是著名的《Java 语言》和《C++ 语言》书籍的作者。他说没有一种语言比 Python 让他效率更高。他说 Python 也许是唯一专注于让……更容易语言。


    '
