  md: "# Python:Functions\n\n```\n$ python func_param.py\n4 is maximum\n7 is maximum\n\
    ```\n\nHow It Works:\n\nHere, we define a function called printMax where we take\
    \ two parameters called a and b. We find out the greater number using a if..else\
