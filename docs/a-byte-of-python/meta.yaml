    # Python en:More


    # Introduction


    So far we have covered majority of the various aspects of Python that you will
    use. In this chapter, we will cover more aspects that will make our knowledge
    of Python more well-rounded.


    # Passing tuples around


    Ever wished you could return two different values from a function? You can. All
    you have to use a tuple.


    ```

    >>> get_error_details():

    ....return (2, ''second error details'')

    ....

    >>> errnum, errstr = get_error_details()

    >>> errnum

    2

    >>> errstr

    ''second error details''

    ```


    Notice the usage of a, b = <some expression> interprets the result of the expression
    as a tuple with two values.


    If you want to interpret the results as (a, <everything else>), then you just
    need to start it just like you would in function parameters:'
