    This is pretty simple once you''ve understood the idiom.


    # Parentheses


    Although the parentheses is optional, I prefer having them to make it obvious
    that it is a tuple, especially because it avoids ambiguity. For example, print(1,2,3)
    and print (1,2,3 ) mean two different - the former prints numbers whereas the
    latter prints a tuple (which contains three numbers).


    # Tuple with 0 or 1 items


    An empty tuple is constructed by empty pair of parentheses such as myempty = ().
    However, a tuple with a single item is not so simple. You have to specify it using
    a comma before the first (and only item) so that Python can differentiate between
    a tuple and a pair of parentheses surrounding the object in an expression i.e.
