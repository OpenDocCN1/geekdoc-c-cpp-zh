  md: "# Using nonlocal statement\n\nWe have seen how to access variables in the local\
    \ and global scope above. There is another kind of scope called \"nonlocal\" scope\
    \ which is in-between these two types of scopes. Nonlocal scopes are observed\
    \ when you define functions inside functions. Since everything in Python is just\
    \ executable code, you can define functions anywhere.\n\nLet's take an example:\n\
    \n```\n#!/usr/bin/python\n# Filename: func_nonlocal.py\n```\n\n```\ndef func_outer():\n\
    \    x = 2\n    print('x is', x)\n\n    def func_inner():\n        nonlocal x\n\
    \        x = 5\n\n    func_inner()\n    print('Changed local x to', x)\n```\n\n\
    func_outer()\n\nOutput:\n\n```\n$ python func_nonlocal.py\nx is 2\nChanged local\
    \ x to 5\",\n```\n\nHow It Works:\n\nWhen we are inside func_inner, the 'x' defined\
    \ in the first line of func_outer is relatively neither in local scope nor in\
    \ global scope. We declare that we are using this x by nonlocal and hence we get\
    \ access to that variable.\nChanging the nonlocal x to global x and also by removing\
    \ the statement itself and observe the difference in behavior in these two cases.\n\
    \n# Default Argument Values\n\nFor functions, you may want to make some of its\
    \ parameters as optional and use default values if the user does not provide values\
    \ for such parameters. This is done with the help of default argument values.\
    \ You can specify default values for parameters by following the parameter name\
    \ in the function definition with the assignment operator (=) followed by the\
    \ default value.\n\nNote that the default argument value should be a constant.\
    \ More precisely, the default argument value should be immutable - this is explained\
    \ in detail in later chapters. For now, just remember this.\n\nExample:"
