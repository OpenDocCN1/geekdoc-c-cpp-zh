    \        return y\n```\n\nprint(maximum(2, 3))\n\nOutput:\n\n```\n$ python func_return.py\n\
    3\n```\n\nHow It Works:\n\nThe maximum function returns the maximum of the parameters,\
    \ in this case the numbers supplied to the function. It uses a simple if..else\
    \ statement to find the greater value and then returns that value.\n\nNote that\
    \ a return statement without a value is equivalent to return None. None is a special\
    \ type in Python that represents nothingness. For example, it is used to indicate\
    \ that a variable has no value if it has a value of None.\n\nEvery function implicitly\
    \ contains a return None statement at the end unless you have written your own\
    \ return statement. You can see this by running print(someFunction()) where the\
    \ function someFunction does not use the return statement such as:\n\n```\ndef\
    \ someFunction():\n    pass\n```\n\nThe pass statement is used in Python to indicate\
    \ an empty block of statements.\n\n# Note\n\nThere is a built-in function called\
    \ max that already implements the 'find maximum' functionality, so use this built-in\
    \ function whenever possible."
  - "[PAGE 52]\n\n# DocStrings\n\nPython has a nifty feature called documentation\
    \ strings, usually referred to by its shorter name docstrings. DocStrings are\
    \ an important tool you should make use of since it helps to document the program\
    \ better and makes it easier to understand. Amazingly, we can get the docstring\
    \ back from a function, when the program is actually running!\nExample:\n\n```\n\
    #!/usr/bin/python\n# Filename: func_doc.py\n\ndef printMax(x, y):\n    \"\"\"\
    Prints the maximum of two numbers.\"\"\"\n    x = int(x) # convert to integers,\
    \ if possible\n    y = int(y)\n\n    if x > y:\n        print(x, ' is maximum')\n\
    \    else:\n        print(y, ' is maximum')\n\nprintMax(3, 5)\nprint(printMax.__doc__)\n\
    ```\n\nOutput:\n\n```\n$ python func_doc.py\n5 is maximum\nPrints the maximum\
    \ of two numbers.\n\nThe two values must be integers.\n```\n\nHow It Works:\n\n\
    A string on the first logical line of a function is the docstring for that function.\
    \ Note that DocStrings also apply to modules and classes which we will learn about\
    \ in the respective chapters.\n\nThe convention followed for a docstring is a\
    \ multi-line string where the first line starts with a capital letter and ends\
    \ with a dot. The second line is blank before any detailed explanation starting\
    \ from the third line. You are strongly advised to follow this convention for\
    \ all your docstrings and all non-trivial functions.\n\nWe can access the docstring\
    \ of the printMax function using the __doc__ (notice the double underscores) attribute\
    \ (name belonging to of). Just remember that Python treats everything as an object\
    \ and this includes functions. We'll learn more about objects in the class on\
    \ classes.\n\nIf you used help() in Python, then you have already seen the usage\
    \ of docstrings! What it does just fetch the __doc__ attribute of function and\
    \ displays it in a neat manner for you. You can try it out on the function above\
    \ - just include help(printMax) in"
  - '[PAGE 53]


    # Python en:Functions


    your program. Remember to press the q key to exit help.

    Automated tools can retrieve the documentation from your program in this manner.
    Therefore, I strongly recommend that you use docstrings for any non-trivial function
    that you write. The pydoc command that comes with your Python distribution works
    similarly to help () using docstrings.


    # Annotations


    Functions have another advanced feature called annotations which are a nifty way
    of attaching additional information for each of the parameters as well as the
    return value. Since the Python language itself does not interpret these annotations
    in any way (that functionality is left to third-party libraries to interpret in
    any way they want), we will skip this feature in our discussion. If you are interested
    to read about annotations, please see the Python Enhancement Proposal No. 3107
    (http/: / www.python. org/ dev/peps/pep-3107/).


    # Summary


    We have seen many aspects of functions but note that we still haven''t covered
    all aspects of it. However, we have already covered most of what you''ll use regarding
    Python functions on an everyday basis.

    Next, we will see how to use as well as create Python modules.


    Previous Next


    Source: http://www.swaroopch.com/mediawikiwiki/index.php?oldid=2379

