    How It Works:


    First, we see how to use indices to get individual items of a sequence. This is
    also referred to as the subscription operation. Whenever you specify a sequence
    within square brackets as shown above, Python will fetch you the item corresponding
    to that position in the sequence. Remember that Python starts counting numbers
    from 0. Hence, shoplist[0] fetches the first item and shoplist[3] fetches the
    fourth item in the sequence.


    The index can also be a negative number, in which case, the position is calculated
    from the end of the sequence. Therefore, shoplist[-1] refers to the last item
    in the sequence and shoplist[-2] fetches the last item in the sequence.


    The slicing operation is specified by using the name of the sequence followed
    by an optional pair of numbers separated by a colon within square brackets. Note
    that this is very similar to the indexing operation you have been using till now.
    Remember the numbers are optional the colon isn''t.


    The first number (before the colon) in the slicing operation refers to the position
    from where the slice starts and the second number (after the colon) indicates
    where the slice stop. If the first is not specified, Python will start at the
    beginning of the sequence. If the second number is left out, Python will stop
    at the end of the sequence. Note that the slice returned starts at the start position
    and will just before the end position i. the start position is included but the
    end position is excluded from the sequence slice.


    Thus, shoplist[1:3] returns a slice of the sequence starting at position 1, includes
    position 2 stops at position 3 and therefore a slice of two items is returned.
    Similarly, shoplist[:] returns a copy of the whole sequence.'
