    \ --> # Press ctrl-c\nYou cancelled the operation.\n```\n\n```\n$ python try_except.py\n\
    Enter something --> no exceptions\nYou entered no exceptions\n```\n\n### 工作原理：\n\
    \n我们将所有可能抛出异常/错误的语句放在 `try` 块中，然后在 `except` 子句/块中放置针对相应错误/异常的处理器。`except` 子句可以处理单个指定的错误或异常，也可以处理一个带括号的错误/异常列表。如果没有提供错误或异常的名称，它将处理所有的错误和异常。\n\
    \n注意，每个 `try` 句必须至少关联一个 `except` 子句。否则，设置 `try` 块的意义何？\n\n如果任何错误或异常没有被处理，将调用默认的\
    \ Python 处理器，它会停止程序执行并打印错误信息。我们已经在上面的操作中看到了这一点。\n\n你还可以与 `try..except` 块关联一个 `else`\
    \ 子句。如果没有发生异常，则执行 `else` 子句。\n\n在下一个示例中，我们还将看到如何获取异常对象，以便我们检索额外信息。\n\n## 抛出异常\n\
    \n你可以使用 `raise` 语句抛出异常，通过提供错误/异常的名称以及要抛出的异常对象。你可以抛出的错误或异常可以是直接或间接继承自 `Exception`\
    \ 类的派类。\n\n```python\n#!/usr/bin/python\n# Filename: raising.py\n\nclass ShortIntException(Exception):\n\
