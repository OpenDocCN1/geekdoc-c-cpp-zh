    ```


    # Special Methods


    There are certain methods such as the __init__ and __del__ methods which have
    special significance in classes.

    Special methods are used to mimic behaviors of built-in types. For example, if
    you want to use the x[key] indexing operation for your class (just like you use
    for lists and tuples), then all you have to do is implement the __getitem__()
    method and your job is done. If you think about it, this is what Python does for
    the list class itself!

    Some special methods are listed in the following table. If you want to know about
    all the special methods, see the manual (http://docs.python.org/dev/ 3/reference/datamodel.html#special-method-names).


    | Name | Explanation |

    |---|---|

    | __init__(self, ...) | This method is called just before the newly created object
    is returned for usage. |

    | __del__(self) | Called just before the object is destroyed |

    | __str__(self) | Called when we use the print function or str() is used. |

    | __lt__(self, other) | Called when the less operator (<) is used. Similarly,
    there are special methods for all operators (+, *, etc.). |

    | __getitem__(self, key) | Called when x[key] indexing operation is used. |

    | __len__(self) | Called when the built-in len() function is used for the sequence
    object. |


    # Special Statement Blocks


    We have seen that each block of statements is set apart from the rest by its own
    indentation level. While, if a block of statements contains only one single statement,
    then you can specify it on the same line of, for a conditional statement or looping
    statement. The following example should make this clear:


    ```

    >>> flag = True

    >>> if flag: print ''Yes''

    ```


    Yes


    Notice that the single statement is used in-place and not as a separate block.
    Although, you can use this for making your program smaller, I strongly recommend
    avoiding this short-cut method, except for checking, mainly it will be much easier
    to add an extra'
