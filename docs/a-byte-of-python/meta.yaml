    ## Python on: Oriented Programming\n\n### Object Methods\n\nWe have already discussed\
    \ that classes/objects can have methods just like functions except that we have\
    \ an extra self variable. We will now see an example.\n\n```python\n#!/usr/bin/python\n\
    # Filename: method.py\n\nclass Person:\n    def sayHi(self):\n        print('Hello,\
