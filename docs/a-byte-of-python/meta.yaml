    \ 的模块，它用于向最终用户显示警告。如果 Python 版本号至少不是 3，我们就显示相应的警告。\n\n## logging 模块\n\n如果你想将一些调试信息或重要信息存储在某处，以便检查程序是否按照你的预期运行该怎么办？如何“存储某处”这些信息？可以使用\
