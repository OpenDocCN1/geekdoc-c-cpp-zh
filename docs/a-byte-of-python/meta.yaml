    的 Linux 中的 apt-get，Fedora Linux 中的 yum，FreeBSD 中的 pkg_add 等。注意你需要连接互联网才能使用此方法。或者，你也可以从其他地方下载二进制文件复制到你的
    PC 并安装。


    ## Python：安装


    ### 适用于 Windows 用户


    访问 http://www.python.org/download/releases/3.0/ 从该网站下载最新版本，截至本文编写为 3.0 beta 1（http://www.python.org/ftp/python/3.0/python-3.0b1.msi）。这只有
    12.8 MB，与大多数其他语言或软件相比非常紧凑。安装过程与其他任何基于 Windows 的软件一样。


    ### 注意事项


    当你获得取消勾选“可选”组件的选择时，不要取消勾选任何一个！这些组件对你可能有用，特别是 IDLE。


    一个有趣的事实是，大多数 Python 下载者是 Windows 用户。当然，这并不代表全貌，因为所有 Linux 用户的系统中默认已经安装了 Python。


