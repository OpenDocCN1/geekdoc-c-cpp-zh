  md: "# Python en:Control Flow\n\ngives the sequence [1, 2, 3, 4]. By default, range\
    \ takes a step count of 1. If we supply a third number to range, then that becomes\
    \ the step count. For example, range(1,5,2) gives [1,3]. Remember that the range\
    \ extends up to the second number i.e. does not include the second number.\n\n\
    The for loop iterates over this range - for i in range(1,5) is equivalent to for\
    \ i in [1, 2, 3, 4] which is assigning each number (or object) to the sequence\
    \ to i, one and then executing the block of statements for each value of i. In\
    \ this case, we just print the value in the block of statements.\n\nRemember that\
    \ the else part is optional. When included, it is always executed once after the\
    \ loop for unless a break statement is encountered.\n\nRemember that the for..\
    \ loop works for any sequence. Here, we have a list of numbers generated by the\
    \ built-in range function, but in general we can use any kind of sequence or any\
    \ kind of objects! We will explore this detail in later chapters.\n\nNote for\
    \ C/C++/Java/C# Programmers\n\nThe Python for loop is radically different from\
    \ the C/C++ loop. C# programmers will note that the for loop in Python is similar\
    \ to the foreach loop in C#, Java programmers will note that the same is similar\
    \ to for (int : IntArray) in Java 1.5.\n\nIn C/C++, if you want to write for (int\
    \ i = 0; i < 5; i++), then in Python you write just for i in range(0,5). As you\
    \ can see, the for is simpler, more expressive and less prone to error.\n\n# The\
    \ break Statement\n\nThe break statement is used to break out of a loop statement\
    \ i.e. stop the execution of a looping statement, if the loop condition has not\
    \ become False or the sequence of items has been completely iterated.\n\nAn important\
    \ note is that if you break out of for or while loop, any corresponding loop else\
    \ block is not executed.\n\nExample:\n\n```\n#!usr/bin/python\n# Filename: break.py\n\
    ```\n\n```\nwhile True:\n    s = (input('Enter something : '))\n    if s == 'quit':\n\
