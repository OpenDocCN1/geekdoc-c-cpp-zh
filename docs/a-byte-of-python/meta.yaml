    Simple Assignment

    shoplist = [''mango'', ''carrot'', ''banana'']

    mylist = [''mango'', ''carrot'', ''banana'']

    Copy by making a full slice

    shoplist = [''mango'', ''carrot'', ''banana'']

    mylist = [''carrot'', ''banana'']

    ```


