    EOFError: EOF when reading a line\n```\n\nPython 抛出了 `EOFError` 错误，这基本上意味着它在没有预料看到的情况下看到了文件结束符号（由\
    \ ctrl-d 触发）。\n\n### 处理异常\n\n我们可以使用 `try..except` 语句来处理异常。我们基本上是将通常的语句放在 `try`\
    \ 块中，并将所有的处理器放在 `except` 块中。\n\n```python\n#!/usr/bin/python\n# Filename: try_except.py\n\
    ```\n\n```python\ntry:\n    text = input('Enter something --> ')\nexcept EOFError:\n\
    \    print('Why did you do an EOF on me?')\nexcept KeyboardInterrupt:\n    print('You\
