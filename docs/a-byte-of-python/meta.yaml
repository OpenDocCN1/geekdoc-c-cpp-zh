- md: "\n# Python en:Table of Contents\n\n- Front Page\n- 1. Translations\n- 2. Preface\n\
    - 3. Introduction\n- 4. Installation\n- 5. First Steps\n- 6. Basics\n- 7. Operators\
    \ and Expressions\n- 8. Control Flow\n- 9. Functions\n- 10. Modules\n- 11. Data\
    \ Structures\n- 12. Problem Solving\n- 13. Object Oriented Programming\n- 14.\
    \ Input Output\n- 15. Exceptions\n- 16. Standard Library\n- 17. More\n- 18. What\
    \ Next\n- 19. Appendix: FLOSS\n- 20. Appendix: About\n- 21. Appendix: Revision\
    \ History\n\nPrevious | Next\n\nSource: http://www.swaroopch.com/mediawiki/index.php?oldid=1343\n\
    Contributors: Swaroop, Watererox888, 3 anonymous edits\n\n# Python en:Translations\n\
    \nThere are many translations of the book available in different human languages,\
    \ thanks to many tireless volunteers!\n\nIf you want to help these translations,\
    \ please see the list of volunteers and languages below and decide if you want\
    \ to start a new translation or help in existing translation projects.\n\nIf you\
    \ plan to start a new translation, please read the Translation Howto.\n\n# Chinese\n\
    \nJuan Shen (orion-underscore-val-at-163-dot-com) has volunteered to translate\
    \ the book to Chinese.\n\n> I am a postgraduate at Wireless Telecommunication\
    \ Graduate School, Beijing University of Technology, China PR. My current research\
    \ interest is on the synchronization, channel estimation and multi-user detection\
    \ of multicarier CDMA system. Python is major programming language for daily simulation\
    \ and research job, with the help of Python Numeric, actually. I just learned\
    \ Python half a year before, but you can see, it's really easy-understanding,\
    \ easy-to-use and productive. What is ensured in Swaroop's book. It's my favorite\
    \ programming language now. 'A Byte of Python' is my tutorial to learn Python.\
    \ It's clear and effective to lead you into a world of Python in the shortest\
    \ time. It's not too long, but efficiently covers all important things in Python.\
    \ 'A Byte of Python' would be strongly recommend for newbies as their first Python\
    \ tutorial. Just dedicate my translation to the potential millions of Python users\
    \ in China.\n\n# Chinese Traditional\n\nFred Lin (gasolin-at-gmail-dot-com) has\
    \ volunteered to translate the book to Chinese Traditional.\n\nIt is available\
    \ at http://code.google.com/p/zhpy/wiki/ByteOfZhpy (http://code.google.com/p/zhpy/wiki/ByteOfZhpy).\n\
    \nAn exciting feature of this translation is that it contains the executable python\
    \ sources by side with the original python sources.\n\nFred Lin - I'm working\
    \ as a network framework engineer at Delta Network, I'm also a contributor of\
    \ TurboGears framework. As a python evangelist (-p), I need some material for\
    \ python language. 'A Byte of Python' hit the sweet point for both newbies and\
    \ experienced programmers. 'A Byte of Python' elaborates the python essentials\
    \ with affordable size. The translation are originally based on simplified chinese\
    \ version, and soon a lot of rewrites were made to fit the current wiki version\
    \ and the quality of reading. The recent Chinese traditional version also featured\
    \ with executable python sources, which are achieved by my new 'zhpy' (python\
    \ in chinese) project (launch from Aug 07), zhpy(pronounce (Z.H., or zippy) build\
    \ a layer over python to translate or interact with python in chinese(Traditional\
    \ or Simplified). This project is mainly aimed for education.\n\n# Python:en:Translations\n\
    \n# Italian\n\nEnrico Morelli (mr-dot-mluci-at-gmail-dot-com) and Massimo Lucci\
    \ (morelli-at-cerm-dot-unifido-dot-it) have volunteered to translate the book\
    \ to Italian.\n\nThe Italian translation is present at www.gentoo.it/Programmazione/bytepython\
    \ (http://www.gentoo.it/Programmazione/bytepython). The new translation is in\
