  md: '# Python:What Next


    the wxGlade (http://wxglade.sourceforge.net/) GUI builder. You can create free
    as well as proprietary software using wxPython. To get started, read the wxPython
    tutorial (http://zetcode.com/wxpython/).


    # Tkinter


    This is one of the oldest GUI toolkits in existence. If you have used IDLE, you
    have a Tkinter program at work. It doesn''t have one of the best look & feel because
    it has old-school look to it. Tkinter is portable and works on both Linux/Unix
    as Windows. Importantly, Tkinter is part of the standard Python distribution.
    To get started, read the Tkinter tutorial (http://www.python.com/library/tkinter/introduction/).


    For more choices, see the GuiProgramming wiki page at the official python website
    (http://www.python.org/cgi-bin/moin//GuiProgramming).


    # Summary of GUI Tools


    Unfortunately, there is no one standard GUI tool for your situation. I suggest
    that you choose one of the above tools to pay any use of the GUI tools. The second
    factor is whether you are willing to run the program only on Windows or Mac or
    Linux or all of them. The third factor, if Linux is a chosen platform, is whether
    you are a KDE or GNOME user on Linux.


    For a more detailed and comprehensive analysis, see Page 26 of The Python Papers,
    Volume 3, Issue 1 (http://archive.pythonpapers.org/ThePythonPapersVolume3Issue1.pdf).


    # Various Implementations


    There are usually two programming language - the language and the software. A
    language is how you write something. The software is what actually runs your programs.


    We have using the CPython software to run our programs. It is referred to as CPython
    because it is written in the C language and is the Classical Python interpreter.


    There are other software that can run your Python programs:


    # Jython (http://www.jthon.org)


    A Python implementation that runs on the Java platform. This means you can use
    Java libraries and classes from Python language and vice-versa.


    IronPython (http:// / www. codeplex. com/ Wiki/ View. aspx?ProjectName=IronPython)


    A Python implementation runs on the .NET platform. This means you can use .NET
    libraries and classes from Python language and vice-versa.


    # PyPy (http://codespeak.net/pypy/pypy/doc/home.html)


    A Python implementation in Python! This is a research project to make it fast
    and easy to improve the interpreter since the interpreter is written in a dynamic
    language (as opposed to static languages such as C, Java or C# in the three implementations)


    # Stackless Python (http://www.stackless.com)


    A Python implementation that is specialized for thread-based performance.'
