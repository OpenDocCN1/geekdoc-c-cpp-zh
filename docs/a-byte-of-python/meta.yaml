  md: "# Python en:Functions\n\nWhen we declare a starred parameter such as *param,\
    \ then all the positional arguments from that point till the end are collected\
    \ as a list called 'param'.\nSimilarly, when we declare a double-starred parameter\
    \ as **param, then all the keyword arguments from that point till the end are\
    \ collected as a dictionary called 'param'.\nWe will explore lists and dictionaries\
    \ in a later chapter.\n\n# Keyword-only Parameters\n\nIf we want to specify certain\
    \ keyword parameters to be available keyword-only and not as positional arguments,\
    \ they can be declared after a starred parameter:\n\n```\n#!/usr/bin/python\n\
    # Filename: keyword_only.py\n\ndef total(initial-5, *numbers, vegetables):\n \
    \   count = initial\n    for number in numbers:\n        count += number\n   \
    \ count += vegetables\n    return count\n\nprint(total(10, 1, 2, 3, vegetables=50))\n\
    print(total(10, 1, 2, 3))\n# Raises error because we have not supplied a default\
    \ argument value\nfor 'vegetables'\n```\n\nOutput:\n$ python keyword_only.py\n\
    66\nTraceback (most recent call last):\nFile \"test.py\", line 12, in <module>\n\
    print(total(10, 1, 2, 3))\nTypeError: total() needs keyword-only argument vegetables\n\
    \nHow It Works:\nDeclaring parameters after a starred parameter results in keyword-only\
