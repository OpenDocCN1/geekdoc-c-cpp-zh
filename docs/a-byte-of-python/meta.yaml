  md: "# Making Your Own Modules\n\nCreating your own modules is easy, you've been\
    \ doing it all along! This is because every Python program is also a module. You\
    \ just have to make sure it has a .py extension. The following example should\
    \ make clear.\n\nExample:\n\n```\n#!/usr/bin/python\n# Filename: mymodule.py\n\
    \ndef sayhi():\n    print('Hi, this is mymodule speaking.')\n\n__version__ = '0.1'\n\
    \n# End of mymodule.\n```\n\nThe above was a sample module. As you can see, there\
    \ is nothing particularly special compared to our usual Python program. We will\
    \ next see how to use this module in our other Python programs.\n\nRemember that\
    \ the module should be placed in the same directory as the program that we import\
    \ it in, or the module should be in one of the directories listed in sys.path.\n\
    \n```\n#!/usr/bin/python\n# Filename: mymodule_demo.py\n```\n\nimport mymodule\n\
    \nmymodule.sayhi()\nprint('Version', mymodule.__version__)\n\nOutput:\n\n```\n\
    $ python mymodule_demo.py\nHi, this is mymodule speaking.\nVersion 0.1\n```\n\n\
    How It Works:\n\nNotice that we use the dotted notation to access members of the\
    \ module. Python makes good use of the same notation to give the distinctive 'Pythonic'\
    \ feel to it so that we don't have to keep learning new ways to do things.\n\n\
    Here is a version utilising the from. import syntax:\n\n```\n#!/usr/bin/python\n\
    # Filename: mymodule_demo.py\n```\n\n```\nfrom mymodule import sayhi, __version__\n\
    \nsayhi()\nprint('Version', __version__)\n```"
