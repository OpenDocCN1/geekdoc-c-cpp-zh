    This is the second line.

    "What''s your name?" I asked.

    He said "Bond, James Bond."

    ''''''

    ```


    ### 转义序列


    假设你想定义一个包含单引号（''''''）的字符串，你该如何指定这个字符串呢？例如，字符串是 What''s your name?。你不能直接指定 ''What''s
    your name?''，因为 Python 会混乱字符串从哪里开始和结束。因此，你必须指定这个单引号不表示字符串的结束。这可以通过所谓的“转义序列”来实现。你将单引号指定为
    ''\'' —— 注意这里的反斜杠。现在，你可以将字符串指定为 ''What''s your name?


    另一种指定此特定字符串的方法是使用 "What''s your name?" ，即使用双引号。同样，如果你在双引号字符串中使用双引号本身，也必须使用转义序列。此外，你必须使用转义序列
    \\ 来指定反斜杠本身。


    如果想指定一个双行的字符串怎么办？一种方法是使用之前所示的三引号字符串，或者你可以使用换行符的转义序列 - \n 来表示新一行的开始。例如 This the
    first line\nThis is the second line.。另一个需要知道的有用转义序列是制表符 - \t。还有许多转义序列，但我只提到了最实用的。


    需要注意的一点是，在字符串中，行尾的单个反斜杠表示字符串在下一行延续，但不会添加换行符。例如：


