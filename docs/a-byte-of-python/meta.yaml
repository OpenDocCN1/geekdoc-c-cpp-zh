    ## Python 英文：安装


    如果你已经安装了 Python 2.x，你不需要删除它即可安装 Python 3.0。你可以同时安装这两个版本。


    ### 适用于 Linux 和 BSD 系统


    如果你正在使用 Ubuntu、Fedora、OpenSUSE 或（在此输入你的选择）等 Linux 发行版，或者像 FreeBSD 等 BSD 系统，那么你的系统中可能已经安装了
    Python。


    要测试你的 Linux 机器上是否安装了 Python，打开一个 shell 程序（如 konsole 或 gnome-terminal）并输入如下所示的命令
    `python -V`。


    ```

    $ python -V

    Python 3.0b1

    ```


    注意


    > $ 是 shell 的提示符。它根据你操作系统的设置而不同，因此我将仅用 $ 来指示提示符。


    如果你看到类似上面的版本信息，说明你已经安装了 Python。


    但是，如果你收到像这样的消息：


    ```

    $ python -V

    bash: Python: command not found

    ```


    那么你没有安装 Python。这极不太可能，但是有可能的。


    注意


    如果你已经安装了 Python 2.x，请尝试 `python3 -V`。在这种情况下，你有两种方法可以在系统上安装 Python。


