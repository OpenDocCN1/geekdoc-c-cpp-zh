    # Python en:Introduction


    # Introduction


    Python is one of those rare languages which can claim to be both simple and powerful.
    You will find that you will be pleasantly surprised by how easy it is to concentrate
    on the solution to the problem rather than the syntax and structure of the language
    you are programming in.


    The official introduction to Python is:


    +   Python is easy to learn, powerful programming language. It has efficient high-level
    data structures and a simple but effective approach to object-oriented programming.
    Python''s elegant syntax and dynamic typing, together with its interpreted nature,
    make it an ideal language for scripting and rapid application development in many
    areas on most platforms.


    I will discuss most of these features in more detail in the next section.


    # Note


    +   Guido van Rossum, the creator of the Python language, named the language after
    the BBC show "Monty Python''s Flying Circus". He doesn''t particularly like snakes
    that kill animals for feeding their long bodies around them and crushing them.


    # Features of Python


    # Simple


    Python is a simple and minimalistic language. Reading a good Python program feels
    almost like reading English, although very strict English! This pseudo-code nature
    of Python is one of its greatest strengths. It allows you to concentrate on the
    solution to the problem rather than the language itself.


    # Easy to Learn


    As you see, Python is extremely easy to get started with. Python has an extraordinarily
    simple syntax, as already mentioned.


    # Free and Open Source


    Python is an example of a FLOSS (Free/Libre and Open Source Software). In simple
    terms, you can freely distribute copies of this software, read its source code,
    make changes to it, and use pieces of it in new free programs. FLOSS is based
    on the concept of a community which shares knowledge. This is one of the reasons
    why Python is so good - it has been created and is constantly improved by a community
    who just want to use a better Python.


    # High-level Luage


    When you write programs in Python, you never need to worry about the low-level
    details such as managing the memory used by your program, etc.


    # Portable


    Due to its open-source nature, Python has been ported to (i.e. changed to make
    it work on) many platforms. All your Python programs can work on any of these
    without requiring any changes at all if you are careful enough to avoid any'
