  - "[PAGE 47]\n\n# Using nonlocal statement\n\nWe have seen how to access variables\
    \ in the local and global scope above. There is another kind of scope called \"\
    nonlocal\" scope which is in-between these two types of scopes. Nonlocal scopes\
    \ are observed when you define functions inside functions. Since everything in\
    \ Python is just executable code, you can define functions anywhere.\n\nLet's\
    \ take an example:\n\n```\n#!/usr/bin/python\n# Filename: func_nonlocal.py\n```\n\
    \n```\ndef func_outer():\n    x = 2\n    print('x is', x)\n\n    def func_inner():\n\
    \        nonlocal x\n        x = 5\n\n    func_inner()\n    print('Changed local\
    \ x to', x)\n```\n\nfunc_outer()\n\nOutput:\n\n```\n$ python func_nonlocal.py\n\
    x is 2\nChanged local x to 5\",\n```\n\nHow It Works:\n\nWhen we are inside func_inner,\
    \ the 'x' defined in the first line of func_outer is relatively neither in local\
    \ scope nor in global scope. We declare that we are using this x by nonlocal and\
    \ hence we get access to that variable.\nChanging the nonlocal x to global x and\
    \ also by removing the statement itself and observe the difference in behavior\
    \ in these two cases.\n\n# Default Argument Values\n\nFor functions, you may want\
    \ to make some of its parameters as optional and use default values if the user\
    \ does not provide values for such parameters. This is done with the help of default\
    \ argument values. You can specify default values for parameters by following\
    \ the parameter name in the function definition with the assignment operator (=)\
    \ followed by the default value.\n\nNote that the default argument value should\
    \ be a constant. More precisely, the default argument value should be immutable\
    \ - this is explained in detail in later chapters. For now, just remember this.\n\
    \nExample:"
  - "[PAGE 48]\n\n# Python:Functions\n\n```\n#!/usr/bin/python\n# Filename: func_default.py\n\
    def say(message, times = 1):\n    print(message * times)\n```\n\n```\nsay('Hello')\n\
    say('World', 5)\n```\n\nOutput:\n\n```\n$ python func_default.py\nHello\nHelloWorldWorldWorld\n\
    ```\n\nHow It Works:\n\nThe function named is used to print a string as many times\
    \ as specified. If we don't supply a value, then by default, the string is printed\
    \ just once. We achieve this by specifying a default argument value of 1 to the\
    \ parameter times.\n\nIn the first usage of say, we supply only the string and\
    \ it prints the string once. In the second usage of say, we supply both the string\
    \ and an argument 5 stating that we want to say the string message 5 times.\n\n\
    # Important\n\nOnly parameters that are at the end of the parameter list can be\
    \ given default values i.e. you cannot have a parameter with a default argument\
    \ value before a default argument value in the order of parameters declared in\
    \ the function parameter list.\n\nThis is because the values are assigned to the\
    \ parameters by position. For example, def func(a, b=5) is valid, but def func(a=5,\
    \ b) is not valid.\n\n# Keyword Arguments\n\nIf you have functions with many parameters\
    \ and you want to specify only some of them, then you give values for such parameters\
    \ by naming them - this is called keyword arguments - we use the name (keyword)\
    \ instead of the position (which we have been using all along) to specify the\
    \ arguments to the function.\n\nThere are two advantages - one, using the function\
    \ is easier since we do not need to worry about the order of the arguments. Two,\
    \ we can give values to only those parameters that we want, provided that the\
    \ other parameters have default argument values.\n\nExample:\n\n```\n#!/usr/bin/python\n\
    # Filename: func_key.py\n```\n\n```\ndef func(a, b=5, c=10):\n    print('a is',\
    \ a, 'and b is', b, 'and c is', c)\n```\n\n```\nfunc(3, 7)\n```"
