  md: '# Python on:Problem Solving


    We use the os.sep and time modules by first importing them. Then, we specify the
    files and directories to be backed up in the source list. The target directory
    is where all the backup files and this is specified in the target_dir variable.
    The name of the zip archive that we are creating is the current date and time
    we find out using the time.strftime() function. It will also have the zip extension
    and will be stored in the target_dir directory.


    Notice the use of os.sep variable - this gives the directory according to your
    operating system i.e. will be ''/'' in Linux, Unix and will ''\\'' in Windows
    and '':'' in Mac OS. Using os.sep instead of these characters directly will make
    our program portable and work across these systems.


    The time.strftime() takes a specification such as the one we have used in the
    above program. The %Y will be replaced by the month without the century. The %m
    will be replaced by the month as a decimal number between 01 and 12 and so on.
    The complete list of such specifications can be found in the Python Reference
    Manual (https://docs.python.org/dev/3.0/library/time.html#time.strftime).


    We create the name of the zip file using the function that concatenates the strings
    i.e. joins the two strings and returns a new one. Then, we create a string zip
    which contains the command that we are going to execute. You can check if this
    works by running it on the shell (Linux terminal or DOS prompt).


    The zip command that we use has some options and parameters pass. The -q option
    is used to indicate that the zip command should work quietly. The -r option specifies
    that the zip command should work recursively for directories i.e. it should include
    all the subdirectories and files. The two options are combined and specified in
    a shortcut as -qr. The options are followed by the name of the archive to create
    followed by the list of files and directories. We convert the source list into
    a string using the join method of strings which we have already seen before.


    Then, we run the command using the os.system function which runs the command as
    if it was run from the system i.e. in the shell - it returns 0 if the command
    was successfully, else it returns an error number.


    Depending on the outcome of the command, we print the appropriate message that
    the backup has failed or succeeded.


    That''s, we have created a script to take a backup of our important files!


    # Note to Windows Users


    Instead of doubleslash escape you can also use raw strings like ''C:\Documents''
    or r''C:\Documents''. However, do not use ''C:\Documents'' since you end up using
    an unknown sequence D.


    Now that we are writing a backup script, we can use it when we want to take a
    backup of the files. Linux/Unix users are advised to use the executable method
    as discussed earlier so they can run the backup script anytime anywhere. This
    is called the operation phase or the deployment phase of the software.


    The above program works properly, (usually) first programs do not work as you
    expect. For example, there might be problems if you have not designed the program
    properly or if you have made a mistake in typing the code, etc. Appropriately,
    you will have to go back to the design phase or you will have to debug your program.'
