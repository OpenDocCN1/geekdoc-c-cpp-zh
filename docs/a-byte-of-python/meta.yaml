  - "[PAGE 54]\n\n# Python en:Modules\n\n# Introduction\n\nYou have seen how you can\
    \ reuse code in your program by defining functions once. What if you wanted to\
    \ reuse a number of functions in other programs that you write? As you might have\
    \ guessed, the answer is modules.\n\nThere are various methods of writing modules,\
    \ but the simplest way is to create a file with .py extension that contains functions\
    \ and variables.\n\nAnother method is to write the modules in the native language\
    \ in which the Python interpreter itself was written. For example, you can write\
    \ modules in the C programming language (http://docs.python.org/ending/) and when\
    \ compiled, they can be used from your Python code using the standard Python interpreter.\n\
    \nA module can be imported by another program to make use of its functionality.\
    \ This is how we can use the Python standard library as well. First, we will see\
    \ how to use the standard library modules.\n\nExample:\n\n```\n#!/usr/bin/python\n\
    # Filename: using_sys.py\nimport sys\n\nprint('The command line arguments are:')\n\
    for i in sys.argv:\n    print(i)\n\nprint('\\\\n\\nThe PYTHONPATH is', sys.path,\
    \ '\\\\n')\n```\n\nOutput:\n\n```\n$ using_sys.py we are arguments\nThe command\
    \ line arguments are:\nusing_sys.py\nwe\nare\narguments\n\nPYTHONPATH is ['',\
    \ 'C:\\Windows\\system32\\python30.zip',\n'C:\\Python30\\\\DLLs', 'C:\\Python30\\\
    \\lib\\plat-win', 'C:\\Python30',\n'C:\\Python30\\\\lib\\site-packages']\n```\n\
    \nHow It Works:\n\nFirst, we import the sys module using the import statement.\
    \ Basically, this translates to telling Python that we want to use this module.\
    \ The sys module contains functionality related to the Python interpreter and\
    \ its environment i.e. the system."
- md: "\n## Python Modules\n\nWhen Python executes the import sys statement, it looks\
    \ for the sys module. In this case, it is one of the built-in modules, and hence\
    \ Python knows where to find it.\n\nIf it was not a compiled module i.e. a module\
    \ written in Python, then the Python interpreter will search for it in the directories\
    \ listed in its sys.path variable. If the module is found, then the statements\
    \ in the body of that module are run and then the module is made available for\
    \ you to use. Note that the initialization is done only the first time that you\
    \ import a module.\n\nThe argv variable in the sys module is accessed using the\
    \ dotted notation i.e. sys.argv. It clearly indicates that this name does not\
    \ clash with any argv variable used in your program. Another advantage of this\
    \ approach is that the sys.argv variable is a list of strings (lists explained\
    \ in detail in a later chapter). Specifically, the sys.argv contains the list\
    \ of command line arguments i.e. the arguments passed to your program using the\
    \ command line.\n\nIf you are using an IDE to write and run these programs, look\
    \ for a way to specify command line arguments to the menu.\n\nHere, when we execute\
    \ python sys.py we run the module using_sys.py with the python command and the\
    \ other things that follow are arguments passed to the program. Python stores\
    \ the command line arguments in the sys.argv variable for us.\n\nRemember, the\
    \ name of the script running is the first argument in the sys.argv list. In this\
    \ case we will have 'using.py' as sys.argv[0], 'we' as sys.argv[1], 'are' as sys.argv[2]\
    \ and 'arguments' as sys.argv[3]. Notice Python starts counting from 0 and not\
    \ 1.\n\nThe sys.path contains the list of directory names where modules are imported\
    \ from. Observe that the first string in sys.path is empty; this string indicates\
    \ that the current directory is also part of the sys.path which is same as the\
    \ PYTHONPATH environment variable. This means that you can directly import modules\
    \ located in the current directory. Otherwise, you will have to place your module\
    \ in one of the directories listed in sys.path.\n\nNote that the current directory\
    \ is the directory from which the program is launched. Run `import os; print (os.getcwd())`\
    \ to find out the current directory of your program.\n\n## Byte-compiled .py files\n\
    \nImporting a module is a relatively costly affair, so Python does some tricks\
    \ to make it faster. One way is to create byte-compiled files with the extension\
    \ .pyc which is an intermediate format that Python transforms the program into\
    \ (remember the introduction section on how Python works?). This .pyc file is\
    \ useful when you import the module next time from a different program - it will\
    \ be much faster since portion of the processing required in importing a module\
    \ is already done. Also, these byte-compiled files are platform-independent.\n\
    \n## Note\n\n.pyc files are usually created in the same directory as the corresponding\
    \ .py files. If Python does not have permission to write files to that directory,\
    \ then the .pyc files will not be created.\n\n## The from ... import ...\n\nIf\
    \ you want to directly import the argv variable into your program (to avoid typing\
    \ the sys, everytime for it), then you can use `from sys import argv`. If you\
    \ want to import all the names used in the sys module, then you can use the `from\
    \ sys import *` statement. This works for any module.\n\nIn general, you should\
    \ avoid using this statement and use the import statement instead of your program\
    \ will avoid name clashes and will be more readable.\n\n## A module's _name_\n\
    \nEvery module has a name and statements in a module can find the name of it run\
    \ module. This is handy in the particular situation of figuring out the module\
    \ is being run standalone or being imported. As mentioned previously, when a module\
    \ is imported for the first time, the code in that module is executed. We can\
    \ use this concept to alter the behavior of the module if the program was run\
    \ by itself and not when it was imported from another module. This can be achieved\
    \ using the _name_ attribute of the module.\n\nExample:\n\n```python\n#!/usr/bin/python\n\
    # Filename: using_name.py\n\nif __name__ == '__main__':\n    print('This program\
    \ is being run by itself')\nelse:\n    print('I am imported from another module')\n\
    ```\n\nOutput:\n\n```\n$ python using_name.py\nThis program is being run by itself\n\
    \n$ python\n>>> import using_name\nI am being imported from another module\n>>>\n\
    ```\n\nHow It Works:\n\nEvery Python module has __name__ defined and if this is\
    \ '__main', it implies that the module is being run standalone by the user and\
    \ we can take appropriate actions.\n\n## Making Your Own Modules\n\nCreating your\
    \ own modules is easy, you've been doing it all along! This is because every Python\
    \ program is also a module. You just have to make sure it has a .py extension.\
    \ The following example should make clear.\n\nExample:\n\n```python\n#!/usr/bin/python\n\
    # Filename: mymodule.py\n\ndef sayhi():\n    print('Hi, this is mymodule speaking.')\n\
    \n__version__ = '0.1'\n\n# End of mymodule.\n```\n\nThe above was a sample module.\
    \ As you can see, there is nothing particularly special compared to our usual\
    \ Python program. We will next see how to use this module in our other Python\
    \ programs.\n\nRemember that the module should be placed in the same directory\
    \ as the program that we import it in, or the module should be in one of the directories\
    \ listed in sys.path.\n\n```python\n#!/usr/bin/python\n# Filename: mymodule_demo.py\n\
    \nimport mymodule\n\nmymodule.sayhi()\nprint('Version', mymodule.__version__)\n\
    ```\n\nOutput:\n\n```\nHi, this is mymodule speaking.\nVersion 0.1\n```\n\nHow\
    \ It Works:\n\nNotice that we use the dotted notation to access members of the\
    \ module. Here is the from import syntax:\n\n```python\n#!/usr/bin/python\n# Filename:\
    \ mymodule_demo.py\n\nfrom mymodule import sayhi, __version__\n\nsayhi()\nprint(__version__)\n\
    ```\n\n## Python Modules\n\nThe output of mymodule_demo.py is same as the output\
    \ of mymodule. Notice that if there was already a __version__ name declared in\
    \ the module that imports, there would be a clash. This is also likely because\
    \ it is common practice for each module to declare its version number using this\
    \ name. Hence, it is always recommended to prefer the import statement even though\
    \ it might make your program a little longer. You could also use:\n\n`from mymodule\
    \ import *` This will import all public names such as sayhi but not import __version__\
    \ because it starts with double underscores.\n\n## Zen of Python\n\nOne of Python's\
    \ guiding principles is that \"Explicit is better than Implicit\". Run import\
    \ this to learn more and see this discussion (http://stackoverflow.com/questions/228181/zen-of-python)\
    \ which lists examples for each of the principles.\n\n## The dir function\n\n\
    You can use the built-in dir to list the identifiers that an object defines. For\
    \ example, for a module, the identifiers include the functions, classes and variables\
    \ defined in that module.\n\nWhen you supply a module name to the dir() function,\
    \ it returns the list of names defined in that module. When no argument is applied\
    \ to it, it returns the list of names defined in the current module.\n\nExample:\n\
    \n```python\n>>> import sys # get list of attributes, in this case, for the sys\
    \ module\n\n>>> dir(sys)\n['_displayhook', '__doc', '__exception', '__name', '__package',\
    \ '_stdin', '_stdout', '_clear_type_cache', '_current_frames', '_getframe', '_api_version',\
    \ '_argv', '_builtin_module_names', 'byteorder', '_call_tracing', '_callstats',\
    \ '_copyright', '_displayhook', '_ddllhandle', '_dont_bytecode', '_exc_info',\
    \ '_exception', '_exec_prefix', '_executable', '_exit', '_flags', '_float_info',\
    \ '_getcheckinterval', '_getdefaultencoding', '_getprofile', '_getrecursionlimit',\
    \ '_getrefcount', '_getsizeof', '_gettrace', '_getwindowsversion', '_hexversion',\
    \ '_intern', '_maxsize', '_maxunicode', '_meta_path', 'modules', '_path', '_path_hooks',\
    \ '_path_importer_cache']\n```\n"
  mdcn: "\n\n## Python 模块\n\n当 Python 执行 `import sys` 语句时，它会寻找 `sys` 模块。在这种情况下，它是内置模块之一，因此\
    \ Python 知道去哪里找到它。\n\n如果它不是一个编译后的模块（即用 Python 编写的模块），那么 Python 解释器将在其 `sys.path`\
    \ 变量列出的目录中搜索它。如果找到了该模块，将运行该模块体中的语句，然后提供该模块供你使用。请注意，初始化只会在你第一次导入模块时进行。\n\n`sys`\
    \ 模块中的 `argv` 变量通过点符号语法访问，即 `sys.argv`。这清楚地表明该名称不会与你程序中使用的任何 `argv` 变量发生冲突。这种方法的另一个优势是\
    \ `sys.argv` 变量是一个字符串列表（列表将在后面的章节中详细解释）。具体来说，`sys.argv` 包含了命令行参数列表，即通过命令行传递给程序的参数。\n\
    \n如果你正在使用 IDE 编写和运行这些程序，请寻找一种可以在菜单中指定命令行参数的方法。\n\n在这里，当我们执行 `python sys.py` 时，我们使用\
    \ `python` 命令运行了 `using_sys.py` 模块，其他内容都是传递给程序的参数。Python 为我们将命令行参数存储在 `sys.argv`\
    \ 变量中。\n\n记住，运行的脚本名称是 `sys.argv` 列表中的第一个参数。在这种情况下，我们将 'using.py' 作为 `sys.argv[0]`，'we'\
    \ 作为 `sys.argv[1]`，'are' 作为 `sys.argv[2]`，'arguments' 作为 `sys.argv[3]`。注意 Python\
    \ 从 0 开始计数而不是 1。\n\n`sys.path` 包含了导入模块的目录列表。注意 `sys.path` 中的第一个字符串是空的；这个字符串表示当前目录也是\
    \ `sys.path` 的一部分，这与 `PYTHONPATH` 环境变量相同。这意味着你可以直接导入当前目录下的模块。否则，你必须将你的模块放在 `sys.path`\
    \ 列出的目录之一。\n\n请注意，当前目录是启动程序时的目录。运行 `import os; print (os.getcwd())` 来查找你程序的当前目录。\n\
    \n## 字节编译的 .py 文件\n\n导入模块是一项相对昂贵的操作，因此 Python 使用了一些技巧来提高运行速度。一种方法是创建带有 `.pyc`\
    \ 扩展的字节编译文件，这是 Python 将程序转换的中间格式（记得关于 Python 如何运行的引言部分吗？）。当你下次从另一个程序导入该模块时，这个\
    \ `.pyc` 文件将非常有用——它会快得多，因为导入模块所需的的部分处理已经完成。此外，这些字节编译文件是平台无关的。\n\n## 注意\n\n`.pyc`\
    \ 文件通常在与相应的 `.py` 文件相同的目录中。如果 Python 没有权限向该目录写入文件，则不会创建 `.pyc` 文件。\n\n## The from\
    \ ... import ...\n\n如果你想直接将 `argv` 变量导入你的程序中（以避免每次都输入 `sys`），你可以使用 `from sys import\
    \ argv`。如果你想导入 `sys` 模块中使用的所有名称，可以使用 `from sys import *` 语句。这适用于任何模块。\n\n通常情况下，你应该避免使用此语句，而代之使用\
    \ `import` 语句，这样你的程序将避免名称冲突并具有更高的可读性。\n\n## 模块的 _name_\n\n每个模块都有一个名称，模块中的语句可以找到运行模块的名称。这在确定模块是独立运行还是被导入的特殊情况下非常有用。如之前提到的，当模块被首次导入时，该模块中的代码会被执行。我们可以利用这个概念，在程序由自己运行而不是从另一个模块导入时改变模块的行为。这可以通过模块的\
    \ `_name_` 属性来实现。\n\n示例：\n\n```python\n#!/usr/bin/python\n# Filename: using_name.py\n\
    \nif __name__ == '__main__':\n    print('This program is being run by itself')\n\
    else:\n    print('I am imported from another module')\n```\n\n输出：\n\n```\n$ python\
    \ using_name.py\nThis program is being run by itself\n\n$ python\n>>> import using_name\n\
    I am being imported from another module\n>>>\n```\n\n工作原理：\n\n每个 Python 模块都定义了\
    \ `__name__`，如果它的值为 `'__main__'`，则意味着该模块正由用户独立运行，我们可以采取适当的操作。\n\n## 创建你自己的模块\n\
    \n创建你自己的模块很容易，你一直都在做这件事！因为每个 Python 程序也是一个模块。你只需要确保它具有 `.py` 扩展名。下面的示例应该会得很清楚。\n\
    \n示例：\n\n```python\n#!/usr/bin/python\n# Filename: mymodule.py\n\ndef sayhi():\n\
    \    print('Hi, this is mymodule speaking.')\n\n__version__ = '0.1'\n\n# End of\
    \ mymodule.\n```\n\n上面是一个示例模块。你可以看到，它与我们通常的 Python 程序相比并没有特别的。接下来我们将查看如何在其他 Python\
    \ 程序中使用此模块。\n\n记住，模块应该放置在我们导入它的程序所在的目录中，或者模块应该放在 `sys.path` 列出的目录之一。\n\n```python\n\
    #!/usr/bin/python\n# Filename: mymodule_demo.py\n\nimport mymodule\n\nmymodule.sayhi()\n\
    print('Version', mymodule.__version__)\n```\n\n输出：\n\n```\nHi, this is mymodule\
    \ speaking.\nVersion 0.1\n```\n\n工作原理：\n\n注意我们使用点符号访问模块的成员。这里是 `from` 语法：\n\n\
    ```python\n#!/usr/bin/python\n# Filename: mymodule_demo.py\n\nfrom mymodule import\
    \ sayhi, __version__\n\nsayhi()\nprint(__version__)\n```\n\n## Python 模块\n\n`mymodule_demo.py`\
    \ 的输出与 `mymodule` 相同。注意，如果导入的模块中已经声明了 `__version__` 名称，就会发生冲突。这也可能是因为每个模块的惯例使用该名称来声明版本号。因此，始终建议使用\
    \ `import` 语句，即使这可能会让你的程序变长。你也可以使用：\n\n`from mymodule import *` 这将导入所有公共名称如 `sayhi`，但不会导入\
    \ `__version__`，因为它以双划线开头。\n\n## Python 之禅\n\nPython 的指导原则之一是“显式优于隐式”。运行 `import\
    \ this` 来了解更多信息并查看此讨论 (http://stackoverflow.com/questions/228181/zen-of-python)，该讨论列出了每个原则的示例。\n\
    \n## dir 函数\n\n你可以使用内置的 `dir` 来列出对象定义的标识符。例如，对于模块，标识符包括在该模块中定义的函数、类和变量。\n\n当你向\
    \ `dir()` 函数提供模块名时，它返回该模块中定义的名称列表。当不对应用任何参数时，它返回当前模块中定义的名称列表。\n\n示例：\n\n```python\n\
    >>> import sys # 获取属性列表，在此例中是 sys 模块\n\n>>> dir(sys)\n['_displayhook', '__doc',\
    \ '__exception', '__name', '__package', '_stdin', '_stdout', '_clear_type_cache',\
    \ '_current_frames', '_getframe', '_api_version', '_argv', '_builtin_module_names',\
    \ 'byteorder', '_call_tracing', '_callstats', '_copyright', '_displayhook', '_ddllhandle',\
    \ '_dont_bytecode', '_exc_info', '_exception', '_exec_prefix', '_executable',\
    \ '_exit', '_flags', '_float_info', '_getcheckinterval', '_getdefaultencoding',\
    \ '_getprofile', '_getrecursionlimit', '_getrefcount', '_getsizeof', '_gettrace',\
    \ '_getwindowsversion', '_hexversion', '_intern', '_maxsize', '_maxunicode', '_meta_path',\
    \ 'modules', '_path', '_path_hooks', '_path_importer_cache']\n```\n\n"
