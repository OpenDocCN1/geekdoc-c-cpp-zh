    ### 单引号


    你可以使用单引号来指定字符串，例如 ''Quote on this''。所有的空白字符（即空格和制表符）都会原样保留。


    ### 双引号


    使用双引号的字符串工作方式与使用单引号的字符串完全相同。例如 "What''s your name?"。


