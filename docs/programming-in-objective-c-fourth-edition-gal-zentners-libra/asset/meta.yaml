    对象将包含播放列表名称和一组歌曲。`MusicCollection` 对象将包含一组播放列表，其中包含一个名为 `library` 的特殊主播放列表（master
    playlist），它包含了集合中的所有歌曲。定义这三个类并编写方法以完成以下操作：
