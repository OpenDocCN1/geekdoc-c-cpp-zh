    The development of the mathematical properties of nominal sets has from the outset
    gone hand-in-hand with axiomatizing the properties of the key notions – permutation
    action, support, freshness and name abstraction – within various kinds of logic.
    Table 12.1 gives some pointers to the literature on nominal logics. In this chapter
    we concentrate on computational aspects of these logics. More specifically, we
    take a brief look at algorithms for solving equations over nominal algebraic data
    types. This has led to various forms of term rewriting and logic programming with
    syntactic data binders.


    Table 12.1 Nominal logics.


    | Set theory | Gabbay (2000); Gabbay and Pitts (2002). |

    | Higher-order logic | Gabbay (2002); Urban (2008). |

    | First-order logic | Pitts (2003); Gabbay and Cheney (2004); Cheney (2005b);
    Gabbay and Mathijssen (2008). |

    | Equational logic | Clounston and Pitts (2007); Mathijssen (2007); Fiore and
    Hur (2008); Clounston (2009); Gabbay and Mathijssen (2009); Kurz et al. (2010).
    |

    | Constructive type theory | Schöpp and Stark (2004); Schöpp (2006); Westbrook
    (2008); Westbrook et al. (2009); Cheney (2012). |


