    \mathbb{A}$ and derive a contradiction. Let $S$ be the cofinite set $\mathbb{A}-A$.
    From Proposition 2.9 we have that $S \in P_{nefs}\mathbb{A}$; and, being finite,
    $S$ is in particular non-empty. We can then apply $c$ to $S$ to get an atomic
    $a_0 \doteq c S = S = \mathbb{A}-A$. Let $U \cup \{a_0\}$ be infinite and $\mathbb{A}$
    is infinite, so we have $a_1 \in \mathbb{A}-(U \cup \{a_0\}) \subseteq S$. Since
    $a_0, a_1 \in \mathbb{A}$, we have $(a_0 \cdot a_1) \cdot c = S$; and since A
    supports $c$ of the Perm $\mathbb{A}$-action on $(P_{nefs}\mathbb{A}), (a_0 \cdot
    a_1) \cdot (cS) = ((a_0 \cdot a_1) \cdot S) = S$. Therefore $a_1 = (a_0 \cdot
    a_1) \cdot a_0 = (a_0 \cdot a_1) \cdot (cS) = CS = S$, contradicting the fact
    that $a_1$ was chosen to be distinct from $a_0$.'
