  md: '# 11

    Domain theory


    Chapter 10 considered functional programming with data involving names and name
    abstractions. The new language features introduced in that chapter were motivated
    by the theory of nominal sets introduced in Part One of the book. We encouraged
    the reader to think of the type and function expressions of the FreshML functional
    programming language as describing nominal sets and finely supported functions
    between them. However, just as conventional functional programming, the sets-and-functions
    viewpoint is too naive, because of the facilities these languages provide for
    making recursive definitions. Giving a compositional semantics for such language
    features requires solving fixed-point equations at both the level of types (for
    recursively defined data types) and the level of expressions of some type (for
    recursively defined functions). As is well known, solutions to these fixed-point
    equations cannot always be found within the world of sets and totally functions;
    and this led the leaders of denotational semantics to construct mathematical models
