  md: '# Preface


    Set-valued functors on the category Inj of injective functions between finite
    ordinals; see (Stark, 1994, p. 59). This functor category was well known to me
    from to theory (Johnstone, 2002), where it is called the Schanuel topos. It is
    an example of atomic topos (Barr and Diaconescu, 1980), which relates to models
    of higher-order Boolean algebra and propositional logic; and it hosts the generic
    model of the geometric theory of infinite decidable object (Šcedrov, 1984).


    A few years later I returned to considering the Schanuel topos with another Ph.D.
    student, Jamie Gabbay, this time as a setting for algebra semantics modulo α-equivalence.
    Preferring set theory to category theory, Gabbay pushed us towards another presentation
    of the Schanuel topos in terms of continuous actions of the group of permutations
    of the set N natural numbers (topologized as a subspace of the product of countably
    copies of N). In this there is an obvious connection with the cumulative hierarchy
    of sets (with atoms) that are hereditarily supported with respect to the action
    of permuting atoms; this universe of sets was devised by Fraenkel and Mostowski
    in the first part of the twentieth century to model ZFA set without axioms of
    choice. Whether one emphasizes set theory or category theory, the move from using
    sets on Inj with a continuous action of the group G of permutations of N was fruitful
    in several ways. For example, it makes higher-order constructions in the topos
    easier to describe.


    However, the move from sheaves to G-sets was initially problematic in one important
    respect. We were studying semantics for syntax α-equivalence in terms of initial
    algebras for combining products and sets with a function δ for binding. This has
    a simple description for Set-valued functors on Inj, one which corresponds to
    the shift operation used by Bruijn style representations of syntax: the value
    of δ X at n ∈ Inj is the value of X at n+1. This functor features prominently
    in the work of Fiore et al. (1999), which uses presheaf categories to model abstract
    syntax with variable binding which was taking place in parallel to our work. (An
    account of this, of related semantic analysis of higher-order abstract syntax
    by Hofmann (1999), and of our ''nominal'' work (Gabbay and Pitts, 1999), all appeared
    in the same Symposium on Logic in Computer Science.) If one uses G-sets instead
    of Set-valued functors on Inj, what does δ look like? Our first answers were not
    very helpful. But then we realized that the elements of δ X (or [δ]X as it is
    denoted in this book) can be described as equivalence classes for a relation that
    captures the essence of α-equivalence just via the permutation action, independently
    of the nature of'
