  md: '# 0.3 Abstract syntax with binders


    We turn next to the topic that was the original stimulus for developing the theory
    of nominal sets.


    # 0.3 Abstract syntax with binders


    When defining a programming language it is customary to specify its concrete syntax
    using context-free grammars that generate the strings of symbols that are legal
    phrases in the language. Definitions of concrete syntax have to deal with many
    issues to do layout, punctuation and comments that are relevant to the meaning
    of programs. If one is primarily concerned with the semantics of programming languages,
    then what matters the language’s abstract syntax in terms of parse trees. The
    use of abstract syntax trees enables two fundamental and inter-linked tools in
    programming language semantics: the definition of functions on syntax by recursion
    over the structure of trees; and proofs of properties of syntax by induction on
    the structure of trees. These techniques have their origin in the classical notions
    of primitive recursion and for the natural numbers, which were extended to abstract
    syntax trees by Burstall (1969), Martin-Löf (1971) and others.


    However, abstract syntax trees and their associated structural recursion and induction
    principles are in one important respect not sufficiently abstract. They do not
    take into account that some syntax constructors involve binding atomic names to
    specific scopes. Various schemes have been devised for specifying binding information.
    One popular option is to use some form of $\lambda$-calculus (Church, 1940) as
    a meta-language and express binding forms of the object-language in terms of function
    abstraction at the meta-level (Pening and Elliott, 1988; Harper et al., 1993;
    Miller, 2000). Some forms of binding do not fit comfortably into this approach;
    see the discussion in (Sewell et al., 2010, section 3), which describes a flexible
    mechanism for incorporating binding information in grammars that is part of the
    Ott tool. Whatever approach is taken, such binding specifications tell us that
    abstract trees differ only by consistent renaming of bound names. This is the
    relation of $\alpha$-equivalence, generalized from its original use in $\lambda$-calculus.


    To be a ‘binder’ should have the property that for any reasonable definition of
    the language’s semantics, $\alpha$-equivalent phrases have equal meanings. Thus
    in the presence of binders, syntax-manipulating operations only respect meaning
    if one operates on syntax at a level of abstraction that respects $\alpha$-equivalence.
    It is natural to regard $\alpha$-equivalence classes of parse trees, rather than
    the trees themselves, as the true abstract syntactical structures which are assigned'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Introduction


    meaning in equivalence. The problem is that unlike syntax trees, their $\alpha$-equivalence
    classes are in infinite sets and so require indirect methods of construction,
    computation and proof.


    One round this problem is to devise a scheme for canonical representations of
    $\alpha$-equivalence classes; for example by using indexes instead of names in
    binders, de Bruijn (1972). The well-known disadvantage of this device is that
    it necessitates a calculus of operations on de Bruijn indices does not have much
    to do with our intuitive view of the structure of syntax. As a result there can
    be a ‘coding gap’ between statements of results about syntax with bound names
    and their de Bruijn versions – and hence it is easy to get things wrong. For this
    reason, most work on programming language semantics that is intended for human
    reader than machine consumption sticks with abstract syntax trees involving bound
    names and uses an informal approach to $\alpha$-equivalence classes. Yet there
    is a pressing need for fully formal methods when proving properties of program
    semantics, caused by the high assurance of correctness in situations where lives
    or finances are at risk, or by complexities of scale, or both.


    The informal approach is usually signalled by a form of words such as ‘we identify
    expressions up to $\alpha$-equivalence’; see for example Harper (2013, section
    1.2) and Remark 10 in this book. In this informal approach, one does not make
    any not distinction between an α-equivalence class and some representative of
    it; and if that representative is later used in context where its particular bound
    names clash in some way with those in the context, then it is changed to an α-equivalence
    expression whose bound names are fresh. The theory of nominal sets, with its notion
    of freshness, is able to fully formalize these common informal practices with
    bound names via the notion of name abstraction, discussed next.


    # 0.4 Name abstraction


    As described above, nominal sets provide a theory of implicit dependence on names
    (support) and name independence (freshness) based upon the action of name permutations
    on structures. If one wishes to make explicit how a structure depends upon a name,
    the traditional approach is to abstract and form a function from names to structures.
    What a ‘function from names to structures’ depends upon the strength of the ambient
    logical formalism. The notion of function is not as absolute as, say, the notion
    of ‘ordered pair’. This has a complicating effect on logical systems that combine
    functional representations of binders in abstract syntax with computable functions'
  merge: -1
