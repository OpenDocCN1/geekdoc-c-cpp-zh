    **Lemma 1.14 (Homogeneity lemma)** For any finite subsets $S, S'' \in P_t A$ and
    any bijection $f : S \to S''$, there exists $\pi \in \text{Perm } A$ that extends
    $f$ to a bijection on the whole of $A$ and is the identity over $S \cup S''$


    ```

    $(\forall a \in S) \pi a = f a \quad (\forall a \in A - (S \cup S'')) \pi a =
    a$

    ```


    *Proof* Since $S$ and $S''$ are finite sets with the same cardinality, $|S'' -
    S| = |S''| - |S \cap S''| = |S| - |S \cap S''| = |S'' - S''|$. So one can find
    a bijection $f'' : (S'' - S) \cong (A - S'')$ defined by


