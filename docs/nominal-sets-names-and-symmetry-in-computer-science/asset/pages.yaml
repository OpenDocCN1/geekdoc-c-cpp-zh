    names. Which particular set did we mean? For definiteness, we chose $\mathcal{A}
    = \mathbb{N} = \{0, 1, 2, \dots\}$ of natural numbers, but we never made of that
    choice. Instead, we referred to elements of $\mathcal{A}$ via metvariables $a,
    b, c, \dots$ and used the normal convention that statements involving metvariables
    are implicitly quantified, with explicit conditions on the metavariables as $a
    \neq b$ added as necessary. This corresponds to the use in aML (Lakin and Pitts,
    2009) of variables of name sort whereas use of atomic names in the syntax of nominal
    terms corresponds to a vernacular in which metvariables of name sort are implicitly
    quantified over $\mathcal{U}$ rather than $\mathcal{V}$; so distinct metavariables
    always refer to distinct atomic names – Jamie Gabbay 따로 the ''permutative convention''
    (Gabbay, 2011, section 1.3).


    # Exercises


    +   12.1 Show that the judgements (12.10) and (12.11) have the following properties:


    ```

    $\forall a \neq t \Rightarrow \forall \pi \# a \neq t$,$

    $(\forall a \in \mathcal{A}) a \neq \pi \# a'' \approx \forall a \# t \Rightarrow
    \forall \pi \# t \approx \pi'' \* t$,$

    $\forall a \approx t \wedge \forall t \approx t'' \Rightarrow \forall a \approx
    t''$,

    $\forall t \approx t$,

    $\forall t \approx t'' \wedge \forall t'' \approx t$,

    $\forall t \approx t'' \Rightarrow \forall t \approx t''$,

    $\forall t \approx t'' \Rightarrow \forall \pi \neq t \approx \pi'' \* t$.

    ```


    +   12.2 Use the algorithm from the proof of Theorem 12.9 to calculate most general
    solutions to nominal unification problems corresponding to (12.2) and (12.3).'
