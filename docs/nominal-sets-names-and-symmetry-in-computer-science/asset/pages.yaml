    # Acknowledgements


    My biggest debt is to the co-founder of the theory of nominal sets, Jamie Gabbay,
    who has done so much to develop and promote the subject. I also thank my co-authors
    and collaborators on this topic: James Cheney, Ranald Clouston, Maribel Fernández,
    Matthew Lawik, Steffen Lösch, Mark Shwind, and Christian Urban. This is the first
    book to give account of the (Part One) and applications (Part Two) of nominal
    sets. Original sources are cited in the text as appropriate. Some material appears
    for the first time: free restriction sets (Section 9.5); the use of a bi-orthogonal
    closed, step-indexed logical relation within nominal sets to prove correctness
    properties of FreshML (Section 10.11); and a construction for minimal invariant
    solutions of recursive domain equations for uniform directed complete posets (Section
    11.4).


    I am particularly pleased to be able to begin the Introduction with a quote by
    the late Roger Needham; he gave me, a mathematician at the time, my first job
    in a computer science department.


    I am grateful to all those who have endured lectures on the subject matter of
    this book and given useful feedback, not least the members of the *FreshML and
    Computational Aspects of Nominal Sets* projects and the participants of the 2011
    Midland Graduate School.


    The book has been improved by comments and corrections from Johan Glimming, Steffen
