  md: "# 9.4 $\\lambda$-Calculus\n\n**Remark 9.9** **Res** is not only a cartesian\
    \ closed category, it is fact in Grothendieck topos (Johnstone, 2002). This is\
    \ a consequence of an unpublished observation by S. Stanton that **Res** is equivalent\
    \ to the functor [Inj.Set]. Here **Inj** is the category whose objects are finite\
    \ ordinals and morphisms are injective partial functions; see Exercise 9.7. This\
    \ result should be compared with the better known equivalence of **Nom** with\
    \ the Schanuel topos, described in Section 6.3.\n\n# 9.4 $\\lambda$-Calculus\n\
    \nIt turns out the way name restriction operations are defined on pairs and functions\
    \ in Theorems 9.6 and 9.7 corresponds to an existing, somewhat neglected, notion\
    \ of locally scoped names in the presence of higher-order functions due to Odersky\
    \ (1994). Odersky's $\\lambda$-calculus adds to the $\\lambda$-calculus (with\
    \ pairs and booleans) names and expressions $va$ for localizing the identity of\
    \ a name $a$ to an expression $e$. The usual reduction relation $e \rightarrow\
    \ e'$ for $\\lambda$-calculus is extended with new reductions that explain how\
    \ the binder $va$ interacts with booleans, names, pairs and functions:\n\n```\n\
    $va.\\ \text{true} \rightarrow \text{true},$ (9.18)\n$va.\\ \text{false} \rightarrow\
    \ \text{false},$ (9.19)\n$va.\\ a' \rightarrow a' \\text{ if } a \neq a',$ (9.20)\n\
    $va.\\ (e_1, e_2) \rightarrow (va.\\ e_1, va.\\ e_2),$ (9.21)\n$va.\\ \\lambda\
    \ x. e \rightarrow \\lambda x. e.$ (9.22)\n```\n\nNote that scopes are pushed\
    \ inwards through data structures as reduction proceeds. This is in contrast to\
    \ the more common form of locally naming involving dynamic allocation of fresh\
    \ names that we discuss in Section 9.6, where scopes of local names extend during\
    \ evaluation. The relationship between the reduction (9.21) and the way we defined\
    \ name restriction for pairs in Theorem 9.6 is clear. Not so clear is the precise\
    \ relation between the name operation for functions in Theorem 9.7 and the reduction\
    \ (9.22). To explain it, we extract from Pitts (2011, 3.2) the nominal sets semantics\
    \ for a simply typed version of the $\\lambda$-calculus. The language's syntax\
    \ is given in Figure 9.1.\n\nThe calculus contains two sets of identifier, variables\
    \ $x \\in Var$ and names $a \\in A$. We assume the countably infinite set of variables\
    \ $Var$ is disjoint from $A$ and is partitioned into countably infinite subsets\
    \ $Var(T)$, where $T$ ranges over the set $Type$ of types; the elements of each\
    \ $Var(T)$ are the variables of $T$."
