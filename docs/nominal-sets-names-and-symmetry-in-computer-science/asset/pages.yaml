    \ It has been known since the beginning of work on nominal techniques (Gabbay\
    \ and Pitts, 1999, section 6) that nominal sets are equivalent to special kinds\
    \ of presheath satisfying a condition equivalent to pullback preservation. The\
    \ category of such sheaves is known as the Schanuel topos, because Schanuel has\
    \ the same category-theoretic properties as Nom, the emphasis that the latter\
    \ puts on permutations of names has proved very fruitful.\n\nWe give the equivalence\
    \ between Nom and the Schanuel topos. For background on categories of presheaves\
    \ and sheaves MacLane and Moerdijk (1992), or volume three of the encyclopaedic\
    \ work of Boreux (2008).\n\n**Definition 6.3** Let C be a small category. A (covariant)\
    \ presheath on C is a functor $F : C \\rightarrow Set$. Such an F acts on the\
    \ objects A and morphisms $f : A \\rightarrow B$ of C to produce sets $FA$ and\
    \ functions $Ff : FA \\rightarrow FB$, preserving identities ($Fid_{A} = \text{id}_{FA}$)\
    \ and composition ($F(g \\circ f) = Fg \\circ F$). Presheaves are the objects\
    \ of the category [C, Set] whose morphisms $\\alpha : F \\rightarrow F'$ are natural\
    \ transformations that, for each morphism $f : A \\rightarrow B$ in C the following\
    \ sequence of functions commutes:\n\n```\n$$\\begin{matrix} FA & \\xrightarrow{\\\
    alpha} & F'A \\ Ff \\downarrow & & \\downarrow F'f \\ FB & \\xrightarrow{\\alpha}\
    \ & F'B \\end{matrix}$ (6.13)$\n```\n\n**Remark 6.4** In Chapter 1 we used the\
    \ notation [G, Set] for the category of G-sets and equivariant functions associated\
    \ with a group G. As the notation suggests, this is a special case of a presheath\
    \ category, where we regard G as the morphisms of a category with a single object.\n\
    \n**Definition 6.5** Let I be the category whose objects are finite subsets of\
    \ the fixed set $\\mathbb{A}$ of atomic names and whose morphisms are injective\
