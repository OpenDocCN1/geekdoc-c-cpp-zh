  md: '# Cambridge Tracts in Theoretical Computer Science 57


    Nominal Sets


    Nominal sets provide a promising new mathematical analysis of names in formal
    languages that is based upon symmetry. They have many applications to the syntax
    and semantics of programming language constructs that involve binding or localizing
    names. Part One provides an introduction to the basic theory of nominal sets.
    In Part Two, the author surveys some of the applications that have developed in
    programming language semantics (both operational and denotational), functional
    programming and logic programming.


    As the first book to give a detailed account of the theory of nominal sets, it
    will be welcomed by researchers and graduate students in theoretical computer
    science.


    ANDREW M. PITTS is Professor of Theoretical Computer Science at the University
    of Cambridge.'
