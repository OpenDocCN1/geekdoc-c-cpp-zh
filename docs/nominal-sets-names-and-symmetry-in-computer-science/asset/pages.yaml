  md: '# 9.1 The category of nominal restriction sets


    (Note that property (9.4) cannot be strengthened by dropping the condition $a_1
    \neq a_2$; see Exercise 9.1.)


    **Definition 9.2** A name restriction operation on a nominal set $X$ is a morphism
    $r \in \text{Nom}([\mathbb{A}], X)$ making the diagrams in (9.5) and (9.6) commute.
    A nominal set equipped with such an operation is called a *nominal restriction
    set*. We write $Res(X, r)$ for the category objects and whose morphisms $(X, r)
    \to (X'', r'')$ are equivariant functions $f : X \to X''$ that commute with the
    name restriction operations


    ![](img/5c770cd9fa5b6be8f8707497a7fcfbf4_170_0.png)


    **9.3** A nominal set can support several different name restriction operations
    (see Example 9.5). Nevertheless we usually refer to a nominal restriction set
    $(X, r)$ by its underlying nominal set $X$ and use a notation for the restriction
    operation: $a \in \mathbb{A}$ and $a \in X$, we write $a/r(a)$. With this notation
    (9.2) and (9.1) become


    > $$(a \in \mathbb{A}, x \in X) \ a \# x \Rightarrow a = x,$$


    > $$(a_1, a_2 \in \mathbb{A}, x \in X) \ a_1/(a_2 \setminus x) = a_2/(a_1 \setminus
    x).$$


    By (2.7) and Proposition 4.5 we have $a \notin \text{supp}(x) \neq \text{supp}(r(a))$
    and hence we also have


    > $$(a \in \mathbb{A}, x \in X) \ a \# a\x,$$


    Conversely, if an equivariant function $\setminus_ : \mathbb{A} \times X \to X$
    satisfies (9.8)-(9.10) then it induces an equivariant function $\setminus : [\mathbb{A}]X
    \to X$ (by Corollary 4.17) that makes (9.5) and (9.6) commute. This formulation
    of name restriction operations is sometimes more convenient than the one in Definition
    9.2 (and is the one used in Pitts, 2011).


    Here are two examples of name restriction operations. Even though they are rather
    simple, when combined with the constructions in Sections 9.2 and 9.3 they can
    result in non-trivial examples of nominal restriction sets (Exercise 9.2).


    **Example 9.4** The discrete nominal set on a set $X$ (Example 2.5) has a unique
    name restriction operation, necessarily satisfying $a\setminus x = x$.'
