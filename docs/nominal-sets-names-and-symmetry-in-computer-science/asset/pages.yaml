  md: '# 5

    Orbit-finiteness


    Taking account of symmetries to reduce the size of state spaces is an important
    technique in verification (see, for example, Clarke et al., 2000, chapter 14).
    An extreme case is the reduction of infinite data structures to finite ones by
    quotienting by a suitable notion of symmetry. In this book we are concerned with
    with symmetries induced by permuting the names that occur in a structure; and
    in this chapter we will look at the notion of ''finite modulo symmetry'' within
    the theory of nominal sets. This aspect of nominal sets first came to the fore
    in the work of Montanari and Pistore (2000) on $\pi$-calculus and HD automata,
    albeit not using nominal sets, but rather the equivalent notion of named sets
    (Ferrari et al., 2002); see Section 6.4. This has been subsumed and generalized
    in a program of what one might call ''orbit-finite'' automata theory (Bojajczyk
    et al., 2011; Gabbay and Ciancia, 2011; Tzevelekos, 2011; Bobojczyk and Lasota,
    2012; Murawski and Tzevelekos, 2012).


    These works provide a positive motivation for studying relaxations of the usual
    notion of finiteness in the context of nominal sets. The following theorem cuts
    the other way: restricting to finite sets rules out any non-trivial use of symmetry.


    **Theorem 5.1** Every nominal set is discrete.


    *Proof* Recall from 2.5 $X \in \mathbf{Nom}$ is said to be discrete if its permutation
    action is trivial, $(\pi \in \mathrm{Perm }, x \in X) \pi \cdot x = x$; and in
    view of Exercise 2.1, this is equivalent to having no element with a non-empty
    support. We have to show that if $X \in \mathbf{Nom}$ has a finite underlying
    set, then the support of each $x \in X$ is empty.


    Suppose $x \in X$ and that $x \neq \emptyset$, say $a \in \mathrm{supp.x}$. For
    any two atomic names $a'' \neq a''''$ satisfying $a'', a'''' \neq (a, x)$, by
    Proposition **2.11** we have


    ```

    $a'' \in \mathrm{supp}((a \ a'') \cdot x) \wedge a'' \neq \mathrm{supp}((a \ a'''')
    \cdot x),

    ```'
