  md: '# 7.4 Tarski''s fixed-point theorem


    # 7.4 Tarski''s fixed-point theorem


    A subset inductively defined by a set of rules (Section 7.1) is an instance of
    the notion of the ''least fixed-point of a monotone function on a complete lattice''.
    The advantage of this more abstract view of inductive definitions is that it smoothly
    dualizes to a notion of inductively defined subset. In this section we will recall
    the basic notions associated with fixed points of monotone functions; see chapter
    3 of Sangiorgi (2011) for a more leisurely introduction. Then we will examine
    how these concepts interact with the theory of nominal sets.


    **Definition 7.11** Recall that a partially ordered set (poset) is a set $D$ equipped
    with a partial order, a binary relation $\sqsubseteq$ on $D$ is:


    +   - reflexive: $(\forall d \in D) d \sqsubseteq d$;

    - transitive: $(\forall d, d'', d'''' \in D) d \sqsubseteq d'' \wedge d'' \sqsubseteq
    d'''' \Rightarrow d \sqsubseteq d'''';

    - anti-symmetric: $(\forall d, d'' \in D) d \sqsubseteq d'' \wedge d'' \sqsubseteq
    d \Rightarrow d = d''$.


    The poset is a complete lattice if every subset $S \in P$ possesses a join (least
    upper bound), that is an element $\sqcup S$ of $D$ satisfying


    Note that this property determines $\sqcup S$ uniquely, because of the anti-symmetric
    property of $\sqsubseteq$. Furthermore, the existence of all joins of subsets
    $S$ implies the existence of a meet (greatest lower bound) $\cap S$ for each subset
    $S \in PD$, satisfying the dual property


    ```

    $(\forall d \in D) (\(\forall d'' \in S) d'' \sqsubseteq d) \Rightarrow d \sqsubseteq
    \cap S. \quad (7.18)$

    ```


    (See Exercise 7.1.) If $(D, \sqsubseteq)$ is a poset, then a function $F : D \to
    D$ is monotone if it preserves the partial order


    ```

    $(\forall d, d'') d \sqsubseteq d'' \Rightarrow Fd \sqsubseteq F''. \quad (7.19)$

    ```


    An element $d \in D$ is a pre-fixed-point of $F$ if it satisfies $F d \sqsubseteq
    d$, a post-fixed-point if $d \sqsubseteq F d$, and a fixed-point if $F d = d$.


    The following is a very standard result; for a proof, see for example Winkel (1993,
    section 5.5).


    **Theorem 7.12 (Tarski''s fixed-point theorem)** For any monotone function $F
    : D \to D$ on a complete lattice there is an element $lfp F \in D$ which is a
    least pre-fixed-point for $F$:


    ```

    $(lfp F) \sqsubseteq lfp F . \n(\forall d \in D) Fd \sqsubseteq d \Rightarrow
    lfp F \sqsubseteq d . \quad (7.20)$

    ```'
