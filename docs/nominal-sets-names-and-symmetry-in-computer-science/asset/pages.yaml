    are all equivalent and give morphisms in [G, Set]. Indeed they map $X_1 \times
    \dots \times X_n$ into the categorical product of objects $X_i$ in [G, Set]. If
    $(F_i : X \to X_i \mid i=1, \dots, n)$ are equivariant functions, then the unique
    equivariant $\langle F_1, \dots, F_n \rangle : X \to X_1 \times \dots \times X_n$
    satisfying $proj_i \circ \langle F_1, \dots, F_n \rangle = F_i$ for $(i=1, \dots,
    n)$ is seen to be equivariant.


