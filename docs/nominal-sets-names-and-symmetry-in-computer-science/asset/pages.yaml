    # 9.6 $

    u$-Calculus


    The operational semantics of locally scoped names is commonly specified in terms
    of **dynamically allocated** fresh names, also known as *generative* names. This
    is a state-based explanation of the meaning of the scoped construct: to evaluate
    $va.e$ with a locally scoped name, the current state is augmented with a fresh
    name and the body $e$ of the $scope$ is evaluated with the scoped name $a$ bound
    to the fresh. The combination of this simple mechanism with other features, especially
    higher-order functions as occurs in the ML family of languages, can result in
    programs with very complicated behaviour. The $\nu$-calculus (Pitts and Stark,
    1993) was intended to make this possible, taking the measure of behaviour to be
    *contextual equivalence*, the relation between two expressions of being interchangeable
    in the context of any program without affecting the overall behaviour of the program.
    Syntactically, the $v$-calculus is the simply-typed $\lambda$-calculus with locally
    scoped names that we used for Odkers''s $\lambda$-calculus (Figure 9.1). Unlike
    Odkers''s $v$-calculus, the calculus is given an operational semantics that makes
    the fragment of Standard ML (Milner et al., 1997) by interpreting the type *Name*
    as the ML type `unit ref` of references to the unit value and taking $e$ to be
    `let a = ref(e)` in $e$. The properties of contextual equivalence for the $v$-calculus
    turn out to be remarkably complex, despite the simplicity of the language. See
    Benton and Kout (2007) for a survey of the literature on the v-calculus.


    Here we will use free nominal sets to give a version of Stark''s denotational
    semantics (Stark, 1994, 3.7). In particular, we follow the monadic style of denotational
    semantics of Moggi (1991), using the monad Frs from Remark 9.16. For each type
    $T$ in the set Type*'
