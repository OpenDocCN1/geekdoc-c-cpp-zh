  md: '# 10

    Functional programming


    A very useful feature of functional programming languages such as OCaml (http://caml.inria.fr/ocaml)
    or Haskell (http://www.haskell.org) is the facility for programmers to declare
    their own algebraic data types and to specify functions on data using pattern-matching.
    This makes them especially for *metaprogramming*, that is, writing programs that
    manipulate programs, or more generally, in formal languages. The functional programming
    language is often called the *meta-level* language, while the language whose expressions
    appear as data in the functional programs is called the *object-level* language.
    We already noted at the beginning of Chapter 8 that object-level languages often
    involve name binding operations. In this context we may well want meta-level programs
    to operate on object-level parse trees, but on their $\alpha$-equivalence classes.
