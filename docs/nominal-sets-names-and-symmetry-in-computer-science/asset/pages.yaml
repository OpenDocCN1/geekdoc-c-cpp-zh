  md: '# Support


    Clearly each element of a Perm $\mathbb{A}$-set is supported by the whole of $\mathbb{A}$,
    which is an infinite set. We will be interested in elements that are *finitely
    supported* in the sense that there is some finite set of atomic names that is
    a support for the element.


    **Definition 2.2** A nominal set is a Perm $\mathbb{A}$-set all of whose elements
    are finitely supported. Nominal sets are the objects of a category Nom whose morphisms,
    composition and identities are in the category of Perm $\mathbb{A}$-sets. Thus
    **Nom** is a subcategory of [Perm $\mathbb{A}$, Set]. The dependence of **Nom**
    upon $\mathbb{A}$ is left implicit (see Exercise 6.2).


    **Proposition 2.3** If $A_1$ and $A_2$ are finite supports for an element $x$
    of a Perm $\mathbb{A}$-set, then so is $A_1 \cap A_2$.


    *Proof.* Proposition 2.1 we just have to show that if $a, a'' \in \mathbb{A}-(A_1
    \cap A_2)$, then $(a'') \cdot x = x$. The latter holds if $a = a''$, so we may
    suppose a $a'' \in \mathbb{A}$. In that case, picking any element $a''$ of the
    infinite set $\mathbb{A}-(A_1 \cup A_2 \cup \{a''\})$,


    $(a'') = (a \circ a'''') \circ (a'' \circ a'''')$. \quad (2.3)


    Note that $a \notin A_1$, or $a'' \notin A_2$; so each of the transpositions on
    the right-hand side of (2.3) swaps atomic names that are either not not in the
    support set $A_1$, or not in the support set $A_2$ (since $a'' \in A_2$) is definitely
    not in either of $A_1$ or $A_2$). So $(a'')$ is a composition of transpositions
    each of which fixes $x$ and hence fixes $x$. $\square$


    Suppose $X$ is a nominal set and $x \in X$. Since $x$ possesses some finite support,
    by the proposition


    $$\text{supp } x \ \triangleq \{A \in P\mathbb{A} \mid A \text{ is a finite support
    for } x\}$ \quad (2.4)


    is a finite support for $x$ and is the least one with respect to subset inclusion.
    We write it as $\$\text{supp } x$ when $X$ is clear from the context. Exercise
    2.11 gives an equivalent formulation of $\$\text{supp } x$ from Gabbay and Pitts
    (2002).


    **Example 2.4** The nominal set of atomic names is by a Perm $\mathbb{A}$-set.
    Clearly each $a \in \mathbb{A}$ is finitely supported by $\{a\}$ and this is the
    smallest support, so $\$\text{supp } a = \{a\}$.


    **Example 2.5** The *discrete nominal set* on a set $X$ is given by the Perm $\mathbb{A}$-action
