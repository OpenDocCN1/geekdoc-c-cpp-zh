  md: '# #3

    Freshness


    In the previous chapter we explored the notion of the support of an element of
    a set equipped with an action of finite permutations of $\mathbb{A}$. The complementary
    notion of an atomic name not being in the support of an element is in many ways
    more important for applications of nominal sets. This is the relation of freshness
    that we explore in this chapter.


    # ##3.1 Freshness relation


    Given nominal sets $X$ and $Y$ and elements $x \in X$ and $y \in Y$, we write
    $x \# y$ and say that $x$ is fresh for $y$


    ```

    $x \# y \Leftrightarrow \text{supp}_x \cap \text{supp}_y = 0. \quad (3.1)$

    ```


    Most of the time we use the freshness relation when $X = \mathbb{A}$ and $x =
    a$ is an atomic name. In this case $\text{supp } a=\{a\}$ (Example 2.4), $a \#
    y$ means that $a \notin \text{supp } y$, or equivalently there is some finite
    support for $y$ that does not contain $a$. The *finiteness* of supports comes
    with the *finiteness* of $\mathbb{A}$ leads to the following simple principle
    we use often:


    **Choose-a-Fresh-Name Principle** If $X_1, \dots, X_n$ are finitely nominal sets
    and if $x \in X_1, \dots, x_n \in X_n$ are elements of them, then there is an
    atomic name $a \in \mathbb{A}$ satisfying $a \# x_1 \wedge \dots \wedge a \# x_n$
    (indeed, there are infinitely many such names).


    Note by Proposition 2.11 the freshness relation is equivariant:


    ```

    $x \# y \Rightarrow (\pi \cdot x) \# (\pi \cdot y). \quad (3.2)$

    ```


    The following results restate some of the properties of supports from the previous
    chapter in terms of freshness relation.'
