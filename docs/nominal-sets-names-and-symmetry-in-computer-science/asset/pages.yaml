    **Theorem 7.3** *Suppose $X$ is a $Perm \mathring{A}$-set, $R \subseteq P \times
    X \times X$ is a set of rules and $S \subseteq X$ is the subset inductively defined
    by $R$. If $R$ is supported by $A \subseteq \mathring{A}$, then so is $S$. In
    particular, if $R$ is an equivariant subset, then so is $S$.*


    *Proof* $R$ is supported by $A \subseteq \mathring{A}$. To see that $A$ supports
    $S$, we apply Lemma 2.24. So $\pi \in Perm \mathring{A}$ satisfies $(\forall a
    \in \mathring{A}) \pi a = a$. We have to show that $\pi \cdot S \subseteq S$,
    or equivalently, that $S \subseteq \pi^{-1} \cdot S$. To see this we check that
    $\pi^{-1} \cdot S$ is closed under the rules in $R$ and hence contains the smallest
    subset, $S$. But if $(H,c) \in R$, then since $A$ supports $R$, by Lemma 2.24
    we have $(\pi \cdot H, \pi \cdot c) \in R$. So since $S$ is closed under the rule
    $(\pi \cdot H, \pi \cdot c) \in R$, we get $\pi \cdot c \in S$ and hence $c \in
    \pi^{-1} \cdot S$ is indeed closed as required. The last part of the theorem follows
