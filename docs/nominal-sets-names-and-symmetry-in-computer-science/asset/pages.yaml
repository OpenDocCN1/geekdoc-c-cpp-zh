    # 2.7 Failure of choice


    Although nominal sets provide a model of classical higher-order logic, they do
    not model choice principles, as the following theorem shows. Indeed Fraenkel and
    Mostowski introduced permutations and finite subsets into logic the first place
    in order to construct a model of set theory with atoms not satisfying the Axiom
    of Choice.


    **Theorem 2.29** Let $P_{nefs}\mathbb{A}$ be the nominal set of non-empty, finitely
    supported subsets of $\mathbb{A}$ (where the Perm $\mathbb{A}$-action on such
    subsets is as for $P_{nefs}\mathbb{A}$). No function $c : P_{nefs}\mathbb{A} \to
    \mathbb{A}$ satisfying


    > $$\S \in P_{nefs}\mathbb{A}) \quad c S \in S \quad (2.22)$


    can have finite support in the Perm $\mathbb{A}$-set $Perm^{\{P_{nefs}\mathbb{A}}$.


