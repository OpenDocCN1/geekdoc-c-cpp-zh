  md: "# 10.10 Contextual equivalence\n\n# 10.10 Contextual equivalence\n\nThe Abstractness\
    \ criterion mentioned at the beginning of this chapter asks of a meta-level programming\
    \ language that its programs respect object-level $\\alpha$-equivalence to a suitable\
    \ notion of equivalence for meta-level programs. We use **contextual equivalence**\
    \ of $\\lambda F$ expressions as the notion of program equivalence. In general,\
    \ two phrases in a programming language are contextually equivalent if the observable\
    \ results of executing any program using the first phrase are unaffected by the\
    \ occurrence of the second phrase. Thus there is a range of potentially different\
    \ notions of equivalence depending upon what we are the ‘observable results of\
    \ executing a program’. Here we take programs to consider, well-typed $\\lambda\
    \ F$ expressions $e \\in \text{Exp}(T)$, and just observe whether or not their\
    \ evaluations, written $e \\downarrow$. The precise definition of termination\
    \ is given below (10.20). Other reasonable choices of observation (as the outermost\
    \ form of the value resulting from evaluating $e$) would not change the notion\
    \ of $\\lambda F$ contextual equivalence. This is a consequence of using a strict,\
    \ or ‘call-by-value’, evaluation strategy (Plotkin, 1975); it is also a consequence\
    \ of the fact that $\\lambda F$ does not involve any features—the latter complicates\
    \ the range of properties one might wish to observe of program execution.\n\n\
    Traditionally, contextual equivalence is defined by quantifying over contexts,\
    \ which are syntax trees in which one leaf has been replaced by a ‘hole’, • (Milner,\
    \ 1977). Filling the hole with an expression gives a contextual use of the expression.\
    \ This is a form of potentially-capturing substitution, program contexts cannot\
    \ be identified up to $\\alpha$-equivalence. For example, $Ax$ is not the same\
    \ program context as $Ay$, since filling the hole with $x$ gives different expressions\
    \ up to $\\alpha$-equivalence. We will use a more abstract, ‘relational’ approach\
    \ to defining contextual equivalence as to Lassen (1998) that does not require\
    \ one to descend below the level of $\\alpha$-equivalence.\n\n**10.7 ($\\lambda\
