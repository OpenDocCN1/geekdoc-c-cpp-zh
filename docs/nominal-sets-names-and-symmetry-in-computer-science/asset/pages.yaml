    # Introduction


    theory of representation and computation for syntax with binders. In general,
    the property of having only finitely many orbits for the action of name permutations
    to be a very useful relaxation of the notion of finiteness. It is studied in Chapter
    5. One application of orbit-finiteness is to the denotational semantics of programs
    based upon the use of partial orders, where potentially infinite behaviour is
    modelled as a limit of finite approximations; this is explored in Chapter 11.


    # 0.6 Alternative formulations


    One approach to formalizing the notion of ‘possible worlds’ stemming from Kripke
    semantics for intuitionistic and modal logics (Kripke, 1965) is to make use of
    the technique of Structures are indexed by worlds that contain (at least) the
    names that are known at that stage. One then has to give morphisms between structures
    indexed by moving from one to another, for example by adding a name not already
    in the current world. The mathematics of this approach is best treated as part
    of the category of presheaves (Bourceux, 2008, vol. 3, chapter 2). Fiore et al.
    (1999) use presheaves in their algebraic treatment of abstract syntax with binders.
    This is closely related to the technique of using ‘well-scoped’ of de Bruijn indexes
    within functional programming and interactive theorem proving based upon constructive
    type theory; see for example Pouillard (2012), who compares this technique with
    nominal names. Techniques based possible worlds brings with them a certain amount
    of book-keeping to do with change of world, for example when a world is weakened
    by adding a new name. By contrast, the theory of nominal sets dependence on names
