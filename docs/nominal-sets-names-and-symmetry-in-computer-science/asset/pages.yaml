    in X \to \\{y \\in Y \\mid (x, y) \\in S\\}$.\n\n*Proof* The equivariant properties\
    \ follow from the definition of the action of $G$ on subsets. For example\n\n\
    ```\n$x \notin (\neg S) \\Leftrightarrow g^{-1} \\cdot x \notin \neg S \\Leftrightarrow\
    \ g^{-1} \\cdot x \\in S \\Leftrightarrow x \notin g \\cdot S \\Leftrightarrow\
    \ x \\in \neg(g \\cdot S)$\n```\n\nso that $g \\cdot (\neg S) = \neg(g \\cdot\
    \ S)$.\n\nThe proposition gives a rich collection of equivariant subsets. Consider\
    \ the formulas of classical higher-order logic; they are built up from atomic\
    \ formulas equality, membership, the propositional connections and quantification\
