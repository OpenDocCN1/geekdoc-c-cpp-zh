  md: '# 1.3 Natural numbers


    # 1.3 Natural numbers


    The coproduct $\sum_{i \in I} X_i$ in the case $I = \mathbb{N} = \{0, 1, 2, \dots\}$
    and each $X_i$ is the terminal 1, is necessarily a *natural number object* in
    $[G, Set]$. In other words, it is a $G$-set $N$ equipped with equivariant functions


    ```

    $1 \xrightarrow{\text{zero}} N \xrightarrow{\text{suc}} N$ (1.21)

    ```


    with the universal property that for any other diagram in $[G, Set]$


    ```

    $X_0 \xrightarrow{X} X \xrightarrow{F} X$ (1.22)

    ```


    there is a unique equivariant functor $X_0 F$ making


    ```

    $1 \xrightarrow{\text{zero}} N \xrightarrow{\text{suc}} N$\n$| |$\niter $X_0 F$
    iter $X_0 F$\n$| |\$

    $X_0 \to X \to X$ (1.23)

    ```


    commute.


    Note that $\sum_{i \in I} X_i$ is discrete (Example 1.5) when all the $X_i$ are
    discrete $G$-sets. In particular we identify $N$ with the discrete $G$-set on
    the set $\mathbb{N}$ of natural numbers equipped with the usual zero and successor
    functions: zero $() = 0$, suc $n = n+1$. Given (1.22), the unique functor $X_0
    F : \mathbb{N} \to X$ making (1.23) commute is recursively defined by


    ```

    $X_0 F 0 = X_0(),$\niter $X_0 F (n+1) = F$ (iter $X_0 F$).

    ```


    It is equivariant because $\mathbb{N}$ is discrete and $X_0$ and $F$ are equivariant.


