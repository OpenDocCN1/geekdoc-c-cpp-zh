    Note **1.10** In applying the Equivariance Principle, one must take into account
    all the parameters upon which a particular construction depends. For example,
    regarding G as a G-set as in Example 1.6, we saw there that for any G-set X the
    action


    ```

    $F: G \times X \to X,\nF \pm \lambda(g,x) \in G \times X \to g \cdot x$

    ```


    is an equivariant function. however, if we fix a particular $g_0 \in G$, the function
    $F_0 = F(g_0-) : X \to X$ is not in general unless G is a commutative group (or
    $g_0 = e$), since $g \cdot F_0 x = (g \ g_0) \cdot x$, whereas $F_0(g \cdot x)
    = (g_0) \cdot g$.


    **1.11** Classical higher-order logic is formulated using the $\varepsilon$-operation
    of Hilbert, $\varepsilon\varphi(x)$, which satisfies $(\forall x \in X)$ $\varphi(x)
    \Rightarrow \varphi(\varepsilon\varphi(x))$. Unless U is a trivial group, such
    an operation cannot be equivariant — see Exercise 1.8. The Equivariance Principle
    does not apply to constructions employing this strong form of choice. Toposes
    of the form $[G, Set]$ do satisfy a weaker, internal version of the Axiom of Choice
    (Johnstone, 2002, examples 4.5.2(b)). However, when we move from considering equivariance
    to finite support in the next chapter, that form of choice fails; see Section
    2.7.


    # 1.6 Partial functions


    Given sets X and Y, the set $X \to Y$ of partial functions from $X$ to $Y$ is
    the subset of $P(X \times Y)$ consisting of all subsets $F \subseteq X \times
    Y$ that are *single-valued*


    ```

    $(\forall x \in X)(\forall y, \ y'' \in Y) (x,y) \in F \wedge (x,y'') \in F \Rightarrow
    y = y''$. (1.36)

    ```


    We write $F \equiv y$ to mean that $F$ is defined at $x \in X$ and takes value
    $y \in Y$. Thus


    ```

    $F \equiv y \Leftrightarrow (x,y) \in F$. (1.37)

    ```


    More generally, given partial functions $F_1 \in X_1 \to Y$ and $F_2 \in X_2 \to
    Y$, for all $x_1 \in X_1$ and $x_2 \in X_2$ we define


    ```

    $F_1 x_1 \equiv F_2 x_2 \Leftrightarrow (\forall y \in Y) (x_1,y) \in F_1 \Leftrightarrow
    (x_2,y) \in F_2$. (1.38)

    ```


    $(F \equiv y)$ is the special case of when $F_1 = F$ and $F_2 = id_Y$.) More generally
    still, but less formally, if $e$ and $e''$ are expressions denoting partially
    defined values we write $e \equiv e''$ to mean that $e$ is defined if and only
    if $e''$ is and in case they are equal values. This is sometimes referred to as
    *Kleene equivalence*.'
