  md: '# 2.1 The category of nominal sets


    nominal set with supp t equals the finite set var t of variables occurring in
    t. This set is recursively defined by:


    ```

    var a = {a ,


    opt(t1, ... , tn) = var t1 ∪ ··· ∪ var tn.

    ```


    That vart is the least support for t follows from the fact that it is a strong
    support in the sense of the following theorem due to Zveleikis (2008, section
    2.1.2). Property (2.5) for A = var t and x = t can be proved by induction on the
    structure of the term t.


    **Theorem 2.7** We say that a set of atomic names A ⊆ A strongly supports an element
    x of a nominal set X and only if


    ```

    (π ∈ Perm A)((a ∈ A) π a = a) ⇔ π · x = x. (2.5)

    ```


    If A is a set of atomic names that strongly supports x, then A is the least support
    of x, and A = supp x.


    Proof If A strongly supports x, then it contains x and supp x ⊆ A. Suppose A is
    finite; then A is non-empty and we choose some a'' ∈ A - A. If a ∈ supp x, then
    (a'')a = a'' a ∈ A. So from (2.5) we conclude that (a'') · x ≠ x; this contradicts
    the fact that a, a'' ≠ supp x. So A - supp x is empty and A = supp x.


    **Remark 2.8** Kurz et al. (2010) have given an interesting characterization of
    Zveleikis'' strong nominal sets, that is, Perm-sets in which every element is
    strongly supported by a finite set of atomic names. Let Set denote the category
    whose objects are sets of (X_A | A ∈ Pt_A) indexed by finite subsets of A and
    whose morphisms are Pt_A-indexed families of functions.


    There is a functor U : Nom → SetPt_A sending each x ∈ Nom to (x ∈ X | supp x ⊆
    A). It has a left adjoint F : SetPt_A → Nom, but also that x ∈ Nom is a strong
    nominal set if it is isomorphic to F(i) for some i ∈ SetPt_A. See Petrişan (2011,
    lemma 2.4.2) for details.


    Since A is a Perm-set, so is its powerset PA, as in Section 1.5. is not hard to
    see that it contains elements that are not finitely supported (Exercise 2.2);
    but as the next result shows, we can identify exactly which subsets of A are finitely
    supported.


    **Proposition 2.9** A A ⊆ A of atomic names is a finitely supported element of
    PA if only if either it or its complement A - A is finite. In the latter case
    one says that A is cofinite.'
