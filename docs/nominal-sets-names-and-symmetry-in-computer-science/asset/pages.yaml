  md: '# Preface


    # A personal perspective


    This book has its origins in my interest in semantics and logics for *locality*
    in programming languages. By locality, I mean the various mechanisms that exist
    for making local declarations, restricting a resource to a specific scope, or
    hiding information from the environment. Although mathematics and logic are involved
    in understanding these things, this is a distinctly computer science topic. I
    was introduced to it by Matthew Hennessy and Alley Stoughton at the time we all
    arrived at the University of Sussex in the fall of the 1980s. At the time I was
    interested in applying category theory and logic to computer science and they
    were interested in higher-order functions that occurs in the ML family of languages
    [Milner et al., 1997].


    Around that time Moggi introduced the use of category-theoretic monads to structure
    different notions of computational effect [Moggi, 1991]. That is an important
    technique in denotational semantics; and thanks to the work of Wadler (1992) and
    others, monads are the accepted way of ‘tackling the awkward squad’ [Peyton Jones,
    2001] of side-effects within functional programming. One Moggi’s monads models
    the computational effect of allocating fresh names. It is less known than some
    of the other monads he uses, because categories of functors and is only mentioned
    in (Moggi, 1989). My Ph.D. student Ian Stark and I used this monad in a study
    of higher-order functions with generative names. By isolating these two features
    of ML in a syntactically simple language, the $

    u$-calculus [Pitts and Stark, 1993], we illustrated how complicated the combination
    of these features can be from a semantic point of view. In his thesis, Stark gives
    (among other things) a denotational semantics of the $

    u$-calculus using Moggi’s dynamic allocation monad on the category of pullback
    preserving,'
