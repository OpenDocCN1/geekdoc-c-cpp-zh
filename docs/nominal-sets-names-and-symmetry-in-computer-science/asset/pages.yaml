    ```


    In case n=0, the cartesian product is just a singleton set $1=\{\()\}$ and the
    action is $g \cdot (())$. Definition (1.2) ensures that the projection from a
    product of G-sets to one of its components


    ```

    $proj_i : X_1 \times \dots \times X_n \to X_i$,$\nproj_i \triangleq (x_1, \dots,
    x_n) \in X_1 \times \dots \times X_n \to x_i$

