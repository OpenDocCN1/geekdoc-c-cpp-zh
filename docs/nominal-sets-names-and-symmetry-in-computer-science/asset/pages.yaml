    so $f$ induces a function $\hat{f}: X/G \rightarrow Y$ satisfying $\hat{f}(orb
    x) = fx$; and clearly this is the unique function $g: X/G \rightarrow Y$ satisfying
    $(\Delta g) \circ \eta_X$.


    **Definition 5.3** A $G$-set $X$ is *orbit-finite* if $X/G$ is finite and it is
    atomic if $X/G$ is simple.


    Recall that subsets of an object $X$ in $[G, Set]$ correspond to equivariant subsets
    of $X/G$ (Definition 1.8). Note that each $O \in X/G$ is a non-empty subobject
    of $X$ in $[G, Set]$; and as an object $[G, Set]$, $O$ has no subobjects other
    than the empty set and $O$ itself. Since $X$ is a disjoint union of its orbits,
    it is isomorphic to the coproduct (Section 1.2) of the atomic $G$-sets $O \in
    X/G$:


    ```

    $X \equiv \sum_{O \in X/G} O. (5.3)

    ```


    Next we recall a result from group theory giving a representation of each $O \in
    X/G$ in terms of stabilizer subgroups. If $X$ is a $G$-set, then the *stabilizer*
    of an element $x \in X$ is


    ```

    $stab.x \triangleq \{g \in G \mid g \cdot x = x\}. (5.4)

    ```


    Note that $stab x$ is a subgroup of $G$. For any subgroup $H \subseteq G$, the
    set of (left) cosets


    ```

    $coset H \triangleq \{gH \mid g \in G\},\nggH \triangleq \{gh \mid h \in H\}.
    (5.5)

    ```


    is the set of equivalence classes for the equivalence relation on $G$ that relates
    $g$ and $g''$ when $g^{-1}g'' \in H$. We make $gH$ into a $G$-set via left multiplication:


    ```

    $g \cdot (g''H) \triangleq (gg'')H. (5.6)

    ```


    **Theorem 5.4 (Orbit-stabilizer theorem)** Let $G$ be a group and $X$ a $G$-set.
    For each $x \in X$ there is an isomorphism in $[G, Set]$


    ```

    $orb x \equiv coset (stab x).

    ```'
