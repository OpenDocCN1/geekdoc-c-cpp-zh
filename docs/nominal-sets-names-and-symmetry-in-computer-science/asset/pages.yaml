    # Equivalents of Nom


    In this chapter we give some categories of mathematical structures considered
    in the literature that turn out to be equivalent to the category Nom of nominal
    sets and equivariant functions defined in Chapter 2.


    # ## 6.1 Sets with name swapping


    The definition of nominal sets by Pitts (2003) emphasizes transpositions over
    more general permutations of atomic names. We saw in Proposition 2.1 that the
    support of an element of a nominal set can be defined in terms of the swapping
    operation


    ```

    $swap : \mathbb{A} \times \mathbb{A} \times X \to X ,\n$

    $$swap \coloneqq \lambda(a, a'', x) \in \mathbb{A} \times \mathbb{A} \times X
    \to (a \ a'') \cdot x .$$

    $(6.1)$

    ```


    In view of Theorem 1.15, an action of Perm $\mathbb{A}$ on a set $X$ is completely
    determined by this operation; for every $\pi \in$ Perm $\mathbb{A}$ is equal to
    a composition of transpositions


    ```

    $$\pi = (a_1 \ a''_1) \circ (a_2 \ a''_2) \circ \dots \circ (a_n \ a''_n) ,$$

    $(6.2)$

    ```


    and hence


    ```

    $$\pi \cdot x = swap(a_1, a''_1, swap(a_2, a''_2, \dots, swap(a_n, a''_n, x) \dots))
    .$$

    $(6.3)$

    ```


    What properties must a function $swap : \mathbb{A} \times \mathbb{A} \times X
    \to X$ satisfy in order for (6.3) to give a well defined Perm $\mathbb{A}$-action
    on $X$? The actions of a group $G$ on a set $X$ correspond to group homomorphisms
    $G \to$ Sym $X$ (Exercise 1.1), answering this question amounts to giving a presentation
    of the group Perm $\mathbb{A}$ in terms of generators and relations, with the
    transpositions as generators.'
