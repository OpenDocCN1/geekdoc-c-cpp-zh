    That uses a category of worlds consisting of injective functions between finite
    ordinals, thought of as the difference between well-scoped indexes currently used
    in them. The passage to nominal sets involves first replacing finite ordinals
    by finite subsets of some fixed, infinite collection of atomic names; then replacing
    injections between finite subsets by permutations of the whole collection of names.
    Neither of these steps change things up to category-theoretic equivalence; but
    the final result, the category of nominal sets that is studied in this book, is
