  md: '# 9 Locally scoped names


    This chapter uses nominal sets to model language constructs for hiding the identity
    of a name outside a given scope. Such locally scoped names are a ubiquitous feature
    of programming languages, because of the need for constructs to control ''name
    spaces'' and enable the modular construction of code without having to worry about
    accidental clashes of names between different constituent pieces. We consider
    nominal sets equipped with an operation of name restriction and use them to give
    semantics for two simple examples of languages with locally scoped names: the
    functional theory of local names of Odersky (1994) and the $

    u$-calculus of Pitts and Stark (1993).


    # 9.1 The category of nominal restriction sets


    We focus on three characteristic properties of locally scoped names that define
    what we mean by ''name restriction''. The first property is that the name restriction
    operation should be a binder: occurrences of the name within its scope can be
    consistently renamed without changing the overall meaning of the scoped expression.
    Assuming language semantics are modelled by the elements of a nominal set $X$,
    in view of the results in Chapter 4, we require the name restriction operation
    to be given by an equivariant function $r:[A]X\to X$ on the nominal set of name
    abstractions.


    The second property is that if a sequence of names is hidden, then the order in
    which they are scoped is immaterial. So in particular for two names $a_1$ and
    $a_2$ we should have


    The third property is that if there are no free occurrences of a name within a
    particular scope, then hiding it should have no effect on the meaning of the'
