  md: "# 1.9 Name symmetries\n\n# 1.9 Name symmetries\n\nIn the rest of this book\
    \ we fix an infinite set $\\mathcal{A}$ and develop some properties of Perm $\\\
    mathcal{A}$-sets that are relevant to computer science. We call the elements of\
    \ $\\mathcal{A}$ atomic names, because they are items of data whose internal structure\
    \ is irrelevant; their only relevant attribute is their identity. We need $\\\
    mathcal{A}$ to be infinite, and might well take it to be countable (see Exercise\
    \ 6.2). For concreteness, we could take atomic names to be natural numbers, or\
    \ bit-patterns. However, their symmetries only preserve equality and inequality,\
    \ but not any other properties the concrete representation of an atomic name might\
    \ have. (We will see in Section 6.2 since we restrict attention to sets with the\
    \ finite support property (Definition 2.2), that the fact that we use the group\
    \ of finite permutations Perm $\\mathcal{A}$, rather than the group of all permutations\
    \ Sym $\\mathcal{A}$, is not significant.)\n‘Structureless’ names have a rich\
    \ theory with many applications, as we will see. Here is also natural to consider\
    \ structures on the set $\\mathcal{A}$ that are richer than just (inequality)\
    \ and to consider symmetries of that structure, which are subgroups of permutations\
    \ $A$. For example, one might want a total order on names, or to make the names\
    \ the vertices of a graph; in the first case one could consider order-preserving\
    \ permutations$^1$ and in the second automorphisms of the graph. However to use\
    \ a useful theory of generalized nominal sets with (at least) the notion of ‘support’\
    \ that we develop in the next chapter, it seems that one needs the structure on\
    \ $\\mathcal{A}$ and its symmetries to have homogeneity properties analogous to\
    \ Lemma 1.14. For ordered names, it means that $\\mathcal{A}$ should be the random\
    \ graph of Rado (1964). With an edge relation, it means that $\\mathcal{A}$ are\
    \ instances of Fraïssé limits (also known as ‘universal’) homogeneous structures;\
    \ see Hodges, (1993, section 7.1). Some of the nominal names presented in this\
    \ book (particularly the material in Chapter 5) is generalized to ‘Fraïissé nominal\
    \ sets’ in Bojańczyk et al. (2011, 2012) and Bojańczyk and Place (2012), with\
    \ an orientation towards automata theory; but remains to be explored.\n\n# Exercises\n\
