  md: '# # 0

    Introduction


    This is a book about names and symmetry in the part of computer science that has
    to do with programming languages. Although symmetry plays an important role in
    many branches of mathematics and physics, its relevance to computer science may
    not be so clear to the reader. This introduction explains the computer science
    motivation for a theory of names based upon symmetry and provides a guide to what
    follows.


    # ## 0.1 Atomic names


    A pure name is nothing but a bit-pattern that is an identifier, and is only useful
    for comparing for identity with such other bit-patterns – which includes looking
    up in tables to find other information. The intended contrast is with names which
    yield information by examination of the names themselves, whether by reading the
    text of the name or otherwise [...] like most things in computer science, pure
    names help by putting in an extra stage of indirection; they are not much good
    for anything else.


    > (Neidham, 1989, p. 90)


    We prefer to use the adjective ‘atomic’ rather than ‘pure’, because for this kind
    of name, internal structure is irrelevant; their only relevant attribute is their
    identity. Although such names may not be much good for anything other than indirection,
    one thing is a hugely important and very characteristic aspect of computer science.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Introduction


    # 0.2 Support and freshness


    The complexity of computer systems has stimulated the development of compositional
    methods for specifying and constructing them. If one wishes to compose a whole
    of parts, then one had better mechanisms for hiding, or at least controlling access
    to, the identity of the atomic names upon which each part depends. The prerequisite
    for deciding such mechanisms and understanding their properties is a firm grasp
    of what it means for a piece of the system to ‘depend’ upon an atomic name. Although
    there are syntactic considerations, such as various notions of textual occurrence,
    this issue really concerns semantics: what it means for the behaviour of a software
    system to depend upon the identity of atomic names?


    A conventional response to this question is simply to parametrize: replace the
    use of structures of some kind by functions to structures. This book develops
    an alternative approach – a mathematical theory of ‘name dependence’ based upon
    the symmetries that a structure exhibits when one permutes names. The fundamental
    idea is to model systems involving atomic names with mathematical structures for
    every permutation of names introduces a transformation of the structure. In this
    case one says that act upon the structure and these actions are required to satisfy
    some simple laws; this finite collection of atomic names is said to support if
    any permutation fixes each name introduces the collection that leaves the entire
    structure unchanged with respect to whichever notion of equality of structures
    is of concern. This notion of support is an old one, mathematically speaking,
    that we put to new use within computer science.


    From this viewpoint, a structure does not depend on a support set for the structure
    that does not include that name. This may seem a rather indirect way of getting
    to the idea of dependence upon names, but it has advantages over the more common
    approach based upon parametrization. In the use of functions that namedependent
    is made explicit, whereas often one wants to leave implicit and work inside the
    complementary relation of non-dependence, or freshness as we will call it. Chapters
    2 and 3 develop the properties of the nominal notions of support and freshness.
    Chapter 7 considers applications of these notions to a fundamental technique in
    programming language semantics – the use of rule-based inductive and inductive
    definitions of subsets of a given set. Chapter 9 uses freshness to model language
    constructs for hiding the identity of a name outside a given scope.'
  merge: -1
  pgno: 17
