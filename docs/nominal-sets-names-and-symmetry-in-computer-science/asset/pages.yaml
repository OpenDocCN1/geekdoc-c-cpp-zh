    # 10.4 Name swapping


    Since Fresh OCaml expressions are intended to denote elements of nominal sets
    and the action of name permutations is a key aspect of nominal sets, it is not
    surprising that the language provides the means to express this action. It so
    via expressions of the free swap e1 and e2 in e3, which has the same type as e3
    provided e1 and e2 have the same type and one that is an instance of ''a name.
    The expression evaluates by evaluating the three subexpressions and transposing
    the atomic names obtained from the first two in the value obtained from the third.
    For example, such expressions occur at line 26 of Figure 10.1 in the definition
    of the function for converting a pair of name abstractions into a name-abstracted
    pair.


    # 10.5 Freshness relation


    Apart from permutation, the other characteristic feature of nominal sets is the
    notion of finite support and the complementary relation of freshness (Section
    3.1). Fresh OCaml provides an infix, boolean-valued operation e1 fresh e2 that
    atoms not in the support of the value denoted by e2. This is subject to some caveats
    as for the general form of name abstraction type <<ty1>>ty2: since support is
    not a computable notion at higher types (involving as it does existential equality
    of functions), Fresh OCaml raises an exception if the operation freshfor is invoked
