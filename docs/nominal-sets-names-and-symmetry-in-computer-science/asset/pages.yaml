    ```


    We reserve the notation ''dom'' for the domain of a morphism in a category. Thus
    in the category of sets and partial functions, $F \in X \rightarrow Y$ we have
    dom F = X, dom F may be strictly smaller than X.)


    If $X$ and $Y$ are $G$-sets, using the Equivalence Principle we have that $X \rightarrow
    Y$ is an equivariant subset of $P(X \times Y)$ and hence a $G$-set. As the next
    result shows, the $G$-action on partial functions agrees with the action on total
    functions


    **Proposition 1.12** *If $X$ and $Y$ are $G$-sets and $F \in X \rightarrow Y$,
    then for all $g \in G$ and $x \in X$*


    ```

    (g \cdot F) \cdot x = g \cdot (F(g^{-1} \cdot x))., \quad (1.41)

    ```


    Proof. If $(g \cdot F) \cdot x$ is defined, say $(x, y) \in F$, then $(g^{-1}
    \cdot x, g^{-1} \cdot y) = g^{-1}$. So $(g^{-1} \cdot F) \cdot x$ is defined and
    equal to $g^{-1} \cdot y$ and therefore $g \cdot (F(g^{-1} \cdot x)) = g \cdot
    (g^{-1} \cdot y) = y$.


    Conversely if $g \cdot (F(g^{-1} \cdot x)) = y$, then the subexpression $F(g^{-1}
    \cdot x)$ must also be defined, is, $(g^{-1} \cdot x, y'') \in F$ for some $y''$
    with $g \cdot y'' = y$. Hence, $(x, y) = (g \cdot (g^{-1} \cdot x), g \cdot y'')
    = g \cdot (g^{-1} \cdot x, y'')$ and thus $g \cdot F \cdot x = y. \square$


