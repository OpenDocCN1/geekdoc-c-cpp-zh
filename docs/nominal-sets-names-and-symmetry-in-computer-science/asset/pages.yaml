    \ for all expressions, $e, e' \\in \\text{Expr}(T_1 \to T_2)$; see Pitts and Stark\
    \ (1998, 1.2).\n\nHow does one prove the properties in Theorem 10.13? From the\
    \ definition of $=e_{cxx}$, to prove that two expressions are contextually equivalent\
    \ it suffices to find an adequate and compatible relation that contains them.\
    \ However, in any particular case that can be quite hard, since the compatibility\
    \ property tells us that various pairs must be in the relation besides the pair\
