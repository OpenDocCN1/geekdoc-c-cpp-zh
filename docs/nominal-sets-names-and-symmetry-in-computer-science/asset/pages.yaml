    # 9.5 Free nominal restriction sets


    For nominal set $X$ there is a freely generated nominal restriction set Frs X.
    In other we forget the functor $\mathbf{Res} \to \mathbf{Nom}$ has a left adjoint
    Frs : $\mathbf{Nom} \to \mathbf{Res}$. This can be deduced from the fact that
    $\mathbf{Res}$ is a category of algebras for a suitable generalization of universal
    algebra with the notions of freshness and name abstraction. There are several,
    related versions of ''nominal universal algebra'': by Gabbay and Mathijssen (2009),
    by Clouston and Pitts (2007) and as a special case of the very general framework
    of Fiore and Hur (2008a). Here we give an explicit construction of Frs $X$ and
    verify its universal property.'
