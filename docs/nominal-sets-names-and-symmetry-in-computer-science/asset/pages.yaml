    ```

    $\forall A \in \mathbb{A} \ a # A \Rightarrow a # f$

    ```


    since $a \notin \mathbb{A} - \{a\} = supp(A - \{a\}) = supp(f_a A)$.


    **Note 3.6 (Proving freshness for functions and relations)** — Propositions 3.2
    and 3.3 help one to prove instances of the relation $a # x$ in case $x$ is a name,
    a tuple, or an element of union. As Example 3.5 suggests, freshness for functions
    cannot in general reduced to freshness properties for the domain and codomain
    of function. When $x$ is a finitely supported function, or more generally a finitely
    supported subset $S''$ of a nominal set, it can be hard to prove freshness. If
    we are given $a \in \mathbb{A}$ and (the description of) a finitely supported
    $S''$ and wish to prove $a # S$, one common method is as follows:


    Use the Choose-a-Fresh-Name Principle to prove $b \in \mathbb{A}$ satisfying $b
    # S$. It suffices to use the description of $S$ to prove $(a \cdot b) \cdot S
    = S$, since then $a = (a \cdot b) \cdot a \cdot b \ \cdot S = S$ (using the equivariance
    property (3.2) of #).


    For example, this method is used below in the proof of Proposition 4.5 and in
    Example 8.20.


    # 3.2 Freshness quantifier


    Here is a very common pattern when reasoning informally with fresh names. At some
    point in the proof one chooses *some fresh* name with certain properties; later
    on in the proof one may need to revise that choice to take account of extra names
    that have entered the current context and so one needs to know that *any* fresh
    name with the property would have done for the original choice. The following
    results show that for finitely supported this switch from ''some fresh'' to ''any
    fresh'' is always possible.'
