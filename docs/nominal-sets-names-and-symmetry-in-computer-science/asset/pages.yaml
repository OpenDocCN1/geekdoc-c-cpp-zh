    # 7.5 Equivariant fixed-points


    Now we investigate permutation actions and the notion of support interact with
    monotone functions. Suppose a poset $D$ is equipped with a $G$-action for some
    group $G$. We call an equivariant poset $\subseteq$ is an equivariant subset of
    $D \times D$.


    $(\forall g \in G)(\forall d, d'' \in D) d \sqsubseteq d'' \Rightarrow g \cdot
    d \sqsubseteq g \cdot d''. \quad (7.23)


    Note that in this case, since $g : D \to D$ is a bijection with monotone inverse
    $g^{-1} : D \to D$, the action of $g \in G$ preserves any joins or meets that
    happen to exist in $D:


    $g(\cup S) = \cup\{g \cdot d \mid d \in S\} \quad g(\cap S) = \cap\{g \cdot d
    \mid d \in S\}. \quad (7.24)


    When they all exist, we call $D$ an equivariant complete lattice. We are mainly
    interested in this notion when $G$ is the group Perm $\mathbb{A}$ of finite permutations
    of the set $\mathbb{A}$ of atomic names.'
