    carry out the constructions and calculations relevant to the topics discussed
    in this introduction. This is particularly noticeable when it comes to higher-order
    functions; exponentials of nominal sets are appreciably easier to work with than
    exponentials of the Set-valued functors that are the objects of the Schanuel topos.


    Chapter 6 describes the equivalence between the Schanuel topos and nominal sets.
    It also discusses some other equivalent formulations, notably the concept of named
    set that arose in the work of Montanari and Pistore (2000) on automated verification
    for mobile processes (Milner et al., 1992).


    # 0.7 Prerequisites


    A prerequisite for understanding Part One of the book, on the theory of nominal
    sets, is some familiarity with naive set theory and higher-order logic; see Andrews
    (2002), for example.


    We also assume a knowledge of the basics of category theory. The first work on
    nominal sets (Gabbay and Pitts, 1999, 2002; Gabbay, 2000) took a theoretic approach.
    It used FM-sets, the cumulative hierarchy of hereditarily supported sets devised
    by Fraenkel in the 1920s and by him Mostowski to get independence results for
    Zermelo-Fraenkel set theory with atoms; see Gabbay (2011) for a discussion of
    these historical sources. Nominal sets are essentially the FM-sets that depend
    upon no particular names (that is, whose support is empty). On the other hand
    the universe of FM-sets can be given a category-theoretic construction; and an
    ‘algebraic’ set-theory (Joyal and Moerdijk, 1995) should develop the theory of
    nominal sets using set theory or category theory; Here both approaches are, as
    appropriate. ‘element-oriented’ or ‘morphism-oriented’? Nevertheless, emphasis
    is placed upon category-theoretic constructions, particularly the use of universal
    properties that characterize constructions uniquely up to morphism. So familiarity
    with the basics of category theory—category, functor, natural transformation,
    adjunction and equivalence—is assumed. There are many suitable introductions,
    some aimed specifically at computer science applications, such as those by Pierce
    (1991) and Crole (1993). The classic text by MacLane (1971) still holds its own;
    and the three volumes by Borceux (2008) are usefully comprehensive. Some familiarity
    is needed


    The term ‘nominal set’ was first used by Pitts (2003).'
