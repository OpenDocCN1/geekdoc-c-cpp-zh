  md: '# Functional programming


    notion of freshness is not in general decidable and the type system in Pitts and
    Gabbay (2000) provides a sound, but far from complete approximation for the ''independence
    from freshly chosen names'' property. For example, it rejects the above declaration
    of bys, but also rejects semantically pure uses of fresh names. For this reason
    freshness inference was dropped from the type system for later versions of FreshML
    (Shinwell et al., 2003), including FreshOCaml.


    There are at least two sources of difficulty when devising systems for inferring
    freshness properties:


    +   (i) Freshness for recursively defined data in general involves proof by induction.


    +   (ii) As we remarked in Note 3.6, freshness for functions in general involves
    comparing functions for (extensional) equality.


    The Pure FreshML of Pottier (2007) neatly overcomes the first difficulty by combining
    a conventional type system with an expressive proof system for Hoare-style assertions
    with pre- and post-constraints on expressions. The constraints are Boolean combinations
    of facts about finite sets of atoms, equations between values and a primitive
    for scope. Pottier gives a conservative procedure for constraint entailment. The
    design of Pure FreshML seems to deal well with difficulty (i), but as far as I
    am aware has not been extended to deal with functions as first-class values (function
    closures) which difficulty (ii) has to be avoided in some pragmatic way.


    In order to formulate its correctness properties (Pottier, 2007, section 4.2),
    Pure FreshML uses a statically scoped local name like ΛML''s va, rather than an
    expression like fresh in OCaml that dynamically generates a fresh name when evaluated.
    Using the former allows one to give to the operational semantics that deallocate
    fresh names upon leaving their scope. Thus, in terms of the ΛML language, Pottier
    replaces lines 1 and 27 in Figure 10.7


