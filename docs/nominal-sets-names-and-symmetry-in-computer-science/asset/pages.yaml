    \ be interpreted in cartesian closed category; see Lambek and Scott (1986), or\
    \ Crole (1993), for example. One might expect to use the cartesian closed category\
    \ $\text{Res}$ to model the $\\Lambda$-calculus. This does not work because some\
    \ of its syntactic forms do not commute with $\text{va}$ - and do not devote morphisms\
    \ of nominal restriction sets; for example, in the $\\Lambda$-calculus, a locally\
    \ scoped function $(\text{va}, e_1)$ $(\text{va}, e_2)$ is not in general convertible\
    \ with $\text{va}$. In fact we interpret the calculus in a full subcategory of\
    \ $\text{Nom}$ whose objects are (the underlying nominal sets of) nominal restriction\
    \ sets.\n\nEach type $T$ determines a nominal set $\\llbracket T \rrbracket_{\\\
