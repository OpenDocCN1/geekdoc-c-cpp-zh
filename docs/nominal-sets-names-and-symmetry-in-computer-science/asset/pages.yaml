    **Definition 9.12** Given $X \in \mathrm{Nom}, (x, A), (x'', A'') \in X \times
    P_{\mathfrak{A}}$ and $\pi \in \mathrm{Perm}\ \mathfrak{A}$, define


    $\pi : (x, A) \sim_y (x'', A'') \quad (9.31)$


    to mean $\pi \cdot x = x''$ and $\pi \#(\mathrm{supp}\ x - A) = (\mathrm{supp}\
    x'' - A'')$. Here we regard $\mathrm{Perm}\ \mathfrak{A}$ as a nominal set as
    in Lemma 2.21; so $\pi \#(\mathrm{supp}\ x - A)$ means $(\forall a \in supp x
    - A) \pi a = a$. Write.


    $(x, A) \sim_y (x'', A'')$


    to mean that $\pi : (x, A) \sim_y (x'', A'')$ holds for some $\pi \in \mathrm{Perm}\
    \mathfrak{A}$. The following properties are easily verified:


    $id : (x, A) \sim_y (x, A) , \quad (9.32)$


    $\pi : (x, A) \sim_y (x'', A'') \Rightarrow \pi^{-1} : (x'', A'') \sim_y (x, A)
    , \quad (9.33)$


    $\pi : (x, A) \sim_y (x'', A'') \wedge \pi'' : (x'', A'') \sim_y (x'''', A'''')
    ,$


    $\Rightarrow \pi \circ : (x, A) \sim_y (x'''', A'''') , \quad (9.34)$


    $\pi : (x, A) \sim_y (x'', A'') \Rightarrow (\pi \circ \pi'')^{-1} : (\pi \cdot
    x'', \pi'' \cdot A'') \sim_y (\pi'' \cdot x, \pi'' \cdot A) . \quad (9.35)$


    Therefore is an equivariant equivalence relation on $X \times P_{\mathfrak{A}}$.
    We write Fr for the quotient nominal $(X \times P_{\mathfrak{A}})/$ and $x_A$
    for the equivalence class of $(x, A) \in X \times P_{\mathfrak{A}}$.


    **Lemma 9.13** If $\pi : (x, A) \sim_y (x'', A'')$, then $\pi \#(\mathrm{supp}\
    x \cap A) = \mathrm{supp}\ x'' \cap A''$. .


    Proof Suppose $\pi : (x, A) \sim_y (x'', A'')$. Then we have


    $\mathrm{supp}\ x'' - A'' \uplus (\mathrm{supp}\ x'' \cap A)$


    = \mathrm{supp}\ x''$


    = \{ \since \pi \cdot x = x'' \}


    = \mathrm{supp}(\pi \cdot x)$


    = \{ \by Proposition 2.11 \


    = \pi \cdot (\mathrm{supp}\ x)


    = \pi \cdot (\mathrm{supp}\ x - A) \uplus \pi \cdot (\mathrm{supp}\ x \cap A)$


    = \{ \since \pi \# (\mathrm{supp}\ x - A) \}


    $(\mathrm{supp}\ x - A) \uplus (\mathrm{supp}\ x \cap A)$


    = \{ \since \mathrm{supp}\ x - A = \mathrm{supp}\ x'' - A'' \}


    $(\mathrm{supp}\ x'' - A'') \uplus \pi \cdot (\mathrm{supp}\ x \cap A)$,


    and therefore $\mathrm{supp}\ x'' \cap A'' = \pi \cdot (\mathrm{supp}\ x \cap
    A)$.


