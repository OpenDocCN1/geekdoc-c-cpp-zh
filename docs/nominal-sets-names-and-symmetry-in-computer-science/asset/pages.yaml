    Section 4.1 gave a structurally inductive characterization of $\alpha$-equivalence
    ($=\alpha$) for the untyped $\lambda$-calculus that makes use of name permutations
    rather than more general renaming operations on $\lambda$-terms. This suggests
    a generalized form of $\alpha$-equivalence that applies to the elements of any
    nominal set $X$ and not just to nominal sets of algebraic terms. Define the binary
    relation $\approx\alpha$ on $X \times X$ by


    ```

    $(a_1, x_1) \approx\alpha (a_2, x_2) \Leftrightarrow (\forall a) (a_1) \cdot x_1
    = (a_2) \cdot x_2 . \quad (4.7)$

