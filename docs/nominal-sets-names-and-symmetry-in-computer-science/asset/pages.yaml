    \ of domain theory:\n\n+   * *Approximation*: the denotation of a program with\
    \ potentially infinite behaviour should be the limit of approximations that are\
    \ finite in some suitable sense.\n\n+   * *Compositionality*: the denotation of\
    \ a compound program should be a function of the denotations of the programs of\
    \ which it is compounded; moreover these functions should be *continuous*, that\
    \ is, preserve limits of approximations.\n\nFor domain theory based on approximation\
    \ via a partial ordering (rather than a metric), limits are given by taking joins\
    \ of directed subsets; and continuity means preserving joins of directed subsets.\
