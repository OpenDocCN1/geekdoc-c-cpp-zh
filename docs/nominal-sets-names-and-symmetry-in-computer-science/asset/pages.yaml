  md: '# Nominal algebraic data types


    +   - Some syntactic categories are ‘sorts of name’. Language terms of such a
    sort form an infinite collection of elements whose only attribute, from the point
    of view of the semantics of the language, is its identity. For example, there
    might be sorts of ‘identifier’ and ‘type variable’ whose terms are represented
    by strings of alphanumeric characters formed according to specific rules; but
    such details are usually irrelevant to the semantics of the language, we abstract
    away from such details and just assume there are disjoint infinite sets of atomic
    names of sort ‘identifier’ and ‘type variable’


    +   - Some operations are binders. Then, the sorts of one or more of their arguments
    are sorts of name in the above sense; and when the operation is applied to form
    a term, such an argument (‘binding name’) is linked, in one way that has to be
    specified for the binding operation, to occurrences of the same name (‘bound names’)
    elsewhere in the term. The concrete detail of which particular name is used for
    a binding-bound linkage is usually irrelevant to the semantics of the language.
    In other words, whatever the meaning of a term, it should be invariant under ‘-converting’
    such linkage to use another, so far unused name.


    We take account of these features, following (Urban et al., 2004) we will use
    sorts that are built up from name-sorts N and data-sorts D according to the following
    grammar:







    $$S := N | D | 1 | N . S | S , S .$$


    The compound sort N . S classifies terms that bind a name of N in a sort given
    by a term of S. The compound sort S₁, S₂ classifies terms that are pairs of the
    indicated sorts. Iterating, we get sorts of the form $S_1 , ... , S_n$ classifying
    tuples, with the $n=0$ case given by the unit sort S.


