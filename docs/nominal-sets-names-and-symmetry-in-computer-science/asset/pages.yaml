  md: "11.3 Uniform directed complete posets\n\n# 11.3 Uniform directed complete posets\n\
    \nRecall that a *chain* in a poset $D$ is a non-empty subset $C \\subseteq D$\
    \ for which the partial order on $D$ restricts to a total order:\n\n```\n$$\\\
    forall d, d' \\in C) d \\subseteq d' \\vee d' \\subseteq d$. (11.12)\n```\n\n\
    Clearly every chain is a directed subset (11.4). So long as one considers chains\
    \ of arbitrary size, a poset possesses joins of directed subsets iff it possesses\
    \ joins of chains (see Markowsky, 1976). However, this equivalence relies on the\
    \ Axiom of Choice and, as we noted in Section 2.7, that fails to hold for nominal\
    \ sets. Therefore, in a ‘nominal’ version of domain theory, formulating limits\
    \ in terms of chains is more restrictive than using joins of arbitrary subsets.\
    \ (Of course, both the chains and the directed subsets should be finitely supported,\
    \ to make sense.) However, in view of the following proposition one can use the\
    \ classical result about chains and directed subsets to reduce that a nominal\
    \ poset has joins for all finitely supported chains if it has joins for uniformly\
    \ supported directed subsets. So a domain theory based upon joins of uniformly\
    \ supported directed subsets is in effect the development of domain theory based\
    \ upon chain-completeness within the higher-order logic of nominal sets.\n\n**Proposition\
    \ 11.9** (Turner, 2009, lemma 3.4.2.1) In a nominal poset $D$, every finitely\
    \ supported chain is a uniformly supported subset.\n\n*Proof* Suppose $A \\in\
    \ P_i \\mathbb{A}$ supports $C$ in $P_f D$. For any $a_1, a_2 \\in \\mathbb{A}\
