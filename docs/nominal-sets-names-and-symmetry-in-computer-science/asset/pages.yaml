    \ and relation symbols in $\\varphi$ are all interpreted by equivariant functions\
    \ and subsets, then Theorem 1.9 implies that the interpretation of $\\varphi(x_1,\
    \ \\dots, x_n)$ is an equivariant subset of $X_1 \times \\dots \times X_n$. We\
    \ thus have:\n\n# **Equivariance Principle** *Any function or relation that is\
    \ defined from equivariant functions and relations using classical higher-order\
    \ logic is itself equivariant.*\n\nWe will use this principle to avoid proving\
    \ that practical constructs are equivariant on a case-by-case basis. The next\
