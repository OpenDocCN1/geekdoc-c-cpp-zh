    \ then $(a_1 \\cdot a_2) \\cdot x \\in C$ and since $C$ is a chain, this implies\
    \ that $x \\subseteq (a_1 \\cdot a_2) \\cdot x$, or $(a_1 \\cdot a_2) \\subseteq\
    \ x$; hence by (11.3) $(a_1 \\cdot a_2) \\cdot x = x$. For all $a_1, a_2 \\in\
    \ \\mathbb{A} \\setminus A$ we have $(a_1 \\cdot a_2) \\cdot x = x$. Therefore\
