    # 4.5 Freshness condition for binders


    In this section we give analysis of what is needed to specify functions of name
    abstractions somewhat different from the one in Theorem 4.13. By construction,
    functions with domain [A]X correspond to functions with domain A × X that respect
    the generalized a-equivalence relation ≈a. The next theorem shows that the requirement
    that a function respects ≈a is equivalent to a simpler condition involving freshness,
    the freshness condition for binders by Pitts (2006). At the same time the theorem
    embodies another common pattern when defining functions on a-equivalence classes,
    namely that one only specifies the bound for names avoiding some finite set of
    ''bad'' names. (The support of F plays this role in the theorem below.) For example,
    when capturing-avoiding substitution for a λ-term la.t one just just that a avoids
    the set of free variables of the term to be substituted.


