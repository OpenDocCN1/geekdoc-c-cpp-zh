    # 2.10 Non-finite support


    The definition of support given at the beginning of Section 2.1 makes sense

    whether or not support sets are finite. Restricting to finite ones, and

    we do, is a simple way of guaranteeing that a support does not exhaust

    the wholly infinite set of atomic names. We immediately exploited

    fact in the proof of existence of smallest support sets (Proposition 2.3);\sand
    we will make great use of this ability to ''choose a fresh name'' in the

    ext and subsequent chapters. However, in the literature other ways have been

    considered for ensuring a supply of atomic names not in any given support,

    more subtle than just requiring the cardinality of the support sets to be strictly
    less

    than the cardinality of the whole set of names.


    Cheney (2006) develops a generalization of the nominal in

    which support sets are elements of some proper ideal of $(P_{\mathbb{A}}\subseteq)$
    extending

    the ideal $(P_{\mathbb{A}}\subseteq)$, the extra generality is used to completeness
    results for

    nominal logic (Pitts, 2003).


    Gabbay (2007) considers supports that are finite, but well-ordered subsets

    of an uncountable set of atomic names. The motivation is to get a generalization-

    of the name-abstractions that we consider in Chapter 4 to a form of ab-

    straction over countably infinite sequences of names. Gabbay shows how this

    connect with the use of an $\omega$-indexed sequence of de Bruijn indices

    representing $\alpha$-equivalence sequences of syntax (de Bruijn, 1972).


    Permissive-nominal sets (Dowek et al., 2010), are another generalization of

    nominal sets that use non-finite supports. Gabbay (2012) uses them to

    get completeness results for nominal algebra (Gabbay and Mathissen, 2009)\sand
    permissive nominal logic (Dowek and Gabbay, 2012). In the permissive-

