    # 1.2 Products and coproducts


    Given a group G and G-sets X_1, \dots, X_n we make the cartesian product


    ```

    $X_1 \times \dots \times X_n \triangleq ((x_1, \dots, x_n) \mid x_1 \in X_1 \\wedge
