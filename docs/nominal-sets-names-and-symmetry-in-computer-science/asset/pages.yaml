  md: '# # 7

    Inductive and coinductive definitions


    In this chapter we consider the implications of the theory of nominal sets for
    a fundamental technique in programming language semantics – the use of inductive
    and coinductive definitions of subsets of a given set. Such definitions are often
    specified via a set of rules. Taking into account equivariance and, more generally,
    finite support properties of the rules can be very useful when reasoning about
    the properties of such rule-based definitions.


    # ## 7.1 Inductively defined subsets


    A rule over a set X is a pair (H, c), where H \\subseteq X is the rule’s *hypotheses*
    and $c \in X$ is its *conclusion*. Given a set of rules $R \subseteq P X \times
    X$, we say that a subset $S \subseteq X$ is *closed under the rules in $R$* if


    ```

    $H \in S \Rightarrow c \in S$

    ```


    holds for all $(H, c) \in R$. Note that the intersection of a collection of subsets
    is another subset. Therefore


    ```

    $\{S \in P X \mid S \text{ is closed under the rules in } R\}$

    ```


    is the smallest (with respect to inclusion) subset of $X$ that is closed under
    the rules in $R$. We call the *inductively defined subset* of $X$ specified by
    the set of rules $R$.


    A rule $(H, c)$ over a set $X$ is *finitary* if its set of hypotheses $H$ is finite.
