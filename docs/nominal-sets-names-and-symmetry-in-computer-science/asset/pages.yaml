  md: '# Functional programming


    # 10.13 Purity


    Informal algorithms that compute with syntactical data involving binders very
    often use the operation of choosing a fresh name. Here ‘fresh’ means avoiding
    some finite set of bad names that is implicit from the context’. Such computations
    are impure, in the sense that they involve side-effects: there is a state given
    by a finite set of names and it changes as fresh names are chosen and added to
    it. However, it seems that for the kind of computations that arise in practice,
    these state changes are unobservable and hence ignorable, because the value of
    final result is independent of the fresh names chosen during the computation.
    The nominal sets notion of freshness (Chapter 3) provides a very good mathematical
    model for this kind of independence of values from (freshly chosen) names. For
    example, in an α-structural primitive recursion (Section 8.5), the freshness condition
    on binders is exactly this kind of dependence condition and guarantees that we
    get a well defined mathematical function of α-equivalence classes from the functions
    specifying the recursion. We have just seen that structural recursions can be
    computed correctly by OCaml’s method for eliminating name-abstractions using dynamic
    allocation. However, the language makes no attempt to enforce the property that
    all computations are independent of choices of fresh name. For example, we cannot
    apply Theorem 8.17 to


    $X \triangleq \lambda^*$ (finite lists of atomic names),

    $F_1 \in \lambda^* \bowtie_{f_k} X \triangleq \lambda a \to []$,

    $F_2 \in \lambda^* \bowtie_{\Sigma_o}(\text{Term}) \times X \bowtie_{f_k} X \triangleq
    \lambda(a, e, l) \to a :: l \,ell$,

    $F_3 \in \Sigma_o(\text{Term}) \times \Sigma_o(\text{Term}) \times X \bowtie_{f_k}
    X \triangleq \lambda(e_1, e_2, l_1, l_2) \to l_1 ++ l_2$,


    where [] is the empty list, $::$ is list append and $++$ is concatenation, to
    deduce the existence of a function $\hat{F} \in \Sigma_o(\text{Term}) \bowtie_{f_k}^*$
    satisfying


