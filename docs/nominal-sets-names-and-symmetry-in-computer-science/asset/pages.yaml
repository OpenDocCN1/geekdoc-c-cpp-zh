    given by the usual operations of composition and identity for functions. A sub-group
    of a group G is a subset G'' ⊆ G that contains e and is closed under the group
    multiplication and inverse operations.


    **Example 1.1** If A is a set, then a permutation of A is a bijection π from A
    to itself. The composition π'' ∘ π of two functions that are permutations is another,
    such as the inverse function π⁻¹ of a permutation; and the identity function id
    on A is a permutation. Therefore, taking the group multiplication to be function
    composition, the permutations of A form a group, called the symmetric group on
    the set A and denoted Sym A. It is a classic result of group theory (Cayley''s
    theorem, a special case of the Yoneda lemma in category theory) that every group
    is isomorphic to a subgroup of a symmetric group.


    An action of a group G on a set X is a function G×X assigning to each (g, x) ∈
    G×X an element g· x satisfying


    ```

    e·x = x,

    ```


    for all g,g'' ∈ G and x ∈ X. This is equivalent to specifying a morphism of groups
    → Sym X (Exercise 1.1).


    **Definition 1.2** If G is a group, a G-set is a set X equipped with an action
    of G on X. We will usually refer to a G-set by naming its underlying set X, using
    the notation · for all groups, whatever the set X. G-sets are the objects of a
    category [G, Set] whose morphisms from X to X'' are equivariant functions, that
    is, functions F: X → X''


    ```

    F(g·x) = g·(Fx)

    ```


    for all g ∈ G and x ∈ X. Composition and identities in the category are the same
    as in the category Set of sets and functions.


    **Example 1.3** If G is any subgroup of the symmetric group Sym A, we get a G-set
    with underlying set A by taking the G-action to be given by function: π·a = π·a.


    **Example 1.4** Let Σ be a (single-sorted) algebraic structure, Thus Σ = (Σₙ |
    n ∈ N) is a countably infinite family of elements. Each set Σₙ are the n-ary operations
    of the signature. The set Σ[X] of algebraic terms over Σ with variables drawn
    from set X is inductively defined by the following rules:


    | x ∈ X | t₁ Σ[X] | ... | tn Σ[X] | op ∈ Σₙ |

    | x ∈ Σ[X] | | | | op(t₁, ..., tn) ∈ Σ[X] |'
