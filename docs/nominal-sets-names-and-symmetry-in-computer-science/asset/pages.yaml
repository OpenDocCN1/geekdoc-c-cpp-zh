    As a corollary of Rule Induction we have the following inversion principle:


    **Rule Inversion Principle** If $S$ is the subset of $X$ inductively defined by
    a set of rules $R$, then for every element $x \in S$, there is a rule $(H, c)
    \in R$ with $H \subseteq S$ and $c = x$.


    Proof We use the Rule Induction Principle to show that


    ```

    $P \triangleq [c \in X \mid (exists H)(H, c) \in R \wedge H \subseteq S]$

    ```


    contains $S$. Note that since $S$ is closed under the rules $R$, by definition
    of $P$ we have $c \in P \Rightarrow c \in S$. So if $(H, c) \in R$ satisfies $H
    \subseteq P$, then $H \subseteq S$ and by definition of $P$, $c \in P$. Therefore
    $P$ is indeed closed under each rule in $R$ and contains $S$.


    Rule-based induction of subsets abound in the structural approach to operational
    semantics of programming languages (Plotkin, 1981). In this setting, the elements
    of the set $X$ have some structure related to the programming language in question
    and is reflected in the collection of rules. Then when applying the above Rule
    Inversion Principle, precisely which rules $(H, c)$ have their conclusion equal
    to any given $x \in S$ is determined by the structure of $x$. In this case one
    speaks of $\lambda$-directed rules.


