  md: '# 8

    Nominal algebraic data types


    In this chapter we consider initial algebras for functorial constructions on nominal
    sets that combine products and coproducts with the name-abstraction construction
    from Chapter 4. Such initial algebras give a semantics for languages involving
    names and name-binding operations where term equality is α-equivalence. This generalizes
    the classic initial algebra semantics of algebraic data types (Goguen et al.,
    1977) and associated principles of structural recursion and induction.


    # 8.1 Signatures


    In the literature of programming language theory, the syntax of a language is
    usually specified by an algebraic signature. This gives a number of sorts, or
    ‘syntactic categories’, into which the terms of the language are divided, together
    with a number of operations for constructing terms of the various sorts. As well
    as giving the sorts and the operations, the signature specifies the type of each
    operation, namely how many arguments each operation takes, what the sorts of those
    arguments are, and what sort of the operation constructs. We will use the notation


    ```

    op : S_1 , \dots , \dots , S_n \to S \quad (8.1)

    ```


    to indicate that an operation op constructs a term op($t_1, \dots, t_n$) of sort
    S from terms $t_1, \dots, t_n$ of sorts $S_1, \dots, S_n$. (When n = 0 such an
    operation amounts to a constant of sort S.)


    The two related features of languages that occur in practice are not covered by
    this notion of algebraic signature, but are so common that it is worth enhancing
    the notion to formalize them:'
