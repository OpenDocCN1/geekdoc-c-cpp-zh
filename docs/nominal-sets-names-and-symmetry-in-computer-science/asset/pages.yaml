  md: '# Functional programming


    # 10.11 Step-indexed logical relation


    ‘Logical\u2019 were originally used in the denotational semantics of lan-

    gages based on typed $\lambda$-calculus (Plotkin, 1973; Statman, 1985). Subsequent-

    t have proved for proving properties of operationally defined no-

    gram program equivalence in higher-order typed programming languages;

    see Pitts (2005), for example. Although there are many different flavours

    of logical relation, their common feature is that at function two types

    related iff they send related arguments to related results. This feature means

    at the relation being defined both positively and negatively in the re-\cursive
    specification of its desired properties. This creates a difficulty when trying

    to construct them. For example, a naive application of Tarski''s fixed-point

    theorem (Theorem 7.12) will not suffice, even though the specification

    of the logical relation is in the form of a fixed-point of a on relations,

    function is not monotone. This difficulty did not arise in the original

    oflogical relations for simply typed languages, where a definition by recursion

    to the structure of types is possible. However, it was a block on the applica-

    t of method of logical relations in more complicated cases, such as for

    languages recursively defined data types (such as $\lambda AML$). The

    diculty has been overcome by using certain kinds of indexed families

    of relations where the indices relate to steps of computation in the language''s

    operational semantics. A well-founded relation by well-founded recursion. This
    is the

    definition of the entire logical relation introduced by Appel and McAllister

    (2001) and adapted to the context of contextual equivalence which we are

    concerned here by Ahmed (2006). The notion is even more effective when

    combined with the use of bi-orthogonal closure of relations (Pitts, 2000); see

    Dreyer et al. (2010), for example. Using this combination we obtain a proof of

    properties of $\lambda AML$ relative to the Abstractness criterion (Theorem 10.13)
    is

    sewhat simpler than others in the literature. For example, compare the

    proof of extensality for abstraction types in (Pitts and Shinwell, 2008,

    appendix B) with its proof as a corollary of the way the logical relation is

    defined (proof of property) (vi) in Theorem 10.13. Even so, the development

    in this section is long and tedious. The reader more interested in the

    of Theorem 10.13 may consider skipping to the next section.


    Figure 10.8 specifies step-indexed logical relations for closed values, ex-

    pressions and frame stacks in $\lambda AML$. Bi-orthogonality features in the
    way

    the relation for expressions ($\mathcal{E}$) is defined in terms of the relation
    for frame

    stacks ($\mathcal{F}$) and the way in which the latter is defined in terms of
    the relation for

    values ($\mathcal{V}$). Step-indexing features through the use of indices $(n,
    T) \in N \times Type'
