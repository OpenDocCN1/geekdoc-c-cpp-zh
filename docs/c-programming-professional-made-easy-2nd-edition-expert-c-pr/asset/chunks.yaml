  trans: "\n\n这是一个非常有用的循环，可以确保至少运行一次。`FOR` 和 `WHILE` 循环在循环开始时检查条件，这确保了它们不会立即通过或失败。`DO…WHILE`\
    \ 循环会在循环结束后检查条件。这确保了循环在发生通过或失败之前至少运行一次。\n\n请看这个示例：\n\n```c\n#include <stdio.h>\n\
    \nint main()\n{\n  int y;\n  y = 10;\n  do {\n    printf(\"This loop is running!\\\
    n\");\n  } while ( y != 10 );\n  getchar();\n}\n```\n\n这种类型的循环无论条件结果是 TRUE 还是\
    \ FALSE 都会显示消息。变量 `y` 被设置为 10。`WHILE` 循环被设置为当 `y` 值不等于 10 时运行，此时循环结束。消息之所以被打印，是因为在循环结束之前并不会检查条件。\n\
    \n`DO..WHILE` 循环的 `WHILE` 部分必须以分号结束。这也是循环以这种方式结束的唯一情况。\n\n# 第 5 章 存储类\n\n存储类是指\
    \ C 程序中函数和变量的生命周期和可见性。这些限定符出现在它们所修改的类型之前。C 程序中最常用的存储类包括 `auto`、`static`、`register`\
    \ 和 `extern`。那么，这些存储类是如何使用的呢？\n\n## Auto\n\n这种存储类被认为是所有局部变量的默认存储类。考虑这个示例：\n\n\
    ```c\n{\nint mount;\nauto int month;\n}\n```\n\n上面的示例具有具有相似存储类的变量。请注意，`auto` 只能在函数内部使用。\n\
    \n### Register\n\n这种存储类通常用于必须存储在寄存器而不是 RAM 中的局部变量。变量的大小应该小于或等于寄存器的大小。它不应该使用一元运算符\
    \ `&`，因为它不包含内存。看这个示例：\n\n```c\n{\nregister int kilometers;\n}\n```\n\n记住，`register`\
    \ 存储类在用于像计数器那样的变量时是有效的。此外，应该注意根据硬件的限制，它并不一定会将变量存储在寄存器中。\n\n### Static\n\n存储类命令编译器在整个程序的生命周期内保存局部变量，而不是在进入和离开范围时销毁它。此外，你可以将\
    \ `static` 修饰符用于全局变量。如果这样做，变量的作用范围可以在其声明的文件中进行调节。`static` 允许所有对象共享其成员数据的一份副本。\n\
    \n```c\n#include <stdio.h>\n\n/* 函数声明 */\nvoid func(void);\n\nstatic int count\
    \ = 5; /* 全局变量 */\nmain()\n{\nfunc();\nreturn 0;\n}\n\n/* 函数定义 */\nvoid func(\
