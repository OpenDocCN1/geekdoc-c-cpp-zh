  raw: "The double data type is used for storing real numbers that have double precision.\
    \ Memory space used is 8 bytes. Double data type useslong as a type modifier.\
    \ This uses up memory storage space of 10 bytes.\n\nvoid\n\nVoid data type is\
    \ used for specifying empty sets, which do not contain any value. Hence, void\
    \ data type also occupies no space (0 bytes) in the memory storage.\n\n_Bool\n\
    \nThis is a Boolean type of data. It is an unsigned type of integer. It stores\
    \ only 2 values, which is 0 and 1. When using _Bool, include <stdboolh>.\n\n_Complex\n\
    \nThis is used for storing complex numbers. In C, three types of _Complex are\
    \ used. There is thefloat _Complex,double _Complex, andlong double _Complex. These\
    \ are found in <complex h> file.\n\nArrays\n\nThis identifier is used in referring\
    \ to the collection of data that share the same name and of the same type of data.\
    \ For example, all integers or all characters that have the same name. Each of\
    \ the data is represented by its own array element. The subscripts differentiate\
    \ the arrays from each other.\n\nConstants\n\nConstants are identifiers used in\
    \ C. The values of identifiers do not change anywhere within the program. Constants\
    \ are declared this way:\n\n             const datatype varname = value\n\nconst\
    \ is the keyword that denotes or declares the variable as the fixed value entity,\
    \ i.e., the constant.\n\nIn C, there are 4 basic constants used. These include\
    \ the integer constant, floating-point, character and string constants. Floating-point\
    \ and integer types of constant do not contain any blank spaces or commas. Minus\
    \ signs can be used, which denotes negative quantities.\n\nInteger Constants\n\
    \nInteger constants are integer valued numbers consisting of sequence of digits.\
    \ These can be written using 3 different number systems, namely, decimal, octal\
    \ and hexadecimal.\n\n Decimal system (base 10)\n\nAn integer constant written\
    \ in the decimal system contains combinations of numbers ranging from 0 to 9\\\
    . Decimal constants should start with any number other except 0\\. For example,\
    \ a decimal constant is written in C as:\n\n             const int size =76\n\n\
    \ Octal (base 8)\n\nOctal constants are any number combinations from 0 to 7\\\
    . To identify octal constants, the first number should be 0. For example:\n\n\
                               const int a= 043; const int b=0;\n\nAn octal constant\
    \ is denoted in the binary form. Take the octal 0347\\. Each digit is represented\
    \ as:\n\n0347 = 011 100 111 = 3 * 82 + 4 * 81 + 7 * 80 = 231\n\n --- --- --- \n\
    \n 3   4   7\n\nHexadecimal constant (base 16)\n\nThis type consists of any of\
    \ the possible combinations of digits ranging from 0 to 9\\. This type also includes\
    \ letters a to f, written in either lowercase or uppercase. To identify hexadecimal\
    \ constants, these should start with oX or 0X. For example:\n\n             const\
    \ int c= 0x7FF;\n\nFor example, the hexadecimal number 0x2A5 is internally represented\
    \ in bit patterns within C as:\n\n0x2A5 = 0010 1010 0101 = 2 * 162 + 10 * 161 +\
    \ 5 * 160 = 677\n\n        ---- ---- ---- \n\n          2    A   5\n\nWherein,\
    \ 677 is the decimal equivalent of the hexadecimal number 0x2.\n\nPrefixes for\
    \ integer constants can either be long or unsigned. A long integer constant (long\
    \ int) ends with alofL, such as  67354Lor67354l. The last portion of an unsigned\
    \ long integer constant should either beul or  UL, such as672893ULor  672893ul. \
    \ For an unsigned long long integer constant,ULorul should be at the last portion.\
    \ An unsigned constant should end withUoru, such as673400095uor673400095U. Normal\
    \ integer constants are written without any suffix, such as a simple67458.\n\n\
    Floating Point Constant\n\nThis type of constant has a base 10 or base 16 and\
    \ contains an exponent, a decimal point or both. For a floating point constant\
    \ with a base 10 and a decimal point, the base is replaced by anEore. For example,\
    \ the constant 1.8 *10̂-3 is written as 1.8e-3 or 1.8E-3.\n\nFor hexadecimal character\
    \ constants and the exponent is in the binary form, the exponent is replaced byPorp.\
    \ Take a look at this example:\n\nThis type of constant is often precision quantities.\
    \ These occupy around 8 bytes of memory. Different add-ons are allowed in some\
    \ C program versions, such asFfor a single precision floating constant orL for\
    \ a long floating point type of constant.\n\nCharacter Constant\n\nA sequence\
    \ of characters, whether single or multiple ones, enclosed by apostrophes or single\
    \ quotation marks is called a character constant. The character set in the computer\
    \ determines the integer value equivalent to each character constant. Escape sequences\
    \ may also be found within the sequence of a character constant.\n\nSingle character\
    \ constants enclosed by apostrophes is internally considered as integers. For\
    \ example, ‘A’ is a single character constant that has an integer value of 65\\\
    . The corresponding integer value is also called the ASCII value. Because of the\
    \ corresponding numerical value, single character constants can be used in calculations\
    \ just like how integers are used. Also, these constants can also be used when\
    \ comparing other types of character constants.\n\nPrefixes used in character\
    \ constants such asL,Uoru are used for character literals. These are considered\
    \ as wide types of character constants. Character literals with the prefixL are\
    \ considered under the typewchar_t, which are defined as <stddef.h> under the\
    \ header file. Character constants that use the prefixUoruare considered as typechar16_torchar32_t. \
    \ These are considered as unsigned types of characters and are defined under the\
    \ header file as<uchar.h>.\n\nThose that do not have the prefixL are considered\
    \ a narrow or ordinary character constant.  Those that have escape sequences or\
    \ are composed of at least 2 characters are considered as multicharacter constants.\n\
    \nEscape sequences are a type of character constant used in expressing non-printing\
    \ characters like carriage return or tab. This sequence always begins with a backward\
    \ slash, followed by special characters. These sequences represent a single character\
    \ in the C language even if they are composed of more than 1 character. Examples\
    \ of some of the most common escape sequences, and their integer (ASCII) value,\
    \ used in C include the following:\n\n Character Escape Sequence ASCII Value\n\
    \n              Backspace                            \\b                           \
    \                             008\n\nBell                                         \
    \ \\a                                                        007\n\n             \
    \ Newline                            \\n                                         \
    \               010\n\n              Null                                          \
    \ \\0                                                        000\n\n             \
    \ Carriage                            \\r                                         \
    \               013\n\n              Horizontal tab              \\t             \
    \                                           009\n\n              Vertical tab             \
    \               \\v                                                        011\n\
    \nForm feed                            \\f                                         \
    \               012\n\nString Literals\n\nMultibyte characters that form a sequence\
    \ are called string literals. Multibyte characters have bit representations that\
    \ fit into 1 or more bytes. String literals are enclosed within double quotation\
    \ marks, for example,“A” and  “Anna”. There are 2 types of string literals, namely,\
    \ UTF-8 string literals and wide string literals. Prefixes used for wide string\
    \ literals includeu,UorL. Prefix for UTF-8 string literals isu8.\n\nAdditional\
    \ characters or extended character sets included in string literals are recognized\
    \ and supported by the compiler. These additional characters can be used meaningfully\
    \ to further enhance character constants and string literals.\n\nSymbolic constants\n\
    \nSymbolic constants are substitute names for numeric, string or character constants\
    \ within a program. The compiler would replace the symbolic constants with its\
    \ actual value once the program is run."
