    Nested Switch Statements


    If you are wondering whether or not it is possible to use a switch in an outer
    switch statement sequence, the answer is yes. You can include a switch in the
    statement sequence without encountering any conflicts even though the case constants
    of the outer and inner switch have common values.


    Syntax


    This is the general syntax for a nested switch:


    switch (ch 1)


    {


    case ‘A’:


    printf (“This A is part of the outer switch” );


    switch (ch 2)


    {


    case ‘A’:


    printf (“This A is part of the inner switch” );


    break;


    case ‘B’:


    /* case code */


    }


    break;


    case ‘B’:


    /* case code */


    }


    Example:


    #include <stdio.h>


    int main ( )


    {


    /* local variable definition */


    int a = 100;


    int b = 200;


    switch (a)


    {


    case 100:


    printf (“This is part of the outer switch\n”, a );


    switch (b)


