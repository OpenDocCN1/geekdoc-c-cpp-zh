    The while loop repeatedly executes a particular statement if the given condition
    is true.


    Syntax


    The general syntax of a while loop is as follows:


    while (condition)


    {


    statement(s);


    }


    You can use a single statement or a block of statements in a while loop. Also,
    you can give a condition of any expression, but non-zero values are considered
    true. As long as the condition is true, the loop continues to iterate. Once the
    condition becomes false, the program control passes to the line that immediately
