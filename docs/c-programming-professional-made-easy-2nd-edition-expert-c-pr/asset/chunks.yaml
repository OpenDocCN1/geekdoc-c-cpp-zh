- fmt: "\n# 排版后的文档\n\n在程序的开头，通过`#define`特性定义符号常量。该特性被称为预处理指令。\n\n与其它C语句不同，符号常量的定义不以分号结尾。请看以下示例：\n\
    \n```\n#define PI 3.1415\n//PI是表示值3.1415的常量\n\n#define True 1\n\n#define name\
    \ \"Alice\"\n```\n\n对于所有数值型常量（如浮点数和整数），不包含非数字字符和空格。这些常量还受到最小值和最大值的限制，通常取决于计算机硬件。\n\
