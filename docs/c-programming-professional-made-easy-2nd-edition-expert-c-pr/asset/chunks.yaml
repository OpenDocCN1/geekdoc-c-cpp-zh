  raw: 'Android application development is not easy. You must have some decent background
    in program development. It is a plus if you know Visual Basic and Java. And it
    will be definitely a great advantage if you are familiar or have already used
    Eclipse’s IDE (Integrated Development Environment). Also, being familiar with
    XML will help you.


    You will need a couple of things before you can start developing apps.


    First, you will need a high-end computer. It is common that other programming
    development kits do not need a powerful computer in order to create applications.
    However, creating programs for Android is a bit different. You will need more
    computing power for you to run Android emulators, which are programs that can
    allow you to test your programs in your computer.


    Using a weak computer without a decent processor and a good amount of RAM will
    only make it difficult for you to run those emulators. If you were able to run
    it, it will run slowly.


    Second, you will need an Android device. That device will be your beta tester.
    With it, you will know how your program will behave in an Android device. When
    choosing the test device, make sure that it is at par with the devices of the
    market you are targeting for your app. If you are targeting tablet users, use
    a tablet. If you are targeting smartphones, then use a smartphone.


    Third, you will need the Android SDK (Software Development Kit) from Google. The
    SDK is a set of files and programs that can allow you to create and compile your
    program’s code. As of this writing, the latest Android SDK’s file size is around
    350mb. It will take you 15 – 30 minutes to download it. If you uncompressed the
    Android SDK file, it will take up around 450mb of your computer’s disk space.
    The link to the download page is: http://developer.android.com/sdk/index.html


    The SDK can run on Windows XP, Windows 7, Mac OSX 10.8.5 (or higher), and Linux
    distros that can run 32bit applications and has glibc (GNU C library) 2.11 or
    higher.


    Once you have unpacked the contents of the file you downloaded, open the SDK Manager.
    That program is the development kit’s update tool. To make sure you have the latest
    versions of the kit’s components, run the manager once in a while and download
    those updates. Also, you can use the SDK Manager to download older versions of
    SDK. You must do that in case you want to make programs with devices with dated
    Android operating systems.


