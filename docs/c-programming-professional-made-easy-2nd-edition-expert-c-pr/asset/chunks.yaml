    break;


    }


    Keep in mind that your program will still produce the same output even if you
    do not include default labels.


    Rule 8: The default may be placed anywhere in the switch.


    Example:


    switch (roll)


    {


    case 1:


    printf (“C Language”);


    break;


    case 2:


    printf (“C++ Language”);


    break;


    default:


    printf (“No student found”);


    break;


    case 3:


    printf (“Java Language”);


    break;


    }


    Rule 9: The break statement should take control out of the switch.


    Rule 10: A break statement may be shared by at least two cases.


    Example:


    switch (beta)


    {


    case ‘a’:


    case ‘A’:


    printf (“Letter A”);


    break;


    case ‘b’:


    case ‘B’:


    printf (“Letter B”);


    break;


    }


    Rule 11: Nesting, which is basically using a switch within a switch, can be used.


    Example:


    switch (beta)


    {


    case ‘a’:


    case ‘A’:


    printf (“Letter A”);


    break;


    case ‘b’:


    case ‘B’:


    switch (beta)


    {


    }


    break;


    }


    Rule 12: Relational operators should not be used in a switch statement.


    Example:


    switch (num)


    {


    case >14:


    printf (“Number > 14”);


    break;


    case =14:


    printf (“Number = 14”);


    break;


    case <14:


    printf (“Number < 14");


    break;


    }


    Remember that you cannot use relational operators as switch labels.


    Rule 13: Macro identifiers can be used as switch case labels.


    Example:


    #define MAX 1


    switch (num)


    {


    case MAX:


    printf (“Number = 1”);


    break;


    }


    Rule 14: The const variable can be used in a switch case statement.


    Example:


    int const var = 1;


    switch (num)


    {


    case var:


    printf (“Number = 1”);


    break;


    }


