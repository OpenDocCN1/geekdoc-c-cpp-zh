    I want to thank you and congratulate you for downloading the book,“Professional\
    \ C Programming Made Easy: Expert C Programming Language Success In A Day For\
    \ Any Computer User!”.\n\nThis book contains proven steps and strategies on how\
    \ to understand and perform C programming. C is one of the most basic programming\
    \ tools used for a wide array of applications. Most people stay away from it because\
    \ the language seem complicated, with all those characters, letters, sequences\
    \ and special symbols.\n\nThis book will break down every element and explain\
    \ in detail each language used in the C program. By the time you are done with\
    \ this book, C programming language will be easy to understand and easy to execute.\n\
    \nRead on and learn.\n\nThanks again for downloading this book. I hope you enjoy\
    \ it!\n\n# Chapter 1 The Basic Elements Of C\n\nThe seemingly complicated C program\
    \ is composed of the following basic elements:\n\nCharacter Set\n\nThe alphabet\
    \ in both upper and lower cases is used in C. The 0-9 digits are also used, including\
    \ white spaces and some special characters. These are used in different combinations\
    \ to form elements of a basic C program such as expressions, constants, variables,\
    \ etc.\n\nSpecial characters include the following:\n\n+ ,.  *– /  % = & ! #?”^\
    \ ‘| /  ( )< >  {  } [  ] ;: @ ~!\n\nWhite spaces include:\n\n*   Blank space\n\
    \n*   Carriage return\n\n*   Horizontal tab\n\n*   Form feed\n\n*   New line\n\
    \nIdentifiers\n\nAn identifier is a name given to the various elements of the\
    \ C program, such as arrays, variables and functions. These contain digits and\
    \ letters in various arrangements. However, identifiers should always start with\
    \ a letter. The letters may be in upper case, lower case or both. However, these\
    \ are not interchangeable. C programming is case sensitive, as each letter in\
    \ different cases is regarded as separate from each other. Underscores are also\
    \ permitted because it is considered by the program as a kind of letter.\n\nExamples\
    \ of valid identifiers include the following:\n\n             ab123\n\n A\n\n\
    \ stud_name\n\n average\n\n velocity\n\n TOTAL\n\nIdentifiers need to start with\
    \ a letter and should not contain illegal characters. Examples of invalid identifiers\
    \ include the following:\n\n              2nd                                          \
    \ - should always start with a letter\n\n              “Jamshedpur”             \
    \ - contains the illegal character (“)\n\n              stud name             \
    \               - contains a blank space, which is an illegal character\n\nstud-name             \
    \               - contains an illegal character (-)\n\nIn C, a single identifier\
    \ may be used to refer to a number of different entities within the same C program.\
    \ For instance, an array and a variable can share one identifier. For example:\n\
    \nThe variable isint difference, average, A[5]; // sum, average\n\nThe identifier\
    \ isA[5].\n\nIn the same program, an array can be named A, too.\n\n__func__\n\n\
    The__func__ is a predefined identifier that provides functions names and makes\
    \ these accessible and ready for use anytime in the function. The complier would\
    \ automatically declarethe__func__ immediately after placing the opening brace\
    \ when declaring the function definitions. The compiler declares the predefined\
    \ identifier this way:\n\n             static const char _ _func_ _[] = “Alex”;\n\
    \n“Alex” refers to a specific name of this particular function.\n\nTake a look\
    \ at this example:\n\n#include <stdio.h>\n\nvoid anna1(void)    {\n\n        \
    \ printf(\"%sn\",__func__);\n\n         return;\n\n} \n\nint main() {\n\n    \
    \ myfunc();\n\n}\n\nWhat will appear as an output will be anna1\n\nKeywords\n\n\
    Reserved words in C that come with standard and predefined meanings are called\
    \ keywords. The uses for these words are restricted to their predefined intended\
    \ purpose. Keywords cannot be utilized as programmer-defined identifiers. In C,\
    \ there are 32 keywords being used, which include the following:\n\nauto\n\nbreak\n\
    \nchar\n\ncase\n\ncontinue\n\nconst\n\ndo\n\ndefault\n\ndouble\n\nfloat\n\nelse\n\
    \nextern\n\nenum\n\ngoto\n\nfor\n\nif\n\nlong\n\nint\n\nregister\n\nshort\n\n\
    return\n\nsizeof\n\nsigned\n\nswitch\n\ntypedef\n\nstruct\n\nunion\n\nswitch\n\
    \nvoid\n\nunsigned\n\nwhile\n\nvolatile\n\nData Types\n\nThere are different types\
    \ of data values that are passed in C. Each of the types of data has different\
    \ representations within the memory bank of the computer. These also have varying\
    \ memory requirements. Data type modifiers/qualifiers are often used to augment\
    \ the different types of data.\n\nSupported data types in C include int, char,\
    \ float, double, void, _Bool, _Complex, arrays, and constants.\n\nint\n\nInteger\
    \ quantities are stored in this type of data. The data type int can store a collection\
    \ of different values, starting from INT_MAX to INT_MIN. An in-header file, <limits\
    \ h>, defines the range.\n\nThese int data types use type modifiers such as unsigned,\
    \ signed, long, long long and short.\n\nShort int means that they occupy memory\
    \ space of only 2 bytes.\n\nA long int uses 4 bytes of memory space.\n\nShort\
    \ unsigned int is a data type that uses 2 bytes of memory space and store positive\
    \ values only, ranging from 0 to 65535\\.\n\nUnsigned int requires memory space\
    \ similar to that of short unsigned int. For regular and ordinary int, the bit\
    \ at the leftmost portion is used for the integer’s sign.\n\nLong unsigned int\
    \ uses 4 bytes of space. It stores all positive integers ranging from 0 to 4294967295.\n\
    \nAn int data is automatically considered as signed.\n\nLong long int data type\
    \ uses 64 bits memory. This type may either be unsigned or signed. Signed long\
    \ long data type can store values ranging from ─9,223,372,036,854,775,808 to 9,223,372,036,854,775,807\\\
    . Unsigned long long data type stores value range of 0 to 18,446,744,073,709,551,615.\n\
    \nchar\n\nSingle characters such as those found in C program’s character set are\
    \ stored by this type of data. The char data type uses 1 byte in the computer’s\
    \ memory. Any value from C program’s character set can be stored as char. Modifiers\
    \ that can be usedare eitherunsignedorsigned.\n\nA char would always use 1 byte\
    \ in the computer’s memory space, whether it is signed or unsigned. The difference\
    \ is on the value range. Values that can be stored as unsigned char range from\
    \ 0 to 255\\. Signed char stores values ranging from ─128 to +127\\. By default,\
    \ a char data type is considered unsigned.\n\nFor each of the char types, there\
    \ is a corresponding integer interpretation. This makes each char a special short\
    \ integer.\n\nfloat\n\nA float is a data type used in storing real numbers that\
    \ have single precision. That is, precision denoted as having 6 more digits after\
    \ a decimal point. Float data type uses 4 bytes memory space.\n\nThe modifier\
    \ for this data type islong, which uses the same memory space as that of double\
    \ data type.\n\ndouble"
