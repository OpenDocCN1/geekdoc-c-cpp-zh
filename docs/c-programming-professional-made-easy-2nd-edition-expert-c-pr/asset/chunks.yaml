  raw: 'At the beginning of the program, the symbolic constant is defined with a #
    define feature. This feature is called the preprocessor directive.


    The definition of a symbolic constant does not end with a semi colon, like other
    C statements. Take a look at this example:


    #define  PI  3.1415


    (//PI is the constant that will represent value 3.1415)


    #define  True 1


    #define  name  "Alice"


    For all numeric constants such as floating point and integer, non-numeric characters
    and blank spaces are not included. These constants are also limited by minimum
    and maximum bounds, which are usually dependent on the computer.


    Variables


    Memory locations where data is stored are called variables. These are indicated
    by a unique identifier. Names for variables are symbolic representations that
    refer to a particular memory location. Examples are count, car_no and sum.


    Rules when writing the variable names


    Writing variable names follow certain rules in order to make sure that data is
    stored properly and retrieved efficiently.


    *   Letters (in both lowercase and uppercase), underscore (‘_’) and digits are
    the only characters that can be used for variable names.


    *   Variables should begin either with an underscore or a letter. Starting with
    an underscore is acceptable, but is not highly recommended. Underscores at the
    beginning of variables can come in conflict with system names and the compiler
    may protest.


    *   There is no limit on the length of variables. The compiler can distinguish
    the first 31 characters of a variable. This means that individual variables should
    have different sequences for the 1st 31 characters.


    Variables should also be declared at the beginning of a program before it can
    be used.


    Chapter 2 What is C Programming Language?


    In C, the programming language is a language that focuses on the structure. It
    was developed in 1972, at Bell Laboratories, by Dennis Ritchie. The features of
    the language were derived from “B”, which is an earlier programming language and
    formally known as BCPL or Basic Combined Programming Language. The C programming
    language was originally developed to implement the UNIX operating system.


    Standards of C Programming Language


    In 1989, the American National Standards Institute developed the 1st standard
    specifications. This pioneering standard specification was referred to as C89
    and C90, both referring to the same programming language.


    In 1999, a revision was made in the programming language. The revised standard
    was called C99\. It had new features such as advanced data types. It also had
    a few changes, which gave rise to more applications.


    The C11 standard was developed, which added new features to the programming language
    for C. This had a library-like generic macro type, enhanced Unicode support, anonymous
    structures, multi-threading, bounds-checked functions and atomic structures. It
    had improved compatibility with C++. Some parts of the C99 library in C11 were
    made optional.


    The Embedded C programming language included a few features that were not part
    of C. These included the named address spaces, basic I/O hardware addressing and
    fixed point arithmetic.


    C Programming Language Features


    There are a lot of features of the programming language, which include the following:


    *   Modularity


    *   Interactivity


    *   Portability


    *   Reliability


    *   Effectiveness


    *   Efficiency


    *   Flexibility


    Uses of the C Programming Language


    This language has found several applications. It is now used for the development
    of system applications, which form a huge portion of operating systems such as
    Linux, Windows and UNIX.


    Some of the applications of C language include the following:


    *   Spreadsheets


    *   Database systems


    *   Word processors


    *   Graphics packages


    *   Network drivers


    *   Compilers and Assemblers


    *   Operating system development


    *   Interpreters


    Chapter 3 Understanding C Program


    The C program has several features and steps in order for an output or function
    is carried out.


    Basic Commands (for writing basic C Program)


    The basic syntax and commands used in writing a simple C program include the following:


    #include <stdio.h>


    This command is a preprocessor. <stdio.h> stands for standard input output header
    file. This is a file from the C library, which is included before the C program
    is compiled.


    int main()


    Execution of all C program begins with this main function.


    {


    This symbol is used to indicate the start of the main function.


    }


    This indicates the conclusion of the main function.


    /* */


    Anything written in between this command will not be considered for execution
    and compilation.


    printf (output);


    The printf command prints the output on the screen.


    getch();


    Writing this command would allow the system to wait for any keyboard character
    input.


    return 0


    Writing this command will terminate the C program or main function and return
    to 0.


    A basic C Program would look like this:


    #include <stdio.h>


    int main()


    {


    /* Our first simple C basic program */


    printf(“Hello People! “);


    getch();


    return 0;


    } 


    The output of this simple program would look like this:


    Hello People!


    Chapter 4 Learn C Programming


    After learning the basic elements and what the language is all about, time to
    start programming in C. Here are the most important steps:


    Download a compiler


    A compiler is a program needed to compile the C code. It interprets the written
    codes and translates it into specific signals, which can be understood by the
    computer. Usually, compiler programs are free. There are different compilers available
    for several operating systems. Microsoft Visual Studio and MinGW are compilers
    available for Windows operating systems. XCode is among the best compilers for
    Mac. Among the most widely used C compiler options for Linux is gcc.


    Basic Codes


    Consider the following example of a simple C program in the previous chapter:


    #include <stdio.h>


    int main()


    {


        printf("Hello People!\n");


        getchar();


        return 0;


    }


    At the start of the program,#include command is placed. This is important in order
    to load the libraries where the needed functions are located.


    The<stdio.h> refers to the file library and allows for the use of the succeeding
    functionsgetchar() andprintf().


    The commandint main () sends a message to the compiler to run the function with
    the name “main” and return a certain integer once it is done running. Every C
    program executes a main function.


    The symbol{ } is used to specify that everything within it is a component of the
    “main” function that the compiler should run.


    The functionprintf() tells the system to display the words or characters within
    the parenthesis onto the computer screen. The quotation marks make certain that
    the C compiler would print the words or characters as it is. The sequence\n informs
    the C compiler to place its cursor to the succeeding line. At the conclusionof
    the line, a; (semicolon) is placed to denote that the sequence is done. Most codes
    in C program needs a semicolon to denote where the line ends.


    The commandgetchar() informs the compiler to stop once it reaches the end of the
    function and standby for an input from the keyboard before continuing. This command
    is very useful because most compilers would run the C program and then immediately
    exits the window. Thegetchar() command would prevent the compiler to close the
    window until after a keystroke .is made.


    The commandreturn 0 denotes that the function has ended. For this particular C
    program, it started as anint, which indicates that the program has to return an
    integer once it is done running. The “0” is an indication that the compiler ran
    the program correctly. If another number is returned at the end of the program,
    it means that there was an error somewhere in the program.


    Compiling the program


    To compile the program, type the code into the program’s code editor. Save this
    as a type of *.c file, then click the Run or Build button.


    Commenting on the code'
