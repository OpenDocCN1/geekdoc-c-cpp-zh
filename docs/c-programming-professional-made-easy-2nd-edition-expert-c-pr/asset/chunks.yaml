    Chapter 7 Decision Making


    The structures for decision making require you to specify at least one condition
    to be tested or evaluated by the program, along with statements that have to be
    executed if the condition is found to be true. However, statements that were found
    to be false can also be executed optionally. The general form of a decision making
    structure in most programming languages looks something like the example given
    below:


    ![](images/00001.jpeg)


    The C programming language assumes all non-null and non-zero values to be true.
    If there is either a null or zero, C assumes it to be false. The C programming
    language also makes use of the following decision making statements:


    The If Statement


    An if statement consists of a Boolean expression that is followed by at least
    one more statement.


    Syntax


    The syntax of an if statement is generally:


    If (Boolean expression)


    {


    /* the statement(s) to be executed if the Boolean expression is true


    */


    }


    If the Boolean expression is found to be true, then the code inside the if statement
    is executed. Otherwise, the first set of code at the end of the if statement is
    executed.


    As mentioned earlier, the C programming language assumes all non-null and non-zero
    values to be true while it assumes all null or zero values to be false.


    Flow Diagram


    ![](images/00002.jpeg)


    Example:


    #include <stdio.h>


    int main ( )


    {


    /* local variable definition */


    int a = 10;


    /* use the if statement to check the Boolean condition */


    if ( a < 20 )


    {


    /* if the condition is true, the following should be printed */


    printf ( “a is less than 20\n” );


    }


    printf ( “the value of a is : %d\n”, a );


    return 0;


    }


    Once the above code has been executed, it shows the following output:


    a is less than 20;


    the value of a is : 10


    The If Else Statement


    An if statement can be followed by an else state, which is optional. If the Boolean
    expression is false, then this statement is executed.


    Syntax


    The syntax of an if else statement is as follows:


    if (Boolean expression)


    {


    /* the statement(s) to be executed if the Boolean expression is true */


    }


    else


    {


    /* the statement(s) to be executed if the Boolean expression is false */


    }


    If the Boolean expression is found to be true, then the if code is executed. On
    the other hand, if the Boolean expression is found to be false, then the else
    code is executed.


    Again, the C programming language assumes all non-null and non-zero values to
    be true while it assumes all null or zero values to be false.


    Flow Diagram


    ![](images/00003.jpeg)


    Example:


    #include <stdio.h>


    int main ( )


    {


    /* local variable definition */


    int a = 100;


    /* checking of the Boolean condition */


    if ( a < 20 )


    {


    /* if the condition is true, the following should be printed */


    printf ( “a is less than 20\n” );


    }


    else


    {


    /* if the condition is false, the following should be printed */


    printf ( “a is not less than 20\n” );


    }


    printf ( “the value of a is : %d\n”, a );


    return 0;


    }


    Once the above code is executed, the following output is shown:


    a is not less than 20;


    the value of a is : 100


    The If, Else If, Else Statement


    An if statement can be followed by an else if, else statement, which is optional.
    This statement is highly useful for testing different conditions using the single
    if else statement. Then again, when using the if, else if, else statements, you
    should keep in mind the following pointers:


    1.  An if can have zero or more else if’s. They have to come before the else.


    2.  An if can have zero or one else. It has to come after the else if.


    3.  If an else if is successfully executed, the remaining else’s or else if’s
    will no longer be tested.


    Syntax


    The general syntax of an if, else if, else statement is as follows:


    if (first Boolean expression)


    {


    /* executes when the first Boolean expression is true */


    }


    else if (second Boolean expression)


    {


    /* executes when the second Boolean expression is true */


    }


    else if (third Boolean expression)


    {


    /* executes when the third Boolean expression is true */


    }


    else


    {


    /* executes when none of the above conditions is true */


    }


    Example:


