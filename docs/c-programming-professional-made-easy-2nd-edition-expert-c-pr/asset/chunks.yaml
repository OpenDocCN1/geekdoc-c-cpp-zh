    `double`数据类型用于存储具有双精度浮点数的实数。占用内存空间为8字节。使用`long`作为类型修饰符时，会占用10字节的内存存储空间。


    ## `void`


    - 描述：指定不包含任何值的空集

    - 特点：在内存中也不占用任何空间（0字节）


