- fmt: "\n任何放置在代码中的注释都不会被编译。它们允许用户详细说明函数中发生的事情。注释是很好的提醒，用于说明代码是关于什么的以及其用途。当其他开发者查看代码时，注释也能帮助他们理解。\n\
    \n要编写注释，在开头添加`/*`，并在结尾以`*/`结束。进行注释时应对除基本部分之外的所有内容加以解释；对于那些含义已十分清楚、不再需要解释的编码基础部分则无需标注。\n\
    \n此外，可以使用注释来快速移除某段代码而无需删除它：只需将想要临时忽略的部分包裹在 `/* */ 之间即可正常编译程序运行新版本的程序档测试不同组合`.若日后需恢复这些片段回归主源文件时才去掉标签重新引入原位置保持完整功能一致.\n\
    \n使用变量\n\n理解变量  \n在使用前先定义变量类型如常见的有:字符型(`char`) ,浮点型 (`float`)和整型(`int`)等声明方式见下文:\n\
    \n---\n\n**声明**\n\n所有用到”处理器处理文本模式可选标识生命周期开始后须预先承诺部署资源占用地址空间存放的内容识别的范围属性和容量大小确保运行时数据正确性与效率”——再次强调程序能够识别的内存块称之为常量存储区域而无歧义专断仍遵守语法规则之一就是：必须事先告诉编译器该符号对应的是什么样的数据结构包括值与操作属性以便后续合法调用与赋值运算不产生冲突并保证结果符合预期效果——请看下面的案例示例如下所示：\n\
    \n```\nchar name;\nfloat x; \nint f, g,i,j;\n```\n\n多个同类型的变数也可以写在同一行上条件是他们归属相同的数据类别（即都是整数或字符串）然后直接用逗号分开名字即可如下表述\
    \ :  \n\n```c\n int f,g,i ;\n``首先要记住末尾必须加上分号的记号代表此行命令结束了;\n\n-----\n\n###  置于何处率先书写？\n\
    \n一般在闭合大括号内部的起始端也就是称作区块头部作初始设定凡是在后被任意往后的部份还有要求对它做引用或者变更之前都需要从最开始就把它列好然后在花括弧里面不能中断否则会造成整个建构不完全进而影响到接下来的执行顺序也不能够适当地获取预期的全部逻辑分支响应式特点\
    \ ——所以在 C 语言范式里规矩是很明确的；\n\n##\t存贮接受到的数值输入示例可利用键盘敲入数字经过名为 scanf()的标准库方法捕获并且存入已经定义的适合型的容器内部以后显示作为反馈验证码出现的图片角色亦可用于检查是否运作无误类似下面一小节所给出的示范\
    \ :\n\n```c  \n#include <stdio.h>\n\nint main()\n{\n    int x ;\n\n\tprintf(\"\
    45:\");\n\tscanf(\"%d\",&x ); \n\tprintf(\"值是 % d\\n \",x);\n\tgetchar();\t\n\t\
    return0 ;\t\t\n}\n   \n其中\"&d“告知scanf寻找资格匹配的目标(任意的十进制非负或其他范围兼容含正负数均可接受实则将会直接按照约定形式转换)。而在前面还有一个叫做取址符(&)字元放在 名称为\
    \ X这个单元前面的意思是给那个可编程读写的局部片段带到工作环境里去 ，于是便可通过改写它的原始值来实现我们想要的行动目地最终打印指令令输出到螢光幕让终端确认刚刚记录的具体量为何\
    \ 。\t\t \n\n#### ***用算演改造***\n\n数学表达式完全可行呀！无论加乘减散都能作用于先前开辟出来的各种对应的常幅度标明动作和无额外串联补强形容词关系但是最重要的差异在这儿：“一个单独使用的等于号(=)”意思为\
    \ “人为为其设置某个特定职务权力的大小”；而成对的 ==呢？那是衡量两端彼此是不是一模一样...比方看这段就好懂啦：\n      \n\t   /*把X变成两倍的四则是8*/\n\
    \tx =2 *4；\n\t  //原来的基础上再加八又是新的意义    \n\tx +=8      (\n//对比这俩一不一样再看看15以下的判断...\n\
    )\n最后再检验如果==18？\n肯定false    小于十一也不会成立当然真伪已经在语义层面体现出来啰~ \U0001F6A9 （特别的注意还在下方概况表格）。\n\
    \n# **选择作用语句结构**\n普遍存在于全世界的C应用框架事实上主要驱动一切发展变化依据评分机制记各自得分数是真还是假立马决定下一个如何处理相应的模块相约跳转那最常见最初及核心的一个叫if(...{}）。在此情况下计算机对真假的态度特别有别样：看作确实是TRUE的一般就等于不等于零的数字例子比如做了一个比对结果是返回1就被标记成\
