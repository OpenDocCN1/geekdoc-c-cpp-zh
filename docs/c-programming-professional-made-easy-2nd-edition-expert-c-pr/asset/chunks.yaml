    First, the init is executed to enable you to initialize and declare loop control
    variables. As long as you use a semicolon, there is no need for you to place a
    statement here.


    Then, the condition is evaluated. If it is proven to be true, then the loop is
    executed. Otherwise, the flow of control moves on to the next statement.


    After the body of the for loop is executed, the flow of control moves back to
    the increment. The increment statement allows you to update your loop control
    variables. You can leave it blank if you want for as long as you use a semicolon
    after your condition.


    Finally, the condition is re-evaluated. If it is found to be true, then the loop
    executes and the entire process is repeated. When the condition becomes false,
    the for loop terminates.


