  \n ('the end') ?>\n\n\n\n\n这是一个非常有用的循环，可以确保至少运行一次。`FOR` 和 `WHILE` 循环在循环开始时检查条件，这确保了它们不会立即通过或失败。`DO…WHILE`\
  \ 循环会在循环结束后检查条件。这确保了循环在发生通过或失败之前至少运行一次。\n\n请看这个示例：\n\n```c\n#include <stdio.h>\n\
  \nint main()\n{\n  int y;\n  y = 10;\n  do {\n    printf(\"This loop is running!\\\
  n\");\n  } while ( y != 10 );\n  getchar();\n}\n```\n\n这种类型的循环无论条件结果是 TRUE 还是 FALSE\
  \ 都会显示消息。变量 `y` 被设置为 10。`WHILE` 循环被设置为当 `y` 值不等于 10 时运行，此时循环结束。消息之所以被打印，是因为在循环结束之前并不会检查条件。\n\
  \n`DO..WHILE` 循环的 `WHILE` 部分必须以分号结束。这也是循环以这种方式结束的唯一情况。\n\n# 第 5 章 存储类\n\n存储类是指 C\
  \ 程序中函数和变量的生命周期和可见性。这些限定符出现在它们所修改的类型之前。C 程序中最常用的存储类包括 `auto`、`static`、`register`\
  \ 和 `extern`。那么，这些存储类是如何使用的呢？\n\n## Auto\n\n这种存储类被认为是所有局部变量的默认存储类。考虑这个示例：\n\n```c\n\
  {\nint mount;\nauto int month;\n}\n```\n\n上面的示例具有具有相似存储类的变量。请注意，`auto` 只能在函数内部使用。\n\
  \n### Register\n\n这种存储类通常用于必须存储在寄存器而不是 RAM 中的局部变量。变量的大小应该小于或等于寄存器的大小。它不应该使用一元运算符\
  \ `&`，因为它不包含内存。看这个示例：\n\n```c\n{\nregister int kilometers;\n}\n```\n\n记住，`register`\
  \ 存储类在用于像计数器那样的变量时是有效的。此外，应该注意根据硬件的限制，它并不一定会将变量存储在寄存器中。\n\n### Static\n\n存储类命令编译器在整个程序的生命周期内保存局部变量，而不是在进入和离开范围时销毁它。此外，你可以将\
  \ `static` 修饰符用于全局变量。如果这样做，变量的作用范围可以在其声明的文件中进行调节。`static` 允许所有对象共享其成员数据的一份副本。\n\n\
  ```c\n#include <stdio.h>\n\n/* 函数声明 */\nvoid func(void);\n\nstatic int count = 5;\
  \ /* 全局变量 */\nmain()\n{\nfunc();\nreturn 0;\n}\n\n/* 函数定义 */\nvoid func( void )\n\
  {\nstatic int i = 5; /* 局部变量 */\n// ... \n}\n```\n\n上述包含 `static` 存储类的程序产生以下结果：\n\
  i is 6 and count is 4\ni is 7 and count is 3\ni is 8 and count is 2\ni is 9 and\
  \ count is 0\n\n### Extern\n\n这种存储类用于提供所有文件中可见的全局变量引用。每当你使用 `extern` 时，你不能初始化变量，因为它所做的只是指向之前定义的特定存储位置。如果你有多个文件并想在另一个文件中定义全局函数或变量，可以使用\
  \ `extern` 来提供函数或变量引用。考虑这个示例：\n\n**第一个文件：main.c**\n```c\n#include <stdio.h>\nint\
  \ count ;\nextern void write_extern();\nmain()\n{\nwrite_extern();\n}\n```\n\n**第二个文件：write.c**\n\
  ```c\n#include <stdio.h>\nextern int count;\nvoid write_extern(void)\n{\ncount =\
  \ 5;\nprintf(\"count is %d\\n\", count);\n}\n```\n\n在这个示例中，`extern` 定义在第一个文件中并用于在第二个文件中声明\
  \ `count`。如果你编译这两个文件：\n`$gcc main.c write.c`\n你可以得到结果 5。\n\n# 第 6 章 运算符\n\n运算符是执行特定逻辑或数学操作的符号。在\
  \ C 语言中有很多内置运算符，如算术、关系、逻辑、位运算、赋值等。\n\n## 算术运算符\n\n假设 `A = 10` 且 `B = 20`。\n\n| 运算符\
  \ | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `+` | 两个操作数相加。 | `A + B = 30` |\n| `-`\
  \ | 从第一个操作数减去第二个操作数。 | `A - B = -10` |\n| `*` | 操作数相乘。 | `A * B = 20` |\n| `/` |\
  \ 将子被除以分母。 | `B / A = 2` |\n| `%` | 取模运算符。给出整数除法后的余数。 | `B % A = 0` |\n| `++` |\
  \ 递增运算符。将整数加一。 | `A++ = 11` |\n| `--` | 递减运算符。将整数减一。 | `A-- = 9` |\n\n## 关系运算符\n\
  \n假设 `A = 10` 且 `B = 20`。\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `==` |\
  \ 检查两个操作数的值是否相等。 | `A == B` 为假 |\n| `!=` | 检查两个操作数的值是否相等。 | `A != B` 为真 |\n| `>`\
  \ | 检查左操作数的值是否大于右操作数的值。 | `A > B` 为假 |\n| `<` | 检查左操作数的值是否小于右操作数的值。 | `A < B` 为真\
  \ |\n| `>=` | 检查左操作数的值是否大于或等于右操作数。 | `A >= B` 为假 |\n| `<=` | 检查左操作数的值是否小于或等于右操作数。\
  \ | `A <= B` 为真 |\n\n\n\n\n\n| `!` | 称为逻辑非运算符。它用于反转操作数的逻辑状态。如果条件为真，则逻辑非运算会将其变为假。\
  \ | `!(A && B)` 的结果为真 |\n\n## 位运算符\n\n这些运算符对位进行操作并执行逐位运算。\n\n以下是针对`|`, `^`,和`&`的真值表：\n\
