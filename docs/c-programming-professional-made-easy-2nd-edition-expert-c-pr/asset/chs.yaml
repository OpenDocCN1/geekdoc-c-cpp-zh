  \n# 第 8 章 C 语言循环\n\n如果你需要多次执行某段代码，你应该按顺序执行这些语句。这意味着你必须先执行函数中的第一条语句，然后是第二条，以此此类推。\n\
  \n循环语句允许你多次执行一条语句或多条语句。以下是循环语句的一般形式：\n\n![](img/00005.jpeg)\n\n## 不同类型的循环\n\n###\
  \ While 循环\n\n如果给定的条件为真，`while` 循环会重复执行特定的语句。\n\n#### 语法\n\n`while` 循环的一般语法如下：\n\
  \n```c\nwhile (condition) \n{\n    statement(s);\n}\n```\n\n你可以在 `while` 循环中使用单个语句或语句块。此外，你也可以提供任何表达式的条件，但非零值被视为真。只要条件为真，循环就会继续迭代。一旦条件变为假，程序控制将传递到紧随循环之后的行。\n\
  \n#### 流程图\n\n![](img/00006.jpeg)\n\n如果 `while` 循环的条件经过测试发现为假，则执行 `while` 循环后的第一条语句，而跳过循环体。\n\
  \n#### 示例：\n\n```c\n#include <stdio.h>\n\nint main ( )\n{\n    /* 局部变量 */\n    int\
  \ x = 10;\n    /* while 循环执行 */\n    while ( x < 20)\n    {\n        printf (\"\
  The value of x: %d\\n\", x);\n        x++;\n    }\n    return 0;\n}\n```\n\n执行上述代码后，显示以下输出：\n\
  The value of x: 10\nThe value of x: 11\nThe value of x: 12\nThe value of x: 13\n\
  The value of x: 14\nThe value of x: 15\nThe value of x: 16\nThe value of x: 17\n\
  The value of x: 18\nThe value of x: 19\n\n### For 循环\n\n`for` 循环用于重复特定次数的某段代码块。\n\
  \n#### 语法\n\n这是 `for` 循环的一般语法：\n\n```c\nfor ( init; condition; increment )\n{\n\
  \    statement(s);\n}\n```\n\n#### 流程图\n\n![](img/00007.jpeg)\n\n#### For 循环中的控制流\n\
  \n首先，执行 `init` 以允许你初始化和声明循环变量。只要你使用分号，就不需要在此处放置语句。\n\n然后，评估 `condition`。如果它证明为真，则执行循环。否则，控制流移动到下一条语句。\n\
  \n在执行完 `for` 循环体后，控制流将返回 `increment`。`increment` 语句允许你更新循环控制变量。如果你愿意，只要在条件后使用分号，就可以将其留空。\n\
  \n最后，重新评估 `condition`。如果发现它为真，则执行循环并重复整个过程。当条件变为假时，`for` 循环终止。\n\n#### 示例：\n\n```c\n\
  #include <stdio.h>\n\nint main ( )\n{\n    /* for 循环执行 */\n    for ( int x = 10;\
  \ x < 20; x = x + 1)\n    {\n        printf (\"The value of x: %d\\n\", x);\n  \
  \  }\n    return 0;\n}\n```\n\n执行上述代码后，显示以下输出：\nThe value of x: 10\nThe value of\
  \ x: 11\nThe value of x: 12\nThe value of x: 13\nThe value of x: 14\nThe value of\
  \ x: 15\nThe value of x: 16\nThe value of x: 17\nThe value of x: 18\nThe value of\
  \ x: 19\n\n#### For 循环的不同用法\n\n如果你想多次执行某项操作，可以使用控制语句。你可以使用以下方式编写 `for` 循环：\n\n1.\
  \ **循环内单条语句**\n示例：\n```c\nfor (i = 0; i < 5; i++)\nprintf (\"Programming\");\n```\n\
  \n2. **循环内多条语句**\n示例：\n```c\nfor (i = 0; i < 5; i++)\n{\n    printf (\"First Statement\"\
  );\n    printf (\"Second Statement\");\n    printf (\"Third Statement\");\n}\n```\n\
  \n3. **循环内无语句**\n示例：\n```c\nfor (i = 0; i < 5; i++)\n{\n}\n```\n\n4. **For 循环结尾有分号**\n\
  示例：\n```c\nfor (i = 0; i < 5; i++);\n```\n\n5. **循环内多条初始化语句**\n示例：\n```c\nfor (i\
  \ = 0; j = 0; i < 5; i++)\n{\n    statement 1;\n    statement 2;\n    statement\
  \ 3;\n}\n```\n\n6. **缺少增/减语句**\n示例：\n```c\nfor (i = 0; i < 5; )\n{\n    statement\
  \ 1;\n    statement 2;\n    statement 3;\n    i++;\n}\n```\n\n7. **For 循环缺少初始化**\n\
  示例：\n```c\ni = 0;\nfor ( ; i < 5; i++ )\n{\n    statement 1;\n    statement 2;\n\
  \    statement 3;\n}\n```\n\n8. **死循环 For 循环**\n示例：\n```c\ni = 0;\nfor ( ; )\n{\n\
  \    statement 1;\n    statement 2;\n    statement 3;\n    if (breaking condition)\n\
  \    break;\n    i++;\n}\n```\n\n### Do While 循环\n\n`do while` 循环就像 `while` 循环。循环条件在循环结束后测试，循环至少执行一次。但与\
  \ `while` 循环不同，大多数程序员很少使用 `do while` 循环。\n\n#### 语法\n\n`do while` 循环的一般语法如下：\n\n\
  ```c\ndo\n{\n    statement(s);\n}\nwhile (condition);\n```\n\n从上述示例可以看出，条件表达式位于循环结束。因此，在测试条件之前会执行一次\
  \ `statement(s)`。如果发现条件为真，控制流回到 `do` 并再次执行一次 `statement(s)`。该过程不断重复，直到发现条件为假。\n\n\
  #### 流程图\n\n![](img/00008.jpeg)\n\n#### 示例：\n\n```c\n#include <stdio.h>\n\nint main\
  \ ( )\n{\n    /* 局部变量定义 */\n    int x = 10;\n    /* do 循环执行 */\n    do\n    {\n\
  \        printf (\"The value of x: %d\\n\", x);\n        x++;\n    }\n    while\
  \ (x < 20);\n    return 0;\n}\n```\n\n执行上述代码后，显示输出：\nThe value of x: 10\nThe value\
  \ of x: 11\nThe value of x: 12\nThe value of x: 13\nThe value of x: 14\nThe value\
  \ of x: 15\nThe value of x: 16\nThe value of x: 17\nThe value of x: 18\nThe value\
  \ of x: 19\n\n### 嵌套循环\n\nC 语言允许在一个循环内部另一个循环。这就是嵌套循环的意义。\n\n#### 语法\n\n嵌套循环的一般语法：\n\
  \n```c\nfor ( init; condition; increment )\n{\n    for ( init; condition; increment\
  \ )\n    {\n        statement(s);\n    }\n}\n```\n\n这是嵌套 `do while` 循环的一般语法：\n\n\
  ```c\ndo\n{\n    statement(s);\n    do\n    {\n        statement(s);\n    }\n  \
  \  while (condition);\n}\nwhile (condition);\n```\n\n注意，在循环嵌套时，你可以将任何类型的循环放在任何其他类型的内部。例如，你可以将\
  \ `while` 循环放在 `for` 循环中，反之亦然。\n\n#### 示例：\n\n```c\n#include <stdio.h>\n\nint main\
  \ ( )\n{\n    /* 局部变量定义 */\n    int a, b;\n    for (a = 2; a < 100; a++)\n    {\n\
  \        for (b = 2; b <= (a/b); b++)\n            if (! (a % b)) break; // 如果找到了因子，则它不是质数\n\
  \        if (b > (a/b)) printf(\"%d is a prime number\\n\", a);\n    }\n    return\
  \ 0;\n}\n```\n\n执行上述代码后，显示输出：\n2 is a prime number\n3 is a number\n5 is a prime\
  \ number\n7 is a prime number\n11 is a prime number\n13 is a prime number\n17 is\
  \ a prime number\n19 is a prime number\n23 is a prime number\n29 is a prime number\n\
  31 is a prime number\n37 is a prime number\n41 is a prime number\n43 is a prime\
  \ number\n47 is a prime number\n53 is a prime number\n59 is a prime number\n61 is\
  \ a prime number\n67 is a prime number\n71 is a prime number\n73 is a prime number\n\
  79 is a prime number\n83 is a prime number\n89 is a prime number\n97 is a prime\
  \ number\n\n### Break 语句\n\n`break` 语句包含两个主要功能：\n\n1. 如果在循环中发现 `break` 语句，则循环立即终止，程序控制将到循环后的下一条语句。\n\
  2. `break` 语句可以用于 `switch` 语句中的分支终止。\n\n如果你正在运行嵌套循环，`break` 语句会停止最内层循环的运行，并开始执行其后的代码。\n\
  \n#### 语法\n\n这是 `break` 语句的一般语法：\n\n```c\nbreak;\n```\n\n#### 流程图\n\n![](img/00009.jpeg)\n\
  \n示例：\n\n\n\n\n\n```c\n#include <stdio.h>\n\nint main ( )\n{\n   /* 局部变量定义 */\n\
  \   int y = 10;\n\n   /* while 循环执行 */\n   while (y < 20)\n     {\n        printf\
  \ (\"y 的值：%d\\n\", y);\n        y++;\n        \n        if (y > 15)\n          {\n\
