  \ `Visual Basic` 和 `Java`，那将是一个加分项。如果你熟悉或已经使用过 `Eclipse` 的 IDE（集成开发环境），那绝对将是一个巨大的优势。此外，熟悉\
  \ `XML`也会对你有所帮助。\n\n在开始开发应用之前，你需要几样东西。\n\n### 第一：一台高端电脑\n首先，你需要一台高端电脑。通常情况下，其他的编程开发套件不需要性能强大的电脑即可创建应用程序。然而，为\
  \ Android 编写程序略有不同。你需要更多的计算能力来运行 `Android emulators`（Android 模拟器），这些程序允许你在电脑上测试程序。\n\
  \n使用没有良好处理器和足够 `RAM` 的低性能电脑只会让你运行这些模拟器变得困难。即使你能够运行它，运行速度也会非常缓慢。\n\n### 第二：一台 Android\
  \ 设备\n其次，你需要一台 Android 设备。该设备将成为你的测试 测试。通过它，你将知道你的程序在 Android 设备上的表现。在选择测试设备时，请确保它与你应用目标市场的设备水平相当。如果你针对的是平板电脑用户，请使用平板电脑；如果你针对的是智能手机用户，请使用智能手机。\n\
  \n### 第三：Android SDK\n第三，你需要来自 `Google` 的 `Android SDK`（软件开发包）。`SDK` 是一组文件和程序，允许你创建并编译程序代码。于本文写作时，最新的\
  \ `Android SDK` 文件大小约为 350mb。下载它需要 15 到 30 分钟。如果你解压 `Android SDK` 文件，它将占用电脑大约 450mb\
  \ 的磁盘空间。下载页面链接为：http://developer.android.com/sdk/index.html\n\n`SDK` 可以运行在 `Windows\
  \ XP`、`Windows 7`、`Mac OSX 10.8.5`（或更高版本）以及运行 32 位应用程序并带有 `glibc`（GNU C library）2.11\
  \ 或更高版本的 Linux 发行版上。\n\n一旦解压了下载的内容，打开 `SDK Manager`。该程序是开发套件的更新工具。为了确保你拥有套件组件的最新版本，请定期运行管理器并下载这些更新。此外，你还可以使用\
  \ `SDK Manager` 下载旧版本的 `SDK`。如果你想为运行旧版 Android 系统的设备编写程序，必须这样做。\n\n[点击此处在 Amazon\
