  \n***\n\n![PIC](img/image_rsrc74W.jpg)\n\n| 图 6.12: | 单个聚光源 |\n\n***\n\n### 6.4\
  \ 渲染纹理\n\n纹理映射是将纹理图像应用于 3D 模型的过程，以增强其视觉外观和真实感。这些纹理包含了颜色（反照率）、粗糙度、金属属性、法线等信息，允许进行高层次的表面表示和精确的材质渲染。\n\
  \n以下是 OpenGL 中通常使用纹理的概述：\n\n- **创建纹理**：要使用纹理，首先需要生成并配置它。这涉及将图像加载到内存中，然后使用 `glGenTextures()`\
  \ 和 `glBindTexture()` 等函数在 OpenGL 中创建纹理对象。\n- **将数据加载到纹理**：一旦创建了纹理对象，就可以将图像数据加载其中。可以使用\
  \ `glTexImage2D()` 或 `glTexSubImage2D()` 等函数。\n- **设置纹理参数**：你可以为纹理的行为设置各种参数，例如其包裹方式（`GL_REPEAT`、`GL_CLAMP_TO_EDGE`\
  \ 等）、过滤方法（`GL_LINEAR`、`GL_NEAREST`）、多级映射（mip-mapping）等，可以使用 `glTexParameteri()`\
  \ 函数实现。\n- **在着色器中使用纹理**：为了在渲染过程中实际使用纹理，你需要通过 uniform 变量将其传递给着色器。在着色器代码中，你会使用 `texture2D()`\
  \ 函数（在旧版本的 GLSL 中，如 OpenGL ES 2.0 或早期版本）或较新版本中的 `texture()` 函数采样纹理。\n\nOpenGL 中的纹理单元对于管理渲染管线中的多个纹理至关重要。这些单元允许你同时绑定多个纹理并在渲染期间在着色器中使用。每个\
  \ GPU 可用的纹理单元数量有限（不同设备之间不同）。通常，现代硬件至少支持 16 个纹理单元，更高级的 GPU 可能支持更多。\n\n以下是纹理单元通常用法的概述：\n\
  \n- **激活纹理单元**：要操作纹理单元，需要使用 `glActiveTexture()` 将其激活。该函数接受一个参数指定要激活哪个纹理单元（`GL_TEXTURE0`、`GL_TEXTURE1`\
  \ 等）。\n- **将纹理绑定到单元**：激活纹理单元后，可以使用 `glBindTexture()` 将纹理绑定到它。这将当前绑定的纹理与激活的纹理单元关联。每个纹理单元都可以绑定它自己的纹理。\n\
  - **在着色器中使用纹理单元**：在着色器代码中，你会使用一个变量（如列表 6.31 所示）来指定从哪个纹理单元采样。例如，如果你使用 `GL_TEXTURE0`，则着色器中有一个与该单元关联的变量。以下是片段着色器中纹理采样的简单示例：\n\
  \n| 列表 6.31: | 纹理采样示例 |\n\n```glsl\n#version 330 core\n\nin vec2 TexCoord;  // 从顶点着色器传递的纹理坐标\n\
  uniform sampler2D textureUnit;  // 纹理单元\n\nout vec4 FragColor;  // 输出颜色\n\nvoid\
  \ main()\n{\n    FragColor = texture(textureUnit, TexCoord);\n}\n```\n\n#### 6.4.1\
  \ 材质纹理\n\nPBR 依赖纹理来准确表示属性。以下是一些常见类型：\n\n***\n\n![PIC](img/image_rsrc74X.jpg)\n\n\
  | 图 6.13: | PBR 纹理](#part0026.xhtml_a6NT) |\n\n***\n\n- **反照率纹理 (Albedo Texture)**：此纹理表示没有任何光照的表面基础颜色。\n\
  - **粗糙度纹理 (Roughness Texture)**：粗糙度决定了光在表面上的散射情况。黑色表示完全光滑，白色表示非常粗糙。\n- **金属纹理 (Metallic\
  \ Texture)**：此纹理定义了表面哪些部分是金属，哪些部分是电质（非金属）。\n- **法线贴 (Normal Map Texture)**：法线贴改变表面法线，产生深度幻觉。\n\
  - **环境光挡纹理 (Ambient Occlusion Texture)**：环境光挡（AO）映射定义了光被遮挡或阻塞的区域，通常发生在角落、缝隙或物体交汇处。\n\
  - **高度/偏移图 (Height/Displacement Map)**：这些映射可以位移几何形状。\n- **发射材质 (Emissive Texture)**：用于模拟发光材质，如屏幕、发光二极管（LED）或发光表面。\n\
  \nPBR 纹理通常用于 Unreal Engine 或 Unity 等游戏引擎来创建高度真实的材质。当应用于渲染引擎或着色器时，这些纹理影响光与表面的相互作用，从而影响对象的最终外观。\n\
  \n#### 6.4.2 纹理映射\n\n我们将纹理集成到渲染管线。首先，我们将在项目中建立纹理类型或类，并从 PNG 或 JPG 等图像文件中加载像素数据。将这些数据集成到我们的材质类中，将能够在渲染模型时无缝应用这些纹理。\n\
  \n如下所示将 `Textures` 目录添加到项目中（见图 6.14）。\n\n***\n\n![Picture](img/image_rsrc74Y.jpg)\n\
  \n| 图 6.14: | Text 目录 |\n\n***\n\n##### 纹理加载器\n\nSTB-Image 是一种流行的用于加载各种图像格式的 C 单头库。它为\
  \ C 或 C++ 项目添加图像加载功能提供了简单且轻级的解决方案，而无需依赖 FreeImage 或 DevIL 等较大的库。\n\n我们可以如下所示使用 Conan\
  \ 将其添加到项目中（见列表 6.32）：\n\n| 列表 6.32: | Root/conanfile.txt |\n\n```ini\n[requires]\n\
  glm/cci.20230113\nstb/cci.20230920\nopengl/system\nspdlog/1.12.0\nassimp/5.2.2\n\
  entt/3.12.2\nglfw/3.3.8\nglew/2.2.0\n\n[generators]\ncmake\n\n[options]\nassimp:shared=False\n\
  glew:shared=False\nglfw:shared=False\n```\n\n如果你想对其函数和类型进行语法高亮，请在 `c_cpp_properties.json`\
  \ 文件中添加 STB-Image 的包含路径。这不是必须的！\n\n##### Texture2D 类\n\n\n\n\n(列表 6.33) 中的代码段定义了一个\
  \ `Texture2D` 结构体，表示一个 OpenGL 二维 纹理。该结构封装了管理纹理的功能。构造函数初始化默认参数，而重载构造函数则便于从 `filename`\
  \ 参数指定的图像文件中加载纹理。\n\n### 列表 6.33: Graphics/Textures/Texture.h\n\n```cpp\n#pragma\
  \ once\n\n#include \"Common/Core.h\"\n#include <stb_image.h>\n\nnamespace Empy\n\
  {\n    struct Texture2D\n    {\n        EMPY_INLINE Texture2D() = default;\n\n \
  \       EMPY_INLINE Texture2D(const std::string& filename)\n        {\n        \
  \    Load(filename);\n        }\n\n        EMPY_INLINE ~Texture2D()\n        {\n\
  \            glDeleteTextures(1, &m_ID);\n        }\n\n        EMPY_INLINE bool\
  \ Load(const std::string& filename)\n        {\n            // 翻转 轴（常见操作）\n    \
  \        stbi_set_flip_vertically_on_load(true);\n\n            // 加载纹理数据\n    \
  \        uint8_t* pixels = stbi_load(filename.c_str(), &m_Width, &m_Height, nullptr,\
  \ 4);\n\n            // 检查像素\n            if(pixels == nullptr)\n            {\n\
  \                EMPY_ERROR(\"failed to load texture!\");\n                return\
  \ false;\n            }\n\n            // 创建纹理\n            glGenTextures(1, &m_ID);\n\
  \            glBindTexture(GL_TEXTURE_2D, m_ID);\n\n            // 将纹理加载到 gpu\n\
  \            glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA, m_Width, m_Height, 0, GL_RGBA,\
  \ GL_UNSIGNED_BYTE, pixels);\n\n            // 释放分配内存\n            stbi_image_free(pixels);\n\
  \n            glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);\n\
  \            glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);\n\
  \            glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);\n\
  \            glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);\n\
  \            glGenerateMipmap(GL_TEXTURE_2D);\n\n            glBindTexture(GL_TEXTURE_2D,\
  \ 0);\n            return true;\n        }\n\n        EMPY_INLINE void Use(uint32_t\
  \ uniform, int32_t unit)\n        {\n            glActiveTexture(GL_TEXTURE0 + unit);\n\
  \            glBindTexture(GL_TEXTURE_2D, m_ID);\n            glUniform1i(uniform,\
  \ unit);\n        }\n\n        EMPY_INLINE operator uint32_t() const { return m_ID;\
  \ }\n\n        EMPY_INLINE int32_t Height() const { return m_Height; }\n\n     \
  \   EMPY_INLINE int32_t Width() const { return m_Width; }\n\n        EMPY_INLINE\
  \ uint32_t ID() const { return m_ID; }\n\n        EMPY_INLINE void Bind() { glBindTexture(GL_TEXTURE_2D,\
  \ m_ID); }\n        EMPY_INLINE void Unbind() { glBindTexture(GL_TEXTURE_2D, 0);\
  \ }\n\n    private:\n        int32_t m_Height = 0;\n        int32_t m_Width = 0;\n\
  \        uint32_t m_ID = 0u;\n    };\n}\n\n// 共享指针类型定义\nusing Texture = std::shared_ptr<Texture2D>;\n\
  ```\n\n`Load()` 函数处理加载过程。它利用之前添加的 `stb_image` 库从提供的文件路径加载图像数据。该函数设置了沿 y 轴翻转图像的选项（这在许多图像格式中很常见）。在成功加载图像数据后，它使用\
  \ `glGenTextures()` 在 OpenGL 中生成一个纹理对象（`m_ID`），并使用 `glBindTexture()` 将其绑定。随后使用 `glTexImage2D()`\
  \ 将图像数据加载到 GPU 内存中，指定纹理格式为 `GL_RGBA`。然后，它通过 `glTexParameteri()` 调用为纹理设置了各种参数，例如过滤和包装模式。\n\
  \n此外，它使用 `glGenerateMipmap()` 为纹理生成多级采样（mipmaps），以提高不同距离下的渲染质量。Mipmaps 是预先生成的低分辨率纹理版本。它们用于优化渲染性能并提高视觉质量，特别是当纹理以不同的距离或比例查看时。例如，如果原始纹理为\
  \ 360x360 像素，下一级 mipmap 将是 160x160，然后是 80x80，依此类推，直到 1x1 像素纹理。参见（图 6.15）。\n\n![PIC](img/image_rsrc74Z.jpg)\n\
  图 6.15：纹理多级采样级别\n\nmipmaps 的优势在于它们在渲染期间的使用。当纹理对象在屏幕上显示的尺寸比原始尺寸小时，GPU 可以切换到较低分辨率的\
  \ mipmap 级别。这一过程减少了锯齿等视觉伪影，并通过对较小纹理进行采样来提高性能，因为所需的计算更少。此外，mipmaps 有助于减少纹理锯齿（即“摩尔纹”），这种现象可能发生在纹理以倾斜角度显示或纹理缩放时。\n\
