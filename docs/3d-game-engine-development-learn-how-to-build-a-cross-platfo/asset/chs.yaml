  \ {}\n        int32_t Key = -1;\n    };\n    struct KeyRepeatEvent\n    {\n    \
  \    KeyRepeatEvent(int32_t key) : Key(key) {}\n        int32_t Key = -1;\n    };\n\
  \n    // Mouse Events\n    struct MouseReleaseEvent\n    {\n        MouseReleaseEvent(int32_t\
  \ b) : Button(b) {}\n        int32_t Button = -1;\n    };\n    struct MouseDownEvent\n\
  \    {\n        MouseDownEvent(int32_t b) : Button(b) {}\n        int32_t Button\
  \ = -1;\n    };\n    struct MouseDragEvent\n    {\n        MouseDragEvent(double\
  \ dx, double dy) : DeltaX(dx), DeltaY(dy) {}\n    };\n}\n```\n\n\n\n\n\n```cpp\n\
  double DeltaX = 0, DeltaY = 0;\n};\n\nstruct MouseMotionEvent\n{\n    MouseMotionEvent(double\
  \ x, double y): TaregtX(x), TargetY(y) {}\n    double TaregtX = 0, TargetY = 0;\n\
  };\n\nstruct MouseWheelEvent\n{\n    MouseWheelEvent(double sx, double sy): ScrollX(sx),\
  \ ScrollY(sy) {}\n    double ScrollX = 0, ScrollY = 0;\n};\n}```\n\n### 3.2.4 窗口抽象\n\
  \n为了利用我们自定义事件分发器处理所有窗口事件的能力，我们必须构建一个窗口抽象。这涉及到开发一个仿照 GLFW 的自定义窗口类型。\n\n这个特殊的窗口应该熟练地捕获其事件并使用事件分发器高效地广播它们。打开\
  \ `Window.h` 头文件，并如（（代码列表 3.17）所示添加窗口类。\n\n#### 代码列表 3.17: Window/Window.h\n\n```cpp\n\
  #pragma once\n\n#include \"Events.h\"\n\nnamespace Empy\n{\n    struct AppWindow\n\
  \    {\n        EMPY_INLINE AppWindow(EventDispatcher* dispatcher, int32_t width,\
  \ int32_t height, const char* title)\n        {\n            // coming next\n  \
  \      }\n\n        EMPY_INLINE ~AppWindow()\n        {\n            glfwDestroyWindow(m_Handle);\n\
  \            glfwTerminate();\n        }\n\n        EMPY_INLINE GLFWwindow* Handle()\n\
  \        {\n            return m_Handle;\n        }\n\n        EMPY_INLINE bool\
  \ PollEvents()\n        {\n            glfwPollEvents();\n            m_Dispatcher->PollEvents();\n\
  \            glfwSwapBuffers(m_Handle);\n            return (!glfwWindowShouldClose(m_Handle));\n\
  \        }\n\n        EMPY_INLINE bool IsKey(int32_t key)\n        {\n         \
  \   if(key >= 0 && key <= GLFW_KEY_LAST)\n                return m_Inputs.Keys.test(key);\n\
  \            return false;\n        }\n\n        EMPY_INLINE bool IsMouse(int32_t\
  \ button)\n        {\n            if(button >= 0 && button <= GLFW_MOUSE_BUTTON_LAST)\n\
  \                return m_Inputs.Mouse.test(button);\n            return false;\n\
  \        }\n\n    private:\n        EventDispatcher* m_Dispatcher;\n        WindowInputs\
  \ m_Inputs;\n        GLFWwindow* m_Handle;\n    };\n```\n\n上面的代码定义了 `AppWindow`\
  \ 结构。`PollEvents()` 方法交换窗口缓冲区、轮询任何事件并返回一个基于 `glfwWindowShouldClose()` 的布尔值，指示窗口是否应该保持打开。我们还了一些成员函数来测试按键或鼠标按钮的状态。我们尚未实现当它们被按下时设置其值的逻辑。\n\
  \n缓冲区交换：在 GLFW 中，缓冲区交换是将后缓冲区显示在屏幕上的过程。在双缓冲渲染（现代图形编程中很常见）中，有两个缓冲区：前缓冲区（用户看到的内容）和后缓冲区（渲染发生的地方）。当渲染完成后，需要交换后缓冲区和前缓冲区，以避免显示不完整或部分渲染的图像。GLFW\
  \ 的 `glfwSwapBuffers()` 函数执行此交换，使后缓冲区更新内容在屏幕上可见。\n\n##### GLFW 回调\n\n为了与 GLFW 交互，我们需要创建\
  \ GLFW 在触发事件时可以调用的自定义回调。由于 GLFW 是 C 语言编写的，且不支持类成员函数作为回调，我们需要在 `AppWindow` 中实现静态成员函数。这些静态函数必须符合\
  \ GLFW API 规定的特定参数列表，才能作为有效的回调。\n\n在 `AppWindow` 中实现静态函数面临的一个挑战是无法访问非静态成员变量。然而，GLFW\
  \ 提供了一个解决方案，允许我们向任何窗口附加自定义用户数据。这些用户数据可以在回调函数中访问，每个事件都包含了关联的窗口。随后的静态实现（代码列表 18）接受一个\
  \ GLFW 窗口作为参数并检索其用户指针，随后将其强制转换为 `AppWindow` 对象。如何建立此用户指针将在实现构造函数时很快解决。值得注意的是，我们选择使用\
  \ `AppWindow` 类型本身作为 GLFW 的用户数据。将该函数作为私有函数添加到 `AppWindow` 类中。\n\n#### 代码列表 18: Window.h\n\
  \n```cpp\nEMPY_INLINE static AppWindow* GetUserData(GLFWwindow* window)\n{\n   \
  \ return static_cast<AppWindow*>(glfwWindowUserPointer(window));\n}\n```\n\n既然已经能够获取窗口用户数据，我们现在准备好实现回调函数了。按键回调：每当按键按下、释放或重复时，GLFW\
  \ 调用此函数。下面的代码段（代码列表 19）定义了 `OnKey()` 静态函数，主要处理由 GLFW 触发的事件。\n\n#### 代码列表 19: Window.h\n\
  \n```cpp\nEMPY_INLINE static void OnKey(GLFWwindow* window, int32_t key, int32_t\
  \ action, int32_t)\n{\n    Window* self = GetUserData(window);\n\n    if(key >=\
  \ 0 && key <= GLFW_KEY_LAST)\n    {\n        switch(action)\n        {\n       \
  \     case GLFW_RELEASE:\n                self->m_Dispatcher->PostEvent<KeyReleaseEvent>(key);\n\
  \                self->m_Inputs.Keys.reset(key);\n                break;\n\n   \
  \         case GLFW_PRESS:\n                self->m_Dispatcher->PostEvent<KeyPressEvent>(key);\n\
  \                self->m_Inputs.Keys.set(key);\n                break;\n\n     \
  \       case GLFW_REPEAT:\n                self->m_Dispatcher->PostEvent<KeyRepeatEvent>(key);\n\
  \                self->m_Inputs.Keys.set(key);\n                break;\n       \
  \ }\n        return;\n    }\n    EMPY_ERROR(\"invalid key code detected: [{}]\"\
  , key);\n}\n```\n\n在窗口接收到按键事件时，该函数通过 `UserData(window)` 获取关联的用户数据。然后处理该事件。如果键在有效范围内（0\
  \ 到 `GLFW_KEY_LAST`），它会区分 `GLFW_RELEASE`、`GLFW_PRESS` 和 `GLFW_REPEAT`。对于每个操作，它利用分发器发布相应的\
  \ `KeyReleaseEvent`、`KeyPressEvent` 或 `KeyRepeatEvent`。其他事件类型也可以如代码列表 20 所示进行回调。\n\
  \n#### 代码列表 20: Window.h\n\n```cpp\nEMPY_INLINE static void OnMouse(GLFWwindow*\
  \ window, int32_t button, int32_t action, int32_t)\n{\n    Window* self = GetUserData(window);\n\
  \n    if(button >= 0 && button <= GLFW_MOUSE_BUTTON_LAST)\n    {\n        switch(action)\n\
  \        {\n            case GLFW_PRESS:\n                self->m_Dispatcher->PostEvent<MouseDownEvent>(button);\n\
  \                self->m_Inputs.Mouse.set(button);\n                break;\n\n \
  \           case GLFW_RELEASE:\n                self->m_Dispatcher->PostEvent<MouseReleaseEvent>(button);\n\
  \                self->m_Inputs.Mouse.reset(button);\n                break;\n \
  \       }\n        return;\n    }\n    EMPY_WARN(\"Invalid key code detected: [{}]\"\
  , button);\n}\n```\n\n\n\n\n\n```cpp\nWindow* self = GetUserData(window);\n\nself->m_Dispatcher->PostEvent<MouseMotionEvent>(x,\
  \ y);\n\nif (self->m_Inputs.Mouse.test(GLFW_MOUSE_BUTTON_LEFT))\n{\n    self->m_Dispatcher->PostEvent<MouseDragEvent>(\n\
  \        (self->m_Inputs.MouseX - x),\n        (self->m_Inputs.MouseY - y)\n   \
  \ );\n}\n\nself->m_Inputs.MouseX = x;\nself->m_Inputs.MouseY = y;\n}\n```\n\nEMPY_INLINE\
  \ static void OnWheel(GLFWwindow* window, double x, double y)\n{\n    GetUserData(window)->m_Dispatcher->PostEvent<MouseWheelEvent>(x,\
  \ y);\n}\n\nEMPY_INLINE static void OnMaximize(GLFWwindow* window, int32_t action)\n\
  {\n    if (action)\n    {\n        GetUserData(window)->m_Dispatcher->PostEvent<WindowMaximizeEvent>();\n\
  \    }\n    else\n    {\n        GetUserData(window)->m_Dispatcher->PostEvent<WindowRestoreEvent>();\n\
  \    }\n}\n\nEMPY_INLINE static void OnIconify(GLFWwindow* window, int32_t action)\n\
  {\n    if (action)\n    {\n        GetUserData(window)->m_Dispatcher->PostEvent<WindowIconifyEvent>();\n\
  \    }\n    else\n    {\n        GetUserData(window)->m_Dispatcher->PostEvent<WindowRestoreEvent>();\n\
  \    }\n}\n\nEMPY_INLINE static void OnError(int32_t code, const char* msg)\n{\n\
  \    EMPY_ERROR(\"[GLFW]: [{}] {}\", code, msg);\n}\n\nEMPY_INLINE static void OnClose(GLFWwindow*\
  \ window)\n{\n    GetUserData(window)->m_Dispatcher->PostEvent<WindowCloseEvent>();\n\
  }\n```\n\n/* ... 与前相同 ... */\n\n### 窗口构造函数\n\n创建一个 GLFW 窗口非常简单。你可以在（列表 3.21）提供的代码片段中看到如何实现。\n\
  \n| 列表 3.21: | Window/Window.h |\n\n```cpp\n/* ... 与前相同 ... */\n\nEMPY_INLINE AppWindow(EventDispatcher*\
