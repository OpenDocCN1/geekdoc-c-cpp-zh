  \n![[图片]](image_rsrc76R.jpg)\n\n# 11 序列化\n\n你睡睡，你睡睡，打手休息，贫困就像贼一样临到你，匮乏就像武装的兵一样到来。（所罗门王）\n\
  \n序列化在游戏引擎中对于游戏数据的存储、传输和重建起着至关重要的作用。它涉及将复杂的数据结构（如游戏对象、场景或状态）转换为易于保存到文件或通过网络传输格式。游戏引擎中序列化的主要目的包括：\n\
  \n- **持久化**：序列化允许游戏开发者将游戏的当前状态或特定的游戏元素（如角色、关卡或物品）保存到文件中。这对于实现保存和加载游戏等功能至关重要，允许玩家以后恢复进度。\n\
  - **数据传输**：游戏经常需要在不同系统之间发送数据，例如通过客户端-服务器通信或多人网络。序列化确保数据可以高效地转换为适用于网络传输的格式，并在接收端重建。\n\
  - **互操作性**：游戏引擎可能需要与外部工具或服务交互，例如关卡编辑器或分析平台。序列化实现了游戏引擎与这些外部组件之间无缝交换，促进了互操作性。\n- **资产管理**：序列化数据通常用于存储和管理游戏资产，包括\
  \ 3D 模型、纹理和音频文件。序列化允许这些资产以标准格式存储，使其在游戏开发流水线中更容易组织、版本化和分发。\n\n## 11.1 集成 YAML\n\n\
  YAML（YAML Ain’t Markup Language）是一种对人类友的数据序列化语言。YAML 原代表“Yet Another Markup Language”（另一种标记语言），但从\
  \ 2002 年开始，它被递归定义为“YAML Ain’t Markup Language”。因此，YAML 被定义为一种不是标记语言的编码语言。XML 和 HTML\
  \ 等标记语言主要用于以人类可读的格式存储数据。YAML 与 XML 的不同在于它使用简单的方法。YAML 的主要理由是它的简单性，这包含了由于 XML 广泛的应用范围而产生的限制。然而，YAML\
  \ 的主要对手是 JSON，而不是 XML。\n\n## 11.2 YAML-CPP\n\n`yaml-cpp` 是用于解析和生成 YAML 文件的 C++ 库。`yaml-cpp`\
  \ 为 C++ 提供了处理 YAML 文件的方便方法。\n\n### 11.2.1 yaml-cpp 语法\n\n这里是简要介绍和一个简单的代码段：\n\n列表\
  \ 11.1：yaml-cpp 示例代码\n\n```cpp\n// 创建 YAML 文档\nYAML::Emitter emitter;\nemitter <<\
  \ YAML::BeginMap;\nemitter << YAML::Key << \"name\" << YAML::Value << \"John Doe\"\
  ;\nemitter << YAML::Key << \"age\" << YAML::Value << 25;\nemitter << YAML::EndMap;\n\
  \n// 输出 YAML 文档\nstd::cout << \"YAML:\\n\" << emitter.c_str() << \"\\n\";\n\n//\
  \ 解析 YAML 文档\nYAML::Node config = YAML::Load(\"{name: Alice, age: 30}\");\n\n//\
  \ 从解析的文档访问值\nstd::string name = config[\"name\"].as<std::string>();\nint age = config[\"\
  age\"].as<int>();\n\n// 显示解析后的值\nstd::cout << \"Name: \" << name << \"\\n\";\nstd::cout\
  \ << \"Age: \" << age << \"\\n\";\n```\n\n在这个示例中，代码使用 `Emitter` 创建了一个表示简单键值结构的 YAML\
  \ 文档，将 YAML 文档作为字符串输出，然后使用 `Load()` 解析 YAML 文档。它访问了特定的值。\n\n### 11.2.2 YAML 布局\n\
  \nYAML 使用缩进来表示数据的层次和结构。它是一种人类可读的格式，通常用于配置文件和系统之间的数据交换。\n\n列表 11.2：示例文件\n\n```yaml\n\
  # 示例 YAML 文件\nperson:\n  name: John Doe\n  age: 30\n  address:\n    city: Anytown\n\
  \    country: USA\n  hobbies:\n    - Reading\n    - Hiking\n    - Coding\n```\n\n\
  ### 11.2.3 库设置\n\n你可以使用 Conan 将 `yaml-cpp` 链接到你的项目，如下所示：\n\n列表 11.3：Root/conanfile.txt\n\
  \n```ini\n[requires]\nglm/20230113\nstb/20230920\nmagic_enum/0.9.5\nyaml-cpp/0.8.0\n\
  opengl/system\nspdlog/1.12.0\nassimp/5.2.2\nentt/3.12.2\nphysx/4.1.1\nglfw/3.3.8\n\
  glew/2.2.0\nsol2/3.3.1\nlua/5.4.6\n\n[generators]\ncmake\n\n[options]\nyaml-cpp:shared=True\n\
  assimp:shared=False\nphysx:shared=True\nglew:shared=False\nglfw:shared=False\n```\n\
  \n你会注意到 `yaml-cpp` 是动态链接的。也可以通过定义某些 CMake 进行静态链接。你可以参考 GitHub 仓库获取更多细节。\n\n### 11.2.4\
  \ yaml-cpp 辅助函数\n\n`yaml-cpp` 默认不支持序列化所有类型的数据。`glm::vec3` 等数据是不支持的。但 `yaml-cpp`\
  \ 提供了自定义类型序列化器和反序列化的方法。\n\n列表 11.4：Common/YAML\n\n```cpp\n#pragma once\n#include\
  \ \"Core.h\"\n#include <yaml-cpp/yaml.h>\n\nnamespace YAML\n{\n    template <>\n\
  \    struct convert<glm::vec3>\n    {\n        EMPY_INLINE static Node encode(const\
  \ glm::vec3& rhs)\n        {\n            Node node;\n            node.push_back(rhs.x);\n\
  \            node.push_back(rhs.y);\n            node.push_back(rhs.z);\n      \
  \      node.SetStyle(EmitterStyle::Flow);\n            return node;\n        }\n\
  \n        EMPY_INLINE static bool decode(const Node& node, glm::vec3& rhs)\n   \
  \     {\n            if (!node.IsSequence() || node.size() != 3)\n            {\n\
  \                return false;\n            }\n            rhs.x = node[0].as<float>();\n\
  \            rhs.y = node[1].as<float>();\n            rhs.z = node[2].as<float>();\n\
  \            return true;\n        }\n    };\n\n    // 流操作符\n    EMPY_INLINE Emitter\
  \ &operator <<Emitter& emitter, const glm::vec3& v)\n    {\n```\n\n\n\n\n```cpp\n\
  \          emitter << Flow;\n\n          emitter << BeginSeq << v.x << v.y << v.z\
  \ << EndSeq;\n\n          return emitter;\n\n     }\n}\n```\n\n这段代码为 `glm::vec3`\
  \ 实现了一个编码器和解码器。你可以使用相同的模式为不同数据类型实现自定义序列化器。\n\n### 11.3 场景序列化\n\n现在我们可以在此此为我们的引擎实现一个序列化器。我们需要能够序列化所有的实体和资产。我们将从场景序列化开始。以下是序列化类的骨架：\n\
  \n#### 列表 11.5：`Auxiliaries/Serializer.h`\n\n```cpp\n#pragma once\n\n#include \"\
  ECS.h\"\n\n#include \"Common/YAML.h\"\n\nnamespace Empy\n{\n    struct DataSerializer\n\
  \    {\n        EMPY_INLINE void Serialize(EntityRegistry& scene, const std::string&\
  \ path)\n        {\n            // 序列化场景\n        }\n\n        EMPY_INLINE void\
  \ Serialize(AssetRegistry& registry, const std::string& path)\n        {\n     \
  \       // 序列化资产\n        }\n\n        EMPY_INLINE void Deserialize(EntityRegistry&\
  \ scene, const std::string& path)\n        {\n            // 反序列化场景\n        }\n\
  \n        EMPY_INLINE void Deserialize(AssetRegistry& registry, const std::string&\
  \ path)\n        {\n            // 反序列化资产\n        }\n    };\n}\n```\n\n#### 11.3.1\
  \ 序列化实体\n\n以下是序列化 transform 组件并将其导出到函数参数提供的文件中代码。你可以看到我们如何使用 `yaml-cpp` 来定义输出文件的布局。\n\
  \n#### 列表 11.6：`Auxiliaries/Serializer.h`\n\n```cpp\nEMPY_INLINE void Serialize(EntityRegistry&\
  \ scene, const std::string& path)\n{\n    YAML::Emitter emitter;\n\n    emitter\
  \ << YAML::BeginMap;\n    {\n        emitter << YAML::Key << \"ENTITIES\" << YAML::Value\
  \ << YAML::BeginSeq;\n        {\n            scene.each([&] (EntityID entt)\n  \
  \          {\n                // 转换为实体对象\n                Entity entity(&scene,\
  \ entt);\n\n                // 序列化组件\n                emitter << YAML::BeginMap;\n\
  \                {\n                    // 序列化 transform\n                    if\
  \ (entity.template Has<TransformComponent>())\n                    {\n         \
  \               auto& transform = entity.template Get<TransformComponent>().Transform;\n\
  \                        emitter << YAML::Key << \"TransformComponent\" << YAML::BeginMap;\n\
  \                        {\n                            emitter << YAML::Key <<\
  \ \"Translate\" << YAML::Value << transform.Translate;\n                       \
  \     emitter << YAML::Key << \"Rotation\" << YAML::Value << transform.Rotation;\n\
  \                            emitter << YAML::Key << \"Scale\" << YAML::Value <<\
  \ transform.Scale;\n                        }\n                        emitter <<\
  \ YAML::EndMap;\n                    }\n                }\n                emitter\
  \ << YAML::EndMap;\n            });\n        }\n        emitter << YAML::EndSeq;\n\
  \    }\n    emitter << YAML::EndMap;\n\n    std::ofstream filepath(path);\n    filepath\
  \ << emitter.c_str();\n}\n```\n\n我们遍历 `scene` 中的每个实体并继续序列化其组件。序列化包括处理实体拥有 `TransformComponent`\
  \ 时的处理，捕获平移、旋转和缩放等属性。生成的 YAML 文件结构包含一个 `ENTITIES` 键，其中包含一个映射序列，每个映射对应一个实体及其序列化后的组件。最后，将序列化的\
  \ YAML 内容写入指定的文件路径。\n\n##### 序列化组件\n\n此函数可以扩展以支持所有其他组件类型，如下面的代码所示：\n\n#### 列表 11.7：`Auxiliaries/Serializer.h`\n\
