  {\n  EMPY_INLINE SpotLightComponent(const SpotLight&) = default;\n  EMPY_INLINE\
  \ SpotLightComponent() = default;\n  SpotLight Light;\n};\n```\n\n### 着色器类\n\n类似于点光源和方向光，我们必须为着色器添加额外的函数。\n\
  \nListing 6.27: Graphics/Shaders/PBR.h\n\n```cpp\n#pragma once\n#include \"Shader.h\"\
