  \ ... rest of the implementation\n        }\n\n        std::vector<std::unique_ptr<Mesh>>\
  \ m_Meshes;\n    };\n};\n```\n\n\n\n\n\n```cpp\ndata.Vertices.push_back(vertex);\n\
