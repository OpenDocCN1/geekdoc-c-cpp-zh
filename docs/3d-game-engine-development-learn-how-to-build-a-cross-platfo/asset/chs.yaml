  \ `BLOOM_THRESHOLD` 表示。在 `main` 函数中，该阈值用于计算与计算出的颜色的点积。如果结果超过 1，表示存在亮部，则将颜色输出到亮度图中。\n\
  \n### 高斯模糊着色器\n\n然后我们需要创建一个着色器来对亮度图进行模糊处理，以便使用它来获取最终结果。这在（列表 6.88）所示的代码中实现。顶点着色器非常简单，不需要对其进行过多描述。我们只需要渲染一个四边形（quad）。这就是为什么顶点着色器中的缓冲区布局是为了我们在最终着色器中使用的\
  \ `Quad2D`。进入片元着色器后，你将看到一些有趣的内容。\n\n| 列表 6.88: Resources/Shaders/bloom.glsl |\n\n\
  ```glsl\n#version 330 core\n\nlayout(location = 0) in vec4 a_quad;\n\nout vec2 uvs;\n\
  \nvoid main()\n{\n    gl_Position = vec4(a_quad.x, a_quad.y, 0.0, 1.0);\n    uvs\
  \ = vec2(a_quad.z, a_quad.w);\n}\n```\n\n++VERTEX++\n\n```glsl\n#version 330 core\n\
  \nout vec4 out_fragment;\nin vec2 uvs;\n\nconst float WEIGHTS[5] = float[] (0.2270270270,\
  \ 0.1945945946, 0.1216216216, 0.0540540541, 0.0162162162);\n\nuniform sampler2D\
  \ u_brightnessMap;\nuniform bool u_horizontalPass;\nuniform int u_frameHeight;\n\
  uniform int u_frameWidth;\n\nvoid main()\n{\n    vec3 color = texture(u_brightnessMap,\
  \ uvs).rgb * WEIGHTS[0];\n\n    // vec2 texelSize = 1.0 / textureSize(u_brightnessMap,\
  \ 0); 使用 opengl 4.x\n    vec2 texelSize = 1.0 / vec2(u_frameWidth, u_frameHeight);\n\
  \n    if(u_horizontalPass)\n    {\n        for(int i = 1; i < 5; ++i)\n        {\n\
  \            color += texture(u_brightnessMap, uvs + vec2(texelSize.x * i, 0.0)).rgb\
  \ * WEIGHTS[i];\n            color += texture(u_brightnessMap, uvs - vec2(texelSize.x\
  \ * i, 0.0)).rgb * WEIGHTS[i];\n        }\n    }\n    else\n    {\n        for(int\
  \ i = 1; i < 5; ++i)\n        {\n            color += texture(u_brightnessMap, uvs\
  \ + vec2(0.0, texelSize.y * i)).rgb * WEIGHTS[i];\n            color += texture(u_brightnessMap,\
  \ uvs - vec2(0.0, texelSize.y * i)).rgb * WEIGHTS[i];\n        }\n    }\n    out_fragment\
  \ = vec4(color, 1.0);\n}\n```\n\n++FRAGMENT++\n\n该着色器是一个可分离的高斯模糊，通常用于图像处理以实现模糊效果。它在\
  \ uniform 变量 `u_brightnessMap` 指定的亮度图上操作。根据布尔 uniform 变量 `u_horizontalPass`，可以沿水平或垂直方向应用模糊。帧的大小由\
  \ uniform 变量 `u_frameWidth` 和 `u_frameHeight` 决定。该着色器利用数组 `WEIGHTS` 定义的 5 采样高斯核来计算相邻像素元的加权平均值。\n\
  \n图 6.4: 高斯模糊\n\n高斯函数的公式为：$G(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}} e^{-\\frac{(x-\\\
  mu)²}{2\\sigma²}}$。其中 $\\mu$ 是均值（中心），$\\sigma$ 是标准差。\n\n### 高斯抽象\n\n在 6.89 中所示的代码是上面创建的\
  \ C++ 抽象。该着色器使用两个帧缓冲区来执行水平和垂直通道。你会注意到我们对帧进行了缩小处理。\n\n| 列表 6.89: Graphics/Shaders/Bloom.h\
