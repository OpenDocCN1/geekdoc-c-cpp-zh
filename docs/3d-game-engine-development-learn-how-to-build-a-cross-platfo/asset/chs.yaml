  ```\n\n#### 5.2.3 着色器抽象\n\n\n\n\n\n现在我们已经实现了 GLSL 着色器并已准备就绪，让我们来实现一种在引擎中加载和使用它们的方法。请将图\
  \ 5.14 所示的目录和文件包含在你的项目目录树中。\n\n![图片]](image_rsrc73R.jpg)\n\n| 图 5.14: | 着色器目录 |\n\
  \n`Shader.h` 将用于引入一个抽象着色器，作为所有着色器类的基类，提供加载、构建和链接各种着色器本质方法。此外，你还会注意到对应的着色器头文件，它们与在\
  \ GLSL 中实现的相对应。\n\n| 列表 5.14: | Graphics/Shaders/Shader.h |\n\n```cpp\n#pragma once\n\
  \n#include \"Common/Core.h\"\n\nnamespace Empy\n{\n    struct Shader\n    {\n  \
  \      EMPY_INLINE Shader(const std::string& filename)\n        {\n            m_ShaderID\
  \ = Load(filename);\n        }\n\n        EMPY_INLINE virtual ~Shader()\n      \
  \  {\n            glDeleteProgram(m_ShaderID);\n        }\n\n        EMPY_INLINE\
  \ void Unbind()\n        {\n            glUseProgram(0);\n        }\n\n        EMPY_INLINE\
  \ void Bind()\n        {\n            glUseProgram(m_ShaderID);\n        }\n\n \
  \   private:\n        EMPY_INLINE uint32_t Build(const char* src, uint32_t type)\n\
  \        {\n            uint32_t shaderID = glCreateShader(type);\n            glShaderSource(shaderID,\
  \ 1, &src, NULL);\n            glCompileShader(shaderID);\n\n            char error[512];\n\
  \            int32_t status = 0;\n            glGetShaderiv(shaderID, GL_COMPILE_STATUS,\
  \ &status);\n\n            if (!status) {\n                glGetShaderInfoLog(shaderID,\
  \ 512, NULL, error);\n                throw std::runtime_error(error);\n       \
  \         glDeleteShader(shaderID);\n                shaderID = 0u;\n          \
  \  }\n\n            return shaderID;\n        }\n\n        EMPY_INLINE uint32_t\
  \ Link(uint32_t vert, uint32_t frag)\n        {\n            uint32_t programID\
  \ = glCreateProgram();\n            glAttachShader(programID, vert);\n         \
  \   glAttachShader(programID, frag);\n            glLinkProgram(programID);\n\n\
  \            char error[512];\n            int32_t status = 0;\n            glGetProgramiv(programID,\
  \ GL_LINK_STATUS, &status);\n\n            if (!status) {\n                glGetProgramInfoLog(programID,\
  \ 512, error);\n                throw std::runtime_error(error);\n             \
  \   glDeleteProgram(programID);\n            }\n\n            glDeleteShader(vert);\n\
  \            glDeleteShader(frag);\n\n            return programID;\n        }\n\
  \n        EMPY_LINE uint32_t Load(const std::string& filename)\n        {\n    \
  \        std::ifstream fs;\n            fs.exceptions(std::ifstream::failbit | std::fstream::badbit);\n\
  \            try {\n                bool loading_vtx_source = true;\n          \
  \      fs.open(filename);\n\n                std::string line;\n               \
  \ std::string vtxSource;\n                std::string fragSource;\n\n          \
  \      // load vtx & frag source\n                while(getline(fs, line)) {\n \
  \                   if(loading_vtx_source) {\n                        if(line.compare(\"\
  ++VERTEX++\")) {\n                            vtxSource.append(line + \"\\n\");\n\
  \                            continue;\n                        }\n            \
  \            loading_vtx_source = false;\n                        continue;\n  \
  \                  }\n                    else {\n                        if(!line.compare(\"\
  ++FRAGMENT++\")) {\n                            break;\n                       \
  \ }\n                        fragSource.append(line + \"\\n\");\n              \
  \      }\n                }\n                fs.close();\n\n                uint32_t\
  \ vtxShader = Build(vtxSource.c_str(), GL_VERTEX_SHADER);\n                uint32_t\
  \ fragShader = Build(fragSource.c_str(), GL_FRAGMENT_SHADER);\n                return\
  \ Link(vtxShader, fragShader);\n            } catch (const std::exception& e) {\n\
  \                EMPY_ERROR(\"Load('{} Failed: {}\", filename, e.what());\n    \
  \        }\n            return 0;\n        }\n\n    protected:\n        uint32_t\
  \ m_ShaderID = 0u;\n    };\n}\n```\n\n列表 5.14 中的代码定义了一个抽象着色器类。构造函数首先读取一个文件，该文件通过标记\
  \ `++VERTEX++` 和 `++FRAGMENT++` 分隔了顶点和片元着色器代码部分。加载的源代码随后使用 `Build()` 编译为顶点和片元着色器，并通过\
  \ `Link()` 将它们链接成着色器程序。\n\n该结构还包含了使用 `Bind()` 和 `Unbind()` 分别绑定和取消绑定着色器程序的方法，利用\
  \ `glUseProgram()` 来激活或禁用着色器。在 `OpenGL` 中使用着色器时，你需要显式激活它。在使用完毕将其取消激活也是同样重要的。\n\n\
  `Load()` 方法协调了着色器的加载过程：读取着色器源码文件，将其分为顶点和片元部分，将每个部分编译为相应的着色器，并将它们链接成完整的着色器程序。异常处理确保了在文件操作或着色器编译期间的健壮管理，在失败时显示相应的错误信息。\n\
  \n### PBR 着色器抽象\n\n列表 5.15 中描述定义了 `PbrShader`，它继承自我们之前创建的抽象着色器。在它的构造函数中，使用 `glGetUniformLocation()`\
  \ 从着色器程序获取名为 `u_model`、`u_view` 和 `u_proj` 的统一变量的位置。每个 uniform 都有一个静态位置，可以在 CPU\
  \ 端请求以设置其值。\n\n| 列表 5.15: | Graphics/Shaders/PBR.glsl |\n\n```cpp\n#pragma once\n\
  \n#include \"Shader.h\"\n\nnamespace Empy\n{\n    struct PbrShader : Shader\n  \
  \  {\n        EMPY_INLINE PbrShader(const std::string& filename): Shader(filename)\n\
  \        {\n            u_Model = glGetUniformLocation(m_ShaderID, \"u_model\");\n\
  \            u_View = glGetUniformLocation(m_ShaderID, \"u_view\");\n          \
  \  u_Proj = glGetUniformLocation(m_ShaderID, \"u_proj\");\n        }\n\n    private:\n\
  \        uint32_t u_Model = 0u;\n        uint32_t u_View = 0u;\n        uint32_t\
  \ u_Proj = 0u;\n    };\n}\n```\n\n这些 uniform 位置存储在私有变量 `u_Model`、`u_View` 和 `u_Proj`\
  \ 中。它们稍将用于将变换矩阵（模型、视图、投影）传递给着色器，以便在各自的空间中正确渲染对象。该类将随着后续章节中新需求而演进。\n\n### Final 着色器抽象\n\
  \n这段代码定义了一个结构 `FinalShader` 它也继承自我们的基着色器。在它的构造函数中，它从着色器程序获取名为 `u_map` 的统一变量的位置。该\
  \ uniform 位置存储在私有变量 `u_Map` 中。此外，它使用 `Create2D()` 函数创建了一个 `Quad2D` 对象。\n\n| 列表 5.16:\
  \ | Graphics/Shaders/Final.glsl |\n\n```cpp\n#pragma once\n\n#include \"Shader.h\"\
  \n#include \"../Utilities/Quad.h\"\n\nnamespace Empy\n{\n    struct FinalShader\
  \ : Shader\n    {\n        EMPY_INLINE FinalShader(const std::string& filename):\
  \ Shader(filename)\n        {\n            u_Map = glGetUniformLocation(m_ShaderID,\
  \ \"u_map\");\n            m_Quad = CreateQuad2D();\n        }\n\n        EMPY_INLINE\
  \ void SetSceneMap(uint32_t map)\n        {\n            glActiveTexture(GL_TEXTURE0);\n\
  \            glBindTexture(GL_TEXTURE_2D, map);\n            glUniform1i(u_Map,\
  \ 0);\n        }\n    };\n}\n```\n\n\n\n\n\n```cpp\nEMPY_INLINE void Show(uint32_t\
  \ map)\n{\n    glBindFramebuffer(GL_FRAMEBUFFER, 0);\n    glClearColor(0, 0, 0,\
  \ 1);\n    glClear(GL_COLOR_BUFFER_BIT);\n    glUseProgram(m_ShaderID);\n    glActiveTexture(GL_TEXTURE0);\n\
  \    glBindTexture(GL_TEXTURE_2D, map);\n    glUniform1i(u_Map, 0);\n    m_Quad->Draw(GL_TRIANGLES);\n\
  \    glUseProgram(0);\n}\n\nprivate:\n    uint32_t u_Map = 0u;\n    Quad2D m_Quad;\n\
  };\n```\n\n它还包含两个额外方法：`SetSceneMap(uint32_t)` 激活纹理单元，将提供的纹理绑定到 `GL_TEXTURE_2D`，并将统一变量\
  \ `u_Map` 设置为相应的纹理单元索引。`Show(uint32_t)` 配置 OpenGL 在默认帧缓冲区渲染渲染场景。它清除颜色缓冲区、设置着色器程序、激活并绑定提供的纹理、设置相应的统一变量，并使用着色器程序绘制\
  \ 2D 四形。\n\n### 5.3 实体组件系统\n\n我们即将渲染第一个对象了，但在在此之前，仍然需要实现一些额外的组件。请坚持。游戏开发中的“场景”是一个基础组件，用于组织和表示游戏世界或环境中特定的部分。它本质上是各种元素的集合，例如对象、角色、设置、光照等，这些元素共同组成了游戏内可玩的分段或区域。\n\
  \n游戏开发中一个具有挑战性的方面是找到正确表示场景并高效组织对象的方法。几十年来，开发者们尝试了各种方法来应对这一挑战。最著名的技术之一是面向对象编程（OOP）。传统上，OOP\
  \ 通过类和继承来表示对象，并通过属性和行为来标识它们。然而，实体组件系统（ECS）设计的出现为该领域带来了革命。\n\n#### 5.3.1 什么是 ECS？\n\
  \nECS 是一种将数据与行为分离的软件设计模式，以促进代码重用。组件（数据）通常以对缓存友的方式存储，这增强了性能和内存利用率。缓存是一种基于芯片的计算机组件，提高了从计算机存储器检索数据的效率。它作为一个临时存储区域，计算机处理器可以从中轻松检索数据。这个被称为缓存的临时存储区域对于处理器来说，比计算机的主工作存储更容易、更快地访问。\n\
  \n![PIC](img/image_rsrc73S.jpg)\n\n| 图 5.15: 实体组件系统设计 |\n\nECS 将游戏对象拆分为实体（空容器或唯一标识符）、组件（实体的行为）和系统（行为的逻辑），允许更具模块化、灵活性且高效的表示。组件定义了对象行为的特定方面，如渲染、物理或\
  \ AI，而实体组装这些组件以形成功能性游戏实体。ECS 的意义在于它的模块化，使得能够在不同实体之间使用可重用的组件，通过并行处理优化性能，并提供可扩展性、灵活性和更清晰的实体设计，这些因素共同简化了游戏开发流程，并增强了参与创建复杂游戏世界的不同团队之间的协作。\n\
  \n##### ECS 替代方案\n\n为了理解为什么 ECS 是构建我们游戏引擎的优越选择，对各种设计方法进行比较至关重要。我们的探索将涵盖面向对象设计（OOD）、面向组件设计（COD）和面向数据设计（DOD），专注于评估的关键类别，如性能、维护性、CPU\
  \ 缓存效率和内存使用。\n\n*   **面向对象设计**：最初由于其将游戏描述为场景内对象之间的交互而具有吸引力，OOP 似乎适合游戏的创建。然而，尽管有这种表面上的适用性，但许多固有缺陷导致许多游戏抛弃了这种方法。\n\
  \n    ![PIC](img/image_rsrc73T.jpg)\n\n    | 图 5.16: 面向对象设计 |\n\n    在典型的游戏设计中，它需要如\
  \ `update()`、`destroy()` 和 `render()` 等函数。这种设置不仅复杂了维护，还影响了性能。这种内存存储方式不利地影响了内存使用，导致了缓存缺失。\n\
  \n*   **面向组件设计**：`图 5.17` 中的插图描述了 COD 的结构，每个游戏对象都包含组件集合。如 `Transform` 和 `Sprite`\
  \ 等核心组件继承自名为 `Component` 的抽象类。虽然这种技术没有从根本上解决 OOD 中存在的内存和 CPU 缓存问题，但它确实减轻了对虚查找表的需求。\n\
  \n    ![PIC](img/image_rsrc73U.jpg)\n\n    | 图 5.17: 面向组件设计 |\n\n*   **面向数据设计**：DOD\
  \ 的魅力由于其内在优势而显而易见：连续的内存布局、没有虚查找表以及优化的 CPU 缓存利用。它通常被称为实体-组件设计，是游戏开发中一种高效的范式。随附的 `图\
  \ 5.18` 插图是这一概念的关键表示。\n\n    ![PIC](img/image_rsrc73V.jpg)\n\n    | 图 5.18: 面向数据设计\
  \ |\n\n\n\n\n\nDOD 和 ECS 之间的主要区别之一在于 D DOD 允许组件自己实现它们的行为逻辑，而不是使用系统。这是一个微小的区别，并不会对整体性能产生巨大影响。\n\
  \n## 5.3.2 集成 ECS\n\n\"Entt\"作为一个轻量级、仅头文件（header-only）的 C++ ECS 库脱颖而出。它作为一个强大的框架，以极高的灵活性效率管理实体、组件和系统。虽然人们可以选择为特定项目开发自定义的\
  \ ECS 库，但利用 \"Entt\" 被证明是很有优势的。创建一个自定义实现的 ECS 将消耗大量的时间和资源，这可能导致效率低下和维护挑战。\n\nEntt\
  \ 在行业内的既有地位增强了它的可靠性和性能。值得注意的是，它已被 Minecraft 等知名项目采用，强调了它的健壮性以及处理真实世界中规模应用中复杂实体系统的适用性。这些大型项目的采用凸显了\
  \ Entt 处理各种用例并有效扩展的能力，使其成为管理 C++ 项目中实体、组件和系统的信赖选择。\n\n要将 \"Entt\" 集成到我们的项目中，我们可以简单地将其添加到\
  \ Conan，如下所示：\n\n| 列表 5.17: Root/conanfile.text |\n\n```text\n[requires]\nglm/cci.20230113\n\
  opengl/system\nspdlog/1.12.0\nentt/3.12.2\nglfw/3.3.8\nglew/2.2.0\n\n[generators]\n\
  cmake\n\n[options]\nglew:shared=False\nglfw:shared=False\n```\n\n这里是一个如何使用 \"EnTT\"\
  \ 的简单示例：\n\n| 列表 5.18: EnTT 示例 |\n\n```cpp\n#include <entt/entt.hpp>\n\nstruct Position\n\
  {\n    float x, y;\n};\n\nstruct Velocity\n{\n    float dx, dy;\n};\n\nint main()\n\
  {\n    entt::registry registry;\n\n    // 创建实体并附加组件\n    auto entity = registry.create();\n\
  \    registry.assign<Position>(entity, 0.0f, 0.0f);\n    registry.assign<Velocity>(entity,\
  \ 1.0f, 1.0f);\n\n    // 迭代系统\n    while (true)\n    {\n        registry.view<Position,\
  \ Velocity>().each([](auto& pos, auto& vel)\n        {\n            // 根据速度更新位置\n\
  \            pos.x += vel.dx;\n            pos.y += vel.dy;\n        });\n    }\n\
  \n    return 0;\n}\n```\n\n此示例展示了一个简单的场景：实体具有位置和速度组件，系统根据速度更新它们的位置。\n\n### 变换 (Transform)、相机\
  \ (Camera) 和网格 (Mesh)\n\n为了有效地渲染对象，我们希望能够将其放置在 3D 空间中，从摄像机的视角看到它的物理形状。这些要素元素被三个不同的组件封装：“Transform”、“Camera”和“Mesh”。\n\
  \n- **Transform (变换)**：变换定义了对象的空间属性，包括它在 3D 环境中的位置、旋转和缩放。它是将对象准确定位在场景中的基础组件。\n-\
  \ **Camera (相机)**：另一方面，相机指定了观察场景的摄像机视角和属性。该组件决定了如何从特定视角视化场景，影响如视场角、投影类型和视图矩阵等方面。\n\
  - **Mesh (网格)**：最后，网格通过定义其几何结构、材质属性以及可能的其他视觉属性来塑造对象的外。此组件本质上赋予了对象在渲染场景中的可见形式。\n\n\
  通过添加 `Data.h` 头文件来更新你的项目目录树，如图 [5.19] 所示。\n\n![图片](img/image_rsrc73W.jpg)\n| 图 5.19:\
  \ 工具数据 |\n\n(列表 [5.19]) 中的代码段定义了我们的渲染引擎中处理 3D 图形的关键数据。`ShadedMesh` 和 `Mesh3D` 是别名声明，简化了针对\
  \ `ShadedVertex` 类型特化的 `Mesh` 模板以及指向该网格的唯一指针的使用。\n\n| 列表 5.19: Graphics/Data.h |\n\
  \n```cpp\n#pragma once\n#include \"../Mesh.h\"\n\nnamespace Empy\n{\n    // transform\n\
  \    struct Transform3D\n    {\n        EMPY_INLINE mat4 Matrix()\n        {\n \
  \           return (translate(mat4(1.0f), Translate) *\n            toMat4(quat(radians(Rotation)))\
  \ *\n            scale(mat4(1.0f), Scale));\n        }\n\n        vec3 Translate\
  \ = vec3(0.0f);\n        vec3 Rotation = vec3(0.0f);\n        vec3 Scale = vec3(1.0f);\n\
  \    };\n\n    // camera\n    struct Camera3D\n    {\n        EMPY_INLINE mat4 Frustum(const\
  \ Transform3D& transform, float ratio)\n        {\n            return Projection(ratio)\
  \ * View(transform);\n        }\n\n        EMPY_INLINE mat4 View(const Transform3D&\
  \ transform)\n        {\n            return lookAt(transform.Translate, (transform.Translate\
  \ + vec3(0, 0, -1)),\n            vec3(0, 1, 0)) * toMat4(quat(radians(transform.Rotation)));\n\
  \        }\n\n        EMPY_INLINE mat4 Projection(float ratio)\n        {\n    \
  \        return perspective(FOV, ratio, NearPlane, FarPlane);\n        }\n\n   \
  \     float NearPlane = 0.3000f;\n        float FarPlane = 1000.0f;\n        float\
  \ FOV = 45.0f;\n    };\n}\n```\n\n`Transform3D` 代表 3D 对象的变换属性。它包含了根据平移、旋转和缩放值计算变换矩阵的方法。`Matrix()`\
  \ 方法使用 GLM 函数结合这些属性以产生最终的变换矩阵。\n\n![插图](img/image_rsrc73X.jpg)\n| 图 5.20: 透视相机 |\n\
  \nCamera3D 模拟了一个 3D 相机。它提供了计算相机视图和投影变换中使用的不同矩阵的方法。`Frustum()` 方法结合了投影和视图矩阵；`View()`\
  \ 计算视图矩阵；`Projection()` 根据指定的参数（如视场角 FOV、近平面和远平面）生成投影矩阵。GLM 简单地利用其内置函数 `glm::view()`\
  \ 和 `glm::projection()` 来创建所有矩阵。\n\n如下所示更新你的项目目录树（图 [5.21]）。\n\n![图片](img/image_rsrc73Y.jpg)\n\
  | 图 5.21: EnTT 封装 |\n\n### 组件类型\n\n如 (列表 [5.20]) 所示，将 EnTT 引入 \"ECS.h\" 头文件。我们只是为\
  \ EnTT 创建了类型别名使交互更加方便。我们还定义了变换、相机和网格组件，正如你所见，每个组件类型都有一个成员变量。\n\n\n\n\n## Entity\
  \ 类\n\n实体本质上由一个 32 位无符号整数标识符表示。该标识符允许在注册表中对实体进行组件的附加、分离或检索。然而，为了简化我们与游戏对象的交互，直接操作此实体标识符是不实际的。因此，我们选择在其周围封装实体结构，以便以更简单、更直观的方式处理游戏对象。该封装提供了一层抽象，屏蔽了原始标识符的直接使用，并增强了管理游戏对象的清晰度和易用性。\n\
  \n\n\n\n让我们将场景集成到引擎上下文中，以便于添加或移除实体。请按照 `ctxt-scene` 所示的示例，将场景整合到你的应用程序上下文中。\n\n\
  ### 列表 5.24：Application/Context.h\n\n```cpp\n#pragma once\n\n#include \"Window/Window.h\"\
  \n#include \"Auxiliaries/ECS.h\"\n#include \"Graphics/Renderer.h\"\n\nnamespace\
  \ Empy\n{\n    // 前向声明\n    struct AppInterface;\n\n    // 应用上下文\n    struct AppContext\n\
  \    {\n        EMPY_INLINE AppContext()\n        {\n            Window = std::make_unique<AppWindow>(&Dispatcher,\
  \ 1280, 720, \"Empy Engine\");\n            Renderer = std::make_unique<GraphicsRenderer>(1280,\
  \ 720);\n        }\n\n        EMPY_INLINE ~AppContext()\n        {\n           \
  \ for(auto layer : Layers)\n        {\n                EMPY_DELETE(layer);\n   \
  \     }\n    }\n\n        std::unique_ptr<GraphicsRenderer> Renderer;\n    std::vector<AppInterface*>\
  \ Layers;\n    std::unique_ptr<AppWindow> Window;\n    EventDispatcher Dispatcher;\n\
  \    EntityRegistry Scene;\n};\n```\n\n场景本质来自“EnTT”的实体注册表。它负责管理所有实体及其对应的组件。虽然我们可以对此注册表创建一个封装器来增强其易用性，但我们选择直接使用应用接口进行交互。这种选择符合我们在各个层级中反映这些交互的目标，确保添加、删除和修改实体的功能集成在编辑器内部。这种方法维持了整个应用程序的一致性，能够在应用程序的不同组件和层级之间实现无缝的实体管理。你还会注意到我们添加的\
  \ `GraphicsRenderer`。\n\n### 场景接口函数\n\n如之前强调的，我们的目标是让应用程序中的每一层都能与场景无缝交互，允许实体的创建、销毁和修改。通过在（列表\
  \ [5.25]）所示的应用接口类中实现专门的成员函数，可以很容易实现这一目标。\n\n### 列表 5.25：Application/Interface.h\n\
  \n```cpp\n#pragma once\n\n#include \"Context.h\"\n\nnamespace Empy\n{\n    struct\
  \ AppInterface\n    {\n        /* ... 与之前相同 ... */\n\n        // 创建实体\n        template\
  \ <typename Entt, typename... Args>\n        EMPY_INLINE Entt CreateEntt(Args&&...\
  \ args)\n        {\n            EMPY_STATIC_ASSERT(std::is_base_of<Entity, Entt>::value);\n\
  \            return std::move(Entt(&m_Context->Scene, std::forward<Args>(args)...));\n\
  \        }\n\n        // 将 ID 转换为实体\n        template <typename t>\n        EMPY_INLINE\
  \ t ToEntt(EntityID entity)\n        {\n            EMPY_STATIC_ASSERT(std::is_base_of<Entity,\
  \ t>::value);\n            return std::move(t(&m_Context->Scene, entity));\n   \
  \     }\n\n        // 遍历实体\n        template <typename t, typename Comp, typename\
  \ Task>\n        EMPY_INLINE void EnttView(Task&& task)\n        {\n           \
  \ EMPY_STATIC_ASSERT(std::is_base_of<Entity, t>::value);\n            m_Context->Scene.view<Comp>().each(this,\
  \ &task\n            {\n                task(std::move(t(&m_Context->Scene, entity)),\
  \ comp);\n            });\n        }\n\n        /* ... 与之前相同 ... */\n    }\n}\n\
  ```\n\n这些成员函数利用模板参数来提供灵活性。例如，`CreateEntt()` 函数接受实体类作为模板参数，方便了自定义实体类型的创建。另一方面，`EnttView()`\
  \ 有助于于遍历所有拥有特定组件类型的实体。`ToEntt` 函数的意言自明，它简单地将给定的实体标识符转换为由模板类型定义的实体对象。\n\n#### 5.3.4\
  \ 渲染第一帧\n\n现在是时候最终见证你辛勤努力的成果了。请按照（列表 [5.26]）所示更新你的 `Application.h` 头文件。这基本上涵盖了渲染我们第一帧所需的所有工作。\n\
  \n### 列表 5.26：Application/Application.h\n\n```cpp\nstruct Application : AppInterface\n\
  {\n    EMPY_INLINE Application()\n    {\n        // 初始化应用上下文\n        m_LayerID\
  \ = TypeID<Application>();\n        m_Context = new AppContext();\n\n        //\
  \ 附加窗口大小调整事件回调\n        AttachCallback<WindowResizeEvent>([this] (auto e)\n    \
  \    {\n            m_Context->Renderer->Resize(e.Width, e.Height);\n        });\n\
  \    }\n\n    EMPY_INLINE ~Application()\n    {\n        EMPY_DELETE(m_Context);\n\
  \    }\n\n    EMPY_INLINE void RunContext()\n    {\n        // 创建场景相机\n        auto\
  \ camera = CreateEntt<Entity>();\n        camera.Attach<TransformComponent>().Transform.Translate.z\
  \ = 2.0f;\n        camera.Attach<CameraComponent>();\n\n        // 创建四边形实体\n   \
  \     auto quad = CreateEntt<Entity>();\n        quad.Attach<MeshComponent>().Mesh\
  \ = CreateQuad3D();\n        quad.Attach<TransformComponent>();\n\n        while(m_Context->Window->PollEvents())\n\
  \        {\n            // 渲染新帧\n            m_Context->Renderer->NewFrame();\n\n\
  \            // 设置着色器相机\n            EnttView<Entity, CameraComponent>(this\n  \
  \          {\n                auto& transform = entity.template Get<TransformComponent>().Transform;\n\
  \                m_Context->Renderer->SetCamera(comp.Camera, transform);\n     \
  \       });\n\n            // 渲染模型\n            EnttView<Entity, MeshComponent>(this\n\
  \            {\n                auto& transform = entity.template Get<TransformComponent>().Transform;\n\
  \                m_Context->Renderer->Draw(comp.Mesh, transform);\n            });\n\
  \n            m_Context->Renderer->EndFrame();\n\n            // 更新层\n         \
  \   for(auto layer : m_Context->Layers)\n            {\n                layer->OnUpdate();\n\
  \            }\n\n            // 显示帧\n            m_Context->Renderer->ShowFrame();\n\
  \        }\n    }\n};\n```\n\n你会在应用程序构造函数中注意到我们在 `WindowResizeEvent` 触发时附加了一个事件回调函数。这有助于缓冲区的大小始终与当前窗口的大小匹配。`RunContext()`\
  \ 如你所知，定义了引擎的核心循环。它从创建一个场景相机和一个用于渲染的四边形实体开始。循环随后处理窗口事件、更新引擎上下文中的各个层级，并持续渲染新帧。在渲染阶段，它通过遍历拥有特定组件（`CameraComponent`\
  \ 和 `MeshComponent`）的实体来设置相机位置并渲染场景中的模型。根据变换调整相机位置，并根据网格和变换数据绘制模型。最后，将渲染的帧显示在屏幕上。\n\
