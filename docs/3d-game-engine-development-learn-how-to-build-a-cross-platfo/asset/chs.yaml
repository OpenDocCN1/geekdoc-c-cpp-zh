  \n![[Picture]](image_rsrc730.jpg)\n\n## 3 核心引擎设计\n\n懒惰手致贫，勤奋手致富（所罗门）\n\n复杂项目（如游戏引擎）的开发面临着许多挑战。其中之一是如何有效地编写和组织源代码。随着时间的推移，出现了许多解决方案来简化开发者的这一过程。然而，C++\
  \ 往往带有复杂且易于组织的声誉。在我学习 C++ 的过程中，我尝试了针对特定需求和应用设计的各种软件设计。在本书中，我们将利用我自己的名为“上下文层”（Context\
  \ Layers, CIL）的方法。\n\n***\n\n![PIC](img/image_rsrc731.jpg)\n\n| 图 3.1: | 上下文接口设计\
  \ |\n\n***\n\n如（图 3.1\n\n| 图 3.2: | 应用程序目录 |\n\n***\n\n目前，（列表 3.1 {\n          \
  \  for(auto& layer : Layers) {\n                EMPY_DELETE(layer);\n          \
  \  }\n        }\n\n        std::vector<AppInterface*> Layers;\n    };\n}\n```\n\n\
  应用程序接口（列表 3.2 = default;\n\n        protected:\n            EMPY_INLINE void OnUpdate()\
  \ {}\n            EMPY_INLINE void OnStart() {}\n\n        private:\n          \
  \  friend struct Application;\n            AppContext* m_Context;\n            uint32_t\
