- "# 3D 游戏引擎开发：学习使用 C++ 和 OpenGL 构建跨平台 3D 游戏引擎\n\n\n\n![](img/image_rsrc726.jpg)\n\
  \n![PIC](img/image_rsrc727.jpg)![PIC](img/image_rsrc728.jpg)\n\n\n\n\n\n现在，让我从一开始就明确：从零开始创建一个游戏引擎不是胆小者完成的任务。这是一项需要对计算机、编程、数学和物理有扎实掌握的追求。它召唤你开启一段旅程，在途中你解开复杂的概念，然后将它们转化为为各种虚拟想法注入生命的代码行。当你从隧道的尽头出来时，你将拥有设计和开发高性能游戏引擎的坚实基础。尽管如此，我想鼓励你不要放弃。\n\
  \n## 1.1 什么是游戏引擎？\n游戏引擎是一种软件或平台，提供了开发、运行和管理视频所需的核心功能和工具。它是游戏开发的技术骨柱，提供了一系列预构建的模块、库和系统，以简化交互式数字体验的创建。游戏引擎不仅用于视频游戏开发，还用于模拟、建筑可视化、培训以及各行业的交互媒体。它们的不断演进和改进，使游戏开发者能够专注于创意和游戏性，同时利用引擎的技术能力。\n\
  \n在过去的几十年里，游戏引擎的发展经历了巨大的变革。硬件和软件的进步导致了高度复杂的引擎的诞生，实现了叹为观止的图形、物理效果和交互。`Godot` 和 `Unreal`\
  \ 等开源引擎使游戏开发民主化，让更广泛的人能够创作沉浸式体验。此外，移动游戏的爆发要求便携设备拥有轻量级引擎。行业也转向了实时光线追踪和虚拟现实（VR）技术。总之，过去的\
  \ 20 年见证了游戏引擎技术的快速演进，使游戏开发变得更加容易，并推了游戏的边界。\n\n### 1.1.1 热门游戏引擎\n全球范围内在使用许多著名的游戏引擎。以下是一些知名引擎。\n\
  \n* `Unity`：一种深受独立开发者和小工作室欢迎的跨平台游戏引擎，以其易用的界面广泛的平台支持（包括 PC、主机、移动设备和网页）而闻名。\n\n\n\n\
  \n\n*   `Unreal`: 一个由 Epic Games 开发的强大且广泛使用的游戏引擎，以创建各种类型的游戏而闻名，包括第一称射击游戏、动作游戏和角色扮演游戏\
  \ (RPG)。\n*   `Godot`: 作为开源游戏引擎，Godot 以其用户友好的界面、灵活性和社区驱动的发展而脱颖而出。它提供了一个基于节点的场景系统，简化了游戏设计并支持\
  \ 2D 和 3D 游戏开发。\n*   `GameMaker`: 爱好者和初级游戏开发者的喜爱之，GameMaker 的简单性和拖放界面使得无需大量编程即可进行\
  \ 2D 游戏开发。\n*   `CryEngine`: 由 Crytek 开发，CryEngine 以其高质量的图形和广泛的平台兼容性著称，适用于第一称射击游戏和动作游戏。\n\
  *   `Lumberyard`: 由 Amazon 开发并基于 `CryEngine`，Amazon Lumberyard 是一款免费的跨平台游戏引擎，用于各种游戏，包括大型多人在线\
  \ (MMO)、RPG 和开放世界游戏。\n\n***\n\n![PIC](img/image_rsrc729.jpg)\n\n| 图 1.1: | 流行引擎\
  \ Ayin |\n\n***\n\n这些仅仅是少数著名的游戏引擎。还有许多其他引擎，每种都有其独特的特征和功能。此外，内容创作者在 YouTube 等平台上还开发了独立的游戏引擎，例如\
  \ `Hazel Engine` Yan Chernikov 和 `Cave Engine` Teres。\n\n## 1.2 游戏引擎设计\n\n游戏引擎的设计有许多方法，游戏引擎的具体设计取决于其所用游戏的需求和目标。通常，我们倾向于将“游戏引擎”一词与创建游戏的用户界面联系起来，但这种观念在程度上是误的。游戏引擎并不一定包含现有流行引擎中常见的所有工具。然而，游戏引擎的一些共同特性包括：\n\
  \n*   `Rendering Engine`: 负责生成游戏的视觉输出，包括 3D 模型、纹理和特效。它利用图形应用程序接口 (API) 如 `OpenGL`、`Vulkan`\
  \ 或 `Direct3D` 在屏幕上绘制游戏世界。\n*   `Physics Engine`: 模拟游戏世界中对象的物理属性，如重力、质量和摩擦力。它实现了对象与环境之间真实的交互。通常使用软件开发包\
  \ (SDKs) 如 `NVIDIA PhysX` NVIDIA、`Bullet Physics` development team 来此此。\n*   `Sound\
  \ Engine`: 管理游戏的音频方面，包括音效、音乐和对话。它可能利用 `SDL_Mixer`、`OpenAL` 或 `FMOD` 等库播放播放文件并控制音量、音调和空间化等音频属性。\n\
  *   `Scripting Engine`: 游戏引擎的核心负责管理游戏状态、更新游戏世界并处理用户输入。它可以采用 `C#`、`Lua` 或 `Python`\
  \ 等编程语言来实现游戏机制和人工智能。\n*   `Assets Management`: 负责游戏资产，如 3D 模型、纹理、字体和音频文件。该系统可能包括导入、导出和组织资产的工具。\n\
  *   `Scene Editor`: 开发者通过该界面与引擎功能交互，以实现他们的游戏想法。\n\n### 1.2.1 高层架构\n\n与其他许多行业相比，游戏行业运行时没有一个为构建适当架构规定确定性蓝图的管理机构。这种双重性既有优点也有缺点。优点方面，它赋予了开发者尝试自己创新想法的自由。然而，缺点是缺乏标准的指南使得客观评估一种方法的有效性具有挑战性。自然，存在最佳实践，并且应该考虑它们以避免重复的错误。\n\
  \n游戏引擎的设计刻意具有灵活性，为培养创造力提供了肥沃的土壤，使艺术家能够将他们独特的愿变为现实。这种多样性与每个游戏所服务的广泛用途、需求和目标相契合，强调了每项开发工作的独特特征。\n\
  \n（图 1.2）描述了我们本书目标的高层架构。引擎的基本能力封装在 Windows 的共享库或 Linux 的共享对象中。在计算机科学中，共享库是一种设计用于供多个程序同时使用的文件。在运行时，库的模块被动态加载到可执行文件的内存空间中，例如\
  \ `Game.exe` 和 `Empy.exe`，便于访问引擎定义的功能。`Game.exe` 代表精细的、可分发的产品，允许他人享受使用该引擎制作的游戏，而\
  \ `Empy.exe` 则作为编辑游戏场景并准备分发的多通用工具。\n\n***\n\n![PIC](img/image_rsrc72A.jpg)\n\n|\
  \ 图 1.2: | 高层架构 |\n\n***\n\n为了与引擎的功能交互，我们利用了脚本。这涉及在现有引擎之上编写辅助代码，以增强其功能并与其特征界面。关于这一过程的更多见解将在后续章节提供。\n\
  \n## 1.3 开发工具\n\n一个广泛接受的共识是，`C++` 已牢成为游戏引擎的首选编程语言，这主要由于其性能优化能力、跨平台兼容性以及与底层 API 接口的能力。它对面向对象设计的支持有助于构建引擎组件。巨大的\
  \ `C++` 生态系统，加上该语言在 `Unreal Engine` 等现有引擎中使用，巩固了它在行业中的地位。虽然 `C++` 占据主导，但游戏引擎的开发也有\
  \ `C#`、`Rust` 和 `Python` 等语言的贡献，每种语言的选择都是根据项目的特定需求和目标决定的。由于上述原因，本书采用了 `C++`。\n\n\
  ### 1.3.1 编码环境\n\n在 `C++` 开发领域导航集成开发环境 (IDE) 的景观可能是一段挑战性的旅程。开发者经常遇到许多选择，每种选择都有自己的优势和复杂性。选择正确的\
  \ IDE、配置它并确保与 `C++` 开发生态系统的兼容性可能会带来重大挑战。然而，我们本书的选择是 `Visual Studio Code` (`VS-Code`)，这是一个由微软开发的轻量级且多功能的代码编辑器。`VS-Code`\
  \ 拥有丰富的扩展和插件生态系统，专门满足 `C++` 开发的需求。它将用户友好界面与强大的功能相结合，是新手和资深开发者的极选择。它的灵活性允许我们无缝地定制开发环境以适应游戏开发的需求。\n\
  \n### 1.3.2 构建系统\n\n构建系统是自动将源代码编译为可执行程序或库的关键组件。它包含了一套规则和程序，用于将源文件（如 `C++` 源代码和资源文件）转换为可以在计算机上运行的机器读二进制代码。构建系统的主要目标是管理依赖、根据更改确定哪些源文件需要重新编译，并确保编译过程高效且无错。我们将将使用的\
  \ `CMake` 在简化 `C++` 项目构建这一通常复杂且依赖于平台的过程中起着至关重要的作用，使开发更易于管理和获取。\n\n\n\n\nC++ 项目通常依赖于外部库和包，每个包都有自己的依赖关系和版本要求。这种复杂的依赖网络会导致兼容性问题、版本冲突，以及配置和维护开发环境的巨大开销。然而，Conan\
  \ 作为一个 C++ 包管理器显著简化了这一过程。Conan 通过为 C++ 包提供中央仓库（[`conan.io/center`](https://conan.io/center)）并确保版本控制和一致性，简化依赖管理。它自动化了依赖的获取、集成和构建，避免了繁琐且易出错的手动依赖管理任务。在本书，我们将利用\
  \ Conan 无缝地管理和集成必要的库和包，使能够专注于游戏引擎开发的核心领域，而无需处理复杂的依赖纠纷。\n\n### 1.3.3 图形 API\n\n图形\
  \ API 是至关重要的软件框架，使开发者能够创建视觉引人且交互式的应用程序，特别是在计算机图形和游戏开发领域。这些 API 充当应用程序与图形硬件之间的中间器，允许程序员充分利用现代图形处理器（GPU）的全部性能。著名的图形\
  \ API 包括 OpenGL、DirectX、Vulkan 和 Metal，每种都针对特定平台定制，并提供不同程度的控制和性能优化。图形 API 的选择通常取决于目标平台、项目需求以及开发者对特定框架的熟悉程度。这些\
  \ API 允许开发者渲染 2D 和 3D 图形、实现着色器、管理纹理并实现实时视觉效果，形成了许多设备上沉浸式游戏体验和图形应用的基础。\n\n本书采用 OpenGL\
  \ 用于高性能图形 作为图形 API，是出于几个非常有信服力的理由。OpenGL 的跨平台兼容性确保了所学技能可以适应各种操作系统和设备。它是游戏开发中广泛使用的行业标准图形\
  \ API，为读者提供了有关行业最佳实践的信息。OpenGL 的开放性、性能控制和教育价值使其成为学习现代图形编程基础的、易于获取且多功能的选择。\n\n###\
  \ 1.3.4 脚本 API\n\n游戏引擎中的脚本是通过使用脚本代码为游戏注入交互性、动态性和自定义行为的艺术。它充当游戏核心引擎与使每种游戏体验独独特的动态元素之间的桥梁。脚本赋予开发者定义游戏机制、创建复杂的\
  \ AI 行为、编排游戏内事件以及塑造玩家旅程的能力。它提供了一种灵活高效的方式来对游戏设计迭代，而无需深入引擎源代码，允许快速原型设计和调整。\n\n本书引入\
  \ Lua PUC-Rio 作为其脚本语言，也是出于几个非常有信服力的理由。Lua 轻量级且可嵌入的特性为游戏引擎增加了扩展性而没有引入复杂性。它的简单性、在游戏开发中的普及以及多功能使其成为编写游戏逻辑和行为的理想选择，并且拥有资源丰富的支持性社区。Lua\
  \ 与 C/C++ 的无缝集成允许我们在保持性能关键组件的同时，利用其动态能力。\n\n### 1.3.5 图形用户界面\n\nUnity 和 Unreal 等游戏引擎允许你在图形用户界面（GUI）环境中创建游戏，然后将最终结果导出为\
  \ PC、智能手机、游戏主机等特定平台的运行程序。我们在书中将构建的引擎也需要一个编辑器。（图 1.3 显示了预览。\n\n***\n\n![PIC](img/image_rsrc72B.jpg)\n\
  \n| 图 1.3: | 引擎预览 |\n\n***\n\n我们将使用 Dear ImGui Omar 创建游戏编辑器环境。Dear ImGui 是一个用于 C++\
  \ 的无加载图形用户界面库。它输出优化的顶点缓冲区，你可以在启用了 3D 流线的应用程序中随时渲染它。它是快速、可移植、与渲染器无关且自包含的。Dear ImGui\
  \ 设计用于实现快速迭代，并授权程序员创建内容创建工具以及可视化/调试工具。Dear ImGui 特别适合集成到游戏引擎、全屏应用、嵌入式应用或任何操作系统功能非标准的游戏主机平台应用中。\n\
  \n### 1.4 总结\n\n在整本书中，我们将利用多个工具和库来增强我们的引擎，增加如音效、3D 模型加载、序列化等功能。每个新工具将根据需要引入，并将其无缝地集成到我们的开发过程中。\n\
  \n## 2 环境搭建\n\n懒惰者的胃口永远无法满足，但勤奋者的愿望会得到充分满足。（所罗门王）\n\n在本章中，我们的重点将是安装对于促进开发我们的游戏引擎至关重要的基本工具。如果你的开发环境专门基于\
  \ Windows 或 Linux，你可以方便地跳到下面与你特定平台相关的章节。特定平台的依赖项将在那些章节中得到全面解决，确保设置过程无缝。除了初始设置外，书的剩余内容在各个平台上保持一致，仅在过程中偶尔需要进行细微调整。\n\
  \n如果你不熟悉本章介绍的工具，我们建议你按照描述的步骤安装提供的版本。\n\n### 2.1 平台支持\n\n书中提供的代码设计用于 Windows、Linux\
  \ 和 MacOS。但需要注意的是，我们的测试主要集中在 Windows 和 Linux 上。遗憾的是，由于缺乏硬件，我们无法在 Mac 计算机上进行测试。因此，书中的讨论和示例将主要围绕\
  \ Windows 和 Linux 的实现。\n\n***\n\n| 属性 |\n| :--- |\n| GPU |\n| CPU |\n| RAM |\n|\
