  \n-  `Ia` (环境光强度)：它代表环境光源的强度或光强。`Ia` 值越高，环境光越亮，影响场景的整体亮度。\n-  `Lr` (环境光辐射)：它代表环境光源的颜色或辐射强度。\n\
  \n### 6.1.2 漫反射组件 (Diffuse Component)\n\n漫反射照明模拟了光在表面上的散射反射，它捕捉了光如何向所有方向均匀地与表面相互作用，从而营造出哑光面的的效果。PBR\
  \ 漫反射光公式使用以下方程计算漫反射光的贡献：\n\n![Dif fuse = Kd ∗Id ∗cos(\U0001D703)∗ Lr](img/image_rsrc745.jpg)\n\
  \n-  `Kd` (漫反射系数)：它描述了光在表面上散射或扩散的方式，产生更柔和、哑光的外观。该组件考虑了从表面向所有方向均匀反射的光。\n-  `Id` (漫反射光强度)：该系数控制漫反射光对物体颜色的影响。`Kd`\
  \ 值越高，漫反射光对物体外观的贡献越显著。\n-  `\U0001D703` (表面法线与光方向之间的角)：余弦项测量了表面法线（垂直于表面的向量）与从表面指向光源的方向之间的角度。它量化了有多少光直接击中表面，从而影响漫反射的强度。参见（图\
  \ 6.2）。\n\n***\n\n![PIC](img/image_rsrc746.jpg)\n\n| 图 6.2: | 扩散角 |\n\n***\n\n###\
  \ 6.1.3 高反射组件 (Specular Component)\n\n高反射照明模拟了光从表面反射产生的光亮高光，它侧重于光的定向反射，通常出现在光泽或反光表面上。PBR\
  \ 高反射光公式使用以下方程计算高反射光的贡献：\n\n![Specular = Ks ∗ Is ∗ cos(\U0001D703)n∗Lr](img/image_rsrc747.jpg)\n\
  \n-  `Ks` (高反射系数)：控制物体外观上高反射的强度。`Ks` 值越高，高光越越明显、越强烈。\n-  `Is` (高反射光强度)：代表高反射光源的强度或光强。`Is`\
  \ 值越高意味着高反射光源越亮，影响高光的整体亮度和强度。\n-  `\U0001D703` (反射光与观察者之间的角)：测量反射光方向与指向观察者或相机的方向之间的角度。它决定了根据观察角度，观察者能看到多少比例的高光。参见（图\
  \ 6.3）。\n-  `n` (高反射指数)：高反射指数控制高光的聚焦和锐度。`n` 值越高，产生的高光越聚焦、越集中。\n\n***\n\n![PIC](img/image_rsrc748.jpg)\n\
  \n| 图 6.3: | 高反射参数 |\n\n***\n\n虽然 Phong 着色提供了简单性，但其局限性无法满足我们引擎对真实主义的追求。我们的目标是尽可能接近现实，这就是为什么我们选择了\
  \ PBR 方法。\n\n### 6.2 物理渲染渲染 (Physically Based Rendering)\n\nPBR Wikipedia [a] 是一种渲染方法，力求以物理准确的方式模拟光和材料的行为，产生更真实、更一致的结果。其核心是\
  \ PBR 依赖于几个基本原理和方程来建模光与表面的相互作用。\n\n与 Phong 不同，PBR 的目标是通过更紧密地遵循控制光与材料相互作用的物理原理来实现更高的真实性。PBR\
  \ 结合了复杂的模型，例如渲染方程和微面理论，考虑了表面粗糙度、能量守恒和菲涅尔效应等复杂的细节。通过准确建模光如何从表面反射，PBR 可以在各种光照条件和材料类型下产生更生动、一致的结果。\n\
  \n***\n\n![PIC](img/image_rsrc749.jpg)\n\n| 图 6.4: | PBR 材料 系统 |\n\n***\n\n渲染方程是\
  \ PBR 的基石，它描述了表面某点在特定方向上的出辐射 `Lo` 是发射辐射 `Le` 和来自入射光的反射辐射之和：\n\n![∫ Lo (x, ωo) =\
  \ Le (x,ωo)+ fr(x,ωi,ωo)⋅Li(x,ωi) ⋅(ωi ⋅n)dωi Ω](img/image_rsrc74A.jpg)\n\n这里：\n\
  - `Lo` 是出辐射。\n- `Le` 代表发射辐射。\n- `fr` 是双向反射分布函数 (BRDF)，它定义了光如何根据入射和出射角度在某点散射。\n-\
  \ `Li` 表示入射辐射。\n- `ωi` 和 `ωo` 是入射和出的光方向。\n- `n` 是表面法线。\n\nBRDF `fr` 封装了表面的反射属性，在\
  \ PBR 中起着关键作用。它通常由多个组件组成，例如朗伯特漫反射 绘制一个像素反射和 Cook-Torrance 汇编 微面高反射模型：\n\n![c D (h)\
  \ ⋅F(v,h )⋅G (v, l) fr(x,ωi,ωo) = kd ⋅--+ ks ⋅-------------------- π 4 ⋅(n·n)](img/image_rsrc74B.jpg)\n\
  这里：`kd` 代表漫反射反射率。`ks` 代表高反射反射率。`D(h)` 是微面分布。`F(v,h)` 是菲涅尔项。`G(v,l)` 是几何衰减。`v` 是视方向，`l`\
