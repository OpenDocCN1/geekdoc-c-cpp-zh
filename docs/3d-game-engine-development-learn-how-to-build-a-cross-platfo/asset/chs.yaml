  \   // 调整亮度缓冲区 // 调整大小\n    glBindTexture(GL_2D, m_Brightness);\n    glTexImage2D(GL_2D,\
  \ 0, GL_RGBA16F, m_Width, m_Height, 0, GL_RGBA, NULL);\n\n    // 调整渲染缓冲区\n    glBindRenderbuffer(GL_RENDERBUFFER,\
