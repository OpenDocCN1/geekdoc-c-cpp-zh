  \    \n        }\n        EMPY_INLINE void End()\n        {\n            glDisable(GL_SAMPLES);\
  \    \n            glDisable(GL_DEPTH_TEST);\n            glBindFramebuffer(GL_FRAMEBUFFER,\
  \ 0);\n        }\n    private:\n        EMPY_INLINE void CreateColorAttachment()\n\
