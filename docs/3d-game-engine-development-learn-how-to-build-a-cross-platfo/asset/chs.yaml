  \ Ubuntu |\n\n### 2.3.4 安装 Conan\n\n以下是在你的 Linux 系统上安装 `Conan` 的步骤。在正常情况下，Ubuntu\
  \ 已经安装了 `python` 以及大部分工具如 `pip` 或 `python3.11-venv`。但我们考虑到最坏的情况。\n\n*   **安装 Python**：你可以通过以下命令下载并安装\
  \ `python`：\n    ```bash\n    # 更新包管理器\n    sudo apt-get update\n\n    # 安装 python3\
  \ 和虚拟环境管理器\n    sudo apt-get install python3 python3-pip python3.11-venv\n\n   \
