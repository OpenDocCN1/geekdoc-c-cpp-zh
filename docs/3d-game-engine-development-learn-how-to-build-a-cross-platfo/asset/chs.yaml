  我们将开始为 Windows 安装所有基本工具。如果你打算使用自定义 IDE，请随时跳过本节。\n\n#### 2.2.1 安装 VS Code\n\n你可以通过访问官方下载页面\
  \ [`code.visualstudio.com/download`](https://code.visualstudio.com/download) 获取\
  \ VS-Code。在此页面上，你可以找到 32 位和 64 位版本。选择与你的操作系统兼容的适当版本。现在很少有人使用 32 位电脑了。下载后，运行 `.exe`\
  \ 文件并按照默认配置设置继续。此外，确保在过程中启用了 `Add to PATH` 选项。\n\n***\n\n![PIC](img/image_rsrc72C.jpg)\n\
