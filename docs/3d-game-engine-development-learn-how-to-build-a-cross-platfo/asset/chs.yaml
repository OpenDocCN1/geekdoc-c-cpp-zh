  };\n\n// 辅助类型定义\nusing Animator3D = std::shared_ptr<Animator>;\nusing Model3D =\
  \ std::shared_ptr<Model>;\n\n`ParseHierarchy()` 函数负责从 Assimp 节点中解析关节层级结构。它首先提取当前\
  \ Assimp 节点的名称，并检查该名称是否已存在于 `jointMap` 中。如果关节名称存在，表示之前已经创建了对应的关节结构，代码将检索并将该关节结构分配给当前关节。对于当前\
  \ Assimp 节点的每个子节点，该函数会递归地调用自身，解析层级并为每个子节点构建关节结构。如果在 `jointMap` 中未找到关节名称，则递归将继续，而不修改当前关节。\n\
  \n`ParseAnimations` 函数对于提取模型中每个关节关联的动画属性和关键帧至关重要。初始循环遍历 Assimp 场景中存在的动画，通过提取名称、持续时间和每秒刻度数等相关信息，为每个动画构建\
  \ `Animation` 结构。然后，这些动画被添加到关联 `Animator` 结构中的 `m_Animations` 向量中。在动画循环内部，有一个嵌套循环负责遍历与每个关节关联的动画通道\
  \ `aiNodeAnim` 实例。\n\n对于每个通道，函数获取关节的名称并检查其在 `jointMap` 中的存在性。如果关节存在，函数将继续解析位置、旋转和缩放的关键帧。每个关键帧都根据相应的\
  \ Assimp 数据构建，并附加到 `jointMap` 中对应关节的 `Keys` 向量中。这一过程确保了动画数据（包括关键帧）正确地与相应的关节关联。在动画解析循环之后，函数调用\
  \ `ParseHierarchy()` 来如前文所述地解析层级结构。\n\n在 `ParseMesh()` 函数中，最核心部分是用于解析关节的循环。该循环遍历\
  \ Assimp 网格中存在的骨骼，提取每个骨骼的关节名称、偏移矩阵和权重等信息。让我们拆解一下它的功能：\n\n循环开始使用 `for` 循环遍历 Assimp\
  \ 网格的骨骼。对于每个 `aiBone`，我们提取骨骼/关节的 `jointName` 并检查它是否存在于 `jointMap` 中。如果未找到关节，说明尚未遇到过它，会在\
  \ map 中创建一个新条目。提取的信息包括关节的索引和名称，以及它的偏移矩阵（称为“绑定姿态”或“逆绑定矩阵”），它代表了关节在其“绑定姿态”或“休息姿态”中的初始变换，即关节在模型原始未变形状态下的姿态。\n\
  \n关节初始化之后，我们继续设置顶点权重。它遍历与当前骨骼相关的权重，获取每个权重的顶点 ID 和权重。调用 `SetVertexJoint()` 函数，将关节索引和权重与网格中相应的顶点关联。最后，我们定义了一些类型，以简化与\
  \ `Animator` 类的交互。`Model3D` 类型从第一次创建模型起就已经存在了。借此，两个类都可以使用 PBR 着色器中相同的 `Draw()` 函数进行渲染。\n\
  \n### 更新着色器\n\n现在我们已经有了动画机制，但仍然无法使用它。请按照以下代码更新你的 PBR 顶点着色器。\n\n列表 7.7：`Resources/Shaders/pbr.glsl`\n\
  \n```glsl\nversion 330 core\nlayout (location = 0) in vec3 a_position;\nlayout (location\
  \ = 1) in vec3 a_normal;\nlayout (location = 2) in vec2 a_uvs;\nlayout (location\
  \ = 3) in vec3 a_tangent;\nlayout (location = 4) in vec3 a_bitangent;\nlayout (location\
  \ = 5) in vec4 a_joints;\nlayout (location = 6) in vec4 a_weights;\n\n#define MAX_WEIGHTS\
  \ 4\n#define MAX_JOINTS 100\n\nout Vertex {\n    vec3 Position;\n    vec3 Normal;\n\
  \    mat3 TBN;\n    vec2 UVs;\n} vertex;\n\nuniform mat4 u_model;\nuniform mat4\
  \ u_proj;\nuniform mat4 u_view;\n\nuniform mat4 u_joints[MAX_JOINTS];\nuniform bool\
  \ u_hasJoints;\n\nvoid main()\n{\n    mat4 transform = mat4(1.0);\n\n    if(u_hasJoints)\n\
  \    {\n        transform = mat4(0.0);\n        for(int i = 0; i < MAX_WEIGHTS &&\
  \ a_joints[i] > -1; i++)\n        {\n            transform += u_joints[a_joints[i]]\
  \ * a_weights[i];\n        }\n    }\n\n    transform = u_model * transform;\n  \
  \  vertex.UVs = a_uvs;\n    vertex.Normal = mat3(transform) * a_normal;\n    vertex.Position\
  \ = (transform * vec4(a_position, 1.0)).xyz;\n    vertex.TBN = mat3(transform) *\
  \ mat3(a_tangent, a_bitangent, a_normal);\n    gl_Position = u_proj * u_view * transform\
  \ * vec4(a_position, 1.0);\n}\n```\n\n// ... 片元着色器保持不变\n\n\n\n\n\n```cpp\nglUniform1i(u_HasJoints,\
  \ model->HasJoint());\n\n//  ...\n\n}\n\nEMPY_INLINE void SetJoints(std::vector<glm::mat4>&\
  \ transforms)\n{\n    for (size_t i = 0; i < transforms.size() && i < 100; ++i)\n\
  \    {\n        std::string uniform = \"u_joints[\" + std::to_string(i) + \"]\"\
  ;\n        uint32_t u_joint = glGetUniformLocation(m_ShaderID, uniform.c_str());\n\
  \        glUniformMatrix4fv(u_joint, 1, GL_FALSE, glm::value_ptr(transforms[i]));\n\
  \    }\n}\n\n//  ...\n\nprivate:\n\n    uint32_t u_HasJoints = 0u;\n//  ...\n}\n\
  ```\n\n### 更新渲染器类\n\n这个新添加的函数也必须添加到渲染器中，以便我们可以在渲染动画模型时在应用循环中调用它。\n\n| 列表 7.9: Graphics/Renderer.h\
  \ |\n\n```cpp\nstruct GraphicsRenderer\n{\n    EMPY_INLINE void SetJoints(std::vector<glm::mat4>&\
  \ transforms)\n    {\n        m_Pbr->SetJoints(transforms);\n    }\n\n    //  ...\n\
  }\n```\n\n### 动画器组件\n\n由于我们使用着色器中的相同函数来渲染所有模型，因此我们需要为动画器添加一个额外的组件。该组件是渲染过程中区分静态模型和骨骼模型的关键。\n\
  \n| 列表 7.10: Auxiliairies/ECS.h |\n\n```cpp\n// 模型动画器\nstruct AnimatorComponent\n\
  {\n    EMPY_INLINE AnimatorComponent(const AnimatorComponent&) = default;\n    EMPY_INLINE\
  \ AnimatorComponent() = default;\n    Animator3D Animator;\n};\n```\n\n该组件持有指向骨骼模型中动画器的指针。\n\
  \n### 显示动画\n\n我们现在准备好查看第一个动画了。打开你的 `Application.h` 头文件并添加以下代码：\n\n| 列表 7.11: Application/Application.h\
