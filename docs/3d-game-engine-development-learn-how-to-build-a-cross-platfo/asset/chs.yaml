  \n#### 列表 7.4:Graphics/Models/Animator.h\n\n```cpp\n#pragma once\n\n#include \"\
  Animation.h\"\n\nnamespace Empy\n{\n    struct Animator\n    {\n        EMPY_INLINE\
  \ auto& Animate(float deltaTime)\n        {\n            if(m_Sequence < m_Animations.size())\n\
  \            {\n                m_Time += m_Animations[m_Sequence].Speed * deltaTime;\n\
  \                m_Time = fmod(m_Time, m_Animations[m_Sequence].Duration);\n   \
  \             UpdateJoints(m_Root, glm::identity<glm::mat4>());\n            }\n\
  \            return m_Transforms;\n        }\n\n    private:\n        EMPY_INLINE\
  \ glm::mat4 Interpolate(const KeyFrame& prev, const KeyFrame& next, float progression)\n\
  \        {\n            return (glm::translate(glm::mat4(1.0f), glm::mix(prev.Position,\
  \ next.Position, progression)) *\n                    glm::toMat4(glm::normalize(glm::slerp(prev.Rotation,\
  \ next.Rotation, progression))) *\n                    glm::scale(glm::mat4(1.0f),\
  \ glm::mix(prev.Scale, next.Scale, progression)));\n        }\n\n        EMPY_INLINE\
  \ void GetPreviousNextFrames(Joint& joint, KeyFrame& prev, KeyFrame& next)\n   \
  \     {\n            for (uint32_t i = 1; i < joint.size(); i++)\n            {\n\
  \                if (m_Time < joint[i].TimeStamp)\n                {\n         \
  \           prev = joint[i-1];\n                    next = joint[i];\n         \
  \           return;\n                }\n            }\n        }\n\n        EMPY_INLINE\
  \ void UpdateJoints(Joint& joint, const glm::mat4& parentTransform)\n        {\n\
  \            KeyFrame prev, next;\n\n            // 获取上一帧和下一帧\n            GetPreviousNextFrames(joint,\
  \ prev, next);\n\n            // 计算插值因子\n            float progression = (m_Time\
  \ - prev.TimeStamp) / (next.TimeStamp - prev.TimeStamp);\n\n            // 计算骨骼的新变换\n\
  \            glm::mat4 transform = parentTransform * Interpolate(prev, next, progression);\n\
  \n            // 更新骨骼变换\n            m_Transforms[joint.Index] = (transform * m_GlobalTransform\
  \ * joint.Offset);\n\n            // 更新子骨骼\n            for (auto& child : joint.Children)\
  \ { UpdateJoints(child, transform); }\n        }\n\n    private:\n        std::vector<Animation>\
  \ m_Animations;\n        std::vector<glm::mat4> m_Transforms;\n        glm::mat4\
  \ m_GlobalTransform;\n        friend struct SkeletalModel; //-- 友元类\n        int32_t\
  \ m_Sequence = 0;\n        float m_Time = 0.0f;\n        Joint m_Root;\n    };\n\
  }\n```\n\n与预期的不同，动画器类的内容其实并不多。`Animate()` 函数接收一个 `deltaTime` 参数，代表自上一帧以来经过的时间。在函数内部，有一个条件检查以确保当前动画索引\
  \ `m_Sequence` 在可用动画的范围内。如果是，则根据动画的速度和流逝的时间更新动画时间 `m_Time`。最后，我们调用 `UpdateJoints()`\
  \ 并传入根骨骼和一个单位矩阵，以更新骨骼结构中所有骨骼的变换。该函数返回变换的引用，它将被发送给 PBR 渲染器。\n\n私有部分包含了额外的辅助函数。`Interpolate()`\
  \ 函数考虑平移、旋转和缩放，在两个关键帧之间计算插值矩阵。`GetPreviousNextFrames()` 函数确定给定骨骼在当前动画时间之前和之后的关键帧。`UpdateJoints()`\
  \ 函数根据当前动画时间、父级变换和插值因子递归地更新骨骼的变换。`m_GlobalTransform` 是一个矩阵，帮助我们将骨骼从相对于父级的局部变换转换为相对于根的全局变换。这种层级结构如图\
  \ 7.2 所示。注意看骨骼模型是 `animator` 类的友元，这确保了模型能够访问私有变量和函数。\n\n#### 7.2.4 加载动画 (Loading\
  \ Animation)\n\n为了将动画整合到我们的系统中，我们必须扩展模型加载过程以处理动画数据。坦率地说，用于模型的 `Assimp` 库非常通用，也可以处理动画信息。\n\
