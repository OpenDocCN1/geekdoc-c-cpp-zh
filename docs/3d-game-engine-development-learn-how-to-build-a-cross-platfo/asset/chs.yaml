  \n### 启动和更新脚本\n\n现在我们已经有了一些带有脚本组件的实体，我们需要确保我们实现的函数被相应地调用。以下每个函数都使用对带有脚本组件的实体的视图来调用两个函数：`OnStart()`\
  \ 和 `OnUpdate()`。此外，更新函数还接受时间时间（delta time）作为参数。\n\n| 列表 9.20: Application/Application.h\n\
  \n```cpp\n/* ... 与之前相同 ... */\n\n// 在启动时调用脚本实例\nEMPY_INLINE void StartScriptInstances()\n\
  {\n    EnttView<Entity, ScriptComponent>([this] (auto entity, auto& script)\n  \
  \  {\n        if(script.Instance)\n        {\n            script.Instance->OnStart();\n\
  \        }\n    });\n}\n\n// 在更新时调用脚本实例\nEMPY_INLINE void UpdateScriptInstances()\n\
  {\n    View<Entity, ScriptComponent>([this] (auto entity, auto& script)\n    {\n\
  \        if(script.Instance)\n        {\n            script.Instance->OnUpdate(m_Context->DeltaTime);\n\
  \        }\n    });\n}\n```\n*(注：原文中 UpdateScriptInstances 的代码片段似乎稍有错乱，此处已根据逻辑进行了翻译对齐)*\n\
  \n\n\n\n\n```cpp\n// 设置物理事件回调\n\nm_Context->Physics->SetEventCallback([this] (auto\
  \ e)\n{\n    // 如果实体无效，则不报告\n    if(!m_Context->Scene.valid(e.Entity1) ||\n    !m_Context->Scene.valid(e.Entity2))\n\
  \    { return; }\n\n    PostTask([this, e]\n    {\n        auto entity1 = ToEntt<Entity>(e.Entity1);\n\
  \        auto entity2 = ToEntt<Entity>(e.Entity2);\n\n        // 实体 1 调用脚本的 on-collision\n\
  \        if(entity1.template Has<ScriptComponent>())\n        {\n            entity1.template\
  \ Get<ScriptComponent>().\n            Instance->OnCollision(e.Entity2);\n     \
  \   }\n\n        // 实体 2 调用脚本的 on-collision\n        if(entity2.template Has<ScriptComponent>())\n\
  \        {\n            entity2.template Get<ScriptComponent>().\n            Instance->OnCollision(e.Entity1);\n\
  \        }\n    });\n});\n\n// 挂载窗口大小调整事件回调\nAttachCallback<WindowResizeEvent>([this]\
  \ (auto e)\n{\n    // 调整渲染器帧缓冲区\n    m_Context->Renderer->Resize(e.Width, e.Height);\n\
  \n    // 调用脚本的 resize 函数\n    EnttView<Entity, ScriptComponent>([e] (auto entity,\
  \ auto& script)\n    {\n        if(script.Instance)\n        {\n            script.Instance->OnResize(e.Width,\
  \ e.Height);\n        }\n    });\n});\n\n// 注册鼠标按下回调\nAttachCallback<MouseDownEvent>([this]\
  \ (auto e)\n{\n    // 调用脚本的鼠标按下回调\n    EnttView<Entity, ScriptComponent>([e] (auto\
  \ entity, auto& script)\n    {\n        if(script.Instance)\n        {\n       \
  \     script.Instance->OnMouseDown(e.Button);\n        }\n    });\n});\n// 注册按按下回调\n\
  AttachCallback<KeyPressEvent>([this] (auto e)\n{\n    // 调用脚本的按按下回调\n    EnttView<Entity,\
  \ ScriptComponent>([e] (auto entity, auto& script)\n    {\n        if(script.Instance)\n\
  \        {\n            script.Instance->OnKeyDown(e.Key);\n        }\n    });\n\
  });\n```\n\n你可以看到如何使用 `OnCollision()` 函数捕获碰撞事件并提供给脚本。我们首先检查实体是否包含脚本，并通过调用碰撞函数继续，该函数提供了参与碰撞的另一个实体的标识符。此外，我们添加了回调函数来处理按键和鼠标事件。\n\
  \n#### Listing 24: Root/EmpyScript/TestScript.lua\n```lua\n-- ...\n\n-- 当发生碰撞时调用\n\
  function TestScript.OnCollision(self, other)\n  print(\"collision:\", self.Entity,\
  \ \"->\", other)\n  self:Destroy(other);\nend\n\n-- 当鼠标按下时调用\nfunction TestScript.OnMouseDown(self,\
  \ button)\n  print(\"mousedown: \", button)\nend\n\n-- 当按键按下时调用\nfunction TestScript.OnKeyDown(self,\
  \ key)\n  print(\"keydown: \", key)\nend\n\n-- 当实体被销毁时调用\nfunction TestScript.OnDestroy(self)\n\
  \  print(\"destroyed:\", self.Entity)\nend\n```\n\n你可以将 `OnCollision()` 函数添加到你的脚本中，如代码所示，销毁参与碰撞的另一个实体。你还会看到额外的函数用于捕获按键和鼠标事件，以及在带有脚本的实体即将被销毁时调用的\
  \ `OnDestroy()` 函数。\n\n以下是在 \"TestScript.lua\" 文件中找到全部代码：\n\n#### Listing 25: Root/EmpyScript/TestScript.lua\n\
  ```lua\n-- 脚本初始化时调用一次\nfunction TestScript.OnStart(self)\n  self.Transform = self:Get(TRANSFORM)\n\
  \  print(\"script started!\")\nend\n\n-- 每帧更新\nfunction TestScript.OnUpdate(self,\
  \ dt)\n  -- 将实体向左移动\n  if Inputs.IsKey(Inputs.KEY_A) then\n    self:ApplyForce(Vec3.new(-100.0,\
  \ 0.0, 0.0));\n  end\n\n  -- 将实体向右移动\n  if Inputs.IsKey(Inputs.KEY_D) then\n   \
  \ self:ApplyForce(Vec3.new(100.0, 0.0, 0.0));\n  end\n\n  -- 每帧缩放对象\n  self.Transform.Scale.y\
  \ = self.Transform.Scale.y + dt;\nend\n\n-- 当窗口大小调整时调用\nfunction TestScript.OnResize(self,\
  \ width, height)\n  print(\"resize: \", width, height)\nend\n\n-- 当鼠标按下时调用\nfunction\
  \ TestScript.OnMouseDown(self, button)\n  print(\"mousedown: \", button)\nend\n\n\
  -- 当发生碰撞时调用\nfunction TestScript.OnCollision(self, other)\n  print(\"collision:\"\
  , self.Entity, \"->\", other)\n  self:Destroy(other);\nend\n\n-- 当按键按下时调用\nfunction\
  \ TestScript.OnKeyDown(self, key)\n  print(\"keydown: \", key)\nend\n\n-- 当实体被销毁时调用\n\
  function TestScript.OnDestroy(self)\n  print(\"destroyed:\", self.Entity)\nend\n\
  ```\n\n你应该尽情尝试这个框架，添加新功能并完善现有的功能。我们可以在此书中添加更多功能，但那对我们来说负担太重了。你已经拥有了基础来将其推向下一个水平。代码未正常？克隆\
  \ GitHub 上的 \"runtime-scripting\" 分支并在 Linux 上执行 \"Empy.sh\" 脚本。\n\n# 第 IV 部分资产与序列化\n\
  \n## 10 资产管理\n\n游戏引擎中的资产管理涉及游戏开发所需的数字资产的系统化组织、存储和操作。数字资产包括 3D 模型、纹理、音频文件和其他创建游戏的资源。资产管理的主要目标是在开发过程中高效地处理这些资源。在游戏中，资产通常以结构化的方式存储，并由数据库或文件系统跟踪其位置。这允许开发者无需人工干预即可将其引用并引入游戏中。\n\
  \n### 10.1 资产定义\n\n我们现在要在下面的头文件中创建每种资产类型。该文件定义了包含了所有类型的共用信息。\n\n#### Listing 10.1:\
  \ Auxiliaries/Assets.h\n```cpp\n#pragma once\n#include \"Scripts/Utilities.h\"\n\
  #include \"Physics/Utilities.h\"\n#include \"Graphics/Models/Model.h\"\n#include\
  \ \"Graphics/Textures/Texture.h\"\n\nnamespace Empy\n{\n  // 将 AssetID 类型定义为 64\
  \ 位无符号整数\n  using AssetID = uint64_t;\n  const AssetID EMPTY_ASSET = 0u;\n\n  //\
  \ 资产类型\n  enum class AssetType : uint8_t\n  {\n    UNKNOWN = 0,\n    MATERIAL,\n\
  \    TEXTURE,\n    SKYBOX,\n    SCRIPT,\n    SCENE,\n    MODEL,\n  };\n\n  // 定义基础\
  \ Asset 结构\n  struct Asset\n  {\n    // 生成唯一资产 ID\n    AssetID UID = EMPTY_ASSET;\n\
  \n    // 资产文件路径\n    std::string Source;\n\n    // 资产名称\n    std::string Name;\n\
  \n    // 资产类型\n    AssetType Type;\n  };\n}\n```\n\n后续所有的资产类型都将继承此结构以实现特定属性。你会注意到每个资产都应该有一个唯一的\
  \ 64 位标识符。这将用于通用标识资产。该标识符还将提供从运行时脚本与资产交互的接口。\n\n\n\n\n\n### 10.1.1 材质资产\n\n我们将创建的第一种材质是材质资产。该资产封装了存储材质信息所需的所有内容。\n\
  \n列表 10.2: Auxiliaries/Assets.h \n\n```cpp\nstruct MaterialAsset : Asset\n{\n  \
  \  AssetID RoughnessMap = EMPTY_ASSET;\n    AssetID OcclusionMap = EMPTY_ASSET;\n\
  \    AssetID MetallicMap = EMPTY_ASSET;\n    AssetID EmissiveMap = EMPTY_ASSET;\n\
  \    AssetID AlbedoMap = EMPTY_ASSET;\n    AssetID NormalMap = EMPTY_ASSET;\n\n\
  \    Material Data;\n};\n```\n\n你会注意到此资产是如何依赖其他资产的。由于材质具有纹理，我们必须提供一种方法来知道它是哪种纹理，而无需持有数据本身。我们还添加了一个成员\
  \ `Data`，它持有一个材质的实例。\n\n### 10.1.2 纹理资产\n\n下一种资产类型是纹理。下面的代码片段展示了它是如何定义的。\n\n列表 10.3:\
  \ Auxiliaries/Assets.h \n\n```cpp\nstruct TextureAsset : Asset\n{\n    bool IsHDR\
  \ = false;\n    bool FlipV = true;\n    Texture2D Data;\n};\n```\n\n### 10.1.3 天空盒资产\n\
  \n在这里，下一种资产类型是天空资产。下面的代码片段展示了它是如何定义的。\n\n列表 10.4: Auxiliaries/Assets.h \n\n```cpp\n\
  struct SkyboxAsset : Asset\n{\n    int32_t Size = 2048;\n    bool IsHDR = true;\n\
  \    bool FlipV = true;\n    Texture2D EnvMap;\n    Skybox Data;\n};\n```\n\n###\
  \ 10.1.4 模型、脚本、场景、资产\n\n遵循同样的趋势，我们可以像所示定义所有其他资产类型。\n\n列表 10.5: Auxiliaries/Assets.h\
  \ \n\n```cpp\nstruct ModelAsset : Asset\n{\n    bool HasJoints = false;\n    Model3D\
  \ Data;\n};\n\nstruct ScriptAsset : Asset\n{\n    /* ... */\n};\n\nstruct SceneAsset\
  \ : Asset\n{\n    /* ... */\n};\n\n// 自定义类型定义\nusing SharedAsset = std::shared_ptr<Asset>;\n\
  using AssetMap = std::unordered_map<AssetID, SharedAsset>;\n```\n\n你还应该注意帮助我们在注册表中与这些资产进行交互的类型定义。\n\
  \n### 10.2 资产注册表\n\n然后，我们需要创建一个资产注册表来管理这些不同的资产类型。资产注册表将帮助在被请求时加载、存储并提供这些资产。\n\n\
  #### 10.2.1 注册表类\n\n下面的代码片段（列表 10.6）描述了资产注册类实现的首次迭代。从成员变量部分开始，你会注意到资产都存储在一个嵌套的 map（map\
  \ of maps）中。使用 map 而不是连续容器（如 `std::vector`）的优势在于，如果我们要从 vector 中检索资产，我们可能需要搜索整个数组才能找到特定的资产。通过知道资产标识符，我们可以以更快的速度从\
  \ map 中检索值。\n\n列表 10.6: Auxiliaries/Assets.h \n\n```cpp\n// 用于管理资产添加和检索的资产注册表\n\
  struct AssetRegistry\n{\n    EMPY_INLINE AssetRegistry()\n    {\n        // 为每种类型添加默认资产\n\
  \        AddEmpty<MaterialAsset>();\n        AddEmpty<TextureAsset>();\n       \
  \ AddEmpty<SkyboxAsset>();\n        AddEmpty<ScriptAsset>();\n        AddEmpty<ModelAsset>();\n\
  \        AddEmpty<Scene>();\n    }\n\n    // 根据 uid 检索资产\n    template <typename\
  \ T>\n    EMPY_INLINE T& Get(AssetID uid)\n    {\n        uint32_t type = TypeID<T>();\n\
  \        if (m_Registry[type].count(uid))\n            return (T&)(m_Registry[type][uid]);\n\
  \        return (T&)(m_Registry[type][EMPTY_ASSET]);\n    }\n\n    // 帮助遍历所有资产\n\
  \    template <typename F>\n    EMPY_INLINE void View(F&& func)\n    {\n       \
  \ for (auto& [_, assetMap] : m_Registry)\n        {\n            for (auto& [uid,\
  \ asset] : assetMap)\n            {\n                if (uid != EMPTY_ASSET)\n \
  \               {\n                    func(asset.get());\n                }\n \
  \           }\n        }\n    }\n\n    // 返回资产集合\n    template <typename T>\n  \
  \  EMPY_INLINE auto& GetMap()\n    {\n        return m_Registry[TypeID<T>()];\n\
  \    }\n\n    EMPY_INLINE void Clear()\n    {\n        m_Registry.clear();\n   \
  \ }\n\nprivate:\n    // 向注册表添加新资产\n    template <typename T>\n    EMPY_INLINE void\
  \ Add(\n        AssetID uid,\n        const std::string& source,\n        std::shared_ptr<T>&\
  \ asset\n    )\n    {\n        asset->UID = uid;\n        asset->Source = source;\n\
  \        std::filesystem::path path(source);\n        asset->Name = path.stem().string();\n\
  \        m_Registry[TypeID<T>()][asset->UID] = asset;\n    }\n\n    template <typename\
  \ T>\n    EMPY_INLINE void AddEmpty()\n    {\n        m_Registry[TypeID<T>()][EMPTY_ASSET]\
  \ = std::make_shared<T>();\n    }\n\nprivate:\n    std::unordered_map<uint32_t,\
  \ AssetMap> m_Registry;\n};\n```\n\n为了确保我们不会检索空指针，我们为每种类型添加空资产。当 `Get()` 被带有资产标识符调用时，如果没有找到资产，注册表将返回空资产。`View()`\
  \ 函数如你可能所知，有助于遍历所有资产。\n\n#### 10.2.2 添加资产\n\n`Add()` 函数（列表 10.6 所示）接收一个实例并存储目标存储。资产的名称和文件路径源自\
  \ `source` 参数。让我们现在实现添加每种资产类型的函数。这将如下所示。\n\n列表 10.7: Auxiliaries/Assets.h \n\n```cpp\n\
