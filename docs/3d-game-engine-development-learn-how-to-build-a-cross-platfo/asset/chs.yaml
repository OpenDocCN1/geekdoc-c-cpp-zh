  \n![PIC](img/image_rsrc759.jpg)\n\n| 图 6.25：场景天空盒 |\n\n### 6.5.2 漫散辐照\n\n在 PBR 中，环境光照对于准确的材质渲染至关重要。IBL\
  \ 技术通常涉及使用 HDR 环境映射来捕捉来自真实环境的光照信息。这些映射包含了有关光照条件、反射和整体环境的信息，通过根据材质属性准确地表示光线与表面的相互作用，从而实现更真实的渲染。\n\
  \n漫散辐照描述了从所有方向到达表面单位面积的总光能。它是决定物体在间接光源照射下外观的关键因素。表面某一点的漫散辐照通常源于朗伯余弦定律。\n\n![PIC](img/image_rsrc7A)\n\
  \n| 朗伯余弦定律建立了理想漫反射表面的辐射强度与入射方向与表面法线之间角度的余弦值之间的直接关系。\n\n#### GLSL 色器代码\n\n为了将环境环境光应用到场景中的球体或任何其他物体，我们需要从之前创建的天盒立方体贴生成辐照图（irradiance\
  \ map）。该辐照图只是该立方体贴的一个卷积版本，或者简单来说，就是一个模糊版本。这在（图 6.23 in vec3 a_position;\n\nout vec3\
  \ world_position;\n\nuniform mat4 u_view;\nuniform mat4 u_proj;\n\nvoid main()\n\
  {\n    gl_Position = u_proj * u_view * vec4(a_position, 1.0f);\n    world_position\
  \ = a_position;\n}\n\n// Fragment\n#version 330 core\nout vec4 out_fragment;\nin\
  \ vec3 world_position;\n\n#define PI 3.14159265358979323846\n\nuniform samplerCube\
  \ u_cubemap;\n\nvoid main()\n{\n    vec3 N = normalize(world_position);\n    vec3\
  \ irradiance = vec3(0.0);\n\n    // irradiance\n}\n```\n\n\n\n\n\n```cpp\nvec3 up\
  \ = vec3(0.0, 1.0, 0.0);\nvec3 right = cross(up, N);\nup = cross(N, right);\n\n\
  int nrSamples = 0;\nfloat sampleDelta = 0.025;\n\nfor(float phi = 0.0; phi < 2.0\
  \ * PI; phi += sampleDelta)\n{\n    for(float theta = 0.0; theta < 0.5 * PI; theta\
  \ += sampleDelta)\n    {\n        // 球坐标到笛卡尔坐标（切线空间）\n        vec3 tangentSample\
  \ = vec3(sin(theta) * cos(phi), sin(theta) * sin(phi), cos(theta));\n\n        //\
  \ 切线空间到世界空间\n        vec3 sampleVec = tangentSample.x * right + tangentSample.y\
  \ * up + tangentSample.z * N;\n\n        // 计算照值\n        irradiance += texture(u_cubemap,\
  \ sampleVec).rgb * cos(theta) * sin(theta);\n\n        // 增加样本计数\n        nrSamples++;\n\
  \    }\n}\n\nirradiance = PI * irradiance * (1.0 / float(nrSamples));\nout_fragment\
  \ = vec4(irradiance, 1.0);\n```\n\n++FRAGMENT++\n\n这个着色器简单地生成天空盒立方体贴图的模糊版本。\n\n\
