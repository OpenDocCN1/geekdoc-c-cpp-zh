  \n| 列表 10.10: | Auxiliaries/ECS.h |\n\n```cpp\n#pragma once\n#include \"Assets.h\"\
  \n\n// 天空盒组件\nstruct SkyboxComponent\n{\n    EMPY_INLINE SkyboxComponent(const SkyboxComponent&)\
  \ = default;\n    EMPY_INLINE SkyboxComponent() = default;\n    AssetID Skybox =\
  \ EMPTY_ASSET;\n};\n\n// 脚本组件\nstruct ScriptComponent\n{\n    EMPY_INLINE ScriptComponent(const\
  \ ScriptComponent&) = default;\n    EMPY_INLINE ScriptComponent() = default;\n \
  \   AssetID Script = EMPTY_ASSET;\n    Lua Instance;\n};\n\n// 模型组件\nstruct ModelComponent\n\
  {\n    EMPY_INLINE ModelComponent(const ModelComponent&) = default;\n    EMPY_INLINE\
  \ ModelComponent() = default;\n    AssetID Material = EMPTY_ASSET;\n    AssetID\
  \ Model = EMPTY_ASSET;\n};\n\n// 通用组件\nstruct InfoComponent\n{\n    EMPY_INLINE\
  \ InfoComponent(const InfoComponent&) = default;\n    EMPY_INLINE InfoComponent()\
  \ = default;\n    AssetID Parent = EMPTY_ASSET;\n    std::string Name = \"Entity\"\
  ;\n    AssetID UID = RandomU64();\n};\n```\n\n你会注意到，所有使用资产的组件都持有资产标识符而不是数据本身。`InfoComponent`\
  \ 是所有实体的通用组件，这有助于封装关于实体的信息，例如它的名称和通用标识符，这些信息可以用于实体层级结构，换句话说，父子关系。\n\n每当一个带有 `ModelComponent`\
  \ 的实体被渲染时，我们必须先从 `AssetRegistry` 中检索资产数据才能进行。这看起来效率很低，但如果我们想要能够序列化游戏状态，这是我们必须采取的路径。我们现在必须回到应用程序，在组件使用之前添加代码。\n\
  \n### 10.4 更新流水线\n\n我们现在可以使用这些额外功能来更新应用程序渲染流水线。我们从加载资产并创建实体开始。\n\n#### 10.4.1 加载资产\n\
