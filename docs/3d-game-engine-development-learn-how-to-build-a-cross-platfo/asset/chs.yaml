  out vec4 out_fragment;\nin vec2 uv;\nconst float PI = 3.141592653589793238;\n\n\
  float RadicalInverseVdC(uint bits)\n{\n    bits = (bits << 16) | (bits >> 16);\n\
  \    bits = (bits & 0x55555555u) << 1 | (bits & 0xAAAAAAAA) >> 1;\n    bits = (bits\
  \ & 0x33333333u) << 2 | (bits & 0xCCCCCCCC) >> 2;\n    bits = (bits & 0x0F0F0F0Fu)\
  \ << 4 | (bits & 0xF0F0F0F0u) >> 4;\n    bits = (bits & 0x00FF00FFu) << 8 | (bits\
  \ & 0xFF00FF00u) >> 8;\n    return float(bits) * 2.32806436538963e-10; // 0x10000000\n\
  }\n\nvec2 Hammersley(uint i, uint N)\n{\n    return vec2(float(i)/float(N), RadicalInverseVdC(i));\n\
  }\n\nvec3 ImportanceSampleGGX(vec2 Xi, vec3 N, float roughness)\n{\n    float a\
  \ = roughness * roughness;\n    float phi = 2.0 * PI * Xi.x;\n    float cosTheta\
  \ = sqrt((1.0 - Xi.y) / (1.0 + (a - 1.0) * Xi.y));\n    float sinTheta = sqrt(1.0\
  \ - cosTheta * cosTheta);\n\n    // 从球面坐标到笛卡尔坐标 - 半程向量\n    vec3 H;\n    H.x = cos(phi)\
  \ * sinTheta;\n    H.y = sin(phi) * sinTheta;\n    H.z = cosTheta;\n\n    // 从切线空间\
  \ H 向量到世界空间采样向量\n    vec3 up = abs(N.z) < 0.999 ? vec3(0.0, 0.0, 1.0) : vec3(1.0,\
  \ 0.0, 0.0);\n    vec3 tangent = normalize(cross(up, N));\n    vec3 bitangent =\
  \ cross(N, tangent);\n\n    vec3 sampleVec = tangent * H.x + bitangent * H.y + N\
  \ * H.z;\n    return normalize(sampleVec);\n}\n\nfloat GeometrySchlickGGX(float\
  \ NdotV, float roughness)\n{\n    // 注意我们为 IBL 使用了不同的 k\n    float a = roughness;\n\
  \    float k = (a * a) / 2.0;\n\n    float nom = NdotV;\n    float denom = NdotV\
  \ * (1.0 - k) + k;\n\n    return nom / denom;\n}\n\nfloat GeometrySmith(vec3 N,\
