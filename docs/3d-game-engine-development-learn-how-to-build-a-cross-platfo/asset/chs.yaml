  );\n      u_NbrPointLight = glUniformLocation(m_ShaderID, \"u_nbrPointLight\");\n\
  \      u_NbrSpotLight = glUniformLocation(m_ShaderID, \"u_nbrSpotLight\");\n\n \
  \     /* ... 与之前相同 ... */\n    }\n\n    EMPY_INLINE void SetSpotLight(SpotLight&\
  \ light, Transform3D& transform, int32_t index)\n    {\n      std::string intensity\
  \ = \"u_spotLights[\" + std::to_string(index) + \"].Intensity\";\n      std::string\
  \ direction = \"u_spotLights[\" + std::to_string(index) + \"].Direction\";\n   \
