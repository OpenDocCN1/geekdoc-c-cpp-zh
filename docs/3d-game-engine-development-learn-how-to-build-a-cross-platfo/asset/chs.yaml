  \n[content]\n此代码段使用 \"spdlog\" 库定义了一个日志系统。它创建了一个名为 `Logger` 的单例结构，用于管理 `spdlog::logger`\
  \ 类的共享实例。日志级别被设置为 `trace`，并使用以下参数定义了自定义日志格式：`time`（时间）、`thread-id`（线程 ID）和 `message`（消息）。\"\
  spdlog\" 的优点在于它可以根据不同的级别使用不同的颜色打印消息。\n\n我们还包含了日志宏，如 `EMPY_TRACE` 或 `EMPY_DEBUG`，它们利用\
  \ `logger` 处理各种日志级别（`trace`、`debug`、`info`、`warn`、`error`、`critical`）。这些宏允许开发者轻松地记录不同严重程度的日志。如果没有定义\
  \ `EMPY_ENABLE_LOG`，这些宏将被定义为空，从而确保在不需要时有效禁用日志消息。例如在 Release 构建中。你可能记得当用 debug 配置构建项目时，在根目录的\
  \ `CMakeLists.txt` 文件定义的 `EMPY_ENABLE_LOG`。\n\n你可能已经注意到 logger 结构体的名称前带有 `EMPY_API`\
  \ 符号，这表示我们打算导出它。值得注意的是，对于在头文件中定义的类或函数，这种导出指令并不是严格必要的，因为它们已经可以通过包含头文件来访问。\n\n###\
