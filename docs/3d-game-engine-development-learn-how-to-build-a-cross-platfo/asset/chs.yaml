  \n![图片](img/image_rsrc76S.jpg)\n\n# 第 V 部分 编辑器界面\n\n## 12 场景编辑器\n\n编辑器提供了一套强大的工具集，允许开发者高效构建游戏环境。\n\
  \n![图片](img/image_rsrc76T.jpg)\n\n| 图 12.1: | 编辑器组件 |\n\nInspector 面扮演着至关重要的作用，对所选对象进行详细控制。此外，Asset\
  \ Browser 简化了资源的导入和管理，确保图形、音频和其他元素的无缝集成。属性和脚本可以在此处进行精细调整。见图 12.1\n\n### 12.1 集成\
  \ ImGui\n\nImGui（Dear ImGui）即时模式图形界面是一个轻量且强大的库，专为游戏开发设计。它遵循立即模式模式，允许开发者直接创建 UI。\n\
  \n#### 12.1.1 如何使用 ImGui\n\n以下是集成 ImGui 的步骤：\n\n* 下载 ImGui：第一步是获取该库。\n* 将 ImGui\
  \ 引入项目：下一步是拷贝源代码和头文件。\n* 初始化 ImGui：在你的应用程序中设置上下文。\n* 创建 ImGui 帧：然后，我们可以使用 `NewFrame()`\
  \ 创建帧。\n* 添加 UI 元素：使用 ImGui 函数添加各种 UI 元素。例如，使用 `Begin()` 创建窗口并添加按钮。\n* 渲染 ImGui：添加\
  \ UI 元素后，使用 `Render()` 结束帧。\n* 渲染 ImGui 绘制列表：最后，我们可以通过我们的图形 API（OpenGL、DirectX 等）渲染绘制列表以显示\
  \ UI。\n\n这是一个简单的代码片段：\n\n```cpp\n#include \"imgui.h\"\n\nint main()\n{\n  // 初始化\
  \ ImGui\n  ImGui::CreateContext();\n  ImGuiIO& io = ImGui::GetIO();\n\n  // 设置其他配置选项，例如渲染后端\n\
  \n  while (应用程序的主循环条件)\n  {\n    // 开始一个新的 ImGui 帧\n    ImGui::NewFrame();\n\n \
  \   // 开启 UI 窗口\n    ImGui::Begin(\"My Window\");\n    {\n      if (ImGui::Button(\"\
  Click Me\"))\n        // 处理按钮点击逻辑\n    }\n    // 结束窗口 UI 元素\n    ImGui::End();\n\
  \n    // 显示 imgui 的演示窗口\n    ImGui::ShowDemoWindow();\n  }\n}\n```\n\n\n\n\n\n```cpp\n\
  //  渲染 ImGui 画数据\n\nImGui::Render();\n\n// 使用 OpenGL 渲染 ImGui 画列表\n\n// 更新并渲染应用程序\n\
  }\n\n// 清理 imgui 上\nImGui::DestroyContext();\n\nreturn 0;\n}\n```\n\n让我们按照步骤将 ImGui\
  \ 集成到我们的游戏编辑器中。\n\n## 扩展项目树\n\n根据(图 12.3)所示的结构扩展你的项目目录树。注意包含“Vendors”文件夹，它用于存放并非源自我们项目的外部代码。`imgui`\
  \ 文件夹留用于托管 ImGui 的所有源文件。此外，头文件 `FA.h` 用于包含 Font Awesome 图标的定义。\n\n![[Picture]](image_rsrc76V.jpg)\n\
  \n| 图 12.3: | 编辑器目录 |\n\nFont Awesome Team 是一个流行且全面的图标集和工具包，为 Web 开发和图形设计设计。它提供了一系列可扩展矢量图标，这些图标可以自定义并轻松地集成到网站、应用程序和各种数字项目中。GitHub\
  \ 仓库 `IconFontCppHeaders` Foucaut 等人提供了 C++ 头文件，用于将 Font Awesome 与 ImGui 结合。\n\n\
  ## 下载 Dear ImGui\n\n在 C++ 项目中引入 ImGui 时，有两种主要方法：直接将 ImGui 源文件整合到项目中，或使用如 `Conan`\
  \ 或 `vcpkg` 等包管理器。对于我们的项目，我们选择了前者方法。ImGui 促进了各种图形 API（OpenGL, SDL2, DirectX 等）的使用，允许我们选择首选的后端。遗憾的是，`Conan`\
  \ 没有为选择所需的后端 API 提供直接解决方案，这使得直接包含 ImGui 源文件对于我们特定的项目需求来说是一个更务实的选择。\n\n通过以下链接从 GitHub\
  \ 下载 ImGui：[`github.com/ocornut/imgui`](https://github.com/ocornut/imgui)。确保在下载过程中选择了\
  \ `docking` 分支，因为该分支专门包含了对窗口停靠的支持。请参见(图 12.4)。\n\n![PIC](img/image_rsrc76W.jpg)\n\
  \n| 图 12.4: | 下载 ImGui |\n\n解压并复制刚下载的 ImGui 目录根级别下的所有头文件和源文件(图 12.5)。将它们全部粘贴到项目树中的\
  \ `imgui` 文件夹中。\n\n![PIC](img/image_rsrc76X.jpg)\n| 图 12.5: | ImGui 根目录 |\n\n复制“backend”文件夹中的\
  \ OpenGL 后端文件并将它们也粘贴到 `imgui` 文件夹中。(图 12.6)是你的 ImGui 文件夹应该看起来。\n\n![[Picture]](image_rsrc76Y.jpg)\n\
  | 图 12.6: | ImGui 目录 |\n\n值得注意的是，ImGui 附带了一个全面的演示文件 `imgui_demo.cpp`，展示了该库的能力并对其功能提供了交互式探索。如(列表\
  \ 12.1)所示，你可以使用 `ImGui::ShowDemoWindow()` 函数显示它。该演示对用户来说是一个无价的资源，提供了通过实践体验来理解 ImGui\
  \ 提供的各种 UI 元素、自定义选项和功能。\n\n## 添加 Font Awesome\n\n如前所述，我们将使用 Font Awesome 来让我们的 UI\
  \ 看起来更专业。因此，我们需要从此链接下载 Font Awesome 头文件：[`github.com/juliettef/IconFontCppHeaders`](https://github.com/juliettef/IconFontCppHeaders)。你可以复制名为\
  \ `IconsFontAwesome6.h` 的头文件内容并将其内容粘贴到你的 `FA.h` 头文件中。\n\n记住，这些文件可以在我们 GitHub 仓库提供的源代码中找到。所以如果你不想处理所有这些依赖项，可以直接下载提供的代码。\n\
