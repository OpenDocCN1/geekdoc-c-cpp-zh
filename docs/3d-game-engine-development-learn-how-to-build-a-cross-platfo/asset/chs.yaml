  \ <typename T>\n    EMPY_INLINE constexpr uint32_t TypeID()\n    {\n        return\
  \ static_cast<uint32_t>(reinterpret_cast<std::uintptr_t>(&typeid(T)));\n    }\n\
  }\n\n// free allocated memory\n#define EMPY_DELETE(ptr) if (ptr != nullptr) { delete\
  \ (ptr); ptr = nullptr; }\n```\n\n`TypeID()` 模板函数允许我们在调用它时为提供的任何类型获取唯一标识符，这对于许多任务（例如基于类型的分发）非常有帮助。这将帮助我们稍后识别应用程序中不同类型的事件。`EMPY_DELETE`\
  \ 宏通过删除动态分配的对象并将相应的指针置为 `nullptr` 来确保安全的内存管理，防止内存泄漏。\n\n`Core.h` 头文件的完整代码展示在（列表\
