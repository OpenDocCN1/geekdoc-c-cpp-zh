  \n![Picture## 9. 运行时脚本你一定会喜欢你所工作的内容——你会感到快乐，一切都会进展顺利。游戏引擎中的`运行时脚本`涉及在游戏实际运行期间执行脚本或代码。这允许对游戏行为进行动态和即时的更改。在游戏引擎的语文中，`C#`、`Lua`\
  \ 或 `Python` 等脚本语言通常用于此目的。`运行时脚本`的主要优势在于其在不中断游戏的情况下修改游戏逻辑的灵活性。游戏开发者可以在不需要完全重新编译的情况下实现功能、调整参数，甚至修复错误。9.1\
  \ 描述了运行时脚本的一种通用方法。![PIC](img/image_rsrc76K.jpg)\n| 图 9.1: | 从脚本到行为 |\n\n在 Unreal\
  \ Engine 和 Unity 中，运行时脚本通过集成脚本语言和使用各自的 API 实现。Unreal Engine 使用 `Blueprints`（蓝图）作为一种视觉脚本语言，允许开发者通过基于节点的系统创建游戏元素，使设计师和艺术家也能轻松上手。对于\
  \ Unreal Engine 中更传统的编码，`C++` 是首选语言。开发者可以使用 `C++` 编写游戏逻辑，Unreal Engine 提供了一个健壮的\
  \ API 来与引擎系统交互。在 Unity 中，使用的脚本语言是 `C#`。Unity 允许开发者将脚本附加到对象上，定义它们在运行时的行为。Unity 中的\
  \ `MonoBehaviour` 类提供了基本函数，如 `Start()` 和 `Update()`，它们在游戏执行期间的特定点执行。两个引擎都支持热重载，允许开发者无需重启整个游戏即可立即更改脚本。这有助于快速迭代和实验。\n\
  \n### 9.1 使用 Lua 编写脚本\n\n`Lua` [#part0026.xhtml_a6S2] 是一种轻量级、高级脚本语言，为嵌入式系统和通用编程设计。`Lua`\
  \  20 世纪 90 年代在巴西开发，优先考虑简单、高效和扩展性。它的名字 \"Lua\" 在葡萄牙语中意为“月亮”，强调了它的体积小和多功能性。它主要作为各种应用程序的脚本语言而闻名，`Lua`\
  \ 在游戏行业得到了广泛采用，特别是在 Unreal Engine 和 Unity 等游戏引擎中。它的语法清晰且直观，类似于 `C` 和 `Python` 的混合，使得不同编程背景的开发者都能轻松掌握。`Lua`\
  \ 的关键特性包括一种名为 `tables`（表）的强大且灵活的数据描述、一等函数以及通过垃圾回收实现的自动内存管理。它缺乏大型语言中的某些复杂功能，但通过极简主义的设计予以补偿，允许轻松地集成到现有系统中。\n\
  \n#### 9.1.1 集成 Lua 依赖\n\n我们没有为将 `Lua` 集成到我们的引擎开发自定义 API，而是选择使用一个已存在且良好的名为 \"SOL\"\
  \ 的库。你可以在这里找到在线文档的链接：ThePhD。`Sol2` 通过提供一个 `C++` 封装器简化将 `Lua` 脚本集成到 `C++` 基础中可以使用\
  \ `Lua` 脚本。它充当 `C++` 和 `Lua` 之间的桥梁，提供了一个友好的接口来调用 `Lua` 函数、操作 `Lua` 对象并在 `C++` 程序中处理\
  \ `Lua` 变量。`Sol2` 的核心概念在于它能够将 `C++` 函数和类无缝绑定到 `Lua` 脚本中。开发者可以将 `C++` 函数暴露给 `Lua`，允许\
  \ `Lua` 脚本与之交互并使用 `C++` 功能。这种双向通信允许将 `Lua` 脚本用于游戏逻辑、人工智能或其他基于 `C++` 的应用程序中的动态行为。\n\
  \n你可以从以下代码看到将 \"Lua\" 和 \"SOL\" 添加到 Conan 要求列表中这两个库都是头文件库。\n\n```ini\n# Listing\
  \ 9.1: Root/conanfile.txt\n[requires]\nglm/cci20230113\nstb/cci20230920\nopengl/system\n\
  spdlog/1.12.0\nassimp/5.2.2\nentt/3.12.2\nphysx/4.1.1\nglfw/3.3.8\nglew/2.2.0\n\
  sol2/3.3.1\nlua/5.4.6\n\n[generators]\ncmake\n\n[options]\nphysx:shared=True\nglew:shared=False\n\
  glfw:shared=False\nassimp:shared=False\n```\n\n#### 9.1.2 初始化与配置\n\n为了项目中初始化 `Lua`\
  \ 和 `SOL`，我们需要创建一些额外的文件和文件夹以保持代码的整洁和有序。将图 9.2 所示的文件和文件夹添加到你的项目树中。你也可以像列表 9.2 所示在你的项目中包含\
  \ `Lua` 和 `SOL`。\n\n![Picture\n| 图 9.2: | 物理目录 |\n\n```cpp\n// Listing 9.2: Scripts/Helpers.h\n\
  #pragma once\nextern \"C\"\n{\n    #include \"lua.h\"\n    #include \"lualib.h\"\
  \n    #include \"lauxlib.h\"\n}\n\n// include sol\n#include <sol/sol.hpp>\n```\n\
  \n\n\n\n```cpp\n#include \"Common/Core.h\"\n```\n\n在 C++ 程序中包含 C 库的头文件时，必须使用 `\"\
  extern \"C\"`。它通知编译器对包含的代码块使用 C 风格的链接，以防止 C++ 符号修饰（name-mangling）。`EmpyScript` 文件夹是我们实现所有\
  \ Lua 脚本存放的地方。`Core.lua` 和 `Input.lua` 将帮助我们为所有脚本定义基础。`TestScript.lua` 将是第一个测试脚本上下文中所有特性的脚本。\n\
  \n### 9.1.3 脚本句柄 (Script Handle)\n\n(列表 9.3) 中的代码定义了一个名为 `Script` 的结构体。该结构体代表脚本句柄，并包含了处理事件的方法，如窗口大小调整、鼠标交互、碰撞、按键、更新、实体销毁和脚本初始化。它利用\
  \ Lua 表 (`sol::table`）来封装 Lua 与我们引擎之间的接口。`sol::table` 类型表示 Lua 表，它是 Lua 中用于存储键值对的基础数据结构。\n\
  \n| 列表 9.3: | Scripts/Utilities.h |\n\n```cpp\n#pragma once\n\n#include \"Helpers.h\"\
  \n\nnamespace Empy\n{\n    struct Script\n    {\n        // 脚本句柄构造函数\n        EMPY_INLINE\
  \ Script(sol::table handle, const std::string& name):\n            m_Handle(handle),\
  \ m_Name(name)\n        {}\n\n        // 窗口调整事件回调\n        EMPY_INLINE void OnResize(int32_t\
  \ width, int32_t height)\n        {\n            if(m_Handle.valid())\n        \
  \    {\n                m_Handle\"OnResize\";\n            }\n        }\n\n    \
  \    // 鼠标按下事件回调\n        EMPY_INLINE void OnMouseDown(int32_t button)\n       \
  \ {\n            if(m_Handle.valid())\n            {\n                m_Handle\"\
  OnMouseDown\";\n            }\n        }\n\n        // 刚体碰撞回调\n        EMPY_INLINE\
  \ void OnCollision(EntityID other)\n        {\n            if(m_Handle.valid())\n\
  \            {\n                m_Handle\"OnCollision\";\n            }\n      \
  \  }\n\n        // 键按下事件回调\n        EMPY_INLINE void OnKeyDown(int32_t key)\n  \
  \      {\n            if(m_Handle.valid())\n            {\n                m_Handle\"\
  OnKeyDown\";\n            }\n        }\n\n        // 更新脚本回调\n        EMPY_INLINE\
  \ void OnUpdate(float dt)\n        {\n            if(m_Handle.valid())\n       \
  \     {\n                m_Handle\"OnUpdate\";\n            }\n        }\n\n   \
  \     // 销毁实体回调\n        EMPY_INLINE void OnDestroy()\n        {\n            if(m_Handle.valid())\n\
  \            {\n                m_Handle\"OnDestroy\";\n            }\n        }\n\
  \n        // 启动脚本回调\n        EMPY_INLINE void OnStart()\n        {\n           \
  \ if(m_Handle.valid())\n            {\n                m_Handle\"OnStart\";\n  \
  \          }\n        }\n\n        // 返回脚本名称\n        EMPY_INLINE const std::string&\
  \ Name()\n        {\n            return m_Name;\n        }\n\n        // 检查是否有效\n\
  \        EMPY_INLINE bool Valid()\n        {\n            return m_Handle.valid();\n\
  \        }\n\n    private:\n        friend struct ScriptContext;\n        sol::table\
  \ m_Handle;\n        std::string m_Name;\n    };\n\n    using LuaScript = std::unique_ptr<Script>;\n\
  }\n```\n\n在脚本函数中，句柄 `m_Handle` 也被作为参数传递，以便 Lua 脚本能够访问其内部的脚本实例以进行后续操作。稍后会详细介绍这一点。我们额外定义了一个类型\
  \ `LuaScript`，用于封装指向脚本的唯一指针。`OnCollision()` 函数提供了参与接触的另一个实体的标识符。这在射击游戏中非常重要，因为在那里你可能想要对该实体施加伤害，或者将其销毁。\n\
  \n### 9.1.4 脚本上下文 (Script Context)\n\n下文（列表 9.4）是脚本上下文类的代码，它将通过提供加载、创建实例、挂载到实体等函数来帮助我们处理脚本。如你所示，它的函数尚未实现。让我们来看每个函数的实现情况。\n\
  \n| 列表 9.4: | Scripts/Context.h |\n\n```cpp\n#pragma once\n#include \"Window/Window.h\"\
  \n#include \"Auxiliaries/ECS.h\"\n\nnamespace Empy\n{\n    struct ScriptContext\n\
  \    {\n        EMPY_INLINE ScriptContext(EntityRegistry* scene, AppWindow* window)\n\
  \        {*/}\n\n        // 创建现有脚本的实例\n        EMPY_INLINE bool AttachScript(Entity&\
  \ entity, const std::string& name)\n        {*/}\n\n        // 将脚本加载到 lua 状态\n \
  \       EMPY_INLINE std::string LoadScript(const std::string& filepath)\n      \
  \  {*/}\n\n        private:\n            EMPY_INLINE void SetApiFunctions(EntityRegistry*\
  \ scene, AppWindow* window)\n            {*/}\n\n        private:\n            sol::state\
  \ m_Lua;\n    };\n}\n```\n\n### 上下文 (Context)\n\n构造函数帮助我们初始化脚本中的重要内容。`open_libraries()`\
  \ 函数用于导入基础。随后，我们将 `Input.lua` 和 `Core.lua` 两个脚本加载到 Lua 状态。这确保了创建脚本所需的一切。\n\n| 列表\
  \ 9.5: | Scripts/Context.h |\n\n```cpp\n/* ... same as before */\n\nEMPY_INLINE\
  \ ScriptContext(EntityRegistry* scene, AppWindow* window)\n{\n    //  lua 库\n  \
  \  m_Lua.open_libraries(sol::base);\n\n    // 加载 empy 模块\n    m_Lua.require_file(\"\
  Inputs\", \"Resources/Scripts/Empy/Input.lua\");\n    m_Lua.require_file(\"Core\"\
  , \"Resources/Scripts/Empy/Core.lua\");\n\n    // 运行时类型\n    m_Lua[\"TRANSFORM\"\
  ] = TypeID<TransformComponent>();\n\n    // 添加变换数据类型\n    m_Lua.new_usertype<Transform3D>(\"\
  Transform3D\",\n        \"Translate\", &Transform3D::Translate,\n        \"Rotation\"\
  , &Transform3D::Rotation,\n        \"Scale\", &Transform3D::Scale\n    );\n\n  \
  \  // 添加 vec3 数据类型\n    m_Lua.new_usertype<glm::vec3>(\"Vec3\",\n        sol::constructors<glm::vec3(),\
  \ glm::vec3(float, float, float)>(),\n        \"x\", &glm::vec3::x,\n        \"\
  y\", &glm::vec3::y,\n        \"z\", &glm::vec3::z\n    );\n\n    // 注册窗口输入回调\n \
  \   SetApiFunctions(scene, window);\n}\n```\n\n后续代码定义了 `Transform` 和 `Vec3` 用户类型。这使得能够像在\
  \ C++ 中一样在 Lua 中使用变换和向量类型。最后，`SetApiFunctions()` 函数帮助我们定义所有允许从 Lua 交互的函数。\n\n###\
  \ 加载脚本 (Loading the Script)\n\n为了在引擎中执行脚本代码，首先需要在脚本上下文中加载它。这是通过 `LoadScript()` 函数实现的。该函数返回脚本的名称，以便创建脚本的实例。\n\
  \n| 列表 9.6: | Scripts/Context.h |\n\n```cpp\n/* ... same as before */\n\nstd::string\
  \ LoadScript(const std::string& filepath)\n{\n    auto Initializer = m_Lua[\"Initializer\"\
  ];\n\n    // 检查模块是否已加载\n    if(!Initializer.valid())\n```\n\n\n\n\n\n```cpp\n{\n\
  \    EMPY_ERROR(\"failed  to  load  script!  core  not  initialized!\");\n    return\
  \ \"\";\n}\n\n// check if script file exits\nstd::filesystem::path path(filepath);\n\
  if(!std::filesystem::exists(path))\n{\n    EMPY_ERROR(\"failed  to  load  script!\
  \  invalid  file  path\");\n    return \"\";\n}\n\n// create script class handle\n\
  auto scriptName = path.stem().string();\nm_Lua[scriptName] = Initializer();\nm_Lua.script_file(filepath);\n\
  return scriptName;\n}\n```\n\n### 脚本加载与初始化\n\n该函数首先从 Lua 状态中收集一个名为 `Initialiazer`\
  \ 的对象。它是在构造函数中加载 `\"Core.lua\"` 文件时添加的。我们稍后会看到。这个对象仅仅是一个函数，它通过在 Lua 状态中创建一个代表它的\
  \ `\"class\"` 来初始化脚本，以便在每次需要创建新的脚本实例时都能进行实例化。我们使用 `std::filesystem` 来获取文件名，该文件名也应该与文件中用于脚本类型的类型名称相同。这不是\
  \ Lua 的要求，而是我们引擎的要求。每个脚本文件名也必须是脚本代码中使用的类名。稍后会详细介绍。通过使用函数 `script_file()`，我们能够将脚本代码加载到我们的\
  \ Lua 状态中。\n\n### 脚本 API 函数\n\n如之前提到的，我们需要能够从 Lua 与引擎进行交互。这为了获取、更新或销毁对象。这意味着我们需要实现一些\
  \ API 函数来处理这些工作。这是在 `SetApiFunctions()` 函数中完成的。下面添加的函数名为：`ApiGetTransform()`、`ApiMouseDown()`、`ApiApplyForce()`、`ApiKeyDown()`\
  \ 和 `ApiDestroy()`。这些函数的功能可以从它们的名称轻松推断出来。\n\n| Listing 9.7: Scripts/Context.h |\n\
  \n```cpp\n/*  ...  same as before ...  */\n\n// registers functions to interact\
  \ with entity\nEMPY_INLINE void SetApiFunctions(EntityRegistry* scene, AppWindow*\
  \ window)\n{\n    // api function to get entity transform\n    m_Lua.set_function(\"\
  ApiGetTransform\", [this, scene] (EntityID entity)\n    {\n        return std::ref(scene->get<TransformComponent>(entity).Transform);\n\
  \    });\n\n    // api function to check if mouse down\n    m_Lua.set_function(\"\
  ApiMouseDown\", [this, window] (int32_t button)\n    {\n        return window->IsMouse(button);\n\
  \    });\n\n    // api function to apply force on actor\n    m_Lua.set_function(\"\
  ApiApplyForce\", [this, scene]\n    (EntityID entity, const glm::vec3& force)\n\
  \    {\n        // return reference to transform\n        if(scene->all_of<RigidBodyComponent>(entity))\n\
  \        {\n            auto& body = scene->get<RigidBodyComponent>(entity).RigidBody;\n\
  \            if(body.Type == body.DYNAMIC)\n            {\n                auto\
  \ actor = static_cast<PxRigidDynamic*>(body.Actor);\n                actor->addForce(ToVec3(force),\
  \ PxForceMode::eACCELER);\n                return true;\n            }\n       \
  \     EMPY_ERROR(\"trying  apply  force  to  static  body!\");\n            return\
  \ false;\n        }\n        EMPY_ERROR(\"trying  apply  force  to  non  physics\
  \  entity!\");\n        return false;\n    });\n    // api function to check if\
  \ key pressed\n    m_Lua.set_function(\"ApiKeyDown\", [this, window] (int2_t key)\n\
  \    {\n        return window->IsKey(key);\n    });\n\n    // api function to destroy\
  \ entity\n    m_Lua.set_function(\"ApiDestroy\", [this, scene] (EntityID entity)\n\
  \    {\n        // return if entity is dead\n        if(scene->valid(entity) ==\
  \ false) { return; }\n\n        // entity has rigidbody component\n        if(scene->all_of<RigidBodyComponent>(entity))\n\
  \        {\n            // destroy actor user data\n            auto& body = scene->get<RigidBodyComponent>(entity).RigidBody;\n\
  \            auto userData = static_cast<EntityID*>(body->Actor->userData);\n  \
  \          body.Actor->release();\n            EMPY_DELETE(userData);\n        }\n\
  \n        // destroy collider material & shape\n        if(scene->all_of<ColliderComponent>(entity))\n\
  \        {\n            // destroy actor user data\n            auto& collider =\
  \ scene->get<ColliderComponent>(entity).Collider;\n            collider.Material->release();\n\
  \            collider.Shape->release();\n        }\n\n        // entity has script\
  \ component\n        if(scene->all_of<ScriptComponent>(entity))\n        {\n   \
  \         // call on destroy function\n            scene->get<ScriptComponent>(entity).Instance->OnDestroy();\n\
  \        }\n\n        // destroy entity\n        scene->destroy(entity);\n    });\n\
  }\n```\n\n#### 将脚本附加到实体\n\n下一步涉及将脚本挂载到实体，以便在主循环中引用它。以下是其实现。\n\n| Listing 9.8: Scripts/Context.h\
  \ |\n\n```cpp\n/*  ...  same as before ...  */\n\n// creates instance\nEMPY_INLINE\
  \ bool AttachScript(Entity& entity, const std::string& name)\n{\n    // check if\
  \ handle is correct and has a constructor\n    if (!m_Lua[name].valid() && !m_Lua[\"\
  Constructor\"].valid())\n    {\n        EMPY_ERROR(\"failed  to  create  script:\
  \  invalid  name!\");\n        return false;\n    }\n\n    // create instance\n\
  \    auto object = m_Lua\"Constructor\");\n\n    // check if obj is valid\n    if\
  \ (!object.valid())\n    {\n        // handle failure\n        sol::error error\
  \ = object;\n        sol::call_status status = object.status();\n        EMPY_ERROR(\"\
  failed  to  create  script: {}\", error.what());\n        return false;\n    }\n\
  \n    entity.Attach<ScriptComponent>().Instance = std::make_unique<Script>(object,\
  \ name);\n    return true;\n}\n```\n\n这很重要，因为我们需要知道是谁拥有该特定类型的实例。这类似于我们在 PhysX 中将实体标识符作为刚体\
  \ Actor 的用户数据时。该函数继续检查脚本实例是否正确创建，并从中创建一个唯一指针句柄，通过脚本组件附加到实体。\n\n以下是脚本组件的代码：\n\n|\
  \ Listing 9.9: Auxiliaries/ECS.h |\n\n```cpp\n/*  ...  same as before ...  */\n\n\
  // include script utilities\n#include \"Scripts/Utilities.h\"\n\n// script component\
  \ type\nstruct ScriptComponent\n{\n    EMPY_INLINE ScriptComponent(const ScriptComponent&)\
  \ = default;\n    EMPY_INLINE ScriptComponent() = default;\n    LuaScript Instance;\n\
  };\n```\n\n\n\n\nLua 的语法简洁而强大。它提供了适用于各种应用程序的特性。在 Lua 中，程序被组织成块，该语言采用动态类型，允许变量在运行期间更改类型。Lua\
  \ 使用简单且灵活的语法，强调可读性和易用性。语句以分号结束，但分号通常是可选的。代码块由关键字 \"if\"、else\"、\"while\" 和 \"for\"\
  \ 标识，并且对缩进不敏感，这使得 Lua 在格式方面具有很包容性。注释可以是单行注释（使用“–”）也可以是多行注释（用“–[[ ]]”包围）。\n\n| Listing\
  \ 9.10: | Lua 语法 |\n\n```lua\n--  单行注释\n\n--[[  多行注释  ]]\n\nlocal x = 10      --\
  \  变量声明\n\nif x > 5 then     --  条件语句\n    print(\"x is greater than 5\")\nelse\n\
  \    print(\"x is less than or equal to 5\")\nend\n```\n\n### 数据类型\n\nLua 是动态类型的，这意味着变量没有预定义的类型，在执行期间可以持有不同类型的值。Lua\
  \ 中的基本数据类型包括 nil、boolean、number、string、function 和 table。Table 是 Lua 中的一种基础数据结构，作为数组、字典或两者的结合。\n\
  \n| Listing 9.11: | Lua 数据类型 |\n\n```lua\nlocal nilValue = nil        --  Nil 类型\n\
  local boolValue = true      --  布尔类型\nlocal intValue = 42         --  数字类型\nlocal\
  \ stringValue = \"Hello\"  --  字符串类型\nlocal functionValue = function() print(\"\
  Function\") end  --  函数类型\nlocal tableValue = {1, 2, 3}  --  table 类型\n```\n\n###\
  \ 函数\n\n函数在 Lua 中起着至关重要的作用，它们是语言中的一等公民。函数可以赋值给变量，作为参数传递给其他函数并作为返回值返回。还支持被称为“闭包”的匿名函数。Lua\
  \ 支持函数返回多个返回值，这增强了它的表达力和灵活性。\n\n| Listing 9.12: | Lua 函数 |\n\n```lua\n--  命名函数\n\
  function add(a, b)\n    return a + b\nend\n\n--  匿名函数 (闭包)\nlocal multiply = function(x,\
  \ y)\n    return x * y\nend\n\n--  作为参数的函数\nfunction applyOperation(operation, a,\
  \ b)\n    return operation(a, b)\nend\n\nprint(add(3, 4))               --  7\n\
  print(applyOperation(multiply, 2, 5))  --  10\n```\n\n### 元表与元方法\n\nLua 引入了元表（metatables），它允许自定义\
  \ table 并定义它们在某些操作中的行为。元方法（Meta-methods）是与元表关联的特殊函数，允许为自定义类型自定义加法、减法和比较运算符。\n\n\
  | Listing 9.13: | Lua 元表和元方法 |\n\n```lua\n--  元表示例\nlocal myTable = { value = 42\
  \ }\n\n--  定义元表\nlocal metaTable = {\n    __add = function(a, b)\n        return\
  \ a.value + b.value\n    end\n}\n\nsetmetatable(myTable, metaTable)\n\nlocal otherTable\
  \ = { value = 10 }\nprint(myTable + otherTable)  -- 52 (自定义加法)\n```\n\n这些代码片段让我们得以一览\
  \ Lua 的语法、数据类型、函数等内容。请记住，Lua 的文档 PUC-Rio 包含的内容比我们在这里做的多得多。\n\n#### 9.1.6 实现脚本模块\n\
  \n现在让我们来看看我们一直在讨论的 Lua 代码。我们可以查看的第一个文件是 `Core.lua` 文件。\n\n#### 脚本核心模块\n\n该文件包含了对脚本定义的核心内容以及创建实例的方法。我们在这段代码中做的是创建了一种类似于继承的概念。我们正在建立一个脚本框架，由基础脚本类\
  \ `EmpyScript` 和派生脚本类 `ScriptKlass` 组成。`EmpyScript` 充当基类，使用元表 `EmpyScript_mt` 来定义继承。`EmpyScript.Constructor()`\
  \ 函数通过带有提供实体的本地表来初始化基类的实例。`EmpyScript.Destroy()` 函数用于用于之前引入的 `ApiDestroy()` 函数销毁实体。\n\
  \n| Listing 9.14: | Root/EmpyScript/EmpyEngine/Core.lua |\n\n```lua\n--  核心类\nlocal\
  \ EmpyScript = {}\nlocal EmpyScript_mt = { __index = EmpyScript }\n\n--  它的脚本基\n\
  function EmpyScript.Constructor(entity)\n    local self = setmetatable({}, EmpyScript_mt)\n\
  \    self.Entity = entity\n    return self\nend\n\n--  通过 id 销毁实体\nfunction EmpyScript.Destroy(entity)\n\
  \    ApiDestroy(entity)\nend\n\n--  它的脚本类\nfunction Initializer()\n    --  脚本类\n\
  \    local ScriptKlass = {}\n    local ScriptKlass_mt = { __index = ScriptKlass\
  \ }\n    setmetatable(ScriptKlass, { __index = EmpyScript })\n\n    --  构造函数\n \
  \   function ScriptKlass.Constructor(entity)\n        local obj = EmpyScript.Constructor(entity)\n\
  \        self = setmetatable(obj, ScriptKlass_mt)\n        return self\n    end\n\
  \n    --  对实体施加力\n    function ScriptKlass:ApplyForce(force)\n        ApiApplyForce(self,\
  \ force)\n    end\n\n    -- 销毁 self\n    function ScriptKlass:Destroy()\n      \
  \  ApiDestroy(self)\n    end\n\n    --  获取数据\n    function ScriptKlass:Get(type)\n\
  \        if type == TRANSFORM then\n            return ApiGetTransform(self)\n \
  \       end\n        print(\"无效类型:\", type)\n        return {}\n    end\n\n    --\
  \  导出类\n    return ScriptKlass\nend\n\n--  导出模块\nreturn EmpyScript\n```\n\n####\
  \ 脚本输入模块\n\n正如你所知，我们需要在脚本中使用键盘鼠标输入来实现玩家和相机移动等功能。这些封装在 `Input.lua` 的输入模块中。以下是该模块的代码片段：\n\
  \n| Listing 9.15: | Root/EmpyScript/EmpyEngine/Input.lua |\n\n```lua\n--  定义模块表\n\
