  \ 反射辐照\n\n间接漫反射光效果非常好，因为它在场景中创造了某种连贯性，但我们也在寻找闪光的表面。这意味着有必要引入高光照明。这一概念的核心是：粗糙表面反射的光比平滑表面少。这可以通过计算所谓的“辐射积分（Radiance\
  \ Integral）”来实现。\n\n### 辐射积分\n\n辐射积分是渲染中的一个基础方程，它描述了光如何与表面相互作用。它通常由渲染方程表示，由 Jim\
  \ Kajiya 在计算机图形学中提出。渲染方程描述了给定方向上某一点的总出射光（辐射），是来自所有其他方向的发射光和反射光的和。\n\n`∫ Lo (x,o)\
  \ = Le (x,o)+ Ω fr(x,i,o)⋅Li(x,i) ⋅`\n\n其中：\n- `Lo(x,o)` 是从点 `x` 在方向 `o` 射出的辐射。\n\
  - `Le(x,o)` 是从点 `x` 表面在方向 `o` 发射的辐射。\n- `fr(x,i,o)` 是双向反射函数（`BRDF`），它描述了光如何从点 `x`\
  \ 表面从方向 `i` 反射到方向 `o`。\n- `Li(x,i)` 是点 `x` 处来自方向 `i` 的入射辐射。\n- `i` 和 `o` 是入射方向和出射方向。\n\
  - `n` 是表面法线。\n- `Ω` 代表所有入射方向的半球。\n\n该积分代表了来自所有方向 `i` 的入射辐射通过该表面该点的 `BRDF` 得到的反射光总和。这个方程为\
  \ PBR 提供了基础，并描述了场景内的光传输，考虑了光的反射、吸收和散射。在现实中，这个公式的实时计算量非常大，但得益于本文中 Brian Karis 中“Epic\
  \ Games”的方法，可以通过较少的计算来实现。以下是涉及的不同步骤：\n\n- **预过滤环境图 (Prefiltered Environment Map)**：第一步是生成一个具有匹配\
  \ 0 到 1 之间粗糙值的多个 `Mip-Level` 的预过滤环境图。参见（图 6.29）。\n\n***\n\n![PIC](img/image_rsrc75E.jpg)\n\
  \n| 图 6.29: | 预过滤环境图 |\n\n***\n\n随着 `Mip-Levels` 的过渡，我们将通过卷积模糊图像，受粗糙度的影响。**BRDF\
  \ 积分**：为了正确匹配环境图，我们需要使用 `BRDF` 在 0 到 1 之间的 `Mip-Level`。辐照图包含了 0 到 1 之间的 `N` 的点积。\n\
  \n***\n\n![PIC](img/image_rsrc75F)\n\n| 图 6.30: | 辐照图 |\n\n***\n\n这些解释是基础性的。如果你想更深入地理解，可以参考“Epic\
  \ Games” Brian Karis 方法。我个人并不理解它，但它有效。\n\n### 预过滤与 BRDF 着色器\n\n以下是预过滤生成器和 BRDF 生成器的代码。\n\
