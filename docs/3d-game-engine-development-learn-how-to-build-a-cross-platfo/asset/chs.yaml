  \n    glBindRenderbuffer(GL_RENDERBUFFER, 0);\n    glBindTexture(GL_2D, 0);\n  }\n\
  \n  EMPY_INLINE uint32_t GetBrightnessMap()\n  {\n    return m_Brightness;\n  }\n\
