  \   float A = 0.0;\n    float B = 0.0;\n    vec3 N = vec3(0.0, 0.0, 1.0);\n    const\
  \ uint SAMPLE_COUNT = 1024u;\n    for(uint i = 0u; i < SAMPLE_COUNT; ++i)\n    {\n\
