  最后，我们需要在 PBR 着色器这些贴理来计算反射贡献。\n\n### Listing 72: Resources/Shaders/pbr.glsl\n```glsl\n\
  // ... 与之前相同\n\n// 环境映射\nuniform samplerCube u_prefilMap;\nuniform samplerCube u_irradMap;\n\
  uniform sampler2D u_brdfMap;\n\n// 计算环境光\nvec3 ComputeAmbientLight(vec3 N, vec3\
  \ V, vec3 F0, vec3 albedo, float roughness, float metallic)\n{\n    // 表面法线和光方向之间的角\n\
  \    float cosTheta = max(0.0, dot(N, V));\n\n    // 获取漫反射贡献因子\n    vec3 F = FresnelSchlick(cosTheta,\
  \ F0);\n    vec3 kd = mix(vec3(1.0) - F, vec3(0.0), metallic);\n\n    // 辐照映射包含出辐射\n\
  \    vec3 diffuseIBL = kd * albedo * texture(u_irradMap, N).rgb;\n\n    // 在正确的\
  \ mip 级采样预过滤映射\n    int mipLevels = 5;\n    vec3 Lr = 2.0 * cosTheta * N - V;\n\
  \    vec3 Ks = textureLod(u_prefilMap, Lr, roughness * mipLevels).rgb;\n\n    //\
  \ Cook-Torrance 射 BRDF 的拆分和近似因子\n    vec2 brdf = texture(u_brdfMap, vec2(cosTheta,\
  \ roughness)).rg;\n    vec3 specularIBL = (F0 * brdf.x + brdf.y) * Ks;\n\n    return\
  \ (diffuseIBL + specularIBL);\n}\n```\n\n\n\n\n### PBR Shader 类更新\n\n按照下面的代码段更新\
  \ PBR 着色器。如你所见，我们为 `SetEnvMaps()` 添加了额外的参数，以满足同时设置预过滤映射（prefiltered map）和 BRDF 映射的需求。\n\
  \n| 列表 6.73: Graphics/Renderer.h\n\n```cpp\nstruct PbrShader : Shader\n{\n    EMPY_INLINE\
  \ PbrShader(const std::string& filename): Shader(filename)\n    {\n        /* ...\
  \ same as before ... */\n        u_PrefilMap = glGetUniformLocation(m_ShaderID,\
  \ \"u_prefilMap\");\n        u_IrradMap = glGetUniformLocation(m_ShaderID, \"u_irradMap\"\
  );\n        u_BrdfMap = glGetUniformLocation(m_ShaderID, \"u_brdfMap\");\n    }\n\
  \n    EMPY_INLINE void Draw(Model3D& model, PbrMaterial& material, Transform3D&\
  \ transform)\n    {\n        glUniformMatrix4fv(u_Model, 1, GL_FALSE, glm::value_ptr(transform.Matrix()));\n\
  \n        glUniform3fv(u_Albedo, 1, &material.Albedo.x);\n        glUniform1f(u_Roughness,\
  \ material.Roughness);\n        glUniform1f(u_Metallic, material.Metallic);\n\n\
  \        int32_t unit = 3;  // <-- starts at unit 3 !!!\n        bool useMap = false;\n\
  \n        /* ... same as before ... */\n    }\n\n    EMPY_INLINE void SetEnvMaps(uint32_t\
  \ irrad, uint32_t prefil, uint32_t brdf)\n    {\n        glUseProgram(m_ShaderID);\n\
  \n        // irradiance map\n        glActiveTexture(GL_TEXTURE0);  // < texture\
  \ unit 0\n        glBindTexture(GL_TEXTURE_CUBE_MAP, irrad);\n        glUniform1i(u_IrradMap,\
  \ 0);\n\n        // prefiltered map\n        glActiveTexture(GL_TEXTURE1);  // <\
  \ texture unit 1\n        glBindTexture(GL_TEXTURE_CUBE_MAP, prefil);\n        glUniform1i(u_PrefilMap,\
  \ 1);\n\n        // BRDF Map\n        glActiveTexture(GL_TEXTURE2);  // < texture\
  \ unit 2\n        glBindTexture(GL_TEXTURE_2D, brdf);\n        glUniform1i(u_BrdfMap,\
  \ 2);\n    }\n\n    /* ... same as before ... */\n\nprivate:\n    /* ... same as\
  \ before ... */\n    uint32_t u_PrefilMap = 0u;\n    uint32_t u_IrradMap = 0u;\n\
  \    uint32_t u_BrdfMap = 0u;\n}\n```\n\n既然我们的环境映射使用了前三个纹理单元 `0-2`，我们还必须确保更新 `Draw()`\
  \ 函数，以使用从 `3` 开始的纹理单元。如果你在没有光源的情况下编译并运行，将得到以下结果：\n\n![PIC Figure 6.31: 漫反射与高光（无伽马校正）]\n\
  \n#### 6.5. HDR 色调映射\n\n你可能注意到，考虑到环境中有光，图 6.31 中渲染的场景非常暗。事实上，这是因为我们需要应用一些“伽马校正”。伽马校正是计算机图形中的一个关键概念，解决了显示器发射的光线强度与人眼感知到的亮度之间的非线性关系。实施伽马校正过程是为了补偿这种非线性性，并确保显示的图像在视觉上保持一致。\n\
  \n###### 数学方程\n\n在数学术语中，输入电压（或数字强度）与显示器上的感知亮度之间的关系通常使用幂律函数进行建模：\n\nIout = In^γ\n\
  \n这里 `Iout` 是输出强度（亮度），`In` 是输入强度（原始颜色），而 `γ` 是伽马值。对于大多数显示系统，典型的伽马值约为 2.2。伽马校正通过使用伽马值的倒数对强度值进行编码或解码来完成。在编码时，公式变为：\n\
  \nIn^(1/γ) = Iout\n\n在解码时，公式为：\n\nIn^γ = Iout\n\n这种校正有助于在不同色调之间实现感知上等效的亮度水平，因为人类视觉系统对较暗区域的变化比对较亮区域更敏感。\n\
  \n##### 最终着色器更新\n\n这在下面的代码段中完成。参见列表 6.74：\n\n```cpp\n#version 330 core\nlayout (location\
  \ = 0) in vec4 a_quad;\nout vec2 uvs;\n\nvoid main()\n{\n    gl_Position = vec4(a_quad.x,\
  \ a_quad.y, 0.0, 1.0);\n    uvs = vec2(a_quad.z, a_quad.w);\n}\n\n// VERTEX\n#version\
  \ 330 core\nout vec4 out_fragment;\nin vec2 uvs;\n\nconst float GAMMA = 2.5;\nconst\
  \ float EXPOSURE = 10.0;\nuniform sampler2D u_map;\n\nvoid main()\n{\n    // 从 map\
  \ 中采样颜色\n    vec3 result = pow(texture(u_map, uvs).rgb, vec3(GAMMA));\n\n    //\
  \ 处理曝光\n    result = vec3(1.0) - exp(-result * EXPOSURE);\n\n    // 伽马校正\n    result\
  \ = pow(result, vec3(1.0 / max(GAMMA, 0.00000)));\n\n    // 片元颜色\n    out_fragment\
  \ = vec4(result, 1.0);\n}\n// FRAGMENT\n```\n\n（图 6.32）是你使用此着色器得到的结果。你会发现天空盒和球体变亮了。这是在没有光源的情况下。你可以修改\
  \ `GAMMA` 和 `EXPOSURE` 值来观察它们如何影响结果。\n\n![PIC Figure 6.32: 应用伽马校正]\n\n### 6.6 渲染阴影\n\
  \n阴影在增强计算机图形场景的真实感和深度方面起着至关重要的作用。通过提供与光照和空间关系相关的视觉线索，营造出更有沉浸感的环境。\n\n![PIC Figure\
  \ 6.33: 阴影投影]\n\n#### 6.6.1 阴影映射技术\n\n“阴影映射”是计算机图形中渲染真实阴影的一种广泛使用的技术。它涉及从光源的角度创建一个深度图（影子映射），以确定哪些区域处于阴影中。基本原理是在渲染期间比较影子映射和场景之间的深度值，以判断一点是否在阴影中。以下是使用\
  \ OpenGL 实现阴影映射的步骤描述：\n\n*   **从光视角渲染场景**：我们首先设置一个用于存储深度值的帧缓冲区。然后，我们使用正交投影从光源视角渲染场景，并将深度值存储在帧缓冲区深度文件中。正交投影是计算机图形中的一种投影类型，不考虑透视。在正交投影中，平行线保持平行，物体的大小不会随距离而改变。这种投影通常用于技术图和建筑插图，因为它保留了准确的测量和比例。\n\
  \n*   **从相机视角渲染场景**：我们像往一样从相机视角渲染场景，但现在我们还将光空间矩阵传递给着色器。\n\n*   **片元着色器中进行影子映射比较**：然后我们在片元着色器中使用光空间矩阵计算片段在光空间中的位置，并从影子映射中采样相应的深度值。将采样的深度值与使用光空间矩阵计算出的值进行比较。\n\
  \n\n\n\n\n-   **处理阴影颗粒 (Shadow Acne)**：阴影颗粒也称为自阴影伪影或彼得潘（Peter Panning），在渲染阴影中表现为不需要的高频噪声或闪烁。它主要由于阴影映射比较时使用的深度值存在浮点精度误差引起的。为了解决阴影颗粒，我们可以在比较之前对计算出的深度应用一个微小的偏移。`depth\
  \ = depth - bias`。\n-   **实现软影（可选）**：最后阶段涉及实现更柔和、更符合视觉的阴影。可以使用百分比深度过滤（PCF）等技术来实现此目的。PCF\
  \ 涉及在阴影图中采样多个点并对结果取平均值。这使得生成的阴影边缘不再锯齿。\n\n本指南提供了阴影映射过程的简要概述，涵盖了从渲染阴影映射到实现片段着色器逻辑的关键步骤。让我们现在引擎中实现此功能。\n\
  \n## 6.6.2 应用阴影映射\n\n如上所述，我们需要在一个额外的缓冲区（frame buffer）中创建一个纹理附件（也称为深度附件）来存储场景的深度值，我们还需要创建一个新的着色器来渲染帧缓冲区附件中的深度值。我们可以轻松地在单独的文件创建着色器和帧缓冲区，但我们将把两者合并到着色器文件中，以保持结构清晰简单。让我们从着色器的\
  \ GLSL 代码开始，因为它非常简单。\n\n### GLSL 着色器\n\n从代码（列表 [6.75]）中的代码可以看出，阴影着色器非常简单。所有的工作都在顶点着色器中完成。统一变量\
  \ `u_lightSpace` 是我们之前提到的矩阵，它基本上是正交投影矩阵与从光源视角视图矩阵相乘。\n\n列表 6.75：Resources/Shaders/shadow.glsl\n\
  ```glsl\n#version 330 core\nlayout (location = 0) in vec3 a_position;\n\nuniform\
  \ mat4 u_lightSpace;\nuniform mat4 u_model;\n\nvoid main()\n{\n  gl_Position = u_lightSpace\
  \ * u_model * vec4(a_position, 1.0f);\n}\n\n++VERTEX++\n\n#version 330 core\n\n\
  void main()\n{\n    // 无需任何操作\n}\n\n++FRAGMENT++\n```\n\n如你所知，模型矩阵代表我们正尝试渲染深度值的对象的变换。你会发现片段着色器没有代码。这是因为当前深度值会自动渲染到帧缓冲区的深度附件中，不需要我们手动操作。这将在稍后的帧缓冲区中定义。\n\
  \n### 着色器抽象\n\n与往常一样，我们需要创建一个 C++ 着色器类来与实际的 GLSL 着色器正确交互。这在下面的代码段（列表 [6.76]）中实现。\n\
  \n列表 6.76：Graphics/Shaders/Shadow.h\n```cpp\n#pragma once\n#include \"Shader.h\"\
  \n\nnamespace Empy\n{\n    struct ShadowShader : Shader\n    {\n        EMPY_INLINE\
  \ ShadowShader(const std::string& path): Shader(path)\n        {\n            u_LightSpace\
  \ = glGetUniformLocation(m_ShaderID, \"u_lightSpace\");\n            u_Model = glGetUniformLocation(m_ShaderID,\
  \ \"u_model\");\n\n            // 创建深度纹理\n            glGenTextures(1, &m_DepthMap);\n\
  \            glBindTexture(GL_TEXTURE_2D, m_DepthMap);\n            glTexImage2D(GL_TEXTURE_2D,\
  \ 0, GL_DEPTH_COMPONENT, MapSize, MapSize, 0, GL_DEPTH_COMPONENT, GL_FLOAT, NULL);\n\
  \n            // 设置纹理参数\n            glTexParameteri(GL_TEXTURE_2D, GL_MAG_FILTER,\
  \ GL_NEST);\n            glTexParameteri(GL_TEXTURE_2D, GL_MIN_FILTER, GL_NEST);\n\
  \            glTexParameteri(GL_TEXTURE_2D, GL_WRAP_S, GL_REPEAT);\n           \
  \ glTexParameteri(GL_TEXTURE_2D, GL_WRAP_T, GL_REPEAT);\n\n            // 创建帧缓冲区\n\
  \            glFramebuffers(1, &m_FrameBuffer);\n            glBindFramebuffer(GL_FRAMEBUFFER,\
  \ m_FrameBuffer);\n\n            // 附加到帧缓冲区\n            glTexture2D(GL_FRAMEBUFFER,\
  \ GL_DEPTH_ATTACHMENT, GL_TEXTURE_2D, m_DepthMap, 0);\n\n            // 不进行也不读取\n\
  \            glDrawBuffer(GL_NONE);\n            glReadBuffer(GL_NONE);\n\n    \
  \        // 检查帧缓冲区\n            if (glFramebufferStatus(GL_FRAMEBUFFER) != GL_FRAMEBUFFER_COMPLETE)\n\
  \            {\n                EMPY_ERROR(\"CreateDepthBuffer!\");\n          \
  \  }\n\n            // 解绑帧缓冲区\n            glBindFramebuffer(GL_FRAMEBUFFER, 0);\n\
  \        }\n\n        EMPY_INLINE void Draw(Model3D& model, Transform3D& transform)\n\
  \        {\n            glUniformMatrix4fv(u_Model, 1, GL_FALSE, glm::value_ptr(transform.Matrix()));\n\
  \            model->Draw(GL_TRIANGLES);\n        }\n\n        EMPY_INLINE void BeginFrame(const\
  \ glm::mat4& lightSpaceMtx)\n        {\n            // 绑定阴影着色器\n            glUseProgram(m_ShaderID);\n\
  \n            // 设置视图投影矩阵\n            glUniformMatrix4fv(u_LightSpace, 1, GL_FALSE,\
  \ glm::value_ptr(lightSpaceMtx));\n\n            // 绑定目标帧缓冲区\n            glBindFramebuffer(GL_FRAMEBUFFER,\
  \ m_FrameBuffer);\n\n            // 设置视口\n            glViewport(0, 0, MapSize,\
  \ MapSize);\n            glClear(GL_DEPTH_BIT);\n            glEnable(GL_DEPTH_TEST);\n\
  \        }\n\n        EMPY_INLINE uint32_t GetDepthMap()\n        {\n          \
  \  return m_DepthMap;\n        }\n\n        EMPY_INLINE void EndFrame()\n      \
  \  {\n            glDisable(GL_DEPTH_TEST);\n            glBindFramebuffer(GL_FRAMEBUFFER,\
  \ 0);\n            glUseProgram(0);\n        }\n\n        EMPY_INLINE ~ShadowShader()\n\
  \        {\n            glDeletebuffers(1, &m_FrameBuffer);\n            glDeleteTextures(1,\
  \ &m_DepthMap);\n        }\n\n    private:\n        uint32_t m_FrameBuffer = 0;\n\
  \        uint32_t m_DepthMap = 0;\n        int32_t MapSize = 1024;\n        uint32_t\
  \ u_LightSpace = 0;\n        uint32_t u_Model = 0;\n    };\n}\n```\n\n\n\n\n```glsl\n\
  // 从阴影图中采样深度值\nfloat depth = texture(u_depthMap, uvs.xy).r;\n\n// 与光空间深度值进行比较\n\
  return position.z > depth ? 1.0 : 0.0;\n}\n\n// ... 之前的 sa 相同\n\n// 主函数\nvoid main()\n\
  {\n  /* ... 与之前相同 ... */\n\n  // 光照贡献\n  vec3 result = ComputeAmbientLight(N, V,\
  \ F0, albedo, roughness, metallic);\n  result += ComputeDirectLights(N, V, F0, albedo,\
  \ roughness, metallic);\n  result += ComputePointLights(N, V, F0, albedo, roughness,\
  \ metallic);\n  result += ComputeSpotLights(N, V, F0, albedo, roughness, metallic);\n\
  \n  // 遮挡与自光\n  result = (result * occlusion) + emissive;\n\n  // 计算阴影值 <--------\
  \ 添加\n  result *= (1.0 - ComputeShadow());\n\n  // 最终颜色输出\n  out_fragment = vec4(result,\
  \ 1.0);\n}\n```\n\n这里添加了两个 uniform：`u_depthMap` 和我们已经引入过的 `u_lightSpace`。新添加的函数\
  \ `ComputeShadow()` 用于计算当前片段是被阴影遮蔽还是被光照射。\n\n### PBR 着色器类更新\n\n我们还需要更新 PBR 着色器类，以反映\
  \ GLSL 着色器中的更改。\n\n| 列表 6.78: Graphics/Shaders/PBR.h\n\n```cpp\nstruct PbrShader\
  \ : Shader\n{\n  EMPY_INLINE PbrShader(const std::string& filename): Shader(filename)\n\
  \  {\n    /* ... 与之前相同 ... */\n\n    u_LightSpace = glGetUniformLocation(m_ShaderID,\
  \ \"u_lightSpace\");\n    u_DepthMap = glGetUniformLocation(m_ShaderID, \"u_depthMap\"\
  );\n  }\n\n  EMPY_INLINE void Draw(Model3D& model, PbrMaterial& material, Transform3D&\
  \ transform)\n  {\n    // ...\n    int32_t unit = 4; // <-- 在单元 4 处\n    // ...\n\
  \  }\n\n  EMPY_INLINE void SetEnvMaps(uint32_t irrad, uint32_t prefil, uint32_t\
  \ brdf, uint32_t depthMap)\n  {\n    glUseProgram(m_ShaderID);\n\n    // 辐照图\n \
  \   glActiveTexture(GL_TEXTURE0);\n    glBindTexture(GL_CUBE_MAP, irrad);\n    glUniform1i(u_IrradMap,\
  \ 0);\n\n    // 预滤波图\n    glActiveTexture(GL_TEXTURE1);\n    glBindTexture(GL_CUBE_MAP,\
