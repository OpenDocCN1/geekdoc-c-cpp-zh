  xxx\")}\n```\n\n\n\n\n\n- **碰撞检测 (Collision Detection)**：碰撞检测识别虚拟世界中两个或多个物体何时相交。准确地处理交互是物理模拟的一个关键环节。这对于防止物体相互穿过、触发碰撞事件以及计算冲击的真实响应至关重要。\n\
  - **软体动力学 (Soft Body Dynamics)**：软体动力学模拟物体的变形和弹性。与刚体不同，软体可以发生真实的弯曲、拉伸和变形。它们通常用于模拟布料、橡胶、液体和其他可变形物体。为材料及其对力的响应提供了更真实的表现。\n\
  - **流体动力学 (Fluid Dynamics)**：流体动力学模拟液体和气体的行为。它模拟了虚拟环境中流体的流动、粘度和相互作用。用于在游戏、电影和模拟中真实呈现水、烟雾、火焰和其他流体效果。\n\
  - **粒子系统 (Particle Systems)**：粒子系统模拟大量单个粒子的行为。每个粒子都可以具有位置、速度、质量和寿命等属性。它们被广泛用于游戏和模拟中的爆炸、火、雨和雪等效果。它提供了一种使用大量实体建模复杂行为的方法。\n\
  - **关节与约束系统 (Joint and Constraint Systems)**：关节与约束系统定义了物体如何连接或限制其运动。关节模拟了物体之间的物理连接。它们被用于建模复杂的机械系统，例如机器人手臂中的关节或基于物理的谜游戏中的约束。\n\
  - **力与力矩模拟 (Force and Torque Simulation)**：物理引擎根据用户输入、环境条件或脚本事件对物体施加力和力矩。用于模拟重力、用户控制、风和其他影响物体运动和行为的力的影响。\n\
  \n本书集成了使用 NVIDIA PhysX SDK 库的物理模拟。我们没有对上述提到的许多模拟进行详细介绍，因为在本书的语境下很难对它们进行恰当的描述。幸运的是，PhysX\
  \ 拥有非常丰富的文档，为如何执行特定的模拟提供了良好的指导。你可以在此处找到本书所用 PhysX 版本的文档链接：PhysX [a]。\n\n## 8.1 集成\
  \ NVIDIA PhysX\n\n在本节中，我们开始将物理模拟能力集成到我们的引擎中。NVIDIA PhysX 是一种被广泛的物理引擎，以其在模拟从刚体动力学到复杂软体模拟的各种物理交互方面的效率和通用性而闻名。它起源于\
  \ 2002 年的 Ageia Technologies，其愿景是通过名为 PhysX 处理单元 (PPU) 的专用硬件来彻底改变游戏物理。2005 年，Ageia\
  \ 引入了 PPU 及其专用 SDK，旨在增强游戏中的物理模拟。NVIDIA 于 2008 年收购了 Ageia，并将 PhysX 集成到其 GPU 架构中。从那以后，PhysX\
  \ 库已变成一个被广泛采用的物理引擎，为开发者在虚拟世界中的真实模拟提供了全面的工具集。\n\n![PIC](img/image_rsrc76G.jpg)\n\n\
  | 图 8.3: | NVIDIA PhysX Logo |\n\n### 8.1.1 开始使用 NVIDIA PhysX\n\n在深入实现之前，设置必要的依赖项是至关重要的。我们需要确保已将\
  \ NVIDIA PhysX 库链接到我们的项目中，使其在我们的开发环境中可访问。幸运的是，Conan 为我们完成了所有工作。你可以在下面的代码看到 PhysX\
  \ 是如何被添加到我们的需求列表中的。\n\n| 列表 8.1: | Root/conanfile.txt |\n\n```\n[requires]\nglm/cci.20230113\n\
  stb/cci.20230920\nopengl/system\nspdlog/1.12.0\nassimp/5.2.2\nentt/3.12.2\nphysx/4.1.1\n\
  glfw/3.3.8\nglew/2.2.0\n\n[generators]\ncmake\n\n[options]\nphysx:shared=True\n\
  glew:shared=False\nglfw:shared=False\nassimp:shared=False\n```\n\n这里需要注意的是 \"option\"\
  \ 部分中的 `physx : shared = True` 这一行。它告诉 Conan 将 PhysX 作为共享库使用。可以使用 PhysX 作为静态库，但我凭记忆没法立刻查到做到。所以我妥协使用了共享版本。这意味着我们需要将\
  \ PhysX 的所有 `.dll` 文件复制到应用程序的构建文件夹中，以便其在运行时使用它们。不要担心；你不需要手动这样做。我们可以使用 CMake 的构建后命令来实现自动化。这在下面的代码段中完成。\n\
  \n| 列表 8.2: | EmpyEngine/CMakeLists.txt |\n\n```cmake\n# copy .dll files\nif (MSVC)\n\
  \    foreach(directory ${CONAN_BIN_DIRS})\n        file(GLOB dllfiles ${directory}/*.dll)\n\
  \        foreach(dllfile ${dllfiles})\n            if (EXISTS ${dllfile})\n    \
  \            add_custom_command(TARGET ${PROJECT_NAME} POST_BUILD\n            \
  \        COMMAND ${CMAKE_COMMAND} -E copy_if_different \"${dllfile}\" \"${EXECUTABLE_OUTPUT_PATH}\"\
  )\n            endif()\n        endforeach()\n    endforeach()\nendif()\n```\n\n\
  复制此段代码并添加到你的 `CMakeLists.txt` 文件中。如你所示，该命令仅在我们在 Windows 上运行时运行。Linux 系统使用共享对象 (.so)，不需要额外的文件。这将在编译后执行。\n\
  \n### 8.1.2 初始化与配置\n\n我们需要在创建模拟之前初始化 PhysX。这涉及设置必要的组件，例如场景、材料和其他参数。正确的初始化确保了物理环境的稳定和一致。首先如图\
  \ 8.4 所示扩展你的项目树。\n\n![Picture](img/image_rsrc76H.jpg)\n\n| 图 8.4: | Physics Directory\
  \ |\n\n#### 物理辅助函数\n\n由于 PhysX 使用的类型与 GLM 不同，我们需要定义一些辅助函数在不同上下文之间进行转换。列表 8.3 中提供的代码段为此定义了两个辅助函数。第一个函数\
  \ `PxToVec3()` 用于将 PhysX `PxVec3` 转换为 GLM `glm::vec3`。第二个函数 `ToPxVec3()` 执行反向转换。\n\
  \n| 列表 8.3: | Physics/Helpers.h |\n\n```cpp\n#pragma once\n#include \"Common/Core.h\"\
  \n#include <PxAPI.h>\n\nusing namespace physx;\n\nnamespace Empy\n{\n    // 将 PhysX\
  \ Vec3 转换为 GLM vec3\n    EMPY_INLINE glm::vec3 PxToVec3(const PxVec3& physxVec)\n\
  \    {\n        return glm::vec3(physxVec.x, physxVec.y, physxVec.z);\n    }\n\n\
  \    // 将 GLM vec3 转换为 PhysX Vec3\n    EMPY_INLINE PxVec3 ToPxVec3(const glm::vec3&\
  \ glmVec)\n    {\n        return PxVec3(glmVec.x, glmVec.y, glmVec.z);\n    }\n\
  }\n```\n\n你也可以看到包含了 `PxAPI.h` 头文件，它包含了 PhysX 功能所需的所有声明。为了让使用 PhysX 的体验更加愉悦，我们前向声明了它的命名空间，这样在创建变量或调用函数时就永远不需要直接使用它。\n\
  \n\n\n\n\n在(Listing 8.4)提供的代码中定义的事件回调类型表示了一种自定义的事件回调类型，旨在作为 PhysX 与我们引擎之间的交换点。该事件回调必须继承自\
  \ PhysX 事件回调接口 `PxSimulationEventCallback`，这使我们能够重写虚拟函数来捕获 PhysX 仿真中的碰撞事件。\n\n**Listing\
  \ 8.4: Physics/Callback.h**\n\n```cpp\n#pragma once\n\n#include \"Helpers.h\"\n\
  #include \"Auxiliaries/ECS.h\"\n\nnamespace Empy\n{\n    enum class PxEvent\n  \
  \  {\n        UNKNOWN = 0,\n        TRIGGER,\n        CONTACT,\n        SLEEP,\n\
  \        WAKE\n    };\n\n    struct PxPayload\n    {\n        EntityID Entity1 =\
  \ NENTT;\n        EntityID Entity2 = NENTT;\n        PxEvent Event = PxEvent::UNKNOWN;\n\
  \    };\n\n    using PxCallbackFunction = std::function<void(const PxPayload&)>;\n\
  \n    struct PxEventCallback : public PxSimulationEventCallback\n    {\n       \
  \ // override the onContact callback\n        EMPY_INLINE void onContact(const PxContactPairHeader&\
  \ header, const PxContactPair* pairs, PxU32 nbPairs) override\n        {\n     \
  \       // collision actors\n            auto actor1 = header.actors[0];\n     \
  \       auto actor2 = header.actors[1];\n\n            // check if actors\n    \
  \        if (m_Callback && actor1 && actor2)\n            {\n                PxPayload\
  \ event;\n                event.Event = PxEvent::CONTACT;\n                event.Entity1\
  \ = *static_cast<EntityID*>(actor1->userData);\n                event.Entity2 =\
  \ *static_cast<EntityID*>(actor2->userData);\n                m_Callback(event);\n\
  \            }\n\n            EMPY_DEBUG(\"onContact Event!\");\n        }\n\n \
  \       // override the onTrigger callback\n        EMPY_INLINE void onTrigger(PxTriggerPair*\
  \ pairs, PxU32 nbPairs) override\n        {\n            for (PxU32 i = 0; m_Callback\
  \ && i < nbPairs; ++i)\n            {\n                // Access pointers from the\
  \ trigger pair\n                const PxidActor* actor0 = pairs[i].triggerActor;\n\
  \                const PxRigActor* actor1 = pairs[i].otherActor;\n\n           \
  \     // Check if actors are valid before using\n                if (actor0 && actor1)\n\
  \                {\n                    PxPayload event;\n                    event.Event\
  \ = PxEvent::TRIGGER;\n                    event.Entity1 = *static_cast<EntityID*>(actor1->userData);\n\
  \                    event.Entity2 = *static_cast<EntityID*>(actor0->userData);\n\
  \                    m_Callback(event);\n                }\n            }\n    \
  \        EMPY_DEBUG(\"onTrigger Event!\");\n        }\n\n        EMPY_INLINE void\
  \ onAdvance(const PxRigBody*const* bodyBuffer, const PxTransform* poseBuffer, const\
  \ PxU32 count) override {}\n\n        EMPY_INLINE void onSleep(PxActor** actors,\
  \ PxU32 count) override { EMPY_DEBUG(\"onSleep Event!\"); }\n\n        EMPY_INLINE\
  \ void onWake(PxActor** actors, PxU32 count) override { EMPY_DEBUG(\"onWake Event!\"\
  ); }\n\n        EMPY_INLINE void onConstraintBreak(PxConstraintInfo* constraints,\
  \ PxU32 count) override {}\n\n    private:\n        PxCallbackFunction m_Callback;\n\
  \        friend struct PhysicsContext;\n    };\n}\n```\n\n从顶部开始，你将看到我们创建的枚举类 `PxEvent`，用于列出不同类型的事件，随后是负载数据类型\
  \ `PxPayload`。每当触发碰撞事件时，该负载将随事件类型一起被设置。它将由成员回调函数 `m_Callback` 用于通知我们的引擎该事件。\n\n\
  事件回调结构重写了 PhysX 事件回调接口的所有虚拟函数，特别是 `onContact()` 和 `onTrigger()`，这两个函数分别在发生接触（仿真中的碰撞）和触发（无仿真的碰撞）事件时被调用。这些函数从\
  \ PhysX 回调参数中提取相关信息，创建 `PxPayload` 实例并调用回调 `m_Callback`。该回调函数将在下一章应用脚本时具体实现。此外，该结构为其他与\
  \ PhysX 相关的回调提供了空实现，例如 `onAdvance()`、`onSleep()` 和 `onConstraintBreak()`。必须这样做是因为这些是纯虚拟函数。\n\
  \n### Physics Class\n\n为了保持结构整洁，我们需要创建一个类来持有我们引擎中关于 PhysX 的所有必要信息。这是通过下方(Listing\
  \ 8.5)所示实现的。`PhysicsContext` 类作为管理 NVIDIA PhysX 库初始化和清理的封装。在构造函数中，代码通过创建基础（foundation）、物理实例、设置工作线程并创建物理场景来初始化\
  \ PhysX。PhysX 中的 foundation 是一个基础的组件，作为整个物理框架的基础块。PhysX foundation 为物理引擎的初始化和运行提供了与平台无关的基础。它封装了内存分配、错误处理和基础系统级配置等功能。这里的调度器（dispatcher）使用工作线程初始化。你可以通过提供零工作线程在主线程中执行仿真。但请记住，你的应用程序扩展性可能不如你预期的那样，因为对数千个对象的物理仿真是非常昂贵的。\n\
  \n**Listing 8.5: Physics/Context.h**\n\n```cpp\n#pragma once\n#include \"Callback.h\"\
  \n#include \"Utilities.h\"\n\nnamespace Empy\n{\n    struct PhysicsContext\n   \
  \ {\n        EMPY_INLINE PhysicsContext()\n        {\n            // initialize\
  \ physX\n            m_Foundation = PxCreateFoundation(PX_PHYSICS_VERSION, m_AllocatorCallback,\
  \ m_ErrorCallback);\n            if (!m_Foundation)\n            {\n           \
  \     EMPY_ERROR(\"Error initializing PhysX m_Foundation\");\n                return;\n\
  \            }\n\n            // create context instance\n            m_Physics\
  \ = PxCreatePhysics(PX_PHYSICS_VERSION, *m_Foundation, PXTolerancesScale());\n \
  \           if (!m_Physics)\n            {\n                EMPY_ERROR(\"Error initializing\
  \ PhysX m_Physics\");\n                m_Foundation->release();\n              \
  \  return;\n            }\n\n            // create worker threads\n            m_Dispatcher\
  \ = PxDefaultCpuDispatcherCreate(2);\n\n            // create a scene desciption\n\
  \            PxSceneDesc sceneDesc(m_Physics->getTolerancesScale());\n         \
  \   sceneDesc.simulationEventCallback = &m_EventCallback;\n            sceneDesc.gravity\
  \ = PxVec3(0.0f, -9.81f, 0.0f);\n            sceneDesc.filterShader = CustomFilterShader;\n\
  \            sceneDesc.cpuDispatcher = m_Dispatcher;\n\n            // create scene\n\
  \            m_Scene = m_Physics->createScene(sceneDesc);\n            if (!m_Scene)\n\
  \            {\n                EMPY_ERROR(\"Error creating PhysX m_Scene\");\n\
  \                m_Physics->release();\n                m_Foundation->release();\n\
  \                return;\n            }\n        }\n\n        EMPY_INLINE ~PhysicsContext()\n\
  \        {\n            if (m_Scene) { m_Scene->release(); }\n            if (m_Physics)\
  \ { m_Physics->release(); }\n            if (m_Dispatcher) { m_Dispatcher->release();\
  \ }\n            if (m_Foundation) { m_Foundation->release(); }\n        }\n\n \
  \   private:\n        // custom collision filter shader callback\n        static\
  \ PxFilterFlags CustomFilterShader(\n```\n\n\n\n\n\n```cpp\nPxFilterObjectAttributes\
  \ attributes0, PxFilterData filterData0,\nPxFilterObjectAttributes attributes1,\
  \ PxFilterData filterData1,\nPxPairFlags& pairFlags, const void* constantBlock,\
  \ PxU32 constantBlockSize\n)\n{\n    // generate contacts and triggers for actors\n\
  \    pairFlags |= PxPairFlag::eCONTACT_DEFAULT |\n    PxPairFlag::eTRIGGER_DEFAULT;\n\
  \n    return PxFilterFlag::eDEFAULT;\n}\n\nprivate:\n    PxDefaultErrorCallback\
  \ m_ErrorCallback;\n    PxDefaultAllocator m_AllocatorCallback;\n    PxDefaultCpuDispatcher*\
  \ m_Dispatcher;\n    PxEventCallback m_EventCallback;\n    PxFoundation* m_Foundation;\n\
  \    PxPhysics* m_Physics;\n    PxScene* m_Scene;\n};\n}\n```\n\n静态函数 `CustomFilterShader(...)`\
  \ 定义了一个自定义碰撞过滤着色器回调函数。在 `PhysX` 中，碰撞过滤对于控制物理模拟不同类型对象之间的交互至关重要。自定义过滤着色器用户定义的函数，负责指定如何处理对象对之间的碰撞（collisions）和触发（triggers）。该函数的目的是根据两个对象的属性和过滤数据，确定如何处理它们之间的碰撞和触发。正如我们需要着色器来渲染对象一样，在\
  \ `PhysX` 中也需要着色器来妥善处理 Actor（actors）之间的碰撞。\n\n标记 `eCONTACT_DEFAULT` 和 `eTRIGGER_DEFAULT`\
  \ 被添加到 `pairFlags` 中，表示应为对象对生成默认的碰撞接触和触发。`PhysX` 在碰撞发生时默认不会通知我们，这就是为什么我们需要显式地告诉它在碰撞发生时做什么。该函数返回\
  \ `eDEFAULT`，表示应应用默认的碰撞过滤行为。这通常意味着 `PhysX` 将根据属性和过滤数据使用其默认标准来判断两个对象是否应该碰撞或触发。在此处阅读更多关于碰撞过滤的知识：PhysX\
  \ [b]。\n\n## 8.1.3 刚体与碰撞体\n\n有了原地初始化 `PhysX` 的能力，我们可以开始创建刚体（rigid bodies）和碰撞体（colliders）来表示物理模拟中的物理实体。刚体定义了对象的质量、运动和朝态，而碰撞体则决定了它们用于碰撞检测的形状。\n\
  \n### 数据结构\n\n我们希望将 `PhysX` 整合我们已经建立的 ECS 框架中。因此，我们将创建 `RigidBody` 和 `Collider`\
  \ 组件，以便在物理模拟和渲染过程中妥善地操作它们的状态。\n\n在下方的代码段（见列表 8.6）中，`RigidBody3D` 结构封装了与 3D 刚体相关的属性。它包含一个指向\
  \ `PhysX` 上文中 `PxRigidActor` 的指针。此外，它还包含一个 `Density` 属性用于指定物体的密度，以及一个 `Type` 枚举，允许指定刚体是动态的（dynamic）还是静态的（static）。换句话之，即模拟过程中刚体\
  \ Actor 是否应该受到重力的影响。\n\n#### 列表 8.6: Physics/Utilities.h\n\n```cpp\n#pragma once\n\
  \n#include \"Helpers.h\"\n\nnamespace Empy\n{\n    struct RigidBody3D\n    {\n \
  \       EMPY_INLINE RigidBody3D(const RigidBody3D&) = default;\n        EMPY_INLINE\
  \ RigidBody3D() = default;\n\n        // body actor pointer\n        PxRigidActor*\
  \ Actor = nullptr;\n\n        // body density\n        float Density = 1.0f;\n\n\
  \        // rigidbody type\n        enum\n        {\n            DYNAMIC = 0,\n\
  \            STATIC,\n        } Type;\n    };\n\n    struct Collider3D\n    {\n\
  \        EMPY_INLINE Collider3D(const Collider3D&) = default;\n        EMPY_INLINE\
  \ Collider3D() = default;\n\n        // collider material\n        PxMaterial* Material\
  \ = nullptr;\n\n        // collider material data\n        float DynamicFriction\
  \ = 0.5f;\n        float StaticFriction = 0.0f;\n        float Restitution = 0.1f;\n\
  \n        // mesh for custom shape\n        PxConvexMesh Mesh;\n\n        // collider\
  \ geometry shape\n        PxShape* Shape = nullptr;\n\n        // collider shape\
  \ type\n        enum\n        {\n            BOX = 0,\n            SPHERE,\n   \
  \         MESH\n        } Type;\n    };\n}\n```\n\n另一方面，`Collider3D` 结构专注于与 3D 碰撞体相关的属性。它持有一个指向\
  \ `PxMaterial` 的指针，允许自定义物理属性，如动态摩擦、静态摩擦和恢复系数。该结构还包含一个指向 `PxShape` 的指针，表示碰撞体的几何形状，以及一个\
  \ `Type` 枚举，指示碰撞体形状是箱体（box）、球体（sphere）还是自定义网格（mesh）。\n\n### 创建刚体\n\n现在让我们回到之前创建的\
  \ `PhysicsContext` 类，实现添加刚体的函数。下方的(列表 8.7 所示的 `AddRigidBody()` 函数负责将刚体添加到 `PhysX`\
  \ 模拟上下。它接受一个 `Entity` 对象作为参数，并初始化刚体在 `PhysX` 世界中的位姿（pose）或变换（transformation）。刚体的旋转随后使用变换组件（transform\
  \ component）中的旋转进行计算。\n\n#### 列表 8.7: Physics/Context.h\n\n```cpp\n#pragma once\n\
  \n#include \"Callback.h\"\n#include \"Utilities.h\"\n\nnamespace Empy\n{\n    struct\
  \ PhysicsContext\n    {\n        /* ... same as before ... */\n\n        EMPY_INLINE\
  \ void AddRigidBody(Entity& entity)\n        {\n            auto& transform = entity.template\
  \ Get<TransformComponent>().Transform;\n            auto& body = entity.template\
  \ Get<RigidBodyComponent>().RigidBody;\n            bool hasCollider = entity.template\
  \ Has<ColliderComponent>();\n\n            // create rigidbody transformation\n\
  \            PxTransform pose(ToPxVec3(transform.Translate));\n            glm::quat\
  \ rot(transform.Rotation);\n            pose.q = Pxat(rot.x, rot.y, rot.z, rot.w);\n\
  \n            // create a body actor\n            if(entity.template Has<ColliderComponent>())\n\
  \            {\n                // create shape\n                auto& collider\
  \ = entity.template Get<ColliderComponent>().Collider;\n\n                // create\
  \ material\n                collider.Material = m_Physics->createMaterial(\n   \
  \                 collider.StaticFriction,\n                    collider.DynamicFriction,\
  \ collider.Restitution\n                );\n\n                if(collider.Type ==\
  \ Collider3D::BOX)\n                {\n                    PxBoxGeometry box(ToPxVec3(transform.Scale/2.0f));\n\
  \                    collider.Shape = m_Physics->createShape(box, *collider.Material);\n\
  \                }\n                else if(collider.Type == Collider3D::SPHERE)\n\
  \                {\n                    PxSphereGeometry sphere(transform.Scale.x/2.0f);\n\
  \                    collider.Shape = m_Physics->createShape(sphere, *collider.Material);\n\
  \                }\n                else if(collider.Type == Collider3D::MESH)\n\
  \                {\n                    // coming next!\n                }\n   \
  \             else\n                {\n                    EMPY_ERROR(\"Error creating\
  \ collider invalid type\");\n                    return;\n                }\n  \
  \          }\n\n            // create actor instance\n            if(body.Type ==\
  \ RigidBody3D::DYNAMIC)\n            {\n                body.Actor = PxCreateDynamic(*m_Physics,\
  \ pose, *collider.Shape, body.Density);\n                body.Actor->setActorFlag(PxActorFlag::eSEND_SLEEP_NOTIFIES,\
  \ true);\n            }\n        }\n    };\n}\n```\n\n\n\n\n\n```cpp\nelse if(body.Type\
  \ == RigidBody3D::STATIC)\n{\n    body.Actor = PxCreateStatic(*m_Physics, pose,\
  \ *collider.Shape);\n}\n}\nelse\n{\n    if(body.Type == RigidBody3D::DYNAMIC)\n\
  \    {\n        body.Actor = m_Physics->createRigidDynamic(pose);\n    }\n    else\
  \ if(body.Type == RigidBody3D::STATIC)\n    {\n        body.Actor = m_Physics->createRigidStatic(pose);\n\
  \    }\n}\n\n// check actor\nif (!body.Actor)\n{\n    EMPY_ERROR(\"Error creating\
  \ dynamic actor\");\n    return;\n}\n\n// set user data to entt id\nbody.Actor->userData\
  \ = new EntityID(entity.ID());\n\n// add actor to the m_Scene\nm_Scene->addActor(*body.Actor);\n\
  }};\n}\n}\n```\n\n该函数首先从实体中提取必要的组件，例如变换和刚体数据。它还会通过检查实体中是否存在碰撞体。接下来，如果存在碰撞体，函数将继续创建碰撞体形状和材质。函数会确定碰撞体的类型（箱体或球体），并据此创建相应的\
  \ PhysX 几何体。在创建碰撞体形状和材质后，该函数根据刚体类型（动态或静态）创建一个 PhysX actor。对于动态刚体，它会设置额外的属性，例如密度和休眠通知标志（如果我们希望对象通知其状态，这是必须的）。如果没有碰撞体，该函数将根据刚体类型直接创建动态或静态\
  \ actor。\n\n如果 actor 创建成功，我们将 PhysX actor 的用户数据（user data）设置为该实体的 ID，从而允许在我们的 ECS\
  \ 框架中建立物理模拟与实体之间的关联。最后，将 actor 添加到物理场景中。此处的用户数据至关重要。没有它，我们就无法知道物理模拟中哪个实体拥有哪个刚体。这还将防止我们无法发布包含正确参与碰撞的实体的事件。\n\
  \n### 网格网格碰撞体 (Mesh Colliders)\n\n在某些情况下，你可能出于特定原因想为你的碰撞体创建自定义形状。PhysX 也可以实现这一点。`PhysicsContext`\
  \ 的以下成员函数提供了实现该目标的方法。\n\n**列表 8.8：Physics/Context.h**\n\n```cpp\n/* ... same as\
  \ before ... */\n\nEMPY_INLINE PxConvexMeshGeometry CookMesh(const MeshData<ShadedVertex>&\
  \ data)\n{\n    // px 顶点容器\n    std::vector<PxVec3> vertices;\n\n    // 转换位置属性\n\
  \    for(auto& vertex : data.Vertices)\n    {\n        vertices.push_back(ToPxVec3(vertex.Position));\n\
  \    }\n    PxConvexMeshDesc meshDesc;\n    // 顶点\n    meshDesc.points.data = vertices.data();\n\
  \    meshDesc.stride = sizeof(PxVec3);\n    meshDesc.count = vertices.size();\n\
  \    // 索引\n    meshDesc.indices.data = data.Indices.data();\n    meshDesc.count\
  \ = data.Indices.size();\n    // 标志\n    meshDesc.flags = PxConvexFlag::COMPUTE_CONVEX;\n\
  \n    // 烘焙网格\n    PxCookingParams cookingParams = PxCookingParams(PxTolerancesScale());\n\
  \    PxCooking* cooking = PxCreateCooking(PX_PHYSICS_VERSION, *m_Foundation, cookingParams);\n\
  \    PxConvexMeshResult::Enum result;\n    PxConvexMesh* convexMesh = cooking->createConvexMesh(meshDesc,\
  \ m_Physics->getPhysicsCallback(), &result);\n    PxConvexGeometry meshGeometry(convexMesh);\n\
  \n    cooking->release();\n    return meshGeometry;\n}\n```\n\n你可以看到该函数接收了一个 `MeshData<ShadedVertex>`\
  \ 参数，这与我们在上一部分创建的网格相似。函数首先以 PhysX 能够理解的方式转换顶点。然后，它定义了网格的所有配置，并最终创建出一个 `PxConvexGeometry`。这个过程在\
  \ PhysX 中被称为“烘焙”（Cooking）。随后可以在 `Rigidbody()` 中调用此函数，为带有网格的刚性 actor 创建自定义形状。\n\n\
  #### 8.1.4 处理物理\n\n物理模拟通过对象之间的交互变得生动。我们需要使用物理来执行所有模拟，以便稍后可以使用这些结果来渲染场景中的实体。使用 PhysX\
  \ 这一点非常简单。下面的代码片段（列表 8.9）提供了 `Simulate()` 函数的实现，该函数使用调度器运行所有模拟。\n\n**列表 8.9：Physics/Context.h**\n\
  \n```cpp\n/* ... same as before ... */\n\nEMPY_INLINE void Simulate(uint32_t step,\
  \ float dt)\n{\n    for (int i = 0; i < step; ++i)\n    {\n        // 为一个时间步模拟 m_Physics\
  \ \n        m_Scene->simulate(dt);\n\n        // 阻塞直到模拟完成\n        m_Scene->fetchResults(true);\n\
  \    }\n}\n```\n\n该函数遍历指定的模拟步数。在每次迭代中，它为一秒的时间步模拟物理场景，这仅仅是增量时间（delta-time，稍后会详细介绍）。步数越高，模拟越快，反之亦然。然后调用\
  \ `fetchResults()` 方法并将参数设置为 `true`，确保函数会阻塞直到当前步的模拟完成并获取结果。这是必要的，因为我们有多个异步工作线程在执行计算。这里是\
  \ `PhysicsContext` 类的完整代码：\n\n**列表 8.10：Physics/Context.h**\n\n```cpp\n#pragma once\n\
  #include \"Callback.h\"\n#include \"Utilities.h\"\n\nnamespace Empy\n{\n    struct\
  \ PhysicsContext\n    {\n        EMPY_INLINE PhysicsContext()\n        {\n     \
  \       // 初始化 physX SDK\n            m_Foundation = PxCreateFoundation(PX_PHYSICS_VERSION,\
  \ m_AllocatorCallback, m_ErrorCallback);\n            if (!m_Foundation)\n     \
  \       {\n                EMPY_ERROR(\"Error initializing PhysX m_Foundation\"\
  );\n                return;\n            }\n\n            // 创建上下文实例\n         \
  \   m_Physics = PxCreatePhysics(PX_PHYSICS_VERSION, *m_Foundation, PxTolerancesScale());\n\
  \            if (!m_Physics)\n            {\n                EMPY_ERROR(\"Error\
  \ initializing PhysX m_Physics\");\n                m_Foundation->release();\n \
  \               return;\n            }\n\n            // 创建线程\n            m_Dispatcher\
  \ = PxDefaultCpuDispatcher(2);\n\n            // 创建描述\n            PxSceneDesc sceneDesc(PxTolerancesScale());\n\
  \            sceneDesc.simulationCallback = &EventCallback;\n            sceneDesc.gravity\
  \ = PxVec3(0.0f, -9.81f, 0.0f);\n            sceneDesc.filterShader = CustomFilterShader;\n\
  \            sceneDesc.cpuDispatcher = m_Dispatcher;\n\n            // 创建场景实例\n\
  \            m_Scene = m_Physics->createScene(sceneDesc);\n            if (!m_Scene)\n\
  \            {\n                EMPY_ERROR(\"Error creating PhysX m_Scene\");\n\
  \                m_Physics->release();\n                m_Foundation->release();\n\
  \                return;\n            }\n        }\n    };\n}\n```\n\n\n\n\n\n```cpp\n\
