  \n![Picture]](image_rsrc760.jpg)\n\n# 7 骨骼动画\n\n勤劳必有收获，但徒口空谈只会贫穷（所罗门王）\n\n骨骼动画，也称为绑定（rigging），是一种在计算机图形和动画中广泛使用的技术，用于为角色赋予生命和运动。它涉及使用相互连接的骨骼或关节的层级结构形成骨架，然后将其与\
  \ 3D 模型关联。\n\n***\n\n![PIC](img/image_rsrc761.jpg)\n\n| 图 7.1: | 骨骼动画关节 Mixamo |\n\
  \n***\n\n每根骨骼代表模型的一个片段，它们的排列模拟了角色的底层结构。\n\n## 7.1 重要概念\n\n骨骼动画的主要目的是为动画或视频游戏中的角色创建真实且动态的运动。骨骼动画不是对\
  \ 3D 模型的每个顶点进行动画（这计算开销大且耗时），而是通过操作骨架的骨骼来工作的。骨骼的运动随后传递到附着的顶点，从而相应地变形角色模型。\n\n骨骼动画的关键组件包括：\n\
  \n*   **骨骼/关节**：骨架的结构元素，代表角色的不同部分。每根骨骼都有局部变换，并且它们按层级组织。参见（图 7.2\n\n    | 图 7.2:\
  \ | 关节层级 |\n\n    ***\n\n*   **皮肤/顶点**：构成 3D 模型点。这些顶点通过称为顶点权重（vertex weighting）的过程与特定的骨骼关联，这决定了每根骨骼对特定顶点的影响程度。\n\
  \n*   **动画**：骨骼动画涉及创建关键帧并定义骨骼随时间移动的方式。关键帧之间的插值产生平滑且真实的运动。\n\n*   **逆向动力学**：在某些情况下，使用逆向动力学直接控制骨骼的末端执行器（如手或脚），允许更自然直观的动画。\n\
  \n骨骼动画提供了许多优点，包括动画的高效存储、在具有相似骨骼的不同角色上重复使用动画的能力，以及为动画师提供更直观的工作流。它被广泛应用于游戏、电影和虚拟现实等行业，以创建栩如生的角色动作。\n\
  \n### 7.1.1 动画关键帧\n\n动画中的关键帧是特定时间点的标记。它本质上是一个包含该时刻物体或角色状态基本信息的帧。关键帧对于定义动画元素的整体运动至关重要。以下是关键帧中通常包含的组件：\n\
  \n*   **位置**：关键帧的位置组件指定了物体或角色的位置。在骨骼动画中，这通常指骨骼或关节的 3D 坐标 `x`、`y`、`z`。\n*   **旋转**：关键帧中的旋转信息定义了物体或角色的朝向。它指定了物体或角色绕每个轴（`roll`、`pitch`、`yaw`）旋转的程度。在骨骼动画中，这通常使用四元数表示以避免万向锁。\n\
  *   **缩放**：关键帧的缩放组件决定了物体或角色沿每个轴（`x`、`y`、`z`）的尺寸或缩放因子。缩放对于控制元素随时间的变化非常重要。\n*   **时间戳**：每个关键帧与特定时间点相关，由时间戳或帧数表示。这指示了关键帧在整个时间轴上的位置。关键帧的时间对于控制动画的节奏和流畅度至关重要。\n\
  *   **插值信息**：指定动画元素如何过渡到关键帧。它包含了用于位置、旋转和缩放的插值类型。\n*   **额外参数**：根据动画系统，关键帧可能包含特定于要求的额外参数。例如，在复杂系统中，关键帧可能包含与变形、约束或动画元素特定属性的信息。\n\
  \n通过在时间轴上策略性地定义关键帧，我们可以创建一个连续播放时产生平滑连贯动作的序列。\n\n### 7.1.2 关键帧插值\n\n骨骼动画中的关键帧插值涉及在两个关键帧之间生成中间帧，以实现平滑自然的运动。该过程确保从一个姿态到另一个姿态的过渡在视觉上是良好且真实的。以下是如何进行关键帧插值的解释：\n\
  \n*   **关键帧**：动画师在动画时间轴上定义关键帧来表示重要的姿态或位置。每个关键帧包含该时刻中每根骨骼的位置、旋转和缩放信息。\n*   **插值类型**：动画师为关键帧之间的每个参数（位置、旋转、缩放）选择插值类型。常见的类型是线性插值和样条插值。\n\
  *   **线性插值**：线性插值是最简单的插值形式。它在两个关键帧之间创建直线。例如，对于位置插值，任何给定帧的新位置都是基于两个关键帧位置之间的线性进展计算的。\n\
  \n\n\n\n\n![P (t) = (1 − t) ⋅Pstart + t⋅Pend](img/image_rsrc763.jpg)\n\n其中： - `P(t)`\
  \ 是时间 `t` 处的插值位置。 - `Pstart` 是起始关键帧的位置。 - `Pend` 是结束关键帧的位置。 - `t` 从 0 变化到 1，代表插值进度。\n\
  \n*   **样条插值 (Spline Interpolation)**：样条插值（如三次样条）通过通过使用数学曲线在关键帧之间提供更平滑的过渡。插值函数不是直线，而是贯穿于两个关键帧的曲线，从而产生更自然的运动效果。\n\
  \n![P (t) = (2t3 − 3t2 + 1) ⋅Pstart + (t3 − 2t2 + t)⋅Tstart+](img/image_rsrc764.jpg)![((-\
  \ 2t3 + 3t2)⋅Pend + (t3 − t2) ⋅Tend](img/image_rsrc765.jpg)\n\n其中： - `P(t)` 是时间\
  \ `t` 处的插值位置。 - `Pstart` 和 `Pend` 是起始和结束关键帧的位置。 - `Tstart` 和 `Tend` 是代表起始和结束关键帧曲线方向的切向量。\n\
  \n*   **四元数球面线性插值 (Quaternion Slerp)**：对于旋转插值，通常使用四元数球面线性插值（slerp）来确保关键帧之间的旋转平滑，同时避免万节锁问题。\n\
  \n![Q (t) = slerp(Qstart,Qend,t)](img/image_rsrc766.jpg)\n\n其中： - `Q(t)` 是时间 `t`\
  \ 处的插值四元数。 - `Qstart` 和 `Qend` 代表起始和结束关键帧旋转的四元数。 - `t` 从 0 变化到 1。\n\n通过将这些插值技术应用于骨骼中每个骨头的参数（位置、旋转、缩放），可以实现关键帧之间光滑连续的动画。线性插值和样条插值之间的选择取决于所需的运动风格和动画的艺术目标。我们将对位置和缩放使用线性插值，对旋转使用四元数\
  \ slerp。\n\n### 7.1.3 关节变换\n\n在骨骼动画中，将关节从局部空间转换到全局空间涉及应用考虑关节间父子关系的层级变换。每个关节都有自己的局部变换，表示其相对于其父关节的位置、朝向和缩放。目标是计算每个关节的全局变换，表示其在整个骨骼中的位置。\n\
  \n将关节从局部空间转换为全局空间的典型过程涉及以下步骤：\n\n*   **骨骼层级遍历**：从根关节开始，以深度优先的方式遍历骨骼层级。这确保了变换从父关节传播到子关节。\n\
  *   **局部变换**：在每个关节处，计算其局部变换矩阵。该矩阵包含了关节的局部平移、旋转和缩放信息。它代表关节相对于其父关节的变换。\n*   **全局变换**：当我们向上遍历层级（从子关节到父关节时，累积局部变换。这种累积产生了每个关节的全局变换，表示其在整个骨骼中的位置和朝向。\n\
  *   **变换组合**：最后，通过将关节的局部变换矩阵与其父关节的累积全局变换矩阵相乘，计算出每个关节的全局变换矩阵。这种组合允许变换通过层级结构进行正确传播。\n\
  \n变换过程可以表示如下：\n\n![GTjoint = PGTjoint × LTjoint](img/image_rsrc767.jpg)\n\n其中：`GTjoint`\
  \ 是当前关节的全局变换矩阵。`PGTjoint` 是其父关节的全局变换矩阵。`LTjoint` 是当前关节的局部变换矩阵。这确保了每个关节的变换在全局坐标系中正确表示，并考虑了其相对于父关节以及整个骨骼的位置。\n\
  \n### 7.2 实现动画\n\n关于骨骼动画有很多可以说的，但我认为那并不是你读这本书的原因。让我们继续并编写一些代码。我们必须做的第一件事是更新项目的目录树，如下方的图\
  \ 7.3\n\n| 图 7.3: | 模型目录 |\n\n* * *\n\n#### 7.2.1 动画数据\n\n我们需要以简单的方式封装所有关于动画的各种信息，以便我们在动画器中使用它们。让我们从动画、关键帧和关节开始。在列表\
  \ 7.1 中所示的代码包含三个我们需要处理的重要结构。第一个结构 `Animation` 封装了与动画相关的信息。它包含了参数，例如以秒为单位的持续时间、控制播放速度的速度因子以及一个便于引用的名称。\n\
  \n| 列表 7.1: | Graphics/Models/Animation.h |\n\n```cpp\n#pragma once\n\n#include\
  \ \"Helper.h\"\n\nnamespace Empy\n{\n    struct Animation\n    {\n        float\
  \ Duration = 0.0f;\n        float Speed = 1.0f;\n        std::string Name;\n   \
  \ };\n\n    struct KeyFrame\n    {\n        glm::vec3 Position = glm::vec3(0.0f);\n\
  \        glm::quat Rotation = glm::vec3(0.0f);\n        glm::vec3 Scale = glm::vec3(1.0f);\n\
  \    };\n\n    struct Joint\n    {\n        std::vector<Joint> Children;\n     \
  \   std::vector<KeyFrame> Keys;\n        std::string Name;\n        glm::mat4 Offset;\
  \ // 逆变换\n        int32_t Index;\n    };\n}\n```\n\n第二个结构 `KeyFrame` 代表时间上的特定时刻，包含了关节的变换数据。这包括以向量表示的\
  \ 3D 位置、以四元数存储的旋转、缩放信息以及关键帧发生的时间戳。第三个结构 `Joint` 代表层级中的一个关节。一个关节拥有子关节、随时间变化的关键帧集合、名称以及由\
  \ 4 矩阵表示的偏移。\n\n#### 7.2.2 骨骼网格\n\n在我们尝试从模型文件加载动画之前，必须先创建一个顶点类型以及一种适用于对象的网格类型。\n\
  \n##### 骨骼顶点\n\n在以下代码中，你可以观察到骨骼顶点类似于渲染顶点，但为了适应动画增加了额外的属性。初始属性是一个用于存储影响顶点的关节标识符的\
  \ `Vector4`\n\n| 列表 7.2: | Graphics/Buffers/Vertex.h |\n\n```cpp\nnamespace Empy\n\
  {\n    struct SkeletalVertex\n    {\n        glm::vec3 Position = glm::vec3(0.0f);\n\
  \        glm::vec3 Normal = glm::vec3(0.0f);\n        glm::vec2 UVs = glm::vec2(0.0f);\n\
  \n        // 用于光照\n        glm::vec3 Tangent = glm::vec3(0.0f);\n        glm::vec3\
  \ Bitangent = glm::vec3(0.0f);\n\n        // 用于动画\n        glm::ivec4 Joints = glm::ivec4(-1);\n\
  \        glm::vec4 Weights = glm::vec4(0.0f);\n    };\n\n    // ...\n}\n```\n\n\
  第二个属性 `Weights` 量化第一个属性中的关节对该顶点的影响。较大的值表示影响较大，而较小的值表示影响较微妙。这种行为反映了现实世界的场景，例如，转手臂对身体某些部分的影响大于其他部分。\n\
