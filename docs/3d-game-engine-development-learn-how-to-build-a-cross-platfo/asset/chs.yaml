  \n还有其他 PBR 技术，例如。\n\n### 6.5 全局光照\n\n天空盒（Skybox）通常与场景的其他部分分开渲染。它通常首先绘制并作为背景，提供深度感和氛围。物体与环境之间的交互。\n\
  \n***\n\n![PIC](img/image_rsrc756.jpg)\n\n| 图 6.22: | 全局光照 |\n\n***\n\n计算机图形中称为\
  \ `cube map`（立方体贴图）的特定纹理。`cube map` 不是平面的 2D 图片，而是由六张 2D 图片组成形成立方体的六个面。\n\n***\n\
  \n![PIC](img/image_rsrc757.jpg)\n\n| 图 6.23: | 基于图像的光照（IBL） |\n\n***\n\n此图对我们将要进行的步骤提供了高层次描述。第一步涉及从高动态范围（HDR）生成环境。\n\
  \n#### 6.5.1 天空盒\n\n天空盒是一种模拟从特定点观察环境的技术。\n\n***\n\n![PIC](img/image_rsrc758.jpg)\n\
  \n| 图 6.24: | 立方体贴图面 |\n\n***\n\n`cube map` 的六个面代表了沿 `x`、`y` 和 `z` 轴正负方向的视图。每个面对应一个特定的方向：正\
  \ X（右）、负 X（左）、正 Y（上）、负 Y（下）、正 Z（前）、负 Z（后）。\n\n在 OpenGL 或其他图形 API 中，`cube map` 是通过将这些图像组合成特定的纹理格式创建的。随后，它们被用于着色器以模拟反射、环境光照，或通过将立方体贴图的不同面映射到\
  \ 3D 空间中的特定方向作为背景场景。\n\n\n\n\n\n`SkyboxVertex` 结构仅包含位置（position）属性。因为天空盒只是一个在场景周围渲染的立方体，它不需要额外的属性。后续的（列表\
  \ 6.49）是更新后的 `mesh` 类构造函数，其中增加了天空盒顶点。\n\n#### 列表 6.49: Graphics/Buffers/Mesh.h\n\
  \n```cpp\nEMPY_INLINE Mesh(const MeshData<Vertex>& data)\n{\n    /* ... 与之前相同 ...\
  \ */\n\n    // 处理顶点类型\n    if (TypeID<Vertex>() == TypeID<ShadedVertex>())\n   \
  \ {\n        SetAttribute(0, 3, (void*)offsetof(ShadedVertex, Position));\n    \
  \    SetAttribute(1, 3, (void*)offsetof(ShadedVertex, Normal));\n        SetAttribute(2,\
  \ 2, (void*)offsetof(ShadedVertex, UVs));\n        SetAttribute(3, 3, (void*)offsetof(ShadedVertex,\
  \ Tangent));\n        SetAttribute(4, 3, (void*)offsetof(ShadedVertex, Bitangent));\n\
  \    }\n    else if (TypeID<Vertex>() == TypeID<FlatVertex>())\n    {\n        SetAttribute(0,\
  \ 3, (void*)offsetof(FlatVertex, Position));\n        SetAttribute(1, 4, (void*)offsetof(FlatVertex,\
  \ Color));\n    }\n    else if (TypeID<Vertex>() == TypeID<QuadVertex>())\n    {\n\
  \        SetAttribute(0, 4, (void*)offsetof(QuadVertex, Data));\n    }\n    else\
  \ if (TypeID<Vertex>() == TypeID<SkyboxVertex>()) // <-- 天盒顶点\n    {\n        SetAttribute(0,\
  \ 3, (void*)offsetof(SkyboxVertex, Position));\n    }\n    else\n    {\n       \
  \ EMPY_ERROR(\"invalid vertex type!\");\n    }\n\n    // 解绑顶点数组\n    glBindVertexArray(0);\n\
  }\n// ...\n```\n\n此外，我们还添加了 \"Skybox.h\" 头文件，如所示（列表 6.50），用于实现创建和渲染天空盒网的辅助函数。\n\n\
  #### 列表 6.50: Graphics/Utilities/Skybox.h\n\n```cpp\n#pragma once\n\n#include \"\
  ../Buffers/Mesh.h\"\n\nnamespace Empy\n{\n    // 天盒网类型定义\n    using SkyboxMesh =\
  \ std::unique_ptr<Mesh<SkyboxVertex>>;\n\n    // 渲染天空盒网\n    EMPY_INLINE void RenderSkyboxMesh(SkyboxMesh&\
  \ mesh)\n    {\n        // 开启背面剔除\n        glEnable(GL_CULL_FACE);\n        glCullFace(GL_BACK);\n\
  \n        // 禁止写入深度缓冲区\n        glDepthMask(GL_FALSE);\n\n        // 将深度函数设置为 LEQUAL（小于或等于）\n\
  \        glDepthFunc(GL_LEQUAL);\n\n        // 使用三角形绘制天空盒网\n        mesh->Draw(GL_TRIANGLES);\n\
  \n        // 将深度函数重置为 LESS（默认）\n        glDepthFunc(GL_LESS);\n\n        // 再次开启写入深度缓冲区\n\
  \        glDepthMask(GL_TRUE);\n\n        // 关闭面剔除\n        glDisable(GL_CULL_FACE);\n\
  \    }\n\n    // 创建天空盒网\n    EMPY_INLINE SkyboxMesh CreateboxMesh()\n    {\n   \
  \     // 立方体顶点\n        std::vector<glm::vec3> positions = {\n            {-1.0f,\
  \ 1.0f, -1.0f},\n            {-1.0f, -1.0f, -1.0f},\n            {1.0f, -1.0f, -1.0f},\n\
  \            {1.0f, 1.0f, -1.0f},\n            {1.0f, 1.0f, -1.0f},\n          \
  \  {-1.0f, 1.0f, -1.0f},\n            {-1.0f, -1.0f, 1.0f},\n            {-1.0f,\
  \ 1.0f, 1.0f},\n            {1.0f, 1.0f, 1.0f},\n            {1.0f, -1.0f, 1.0f},\n\
  \            {1.0f, -1.0f, -1.0f},\n            {-1.0f, -1.0f, -1.0f},\n       \
  \     {1.0f, -1.0f, -1.0f},\n            {1.0f, -1.0f, 1.0f},\n            {1.0f,\
  \ 1.0f, 1.0f},\n            {1.0f, 1.0f, 1.0f},\n            {1.0f, 1.0f, -1.0f},\n\
  \            {1.0f, -1.0f, -1.0f},\n            {-1.0f, -1.0f, 1.0f},\n        \
  \    {-1.0f, 1.0f, 1.0f},\n            {-1.0f, 1.0f, 1.0f},\n            {1.0f,\
  \ 1.0f, 1.0f},\n            {1.0f, 1.0f, 1.0f},\n        };\n\n        MeshData<SkyboxVertex>\
  \ data;\n        for (const auto& pos : positions)\n        {\n            data.push_back({pos});\n\
  \        }\n\n        return std::make_unique<Mesh<SkyboxVertex>>(data);\n    }\n\
  }\n```\n\n\n\n\n转向片元着色器，它接收在顶点着色器中计算出的归一化世界位置。利用该位置，它将 3D 球形坐标转换为 2D 纹理坐标。这种转换涉及\
  \ `atan()` 和 `asin()` 函数，随后通过缩放和偏移调整将球形坐标映射到 2D 空间。生成的纹理坐标随后用于采样 2D 纹理（width.3em\
  \ map），从球形纹理中提取颜色值。最后，将得到的颜色分配给片元输出。\n\n该着色器的 C++ 抽象如代码段所示（列表 6.52）。与我们在 PBR 着色器中所做的类似，我们首先在构造函数中从着色器获取统一变量（uniforms）的位置。`Generate()`\
  \ 函数负责创建立方体贴图并使用参数提供的环境图中采样的值填充各个面。\n\n该函数首先定义了在渲染各个面时相机将面对的所有不同视图方向（左、右、上、下等）。这对于渲染立方体贴图的所有面至关重要。接着，它生成一个新的纹理，并将其绑定为\
  \ `GL_TEXTURE_CUBE_MAP`。这就是 OpenGL 区分 2D 纹理和立方体贴图的原因。后续的 `for` 循环初始化面的尺寸。\n\n在后续部分，我们生成一个帧缓冲区和一个渲染缓冲区对象，作为渲染目标。第二个\
  \ `for` 循环将随后使用天空盒网格（skybox mesh）渲染立方体贴图的每个面。函数最后通过删除所有分配的缓冲区并返回立方体贴图缓冲区 ID 来结束。\n\
  \n| Listing 6.52: Graphics/Shaders/SkyMap.h |\n\n```cpp\n#pragma once\n\n#include\
  \ \"Shader.h\"\n#include \"../Utilities/Skybox.h\"\n\nnamespace Empy\n{\n    struct\
  \ SkyMapShader : Shader\n    {\n        EMPY_INLINE SkyMapShader(const std::string&\
  \ path): Shader(path)\n        {\n            u_View = glGetUniformLocation(m_ShaderID,\
  \ \"u_view\");\n            u_Proj = glGetUniformLocation(m_ShaderID, \"u_proj\"\
  );\n            u_Map = glGetUniformLocation(m_ShaderID, \"u_map\");\n        }\n\
  \n        EMPY_INLINE uint32_t Generate(Texture& texture, SkyboxMesh& mesh, int32_t\
  \ size)\n        {\n            // view matrices\n            glm::mat4 views[]\
  \ = {\n                glm::lookAt(glm::vec3(0.0f), glm::vec3(1.0f, 0.0f, 0.0f),\
  \ glm::vec3(0.0f, -1.0f, 0.0f)),\n                glm::lookAt(glm::vec3(0.0f), glm::vec3(-1.0f,\
  \ 0.0f, 0.0f), glm::vec3(0.0f, -1.0f, 0.0f)),\n                glm::lookAt(glm::vec3(0.0f),\
  \ glm::vec3(0.0f, 1.0f, 0.0f), glm::vec3(0.0f, 0.0f, -1.0f)),\n                glm::lookAt(glm::vec3(0.0f),\
  \ glm::vec3(0.0f, -1.0f, 0.0f), glm::vec3(0.0f, 0.0f, 1.0f)),\n                glm::lookAt(glm::vec3(0.0f),\
  \ glm::vec3(1.0f, 0.0f, 0.0f), glm::vec3(0.0f, 0.0f, -1.0f)),\n                glm::lookAt(glm::vec3(0.0f),\
  \ glm::vec3(-1.0f, 0.0f, 0.0f), glm::vec3(0.0f, 0.0f, 1.0f))\n            };\n \
  \           // projection matrix\n            glm::mat4 proj = glm::perspective(glm::radians(90.0f),\
