  \ 6.5\n\n| 图 6.5:  PBR 渲染 |\n\n***\n\n### 6.2.2 基础材质\n\n你可能已经注意到，定义渲染对象材质的几个关键参数是硬编码的。这导致了静态的渲染流水线，限制了我们渲染具有不同外观的对象的能力。为了解决这个问题，我们需要能够在\
  \ CPU 端使用 `GLSL-uniforms` 创建并控制这些参数。\n\n计算机图形中的材质是基础元素，定义了表面在虚拟环境中被光照和观察时的外观。它们封装了颜色、反射率、透明度以及表面如何与光交互等视觉属性。每种材质类型都定义了光如何与表面交互，从而影响其视觉特征。\n\
  \n在 PBR 中，材质由几个组件定义，这些组件共同控制光如何与表面交互。\n\n- **反射率 (ρ)**：代表材质的基础颜色，决定了它在漫反射光照射时的固有颜色。通常用符号\
  \ `ρ` 表示，它影响表面在均匀光照条件下的感知颜色。例如，在着色器中，`albedo` 是未应用任何光照效果的材质 RGB 颜色。\n- **金属度 (m)**：定义材质看起来是金属还是非金属。金属表面会表现出类似于铜或铁等金属的强反射，而非金属表面倾向于具有类似于塑料或木材的漫反射。通常值在\
  \ 0 和 1 之间，其中 0 代表非金属（电介质）材质，1 代表全金属表面。在着色器中，`metallic` 决定了高光和漫反射之间的平衡。\n- **粗糙度\
  \ (α)**：代表材质的微观表面不平整度或光滑度。较低的粗糙度会导致表面更光滑，反射更集中、更锐利，类似于抛光表面。相反，较高的粗糙度会导致散射和漫反射，类似于粗糙或亚光质的表面。通常用从\
  \ 0（完全光滑）到 1（非常粗糙）之间的值表示。在着色器中，`roughness` 控制高光反射的模糊程度或锐利度。\n\n调整这些参数可以创建多样化且真实的材质外观，模拟各种真实世界的表面和光照条件。（图\
  \ 6.4）。\n\n#### 材质类\n\n按照（列表 6.2;\n    float Roughness = 0.5f;\n    float Metallic\
