  \n### 5.4 加载 3D 模型\n\n现在我们的渲染器能够产生一些可见的结果了，让我们从文件中加载模型并渲染它们。为了实现这一点，我们将利用一个名为“Assimp”的常用库。\n\
  \n#### 5.4.1 Assimp 库\n\nAssimp（Open Asset Import Library）是一个强大的开源库，旨在简化在应用程序中导入和处理各种\
  \ 3D 模型格式的过程。它作为不同 3D 模型格式之间的桥梁，为访问和处理这些模型的数据提供了统一的接口。\n\nAssimp 使用 C++ 开发，支持工业界使用的广泛\
  \ 3D 文件格式，包括流行的 OBJ、FBX、COLLADA、glTF 等。它提供了从 3D 模型中访问网格数据、纹理、材质和场景层次结构的功能。它抽象了解析不同文件格式时涉及的复杂性，为访问和操作模型数据提供了一致的接口。这简化了应用程序中渲染、物理模拟和其他涉及\
  \ 3D 模型的操作任务。\n\n该库广泛应用于游戏开发、计算机图形和可视化领域，为处理各种 3D 模型格式提供了方便的解决方案，从而为开发者在处理文件格式复杂性方面节省了宝的时间的时间精力。\n\
  \n| Listing 5.29: `Root/conanfile.txt` |\n\n```ini\n[requires]\nglm/cci.20230113\n\
  opengl/system\nspdlog/1.12.0\nassimp/5.2.2\nentt/3.12.2\nglfw/3.3.8\nglew/2.2.0\n\
  \n[generators]\ncmake\n\n[options]\nassimp:shared=False\nglew:shared=False\nglfw:shared=False\n\
  ```\n\n如（Listing [5.29]）所示更新你的 `conanfile.txt`，并如（Figure [5.23]）所示扩展你的项目目录树。\n\n\
