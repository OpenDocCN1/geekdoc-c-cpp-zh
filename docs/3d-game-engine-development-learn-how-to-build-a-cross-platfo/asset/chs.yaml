  \ `Draw()` 函数，以确保材质纹理单元从单元“4”开始。确保你的纹理单元设置设置（如 `PbrShader` 所示），否则你会遇到很多麻烦。\n\n###\
  \ 渲染器类更新\n\n我们可以简单地在渲染器类中创建此着色器来为我们执行深度映射。因此，请按照以下代码片段更新你的渲染器类。\n\n| 列表 6.79: Graphics/Renderer.h\n\
  \n```cpp\nstruct GraphicsRenderer\n{\n  EMPY_INLINE GraphicsRenderer(int32_t width,\
  \ int32_t height)\n  {\n    /* ... 与之前相同 ... */\n    m_Shadow = std::make_unique<ShadowShader>(\"\
