  \ Helper 函数\n\n（Listing [5.30]）中展示函数在将特定的 Assimp 数据类型转换为 GLM 数据类型方面起着至关重要的作用。我们需要这样做是因为我们内部的\
  \ Vertex 类型使用 GLM 来表示其属性。\n\n| Listing 5.30: `Graphics/Models/Helper.h` |\n\n```cpp\n\
  #pragma once\n#include \"../Buffers/Mesh.h\"\n#include <assimp/quaternion.h>\n#include\
  \ <assimp/matrix4x4.h>\n#include <assimp/color4.h>\n\nnamespace Empy\n{\n    EMPY_INLINE\
  \ static glm::vec3 AssimpToVec3(const ai3D& v)\n    {\n        return glm::vec3(v.x,\
  \ v.y, v.z);\n    }\n    EMPY_INLINE static glm::vec4 AssimpToVec4(const aiColor4D&\
  \ c)\n    {\n        return glm::vec4(c.r, c.g, c.b, c.a);\n    }\n    EMPY_INLINE\
  \ static glm::quat AssimpToQuat(const aiQuaternion& q)\n    {\n        return glm::quat(q.w,\
  \ q.x, q.y, q.z);\n    }\n    EMPY_INLINE static glm::mat4 AssimpToMat4(const aiMatrixx4&\
  \ from)\n    {\n        glm::mat4 to;\n        //the a, b, c, d in assimp is the\
  \ row; the 1, 2, 3, 4 is the column\n        to[0][0] = from.a1; to[1][0] = from.a2;\
  \ to[2][0] = from.a3; to[3][0] = from.a4;\n        to[0][1] = from.b1; to[1][1]\
  \ = from.b2; to[2][1] = from.b3; to[3][1] = from.b4;\n        to[0][2] = from.c1;\
  \ to[1][2] = from.c2; to[2][2] = from.c3; to[3][2] = from.c4;\n        to[0][3]\
  \ = from.d1; to[1][3] = from.d2; to[2][3] = from.d3; to[3][3] = from.d4;\n     \
  \   return to;\n    }\n}\n```\n\n确保此代码已添加到你的项目中。\n\n#### 5.4.2 Model 类\n\n（Listing\
