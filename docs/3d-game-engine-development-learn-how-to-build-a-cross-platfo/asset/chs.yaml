  \n在我们继续将光源集成到场景中之前，我们首先想介绍一些 PBR 的重要概念。这些概念有助于捕捉模型的微表面面以产生真实的视觉效果。我们将引入这些概念，并随后将其包含在我们的着色器中以扩展功能。\n\
  \n### Fresnel 方程\n\nFresnel 效应是 PBR 中的一个关键组成部分，描述了光如何根据视角角度和材质属性在表面反射。它决定了在两种介质（例如空气和材料）界面上的反射光与透射光的比例。\n\
  \nFresnel 效应在理解相对于视角角度从表面反射多少光方面起着至关重要的作用。这种效应根据材质属性而变化。\n\n\n\n\n\n# 图 6.6：菲涅尔反射效应\n\
  \n（图 6.6）提供了该原理的视觉表示，而（列表 6.10）所示的代码是 GLSL 的实现。你可以在这里 Dorian 找到关于该概念的更详细的解释。\n\n\
  ## 列表 6.10：菲涅尔函数\n\n```cpp\nvec3 FresnelSchlick(float cosTheta, vec3 F0)\n{\n  return\
  \ F0 + (1.0 - F0) * pow(1.0 - cosTheta, 5.0);\n}\n```\n\n## Smith, Schlick GGX\n\
  \nGeometry Smith 和 Schlick 函数是 Cook-Torrance 着色模型中的关键组件，用于精确计算规格反射。以下是它们的公式：\n\n\
  ☞ **Smith GGX**: 计算可见性项，该考虑了由于微面分布导致的自遮挡和遮蔽效应。\n\n![--------∘---2NdotV------------\
  \ G1 = 2 2 2 NdotV + r + (1 − r )⋅(NdotV)](img/image_rsrc74F.jpg)![G2 = --------∘---2NdotL------------\
  \ NdotL + r2 + (1 − r2)⋅(N 2 ) dotL](img/image_rsrc74G.jpg)![Gsmith-GGX = G1 ⋅ G2](img/image_rsrc74H.jpg)\n\
  \n其中 `NdotV` 和 `NdotL` 分别是表面法线与视图方向及光源方向的点积。`r` 代表表面粗糙度参数。\n\n☞ **Schlick GGX**:\
  \ 该函数近似了微面分布模型的菲涅尔因子，根据视角控制材料的反射率。\n\n![cos(\U0001D703) FSchlick-GGX (cos(\U0001D703\
  ),r) =----------------- cos(\U0001D703)⋅(1 − r) + r](img/image_rsrc74J.jpg)\n\n\
  其中：`cos(θ)` 是视角方向与微面法线之间夹角的余弦。`r` 代表表面粗糙度参数。\n\n这些函数在 PBR 着色器中至关重要，能够精确模拟具有不同粗糙度表面的规格反射行为。它们允许对可见性和菲涅尔效应进行精确计算，通过考虑微面分布和反射率特征，了渲染材料的真实性。（列表\
  \ 6.11）提供了这些方程在 GLSL 中的实现。你可以在这里找到这些概念的扩展解释：JoeyDeVries HABLE Joe。\n\n## 列表 6.11：Smith\
  \ 和 Slick GGX\n\n```cpp\nfloat GeometrySchlickGGX(float NdotV, float roughness)\n\
  {\n  float r = (roughness + 1.0);\n  float k = (r * r) / 8.0;\n  float num = NdotV;\n\
  \  float denom = NdotV * (1.0 - k) + k;\n  return num / denom;\n}\n\nfloat GeometrySmithGGX(float\
  \ NdotV, float NdotL, float roughness)\n{\n  float ggx1 = GeometrySchlickGGX(NdotV,\
  \ roughness);\n  float ggx2 = GeometrySchlickGGX(NdotL, roughness);\n  return ggx1\
  \ * ggx2;\n}\n```\n\n## GGX 分布\n\n法线分布函数（通常称为 Distribution GGX，Trowbridge-Reitz）描述了微面在表面上的分布，影响了微面产生不同表面取向的概率。\n\
  \n`DistributionGGX` 根据表面粗糙度计算微面表面法线的概率分布：\n\n![-----------r2------------ DGGX (N,H,\
  \ r) = π ⋅[(N ⋅H )2 ⋅(r2 − 1) + 1]2](image_rsrc74K.jpg)\n\n其中 `N` 是表面法线，`H` 是半角向量，位于视角方向和光源方向的中间。`r`\
  \ 是表面粗糙度参数。该公式生成了一个表征微面取向几率的分布曲线。在较高的粗糙度值下，分布会扩展，导致更广泛的表面取向；而较低的粗糙度值则将取向集中在法线方向。（列表\
  \ 6.12 显示了法线分布 GGX 的实现。你可以在这里了解更多：JoeyDeVries。\n\n## 列表 6.12：GGX 分布\n\n```cpp\n\
  float DistributionGGX(vec3 N, vec3 H, float roughness)\n{\n  float a = roughness\
  \ * roughness;\n  float a2 = a * a;\n  float NdotH = max(dot(N, H), 0.0);\n  float\
  \ NdotH2 = NdotH * NdotH;\n  float num = a2;\n  float denom = (NdotH2 * (a2 - 1.0)\
  \ + 1.0);\n  denom = PI * denom * denom;\n  return num / denom;\n}\n```\n\n这些函数将帮助我们更好地组织\
  \ PBR 着色器源代码，并在与光照结合时产生更好的视觉效果。\n\n## 6.3 场景照明\n\n到目前为止，光照是相当静态的，因为只有一个光源。在计算机图形中，各种类型的光照在塑造\
  \ 3D 场景的外观方面起着基础作用。![image_rsrc74M.jpg] 图 7：点光源\n\n### 6.3.1 点光源\n\n我们的着色器到目前一直在使用点光源。现在我们想要在\
