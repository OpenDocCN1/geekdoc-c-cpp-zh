  ```\n\n\n\n\n\nFBO 包含附件（attachments），这些是渲染输出所指向的渲染目标。这些附件可以是纹理，也可以是渲染缓冲区，用于存储颜色信息、深度数据、模板缓冲数据（stencil\
  \ data）或这些者的组合。通过将这些缓冲区附加到 `FBO`，OpenGL 会将场景或物体直接渲染到这些离屏缓冲区中。渲染过程完成后，`FBO` 中附加的渲染目标的内容可以在随后的渲染阶段中作为纹理使用，或者通过绘制带纹理的四边形显示在屏幕上。参见（图\
  \ 5.9）。\n\n## 渲染缓冲区对象 (Render Buffer Object)\n\n渲染缓冲区对象（`RBO`）是一种专门存储各种类型可渲染图像数据的特殊缓冲区。与可以采样并用于各种用途的纹理不同，渲染缓冲区主要作为\
  \ `FBOs` 中的渲染目标，用于离屏渲染。\n\n`RBO` 的主要目的是作为特定可渲染数据的存储介质，例如深度信息、模板缓冲信息或不需要采样的颜色信息。当数据不需要作为纹理直接访问时，通常会使用渲染缓冲区，这使得它们在特定的渲染任务中更加高效。\n\
  \n渲染缓冲区通常作为 `FBOs` 的附件，为渲染操作提供专用的存储。它们的创建和配置方式与纹理类似，但主要区别在于其用例：渲染缓冲区针对渲染任务进行了优化，对于不需要纹理采样的操作，其执行速度通常更快。\n\
  \n## 帧缓冲区类 (Frame Buffer Class)\n\n（列表 5.11）中的代码定义了一个 `FrameBuffer` 结构，作为 OpenGL\
  \ `FBO` 的封装。`FrameBuffer` 构造函数使用 `glGenFramebuffers()` 生成 FBO，并使用 `glBindFramebuffer()`将其绑定到\
  \ OpenGL 上下文中。\n\nOpenGL 是一个有状态的 API。这种有状态的本质是指其内部存储了配置设置，这些设置在被显式修改之前会一直有效。当你设置一个状态时（例如绑定顶点缓冲区或帧缓冲区），这些设置在再次被更改之前都会保持激活状态。\n\
  \n这种设计提供了灵活性，但需要仔细管理以避免意外的副作用。我们需要关注当前的 OpenGL 状态以确保预期的渲染结果，强调显式的状态更改，并尽可能减少不必要的修改，以实现高效且可预测的渲染操作。\n\
  \n### Listing 5.11: Graphics/Buffers/Frame.h\n\n```cpp\n#pragma once\n\n#include\
  \ \"Common/Core.h\"\n\nnamespace Empy\n{\n    struct FrameBuffer\n    {\n      \
