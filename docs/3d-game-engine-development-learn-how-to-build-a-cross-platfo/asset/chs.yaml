  \        std::bitset<GLFW_KEY_LAST> Keys;\n        double MouseX = 0;\n        double\
  \ mouseY = 0;\n    };\n\n```\n\n#### 3.2.3 窗口事件\n\n在 `Events.h` 文件中添加以下代码（列表 [3.16]）。它为鼠标等定义了自定义事件类型。这些事件在从\
  \ GLFW 传输数据到应用程序及其后续层时起着至关重要的作用。\n\n| 列表 3.16：Events.h |\n\n```cpp\n#pragma once\n\
  #include \"Event.h\"\n\nnamespace Empy\n{\n    // Window Events\n    struct WindowMaximizeEvent\
  \ {};\n    struct WindowIconifyEvent {};\n    struct WindowRestoreEvent {};\n  \
  \  struct WindowCloseEvent {};\n    struct WindowResizeEvent\n    {\n        WindowResizeEvent(int32_t\
  \ w, int32_t h) : Width(w), Height(h) {}\n        int32_t Height = 0;\n        int32_t\
  \ Width = 0;\n    };\n\n    // Key Events\n    struct KeyReleaseEvent\n    {\n \
