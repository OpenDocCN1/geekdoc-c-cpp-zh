  }\n\nprivate:\n    std::vector<Widget> m_Windows;\n};\n```\n\n显而易见，此 GUI 上文本质上充当应用层。在\
  \ `AppInterface` 的 `OnStart()` 虚拟函数中，我们的第一步是通过 OpenGL 后端进行 ImGui 初始化。随后，我们利用 \"\
  Helpers.h\" 头文件中定义的常量来加载字体文件。查看成员变量部分，建立了一个组件向量（vector），用于存储在编辑器中创建的所有窗口。鉴于这些窗口被视为组件，因此我们在\
  \ `SelectEvent` 上绑定了一个回调函数，以确保在触发选择事件时，每个窗口都能接收到通知。\n\n你会注意到，该层还提供了额外的虚函数，任何派生自此上下文的类都可以实现它们。`OnUpdate()`\
  \ 函数与 `OnStart()` 函数一样，也是从 `AppInterface` 重写的。在函数开头，使用 `ImGui_ImplOpenGL3_NewFrame()`、`ImGui_ImplGlfw_NewFrame()`\
  \ 和 `ImGui::NewFrame()` 为当前帧初始化 ImGui。\n\n随后，代码设置了主视口，并根据该视口的尺寸配置了主窗口。定义了各种 ImGui\
  \ 窗口标志以自定义主窗口的行为。使用 `ImGui::PushStyleVar()` 和 ImGui::PushStyleColor()` 调整样式设置，修改如填充、背景颜色、边框大小和圆角等属性。然后通过\
  \ `ImGui::Begin()` 启动主窗口，并封装了多个 ImGui 操作。主停靠空间通过 `ImGui::DockSpace()` 建立，以启用各种窗口的停靠功能。代码遍历窗口向量\
  \ (`m_Windows`) 并为每个窗口调用 `OnShow()` 函数，允许在主窗口内进行个性化渲染。\n\n此外，使用 `ImGui::ShowDemoWindow()`\
  \ 显示 ImGui 窗口以供调试。调用 `OnGuiFrame()` 函数处理特定于应用程序界面更新。最后，使用 `ImGui::Render()` 渲染 ImGui\
  \ 绘制数据，并使用 `ImGui_ImplOpenGL3_RenderDrawData()` 执行 OpenGL 特定的渲染。整个过程对于更新和渲染应用程序内的\
  \ GUI 元素至关重要。\n\n### 窗口句柄获取\n\n确保在 `Appinterface` 中实现了 `GetWindowHandle()` 函数，以便\
  \ ImGui 能够获取 GLFW 窗口进行自身初始化。代码如下：\n\n| 列表 12.7: Graphics/Renderer.h |\n\n```cpp\n\
  /* ... 与之前相同 ... */\n\nstruct AppInterface\n{\n    EMPY_INLINE GLFWwindow* GetWindowHandle()\n\
  \    {\n        return m_Context->Window->Handle();\n    }\n\n    EMPY_INLINE uint32_t\
  \ GetSceneFrame()\n    {\n        return m_Context->Renderer->GetFrame();\n    }\n\
  };\n```\n\n你还会注意到一个从渲染器中检索帧缓冲区附件的额外函数。这将帮助我们把场景渲染到 ImGui 窗口中，而不是默认的屏幕帧缓冲区。\n\n###\
  \ 12.3 创建窗口\n\n现在，让我们开始创建各种窗口来构建我们的编辑器，从最显著的一个开始：视口（Viewport）。\n\n![图片]](image_rsrc771.jpg)\n\
  | 图 12.9: 目录 |\n\n### 2.4 视口窗口\n\n视口仅显示场景。如你所知，我们一直在屏幕的默认帧缓冲区中渲染场景。现在我们想要捕获渲染后的场景并使用\
  \ ImGui 显示它。（图 12.10 是视口的预览）。\n\n![图片](img/image_rsrc772.jpg)\n| 图 12.10: 视口窗口 |\n\
  \n#### 2.4.1 渲染到缓冲区\n\n目前，我们的场景直接渲染到默认帧缓冲区。该场景包含颜色附件和泛光附件。然而，出现了一个障碍：无法访问默认帧缓冲器的纹理附件来用\
  \ ImGui 渲染。因此，解决方案是建立一个用于最终场景的额外帧缓冲区。这个新的帧缓冲区包含一个纹理附件，为我们的编辑器提供了可访问性。这可以在最终的着色器中完成。\n\
  \n| 列表 12.8: Graphics/Final.h |\n\n```cpp\n#pragma once\n#include \"Shader.h\"\n\
  #include \"../Utilities/Quad.h\"\n\nnamespace Empy\n{\n    struct FinalShader :\
  \ Shader\n    {\n        EMPY_INLINE FinalShader(const std::string& filename, int32_t\
  \ width, int32_t height): Shader(filename)\n        {\n            u_Bloom = glUniformLocation(m_ShaderID,\
  \ \"u_bloom\");\n            u_Map = glUniformLocation(m_ShaderID, \"u_map\");\n\
  \            CreateBuffer(width, height);\n            m_Quad = CreateQuad2D();\n\
  \        }\n\n        EMPY_INLINE ~FinalShader()\n        {\n            glDeleteTextures(1,\
  \ &m_Final);\n            glDeleteFramebuffers(1, &m_FBO);\n        }\n\n      \
  \  EMPY_INLINE void Render(uint32_t map, uint32_t bloom, bool useFBO)\n        {\n\
  \            glBindFramebuffer(GL_FRAMEBUFFER, (useFBO) ? 0 : m_FBO);\n        \
  \    glClear(GL_COLOR_BUFFER_BIT);\n            glClearColor(0, 0, 0, 1);\n    \
  \        glUseProgram(m_ShaderID);\n\n            // 设置颜色映射\n            glActiveTexture(GL_TEXTURE0);\n\
  \            glBindTexture(GL_TEXTURE_2D, map);\n            glUniform1i(u_Map,\
  \ 0);\n\n            // 设置泛光映射\n            glActiveTexture(GL_TEXTURE1);\n    \
  \        glBindTexture(GL_TEXTURE_2D, bloom);\n            glUniform1i(u_Bloom,\
  \ 1);\n\n            // 渲染四边形\n            m_Quad->Draw(GL_TRIANGLES);\n       \
  \     glUseProgram(0);\n\n            // 绑定默认 fbo\n            glBindFramebuffer(GL_FRAMEBUFFER,\
  \ 0);\n        }\n\n        EMPY_INLINE void Resize(int32_t width, int32_t height)\n\
  \        {\n            glBindTexture(GL_TEXTURE_2D, m_Final);\n            glTexImage2D(GL_TEXTURE_2D,\
  \ 0, GL_RGBA16F, width, height, 0, GL_RGBA, GL_FLOAT);\n            glBindTexture(GL_TEXTURE_2D,\
  \ 0);\n        }\n\n        EMPY_INLINE uint32_t GetMap()\n        {\n         \
  \   return m_Final;\n        }\n\n    private:\n        EMPY_INLINE void CreateBuffer(int32_t\
  \ width, int32_t height)\n        {\n            // 创建帧缓冲区\n            glGenFramebuffers(1,\
  \ &m_FBO);\n            glBindFramebuffer(GL_FRAMEBUFFER, m_FBO);\n\n          \
  \  // 创建附件\n            glGenTextures(1, &m_Final);\n            glBindTexture(GL_TEXTURE_2D,\
  \ m_Final);\n            glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);\n\
  \            glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);\n\
  \            glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);\n\
  \            glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);\n\
  \            glTexImage2D(GL_TEXTURE_2D, 0, GL_RGBA16F, width, height, 0, GL_RGBA,\
  \ GL_FLOAT);\n            glFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0,\
  \ GL_TEXTURE_2D, m_Final, 0);\n\n            // 检查帧缓冲区\n            if (glCheckFramebufferStatus(GL_FRAMEBUFFER)\
  \ != GL_FRAMEBUFFER_COMPLETE)\n        }\n    };\n};\n```\n\n\n\n\n\n```cpp\n{\n\
  \    EMPY_ERROR(\"glCheckFramebufferStatus() Failed!\");\n}\n\n// unbind frame buffer\n\
  glBindFramebuffer(GL_FRAMEBUFFER, 0);\n}\n\nprivate:\n    uint32_t m_Final = 0u;\n\
  \    uint32_t m_FBO = 0u;\n\n    uint32_t u_Bloom = 0u;\n    uint32_t u_Map = 0u;\n\
  \n    Quad2D m_Quad;\n};\n\n\n```\n\n在此段代码片段中，引入了一个新的帧缓冲区（`m_FBO`），它包含一个名为 `m_Final`\
  \ 的纹理附件。该帧缓冲区作为最终场景帧的指定存储区域。`Render()` 函数本质上是 `Show()` 函数的重命名版本，其大部分内容保持不变。值得注意的是，增加了一个变量，用于确定应该将最终场景渲染到屏幕还是新建立的帧缓冲区。这种划分能够区分编辑器模式和游戏模式。这里这里重要的是\
  \ `GetMap()` 函数，它返回附件的纹理标识符，该标识符可以在 ImGui 中用于渲染帧。\n\n### 渲染器更新\n\n我们还需要将此应用到图形渲染器类中。在下面的代码片段中，你可以看到\
  \ `GetFrame()` 返回了最终着色器中帧缓冲区的附件。`ShowFrame()` 函数现在还接收一个布尔值，告诉最终着色器如何以及何处渲染最终帧。\n\
  \n| 列表 12.9: Graphics/Renderer.h |\n\n```cpp\n/* ... 与之前相同 ... */\n\nstruct GraphicsRenderer\n\
  {\n    EMPY_INLINE void ShowFrame(bool useFBO)\n    {\n        glViewport(0, 0,\
  \ m_Frame->Width(), m_Frame->Height());\n        m_Final->Render(m_Frame->GetTexture(),\
  \ m_Bloom->GetMap(), useFBO);\n    }\n\n    EMPY_INLINE uint32_t GetFrame()\n  \
  \  {\n        //return m_Frame->GetTexture();\n        return m_Final->GetMap();\n\
  \    }\n};\n```\n\n### 应用更新\n\n我们还需要应用程序的主循环中反映这种行为。可以通过为函数 `RunContext()` 提供一个参数来实现，该参数告诉应用程序当前处于编辑器模式还是游戏模式。\n\
  \n| 列表 12.10: Application/Application.h |\n\n```cpp\n/* ... 与之前相同 ... */\n\nEMPY_INLINE\
  \ void RunContext(bool showFrame = false)\n{\n    // application main loop\n   \
  \ while(m_Context->Window->PollEvents())\n    {\n        /* ... */\n\n        for(auto\
  \ layer : m_Context->Layers)\n        {\n            layer->OnUpdate();\n      \
  \  }\n        // 仅游戏显示\n        m_Context->Renderer->ShowFrame(showFrame);\n   \
  \ }\n}\n```\n\n#### 12.4.2 创建视口\n\n建立此框架后，创建视口窗口就变成了一项简单的任务，随后的代码所示。在 `OnShow()`\
  \ 函数中，我们生成了一个包含子窗口的 ImGui 窗口。随后，我们利用从上下文获取 `m_Frame` 在 ImGui 窗口内渲染场景。为了确保适配，我们获取当前\
  \ ImGui 窗口的大小并将其用于渲染帧。\n\n| 列表 12.1: EmpyEditor/src/Viewport.h |\n\n```cpp\n#pragma\
  \ once\n#include \"Context.h\"\n\nstruct ViewportWindow : IWidget\n{\n    EMPY_INLINE\
  \ ViewportWindow(GuiContext* context) : IWidget(context)\n    {\n        m_Frame\
  \ = (ImTextureID)context->GetFrame();\n    }\n\n    EMPY_INLINE void OnShow(GuiContext*\
  \ context) override\n    {\n        if(ImGui::Begin(ICON_FA_IMAGE \"\\tViewport\"\
  ))\n        {\n            ImGui::BeginChild(\"Frame\");\n            {\n      \
  \          // 显示场景\n                const ImVec2 size = ImGui::GetWindowRegionMax();\n\
  \                ImGui::Image(m_Frame, size, ImVec2(0, 1), ImVec2(1, 0));\n    \
  \        }\n            ImGui::EndChild();\n        }\n        ImGui::End();\n \
  \   }\n\n    EMPY_INLINE void OnSelect(Entity entity) override\n    {\n        //\
  \ 无需操作\n    }\n\nprivate:\n    ImTextureID m_Frame;\n    ImVec2 m_Viewport;\n};\n\
  ```\n\n#### 12.4.3 显示视口\n\n现在，让我们迅速将此窗口集成到编辑器中观察其外观。在随后的代码片段中，你可以观察视口窗口是如何合并到编辑器中的。使用了\
  \ GUI 上下文中用于添加窗口的内置函数，将视口窗口无缝地包含在编辑器中。\n\n| 列表 12.12: EmpyEditor/src/Viewport.h\
  \ |\n\n```cpp\n#include \"Windows/Inspector.h\"\n#include \"Windows/Hierarchy.h\"\
  \n#include \"Windows/Resource.h\"\n#include \"Windows/Viewport.h\"\n#include \"\
  Windows/MenuBar.h\"\n\nstruct Editor : GuiContext\n{\n    EMPY_INLINE void OnGuiStart()\n\
  \    {\n        AttachWindow<ViewportWindow>();\n    }\n};\n\nint32_t main(int32_t\
  \ argc, char** argv)\n{\n    auto app = new Application();\n    app->AttachLayer<Editor>();\n\
  \    app->RunContext(false);\n    EMPY_DELETE(app);\n    return 0;\n}\n```\n\n编译并运行代码后你将看到：\n\
  \n![image77.jpg]\n\n图 12.1: 视口与窗口\n\n#### 12.4.4 滚动、拖放与缩放\n\n如果你尝试缩放视口窗口，你会发现看起来很奇怪。这是因为帧缓冲区没有相应调整调整。我们希望帧缓冲区与\
  \ ImGui 窗口的大小一致。\n\n##### 调整帧\n\n回到 `ViewportWindow`，我们可以通过比较当前窗口大小来判断是否发生了变化。当发生变化时，会触发缩放事件，随后由应用程序调整帧缓冲区。这是通过下面的\
  \ `Show()` 函数实现的。\n\n| 列表 12.13: EmpyEditor/src/Viewport.h |\n\n```cpp\nEMPY_INLINE\
  \ void OnShow(GuiContext* context) override\n{\n    if(ImGui::Begin(ICON_FA_IMAGE\
  \ \"\\tViewport\"))\n    {\n        ImGui::BeginChild(\"Frame\");\n        {\n \
  \           // 显示场景\n            const ImVec2 size = ImGui::GetWindowRegionMax();\n\
  \            ImGui::Image(m_Frame, size, ImVec2(0, 1), ImVec2(1, 0));\n        \
  \    // 处理缩放\n            if(m_Viewport.x != size.x || m_Viewport.y != size.y)\n\
  \            {\n                int32_t width = (int32_t)size.x, height = (int32_t)size.y;\n\
  \                context->PostEvent<WindowResizeEvent>(width, height);\n       \
  \         m_Viewport = size;\n            }\n        }\n        ImGui::EndChild();\n\
  \    }\n    ImGui::End();\n}\n```\n\n##### 拖放与滚动\n\n编辑器的一个不可或缺的功能是利用鼠标输入来控制相机的位置和角度。此功能可以无缝集成，如下面的\
  \ `Show()` 函数所示：\n\n\n\n\n\n```cpp\nif(ImGui::IsWindowHovered())\n{\n    // handle\
  \ zoom in/out\n    if(io.MouseWheel != 0)\n    {\n        float sensibility = 50;\n\
  \n        context->EnttView<Entity, CameraComponent>([&] (auto entity, auto& comp)\n\
  \        {\n            auto& transform = entity.template Get<TransformComponent>().Transform;\n\
  \            transform.Translate.z -= (io.MouseWheel * io.DeltaTime * sensibility);\n\
  \        });\n    }\n\n    // handle dragging\n    if(ImGui::IsMouseDragging(ImGuiMouseButton_Left))\n\
  \    {\n        float sensibility = 10;\n\n        context->EnttView<Entity, CameraComponent>([&]\
  \ (auto entity, auto& comp)\n        {\n            auto& transform = entity.template\
  \ Get<TransformComponent>().Transform;\n            transform.Rotation.x += (io.MouseDelta.y\
  \ * io.DeltaTime * sensibility);\n            transform.Rotation.y += (io.MouseDelta.x\
  \ * io.DeltaTime * sensibility);\n        });\n    }\n}\nImGui::End();\nImGui::End();\n\
  ```\n\n\n\n\n\n将此菜单栏添加到你的编辑器层中，即可获得以下结果：\n\n***\n\n![PIC](img/image_rsrc776.jpg)\n\
  \n| 图 12.14: | 层级窗口 |\n\n***\n\n尝试使用“添加实体”菜单项来创建一个实体！\n\n## 12.7 检查器窗口 (Inspector\
  \ Window)\n\n检查器窗口的主要目的是显示当前选中实体的所有组件和属性。因此，该窗口需要对选择事件做出响应。下面的代码片段概述了该窗口的实现。\n\n\
  | 列表 12.17: | EmpyEditor/src/Windows/Inspector.h |\n\n```cpp\n#pragma once\n\n#include\
  \ \"Controls/Camera.h\"\n#include \"Controls/EnttInfo.h\"\n#include \"Controls/Transform.h\"\
  \n#include \"Controls/DirectLight.h\"\n\nstruct InspectorWindow : IWidget\n{\n \
  \ EMPY_INLINE InspectorWindow(GuiContext* context): IWidget(context)\n  {\n    m_Widgets.push_back(context->CreateWidget<InfoControl>());\
  \    \n    m_Widgets.push_back(context->CreateWidget<TransformControl>());    \n\
  \    m_Widgets.push_back(context->CreateWidget<CameraControl>());    \n    m_Widgets.push_back(context->CreateWidget<DirectLightControl>());\
  \    \n  }\n\n  EMPY_INLINE void OnShow(GuiContext* context) override\n  {\n   \
  \ if(ImGui::Begin(ICON_FA_CIRCLE_INFO \"\\tInspector\"))\n    {\n      for(auto&\
  \ widget : m_Widgets)    \n        widget->OnShow(context);      \n    }\n    ImGui::End();\n\
  \  }\n\n  EMPY_INLINE void OnSelect(Entity entity) override\n  {\n    for(auto&\
  \ widget : m_Widgets)    \n      widget->OnSelect(entity);          \n  }\n\nprivate:\n\
  \  std::vector<Widget> m_Widgets;\n};\n```\n\n显而易见，这段代码中有几个组件尚未被创建，特别是控件（controls）。在我们的引擎中，控件是指为组件设计的\
  \ UI 元素或组件。这些控件使能够实时与组件的属性进行交互。这引导我们引入了“Controls”目录（图 12.15）。\n\n***\n\n[[图片]](image_rsrc777.jpg)\n\
  \n| 图 12.15: | Controls 目录 |\n\n***\n\n与窗口不同，控件直接继承自 widget。我们需要实现一个中间接口使这些控件更加动态。这在“IControl.h”头文件中完成。\n\
  \n### 12.7.1 控件接口\n\n以下代码片段提供了所有控件的接口的实现：\n\n| 列表 12.18: | EmpyEditor/src/Cobtrols/IControl.h\
  \ |\n\n```cpp\n#pragma once\n\n#include \"../Context/Context.h\"\n\ntemplate <typename\
  \ Component>\nstruct IControl : public IWidget\n{\n  EMPY_INLINE virtual ~IControl()\
  \ = default;\n\n  EMPY_INLINE IControl(GuiContext* context):\n        IWidget(context)\n\
  \  {}\n\n  EMPY_INLINE void OnSelect(Entity entity) override\n  {\n    m_Entity\
  \ = entity;\n  }\n\n  EMPY_INLINE void SetTitle(const char* title) override\n  {\n\
  \    m_Title = title;\n  }\n\n  EMPY_INLINE void Show(GuiContext* context) override\n\
  \  {\n    if(!m_Entity.template<Component>()) {return;}\n    ImGui::PushID(m_Title);\n\
  \    static const auto flags = ImGuiTreeNodeFlags_Open | ImGuiTreeNodeFlags_OpenArrow\
  \ | ImGuiTreeNodeFlags_OpenDoubleClick | ImGuiTreeNodeFlags_SpanWidth | ImGuiTreeNodeFlags_AllowOverlap;\n\
  \    ImGui::PushStyle(ImGuiVar_Padding, ImVec2(5.0f, 4.0f));\n    bool isCollapsed\
  \ = ImGui::CollapsingHeader(m_Title, flags);\n    ImGui::PopVar();\n\n    // 激活小字体\n\
  \    USE_SMALL_FONT();\n    ImGui::SameLine();\n    ImGui::SetCursorPosY(ImGui::GetCursorPosY()\
  \ + 2.0f);\n    ImGui::SetCursorPosX(ImGui::GetWindowWidth() - 30.0f);\n\n    if(InputButton(ICON_FA_GEAR))\n\
  \    {\n      ImGui::OpenPopup(m_Title);\n    }\n\n    // 弹出窗口\n    if (ImGui::BeginPopup(m_Title))\n\
  \    {\n      ImGui::Text(m_Title);\n      ImGui::Separator();\n      OnMenu(context,\
  \ m_Entity);\n      ImGui::EndPopup();\n    }\n\n    // 内容\n    if(isCollapsed)\n\
  \    {\n      ImGui::Spacing();\n      ImGui::Indent(5.0f);\n      OnBody(context,\
  \ m_Entity);\n      ImGui::Spacing();\n      ImGui::Unindent(5.0f);\n    }\n   \
  \ ImGui::PopID();\n\n    // 切回普通字体\n    USE_REGULAR_FONT();\n  };\n\nprotected:\n\
  \  EMPY_INLINE void virtual OnMenu(GuiContext*, Entity&) {}\n  EMPY_INLINE void\
  \ virtual OnBody(GuiContext*, Entity&) {}\n\nprivate:\n  const char* m_Title;\n\
  \  Entity m_Entity;\n};\n```\n\n再次，主要关注是 `Show()` 函数。该函数基本上是创建一个带有侧边按钮的折叠头部，如图 12.16\
  \ 所示。\n\n***\n\n![PIC](img/image_rsrc78.jpg)\n\n| 图 12.16: | 控制 |\n\n***\n\n侧边按钮触发了弹出窗口的生成。实现涉及覆盖\
  \ `OnMenu()` 函数。由于，`Show()` 函数不返回任何内容，有助于对选中实体的验证。让我们来实现这些控件。\n\n### 12.7.2 变换控件\
  \ (Transform Control)\n\n顾其实名，变换控件是一个赋予变换组件能力的 widget。\n\n| 列表 12.19: | EmpyEditor/src/Controls/Transform.h\
  \ |\n\n```cpp\n#pragma once\n#include \"IControl.h\"\n\nstruct TransformControl\
  \ : IControl<TransformComponent>\n{\n  EMPY_INLINE TransformControl(GuiContext*\
  \ context):IControl(context)\n  {\n    SetTitle(ICON_FA_ARROW \"\\tTransform\");\n\
  \  }\n\n  EMPY_INLINE void OnBody(GuiContext* context, Entity& entity)\n  {\n  \
  \  auto& data = entity.template<TransformComponent>().Transform;\n    InputVec3(\"\
  Translate\", &data.Translate);\n    InputVec3(\"Rotation\", &data.Rotation);\n \
  \   InputVec3(\"Scale\", &data.Scale);\n  }\n\n  EMPY_INLINE void OnMenu(GuiContext*\
  \ context, Entity& entity)\n  {\n    if(ImGui::Selectable(ICON_FA_RECYCLE \"\\tReset\"\
  ))\n    {\n      entity.template<TransformComponent>() = {};\n    }\n  }\n};\n```\n\
  \n`OnMenu()` 虚函数的实现是可见的，具有一个可以将变换恢复到默认设置的重置操作。另一方面，`OnBody()` 函数为变换的每个属性建立了输入字段。参见图\
  \ 12.17 的视觉结果。\n\n***\n\n![PIC](img/image_rsrc79.jpg)\n\n| 图 12.17: | 示例控件 |\n\n\
