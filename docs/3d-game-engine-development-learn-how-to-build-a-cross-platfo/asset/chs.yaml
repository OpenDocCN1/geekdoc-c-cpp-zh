  \n#### 集成物理上下文\n\n我们将 `PhysicsContext` 添加到应用上下，以便在应用程序主循环中需要时进行模拟。按照以下所示更新 `AppContext`：\n\
  \n#### 列表 8.11 Application/Context.h\n\n```cpp\n#pragma once\n#include \"Window.h\"\
  \n#include \"Physics.h\"\n#include \"Graphics.h\"\n\nnamespace Empy\n{\n    // 前向声明\n\
  \    struct AppInterface;\n\n    // 应用上下文\n    struct AppContext\n    {\n      \
  \  EMPY_INLINE AppContext()\n        {\n            Window = std::make_unique<AppWindow>(1280,\
  \ 720, \"Empy Engine\");\n            Renderer = std::make_unique<GraphicsRenderer>(1280,\
  \ 720);\n            Physics = std::make_unique<PhysicsContext>();\n        }\n\n\
  \        EMPY_INLINE ~AppContext()\n        {\n            for(auto layer : Layers)\n\
  \            {\n                EMPY_DELETE(layer);\n            }\n        }\n\n\
  \        std::unique_ptr<GraphicsRenderer> Renderer;\n        std::unique_ptr<PhysicsContext>\
  \ Physics;\n        std::vector<AppInterface*> Layers;\n        std::unique_ptr<AppWindow>\
  \ Window;\n        EventDispatcher Dispatcher;\n        EntityRegistry Scene;\n\
  \    };\n}\n```\n\n到目前为止，一切看起来良好。\n\n##### 定义物理组件\n\n让我们创建用于存储刚体执行体实际属性的组件。请下下面的代码（列表\
  \ 8.12）。\n\n#### 列表 8.12 Auxiliaries/ECS.h\n\n```cpp\n// 刚体组件\n```\n\n\n\n\n\n```cpp\n\
