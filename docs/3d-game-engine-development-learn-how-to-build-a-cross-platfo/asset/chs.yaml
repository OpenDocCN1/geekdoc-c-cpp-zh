  \ `eye` 是相机位置，`center` 是相机看向的点，`up` 定义了相机的向上方向。\n*   投影矩阵（Projection Matrix）：投影矩阵处理\
  \ 3D 坐标到 2D 屏幕空间的转换，定义了透视或正交投影。它将相机空间坐标转换为 NDC（标准设备坐标），随后映射到屏幕空间。常见类型包括透视投影（`Perspective\
  \ = perspective(fovy, aspect, zNear, zFar)`）和正交投影（`Ortho = ortho(left, right, bottom,\
  \ top, zNear, zFar)`）。\n\n***\n\n![PIC](img/image_rsrc73P.jpg)\n\n| 图 5.13: | 模型视图投影\
  \ |\n\n***\n\nMVP 矩阵通过乘法这些矩阵矩阵：`MVP = Projection × View × Model`。这个组合矩阵高效地通过考虑局部变换、相对于相机的定位以及透视或正交投影，将对象顶点转换到屏幕空间。参见（图\
  \ 5.13）。\n\n你还会注意到顶点着色器中的 MVP 矩阵是使用 `uniform` 关键字定义的。在 OpenGL 中，uniform 是着色器中使用的一种变量，在渲染特定图元期间或跨多次渲染调用期间保持不变。它们由\
  \ CPU 显式设置，并对于特定绘制调用中由着色器处理的所有顶点或片段保持一致。\n\nUniforms 对于从 CPU（主机应用程序）向 GPU（着色器）发送数据至关重要，通常用于在渲染过程中不频繁变化的值，例如变换矩阵（如模型、视图矩阵）。\n\
  \n`gl_Position` 是着色器中的内置变量，表示裁剪空间中的顶点位置。一旦计算，该位置将通过透视除法和视口变换进一步处理，最终映射到屏幕上。\n\n\
