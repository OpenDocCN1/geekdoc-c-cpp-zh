  \ C++ 编译器\n\n为了在 Windows 上编译我们的源代码，我们需要在系统上安装一个可以供 `CMake` 用于生成构建文件的编译器。如果系统中已经安装了\
  \ Visual Studio C++ 开发工具，则此步骤是多余的。你可以通过以下链接下载 Visual Studio Build Tools：[`visualstudio.microsoft.com/downloads/`](https://visualstudio.microsoft.com/downloads/)。滚动到“所有下载”（All\
  \ Downloads）部分，可以在那里找到“Microsoft Visual C++ Redistributable for Visual Studio 202x”。下载并运行安装程序。选择“使用\
  \ C++ 的桌面开发”（Desktop Development with C++）模块并点击“安装”以完成（图 2.3）。本书使用的是 2022 版本，这是编写时的最新版本。你可以通过以下链接参考官方文档获取更多信息：[`code.visualstudio.com/docs/cpp/config-msvc`](https://code.visualstudio.com/docs/cpp/config-msvc)。\n\
  \n![PIC](img/image_rsrc72E.jpg)\n\n| 图 2.3: | Microsoft Visual C++ 工具集 |\n\n要检查机器上是否安装了\
  \ Microsoft Visual Studio 编译器 (`MVSC`)，你可以通过 Windows 菜单按钮打开 `Developer Command Prompt`，只需简单输入：`Developer\
  \ Command Prompt`。可以使用以下命令检查已安装的版本。\n\n![[Picture]](image_rsrc72F.jpg)\n\n#### 2.2.3\
  \ 安装 CMake\n\n`CMake` 是一个强大的开源工具，专为跨平台使用设计。它通过使用特定于编译器和平台的配置文件，生成针对你的编译器和平台定制的原生构建文件来实现这一点。要在\
  \ Windows 上安装 `CMake`，可以在 CMake 官方网站下载以 Microsoft 安装程序 (MSI) 包形式提供的预编译二进制文件：[`cmake.org/download/`](https://cmake.org/download/)\
  \ 。对于 64 位系统，下载 Windows x64 安装程序；对于 32 位系统，选择 Windows i386 安装程序。运行下载的 MSI 包来安装 `CMake`，确保选择了“为所有用户将\
  \ `CMake` 添加到系统 `PATH`”选项。这确保了 `Vs-Code` 等第三方软件可以访问全局安装。本书安装的 `CMake` 版本是“3.27.2”，但最低要求的版本是\
  \ 3.16.0。使用以下命令检查你的安装：\n\n![[Picture]](image_rsrc72G.jpg)\n\n#### 2.2.4 安装 Conan\n\
  \n如引言中所述，`Conan` 是一个用于 C 和 C++ 的包管理器，为开发者提供了大量的库。`Conan` 依赖于 `Python` 基金会，因此你需要在机器上安装\
  \ `Python`。\n\n*   **安装 Python**：你可以通过以下链接下载并安装 `python`：[`www.python.org/downloads/`](https://www.python.org/downloads/)\
  \ 。在安装期间，请务必勾选“Add Python X.Y to PATH”框框，其中 X.Y 是你正在安装的 Python 版本。编写本文时，`3.11.4`\
  \ 是最新版本。\n*   **安装 Conan**：在你的电脑上打开命令提示符。你可以通过在开始菜单搜索“cmd”或“Command Prompt”并运行以下命令来安装版本\
