  我们通过引入偏置（bias）来处理阴影锯齿。如（图 6.34\n图 6.36：阴影锯齿\n\n##### 解决阴影锯齿\n\n你可以如下所示在 `ComputeShadow()`\
  \ 函数中添加偏置：\n\n#### 列表 6.83：Resources/Shaders/pbr.glsl\n```cpp\nfloat ComputeShadow()\n\
  {\n    float bias = 0.005;\n    vec4 position = u_lightSpace * vec4(vertex.Position,\
  \ 1.0);\n    vec3 uvs = (position.xyz / position.w) * 0.5 + 0.5;\n    float depth\
  \ = texture(u_depthMap, uvs).r;\n    return (position.z - bias) > depth ? 1.0 :\
  \ 0.0;\n}\n```\n\n虽然这足以解决问题，但对所有情况使用这样的硬编码数字并不动态。改进此点可以通过 CPU 添加一个额外的 uniform 来调整偏置值，这相对容易。\n\
  \n##### 彼得潘效应\n\n阴影彼得潘效应（也称为深度偏置或简单的“彼得潘”）是阴影映射中的一种伪影，表现为阴影悬浮在表面上方，产生一种类似于彼得潘角色的不真实视觉效果。这种现象发生在对深度值进行比较应用偏置时。如果偏置过大，会导致阴影与表面分离。\n\
  \n这种伪影可以通过在渲染物体时简单地剔除（图 6.37\n图 6.37：面剔除\n\n这通过以下代码实现：\n\n#### 列表 6.84：Graphics/Shaders/Shadow.h\n\
  ```cpp\nEMPY_INLINE void Draw(Model3D& model, Transform3D& transform)\n{\n    glUniformMatrix4fv(u_Model,\
  \ 1, GL_FALSE, glm::value_ptr(transform.Matrix()));\n    glCullFace(GL_FRONT);\n\
  }\n```\n\n\n\n\n\n```cpp\nmodel->Draw(GL_TRIANGLES);\n\nglCullFace(GL_BACK);\n\n\
  }\n```\n\n### 比例深度过滤 (Percentage-Closer Filtering)\n\n如果你放大得足够或使用低分辨率的深度图，你会发现阴影的边缘并不是平滑的，而是非常锯齿。这可以使用称为\
  \ `PCF` 的技术来改进。正如之前介绍的那样，这种技术有助于计算采样深度值周围深度值的平均值，以获得平滑的阴影结果。\n\n以下是该实现方法的描述：\n\n\
  | Listing 6.85: | Resources/Shaders/pbr.glsl |\n\n```cpp\nfloat ComputeShadow()\n\
  {\n  vec4 position = u_lightSpace * vec4(vertex.Position, 1.0);\n  vec3 coords =\
  \ (position.xyz / position.w) * 0.5 + 0.5;\n\n  // 像素大小 (1024 -> map 大小)\n  float\
  \ pixelSize = 1.0/1024;\n  float shadow = 0.0;\n  float bias = 0.005;\n\n  // 计算平均\
  \ pcf\n  for(int x = -1; x <= 1; ++x)\n  {\n    for(int y = -1; y <= 1; ++y)\n \
  \   {\n      float depth = texture(u_depthMap, coords.xy + vec2(x, y) * pixelSize).r;\n\
  \      shadow += (position.z - bias) > depth ? 1.0 : 0.0;\n    }\n  }\n  shadow\
  \ /= 9.0;\n\n  // 如果在正交平面外则无影\n  if(coords.z > 1.0)\n    shadow = 0.0;\n\n  return\
  \ shadow;\n}\n```\n\n仍然可以使用一些额外的额外改进来提升阴影的外观，但那是由你去发现的。你可以在这里找到更多关于阴影映射的资源：de Vries\
  \ [b] Meiri [b]。\n\n### 6.7 Bloom 效应\n\n计算机图形学中的 Bloom 效应是一种后处理技术，旨在模拟图像中亮区域周围的光线散射和溢光视觉现象。它增强了对亮度的感知，并为强光源或高对比区域提供了视觉上吸引人的光晕。\n\
  \n***\n\n![PIC](img/image_rsrc75V.jpg)\n\n| Figure 6.38: | 未开启 Bloom vs 开启 Bloom\
  \ |\n\n***\n\n实现 Bloom 效应通常涉及以下步骤：\n\n- **将场景渲染到帧缓冲区**：我们首先像之前所做的那样，将场景渲染到帧缓冲区。其中一个附件存储原始场景的颜色，额外的附件则用于存储场景的亮度。\n\
  - **提取高亮区域**：在渲染物体时，我们将检查它们的颜色是否高于特定的亮度阈值，并将其存储在亮度附件中。\n- **模糊高亮区域**：然后我们使用可分离卷积核对高亮区域进行水平和垂直模糊。这一步通过扩散明亮像素来增强光晕效果。这种模糊的实现可以通过带有帧缓冲器的多次渲染完成，也可以通过特定的模糊算法（如高斯模糊）来实现。\n\
  - **将模糊图像与原始场景合并**：最后，在渲染的最后一个阶段将模糊图像与原始场景图像合并，更加强调高亮区域。这种组合通常使用加法混合操作完成。\n\n***\n\
  \n![PIC](img/image_rsrc75W.jpg)\n\n| Figure 6.39: | Bloom 流程图 |\n\n***\n\n(图 6.39)\
  \ 是这些步骤的视觉表示。让我们在渲染流水线实现它。\n\n#### 6.7.1 实现 Bloom 效应\n\n与我们处理阴影映射类似，我们将创建一个着色器来生成亮度图的模糊版本。我们还需要通过添加亮度附件来扩展帧缓冲区。\n\
  \n#### 扩展帧缓冲区\n\n查看下方 (Listing 6.86) 中所示的代码片段，你会注意到亮度附件是如何添加到帧缓冲区中的。你会在构造函数中看到我们现在有两个目标附件。函数\
  \ `CreateBrightnessAttachment` 有助于创建新附件，与 `CreateColorAttachment()` 非常相似。\n\n| Listing\
  \ 6.86: | Graphics/Buffers/Frame.h |\n\n```cpp\n/* ... 与之前相同 ... */\n\nstruct FrameBuffer\n\
