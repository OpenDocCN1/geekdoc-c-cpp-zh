  \ + std::to_string(index) + \".Position\";\nstd::string falloff = \"u_spotLights[\"\
  \ + std::to_string(index) + \".FallOff\";\nstd::string cutoff = \"u_spotLights[\"\
  \ + std::to_string(index) + \".CutOff\";\n\nuint32_t u_intensity = glGetUniformLocation(m_ShaderID,\
  \ intensity.c_str());\nuint32_t u_direction = glGetUniformLocation(m_ShaderID, direction.c_str());\n\
  uint32_t u_radiance = glGetUniformLocation(m_ShaderID, radiance.c_str());\nuint32_t\
  \ u_position = glGetUniformLocation(m_ShaderID, position.c_str());\nuint32_t u_falloff\
  \ = glGetUniformLocation(m_ShaderID, falloff.c_str());\nuint32_t u_cutoff = glGetUniformLocation(m_ShaderID,\
  \ cutoff.c_str());\n\nglUniform3fv(u_direction, 1, &transform.Rotation.x);\nglUniform3fv(u_position,\
  \ 1, &transform.Translate.x);\nglUniform1f(u_falloff, glm::radians(light.FallOff));\n\
  glUniform1f(u_cutoff, glm::radians(light.CutOff));\nglUniform3fv(u_radiance, 1,\
  \ &light.Radiance.x);\nglUniform1f(u_intensity, light.Intensity);\n}\n\nEMPY_INLINE\
  \ void SetSpotLightCount(int32_t count)\n{\n    glUniform1i(u_NbrSpotLight, count);\n\
  }\n\n/* ... same as before ... */\n\nprivate:\n    uint32_t u_NbrDirectLight = 0u;\n\
  \    uint32_t u_NbrPointLight = 0u;\n    uint32_t u_NbrSpotLight = 0u;\n    uint32_t\
  \ u_ViewPos = 0u;\n\n    uint32_t u_Roughness = 0u;\n    uint32_t u_Metallic = 0u;\n\
  \    uint32_t u_Albedo = 0u;\n\n    uint32_t u_Model = 0u;\n    uint32_t u_View\
  \ = 0u;\n    uint32_t u_Proj = 0u;\n};\n}\n```\n\n这段代码中的一个重要注意事项（列表 [6.27]）是使用了\
  \ `glm::radians()` 函数，用于将“衰减（Falloff）”和“截止（Cutoff）”角度从度转换为弧度。这样做会导致我们的着色器无法显示任何内容。\n\
  \n### PBR 着色器更新\n\n与之前的光源类似，我们也将实现一个函数来计算场景中聚光灯光源的贡献。参见（列表 [6.28]）。\n\n#### 列表 6.28：Resources/Shaders/pbr.glsl\n\
  \n```cpp\n/* ... same as before ... */\n\n// 聚光灯类型\nstruct SpotLight\n{\n    float\
  \ Intensity;\n    vec3 Direction;\n    vec3 Position;\n    vec3 Radiance;\n    float\
  \ FallOff;\n    float CutOff;\n};\n\n// 聚光灯 uniform\nuniform SpotLight u_spotLights[MAX_LIGHTS];\n\
  uniform int u_nbrSpotLight;\n\n// 计算聚光灯\nvec3 ComputeSpotLights(vec3 N, vec3 V,\
  \ vec3 F0)\n{\n    vec3 result = vec3(0.0);\n    for (int i = 0; i < u_nbrSpotLight;\
  \ ++i)\n    {\n        // 计算参数\n        vec3 L = normalize(u_spotLights[i].Position\
  \ - vertex.Position);\n        float NL = max(dot(N, L), 0.0);\n        float Ndot\
  \ = max(dot(N, V), 0.0);\n        vec3 H = normalize(L + V);\n\n        // Cook-Torrance\
  \ (BRDF)\n        float NDF = DistributionGGX(N, H, material.Roughness);\n     \
  \   vec3 FS = FresnelSchlick(dot(H, V), 0.0, 1.0, F0);\n        float GS = GeometrySmithX(Ndot,\
  \ NL, material.Roughness);\n\n        // 漫反射光\n        vec3 diffuse = (vec3(1.0)\
  \ - FS) * (1.0 - material.Metallic);\n\n        // 射光\n        vec3 specular = (NDF\
  \ * GS * FS) / max(4.0 * Ndot * NL, 0.0001);\n\n        // 计算聚光效果\n        float\
  \ theta = dot(L, normalize(-u_spotLights[i].Direction));\n        float epsilon\
  \ = u_spotLights[i].FallOff - u_spotLights[i].CutOff;\n        float spotFactor\
  \ = clamp((theta - u_spotLights[i].CutOff) / epsilon, 0.0, 1.0);\n\n        // 光源衰减\n\
  \        float distance = length(u_spotLights[i].Position - vertex.Position);\n\
  \        float attenuation = u_spotLights[i].Intensity / (distance * distance);\n\
  \n        // 合并组件\n        result += (diffuse * material.Albedo / PI + specular)\
  \ *\n            u_spotLights[i].Radiance * u_spotLights[i].Intensity *\n      \
  \      attenuation * NL * spotFactor;\n\n        // 如果达到最大光数量则跳出\n        if (i\
  \ >= MAX_LIGHTS - 1) {\n    }\n    return result;\n}\n\n// 主函数\nvoid main()\n{\n\
  \    // 顶点法线\n    vec3 N = normalize(vertex.Normal);\n\n    // 相机方向\n    vec3 V\
  \ = normalize(viewPos - vertex.Position);\n\n    // 菲涅尔\n    vec3 F0 = mix(vec3(0.04),\
  \ material.Albedo, material.Metallic);\n\n    // 点光源贡献\n    vec3 result = ComputeDirectLights(N,\
  \ V);\n    result += ComputePointLights(N, V);\n    // 聚光灯\n    result += ComputeSpotLights(N,\
  \ V);\n\n    // 最终颜色\n    out_fragment = vec4(result, 1.0);\n}\n```\n\n再次，顶点着色器保持不变。你可以在\
  \ `ComputeSpotLights()` 函数中注意到我们如何通过截止角和衰减角来计算聚光因子。聚光因子随后用于计算最终结果。\n\n### 渲染器类更新\n\
  \n在渲染器中添加以下封装函数以设置聚光灯参数。\n\n#### 列表 6.29：Auxiliaries/ECS.h\n\n```cpp\n// 设置单个聚光灯\
  \ uniform\nEMPY_INLINE void SetSpotLight(SpotLight& light, Transform& transform,\
  \ uint32_t index)\n{\n    // ... (实现具体的 set-uniform 的逻辑)\n}\n\n// 设置聚光灯总数\nEMPY_INLINE\
  \ void SetSpotLightCount(int32_t count)\n{\n    m_Pbr->SetSpotLightCount(count);\n\
  }\n```\n\n### 应用更新\n\n在应用程序中创建聚光灯并添加实体。\n\n#### 列表 6.30：Application.h\n\n```cpp\n\
