  \ DrawSkybox(Skybox& sky, Transform3D& transform)\n  {\n    // 渲染天空盒\n    m_Skybox->Draw(m_SkyboxMesh,\
  \ sky.CubeMap, transform);\n    // 设置带有深度图的环境图\n    m_Pbr->SetEnvMaps(sky.IrradMap,\
  \ sky.PrefilMap, sky.BrdfMap, m_Shadow->GetDepthMap()); //--- 添加\n  }\n\n  // 帮助渲染深度值\n\
  \  EMPY_INLINE void DrawDepth(Model3D& model, Transform3D& transform)\n  {\n   \
  \ m_Shadow->Draw(model, transform);\n  }\n\n  // 开始深度渲染过程\n  EMPY_INLINE void BeginShadowPass(const\
  \ glm::vec3& LightDir)\n  {\n    // 准备投影和视图矩阵\n    float nearPlane = 1.0f;\n   \
  \ float farPlane = 10.0f;\n    static auto proj = glm::ortho(-10.0f, 10.0f, -10.0f,\
  \ 10.0f, nearPlane, farPlane);\n    auto view = glm::lookAt(LightDir, glm::vec3(0.0f,\
  \ 0.0f, 0.0f), glm::vec3(0.0f, 1.0f, 0.0f));\n\n    // 计算光空间矩阵\n    auto lightSpaceMtx\
  \ = (proj * view);\n\n    // 设置 pbr 着色器光空间矩阵\n    m_Pbr->Bind();\n    m_Pbr->SetLightSpaceMatrix(lightSpaceMtx);\n\
  \n    // 开始深度渲染\n    m_Shadow->BeginFrame(lightSpaceMtx);\n  }\n\n  // 深度渲染结束\n\
  \  EMPY_INLINE void EndShadowPass()\n  {\n    m_Shadow->EndFrame();\n  }\n\nprivate:\n\
  \  /* ... 与之前相同 ... */\n  std::unique_ptr<ShadowShader> m_Shadow; // <--- 添加\n}\n\
  ```\n\n通过查看 `GraphicsRenderer` 中的代码，可以轻松地理解这里应用的更改。你会在 `BeginShadowPass()` 函数中注意到光空间矩阵是如何计算并发送到\
  \ GPU 的。\n\n\n\n\n\n现在，进入你的 `Application.h` 头文件，并添加（列表 6.80\n{\n    EMPY_INLINE\
  \ void RunContext()\n    {\n        // 加载环境 HDR 纹理\n        auto skymap = std::make_shared<Texture2D>(\"\
  Resources/Textures/HDRs/Sky.hdr\", true, true);\n\n        // 加载模型\n        auto\
  \ sphereModel = std::make_shared<Model>(\"Resources/Models/sphere.fbx\");\n    \
  \    auto cubeModel = std::make_shared<Model>(\"Resources/Models/cube.fbx\");\n\n\
  \        // 创建场景相机\n        auto camera = CreateEntt<Entity>();\n        auto& tf\
  \ = camera.Attach<TransformComponent>().Transform;\n        tf.Translate.y = 4.5f;\n\
  \        tf.Translate.z = 20.0f;\n        camera.Attach<CameraComponent>();\n\n\
  \        // 创建天空盒实体\n        auto skybox = CreateEntt<Entity>();\n        skybox.Attach<TransformComponent>();\n\
  \        skybox.Attach<SkyboxComponent>();\n\n        // 创建点光 1\n        auto slight\
  \ = CreateEntt<Entity>();\n        slight.Attach<DirectLightComponent>().Light.Intensity\
  \ = 0.0f;\n        auto& stp = slight.Attach<TransformComponent>().Transform;\n\
  \        //stp.Rotation = glm::vec3(0.0f, 0.5f, -1.0f);\n        stp.Rotation =\
  \ glm::vec3(0.0f, 1.5f, -2.0f);\n\n        // 创建球体实体\n        auto sphere = CreateEntt<Entity>();\n\
  \        sphere.Attach<ModelComponent>().Model = sphereModel;\n        auto& ts\
