  \ `Conan`：\n    ```bash\n    # 激活 empy 环境\n    source ~/empy/bin/activate\n\n  \
  \  # 安装 conan 1.61.0\n    pip install conan==1.61.0\n    ```\n\n## 2.4 项目设置\n\n\
  现在已经完成了主要的平台安装，让我们进行项目设置。本节将探索项目的目录结构和必要文件。良好的项目结构可以让开发和协作更容易管理。为我的项目起一个好名字通常是一个挑战。我为本书开发的引擎命名为“Empy”。你可以使用任何你喜欢的名称。\n\
  \n### 2.4.1 项目目录树\n\n项目分为几个目录，每个目录都有特定的用途。图 2.6 是项目目录树的概述。这有助于区分项目的不同部分，例如核心引擎库、编辑器和游戏执行文件，从而单独管理和维护每个部分。在本书中，该目录树将不断扩展以适应我们的进展。\n\
  \n请确保在继续之前创建了类似的目录树结构，包括所有指定的文件和文件夹。\n\n\n\n\n`.vscode` 目录下的配置文件将帮助简化使用 VS-Code\
  \ IDE 的开发流程。项目将使用提供的针对 Linux 和 Windows 的构建脚本进行构建：`EmpyWin.bat`, `EmpyLinux.sh`。`CMakeLists.txt`\
  \ 文件定义了每个需要构建的模块，而 `conanfile.txt` 则指定了外部库。\n\n***\n\n![[Picture]](image_rsrc72S.jpg)\n\
  \n| 图 2.6: | 项目目录树 |\n\n***\n\n### 2.4.2 VS-Code 配置\n\n为了启用之前安装的 VS-Code C/C++ 扩展，我们需要设置一个名为\
  \ `.vscode` 的文件夹。在该文件夹中，我们放置了三个基本的 JavaScript 对象表示（JSON）文件：`c_cpp_properties.json`、`launch.json`\
  \ 和 `tasks.json`，如文件夹树所示（图 2.6）。现在，让我们深入了解每个文件的用途。\n\n(Listing 2.1) 中所示的文件用于配置 VS-Code\
  \ 中的 C/C++ 扩展，通过提供准确的 IntelliSense 建议、错误检查和语法高亮来增强我们的编码体验。需要指出的是，此配置不会影响编译过程；其效果完全侧于改进编码体验。\n\
  \n| 列表 2.1: | .vscode/c_cpp_properties.json |\n\n```json\n{\n  \"configurations\"\
  : [\n    [\n      {\n        \"includePath\": [\n          \"${workspaceFolder}/EmpyEngine/includes\"\
  ,\n          \"${workspaceFolder}/EmpyEditor/src\",\n          \"${workspaceFolder}/EmpyGame/src\"\
  ,\n        ],\n        \"configurationProvider\": \"ms-vscode.cmake-tools\",\n \
  \       \"defines\": [\"EMPY_EXPORT\", \"EMPY_ENABLE_LOG\"],\n        \"intelliSenseMode\"\
  : \"${default}\",\n        \"cppStandard\": \"c++17\",\n        \"cStandard\": \"\
  c17\",\n        \"name\": \"cpp-dev\"\n      }\n    ]\n  ],\n  \"version\": 4\n\
  }\n```\n\n这些配置包含了包含基本头文件的目录路径、配置提供者（例如 `ms-vscode.cmake-tools`）、IntelliSense 模式设置以及语言标准（例如\
  \ `c/c++17`）。这些设置确保了在我们工作区内进行精确的代码分析和编译。\n\nIntelliSense 模式设置为 `default`，以确保与当前平台的兼容性。然而，如果需要，也可以指定不同的模式，例如\
  \ `clang-x64`。两个预处理器宏 `EMPY_EXPORT` 和 `EMPY_ENABLE_LOG` 将在稍后定义 CMake 文件时引入。它们有助于语法高亮。\n\
  \n| 列表 2.2: | .vscode/launch.json |\n\n```json\n{\n  \"version\": \"0.2.0\",\n \
  \ \"configurations\": [\n    // windows\n    {\n      \"type\": \"cppvsdbg\",\n\
  \      \"request\": \"launch\",\n      \"name\": \"Editor Win32\",\n      \"program\"\
  : \"Empy.exe\",\n      \"console\": \"integratedTerminal\",\n      \"cwd\": \"${workspaceFolder}/Targets/Debug/bin\"\
  ,\n    },\n    {\n      \"type\": \"cppvsdbg\",\n      \"request\": \"launch\",\n\
  \      \"name\": \"Game Win32\",\n      \"program\": \"Game.exe\",\n      \"console\"\
  : \"integratedTerminal\",\n      \"cwd\": \"${workspaceFolder}/Targets/Debug/bin\"\
  ,\n    },\n    // Linux\n    {\n      \"type\": \"cppdbg\",\n      \"request\":\
  \ \"launch\",\n      \"name\": \"Editor Linux\",\n      \"miDebuggerPath\": \"/usr/bin/gdb\"\
  ,\n      \"cwd\": \"${workspaceFolder}/Targets/Debug/bin\",\n      \"program\":\
  \ \"${workspaceFolder}/Targets/Debug/Empy\",\n    },\n    {\n      \"type\": \"\
  cppdbg\",\n      \"request\": \"launch\",\n      \"name\": \"Game Linux\",\n   \
  \   \"miDebuggerPath\": \"/usr/bin/gdb\",\n      \"cwd\": \"${workspaceFolder}/Targets/Debug/bin\"\
  ,\n      \"program\": \"${workspaceFolder}/Targets/Debug/Game\",\n    }\n  ]\n}\n\
  ```\n\n`launch.json` 文件（Listing 2.2）作为我们调试器的配置。为每个平台创建单独的配置是关重要的。对于 Windows，指定了两个配置：`Editor\
  \ Win32` 和 `Game Win32`。这些设置使用了之前随 Microsoft 编译器工具（节 2.4）安装的 `cppvsdbg` 调试器。调试输出指向集成终端。要调试的程序是\
  \ `Empy.exe` 和 `Game.exe`。同样，我们为 Linux 有两个配置：`Editor Linux` 和 `Game Linux`。这些配置使用了我们随\
  \ GNU 编译器工具（节 2.4）安装的 `cppdbg` 调试器。\n\n| 列表 2.3: | .vscode/tasks.json |\n\n```json\n\
  {\n  \"version\": \"2.0.0\",\n  \"tasks\": [\n    {\n      \"type\": \"shell\",\n\
  \      \"label\": \"Empy-Debug\",\n      \"problemMatcher\": [\"$gcc\"],\n     \
  \ \"options\": { \"cwd\": \"${workspaceFolder}\" },\n      \"group\": { \"kind\"\
  : \"build\", \"isDefault\": true },\n      \"windows\": {\n        \"args\": [\"\
  Debug\"],\n        \"command\": \"${workspaceFolder}/EmpyWin.bat\"\n      },\n \
  \     \"linux\": {\n        \"args\": [\"Debug\"],\n        \"command\": \"${workspaceFolder}/EmpyLinux.sh\"\
  \n      }\n    },\n    {\n      \"type\": \"shell\",\n      \"label\": \"Empy-Release\"\
  ,\n      \"problemMatcher\": [\"$gcc\"],\n      \"options\": { \"cwd\": \"${workspaceFolder}\"\
  \ },\n      \"group\": { \"kind\": \"build\", \"isDefault\": false },\n      \"\
  windows\": {\n        \"args\": [\"Release\"],\n        \"command\": \"${workspaceFolder}/EmpyWin.bat\"\
  \n      },\n      \"linux\": {\n        \"args\": [\"Release\"],\n        \"command\"\
  : \"${workspaceFolder}/EmpyLinux.sh\"\n      }\n    }\n  ]\n}\n```\n\n`tasks.json`\
  \ 文件（Listing 2.3）用于配置构建、清理等任务。由于 VS-Code 默认不知道如何编译，我们必须通过提供命令来指示它做什么。首先，`Empy-Debug`\
  \ 任务被定义为默认构建任务。在 Windows 上，它被配置为运行 `Debug` 模式参数，调用工作区中的 `EmpyWin.bat`。在 Linux 上，它被设置为带有\
  \ `sudo` 权限运行。第二个任务 `Empy-Release` 与调试构建具有相似的属性。\n\n### 2.4.3 构建脚本\n\n如所述，我们的构建系统依赖于两个文件，即\
  \ `EmpyWin.bat` 和 `EmpyLinux.sh`，在各自的平台上执行代码编译。现在，让我们查看它们的实现。\n\n| 列表 2.4: | Root/EmpyWin.bat\
  \ |\n\n```batch\n@echo off\nrem output directory\nset target=\"Targets\\%1\"\n\n\
  rem install conan dependencies\nconan install . --install-folder %target% --build\
  \ missing -s build_type=%1 -c tools.system.package_manager:mode=install\n\nrem generate\
  \ cmake build files\ncmake -S . -B %target% -DCMAKE_BUILD_TYPE=%1 -DCMAKE_TOOLCHAIN_FILE=\"\
  conanbuildinfo.cmake\"\n\nrem compile cmake build files\ncmake --build %target%\
  \ --config %1\n```\n\n| 列表 2.5: | Root/EmpyLinux.sh |\n\n```bash\n#!/bin/bash\n\
  # output directory\ntarget=\"Targets/$1\"\n\n# activate python env\nsource ~/empy/bin/activate\n\
  \n# install conan dependencies\nconan install . --install-folder $target --build\
  \ missing -s build_type=$1 -c tools.system.package_manager:sudo=True -c tools.system.package_manager:mode=install\n\
  \n# generate cmake build files\ncmake -S . -B $target -DCMAKE_BUILD_TYPE=$1 -DCMAKE_TOOLCHAIN_FILE=\"\
  conanbuildinfo.cmake\"\n\n# compile cmake build files\ncmake --build $target --config\
  \ $1\n```\n\n\n\n\n这些脚本（列表 2.4 和（列表 2.5）用于使用 Conan 和 CMake 构建并处理依赖。这两个文件唯一的区别在于我们需要在\
  \ Linux 中激活安装 Conan 的 Python 虚拟环境。这通常是不需要的，但如果你在（节 2.3）中创建了虚拟环境来安装 Conan，那么在使用 Conan\
  \ 时也需要确保该环境已已激活。\n\n请记住在你的 Linux 系统上为 `EmpyLinux.sh` 脚本授予执行权限；在脚本所在的目录中运行此命令：![Picture]](image_rsrc72T.jpg)\n\
  \n两个脚本都将构建配置作为参数（\"Debug\" 或 \"Release\"），并根据提供的参数设置目标输出目录，在输出目录中创建一个名为 \"Targets\"\
  \ 的文件夹。两个脚本都使用 Conan 在指定的目标目录中安装项目依赖，确保任何缺失的依赖都能被构建。构建类型和包管理器模式根据提供的参数进行配置。脚本使用指定的目标目录生成\
  \ CMake 构建文件，并根据参数设置构建类型和 CMake 工具链文件。\n\n#### 2.4.4 CMakeLists.txt 文件\n\nCMake\
  \ 可以通过组合多个位置的 CMake 配置文件来生成构建文件。在项目目录树中（图 2.6），你可以看到根目录下有一个 `CMakeLists.txt` 文件，在三个子目录\
  \ \"EmpyEngine\"、EmpyEditor\" 和 \"EmpyGame\" 中各有一个。这些文件定义了 CMake 必须为编译器生成项目构建文件。CMake\
  \ 将搜索根目录和子目录中所有指定的 `CMakeLists.txt`，在生成构建文件之前收集并汇总所有必要信息。让我们仔细查看每个 `CMakeLists.txt`\
  \ 文件。\n\n| 列表 2.6: EmpyEngine/CMakeLists.txt |\n\n```cmake\nproject(Engine)\n\n\
  # 收集所有源文件\nfile(GLOB_RECURSE sources ${CMAKE_CURRENT_SOURCE_DIR}/*.cpp)\nfile(GLOB_RECURSE\
  \ headers ${CMAKE_CURRENT_SOURCE_DIR}/*.h)\nadd_library(${PROJECT_NAME} SHARED ${sources}\
  \ ${headers})\n\n# 导出引擎符号\ntarget_compile_definitions(${PROJECT_NAME} PUBLIC\n \
  \   -DEMPY_EXPORT\n)\n\n# 包含目录\ntarget_include_directories(${PROJECT_NAME} PUBLIC\n\
  \    ${CMAKE_CURRENT_SOURCE_DIR}/includes\n    ${CONAN_INCLUDE_DIRS}\n)\n\n# 链接目录\n\
  target_link_directories(${PROJECT_NAME} PUBLIC\n    ${CONAN_LIB_DIRS}\n)\n\n# 链接库\n\
  target_link_libraries(${PROJECT_NAME} PUBLIC\n    ${CONAN_LIBS}\n)\n```\n\n这些 CMake\
  \ 文件必须命名为：`CMakeLists.txt`\n\n`EmpyEngine/CMakeLists.txt` 文件（列表 2.6）负责配置引擎库的构建过程。它从当前目录及其子目录中收集所有源文件（包括\
  \ .cpp 和 .h）以创建一个共享库。`target_compile_definitions(...)` 行指定编译器在编译阶段应考虑 `EMPY_EXPORT`\
  \ 预处理器宏。这允许库将符号导出到库，稍后将其链接到我们的可执行文件中。\n\n接下来，我们链接到项目的包含目录。由于我们将使用来自 Conan 的外部库，我们还需要将它们添加为项目的目标。使用\
  \ `PUBLIC` 关键字是为了告诉 CMake，任何链接到引擎库的项目也可以使用这些目录中的文件。\n\n| 列表 2.7: EmpyEditor/CMakeLists.txt\
  \ |\n\n```cmake\nproject(Empy)\n\n# 收集源文件\nfile(GLOB_RECURSE sources ${CMAKE_CURRENT_SOURCE_DIR}/*.cpp)\n\
  file(GLOB_RECURSE headers ${CMAKE_CURRENT_SOURCE_DIR}/*.h)\nadd_executable(${PROJECT_NAME}\
  \ ${sources} ${headers})\n\n# 包含目录\ntarget_include_directories(${PROJECT_NAME} PRIVATE\n\
  \    ${CMAKE_CURRENT_SOURCE_DIR}/src\n)\n\n# 链接库\ntarget_link_libraries(${PROJECT_NAME}\
  \ PRIVATE\n    Engine\n)\n```\n\n| 列表 2.8: EmpyEditor/CMakeLists.txt |\n\n```cmake\n\
  project(Game)\n\n# 收集源文件\nfile(GLOB_RECURSE sources ${CMAKE_CURRENT_SOURCE_DIR}/*.cpp)\n\
  file(GLOB_RECURSE headers ${CMAKE_CURRENT_SOURCE_DIR}/*.h)\nadd_executable(${PROJECT_NAME}\
  \ ${sources} ${headers})\n\n# 包含目录\ntarget_include_directories(${PROJECT_NAME} PRIVATE\n\
  \    ${CMAKE_CURRENT_SOURCE_DIR}/src\n)\n\n# 链接库\ntarget_link_libraries(${PROJECT_NAME}\
  \ PRIVATE\n    Engine\n)\n```\n\n`EmpyEditor/CMakeLists.txt`（列表 2.7）和 `EmpyGame/CMakeLists.txt`（列表\
  \ 2.8）配置了构建过程。`EmpyEngine/CMakeLists.txt` 文件从当前目录及其子目录中收集所有源文件（包括 .cpp 和 .h）以创建一个共享库。`target_compile_definitions(...)`\
  \ 行指定编译器在编译阶段应考虑 `EMPY_EXPORT` 预处理器宏。这允许库将符号导出到库，稍后将其链接到我们的可执行文件中。\n\n| 列表 2.9:\
  \ Root/CMakeLists.txt |\n\n```cmake\ncmake_minimum_required(VERSION 3.16 FATAL_ERROR)\n\
  \n# 构建输出目录\nset(CMAKE_LIBRARY_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/bin)\nset(CMAKE_RUNTIME_OUTPUT_DIRECTORY\
  \ ${CMAKE_BINARY_DIR}/bin)\nset(CMAKE_ARCHIVE_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/lib)\n\
  set(CMAKE_PDB_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/lib)\n\n# C++ 标准选项\nset(CMAKE_CONFIGURATION_TYPES\
  \ Debug Release)\nset(CMAKE_CXX_REQUIRED ON)\nset(CMAKE_CXX_EXTENSIONS ON)\nset(CMAKE_CXX_STANDARD\
  \ 17)\n\nproject(EmpyEngine)\n\n# 启用控制日志\nif(CMAKE_BUILD_TYPE MATCHES Debug)\n \
  \   add_definitions(-DEMPY_ENABLE_LOG)\nendif()\n\n# 子目录\nadd_subdirectory(EmpyEngine)\n\
  add_subdirectory(EmpyEditor)\nadd_subdirectory(EmpyGame)\n```\n\n根 `CMakeLists.txt`（列表\
  \ 2.9)）将所有子项目组合成 CMake 可以使用的整体。它指定了 CMake 的最低版本为 3.16。随后定义了各种构建类型的输出目录，包括库、可执行文件、存档和\
  \ PDB 文件。这些目录相对于 `CMAKE_BINARY_DIR` 环境变量进行配置。接下来，我们设置了 C++ 标准选项，指定项目需要 C++17。\n\n\
  #### 2.4.5 Conan 配置\n\n`conanfile.txt` 是 Conan 包管理器的配置文件，通常用于基于 CMake 的项目的 C 和 C++\
  \ 库依赖。\n\n| 列表 2.10: Root/conanfile.txt |\n\n```ini\n[requires]\nspdlog/1.12.0\n\
  \n[generators]\ncmake\n\n[options]\n```\n\n- [requires]: 在此部分中，我们可以指定项目依赖的外部库或包。目前我们添加了\
  \ `spdlog`，稍后会详细介绍。\n\n\n\n\n\n- `[generators]`: 这里，我们指定了生成构建文件时将使用的输出生成器。指定了 `CMake`，表示\
  \ Conan 将为我们的项目生成 CMake 构建文件。\n- `[options]`: 此部分允许我们指定与项目依赖相关的各种选项。根据我们使用的库及其各自的\
  \ Conan 配方（recipes），我们可能需要在这里指定选项以自定义它们的行为。例如，我们可以使用此部分告诉 Conan 动态链接特定库而不是静态链接。\n\
  \n在在完成这些基础配置后，我们现在准备好深入到项目的实际编码和编译阶段。\n\n## 2.5 首次编译\n\n现在我们已经完成了所有的样板代码，我们想对项目进行首次快速编译，以测试目前为止所做的一切是否正常。我们还将利用此机会添加基础功能，如平台和编译器检测、控制台日志、函数内联、断言等。\n\
  \n将如（Listing 2.11）所示的代码插入你的 `Core.h` 头文件中。\n\n### 列表 2.11: EmpyEngine/includes/Common/Core.h\n\
  \n```cpp\n#pragma once\n\n#include <queue>\n#include <vector>\n#include <string>\n\
  #include <bitset>\n#include <memory>\n#include <sstream>\n#include <fstream>\n#include\
  \ <assert.h>\n#include <algorithm>\n#include <functional>\n#include <filesystem>\n\
  #include <unordered_map>\n\n// include spdlog\n#define FMT_HEADER_ONLY\n#define\
  \ SPDLOG_FMT_EXTERNAL\n#include <spdlog/spdlog.h>\n#include <spdlog/sinks/stdout_color_sinks.h>\n\
  \n// import, export\n#ifdef EMPY_EXPORT\n    #ifdef _MSC_VER\n        #define EMPY_API\
  \ __declspec(dllexport)\n    #else\n        #define EMPY_API __attribute__((visibility(\"\
  default\")))\n    #endif\n#else\n    #ifdef _MSC_VER\n        #define EMPY_API __declspec(dllimport)\n\
  \    #else\n        #define EMPY_API\n    #endif\n#endif\n```\n\n该文件作为我们项目的基础，包含了必要的库、平台和编译器检测、日志、宏等。我们首先包含各种常用的\
  \ C++ 标准头文件。如果你还记得在“EmpyEngine”中的 CMake 文件（Listing 2.6），你可能认出 `EMPY_EXPORT` 预处理器宏。它的作用是管理我们是否想要导出或导入引擎的符号。这让我们能够控制选择向外部项目暴露或隐藏的内容。此外，我们必须考虑平台差异，因为\
  \ Windows 和 Linux 处理此过程的方式不同。每当我们需要导出一个类或函数时，只需在其声明前加上关键字 `EMPY_API`。我们还包含了“spdlog”的头文件，稍后会进行介绍。\n\
  \n### 2.5.1 断言 (Assertions)\n\n断言可以用于追踪程序执行在何处出错，甚至在某些条件不满足时阻止编译继续。静态断言（static assertion）在代码构建之前验证条件，而运行时断言（runtime\
  \ assertion）在执行期间触发事件以阻止应用程序继续运行。由于断言在不同编译器之间存在，我们使用 `if` 语句来确保对当前使用的编译器进行正确的断言调用。将以下代码段（Listing\
  \ 2.12）添加到你的 `Core.h` 头文件的底部：\n\n### 列表 2.12: Common/Core.h\n\n```cpp\n// runtime\
  \ assertion\n#define EMPY_ASSERT assert\n\n// static assertion\n#if defined(__clang__)\
  \ || defined(__gcc__)\n    #define EMPY_STATIC_ASSERT _Static_assert\n#else\n  \
  \  #define EMPY_STATIC_ASSERT static_assert\n#endif\n```\n\n### 2.5.2 内联 (Inlining)\n\
  \n函数内联是 C++ 众多迷人特性之一，在涉及程序性能时非常有用。每当在编译过程中遇到带有 `inline` 关键字的函数时，编译器都会尝试用该函数的定义副本替换函数调用。当函数声明很短且在程序中被多次调用时，通常使用内联函数。再次，将以下代码段（Listing\
  \ 2.12）引入你的 `Core.h` 头文件中：\n\n### 列表 2.13: Common/Core.h\n\n```cpp\n// function\
  \ inlining\n#if defined(__clang__) || defined(__gcc__)\n    #define EMPY_LINE __attribute__((always_inline))\n\
  \    #define EMPY_NOLINE __attribute__((noinline))\n#elif defined(_MSC_VER)\n  \
  \  #define EMPY_LINE __forceinline\n    #define EMPY_NOLINE __declspec(noinline)\n\
  #else\n    #define EMPY_LINE inline\n    #define EMPY_NOLINE\n#endif\n```\n\n你会发现\
  \ `inline` 关键字在不同编译器之间有所不同，因此我们需要确保在使用不同编译器构建项目时使用的是正确的用例。我们项目中的大多数函数前面都会带有 `EMPY_LINE`\
  \ 符号，以指示编译器始终尝试优化它。这对构建用于发布的项目有显著影响。\n\n### 2.5.3 控制台日志 (Console Logging)\n\n控制台日志是\
  \ C/C++ 开发的一个重要方面。虽然可以使用内置的 `std::cout` 函数实现这一点，但我们选择了使用 `spdlog` 进行更高级且高效的方法。`spdlog`\
  \ 为异步和线程安全的控制台及文件日志提供了支持，简化了繁琐的工作。在（Listing 2.10)所示的 `conanfile.txt` 中，你会注意到 `spdlog`\
  \ 被添加为需求。此外，我们将 `spdlog` 头文件包含在我们的 `Core.h` 中。由于 `spdlog` 可以作为头文件库使用，我们通过在包含它之前定义特定的预处理器指令来采用这种方法，如（Listing\
  \ 2.)所示。这意味着 `spdlog` 在与我们的项目链接之前不会构建库；相反，`CMake` 只需将其头文件暴露给我们的项目。将以下代码（Listing\
  \ 2.14)添加到你的 `Core.h` 头文件中。\n\n### 列表 2.14: Common/Core.h\n\n```cpp\n// console\
  \ logging\n#ifdef EMPY_ENABLE_LOG\n    namespace Empy\n    {\n        struct EMPY_API\
  \ Logger\n        {\n            using SPDLog = std::shared_ptr<spdlog::logger>;\n\
  \n            EMPY_LINE Logger()\n            {\n                m_SPD = spdlog::stdout_color_mt(\"\
  stdout\");\n                spdlog::set_level(spdlog::level::trace);\n         \
  \       spdlog::set_pattern(\"%^[%T]: [#%t] %v%$\");\n            }\n\n        \
  \    EMPY_LINE static SPDLog& Ref()\n            {\n                static Logger\
  \ logger;\n                return logger.m_SPD;\n            }\n\n        private:\n\
  \            SPDLog m_SPD;\n        };\n    }\n\n    // logging macros\n    #define\
  \ EMPY_TRACE(...) Empy::Logger::Ref()->trace(__VA_ARGS__)\n    #define EMPY_DEBUG(...)\
  \ Empy::Logger::Ref()->debug(__VA_ARGS__)\n    #define EMPY_INFO(...) Empy::Logger::Ref()->info(__VA_ARGS__)\n\
  \    #define EMPY_WARN(...) Empy::Logger::Ref()->warn(__VA_ARGS__)\n    #define\
  \ EMPY_ERROR(...) Empy::Logger::Ref()->error(__VA_ARGS__)\n    #define EMPY_FATAL(...)\
  \ Empy::Logger::Ref()->critical(__VA_ARGS__)\n#else\n    #define EMPY_TRACE\n  \
  \  #define EMPY_DEBUG\n    #define EMPY_ERROR\n    #define EMPY_FATAL\n    #define\
  \ EMPY_INFO\n    #define EMPY_WARN\n#endif\n```\n\n\n\n\n此代码段使用 \"spdlog\" 库定义了一个日志系统。它创建了一个名为\
  \ `Logger` 的单例结构，用于管理 `spdlog::logger` 类的共享实例。日志级别被设置为 `trace`，并使用以下参数定义了自定义日志格式：`time`（时间）、`thread-id`（线程\
  \ ID）和 `message`（消息）。\"spdlog\" 的优点在于它可以根据不同的级别使用不同的颜色打印消息。\n\n我们还包含了日志宏，如 `EMPY_TRACE`\
  \ 或 `EMPY_DEBUG`，它们利用 `logger` 处理各种日志级别（`trace`、`debug`、`info`、`warn`、`error`、`critical`）。这些宏允许开发者轻松地记录不同严重程度的日志。如果没有定义\
  \ `EMPY_ENABLE_LOG`，这些宏将被定义为空，从而确保在不需要时有效禁用日志消息。例如在 Release 构建中（Release Build）。你可能记得当用\
  \ debug 配置构建项目时，在根目录的 `CMakeLists.txt` 文件定义的 `EMPY_ENABLE_LOG`。\n\n你可能已经注意到 logger\
  \ 结构体的名称前带有 `EMPY_API` 符号，这表示我们打算导出它。值得注意的是，对于在头文件中定义的类或函数，这种导出指令并不是严格必要的，因为它们已经可以通过包含头文件来访问。\n\
  \n### 2.5.4 辅助函数\n\n最后，我们还想添加一些工具函数，以方便我们后的开发。请将（列表 2.15）中的代码添加到你的 `Core.h` 文件中。\n\
