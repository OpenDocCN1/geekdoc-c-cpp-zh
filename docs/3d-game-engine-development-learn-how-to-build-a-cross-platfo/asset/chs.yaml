  #pragma once\n#include \"Interface.h\"\n\nnamespace Empy {\n    struct Application\
  \ : AppInterface {\n        EMPY_INLINE Application() {\n            m_LayerID =\
  \ TypeID<Application>();\n            m_Context = new AppContext();\n        }\n\
  \n        EMPY_INLINE ~Application() {\n            EMPY_DELETE(m_Context);\n  \
  \      }\n\n        EMPY_INLINE void RunContext() {\n            while(true) {\n\
  \                for(auto layer : m_Context->Layers) {\n                    layer->OnUpdate();\n\
  \                }\n            }\n        }\n    };\n}\n```\n\n`m_LayerID` 用于区分应用程序中的层。它对于我们的事件系统至关重要，有助于追踪来源，通过区分谁在发布事件以及谁在监听特定事件。由于层也可以从应用程序中剥离，我们需要能够从事件系统中清除可能的的回调注册，而这个标识符实现了这一点。\n\
  \n\n\n\n目前 `Application` 类初始化了上下文（context）对象，并设置了一个启动主循环的基本函数，如（列表 3.3）所示。为了防止各个层直接访问应用程序接口中的上下文信息（所有层都必须继承自该接口），我们将其设为私有成员。考虑到\
  \ `Application` 类是上下文的合法所有者，我们在 `AppInterface` 和 `Application` 之间建立了友元关系。这允许应用程序类在需要时创建、修改甚至销毁上下文。这种方法的额外优势是，我们可以决定哪些方法可以被层或应用程序调用。\n\
  \n### 3.1.1 层管理 (Layers Management)\n\n基于我们已建立的设计，现在是时候实现负责在应用程序中挂载、卸载和检索层的函数了。利用\
  \ C++ 模板函数的多功能性，我们的目标是无缝地简化这些操作。这种方法在管理层方面提供了灵活性，能够适应各种定义，并确保在应用程序内部处理这些层时的高效性。\n\
  \n### 3.1.2 获取层\n\n（列表 3.4`，旨在从上下文层向量中检索特定的层对象。它使用静态断言（static assertion）强制指定的类型\
  \ `Layer` 派生自 `AppInterface`。该函数根据与每个层类型相关的唯一标识符 `m_LayerID` 在集合中搜索层。如果找到，则返回指向所找到层的指针；否则，返回\
  \ `nullptr`。将此函数添加到到你的接口实现中。\n\n| 列表 3.4: Application/Interface.h |\n\n```cpp\n\
  /*  ...  same  as  before    */\n\ntemplate<typename Layer>\nEMPY_INLINE Layer*\
  \ GetLayer()\n{\n    EMPY_STATIC_ASSERT(std::is_base_of<AppInterface, Layer>::value);\n\
  \    auto itr = std::find_if(m_Context->Layers.begin(),\n    m_Context->Layers.end(),\
  \ [this] (auto layer)\n    {\n        return (layer->m_LayerID == TypeID<Layer>());\n\
  \    });\n\n    if(itr != m_Context->Layers.end())\n    {\n        return static_cast<Layer*>(*itr);\n\
  \    }\n    return nullptr;\n}\n\n//...  same  as  before\n```\n\n### 3.1.3 挂载层\
  \ (Attaching Layers)\n\n在（列表 3.5）中定义的下一个函数用于向应用程序挂载新层。它通过验证所提供的层类型派生自 `AppInterface`\
  \ 来确保类型安全。如果已经存在相同类型的层，它会记录一条错误并返回 `nullptr`。否则，它会创建一个新层，将其添加到集合中，初始化其属性，并返回指向已挂载层的指针。你也可以看到，我们正在利用模板函数\
  \ `TypeID()` 来确保每个层都有一个唯一的 ID，因为每个类型都是唯一的。\n\n| 列表 3.5: Application/Interface.h\
  \ |\n\n```cpp\n/*  ...  same  as  before  */\n\ntemplate<typename Layer, typename...\
  \ Args>\nEMPY_INLINE Layer* AttachLayer(Args&&... args)\n{\n    // check layer’s\
  \ compliance\n    EMPY_STATIC_ASSERT(std::is_base_of<AppInterface, Layer>::value);\n\
  \n    // check if layer already exist\n    if(GetLayer<Layer>() != nullptr)\n  \
  \  {\n        EMPY_ERROR(\"Layer already attached!\");\n        return nullptr;\n\
  \    }\n\n    // create layer and add to collection\n    auto layer = new Layer(std::forward<Args>(args)...);\n\
  \    m_Context->Layers.push_back(layer);\n    layer->m_LayerID = TypeID<Layer>();\n\
  \    layer->m_Context = m_Context;\n    layer->OnStart();\n    return layer;\n}\n\
  //...  same  as  before\n```\n\n在挂载层时需要注意的一个方面是，我们为层提供了上下文指针。这确保了层指向正确的上下文，准确地反映了行为。你还应该注意，我们利用变量模板使得挂载具有多个参数构造函数的层成为可能。\n\
  \n### 3.1.4 卸载层 (Detaching Layers)\n\n自然的进展是实现一个从应用程序中卸载层的函数。然而，由于一个关键原因，这并不简单：想象你当前正在执行某个层的\
  \ `update` 函数，而在该过程中，你尝试卸载同一个层。此操作将不可避免地导致崩溃，因为你正在删除正在使用的内存。为了解决这一限制，我们需要为应用程序引入一个事件处理器。该实体可以监控层更新的完成情况，并在当前帧或循环后处理它的销毁。\n\
  \n#### 事件分发器 (Event Dispatcher)\n\n事件分发器是一个负责在软件系统中管理和分配事件或消息的实体。它从各种来源接收事件并将其分发给相应的处理器或监听器。本质上，它充当中心枢纽，通过路由和向接收者传递事件来促进应用程序不同部分之间的通信和协调。\n\
  \n虽然存在现有的事件分发器，例如 `Boost.Signals2`、JUCE 的 `Listener` 和 `Broadcaster`，但由于几个原因，我们选择开发自定义的事件分发器。一个显著优势是我们增加了对其行为的控制，允许我们对其功能进行微调并将其无缝集成到引擎中。\n\
  \n在你的 \"Common\" 目录中创建（列表 3.6>;\n\n        EMPY_INLINE EventListener(CallbackFn&&\
  \ callback, uint32_t listnrid):\n            Callback(std::move(callback)), ID(listnrid)\n\
  \        {}\n\n        CallbackFn Callback;\n        uint32_t ID;\n    };\n\n  \
  \  // Event Registry\n    template <typename Event>\n    struct EventRegistry\n\
  \    {\n        using Listener = std::unique_ptr<EventListener<Event>>;\n      \
  \  std::queue<std::unique_ptr<Event>> Queue;\n        std::vector<Listener> Listeners;\n\
  \    };\n\n    // Event Dispatcher\n    struct EventDispatcher\n    {\n        EMPY_INLINE\
  \ ~EventDispatcher()\n        {\n            for(auto&_, ptr] : m_Registry)\n  \
  \          {\n                auto registry = CastRegistry<char>(ptr);\n       \
  \         EMPY_DELETE(registry);\n            }\n        }\n        template <typename\
  \ Event, typename Callback>\n        EMPY_INLINE void AttachCallback(Callback&&\
  \ callback, uint32_t listnrid)\n        {\n            auto listener = std::make_unique<EventListener<Event>>(std::move(callback),\
  \ listnrid);\n            GetRegistry<Event>()->Listeners.push_back(std::move(listener));\n\
  \        }\n        template <typename Event>\n        EMPY_INLINE void DetachCallback(uint32_t\
  \ listnrid)\n        {\n            auto& listeners = GetRegistry<Event>()->Listeners;\n\
  \            listeners.erase(std::remove_if(listeners.begin(),\n            listeners.end(),\
  \ &\n            {\n                return (listener->ID == listnrid);\n       \
  \     }),\n            listeners.end());\n        }\n        EMPY_INLINE void EraseListener(uint32_t\
  \ listnrid)\n        {\n            for(auto&[_, registry] : m_Registry)\n     \
  \       {\n                auto& listeners = CastRegistry<int8_t>(registry)->Listeners;\n\
  \                listeners.erase(std::remove_if(listeners.begin(),\n           \
  \     listeners.end(), &\n                {\n                    return (listener->ID\
  \ == listnrid);\n                }),\n            }\n        }\n    };\n}\n```\n\
  \n\n\n```cpp\n            listeners.end());\n\n        }\n     }\n\n  template <typename\
  \ Event, typename... Args>\n  EMPY_INLINE void PostEvent(Args&&...args)\n  {\n \
  \       auto registry = GetRegistry<Event>();\n        if(registry->Listeners.empty())\
  \ { return; }\n        registry->Queue.push(std::make_unique<Event>(std::forward<Args>(args)...));\n\
  \  }\n\n  template <typename Task>\n  EMPY_INLINE void PostTask(Task&& task)\n \
  \ {\n        m_Tasks.push(std::move(task));\n  }\n\n  EMPY_INLINE void PollEvents()\n\
  \  {\n        // 持久回调\n        for(auto& [_, pointer] : m_Registry)\n        {\n\
  \            auto registry = CastRegistry<char>(pointer);\n\n            while(!registry->Queue.empty())\n\
  \            {\n                for(auto& listener : registry->Listeners)\n    \
  \            {\n                    listener->Callback(*registry->Queue.front());\n\
  \                }\n                registry->Queue.pop();\n            }\n    \
  \    }\n\n        // 帧回调\n        while(!m_Tasks.empty())\n        {\n         \
  \   m_Tasks.front()();\n            m_Tasks.pop();\n        }\n  }\n\nprivate:\n\
  \  template <typename Event>\n  EMPY_INLINE EventRegistry<Event>* CastRegistry(void*\
  \ p)\n  {\n    return static_cast<EventRegistry<Event>*>(p);\n  }\n\n  template\
  \ <typename Event>\n  EMPY_INLINE EventRegistry<Event>* GetRegistry()\n  {\n   \
  \ auto it = m_Registry.find(TypeID<Event>());\n    if(it != m_Registry.end())\n\
  \    {\n        return CastRegistry<Event>(it->second);\n    }\n    auto registry\
  \ = new EventRegistry<Event>();\n    m_Registry[TypeID<Event>()] = registry;\n \
  \   return registry;\n  }\n\nprivate:\n  std::unordered_map<uint32_t, void*> m_Registry;\n\
  \  std::queue<std::function<void()>> m_Tasks;\n};\n```\n\n这段代码定义了一个包含三个组件的事件系统：`EventListener`、`EventRegistry`\
  \ 和 `EventDispatcher`。`EventListener` 代表特定事件的监听器，存储回调函数和监听器 ID。`EventRegistry` 管理特定类型事件的监听器和队列。核心组件\
  \ `EventDispatcher` 负责事件的附加、解载、发布事件以及执行任务。它使用映射（map）来存储不同类型事件的注册表，并使用队列处理任务。上下文或调度器中的函数，如\
  \ `AttachCallback()`、`DetachCallback()`、`PostEvent()` 和 `PollEvents()` 方便了事件管理，能够实现附加回调、发布事件和执行任务。它通过遍历已注册的监听器并将队列中的事件分发给相应的监听器，同时确保队列任务的执行。\n\
  \n这种结构为应用程序中的事件处理提供了灵活性和控制。在此上下文中，区分任务（task）和事件（event）至关重要。与事件不同，任务与事件对象关联；相反，它只是传递给调度器执行的函数。`PostTask()`\
  \ 函数正为此目的，而我们我们从应用程序中卸载层时所需的。现在我们已经实现了事件调度器，让我们将其集成到应用上下文中。这种集成将能够在接口中使用它，从而让层和整个应用程序都能访问它。如列表\
  \ 3.7 所示，通过添加调度器来更新上下文。\n\n**列表 3.7：Application/Context.h**\n```cpp\n#pragma once\n\
  #include \"Common/Event.h\"\n\nnamespace Empy\n{\n  // 前向声明\n  struct AppInterface;\n\
  \n  // 应用上下文\n  struct AppContext\n  {\n    EMPY_INLINE ~AppContext()\n    {\n \
  \     for(auto& layer : Layers)\n      {\n        EMPY_DELETE(layer);\n      }\n\
  \    }\n\n    std::vector<AppInterface*> Layers;\n    EventDispatcher Dispatcher;\n\
  \  };\n}\n```\n\n让我们实现一个从应用程序中卸载层的函数。\n\n**列表 3.8：Application/Interface.h**\n```cpp\n\
  /* ... 与之前相同 ... */\ntemplate<typename Layer>\nEMPY_INLINE void DetachLayer()\n\
  {\n  EMPY_STATIC_ASSERT(std::is_base_of<AppInterface, Layer>::value);\n  m_Context->Dispatcher.PostTask([this]\n\
  \  {\n    m_Context->Layers.erase(std::remove_if(m_Context->Layers.begin(),\n  \
  \  m_Context->Layers.end(), [this] (auto& layer)\n    {\n      if(layer->m_LayerID\
  \ == TypeID<Layer>())\n      {\n        m_Context->Dispatcher.EraseListener(layer->m_LayerID);\n\
  \        EMPY_DELETE(layer);\n        return true;\n      }\n      return false;\n\
  \    }), m_Context->Layers.end());\n}\n/* ... 与之前相同 ... */\n```\n\n`DetachLayer()`\
  \ 函数设计用于从应用程序中卸载层。它从静态断言开始，确保提供的 `Layer` 类型派生自 `AppInterface`。该函数使用事件调度器发布一个任务。该任务涉及从层数组中删除该层。我们使用\
  \ `std::remove_if()` 根据类型查找特定的层。当找到指定类型的层时，我们将其从层向量（vector）中移除。此外，我们调用调度器的 `EraseListener()`\
  \ 函数来清理与该类型相关的监听器。最后，它删除该层对象，并使用 `erase()` 函数确保从层向量中完全移除。这种在发布的任务中的延迟执行可以确保安全卸载层，而不影响涉及该层的正在进程。\n\
  \n#### 3.1.5 创建第一个层\n\n让我们将其应用于 `Empy.exe` 应用程序。首先，按照如下片段更新 `Empy.h` 头文件：\n\n**列表\
  \ 3.9：includes/Empy.h**\n```cpp\n#pragma once\n#include \"Application.h\"\n```\n\
  \n接下来，更新你的 `Application.h` 头文件，添加更新所有附加层的代码，如列表 3.10 所示。\n\n**列表 3.10：Application/Application.h**\n\
  ```cpp\n#pragma once\ninclude \"Interface.h\"\n\n/* ... 与之前相同 ... */\n\nEMPY_INLINE\
  \ void RunContext()\n{\n  while(true)\n  {\n    m_Context->Dispatcher.PollEvents();\
  \  // <- 处理事件\n\n    for(auto layer : m_Context->Layers)  // <- 更新层\n    {\n   \
  \   layer->OnUpdate();\n    }\n  }\n}\n/* ... 与之前相同 ... */\n```\n\n最后在你的项目 `Empy.exe`\
  \ 中创建一个层，并如列表 3.11 所示将其附加到新创建的应用程序。\n\n**列表 3.11：EmpyEditor/src/Editor.cpp**\n```cpp\n\
  #include <Empy.h>\nusing namespace Empy;\n\nstruct MyLayer : AppInterface\n{\n \
  \ EMPY_INLINE void OnUpdate()\n  {\n    EMPY_INFO(\"OnUpdate()\");\n  }\n\n  EMPY_INLINE\
  \ void OnStart()\n  {\n    EMPY_TRACE(\"OnStart()\");\n  }\n};\n\nint32_t main(int32_t\
  \ argc, char** argv)\n{\n  auto app = new Application();\n  app->AttachLayer<MyLayer>();\n\
  \  app->RunContext();\n  return 0;\n}\n```\n\n\n\n\n当你编译项目并运行 `Empy.exe` 时，你会观察到层在启动时初始化，并逐帧持续更新。这种方法的核心优势在于其灵活性：你可以轻松地添加、删除或访问层级层。这种无缝交互之所以可能，是因为它们共同自自公共接口，并且可以访问相同的应用程序上下文。此外，这种设置允许层将自己分离，从而在系统内部提供自包含的功能。\n\
  \n请确保也测试检索和分离层是否有效。如果有必要，请花些时间消化，但我认为这应该是简单的。\n\n### 3.1.6 分发器接口 (Dispatcher Interface)\n\
  \n我们旨在实现的另一个方面是允许应用程序及其层发布事件。此外，它们应该能够附加回调函数，以监听特定特定事件。为了实现这一点，我们需要在应用程序接口中实现特定的方法。将（列表\
  \ [3.12]）定义的方法添加到你的应用程序接口中。\n\n| 列表 3.12：Application/Interface.h |\n\n```cpp\n/*\
  \  ...  与  之前  相同  ...  */\n\n//  附加事件回调\ntemplate <typename Event, typename Callback>\n\
  EMPY_INLINE void AttachCallback(Callback&& callback)\n{\n    m_Context->Dispatcher.AttachCallback<Event>(std::move(callback),\
  \ m_LayerID);\n}\n\n//  发布事件\ntemplate <typename Event, typename... Args>\nEMPY_INLINE\
  \ void PostEvent(Args&&...args)\n{\n    m_Context->Dispatcher.PostEvent<Event>(std::forward<Args>(args)...);\n\
  }\n\n//  发布任务事件\ntemplate <typename Task>\nEMPY_INLINE void PostTask(Task&& task)\n\
  {\n    m_Context->Dispatcher.PostTask(std::move(task));\n}\n\n//  分离回调\ntemplate\
  \ <typename Event>\nEMPY_INLINE void DetachCallback()\n{\n    m_Context->Dispatcher.DetachCallback<Event>(m_LayerID);\n\
  }\n\n//...  与  之前  相同\n```\n\n这些方法作为分发器函数的封装器。不需要担心潜在的性能损失，因为编译器会优化这些调用，利用 `EMPY_INLINE`\
  \ 关键字将它们压缩为单次调用，特别是在启用优化时（例如在发布构建中）。这些函数对于编辑器的用户界面至关重要，因为它们将成为引擎内部与 GUI 元素之间交互的桥梁。\n\
  \n你可以像（列表 [3.13]）所示在 `Empy.exe` 中测试这些函数。\n\n| 列表 3.13：EmpyEditor/src/Editor.cpp\
  \ |\n\n```cpp\n#include <Empy.h>\nusing namespace Empy;\n\nstruct TestEvent\n{\n\
  \    int32_t Data = 0;\n};\n\nstruct MyLayer : AppInterface\n{\n    EMPY_INLINE\
  \ void OnStart()\n    {\n        AttachCallback<TestEvent>([this] (auto event)\n\
  \        {\n            EMPY_TRACE(\"TestEvent: {}\", event.Data);\n           \
  \ DetachLayer<MyLayer>();\n        });\n    }\n\n    EMPY_INLINE void OnUpdate()\n\
  \    {\n        EMPY_TRACE(\"OnUpdate()\");\n\n        if(++m_Counter == 10)\n \
  \       {\n            PostEvent<TestEvent>();\n        }\n    }\n\nprivate:\n \
  \   uint8_t m_Counter = 0;\n};\n/*  ...  与  之前  相同  ...  */\n```\n\n这段代码定义了一个包含整数数据成员的\
  \ `TestEvent` 结构。在层的 `OnStart()` 方法中，我们为 `TestEvent` 附加了一个回调，记录其数据，随后分离层本身。在 `OnUpdate()`\
  \ 方法中，我们增加计数器成员变量。当计数器达到 10 时，层发布了一个 `TestEvent`。\n\n让你的想象飞翔，探索此功能带来的无限可能吧！我几乎能看到你头顶闪过的灯泡。接下来，我们将实现窗口并使用我们刚刚创建的分发器处理其输入和事件。\n\
  \n### 3.2 窗口事件处理\n\n我们选择利用图形库框架 (GLFW) 为我们的应用程序创建一个跨平台窗口。这一选择确保了对各种操作系统的兼容性，并为渲染我们引擎的输出奠定了基础。\n\
  \n#### 3.2.1 链接 GLFW\n\nGLFW 是一个旨在辅助 OpenGL 设计的轻量级工具库。它由 GLFW 开发团队开发维护，方便了窗口创建、OpenGL\
  \ 上下管理以及键盘、鼠标和摇杆的输入处理。它采用 zlib/libpng 许可证开源，允许轻松访问源代码进行自定义。除了支持多种视频模式和显示器外， GLFW\
  \ 被证明在 OpenGL 应用开发中非常有价值，且不会降低系统速度。\n\n| 列表 3.14：Root/conanfile.txt |\n\n```text\n\
  [requires]\nspdlog/1.12.0\nglfw/3.3.8\n\n[generators]\ncmake\n\n[options]\nglfw:shared=False\n\
  ```\n\n![PIC](img/image_rsrc733.jpg)\n图 3.3：Conan 中央仓库\n\n如（列表 [3.14]）所示更新你的 `conanfile.txt`。这使得我们的项目能够以静态库的形式链接\
  \ `GLFW`。我们也可以通过将共享选项设置为 \"True\" 来动态链接。在编写此时，`GLFW` 的最新版本是 \"3.3.8\"。通过此链接 [`conan.io/center/`](https://conan.io/center/)\
  \ 访问 Conan Center。在那里，你可以使用输入框搜索 \"glfw\"。参见（图 [3.3]）。\n\n如（图 [3.4]）所示扩展你的项目目录树。\n\
  \n![Picture]](image_rsrc734.jpg)\n 图 3.4：窗口\n\n#### 3.2.2 窗口输入\n\n将以下代码（列表 [3.15]）包含在\
  \ `Input.h` 文件中。它定义了一个存储窗口输入的结构。我们包含了键盘和鼠标的数据。\n\n| 列表 3.15：Input.h |\n\n```cpp\n\
