  \n许多引擎中非常常见的功能是内容浏览器。它提供了与项目中所有可用资产交互的能力。目标是实现类似的功能来可视化所有资产。下面的代码片段概述了实现过程。\n\n\
  | 列表 12.23: | EmpyEditor/src/Windows/Resource.h |\n\n```cpp\n#pragma once\n#include\
  \ \"Context.h\"\n\nstruct ResourceWindow : IWidget\n{\n    EMPY_INLINE ResourceWindow(GuiContext*\
  \ context): IWidget(context)\n    {\n        m_IconImage.Load(\"Resources/asset.png\"\
  );\n        m_Icon = (ImTextureID)m_IconImage.ID();\n    }\n\n    EMPY_INLINE void\
  \ OnShow(GuiContext* context) override\n    {\n        if (ImGui::Begin(ICON_FA_OPEN\
  \ \"\\tResources\"))\n        {\n            int nbrColumn = (ImGui::GetRegionAvail().x/ASSET_SIZE)\
  \ + 1;\n            int columnCounter = 1;\n            int rowCounter = 1;\n\n\
  \            context->AssetView(&\n            {\n                if (columnCounter++\
  \ <= rowCounter * nbrColumn)\n                    ImGui::SameLine();\n         \
  \       else\n                    rowCounter++;\n\n                // show asset\n\
  \                bool iSClicked = ImGui::ImageButtonEx(asset->UID,\n           \
  \         m_Icon, ImVec2(ASSET_SIZE, ASSET_SIZE), ImVec2(0, 1),\n              \
  \      ImVec2(1, 0), ImVec4(0, 0, 0, 1), ImVec4(1, 1, 1, 1));\n            });\n\
  \        }\n        ImGui::End();\n    }\n\nprivate:\n    Texture2D m_IconImage;\n\
  \    ImTextureID m_Icon;\n    AssetID m_Selected;\n};\n```\n\n值得注意的是，我们正在使用之前创建的纹理类型加载文件图标。该纹理随后在\
  \ `OnShow()` 函数中使用通过 `ImGui` 图像按钮渲染引擎中的每个可用资产。以下是结果图：\n\n* * *\n\n![PIC](img/image_rsrc77C.jpg)\n\
  \n| 图 12.20: | 资源窗口 |\n\n* * *\n\n这是 \"Editor.cpp\" 的最终代码：\n\n| 列表 12.24: | EmpyEditor/src/Editor.cpp\
  \ |\n\n```cpp\n#include \"Windows/Inspector.h\"\n#include \"Windows/Hierarchy.h\"\
  \n#include \"Windows/Resource.h\"\n#include \"Windows/Viewport.h\"\n#include \"\
