  \ |\n\n```cpp\n#include <random>\n\nnamespace Empy\n{\n    // 生成 64 位\n    EMPY_INLINE\
  \ uint64_t RandomU64()\n    {\n        static std::random_device device;\n     \
  \   static std::mt1937_64 generator(device());\n        static std::uniform_int_distribution<uint64_t>\
  \ distribution;\n        return distribution(generator);\n    }\n}\n```\n\n这里是天空盒和脚本的初始化方式：\n\
