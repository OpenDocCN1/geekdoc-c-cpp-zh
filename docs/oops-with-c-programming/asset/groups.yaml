    \ here\n}\ncatch (type org) // catches exception\n{\nnHand exception here\n}\n\
    ```\n\n## # 13.3 Multiple Catch Statements\n\nThe program segment can have more\
    \ than one condition to throw an exception. In such cases we can have more than\
    \ one catch blocks, which means one try block can have multiple catch blocks.\
    \ When an exception is thrown the exception handlers are searched in order for\
    \ an appropriate match, if the handler searches proper exception match then catch\
    \ block is executed. After executing the catch block, the control is transferred\
    \ to the next statement of the try block and when match is not found the program\
    \ is terminated. The catch block can have a single argument to catch thrown information.\n\
    \nGeneral Format of Multiple Catch Statements/Blocks:\n\n```cpp\ntry {\n    //\
    \ try block\n}\ncatch(type1 arg) {\n    // catch block1\n}\ncatch(type2 arg) {\n\
    \    // catch block2\n}\n\ncatch(type N arg) {\n    // catch blockN\n}\n```\n\n\
    Example:\n\n```cpp\n# include<iostream.h>\n# include<conio.h>\nvoid test(int x)\n\
    {\n  try {\n    if(x==1)\n    {\n      throw x;\n    }\n    else {\n      if(x==0)\n\
    \      {\n        throw x;\n      }\n      else {\n        if (x==-1)\n      \
    \  {\n          throw 1.0\n        }\n        cout<<\"end of try block\";\n  \
    \    }\n  } catch(char c) {\n    cout<<\"caught a character\";\n  }\n catch(int\
    \ m) {\n    cout<<\"caught an integer\";\n  }\n catch(double d) {\n    cout<<\"\
    caught a double\";\n  }\n  cout<<\"end of catch block\";\n}\nvoid main() {\n \
    \ cout<<\"x=1\"<<endl;\n  test(1);\n  cout<<\"x=0\"<<endl;\n  test(0);\n}\n```\n\
    \n## # 13.4 Rethrowing and Exception\n\n```cpp\ncout<<\"for x=-1\"<<endl;\ntest(-1);\n\
    cout<<\"for x=2\"<<endl;\ntest(2);\ngetch();\n}\n```\n\nA catch handler will decide\
    \ to rethrow the exception caught without processing. In such situation we have\
    \ to simply throw keyword followed by semicolon (;) without arguments.\nthrow;\n\
    \nThis statement calls the exception to be thrown to the next enclosing try catch\
    \ block. But the prototype of the next catch block should match.\nIf we wish to\
    \ rethrow an exception from within an exception handler, we may do so by calling\
    \ throw, by itself, with no exception. This causes exception to be passed to an\
    \ outer try/catch sequence. It allows multiple handlers access to the exception.\n\
    \nAn exception can only be rethrown within a catch block. When rethrow an exception,\
    \ it will not be caught by the same catch statement. It will propagate outward\
    \ to the next catch statement.\n\nExample:\n```cpp\n# include<iostream.h>\n# include<conio.h>\n\
    \nvoid divide(double x, double y)\n{\n    cout<<\"Inside function\";\ntry\n  \
    \  {\n        if (y==0)\n            throw y;\n        else\n            cout<<\"\
    division=\"<<x/y;\n    }//end of try block\ncatch(double)\n{\n    cout<<\"catch\
    \ double inside the function\";\n    throw;\n    }//end of catch block\n    cout<<\"\
    end of function\";\n} //end of function divide\nvoid main()\n```\ncout<<\"Inside\
    \ main function\"\ntry\n{\n    divide(10.5,2.0);\n    divide(20.0,0.0);\n}\ncatch(double)\n\
    {\n    cout<<\"caught inside the main function\";\n}\ncout<<\"end of main\"\n\
    getch();\n```\n\n## # 13.5 Specifying Exception\n\nYou can restrict the type of\
    \ exceptions that a function can throw outside of itself. We can also prevent\
    \ a function from throwing any exceptions whatsoever. It is possible to restrict\
    \ a function to throw only certain specified exceptions. This can be achieved\
    \ by adding throw clause to a function definition.\n\nThe general form of using\
    \ specific exception is given below:\nret-type function-name(arg-list) throw (type-list)\n\
    \n```cpp\n{\n    __________\n    __________\n    function body\n}\n```\n\nThe\
    \ type of exceptions that a function can throw outside of itself. We can also\
    \ prevent a function from throwing any exceptions whatsoever. It is possible to\
    \ restrict a function to throw only certain specified exceptions. This can be\
    \ achieved by adding throw clause to a function definition.\n\nThe general form\
    \ of using specific exception is given below:\nret-type function-name(arg-list)\
    \ throw (type-list)\n\n```cpp\n{\n    __________\n    __________\n    function\
    \ body\n}\n```\n\nThe type of exceptions that a function can throw outside of\
    \ itself. We can also prevent a function from throwing any exceptions whatsoever.\
    \ It is possible to restrict a function to throw only certain specified exceptions.\
    \ This can be achieved by adding throw clause to a function definition.\n\nExample:\n\
    ```cpp\n# include<iostream.h>\n# include<conio.h>\nvoid test(int x)\n{\n  try\
    \ {\n    if(x==1)\n    {\n      throw x;\n    }\n    else {\n      if(x==0)\n\
    \      {\n        throw x;\n      }\n      else {\n        if (x==-1)\n      \
    \  {\n          throw 1.0\n        }\n        cout<<\"end of try block\";\n  \
    \    }\n  } catch(char c) {\n    cout<<\"caught a character\";\n  }\n catch(int\
    \ m) {\n    cout<<\"caught an integer\";\n  }\n catch(double d) {\n    cout<<\"\
    caught a double\";\n  }\n  cout<<\"end of catch block\";\n}\nvoid main() {\n \
    \ cout<<\"x=1\"<<endl;\n  test(1);\n  cout<<\"x=0\"<<endl;\n  test(0);\n}\n```\n\
    \n## # 13.6 Advantages of Exception\n\n- 1. With the help of exception we can\
    \ detect logical as well as syntactic errors.\n- 2. With the help of exception\
    \ at Run time we can catch the error and throw the error message to the user.\n\
    - 3. Exception handling provides safe integrated approach.\n- 4. The synchronous\
    \ exceptions can be created by the user, hence user can control the program.\n\
    - 5. The main advantage of exception handling mechanism is to detect an exception\
    \ and report on circumstances so that the user can take appropriate action.\n\
    - 6. One program segment can have multiple conditions, all these conditions can\
    \ be handled by multiple catch blocks that means one try can have multiple catch\
    \ blocks.\n- 7. The exceptions are divided into 3 Modulus. Try block, throw statement,\
    \ catch block. Hence it supports Modularisation.\n- 8. Exception handling supports\
    \ Rethrowing an exception from one catch block to another catch block.\n- 9. The\
    \ exception handling supports certain security on specified exceptions, that means\
    \ the restrictions can be applied on throwing exceptions.\n"
