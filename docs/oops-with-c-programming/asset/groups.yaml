    - 8. C++ supports memory management concept with the help of constructors and\
    \ destructors using new and delete.\n- 9. C++ supports default arguments for member\
    \ functions.\n- 10. C++ allows us to create different templates.\n- 11. C++ supports\
    \ error handling with exception handling.\n- 12. C++ supports virtual functions.\n\
    - 13. C++ supports 48 keywords or reserved words.\n\n## 1.10 Structure of C++\
    \ Program\n\n```cpp\ninclude section/Link section\nclass declaration\nclass function\
    \ definition\nint main () {\n    local declaration;\n    stmt;\n    stmt;\n  \
    \  return 0;\n}\n```\n\n- 1. Include section: In this section, # is a preprocessor\
    \ directive which directs inclusion of header file specified in the Include statement.\n\
    C++ is having character stream functions for input and output. Hence it is having\
    \ cin and cout. Istream is the buffer defined in streambuffer class to store set\
    \ of characters from input device. Ostream is a buffer which is provided by streambuffer\
    \ class to display stream of characters. Iostream is the buffer defined in streambuffer\
    \ class which is used to store and display stream of characters, with the help\
    \ of iostream, cin and cout statement can be used.\n- 2. Class declaration: This\
    \ class, classname with different data members and member functions defined in\
    \ public or private scope of class. Class declaration is enclosed between { }\
    \ (curly braces) and class declaration should be terminated by;\n- 3. Class function\
    \ definition: The member functions which are declared inside the class declaration\
    \ then these functions can be defined outside the class function declaration.\n\
    - 4. Return type of main(): In C++, main returns an integer type value to the\
    \ operating system i.e. main function should end with return statement. Return\
    \ type can be void which indicates main function does not return any value.\n\n\
    ## Introduction to OOPs and C++ with Variable and Operators\n\nExample:\n```cpp\n\
    #include <iostream.h>\nint main () {\n  cout << \"Welcome to C++\";\n  return\
    \ 0;\n}\n```\n\n## 1.11 Basic Data Types in C++\n\nData types in C++ can be classified\
    \ under various categories:\n\n![](img/3ca37d43fd74bff81a4127f37a84753d_18_0.png)\n\
    \nA. Built-in-type:\n\n- (a) Integral type: The data types in this type are int\
    \ and char. The modifiers signed, unsigned, long and short may be applied to char\
    \ and integer basic data type.\nThe size of int is 2 bytes and the size of char\
    \ is 1 byte.\nWe can use normally.\n- (I) int can store integers in the range\
    \ -32767 to 32767.\n- (II) unsigned can store integers in the int range 0 to 65535.\n\
    - (III) char - stores character.\n- signed char – characters stored like type\
    \ char\n- can store integers in the range – -127 to 127\n- unsigned char – characters\
    \ stored like type char\ncan store integers in the range 0 to 255\n- short – can\
    \ store integers smaller compared to using int. it can be used with short int,\
    \ signed short, short int.\n- long – can store integers in the range – -2147483647\
    \ to 2147483647\ncan be used as long int, signed long,\n- unsigned long – can\
    \ store integers in the range – 0 to 4294967295\n\nvoid\nvoid is used for:\nTo\
    \ specify the return type of a function when it is not returning any value.\n\
    To indicate an empty list to a function\ne.g.\n\n| voidfunction(void) |\n| ---\
    \ |\n| Indicate | indicates |\n| No Return | empty parameters |\n| type = |\n\n\
    floating type\nThe data in this can be float or double. The size of the float\
    \ is 4 bytes and size of double is 8 bytes. It is used to store the numbers with\
    \ decimal. The modifier long can be applied to double and the size of long double\
    \ is 10 bytes.\n- (i) float data type supports precision numbers.\n- (ii) double\
    \ data can store double precision numbers and having size greater than float.\n\
    \n- long double can store double precision numbers and having size greater than\
    \ double.\n\nB.User-defined type:\nare the data types created by the user by combining\
    \ of inbuilt data types.\n\n- (a) Structure: Structure is user defined data type.\
    \ It is collection of different data types in one unit or user data type i. structure\
    \ also called as compound type. The convention is used, scope of members is by\
    \ default public.\n- (b) Union: Union is user defined data type. It is also collection\
    \ of different data types in one encapsulated unit union. The used is union. It\
    \ can store values of different types in a single location, scope of members is\
    \ by default public.\n- (c) Class: Class is a user defined data type which can\
    \ be used just like any other basic data type declared as objects. For classes\
    \ all variables are by default private. The convention used is class, also called\
    \ compound type.\n- (d) Enumeration:\n\n- (i) An enumerated data type is another\
    \ user defined type which provides a way of attaching names to numbers to increase\
    \ simplicity of the code.\n- (ii) Enumerations are a distinct type from ints,\
    \ ints are not implicity converted to enums.\n- (iii) It uses enum keyword which\
    \ automatically enumerates a list of words by assigning them values 0, 1, 2.\n\
    - (iv) By default, enumerators are assigned integer value starting with 0.\n\n\
    ## Introduction to OOPs and C++ with Variable and Operators\n\n## C. Derived data\
    \ types:\n\n- (a) Arrays: Array is a derived type. It is a collection of similar\
    \ data elements. It can be collection of integers, characters.\n\n```cpp\ndatatype\
    \ arrayname [size of array]\nint x[10];\n```\n\ndata objects are stored in consecutive\
    \ memory locations under a common heading or variable name.\n\n- (b) Functions:\
    \ functions are the derived functions called user defined to perform specific\
    \ task. Compare to C there is lots of modification in C++ due to object oriented\
    \ in concept.\n\n- (c) Pointers: Pointers can be used to point and reference address\
    \ of another variable. In C++ concept of constant pointer and pointer to a constant\
    \ pointer can be used.\ne.g. char const *P1 = \"Welcome\";\n\n- * pointer allows\
    \ returned structures from function.\n- It allows to pass variables, arrays, functions,\
    \ strings and structures as function argument.\n- It supports dynamic allocation\
    \ and deallocation of memory segments.\n\n| Sr. | Type | Bytes | Range |\n|---|---|---|---|\n\
    | 1 | Char | 1 | -128 to 127 |\n| 2 | Unsigned char | 1 | 0 to 255 |\n| 3 | Signed\
    \ char | 1 | -128 to 127 |\n| 4 | Int | 2 | -32768 to 32767 |\n| 5 | Unsigned\
    \ int | 2 | 0 to 65535 |\n| 6 | Signed int | 2 | -32768 to 32767 |\n| 7 | Short\
    \ int | 2 | -32768 to 32767 |\n| 8 | Unsigned short int | 2 | 0 to 65535 |\n|\
    \ 9 | Signed int | 2 | -32768 to 32767 |\n| 10 | Long int | 4 | -2147483647 to\
    \ 2147483647 |\n| 11 | Unsigned int | 4 | 0 to 4294967295 |\n| 12 | float | 4\
    \ | 3.4E-38 to 3.4E+38 |\n| 13 | Double | 8 | 1.7E-308 to 1.7E+308 |\n| 14 | long\
    \ double | 10 | 3.4E-4932 to 3.4E+4932 |\n\n## 1.12 C++ Operators\n\n| C++ Operators\
    \ | | |\n|---|---|---|\n| (1) | Arithmetic Operators | |\n| (2) | Assignment Operators\
    \ | |\n| (3) | Comparison and Logical Operators | Relational Operators, Logical\
    \ Operators, Equality Operators |\n| (4) | Bitwise Logical Operators | |\n| (5)\
    \ | Special Operators | (a) Unary operators, (b) Ternary operator, (c) Comma operator,\
    \ (d) Scope operator, (e) New and delete operator, (f) Other operators |\n\n##\
    \ 1. Arithmetic Operators\n\nThe operators used to perform arithmetic operations\
    \ such as addition (+), subtraction (-), multiplication (*), division (/) are\
    \ called arithmetic operators. These basic operators are known as binary operators\
    \ as require two variables to be evaluated.\n\n| Sr. No. | Operator | Meaning\
    \ |\n|---|---|---|\n| 1. | + | Addition or unary plus |\n| 2. | | Subtraction\
    \ or unary minus |\n| 3. | * | Multiplication |\n| 4. | / | Division |\n| 5. |\
    \ % | Modulo division (Reminder of an Integer division) |\n\nThe variables and\
    \ constants on which operators are operated are known as operands. The arithmetic\
    \ in C++ can be of three types:\n\n- (a) Integer Arithmetic.\n- (b) Real Arithmetic.\n\
    - (c) Mixed Mode Arithmetic.\n\n- (a) Integer Arithmetic: When both operands are\
    \ integers, the operation is called integer arithmetic.\n e.g.\n55 - 5 = 50\n\
    55 + 5 = 60\n14 * 2 = 28\n14/2 = 7 (Decimal part truncated integer division)\n\
    14% 2 = 0 (Remainder of division)\n-14 % 3 = -2\n14 % 3 = 2\n6 / 7 = 0\n"
  mdcn: "\n\nC++ 编程中的 12 个 OOP\n\n- 6. C++ 支持带有类重用性的继承概念。\n- 7. C++ 支持友函数和友类。\n- 8.\
    \ C++ 支持通过使用 `new` 和 `delete` 构造函数和析构函数来实现内存管理概念。\n- 9. C++ 支持成员函数使用默认参数。\n- 10.\
    \ C++ 允许我们创建不同的模板。\n- 11. C++ 支持使用异常处理进行错误处理。\n- 12. C++ 支持虚函数。\n- 13. C++ 支持\
    \ 48 个关键字或保留字。\n\n## 1.10 C++ 程序的结构\n\n```cpp\ninclude section/Link section\n\
    class declaration\nclass function definition\nint main () {\n    local declaration;\n\
    \    stmt;\n    stmt;\n    return 0;\n}\n```\n\n- 1. **包含部分**：在此部分中，`#` 是一个预处理器指令，用于包含在\
    \ Include 语句中指定的头文件。C++ 具有用于输入输出的字符流函数。因此，它拥有 `cin` 和 `cout`。`Istream` 是在 `streambuffer`\
    \ 类中定义的缓冲区，用于存储从输入设备获取的字符集。`Ostream` 是由 `streambuffer` 类提供的用于显示字符流的缓冲区。`iostream`\
    \ 是在 `streambuffer` 类中定义的缓冲区，用于存储和显示字符流，帮助可以使用 `cin` 和 `cout` 语句。\n- 2. **类声明**：该类（`classname`）在类的公有或私有作用域内定义了不同的数据成员和成员函数。类声明被包含在\
    \ `{ }`（大括号）之间，且类声明应以 `;` 结束。\n- 3. **类函数定义**：在类声明内部声明的成员函数可以在类函数声明外部进行定义。\n-\
    \ 4. **`main()` 的返回值类型**：在 C++ 中，`main` 向操作系统返回一个整数类型的值，即 `main` 函数应该以 `return`\
    \ 语句结束。返回值可以是 `void`，表示 `main` 函数不返回任何值。\n\n## 带有变量和运算符的 OOP 与 C++ 简介\n\n示例：\n\
    ```cpp\n#include <iostream.h>\nint main () {\n  cout << \"Welcome to C++\";\n\
    \  return 0;\n}\n```\n\n## 1.11 C++ 中的基本数据类型\n\nC++ 中的数据类型可以分为以下几类：\n\n![](img/3ca37d43fd74bff81a4127f37a84753d_18_0.png)\n\
    \nA. **内置类型**：\n\n- (a) **整数类型**：该类型的数据类型为 `int` 和 `char`。修饰符 `signed`、`unsigned`、`long`\
    \ 和 `short` 可以应用于 `char` 和整数基本数据类型。\n`int` 的大小为 2 字节，`char` 的大小为 1 字节。\n我们可以正常使用。\n\
    - (I) `int` 可以存储 -32767 到 32767 范围内的整数。\n- (II) `unsigned` 可以存储 0 到 65535 范围内的整数。\n\
    - (III) `char` - 存储字符。\n- `signed char` – 存储方式类似于 `char` 类型。\n- 可以存储 -127 到 127\
    \ 范围内的整数。\n- `unsigned char` – 存储方式类似于 `char` 类型。\n- 可以存储 0 到 255 范围内的整数。\n- `short`\
    \ – 可以存储比使用 `int` 更小的整数。它可以与 `short int`、`signed short`、`short int` 使用。\n- `long`\
    \ – 可以存储 -2147483647 到 2147483647 范围内的整数。\n- 可以作为 `long int`、`signed long` 使用。\n\
    - `unsigned long` – 可以存储 0 到 4294967295 范围内的整数。\n\n`void`\n`void` 用于：\n当函数不返回任何值时指定其返回类型。\n\
    指示一个空列表。\n例如。\n\n| void(void) |\n| --- |\n| Indicate |\n| No Return |\n| type\
    \ = |\n\n**浮点类型**：\n`float` 类型支持小数数字。\n- (i) `float` 数据类型。\n- (ii) `double` 可以存储精度大于\
    \ `float` 的小数数字。\n- (iii) `long double` 可以存储精度大于 `double` 的小数数字。\n\nB. **用户定义类型**：\n\
    通过组合内置数据类型创建的数据类型。\n\n- (a) **结构体 (Structure)**：结构体是一种用户定义类型。它是一个单元内不同数据类型的集合。结构体成员的作用域默认是公有的。\n\
    - (b) **联合体 (Union)**：联合体是一种用户定义类型。它在单一位置内存储不同类型的集合。联合体结构体成员的作用域默认是公有的。\n- (c)\
    \ **类 (Class)**：类是一种用户定义类型，可以像任何基本数据类型一样使用。类的成员的作用域默认是私有的，也称为复合类型。\n- (d) **枚举\
    \ (Enumeration)**：\n- (i) 枚举类型是另一种用户定义类型，提供将名称附加到数字的方法。\n- (ii) 枚举会将整数隐式地转换为枚举。\n\
    - (iii) 使用 `enum` 关键字通过赋值 0, 1, 2 等整数值。\n- (iv) 默认情况下，枚举器从 0 开始。\n\nC. **派生数据类型**：\n\
    \n- (a) **数组 (Arrays)**：数组是一种派生类型。它是相似元素的集合，存储在连续的内存位置中。\n```cpp\ndatatype arrayname\
    \ [size]\nint x[10];\n```\n- (b) **函数 (Functions)**：函数是执行特定任务的派生函数。由于面向对象的概念，在\
    \ C++ 中有很多修改。\n- (c) **指针 (Pointers)**：指针可以指向另一个变量的地址。常量指针和指向常量的指针可以使用。例如 `char\
    \ const *P1 = \"Welcome\";`。\n- 指针允许将变量、数组、函数和结构体作为函数参数传递。\n- 支持内存的动态分配和释放。\n\n\
    | Sr. | Type | Bytes | Range |\n|---|---|---|---|\n| 1 | Char | 1 | -128 to 127\
    \ |\n| 2 | Unsigned char | 1 | 0 to 255 |\n| 3 | Signed char | 1 | -128 to 127\
    \ |\n| 4 | Int | 2 | -32768 to 32767 |\n| 5 | Unsigned int | 2 | 0 to 65535 |\n\
    | 6 | Signed int | 2 | -32768 to 32767 |\n| 7 | Short int | 2 | -32768 to 32767\
    \ |\n| 8 | Unsigned short int | 2 | 0 to 65535 |\n| 9 | Signed int | 2 | -32768\
    \ to 32767 |\n| 10 | Long int | 4 | -2147483647 to 2147483647 |\n| 11 | Unsigned\
    \ int | 4 | 0 to 4294967295 |\n| 12 | float | 4 | 3.4E-38 to 3.4E+38 |\n| 13 |\
    \ Double | 8 | 1.7E-308 to 1.7E+308 |\n| 14 | long double | 10 | 3.4E-4932 to\
    \ 3.4E+4932 |\n\n## 1.12 C++ 运算符\n\n| C++ Operators | | |\n|---|---|---|\n| (1)\
    \ | 算术运算符 | |\n| (2) | 赋值运算符 | |\n| (3) | 比较和逻辑运算符 | 关系运算符、逻辑运算符、相等运算符 |\n| (4)\
    \ | 位逻辑运算符 | |\n| (5) | 特殊运算符 | (a) 一元运算符,(b) 三元运算符,(c) 逗号运算符,(d) 作用域运算符,(e) new\
    \ 和 delete 运算符,(f) 其他运算符 |\n\n## 1. 算术运算符\n\n用于执行加法 (+)、减法 (-)、乘法 (*)、除法 (/) 等算术操作的运算符称为算术运算符。这些基本运算符因为需要两个变量进行求值而被称为二元运算符。\n\
    \n| Sr. No. | Operator | 意义 |\n|---|---|---|\n| 1. | + | 加法或一元加 |\n| 2. | - |\
    \ 减法或一元减 |\n| 3. | * | 乘法 |\n| 4. | / | 除法 |\n| 5. | % | 取模运算（整数除法的余数） |\n\n运算符操作的变量和常量称为操作数。C++\
    \ 中的算术可以分为三种类型：\n\n- (a) 整数算术。\n- (b) 实数算术。\n- (c) 混合模式算术。\n\n- (a) **整数算术**：当两个操作数都是整数时，该操作被称为整数算术。\n\
    \ 例如：\n55 - 5 = 50\n55 + 5 = 60\n14 * 2 = 28\n14/2 = 7 (小数部分截断的整数除法)\n14% 2 =\
    \ 0 (整数除法的余数)\n-14 % 3 = -2\n14 % 3 = 2\n\n"
