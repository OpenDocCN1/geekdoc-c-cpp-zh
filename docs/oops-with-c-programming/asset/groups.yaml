    # For Loops:


    A for loop is another way to perform something that needs to be repeated in C++
    (repetition). Most programmers like to use for loops because the code can be written
    in a more compact manner compared to the same loop with a while or do loop. A
    for loop is generally used when you know exactly how many times a section of code
    needs to be repeated. The general form of a for loop is as follows:


    ```

    for ( expression1;expression2;expression3 )

    stmt(s);

    ```


    where stmt1 is a single or compound statement. Expression2 is used to determine
    whether or not the loop will continue; expression3 is evaluated at the end of
    each iteration or cycle.


    Note 1: Expression2 is tested before the stmt and expression3 are executed; Expression1
    is used to initialize the loop;


    Note 2: Any or of the 3 expressions in a for can be omitted, but the semi-colons
    must remain. If expression1 is omitted, there is no initialization done in the
    loop but you might not need any initialization for your program. If expression2
    is omitted, there is no test section so you will essentially have an infinite
    loop. If expression3 is omitted, there is no update as part of the statement,
    but the update could be done as part of the statement in the body of the loop.


    In general, a for loop can be written as an equivalent while loop and vice versa.


    ```

    for ( expression1;expression2;expression3 )

    stmt;

    isquivalent to...

    expression1;

    while (expression2)

    {

    stmt(s);

    expression3;

    }

    ```


