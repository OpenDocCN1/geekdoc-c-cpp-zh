    # 11 File Handling Chapter


    ## Chapter Outline


    - 11.1 Introduction to File Handling

    - 11.2 Classes for File Stream Operations

    - 11.3 Opening and Closing a File

    - 11.4 Detecting End of File

    - 11.5 More about Open (): File Modes

    - 11.6 File Pointer and their Manipulations

    - 11.7 Sequential Input and Output Operations

    - 11.8 Reading and Writing a Class Object

    - 11.9 Updating a File

    - 11.10 Error Handling During File Operations

    - 11.11 Command-Line Arguments


    ## 11.1 Introduction to File Handling


    A file is a collection of related data stored in a particular area on the disc.
    The program can be designed to perform Read and Write operations on these files
    through file handling program. We can transfer the data between console and file
    and between the files and monitor.


    The istream of C++ file operations operate similarly to console I/O operations.
    It uses file streams to interface between program and file. The stream that supplies
    data to the program is called as input stream. The stream which receives data
    is known as output stream. The I/O stream file consists of istream methods and
    ofstream methods.


    Similarly fstream is of ifstream and ofstream it also supports one file buffer
    class to store data. All these file stream classes are derived from fstream base
    class.


    Input stream

    data input

    Disk file

    program

    data output

    write data


    # File input and output streams


    The I/O system uses file streams as an interface between the programs and the
    files. The stream that supplies data to the program is known as input stream and
    the one that receives data from the program is known as output stream.


    The input stream OR reads data from the file and output stream is used to insert
    or write data to the file.


    The input operation is used to create input stream and this input data link to
    the program and output operation involves establishing an output stream. It takes
    data output from the program to output stream and writes the data to disk files.


    ## 11.2 Classes for File Stream Operations


    The I/O system of C++ contains a set of classes that define the file handling
    methods.


    These include ifstream, ofstream and fstream.


    These classes are derived from fstreambase and from the corresponding ios class.


    These classes, designed to manage the disk files, are declared in fstream and
    therefore we include this file in any program that uses files.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_161_0.png)


    Stream classes for file operations


    # File Handling


    ios is a class consist of istream and ostream class, istream is the input stream
    class and ostream is the output stream, fstream base class consist of istream
    and of classes used for creating input stream and output stream.


    iostream class has input stream (Istream) and ostream (output stream).


    Stringbuf has filebuf class.


    fstream has istream and ofstream, fstream functions meaning open for reading only.
    Ofstream functions meaning open for writing only.


    ## 11.3 Opening and Closing a File


    If we want to use a file then following things are considered.


    1. Give suitable name to the file.

    2. Give proper datatypes. Structure of the file depends on the contents of a file.

    3. Specify the purpose of the file by specifying the mode of the file either in
    Read or Write purpose.

    4. Opening Method when in Sequential or Random.


    For opening fstream is used


    1. filebuf ⇒ Its purpose is to set the file buffers to read and write.

    2. fstreambase ⇒ It serves as a base for fstream, istream and ofstream class.
    Contains open() and close() functions.

    3. istream ⇒ provides input operations open with default input mode. It inherits
    the functions get(), getline(), read(), seekg() and tell() functions from istream.

    4. ofstream ⇒ provides output operation. Contains open() with default output mode.
    It inherits put(), seek(), tell() and write() functions from ofstream.

    5. fstream ⇒ It contains open() method with default input mode. It inherits all
    the functions from istream and ofstream classes through istream.


    For opening a file, we must first create a file stream and then link it to the
    filename. A file stream can be defined using classes istream, ofstream and fstream
    that are contained in fstream.h header file


    A file can be opened in two ways:


    1. Using the constructor function of the class.

    2. Using the member function open() of the class.


    # Using the constructor functions of the class:


    This method is used when we use only one file in the stream as we know constructor
    is used to initialise the object when object is created. Here filename is used
    to initialize the file stream object.


    This involves the following steps:


    (a) Create a file stream object with appropriate stream class.

    (b) ofstream is used to create output stream fstream is used to create input stream.


    # For example:


    ofstream infile("abc.txt");


    ofstream is a class, outfile is a object of ofstream class within object parameters.
    We are specifying

    the filename that means we are calling paramiserised constructor of ofstream.
    Hence if we want to

