    # 13.6 Advantages of Exception Handling


    +   1. With the help of exception we can detect logical as well as syntactic errors.

    2. With the help of exception at the Run time we can catch the error and throw
    the error message to the user.

    3. The exception handling provides safe integrated approach.

    4. The synchronous exceptions can be created by the user, hence user can control
    the program.

    5. The main advantage of exception handling mechanism is to detect an exception
    and report on circumstances so that the user can take appropriate action.

    6. One program segment can have multiple conditions, all these conditions can
    be handled by multiple catch blocks that means one try can have multiple catch
    blocks.

    7. The exceptions are divided into 3 Modulus. Try block, throw statement, catch
    block. Hence it supports Modularisation.

    8. Exception handling supports Rethrowing an exception from one catch block to
    another catch block.

    9. The exception handling supports certain security on specified exceptions, that
    means the restrictions can be applied on throwing exceptions.


