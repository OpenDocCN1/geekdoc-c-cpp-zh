    # ## 2.1 Introduction to Control Structures


    Controlling the flow of a program is a very important aspect of programming. There
    may be many different ways to find the solution to a particular problem, but you
    will want to look for the best and fastest way.

    The control structures contain one logical statement, which is usually a block
    of statements enclosed in curly braces {}.

    Indenting control structures is essential to making readable programs. There are
    several styles. The style I use is the common industrial or K&R style. The opening
    curly brace is on the end of the beginning statement. The idea is to avoid creating
    too much white space separating the parts of the statement. Indentation is usually
    best with 4 spaces, also 3 and 2 are also used.

    **True/false** values are used in the **if** and loop statements. These are either
    the Boolean values **true** and **false**, or any non-zero value for true and
    zero for false (as in C).


    C++ has four types of control structures: sequential, selection (decision), repetition
    (loops), and subprograms (functions). These structures simply control the execution
    of a program.'
