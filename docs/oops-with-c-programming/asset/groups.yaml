    ## 14.4 算法


    算法作用于容器。它们提供了操纵容器内容的手段。


    算法可以容器的。


    STL  不同的算法。


    STL 的分类如下：


    - 1. 获取非修改算法

    - 2. 变异算法

    - 3. 排序算法

    - 4. 集合算法

    - 5. 关系算法


    1. 获取非修改算法：

    (a) find() 找到相邻元素。

    (b) count() 统计值的出现次数。

    (c) count_n 计数。

    (d) equal() 检查范围是否相同。

    (e) find() 在容器中查找。

    (f) find() 找到值的最后出现位置。

    (g) each() 对每个元素应用操作。

    (h) mismatch() 找到元素不同的元素。

    (i) search() 搜索容器。

    (j) search_n 搜索数量。


    2. 变异算法：

    (a) copy() 拷贝序列。

    (b) backward() 从末尾拷贝。

    (c) fill() 用指定值填充序列。

    (d) fill_n 填充 n 个元素。

    (e) generate() 用结果替换所有元素。

    (f) iter_swap() 通过迭代器交换元素。

    (g) remove() 删除指定的元素。

    (h) remove_copy() 在删除后拷贝。

    (i) replace() 用指定值替换元素。

    (j) reverse() 反转元素的顺序。

    (k) rotate() 旋转元素。

    (l) swap() 交换元素。

    (m) swap_range() 交换两个序列。

    (n) transform() 对所有元素应用操作。

    (o) unique() 删除相邻元素。

    (p) unique_copy() 在移除相邻元素后拷贝。


    3. 排序算法：

    (a) binary_search() 在有序序列上进行二分查找。

    (b) merge() 合并两个排序的序列。

    (c) sort() 排序序列。

    (d) sort_heap() 排序堆。

    (e) partial_sort() 排序序列的一部分。

    (f) pop_heap() 删除顶元素。

    (g) push_heap() 向堆添加元素。

    (h) upper_bound() 找到指定值的最后位置。


    4. 集合算法：

    (a) include() 检查一个序列是否是另一个的子序列。

    (b) set_difference() 构建两个有序集合的差集序列。

    (c) set_union() 产生两个有序集合的并集。


    5. 关系算法：

    (a) equal() 检查两个序列是否相同。

    (b) max() 两个值的最大值。

    (c) max_element() 找到序列内的最大元素。

    (d) min() 两个值的最小值。

    (e) min_elements() 找到序列内的最小元素。


    '
