    3. Simulation and modeling.

    4. Neural networks and parallel programming.

    5. Decision support and office automation system.

    6. CIM/CAM/CAD systems.


    # 1.8 What is C++?


    +   1. C++ is an object oriented programming language developed by Bjarne Ststrup
    at AT & T Bell laboratories.

    2. C++ is an extension of C with major addition of the class (encapsulated unit)
    feature.

    3. C++ is a system programming language, used to create different programs for
    the system.


    # 1.9 Features of C++ Language


    +   1. C++ is a case sensitive language.

    2. C++ supports all features of structure as well object oriented programming
    language.

    3. C++ is a versatile language for handling large programs. System programs can
    be created with the help of C++ language.

    4. C++ supports data encapsulation and data abstraction with data hiding concept
    with powerful keywords like private, public and protected.

    5. C++ supports data polymorphism concept with operator and function overloading.'
