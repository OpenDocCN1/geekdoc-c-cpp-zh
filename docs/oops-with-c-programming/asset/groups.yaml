  - '[PAGE 197]


    # # 14 Standard Template Library


    # Chapter


    +   ### Chapter Outline

    * 14.1 Introduction

    * 14.2 Component of STL

    * 14.3 Containers

    * 14.4 Algorithms

    * 14.5 Iterators

    * 14.6 Applications of Container Classes


    # ## 14.1 Introduction


    Templates are used to create generic classes and functions. Templates are used
    to create classes (data structures) and functions (algorithms).


    The collection of these classes and function is called Standard Template Library
    (STL).\STL components are part of standard C++ Library defined in the namespace
    std.

    Hence to use this namespace we can write.


    using namespace std;

    This statement is like statement. It indicates to the compiler that we want to
    use standard C++ library.


    **STL has three fundamental items:**


    +   (a) Containers (b) Algorithms (c) Iterators.


    Containers are objects that hold other objects like vector (dynamic array), deque
    (double-ended queue) and linear list.


    Algorithms act on containers. They provide the means by which you will manipulate
    the content of containers. Here sorting, searching of contents of containers can
    be done.


    Iterators are objects that act, more or less, like pointers.'
  - '[PAGE 198]


    # 14.2 Component of STL


    The STL contains several components. It''s core has three key components.


    +   1. Containers

    2. Algorithms

    3. Iterators


    These three components work in conjunction with one another to provide support
    to a variety of programming solutions.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_198_0.png)


    Algorithms employ iterators to perform operations stored in containers.


    +   1. Container is an object that actually stores data and containers are objects
    that hold other objects. It is a data organised in memory.

    The STL containers are implemented by easily customised to hold different types
    of data.

    2. Algorithms ⇒ Algorithms act on containers. They provide the means by which
    you will manipulate the contents of containers. An algorithm is a procedure that
    is used to process the data contained in the container. The STL includes many
    different kinds of algorithms to provide support to tasks such as initializing,
    searching, copying, sorting and merging. Algorithms are implemented by template
    functions.

    3. Iterators ⇒ Iterators are objects that act, more or less like pointers. An
    iterator is a pointer that points to an element in a container. We can use iterators
    to move through the contents of containers. Since iterators are like pointers,
    we can increment or decrement them. Iterators connect algorithms with containers
    and play a key role in the manipulation of data stored in containers.


    # 14.3 Containers


    Containers are objects that hold other objects of same type. It contains vector
    class, defines dynamic array, deque create double ended queue and list provides
    a linear list.


    The STL defines ten containers which are grouped into three categories'
  - '[PAGE 199]


    # # Containers


    | (A) | (B) | (C) |

    | --- | --- | --- |

    | Sequence containers | Associative containers | Derived containers |

    | - vector | - set | - stack

    | - deque | - multiset | - queue

    | - list | - map | - priority-

    | | - multimap | queue


    Sequence Containers:

    Vector is a dynamic array. It allows insertions and deletions at both, permits
    direct access to any element. List is linear list, allows insertions and deletion
    anywhere; deque is double-ended queue, allows insertions and deletions at both
    ends, permits direct access to any element.


    Associative Containers:

    Set ⇒ It is an associative container for storing unique sets. No duplication is
    allowed. It allows rapid Lookup & Search.


    Multiset ⇒ It is an associative container for storing non-unique sets. (Duplicate
    allowed)

    Map ⇒ An associative container for storing unique key/value pairs. Each key is
    associated with only one value (one-to-mapping).


    Multimap ⇒ It is an associative container for storing key/value pairs in which
    one key may be associated with more than one value (one-to-many mapping). Allows
    key-based Lookup.


    Derived Containers:

    1. stack ⇒ A standard stack LAST FIRST OUT (LIFO).

    2. queue ⇒ A standard queue FIRST IN OUT (FIFO).

    3. priority queue ⇒ A priority queue. The first element out is always the highest
    priority element.


    +   (A) Sequence Containers:

    (i) Sequence containers store elements in a linear sequence.

    (ii) Each element is related to other elements by its position along the line.

    (iii) These elements can expand to allow insertion of elements and number of operations
    can be applied.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_199_0.png)


    +   (iv) STL provides three types of sequence containers: (1) vector (2) list
    (3) deque as already explained.


    (B) Associative Containers:

    Associative Containers are designed to support direct access to elements using
    keys. They are not sequential.'
  - '[PAGE 200]


    There are four types of associative containers:


    +   1. set

    2. multiset

    3. map

    4. multimap


    All these containers store a data in a structure called tree, through that fast
    searching, deletion and insertion can be possible.


    Set and Multiset Containers can store a number of items and provide operations
    for manipulating them using the keys. If we want to search for a particular student
    name details, the name is the Key to Search Record. Set does not allow duplicate
    whereas multiset allow duplicate sets.


    # (C) Derived Containers


    The STL provides three derived containers namely stack, queue and priority queue.
    They are also known as container adapters.


    Stacks, queues and priority queues can be created from different sequence containers.
    The derived containers can not be used for Data Manipulation.


    Hence they support two member functions pop() and push() for implementing, deleting
    and inserting operations.


    # 14.4 Algorithms


    Algorithms are functions that can be used generally across a variety of containers
    for processing their contents.


    Each container provides functions for its basic operations.


    A standard algorithms provide more extended or complex actions.


    In this we can work with two different types of containers at the same time.


    STL has different algorithms, and these algorithms are template functions and
    can be applied to any type of container.


    STL algorithms are categorised as follows:


    +   1. Retrieve or non-mutating algorithms

    2. Mutating algorithms

    3. Sorting algorithms

    4. Set algorithms

    5. Relational algorithms


    # 1. Retrieve Non Mutating Algorithms:


    +   (a) find(): This method finds adjacent pair of objects that are equal.


    +   (b) count(): It method counts occurrence of a value in a sequence.


    +   (c) count_id(): It counts number of elements based on condition.


    +   (d) equal(): This method returns true if two ranges are the same.


    +   (e) find(): This method finds first occurence of a value in sequence.


    +   (f) find_end(): This method finds last occurrence of a value in sequence.'
  - '[PAGE 201]


    (g) for_each(): This method applies operation to each element.


    (h) mismatch(): -> This method finds first elements for which two sequences differ.


    (i) search() -> This method searches within a sequence.


    (j) search_n(): This method finds sequences of a specified number of similar elements.


    # 2. Mutating Algorithms:


    +   (a) copy() -> This method copies a sequence.


    +   (b) copy_backward() -> This method copies a sequence from the end.


    +   (c) fill() -> This method fills a sequence with a specified value.


    +   (d) fill_n() -> This method fills first n elements with a specified value.


    +   (e) generate() -> It replaces all elements with the result of an operation.


    +   (f) iter_swap() -> This method swaps elements by iterators.


    +   (g) remove() -> This method deletes elements of a specified value.


    +   (h) remove_copy() -> It copies a sequence after removing matching


    +   (i) replace() -> It replaces elements with a specified value.


    +   (j) reverse() -> It reverses the order of elements.


    +   (k) rotate() -> This method rotates elements.


    +   (l) swap() -> This method swaps two elements.


    +   (m) swap_range() -> It swaps two sequences.


    +   (n) transform() -> This method applies an operation to all elements.


    +   (o) unique() -> Deletes adjacent elements.


    +   (p) unique_copy() -> This method copies after removing equal adjacent elements.


    # 3. Sorting algorithms:


    +   (a) binary_search() -> This method conducts binary search on an ordered sequence.


    +   (b) merge() -> It merges two sorted sequences.


    +   (c) sort() -> It sorts a sequence.


    +   (d) sort_heap() -> It sorts a heap.


    +   (e) partial_sort() -> Sort parts of a sequence.


    +   (f) pop_heap() -> It deletes the top element.


    +   (g) push_heap() -> It adds an element to heap.


    +   (h) upper_bound() -> It finds the last occurrence of a specified value.


    # 4. Set Algorithms:


    +   (a) include() -> It finds whether a sequence is a subsequence of another.


    +   (b) set_difference() -> It constructs a sequence that is difference of two
    ordered sets.


    +   (c) set_union() -> It produces union of two ordered sets.


    # 5. Relational Algorithms:


    +   (a) equal() -> It finds whether two sequences are the same.


    +   (b) max() -> Gives maximum of two values.


    +   (c) max_element() -> Finds the maximum element within a sequence.


    +   (d) min() -> Gives minimum of two values.


    +   (e) min_elements() -> Finds the minimum element within a sequence.'
