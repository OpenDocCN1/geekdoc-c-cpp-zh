  mdcn: "\n\n## 14.5 迭代器 (Iterators)\n\n迭代器类似于指针，用于访问容器的元素。这些指针在访问容器元素时可以在不同元素之间移动或遍历。\n\
    \n从一个元素移动到另一个元素被称为遍历容器。\n\n在遍历时，迭代器可以仅向向移动，也可以向后移动。\n\n迭代器及其特性：\n\n| 迭代器 | 访问方法\
    \ | 移动方向 | I/O 能力 | 备注 |\n| --- | --- | --- | --- | --- |\n| 1. 输入 (Input) | 线性\
    \ | 仅限向前 | 只读 | 不可保存 |\n| 2. 输出 (Output) | 线性 | 仅限向前 | 只写 | 不可保存 |\n| 3. 前向 (Forward)\
    \ | 线性 | 仅限向前 | 读/写 | 可以保存 |\n| 4. 双向 (Bidirectional) | 线性 | 前向 & 后向 | 读/写 | 可以保存\
    \ |\n| 5. 随机访问 (Random) | 随机 | 前向 & 后向 | 读/写 | 可以保存 |\n\n只有序列关联容器可以使用迭代器遍历。\n\
    每种迭代器用于执行特定的功能。\n\n![](img/3ca37d43fd74bff81a4127f37a84753d_202_0.png)\n\n迭代器的功能维恩图。\n\
    \n输入和输出迭代器支持最小的功能。它们仅用于遍历容器。前向迭代器支持输入和输出迭代器的所有操作，并保留在容器中的位置。双向迭代器支持容器中的向前和向后移动。\n\
    \n随机访问迭代器结合了双向迭代器的功能，并具有跳转到任意或特定位置的能力。\n\n## 14.6 容器类的应用\n\n容器类的应用名称：\n\n- 1.\
    \ vector\n- 2. list\n- 3. map\n\n1. vector → vector 是最广泛使用的容器。它在连续的内存位置存储元素，并允许使用下标运算符\
    \ `[]` 直接访问任何元素。\n\nvector 可以动态地改变大小，并在运行时需要分配内存位置。`class vector` 支持多个构造函数来创建\
    \ vector 对象。\n\n在 vector 类中支持以下成员函数：\n\n- 1. begin\n- 2. clear\n- 3. capacity\n\
    - 4. size\n- 5. swap\n- 6. Resize\n- 7. end\n- 8. erase\n- 9. empty\n- 10. back\n\
    - 11. insert\n\n2. List → list 是另一种容器。它支持双向线性列表，并为删除和插入操作提供了高效的实现。\n\n它不支持随机访问。\n\
    \nlist 只能按顺序访问。list 支持输入、输出、向前和双向迭代器，其操作方式如下：\n\n常用的函数有：\n\n- 1. back\n- 2. begin\n\
    - 3. clear\n- 4. empty\n- 5. end\n- 6. erase\n- 7. insert\n- 8. merge\n- 9. remove\n\
    - 10. resize\n- 11. size\n- 12. Sort\n- 13. swap\n- 14. unique\n- 15. pop-back\n\
    - 16. pop-front\n- 17. push-back\n- 18. push-front\n\n3. Maps → map 是一个序列（键, 值）对，每个唯一的键与一个值相关联。\n\
    \n值的检索基于键且速度非常快。\n\n它通常被称为关联运算符 `[]`。\n\n键使用下标运算符 `[]` 指定。\n\n![](img/3ca37d43fd74bff81a4127f37a84753d_203_0.png)\n\
    \n使用的常用函数有：\n\n- 1. begin\n- 2. clear\n- 3. empty\n- 4. end\n- 5. erase\n- 6.\
    \ find\n- 7. insert\n- 8. size\n- 9. swap\n\n## 自我练习题库\n\n- 1. 详细解释 STL 库。\n-\
