    # 3.3 Function Overloading


    The overloading refers have the same function for performing variety of different
    tasks. This is also known as function polymorphism in OOP''s.


    The function overloading is a logical method of calling several functions with
    different arguments and data type that perform basically the same function.


    During overloading compiler checks these following things.


    +   1. It checks exact match of function name when it is invoked in a function
    call.

    2. After name match it will check total number of arguments.

    3. After total number of arguments match it will check data types of arguments.

    4. It all 3 points matches then function definition will be executed.


    # Advantages of function overloading:


    +   1. It eliminates the use of different function for the same operation.

    2. It helps to understand debug and grasp easily.

