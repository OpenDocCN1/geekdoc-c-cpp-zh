    \ Structures of c Language\n\nOne of the key feature of C language is structures.\
    \ They are collection of different data types. They provide a method of encapsulating\
    \ different types of data in one unit. A structure is a very convenient tool for\
    \ handling a group of logically related data items. Structure is a user defined\
    \ data types with a template to define its data properties. One structure type\
    \ is defined then we can create variables of that type using declarations that\
    \ are similar to the built-in type declarations.\n\nExample:\n\n```\nStruct employee\n\
    {\n  int empno;\n  char name[10];\n```\n\n# Classes and Objects\n\n```\nfloat\
    \ salary;\n};\nstruct employee e;\n\ne is instance variable of type member variables\
    \ are defined by the template. Member variables can be accessed using the dot\
    \ or period operator.\n\nExample:\n\n```\ne.empno=10\ne.name=\"Kiran\"\ne.salary=16000\n\
    ```\n\nLimitations of Structures:\n\n- 1. By default members of structures are\
    \ public hence they do not permit data hiding.\n2. Structure does not support\
    \ inheritance.\n3. Member functions can be encapsulated in a structure.\n4. In\
    \ structures, the instance of the structures can not be added or subtracted.\n\
    5. To overcome limitations of the structure class is invented in C++.\n6. Structure\
    \ data is not treated as built-in data type.\n\n# 4.2 Structures and Classes\n\
    \n| Structure in C | Class in C++ |\n|---|---|\n| 1. Structure is a encapsulated\
    \ unit of different data type variables. | 1. Class is a encapsulated unit of\
    \ different type variables (data members) and member functions. |\n| 2. Structures\
    \ by default value types. | 2. Classes by default reference types. |\n| 3. Structure\
    \ does not support inheritance. | 3. Classes supports inheritance. |\n| 4. In\
    \ structure we cannot declare default or parametrised constructor. | 4. In class\
    \ we can declare default and parametrised constructor. |\n| 5. Structures are\
