    \n**重复（循环）**：当某些内容需要通过“循环”重复特定次数时，就会使用重复结构。循环是一个简单的语句，它重复执行或循环，直到达到某个值，然后移动到下一条可执行语句。例如，如果你要求用户输入值以计算数字的平均值，你可以使用循环，让用户继续输入数字，直到输入了数字为止。\n\
