    # 7

    Chapter Manipulators


    # Chapter Outline


    +   7.1 C++ streams

    7.2 C++ Stream Classes

    7.3 Unformatted I/O Operations

    7.4 Formatted Console I/O Operations

    7.5 Managing O/P with Manipulators


    # 7.1 C++ Streams


    Special functions are used as manipulator functions. For input and output processing
    cin and count functions along with get from operator and put to operator e.g.
    << and >> are used.

    The I/O system in C++ is designed to work with variety of devices including terminals,
    disks and tape drives.

    A stream is a sequence of bytes. It acts either as a source from which the input
    data can be obtained or as a destination to which the output data can be.

    The source stream that provides data to the program is called input stream and
    the destination stream that receives output from the program is called the output
    stream.

    A program extracts the bytes from an input stream and inserts bytes into output
    stream.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_111_0.png)'
  - '[PAGE 112]


    The data in the input stream can come from the keyboard or any other storage device
    and the output stream can go to the screen or any other storage device. A stream
    acts as a interface between the program and the input/output device, cin represents
    the input stream connected to the standard input device.


    cout represents the output stream connected to the standard output device.


    The default input device for cin is keyboard.


    The default output device for cout is screen.


    We can Redirect streams to other devices or files also.


    # 7.2 C++ Stream Classes


    The C++ I/O system contains hierarchy of classes that are used to define various
    streams to deal with both the console and disk files. Stream classes are used
    for input and output operations. These classes are declared in the header file
    iostream.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_112_0.png)


    ios is the base class for istream(input stream) and ostream(output stream), in
    turn base classes for iostream(input-output stream).


    ios is declared as virtual base class so that only one copy of its members are
    inherited by the iostream.


    # 7.3 Unformatted I/O Operations


    iostream provides facilities for formatted and unformatted I/O operations.


    Whileostream provides facilities for output stream and output functions.


    >>and<< input and output operators.


    >>operator is overloaded in the istream class.


    >> is overloaded operator in ostream class.


    Example:


    ```

    cin>>variable>>variable2

    int a;

    cin>>;

