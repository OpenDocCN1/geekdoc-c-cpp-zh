    # Preface


    It gives immense pleasure to present this First Edition of “OOPs with C++ Programming”
    to the teachers and students of Bachelor of Computer Science and Information Technology.
    This book has been written as per the syllabus prescribed by Indian Universities.
    The first language was called C, which was derived from C compiler. In 1983, the
    name of the language changed from C to C++. The ++ operator in C language is an
    operator for incrementing a variable, which gives some insight into how C++ was
    introduced, immediately followed by C. The chapters in this book mainly focus
    on new features added around this time, the most notable of which are OOPS concepts,
    constructor, destructor, virtual functions, and function overloading, file handling,
    references with the const keyword, and single-line comments.


    I have tried my best to give everything in this book in proper manner. Still a
    few points from the book may be explained better presently. Constructive suggestions
    and comments from the users will be sincerely appreciated. I would appreciate
    hearing from you about any textual errors or omissions you identify. If you would
    like to suggest improvements or contribute in any way, I would be glad to hear
    from you. Please send correspondence to kiranrtkt@gmail.com


    Last but not least, I would like to give lifetime thanks to Mr. S.K. Srivastava,
    Himalaya Publishing House Pvt. Ltd. for providing an environment which stimulates
    new thinking and innovations and his support, guidance, cooperation and encouragement
    to write this book. I am very grateful for his support and thank him for his true
    blessings. Kiran Gurbani kiranrtkt@gmail.com Mob.: 776997964


