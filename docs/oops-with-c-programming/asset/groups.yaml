    \ `calculate` 成员函数计算阶乘，通过 `display` 函数显示。\n\n```cpp\nclass factorial\n{\n    private:\n\
    \        int n, fact;\n    public:\n        void getdata(int x)\n        {\n \
    \           n=x;\n        }\n        void calculate();\n        void display()\n\
    \        {\n            cout<<\"The factorial of\"<<n<<\"is\"<<fact;\n       \
    \ }\n};\n```\n\n```cpp\nvoid factorial :: calculate()\n{\n    fact = 1;\n    for\
    \ (int i = 1; i <= n; i++)\n    {\n        fact = fact * i;\n    }\n}\n```\n\n\
    ```cpp\nvoid main()\n{\n    factorial f;\n    f.getdata(5);\n    f.calculate();\n\
