    # 11 文件处理章节


    ## 章节目录


    - 11.1 文件处理简介

    - 11.2 文件流操作的类

    - 11.3 打开与关闭文件

    - 11.4 检测文件结束 (EOF)

    - 11.5 关于 Open() 的更多：文件模式

    - 11.6 文件指针及其操作

    - 11.7 顺序输入和输出操作

    - 11.8 读取和写入类对象

    - 11.9 更新文件

    - 11.10 文件操作过程中的错误处理

    - 11.11 命令行参数


    ## 11.1 文件处理简介


    文件是存储在磁盘特定区域的相关数据集合。可以设计程序通过文件处理程序对这些文件执行读（Read）和写（Write）操作。我们可以在控制台与文件之间、以及文件与监视器之间传输数据。


    C++ 文件操作中的 `istream` 方式与控制台 I/O 操作类似。它使用文件流作为程序与文件之间的接口。向程序提供数据的流称为输入流（input stream）。接收数据的流被称为输出流（output
    stream）。I/O 流文件由 `istream` 方法和 `ofstream` 方法组成。


    同样，`fstream` 包含 `ifstream` 和 `ofstream`，它还支持一个用于存储数据的缓冲区类。所有这些文件流类都派自 `fstream`
    基类。


    输入流

    数据输入

    磁盘文件

    程序

    数据输出

    写数据


    # 文件输入和输出流


    I/O 系统使用文件流作为程序与文件之间的接口。向程序提供数据的流称为输入流，从程序接收数据的流称为输出流。


    输入流 OR 从文件中读取数据，而输出流则用于向文件中插入或写入数据。


    输入操作用于创建输入流，此输入数据链接到程序；而输出操作涉及建立输出流。它将数据从程序输出到输出流，并将这些数据写入磁盘文件。


    ## 11.2 文件流操作的类


    C++ 的 I/O 系统包含一组定义了文件处理方法的类。


    这些类包括 `ifstream`、`ofstream` 和 `fstream`。


    这些类派自 `fstreambase` 以及相应的 `ios` 类。


    这些类设计用于管理磁盘文件，在在fstream` 中声明，因此我们在任何使用文件的程序中包含此文件。


    ![](img/3ca37d43fd74bff81a4127f37a84753d_161_0.png)


    文件操作的流类


    # 文件处理


    `ios` 是一个由 `istream` 和 `ostream` 类组成的类，`istream` 是输入流类而`ostream` 是输出流，`fstream`
    基类包含用于创建输入流和输出流的 `istream` 和 `ofstream`。


    `iostream` 类包含输入流 (Istream) 和输出流 (ostream)。


    `Stringbuf` 包含 `filebuf` 类。


    `fstream` 包含 `istream` 和 `ofstream`，`fstream` 函数意味着仅用于读取打开。`ofstream` 函数意味着仅用于写入打开。


    ## 11.3 打开与关闭文件


    如果我们想使用一个文件，需要考虑以下几点：


    1. 给文件指定一个合适的名字。

    2. 提供正确的数据类型。文件的结构取决于文件的内容。

    3. 通过指定文件的模式（读目的或写目的）来指定文件的用途。

    4. 打开方法是顺序的还是随机的。


    打开文件时使用 `fstream`：


    1. `filebuf` ⇒ 它的目的是将文件缓冲区设置为读和写。

    2. `fstreambase` ⇒ 作为 `fstream`、`istream` 和 `ofstream` 类的基类。包含 `open()` 和 `close()`
    函数。

    3. `istream` ⇒ 提供带有默认输入模式的打开操作。它继承了 `istream` 中的 `get()`、`getline()`、`read()`、`seekg()`
    和 `tell()` 函数。

    4. `ofstream` ⇒ 提供输出操作。包含带有默认输出模式的 `open()`。它继承了 `ofstream` 中的 `put()`、`seek()`、`tell()`
    和 `write()` 函数。

    5. `fstream` ⇒ 它包含带有默认输入模式的 `open()` 方法。它通过 `istream` 继承了 `istream` 和 `ofstream`
    类的所有函数。


    为了打开文件，我们必须首先创建一个文件流，然后将其链接到文件名。可以使用 `fstream.h` 头文件中包含 `istream`、`ofstream` 和
    `fstream` 类来定义文件流。


    文件可以通过两种方式打开：


    1. 使用类的构造函数。

    2. 使用类的成员函数 `open()`。


    # 使用类的构造函数：


    当流中只使用一个文件时使用此方法，因为我们知道构造函数用于在对象创建时初始化对象。这里使用文件名来初始化文件流对象。


    这涉及以下步骤：


    (a) 使用适当的流类创建文件流对象。

    (b) 使用 `ofstream` 创建输出流，`fstream` 创建输入流。


    # 例如：


    `ofstream infile("abc.txt");`


    `ofstream` 是一个类，`outfile` 是对象参数中 `ofstream` 类的的一个对象。我们正在指定文件名，这意味着我们正在调用 `ofstream`
    的带参数构造函数。因此，如果我们想向其中写入任何内容，可以通过 `outfile` 对象写入。


    # 示例：


    ```cpp

    outfile << "Total";

    ofile << sum;

    ```


    # 输出：


    total 45

    如果变量 `sum` 的值是为了创建输入文件流。

    `ifstream infile("abc.txt");`


    # 示例：


    ```cpp

    outfile << sum;

    ```


    当流中只使用一个文件时使用此方法，因为我们知道构造函数用于在对象创建时初始化对象。这里使用文件名来初始化文件流。


    这涉及以下步骤：


    (a) 使用相应的流类创建文件流对象。

    (b) 使用 `ofstream` 创建输出流，`fstream` 创建输入流。


    # 2. 使用类的成员函数 `open()`。


    当我们在流中使用多个文件时使用此方法。


    ```cpp

    ofstream outfile;

    outfile.open("data1.txt");

    ```


    # 例如：


    ```cpp

    ifstream inf;

    inf.open("data1.txt",mode);

    ```


    # 示例：


    ```cpp

    inf.open("data1.txt", ios::in);

    ```


    这表示 `data1.txt` 以读模式打开，`ifstream` 函数用于读取。


    # 示例：


    ```cpp

    ofstream out;

    out.open("data1.txt", ios::out);

    ```


    这表示 `data1.txt` 以写模式打开，因此 `ofstream` 函数用于写入。

    因此 `ofstream` 被用于写入。


    注意：文件以写模式打开，意味着通过 `ofstream` 对象创建一个新文件。如果不存在同名文件。


    ## 11.4 检测文件结束 (EOF)


    `eof()` 成员函数用于指示文件结束。在文件的最后行之后，文件中可用字符。


    如果我们想读取文件内容。


    `eof()` 是 `ios` 类的成员函数。当遇到文件结束 (Eof) 条件时它返回非零值，否则返回零。


    ```cpp

    ifstream("data1.txt");

    while(fin)

    ```


    因此 `while` 语句在到达文件末时终止。


    ## 11.5 关于 Open() 的更多：文件模式


    `ifstream` 和 `ofstream` 构造函数以及 `open()` 函数用于创建新文件以及打开现有文件。


    因此指定模式时 `open()` 方法有两个参数。


    - 第一个参数用于指定文件名。

    - 第二个参数用于指定文件的模式。


    该模式标识了打开文件的目的。


    ```cpp

    ifstream inf;

    inf.open("data1.txt",mode);

    ```


    # 示例：


    ```cpp

    inf.open("data1.txt", ios::in);

    ```


    这表示 `data1.txt` 以读模式打开，`ifstream` 函数用于读取。


    # 示例：


    ```cpp

    ofstream out;

    out.open("data1.txt", ios::out);

    ```


    这表示 `data1.txt` 以写模式打开，因此 `ofstream` 函数用于写入。

    因此 `ofstream` 被用于写入。


    文件模式参数：


    | 参数 | 含义 |

    | --- | --- |

    | 1. ios::app | 附加到文件末尾。 |

    | 2. ios::ate | 打开时跳转到文件末尾 |

    | 3. ios::binary | 二进制文件。 |

    | 4. ios::in | 仅用于读取打开文件。 |

    | 5. ios::ncreate | 如果文件不存在则打开失败。 |


