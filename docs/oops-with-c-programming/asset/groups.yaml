- md: "\n# Control Structures and Loops\n## Chapter\n\n## Chapter Outline\n\n- 2.1\
    \ Introduction to Control Structures\n- 2.2 Types of Control Structures\n- 2.3\
    \ Selection Statements\n- 2.4 Repetition (Loops)\n- 2.5 GOTO Statement\n- 2.6\
    \ Break Statement\n- 2.7 Continue Statement\n\n## 2.1 Introduction to Control\
    \ Structures\n\nControlling the flow of a program is a very important aspect of\
    \ programming. There may be many different ways to find the solution to a particular\
    \ problem, but you will want to look for the best and fastest way.\n\nThe control\
    \ structures contain one logical statement, which is usually a block of statements\
    \ enclosed in curly braces {}.\n\nIndenting control structures is essential to\
    \ making readable programs. There are several styles. The style I use is the common\
    \ industrial or K&R style. The opening curly brace is on the end of the beginning\
    \ statement. The idea is to avoid creating too much white space separating the\
    \ parts of the statement. Indentation is usually best with 4 spaces, also 3 and\
    \ 2 are also used.\n\n**True/false** values are used in the **if** and loop statements.\
    \ These are either the Boolean values **true** and **false**, or any non-zero\
    \ value for true and zero for false (as in C).\n\nC++ has four types of control\
    \ structures: sequential, selection (decision), repetition (loops), and subprograms\
    \ (functions). These structures simply control the execution of a program.\n\n\
    ## 2.2 Types of Control Structures\n\nC++ has four types of control structures:\n\
    \n1. Sequential.\n2. Selection (decision).\n3. Repetition (loops).\n4. Subprograms\
    \ (functions).\n\n**Sequential**: Sequential means the program moves from one\
    \ statement to the next, that statement moves to the next, and so on. It is the\
    \ simplest form of structures, and it is not likely to use sequential structuring\
    \ when developing complex programs.\n\n**Selection (decision):** Selection structures\
    \ make decisions and perform commands according to the decision making. Selection\
    \ structures involve \"if statements\" which are like \"if this, then that\" and\
    \ \"if not, then that\". With \"if statements\", we can also include \"nested\
    \ statements\". Another form of selection structures is called a \"switch statement\"\
    , which is very useful for others. \"Switch statements\" focuses on the value\
    \ of a particular variable and performs different \"cases\".\n\n**Repetition (Loops):**\
    \ Repetition structures are used when something needs to be repeated a certain\
    \ number of times through the use of \"loops\". A loop is a simple statement that\
    \ repeats the execution or cycles until a certain value is reached and then moves\
    \ to the next executable statement. For instance, if you were to ask the user\
    \ to enter values to find the average of the numbers, you could use a loop that\
    \ continues letting the user enter numbers until numbers had been entered.\n\n\
    **Subprograms (functions):** A function is a subgroup that performs a specific\
    \ task and returns a value to the statement that called or invoked it. Functions\
    \ make programming very powerful once you develop a function to handle a particular\
    \ situation, you can use that function for other programs. A function can call\
    \ another function, which may call another function, and so on. It is a great\
    \ way to organize your program and break your program down into logical steps.\n\
    \nAfter a brief intro to the different types of control structures, it's time\
    \ to move on and find how you use each type. We will skip over sequential structures\
    \ since they are pretty much self-explanatory and move to selection statements.\
    \ Read for more about selection structures and \"if statements\".\n\n## 2.3 Selection\
    \ Statements\n\n**Selection Statements:** When dealing with selection statements,\
    \ there are generally three versions: one-way, two-way, and multi-way. One-way\
    \ decisions do some particular thing or they do not. Two-way decisions do one\
    \ thing or do nothing. Multi-way decisions can do many different things depending\
    \ on the value of an expression.\n\n**One-Way Decisions:** One-way decisions are\
    \ handled with an \"if statement\" and either do some particular thing or do nothing\
    \ at all. The decision is based on a logical expression which either evaluates\
    \ to true or false. If the logical expression is evaluated to true, then the corresponding\
    \ statement is executed; if the logical expression evaluates to false, control\
    \ goes to the next executable statement. The form of a one-way decision is as\
    \ follows:\n\n```\nif (logical expression) stmtT;\n```\n\nThe stmtT can be a simple\
    \ or compound statement. Simple involves 1 statement. Compound involves 1 or more\
    \ statements enclosed with curly braces { }. A compound statement is called a\
    \ block statement.\n\n# Example 1: Simple statement\n\n```cppint c = 3;\n\nif\
    \ (c > 0)\n  cout << \"c\" << c << endl;\n```\n\n# Example 2: Compound statement\n\
    \n```cpp\nint c = 10;\n\nif (c > 5)\n{\n  b = 2 * b + c;\n  cout << c * c << b\
    \ << endl;\n}\n```\n\n**Two-Way Decisions:** Two-way decisions are handled with\
    \ “if / else statements” and either one particular thing or do another. Similar\
    \ to one-way decisions, the decision is based on a logical expression. If the\
    \ expression is true, stmtT will be executed; if the expression is false, stmtF\
    \ will be executed. The form of a two-way decision is as follows:\n\n```cpp\n\
    if ( logical expression )\nstmtT;\nelse\nstmtF;\n```\n\nstmtT and stmtF can be\
    \ simple or compound statements. Remember that compound statements are always\
    \ enclosed with curly braces { }.\n\n**Multi-Way Decisions:** Multi-way decision\
    \ statements involve “if/else if\" statements, \"nested ifs\", or \"switch\" statements.\
    \ They are all used to evaluate a logical expression that could have several possible\
    \ values. The form of a multi-way decision using “if / else if” statements is\
    \ as follows:\n\n```cpp\nif ( logical expression )\nstmtT1;\nelse if ( logical\
    \ expression )\nstmtT2;\nelse if ( logical expression )\nstmtT3;\n```\n\n```cpp\n\
    else if ( logical expression )\nstmtTN;\nelse\nstmtF;\n```\n\nIf the first expression\
    \ is evaluated to true, then stmtT1 is executed. If the second expression is true,\
    \ then stmtT2 is executed and so on down the line. None of the logical expressions\
    \ are true, then the statement after “else” is executed which is stmtF.\n\nThe\
    \ form of a multi-way decision using “nested ifs” is as follows:\n\nIf conditionA\
    \ is evaluated to true, then execution moves into the nested if and evaluates\
    \ conditionB. If conditionA is evaluated to false, then stmtAF is executed.\n\n\
    # Example 1:\n\n```cpp\nint x;\nif ( x > 0)\n    cout << \"x is positive\" <<\
    \ endl;\nelse if ( x == 0)\n    cout << \"x is zero\" << endl;\nelse\n    cout\
    \ << \"x is negative\" << endl;\n```\n\n# Example 2:\n\n```cpp\nchar ch;\nif (\
    \ ch >=='A' && ch <==='Z' || ch >=='a' && ch <==='z')\n    cout << \"contains\
    \ a character\" << endl;\nelse if ( ch >=='0' && ch <==='9')\n    cout << \"contains\
    \ a digit\" << endl;\nelse if ( ch == ' ' || ch == '\\t' || ch == '\\n')\n   \
    \ cout << \"is white space\" << endl;\nelse\n    cout << \"ch is a misc. character\"\
    \ << endl;\n```\n\n**Switch Statements:** A switch statement is yet another option\
    \ for writing code that deals with multi-way decisions. I saved it for a section\
    \ by itself because some programmers feel using a switch statement is not good\
    \ programming style. With one semester of programming under my belt and a few\
    \ years of fooling around different programming languages, I haven't encountered\
    \ any problems with a switch statement. I haven't written too many programs using\
    \ switch statements, but when I have, the programs seemed to run smoothly. Maybe\
    \ I'll see why programmers don't like use switch statements in later programming\
    \ experiences. For now, let's explore the ins and outs of a switch statement.\n\
    \nThe following are the feature of a switch construct:\n\n1. Expression must be\
    \ integer expression.\n2. Each case is labelled by integer or character constant.\n\
    3. Cases and default may occur in any order.\n4. Cases must be all different.\n\
    5. After the code for one case is done, execution falls through to the next unless\
    \ you take explicit action to escape.\n6. The break statement causes an immediate\
    \ exit from the switch.\n7. Falling through cases is a mixed blessing.\n8. Positive\
    \ side is to have one code for multiple cases, redundancy avoided.\n9. Negative\
    \ side is to have one break after each case.\n\nSwitch statements offer an alternative\
    \ to an \"else if\" structure which has multiple possible paths based on the value\
    \ of a single expression. A revised form for a switch statement is as follows:\n\
    \n```cpp\nswitch (int expression)\n{\n  case label - 1:\n    stmt-list-1;\n  \
    \  break;\n  case label - 2:\n    stmt-list-2;\n    break;\n  case label - 3:\n\
    \    stmt-list-3;\n    break;\n  .\n  .\n  .\n  case label - n:\n    stmt-list-n;\n\
    \    break;\n}\n```\n"
  mdcn: "\n\n# 控制结构与循环\n## 章节\n\n## 章节目录\n\n- 2.1 控制结构引言\n- 2.2 控制结构的类型\n- 2.3 选择语句\n\
    - 2.4 重复（循环）\n- 2.5 GOTO 语句\n- 2.6 Break 语句\n- 2.7 Continue 语句\n\n## 2.1 控制结构引言\n\
    \n控制程序的执行流是编程中一个非常重要的方面。寻找解决某个特定问题的方法可能有许多种，但你将希望找到最好、最快的方法。\n\n控制结构包含一个逻辑语句，它通常是一个被包含在花括号\
    \ {} 内的语句块。\n\n对控制结构进行缩进对于编写可读的程序至关重要。有几种风格。我使用的风格是常见的工业风格或 K&R 风格。左大括号位于起始语句的末尾。这种设计的目的是避免在语句各个部分之间产生过多的空白。缩进通常使用\
    \ 4 个空格，有时也使用 3 个或 2 个空格。\n\n**真/假**值用于 **if** 和循环语句。这些值要么是布尔值 **true** 和 **false**，要么任何非零值表示真，零表示假（如\
    \ C 语言所示）。\n\nC++ 有四种控制结构：顺序结构、选择（决策）、重复结构（循环）和子程序（函数）。这些结构简单地控制着程序的执行。\n\n##\
