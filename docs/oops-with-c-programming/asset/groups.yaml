    # # 10.2 Virtual Function


    +   1. Virtual function is used to avoid the duplication of member function in
    base class and derived class.


    +   2. A virtual function is one that does not really exist but it appears real
    to some parts of the program.


    +   3. When we use same function name in both the base and derived class and at
    Runtime if we call same common function with the object of derived class then
    also by default base class function is called. To avoid this duplication of function
    in the base class, function is declared as virtual using the keyword virtual.


    +   4. A virtual function is a member function that is declared within the base
    class and it is redefined by the derived class.


    +   5. When base class contains virtual function then this function is inherited
    in derived class and it is redefined in derived class to fit its own needs.

    The virtual function is also called ''One Interface Multiple Methods.''


    +   6. Each Redefinition of virtual function by derived class implements a specific
    method. It is called Run-time polymorphism because during run-time the member
    function will be accessed through pointer.


    +   7. In the derived function when definition of virtual function is redefined
    then that virtual keyword is not used.


    +   8. When a function is made virtual, C++ determines which function is to be
    used at runtime based on the type of object pointed by the base pointer, rather
    than the type of the pointer. Thus by making the base pointer to point to different
    objects, we can execute different versions of the virtual function.'
