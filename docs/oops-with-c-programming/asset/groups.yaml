    \ } with statement. This catch block catches the exception thrown by throw statement\
    \ in try block and handles it appropriately. When the try block throws an exception\
    \ the program control leaves the try block and enters into the catch block if\
    \ the type of object thrown by the try block matches only the catch block the\
    \ catch block is executed for handling exception. If they do not match, the program\
    \ is aborted using abort function.\n\nExample:\n\n```cpp\nvoid main() {\nint a,b;\n\
    cout<<\"enter value of a & b\";\ncin>>a>>b;\nint x=a-b;\ntry {\nif(x!=0) {\ncout<<\"\
    Result of division is\"<<(a/x);\n} else {\nthrow(x);\n}\n} catch(int i) {\ncout<<\"\
