    \ 语句”的内容。\n\n## 2.3 选择语句\n\n**选择语句**：在处理选择语句时，通常有三个版本：单向、双向和多向。单向决策执行某些特定的操作，或者什么都不做。双向决策执行一件事或什么都不做。多向决策可以根据表达式的值执行许多不同的事情。\n\
