    # 14.5 Iterators


    Iterators are like pointers, they are used to access container elements. These
    pointer while accessing container elements can move or traverse from one element
    to another.


    Traversing form one element to another is known as Iterating through the container.


    While Iterating pointer can traverse forward only or may backward also.


    Iterator & their characteristics:


    | Iterator | Access method | Direction of movement | I/O Capability | Remark |

    | --- | --- | --- | --- | --- |

    | 1. Input | Linear | Forward only | Read only | Cannot be saved |

    | 2. Output | Linear | Forward only | Write only | Cannot be saved |

    | 3. Forward | Linear | Forward only | Read/Write | Can be saved |

    | 4. Bidirectional | Linear | Forward only | Read/Write | Can be saved |

    | 5. Random | Random | Forward & Backward | Read/Write | Can be saved |


    Only sequence associative containers are traversable with iterators.

    Each type of iterator is used for performing specific functions.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_202_0.png)


    Functionality Venn diagram of iterators.


    The input and output iterators support least functions. They are used only to
    traverse in a container. The forward iterator supports all operations of input
    and output iterators and retains the position in the container. A bidirectional
    iterator supports forward as well as backward direction in the container.


    A random access iterator combines the functionality of a bidirectional iterator
    with an ability to jump to an arbitrary or specific location.


    # 14.6 Applications of Container Classes


    Application of container class has name:


    +   1. vector

    2. list

    3. map


    1. vector → The vector is most widely use container. It stores elements in contiguous
    memory locations and enables direct access to any element using the subscript
    operator [ ].


    A vector can change the size dynamical and allocates memory locations as needed
    at Run time. class vector supports a number of constructor for creating vector
    objects.'
