  - "[PAGE 153]\n\n# 10\nVirtual Functions and Polymorphism\nChapter\n\n# Chapter\
    \ Outline\n\n+   - 10.1 Polymorphism\n- 10.2 Virtual Function\n- 10.3 Rules of\
    \ Virtual Functions\n- 10.4 Pure Virtual Function\n- 10.5 Abstract Classes\n-\
    \ 10.6 EARLY Binding\n- 10.7 LATE Binding\n\n# 10.1 Polymorphism\n\nCompile Time\
    \ and Run Time Polymorphism:\n\n+   1. Polymorphism is basic feature of OOPS.\
    \ It states that one thing behaves differently at different place.\n2. It also\
    \ states that one name multiplies forms i.e., one function name behaves differently\
    \ for different tasks.\nSame as one operator behaves differently at different\
    \ place.\n3. Polymorphism can be function overloading Or operator overloading.\n\
    4. Polymorphism is divided into two parts.\n  (a) Compile time polymorphism.\n\
    \  (b) Run time polymorphism.\n5. Compile time polymorphism: In function overloading\
    \ and operator overloading the compile time polymorphism is achieved. In function\
    \ overloading the function name is same with different number of parameters or\
    \ type of parameters it is overloaded. Overloaded member functions are selected\
    \ for invoking by matching arguments both type and the number."
- md: "\n## Virtual Functions and Polymorphism\n\nThis information is known to compile\
    \ time and hence compiler is able to select the appropriate function for a particular\
    \ call at compile time itself.\n\nThis is called compile time polymorphism. This\
    \ is also called early binding or static binding.\n\nEarly binding indicates that\
    \ an object is bound to its function call at compile time.\n\nAt the compile time\
    \ if prototype does not match then compile time error occurs.\n\nThe binding of\
    \ function and allocation of variables during compilation time is called compile\
    \ time polymorphism.\n\n- 6. Runtime polymorphism:\n(a) When object is created\
    \ at Run time and when Runtime object is bounded to allocate memory then it is\
    \ called Runtime polymorphism.\n(b) When base class and derived class have same\
    \ function with same prototype then function is not overloaded it is based at\
    \ Runtime which function is selected for base or derived.\n\n```cpp\nclass base\n\
    {\n    int x;\npublic:\n    void show()\n    {\n        __________\n        __________\n\
    \    }\n};\nclass d: public base\n{\n    int y;\npublic:\n    void show()\n  \
    \  {\n        __________\n        __________\n    }\n}\n```\n\nIn this example,\
    \ both base class and derived class have same show() member function with same\
    \ prototype.\n\nThis show function is still not overloaded. Because it based how\
    \ it is called at Run time with the help of object pointer by specifying member\
    \ function of base class or derived class.\n\nThis is called Run time polymorphism.\
    \ The binding performed at Runtime is called late binding also called dynamic\
    \ binding because the selection of a particular function is done dynamically at\
    \ Runtime.\n\nPolymorphism can be graphically represented as follows:\n\n![](img/3ca37d43fd74bff81a4127f37a84753d_155_0.png)\n\
    \n## 10.2 Virtual Function\n\n- 1. Virtual function is used to avoid the duplication\
    \ of member function in base class and derived class.\n- 2. A virtual function\
    \ is one that does not really exist but it appears real to some parts of the program.\n\
    - 3. When we use same function name in both the base and derived class and at\
    \ Runtime if we call same common function with the object of derived class then\
    \ also by default base class function is called. To avoid this duplication of\
    \ function in the base class, function is declared as virtual using the keyword\
    \ virtual.\n- 4. A virtual function is a member function that is declared within\
    \ the base class and it is redefined by the derived class.\n- 5. When base class\
    \ contains virtual function then this function is inherited in derived class and\
    \ it is redefined in derived class to fit its own needs.\nThe virtual function\
    \ is also called 'One Interface Multiple Methods.'\n- 6. Each Redefinition of\
    \ virtual function by derived class implements a specific method. It is called\
    \ Run-time polymorphism because during run-time the member function will be accessed\
    \ through pointer.\n- 7. In the derived function when definition of virtual function\
    \ is redefined then that virtual keyword is not used.\n- 8. When a function is\
    \ made virtual, C++ determines which function is to be used at runtime based on\
    \ the type of object pointed by the base pointer, rather than the type of the\
    \ pointer. Thus by making the base pointer to point to different objects, we can\
    \ execute different versions of the virtual function.\n\n## 10.3 Rules of Virtual\
    \ Functions\n\n- 1. The virtual function must be the member of class.\n- 2. They\
    \ can be accessed by using object pointer.\n- 3. In base class the virtual function\
    \ should be defined even though it is not used.\n- 4. The prototype of base class\
    \ version of virtual function and derived class version of virtual function should\
    \ be identical.\n- 5. They cannot be static members.\n- 6. A virtual function\
    \ can be friend of another class.\n- 7. While a base pointer can point to any\
    \ type of the derived object the reverse is not possible i.e., we can not use\
    \ a pointer to a derived class to access an object of the base type.\n\nExample\
    \ of Virtual Function:\n\n```cpp\nclass base\n{\npublic:\n    virtual void vfunction()\n\
    \    {\n        cout<< \"This is base class vfunction\";\n    }\n}\nclass d: public\
    \ base\n{\npublic:\n    void vfunction()\n    {\n        cout<< \"This is derived\
    \ 1 class vfunction\";\n    }\n}\nclass d1: public base\n{\npublic:\n    void\
    \ vfunction()\n    {\n        cout<< \"This is derived2 class vfunction\";\n \
    \   }\n}\nvoid main()\n{\n    base *p;\n    d obj1;\n    d1 obj2;\n    p = &obj1;\n\
    \    p->vfunction();\n    p = &obj2;\n    p->vfunction();\n}\n```\nOutput:\nThis\
    \ is base class vfunction\nThis is derived 1 class vfunction\nThis is derived2\
    \ class vfunction\n\n## 10.4 Pure Virtual Functions\n\n- 1. A class that contains\
    \ at least one pure virtual function for which is no definition is called abstract\
    \ class.\n- 2. In base class pure virtual function is declared as =0.\n- 3. We\
    \ cannot create object of abstract class.\n- 4. The abstract class is used for\
    \ achieve polymorphism.\n- 5. virtual function =0;\n- 6. **Example:**\n\n```cpp\n\
    #include <iostream.h>\nclass base\n{\npublic:\n    virtual void show() = 0;\n\
    };\nclass d: public base\n{\npublic:\n    void show()\n    {\n        cout<< \"\
    Derived 1\";\n    }\n};\nclass d2: public base\n{\npublic:\n    void show()\n\
