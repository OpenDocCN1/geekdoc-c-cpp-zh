    # 2.2 Types of Control Structures


    C++ has four types of control structures:


    +   1. Sequential.

    2. Selection (decision).

    3. Repetition (loops).

    4. Subprograms (functions).


    **Sequential**: Sequential means the program moves from one statement to the next,
    that statement moves to the next, and so on. It is the simplest form of structures,
    and it is not likely to use sequential structuring when developing complex programs.


    **Selection (decision):** Selection structures make decisions and perform commands
    according to the decision making. Selection structures involve "if statements"
    which are like "if this, then that" and "if not, then that". With "if statements",
    we can also include "nested statements". Another form of selection structures
    is called a "switch statement", which is very useful for others."Switch statements"
    focuses on the value of a particular variable and performs different "cases".


    **Repetition (Loops):** Repetition structures are used when something needs to
    be repeated a certain number of times through the use of "loops". A loop is a
    simple statement that repeats the execution or cycles until a certain value is
    reached and then moves to the next executable statement. For instance, if you
    were to ask the user to enter values to find the average of the numbers, you could
    use a loop that continues letting the user enter numbers until numbers had been
    entered.


    **Subprograms (functions):** A function is a subgroup that performs a specific
    task and returns a value to the statement that called or invoked it. Functions
    make programming very powerful once you develop a function to handle a particular
    situation, you can use that function for other programs. A function can call another
    function, which may call another function, and so on. It is a great way to organize
    your program and break your program down into logical steps.


    After a brief intro to the different types of control structures, it''s time to
    move on and find how you use each type. We will skip over sequential structures
    since they are pretty much self-explanatory and move to selection statements.
    Read for more about selection structures and "if statements".


    # 2.3 Selection Statements


    **Selection Statements:** When dealing with selection statements, there are generally
    three versions: one-way, two-way, and multi-way. One-way decisions do some particular
    thing or they do not. Two-way decisions do one thing or do nothing. Multi-way
    decisions can do many different things depending on the value of an expression.


    **One-Way Decisions:** One-way decisions are handled with an "if statement" and
    either do some particular thing or do nothing at all. The decision is based on
    a logical expression which either evaluates to true or false. If the logical expression
    is evaluated to true, then the corresponding statement is executed; if the logical
    expression evaluates to false, control goes to the next executable statement.
    The form of a one-way decision is as follows:


    ```

    if (logical expression) stmtT;

    ```'
