    \        cin>>a>>b>>c;\n        }\n        void calculate()\n        {\n     \
    \       if (a > b && a > c)\n            {\n                cout<<a<<\"is greater\"\
    ;\n            }\n            if (b > a && b > c)\n            {\n           \
