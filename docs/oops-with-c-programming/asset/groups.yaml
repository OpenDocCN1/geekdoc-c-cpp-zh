  mdcn: "\n\n# 类定义之外\n\n在类内部声明的成员函数，必须在类外部进行定义。类外的定义与普通成员函数相同。它只是类了类名，后面紧跟 `::`（作用域解析运算符）。\n\
    \n在成员函数之前使用的 `classname` 用于告知编译器该成员函数属于特定的类。\n\n# 语法如下\n\n```\nreturn-type class-name\
    \ :: functionname  (arguments list)\n{\n    function body\n}\n```\n\nreturn type（返回值）是成员函数的任何数据类型，如\
    \ `int`、`float`、`char`，表示函数返回指定数据类型的结果。\n\nclassname 是要定义成员函数的类名。\n\n:: 作用域解析运算符。\n\
    它写在函数头语句中。\n\nclassname 告诉编译器 `function-name` 属于指定的 `classname`。\n\n```cpp\nclass\
    \ item\n{\n    private:\n        int productid;\n        float price;\n      \
    \  void stock();\n    public:\n        float amount;\n        void getitem(int\
    \ pid, float p);\n        void calculate();\n        void display()\n        {\n\
    \            cout<<\"The amount is\"<<amount;\n        }\n};\n```\n\n```cpp\n\
    void item :: getitem(int pid, float p)\n{\n    productid=pid;\n    price=p;\n\
    }\n```\n\n```cpp\nvoid item :: calculate()\n{\n    amount=price*4;\n}\n```\n\n\
    成员函数具有以下特殊特性。\n\n- 1. 多个不同的类可以使用相同的函数名。带有 `::`（作用域解析运算符）的类名将解析它们的作用域。\n- 2. 成员函数可以访问类的私有数据。非成员函数无法访问类的私有数据，因为这些数据在类外部无法访问。\n\
    - 3. 成员函数可以直接调用另一个成员函数而无需使用点运算符。即一个函数可以使用另一个成员函数，因此称为成员函数的嵌套。\n\n## 类定义内部：\n\n\
    成员函数可以在类内部定义。因此，声明被函数定义所取代。\n\n```cpp\nclass item\n{\n    int pid;\n    float\
    \ price;\npublic:\n    void getdata(int a, float b)\n    {\n        pid=a;\n \
    \       price=b;\n    }\n    void putdata()\n    {\n        cout<<\"Theproduct\
    \ is\"<<pid;\n        cout<<\"The price is\"<<price;\n    }\n};\n```\n\n## 4.5\
    \ 带有类的 C++ 程序\n\n**示例 1：** 写一个程序创建一个 `student` 类，具有私有数据成员 `RollNo`、`name` 和对应学生的成绩\
    \ `marks`。\n\n声明 `getdata` 成员函数以接受用户输入的学生详情。\n\n提供 `putdata` 成员函数以显示学生的所有详情。\n\
    \n```cpp\n#include <iostream.h>\n#include <conio.h>\n```\n\n## 类与对象\n\n```cpp\n\
    class student\n{\n  private:\n    int rollno, marks;\n    char name [10];\n  public:\n\
    \    void getdata()\n    {\n      cout<<\"enter rollno & marks of the student\"\
    \ << endl;\n      cin>>rollno>>name>>marks;\n    }\n    void putdata()\n    {\n\
    \      cout<<\"The Rollno is\" << rollno <<endl;\n      cout<<\"The name is\"\
    \ << name <<endl;\n      cout<<\"The marks is\" <<marks;\n    }\n};\n\nvoid main()\n\
    {\n  student s;\n  s.getdata();\n  s.putdata();\n  getch();\n}\n```\n\n**示例 2：**\
    \ 在 C++ 中写一个程序创建一个 `Bank` 类，具有私有数据成员用于账户的 `Accno`、余额 `amt` 以及初始存款金额 `initial deposit\
    \ amount`。\n\n提供 `getdata` 成员函数以接受用户输入的账户和初始存款金额，并将此初始金额设置为余额。\n\n提供 `deposit`\
    \ 成员函数以存入金额并更新余额。提供 `withdraw`，需检查取款金额是否小于余额。如果是，则允许用户取款并更新余额；否则提供消息。提供 `display`\
    \ 成员函数显示账号和余额。\n\n```cpp\n#include <iostream.h>\n#include <conio.h>\n\nclass bank\n\
    {\n  private:\n    int accno, depositamt;\n    float balance;\n  public:\n   \
    \ void getdata()\n    {\n        cout<<\"enter account & initial deposit amount\"\
    \ << endl;\n        cin>>accno>>depositamt;\n        balance = depositamt;\n \
    \   }\n    void deposit()\n    {\n        int amount;\n        cout<<\"enter amount\
    \ to be deposited\" << endl;\n        cin>>amount;\n        balance = balance\
    \ + amount;\n    }\n    void withdraw()\n    {\n        int amount;\n        cout<<\"\
    enter amount to be withdrawn\" << endl;\n        cin>>amount;\n        if (amount\
    \ <= balance)\n        {\n            balance = balance - amount;\n        }\n\
    \        else\n        {\n            cout<<\"sorry! balance amount is not available\"\
    <<endl;\n        }\n    }\n    void display()\n    {\n        cout<<\"Accno is\"\
    <<accno<<endl;\n        cout<<\"Balance amount is\"<<balance;\n    }\n};\n\nvoid\
    \ main()\n{\n    bank obj;\n    obj.getdata();\n    obj.deposit();\n    obj.withdraw();\n\
    \    obj.display();\n    getch();\n}\n```\n\n**示例 3：** 在 C++ 中写一个程序，通过 `getdata`\
    \ 接受三个数，通过 `calculate` 成员函数打印最大值。\n\n```cpp\n#include <iostream.h>\n#include <conio.h>\n\
    class greatest\n{\n    private:\n        int a, b, c;\n    public:\n        void\
