    \ is a short hand version of if_else construct.\n\nThe format of the ternary operator\
    \ is `expression1?expression2:expression3`\n\nIf expression1 evaluated is true\
    \ then expression2 is evaluated otherwise expression3 is evaluated.\n\nExample,\n\
    \n- (1) if (i % 2 == 0)\n    even = true;\n  else\n    even = false;\n  even =\
    \ (i % 2 == 0) ? true : false;\n\n- (2) if (i > j)\n    max = i;\n  else\n   \
