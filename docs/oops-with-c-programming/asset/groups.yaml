  mdcn: "\n# 带有变量和运算符的 OOP 与 C++ 介绍\n\n(b) 三元运算符 (?)：C++ 了一个非常特殊的运算符，称为三元条件运算符。之所以被称为三元运算符是因为因为它三个表达式。它是\
    \ `if_else` 结构的简写形式。\n\n三元运算符的格式为 `expression1?expression2:expression3`\n\n如果\
    \ `expression1` 求值为真，则求值 `expression2`，否则求值 `expression3`。\n\n示例：\n\n- (1) if\
    \ (i % 2 == 0)\n    even = true;\n  else\n    even = false;\n  even = (i % 2 ==\
    \ 0) ? true : false;\n\n- (2) if (i > j)\n    max = i;\n  else\n    max = j;\n\
    \  max = (i > j) ? i : j;\n\n- (3) if (x > y)\n    x = x + 3;\n  else\n    x =\
    \ x - 3;\n  x = (x > y) ? x + 3 : x - 3;\n\n逗号运算符：C++ 以两种方式使用逗号运算符：\n\n- 1. 逗号第一次用法是变量声明中的分隔符：\n\
    \  `int a, b, c;`\n  `float x, y, z;`\n\n- 2. 逗号的第二次用法是循环中的分隔符：\n  `for (i = 1;\
    \ j = 2; i <= 10; i++, j+=3);`\n  {\n    cout << i << \" \" << j << endl;\n  }\n\
    \n(d) 作用域运算符 (::)：C++ 中的作用域运算符。\n\n作用域用于类成员函数的定义。C++ 有两个一元运算符 `new` 和 `delete`。动态内存的分配和释放通过\
    \ `malloc`、`alloc`、`calloc` 和 `free` 等库函数处理。\n\n(e) new 和 delete 运算符：`new` 运算符执行在运行时动态分配内存的任务。\n\
    `delete` 运算符用于释放内存或释放内存，即可以使用 `new` 和 `delete` 运算符提供内存管理。\n\n# 其他运算符：\n\n- 用于表达式分组的括号：\n\
    每个运算符的优先级和结合性决定了它是在表达式中的下一个运算符之前还是之后生效。\n当表达式的元素被放在括号周围时，该元素会在括号外的任何内容之前求值。\n\
    例如 `(a + b * c) * d`\n这里首先 `b` 与 `c` 相乘，结果加到 `a`，然后该结果乘以 `d`。\n\n- 成员运算符：\n这些是可用的\
    \ C++ 操纵符。\n操纵符用于格式化数据显示的运算符。常用的操纵符是 `endl` 和 `setw`。\n\n- 1. `endl` 运算符导致插入一行。\n\
    \  `int m=5, n=6;`\n  `cout << \"m\" << m << endl;`\n  `cout << \"n\" << n <<\
    \ endl;`\n  `m=5;`\n  `n=6;`\n\n- 2. `setw` 运算符指定字段宽度\n  `cout << setw(5) << sum\
    \ << endl;`\n如果 `sum = 45`，则输出为\n   45\nsetw 将为打印变量 `sum` 的值设置字段 5。\n\n# 1.13\
    \ 预处理器指令\n\n- 1. 预处理器根据程序中提供的指令修改 C++ 程序的程序。\n2. C++ 基本上运行 `#include` 和 `define`\
    \ 预处理器指令。\n3. 在源文件提交给编译器之前，会执行以下操作：\n(a) 通过 `#define` 语句将定义的标识符替换为文本段。\n(b) 包含其他文件，它们可能使用定义的文件或系统库文件。\n\
    例如 `#include \"sum.h\"`\n包含引号包裹的用户头文件。\n例如 `#include <stdio.h>` 它包含系统库的头文件，因此位于尖括号内）。\n\
    \n定义预处理器的通用规则：\n\n- 1. 所有预处理器指令都以井号 (#) 开头。\n2. 它们必须从第一列开始，井号和指令之间不需要空格。\n3. 预处理器指令不应以分号\
    \ (;) 结束。\n4. 一行中只能出现一个预处理器指令。\n5. 预处理器也被称为宏定义。\n\n`#define max` 是一个预处理器指令，它指示编译器将标识符\
    \ `max` 替换为字符串 `100`。\n因此在程序中，`max` 的每次出现都会自动替换为 `100`。\n示例：\n\n```\n#define true\
    \ 1\n#define false 0\n#define EoF -1\n#define product (x, y) ((x) * (y))\n#define\
    \ max (x, y) ((x) > (y)?(x):(y))\n#define begin {\n#define end {}\n#define mod\
    \ %\n#define program main\n```\n\n语法：\n`#define macro_name body of macro`\n`#define\
    \ Pi 3.1415`\n\n在这里我们将符号值 `Pi` 的值赋值为 `3.1415`。这种宏也被称为内联函数，其中宏名可以在一行中替换为宏主体。\n\
    宏的主体可以是任何常量或表达式。\n\n这些预处理器语句将在程序编译之前定义或声明。因此，预处理器会将程序文本中宏名的每次出现替换为宏主体的副本。\n\n\
    # 1.14 变量声明\n\n- 1. 变量声明：在 C 语言中，所有变量在执行语句中使用之前必须声明。在 C 语言中，所有变量必须先在局部声明部分声明（即在作用域开头）。但\
    \ C++ 允许在作用域的任何地方声明变量。\n"
