    # 9.2 Types of Inheritance


    1. Single Inheritance: A derived class with only one base class is called single
    inheritance. With this one derived class can be possible with one base class.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_134_0.png)


    2. Multilevel Inheritance: The mechanism of deriving a class from another derived
    class is known as Multilevel Inheritance.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_134_1.png)


    In multilevel first class is derived from base class and again from derived class
    another class will be derived.


    3. Multiple Inheritance: A derived class with several base classes, is called
    multiple inheritance.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_134_2.png)


    This type of inheritance can have one or more base classes from that we can drive
    only derived class is called as Multiple Inheritance.


    4. Hierarchical Inheritance: The properties of one class may be inherited by more
    than one class is called hierarchical Inheritance. In this type of inheritance
    one base class, number of classes can be derived is known as hierarchical Inheritance.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_134_3.png)'
