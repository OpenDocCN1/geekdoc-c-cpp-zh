    and while it has two arguments.


    In member function with unary operator it has no argument in operator function
    and while for it has one argument.


    +   9. Overloaded operator can be invoked by


    ```

    OP x OR OP

    ++x OR x++

    OR

    -x

    ```


    # Rules of Operator Overloading:


    +   1. Only existing operators can be overloaded.


    +   2. Basic meaning of operator new changes.


    +   3. +, -, ~ are unary operators.


    +   4. +, - can act as a binary operators.


    +   5. There are some operators which cannot be overloaded they have special meaning
    in C++ like ::, ., *, ? operators.


    +   6. The operators can be overloaded only with operator function which is either
    member function or friend function.


    # 8.2.1 Unary Operator Overloading


    +   1. Unary operator overloading requires one operand and one operand.


    +   2. When unary operator overloading can be performed with operator function
    as a member function, no argument is to be passed.


    +   3. While overloading unary operators with friend function, one argument is
    to be passed in the operator function.


    +   4. Let us consider if minus operator is used then one operand is used to overload
    that operated.


    +   5. Normally ''-'' is used to change the sign of a variable or a number. Here
    we are overloading ''-'' operator to negate the object in turn all data members
    of object will be negated. Hence ''-'' operator is overloaded.


    +   6. In member function no argument is passed hence object itself is used to
    invoke member function and it acts as a argument, it won''t return value.'
