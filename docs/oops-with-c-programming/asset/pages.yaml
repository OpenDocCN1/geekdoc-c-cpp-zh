  md: 'Introduction to OOPs and C++ with Variable and Operators


    # 6. Polymorphism:


    +   (a) Poly means many, morphism means many forms, i.e. more than one form of
    operation.

    (b) Polymorphism indicates the ability to take more than one form.

    (c) More than one form of operation may behave differently by creating different
    instance.

    (d) The behaviour of object depends upon the types of data used i.e. one thing
    behaves differently at different places.

    (e) Polymorphism allows objects having different internal structures to share
    the same external interface.

    (f) It supports function overloading and operator overloading. Function overloading
    indicates that functions of a class with same name but either different number
    of arguments or different types of arguments.


    You cannot overload a function which can have same number of arguments of same
    type and in sequence and differing only in their return types.

    For example,

    You behave differently when your friend asks about something and when your boss
    asks something.

    Example,

    Same name sum function can be used for addition of two integers, addition of two
    floats, addition of three integers;

    sum (int a, int b);

    sum (float x, float y);

    sum (int a, int b, int c);

    It is also called polymorphism.


    When a single function is used to perform different tasks of tasks is called function
    overloading. This is same like a particular word having several different meanings
    depending on the context.


    +   (g) In operator overloading we can overload the in-built operators as well
    as user-defined data types. You can not change the semantics of an operator.


    Existing operator like ''+'' can be used for addition of two integers and also
    be used for addition of two float or ''+'' sign be used for concentration of two
    strings. Overloading can not alter the basic template of operator.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_14_0.png)'
