  md: "# Control Structures and Loops\n\n**Switch Statements:** A switch statement\
    \ is yet another option for writing code that deals with multi-way decisions.\
    \ I saved it for a section by itself because some programmers feel using a switch\
    \ statement is not good programming style. With I semester of programming under\
