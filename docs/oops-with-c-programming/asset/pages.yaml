    # ## 6.1 Introduction


    We have used member functions such as getData() or input() to initialize the variables.
    When this function is invoked with the help of object, it assigns the initial
    values to the data items of object. These functions invoked when already objects
    are created. These functions cannot be used to initialize member variables at
    the time of creation of their objects hence perform initialization of members
    while creating object is performed by special member function in c++ called **constructor**.


    It is required to destroy the variable automatically by the compiler, when a variable
    of built-in type goes out of scope hence in C++ it is not possible.


    Hence special member function called the constructor enables an object to initialize
    itself when it is created. This is known as automatic initialization of objects.
    It also provides another member function called destructor that destroys the objects
    when they are no longer required.


    # ## 6.2 Constructors


    **Definition:** A constructor is a special member function that enables object
    to initialize itself when it is created. It is invoked automatically having same
    name as the name of the class.'
