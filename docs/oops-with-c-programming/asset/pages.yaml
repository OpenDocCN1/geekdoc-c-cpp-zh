    # 3.4 Inline Function


    Inline Functions are also called Macros Main Object of function is to save the
    memory space, when function is called.


    When function is called then function name, parameters type, Number of parameters
    is checked if all things matches then control is transferred to function and dynamic
    binding is provided. Then function definition is executed and answers is returned
    back to calling statement. To avoid these series of steps macros are used.


    Macros are the inline function which replaces the function definition statement
    with function call statement. Compiler just replaces this statement and execute
    the statement.


    While writing the inline functions we need prefix keyword "inline" to the function
    definition.

    If contains more than three lines then inline function is not advisable.


    Inline function does not contain any looping statement or conditional statement
    because it does not provide error-tracing, switch-case or goto statement does
    not exist. They can be recursive.


    # Advantage of using inline function:


    +   1. The size of code is reduced.

    2. It increases the execution speed.

    3. To avoid the control to be transferred back to the main function.


