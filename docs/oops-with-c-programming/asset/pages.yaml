  md: '# 7. Dynamic binding:


    (a) Dynamic binding is a binding at Run time.


    (b) Dynamic binding is also called as late binding.


    (c) Binding refers to the linking of procedure call or function call to the code
    or definition to be executed in runtime to the call.


    (d) The code associated with a given procedure call or function call is not known
    until the time of the call at run-time.


    (e) With the help of dynamic binding, one can access method of a derived class
    using a pointer of a base class depending on which it points to run-time.


    # 8. Message passing:


    +   (a) Object oriented consists of a set of objects that communicate with each
    other.


    +   (b) Message passing involves following steps:


    +   (i) Creating defence objects and their behaviour.


    +   (ii) Creating objects from class definitions.


    +   (iii) Establishing communication among objects.


    +   (c) Objects communicate with one another by sending and receiving information
    or by passing messages.


    +   (d) A message for an object is a request for execution of a procedure and
    therefore will invoke a function in the receiving object that generates the desired
    result.


    +   (e) Message passing involves specifying the name of the object, the name of
    the function i.e. and the message to be sent.


    +   (f) Customer is an object.


    Balance is a message


    Account no. is an object.


    | Customer. | Balance | (account no) |

    | --- | --- | --- |

    | ↓ | ↓ | ↓ |

    | Object | Message | information |


