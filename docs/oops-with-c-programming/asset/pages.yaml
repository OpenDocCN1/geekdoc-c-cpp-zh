    10. A friend function, although not a member function, has full access right to
    the private member of the class.


    # Special Characteristics of friend function:


    +   1. It is not in the scope of the class to which it has been declared as friend.


    +   2. A friend function is not the member function of the class but has full
    access rights to the private members of the class.


    +   3. While defining friend function no scope resolution is required.


    +   4. friend function can be declared either in the public or the private part
    of a class without affecting its meaning.


    +   5. Normally the member function of a class can access private data members
    without creating object but the friend function cannot access the private member
    directly but it can be accessed with object of the class.'
