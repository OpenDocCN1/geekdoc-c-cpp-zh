  md: 'The following task can be performed for exception.


    +   1. Find the problem (hit exception)

    2. Inform that an error has occurred (throw the exception)

    3. Receive the error information (catch the exception)

    4. Take corrective action (handle the exception)


    # 13.2 Exception Handling Mechanism With Try, Catch & Throw Statement


    An exception is an error or an unexpected event. The exception handler is a set
    of codes that executes when an exception occurs.


    Exception handling basically involves 3 blocks:

    (i) Try (ii) Throw, (iii) Catch.


    The try & catch blocks are written between open & closing braces ''{ }''. The
    try block is identified by try keyword having block of statements between [and].
    When the exception is detected by the try block, it is thrown using throw statement
    in try block.


    A catch block is defined by the keyword catch followed by { } with statement.
    This catch block catches the exception thrown by throw statement in try block
    and handles it appropriately. When the try block throws an exception the program
    control leaves the try block and enters into the catch block if the type of object
    thrown by the try block matches only the catch block the catch block is executed
    for handling exception. If they do not match, the program is aborted using abort
    function.


    Example:


    ```

    void main() {

    int a,b;

    cout<<"enter value of a & b";

    cin>>a>>b;

    int x=a-b;

    try {

    if(x!=0) {

    cout<<"Result of division is"<<(a/x);

    } else {

    throw(x);

    }

    } catch(int i) {

    cout<<"exception at x="<<x;

    }

    ```'
