  md: '# ## SOFTWARE EVOLUTION (EVOLUTION OF PROGRAMMING LANGUAGE)


    | In C language templates cannot be created. | In C++ language templates can be
    created. |

    | C language does not support exception handling. | C++ language supports exception
    handling. |

    | C language does not support the concept of virtual functions. | C++ supports
    the concept of virtual function with the help of abstraction and Inheritance.
    |


    ![](img/3ca37d43fd74bff81a4127f37a84753d_9_0.png)


    Software technology has a growth of a tree. Software evolution has a layer of
    growth. Each layer representing an improvement over the previous one.

    Initially the programs are to be written in machine language but it is in the
    form of 0''s and First hence difficult to remember.


    **Second** layer of assembly language which has Mnemonics in the form of English
    language. Language used by ALU section of the CPU.


    **Third** layer is procedure oriented language (POP) language. In this problem
    is viewed as a sequence of Instructions. All functions or tasks are combined in
    one procedure program.


    In the fourth layer the program is divided into functions. Instructions of the
    program is divided into groups known as functions.

    In multi function program, many important data elements are placed as global so
    that they may be accessed by all the functions. Each function may have its own
    local data. In the fifth layer, modularization is used with the help of functions
    and in large programs it is very difficult to identify what data is used by which
    function. Hence hiding concept can be provided using functions.


    In object oriented following characteristics are followed:


    +   - Large programs are divided into smaller programs known as functions called
    objects.

    - Data hiding concept is provided.'
