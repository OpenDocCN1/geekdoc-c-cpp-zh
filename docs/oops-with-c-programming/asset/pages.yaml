    # ## 9.1 Introduction to Inheritance


    Inheritance is a concept of reusability. It is also called derivation. Reusability
    is the important feature of OOP''s. Reusability is a technique where we can reuse
    the class which is already tested and debugged many times.


    This technique is used for creating new class from old class and reusing the properties
    of existing one.


    The mechanism of deriving new class from old class is known as inheritance. The
    old class is referred as base class and the new class is referred as derived class.
    The base class is also called as super class and the derived class is also called
    as sub-class. It is also known as parent-child relationship. The derived class
    can access properties and member functions of base class during any type of inheritance
    as well as derived class has its own properties and methods.'
