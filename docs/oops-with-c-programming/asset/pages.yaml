  md: '# 1.5 OBJECT ORIENTED PROGRAMMING PARADIGM


    Object oriented programming provides data hiding concept. It treats data as a
    critical element in the program development and does not allow it to flow freely
    around the system.


    It ties data more closely to the function that operate on it, and protect it from
    modification from outside functions.


    Object oriented programming allows decomposition of a problem into a number of
    entities called objects.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_10_0.png)


    # Organisation of data and functions in OOPs


    Some of the characteristics of object oriented programming:


    +   1. Object oriented approach provides modularizing by diving program into functions.

    2. Programs are divided into objects.

    3. Functions that operate on the data of an object are tied together in the data
    structure.

    4. Data is hidden and cannot be accessed by external functions.

    5. Objects may communicate with each other through functions.

    6. Data and functions can be combined together in one encapsulated unit class.

    7. New data and functions can be easily added whenever necessary.


    # Basic concepts of object-oriented programming:


    Some important concepts are needed to understand in OOPs:


    +   1. Objects

    2. Classes

    3. Data Abstraction

    4. Data Encapsulation

    5. Inheritance

    6. Polymorphism

    7. Dynamic binding

    9. Message passing'
