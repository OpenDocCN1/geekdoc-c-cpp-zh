  md: '# 10.6 Early Binding


    +   1. When an object is bound to its function call at compile time, it is called
    early binding.

    2. It refers to events that occur at compile time.

    3. When all information needed to call a function is known as ‘at compile time''.

    e.g. Normal function call, overloaded function call and overloaded operators.


    When function overloading is done, the overloaded functions are selected for invoking
    by matching the arguments and data type of argument.

    This information is known to the compiler at compile time and hence compiler is
    able to select the appropriate function for a particular call at the compile time.
    This is called early binding. OR binding or static linking also known as compile
    time polymorphism.


    # 10.7 Late Binding


    +   1. When the function is invoked at Runtime it is called Late Binding OR binding
    at Runtime.

    2. When there is function whose name and prototype are same in both base class
    and derived class and same function in base class is defined as virtual then which
    version of that function should be called by compiler. It can be possible at Runtime
    when it is known what class is pointed to by base object pointer, the appropriate
    version of the function will be called. This is called late binding.

    . It refers to function call that are not resolved until run-time.

    4. The virtual function are used to achieve late binding. When access is through
    a base pointer or reference to the virtual function actually called is determined
    by the type of object pointed by the pointer.

    5. The advantage of late binding is flexibility.

    6. Late binding require some overhead but provider increased power and flexibility.


