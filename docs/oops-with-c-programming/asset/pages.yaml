  md: '# Origin of C:


    Dennis M. Ritchie, a systems engineer at Bell Laboratories, New Jersey developed
    C in the early 1970''s.


    # 1.2 Compilers and Interpreters


    A program written in a high-level language must be translated into machine language
    before it can be executed. This is known as compilation or interpretation, depending
    on how it is carried out.


    Compilers translate the entire program into machine language before executing
    any of the instructions. Interpreters, on the other hand, proceed through a program
    by translating and executing instructions, or small groups of instructions.


    A compiler or interpreter is itself a program that accepts a high-level program
    (e.g. a C program) as input data, and generates a corresponding machine – language
    output. The original high-level program is called the source program, and the
    resulting machine-language program is called object object.


    Every high-level language must have its own compiler or interpreter for a particular
    platform. It is generally more convenient to develop a new program using an interpreter
    rather than a compiler. Once an error-free program has been developed, a compiled
    version will normally execute much faster than interpreted version.


    # Features of C language:


    C is a structured programming language, which means that it allows you to develop
    programs using well-defined control structures (you will learn control structures
    in the articles to come), and provides modularity (breaking the task into multiple
    sub tasks that are simple enough to understand and to reuse).


    C is often called a middle-level language because it combines the best elements
    of low-level or machine language with high-level languages.


    +   1. C is a case sensitive Language

    2. C is Mother of all Languages

    3. C is a structured programming Language

    4. C is a Middle Level Language

    5. C has inbuilt Library functions

    6. C allows us to create defined functions

    7. C has its own Compiler

    8. C is used for creating powerful System Programs.

    9. C is a flexible & Powerful language.

    10. C has 32 Keywords and Reserved Words

    11. C supports graphics.

    12. C supports different functions, structures, arrays with powerful data structures
    like stack, Linklist, Queue, Trees.


    C''s ability to communicate directly with hardware makes it a powerful choice
    for system programmers. In fact, popular operating systems such as Unix and Linux
