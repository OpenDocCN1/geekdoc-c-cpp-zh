  md: '# 4. Data Encapsulation:


    +   (a) The internal data of a class i.e. data members and member functions are
    first separated from outside world and then they are put in a unit is called encapsulated
    unit.


    +   (b) Encapsulation gathers all pieces of object into one packet.


    +   (c) Encapsulated data is not accessible outside the world. It can be accessed
    only by member functions which are defined within a class.


    +   (d) This insulation of the data from direct access by the program is class
    hiding or information hiding.


    +   (e) All the essential properties of the objects are encapsulated in a class.
    The attributes are called as data members to hold information. The functions that
    operate on these data are called methods or member functions.


    # 5. Inheritance:


    +   (a) Inheritance is the process of creating new classes, derived classes, from
    existing classes. These existing classes are often called base classes.


    +   (b) The derived class inherits all the properties and methods of the base
    class and can add new features, properties and methods of its own, based on requirement.
    By adding these refinements the base class remain unchanged.


    +   (c) Inheritance is the process by which objects of one class acquire the properties
    of objects of another class.


    +   (d) C++ allows a programmer to create hierarchical classification i.e. it
    supports parent-child derived class or sub class.


    +   (e) The parent class is a base class called super class and the child class
    is also called as derived class or sub class.


    +   (f) The concept of inheritance provides the idea of reusability. This means
    we can reuse existing many times and also add additional features to an existing
    class with modifying it. Reusability concept saves lot of money and time. Reusability
    code helps in case of distributing class libraries. Reusability increases from
    reliability.


    +   (g) Inheritance is similar to inheriting characteristics from our parents.


