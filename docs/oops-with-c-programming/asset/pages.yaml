    # 13.1 Introduction and Basics of Exception Handling


    Normally the program consist of errors and bugs. The most common type of bugs
    are:


    +   1. Logical error

    2. Syntactic error


    Logical error is due to wrong solution or wrong Logic and syntactic error occurs
    due to poor understanding of language, that means syntax mistake. We can detect
    these errors and then debug them and accordingly provide error description for
    those errors and are called as exceptions.


    Exceptions are run-time condition or error that a program may encounter while
    executing. Errors like division by 0 or access to an array outside of its bounds
    or running out of memory or running out of disk space.


    There are two types of exception handling:


    +   1. Synchronous

    2. Asynchronous


    A synchronous exceptions out of range index and overflow error can occur. In Asynchronous
    the events which are beyond the control like keyboard interrupts or bad sectors
    in the disc or hardware failure are called as asynchronous exceptions.'
