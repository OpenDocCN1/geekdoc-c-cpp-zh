  md: '# Introduction to OOPs and C++ with Variable and Operators


    BASIC are written in C. However, C''s scope is not just limited to developing
    system programs. It is also used to develop any kind of application, including
    complex business ones. The following is a partial list of areas where C language
    is used:


    +   * Embedded Systems

    * Systems Programming

    * Artificial Intelligence

    * Industrial Automation

    * Computer Graphics

    * Space Research

    * Image Processing

    * Game Programming


    C language can be used for creating system programs, but variable and functions
    are in scope, hence no data hiding concept can be provided. C does not support
    object oriented concepts like Data encapsulation, Polymorphism, Data Abstraction,
    Data Inheritance. To Provide We will switch to C++ language with powerful data
    hiding concepts.


    # 1.3 Difference Between C and C++


    | C | C++ |

    |---|---|

    | In language data hiding concept is not available. | In C++ language data hiding
    concept is possible by using class, object with public, private and protected
    specifier. |

    | C is a structured programming language. | C++ is a object oriented language.
    |

    | In C programming scanf() and printf() functions are used for Reading variable
    values and printing variable values, they are available in stdio.h header file.
    | In C++, cin and cout are available for reading and printing variable value,
    included in iostream.h header file. |

    | The C program files are identified by .extension. | The C++ program files are
    identified by .cpp extension. |

    | In language we can write structure which is collection of different types. |
    In C we can create class which is collection of different types i.e. members and
    functions encapsulated in one unit called. |

    | C does not support polymorphism concept, it won''t support operator and function
    overloading. | C++ supports polymorphism concept with the help of operator and
    function overloading. |

    | The C language does not support inheritance concept. | C++ support inheritance
    with super class and sub class. |

    | C does not support constructor, destructor concept hence does not have new and
    delete operator. | C++ supports constructor and destructor for creating object
    and destroying object with the help of new and delete operator. |

    | C language does not support default arguments. | C++ supports default arguments
    within parameters of functions. |

    | C language does not support friend function facility. | C++ language supports
    friend function facility. |'
