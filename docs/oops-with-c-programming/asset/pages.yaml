    # 7.1 C++ Streams


    Special functions are used as manipulator functions. For input and output processing
    cin and count functions along with get from operator and put to operator e.g.
    << and >> are used.

    The I/O system in C++ is designed to work with variety of devices including terminals,
    disks and tape drives.

    A stream is a sequence of bytes. It acts either as a source from which the input
    data can be obtained or as a destination to which the output data can be.

    The source stream that provides data to the program is called input stream and
    the destination stream that receives output from the program is called the output
    stream.

    A program extracts the bytes from an input stream and inserts bytes into output
    stream.


    ![](img/3ca37d43fd74bff81a4127f37a84753d_111_0.png)'
