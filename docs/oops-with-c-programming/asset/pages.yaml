    # ## 12.1 Introduction


    Template is a method for writing a single function or class for a family of similar
    functions or classes in a generic manner. When a single function is written for
    a family of similar functions, it is called as ''function template''.

    A template can be used to create a family of classes or functions.

    The templates can be for array class, creating arrays of various data types such
    as integer array, float array, character array or double array.


    # ## 12.2 Class Templates


    A template can be called as a macro, it is type of macro, which runs faster than
    normal functions.

    Since a template is defined with a parameter that would be replaced by a specified
    data type at the time of actual use of the class or function, the templates are
    sometimes called parameterised classes or functions.'
