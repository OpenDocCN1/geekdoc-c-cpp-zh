    # ## 11.1 Introduction to File Handling


    A file is a collection of related data stored in a particular area on the disc.
    The program can be designed to perform Read and Write operations on these files
    through file handling program. We can transfer the data between console and file
    and between the files and monitor.


    The istream of C++ file operations operate similarly to console I/O operations.
    It uses file streams to interface between program and file. The stream that supplies
    data to the program is called as input stream. The stream which receives data
    is known as output stream. The I/O stream file consists of istream methods and
    ofstream methods.


    Similarly fstream is of ifstream and ofstream it also supports one file buffer
    class to store data. All these file stream classes are derived from fstream base
    class.'
