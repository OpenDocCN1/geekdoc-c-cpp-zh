    \ haven't encountered any problems with a switch statement. I haven't written\
    \ too many programs using switch statements, but when I have, the programs seemed\
    \ to run smoothly. Maybe I'll see why programmers don't like to use switch statements\
    \ in later programming experiences. For now, let's explore the ins and outs of\
    \ a switch statement.\n\nThe following are the feature of a switch construct:\n\
    \n+   1. Expression must be integer expression.\n2. Each case is labelled by integer\
    \ or character constant.\n3. Cases and default may occur in any order.\n4. Cases\
    \ must be all different.\n5. After the code for one case is done, execution falls\
    \ through to the next unless you take explicit action to escape.\n6. The break\
    \ statement causes an immediate exit from the switch.\n7. Falling through cases\
    \ is a mixed blessing.\n8. Positive side is to have one code for multiple cases,\
    \ redundancy avoided.\n9. Negative side is to have one break after each case.\n\
    \nSwitch statements offer an alternative to an \"else if\" structure which has\
    \ multiple possible paths based on the value of a single expression. A revised\
    \ form for a switch statement is as follows:\n\n```\nswitch (int expression)\n\
    {\n  case label - 1:\n    stmt-list-1;\n    break;\n  case label - 2:\n    stmt-list-2;\n\
    \    break;\n  case label - 3:\n    stmt-list-3;\n    break;\n  .\n  .\n  .\n\
    \  case label - n:\n    stmt-list-n;\n    break;\n}\n```"
