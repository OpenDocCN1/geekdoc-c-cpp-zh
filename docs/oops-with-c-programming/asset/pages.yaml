  md: '# Objects:


    (a) Objects are the basic Run-time entities also called as Real World thing.

    (b) An object in C++ is a representation of some physical, logical or conceptual
    entity. For example, an object can be a vehicle, bank account, animal, place,
    a table of data, any item, or it represents a person etc.


    (c) Every object is identified by its own properties and methods which indicates
    behaviour, states and tags of object.


    (d) The object can take place in memory and associated in a memory like a structure
    in C or Record in pascal.


    (e) An object is an instance of user-defined data type class. We can also say
    that object is a variable type which is a user defined class.


    (f) When a program is executed, the objects interact by sending messages to one
    another.

    For example 1, if customer and account are two objects, customer object may send
    a message to the account object requesting for the bank balance.

    For example 2, if student and marks are two objects, student object may send a
    message to the marks object requesting for grade of student.


    | Customer Object | Account Object |

    |---|---|

    | Object : Customer | Object : Account |

    | Data:CustNo accNo | Data:AccNo Name Balance |

    | Functions: getcustdetails() getbalance() | Functions: display balance() withdraw()
    |


    | Object : student |

    |---|n| Data: Name Date of Birth Marks |

    | Functions: Total Average Display |


    # Classes:


    (a) Class is a predefined blank template and blueprint which can be reused number
    of times.

    (b) The entire set of data and code of an object is wrapped together in one capsule
    also called user-defined data type class.


    (c) Class encapsulates the Attributes and behaviour of an entity.

    (d) Class specifies what data and what functions will be included in objects of
    that class.

    (e) Classes are user-defined data types and behave like the build-in types of
    a programming language.'
