    Hence they support two member functions pop() and push() for implementing, deleting
    and inserting operations.


    # 14.4 Algorithms


    Algorithms are functions that can be used generally across a variety of containers
    for processing their contents.


    Each container provides functions for its basic operations.


    A standard algorithms provide more extended or complex actions.


    In this we can work with two different types of containers at the same time.


    STL has different algorithms, and these algorithms are template functions and
    can be applied to any type of container.


    STL algorithms are categorised as follows:


    +   1. Retrieve or non-mutating algorithms

    2. Mutating algorithms

    3. Sorting algorithms

    4. Set algorithms

    5. Relational algorithms


