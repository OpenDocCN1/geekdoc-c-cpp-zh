  trans: "\n\n# 1 LaTeX:\n\n```\n\\begin{align*}\nfactorial(n)=n!=\\prod_{i=1}^n i\n\
    \\end{align*}\n```\n\n图 128\n\n在这里，该表达式描述了数字 `n` 的阶乘，其计算方法为从 1 到 `n` 的所有正整数的积。阶乘函数在数学的多个分支中具有重要意义，包括组合数学和数论，它被用于计算排列、组合以及相关的数学运算。\n\
    \n***\n\n## 在数学和 C++ 中理解阶乘\n\n![](img/math_02.png)\n\n图 129\n\n在数学中，数字 `n` 的阶乘概念（通常表示为\
    \ `n!`）是基础性的。在此语境下，提到感叹号时，术语为 `factorial`（阶乘）。`n` 的阶乘等于直到 `n` 的所有正整数的乘积。这在数学上可以表示为乘积，用大写\
    \ Pi 符号 `\\Pi` 表示，乘法序列从 `1` 开始持续到 `n`。\n\n将这一数学概念翻译成 `C++` 等编程语言，我们可以创建一个函数来计算给定数字的阶乘。以下是该函数在\
    \ `C++` 中的一个说明性示例：\n\n```cpp\n// 1 // From Paper to Code\n// 2 // Factorial\n\
    // 3 // Run with: https://www.jdoodle.com/online-compiler-c++17/\n// 4 // LaTeX:\
    \ \\prod_{i=1}⁵ i\n// 5 // Test LaTeX: https://quicklatex.com/\n// 6 #include\
    \ <iostream>\n// 7 \n// 8 int factorial(int n) {\n// 9     int temp = 1;\n// 10\
    \     for (int i = 1; i <= n; ++i) {\n// 11         temp *= i;\n// 12     }\n\
    // 13     return temp;\n// 14 }\n// 15 \n// 16 int main() {\n// 17     std::cout\
    \ << \"Factorial of 5 is: \" << factorial(5) << std::endl;\n// 18     std::cout\
    \ << \"This is the same as: 1*2*3*4*5, which is: \" << 1*2*3*4*5 << std::endl;\n\
    // 19 }\n// 20 }\n```\n\n图 130\n\n***\n\n## 在数学中探索求和概念及其在 C++ 中的实现\n\n![](img/math_03.png)\n\
    \n图 131\n\n在示例中，我们遇到了一个带有显著 sigma 符号的数学表达式，该符号被各种符号围绕。这个符号代表数学中的 `summation`（求和）概念。该方程涉及常数\
    \ `e`，这是一种基础数学常数，以在微积分和复分析中的应用而闻名。\n\n`e` 的值可以通过方程所示的求和过程来近似。这涉及到累加 `n` 阶乘的倒数，从\
    \ `n = 0` 开始理论上持续到无穷大。\n\n该求和的 LaTeX 符号如下：\n\n```\n\\begin{align*}\ne = \\sum_{n=0}^{\\\
    infty} \\frac{1}{n!}\n\\end{align*}\n```\n\n图 132\n\n在实践中，计算到无穷大的求和是不可行的。因此，通过定义有限的迭代次数来采用近似方法，在这种情况下，次数被设置为\
    \ `100`。值得注意的是，在数学中除以零是未定义的，因此在计算中需要进行条件检查以避免此类情况发生。\n\n下面的 `C++` 代码段演示了如何使用求和方法近似\
    \ `e` 的值：\n\n```cpp\n// 1 // From Paper to Code\n// 2 // Factorial\n// 3 // Run\
    \ with: https://www.jdoodle.com/online-compiler-c++17/\n// 4 // LaTeX: e = \\\
    sum_{n=0}^{\\infty} \\frac{1}{n!}\n// 5 // Test LaTeX: https://quicklatex.com/\n\
    // 6 #include <iostream>\n// 7 \n// 8 int factorial(int n) {\n// 9     int temp\
    \ = 1;\n// 10     for (int i = 1; i <= n; ++i) {\n// 11         temp *= i;\n//\
    \ 12     }\n// 13     return temp;\n// 14 }\n// 15 \n// 16 double e() {\n// 17\
    \     double temp = 0.0;\n// 18     int temp2 = 0;\n// 19     for (int n = 0;\
    \ n < 100; ++n) { // Approximating infinity with 100 iterations.\n// 20      \
    \   temp2 = factorial(n);\n// 21         if (temp2 != 0) { // Ensuring division\
    \ by zero does not occur.\n// 22             temp += 1.0 / temp2;\n// 23     \
    \    }\n// 24     }\n// 25     return temp;\n// 26 }\n// 27 \n// 28 int main()\
    \ {\n// 29     std::cout << \"e(): \" << e() << std::endl;\n// 30     std::cout\
    \ << \"Instead of running: 1.0/(factorial(0))+1.0/(factorial(1))+1.0/(factorial(2))+1.0/(factorial(3))...\"\
    \ << std::endl;\n// 31 }\n// 32 }\n```\n\n图 133\n\n运行代码后可以看到 `e` 等于 `2.718`\n\n\
    ## 在数学和 C++ 中计算数字的平均值\n\n![](img/math_04.png)\n\n图 134\n\n在示例中，我们考察一个被各种符号围绕的集合\
    \ `X` 的平均值。`X` 被定义为一组数字。在数学中，`i` 代表集合中的每一个 每一个元素。\n\n```\n\\begin{align*}\nX =\
