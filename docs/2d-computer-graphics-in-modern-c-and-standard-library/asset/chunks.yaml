    ## Circles with Standard Library


    A circle is a round-shaped figure that has no corners or edges. The midpoint circle
    algorithm is widely used for efficiently drawing circles on raster displays, such
    as computer screens or images. The algorithm was developed as an extension of
    Bresenham’s line algorithm for drawing lines. The midpoint circle employs integer
    arithmetic and incremental calculations to minimize overhead and avoid using expensive
    floating-point arithmetic. It generates a set of points on the circle’s circumference,
    taking advantage of its symmetry.


    The algorithm works by starting at the topmost point of the circle and incrementally
    moving towards the x-axis while calculating the appropriate y-coordinate for each
    x-coordinate. It does this by evaluating a decision parameter at each step to
    determine the x-coordinate or both. The decision parameter is based on the circle
    equation and helps to determine whether the midpoint between candidate pixels
    is inside or outside. If the midpoint is inside the circle, the algorithm chooses
    the pixel closer to the x-axis; if it is outside, the algorithm selects the pixel
    closer to the y-axis.


    One of the key features of the midpoint circle algorithm is its ability to exploit
    the eightfold symmetry of a circle. Since a circle is symmetrical about both the
    x and y axes and the lines `y = x` and `y = -x`, the algorithm only needs to compute
    points in one-eighth of the circle and then derive the remaining points by reflection.
    This significantly reduces the number of calculations to draw the entire circle.


    This C++ code generates an image containing two circles, one filled and one unfilled,
    with a white background. The primary purpose of the code is to demonstrate the
    process of drawing circles using a simple implementation of the midpoint algorithm
    and saving the resulting image. The code starts by including necessary headers
    and defining helper functions as `get_index`, `calc_size`, `clear_image`, `draw_circle`,
    `draw_filled_circle`, and `save_image`. These functions perform various operations
    such as calculating indices for a 2D image stored as 1D vector, clearing the image
    by setting all pixels to white, drawing unfilled and filled circles.


    In the `main` function, the program sets the width and height of the image, as
    well as the positions and radii of the two circles. The x and y coordinates, as
    well as the radius of the circles, are calculated based on the dimensions of the
    image. The image vector is resized accordingly, and the `clear_image` function
    is called to fill the entire image with the background color.


    Next, the `draw_circle` function is called to draw the first circle (unfilled)
    on the image, and the `draw_filled_circle` function is called to draw the second
    circle (filled) on the image. Both functions use the midpoint circle algorithm
    to determine which pixels to set to the desired color (black). Finally, the `save_image`
    function is called to save the resulting image as a PPM file called `12_circle.ppm`.


