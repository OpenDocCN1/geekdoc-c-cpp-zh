    ### void drawFilledWedge(const Point& center, int radius, int startAngle, int
    endAngle, const Pixel& wedgeColor)


    #### Purpose

    The `drawFilledWedge` function is designed to draw a filled wedge (a sector of
    a circle) on the image. It specifies the center of the circle from which the wedge
    is derived, the radius, the wedge’s starting and ending angles, and the wedge’s
    color.


    #### Parameters

    `const Point& center:` A tuple representing the coordinates (x, y) of the circle’s
    center from which the wedge is derived.


    `int radius:` The radius of the circle.


    `int startAngle,` `int endAngle:` The starting and ending angles for the wedge,
    measured in degrees. These define the sector of the circle that will be filled
    to create the wedge.


    `const Pixel& wedgeColor:` The color for filling the wedge, represented as a `Pixel`
    object (a tuple of three doubles for red, green, and blue components).


    #### Functionality

    **Sector Identification**: The function identifies the circle sector to be filled
    using the `center,` `radius,` `startAngle,` and `endAngle` parameters.


    **Filling Algorithm**: It is internally called `drawFilledWedgeImpl,` which employs
    an algorithm to fill the circle sector defined by the specified angles. This involves
    calculating the set of pixels within the industry defined and setting their color
    to `wedgeColor.`


    **Color Application**: Every pixel within the specified sector is colored with
    `wedgeColor,` resulting in a filled wedge.


    #### Usage Example

    ```

    1 // Example of drawing a filled wedge

    2 Point center = std::make_tuple(200, 200); // Center at (200, 200)

    3 int radius = 40; // Radius of 40 units

    4 int startAngle = 45; // Starting angle at 45 degrees

    5 int endAngle = 135; // Ending angle at 135 degrees

