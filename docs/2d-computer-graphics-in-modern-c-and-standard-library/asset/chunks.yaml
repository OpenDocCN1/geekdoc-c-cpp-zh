    # Angle Conversion

    The function first converts the angle from degrees to radians, as the C++ trigonometric
    functions in use radians. This conversion is done by multiplying the degree value
    by `(pi/180)`.


    Coordinate Calculation: Using trigonometry, the function calculates the end coordinates
    of the line. It adds the cosine of the angle (multiplied by the length) to the
    x-coordinate and the sine (also multiplied by the length) to the y-coordinate
    of the starting point.


    Tuple Assignment: The start and end coordinates are then assigned to `lineCoords,`
    forming a `Coord` tuple, which typically consists of four integers representing
    a line segment’s starting and ending x and y coordinates.


    ## Usage Example


    ```

    1 Point center = std::make_tuple(50, 50); // Starting point at (50, 50)

    2 double angle = 45; // Angle in degrees

    3 int length = 100; // Length of the line

    4 Coord lineCoords;

    5 getAngledLine(lineCoords, center, angle, length);

    6 // Now lineCoords contains the start and end coordinates of the line

    ```

    Figure 100


    ## Remarks

    This function is particularly useful in graphics programming for drawing lines
    at specific angles, a common requirement in various applications like game development,
    simulations, or graphical representations.


    The conversion to radians and trigonometric functions are essential to accurately
    determine the line’s direction and length based on the given angle.


    ***


    # void drawBezierQuadratic(const Point& pt0, const Point& pt1, const Point& pt2,
    int split, const Pixel& bezierColor)


    ## Purpose

    The `drawBezierQuadratic` function draws a quadratic Bezier curve on an image.
    Bezier curves are widely used in computer graphics for modeling smooth curves
    and are fundamental in vector graphic designs.


    ## Parameters

    - `const Point& pt0:` The first control point of the Bezier curve.

    - `const Point& pt1:` The second control point defines the curve’s tangent at
    the start and end points.

    - `const Point& pt2:` The third control point of the curve.

    - `int split:` The number of segments to divide the curve into. A higher value
    results in a more detailed curve.

    - `const Pixel& bezierColor:` The color of the Bezier curve, represented as a
    `Pixel` object (a tuple of three doubles for red, green, and blue components).


    ## Functionality

    Curve Calculation: The function calculates the intermediate points of the quadratic
    Bezier curve based on the control points `pt0,` `pt1,` and `pt2.` It does this
    by linearly interpolating between these points for each fraction of the curve,
    determined by the `split` parameter.


    Coordinate Generation: The function generates a series of `(x, y)` coordinates
    representing the curve’s path and stores them in `xyCoordinates.`


    Drawing the Curve: Once the coordinates are calculated, `drawXyLineImpl` is called
    to draw straight line segments between these coordinates using the specified `bezierColor.`
    This approximates the smooth Bezier curve.


    ## Usage Example


    ```

    1 Point pt0 = std::make_tuple(10, 10); // First control point

    2 Point pt1 = std::make_tuple(50, 100); // Second control point

    3 Point pt2 = std::make_tuple(100, 10); // Third control point

    4 int split = 20; // Number of segments

    5 Pixel bezierColor = std::make_tuple(1.0, 0.0, 0.0); // Red color

    6 drawBezierQuadratic(pt0, pt1, pt2, split, bezierColor);

    7 // This will draw a quadratic Bezier curve on the image

    ```

    Figure 101


    ## Remarks

    Quadratic Bezier curves are characterized by their simplicity and elegance, making
    them suitable for various graphic applications, from font rendering to animation
    paths.


    The smoothness and accuracy of the curve are directly influenced by the `split`
    parameter, which determines how many line segments are used to approximate the
    curve.


    This method efficiently adds complex shapes and paths to an image with minimal
    computational overhead.


    ***


    # void drawBezierCubic(const Point& pt0, const Point& pt1, const Point& pt2, const
    Point& pt3, int split, const Pixel& bezierColor)


    ## Purpose

    The `drawBezierCubic` function is designed to draw a cubic Bezier curve on an
    image. For smooth and scalable curves, cubic Bezier curves are essential in computer
    graphics and digital animation.


    ## Parameters

    - `const Point& pt0:` The first control point of the Bezier curve.

    - `const Point& pt1:` The second control point influences the tangent direction
    at the start point.

    - `const Point& pt2:` The third control point affects the tangent direction at
    the endpoint.

    - `const Point& pt3:` The fourth control point of the curve.

    - `int split:` Defines the number of line segments that approximate the curve,
    affecting its smoothness.

    - `const Pixel& bezierColor:` Specifies the color for the Bezier curve, represented
    as a `Pixel` object.


    ## Functionality

    Curve Calculation: The function employs `cubicBezierCurvesImpl` to compute intermediate
    points of the cubic Bezier curve using the control points `pt0,` `pt1,` `pt2,`
    and `pt3.` The `split` parameter determines the number of points calculated along
    the curve, impacting its resolution.


    Coordinate Generation: A vector of `(x, y)` coordinates (`xyCoordinates`) is generated,
    outlining the curve’s path.


    Drawing the Curve: The `drawXyLineImpl` method draws line segments between the
    calculated coordinates, approximating the Bezier curve with the specified `bezierColor.`


    ## Usage Example


    ```

    1 Point pt0 = std::make_tuple(10, 10); // First control point

    2 Point pt1 = std::make_tuple(30, 150); // Second control point

    3 Point pt2 = std::make_tuple(150, 150); // Third control point

    4 Point pt3 = std::make_tuple(170, 10); // Fourth control point

    5 int split = 30; // Number of segments

    6 Pixel bezierColor = std::make_tuple(0.0, 0.0, 1.0); // Blue color

    7 drawBezierCubic(pt0, pt1, pt2, pt3, split, bezierColor);

    8 // Draws a cubic Bezier curve in blue

    ```

    Figure 102


    ## Remarks

    Due to the additional control point, the cubic Bezier curve offers greater control
    over the shape than quadratic Bezier curves.


    The function’s effectiveness in drawing complex shapes makes it particularly useful
    in graphic design, font rendering, and user interface development.


    The precision and visual quality of the curve are contingent upon the `split`
    parameter, which should be chosen based on the desired level of detail and computational
    efficiency.


    ***


    # void drawRectangle(const Point& xy, const Point& wh, const Pixel& bezierColor)


    ## Purpose

    The `drawRectangle` function is designed to draw a rectangle on an image. This
    function is fundamental in computer graphics for creating basic shapes and forms,
    useful in a wide range of applications, from user interface design to complex
    image processing.


    ## Parameters

    - `const Point& xy:` Represents the top-left corner of the rectangle, with `xy`
    being a tuple indicating the `(x, y)` coordinates.

    - `const Point& wh:` Specifies the rectangle’s width `w` and height `h`.`

    - `const Pixel& bezierColor:` Defines the rectangle’s color, represented as a
    `Pixel` object. The `Pixel` is a tuple of three doubles for the color’s red, green,
    and blue components.


    ## Functionality

    Drawing the Rectangle: The function internally calls `drawRectImpl,` passing the
    top-left corner coordinates, dimensions, and color of the rectangle.


    Edge Calculation: `drawRectImpl` calculates the coordinates for the remaining
    corners of the rectangle based on the provided width and height.


    Outline Rendering: The function then draws lines connecting these corners to form
    the outline in the specified `rectangleColor.`


    ## Usage Example


    ```

    1 Point topLeftCorner = std::make_tuple(50, 50); // Top-left corner of the rectangle

    2 Point dimensions = std::make_tuple(100, 150); // Width and height of the rectangle

    3 Pixel color = std::make_tuple(1.0, 0.0, 0.0); // Red color

    4 drawRectangle(topLeftCorner, dimensions, color);

    ```

