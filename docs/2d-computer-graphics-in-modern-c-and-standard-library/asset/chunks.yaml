- fmt: "\n```\n\nFigure 125\n\n#### Remarks\n\nThis function is crucial for exporting\
    \ images from the program, especially in scenarios where the `.PPM` format is\
    \ required due to its simplicity and compatibility with various image processing\
    \ tools.\n\nUnderstanding the format specifications of `.PPM` `P6`, including\
