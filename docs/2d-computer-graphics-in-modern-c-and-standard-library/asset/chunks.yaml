    h)` 函数获取对应的 `RGB` 值。


    我们还使用 `clip_line` 函数和 `find_region` 函数对可见屏幕和不可见屏幕之间的每条线进行裁剪。


    `std::mt19937` 是 C++ 标准库中对梅森旋转伪随机数生成器（PRNG）算法的实现。名称“mt19937”源于使用梅森素数 `2¹⁹⁹³⁷ -
    1` 作为内部状态基础的梅森旋转算法。该 PRNG 因其高质量的随机数生成能力、巨大的周期和高效的性能而被广泛使用。梅森旋转算法是各种应用程序的热门选择，包括模拟、统计建模和计算机游戏，在这些领域都需要高质量的随机数。


    `std::mt19937` 生成器是 C++11 或更高版本 `<random>` 头文件的一部分，该头文件提供了一套完善的随机数生成设施。此头文件包含了梅森旋转算法和其他随机数生成器、概率分布以及其他生成随机数的实用函数。`<random>`
    库的设计旨在相比于旧的 C++ 函数（如 `rand()` 和 `srand()`），提供一种更通用、更灵活的随机数生成方法。

