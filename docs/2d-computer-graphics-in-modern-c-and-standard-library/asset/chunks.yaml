    ## void applyLens(int numb)


    ### Purpose

    The `applyLens` function is designed to simulate the effect of multiple lens distortions
    on the image. This function applies a specified number of lens effects, each creating
    a localized distortion that mimics the bending of light, akin to viewing through
    a convex or concave lens.


    ### Parameters

    `int numb:` The number of lens effects to be applied to the image. Each lens effect
    creates a localized distortion.


    ### Functionality

    **Lens Effect Application**: The function internally calls `applyLensImpl,` which
    implements the algorithm for applying lens distortions. This involves selecting
    random points in the image and distorting the surrounding pixels to create a lens-like
    effect.


    **Randomized Distortion**: Each lens effect is applied at a random location on
    the image, and the extent of the distortion is based on predefined characteristics
    of the lens, such as its radius and refractive properties.


    ### Usage Example

    ```

    1 // Example of applying lens effects to an image

