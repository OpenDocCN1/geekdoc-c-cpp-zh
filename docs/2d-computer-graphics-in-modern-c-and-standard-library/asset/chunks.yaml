    要使用 `std::mt19937`，你首先需要创建一个生成器实例并用初始值对其进行种子设定。生成的随机数质量取决于种子值，通常源于高分辨率时钟或其他熵源。一旦生成器完成种子，你就可以使用它在指定范围内生成随机数，或者使用
    `random` 头文件中提供的分布类根据概率分布生成随机数。


