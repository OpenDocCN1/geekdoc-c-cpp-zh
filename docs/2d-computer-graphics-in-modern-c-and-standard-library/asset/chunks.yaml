    ## 使用标准库绘制圆


    圆是一个没有角或边缘的圆形形状。中点圆算法（midpoint circle algorithm）广泛用于在栅格显示器（如计算机屏幕或图像）上高效绘制圆。该算法是
    Bresenham 线条算法的扩展。中点圆算法采用整数算术和增量计算来最小化开销，并避免使用昂贵的浮点算术。它利用对称性，在圆周上生成一组点。


    该算法的工作原理是从圆的顶部点开始，逐渐向 x 轴移动，同时为每个 x 坐标计算适当的 y 坐标。它通过在每一步评估决策参数来确定 x 坐标或两者。决策参数基于圆的方程，有助于判断候选像素之间的中点是在圆内还是外部。如果中点在圆内，算法选择靠近
    x 轴的像素；如果在外部，算法选择靠近 y 轴的像素。


    中点圆算法的一个关键特性是利用圆的八倍对称性。由于圆关于 x 轴、y 轴以及直线 `y = x` 和 `y = -x` 对称，算法只需要计算圆的分之一的点，然后通过反射推导出剩余的点。这显著减少了绘制整个圆的计算量。


    该 C++ 代码生成两个圆（一个是轮廓，一个是填充的），带有白色背景。代码的主要目的是通过中点算法的简单实现演示绘制圆。代码开始时包含必要的头文件并定义辅助函数
    `get_index`、`calc_size`、`clear_image`、`draw_circle`、`draw_filled_circle` 和 `save_image`。这些函数执行各种操作，如计算存储为一维向量的二维图像索引。


    在 `main` 函数中，程序设置图像的宽度和高度以及两个圆的位置和半径。然后，创建一个表示图像的向量并用白色像素初始化。之后，在图像上绘制两个圆。


    接下来，调用 `draw_circle` 函数在图像上绘制第一个圆（未填充），调用 `draw_filled_circle` 函数在图像上绘制第二个圆（填充）。两个函数都使用中点圆算法来确定哪些像素设为所需的颜色（黑色）。最后，调用
    `save_image` 函数将结果图像保存为名为 `12_circle.ppm` 的文件。


