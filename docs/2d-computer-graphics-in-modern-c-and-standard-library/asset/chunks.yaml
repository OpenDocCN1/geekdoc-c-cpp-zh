    ### 挑战 1 - 现代 C++ 中的 PixMap 转 SVG


    在现代 C++ 中掌握二维计算机图形之旅终于一个充满挑战性的任务：开发你自己的追踪器，将 PPM 文件转换为 SVG 格式。这项尝试不仅测试了你的能力水平，还增强了你对矢量图形和图像处理的理解。在任务中，鼓励你从现有工具
    `vtracer` 获取灵感，这是一个强大的光栅到矢量图形转换器。关于 `vtracer` 的详细信息可以在 [GitHub  vtracer](https://github.com/visioncortex/vtracer)找到。


    首先，理解 `vtracer` 的原理至关重要。该工具体现了基于像素的图像转换为可缩矢量图形的艺术。其底层算法是图像处理与矢量化技术完美融合的证明。算法的细节作为你实现的指导框架，在
    [vtracer 文档](https://www.visioncortex.org/vtracer-docs) 中有详细解释。


    你的实现应根于现代 C++ 实践，不仅展示了技术能力，还体现了现代编码标准的优雅与高效。利用 C++ 的强大特性来创建一个既有效又高效的解决方案，反映该语言自传统图像处理工具诞生以来的进步。


    你实现的关键组件之一是处理 PPM 文件。为此，你应该使用 `ppmpp.hpp` 库，这是一个用于处理 PPM 文件的高效现代的 C++ 库。它为处理 PixMap
    文件提供了简洁且直观的接口，这对于你追踪器的输入处理至关重要。你可以在 [GitHub ppmpp](https://github.com/chbtoys/ppmpp)
    找到更多关于 `ppmpp.hpp` 的信息。


    在制作追踪器时，专注于转换准确性和输出 SVG 文件的优化。挑战不仅在于准确追踪输入图像的轮廓和特征，还在于不牺牲视觉保真度的前提下优化矢量图形以减小文件大小。这种平衡对于创建可扩展且高效的
    SVG 文件至关重要。


    当你开启这段旅程时，请记住错误处理和代码健壮性与核心功能同样重要。你的追踪器应该能够处理各种边界情况和输入异常，确保转换过程顺畅且可靠。这不仅将证明你的技术实力，还将体现你在创建以用户为中心的应用程序方面的远见。


