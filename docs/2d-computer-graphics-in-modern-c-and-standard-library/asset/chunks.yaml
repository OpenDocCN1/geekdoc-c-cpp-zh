    Cohen-Sutherland 算法根据线段端点相对于视口的位置为每个端点分配一个 4 位的区域代码。这些位分别对应视口外的顶部、底部、右侧和左侧区域。`find_region`
    函数计算给定点的区域代码。如果两个端点的区域代码均为 `0`，则该线段完全在视口内，不需要裁剪。如果两个区域代码的按位与运算（bitwise AND）结果不为零，则该线段完全在视口外，可以将其丢弃。


    当线段跨越视口边界时，`clip_line` 函数就会发挥作用。该函数通过计算直线与边界之间的交点，迭代地针对视口的每条边缘对线段进行裁剪。然后，它将视口外的端点替换为交点，并更新其区域代码。这个过程会重复进行，直到线段完全在视口内或被判定为在视口外。


