    over time due to the presence of a damping factor. In mathematical terms, a damped
    sine wave can be represented as `A(t) = A₀ * sin(ωt + φ) * e^(-αt),` where `A₀`
    is the initial amplitude, `ω` is the angular frequency, `φ` is the phase, `α`
    is the damping factor, and `t` represents time. The damping factor, `α,` determines
    the rate at which the amplitude decreases; a more significant damping factor results
    in a more rapid decrease in amplitude, while a smaller damping factor causes the
    amplitude to decay more slowly.


    Damped sine waves can be effectively used in animations to create natural-looking
    motion or simulate physical processes involving oscillatory behavior. For example,
    they can animate a pendulum’s movement, the ball’s bouncing, or the spring’s oscillation.
    In these cases, the damped sine wave helps model the gradual energy loss due to
    friction, air resistance, or other dissipative forces in real-world systems. By
    incorporating damped sine waves into animations, designers can create more realistic
    and visually appealing motion that closely mimics the behavior observed in nature,
    making the animation more immersive and engaging for the audience.


