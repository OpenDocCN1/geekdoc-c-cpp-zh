    The Cohen-Sutherland algorithm assigns a 4-bit region code to each line segment
    endpoint based on its position relative to the viewport. The bits correspond to
    the top, bottom, right, and left regions outside the viewport. The `find_region`
    function computes this region code for a given point. If both endpoints have a
    region code of `0`, the line segment is entirely inside the viewport, and no clipping
    is required. If the bitwise AND of the two region codes is non-zero, the line
    segment is altogether outside the viewport and can be discarded.


    When a line segment straddles the viewport boundary, the `clip_line` function
    comes into play. This function iteratively clips the line segment against each
    viewport edge by calculating the intersection point between the line and the border.
    It then replaces the endpoint outside the viewport with the intersection point
    and updates its region code. This process is repeated until the line segment is
    either entirely inside the viewport or determined to be outside the viewport.


