    \ 4 // LaTeX: k > 2 \\land k < 4 \\Leftrightarrow k = 3\n 5 // Test LaTeX: https://quicklatex.com/\n\
    \ 6 #include <iostream>\n 7 #include <cassert>\n 8 \n9 int main() {\n10     int\
    \ k=3;\n11 \n12     if (k > 2 && k < 4) {\n13         assert(k == 3);\n14    \
    \ }\n15 }\n```\n\nFigure 220\n\nWe use `assert` to verify that `k` is larger than\
    \ `2` and that `k` is lesser than `4`. The `assert` explicitly asserts that `k`\
    \ equals `3`. As you can see, both sides are equivalent.\n\nIn C++:\n\n```cpp\n\
    \ 1 // From Paper to Code\n 2 // Arrows - conjunction & disjunction\n 3 // Run\
    \ with: https://www.jdoodle.com/online-compiler-c++17/\n 4 // LaTeX: k > 2 \\\
    land k < 4 \\Leftrightarrow k = 3\n 5 // Test LaTeX: https://quicklatex.com/\n\
    \ 6 #include <iostream>\n 7 #include <cassert>\n 8 \n9 int main() {\n10     int\
    \ k=3;\n11 \n12     if (k == 3) {\n13         assert(k > 2 && k < 4);\n14    \
    \ }\n15 }\n```\n\nFigure 221\n\nIt validates the other way around. The down arrow\
    \ is a logical disjunction, like the `OR` operator.\n\n![](resources/math_44.png)\
    \ Figure 222\n\nOR\n\nIn C++:\n\n```cpp\n 1 // From Paper to Code\n 2 // Arrows\
    \ - conjunction & disjunction\n 3 // Run with: https://www.jdoodle.com/online-compiler-c++17/\n\
    \ 4 // LaTeX: A \\lor B\n```\n"
