    ### Implementing Triangle Grid in C++


    Creating a triangle grid in C++ involves calculating the coordinates of each triangle’s
    vertices and rendering them on a 2D plane. We use simple arithmetic and looping
    structures to calculate these points and draw the triangles. The `averageTriangleColor`
    function is a crucial component that calculates the average color of the pixels
    within a triangle, allowing us to fill each triangle with a color representative
    of an underlying image.


    ### Drawing a Triangle


    The fundamental step in creating a triangle grid is drawing a single triangle.
    We discuss how to determine the vertices of a triangle and use the `drawFilledTriangle`
