    three images at each pixel and a pink color tuple (1.0f, 0.0f, 1.0f) to check
    against the texture image.


    Using two nested for loops, the function iterates through each pixel of the images.
    If the color value of the texture image at the current pixel is not pink, the
    function retrieves the color values of the base, texture, and alpha images at
    the current pixel. It then calculates the new red, green, and blue color values
    for the base image by interpolating between the texture and base images` color
