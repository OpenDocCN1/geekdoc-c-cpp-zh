    ## PPMPP: Image Processing Function Reference


    ### `void setPixel(int xCoord, int yCoord, const Pixel& newPixel)`


    #### Purpose


    The `setPixel` function is used to set the color of a specific pixel in the image
    to a new value.


    #### Parameters


    - `int xCoord`: the x-coordinate of the pixel to be set.

    - `int yCoord`: the y-coordinate of the pixel to be set.

    - `const Pixel& newPixel`: the new color value for the pixel, represented as a
    `Pixel` object (which is a tuple of three doubles, each representing the red,
    green, and blue components of the color).


    #### Functionality


    - **Boundary Check**: The function first checks if the specified coordinates (`xCoord`
    and `yCoord`) are within the boundaries of the image. This is determined by comparing
    `xCoord` with `0` and `m_width`, and `yCoord` with `0` and `m_height`.

    - **Pixel Update**: If the coordinates are within the range, the function calculates
    the index corresponding to these coordinates in the `m_img` vector (which stores
    the image data) using the `getIndex` function. Once the index is determined, the
    function updates the pixel at this index with the color value provided by `newPixel`.


    #### Usage Example


    ```

    Image myImage(100, 100); // Creating an image of 100x100 pixels

    Pixel redColor = std::make_tuple(1.0, 0.0, 0.0); // Creating a red color

    myImage.setPixel(50, 50, redColor); // Setting the pixel at (50, 50) to red

    ```


    Figure 99


    #### Remarks


    The function ensures that the pixel coordinates are within the image, preventing
    any out-of-range errors that could occur when accessing the `m_img` vector.


    This method is fundamental for image drawing and editing operations, as it allows
    for manipulating individual pixels, the basic unit of a digital image.


