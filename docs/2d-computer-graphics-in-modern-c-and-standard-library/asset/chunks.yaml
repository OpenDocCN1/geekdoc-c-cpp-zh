    library. This function takes four control points and draws a cubic Bezier curve.
    A similar process is followed for the lines, using the `drawLine` function to
    render each line specified in the `lineData.`


    The program’s key feature is the application of anti-aliasing, which is done through
    the `applyAntiAliasing` function. Anti-aliasing is used in computer graphics to
    minimize the jagged edges in digital images, especially around curves and diagonal
    lines. This is achieved by smoothing out the color transitions between the edges
    of the lines and the background.


    Finally, the program writes the resulting image to a file named `23_anti_aliasing.ppm.`
