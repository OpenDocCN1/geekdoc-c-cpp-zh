    ## Circles with Standard Library


    A circle is a round-shaped figure that has no corners or edges.


    The midpoint circle algorithm is widely used for efficiently drawing circles on
    raster displays, such as computer screens or images. The algorithm was developed
    as an extension of Bresenham’s line algorithm for drawing lines. The midpoint
    circle algorithm employs integer arithmetic and incremental calculations to minimize
    computational overhead and avoid using computationally expensive floating-point
    arithmetic, such as square root operations. It generates a set of points on the
    circle’s circumference, taking advantage of its inherent symmetry to reduce the
    required calculations.


    The algorithm works by starting at the topmost point of the circle and incrementally
    moving towards the x-axis while calculating the appropriate y-coordinate for each
    x-coordinate. It does this by evaluating a decision parameter at each step to
    determine whether to increment the x-coordinate, the y-coordinate, or both. The
    decision parameter is based on the circle equation, and it helps to determine
    whether the midpoint between two candidate pixels is inside or outside the circle.
    If the midpoint is inside the circle, the algorithm chooses the pixel closer to
    the x-axis; if it is outside, the algorithm selects the pixel closer to the y-axis.


    One of the key features of the midpoint circle algorithm is its ability to exploit
    the eightfold symmetry of a circle. Since a circle is symmetrical about both the
    x and y axes and the lines y = x and y = -x, the algorithm only needs to compute
    the points in one-eighth of the circle and then derive the remaining points by
    reflection. This significantly reduces the number of calculations required to
    draw the entire circle. The result is an efficient method for drawing circles
    in computer graphics, mainly when working with low-level raster graphics operations
    or limited computational resources.


