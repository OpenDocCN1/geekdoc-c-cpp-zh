    - **填充与旋转过程**：它内部调用 `drawFilledRotatedEllipseImpl,`，实现了绘制和填充旋转椭圆的算法。这涉及计算由于旋转导致的椭圆边界变换坐标并填充生成的形状。

    - **颜色应用**：旋转椭圆边界内的整个区域用 `px,` 着色，产生一个填充的、有色的旋转椭圆形状。


    #### 使用示例


    ```

    1 // 绘制填充旋转椭圆的示例

    2 int centerX = 200; // 中心 X 坐标

    3 int centerY = 100; // 中心 Y 坐标

    4 int width = 140;   // 宽度为 140 单位

    5 int height = 80;   // 高度为 80 单位

    6 double rotationAngle = 30.0; // 旋转 30 度

