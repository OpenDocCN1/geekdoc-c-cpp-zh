    ### Challenge 3 - PixMap Converted to an Oil Painting Using Genetic Drawing in
    Modern C++


    In the dynamic world of 2D Computer Graphics with Modern C++, a new and fascinating
    challenge emerges: creating a genetic drawing software that transforms a PPM file
    into an oil painting-like image. This challenge not only encapsulates the essence
    of computer graphics but also bridges the gap between algorithmic complexity and
    artistic expression. The concept is inspired by the innovative approach of Genetic
    Drawing, as explored in [Genetic Drawing on GitHub](https://github.com/anopara/genetic-drawing).


    Your objective is to design and implement a software in modern C++ that employs
    a genetic algorithm to iteratively evolve a random set of brush strokes into a
    coherent image that resembles an oil painting. This process mimics natural selection,
    where each iteration or ‘generation’ of the image is evaluated for its closeness
    to the target image, guiding the algorithm towards a better representation. To
    understand the underlying principles of this technique, explore resources like
    this [YouTube playlist on Genetic Algorithms](https://www.youtube.com/playlist?list=PLRqwX-V7Uu6bJM3VgzjNV5YxVxUwzALHV)
    and Shahriyar Shahrabi’s article on [Procedural Paintings with Genetic Evolution
    Algorithm](https://shahriyarshahrabi.medium.com/procedural-paintings-with-genetic-evolution-algorithm-6838a6e64703).


    The heart of your project is the processing of PPM files, a format well-recognized
    in graphics programming. For handling these files efficiently, the `ppmpp.hpp`
    library, a modern C++ library dedicated to PPM file manipulation, should be integrated
    into your solution. It provides a robust platform for handling image data, which
    is crucial for your application. More details on `ppmpp.hpp` can be found at [ppmpp
    on GitHub](https://github.com/chbtoys/ppmpp).


    Your implementation should adeptly handle the nuances of genetic algorithms, such
    as selection, crossover, and mutation, to evolve brush strokes that collectively
    represent the original image. The challenge is to simulate the texture and color
    blending typical of oil paintings, using algorithmically generated brush strokes.
    This requires a deep understanding of genetic algorithms, along with a keen sense
    of artistic styling in digital media.


    The efficiency of the algorithm is paramount. Your solution should not only strive
    for visual accuracy but also for computational efficiency. This involves optimizing
    the genetic algorithm to converge towards a satisfactory image in as few generations
    as possible, thus balancing the computational load with the quality of the output.


    Modern C++ offers a plethora of features that are perfect for this task. Smart
    pointers, advanced data structures, and concurrency features should be harnessed
    to manage the complex data and processing requirements of this application. Your
