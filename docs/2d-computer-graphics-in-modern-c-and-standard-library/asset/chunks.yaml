    Figure 188\n\n* * *\n\n### Common Number Sets\n\n![](resources/math_23.png)\n\n\
    Figure 189\n\nHere, we have a few common sets and their symbols placed before\
    \ them.\n\n`[R]` Real Numbers The large `R` describes the set of real numbers.\
    \ These include integers, as well as rational and irrational numbers. Real numbers\
    \ are also finite, as in not infinite.\n\n`[Q]` Rational Numbers Rational numbers\
    \ are real numbers that can be expressed as a fraction or ratio, like three-fifths.\
    \ Rational numbers cannot have zero as a denominator.\n\nThis also means that\
    \ all integers are rational numbers since the denominator can be expressed as\
    \ `1`\n\nAn irrational number, on the other hand, cannot be expressed as a ratio,\
    \ like Pi, that is: `3.14159265359`\n\n`[Z]` Integers An integer or a real number\
    \ with no fractional part can be positive or negative.\n\n`[N]` Natural Numbers\
    \ A natural number is a positive and non-negative integer. Depending on the context\
    \ and field of study, the set may or may not include zero.\n\n`[C]` Complex Numbers\
    \ A complex number combines real and imaginary numbers, viewed as coordinates\
    \ in the 2D plane.\n\n* * *\n\n### Function\n\nFunctions are fundamental features\
    \ of mathematics, and the concept is easy to translate into code.\n\nA function\
    \ relates an input to an output value. This is a function.\n\n![](resources/math_24.png)\n\
    \nFigure 190\n\nWe can give this function a name. Commonly, we use `f` to describe\
    \ a function, but it could be named `A` or anything else.\n\n![](resources/math_25.png)\n\
    \nFigure 191\n\n```\n1 LaTeX: f\\left (x \\right ) = x^{2}\n```\n\nFigure 192\n\
    \nIn C++:\n\n```\n 1 // From Paper to Code\n 2 // Function\n 3 // Run with: https://www.jdoodle.com/online-compiler-c++17/\n\
    \ 4 // LaTeX: f\\left (x \\right) = x^{2}\n 5 // Test LaTeX: https://quicklatex.com/\n\
    \ 6 #include <iostream>\n 7 #include <cmath>\n 8 \n 9 int square(int x)\n10 {\n\
    11     return pow(x,2);\n12 }\n13 \n14 int main() {\n15     std::cout << \"10^2\
    \ = \" << square(10) << std::endl;\n16 }\n```\n\nFigure 193\n\nRunning the code,\
    \ we get that `10` squared is: `100`\n\nSometimes, a function is not named; instead,\
    \ the output is written. Here, `x` is the input, the relationship is squaring,\
