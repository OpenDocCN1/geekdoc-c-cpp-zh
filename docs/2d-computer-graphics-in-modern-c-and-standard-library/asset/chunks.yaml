    ### Challenge 2 - PixMap Converted To Rotated Filled Blended Ellipses in Modern
    C++


    In the realm of 2D Computer Graphics with Modern C++, an intriguing and complex
    challenge awaits: creating a software that converts PPM files into SVG format
    using rotated, filled, blended ellipses. This task is not only a test of programming
    skill but also an exploration into the blend of art and algorithm. The inspiration
    for this challenge comes from the tool known as `Primitive`, which is detailed
    at [Primitive on GitHub](https://github.com/fogleman/primitive). This tool masterfully
    recreates images using simple geometric shapes, providing a foundation upon which
    to build your project.


    Your task is to create a modern C++ application that employs hill climbing and
    simulated annealing algorithms to iteratively improve the quality of the generated
    SVG image. These optimization algorithms, commonly used in artificial intelligence
    and mathematical optimization, can be explored in more detail at [Hill Climbing
    on Wikipedia](https://en.wikipedia.org/wiki/Hill_climbing) and [Simulated Annealing
    on Wikipedia](https://en.wikipedia.org/wiki/Simulated_annealing). The challenge
    is to adapt these algorithms for image processing, making artistic decisions about
    shape placement, rotation, and color blending.


    The core of your project will involve interpreting PPM files, a popular image
    format in the graphics community. Handling these files effectively is crucial,
    and for this, you should integrate the `ppmpp.hpp` library, a modern C++ library
    tailored for PPM file manipulation. Its capabilities and usage are further explained
    at [ppmpp on GitHub](https://github.com/chbtoys/ppmpp). This library will serve
    as the backbone for your image processing and conversion task.


    Your implementation should focus on creating SVG images composed entirely of ellipses.
    These ellipses, varying in size, orientation, color, and blending levels, must
    be strategically placed to replicate the original PPM image as closely as possible.
    This requires a deep understanding of color theory, geometry, and algorithmic
    optimization to achieve a harmonious and aesthetically pleasing result.


    The challenge lies not only in accurately reproducing the input image but also
    in doing so with a minimal number of ellipses. This constraint will push you to
    optimize your algorithm for both performance and output quality. You must strike
    a balance between the fidelity of the recreated image and the efficiency of the
    computational process.


    To achieve this, you will need to delve into the nuances of modern C++ programming.
    Your solution should showcase the power and elegance of C++, leveraging features
    like smart pointers, lambda expressions, and the Standard Template Library (`STL`)
    to build a robust and efficient application. Your code will be a testament to
    the capabilities of C++ in handling complex algorithmic challenges and graphical
    computations.


    This project is not only a technical endeavor but also an artistic one. It requires
    a keen eye for detail and an appreciation for visual aesthetics. Your program
    should not just replicate images mechanically but should also capture the essence
    and mood of the original, using ellipses as a creative medium.


    Completing this challenge will mark a significant milestone in your journey through
    the world of modern C++.


