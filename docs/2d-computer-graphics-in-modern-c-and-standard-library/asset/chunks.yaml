    ### Challenge 1 - PixMap to SVG in Modern C++


    The journey of mastering 2D computer graphics in Modern C++ culminates in a stimulating
    challenge: developing your own tracer to convert PPM files into SVG format. This
    endeavor not only tests your proficiency but also enhances your understanding
    of vector graphics and image processing. In this task, you are encouraged to draw
    inspiration from an existing tool, `vtracer`, a robust raster-to-vector graphics
    converter. Detailed information about `vtracer` can be found at [vtracer on GitHub](https://github.com/visioncortex/vtracer).


    To begin, it’s crucial to understand the mechanics behind `vtracer`. This tool
    exemplifies the art of transforming pixel-based images into scalable vector graphics.
    Its underlying algorithm is a testament to the harmonious blend of image processing
    and vectorization techniques. The algorithm’s comprehensive details, which will
    serve as a guiding framework for your implementation, are thoroughly explained
    at [vtracer documentation](https://www.visioncortex.org/vtracer-docs).


    Your implementation should be rooted in modern C++ practices, showcasing not only
    technical competence but also the elegance and efficiency of modern coding standards.
    Embrace C++’s powerful features to create a solution that’s both effective and
    efficient, reflecting the advancements in the language since the inception of
    traditional image processing tools.


    One of the key components of your implementation will be handling PPM files. For
    this, you should utilize the `ppmpp.hpp` library, an efficient and modern C++
    library for PPM file manipulation. It provides a streamlined and intuitive interface
    for handling PixMap files, essential for your tracer’s input processing. You can
    find more about `ppmpp.hpp` at [ppmpp on GitHub](https://github.com/chbtoys/ppmpp).


    In crafting your tracer, focus on the conversion accuracy and the optimization
    of the output SVG files. The challenge lies not only in accurately tracing the
    outlines and features of the input image but also in optimizing the vector graphics
    for minimal file size without compromising the visual fidelity. This balance is
    crucial in creating scalable and efficient SVG files.


    As you embark on this journey, remember that error handling and code robustness
    are as important as the core functionality. Your tracer should be equipped to
    handle various edge cases and input anomalies, ensuring a smooth and reliable
    conversion process. This will not only demonstrate your technical prowess but
    also your foresight in creating user-centric applications.


    This project is more than a mere exercise in coding. It’s an opportunity to delve
    deep into the realms of computer graphics, image processing, and modern C++ programming.
    By completing this challenge, you will not only have created a valuable tool but
    also have taken a significant leap in your understanding of these interconnected
    domains. This endeavor, standing at the intersection of creativity and technicality,
    is sure to be a rewarding climax to your exploration of 2D Computer Graphics in
    Modern C++.


