    \ << std::endl;\n// 19 }\n// 20 }\n```\n\nFigure 130\n\n***\n\n## Exploring the\
    \ Concept of Summation in Mathematics and Its Implementation in C++\n\n![](resources/math_03.png)\n\
    \nFigure 131\n\nIn the example, we encounter a mathematical expression featuring\
