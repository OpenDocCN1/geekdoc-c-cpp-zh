    ### void applyGaussianBlur()


    #### Purpose

    The `applyGaussianBlur` function is tailored to apply a Gaussian blur effect to
    the entire image. Gaussian blur is a widely used effect in image processing that
    smooths out images by averaging the pixels within a region, reducing noise and
    detail.


    #### Parameters

    None.


    #### Functionality

    - Gaussian Blur Algorithm: The function internally invokes `applyGaussianBlurImpl`,
    which implements the Gaussian blur algorithm. This algorithm typically involves
    convolving the image with a Gaussian kernel, a mathematical function used to weight
    the average of the pixels based on their spatial distance from the center of the
    kernel.

    - Pixel-by-Pixel Processing: It processes each pixel in the image, considering
    the neighboring pixels to compute a blurred (smoothed) value. The extent of blurring
    depends on the size and standard deviation of the Gaussian kernel used in the
    algorithm.


    #### Usage Example

    ```

    1 // Example of applying Gaussian blur to an image

    2 applyGaussianBlur(); // The entire image is now blurred

    ```


    Figure 118


    #### Remarks

    This function is pivotal in various image processing tasks where reducing high-frequency
    noise or smoothing details is necessary, such as in pre-processing steps for edge
    detection or creating artistic effects.


    Applying Gaussian blur can enhance the performance of algorithms sensitive to
    noise or fine details by providing a smoother version of the image.


    The `applyGaussianBlur` method is a fundamental tool in digital image processing.
    It is widely used for its effectiveness in creating a visually pleasing blur effect
    mimicking how cameras capture out-of-focus points of light.


