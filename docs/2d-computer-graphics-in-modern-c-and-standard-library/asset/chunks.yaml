    \ = 1;\n// 10     for (int i = 1; i <= n; ++i) {\n// 11         temp *= i;\n//\
    \ 12     }\n// 13     return temp;\n// 14 }\n// 15 \n// 16 int main() {\n// 17\
    \     std::cout << \"Factorial of 5 is: \" << factorial(5) << std::endl;\n// 18\
