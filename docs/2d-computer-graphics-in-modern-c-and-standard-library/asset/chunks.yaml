    10 {\n11     return trunc(log10(n));\n12 }\n13 \n14 int main() {\n15     double\
    \ k=1000.0;\n16     double j=0.001;\n17 \n18     if (orderOfMagnitude(k) > orderOfMagnitude(j))\
    \ {\n19         std::cout << \"k is in order of magnitude larger than j.\" <<\
    \ std::endl;\n20     }\n21 }\n```\n\nFigure 218\n\nHere we check the order of\
