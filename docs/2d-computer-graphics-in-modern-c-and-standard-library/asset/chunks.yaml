    The `23_anti_aliasing.cpp` program demonstrates anti-aliasing in 2D graphics to
    create smoother images, particularly when rendering curves and lines. It employs
    the `ppmpp.hpp` graphics library, which provides drawing and image manipulation
    functions.


    The program starts by defining a type alias, `BezierControlPoints,` for a tuple
    of four `ppm::Point` objects. These points will represent the control points for
    Bezier curves. Bezier curves are commonly used in computer graphics to model smooth
