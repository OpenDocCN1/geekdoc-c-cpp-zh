    在现代 C++ 的二维计算机图形领域，一个引人入胜且复杂的挑战等待：创建一个使用旋转、填充、混合椭圆将 PPM 文件转换为 SVG 格式的软件。这项任务不仅是对编程技能的测试，也是对艺术与算法融合的探索。挑战的灵感来自名为
    `Primitive` 的工具，其详细信息见 [GitHub Primitive](https://github.com/fogleman/primitive)。该工具使用简单的几何形状精巧地重建图像，为构建你的项目提供了基础。


    你的任务是创建一个现代 C++ 应用，利用爬山算法和模拟退火算法来迭代改进生成的 SVG 图像的质量。这些优化算法常用于人工智能和数学优化，可以在 [维基百科爬山算法](https://en.wikipedia.org/wiki/Hill_climbing)
    和 [维基百科模拟退火](https://en.wikipedia.org/wiki/Simulated_annealing) 中更深入的探索。挑战在于将这些算法应用于图像处理，并在形状放置、旋转和颜色混合方面做出艺术决策。


    你项目的核心将涉及解释 PPM 文件，这是图形社区中常用的图像格式。有效处理这些文件至关重要，为此，你应该集成 `ppmpp.hpp` 库，这是一个专门为处理
    PPM 文件定制的现代 C++ 库。其功能和用法在 [GitHub ppmpp](https://github.com/chbtoys/ppmpp) 中进一步说明。该库将作为你图像处理和转换任务的骨干。


    你的实现应专注于创建完全由椭圆组成的 SVG 图像。这些椭圆在大小、方向、颜色和混合程度上不同，必须经过策略性的放置，以尽可能地复制原始 PPM 图像。这需要对色彩理论、几何学和算法优化有深入的理解，以达到和谐美观的结果。

