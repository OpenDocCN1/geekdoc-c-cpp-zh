    ## PPM Compressor


    **Source code**: `22_PPM_compressor.cpp`


    **Note**: Uses ZLib for compression, decompression and crc32 calculation.


    ### Introduction


    Compression is fundamental in computer graphics and image processing, especially
    for large image files like those in the PPM (Portable Pixmap) format. This chapter
    explores creating a compressor and decompressor for PPM files using C++, focusing
    on implementing compression algorithms and file-handling techniques.


    ### Understanding Image Compression


    Image compression involves reducing the size of an image file without significantly
    affecting its quality. This process is crucial for efficient storage and transmission
    of images. In our implementation, we use zlib, a software library for data compression,
    to compress and decompress PPM image files.


    ### Implementing PPM Compression in C++


    To handle PPM compression, we developed the `CPPM` class. This class manages the
    reading of PPM files, compresses the image data using zlib, and writes the compressed
    data to a new file with a custom file extension (`.cppm).` We discuss the integration
    of external libraries (zlib) and the handling of binary data in C++.


    ### Reading PPM Files


    The first step in the compression process is to read the original PPM file. The
    `readFileToVector` method reads the file into a `std::vector<uint8_t>,` which
    stores the image data as a sequence of bytes. We cover efficient file reading
    strategies and error handling in C++.


    ### Compressing and Writing the Data


    After reading the image data, the `deflate` method compresses it using Zlib’s
    compression functionalities. The compressed data is then written to a new file
    with the `.cppm` extension using the `writeVectorToFile` method. This section
    highlights the use of zlib for compression and the writing of binary data to files.


    ### Decompressing CPPM Files


    In addition to compression, our class handles the decompression of `.cppm` files
    back to the original PPM format. The `inflate` method decompresses the data, and
    the decompressed image is written to a PPM file. We discuss decompression techniques
    and the reversal of the compression process.


    ### Practical Application: Compressing and Decompressing Images


    We apply these concepts to compress and decompress PPM image files, demonstrating
    the practical use of the `CPPM` class. This example serves as a helpful tool for
    reducing the storage requirements of PPM images and illustrates the effectiveness
    of compression algorithms.


    ### Challenges and Solutions in Image Compression


    Image compression can present challenges, such as balancing compression ratio
    and image quality, handling large images efficiently, and ensuring compatibility
    with different image formats. We address these challenges with strategies for
    optimizing compression and ensuring data integrity.


    ### Advanced Techniques: Custom Compression Algorithms


    Beyond standard Zlib compression, we explore the possibility of implementing custom
    compression algorithms tailored for specific types of images or applications.
    This includes lossy compression techniques and specialized algorithms for specific
    image characteristics.


    ### About the code


    The `22_PPM_compressor.cpp` program is designed to compress and decompress PPM
    (Portable Pixmap) image files, saving them in a custom CPPM format. This is achieved
    using ZLib, a widely-used library for data compression, which provides functions
    for compression (deflation) and decompression (inflation) as well as for CRC32
    (Cyclic Redundancy Check) calculations. The CPPM format is intended to save space
    on disk or in RAM, particularly useful for large images or when managing a collection
    of images.


    The core of this program lies in the `CPPM` class. This class handles the reading
    of PPM files, compresses them to CPPM format, decompresses CPPM files back to
    PPM, and writes the resulting images back to disk. It uses two main vectors, `input`
    and `output,` to store the image data during processing.


    The `crc32Calculation` function calculates the CRC32 checksum of the given data.
    This checksum is crucial for verifying the integrity of the data during decompression.


    The `deflate` function compresses the input data using zlib’s `compress2` function
    with the best compression setting, `Z_BEST_COMPRESSION.` It returns the size of
    the compressed data. In contrast, the `inflate` function decompresses the data.
    It attempts to uncompress the data in a loop, increasing the buffer size until
    successful or until a maximum attempt limit is reached.


    File operations are performed by `readFileToVector` and `writeVectorToFile.` The
    former reads a file into the `input` vector, while the latter writes the contents
    of the `output` vector to a file.


    Metadata handling is done by the `concatenateData` and `extractDataFromVector`
    functions. `concatenateData` appends metadata (like file size and CRC checksum)
    to the compressed data, and `extractDataFromVector` does the reverse, extracting
    metadata from the input vector and preparing the data for decompression.


    The class constructor handles the workflow. It opens the input file, determines
    if it needs to compress or decompress based on the file suffix (`.ppm` for PPM,
    `.cppm` for CPPM), and performs the necessary operations. If the file is a PPM,
    it compresses it to CPPM format. If it’s a CPPM, it decompresses it back to PPM.


    The program accepts command-line arguments for the input and optional output file
    names in the’ main’ function. Depending on the number of arguments provided, it
    either compresses or decompresses the specified file.


    Overall, this program showcases a practical application of data compression in
    handling image files. Converting PPM files to a compressed format demonstrates
    using Zlib effectively for such tasks. This is especially useful in applications
    where managing large sets of images efficiently is crucial.


    ### Conclusion


    Image compression is an essential skill in computer graphics and image processing.
    This chapter provides a detailed guide to implementing PPM compression and decompression
    in C++, from reading image files to applying compression algorithms and handling
    binary data. The knowledge and experience gained here are invaluable for anyone
