    ### void upscale(int scale)


    #### Purpose

    The `upscale` function is designed to increase the size of the image by a specified
    scale factor. This function enlarges the image, enhancing its dimensions while
    maintaining its aspect ratio.


    #### Parameters

    `int scale`: The factor by which the image’s dimensions will be multiplied. A
    scale factor greater than 1 enlarges the image, while a factor less than one would
    technically reduce its size.


    #### Functionality

    - Scaling Process: The function internally calls `upscaleImpl`, which implements
    the scaling algorithm. This process involves resizing the image to a new set of
    dimensions, determined by multiplying the original dimensions by the scale factor.

    - Pixel Interpolation: During the scaling process, the algorithm interpolates
    new pixel values to maintain the image’s quality and details. This can involve
    techniques like bilinear or bicubic interpolation, which estimate new pixel values
    based on the surrounding pixels.


    #### Usage Example

    ```

    1 // Example of upscaling an image

    2 int scaleFactor = 2; // Scaling the image to double its size

    3 upscale(scaleFactor); // The image is now upscaled by a factor of 2

    ```


    Figure 120


    #### Remarks

    This function is crucial for applications that require high-resolution images
    from lower-resolution sources. It is widely used in graphic design, media production,
    and other areas where image clarity at larger sizes is necessary.


    While upscaling can increase the size of an image, it’s important to note that
    the quality of the upscaled image may sometimes match the clarity of a naturally
    high-resolution image due to the interpolation of new pixel values.


    The `upscale` method provides a fundamental capability for resizing images, an
    essential process in various image manipulation and enhancement tasks.


