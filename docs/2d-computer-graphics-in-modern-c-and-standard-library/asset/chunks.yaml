    ### void applyAntiAliasing()


    #### Purpose

    The `applyAntiAliasing` function is designed to smooth out the jagged edges in
    the image, often referred to as “aliasing.” This function applies an anti-aliasing
    technique to enhance the image’s visual quality by reducing the stair-step-like
    lines that can occur in digital images.


    #### Parameters

    None.


    #### Functionality

    - Anti-Aliasing Algorithm: The function internally calls `applyAntiAliasingImpl`,
    which implements the anti-aliasing algorithm. This process typically involves
    averaging the pixel colors at the boundaries to create a smoother transition between
    edges.

    - Pixel Processing: It adjusts the color of the pixels along the edges of shapes
    within the image. By blending the colors of these edge pixels with their surrounding
    pixels, the function reduces the contrast that leads to the perception of jagged
    edges.


    #### Usage Example

    ```

    1 // Example of applying anti-aliasing to an image

    2 applyAntiAliasing(); // The entire image now has smoother edges

    ```


    Figure 119


    #### Remarks

    This function is essential in graphics rendering and digital image processing,
    where the presence of jagged edges can detract from the visual appeal and realism
    of images.


    Anti-aliasing is crucial in preparing images for high-quality presentations, print
    media, or any other applications where image clarity and smoothness are desired.


    The `applyAntiAliasing` method is a fundamental tool in image processing, improving
    the aesthetics of digital images by reducing the harshness of pixelated edges.


