    \ 使用混合后的颜色分量构建一个新的 `Pixel` 对象。\n\n#### 实际应用\n\n- **透明度与叠加**：是实现图像透明度的理想选择，允许创建前景图像或颜色混合到背景中的叠加效果。\n\
    - **抗锯齿与平滑处理**：在抗锯齿中非常有用，通过混合边缘处的颜色来创建更平滑的过渡，减少线条和曲线的锯齿感。\n- **艺术效果**：能够创建各种艺术效果，如软阴影、光晕或数字绘画应用中的颜色混合。\n\
    \n#### 使用示例\n\n考虑一种场景：你想要在蓝色背景上叠加一层半透明的红色。通过调用 `blendColors`，将蓝色作为 `colorbackground`，红色作为\
    \ `colorforeground`，并将 alpha 值设置为 0.5，该函数将返回紫色，有效地平均混合了红色和蓝色。\n\n### 深入理解 `ppmpp.hpp`\
    \ 中的 `setHSV` 和 `getHSV` 函数\n\n#### `setHSV` 函数\n\n**目的**：将 HSV 颜色值转换为 RGB 模型并将这些值设置到给定的\
    \ `Pixel`。\n\n**实现细节**：函数首先检查饱和度 (s) 是否为 0（意味着灰度颜色），并根据亮度 (v) 将 `Pixel` 设置为相应的灰色深浅。\n\
    \n然后调整色调 (h) 以使其处于 0-360 度范围内，并将其转换为 0-6 范围，以确定 RGB 转换的分段。\n\n函数根据分段使用 HSV 转 RGB\
    \ 的转换公式计算 RGB 值。这涉及到根据色调在其所在分段内的位置，在两个 RGB 分量之间进行线性插值。\n\n**使用场景**：当你拥有 HSV 格式的颜色数据（对人类感知通常更直观）并且需要将其转换为\
    \ RGB 格式以进行需要 RGB 值的操作（例如在大多数显示器上渲染）时，使用 `setHSV`。\n\n#### `getHSV` 函数\n\n**目的**\n\
    \n从给定 `Pixel` 的 RGB 颜色表示中提取 HSV 值。\n\n**实现细节**：函数首先从 `Pixel` 中提取 RGB 值。\n\n计算\
    \ RGB 分量中的最小值和最大值，以确定亮度 (v) 和范围 (delta)。\n\n根据 delta 和最大值计算饱和度 (s)。如果最大值为 0（表示为黑色），则将饱和度设为\
    \ 0。\n\n根据哪个 RGB 分量具有最大值来计算色调 (h)，并调整公式以找到正确的色调角度。\n\n**使用场景**：当你需要根据色调、饱和度或亮度水平来操作图像或颜色时，`getHSV`\
    \ 很有用——这些任务在 HSV 颜色空间中通常更简单直接。\n\n#### 实际应用\n\n- **图形设计与图像处理**：这些函数在需要根据人类色彩感知进行颜色调整的应用中（如照片编辑软件或调色器）起着关键作用。\n\
    - **数据可视化**：它们也适用于根据值或强度生成颜色渐变的场景（如热力图）。\n- **艺术与动画**：艺术家和动画师可以使用这些函数来创建更自然、更直观的颜色过渡和效果。\n\
    \n***\n\n## PPMPP: 图像处理函数参考\n\n### `void setPixel(int xCoord, int yCoord, const\
    \ Pixel& newPixel)`\n\n#### 目的\n\n`setPixel` 函数用于将图像中特定像素的颜色设置为新值。\n\n#### 参数\n\
    \n- `int xCoord`：要设置的像素的 x 坐标。\n- `int yCoord`：要设置的像素的 y 坐标。\n- `const Pixel&\
    \ newPixel`：像素的新颜色，用 `Pixel` 对象表示（由三个双精度浮点数的元组，每个值代表颜色的红、绿、蓝分量）。\n\n#### 功能\n\n\
    - **边界检查**：函数首先检查指定的坐标 (`xCoord` 和 `yCoord`) 是否在图像边界内。这通过比较 `xCoord` 与 `0` 和 `m_width`，以及\
    \ `yCoord` 与 `0` 和 `m_height` 来确定。\n- **像素更新**：如果坐标在范围内，函数使用 `getIndex` 函数在 `m_img`\
    \ 向量（存储图像数据）中计算这些坐标对应的索引。确定索引后，函数使用 `newPixel` 提供的颜色更新该索引处的像素。\n\n#### 使用示例\n\n\
    ```\nImage myImage(100, 100); // 创建一个 100x100 像素的图像\nPixel redColor = std::make_tuple(1.0,\
    \ 0.0, 0.0); // 创建红色\nmyImage.setPixel(50, 50, redColor); // 将 (50, 50) 处的像素设置为红色\n\
    ```\n\n图 99\n\n#### \n\n函数确保像素坐标在图像范围内，防止访问 `m_img` 向量时可能发生的越界错误。\n\n该方法是图像编辑操作的基础，因为它允许操作数字图像的基本单位——单个像素。\n\
    \n***\n\n### `void getAngledLine(Coord& lineCoords, const Point& center, double\
    \ degrees, int length)`\n\n#### 目的\n\n`getAngledLine` 函数根据起始点、角度和长度计算线段的坐标。该函数确定从给定点开始并按指定角度延伸一定长度的线的终点坐标。\n\
    \n#### 功能\n\n"
