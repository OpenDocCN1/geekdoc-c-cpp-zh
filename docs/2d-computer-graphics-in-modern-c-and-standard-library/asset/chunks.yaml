    ### Advanced Techniques: Dynamic Triangle Patterns


    As an advanced topic, we explore creating dynamic triangle patterns, where properties
    like size, color, or orientation change over time or in response to user input.
    This introduces the concepts of animation and interactivity in the context of
    geometric rendering.


    ### About the code


    The `19_triangle_grid.cpp` program, written in C++, uses the `ppmpp.hpp` graphics
    library to create a grid of triangles on an image, each filled with the average
    color of the corresponding area on another image. This program demonstrates a
    creative way to use geometric shapes and color averaging to create a visually
    appealing transformation of an image.


    Firstly, the program includes necessary headers and the `ppmpp.hpp` library, which
    is essential for image processing. The `averageTriangleColor` function is a critical
    component of this program. It calculates the average color within a given triangle
    on the image. This function works by iterating over the pixels within the triangle,
    summing up their red, green, and blue values, and then dividing these sums by
    the total number of pixels to get the average color. This process involves sorting
    the triangle’s vertices and using an efficient scanline algorithm to iterate over
    the triangle’s area, ensuring that every pixel within the triangle is considered.


    In the `main` function, the program starts by loading an image (named `19_photo.ppm)`
    and creating a new image of the same size. The new image’s pixels are initially
    set to the average color of the entire source image. The program then divides
    the image into a grid, with the number of cells in the grid determined by the
    `gridSize` variable.


    For each cell in the grid, the program calculates the coordinates of the vertices
    of two triangles that divide the cell into two equal parts. These triangles are
    then filled with the average color of their corresponding area in the source image.
    This is achieved by calling each triangle’s `averageTriangleColor` function to
    determine its average color and then using the `drawFilledTriangle` function to
    draw the triangle on the new image.


    Finally, after processing the entire grid, the program writes the resulting image
    to a file named `19_triangle_grid.ppm.` The output is a fascinating transformation
    of the original image, where each grid cell is represented by two triangles, each
    filled with the average color of the corresponding area in the source image. This
    technique creates a unique mosaic-like effect, showcasing an interesting blend
    of geometric patterns and color averaging in image processing.


