    ## What?


    Let’s delve deeper into the extensive features and capabilities of the `Modern
    C++20` framework.


    ### Exploring the Fundamental Types in ppmpp.hpp


    The `ppmpp.hpp` framework introduces several fundamental types that form the backbone
    of its image processing capabilities. These types are carefully designed to represent
    key elements in graphics manipulation, ensuring both precision and ease of use.


    #### Pixel: The Color Representation


    The `Pixel` type is a cornerstone of the framework, defined as `std::tuple<double,
    double, double>.` Each `Pixel` instance represents a color, with the tuple holding
    three `double` values corresponding to the color’s red, green, and blue (RGB)
    components. This high-precision representation allows for a vast spectrum of colors,
    facilitating accurate color manipulation and rendering. The use of `double` for
    color values provides greater control over color gradients and transitions, essential
    for detailed image processing tasks.


    #### Coord: Specifying Geometric Coordinates


    The `Coord` type is `std::tuple<int, int, int, int>,` representing a set of coordinates
    within the image. Typically, this type defines the start and end points of lines
    or the boundaries of shapes. For example, in a line-drawing function, the first
    two integers might represent the starting point (x1, y1), and the latter two represent
    the line’s ending point (x2, y2). This type is integral for geometric manipulations,
    allowing for precise placement and transformation of shapes and lines within the
    image canvas.


    #### Point: A Simple Coordinate Pair


    The `Point type,` defined as `std::tuple<int, int>,` is a simplified version of
    `Coord,` representing a single point in 2D space with an x and y coordinate. It
    is particularly useful in scenarios where only a reference point is needed, such
    as marking a specific location on an image or defining a center point for circular
    shapes. The Point type is a fundamental building block in image processing, providing
    a straightforward way to handle individual points in various graphic operations.


    These types, `Pixel,` `Coord,` and `Point,` are not just data structures but are
    central to the framework’s design philosophy, ensuring that complex image processing
    operations can be conducted with clarity and efficiency. Their implementation
    facilitates various applications, from basic pixel manipulation to advanced graphic
    transformations.


