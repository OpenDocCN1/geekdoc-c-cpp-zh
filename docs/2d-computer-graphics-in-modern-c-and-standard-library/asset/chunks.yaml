    \n箭头经常用于函数符号中。在其他几个领域你也可能看到它们。\n\n#### Material implication（实质蕴含）\n\n诸如大写 `r`\
    \ 的右箭头和小写右箭头有时用于逻辑学中表示实质蕴含。也就是说，如果 `A` 为真，那么 `B` 也为真。\n\n![](img/math_38.png)\n\
    \n图 212\n\n在 C++ 中：\n\n```cpp\n 1 // From Paper to Code\n 2 // Arrows - material\
    \ implication\n 3 // Run with: https://www.jdoodle.com/online-compiler-c++17/\n\
    \ 4 // LaTeX: A \\Rightarrow B\n 5 // Test LaTeX: https://quicklatex.com/\n 6\
    \ #include <iostream>\n 7 #include <cassert>\n 8 \n9 int main() {\n10     bool\
    \ a=true;\n11     bool b=true;\n12 \n13     if (a == true) {\n14         assert(b\
    \ == true);\n15     }\n```\n\n图 213\n\n在这里我们使用 `assert` 来确保 `a` 和 `b` 都为真（如果不为真会报错）。箭头可以指向任何方向：左箭头、右箭头或双向。当\
    \ `A` 指向 `B` 且 `B` 指向 `A` 时，它们被认为是等价的。\n\n![](img/math_39.png)\n\n图 214\n\n####\
    \ Equality（等号）\n\n在数学中，小于、大于、小于等于和大于等于的使用方式通常与代码中的方式相同。分别对应如下。在 C++ 中：\n\n```cpp\n\
    \ 1 // From Paper to Code\n 2 // Arrows - equality\n 3 // Run with: https://www.jdoodle.com/online-compiler-c++17/\n\
    \ 4 // LaTeX: https://www.geforgeeks.org/inequalities-in-latex/\n 5 // Test LaTeX:\
    \ https://quicklatex.com/\n 6 #include <iostream>\n 7 \n8 int main() {\n9    \
    \ if (50 > 2) std::cout << \"50 is greater then 2.\" << std::endl;\n10    if (2\
    \ < 10) std::cout << \"2 is less then 10.\" << std::endl;\n11    if (3 <= 4) std::cout\
    \ << \"3 is less then to 4.\" << std::endl;\n12    if (4 >= 4) std::cout << \"\
    4 is greater then to 4.\" << std::endl;\n13 }\n```\n\n图 215\n\n你可能会在少数情况下看到斜线符号来表示“不”。例如\
    \ `k` 不大于 `j`。\n\n![](img/math_40.png)\n\n图 216\n\n左双箭头和右双箭头有时表示不等。`k` 在数量级上大于\
    \ `j`。在数学中，数量级是非常具体的，不仅仅是差异。\n\n![](img/math_41.png)\n\n图 217\n\n在 C++ 中：\n\n\
    ```cpp\n 1 // From Paper to Code\n 2 // Arrows - order of magnitude\n 3 // Run\
    \ with: https://www.jdoodle.com/online-compiler-c++17/\n 4 // LaTeX: k \\gg j\n\
    \ 5 // Test LaTeX: https://quicklatex.com/\n 6 #include <iostream>\n 7 #include\
    \ <cmath>\n 8 \n9 double orderOfMagnitude(double n)\n10 {\n11     return trunc(log10(n));\n\
    12 }\n13 \n14 int main() {\n15     double k=1000.0;\n16     double j=0.001;\n\
    17 \n18     if (orderOfMagnitude(k) > orderOfMagnitude(j)) {\n19         std::cout\
    \ << \"k is in of magnitude larger than j.\" << std::endl;\n20     }\n21 }\n```\n\
    \n图 218\n\n在这里通过对 `n` 取 `log10` 然后对结果使用 `trunc` 来检查数量级。`log10` 和 `trunc` 函数都是标准库头文件\
    \ `cmath` 的部分。运行代码我们得到 `k` 等于 `3` 而 `j` 等于 `-3`。因此，`k` 在数量级上大于 `j`。\n\n#### Conjunction\
    \ and Disjunction（合与与析取）\n\n逻辑中箭头的另一种用法是合与析取。它们分别类似于程序员的 `AND` 和 `OR` 运算符。\n\n\
    ![](img/math_42.png) AND OR\n\n一个合取的示例。\n\n![](img/math_43.png)\n\n图 219\n\n在\
    \ C++ 中：\n\n```cpp\n 1 // From Paper to Code\n 2 // Arrows - conjunction & disjunction\n\
    \ 3 // Run with: https://www.jdoodle.com/online-compiler-c++17/\n 4 // LaTeX:\
    \ k > 2 \\land k < 4 \\Leftrightarrow k = 3\n 5 // Test LaTeX: https://quicklatex.com/\n\
    \ 6 #include <iostream>\n 7 #include <cassert>\n 8 \n9 int main() {\n10     int\
    \ k=3;\n11 \n12     if (k > 2 && k < 4) {\n13         assert(k == 3);\n14    \
    \ }\n15 }\n```\n\n图 220\n\n我们使用 `assert` 来验证 `k` 大于 `2` 且 `k` 小于 `4`。`assert`\
    \ 显式断言 `k` 等于 `3`。如所示，双方是等价的。\n\n在 C++ 中：\n\n```cpp\n 1 // From Paper to Code\n\
    \ 2 // Arrows - conjunction & disjunction\n 3 // Run with: https://www.jdoodle.com/online-compiler-c++17/\n\
    \ 4 // LaTeX: k > 2 \\land k < 4 \\Leftrightarrow k = 3\n 5 // Test LaTeX: https://quicklatex.com/\n\
    \ 6 #include <iostream>\n 7 #include <cassert>\n 8 \n9 int main() {\n10     int\
    \ k=3;\n11 \n12     if (k == 3) {\n13         assert(k > 2 && k < 4);\n14    \
    \ }\n15 }\n```\n\n图 221\n\n它是反过来验证的。向下箭头是逻辑析取，类似于 `OR` 运算符。\n\n![](img/math_44.png)\
