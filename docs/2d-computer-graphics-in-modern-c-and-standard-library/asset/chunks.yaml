    ### void applyBloom(double threshold, double sigma)


    #### Purpose

    The `applyBloom` function is designed to add a bloom effect to the image, a common
    technique in graphics processing that creates a soft glow around bright areas.
    This function uses a specified threshold to identify bright areas and applies
    a Gaussian blur characterized by the sigma value to create the bloom effect.


    #### Parameters

    `double threshold`: A value determining the brightness threshold for applying
    the bloom effect. Pixels brighter than this threshold will contribute to the bloom.

    `double sigma`: The standard deviation of the Gaussian blur applied to create
    the bloom effect. A higher sigma value results in a softer, more spread-out glow.


    #### Functionality

    - Brightness Identification: The function identifies pixels that exceed the specified
    brightness threshold in the image. These pixels are the source of the bloom effect.

    - Gaussian Blur Application: Internally, it is called `applyBloomImpl`, which
    applies a Gaussian blur to the bright areas. The extent of the blur is determined
    by the sigma value, affecting the softness and spread of the bloom effect.

    - Bloom Effect Creation: The blurred bright areas are combined with the original
    image, creating a glow effect around these areas.


    #### Usage Example

    ```

    1 // Example of applying a bloom effect to an image

    2 double brightnessThreshold = 0.7; // Threshold for brightness

    3 double blurSigma = 5.0; // Sigma for Gaussian blur

    4 applyBloom(brightnessThreshold, blurSigma); // Applying the bloom effect

    ```

