    ## Direct Pixel Manipulation Functions


    These functions allow direct modification of the color components of a pixel:
    `setRedColorElement()`, `setGreenColorElement()`, `setBlueColorElement()`: These
    functions provide a way to directly set the red, green, or blue component of a
    pixel, either using floating-point or integral values. They are crucial for operations
    that require direct manipulation of pixel colors, such as image editing or filter
    applications.


    ## Exploring Color Helper Functions in ppmpp.hpp


    The `ppmpp.hpp` framework offers a set of color helper functions extending its
    color manipulation capability, which is essential for advanced image processing
    and graphic design tasks. These functions focus on color blending and color space
    conversions, providing versatile tools for artists and developers.


    ### Color Blending Function


    `blendColors(Pixel &colorbackground, Pixel &colorforeground, float alpha)`: This
    function is a cornerstone for creating composite images and effects. Based on
    an alpha value, it blends two colors – a background and a foreground color. The
    alpha parameter determines the opacity of the foreground color, allowing for seamless
    blending. This is particularly useful in creating translucent overlays, anti-aliasing,
    or mixing colors to achieve a desired visual effect.


    ### Color Space Conversion Functions


    `getHSV(double& h, double& s, double& v, const Pixel& px)`: This function converts
    a color from its RGB representation to the HSV (Hue, Saturation, Value) color
    space. The HSV color model is often more intuitive for human perception, making
    adjusting brightness, saturation, or hue shifts easier. This function is vital
    for applications like color correction, artistic filters, or any scenario requiring
    more human-centric color manipulation.


    `setHSV(double h, double s, double v, Pixel& px)`: The counterpart to `getHSV()`,
    this function takes hue, saturation, and value parameters and converts them back
    to an RGB representation in the `Pixel` format. This is particularly useful for
    applying changes made in the HSV space to an image or graphic that operates primarily
    in RGB, such as rendering the final output or interfacing with other graphic systems.


    ## Exploring Constructors and Operators of the Image Class in ppmpp.hpp


    The `Image` class in the `ppmpp.hpp` framework is designed with a comprehensive
    set of constructors and operators, ensuring flexibility and ease of use in image
    manipulation and processing.


    ### Constructors


    `Image()`: Initializes an empty image. This constructor is useful when an `Image`
    object must be declared without immediately assigning any specific data or dimensions.


    `Image(int width, int height)`: Creates an image with specified dimensions. This
    constructor is essential for initializing an image with a predetermined size,
    providing a canvas for drawing or image processing.


    `explicit Image(std::string const& filename)`: Constructs an image by loading
    data from a specified file. This is particularly useful for working with existing
    images, allowing users to load and process images from the file system.


    ### Copy Constructor and Assignment Operator


    `Image(const Image& other)`: Creates a new `Image` instance as a copy of an existing
    one. This is vital for scenarios where an exact duplicate of an image is needed
    without affecting the original.


    `Image& operator=(const Image& other)`: Enables assigning one `Image` object to
    another, replacing its contents with those of the other object. This operator
    is crucial for straightforwardly copying image data.


    ### Move Constructor and Assignment Operator


    `Image(Image&& other) noexcept`: Facilitates the transfer of an image from one
    object to another without copying the actual data, enhancing performance, especially
    for large images.


    `Image& operator=(Image&& other) noexcept`: Similar to the move constructor, this
    operator transfers image data from one object to another, freeing up resources
    efficiently and ensuring optimal memory usage.


    ### Comparison Operators


    `friend bool operator==(const Image& lhs, const Image& rhs)`: Checks if two `Image`
    instances are equivalent, i.e., they have the exact dimensions and pixel data.
    This is useful for validating image processing results or checking if two images
    are identical.


    `friend bool operator!=(const Image& lhs, const Image& rhs)`: The opposite of
    the equality operator, it checks if two `Image` instances are different in terms
    of dimensions or pixel data. This can be useful in scenarios where image changes
    or differences need to be detected.


    ## Exploring the Public Methods of the Image Class in ppmpp.hpp


    The `Image` class offers a comprehensive set of public methods, each tailored
    for specific image manipulation tasks:


    ### Basic Image Manipulation Methods


    `resize()`, `setWidth()`, and `setHeight()`: These methods provide fundamental
    control over the image’s dimensions, allowing users to resize images according
    to their needs.


    `getWidth()`, `getHeight()`: Retrieve the current dimensions of the image, useful
    for calculations and conditional operations based on size.


    ### Pixel Manipulation Methods


    `setPixel()`, `getPixel()`: Directly manipulate individual pixels, setting or
    retrieving their color. It is essential for drawing, editing, or analyzing images
    at the pixel level.


    `setAllPixels()`: Uniformly sets the color of all pixels in the image, useful
    for initializing backgrounds or applying color filters.


    `setImage()`, `getImage()`: Assign a new image data or retrieve the current data,
    enabling more complex image processing and transformations.


    ### Drawing and Shape Methods


    `drawLine()`, `getAngledLine()`: Draw straight or angled lines, fundamental for
    creating basic graphics or annotations.


    `drawBezierQuadratic()`, `drawBezierCubic()`: Render Bezier curves, crucial for
    creating smooth curves and complex shapes.


    `drawRectangle()`, `drawFilledRectangle()`: Create rectangles and filled rectangles,
    a basic yet versatile tool for graphical layouts and designs.


    `drawCircle()`, `drawFilledCircle()`, `drawWedge()`, `drawFilledWedge()`: Draw
    circular shapes and segments important for pie charts, graphs, or decorative elements.


    `drawTriangle()` and `drawFilledTriangle()`: Render triangles are fundamental
    geometric shapes with numerous applications in graphic design.


    `drawRotatedRectangle()`, `drawFilledRotatedRectangle()`, `drawRotatedEllipse()`,
    `drawFilledRotatedEllipse()`, `drawRotatedPolygon()`, `drawFilledRotatedPolygon()`:
    These methods enable the creation of rotated geometric shapes, adding dynamism
    and variety to graphical compositions.


    ### Advanced Image Processing Methods


    `getAverageRgbOfImage()`: Calculate the image’s average color, which is useful
    for color analysis or generating thumbnails.


    `convertToGrayscale()`, `applyGaussianBlur()`, `applyAntiAliasing()`: Apply essential
    image processing techniques like grayscale conversion, blurring, and anti-aliasing,
    which are crucial for creating artistic effects or enhancing image quality.


    `downscale()`, `upscale()`: Resize the image with specific algorithms, which are
    vital for adapting images to different resolutions while maintaining quality.


    `applyBloom()`, `applyLens()`: Implement advanced visual effects like bloom or
    lens effects, enhancing the visual appeal of images.


    `drawGradients()`: Create gradient effects, a key feature for backgrounds, buttons,
    or visual indicators.


    ### File I/O Methods


    `read()`, `write()`: Load and save images in PPM P6 format, ensuring compatibility
    and ease of data exchange with external sources and tools.


