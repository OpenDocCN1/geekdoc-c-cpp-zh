    ## 使用标准库绘制矩形


    矩形是一个闭合二维形状，具有四条边和四个直角（90°）。矩形的对对边是相等且平行的。由于矩形是二维形状，它由宽度和高度刻画。你需要 `X` 和 `Y` 配合矩形的
    `width` 和 `height`。


    C++ 代码生成包含两个矩形的图像（一个是轮廓，一个是填充的），保存为 PPM 文件。代码由几个函数组成，每个函数都有特定用途：创建和处理图像。


    代码中的前几个函数用于图像处理。`get_index` 函数根据给定的 (x, y) 坐标计算一维向量表示中的像素索引。`calc_size` 函数根据宽度和高度计算尺寸，`clear_image`
    函数用白色像素填充图像向量（R=1.0, G=1.0, B=1.0）。


    接下来，有在图像上绘制形状的函数。`draw_line` 函数使用 Bresenham 线条算法在图像两个点之间绘制线条，这是在栅格格上绘制线条的高效方法。`draw_rect`
    函数通过 `draw_line` 函数连接四个角来绘制轮廓矩形。另一方面，`draw_filled_rect` 函数通过遍历矩形区域并设置矩形内部每个像素的颜色来绘制填充矩形。


