    \n准确计算旋转后新顶点的位置对于保持多边形的正确形状和方向至关重要。\n\n`drawFilledRotatedPolygon` 方法扩展了库的功能，允许创建更复杂且具有艺术趣味的设计，包括填充且旋转的多边形元素。\n\
