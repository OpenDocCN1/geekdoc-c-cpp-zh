    ![](resources/Introduction.jpg)


    Figure 1


    # 2D Drawing Basics


    We have all been there when you want to present some data nicely and graphically.
    You start by implementing a GUI library so that you can set up a canvas to draw
    on… but then what? Or you can download and build a library that can handle reading
    and writing PNG images, as you need lossless images. Or you do the same to find
    out a file’s entropy. Or you’re coding on a game and want to test the look of
    animation sprites in a parallax setting. Whatever the reason is… it’s too complicated
    to do and takes longer than you would consider doing. So, no presentation, no
    collaboration, and no investigation using graphics.


    It should just be easy to create graphics in standard `C++. And this book is all
    about that. How do we draw a pixel, a line, or a circle? Those are questions we
    are going to answer.


    ## History


    2D drawings with computers started in academia, as most things are computer-related.
    It was first created as a visualization tool for scientists and engineers in the
    US government and US corporate research centers such as Bell Labs and Boeing in
    the 1950s. Later, the tools would be developed at universities in the ’60s and
    ‘70s, such as Ohio State University, MIT, University of Utah, Cornell, North Carolina,
    and the New York Institute of Technology. The early breakthroughs in academic
    centers continued at research centers such as the famous Xerox PARC in the 1970s.
    These efforts broke into broadcast video graphics and major motion pictures in
    the late 70¹s and early 1980s. Computer graphic research continues today worldwide,
    now joined by entertainment and production companies’ research and development
    departments.


    Since 1974, ACM SIGGRAPH has become an international community of researchers,
    artists, developers, filmmakers, scientists, and business professionals interested
    in computer graphics and interactive techniques. Each year, the latest and greatest
    of this research is presented.


    ## Standard Library


    There needs to be more support for drawing in the Standard Library. There is no
    media support whatsoever in the Standard Library. And there is no need to. With
    the tools available to us, we will be able to draw pixels, lines, and circles.


    ## Compile Code Examples


    All code is compiled using `Clang++` but works fine with `G++. Everything is `C++20`.


    ## Prerequisite


    You’ll need to know how to program in `C++` already. This book is about how to
    draw rather than how to program.


    If you find the beginning to be too easy, then jump ahead to chapter ‘Advanced
    Examples’


    ### Download the source code


    ![The source code is included in the extras, that is available here:](resources/sourcecode.jpg)


    Figure 2. The source code is included in the extras, that is available here:


    Compile all examples using: `./build_and_run_all.sh`


    * * *


    # Draw Pixels with Standard Library


    We’re using RGB elements to draw a pixel in `C++.` To handle RGB elements as one
    unit for convenience, there is something called `std::tuple.`


    Reference: [https://en.cppreference.com/w/cpp/utility/tuple](https://en.cppreference.com/w/cpp/utility/tuple)
    e.g., a function that takes three integers as input and returns it as a tuple


    `01_tuples.cpp` demonstrates the usage of `std::tuple` in `C++20.` It uses a tuple
    to store and manipulate RGB color elements as a single entity. The code includes
    the `<tuple>` and `<iostream>` headers and defines a function `get_rgb_elements_as_a_tuple`
    that takes three integers (`r,` `g,` and `b)` and returns a tuple containing these
    integers.


    The `main` function initializes three sets of RGB values (`r1,` `g1,` `b1,` `r2,`
    `g2,` `b2,` and `r3,` `g3,` `b3).` Initially, only the first set (`r1,` `g1,`
    `b1)` is given values, while the other two sets are initialized to `0.`


    The code then prints the initial RGB values of all three sets. Next, it calls
    `get_rgb_elements_as_a_tuple` with the first set of RGB values (`r1,` `g1,` `b1)`
    and assigns the returned tuple to `RGB.`


    Two different methods are then used to `unroll` the tuple into the other two sets
    of RGB values:


    1. `unroll #1:` Using `std::get` to access individual elements of the tuple by
    index and assigning them to `r2,` `g2,` and `b2.`


    2. `unroll #2:` Using `std::tie` to unpack the tuple into `r3,` `g3,` and `b3.`


    After each unroll, the RGB values of all three sets are printed to verify that
    the tuple has been correctly unpacked into the second and third sets of RGB values.


    take a look in source_code.zip: `01_tuples.cpp`


    Now, we know how to store and unroll a tuple of RGB elements. Let’s talk about
    adding rgb tuples to an image — to set a pixel where we want it to be in the image.


    But before that, we need to discuss how computer memory (`1D)` is physically represented
    and the representation of an image. To know where to store the tuple, we must
    translate (`2D)` into (`1D).` Store the pixel at a certain `x` and `y`


    ![](img_grid.jpg


    `index = width * y`


    Figure 3


    `X + width * Y = 32`


    `Index = 32`


    Let’s create a function that handles the index calculations for us. A function
    that takes `X` and `Y` as input and returns the index.


    Or, take a look in sourcecode.zip: `02_index.cpp`


    Besides calculating the index, we need to know how many tuples we need to store
    in a `std::vector` for a defined `width` and `height.` For instance, an image
    that has a width of `640` and a height of `360` is `230400)` in size for a `std::vector`
    with those dimensions.


    Reference: [https://en.cppreference.com/w/cpp/container/vector](https://en.cppreference.com/w/cpp/container/vector)
    As always, we need to include the header: `#include <vector>.`


    To set the vector container size, we calculate it by multiplying the image width
    by the `height.` We use the `Resize function` in `std::vector` to set the size
    of the vector. Then we can use the vectors `operator[]` and `operator=` for index
    and assigns.


    Also, why not assign black to all the pixels while we are at it as a clear image
    function?


    For the source code, take a look in sourcecode.zip: `03_calcsize.cpp`


    **Note** that this code example uses double for the RGB elements. The red, green,
    and blue are double numbers between `0.0` and `1.0,` not an integer between 0
    - 255\. Enough with the calculations of the image metadata. It’s time to draw
    some pixels and save them into a text file. Yes, there are a few text-based image
    formats. We will use ``The PPM file format in this book. The graphics format comes
    from the open-source Netpbm project with several graphics programs and a programming
    library — used mainly in the Unix world. PPM stands for Portable PixMap format
    and is portable because it is written as ASCII (Type: P3`).`` A PPM file consists
    of two parts: a header and the image data. Don’t worry about it being ASCII; PPM
    can be converted to PNG, JPG, or any other format. Here’s what the PPM format
    looks like as ASCII:

