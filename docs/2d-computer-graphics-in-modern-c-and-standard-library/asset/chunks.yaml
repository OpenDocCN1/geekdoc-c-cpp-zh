    ## 没有直线曲线，只有曲线线条


    贝塞尔曲线是一种参数曲线。贝塞尔曲线有三种类型：


    *   线性贝塞尔曲线

    *   二次贝塞尔曲线

    *   三次贝塞尔曲线


    线性插值是一种数学函数，它在线性比例尺上的某一点返回两个值之间的值。最常用的是用于移动或改变值。通过 C++20 中的 `std::lerp`（线性插值）函数，我们可以使用线性、二次和三次贝塞尔曲线绘制曲线（利用
    `std::lerp` 的嵌套，因为它们是相互构建的）。


    参考：[`en.cppreference.com/w/cpp/numeric/lerp`](https://en.cppreference.com/w/cpp/numeric/lerp)


