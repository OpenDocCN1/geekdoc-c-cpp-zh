    \n集合 `X = {X_1, X_2, …, X_n}` 的方差数学公式表示如下：\n\n```latex\n\\begin{align*}\nX = \\\
    {X_{1},X_{2},…,X_{n} \\};\nvar(X) = \\frac{1}{|x|²} \\sum_{x \\epsilon X} \\sum_{x\
