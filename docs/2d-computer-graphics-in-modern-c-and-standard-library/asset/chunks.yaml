    - `const Pixel& px:` 椭圆的填充颜色，表示为 `Pixel` 对象（一个包含红、绿、蓝分量的三个双精度数的元组）。


    #### 功能


    - **中心、形状与旋转定义**：函数使用 `x,` `y,` `w,` `h,` 和 `angle` 参数建立椭圆的中心位置、尺寸和旋转角度。

    - **绘制与旋转算法**：它内部调用 `drawRotatedEllipseImpl,`，该函数实现了绘制和填充按指定角度旋转椭圆的算法。这包括计算由于旋转导致的椭圆边界的变换坐标并填充形状。

    - **颜色应用**：旋转椭圆的整个区域用 `px,` 着色，产生一个实色的旋转椭圆形状。


    #### 使用示例


    ```

    1 // 绘制旋转椭圆的示例

    2 int centerX = 250; // 中心 X 坐标

    3 int centerY = 150; // 中心 Y 坐标

    4 int width = 100;   // 宽度为 100 单位

    5 int height = 60;   // 高度为 60 单位

    6 double rotationAngle = 45.0; // 旋转 45 度

    7 Pixel ellipseColor = std::make_tuple(1.0, 0.0, 0.0); // 红色

    8 drawRotatedEllipse(centerX, centerY, width, height, rotationAngle, ellipseColor);

    9 // 绘制旋转的红色椭圆

    ```


