    `std::mt19937` is a C++ standard library implementation of the Mersenne Twister
    pseudorandom number generator (PRNG) algorithm. The name “mt19937” is derived
    from the Mersenne Twister using a Mersenne prime number, `2^19937 - 1`, as the
    basis for its internal state. This PRNG is widely used for its high-quality random
    number generation, significant period, and efficient performance. Mersenne Twister
    is a popular choice for various applications, including simulations, statistical
    modeling, and computer games, where high-quality random numbers are needed.


    The `std::mt19937` generator is part of the C++11 `<random>` header or newer,
    which provides a comprehensive suite of random number generation facilities. This
    header includes the Mersenne Twister and other random number generators, probability
    distributions, and other utility functions for generating random numbers. The
    `<random>` library is designed to offer a more versatile and flexible approach
    to random number generation compared to older C++ functions like `rand()` and
    `srand()`.

