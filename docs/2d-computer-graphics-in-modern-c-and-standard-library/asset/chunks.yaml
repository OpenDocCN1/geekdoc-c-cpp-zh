    #### 参数

    无。


    #### 功能

    - 抗锯齿算法：该函数在内部调用 `applyAntiAliasingImpl`，该实现实现了抗锯齿算法。此过程通常涉及边界像素颜色的平均化，以在边缘之间创建更平滑的过渡。

    - 像素处理：它调整图像中形状边缘像素的颜色。通过将这些边缘像素的颜色与其周围像素混合，该函数减少了导致锯齿感的对比度。


    #### 使用示例

    ```

