    ## 指南


    1. 封面


    ![](img/Introduction.jpg)


    图 1


    # 2D 绘制基础


    我们都经历过这种情况：当你想要以美且图形化的方式展示某些数据时。你开始实现一个 GUI 库，以便设置一个用于绘制的画布……但然后呢？或者你可以下载并构建一个可以处理读写
    PNG 图像的库，因为你需要无损图像。或者你同样的操作是为了寻找文件的熵。或者你正在编写一个游戏，想在视差设置中测试动画帧精灵的外观。无论原因是什么……做起来都太复杂了，花费的时间比你考虑要做的要长得多。因此，没有展示，没有协作，也没有使用图形进行研究。


    在标准 `C++` 中创建图形应该是容易的。这本书正是关于这一点的。我们该如何绘制一个像素、一条线或一个圆？这些都是我们将回答的问题。


    ## 历史


    计算机 2D 绘制始于学术界，因为大多数事情与计算机有关。它最初是于 20 世纪 50 年代作为美国政府的科学家和工程师以及美国公司研究中心（如贝尔实验室和波音）的可视化工具创建的。随后，这些工具在
    60 年代和 70 年代的大学得到了开发，例如俄亥俄州立大学、麻省理工学院（MIT）、犹他大学、康奈尔大学、北卡罗来纳大学和纽约技术学院。学术中心的早期突破持续在
    20 世纪 70 年代著名的罗西思 PARC 等研究中心继续。这些努力在 70 年代后期和 80 年代初进入了广播视频图形和大型长片电影。计算机图形研究今天在全球范围内继续，现在加入了娱乐和制作公司的研发部门。


    自 1974 年以来，ACM SIGGRAPH 已成为一个由研究人员、艺术家、开发者、电影制作人、科学家和商务人士组成的国际社区，他们对计算机图形和交互技术感兴趣。每年都会展示该研究领域最新、最出色的成果。


    ## 标准库


    标准库需要对绘制更多的支持。标准库中完全没有媒体支持。而且也没有必要。通过我们现有的工具，我们将能够绘制像素、线条和圆。


    ## 编译代码示例


    所有代码均使用 `Clang++` 编译，但在 `G++` 下也能良好运行。一切都是 `C++20`。


    ## 前提条件


    你已经需要如何用 `C++` 编程。这本书是关于如何绘制，而不是如何编程。


    如果你觉得开头太简单，请直接跳到“高级示例”章节。


    ### 下载源代码


    ![源代码包含在附件中，可以在此处获取：](img/sourcecode.jpg)


    图 2. 源代码包含在附件中，可以在此处获取：


    使用以下命令编译所有示例：`./build_and_run_all.sh`


    * * *


    # 使用标准库绘制像素


    我们正在使用 RGB 元素在 `C++` 中绘制一个像素。为了方便将 RGB 元素作为一个单元处理，有一种叫做 `std::tuple` 的东西。


    参考地址：[`en.cppreference.com/w/cpp/utility/tuple`](https://en.cppreference.com/w/cpp/utility/tuple)
    例如，一个接受三个整数作为输入并将其作为元组返回的函数


    `01_tuples.cpp` 演示了 `std::tuple` 在 `C++20` 中的用法。它使用元组来存储和操作 RGB 颜色元素作为单个实体。代码包含了
    `<tuple>` 和 `<iostream>` 头文件，并定义了一个函数 `get_rgb_elements_as_a_tuple`，它接受三个整数（`r,`
    `g,` 和 `b)`）并返回一个包含这些整数的元组。


    `main` 函数初始化了三组 RGB 值（`r1,` `g1,` `b1,` `r2,` `g2,` `b2,` 以及 `r3,` `g3,` `b3)`）。初始时，只给第一组（`r1,`
    `g1,` `b1)`）赋值，而另外两组初始化为 `0`。


    代码随后打印所有三组的初始 RGB 值。接下来，它用第一组 RGB 值（`r1,` `g1,` `b1)`）调用 `get_rgb_elements_as_a_tuple`并将返回的元组赋值给
    `RGB`。


    使用了两种不同的方法来处理 RGB 值：


    1.  解包方法 1：使用 `std::get` 访问元组的单个元素。

    2.  解包方法 2：使用 `std::tie` 解包元组。


    在解包后，打印所有三组的 RGB 值，以验证它们已正确赋值给 `RGB`。


    查看代码：`01_tuples.cpp`


    现在，我们知道如何将 RGB 元素存储到图像。在此之前，我们必须讨论 (1D) 在物理上是如何表示的。为了存储元组，我们需要将 (2D) 转换为 (1D)。


    查看代码：`02_index.cpp`


    除了计算索引，我们还需要知道在 `std::vector` 中存储多少个元组以定义的 `width` 和 `height`。例如，一个宽度为 `640` 且为
    `360` 的图像对于 `std::vector`）的大小为 `230400`。


    参考：[`en.cppreference.com/w/cpp/container/vector`](https://en.cppreference.com/w/cpp/container/vector)
    像总是一样，我们需要包含头文件：`#include <vector>`。


    在图 3 中：


    img_grid.jpg


    `index = width * y`


    `X + width = 32`


    `Index = 32`


    让我们创建一个函数为我们处理索引。一个接受 `X` 和 `Y` 作为输入并返回索引的函数。


    查看代码：`03_calcsize.cpp`


    **注意**，此代码示例使用 `double` 作为 RGB 元素。红色、绿色和蓝色是 `0.0` 到 `1.0` 之间的浮点数，而不是 0 - 255 之间的整数。结束图像元数据的计算。现在是绘制某些像素并将其保存到文本文件中了。是的，有一些基于文本的图像格式。我们将使用本书中的
    PPM 文件格式。该图形格式源于开源 Netpbm 项目，带有几个图形程序和一个编程库 —— 主要在 Unix 世界使用。PPM 代表 Portable PixMap
    格式，它是可移植的，因为它是以 ASCII 格式写入的（类型：P3`）。PPM 文件包含两部分：头部和图像数据。不要担心它是 ASCII；PPM 可以转换为
    PNG、JPG 或任何其他格式。


