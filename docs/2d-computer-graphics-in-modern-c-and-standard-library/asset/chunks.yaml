    robust functionality in a single header file, allowing programmers to integrate
    and deploy graphic manipulations quickly. This framework is a testament to minimalist
    coding practices and a powerful tool for developers who require quick, effective
    graphic processing capabilities in their applications.


    At the heart of `ppmpp.hpp` lies its compatibility with the Portable PixelMap
    (PPM) format, an open and widely used standard in image processing. The choice
    of PPM as the central file format is strategic, balancing simplicity and versatility.
    Unlike more complex formats that require extensive parsing and handling, PPM’s
    straightforward structure allows for rapid reading, writing, and manipulation
    of pixel data. This compatibility ensures that `ppmpp.hpp` can seamlessly integrate
    into various projects, enabling developers to work with a format that is both
    accessible and powerful.


    The design philosophy behind `ppmpp.hpp` is grounded in maximizing efficiency
    while minimizing overhead. Every line of code in the framework is crafted to provide
    maximal functionality with minimal complexity, adhering to clean and maintainable
    code principles. This approach makes `ppmpp.hpp` a lightweight addition to any
    project and ensures that it remains easy to understand and modify. Whether you
    are a novice programmer or a seasoned developer, `ppmpp.hpp` offers an intuitive,
    straightforward path to powerful graphics manipulation.


    As we look towards the future of graphics programming, `ppmpp.hpp` stands as a
    forward-thinking tool that anticipates and adapts to the field’s evolving needs.
    Its design is not just about solving current challenges but also about laying
    a foundation for future innovations. With its blend of ease of use, efficiency,
    and open format compatibility, `ppmpp.hpp` is more than just a framework; it is
    a stepping stone towards a new era in graphics programming, where power and simplicity
    coexist harmoniously.


    At its core, it provides a range of functionalities centered around manipulating
    pixels and geometric shapes within images. The framework operates on a fundamental
    unit called `Pixel,` a tuple of three double values representing the `red,` `green,`
    and `blue` color channels. Additionally, it includes definitions for `Coord` and
    `Point,` which are tuples used for specifying coordinates and points in the image
    space, respectively.


    Various utility functions and methods that facilitate complex image manipulations
    are central to the framework’s capabilities. These include functions for color
    manipulation (such as getRedColorElement and setGreenColorElement) and methods
    to create and manipulate pixels and coordinates. The `Image` class, a pivotal
    part of the framework, encapsulates a wide array of functionalities ranging from
    basic operations like setting and getting pixel values to more advanced features
    like drawing geometric shapes (lines, rectangles, circles, Bezier curves), applying
    transformations (rotation, scaling, anti-aliasing), and performing image processing
    techniques (grayscale conversion, Gaussian blur, bloom effect). These capabilities
    make `ppmpp.hpp` a versatile tool for developers and artists, allowing for precise
    pixel-level manipulation and high-level graphic transformations.


