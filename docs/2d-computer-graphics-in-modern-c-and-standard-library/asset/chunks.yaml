    The program’s wedge drawing algorithm combines trigonometry and Bresenham’s line
    algorithm. The trigonometric aspect calculates the points along the arc of the
    wedge, while Bresenham`s line algorithm is used to draw the straight lines that
    form the sides of the wedge.


