    starting and ending angles to radians. Then, it iteratively computes the x and
    y coordinates using the cosine and sine functions of the current angle and adds
    them to a list of coordinates. The iteration continues with a small increment
    in the angle until the ending angle is reached.


    For the straight sides of the wedge, Bresenham’s line algorithm is used to connect
    the center of the circle to the start and end points of the arc. Bresenham’s line
    algorithm is a widely used technique for drawing lines in computer graphics, as
    it efficiently calculates the integer points along the line without using floating-point
    arithmetic. The algorithm iteratively updates the x and y coordinates while minimizing
    the error between the actual line and the drawn points. Combining the arc points
    and the lines generated by Bresenham`s algorithm creates the complete wedge shape.


