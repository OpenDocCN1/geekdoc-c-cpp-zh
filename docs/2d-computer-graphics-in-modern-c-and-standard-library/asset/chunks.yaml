    # **现代 C++ 与标准库中的 2D 图形**


    Håkan Blomqvist


    本书可在 [`leanpub.com/2dcomputergraphicsinmoderncandstandardlibrary`](http://leanpub.com/2dcomputergraphicsinmoderncandstandardlibrary)
