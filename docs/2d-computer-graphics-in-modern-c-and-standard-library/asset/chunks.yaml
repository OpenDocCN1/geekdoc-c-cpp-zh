    ## void drawGradients(const std::vector& colors, double angle_degree)


    ### Purpose

    The `drawGradients` function is designed to draw a gradient on the image using
    a specified set of colors and an angle. This function creates a smooth transition
    between the provided colors across the image at a given angle.


    ### Parameters

    `const std::vector<Pixel>& colors:` A vector of `Pixel` objects, each representing
    a color. These colors are used to create the gradient.


    `double angle_degree:` The angle in degrees at which the gradient is applied.
    This determines the direction of the color transition in the gradient.


    ### Functionality

    **Color Transition**: The function uses the `colors` parameter to define the sequence
    of colors that will be blended to form the gradient.


    **Angle-Based Rendering**: It internally calls `drawGradientsImpl,` which employs
    an algorithm to apply the gradient at the specified `angle_degree.` This involves
    calculating the color values at each point in the image based on their position
    relative to the gradient direction.


    **Gradient Creation**: The gradient is rendered across the image, smoothly transitioning
    between the specified colors in the direction set by the angle.


    ### Usage Example

    ```

    1 // Example of drawing a gradient

    2 std::vector<Pixel> gradientColors = {

    3     std::make_tuple(1.0, 0.0, 0.0), // Red

    4     std::make_tuple(0.0, 1.0, 0.0), // Green

    5     std::make_tuple(0.0, 0.0, 1.0)  // Blue

