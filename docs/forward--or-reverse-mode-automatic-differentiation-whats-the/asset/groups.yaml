    e = d ↝ Cayley (Sparse v d), which avoids appeal to the expensive ⊕ operation.
    Indeed, the (⊙) operation defined on e need not make use of that defined on Cayley
    (Sparse v d). For the specialized delta, we instead calculate:


    ```

    ```

    delta v = {- definition of delta for d ↝ -}

    λd -> d • delta v

    = {- definition of (⊙) and delta for Cayley -}

    λd -> rep₀ . (d • abs₀) . (λe -> e ⊕ delta v)

    = {- definition of rep₀, and abs₀ -}

    λd -> λe -> e ⊕ (d • (λe -> e ⊕ delta v) zero)

    = {- β-reduction and unit of monoid (Fig. 3) -}

    λd -> λe -> e ⊕ (d • delta v)

    = {- equation (2) -}

    λd -> λe -> insertWith (⊙) v d e

    = {- η-reduction -}

    λd -> insertWith (⊙) v d

    ```

    ```


    Hence, we obtain an implementation of delta that takes only O(log V) time.


    ```

    ```

    instance (Ord v, Semiring d) => Kronecker v d (d ↝ Cayley (Sparse v d))

    where delta = insertWith (⊙)

    ```

    ```


    Moreover, the Cayley e representation preserves the correctness of e.


    ```

