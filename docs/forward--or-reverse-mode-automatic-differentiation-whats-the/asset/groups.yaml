    \ v -> d 替换为有限键值映射类型 Map v d，来避免此类零的显式表示以及与之进行的显式操作。我们使用 Haskell 的 Data.Map 库（附录\
    \ C），而不是专用的字典表示 [21]。\n\n```haskell\ntype Sparse v d = Map v d\n```\n\n映射中省略的值为零。这样，我们通过在映射中查找变量并在变量不存在时默认为零，从稀疏表示恢复\
