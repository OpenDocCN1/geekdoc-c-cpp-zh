    \ z)\n(x ⊕ y) ⊗ z = (x ⊗ z) ⊕ (y ⊗ z)\n\n吸收元: zero ⊗ x = zero = x ⊗ zero\n\n图\
    \ 1. 交换半环定律。\n\n```\ndata X = X\nexample₁ :: Expr X\nexample₁ = Times (Var X)\
    \ (Plus (Var X) One)\n```\n\n我们通过将符号表达式映射到一个（交换）半环，为符号表达式赋予了重载含义。半环中的“semi”指的是半环不需要具有加法逆元这一事实。此处省略该要求，因为自动微分（AD）不需要它。尽管如此，第\
    \ 6.1 节表明，如果存在这样的逆元，则可以加以容纳。我们施加的交换律要求并非必需，但简化了展示。第 6.2 节将该方法扩展到非交换半环，这对于支持例如矩阵是必要的。重载使我们能够灵活地从表达式的普通值和不同的\
    \ AD 变体两方面来解释表达式。\n\n### 定义 1（半环）\n\n半环是一个集合，配备两个二元运算 ⊕（“加法”）和 ⊗（“乘法”）以及两个特殊元素\
    \ zero 和 one。这些应遵循图 1 的定律：⊕ 和 ⊗ 应该都满足结合律和交换律，并分别具有单位元 zero 和 one。此外，⊗ 应该对 ⊕ 具有分配律，并以\
    \ zero 为吸收元。\n\n在 Haskell 中，我们在 Semiring 类型类中捕获半环的代数概念，并为遵循定律的数值类型（例如 Int、Float⁴）提供实例。\n\
    \n```\nclass Semiring d where\n  zero :: d\n  one :: d\n  (⊕) :: d → d → d\n \
    \ (⊗) :: d → d → d\n```\n\n```\ninstance Num a => Semiring a where\n  zero = 0\n\
    \  one = 1\n  (⊕) = (+)\n  (⊗) = (*)\n```\n\n有一个半环实例特别引起我们的兴趣：即针对符号表达式 Expr v\
    \ 的实例，其由定律⁴商化。\n\n```\ninstance Semiring (Expr v) where\n  zero = Zero\n  one\
    \ = One\n  (⊕) = Plus\n  (⊗) = Times\n```\n\n使此实例特别的是，它是自由半环实例，从而产生了 fold 风格的\
    \ eval 函数。该求值器通过对符号表达式进行结构递归，在给定变量映射 var :: v → d 的情况下，将它们映射到半环 d 中的解释。\n\n```\n\
    eval :: Semiring d => (v → d) → Expr v → d\neval var (Var x) = var x\neval var\
    \ Zero = zero\neval var One = one\neval var (Plus e₁ e₂) = eval var e₁ ⊕ eval\
    \ var e₂\neval var (Times e₁ e₂) = eval var e₁ ⊗ eval var e₂\n```\n\n这样，我们就可以使用\
    \ Int 半环对 example₁ 在 X = 5 时进行求值。\n\n```\n> eval (λX → 5) example₁\n30\n```\n\n\
    ## 2.2. 同态\n\n自由半环的概念、相关的 eval 函数及其性质是《程序设计代数》[5]中适用于任何代数结构的通用结果的特例。另一个相关概念，将证明是本文的核心，即同态。非正式地说，这是一个保持代数结构的函数。更正式地说，\n\
    \n### 定义 2（半环同态）\n\n两个半环 D₁ 和 D₂ 之间的（半环）同态是一个函数 h :: D₁ → D₂，它保持半环结构：\n\nh zero₁\
    \ = zero₂          h (x ⊕₁ y) = h x ⊕₂ h y\none₁ = one₂             h (x ⊗₁ y)\
    \ = h x ⊗₂ h y\n\n半环同态可复合：给定同态 h₁ :: D₁ → D₂ 和 h₂ :: D₂ → D₃，它们的复合 h₂ ∘ h₁ ::\
    \ D₁ → D₃ 也是一个同态；并且预期的定律成立。此外，恒等函数 id :: D → D 平凡地是一个同态。函数 eval var 对于任何 var 的选择都是一个同态。事实上，它是满足\
    \ h (Var v) = var v 的唯一同态 h。从这一唯一性性质推导出两个有用的性质：\n\n### 性质 1（融合）\n\n融合性质允许我们将任何同态\
    \ h 纳入求值：h ∘ eval var = eval (h ∘ var)。\n\n### 性质 2（反射）\n\n反射性质观察到，使用 Var 进行求值是恒等函数：eval\
    \ Var = id。\n\n## 2.3. 符号微分与对偶数\n\neval 同态还允许我们进行符号微分。我们在 derive 函数中捕获其规则，使用 Expr\
    \ v 的 Semiring 实例，并利用乘法情况中的交换律。\n\n```\nderive :: Eq v => v -> Expr v -> Expr\
    \ v\nderive x (Var y)   = if x == y then one else zero\nderive x Zero      = zero\n\
    derive x One       = zero\nderive x (Plus e₁ e₂) = derive x e₁ ⊕ derive x e₂\n\
    derive x (Times e₁ e₂) = (e₂ ⊗ derive x e₁) ⊕ (e₁ ⊗ derive x e₂)\n```\n\n这些不适合\
    \ eval 的 fold 风格递归方案，因为在 Times 的情况下，e₁ 和 e₂ 出现在递归调用之外（灰色）。利用所谓的“香蕉分割”性质 [3–11]，我们可以将此函数转换为适当的形式：我们使其返回一个元组\
    \ (Expr v, Expr v)，包含原始表达式和符号导数。\n\n```\nderive' x e = (e, derive x e)\n```\n\n\
    我们由此获得 derive' 的以下结构递归定义，然后可以通过投影第二个分量来恢复 derive：\n\n```\nderive' :: Eq v => v\
    \ -> Expr v -> (Expr v, Expr v)\nderive' x (Var y)   = (Var y, if x == y then\
    \ one else zero)\nderive' x Zero      = (zero, zero)\nderive' x One       = (one,\
    \ zero)\nderive' x (Plus e₁ e₂) = let (e'₁, d₁) = derive' x e₁\n             \
    \                (e'₂, d₂) = derive' x e₂\n                             in (e'₁\
    \ ⊕ e'₂, d₁ ⊕ d₂)\nderive' x (Times e₁ e₂) = let (e'₁, d₁) = derive' x e₁\n  \
    \                           (e'₂, d₂) = derive' x e₂\n                       \
    \      in (e'₁ ⊗ e'₂, (e'₂ ⊗ d₁) ⊕ (e'₁ ⊗ d₂))\n```\n\n在将 derive' 的功能用 eval 编写之前，我们将\
