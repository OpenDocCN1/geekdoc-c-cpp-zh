    \ D E where\n  delta v = h (deltaDense v)\ninstance CorrectAD V D E where\n  rep\
    \ = h\n  abs = h⁻¹\n```\n\n通过构造，这些实例既 (1) 满足所有必要的定律，又 (2) 确保 h 是 Kronecker 同构。例如，我们可以按如下方式验证\
    \ x ⊕ zero = x 和 h x ⊕ h y = h (x ⊕ y)：\n\n```\nx ⊕ zero\n= { - definitions of\
