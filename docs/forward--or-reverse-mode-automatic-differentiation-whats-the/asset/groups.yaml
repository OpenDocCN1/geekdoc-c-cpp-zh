    ```


    # 4. AD variants by construction


    This section explains our methodology, which is based on constructing Kronecker
    isomorphisms, and demonstrates it on the sparse variant of forwardAD_dense. This
    methodology will allow us to instantiate our abstract algorithm by varying the
    tangent type to obtain different flavors of automatic differentiation.


    # 4.1. Relating AD variants with Kronecker isomorphisms


    A key concern when devising new AD variants is their correctness. We can establish
    this by showing their functional equivalence to an established AD baseline. We
    do so using Kronecker isomorphisms.


    **Definition 4** (Kronecker homomorphism). Given a type of variables V and a semiring
    D, with types E1 and E2 such that Kronecker V D E1 and Kronecker V D E2 hold (and
    thus also Monoid E1, Monoid E2, Module D E1 and Module D E2), then a Kronecker
    homomorphism is a function h :: E1 -> E2 that preserves the Kronecker V D structure:

    h zeroE1 = zeroE2

    h (x ⊕E1 y) = (h x) ⊕E2 (h y)

    h (d •E1 v) = d •E2 (h m)

    h (deltaE1 v) = deltaE2 v


    **Definition 5** (Kronecker isomorphism). A Kronecker isomorphism is a pair of
    Kronecker homomorphisms h :: E1 -> E2 and h'' :: E2 -> E1, that are inverses:
    h . h'' = id and h'' . h = id.


    In the rest of the paper we use Dense V D as the baseline. Hence, when coming
    up with a new tangent type E, we also want to find a Kronecker isomorphism h ::
    Dense V D -> E to establish its correctness. This isomorphism is a function pair
    consisting of a representation function rep and its inverse abs (abstraction),
    following the terminology of data representation [17,18]. To streamline our approach,
    we capture this isomorphism in a type class CorrectAD.


    ```

    class Kronecker v d e => CorrectAD v d e where

    rep :: Dense v d -> e

    abs :: e -> Dense v d

    ```


    With the free theorem [19] that follows from the parametricity of abstractD [20]
    we can then relate the new instance of the algorithm to the baseline.


    > **Theorem 2.** Given a CorrectAD V D E instance, we have that

    > fmap abs (abstractD_E var e) = abstractD_Dense var e

    > abstractD_E var e = fmap rep (abstractD_Dense var e)'
