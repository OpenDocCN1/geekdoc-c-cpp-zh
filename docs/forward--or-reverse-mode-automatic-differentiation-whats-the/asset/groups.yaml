    # 6.4. Higher derivatives


    Higher derivatives are obtained through repeated differentiation. For instance,
    the second-order derivative is the derivative of the derivative. The naive approach
    to compute the second-order derivative at a point is through repeated evaluation
    of the symbolic derivative.


    ```

    derive2nd :: (Eq v, Semiring d) => (v -> d) -> Expr v -> Dense v (Dense v d)

    derive2nd_var e = \x y -> eval var tan^n (forwardAD_Dense Var

    (tan^n (forwardAD_Dense (var x)) y))

    ```


    The Haskell call derive2nd var e x y corresponds to the mathematical notation
    ∂/∂y (∂/∂x e)|var. By using naturality of tan^n and eval''s fusion property, we
    merge the three traversals of derive2nd into a single traversal (see Appendix
    A):


    ```

    derive2nd_var var e = \x y -> tan^n (tan^n (forwardAD_Dense gen e x) y)

    where gen z = N (var z) (delta z)

    ```


    This instance of abstractD uses the (d <- (Dense v d))-module of nested Nagata
    numbers of type (d <- (Dense v d)) × (Dense v d <- (Dense v d)).


    The nested derivative (Fig. 7) of the second-order derivative contains redundancy:
    the value ∂²/∂x² appears twice. This redundancy gets worse as the order (and thus
    the level of nesting) increases. In general, for the nth-order derivative we get
    2^n values of which only n + 1 are distinct. To avoid this, it is more economical
    to use a compact representation.


    ```

    data N_2nd v d = N_2nd d (Dense v (d <- (Dense v d)))

    ```


    The corresponding forward AD is similar to abstractD:


    ```

    forwardAD_2nd :: (Semiring d) => (v -> d) -> Expr v -> N_2nd v d

    forwardAD_2nd_var = eval gen where gen x = N_2nd (var x) (delta x)

    ```


    Running this on example3, gives the evaluation result, first and second derivative:


    ```

    -> forwardAD_2nd (\X -> 5) example3

    N_2nd 300 (\X -> N [ prim'' = 170, tan^n = (\X -> 64) ])

    ```


    This generalizes straightforwardly to other higher derivatives.


    All higher partial derivatives In the extreme case where n = ∞, the economical
    representation becomes an infinite stream of all successive derivatives [29].
    This stream of derivatives has the form x :< dxs where x is the value and dxs
    are all higher-order partial derivatives with respect to all variables v.10


    ```

    data Stream v d = d :< Dense v (Stream v d)

    ```


    Then, the semiring operations for the infinite stream of successive derivatives
    are defined as follows.


    ```

    instance Semiring d => Semiring (Stream v d) where

    zero = zero :< zero

    one = one :< zero

    (x :< xs) ⊕ (y :< ys) = (x ⊕ y) :< (xs ⊕ ys)

    ```'
