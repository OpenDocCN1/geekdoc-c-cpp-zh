    \ zero)\n= { - monoid identity law for Dense v d - }\nh (h⁻¹ x)\n= { - isomorphism\
    \ - }\nx\n\nh x ⊕ h y\n= { - definition of ⊕ - }\nh (h⁻¹ (h x) ⊕ h⁻¹ (h y))\n\
