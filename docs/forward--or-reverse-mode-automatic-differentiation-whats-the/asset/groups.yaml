  md: "\n### 4.2. Kronecker isomorphisms by construction\n\nGiven the Kronecker V\
    \ D (Dense V D) structure as our starting point and a newly desired representation\
    \ E, we do not have to devise the Kronecker V D E structure and the Kronecker\
    \ isomorphism out of the blue: Instead, following the method outlined by Elliott\
    \ [7], we can constructively derive both from a plain invertible function h ::\
    \ Dense V D -> E. Indeed, we can create the instances for E in terms of the instances\
    \ of Dense V D and of h.\n\n```haskell\ninstance Monoid E where\n  zero = h zeroDense\n\
    \  x ⊕ y = h (h⁻¹ x ⊕Dense h⁻¹ y)\ninstance Module D E where\n  d • x = h (d •Dense\
    \ h⁻¹ x)\ninstance Kronecker V D E where\n  delta v = h (deltaDense v)\ninstance\
    \ CorrectAD V D E where\n  rep = h\n  abs = h⁻¹\n```\n\nBy construction, these\
    \ instances both (1) satisfy all the necessary laws, and (2) ensure that h is\
    \ a Kronecker isomorphism. For example, we can verify that x ⊕ zero = x and that\
    \ h x ⊕ h y = h (x ⊕ y) as follows:\n\n```\nx ⊕ zero\n= { - definitions of zero\
    \ and ⊕ - }\nh (h⁻¹ x ⊕ h⁻¹ (h zero))\n= { - isomorphism - }\nh (h⁻¹ x ⊕ zero)\n\
    = { - monoid identity law for Dense v d - }\nh (h⁻¹ x)\n= { - isomorphism - }\n\
    x\n\nh x ⊕ h y\n= { - definition of ⊕ - }\nh (h⁻¹ (h x) ⊕ h⁻¹ (h y))\n= { - isomorphism\
    \ - }\nh (x ⊕ y)\n```\n\nVerifying the other laws and homomorphism properties\
    \ proceeds similarly.\n\nIn short, each time we devise a new AD variant, we come\
    \ up with a new representation E and an invertible function h :: Dense V D ->\
    \ E. The rest of the infrastructure then follows mechanically, except for the\
    \ fact that we can simplify the definitions, sometimes exploiting further equations,\
    \ for the sake of optimizing the (algorithmic properties of) the representation.\n\
    \nThe invertible function ensures, through the constructed Kronecker isomorphism,\
    \ that the extensional behaviour remains the same, and thus guarantees correctness.\
    \ At the same time, a well-chosen alternative representation may improve intentional\
    \ properties like asymptotic runtime.\n\n### 4.3. Sparse maps\n\nWe demonstrate\
    \ that the above approach to switch from the dense function space representation\
    \ to that of sparse maps. This exploits the fact that many partial derivatives\
    \ of sub-expressions are zero. Indeed, if a variable x does not occur in an expression\
    \ e, the partial derivative ∂e/∂x is zero. Notably, in the base instance of dense\
    \ functions, when the expression is just a variable, all partial derivatives but\
    \ one are by definition zero. We avoid explicit representations of such zeros-as\
    \ well as explicit operations with them-by replacing the dense function space\
    \ v -> d with the type of finite key-value maps Map v d. We use Haskell's Data.Map\
    \ library (Appendix C) instead of a specialized dictionary representation [21].\n\
    \n```haskell\ntype Sparse v d = Map v d\n```\n\nThe omitted values in the map\
    \ are zero. This way we recover the Dense representation from the sparse one by\
    \ looking up the variables in the map and defaulting to zero when a variable is\
    \ not present.\n\n```haskell\nabs↝ :: (Ord v, Semiring d) => Sparse v d -> Dense\
    \ v d\nabs↝ m = \\v -> findWithDefault zero v m\nrep↝ :: (Ord v, Bounded v, Enum\
    \ v, Semiring d, Eq d)\n     => Dense v d -> Sparse v d\nrep↝ dense = fromList\
    \ [(v, dense v) | v <- [minBound .. maxBound], dense v ≠ zero]\n```\n\nObserve\
    \ that abs↝ and rep↝ are inverse functions under the constraints (modulo the equivalence\
    \ of explicit and implicit zeroes). With the new Sparse v d representation and\
    \ the two inverse functions we can derive the Monoid, Module, Kronecker and CorrectAD\
    \ instances following the approach outlined in Section 4.1. This results in the\
    \ all-zero map being empty. Addition of maps is performed key-wise, but avoided\
    \ if either or both maps have an implicit zero at a given (variable) key.\n\n\
    ```haskell\ninstance (Ord v, Semiring d) => Monoid (Sparse v d) where\n  zero\
    \ = empty\n  (⊕) = unionWith (⊕)\n```\n\nScalar multiplication is also key-wise.\
    \ As d ⊗ zero = zero (Fig. 1), we can effortlessly preserve the implicit zero\
    \ entries.\n\n```haskell\ninstance (Ord v, Semiring d) => Module d (Sparse v d)\
    \ where\n  d • m = fmap (d ⊗) m\n```\n\nThe only non-zero entry for delta x is\
    \ that for x.\n\n```haskell\ninstance (Ord v, Semiring d) => Kronecker v d (Sparse\
    \ v d) where\n  delta x = singleton x one\n```\n\nMoreover, and crucially in what\
    \ follows, we observe the following relationship between this Kronecker structure\
    \ and its Module and Monoid instances:\n\n```\nd • delta v = singleton v d (1)\n\
    e ⊕ (d • delta v) = insertWith (⊕) v d e (2)\n```\n\nLastly, the CorrectAD instance\
    \ is straightforward.\n\n```haskell\ninstance (Ord v, Bounded v, Enum v, Semiring\
    \ d, Eq d) => CorrectAD v d (Sparse v d) where\n  rep = rep_-\n  abs = abs_-\n\
    ```\n\nIn summary, all that the sparse gradient computation requires, in comparison\
    \ to the dense computation, is the switch from d × (Dense v d) to d × (Sparse\
    \ v d).\n\n```haskell\nforwardADsparse :: (Ord v, Semiring d) => (v -> d) -> Exp\
    \ v -> d × Sparse v d\nforwardADsparse = abstractD\n```\n\nTheorem 2 now holds\
    \ by construction. We can verify this correspondence by revisiting example2 at\
    \ the point (5, 3).\n\n```\n> let {var X = 5; var Y = 3} in tan^y (forwardADsparse\
    \ var example2)\n[X -> 4; Y -> 5]\n```\n\n## 5. Reverse-mode automatic differentiation\n\
    \nWe now develop the appropriate d-module structure that exhibits reverse-mode\
    \ AD as an instance of abstractD by refining the above sparse representation.\
    \ Motivated by the quest for improved efficiency, we optimize the time complexity\
    \ of the essential functions for abstract differentiation with the underlying\
    \ Nagata numbers semiring: scalar multiplication (⊙), addition (⊕) and Kronecker's\
    \ delta.\n\n### 5.1. Accumulating multiplications\n\nWe start with another function-based\
    \ representation. Instead of the d-module e, we consider the space of d-module\
    \ homomorphisms from d to e. It is a standard result in commutative algebra [22,\
    \ p. 18] that these two structures are isomorphic, considered as d-modules. In\
    \ terms of the underlying Haskell types, this amounts to taking the plain function\
    \ space.\n\n```haskell\ntype d -> e = d -> e\n```\n\n7 For the case of commutative\
    \ rings and their modules; the argument for semirings and modules is identical,\
    \ but simpler, because there are fewer equations to check.\n\nBut we intend this\
    \ type d -> e to represent only the d-module homomorphisms. This is the case for\
    \ linear functions from d to e. A function f : d -> e is linear^3 iff it has the\
    \ multiplicative homogeneity property:\n\nf (\\x) y = x • f y\n\nAs the Haskell\
    \ type d -> e also includes non-linear functions, we have to make disciplined\
    \ use of d -> e, being careful to avoid the non-linear ones. Intuitively, we can\
    \ think of d -> e as augmenting e with an accumulator for a scalar multiplier\
    \ of type d. By supplying the scalar one, we recover the original module.\n\n\
    ```haskell\nrep_- :: Module d e => d -> e -> (d -> e)\nrep_- e = \\x d -> d •\
    \ e\nabs_- :: Module d e => (d -> e) -> e\nabs_- f = f one\n```\n\nIn particular,\
    \ as one e • e = e (Fig. 3), we have that abs_- o rep_- = id. Moreover, for linear\
    \ functions also rep_- o abs_- = id. Now we derive Monoid, Module and Kronecker\
    \ instances that make rep_- a homomorphism by construction. It follows that d\
    \ -> e inherits its monoid structure in a pointwise fashion from e. For e = Dense\
    \ v d, the time complexity for additive operations remains linear in the number\
    \ of variables.\n\n```haskell\ninstance Monoid e => Monoid (d -> e) where\n  zero\
    \ = \\x d -> zero\n  f ⊕ g = \\x d -> f x d ⊕ g x d\n```\n\nFurthermore, its d-module\
    \ structure uses the function parameter as an accumulator for the scalar multiplier.\
    \ This affords a \"strength reduction\": the expensive scalar multiplication (•)\
    \ is replaced by the cheaper semiring multiplication (⊕).\n\n```haskell\ninstance\
    \ Module d e => Module d (d -> e) where\n  d' • f = \\x d -> f (x ⊕ d' ⊗ d)\n\
    ```\n\nThis reduces the time complexity of scalar multiplication from O(|V|) (where\
    \ V denotes the number of variables with non-zero values in the given sparse map)\
    \ for the Sparse v d representation to O(1) for that of d -> Sparse v d. However,\
    \ the general Kronecker instance of d -> e still contains the expensive (•) operator.\n\
    \n```haskell\ninstance Kronecker v d e => Kronecker v d (d -> e) where\n  delta\
    \ v = \\x d -> d • delta v\n```\n\nFortunately, we only require a specialized\
    \ instance for sparse maps, which operates in constant time, as a consequence\
    \ of equation (1) for d -> delta v.\n\n```haskell\ninstance (Ord v, Semiring d)\
    \ => Kronecker v d (d -> Sparse v d) where\n  delta = singleton\n```\n\nFinally,\
    \ the CorrectAD instance for d -> e is defined as the composition of rep_-/abs_-\
    \ with rep/abs of e.\n\n```haskell\ninstance CorrectAD v d e => CorrectAD v d\
    \ (d -> e) where\n  rep = rep_- . rep\n  abs = abs_- . abs_-\n```\n\nIn summary,\
    \ by using d × (d -> Sparse v d) we obtain reverse-mode AD.\n\n```haskell\nreverseAD\
    \ :: (Ord v, Semiring d) => (v -> d) -> Exp v -> d × (d -> Sparse v d)\nreverseAD\
    \ = abstractD\n```\n\nFor instance, consider the more extensive example expression\
    \ x x × (x + 1) × (x + x), encoded in Haskell as example_3.\n\n```haskell\nexample_3\
    \ :: Exp X\nexample_3 = Times (Var X) (Times (Plus (Var X) One) (Plus (Var X)\
    \ (Var X)))\n```\n\nRunning reverse-mode AD on this expression, the derivative\
    \ at X = 5 is 170.\n\n```\n> (abs_- . tanh^n) (reverseAD (\\x -> 5) example_3)\n\
    {X -> 170}\n```\n"
  mdcn: "\n\n### 4.2. 通过构造的 Kronecker 同构\n\n将 Kronecker V D (Dense V D) 结构作为起点，以及一个新期望的表示\
