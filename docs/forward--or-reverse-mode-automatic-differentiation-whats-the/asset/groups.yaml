    高阶导数通过重复求导得到。例如，二阶导数是导数的导数。在某点计算二阶导数的朴素方法是通过重复求值符号导数。\n\n```\nderive2nd :: (Eq\
    \ v, Semiring d) => (v -> d) -> Expr v -> Dense v (Dense v d)\nderive2nd var e\
    \ = \\x y -> eval var tan^n (forwardAD_Dense Var (tan^n (forwardAD_Dense (var\
    \ x)) y))\n```\n\nHaskell 调用 derive2nd var e x y 对应数学记号 ∂/∂y (∂/∂x e)|var。通过利用\
    \ tan^n 的自然性和 eval 的融合属性，我们将 derive2nd 的三次遍历合并为一次遍历（参见附录 A）：\n\n```\nderive2nd\
    \ var e = \\x y -> tan^n (tan^n (forwardAD_Dense gen e x) y)\nwhere gen z = N\
    \ (var z) (delta z)\n```\n\n此 abstractD 实例使用嵌套 Nagata 数的 (d <- (Dense v d))-模块，类型为\
    \ (d <- (Dense v d)) × (Dense v d <- (Dense v d))。\n\n二阶导数的嵌套导数（图 7）包含冗余：值 ∂²/∂x²\
    \ 出现了两次。随着阶数（因此嵌套层级）的增加，这种冗余会变得更糟。一般来说，对于 n 阶导数，我们得到 2^n 个值，其中只有 n + 1 个是不同的。为避免这种情况，使用紧凑表示更为经济。\n\
    \n```\ndata N_2nd v d = N_2nd d (Dense v (d <- (Dense v d)))\n```\n\n相应的前向 AD\
    \ 与 abstractD 类似：\n\n```\nforwardAD_2nd :: (Semiring d) => (v -> d) -> Expr v\
    \ -> N_2nd v d\nforwardAD_2nd var = eval gen where gen x = N_2nd (var x) (delta\
    \ x)\n```\n\n在 example₃ 上运行此代码，得到求值结果、一阶导数和二阶导数：\n\n```\n-> forwardAD_2nd (\\\
    X -> 5) example₃\nN_2nd 300 (\\X -> N [ prim' = 170, tan^n = (\\X -> 64) ])\n\
    ```\n\n这可以直接推广到其他高阶导数。\n\n所有高阶偏导数。在极端情况下 n = ∞，经济表示变为所有连续导数的无限流 [29]。这个导数流的形式为\
    \ x :< dxs，其中 x 是值，dxs 是相对于所有变量 v 的所有高阶偏导数。¹⁰\n\n```\ndata Stream v d = d :< Dense\
    \ v (Stream v d)\n```\n\n然后，无限连续导数流的半环运算定义如下。\n\n```\ninstance Semiring d => Semiring\
    \ (Stream v d) where\nzero = zero :< zero\none = one :< zero\n(x :< xs) ⊕ (y :<\
    \ ys) = (x ⊕ y) :< (xs ⊕ ys)\n(x :< xs) ⊗ (y :< ys) = (x ⊗ y) :< λv → ((xs ⊗ (y\
    \ :< ys)) ⊕ ((x :< xs) ⊗ ys v))\n  where xss = (x :< xs)\n        yys = (y :<\
    \ ys)\n```\n\n`Module` 和 `Kronecker` 实例自然地从该定义得出。它们允许我们自动对符号表达式求导并获得其导数流（导数序列）。\n\
    \n```\nforwardADAll :: (Eq v, Semiring d) => (v -> d) -> Expr v -> Stream d\n\
    forwardADAll var = eval gen where gen y = var y :< delta y\n> forwardADAll (λX\
    \ -> (5 :: Int)) example₃\n300 :< (X -> 170 :< (λX -> 64 :< (λX -> 12 :< (λX ->\
    \ 0 :< ...\n```\n\n## 混合自动微分\n\n在二阶优化中，通常偏好使用混合方法，即结合前向模式和后向模式以获得更高效的算法。例如，在考虑函数的曲率时，有必要计算作用于向量的\
    \ Hessian¹¹。Pearlmutter [31] 引入了这两种模式的混合。在前向扫描中计算一阶导数，随后第二次反向扫描计算某点的二阶导数。这可以通过利用\
    \ d-模同构性来实现，以便使用\n\n```\ndata Nᵢ v d = Nᵢ d (Dense v (d <- (Cayley (Sparse v d))))\n\
    ```\n\n## 6.5. 子表达式共享的基础\n\n迄今为止，我们的方法忽略了源表达式中的任何共享。例如，考虑 example₄，它表示表达式 (x +\
    \ x) · (x + x)，但在 Haskell 层面通过 `let` 绑定共享了两个 x + x 的出现。\n\n```\nexample₄ :: Expr\
    \ X\nexample₄ = let y = Plus (Var X) (Var X) in Times y y\n```\n\n`abstractD`\
    \ 使用的 `eval` 递归方案看不到 `let` 绑定，并处理 x + x 的两个出现。特别是，`abstractD (λX -> 5) example₄`\
    \ 归约为 (N 5 one ⊕ N 5 one) ⊗ (N 5 one ⊕ N 5 one)，其中包含两个 (⊕) 操作而不是一个。为避免这种中间结果的重复计算，我们将\
    \ let 构造扩展到符号表达式语言中，以便可以使用此新语法编写 example₄'。\n\n```\ndata Expr v = ...\n  | Let\
    \ v (Expr v) (Expr v)\n\nexample₄' :: Expr XY\nexample₄' = Let Y (Plus (Var X)\
    \ (Var X)) (Times (Var Y) (Var Y))\n```\n\n我们相应地调整求值器，采用 let 绑定的标准语义。\n\n```\n\
    eval :: (Eq v, Semiring d) => (v -> d) -> Expr v -> d\n...\neval gen (Let y e₁\
    \ e₂) = let d₁ = eval gen e₁;\n                         gen₂ x = if x == y then\
    \ d₁ else gen x\n                         in eval gen₂ e₂\n```\n\n请注意，由于 e₂ 在作用域中有额外的\
    \ `let` 绑定变量，我们使用扩展的生成器 `gen₂` 对其求值，该生成器将自由变量映射到其给定的 `gen` 含义，并将新的 `let` 绑定变量\
    \ `y` 映射到 `e₁` 的含义 `d₁`。`abstractD` 的定义与之前相同，现在支持共享。\n\n### 稀疏映射的共享\n\n现在，`abstractD\
    \ (λX -> 5) example₄'` 归约为只包含一个 (⊕) 操作的中间形式，如果我们针对稀疏模块的切线进行提交，这将进一步归约，从而很好地保留共享。\n\
    \n```\nlet y = N 5 ⊕ₑ N 5 one in (y ⊗ y)\n≡ let y = N 5 (X -> 1) ⊕ₑ N 5 (X ->\
    \ 1) in (y ⊗ y)\n≡ let y = N 10 (fromList [(1, 2)]) in (y ⊗ y)\n≡ N (10 × 10)\
    \ (fmap (10 x) (X -> 2) ⊕ fmap (10 x) (X -> 2))\n≡ N 100 ((X ↦ 20) ⊕ (X ↦ 20))\n\
    ≡ N 100 (X ↦ 40)\n```\n\n### 函数的共享\n\n然而，如果我们使用基于函数的模块表示，例如 Dense 和我们的三种反向模式变体，那么\
    \ (⊕) 会在求值过程中再次复制。这是因为函数绑定下的 (⊕) 在函数应用之前不会归约。当共享函数的两个引用都被应用时，其函数体中的 (⊕) 会被每次求值。下面以密集函数为例说明这一点，因为它是基于函数的表示中最简单的一种。\n\
    \n```\nlet y = N 5 ⊕ N 5 one in (y ⊕ y)\nlet y = N 5 (X ↦ 1) ⊕ N 5 (X ↦ 1) in\
    \ (y ⊕ y)\n≡ let y = N 10 (X ↦ (X ↦ 1) ⊕ (X ↦ 1)) in (y ⊕ y)\n≡ (N 10 (X ↦ (X\
    \ ↦ 1) ⊕ (X ↦ 1)) ⊕ (X ↦ 1) ⊕ ...\n≡ N (10 × 10) ((X X' ↦ (X X' ↦ 10 × (X X' ↦\
    \ 1) ⊕ (X X' ↦ 1) ⊕ (X ↦ 1) X') X'' + (X ↦ 1) X') X''\n```\n\n幸运的是，我们可以通过为 Let\
    \ 自定义符号规则来解决函数表示的共享问题（证明见附录 B）。\n\n> 引理 1（Let 规则）。\n> ∂(let y = e₁ in e₂) / ∂xᵢ\
    \ = ∂e₂ / ∂y | y=e₁ × ∂e₁ / ∂xᵢ + ∂e₂ / ∂xᵢ | y=e₁\n\n例如，表达式 example₄ 的偏导数为：\n\
    \n```\n∂example₄ / ∂x = ∂(y × y) / ∂y | y=x+x × ∂(x + x) / ∂x + ∂(y × y) / ∂x\
    \ | y=x+x\n= ((x + x) + (x + x)) × (1 + 1) + 0\n```\n\n此公式（引理 1）在 Letin 类型类中通过方法\
    \ letin 捕获，而 letin 又定义为 CorrectAD 类型类的 abs :: e → v → d，它提取 d-模块 e 的 v-分量。\n\n\
    ```\nclass CorrectAD v e ⇒ Letin v d e where\nletin :: v → e → e → e\nletin y\
    \ d e₁ e₂ = (abs d y • e₁) ⊕ d\n```\n\n我们特化 abstractD 使用的求值器以使用此公式，同时将其类型 d 特化为\
    \ d ⋈ e。\n\n```\neval :: (Eq v, Letin v d e) ⇒ (v → d ⋈ e) -> Expr v -> d ⋈ e\n\
    ...\neval gen (Let y e₁ e₂) =\n  let N f₁ d₁ = eval gen e₁\n      gen₂ x = λx\
    \ → if x ≡ y then N f₁ (delta y) else gen x\n      N f₂ d₂ = eval gen₂ e₂\n  in\
    \ N f₂ (letin y d₁ f₂ d₂)\n```\n\n此求值器对原始值使用标准替换行为，但对切线的行为则让渡给 Letin 类型类的 letin\
    \ 方法。如果我们内联并特化 letin 以适用于 d ⇀ Cayley (Sparse v d)，则得到一个紧凑的定义，该定义仅计算一次 dₑ 和 dₑ\
    \ 产生的映射。\n\n```\ninstance (Ord v, Semiring d) ⇒ Letin v d (Cayley (Sparse v d))\
    \ where\nletin y d e₁ e₂ = λm m → let m' = dₑ m in dₑ₁ (m' ?y m')\n```\n\n有了上述定义，let\
    \ 共享得到了正确保留。\n\n"
