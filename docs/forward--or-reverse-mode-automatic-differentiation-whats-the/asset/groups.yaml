    \n```\nfmap f ∘ tan^n = tan^n ∘ bimap f (fmap f) (A.1)\n```\n\n## 附录 B. 引理 1 的证明\n\
    \n证明。我们通过多元函数的链式法则来证明此规则：\n\n```\n\\frac{\\partial f(e_1, ..., e_n)}{\\partial\
    \ x} = \\sum_{i=1}^n \\left( \\frac{\\partial f(x_1, ..., x_n)}{\\partial x_i}\
    \ \\right|_{x_1=e_1, ..., x_n=e_n} \\times \\frac{\\partial e_i}{\\partial x}\
    \ \\right)\n```\n\n定义 f 为 f (y, x1, ..., xn) = e2，其中 x1, ..., xn 包含 e1 和 e2 的所有自由变量。那么我们有\
    \ f (e1, x1, ..., xn) = let y = e1 in e2。\n\n结合链式法则使用此方法可得：\n\n```\n\\frac{\\\
    partial (\\mathbf{let}\\ \\mathbf{y} = \\mathbf{e}_1\\ \\mathbf{in}\\ \\mathbf{e}_2)}{\\\
    partial x_i} = \\frac{\\partial f (\\mathbf{e}_1, \\dots, \\mathbf{x}_n)}{\\partial\
    \ x_i}\n= \\left. \\frac{\\partial f (\\mathbf{y}, \\mathbf{x}_1, \\dots, \\mathbf{x}_n)}{\\\
    partial \\mathbf{y}} \\right|_{\\mathbf{y}=\\mathbf{e}_1, \\mathbf{x}_1=\\mathbf{x}_1,\
    \ \\dots, \\mathbf{x}_n=\\mathbf{x}_n} \\times \\frac{\\partial \\mathbf{e}_1}{\\\
    partial x_i}\n+ \\sum_{j=1}^{n} \\left( \\left. \\frac{\\partial f (\\mathbf{y},\
    \ \\mathbf{x}_1, \\dots, \\mathbf{x}_n)}{\\partial \\mathbf{x}_j} \\right|_{\\\
    mathbf{y}=\\mathbf{e}_1, \\mathbf{x}_1=\\mathbf{x}_1, \\dots, \\mathbf{x}_n=\\\
    mathbf{x}_n} \\times \\frac{\\partial \\mathbf{x}_j}{\\partial x_i} \\right)\n\
    = \\frac{\\partial \\mathbf{e}_2}{\\partial \\mathbf{y}} \\bigg|_{\\mathbf{y}=\\\
    mathbf{e}_1} \\times \\frac{\\partial \\mathbf{e}_1}{\\partial x_i} + \\frac{\\\
    partial \\mathbf{e}_2}{\\partial \\mathbf{x}_i} \\bigg|_{\\mathbf{y}=\\mathbf{e}_1}\
    \ \\quad \\square\n```\n\n## 附录 C. Haskell 库与功能\n\n本节简要介绍 Haskell 的类型类特性，并总结我们使用的关键库函数。\n\
    \n### C.1. 类型类\n\n我们使用 Haskell 的类型类 [45] 来建模代数结构的接口，例如半环：\n\n```\nclass Semiring\
    \ d where\n  zero :: d\n  one :: d\n  (⊕) :: d -> d -> d\n  (⊗) :: d -> d -> d\n\
    ```\n\n在底层，Haskell 编译器会创建一种称为字典类型的数据类型，其中包含类型类的所有方法。\n\n```\ndata SemiringDict\
    \ d = SD (zero :: d\n                      , one :: d\n                      ,\
    \ (⊕) :: d -> d -> d\n                      , (⊗) :: d -> d -> d)\n```\n\n类型类实例为特定类型提供接口的实现。例如，\n\
    \n```\ninstance Semiring (Expr v) where\n  zero = Zero\n  one = One\n  (⊕) = Plus\n\
    \  (⊗) = Times\n```\n\n在底层，一个实例会产生一个包含这些实现的字典值。\n\n```\nsemiringExprDict :: SemiringDict\
    \ (Expr v)\nsemiringExprDict = SD (zero = Zero\n                   , one = One\n\
    \                   , (⊕) = Plus\n                   , (⊗) = Times)\n```\n\n我们可以在有实例的特定类型上使用类型类方法。例如，\n\
    \n```\nexpr :: Expr v\nexpr = one ⊕ one\n```\n\n编译器将其转换为从相应字典中显式提取实现的代码：\n\n```\n\
    expr :: Expr v\nexpr = d.(⊕) d.one d.one where d = semiringExprDict\n```\n\n选择合适的字典称为类型类解析，由使用方法的类型决定。因为每个类型最多只能有一个类型类实例，因此总是最多只有一个合适的字典。\n\
    \n我们还可以使用类型变量 d 对所用的特定类型进行抽象。然后类型变量受类型类约束 Semiring d 的约束。这意味着只要 d 有一个 Semiring\
    \ 实例，就可以自由选择 d。这称为受限多态。\n\n```\nexpr :: Semiring d => d = one ⊕ one\n```\n\n在底层，类型类约束被转换为显式字典参数。\n\
    \n```\nexpr :: SemiringDict d -> d = d ⊕ (d).one d.one\n```\n\n在特定类型上使用此类受限多态定义时，Haskell\
    \ 编译器会隐式提供适当的字典参数。例如，它将 expr :: Expr v 转换为 expr semiringExprDict :: Expr v。\n\n\
    在多参数类型类中，即签名中包含多个参数的类型类（例如 Module d e），我们可以在参数之间声明函数依赖以帮助类型类解析。函数依赖表示一个类型参数由其他参数唯一确定。例如，我们的\
    \ Module 类使用了这样的函数依赖：\n\n```\nclass (Semiring d, Monoid e) => Module d e | e ->\
    \ d where ...\n```\n\n这里半环类型 d 可以从类型 e 确定。\n\n有关类型类和 Haskell 的更深入介绍，我们参考 Bird\
    \ [46] 和 Hutton [47]。\n\n### C.2. 映射\n\n以下函数来自 Haskell 的 Data.Map 库，14 并附带其类型签名和说明。\n\
    \n- (!) :: Ord k => Map k a -> k -> a O(log n)。在键处查找值。当找不到元素时调用 error。\n- findWithDefault\
    \ :: Ord k => a -> k -> Map k a -> a O(log n)。表达式 findWithDefault def k map 返回键处的值，或者在键不在映射中时返回默认值\
    \ def。\n- fromList :: Ord k => [(k, a)] -> Map k a O(n * log n)。从键/值对列表构建映射。如果列表中同一键包含多个值，则保留该键的最后一个值。\n\
    - unionWith :: Ord k => (a -> a -> a) -> Map k a -> Map k a -> Map k a O(n + m)。带合并函数的并集。实现使用高效的\
    \ hedge-union 算法。\n- insertWith :: Ord k => (a -> a -> a) -> k -> a -> Map k a\
    \ -> Map k a O(log n)。带函数的插入，合并新值和旧值。insertWith f key value mp 如果键不在映射中，则将 (key,\
    \ value) 对插入 mp。如果键已存在，则函数将插入 (key, f new_value old_value)。\n\n### C.3. 数组\n\n\
    以下函数来自 Haskell 的 Data.Array.MArray 库，15 并附带其类型签名和说明。\n\n- newArray :: Ix i =>\
    \ (i, i) -> e -> m (a i e) 构建一个新数组，每个元素初始化为提供的值。\n- readArray :: (MArray a e m,\
    \ Ix i) => a i e -> i -> m e 从可变数组读取一个元素\n- writeArray :: (MArray a e m, Ix i)\
    \ => a i e -> i -> e -> m () 在可变数组中写入一个元素\n- getElems :: (MArray a e m, Ix i)\
    \ => a i e -> m [i, e] 返回可变数组的所有关联列表，按索引顺序排列。\n\n"
