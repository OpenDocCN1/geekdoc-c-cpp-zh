    \ d -> delta v 的方程 (1) 的结果。\n\n```haskell\ninstance (Ord v, Semiring d) => Kronecker\
    \ v d (d -> Sparse v d) where\n  delta = singleton\n```\n\n最后，d -> e 的 CorrectAD\
    \ 实例定义为 rep_-/abs_- 与 e 的 rep/abs 的组合。\n\n```haskell\ninstance CorrectAD v d e\
    \ => CorrectAD v d (d -> e) where\n  rep = rep_- . rep\n  abs = abs_- . abs_-\n\
    ```\n\n总之，通过使用 d × (d -> Sparse v d)，我们获得了反向模式 AD。\n\n```haskell\nreverseAD ::\
    \ (Ord v, Semiring d) => (v -> d) -> Exp v -> d × (d -> Sparse v d)\nreverseAD\
    \ = abstractD\n```\n\n例如，考虑更广泛的示例表达式 x x × (x + 1) × (x + x)，在 Haskell 中编码为 example_3。\n\
