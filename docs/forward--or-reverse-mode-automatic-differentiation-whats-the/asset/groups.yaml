    \ v d)。\n\n```haskell\nforwardADsparse :: (Ord v, Semiring d) => (v -> d) -> Exp\
    \ v -> d × Sparse v d\nforwardADsparse = abstractD\n```\n\n通过构造，定理 2 现在成立。我们可以通过重新访问点\
    \ (5, 3) 处的 example2 来验证此对应关系。\n\n```\n> let {var X = 5; var Y = 3} in tan^y (forwardADsparse\
    \ var example2)\n[X -> 4; Y -> 5]\n```\n\n## 5. 反向模式自动微分\n\n我们现在通过改进上述稀疏表示，开发出适当的\
    \ d-模结构，以将反向模式 AD 展现为 abstractD 的一个实例。出于提高效率的考虑，我们优化了基于 Nagata 数半环的抽象微分基本函数的时间复杂度：标量乘法\
    \ (⊙)、加法 (⊕) 和 Kronecker 的 delta。\n\n### 5.1. 累积乘法\n\n我们从另一种基于函数的表示开始。我们不考虑 d-模\
    \ e，而是考虑从 d 到 e 的 d-模同态空间。交换代数 [22, p. 18] 中的一个标准结果是，这两个结构作为 d-模是同构的。就底层 Haskell\
    \ 类型而言，这相当于取普通函数空间。\n\n```haskell\ntype d -> e = d -> e\n```\n\n7 对于交换环及其模的情况；半环和模的论证相同，但更简单，因为需要检查的方程更少。\n\
    \n但我们打算让此类型 d -> e 仅表示 d-模同态。对于从 d 到 e 的线性函数，情况正是如此。函数 f : d -> e 是线性^3 的，当且仅当它具有乘齐次性属性：\n\
    \nf (\\x) y = x • f y\n\n由于 Haskell 类型 d -> e 也包含非线性函数，我们必须有纪律地使用 d -> e，小心避免非线性函数。直觉上，我们可以将\
    \ d -> e 视为为 e 增加一个类型为 d 的标量乘数累加器。通过提供标量 one，我们可以恢复原始模。\n\n```haskell\nrep_- ::\
    \ Module d e => d -> e -> (d -> e)\nrep_- e = \\x d -> d • e\nabs_- :: Module\
    \ d e => (d -> e) -> e\nabs_- f = f one\n```\n\n特别是，由于 one e • e = e（图 3），我们有\
    \ abs_- ∘ rep_- = id。此外，对于线性函数，也有 rep_- ∘ abs_- = id。现在我们推导出 Monoid、Module 和 Kronecker\
    \ 实例，使 rep_- 按构造成为同态。由此可知，d -> e 以逐点方式从 e 继承其幺半群结构。对于 e = Dense v d，加法操作的时间复杂度仍为变量数量的线性复杂度。\n\
    \n```haskell\ninstance Monoid e => Monoid (d -> e) where\n  zero = \\x d -> zero\n\
    \  f ⊕ g = \\x d -> f x d ⊕ g x d\n```\n\n此外，其 d-模结构使用函数参数作为标量乘数的累加器。这实现了一种“强度削减”：昂贵的标量乘法\
