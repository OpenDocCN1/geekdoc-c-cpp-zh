    \ call derive2nd var e x y corresponds to the mathematical notation ∂/∂y (∂/∂x\
    \ e)|var. By using naturality of tan^n and eval's fusion property, we merge the\
    \ three traversals of derive2nd into a single traversal (see Appendix A):\n\n\
    ```\nderive2nd var e = \\x y -> tan^n (tan^n (forwardAD_Dense gen e x) y)\nwhere\
    \ gen z = N (var z) (delta z)\n```\n\nThis instance of abstractD uses the (d <-\
    \ (Dense v d))-module of nested Nagata numbers of type (d <- (Dense v d)) × (Dense\
    \ v d <- (Dense v d)).\n\nThe nested derivative (Fig. 7) of the second-order derivative\
    \ contains redundancy: the value ∂²/∂x² appears twice. This redundancy gets worse\
    \ as the order (and thus the level of nesting) increases. In general, for the\
    \ nth-order derivative we get 2^n values of which only n + 1 are distinct. To\
    \ avoid this, it is more economical to use a compact representation.\n\n```\n\
    data N_2nd v d = N_2nd d (Dense v (d <- (Dense v d)))\n```\n\nThe corresponding\
    \ forward AD is similar to abstractD:\n\n```\nforwardAD_2nd :: (Semiring d) =>\
    \ (v -> d) -> Expr v -> N_2nd v d\nforwardAD_2nd var = eval gen where gen x =\
    \ N_2nd (var x) (delta x)\n```\n\nRunning this on example₃, gives the evaluation\
    \ result, first and second derivative:\n\n```\n-> forwardAD_2nd (\\X -> 5) example₃\n\
    N_2nd 300 (\\X -> N [ prim' = 170, tan^n = (\\X -> 64) ])\n```\n\nThis generalizes\
    \ straightforwardly to other higher derivatives.\n\nAll higher partial derivatives.\
    \ In the extreme case where n = ∞, the economical representation becomes an infinite\
    \ stream of all successive derivatives [29]. This stream of derivatives has the\
    \ form x :< dxs where x is the value and dxs are all higher-order partial derivatives\
    \ with respect to all variables v.¹⁰\n\n```\ndata Stream v d = d :< Dense v (Stream\
    \ v d)\n```\n\nThen, the semiring operations for the infinite stream of successive\
    \ derivatives are defined as follows.\n\n```\ninstance Semiring d => Semiring\
    \ (Stream v d) where\nzero = zero :< zero\none = one :< zero\n(x :< xs) ⊕ (y :<\
    \ ys) = (x ⊕ y) :< (xs ⊕ ys)\n(x :< xs) ⊗ (y :< ys) = (x ⊗ y) :< λv → ((xs ⊗ (y\
    \ :< ys)) ⊕ ((x :< xs) ⊗ ys v))\n  where xss = (x :< xs)\n        yys = (y :<\
    \ ys)\n```\n\nThe `Module` and `Kronecker` instances follow naturally from this\
    \ definition. They allow us to automatically differentiate a symbolic expression\
    \ and obtain its stream (of series of derivatives).\n\n```\nforwardADAll :: (Eq\
    \ v, Semiring d) => (v -> d) -> Expr v -> Stream d\nforwardADAll var = eval gen\
    \ where gen y = var y :< delta y\n> forwardADAll (λX -> (5 :: Int)) example₃\n\
    300 :< (X -> 170 :< (λX -> 64 :< (λX -> 12 :< (λX -> 0 :< ...\n```\n\n## Hybrid\
    \ automatic differentiation\n\nIn second-order optimization, it is often preferred\
    \ to use a hybrid approach, i.e., combine forward mode and backward mode to get\
    \ a more efficient algorithm. For instance, when taking a function's curvature\
    \ into account, it is necessary to compute the Hessian¹¹ applied to a vector.\
    \ Pearlmutter [31] introduces this mix of the two modes. In a forward sweep the\
    \ first derivative is computed, whereupon the second, reverse sweep computes the\
    \ second-order derivative at a point. This can be obtained by exploiting the d-module\
    \ isomorphisms to work with\n\n```\ndata Nᵢ v d = Nᵢ d (Dense v (d <- (Cayley\
    \ (Sparse v d))))\n```\n\n## 6.5. Basic sharing of subexpressions\n\nOur approach\
    \ so far ignores any sharing in the source expression. Consider for instance example₄,\
    \ which denotes the expression (x + x) · (x + x), but at the level of Haskell\
    \ shares the two occurrences of x + x by means of a `let` binding.\n\n```\nexample₄\
    \ :: Expr X\nexample₄ = let y = Plus (Var X) (Var X) in Times y y\n```\n\nThe\
    \ `eval` recursion scheme used by `abstractD` does not see the `let` binding and\
    \ processes both occurrences of x + x. In particular, `abstractD (λX -> 5) example₄`\
    \ reduces to (N 5 one ⊕ N 5 one) ⊗ (N 5 one ⊕ N 5 one) which features two (⊕)\
    \ operations instead of one. To avoid this recomputation of intermediate results,\
    \ we extend the symbolic expression language with a let-construct so that we can\
    \ write example₄' with this new syntax.\n\n```\ndata Expr v = ...\n  | Let v (Expr\
    \ v) (Expr v)\n\nexample₄' :: Expr XY\nexample₄' = Let Y (Plus (Var X) (Var X))\
    \ (Times (Var Y) (Var Y))\n```\n\nWe adapt the evaluator accordingly with the\
    \ standard semantics for let-binding.\n\n```\neval :: (Eq v, Semiring d) => (v\
    \ -> d) -> Expr v -> d\n...\neval gen (Let y e₁ e₂) = let d₁ = eval gen e₁;\n\
    \                         gen₂ x = if x == y then d₁ else gen x\n            \
    \             in eval gen₂ e₂\n```\n\nObserve that, because e₂ has the additional\
    \ `let`-bound variable in scope, we evaluate it with the extended generator `gen₂`,\
    \ which maps the free variables to their given `gen` meaning and the new `let`-bound\
    \ variable `y` to the meaning `d₁` of `e₁`. The definition of `abstractD` is as\
    \ before, now with support for sharing.\n\n### Sharing for sparse maps\n\nNow,\
    \ `abstractD (λX -> 5) example₄'` reduces to an intermediate form with only one\
    \ (⊕) operation, and if we commit for the tangent to the sparse module, this reduces\
    \ further in a way that nicely preserves the sharing.\n\n```\nlet y = N 5 ⊕ₑ N\
    \ 5 one in (y ⊗ y)\n≡ let y = N 5 (X -> 1) ⊕ₑ N 5 (X -> 1) in (y ⊗ y)\n≡ let y\
    \ = N 10 (fromList [(1, 2)]) in (y ⊗ y)\n≡ N (10 × 10) (fmap (10 x) (X -> 2) ⊕\
    \ fmap (10 x) (X -> 2))\n≡ N 100 ((X ↦ 20) ⊕ (X ↦ 20))\n≡ N 100 (X ↦ 40)\n```\n\
    \n### Sharing for functions\n\nHowever, if we use a function-based module representation,\
    \ such as Dense and our three reverse-mode variants, then the (⊕) is duplicated\
    \ again later in the evaluation. This happens because the (⊕) under the function\
    \ binder is not reduced until the function is applied. When both references of\
    \ the shared function are applied, the (⊕) in its body will be evaluated each\
    \ time. The following shows this for dense functions because it is the simplest\
    \ of the function-based representations.\n\n```\nlet y = N 5 ⊕ N 5 one in (y ⊕\
    \ y)\nlet y = N 5 (X ↦ 1) ⊕ N 5 (X ↦ 1) in (y ⊕ y)\n≡ let y = N 10 (X ↦ (X ↦ 1)\
    \ ⊕ (X ↦ 1)) in (y ⊕ y)\n≡ (N 10 (X ↦ (X ↦ 1) ⊕ (X ↦ 1)) ⊕ (X ↦ 1) ⊕ ...\n≡ N\
    \ (10 × 10) ((X X' ↦ (X X' ↦ 10 × (X X' ↦ 1) ⊕ (X X' ↦ 1) ⊕ (X ↦ 1) X') X'' +\
    \ (X ↦ 1) X') X''\n```\n\nFortunately, we can address the problem of sharing for\
    \ function-representations with a custom symbolic rule for Let (Proof in Appendix\
    \ B).\n\n> Lemma 1 (Let rule).\n> ∂(let y = e₁ in e₂) / ∂xᵢ = ∂e₂ / ∂y | y=e₁\
    \ × ∂e₁ / ∂xᵢ + ∂e₂ / ∂xᵢ | y=e₁\n\nFor instance, the expression example₄ has\
    \ partial derivative:\n\n```\n∂example₄ / ∂x = ∂(y × y) / ∂y | y=x+x × ∂(x + x)\
    \ / ∂x + ∂(y × y) / ∂x | y=x+x\n= ((x + x) + (x + x)) × (1 + 1) + 0\n```\n\nThis\
    \ formula (Lemma 1) is captured in a Letin type class with a method letin, which\
    \ in turn is defined in terms of abs :: e → v → d of the CorrectAD type class,\
    \ that extracts the v-component of a d-module e.\n\n```\nclass CorrectAD v e ⇒\
    \ Letin v d e where\nletin :: v → e → e → e\nletin y d e₁ e₂ = (abs d y • e₁)\
    \ ⊕ d\n```\n\nWe specialize the evaluator used by abstractD to use this formula,\
    \ also specializing its type d to d ⋈ e.\n\n```\neval :: (Eq v, Letin v d e) ⇒\
    \ (v → d ⋈ e) -> Expr v -> d ⋈ e\n...\neval gen (Let y e₁ e₂) =\n  let N f₁ d₁\
    \ = eval gen e₁\n      gen₂ x = λx → if x ≡ y then N f₁ (delta y) else gen x\n\
    \      N f₂ d₂ = eval gen₂ e₂\n  in N f₂ (letin y d₁ f₂ d₂)\n```\n\nThis evaluator\
    \ uses the standard substitution behavior for the primal, but defers to the letin\
    \ method of the Letin type class for the behavior of the tangent. If we inline\
    \ and specialize letin for d ⇀ Cayley (Sparse v d), we get a tight definition\
    \ that computes the maps produced by dₑ and dₑ only once.\n\n```\ninstance (Ord\
    \ v, Semiring d) ⇒ Letin v d (Cayley (Sparse v d)) where\nletin y d e₁ e₂ = λm\
    \ m → let m' = dₑ m in dₑ₁ (m' ?y m')\n```\n\nWith the above definition, the let-sharing\
    \ is properly preserved.\n"
