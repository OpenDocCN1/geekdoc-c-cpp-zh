  - "[PAGE 21]\n\n# Complications\n\nIn order to get the main points across, we have\
    \ ignored two complicating aspects above.\n\nNestly, the way the Let case of eval\
    \ extends the generator gen results in a lookup time that is linear in the number\
    \ (L) of nested let-bindings. A more efficient datastructure (a map or array)\
    \ can be used instead to improve the lookup time complexity to O(log L) or O(1).\n\
    \nSecondly, we have implicitly assumed that let-bound variables do not shadow\
    \ other variables, be they free variables or other let-bound variables. To support\
    \ shadowing, the partial derivative for the shadowed variable y—or at least, as\
    \ much of it as has been accumulated so far in m—should be saved before running\
    \ dx2 and restored afterwards. Regardless, other than for debugging purposes,\
    \ one may want to purge the partial derivative for the let-bound variable y from\
    \ m' as it is no longer relevant. Both together are accomplished as follows.\n\
    \n```\nletin y de1 de2 = λn m → let old = lookup m y\n                       \
    \         m' = de2 n m\n                                in de1 (m' ! y) (update\
    \ (const old) y m')\n```\n\n# 7. Related work\n\nThere is a vast amount of literature\
    \ on automatic differentiation since the idea was first presented by Wengert [3].\n\
    \n# State-of-the-art AD algorithms\n\nMuch of the effort in recent years has been\
    \ devoted to establishing the correctness of different AD variants, and to extending\
    \ the supported language features. Most works focus on the operational semantics\
    \ of formal calculi they define, and reason about the correctness of their AD\
    \ approaches in operational terms. One of the most comprehensive and accessible\
    \ of these, in our view, is the recent work of Krawiec et al. [12]. It too goes\
    \ through several steps of refinement, from a standard forward mode AD to an efficient\
    \ reverse mode variant. While we present several purely functional map-based variants,\
    \ their main focus is the imperative version, which uses a defunctionalized form\
    \ of d → STCovy d representation that resembles the so-called trace or Wengert\
    \ list [3] used in many AD implementations. They cover several additional language\
    \ features, which we believe can also be incorporated into our approach, such\
    \ as support for higher-order functions, sum and product types.\n\nA virtue of\
    \ their paper is in identifying criteria for a (successful!) approach to AD: that\
    \ it should demonstrate efficient reverse-mode AD; that it be higher-order; that\
    \ it be asymptotically efficient; and that it be provably correct. The approach\
    \ we have presented here, thanks to our careful algebraic treatment, ensures that\
    \ (functional) correctness is more or less immediate, and that our approach has\
    \ type-class efficiency relative to the computation of the primal follows from\
    \ our use of a single abstract constraint class abstractD, based on eval; and\
    \ our ability to capture all the various modes of AD may be seen as arising by\
    \ careful instantiation of Nagata's foundational construction, which nevertheless\
    \ may be summarised in completely elementary terms by the Semiring typeclass instance\
    \ given in Section 3.2.\n\nThe authors of [12] give only informal arguments for\
