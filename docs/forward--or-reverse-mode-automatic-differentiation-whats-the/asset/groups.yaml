    ## 正向或反向模式自动微分：有什么区别？


    Birthe van den Berg a,*, Tom Schrijvers a, James McKinna b, Alexander Vandenbroucke
    c


    a KU Leuven, Celestijnenlaan 200A, Leuven, Belgium b Heriot-Watt University, Edinburgh
    Campus, G2, Edinburgh EH14 4AS, United Kingdom c Standard Chartered, 1 Basinghall
    Avenue, London, EC2V 5DD, United Kingdom


    ## 文章信息


    文章历史：

    收稿日期：2022年12月22日

    修回日期：2023年2月22日

    接受日期：2023年8月9日

    在线发布日期：2023年8月15日


    关键词：

    自动微分

    凯莱表示

    半模

    Nagata理想化

    克罗内克


    ## 摘要


    自动微分（AD）一直是许多学科研究人员关注的课题，自其应用于机器学习和神经网络以来，其受欢迎程度不断提高。尽管许多研究人员欣赏并知道如何应用 AD，但真正理解其底层过程仍然是一项挑战。然而，从代数角度来看，AD
    的用例显得很自然：它源自于变体的微分。在这项工作中，我们使用代数特征语法（Algebraic Feature Grammars）来形式化两种不同的 AD 变体，并利用
    Haskell 来说明我们的观察。我们的发现源于三个基本的代数抽象：（1）半模的概念，（2）Nagata 的“模的理想化”构造，以及（3）克罗内克三角函数，它们共同使我们能够用一行抽象定义来描述
    AD。从这一单行定义出发，并通过以多种方式实例化我们的代数结构，我们推导出不同的 AD 变体，它们具有（几乎）相同的计算成本，但具有不同的属性，主要体现在（渐近）计算复杂性方面。我们展示了如何通过克罗内克同构获得不同的变体，这是对我们
    Haskell 基础设施的进一步阐述，它通过构造保证了正确性。有了这个框架，本文旨在从代数角度来阐明这一问题，使 AD 变体更易理解。© 2023 The
    Author(s). 由 Elsevier B.V. 出版。本文是根据 CC BY 许可发布的开放获取文章 (http://creativecommons.org/licenses/by/4.0/)。


    ## 1. 引言


    人工智能中的许多算法不仅关键依赖于算术表达式的高效大规模求值，还依赖于在特定点上对其偏导数进行求值 [1,2]。符号微分和数值微分可用于这些计算，但分别存在性能和准确性问题。因此，第三种方法——自动微分（AD）[3]——备受关注。AD
    能够高效且准确地求出由基本算术运算以及指数、对数和三角函数组成的任何计算的导数。


    自 Wengert [3] 首次引入自动微分以来，正统的观点将其视为一种全程序变换。它伴随着从底层数值计算语言的原始操作求值转向所谓的双数（最初由 Clifford
    [4] 提出，远早于其随后在 AD 中的应用）上的求值。各种 AD 模式（正向、反向、混合）随后作为对这一基本图景的进一步优化出现，旨在高效地组织和遍历底层数据结构，通常利用可变性。


    关于 AD 的文献浩如烟海，此处无法一一综述，涵盖了对 Wengert 原始方法在所有可能方向上的扩展：算法改进、语言设计和扩展表达性、新颖应用等等。本文的贡献并非进一步扩展这一工作成果，而是从代数角度重新审视原始算法。遵循
    Bird 和 de Moor 的《编程代数》[5]，我们展示了如何使用代数从基本可执行规范（用纯函数式编程语言 Haskell 表达）中（重新）推导现有的
    AD 算法。所涉及的代数主要由标准构造组成（一个显著的例外是下文 3.2 节中描述的 Nagata 构造），由于它们产生同构的数学对象，因此没有外延后果。然而，它们确实使不同算法变体之间的函子等价成为可能。在代数层面，代数推导的表示变化正是使我们能够利用内涵方面（具体来说，改变计算复杂性）的关键。


    具体来说，本文作出以下贡献。


    - 首先，我们展示了如何从代数角度将符号微分和符号表达式求值都视为来自自由半环的唯一半环同态。从代码角度看，它们都是相同的类 fold 递归方案的实例。这种代数视角首先使我们能够融合这两个同态以获得基本的正向模式
    AD，然后将符号微分恢复为其一个实例（第 2 节）。


    - 接下来，我们用三个基本的代数抽象来抽象 AD 模型，其规范和（等式）属性通过 Haskell 类型类来实现：半环上的模、双数的一种推广（我们称之为 Nagata
    数，其构造最初归功于 Nagata [6]）以及克罗内克三角函数。这个抽象算法可以轻松实例化为一种更高效的正向模式 AD，它一次性计算整个偏导数梯度向量（第
    3 节）。


    - 然后，我们展示了如何通过使用同构表示替换梯度的表示，利用 Elliott 的类型类态射方法 [7] 来获得抽象算法的其他实例。这在稀疏表示上得到了演示（第
    4 节）。


    - 使用上述方法，我们最终推导出反向模式 AD 的纯函数式和命令式变体：我们逐步改进基于同态的表示的标量乘法和梯度向量加法的时间复杂度，并切换到其等效的可变表示（第
    5 节）。


    - 作为尾声，我们展示了我们的方法很容易允许常见的有用扩展：额外的原始函数、直接使用 Nagata 数进行计算以消除构建和求值符号表达式的开销、高阶导数以及
    let 共享（第 6 节）。


    - 我们提供了该方法及不同 AD 版本的实现。


    最后，本文讨论了相关工作（第 7 节）并得出结论（第 8 节）。


    我们相信，本文对代数学家、（Haskell）程序员和 AD 专家同样可能感兴趣。虽然本文尽力做到对这三类读者都易于理解，但我们承认，这需要在下文三个方面汇合之前，处理不熟悉的概念或对熟悉概念的不熟悉表述。附录
    C 支持不熟悉 Haskell 的读者，简要介绍了本工作中使用的类型类和库函数。


    ## 2. 搭建舞台


    本节基于最小设置提供了自动微分（AD）的基本可执行定义。对于希望温和介绍此处所用方法的读者，我们参考《数学的领域特定语言》[8]。


    ### 2.1. 符号表达式及其求值


    为了专注于基本的算法机制，在本文的大部分内容中，我们简化为一个最小的编程语言，其中可以表达函数：符号表达式 Expr v，它捕获变量 v 上的多项式，这些变量相互独立：¹


    ```haskell

    data Expr v = Var v | Zero | Plus (Expr v) (Expr v) | Times (Expr v) (Expr v)

    ```


    例如，对于一元表达式，我们可以定义一个带有一个变量的类型 X。x × (x + 1) 的符号表示在示例¹中捕获。


