- pgno: 25
  md: 'The selection of the appropriate dictionary is known as type class resolution
    and directed by the type at which the methods are used. Because every type can
    have at most one instance of a type class, there is always at most one appropriate
    dictionary.


    We can also abstract over the particular type used with a type variable d. Then
    the type variable is subject to the type class constraint Semiring d. This means
    that d can be freely chosen as long as it has a Semiring instance. This is known
    as constrained polymorphism.


    ```

    expr :: Semiring d => d -> expr = one ⊕ one

    ```


    Under the hood, the type class constraint is transformed into an explicit dictionary
    parameter.


    ```

    expr :: SemiringDict d -> d expr = d ⊕ (d).one d.one

    ```


    When using such a constraint polymorphic definition at a specific type, the Haskell
    compiler implicitly provides the appropriate dictionary parameter. For example,
    it turns expr :: Expr v into expr semiringExprDict :: Expr v.


    In multi-parameter type classes, i.e., type classes with multiple parameters in
    their signature (e.g., Module d e), we can declare functional dependencies between
    parameters to aid type class resolution. A functional dependency indicates that
    one type parameter is uniquely determined by the other(s). For example, our Module
    class uses such a functional dependency:


    ```

    class (Semiring d, Monoid e) => Module d e | e -> d where ...

    ```


    Here the semiring type d can be determined from type e.


    For a more thorough introduction to type classes and Haskell in general, we refer
    to Bird [46] and Hutton [47].


    # C.2. Maps


    The functions below are from Haskell''s Data.Map library,14 copied with their
    type signature and explanation.


    +   • (!) :: Ord k => Map k a -> k -> a O(log n). Find the value at a key. Calls
    error when the element can not be found.

    +   • findWithDefault :: Ord k => a -> k -> Map k -> a O(log n). The expression
    findWithDefault def k map returns the value at key or returns default value def
    when the key is not in the map.

    +   • fromList :: Ord k => [(k, a)] -> Map k a O(n * log n). Build a map from
    a list of key/value pairs. If the list contains more than one value for the same
    key, the last value for the key is retained.

    +   • unionWith :: Ord k => (a -> a -> a) -> Map k a -> Map k a -> Map k a O(n
    + m). Union with a combining function. The implementation uses the efficient hedge-union
    algorithm.

    +   • insertWith :: Ord k => (a -> a -> a) -> k -> a -> Map k a -> Map k a O(log
    n). Insert with a function, combining new value and old value. insertWith f key
    value mp will insert the pair (key, value) into mp if key does not exist in the
    map. If the key does exist, the function will insert the pair (key, f new_value
    old_value).


