    \nFig. 3. The laws for a D-module E over a semiring D, where E is a commutative\
    \ monoid. We overload the monoidal operation ⊕ for the corresponding Semiring,\
    \ to emphasise its additive interpretation.\n\n```\nfmap (eval Var) ∘ symbolic\n\
    = ( - reflection property (Property 2 ) - )\nfmap id ∘ symbolic\n= ( - functor\
    \ law and id as unit of composition - )\nsymbolic\n```\n\nIn summary, symbolic\
    \ is a special case of forwardAD:\n\n```\nsymbolic = forwardAD Var\n```\n\nThis\
    \ sets the stage for the remainder of this paper: we use algebraic techniques\
    \ to reason about the structure of differentiation algorithms and by exposing\
    \ more abstract structure, one and the same abstract algorithm (Section 3) subsumes\
    \ various concrete AD flavors.\n\n# 3. Abstract automatic differentiation\n\n\
    The central claim of this paper is that we can express the two previous differentiation\
    \ functions (symbolic differentiation and classic forward-mode AD) as well as\
    \ several more variants to come later, as the same one-line generic program. This\
    \ section identifies three fundamental algebraic structures to accomplish this:\
    \ d-modules e, generalized dual numbers d × e, and the Kronecker delta function.\
    \ It also shows how to instantiate these to recover a version of forward-mode\
    \ AD that computes the gradient vector of all partial derivatives at once, rather\
    \ than for a single variable at a time.\n\n# 3.1. Modules over semirings\n\nOur\
    \ first abstraction generalizes the notion of gradient ∇e of an expression e.\n\
    \n```\n∇e = [ ∂e/∂x1 ]\n     [ ...    ]\n     [ ∂e/∂xn ]\n```\n\nBy analogy with\
    \ vector spaces (over a field) or modules (over a ring), we consider semimodules\
    \ over a semiring d [15], which we refer to as d-modules.\n\nDefinition 3 (Semimodule).\
    \ Given a semiring D, then a D-module E is defined as a commutative monoid E,\
    \ together with scalar multiplication (●) : D × E → E, which distributes over\
    \ the additive structure of E. This means that E should have a commutative, associative\
    \ binary operator ⊕ with neutral element zero. Fig. 3 gives E’s monoid laws and\
    \ the laws that govern the interaction between the monoid structure of E and a\
    \ scalar multiplication."
