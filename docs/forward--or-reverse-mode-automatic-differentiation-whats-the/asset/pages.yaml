    \ h⁻¹ x)\ninstance Kronecker V D E where\n  delta v = h (deltaDense v)\ninstance\
    \ CorrectAD V D E where\n  rep h = h\n  abs = h⁻¹\n```\n```\n\nBy construction,\
    \ these instances both (1) satisfy all the necessary laws, and (2) ensure that\
    \ h is a Kronecker isomorphism. For example, we can verify that x ⊕ zero = x and\
