  md: 'Below, we document the ST monad from Haskell''s Control.Monad.ST library.16


    +   • data ST s a


    The ST monad allows for destructive updates, but is escapable. A computation of
    type ST s a returns a value of type a, and execute in “thread” s. It serves to
    keep the internal states of different invocations of runST separate from each
    other.


    +   • runST :: (forall s. ST s a) -> a


    Return the value computed by a state thread. The forall ensures that the internal
    state used by the ST computation is inaccessible to the rest of the program.


    Below, we document the STArray''s from Haskell''s Data.Array.ST library.17


    +   • data STArray s i e


    Mutable, boxed, non-strict arrays in the ST monad. s is the state variable argument
    for the ST type, i is the index type of the array (should be an instance of Ix),
    and e is the element type of the array.


    # C.4. Other


    Below, we document the foldMap function from Haskell''s Data.Foldable library.18


    +   • foldMap :: Monoid m => (a -> m) -> t a -> m


    Map each element of the structure into a monoid, and combine the results with
    (<>). This fold is right-associative and lazy in the accumulator.


    Below, we document the ReaderT monad transformer taken from Haskell''s Control.Monad.Trans.Reader
    library.19


    +   • newtype ReaderT r m a = ReaderT {runReaderT :: r -> m a}


    The reader monad transformer, which adds a read-only environment to the given
    monad m. The return function ignores the environment, while (>>=) passes the inherited
    environment to both subcomputations.


