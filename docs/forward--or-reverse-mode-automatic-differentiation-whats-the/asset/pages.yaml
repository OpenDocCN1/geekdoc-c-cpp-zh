    \ → d. Our more general setting does not consider such normed/inner product structure\
    \ on our d-modules e, but we expect that such richer structure may be smoothly\
    \ incorporated into a general picture, and we leave this as a topic for future\
    \ work.\n\nWang et al. [39] show that the two passes of reverse-mode AD can be\
    \ conveniently implemented using delimited control in an impure functional setting\
    \ like Scala; they provide no formal argument for its correctness.\n\nKmett's\
