    \ semirings\n\nWe can generalize our approach from commutative semirings to semirings\
    \ with non-commutative multiplication (⊗), such as (square) matrices over semi-rings\
    \ and the semiring of formal languages over an alphabet.\n\nThe key change in\
    \ our approach is that rather than starting from the following rule for symbolic\
    \ differentiation, which exploits the commutativity:\n\n```\nderive x (Times e1\
    \ e2) = (e2 ⊗ derive x e1) ⊕ (e1 ⊗ derive x e2)\n```\n\nwhere e1 and e2's derivatives\
    \ are both scaled on the left, we instead use the more conventional rule:\n\n\
    ```\nderive x (Times e1 e2) = (derive x e1 ⊗ e2) ⊕ (e1 ⊗ derive x e2)\n```\n\n\
    which scales derive x e2 on the left and derive x e1 on the right.\n\nMore abstractly,\
    \ we can model this with d-d-bimodules that feature distinct left-scaling and\
    \ right-scaling operators.\n\n```\n```\nclass Semiring d => Bimodule d e | e ->\
    \ d where\n  (⊙) :: d -> e -> e\n  (⊙) :: e -> d -> e\n```\n```\n\nNote that,\
    \ for every d whose multiplication is commutative, every Module d e instance gives\
    \ rise to a Bimodule d e instance, by taking the two scaling operations to be\
    \ the same underlying (⊙) operation. If multiplication in d is not commutative,\
    \ nevertheless the distinguished case e = d yields a Bimodule structure with (⊙)\
    \ resp. (⊙) given by left-(resp. right-) multiplication (see below). However,\
    \ it is not sufficient to take (a restricted subset of) d -> e as a representative\
    \ of the set of Bimodule homomorphisms from d to e.\n\nInstead, we can avoid introducing\
    \ this new d-d-bimodule abstraction and reuse the existing Module-related infrastructure\
    \ by means of (d, d)-modules. At the core of this idea is the following semiring\
    \ construction for pairs.\n\n```\n```\ninstance Semiring d => Semiring (d, d)\
    \ where\n  zero = (zero, zero)\n  one = (one, one)\n  (lx, rx) ⊕ (ly, ry) = (lx\
    \ ⊕ ly, rx ⊕ ry)\n  (lx, rx) ⊗ (ly, ry) = (lx ⊗ ly, ry ⊗ rx)\n```\n```\n\nThis\
    \ is the usual component-wise instance, with one exception: the factors in the\
    \ multiplication are flipped for the second component. Then d is a (d, d) module\
    \ as follows:\n\n```\n```\ninstance Semiring d => Module (d, d) d where\n  (l,\
    \ r) • d = l ⊗ d ⊗ r\n```\n```"
