  md: '```

    ```

    type Cayley e = e -> e

    rep₀ :: Monoid e => e -> Cayley e

    rep₀ e = λe'' -> e'' ⊕ e

    abs₀ :: Monoid e => Cayley e -> e

    abs₀ f = f zero

    ```

    ```


    This representation typically implies another “strength reduction”, namely from
    e’s binary operator (⊕) to function composition (∘). We thereby reduce the time
    complexity of addition from O(V) for Sparse v d to O(1) for Cayley (Sparse v d).


    ```

    ```

    instance Monoid (Cayley e) where

    zero = id

    f ⊕ g = g ∘ f

    ```

    ```


    We derive the Module and Kronecker instances following our standard recipe. However,
    we cannot eliminate the expensive operations from the Cayley e instances for Module
    and Kronecker. Indeed, the Module instance requires converting from Cayley e to
    e and back, where notably rep₀ re-introduces e’s expensive O(V) addition operation
    (⊕), which we have just managed to eliminate from the Monoid instance.


    ```

    ```

    instance Module d e => Module d (Cayley e) where

    d • f = rep₀ . (d • abs₀ . f)

    ```

    ```


    The Kronecker instance derived via rep₀ from e similarly features e’s addition
    operation (⊕).


    ```

    ```

    instance Kronecker v d e => Kronecker v d (Cayley e) where

    delta v = λe -> e ⊕ delta v

    ```

    ```


    Fortunately, we can again define a specialized Kronecker instance for the type
    e = d ↝ Cayley (Sparse v d), which avoids appeal to the expensive ⊕ operation.
    Indeed, the (⊙) operation defined on e need not make use of that defined on Cayley
    (Sparse v d). For the specialized delta, we instead calculate:


    ```

    ```

    delta v = {- definition of delta for d ↝ -}

    λd -> d • delta v

    = {- definition of (⊙) and delta for Cayley -}

    λd -> rep₀ . (d • abs₀) . (λe -> e ⊕ delta v)

    = {- definition of rep₀, and abs₀ -}

    λd -> λe -> e ⊕ (d • (λe -> e ⊕ delta v) zero)

    = {- β-reduction and unit of monoid (Fig. 3) -}

    λd -> λe -> e ⊕ (d • delta v)

    = {- equation (2) -}

    λd -> λe -> insertWith (⊙) v d e

    = {- η-reduction -}

    λd -> insertWith (⊙) v d

    ```

    ```


    Hence, we obtain an implementation of delta that takes only O(log V) time.


    ```

    ```

    instance (Ord v, Semiring d) => Kronecker v d (d ↝ Cayley (Sparse v d))

    where delta = insertWith (⊙)

    ```

    ```


    Moreover, the Cayley e representation preserves the correctness of e.


    ```

    ```

    instance CorrectAD v d e => CorrectAD v d (Cayley e) where

    rep = rep₀ . rep

    abs = abs₀ . abs₀

