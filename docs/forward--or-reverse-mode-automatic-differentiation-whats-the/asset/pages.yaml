  md: "This way we can evaluate example₁ for X = 5 with the Int semiring.\n\n```\n\
    > eval (λX → 5) example₁\n30\n```\n\n# 2.2. Homomorphisms\n\nThe notion of free\
    \ semiring, the associated eval function and its properties are special cases\
    \ of generic results from the Algebra of Programming [5] which hold for any algebraic\
    \ structure. Another related notion, which will turn out to be central to this\
    \ paper, is that of homomorphism. Informally, this is a function that preserves\
    \ algebraic structure. More formally,\n\nDefinition 2 (Semiring homomorphism).\
    \ A (semiring) homomorphism between two semirings D₁ and D₂ is a function h ::\
    \ D₁ → D₂ that preserves the semiring structure:\n\nh zero₁ = zero₂          h\
    \ (x ⊕₁ y) = h x ⊕₂ h y\none₁ = one₂             h (x ⊗₁ y) = h x ⊗₂ h y\n\nSemiring\
    \ homomorphisms compose: given homomorphisms h₁ :: D₁ → D₂ and h₂ :: D₂ → D₃,\
    \ their composition h₂ ∘ h₁ :: D₁ → D₃ is also a homomorphism; and the expected\
    \ laws hold. Furthermore, the identity function id :: D → D is trivially a homomorphism.\
    \ The function eval var is a homomorphism for any choice of var. In fact, it is\
    \ the unique homomorphism h such that h (Var v) = var v. From this uniqueness\
    \ property follow two useful properties:\n\nProperty 1 (Fusion). The fusion property\
    \ allows us to incorporate any homomorphism h into evaluation: h ∘ eval var =\
    \ eval (h ∘ var).\n\nProperty 2 (Reflection). The reflection property observes\
    \ that evaluation with Var is the identity: eval Var = id.\n\n# 2.3. Symbolic\
    \ differentiation and dual numbers\n\nThe eval homomorphism also allows us to\
    \ do symbolic differentiation. We capture its rules in the derive function, using\
    \ the Semiring instance of Expr v, and exploiting the commutativity in the multiplication\
    \ case.\n\n```\nderive :: Eq v ⇒ v → Expr v → Expr v\nderive x (Var y)   = if\
    \ x == y then one else zero\nderive x Zero      = zero\nderive x One       = zero\n\
    derive x (Plus e₁ e₂) = derive x e₁ ⊕ derive x e₂\nderive x (Times e₁ e₂) = (e₂\
    \ ⊗ derive x e₁) ⊕ (e₁ ⊗ derive x e₂)\n```\n\nThese do not fit eval's fold-style\
    \ recursion scheme because, in the case for Times, e₁ and e₂ appear outside of\
    \ recursive calls (gray). Using the so-called “banana-split” property [3–11],\
    \ we can turn this function into the proper shape: we make it return a tuple (Expr\
    \ v, Expr v) of the original expression and the symbolic derivative.\n\n```\n\
    derive' x e = (e, derive x e)\n```\n\nWe thus obtain the following structurally\
    \ recursive definition for derive', from which we may then recover derive by projecting\
    \ on the second component:\n\n```\nderive' :: Eq v ⇒ v → Expr v → (Expr v, Expr\
    \ v)\nderive' x (Var y)   = (Var y, if x == y then one else zero)\nderive' x Zero\
    \      = (zero, zero)\nderive' x One       = (one, zero)\nderive' x (Plus e₁ e₂)\
    \ = let (e'₁, d₁) = derive' x e₁\n                             (e'₂, d₂) = derive'\
    \ x e₂\n                             in (e'₁ ⊕ e'₂, d₁ ⊕ d₂)\nderive' x (Times\
    \ e₁ e₂) = let (e'₁, d₁) = derive' x e₁\n                             (e'₂, d₂)\
    \ = derive' x e₂\n                             in (e'₁ ⊗ e'₂, (e'₂ ⊗ d₁) ⊕ (e'₁\
    \ ⊗ d₂))\n```"
