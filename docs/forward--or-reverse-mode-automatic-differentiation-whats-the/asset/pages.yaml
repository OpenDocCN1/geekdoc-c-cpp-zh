    \ have to make disciplined use of d -> e, being careful to avoid the non-linear\
    \ ones. Intuitively, we can think of d -> e as augmenting e with an accumulator\
    \ for a scalar multiplier of type d. By supplying the scalar one, we recover the\
    \ original module.\n\n```\n```haskell\nrep_- :: Module d e => d -> e -> (d ->\
    \ e)\nrep_e e = \\x d -> d • e\nabs_- :: Module d e => (d -> e) -> e\nabs_- f\
    \ = f one\n```\n```\n\nIn particular, as one e • e = e (Fig. 3), we have that\
    \ abs_- o rep_- = id. Moreover, for linear functions also rep_- o abs_- = id.\
    \ Now we derive Monoid, Module and Kronecker instances that make rep_- a homomorphism\
    \ by construction. It follows that d -> e inherits its monoid structure in a pointwise\
    \ fashion from e. For e = Dense v d, the time complexity for additive operations\
    \ remains linear in the number of variables.\n\n```\n```haskell\ninstance Monoid\
    \ e => Monoid (d -> e) where\n  zero = \\x d -> zero\n  f ⊕ g = \\x d -> f x d\
    \ ⊕ g x d\n```\n```\n\nFurthermore, its d-module structure uses the function parameter\
    \ as an accumulator for the scalar multiplier. This affords a \"strength reduction\"\
    : the expensive scalar multiplication (•) is replaced by the cheaper semiring\
    \ multiplication (⊕).\n\n```\n```haskell\ninstance Module d e => Module d (d ->\
    \ e) where\n  d' • f = \\x d -> f (x ⊕ d d)\n```\n```\n\nThis reduces the time\
    \ complexity of scalar multiplication from O(|V|) (where V denotes the number\
    \ of variables with non-zero values in the given sparse map) for the Sparse v\
