    \ N (sin f) (cos • df)\n  cos (N f) df = N (cos f) (-sin • df)\n```\n```\n\nObserve\
    \ that, while d must now also have a Trig instance, no additional demands are\
    \ made of e. Hence, all the AD variations we have covered, which are only based\
