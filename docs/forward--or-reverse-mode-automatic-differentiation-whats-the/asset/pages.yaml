    Fig. 4. Reverse-mode AD of x × (x + 1) × (x + ·), for x = 5.


    Fig. 4 shows that this computation effectively works in multiple passes, which
    is a key characteristic of reverse-mode AD. During the forward (bottom-up) pass
    (shown by the black arrows), the algorithm computes Nagata numbers, which contain
    the value of each sub-expression, and the dependencies between the nodes as function
    closures c : d ⇢ Spare v, d, e.g. N 300 c$_{\ominus_2}$ for the final outcome.
    In the backward (top-down) pass (shown by the red left-to-right arrows), we invoke
    the function closure c$_{\ominus_2}$ on argument one (using abs$_{\rightarrow}$).
    It propagates the scalar accumulator downwards. At each downward step, the accumulator
    changes to reflect how much the overall derivative changes given that the subexpression
    changes by one. Finally, the results at the leaves are added (shown by the blue
    right-to-left arrows) to yield the overall derivative. The conventional imperative
    algorithms typically accomplish this with imperative updates. We derive that form
    in Section 5.3, but first we address the linear cost of addition.


    # 5.2. Accumulating additions


    We can optimize the additive structure of d-modules in much the same way as we
    have optimized scalar multiplications: by considering a representation of e →
    e functions that have the additive homogeneity property:


    ```

    f (x ⊗ y) = x ⊗ f y

    ```


    This representation is also known as the Cayley representation [23,24] of e, the
    most well-known example of which is difference lists [25] or Hughes lists [26].
    Again, the Haskell type e → e includes functions that do not have the homogeneity
    property; those are not included in the Cayley e type.


    a Preservation of addition follows from the fact that the result of f is a semimodule.'
