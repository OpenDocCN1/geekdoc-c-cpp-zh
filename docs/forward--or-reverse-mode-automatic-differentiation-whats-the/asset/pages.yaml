  md: "```\nidentity:\nzero ⊕ x = x ⊕ zero\none ⊗ x = x = x ⊗ one\n\nassociativity:\n\
    x ⊕ (y ⊕ z) = (x ⊕ y) ⊕ z\nx ⊗ (y ⊗ z) = (x ⊗ y) ⊗ z\n\ndistributivity:\nx ⊗ (y\
    \ ⊕ z) = (x ⊗ y) ⊕ (x ⊗ z)\n(x ⊕ y) ⊗ z = (x ⊗ z) ⊕ (y ⊗ z)\n\nannihilator: zero\
    \ ⊗ x = zero = x ⊗ zero\n```\n\nFig. 1. The commutative semiring laws.\n\n```\n\
    data X = X\nexample₁ : Expr X\nexample₁ = Times (Var X) (Plus (Var X) One)\n```\n\
    \nWe assign an overloaded meaning to symbolic expressions by mapping them to a\
    \ (commutative) semiring. The 'semi' in semiring refers to the fact that a semi-ring\
    \ is a ring that does not need to have an additive inverse. We omit it here because\
    \ AD does not require it. Nevertheless, Section 6.1 shows that, if such an inverse\
    \ exists, it can be accommodated. The commutativity requirement we impose is not\
    \ essential, but simplifies the presentation. Section 6.2 extends the approach\
    \ to non-commutative semirings, which is necessary to support, for instance, matrices.\
    \ The overloading gives us the flexibility to interpret expressions in terms of\
    \ both their plain value and of different AD flavors.\n\nDefinition 1 (Semiring).\
    \ A semiring is a set, together with two binary operators ⊕ (\"addition\") and\
    \ ⊗ (\"multiplication\") and two distinguished elements zero and one. These should\
    \ obey the laws of Fig. 1: ⊕ and ⊗ should both be associative and commutative\
    \ and have neutral elements zero and one respectively. Moreover, ⊗ should distribute\
    \ over ⊕ and have zero as annihilator.\n\nIn Haskell, we capture the algebraic\
    \ concept of a semiring in the Semiring type class, with instances for numeric\
    \ types (e.g., Int, Float⁴) that respect the laws.\n\n```\nclass Semiring d where\n\
    \  zero : d\n  one : d\n  (⊕) : d → d → d\n  (⊗) : d → d → d\n```\n\n```\ninstance\
    \ Num a => Semiring a where\n  zero = 0\n  one = 1\n  (⊕) = (+)\n  (⊗) = (*)\n\
    ```\n\nThere is one instance of semirings that is of special interest to us: that\
    \ for symbolic expressions Expr v, quotiened by the laws⁴.\n\n```\ninstance Semiring\
    \ (Expr v) where\n  zero = Zero\n  one = One\n  (⊕) = Plus\n  (⊗) = Times\n```\n\
    \nWhat makes this instance special is that it is the free semiring instance, which\
    \ gives rise to a fold-style eval function. This evaluator proceeds by structural\
    \ recursion over the symbolic expressions to map them to their interpretation\
    \ in a semiring d, given a mapping var :: v → d for variables.\n\n```\neval ::\
    \ Semiring d => (v → d) → Expr v → d\neval var (Var x) = var x\neval var Zero\
    \ = zero\neval var One = one\neval var (Plus e₁ e₂) = eval var e₁ ⊕ eval var e₂\n\
    eval var (Times e₁ e₂) = eval var e₁ ⊗ eval var e₂\n```"
