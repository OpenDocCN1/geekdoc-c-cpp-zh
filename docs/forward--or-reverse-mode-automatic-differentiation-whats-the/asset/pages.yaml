    \ deriving `example'_2` is that of fold/build fusion [27], applied to `eval var\
    \ example2`, where `example2` is an instance of the builder pattern, building\
    \ a symbolic expression, and `eval` is a fold. Fold/build fusion eliminates the\
    \ intermediate symbolic structure and directly builds the result of evaluation.\
    \ Gibbons and Wu [28] show how to exploit such structure systematically (generalising\
    \ to all algebraic structures defined by Haskell type classes, not only `Semiring`s),\
    \ by restructuring the underlying terms in terms of symbolic expressions `Expr\
    \ v` with the corresponding shallow embedding `VarSemiring d => (v -> d) -> d`.\
