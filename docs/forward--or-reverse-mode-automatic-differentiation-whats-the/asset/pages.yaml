  md: "```\ndelta x = [1 0 0]\ndelta y = [0 1 0]\ndelta z = [0 0 1]\n```\n\nIn the\
    \ AD literature, these basis vectors, where one entry is one and all the other\
    \ are zero, are often referred to as one-hot vectors.\n\n# 3.4. Abstract automatic\
    \ differentiation\n\nWith the three algebraic structures in place, we present\
    \ our abstract definition of differentiation.\n\n```\nabstractD :: Kronecker v\
    \ d => e -> (v -> d) -> Expr v -> d × e\nabstractAD var = eval gen where gen x\
    \ = N (var x) (delta x)\n```\n\nNext, we show how this abstract definition can\
    \ be instantiated to recover forwardAD. Later, we vary e to obtain more efficient\
    \ versions.\n\n# 3.5. Base case: forward-mode AD as AD in the dense function space\n\
    \nWe recover forwardAD—the classical forward-mode AD implementation given in Section\
    \ 2.4—as an instance of abstractD, by using the standard function space e = v\
    \ -> d. We call this space Dense to contrast with the sparse function space coming\
    \ up in Section 4.3: by analogy with dense/sparse polynomial representations in\
    \ computer algebra [16].\n\n```\ntype Dense v d = v -> d\n```\n\nInformally, we\
    \ can think of this structure as a functional representation of a gradient vector,\
    \ required by least square fitting, gradient descent and many other applications.\
    \ Just like a gradient vector, it contains one d-value per variable of type v.\
    \ The actions of its monoid and d-module instances are given pointwise, using\
    \ the ‘d-as-d-module construction’ of Section 3.1.\n\n```\ninstance Semiring d\
    \ => Monoid (Dense v d) where\n  zero   = λv → zero\n  f₁ ⊕ f₂ = λv → f₁ v ⊕ f₂\
    \ v\n```\n\n```\ninstance Semiring d => Module d (Dense v d) where\n  d • f =\
    \ λv → d • (f v) = λv → d ⊗ (f v)\n```\n\nThe Kronecker delta function for dense\
    \ functions is the textbook one.\n\n```\ninstance (Eq v, Semiring d) => Kronecker\
    \ v d (Dense v d) where\n  delta v = λw → if v ≡ w then one else zero\n```\n\n\
    Using this Kronecker instance and generalizing dual numbers into d × (Dense v\
    \ d), we obtain the following definition for forward-mode AD.\n\n```\nforwardAD_dense\
    \ :: (Eq v, Semiring d) => (v -> d) -> Expr v -> d × (Dense v d)\nforwardAD_Dense\
    \ = abstractD\n```\n\nThis is forwardAD with its parameters re-arranged and Dual\
    \ d generalized:\n\n```\nprimD (forwardAD var x) = primN (forwardAD_Dense var\
    \ x)\ntanD (forwardAD var x) = tanN (forwardAD_Dense var x)\n```\n\nThe essential\
    \ difference between forwardAD and forwardAD_Dense is intensional. In moving from\
    \ computing a value in v -> d × d to one in d × (v -> d), we no longer compute\
    \ both the primal and tangent for each individual v, but instead only compute\
    \ the primal once for the whole gradient. In other words, we share the computation\
    \ of the primal among all partial derivatives. For instance, example 2 represents\
    \ expression (x × y) + x + 1 in variables x and y using our expression language."
