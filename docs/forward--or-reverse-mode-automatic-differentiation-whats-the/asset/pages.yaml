  md: "Before we write the functionality of derive' in terms of eval, we generalize\
    \ (Expr v, Expr v) to tuples whose components are drawn from an arbitrary semiring.\
    \ In the AD literature, these are known as dual numbers, originally due to Clifford\
    \ [4].\n\n```\ndata Dual d = D [pr^D :: d,\n    tan^D :: d\ninstance Functor Dual\
    \ where\nfmap :: (a -> b) -> Dual a -> Dual b\nfmap h (D f g) = D (h f) (h g)\n\
    ```\n\nDual numbers are functorial; fmap f transforms both parameters using f.\
    \ The two components of a dual number D d x are respectively known as the primal\
    \ x and the tangent dx. For a semiring d, the type Dual d also admits a semiring\
    \ structure, where the definition of tangent precisely follows the corresponding\
    \ cases of derive.\n\n```\ninstance Semiring d => Semiring (Dual d) where\nzero\
    \ = D zero zero\none = D one zero\n(D f d) + (D g dg) = D (f + g) (d + dg)\n(D\
    \ f d) * (D g dg) = D (f * g) ((g * d) + (f * dg))\n```\n\nNow, symbolic differentiation\
    \ may be seen as another instance of evaluation, but into the semiring of dual\
    \ numbers over symbolic expressions:\n\n```\nsymbolic :: Eq v => v -> Expr v ->\
    \ Dual (Expr v)\nsymbolic x = eval gen where gen y = D (Var y) (δ_x y)\nδ_x y\
    \ = if x == y then one else zero\n```\n\n# 2.4. Classic forward automatic differentiation\n\
    \nAutomatic differentiation (AD) is the umbrella term for algorithms that programmatically\
    \ compute both the value and the derivative of an expression at a point [12-14].\
    \ Thus, if we combine symbolic differentiation with subsequent evaluation into\
    \ a semiring d, we obtain a specification for forward-mode AD:\n\n```\nforwardAD\
    \ var x = fmap (eval var) o symbolic x\n```\n\nWe can make this specification\
    \ more efficient by exploiting eval's fusion property.\n\n```\nfmap (eval var)\
    \ o symbolic x\n= {- definition of symbolic -\nfmap (eval var) o eval gen where\
    \ gen y = D (Var y) (δ_x y)\n= {- eval fusion (Property 1.) -\neval (fmap (eval\
    \ var) o gen) where gen y = D (Var y) (δ_x y)\n= {- fmap (eval var) o gen -\n\
    δ_x y = if x == y then one else zero\n```\n\nAfter inlining fmap (eval var) into\
    \ gen, we get the classic definition of forward-mode AD, which calls eval only\
    \ once. Differences compared with symbolic are highlighted in gray.\n\n```\nforwardAD\
    \ :: (Eq v, Semiring d) => (v -> d) -> v -> Expr v -> Dual d\nforwardAD var x\
    \ = eval gen where gen y = D (Var y) (δ_x y)\nδ_x y = if x == y then one else\
    \ zero\n```\n\nFor example, the derivative of example_1 at the point X = 5 is\
    \ 11; the process computing the result is depicted in Fig. 2.\n\n```\n> forwardAD\
    \ (\\X -> 5) X example_1\nD 30 11\n```\n\n# 2.5. Symbolic AD as forward AD\n\n\
    Observe that the only essential difference between symbolic and automatic differentiation\
    \ is that the former evaluates into the symbolic Expr v semiring, while the latter\
    \ uses a 'numeric' semiring d. In fact, we can also have forwardAD use the symbolic\
    \ semiring, interpreting variables with Var.\n\n```\nforwardAD Var\n= {- AD specification\
    \ (Specification 2.4.) -}\n```"
