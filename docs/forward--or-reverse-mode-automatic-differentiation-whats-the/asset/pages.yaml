    ```


    Sharing for functions. However, if we use a function-based module representation,
    such as Dense and our three reverse-mode variants, then the (⊕) is duplicated
    again later in the evaluation. This happens because the (⊕) under the function
    binder is not reduced until the function is applied. When both references of the
    shared function are applied, the (⊕) in its body will be evaluated each time.
    The following shows this for dense functions because it is the simplest of the
    function-based representations.


    ```

    let y = N 5 ⊕ N 5 one in (y ⊕ y)

    let y = N 5 (X ↦ 1) ⊕ N 5 (X ↦ 1) in (y ⊕ y)

    ≡ let y = N 10 (X ↦ (X ↦ 1) ⊕ (X ↦ 1)) in (y ⊕ y)

    ≡ (N 10 (X ↦ (X ↦ 1) ⊕ (X ↦ 1)) ⊕ (X ↦ 1) ⊕ ...

    ≡ N (10 × 10) ((X X'' ↦ (X X'' ↦ 10 × (X X'' ↦ 1) ⊕ ...

    (X X'' ↦ 1) ⊕ ...

    (X ↦ 1) X'') X'''' +

    (X ↦ 1) X'') X''''

    ```


    Fortunately, we can address the problem of sharing for function-representations
    with a custom symbolic rule for Let (Proof in Appendix B).


    > Lemma 1 (Let rule).

    > ∂(let y = e₁ in e₂) / ∂xᵢ = ∂e₂ / ∂y | y=e₁ × ∂e₁ / ∂xᵢ + ∂e₂ / ∂xᵢ | y=e₁


    For instance, the expression example₄ has partial derivative:


    ```

    ∂example₄ / ∂x = ∂y × y / ∂x | y=x+x × ∂x+x / ∂x + ∂y × y / ∂x | y=x+x

    = ((x + x) + (x + x)) × (1 + 1) + 0

    ```


    This formula (Lemma 1) is captured in a Letin type class with a method letin,
    which in turn is defined in terms of abs :: e → v → d of the CorrectAD type class,
    that extracts the v-component of a d-module e.


    ```

    class CorrectAD v e ⇒ Letin v d e where

    letin :: v → e → e → e

    letin y d e₁ e₂ = (abs d₂ y) • e₁) ⊕ d₂

    ```


    We specialize the evaluator used by abstractD to use this formula, also specializing
    its type d to d ⋈ e.


    ```

    eval :: (Eq v, Letin v d e) ⇒ (v → d ⋈ e) → Exp v → d ⋈ e

    ...

    eval gen (Let y e₁ e₂) =

    let N f₁ d f₁ = eval gen e₁

    gen₂ x = λx → if x ≡ y then N f₁ (delta y) else gen x

    N f₂ d₂ = eval gen₂ e₂

    in N f₂ (letin y d f₂ d₂)

    ```


    This evaluator uses the standard substitution behavior for the primal, but defers
    to the letin method of the Letin type class for the behavior of the tangent. If
    we inline and specialize letin for d ⇀ Cayley (Sparse v d), we get a tight definition
    that computes the maps produced by dₑ and dₑ only once.


    ```

    instance (Ord v, Semiring d) ⇒ Letin v d (Cayley (Sparse v d)) where

    letin y d e₁ e₂ = λm m → let m'' = dₑ m in dₑ₁ (m'' ?y m'')

    ```


    With the above definition, the let-sharing is properly preserved.'
