    # 5. Reverse-mode automatic differentiation


    We now develop the appropriate d-module structure that exhibits reverse-mode AD
    as an instance of abstractD by refining the above sparse representation. Motivated
    by the quest for improved efficiency, we optimize the time complexity of the essential
    functions for abstract differentiation with the underlying Nagata numbers semiring:
    scalar multiplication (⊙), addition (⊕) and Kronecker''s delta.


    # 5.1. Accumulating multiplications


    We start with another function-based representation. Instead of the d-module e,
    we consider the space of d-module homomorphisms from d to e. It is a standard
    result in commutative algebra [22, p. 18] that these two structures are isomorphic,
    considered as d-modules. In terms of the underlying Haskell types, this amounts
    to taking the plain function space.


    ```

    type d -> e = d -> e

    ```


