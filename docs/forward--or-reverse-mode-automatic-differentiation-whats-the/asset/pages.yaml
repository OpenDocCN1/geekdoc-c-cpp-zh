    where gen" z = N (N (var z) (delta z)) (delta z)

    = { - abstractD definition - }

    fmap tan^n ∘ abstractD

    where gen z = N (var z) (delta z)

    ```


    The steps involving the naturality of tan^n do not concern the Functor instance
    of Natagata numbers, but their Bifunctor instance, which allows to vary both components.


    ```

    instance Bifunctor (<:>) where

    bimap f g (N d e) = N (f d) (g d)

    ```


    The general naturality property of tan^n : ∀ v d e. e -> e for this Bifunctor
    instance is:


    ```

    g ∘ tan^n = tan^n ∘ bimap f g

    ```


    However, for the specialized type tan^n : ∀ v d. (Dense v d) → Dense v d where
    the two components are not independent, we also have this specialized naturality
    property:


    ```

    fmap f ∘ tan^n = tan^n ∘ bimap f (fmap f) (A.1)

    ```


    # Appendix B. Proof of Lemma 1


    Proof. We prove this rule by means of the chain rule for multi-variate functions:


    ```

    \frac{\partial f(e_1, ..., e_n)}{\partial x} = \sum_{i=1}^n \left( \frac{\partial
    f(x_1, ..., x_n)}{\partial x_i} \right|_{x_1=e_1, ..., x_n=e_n} \times \frac{\partial
    e_i}{\partial x} \right)

    ```


    Define f as f (y, x1, ..., xn) = e2 where x1, ..., xn comprise all the free variables
    of e1 and e2. Then we have that f (e1, x1, ..., xn) = let y = e1 in e2.'
