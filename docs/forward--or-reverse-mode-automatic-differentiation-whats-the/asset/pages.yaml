  md: "In Haskell, we capture the concept of a semimodule in the type class Module,\
    \ on top of the Monoid type class.\n\n```\nclass Monoid e where\n  zero :: e\n\
    \  (⊕) :: e → e → e\n\nclass (Semiring d, Monoid e)\n=> Module d e | e → d where\n\
    \  (●) :: d → e → e\n```\n\nEvery semiring d may be viewed trivially as a d-module,\
    \ by taking (●) = (⊗). A well-known example that is not itself a semiring is the\
    \ vector space R³: it forms a monoid with vector addition and the zero vector\
    \ [ 0 0 0 ], and an R-module with the usual scalar multiplication.\n\n# 3.2. Nagata\
    \ numbers\n\nThe second abstraction generalizes dual numbers of Section 2.3 to\
    \ two components d and e that have distinct types, reflecting the idea that the\
    \ value of an expression (its primal), and that of its derivative (tangent), conceptually\
    \ live in different spaces. We exploit precisely the generalization that permits\
    \ primal and tangent to vary independently. This concept first appeared in the\
    \ work of Nagata [6] in the early 1950s, under the name “idealization of a module”.\
    \ However, the application of Nagata’s construction to the study of AD appears\
    \ to be novel. By analogy with dual numbers, we call the type d x e Nagata numbers.\n\
    \n```\ndata d x e = N { primN :: d,\n                 tanN :: e }\n\ninstance\
    \ Functor (d x ) where\n  fmap h (N f d) = N f (h d)\n```\n\nObserve that the\
    \ type constructor d x is functorial in its second parameter and a bifunctor in\
    \ both parameters (Appendix A).\n\nNagata proved the following fundamental theorem.\n\
    \n> Theorem 1. Given a d-module e, then d x e admits a semiring structure.\n\n\
    The Haskell type class instance below witnesses this theorem.\n\n```\ninstance\
    \ Module d e => Semiring (d x e) where\n  zero        = N zero zero\n  one   \
    \      = N one   zero\n  (N f df) ⊕ (N g dg) = N (f ⊕ g) (df ⊕ dg)\n  (N f df)\
    \ ⊗ (N g dg) = N (f ⊗ g) ((f ⊗ dg) ⊕ (g ⊗ df))\n```\n\n# 3.3. Kronecker delta\n\
    \nThe final piece of our jigsaw comes from the observation that the function δ_x\
    \ y = if x == y then one else zero is the Kronecker delta function.\n\n```\nδ_x(y)\
    \ = { 1   x = y\n         { 0   otherwise\n```\n\nThis gives rise to our third\
    \ fundamental algebraic abstraction. In Haskell, we capture a generalized notion\
    \ of this concept in the Kronecker type class.\n\n```\nclass Module d e => Kronecker\
    \ v d e where\n  delta :: v → e\n```\n\nNotice that, at this point, no extra laws\
    \ are imposed on Kronecker v d e; later, we will use isomorphism conditions (Definition\
    \ 5) to constrain different AD variants. The idea is that delta x does not compute\
    \ δ_x(y) for just a single variable y, but for all variables at once. Thus delta\
    \ x is a value in a d-module e where only the x-component is one, and all others\
    \ are zero. A helpful analogy may be to think of v as the type of basis vectors\
    \ of e. Then, delta x is the embedding of basis vector x into e. Continuing Section\
    \ 3.1’s example of the R-module R³, there are usually three variables x, y, z\
    \ such that"
