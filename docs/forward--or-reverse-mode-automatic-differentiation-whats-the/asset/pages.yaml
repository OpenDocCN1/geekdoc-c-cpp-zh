- pgno: 1
  md: 'their subsequent application to AD). The various AD modes (forward, reverse,
    mixed) then arise as further optimisations of this basic picture in terms of the
    efficient organisation and traversal of the underlying datastructures, typically
    exploiting mutability.


    The vast literature on AD, which is impossible to survey here, covers extensions
    of Wengert’s original approach in all possible directions: algorithmic improvements,
    language designs and extended expressivity, novel applications and much more.
    The contribution of this paper is not to extend this body of work even further,
    but rather to revisit the original algorithms from an algebraic perspective. Following
    Bird and de Moor’s “Algebra of Programming” [5], we show how algebra can be used
    to (re-)derive existing AD algorithms from a basic executable specification, expressed
    in the purely functional programming language Haskell. The algebra involved consists
    of largely standard constructions (with one notable exception, namely Nagata’s
    construction described in Section 3.2 below), which—because they yield isomorphic
    mathematical objects—have no extensional consequences. Yet, they do enable the
    functorial equivalence between the different algorithmic variants. At the algebra
    level, the algebraically derived change of representation are precisely what allows
    us to exploit intensional aspects, specifically to change the computational complexity.


    Specifically, this paper makes the following contributions.


    +   - First, we show how symbolic differentiation and evaluation of symbolic expressions
    can both be seen algebraically as unique semiring homomorphisms from the free
    semiring. In terms of code, they are both instances of the same fold-like recursion
    scheme. This algebra view enables us first to fuse the two homomorphisms to obtain
    basic forward mode AD, and then to recover symbolic differentiation as an instance
    of that (Section 2).


    +   - Next, we abstract the AD model in terms of three fundamental algebraic abstractions,
    whose specification and (equational) properties we realise via Haskell type classes:
    modules over a semiring, a generalization of dual numbers which we dub Nagata
    numbers (whose construction appears originally due to Nagata [6]), and of Kronecker’s
    delta function. This abstract algorithm readily instantiates to a more efficient
    form of forward mode AD that computes the whole gradient vector of partial derivatives
    in one go (Section 3).


    +   - Then, we show how other instances of the abstract algorithm can be obtained
    by replacing the representation of the gradient using an isomorphic representation,
    using Elliott’s method of type class morphisms [7]. This is demonstrated on a
    sparse representation (Section 4).


    +   - Using the above methodology, we ultimately derive purely functional and
    imperative variants of reverse-mode AD: we successively improve the time complexity
    of scalar multiplication and gradient vector addition with representations based
    on homomorphisms, and switch to their equivalent mutable representation (Section
    5).


    +   - As an epilogue, we demonstrate that our approach readily admits common,
    useful extensions: additional primitive functions, direct computation with Nagata
    numbers to eliminate the overhead in building and evaluating symbolic expressions,
    higher derivatives, and let-sharing (Section 6).


    +   - We provide an implementation of the approach and different AD versions.


    Finally, the paper discusses related work (Section 7) and concludes (Section 8).


    We believe that this paper may be of interest to algebraists, (Haskell) programmers
    and AD experts alike. While the paper does its best to be accessible to these
    three groups, we acknowledge that this requires working through unfamiliar concepts
    or unfamiliar presentations of familiar concepts below the three strands come
    together. Appendix C supports readers who are not familiar with Haskell, briefly
    introducing type classes and library functions that are used throughout this work.


    # 2. Setting the stage


    This section provides a basic executable definition of automatic differentiation
    (AD) based on a minimal setup. For readers who want a gentle introduction to the
    methodology used here, we refer to “Domain-Specific Languages of Mathematics”
    [8].


    # 2.1. Symbolic expressions and their evaluation


    In order to focus on the essential algorithmic mechanics, throughout most of this
    paper we pare down to a minimal programming language in which functions can be
    expressed: symbolic expressions Expr v that capture polynomials over variables
    v, that vary independently:¹


    ```

    ```

    data Expr v = Var v | Zero |

    | Plus (Expr v) (Expr v) | Times (Expr v) (Expr v)

    ```

    ```


    For example, for univariate expressions we can define a type X with one variable.
    The symbolic representation of x × (x + 1) is captured in example¹.'
