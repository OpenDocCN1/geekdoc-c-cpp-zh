    \ - }\nx\n\nh x ⊕ h y\n= { - definition of ⊕ - }\nh (h⁻¹ (h x) ⊕ h⁻¹ (h y))\n\
    = { - isomorphism - }\nh (x ⊕ y)\n```\n```\n\nVerifying the other laws and homomorphism\
    \ properties proceeds similarly.\n\nIn short, each time we devise a new AD variant,\
    \ we come up with a new representation E and an invertible function h :: Dense\
    \ V D -> E. The rest of the infrastructure then follows mechanically, except for\
    \ the fact that we can simplify the definitions, sometimes exploiting further\
    \ equations, for the sake of optimizing the (algorithmic properties of) the representation.\n\
    \nThe invertible function ensures, through the constructed Kronecker isomorphism,\
    \ that the extensional behaviour remains the same, and thus guarantees correctness.\
    \ At the same time, a well-chosen alternative representation may improve intentional\
    \ properties like asymptotic runtime.\n\n# 4.3. Sparse maps\n\nWe demonstrate\
    \ that the above approach to switch from the dense function space representation\
    \ to that of sparse maps. This exploits the fact that many partial derivatives\
    \ of sub-expressions are zero. Indeed, if a variable x does not occur in an expression\
    \ e, the partial derivative ∂e/∂x is zero. Notably, in the base instance of dense\
    \ functions, when the expression is just a variable, all partial derivatives but\
    \ one are by definition zero. We avoid explicit representations of such zeros-as\
    \ well as explicit operations with them-by replacing the dense function space\
    \ v -> d with the type of finite key-value maps Map v d. We use Haskell's Data.Map\
    \ library (Appendix C) instead of a specialized dictionary representation [21].\n\
    \n```\n```\ntype Sparse v d = Map v d\n```\n```\n\nThe omitted values in the map\
    \ are zero. This way we recover the Dense representation from the sparse one by\
    \ looking up the variables in the map and defaulting to zero when a variable is\
    \ not present.\n\n```\n```\nabs↝ :: ... :: (Ord v, Semiring d) => Sparse v d ->\
    \ Dense v d\nabs↝ m = \\v -> findWithDefault zero v m\nrep↝ :: ... :: (Ord v,\
    \ Bounded v, Enum v, Semiring d, Eq d)\n=> Dense v d -> Sparse v d\nrep↝ dense\
