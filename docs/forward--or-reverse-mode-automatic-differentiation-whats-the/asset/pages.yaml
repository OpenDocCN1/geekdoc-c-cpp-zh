    \ d)\ninl x = (x, one)\ninr y = (one, y)\n```\n\nMore generally, with a `(d, d)`-module\
    \ `e` we obtain a variation on the Nagata numbers:\n\n```\ninstance (Semiring\
    \ d, Module (d, d) e) => Semiring (Nagata d e) where\n  zero = N zero zero\n \
    \ one = N one zero\n  N fj dg + N dg' dg = N (fj ⊕ dg') (dj ⊕ dg)\n  N fj dg ⊗\
    \ N dg dg' = N (fj ⊗ dg) (((inr • g • dg') ⊗ (inl • f • dg)))\n```\n\nThis one\
    \ localized modification seamlessly integrates non-commutative multiplication\
    \ into our AD variants. In particular, following the earlier recipe we now use\
    \ the `(d, d) → e` representation for accumulating multiplications, which is that\
    \ of `(d, d) → e` functions that take two `d` accumulators. The scalar multiplication\
    \ of this representation updates both accumulators.\n\n```\ninstance (Semiring\
    \ d, Module (d, d) e) => Module (d, d) ((d, d) -> e) where\n  (d1', d2') • f =\
    \ λ(d1, d2) -> f (d1' ⊗ d1, d2' ⊗ d2)\n```\n\nThis shows that the first accumulator\
    \ is for multiplications on the left and the other for multiplications on the\
    \ right.\n\nIn short, `(d, d)`-modules support non-commutative multiplication\
    \ with minimal upheaval.\n\n# 6.3. Overloading initial expressions\n\nAutomatic\
    \ differentiation avoids the intermediate symbolic derivative when computing precise\
    \ numeric results. This is shown by the elimination of `eval` in Section 2.4,\
    \ which was invoked twice in the naive implementation. In this subsection we show\
    \ that, by overloading operators in the initial expression and thereby avoiding\
    \ the initial symbolic expression, we can further eliminate the `eval` call and\
    \ thus further reduce verbosity.\n\nIn particular, we assume that the initial\
    \ expression is not given as a value of type `Expr v`, but as a polymorphic function\
    \ of type `∀d.Semiring d => d → ... → d → d` with as many inputs of type `d` as\
    \ there are variables `v`. For example, `example2` from Section 2.5, can be written\
