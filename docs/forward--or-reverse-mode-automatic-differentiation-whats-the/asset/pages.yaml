    # 5.3. Array-based reverse mode


    Performance-wise, we can do even better by switching from immutable maps to mutable
    arrays (from Data.Array.ST) (Appendix C). Using these to represent the state,
    instead of the purely functional implementation above, we can perform in-place
    updates. Furthermore, the array can be provided by an implicit environment (Control.Monad.Reader).
    Hence, instead of type Cayley (Sparse v d), we can work with the type ReaderT
    (STArray s v) (ST s) (). It is convenient to encapsulate this rather wordy type
    in the type synonym STCayley v d.


    ```

    type STCayley v d = VS.ReaderT (STArray s v s) (ST s) ()

    ```


    Observe that STCayley v d polymorphically quantifies over the state thread parameter
    s, which is necessary if we want to run the computation using Haskell’s built-in
    primitive runST :: (∀S. ST s a) -> a.


    The isomorphism between Cayley (Sparse v d) and STCayley v d essentially converts
    between the array and map representations.


    ```

    rep_∞ :: (λx v. Semiring d) => Cayley (Sparse v d) -> STCayley v d

    rep_∞ p = foldMap (λ (v, d) -> modifyAt (⊕ v) d (toList (p zero)))

    abs_∞ :: (λx v. Bounded v v. Semiring d) => STCayley v d -> Cayley (Sparse v d)

    abs_∞ q = runST (do arr <- newArray (minBound, maxBound) zero

    runReaderT q arr

    l <- getAssocs arr

    return $ foldMap (λ (v, d) -> insertWith (⊕) v d l))

    ```


    The rep_∞ function uses a helper function modifyAt to edit the value at a specific
    position of the array, which is the counterpart of insertWith on maps.


    ```

    modifyAt :: v -> (d -> d) -> v -> STCayley v d

    modifyAt f v = do arr <- ask; x <- readArr arr v; writeArray arr v (f x)

    ```


    Using the methodology of Section 4.1 the Monoid instance works out to be the generic
    instance that is available to any type m () where m is a monad.


    ```

    instance Monoid (STCayley v d) where

    zero = return ()

    p ⊕ q = p >> q

    ```


    As we work with d -> STCayley v d, the Module structure of STCayley v d is not
    used. For that reason, we skip immediately to the Kronecker instance where the
    purpose of using mutable arrays is to reduce the O(log V) time complexity of insertWith
    in delta to the O(1) time complexity of modifyAt.


    ```

    instance (λx v. Semiring d) => Kronecker v d (STCayley v d) where

    delta v = modifyAt (⊕one) v

    ```


    In the d -> STCayley v d combination this becomes:


    ```

    instance (λx v. Semiring d) => Kronecker v d (d -> STCayley v d) where

    delta v = λd -> modifyAt (⊕v) d

    ```


    The correctness of STCayley v d is established in terms of that of Cayley (Sparse
    v d).


    ```

    instance (λx v. Ord v, Bounded v, Enum v, Semiring d, Eq d) =>

    CorrectAD v d (STCayley v d) where

    rep = rep_∞ . rep

    abs = abs ∘ abs_∞

    ```'
