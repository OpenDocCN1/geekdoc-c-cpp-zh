    # 1. 认知内核的概念——五大原理，一种方法，三个组件


    我们提议在任务驱动方法（TDA）[3,4,5]的框架内，根据“原理编程”（BPP）[1,2]的脑活动 5 大原理，构建一个通用的决策系统。这些原理实现在针对任意给定环境定义的认知架构[6]中，该架构基于逻辑概率推理（LPI）[7]、概率形式概念（PFT）[8]以及功能系统（TFS）[3,4,5]运行。


