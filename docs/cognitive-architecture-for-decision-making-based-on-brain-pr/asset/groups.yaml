    # # Cognitive Architecture for Decision-Making Based on Brain Principles Programming


    Anton Koloninᵃ,¹, Andrey Kurlatovᵃᵇ, Artem Molchanovᵇ, Gennadiady Aeryanovovᵇ


    ^Novosibirsk State University, 2 Novosibirsk, 630090, Russia

    ^Sberbank of Russia, Neuroscience Lab, Vavilov 19, Moscow, 117312, Russia


    #  Abstract


    We describe a cognitive architecture intended to solve a wide range of problems
    based on the identified principles of brain activity, their implementation in
    three subsystems: logical-probabilistic inference, probabilistic formal concepts,
    and functional systems. Building an architecture involves the implementation of
    a task-driven approach that allows defining the target functions of applications
    as tasks formulated in the operating environment corresponding to the task, expressed
    in the ontology. We provide a basic ontology for a number of practical applications
    as well as for the subject ontologies built upon it, describe the proposed architecture,
    and give possible examples of the execution of these architectures in practice.


