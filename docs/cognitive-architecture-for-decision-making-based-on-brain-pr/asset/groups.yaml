    关于积累向客户提供的报价（Offers）以及客户在当前订阅背景下进行的订阅（Subscriptions）的历史记录过程，这些记录可以存储为客户故事（Client
    Stories）。这些信息的聚合使得将典型历史、典型片段和典型行为识别为情景-不变性（Scenarios - Invariants）成为可能从而描述每个客户画像（Client
    Images）。


    根据可用信息，从任务驱动架构（TDA）的角度来看，任务可以规范为：针对任何给定的客户生成特定产品及产品类型的报价，以最大化对所提产品的订阅概率，并通过评估向客户交付报价的结果，由“行为结果接受者”[3]
    确认。


    ## 3. 用于于决策的认知架构


    基于本体论模型和概率逻辑的认知架构剪枝了非公理推理搜索（NARS）[12] 和 OpenCog [17]。在这些系统中，存在以非公理逻辑 [11] 和概率逻辑网络（PLN）[13]
    形式存在的与 LPI 相似的算法能力。然而，它们并没有完全提供我们在之前的工作中通过 TDA、PFC 和 TFS 提供的属性，如我们先前的工作所示 [3,6]。在我们提出的架构框架内，假设所有特定应用都使用一个“认知内核”（CK），该内核在相关领域的私有本体的基础上执行，并在基于“认知数据库”（CDB）的
    TDA 框架内为顶层应用提供 LPL、PFC 和 TFS 的能力。


    CDB 本身如图 1 所示，用于根据所述的高层本体存储数据和元数据，并可以指定其他主题领域，为 CK 的认知功能 - LPL、PFC、TFS 和 TDA 提供适当编程接口（API）。


    CK 的近似组成可以描述为下述的一系列服务，这些服务相互以及向“外部”应用程序提供 API 函数。因此，可以在基于单个 CDB 的 LPL、PFC、TFS
    和 TDA 服务，在所谓的“微服务”架构范围内实现该系统。


    ### 3.1. 认知数据库


    认知数据库（CDB）包括图 1 右侧所示的以下三个组件。


    元数据基础（MDB）旨在存储实例（Instances）和不变性（Invariants）的本体模式（通过描述它们的类型和属性），以及分类器的领域值。在内存数据库或专门的缓存系统中对
    MDB 进行完全或部分缓存，以便在应用层快速访问，其用于：

    - a) 获取实例、不变性及其属性的存储；

    - b) 获取数据对象的值（最重要的是分类器的领域值），作为用户界面侧视觉操作的元类型（Meta-Types）和属性。


    数据对象基础（DOB）旨在根据上述 MDB 中描述的结构，维护由应用程序记录的实例及其相互关系的信息，以及它们的派生投影（projections），提供如下功能：

    - a) 初始检索与已解决任务结构对应的关系关系归一化投影；

    - c) 在对应于已解决任务结构的关系关系归一化投影中检索并存储不变性；


    规则基础（RB）用于存储条件的合取-析取规则与由 LPI 推断的后置条件发生的概率估计之间的连接，这种推断与 PFC 发现的前驱项（precedents）和不变性有关，同时确保：

    - 保持已识别规则的检索，根据给定的前置条件和后置条件准则检索相关规则。


    如图 3 所示，MDB 中带有属性的类型描述了 DOB 中对象（实例和不变性）的结构，包括它们之间的关系以及复合分类器（Composite Classifiers），这些分类器可以基于对原始原始分类器值的监督创建（基于
    PFC 识别的不不变性派生），且 RB 规则可以与根据 LPI 推断显现的不不变性相关联。


    ![](img/e66e00c99cdfd3c24698cc35c8fa2b2e_6_0.png)


    ### 3.2. 逻辑-概率推理 (LPI) 服务


    根据 [7,11] 实现的 LPI 服务提供以下功能：

    - a) 根据 DOB 中的实例（和前驱项）形成规则并将其保存到 RB 中；

    - b) 基于呈现的现状，结合使用 RB 中的规则和相应的不变性，构建预测并发布建议；

    - c) 结合 PFC，实现按“概率”（从 [7,11] 的角度来看）和“统计显著性”（费希尔准则）对预测进行排名的可能性的，以及两者的结合。所提供的预测可以传输到外部系统供实际使用，并传输到
    TFS 服务以根据反馈纠正以 RB 规则形式包含的认知行为模型。该服务既可以通过外部应用程序的显式（随时的）请求控制，也可以通过定期更新 RB 的后台任务控制。在这种情况下，显式请求和后台任务都可以带有完善请求的额外上下文信息。


    ### 3.3. 概率形式概念 (PFC) 服务


    根据 [8,15] 实现的 PFC 服务用于：

    - a) 根据 DOB 中实例（和前驱项）的数据识别显著的不不变性；

    - b) 在 DOB 中保留已识别的不不变性。


    该服务的操作可以作为后台任务进行管理，用于定期更新 DOB 不变性以及相关的 BP 规则。同时，后台任务可以带有额外的上下文。


    图 1. 认知内核（CK）方案，包含 LPI、PFC、TFS 和 TDA 服务。


    ### 3.4. 功能理论 (TFS) 服务


    根据 [7,11] 实现的 TFS 服务提供以下功能：a) 根据 DOB 中实例（和前驱项）的数据识别显著的不不变性并将其保存到 RB 中；b) ... 传输到
    TFS 服务以根据反馈纠正以 RB 规则形式包含的认知行为模型。该服务既可以通过外部应用程序的显式（随时的）请求控制，也可以通过定期更新 RB 的后台任务控制。在这种情况下，显式请求和后台任务都可以带有额外的上下文信息。


    ### 3.5. 任务驱动应用 (TDA) 服务


    根据 [3,4,5] 实现的 TDA 服务旨在实现为一个“认知内核”（CK），该内核在相关领域的私有本体的基础上执行，并在基于“认知数据库”（CDB）的 TDA
    框架内为顶层应用提供 LPL、PFC 和 TFS 的能力。


    ## 4. 示例


    ### 4.1. 认知行为疗法 (CBT) 中的话诊断


    让我们考虑一个应用程序示例——“心理医生”聊天机器人，它用于对寻求帮助的客户进行初步诊断，如图 2 所示。该应用程序包含以下功能部分：

    - a) 聊天机器人的实际功能，支持 Telegram 和 Slack 等即时通讯工具；

    - b) 检测确认（“是的”、“没错”等）、否定（“不”、“由于”等）以及模式（基于模式检测技术 [18]），以识别 DOB 中的语言模式；

    - c) 基于上述认知架构的认知（CN）本身，用于获取心理医生响应客户语言模式时所建议的认知影响语言模式；

    - d) 一个基于 CK 识别的模式生成交互式流的模块（使用基于“转换器” [20] 的预训练语言模型）；

    - e) 当前客户模型，用于跟踪会话历史、所有记录的操作（包括重复）并存储当前上下文，包括排除和确认的分类器。


