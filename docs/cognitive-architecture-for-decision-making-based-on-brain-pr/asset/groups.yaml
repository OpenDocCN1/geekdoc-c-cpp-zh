    # 2.2. Cognitive behavioral therapy model


    In a particular case of solving the problem of diagnosis within the framework
    of cognitive behavioral therapy (CBT) in the context of [9], from the point of
    view of the TDA, consider the task of making a Diagnosis, which is an invariant
    that connects the values of a number of Classifiers as Emotion, Emotion, Psycho-type,
    Social Situation and Cognitive Distortion [16], with the corresponding domain
    values – Categories, defined according to a psychotherapeutic school or practice.
    The task is solved within the framework of a psychotherapeutic session, recorded
    by the Session Precedent (Process subclass), while many Sessions may be conducted
    according to one Protocol (Session subclass). The solution of the task is carried
    out in a dialogue between the Client and the Therapist (subclasses of Instance)
    – by performing Actions in the context of the Session. The Therapist can perform
    Diagnostic or Treatment Actions, and the Client can respond to them through Reactions.
    All of these actions with certain Classifiers listed above. characterized by Patterns
    e.g., Cognitive patterns [16]; In this model, in the case of session interaction,
    the therapist performs initial Actions, stimulating the Client to Reactions, which
    makes it possible to identify certain Categories, the topology of which, according
    to all Classifiers, makes it possible to identify the Diagnosis invariant in case
    of session success, or not to identify any, in case of failure. It should be noted
    that the formal failure of the session in this formation can mean different things:
    a) the failure of the Therapist to identify a real problem with the Client; b)
    the Client does not have a real problem; c) the success of identifying the Client’s
    problem during the Session interaction. In both cases, the TDA allows not only
    making a Diagnosis (in the case of formal success), but also to maximize the healing
    effect, ensuring the removal of all possible diagnoses in case of and then verifying
