    # 1.3. Logical-probabilistic inference


    the former are stable, expressed in space and time, representations of the latter,
    while the latter are the “evidence bases” for identifying the former. In turn,
    “intelligent functions” are represented by several classes of cognitive operations
    performed over “intelligent objects”, as described further.


    The implementation of the task-driven (TDA) approach based on the basis of the
    previously listed five principles is supposed to be fixed on three computational
    methods – logical-probabilistic inference (LPI) [7], probabilistic formal concepts
    (PFC) [8] and the theory of functional systems (TFS) [3,4,5] as presented below.


    The method of logical-probabilistic inference (LPI) [7,11], along with the Nonatomic
    Reasoning System (NARS) and Probabilistic Logic Networks (PLN) [13], allows for
    solving cognitive problems with learning, recognition, and prediction. These methods
    are traditionally associated with machine learning methods based on regression
    models, including those based on artificial neural networks (ANNs). The supposed
    advantage of such methods is the fundamental explainability of their predictions,
    as well as the interpretability of the models themselves, discovered in course,
    insofar they are all based on ontology, that is, semantic representation of information,
    differing only in the mathematical model used to calculate probabilities. An additional
    advantage of the LPI is that this method, unlike the listed methods, even with
    ANNs, allows for the modeling of the function of human brain neurons [14], as
    well as providing comparability with other methods (PFC and TFS), as described
    further.


    The LPI method, with NARS and PLN, is based on basic operations for calculating
    probabilities such as “revision” (accounting for accumulated experience for the
    formation of linking causes and effects), “deduction” (predictions based on gained
    experience, as well as deriving new rules on existing experience), “induction”
    (predictions under uncertainty and the generation of hypotheses about possible
    consequences based on existing causes) and “abduction” (the generation of hypotheses
    about possible consequences due to effects).


    For example, the accumulation of information allows for the association of malnutrition
    with a weakened immune system, which provides a basis for assessing the probability
    of a rule connecting the two conditions due to “revision” operation. Further,
    the presence of a weakened immune system leads to an increased risk of “deduction”
    of the risk of hypothermia. The establishment of a rule connecting poor nutrition
    with an increase (“induction”) of an increase in the risk of hypothermia allows
    us to construct a hypothesis about the relationship of the weakening of the immune
    system through the “induction” operation. Finally, an induction due to hypothermia,
    in the presence of information about a decrease in immunity, allows us to pose
    a hypothesis about the connection of the latter with hypothermia through “abduction”.


    # 1.4. Probabilistic formal concepts


    The method of probabilistic formal concepts (PFC) [8,15] is an extension of the
    well-known method of formal concept analysis (Formal Concept Analysis) based on
    the LPI described above. This method makes it possible to identify significant
    combinations of features and contexts as interrelated causal associations, which
    can be interpreted as “fixed points” or “attractors” in terms of the neural network
    dynamics of Hopfield networks, based on observed or perceived instances (including
    time-bound precedents). These invariants can be considered as classes of objects
    or phenomena to given periods in the space of significant features identified
    in the process of applying this method. In addition, the method also allows for
    building hierarchies of such concepts as systems of concepts, as well as hierarchies
    of the features themselves that define these concepts, including the values defined
    in scopes of domains of these categories.


    At its core, the PFC is designated to solve the problem of clustering, which is
    widespread in the field of machine learning. It is supposed to do that within
    the framework of a transparent interpretable paradigm that allows the verification
    of the semantic structure of the identified hierarchies as well as the association
    of each identified invariant with the rules that it defines, as well as the verification
    of these rules themselves.'
