    P: Hi! How are you?


    B: Bad. They kicked out the #beer! (tentatively diagnosing #being fired and #personalization)

    P: How did that happen? Who did that? (clarifying social situation)

    P: It was my job. I am fired so that (confirming #being fired)

    P: Does it make you anxious or me angry? (clarifying emotion - #anxiety or #anger)

    P: Anxious, I have to pay the mortgage. (confirming #anxiety, #responsibility)

    P: You have been fired from your job and you are afraid, that won''t be able to
    pay right (#being fired, #anxiety)

    P: Yes (confirming in regard to social situation and emotion)

    P: What do you think about the reason?

    P: I was he has left the company. (diagnosing #personalization)

    B: That was fear I just like my life is ruined (change to #catastrophizing)

    P: You are anxious, that after being fired you won''t be able to find a new job
    (#anxiety, #being fired, #catastrophizing)

    P: Exactly In fact I am an experienced professional. (confirming in regard to
    emotion, social situation and cognitive distress moving on correction with healthy
    interventions)


    Fig. 2. An example of an protocol for automatic session for CBT. P: Psychotherapist
    replies, C: client replies. Explanations of the actions of the designed system
    are given in parentheses. The hash tag denotes the values (Categories) of such
    Classifiers as Emotion, Social Situation and Cognitive Distortion.


    # 4.2. Formation of proposals in customer relationship management (CRM)


    An example of the proposed cognitive architecture in the area of customer relationship
    management (CRM) is the segmentation of the client audience. This can be done
    by predicting the qualities of the Clients, as described in [2], for the purpose
    of the formation of Offers for them of the Enterprise.

    The appendix to [2] shows the PFC-based statistical approximation algorithm can
    reveal expressive social concerns towards the Invariants of individual Clients
    on 2784 respondents (users) of the social network was studied in the context of
    36 client users, where each characteristic corresponds to a Classifier as Gender,
    Race, Place of Birth, Values and Attribute to Bad Habits. As a result of the statistical
    approximation algorithm based on the PFC, 21 Invariants were identified, which
    are distinguishable representatives of the client audience. The most of them were
    the 8th and 9th Invariants. The 8th invariant can be characterized as such: unmarried
    men living in their homes, where the priority is family and children, value kindness
    and honesty in people, with negative attitude towards alcohol and smoking, with
    priority related to number of video and audio files. The 9th invariant, by instance,
    can be characterized as such: unmarried men, perhaps teenagers, who also value
    kindness and honesty in people, have their main priority self-improvement, with
    neutral stances on smoking and alcohol.

    The segmentation of the client audience involves a number of Client Images, coupled
    with the recorded logs of the formation of Precedents of Offers for Client Subscriptions
    made for the same products, may allow the LPI to make predictions about the acceptance
    or rejection of Offers for certain products by other Clients, taking into account
    the proximity of the Client to a particular Client Image and the probability of
    them accepting the Offer for each of the Products for this Client Image.'
