    # 1.1. Five principles of brain activity


    The five principles of brain activity formulated in [1,2] suggest the simultaneous
    involvement of all of them in most cognitive processes. That is, when making a
    decision in any new situation, the following is happening: 1) the principle of
    “complexity generation” leads to the generation of a hypotheses over the extended
    context of the situation for a limited number of stimuli or perceptions in various
    modalities; 2) the principle of “relationship” makes it possible to correlate
    different stimuli and hypotheses with each other, magnifying and dismissing others;
    3) the principle of “approximation to the essence” makes it possible to connect
    partial mediations mediated by stimuli and phenomena from past experiences; 4)
    the principle of “locality-distribution” ensures the “assembly” of full-fledged
    integrated contexts based on a set of particular stimuli and concepts of one or
    different modalities; 5 the principle of “heaviness” demands the dominant context
    corresponding to the most likely hypothesis.


    For instance, the scenario of a round object in the subject, with eyes being closed,
    allows for the generation of a number of hypotheses. The unknown object, due to
    the principle of “complexity generation”, is endowed with various properties,
    those that are not met, are confirmed with a series of hypotheses like that orange,
    a billiard ball, a red apple, a green apple). The “relationship” principle allows
    us to correlate these hypotheses with those are actually perceived, allowing the
    subject to judge that the softness of an orange does not correspond to the hardness
    of the perceived object, just the heaviness of a hypothetical billiard ball does
    not however, coincides with the actual perceptions. The smoothness and lightness
    of an apple, allows the principle of “locality-distribution” allows the subject
    to create a single image from multiple modalities: the feeling of a smooth and
    hard surface comes from the forearm and elbow, the apple smell - from the olfactory
    organs, however about being in a story (and not in a billiard club) - from short-term
    memory. Due to the “heaviness” principle, the “apple” becomes dominant, suppressing
    the “orange” and “billiard ball” hypotheses. Finally, the principle of approximation
    to essence crystallizes the image of a tangible stereotype in the subject’s thoughts,
    allowing the subject to give the correct answer “this is an apple!”


    # 1.2. Task-driven approach


    The task-driven approach (TDA) to the problem of artificial intelligence, formulated
    in [3,4,5] on the basis of the Theory of Functional Systems (TFS) by P.K. Anokh,
    suggests the possibility of solving a wide of cognitive tasks. A necessary condition
    for this formalization of these tasks in the appropriate operational space in
    terms of the ontology of a particular subject. The specified here should allow
    for the possibility of describing in these terms both the problem to be solved
    and the image of an achievable result, taking into account the criteria for achieving
    the result. The task can be done by introducing the function of “success” (of
    problem solving) or “utility” (of the subject solving the task) or the cognitive
    model it uses for operating the environment, both the initial conditions for solving
    the problem (including fixed initial and final stages) and the steps for solving
    it (business processes, executable scripts, and decision making rules) should
    also be expressed in terms of subject ontology. Early study [6] shows the fundamental
    possibility of solving the task through the possibility of experiential learning
    to the representation of the environment. That is, the same problem can be successfully
    solved via various learning algorithms, based on agent’s own action experience,
    having the problem and subject domain represented by different ontological schemas.
    In this work, we assume the possibility of solving a wide range of problems using
    a cognitive architecture designed for an arbitrary operating environment, established
    by a ontological subject domain model. With regard to the classes of tasks associated
    with business process management andotherapeutic practice [9], we propose the
    use of a base process-oriented (or “activity”) ontology [10] as a base for describing
    so-called “intelligent objects” and “intelligent functions” in terms of earlier
    work [2]. The main classes of intelligent objects are considered “invariants”
