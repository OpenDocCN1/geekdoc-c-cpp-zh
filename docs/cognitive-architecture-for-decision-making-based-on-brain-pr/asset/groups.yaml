    # 2.3. Enterprise customer relationship management model


    In the particular case of the formation of Offers to the Client of the Enterprise
    as Customer Relationship Management (CRM), from the point of view of the TDA,
    is the formation of an Offer, to which the Client will, with high probability,
    respond positively, which will be recorded as a Subscription to the offered Product.
    Both the Offer and the Subscription are Actions in the proposed ontology, as in
    case of CBT, in the context of some-term interaction (the Client’s contact with
    the Enterprise or a call to the Client from the Enterprise). An interaction can
    be part of an Episode of Client interaction (like using a certain line of services
    in a certain office for a long time), and an Episode can be part of a long-term
    Client history (including all Episodes during the time the Client uses the Enterprise’s
    services). The individual Clients themselves, as in the case of CBT, can be defined
    in the multidimensional space of a large number of Classifiers, such as Gender,
    Income, Social Status, Marital Status and many others, and can have link to Enterprise
    Products through the Current Subscription relationship. At the same time the stable
    combinations of Categories – the values of Classifiers, coupled with Current Subscriptions,
    can form such Invariants as the Client Image (for example, a young man using a
    mortgage).


    Both the Enterprise and the Product are subclasses of the Instance Entity, and
    the Offered Products that have Current Subscriptions are characterized by a Product
    Type. Episodes and Interactions are subclasses'
