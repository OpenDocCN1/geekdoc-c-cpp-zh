    the principle of “complexity generation”, is endowed with various properties,
    those that are not met, are confirmed with a series of hypotheses like that orange,
    a billiard ball, a red apple, a green apple). The “relationship” principle allows
    us to correlate different stimuli and hypotheses with each other, magnifying and
    dismissing others; The “relationship” principle allows us to correlate different
    stimuli and hypotheses with each other, magnifying and dismissing others; The
    “relationship” principle allows us to correlate different stimuli and hypotheses
