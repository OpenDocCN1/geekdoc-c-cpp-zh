  mdcn: '


    “灾难化思维”。在对话结束时，心理治疗师针对“被解雇”的“灾难化”思维完成了对“焦虑”的最终诊断，客户也确认了这一点，这为通过健康的干预来纠正后续思维提供了线索。


    P: 嗨！你好吗？


    B: 糟糕了。他们把 #啤酒 赶出去了！（初步诊断为 #被解雇 和 #个人化）

    P: 那是怎么搞的？是谁干的？（澄清社交情境）

    B: 是因为我的工作问题。我被解雇了，因为（确认 #被解雇）

    P: 这让你感到焦虑，还是让我感到生气？（澄清情绪 - #焦虑 或 #愤怒）

    B: 焦虑，我得付房贷。（确认 #焦虑, #责任）

    P: 你从工作岗位被解雇了，你担心将无法付账单（#被解雇, #焦虑）

    B: 是的（就社交情境和情绪进行确认）

    P: 你认为原因是什么？

    B: 我觉得是因为他离开了公司。（诊断为 #个人化）

    B: 那是恐惧，我感觉我的生活全毁了（转变为 #灾难化思维）

    P: 你很焦虑，担心被解雇后找不到新工作（#焦虑, #被解雇, #灾难化）

    B: 确实如此。事实上我是一个经验丰富的专业人士。（就情绪、社交情境和认知痛苦进行确认，并转向健康的干预进行纠正）


    图 2. 认知行为疗法（CBT）自动会话方案的一个示例。P：心理治疗师回答，C：客户回答。括号中给出了设计系统行为的解释。井号表示此类分类器（如情绪、社交情境和认知扭曲）的取值（类别）。


    ## 4.2. 客户关系管理 (CRM) 中方案的形成


    在客户关系管理（CRM）领域，所提认知架构的一个示例是客户群的细分。这可以通过预测客户特征（如 [2] 中所述）来实现，目的是为企业生成相应的优惠方案（Offers）。


    [2] 的附录显示，基于 PFC 的统计近似算法可以揭示 2784 名社交网络受访者（用户）对个体客户不变特征（Invariants）的表达性关注；该研究是在
    36 个客户用户的背景下进行的，每个特征都对应一个分类器，如性别、种族、出生地、价值观和坏习惯属性。基于 PFC 的统计近似算法识别出 21 个不变特征，它们是客户群可区分的代表性特征。其中大多数是第
    8 和第 9 个不变特征。第 8 个不变特征可以描述为：住在家里的未婚男性，家庭和孩子优先，看重人的善良和诚实，对酒精和吸烟持负面态度，优先考虑视频和音频文件的数量。例如，第
    9 个不变特征可以描述为：未婚男性，可能是青少年，他们也看重人的善良和诚实，首要任务是自我提升，对吸烟和酒精持中立。


    客户群的细分涉及多个客户画像（Client Images），结合针对相同产品生成的客户订阅优惠方案形成日志，可能允许 LPI 对其他客户是否会接受或拒绝特定产品的优惠做出预测，同时考虑了客户与特定客户画像之间的接近程度，以及他们接受该画像下每个产品优惠的概率。


    我们已经证明，大脑架构原理（BPP）可以在任务驱动方法（TDA）的框架内实现，该框架构建在概率推理（LPI）、概率概念（FC）和功能系统（TFS）方法的认知架构之上。我们证明了概率架构在基于基础活动本体的相应学科领域本体中表述的许多应用任务中具有基础适用性。在未来的工作中，我们计划开发该概率架构并在实际问题上对其进行全面测试。


