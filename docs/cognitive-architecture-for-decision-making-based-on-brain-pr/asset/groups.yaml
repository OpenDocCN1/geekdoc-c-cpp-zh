    however being in story (and not in billiard club) - from short-term memory. Due
    to “heaviness” principle, the “apple” becomes dominant, suppressing the “orange”
    and “billiard ball” hypotheses. Finally, the principle of approximation to essence
    crystallizes the image of a tangible stereotype in the subject’s thoughts, allowing
    the subject to give the correct answer.


    ## 1.2. Task-driven approach


    The task-driven approach (TDA) to the problem of artificial intelligence, formulated
    in [3,4,5] on the basis of Functional Systems (TFS), suggests the possibility
    of solving a wide range of tasks. A necessary condition for this formalization
    of these tasks in the appropriate space in terms of the ontology, should allow
    for the possibility of describing both the problem and the image of achievable
    result, taking into account criteria for achieving the result. The task can be
