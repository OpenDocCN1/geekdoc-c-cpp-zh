    the same problem can be successfully solved via various algorithms, having the
    problem domain represented by different ontological schemas. With regard to classes
    of tasks associated with business process management and practice, we propose
    the use of task-oriented (or “activity”) ontology as a base for describing socalled
    “intelligent objects” and “intelligent functions”. The main classes of intelligent
    objects are considered “invariants” and “instances”.


