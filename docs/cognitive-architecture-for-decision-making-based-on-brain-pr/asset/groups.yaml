    Anton Kolomin 等人 Procedia Computer Science 213 (2022) 180-189


    在水果识别问题的示例中，通过对感知数据处理并对台上所有的水果进行手动分类和检查，将揭示高层不变性，例如水果和浆果；其中水果可以包括橙子、苹果和梨的不变性，而苹果可以进一步分为绿色、黄色苹果和红色苹果的不变性。同时，该系统的显著特征将是重量、大小、硬度和光滑度以及颜色，因为不同的顶层不变性的可能颜色值区域也不同（例如，柑橘类只能是绿色、橙色或黄色，而不能蓝色）。


    ## 1.5. 功能系统理论


    基于功能系统理论（TFS）[3,4,5]的开发开发旨在解决机器学习中所谓的“强化学习（RL）”生成问题。传统上，RL 涉及基于环境提供的正反馈或负反馈，在解决某些问题失败时的正向强化进行学习。目前大多数
    RL 模型不具有可解释性，更重要的是缺乏可解释性。同时，TFS 扩展了外部强化很少显式出现或完全不存在且需要自监督学习的问题类别。在 TFS 中，这是通过基本机制实现的，即强化系统以实现任务预期结果，该结果在任务开始时创建，并在由任务接受者评估时确认。这对应于“实验学习”（EL）[6]，它包含了通过尝试学习以及基于环境/或任务提供的显式正负强化而进行学习。


    以 EL [6] 解释的 RL 问题著名公式中自学打乒乓球的为例，学习的第一阶段可能包括区分运动物体（球和球拍）与静态物体的能力（通过 PFC 方法）；第二阶段是学习如何控制球拍，将函数的使用与运动对象的重新排列联系起来；第三阶段是击球，根据球拍相对于球的空间配置改变球的轨迹；第四阶段也是最后一个阶段，是学习游戏所需的实际规则，以便在获胜时获得最终强化。


    ## 2. 统一活动本体论


    ### 2.1. 上层（基础）本体论


    为了确保能够基于上述方法构建一系列基于认知架构的应用程序，我们断定存在一个关注实际活动的简单上层（基础）本体论 [10]，它允许我们描述整个系列应用程序的的元数据，下面描述了其中的三个。作为元数据结构的基础，遵循
    OWL (https://www.w3.org/2002/07/owl-schema.org/)，我们接受了实体（Thing）和过程（Process）的基本概念。我们的概念在其下方断言了类的层次结构，考虑到了我们对智能对象（IO）理解为拥有一组属性的通用实体。在理解上，遵循活动或过程为导向的本体论
    [10] 的概念，IO 可以是唯一实例集的唯一实例或每个唯一实例的抽象。


    实例可以是特定的值（数字、日期、类型、物理或社会对象），也可以固定在时间的单个事件（Events）的呈现，统一巧合（Coincidences）时刻以及在时间上相互连接的延伸过程——连接不同时间的事件及其巧合。值可以由领域空间内的复杂实体（Entities）表示（例如，著名的物理对象或特定银行的特定客户），用于识别和描述实体的特定原子类别（例如，红色或男性），或者是在主体领域内唯一固定的任意关系，用于连接各种实体（例如，特定客户之间的亲属关系）。事件可以进一步细分为在特定时间点固的状态（States，例如账户余额或客户年龄）或改变这些状态的动作（Actions，如财务交易或生日比萨外送）。反之，不变性也分为其值不变的抽象属性（Properties）以及事件、巧合和过程的永恒不变性。我们称事件出现为“呈现”（Appearances），过程不变性为“场景”（Scenarios），而巧合不变性可以多次一起出现。因此，作为合集，使用对应于多次巧合事件的“呈现”。因此，作为析集，使用对应于同一场景不同阶段可能的不同事件的备选“呈现”，这些事件记录在不同的过程中（例如，在商店购买商品时的刷卡支付）。在较低层级上，类别值的不变性是分类器（Classifiers）（例如，颜色属性分类器定义了一个具有红、黄、绿域值的域），而特定实体的不变性是它们的抽象图像（Images）。


    ### 2.2. 认知行为治疗模型


    在 [9] 背景下，在认知行为疗法（CBT）框架内解决诊断问题的特定案例中，从 TDA 的角度考虑做出诊断（Diagnosis）的任务，这是一种不变性，它将多个分类器的值——如情绪（Emotion）、情绪（Psycho-type）、社会情境（Social
    Situation）和认知扭曲（Cognitive Distortion）[16]——与相应的域值连接类别根据心理治疗学派或实践定义。任务在心理治疗会话框架内解决，由会话记录（Session
    Precedent，过程子类）记录，而许多会话可以根据一个方案（Protocol，会话子类）进行。任务的解决方案在客户（Client）和治疗师（实例子类）之间的对话中执行——通过在会话环境中执行动作（Actions）。治疗师可以执行诊断或治疗动作，客户可以通过反应（Reactions）对其做出响应。所有具有上述某些分类器的动作都具有模式（Patterns）[16]的特征；在此模型中，在会话交互的情况下，治疗师执行初始动作，刺激客户做出反应，使得在成功的情况下能够识别出诊断不变性。需要注意的是，这种格式中会话的形式失败可能意味着不同的含义：a）治疗师未能识别出客户的真实问题；b）客户没有真实问题；c）成功识别了客户的问题。在这两种情况下，TDA
    不仅允许做出诊断（在形式成功的情况下），还能最大化疗愈效果，确保在可能的情况下移除所有可能的诊断，然后验证其缺失。


    ### 2.3. 企业客户关系管理模型


    在企业作为客户关系管理（CRM）向客户形成报价（Offers）的特定案例中，从 TDA 的角度来看，是形成一个报价，客户将很有概率对其做出积极响应，这将记录为对所提产品的订阅（Subscription）。报价和订阅在所提的本体论中都是动作（Actions），就像
