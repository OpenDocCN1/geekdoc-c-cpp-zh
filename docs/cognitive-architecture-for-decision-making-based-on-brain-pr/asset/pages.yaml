  md: 'We have shown that the five principles of brain architecture (BPP) can be implemented
    within the framework of a task-driven approach (TDA) in a cognitive architecture
    built on the methods of probabilistic inference (LPI), probabilistic concepts
    (FC), and functional systems (TFS). We demonstrated the fundamental applicability
    of the probabilistic architecture for a number of applied tasks formulated in
    the corresponding subject domain ontologies based on a basic activity ontology.
    In our future work, we plan to develop the probabilistic architecture and fully
    test it on real problems.


