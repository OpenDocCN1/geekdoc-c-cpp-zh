    # # Cognitive Architecture for Decision-Making Based on Brain Principles Programming


    Anton Koloninᵃ,¹, Andrey Kurlatovᵃᵇ, Artem Molchanovᵇ, Gennadiady Aeryanovovᵇ


    ^Novosibirsk State University, 2 Novosibirsk, 630090, Russia

