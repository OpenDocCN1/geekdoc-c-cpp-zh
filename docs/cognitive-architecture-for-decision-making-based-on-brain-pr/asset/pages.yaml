    # 3.4. Theory of functional system (TFS) service


    The TFS service implemented according to [2,3,4,5] provides the functionality:
    a) receiving LPI forecasts and comparing them with actually recorded precedents
    in the DOB with possible explicit feedback from the external environment (simultaneously
    giving the feedback in the DOB) in response to the issued LPI forecasts; b) adjusting
    the relevant rules in the RB, depending on the results of comparing forecasts
    with their success. The action of TFS is in sense similar to the "global feedback"
    [6] of active cognitive processes in the context of episodic memory in the case
    of perception of "successful" results. The functioning of the service ensures
    the perception of both "external reactions" from the application system, based
    on the implementation of the recommendations of the LPI service, and "internal
    incentives" generated by the TDA.


    # 3.5. Task-driven application (TDA) service


    The TDA service [3,4,5] is to be implemented as a specialized "Oracle", in relation
    to a specific subject area, which provides "external" (in relation to the rest
    of the architecture) reinforcement in accordance with the "goals". Goals can be
    considered as "from above" for a specific area through the definition of a "success
    function" calculated according to the goals and the criteria for their achievement
    based on data recorded by the entire system in the context of its operation. Evaluations
    of the "success" of "solving problems" ("achieving goals") are transferred to
    the TFS as "internal" reinforcements that mediate external signals and the system''s
    reactions to them in the context of the. The functioning of the service can be
    controlled by certain events (such as the completion of Tasks or Projects), and
    by background tasks designed to periodically reinforce current activities through
    the TFS service.


