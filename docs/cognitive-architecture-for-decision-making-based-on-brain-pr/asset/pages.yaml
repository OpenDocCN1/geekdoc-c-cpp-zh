    # 1. The concept of the cognitive kernel – five principles, one approach, three
    components


    We propose to build a universal decision-making system based on the 5 principles
    of brain activity according to “Principles Programming” (BPP) [1,2] within the
    framework of a task-driven approach (TDA) [3,4,5]. The principles are implemented
    in a cognitive architecture defined for an arbitrarily given environment [6],
    operating on the basis of logical-probabilistic inference (LPI) [7], probabilistic
    formal concepts (PFT) [8] and for the functional systems (TFS) [3,4,5].


