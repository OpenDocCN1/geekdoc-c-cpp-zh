    # 1.5. Theory of functional systems


    The applied development of the method based on the theory of functional systems
    (TFS) [3,4,5] is aimed at solving the generation of the so-called “reinforcement
    learning (RL) in machine learning. Traditionally, RL involves learning based on
    positive or negative feedback from the environment or of positive reinforcement
    over solving certain problems, failing to solve them. Most of the currently RL
    models are not explainable and, more importantly, interpretable. At the same time,
    TFS extending the class of problems where external reinforcement rarely appears
    explicitly, or does not exist at all and self-supervised learning is necessary.
    In TFS, this is achieved through the basic mechanism of reinforcing the system
    for achieving the expected result of the task, created at the beginning of the
    task and confirmed when it is evaluated by the acceptor of the task. This corresponds
    to “experimental learning” (EL) [6] which includes both learning by trial, and
    learning based on explicit positive or negative reinforcements from the environment/or
    the task.


    For the example of self-learning to play ping-pong in the well-known formulation
    of the RL problem interpreted in terms of EL [6], the first stage of learning
    might include the ability to distinguish moving objects (ball and rocket) from
    stationary ones (by the PFC method), the second stage is to learn how to control
    the rocket, linking the use of functions with the re-arrangements of moving objects,
    the third stage is to hit the ball, changing in its trajectory with the spatial
    configuration of the rocket relative to the ball, the fourth, and final stage
    is learning the actual rules of the game necessary to obtain the final reinforcement
    upon winning.


    # 2. Unified activity ontology


    # 2.1. Upper (foundation) ontology


    In order to ensure the possibility of building a line of applications based on
    the cognitive architecture using the methods described above, we assert the presence
    of a simple upper (foundation) ontology [10] focused on practical activity, which
    allows us to describe metadata for the entire line of applied applications, describing
    three of them below. As a basis for the metadata structure, following OWL (https://www.w3.org/2002/07/owl-schema.org/),
    we accept the basic concepts of Thing and Process. The further hierarchy of classes
    underneath them is asserted for our concept, taking into account our understanding
    of an intelligent object (IO) as a universal Thing that has a set of Properties.
    In understanding, following the concept of an activity or process-oriented ontology
    [10], IO-s can be unique Instances or Abstracts each of the set of unique instances.


    Instances can be specific values (numbers, dates, types, physical or social objects)
    or Presents of individual Events fixed in time, uniting the moments of Coincidences,
    as well as time-stretched processes interconnected in time – uniting Events of
    different times and their Coincidences. Values can be represented by complex Entities
    that are in the domain space (for example, a well-known physical object or a specific
    Client of a particular bank), specific atomic Categories (for example, the color
    red or the male gender) used to identify and describe Entities, or – arbitrary
    relations uniquely fixed in the subject area, uniting various entities (for example,
    kinship relations between specific Clients). Events can be subdivided into States
    that are fixed at specified points in time (for example, the balance of the Account
    or the age of the Client) or Actions that change'
