    such as a) initial retrieving the projections in relational normalization projections
    corresponding to the structure of the tasks solved; c) retrieving and storing
    the invariants in the relational normalization projections to the structure of
    the tasks solved;


    The Rule Base (RB) is used for storing connections between the conjunctive-disjunctive
    rules of conditions and the probabilistic estimates of the onset of post-conditions
