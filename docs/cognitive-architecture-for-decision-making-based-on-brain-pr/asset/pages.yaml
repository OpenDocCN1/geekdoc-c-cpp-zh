    # 3. Cognitive architecture for decision making


    Cognitive architectures based on ontological models and probabilistic logic prune
    the Non-Axiomatic Reasoning Search (NARS) [12] and OpenCog [17]. In these systems,
    there are algorithmic capabilities similar LPI in the form of non-axiomatic logic
    [11] and Probabilistic Logic Networks (PLN) [13]. However, they do not fully provide
    the properties offered by us in the form of the TDA, PFC, and TFS, as shown in
    our previous works [3,6]. Within the framework of the architecture that we propose,
    it is assumed that all specific applications use a "cognitive kernel" (CK) that
    is executed on the base of private ontologies the relevant domains and will provide
    top-level applications with the capabilities of the LPL, PFC and TFS within the
    framework of the TDA based on the "cognitive database" (CDB).


    The CDB itself, as shown in Fig. 1 is intended for storing data and metadata based
    on the top-level ontology described and can be specified for other subject areas,
    providing an appropriate programming interface (API) for the cognitive functions
    of the CK - LPL, PFC, TFS and TDA.

    The approximate composition of the CK can be described as a set of services described
    below that provide API functions to each other and to "external" applications.
    Thus, it is possible to implement the system within the framework of a so-called
    "micro-service" architecture based on the services of the LPL, PFC, TFS and TDA
    based on a single CDB.


