    ## Working with Cocoa Data Types


    As part of its interoperability with Objective-C, Swift offers convenient and
    efficient ways of working with Cocoa data types.


    Swift automatically converts some Objective-C types to Swift types, and some Swift
    types to Objective-C types. There are also a number of data types in Swift and
    Objective-C that can be used interchangeably. Data types that are convertible
    or can be used interchangeably are referred to as *bridged* data types. For example,
    in Swift code, you can pass an `Array` value to a method expecting an `NSArray`
    object. You can also cast between a bridged type and its counterpart. When you
    cast between bridged types with `as`—or by explicitly providing the type of constant
    or variable—Swift bridges the data type.


    Swift also provides a convenient overlay for interfacing with Foundation data
    types, letting you work with them using a syntax that feels natural and unified
    with the rest of the Swift language.


    ‌


    ### Strings


    Swift automatically bridges between the `String` type and the `NSString` class.
    This means that anywhere you use an `NSString` object, you can use a Swift `String`
    type instead and gain the benefits of both types—the `String` type’s interpolation
    and Swift-designed APIs and the `NSString` class’s broad functionality. For this
    reason, you should almost never need to use the `NSString` class directly in your
    own code. In fact, when Swift imports Objective-C APIs, it replaces all of the
    `NSString` types with `String` types. When your Objective-C code uses a Swift
    class, the importer replaces all of the `String` types with `NSString` in imported
    API.


    To enable string bridging, just import Foundation. For example, you can call `capitalizedString`—a
    method on the `NSString` class—on a Swift string, and Swift automatically bridges
    the Swift `String` to an `NSString` object and calls the method. The method even
    returns a Swift `String` type, because it was converted during import.


    Swift


    *   `import``Foundation`


    *   `let``greeting` `=` `"hello, world!"`


    *   `let``capitalizedGreeting` `=` `greeting``.``capitalizedString`


    *   `// capitalizedGreeting: String = Hello, World!`


    If you do need to use an `NSString` object, you can convert it to a Swift `String`
    value by casting it. The `String` type can always be converted from an `NSString`
    object to a Swift `String` value, so there’s no need to use the optional version
    of the type casting operator (`as?`). You can also create an `NSString` object
    from a string literal by explicitly typing the constant or variable.


    Swift


    *   `import``Foundation`


    *   `let``myString``:` `NSString` `=` `"123"`


    *   `if``let``integerValue` `= (``myString``as``String``).``toInt``() {`


    *   `println``(``"``\(``myString``)` `is the integer` `\(``integerValue``)``"``)`'
