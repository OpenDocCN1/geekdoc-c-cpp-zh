    \n*   `takesAnAutoreleasingPointer``(&``x``)`\n\nTypes that are pointed to are\
    \ not bridged. For example, `NSString **` comes over to Swift as `AutoreleasingUnsafeMutablePointer<NSString?>`,\
    \ not `AutoreleasingUnsafeMutablePointer<String?>`.\n\n‌\n\n### Function Pointers\n\
    \nC function pointers are imported into Swift as `CFunctionPointer<Type>`, where\
    \ `Type` is a Swift function type. For example, a function pointer that has the\
    \ type `int (*)(void)` in C is imported into Swift as `CFunctionPointer<() ->\
    \ Int32>`.\n\n‌\n\n### Global Constants\n\nGlobal constants defined in C and Objective-C\
    \ source files are automatically imported by the Swift compiler as Swift global\
    \ constants.\n\n‌\n\n### Preprocessor Directives\n\nThe Swift compiler does not\
    \ include a preprocessor. Instead, it takes advantage of compile-time attributes,\
    \ build configurations, and language features to accomplish the same functionality.\
    \ For this reason, preprocessor directives are not imported in Swift.\n\n‌\n\n\
    ### Simple Macros\n\nWhere you typically used the `#define` directive to define\
    \ a primitive constant in C and Objective-C, in Swift you use a global constant\
    \ instead. For example, the constant definition `#define FADE_ANIMATION_DURATION\
    \ 0.35` can be better expressed in Swift with `let FADE_ANIMATION_DURATION = 0.35`.\
    \ Because simple constant-like macros map directly to Swift global variables,\
    \ the compiler automatically imports simple macros defined in C and Objective-C\
    \ source files.\n\n‌\n\n### Complex Macros\n\nComplex macros are used in C and\
    \ Objective-C but have no counterpart in Swift. Complex macros are macros that\
    \ do not define constants, including parenthesized, function-like macros. You\
    \ use complex macros in C and Objective-C to avoid type-checking constraints or\
    \ to avoid retyping large amounts of boilerplate code. However, macros can make\
    \ debugging and refactoring difficult. In Swift, you can use functions and generics\
    \ to achieve the same results without any compromises. Therefore, the complex\
    \ macros that are in C and Objective-C source files are not made available to\
    \ your Swift code.\n\n‌\n\n### Build Configurations\n\nSwift code and Objective-C\
    \ code are conditionally compiled in different ways. Swift code can be conditionally\
    \ compiled based on the evaluation of *build configurations*. Build configurations\
    \ include the literal `true` and `false` values, command line flags, and the platform-testing\
    \ functions listed in the table below. You can specify command line flags using\
    \ `-D <#flag#>`.\n\n| Function | Valid arguments |\n\n| --- | --- |\n\n| `os()`\
    \ | `OS X`, `iOS` |\n\n| `arch()` | `x86_64`, `arm`, `arm64`, `i386` |\n\nA simple\
    \ conditional compilation statement takes the following form:\n\n*   ```\n   \
    \ #if build configuration\n    ```\n\n*   ```\n     statements\n    ```\n\n* \
    \  ```\n     #else\n    ```\n\n*   ```\n    statements\n    ```\n\n*   ```\n \
    \   #endif\n    ```\n\nThe *statements* consist of zero or more valid Swift statements,\
    \ which can include expressions, statements, and control flow statements. You\
    \ can add additional build configuration requirements to a conditional compilation\
    \ statement with the `&&` and `||` operators, negate build configurations with\
    \ the `!` operator, and add condition blocks with `#elseif`:\n\n*   ```\n    #if\
    \ build configuration && !build configuration\n    ```\n\n*   ```\n     statements\n\
    \    ```\n\n*   ```\n     #elseif build configuration\n    ```\n\n*   ```\n  \
    \   statements\n    ```\n\n*   ```\n     #else\n    ```\n\n*   ```\n    statements\n\
    \    ```\n\n*   ```\n    #endif\n    ```\n\nIn contrast with condition compilation\
    \ statements in the C preprocessor, conditional compilation statements in Swift\
    \ must completely surround blocks of code that are self-contained and syntactically\
    \ valid. This is because all Swift code is syntax checked, even when it is not\
    \ compiled.\n\n‌‌\n\n## Mix and Match\n\n‌‌\n\n## Swift and Objective-C in the\
    \ Same Project"
