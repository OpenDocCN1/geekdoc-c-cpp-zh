    Swift 与 Objective-C 的兼容性允许你创建一个包含用任一语言编写的文件的项目。你可以使用这种称为“混合匹配”（mix and match）的功能来编写具有混合语言代码库的
    App。通过混合匹配，你可以使用最新的 Swift 特性实现应用的部分功能，并将其无缝地整合回现有的 Objective-C 代码库中。


    ## 混合匹配概述


    Objective-C 和 Swift 文件可以共存在于同一个项目中，无论该项目最初是 Objective-C 项目还是 Swift 项目。你只需要直接向现有项目添加另一种语言的文件即可。这种自然的工作流使得创建混合语言的
    App 和框架（framework）目标变得像创建由单语言编写的 App 或框架目标一样简单。


    处理混合语言目标的过程略有不同，具体取决于你编写的是 App 还是框架。在同一目标内使用两种语言的通用导入模型如下所示，并在后续章节中进行了更详细的描述。


    ![image: ../Art/DAG_2x.png](img/DAG_2x.png)


    ## 从同一个 App 目标内部导入代码


    如果你正在编写混合语言 App，你可能需要从 Swift 访问 Objective-C 代码，以及从 Objective-C 访问 Swift 代码。本节描述的过程适用于非框架目标。


    ## 将 Objective-C 导入 Swift


    要在与 Swift 代码相同的 App 目标中导入一组 Objective-C 文件，你需要依靠“Objective-C 桥接头文件”（Objective-C
    bridging header）将这些文件暴露给 Swift。当你向现有的 Objective-C App 添加 Swift 文件，或向现有的 Swift
    App 添加 Objective-C 文件时，Xcode 会提议创建此头文件。


    ![image: ../Art/bridgingheader_2x.png](img/bridgingheader_2x.png)


    如果你接受，Xcode 会随你创建的文件一起创建头文件，并命名为你的产品模块名称后加上 `"-Bridging-Header.h"`。（你稍后将在命名你的产品模块
    中学习更多信息。）


    或者，你可以通过选择 `File > New > File > (iOS or OS X) > Source > Header File` 来自己创建一个桥接头文件。


    你需要编辑该桥接头文件，将你的 Objective-C 代码暴露给 Swift 代码。


    ### 从同一目标将 Objective-C 代码导入 Swift


    1. 在你的 Objective-C 桥接头文件中，导入每一个你想暴露给 Swift 的 Objective-C 头文件。例如：


    Objective-C


    * `#import "XYZCustomCell.h"`

    * `#import "XYZCustomView.h"`

    * `#import "XYZCustomViewController.h"`


    2. 在 `Build Settings` 下，确保 `Swift Compiler - Code Generation` 下的 `Objective-C
    Bridging Header` 构建设置具有指向头文件的路径。


    该路径应相对于你的项目，类似于你在 `Build Settings` 中指定 `Info.plist` 路径的方式。在大多数情况下，你不需要修改此设置。


    在该桥接头文件中列出的任何公共 Objective-C 头文件对 Swift 都是可见的。Objective-C 功能将自动在该在该目标内的任何 Swift
    文件中可用，无需任何导入语句。使用你与系统类时相同的 Swift 语法使用你自定义的 Objective-C 代码。


    Swift


    * `let myCell = XYZCustomCell()`

    * `myCell.subtitle = "A custom cell"`


    ### 将 Swift 导入 Objective-C


    当你将 Swift 代码导入 Objective-C 时，你依靠一个“Xcode 生成的头文件”（Xcode-generated header）将这些文件暴露给
    Objective-C。这个自动生成的文件是一个 Objective-C 头文件，声明了你目标中的 Swift 接口。它可以被视为 Swift 代码的伞头头。该头文件的名称为你的产品模块名称后加上
    `"-Swift.h"`。（你稍后将在命名你的产品模块 中学习更多信息。）


    默认情况下，生成的头文件包含标记有 `public` 修饰符的 Swift 声明的接口。如果你的 App 目标有一个 Objective-C 桥接头文件，它还包含标记有
    `internal` 修饰符的声明。标记为 `private` 的声明不会出现在生成的头文件中。除非显式标记了 `@IBAction`、`@IBOutlet`
    或 `@objc`，否则私声明不会暴露给 Objective-C。关于访问级别修饰符的更多信息，请参见 Swift 编程语言 中的访问控制。


    你不需要任何特殊操作来创建生成的头文件——只需将其导入并在你的 Objective-C 代码中使用其内容。请注意，生成的头文件中的 Swift 接口包含了其中使用的所有
    Objective-C 类型的引用。如果你在 Swift 代码中使用自定义的 Objective-C 类型，请在将 Swift 生成的头文件导入要访问 Swift
    代码的 Objective-C `.m` 文件之前，确保已导入这些类型的 Objective-C 头文件。


    ### 从同一目标将 Swift  Objective-C


    * 使用此语法并替换相应的名称，将该目标中的 Swift 代码导入该目标内的任何 Objective-C `.m` 文件：


    Objective-C


    * `#import "ProductModuleName-Swift.h"`


    目标中的 Swift 文件将在包含此导入语句的 Objective-C `.m` 文件中可见。关于在 Objective-C 代码中用 Swift 的信息，请参阅在
    Objective-C 中使用 Swift。


    | | 导入到 Swift | 导入到 Objective-C |

    | --- | --- | --- |

    | Swift 代码 | 无导入语句 | `#import "ProductModuleName-Swift.h"` |

    | Objective-C 代码 | 无导入语句；需要 Objective-C 桥接 | `#import "Header.h"` |


    ## 从同一个框架目标内部导入代码


    如果你正在编写混合语言框架，你可能需要从 Swift 访问 Objective-C 代码，以及从 Objective-C 访问 Swift 代码。


    ## 将 Objective-C 导入 Swift


    要在与 Swift 代码相同的框架目标中导入一组 Objective-C 文件，你需要将这些文件导入框架的 Objective-C 伞头文件中。


    ### 从同一框架将 Objective-C 代码导入 Swift


    1. 在 `Build Settings` 的 `Packaging` 下，确保该框架目标的 `Defines Module` 设置为 Yes。


    2. 在你的伞头文件中，导入每一个你想暴露给 Swift 的 Objective-C 头文件。例如：


    Objective-C


    * `#import <XYZ/XYZCustomCell.h>`

    * `#import <XYZ/XYZCustomView.h>`

    * `#import <XYZ/XYZCustomViewController.h>`


    Swift 将看到你在伞头文件中公有的所有头文件。该框架内 Objective-C 文件的内容将自动在该框架目标内的任何 Swift 文件中可用，无需任何导入语句。使用你与系统类时相同的
    Swift 语法使用你自定义的 Objective-C 代码。


    Swift


    * `let myCell = XYZCustomCell()`

    * `myCell.subtitle = "A custom cell"`


