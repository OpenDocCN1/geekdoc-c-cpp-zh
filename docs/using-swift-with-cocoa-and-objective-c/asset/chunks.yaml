    \   `#import <XYZ/XYZCustomCell.h>`\n\n    *   `#import <XYZ/XYZCustomView.h>`\n\
    \n    *   `#import <XYZ/XYZCustomViewController.h>`\n\nSwift will see every header\
    \ you expose publicly in your umbrella header. The contents of the Objective-C\
    \ files in that framework will be available in any Swift file within that framework\
    \ target automatically, without any import statements. Use your custom Objective-C\
    \ code with the same Swift syntax you use with system classes.\n\nSwift\n\n* \
    \  `let``myCell` `=` `XYZCustomCell``()`\n\n*   `myCell``.``subtitle` `=` `\"\
    A custom cell\"`\n\n‌\n\n### Importing Swift into Objective-C\n\nTo import a set\
    \ of Swift files in the same framework target as your Objective-C code, you don’t\
    \ need to import anything into the umbrella header for the framework. Instead,\
    \ import the Xcode-generated header file for your Swift code into any Objective-C\
    \ `.m` file you want to use your Swift code from."
