    \ long` | `CUnsignedLongLong` |\n\n| `wchar_t` | `CWideChar` |\n\n| `char16_t`\
    \ | `CChar16` |\n\n| `char32_t` | `CChar32` |\n\n| `float` | `CFloat` |\n\n| `double`\
    \ | `CDouble` |\n\n‌\n\n### Enumerations\n\nSwift imports as a Swift enumeration\
    \ any C-style enumeration marked with the `NS_ENUM` macro. This means that the\
    \ prefixes to enumeration value names are truncated when they are imported into\
    \ Swift, whether they’re defined in system frameworks or in custom code. For example,\
    \ see this Objective-C enumeration:\n\nObjective-C\n\n*   `typedef``NS_ENUM``(``NSInteger``,``UITableViewCellStyle``)``{`\n\
    \n*   `UITableViewCellStyleDefault``,`\n\n*   `UITableViewCellStyleValue1``,`\n\
    \n*   `UITableViewCellStyleValue2``,`\n\n*   `UITableViewCellStyleSubtitle`\n\n\
    *   `};`\n\nIn Swift, it’s imported like this:\n\nSwift\n\n*   `enum``UITableViewCellStyle``:`\
    \ `Int` `{`\n\n*   `case``Default`\n\n*   `case``Value1`\n\n*   `case``Value2`\n\
    \n*   `case``Subtitle`\n\n*   `}`\n\nWhen you refer to an enumeration value, use\
    \ the value name with a leading dot (`.`).\n\nSwift\n\n*   `let``cellStyle``:`\
    \ `UITableViewCellStyle` `= .``Default`\n\nSwift also imports options marked with\
    \ the `NS_OPTIONS` macro. Whereas options behave similarly to imported enumerations,\
    \ options can also support some bitwise operations, such as `&`, `|`, and `~`.\n\
    \nIn Objective-C, you represent an empty option set with the constant zero (`0`).\
    \ In Swift, use `nil` to represent the absence of any options. For example:\n\n\
    Swift\n\n*   `let``myString` `=` `myData``.``base64EncodedStringWithOptions``(``nil``)`\n\
    \n‌\n\n### Pointers\n\nWhenever possible, Swift avoids giving you direct access\
    \ to pointers. There are, however, various pointer types available for your use\
    \ when you need direct access to memory. The following tables use `Type` as a\
    \ placeholder type name to indicate syntax for the mappings.\n\nFor return types,\
    \ variables, and arguments, the following mappings apply:\n\n| C Syntax | Swift\
    \ Syntax |\n\n| --- | --- |\n\n| `const Type *` | `UnsafePointer<Type>` |\n\n\
    | `Type *` | `UnsafeMutablePointer<Type>` |\n\nFor class types, the following\
    \ mappings apply:\n\n| C Syntax | Swift Syntax |\n\n| --- | --- |\n\n| `Type *\
    \ const *` | `UnsafePointer<Type>` |\n\n| `Type * __strong *` | `UnsafeMutablePointer<Type>`\
    \ |\n\n| `Type **` | `AutoreleasingUnsafeMutablePointer<Type>` |\n\n‌\n\n### Constant\
    \ Pointers\n\nWhen a function is declared as taking a `UnsafePointer<Type>` argument,\
    \ it can accept any of the following:\n\n*   `nil`, which is passed as a null\
    \ pointer\n\n*   An `UnsafePointer<Type>`, `UnsafeMutablePointer<Type>`, or `AutoreleasingUnsafeMutablePointer<Type>`\
    \ value, which is converted to `UnsafePointer<Type>` if necessary\n\n*   An in-out\
    \ expression whose operand is an lvalue of type `Type`, which is passed as the\
    \ address of the lvalue\n\n*   A `[Type]` value, which is passed as a pointer\
    \ to the start of the array, and lifetime-extended for the duration of the call\n\
    \nIf you have declared a function like this one:\n\nSwift\n\n*   `func``takesAPointer``(``x``:`\
    \ `UnsafePointer``<``Float``>) {` `/*...*/` `}`\n\nYou can call it in any of the\
    \ following ways:\n\nSwift\n\n*   `var``x``:` `Float` `=` `0.0`\n\n*   `var``p``:`\
    \ `UnsafePointer``<``Float``> =` `nil`\n\n*   `takesAPointer``(``nil``)`\n\n*\
    \   `takesAPointer``(``p``)`\n\n*   `takesAPointer``(&``x``)`"
