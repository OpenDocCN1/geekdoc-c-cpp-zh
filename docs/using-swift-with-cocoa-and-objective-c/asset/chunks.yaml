    \ 中，属性有一系列潜在的特性，用于指定关于属性行为的额外信息。在 Swift 中，你以不同的方式指定这些属性特性。\n\n### 强与弱\n\nSwift\
    \ 属性默认是强引用（strong）。使用 `weak` 关键字表示该属性对存储为其值的对象有一个弱引用。该关键字只能用于可选类类型的属性。有关更多信息，请参阅*The\
