    \ the class name in the Class field in the model entity inspector with the name\
    \ of your module.\n\n![image: ../Art/coredatanamespace_2x.png](Art/coredatanamespace_2x.png)\n\
    \n### Using Swift Class Names with Objective-C APIs\n\nSwift classes are namespaced\
    \ based on the module they are compiled in, even when used from Objective-C code.\
    \ Unlike Objective-C, where all classes are part of a global namespace–and must\
    \ not have the same name–Swift classes can be disambiguated based on the module\
    \ they reside in. For example, the fully qualified name of a Swift class named\
    \ `DataManager` in a framework named `MyFramework` is `MyFramework.DataManager`.\
    \ A Swift app target is a module itself, so the fully qualified name of a Swift\
    \ class named `Observer` in an app called `MyGreatApp` is `MyGreatApp.Observer`.\n\
    \nIn order to preserve namespacing when a Swift class is used in Objective-C code,\
    \ Swift classes are exposed to the Objective-C runtime with their fully qualified\
    \ names. Therefore, when you work with APIs that operate on the string representation\
    \ of a Swift class, you must include the fully qualified name of the class. For\
    \ example, when you create a document-based Mac app, you provide the name of your\
    \ `NSDocument` subclass in your app’s `Info.plist` file. In Swift, you must use\
    \ the full name of your document subclass, including the module name derived from\
    \ the name of your app or framework.\n\nIn the example below, the `NSClassFromString`\
    \ function is used to retrieve a reference to a class from its string representation.\
    \ In order to retrieve a Swift class, the fully qualified name, including the\
    \ name of the app, is used.\n\n#### Swift\n\n```swift\nlet myPersonClass: AnyClass\
    \ = NSClassFromString(\"MyGreatApp.Person\")\n```\n\n### Working with Cocoa Types\n\
    \nAs part of its interoperability with Objective-C, Swift offers convenient and\
    \ efficient ways of working with Cocoa types. Swift automatically converts Objective-C\
    \ types to Swift types, and some Swift types to Objective-C. There are also a\
    \ number of data types in Swift and Objective-C that can be used interchangeably.\
    \ Data types that are convertible or can be used interchangeably are referred\
    \ to as bridged types. For example, in Swift, you can pass an `Array` value to\
    \ a method expecting an `NSArray`.\n\n### Strings\n\nSwift automatically bridges\
    \ between the `String` type and the `NSString` class. This means that anywhere\
    \ you use an `NSString` object, you can use a Swift `String` type instead and\
    \ gain the benefits of both—the `String` type’s interpolation and Swift-designed\
    \ APIs and the `NSString` class’s broad functionality. For this reason, you should\
    \ almost never need to use the `NSString` class directly in your own code. In\
    \ fact, when Swift imports Objective-C APIs, it replaces all of the `NSString`\
    \ types with `String` types. When your Objective-C code uses a Swift class, the\
    \ importer replaces all of the `String` types with `NSString` in imported API.\n\
    \nTo enable string bridging, just import Foundation. For example, you can call\
    \ `capitalizedString`—a method on the `NSString` class—on a Swift string, and\
    \ Swift automatically bridges the Swift `String` to an `NSString` object and calls\
    \ the method. The method even returns a Swift `String` type, because it was converted\
    \ during import.\n\n#### Swift\n\n```swift\nimport Foundation\nlet greeting =\
    \ \"hello, world!\"\nlet capitalizedGreeting = greeting.capitalizedString\n//\
    \ capitalizedGreeting: String = Hello, World!\n```\n\nIf you do need to use an\
    \ `NSString` object, you can convert it to a Swift `String` value by casting it.\
    \ The `String` type can always be converted from an `NSString` object to a Swift\
    \ `String` value, so there’s no need to use the optional version of the type casting\
    \ operator (`as?`). You can also create an `NSString` object from a string literal\
    \ by explicitly typing the constant or variable.\n\n#### Swift\n\n```swift\nimport\
    \ Foundation\nlet myString: NSString = \"123\"\nif let integerValue = (myString\
    \ as String).toInt() {\n    print(\"\\(myString) is the integer \\(integerValue)\"\
    )\n}\n```\n"
