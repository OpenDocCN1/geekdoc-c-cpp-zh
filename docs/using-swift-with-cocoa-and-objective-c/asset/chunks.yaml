  trans: "\n\n在 Objective-C 中，初始化器直接返回它们所初始化的对象。为了在初始化失败时通知调用者，Objective-C 初始化器可以返回\
    \ `nil`。在 Swift 中，这种模式被内置在名为“可失败初始化”（failable initialization）的语言特性中。iOS 和 OS 系统框架中的许多\
    \ Objective-C 初始化器已经过审核，以指示初始化可能会失败。这些 Objective-C 初始化器被导入为 `init(...)`——如果初始化不会失败——或\
    \ `init?(...)`——如果初始化可能会失败。在你自定义的 Objective-C 类以及尚未审核的框架中的类中，初始化器被导入为 `init!(...)`。例如，如果提供的路径下不存在文件，则内置的\
    \ `NSString(contentsOfFile:)` 初始化器可能无法初始化一个 `NSString` 对象。如果初始化成功，你可以使用可选绑定（optional\
    \ binding）来解包失败初始化器的结果。\n\n### Swift\n\n```swift\nif let fileContents = NSString(contentsOfFile:\"\
    MyFile.txt\") {\n    println(fileContents)\n}\n```\n\n### 访问属性\n\n在 Swift 中使用点语法（dot\
    \ syntax）访问和设置 Objective-C 对象的属性。\n\n### Swift\n\n```swift\nmyTextField.textColor\
    \ = UIColor.darkGrayColor()\nmyTextField.text = \"Hello world\"\n```\n\n在获取或设置属性时，使用属性名且不加括号。注意\
    \ `darkGrayColor` 有有一组括号。这是因为 `darkGrayColor` 是 `UIColor` 的类方法，而不是属性。\n\n在 Objective-C\
    \ 中，一个返回值且没有参数的方法可以被视为隐式 getter（implicit getter），并可以使用与属性 getter 相同的语法调用。在 Swift\
    \ 中并非如此。在 Swift 中，只有在 Objective-C 中使用 `@property` 语法编写的属性才会被导入为属性。方法的导入和调用如与方法进行交互\
    \ 所示。\n\n### 与方法进行交互\n\n当从 Swift 调用 Objective-C 方法时，请使用点语法。\n\n当 Objective-C 方法传递到\
    \ Swift 时，Objective-C 选择器（selector）的第一部分将成为基础方法名，并出现在括号之外。第一个参数紧接在括号内部，没有名称。选择器的其余部分对应于参数名，并位于括号内部。在调用处需要所有的选择器部分。\n\
    \n例如，在 Objective-C 中你可能会这样做：\n\n### Objective-C\n\n```objective\n[myTableView\
    \ insertSubview:mySubview atIndex:2];\n```\n\n在 Swift 中，你这样做：\n\n```swift\nmyTableView.insertSubview(mySubview,\
    \ atIndex:2)\n```\n\n如果你调用的是一个没有参数的方法，仍然必须包含括号。\n\n### Swift\n\n```swift\nmyTableView.layoutIfNeeded()\n\
    ```\n\n### id 兼容性\n\nSwift 包含一个名为 `AnyObject` 的协议类型，它代表任何类型的对象，就像 Objective-C\
    \ 中的 `id` 一样。`AnyObject` 协议允许你在编写类型安全的 Swift 代码的同时，保持未类型化对象的灵活性。由于 `AnyObject`\
    \ 协议提供了额外的安全性，Swift 将 `id` 导入为 `AnyObject`。\n\n例如，与 `id` 一样，你可以将任何类类型的对象赋值给类型为\
    \ `AnyObject` 的常量或变量。你也可以将变量重新赋值为不同类型的对象。\n\n### Swift\n\n```swift\nvar myObject:\
    \ AnyObject = UITableViewCell()\nmyObject = NSDate()\n```\n\n你也可以调用任何 Objective-C\
    \ 方法并访问任何属性，而无需强制转换为更具体的类类型。这包括标记有 `@objc` 属性的 Objective-C 兼容性方法。\n\n### Swift\n\
    \n```swift\nlet futureDate = myObject.dateByAddingTimeInterval(10)\nlet timeSinceNow\
    \ = myObject.timeIntervalSinceNow\n```\n\n然而，由于类型为 `AnyObject` 的对象的特定类型在运行时未知，因此可能会无意中编写不安全的代码。与\
    \ Objective-C 一样，如果你在一个 `AnyObject` 类型对象上调用不存在的方法或访问的属性，会导致运行时错误。例如，以下代码可以编译而不会报错，但在运行时会导致未识别的选择器错误（unrecognized\
    \ selector error）：\n\n### Swift\n\n```swift\nmyObject.characterAtIndex(5)\n//\
    \ crash，myObject 不响应该方法\n```\n\n你可以利用 Swift 中的可选值（optionals）从代码中消除这种常见的 Objective-C\
    \ 错误。当你对 `AnyObject` 类型对象调用 Objective-C 方法时，该方法调用的实际上类似于隐式解包可选值（implicitly unwrapped\
    \ optional）。你可以使用与协议中的可选方法相同的可选链（optional chaining）语法，来可选地调用 `AnyObject` 的方法。同样的过程也适用于属性。\n\
    \n例如，在下面的代码列表中，第一行和第二行不会执行，因为 `NSDate` 对象上不存在 `count` 属性和 `characterAtIndex:`\
    \ 方法。`myCount` 常数被推断为可选的 `Int`，并设置为 `nil`。你也可以使用 `if–let` 语句来条件地解包对象可能不响应的方法的结果，如第三行所示。\n\
    \n### Swift\n\n```swift\nlet myCount = myObject.count?\nlet myChar = myObject.characterAtIndex?(5)\n\
    if let fifthCharacter = myObject.characterAtIndex?(5)\n```\n\n与 Swift 中所有的向下转换（downcasts）一样，从\
    \ `AnyObject` 转换为特定的对象类型不能保证成功，因此返回一个可选值。你可以检查该可选值来确定转换是否成功。\n\n### Swift\n\n\
    ```swift\nlet userDefaults = NSUserDefaults.standardUserDefaults()\nlet lastRefreshDate:\
    \ AnyObject? = userDefaults.objectForKey(\"LastDate\")\nif let date = lastRefreshDate\
    \ as? NSDate {\n    print(\"Found \\(date.timeIntervalSinceReference)\")\n}\n\
    ```\n\n当然，如果你确定对象的类型（并且知道它不是 `nil`），可以使用 `as` 运算符强制调用。\n\n### Swift\n\n```swift\n\
    let myDate = lastRefreshDate as NSDate\nlet timeInterval = myDate.timeIntervalSinceReference\n\
    ```\n\n### 处理 nil\n\n在 Objective-C 中，你使用可能为 `NULL`（在 Objective-C 中称为 `nil`）的原始指针处理对象引用。在\
    \ Swift 中，所有值（包括结构体和对象引用）都保证非空。相反，你通过将值的类型包装在可选类型中表示可能缺失的值。当你需要指示值缺失时，使用值 `nil`。有关可选值的更多信息，请参阅\
    \ Swift 编程语言中的可选。\n\n由于 Objective-C 不保证对象非空，Swift 将导入的 Objective-C API 中的类类型包装在隐式解包可选类型（implicitly\
    \ unwrapped optional type）中。在使用 Objective-C 对象之前，你应该检查它是否缺失。例如，下面的 Objective-C\
    \ 方法：\n\n### Objective-C\n\n```objectivec\n- (NSDate *)dueDateForProject:(Project*)project;\n\
    ```\n\n被导入到 Swift 中变为：\n\n### Swift\n\n```swift\nfunc dueDateForProject(project:\
    \ Project!) -> NSDate!\n```\n\n"
- fmt: "\nIn some cases, you might be absolutely certain that an Objective-C method\
    \ or property never returns a `nil` object reference. To make objects in this\
    \ special scenario more convenient to work with, Swift imports object types as\
    \ *implicitly unwrapped optionals*. Implicitly unwrapped optional types include\
    \ all of the safety features of optional types. In addition, you can access the\
    \ value directly without checking for `nil` or unwrapping it yourself. When you\
    \ access the value in this kind of optional type without safely unwrapping it\
    \ first, the implicitly unwrapped optional checks whether the value is missing.\
    \ If the value is missing, a runtime error occurs. As a result, you should always\
    \ check and unwrap an implicitly unwrapped optional yourself, unless you are sure\
    \ that the value cannot be missing.\n\n### Extensions\n\nA Swift extension is\
    \ similar to an Objective-C category. Extensions expand the behavior of existing\
    \ classes, structures, and enumerations, including those defined in Objective-C.\
    \ You can define an extension on a type from either a system framework or one\
    \ of your own custom types. Simply import the appropriate module, and refer to\
    \ the class, structure, or enumeration by the same name that you would use in\
    \ Objective-C.\n\nFor example, you can extend the `UIBezierPath` class to create\
    \ a simple Bézier path with an equilateral triangle, based on a provided side\
    \ length and starting point.\n\n```swift\nextension UIBezierPath {\n    convenience\
    \ init(triangleSideLength: Float, origin: CGPoint) {\n        self.init()\n  \
    \      let squareRoot = Float(sqrt(3.0))\n        let altitude = (squareRoot *\
    \ triangleSideLength) / 2\n        moveToPoint(origin)\n        addLineToPoint(CGPoint(x:\
    \ triangleSideLength, y: origin.x))\n        addLineToPoint(CGPoint(x: triangleSideLength\
    \ / 2, y: altitude))\n        closePath()\n    }\n}\n```\n\nYou can use extensions\
    \ to add properties (including class and static properties). However, these properties\
    \ must be computed; extensions can’t add stored properties to classes, structures,\
    \ or enumerations.\n\nThis example extends the `CGRect` structure to contain a\
    \ computed `area` property:\n\n```swift\nextension CGRect {\n    var area: CGFloat\
    \ {\n        return width * height\n    }\n}\nlet rect = CGRect(x: 0.0, y: 0.0,\
    \ width: 10.0, height: 50.0)\nlet area = rect.area\n// area: CGFloat = 500.0\n\
    ```\n\nYou can also use extensions to add protocol conformance to a class without\
    \ subclassing it. If the protocol is defined in Swift, you can also add conformance\
    \ to it to structures or enumerations, whether defined in Swift or Objective-C.\n\
    \nYou cannot use extensions to override existing methods or properties on Objective-C\
    \ types.\n\n### Closures\n\nObjective-C blocks are automatically imported as Swift\
    \ closures. For example, here is an Objective-C block variable:\n\n```objective-C\n\
    void (^completionBlock)(NSData*, NSError*) = ^(NSData *data, NSError *error) {\
    \ /* ... */ };\n```\n\nAnd here’s what it looks like in Swift:\n\n```swift\nlet\
    \ completionBlock: (NSData, NSError) -> Void = { data, error in /* ... */ }\n\
    ```\n\nSwift closures and Objective-C blocks are compatible, so you can pass Swift\
    \ closures to Objective-C methods that expect blocks. Swift closures and functions\
    \ have the same type, so you can even pass the name of a Swift function.\n\nClosures\
    \ have similar capture semantics as blocks but differ in one key way: Variables\
    \ are mutable rather than copied. In other words, the behavior of `__block` in\
    \ Objective-C is the default behavior for variables in Swift.\n\n### Object Comparison\n\
    \nThere are two distinct types of comparison when you compare two objects in Swift.\
    \ The first, *equality* (`==`), compares the contents of the objects. The second,\
    \ *identity* (`===`), determines whether or not the constants or variables refer\
    \ to the same object instance.\n\nSwift and Objective-C objects are typically\
    \ compared in Swift using the `==` and `===` operators. Swift provides a default\
    \ implementation of the `==` operator for objects that derive from the `NSObject`\
    \ class. In the implementation of this operator, Swift invokes the `isEqual:`\
    \ method defined on the `NSObject` class. The `NSObject` class only performs an\
    \ identity comparison, so you should implement your own `isEqual:` method in classes\
    \ that derive from the `NSObject` class. Because you can pass Swift objects (including\
    \ ones not derived from `NSObject`) to Objective-C APIs, you should implement\
    \ the `isEqual:` method for these classes if you want the Objective-C APIs to\
    \ compare the contents of the objects rather than their identities.\n\nAs part\
    \ of implementing equality for your class, be sure to implement the `hash` property\
    \ according to the rules in Object comparison in *Cocoa Core Competencies*. Further,\
    \ if you want to use your class as keys in a dictionary, also conform to the `Hashable`\
    \ protocol and implement the `hashValue` property.\n\n### Swift Type Compatibility\n\
    \nWhen you create a Swift class that descends from an Objective-C class, the class\
    \ and its members—properties, methods, subscripts, and initializers—are automatically\
    \ available from Objective-C. In some cases, you need finer grained control over\
    \ how your Swift API is exposed to Objective-C. You can use the `@objc` attribute\
    \ if your Swift class doesn’t inherit from an Objective-C class, or if you want\
    \ to change the name of a symbol in your interface as it’s exposed to Objective-C\
    \ code. You can also use the `dynamic` modifier to require that access to members\
    \ be dynamically dispatched through the Objective-C runtime if you’re using APIs\
    \ like key–value observing that dynamically replace the implementation of a method.\n\
    \n### Exposing Swift Interfaces in Objective-C\n\nWhen you define a Swift class\
    \ that inherits from `NSObject` or any other Objective-C class, the class is automatically\
    \ compatible with Objective-C. All of the steps in this section have already been\
    \ done for you by the Swift compiler. If you never import a Swift class in Objective-C,\
    \ you don’t need to worry about type compatibility in this case well. Otherwise,\
    \ if your Swift class does not derive from an Objective-C class and you want to\
    \ use it from Objective-C code, you can use the `@objc` attribute described below.\n\
    \nThe `@objc` attribute makes your Swift API available in Objective-C and the\
    \ Objective-C runtime. In other words, you can use the `@objc` attribute before\
    \ any Swift method, property, subscript, initializer, or class that you want to\
    \ use from Objective-C code. If your class inherits from an Objective-C class,\
    \ the compiler inserts the attribute for you. The compiler also adds the attribute\
    \ to every member in a class that is itself marked with the `@objc` attribute.\
    \ When you use the `@IBOutlet`, `@IBAction`, or `@NSManaged` attribute, the `@objc`\
    \ attribute is added as well. This attribute is also useful when you’re working\
    \ with Objective-C classes that use selectors to implement the target-action design\
    \ pattern—for example, `NSTimer` or `UIButton`.\n\nWhen you use a Swift API from\
    \ Objective-C, the compiler typically performs a direct translation. For example,\
    \ the Swift API `func playSong(name: String)` is imported as `- (void)playSong:(NSString\
    \ *)name` in Objective-C. However, there is one exception: When you use a Swift\
    \ initializer in Objective-C, the compiler adds the text “initWith” to the beginning\
    \ of the method and properly capitalizes the first character in the original initializer.\
    \ For example, this Swift initializer `init (songName: String, artist: String)`\
    \ is imported as `- (instancetype)initWithSongName:(NSString *)songName artist:(NSString\
    \ *)artist` in Objective-C.\n"
  raw: 'In some cases, you might be *absolutely* certain that an Objective-C method
    or property never returns a `nil` object reference. To make objects in this special
    scenario more convenient to work with, Swift imports object types as *implicitly
    unwrapped optionals*. Implicitly unwrapped optional types include all of the safety
    features of optional types. In addition, you can access the value directly without
    checking for `nil` or unwrapping it yourself. When you access the value in this
    kind of optional type without safely unwrapping it first, the implicitly unwrapped
    optional checks whether the value is missing. If the value is missing, a runtime
    error occurs. As a result, you should always check and unwrap an implicitly unwrapped
    optional yourself, unless you are sure that the value cannot be missing.


    ‌


    ### Extensions


    A Swift extension is similar to an Objective-C category. *Extensions* expand the
    behavior of existing classes, structures, and enumerations, including those defined
    in Objective-C. You can define an extension on a type from either a system framework
    or one of your own custom types. Simply import the appropriate module, and refer
    to the class, structure, or enumeration by the same name that you would use in
    Objective-C.


    For example, you can extend the `UIBezierPath` class to create a simple Bézier
    path with an equilateral triangle, based on a provided side length and starting
    point.


    Swift


    *   `extension``UIBezierPath` `{`


    *   `convenience``init``(``triangleSideLength``:` `Float``,` `origin``:` `CGPoint``)
    {`


    *   `self``.``init``()`


    *   `let``squareRoot` `=` `Float``(``sqrt``(``3.0``))`


    *   `let``altitude` `= (``squareRoot` `*` `triangleSideLength``) /` `2`


    *   `moveToPoint``(``origin``)`


    *   `addLineToPoint``(``CGPoint``(``x``:` `triangleSideLength``,` `y``:` `origin``.``x``))`


    *   `addLineToPoint``(``CGPoint``(``x``:` `triangleSideLength` `/` `2``,` `y``:`
    `altitude``))`


    *   `closePath``()`


    *   `}`


    *   `}`


    You can use extensions to add properties (including class and static properties).
    However, these properties must be computed; extensions can’t add stored properties
    to classes, structures, or enumerations.


    This example extends the `CGRect` structure to contain a computed `area` property:


    Swift


    *   `extension``CGRect` `{`


    *   `var``area``:` `CGFloat` `{`


    *   `return``width` `*` `height`


    *   `}`


    *   `}`


    *   `let``rect` `=` `CGRect``(``x``:` `0.0``,` `y``:` `0.0``,` `width``:` `10.0``,`
    `height``:` `50.0``)`


    *   `let``area` `=` `rect``.``area`


    *   `// area: CGFloat = 500.0`


    You can also use extensions to add protocol conformance to a class without subclassing
    it. If the protocol is defined in Swift, you can also add conformance to it to
    structures or enumerations, whether defined in Swift or Objective-C.


    You cannot use extensions to override existing methods or properties on Objective-C
    types.


    ‌


    ### Closures


    Objective-C blocks are automatically imported as Swift closures. For example,
    here is an Objective-C block variable:


    Objective-C


    *   `void``(``^``completionBlock``)(``NSData``*``,``NSError``*``)``=``^``(``NSData``*``data``,``NSError``*``error``)``{``/*
    ... */``}`


    And here’s what it looks like in Swift:


    Swift


    *   `let``completionBlock``: (``NSData``,` `NSError``) ->` `Void` `= {``data``,`
    `error``in``/* ... */``}`


    Swift closures and Objective-C blocks are compatible, so you can pass Swift closures
    to Objective-C methods that expect blocks. Swift closures and functions have the
    same type, so you can even pass the name of a Swift function.


    Closures have similar capture semantics as blocks but differ in one key way: Variables
    are mutable rather than copied. In other words, the behavior of `__block` in Objective-C
    is the default behavior for variables in Swift.


    ‌


    ### Object Comparison


    There are two distinct types of comparison when you compare two objects in Swift.
    The first, *equality* (`==`), compares the contents of the objects. The second,
    *identity* (`===`), determines whether or not the constants or variables refer
    to the same object instance.


    Swift and Objective-C objects are typically compared in Swift using the `==` and
    `===` operators. Swift provides a default implementation of the `==` operator
    for objects that derive from the `NSObject` class. In the implementation of this
    operator, Swift invokes the `isEqual:` method defined on the `NSObject` class.
    The `NSObject` class only performs an identity comparison, so you should implement
    your own `isEqual:` method in classes that derive from the `NSObject` class. Because
    you can pass Swift objects (including ones not derived from `NSObject`) to Objective-C
    APIs, you should implement the `isEqual:` method for these classes if you want
    the Objective-C APIs to compare the contents of the objects rather than their
    identities.


    As part of implementing equality for your class, be sure to implement the `hash`
    property according to the rules in Object comparison in *Cocoa Core Competencies*.
    Further, if you want to use your class as keys in a dictionary, also conform to
    the `Hashable` protocol and implement the `hashValue` property.


    ‌


    ### Swift Type Compatibility


    When you create a Swift class that descends from an Objective-C class, the class
    and its members—properties, methods, subscripts, and initializers—are automatically
    available from Objective-C. In some cases, you need finer grained control over
    how your Swift API is exposed to Objective-C. You can use the `@objc` attribute
    if your Swift class doesn’t inherit from an Objective-C class, or if you want
    to change the name of a symbol in your interface as it’s exposed to Objective-C
    code. You can also use the `dynamic` modifier to require that access to members
    be dynamically dispatched through the Objective-C runtime if you’re using APIs
    like key–value observing that dynamically replace the implementation of a method.


    ‌


    ### Exposing Swift Interfaces in Objective-C


    When you define a Swift class that inherits from `NSObject` or any other Objective-C
    class, the class is automatically compatible with Objective-C. All of the steps
    in this section have already been done for you by the Swift compiler. If you never
    import a Swift class in Objective-C code, you don’t need to worry about type compatibility
    in this case as well. Otherwise, if your Swift class does not derive from an Objective-C
    class and you want to use it from Objective-C code, you can use the `@objc` attribute
    described below.


    The `@objc` attribute makes your Swift API available in Objective-C and the Objective-C
    runtime. In other words, you can use the `@objc` attribute before any Swift method,
    property, subscript, initializer, or class that you want to use from Objective-C
    code. If your class inherits from an Objective-C class, the compiler inserts the
    attribute for you. The compiler also adds the attribute to every member in a class
    that is itself marked with the `@objc` attribute. When you use the `@IBOutlet`,
    `@IBAction`, or `@NSManaged` attribute, the `@objc` attribute is added as well.
    This attribute is also useful when you’re working with Objective-C classes that
    use selectors to implement the target-action design pattern—for example, `NSTimer`
    or `UIButton`.


    When you use a Swift API from Objective-C, the compiler typically performs a direct
    translation. For example, the Swift API `func playSong(name: String)` is imported
    as `- (void)playSong:(NSString *)name` in Objective-C. However, there is one exception:
    When you use a Swift initializer in Objective-C, the compiler adds the text “initWith”
    to the beginning of the method and properly capitalizes the first character in
    the original initializer. For example, this Swift initializer `init (songName:
    String, artist: String)` is imported as `- (instancetype)initWithSongName:(NSString
    *)songName artist:(NSString *)artist` in Objective-C.'
