    ![](img/cover.jpg)


    # 入门


    ## 设置


    Swift 的设计旨在提供与 Cocoa 和 Objective-C 的无缝兼容。你可以在 Swift 中使用 Objective-C API（从系统框架到你自定义的代码），也可以在
    Objective-C 中使用 Swift API。这种兼容性使得 Swift 成为集成到你应用开发工作流中一个简单、方便且强大的工具。


    本指南涵盖了这种兼容性的三个重要方面，你可以在开发 Cocoa 应用时利用这些特性：


    *   **互操作性（Interoperability）**允许你在 Swift 和 Objective-C 之间进行接口交互，允许你在一种语言的文件中访问并使用另一种语言编写的代码。

    *   **混合与匹配（Mix and match）**允许你创建包含 Swift 和 Objective-C 文件的混合应用程序，这些文件可以相互通信。

    *   **迁移（Migration）**通过互操作性和混合匹配，从 Objective-C 代码迁移到 Swift 变得简单，使可以使用最新的 Swift
    特性替换 Objective-C 应用的部分。


    在开始学习这些特性之前，你需要基础了解如何设置一个可以访问 Cocoa 框架的 Swift 环境。


    ### 设置 Swift 环境


    为了开始在 Swift 中尝试访问 Cocoa 框架，请从 Xcode 模板创建一个基于 Swift 的应用程序。


    **在 Xcode 中创建 Swift 项目**


    1.  选择 `File` > `New` > `Project` > `(iOS or OS X)` > `Application` > `选择你的模板`。

    2.  点击 `Language` 下拉菜单并选择 `Swift`。


    ![image: ../Art/newproject_2x.png](img/newproject_2x.png)


    Swift 项目的结构与 Objective-C 项目几乎相同，唯一的区别是 Swift 没有头文件。实现和接口之间没有显式区分，因此关于特定类的所有信息都位于单个
    `.swift` 文件中。从这里，你可以通过在 delegate 中编写 Swift 代码来开始尝试，或者通过 `File` > `New` > `File`
    > `(iOS or OS X)` > `Source` > `Swift` 创建一个新的 Swift 类。


    ### 理解 Swift 导入过程


    设置好 Xcode 项目后，你可以从 Cocoa 导入任何框架以便在 Swift 中使用 Objective-C。


    任何作为 `module` 可访问的 Objective-C 框架（或 C 库）都可以直接导入到 Swift。这包括系统提供的所有 Objective-C
    框架——例如 `Foundation`、`UIKit` 和 `SpriteKit`——以及常用的 C 库。例如，要导入 `Foundation`，只需在你正在工作的
    Swift 文件顶部添加此导入语句：


    ```swift

    import Foundation

    ```


    此导入使得所有的 `Foundation` API（包括 `NSDate`、`NSURL`、`NSMutableData` 以及它们的所有方法、属性和分类）在
    Swift 中可用。


    导入过程非常简单。Objective-C 框架在头文件中提供 API。在 Swift 中，这些头文件被编译为 Objective-C 模块，然后作为 Swift
    API 导入。导入过程决定了在 Objective-C 代码中声明的函数、类和类型在 Swift 中如何显示。对于函数和方法，此过程影响它们的参数和返回值的类型。对于类型，导入过程可以做到：


    *   将某些 Objective-C 类型映射到 Swift 中的等效类型，例如 `id` 到 `AnyObject`

    *   将某些 Objective-C 核心类型映射到 Swift 中的替代类型，例如 `NSString` 到 `String`

    *   将某些 Objective-C 概念映射到 Swift 中对应的概念，例如指针映射到可选值（optionals）


    在“互操作性”部分，你将学习更多关于这些映射以及如何在 Swift 代码中利用它们。


    将 Swift 导入 Objective-C 的模型与将 Objective-C 导入 Swift 模型相似。Swift 将其 API（例如来自框架的）作为
    Swift 模块导出。与这些 Swift 模块同时生成的 Objective-C 头文件。这些头文件提供了映射回 Objective-C 的 API。某些
    Swift API 不映射回 Objective-C，因为它们利用了 Objective-C 的语言特性。有关在 Objective-C 中使用 Swift
    的更多信息，请参见 同一项目中的 Swift 和 Objective-C。


    ## 互操作性


    ## 与 Objective-C API 交互


    `互操作性`是在 Swift 和 Objective-C 之间进行双向交互的能力，允许你在一种语言的文件中访问并使用另一种语言的代码。当你开始将 Swift
    集成到应用开发工作流时，了解如何利用互操作性来重新定义、改进和增强编写 Cocoa 应用的方法是一个好主意。


    互操作性的一个重要方面是，它允许你在编写 Swift 代码时使用 Objective-C API。在导入 Objective-C 框架后，你可以从中实例化类并使用原生
    Swift 语法与其交互。


    ### 初始化


    要在 Swift 中实例化 Objective-C 类，你需要使用 Swift 语法调用其初始化器之一。当 Objective-C 的 `init` 方法进入
    Swift 时，它们采用了原生的 Swift 初始化器语法。“init” 前缀被去掉，并变成一个指示该方法为初始化器的关键字。对于以 “initWith”
    开头的 `init` 方法，“With” 也会被去掉。被剥离 `init` 或 `initWith` 的选择器部分（selector piece）的首字母变为小写，该选择器部分被视为第一个参数的。剩余的选择器部分也对应参数名称。每个选择器部分都放在括号内，并在调用处是必须的。


    例如，在 Objective-C 中你会这样做：


    ```objective-c

    UITableView *myTableView = [[UITableView alloc] initWithFrame:CGRectZero style:UITableViewStyleGrouped];

    ```


    在 Swift 中，你这样做：


    ```swift

    let myTableView: UITableView = UITableView(frame: .Zero, style: .grouped)

    ```


    你不需要调用 `alloc`；Swift 会为你处理好。注意在调用 Swift 风格的初始化器时，任何地方都没有出现“init”。


    你可以在初始化期间显式指定对象的类型，也可以省略类型。Swift 的类型推断正确确定了对象的类型。


    ```swift

    let myTextField = UITextField(frame: CGRect(x: 0.0, y: 0.0, width: 200.0, height:
    40.0))

    ```


    这些 `UITableView` 和 `UITextField` 对象拥有在 Objective-C 中相同的熟悉功能。你可以像在 Objective-C
    中一样使用它们，访问相应类中定义的任何属性并调用任何方法。


    为了保持一致性和简单，Objective-C 的工厂方法被映射为 Swift 中的便利初始化器。这种映射允许你与初始化器相同的简洁、清晰的语法使用它们。例如，在
    Objective-C 中你会这样调用这个工厂方法：


    ```objective-c

    UIColor *color = [UIColor colorWithRed:0.5 green:0.0 blue:0.5 alpha:1.0];

    ```


    在 Swift 中，你这样调用它：


    ```swift

    let color = UIColor(red: 0.5, green: 0.0, blue: 0.5, alpha: 1.0)

    ```


    ### 可失败初始化


    '
- fmt: "\nIn Objective-C, initializers directly return the object they initialize.\
    \ To inform the caller when initialization has failed, an Objective-C initializer\
    \ can return `nil`. In Swift, this pattern is built into the language feature\
    \ called `failable initialization`. Many Objective-C initializers in iOS and OS\
    \ X system frameworks have been audited to indicate whether initialization can\
    \ fail. These Objective-C initializers are imported as either `init(...)`—if initialization\
    \ cannot fail–or `init?(...)` if initialization can fail. In your own Objective-C\
    \ classes, and classes in frameworks that have not yet been audited, initializers\
    \ are imported as `init!(...)`. For example, the `NSString(contentsOfFile:)` initializer\
    \ can fail to initialize an `NSString` object if the file doesn’t exist at the\
    \ provided path. You can use optional binding to unwrap the result of a failable\
    \ initializer if initialization is successful.\n\n### Swift\n\n```swift\nif let\
    \ fileContents = NSString(contentsOfFile:\"MyFile.txt\") {\n    println(fileContents)\n\
    }\n```\n\n### Accessing Properties\n\nAccess and set properties on Objective-C\
    \ objects in Swift using dot syntax.\n\n### Swift\n\n```swift\nmyTextField.textColor\
    \ = UIColor.darkGrayColor()\nmyTextField.text = \"Hello world\"\n```\n\nWhen getting\
    \ or setting a property, use the name of the property without appending parentheses.\
    \ Notice that `darkGrayColor` has a set of parentheses. This is because `darkGrayColor`\
    \ is a class method on `UIColor`, not a property.\n\nIn Objective-C, a method\
    \ that returns a value and takes no arguments can be treated as an implicit getter—and\
    \ be called using the same syntax as a getter for a property. This is not the\
    \ case in Swift. In Swift, only properties that are written using the `@property`\
    \ syntax in Objective-C are imported as properties. Methods are imported and called\
    \ as described in [Working with Methods](#InteractingWithObjective-CAPIs.xhtml_TP40014216-CH4-XID_29).\n\
    \n### Working with Methods\n\nWhen calling Objective-C methods from Swift, use\
    \ dot syntax.\n\nWhen Objective-C methods come over to Swift, the first part of\
    \ an Objective-C selector becomes the base method name and appears outside the\
    \ parentheses. The first argument appears immediately inside the parentheses,\
    \ without a name. The rest of the selector pieces correspond to argument names\
    \ and go inside the parentheses. All selector pieces are required at the call\
    \ site.\n\nFor example, whereas in Objective-C you would do this:\n\n### Objective-C\n\
    \n```objective\n[myTableView insertSubview:mySubview atIndex:2];\n```\n\nIn Swift,\
    \ you do this:\n\n### Swift\n\n```swift\nmyTableView.insertSubview(mySubview,\
    \ atIndex:2)\n```\n\nIf you’re calling a method with no arguments, you must still\
    \ include the parentheses.\n\n### Swift\n\n```swift\nmyTableView.layoutIfNeeded()\n\
    ```\n\n### id Compatibility\n\nSwift includes a protocol type named `AnyObject`\
    \ that represents any kind of object, just as `id` does in Objective-C. The `AnyObject`\
    \ protocol allows you to write type-safe Swift code while maintaining the flexibility\
    \ of an untyped object. Because of the additional safety provided by the `AnyObject`\
    \ protocol, Swift imports `id` as `AnyObject`.\n\nFor example, as with `id`, you\
    \ can assign an object of any class type to a constant or variable typed as `AnyObject`.\
    \ You can also reassign a variable to an object of a different type.\n\n### Swift\n\
    \n```swift\nvar myObject: AnyObject = UITableViewCell()\nmyObject = NSDate()\n\
    ```\n\nYou can also call any Objective-C method and access any property without\
    \ casting to a more specific class type. This includes Objective-C compatible\
    \ methods marked with the `@objc` attribute.\n\n### Swift\n\n```swift\nlet futureDate\
    \ = myObject.dateByAddingTimeInterval(10)\nlet timeSinceNow = myObject.timeIntervalSinceNow\n\
    ```\n\nHowever, because the specific type of an object typed as `AnyObject` is\
    \ not known until runtime, it is possible to inadvertently write unsafe code.\
    \ As in Objective-C, if you invoke a method or access a property that does not\
    \ exist on an `AnyObject` typed object, it is a runtime error. For example, the\
    \ following code compiles without complaint and then causes an unrecognized selector\
    \ error at runtime:\n\n### Swift\n\n```swift\nmyObject.characterAtIndex(5)\n//\
    \ crash, myObject doesn't respond to that method\n```\n\nYou can take advantage\
    \ of optionals in Swift to eliminate this common Objective-C error from your code.\
    \ When you call an Objective-C method on an `AnyObject` type object, the method\
    \ call actually behaves like an implicitly unwrapped optional. You can use the\
    \ same optional chaining syntax you would use for optional methods in protocols\
    \ to optionally invoke a method on `AnyObject`. This same process applies to properties\
    \ as well.\n\nFor example, in the code listing below, the first and second lines\
    \ are not executed because the `count` property and the `characterAtIndex:` method\
    \ do not exist on an `NSDate` object. The `myCount` constant is inferred to be\
    \ an optional `Int`, and is set to `nil`. You can also use an `if–let` statement\
    \ to conditionally unwrap the result of a method that the object may not respond\
    \ to, as shown on line three.\n\n### Swift\n\n```swift\nlet myCount = myObject.count?\n\
    let myChar = myObject.characterAtIndex?(5)\nif let fifthCharacter = myObject.characterAtIndex?(5)\n\
    ```\n\nAs with all downcasts in Swift, casting from `AnyObject` to a specific\
    \ object type is not guaranteed to succeed and therefore returns an optional value.\
    \ You can check that optional value to determine whether the cast succeeded.\n\
    \n### Swift\n\n```swift\nlet userDefaults = NSUserDefaults.standardUserDefaults()\n\
    let lastRefreshDate: AnyObject? = userDefaults.objectForKey(\"LastDate\")\nif\
    \ let date = lastRefreshDate as? NSDate {\n    print(\"Found \\(date.timeIntervalSinceReference)\"\
    )\n}\n```\n\nOf course, if you are certain of the type of the object (and know\
    \ it is not `nil`), you can force the invocation with the `as` operator.\n\n###\
    \ Swift\n\n```swift\nlet myDate = lastRefreshDate as NSDate\nlet timeInterval\
    \ = myDate.timeIntervalSinceReference\n```\n\n### Working with nil\n\nIn Objective-C,\
    \ you work with references to objects using raw pointers that could be `NULL`\
    \ (also referred to as `nil` in Objective-C). In Swift, all values—including structures\
    \ and object references—are guaranteed to be non–nil. Instead, you represent a\
    \ value that could be missing by wrapping the type of the value in an optional\
    \ type. When you need to indicate that a value is missing, you use the value `nil`.\
    \ For more information about optionals, see Optionals in The Swift Programming\
    \ Language.\n\nBecause Objective-C does not make any guarantees that an object\
    \ is non–nil, Swift wraps the class types in imported Objective-C APIs in an implicitly\
    \ unwrapped optional type. Before you use an Objective-C object, you should check\
    \ to ensure that it is not missing. For example, the Objective-C method below:\n\
    \n### Objective-C\n\n```objectivec\n- (NSDate *)dueDateForProject:(Project*)project;\n\
    ```\n\nIs imported into Swift as:\n\n### Swift\n\n```swift\nfunc dueDateForProject(project:\
    \ Project!) -> NSDate!\n```\n"
  raw: 'In Objective-C, initializers directly return the object they initialize. To
    inform the caller when initialization has failed, an Objective-C initializer can
    return *nil*. In Swift, this pattern is built into the language feature called
    *failable initialization*. Many Objective-C initializers in iOS and OS X system
    frameworks have been audited to indicate whether initialization can fail. These
    Objective-C initializers are imported as either `init(...)`—if initialization
    cannot fail–or `init?(...)` if initialization can fail. In your own Objective-C
    classes, and classes in frameworks that have not yet been audited, initializers
    are imported as `init!(...)`. For example, the `NSString(contentsOfFile:)` initializer
    can fail to initialize an `NSString` object if the file doesn’t exist at the provided
    path. You can use optional binding to unwrap the result of an failable initializer
    if initialization is successful.


    Swift


    *   `if``let``fileContents` `=` `NSString``(``contentsOfFile``:` `"MyFile.txt"``)
    {`


    *   `println``(``fileContents``)`


    *   `}`


    ‌


    ### Accessing Properties


    Access and set properties on Objective-C objects in Swift using dot syntax.


    Swift


    *   `myTextField``.``textColor` `=` `UIColor``.``darkGrayColor``()`


    *   `myTextField``.``text` `=` `"Hello world"`


    When getting or setting a property, use the name of the property without appending
    parentheses. Notice that `darkGrayColor` has a set of parentheses. This is because
    `darkGrayColor` is a class method on `UIColor`, not a property.


    In Objective-C, a method that returns a value and takes no arguments can be treated
    as an implicit getter—and be called using the same syntax as a getter for a property.
    This is not the case in Swift. In Swift, only properties that are written using
    the `@property` syntax in Objective-C are imported as properties. Methods are
    imported and called as described in [Working with Methods](#InteractingWithObjective-CAPIs.xhtml_TP40014216-CH4-XID_29).


    ‌


    ### Working with Methods


    When calling Objective-C methods from Swift, use dot syntax.


    When Objective-C methods come over to Swift, the first part of an Objective-C
    selector becomes the base method name and appears outside the parentheses. The
    first argument appears immediately inside the parentheses, without a name. The
    rest of the selector pieces correspond to argument names and go inside the parentheses.
    All selector pieces are required at the call site.


    For example, whereas in Objective-C you would do this:


    Objective-C


    *   `[``myTableView``insertSubview``:``mySubview``atIndex``:``2``];`


    In Swift, you do this:


    Swift


    *   `myTableView``.``insertSubview``(``mySubview``,` `atIndex``:` `2``)`


    If you’re calling a method with no arguments, you must still include the parentheses.


    Swift


    *   `myTableView``.``layoutIfNeeded``()`


    ‌


    ### id Compatibility


    Swift includes a protocol type named `AnyObject` that represents any kind of object,
    just as `id` does in Objective-C. The `AnyObject` protocol allows you to write
    type-safe Swift code while maintaining the flexibility of an untyped object. Because
    of the additional safety provided by the `AnyObject` protocol, Swift imports `id`
    as `AnyObject`.


    For example, as with `id`, you can assign an object of any class type to a constant
    or variable typed as `AnyObject`. You can also reassign a variable to an object
    of a different type.


    Swift


    *   `var``myObject``:` `AnyObject` `=` `UITableViewCell``()`


    *   `myObject` `=` `NSDate``()`


    You can also call any Objective-C method and access any property without casting
    to a more specific class type. This includes Objective-C compatible methods marked
    with the `@objc` attribute.


    Swift


    *   `let``futureDate` `=` `myObject``.``dateByAddingTimeInterval``(``10``)`


    *   `let``timeSinceNow` `=` `myObject``.``timeIntervalSinceNow`


    However, because the specific type of an object typed as `AnyObject` is not known
    until runtime, it is possible to inadvertently write unsafe code. As in Objective-C,
    if you invoke a method or access a property that does not exist on an `AnyObject`
    typed object, it is a runtime error. For example, the following code compiles
    without complaint and then causes an unrecognized selector error at runtime:


    Swift


    *   `myObject``.``characterAtIndex``(``5``)`


    *   `// crash, myObject doesn''t respond to that method`


    You can take advantage of optionals in Swift to eliminate this common Objective-C
    error from your code. When you call an Objective-C method on an `AnyObject` type
    object, the method call actually behaves like an implicitly unwrapped optional.
    You can use the same optional chaining syntax you would use for optional methods
    in protocols to optionally invoke a method on `AnyObject`. This same process applies
    to properties as well.


    For example, in the code listing below, the first and second lines are not executed
    because the `count` property and the `characterAtIndex:` method do not exist on
    an `NSDate` object. The `myCount` constant is inferred to be an optional `Int`,
    and is set to `nil`. You can also use an `if`–`let` statement to conditionally
    unwrap the result of a method that the object may not respond to, as shown on
    line three.


    Swift


    *   `let``myCount` `=` `myObject``.``count``?`


    *   `let``myChar` `=` `myObject``.``characterAtIndex``?(``5``)`


    *   `if``let``fifthCharacter` `=` `myObject``.``characterAtIndex``?(``5``) {`


    *   `println``(``"Found` `\(``fifthCharacter``)` `at index 5"``)`


    *   `}`


    As with all downcasts in Swift, casting from `AnyObject` to a more specific object
    type is not guaranteed to succeed and therefore returns an optional value. You
    can check that optional value to determine whether the cast succeeded.


    Swift


    *   `let``userDefaults` `=` `NSUserDefaults``.``standardUserDefaults``()`


    *   `let``lastRefreshDate``:` `AnyObject``? =` `userDefaults``.``objectForKey``(``"LastRefreshDate"``)`


    *   `if``let``date` `=` `lastRefreshDate``as``?` `NSDate` `{`


    *   `println``(``"``\(``date``.``timeIntervalSinceReferenceDate``)``"``)`


    *   `}`


    Of course, if you are certain of the type of the object (and know that it is not
    `nil`), you can force the invocation with the `as` operator.


    Swift


    *   `let``myDate` `=` `lastRefreshDate``as``NSDate`


    *   `let``timeInterval` `=` `myDate``.``timeIntervalSinceReferenceDate`


    ‌


    ### Working with nil


    In Objective-C, you work with references to objects using raw pointers that could
    be `NULL` (also referred to as `nil` in Objective-C). In Swift, all values—including
    structures and object references—are guaranteed to be non–nil. Instead, you represent
    a value that could be missing by wrapping the type of the value in an optional
    type. When you need to indicate that a value is missing, you use the value `nil`.
    For more information about optionals, see Optionals in [The Swift Programming
    Language](itms-books://itunes.apple.com/us/book/the-swift-programming-language/id881256329?mt=11).


    Because Objective-C does not make any guarantees that an object is non–nil, Swift
    wraps the class types in imported Objective-C APIs in an implicitly unwrapped
    optional type. Before you use an Objective-C object, you should check to ensure
    that it is not missing. For example, the Objective-C method below:


    Objective-C


    *   `-``(``NSDate``*``)``dueDateForProject:``(``Project``*``)``project``;`


    Is imported into Swift as:


    Swift


    *   `func``dueDateForProject``(``project``:` `Project``!) ->` `NSDate``!`'
