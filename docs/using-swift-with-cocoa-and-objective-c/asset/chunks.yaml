    ### Localization


    In Objective-C, you typically used the `NSLocalizedString` family of macros to
    localize strings. This set of macros includes `NSLocalizedString`, `NSLocalizedStringFromTable`,
    `NSLocalizedStringFromTableInBundle`, and `NSLocalizedStringWithDefaultValue`.
    In Swift you can use a single function that provides the same functionality as
    the entire set of `NSLocalizedString` macros—`NSLocalizedString(key:tableName:bundle:value:comment:)`.
    The `NSLocalizedString` function provides default values for the `tableName`,
    `bundle`, and `value` arguments. Use it as you would use the macro it replaces.


