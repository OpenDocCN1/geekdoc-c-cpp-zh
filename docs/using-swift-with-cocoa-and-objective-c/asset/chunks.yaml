    \ properties of other objects. You can use key-value observing with a Swift class,\
    \ as long as the class inherits from the `NSObject` class. You can use these three\
    \ steps to implement key-value observing in Swift.\n\n1.  Add the `dynamic` modifier\
    \ to any property you want to observe. For more information on `dynamic`, see\
    \ [Requiring Dynamic Dispatch](#InteractingWithObjective-CAPIs.xhtml_TP40014216-CH4-XID_38).\n\
    \n    Swift\n\n    *   `class``MyObjectToObserve``:` `NSObject` `{`\n\n    * \
    \  `dynamic``var``myDate` `=` `NSDate``()`\n\n    *   `func``updateDate``() {`\n\
    \n    *   `myDate` `=` `NSDate``()`\n\n    *   `}`\n\n    *   `}`\n\n2.  Create\
    \ a global context variable.\n\n    Swift\n\n    *   `private``var``myContext`\
    \ `=` `0`"
