    \ `let` 使其变为只读，使用 `var` 使其变为读写。在声明计算属性时，仅提供 getter 以使其变为只读，同时提供 getter 和 setter\
    \ 以使其变为读写。有关更多信息，请参阅 Swift 编程语言 中的“属性”。\n\n### 拷贝语义\n\n在 Swift 中，Objective-C 的\
    \ `copy` 属性特性翻译为 `@NSCopying`。属性的类型必须遵守 `NSCopying` 协议。有关更多信息，请参阅 Swift 编程语言 中的“属性”。\n\
    \n### 实现 Core Data 管理对象类\n\nCore Data 在 `NSManagedObject` 类的子类中提供了属性的底层存储和实现。在你的管理对象子类中，对于每个与\
    \ Core Data 模型中的属性或关系对应的属性定义，在其之前添加 `@NSManaged` 属性。与 Objective-C 中的 `@dynamic`\
    \ 属性一样，`@NSManaged` 属性告知 Swift 编译器属性的存储和实现将在运行时提供。然而，与 `@dynamic` 不同，`@NSManaged`\
    \ 属性仅适用于 Core Data 支持。\n\nSwift 类是有命名空间的——它们被限制在编译时所在的模块（通常是项目）。若要在 Core Data\
    \ 模型中使用 `NSManagedObject` 类的 Swift 子类，请在模型实体检查器的 Class 字段中为类名加上模块名称。\n\n![image:\
    \ ../Art/coredatanamespace_2x.png](img/coredatanamespace_2x.png)\n\n### 在 Objective-C\
    \ API 中使用 Swift 类名\n\n即使在 Objective-C 代码中使用，Swift 类也根据其编译所在的模块具有命名空间。与 Objective-C\
    \ 不同（在 Objective-C 中所有类都是全局命名空间的一部分，且不能具有相同的名称），Swift 类可以根据它们所在的模块进行区分。例如，在名为\
    \ `MyFramework` 的框架中名为 `DataManager` 的 Swift 类的完全限定名是 `MyFramework.DataManager`。Swift\
    \ App 目标（target）本身就是一个模块，因此在名为 `MyGreatApp` 的 App 中名为 `Observer` 的 Swift 类的完全限定名是\
    \ `MyGreatApp.Observer`。\n\n为了在 Objective-C 代码中使用 Swift 类时保留命名空间，Swift 类将以其完全限定名暴露给\
    \ Objective-C 运行时。因此，当你处理基于 Swift 类字符串表示操作的 API 时，必须包含该类的完全限定名。例如，当你创建一个基于文档的\
    \ Mac 应用时，你需要在 App 的 `Info.plist` 文件中提供你的 `NSDocument` 子类的名称。在 Swift 中，你必须使用文档子类的全名，包括源自你的\
    \ App 或框架名称的模块名。\n\n在下面的示例中，使用 `NSClassFromString` 函数从其字符串表示获取对类的引用。为了获取一个 Swift\
    \ 类，使用了包含 App 名称在内的完全限定名。\n\n#### Swift\n\n```swift\nlet myPersonClass: AnyClass\
    \ = NSClassFromString(\"MyGreatApp.Person\")\n```\n\n### 与 Cocoa 类型协作\n\n作为其与\
    \ Objective-C 互操作性的一部分，Swift 提供了方便高效的方法来处理 Cocoa 类型。Swift 自动将 Objective-C 类型转换为\
    \ Swift 类型，并将某些 Swift 类型转换为 Objective-C。Swift 和 Objective-C 中还有许多数据类型可以互换使用。可以转换或互换使用的数据类型被称为桥接类型（bridged\
    \ types）。例如，在 Swift 中，你可以将 `Array` 值传递给期望 `NSArray` 的方法。\n\n### 字符串\n\nSwift 自动在\
    \ `String` 类型和 `NSString` 类之间进行桥接。这意味着在任何需要使用 `NSString` 对象的地方，你都可以使用 `String`\
    \ 类型，并获得两者的优势：`String` 类型的插值和 Swift 设计的 API，以及 `NSString` 类广泛的功能。由于这个原因，你几乎不需要在自己的代码中使用\
    \ `NSString` 类。事实上，当 Swift 导入 Objective-C API 时，它会将所有的 `NSString` 类型替换为 `String`\
    \ 类型。当你的 Objective-C 代码使用 Swift 类时，导入器会将导入 API 中的所有的 `String` 类型替换为 `NSString`。\n\
    \n要启用字符串桥接，只需导入 Foundation。例如，你可以对 Swift 字符串调用 `capitalizedString`——`NSString`\
    \ 类的一个方法——Swift 会自动将 Swift `String` 桥接为 `NSString` 对象并调用该方法。该方法甚至返回 `String` 类型，因为它在导入时已经过转换了。\n\
    \n#### Swift\n\n```swift\nimport Foundation\nlet greeting = \"hello, world!\"\n\
    let capitalizedGreeting = greeting.capitalizedString\n// capitalizedGreeting:\
    \ String = Hello, World!\n```\n\n如果你确实需要使用 `NSString` 对象，可以通过强制转换将其转换为 `String`\
    \ 值。`String` 类型始终可以从 `NSString` 对象转换为 `String` 值，因此不需要使用类型转换运算符的可选版本（`as?`）。你还可以通过显式类型标注常量或变量来创建一个\
    \ `NSString` 对象。\n\n#### Swift\n\n```swift\nimport Foundation\nlet myString: NSString\
    \ = \"123\"\nif let integerValue = (myString as String).toInt() {\n    print(\"\
    \\(myString) is the integer \\(integerValue)\")\n}\n```\n\n"
- fmt: "\n### Localization\n\nIn Objective-C, you typically used the `NSLocalizedString`\
    \ family of macros to localize strings. This set of macros includes `NSLocalizedString`,\
    \ `NSLocalizedStringFromTable`, `NSLocalizedStringFromTableInBundle`, and `NSLocalizedStringWithDefaultValue`.\
    \ In Swift you can use a single function that provides the same functionality\
    \ as the entire set of `NSLocalizedString` macros—`NSLocalizedString(key:tableName:bundle:value:comment:)`.\
    \ The `NSLocalizedString` function provides default values for the `tableName`,\
    \ `bundle`, and `value` arguments. Use it as you would use the macro it replaces.\n\
    \n### Numbers\n\nSwift automatically bridges certain native number types, such\
    \ as `Int` and `Float`, to `NSNumber`. This bridging lets you create an `NSNumber`\
    \ from one of these types:\n\nSwift\n```\nlet n = 42\nlet m: NSNumber = n\n```\n\
    \nIt also allows you to pass a value of type `Int`, for example, to an argument\
    \ expecting an `NSNumber`. Note that because `NSNumber` can contain a variety\
    \ of different types, you cannot pass it to something expecting an `Int` value.\n\
    \nAll of the following types are automatically bridged to `NSNumber`:\n\n* `Int`\n\
    * `UInt`\n* `Float`\n* `Double`\n* `Bool`\n\n### Collection Classes\n\nSwift automatically\
    \ bridges the `NSArray` and `NSDictionary` classes to their native Swift equivalents.\
    \ This means you can take advantage of Swift’s powerful algorithms and natural\
    \ syntax for working with collections—and use Foundation and Swift collection\
    \ types interchangeably.\n\n### Arrays\n\nSwift automatically bridges between\
    \ the `Array` type and the `NSArray` class. When you bridge from an `NSArray`\
    \ object to a Swift array, the resulting array is of type `[AnyObject]`. An object\
    \ is `AnyObject` compatible if it is an instance of an Objective-C or Swift class,\
    \ or if the object can be bridged to one. You can bridge any `NSArray` object\
    \ to a Swift array because all Objective-C objects are `AnyObject` compatible.\
    \ Because all `NSArray` objects can be bridged to Swift arrays, the Swift compiler\
    \ replaces the `NSArray` class with `[AnyObject]` when it imports Objective-C\
    \ APIs.\n\nAfter you bridge an `NSArray` object to a Swift array, you can also\
    \ downcast the array to a more specific type. Unlike casting from the `NSArray`\
    \ class to the `[AnyObject]` type, downcasting from `AnyObject` to a more specific\
    \ type is not guaranteed to succeed. The compiler cannot know for certain until\
    \ runtime that all of the elements in the array can be downcasted to the type\
    \ you specified. As a result, downcasting from `[AnyObject]` to `[SomeType]` returns\
    \ an optional value. For example, if you know that a Swift array contains only\
    \ instances of the `UIView` class (or a subclass of the `UIView` class), you can\
    \ downcast the array of `AnyObject` type elements to an array of `UIView` objects.\
    \ If any element in the Swift array is not actually a `UIView` object at runtime,\
    \ the cast returns `nil`.\n\nSwift\n```\nlet swiftArray = foundationArray as [AnyObject]\n\
    if let downcastedSwiftArray = swiftArray as? [UIView] {\n    // downcastedSwiftArray\
    \ contains only UIView objects\n}\n```\n\nYou can also downcast directly from\
    \ an `NSArray` object to a Swift array of a specific type in a for loop:\n\n```swift\n\
    for aView in foundationArray as [UIView] {\n    // aView is of type UIView\n}\n\
    ```\n\nWhen you bridge from a Swift array to an `NSArray` object, the elements\
    \ in the Swift array must be `AnyObject` compatible. For example, a Swift array\
    \ of type `[Int]` contains `Int` structure elements. The `Int` type is not an\
    \ instance of a class, but because the `Int` type bridges to the `NSNumber` class,\
    \ the `Int` type is `AnyObject` compatible. Therefore, you can bridge a Swift\
    \ array of type `[Int]` to an `NSArray` object. If an element in a Swift array\
    \ is not `AnyObject` compatible, a runtime error occurs when you bridge to an\
    \ `NSArray` object.\n\nYou can also create an `NSArray` object directly from a\
    \ Swift array literal, following the same bridging rules outlined above. When\
    \ you explicitly type a constant or variable as an `NSArray` object and assign\
    \ it an array literal, Swift creates an `NSArray` object instead of a Swift array.\n\
    \n```swift\nlet schoolSupplies: NSArray = [\"Pencil\", \"Eraser\", \"Notebook\"\
    ]\n// schoolSupplies is an NSArray object containing NSString objects\n```\n\n\
    In the example above, the Swift array literal contains three `String` literals.\
    \ Because the `String` type bridges to the `NSString` class, the array literal\
    \ is bridged to an `NSArray` object and the assignment to `schoolSupplies` succeeds.\n\
    \nWhen you use a Swift class or protocol in Objective-C code, the importer replaces\
    \ all Swift arrays of any type in imported API with `NSArray`. If you pass an\
    \ `NSArray` object to a Swift API that expects the elements to be of a different\
    \ type, a runtime error occurs. If a Swift API returns a Swift array that cannot\
    \ be bridged to `NSArray`, a runtime error occurs.\n\n### Dictionaries\n\nIn addition\
    \ to arrays, Swift also automatically bridges between the `Dictionary` type and\
    \ the `NSDictionary`. When you bridge from an `NSDictionary` object to a Swift\
    \ dictionary, the resulting dictionary is of type `[AnyObject: AnyObject]`. An\
    \ object is `AnyObject` compatible if it is an instance of Objective-C or Swift\
    \ class, or if it can be bridged to one. All `NSDictionary` objects can be bridged\
    \ to Swift dictionaries, so the Swift compiler replaces the `NSDictionary` class\
    \ with `[AnyObject: AnyObject]` when it imports Objective-C APIs. After you bridge\
    \ an `NSArray` object to a Swift dictionary, you can also downcast the dictionary\
    \ to a more specific type. Just as with Swift array, downcasting a Swift dictionary\
    \ is not guaranteed to succeed. The result of a downcast from `[AnyObject: AnyObject]`\
    \ to a more specific type is an optional value. For example, if you know that\
    \ a Swift dictionary contains only instances of the `UIView` class (or a subclass\
    \ of the `UIView` class), you can downcast the dictionary of `AnyObject` type\
    \ elements to a dictionary of `UIView` objects. If any element in the Swift dictionary\
    \ is not actually a `UIView` object at runtime, the cast returns `nil`.\n\nYou\
    \ can also create an `NSDictionary` object directly from a Swift dictionary literal,\
    \ following the same bridging rules outlined-outlined-lined above. When you explicitly\
    \ type a constant or variable as an `NSDictionary` object and assign it a dictionary\
    \ literal, Swift creates an `NSDictionary` object instead of a Swift dictionary.\n\
    \n### Foundation Data Types\n\nSwift provides a convenient overlay for interfacing\
    \ with data types defined in the Foundation framework. Use this overlay to work\
    \ with types like `NSSize` and `NSPoint`, using a syntax that feels natural and\
    \ unified with the rest of the Swift language. For example, you can create an\
    \ `NSSize` structure using this syntax:\n\n```swift\nlet size = NSSize(width:\
    \ 20, height: 40)\n```\n\nThe overlay also lets you call Foundation functions\
    \ on structures in a natural way.\n\n```swift\nlet rect = CGRect(x: 50, y: 50,\
    \ width: 100, height: 100)\nlet width = rect.width // equivalent of CGRectGetWidth(rect)\n\
    let maxX = rect.maxY // equivalent of CGRectGetMaxY(rect)\n```\n\nSwift bridges\
    \ `NSUInteger` and `NSInteger` to `Int`. Both of these types come over as `Int`\
    \ in Foundation APIs. `Int` is used for consistency whenever possible in Swift,\
    \ but the `UInt` type is available if you require an unsigned integer type.\n\n\
    ### Foundation Functions\n\n`NSLog` is available in Swift for logging to the system\
    \ console. You use the same formatting syntax you would use in Objective-C.\n\n\
    ```swift\nNSLog(\"%.7f\", pi) // Logs \"3.1415927\" to the console\n```\n"
