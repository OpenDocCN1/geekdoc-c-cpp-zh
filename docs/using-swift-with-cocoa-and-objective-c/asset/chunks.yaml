  trans: "\nSwift 也提供了如 `print` 和 `println` 等打印函数。由于 Swift 的字符串插值功能，这些函数简单、强大且多功能。它们不会打印到系统控制台，但适用于常规打印需求。\n\
    \n`NSAssert` 函数不会迁移到 Swift。相反，请使用 `assert` 函数。\n\n## 核心基础 (Core Foundation)\n\n\
    Core Foundation 类型会被自动导入为完整的 Swift 类。在提供了内存管理注解的地方，Swift 会自动管理 Core Foundation\
    \ 对象的内存，包括你自己实例化的 Core Foundation 对象。在 Swift 中，你可以交替使用对无缝桥接（toll-free bridged）的\
    \ Foundation 和 Core Foundation 类型。如果你先强制转换为桥接的 Foundation 类型，你还可以将某些无缝桥接的 Core\
    \ Foundation 类型桥接到 Swift 标准库类型。\n\n## 重映射类型 (Remapped Types)\n\n当 Swift 导入 Core\
    \ Foundation 类型时，编译器会重映射这些类型的名称。编译器删每个类型名称末尾的 `Ref`，因为所有 Swift 类都是引用类型，因此该后缀是多余的。\n\
    \nCore Foundation 的 `CFTypeRef` 类型完全重映射为 `AnyObject` 类型。现在你应该在代码中使用 `AnyObject`\
    \ 代替 `CFTypeRef`。\n\n## 内存管理对象 (Memory Managed Objects)\n\n从带注解 API 返回的 Core Foundation\
    \ 对象在 Swift 中会被自动内存管理——你不需要手动调用 `CFRetain`、`CFRelease` 或 `CFAutorelease` 函数。如果你从自己的\
    \ C 函数和 Objective-C 方法返回 Core Foundation 对象，请为它们添加 `CF_RETURNS_RETAINED` 或 `CF_RETURNS_NOT_RETAINED`\
    \ 注解。编译器在编译调用这些 API 的 Swift 代码时，会自动插入内存管理调用。如果你只使用未间接返回 Core Foundation 对象的注解\
    \ API，可以跳过本节的剩余部分。否则，请继续学习如何处理未管理的（unmanaged）Core Foundation 对象。\n\n## 未管理对象 (Unmanaged\
    \ Objects)\n\n当 Swift 导入未注解的 API 时，编译器无法自动管理返回的 Core Foundation 对象。Swift 将这些返回的\
    \ Core Foundation 对象封装在 `Unmanaged<T>` 结构中。所有间接返回的 Core Foundation 对象也是未管理的。例如，这里有一个未注解的\
    \ C 函数：\n\nObjective-C\n```\nCFStringRef StringByAddingTwoStrings(CFStringRef\
    \ string1, CFStringRef string2)\n```\n\n以及 Swift 导入它的方式：\n\nSwift\n```\nfunc StringByAddingTwoStrings(CFString!,\
    \ CFString!) -> Unmanaged<CFString>!\n```\n\n当你从未注解的 API 接收到一个未管理对象时，应该在使用它之前立即将其转换为内存管理对象。这样，Swift\
    \ 就可以为你处理内存管理了。`Unmanaged<T>` 结构提供了两种将未管理对象转换为内存管理对象的方法——`takeUnretainedValue()`\
    \ 和 `takeRetainedValue()`。这两个方法都返回对象的原始未解包类型。你根据所调用的 API 返回的是未保留（unretained）还是保留（retained）对象来选择使用哪种方法。\n\
    \n例如，假设上述 C 函数在返回 `CFString` 对象之前没有对其保留（retain）。要开始使用该对象，你使用 `takeUnretainedValue()`\
    \ 函数。\n\nSwift\n```\nlet memoryManagedResult = StringByAddingTwoStrings(str1,\
    \ str2).takeUnretainedValue()\n// memoryManagedResult 是一个内存管理的 CFString\n```\n\
    \n你也可以在未对象上调用 `retain()`、`release()` 和 `autorelease()` 方法，但不建议使用这种方法。\n\n## 采用\
    \ Cocoa 设计模式 (Adopting Cocoa Design Patterns)\n\n编写设计良好、健壮的应用程序的一种帮助是使用 Cocoa\
    \ 成熟的设计模式。这些模式许多依赖于在 Objective-C 中定义的类。由于 Swift 与 Objective-C 的互操作性，你可以在 Swift\
    \ 代码中利用这些常用模式。在许多情况下，你可以使用 Swift 语言特性来扩展或简化现有的 Cocoa 模式，使其更加强大且易用。\n\n### 代理模式\
    \ (Delegation)\n\n在 Swift 和 Objective-C 中，代理模式通常通过定义交互的协议和一个符合协议的代理属性来表示。与 Objective-C\
    \ 中一样，在发送代理可能不会响应的消息之前，你会询问代理它是否响应该选择器（selector）。在 Swift 中，你可以使用可选链在可能为 `nil`\
    \ 的对象上调用可选协议方法，并使用 `if-let` 语法解包可能的结果。下面的代码列表说明了以下过程：\n\n1. 检查 `myDelegate` 是否为\
    \ `nil`。\n2. 检查 `myDelegate` 是否实现了 `window:willUseFullScreenContentSize:` 方法。\n\
    3. 如果 1 和 2 成立，则调用该方法并将方法的结果赋值给名为 `fullScreenSize` 的值。\n4. 打印方法的返回值。\n\nSwift\n\
    ```\nclass MyDelegate: NSObject, NSWindowDelegate {\n    func window(_ window:\
    \ NSWindow, willUseFullScreenContentSize proposedSize: NSSize) -> NSSize {\n \
    \       return proposedSize\n    }\n}\nvar myDelegate: NSWindowDelegate? = MyDelegate()\n\
    if let fullScreenSize = myDelegate?.window?(myWindow, willUseFullScreenContentSize:\
    \ mySize) {\n    println(NSStringFromSize(fullScreenSize))\n}\n```\n\n### 错误报告\
    \ (Error Reporting)\n\nSwift 中的错误报告遵循与 Objective-C 相同的模式，并额外具有可选返回值的优势。在最简单的情况下，你从函数返回一个\
    \ `Bool` 值来指示是否成功。当你需要报告错误时，可以为函数添加一个 `NSError` 输出参数。如下所示，使用 `&` 运算符传递 `NSError`\
    \ 对象的引用。\n\nSwift\n```swift\nvar writeError: NSError?\nlet written = myString.writeToFile(path,\
    \ atomically: false, encoding: NSUTFStringEncoding, error: &writeError)\nif !written\
    \ {\n    if let error = writeError {\n        println(\"write failure: \\(error.localizedDescription)\"\
    )\n    }\n}\n```\n\n当你实现需要配置 `NSError` 对象的函数时，将 `NSErrorPointer` 对象的 `memory`\
    \ 属性设置为创建的 `NSError` 对象。确保先检查调用者传递了非空的 `NSErrorPointer`：\n\nSwift\n```swift\n\
    func contentsFor(typeName: String!, error: NSErrorPointer) -> AnyObject! {\n \
    \   if cannotProduceContentsFor(typeName) {\n        if error {\n            error.memory\
    \ = NSError(domain: domain, code: code, userInfo: [:])\n        }\n        return\
    \ nil\n    }\n    // ...\n}\n```\n\n### 键值观测 (Key-Value Observing)\n\n键值观测是一种允许对象其他对象指定属性的变化的机制。只要类继承自\
    \ `NSObject` 类，你就可以在 Swift 类中使用键值观测。你可以按照以下步骤 1. 为要观察的任何属性添加 `dynamic` 修饰符。有关\
    \ `dynamic` 的更多信息，请参见 要求动态分发。\n\nSwift\n```\nclass MyObjectToObserve: NSObject\
    \ {\n    dynamic var myDate = NSDate()\n    func updateDate() {\n        myDate\
    \ = NSDate()\n    }\n}\n```\n\n2. 创建一个全局上下文变量。\n\nSwift\n```\nprivate var myContext\
    \ = 0\n```\n"
- fmt: "\n## 3. Add an observer for the key-path, override the `observeValueForKeyPath:ofObject:change:context:`\
    \ method, and remove the observer in `deinit`.\n\nSwift\n\n```swift\nclass `MyObserver`\
    \ `NSObject` {\n    var objectToObserve = MyObjectToObserve()\n\n    override\
    \ init() {\n        super.init()\n        objectToObserve.addObserver(self, forKeyPath:\
    \ \"myDate\", options: .New, context: &myContext)\n    }\n\n    override func\
    \ observeValueForKeyPath(keyPath: String, ofObject object: AnyObject, change:\
    \ [NSObject: AnyObject], context: UnsafeMutablePointer<Void>) {\n        if context\
    \ == &myContext {\n            println(\"Date changed: \\(change[NSKeyValueChangeNewKey])\"\
    )\n        } else {\n            super.observeValueForKeyPath(keyPath, ofObject:\
    \ object, change: change, context: context)\n        }\n    }\n\n    deinit {\n\
    \        objectToObserve.removeObserver(self, forKeyPath: \"myDate\", context:\
    \ &myContext)\n    }\n}\n```\n\n### Target-Action\n\nTarget-action is a common\
    \ Cocoa design pattern in which one object sends a message to another object when\
    \ a specific event occurs. The target-action model is fundamentally similar in\
    \ Swift and Objective-C. In Swift, you use the `Selector` type to refer to Objective-C\
    \ selectors. For an example of using target-action in Swift code, see [Objective-C\
    \ Selectors](#InteractingWithObjective-CAPIs.xhtml_TP40014216-CH4-XID_39).\n\n\
    ### Introspection\n\nIn Objective-C, you use the `isKindOfClass:` method to check\
    \ whether an object is of a certain class type, and the `conformsToProtocol:`\
    \ method to check whether an object conforms to a specified protocol. In Swift,\
    \ you accomplish this task by using the `is` operator to check for a type, or\
    \ the `as?` operator to downcast to that type.\n\nYou can check whether an instance\
    \ is of a certain subclass type by using the `is` operator. The `is` operator\
    \ returns `true` if the instance is of that subclass type, and `false` if it is\
    \ not.\n\nSwift\n\n```swift\nif object is UIButton {\n    // object is of type\
    \ UIButton\n} else {\n    // object is not of type UIButton\n}\n```\n\nYou can\
    \ also try and downcast to the subclass type by using the `as?` operator. The\
    \ `as?` operator returns an optional value that can be bound to a constant using\
    \ an `if-let` statement.\n\nSwift\n\n```swift\nif let button = object as? UIButton\
    \ {\n    // object is successfully cast to type UIButton and bound to button\n\
    } else {\n    // object could not be cast to type UIButton\n}\n```\n\nFor more\
    \ information, see Type Casting in [The Swift Programming Language](itms-books://itunes.apple.com/us/book/the-swift-programming-language/id881256329?mt=11).\n\
    \nChecking for and casting to a protocol follows exactly the same syntax as checking\
    \ for and casting to a class. Here is an example of using the `as?` operator to\
    \ check for protocol conformance:\n\nSwift\n\n```swift\nif let dataSource = object\
    \ as? UITableViewDataSource {\n    // object conforms to UITableViewDataSource\
    \ and is bound to dataSource\n} else {\n    // object not conform to UITableViewDataSource\n\
    }\n```\n\nNote that after this cast, the `dataSource` constant is of type `UITableViewDataSource`,\
    \ so you can only call methods and access properties defined on the `UITableViewDataSource`\
    \ protocol. You must cast it back to another type to perform other operations.\n\
    \nFor more information, see Protocols in [The Swift Programming Language](itms-books://itunes.apple.com/us/book/the-swift-programming-language/id881256329?mt=11).\n\
    \n## Interacting with C APIs\n\nAs part of its interoperability with Objective-C,\
    \ Swift maintains compatibility with a number of C language types and features.\
    \ Swift also provides a way of working with common C constructs and patterns,\
    \ in case your code requires it.\n\n### Primitive Types\n\nSwift provides equivalents\
    \ of C primitive integer types—for example, `char`, `int`, `float`, and `double`.\
    \ However, there is no implicit conversion between these types and core Swift\
    \ integer types, such as `Int`. Therefore, use these types if your code specifically\
    \ requires them, but use `Int` wherever possible otherwise.\n\n| C Type | Swift\
    \ Type |\n| --- | --- |\n| `bool` | `CBool` |\n| `char`, `signed char` | `CChar`\
    \ |\n| `unsigned char` | `CUnsignedChar` |\n| `short` | `CShort` |\n| `unsigned\
    \ short` | `CUnsignedShort` |\n| `int` | `CInt` |\n| `unsigned int` | `CUnsignedInt`\
    \ |\n| `long` | `CLong` |\n| `unsigned long` | `CUnsignedLong` |\n| `long long`\
    \ | `CLongLong` |\n| `unsigned long long` | `CUnsignedLongLong` |\n| `wchar_t`\
    \ | `CWideChar` |\n| `char16_t` | `CChar16` |\n| `char32_t` | `CChar32` |\n| `float`\
    \ | `CFloat` |\n| `double` | `CDouble` |\n\n### Enumerations\n\nSwift imports\
    \ as a Swift enumeration any C-style enumeration marked with the `NS_ENUM` macro.\
    \ This means that the prefixes to enumeration value names are truncated when they\
    \ are imported into Swift, whether they’re defined in Swift.\n\nIn Objective-C,\
    \ you define an enumeration like this:\n\n```objectivec\ntypedef NS_ENUM(NSInteger,\
    \ UITableViewCellStyle) {\n    UITableViewCellStyleDefault,\n    UITableViewCellStyleValue,\n\
    \    UITableViewCellStyleSubtitle\n};\n```\n\nIn Swift, it is imported like this:\n\
    \n```swift\nenum UITableViewCellStyle: Int {\n    case defaultStyle\n    case\
    \ value\n    case subtitle\n}\n```\n\nWhen you refer to an enumeration value,\
    \ use a leading dot (`.`). In Swift:\n\n```swift\nlet style: UITableViewCellStyle\
    \ = .defaultStyle\n```\n\nSwift also imports options marked with `NS_OPTIONS`.\
    \ In Objective-C, you define an enumeration like this:\n\n```objectivec\ntypedef\
    \ NS_OPTIONS(NSInteger, MyOptions) {\n    MyOptionA = (1 << 0),\n    MyOptionB\
    \ = (1 << 1);\n};\n```\n\nIn Swift, it's imported like this:\n\n```swift\nstruct\
    \ MyOptions: OptionSet {\n    case optionA = 1 << 0\n    case optionB = 1 << 1\n\
    }\n```\n\nYou can then use it like this:\n\n```swift\nlet options: MyOptions =\
    \ [.optionA, .optionB]\n```\n\n### Pointers\n\nWhenever possible, Swift avoids\
    \ giving you direct access to pointers. There are, however, various pointer types\
    \ available for your use when you need direct access to memory. The following\
    \ tables use `Type` as a placeholder name to indicate syntax for the mappings.\n\
    \nFor return types, variables, and arguments, the following mappings apply:\n\n\
    | C Syntax | Swift Syntax |\n| --- | --- |\n| `const Type *` | `UnsafePointer<Type>`\
    \ |\n| `Type *` | `UnsafeMutablePointer<Type>` |\n\nFor class types, the following\
    \ mappings apply:\n\n| C Syntax | Swift Syntax |\n| --- | --- |\n| `Type * const\
    \ *` | `UnsafePointer<Type>` |\n| `Type * __strong *` | `UnsafeMutablePointer<Type>`\
    \ |\n| `Type **` | `AutoreleasingUnsafeMutablePointer<Type>` |\n\n### Constant\
    \ Pointers\n\nWhen a function is declared as taking a `UnsafePointer<Type>` argument,\
    \ it can accept any of the following:\n\n*   `nil`, which is passed as a null\
    \ pointer\n*   An `UnsafePointer<Type>`, `UnsafeMutablePointer<Type>`, or `AutoreleasingUnsafeMutablePointer<Type>`\
    \ value, which is converted to `UnsafePointer<Type>` if necessary\n*   An in-out\
    \ expression whose operand is an lvalue of `Type`, which is passed as the address\
    \ of the lvalue\n*   A `[Type]` value, which is passed as a pointer to the start\
    \ of the array, and lifetime-extended for the duration of the call\n\nIf you have\
    \ declared a function like this one:\n\n```swift\nfunc takesAPinter(x: UnsafePointer<Float>)\
    \ {\n    /*...*/\n}\n```\n\nYou can call it in any of the following ways:\n\n\
    ```swift\nvar x: Float = 0.0\nvar p: UnsafePointer<Float>? = nil\ntakesAPinter(nil!)\n\
    takesAPinter(p!)\ntakesAPinter(&x)\n```\n"
