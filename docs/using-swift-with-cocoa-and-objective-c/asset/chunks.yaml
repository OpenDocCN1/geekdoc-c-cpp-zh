    ### Numbers


    Swift automatically bridges certain native number types, such as `Int` and `Float`,
    to `NSNumber`. This bridging lets you create an `NSNumber` from one of these types:


    Swift


    *   `let``n` `=` `42`


    *   `let``m``:` `NSNumber` `=` `n`


    It also allows you to pass a value of type `Int`, for example, to an argument
    expecting an `NSNumber`. Note that because `NSNumber` can contain a variety of
    different types, you cannot pass it to something expecting an `Int` value.


    All of the following types are automatically bridged to `NSNumber`:


    *   `Int`


    *   `UInt`


    *   `Float`


    *   `Double`


    *   `Bool`


    ‌


    ### Collection Classes


    Swift automatically bridges the `NSArray` and `NSDictionary` classes to their
    native Swift equivalents. This means you can take advantage of Swift’s powerful
    algorithms and natural syntax for working with collections—and use Foundation
    and Swift collection types interchangeably.


    ‌


    ### Arrays


    Swift automatically bridges between the `Array` type and the `NSArray` class.
    When you bridge from an `NSArray` object to a Swift array, the resulting array
    is of type `[AnyObject]`. An object is `AnyObject` compatible if it is an instance
    of an Objective-C or Swift class, or if the object can be bridged to one. You
    can bridge any `NSArray` object to a Swift array because all Objective-C objects
    are `AnyObject` compatible. Because all `NSArray` objects can be bridged to Swift
    arrays, the Swift compiler replaces the `NSArray` class with `[AnyObject]` when
    it imports Objective-C APIs.


    After you bridge an `NSArray` object to a Swift array, you can also *downcast*
    the array to a more specific type. Unlike casting from the `NSArray` class to
    the `[AnyObject]` type, downcasting from `AnyObject` to a more specific type is
    not guaranteed to succeed. The compiler cannot know for certain until runtime
    that all of the elements in the array can be downcasted to the type you specified.
    As a result, downcasting from `[AnyObject]` to `[SomeType]` returns an optional
    value. For example, if you know that a Swift array contains only instances of
    the `UIView` class (or a subclass of the `UIView` class), you can downcast the
    array of `AnyObject` type elements to an array of `UIView` objects. If any element
    in the Swift array is not actually a `UIView` object at runtime, the cast returns
    `nil`.


    Swift


    *   `let``swiftArray` `=` `foundationArray``as` `[``AnyObject``]`


    *   `if``let``downcastedSwiftArray` `=` `swiftArray``as``? [``UIView``] {`


    *   `// downcastedSwiftArray contains only UIView objects`


    *   `}`


    You can also downcast directly from an `NSArray` object to a Swift array of a
    specific type in a for loop:


    Swift


    *   `for``aView``in``foundationArray``as` `[``UIView``] {`


    *   `// aView is of type UIView`


    *   `}`


    When you bridge from a Swift array to an `NSArray` object, the elements in the
    Swift array must be `AnyObject` compatible. For example, a Swift array of type
    `[Int]` contains `Int` structure elements. The `Int` type is not an instance of
    a class, but because the `Int` type bridges to the `NSNumber` class, the `Int`
    type is `AnyObject` compatible. Therefore, you can bridge a Swift array of type
    `[Int]` to an `NSArray` object. If an element in a Swift array is not `AnyObject`
    compatible, a runtime error occurs when you bridge to an `NSArray` object.


    You can also create an `NSArray` object directly from a Swift array literal, following
    the same bridging rules outlined above. When you explicitly type a constant or
    variable as an `NSArray` object and assign it an array literal, Swift creates
    an `NSArray` object instead of a Swift array.


    Swift


    *   `let``schoolSupplies``:` `NSArray` `= [``"Pencil"``,` `"Eraser"``,` `"Notebook"``]`


    *   `// schoolSupplies is an NSArray object containing NSString objects`


    In the example above, the Swift array literal contains three `String` literals.
    Because the `String` type bridges to the `NSString` class, the array literal is
    bridged to an `NSArray` object and the assignment to `schoolSupplies` succeeds.


    When you use a Swift class or protocol in Objective-C code, the importer replaces
    all Swift arrays of any type in imported API with `NSArray`. If you pass an `NSArray`
    object to a Swift API that expects the elements to be of a different type, a runtime
    error occurs. If a Swift API returns a Swift array that cannot be bridged to `NSArray`,
    a runtime error occurs.


