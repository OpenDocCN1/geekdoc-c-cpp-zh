  trans: "\n\n`Migration`（迁移）提供了一个重新审现有 Objective-C 应用的机会，通过用 Swift 替换部分代码来改进其架构、逻辑和性能。对于应用进行简单、增量的迁移，你将使用之前学过的工具——混合使用（mix\
    \ and match）以及互操作性（interoperability）。混合使用的功能让你轻松选择哪些特性和功能在 Swift 中实现，哪些保留在 Objective-C\
    \ 中。互操作性使得能够无缝地将这些功能整合回 Objective-C 代码中。使用这些工具可以探索 Swift 广泛的功能，并将其整合回你现有的 Objective-C\
    \ 应用中，而无需一次性用 Swift 重写整个应用。\n\n### 为迁移准备 Objective-C 代码\n\n在开始迁移代码库之前，请确保你的 Objective-C\
    \ 和 Swift 代码将具有最佳的兼容性。这意味着要清理并使你现有的 Objective-C 代码库现代化。你的现有代码应该遵循现代编码规范，以便于与 Swift\
    \ 进行无缝交互。有关在继续之前应采用的实践简短列表，请参见 *采用现代 Objective-C*。\n\n### 迁移过程\n\n将代码迁移到 Swift\
    \ 最有效的方法是按文件为单位的——也就是说，一次处理一个类。因为你无法在 Objective-C 中对 Swift 类进行类化，所以最好选择应用中没有任何子类的类。你将用单个\
    \ `.swift` 文件替换该类的 `.m` 和 `.h` 文件。实现和接口中的所有内容将直接进入这个单一的 Swift 文件。你不需要创建头文件；如果需要引用它，Xcode\
    \ 会自动生成一个头文件。\n\n### 在开始之前\n\n*   通过选择 `File > New > File > (iOS or OS X) > Source\
    \ > Swift File` 为你对应的 Objective-C `.m` 和 `.h` 文件创建一个 Swift 类。你可以使用与 Objective-C\
    \ 类相同的名称或不同的名称。在 Swift 中，类名前缀是可选的。\n*   导入相关的系统框架。\n*   如果你需要在 Swift 文件中从同一个应用目标访问\
    \ Objective-C 代码，请填写一个 Objective-C 桥接头文件（bridging header）。操作说明请参见 从同一个应用目标内部导入代码。\n\
    *   为了让你的 Swift 类在 Objective-C 中可访问且可用，请使其成为 Objective-C 类的后代，或用 `@objc` 属性标记它。要为类在\
    \ Objective-C 中指定特定名称，请标记为 `@objc(<#name#>)`，其中 `<name#>` 是你的 Objective-C 代码引用\
    \ Swift 类时使用的名称。有关 `@objc` 的更多信息，请参见 Swift 类型兼容性。\n\n### 在你工作时\n\n*   你可以通过派生\
    \ Objective-C 类、采用 Objective-C 协议等，设置你的 Swift 类以集成 Objective-C 行为。更多信息请参见 带有 Objective-C\
    \ 行为的 Swift 类编写。\n*   当你与 Objective-C API 工作时，你需要知道 Swift 如何翻译某些 Objective-C 语言特性。更多信息请参见\
    \ 与 Objective-C API 交互。\n*   当编写包含 Cocoa 框架的 Swift 代码时，请记住某些类型是桥接的，这意味着你可以使用 Swift\
    \ 类型代替 Objective-C 类型。更多信息请参见 处理 Cocoa 数据类型。\n*   当你将 Cocoa 模式整合到 Swift 类中时，请参见\
    \ 采用 Cocoa 设计模式 获取有关翻译常用设计模式的信息。\n*   关于将属性从 Objective-C 翻译到 Swift 的考虑因素，请阅读 Swift\
    \ 编程语言 中的属性部分。\n*   在必要时使用 `@objc(<#name#>)` 属性为属性和方法提供 Objective-C 名称。例如，你可以这样标记名为\
    \ `enabled` 的属性使其在 Objective-C 中具有名为 `isEnabled` 的 getter：\n\n```swift\nvar enabled:\
    \ Bool {\n    @objc(isEnabled) get {\n        /* ... */\n    }\n}\n```\n\n*  \
    \ 分别用 `func` 和 `class func` 标记实例方法（`-`）和类方法（`+`）。\n*   将简单的宏声明为全局常量，并将复杂的宏翻译为函数。\n\
    \n### 在你完成后\n\n*   更新 Objective-C 代码中的导入语句（更改为 `#import \"ProductModuleName-Swift.h\"\
    `），如 从同一个应用目标内部导入代码所示。\n*   通过取消勾选目标成员框从目标中移除原始的 Objective-C `.m` 文件。不要立即删除 `.m`\
    \ 和 `.h` 文件；使用它们进行故障排除。\n*   如果你为 Swift 类起了不同的名称，请更新代码以使用 Swift 类名而不是 Objective-C\
    \ 名称。\n\n### 故障提示与提醒\n\n尽管每次迁移体验取决于你现有的代码库，但有一些通用步骤和工具可以帮助你排除代码迁移故障：\n\n*   记住你不能在\
    \ Objective-C 中对 Swift 类进行类。\n*   一旦将类迁移到 Swift，你必须移除相应的 `.m` 文件以避免符号重复。\n*  \
    \ 为了在 Objective-C 中可访问且可用，Swift 类必须是 Objective-C 类的后代，或者标记为 `@objc`。\n*   当你将\
    \ Swift 代码引入 Objective-C 时，请记住它无法翻译某些特性。列表请参见 在 Objective-C 使用。\n*   Command 点击\
    \ Swift 类名查看生成的头文件。\n*   Option 点击符号查看其信息，如类型、属性和注释。\n\n## 文档历史\n\n此表描述了 *使用 Swift\
    \ 和 Objective-C* 的更改。\n\n| 日期 | 说明 |\n| --- | --- |\n| 2014-09-15 | 在[与 Objective-C\
    \ API 交互]章节增加了可失败初始化节。 |\n| 2014-09-02 | 在[带有 Objective-C 行为的 Swift 类编写]章节增加了在\
    \ Objective-C 中使用 Swift 名称节。<br>纠正了实时渲染节，该节之前说明实时渲染仅在在框架中编译时有效。现在这种限制不再存在。<br>在键值观察节的最后一个代码示例增加了\
    \ `deinit` 的实现和对 `super` 的调用。 |\n| 2014-08-04 | 更新了指针节，以反映 `UnsafePointer` 被 `UnsafeMutablePointer`取代，`ConstUnsafePointer`\
    \ 被 `UnsafePointer`取代，`AutoreleasingUnsafePointer` 被 `AutoreleasingUnsafeMutablePointer`取代。<br>指出被指向的类型（如\
    \ `NSString **`）没有桥接。<br>增加了在 Objective-C 使用 Swift 节。 |\n\n"
