  trans: "\n\n## 3. 为键路径（key-path）添加观察者，覆盖 `observeValueForKeyPath:ofObject:change:context:`\
    \ 方法，并在 `deinit` 中移除观察者。\n\nSwift\n\n```swift\nclass `MyObserver` `NSObject` {\n\
    \    var objectToObserve = MyObjectToObserve()\n\n    override init() {\n    \
    \    super.init()\n        objectToObserve.addObserver(self, forKeyPath: \"myDate\"\
    , options: .New, context: &myContext)\n    }\n\n    override func observeValueForKeyPath(keyPath:\
    \ String, ofObject object: AnyObject, change: [NSObject: AnyObject], context:\
    \ UnsafeMutablePointer<Void>) {\n        if context == &myContext {\n        \
    \    println(\"Date changed: \\(change[NSKeyValueChangeNewKey])\")\n        }\
    \ else {\n            super.observeValueForKeyPath(keyPath, ofObject: object,\
    \ change: change, context: context)\n        }\n    }\n\n    deinit {\n      \
    \  objectToObserve.removeObserver(self, forKeyPath: \"myDate\", context: &myContext)\n\
    \    }\n}\n```\n\n### 目标动作（Target-Action）\n\n目标-动作是一种常见的 Cocoa 设计模式，当特定事件发生时，一个对象会向另一个对象发送消息。目标-动作模型在\
    \ Swift 和 Objective-C 中本质上是类似的。在 Swift 中，你使用 `Selector` 类型来引用 Objective-C 选择器。有关在\
    \ Swift 代码中使用目标-动作模式的示例，请参阅 Objective-C Selectors。\n\n### 内省检查（Introspection）\n\
    \n在 Objective-C 中，你使用 `isKind:` 方法检查对象是否属于某个类类型，并使用 `conformsToProtocol:` 方法检查对象是否符合指定的协议。在\
    \ Swift 中，你通过使用 `is` 运算符检查类型，或使用 `as?` 运算符向下转换到该类型来完成此任务。\n\n你可以使用 `is` 运算符检查实例是否属于某个子类类型。如果实例属于该子类类型，`is`\
    \ 运算符返回 `true`，否则返回 `false`。\n\nSwift\n\n```swift\nif object is UIButton {\n \
    \   // object 的类型是 UIButton\n} else {\n    // object 的类型不是 UIButton\n}\n```\n\n\
    你也可以尝试使用 `as?` 运算符向下转换到子类类型。`as?` 运算符返回一个可选值（optional），该值可以使用 `if-let` 语句绑定到常量。\n\
    \nSwift\n\n```swift\nif let button = object as? UIButton {\n    // object 成功转换为类型\
    \ UIButton 并绑定到 button\n} else {\n    // object 无法转换为类型 UIButton\n}\n```\n\n更多信息，请参阅《Swift\
    \ 编程语言](The Swift Programming Language 中的类型转换。\n\n检查协议并转换到协议的语法与检查类并转换到类的语法完全相同。以下是一个使用\
    \ `as?` 运算符检查是否符合协议的示例：\n\nSwift\n\n```swift\nif let dataSource = object as? UITableViewDataSource\
    \ {\n    // object 符合 UITableViewDataSource 并绑定到 dataSource\n} else {\n    //\
    \ object 不符合 UITableViewDataSource\n}\n```\n\n注意，在转换之后，`dataSource` 常量的类型为 `UITableViewDataSource`，因此你只能调用在\
    \ `UITableViewDataSource` 协议定义的方法并访问属性。你必须将其转换回其他类型以执行其他操作。\n\n更多信息，请参阅《Swift\
    \ 编程语言](The Swift Programming Language 中的协议。\n\n## 与 C API 交互\n\n作为与 Objective-C\
    \ 互操作的一部分，Swift 与许多 C 语言类型和特性保持兼容。Swift 还提供了一种处理常用 C 构造结构和模式的方法，以防你的代码需要。\n\n\
    ### 原始类型\n\nSwift 提供了 C 原始整数类型的对应类型——例如 `char`、`int`、`float` 和 `double`。然而，这些类型与\
    \ Swift 核心整数类型（如 `Int`）之间没有隐式转换。因此，如果你的代码特别需要这些类型，请使用它们，否则在尽可能的情况下使用 `Int`。\n\n\
    | C 类型 | Swift 类型 |\n| --- | --- |\n| `bool` | `CBool` |\n| `char`, `signed char`\
    \ | `CChar` |\n| `unsigned char` | `CUnsignedChar` |\n| `short` | `CShort` |\n\
    | `unsigned short` | `CUnsignedShort` |\n| `int` | `CInt` |\n| `unsigned int`\
    \ | `CUnsignedInt` |\n| `long` | `CLong` |\n| `unsigned long` | `CUnsignedLong`\
    \ |\n| `long long` | `CLongLong` |\n| `unsigned long long` | `CUnsignedLongLong`\
    \ |\n| `wchar_t` | `CWideChar` |\n| `char16_t` | `CChar16` |\n| `char32_t` | `CChar32`\
    \ |\n| `float` | `CFloat` |\n| `double` | `CDouble` |\n\n### 举\n\nSwift 将任何标记有\
    \ `NS_ENUM` 宏的 C 风格枚举导入为 Swift 。这意味着当它们被导入 Swift 时，枚举值名称的前缀会被截断，无论它们是否是在 Swift\
    \ 中定义的。\n\n在 Objective-C 中，你这样定义一个枚举：\n\n```objectivec\ntypedef NS_ENUM(NSInteger,\
    \ UITableViewCellStyle) {\n    UITableViewCellStyleDefault,\n    UITableViewCellStyleValue,\n\
    \    UITableViewCellStyleSubtitle\n};\n```\n\n在 Swift 中，它是这样导入的：\n\n```swift\n\
    enum UITableViewCellStyle: Int {\n    case defaultStyle\n    case value\n    case\
    \ subtitle\n}\n```\n\n当你引用枚举值时，使用前导点（`.`）。在 Swift 中：\n\n```swift\nlet style: UITableViewCellStyle\
    \ = .defaultStyle\n```\n\nSwift 还会导入标记有 `NS_OPTIONS` 的选项。在 Objective-C 中，你这样定义一个枚举：\n\
    \n```objectivec\ntypedef NS_OPTIONS(NSInteger, MyOptions) {\n    MyOptionA = (1\
    \ << 0),\n    MyOptionB = (1 << 1);\n};\n```\n\n在 Swift 中，它是这样导入的：\n\n```swift\n\
    struct MyOptions: OptionSet {\n    case optionA = 1 << 0\n    case optionB = 1\
    \ << 1\n}\n```\n\n然后你可以这样使用它：\n\n```swift\nlet options: MyOptions = [.optionA,\
    \ .optionB]\n```\n\n### 指针\n\n尽可能的情况下，Swift 避免让你直接访问指针。然而，当你需要直接访问内存时，有各种指针类型供你使用。以下表格使用\
    \ `Type` 作为占位名称来表示映射语法。\n\n对于返回类型、变量和参数，适用以下映射：\n\n| C 语法 | Swift 语法 |\n| ---\
    \ | --- |\n| `const Type *` | `UnsafePointer<Type>` |\n| `Type *` | `UnsafeMutablePointer<Type>`\
    \ |\n\n对于类类型，适用以下映射：\n\n| C 语法 | Swift 语法 |\n| --- | --- |\n| `Type * const *`\
    \ | `UnsafePointer<Type>` |\n| `Type * __strong *` | `UnsafeMutablePointer<Type>`\
    \ |\n| `Type **` | `AutoreleasingUnsafeMutablePointer<Type>` |\n\n### 常量指针\n\n\
    当函数被声明为接收 `UnsafePointer<Type>` 参数时，它可以接受以下任何一种内容：\n\n*   `nil`，作为空指针传递\n*   `UnsafePointer<Type>`、`UnsafeMutablePointer<Type>`\
    \ 或 `AutoreleasingUnsafeMutablePointer<Type>` 值，必要时将转换为 `UnsafePointer<Type>`\n\
    *   操作数为 `Type` l 值的 `in-out` 表达式，作为该 l 值的地址传递\n*   `[Type]` 值，作为数组起始位置的指针传递，并在调用期间延长生命周期\n\
    \n如果你声明了像下面这样的函数：\n\n```swift\nfunc takesAPinter(x: UnsafePointer<Float>) {\n\
    \    /*...*/\n}\n```\n\n你可以通过以下任何方式之一调用它：\n\n```swift\nvar x: Float = 0.0\nvar\
    \ p: UnsafePointer<Float>? = nil\ntakesAPinter(nil!)\ntakesAPinter(p!)\ntakesAPinter(&x)\n\
    ```\n\n"
- fmt: "\n*   `takesAPointer([1.0, 2.0, 3.0])`\n\nWhen a function is declared as taking\
    \ a `UnsafePointer<Void>` argument, it can accept the same operands as `UnsafePointer<Type>`\
    \ for any type `Type`.\n\nIf you have declared a function like this one:\n\n```swift\n\
    func takesAVoidPointer(x: UnsafePointer<Void>) { /* ... */ }\n```\n\nYou can call\
    \ it in any of the following ways:\n\n```swift\nvar x: Float = 0.0, y: Int = 0\n\
    var p: UnsafePointer<Float> = nil, q: UnsafePointer<Int> = nil\ntakesAVoidPointer(nil)\n\
    takesAVoidPointer(p)\ntakesAVoidPointer(q)\ntakesAVoidPointer(&x)\ntakesAVoidPointer(&y)\n\
    takesAVoidPointer([1.0, 2.0, 3.0] as [Float])\nlet intArray = [1, 2, 3]\ntakesAVoidPointer(intArray)\n\
    ```\n\n### Mutable Pointers\n\nWhen a function is declared as taking an `UnsafeMutablePointer<Type>`\
    \ argument, it can accept any of the following:\n\n*   `nil`, which is passed\
    \ as a null pointer\n*   An `UnsafeMutablePointer<Type>` value\n*   An in-out\
    \ expression whose operand is a stored lvalue of type `Type`, which is passed\
    \ as the address of the lvalue\n*   An in-out `[Type]` value, which is passed\
    \ as a pointer to the start of the array, and lifetime-extended for the duration\
    \ of the call\n\nIf you have declared a function like this one:\n\n```swift\n\
    func takesAMutablePointer(x: UnsafeMutablePointer<Float>) { /*...*/ }\n```\n\n\
    You can call it in any of the following ways:\n\n```swift\nvar x: Float = 0.0\n\
    var p: UnsafeMutablePointer<Float> = nil\nvar a: [Float] = [1.0, 2.0, 3.0]\ntakesAMutablePointer(nil)\n\
    takesAMutablePointer(p)\ntakesAMutablePointer(&x)\ntakesAMutablePointer(&a)\n\
    ```\n\nWhen a function is declared as taking an `UnsafeMutablePointer<Void>` argument,\
    \ it can accept the same operands as `UnsafeMutablePointer<Type>` for any type\
    \ `Type`.\n\nIf you have declared a function like this one:\n\n```swift\nfunc\
    \ takesAMutableVoidPointer(x: UnsafeMutablePointer<Void>) { /* ... */ }\n```\n\
    \nYou can call it in any of the following ways:\n\n```swift\nvar x: Float = 0.0,\
    \ y: Int = 0\nvar p: UnsafeMutablePointer<Float> = nil, q: UnsafeMutablePointer<Int>\
    \ = nil\nvar a: [Float] = [1.0, 2.0, 3.0], b: [Int] = [1, 2, 3]\ntakesAMutableVoidPointer(nil)\n\
    takesAMutableVoidPointer(p)\ntakesAMutableVoidPointer(q)\ntakesAMutableVoidPointer(&x)\n\
    takesAMutableVoidPointer(&y)\ntakesAMutableVoidPointer(&a)\ntakesAMutableVoidPointer(&b)\n\
    ```\n\n### Autoreleasing Pointers\n\nWhen a function is declared as taking an\
    \ `AutoreleasingUnsafeMutablePointer<Type>`, it can accept any of the following:\n\
    \n*   `nil`, which is passed as a null pointer\n*   An `AutoreleasingUnsafeMutablePointer<Type>`\
    \ value\n*   An in-out expression, whose operand is primitive-copied to a temporary\
    \ nonowning buffer. The address of that buffer is passed to the callee, and on\
    \ return, the value in the buffer is loaded, retained, and reassigned into the\
    \ operand.\n\nNote that this list does not include arrays.\n\nIf you have declared\
    \ a function like this one:\n\n```swift\nfunc takesAnAutoreleasingPointer(x: AutoreleasingUnsafeMutablePointer<NSDate?>)\
    \ { /* ... */ }\n```\n\nYou can call it in any of the following ways:\n\n```swift\n\
    var x: NSDate? = nil\nvar p: AutoreleasingUnsafeMutablePointer<NSDate?> = nil\n\
    takesAnAutoreleasingPointer(nil)\ntakesAnAutoreleasingPointer(p)\ntakesAnAutoreleasingPointer(&x)\n\
    ```\n\nTypes that are pointed to are not bridged. For example, `NSString **` comes\
    \ over to Swift as `AutoreleasingUnsafeMutablePointer<NSString?>`, not `AutoreleasingUnsafeMutablePointer<String?>`.\n\
    \n### Function Pointers\n\nC function pointers are imported into Swift as `CFunctionPointer<Type>`,\
    \ where `Type` is a Swift function type. For example, a function pointer that\
    \ has the type `int (*)(void)` in C is imported into Swift as `CFunctionPointer<()\
    \ -> Int32>`.\n\n### Global Constants\n\nGlobal constants defined in C and Objective-C\
    \ source files are automatically imported by the Swift compiler as Swift global\
    \ constants.\n\n### Preprocessor Directives\n\nThe Swift compiler does not include\
    \ a preprocessor. Instead, it takes advantage of compile-time attributes, build\
    \ configurations, and language features to accomplish the same.\n\n### Simple\
    \ Macros\n\nWhere you typically used `#define` to define a constant in C and Objective-C,\
    \ in Swift you use a global constant. For example, the constant `#define FADE_ANIMATION_DURATION\
    \ 0.35` can be better expressed in Swift with `let FADE_ANIMATION_DURATION = 0.35`.\
    \ Because simple macros map directly to Swift variables, the compiler automatically\
    \ imports simple macros defined in C and Objective-C.\n\n### Complex Macros\n\n\
    Complex macros are used in C and Objective-C to avoid type-checking constraints\
    \ or to avoid retyping large amounts of boilerplate code. However, macros can\
    \ make debugging and refactoring difficult. In Swift, you can use functions and\
    \ generics to achieve the same results without any compromises. Therefore, the\
    \ complex macros that are in C and Objective-C source files are not made available\
    \ to your Swift.\n\n### Build Configurations\n\nSwift code and Objective-C code\
    \ are conditionally compiled in different ways. Swift code can be conditionally\
    \ compiled based on the evaluation of *build configurations*. Build configurations\
    \ include the literal `true` and `false` values, command line flags, and platform-testing\
    \ functions listed in the table below. You can specify command line flags using\
    \ `-D <flag#>`.\n\n| Function | Valid arguments |\n| --- | --- |\n| `os()` | `OS\
    \ X`, `iOS` |\n| `arch()` | `x86_64`, `arm`, `arm64`, `i386` |\n\nA simple conditional\
    \ compilation statement takes the following form:\n\n```swift\n#if build configuration\n\
    \ statements\n#else\n statements\n#endif\n```\n\nThe *statements* consist of zero\
    \ or more valid Swift statements, which can include expressions, statements, and\
    \ control flow statements. You can add additional build configuration requirements\
    \ to a conditional compilation statement with the `&&` and `||` operators, negate\
    \ build configurations with the `!` operator, and add condition blocks with `#elseif`:\n\
    \n```swift\n#if build configuration && !build configuration\n statements\n#elseif\
    \ build configuration\n statements\n#else\n statements\n#endif\n```\n\nIn contrast\
    \ with condition compilation statements in the C preprocessor, conditional compilation\
    \ statements in Swift must completely surround blocks of code that are self-contained\
    \ and syntactically valid. This is because all Swift code is syntax checked, even\
    \ when it is not compiled.\n\n## Mix and Match\n\n## Swift and Objective-C in\
    \ the Same Project\n"
