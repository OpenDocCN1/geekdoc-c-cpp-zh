    ### Foundation Data Types


    Swift provides a convenient overlay for interfacing with data types defined in
    the Foundation framework. Use this overlay to work with types like `NSSize` and
    `NSPoint`, using a syntax that feels natural and unified with the rest of the
    Swift language. For example, you can create an `NSSize` structure using this syntax:


    Swift


    *   `let``size` `=` `NSSize``(``width``:` `20``,` `height``:` `40``)`


    The overlay also lets you call Foundation functions on structures in a natural
    way.


    Swift


    *   `let``rect` `=` `CGRect``(``x``:` `50``,` `y``:` `50``,` `width``:` `100``,`
    `height``:` `100``)`


    *   `let``width` `=` `rect``.``width``// equivalent of CGRectGetWidth(rect)`


    *   `let``maxX` `=` `rect``.``maxY``// equivalent of CGRectGetMaxY(rect)`


    Swift bridges `NSUInteger` and `NSInteger` to `Int`. Both of these types come
    over as `Int` in Foundation APIs. `Int` is used for consistency whenever possible
    in Swift, but the `UInt` type is available if you require an unsigned integer
    type.


    ‌


    ### Foundation Functions


    `NSLog` is available in Swift for logging to the system console. You use the same
    formatting syntax you would use in Objective-C.


    Swift


    *   `NSLog``(``"%.7f"``,` `pi``)` `// Logs "3.1415927" to the console`'
