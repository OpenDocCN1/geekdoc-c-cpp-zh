    ## Revision History


    ### 2014-07-21

    - Added the [Requiring Dynamic Dispatch](#InteractingWithObjective-CAPIs.xhtml_TP40014216-CH4-XID_38)
    section to the [Interacting with Objective-C APIs](#InteractingWithObjective-CAPIs.xhtml)
    chapter.

    - The `@IBOutlet` attribute no longer implicitly declares a property as optional
    and weak.

    - Noted that the compiler does not implicitly synthesize the `@objc` attribute
    for private methods and properties.

    - Updated the [Pointers](#InteractingWithCAPIs.xhtml_TP40014216-CH8-XID_14) section
    to reflect that `CMutablePointer` and `CMutableVoidPointer` have been replaced
    with `UnsafePointer`, and `CConstPointer` and `CConstVoidPointer` have been replaced
    with `ConstUnsafePointer`.

    - Noted that C function pointers are now imported as `CFunctionPointer`.

    - Updated the [Swift and Objective-C in the Same Project](#MixandMatch.xhtml)
    chapter with information about access control in mixed-language targets.


    ### 2014-07-07

    - Changed code listings to use the new `Array` and `Dictionary` type syntax.

    - Added information about bridging between `Dictionary` and `NSDictionary`.

    - Updated the Core Data section to include directions to configure the managed
    object model.


    ### 2014-06-02

    - New document that describes various aspects of Swift’s compatibility with the
    Objective-C language and Cocoa/Cocoa Touch frameworks.


