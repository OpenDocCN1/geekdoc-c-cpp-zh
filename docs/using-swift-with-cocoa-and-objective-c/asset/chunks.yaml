    # Getting Started


    ## Setup


    Swift is designed to provide seamless compatibility with Cocoa and Objective-C.
    You can use Objective-C APIs (ranging from system frameworks to your own custom
    code) in Swift, and you can use Swift APIs in Objective-C. This compatibility
    makes Swift an easy, convenient, and powerful tool to integrate into your Cocoa
    app development workflow.


    This guide covers three important aspects of this compatibility that you can use
    to your advantage when developing Cocoa apps:


    *   `Interoperability` lets you interface between Swift and Objective-C code,
    allowing you to use Swift classes in Objective-C and to take advantage of familiar
    Cocoa classes, patterns, and practices when writing Swift code.

    *   `Mix and match` allows you to create mixed-language apps containing both Swift
    and Objective-C files that can communicate with each other.

    *   `Migration` from existing Objective-C code to Swift is made easy with interoperability
    and mix and match, making it possible to replace parts of your Objective-C apps
    with the latest Swift features.


    Before you get started learning about these features, you need a basic understanding
    of how to set up a Swift environment in which you can access Cocoa system frameworks.


    ### Setting Up Your Swift Environment


    To start experimenting with accessing Cocoa frameworks in Swift, create a Swift-based
    app from one of the Xcode templates.


    **To create a Swift project in Xcode**


    1. Choose `File` > `New` > `Project` > `(iOS or OS X)` > `Application` > `your
    template of choice`.

    2. Click the `Language` pop-up menu and choose Swift.


    ![image: ../Art/newproject_2x.png](Art/newproject_2x.png)


    A Swift project’s structure is nearly identical to an Objective-C project, with
    one important distinction: Swift has no header files. There is no explicit delineation
    between the implementation and the interface, so all the information about a particular
    class resides in a single `.swift` file.


    From here, you can start experimenting by writing Swift code in the app delegate,
    or you can create a new Swift class file by choosing `File` > `New` > `File` >
    `(iOS or OS X)` > `Source` > `Swift`.


    ### Understanding the Swift Import Process


    After you have your Xcode project set up, you can import any framework from the
    Cocoa platform to start working with Objective-C from Swift.


    Any Objective-C framework (or C library) that’s accessible as a `module` can be
    imported directly into Swift. This includes all of the Objective-C system frameworks—such
    as `Foundation`, `UIKit`, and `SpriteKit`—as well as common C libraries supplied
    with the system. For example, to import `Foundation`, simply add this import statement
    to the top of the Swift file you’re working in:


    ```swift

    import Foundation

    ```


    This import makes all of the `Foundation` APIs—including `NSDate`, `NSURL`, `NSMutableData`,
    and all of their methods, properties, and categories—directly available in Swift.


    The import process is straightforward. Objective-C frameworks vend APIs in header
    files. In Swift, those header files are compiled down to Objective-C modules,
    which are then imported into Swift as Swift APIs. The importing determines how
    functions, classes, methods, and types declared in Objective-C code appear in
    Swift. For functions and methods, this process affects the types of their arguments
    and return values. For types, the process of importing can do the following things:


    *   Remap certain Objective-C types to their equivalents in Swift, like `id` to
    `AnyObject`

    *   Remap certain Objective-C core types to their alternatives in Swift, like
    `NSString` to `String`

    *   Remap certain Objective-C concepts to matching concepts in Swift, like pointers
    to optionals


    In Interoperability, you’ll learn more about these mappings and about how to leverage
    them in your Swift code.


    The model for importing Swift into Objective-C is similar to the one used for
    importing Objective-C into Swift. Swift vends its APIs—such as from a framework—as
    Swift modules. Alongside these Swift modules are generated Objective-C headers.
    These headers vend the APIs that can be mapped back to Objective-C. Some Swift
    APIs do not map back to Objective-C because they leverage language features that
    are not available in Objective-C. For more information on using Swift in Objective-C,
    see [Swift and Objective-C in the Same Project](#MixandMatch.xhtml).


    ## Interoperability


    ## Interacting with Objective-C APIs


    `Interoperability` is the ability to interface between Swift and Objective-C in
    either direction, letting you access and use pieces of code written in one language
    in a file of the other language. As you begin to integrate Swift into your app
    development workflow, it’s a good idea to understand how you can leverage interoperability
    to redefine, improve, and enhance the way you write Cocoa apps.


    One important aspect of interoperability is that it lets you work with Objective-C
    APIs when writing Swift code. After you import an Objective-C framework, you can
    instantiate classes from it and interact with them using native Swift syntax.


    ### Initialization


    To instantiate an Objective-C class in Swift, you call one of its initializers
    with Swift syntax. When Objective-C `init` methods come over to Swift, they take
    on native Swift initializer syntax. The “init” prefix gets sliced off and becomes
    a keyword to indicate that the method is an initializer. For `init` methods that
    begin with “initWith`, the “With” also gets sliced off. The first letter of the
    selector piece that had `init` or `initWith` split off from it becomes lowercase,
    and that selector piece is treated as the name of the first argument. The rest
    of the selector pieces also correspond to argument names. Each selector piece
    goes inside the parentheses and is required at the call site.


    For example, where in Objective-C you would do this:


    ```objective-c

    UITableView *myTableView = [[UITableView alloc] initWithFrame:CGRectZero style:UITableViewStyleGrouped];

    ```


    In Swift, you do this:


    ```swift

    let myTableView: UITableView = UITableView(frame: .Zero, style: .grouped)

    ```


    You don’t need to call `alloc`; Swift correctly handles this for you. Notice that
    “init” doesn’t appear anywhere when calling the Swift-style initializer.


    You can be explicit in typing the object during initialization, or you can omit
    the type. Swift’s type inference correctly determines the type of the object.


    ```swift

    let myTextField = UITextField(frame: CGRect(x: 0.0, y: 0.0, width: 200.0, height:
    40.0))

    ```


    These `UITableView` and `UITextField` objects have the same familiar functionality
    that they have in Objective-C. You can use them in the same way you would in Objective-C,
    accessing any properties and calling any methods defined on the respective classes.


    For consistency and simplicity, Objective-C factory methods get mapped as convenience
    initializers in Swift. This mapping allows them to be used with the same concise,
    clear syntax as initializers. For example, whereas in Objective-C you would call
    this factory method like this:


    ```objective-c

    UIColor *color = [UIColor colorWithRed:0.5 green:0.0 blue:0.5 alpha:1.0];

    ```


    In Swift, you call it like this:


    ```swift

    let color = UIColor(red: 0.5, green: 0.0, blue: 0.5, alpha: 1.0)

    ```


    ### Failable Initialization

    '
