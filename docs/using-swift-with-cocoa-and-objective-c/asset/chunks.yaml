  trans: "\n\n在某些情况下，你可能完全确定某个 Objective-C 方法或属性永远不会返回 `nil` 对象引用。为了让这种特殊场景下的对象处理起来更加方便，Swift\
    \ 将对象类型导入为*隐式解包可选类型*（implicitly unwrapped optionals）。隐式解包可选类型包含了可选类型的所有安全特性。此外，你可以直接访问该值，而无需检查\
    \ `nil` 或由自己进行解包。当你访问这种可选类型中的值而没有先进行安全解包时，隐式解包可选类型会检查该值是否缺失。如果值缺失，就会发生运行时错误。因此，除非你确定值不会缺失，否则你应该始终自己检查并解包隐式解包可选类型。\n\
    \n### Extensions（扩展）\n\nSwift 扩展（extension）类似于 Objective-C 的分类（category）。扩展可以扩展现有类、结构体和枚举的行为，包括在\
    \ Objective-C 中定义的类型。你可以对来自系统框架的类型或你自定义的任一类型定义扩展。只需导入相应的模块，并使用你在 Objective-C 中使用的名称引用该类、结构体或枚举即可。\n\
    \n例如，你可以扩展 `UIBezierPath` 类，根据提供的边长和起始点，创建一个带有等边三角形的简单贝塞尔路径。\n\n```swift\nextension\
    \ UIBezierPath {\n    convenience init(triangleSideLength: Float, origin: CGPoint)\
    \ {\n        self.init()\n        let squareRoot = Float(sqrt(3.0))\n        let\
    \ altitude = (squareRoot * triangleSideLength) / 2\n        moveToPoint(origin)\n\
    \        addLineToPoint(CGPoint(x: triangleSideLength, y: origin.x))\n       \
    \ addLineToPoint(CGPoint(x: triangleSideLength / 2, y: altitude))\n        closePath()\n\
    \    }\n}\n```\n\n你可以使用扩展来添加属性（包括类属性静态属性）。然而，这些属性必须是计算属性；扩展不能为类、结构体或枚举添加存储属性。\n\
    \n此示例扩展了 `CGRect` 结构体以包含一个计算属性 `area`：\n\n```swift\nextension CGRect {\n    var\
    \ area: CGFloat {\n        return width * height\n    }\n}\nlet rect = CGRect(x:\
    \ 0.0, y: 0.0, width: 10.0, height: 50.0)\nlet area = rect.area\n// area: CGFloat\
    \ = 500.0\n```\n\n你还可以使用扩展在不创建子类的情况下为类添加协议遵循（protocol conformance）。如果协议是在 Swift\
    \ 中定义的，你也可以为在 Swift 或 Objective-C 中定义的结构体或枚举添加该协议的遵循。\n\n你不能使用扩展来重写 Objective-C\
    \ 类型现有的方法或属性。\n\n### Closures（闭包）\n\nObjective-C blocks 会自动导入为 Swift 闭包。例如，这里有一个\
    \ Objective-C block 变量：\n\n```objective-C\nvoid (^completionBlock)(NSData*, NSError*)\
    \ = ^(NSData *data, NSError *error) { /* ... */ };\n```\n\n这是它在 Swift 中的对应形式：\n\
    \n```swift\nlet completionBlock: (NSData, NSError) -> Void = { data, error in\
    \ /* ... */ }\n```\n\nSwift 闭包和 Objective-C blocks 是兼容兼容的，因此你可以将 Swift 闭包传递给期望\
    \ blocks 的 Objective-C 方法。Swift 闭包和函数具有相同的类型，你甚至可以传递 Swift 函数名。\n\n闭包的捕获语义与 blocks\
    \ 相似，但在一个关键点上不同：变量是可变的而不是拷贝的。换句话说，Objective-C 中 `__block` 的行为是 Swift 中变量的默认行为。\n\
    \n### Object Comparison（对象比较）\n\n在 Swift 中比较两个对象时，有两种不同的比较类型。第一种是*等价性*（`==`），比较对象的内容。第二种是*标识性*（`===`），判断常量或变量是否指向同一个对象实例。\n\
    \nSwift 和 Objective-C 对象通常在 Swift 中使用 `==` 和 `===` 运算符进行比较。Swift 为派自 `NSObject`\
    \ 类的对象提供了 `==` 运算符的默认实现。在该运算符的实现中，Swift 会调用 `NSObject` 类中定义的 `isEqual:` 方法。`NSObject`\
    \ 类只执行标识比较，因此你应该在派自 `NSObject` 的类中实现你自己的 `isEqual:` 方法。由于你可以将 Swift 对象（包括未派自 `NSObject`\
    \ 的对象）传递给 Objective-C API，如果你希望 Objective-C API 比较对象的内容而非身份，则应该为这些类实现 `isEqual:`\
    \ 方法。\n\n在为你的类实现等价性时，请确保根据*Cocoa Core Competencies*中对象比较的规则实现 `hash` 属性。此外，如果你想将你的类作为字典的键，还要遵循\
    \ `Hashable` 协议并实现 `hashValue` 属性。\n\n### Swift Type Compatibility（Swift 类型兼容性）\n\
    \n当你创建一个派自 Objective-C 类的 Swift 类时，该类及其成员——属性、方法、下标和初始化器——可以自动从 Objective-C 调用。在某些情况下，你需要对\
    \ Swift API 暴露给 Objective-C 的方式进行更细粒度的控制。如果你的 Swift 类没有继承自 Objective-C 类，或者你想要更改接口在暴露给\
    \ Objective-C 代码时的符号名称，可以使用 `@objc` 属性。如果你正在使用如键值观察（key–value observing）等通过动态替换方法实现的\
    \ API，还可以使用 `dynamic` 修饰符来要求对成员的访问通过 Objective-C 运行时进行动态分发。\n\n### Exposing Swift\
    \ Interfaces in Objective-C（在 Objective-C 中暴露 Swift 接口）\n\n当你定义一个继承 `NSObject`\
    \ 或任何其他 Objective-C 类的 Swift 类时，该类会自动与 Objective-C 兼容。本节中的所有步骤已由 Swift 编译器为你完成。如果你从未在\
    \ Objective-C 中导入 Swift 类，在这种情况下不需要担心类型兼容性。否则，如果你的 Swift 类没有派自 Objective-C 类，且你想在\
    \ Objective-C 代码中使用它，可以使用下述的 `@objc` 属性。\n\n`@objc` 属性使你的 Swift API 在 Objective-C\
    \ 和 Objective-C 运行时可用。换句话，你可以在任何要在 Objective-C 中使用的 Swift 方法、属性、下标、初始化器或类之前使用\
    \ `@objc` 属性。如果你的类继承自 Objective-C 类，编译器会为你插入该属性。编译器还会为标记了 `@objc` 的类的每个成员添加该属性。当你使用\
    \ `@IBOutlet`、`@IBAction` 或 `@NSManaged` 属性时，也会添加 `@objc` 属性。当你处理使用选择器（selector）来实现目标-动作模式的\
    \ Objective-C 类时（例如 `NSTimer` 或 `UIButton`），该属性也非常有用。\n\n当从 Objective-C 使用 Swift\
    \ API 时，编译器通常执行直接翻译。例如，Swift API `func playSong(name: String)` 在 Objective-C 中导入为\
    \ `- (void)playSong:(NSString *)name`。然而，有一个异常：当你在 Objective-C 中 Swift 初始化器时，编译器会在方法开头添加“initWith”文本，并正确大写原始初始化器的第一个字母。例如，这个\
    \ Swift 初始化器 `init (songName: String, artist: String)` 在 Objective-C 中导入为 `- (instancetype)initWithSongName:(NSString\
    \ *)songName artist:(NSString *)artist`。\n\n"
- fmt: "\n# Swift\n\nSwift also provides a variant of the `@objc` attribute that allows\
    \ you to specify name for your symbol in Objective-C. For example, if the name\
    \ of your Swift class contains a character that isn’t supported by Objective-C,\
    \ you can provide an alternative name to use in Objective-C. If you provide an\
    \ Objective-C name for a Swift function, use Objective-C selector syntax. Remember\
    \ to add a colon (`:`) wherever a parameter follows a selector piece.\n\n```swift\n\
    @objc(`Squirrel`)\nclass `Белка` {\n    @objc(`initWithName`:)\n    init (`имя:`\
    \ `String`) { /*...*/ }\n    \n    @objc(`hideNuts`:`inTree`:)\n    func `прячьОрехи`(`Int`,\
    \ `вДереве:` `Дерево`) { /*...*/ }\n}\n}\n```\n\nWhen you use the `@objc(<#name#>)`\
    \ attribute on a Swift class, the class is made available in Objective-C without\
    \ any namespacing. As a result, this attribute can also be useful when you migrate\
    \ an archivable Objective-C class to Swift. Because archived objects store the\
    \ name of their class in the archive, you should use the `@objc(<#name#>)` attribute\
    \ to specify the same name as your Objective-C class so that older archives can\
    \ be unarchived by your new Swift class.\n\n## Requiring Dynamic Dispatch\n\n\
    While the `@objc` attribute exposes your Swift API to the Objective-C runtime,\
    \ it does not guarantee dynamic dispatch of a property, method, subscript, or\
    \ initializer. The Swift compiler may still devirtualize or inline member access\
    \ to optimize the performance of your code, bypassing the Objective-C runtime.\
    \ When you mark a member declaration with the `dynamic` modifier, access to that\
    \ member is always dynamically dispatched. Because declarations marked with the\
    \ `dynamic` modifier are dispatched using the Objective-C runtime, they’re implicitly\
    \ marked with the `@objc` attribute.\n\nRequiring dynamic dispatch is rarely necessary.\
    \ However, you must use the `dynamic` modifier when you know that the implementation\
    \ of an API is replaced at runtime. For example, you can use the `method_exchangeImplementations`\
    \ function in the Objective-C runtime to swap out the implementation of a method\
    \ while an app is running. If the Swift compiler inlined the implementation of\
    \ the method or devirtualized access to it, the new implementation would not be\
    \ used.\n\n## Objective-C Selectors\n\nAn Objective-C selector is a type that\
    \ refers to the name of an Objective-C method. In Swift, Objective-C selectors\
    \ are represented by the `Selector` structure. You can construct a selector with\
    \ a string literal, such as `let mySelector: Selector = \"tappedButton:\"`. Because\
    \ string literals can be automatically converted to selectors, you can pass a\
    \ string literal to any method that accepts a selector.\n\n```swift\nimport UIKit\n\
    \nclass MyViewController: UIViewController {\n    let myButton = UIButton(frame:\
    \ CGRect(x: 0, y: 0, width: 100, height: 50))\n    \n    init(nibName nibNameOrNil:\
    \ String?, bundle nibBundleOrNil: NSBundle?) {\n        super.init(nibName: nibNameOrNil,\
    \ bundle: nibBundleOrNil)\n        myButton.addTarget(self, action: \"tappedButton:\"\
    , forControlEvents: .TouchUpInside)\n    }\n    \n    func tappedButton(sender:\
    \ UIButton!) {\n        println(\"tapped button\")\n    }\n}\n```\n\nIf your Swift\
    \ class inherits from an Objective-C class, all of the methods and properties\
    \ in the class are available as Objective-C selectors. Otherwise, if your Swift\
    \ class does not inherit from an Objective-C class, you need to prefix the symbol\
    \ you want to use as a selector with the `@objc` attribute, as described in [Swift\
    \ Type Compatibility].\n\n## Writing Swift Classes with Objective-C Behavior\n\
    \nInteroperability lets you define Swift classes that incorporate Objective-C\
    \ behavior. You can subclass Objective-C classes, adopt Objective-C protocols,\
    \ and take advantage of other Objective-C functionality when writing a Swift class.\
    \ This means that you can create classes based on familiar, established behavior\
    \ in Objective-C and enhance them with Swift’s modern and powerful language features.\n\
    \n### Inheriting from Objective-C Classes\n\nIn Swift, you can define subclasses\
    \ of Objective-C classes. To create a Swift class that inherits from an Objective-C\
    \ class, add a colon (`:`) after the name of the Swift class, followed by the\
    \ name of the Objective-C class.\n\n```swift\nimport UIKit\n\nclass MySwiftViewController:\
    \ UIViewController {\n    // define the class\n}\n```\n\nYou get all the functionality\
    \ offered by the superclass in Objective-C. If you provide your own implementations\
    \ of the superclass’s methods, remember to use the `override` keyword.\n\n###\
    \ Adopting Protocols\n\nIn Swift, you can adopt protocols that are defined in\
    \ Objective-C. Like Swift protocols, Objective-C protocols follow the name of\
    \ the class.\n\n```swift\nclass MySwiftViewController: UIViewController, UITableViewDelegate,\
    \ UITableViewDataSource {\n    //\n}\n```\n\nObjective-C protocols come in Swift,\
    \ you refer to it as `UITableViewDelegate`. Because the namespace of classes and\
    \ protocols is unified in Swift, the `NSObject` protocol in Objective-C is remapped\
    \ to `NSObject`.\n\n### Writing Initializers and Deinitializers\n\nThe Swift compiler\
    \ ensures that your initializers do not leave any properties in your class uninitialized\
    \ to increase the safety and predictability of your code. Additionally, unlike\
    \ Objective-C, in Swift there is no separate memory allocation method to invoke.\
    \ You use native Swift syntax even when you are working with Objective-C classes.\
    \ You can read more about implementing your initializers in *The Swift Programming\
    \ Language*.\n\nWhen you want to perform additional clean-up before your class\
    \ is deallocated, you can implement a deninitializer instead of the `dealloc`\
    \ method. Swift deinitializers are called automatically, just before instance\
    \ deallocation. Swift automatically calls the superclass deinitializer after invoking\
    \ your subclass deinitializer. When you are working with an Objective-C class\
    \ or your Swift class inherits from an Objective-C class, Swift calls your class’s\
    \ superclass `dealloc` method for you as well.\n\n### Integrating with Interface\
    \ Builder\n\nThe Swift compiler includes attributes that enable Interface Builder\
    \ features for your Swift classes. As in Objective-C, you can use outlets, actions,\
    \ and live rendering in Swift.\n\n### Working with Outlets and Actions\n\nOutlets\
    \ and actions allow you to connect your source code to user interface objects\
    \ in Interface Builder. To use outlets and actions in Swift, insert `@IBOutlet`\
    \ or `@IBAction` just before the property or method declaration. Use the same\
    \ `@IBOutlet` attribute to declare an outlet collection—just specify an array\
    \ for the type.\n\nWhen you declare an outlet in Swift, you should make the type\
    \ of the outlet an implicitly unwrapped optional. This way, you can let the storyboard\
    \ connect the outlets at runtime, after initialization. When your class is initialized\
    \ from a storyboard or `xib` file, you can assume that the outlet has been connected.\n\
    \nFor example, the following Swift code declares a class with an outlet, an outlet\
    \ collection, and an action:\n\n```swift\nclass MyViewController: UIViewController\
    \ {\n    //\n}\n```\n"
