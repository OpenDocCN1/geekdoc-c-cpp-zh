    ## Writing Swift Classes with Objective-C Behavior


    Interoperability lets you define Swift classes that incorporate Objective-C behavior.
    You can subclass Objective-C classes, adopt Objective-C protocols, and take advantage
    of other Objective-C functionality when writing a Swift class. This means that
    you can create classes based on familiar, established behavior in Objective-C
    and enhance them with Swift’s modern and powerful language features.


    ‌


    ### Inheriting from Objective-C Classes


    In Swift, you can define subclasses of Objective-C classes. To create a Swift
    class that inherits from an Objective-C class, add a colon (`:`) after the name
    of the Swift class, followed by the name of the Objective-C class.


    Swift


    *   `import``UIKit`


    *   `class``MySwiftViewController``:` `UIViewController` `{`


    *   `// define the class`


    *   `}`


    You get all the functionality offered by the superclass in Objective-C. If you
    provide your own implementations of the superclass’s methods, remember to use
    the `override` keyword.


    ‌


    ### Adopting Protocols


    In Swift, you can adopt protocols that are defined in Objective-C. Like Swift
    protocols, any Objective-C protocols go in a comma-separated list following the
    name of a class’s superclass, if any.


    Swift


    *   `class``MySwiftViewController``:` `UIViewController``,` `UITableViewDelegate``,`
    `UITableViewDataSource` `{`


    *   `// define the class`


    *   `}`


    Objective-C protocols come in as Swift protocols. If you want to refer to the
    `UITableViewDelegate` protocol in Swift code, refer to it as `UITableViewDelegate`
    (as compared to `id<UITableViewDelegate>` in Objective-C).


    Because the namespace of classes and protocols is unified in Swift, the `NSObject`
    protocol in Objective-C is remapped to `NSObjectProtocol` in Swift.


    ‌


    ### Writing Initializers and Deinitializers


    The Swift compiler ensures that your initializers do not leave any properties
    in your class uninitialized to increase the safety and predictability of your
    code. Additionally, unlike Objective-C, in Swift there is no separate memory allocation
    method to invoke. You use native Swift initialization syntax even when you are
    working with Objective-C classes—Swift converts Objective-C initialization methods
    to Swift initializers. You can read more about implementing your own initializers
    in Initializers in *The Swift Programming Language*.


    When you want to perform additional clean-up before your class is deallocated,
    you can implement a deninitializer instead of the `dealloc` method. Swift deinitializers
    are called automatically, just before instance deallocation happens. Swift automatically
    calls the superclass deinitializer after invoking your subclass’ deinitializer.
    When you are working with an Objective-C class or your Swift class inherits from
    an Objective-C class, Swift calls your class’s superclass `dealloc` method for
    you as well. You can read more about implementing your own deinitializers in Deinitializers
    in [The Swift Programming Language](itms-books://itunes.apple.com/us/book/the-swift-programming-language/id881256329?mt=11).


    ‌


    ### Integrating with Interface Builder


    The Swift compiler includes attributes that enable Interface Builder features
    for your Swift classes. As in Objective-C, you can use outlets, actions, and live
    rendering in Swift.


    ‌


    ### Working with Outlets and Actions


    Outlets and actions allow you to connect your source code to user interface objects
    in Interface Builder. To use outlets and actions in Swift, insert `@IBOutlet`
    or `@IBAction` just before the property or method declaration. You use the same
    `@IBOutlet` attribute to declare an outlet collection—just specify an array for
    the type.


    When you declare an outlet in Swift, you should make the type of the outlet an
    implicitly unwrapped optional. This way, you can let the storyboard connect the
    outlets at runtime, after initialization. When your class is initialized from
    a storyboard or `xib` file, you can assume that the outlet has been connected.


