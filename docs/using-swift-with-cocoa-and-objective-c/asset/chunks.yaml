- fmt: "\n`Migration` provides an opportunity to revisit an existing Objective-C app\
    \ and improve its architecture, logic, and performance by replacing pieces of\
    \ it in Swift. For a straightforward, incremental migration of an app, you’ll\
    \ be using the tools learned earlier—mix and match plus interoperability. Mix-and-match\
    \ functionality makes it easy to choose which features and functionality to implement\
    \ in Swift, and which to leave in Objective-C. Interoperability makes it possible\
    \ to integrate those features back into Objective-C code with no hassle. Use these\
    \ tools to explore Swift’s extensive functionality and integrate it back into\
    \ your existing Objective-C app without having to rewrite the entire app in Swift\
    \ at once.\n\n### Preparing Your Objective-C Code for Migration\n\nBefore you\
    \ begin migrating your codebase, make sure that your Objective-C and Swift code\
    \ will have optimal compatibility. This means tidying up and modernizing your\
    \ existing Objective-C codebase. Your existing code should follow modern coding\
    \ practices to make it easier to interact with Swift seamlessly. For a short list\
    \ of practices to adopt before moving forward, see *Adopting Modern Objective-C*.\n\
    \n### The Migration Process\n\nThe most effective approach for migrating code\
    \ to Swift is on a per-file basis—that is, one class at a time. Because you can’t\
    \ subclass Swift classes in Objective-C, it’s best to choose a class in your app\
    \ that doesn’t have any subclasses. You’ll replace the `.m` and `.h` files for\
    \ that class with a single `.swift` file. Everything from your implementation\
    \ and interface will go directly into this single Swift file. You won’t create\
    \ a header file; Xcode generates a header automatically in case you need to reference\
    \ it.\n\n### Before You Start\n\n*   Create a Swift class for your corresponding\
    \ Objective-C `.m` and `.h` files by choosing `File > New > File > (iOS or OS\
    \ X) > Source > Swift File`. You can use the same or a different name than your\
    \ Objective-C class. Class prefixes are optional in Swift.\n*   Import relevant\
    \ system frameworks.\n*   Fill out an Objective-C bridging header if you need\
    \ to access Objective-C code from the same app target in your Swift file. For\
    \ instructions, see [Importing Code from Within the Same App Target](#MixandMatch.xhtml_TP40014216-CH10-XID_79).\n\
    *   To make your Swift class accessible and usable back in Objective-C, make it\
    \ a descendant of an Objective-C class or mark it with the `@objc` attribute.\
    \ To specify a particular name for the class to use in Objective-C, mark it with\
    \ `@objc(<#name#>)`, where `<#name#>` is the name that your Objective-C code will\
    \ use to reference the Swift class. For more information on `@objc`, see [Swift\
    \ Type Compatibility](#InteractingWithObjective-CAPIs.xhtml_TP40014216-CH4-XID_35).\n\
    \n### As You Work\n\n*   You can set up your Swift class to integrate Objective-C\
    \ behavior by subclassing Objective-C classes, adopting Objective-C protocols,\
    \ and more. For more information, see [Writing Swift Classes with Objective-C\
    \ Behavior](#WritingSwiftClassesWithObjective-CBehavior.xhtml).\n*   As you work\
    \ with Objective-C APIs, you’ll need to know how Swift translates certain Objective-C\
    \ language features. For more information, see [Interacting with Objective-C APIs](#InteractingWithObjective-CAPIs.xhtml).\n\
    *   When writing Swift code that incorporates Cocoa frameworks, remember that\
    \ certain types are bridged, which means you can work with Swift types in place\
    \ of Objective-C types. For more information, see [Working with Cocoa Data Types](#WorkingWithCocoaDataTypes.xhtml).\n\
    *   As you incorporate Cocoa patterns into your Swift class, see [Adopting Cocoa\
    \ Design Patterns](#AdoptingCocoaDesignPatterns.xhtml) for information on translating\
    \ common design patterns.\n*   For considerations on translating your properties\
    \ from Objective-C to Swift, read Properties in [The Swift Programming Language](itms-books://itunes.apple.com/us/book/the-swift-programming-language/id881256329?mt=11).\n\
    *   Use the `@objc(<#name#>)` attribute to provide Objective-C names for properties\
    \ and methods when necessary. For example, you can mark a property called `enabled`\
    \ to have a getter named `isEnabled` in Objective-C like this:\n\n```swift\nvar\
    \ enabled: Bool {\n    @objc(isEnabled) get {\n        /* ... */\n    }\n}\n```\n\
    \n*   Denote instance (`-`) and class (`+`) methods with `func` and `class func`,\
    \ respectively.\n*   Declare simple macros as global constants, and translate\
    \ complex macros into functions.\n\n### After You Finish\n\n*   Update import\
    \ statements in your Objective-C code (to `#import \"ProductModuleName-Swift.h\"\
    `), as described in [Importing Code from Within the Same App Target](#MixandMatch.xhtml_TP40014216-CH10-XID_79).\n\
    *   Remove the original Objective-C `.m` file from the target by deselecting the\
    \ target membership checkbox. Don’t delete the `.m` and `.h` files immediately;\
    \ use them to troubleshoot.\n*   Update your code to use the Swift class name\
    \ instead of the Objective-C name if you gave the Swift class a different name.\n\
    \n### Troubleshooting Tips and Reminders\n\nEven though each migration experience\
    \ is different depending on your existing codebase, there are some general steps\
    \ and tools to help you troubleshoot your code migration:\n\n*   Remember that\
    \ you cannot subclass a Swift class in Objective-C.\n*   Once you migrate a class\
    \ to Swift, you must remove the corresponding `.m` file to avoid a duplicate symbol.\n\
    *   To be accessible and usable in Objective-C, a Swift class must be a descendant\
    \ of an Objective-C class or be marked `@objc`.\n*   When you bring Swift code\
    \ into Objective-C, remember that Objective-C won’t be able to translate certain\
    \ features. For a list, see [Using Swift from Objective-C](#MixandMatch.xhtml_TP40014216-CH10-XID_86).\n\
    *   Command-click a Swift class name to see its generated header.\n*   Option-click\
    \ a symbol to see implicit information about it, like its type, attributes, and\
    \ documentation comments.\n\n## Document History\n\nThis table describes the changes\
    \ to *Using Swift and Objective-C*.\n\n| Date | Notes |\n| --- | --- |\n| 2014-09-15\
    \ | * Added the [Failable Initialization](#InteractingWithObjective-CAPIs.xhtml_TP40014216-CH4-XID_27)\
    \ section to the [Interacting with Objective-C APIs](#InteractingWithObjective-CAPIs.xhtml)\
    \ chapter. |\n| 2014-09-02 | * Added the [Using Swift Class Names with Objective-C](#WritingSwiftClassesWithObjective-CBehavior.xhtml_TP40014216-CH5-XID_68)\
    \ section to the [Writing Swift Classes with Objective-C Behavior](#WritingSwiftClassesWithObjective-CBehavior.xhtml)\
    \ chapter.<br>* Corrected the [Live Rendering](#WritingSwiftClassesWithObjective-CBehavior.xhtml_TP40014216-CH5-XID_62)\
    \ section which previously stated that live rendering only worked when a designable\
    \ class was compiled in a framework. This limitation no longer exists.<br>* Added\
    \ an implementation of `deinit` and a call to `super` in the last code sample\
    \ in the [Key-Value Observing](#AdoptingCocoaDesignPatterns.xhtml_TP40014216-CH7-XID_8)\
    \ section. |\n| 2014-08-04 | * Updated the [Pointers](#InteractingWithCAPIs.xhtml_TP40014216-CH8-XID_14)\
    \ section to reflect that `UnsafePointer` has been replaced with `UnsafeMutablePointer`,\
    \ `ConstUnsafePointer` has been replaced with `UnsafePointer`, and `AutoreleasingUnsafePointer`\
    \ has been replaced with `AutoreleasingUnsafeMutablePointer`.<br>* Noted that\
    \ types that are pointed to, like `NSString **`, are not bridged.<br>* Added the\
    \ [Key-Value Observing](#AdoptingCocoaDesignPatterns.xhtml_TP40014216-CH7-XID_8)\
    \ section to the [Adopting Cocoa Design Patterns](#AdoptingCocoaDesignPatterns.xhtml)\
    \ chapter. |\n"
