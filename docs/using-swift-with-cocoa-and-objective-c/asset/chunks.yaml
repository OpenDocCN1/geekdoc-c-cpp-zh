    \n### Implementing Core Data Managed Object Subclasses\n\nCore Data provides the\
    \ underlying storage and implementation of properties in subclasses of the `NSManagedObject`\
    \ class. Add the `@NSManaged` attribute before each property definition in your\
    \ managed object subclass that corresponds to an attribute or relationship in\
    \ your Core Data model. Like the `@dynamic` attribute in Objective-C, the `@NSManaged`\
    \ attribute informs the Swift compiler that the storage and implementation of\
