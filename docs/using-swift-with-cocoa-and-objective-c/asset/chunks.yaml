    由于框架目标生成的头文件是框架公共接口的一部分，因此只有标记有 `public` 修饰符的声明才会出现在框架目标生成的生成的头文件中。你仍然可以在框架的 Objective-C
    部分中使用标记有 `internal` 修饰符的 Swift 方法和属性，前提是这些方法和属性被声明在继承自 Objective-C 类的类中。有关访问级别修饰符的更多信息，请参阅
    Swift 语言中的访问控制。


    ### 如何从同一框架向 Objective-C 导入 Swift 代码


    1. 在 `Build Settings`（编译设置）的 `Packaging`（打包）中，确保该框架目标 get `Defines Module` 设置为
    `Yes`。

    2. 使用以下语法并替换相应的名称，将该框架目标的 Swift 代码导入到该框架目标内的任何 Objective-C `.m` 文件中：


    Objective-C

    ```objc

    * #import <ProductName/ProductModuleName-Swift.h>

    ```


    包含此导入语句的框架目标中的 Swift 文件将在 Objective-C `.m` 文件中是可见的。关于在 Objective-C 代码中使用 Swift
    的信息，请参阅在 Objective-C 中使用 Swift。


    | | 导入到 Swift | 导入到 Objective-C |

    | --- | --- | --- |

    | Swift 代码 | 无导入语句 | `#import <ProductName/ProductModuleName-Swift.h>` |

    | Objective-C 代码 | 无导入语句；需要 Objective-C 伞形头文件 | `#import "Header.h"` |


    ### 导入外部框架


    你可以导入具有纯 Objective-C 代码库、纯 Swift 代码库或混合语言代码库的外部框架。无论框架是用单语言编写的，还是包含这两种语言的文件，导入外部框架的过程都是相同的。当你导入外部框架时，请确保你所导入的框架的
    `Defines Module` 编译设置设置为 `Yes`。


    你可以使用以下语法将框架导入到不同目标中的任何 Swift 文件中：


    Swift

    ```swift

    * import FrameworkName

    ```


    你可以使用以下语法将框架导入到不同目标中的任何 Objective-C `.m` 文件中：


    Objective-C

    ```objc

    * @import FrameworkName;

    ```


    | | 导入到 Swift | 导入到 Objective-C |

    | --- | --- | --- |

    | 任何语言框架 | `import FrameworkName` | `@import FrameworkName;` |


    ### 在 Objective-C 中使用 Swift


    一旦将 Swift 代码导入 Objective-C，就可以使用普通的 Objective-C 语法来处理 Swift 类。


    Objective-C

    ```objc

    * MySwiftClass *swiftObject = [[MySwiftClass alloc] init];

    * [swiftObject swiftMethod];

    ```


    Swift 类或协议必须标记有 `@objc` 属性，才能在 Objective-C 中访问和使用。该属性告诉编译器，这段 Swift 代码可以从 Objective-C
    访问。如果你的 Swift 类是 Objective-C 类的后代，编译器会自动为你添加 `@objc` 属性。要需更多信息，请参阅 Swift 类型兼容性。


    只要与 Objective-C 兼容，你就可以访问类或协议中标记有 `@objc` 属性的任何内容。这排除了 Swift 特有的功能，如下所示列出的：

    * 泛型

    * 元组

    * 在 Swift 中定义的枚举

    * 在 Swift 中定义的结构体

    * 在 Swift 中定义的顶层函数

    * 在 Swift 中定义的全局变量

    * 在 Swift 中定义的类型别名

    * Swift 风格的变变参数

    * 嵌套类型

    * 柯里函数


    例如，一个接受泛型类型作为参数或返回元组的方法将无法在 Objective-C 中使用。


    为了避免循环引用，不要在 Objective-C 头文件中导入 Swift。相反，你可以对 Swift 类进行前置声明以便在 Objective-C 头文件中使用它。请注意，你不能在
    Objective-C 中对 Swift 类建模。


    ### 如何在 Objective-C 头文件中引用 Swift 类


    * 前置声明你正在使用的 Swift 类：


    Objective-C

    ```objc

    // MyObjcClass.h

    @class MySwiftClass;

    @interface MyObjcClass : NSObject

    - (MySwiftClass*)returnSwiftObject;

    /* ... */

    @end

    ```


    ### 命名你的产品模块


    Xcode 为 Swift 代码生成的头文件名称，以及 Xcode 为你创建的 Objective-C 桥接头文件名称，都是根据你的产品模块名称生成的。默认情况下，你的产品模块名称与产品名称相同。然而，如果你的产品名称包含任何非字母数字字符（例如点
    `.`），它们在产品模块名称中会被替换为下划线 (`_`）。如果名称以数字开头，第一个数字将被替换为下划线。


    你也可以为产品模块名称提供自定义名称，Xcode 在命名桥接和生成的头文件时将使用它。这样做需要更改 `Product Module Name` 编译设置。


    ### 故障排除提示与提醒


    * 将你的 Swift 和 Objective-C 文件视为整体，并注意命名冲突。

    * 如果你正在处理框架，请确保 `Defines Module` 设置为 `Yes`。

    * 如果你正在处理 Objective-C 桥接头文件，请确保 `Swift Compiler - Code Generation` 下的 `Objective-C
    Bridging Header` 设置了相对于项目的头路径。路径必须直接指向文件，而不仅仅是它所在的目录。

    * Xcode 使用产品模块名称而非目标名称来命名 Objective-C 桥接头文件和 Swift 代码生成的头文件。有关产品模块的信息，请参阅命名你的产品模块。

    * 为了在 Objective-C 中访问和使用，Swift 类必须是 Objective-C 类的后代，或者标记为 `@objc`。

    * 当你将 Swift 代码引入 Objective-C 时，请记住 Objective-C 无法翻译某些 Swift 特有的功能。列表请参阅在 Objective-C
    中使用 Swift。

    * 如果你在 Swift 代码中使用了自定义 Objective-C 类型，请在将 Swift 生成的头文件导入 Objective-C `.m` 文件之前，先导入这些类型的
    Objective-C 头文件。

    * 标记有 `private` 修饰符的 Swift 声明不会出现在生成的头文件中。除非这些声明也显式标记了 `@IBAction`、`@IBOutlet`
    或 `@objc`，否则它们不会暴露给 Objective-C。

    * 对于应用目标，如果应用目标具有 Objective-C 桥接头文件，则标记有 `internal` 修饰符的声明会出现在生成的头文件中。

