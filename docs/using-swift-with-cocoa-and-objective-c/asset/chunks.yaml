    An Objective-C selector is a type that refers to the name of an Objective-C method.
    In Swift, Objective-C selectors are represented by the `Selector` structure. You
    can construct a selector with a string literal, such as `let mySelector: Selector
    = "tappedButton:"`. Because string literals can be automatically converted to
    selectors, you can pass a string literal to any method that accepts a selector.


