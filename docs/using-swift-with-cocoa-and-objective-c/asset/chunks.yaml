    ### Dictionaries


    In addition to arrays, Swift also automatically bridges between the `Dictionary`
    type and the `NSDictionary` class. When you bridge from an `NSDictionary` object
    to a Swift dictionary, the resulting dictionary is of type `[NSObject: AnyObject]`.
    You can bridge any `NSDictionary` object to a Swift dictionary because all Objective-C
    objects are `AnyObject` compatible. Recall that an object is `AnyObject` compatible
    if it is an instance of an Objective-C or Swift class, or if it can be bridged
    to one. All `NSDictionary` objects can be bridged to Swift dictionaries, so the
    Swift compiler replaces the `NSDictionary` class with `[NSObject: AnyObject]`
    when it imports Objective-C APIs. Likewise, when you use a Swift class or protocol
    in Objective-C code, the importer remaps Objective-C compatible Swift dictionaries
    as `NSDictionary` objects.


    After you bridge from an `NSDictionary` object to a Swift dictionary, you can
    also *downcast* the dictionary to a more specific type. Just as with downcasting
    a Swift array, downcasting a Swift dictionary is not guaranteed to succeed. The
    result of a downcast of `[NSObject: AnyObject]` to a more specific type is an
    optional value.


    When you cast in the reverse direction—from a Swift dictionary to an `NSDictionary`
    object—the keys and values must be instances of a class or bridgeable to an instance
    of a class.


    You can also create an `NSDictionary` object directly from a Swift dictionary
    literal, following the same bridging rules outlined above. When you explicitly
    type a constant or variable as an `NSDictionary` object and assign it a dictionary
    literal, Swift creates an `NSDictionary` object instead of a Swift dictionary.


