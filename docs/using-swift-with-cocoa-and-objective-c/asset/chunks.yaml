  trans: "\n\n### 本地化\n\n在 Objective-C 中，你通常使用 `NSLocalizedString` 系列宏来对字符串本地化。这组宏包含了\
    \ `NSLocalizedString`、`NSLocalizedStringFromTable`、`NSLocalizedStringFromTableInBundle`\
    \ 和 `NSLocalizedStringWithDefaultValue`。在 Swift 中，你可以使用单个函数来提供与整组 `NSLocalizedString`\
    \ 宏相同的功能——`NSLocalizedString(key:tableName:bundle:value:comment:)`。`NSLocalizedString`\
    \ 函数为 `tableName`、`bundle` 和 `value` 参数提供了默认值。像使用它所替换的宏一样使用它即可。\n\n### 数字\n\n\
    Swift 自动将某些原生数字类型（如 `Int` 和 `Float`）桥接到 `NSNumber`。这种桥接允许你从这些类型之一创建一个 `NSNumber`：\n\
    \nSwift\n```\nlet n = 42\nlet m: NSNumber = n\n```\n\n它还允许你将 `Int` 类型的值传递给期望 `NSNumber`\
    \ 的参数（例如）。请注意，由于 `NSNumber` 可以包含多种不同的类型，因此你不能将其传递给期望 `Int` 值的对象。\n\n以下所有类型都会自动桥接到\
    \ `NSNumber`：\n\n* `Int`\n* `UInt`\n* `Float`\n* `Double`\n* `Bool`\n\n### 集合类\n\
    \nSwift 自动将 `NSArray` 和 `NSDictionary` 类桥接为它们的原生 Swift 等价类型。这意味着你可以利用 Swift 强大的算法和自然的语法来处理集合——并交替使用\
    \ Foundation 和 Swift 集合类型。\n\n### 数组\n\nSwift 自动在 `Array` 类型和 `NSArray` 类之间进行桥接。当你从\
    \ `NSArray` 对象桥接到 Swift 数组时，生成的数组类型为 `[AnyObject]`。如果一个对象是 Objective-C 或 Swift\
    \ 类的实例，或者该对象可以桥接为类，则该对象是兼容 `AnyObject` 的。你可以将任何 `NSArray` 对象桥接为 Swift 数组，因为所有\
    \ Objective-C 对象都与 `AnyObject` 。由于所有 `NSArray` 对象都可以桥接到 Swift 数组，Swift 编译器在导入\
    \ Objective-C API 时，会将 `NSArray` 类替换为 `[AnyObject]`。\n\n在将 `NSArray` 对象桥接到 Swift\
    \ 数组之后，你还可以将数组向下转换（downcast）为更具体的类型。与从 `NSArray` 类转换到 `[AnyObject]` 类型不同，从 `AnyObject`\
    \ 向更具体类型的向下转换并不保证能成功。在运行时之前，编译器无法确定数组中的所有元素是否都能向下转换到你指定的类型。因此，从 `[AnyObject]`\
    \ 到 `[SomeType]` 的向下转换返回一个可选值（optional value）。例如，如果你知道一个 Swift 数组仅包含 `UIView`\
    \ 类的实例（或 `UIView` 类的子类），你可以将 `AnyObject` 类型元素的数组向下转换为 `UIView` 对象的数组。如果 Swift\
    \ 数组中的任何元素在运行时实际上不是 `UIView` 对象，则转换将返回 `nil`。\n\nSwift\n```\nlet swiftArray =\
    \ foundationArray as [AnyObject]\nif let downcastedSwiftArray = swiftArray as?\
    \ [UIView] {\n    // downcastedSwiftArray 仅包含 UIView 对象\n}\n```\n\n你还可以在 `for`\
    \ 循环中直接从 `NSArray` 对象向下转换为具有特定类型的 Swift 数组：\n\n```swift\nfor aView in foundationArray\
    \ as [UIView] {\n    // aView 的类型为 UIView\n}\n```\n\n当你从 Swift 数组桥接到 `NSArray`\
    \ 对象时，Swift 数组中的元素必须兼容 `AnyObject`。例如，类型为 `[Int]` 的 Swift 数组包含 `Int` 结构体元素。`Int`\
    \ 类型不是类的实例，但由于 `Int` 类型桥接到了 `NSNumber` 类，因此 `Int` 类型兼容 `AnyObject`。因此，你可以将类型为\
    \ `[Int]` 的 Swift 数组桥接为 `NSArray` 对象。如果 Swift 数组中的元素不兼容 `AnyObject`，则在桥接到 `NSArray`\
    \ 对象时会发生运行时错误。\n\n你还可以直接从 Swift 数组字面量创建 `NSArray` 对象，遵循上述概述的桥接规则。当你显式将常量或变量的类型指定为\
    \ `NSArray` 对象并赋值一个数组字面量时，Swift 会创建一个 `NSArray` 对象而不是 Swift 数组。\n\n```swift\n\
    let schoolSupplies: NSArray = [\"Pencil\", \"Eraser\", \"Notebook\"]\n// schoolSupplies\
    \ 是一个包含 NSString 对象的 NSArray 对象\n```\n\n在上面的示例中，Swift 数组字面量包含三个 `String` 字面量。由于\
    \ `String` 类型桥接到了 `NSString` 类，该字面量被桥接为 `NSArray` 对象，且对 `schoolSupplies` 的赋值成功。\n\
    \n当你在 Objective-C 代码中使用 Swift 类或协议时，导入器会将导入 API 中所有任何类型的 Swift 数组替换为 `NSArray`。如果你将\
    \ `NSArray` 对象传递给期望元素为不同类型的 Swift API，则会发生运行时错误。如果 Swift API 返回一个无法桥接到 `NSArray`\
    \ 的 Swift 数组，则会发生运行时错误。\n\n### 字典\n\n除了数组之外，Swift 还自动在 `Dictionary` 类型和 `NSDictionary`\
    \ 之间进行桥接。当你从 `NSDictionary` 对象桥接到 Swift 字典时，生成的字典类型为 `[AnyObject: AnyObject]`。如果一个对象是\
    \ Objective-C 或 Swift 类的实例，或者它可以桥接为类，则该对象是兼容 `AnyObject` 的。所有 `NSDictionary` 对象都可以桥接为\
    \ Swift 字典，因此 Swift 编译器在导入 Objective-C API 时，会将 `NSDictionary` 类替换为 `[AnyObject:\
    \ AnyObject]`。在将 `NSArray` 对象桥接到 Swift 字典之后，你还可以将字典向下转换为更具体的类型。与 Swift 数组一样，向下转换并不保证成功。从\
    \ `[AnyObject: AnyObject]` 到更具体类型的向下转换结果是一个可选值。例如，如果你知道一个 Swift 字典仅包含 `UIView`\
    \ 类的实例，你可以将 `AnyObject` 类型元素的字典向下转换为 `UIView` 对象的字典。如果 Swift 字典中的任何元素在运行时实际上不是\
    \ `UIView` 对象，则转换将返回 `nil`。\n\n你还可以直接从 Swift 字典字面量创建 `NSArray` 对象，遵循上述概述的桥接规则。当你显式将常量或变量的类型指定为\
    \ `NSArray` 对象并赋值一个字典字面量时，Swift 会创建一个 `NSArray` 对象而不是 Swift 字典。\n\n### Foundation\
    \ 数据类型\n\nSwift 为与 Foundation 框架中定义的数据类型提供了方便的覆盖层。使用此覆盖层处理 `NSSize` 和 `NSPoint`\
    \ 等类型时，可以使用与 Swift 语言其他部分自然且统一的语法。例如，你可以使用这种语法创建一个 `NSSize` 结构体：\n\n```swift\n\
    let size = NSSize(width: 20, height: 40)\n```\n\n覆盖层还让你以自然的方式在结构体上调用 Foundation\
    \ 函数。\n\n```swift\nlet rect = CGRect(x: 50, y: 50, width: 100, height: 100)\n\
    let width = rect.width // 等于 CGRectGetWidth(rect)\nlet maxX = rect.maxY // 等于\
    \ CGRectGetMaxY(rect)\n```\n\nSwift 将 `NSUInteger` 和 `NSInteger` 桥接为 `Int`。这两个类型在\
    \ Foundation API 中都变为 `Int`。为了一致，Swift 中尽可能使用 `Int`，但如果你需要无符号整数类型，可以使用 `UInt`\
    \ 类型。\n\n### Foundation 函数\n\n`NSLog` 在 Swift 中可用，用于向系统控制台日志。你使用与在 Objective-C\
    \ 中相同的格式化语法。\n\n```swift\nNSLog(\"%.7f\", pi) // 向控制台打印 \"3.1415927\"\n```\n\n"
- fmt: "\nSwift also has print functions like `print` and `println` available. These\
    \ functions are simple, powerful, and versatile due to Swift’s string interpolation.\
    \ They don’t print to the system console but are available for general printing\
    \ needs.\n\n`NSAssert` functions do not carry over to Swift. Instead, use the\
    \ `assert` function.\n\n## Core Foundation\n\nCore Foundation types are automatically\
    \ imported as full-fledged Swift classes. Wherever memory management annotations\
    \ have been provided, Swift automatically manages the memory of Core Foundation\
    \ objects, including Core Foundation objects that you instantiate yourself. In\
    \ Swift, you can use each pair of toll-free bridged Foundation and Core Foundation\
    \ types interchangeably. You can also bridge some toll-free bridged Core Foundation\
    \ types to Swift standard library types if you cast to a bridging Foundation type\
    \ first.\n\n## Remapped Types\n\nWhen Swift imports Core Foundation types, the\
    \ compiler remaps the names of these types. The compiler removes `Ref` from the\
    \ end of each type name because all Swift classes are reference types, therefore\
    \ the suffix is redundant.\n\nThe Core Foundation `CFTypeRef` type completely\
    \ remaps to the `AnyObject` type. Wherever you would use `CFTypeRef`, you should\
    \ now use `AnyObject` in your code.\n\n## Memory Managed Objects\n\nCore Foundation\
    \ objects returned from annotated APIs are automatically memory managed in Swift—you\
    \ do not need to invoke the `CFRetain`, `CFRelease`, or `CFAutorelease` functions\
    \ yourself. If you return Core Foundation objects from your own C functions and\
    \ Objective-C methods, annotate them with either `CF_RETURNS_RETAINED` or `CF_RETURNS_NOT_RETAINED`.\
    \ The compiler automatically inserts memory management calls when it compiles\
    \ Swift code that invokes these APIs. If you use only annotated APIs that do not\
    \ indirectly return Core Foundation objects, you can skip the rest of this section.\
    \ Otherwise, continue on to learn about working with unmanaged Core Foundation\
    \ objects.\n\n## Unmanaged Objects\n\nWhen Swift imports APIs that have not been\
    \ annotated, the compiler cannot automatically memory manage the returned Core\
    \ Foundation objects. Swift wraps these returned Core Foundation objects in an\
    \ `Unmanaged<T>` structure. All indirectly returned Core Foundation objects are\
    \ unmanaged as well. For example, here’s an unannotated C function:\n\nObjective-C\n\
    ```\nCFStringRef StringByAddingTwoStrings(CFStringRef string1, CFStringRef string2)\n\
    ```\n\nAnd here’s how Swift imports it:\n\nSwift\n```\nfunc StringByAddingTwoStrings(CFString!,\
    \ CFString!) -> Unmanaged<CFString>!\n```\n\nWhen you receive an unmanaged object\
    \ from an unannotated API, you should immediately convert it to a memory managed\
    \ object before you work with it. That way, Swift can handle memory management\
    \ for you. The `Unmanaged<T>` structure provides two methods to convert an unmanaged\
    \ object to a memory managed object—`takeUnretainedValue()` and `takeRetainedValue()`.\
    \ Both of these methods return the original, unwrapped type of the object. You\
    \ choose which method to use based on whether the API you are invoking returns\
    \ an unretained or retained object.\n\nFor example, suppose the C function above\
    \ does not retain the `CFString` object before returning it. To start using the\
    \ object, you use the `takeUnretainedValue()` function.\n\nSwift\n```\nlet memoryManagedResult\
    \ = StringByAddingTwoStrings(str1, str2).takeUnretainedValue()\n// memoryManagedResult\
    \ is a memory managed CFString\n```\n\nYou can also invoke the `retain()`, `release()`,\
    \ and `autorelease()` methods on unmanaged objects, but this approach is not recommended.\n\
    \n## Adopting Cocoa Design Patterns\n\nOne aid in writing well-designed, resilient\
    \ apps is to use Cocoa’s established design patterns. Many of these patterns rely\
    \ on classes defined in Objective-C. Because of Swift’s interoperability with\
    \ Objective-C, you can take advantage of these common patterns in your Swift code.\
    \ In many cases, you can use Swift language features to extend or simplify existing\
    \ Cocoa patterns, making them more powerful and easier to use.\n\n### Delegation\n\
    \nIn both Swift and Objective-C, delegation is often expressed with a protocol\
    \ that defines the interaction and a conforming delegate property. Just as in\
    \ Objective-C, before you send a message that a delegate may not respond to, you\
    \ ask the delegate whether it responds to the selector. In Swift, you can use\
    \ optional chaining to invoke an optional protocol method on a possibly `nil`\
    \ object and unwrap the possible result using `if-let` syntax. The code listing\
    \ below illustrates the following process:\n\n1. Check that `myDelegate` is not\
    \ `nil`.\n2. Check that `myDelegate` implements the method `window:willUseFullScreenContentSize:`.\n\
    3. If 1 and 2 hold true, invoke the method and assign the result of the method\
    \ to the value named `fullScreenSize`.\n4. Print the return value of the method.\n\
    \nSwift\n```\nclass MyDelegate: NSObject, NSWindowDelegate {\n    func window(_\
    \ window: NSWindow, willUseFullScreenContentSize proposedSize: NSSize) -> NSSize\
    \ {\n        return proposedSize\n    }\n}\nvar myDelegate: NSWindowDelegate?\
    \ = MyDelegate()\nif let fullScreenSize = myDelegate?.window?(myWindow, willUseFullScreenContentSize:\
    \ mySize) {\n    println(NSStringFromSize(fullScreenSize))\n}\n```\n\n### Error\
    \ Reporting\n\nError reporting in Swift follows the same pattern it does in Objective-C,\
    \ with the added benefit of optional return values. In the simplest case, you\
    \ return a `Bool` value from the function to indicate whether it succeeded. When\
    \ you need to report the error, you can add to the function an `NSError` out parameter.\
    \ Use the `&` operator to pass a reference to an `NSError` object as shown below.\n\
    \nSwift\n```swift\nvar writeError: NSError?\nlet written = myString.writeToFile(path,\
    \ atomically: false, encoding: NSUTFStringEncoding, error: &writeError)\nif !written\
    \ {\n    if let error = writeError {\n        println(\"write failure: \\(error.localizedDescription)\"\
    )\n    }\n}\n```\n\nWhen you implement your own functions that need to configure\
    \ an `NSError` object, you set the `NSErrorPointer` object’s `memory` property\
    \ to an `NSError` object you create. Make sure you check that the caller passed\
    \ a non-nil `NSErrorPointer` first:\n\nSwift\n```swift\nfunc contentsFor(typeName:\
    \ String!, error: NSErrorPointer) -> AnyObject! {\n    if cannotProduceContentsFor(typeName)\
    \ {\n        if error {\n            error.memory = NSError(domain: domain, code:\
    \ code, userInfo: [:])\n        }\n        return nil\n    }\n    // ...\n}\n\
    ```\n\n### Key-Value Observing\n\nKey-value observing is a mechanism that allows\
    \ objects to be notified of changes to specified properties of other objects.\
    \ You can use key-value observing with a Swift class, as long as the class inherits\
    \ from the `NSObject` class. You can use these three steps to implement key-value\
    \ observing in Swift.\n\n1. Add the `dynamic` modifier to any property you want\
    \ to observe. For more information on `dynamic`, see [Requiring Dynamic Dispatch](#InteractingWithObjective-CAPIs.xhtml_TP40014216-CH4-XID_38).\n\
    \nSwift\n```swift\nclass MyObjectToObserve: NSObject {\n    dynamic var myDate\
    \ = NSDate()\n    func updateDate() {\n        myDate = NSDate()\n    }\n}\n```\n\
    \n2. Create a global context variable.\n\nSwift\n```swift\nprivate var myContext\
    \ = 0\n```\n"
