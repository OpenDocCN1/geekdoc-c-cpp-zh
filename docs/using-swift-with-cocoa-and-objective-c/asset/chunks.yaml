  trans: "\n\n*   `takesAPointer([1.0, 2.0, 3.0])`\n\n当一个函数声明为接收 `UnsafePointer<Void>`\
    \ 参数时，它可以接受与针对任何类型 `Type` 的 `UnsafePointer<Type>` 相同的操作数。\n\n如果你声明了类似下面这样的函数：\n\
    \n```swift\nfunc takesAVoidPointer(x: UnsafePointer<Void>) { /* ... */ }\n```\n\
    \n你可以通过以下任何一种方式调用它：\n\n```swift\nvar x: Float = 0.0, y: Int = 0\nvar p: UnsafePointer<Float>\
    \ = nil, q: UnsafePointer<Int> = nil\ntakesAVoidPointer(nil)\ntakesAVoidPointer(p)\n\
    takesAVoidPointer(q)\ntakesAVoidPointer(&x)\ntakesAVoidPointer(&y)\ntakesAVoidPointer([1.0,\
    \ 2.0, 3.0] as [Float])\nlet intArray = [1, 2, 3]\ntakesAVoidPointer(intArray)\n\
    ```\n\n### 可变指针 (Mutable Pointers)\n\n当一个函数声明为接收 `UnsafeMutablePointer<Type>`\
    \ 参数时，它可以接受以下任何一个项：\n\n*   `nil`，作为空指针传递\n*   一个 `UnsafeMutablePointer<Type>`\
    \ 值\n*   一个 `in-out` 表达式，其操作数是类型为 `Type` 的存储左值（lvalue），作为该左值的地址传递\n*   一个 `in-out`\
    \ `[Type]` 值，作为指向数组起始位置的指针传递，并在调用期间内扩展其生命周期\n\n如果你声明了类似下面这样的函数：\n\n```swift\n\
    func takesAMutablePointer(x: UnsafeMutablePointer<Float>) { /*...*/ }\n```\n\n\
    你可以通过以下任何一种方式调用它：\n\n```swift\nvar x: Float = 0.0\nvar p: UnsafeMutablePointer<Float>\
    \ = nil\nvar a: [Float] = [1.0, 2.0, 3.0]\ntakesAMutablePointer(nil)\ntakesAMutablePointer(p)\n\
    takesAMutablePointer(&x)\ntakesAMutablePointer(&a)\n```\n\n当一个函数声明为接收 `UnsafeMutablePointer<Void>`\
    \ 参数时，它可以接受与针对任何类型 `Type` 的 `UnsafeMutablePointer<Type>` 相同的操作数。\n\n如果你声明了类似下面这样的函数：\n\
    \n```swift\nfunc takesAMutableVoidPointer(x: UnsafeMutablePointer<Void>) { /*\
    \ ... */ }\n```\n\n你可以通过以下任何一种方式调用它：\n\n```swift\nvar x: Float = 0.0, y: Int =\
    \ 0\nvar p: UnsafeMutablePointer<Float> = nil, q: UnsafeMutablePointer<Int> =\
    \ nil\nvar a: [Float] = [1.0, 2.0, 3.0], b: [Int] = [1, 2, 3]\ntakesAMutableVoidPointer(nil)\n\
    takesAMutableVoidPointer(p)\ntakesAMutableVoidPointer(q)\ntakesAMutableVoidPointer(&x)\n\
    takesAMutableVoidPointer(&y)\ntakesAMutableVoidPointer(&a)\ntakesAMutableVoidPointer(&b)\n\
    ```\n\n### 自动释放指针 (Autoreleasing Pointers)\n\n当一个函数声明为接收 `AutoreleasingUnsafeMutablePointer<Type>`\
    \ 时，它可以接受以下任何一个项：\n\n*   `nil`，作为空指针传递\n*   一个 `AutoreleasingUnsafeMutablePointer<Type>`\
    \ 值\n*   一个 `in-out` 表达式，其操作数被原始拷贝到一个临时的非所有缓冲区（nonowning buffer）。该缓冲区的地址被传递给调用者，并在返回时，缓冲区中的值被加载、保留并重新赋值给操作数。\n\
    \n注意，此列表不包含数组。\n\n如果你声明了类似下面这样的函数：\n\n```swift\nfunc takesAnAutoreleasingPointer(x:\
    \ AutoreleasingUnsafeMutablePointer<NSDate?>) { /* ... */ }\n```\n\n你可以通过以下任何一种方式调用它：\n\
    \n```swift\nvar x: NSDate? = nil\nvar p: AutoreleasingUnsafeMutablePointer<NSDate?>\
    \ = nil\ntakesAnAutoreleasingPointer(nil)\ntakesAnAutoreleasingPointer(p)\ntakesAnAutoreleasingPointer(&x)\n\
    ```\n\n所指向的类型不会被桥接（bridged）。例如，`NSString **` 导入 Swift 时是 `AutoreleasingUnsafeMutablePointer<NSString?>`，而不是\
    \ `AutoreleasingUnsafeMutablePointer<String?>`。\n\n### 函数指针 (Function Pointers)\n\
    \nC 函数指针被导入 Swift 时为 `CFunctionPointer<Type>`，其中 `Type` 是一个 Swift 函数类型。例如，C 中类型为\
    \ `int (*)(void)` 的函数指针导入 Swift 中为 `CFunctionPointer<() -> Int32>`。\n\n### 全局常量\
    \ (Global Constants)\n\n在 C 和 Objective-C 源文件中定义的全局常量会被 Swift 编译器自动导入为 Swift 全局常量。\n\
    \n### 预处理器指令 (Preprocessor Directives)\n\nSwift 编译器不包含预处理器。相反，它利用编译时属性、构建配置和语言特性来实现相同的功能。\n\
    \n### 简单宏 (Simple Macros)\n\n在 C 和 Objective-C 中你通常使用 `#define` 来定义常量，而在 Swift\
    \ 中，你使用全局常量。例如，常量 `#define FADE_ANIMATION_DURATION 0.35` 在 Swift 中用 `let FADE_ANIMATION_DURATION\
    \ = 0.35` 表达更好。因为简单宏直接映射到 Swift 变量，编译器会自动导入在 C 和 Objective-C 中定义的简单宏。\n\n### 复杂宏\
    \ (Complex Macros)\n\n复杂宏在 C 和 Objective-C 中用于规避类型检查限制或避免重复大量的样板代码。然而，宏会让调试和重构变得困难。在\
    \ Swift 中，你可以使用函数和泛型来实现相同的结果。因此，在 C 和 Objective-C 中的复杂宏不可供你的 Swift 代码使用。\n\n###\
    \ 构建配置 (Build Configurations)\n\nSwift 代码和 Objective-C 代码的条件编译方式不同。Swift 代码可以根据*构建配置*的评估进行条件编译。构建配置包括\
    \ `true` 和 `false` 字面量、命令行标志以及下表中的平台测试函数。你可以使用 `-D <flag>` 指定命令行标志。\n\n| 函数 |\
    \ 有效参数 |\n| --- | --- |\n| `os()` | `OS X`, `iOS` |\n| `arch()` | `x86_64`, `arm`,\
    \ `arm64`, `i386` |\n\n简单的条件编译语句采用如下形式：\n\n```swift\n#if build configuration\n\
    \ statements\n#else\n statements\n#endif\n```\n\n*statements* 由零或多个有效的 语句组成，包括表达式、语句和控制流语句。你可以使用\
    \ `&&` 和 `||` 运算符向条件编译语句添加额外的构建配置要求，使用 `!` 运算符反反构建配置，并使用 `#elseif` 添加条件块：\n\n\
    ```swift\n#if build configuration && !build configuration\n statements\n#elseif\
    \ build configuration\n statements\n#else\n statements\n#endif\n```\n\n与 C 预处理器的条件编译语句不同，Swift\
    \ 的条件编译语句必须完全围绕自包含且语法正确的代码块。这是因为所有 Swift 代码即使未编译也会进行语法检查。\n\n## 混合使用 (Mix and\
    \ Match)\n\n## 在同一项目中使用 Swift 和 Objective-C\n\n"
- fmt: '

    Swift’s compatibility with Objective-C lets you create a project that contains
    files written in either language. You can use this feature, called `mix and match`,
    to write apps that have a mixed-language codebase. Using mix and match, you can
    implement part of your app’s functionality using the latest Swift features and
    seamlessly incorporate it back into your existing Objective-C codebase.


    ## Mix and Match Overview


    Objective-C and Swift files can coexist in a single project, whether the project
    was originally an Objective-C or Swift project. You can simply add a file of the
    other language directly to an existing project. This natural workflow makes creating
    mixed-language app and framework targets as straightforward as creating an app
    or framework target written in a single language.


    The process for working with mixed-language targets differs slightly depending
    on whether you’re writing an app or a framework. The general import model for
    working with both languages within the same target is depicted below and described
    in more detail in the following sections.


    ![image: ../Art/DAG_2x.png](Art/DAG_2x.png)


    ## Importing Code from Within the Same App Target


    If you’re writing a mixed-language app, you may need to access your Objective-C
    code from Swift and your Swift code from Objective-C. The process described in
    this section applies to non-framework targets.


    ## Importing Objective-C into Swift


    To import a set of Objective-C files in the same app target as your Swift code,
    you rely on an `Objective-C bridging header` to expose those files to Swift. Xcode
    offers to create this header file when you add a Swift file to an existing Objective-C
    app, or an Objective-C file to an existing Swift app.


    ![image: ../Art/bridgingheader_2x.png](Art/bridgingheader_2x.png)


    If you accept, Xcode creates the header file along with the file you were creating,
    and names it by your product module name followed by adding `"-Bridging-Header.h"`.
    (You’ll learn more about the product module name later, in [Naming Your Product
    Module](#MixandMatch.xhtml_TP40014216-CH10-XID_87).)


    Alternatively, you can create a bridging header yourself by choosing `File > New
    > File > (iOS or OS X) > Source > Header File`.


    You’ll need to edit the bridging header file to expose your Objective-C code to
    your Swift code.


    ### To import Objective-C code into Swift from the same target


    1. In your Objective-C bridging header file, import every Objective-C header you
    want to expose to Swift. For example:


    Objective-C


    * `#import "XYZCustomCell.h"`

    * `#import "XYZCustomView.h"`

    * `#import "XYZCustomViewController.h"`


    2. Under `Build Settings`, make sure the `Objective-C Bridging Header` build setting
    under `Swift Compiler - Code Generation` has a path to the header.


    The path should be relative to your project, similar to the way your `Info.plist`
    path is specified in `Build Settings`. In most cases, you should not need to modify
    this setting.


    Any public Objective-C headers listed in this bridging header file will be visible
    to Swift. The Objective-C functionality will be available in any Swift file within
    that target automatically, without any import statements. Use your custom Objective-C
    code with the same Swift syntax you use with system classes.


    Swift


    * `let myCell = XYZCustomCell()`

    * `myCell.subtitle = "A custom cell"`


    ### Importing Swift into Objective-C


    When you import Swift code into Objective-C, you rely on an `Xcode-generated header`
    file to expose those files to Objective-C. This automatically generated file is
    an Objective-C header that declares the Swift interfaces in your target. It can
    be thought of as an umbrella header for your Swift code. The name of this header
    is your product module name followed by adding `"-Swift.h"`. (You’ll learn more
    about the product module name later, in [Naming Your Product Module](#MixandMatch.xhtml_TP40014216-CH10-XID_87).)


    By default, the generated header contains interfaces for Swift declarations marked
    with the `public` modifier. It also contains those marked with the `internal`
    modifier if your app target has an Objective-C bridging header. Declarations marked
    with the `private` modifier do not appear in the generated header. Private declarations
    are not exposed to Objective-C unless they are explicitly marked with `@IBAction`,
    `@IBOutlet`, or `@objc` as well. For more information on access-level modifiers,
    see Access Control in [The Swift Programming Language](itms-books://itunes.apple.com/us/book/the-swift-programming-language/id881256329?mt=11).


    You don’t need to do anything special to create the generated header file—just
    import it to use its contents in your Objective-C code. Note that the Swift interfaces
    in the generated header include references to all of the Objective-C types used
    in them. If you use your own Objective-C types in your Swift code, make sure to
    import the Objective-C headers for those types before importing the Swift generated
    header into the Objective-C `.m` file you want to access the Swift code from.


    ### To import Swift code into Objective-C from the same target


    * Import the Swift code from that target into any Objective-C `.m` file within
    that target using this syntax and substituting the appropriate name:


    Objective-C


    * `#import "ProductModuleName-Swift.h"`


    The Swift files in your target will be visible in Objective-C `.m` files containing
    this import statement. For information on using Swift from Objective-C code, see
    [Using Swift from Objective-C](#MixandMatch.xhtml_TP40014216-CH10-XID_86).


    | | Import into Swift | Import into Objective-C |

    | --- | --- | --- |

    | Swift code | No import statement | `#import "ProductModuleName-Swift.h"` |

    | Objective-C code | No import statement; Objective-C bridging header required
    | `#import "Header.h"` |


    ## Importing Code from Within the Same Framework Target


    If you’re writing a mixed-language framework, you may need to access your Objective-C
    code from Swift and your Swift code from Objective-C.


    ## Importing Objective-C into Swift


    To import a set of Objective-C files in the same framework target as your Swift
    code, you’ll need to import those files into the Objective-C umbrella header for
    the framework.


    ### To import Objective-C code into Swift from the same framework


    1. Under `Build Settings`, in `Packaging`, make sure the `Defines Module` setting
    for that framework target is set to Yes.


    2. In your umbrella header file, import every Objective-C header you want to expose
    to Swift. For example:


    Objective-C


    * `#import <XYZ/XYZCustomCell.h>`

    * `#import <XYZ/XYZCustomView.h>`

    * `#import <XYZ/XYZCustomViewController.h>`


    Swift will see every header you expose publicly in your umbrella header. The contents
    of the Objective-C files in that framework will be available in any Swift file
    within that framework target automatically, without any import statements. Use
    your custom Objective-C code with the same Swift syntax you use with system classes.


    Swift


    * `let myCell = XYZCustomCell()`

    * `myCell.subtitle = "A custom cell"`


    ### Importing Swift into Objective-C


    To import a set of Swift files in the same framework target as your Objective-C
    code, you don’t need to import anything into the umbrella header for the framework.
    Instead, import the Xcode-generated header file for your Swift code into any Objective-C
    `.m` file you want to use your Swift code from.

