  md: "# 9.7 main\n\nAs first shown in §1.1, a C program begins execution in a function\
    \ named main. Additionally, main serves as the “interface” between the “outside”\
    \ (typically, the operating system) and your program via arguments and its return\
    \ value.\n\n# 9.7.1 Declaration and Parameters\n\nIn addition to being declared\
    \ with no parameters, it may alternatively be declared with two specific parameters\
    \ for passing arguments to it from the “outside” (on Unix systems, another process,\
    \ typically a shell). For example, the program in listing 9.4, if executed from\
    \ a shell, will print each of its arguments, if preceded by its index as shown\
    \ in run 9.1.\n\n```\nint main(int argc, char const *const argv[]) {\n  for (int\
    \ i = 0; i < argc; ++i)\n    printf(\"%s\\n\", argv[i]);\n}\n```\n\nListing 9.4:\
    \ main with parameters that prints its arguments\n\n```\n$ -o args args.c\n./args\
    \ hello, world\n0 args\n1 hello,\n2 world\n```\n\nThe parameter argc is the argument\
    \ count and argv is an “array” of argument values where argv[0] is the executable’s\
    \ pathname, argv[1] is the first argument, argv[argc-1] is the last argument,\
    \ and argv[argc] is guaranteed to be nullptr. \n(You can name the parameters anything\
    \ you want, but “argc” and “argv” are conventional.)\n\n+   ■ On non-Unix systems,\
    \ it’s implementation defined as what the values of argv correspond to, if anything.\n\
    \nAlternatively, main may be declared as:\n\n```\nint main(int argc, char const\
    \ *const argv *)\n```\n\nThat is, argv may be declared as a pointer (which it\
