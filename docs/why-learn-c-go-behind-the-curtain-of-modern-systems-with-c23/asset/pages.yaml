  md: '# 1.10 Epilogue


    This concludes the tour of C covering the core of the language: variables, functions,
    constants, loops, pointers, strings, arrays, and structures. Using these features,
    it''s possible to build pretty anything from Apache to Zlib. The next chapters
    will fill in some features and details not covered in the tour.


    At this point, you may find that digging on topics such as memory, pointers, and
    dynamic memory management in the first chapter seems surprisingly low-level. Modern
    languages are generally designed so that you don''t need to think — or even —
    about how memory is organized or how data is stored in it. You are only supposed
    to write code that implements some semantics and such details are none of your
    business. In contrast, C''s perspective is that such details are your business.


    You may also be wondering why C is this. The answer is because reality is way.
    Ultimately, computers execute instructions, interpret sequences of bytes as particular
    types like int, and access data via pointers. C was designed to be “close to the
    machine” to work with details directly.


    Even modern languages often hide these details, they''re dealing with them nonetheless
    behind the curtain. Indeed, in order for them to do what they do, some have their
    components written in C. For example, you can''t implement the Java Virtual Machine
    (JVM) in Java because a Java program needs a JVM to run. Similarly, you can''t
    use the Python interpreter in Python.


    Consequently, you will eventually understand such details to do anything non-trivial
    in C. But fear not: the details aren''t complicated. You can take the


