    One thread-safe way to share data among threads is to ensure that all accesses
    are mutually exclusive meaning that only one thread is allowed access at a time
    — others must wait their turn. A Mutex (a portmanteau of “mutual exclusion”) is
    an object that is used to coordinate access.


    To access shared data, a thread first locks a mutex (“holds the lock”), then accesses
    the data, and unlocks the mutex. A mutex enables access to atomic (all meanings).
    One way to fix the bad example shown in listing 14.2 is by using a mutex as shown
    in listing 14.3.


