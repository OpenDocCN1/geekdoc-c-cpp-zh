    \ functions are implemented as shown in listing 17.8.\n\n```\nenum cas_result\
    \ {\n    CAS_EQUAL, CAS_NOT_EQUAL, CAS_SPURIOUS_FAILURE\n};\nenum cas_result cas_weak_impl(\
    \ A *pv, T *expected,\n    T want );\ninline bool atomic_compare_exchange_weak(\
    \ A *pv, T *expected,\n    T *expected,\n    T want ) {\n    return cas_weak_impl(pv,\
    \ expected, want) == CAS_EQUAL;\n}\nbool atomic_compare_exchange_strong( A *pv,\
    \ T *expected,\n    T want ) {\n    enum cas_result cr;\n    do {\n        cr\
    \ = cas_weak_impl(pv, expected, want);\n    } while (cr == CAS_SPURIOUS_FAILURE);\n\
    \    return cr == CAS_EQUAL;\n}\n```\n\nListing 17.8: Conceptual implementation\
