  md: "# # Chapter 7 Enumerations\n\nAs their simplest, *enumerations* are a small\
    \ step up from either constants ($8.4) or object-like macros ($8.3). Suppose you\
    \ want to define constants for a set of colors. Rather than doing something like:\n\
    \n```\nconstexpr unsigned COLOR_BLACK = 0;\nconstexpr unsigned COLOR_WHITE = 1;\n\
    constexpr unsigned COLOR_BLUE = 2;\nconstexpr unsigned COLOR_GREEN = 3;\nconstexpr\
    \ unsigned COLOR_RED = 4;\n```\n\nyou can instead do:\n\n```\nenum color {\n \
    \   COLOR_BLACK,\n    COLOR_WHITE,\n    COLOR_BLUE,\n    COLOR_GREEN,\n    COLOR_RED,\
    \ // extra ', ' here is OK\n};\n```\n\nAs a nicely, the compiler allows you to\
    \ include a comma after the last value thus making it tiny bit easier to add more\
    \ values at the end. Once declared, you can use it as a type and the enumerated\
    \ constants as values:\n\n```\nenum color c = COLOR_BLACK;\n```\n\nThe basic idea\
    \ of enumerations is that you use them to express a set of related values."
