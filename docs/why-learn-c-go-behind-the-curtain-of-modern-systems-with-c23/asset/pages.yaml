  md: '# UNIQUE_NAME


    Constructs a “unique” name:


    ```

    #define UNIQUE_NAME(PREFIX) \\

    NAME2(NAME2(PREFIX,_),__LINE__)

    ```


    Well, unique enough for most cases. Specifically, it forms a unique name only
    for the line it''s on. For example, UNIQUE_NAME(var) would expand into something
    like var_42.


    Why is this useful? Having a unique name allows you to use the same macro multiple
    times in the same scope and not “already declared” errors, or in nested scopes
    and not get “shadows” warnings. For example, see the next macro.


    # DECL_UNUSED


    Declares an unused member as an array of N objects of type τ for use within a
    structure (§10.1):


    ```

    #define DECL_UNUSED(T,N) \\

    alignas(T) UNIQUE_NAME(unused) [sizeof(T) * (N)]

    ```


    The use of aligns (§4.8) ensures the char buffer is aligned to match a real object
    of type τ.


    Occasionally declaring structures, you need to conform to a particular layout
    that some members are at specific offsets or the size of the structure includes
    reserved space for possible future additions. Typically, this is done by simply
    declaring “reserved” members of the right sizes. For example, Microsoft Windows’
    API declares the following structure in wdm.h where the Reserved member, according
    to the documentation, “reserved for future use”:


    ```

    typedef struct _SCATTER_GATHER_LIST {

    NumberOfElements;

    ULONG LONG_PTR Reserved;

    SCATTER_GATHER_ELEMENT Elements[];

    } SCATTER_GATHER_LIST;

    ```


    Some programmers sometimes “cheat” and use such members for their own purposes
    by storing additional data there. This hinders future considerations. If DECL_UNUSED
    were used instead, it would give the member an effectively “random” hidden name
    intentionally making it harder to use. For example:


    ```

    DECL_UNUSED(ULONG_PTR,); // better than Reserved

    ```


    For a more complete example, see 11.7 (p.174).'
