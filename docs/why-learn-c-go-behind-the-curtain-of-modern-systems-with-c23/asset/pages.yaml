    18 Debugging


    # 18.7 Warnings


    The best way to avoid debugging is not to put bugs into your programs in the first
    place. By default, most compilers automatically give some warnings, but not all.
    By enabling more warnings, the compiler can help you catch bugs before committing
    your code.


    +   - If warnings are so helpful, why aren''t they errors instead? Because sometimes
    you really want to do something and you know what you''re doing. Then why aren''t
    all warnings enabled by default? Because some warnings are pedantic; others are
    considered pedantic by some grammers. Recall that part of C''s philosophy includes
    "trust the programmer," hence many warnings are disabled by default, but are available
    and can be enabled if desired.


    # 18.7.1 Recommended Warnings


    In the warnings that follow, not all are supported by all compilers. They''re
    a union of those supported by both gcc and we. Warnings are specified via build
    tools, not manually on the command-line. During an initial "configure" step, the
    compiler is probed to see which command-line options it accepts. Microsoft C has
    equivalent warnings, but they''re specified by number, e.g., C4018.


    +   - Wall

    Enables "all" warnings that many users think are a good idea. (You enable this.)


    +   - Cast-align

    Warn when a pointer is cast to a type that has a stricter alignment. For example,
    warn a char* is cast to an int* on CPUs where integers must be aligned ($S3.17)
    only on two- or four-byte boundaries.


    +   - Comma

    Warn about possible misuses of the comma operator ($3.15). For example, although
    it''s legal to combine multiple expressions into a single statement using the
    comma operator:


    ```

    x = -1, y = 0;              // same as: x = -1; y = 0;

    ```


    it''s a bad practice because it''s confusing to many programmers. The only exceptions
    are either the init-expr or the next-expr in for loop ($5.6).


    +   - Conditional-uninitialized

    Warn when a variable is uninitialized when used on a certain code path as shown
    in listing 18.4 (p.271) if y_max were not initialized.'
