    \ to \"continue\"\n    // ...\nnext:\n}\n```\n\n# 5.8 switch\n\nA switch statement\
    \ is a multi-way if and is of the form:\n\n```\nswitch ( cond-expr ) {\n    case\
    \ const-expr:\n        statement\n    case const-expr:\n        statement\n  \
    \  // ...\n    default: // optional\n        statement\n}\n```\n\nA switch works\
    \ as follows:\n\n+   1. The cond-expr is evaluated.\n2. Its value is then compared\
    \ against a const-expr.\n\n+   * If it matches, the statements following the const-expr\
    \ are executed.\n* Otherwise, if there is another const-expr, the value is compared\
    \ against in turn.\n\nThe order in which the cases is tried is unspecified. It\
    \ doesn't necessarily match the order in which the cases are declared. (The order\
    \ shouldn't matter; if it, use an if-else chain instead.)\n\n+   3. If no const-expr\
    \ matches:\n\n+   * If there is a default case, the statements following it are\
    \ executed.\n* Otherwise, the control flow “falls out the bottom” of the switch\
    \ without executing any statements.\n\nNote that a default case needs not be last.\n\
