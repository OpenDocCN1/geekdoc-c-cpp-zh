  md: "# 7.1 Declarations\n\nFormally, an enumeration declaration is of the form:\n\
    \n```\nenum tag_opt {\n  enum_constants_opt\n  declarations_opt;\n}\n```\n\nthat\
    \ is the keyword enum optionally followed by a tag name followed by a set of one\
    \ or more enumeration constants between {}; optionally followed by declarations\
    \ of the enumeration. An enumeration constant is at minimum some identifier.\n\
    In C, the names of enumerations, structures (§10), and unions (§11) are collected\
    \ put into a tags namespace (§2.3). To refer to an enumeration name, it must be\
    \ preceded by enum:\n\n```\nenum color c;\n```\n\nIf you forget to include it,\
    \ you'll get an error:\n\n```\ncolor c; // error: must use \"enum\" tag\n```\n\
