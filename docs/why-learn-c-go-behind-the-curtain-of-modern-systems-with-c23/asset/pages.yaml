  md: '# 2.5 Built-In Types


    ```

    unsigned _BitInt(24) rgb24; // 24-bit RGB color

    unsigned _BitInt(256) sha256; // SHA-256

    ```


    The rules for _BitInt are:


    +   - It may be signed (the default) or unsigned.

    - If signed, $n$ includes the sign bit.

    - Values are limited to the number of bits, $n$. For unsigned, values are modulo
    $n:


    ```

    unsigned _BitInt(3) x = 7; // x = 0, not b

    ```


    Without _BitInt, values would have to be constrained manually by masking (§3.8)
    that you could forget to:


    ```

    unsigned x = 7;

    x = (x + 1) & 0b11; // same, but more verbose

    ```


    +   - The maximum bits for $n$ is at least as many as for unsigned long.

    - _BitInt types do not participate in integer promotions (§2.13 #3, p.43).


    _BitInt is also useful for bit-fields (§10.7).


    Literals for _BitInt are the same as for integers (§2.5.4) except instead have
    the unsigned suffixes or wb for signed types and uwb or UWB for unsigned types.


    # 2.5.6 float, double, and long double


    The types float, double, and long double are for storing floating-point values.


    > > Obviously, "float" comes from storing floating-point values. Perhaps less
    obviously, "double" comes from storing floating-point values with double the precision
    of float. The term "double precision" dates back to Fortran in the mid-1960s (as
    "single precision")


    Back then, when computers were a lot slower and memory a lot more expensive, single
    precision was the default since it was faster and half the storage of double precision.
    However, some calculations required extra precision despite the performance and
    storage penalties, hence double precision. You used single precision by default
    unless you needed double precision. The vs double precision distinction has pervaded
    most every programming language since, including C.


    These days, when performance is much better and memory is much cheaper, the situation
    has largely reversed that you generally use double by default unless you have
    storage constraints in which case you should float.'
