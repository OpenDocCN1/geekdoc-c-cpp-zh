    # 3.4 Increment and Decrement Operators


    As first shown in §1.3, ++ and -- are the increment and decrement operators, respectively.
    They may be applied to integer (§2.5), enumeration (§7), or pointer (§6.7) types.

    Both operators have pre- (e.g., --i) and post- form (e.g., i++). The pre-form
    returns the new value after the operation whereas the post-form returns the old
    value before the operation. Neither is more efficient than the other, use whichever
    is needed in a particular case or preference.

    Note that if these operators are used on the same variable more than once in the
    same expression, the result is even worse than implementation defined — it''s
    undefined behavior (§15):


