  md: "# 2.3 Namespaces\n\nC also has a set of predefined namespaces: names in one\
    \ namespace are distinct from names all other namespaces.\n\n+   - Aside from\
    \ names in different namespaces being distinct, namespaces in C are nothing like\
    \ namespaces in C++. Their standards both happen to use the term \"namespaces.\"\
    \ In C++, namespaces are explicitly named, e.g., std., you can create your own,\
    \ and you explicitly put names into them. In C, namespaces have no name (ironically),\
    \ are fixed, i.e., you can't create your own, and are implicitly put into them\
    \ based on the kind of name and context of its declaration.\n\nC++ has all of\
    \ C's namespaces as well; it's just that the C++ standard doesn't call them \"\
    namespaces\" or anything.\n\nThe fixed namespaces in C are:\n\n+   - **Attribute**:\
    \ For attribute names (§4.9). Every attribute prefix also has its own namespace.\n\
    - **Member**: Every structure (§10) or union (§11) creates a namespace for all\
    \ of its members.\n- **Label**: For goto labels (§5.10).\n- **Tag**: For enumeration\
    \ names (§7), structure, and union names.\n- **Ordinary**: For enumeration: everything\
    \ else: variable names, constant names (§4.4), function names (§9), typedef names\
