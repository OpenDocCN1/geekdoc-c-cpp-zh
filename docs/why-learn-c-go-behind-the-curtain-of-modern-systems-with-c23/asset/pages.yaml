  md: '# Chapter 2

    Comments, Names, and Types


    Like many other programming languages, C is a typed language having distinct types
    for Boolean, character, integer, and floating-point numbers. Since C was designed
    to be “close to the machine,” it has many variations of its types to suit particular
    situations. There are many detailed rules for conversions among types and also
    many ways to express literals for types.


    Consequently, but necessarily, this chapter has a high information density. It’s
    therefore recommended to skim it and refer back to it when necessary.


    # 2.1 Comments


    As first shown in listing 1.1 (p.6), there are two ways to include comments in
    C:


    +   - Between /* and * / that may span multiple lines. Such comments cannot nest
    (but see $8.5).

    - After // that spans until the end of the line.


    Here’s some advice for writing comments:


    +   - Don’t comment what the code already says, for example:


    ```

    ++i;                                // increment ''i''

    ```


    Such comments are pointless as best. Instead, say why something is being done:


    ```

    ++i;                                // ensure room for null character

    ```


    +   - For files as a whole, include a comment stating what the purpose of the
    declaration contained within it have in common:


    ```

    // Declares a string type that grows when necessary

    // and functions for manipulating such strings.

    ```'
