  md: '# 18.5 Signals


    read by debuggers so you can see exactly where a program crashed (file and line),
    go up the call stack, and print the values of variables or memory.


    +   The core dump comes from magnetic-core memory, aka, core, the leading type
    of RAM until the 1970s. A core is a very small (.5mm) ferrite ring that, with
    the direction of an induced magnetic field, stored either a 0 or 1. Here, a core
    dump was literally a dump of the state of core memory. Even though core memory
    has long since been obsolete, the term core dump persists.


    On Microsoft Windows, the equivalent is a minidump, a file ending with a .dump
    extension.


    # 18.5 Signals


    On Unix systems, when errors occur during the execution of a program, the operating
    system sends the program a signal interrupting it. (Signals are assigned integers
    and are defined in the signal.h standard header.) Some signals trigger a core
    dump by default. The ones you''re most likely to encounter are:


    +   SIGABRT (abort): Caused either because a program explicitly called abort or
    was called by a violated assert ($16)


    +   SIGBUS (error): A bus is a communication system among components of a computer.
    A bus is the bus between the CPUs and main memory. Some CPUs can access memory
    types ($2.5) only at addresses that are suitably aligned ($4.8).


    > A bus error occurs when an attempt is made to access either a nonexistent memory
    address or a type via an unaligned address.


    +   SIGILL (illegal instruction): At the lowest level, a program is a sequence
    of bytes where each corresponds to a CPU opcode is a CPU instruction. (For example,
    on an x86-64 CPU, c6 is the opcode for the 8-bit mov instruction.) When a CPU
    is executing a program, it reads a value for an opcode, executes it. Afterwards,
    it proceeds to the next byte in memory to read the next opcode.


    > An illegal instruction error occurs when a CPU reads a value that doesn''t correspond
    to an opcode. This can happen if a program calls a function via pointer ($6.10),
    but the pointer points to somewhere in memory that doesn''t contain opcodes.


    +   SIGSEGV (segmentation violation, aka, “segmentation fault” or “seg-fault”):
    A segmentation fault occurs when a program attempts to access a memory address
    that it doesn''t have permission to access.'
