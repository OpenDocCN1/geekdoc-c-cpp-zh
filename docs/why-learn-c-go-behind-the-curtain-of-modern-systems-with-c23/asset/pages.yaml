  md: '# Preface


    # “Should I still learn C?”


    That’s a question I see asked by many beginning (and some intermediate) programmers.
    Since you''re reading this preface, perhaps you have the same question. Considering
    that C was created in 1972 and that many more modern languages have been created
    since, it’s a fair question.


    Somewhat obviously (since this book exists), I believe the answer is “Yes.” Why
    A few reasons:


    +   Modern languages have many features for things like data structures (e.g.,
    dynamic arrays, lists, maps), flow control (dynamic dispatch, exceptions), and
    algorithms (counting, iteration, searching, sorting) as part of the language (either
    built-in or readily available via their standard libraries). Convenient, the way
    in which these features are implemented “behind the curtain” has to be done in
    a general way to be applicable to a wide variety of programs. Most of the time,
    they work just fine. However, occasionally, they don’t.


    +   C is a fairly minimal language and has almost none of those features. If you
    want any of them, you’re likely going to have to implement them yourself. While
    onerous, you’ll be able to tailor your implementations to your circunstancias.
    Knowledge of how to implement such features from scratch and understanding the
    trade-offs will serve you well when programming in other languages because you’ll
    have insight into how their features are implemented.


    +   Many systems and some scripting languages (e.g., Python) provide C APIs for
    implementing extensions. If you want to write your own, you’ll need to know C.


    +   Many open-source software packages upon which modern computers and the Internet
    are still written in C (Apache, cURL, Exim, Git, the GNU compiler collection,
    Linux, OpenSSL, Postfix, PostgreSQL, Python, Sendmail, Wireshark, Zlib, and many
    others). If you ever want to understand how those work or contribute to them,
    you’ll need to know C.'
